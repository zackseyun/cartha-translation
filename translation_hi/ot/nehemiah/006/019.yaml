  text: Also they kept speaking of his good deeds in my presence[a], and they kept reporting my words to him[b]. Tobiah sent letters to frighten me.
translation:
  language: hi
  text: वे मेरे सामने उसके अच्छे कामों की चर्चा भी करते रहते थे[a], और मेरी बातें उसे बताते रहते थे[b]। तोबियाह ने मुझे डराने के लिए चिट्ठियाँ भेजीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसकी अच्छी बातों” अथवा “उसके अच्छे गुणों की”; इब्रानी अभिव्यक्ति केवल कामों से अधिक व्यापक है, पर यहाँ आशय नहेम्याह के सामने तोबियाह की प्रशंसा करने से है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “मेरी बातें उसके पास बाहर ले जाते थे”; यह नहेम्याह की बातें तोबियाह तक पहुँचाने के अर्थ में प्रयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: भी
  rationale: यह पिछले वर्णन में एक और बात जोड़ता है; हिन्दी में ‘भी’ इसका स्वाभाविक additive बल व्यक्त करता है।
- source_word: טוֹבֹתָיו
  choice: उसके अच्छे कामों
  rationale: बहुवचन substantival ‘अच्छी बातें/भलाई’ यहाँ तोबियाह के पक्ष में की जाने वाली प्रशंसा को दर्शाता है; ‘अच्छे काम’ स्वाभाविक है, जबकि व्यापक अर्थ को पादटिप्पणी में रखा गया है।
- source_word: הָיוּ אֹמְרִים
  choice: चर्चा ... करते रहते थे
  rationale: היה और कृदंत का संयोजन अतीत में जारी या बार-बार होने वाली क्रिया बताता है; ‘करते रहते थे’ इस पहलू को स्पष्ट करता है।
- source_word: לְפָנַי
  choice: मेरे सामने
  rationale: इब्रानी का सीधा और स्वाभाविक हिन्दी समतुल्य, जो नहेम्याह की उपस्थिति में कही गई बात को दर्शाता है।
- source_word: וּדְבָרַי
  choice: मेरी बातें
  rationale: דבר का अर्थ ‘शब्द’ या ‘बात’ हो सकता है; इस प्रसंग में नहेम्याह की कही हुई बातें अभिप्रेत हैं।
- source_word: הָיוּ מוֹצִיאִים לוֹ
  choice: उसे बताते रहते थे
  rationale: शाब्दिक रूप से ‘उसके लिए बाहर ले जाते थे’; प्रसंग में अर्थ सूचना पहुँचाने या कही हुई बातें बताने का है।
- source_word: אִגְּרוֹת
  choice: चिट्ठियाँ
  rationale: पत्राचार के लिए सहज, सामान्य आधुनिक हिन्दी शब्द।
- source_word: שָׁלַח
  choice: भेजता था
  rationale: क्रिया का सामान्य अर्थ ‘भेजना’ है; प्रसंग और अगली उद्देश्यवाचक रचना के साथ हिन्दी में यह बार-बार भेजे जाने का स्वाभाविक बोध देता है।
- source_word: לְיָרְאֵנִי
  choice: मुझे डराने के लिए
  rationale: लामेद उद्देश्य को और क्रियारूप भय उत्पन्न कराने को व्यक्त करता है; यह हिन्दी में संक्षिप्त और स्पष्ट है।
