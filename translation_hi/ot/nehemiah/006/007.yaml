language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/גַם נְבִיאִ֡ים הֶעֱמַ֣דְתָּ לִ/קְרֹא֩ עָלֶ֨י/ךָ בִֽ/ירוּשָׁלִַ֜ם לֵ/אמֹ֗ר מֶ֚לֶךְ בִּֽ/יהוּדָ֔ה וְ/עַתָּה֙ יִשָּׁמַ֣ע לַ/מֶּ֔לֶךְ כַּ/דְּבָרִ֣ים הָ/אֵ֑לֶּה וְ/עַתָּ֣ה לְכָ֔/ה וְ/נִֽוָּעֲצָ֖ה יַחְדָּֽו־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/007.yaml
  text: And you have even appointed prophets to proclaim concerning you in Jerusalem[a], saying, ‘There is a king in Judah!’ And now these reports will be heard by the king. So now, come[b], and let us consult together.
translation:
  language: hi
  text: और तुमने भविष्यद्वक्ताओं को भी नियुक्त किया है कि वे यरूशलेम में तुम्हारे विषय में यह घोषणा करें, “यहूदा में एक राजा है!”[a] अब ऐसी बातें[b] राजा के सुनने में आएँगी। इसलिए अब आओ, और हम मिलकर विचार-विमर्श करें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में यह घोषणा बहुत संक्षिप्त है—शाब्दिक रूप से, “यहूदा में राजा।” प्रसंग में इसका आशय नहेमायाह के राजा होने का दावा है, लेकिन उद्धरण में उसका नाम स्पष्ट रूप से नहीं आता।
    reason: alternative_reading
  - marker: b
    text: या “ये बातें,” “ऐसे शब्द,” अथवा “ऐसे समाचार।” इब्रानी शब्द का अर्थ शब्दों, मामलों या समाचारों से हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: और ... भी
  rationale: संयोजक और बलसूचक भाव, दोनों को रखते हुए आरोप की तीव्रता व्यक्त करता है।
- source_word: נְבִיאִים
  choice: भविष्यद्वक्ताओं
  rationale: यह शब्द अपने सामान्य अर्थ में नबियों या भविष्यद्वक्ताओं को दर्शाता है; इसे केवल संदेशवाहक कहना अनावश्यक रूप से अर्थ को कमजोर करेगा।
- source_word: הֶעֱמַדְתָּ
  choice: नियुक्त किया है
  rationale: हिफ़ील रूप यहाँ लोगों को किसी निर्धारित सार्वजनिक भूमिका में लगाने का भाव देता है; आधुनिक हिन्दी में ‘नियुक्त किया’ स्वाभाविक है।
- source_word: לִקְרֹא עָלֶיךָ
  choice: तुम्हारे विषय में यह घोषणा करें
  rationale: קרא के साथ על किसी व्यक्ति के विषय में सार्वजनिक घोषणा करने का अर्थ दे सकता है; यह अनुवाद संबंधसूचक भाव को बनाए रखता है।
- source_word: מֶלֶךְ בִּיהוּדָה
  choice: यहूदा में एक राजा है!
  rationale: मूल इब्रानी वाक्य क्रियारहित और अत्यंत संक्षिप्त है। हिन्दी में यह रूप राजत्व के दावे का आरोप व्यक्त करता है, पर उद्धरण के भीतर नहेमायाह का नाम नहीं जोड़ता।
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: ऐसी बातें
  rationale: דברים का अर्थ बातें, शब्द, मामले या समाचार हो सकता है। ‘ऐसी बातें’ मूल की व्यापकता बनाए रखता है, जबकि प्रसंग में इनके राजा तक पहुँचने वाले आरोप होने का संकेत स्पष्ट रहता है।
- source_word: וְנִוָּעֲצָה יַחְדָּו
  choice: हम मिलकर विचार-विमर्श करें
  rationale: निफ़ाल इच्छासूचक रूप परस्पर सलाह करने को व्यक्त करता है और יַחְדָּו संयुक्त रूप से ऐसा करने पर बल देता है।
theological_decisions:
- issue: राजा होने के आरोप का स्वरूप
  choice: उद्धृत घोषणा में नहेमायाह का नाम जोड़े बिना ‘यहूदा में एक राजा है!’
  alternative: ‘तुम यहूदा के राजा हो!’ या ‘नहेमायाह यहूदा का राजा है!’
  rationale: प्रसंग में आरोप नहेमायाह पर है, पर मूल उद्धरण केवल ‘यहूदा में राजा’ कहता है। चुना हुआ रूप आरोप की शक्ति रखते हुए मूल से अधिक स्पष्टता नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और सम्मानपूर्ण रखी गई है। ‘भविष्यद्वक्ता,’ ‘घोषणा’ और ‘विचार-विमर्श’ जैसे शब्द औपचारिक ऐतिहासिक प्रसंग के अनुकूल हैं, पर सामान्य हिन्दी पाठक के लिए सहज बने रहते हैं।
