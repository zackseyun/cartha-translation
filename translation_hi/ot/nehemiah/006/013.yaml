base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/013.yaml
  text: 'He was hired for this purpose: that I should become afraid and act that way and sin[a], so that they would have grounds for an evil report[b], in order that they might reproach me.'
translation:
  language: hi
  text: वह इसी उद्देश्य से भाड़े पर रखा गया था कि मैं डर जाऊँ, वैसा करूँ और पाप करूँ, ताकि उन्हें मेरी निंदा करने का आधार मिल जाए[a] और वे मेरी निंदा कर सकें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “और वह उनके लिए बुरे नाम के लिए होता।” अर्थात मेरे पाप से उन्हें मुझे बदनाम करने या मेरी निंदा करने का आधार मिल जाता।'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן שָׂכוּר הוּא
  choice: वह इसी उद्देश्य से भाड़े पर रखा गया था
  rationale: पहला לְמַעַן उद्देश्य बताता है और שָׂכוּר का सीधा अर्थ भाड़े पर रखा हुआ या पैसे देकर नियुक्त किया हुआ है। वाक्य में הוּא का बल ‘वह’ से बनाए रखा गया है।
- source_word: לְמַעַן אִירָא
  choice: कि मैं डर जाऊँ
  rationale: लְמַעַן के बाद अपूर्ण क्रिया विरोधियों के अभिप्रेत परिणाम को व्यक्त करती है; ‘डर जाऊँ’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: וְאֶעֱשֶׂה כֵּן וְחָטָאתִי
  choice: वैसा करूँ और पाप कर बैठूँ
  rationale: כֵּן का अर्थ ‘वैसा’ है, जो पिछले प्रसंग में सुझाए गए अनुचित कार्य की ओर संकेत करता है। ‘पाप कर बैठूँ’ उस कार्य के परिणामी अपराध को सहज हिन्दी में व्यक्त करता है।
- source_word: וְהָיָה לָהֶם לְשֵׁם רָע
  choice: ताकि उन्हें मेरे विरुद्ध बदनामी की बात मिल जाए
  rationale: शाब्दिक रूप ‘और वह उनके लिए बुरे नाम के रूप में होता’ हिन्दी में अस्पष्ट है। प्रसंग में नहेमायाह का पाप शत्रुओं को उसकी बदनामी का आधार देता; चयन इस कार्यात्मक अर्थ को स्पष्ट करता है, जबकि पादटिप्पणी शाब्दिक रूप सुरक्षित रखती है।
- source_word: יְחָרְפוּנִי
  choice: वे मुझे अपमानित कर सकें
  rationale: חרף में निंदा, तिरस्कार और सार्वजनिक अपमान का भाव है। ‘अपमानित करना’ साधारण आधुनिक हिन्दी में इस प्रसंग के लिए स्वाभाविक है।
