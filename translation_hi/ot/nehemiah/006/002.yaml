base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/002.yaml
  text: So Sanballat and Geshem sent to me[a], saying, “Come[b], and let us meet together in the villages in the plain of Ono.” But they were planning to do me harm.
translation:
  language: hi
  text: 'तब सम्बल्लत और गेशेम ने मेरे पास यह संदेश भेजा: “आओ, हम ओनो के मैदान[b] के गाँवों[a] में मिलें।” पर वे मुझे हानि पहुँचाने की योजना बना रहे थे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या सम्भवतः, “कफीरीम में”; हिब्रू शब्द को ‘गाँवों’ के बजाय स्थाननाम भी समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: ‘मैदान’ का अनुवाद ‘घाटी’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: मेरे पास यह संदेश भेजा
  rationale: हिब्रू में ‘संदेश’ निहित है और לֵאמֹר संदेश की विषयवस्तु प्रस्तुत करता है; आधुनिक हिन्दी में यह प्रयोग स्वाभाविक और स्पष्ट है।
- source_word: סַנְבַלַּט וְגֶשֶׁם
  choice: सम्बल्लत और गेशेम
  rationale: व्यक्तिनामों का प्रचलित हिन्दी बाइबलीय लिप्यंतरण रखा गया है।
- source_word: לְכָה
  choice: आओ
  rationale: मूल क्रिया का सामान्य अर्थ ‘चलना/जाना’ है, पर निमंत्रण के इस प्रयोग में हिन्दी ‘आओ’ स्वाभाविक है।
- source_word: וְנִוָּעֲדָה יַחְדָּו
  choice: हम ... मिलें
  rationale: निफ़अल रूप तय करके मिलने का भाव देता है; बहुवचन ‘हम मिलें’ पारस्परिकता और יחדו के साथ होने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בַּכְּפִירִים
  choice: गाँवों के बीच
  rationale: כְּפִירִים को यहाँ सामान्य संज्ञा ‘गाँव/बस्तियाँ’ माना गया है। इसे स्थाननाम मानने की वास्तविक संभावना पादटिप्पणी में सुरक्षित है।
- source_word: בְּבִקְעַת אוֹנוֹ
  choice: ओनो के मैदान में
  rationale: בִּקְעָה चौड़ी घाटी या मैदानी घाटी को सूचित कर सकता है; यहाँ सुबोध हिन्दी में ‘मैदान’ उपयुक्त है।
- source_word: וְהֵמָּה חֹשְׁבִים
  choice: पर वे ... योजना बना रहे थे
  rationale: संदर्भ में וְ विरोधसूचक है और חֹשְׁבִים केवल सोचने के बजाय षड्यंत्रपूर्ण इरादा या योजना दर्शाता है।
- source_word: לַעֲשׂוֹת לִי רָעָה
  choice: मुझे हानि पहुँचाने
  rationale: यह वाक्यांश नहेमायाह के विरुद्ध अनिर्दिष्ट बुराई या नुकसान का इरादा बताता है; ‘हानि पहुँचाने’ उसके स्वरूप को अनावश्यक रूप से निश्चित नहीं करता।
