language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: זָכְרָ֧/ה אֱלֹהַ֛/י לְ/טוֹבִיָּ֥ה וּ/לְ/סַנְבַלַּ֖ט כְּ/מַעֲשָׂ֣י/ו אֵ֑לֶּה וְ/גַ֨ם לְ/נוֹעַדְיָ֤ה הַ/נְּבִיאָה֙ וּ/לְ/יֶ֣תֶר הַ/נְּבִיאִ֔ים אֲשֶׁ֥ר הָי֖וּ מְיָֽרְאִ֥ים אוֹתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/014.yaml
  text: Remember Tobiah and Sanballat[a], my God, according to these deeds of theirs, and also Noadiah the prophetess and the rest of the prophets who were trying to make me afraid.
translation:
  language: hi
  text: हे मेरे परमेश्वर, तोबियाह और सनबल्लत को उनके इन कामों के अनुसार याद रख, और नबिया नोअद्याह तथा बाकी नबियों को भी, जो मुझे डराने की कोशिश कर रहे थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זָכְרָה
  choice: याद रख
  rationale: यह परमेश्वर से की गई सीधी प्रार्थनात्मक विनती है। ‘याद रख’ हिब्रू की संक्षिप्तता बनाए रखता है और इसमें न्याय का ऐसा स्पष्ट विस्तार नहीं जोड़ता जो मूल में नहीं है।
- source_word: אֱלֹהַי
  choice: हे मेरे परमेश्वर
  rationale: प्रथम पुरुष एकवचन संबंधसूचक प्रत्यय को ‘मेरे परमेश्वर’ से व्यक्त किया गया है; ‘हे’ प्रत्यक्ष संबोधन को स्वाभाविक हिंदी में स्पष्ट करता है।
- source_word: לְטוֹבִיָּה וּלְסַנְבַלַּט
  choice: तोबियाह और सनबल्लत को
  rationale: व्यक्तिनामों का देवनागरी लिप्यंतरण किया गया है और לְ को ‘को’ से व्यक्त किया गया है, क्योंकि ये ‘याद रख’ क्रिया के कर्म हैं।
- source_word: כְּמַעֲשָׂיו אֵלֶּה
  choice: उनके इन कामों के अनुसार
  rationale: כְּ की अनुरूपता या माप की भावना ‘के अनुसार’ से सुरक्षित रहती है। संदर्भ में दोनों विरोधियों के लिए हिंदी का बहुवचन संबंधसूचक ‘उनके’ स्वाभाविक है।
- source_word: לְנוֹעַדְיָה הַנְּבִיאָה
  choice: नबिया नोअद्याह
  rationale: स्त्रीलिंग הַנְּבִיאָה को स्पष्ट करने के लिए प्रचलित हिंदी पद ‘नबिया’ चुना गया है और नाम का लिप्यंतरण ‘नोअद्याह’ किया गया है।
- source_word: וּלְיֶתֶר הַנְּבִיאִים
  choice: तथा बाकी नबियों को भी
  rationale: יֶתֶר का अर्थ शेष समूह है; ‘बाकी नबियों’ से यह भाव सहज आधुनिक हिंदी में आता है। וְגַם की जोड़ने वाली शक्ति ‘तथा ... भी’ से व्यक्त हुई है।
- source_word: אֲשֶׁר הָיוּ מְיָרְאִים אוֹתִי
  choice: जो मुझे डराने की कोशिश कर रहे थे
  rationale: הָיוּ के साथ कृदंत अतीत में जारी क्रिया बताता है और causative रूप भय उत्पन्न करने का प्रयत्न दर्शाता है। यह अनुवाद चल रही डराने की गतिविधि को व्यक्त करता है।
theological_decisions:
- issue: विरोधियों के विरुद्ध परमेश्वर से स्मरण की प्रार्थना का स्वर
  choice: ‘उनके इन कामों के अनुसार याद रख’
  alternative: ‘उनके इन कामों के लिए उनका न्याय कर’ अथवा ‘उन्हें उत्तरदायी ठहरा’
  rationale: मूल पाठ गंभीर नैतिक अपील करता है, पर स्पष्ट रूप से दंड या न्याय शब्द नहीं जोड़ता। इसलिए अनुवाद उसी तनाव को बनाए रखता है और परिणाम को अनिर्दिष्ट छोड़ता है।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण प्रार्थनात्मक स्वर रखा गया है। वाक्य की हिब्रू संरचना और नामों की सूची सुरक्षित रखते हुए हिंदी में स्वाभाविक क्रम अपनाया गया है।
