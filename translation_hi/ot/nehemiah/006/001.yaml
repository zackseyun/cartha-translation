  text: וַ/יְהִ֣י כַ/אֲשֶׁ֣ר נִשְׁמַ֣ע לְ/סַנְבַלַּ֣ט וְ֠/טוֹבִיָּה וּ/לְ/גֶ֨שֶׁם הָֽ/עַרְבִ֜י וּ/לְ/יֶ֣תֶר אֹֽיְבֵ֗י/נוּ כִּ֤י בָנִ֨יתִי֙ אֶת הַ֣/חוֹמָ֔ה וְ/לֹא נ֥וֹתַר בָּ֖/הּ פָּ֑רֶץ גַּ֚ם עַד הָ/עֵ֣ת הַ/הִ֔יא דְּלָת֖וֹת לֹא הֶעֱמַ֥דְתִּי בַ/שְּׁעָרִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/001.yaml
  text: When Sanballat[a], Tobiah, Geshem the Arab[b], and the rest of our enemies heard that I had rebuilt the wall and that no breach was left in it—though up to that time I had not set up the doors in the gates—
translation:
  language: hi
  text: जब सनबल्लत, तोबियाह, अरबवासी गेशेम[b] और हमारे बाकी शत्रुओं ने सुना कि मैंने दीवार का पुनर्निर्माण किया था[a] और उसमें कोई खुला भाग बाकी नहीं था—हालाँकि उस समय तक मैंने फाटकों में किवाड़ नहीं लगाए थे—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मैंने दीवार बनाई थी।’ इब्रानी क्रिया का सीधा अर्थ ‘बनाना’ है; ‘पुनर्निर्माण’ उस प्रसंग को व्यक्त करता है जिसमें पहले से मौजूद दीवार को फिर से खड़ा किया जा रहा था।
    reason: lexical_alternative
  - marker: b
    text: या ‘अरबी गेशेम।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַאֲשֶׁר
  choice: जब
  rationale: यह पद एक नई कथात्मक घटना को समयवाचक उपवाक्य से आरम्भ करता है। हिन्दी में केवल ‘जब’ स्वाभाविक है; अलग से ‘और ऐसा हुआ’ जोड़ना अनावश्यक रूप से बोझिल होता।
- source_word: נִשְׁמַע לְסַנְבַלַּט ...
  choice: सनबल्लत ... ने सुना
  rationale: इब्रानी का निष्क्रिय रूप शाब्दिक रूप से ‘उन्हें सुनाई पड़ा’ हो सकता है, पर नामित व्यक्तियों को कर्ता बनाकर ‘ने सुना’ कहना आधुनिक हिन्दी में अधिक स्वाभाविक है और अर्थ सुरक्षित रखता है।
- source_word: גֶשֶׁם הָעַרְבִי
  choice: अरबी गेशेम
  rationale: הָעַרְבִי गेशेम की जातीय पहचान बताता है। ‘अरबी गेशेम’ संक्षिप्त और स्वाभाविक है; ‘अरबवासी गेशेम’ भी सम्भव है।
- source_word: יֶתֶר אֹיְבֵינוּ
  choice: हमारे बाकी शत्रु
  rationale: יֶתֶר का अर्थ ‘शेष/बाकी’ है। ‘बाकी शत्रु’ वर्तमान हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: בָנִיתִי אֶת־הַחוֹמָה
  choice: मैंने दीवार का पुनर्निर्माण कर लिया है
  rationale: क्रिया का मूल अर्थ ‘बनाना’ है, पर प्रसंग यरूशलेम की पहले से विद्यमान दीवार की मरम्मत और पुनर्स्थापना का है। ‘पुनर्निर्माण’ यह प्रसंगगत अर्थ स्पष्ट करता है; शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: לֹא נוֹתַר בָּהּ פָּרֶץ
  choice: उसमें कोई दरार बाकी नहीं रही
  rationale: פָּרֶץ दीवार में टूटे हुए खुले स्थान या breach को दर्शाता है। ‘दरार’ यहाँ सहज हिन्दी है और अधूरे हिस्से के शेष न रहने का भाव देता है।
- source_word: גַּם עַד הָעֵת הַהִיא
  choice: हालाँकि उस समय तक
  rationale: 'प्रसंग में यह एक रियायती योग्यता प्रस्तुत करता है: दीवार के खुले हिस्से भर चुके थे, फिर भी किवाड़ अभी नहीं लगे थे।'
- source_word: דְּלָתוֹת לֹא הֶעֱמַדְתִּי בַשְּׁעָרִים
  choice: मैंने फाटकों में किवाड़ नहीं लगाए थे
  rationale: דְּלָתוֹת फाटक की पूरी संरचना नहीं, उसके बंद होने वाले किवाड़ हैं। ‘फाटकों में किवाड़ लगाना’ हिन्दी में स्पष्ट रूप से यही भेद बनाए रखता है।
