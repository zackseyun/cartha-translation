translation:
  language: hi
  text: 'तब मैंने उसे यह संदेश भेजा: “तुम जो बातें कह रहे हो, उनमें से कोई भी नहीं हुई है; तुम इन्हें अपने ही मन से गढ़ रहे हो।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֶשְׁלְחָה אֵלָיו לֵאמֹר
  choice: तब मैंने उसके पास यह उत्तर भेजा
  rationale: वाक्यांश अगले क्रमिक कार्य और भेजे गए संदेश का परिचय देता है। हिंदी में ‘यह उत्तर भेजा’ प्रत्यक्ष कथन की भूमिका को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לֹא נִהְיָה כַּדְּבָרִים הָאֵלֶּה
  choice: वैसा कुछ नहीं हुआ है
  rationale: यह कथित बातों या घटनाओं की वास्तविकता का स्पष्ट निषेध करता है और आधुनिक हिंदी में स्वाभाविक है।
- source_word: אֲשֶׁר אַתָּה אוֹמֵר
  choice: तुम जो बातें कह रहे हो
  rationale: सहभागी रूप אוֹמֵר के जारी कथन के भाव को ‘कह रहे हो’ बनाए रखता है।
- source_word: מִלִּבְּךָ
  choice: अपने ही मन से
  rationale: हिब्रू ‘हृदय’ यहाँ विचार और आंतरिक कल्पना का केंद्र है; हिंदी मुहावरे में ‘अपने ही मन से’ उसी आशय को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: בּוֹדָאם
  choice: तुम इन्हें ... गढ़ रहे हो
  rationale: בדא का अर्थ मनगढ़ंत बनाना या गढ़ना है। ‘गढ़ रहे हो’ आरोपों के जानबूझकर बनाए जाने का भाव संक्षिप्त और गरिमापूर्ण हिंदी में देता है।
