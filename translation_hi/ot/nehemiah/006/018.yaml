base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/018.yaml
  text: For many in Judah were bound by oath to him[a], because he was the son-in-law of Shecaniah son of Arah[b], and Jehohanan his son had taken the daughter of Meshullam son of Berechiah as his wife.
translation:
  language: hi
  text: क्योंकि यहूदा में बहुत-से लोग उसके प्रति शपथ से बँधे हुए थे; इसलिए कि वह आरह के पुत्र शकन्याह का दामाद था, और शकन्याह के पुत्र यहोहानान ने बेरेक्याह के पुत्र मशुल्लाम की बेटी से विवाह किया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַבִּים בִּיהוּדָה
  choice: यहूदा में बहुत-से लोग
  rationale: בְּ को यहाँ स्थानवाचक मानते हुए यहूदा के प्रदेश अथवा समुदाय में रहने वाले अनेक लोगों का स्वाभाविक हिन्दी में उल्लेख किया गया है।
- source_word: בַּעֲלֵי שְׁבוּעָה לוֹ
  choice: शपथ खाकर उसके प्रति बँधे हुए थे
  rationale: शाब्दिक अभिव्यक्ति ‘उसके लिए शपथ के स्वामी/धारक’ है; आशय शपथ से उत्पन्न व्यक्तिगत या राजनीतिक दायित्व का है। यह अनुवाद उस बंधन को स्पष्ट रखता है।
- source_word: כִּי ... כִּי
  choice: क्योंकि ... कारण यह था कि
  rationale: पहला כִּי पिछले कथन का कारण बताता है और दूसरा उस शपथबद्ध निष्ठा का कारण प्रस्तुत करता है; हिन्दी में दोनों संबंधों को स्पष्ट और सहज बनाया गया है।
- source_word: חָתָן הוּא לִשְׁכַנְיָה
  choice: वह ... शकन्याह का दामाद था
  rationale: חָתָן इस पारिवारिक संदर्भ में विवाह से बने संबंध, विशेषतः ‘दामाद’, को दर्शाता है।
- source_word: וִיהוֹחָנָן בְּנוֹ
  choice: और उसके पुत्र यहोहानान ने
  rationale: בְּנוֹ का स्वाभाविक संदर्भ मुख्य व्यक्ति तोबियाह है, जिसका उल्लेख पिछले प्रसंग में है। हिन्दी में ‘उसके’ रखकर मूल का सर्वनाम बनाए रखा गया है, यद्यपि पाठक प्रसंग से इसका संबंध समझता है।
- source_word: לָקַח אֶת בַּת
  choice: बेटी से विवाह किया था
  rationale: ‘बेटी को लिया’ विवाह के लिए प्रयुक्त मानक इब्रानी मुहावरा है; आधुनिक हिन्दी में उसका अर्थ सीधे व्यक्त किया गया है।
- source_word: בַּת מְשֻׁלָּם בֶּן בֶּרֶכְיָה
  choice: बेरेक्याह के पुत्र मशुल्लाम की बेटी
  rationale: वंश-संबंधों की इब्रानी शृंखला को स्पष्ट और स्वाभाविक हिन्दी क्रम में रखा गया है।
