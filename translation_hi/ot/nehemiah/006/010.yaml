base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/010.yaml
  text: Then I went to the house of Shemaiah son of Delaiah[a], son of Mehetabel, who was confined, and he said, “Let us meet at the house of God, inside the temple, and let us shut the doors of the temple, for they are coming to kill you—yes, at night they are coming to kill you.”
translation:
  language: hi
  text: तब मैं महेतबेल के पुत्र दलायाह के पुत्र शमायाह के घर गया। वह बंद था। उसने कहा, “आओ, हम परमेश्वर के भवन में, मंदिर[a] के भीतर मिलें और मंदिर के द्वार बंद कर लें, क्योंकि वे तुम्हें मार डालने आ रहे हैं—हाँ, रात में वे तुम्हें मार डालने आ रहे हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पवित्रस्थान।” हिब्रू शब्द हेखाल केवल विस्तृत मंदिर-परिसर नहीं, बल्कि विशेष रूप से मंदिर की इमारत या पवित्रस्थान को भी दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי בָאתִי
  choice: तब मैं ... के घर गया
  rationale: संयोजक और सर्वनाम कथा के क्रम को आगे बढ़ाते हुए कर्ता पर हल्का बल देते हैं। בוא का अर्थ दृष्टिकोण के अनुसार ‘आना’ या ‘जाना’ हो सकता है; यहाँ हिन्दी में ‘घर गया’ स्वाभाविक है।
- source_word: בֵּית שְׁמַעְיָה
  choice: शमायाह के घर
  rationale: व्यक्तिनाम के साथ בֵּית निवास को दर्शाता है; ‘घर’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: שְׁמַעְיָה בֶן־דְּלָיָה בֶן־מְהֵיטַבְאֵל
  choice: महेतबेल के पुत्र दलायाह के पुत्र शमायाह
  rationale: हिब्रू वंशावली-संबंध को बिना संक्षिप्त किए हिन्दी के स्वाभाविक उलटे क्रम में रखा गया है।
- source_word: וְהוּא עָצוּר
  choice: वह अपने घर में बंद था
  rationale: עָצוּר बंद, निरुद्ध या रोका हुआ होने का अर्थ दे सकता है। यह अनुवाद उसके बाहर न आने की दशा बताता है, पर यह तय नहीं करता कि कारण हिरासत, धार्मिक एकांत या स्वेच्छा था।
- source_word: נִוָּעֵד
  choice: आओ, हम ... मिलें
  rationale: यह रूप साथ मिलने का प्रस्ताव व्यक्त करता है; हिन्दी में ‘आओ, हम ... मिलें’ वही आमंत्रण स्वाभाविक ढंग से देता है।
- source_word: בֵּית הָאֱלֹהִים
  choice: परमेश्वर का भवन
  rationale: यह मंदिर-परिसर के लिए प्रयुक्त पारंपरिक हिब्रू अभिव्यक्ति को बनाए रखता है और आगे आने वाले अधिक विशिष्ट הֵיכָל से भेद करता है।
- source_word: אֶל־תּוֹךְ הַהֵיכָל
  choice: मंदिर के भीतर
  rationale: הֵיכָל यहाँ मंदिर की पवित्र इमारत या पवित्रस्थान का संकेत दे सकता है। मुख्य पाठ का वाक्यांश सहज है, जबकि पादटिप्पणी अधिक विशिष्ट विकल्प सुरक्षित रखती है।
- source_word: וְנִסְגְּרָה דַּלְתוֹת הַהֵיכָל
  choice: और मंदिर के द्वार बंद कर लें
  rationale: यह आगे जारी सामूहिक प्रस्ताव और द्वार बंद करने की ठोस क्रिया दोनों को स्पष्ट रखता है।
- source_word: כִּי בָּאִים לְהָרְגֶךָ
  choice: क्योंकि वे तुम्हें मार डालने आ रहे हैं
  rationale: बहुवचन कृदंत का कर्ता अनिर्दिष्ट है; हिन्दी में ‘वे’ स्वाभाविक पूर्ति है। उद्देश्य को सीधे व्यक्त किया गया है।
- source_word: וְלַיְלָה בָּאִים לְהָרְגֶךָ
  choice: हाँ, रात में वे तुम्हें मार डालने आ रहे हैं
  rationale: ‘हाँ’ पुनरुक्ति की तीव्रता को व्यक्त करता है; ‘रात में’ को ‘आज रात’ बनाकर अनावश्यक रूप से अधिक विशिष्ट नहीं किया गया, और मूल की पुनरावृत्ति बनाए रखी गई है।
theological_decisions:
- issue: प्रतिबंधित पवित्र क्षेत्र के प्रसंग में הֵיכָל का अनुवाद
  choice: मंदिर
  alternative: पवित्रस्थान
  rationale: अगला पद संकेत देता है कि ऐसे पवित्र क्षेत्र में प्रवेश नहेमायाह के लिए अनुचित होता, पर הֵיכָל स्वयं ‘मंदिर की इमारत’ अथवा अधिक विशेष रूप से ‘पवित्रस्थान’ कहला सकता है। मुख्य पाठ पठनीय ‘मंदिर’ रखता है और पादटिप्पणी संदर्भतः महत्त्वपूर्ण वैकल्पिक अर्थ को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण कथात्मक शैली रखी गई है। व्यक्तिनाम देवनागरी में लिप्यंतरित हैं। मूल की तात्कालिकता और दोहराव को बनाए रखा गया है; עָצוּר के कारण और הֵיכָל की सटीक सीमा को अनावश्यक रूप से निश्चित नहीं किया गया।
