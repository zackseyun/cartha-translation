reference: Nehemiah 6:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וָ/אֹמְרָ֗/ה הַ/אִ֤ישׁ כָּמ֨וֹ/נִי֙ יִבְרָ֔ח וּ/מִ֥י כָמ֛וֹ/נִי אֲשֶׁר יָב֥וֹא אֶל הַ/הֵיכָ֖ל וָ/חָ֑י לֹ֖א אָבֽוֹא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/011.yaml
  text: But I said[a], “Should a man like me flee? And who is like me, who could go into the temple and live? I will not go in.”
translation:
  language: hi
  text: परन्तु मैंने कहा[a], “क्या मेरे जैसा मनुष्य भागे? और मेरे जैसा कौन है, जो मंदिर में जाकर जीवित रह सके? मैं भीतर नहीं जाऊँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पवित्र स्थान।” सम्भवतः बात केवल भवन के भीतर छिपने की नहीं, बल्कि मंदिर के ऐसे प्रतिबन्धित भाग में प्रवेश करने की है जहाँ नहेमायाह का जाना अनुचित होता; इसी से “जीवित रह सके” की बात का बल समझ में आता है।
    reason: הַהֵיכָל के सम्भावित अधिक विशिष्ट अर्थ और प्रसंगगत धार्मिक निहितार्थ को सुरक्षित रखना।
lexical_decisions:
- source_word: וָאֹמְרָה
  choice: परन्तु मैंने कहा
  rationale: वाव कथानक को आगे बढ़ाता है, पर प्रसंग में नहेमायाह पिछले प्रस्ताव को ठुकरा रहा है; इसलिए विरोधसूचक ‘परन्तु’ स्वाभाविक है।
- source_word: הָאִישׁ כָּמוֹנִי
  choice: मेरे जैसा मनुष्य
  rationale: यह किसी निश्चित व्यक्ति का उल्लेख नहीं, बल्कि आलंकारिक प्रश्न में सामान्य एकवचन है। यह नहेमायाह की स्थिति और दायित्व से जुड़ी आत्म-संज्ञा को बनाए रखता है।
- source_word: יִבְרָח
  choice: भागे
  rationale: क्रिया भय या संकट के कारण पलायन को व्यक्त करती है; ‘भागे’ आधुनिक हिन्दी में स्वाभाविक है और प्रश्न की नैतिक तीक्ष्णता बनाए रखता है।
- source_word: וּמִי כָמוֹנִי אֲשֶׁר יָבוֹא
  choice: और मेरे जैसा कौन है, जो … जाकर
  rationale: इब्रानी वाक्यांश संक्षिप्त और कुछ अस्पष्ट है। यह रूप पहले प्रश्न के समानान्तर आलंकारिक बल को रखते हुए हिन्दी में सुबोध है।
- source_word: הַהֵיכָל
  choice: मन्दिर
  rationale: यहाँ शब्द मन्दिर-भवन अथवा उसके प्रतिबन्धित पवित्र भाग की ओर संकेत कर सकता है। मुख्य पाठ में व्यापक और परिचित ‘मन्दिर’ रखा गया है; विशिष्ट सम्भावना पाद-टिप्पणी में दी गई है।
- source_word: וָחָי
  choice: जीवित रह सके
  rationale: शाब्दिक अर्थ ‘और जीवित रहे’ है। प्रश्न के सामर्थ्यसूचक भाव को हिन्दी में स्वाभाविक बनाने के लिए ‘रह सके’ चुना गया, जबकि जीवन बचने का आशय सुरक्षित है।
- source_word: לֹא אָבוֹא
  choice: मैं भीतर नहीं जाऊँगा
  rationale: यह पिछले ‘जाकर’ में निहित प्रवेश को दोहराता है। ‘भीतर नहीं जाऊँगा’ स्थानगत अर्थ और दृढ़ निषेध दोनों को स्पष्ट रखता है।
theological_decisions:
- issue: मन्दिर में प्रवेश का निहितार्थ
  choice: मुख्य पाठ प्रवेश और जीवित रहने के बीच तनाव को बनाए रखता है; पाद-टिप्पणी सम्भावित अनुचित या निषिद्ध प्रवेश को समझाती है।
  alternative: इसे केवल सुरक्षित स्थान में छिपने से नहेमायाह का रणनीतिक इनकार माना जाए।
  rationale: नहेमायाह 6:10–13 में प्रस्ताव उसे पाप में फँसाकर बदनाम करने की चाल प्रतीत होता है। फिर भी पद स्वयं प्रतिबन्ध का पूरा स्वरूप स्पष्ट नहीं करता, इसलिए अनुवाद किसी एक व्याख्या को मुख्य पाठ में निर्णायक नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सुबोध रूप अपनाया गया है। आलंकारिक प्रश्नों की समानान्तर संरचना और नहेमायाह के दृढ़ इनकार को बनाए रखा गया है। ‘मन्दिर’ सामान्य पाठक के लिए स्पष्ट है, जबकि ‘पवित्रस्थान’ को पाद-टिप्पणी में वैकल्पिक अर्थ के रूप में रखा गया है।
