  text: כִּ֣י כֻלָּ֗/ם מְיָֽרְאִ֤ים אוֹתָ֨/נוּ֙ לֵ/אמֹ֔ר יִרְפּ֧וּ יְדֵי/הֶ֛ם מִן הַ/מְּלָאכָ֖ה וְ/לֹ֣א תֵעָשֶׂ֑ה וְ/עַתָּ֖ה חַזֵּ֥ק אֶת יָדָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/009.yaml
  text: For all of them were trying to frighten us[a], saying, “Their hands will grow weak from the work, and it will not be done.” But now[b], strengthen my hands.
translation:
  language: hi
  text: क्योंकि वे सब हमें डराने की कोशिश कर रहे थे[a], यह कहते हुए, “काम से उनके हाथ ढीले पड़ जाएँगे और वह पूरा नहीं होगा।” पर अब[b], मेरे हाथों को मज़बूत कर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “हमें भयभीत कर रहे थे।” क्रिया लगातार डर पैदा करने की चेष्टा का भाव देती है।'
    reason: lexical_alternative
  - marker: b
    text: 'अंतिम वाक्य एक संक्षिप्त प्रार्थना है: “पर अब, मेरे हाथों को मज़बूत कर।” कुछ लोग इसे अलग प्रकार से समझते हैं, पर इब्रानी स्वरांकन परमेश्वर से की गई सीधी विनती का समर्थन करता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: מְיָרְאִים אֹתָנוּ
  choice: हमें डराने की कोशिश कर रहे थे
  rationale: हिफ़ील कृदंत भय उत्पन्न करने की जारी और उद्देश्यपूर्ण चेष्टा व्यक्त करता है; बहुवचन ‘हमें’ इब्रानी पाठ के अनुरूप रखा गया है।
- source_word: לֵאמֹר
  choice: वे कहते थे
  rationale: यह विरोधियों की कही या सोची हुई बात का आशय प्रस्तुत करता है; वर्तमान प्रसंग में यह स्वाभाविक हिन्दी कथन है।
- source_word: יִרְפּוּ יְדֵיהֶם
  choice: उनके हाथ ढीले पड़ जाएँगे
  rationale: इब्रानी मुहावरे में हाथों के शिथिल पड़ने का चित्र है, अर्थात शक्ति या हौसला टूटना; हिन्दी में ‘हाथ ढीले पड़ना’ उस चित्र और अर्थ दोनों को बनाए रखता है।
- source_word: מִן־הַמְּלָאכָה
  choice: काम करते-करते
  rationale: מִן यहाँ काम के कारण उत्पन्न शिथिलता का भाव देता है। यह हिन्दी में ‘काम से’ की अपेक्षा अधिक स्वाभाविक है और निर्माण-कार्य से संबंध स्पष्ट करता है।
- source_word: וְלֹא תֵעָשֶׂה
  choice: और वह पूरा नहीं होगा
  rationale: निफ़अल रूप काम के न किए जाने या संपन्न न होने को दर्शाता है; हिन्दी में ‘पूरा नहीं होगा’ परियोजना के संदर्भ में स्पष्ट और स्वाभाविक है।
- source_word: וְעַתָּה
  choice: पर अब
  rationale: यह विरोधियों के उद्देश्य के वर्णन से नहेमायाह की संक्षिप्त प्रार्थना की ओर तीखा मोड़ दिखाता है।
- source_word: חַזֵּק אֶת־יָדָי
  choice: मेरे हाथों को दृढ़ कर
  rationale: आज्ञार्थक क्रिया को प्रत्यक्ष विनती के रूप में रखा गया है और ‘हाथ’ का मूल चित्र सुरक्षित है, जो विरोधियों की आशा कि हाथ ढीले पड़ेंगे, उसका जानबूझकर प्रतिवाद करता है।
theological_decisions:
- issue: वर्णन से परमेश्वर को संबोधित प्रत्यक्ष प्रार्थना की ओर परिवर्तन
  choice: 'अंतिम वाक्य को नहेमायाह की प्रत्यक्ष प्रार्थना माना गया: ‘पर अब, मेरे हाथों को दृढ़ कर।’'
  alternative: इसे आत्म-प्रोत्साहन अथवा ‘मैंने अपने हाथ दृढ़ किए’ के रूप में पढ़ना
  rationale: मसोरेटी स्वरांकन חַזֵּק को द्वितीय पुरुष एकवचन आज्ञार्थक रूप बताता है, जो परमेश्वर से की गई संक्षिप्त विनती के रूप में स्वाभाविक है और नहेमायाह की अन्य छोटी प्रार्थनाओं से मेल खाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘हाथ ढीले पड़ना’ और ‘हाथों को दृढ़ करना’ के द्वारा मूल इब्रानी में दोनों खंडों के बीच मौजूद रूपकात्मक प्रतिध्वनि सुरक्षित रखी गई है। परमेश्वर के लिए एकवचन निकट संबोधन ‘कर’ मूल के 2ms आज्ञार्थक रूप को दर्शाता है।
