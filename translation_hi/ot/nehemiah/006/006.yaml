  text: כָּת֣וּב בָּ֗/הּ בַּ/גּוֹיִ֤ם נִשְׁמָע֙ וְ/גַשְׁמ֣וּ אֹמֵ֔ר אַתָּ֤ה וְ/הַ/יְּהוּדִים֙ חֹשְׁבִ֣ים לִ/מְר֔וֹד עַל כֵּ֛ן אַתָּ֥ה בוֹנֶ֖ה הַ/חוֹמָ֑ה וְ/אַתָּ֗ה הֹוֶ֤ה לָ/הֶם֙ לְ/מֶ֔לֶךְ כַּ/דְּבָרִ֖ים הָ/אֵֽלֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/006.yaml
  text: It was written in it[a], “It is being reported among the nations—and Geshem also says it—that you and the Jews are planning to rebel. Therefore you are rebuilding the wall, and according to these reports you are to become their king.”
translation:
  language: hi
  text: उसमें लिखा था, “राष्ट्रों के बीच यह खबर फैल रही है—और गश्मू[a] भी यही कहता है—कि तुम और यहूदी विद्रोह करने की योजना बना रहे हो। इसीलिए तुम शहरपनाह फिर से बना रहे हो और, इन खबरों के अनुसार, तुम उनके राजा बनने वाले हो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ में नाम ‘गश्मू’ है; इसे ‘गेशेम’ भी लिखा जाता है।
    reason: नाम के इब्रानी रूप और प्रचलित वैकल्पिक लिप्यंतरण की जानकारी देना।
lexical_decisions:
- source_word: כָּתוּב בָּהּ
  choice: उसमें लिखा था
  rationale: निष्क्रिय कृदंत रचना पत्र की लिखी हुई विषयवस्तु का परिचय देती है। हिंदी का भूतकाल कथानक के संदर्भ में स्वाभाविक है।
- source_word: בַּגּוֹיִם נִשְׁמָע
  choice: राष्ट्रों के बीच यह खबर फैल रही है
  rationale: निफ़अल रूप किसी बात के सुने जाने या प्रचलित होने का भाव देता है। यह हिंदी में फैलती हुई खबर का स्वाभाविक अर्थ व्यक्त करता है और גּוֹיִם के जातीय-राजनीतिक विस्तार को बनाए रखता है।
- source_word: וְגַשְׁמוּ אֹמֵר
  choice: और गश्मू भी यही कहता है
  rationale: वाव के योगात्मक भाव को ‘भी’ से व्यक्त किया गया है। ‘यही’ स्पष्ट करता है कि गश्मू उसी खबर की पुष्टि कर रहा है। नाम को WLC के स्वरांकन के अनुसार ‘गश्मू’ लिखा गया है।
- source_word: חֹשְׁבִים לִמְרוֹד
  choice: विद्रोह करने की योजना बना रहे हो
  rationale: חשב के साथ infinitive यहाँ सोच मात्र नहीं, बल्कि अभिप्राय या योजना दर्शाता है; ‘योजना बना रहे हो’ आरोप की जानबूझकर की गई मंशा को बिना अनावश्यक तीव्रता के व्यक्त करता है।
- source_word: עַל כֵּן
  choice: इसीलिए
  rationale: यह कथित विद्रोही योजना और शहरपनाह के पुनर्निर्माण के बीच आरोपित निष्कर्ष को संक्षेप और स्वाभाविक ढंग से जोड़ता है।
- source_word: בּוֹנֶה הַחוֹמָה
  choice: शहरपनाह फिर से बना रहे हो
  rationale: בנה का मूल अर्थ ‘बनाना’ है, पर नहेमायाह के संदर्भ में ध्वस्त नगर-दीवार की मरम्मत और पुनर्निर्माण हो रहा है; ‘फिर से’ इस संदर्भगत अर्थ को स्पष्ट करता है।
- source_word: וְאַתָּה הֹוֶה לָהֶם לְמֶלֶךְ
  choice: तुम उनके राजा बनने वाले हो
  rationale: הוה और לְמֶלֶךְ मिलकर बनने या हो जाने का भाव देते हैं। यह रूप शत्रुतापूर्ण खबर में आरोपित उद्देश्य या अपेक्षित परिणाम को व्यक्त करता है, निश्चित भविष्यवाणी को नहीं।
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: इन खबरों के अनुसार
  rationale: דברים का शाब्दिक अर्थ ‘बातें/शब्द’ हो सकता है, किंतु यहाँ यह पहले कही गई फैलती खबरों और आरोपों की विषयवस्तु को सूचित करता है। ‘खबरों’ से प्रसंग स्पष्ट रहता है।
