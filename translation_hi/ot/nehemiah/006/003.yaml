base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/003.yaml
  text: So I sent messengers to them[a], saying, “I am doing a great work, and I cannot come down. Why should the work stop while I leave it and come down to you?”
translation:
  language: hi
  text: तब मैंने उनके पास दूतों को भेजकर कहलवाया, “मैं एक बड़ा काम कर रहा हूँ और नीचे नहीं उतर सकता। जब मैं इस काम को छोड़कर तुम्हारे पास नीचे आऊँ, तो काम क्यों रुक जाए?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं इस काम को छोड़कर तुम्हारे पास नीचे आऊँ, तो काम क्यों बंद हो?”
    reason: כַּאֲשֶׁר के कालगत संबंध को बिना ‘जब’ के भी स्वाभाविक हिन्दी में व्यक्त किया जा सकता है; תִשְׁבַּת के लिए ‘बंद हो’ एक उपयुक्त वैकल्पिक रचना है।
lexical_decisions:
- source_word: וָאֶשְׁלְחָה עֲלֵיהֶם
  choice: तब मैंने उनके पास भेजकर
  rationale: वाक्य का आरंभ अगली कथात्मक क्रिया बताता है; שׁלח के साथ עַל यहाँ व्यक्तियों की ओर भेजने का भाव देता है, विरोध का नहीं।
- source_word: מַלְאָכִים
  choice: दूत
  rationale: राजनीतिक और मानवीय संदर्भ में यह संदेश पहुँचाने वाले मनुष्यों को सूचित करता है, स्वर्गदूतों को नहीं।
- source_word: לֵאמֹר
  choice: कहलाया
  rationale: यह संदेश की विषयवस्तु आरंभ करने वाला मानक उद्धरण-सूचक रूप है; ‘दूत भेजकर कहलाया’ स्वाभाविक हिन्दी है।
- source_word: מְלָאכָה גְדוֹלָה
  choice: एक बड़ा काम
  rationale: यह चयन कार्य के आकार और महत्त्व दोनों की सम्भावना बनाए रखता है और नहेमायाह के बलाघात को सुरक्षित रखता है।
- source_word: אֲנִי עֹשֶׂה
  choice: मैं ... कर रहा हूँ
  rationale: सर्वनाम के साथ कृदन्त चल रही वर्तमान गतिविधि व्यक्त करता है।
- source_word: וְלֹא אוּכַל לָרֶדֶת
  choice: और नीचे नहीं आ सकता
  rationale: ירד यरूशलेम से नीचे उतरने की भौगोलिक गति को व्यक्त करता है; सम्बोधित लोगों की ओर गति होने के कारण ‘आ सकता’ स्वाभाविक है।
- source_word: לָמָּה תִשְׁבַּת הַמְּלָאכָה
  choice: काम क्यों रुक जाए
  rationale: שׁבת यहाँ काम का रुकना या बंद होना है; प्रश्न का रूप अनावश्यक परिणाम पर बल देता है।
- source_word: אַרְפֶּהָ
  choice: उसे छोड़कर
  rationale: רפה के हिफ़ील रूप का अर्थ हाथ ढीला करना, छोड़ देना या काम से हटना है; स्त्रीलिंग प्रत्यय ‘काम’ की ओर संकेत करता है।
- source_word: וְיָרַדְתִּי אֲלֵיכֶם
  choice: तुम्हारे पास नीचे आने
  rationale: अनुवाद यरूशलेम से नीचे जाने की स्थानिक दिशा और सम्बोधित लोगों के पास पहुँचने, दोनों को बनाए रखता है।
