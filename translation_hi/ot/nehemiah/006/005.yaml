base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/005.yaml
  text: Then Sanballat sent his servant to me a fifth time in this manner[a], with an open letter in his hand.
translation:
  language: hi
  text: तब सनबल्लत ने पाँचवीं बार भी इसी प्रकार अपने सेवक को मेरे पास भेजा; उसके हाथ में एक खुला पत्र[a] था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, बिना मुहर का पत्र।
    reason: ‘खुला’ पत्र के लिए प्रयुक्त פְּתוּחָה प्रसंग में ‘बिना मुहर का’ भी समझा जा सकता है।
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: तब ... भेजा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम की स्वाभाविक प्रगति व्यक्त करता है।
- source_word: אֵלַי
  choice: मेरे पास
  rationale: यह दिशा और संदेश के प्राप्तकर्ता को सूचित करता है।
- source_word: סַנְבַלַּט
  choice: सनबल्लत
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: כַּדָּבָר הַזֶּה
  choice: इसी प्रकार
  rationale: यह मुहावरा पिछली बारों में किए गए उसी प्रयास की ओर संकेत करता है; ‘इसी प्रकार’ उस संदर्भसूचक भाव को स्वाभाविक हिन्दी में रखता है।
- source_word: פַּעַם חֲמִישִׁית
  choice: पाँचवीं बार भी
  rationale: यह पुनरावृत्ति की गिनती बताता है; ‘भी’ पूर्ववर्ती चार प्रयासों से संबंध को सहज रूप से स्पष्ट करता है।
- source_word: אֶת נַעֲרוֹ
  choice: अपने सेवक को
  rationale: נַעַר का अर्थ ‘युवक’ भी हो सकता है, पर यहाँ वह दूत के रूप में सेवा कर रहा है, इसलिए ‘सेवक’ उसकी भूमिका को बेहतर व्यक्त करता है।
- source_word: וְאִגֶּרֶת פְּתוּחָה
  choice: एक खुला पत्र
  rationale: शाब्दिक अर्थ ‘खुला पत्र’ है और प्रसंग में ऐसे पत्र का संकेत है जिस पर मुहर न लगी हो।
- source_word: בְּיָדוֹ
  choice: उसके हाथ में
  rationale: मूल पाठ की ठोस और दृश्यात्मक अभिव्यक्ति को बनाए रखता है।
