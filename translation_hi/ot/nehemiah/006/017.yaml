  text: גַּ֣ם בַּ/יָּמִ֣ים הָ/הֵ֗ם מַרְבִּ֞ים חֹרֵ֤י יְהוּדָה֙ אִגְּרֹ֣תֵי/הֶ֔ם הוֹלְכ֖וֹת עַל טוֹבִיָּ֑ה וַ/אֲשֶׁ֥ר לְ/טוֹבִיָּ֖ה בָּא֥וֹת אֲלֵי/הֶֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/017.yaml
  text: Also[a], in those days the nobles of Judah were sending many letters to Tobiah, and those from Tobiah were coming to them.
translation:
  language: hi
  text: उन दिनों भी यहूदा के प्रधान लोग तोबियाह को बहुत-से पत्र भेजते रहते थे, और तोबियाह के पत्र[a] उनके पास आते रहते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ है, “उनके पत्र तोबियाह को जाते थे, और जो तोबियाह के थे वे उनके पास आते थे।” दूसरे खंड में पहले खंड के आधार पर “पत्र” शब्द समझा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: भी
  rationale: यह आसपास के वर्णन में एक और परिस्थिति जोड़ता है; ‘भी’ इसके योगात्मक बल को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: בַּיָּמִים הָהֵם
  choice: उन दिनों
  rationale: यह मानक कालवाचक अभिव्यक्ति है और आधुनिक हिंदी में सहज तथा गरिमापूर्ण है।
- source_word: מַרְבִּים
  choice: बहुत-से ... भेजते रहते थे
  rationale: संदर्भ और कृदन्त रूप बार-बार चलने वाली पत्र-व्यवहार की क्रिया दर्शाते हैं, केवल संख्या की स्थिति नहीं।
- source_word: חֹרֵי יְהוּדָה
  choice: यहूदा के प्रधान लोग
  rationale: यह शब्द सामाजिक और राजनीतिक रूप से प्रतिष्ठित अगुओं को सूचित करता है; ‘प्रधान लोग’ सामान्य पाठक के लिए स्पष्ट है और पद को केवल औपचारिक अधिकारी तक सीमित नहीं करता।
- source_word: אִגְּרֹתֵיהֶם
  choice: पत्र
  rationale: यह लिखित पत्राचार का सामान्य शब्द है; हिंदी वाक्य में कर्ता से स्वामित्व स्पष्ट है।
- source_word: הוֹלְכוֹת עַל טוֹבִיָּה
  choice: तोबियाह को ... भेजते रहते थे
  rationale: शाब्दिक रूप से पत्र ‘तोबियाह को जाते’ थे; हिंदी में पत्र भेजने की अभिव्यक्ति गंतव्य और निरंतरता को स्वाभाविक ढंग से बताती है।
- source_word: וַאֲשֶׁר לְטוֹבִיָּה
  choice: तोबियाह के पत्र
  rationale: इब्रानी में ‘जो तोबियाह के थे’ कहा गया है और ‘पत्र’ पहले खंड से अध्याहृत है; मुख्य पाठ में इसे स्पष्ट किया गया है, जबकि पादटिप्पणी मूल की दीर्घवृत्तता बताती है।
- source_word: בָּאוֹת אֲלֵיהֶם
  choice: उनके पास आते रहते थे
  rationale: कृदन्त रूप निरंतर अथवा बार-बार होने वाली प्रत्युत्तरात्मक गतिविधि दर्शाता है; यह हिंदी में स्वाभाविक है।
