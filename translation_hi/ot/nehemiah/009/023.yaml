base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/023.yaml
  text: You multiplied their children like the stars of the heavens[c][b][a], and you brought them into the land that you had told their fathers to enter and possess.
translation:
  language: hi
  text: तूने उनकी सन्तान को आकाश के तारों के समान[a] असंख्य किया, और तू उन्हें उस देश में ले आया जिसमें प्रवेश करने और उस पर अधिकार करने के लिए तूने उनके पूर्वजों से कहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह वाक्यांश कुलपिताओं से की गई परमेश्वर की प्रतिज्ञा की प्रतिध्वनि है।
    reason: cross_reference
lexical_decisions:
- source_word: וּבְנֵיהֶם
  choice: उनकी सन्तान
  rationale: בנים का मूल अर्थ ‘पुत्र’ हो सकता है, पर राष्ट्रीय वृद्धि के इस सन्दर्भ में यह व्यापक रूप से वंशजों या सन्तान को दर्शाता है। ‘सन्तान’ स्त्री-पुरुष दोनों वंशजों को समेटता है और पारिवारिक भाव बनाए रखता है।
- source_word: הִרְבִּיתָ
  choice: बहुत बढ़ाया
  rationale: רבה के हिफ़ील रूप में किसी को बहुत या असंख्य कर देने का भाव है। यह प्रयोग परमेश्वर की प्रत्यक्ष क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כְּכֹכְבֵי הַשָּׁמָיִם
  choice: आकाश के तारों के समान
  rationale: यह निकट औपचारिक समतुल्य है और कुलपिताओं से की गई प्रतिज्ञा की प्रतिध्वनि को सुरक्षित रखता है।
- source_word: וַתְּבִיאֵם
  choice: तू उन्हें ... ले आया
  rationale: בוא का हिफ़ील रूप ‘ले आना’ या ‘प्रवेश कराना’ है। यहाँ ‘ले आया’ भूमि में पहुँचाने की क्रिया को सहज ढंग से बताता है।
- source_word: אֶל הָאָרֶץ
  choice: उस देश में
  rationale: गति-सूचक क्रिया के साथ हिन्दी का ‘में ले आया’ देश के भीतर प्रवेश का अर्थ स्पष्ट करता है।
- source_word: אֲשֶׁר אָמַרְתָּ לַאֲבֹתֵיהֶם
  choice: जिसके विषय में तूने उनके पूर्वजों से कहा था
  rationale: इब्रानी संरचना उस देश को परमेश्वर के पहले कहे हुए वचन से जोड़ती है। ‘पूर्वजों’ में कुलपिताओं का सन्दर्भ स्वाभाविक रूप से समाहित है।
- source_word: לָבוֹא
  choice: प्रवेश करके
  rationale: בוא का क्रियार्थक संज्ञा-रूप देश में भीतर जाने को व्यक्त करता है; अगले क्रिया-रूप के साथ ‘प्रवेश करके’ स्वाभाविक हिन्दी क्रम देता है।
- source_word: לָרָשֶׁת
  choice: उसे अपने अधिकार में कर लें
  rationale: ירשׁ यहाँ भूमि पर अधिकार प्राप्त करने का अर्थ देता है। यह ‘अधिकार में लेना/करना’ और कभी-कभी ‘विरासत में पाना’ दोनों से जुड़ी अर्थ-सीमा को सन्दर्भानुकूल ढंग से व्यक्त करता है।
theological_decisions:
- issue: कुलपिताओं से की गई प्रतिज्ञा की प्रतिध्वनि
  choice: ‘आकाश के तारों के समान’ वाक्यांश को बनाए रखा गया
  alternative: ‘बहुत बड़ी संख्या में’ जैसे अधिक सामान्य शब्द
  rationale: मूल भाषा जानबूझकर कुलपिताओं से की गई वंश-वृद्धि की प्रतिज्ञा को प्रतिध्वनित करती है; विशिष्ट उपमा बनाए रखने से यह सम्बन्ध बिना व्याख्यात्मक विस्तार के सुरक्षित रहता है।
- issue: ירשׁ में अधिकार और विरासत का अर्थ-संबंध
  choice: ‘अपने अधिकार में कर लें’
  alternative: ‘विरासत में पा लें’
  rationale: इस प्रसंग में देश में प्रवेश कर उस पर अधिकार पाने की क्रिया प्रमुख है। ‘विरासत’ सम्भव अर्थ है, पर उसे मुख्य पाठ में रखने से तत्काल विजय-अधिकार का भाव कम स्पष्ट हो सकता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामूहिक प्रार्थना के अनुकूल शैली अपनाई गई है। परमेश्वर के लिए एकवचन ‘तू’ मूल इब्रानी सम्बोधन और अध्याय की प्रार्थना-शैली को दर्शाता है। ‘सन्तान’, ‘पूर्वजों’ और ‘अपने अधिकार में’ सामान्य पाठकों के लिए स्पष्ट हैं, जबकि प्रतिज्ञा-संबंधी भाषा भी बनी रहती है।
