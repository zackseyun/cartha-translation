base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/006.yaml
  text: You alone are Yahweh[a]. You made the heavens, the highest heavens and all their host, the earth and all that is on it, the seas and all that is in them; and you preserve all of them alive[c][b], and the host of heaven bows down to you.
translation:
  language: hi
  text: केवल आप ही याहवे[a] हैं। आपने आकाशों को, आकाशों के सबसे ऊँचे आकाश को[b] और उनके समस्त गण को, पृथ्वी को और उस पर की सारी वस्तुओं को, समुद्रों को और उनमें की सारी वस्तुओं को बनाया। आप उन सबको जीवित रखते हैं[c], और आकाश का समस्त गण आपको दण्डवत करता है[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: יהוה (याहवे), परमेश्वर का व्यक्तिगत नाम।'
    reason: divine_name
  - marker: b
    text: 'शाब्दिक अर्थ: “आकाशों के आकाश,” अर्थात सबसे ऊँचे आकाश।'
    reason: lexical_alternative
  - marker: c
    text: या “आप उन सबको जीवन देते हैं।”
    reason: alternative_reading
  - marker: d
    text: या “स्वर्गीय गण आपको दण्डवत करता है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: אַתָּה הוּא ... לְבַדֶּךָ
  choice: केवल आप ही ... हैं
  rationale: दो स्वतंत्र सर्वनामों और ‘अकेले’ के संयुक्त बल को स्वाभाविक, जोरदार हिन्दी में व्यक्त करता है।
- source_word: עָשִׂיתָ
  choice: बनाईं
  rationale: सामान्य क्रिया עשה का सीधा अर्थ ‘बनाना’ है; ‘सृष्टि की’ कहने से भिन्न इब्रानी क्रिया का विशिष्ट अर्थ अनावश्यक रूप से आरोपित होता।
- source_word: הַשָּׁמַיִם
  choice: आकाश
  rationale: सृष्टि-वर्णन में हिन्दी का ‘आकाश’ स्वाभाविक रूप से ऊपरी व्यापक क्षेत्र को व्यक्त करता है।
- source_word: שְׁמֵי הַשָּׁמַיִם
  choice: सबसे ऊँचे आकाश
  rationale: शाब्दिक ‘आकाशों के आकाश’ इब्रानी की उत्कृष्टता-सूचक रचना है; मुख्य पाठ में उसका स्वाभाविक हिन्दी अर्थ दिया गया है।
- source_word: צְבָאָם
  choice: उनके सारे गण
  rationale: ‘गण’ खगोलीय पिंडों और स्वर्गीय प्राणियों—दोनों की सम्भावना को ‘तारे’ या ‘सेना’ की अपेक्षा अधिक खुला रखता है।
- source_word: הָאָרֶץ וְכָל אֲשֶׁר עָלֶיהָ
  choice: पृथ्वी और उस पर की सारी वस्तुएँ
  rationale: यहाँ אֶרֶץ पूरी पृथ्वी को सूचित करता है; यह हिन्दी अभिव्यक्ति व्यापक और सहज है।
- source_word: הַיַּמִּים וְכָל אֲשֶׁר בָּהֶם
  choice: समुद्र और उनमें की सारी वस्तुएँ
  rationale: बहुवचन יַמִּים और उसके भीतर की समस्त सृष्टि को सीधा व्यक्त करता है।
- source_word: מְחַיֶּה
  choice: जीवन देते रहते हैं
  rationale: पिएल कृदन्त की निरन्तर क्रिया और ‘जीवन देना/जीवित रखना’ दोनों अर्थ-छायाओं को यथासम्भव साथ रखता है।
- source_word: וּצְבָא הַשָּׁמַיִם
  choice: आकाश का गण
  rationale: सामूहिक צבא को व्यापक रखता है; सन्दर्भ में इसे स्वर्गीय गण भी समझा जा सकता है।
- source_word: מִשְׁתַּחֲוִים
  choice: आपके सामने दण्डवत करता है
  rationale: हिष्टपेल क्रिया के झुककर आदर/आराधना करने के भाव को गरिमापूर्ण और परिचित हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: याहवे की अद्वितीयता
  choice: केवल आप ही याहवे हैं
  alternative: आप ही अकेले याहवे हैं
  rationale: इब्रानी की जोरदार सर्वनाम-रचना और לְבַדֶּךָ की अनन्यता को स्पष्ट, स्वाभाविक हिन्दी में रखा गया है।
- issue: מְחַיֶּה में जीवन देना अथवा जीवित बनाए रखना
  choice: आप उन सबको जीवन देते रहते हैं
  alternative: आप उन सबको जीवित रखते हैं
  rationale: रचना के निरन्तर पक्ष को व्यक्त करते हुए मूल क्रिया की जीवन देने और बनाए रखने की अर्थगत व्यापकता को पूरी तरह एक ओर सीमित नहीं किया गया।
- issue: आकाश के गण की पहचान
  choice: आकाश का गण
  alternative: स्वर्गीय गण
  rationale: मूल पद खगोलीय समूह अथवा स्वर्गीय प्राणियों की ओर संकेत कर सकता है; मुख्य पाठ व्यापक रखा गया और विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सार्वजनिक पाठ के योग्य शैली रखी गई है। परमेश्वर के लिए आदरसूचक ‘आप’ प्रयुक्त है। ‘गण’ जानबूझकर व्यापक रखा गया है ताकि खगोलीय पिंडों और स्वर्गीय प्राणियों के बीच मूल की सम्भावित अस्पष्टता बनी रहे।
