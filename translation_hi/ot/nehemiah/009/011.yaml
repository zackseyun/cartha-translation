base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/011.yaml
  text: You split the sea before them[a], and they passed through the midst of the sea on dry ground[b]; and you threw their pursuers into the depths like a stone in mighty waters.
translation:
  language: hi
  text: तूने उनके सामने समुद्र को चीर दिया[a], और वे सूखी भूमि पर समुद्र के बीच से होकर पार गए; तूने उनका पीछा करने वालों को गहराइयों में फेंक दिया, प्रचंड जल में पत्थर की तरह।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘समुद्र को बाँट दिया।’
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּקַעְתָּ
  choice: चीर दिया
  rationale: בקע समुद्र को चीरने या दो भागों में खोलने की सजीव क्रिया व्यक्त करता है। ‘चीर दिया’ आधुनिक हिन्दी में स्वाभाविक है और भौतिक चित्र को बनाए रखता है।
- source_word: לִפְנֵיהֶם
  choice: उनके सामने
  rationale: यह פָּנִים के साथ प्रयुक्त पूर्वसर्ग का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: וַיַּעַבְרוּ בְתוֹךְ הַיָּם
  choice: वे ... समुद्र के बीच से होकर पार गए
  rationale: עבר पार जाने को और תוֹךְ समुद्र के भीतर/बीच के स्थान को व्यक्त करता है; संयुक्त वाक्यांश दोनों तत्वों को स्पष्ट रखता है।
- source_word: בַּיַּבָּשָׁה
  choice: सूखी भूमि पर
  rationale: यह समुद्रतल की चमत्कारिक सूखी दशा को स्पष्ट और मुहावरेदार हिन्दी में व्यक्त करता है।
- source_word: רֹדְפֵיהֶם
  choice: उनका पीछा करनेवालों
  rationale: רדף का कृदन्त उन लोगों को दर्शाता है जो उनका पीछा कर रहे थे; यह रूप ‘सतानेवालों’ जैसी अनावश्यक व्यापकता से बचता है।
- source_word: הִשְׁלַכְתָּ
  choice: फेंक दिया
  rationale: שלך के हिफ़ील रूप की प्रत्यक्ष कारक क्रिया को सरल आधुनिक हिन्दी में दर्शाता है।
- source_word: בִמְצוֹלֹת
  choice: गहराइयों में
  rationale: מְצוֹלוֹת विशेषतः समुद्र की गहरी जगहों को दर्शाता है; बहुवचन ‘गहराइयों’ स्रोत की आकृति बनाए रखता है।
- source_word: כְּמוֹ אֶבֶן
  choice: जैसे ... पत्थर को
  rationale: सरल उपमा को हिन्दी वाक्य-विन्यास के अनुसार स्वाभाविक रूप में सुरक्षित रखा गया है।
- source_word: בְּמַיִם עַזִּים
  choice: प्रचंड जल में
  rationale: עַזִּים जल की शक्ति और तीव्रता व्यक्त करता है। ‘प्रचंड’ ऊँचे प्रार्थनात्मक स्वर में स्वाभाविक है और ‘उफनते’ जैसा अतिरिक्त दृश्य विवरण नहीं जोड़ता।
theological_decisions:
- issue: निर्गमन की घटना में परमेश्वर की प्रत्यक्ष क्रिया
  choice: दूसरे पुरुष एकवचन ‘तूने ... चीर दिया’ और ‘तूने ... फेंक दिया’ बनाए रखना
  alternative: अप्रत्यक्ष या कर्मवाच्य रूप जो संबोधन को धुँधला कर दे
  rationale: यह सामुदायिक प्रार्थना में परमेश्वर के ऐतिहासिक उद्धारकारी कार्यों का सीधा स्मरण है। मूल के प्रत्यक्ष संबोधन को बनाए रखने से उसका स्तुतिपरक और धर्मवैचारिक बल सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण प्रार्थनात्मक शैली रखी गई है। मूल में परमेश्वर को एकवचन निकट संबोधन है, इसलिए ‘तूने’ प्रयुक्त हुआ है। वाक्य को सहज बनाने के लिए दूसरे खंड में कर्ता ‘तूने’ दोहराया गया है।
