base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/015.yaml
  text: You gave them bread from heaven for their hunger[a], and you brought out water from the rock for their thirst, and you told them to go in to possess the land that you had sworn to give them.
translation:
  language: hi
  text: उनकी भूख मिटाने के लिए तूने उन्हें आकाश से रोटी दी, और उनकी प्यास बुझाने के लिए चट्टान से पानी निकाला। तूने उनसे कहा कि वे उस भूमि में प्रवेश करके उस पर अधिकार करें, जिसे उन्हें देने के लिए तूने अपना हाथ उठाया था[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात्, “जिसे उन्हें देने की तूने शपथ खाई थी।” इब्रानी में शाब्दिक रूप से “अपना हाथ उठाया था” है, जो शपथ लेने का मुहावरा है।
    reason: इब्रानी शपथ-मुहावरे का अर्थ स्पष्ट करना।
lexical_decisions:
- source_word: לֶחֶם מִשָּׁמַיִם
  choice: आकाश से रोटी
  rationale: इब्रानी के ठोस बिंब ‘आकाश से रोटी’ को बनाए रखा गया है; यहाँ मन्ना अभिप्रेत है, पर उसे स्पष्ट करके मूल के संकेतात्मक स्वर को सीमित नहीं किया गया।
- source_word: לִרְעָבָם / לִצְמָאָם
  choice: उनकी भूख मिटाने के लिए / उनकी प्यास बुझाने के लिए
  rationale: लामेद वाले दोनों समानांतर पदों का प्रयोजनात्मक भाव स्वाभाविक हिन्दी में व्यक्त किया गया है और काव्यात्मक समानता भी सुरक्षित है।
- source_word: מַיִם מִסֶּלַע הוֹצֵאתָ
  choice: चट्टान से पानी निकाला
  rationale: हिफ़ील क्रिया के कारक भाव को ‘निकाला’ स्वाभाविक और संक्षिप्त रूप से व्यक्त करता है; ‘चट्टान’ को अनावश्यक रूप से निश्चित नहीं बनाया गया।
- source_word: לָבוֹא לָרֶשֶׁת אֶת־הָאָרֶץ
  choice: उस देश में प्रवेश करके उस पर अधिकार करें
  rationale: בוא के प्रवेश और ירשׁ के भूमि पर अधिकार पाने—दोनों भाव स्पष्ट रखे गए हैं; ‘विरासत में लें’ यहाँ अपेक्षाकृत निष्क्रिय अर्थ दे सकता था।
- source_word: נָשָׂאתָ אֶת־יָדְךָ
  choice: तूने अपना हाथ उठाया था
  rationale: शपथ लेने के इब्रानी मुहावरे का ठोस, मानवरूपी बिंब मुख्य पाठ में सुरक्षित रखा गया है; उसका आशय पादटिप्पणी में बताया गया है।
theological_decisions:
- issue: देश देने के विषय में परमेश्वर की शपथ का मानवरूपी मुहावरा
  choice: मुख्य पाठ में ‘तूने अपना हाथ उठाया था’
  alternative: ‘तूने शपथ खाई थी’
  rationale: मूल इब्रानी में हाथ उठाने का बिंब शपथ का द्योतक है। बिंब को मुख्य पाठ में रखने से वाचा-संबंधी भाषा की मूल बनावट बनी रहती है, जबकि पादटिप्पणी आधुनिक पाठक के लिए उसका मुहावरेदार अर्थ स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में प्रार्थनात्मक संबोधन के लिए एकवचन ‘तू’ रखा गया है। भाषा सरल और गरिमापूर्ण है; भूख और प्यास के समानांतर पदों को स्वाभाविक हिन्दी में संतुलित किया गया है।
