  text: וַ/יָּבֹ֤אוּ הַ/בָּנִים֙ וַ/יִּֽירְשׁ֣וּ אֶת הָ/אָ֔רֶץ וַ/תַּכְנַ֨ע לִ/פְנֵי/הֶ֜ם אֶת יֹשְׁבֵ֤י הָ/אָ֨רֶץ֙ הַ/כְּנַ֣עֲנִ֔ים וַֽ/תִּתְּנֵ֖/ם בְּ/יָדָ֑/ם וְ/אֶת מַלְכֵי/הֶם֙ וְ/אֶת עַֽמְמֵ֣י הָ/אָ֔רֶץ לַ/עֲשׂ֥וֹת בָּ/הֶ֖ם כִּ/רְצוֹנָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/024.yaml
  text: So the sons came in and took possession of the land[a], and you subdued before them the inhabitants of the land, the Canaanites, and gave them into their hand, both their kings and the peoples of the land[c][b], to do with them according to their will.
translation:
  language: hi
  text: तब उनके पुत्र आए और उन्होंने उस देश पर अधिकार कर लिया[a]। तूने उस देश के निवासियों, अर्थात् कनानियों को उनके सामने अधीन कर दिया और उन्हें—उनके राजाओं और उस देश के जनसमूहों समेत—उनके हाथ में कर दिया[b], ताकि वे उनके साथ अपनी इच्छा के अनुसार व्यवहार करें[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘पुत्र’; संदर्भ में पूर्वजों के वंशज, अर्थात् इस्राएली।
    reason: lexical_alternative
  - marker: b
    text: ‘उनके हाथ में कर दिया’ का अर्थ है ‘उनके अधिकार में कर दिया।’
    reason: idiom_clarification
  - marker: c
    text: या ‘ताकि वे उनके साथ जैसा चाहें वैसा करें।’
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבָּנִים
  choice: उनके बेटे
  rationale: हिब्रू में शाब्दिक रूप से ‘बेटे’ है और संदर्भ में इससे उन पूर्वजों के वंशज अभिप्रेत हैं जो कनान में आए। मुख्य पाठ में पारिवारिक-वंशगत भाषा सुरक्षित रखी गई है।
- source_word: וַיִּירְשׁוּ אֶת הָאָרֶץ
  choice: उस देश पर अधिकार कर लिया
  rationale: भूमि के संदर्भ में ירשׁ का अर्थ उत्तराधिकार पाने के साथ-साथ अधिकार में लेना भी है। यहाँ विजय और बसने के प्रसंग में ‘अधिकार कर लिया’ स्वाभाविक और सटीक है।
- source_word: וַתַּכְנַע לִפְנֵיהֶם
  choice: उनके सामने अधीन कर दिया
  rationale: כנע यहाँ कनानियों को इस्राएलियों के अधीन लाने की परमेश्वर की क्रिया बताता है; यह सैन्य-राजनीतिक बल को कम नहीं करता।
- source_word: יֹשְׁבֵי הָאָרֶץ הַכְּנַעֲנִים
  choice: उस देश के निवासियों, अर्थात् कनानियों
  rationale: ‘निवासियों’ participial अभिव्यक्ति को सीधे रखता है और ‘अर्थात्’ कनानियों को उन्हीं निवासियों की पहचान के रूप में स्पष्ट करता है।
- source_word: וַתִּתְּנֵם בְּיָדָם
  choice: उन्हें ... उनके हाथ में कर दिया
  rationale: हिब्रू के ‘हाथ में देना’ मुहावरे की सत्ता और नियंत्रण की छवि हिंदी में भी समझ में आती है, इसलिए उसे बनाए रखा गया है।
- source_word: מַלְכֵיהֶם
  choice: उनके राजाओं
  rationale: सर्वनाम-प्रत्यय स्वाभाविक रूप से कनानियों अथवा देश के निवासियों की ओर लौटता है।
- source_word: עַמְמֵי הָאָרֶץ
  choice: उस देश की जातियों
  rationale: बहुवचन עַמְמֵי अलग-अलग जनसमूहों को सूचित करता है; ‘जातियों’ आधुनिक बाइबलीय हिंदी में संक्षिप्त और सुबोध है।
- source_word: לַעֲשׂוֹת בָּהֶם כִּרְצוֹנָם
  choice: ताकि वे उनके साथ अपनी इच्छा के अनुसार व्यवहार करें
  rationale: यह उद्देश्यसूचक रचना और ‘उनकी इच्छा के अनुसार’ का अर्थ बनाए रखते हुए स्वाभाविक हिंदी देता है।
theological_decisions:
- issue: ‘बेटों’ का संदर्भ
  choice: मुख्य पाठ में ‘उनके बेटे’ रखकर इसे पहले उल्लिखित पूर्वजों के वंशजों से जोड़ा गया है।
  alternative: ‘उनके वंशज’ या ‘इस्राएली’
  rationale: व्याख्यात्मक विकल्प संदर्भ को स्पष्ट करते हैं, पर हिब्रू की पारिवारिक-वाचा संबंधी भाषा को समतल कर देते हैं; इसलिए शाब्दिक छवि मुख्य पाठ में और स्पष्टीकरण पादटिप्पणी में रखा गया है।
- issue: विजय-वर्णन की तीव्रता
  choice: ‘अधीन कर दिया’ और ‘हाथ में कर दिया’ जैसी प्रबल भाषा बनाए रखी गई है।
  alternative: ‘उन्हें जीतने में सहायता की’ जैसी नरम अभिव्यक्ति
  rationale: मूल पाठ विजय में परमेश्वर की प्रत्यक्ष क्रिया और इस्राएल को मिले नियंत्रण को स्पष्ट रूप से कहता है; अनुवाद में इसे नरम करना उचित नहीं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। परमेश्वर को संबोधन में निकट और पारंपरिक एकवचन ‘तू’ प्रयुक्त है, जो इस प्रार्थना के प्रत्यक्ष संबोधन से मेल खाता है। विजय-संबंधी हिब्रू मुहावरों को अनावश्यक रूप से नरम नहीं किया गया।
