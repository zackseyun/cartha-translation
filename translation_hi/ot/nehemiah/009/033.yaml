source:
  edition: WLC
  text: וְ/אַתָּ֣ה צַדִּ֔יק עַ֖ל כָּל הַ/בָּ֣א עָלֵ֑י/נוּ כִּֽי אֱמֶ֥ת עָשִׂ֖יתָ וַ/אֲנַ֥חְנוּ הִרְשָֽׁעְנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/033.yaml
  text: Yet you are righteous in all that has come upon us[a], for you have acted faithfully, but we have acted wickedly.
translation:
  language: hi
  text: फिर भी, जो कुछ हम पर बीता है, उस सब में आप धर्मी हैं; क्योंकि आपने विश्वासयोग्यता से कार्य किया है[a], पर हमने दुष्टता की है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, शाब्दिक रूप से, “आपने सत्य किया,” अर्थात आपने विश्वासयोग्यता से कार्य किया।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: फिर भी, आप
  rationale: संदर्भ में यह इस्राएल के अपराध और परमेश्वर की धार्मिकता के बीच विरोध प्रकट करता है; ‘फिर भी’ आधुनिक हिन्दी में यह भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: צַדִּיק
  choice: धर्मी
  rationale: यह परमेश्वर की नैतिक और वाचागत सत्यनिष्ठा को, लोगों पर आई विपत्तियों के संबंध में, व्यक्त करता है; ‘धर्मी’ इसके व्यापक धर्मवैज्ञानिक भार को बनाए रखता है।
- source_word: עַל כָּל הַ/בָּא עָלֵי/נוּ
  choice: जो कुछ हम पर बीता है, उस सब में
  rationale: यह उन समस्त घटनाओं के संबंध या क्षेत्र को बताता है जिनमें परमेश्वर धर्मी ठहरते हैं। ‘हम पर बीता’ विपत्ति का भाव लिए हुए स्वाभाविक हिन्दी है।
- source_word: כִּי
  choice: क्योंकि
  rationale: 'यह पहले कथन का आधार प्रस्तुत करता है: परमेश्वर धर्मी हैं क्योंकि उनका आचरण विश्वासयोग्य रहा, जबकि लोगों ने दुष्टता की।'
- source_word: אֱמֶת עָשִׂיתָ
  choice: आपने विश्वासयोग्यता से काम किया
  rationale: शाब्दिक रूप से यह ‘आपने सत्य किया’ है, पर इस पदबंध में אֱמֶת विश्वसनीयता और विश्वासयोग्यता का भाव देता है। चुना हुआ रूप अर्थ को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
- source_word: וַ/אֲנַחְנוּ
  choice: पर हमने
  rationale: संयोजक यहाँ परमेश्वर के विश्वासयोग्य आचरण और लोगों की दुष्टता के बीच स्पष्ट विरोध स्थापित करता है।
- source_word: הִרְשָׁעְנוּ
  choice: दुष्टता की है
  rationale: हिफ़ील रूप दुष्ट आचरण करने या गलत करने को दर्शाता है; ‘दुष्टता की है’ हिन्दी में संक्षिप्त, स्वाभाविक और क्रियात्मक है।
theological_decisions:
- issue: न्याय के प्रसंग में परमेश्वर के चरित्र का वर्णन
  choice: लोगों पर जो कुछ बीता, उस सब में परमेश्वर को धर्मी स्वीकार किया गया है।
  alternative: आपने हमें उचित दंड दिया है।
  rationale: इब्रानी पाठ विपत्तियों के संबंध में परमेश्वर की धार्मिकता स्वीकार करता है, पर दंड की प्रक्रिया को इससे अधिक विशिष्ट नहीं बनाता। अनुवाद इस धर्मवैज्ञानिक तनाव और समुदाय की जवाबदेही को यथावत रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सार्वजनिक पाठ के अनुकूल रूप। आदरसूचक ‘आप’ सीधे ईश्वरीय संबोधन के लिए रखा गया है। ‘धर्मी’ और ‘विश्वासयोग्यता’ धर्मवैज्ञानिक अर्थ को बनाए रखते हैं, जबकि वाक्य-संरचना साधारण पाठक के लिए सहज है।
