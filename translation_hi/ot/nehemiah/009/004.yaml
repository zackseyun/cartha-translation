  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יָּ֜קָם עַֽל מַֽעֲלֵ֣ה הַ/לְוִיִּ֗ם יֵשׁ֨וּעַ וּ/בָנִ֜י קַדְמִיאֵ֧ל שְׁבַנְיָ֛ה בֻּנִּ֥י שֵׁרֵבְיָ֖ה בָּנִ֣י כְנָ֑נִי וַֽ/יִּזְעֲקוּ֙ בְּ/ק֣וֹל גָּד֔וֹל אֶל יְהוָ֖ה אֱלֹהֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/004.yaml
  text: Then Jeshua[a], Bani, Kadmiel, Shebaniah, Bunni, Sherebiah, Bani, and Kenani stood on the platform of the Levites, and they cried out with a loud voice to Yahweh their God.
translation:
  language: hi
  text: तब येशूअ, बानी, कदमीएल, शबन्याह, बुन्नी, शेरेब्याह, बानी और केनानी लेवियों की सीढ़ी[a] पर खड़े हुए और उन्होंने ऊँचे स्वर में अपने परमेश्वर याहवे को पुकारा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ ‘लेवियों की चढ़ाई/सीढ़ी’ है; इससे लेवियों से जुड़ा कोई ऊँचा स्थान या सीढ़ी भी अभिप्रेत हो सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: खड़े हुए
  rationale: यहाँ קום सभा में किसी स्थान पर खड़े होने की क्रिया बताता है; बहुवचन कर्ताओं के अनुरूप हिंदी में ‘खड़े हुए’ स्वाभाविक है।
- source_word: מַעֲלֵה הַלְוִיִּם
  choice: लेवियों की सीढ़ियों
  rationale: מַעֲלֵה चढ़ने की जगह, सीढ़ी अथवा ऊँचे स्थान को सूचित कर सकता है। मुख्य पाठ में ‘सीढ़ियों’ मूल बिंब को बनाए रखता है, जबकि पाद-टिप्पणी प्रसंगगत विकल्प स्पष्ट करती है।
- source_word: יֵשׁוּעַ וּבָנִי קַדְמִיאֵל שְׁבַנְיָה בֻּנִּי שֵׁרֵבְיָה בָּנִי כְנָנִי
  choice: येशूअ, बानी, कदमीएल, शबन्याह, बुन्नी, शेरेब्याह, बानी और कनानी
  rationale: नामों को इब्रानी रूपों के निकट देवनागरी में लिप्यंतरित किया गया है। मूल पाठ में ‘बानी’ दो बार है, इसलिए दोनों बार रखा गया है।
- source_word: וַיִּזְעֲקוּ
  choice: उन्होंने ... पुकारा
  rationale: זעק तीव्र पुकार को व्यक्त करता है, विशेषकर परमेश्वर की ओर की गई पुकार; ‘पुकारा’ हिंदी में दिशा और प्रार्थनात्मक भाव दोनों के लिए स्वाभाविक है।
- source_word: בְּקוֹל גָּדוֹל
  choice: ऊँचे स्वर से
  rationale: यह इब्रानी मुहावरे का स्पष्ट और स्वाभाविक हिंदी रूप है तथा पुकार की तीव्रता बनाए रखता है।
- source_word: אֶל יְהוָה
  choice: याहवे को
  rationale: אֶל पुकार की दिशा बताता है, और יְהוָה को उसके व्यक्तिगत वाचा-नाम के लिप्यंतरण ‘याहवे’ से प्रस्तुत किया गया है।
- source_word: אֱלֹהֵיהֶם
  choice: अपने परमेश्वर
  rationale: हिंदी में कर्ता के अपने परमेश्वर के लिए संबंधवाचक सर्वनाम का स्वाभाविक रूप ‘अपने’ है; यह इब्रानी प्रत्यय ‘उनके’ का आशय ठीक से देता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे सामान्य उपाधि में नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। वाक्य-रचना सार्वजनिक सभा और सामूहिक पुकार का भाव व्यक्त करती है; नामों तथा ईश्वरीय नाम को मूल इब्रानी के निकट लिप्यंतरित किया गया है।
