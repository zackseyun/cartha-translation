  text: וַ/יְמָאֲנ֣וּ לִ/שְׁמֹ֗עַ וְ/לֹא זָכְר֤וּ נִפְלְאֹתֶ֨י/ךָ֙ אֲשֶׁ֣ר עָשִׂ֣יתָ עִמָּ/הֶ֔ם וַ/יַּקְשׁוּ֙ אֶת עָרְפָּ֔/ם וַ/יִּתְּנוּ רֹ֛אשׁ לָ/שׁ֥וּב לְ/עַבְדֻתָ֖/ם בְּ/מִרְיָ֑/ם וְ/אַתָּה֩ אֱל֨וֹהַּ סְלִיח֜וֹת חַנּ֧וּן וְ/רַח֛וּם אֶֽרֶךְ אַפַּ֥יִם וְ/רַב ו/חסד וְ/לֹ֥א עֲזַבְתָּֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/017.yaml
  text: But they refused to listen and did not remember your wonders that you had done among them. They stiffened their necks and, in their rebellion, appointed a leader to return to their slavery. But you are a forgiving God[a], gracious and compassionate, slow to anger and abundant in steadfast love, and you did not forsake them.
translation:
  language: hi
  text: परन्तु उन्होंने सुनने से इनकार किया और आपके उन अद्भुत कामों को याद नहीं रखा जो आपने उनके बीच किए थे। उन्होंने हठ किया और अपने विद्रोह में एक अगुआ ठहराया, ताकि वे फिर अपनी गुलामी में लौट जाएँ। परन्तु आप क्षमा करने वाले परमेश्वर[a], अनुग्रहकारी और करुणामय, क्रोध करने में धीरजवन्त और अटल प्रेम से भरपूर हैं; और आपने उन्हें त्याग नहीं दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “क्षमाओं के परमेश्वर”; इब्रानी में बहुवचन उनकी भरपूर क्षमा पर बल देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָאֲנוּ לִשְׁמֹעַ
  choice: उन्होंने सुनने से इनकार किया
  rationale: मָאֵן स्पष्ट इनकार व्यक्त करता है। שׁמע में आज्ञा मानने का भाव निहित हो सकता है, पर ‘सुनने’ से मूल शब्दावली और उसका निहितार्थ दोनों बने रहते हैं।
- source_word: נִפְלְאֹתֶיךָ אֲשֶׁר עָשִׂיתָ עִמָּהֶם
  choice: आपके उन अद्भुत कामों को ... जो आपने उनके बीच किए थे
  rationale: נפלאות असाधारण, विस्मयकारी कार्यों को दर्शाता है; עִם यहाँ समुदाय के बीच किए गए कार्यों का स्वाभाविक भाव देता है।
- source_word: וַיַּקְשׁוּ אֶת־עָרְפָּם
  choice: उन्होंने हठ किया
  rationale: शाब्दिक ‘अपनी गर्दन कठोर की’ हठ और अड़ियल अवज्ञा का इब्रानी मुहावरा है। आधुनिक हिन्दी में ‘हठ किया’ अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיִּתְּנוּ רֹאשׁ
  choice: एक अगुआ ठहराया
  rationale: शाब्दिक ‘एक सिर रखा/दिया’ का आशय किसी को नेतृत्व के लिए नियुक्त करना है। ‘अगुआ ठहराया’ संक्षिप्त और प्रसंगानुकूल है।
- source_word: לָשׁוּב לְעַבְדֻתָם בְּמִרְיָם
  choice: अपने विद्रोह में ... ताकि वे फिर अपनी गुलामी में लौट जाएँ
  rationale: במרים को अगुआ ठहराने की विद्रोही परिस्थिति से जोड़ा गया है; עבדות मिस्र की दासता के संदर्भ में ‘गुलामी’ है।
- source_word: אֱלוֹהַּ סְלִיחוֹת
  choice: क्षमा करने वाले परमेश्वर
  rationale: संज्ञा का बहुवचन प्रचुर क्षमा पर बल देता है। हिन्दी में गुणसूचक वाक्यांश इसका स्वाभाविक अर्थ देता है; स्रोत की विशिष्ट रचना पादटिप्पणी में सुरक्षित है।
- source_word: חַנּוּן וְרַחוּם
  choice: अनुग्रहकारी और करुणामय
  rationale: दोनों पद क्रमशः अनुग्रहपूर्ण पक्षधरता और कोमल दया को व्यक्त करते हैं; अलग हिन्दी शब्द अर्थभेद बनाए रखते हैं।
- source_word: אֶרֶךְ אַפַּיִם
  choice: क्रोध करने में धीरजवन्त
  rationale: यह इब्रानी मुहावरे का प्रचलित अर्थ है और परमेश्वर के क्रोध में विलम्ब तथा धैर्य को व्यक्त करता है।
- source_word: רַב־חֶסֶד
  choice: अटल प्रेम से भरपूर
  rationale: חסד में प्रेम, निष्ठा और दृढ़ प्रतिबद्धता साथ जुड़े हैं। ‘अटल प्रेम’ इस व्यापक संबंधपरक अर्थ को सहज हिन्दी में रखता है।
- source_word: וְלֹא עֲזַבְתָּם
  choice: और आपने उन्हें त्याग नहीं दिया
  rationale: עזב का संबंधपरक और वाचागत बल ‘त्याग देना’ से स्पष्ट रूप से व्यक्त होता है।
theological_decisions:
- issue: परमेश्वर के क्षमाशील स्वभाव का बहुवचनात्मक इब्रानी वर्णन
  choice: क्षमा करने वाले परमेश्वर[a]
  alternative: क्षमाओं के परमेश्वर
  rationale: मुख्य पाठ में स्वाभाविक हिन्दी रखी गई है, जबकि אֱלוֹהַּ סְלִיחוֹת का असामान्य बहुवचन और उसकी प्रचुरता पादटिप्पणी में बताई गई है।
- issue: חסד का वाचागत और संबंधपरक अर्थ
  choice: अटल प्रेम
  alternative: करुणा; वाचा का प्रेम; निष्ठावान प्रेम
  rationale: ‘अटल प्रेम’ प्रेम और स्थिर निष्ठा दोनों को व्यक्त करता है, बिना पाठ में किसी संप्रदायगत व्याख्या को आरोपित किए।
- issue: שׁמע में सुनने और आज्ञापालन के बीच अर्थगत तनाव
  choice: सुनने से इनकार किया
  alternative: आज्ञा मानने से इनकार किया
  rationale: ‘सुनने’ से मूल क्रिया का सीधा अर्थ सुरक्षित है और प्रसंग में उसकी अवज्ञा का भाव पाठक के लिए खुला रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक पाठ के योग्य शैली। ईश्वर-संबोधन के लिए आदरसूचक ‘आप’ रखा गया है। ‘हठ किया’ जैसे स्वाभाविक मुहावरे से अपारदर्शी शाब्दिकता टाली गई है, जबकि प्रमुख स्रोतगत विशिष्टता पादटिप्पणी में दी गई है।
