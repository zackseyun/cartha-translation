  text: וּ/תְבוּאָתָ֣/הּ מַרְבָּ֗ה לַ/מְּלָכִ֛ים אֲשֶׁר נָתַ֥תָּה עָלֵ֖י/נוּ בְּ/חַטֹּאותֵ֑י/נוּ וְ/עַ֣ל גְּ֠וִיֹּתֵי/נוּ מֹשְׁלִ֤ים וּ/בִ/בְהֶמְתֵּ֨/נוּ֙ כִּ/רְצוֹנָ֔/ם וּ/בְ/צָרָ֥ה גְדוֹלָ֖ה אֲנָֽחְנוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/037.yaml
  text: Its abundant produce goes to the kings whom you have set over us because of our sins[a]. They rule over our bodies and over our livestock as they please[b], and we are in great distress.
translation:
  language: hi
  text: उस भूमि की भरपूर उपज उन राजाओं को मिलती है जिन्हें तूने हमारे पापों के कारण हमारे ऊपर नियुक्त किया है। वे अपनी इच्छा के अनुसार हमारी देहों[b] और हमारे पशुधन पर शासन करते हैं, और हम बड़े संकट में हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: या, ‘हमारे व्यक्तियों’; इब्रानी में, ‘हमारी देहों।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּתְבוּאָתָהּ מַרְבָּה
  choice: उसकी भरपूर उपज
  rationale: תְּבוּאָה भूमि की उपज या पैदावार को दर्शाता है और स्त्रीलिंग प्रत्यय पिछले पद में उल्लिखित भूमि की ओर संकेत करता है। מַרְבָּה यहाँ उसकी प्रचुरता व्यक्त करता है।
- source_word: לַמְּלָכִים
  choice: उन राजाओं के पास जाती है
  rationale: ל दिशा अथवा लाभ को दर्शाता है; यह स्वाभाविक हिन्दी स्पष्ट करती है कि भूमि की उपज राजाओं को प्राप्त होती है।
- source_word: אֲשֶׁר נָתַתָּה עָלֵינוּ
  choice: जिन्हें तूने ... हमारे ऊपर ठहराया है
  rationale: נתן के साथ עַל किसी को दूसरों के ऊपर नियुक्त या स्थापित करने का अर्थ देता है और ईश्वर की प्रत्यक्ष भूमिका को बनाए रखता है।
- source_word: בְּחַטֹּאותֵינוּ
  choice: हमारे पापों के कारण
  rationale: संदर्भ में ב कारण बताता है; अधीनता को समुदाय के पापों का परिणाम कहा गया है।
- source_word: גְּוִיֹּתֵינוּ
  choice: हमारे शरीरों
  rationale: גְּוִיָּה यहाँ मृतदेह नहीं, बल्कि शारीरिक व्यक्तित्व या देह को दर्शाता है; शाब्दिक अर्थ और उत्पीड़न का ठोस भाव दोनों सुरक्षित रहते हैं।
- source_word: מֹשְׁלִים
  choice: अधिकार चलाते हैं
  rationale: यह कृदन्त निरंतर शासन या प्रभुत्व को व्यक्त करता है; हिन्दी में यह वाक्यांश संदर्भानुकूल और सहज है।
- source_word: וּבִבְהֶמְתֵּנוּ
  choice: और हमारे पशुधन पर
  rationale: בְּהֵמָה सामूहिक रूप से पालतू पशुओं को दर्शाता है; ‘पशुधन’ व्यापक और आधुनिक हिन्दी शब्द है।
- source_word: כִּרְצוֹנָם
  choice: अपनी इच्छा के अनुसार
  rationale: यह राजाओं द्वारा अपनी मर्जी से शक्ति प्रयोग करने को दर्शाता है और मूल की औपचारिक अभिव्यक्ति के निकट रहता है।
- source_word: וּבְצָרָה גְדוֹלָה אֲנָחְנוּ
  choice: और हम बड़े संकट में हैं
  rationale: צָרָה विपत्ति, क्लेश या संकट को दर्शाता है; ‘बड़े संकट’ सामुदायिक विलाप की गंभीरता को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: विदेशी राजाओं के प्रभुत्व में ईश्वर की भूमिका
  choice: ईश्वर ने लोगों के पापों के कारण इन राजाओं को उनके ऊपर ठहराया।
  alternative: ईश्वर ने केवल उनके शासन की अनुमति दी; अथवा ईश्वर राजाओं के हर कार्य का अनुमोदन करता है।
  rationale: नָתַתָּה עָלֵינוּ अधीनता को सीधे ईश्वर के न्यायिक कार्य से जोड़ता है। अनुवाद इस भूमिका को सुरक्षित रखता है, पर यह अतिरिक्त निष्कर्ष नहीं जोड़ता कि ईश्वर शासकों के दमनकारी हर काम का अनुमोदन करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; प्रार्थना में परमेश्वर के लिए एकवचन आत्मीय ‘तू’ रखा गया है। भाषा dignified और सामान्य पाठकों के लिए स्पष्ट है। ‘शरीरों’ की कुछ असामान्य अभिव्यक्ति मूल इब्रानी की ठोस भाषा को सुरक्षित रखती है और इसलिए पादटिप्पणी दी गई है।
