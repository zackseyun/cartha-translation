base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/005.yaml
  text: Then the Levites—Jeshua[a], Kadmiel, Bani, Hashabneiah, Sherebiah, Hodiah, Shebaniah, and Pethahiah—said, “Stand up; bless Yahweh your God from everlasting to everlasting. Blessed be your glorious name[b], which is exalted above all blessing and praise.”
translation:
  language: hi
  text: तब लेवियों—येशूअ, कदमीएल, बानी, हशबन्याह, शेरेब्याह, होदियाह, शबन्याह और पतह्याह—ने कहा, “खड़े हो जाओ और अपने परमेश्वर यहोवा को अनादिकाल से अनन्तकाल तक धन्य कहो। और वे आपके महिमामय नाम को धन्य कहें[a], जो हर आशीर्वचन और स्तुति से ऊँचा है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी क्रिया तृतीय पुरुष बहुवचन में इच्छार्थक भाव रखती है; उसका कर्ता स्पष्ट नहीं है।
    reason: grammatical_note
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; आधुनिक हिन्दी में ‘तब’ क्रम को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הַלְוִיִּם
  choice: लेवियों
  rationale: समुदायगत पदनाम का प्रचलित हिन्दी रूप; कर्ता के रूप में ‘ने’ के साथ बहुवचन तिर्यक रूप लिया गया है।
- source_word: יֵשׁוּעַ וְקַדְמִיאֵל בָּנִי חֲשַׁבְנְיָה שֵׁרֵבְיָה הוֹדִיָּה שְׁבַנְיָה פְתַחְיָה
  choice: येशूअ, कदमीएल, बानी, हशबन्याह, शेरेब्याह, होदियाह, शबन्याह और पतह्याह
  rationale: व्यक्तिनामों का हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: קוּמוּ
  choice: खड़े हो जाओ
  rationale: बहुवचन आज्ञार्थक रूप सभा को शारीरिक रूप से उठने का आह्वान करता है; यह वर्तमान हिन्दी में सहज है।
- source_word: בָּרֲכוּ
  choice: धन्य कहो
  rationale: परमेश्वर को संबोधित ברך का अर्थ केवल सामान्य प्रशंसा नहीं, उन्हें धन्य घोषित करना है; ‘धन्य कहो’ मूल शब्द-परिवार का भाव रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: टेट्राग्राम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित व्यक्तिनाम ‘यहोवा’ द्वारा प्रस्तुत किया गया है।
- source_word: אֱלֹהֵיכֶם
  choice: अपने परमेश्वर
  rationale: द्वितीय पुरुष बहुवचन संबंधसूचक अर्थ को आज्ञा के हिन्दी वाक्य-विन्यास में स्वाभाविक ‘अपने’ से व्यक्त किया गया है।
- source_word: מִן הָעוֹלָם עַד הָעוֹלָם
  choice: अनादिकाल से अनन्तकाल तक
  rationale: यह मुहावरा असीम अवधि व्यक्त करता है; हिन्दी में यह गरिमापूर्ण और बोधगम्य समतुल्य है।
- source_word: וִיבָרְכוּ
  choice: और लोग ... धन्य कहें
  rationale: मासोरेटिक पाठ में क्रिया तृतीय पुरुष बहुवचन इच्छार्थक है। हिन्दी में अस्पष्ट निहित कर्ता को सामान्य ‘लोग’ से हल्के ढंग से प्रकट किया गया है, जबकि पाठ की व्यक्ति-परिवर्तन की कठिनाई पादटिप्पणी में सुरक्षित है।
- source_word: שֵׁם כְּבוֹדֶךָ
  choice: आपके महिमामय नाम
  rationale: शाब्दिक ‘आपकी महिमा का नाम’ की अपेक्षा यह स्वाभाविक हिन्दी है और नाम के महिमायुक्त होने का भाव रखती है।
- source_word: וּמְרוֹמַם
  choice: जो ... परे ऊँचा है
  rationale: पुअल कृदन्त परमेश्वर के नाम की उन्नत स्थिति बताता है; संबंधवाचक उपवाक्य हिन्दी में स्पष्ट है।
- source_word: עַל כָּל בְּרָכָה וּתְהִלָּה
  choice: सारी स्तुति और प्रशंसा से परे
  rationale: यह अभिव्यक्ति बताती है कि परमेश्वर का नाम मनुष्य की हर आशीर्वचनात्मक स्तुति और प्रशंसा से ऊपर है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल में वाचा का व्यक्तिनाम है। हिन्दी पाठकों के लिए प्रचलित नामरूप ‘यहोवा’ उसे उपाधि में विलीन किए बिना सुरक्षित रखता है।
- issue: וִיבָרְכוּ का पुरुष और वचन
  choice: और लोग ... धन्य कहें
  alternative: आपका महिमामय नाम धन्य हो
  rationale: WLC का स्वरित रूप तृतीय पुरुष बहुवचन इच्छार्थक है, न कि एकवचन निष्क्रिय ‘धन्य हो’। यद्यपि कर्ता अनिर्दिष्ट है और अगली पंक्ति द्वितीय पुरुष में परमेश्वर को संबोधित करती है, अनुवाद मूल की व्याकरणिक कठिनाई को पादटिप्पणी सहित बनाए रखता है।
- issue: परमेश्वर के प्रति संबोधन का हिन्दी सर्वनाम
  choice: आपके
  alternative: तेरे / तुम्हारे
  rationale: मूल का द्वितीय पुरुष एकवचन रूप रखा गया है; आधुनिक सार्वजनिक उपासना की गरिमा और सामान्य हिन्दी प्रयोग के लिए आदरसूचक एकवचन ‘आप’ चुना गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण सार्वजनिक उपासना-शैली। नामों का स्रोत-सन्निकट लिप्यंतरण किया गया है। ‘स्तुति और प्रशंसा’ में मूल के בְּרָכָה और תְהִלָּה का भेद यथासंभव रखा गया है।
