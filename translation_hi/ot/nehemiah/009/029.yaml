source:
  edition: WLC
  text: וַ/תָּ֨עַד בָּ/הֶ֜ם לַ/הֲשִׁיבָ֣/ם אֶל תּוֹרָתֶ֗/ךָ וְ/הֵ֨מָּה הֵזִ֜ידוּ וְ/לֹא שָׁמְע֤וּ לְ/מִצְוֺתֶ֨י/ךָ֙ וּ/בְ/מִשְׁפָּטֶ֣י/ךָ חָֽטְאוּ בָ֔/ם אֲשֶׁר יַעֲשֶׂ֥ה אָדָ֖ם וְ/חָיָ֣ה בָ/הֶ֑ם וַ/יִּתְּנ֤וּ כָתֵף֙ סוֹרֶ֔רֶת וְ/עָרְפָּ֥/ם הִקְשׁ֖וּ וְ/לֹ֥א שָׁמֵֽעוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/029.yaml
  text: You warned them in order to bring them back to your law[a], but they acted presumptuously and did not listen to your commandments; they sinned against your judgments, by which a man shall live if he does them. They gave a stubborn shoulder, stiffened their neck[b], and would not listen.
translation:
  language: hi
  text: तूने उन्हें अपनी व्यवस्था की ओर लौटाने के लिए चेताया, पर उन्होंने ढिठाई की और तेरी आज्ञाएँ नहीं मानीं। उन्होंने तेरी विधियों के विरुद्ध पाप किया; यदि कोई मनुष्य उनका पालन करे, तो वह उनके द्वारा जीवित रहेगा। उन्होंने हठ से अपना कंधा फेर लिया, अपनी गर्दन अकड़ा ली और सुनने से इनकार कर दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתָּעַד בָּהֶם
  choice: तूने उन्हें ... चेतावनी दी
  rationale: עוד के हिफ़ील रूप में यहाँ गंभीर चेतावनी देने का भाव है; हिन्दी में यह स्वाभाविक और प्रसंगानुकूल है।
- source_word: לַהֲשִׁיבָם אֶל תּוֹרָתֶךָ
  choice: अपनी व्यवस्था की ओर लौटा लाने के लिए
  rationale: हिफ़ील שׁוב का कारक अर्थ ‘लौटा लाना’ है और वाचा-संबंधी प्रसंग में תּוֹרָה के लिए ‘व्यवस्था’ उपयुक्त है।
- source_word: הֵזִידוּ
  choice: उन्होंने ढिठाई की
  rationale: यह क्रिया केवल घमंड नहीं, बल्कि धृष्ट और जानबूझकर किए गए विद्रोह को व्यक्त करती है।
- source_word: לֹא שָׁמְעוּ לְמִצְוֺתֶיךָ
  choice: तेरी आज्ञाएँ नहीं मानीं
  rationale: שׁמע यहाँ आज्ञाकारी होकर सुनने के अर्थ में है; हिन्दी में ‘आज्ञाएँ मानना’ यही आशय स्वाभाविक रूप से व्यक्त करता है।
- source_word: וּבְמִשְׁפָּטֶיךָ חָטְאוּ בָם
  choice: तेरे उन नियमों के विरुद्ध पाप किया
  rationale: מִשְׁפָּטִים परमेश्वर के विधिक नियमों को सूचित करता है और בְּ का विरोधात्मक संबंध ‘के विरुद्ध’ से स्पष्ट होता है।
- source_word: אֲשֶׁר יַעֲשֶׂה אָדָם וְחָיָה בָהֶם
  choice: जिन्हें यदि कोई मनुष्य माने, तो वह उनके द्वारा जीवित रहेगा
  rationale: यह लैव्यव्यवस्था 18:5 की प्रतिध्वनि है। אָדָם का सामान्य मानव-संदर्भ ‘कोई मनुष्य’ से सुरक्षित रहता है और ‘उनके द्वारा जीवित रहेगा’ मूल की अस्पष्ट वाचा-संबंधी अभिव्यक्ति को बनाए रखता है।
- source_word: וַיִּתְּנוּ כָתֵף סוֹרֶרֶת
  choice: उन्होंने हठ से अपना कंधा फेर लिया
  rationale: शाब्दिक रूपक को हिन्दी में समझने योग्य रखते हुए यह बोझ या जुए से हठपूर्वक कंधा हटा लेने की छवि व्यक्त करता है।
- source_word: וְעָרְפָּם הִקְשׁוּ
  choice: अपनी गर्दन अकड़ा ली
  rationale: यह हठ और अवज्ञा का इब्रानी रूपक है; हिन्दी में ‘गर्दन अकड़ाना’ स्वाभाविक समतुल्य है।
- source_word: וְלֹא שָׁמֵעוּ
  choice: सुनने से इनकार कर दिया
  rationale: अंतिम कथन लगातार और इच्छापूर्वक न सुनने को रेखांकित करता है।
theological_decisions:
- issue: नियमों को मानने और उनके द्वारा जीवित रहने का संबंध
  choice: जिन्हें यदि कोई मनुष्य माने, तो वह उनके द्वारा जीवित रहेगा
  alternative: जिनका पालन करने से मनुष्य जीवित रहता है
  rationale: चुना गया रूप शर्तात्मक वाक्य और भविष्य/परिणाम के तनाव को बनाए रखता है तथा ‘जीवन’ का अर्थ केवल भौतिक या केवल आत्मिक ठहराए बिना मूल की व्यापकता सुरक्षित रखता है।
- issue: אָדָם का सामान्य मानव-संदर्भ
  choice: कोई मनुष्य
  alternative: मनुष्य / कोई व्यक्ति
  rationale: ‘कोई मनुष्य’ एकवचन सामान्य अर्थ को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है; इसका आशय किसी एक पुरुष तक सीमित नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी; परमेश्वर के लिए एकवचन निकट संबोधन ‘तू/तेरी’; गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट शैली। मूल के कंधा फेरने और गर्दन अकड़ाने वाले दोनों रूपक सुरक्षित रखे गए हैं।
