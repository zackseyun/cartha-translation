id: NEH.9.7
reference: Nehemiah 9:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אַתָּה הוּא֙ יְהוָ֣ה הָ/אֱלֹהִ֔ים אֲשֶׁ֤ר בָּחַ֨רְתָּ֙ בְּ/אַבְרָ֔ם וְ/הוֹצֵאת֖/וֹ מֵ/א֣וּר כַּשְׂדִּ֑ים וְ/שַׂ֥מְתָּ שְּׁמ֖/וֹ אַבְרָהָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/007.yaml
  text: You are Yahweh God[a], who chose Abram, brought him out from Ur of the Chaldeans, and gave him the name Abraham.
translation:
  language: hi
  text: आप ही याहवे[a] परमेश्वर हैं, जिन्होंने अब्राम को चुना, उसे कसदियों के ऊर नगर से बाहर निकाला और उसका नाम अब्राहम रखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में यहाँ परमेश्वर का निज नाम YHWH है।
    reason: दिव्य नाम की पहचान स्पष्ट करना और पाठक को बताना कि “याहवे” किसी उपाधि का नहीं, इब्रानी नाम का रूप है।
lexical_decisions:
- source_word: אַתָּה הוּא
  choice: आप ही … हैं
  rationale: दो स्वतंत्र सर्वनामों की बलात्मक पहचान को स्वाभाविक आधुनिक हिन्दी में “आप ही” व्यक्त करता है। परमेश्वर को संबोधित करते हुए “आप” आदरपूर्ण और सहज है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय दिव्य नाम YHWH को किसी उपाधि से बदलने के बजाय उसके प्रचलित विद्वत्तापूर्ण उच्चारण के देवनागरी रूप में रखा गया है।
- source_word: הָאֱלֹהִים
  choice: परमेश्वर
  rationale: याहवे के साथ समानाधिकरण में आए पद को हिन्दी में स्वाभाविक और प्रतिष्ठित धार्मिक शब्द “परमेश्वर” से व्यक्त किया गया है।
- source_word: בָּחַרְתָּ בְּאַבְרָם
  choice: अब्राम को चुना
  rationale: בחר के साथ लगी इब्रानी संबंधसूचक पूर्वसर्ग को हिन्दी में सीधे कर्म “अब्राम को” के रूप में व्यक्त करना स्वाभाविक है; “चुना” मूल अर्थ को बिना अतिरिक्त धर्मवैज्ञानिक अर्थ जोड़े रखता है।
- source_word: וְהוֹצֵאתוֹ
  choice: उसे … से बाहर निकाला
  rationale: יצא के हिफ़ील रूप का कारक अर्थ स्पष्ट रूप से व्यक्त होता है और मूल की बाहर ले आने की छवि बनी रहती है।
- source_word: מֵאוּר כַּשְׂדִּים
  choice: कसदियों के ऊर नगर से
  rationale: भौगोलिक नाम को स्पष्ट करने के लिए “नगर” जोड़ा गया है; इससे ऊर को सामान्य हिन्दी शब्द समझ लेने की आशंका घटती है, जबकि “कसदियों के” मूल संबंध को बनाए रखता है।
- source_word: וְשַׂמְתָּ שְׁמוֹ אַבְרָהָם
  choice: उसका नाम अब्राहम रखा
  rationale: शाब्दिक “उसका नाम स्थापित किया” की अपेक्षा यह नामकरण के लिए स्वाभाविक हिन्दी है और अब्राम से अब्राहम हुए परिवर्तन को स्पष्ट रखती है।
theological_decisions:
- issue: दिव्य नाम YHWH का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में उपाधि नहीं बल्कि परमेश्वर का निज नाम है। “याहवे” नाम को प्रत्यक्ष रखता है; “प्रभु” उसे उपाधि से बदल देता, जबकि “यहोवा” बाद की मिश्रित उच्चारण-परंपरा को दर्शाता है।
- issue: אַתָּה הוּא में बल
  choice: आप ही … हैं
  alternative: आप … हैं
  rationale: “ही” मूल की बलात्मक सर्वनाम-रचना को सुरक्षित रखता है और प्रार्थना में परमेश्वर की विशिष्ट पहचान पर दिए गए जोर को व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, आदरपूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। परमेश्वर के लिए “आप” तथा सम्मानसूचक बहुवचन क्रियारूप “जिन्होंने” अपनाया गया है। वाक्य की प्रार्थनात्मक गरिमा बनाए रखते हुए शब्दावली सामान्य पाठक के लिए सहज रखी गई है।
