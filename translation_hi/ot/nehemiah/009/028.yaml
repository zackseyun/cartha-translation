base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/028.yaml
  text: But when they had rest, they again did evil before you; so you left them in the power of their enemies[a], who ruled over them. Then they returned and cried out to you, and from heaven you heard and delivered them many times according to your mercies.
translation:
  language: hi
  text: परन्तु जब उन्हें चैन मिला, तो वे तेरे सामने फिर बुराई करने लगे। इसलिए तूने उन्हें उनके शत्रुओं के वश में छोड़ दिया[a], और उनके शत्रुओं ने उन पर शासन किया। तब वे फिर लौटे और उन्होंने तुझे पुकारा। तूने स्वर्ग से उनकी पुकार सुनी और अपनी करुणा के अनुसार उन्हें बार-बार छुड़ाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उनके शत्रुओं के हाथ में”; यह इब्रानी मुहावरा उनके अधिकार या नियंत्रण में होने को दर्शाता है।
    reason: cultural_note
lexical_decisions:
- source_word: וּכְנוֹחַ לָהֶם
  choice: परन्तु जब उन्हें चैन मिला
  rationale: कालवाचक रचना उनके फिर भटकने की परिस्थिति बताती है, पर ‘तुरन्त’ का भाव नहीं देती। ‘चैन मिला’ נוח के विश्राम और विपत्ति से राहत के भाव को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יָשׁוּבוּ לַעֲשׂוֹת רַע
  choice: वे ... फिर बुराई करने लगे
  rationale: यहाँ שׁוב अगले क्रियार्थक रूप के साथ किसी काम को दोबारा करने का भाव देता है; इसे अगले וַיָּשׁוּבוּ के वास्तविक ‘लौटने’ से अलग रखा गया है।
- source_word: לְפָנֶיךָ
  choice: तेरे सामने
  rationale: यह मूल के ‘तेरे मुख/उपस्थिति के सामने’ वाले संबंधपरक भाव को बनाए रखता है और इसे केवल ‘तेरी दृष्टि में’ या स्पष्टतः ‘तेरे विरुद्ध’ नहीं बनाता।
- source_word: וַתַּעַזְבֵם בְּיַד אֹיְבֵיהֶם
  choice: तूने उन्हें उनके शत्रुओं के वश में छोड़ दिया
  rationale: עזב को ‘छोड़ दिया’ के रूप में रखा गया है, जो दण्ड की गंभीरता दिखाता है पर स्थायी त्याग का अतिरिक्त अर्थ नहीं जोड़ता। ‘वश में’ हाथ के सामी मुहावरे का स्वाभाविक हिन्दी अर्थ है।
- source_word: וַיִּרְדּוּ בָהֶם
  choice: वे उन पर शासन करने लगे
  rationale: क्रिया यहाँ अधिकार या प्रभुत्व चलाने का मूल भाव रखती है; ‘अत्याचार किया’ संदर्भ में संभव परिणाम है, पर शब्द का अनिवार्य अर्थ नहीं।
- source_word: וַיָּשׁוּבוּ וַיִּזְעָקוּךָ
  choice: तब वे फिर लौटे और उन्होंने तुझे पुकारा
  rationale: यह दूसरा שׁוב वास्तविक लौटने का भाव रखता है, जबकि זעק संकट में सहायता के लिए की गई तीव्र पुकार को व्यक्त करता है। लौटने का लक्ष्य स्पष्ट जोड़कर मूल की संक्षिप्तता और संभावित खुलापन समाप्त नहीं किया गया।
- source_word: מִשָּׁמַיִם תִּשְׁמַע
  choice: तूने स्वर्ग से उनकी सुनी
  rationale: आरम्भ में आए ‘स्वर्ग से’ के स्रोत-भाव को स्वाभाविक हिन्दी क्रम में रखा गया है; ‘उनकी सुनी’ पुकार सुनकर उत्तर देने का प्रचलित हिन्दी प्रयोग है।
- source_word: וְתַצִּילֵם
  choice: उन्हें ... छुड़ाया
  rationale: נצל यहाँ शत्रुओं के अधिकार से बचाने या मुक्त कराने का अर्थ देता है; ‘छुड़ाया’ ऐतिहासिक प्रसंग में स्पष्ट है और अनावश्यक व्यापक धर्मवैज्ञानिक अर्थ नहीं जोड़ता।
- source_word: כְּרַחֲמֶיךָ רַבּוֹת עִתִּים
  choice: अपनी करुणा के अनुसार उन्हें बार-बार
  rationale: רַבּוֹת व्याकरणतः עִתִּים (‘बार/अवसर’) को विशेषित करता है, इसलिए बहुलता छुड़ाने के अवसरों में व्यक्त की गई है, ‘करुणाओं’ को ‘बहुतायत’ कहकर नहीं।
theological_decisions:
- issue: परमेश्वर द्वारा छोड़ दिए जाने की भाषा
  choice: तूने उन्हें उनके शत्रुओं के वश में छोड़ दिया
  alternative: तूने उन्हें त्यागकर उनके शत्रुओं के हाथ में कर दिया
  rationale: पद बार-बार होने वाले न्याय और उद्धार के क्रम में सुरक्षा हटा लेने का वर्णन करता है। ‘छोड़ दिया’ घटना की गंभीरता बनाए रखता है, पर पूर्ण और स्थायी परित्याग का अर्थ आरोपित नहीं करता।
- issue: अन्तिम क्रियाओं का पुनरावृत्त भूतकालीन भाव
  choice: तूने ... उनकी सुनी और ... उन्हें बार-बार छुड़ाया
  alternative: तू ... उनकी सुनता और ... उन्हें छुड़ाता रहा
  rationale: सारांशात्मक प्रसंग में इब्रानी अपूर्ण क्रियाएँ अतीत में बार-बार हुई कार्रवाई बता सकती हैं। हिन्दी का सामान्य भूतकाल, ‘बार-बार’ के साथ, इस पुनरावृत्ति को स्पष्ट और सहज रूप से व्यक्त करता है।
- issue: दूसरे ‘लौटने’ का लक्ष्य
  choice: वे फिर लौटे
  alternative: वे फिर तेरी ओर लौटे
  rationale: संदर्भ परमेश्वर की ओर मन फिराने का संकेत देता है, पर मूल में लक्ष्य स्पष्ट रूप से नहीं दिया गया। संक्षिप्त अनुवाद वास्तविक लौटने का भाव रखता है और निहित लक्ष्य को पाठ में जोड़कर अस्पष्टता समाप्त नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, आदरपूर्ण और सार्वजनिक पाठ के योग्य स्तर रखा गया है। परमेश्वर के लिए एकवचन निकट संबोधन ‘तू/तेरे’ मूल के दूसरे पुरुष एकवचन को दर्शाता है। ‘चैन,’ ‘वश,’ ‘पुकारा’ और ‘छुड़ाया’ सामान्य पाठक के लिए स्पष्ट हैं, जबकि वाक्य की गरिमा बनी रहती है।
