id: NEH.9.34
reference: Nehemiah 9:34
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אֶת מְלָכֵ֤י/נוּ שָׂרֵ֨י/נוּ֙ כֹּהֲנֵ֣י/נוּ וַ/אֲבֹתֵ֔י/נוּ לֹ֥א עָשׂ֖וּ תּוֹרָתֶ֑/ךָ וְ/לֹ֤א הִקְשִׁ֨יבוּ֙ אֶל מִצְוֺתֶ֔י/ךָ וּ/לְ/עֵ֣דְוֺתֶ֔י/ךָ אֲשֶׁ֥ר הַעִידֹ֖תָ בָּ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/034.yaml
  text: Even our kings[a], our officials, our priests, and our fathers did not keep your law[c][b], and they did not listen to your commandments and your testimonies with which you warned them.
translation:
  language: hi
  text: हमारे राजाओं, हमारे अधिकारियों, हमारे याजकों और हमारे पुरखाओं ने भी आपकी व्यवस्था का पालन नहीं किया और न आपकी आज्ञाओं और आपकी उन चेतावनियों पर ध्यान दिया, जिनके द्वारा आपने उन्हें चेतावनी दी थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֶת
  choice: ने भी
  rationale: यह संयोजन पिछली स्वीकारोक्ति में इन समूहों को जोड़ता और उन पर बल देता है; हिन्दी में कर्ता-समूह के बाद ‘भी’ स्वाभाविक रूप से इस योगात्मक बल को व्यक्त करता है।
- source_word: מְלָכֵינוּ
  choice: हमारे राजाओं
  rationale: प्रथम पुरुष बहुवचन प्रत्यय सहित बहुवचन संज्ञा का सीधा और स्वाभाविक अनुवाद।
- source_word: שָׂרֵינוּ
  choice: हमारे अधिकारियों
  rationale: שָׂרִים यहाँ शासन और प्रशासन से जुड़े पदाधिकारियों को सूचित करता है; ‘अधिकारी’ आधुनिक हिन्दी में स्पष्ट है और अनिवार्य रूप से राजकुमारों का अर्थ नहीं देता।
- source_word: כֹּהֲנֵינוּ
  choice: हमारे याजकों
  rationale: כֹּהֵן के लिए मानक बाइबलीय हिन्दी शब्द।
- source_word: וַאֲבֹתֵינוּ
  choice: हमारे पुरखाओं
  rationale: शाब्दिक अर्थ ‘हमारे पिता’ है, पर प्रसंग में इस्राएल की पिछली पीढ़ियाँ अभिप्रेत हैं; ‘पुरखे’ स्रोत के पुरुषवाची और वंशगत भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: לֹא עָשׂוּ תּוֹרָתֶךָ
  choice: आपकी व्यवस्था का पालन नहीं किया
  rationale: תּוֹרָה के साथ עשה का अर्थ मुहावरे के रूप में उसे मानना या उसका पालन करना है; ‘व्यवस्था’ वाचा-संबंधी संदर्भ के अनुकूल है।
- source_word: הִקְשִׁיבוּ
  choice: ध्यान दिया
  rationale: קשׁב का हिफ़ील रूप ध्यान लगाकर सुनने और मानने की ओर संकेत करता है; ‘पर ध्यान दिया’ आधुनिक हिन्दी में इस अर्थ को सहज रूप से व्यक्त करता है।
- source_word: מִצְוֺתֶיךָ
  choice: आपकी आज्ञाओं
  rationale: मूल के वाचा-संबंधी आदेशों के लिए स्पष्ट और प्रचलित अनुवाद।
- source_word: וּלְעֵדְוֺתֶיךָ
  choice: आपकी उन चितौनियों
  rationale: עֵדוֹת मूलतः साक्ष्यों या गंभीर प्रमाण-वचनों को दर्शाता है; अगले सजातीय क्रियापद הַעִידֹתָ के चेतावनी देने वाले अर्थ के कारण ‘चितौनियाँ’ प्रसंगगत बल स्पष्ट करता है, जबकि इस अर्थ-क्षेत्र की जटिलता को टिप्पणी में दर्ज किया गया है।
- source_word: אֲשֶׁר הַעִידֹתָ בָהֶם
  choice: जिनके द्वारा आपने उन्हें चेतावनी दी थी
  rationale: העיד यहाँ गंभीरता से सावधान करने का भाव रखता है और בָהֶם साधन-संबंध दिखाता है; ‘जिनके द्वारा’ उस संबंध को सुरक्षित रखता है।
theological_decisions:
- issue: תּוֹרָה का अनुवाद
  choice: आपकी व्यवस्था
  alternative: आपकी शिक्षा
  rationale: राष्ट्रीय वाचा-अंगीकार के इस संदर्भ में शब्द परमेश्वर की वाचा-संबंधी व्यवस्था को दर्शाता है; ‘व्यवस्था’ सामान्य शिक्षा से अधिक सटीक है।
- issue: אָבוֹת का अनुवाद
  choice: हमारे पुरखे
  alternative: हमारे पिता / हमारे पूर्वज
  rationale: संदर्भ पिछली पीढ़ियों का है। ‘पुरखे’ पुरुषवाची स्रोत-रूप और वंशगत अर्थ दोनों को स्वाभाविक आधुनिक हिन्दी में रखता है।
- issue: עֵדוֹת और הַעִידֹתָ का संबंध
  choice: चितौनियाँ … चेतावनी दी
  alternative: साक्षियाँ … उनके विरुद्ध साक्षी दी
  rationale: प्रसंग में अवज्ञा के विरुद्ध परमेश्वर की गंभीर चेतावनी प्रमुख है। फिर भी मूल में ‘साक्ष्य/साक्षी देने’ का न्यायिक और वाचा-संबंधी आयाम मौजूद है; उसे वैकल्पिक पाठ के रूप में दर्ज किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, आदरसूचक ‘आप’ के साथ। वाक्य गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखा गया है। ‘याजक’, ‘व्यवस्था’ और ‘आज्ञा’ जैसे स्थापित बाइबलीय शब्द बनाए गए हैं; अत्यधिक संस्कृतनिष्ठ वाक्य-विन्यास से बचा गया है।
