  yaml_path: translation/ot/nehemiah/009/001.yaml
  text: On the twenty-fourth day of this month[a], the sons of Israel assembled with fasting, in sackcloth[b], and with dirt on them.
translation:
  language: hi
  text: इस महीने के चौबीसवें दिन इस्राएली[a] उपवास करते हुए, टाट ओढ़े और अपने ऊपर मिट्टी डाले हुए इकट्ठे हुए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ “इस्राएल के पुत्र”; परंपरागत अनुवाद “इस्राएल की संतान।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְיוֹם עֶשְׂרִים וְאַרְבָּעָה
  choice: चौबीसवें दिन
  rationale: इब्रानी तिथि-सूचक पदबंध का स्वाभाविक हिन्दी रूप क्रमवाचक संख्या के साथ दिया गया है; आरम्भिक וּ को प्रसंगगत संयोजक मानकर अलग से ‘और’ नहीं जोड़ा गया।
- source_word: לַחֹדֶשׁ הַזֶּה
  choice: इस महीने के
  rationale: तिथि के संदर्भ में यह आधुनिक हिन्दी का स्वाभाविक और सटीक रूप है।
- source_word: נֶאֶסְפוּ
  choice: इकट्ठे हुए
  rationale: निफ़अल रूप यहाँ समुदाय के एकत्र होने को व्यक्त करता है। ‘इकट्ठे हुए’ हिन्दी में स्वाभाविक है और बाहरी कर्ता को अनावश्यक रूप से नहीं जोड़ता।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएली
  rationale: शाब्दिक अर्थ ‘इस्राएल के पुत्र’ है, पर यहाँ पूरे वाचा-समुदाय का जातिनाम अभिप्रेत है। ‘इस्राएली’ आधुनिक हिन्दी में समावेशी और सहज है; शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: בְּצוֹם
  choice: उपवास करते हुए
  rationale: साथ घट रही प्रायश्चित्तपूर्ण क्रिया को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וּבְשַׂקִּים
  choice: टाट ओढ़े
  rationale: שַׂק शोक और पश्चात्ताप में पहना जाने वाला खुरदरा वस्त्र है। ‘टाट ओढ़े’ सांस्कृतिक क्रिया को संक्षेप में स्पष्ट करता है।
- source_word: וַאֲדָמָה עֲלֵיהֶם
  choice: अपने ऊपर मिट्टी डाले हुए
  rationale: אֲדָמָה का मूल अर्थ भूमि/मिट्टी है। क्रियाविहीन इब्रानी पदबंध को हिन्दी में स्वाभाविक बनाने के लिए ‘डाले हुए’ जोड़ा गया है, बिना यह मान लिए कि मिट्टी केवल सिर पर थी।
