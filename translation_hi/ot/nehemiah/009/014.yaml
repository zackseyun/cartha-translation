source:
  edition: WLC
  text: וְ/אֶת שַׁבַּ֥ת קָדְשְׁ/ךָ֖ הוֹדַ֣עַתָ לָ/הֶ֑ם וּ/מִצְו֤וֹת וְ/חֻקִּים֙ וְ/תוֹרָ֔ה צִוִּ֣יתָ לָ/הֶ֔ם בְּ/יַ֖ד מֹשֶׁ֥ה עַבְדֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/014.yaml
  text: You made your holy Sabbath known to them[b][a], and you commanded them commandments and statutes and a law by the hand of Moses your servant.
translation:
  language: hi
  text: आपने उन्हें अपना पवित्र सब्त बताया, और अपने सेवक मूसा के द्वारा[b] उन्हें आज्ञाएँ, विधियाँ और व्यवस्था[a] मानने की आज्ञा दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शिक्षा”; इब्रानी תוֹרָה में कानूनी व्यवस्था के साथ-साथ शिक्षा या निर्देश का भाव भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “अपने सेवक मूसा के हाथ से”; यह मुहावरा “अपने सेवक मूसा के द्वारा” के अर्थ में है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁבַּת קָדְשְׁךָ
  choice: अपना पवित्र सब्त
  rationale: ‘सब्त’ वाचा और उपासना से जुड़े विशिष्ट दिन को बनाए रखता है; קָדְשְׁךָ का भाव ‘आपका पवित्र’ है, जिसे स्वाभाविक हिन्दी में ‘अपना पवित्र’ कहा गया है।
- source_word: הוֹדַעַתָ
  choice: बताया
  rationale: हिफ़ील रूप का अर्थ ‘जानने दिया/प्रकट किया’ है। ‘बताया’ सामान्य आधुनिक हिन्दी में इस कारक भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִצְוֹת
  choice: आज्ञाएँ
  rationale: यह परमेश्वर द्वारा दिए गए आदेशों के लिए प्रचलित और स्पष्ट हिन्दी शब्द है।
- source_word: חֻקִּים
  choice: विधियाँ
  rationale: यह निर्धारित नियमों या विधानों का कानूनी-वाचागत भाव व्यक्त करता है और ‘आज्ञाएँ’ से भेद बनाए रखता है।
- source_word: תוֹרָה
  choice: व्यवस्था
  rationale: इस कानूनी त्रिक में ‘व्यवस्था’ संदर्भानुकूल है; मूल शब्द में ‘शिक्षा/निर्देश’ का व्यापक भाव भी संभव है, जिसे पादटिप्पणी में रखा गया है।
- source_word: צִוִּיתָ לָהֶם
  choice: उन्हें ... दीं
  rationale: शाब्दिक अर्थ ‘उन्हें आज्ञा दी’ है। सूची में ‘आज्ञाएँ’ पहले से होने के कारण ‘आज्ञा दी’ की पुनरुक्ति से बचते हुए ‘दीं’ हिन्दी में आज्ञापित रूप से प्रदान करने का भाव रखता है।
- source_word: בְּיַד מֹשֶׁה עַבְדֶּךָ
  choice: अपने सेवक मूसा के द्वारा
  rationale: ‘हाथ से’ यहाँ माध्यम या प्रतिनिधित्व का इब्रानी मुहावरा है; ‘के द्वारा’ उसका स्पष्ट और स्वाभाविक हिन्दी अर्थ देता है।
theological_decisions:
- issue: מִצְוֹת וְחֻקִּים וְתוֹרָה के कानूनी त्रिक का अनुवाद
  choice: आज्ञाएँ, विधियाँ और व्यवस्था
  alternative: आदेश, नियम और शिक्षा
  rationale: चुना हुआ रूप तीनों संबंधित किंतु अलग कानूनी-वाचागत पदों का भेद बनाए रखता है। साथ ही תוֹרָה के व्यापक ‘शिक्षा’ अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: परमेश्वर के संबोधन का हिन्दी आदरसूचक रूप
  choice: आपने / अपना / अपने
  alternative: तूने / अपना / अपने
  rationale: आधुनिक मानक हिन्दी में आदरसूचक ‘आप’ सामान्य पाठक के लिए स्वाभाविक और गरिमापूर्ण है; इससे मूल के द्वितीय पुरुष एकवचन संबोधन का आशय नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, आदरसूचक और गरिमापूर्ण रखी गई है। ‘सब्त’, ‘आज्ञाएँ’, ‘विधियाँ’ और ‘व्यवस्था’ वाचागत-कानूनी संदर्भ को स्पष्ट रखते हैं, जबकि वाक्य-संरचना सामान्य हिन्दी पाठक के लिए स्वाभाविक है।
