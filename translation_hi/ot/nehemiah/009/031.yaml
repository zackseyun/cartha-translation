source:
  edition: WLC
  text: וּֽ/בְ/רַחֲמֶ֧י/ךָ הָ/רַבִּ֛ים לֹֽא עֲשִׂיתָ֥/ם כָּלָ֖ה וְ/לֹ֣א עֲזַבְתָּ֑/ם כִּ֛י אֵֽל חַנּ֥וּן וְ/רַח֖וּם אָֽתָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/031.yaml
  text: But in your abundant mercies you did not make an end of them or abandon them[a], for you are a gracious and compassionate God.
translation:
  language: hi
  text: परन्तु अपनी अपार दया के अनुसार आपने उनका अन्त नहीं किया और न उन्हें त्यागा[a], क्योंकि आप अनुग्रहकारी और करुणामय परमेश्वर हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपनी अपार दया के अनुसार आपने उन्हें पूरी तरह नष्ट नहीं किया और न उन्हें छोड़ दिया।”
    reason: עשה כלה और עזב के अधिक स्पष्ट शाब्दिक विकल्प दर्शाने के लिए।
lexical_decisions:
- source_word: וּבְרַחֲמֶיךָ הָרַבִּים
  choice: परन्तु अपनी अपार दया के कारण
  rationale: आरम्भिक वाव प्रसंग में विरोध प्रकट करता है। רַחֲמִים का बहुवचन और הָרַבִּים दया की प्रचुरता पर बल देते हैं; स्वाभाविक हिन्दी में ‘अपार दया’ यही भाव व्यक्त करता है।
- source_word: לֹא עֲשִׂיתָם כָּלָה
  choice: आपने उनका पूरी तरह अन्त नहीं किया
  rationale: עשה כלה का अर्थ किसी को पूर्णतः समाप्त या नष्ट कर देना है। यह रूप मूल मुहावरे के ‘पूर्ण अन्त’ के भाव को बनाए रखता है और विनाश के साधन को अनावश्यक रूप से निर्दिष्ट नहीं करता।
- source_word: וְלֹא עֲזַבְתָּם
  choice: और न उन्हें त्यागा
  rationale: עזב का अर्थ छोड़ देना या त्याग देना है। ‘त्यागा’ आधुनिक, संक्षिप्त और इस प्रसंग में ईश्वर द्वारा पूरी तरह छोड़ न दिए जाने का भाव स्पष्ट करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह परमेश्वर के संयम और दया का कारण प्रस्तुत करता है।
- source_word: אֵל
  choice: परमेश्वर
  rationale: यहाँ אֵל ईश्वर के सामान्य पदनाम के रूप में है; ‘परमेश्वर’ हिन्दी बाइबलीय गद्य में स्वाभाविक और गरिमापूर्ण है, जबकि ‘सर्वशक्तिमान’ जोड़ना मूल से अधिक विशिष्ट होता।
- source_word: חַנּוּן
  choice: अनुग्रहकारी
  rationale: यह शब्द कृपा या अनुग्रह दिखाने वाले स्वभाव को व्यक्त करता है और अगले विशेषण ‘करुणामय’ से अर्थगत भेद बनाए रखता है।
- source_word: וְרַחוּם
  choice: और करुणामय
  rationale: רַחוּם गहरी करुणा और दयालु संवेदना को सूचित करता है। ‘करुणामय’ חַנּוּן के ‘अनुग्रहकारी’ से उचित भेद रखता है।
- source_word: אָתָּה
  choice: आप ... हैं
  rationale: स्वतंत्र सर्वनाम बल देता है; हिन्दी में आदरसूचक ‘आप’ और वाक्य के अन्त का ‘हैं’ इसे स्वाभाविक रूप से व्यक्त करते हैं।
theological_decisions:
- issue: ईश्वरीय चरित्र-सूत्र חַנּוּן וְרַחוּם का अनुवाद
  choice: अनुग्रहकारी और करुणामय
  alternative: दयालु और करुणामय; कृपालु और दयावन्त
  rationale: यह दोनों इब्रानी विशेषणों के बीच अर्थगत भेद बनाए रखता है और किसी अतिरिक्त सम्प्रदायगत धारणा को नहीं जोड़ता।
- issue: आरम्भिक וּ का वाक्यगत बल
  choice: विरोधसूचक ‘परन्तु’
  alternative: साधारण संयोजक ‘और’
  rationale: पिछले प्रसंग में लोगों के विद्रोह और उसके विपरीत परमेश्वर की दया का उल्लेख है; इसलिए विरोधसूचक अर्थ यहाँ अधिक स्पष्ट है।
- issue: לֹא עֲשִׂיתָם כָּלָה में दण्ड की सीमा
  choice: उनका पूरी तरह अन्त नहीं किया
  alternative: उन्हें पूरी तरह नष्ट नहीं किया
  rationale: चुना गया रूप सम्पूर्ण विनाश का भाव सुरक्षित रखता है, पर उसके तरीके को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में आदरसूचक ईश्वर-संबोधन रखा गया है। शैली गरिमापूर्ण पर सामान्य पाठक के लिए स्पष्ट है; ‘अनुग्रहकारी’ और ‘करुणामय’ से मूल के दो अलग विशेषण सुरक्षित रहते हैं।
