source:
  edition: WLC
  text: וַ/יָּק֨וּמוּ֙ עַל עָמְדָ֔/ם וַֽ/יִּקְרְא֗וּ בְּ/סֵ֨פֶר תּוֹרַ֧ת יְהוָ֛ה אֱלֹהֵי/הֶ֖ם רְבִעִ֣ית הַ/יּ֑וֹם וּ/רְבִעִית֙ מִתְוַדִּ֣ים וּ/מִֽשְׁתַּחֲוִ֔ים לַ/יהוָ֖ה אֱלֹהֵי/הֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/003.yaml
  text: And they stood in their place[a], and they read from the Book of the Law of Yahweh their God for a fourth of the day[b]; and for another fourth they were confessing and bowing down to Yahweh their God.
translation:
  language: hi
  text: और वे अपने स्थान पर खड़े हुए[a] और दिन के एक चौथाई भाग तक अपने परमेश्वर याहवे की व्यवस्था की पुस्तक में से पढ़ते रहे[b]; और दूसरे चौथाई भाग में वे अंगीकार करते और अपने परमेश्वर याहवे के सामने दण्डवत् करते रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘अपने खड़े होने के स्थान पर’ या सम्भवतः ‘अपने मंच पर’ भी हो सकता है; इब्रानी अभिव्यक्ति संक्षिप्त है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘दिन का चौथाई भाग… और एक चौथाई भाग’; अर्थात् दिन का एक चौथाई भाग पढ़ने में और दूसरा चौथाई भाग अंगीकार करने तथा दण्डवत् करने में बीता।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּק֨וּמוּ עַל עָמְדָם
  choice: वे अपने स्थान पर खड़े हुए
  rationale: קום का कथात्मक रूप खड़े होने को व्यक्त करता है; संक्षिप्त עַל עָמְדָם को स्वाभाविक हिन्दी में ‘अपने स्थान पर’ रखा गया है, बिना किसी मंच का अनुमान लगाए।
- source_word: וַֽיִּקְרְאוּ בְּסֵפֶר תּוֹרַת
  choice: व्यवस्था की पुस्तक में से पढ़ते रहे
  rationale: ספר के साथ קרא का अर्थ लिखित पाठ को पढ़ना है। ‘में से’ स्रोत-पाठ से पढ़ने का भाव देता है, और ‘पढ़ते रहे’ उस अवधि में जारी क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित व्यक्तिगत नाम ‘यहोवा’ चतुरक्षरीय ईश-नाम को किसी उपाधि से प्रतिस्थापित किए बिना सुरक्षित रखता है।
- source_word: רְבִעִית הַיּוֹם ... וּרְבִעִית
  choice: दिन के चौथाई भाग तक ... दूसरे चौथाई भाग में
  rationale: दोनों पद दिन की दो पृथक चौथाई अवधियों को बताते हैं; दूसरी अभिव्यक्ति की लुप्त संज्ञा हिन्दी में स्पष्ट की गई है।
- source_word: מִתְוַדִּים
  choice: अपने पापों को मानते
  rationale: Hitpael कृदन्त जारी सामूहिक अंगीकार को व्यक्त करता है। सन्दर्भ में स्वीकार की जाने वाली बात पाप है; हिन्दी में ‘पापों को मानना’ स्पष्ट और स्वाभाविक धार्मिक अभिव्यक्ति है।
- source_word: וּמִשְׁתַּחֲוִים לַיהוָה
  choice: यहोवा के सामने दण्डवत् करते
  rationale: क्रिया उपासना में शारीरिक रूप से झुकने या भूमि पर प्रणाम करने का ठोस भाव रखती है। ‘दण्डवत् करना’ उस देहगत क्रिया को सुरक्षित रखता है; ‘के सामने’ लक्ष्य/दिशा को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश-नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में व्यक्तिगत वाचा-नाम है। हिन्दी पाठकों के लिए परिचित लिप्यन्तरण ‘यहोवा’ नाम को उपाधि ‘प्रभु’ से बदलने से बचाता है।
- issue: מִשְׁתַּחֲוִים में शारीरिक मुद्रा या सामान्य उपासना
  choice: दण्डवत् करते
  alternative: आराधना करते; झुकते
  rationale: ठोस शारीरिक क्रिया को बनाए रखा गया है, जबकि यहोवा के सामने किए जाने से उपासना का सन्दर्भ स्वयं स्पष्ट रहता है।
- issue: מִתְוַדִּים के कर्म को स्पष्ट करना
  choice: अपने पापों को मानते
  alternative: अंगीकार करते
  rationale: हिब्रू में कर्म अव्यक्त है, पर अध्याय का पश्चाताप-सन्दर्भ पापों के अंगीकार की ओर संकेत करता है। ‘अपने पापों को’ हिन्दी में आवश्यक अर्थ स्पष्ट करता है, किसी विशिष्ट धार्मिक विधि को नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सार्वजनिक पाठ के योग्य रूप। ‘व्यवस्था की पुस्तक’, ‘पापों को मानते’ और ‘दण्डवत्’ सामान्य बाइबलीय शब्दावली हैं; वाक्य मूल की क्रमबद्धता और दो समय-अवधियों को बनाए रखता है।
