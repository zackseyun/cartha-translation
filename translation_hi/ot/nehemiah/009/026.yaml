base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/026.yaml
  text: But they acted presumptuously and rebelled against you[a], and they cast your law behind their backs. They killed your prophets, who had warned them in order to bring them back to you[d][c][b], and they committed great blasphemies.
translation:
  language: hi
  text: फिर भी उन्होंने ढिठाई से अवज्ञा की[a] और आपके विरुद्ध विद्रोह किया। उन्होंने आपकी व्यवस्था[b] को अपनी पीठ के पीछे फेंक दिया। उन्होंने आपके नबियों को मार डाला, जिन्होंने उन्हें आपके पास लौटाने के लिए गंभीरता से चेताया था[c]। उन्होंने बड़े-बड़े अपमान के काम किए[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘वे हठी हो गए’ अथवा ‘उन्होंने उद्दंडता से अवज्ञा की’; इब्रानी क्रिया हठी और विद्रोही प्रतिरोध का भाव देती है।
    reason: lexical_alternative
  - marker: b
    text: या ‘आपकी शिक्षा’।
    reason: lexical_alternative
  - marker: c
    text: या ‘उनके विरुद्ध साक्षी दी थी’; इब्रानी में गंभीर चेतावनी देने या विधिवत साक्षी देने—दोनों का भाव हो सकता है।
    reason: lexical_alternative
  - marker: d
    text: या ‘घोर निन्दाएँ कीं’, ‘घोर तिरस्कार किए’ अथवा ‘बहुत उकसानेवाले काम किए’।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּמְרוּ
  choice: वे हठी हो गए
  rationale: מרה उद्दंड अवज्ञा और प्रतिरोध को व्यक्त करता है। ‘हठी हो गए’ अगले स्पष्ट क्रियापद ‘विद्रोह किया’ की पुनरुक्ति किए बिना इस भाव को स्वाभाविक हिन्दी में रखता है।
- source_word: וַיִּמְרְדוּ בָּךְ
  choice: उन्होंने आपके विरुद्ध विद्रोह किया
  rationale: מרד विद्रोह का स्पष्ट शब्द है, और בָּךְ परमेश्वर के विरुद्ध उसके व्यक्तिगत लक्ष्य को बनाए रखता है।
- source_word: וַיַּשְׁלִכוּ ... אַחֲרֵי גַוָּם
  choice: उन्होंने ... को अपनी पीठ के पीछे फेंक दिया
  rationale: यह ठुकराने और तिरस्कार का सजीव इब्रानी मुहावरा है; अनुवाद उसके ठोस चित्र को बनाए रखता है।
- source_word: תּוֹרָתְךָ
  choice: आपकी व्यवस्था
  rationale: वाचा और इस्राएल के इतिहास के प्रसंग में ‘व्यवस्था’ תּוֹרָה का परिचित और उपयुक्त अनुवाद है, यद्यपि इसका अर्थ ‘शिक्षा’ भी हो सकता है।
- source_word: נְבִיאֶיךָ
  choice: आपके नबियों
  rationale: यह आधुनिक हिन्दी बाइबलीय प्रयोग में נביא का स्पष्ट और मानक रूप है।
- source_word: הֵעִידוּ בָם
  choice: उन्हें गंभीर चेतावनी दी थी
  rationale: עוּד का हिफ़ील रूप विधिवत साक्षी देने अथवा गंभीरता से चेताने का भाव रखता है। अगले उद्देश्य-वाक्य के कारण ‘गंभीर चेतावनी’ प्रसंग में स्वाभाविक है।
- source_word: לַהֲשִׁיבָם אֵלֶיךָ
  choice: उन्हें आपके पास लौटाने के लिए
  rationale: שׁוב का कारक रूप नबियों की चेतावनी का उद्देश्य बताता है—लोगों को फिर परमेश्वर की ओर लाना।
- source_word: נֶאָצוֹת גְּדוֹלֹת
  choice: घोर निन्दा के काम
  rationale: बहुवचन संज्ञा परमेश्वर के प्रति बड़े तिरस्कारपूर्ण और अपमानजनक कृत्यों को सूचित करती है। ‘निन्दा के काम’ इसे केवल बोले गए शब्दों तक सीमित नहीं करता।
theological_decisions:
- issue: וַיַּמְרוּ और וַיִּמְרְדוּ के जुड़े हुए विद्रोह-सूचक क्रियापद
  choice: ‘हठी हो गए’ और ‘विद्रोह किया’ के रूप में भेद बनाए रखा
  alternative: ‘अवज्ञा की और विद्रोह किया’ अथवा ‘उकसाया और विद्रोह किया’
  rationale: मूल पाठ दो अलग क्रियाओं से अपराध की तीव्रता बढ़ाता है। अलग हिन्दी पद दोनों को एक ही अर्थ में मिला देने से बचाते हैं।
- issue: נֶאָצוֹת का अर्थ-क्षेत्र
  choice: ‘घोर निन्दा के काम’
  alternative: ‘घोर तिरस्कार’, ‘बड़े अपमान’ अथवा ‘बहुत उकसानेवाले काम’
  rationale: शब्द परमेश्वर के प्रति तिरस्कार और अपमान को व्यक्त करता है, पर केवल मौखिक ईशनिन्दा तक सीमित नहीं है। चुना हुआ रूप धार्मिक गंभीरता और कृत्यों की व्यापकता दोनों रखता है।
translation_notes:
  register: भाषा आधुनिक, आदरपूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। परमेश्वर के लिए आदरसूचक ‘आप’ का प्रयोग हुआ है। छोटे वाक्यों से मूल की क्रमिक आरोप-सूची स्पष्ट रहती है, और ‘पीठ के पीछे फेंक दिया’ जैसे ठोस इब्रानी बिंब को सुरक्षित रखा गया है।
