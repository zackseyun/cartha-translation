id: NEH.9.2
reference: Nehemiah 9:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּבָּֽדְלוּ֙ זֶ֣רַע יִשְׂרָאֵ֔ל מִ/כֹּ֖ל בְּנֵ֣י נֵכָ֑ר וַ/יַּעַמְד֗וּ וַ/יִּתְוַדּוּ֙ עַל חַטֹּ֣אתֵי/הֶ֔ם וַ/עֲוֺנ֖וֹת אֲבֹתֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/002.yaml
  text: Then the offspring of Israel separated themselves from all foreigners[b][a], and they stood and confessed their sins and the iniquities of their fathers.
translation:
  language: hi
  text: तब इस्राएल के वंशज[a] सब परदेशी लोगों से अलग हो गए। उन्होंने खड़े होकर अपने पापों और अपने पुरखाओं के अधर्मों[b] को अंगीकार किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘इस्राएल का बीज’; अर्थात् ‘इस्राएल की संतान’ या ‘इस्राएल के वंशज’।
    reason: lexical_alternative
  - marker: b
    text: यह पुरखाओं के अधर्म को सामूहिक अंगीकार में स्वीकार करने की ओर संकेत कर सकता है; पद यह नहीं बताता कि उनकी संतानों पर व्यक्तिगत दोष किस अर्थ में लागू होता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבָּדְלוּ
  choice: अलग हो गए
  rationale: निफ़अल रूप यहाँ लोगों द्वारा जान-बूझकर स्वयं को अलग करने का भाव देता है। ‘अलग हो गए’ हिन्दी में स्वाभाविक है और कर्मवाच्य को अनावश्यक रूप से कठोर नहीं बनाता।
- source_word: זֶרַע יִשְׂרָאֵל
  choice: इस्राएल के वंशज
  rationale: זֶרַע का मूल अर्थ ‘बीज’ है, पर यहाँ यह सामूहिक वंश को दर्शाता है। ‘वंशज’ आधुनिक हिन्दी में वंशगत संबंध को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מִכֹּל בְּנֵי נֵכָר
  choice: सब परदेशी लोगों से
  rationale: בְּנֵי נֵכָר शाब्दिक रूप से ‘परदेश के पुत्र’ है, पर यह गैर-इस्राएली अथवा विदेशी मूल के लोगों के लिए प्रयुक्त मुहावरा है। ‘परदेशी लोगों’ से लिंग-विशेष का अनावश्यक अर्थ नहीं आता।
- source_word: וַיַּעַמְדוּ
  choice: उन्होंने खड़े होकर
  rationale: עמד का सामान्य अर्थ ‘खड़ा होना’ है। संयुक्त क्रिया-रचना हिन्दी में अंगीकार के समय उनकी मुद्रा को सहज रूप से व्यक्त करती है।
- source_word: וַיִּתְוַדּוּ
  choice: अंगीकार किया
  rationale: इस संदर्भ में ידה का हित्पअेल रूप पाप स्वीकार करने या उसका अंगीकार करने को दर्शाता है। ‘अंगीकार किया’ धार्मिक संदर्भ में परिचित, गरिमापूर्ण और अर्थतः सटीक है।
- source_word: חַטֹּאתֵיהֶם
  choice: अपने पापों
  rationale: חַטָּאת का बहुवचन यहाँ सीधे तौर पर उनके अपने पापों को दर्शाता है; ‘पाप’ इसका स्पष्ट और मानक हिन्दी समतुल्य है।
- source_word: עֲוֺנוֹת אֲבֹתֵיהֶם
  choice: अपने पुरखाओं के अधर्मों
  rationale: עָוֹן अधर्म, दोष या दंड का संकेत दे सकता है। यहाँ ‘पापों’ के समानांतर ‘अधर्मों’ मूल की अलग शब्दावली और नैतिक गंभीरता को बनाए रखता है। אבות के लिए ‘पुरखाओं’ सामूहिक पूर्वजों का स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: पुरखाओं के अधर्म का सामूहिक अंगीकार
  choice: लोगों ने अपने पापों के साथ अपने पुरखाओं के अधर्मों को भी अंगीकार किया
  alternative: उन्होंने केवल पुरखाओं के दोष के परिणामों को स्वीकार किया, अथवा केवल ऐतिहासिक रूप से उनके अधर्मों का उल्लेख किया
  rationale: इब्रानी वाक्य-रचना दोनों पदों—‘अपने पापों’ और ‘अपने पुरखाओं के अधर्मों’—को एक ही ‘अंगीकार किया’ क्रिया से जोड़ती है। अनुवाद सामूहिक अंगीकार को बनाए रखता है, पर इससे वंशानुगत व्यक्तिगत दोष का कोई अतिरिक्त सिद्धांत नहीं निकालता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘वंशज,’ ‘परदेशी लोग,’ ‘अंगीकार’ और ‘अधर्म’ सामान्य पाठक के लिए बोधगम्य रहते हुए मूल की वंशगत, सामाजिक और धार्मिक अर्थछटाओं को बनाए रखते हैं।
