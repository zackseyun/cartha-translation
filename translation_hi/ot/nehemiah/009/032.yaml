source:
  edition: WLC
  text: וְ/עַתָּ֣ה אֱ֠לֹהֵי/נוּ הָ/אֵ֨ל הַ/גָּד֜וֹל הַ/גִּבּ֣וֹר וְ/הַ/נּוֹרָא֮ שׁוֹמֵ֣ר הַ/בְּרִ֣ית וְ/הַ/חֶסֶד֒ אַל יִמְעַ֣ט לְ/פָנֶ֡י/ךָ אֵ֣ת כָּל הַ/תְּלָאָ֣ה אֲֽשֶׁר מְ֠צָאַתְ/נוּ לִ/מְלָכֵ֨י/נוּ לְ/שָׂרֵ֧י/נוּ וּ/לְ/כֹהֲנֵ֛י/נוּ וְ/לִ/נְבִיאֵ֥/נוּ וְ/לַ/אֲבֹתֵ֖י/נוּ וּ/לְ/כָל עַמֶּ֑/ךָ מִ/ימֵי֙ מַלְכֵ֣י אַשּׁ֔וּר עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/032.yaml
  text: 'And now[a], our God—the great, mighty, and fearsome God, who keeps the covenant and steadfast love—do not let all the hardship that has come upon us seem small before you: upon our kings, our officials, our priests, our prophets, our fathers[b], and all your people, from the days of the kings of Assyria until this day.'
translation:
  language: hi
  text: “और अब, हे हमारे परमेश्वर—हे महान, सामर्थी और भययोग्य परमेश्वर, जो वाचा और अटल प्रेम को बनाए रखता है—वह सारी विपत्ति, जो अश्शूर के राजाओं के दिनों से लेकर आज तक हम पर, हमारे राजाओं, हमारे अधिकारियों, हमारे याजकों, हमारे नबियों, हमारे पूर्वजों और तेरी सारी प्रजा पर पड़ी है, तेरी दृष्टि में छोटी न ठहरे।[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘छोटी न ठहरे’ का अर्थ है ‘तुच्छ या नगण्य न मानी जाए।’
    reason: idiom_clarification
lexical_decisions:
- source_word: הָאֵל
  choice: परमेश्वर
  rationale: यह ‘हमारे परमेश्वर’ के समानाधिकरण में है और इसके बाद ईश्वरीय विशेषण आते हैं। हिन्दी में ‘परमेश्वर’ स्वाभाविक, गरिमापूर्ण संबोधन है।
- source_word: הַגָּדוֹל הַגִּבּוֹר וְהַנּוֹרָא
  choice: महान, सामर्थी और भययोग्य
  rationale: ये वाचागत ईश्वरीय उपाधियाँ हैं। ‘भययोग्य’ נוֹרָא में निहित विस्मय और श्रद्धामय भय दोनों को बनाए रखता है।
- source_word: שׁוֹמֵר הַבְּרִית וְהַחֶסֶד
  choice: जो वाचा और अटल प्रेम को निभाता है
  rationale: שׁוֹמֵר यहाँ निरंतर निष्ठा बताने वाला कृदंत है। ‘निभाता है’ वाचा और חסד दोनों के प्रति परमेश्वर की विश्वसनीयता को स्वाभाविक हिन्दी में व्यक्त करता है; ‘अटल प्रेम’ חסד के स्थायी, निष्ठावान प्रेम का भाव देता है।
- source_word: אַל יִמְעַט לְפָנֶיךָ
  choice: तेरी दृष्टि में छोटी न ठहरे
  rationale: यह इब्रानी मुहावरे की विनती को बनाए रखता है कि परमेश्वर इस विपत्ति को तुच्छ या नगण्य न माने।
- source_word: כָּל הַתְּלָאָה
  choice: वह सारी विपत्ति
  rationale: תְּלָאָה सामूहिक ऐतिहासिक कष्ट, कठिनाई और संकट को सूचित करता है; ‘विपत्ति’ इस प्रसंग में संक्षिप्त और गंभीर है।
- source_word: אֲשֶׁר מְצָאַתְנוּ
  choice: जो ... हम पर ... पड़ी है
  rationale: शाब्दिक ‘जिसने हमें पाया’ विपत्ति आ पड़ने का मुहावरा है। हिन्दी में ‘हम पर पड़ी है’ उसी अर्थ को सहजता से देता है।
- source_word: לִמְלָכֵינוּ לְשָׂרֵינוּ וּלְכֹהֲנֵינוּ וְלִנְבִיאֵינוּ וְלַאֲבֹתֵינוּ
  choice: हमारे राजाओं, हमारे हाकिमों, हमारे याजकों, हमारे नबियों, हमारे पूर्वजों ... पर
  rationale: לְ प्रभावित लोगों को चिह्नित करता है। שָׂרִים के लिए ‘हाकिम’ राजकीय अधिकारियों का अर्थ देता है, और אֲבֹתֵינוּ यहाँ बीती पीढ़ियों के पुरखों को समावेशी रूप से सूचित करता है।
- source_word: מִימֵי מַלְכֵי אַשּׁוּר עַד הַיּוֹם הַזֶּה
  choice: अश्शूर के राजाओं के दिनों से लेकर आज तक
  rationale: यह कष्ट की अवधि के आरम्भ और वक्ता के वर्तमान तक उसके विस्तार को सीधे व्यक्त करता है।
theological_decisions:
- issue: נוֹרָא का ईश्वरीय विशेषण
  choice: भययोग्य
  alternative: विस्मयकारी
  rationale: ‘भययोग्य’ परमेश्वर से उत्पन्न श्रद्धामय भय और विस्मय को रखता है; केवल ‘भयानक’ अनपेक्षित रूप से नकारात्मक हो सकता है।
- issue: הַבְּרִית וְהַחֶסֶד का संबंध
  choice: वाचा और अटल प्रेम
  alternative: प्रेम की वाचा
  rationale: इब्रानी में दोनों संज्ञाएँ וְ से समन्वित हैं। उन्हें अलग किंतु संबंधित वस्तुओं के रूप में रखना मूल की व्याकरणिक और धर्मवैचारिक तनाव को सुरक्षित रखता है।
- issue: אֲבֹתֵינוּ का संदर्भ
  choice: हमारे पूर्वजों
  alternative: हमारे पितरों
  rationale: यहाँ शब्द इस्राएल की पिछली पीढ़ियों को सामूहिक रूप से दर्शाता है। ‘पूर्वज’ आधुनिक पाठक के लिए स्पष्ट है और संदर्भगत व्यापकता को व्यक्त करता है; ‘पितरों’ अधिक शाब्दिक किंतु अपेक्षाकृत पारंपरिक है।
translation_notes:
  register: आधुनिक मानक हिन्दी में प्रार्थनात्मक, गरिमापूर्ण शैली रखी गई है। परमेश्वर को संबोधित करते समय ‘तेरी’ का प्रयोग निकटता और पारंपरिक बाइबलीय संबोधन को बनाए रखता है। पद की लंबी विनती-संरचना मूल के अनुरूप रखी गई है, पर हिन्दी में कालक्रम को पहले रखकर आश्रित पदबंधों को स्पष्ट बनाया गया है।
