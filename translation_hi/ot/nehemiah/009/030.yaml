id: NEH.9.30
reference: Nehemiah 9:30
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/תִּמְשֹׁ֤ךְ עֲלֵי/הֶם֙ שָׁנִ֣ים רַבּ֔וֹת וַ/תָּ֨עַד בָּ֧/ם בְּ/רוּחֲ/ךָ֛ בְּ/יַד נְבִיאֶ֖י/ךָ וְ/לֹ֣א הֶאֱזִ֑ינוּ וַֽ/תִּתְּנֵ֔/ם בְּ/יַ֖ד עַמֵּ֥י הָ/אֲרָצֹֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/030.yaml
  text: For many years you were patient with them and testified against them by your Spirit through your prophets[a], but they would not listen. So you gave them into the hand of the peoples of the lands.
translation:
  language: hi
  text: बहुत वर्षों तक आप उनके साथ धीरज धरते रहे और अपनी आत्मा के द्वारा अपने नबियों के माध्यम से उन्हें चेतावनी देते रहे[a], पर उन्होंने कान न लगाया। इसलिए आपने उन्हें देशों के लोगों के हाथ में कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपनी आत्मा के द्वारा अपने नबियों के माध्यम से उनके विरुद्ध गवाही देते रहे।”
    reason: मूल क्रिया चेतावनी देने के साथ-साथ किसी के विरुद्ध गंभीर या न्यायिक गवाही देने का भाव भी रख सकती है।
lexical_decisions:
- source_word: וַתִּמְשֹׁךְ עֲלֵיהֶם שָׁנִים רַבּוֹת
  choice: बहुत वर्षों तक आप उनके साथ धीरज धरते रहे
  rationale: यह मुहावरा उनके प्रति लंबे समय तक न्याय को टालने और सहनशीलता दिखाने का भाव देता है। ‘धीरज धरते रहे’ अवधि और सहनशीलता दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַתָּעַד בָּם
  choice: उन्हें चेतावनी देते रहे
  rationale: עוד का हिफ़ील रूप गवाही देने, सचेत करने या चेतावनी देने का अर्थ रख सकता है। भविष्यद्वक्ताओं के बार-बार संबोधन के संदर्भ में ‘चेतावनी देते रहे’ स्पष्ट है; न्यायिक ‘विरुद्ध गवाही’ का भाव पादटिप्पणी में सुरक्षित है।
- source_word: בְּרוּחֲךָ
  choice: अपनी आत्मा से
  rationale: भविष्यद्वक्ताओं के माध्यम से होने वाले दिव्य संबोधन में רוּחַ परमेश्वर की आत्मा को सूचित करता है। ‘से’ साधन या प्रेरक सामर्थ्य का भाव रखता है।
- source_word: בְּיַד נְבִיאֶיךָ
  choice: अपने नबियों के द्वारा
  rationale: ‘हाथ से’ का इब्रानी मुहावरा माध्यम अथवा अभिकरण बताता है; आधुनिक हिन्दी में ‘के द्वारा’ उसका स्वाभाविक समतुल्य है।
- source_word: וְלֹא הֶאֱזִינוּ
  choice: पर उन्होंने कान न लगाया
  rationale: האזין ध्यानपूर्वक सुनने को दर्शाता है। ‘कान न लगाया’ केवल सुनाई न देने के बजाय जानबूझकर ध्यान न देने का अर्थ बनाए रखता है।
- source_word: וַתִּתְּנֵם בְּיַד
  choice: इसलिए आपने उन्हें ... के हाथ में कर दिया
  rationale: वाक्यक्रम परिणाम प्रकट करता है। ‘हाथ में कर दिया’ दूसरे के अधिकार में सौंपे जाने का परिचित बाइबलीय मुहावरा सुरक्षित रखता है।
- source_word: עַמֵּי הָאֲרָצוֹת
  choice: दूसरे देशों के लोगों
  rationale: बहुवचन אֲרָצוֹת आसपास के देशों या भूभागों की ओर संकेत करता है। ‘दूसरे देशों’ से इस्राएल के बाहर की राजनीतिक जातियों का आशय सहज रूप से स्पष्ट होता है।
theological_decisions:
- issue: ‘आपकी आत्मा’ का संदर्भ
  choice: परमेश्वर की आत्मा, जो नबियों के माध्यम से चेतावनी देती है
  alternative: परमेश्वर का स्वभाव, मनोभाव या श्वास
  rationale: ‘अपनी आत्मा से ... अपने नबियों के द्वारा’ की रचना भविष्यद्वाणी के पीछे दिव्य अभिकरण को सबसे स्वाभाविक रूप से व्यक्त करती है, पर बाद की विस्तृत धर्मसैद्धांतिक अवधारणाएँ पद में नहीं जोड़ी गईं।
- issue: וַתָּעַד בָּם का चेतावनी और न्यायिक गवाही के बीच अर्थ
  choice: मुख्य पाठ में ‘चेतावनी देते रहे’
  alternative: ‘उनके विरुद्ध गवाही देते रहे’
  rationale: संदर्भ में उद्देश्य लोगों को लौटने के लिए बार-बार सचेत करना है, जबकि क्रिया में वाचा-संबंधी या न्यायिक गवाही का वास्तविक भाव भी संभव है; इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का आदरपूर्ण, प्रार्थनामय और सहज रूप अपनाया गया है। परमेश्वर के लिए ‘आप’ रखा गया है। ‘नबी’, ‘आत्मा’, ‘कान न लगाना’ और ‘हाथ में कर देना’ जैसे व्यापक रूप से समझे जाने वाले बाइबलीय पदबंध बनाए रखे गए हैं।
