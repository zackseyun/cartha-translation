  terminology: वाचा, हृदय, विश्वासयोग्य, वंश, वचन, and धर्मी are appropriate in a dignified modern Hindi biblical register. The established Hindi forms of the people names are retained. The alternatives in the footnotes are relevant; minor punctuation and wording are regularized.
  issues:
