base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/008.yaml
  text: You found his heart faithful before you[a], and made a covenant with him to give the land of the Canaanite, the Hittite, the Amorite, the Perizzite, the Jebusite, and the Girgashite—to give it to his offspring. And you have fulfilled your words[c][b], for you are righteous.
translation:
  language: hi
  text: तूने पाया कि उसका हृदय तेरे सामने विश्वासयोग्य था, और तूने उसके साथ यह वाचा बाँधी कि तू कनानियों, हित्तियों, एमोरियों, परिज्जियों, यबूसियों और गिर्गाशियों का देश उसके वंश[a] को देगा। तूने अपने वचनों[b] को पूरा किया, क्योंकि तू धर्मी[c] है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसकी सन्तानों’ अथवा ‘उसके वंशजों’; इब्रानी शब्द का शाब्दिक अर्थ ‘बीज’ है और वह सामूहिक एकवचन है।
    reason: lexical_alternative
  - marker: b
    text: या ‘तूने अपने वचनों को स्थापित किया’ अथवा ‘सिद्ध कर दिखाया’।
    reason: lexical_alternative
  - marker: c
    text: या ‘न्यायी’।
    reason: alternative_reading
lexical_decisions:
- source_word: וּמָצָאתָ
  choice: तूने पाया
  rationale: מצא के सामान्य अर्थ ‘पाना’ को सीधे रखता है और यहाँ अब्राम के भीतरी स्वभाव के विषय में परमेश्वर के आकलन के लिए स्वाभाविक है।
- source_word: לְבָבוֹ נֶאֱמָן לְפָנֶיךָ
  choice: उसका हृदय तेरे सामने विश्वासयोग्य था
  rationale: ‘हृदय’ भीतरी व्यक्ति, इच्छा और प्रवृत्ति को व्यक्त करता है; נֶאֱמָן के लिए ‘विश्वासयोग्य’ विश्वस्तता और निष्ठा दोनों का भाव सुरक्षित रखता है; ‘तेरे सामने’ לְפָנֶיךָ की संबंधपरक और मूल्यांकनात्मक छटा बनाए रखता है।
- source_word: וְכָרוֹת עִמּוֹ הַבְּרִית
  choice: और तूने उसके साथ यह वाचा बाँधी
  rationale: כרת ברית का शाब्दिक रूप ‘वाचा काटना’ हिन्दी में अस्वाभाविक है; ‘वाचा बाँधना’ प्रचलित, गरिमापूर्ण और अर्थतः सटीक मुहावरा है।
- source_word: לָתֵת ... לָתֵת לְזַרְעוֹ
  choice: कि तू ... देश देगा—उसे उसके वंश को देगा
  rationale: दो बार आए לָתֵת की पुनरावृत्ति को डैश के साथ बनाए रखा गया है, जिससे वाचा की विषयवस्तु और प्राप्तकर्ता दोनों पर मूल का बल बना रहता है।
- source_word: אֶרֶץ הַכְּנַעֲנִי ... וְהַגִּרְגָּשִׁי
  choice: कनानियों, हित्तियों, एमोरियों, परिज्जियों, यबूसियों और गिर्गाशियों का देश
  rationale: इब्रानी जातिवाचक एकवचनों को स्वाभाविक हिन्दी सामूहिक बहुवचन में रखा गया है; ‘देश’ אֶרֶץ के भूभाग और प्रतिज्ञात देश दोनों भावों के अनुकूल है।
- source_word: לְזַרְעוֹ
  choice: उसके वंश
  rationale: זֶרַע सामूहिक एकवचन है। ‘वंश’ हिन्दी में सामूहिक अर्थ बनाए रखता है और ‘बीज’ की अपेक्षा इस संदर्भ में अधिक स्वाभाविक है; ‘सन्तानों’ का विकल्प पादटिप्पणी में दिया गया है।
- source_word: וַתָּקֶם אֶת־דְּבָרֶיךָ
  choice: तूने अपने वचनों को पूरा किया
  rationale: קום के हिफ़ील रूप का यहाँ भाव कथित बातों को साकार करना है। ‘पूरा किया’ इस संदर्भ में स्वाभाविक है, जबकि बहुवचन ‘वचनों’ דְּבָרֶיךָ की व्याकरणिक संख्या सुरक्षित रखता है।
- source_word: כִּי צַדִּיק אָתָּה
  choice: क्योंकि तू धर्मी है
  rationale: כִּי का कारणसूचक अर्थ ‘क्योंकि’ से स्पष्ट होता है। ‘धर्मी’ צַדִּיק के व्यापक नैतिक और वाचागत अर्थ को ‘न्यायी’ की अपेक्षा अधिक पूर्ण रूप से बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के लिए צַדִּיק का अनुवाद
  choice: धर्मी
  alternative: न्यायी
  rationale: दोनों अर्थ सम्भव हैं, पर ‘धर्मी’ परमेश्वर की नैतिक सच्चाई और वाचा निभाने की विश्वसनीयता को व्यापक रूप से व्यक्त करता है; ‘न्यायी’ अर्थ को मुख्यतः न्यायिक दिशा में सीमित कर सकता है। विकल्प पादटिप्पणी में सुरक्षित है।
- issue: זֶרַע की सामूहिकता
  choice: वंश
  alternative: सन्तानें / वंशज
  rationale: मूल शब्द व्याकरणतः एकवचन और अर्थतः सामूहिक है। ‘वंश’ इस सामूहिक तनाव को बनाए रखता है और यह तय नहीं करता कि संकेत केवल एक व्यक्ति की ओर है या अनेक वंशजों की ओर।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण प्रार्थना-शैली रखी गई है। परमेश्वर के लिए मूल के एकवचन निकट संबोधन के अनुरूप ‘तू/तेरे’ का प्रयोग हुआ है। जातिनाम हिन्दी बाइबलीय परम्परा के पहचाने जाने योग्य रूपों में हैं। मूल में לָתֵת की पुनरावृत्ति को डैश सहित दोहराकर अर्थगत बल और लय दोनों बचाए गए हैं।
