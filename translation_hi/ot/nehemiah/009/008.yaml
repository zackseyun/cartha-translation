  source_fidelity: 'The draft accurately renders the principal Hebrew clauses: God finds Abraham''s heart faithful before him, makes a covenant, promises the land of the listed peoples to Abraham''s collective offspring, and fulfills his words because he is righteous. The ethnonyms, covenant language, collective sense of זַרְעוֹ, and the broad rendering धर्मी for צַדִּיק are all suitable.'
