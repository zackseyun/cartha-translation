    issue: Awkward duplicated promise clause
    rationale: “देश देगा—उसे उसके वंश को देगा” is not idiomatic Hindi and can momentarily obscure that the land is what is given to Abraham's offspring. Hebrew repeats לָתֵת, but Hindi need not reproduce that repetition with two finite verbs when doing so damages clarity.
