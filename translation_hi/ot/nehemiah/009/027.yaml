base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/027.yaml
  text: So you gave them into the hand of their adversaries[a], who oppressed them. But in the time of their distress they cried out to you, and you heard from heaven; and according to your abundant mercies you gave them deliverers, who saved them from the hand of their adversaries.
translation:
  language: hi
  text: तब तूने उन्हें उनके शत्रुओं के हाथ में सौंप दिया, और उन्होंने उन्हें सताया। पर उनके संकट के समय उन्होंने तेरी दुहाई दी, और तूने स्वर्ग से उनकी पुकार सुनी। अपनी अपार करुणा के अनुसार तूने उन्हें छुड़ानेवाले[a] दिए, जिन्होंने उन्हें उनके शत्रुओं के हाथ से बचाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उद्धारकर्ता।” इब्रानी शब्द “बचाना” क्रिया से बना है और यहाँ उन मनुष्यों को दर्शाता है जिन्हें परमेश्वर ने उन्हें छुड़ाने के लिए खड़ा किया।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתְּנֵם בְּיַד
  choice: तूने उन्हें ... के हाथ में सौंप दिया
  rationale: נתן के साथ בְּיַד किसी के अधिकार में कर देने का बोध देता है। ‘हाथ में सौंप दिया’ इब्रानी बिंब को रखते हुए स्वाभाविक हिन्दी है।
- source_word: צָרֵיהֶם
  choice: उनके शत्रुओं
  rationale: צַר यहाँ विरोधी या बैरी को दर्शाता है। ‘शत्रु’ सामान्य, स्पष्ट और अगले क्रियापद ‘सताया’ से अलग अर्थ रखने वाला शब्द है।
- source_word: וַיָּצֵרוּ לָהֶם
  choice: उन्होंने उन्हें सताया
  rationale: क्रिया दबाने, संकट में डालने या उत्पीड़ित करने का भाव रखती है; ‘सताया’ आधुनिक हिन्दी में स्वाभाविक और संदर्भानुकूल है।
- source_word: וּבְעֵת צָרָתָם
  choice: पर संकट के समय
  rationale: עֵת צָרָה का कालगत अर्थ सीधे व्यक्त होता है। ‘पर’ घटनाक्रम में निहित विरोध को स्पष्ट करता है।
- source_word: יִצְעֲקוּ אֵלֶיךָ
  choice: उन्होंने तेरी दुहाई दी
  rationale: צעק संकट में सहायता के लिए जोर से पुकारने को दर्शाता है; ‘दुहाई दी’ इसकी तीव्रता और दिशा दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִשָּׁמַיִם תִּשְׁמָע
  choice: तूने स्वर्ग से उनकी सुनी
  rationale: ‘स्वर्ग से’ मूल के स्थान-सूचक भाव को बनाए रखता है। ऐतिहासिक वर्णन में क्रिया को पूर्ण भूतकाल में रखना हिन्दी में स्वाभाविक है।
- source_word: וּכְרַחֲמֶיךָ הָרַבִּים
  choice: अपनी अपार करुणा के अनुसार
  rationale: रַחֲמִים की प्रचुर और गहन दया को ‘अपार करुणा’ सहज हिन्दी में व्यक्त करती है, जबकि ‘के अनुसार’ כְּ का संबंध बनाए रखता है।
- source_word: מֹשִׁיעִים
  choice: छुड़ानेवाले
  rationale: ישׁע से बना यह बहुवचन सहभागी संज्ञा उन मानवीय साधनों को दर्शाती है जिन्हें परमेश्वर ने बचाव के लिए दिया। ‘छुड़ानेवाले’ कार्य को स्पष्ट करता है और इसे परम उद्धारकर्ता की उपाधि समझे जाने से बचाता है।
- source_word: וְיוֹשִׁיעוּם
  choice: जिन्होंने उन्हें ... से बचाया
  rationale: संबंधवाचक उपवाक्य ‘छुड़ानेवालों’ के कार्य को सहजता से जोड़ता है और ישׁע के बचाने के अर्थ को स्पष्ट रखता है।
- source_word: מִיַּד צָרֵיהֶם
  choice: उनके शत्रुओं के हाथ से
  rationale: यह आरंभ के ‘हाथ में’ वाले अधिकार-बिंब को दोहराता है; समान शब्दावली मूल की संरचनात्मक पुनरावृत्ति सुरक्षित रखती है।
theological_decisions:
- issue: मानवीय व्यक्तियों के लिए מֹשִׁיעִים का अनुवाद
  choice: छुड़ानेवाले
  alternative: उद्धारकर्ता
  rationale: संदर्भ में ये परमेश्वर द्वारा दिए गए मानवीय बचानेवाले हैं। ‘छुड़ानेवाले’ मूल कार्य को व्यक्त करता है, जबकि ‘उद्धारकर्ता’ विकल्प को पादटिप्पणी में रखकर मूल शब्द की धार्मिक प्रतिध्वनि भी दिखाई गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सरल शैली अपनाई गई है। परमेश्वर के लिए एकवचन निकट संबोधन ‘तू/तेरी’ रखा गया है, जो इस प्रार्थना के प्रत्यक्ष संबोधन और हिन्दी बाइबिलीय शैली के अनुरूप है।
