  terminology: ‘शत्रु,’ ‘हाथ में/हाथ से,’ ‘सताया,’ and ‘छुड़ानेवाले’ are appropriate. ‘छुड़ानेवाले’ suitably identifies the מוֹשִׁיעִים as human agents without importing a doctrinal distinction not demanded by the text. The footnote’s alternative ‘उद्धारकर्ता’ and its explanation are appropriate.
  issues:
