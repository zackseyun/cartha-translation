  source_fidelity: 'The draft accurately represents the sequence and principal Hebrew expressions: handing Israel over to adversaries, oppression, their cry, God’s hearing from heaven, abundant compassion, human deliverers, and rescue from adversaries. A small explicit addition is warranted because Hindi ‘उनकी सुनी’ is grammatically elliptical and can sound incomplete; the Hebrew object is the people/their cry in context.'
