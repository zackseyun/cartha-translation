  text: וְ/אַרְבָּעִ֥ים שָׁנָ֛ה כִּלְכַּלְתָּ֥/ם בַּ/מִּדְבָּ֖ר לֹ֣א חָסֵ֑רוּ שַׂלְמֹֽתֵי/הֶם֙ לֹ֣א בָל֔וּ וְ/רַגְלֵי/הֶ֖ם לֹ֥א בָצֵֽקוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/021.yaml
  text: For forty years you sustained them in the wilderness[a]; they lacked nothing. Their clothes did not wear out[b], and their feet did not swell.
translation:
  language: hi
  text: चालीस वर्ष तक तूने जंगल में उनका पालन-पोषण किया; उन्हें किसी चीज़ की कमी नहीं हुई। उनके वस्त्र नहीं घिसे, और उनके पाँव नहीं सूजे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּלְכַּלְתָּם
  choice: तूने उनका पालन-पोषण किया
  rationale: पोलैल रूप यहाँ निरंतर संभालने और आवश्यकताएँ पूरी करने का व्यापक भाव देता है; ‘पालन-पोषण किया’ इसे केवल भोजन देने तक सीमित नहीं करता।
- source_word: בַּמִּדְבָּר
  choice: जंगल में
  rationale: מִדְבָּר निर्जन, वन्य या मरुस्थलीय प्रदेश को दर्शाता है; इस्राएल की यात्रा के संदर्भ में आधुनिक हिन्दी का ‘जंगल’ स्वाभाविक और व्यापक है।
- source_word: לֹא חָסֵרוּ
  choice: उन्हें किसी चीज़ की कमी नहीं हुई
  rationale: यह पूर्ण अभाव-निषेध को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: שַׂלְמֹתֵיהֶם
  choice: उनके वस्त्र
  rationale: שַׂלְמָה सामान्यतः परिधान, विशेषकर बाहरी वस्त्र, को सूचित करता है; ‘वस्त्र’ dignified और स्पष्ट है।
- source_word: לֹא בָלוּ
  choice: पुराने नहीं हुए
  rationale: בלה का अर्थ घिसकर जर्जर हो जाना है; वस्त्रों के लिए ‘पुराने नहीं हुए’ सरल हिन्दी है और खराब न होने का भाव रखता है।
- source_word: וְרַגְלֵיהֶם לֹא בָצֵקוּ
  choice: और उनके पाँव नहीं सूजे
  rationale: בצק यहाँ शरीर के अंग के सूजने या फूलने को दर्शाता है; ‘पाँव नहीं सूजे’ संक्षिप्त और स्वाभाविक है।
- source_word: וְאַרְבָּעִים שָׁנָה
  choice: चालीस वर्ष तक
  rationale: आरंभिक וְ पिछले कथन से संबंध जोड़ता है, जबकि समयावधि को हिन्दी में ‘चालीस वर्ष तक’ स्पष्ट रूप से व्यक्त किया गया है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सामूहिक प्रार्थना के संदर्भानुकूल शैली। परमेश्वर के लिए निकटवर्ती एकवचन संबोधन ‘तूने’ रखा गया है, जैसा इब्रानी क्रिया के एकवचन रूप में है।
