  edition: WLC
  text: וּ/בְ/עַמּ֣וּד עָנָ֔ן הִנְחִיתָ֖/ם יוֹמָ֑ם וּ/בְ/עַמּ֥וּד אֵשׁ֙ לַ֔יְלָה לְ/הָאִ֣יר לָ/הֶ֔ם אֶת הַ/דֶּ֖רֶךְ אֲשֶׁ֥ר יֵֽלְכוּ בָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/012.yaml
  text: By a pillar of cloud you led them by day[a], and by a pillar of fire by night to give them light on the way in which they should go.
translation:
  language: hi
  text: दिन में बादल के खंभे से और रात में आग के खंभे से तूने उनकी अगुवाई की, ताकि जिस मार्ग पर उन्हें चलना था, उस पर उन्हें प्रकाश मिले।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “उनके लिए मार्ग को प्रकाशित करने के लिए।”'
    reason: इब्रानी में ‘मार्ग’ प्रत्यक्ष कर्म है; मुख्य पाठ में इसका स्वाभाविक हिन्दी अर्थ दिया गया है।
lexical_decisions:
- source_word: וּבְעַמּוּד עָנָן
  choice: बादल के खंभे से
  rationale: בְּ का साधनवाचक अर्थ यहाँ स्वाभाविक है; यह बताता है कि परमेश्वर ने बादल के खंभे के माध्यम से अगुवाई की।
- source_word: הִנְחִיתָם
  choice: तूने उनकी अगुवाई की
  rationale: נחה के हिफ़ील रूप का प्रसंगानुकूल अर्थ मार्ग दिखाना या अगुवाई करना है। भूतकालीन क्रिया इब्रानी पूर्ण रूप को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: יוֹמָם
  choice: दिन में
  rationale: यह समयसूचक क्रियाविशेषण है और לַיְלָה ‘रात में’ के साथ संतुलित समानांतर बनाता है।
- source_word: וּבְעַמּוּד אֵשׁ
  choice: और रात में आग के खंभे से
  rationale: बादल के खंभे वाले वाक्यांश की समानांतर रचना और साधनवाचक अर्थ सुरक्षित रखा गया है।
- source_word: לְהָאִיר לָהֶם
  choice: ताकि ... उन्हें प्रकाश मिले
  rationale: हिफ़ील infinitive उद्देश्य को व्यक्त करता है। हिन्दी में यह रचना स्वाभाविक है और לָהֶם के हितवाचक भाव को बनाए रखती है।
- source_word: אֶת הַדֶּרֶךְ אֲשֶׁר יֵלְכוּ בָהּ
  choice: जिस मार्ग पर उन्हें चलना था
  rationale: ‘मार्ग’ को प्रकाशित किए जाने और उसी पर इस्राएलियों के चलने—दोनों अर्थों को सहज हिन्दी में जोड़ा गया है; ‘चलना था’ अभिप्रेत मार्ग को व्यक्त करता है।
theological_decisions:
- issue: जंगल की यात्रा में परमेश्वर के मार्गदर्शन का चित्रण
  choice: बादल और आग के खंभों के द्वारा इस्राएल की ऐतिहासिक अगुवाई को सीधे रूप में प्रस्तुत किया गया है।
  alternative: मुख्य पाठ में खंभों को स्पष्ट रूप से परमेश्वर की उपस्थिति या किसी बाद की प्रतीकात्मक पूर्ति का चिह्न बताना।
  rationale: इब्रानी पाठ यहाँ अगुवाई और मार्ग को प्रकाशित करने पर बल देता है; अतिरिक्त प्रतीकात्मक या संप्रदायगत व्याख्या पाठ में नहीं जोड़ी गई।
- issue: प्रकाश देने वाले उद्देश्य-वाक्य का संबंध
  choice: उद्देश्य को पूरी अगुवाई, विशेषकर रात के आग के खंभे, से स्वाभाविक रूप से जोड़ा गया है।
  alternative: इसे केवल आग के खंभे की क्रिया मानकर ‘उसने मार्ग प्रकाशित किया’ कहना।
  rationale: इब्रानी शब्दक्रम निकटतम रूप से आग के खंभे से संबंध सुझाता है, पर उद्देश्य-वाक्य व्यापक अगुवाई का परिणाम भी हो सकता है; हिन्दी पाठ इस संबंध को अनावश्यक रूप से संकीर्ण नहीं करता।
translation_notes:
  register: आधुनिक, स्पष्ट और गरिमापूर्ण हिन्दी; प्रार्थना में परमेश्वर को संबोधित करने के कारण एकवचन आत्मीय ‘तू’ रखा गया है। ‘खंभा’, ‘अगुवाई’ और ‘मार्ग’ सामान्य बाइबिलीय शब्दावली के साथ-साथ साधारण पाठक के लिए भी सुबोध हैं।
