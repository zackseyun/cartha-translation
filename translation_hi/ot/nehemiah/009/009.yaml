source:
  edition: WLC
  text: וַ/תֵּ֛רֶא אֶת עֳנִ֥י אֲבֹתֵ֖י/נוּ בְּ/מִצְרָ֑יִם וְ/אֶת זַעֲקָתָ֥/ם שָׁמַ֖עְתָּ עַל יַם סֽוּף־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/009.yaml
  text: You saw the affliction of our fathers in Egypt[a], and you heard their cry at the Red Sea.
translation:
  language: hi
  text: तूने मिस्र में हमारे पुरखाओं का दुःख देखा और सरकंडों के सागर[a] के पास उनकी पुकार सुनी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'परंपरागत अनुवाद: “लाल सागर।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: तूने ... देखा
  rationale: ראה का सीधा अर्थ ‘देखना’ है; यहाँ परमेश्वर द्वारा उनकी दशा पर ध्यान देने का भाव संदर्भ से स्पष्ट रहता है।
- source_word: עֳנִי
  choice: दुःख
  rationale: यह शब्द पीड़ा, दीन दशा या क्लेश को दर्शाता है। ‘दुःख’ आधुनिक हिन्दी में स्वाभाविक और व्यापक है तथा कारण को अनावश्यक रूप से सीमित नहीं करता।
- source_word: אֲבֹתֵינוּ
  choice: हमारे पुरखाओं
  rationale: पुल्लिंग बहुवचन रूप समुदाय के पूर्वज पितरों को सूचित करता है। ‘पुरखाओं’ से मूल का पुरुषवाचक और पूर्वज-संबंधी भाव सहज हिन्दी में बना रहता है।
- source_word: בְּמִצְרָיִם
  choice: मिस्र में
  rationale: यह मिस्र को दुःख के स्थान के रूप में बताने वाला सीधा स्थानवाचक पद है।
- source_word: זַעֲקָתָם
  choice: उनकी पुकार
  rationale: זְעָקָה संकट में सहायता के लिए की गई पुकार है; ‘पुकार’ संक्षिप्त, स्वाभाविक और अर्थपूर्ण है।
- source_word: שָׁמַעְתָּ
  choice: तूने ... सुनी
  rationale: שמע का मूल अर्थ ‘सुनना’ है; प्रार्थना के संदर्भ में ध्यान देने या उत्तर देने का निहित भाव बिना विस्तार जोड़े बना रहता है।
- source_word: עַל
  choice: के पास
  rationale: स्थान के साथ עַל यहाँ समुद्र के निकट की स्थिति दर्शाता है; ‘के पास’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: יַם סוּף
  choice: सरकंडों का सागर
  rationale: यह हिब्रू पद के शब्दार्थ को पारदर्शी रूप से प्रस्तुत करता है। परंपरागत नाम ‘लाल सागर’ पाठकों के लिए पादटिप्पणी में दिया गया है।
theological_decisions: []
translation_notes:
  register: एकवचन परमेश्वर-संबोधन के लिए ‘तू’ रखा गया है, जो हिन्दी बाइबल की प्रार्थना-भाषा में आत्मीय और गरिमापूर्ण है। वाक्य सरल, आधुनिक और मूल हिब्रू की समानांतर रचना के निकट है।
