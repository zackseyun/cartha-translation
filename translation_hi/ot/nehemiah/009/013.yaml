id: NEH.9.13
reference: Nehemiah 9:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/עַ֤ל הַר סִינַי֙ יָרַ֔דְתָּ וְ/דַבֵּ֥ר עִמָּ/הֶ֖ם מִ/שָּׁמָ֑יִם וַ/תִּתֵּ֨ן לָ/הֶ֜ם מִשְׁפָּטִ֤ים יְשָׁרִים֙ וְ/תוֹר֣וֹת אֱמֶ֔ת חֻקִּ֥ים וּ/מִצְוֺ֖ת טוֹבִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/013.yaml
  text: You came down on Mount Sinai and spoke with them from heaven[a], and you gave them upright judgments, true laws[c][b], good statutes and commandments.
translation:
  language: hi
  text: तू सीनै पर्वत पर उतरा और स्वर्ग से उनके साथ बातें कीं[a]; तूने उन्हें न्यायपूर्ण निर्णय[b], सत्य की शिक्षाएँ[c], और अच्छी विधियाँ और आज्ञाएँ दीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनसे बातें कीं।” इब्रानी संबंधबोधक शब्द का शाब्दिक अर्थ “साथ” है, पर सन्दर्भ में संबोधन का भाव भी सम्भव है।
    reason: lexical_alternative
  - marker: b
    text: या “सीधे निर्णय” अथवा “सही न्याय-विधान।”
    reason: lexical_alternative
  - marker: c
    text: या “सच्ची व्यवस्थाएँ” अथवा “सत्य की विधियाँ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל הַר סִינַי יָרַדְתָּ
  choice: तू सीनै पर्वत पर उतरा
  rationale: עַל को सहज हिन्दी में ‘पर’ और ירד को प्रत्यक्ष संबोधन में ‘उतरा’ किया गया है; ‘सीनै पर्वत’ प्रचलित बाइबलीय नाम है।
- source_word: וְדַבֵּר עִמָּהֶם מִשָּׁמָיִם
  choice: और स्वर्ग से उनके साथ बातें कीं
  rationale: עִם का मूल भाव ‘साथ’ रखकर संवादात्मक अभिव्यक्ति सुरक्षित की गई है; מִשָּׁמָיִם को ‘स्वर्ग से’ किया गया है।
- source_word: וַתִּתֵּן לָהֶם
  choice: तूने उन्हें ... दीं
  rationale: נתן + ל का स्वाभाविक हिन्दी रूप है और प्रार्थना का द्वितीय पुरुष एकवचन संबोधन स्पष्ट रहता है।
- source_word: מִשְׁפָּטִים יְשָׁרִים
  choice: न्यायपूर्ण निर्णय
  rationale: מִשְׁפָּטִים का न्यायिक भाव ‘निर्णय’ से और יְשָׁרִים का नैतिक-कानूनी भाव ‘न्यायपूर्ण’ से व्यक्त होता है।
- source_word: וְתוֹרוֹת אֱמֶת
  choice: सत्य की शिक्षाएँ
  rationale: תּוֹרוֹת बहुवचन में शिक्षाओं या विधियों को सूचित कर सकता है। ‘सत्य की शिक्षाएँ’ סמיכות-जैसे संबंध की औपचारिक छाया और व्यापक शिक्षात्मक अर्थ दोनों बचाता है।
- source_word: חֻקִּים
  choice: विधियाँ
  rationale: חֻקִּים के निर्धारित नियमों वाले कानूनी भाव को ‘विधियाँ’ व्यक्त करता है और इसे अन्य कानूनी संज्ञाओं से अलग रखता है।
- source_word: וּמִצְוֺת
  choice: आज्ञाएँ
  rationale: वाचा-संबंधी कानूनी संदर्भ में מִצְוָה का स्पष्ट और प्रचलित हिन्दी समतुल्य है।
- source_word: טוֹבִים
  choice: अच्छी
  rationale: सरल मूल्यांकन ‘अच्छी’ मूल अर्थ को बिना अनावश्यक विस्तार के रखता है; हिन्दी वाक्य में इसे अंतिम दोनों श्रेणियों पर लागू समझा जा सकता है।
theological_decisions:
- issue: सिनै पर कानूनी शब्दावली की बहुलता
  choice: निर्णय, शिक्षाएँ, विधियाँ और आज्ञाएँ—चार भिन्न पद बनाए रखे गए हैं।
  alternative: सूची को केवल ‘नियम और आज्ञाएँ’ जैसे कम पदों में समेटना।
  rationale: इब्रानी पाठ परमेश्वर के प्रकाशन की विविधता और पूर्णता दिखाने के लिए कई निकटार्थी कानूनी शब्द रखता है; उन्हें अलग रखना पाठ की बनावट और धार्मिक तनाव को सुरक्षित करता है।
- issue: וְתוֹרוֹת אֱמֶת का अर्थ
  choice: सत्य की शिक्षाएँ
  alternative: सच्ची व्यवस्थाएँ / सत्य की विधियाँ
  rationale: תּוֹרָה केवल संहिताबद्ध कानून नहीं, शिक्षा या निर्देश भी हो सकती है। ‘सत्य की शिक्षाएँ’ इस व्यापकता को बचाती है, जबकि पादटिप्पणी कानूनी विकल्प देती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। प्रार्थना के निकट संबोधन के अनुरूप ‘तू’ रखा गया है। कानूनी शब्दों को यथासंभव अलग रखते हुए अत्यधिक संस्कृतनिष्ठ भाषा से बचा गया है।
