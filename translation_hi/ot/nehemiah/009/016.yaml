language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הֵ֥ם וַ/אֲבֹתֵ֖י/נוּ הֵזִ֑ידוּ וַ/יַּקְשׁוּ֙ אֶת עָרְפָּ֔/ם וְ/לֹ֥א שָׁמְע֖וּ אֶל מִצְוֺתֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/016.yaml
  text: But they[a], our fathers, acted presumptuously and stiffened their neck[c][b], and did not listen to your commandments.
translation:
  language: hi
  text: परन्तु वे, हमारे पुरखों ने, ढिठाई की और अपनी गर्दन अकड़ा ली[a]; उन्होंने आपकी आज्ञाओं पर ध्यान नहीं दिया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह इब्रानी मुहावरा हठी और विद्रोही हो जाने का संकेत देता है।
    reason: cultural_note
  - marker: b
    text: या “आपकी आज्ञाएँ नहीं मानीं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵם וַאֲבֹתֵינוּ
  choice: परन्तु वे, अर्थात् हमारे पुरखे
  rationale: स्वतंत्र सर्वनाम और संयोजक पिछले प्रसंग में परमेश्वर के अनुग्रहपूर्ण कार्यों के विपरीत पूर्वजों की प्रतिक्रिया दिखाते हैं। ‘अर्थात्’ हिन्दी में ‘वे’ और ‘हमारे पुरखे’ के समान निर्देश को स्पष्ट और स्वाभाविक बनाता है।
- source_word: הֵזִידוּ
  choice: ढिठाई से काम करने लगे
  rationale: זיד में घमण्ड, धृष्टता और जान-बूझकर उद्दंड आचरण का भाव है। यह अभिव्यक्ति केवल मनोवृत्ति नहीं, व्यवहार भी व्यक्त करती है।
- source_word: וַיַּקְשׁוּ אֶת־עָרְפָּם
  choice: उन्होंने अपनी गर्दन अकड़ा ली
  rationale: मूल इब्रानी रूपक को बनाए रखते हुए यह स्वाभाविक हिन्दी में हठी और विद्रोही होने का भाव व्यक्त करता है।
- source_word: וְלֹא שָׁמְעוּ אֶל
  choice: उन्होंने ... पर ध्यान नहीं दिया
  rationale: שמע אל का अर्थ सुनना, ध्यान देना या मानना हो सकता है। ‘ध्यान नहीं दिया’ श्रवण और अवज्ञा के बीच मूल की अर्थ-व्याप्ति बनाए रखता है, बिना सीधे ‘पालन नहीं किया’ कहकर परिणाम को ही अनुवाद बनाने के।
- source_word: מִצְוֺתֶיךָ
  choice: आपकी आज्ञाओं
  rationale: ‘आज्ञाएँ’ वाचा और व्यवस्था से जुड़े आदेशों के लिए गरिमापूर्ण तथा सामान्य आधुनिक हिन्दी शब्द है।
theological_decisions:
- issue: पहली पीढ़ियों के पाप के साथ सामुदायिक पहचान
  choice: हमारे पुरखे
  alternative: हमारे पिता
  rationale: मूल का शाब्दिक अर्थ ‘हमारे पिता’ है, पर इस ऐतिहासिक प्रार्थना में इसका आशय पिछली पीढ़ियों से है। ‘हमारे पुरखे’ आधुनिक हिन्दी में वही सामुदायिक और वाचागत ऐतिहासिक संबंध स्पष्ट करता है, जैविक पिताओं तक अर्थ को सीमित नहीं करता।
- issue: שמע की आज्ञापालन-संबंधी अर्थछाया
  choice: ध्यान नहीं दिया
  alternative: आज्ञाओं का पालन नहीं किया
  rationale: मूल क्रिया सुनने, ध्यान देने और मानने के बीच अर्थगत तनाव रखती है। मुख्य पाठ में ‘ध्यान नहीं दिया’ उस तनाव को बचाता है; पादटिप्पणी आज्ञापालन की संभावित अर्थछाया बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। ‘परन्तु’ प्रसंगगत विरोध को, ‘पुरखे’ ऐतिहासिक सामुदायिक पहचान को, और ‘गर्दन अकड़ा ली’ मूल रूपक को स्वाभाविक हिन्दी में सुरक्षित रखते हैं।
