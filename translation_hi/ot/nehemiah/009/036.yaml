source:
  edition: WLC
  text: הִנֵּ֛ה אֲנַ֥חְנוּ הַ/יּ֖וֹם עֲבָדִ֑ים וְ/הָ/אָ֜רֶץ אֲשֶׁר נָתַ֣תָּה לַ/אֲבֹתֵ֗י/נוּ לֶ/אֱכֹ֤ל אֶת פִּרְיָ/הּ֙ וְ/אֶת טוּבָ֔/הּ הִנֵּ֛ה אֲנַ֥חְנוּ עֲבָדִ֖ים עָלֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/036.yaml
  text: Look[a], today we are servants; and in the land that you gave to our fathers to eat its fruit and its good things, look[c][b], we are servants on it.
translation:
  language: hi
  text: देखिए, आज हम दास[a] हैं। और जिस देश को आपने हमारे पुरखाओं को दिया था ताकि वे उसका फल और उसकी अच्छी चीज़ें[b] खाएँ, देखिए, उसी देश में[c] हम दास हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सेवक”; इब्रानी शब्द अधीनता में रहने वाले लोगों को दर्शाता है, और यहाँ संभवतः साम्राज्यवादी शासन के अधीन यहूदा की दासता पर बल है।
    reason: lexical_alternative
  - marker: b
    text: या “उसकी भरपूरी।”
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में शाब्दिक रूप से “उस पर” है—अर्थात उसी देश में जिसे परमेश्वर ने उनके पुरखाओं को दिया था।
    reason: cultural_note
lexical_decisions:
- source_word: הִנֵּה
  choice: देखिए
  rationale: यह ध्यान आकर्षित करने वाला विस्मयादिबोधक अव्यय है। ‘देखिए’ आधुनिक हिन्दी में स्वाभाविक है और विलाप के ज़ोर को बनाए रखता है।
- source_word: הַיּוֹם
  choice: आज
  rationale: यह वर्तमान दासता को अतीत में मिले देश के वरदान के विपरीत रखता है।
- source_word: עֲבָדִים
  choice: दास
  rationale: यहाँ शब्द विदेशी साम्राज्य के अधीन बँधी हुई और पराधीन स्थिति पर ज़ोर देता है; ‘दास’ इस अर्थ को ‘सेवक’ से अधिक स्पष्ट रूप से व्यक्त करता है।
- source_word: וְהָאָרֶץ
  choice: और जो देश
  rationale: इब्रानी वाक्य में संबंध कुछ संक्षिप्त है। हिन्दी में ‘जो देश’ आगे के संबंधवाचक उपवाक्य को स्वाभाविक रूप से जोड़ता है।
- source_word: אֲשֶׁר נָתַתָּה לַאֲבֹתֵינוּ
  choice: जो देश आपने हमारे पुरखाओं को दिया था
  rationale: परमेश्वर से सीधे संबोधन और पूर्वजों को देश दिए जाने के ऐतिहासिक-वाचा संबंधी संदर्भ, दोनों को बनाए रखता है। ‘पुरखाओं’ से इब्रानी के पुरुषवाचक पारिवारिक संकेत का स्वाभाविक हिन्दी रूप मिलता है।
- source_word: לֶאֱכֹל
  choice: कि वे … खाएँ
  rationale: 'यह उद्देश्य बताने वाला infinitive है: देश इसलिए दिया गया था कि पुरखे उसकी उपज का आनंद लें।'
- source_word: פִּרְיָהּ
  choice: उसका फल
  rationale: कृषि-संबंधी मूल बिंब को सीधे और स्पष्ट रूप में रखता है।
- source_word: טוּבָהּ
  choice: उसकी अच्छी चीज़ें
  rationale: यह देश की अच्छाई और प्रचुर देनों का व्यापक संकेत है। ‘अच्छी चीज़ें’ अर्थ को केवल कृषि-उपज तक सीमित नहीं करता।
- source_word: עָלֶיהָ
  choice: उसी देश में
  rationale: मूलतः ‘उस पर’ है, पर हिन्दी में देश के भीतर राजनीतिक पराधीनता के लिए ‘उसी देश में’ स्वाभाविक है। ‘उसी’ उस विडंबना पर बल देता है कि परमेश्वर के दिए देश में ही वे दास हैं।
theological_decisions:
- issue: वाचा-विलाप के संदर्भ में עֲבָדִים का अनुवाद
  choice: दास
  alternative: सेवक
  rationale: पद अपने ही देश में विदेशी शासन के अधीन इस्राएल की स्वतंत्रता-विहीन दशा का विलाप करता है। इसलिए ‘दास’ यहाँ के बंधन और पराधीनता को अधिक ठीक व्यक्त करता है।
- issue: לַאֲבֹתֵינוּ में पुरुषवाचक वंश-संबंधी उल्लेख
  choice: हमारे पुरखाओं
  alternative: हमारे पूर्वजों
  rationale: ‘पुरखाओं’ मूल के पुरुषवाचक पारिवारिक शब्द को बनाए रखते हुए आधुनिक हिन्दी में सहज है; ‘पूर्वजों’ भी संभव है, पर वह लिंग-संकेत को सामान्य कर देता है।
translation_notes:
  register: भाषा आधुनिक, आदरपूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘देखिए’ की पुनरावृत्ति मूल के दोहरे הִנֵּה का आलंकारिक ज़ोर बनाए रखती है। अंतिम वाक्य में ‘उसी देश में’ स्वाभाविक हिन्दी के साथ मूल की विडंबना को उभारता है।
