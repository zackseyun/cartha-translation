  yaml_path: translation/ot/nehemiah/009/020.yaml
  text: You gave your good Spirit to instruct them[a], and you did not withhold your manna from their mouth, and you gave them water for their thirst.
translation:
  language: hi
  text: तूने उन्हें शिक्षा देने के लिए अपना उत्तम आत्मा दिया। तूने उनके मुँह से अपना मन्ना नहीं रोका, और उनकी प्यास के लिए उन्हें पानी दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רוּחֲךָ הַטּוֹבָה
  choice: अपना भला आत्मा
  rationale: רוּחַ का अर्थ ‘आत्मा’, ‘वायु’ या ‘श्वास’ हो सकता है। यहाँ परमेश्वर द्वारा इस्राएल को समझ और मार्गदर्शन दिए जाने के संदर्भ में ‘आत्मा’ सबसे उपयुक्त है। हिंदी में विशेषण ‘भला’ मूल के הַטּוֹבָה को सीधे व्यक्त करता है; देवनागरी में बड़े अक्षरों का भेद न होने के कारण वैकल्पिक समझ पाद-टिप्पणी में रखी गई है।
- source_word: לְהַשְׂכִּילָם
  choice: उन्हें समझ देने के लिए
  rationale: שׂכל के हिफ़ील रूप में किसी को समझ या अंतर्दृष्टि देने का कारक भाव है। यह चयन उस भाव को स्वाभाविक आधुनिक हिंदी में बनाए रखता है।
- source_word: מַנְךָ
  choice: अपना मन्ना
  rationale: यह जंगल की यात्रा में दिए गए विशिष्ट भोजन को दर्शाता है; ‘मन्ना’ हिंदी बाइबलीय प्रयोग में स्थापित और स्पष्ट शब्द है।
- source_word: מָנַעְתָּ מִפִּיהֶם
  choice: उनके मुँह से दूर नहीं रखा
  rationale: מנע का अर्थ रोकना या वंचित रखना है। ‘उनके मुँह से’ मूल पाठ की ठोस और सजीव अभिव्यक्ति को सुरक्षित रखता है।
- source_word: מַיִם
  choice: पानी
  rationale: सामान्य आधुनिक हिंदी में מַיִם का सीधा और स्वाभाविक समानार्थी।
- source_word: לִצְמָאָם
  choice: उनकी प्यास बुझाने के लिए
  rationale: शाब्दिक रूप से ‘उनकी प्यास के लिए’। हिंदी में यह चयन उस आवश्यकता की पूर्ति को स्पष्ट और सहज ढंग से व्यक्त करता है, जिसके लिए पानी दिया गया।
theological_decisions:
- issue: क्या רוּחֲךָ הַטּוֹבָה परमेश्वर के आत्मा को दर्शाता है या ‘भली आत्मा/प्रवृत्ति’ को
  choice: अपना भला आत्मा
  alternative: अपनी भली आत्मा अथवा भली मनोवृत्ति
  rationale: संदर्भ में यह परमेश्वर की वह उपस्थिति है जो इस्राएल को समझ देती और उसका मार्गदर्शन करती है, इसलिए परमेश्वर का आत्मा संभावित आशय है। फिर भी רוּחַ की शब्दगत व्यापकता के कारण दूसरी संभावना पाद-टिप्पणी में सुरक्षित रखी गई है। हिंदी लिपि में capitalization द्वारा दोनों अर्थों का भेद नहीं किया जा सकता।
translation_notes:
  register: आधुनिक मानक हिंदी में आदरपूर्ण, सहज और काव्यात्मक-ऐतिहासिक शैली रखी गई है। संबोधन का एकवचन ‘तूने’ प्रार्थना में परमेश्वर से सीधे संबोधन तथा अध्याय के व्यापक हिंदी बाइबलीय स्वर के अनुकूल है। मूल की ठोस अभिव्यक्ति ‘उनके मुँह से’ सुरक्षित रखी गई है।
