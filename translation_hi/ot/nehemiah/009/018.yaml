source:
  edition: WLC
  text: אַ֗ף כִּֽי עָשׂ֤וּ לָ/הֶם֙ עֵ֣גֶל מַסֵּכָ֔ה וַ/יֹּ֣אמְר֔וּ זֶ֣ה אֱלֹהֶ֔י/ךָ אֲשֶׁ֥ר הֶעֶלְ/ךָ֖ מִ/מִּצְרָ֑יִם וַֽ/יַּעֲשׂ֔וּ נֶאָצ֖וֹת גְּדֹלֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/018.yaml
  text: Even when they made for themselves a cast metal calf and said[a], ‘This is your god who brought you up out of Egypt,’ and committed great blasphemies[b],
translation:
  language: hi
  text: यहाँ तक कि जब उन्होंने अपने लिए धातु का ढला हुआ एक बछड़ा बनाया और कहा, “यह तेरा देवता है, जो तुझे मिस्र से निकाल लाया,” तब भी उन्होंने घोर तिरस्कार के काम किए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַף כִּי
  choice: यहाँ तक कि जब
  rationale: 'यह पद पिछले संदर्भ से जुड़ी रियायती बात व्यक्त करता है: इतने गंभीर विद्रोह के समय भी परमेश्वर ने उन्हें नहीं छोड़ा। ‘यहाँ तक कि जब’ इस बल को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।'
- source_word: עָשׂוּ לָהֶם
  choice: उन्होंने अपने लिए ... बनाया
  rationale: לָהֶם का आत्मवाचक भाव मूर्ति को अपने उपयोग और उपासना के लिए बनाने की बात स्पष्ट करता है।
- source_word: עֵגֶל מַסֵּכָה
  choice: ढली हुई धातु का एक बछड़ा
  rationale: מַסֵּכָה साँचे में ढाली गई धातु की प्रतिमा को दर्शाता है। यह अनुवाद निर्माण-विधि और बछड़े के रूप, दोनों को स्पष्ट रखता है।
- source_word: זֶה אֱלֹהֶיךָ
  choice: यह तेरा देवता है
  rationale: זֶה और प्रत्यय दोनों यहाँ एकवचन हैं। ‘देवता’ झूठी उपास्य सत्ता को दर्शाता है और सच्चे परमेश्वर से उसका भेद बनाए रखता है।
- source_word: אֲשֶׁר הֶעֶלְךָ מִמִּצְרָיִם
  choice: जो तुझे मिस्र से निकालकर ऊपर ले आया
  rationale: עלה מן की निर्गमन-संबंधी अभिव्यक्ति में मिस्र से बाहर निकालने और ऊपर ले आने, दोनों का भाव है; हिन्दी में यह विस्तृत रूप अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וַיַּעֲשׂוּ נֶאָצוֹת גְּדֹלוֹת
  choice: उन्होंने बड़े-बड़े निन्दापूर्ण काम किए
  rationale: נֶאָצוֹת परमेश्वर के प्रति तिरस्कार, अपमान और उकसाने वाले कृत्यों को सूचित करता है। ‘निन्दापूर्ण काम’ केवल वाणी तक सीमित किए बिना उस ईश्वर-विरोधी अपमान को व्यक्त करता है।
theological_decisions:
- issue: मूर्तिपरक אֱלֹהֶיךָ का अनुवाद
  choice: तेरा देवता
  alternative: तेरा परमेश्वर
  rationale: संदर्भ में संकेत सोने के बछड़े की ओर है। ‘देवता’ लोगों के दावे को व्यक्त करता है, पर उस मूर्ति को इस्राएल के सच्चे परमेश्वर के रूप में वैध ठहराने का आभास नहीं देता।
- issue: נֶאָצוֹת का ईश्वर-विरोधी बल
  choice: निन्दापूर्ण काम
  alternative: भारी अपमान / बड़े उकसाने वाले काम
  rationale: मूल संज्ञा में निन्दा, तिरस्कार और धृष्ट अपमान का व्यापक भाव है। ‘काम’ जोड़ने से इसे केवल बोले गए ईशनिन्दात्मक शब्दों तक सीमित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। एकवचन सम्बोधन ‘तेरा/तुझे’ इब्रानी रूप के अनुरूप है। ‘ढली हुई धातु’ तकनीकी अर्थ को स्पष्ट करती है, जबकि ‘निन्दापूर्ण काम’ मूल की व्यापक नैतिक और ईश्वर-विरोधी तीव्रता बनाए रखता है।
