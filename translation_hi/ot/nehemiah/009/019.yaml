base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/019.yaml
  text: But you[a], in your abundant mercies, did not abandon them in the wilderness. The pillar of cloud did not depart from above them by day, to lead them on the way, nor the pillar of fire by night, to give them light and the way in which they should go.
translation:
  language: hi
  text: परन्तु तूने अपनी अपार दयाओं[a] के कारण उन्हें वीराने में नहीं छोड़ा। दिन में बादल का खम्भा उनके ऊपर से नहीं हटा, ताकि मार्ग में उनकी अगुवाई करे; और न रात में आग का खम्भा हटा, ताकि उन्हें प्रकाश दे और उस मार्ग को प्रकाशित करे जिस पर उन्हें चलना था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपनी बड़ी करुणा के कारण।’ इब्रानी में संज्ञा बहुवचन में है; शाब्दिक अर्थ ‘अपनी बहुत-सी दयाओं के कारण’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרַחֲמֶיךָ הָרַבִּים
  choice: अपनी अपार दयाओं के कारण
  rationale: रַחֲמִים के बहुवचन और הָרַבִּים की प्रचुरता को ‘अपार दयाओं’ से बनाए रखा गया है; ‘के कारण’ यहाँ दैवी दया को न छोड़ने का आधार स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עֲזַבְתָּם
  choice: उन्हें ... नहीं छोड़ा
  rationale: עזב का अर्थ छोड़ देना या त्याग देना है। ‘नहीं छोड़ा’ आधुनिक हिन्दी में स्पष्ट है और प्रसंग में परित्याग का भाव रखता है।
- source_word: בַּמִּדְבָּר
  choice: वीराने में
  rationale: מִדְבָּר निर्जन वन्य प्रदेश को दर्शाता है; ‘वीराना’ केवल रेतीले मरुस्थल तक अर्थ को सीमित नहीं करता।
- source_word: עַמּוּד הֶעָנָן
  choice: बादल का खम्भा
  rationale: इब्रानी संबंध-वाक्यांश का सीधा और निर्गमन-वृत्तांत से परिचित रूप।
- source_word: לֹא סָר מֵעֲלֵיהֶם
  choice: उनके ऊपर से नहीं हटा
  rationale: סור के हटने और מֵעֲלֵיהֶם के स्थानगत ‘उनके ऊपर से’—दोनों भाव सुरक्षित हैं।
- source_word: לְהַנְחֹתָם בְּהַדֶּרֶךְ
  choice: ताकि मार्ग में उनकी अगुवाई करे
  rationale: नחה के हिफ़ील रूप का नेतृत्व/मार्गदर्शन का भाव और בְּ का मार्गगत संबंध स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: עַמּוּד הָאֵשׁ
  choice: आग का खम्भा
  rationale: मूल संबंध-वाक्यांश का पारदर्शी अनुवाद, जो ‘बादल का खम्भा’ के समानान्तर है।
- source_word: לְהָאִיר לָהֶם
  choice: उनके लिए ... उजाला करे
  rationale: אור के हिफ़ील का अर्थ प्रकाश देना है; यह रूप उद्देश्य और लाभार्थी दोनों को स्पष्ट रखता है।
- source_word: וְאֶת הַדֶּרֶךְ אֲשֶׁר יֵלְכוּ בָהּ
  choice: उस मार्ग पर ... जिस पर उन्हें चलना था
  rationale: मसोरेटिक पाठ में ‘मार्ग’ पर אֶת है, पर अर्थगत संबंध प्रकाश से प्रकाशित मार्ग का है। हिन्दी में ‘उस मार्ग पर उजाला’ वस्तु-संबंध को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है; יֵלְכוּ का प्रसंगगत अपेक्षित भाव ‘चलना था’ से आता है।
theological_decisions:
- issue: परमेश्वर की करुणा के लिए बहुवचन
  choice: अपार दयाओं
  alternative: बड़ी करुणा
  rationale: मूल רַחֲמִים व्याकरणिक रूप से बहुवचन है और अनेक/प्रचुर दयापूर्ण कार्यों का भाव दे सकता है। हिन्दी में बहुवचन बनाए रखने से इस आयाम को अनावश्यक रूप से एकवचन में नहीं समेटा गया।
- issue: परमेश्वर को संबोधन
  choice: तू
  alternative: आप
  rationale: मूल में एकवचन प्रत्यक्ष संबोधन אַתָּה है। ‘तू’ प्रार्थनात्मक निकटता और एकवचन को सुरक्षित रखता है; इसे अनादर के अर्थ में नहीं लिया गया है।
- issue: आग के खम्भे के साथ क्रिया की पुनरावृत्ति
  choice: और न रात में आग का खम्भा हटा
  alternative: और रात में आग का खम्भा
  rationale: इब्रानी में दूसरी समानान्तर इकाई में क्रिया लुप्त है और पहले खण्ड से समझी जाती है। हिन्दी में अर्थ स्पष्ट करने के लिए ‘हटा’ दोहराया गया, बिना कोई नई घटना जोड़े।
translation_notes:
  register: आधुनिक, गरिमापूर्ण प्रार्थनात्मक हिन्दी अपनाई गई है। समानान्तर बादल और आग के खम्भों की संरचना रखी गई है; जहाँ इब्रानी में क्रिया लुप्त है, वहाँ हिन्दी की स्पष्टता के लिए उसे दोहराया गया है।
