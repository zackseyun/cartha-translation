  text: וְ/הֵ֣ם בְּ/מַלְכוּתָ/ם֩ וּ/בְ/טוּבְ/ךָ֨ הָ/רָ֜ב אֲשֶׁר נָתַ֣תָּ לָ/הֶ֗ם וּ/בְ/אֶ֨רֶץ הָ/רְחָבָ֧ה וְ/הַ/שְּׁמֵנָ֛ה אֲשֶׁר נָתַ֥תָּ לִ/פְנֵי/הֶ֖ם לֹ֣א עֲבָד֑וּ/ךָ וְֽ/לֹא שָׁ֔בוּ מִ/מַּֽעַלְלֵי/הֶ֖ם הָ/רָעִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/035.yaml
  text: Even in their kingdom[a], and amid your great goodness that you gave them, and in the broad and fertile land that you set before them[d][c][b], they did not serve you and did not turn from their evil deeds.
translation:
  language: hi
  text: अपने राज्य में रहते हुए भी, तेरी उस बड़ी भलाई के होते हुए भी जो तूने उन्हें दी थी, और उस विस्तृत और उपजाऊ देश में भी जिसे तूने उनके सामने रखा था, उन्होंने तेरी सेवा[b] नहीं की और अपने बुरे कामों से नहीं फिरे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: या “तेरी उपासना नहीं की”; इब्रानी क्रिया में सेवा और उपासना, दोनों का भाव हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या “अपने बुरे कामों से पश्चाताप नहीं किया”; शाब्दिक रूप से, “अपने बुरे कामों से नहीं फिरे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמַלְכוּתָם
  choice: अपने राज्य में रहते हुए भी
  rationale: מַלְכוּת यहाँ उनके राज्य, राजकीय शासन या राष्ट्रीय प्रभुता की स्थिति को दर्शाता है। प्रसंग में विरोध का भाव है, इसलिए हिन्दी में ‘रहते हुए भी’ स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: וּבְטוּבְךָ הָרָב
  choice: तेरी उस अपार भलाई के बीच
  rationale: טוּב में भलाई और उदारतापूर्ण समृद्धि, दोनों का भाव हो सकता है। ‘अपार भलाई’ इस अर्थ-विस्तार को बनाए रखता है और בְ को ‘के बीच’ से व्यक्त करता है।
- source_word: אֲשֶׁר נָתַתָּ לָהֶם
  choice: जो तूने उन्हें दी थी
  rationale: यह परमेश्वर की पूर्व प्रदत्त भलाई का उल्लेख है; हिन्दी में पूर्ण भूतकाल पूर्वता और वाक्य के प्रवाह को स्पष्ट करता है।
- source_word: אֶרֶץ הָרְחָבָה וְהַשְּׁמֵנָה
  choice: विशाल और उपजाऊ देश
  rationale: רְחָבָה का अर्थ विस्तृत या विशाल है और שְׁמֵנָה का शाब्दिक अर्थ ‘मोटा’ है, जो भूमि के लिए उर्वरता या समृद्धि का मुहावरा है।
- source_word: אֲשֶׁר נָתַתָּ לִפְנֵיהֶם
  choice: जिसे तूने उनके सामने रख दिया था
  rationale: לִפְנֵיהֶם का ठोस अर्थ ‘उनके सामने’ है। ‘रख दिया’ भूमि को उनके अधिकार और उपयोग के लिए प्रस्तुत करने का भाव सहज हिन्दी में बताता है।
- source_word: לֹא עֲבָדוּךָ
  choice: उन्होंने तेरी सेवा नहीं की
  rationale: עבד परमेश्वर के संबंध में सेवा, आज्ञापालन और उपासना को समेट सकता है। ‘सेवा’ इसकी व्यापकता बनाए रखती है।
- source_word: וְלֹא שָׁבוּ
  choice: नहीं फिरे
  rationale: שׁוב का मूल अर्थ मुड़ना या फिरना है। ‘से फिरना’ नैतिक परिवर्तन को व्यक्त करता है, पर सीधे ‘पश्चाताप’ कहकर अर्थ को संकरा नहीं करता।
- source_word: מִמַּעַלְלֵיהֶם הָרָעִים
  choice: अपने बुरे कामों से
  rationale: מַעֲלָלִים कार्यों, आचरणों या करतूतों को दर्शाता है। ‘बुरे काम’ साधारण, स्पष्ट और नैतिक मूल्यांकन के प्रति निष्ठावान है।
theological_decisions:
- issue: परमेश्वर के संबंध में עבד का अनुवाद
  choice: तेरी सेवा नहीं की
  alternative: तेरी उपासना नहीं की
  rationale: इब्रानी क्रिया में उपासना के साथ वाचा-संबंधी सेवा और आज्ञापालन भी शामिल हो सकते हैं। ‘सेवा’ इस व्यापकता को सुरक्षित रखती है।
- issue: नैतिक संदर्भ में שׁוב מִן का अनुवाद
  choice: अपने बुरे कामों से नहीं फिरे
  alternative: अपने बुरे कामों से पश्चाताप नहीं किया
  rationale: मूल पाठ बुरे कामों से मुड़ने की ठोस भाषा प्रयोग करता है। ‘नहीं फिरे’ उसी रूपक को बनाए रखता है और व्याख्यात्मक धार्मिक शब्दावली नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में प्रार्थना का सीधा, गरिमापूर्ण संबोधन रखा गया है। परमेश्वर के लिए ‘तू/तेरी’ का प्रयोग मूल इब्रानी के एकवचन निकट संबोधन के अनुरूप है। वाक्य की संचयी इब्रानी संरचना सुरक्षित रखते हुए हिन्दी प्रवाह के लिए ‘रहते हुए भी’ और पूर्ण भूतकाल का प्रयोग किया गया है।
