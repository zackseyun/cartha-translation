  text: וַ/תִּתֵּ֨ן לָ/הֶ֤ם מַמְלָכוֹת֙ וַ/עֲמָמִ֔ים וַֽ/תַּחְלְקֵ֖/ם לְ/פֵאָ֑ה וַ/יִּֽירְשׁ֞וּ אֶת אֶ֣רֶץ סִיח֗וֹן וְ/אֶת אֶ֨רֶץ֙ מֶ֣לֶךְ חֶשְׁבּ֔וֹן וְ/אֶת אֶ֖רֶץ ע֥וֹג מֶֽלֶךְ הַ/בָּשָֽׁן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/022.yaml
  text: You gave them kingdoms and peoples, and allotted them to every corner. So they took possession of the land of Sihon, that is, the land of the king of Heshbon, and the land of Og king of Bashan.
translation:
  language: hi
  text: आपने उन्हें राज्य और जातियाँ दीं और उन्हें अलग-अलग क्षेत्रों में बाँट दिया। इस प्रकार उन्होंने सीहोन के देश—अर्थात हेशबोन के राजा के देश[a]—और बाशान के राजा ओग के देश पर अधिकार कर लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'हिब्रू में शाब्दिक रूप से: “सीहोन के देश और हेशबोन के राजा के देश।”'
    reason: मूल की समन्वयी रचना को दर्ज करना आवश्यक है, क्योंकि मुख्य पाठ उसे समानार्थी स्पष्टीकरण के रूप में प्रस्तुत करता है।
lexical_decisions:
- source_word: מַמְלָכוֹת וַעֲמָמִים
  choice: राज्य और जातियाँ
  rationale: दोनों समन्वित संज्ञाओं को अलग रखते हुए राजनीतिक इकाइयों और जनसमूहों का भेद सुरक्षित किया गया है।
- source_word: וַתַּחְלְקֵם לְפֵאָה
  choice: उन्हें अलग-अलग क्षेत्रों में बाँट दिया
  rationale: לְפֵאָה का मूल भाव किनारे, दिशा या क्षेत्र का है। प्रसंग में राज्यों और जातियों के क्षेत्रगत विभाजन का स्वाभाविक हिंदी रूप दिया गया है, बिना ‘बसाया’ जैसी अतिरिक्त क्रिया जोड़े।
- source_word: וַיִּירְשׁוּ
  choice: अधिकार कर लिया
  rationale: ירשׁ यहाँ किसी भूभाग को अपने अधिकार में लेने या उसका स्वामी बनने का अर्थ देता है; केवल ‘विरासत में पाया’ सैन्य-ऐतिहासिक प्रसंग में भ्रामक हो सकता है।
- source_word: חֶשְׁבּוֹן / הַבָּשָׁן
  choice: हेशबोन / बाशान
  rationale: इन स्थान-नामों के प्रचलित और स्रोत के निकट हिंदी लिप्यंतरण अपनाए गए हैं।
theological_decisions:
- issue: सीहोन के देश और हेशबोन के राजा के देश के बीच संबंध
  choice: अर्थात हेशबोन के राजा के देश
  alternative: और हेशबोन के राजा के देश
  rationale: ऐतिहासिक संदर्भ में सीहोन ही हेशबोन का राजा है, इसलिए दोनों पदबंध समान भूभाग के निर्देश के रूप में समझे गए हैं। फिर भी हिब्रू की सतही समन्वयी रचना को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, स्पष्ट और गरिमापूर्ण हिंदी। ‘जातियाँ’ सामान्य बाइबलीय शब्दावली के अनुरूप है; वाक्यरचना बोलचाल से ऊपर किंतु साधारण पाठक के लिए सहज रखी गई है।
