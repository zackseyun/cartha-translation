source:
  edition: WLC
  text: וַֽ/יִּלְכְּד֞וּ עָרִ֣ים בְּצֻרוֹת֮ וַ/אֲדָמָ֣ה שְׁמֵנָה֒ וַ/יִּֽירְשׁ֡וּ בָּתִּ֣ים מְלֵֽאִים כָּל ט֠וּב בֹּר֨וֹת חֲצוּבִ֜ים כְּרָמִ֧ים וְ/זֵיתִ֛ים וְ/עֵ֥ץ מַאֲכָ֖ל לָ/רֹ֑ב וַ/יֹּאכְל֤וּ וַֽ/יִּשְׂבְּעוּ֙ וַ/יַּשְׁמִ֔ינוּ וַ/יִּֽתְעַדְּנ֖וּ בְּ/טוּבְ/ךָ֥ הַ/גָּדֽוֹל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/025.yaml
  text: They captured fortified cities and fertile land[a], and took possession of houses full of every good thing, hewn cisterns, vineyards, olive trees, and fruit trees in abundance. So they ate and were filled and grew fat[c][b], and they delighted themselves in your great goodness.
translation:
  language: hi
  text: उन्होंने किलेबंद नगरों और उपजाऊ भूमि[a] पर अधिकार कर लिया। उन्होंने हर प्रकार की अच्छी वस्तुओं से भरे घरों, चट्टान काटकर बनाए गए जलकुंडों, दाख की बारियों, जैतून के पेड़ों और बहुतायत में फलदार पेड़ों को अपने अधिकार में लिया। उन्होंने खाया और तृप्त हुए, मोटे हो गए[b], और आपकी अपार भलाई का भरपूर आनंद लिया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘मोटी भूमि’, अर्थात समृद्ध या भरपूर उपज देने वाली भूमि।
    reason: lexical_alternative
  - marker: b
    text: या, ‘हृष्ट-पुष्ट हो गए।’
    reason: lexical_alternative
  - marker: c
    text: या, ‘आपकी अपार समृद्धि में सुख-विलास किया।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכְּדוּ
  choice: अधिकार कर लिया
  rationale: לכד का अर्थ युद्ध के संदर्भ में पकड़ना या जीत लेना है। यह क्रिया यहाँ किलेबंद नगरों के साथ भूमि पर भी लागू होती है, इसलिए ‘पर अधिकार कर लिया’ दोनों के लिए स्वाभाविक है और विजय का भाव बनाए रखता है।
- source_word: עָרִים בְּצֻרוֹת
  choice: किलेबंद नगरों
  rationale: בצר से दृढ़ किलेबंदी का भाव निकलता है; ‘किलेबंद नगर’ आधुनिक मानक हिन्दी में स्पष्ट और सटीक है।
- source_word: אֲדָמָה שְׁמֵנָה
  choice: उपजाऊ भूमि
  rationale: शाब्दिक अभिव्यक्ति ‘मोटी भूमि’ समृद्ध और भरपूर उपज देने वाली मिट्टी का मुहावरा है। ‘उपजाऊ भूमि’ उसका स्वाभाविक हिन्दी समतुल्य है; शाब्दिक चित्र फुटनोट में रखा गया है।
- source_word: וַיִּירְשׁוּ
  choice: अपने अधिकार में लिया
  rationale: ירשׁ यहाँ विरासत पाने से अधिक विजय के बाद संपत्ति पर अधिकार करने को व्यक्त करता है।
- source_word: בָּתִּים מְלֵאִים כָּל טוּב
  choice: हर प्रकार की अच्छी वस्तुओं से भरे घरों
  rationale: כָּל טוּב उपलब्ध उत्तम वस्तुओं और समृद्ध सामग्री की व्यापकता व्यक्त करता है।
- source_word: בֹּרוֹת חֲצוּבִים
  choice: चट्टान काटकर बनाए गए जलकुंडों
  rationale: בּוֹר यहाँ पानी संचित करने का कुंड है और חצוב उसके काटकर बनाए जाने को बताता है। ‘पहले से’ जैसा भाव मूल में स्पष्ट न होने के कारण नहीं जोड़ा गया।
- source_word: כְּרָמִים וְזֵיתִים וְעֵץ מַאֲכָל לָרֹב
  choice: दाख की बारियों, जैतून के पेड़ों और बहुतायत में फलदार पेड़ों
  rationale: कृषि-संपदा की सूची और לָרֹב की प्रचुरता को ठोस, सहज हिन्दी में रखा गया है।
- source_word: וַיֹּאכְלוּ וַיִּשְׂבְּעוּ
  choice: उन्होंने खाया और तृप्त हुए
  rationale: שׂבע का अर्थ भरपेट होकर संतुष्ट होना है; ‘तृप्त हुए’ शारीरिक परिपूर्णता और संतोष दोनों समेटता है।
- source_word: וַיַּשְׁמִינוּ
  choice: हृष्ट-पुष्ट हो गए
  rationale: क्रिया का शाब्दिक अर्थ ‘मोटे हो गए’ है और यहाँ भरपूर भोजन से आई सम्पन्न अवस्था दिखाती है। मुख्य पाठ में गरिमापूर्ण और स्वाभाविक हिन्दी रखी गई है, जबकि शाब्दिक रूप फुटनोट में दिया गया है।
- source_word: וַיִּתְעַדְּנוּ
  choice: भरपूर आनंद लिया
  rationale: התעדן सुख, ऐश्वर्य और प्रचुरता का आनंद लेने को व्यक्त करता है। ‘भरपूर आनंद लिया’ इस भाव को स्वाभाविक हिन्दी में देता है, और अधिक शाब्दिक विकल्प फुटनोट में सुरक्षित है।
- source_word: בְּטוּבְךָ הַגָּדוֹל
  choice: आपकी अपार भलाई का
  rationale: טוּב में नैतिक भलाई और उदारतापूर्वक दी गई समृद्धि दोनों की गुंजाइश है। ‘अपार भलाई’ इसे केवल भौतिक सम्पदा तक सीमित नहीं करती।
theological_decisions:
- issue: בְּטוּבְךָ הַגָּדוֹל में परमेश्वर की भलाई और उदार देन का संबंध
  choice: आपकी अपार भलाई का भरपूर आनंद लिया
  alternative: आपकी अपार समृद्धि में सुख-विलास किया
  rationale: मुख्य पाठ परमेश्वर की ‘भलाई’ के व्यापक अर्थ को बनाए रखता है और लोगों के उसके लाभों का आनंद लेने को व्यक्त करता है। वैकल्पिक रूप भौतिक ऐश्वर्य तथा התעדן की अधिक तीव्र छवि को सामने लाता है, पर मुख्य पाठ पर अनावश्यक नैतिक निर्णय नहीं थोपता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप अपनाया गया है। विजय, प्राप्त कृषि-संपदा, शारीरिक तृप्ति और परमेश्वर की उदार भलाई—इन सभी क्रमिक भावों को बनाए रखा गया है; जहाँ हिन्दी में शाब्दिक रूप असहज या अनावश्यक रूप से नकारात्मक हो सकता था, वहाँ मुख्य पाठ में स्वाभाविक समतुल्य और फुटनोट में मूल चित्र दिया गया है।
