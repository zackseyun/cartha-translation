source:
  edition: WLC
  text: וַ֠/תִּתֵּן אֹתֹ֨ת וּ/מֹֽפְתִ֜ים בְּ/פַרְעֹ֤ה וּ/בְ/כָל עֲבָדָי/ו֙ וּ/בְ/כָל עַ֣ם אַרְצ֔/וֹ כִּ֣י יָדַ֔עְתָּ כִּ֥י הֵזִ֖ידוּ עֲלֵי/הֶ֑ם וַ/תַּֽעַשׂ לְ/ךָ֥ שֵׁ֖ם כְּ/הַ/יּ֥וֹם הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/010.yaml
  text: You performed signs and wonders against Pharaoh[a], against all his servants, and against all the people of his land, for you knew that they acted presumptuously against them. So you made a name for yourself, as it is to this day.
translation:
  language: hi
  text: तूने फ़िरौन, उसके सभी सेवकों और उसके देश के सभी लोगों के विरुद्ध चिह्न और चमत्कार किए, क्योंकि तू जानता था कि उन्होंने उनके साथ धृष्टता से व्यवहार किया था। इस प्रकार तूने अपने लिए एक नाम बनाया, जैसा आज तक है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּתֵּן
  choice: तूने ... किए
  rationale: क्रिया का शाब्दिक अर्थ ‘दिया’ है, पर ‘चिह्न और अद्भुत काम’ के साथ हिन्दी में ‘किए’ स्वाभाविक रूप से उन्हें घटित करने का भाव व्यक्त करता है।
- source_word: אֹתֹת וּמֹפְתִים
  choice: चिह्न और अद्भुत काम
  rationale: यह युग्म उन असाधारण ईश्वरीय कार्यों को दर्शाता है जो संकेत भी हैं और विस्मयकारी घटनाएँ भी; आधुनिक हिन्दी में यह स्पष्ट और गरिमापूर्ण है।
- source_word: בְּפַרְעֹה ... וּבְכָל עֲבָדָיו ... וּבְכָל עַם אַרְצוֹ
  choice: फ़िरौन, उसके सभी सेवकों और उसके देश के सभी लोगों के विरुद्ध
  rationale: यहाँ ב न्यायात्मक कार्यों के लक्ष्य के प्रति विरोधी भाव रखता है। ‘सेवक’ עֲבָדִים की व्यापकता बनाए रखता है और अनावश्यक रूप से केवल अधिकारियों या दासों तक सीमित नहीं करता।
- source_word: הֵזִידוּ
  choice: घमंड से व्यवहार किया था
  rationale: हिफ़ील रूप में यह जान-बूझकर उद्दंड, अभिमानी या धृष्ट आचरण का बोध देता है। यह हिन्दी चयन मूल के नैतिक भाव को स्वाभाविक भाषा में रखता है।
- source_word: וַתַּעַשׂ לְךָ שֵׁם
  choice: तूने अपने लिए ऐसा नाम बनाया
  rationale: मूल मुहावरे को बनाए रखते हुए प्रसिद्धि और कीर्ति स्थापित होने का अर्थ व्यक्त करता है।
- source_word: כְּהַיּוֹם הַזֶּה
  choice: जो आज तक बना हुआ है
  rationale: यह परिणाम या कीर्ति के वर्तमान समय तक टिके रहने का स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: עֲלֵיהֶם (‘उनके साथ/विरुद्ध’) का संदर्भ
  choice: सर्वनाम ‘उनके’ को पाठ में बनाए रखा गया; प्रसंग में इसका सबसे स्वाभाविक संदर्भ इस्राएली हैं।
  alternative: ‘तेरे लोगों के साथ’ कहकर संदर्भ को स्पष्ट करना, अथवा घमंड को परमेश्वर के विरुद्ध मानना।
  rationale: निर्गमन के प्रसंग में फ़िरौन और मिस्रियों का घमंडी तथा अत्याचारी व्यवहार इस्राएलियों के प्रति था। फिर भी मूल पाठ केवल सर्वनाम देता है, इसलिए अनुवाद उसे स्पष्ट संज्ञा से बदलकर अस्पष्टता को चुपचाप समाप्त नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; प्रार्थनात्मक संबोधन के अनुरूप परमेश्वर के लिए एकवचन ‘तू’ रखा गया है। भाषा सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य है।
