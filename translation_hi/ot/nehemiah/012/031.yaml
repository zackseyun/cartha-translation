base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/031.yaml
  text: Then I brought the leaders of Judah up onto the wall[a], and I appointed two great thanksgiving choirs and processions[b], one going to the right on the wall toward the Dung Gate.
translation:
  language: hi
  text: तब मैं यहूदा के अगुवों को शहरपनाह पर चढ़ाकर ले गया, और मैंने धन्यवाद के दो बड़े जुलूस[a] व्यवस्थित किए। उनमें से एक शहरपनाह पर दाहिनी ओर कूड़ा फाटक की दिशा में[b] चला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ ‘दो बड़े धन्यवाद’ है; यहाँ संभवतः धन्यवाद देनेवाले संगठित दल, जो जुलूस में चल रहे थे, अभिप्रेत हैं।
    reason: lexical_alternative
  - marker: b
    text: या, ‘कूड़ा फाटक तक।’ इस दिशात्मक संदर्भ में इब्रानी पूर्वसर्ग का अनुवाद ‘तक’ या ‘की दिशा में’ किया जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וָאַעֲלֶה
  choice: मैं ... ऊपर ले गया
  rationale: עלה के हिफ़ील रूप का कारक अर्थ ‘ऊपर चढ़ाना/ले जाना’ है; यह प्रयोग स्वाभाविक हिन्दी में उस कारक भाव को बनाए रखता है।
- source_word: שָׂרֵי יְהוּדָה
  choice: यहूदा के अगुओं
  rationale: שָׂרִים यहाँ नागरिक और सामुदायिक नेतृत्व करनेवालों को दर्शाता है; ‘अगुए’ राजवंशीय ‘राजकुमारों’ का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: מֵעַל לַחוֹמָה
  choice: शहरपनाह के ऊपर
  rationale: वाक्यांश शहरपनाह की ऊपरी सतह पर चढ़ने और वहाँ होनेवाले जुलूस को दर्शाता है।
- source_word: וָאַעֲמִידָה
  choice: नियुक्त किए
  rationale: עמד के हिफ़ील रूप का अर्थ खड़ा करना, ठहराना या नियत करना है; चलनेवाले जुलूसों के संदर्भ में ‘नियुक्त किए’ उनकी व्यवस्थित व्यवस्था को स्वाभाविक रूप से व्यक्त करता है।
- source_word: שְׁתֵּי תוֹדֹת גְּדוֹלֹת
  choice: धन्यवाद देनेवाले दो बड़े दल
  rationale: शाब्दिक अर्थ ‘दो बड़े धन्यवाद’ है, पर इस समर्पण-विधि के संदर्भ में תוֹדֹת धन्यवाद करनेवाले संगठित समूहों के लिए लक्षणा के रूप में प्रयुक्त है। ‘दल’ गायक-मंडली तक अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: וְתַהֲלֻכֹת
  choice: जुलूस के लिए
  rationale: הלך से बना यह शब्द चलने या जुलूस की धारणा व्यक्त करता है। हिन्दी में इसे उद्देश्यात्मक ढंग से रखना दोनों धन्यवाद-दलों के जुलूस में चलने का आशय स्पष्ट करता है।
- source_word: לַיָּמִין
  choice: दाहिनी ओर
  rationale: मूल पाठ का सीधा अर्थ ‘दाहिनी ओर’ है; अनुमानित भौगोलिक दिशा ‘दक्षिण’ नहीं जोड़ी गई।
- source_word: לְשַׁעַר הָאַשְׁפֹּת
  choice: कूड़ा फाटक की दिशा में
  rationale: אַשְׁפֹּת कूड़े या त्याज्य पदार्थ को दर्शाता है। לְ दिशात्मक संदर्भ में ‘की दिशा में’ या ‘तक’ दोनों हो सकता है; मुख्य पाठ में गंतव्य की ओर गति व्यक्त की गई है।
