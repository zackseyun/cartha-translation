base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/011.yaml
  text: And Joiada fathered Jonathan[a], and Jonathan fathered Jaddua.
translation:
  language: hi
  text: और योयादा योनातान[a] का पिता था, और योनातान यद्दू का पिता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पांडुलिपियों और अनुवादों में “योनातान” के स्थान पर “योहानान” है। यहाँ प्रयुक्त इब्रानी पाठ में “योनातान” है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְ
  choice: और
  rationale: यह संयोजक वंशावली की इस सूचना को पिछली पंक्ति से सीधे जोड़ता है।
- source_word: יוֹיָדָע
  choice: योयादा
  rationale: इब्रानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण, जो मूल उच्चारण के निकट है।
- source_word: הוֹלִיד
  choice: से ... उत्पन्न हुआ
  rationale: हिफ़ील रूप वंशावली में संतान उत्पन्न करने का भाव देता है। हिंदी में यह रचना स्वाभाविक, संक्षिप्त और गरिमापूर्ण है तथा पुरुष-वंश की कड़ी स्पष्ट रखती है।
- source_word: אֶת
  choice: '[अनूदित नहीं]'
  rationale: यह इब्रानी का निश्चित प्रत्यक्ष-कर्म चिह्न है; हिंदी में इसकी भूमिका वाक्य-रचना से व्यक्त होती है।
- source_word: יוֹנָתָן
  choice: योनातान
  rationale: प्रस्तुत WLC पाठ का नाम יוֹנָתָן है; इसलिए मुख्य पाठ में इसी का लिप्यंतरण रखा गया है।
- source_word: יַדּוּעַ
  choice: यद्दू
  rationale: इब्रानी व्यक्तिगत नाम יַדּוּעַ का हिंदी बाइबलीय परंपरा के अनुरूप, मूल रूप के निकट लिप्यंतरण।
