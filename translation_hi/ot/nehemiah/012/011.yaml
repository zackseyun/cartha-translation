  register: आधुनिक मानक हिंदी में सरल और गरिमापूर्ण वंशावली शैली रखी गई है। “जन्म दिया” की अपेक्षा “से ... उत्पन्न हुआ” चुना गया है, क्योंकि यह पुरुष पूर्वज के लिए अधिक स्वाभाविक है और הוֹלִיד का वंशावली-संबंधी अर्थ स्पष्ट करता है।
