  text: וּ/מִ/בֵּית֙ הַגִּלְגָּ֔ל וּ/מִ/שְּׂד֥וֹת גֶּ֖בַע וְ/עַזְמָ֑וֶת כִּ֣י חֲצֵרִ֗ים בָּנ֤וּ לָ/הֶם֙ הַ/מְשֹׁ֣רֲרִ֔ים סְבִיב֖וֹת יְרוּשָׁלִָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/029.yaml
  text: and from Beth-gilgal[a], and from the fields of Geba and Azmaveth, for the singers had built villages for themselves around Jerusalem.
translation:
  language: hi
  text: और बेत-गिलगाल से, तथा गेबा और अजमावेत के खेतों से भी, क्योंकि गायकों ने यरूशलेम के चारों ओर अपने लिए बस्तियाँ[a] बसा ली थीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “गाँव”; इब्रानी शब्द घिरे हुए आवास-स्थलों के लिए भी प्रयुक्त हो सकता है और यहाँ यरूशलेम के आसपास उन स्थानों को दर्शाता है जहाँ गायक रहते थे।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבֵּית הַגִּלְגָּל
  choice: और बेत-गिलगाल से
  rationale: בֵּית यहाँ किसी भवन का सामान्य उल्लेख नहीं, बल्कि स्थान-नाम का अंग है; इसलिए इसे लिप्यंतरित किया गया है। उपसर्गों का अर्थ ‘और ... से’ रखा गया है।
- source_word: וּמִשְּׂדוֹת גֶּבַע וְעַזְמָוֶת
  choice: तथा गेबा और अजमावेत के खेतों से भी
  rationale: שְּׂדוֹת का सीधा अर्थ ‘खेत’ है और यहाँ इन नगरों से जुड़ी कृषि-भूमि का बोध कराता है। ‘भी’ आरंभिक समुच्चय के संचयी भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ इसका स्पष्ट और स्वाभाविक रूप है।
- source_word: חֲצֵרִים
  choice: बस्तियाँ
  rationale: यद्यपि शब्द का मूल अर्थ घिरा हुआ स्थान या आँगन भी हो सकता है, इस भौगोलिक संदर्भ में यह छोटे आवास-स्थलों को दर्शाता है। ‘बस्तियाँ’ इस अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: בָּנוּ לָהֶם
  choice: अपने लिए ... बसा ली थीं
  rationale: शाब्दिक अर्थ ‘अपने लिए बनाया था’ है, पर बस्तियों के साथ हिन्दी में ‘बसाना’ अधिक स्वाभाविक है। पूर्ण भूतकाल कारणसूचक खंड की पूर्ववर्ती स्थिति को व्यक्त करता है।
- source_word: הַמְשֹׁרֲרִים
  choice: गायकों
  rationale: यह שׁיר से बना कर्तृवाचक रूप है और मंदिर-सेवा के संदर्भ में गाने वालों को सूचित करता है; ‘गायक’ ‘संगीतकार’ से अधिक सटीक है।
- source_word: סְבִיבוֹת יְרוּשָׁלִָם
  choice: यरूशलेम के चारों ओर
  rationale: यह यरूशलेम के आसपास के क्षेत्र का स्थानिक अर्थ स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
