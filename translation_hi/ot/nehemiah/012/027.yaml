translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सार्वजनिक पाठ के योग्य शैली रखी गई है। 'शहरपनाह' बाइबलीय नगर-दीवार के लिए प्रचलित और स्पष्ट शब्द है। वाद्यों के पारंपरिक हिंदी नाम रखकर उनकी ऐतिहासिक अनिश्चितता पादटिप्पणी में बताई गई है।
