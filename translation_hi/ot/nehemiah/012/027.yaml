  text: וּ/בַ/חֲנֻכַּ֞ת חוֹמַ֣ת יְרוּשָׁלִַ֗ם בִּקְשׁ֤וּ אֶת הַ/לְוִיִּם֙ מִ/כָּל מְק֣וֹמֹתָ֔/ם לַ/הֲבִיאָ֖/ם לִֽ/ירוּשָׁלִָ֑ם לַ/עֲשֹׂ֨ת חֲנֻכָּ֤ה וְ/שִׂמְחָה֙ וּ/בְ/תוֹד֣וֹת וּ/בְ/שִׁ֔יר מְצִלְתַּ֖יִם נְבָלִ֥ים וּ/בְ/כִנֹּרֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/027.yaml
  text: At the dedication of the wall of Jerusalem[a], they sought the Levites from all their places, to bring them to Jerusalem to celebrate the dedication with gladness, with thanksgivings, and with song, with cymbals, harps[c][b], and lyres.
translation:
  language: hi
  text: यरूशलेम की शहरपनाह के समर्पण के अवसर पर उन्होंने लेवियों को उनके रहने के सभी स्थानों से खोजा[a], ताकि उन्हें यरूशलेम लाएँ और वे आनन्द के साथ, धन्यवाद और गायन करते हुए, झाँझों, सारंगियों और वीणाओं[b] के साथ समर्पण का उत्सव मनाएँ[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “लेवियों को ढूँढ़ा” या संदर्भ के अनुसार “लेवियों को बुलवाया” भी हो सकता है। इब्रानी क्रिया का मूल अर्थ “खोजना” है।
    reason: lexical_alternative
  - marker: b
    text: “सारंगी” और “वीणा” के रूप में अनूदित प्राचीन वाद्यों की ठीक पहचान अनिश्चित है; इब्रानी में दो अलग-अलग तार वाले वाद्यों के नाम हैं।
    reason: cultural_note
  - marker: c
    text: इब्रानी में शाब्दिक रूप से “समर्पण का उत्सव करना” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחֲנֻכַּת חוֹמַת יְרוּשָׁלִַם
  choice: यरूशलेम की शहरपनाह के समर्पण के अवसर पर
  rationale: ב prefixed to חֲנֻכָּה sets the temporal occasion. 'समर्पण' preserves the event noun, while 'शहरपनाह' naturally identifies the city wall in dignified modern Hindi.
- source_word: בִּקְשׁוּ אֶת הַלְוִיִּם
  choice: उन्होंने लेवियों को ... खोजा
  rationale: בקשׁ का मूल अर्थ 'खोजना/ढूँढ़ना' है। संदर्भ में बुलाने या इकट्ठा करने का भाव संभव है, पर मुख्य पाठ मूल क्रिया की lexical force बनाए रखता है।
- source_word: מִכָּל מְקוֹמֹתָם
  choice: उनके सभी स्थानों में
  rationale: מָקוֹם का सामान्य अर्थ 'स्थान' है। निवास-स्थानों का आशय संदर्भ से स्पष्ट है; 'बस्तियों' कहना अधिक विशिष्ट होता।
- source_word: לַהֲבִיאָם לִירוּשָׁלִָם
  choice: ताकि उन्हें यरूशलेम लाएँ
  rationale: בוא का Hiphil रूप causative है, इसलिए 'लाएँ' मूल अर्थ को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: לַעֲשֹׂת חֲנֻכָּה
  choice: समर्पण उत्सव मनाएँ
  rationale: शाब्दिक अर्थ 'समर्पण करना' है, किंतु समारोह के संदर्भ में 'समर्पण उत्सव मनाना' स्वाभाविक और अर्थसंगत है।
- source_word: וְשִׂמְחָה וּבְתוֹדוֹת וּבְשִׁיר
  choice: आनन्द, धन्यवाद के गीतों और गायन के साथ
  rationale: שִׂמְחָה आनन्द को, תּוֹדוֹת धन्यवाद/स्तुति की अभिव्यक्तियों को और שִׁיר गीत अथवा गायन को दर्शाता है। हिंदी में समारोह का संगीतमय स्वर स्पष्ट करने हेतु यह संयोजन स्वाभाविक है।
- source_word: מְצִלְתַּיִם נְבָלִים וּבְכִנֹּרוֹת
  choice: झाँझों, सारंगियों और वीणाओं के साथ
  rationale: पहला वाद्य स्पष्टतः झाँझ है। נבל और כנור दो भिन्न प्राचीन तार वाले वाद्य हैं; पारंपरिक हिंदी नाम भेद बनाए रखते हैं, जबकि उनकी ठीक आधुनिक पहचान अनिश्चित है।
