  text: 'योयाकीम के दिनों में याजकों में पितृकुलों के मुखिया ये थे: सरायाह के कुल से मरायाह, और यिर्मयाह के कुल से हनन्याह।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָאשֵׁי הָאָבוֹת
  choice: पितृकुलों के मुखिया
  rationale: इस वंशावली-सूची में ‘पितरों के घरों’ का शब्दशः रूप अस्वाभाविक होगा; यह पद पैतृक कुलों के प्रधानों को दर्शाता है।
- source_word: לִשְׂרָיָה ... לְיִרְמְיָה
  choice: सरायाह के पितृकुल का ... यिर्मयाह के पितृकुल का
  rationale: לְ यहाँ सूची में प्रत्येक पूर्वज अथवा याजकीय कुल से संबंधित प्रतिनिधि को चिह्नित करता है। हिंदी में संबंध स्पष्ट करने के लिए ‘के पितृकुल का’ रखा गया है।
- source_word: כֹהֲנִים
  choice: याजक
  rationale: यह इस्राएली धार्मिक पद के लिए प्रचलित और संदर्भानुकूल हिंदी शब्द है।
