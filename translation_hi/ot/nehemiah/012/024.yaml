  text: וְ/רָאשֵׁ֣י הַ֠/לְוִיִּם חֲשַׁבְיָ֨ה שֵֽׁרֵבְיָ֜ה וְ/יֵשׁ֤וּעַ בֶּן קַדְמִיאֵל֙ וַ/אֲחֵי/הֶ֣ם לְ/נֶגְדָּ֔/ם לְ/הַלֵּ֣ל לְ/הוֹד֔וֹת בְּ/מִצְוַ֖ת דָּוִ֣יד אִישׁ הָ/אֱלֹהִ֑ים מִשְׁמָ֖ר לְ/עֻמַּ֥ת מִשְׁמָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/024.yaml
  text: And the heads of the Levites were Hashabiah[a], Sherebiah, and Jeshua son of Kadmiel, with their brothers opposite them, to praise and to give thanks according to the command of David the man of God[b], watch corresponding to watch.
translation:
  language: hi
  text: लेवियों के मुखिया हशब्याह, शेरेब्याह और कदमीएल का पुत्र येशूअ थे, और उनके भाई उनके सामने[a] थे। वे परमेश्वर के जन दाऊद की आज्ञा के अनुसार स्तुति और धन्यवाद करते थे—सेवा-दल के सामने सेवा-दल[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनके आमने-सामने” अथवा “उनके अनुरूप।” सम्भवतः यह उपासना में सामने-सामने या परस्पर अनुरूप व्यवस्थित लेवी समूहों का संकेत है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “सेवा-दल के सामने सेवा-दल।” इसका आशय सम्भवतः मन्दिर-सेवा के आमने-सामने या परस्पर अनुरूप नियुक्त दलों से है।
    reason: cultural_note
lexical_decisions:
- source_word: רָאשֵׁי הַלְוִיִּם
  choice: लेवियों के मुखिया
  rationale: רָאשֵׁי नेतृत्व के पद को सूचित करता है; ‘मुखिया’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: חֲשַׁבְיָה שֵׁרֵבְיָה וְיֵשׁוּעַ בֶּן קַדְמִיאֵל
  choice: हशब्याह, शेरेब्याह और कदमीएल का पुत्र येशूअ
  rationale: व्यक्तिनामों का हिब्रू के निकट लिप्यंतरण किया गया है और בֶּן का स्पष्ट वंश-संबंध बनाए रखा गया है।
- source_word: וַאֲחֵיהֶם
  choice: उनके भाई
  rationale: मूल का पुरुषवाची बहुवचन संबंध-संज्ञा सीधे रखी गई है; प्रसंग में ये अन्य लेवी पुरुष हैं।
- source_word: לְנֶגְדָּם
  choice: उनके सामने
  rationale: यह स्थान या अनुरूप व्यवस्था—सामने, आमने-सामने अथवा समकक्ष—दर्शा सकता है; मुख्य पाठ में सबसे स्वाभाविक स्थानवाची रूप रखा गया है।
- source_word: לְהַלֵּל לְהוֹדוֹת
  choice: स्तुति और धन्यवाद करने के लिए
  rationale: दोनों उद्देश्यवाचक क्रियाओं को अलग-अलग रखा गया है, ताकि स्तुति और धन्यवाद की युग्मित उपासना-क्रियाएँ बनी रहें।
- source_word: בְּמִצְוַת דָּוִיד אִישׁ הָאֱלֹהִים
  choice: परमेश्वर के जन दाऊद की आज्ञा के अनुसार
  rationale: בְּמִצְוַת आज्ञा के अनुरूप होने का भाव देता है; ‘परमेश्वर के जन’ पारंपरिक उपाधि को बिना विस्तार के सुरक्षित रखता है।
- source_word: מִשְׁמָר לְעֻמַּת מִשְׁמָר
  choice: एक सेवा-दल के सामने दूसरा सेवा-दल
  rationale: מִשְׁמָר यहाँ मन्दिर-सेवा के नियत दल को सूचित कर सकता है। हिन्दी में अर्थगम्यता के लिए ‘सेवा-दल’ चुना गया, जबकि आमने-सामने की दोहराई हुई संरचना रखी गई है।
theological_decisions:
- issue: אֲחֵיהֶם का लिंग-सूचक संबंध
  choice: उनके भाई
  alternative: उनके साथी लेवी
  rationale: मूल शब्द व्याकरणतः पुल्लिंग बहुवचन है और मन्दिर-सेवा से जुड़े पुरुष लेवियों को बताता है; इसे लिंग-निरपेक्ष नहीं किया गया।
- issue: מִשְׁמָר לְעֻמַּת מִשְׁמָר का संक्षिप्त उपासना-संबंधी कथन
  choice: एक सेवा-दल के सामने दूसरा सेवा-दल
  alternative: बारी-बारी से स्तुति करनेवाले दल
  rationale: मूल पाठ दलों की व्यवस्थित पारस्परिक स्थिति बताता है, पर स्पष्ट रूप से बारी-बारी गायन नहीं कहता; इसलिए संभावित प्रतिगान की व्याख्या मुख्य पाठ में नहीं जोड़ी गई।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है। वाक्य को पठनीय बनाने के लिए निहित स्थिति को ‘खड़े थे’ से व्यक्त किया गया है; अन्तिम इब्रानी पदबंध की संक्षिप्तता और संभावित उपासना-संबंधी अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
