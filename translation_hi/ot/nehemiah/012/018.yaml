lexical_decisions:
- source_word: לְ/בִלְגָּה
  choice: बिल्गा के लिए
  rationale: इस याजकीय सूची में उपसर्ग לְ संबंध या प्रतिनिधित्व दर्शाता है; हिन्दी में ‘के लिए’ सूची की संरचना को स्वाभाविक रूप से व्यक्त करता है। बिल्गा व्यक्तिवाचक/कुलनाम है, इसलिए उसका लिप्यंतरण किया गया है।
- source_word: שַׁמּוּעַ
  choice: शम्मूआ
  rationale: यह बिल्गा के घराने से संबद्ध प्रतिनिधि का नाम है; हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण अपनाया गया है।
- source_word: לִֽ/שְׁמַעְיָה
  choice: शमायाह के लिए
  rationale: पहले לְ-वाक्यांश की तरह यहाँ भी उपसर्ग सूची में संबंध या प्रतिनिधित्व बताता है। ‘के लिए’ इस समानांतर रचना को बनाए रखता है।
- source_word: יְהוֹנָתָן
  choice: यहो70नातान
  rationale: हिब्रू पाठ में नाम का पूरा रूप יְהוֹנָתָן है; इसलिए संक्षिप्त ‘योनातान’ के बजाय स्रोत के निकट ‘यहोनातान’ चुना गया है।
