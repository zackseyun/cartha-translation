- source_word: לִֽ/ידַֽעְיָה
  choice: यदायाह के लिए
  rationale: לְ यहाँ सूची में यदायाह के याजकीय घराने से अगले नाम का संबंध सूचित करता है; ‘के लिए’ सूची की समानांतर रचना बनाए रखता है।
- source_word: עֻזִּי
  choice: उज्जी
  rationale: व्यक्तिवाचक नाम का हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण।
