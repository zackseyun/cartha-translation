base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/025.yaml
  text: Mattaniah, Bakbukiah, Obadiah, Meshullam, Talmon, and Akkub were guards, gatekeepers, keeping watch at the storehouses of the gates.
translation:
  language: hi
  text: मत्तन्याह, बकबुक्याह, ओबद्याह, मशुल्लाम, तल्मोन और अक्कूब रखवाले और द्वारपाल थे; वे फाटकों के भंडार-कक्षों[a] पर पहरा देते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “फाटकों के संग्रह-स्थानों।”
    reason: אֲסֻפֵּי का संबंध संग्रह या इकट्ठा करने से है; संदर्भ में इसका अर्थ भंडार-कक्ष या संग्रह-स्थल हो सकता है।
lexical_decisions:
- source_word: שֹׁמְרִים שׁוֹעֲרִים
  choice: द्वारपाल थे ... पहरा देते थे
  rationale: दोनों सहभागी रूपों में रखवाली और द्वारपाल की भूमिका व्यक्त होती है। हिंदी में इन्हें स्वाभाविक रूप से भूमिका और कार्य के रूप में रखा गया है, बिना इन्हें दो अलग पद मानने के।
- source_word: מִשְׁמָר
  choice: पहरा देते थे
  rationale: यहाँ शब्द पहरे अथवा रखवाली की ड्यूटी को सूचित करता है; क्रियात्मक हिंदी वाक्यांश संदर्भ में स्पष्ट और स्वाभाविक है।
- source_word: בַּאֲסֻפֵּי הַשְּׁעָרִים
  choice: फाटकों के भंडारों पर
  rationale: אֲסֻפֵּי का मूल भाव इकट्ठा करने या संग्रह रखने की जगह है; मंदिर के फाटकों से जुड़े संदर्भ में 'भंडार' उपयुक्त है, जबकि इसकी शाब्दिक अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
