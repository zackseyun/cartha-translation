base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/037.yaml
  text: And by the Fountain Gate[a], in front of them, they went up by the stairs of the city of David, at the ascent of the wall, above the house of David[b], and as far as the Water Gate on the east.
translation:
  language: hi
  text: और सोते के फाटक[a] के पास, उनके सामने, वे दाऊद के नगर की सीढ़ियों[b] से शहरपनाह की चढ़ाई पर चढ़े और दाऊद के भवन के ऊपर से होते हुए पूर्व में स्थित जल-फाटक तक गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जलस्रोत के फाटक।” इब्रानी शब्द का अर्थ जल का सोता, जलस्रोत या स्रोत हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “चढ़ाइयों।” इब्रानी शब्द निर्मित सीढ़ियों अथवा ऊपर जाने वाले मार्गों—दोनों को दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁעַר הָעַיִן
  choice: सोते का फाटक
  rationale: עַיִן यहाँ जल के प्राकृतिक स्रोत या सोते को दर्शाता है। ‘सोते का फाटक’ हिन्दी में स्थान-नाम के रूप में स्पष्ट है और स्थलाकृतिक अर्थ बनाए रखता है।
- source_word: וְנֶגְדָּם
  choice: उनके सामने
  rationale: נֶגֶד के स्थान-सूचक अर्थ ‘सामने/सम्मुख’ और बहुवचन प्रत्यय को सीधे व्यक्त करता है।
- source_word: עָלוּ
  choice: वे ... चढ़े
  rationale: עלה के सामान्य अर्थ ‘ऊपर जाना/चढ़ना’ तथा मार्ग की ऊर्ध्व गति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מַעֲלוֹת עִיר דָּוִיד
  choice: दाऊद के नगर की सीढ़ियाँ
  rationale: बहुवचन מַעֲלוֹת इस शहरी स्थल-वर्णन में निर्मित सीढ़ियों को सूचित कर सकता है; ‘दाऊद का नगर’ नाम का पारदर्शी और परिचित रूप है।
- source_word: בַּמַּעֲלֶה לַחוֹמָה
  choice: शहरपनाह की चढ़ाई पर
  rationale: एकवचन מַעֲלֶה मार्ग की चढ़ाई को दर्शाता है। לַחוֹמָה के संबंध को ‘शहरपनाह की’ से संक्षेप और स्वाभाविक रूप में रखा गया है।
- source_word: מֵעַל לְבֵית דָּוִיד
  choice: दाऊद के भवन के ऊपर से होते हुए
  rationale: מֵעַל का ऊँचाई-संबंधी अर्थ सुरक्षित रखते हुए इसे मार्ग-वर्णन के रूप में स्वाभाविक हिन्दी दी गई है।
- source_word: שַׁעַר הַמַּיִם מִזְרָח
  choice: पूर्व की ओर जल-फाटक
  rationale: מִזְרָח को दिशासूचक ‘पूर्व की ओर’ और नाम को संक्षिप्त ‘जल-फाटक’ के रूप में प्रस्तुत किया गया है।
- source_word: וְעַל
  choice: फिर ... के पास
  rationale: עַל यहाँ फाटक के निकट स्थित मार्ग-बिंदु का संकेत देता है; ‘के पास’ इसका स्वाभाविक हिन्दी स्थान-सूचक रूप है।
