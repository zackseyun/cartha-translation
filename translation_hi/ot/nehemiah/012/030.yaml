  text: And the priests and the Levites purified themselves[a], and they purified the people, the gates, and the wall.
translation:
  language: hi
  text: और याजकों और लेवियों ने अपने आपको शुद्ध किया[a], और उन्होंने लोगों, फाटकों और शहरपनाह को शुद्ध किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने आपको स्वच्छ किया ... लोगों, फाटकों और शहरपनाह को स्वच्छ किया।” इब्रानी में दोनों कार्यों के लिए एक ही धातु प्रयुक्त है—पहले आत्मवाचक और फिर सकर्मक रूप में।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּטַּהֲרוּ
  choice: अपने आपको शुद्ध किया
  rationale: हित्पअेल रूप आत्मवाचक है और अनुष्ठान-संबंधी शुद्धि का भाव देता है; यह प्रयोग आधुनिक हिन्दी में स्वाभाविक है।
- source_word: הַכֹּהֲנִים
  choice: याजकों
  rationale: उपासना और मंदिर के प्रसंग में כֹּהֲנִים का मानक और सुबोध हिन्दी रूप।
- source_word: וְהַלְוִיִּם
  choice: और लेवियों
  rationale: लेवी गोत्र से जुड़े मंदिर-सेवकों के लिए प्रचलित हिन्दी पद।
- source_word: וַיְטַהֲרוּ
  choice: उन्होंने ... शुद्ध किया
  rationale: पिअेल रूप सकर्मक है; पहले आत्मवाचक रूप के साथ समान धातु का संबंध बनाए रखते हुए अनुष्ठानिक अर्थ सुरक्षित रहता है।
- source_word: הָעָם
  choice: लोगों
  rationale: यहाँ व्यापक समुदाय के लिए सामान्य और प्रसंगानुकूल अर्थ।
- source_word: הַשְּׁעָרִים
  choice: फाटकों
  rationale: नगर की दीवार के संदर्भ में השערים का सीधा और प्रचलित हिन्दी रूप।
- source_word: הַחוֹמָה
  choice: शहरपनाह
  rationale: यरूशलेम को घेरे हुए नगर-प्राचीर के लिए सटीक, बाइबलीय हिन्दी में परिचित पद; केवल 'दीवार' की अपेक्षा संदर्भ अधिक स्पष्ट करता है।
theological_decisions:
- issue: शुद्धि की प्रकृति
  choice: अनुष्ठानिक शुद्धि
  alternative: सामान्य सफाई अथवा नैतिक शुद्धि
  rationale: मंदिर और शहरपनाह के समर्पण के प्रसंग में טהר अनुष्ठानिक शुद्धि को सूचित करता है; अनुवाद विधि का अनावश्यक विवरण जोड़े बिना यही भाव रखता है।
