base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/023.yaml
  text: The sons of Levi[a], heads of fathers’ houses, were recorded in the book of the chronicles[b], up to the days of Yohanan son of Eliashib.
translation:
  language: hi
  text: लेवी के वंशज, जो पितृकुलों के मुखिया थे, इतिहास-वृत्तांत की पुस्तक[a] में एल्याशीब के पुत्र योहानान के दिनों तक दर्ज थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह किसी आधिकारिक ऐतिहासिक अभिलेख या वार्षिक वृत्तांत का उल्लेख है; इससे अनिवार्य रूप से बाइबिल की इतिहास-वृत्तांत की पुस्तकें अभिप्रेत नहीं हैं।
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי לֵוִי
  choice: लेवी के वंशजों में से
  rationale: शाब्दिक अर्थ ‘लेवी के पुत्र’ है, पर यहाँ व्यापक वंशगत समुदाय अभिप्रेत है। ‘वंशजों में से’ अगले पदबंध द्वारा बताए गए विशेष वर्ग—पितृकुलों के मुखिया—से स्वाभाविक रूप से जुड़ता है।
- source_word: רָאשֵׁי הָאָבוֹת
  choice: पितृकुलों के मुखिया
  rationale: यह पदबंध वंश या विस्तृत पारिवारिक इकाइयों के प्रधानों को दर्शाता है। ‘पितृकुल’ मूल के वंशगत भाव को बनाए रखते हुए आधुनिक हिन्दी में संक्षिप्त और स्पष्ट है।
- source_word: כְּתוּבִים
  choice: लेखा ... दर्ज किया गया था
  rationale: כתב का निष्क्रिय रूप लिखित अभिलेख में अंकित किए जाने का भाव देता है। हिन्दी में व्यक्तियों के ‘लिखे जाने’ की अपेक्षा उनके ‘लेखे के दर्ज किए जाने’ से प्रशासनिक अभिलेख का आशय स्वाभाविक ढंग से व्यक्त होता है।
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים
  choice: इतिहास-वृत्तांत की पुस्तक में
  rationale: עַל यहाँ लिखित पुस्तक में समाविष्ट होने के अर्थ में है। דִּבְרֵי הַיָּמִים किसी राजकीय या सामुदायिक कालक्रमिक अभिलेख को सूचित कर सकता है; इसलिए इसे बाइबिल की ‘इतिहास’ नामक पुस्तकों से अनिवार्यतः नहीं जोड़ा गया।
- source_word: וְעַד יְמֵי
  choice: के दिनों तक
  rationale: यह अभिलेख की समय-सीमा बताता है और हिन्दी में स्रोत की कालगत सीमा को सीधे बनाए रखता है।
- source_word: יוֹחָנָן
  choice: योहानान
  rationale: यह रूप इब्रानी नाम की ध्वनि के निकट देवनागरी लिप्यंतरण है।
- source_word: בֶּן אֶלְיָשִׁיב
  choice: एल्याशीब के पुत्र
  rationale: यह सामान्य पितृनाम-सूचक रचना है; हिन्दी में संबंध को स्वाभाविक क्रम में रखा गया है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘लेखा’ जोड़कर इब्रानी के अभिलेखीय आशय को स्वाभाविक हिन्दी में व्यक्त किया गया है, जबकि नामों और काल-सीमा को मूल के निकट रखा गया है।
