source:
  edition: WLC
  text: וְ/אֵ֨לֶּה֙ הַ/כֹּהֲנִ֣ים וְ/הַ/לְוִיִּ֔ם אֲשֶׁ֥ר עָל֛וּ עִם זְרֻבָּבֶ֥ל בֶּן שְׁאַלְתִּיאֵ֖ל וְ/יֵשׁ֑וּעַ שְׂרָיָ֥ה יִרְמְיָ֖ה עֶזְרָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/001.yaml
  text: 'These were the priests and the Levites who came up with Zerubbabel son of Shealtiel[a], and Jeshua: Seraiah, Jeremiah, Ezra.'
translation:
  language: hi
  text: 'ये वे याजक और लेवी थे, जो शालतीएल के पुत्र जरुब्बाबेल और येशू[a] के साथ ऊपर आए थे: सरायाह, यिर्मयाह और एज्रा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘येशू’; नाम को सामान्यीकृत रूप में प्रस्तुत किया जाए, तो ‘यहोशू’ भी हो सकता है।
    reason: नाम יֵשׁוּעַ के सीधे लिप्यंतरण को बनाए रखते हुए, अंग्रेज़ी लेखापथ में दिए गए सामान्यीकृत नाम-रूप के विकल्प को बिना यह कहे सुरक्षित रखा गया है कि वह मूल पाठ का ‘पूर्ण रूप’ है।
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: ये वे ... थे
  rationale: यह पद एक नई सूची का परिचय देता है। आरंभिक וְ के संयोजक बल को हिंदी में प्रसंग और वाक्य-प्रवाह स्वाभाविक रूप से व्यक्त करते हैं; अलग से ‘और’ जोड़ना आवश्यक नहीं है।
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: याजक और लेवी
  rationale: सूची के संदर्भ में दोनों समूहों के लिए प्रचलित, स्पष्ट और स्रोत-संगत शब्दावली।
- source_word: אֲשֶׁר עָלוּ
  choice: जो ... ऊपर आए थे
  rationale: עלה यहाँ यहूदा या यरूशलेम की ओर चढ़कर आने को सूचित करता है। ‘ऊपर आए’ इस भौगोलिक और पारंपरिक भाव को बनाए रखता है, बिना स्रोत में स्पष्ट न किए गए ‘लौटने’ को जोड़ने के।
- source_word: עִם
  choice: के साथ
  rationale: साथ होने या संग आने का सीधा अर्थ।
- source_word: זְרֻבָּבֶל בֶּן שְׁאַלְתִּיאֵל
  choice: शालतीएल के पुत्र जरुब्बाबेल
  rationale: हिंदी की स्वाभाविक संबंध-संरचना में पिता-पुत्र संबंध को सीधे व्यक्त किया गया है और नामों का लिप्यंतरण किया गया है।
- source_word: וְיֵשׁוּעַ
  choice: और येशू
  rationale: मूल में नाम का रूप יֵשׁוּעַ है; ‘येशू’ उसका सीधा लिप्यंतरण है। इसे ‘यहोशू’ के रूप में सामान्यीकृत करने की संभावना पादटिप्पणी में दी गई है।
- source_word: שְׂרָיָה יִרְמְיָה עֶזְרָא
  choice: सरायाह, यिर्मयाह और एज्रा
  rationale: याजकीय अगुओं या कुलों की आरंभिक नाम-सूची को हिंदी में स्वाभाविक विराम-चिह्नों और अंतिम संयोजक के साथ प्रस्तुत किया गया है।
