  register: भाषा आधुनिक, गरिमापूर्ण और सूची-पाठ के अनुरूप संक्षिप्त रखी गई है। नामों के प्रचलित हिंदी बाइबलीय रूप अपनाए गए हैं। पादटिप्पणी का संकेत संबंधित नाम ‘येशू’ के तुरंत बाद रखा गया है।
