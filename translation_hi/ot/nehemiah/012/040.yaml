  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण शैली अपनाई गई है। मूल इब्रानी का समन्वित वाक्य हिंदी में स्पष्टता के लिए दो वाक्यों में बाँटा गया है; दूसरे खंड में निहित क्रिया को ‘वहाँ खड़ा हुआ’ के रूप में पूरा किया गया है।
