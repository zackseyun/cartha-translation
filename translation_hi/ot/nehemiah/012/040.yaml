  text: וַֽ/תַּעֲמֹ֛דְנָה שְׁתֵּ֥י הַ/תּוֹדֹ֖ת בְּ/בֵ֣ית הָ/אֱלֹהִ֑ים וַ/אֲנִ֕י וַ/חֲצִ֥י הַ/סְּגָנִ֖ים עִמִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/040.yaml
  text: So the two thanksgiving choirs took their stand in the house of God[a], and I, and half of the officials with me,
translation:
  language: hi
  text: तब धन्यवाद के वे दोनों दल परमेश्वर के भवन में खड़े हुए[a], और मैं तथा मेरे साथ आधे अधिकारी भी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, ‘दो धन्यवाद।’ प्रसंग में इसका अर्थ धन्यवाद के दो संगठित दल हैं; ये गायक-दल या जुलूस भी हो सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲמֹדְנָה
  choice: अपने-अपने स्थान पर खड़े हो गए
  rationale: עמד के स्त्रीलिंग बहुवचन रूप में केवल खड़े होने के साथ समारोह में निर्धारित स्थान ग्रहण करने का भाव भी है; हिंदी में यह अभिव्यक्ति उस प्रसंगगत अर्थ को स्वाभाविक रूप से व्यक्त करती है।
- source_word: שְׁתֵּי הַתּוֹדֹת
  choice: वे दोनों धन्यवाद-गान करनेवाले दल
  rationale: शाब्दिक अर्थ ‘दो धन्यवाद’ है, पर अध्याय के प्रसंग में यह धन्यवाद देने वाले दो संगठित जुलूसों अथवा गायक-दलों का लक्षणात्मक उल्लेख है। ‘दल’ संदर्भ को स्पष्ट रखता है और ‘धन्यवाद-गान करनेवाले’ उनके कार्य को बताता है।
- source_word: בְּבֵית הָאֱלֹהִים
  choice: परमेश्वर के भवन में
  rationale: यह इब्रानी पद मंदिर के लिए प्रयुक्त होता है; ‘परमेश्वर का भवन’ मूल रूपक और स्थानवाचक בְּ दोनों को निकटता से सुरक्षित रखता है।
- source_word: וַאֲנִי
  choice: मैं भी
  rationale: संयोजक וַ को हिंदी में प्रसंगानुसार ‘भी’ से व्यक्त किया गया है, जिससे नहेमायाह की समानांतर स्थिति स्वाभाविक ढंग से सामने आती है।
- source_word: וַחֲצִי הַסְּגָנִים
  choice: आधे अधिकारियों को लेकर
  rationale: סגנים प्रशासनिक पदाधिकारियों के लिए व्यापक शब्द है; आधुनिक हिंदी में ‘अधिकारी’ स्पष्ट और गैर-विशिष्ट समतुल्य है। वाक्य को स्वाभाविक बनाने के लिए संगति का संबंध ‘को लेकर’ से व्यक्त किया गया है।
- source_word: עִמִּי
  choice: अपने साथ
  rationale: प्रथम पुरुष एकवचन प्रत्यय सहित यह पद साथ अथवा संगति दर्शाता है; हिंदी वाक्य-विन्यास में ‘अपने साथ’ इसका सहज रूप है।
