- source_word: וַ/עֲזַרְיָה
  choice: और अजर्याह
  rationale: आरम्भिक וַ को सूची की निरंतरता दिखाने के लिए ‘और’ से व्यक्त किया गया है; व्यक्तिगत नाम עֲזַרְיָה का प्रचलित हिन्दी बाइबलीय लिप्यंतरण ‘अजर्याह’ रखा गया है।
- source_word: עֶזְרָא
  choice: एज्रा
  rationale: व्यक्तिगत नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण किया गया है। इब्रानी में इसके पहले संयोजक नहीं है, इसलिए हिन्दी सूची में भी अलग से संयोजक नहीं जोड़ा गया।
- source_word: וּ/מְשֻׁלָּם
  choice: और मशुल्लाम
  rationale: וּ को सूची के अंतिम नाम से पहले ‘और’ के रूप में व्यक्त किया गया है; מְשֻׁלָּם का लिप्यंतरण ‘मशुल्लाम’ किया गया है।
