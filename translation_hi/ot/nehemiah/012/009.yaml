lexical_decisions:
- source_word: וּבַקְבֻּקְיָה
  choice: और बकबुक्याह
  rationale: व्यक्तिनाम को हिब्रू उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है और आरंभिक संयोजक וּ को ‘और’ से व्यक्त किया गया है।
- source_word: ו/ענו
  choice: और उन्नो
  rationale: सूची के संदर्भ में इसे व्यक्तिनाम मानना सबसे स्वाभाविक है, यद्यपि व्यंजन-पाठ को क्रिया ‘उत्तर दिया’ के रूप में भी समझा जा सकता है; इस वास्तविक पाठगत अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: אֲחֵיהֶם
  choice: जो उनके भाई थे
  rationale: हिब्रू के संबंध-सूचक बहुवचन को ‘उनके भाई’ के रूप में सीधे रखा गया है; ‘जो ... थे’ हिंदी वाक्य में नामों और संबंध को स्पष्ट व स्वाभाविक रूप से जोड़ता है।
- source_word: לְנֶגְדָּם
  choice: उनके सामने थे
  rationale: इस पदबंध का अर्थ ‘उनके सामने/आमने-सामने/उनके अनुरूप’ हो सकता है। हिंदी में ‘उनके सामने थे’ बिना अनावश्यक क्रिया जोड़कर व्यवस्था की स्थानगत या पारस्परिक धारणा बनाए रखता है।
- source_word: לְמִשְׁמָרוֹת
  choice: सेवा-दलों में
  rationale: मंदिर-सेवा के प्रसंग में מִשְׁמָרוֹת नियुक्त सेवा-समूहों, पालियों या दलों को सूचित करता है। ‘सेवा-दलों में’ सामान्य पाठक के लिए स्पष्ट है और केवल पहरेदारी का संकीर्ण अर्थ नहीं देता।
