base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/038.yaml
  text: And the second thanksgiving choir was going to the left[a], and I followed behind it, with half of the people on the wall, from above the Tower of the Ovens as far as the Broad Wall.
translation:
  language: hi
  text: और धन्यवाद का दूसरा दल बाईं ओर जा रहा था[a], और मैं उसके पीछे था; आधे लोग शहरपनाह पर तंदूरों के बुर्ज से लेकर चौड़ी शहरपनाह तक थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “धन्यवाद देनेवाला दूसरा दल” अथवा “धन्यवाद की दूसरी शोभायात्रा।” इब्रानी शब्द इस आनुष्ठानिक जुलूस में धन्यवाद देनेवाले पूरे दल को सूचित कर सकता है, केवल गानेवालों को नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתּוֹדָה הַשֵּׁנִית
  choice: धन्यवाद-गान करनेवाला दूसरा दल
  rationale: संदर्भ में תּוֹדָה केवल भाव या गीत नहीं, बल्कि शहरपनाह के समर्पण में चल रहे संगठित धन्यवाद-दल को सूचित करता है। यह अनुवाद दल और उसके धन्यवाद-गान, दोनों को स्पष्ट रखता है।
- source_word: הַהוֹלֶכֶת לְמוֹאל
  choice: बाईं ओर बढ़ रहा था
  rationale: स्त्रीलिंग कृदंत चलती हुई शोभायात्रा का जारी दृश्य प्रस्तुत करता है; לְמוֹאל का सीधा दिशासूचक अर्थ ‘बाईं ओर’ है।
- source_word: וַאֲנִי אַחֲרֶיהָ
  choice: मैं उसके पीछे था
  rationale: यह जुलूस में नहेमायाह की स्थानगत स्थिति बताता है; स्त्रीलिंग प्रत्यय का संदर्भ धन्यवाद-दल से है।
- source_word: וַחֲצִי הָעָם
  choice: और आधे लोग भी मेरे साथ
  rationale: मूल में आधे लोगों का उल्लेख नहेमायाह के पीछे चलनेवाले समूह के रूप में है। ‘मेरे साथ’ हिंदी में संबंध स्पष्ट करता है, यद्यपि यह संदर्भगत पूर्ति है।
- source_word: מֵעַל לְהַחוֹמָה
  choice: शहरपनाह पर
  rationale: संदर्भ दीवार की ऊपरी सतह पर चलने का है। ‘शहरपनाह’ यरूशलेम की रक्षात्मक नगर-दीवार के लिए स्वाभाविक और गरिमापूर्ण हिंदी शब्द है।
- source_word: מִגְדַּל הַתַּנּוּרִים
  choice: तंदूरों का बुर्ज
  rationale: नाम के दोनों घटकों—‘बुर्ज’ और ‘तंदूर/भट्ठियाँ’—को पारदर्शी रूप से रखा गया है और स्थान-नाम का स्वरूप सुरक्षित है।
- source_word: הַחוֹמָה הָרְחָבָה
  choice: चौड़ी शहरपनाह
  rationale: यह संभवतः नगर-दीवार के एक जाने-पहचाने भाग का नाम है; शाब्दिक अर्थ और स्थल-संज्ञा दोनों बने रहते हैं।
