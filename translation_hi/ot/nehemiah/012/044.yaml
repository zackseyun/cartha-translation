base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/044.yaml
  text: On that day men were appointed over the storerooms for the contributions[a], for the firstfruits, and for the tithes, to gather into them from the fields of the cities the portions required by the law for the priests and for the Levites[c][b], for Judah rejoiced over the priests and over the Levites who were serving.
translation:
  language: hi
  text: उस दिन कुछ पुरुष भंडारों के लिए बने उन कक्षों[a] की देखरेख के लिए नियुक्त किए गए, ताकि वे नगरों के खेतों से याजकों और लेवियों के लिए व्यवस्था में ठहराए गए भागों[b]—भेंटों, पहली उपज और दशमांश—को उनमें इकट्ठा करें; क्योंकि यहूदा उन याजकों और लेवियों के कारण आनन्दित था जो सेवा में लगे हुए थे।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “भंडारों के लिए कक्ष।” इब्रानी शब्द का अर्थ कक्ष या कोठरियाँ हो सकता है; यहाँ उनका भंडारण का कार्य प्रमुख है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “व्यवस्था के भाग,” अर्थात वे हिस्से जिन्हें तोराह ने याजकों और लेवियों के लिए निर्धारित किया था।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “जो खड़े रहते थे।” मंदिर के इस संदर्भ में इसका अर्थ सेवा के लिए उपस्थित या सेवा में लगे रहना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפָּקְדוּ
  choice: नियुक्त किए गए
  rationale: निफ़ाल रूप यहाँ प्रशासनिक दायित्व के लिए औपचारिक नियुक्ति व्यक्त करता है।
- source_word: אֲנָשִׁים
  choice: कुछ पुरुष
  rationale: इब्रानी का पुल्लिंग बहुवचन और उसका अनिश्चित भाव दोनों व्यक्त होते हैं।
- source_word: הַנְּשָׁכוֹת לָאוֹצָרוֹת
  choice: भंडार-कक्षों
  rationale: נשכות मूलतः कक्ष हैं और אוצרות यहाँ उनके भंडारण-कार्य को स्पष्ट करता है; संयुक्त हिंदी पद दोनों बातों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לַתְּרוּמוֹת
  choice: अंशदान
  rationale: यह पवित्र उपयोग के लिए अलग रखे गए योगदानों को सूचित करता है; ‘अंशदान’ प्रशासनिक संग्रह के संदर्भ में स्पष्ट है।
- source_word: לָרֵאשִׁית
  choice: पहली उपज
  rationale: कृषि-संदर्भ में परमेश्वर के लिए दी जाने वाली आरंभिक उपज का स्वाभाविक हिंदी रूप है।
- source_word: וְלַמַּעַשְׂרוֹת
  choice: और दशमांश
  rationale: מעשרות का प्रचलित और सटीक हिंदी समतुल्य है।
- source_word: לִכְנוֹס בָּהֶם
  choice: इन कक्षों में इकट्ठे करने थे
  rationale: सामग्री को निर्दिष्ट कक्षों में एकत्र करने की दिशा और नियुक्त पुरुषों का उद्देश्य स्पष्ट करता है।
- source_word: לִשְׂדֵי הֶעָרִים
  choice: नगरों के खेतों से
  rationale: नगरों से संबद्ध कृषि-भूमि का औपचारिक रूप से निकट और सुबोध अनुवाद है।
- source_word: מְנָאוֹת הַתּוֹרָה
  choice: व्यवस्था में ठहराए गए भाग
  rationale: शाब्दिक ‘व्यवस्था के भाग’ का आशय तोराह द्वारा निर्धारित हिस्से हैं; यह रूप संबंध को स्पष्ट करता है।
- source_word: כִּי שִׂמְחַת יְהוּדָה
  choice: क्योंकि यहूदा ... से प्रसन्न था
  rationale: ‘यहूदा का आनंद’ को स्वाभाविक हिंदी वाक्य में रखते हुए कारणसूचक संबंध और सामुदायिक संदर्भ बनाए रखता है।
- source_word: הָעֹמְדִים
  choice: जो सेवा में उपस्थित रहते थे
  rationale: शाब्दिक ‘खड़े रहनेवाले’ मंदिर में नियत सेवा के लिए उपस्थित रहने का मुहावरा है; अनुवाद उस संदर्भगत अर्थ को व्यक्त करता है।
theological_decisions:
- issue: הָעֹמְדִים का संबंध और अर्थ
  choice: इसे याजकों और लेवियों दोनों की मंदिर-सेवा में उपस्थिति के रूप में प्रस्तुत किया गया है
  alternative: केवल निकटतम संज्ञा ‘लेवियों’ से जोड़ना, अथवा शाब्दिक ‘जो खड़े थे’ कहना
  rationale: बहुवचन सहभागी रूप संदर्भ में दोनों सेवक-वर्गों को समेट सकता है, और मंदिर-प्रशासन में ‘खड़ा रहना’ सेवा के लिए उपस्थित रहने का परिचित प्रयोग है; किसी विशेष प्रकार की सेवकाई को अतिरिक्त रूप से नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज गद्य रखा गया है। लंबे इब्रानी वाक्य को दो वाक्यों में बाँटा गया है ताकि प्रशासनिक विवरण स्पष्ट रहे। ‘व्यवस्था’ को תּוֹרָה के संदर्भगत अर्थ में रखा गया है और पंथ-विशेष की शब्दावली से बचा गया है।
