base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/035.yaml
  text: 'and from the sons of the priests[a], with trumpets: Zechariah son of Jonathan, son of Shemaiah, son of Mattaniah, son of Micaiah, son of Zaccur, son of Asaph.'
translation:
  language: hi
  text: 'और याजकों के पुत्रों में से[a], तुरहियों के साथ: जकर्याह, योनातान का पुत्र, शमायाह का पुत्र, मत्तन्याह का पुत्र, मीकायाह का पुत्र, जक्कूर का पुत्र, आसाप का पुत्र।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और याजकों के वंशजों में से।” हिब्रू रचना अंशवाचक है।
    reason: हिब्रू מִבְּנֵי के स्वाभाविक अंशवाचक अर्थ और בְּנֵי के वैकल्पिक व्यापक हिन्दी अर्थ को बिना मुख्य पाठ में अतिरिक्त व्याख्या जोड़े सुरक्षित रखता है।
lexical_decisions:
- source_word: וּמִבְּנֵי הַכֹּהֲנִים
  choice: और याजकों के वंशजों में से
  rationale: מִן के अंशवाचक भाव को स्वाभाविक हिन्दी में व्यक्त करता है। यहाँ בְּנֵי का अर्थ केवल प्रत्यक्ष पुत्र नहीं, याजकीय वंश के सदस्य भी हो सकता है।
- source_word: בַּחֲצֹצְרוֹת
  choice: तुरहियाँ लिए हुए
  rationale: בְּ का करणवाचक भाव है; जुलूस के प्रसंग में यह स्वाभाविक हिन्दी है और बताता है कि उनके पास बजाने के लिए तुरहियाँ थीं।
- source_word: זְכַרְיָה
  choice: जकर्याह
  rationale: हिब्रू नाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: בֶן
  choice: पुत्र / पोता / परपोता / वंशज
  rationale: बार-बार आए בֶן से बनी वंशावली को हिन्दी में स्वाभाविक और स्पष्ट रूप से व्यक्त किया गया है; अंतिम कड़ियों में ‘वंशज’ संबंध की श्रृंखला को बिना अतिरिक्त ऐतिहासिक निष्कर्ष के सुरक्षित रखता है।
- source_word: יוֹנָתָן
  choice: योनातान
  rationale: हिब्रू नाम का निकट और प्रचलित हिन्दी लिप्यंतरण।
- source_word: שְׁמַעְיָה
  choice: शमायाह
  rationale: हिब्रू नाम का हिन्दी लिप्यंतरण।
- source_word: מַתַּנְיָה
  choice: मत्तन्याह
  rationale: हिब्रू व्यंजन-द्वित्व और नामरूप को यथासंभव दर्शाता है।
- source_word: מִיכָיָה
  choice: मीकायाह
  rationale: लंबे हिब्रू नामरूप को छोटे ‘मीका’ से अलग रखता है।
- source_word: זַכּוּר
  choice: जक्कूर
  rationale: हिब्रू व्यंजन-द्वित्व और दीर्घ स्वर को दर्शाने वाला हिन्दी लिप्यंतरण।
- source_word: אָסָף
  choice: आसाप
  rationale: हिब्रू नाम का प्रचलित हिन्दी बाइबलीय रूप।
theological_decisions:
- issue: आसाप से वंशावली संबंध
  choice: वंशक्रम को सीधे रूप में रखा गया और आसाप तक ‘वंशज’ कहा गया।
  alternative: हर कड़ी पर शाब्दिक रूप से ‘का पुत्र’ दोहराना, अथवा इसे व्यापक आसापी समुदाय की सदस्यता मानना।
  rationale: हिब्रू में בֶן की पुनरावृत्ति वंशावली देती है, पर दूर की कड़ियों में हिन्दी ‘वंशज’ अधिक स्वाभाविक है। पद स्वयं किसी संगीत-मंडली की सदस्यता या लेखकीय भूमिका नहीं बताता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। वंशावली की लंबी ‘पुत्र’ शृंखला को पुत्र–पोता–परपोता–वंशज के रूप में स्पष्ट किया गया है; मुख्य पाठ में [a] चिह्न उपस्थित है।
