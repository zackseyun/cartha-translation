  yaml_path: translation/ot/nehemiah/012/026.yaml
  text: These were in the days of Joiakim son of Jeshua[a], son of Jozadak, and in the days of Nehemiah the governor and Ezra the priest, the scribe.
translation:
  language: hi
  text: ये लोग योयाकीम के दिनों में थे—योयाकीम येशू का पुत्र था और येशू योसादाक का पुत्र था—तथा नहेमायाह राज्यपाल और एज्रा याजक और शास्त्री के दिनों में भी थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: ये लोग थे
  rationale: बहुवचन संकेतवाचक शब्द पहले सूचीबद्ध व्यक्तियों की ओर संकेत करता है; हिन्दी में वाक्य को स्वाभाविक बनाने के लिए ‘लोग’ और ‘थे’ स्पष्ट किए गए हैं।
- source_word: בִּימֵי
  choice: के दिनों में
  rationale: यह ऐतिहासिक काल बताने वाला प्रचलित इब्रानी मुहावरा है, जिसे हिन्दी में इसी परिचित अभिव्यक्ति से रखा गया है।
- source_word: יוֹיָקִים
  choice: योयाकीम
  rationale: निर्वासन के बाद के इस याजकीय व्यक्ति के नाम का ध्वन्यात्मक लिप्यंतरण है।
- source_word: בֶּן יֵשׁוּעַ בֶּן יוֹצָדָק
  choice: येशू का पुत्र और योसादाक का पोता
  rationale: लगातार दो वंशसूचक ‘पुत्र’ संबंधों को सामान्य हिन्दी में स्पष्ट रूप से व्यक्त किया गया है; अर्थ वही रहता है कि योयाकीम, येशू का पुत्र और योसादाक का पौत्र था।
- source_word: נְחֶמְיָה הַפֶּחָה
  choice: नहेमायाह राज्यपाल
  rationale: פֶּחָה साम्राज्य के अधीन किसी प्रांत के प्रशासक को दर्शाता है; ‘राज्यपाल’ आधुनिक हिन्दी में स्पष्ट पदनाम है।
- source_word: וְעֶזְרָא הַכֹּהֵן הַסּוֹפֵר
  choice: तथा एज्रा याजक और शास्त्री
  rationale: इब्रानी पाठ में एज्रा के दो सहाधिकरणात्मक पदनाम हैं। हिन्दी में ‘याजक और शास्त्री’ दोनों को एक ही व्यक्ति के पदों के रूप में स्वाभाविक ढंग से व्यक्त करता है।
