    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: चले
  rationale: הלך का वाव-क्रमिक रूप कथा में भूतकाल की साधारण गति बताता है। बहुवचन संयुक्त कर्ता के अनुरूप ‘चले’ स्वाभाविक है।
- source_word: אַחֲרֵיהֶם
  choice: उनके पीछे
  rationale: यह पदबंध किसी समूह के पीछे स्थान या गति को दर्शाता है; जुलूस के क्रम को ‘उनके पीछे’ स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: הוֹשַׁעְיָה
  choice: होशायाह
  rationale: व्यक्तिनाम का अर्थानुवाद न करके उसका मानक देवनागरी लिप्यंतरण किया गया है।
- source_word: וַחֲצִי
  choice: और ... आधे
  rationale: חֲצִי का अर्थ ‘आधा’ है और पूर्वसर्गीय वाव होशायाह के साथ दूसरे समूह को जोड़ता है।
- source_word: שָׂרֵי
  choice: अधिकारी
  rationale: שַׂר शासक, प्रधान या अधिकारी को सूचित कर सकता है। यहाँ प्रशासनिक और समारोह-संबंधी प्रसंग में ‘अधिकारी’ उपयुक्त है और ‘राजकुमार’ जैसी वंशगत धारणा नहीं जोड़ता।
- source_word: יְהוּדָה
  choice: यहूदा
  rationale: स्थान और गोत्र के नाम का प्रचलित हिन्दी रूप।
