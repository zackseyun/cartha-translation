source:
  edition: WLC
  text: וַֽ/יִּשְׁמְר֞וּ מִשְׁמֶ֤רֶת אֱלֹֽהֵי/הֶם֙ וּ/מִשְׁמֶ֣רֶת הַֽ/טָּהֳרָ֔ה וְ/הַ/מְשֹׁרְרִ֖ים וְ/הַ/שֹּׁעֲרִ֑ים כְּ/מִצְוַ֥ת דָּוִ֖יד שְׁלֹמֹ֥ה בְנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/045.yaml
  text: And they kept the charge of their God and the charge of purification[a], and so did the singers and the gatekeepers[b], according to the command of David and Solomon his son.
translation:
  language: hi
  text: उन्होंने अपने परमेश्वर की सेवा का दायित्व और शुद्धीकरण का दायित्व निभाया[a]; गायकों और द्वारपालों ने भी ऐसा ही किया[b]—दाऊद और उसके पुत्र सुलैमान की आज्ञा के अनुसार।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शुद्ध करने का दायित्व” अथवा “शुद्धता बनाए रखने का दायित्व।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “गायक और द्वारपाल” वाला वाक्यांश संक्षिप्त है और उसमें क्रिया नहीं दी गई। सम्भवतः अर्थ यह है कि इन समूहों ने भी अपने निर्धारित दायित्व निभाए।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְרוּ מִשְׁמֶרֶת
  choice: सेवा का दायित्व निभाया
  rationale: שׁמר के साथ מִשְׁמֶרֶת नियुक्त दायित्व को पूरा करने का मुहावरा है। सहज हिन्दी के लिए ‘दायित्व निभाया’ चुना गया; पहले पद में ‘सेवा’ मंदिर-संदर्भ स्पष्ट करता है।
- source_word: אֱלֹהֵיהֶם
  choice: अपने परमेश्वर
  rationale: इब्रानी का बहुवचन संबंधसूचक प्रत्यय रखा गया है; हिन्दी में कर्ता के साथ ‘अपने’ स्वाभाविक है।
- source_word: וּמִשְׁמֶרֶת הַטָּהֳרָה
  choice: और शुद्धीकरण का दायित्व
  rationale: הַטָּהֳרָה मंदिर की विधिगत शुद्धता अथवा शुद्ध करने की व्यवस्था को सूचित करता है। ‘शुद्धीकरण’ उस कर्मकाण्डीय संदर्भ को बनाए रखता है।
- source_word: וְהַמְשֹׁרְרִים וְהַשֹּׁעֲרִים
  choice: गायक और द्वारपाल भी ऐसा ही करते थे
  rationale: इब्रानी वाक्यांश क्रियारहित और संक्षिप्त है। ‘भी ऐसा ही करते थे’ संभावित अर्थ को पठनीय बनाता है, जबकि पादटिप्पणी मूल की अस्पष्टता बताती है।
- source_word: שֹׁעֲרִים
  choice: द्वारपाल
  rationale: मंदिर के द्वारों पर नियुक्त सेवकों के लिए यह सटीक और प्रचलित हिन्दी शब्द है।
- source_word: כְּמִצְוַת
  choice: की आज्ञा के अनुसार
  rationale: מִצְוָה यहाँ मंदिर-सेवा के विषय में अधिकारपूर्ण निर्देश है; ‘आज्ञा’ स्वाभाविक और गरिमापूर्ण है।
- source_word: דָּוִיד שְׁלֹמֹה בְנוֹ
  choice: दाऊद और उसके पुत्र सुलैमान
  rationale: इब्रानी क्रम को अर्थ की स्पष्टता के लिए स्वाभाविक हिन्दी में रखा गया; ‘उसके पुत्र’ का संबंध दाऊद से है।
theological_decisions:
- issue: मंदिर-सेवा के संदर्भ में הַטָּהֳרָה का स्वरूप
  choice: शुद्धीकरण
  alternative: शुद्धता; शुद्ध करने का काम
  rationale: संदर्भ लेवीय और उपासना-संबंधी दायित्वों का है। ‘शुद्धीकरण’ विधिगत आयाम बनाए रखता है और इसे केवल सामान्य नैतिक पवित्रता नहीं बनाता।
- issue: गायकों और द्वारपालों वाले क्रियारहित वाक्यांश का संबंध
  choice: उन्हें भी पहले बताए दायित्व निभाने वाले समूहों के रूप में पढ़ना
  alternative: उन्हें दायित्वों की सूची या साथ जुड़े समूहों के रूप में पढ़ना
  rationale: संदर्भ में यह विस्तार सबसे स्वाभाविक है, पर इब्रानी की संक्षिप्त रचना निर्णायक रूप से संबंध नहीं बताती; इसलिए अस्पष्टता पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण शैली। ‘चार्ज’ जैसे अप्राकृतिक अनुवाद से बचते हुए इब्रानी मुहावरे को ‘दायित्व निभाया’ से व्यक्त किया गया है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में स्पष्ट रूप से उपस्थित हैं।
