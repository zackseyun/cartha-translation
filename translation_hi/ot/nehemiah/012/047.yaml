source:
  edition: WLC
  text: וְ/כָל יִשְׂרָאֵל֩ בִּ/ימֵ֨י זְרֻבָּבֶ֜ל וּ/בִ/ימֵ֣י נְחֶמְיָ֗ה נֹֽתְנִ֛ים מְנָי֛וֹת הַ/מְשֹׁרְרִ֥ים וְ/הַ/שֹּׁעֲרִ֖ים דְּבַר י֣וֹם בְּ/יוֹמ֑/וֹ וּ/מַקְדִּשִׁים֙ לַ/לְוִיִּ֔ם וְ/הַ/לְוִיִּ֔ם מַקְדִּשִׁ֖ים לִ/בְנֵ֥י אַהֲרֹֽן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/047.yaml
  text: And all Israel[a], in the days of Zerubbabel and in the days of Nehemiah, gave the portions for the singers and the gatekeepers, as each day required; and they set apart the consecrated portions for the Levites[c][b], and the Levites set apart the consecrated portions for the sons of Aaron.
translation:
  language: hi
  text: और समस्त इस्राएल जरुब्बाबेल के दिनों में और नहेमायाह के दिनों में गायकों और द्वारपालों के हिस्से हर दिन की आवश्यकता के अनुसार[a] देता था। वे लेवियों के लिए पवित्र भाग अलग रखते थे[b], और लेवी हारून के वंशजों[c] के लिए पवित्र भाग अलग रखते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “हर दिन का विषय उसके अपने दिन में,” अर्थात् उस दिन जितना आवश्यक था।
    reason: इब्रानी मुहावरे के शाब्दिक रूप और आशय को सुरक्षित रखना।
  - marker: b
    text: इब्रानी में शाब्दिक रूप से, “वे लेवियों के लिए पवित्र ठहराते थे”; “भाग” प्रसंग से निहित है।
    reason: मुख्य पाठ में पूरित कर्म को चिह्नित करना और क्रिया की सम्भव संक्षिप्त व्याख्या बनाए रखना।
  - marker: c
    text: अर्थात् हारून के याजकीय वंश के लोग।
    reason: वंश-सूचक पदनाम का प्रसंग स्पष्ट करना।
lexical_decisions:
- source_word: וְכָל יִשְׂרָאֵל
  choice: और समस्त इस्राएल
  rationale: इब्रानी के सामूहिक, वाचा-संबंधी पदनाम को बनाए रखता है। हिन्दी में ‘समस्त इस्राएल’ पूरे समुदाय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בִּימֵי זְרֻבָּבֶל וּבִימֵי נְחֶמְיָה
  choice: जरुब्बाबेल के दिनों में और नहेमायाह के दिनों में
  rationale: स्रोत में दोहराए गए ऐतिहासिक वाक्यांश को सुरक्षित रखा गया है, जिससे दोनों कालों पर समान बल बना रहता है।
- source_word: נֹתְנִים
  choice: देता था
  rationale: इब्रानी कृदंत यहाँ बीते समय की नियमित प्रथा बताता है। कर्ता ‘समस्त इस्राएल’ हिन्दी में एक सामूहिक एकवचन है, इसलिए ‘देता था’ स्वाभाविक है।
- source_word: מְנָיוֹת
  choice: हिस्से
  rationale: यह मन्दिर की सेवा करनेवालों के लिए निर्धारित सामग्री या उपजीविका के अंशों को दर्शाता है; ‘हिस्से’ सरल और प्रसंगानुकूल है।
- source_word: הַמְשֹׁרְרִים וְהַשֹּׁעֲרִים
  choice: गायकों और द्वारपालों
  rationale: मन्दिर-सेवा के इन स्थापित पदों के लिए स्पष्ट और प्रचलित हिन्दी शब्द चुने गए हैं।
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: हर दिन की आवश्यकता के अनुसार
  rationale: शाब्दिक मुहावरा ‘एक दिन का विषय उसके दिन में’ है; चुना हुआ रूप प्रतिदिन देय व्यवस्था को आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: וּמַקְדִּשִׁים
  choice: पवित्र भाग अलग रखते थे
  rationale: हिफ़ील रूप में पवित्र उपयोग के लिए अलग करने का भाव है। ‘पवित्र भाग’ संदर्भ और समानांतर रचना से निहित कर्म को स्पष्ट करता है, जबकि पादटिप्पणी स्रोत की संक्षिप्तता बताती है।
- source_word: וְהַלְוִיִּם מַקְדִּשִׁים לִבְנֵי אַהֲרֹן
  choice: और लेवी हारून के वंशजों के लिए पवित्र भाग अलग रखते थे
  rationale: समानांतर प्रशासनिक-पवित्र क्रिया को बनाए रखते हुए प्राप्तकर्ताओं को स्पष्ट किया गया है।
- source_word: בְּנֵי אַהֲרֹן
  choice: हारून के वंशजों
  rationale: इब्रानी वंश-सूचक अभिव्यक्ति का अर्थ हिन्दी में स्वाभाविक रूप से देता है और सीधे ‘याजक’ कहकर व्याख्या को मुख्य पाठ में नहीं मिलाता।
theological_decisions:
- issue: मन्दिर-सहायता के संदर्भ में מַקְדִּשִׁים का अर्थ
  choice: पवित्र भाग अलग रखते थे
  alternative: लेवियों और हारून के वंशजों को देते थे / उनके लिए अलग रखते थे
  rationale: קדשׁ का पवित्रता-संबंधी मूल भाव यहाँ बना रहता है। फिर भी इब्रानी में प्रत्यक्ष कर्म नहीं लिखा है, इसलिए ‘पवित्र भाग’ को प्रसंग से पूरित मानते हुए पादटिप्पणी में यह स्पष्ट किया गया है।
- issue: בְּנֵי אַהֲרֹן की पहचान
  choice: हारून के वंशज
  alternative: हारूनी याजक
  rationale: मुख्य पाठ स्रोत की वंशावली-संबंधी अभिव्यक्ति को रखता है; पादटिप्पणी उसका याजकीय संदर्भ बताती है, बिना दोनों को पूरी तरह समान ठहराए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रखी गई है। ऐतिहासिक सूत्र की पुनरावृत्ति तथा मन्दिर-सेवा की पवित्रता-संबंधी शब्दावली को सुरक्षित रखा गया है; जहाँ हिन्दी की स्पष्टता के लिए निहित कर्म जोड़ा गया है, वहाँ पादटिप्पणी दी गई है।
