base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/028.yaml
  text: And the sons of the singers were gathered from the district around Jerusalem and from the settlements of the Netophathites[a][b].
translation:
  language: hi
  text: तब गायकों के पुत्र यरूशलेम के चारों ओर के क्षेत्र[a] और नतोपातियों की बस्तियों[b] से इकट्ठे हुए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘यरूशलेम के चारों ओर का मैदान।’ इब्रानी शब्द כִּכָּר प्रसंग के अनुसार मैदान, घेरा या क्षेत्र को दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘नतोपातियों के गाँव।’ इब्रानी शब्द חַצְרֵי प्रायः छोटी बस्तियों या बिना शहरपनाह वाले गाँवों को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָסְפוּ
  choice: इकट्ठे किए गए
  rationale: निफ़अल रूप निष्क्रिय अथवा आत्मवाचक अर्थ दे सकता है। ‘इकट्ठे किए गए’ इब्रानी रूप को निकटता से रखता है और यह तय नहीं करता कि वे स्वयं जुटे या बुलाए गए।
- source_word: בְּנֵי הַמְשֹׁרְרִים
  choice: गायकों के पुत्र
  rationale: यह मूल इब्रानी संरचना का औपचारिक रूप है; प्रसंग में इससे गायक-वर्ग के सदस्य अथवा वंशज समझे जा सकते हैं, इसलिए निहित संबंध को केवल ‘गायक’ कहकर सीमित नहीं किया गया।
- source_word: הַמְשֹׁרְרִים
  choice: गायकों
  rationale: यह कृदन्त-संज्ञा विशेष रूप से गाने वालों को दर्शाती है, सामान्य रूप से सभी संगीतकारों को नहीं।
- source_word: הַכִּכָּר סְבִיבוֹת יְרוּשָׁלִַם
  choice: यरूशलेम के चारों ओर के क्षेत्र
  rationale: כִּכָּר का अर्थ मैदान, घेरा या इलाका हो सकता है। यहाँ ‘चारों ओर’ के साथ व्यापक भौगोलिक क्षेत्र का अर्थ स्वाभाविक है।
- source_word: חַצְרֵי
  choice: बस्तियों
  rationale: भौगोलिक संदर्भ में חָצֵר प्रायः छोटी या बिना शहरपनाह वाली बस्तियों को सूचित करता है; ‘बस्तियाँ’ सहज और पर्याप्त व्यापक है।
- source_word: נְטֹפָתִי
  choice: नतोपातियों
  rationale: यह जातिवाचक/निवासीवाचक रूप है और नतोपा से जुड़े लोगों को दर्शाता है, केवल स्थान-नाम को नहीं।
