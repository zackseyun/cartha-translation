id: NEH.12.7
reference: Nehemiah 12:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: סַלּ֣וּ עָמ֔וֹק חִלְקִיָּ֖ה יְדַֽעְיָ֑ה אֵ֣לֶּה רָאשֵׁ֧י הַ/כֹּהֲנִ֛ים וַ/אֲחֵי/הֶ֖ם בִּ/ימֵ֥י יֵשֽׁוּעַ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/007.yaml
  text: Sallu[a], Amok, Hilkiah[c][b], Jedaiah—these were the heads of the priests and their brothers in the days of Jeshua.
translation:
  language: hi
  text: सल्लू, आमोक, हिल्किय्याह और यदायाह—ये येशू[a] के दिनों में याजकों और उनके भाइयों[b] के मुखिया[c] थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘येशू’ निर्वासनोत्तर काल में प्रयुक्त नाम-रूप है और ‘यहोशू’ नाम से सम्बन्धित है।
    reason: cultural_note
  - marker: b
    text: या ‘उनके सम्बन्धियों’ अथवा ‘उनके साथी याजकों’। इब्रानी में शाब्दिक रूप से ‘उनके भाइयों’ है।
    reason: lexical_alternative
  - marker: c
    text: या ‘अगुए’। इब्रानी में शाब्दिक रूप से ‘सिरों’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: סַלּוּ
  choice: सल्लू
  rationale: व्यक्तिवाचक नाम को उसके इब्रानी उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: עָמוֹק
  choice: आमोक
  rationale: सूची में आए व्यक्तिवाचक नाम का इब्रानी से सीधा देवनागरी लिप्यंतरण।
- source_word: חִלְקִיָּה
  choice: हिल्किय्याह
  rationale: नाम के व्यंजन-विन्यास और अंतिम ईश-नामात्मक अंश को पहचानने योग्य रखते हुए लिप्यंतरित किया गया है।
- source_word: יְדַעְיָה
  choice: यदायाह
  rationale: व्यक्तिवाचक नाम का स्वाभाविक हिन्दी लिप्यंतरण किया गया है।
- source_word: אֵלֶּה
  choice: ये
  rationale: यह संकेतवाचक सर्वनाम पहले बताए गए व्यक्तियों की ओर संकेत करता है; हिन्दी में अलग से ‘ये लोग’ जोड़ना आवश्यक नहीं है।
- source_word: רָאשֵׁי
  choice: मुखिया
  rationale: शाब्दिक अर्थ ‘सिर’ है, पर यहाँ नेतृत्व करने वाले व्यक्तियों का मुहावरेदार अर्थ है। ‘मुखिया’ इस अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है और बाद के तकनीकी पद ‘प्रधान याजक’ से बचाता है।
- source_word: הַכֹּהֲנִים
  choice: याजकों
  rationale: निश्चित बहुवचन संज्ञा का सीधा और प्रचलित हिन्दी रूप।
- source_word: וַאֲחֵיהֶם
  choice: और उनके भाइयों
  rationale: मूल पाठ में स्पष्ट रूप से ‘उनके भाई’ है। सन्दर्भ में इसका आशय सम्बन्धी अथवा साथी याजक भी हो सकता है, इसलिए शाब्दिक पारिवारिक पद को मुख्य पाठ में रखा गया है।
- source_word: בִּימֵי
  choice: के दिनों में
  rationale: इब्रानी कालवाचक मुहावरे का सटीक और हिन्दी में परिचित रूप।
- source_word: יֵשׁוּעַ
  choice: येशू
  rationale: निर्वासनोत्तर नाम יֵשׁוּעַ का इब्रानी के निकट लिप्यंतरण; यह उसी नाम-परिवार से है जिससे ‘यहोशू’ सम्बन्धित है।
theological_decisions:
- issue: רָאשֵׁי को याजकीय नेतृत्व के पद के रूप में प्रस्तुत करना
  choice: मुखिया
  alternative: अगुए; प्रधान याजक
  rationale: यहाँ शब्द सामान्य नेतृत्व को सूचित करता है। ‘प्रधान याजक’ बाद के एक विशिष्ट संस्थागत पद का भ्रम पैदा कर सकता है, इसलिए उसे मुख्य पाठ में नहीं अपनाया गया।
- issue: וַאֲחֵיהֶם का सामूहिक पुरुषवाचक प्रयोग
  choice: उनके भाइयों
  alternative: उनके सम्बन्धियों; उनके साथी याजकों
  rationale: इब्रानी में पुरुष बहुवचन ‘भाई’ स्पष्ट है। याजकीय सूची में इसका दायरा व्यापक हो सकता है, पर उस सम्भावना को मुख्य पाठ में निश्चित अर्थ बनाकर नहीं थोपा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। नामों को इब्रानी के निकट देवनागरी में लिप्यंतरित किया गया है। सूची के बाद दीर्घ विराम वाक्य-संरचना को स्पष्ट करता है; ‘मुखिया’ नेतृत्व का अर्थ देता है, पर किसी बाद के तकनीकी याजकीय पद को आरोपित नहीं करता।
