  text: and Maaseiah[a], Shemaiah, Eleazar, Uzzi, Jehohanan, Malkijah, Elam, and Ezer. And the singers made their voices heard[b], with Izrahiah the overseer.
translation:
  language: hi
  text: और मासेयाह, शमायाह, एलिआज़ार, उज्जी, यहोहानान, मल्कियाह, एलाम और एज़ेर। गायकों ने अपनी आवाज़ सुनाई[a], और यिज्रहियाह निरीक्षक था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “गायकों ने ऊँचे स्वर में गाया।” इब्रानी क्रिया कारणवाचक है, जिसका शाब्दिक भाव “सुनाया” है।
    reason: lexical_alternative
  - marker: b
    text: या, “अधिकारी” अथवा “पर्यवेक्षक।”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲשֵׂיָה וּשְׁמַעְיָה וְאֶלְעָזָר וְעֻזִּי וִיהוֹחָנָן וּמַלְכִּיָּה וְעֵילָם וָעָזֶר
  choice: मासेयाह, शमायाह, एलिआज़ार, उज्जी, यहोहानान, मल्कियाह, एलाम और एज़ेर
  rationale: व्यक्तिनामों का अर्थानुवाद न करके उनके इब्रानी रूपों के अनुसार देवनागरी लिप्यंतरण किया गया है।
- source_word: וַיַּשְׁמִיעוּ
  choice: अपना स्वर सुनाया
  rationale: שמע के हिफ़ील रूप का कारणवाचक भाव ‘सुनाई देना/सुनाना’ है। गायकों के प्रसंग में यह अभिव्यक्ति उनके स्पष्ट और प्रबल गायन को दर्शाती है, पर ‘ऊँचे स्वर में गाया’ की अपेक्षा मूल क्रिया का रूप अधिक निकटता से बचाए रखती है।
- source_word: הַמְשֹׁרְרִים
  choice: गायकों
  rationale: यह שׁיר से बना पद है और मंदिर की उपासना में गाने वालों को सीधे सूचित करता है।
- source_word: יִזְרַחְיָה
  choice: यिज्रहियाह
  rationale: व्यक्तिनाम का इब्रानी ध्वनियों के निकट देवनागरी लिप्यंतरण।
- source_word: הַפָּקִיד
  choice: निरीक्षक
  rationale: यह नियुक्त प्रशासनिक या पर्यवेक्षकीय दायित्व रखने वाले व्यक्ति को सूचित करता है; संगीत-संबंधी प्रसंग में ‘निरीक्षक’ पद या श्रेणी को अनावश्यक रूप से बढ़ाए बिना अर्थ व्यक्त करता है।
