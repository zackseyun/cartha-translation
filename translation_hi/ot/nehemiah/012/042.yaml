  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। पद पिछले पद से चल रही नामावली का अंश है, इसलिए आरंभ में ‘और’ रखा गया है। अंतिम खंड को स्वाभाविक हिन्दी में ‘उनका निरीक्षक था’ किया गया है; इससे यिज्रहियाह की गायकों पर नियुक्त भूमिका व्यक्त होती है, जबकि पदनाम की सीमा पादटिप्पणी में खुली रखी गई है।
