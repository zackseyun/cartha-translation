  text: וְ/הַ/לְוִיִּ֗ם יֵשׁ֧וּעַ בִּנּ֛וּי קַדְמִיאֵ֥ל שֵׁרֵבְיָ֖ה יְהוּדָ֣ה מַתַּנְיָ֑ה עַֽל הֻיְּד֖וֹת ה֥וּא וְ/אֶחָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/008.yaml
  text: And the Levites were Jeshua[a], Binnui, Kadmiel, Sherebiah, Judah, and Mattaniah, who, with his brothers[b], was over the thanksgiving songs.
translation:
  language: hi
  text: 'और लेवी ये थे: येशूअ, बिन्नूई, कदमीएल, शेरेब्याह, यहूदा और मत्तन्याह,[a] जो अपने भाइयों के साथ धन्यवाद के गीतों[b] की देखरेख करता था।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मत्तन्याह और उसके भाई धन्यवाद की अभिव्यक्तियों की देखरेख करते थे।” इब्रानी को अधिक सामूहिक अर्थ में भी समझा जा सकता है, यद्यपि एकवचन सर्वनाम सबसे स्वाभाविक रूप से मत्तन्याह की ओर संकेत करता है।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक रूप से, “धन्यवाद-स्तुतियाँ”; यहाँ सम्भवतः आराधना में गाए या बोले जाने वाले धन्यवाद और स्तुति के भाव अभिप्रेत हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: और लेवी ये थे
  rationale: संयोजक के बाद आया निश्चित बहुवचन संज्ञा-पद सूची के अगले समूह का परिचय देता है। क्रियारहित इब्रानी वाक्य को स्वाभाविक हिन्दी बनाने के लिए ‘ये थे’ जोड़ा गया है।
- source_word: יֵשׁוּעַ בִּנּוּי קַדְמִיאֵל שֵׁרֵבְיָה יְהוּדָה מַתַּנְיָה
  choice: येशूअ, बिन्नूई, कदमीएल, शेरेब्याह, यहूदा और मत्तन्याह
  rationale: व्यक्तिनामों का अर्थानुवाद न करके स्रोत के उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: עַל
  choice: का अधिकारी
  rationale: यहाँ पूर्वसर्ग किसी कार्य की देखरेख या उत्तरदायित्व व्यक्त करता है; ‘का अधिकारी’ संक्षिप्त और स्वाभाविक हिन्दी है।
- source_word: הֻיְּדוֹת
  choice: धन्यवाद के गीतों
  rationale: बहुवचन संज्ञा आराधना में धन्यवाद अथवा स्तुति की अभिव्यक्तियों को दर्शाती है। लेवीय सेवा के प्रसंग में ‘धन्यवाद के गीत’ सम्भावित गायन-संबंधी आशय को स्पष्ट करता है, जबकि शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: הוּא
  choice: मत्तन्याह ... था
  rationale: एकवचन सर्वनाम सबसे स्वाभाविक रूप से सूची के अंतिम व्यक्ति मत्तन्याह की ओर संकेत करता है। अस्पष्टता से बचने के लिए हिन्दी में नाम दोहराया गया है।
- source_word: וְאֶחָיו
  choice: अपने भाइयों के साथ
  rationale: यह पद मत्तन्याह के साथ जुड़े पुरुष सहकर्मियों अथवा साथी लेवियों को बताता है; ‘अपने भाइयों के साथ’ स्रोत के पारिवारिक शब्द और सहभागिता दोनों को बनाए रखता है।
theological_decisions:
- issue: बहुवचन सूची के बाद एकवचन הוּא का संदर्भ
  choice: एकवचन को मत्तन्याह के लिए समझा गया है, जो अपने भाइयों के साथ इस दायित्व में था।
  alternative: इसे ढीले सामूहिक अर्थ में लेकर सभी नामित लेवियों को धन्यवाद की अभिव्यक्तियों का अधिकारी समझा जा सकता है।
  rationale: इब्रानी व्याकरण में एकवचन सर्वनाम का निकटतम और सर्वाधिक स्वाभाविक पूर्वपद मत्तन्याह है। फिर भी सूची के सामूहिक संदर्भ के कारण वैकल्पिक समझ पादटिप्पणी में रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सूची-संगत शैली रखी गई है। नाम स्रोत-रूप के निकट लिप्यंतरित हैं। मुख्य पाठ में स्वाभाविक एकवचन संदर्भ अपनाया गया है और वास्तविक भाषिक अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
