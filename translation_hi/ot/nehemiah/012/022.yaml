id: NEH.12.22
reference: Nehemiah 12:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הַ/לְוִיִּם֩ בִּ/ימֵ֨י אֶלְיָשִׁ֜יב יוֹיָדָ֤ע וְ/יוֹחָנָן֙ וְ/יַדּ֔וּעַ כְּתוּבִ֖ים רָאשֵׁ֣י אָב֑וֹת וְ/הַ/כֹּ֣הֲנִ֔ים עַל מַלְכ֖וּת דָּרְיָ֥וֶשׁ הַ/פָּֽרְסִֽי־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/022.yaml
  text: In the days of Eliashib[a], Joiada, Johanan, and Jaddua, the Levites were recorded as heads of fathers’ houses, and the priests also[c][b], during the reign of Darius the Persian.
translation:
  language: hi
  text: एल्याशीब, योयादा, योहानान[c] और यद्दूअ के दिनों में लेवियों को पितृकुलों के मुखियाओं[a] के रूप में दर्ज किया गया[b]; और याजकों को भी फ़ारसी दारा के शासनकाल में दर्ज किया गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘पितृकुल’ से आशय एक ही पूर्वज से जुड़े विस्तृत परिवार या वंश की सामाजिक इकाई से है।
    reason: cultural_note
  - marker: b
    text: या ‘लिखे गए’ अथवा ‘अभिलेख में चढ़ाए गए।’
    reason: lexical_alternative
  - marker: c
    text: कुछ अनुवाद-परंपराओं में यहाँ ‘योनातान’ मिलता है, पर इब्रानी पाठ में ‘योहानान’ है।
    reason: alternative_reading
lexical_decisions:
- source_word: הַלְוִיִּם
  choice: लेवियों
  rationale: इस्राएल के लेवी गोत्र और उससे जुड़ी सेवकीय श्रेणी के सदस्यों के लिए यह मानक और स्वाभाविक हिन्दी पद है।
- source_word: בִּימֵי
  choice: के दिनों में
  rationale: इब्रानी के प्रचलित कालसूचक मुहावरे की औपचारिकता और सहज अर्थ, दोनों को बनाए रखता है।
- source_word: אֶלְיָשִׁיב יוֹיָדָע וְיוֹחָנָן וְיַדּוּעַ
  choice: एल्याशीब, योयादा, योहानान और यद्दूअ
  rationale: नामों को इब्रानी रूपों के आधार पर देवनागरी में लिप्यंतरित किया गया है; विशेषतः וְיוֹחָנָן का रूप ‘योहानान’ है, ‘योनातान’ नहीं।
- source_word: כְּתוּבִים
  choice: दर्ज किया गया
  rationale: כתב का निष्क्रिय कृदंत लिखित अभिलेख या सूची में नाम दर्ज होने को व्यक्त करता है; वंशावली-प्रशासनिक प्रसंग में ‘दर्ज किया गया’ स्वाभाविक है।
- source_word: רָאשֵׁי אָבוֹת
  choice: पितृकुलों के मुखियाओं
  rationale: यह वंशावली और प्रशासन से जुड़ा तकनीकी पद है; ‘पितृकुल’ पैतृक वंश पर आधारित विस्तृत परिवार-इकाई को व्यक्त करता है।
- source_word: וְהַכֹּהֲנִים
  choice: और याजकों को भी
  rationale: इब्रानी में क्रिया लुप्त है, इसलिए हिन्दी में पूर्ववर्ती ‘दर्ज किया गया’ को दोहराकर आशय स्पष्ट किया गया है।
- source_word: עַל מַלְכוּת
  choice: के शासनकाल में
  rationale: राजकीय काल-निर्धारण के इस प्रयोग में עַל מַלְכוּת को स्वाभाविक हिन्दी में ‘शासनकाल में’ कहा गया है; इसे ‘तक’ बनाकर समय-सीमा जोड़ने से बचा गया है।
- source_word: דָּרְיָוֶשׁ הַפָּרְסִי
  choice: फ़ारसी दारा
  rationale: जातीय विशेषण और राजकीय नाम को हिन्दी के स्वाभाविक क्रम में रखा गया है; ‘दारा’ इस नाम का प्रचलित हिन्दी रूप है।
