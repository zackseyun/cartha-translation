translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। प्रशासनिक-वंशावली प्रसंग के कारण ‘दर्ज किया गया’ और ‘पितृकुलों के मुखिया’ चुने गए हैं। इब्रानी की लुप्त क्रिया को हिन्दी में याजकों के साथ दोहराया गया है, ताकि वाक्य अस्पष्ट न हो; मूल का कालगत संबंध ‘शासनकाल में’ के रूप में सुरक्षित रखा गया है।
