source:
  edition: WLC
  text: וְֽ/אֶחָ֡י/ו שְֽׁמַעְיָ֡ה וַ/עֲזַרְאֵ֡ל מִֽלֲלַ֡י גִּֽלֲלַ֡י מָעַ֞י נְתַנְאֵ֤ל וִֽ/יהוּדָה֙ חֲנָ֔נִי בִּ/כְלֵי שִׁ֥יר דָּוִ֖יד אִ֣ישׁ הָ/אֱלֹהִ֑ים וְ/עֶזְרָ֥א הַ/סּוֹפֵ֖ר לִ/פְנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/036.yaml
  text: and his brothers—Shemaiah[a], Azarel, Milalai, Gilalai, Maai, Nethanel, Judah, and Hanani—with the musical instruments of David the man of God, and Ezra the scribe before them.
translation:
  language: hi
  text: और उसके भाई शमायाह, अज़रेल, मिललै, गिललै, माई, नतनेल, यहूदा और हनानी परमेश्वर के जन दाऊद के संगीत-वाद्यों[a] के साथ थे; और एज्रा शास्त्री उनके आगे था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “गीत के वाद्यों के साथ।”
    reason: बִּכְלֵי שִׁיר के शाब्दिक/शब्दकोशीय वैकल्पिक अर्थ को दर्शाता है।
lexical_decisions:
- source_word: וְאֶחָיו
  choice: और उसके भाई
  rationale: अֶחָיו का मूल अर्थ ‘उसके भाई’ है। यहाँ यह उसी लेवीय समूह के निकट साथियों को भी सूचित कर सकता है, पर मूल संबंध-संज्ञा को बनाए रखा गया है।
- source_word: שְׁמַעְיָה ... חֲנָנִי
  choice: शमायाह, अज़रेल, मिललै, गिललै, माऐ, नतनेल, यहूदा और हनानी
  rationale: व्यक्तिनामों का अर्थानुवाद न करके हिन्दी में स्रोत के निकट लिप्यंतरण किया गया है।
- source_word: בִּכְלֵי שִׁיר
  choice: संगीत-वाद्यों के साथ
  rationale: כְּלֵי का अर्थ उपकरण/वाद्य और שִׁיר का अर्थ गीत/संगीत है; ‘संगीत-वाद्य’ आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: דָּוִיד אִישׁ הָאֱלֹהִים
  choice: परमेश्वर के जन दाऊद के
  rationale: यह पदबंध वाद्यों को दाऊद से जोड़ता है और दाऊद को प्रचलित बाइबलीय सम्मानसूचक उपाधि ‘परमेश्वर का जन’ देता है। हिन्दी वाक्यक्रम के अनुसार इसे ‘परमेश्वर के जन दाऊद के’ रखा गया है।
- source_word: וְעֶזְרָא הַסּוֹפֵר
  choice: और शास्त्री एज्रा
  rationale: וְ का सामान्य समन्वय ‘और’ से और הַסּוֹפֵר का पदनाम ‘शास्त्री’ से व्यक्त किया गया है।
- source_word: לִפְנֵיהֶם
  choice: उनके आगे
  rationale: जुलूस के संदर्भ में यह स्थानगत अर्थ स्पष्ट करता है कि एज्रा समूह के सामने चल रहा था।
theological_decisions:
- issue: אִישׁ הָאֱלֹהִים की सम्मानसूचक उपाधि
  choice: परमेश्वर का जन
  alternative: परमेश्वर का मनुष्य
  rationale: ‘परमेश्वर का जन’ हिन्दी बाइबलीय प्रयोग में स्वाभाविक सम्मानसूचक पद है और स्रोत के अंतर्पाठीय संबंध को बनाए रखता है, जबकि ‘मनुष्य’ यहाँ असहज है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज गद्य। नामों को स्रोत-सन्निकट रूप में रखा गया है। इब्रानी में क्रिया निहित होने के कारण हिन्दी की स्पष्टता हेतु ‘थे’ और ‘था’ जोड़े गए हैं; अर्धविराम एज्रा की अग्रस्थान वाली सूचना को सूची से स्पष्ट करता है।
