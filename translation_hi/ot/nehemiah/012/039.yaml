base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/039.yaml
  text: and above the Gate of Ephraim[a], and above the Old Gate, and above the Fish Gate, and the Tower of Hananel, and the Tower of the Hundred, and as far as the Sheep Gate[b]; and they stood at the Gate of the Guard.
translation:
  language: hi
  text: और वे एप्रैम फाटक के ऊपर से, पुराने फाटक[a] के ऊपर से, मछली फाटक के ऊपर से, हननेल की मीनार और सौ की मीनार के ऊपर से होते हुए भेड़ फाटक तक गए; फिर वे पहरे के फाटक[b] पर खड़े हो गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यशाना फाटक।” इब्रानी शब्द को स्थान-नाम के रूप में भी समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “चौकी का फाटक” अथवा “बंदीगृह का फाटक।” इब्रानी शब्द पहरे, चौकी या बंदी रखने की जगह को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵעַל לְשַׁעַר אֶפְרַיִם
  choice: एप्रैम फाटक के ऊपर से
  rationale: מֵעַל में ऊँचाई और ऊपर से होकर जाने का भाव है। नगर की दीवार पर चल रहे जुलूस के संदर्भ में यह स्वाभाविक और स्थलाकृतिक रूप से उपयुक्त है।
- source_word: שַׁעַר הַיְשָׁנָה
  choice: पुराना फाटक
  rationale: הַיְשָׁנָה का सीधा अर्थ ‘पुराना’ है। स्थान के नाम को अनावश्यक विस्तार दिए बिना यही सबसे पारदर्शी अनुवाद है।
- source_word: שַׁעַר הַדָּגִים
  choice: मछली फाटक
  rationale: यह ‘मछलियों का फाटक’ का संक्षिप्त नाम है; ‘मछली फाटक’ आधुनिक हिन्दी में स्थान-नाम के रूप में सहज है।
- source_word: מִגְדַּל חֲנַנְאֵל
  choice: हननेल का गुम्मट
  rationale: מִגְדָּל नगर-दीवार के बुर्ज या गुम्मट को दर्शाता है। ‘गुम्मट’ बाइबलीय नगर-रचना के संदर्भ में प्रचलित और समझने योग्य है, और חֲנַנְאֵל को व्यक्तिवाचक नाम के रूप में रखा गया है।
- source_word: מִגְדַּל הַמֵּאָה
  choice: सौ का गुम्मट
  rationale: ‘सौ’ का सटीक संकेत अनिश्चित है, इसलिए व्याख्यात्मक विस्तार किए बिना इब्रानी संरचना और अस्पष्टता सुरक्षित रखी गई है।
- source_word: וְעַד שַׁעַר הַצֹּאן
  choice: भेड़ फाटक तक
  rationale: עַד मार्ग की सीमा या अंतिम बिंदु बताता है; ‘तक’ इसे संक्षेप और स्पष्टता से व्यक्त करता है।
- source_word: וְעָמְדוּ
  choice: खड़े हो गए
  rationale: עמד का मूल अर्थ ‘खड़ा होना’ है। यह जुलूस के वहाँ रुकने का भाव भी दे सकता है, पर मुख्य पाठ में अधिक प्रत्यक्ष अर्थ रखा गया है।
- source_word: בְּשַׁעַר הַמַּטָּרָה
  choice: पहरे के फाटक पर
  rationale: מַטָּרָה पहरे, चौकसी या बंदीगृह से संबंधित स्थान को सूचित कर सकता है। ‘पहरे का फाटक’ सुरक्षा-संबंधी अर्थ को रखते हुए किसी एक अनिश्चित पहचान पर अधिक बल नहीं देता।
