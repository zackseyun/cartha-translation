source:
  edition: WLC
  text: וַ/יִּזְבְּח֣וּ בַ/יּוֹם הַ֠/הוּא זְבָחִ֨ים גְּדוֹלִ֜ים וַ/יִּשְׂמָ֗חוּ כִּ֤י הָ/אֱלֹהִים֙ שִׂמְּחָ/ם֙ שִׂמְחָ֣ה גְדוֹלָ֔ה וְ/גַ֧ם הַ/נָּשִׁ֛ים וְ/הַ/יְלָדִ֖ים שָׂמֵ֑חוּ וַ/תִּשָּׁמַ֛ע שִׂמְחַ֥ת יְרוּשָׁלִַ֖ם מֵ/רָחֽוֹק־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/043.yaml
  text: On that day they offered great sacrifices and rejoiced[a], because God had made them rejoice with great joy. Also the women and the children rejoiced[d][c][b], and the joy of Jerusalem was heard from far away.
translation:
  language: hi
  text: उस दिन उन्होंने बड़े बलिदान चढ़ाए और आनन्द मनाया, क्योंकि परमेश्वर ने उन्हें बहुत आनन्दित किया था। स्त्रियों[a] और बच्चों ने भी आनन्द मनाया, और यरूशलेम का आनन्द दूर तक सुनाई दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘स्त्रियाँ’ का अनुवाद ‘पत्नियाँ’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבְּחוּ זְבָחִים גְּדוֹלִים
  choice: उन्होंने बड़े बलिदान चढ़ाए
  rationale: ज़בח और उसके सजातीय कर्म का अर्थ बलिदान करना/चढ़ाना है। हिन्दी में ‘बलिदान चढ़ाए’ स्वाभाविक धार्मिक अभिव्यक्ति है और अनावश्यक पुनरुक्ति से बचते हुए मूल अर्थ रखती है; ‘बड़े’ मूल के גְּדוֹלִים को जानबूझकर व्यापक रखता है।
- source_word: וַיִּשְׂמָחוּ / שָׂמֵחוּ
  choice: आनन्द मनाया
  rationale: दोनों रूपों में एक ही שׂמח धातु है। समान हिन्दी अभिव्यक्ति दोहराने से पद की शब्दगत एकता और सामुदायिक उत्सव का भाव बना रहता है।
- source_word: שִׂמְּחָם שִׂמְחָה גְדוֹלָה
  choice: उन्हें बड़े आनन्द से आनन्दित किया था
  rationale: यह अनुवाद पिएल क्रिया की कारकता—परमेश्वर ने उन्हें आनन्दित किया—और सजातीय संज्ञा की मूल पुनरुक्ति, दोनों को सुरक्षित रखता है।
- source_word: הַנָּשִׁים וְהַיְלָדִים
  choice: स्त्रियों और बच्चों
  rationale: נָשִׁים का अर्थ ‘स्त्रियाँ’ या प्रसंगानुसार ‘पत्नियाँ’ हो सकता है। यहाँ कोई संबंधसूचक पद न होने के कारण व्यापक अर्थ ‘स्त्रियाँ’ मुख्य पाठ में अधिक सुरक्षित है।
- source_word: וַתִּשָּׁמַע שִׂמְחַת יְרוּשָׁלִַם מֵרָחוֹק
  choice: यरूशलेम का आनन्द दूर तक सुनाई दिया
  rationale: निफ़अल का निष्क्रिय भाव ‘सुनाई दिया’ से व्यक्त होता है। हिन्दी में ‘दूर तक’ स्वाभाविक रूप से बताता है कि आनन्द की ध्वनि बहुत दूरी पर सुनी गई।
theological_decisions:
- issue: आनन्द में परमेश्वर की सक्रिय भूमिका
  choice: परमेश्वर ने उन्हें बड़े आनन्द से आनन्दित किया था
  alternative: परमेश्वर ने उन्हें बड़ा आनन्द दिया था
  rationale: मूल שִׂמְּחָם कारक क्रिया है; इसलिए परमेश्वर को केवल आनन्द देने वाला नहीं, बल्कि लोगों को आनन्दित करने वाला स्पष्ट कर्ता रखा गया है।
- issue: आनन्दित समुदाय का दायरा
  choice: स्त्रियों और बच्चों को स्पष्ट रूप से सम्मिलित रखा गया
  alternative: सभी लोगों ने आनन्द मनाया
  rationale: मूल पाठ इन समूहों का अलग उल्लेख करके उत्सव की व्यापकता पर बल देता है; सामान्य सामूहिक पद उस बल को मिटा देता।
- issue: यरूशलेम के आनन्द का संबंध
  choice: यरूशलेम का आनन्द
  alternative: यरूशलेम के लोगों का आनन्द
  rationale: सम्बन्धसूचक इब्रानी पद शहर अथवा उससे जुड़े समुदाय के आनन्द को सूचित कर सकता है। मुख्य पाठ में शाब्दिक संबंध बनाए रखने से अस्पष्टता अनावश्यक रूप से हल नहीं की जाती।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सहज गद्य। ‘आनन्द’ धातु-संबंधी पुनरुक्ति को बनाए रखता है, जबकि ‘बलिदान चढ़ाए’ सामान्य पाठक के लिए स्वाभाविक है। केवल वास्तविक अर्थगत अस्पष्टता—‘स्त्रियाँ/पत्नियाँ’—के लिए पादटिप्पणी दी गई है।
