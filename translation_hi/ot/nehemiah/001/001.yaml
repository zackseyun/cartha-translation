  text: דִּבְרֵ֥י נְחֶמְיָ֖ה בֶּן חֲכַלְיָ֑ה וַ/יְהִ֤י בְ/חֹֽדֶשׁ כסלו שְׁנַ֣ת עֶשְׂרִ֔ים וַ/אֲנִ֥י הָיִ֖יתִי בְּ/שׁוּשַׁ֥ן הַ/בִּירָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/001.yaml
  text: The words of Nehemiah son of Hacaliah[a]. Now it happened in the month of Kislev, in the twentieth year, while I was in Susa the citadel[c][b],
translation:
  language: hi
  text: हकल्याह के पुत्र नहेमायाह के वचन[a]। बीसवें वर्ष[b] के किसलेव महीने में, जब मैं शूशन के राज-दुर्ग[c] में था, तब ऐसा हुआ—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हकल्याह के पुत्र नहेमायाह का वृत्तांत।” इब्रानी शीर्षक “के वचन” किसी संस्मरण या कथात्मक अभिलेख का परिचय भी दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में केवल “बीसवें वर्ष” है। इस पद में यह स्पष्ट नहीं किया गया कि यह किस राजा के शासन का वर्ष था; आगे का संदर्भ अर्तक्षत्र की ओर संकेत करता है।
    reason: cultural_note
  - marker: c
    text: या, “शूशन के दुर्ग में।” इब्रानी शब्द एक किलेबंद राजकीय परिसर को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי
  choice: वचन
  rationale: यह इब्रानी शीर्षक किसी व्यक्ति के कथनों के साथ-साथ उसके लिखित वृत्तांत का भी परिचय दे सकता है। ‘वचन’ मूल मुहावरे को बनाए रखता है; व्यापक अर्थ को पादटिप्पणी स्पष्ट करती है।
- source_word: נְחֶמְיָה בֶּן חֲכַלְיָה
  choice: हकल्याह के पुत्र नहेमायाह
  rationale: नामों का देवनागरी में स्रोत-सन्निकट लिप्यंतरण किया गया है और בֶּן को स्वाभाविक हिन्दी संबंधसूचक रचना में रखा गया है।
- source_word: וַיְהִי
  choice: तब ऐसा हुआ
  rationale: यह कथात्मक सूत्र आगे आने वाली घटना की भूमिका बाँधता है। पद के अंत में दीर्घ विराम उस अपूर्ण भूमिका को अगले पद से जोड़ता है।
- source_word: בְחֹדֶשׁ כסלו
  choice: किसलेव महीने में
  rationale: महीने के इब्रानी नाम का लिप्यंतरण करते हुए हिन्दी की स्वाभाविक कालसूचक रचना अपनाई गई है।
- source_word: שְׁנַת עֶשְׂרִים
  choice: बीसवें वर्ष
  rationale: मूल पाठ केवल ‘बीसवाँ वर्ष’ कहता है; इस पद में राजा का नाम जोड़कर अस्पष्टता दूर नहीं की गई।
- source_word: וַאֲנִי הָיִיתִי
  choice: जब मैं ... में था
  rationale: यह खंड कथावाचक की उस समय की परिस्थिति बताता है; ‘जब’ हिन्दी में उसके कालगत संबंध को सहज रूप से व्यक्त करता है।
- source_word: בְשׁוּשַׁן
  choice: शूशन में
  rationale: स्थान-नाम का इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: הַבִּירָה
  choice: राजगढ़
  rationale: यह शब्द किलेबंद राजकीय परिसर को दर्शाता है। ‘राजगढ़’ दुर्ग और राजकीय केंद्र, दोनों भावों को संक्षेप में व्यक्त करता है।
theological_decisions:
- issue: ‘बीसवें वर्ष’ का संदर्भ
  choice: मुख्य पाठ में राजा का नाम नहीं जोड़ा गया
  alternative: ‘राजा अर्तक्षत्र के शासन के बीसवें वर्ष’
  rationale: इस पद का इब्रानी पाठ यह स्पष्ट नहीं करता कि यह किसका बीसवाँ वर्ष है। बाद का संदर्भ पहचान में सहायता करता है, पर उसे यहाँ मूल पाठ में जोड़ना वास्तविक अस्पष्टता को मिटा देता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। शीर्षकीय ‘वचन’ को बनाए रखते हुए उसके व्यापक साहित्यिक अर्थ को पादटिप्पणी में दिया गया है। कथात्मक सूत्र को हिन्दी वाक्य-विन्यास में अंत में रखा गया है, और दीर्घ विराम यह दिखाता है कि घटना का विवरण अगले पद में जारी है।
