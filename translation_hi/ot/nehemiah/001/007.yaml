  text: חֲבֹ֖ל חָבַ֣לְנוּ לָ֑/ךְ וְ/לֹא שָׁמַ֣רְנוּ אֶת הַ/מִּצְוֺ֗ת וְ/אֶת הַֽ/חֻקִּים֙ וְ/אֶת הַ/מִּשְׁפָּטִ֔ים אֲשֶׁ֥ר צִוִּ֖יתָ אֶת מֹשֶׁ֥ה עַבְדֶּֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/007.yaml
  text: We have acted very corruptly against you and have not kept the commandments[a], the statutes[b], and the judgments that you commanded your servant Moses.
translation:
  language: hi
  text: हमने आपके विरुद्ध अत्यन्त भ्रष्ट आचरण किया है और उन आज्ञाओं, विधियों और न्याय-विधानों[a] का पालन नहीं किया, जिनकी आज्ञा आपने अपने सेवक मूसा को दी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘न्याय-विधानों’ का अनुवाद ‘न्याय-संबंधी नियमों’ या ‘कानूनी निर्णयों’ के रूप में भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲבֹל חָבַלְנוּ
  choice: हमने ... बहुत भ्रष्ट आचरण किया है
  rationale: धातु की infinitive absolute और finite verb वाली रचना क्रिया पर विशेष बल देती है। ‘बहुत भ्रष्ट आचरण किया है’ उस तीव्रता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: לָךְ
  choice: आपके विरुद्ध
  rationale: इस पश्चात्तापपूर्ण संदर्भ में संबंध-विच्छेद और परमेश्वर के प्रति किए गए अपराध का भाव है; इसलिए केवल ‘आपके साथ’ की अपेक्षा ‘आपके विरुद्ध’ अधिक स्पष्ट है।
- source_word: וְלֹא שָׁמַרְנוּ
  choice: पालन नहीं किया
  rationale: आज्ञाओं के साथ שׁמר का अर्थ उन्हें मानना या उनका पालन करना है। आधुनिक हिन्दी में ‘पालन करना’ सहज और सटीक है।
- source_word: הַמִּצְוֺת
  choice: आज्ञाओं
  rationale: यह शब्द आदेश के रूप में दिए गए दायित्वों को दर्शाता है; ‘आज्ञाएँ’ वाचा और व्यवस्था के प्रसंग के लिए उपयुक्त है।
- source_word: הַחֻקִּים
  choice: विधियों
  rationale: यह निर्धारित और स्थापित नियमों या अधिनियमों को सूचित करता है। ‘विधियाँ’ कानूनी अर्थ बनाए रखते हुए अन्य दो पदों से भेद भी रखता है।
- source_word: הַמִּשְׁפָּטִים
  choice: न्याय-विधानों
  rationale: यह कानूनी निर्णयों, न्याय-संबंधी नियमों या प्रकरण-विधियों को दर्शा सकता है। ‘न्याय-विधान’ न्यायिक आयाम को बनाए रखता और ‘विधियों’ से पर्याप्त भेद करता है।
- source_word: אֲשֶׁר צִוִּיתָ
  choice: जिन्हें आपने ... दिया था
  rationale: हिन्दी में ‘आज्ञाएँ, विधियाँ और न्याय-विधान दिए’ स्वाभाविक है और मूल के ‘आदेश दिया’ वाले अधिकारपूर्ण भाव को संदर्भ में सुरक्षित रखता है।
- source_word: עַבְדֶּךָ
  choice: अपने सेवक
  rationale: मूसा के लिए ‘सेवक’ परमेश्वर से उसके संबंध और नियुक्त सेवा को गरिमापूर्ण तथा प्रसंगानुकूल ढंग से व्यक्त करता है।
theological_decisions:
- issue: तोरा से जुड़े तीन अलग कानूनी पदों का अनुवाद
  choice: आज्ञाओं, विधियों और न्याय-विधानों
  alternative: आदेशों, विधानों और नियमों
  rationale: मूल इब्रानी के तीन विशिष्ट पदों को एक सामान्य शब्द में समेटने के बजाय हिन्दी में उनका यथासंभव अलग कानूनी स्वर सुरक्षित रखा गया है; इससे किसी संकीर्ण धर्मसैद्धांतिक वर्गीकरण को आरोपित किए बिना वाचा-व्यवस्था की बनावट बनी रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; प्रार्थना के संदर्भ के अनुरूप आदरार्थक ‘आप’ और गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध कानूनी शब्दावली। मूल की बलात्मक रचना को ‘बहुत’ से व्यक्त किया गया है।
