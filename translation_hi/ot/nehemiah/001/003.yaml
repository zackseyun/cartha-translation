  text: וַ/יֹּאמְרוּ֮ לִ/י֒ הַֽ/נִּשְׁאָרִ֞ים אֲשֶֽׁר נִשְׁאֲר֤וּ מִן הַ/שְּׁבִי֙ שָׁ֣ם בַּ/מְּדִינָ֔ה בְּ/רָעָ֥ה גְדֹלָ֖ה וּ/בְ/חֶרְפָּ֑ה וְ/חוֹמַ֤ת יְרוּשָׁלִַ֨ם֙ מְפֹרָ֔צֶת וּ/שְׁעָרֶ֖י/הָ נִצְּת֥וּ בָ/אֵֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/003.yaml
  text: And they said to me[a], “The remnant there in the province who survived the captivity are in great trouble and disgrace, and the wall of Jerusalem is broken down[b], and its gates have been burned with fire.”
translation:
  language: hi
  text: उन्होंने मुझसे कहा, “जो बचे हुए लोग बंधुआई से बचे रह गए हैं, वे वहाँ प्रान्त में बड़ी विपत्ति और अपमान में हैं। यरूशलेम की दीवार टूटी पड़ी है, और उसके फाटक आग में जला दिए गए हैं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנִּשְׁאָרִים אֲשֶׁר נִשְׁאֲרוּ מִן הַשְּׁבִי
  choice: जो बचे हुए लोग बंधुआई से लौटकर ... रह रहे हैं
  rationale: שׁאר की पुनरावृत्ति बचे हुए समुदाय पर बल देती है। हिन्दी में शाब्दिक पुनरावृत्ति असहज होती; ‘बचे हुए लोग’ सामूहिक अर्थ देता है। מן השבי को प्रसंगानुसार बंधुआई से लौटे लोगों के रूप में व्यक्त किया गया है, बिना ‘निर्वासन’ को मुख्य पाठ में थोपे।
- source_word: בַּמְּדִינָה
  choice: उस प्रान्त में
  rationale: फ़ारसी काल में מְדִינָה प्रशासनिक प्रान्त को सूचित करता है; ‘प्रान्त’ इसका स्वाभाविक ऐतिहासिक हिन्दी समतुल्य है।
- source_word: בְּרָעָה גְדֹלָה
  choice: बड़ी विपत्ति में
  rationale: यहाँ רָעָה नैतिक बुराई नहीं, बल्कि गंभीर दुर्दशा या संकट है। ‘बड़ी विपत्ति’ अर्थ को स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: וּבְחֶרְפָּה
  choice: और अपमान में
  rationale: חֶרְפָּה सार्वजनिक लज्जा, निन्दा या तिरस्कार की दशा को दर्शाता है; आधुनिक हिन्दी में ‘अपमान’ सहज और व्यापक है।
- source_word: חוֹמַת יְרוּשָׁלִַם מְפֹרָצֶת
  choice: यरूशलेम की शहरपनाह टूटी पड़ी है
  rationale: מְפֹרָצֶת दीवार के तोड़े या भेदे जाने और उसकी वर्तमान टूटी दशा को दर्शाता है। ‘शहरपनाह’ नगर की रक्षात्मक दीवार को स्पष्ट करता है।
- source_word: וּשְׁעָרֶיהָ נִצְּתוּ בָאֵשׁ
  choice: उसके फाटक आग से जला दिए गए हैं
  rationale: निफ़अल रूप आग द्वारा जलाए जाने को व्यक्त करता है; हिन्दी पूर्ण वर्तमान उस घटना के बने हुए परिणाम को सामने रखता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, कथात्मक और गरिमापूर्ण रूप। ‘शहरपनाह’ बाइबलीय नगर की रक्षात्मक दीवार के लिए सटीक है। कोई पादटिप्पणी नहीं दी गई, क्योंकि उपलब्ध अंग्रेज़ी पादटिप्पणियों के चिह्न मुख्य पाठ से असंगत दिखाई देते हैं और इब्रानी पाठ का अर्थ मुख्य हिन्दी अनुवाद में पर्याप्त रूप से व्यक्त है।
