source:
  edition: WLC
  text: וַ/יְהִ֞י כְּ/שָׁמְעִ֣/י אֶת הַ/דְּבָרִ֣ים הָ/אֵ֗לֶּה יָשַׁ֨בְתִּי֙ וָֽ/אֶבְכֶּ֔ה וָ/אֶתְאַבְּלָ֖/ה יָמִ֑ים וָֽ/אֱהִ֥י צָם֙ וּ/מִתְפַּלֵּ֔ל לִ/פְנֵ֖י אֱלֹהֵ֥י הַ/שָּׁמָֽיִם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/004.yaml
  text: And when I heard these words[a], I sat down and wept and mourned for days[b], and I was fasting and praying before the God of heaven.
translation:
  language: hi
  text: जब मैंने ये बातें[a] सुनीं, तब मैं बैठ गया, रोया और दिनों तक शोक मनाता रहा; और मैं स्वर्ग के परमेश्वर के सामने उपवास और प्रार्थना करता रहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘ये शब्द’ अथवा ‘ये मामले।’ इब्रानी דְּבָרִים का अर्थ ‘शब्द,’ ‘बातें,’ या ‘मामले’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּשָׁמְעִי
  choice: जब मैंने ... सुनीं, तब
  rationale: यह सामान्य इब्रानी कथात्मक-कालवाचक रचना है। हिंदी में ‘जब...तब’ क्रम और समय-संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: ये बातें
  rationale: דְּבָרִים का अर्थ ‘शब्द,’ ‘बातें,’ या ‘मामले’ हो सकता है। प्रसंग में यह पहले बताए गए समाचार की विषय-वस्तु को सूचित करता है; ‘बातें’ हिंदी में अर्थ की इस व्यापकता को सहजता से बनाए रखता है।
- source_word: יָשַׁבְתִּי
  choice: मैं बैठ गया
  rationale: ישׁב का मूल अर्थ ‘बैठना’ है; यहाँ ‘बैठ गया’ तत्काल शारीरिक प्रतिक्रिया को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: וָאֶבְכֶּה
  choice: रोने लगा
  rationale: בכה का अर्थ ‘रोना’ है। ‘रोने लगा’ क्रम में आरंभ हुई भावनात्मक प्रतिक्रिया को सहज रूप से व्यक्त करता है, बिना अतिरिक्त कारण जोड़े।
- source_word: וָאֶתְאַבְּלָה יָמִים
  choice: मैं कई दिनों तक शोक मनाता रहा
  rationale: אבל 지속 या विधिवत शोक को व्यक्त करता है और יָמִים अवधि बताता है। ‘कई दिनों तक’ हिंदी में अनिश्चित बहुवचन अवधि को स्वाभाविक बनाता है।
- source_word: וָאֱהִי צָם וּמִתְפַּלֵּל
  choice: उपवास करते हुए ... प्रार्थना करता रहा
  rationale: היה के साथ कृदंत चलती या दीर्घकालिक क्रिया दर्शाते हैं। यह हिंदी रचना उपवास और प्रार्थना की निरंतरता को बनाए रखती है।
- source_word: לִפְנֵי
  choice: के सामने
  rationale: לִפְנֵי का अर्थ ‘के सामने’ या ‘की उपस्थिति में’ है। प्रार्थना के संदर्भ में ‘के सामने’ संक्षिप्त, स्पष्ट और स्वाभाविक है।
- source_word: אֱלֹהֵי הַשָּׁמָיִם
  choice: स्वर्ग के परमेश्वर
  rationale: यह एज्रा-नहेमायाह में प्रयुक्त ईश्वरीय उपाधि है। ‘स्वर्ग के परमेश्वर’ मूल संबंधवाचक रचना को स्पष्ट रूप से सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय उपाधि אֱלֹהֵי הַשָּׁמָיִם का अनुवाद
  choice: स्वर्ग के परमेश्वर
  alternative: आकाश के परमेश्वर
  rationale: यहाँ इस्राएल के परमेश्वर की उपाधि है, YHWH नाम नहीं। इसलिए मूल में अनुपस्थित वाचा-नाम को जोड़े बिना उपाधि का सीधा अनुवाद किया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली रखी गई है। क्रियाओं के दीर्घकालिक रूप शोक, उपवास और प्रार्थना की निरंतरता दर्शाते हैं; मूल की अस्पष्टता ‘बातें’ और पादटिप्पणी द्वारा सुरक्षित है।
