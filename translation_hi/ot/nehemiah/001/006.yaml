source:
  edition: WLC
  text: תְּהִ֣י נָ֣א אָזְנְ/ךָֽ קַשֶּׁ֣בֶת וְֽ/עֵינֶ֪י/ךָ פְתֻוּח֟וֹת לִ/שְׁמֹ֣עַ אֶל תְּפִלַּ֣ת עַבְדְּ/ךָ֡ אֲשֶׁ֣ר אָנֹכִי֩ מִתְפַּלֵּ֨ל לְ/פָנֶ֤י/ךָ הַ/יּוֹם֙ יוֹמָ֣ם וָ/לַ֔יְלָה עַל בְּנֵ֥י יִשְׂרָאֵ֖ל עֲבָדֶ֑י/ךָ וּ/מִתְוַדֶּ֗ה עַל חַטֹּ֤אות בְּנֵֽי יִשְׂרָאֵל֙ אֲשֶׁ֣ר חָטָ֣אנוּ לָ֔/ךְ וַ/אֲנִ֥י וּ/בֵית אָבִ֖/י חָטָֽאנוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/006.yaml
  text: Please let your ear be attentive and your eyes open to hear the prayer of your servant that I am now praying before you day and night, for the sons of Israel, your servants, while confessing the sins of the sons of Israel that we have sinned against you. I and my father's house have sinned.
translation:
  language: hi
  text: कृपा करके, तेरा कान लगा रहे और तेरी आँखें खुली रहें, ताकि तू अपने दास की उस प्रार्थना को सुने जो मैं आज दिन-रात तेरे सामने इस्राएल की संतानों, तेरे दासों, के लिए कर रहा हूँ और इस्राएल की संतानों के उन पापों को स्वीकार कर रहा हूँ जो हमने तेरे विरुद्ध किए हैं। मैं और मेरे पिता का घराना पाप कर चुके हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְּהִי נָא אָזְנְךָ קַשֶּׁבֶת
  choice: कृपया अपना कान लगाए रख
  rationale: नָא सहित इच्छार्थक रूप विनम्र विनती व्यक्त करता है। यह हिंदी प्रयोग प्रार्थना के स्वर और एकवचन ‘कान’ की मानवरूपी छवि को स्वाभाविक ढंग से बनाए रखता है।
- source_word: וְעֵינֶיךָ פְתֻוּחוֹת
  choice: और अपनी आँखें खुली रख
  rationale: बहुवचन ‘आँखें’ और ‘खुली’ रहने की अवस्था को समानांतर, सहज हिंदी में सुरक्षित रखा गया है।
- source_word: לִשְׁמֹעַ אֶל תְּפִלַּת עַבְדְּךָ
  choice: ताकि तू अपने दास की उस प्रार्थना को सुने
  rationale: שׁמע को ‘सुने’ और עבד को श्रद्धापूर्ण प्रार्थना-संदर्भ में ‘दास’ कहा गया है; संबंधवाचक उपवाक्य के कारण ‘उस’ हिंदी वाक्य को स्पष्ट बनाता है।
- source_word: אֲשֶׁר אָנֹכִי מִתְפַּלֵּל לְפָנֶיךָ הַיּוֹם יוֹמָם וָלַיְלָה
  choice: जो मैं आज दिन-रात तेरे सामने ... कर रहा हूँ
  rationale: कृदंत की जारी क्रिया को ‘कर रहा हूँ,’ לְפָנֶיךָ को ‘तेरे सामने,’ הַיּוֹם को ‘आज,’ और יוֹמָם וָלַיְלָה को स्वाभाविक ‘दिन-रात’ से व्यक्त किया गया है।
- source_word: עַל בְּנֵי יִשְׂרָאֵל עֲבָדֶיךָ
  choice: इस्राएल की संतान, तेरे दासों, के लिए
  rationale: עַל यहाँ मध्यस्थ प्रार्थना के अर्थ में ‘के लिए’ है। בְּנֵי יִשְׂרָאֵל की वंशगत-पारिवारिक अभिव्यक्ति ‘इस्राएल की संतान’ में बनी रहती है और स्त्री-पुरुष पूरे समुदाय को समेटती है।
- source_word: וּמִתְוַדֶּה עַל חַטֹּאות
  choice: मैं ... पापों को स्वीकार करता हूँ
  rationale: समन्वित कृदंत जारी और साथ-साथ होने वाली अंगीकार की क्रिया बताता है। हिंदी में नया वाक्य अर्थ को स्पष्ट करता है, जबकि ‘पाप’ नैतिक और धार्मिक भार बनाए रखता है।
- source_word: אֲשֶׁר חָטָאנוּ לָךְ
  choice: जो हमने तेरे विरुद्ध किए हैं
  rationale: לָךְ इस प्रसंग में अपराध की दिशा ‘तेरे विरुद्ध’ व्यक्त करता है; पूर्ण क्रिया को ‘किए हैं’ से प्रस्तुत किया गया है।
- source_word: וַאֲנִי וּבֵית אָבִי חָטָאנוּ
  choice: मैंने और मेरे पिता के घराने ने भी पाप किया है
  rationale: ‘पिता का घराना’ परिवार और वंश-समूह दोनों की प्राचीन संकल्पना को रखता है। ‘भी’ नहेमायाह और उसके घराने को सामूहिक दोषस्वीकार में सम्मिलित करता है, बिना अनावश्यक जोर जोड़े।
theological_decisions:
- issue: परमेश्वर के लिए मानवरूपी भाषा—‘कान’ और ‘आँखें’
  choice: शारीरिक अंगों की मूल प्रार्थनात्मक छवि को सीधे बनाए रखा गया
  alternative: ‘मेरी ओर ध्यान दे’ जैसे अमूर्त कथन में बदलना
  rationale: इब्रानी पाठ परमेश्वर की सजगता को जानबूझकर सजीव शारीरिक बिंबों से व्यक्त करता है; अनुवाद इस आलंकारिक भाषा को मिटाता नहीं है।
- issue: בְּנֵי יִשְׂרָאֵל का सामुदायिक अर्थ
  choice: इस्राएल की संतान
  alternative: इस्राएली; इस्राएल के पुत्र
  rationale: ‘संतान’ मूल की पारिवारिक-वाचा संबंधी छवि को बनाए रखते हुए पूरे समुदाय को स्वाभाविक आधुनिक हिंदी में व्यक्त करती है। ‘पुत्र’ अधिक शब्दशः है, पर हिंदी में केवल पुरुषों का भ्रामक संकेत दे सकता है।
- issue: नहेमायाह की व्यक्तिगत और पारिवारिक दोष-स्वीकृति
  choice: ‘मैंने और मेरे पिता के घराने ने भी’ के रूप में सामूहिक स्वीकार
  alternative: ‘यहाँ तक कि मैंने...’ जैसे प्रबल जोर के साथ
  rationale: וַאֲנִי में सहभागिता है, पर स्पष्ट बलवाचक अव्यय नहीं; इसलिए अनुवाद उसे पश्चात्ताप की सामूहिकता में रखता है, अतिरिक्त जोर नहीं थोपता।
translation_notes:
  register: आधुनिक, आदरपूर्ण और प्रार्थनात्मक हिंदी। परमेश्वर के लिए एकवचन निकट संबोधन ‘तू/तेरे’ रखा गया है, जो बाइबिलीय प्रार्थना में आत्मीयता और प्रत्यक्षता व्यक्त करता है। वाक्य-विन्यास को पठनीय बनाने के लिए लंबे इब्रानी वाक्य को दो भागों में बाँटा गया है, पर जारी प्रार्थना और पाप-स्वीकार का संबंध सुरक्षित है।
