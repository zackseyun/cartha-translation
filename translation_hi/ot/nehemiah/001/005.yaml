id: NEH.1.5
reference: Nehemiah 1:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וָ/אֹמַ֗ר אָֽנָּ֤א יְהוָה֙ אֱלֹהֵ֣י הַ/שָּׁמַ֔יִם הָ/אֵ֥ל הַ/גָּד֖וֹל וְ/הַ/נּוֹרָ֑א שֹׁמֵ֤ר הַ/בְּרִית֙ וָ/חֶ֔סֶד לְ/אֹהֲבָ֖י/ו וּ/לְ/שֹׁמְרֵ֥י מִצְוֺתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/005.yaml
  text: And I said[a], “Please, O Yahweh, God of heaven, the great and awesome God[b], who keeps the covenant and steadfast love for those who love him and keep his commandments,”
translation:
  language: hi
  text: तब मैंने कहा, “हे यहोवा, स्वर्ग के परमेश्वर, महान और भययोग्य परमेश्वर, मैं विनती करता हूँ, जो उन लोगों के लिए वाचा और अटल प्रेम बनाए रखता है जो तुझसे प्रेम करते हैं और तेरी आज्ञाओं का पालन करते हैं,”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֹמַר
  choice: तब मैंने कहा
  rationale: वय्यिक़्तोल रूप कथा के क्रम में नहेमायाह की प्रार्थना का आरंभ करता है; ‘तब’ आधुनिक हिन्दी में क्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אָנָּא
  choice: कृपया सुन
  rationale: यह विनय और अनुनय प्रकट करने वाला प्रार्थनात्मक निपात है। हिन्दी में केवल ‘कृपया’ अधूरा लगता है, इसलिए ‘सुन’ निहित विनती को स्वाभाविक रूप देता है, बिना आगे के पद की सामग्री जोड़े।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि ‘प्रभु’ से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है।
- source_word: אֱלֹהֵי הַשָּׁמַיִם
  choice: स्वर्ग के परमेश्वर
  rationale: समासिक पद का सीधा और हिन्दी में स्वाभाविक रूप।
- source_word: הָאֵל הַגָּדוֹל וְהַנּוֹרָא
  choice: महान और भययोग्य परमेश्वर
  rationale: נוֹרָא उस व्यक्ति को बताता है जो श्रद्धामिश्रित भय उत्पन्न करता है; ‘भययोग्य’ इस अर्थ को ‘भयानक’ की नकारात्मक कठोरता के बिना सुरक्षित रखता है।
- source_word: שֹׁמֵר הַבְּרִית וָחֶסֶד
  choice: वाचा और अटल प्रेम बनाए रखता है
  rationale: שֹׁמֵר का निरंतर चरित्रसूचक कृदन्तीय भाव और वाचा-संदर्भ में חֶסֶד का स्थिर, निष्ठावान प्रेम दोनों व्यक्त होते हैं।
- source_word: לְאֹהֲבָיו וּלְשֹׁמְרֵי מִצְוֺתָיו
  choice: उन लोगों के लिए ... जो तुझसे प्रेम करते और तेरी आज्ञाओं का पालन करते हैं
  rationale: दो समानांतर कृदन्तीय पदों को स्वाभाविक हिन्दी संबंधवाचक वाक्य में रखा गया है; לְ का हितग्राही भाव ‘के लिए’ से स्पष्ट किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में व्यक्तिगत वाचा-नाम है। हिन्दी पाठकों में पहचाने जाने वाले ‘यहोवा’ को चुनकर नाम को किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- issue: वाचा-संदर्भ में חֶסֶד
  choice: अटल प्रेम
  alternative: करुणा; वाचा की निष्ठा; अटल कृपा
  rationale: ‘अटल प्रेम’ शब्द के प्रेमपूर्ण और स्थायी/निष्ठावान दोनों आयामों को सामान्य आधुनिक हिन्दी में रखता है; ‘वाचा की निष्ठा’ संभावित अर्थ को अधिक स्पष्ट करके सीमित कर देती।
- issue: הַנּוֹרָא में भय और विस्मय का तनाव
  choice: भययोग्य
  alternative: विस्मयकारी; भयानक
  rationale: यह चयन श्रद्धापूर्ण भय को बनाए रखता है। ‘विस्मयकारी’ भय का पक्ष कमजोर कर सकता है और ‘भयानक’ अनावश्यक रूप से आतंककारी अर्थ दे सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, प्रार्थनात्मक और गरिमापूर्ण शैली। परमेश्वर को प्रत्यक्ष संबोधन होने के कारण एकवचन आत्मीय-सम्मानसूचक ‘तू/तेरी/तुझसे’ रखा गया है। पद मूल में अगले वाक्य तक चलने वाली प्रार्थना की भूमिका है, फिर भी हिन्दी उद्धरण को इस इकाई में विराम दिया गया है।
