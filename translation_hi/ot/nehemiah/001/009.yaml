language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/שַׁבְתֶּ֣ם אֵלַ֔/י וּ/שְׁמַרְתֶּם֙ מִצְוֺתַ֔/י וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם אִם יִהְיֶ֨ה נִֽדַּחֲ/כֶ֜ם בִּ/קְצֵ֤ה הַ/שָּׁמַ֨יִם֙ מִ/שָּׁ֣ם אֲקַבְּצֵ֔/ם ו/הבואתי/ם אֶל הַ/מָּק֔וֹם אֲשֶׁ֣ר בָּחַ֔רְתִּי לְ/שַׁכֵּ֥ן אֶת שְׁמִ֖/י שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/009.yaml
  text: but if you return to me and keep my commandments and do them[a], though your outcasts are at the end of the heavens, from there I will gather them and bring them to the place that I have chosen[c][b], to make my name dwell there.
translation:
  language: hi
  text: पर यदि तुम मेरी ओर लौटो, मेरी आज्ञाओं को मानो और उनका पालन करो, तो चाहे तुम्हारे निकाले हुए लोग[a] आकाश के छोर पर भी हों[b], मैं उन्हें वहाँ से इकट्ठा करूँगा और उस स्थान पर ले आऊँगा जिसे मैंने इसलिए चुना है कि वहाँ अपने नाम को निवास कराऊँ[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तुम्हारे निर्वासित लोग’ अथवा ‘तुम्हारे तितर-बितर किए हुए लोग’।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘आकाश के छोर पर’; यह सबसे दूर की कल्पनीय जगह के लिए प्रयुक्त मुहावरा है।
    reason: cultural_note
  - marker: c
    text: या ‘वहाँ अपना नाम स्थापित करूँ’। इब्रानी पाठ परमेश्वर के नाम के वहाँ निवास करने की छवि को बनाए रखता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְשַׁבְתֶּם אֵלַי
  choice: पर यदि तुम मेरी ओर लौटो
  rationale: שׁוּב אֶל का अर्थ ‘की ओर लौटना’ है। पद 8 से चली आ रही शर्त को स्वाभाविक हिन्दी में व्यक्त करने के लिए ‘पर यदि’ रखा गया है।
- source_word: וּשְׁמַרְתֶּם מִצְוֺתַי וַעֲשִׂיתֶם אֹתָם
  choice: मेरी आज्ञाओं को मानो और उनका पालन करो
  rationale: मूल में आज्ञाओं को सँभालकर रखने/मानने और उन्हें करने—दोनों भाव अलग-अलग हैं; हिन्दी में यह युग्म दोनों को स्वाभाविक रूप से बनाए रखता है।
- source_word: נִדַּחֲכֶם
  choice: तुम्हारे निकाले हुए लोग
  rationale: נדח में बलपूर्वक दूर किए या तितर-बितर किए जाने का निष्क्रिय भाव है। यह निर्वासन के संदर्भ में स्पष्ट है और केवल सामाजिक बहिष्कार का अर्थ नहीं देता।
- source_word: בִּקְצֵה הַשָּׁמַיִם
  choice: आकाश के छोर पर
  rationale: मूल की स्थान-संबंधी ब्रह्मांडीय उपमा को बनाए रखते हुए यह हिन्दी में सबसे दूर की कल्पनीय दूरी व्यक्त करता है।
- source_word: מִשָּׁם אֲקַבְּצֵם
  choice: मैं उन्हें वहाँ से इकट्ठा करूँगा
  rationale: קבץ बिखरे या निर्वासित लोगों को फिर से एकत्र करने का सामान्य क्रियापद है।
- source_word: וַהֲבֹאתִים
  choice: और ... ले आऊँगा
  rationale: בוא का हिफ़ील रूप कारणवाचक है; ‘ले आऊँगा’ उसका स्वाभाविक हिन्दी रूप है।
- source_word: הַמָּקוֹם אֲשֶׁר בָּחַרְתִּי
  choice: उस स्थान ... जिसे मैंने ... चुना है
  rationale: यह परमेश्वर द्वारा उपासना-स्थान के चुनाव को व्यक्त करता है; ‘चुना है’ उस चुनाव की वर्तमान प्रासंगिकता बनाए रखता है।
- source_word: לְשַׁכֵּן אֶת שְׁמִי שָׁם
  choice: कि वहाँ अपने नाम को वास कराऊँ
  rationale: שׁכן का कारणवाचक रूप और ‘मेरे नाम’ का कर्म मूल की ‘नाम के वास’ वाली पवित्रस्थान-संबंधी छवि को सुरक्षित रखते हैं।
theological_decisions:
- issue: चुने हुए स्थान में परमेश्वर के नाम के वास का सूत्र
  choice: कि वहाँ अपने नाम को वास कराऊँ
  alternative: कि वहाँ अपना नाम स्थापित करूँ
  rationale: मूल पाठ परमेश्वर के ‘नाम’ को चुने हुए स्थान में वास कराने की छवि रखता है। इसे बनाए रखने से स्थान के साथ परमेश्वर के विशेष संबंध का भाव आता है, पर यह नहीं कहा जाता कि परमेश्वर स्वयं उसी स्थान तक सीमित हैं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘आज्ञाओं को मानो और उनका पालन करो’ मूल की दोहरी क्रिया को बिना अस्वाभाविक शाब्दिकता के सुरक्षित रखता है; ‘अपने नाम को वास कराऊँ’ जानबूझकर मूल की धर्मवैचारिक छवि बनाए रखता है।
