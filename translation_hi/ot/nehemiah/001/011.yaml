source:
  edition: WLC
  text: אָנָּ֣א אֲדֹנָ֗/י תְּהִ֣י נָ֣א אָזְנְ/ךָֽ קַ֠שֶּׁבֶת אֶל תְּפִלַּ֨ת עַבְדְּ/ךָ֜ וְ/אֶל תְּפִלַּ֣ת עֲבָדֶ֗י/ךָ הַֽ/חֲפֵצִים֙ לְ/יִרְאָ֣ה אֶת שְׁמֶ֔/ךָ וְ/הַצְלִֽיחָ/ה נָּ֤א לְ/עַבְדְּ/ךָ֙ הַ/יּ֔וֹם וּ/תְנֵ֣/הוּ לְ/רַחֲמִ֔ים לִ/פְנֵ֖י הָ/אִ֣ישׁ הַ/זֶּ֑ה וַ/אֲנִ֛י הָיִ֥יתִי מַשְׁקֶ֖ה לַ/מֶּֽלֶךְ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/011.yaml
  text: Please[a], Lord, let your ear be attentive to the prayer of your servant and to the prayer of your servants who delight to fear your name, and please give success to your servant today and grant him compassion before this man[c][b]. Now I was cupbearer to the king.
translation:
  language: hi
  text: कृपा करके, हे प्रभु, तेरा कान अपने दास की प्रार्थना और अपने उन दासों की प्रार्थना की ओर ध्यान लगाए रहे, जो तेरे नाम का भय मानने में आनन्दित होते हैं[a]। कृपा करके आज अपने दास को सफलता दे और इस मनुष्य के सामने उसे दया प्राप्त करा[b][c]। मैं राजा का पेय परोसनेवाला था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो तेरे नाम का आदर करना चाहते हैं,” अथवा “जो तेरे नाम के प्रति श्रद्धा से भरना चाहते हैं।”
    reason: lexical_alternative
  - marker: b
    text: या, “इस मनुष्य के सामने उसे कृपादृष्टि दिला।” इब्रानी मुहावरे का शाब्दिक भाव है, “उसे दया/करुणाओं के लिए दे।”
    reason: lexical_alternative
  - marker: c
    text: “इस मनुष्य” से आशय राजा है, जिसकी पहचान अगली बात में उस राजा के रूप में होती है जिसका नहेमायाह पेय परोसनेवाला था।
    reason: cross_reference
lexical_decisions:
- source_word: אָנָּא
  choice: विनती है
  rationale: यह आग्रहपूर्ण निवेदन का अव्यय है। ‘विनती है’ आधुनिक हिन्दी में प्रार्थना की नम्र और तात्कालिक पुकार व्यक्त करता है।
- source_word: אֲדֹנָי
  choice: प्रभु
  rationale: यहाँ परमेश्वर को सीधे सम्बोधित करने वाली उपाधि है; यह चतुरक्षरीय दिव्य नाम नहीं है।
- source_word: תְּהִי נָא אָזְנְךָ קַשֶּׁבֶת
  choice: अपने ... प्रार्थना पर कान लगा
  rationale: यह परमेश्वर से अनुकूल होकर सुनने की विनती है। हिन्दी मुहावरा ‘कान लगाना’ मूल के कान-संबंधी रूपक को स्वाभाविक ढंग से बनाए रखता है।
- source_word: תְּפִלַּת עַבְדְּךָ / עֲבָדֶיךָ
  choice: अपने दास की प्रार्थना / अपने ... दासों की प्रार्थना
  rationale: प्रार्थना में עבד नम्र आत्म-पहचान और परमेश्वर की सेवा का संबंध व्यक्त करता है; यहाँ कानूनी दासत्व पर बल नहीं है। एकवचन और बहुवचन में एक ही शब्द रखा गया है।
- source_word: הַחֲפֵצִים לְיִרְאָה אֶת שְׁמֶךָ
  choice: जो तेरे नाम का भय मानने में प्रसन्न रहते हैं
  rationale: חפץ प्रसन्न होने या रुचि रखने और ירא भय सहित श्रद्धा रखने का भाव देता है। यह अनुवाद दोनों अर्थों को बनाए रखता है।
- source_word: וְהַצְלִיחָה נָּא לְעַבְדְּךָ הַיּוֹם
  choice: आज अपने दास को सफलता दे
  rationale: צלח का हिफ़ील रूप परमेश्वर से सफल परिणाम दिलाने की विनती करता है। ‘सफलता दे’ कारणवाचक अर्थ को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: וּתְנֵהוּ לְרַחֲמִים לִפְנֵי הָאִישׁ הַזֶּה
  choice: इस मनुष्य के सामने उस पर दया कर
  rationale: शाब्दिक संरचना ‘उसे दया/करुणाओं के लिए दे’ एक मुहावरा है, जिसका आशय उस व्यक्ति से दयापूर्ण व्यवहार प्राप्त कराना है। ‘इस मनुष्य’ मूल की संकेतात्मक और कुछ दूरी रखने वाली अभिव्यक्ति को सुरक्षित रखता है।
- source_word: וַאֲנִי הָיִיתִי מַשְׁקֶה לַמֶּלֶךְ
  choice: मैं राजा का पिलानेवाला था
  rationale: מַשְׁקֶה राजा को पेय परोसने और उसकी सुरक्षा से जुड़ा दरबारी पद था। ‘राजा का पिलानेवाला’ सामान्य हिन्दी में अर्थपूर्ण है और पद की मूल क्रिया को दर्शाता है।
theological_decisions:
- issue: प्रार्थना की भाषा में עבד का अनुवाद
  choice: दास
  alternative: सेवक
  rationale: ‘दास’ परमेश्वर के सामने नहेमायाह की नम्र अधीनता और बंधी हुई निष्ठा का भार बनाए रखता है, पर प्रसंग इसे कानूनी दासत्व के सिद्धान्त में नहीं बदलता।
- issue: परमेश्वर के नाम के साथ ירא का अनुवाद
  choice: तेरे नाम का भय मानना
  alternative: तेरे नाम का आदर करना / तेरे नाम के प्रति श्रद्धा रखना
  rationale: मूल शब्द में भय, श्रद्धा और विस्मय का संयुक्त भाव है। मुख्य पाठ में ‘भय मानना’ इस तनाव और बाइबिलीय मुहावरे को नरम किए बिना सुरक्षित रखता है।
- issue: לְרַחֲמִים में दया और अनुग्रह का संबंध
  choice: उस पर दया कर
  alternative: उसे कृपादृष्टि दिला
  rationale: רַחֲמִים करुणा और दया पर बल देता है। इसलिए सामान्य ‘कृपा’ की अपेक्षा ‘दया’ चुनी गई है, जबकि पादटिप्पणी प्रसंगगत ‘अनुकूलता’ की संभावना बताती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, प्रार्थनापूर्ण और गरिमापूर्ण रखी गई है। परमेश्वर के लिए निकट एकवचन ‘तेरा/अपने’ का प्रयोग निरन्तर है। ‘पिलानेवाला’ अपेक्षाकृत पारदर्शी पदनाम है; पाठक-सुलभता हेतु इसे अत्यधिक संस्कृतनिष्ठ ‘पानपात्रवाहक’ पर वरीयता दी गई है।
