- from: हे प्रभु, विनती है, अपने दास की प्रार्थना और अपने उन दासों की प्रार्थना पर कान लगा, जो तेरे नाम का भय मानने में प्रसन्न रहते हैं[a]। आज अपने दास को सफलता दे और इस मनुष्य के सामने उस पर दया कर[b][c]। मैं राजा का पिलानेवाला था।
