id: NEH.1.10
reference: Nehemiah 1:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הֵ֥ם עֲבָדֶ֖י/ךָ וְ/עַמֶּ֑/ךָ אֲשֶׁ֤ר פָּדִ֨יתָ֙ בְּ/כֹחֲ/ךָ֣ הַ/גָּד֔וֹל וּ/בְ/יָדְ/ךָ֖ הַ/חֲזָקָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/010.yaml
  text: But they are your servants and your people[b][a], whom you redeemed by your great power and by your strong hand.
translation:
  language: hi
  text: फिर भी वे आपके सेवक और आपकी प्रजा हैं, जिन्हें आपने अपनी महान सामर्थ्य से और अपने शक्तिशाली हाथ[b] से छुड़ाया[a] है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘छुटकारा दिया’ अथवा ‘मोल देकर छुड़ाया’; इब्रानी क्रिया का अर्थ उद्धार के कार्य द्वारा किसी की रिहाई सुनिश्चित करना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘बलवान हाथ’; यह परमेश्वर के सामर्थ्यपूर्ण कार्य के लिए प्रयुक्त एक सामान्य इब्रानी अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵם
  choice: फिर भी वे
  rationale: 'संयोजक וְ पिछले पदों से बात को जोड़ते हुए यहाँ हल्का विरोधाभासी भाव देता है: पाप और निर्वासन के बावजूद वे अब भी परमेश्वर के हैं।'
- source_word: עֲבָדֶיךָ
  choice: आपके सेवक
  rationale: עבד का अर्थ दास भी हो सकता है, पर इस प्रार्थना में परमेश्वर के साथ वाचा-संबंध प्रमुख है; इसलिए ‘सेवक’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: וְעַמֶּךָ
  choice: और आपकी प्रजा
  rationale: वाचा के प्रसंग में עם परमेश्वर से संबंधित सामूहिक समुदाय को दर्शाता है; ‘प्रजा’ अधिकार और संबंध दोनों व्यक्त करती है।
- source_word: אֲשֶׁר פָּדִיתָ
  choice: जिन्हें आपने ... छुड़ाया है
  rationale: פדה किसी को बंधन या संकट से छुड़ाने अथवा उसका छुटकारा करने का भाव रखता है। ‘छुड़ाया’ निर्गमन-सदृश उद्धार के अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בְּכֹחֲךָ הַגָּדוֹל
  choice: अपनी महान सामर्थ्य से
  rationale: כח शक्ति या सामर्थ्य को दर्शाता है और בְּ यहाँ साधन का बोध कराता है।
- source_word: וּבְיָדְךָ הַחֲזָקָה
  choice: और अपने शक्तिशाली हाथ से
  rationale: यह परमेश्वर के प्रभावशाली सामर्थ्यपूर्ण कार्य का मानवरूपी मुहावरा है। ‘शक्तिशाली हाथ’ मूल के ‘दृढ़/बलवान हाथ’ को आधुनिक हिन्दी में स्पष्ट रखता है।
theological_decisions:
- issue: नहेमायाह की प्रार्थना में פדה का उद्धार-संबंधी अर्थ
  choice: छुड़ाया
  alternative: छुटकारा दिया; मोल देकर छुड़ाया
  rationale: यह शब्द सम्भवतः निर्गमन में परमेश्वर द्वारा किए गए वाचा-संबंधी छुटकारे की ओर संकेत करता है। ‘छुड़ाया’ उस ऐतिहासिक उद्धार को व्यक्त करता है, पर किसी ऐसी भुगतान-प्रणाली को स्पष्ट नहीं करता जो इस पद में स्वयं नहीं बताई गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में आदरसूचक ‘आप’ का प्रयोग किया गया है। भाषा प्रार्थनापूर्ण और गरिमापूर्ण है, पर सामान्य पाठक के लिए सहज रखी गई है। ‘फिर भी’ पिछले प्रसंग के साथ हल्का विरोधाभास व्यक्त करता है; ‘सामर्थ्य’ और ‘शक्तिशाली हाथ’ मूल की समानांतर अभिव्यक्तियों को बनाए रखते हैं।
