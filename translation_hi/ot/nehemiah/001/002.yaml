  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली। ‘बँधुआई’ ने इब्रानी שְׁבִי की बंदी अवस्था को सुरक्षित रखा है, जबकि ‘बचकर शेष रह गए’ ने पद के दो निकटवर्ती, किंतु अलग अर्थ-घटकों को बनाए रखा है।
