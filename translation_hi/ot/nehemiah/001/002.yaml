  text: וַ/יָּבֹ֨א חֲנָ֜נִי אֶחָ֧ד מֵ/אַחַ֛/י ה֥וּא וַ/אֲנָשִׁ֖ים מִֽ/יהוּדָ֑ה וָ/אֶשְׁאָלֵ֞/ם עַל הַ/יְּהוּדִ֧ים הַ/פְּלֵיטָ֛ה אֲשֶֽׁר נִשְׁאֲר֥וּ מִן הַ/שֶּׁ֖בִי וְ/עַל יְרוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/002.yaml
  text: Hanani[a], one of my brothers, came—he and some men from Judah—and I asked them about the Jews who had escaped, who were left from the captivity[c][b], and about Jerusalem.
translation:
  language: hi
  text: तब मेरे भाइयों में से एक, हनानी, यहूदा से आए कुछ लोगों के साथ आया। मैंने उनसे उन यहूदियों के बारे में पूछा जो बँधुआई से बचे हुए थे, और यरूशलेम के बारे में भी पूछा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: आया
  rationale: בוא का वय्यिक्तोल रूप कथा में साधारण भूतकालीन आगमन व्यक्त करता है; ‘आया’ स्वाभाविक हिन्दी है।
- source_word: חֲנָנִי
  choice: हनानी
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: אֶחָד מֵאַחַי הוּא
  choice: मेरे भाइयों में से एक
  rationale: इब्रानी पारिवारिक पद और ‘एक ... में से’ की संरचना को स्वाभाविक हिन्दी में सुरक्षित रखता है; व्यापक ‘कुटुम्बियों’ की अपेक्षा अधिक सटीक है।
- source_word: וַאֲנָשִׁים מִיהוּדָה
  choice: यहूदा से आए कुछ लोगों के साथ
  rationale: हनानी के साथियों और उनके भौगोलिक मूल को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है। ‘कुछ’ अनिश्चित बहुवचन को दर्शाता है, कोई निश्चित संख्या नहीं जोड़ता।
- source_word: וָאֶשְׁאָלֵם
  choice: मैंने उनसे ... पूछा
  rationale: שׁאל का यहाँ सामान्य अर्थ पूछना या जानकारी लेना है।
- source_word: הַיְּהוּדִים
  choice: उन यहूदियों
  rationale: फ़ारसी काल के प्रसंग में यह पद यहूदी लोगों को सूचित कर सकता है; ‘यहूदी’ आधुनिक हिन्दी में मानक और स्वाभाविक है।
- source_word: הַפְּלֵיטָה אֲשֶׁר נִשְׁאֲרוּ
  choice: जो ... बचकर शेष रह गए थे
  rationale: הַפְּלֵיטָה के बच निकलने/जीवित बचने और נִשְׁאֲרוּ के शेष रहने—दोनों भावों को बिना एक में मिला दिए व्यक्त करता है।
- source_word: מִן הַשֶּׁבִי
  choice: बँधुआई से
  rationale: שְׁבִי का मूल भाव बंदी अवस्था/बँधुआई है; ‘निर्वासन’ भी संभव है, पर वह ऐतिहासिक स्थिति को कुछ अधिक व्याख्यायित करता है।
- source_word: וְעַל יְרוּשָׁלִָם
  choice: और यरूशलेम के बारे में भी
  rationale: दूसरे पूछताछ-विषय के रूप में यरूशलेम को पहले עַל-वाक्यांश के समानांतर रखता है; ‘भी’ हिन्दी में इस समानांतरता को स्वाभाविक बनाता है।
