source:
  edition: WLC
  text: זְכָר נָא֙ אֶת הַ/דָּבָ֔ר אֲשֶׁ֥ר צִוִּ֛יתָ אֶת מֹשֶׁ֥ה עַבְדְּ/ךָ֖ לֵ/אמֹ֑ר אַתֶּ֣ם תִּמְעָ֔לוּ אֲנִ֕י אָפִ֥יץ אֶתְ/כֶ֖ם בָּ/עַמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/008.yaml
  text: Please remember the word that you commanded your servant Moses[a], saying, ‘If you act unfaithfully[b], I will scatter you among the peoples.’
translation:
  language: hi
  text: 'कृपया उस वचन को स्मरण कीजिए, जो आपने अपने सेवक मूसा को आज्ञा के रूप में यह कहते हुए दिया था: “यदि तुम विश्वासघात करोगे[a], तो मैं तुम्हें लोगों के बीच[b] तितर-बितर कर दूँगा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यदि तुम निष्ठा तोड़ोगे” अथवा “यदि तुम विश्वासयोग्य न रहोगे।”
    reason: lexical_alternative
  - marker: b
    text: या “राष्ट्रों के बीच।”
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכָר נָא
  choice: कृपया ... स्मरण कीजिए
  rationale: आज्ञार्थक זְכָר के साथ विनय-सूचक נָא है; यह रूप नहेम्याह की आदरपूर्ण प्रार्थना को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: הַדָּבָר
  choice: उस वचन
  rationale: यहाँ דָּבָר परमेश्वर द्वारा मूसा को दिए गए विशिष्ट कथन की ओर संकेत करता है; ‘वचन’ अर्थ और प्रसंग दोनों को बनाए रखता है।
- source_word: צִוִּיתָ
  choice: जिसकी आज्ञा आपने ... दी थी
  rationale: צוה का सीधा अर्थ ‘आज्ञा देना’ है। हिन्दी वाक्य-विन्यास में यह रूप स्पष्ट करता है कि वचन मूसा को दिया गया था।
- source_word: עַבְדְּךָ
  choice: अपने सेवक
  rationale: मूसा के लिए עבד परमेश्वर की सेवा में उसके संबंध और पद को दर्शाता है; ‘सेवक’ आधुनिक हिन्दी में उपयुक्त है।
- source_word: לֵאמֹר
  choice: यह कहते हुए
  rationale: यह उद्धरण प्रस्तुत करने वाला सामान्य इब्रानी रूप है, जिसे हिन्दी में स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: תִּמְעָלוּ
  choice: विश्वासघात करोगे
  rationale: מעל संबंध या वाचा के प्रति निष्ठा तोड़ने का भाव रखता है। ‘विश्वासघात करना’ केवल सामान्य पाप की अपेक्षा इस भाव को अधिक स्पष्ट रूप से व्यक्त करता है।
- source_word: אָפִיץ
  choice: तितर-बितर कर दूँगा
  rationale: פוץ के हिफ़ील रूप का अर्थ किसी को बिखेर देना है; ‘तितर-बितर करना’ न्यायस्वरूप फैलाए जाने को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בָּעַמִּים
  choice: देश-देश के लोगों के बीच
  rationale: עַמִּים बहुवचन में विभिन्न जनसमुदायों को दर्शाता है। यह चयन ‘जातियों’ के संभावित सामाजिक अर्थ से बचते हुए मूल के बहुवचन जातीय-राष्ट्रीय भाव को स्पष्ट करता है।
theological_decisions:
- issue: מעל में वाचा-संबंधी अविश्वासयोग्यता का भाव
  choice: यदि तुम विश्वासघात करोगे
  alternative: यदि तुम अविश्वासी ठहरोगे / यदि तुम निष्ठा तोड़ोगे
  rationale: ‘विश्वासघात’ वाचा या संबंध के प्रति निष्ठा भंग करने का भाव सुरक्षित रखता है, पर अपराध की कोई अधिक विशिष्ट धार्मिक या कानूनी श्रेणी आरोपित नहीं करता।
- issue: दूसरे पुरुष बहुवचन का हिन्दी में रूप
  choice: तुम
  alternative: तुम लोग / आप
  rationale: इब्रानी אַתֶּם बहुवचन है। उद्धृत वचन सामूहिक इस्राएल को संबोधित करता है; हिन्दी में ‘तुम’ संख्या की अस्पष्टता बनाए रखते हुए स्वाभाविक है, जबकि प्रसंग सामूहिक अर्थ स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का आदरपूर्ण, प्रार्थनात्मक और गरिमापूर्ण रूप अपनाया गया है। परमेश्वर को संबोधन में ‘आप’ और सामूहिक इस्राएल के लिए उद्धरण में ‘तुम’ रखा गया है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
