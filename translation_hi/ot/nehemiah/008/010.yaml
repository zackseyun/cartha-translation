base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/010.yaml
  text: Then he said to them[a], “Go, eat rich food and drink sweet drinks, and send portions to anyone for whom nothing is prepared, for this day is holy to our Lord. And do not be grieved[c][b], for the joy of Yahweh is your stronghold.”
translation:
  language: hi
  text: तब उसने उनसे कहा, “जाओ, स्वादिष्ट भोजन खाओ और मीठे पेय पियो, और जिन्हें कुछ तैयार नहीं है, उन्हें भोजन के हिस्से भेजो; क्योंकि आज का दिन हमारे प्रभु के लिए पवित्र है। उदास मत हो, क्योंकि यहोवा का आनन्द[a] तुम्हारा दृढ़ गढ़ है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “यहोवा का आनन्द” का अर्थ “यहोवा में आनन्द” भी हो सकता है।
    reason: मूल हिब्रू संबंध-वाक्यांश की वास्तविक अर्थगत अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: מַשְׁמַנִּים
  choice: स्वादिष्ट भोजन
  rationale: शाब्दिक अर्थ ‘चिकनी/वसायुक्त वस्तुएँ’ है, पर उत्सव के प्रसंग में इसका आशय भरपूर और उत्तम भोजन से है; ‘स्वादिष्ट भोजन’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: מַמְתַקִּים
  choice: मीठे पेय
  rationale: क्रिया ‘पियो’ के साथ यह मीठी पीने की वस्तुओं को दर्शाता है; इसे विशेष रूप से मदिरा कहना मूल से अधिक संकीर्ण होगा।
- source_word: מָנוֹת
  choice: भोजन के हिस्से
  rationale: उत्सवी भोज में बाँटकर भेजे जाने वाले अंश अभिप्रेत हैं; स्पष्टता के लिए ‘भोजन के’ जोड़ा गया है।
- source_word: לְאֵין נָכוֹן לוֹ
  choice: जिनके लिए कुछ तैयार नहीं है
  rationale: यह उन लोगों की ओर संकेत करता है जिनके लिए उत्सव का प्रबंध तैयार नहीं है; हिन्दी में बहुवचन रूप अनिश्चित व्यक्ति को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: קָדוֹשׁ
  choice: पवित्र
  rationale: परमेश्वर के लिए अलग ठहराए गए दिन का मानक और अर्थपूर्ण हिन्दी अनुवाद।
- source_word: לַאֲדֹנֵינוּ
  choice: हमारे प्रभु के लिए
  rationale: यहाँ אֲדֹנֵינוּ परमेश्वर के लिए प्रयुक्त आदरसूचक उपाधि है; ‘प्रभु’ उपयुक्त धार्मिक हिन्दी है।
- source_word: תֵּעָצֵבוּ
  choice: उदास मत हो
  rationale: क्रिया दुःखी या शोकाकुल होने को व्यक्त करती है; ‘उदास मत हो’ सामान्य आधुनिक हिन्दी में सीधा और प्रसंगानुकूल है।
- source_word: חֶדְוַת יְהוָה
  choice: यहोवा का आनन्द
  rationale: हिब्रू संबंध-वाक्यांश को औपचारिक रूप से बनाए रखता है और यह अनिर्णीत छोड़ता है कि आनन्द यहोवा का है या यहोवा में पाया जाने वाला आनन्द।
- source_word: יְהוָה
  choice: यहोवा
  rationale: दिव्य व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ द्वारा व्यक्त किया गया है, न कि उपाधि से बदला गया है।
- source_word: מָעֻזְּכֶם
  choice: तुम्हारा दृढ़ गढ़
  rationale: शब्द सुरक्षा और सामर्थ्य देने वाले किले या शरणस्थान का ठोस रूपक रखता है; ‘दृढ़ गढ़’ केवल ‘बल’ की अपेक्षा उस चित्र को बेहतर बनाए रखता है।
theological_decisions:
- issue: חֶדְוַת יְהוָה का संबंधार्थ
  choice: यहोवा का आनन्द
  alternative: यहोवा में आनन्द
  rationale: मूल का संबंध-वाक्यांश अनेक अर्थों की अनुमति देता है। मुख्य पाठ में उसके रूप और धार्मिक तनाव को रखा गया है; अधिक व्याख्यात्मक विकल्प पादटिप्पणी में दिया गया है।
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: व्यक्तिगत दिव्य नाम को शीर्षक ‘प्रभु’ से प्रतिस्थापित नहीं किया गया। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में अधिक परिचित रूप है, जबकि ‘याहवे’ अधिक निकट ध्वन्यात्मक पुनर्निर्माण है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। उत्सव के खाद्य-पेय और गढ़ के रूपक को स्वाभाविक हिन्दी में रखा गया है; दिव्य नाम के लिए ‘यहोवा’ प्रयुक्त है।
