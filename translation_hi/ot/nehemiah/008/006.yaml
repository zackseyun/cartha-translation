source:
  edition: WLC
  text: וַ/יְבָ֣רֶךְ עֶזְרָ֔א אֶת יְהוָ֥ה הָ/אֱלֹהִ֖ים הַ/גָּד֑וֹל וַ/יַּֽעֲנ֨וּ כָל הָ/עָ֜ם אָמֵ֤ן אָמֵן֙ בְּ/מֹ֣עַל יְדֵי/הֶ֔ם וַ/יִּקְּד֧וּ וַ/יִּשְׁתַּחֲוֻּ֛ לַ/יהוָ֖ה אַפַּ֥יִם אָֽרְצָ/ה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/006.yaml
  text: And Ezra blessed Yahweh[a], the great God, and all the people answered, “Amen, Amen,” while lifting up their hands. Then they bowed down and worshiped Yahweh with their faces to the ground.
translation:
  language: hi
  text: तब एज्रा ने याहवे, उस महान परमेश्वर, को धन्य कहा। सारे लोगों ने हाथ उठाकर उत्तर दिया, “आमीन, आमीन।”[a] फिर वे झुके और भूमि पर मुँह के बल होकर याहवे को दण्डवत किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “आमीन” सहमति और पुष्टि की उपासना-संबंधी प्रतिक्रिया है; इसकी पुनरावृत्ति जोर प्रकट करती है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: धन्य कहा
  rationale: पिएल रूप में, जब परमेश्वर कर्म हो, तो इसका अर्थ परमेश्वर को धन्य कहना या उसकी स्तुति करना है। ‘धन्य कहा’ मूल क्रिया की आशीष-संबंधी अभिव्यक्ति को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: यह चतुरक्षरीय व्यक्तिगत नाम יהוה का हिंदी लिप्यंतरण है; इसे किसी उपाधि से बदलने के बजाय मूल पाठ में उपस्थित नाम को सुरक्षित रखा गया है।
- source_word: הָאֱלֹהִים הַגָּדוֹל
  choice: महान परमेश्वर
  rationale: यह स्वाभाविक हिंदी में विशेषण के बल को बनाए रखते हुए याहवे की पहचान ‘महान परमेश्वर’ के रूप में करता है।
- source_word: וַיַּעֲנוּ
  choice: उत्तर दिया
  rationale: यह लोगों की सामूहिक मौखिक प्रतिक्रिया को सीधे व्यक्त करता है।
- source_word: אָמֵן אָמֵן
  choice: आमीन! आमीन!
  rationale: उपासना में सहमति की पारंपरिक ध्वन्यात्मक अभिव्यक्ति को लिप्यंतरित रखा गया है और जोर दिखाने वाली पुनरावृत्ति सुरक्षित है।
- source_word: בְּמֹעַל יְדֵיהֶם
  choice: अपने हाथ उठाकर
  rationale: यह मुख्य उत्तर के साथ होने वाली शारीरिक क्रिया को संक्षिप्त और स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: וַיִּקְּדוּ
  choice: झुककर
  rationale: קדד का अर्थ नीचे झुकना है; यह अगले आराधना-सूचक क्रियापद से अलग शारीरिक गति को बनाए रखता है।
- source_word: וַיִּשְׁתַּחֲוֻּ
  choice: आराधना की
  rationale: यह क्रिया दंडवत होने और आराधना करने दोनों का भाव रखती है। निकटवर्ती ‘झुककर’ और ‘मुँह के बल’ शारीरिक मुद्रा स्पष्ट करते हैं, इसलिए यहाँ भक्ति का आशय ‘आराधना की’ से व्यक्त किया गया है।
- source_word: אַפַּיִם אָרְצָה
  choice: भूमि तक मुँह के बल
  rationale: शाब्दिक भाव ‘चेहरा भूमि की ओर’ है; चुनी हुई अभिव्यक्ति पूर्ण दंडवत मुद्रा को स्पष्ट, सहज हिंदी में बताती है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल इब्रानी पाठ व्यक्तिगत नाम יהוה का प्रयोग करता है। ‘याहवे’ उसके संभावित उच्चारण का व्यापक रूप से स्वीकृत लिप्यंतरण है और नाम को उपाधि में नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘धन्य कहा’ पारंपरिक बाइबिलीय भाव को बचाता है, जबकि वाक्य-विन्यास साधारण हिंदी पाठक के लिए सहज है।
