base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/011.yaml
  text: And the Levites were quieting all the people[a], saying, “Be still, for the day is holy[b]; do not be grieved.”
translation:
  language: hi
  text: और लेवी लोग सारे लोगों को शांत कर रहे थे[a] और कह रहे थे, “चुप रहो, क्योंकि यह दिन पवित्र है; दुखी मत हो[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “चुप करा रहे थे” या “चुप रहने को कह रहे थे।”
    reason: lexical_alternative
  - marker: b
    text: या “शोक मत करो” या “उदास मत हो।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: और लेवी
  rationale: समुदाय और उसके सदस्यों के लिए प्रचलित हिन्दी बाइबलीय पदनाम ‘लेवी’ स्वाभाविक और स्पष्ट है।
- source_word: מַחְשִׁים
  choice: शांत करा रहे थे
  rationale: कृदन्त की जारी क्रिया और लोगों को चुप कराने के सकर्मक भाव—दोनों को व्यक्त करता है।
- source_word: לְכָל הָעָם
  choice: सारे लोगों को
  rationale: כָל के समावेशी भाव और एकत्र जनसमुदाय के अर्थ को सहज आधुनिक हिन्दी में रखता है।
- source_word: לֵאמֹר
  choice: वे कह रहे थे
  rationale: प्रत्यक्ष कथन का परिचय देता है और हिन्दी में पूर्ववर्ती जारी क्रिया के साथ स्वाभाविक वाक्य बनाता है।
- source_word: הַסּוּ
  choice: चुप रहो
  rationale: बहुवचन आज्ञा में शोर या विलाप रोकने का सीधा आह्वान है; ‘चुप रहो’ सामान्य पाठक के लिए स्पष्ट है।
- source_word: כִּי הַיּוֹם קָדֹשׁ
  choice: क्योंकि यह दिन पवित्र है
  rationale: כִּי को कारणसूचक और הַיּוֹם को प्रसंग में उपस्थित दिन के रूप में व्यक्त करता है; ‘पवित्र’ קָדֹשׁ का धार्मिक भार बनाए रखता है।
- source_word: וְאַל תֵּעָצֵבוּ
  choice: दुखी मत हो
  rationale: निषेधात्मक आज्ञा और भावनात्मक पीड़ा या शोक का व्यापक अर्थ सहज हिन्दी में व्यक्त होता है, बिना इसे केवल औपचारिक मातम तक सीमित किए।
theological_decisions:
- issue: सामुदायिक उपासना के प्रसंग में קָדֹשׁ का अनुवाद
  choice: पवित्र
  alternative: पावन
  rationale: ‘पवित्र’ दिन के परमेश्वर के लिए अलग ठहराए जाने का वाचाई और धर्मवैचारिक भार स्पष्ट रूप से बनाए रखता है।
- issue: תֵּעָצֵבוּ में दुःख और शोक के बीच अर्थ-सीमा
  choice: दुखी मत हो
  alternative: शोक मत करो
  rationale: मूल क्रिया भावनात्मक दुःख को व्यक्त कर सकती है और अनिवार्य रूप से किसी औपचारिक शोक-विधि को नहीं दर्शाती; इसलिए व्यापक अर्थ चुना गया और विकल्प पादटिप्पणी में रखा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सरल। जारी क्रिया के लिए ‘शांत करा रहे थे’ और सभा को दी गई सीधी आज्ञा के लिए ‘चुप रहो’ रखा गया है। सभी पादटिप्पणी-चिह्न संबंधित शब्दसमूह के तुरंत बाद दिए गए हैं।
