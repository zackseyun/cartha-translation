base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/015.yaml
  text: and that they should proclaim and spread the message through all their cities and in Jerusalem[a], saying, “Go out to the hill country and bring branches of olive, oil tree, myrtle, palm, and other leafy trees, to make booths[b], as it is written.”
translation:
  language: hi
  text: 'और यह कि वे अपने सब नगरों और यरूशलेम में घोषणा करें और संदेश फैलाएँ: “पहाड़ी प्रदेश में जाओ और जैतून, तेल-वृक्ष,[a] मेंहदी, खजूर और घने पत्तों वाले वृक्षों की डालियाँ[b] ले आओ, झोंपड़ियाँ बनाने के लिए, जैसा लिखा है।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “तेल-वृक्ष” के लिए “जंगली जैतून” या “ओलिएस्टर” भी संभव है। इब्रानी עֵץ שֶׁמֶן में वृक्ष की ठीक-ठीक प्रजाति अनिश्चित है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “जैतून के पत्ते… मेंहदी के पत्ते…” है। यहाँ झोंपड़ियाँ बनाने के लिए जुटाई गई पत्तेदार सामग्री के अर्थ में “डालियाँ” कहा गया है।
    reason: lexical_alternative
