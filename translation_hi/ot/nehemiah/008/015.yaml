- source_word: בְּכָל עָרֵיהֶם וּבִירוּשָׁלַם
  choice: अपने सब नगरों और यरूशलेम में
  rationale: इब्रानी स्थानवाचक अभिव्यक्ति और यरूशलेम के विशिष्ट उल्लेख को स्वाभाविक हिन्दी में रखा गया है।
- source_word: צְאוּ הָהָר
  choice: पहाड़ी प्रदेश में जाओ
  rationale: הָהָר यहाँ किसी एक पर्वत की अपेक्षा आसपास के पहाड़ी भूभाग को सूचित कर सकता है।
- source_word: עֲלֵי
  choice: डालियाँ
  rationale: शाब्दिक अर्थ 'पत्ते' है, पर झोंपड़ियाँ बनाने के लिए जुटाई जाने वाली पत्तेदार सामग्री को हिन्दी में 'डालियाँ' अधिक स्वाभाविक रूप से व्यक्त करता है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: עֵץ שֶׁמֶן
  choice: तेल-वृक्ष
  rationale: शाब्दिक संरचना को सुरक्षित रखा गया है क्योंकि वृक्ष-प्रजाति की पहचान अनिश्चित है।
- source_word: הֲדַס
  choice: मेंहदी
  rationale: यहाँ हदस अर्थात myrtle पौधे के लिए प्रचलित हिन्दी बाइबलीय नाम चुना गया है।
- source_word: תְמָרִים
  choice: खजूर
  rationale: सूची के संदर्भ में खजूर के वृक्ष की डालियाँ अभिप्रेत हैं।
- source_word: עֵץ עָבֹת
  choice: घने पत्तों वाले वृक्ष
  rationale: עָבֹת का घना अथवा सघन होने का भाव स्पष्ट और स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: לַעֲשֹׂת סֻכֹּת
  choice: झोंपड़ियाँ बनाओ
  rationale: סֻכּוֹת पर्व के लिए बनाई जाने वाली अस्थायी छायादार झोंपड़ियों को दर्शाता है।
- source_word: כַּכָּתוּב
  choice: लिखे हुए के अनुसार
  rationale: व्यवस्था में लिखी आज्ञा की ओर संकेत को संक्षिप्त रूप में सुरक्षित रखता है।
