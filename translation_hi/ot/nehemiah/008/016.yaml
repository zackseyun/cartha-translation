  text: וַ/יֵּצְא֣וּ הָ/עָם֮ וַ/יָּבִיאוּ֒ וַ/יַּעֲשׂוּ֩ לָ/הֶ֨ם סֻכּ֜וֹת אִ֤ישׁ עַל גַּגּ/וֹ֙ וּ/בְ/חַצְרֹ֣תֵי/הֶ֔ם וּ/בְ/חַצְר֖וֹת בֵּ֣ית הָ/אֱלֹהִ֑ים וּ/בִ/רְחוֹב֙ שַׁ֣עַר הַ/מַּ֔יִם וּ/בִ/רְח֖וֹב שַׁ֥עַר אֶפְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/016.yaml
  text: So the people went out and brought them[a], and made booths for themselves, each on his roof, and in their courtyards, and in the courtyards of the house of God, and in the square of the Water Gate[b], and in the square of the Gate of Ephraim.
translation:
  language: hi
  text: तब लोग बाहर गए और उन्हें ले आए। उन्होंने अपने लिए झोंपड़ियाँ[a] बनाईं—अपनी-अपनी छतों पर और अपने आँगनों में, परमेश्वर के भवन के आँगनों में, जल फाटक के चौक[b] में और एप्रैम फाटक के चौक में।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अस्थायी आश्रय”; इब्रानी शब्द सुक्कोत ऐसी झोंपड़ियों के लिए प्रयुक्त है जिनसे झोंपड़ियों के पर्व का नाम जुड़ा है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “चौक” से आशय फाटक के पास के खुले सार्वजनिक स्थान से है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצְאוּ הָעָם
  choice: लोग बाहर गए
  rationale: यह יצא के सामान्य कथात्मक अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וַיָּבִיאוּ
  choice: उन्हें ले आए
  rationale: हिफ़ील रूप का अर्थ ‘ले आना’ है। कर्म पिछले पद में बताई गई डालियों और पत्तियों की ओर संकेत करता है; हिन्दी में सर्वनाम उस निहित कर्म को बनाए रखता है।
- source_word: וַיַּעֲשׂוּ לָהֶם סֻכּוֹת
  choice: उन्होंने अपने लिए झोंपड़ियाँ बनाईं
  rationale: ‘अपने लिए’ לָהֶם को व्यक्त करता है। ‘झोंपड़ियाँ’ अस्थायी पर्वीय संरचनाओं का सहज हिन्दी नाम है और झोंपड़ियों के पर्व से शब्द-संबंध बनाए रखता है।
- source_word: אִישׁ עַל גַּגּוֹ
  choice: अपनी-अपनी छतों पर
  rationale: אִישׁ यहाँ वितरणात्मक है। ‘अपनी-अपनी’ प्रत्येक व्यक्ति के अपनी छत पर बनाने का भाव स्वाभाविक हिन्दी में प्रकट करता है।
- source_word: וּבְחַצְרֹתֵיהֶם
  choice: अपने आँगनों में
  rationale: חָצֵר किसी घिरे हुए आँगन या प्रांगण को दर्शाता है; निजी घरों के संदर्भ में ‘आँगन’ सबसे स्वाभाविक है।
- source_word: וּבְחַצְרוֹת בֵּית הָאֱלֹהִים
  choice: परमेश्वर के भवन के आँगनों में
  rationale: यह मन्दिर-परिसर के आँगनों को दर्शाता है और בֵּית הָאֱלֹהִים का पारदर्शी रूपान्तरण है।
- source_word: רְחוֹב
  choice: चौक
  rationale: यह फाटक के पास के खुले सार्वजनिक स्थान या प्रांगण का बोध कराता है; ‘चौक’ वर्तमान हिन्दी में संक्षिप्त और सुबोध है।
- source_word: שַׁעַר הַמַּיִם
  choice: जल फाटक
  rationale: यह नगर के एक नामित फाटक का पारदर्शी और प्रचलित हिन्दी रूप है।
- source_word: שַׁעַר אֶפְרָיִם
  choice: एप्रैम फाटक
  rationale: यह स्थान-नाम को स्पष्ट रखता है और हिन्दी में सहज नामित फाटक के रूप में पढ़ा जाता है।
