base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/002.yaml
  text: Then Ezra the priest brought the law before the assembly[a], both men and women, and all who could understand what they heard[b], on the first day of the seventh month.
translation:
  language: hi
  text: तब एज्रा याजक सातवें महीने के पहले दिन व्यवस्था को उस सभा[a] के सामने लाया, जिसमें पुरुष, स्त्रियाँ और वे सभी लोग थे जो सुनकर समझ सकते थे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पुरुष से लेकर स्त्री तक।” हिब्रू में यह पदबंध सभा के पूरे दायरे को व्यक्त करता है।
    reason: lexical_alternative
  - marker: b
    text: या, “वे सभी जो सुनने के द्वारा समझते थे,” अर्थात् वे जो पाठ को समझने में समर्थ थे।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִיא
  choice: तब ... ले आया
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में क्रम व्यक्त करता है, और ‘ले आया’ הֵבִיא के कारक अर्थ को बनाए रखता है।
- source_word: הַכֹּהֵן
  choice: याजक
  rationale: यह एज्रा के साथ प्रयुक्त स्पष्ट पदवी है; हिन्दी बाइबलीय प्रयोग में ‘याजक’ सटीक और परिचित है।
- source_word: הַתּוֹרָה
  choice: व्यवस्था
  rationale: इस प्रसंग में मूसा की सार्वजनिक रूप से पढ़ी जाने वाली तोराह अभिप्रेत है। ‘व्यवस्था’ उसका प्रचलित, गरिमापूर्ण हिन्दी रूप है; केवल सामान्य ‘शिक्षा’ कहना यहाँ अत्यधिक व्यापक होगा।
- source_word: לִפְנֵי הַקָּהָל
  choice: सभा के सामने
  rationale: यह सार्वजनिक उपस्थिति और औपचारिक सभा, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מֵאִישׁ וְעַד אִשָּׁה
  choice: पुरुषों और स्त्रियों के
  rationale: हिब्रू का शाब्दिक रूप ‘पुरुष से लेकर स्त्री तक’ है, जो सम्मिलित पूरे दायरे को बताता है। वाक्य में ‘के सामने’ की पुनरावृत्ति के साथ यह अर्थ स्वाभाविक हिन्दी में सुरक्षित रहता है।
- source_word: וְכֹל מֵבִין לִשְׁמֹעַ
  choice: और उन सबके सामने जो सुनकर समझ सकते थे
  rationale: यह केवल ध्वनि सुन पाने के बजाय सुनाई गई बात को ग्रहण करने की क्षमता व्यक्त करता है और לִשְׁמֹעַ की श्रवण-संबंधी अस्पष्टता भी बनाए रखता है।
- source_word: בְּיוֹם אֶחָד לַחֹדֶשׁ הַשְּׁבִיעִי
  choice: सातवें महीने के पहले दिन
  rationale: हिब्रू तिथि-सूत्र का सहज आधुनिक हिन्दी रूप।
theological_decisions:
- issue: श्रोताओं का लिंग-सूचक वर्णन
  choice: पुरुषों और स्त्रियों के सामने
  alternative: पुरुष से लेकर स्त्री तक
  rationale: मूल पाठ दोनों लिंगों का स्पष्ट उल्लेख करके सभा का व्यापक दायरा बताता है। स्वाभाविक हिन्दी के लिए बहुवचन युग्म अपनाया गया है, बिना वर्णन को लिंग-निरपेक्ष बनाए।
- issue: תּוֹרָה का अनुवाद
  choice: व्यवस्था
  alternative: तोराह; शिक्षा
  rationale: तात्कालिक संदर्भ में वाचा-संबंधी मूसीय ग्रंथ का सार्वजनिक पठन है। ‘व्यवस्था’ इस भार को रखता है और सामान्य हिन्दी बाइबल पाठक के लिए स्पष्ट है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल। हिब्रू वाक्य में לִפְנֵי का प्रभाव पूरी सम्मिलित सूची पर है; स्पष्ट हिन्दी के लिए ‘के सामने’ को अर्थगत रूप से पुरुषों, स्त्रियों और समझ सकने वालों तक विस्तारित किया गया है।
