id: NEH.8.1
reference: Nehemiah 8:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֵּאָסְפ֤וּ כָל הָ/עָם֙ כְּ/אִ֣ישׁ אֶחָ֔ד אֶל הָ֣/רְח֔וֹב אֲשֶׁ֖ר לִ/פְנֵ֣י שַֽׁעַר הַ/מָּ֑יִם וַ/יֹּֽאמְרוּ֙ לְ/עֶזְרָ֣א הַ/סֹּפֵ֔ר לְ/הָבִ֗יא אֶת סֵ֨פֶר֙ תּוֹרַ֣ת מֹשֶׁ֔ה אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת יִשְׂרָאֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/001.yaml
  text: And all the people gathered as one man at the square that was before the Water Gate[a], and they told Ezra the scribe to bring the Book of the Law of Moses, which Yahweh had commanded Israel.
translation:
  language: hi
  text: तब सब लोग मानो एक ही व्यक्ति हों, जल-फाटक के सामने के चौक में इकट्ठे हुए। उन्होंने शास्त्री एज्रा से कहा कि वह मूसा की व्यवस्था की पुस्तक ले आए, जिसे मानने की आज्ञा यहोवा ने इस्राएल को दी थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּאָסְפוּ כָל־הָעָם
  choice: सब लोग ... इकट्ठे हुए
  rationale: निफ़ाल क्रिया समुदाय के एक स्थान पर एकत्र होने को व्यक्त करती है; यह आधुनिक हिन्दी में स्वाभाविक है।
- source_word: כְּאִישׁ אֶחָד
  choice: एक मनुष्य के समान होकर
  rationale: इब्रानी मुहावरे के दृश्य रूप और सामूहिक एकता—दोनों को बनाए रखता है।
- source_word: הָרְחוֹב
  choice: चौक
  rationale: यह नगर के खुले सार्वजनिक स्थान का सूचक है, आधुनिक अर्थ वाले मार्ग या सड़क का नहीं।
- source_word: שַׁעַר הַמָּיִם
  choice: जल-फाटक
  rationale: स्थान-नाम का संक्षिप्त और पारंपरिक हिन्दी रूप।
- source_word: וַיֹּאמְרוּ לְעֶזְרָא ... לְהָבִיא
  choice: उन्होंने शास्त्री एज्रा से कहा कि वह ... ले आए
  rationale: क्रिया का मूल अर्थ ‘कहा’ है; आशय जोड़े बिना हिन्दी में आज्ञार्थक आशय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַסֹּפֵר
  choice: शास्त्री
  rationale: एज्रा की लेखक तथा व्यवस्था-विशेषज्ञ की मान्य भूमिका के लिए प्रचलित बाइबिलीय हिन्दी पद।
- source_word: סֵפֶר תּוֹרַת מֹשֶׁה
  choice: मूसा की व्यवस्था की पुस्तक
  rationale: निर्मित पदबंध को निकटता से व्यक्त करता है और ‘पुस्तक’ स्क्रॉल/लिखित ग्रंथ के व्यापक अर्थ को समेटता है।
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶת־יִשְׂרָאֵל
  choice: जिसकी आज्ञा यहोवा ने इस्राएल को दी थी
  rationale: इब्रानी में ‘इस्राएल’ को चिह्नित कर्म मानते हुए वाक्य को स्वाभाविक हिन्दी में निकटता से प्रस्तुत करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुर्वर्णीय दिव्य नाम को हिन्दी में सुविज्ञात व्यक्तिगत नाम के रूप में प्रस्तुत करता है, किसी उपाधि से प्रतिस्थापित नहीं करता।
theological_decisions:
- issue: כְּאִישׁ אֶחָד में सामूहिक एकता
  choice: एक मनुष्य के समान होकर
  alternative: एक होकर / एक मन से
  rationale: मूल का पुल्लिंग एकवचन चित्र बनाए रखते हुए मुहावरे में निहित एकता को संदर्भ से स्पष्ट रहने देता है।
- issue: व्यवस्था की आज्ञा किसे दी गई
  choice: जिसकी आज्ञा यहोवा ने इस्राएल को दी थी
  alternative: जिसे यहोवा ने इस्राएल के लिए ठहराया था
  rationale: אֵת सामान्यतः कर्म-चिह्न है; अतः इस्राएल को आज्ञा का प्राप्तकर्ता मानना व्याकरण के अधिक निकट है, जबकि ‘के लिए’ अतिरिक्त व्याख्या जोड़ सकता है।
- issue: दिव्य नाम יְהוָה
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: व्यक्तिगत दिव्य नाम को नाम के रूप में सुरक्षित रखा गया है; हिन्दी पाठकों के लिए ‘यहोवा’ अधिक स्थापित रूप है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमामय किंतु सरल कथात्मक शैली। ‘व्यवस्था’ और ‘शास्त्री’ जैसे स्थापित बाइबिलीय शब्द रखे गए हैं। कोई पादटिप्पणी आवश्यक नहीं, क्योंकि ‘एक मनुष्य के समान होकर’ मूल मुहावरे को पाठ में ही सुरक्षित रखता है।
