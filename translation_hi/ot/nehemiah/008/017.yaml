id: NEH.8.17
reference: Nehemiah 8:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יַּֽעֲשׂ֣וּ כָֽל הַ֠/קָּהָל הַ/שָּׁבִ֨ים מִן הַ/שְּׁבִ֥י סֻכּוֹת֮ וַ/יֵּשְׁב֣וּ בַ/סֻּכּוֹת֒ כִּ֣י לֹֽא עָשׂ֡וּ מִ/ימֵי֩ יֵשׁ֨וּעַ בִּן נ֥וּן כֵּן֙ בְּנֵ֣י יִשְׂרָאֵ֔ל עַ֖ד הַ/יּ֣וֹם הַ/ה֑וּא וַ/תְּהִ֥י שִׂמְחָ֖ה גְּדוֹלָ֥ה מְאֹֽד־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/017.yaml
  text: And all the assembly of those who had returned from the captivity made booths and lived in the booths[a], for the sons of Israel had not done so from the days of Jeshua son of Nun until that day. And there was very great rejoicing.
translation:
  language: hi
  text: बंधुआई से लौटे हुए लोगों की सारी सभा ने झोंपड़ियाँ बनाईं और उन झोंपड़ियों में रहे, क्योंकि नून के पुत्र येशू[a] के दिनों से उस दिन तक इस्राएल के पुत्रों ने ऐसा नहीं किया था। और बहुत ही बड़ा आनंद हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: येशू अर्थात नून का पुत्र यहोशू।
    reason: इस पद के इब्रानी पाठ में नाम का संक्षिप्त रूप יֵשׁוּעַ है; अन्य स्थानों में यही व्यक्ति प्रचलित रूप ‘यहोशू’ से जाना जाता है।
lexical_decisions:
- source_word: הַקָּהָל
  choice: सारी सभा
  rationale: यह शब्द एकत्र हुए पूरे समुदाय को दर्शाता है। ‘सभा’ उसके सामूहिक और एकत्रित स्वरूप को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: הַשָּׁבִים מִן הַשְּׁבִי
  choice: बंधुआई से लौटे हुए लोग
  rationale: यह सहभागी रूप लौटे हुए समुदाय की पहचान बताता है। ‘बंधुआई’ שְׁבִי के बंदी बनाए जाने और निर्वासन, दोनों से जुड़े भाव को निकटता से व्यक्त करता है।
- source_word: סֻכּוֹת
  choice: झोंपड़ियाँ
  rationale: संदर्भ पर्व के लिए बनाई गई अस्थायी छतदार शरणों का है। ‘झोंपड़ियाँ’ आधुनिक हिन्दी में स्पष्ट है और इसे पवित्र निवासस्थान से नहीं मिलाता।
- source_word: וַיֵּשְׁבוּ בַסֻּכּוֹת
  choice: उन झोंपड़ियों में रहे
  rationale: יָשַׁב का अर्थ संदर्भानुसार बैठना या निवास करना हो सकता है; यहाँ पर्व की रीति के अनुसार झोंपड़ियों में रहना अभिप्रेत है।
- source_word: כִּי לֹא עָשׂוּ ... כֵּן
  choice: क्योंकि ... ऐसा नहीं किया था
  rationale: ‘ऐसा’ ठीक पहले वर्णित झोंपड़ियाँ बनाने और उनमें रहने की ओर संकेत करता है। यह संक्षिप्तता बनाए रखता है और यह दावा नहीं करता कि पर्व कभी मनाया ही नहीं गया था।
- source_word: מִימֵי יֵשׁוּעַ בִּן נוּן
  choice: नून के पुत्र येशू के दिनों से
  rationale: मुख्य पाठ में इस पद के वास्तविक इब्रानी नामरूप יֵשׁוּעַ को ‘येशू’ के रूप में रखा गया है; अधिक परिचित ‘यहोशू’ की पहचान पादटिप्पणी में दी गई है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: यह इब्रानी के पुरुषवाचक वाचा-संबंधी सामुदायिक पदनाम को निकटता से सुरक्षित रखता है।
- source_word: וַתְּהִי שִׂמְחָה גְּדוֹלָה מְאֹד
  choice: और बहुत ही बड़ा आनंद हुआ
  rationale: ‘आनंद’ सामुदायिक हर्ष को स्वाभाविक हिन्दी में व्यक्त करता है, और ‘बहुत ही बड़ा’ גְּדוֹלָה מְאֹד की तीव्रता बनाए रखता है।
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל का अनुवाद
  choice: इस्राएल के पुत्रों
  alternative: इस्राएली; इस्राएल के लोग
  rationale: मूल पद व्याकरणतः पुरुषवाचक है और वाचा-संबंधी जातीय पदनाम के रूप में काम करता है; मुख्य पाठ उसकी शब्दरचना बनाए रखता है।
- issue: יֵשׁוּעַ בִּן נוּן की पहचान
  choice: नून के पुत्र येशू
  alternative: नून के पुत्र यहोशू
  rationale: इस पद में नाम का रूप יֵשׁוּעַ है, इसलिए मूल-पाठ की प्राथमिकता के अनुसार ‘येशू’ रखा गया है। वही व्यक्ति सामान्यतः ‘यहोशू’ नाम से जाना जाता है, जिसे पादटिप्पणी स्पष्ट करती है।
- issue: इस्राएल ने ‘ऐसा नहीं किया’ कथन का आशय
  choice: ठीक पहले वर्णित ढंग से झोंपड़ियाँ बनाना और उनमें रहना
  alternative: यहोशू के समय से पर्व का बिल्कुल न मनाया जाना
  rationale: כֵּן अनाफोरिक रूप से पहले वर्णित कार्य की ओर संकेत करता है। अनुवाद मूल की संक्षिप्तता और संभावित तनाव बनाए रखता है, पर पूर्ण ऐतिहासिक गैर-अनुष्ठान का अर्थ आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘बंधुआई’, ‘सभा’ और ‘झोंपड़ियाँ’ मूल अर्थ के निकट रहते हुए प्रचलित बाइबलीय हिन्दी से भी स्वाभाविक संबंध रखते हैं। पादटिप्पणी-चिह्न नाम के तुरंत बाद रखा गया है, क्योंकि टिप्पणी उसी नामरूप को स्पष्ट करती है।
