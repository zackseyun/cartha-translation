  text: וַ/יִּפְתַּ֨ח עֶזְרָ֤א הַ/סֵּ֨פֶר֙ לְ/עֵינֵ֣י כָל הָ/עָ֔ם כִּֽי מֵ/עַ֥ל כָּל הָ/עָ֖ם הָיָ֑ה וּ/כְ/פִתְח֖/וֹ עָֽמְד֥וּ כָל הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/005.yaml
  text: Ezra opened the book in the sight of all the people[a], for he was above all the people; and when he opened it, all the people stood.
translation:
  language: hi
  text: एज्रा ने सब लोगों के देखते-देखते पुस्तक[a] खोली, क्योंकि वह सब लोगों से ऊँचे स्थान पर था। जब उसने उसे खोला, तो सब लोग खड़े हो गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “स्क्रॉल।” इब्रानी शब्द סֵפֶר किसी लिखित दस्तावेज़ को, जिसमें स्क्रॉल के रूप का दस्तावेज़ भी शामिल है, दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְתַּח
  choice: खोली
  rationale: פתח का सामान्य अर्थ ‘खोलना’ है। प्राचीन भौतिक रूप सम्भवतः पुस्तक-पत्र था, फिर भी मूल क्रिया को अनावश्यक रूप से ‘खोला/फैलाया’ की विशिष्ट क्रिया में नहीं बदला गया।
- source_word: הַסֵּפֶר
  choice: पुस्तक
  rationale: סֵפֶר लिखित दस्तावेज़, पुस्तक या पुस्तक-पत्र को सूचित कर सकता है। मुख्य पाठ में स्वाभाविक और प्रचलित ‘पुस्तक’ रखा गया है तथा प्राचीन भौतिक रूप को पादटिप्पणी में दिया गया है।
- source_word: לְעֵינֵי
  choice: सब लोगों के देखते-देखते
  rationale: शाब्दिक भाव ‘आँखों के सामने’ है। यह चयन सार्वजनिक रूप से सबको दिखाई देने के दृश्य भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: כָל הָעָם
  choice: सब लोग
  rationale: עָם यहाँ एकत्र जनसमुदाय को दर्शाता है। ‘सब लोग’ सीधा, सहज है और पद में इसकी पुनरावृत्ति को बनाए रखता है।
- source_word: כִּי מֵעַל כָּל הָעָם הָיָה
  choice: क्योंकि वह सब लोगों से ऊँचे स्थान पर था
  rationale: מֵעַל यहाँ सामाजिक श्रेष्ठता नहीं, शारीरिक ऊँचाई बताता है। ‘ऊँचे स्थान पर’ जोड़ने से हिन्दी में यह स्थानगत अर्थ स्पष्ट रहता है।
- source_word: וּכְפִתְחוֹ
  choice: जब उसने उसे खोला
  rationale: כְּ का यहाँ कालवाचक अर्थ ‘जब/जैसे ही’ है। ‘उसे’ का संकेत पहले उल्लिखित पुस्तक की ओर है।
- source_word: עָמְדוּ
  choice: खड़े हो गए
  rationale: עמד का अर्थ ‘खड़ा होना/खड़े रहना’ है। प्रसंग में पुस्तक खोले जाने पर लोगों की प्रतिक्रिया व्यक्त होती है, इसलिए हिन्दी का ‘खड़े हो गए’ स्वाभाविक है, यद्यपि केवल ‘खड़े रहे’ व्याकरणतः सम्भव समझ हो सकती है।
