base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/018.yaml
  text: And he read from the Book of the Law of God day by day[a], from the first day to the last day. And they kept the feast seven days, and on the eighth day there was a solemn assembly[c][b], according to the ordinance.
translation:
  language: hi
  text: उसने परमेश्वर की व्यवस्था की पुस्तक[a] में से पहले दिन से अंतिम दिन तक प्रतिदिन पढ़ा। उन्होंने सात दिन तक पर्व मनाया, और आठवें दिन विधान के अनुसार एक गंभीर सभा[b] हुई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “परमेश्वर की व्यवस्था के लिखित ग्रंथ में से।” इब्रानी शब्द किसी लिखित दस्तावेज़ को सूचित कर सकता है, जिसमें लपेटा हुआ पत्र भी शामिल है।
    reason: lexical_alternative
  - marker: b
    text: या “समापन सभा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: वह ... पढ़ता रहा
  rationale: קרא के साथ लिखित ग्रंथ का उल्लेख यहाँ पढ़ने, सम्भवतः सार्वजनिक रूप से पढ़ने, का अर्थ देता है। एकवचन कर्ता को बनाए रखा गया है; अपूर्ण रूप की पुनरावृत्तिमूलक क्रिया को ‘पढ़ता रहा’ व्यक्त करता है।
- source_word: בְּסֵפֶר תּוֹרַת הָאֱלֹהִים
  choice: परमेश्वर की व्यवस्था की पुस्तक में से
  rationale: सम्बद्ध पद-श्रृंखला को स्वाभाविक हिन्दी में रखा गया है। קרא के साथ בְּ का आशय किसी लिखित ग्रंथ में से पढ़ना है। סֵפֶר के भौतिक रूप को अनावश्यक रूप से निश्चित न करने के लिए ‘पुस्तक’ मुख्य पाठ में और विकल्प पाद-टिप्पणी में दिया गया है।
- source_word: יוֹם בְּיוֹם
  choice: प्रतिदिन
  rationale: यह इब्रानी मुहावरा हर दिन दोहराई गई क्रिया बताता है; ‘प्रतिदिन’ आधुनिक हिन्दी में संक्षिप्त और स्पष्ट है।
- source_word: מִן הַיּוֹם הָרִאשׁוֹן עַד הַיּוֹם הָאַחֲרוֹן
  choice: पहले दिन से अंतिम दिन तक
  rationale: समय की पूरी अवधि को सीधे और स्रोत के दोनों सिरों को सुरक्षित रखते हुए व्यक्त करता है।
- source_word: וַיַּעֲשׂוּ חָג
  choice: उन्होंने ... पर्व मनाया
  rationale: עשה + חג का अर्थ पर्व का पालन या उत्सव मनाना है। ‘पर्व मनाया’ सहज आधुनिक हिन्दी है और धार्मिक अवसर का भाव बनाए रखता है।
- source_word: עֲצֶרֶת
  choice: विशेष सभा
  rationale: यह पर्व से जुड़ी निर्धारित समापन सभा को सूचित करता है। ‘विशेष सभा’ उसके सामान्य सभा से भिन्न चरित्र को दर्शाती है, जबकि ‘गम्भीर’ जैसे शब्द से शोक का अनचाहा भाव नहीं आता; समापन का सम्भावित अर्थ पाद-टिप्पणी में सुरक्षित है।
- source_word: כַּמִּשְׁפָּט
  choice: विधान के अनुसार
  rationale: מִשְׁפָּט यहाँ प्रथामात्र नहीं, बल्कि निर्धारित नियम या विधि को दर्शाता है। ‘विधान के अनुसार’ उसके मानक और विधिक बल को बनाए रखता है।
theological_decisions:
- issue: पढ़ने वाले का एकवचन और पर्व मनाने वालों का बहुवचन
  choice: ‘वह ... पढ़ता रहा’ और ‘उन्होंने ... पर्व मनाया’
  alternative: दोनों क्रियाओं के लिए बहुवचन ‘उन्होंने पढ़ा’ और ‘उन्होंने मनाया’
  rationale: इब्रानी पाठ पाठक को एकवचन और समुदाय को बहुवचन में अलग करता है। इस भेद को बनाए रखने से कथात्मक भूमिकाएँ अस्पष्ट नहीं होतीं।
- issue: עֲצֶרֶת का धार्मिक-सामुदायिक स्वरूप
  choice: ‘विशेष सभा’
  alternative: ‘पवित्र सभा’, ‘गम्भीर सभा’ या ‘समापन सभा’
  rationale: मुख्य पाठ इस सभा के निर्धारित और विशिष्ट स्वरूप को बताता है, पर स्रोत से अधिक स्पष्ट धार्मिक या भावात्मक विशेषता नहीं जोड़ता। ‘समापन सभा’ का अर्थ सम्भव है, इसलिए उसे पाद-टिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘व्यवस्था’, ‘पर्व’ और ‘विधान’ जैसे परिचित बाइबिलीय शब्द बनाए गए हैं, पर अत्यधिक संस्कृतनिष्ठ या पुराने प्रयोगों से बचा गया है।
