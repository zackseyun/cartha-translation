base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/004.yaml
  text: Ezra the scribe stood on a wooden platform that they had made for the purpose[a], and beside him stood Mattithiah, Shema, Anaiah, Uriah, Hilkiah, and Maaseiah on his right hand, and Pedaiah, Mishael, Malchijah, Hashum, Hashbaddanah, Zechariah[b], and Meshullam on his left hand.
translation:
  language: hi
  text: एज्रा शास्त्री उस लकड़ी के मंच[a] पर खड़ा हुआ जिसे उन्होंने इस उद्देश्य के लिए बनाया था। उसके दाहिनी ओर मत्तित्याह, शेमा, अनायाह, ऊरियाह, हिल्कियाह और मासेयाह खड़े थे; और उसकी बाईं ओर पदायाह, मीशाएल, मल्कियाह, हाशूम, हशबद्दाना, जकर्याह और मशुल्लाम खड़े थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “लकड़ी की मीनार”; अर्थात लकड़ी की एक ऊँची संरचना या मंच।'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִגְדַּל עֵץ
  choice: लकड़ी का मंच
  rationale: शाब्दिक अर्थ ‘लकड़ी की मीनार’ है, पर सार्वजनिक पाठ के प्रसंग में यह लोगों के सामने खड़े होने के लिए बनाई गई ऊँची लकड़ी की संरचना है; ‘मंच’ आधुनिक हिन्दी में उसके कार्य को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לַדָּבָר
  choice: इस काम के लिए
  rationale: דָּבָר का अर्थ ‘बात, मामला, काम’ हो सकता है। यहाँ यह उस उद्देश्य को सूचित करता है जिसके लिए मंच बनाया गया था; ‘इस काम के लिए’ अर्थ को अनावश्यक रूप से सीमित किए बिना सहज हिन्दी देता है।
- source_word: הַסֹּפֵר
  choice: शास्त्री
  rationale: इस प्रसंग में סֹפֵר लिखित व्यवस्था में निपुण व्यक्ति को दर्शाता है। हिन्दी बाइबलीय प्रयोग में ‘शास्त्री’ संक्षिप्त, प्रतिष्ठित और परिचित पद है।
- source_word: אֶצְלוֹ
  choice: उसके पास
  rationale: यह निकटता व्यक्त करता है और दाईं तथा बाईं ओर खड़े पुरुषों की सूची के लिए स्वाभाविक हिन्दी है।
- source_word: עַל יְמִינוֹ / וּמִשְּׂמֹאלוֹ
  choice: उसकी दाईं ओर / उसकी बाईं ओर
  rationale: मूल के स्थान-सूचक समानांतर भाव को स्पष्ट और सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: וַיַּעֲמֹד
  choice: खड़ा हुआ / खड़े थे
  rationale: एज्रा के लिए कथात्मक क्रिया ‘खड़ा हुआ’ उपयुक्त है; साथ खड़े पुरुषों के लिए हिन्दी वाक्य-प्रवाह में ‘खड़े थे’ उनकी स्थिति को स्वाभाविक रूप से व्यक्त करता है।
