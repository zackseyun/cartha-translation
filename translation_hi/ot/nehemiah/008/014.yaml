  text: וַֽ/יִּמְצְא֖וּ כָּת֣וּב בַּ/תּוֹרָ֑ה אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ בְּ/יַד מֹשֶׁ֔ה אֲשֶׁר֩ יֵשְׁב֨וּ בְנֵֽי יִשְׂרָאֵ֧ל בַּ/סֻּכּ֛וֹת בֶּ/חָ֖ג בַּ/חֹ֥דֶשׁ הַ/שְּׁבִיעִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/014.yaml
  text: And they found it written in the Law that Yahweh had commanded through Moses that the sons of Israel should dwell in booths during the feast[a], in the seventh month.
translation:
  language: hi
  text: और उन्होंने व्यवस्था में यह लिखा हुआ पाया कि याहवे ने मूसा के द्वारा आज्ञा दी थी कि इस्राएल के पुत्र[a] सातवें महीने के पर्व के समय झोंपड़ियों में रहें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस्राएली” अथवा “इस्राएल की संतान”; इब्रानी में “इस्राएल के पुत्र”।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְצְאוּ כָּתוּב
  choice: उन्होंने ... लिखा पाया
  rationale: यह अभिव्यक्ति इब्रानी की ‘लिखा हुआ पाया’ संरचना और भूतकालीन कथन—दोनों को स्वाभाविक हिन्दी में बनाए रखती है।
- source_word: בַּתּוֹרָה
  choice: व्यवस्था में
  rationale: यहाँ תּוֹרָה मूसा के द्वारा दी गई लिखित विधि-व्यवस्था को सूचित करती है; ‘व्यवस्था’ हिन्दी बाइबलीय प्रयोग में स्पष्ट और परिचित है।
- source_word: צִוָּה יְהוָה
  choice: याहवे ने ... आज्ञा दी थी
  rationale: याहवे मूल पाठ के covenant name को प्रत्यक्ष रूप से दर्शाता है; ‘दी थी’ पहले दी गई उस आज्ञा को व्यक्त करता है जो अब लिखी हुई मिली।
- source_word: בְּיַד מֹשֶׁה
  choice: मूसा के द्वारा
  rationale: शाब्दिक ‘मूसा के हाथ से’ यहाँ माध्यम अथवा प्रतिनिधित्व का मुहावरा है; ‘के द्वारा’ आधुनिक हिन्दी में वही अर्थ देता है।
- source_word: יֵשְׁבוּ
  choice: रहें
  rationale: पर्व के प्रसंग में क्रिया का अर्थ अस्थायी आश्रयों में निवास करना है; ‘रहें’ सहज और सटीक है।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्र
  rationale: यह इब्रानी पद के स्पष्ट रूप ‘इस्राएल के पुत्र’ को बनाए रखता है, जबकि उसका सामूहिक आशय पादटिप्पणी में स्पष्ट किया गया है।
- source_word: בַּסֻּכּוֹת
  choice: झोंपड़ियों में
  rationale: סֻכּוֹת पर्व के लिए बनाई गई अस्थायी डाल-पत्तों की झोंपड़ियों को दर्शाता है; यह सामान्य पाठक के लिए ठोस और बोधगम्य है।
- source_word: בֶּחָג
  choice: पर्व के समय
  rationale: सप्रत्यय पद प्रसंग में ज्ञात पर्व की ओर संकेत करता है; ‘पर्व के समय’ अवधि का भाव सहज रूप से व्यक्त करता है।
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: सातवें महीने के
  rationale: यह सीधे समय-सूचक वाक्यांश को व्यक्त करता है और हिन्दी वाक्यक्रम में पर्व के साथ स्वाभाविक रूप से जुड़ता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत वाचा-नाम है; ‘याहवे’ उसका प्रत्यक्ष लिप्यंतरण करता है और उसे उपाधि में नहीं बदलता।
- issue: בְנֵי יִשְׂרָאֵל का सामूहिक आशय
  choice: मुख्य पाठ में ‘इस्राएल के पुत्र’, पादटिप्पणी में ‘इस्राएली’
  alternative: मुख्य पाठ में ‘इस्राएली’ या ‘इस्राएल की संतान’
  rationale: औपचारिक पद को सुरक्षित रखा गया है, पर पादटिप्पणी स्पष्ट करती है कि प्रसंग में इसका प्रयोग समुदाय के लिए सामूहिक रूप से हो सकता है; इससे लिंग और समावेशन का तनाव चुपचाप हल नहीं किया जाता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘झोंपड़ियों’ से पर्व की अस्थायी संरचनाओं का ठोस अर्थ मिलता है; ‘इस्राएल के पुत्र’ मूल की औपचारिकता बनाए रखता है और वैकल्पिक सामूहिक अर्थ पादटिप्पणी में दिया गया है।
