  text: उन्होंने परमेश्वर की व्यवस्था की पुस्तक में से स्पष्ट रूप से[a] पढ़ा, उसका अर्थ समझाया, और लोगों ने पढ़े गए पाठ को समझ लिया।
  philosophy: optimal-equivalence
  footnotes:
