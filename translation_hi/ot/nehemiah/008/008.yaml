lexical_decisions:
- source_word: וַיִּקְרְאוּ
  choice: उन्होंने ... पढ़ा
  rationale: लिखित पुस्तक कर्म होने के कारण קרא का सामान्य अर्थ यहाँ ‘पढ़ना’ है; सार्वजनिक पाठ का प्रसंग भी इसी अर्थ का समर्थन करता है।
- source_word: בַסֵּפֶר בְּתוֹרַת הָאֱלֹהִים
  choice: परमेश्वर की व्यवस्था की पुस्तक में से
  rationale: दोनों पद एक ही ग्रंथ की ओर संकेत करते हैं। हिंदी में ‘परमेश्वर की व्यवस्था की पुस्तक में से’ स्वाभाविक ढंग से पुस्तक को स्रोत और व्यवस्था को उसकी विषयवस्तु/पहचान बताता है।
- source_word: מְפֹרָשׁ
  choice: स्पष्ट रूप से
  rationale: यह शब्द पाठ को साफ़ या बोधगम्य बनाने का भाव देता है, पर अपने आप यह निश्चित नहीं करता कि ऐसा स्पष्ट उच्चारण, व्याख्या या अनुवाद द्वारा हुआ; इसलिए मुख्य पाठ में व्यापक अर्थ रखा गया है और विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: וְשׂוֹם שֶׂכֶל
  choice: उसका अर्थ समझाया
  rationale: ‘समझ रखी/दी’ जैसे शाब्दिक रूप की अपेक्षा यह हिंदी में मुहावरेदार है और पाठ का आशय बोधगम्य कराने की क्रिया व्यक्त करता है।
- source_word: וַיָּבִינוּ בַמִּקְרָא
  choice: और लोगों ने पढ़ी गई बात को समझ लिया
  rationale: क्रिया का बहुवचन कर्ता प्रसंग में सुनने वाले लोग हैं। ‘पढ़ी गई बात’ מִקְרָא के पाठ और विषयवस्तु दोनों पहलुओं को सहज हिंदी में व्यक्त करता है।
