  text: וַ/יֵּלְכ֨וּ כָל הָ/עָ֜ם לֶ/אֱכֹ֤ל וְ/לִ/שְׁתּוֹת֙ וּ/לְ/שַׁלַּ֣ח מָנ֔וֹת וְ/לַ/עֲשׂ֖וֹת שִׂמְחָ֣ה גְדוֹלָ֑ה כִּ֤י הֵבִ֨ינוּ֙ בַּ/דְּבָרִ֔ים אֲשֶׁ֥ר הוֹדִ֖יעוּ לָ/הֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/012.yaml
  text: And all the people went away to eat and drink[a], to send portions, and to celebrate with great joy[b], because they had understood the words that had been made known to them.
translation:
  language: hi
  text: तब सब लोग खाने-पीने, भोजन के हिस्से भेजने[a], और बड़े आनन्द से उत्सव मनाने चले गए, क्योंकि वे उन बातों को समझ गए थे जो उन्हें बताई गई थीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘हिस्से भेजने’ है—अर्थात उत्सव के भोजन में से दूसरों के लिए हिस्से भेजना।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: चले गए
  rationale: यह कथात्मक क्रिया सभा से विदा होकर आगे बताए गए कार्य करने जाने को व्यक्त करती है।
- source_word: לֶאֱכֹל וְלִשְׁתּוֹת
  choice: खाने-पीने
  rationale: दोनों उद्देश्यवाचक क्रियाओं का स्वाभाविक और सीधा हिन्दी रूप।
- source_word: וּלְשַׁלַּח מָנוֹת
  choice: भोजन के हिस्से दूसरों को भेजने
  rationale: מָנוֹת उत्सव के प्रसंग में भोजन के नियत हिस्सों को सूचित करता है; पिछले पद के संदर्भ से दूसरों के साथ बाँटना निहित है।
- source_word: וְלַעֲשׂוֹת שִׂמְחָה גְדוֹלָה
  choice: बड़े आनन्द के साथ उत्सव मनाने
  rationale: शाब्दिक भाव ‘बड़ा आनन्द करना’ है; यह रूप आधुनिक हिन्दी में स्वाभाविक रहते हुए आनन्द की तीव्रता और उत्सवी क्रिया दोनों रखता है।
- source_word: כִּי הֵבִינוּ
  choice: क्योंकि ... उन्हें समझ आ गए थे
  rationale: כִּי स्पष्ट कारण बताता है और पूर्ण क्रिया उस समझ को बाद के उत्सव का आधार बनाती है।
- source_word: בַּדְּבָרִים
  choice: वचन
  rationale: דְּבָרִים का अर्थ ‘वचन’ या ‘बातें’ हो सकता है; व्यवस्था के सार्वजनिक पाठ और शिक्षा के संदर्भ में ‘वचन’ मौखिक विषयवस्तु को सुरक्षित रखता है।
- source_word: אֲשֶׁר הוֹדִיעוּ לָהֶם
  choice: जो ... उन्हें समझाए गए थे
  rationale: ידע के हिफ़ील रूप का मूल भाव ‘जानकारी देना/ज्ञात कराना’ है; निकट संदर्भ में व्याख्या द्वारा समझाना स्वाभाविक है, यद्यपि ‘जिन्हें उनके लिए ज्ञात कराया गया था’ अधिक शाब्दिक विकल्प है।
theological_decisions:
- issue: व्यवस्था के प्रति लोगों की प्रतिक्रिया का स्वरूप
  choice: उनका उत्सव उन वचनों को समझ लेने के कारण था जो उन्हें समझाए गए थे।
  alternative: इसे विशेष रूप से पश्चात्ताप के बाद का उत्सव या तकनीकी अर्थ में वाचा-नवीकरण कहना।
  rationale: पद स्वयं आनन्द का कारण वचनों की समझ को बताता है; अनुवाद इससे आगे कोई विशिष्ट धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘वचन’ धार्मिक संदर्भ के अनुकूल है, जबकि वाक्य-विन्यास बोझिल शाब्दिकता से बचता है।
