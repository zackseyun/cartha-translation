revisions:
- from: तब सब लोग खाने-पीने, भोजन के हिस्से दूसरों को भेजने[a] और बड़े आनन्द के साथ उत्सव मनाने चले गए, क्योंकि जो वचन उन्हें समझाए गए थे, वे उन्हें समझ आ गए थे।
  to: तब सब लोग खाने-पीने, भोजन के हिस्से भेजने[a], और बड़े आनन्द से उत्सव मनाने चले गए, क्योंकि वे उन बातों को समझ गए थे जो उन्हें बताई गई थीं।
  rationale: The revision retains every stated activity and the causal sequence of the Hebrew while replacing an over-specific and repetitive final expression with natural Hindi. The footnote preserves the contextual understanding that the portions were food sent to others without adding an explicit recipient to the Hebrew's main wording.
  reviewer_model: gpt-5.6-terra
