base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/009.yaml
  text: Then Nehemiah the governor[a], Ezra the priest and scribe, and the Levites who were instructing the people said to all the people, “This day is holy to Yahweh your God[b]. Do not mourn or weep.” For all the people were weeping as they heard the words of the law.
translation:
  language: hi
  text: तब राज्यपाल[a] नहेमायाह, याजक और शास्त्री एज्रा, और लोगों को समझाने वाले लेवियों ने सब लोगों से कहा, “आज का दिन तुम्हारे परमेश्वर यहोवा के लिए पवित्र है। शोक मत करो और मत रोओ।” क्योंकि व्यवस्था[b] के वचन सुनते समय सब लोग रो रहे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तिर्शाता,” फ़ारसी शासन-व्यवस्था की एक प्रशासनिक उपाधि।
    reason: lexical_alternative
  - marker: b
    text: या “तोरा के वचन।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתִּרְשָׁתָא
  choice: राज्यपाल
  rationale: यह फ़ारसी काल की एक प्रशासनिक उपाधि है; ‘राज्यपाल’ सामान्य हिन्दी पाठक को उसका कार्य स्पष्ट रूप से बताता है, जबकि मूल उपाधि को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: הַכֹּהֵן הַסֹּפֵר
  choice: याजक और शास्त्री
  rationale: दोनों संज्ञाएँ एज्रा की भूमिकाएँ बताती हैं; यह अनुवाद दोनों पदों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: הַלְוִיִּם הַמְּבִינִים אֶת־הָעָם
  choice: लोगों को समझानेवाले लेवी
  rationale: בין के हिफ़ईल रूप का भाव लोगों को समझ प्रदान करना या समझाना है; यह वाक्यांश उनकी शिक्षण-भूमिका को सहज हिन्दी में व्यक्त करता है।
- source_word: הַיּוֹם קָדֹשׁ הוּא
  choice: आज का दिन ... पवित्र है
  rationale: यह मूल कथन के धार्मिक अर्थ और ‘दिन’ पर दिए बल, दोनों को स्पष्ट रखता है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: לְ यहाँ समर्पण या संबंध व्यक्त करता है; ‘के लिए’ स्वाभाविक हिन्दी है और परमेश्वर के व्यक्तिगत वाचा-नाम को सुरक्षित रखता है।
- source_word: תִּתְאַבְּלוּ
  choice: शोक मत करो
  rationale: क्रिया बाहरी रूप से प्रकट किए जानेवाले मातम या शोक को सूचित करती है और अगले ‘मत रोओ’ से अलग अर्थ बनाए रखती है।
- source_word: תִּבְכּוּ / בוֹכִים
  choice: मत रोओ / रो रहे थे
  rationale: यह गंभीर भावनात्मक प्रतिक्रिया को स्पष्ट, वर्तमान हिन्दी में व्यक्त करता है।
- source_word: כְּשָׁמְעָם
  choice: सुनते समय
  rationale: כְּ के साथ क्रिया-रूप समकालिकता दिखाता है—लोग वचन सुनने के दौरान रो रहे थे।
- source_word: דִּבְרֵי הַתּוֹרָה
  choice: व्यवस्था के वचन
  rationale: इस सार्वजनिक वाचा-पाठ के प्रसंग में תּוֹרָה के स्थापित विधिक और शिक्षात्मक अर्थ को ‘व्यवस्था’ व्यक्त करता है; ‘तोरा’ वैकल्पिक रूप से पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ वाचा-नाम יהוה का प्रत्यक्ष प्रयोग करता है। हिन्दी में व्यापक रूप से पहचाना जाने वाला व्यक्तिगत नाम ‘यहोवा’ रखा गया है; ‘प्रभु’ करने से मूल में उपस्थित नाम अस्पष्ट हो जाता।
- issue: תּוֹרָה का अर्थ
  choice: व्यवस्था
  alternative: तोरा / शिक्षा
  rationale: नहेमायाह 8 में सार्वजनिक रूप से पढ़े जा रहे वाचा-पाठ के कारण ‘व्यवस्था’ प्रसंगानुकूल है, पर मूल शब्द के व्यापक ‘शिक्षा’ अर्थ को संकीर्ण करने की संभावना के कारण ‘तोरा’ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। वाक्य-संरचना मूल के क्रम के निकट है, पर हिन्दी की स्वाभाविकता के लिए पदों और विशेषणों को सहज क्रम दिया गया है।
