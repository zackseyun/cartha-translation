source:
  edition: WLC
  text: וַ/יִּקְרָא ב/וֹ֩ לִ/פְנֵ֨י הָ/רְח֜וֹב אֲשֶׁ֣ר לִ/פְנֵ֣י שַֽׁעַר הַ/מַּ֗יִם מִן הָ/אוֹר֙ עַד מַחֲצִ֣ית הַ/יּ֔וֹם נֶ֛גֶד הָ/אֲנָשִׁ֥ים וְ/הַ/נָּשִׁ֖ים וְ/הַ/מְּבִינִ֑ים וְ/אָזְנֵ֥י כָל הָ/עָ֖ם אֶל סֵ֥פֶר הַ/תּוֹרָֽה־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/003.yaml
  text: And he read from it before the square that was in front of the Water Gate[a], from daybreak until midday, in the presence of the men and the women and those who could understand[c][b]; and the ears of all the people were attentive to the Book of the Law.
translation:
  language: hi
  text: उसने जल फाटक के सामने वाले चौक में उस पुस्तक में से भोर से[a] दोपहर तक पुरुषों, स्त्रियों और समझ सकने वालों के सामने पढ़ा। सब लोग व्यवस्था की पुस्तक[c] को ध्यान से सुन रहे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उजाला होने से।” शाब्दिक अर्थ “प्रकाश से” है।
    reason: lexical_alternative
  - marker: c
    text: “पुस्तक” का अनुवाद “ग्रंथ-पत्र” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא בּוֹ
  choice: उसने ... उस पुस्तक में से ... पढ़ा
  rationale: संदर्भ में קרא लिखित सामग्री के सार्वजनिक वाचन को दर्शाता है और בּוֹ का स्वाभाविक हिन्दी रूप ‘उसमें से’ है। निकटवर्ती संदर्भ से पुस्तक स्पष्ट होने के कारण उसे वाक्य में व्यक्त किया गया है।
- source_word: לִפְנֵי הָרְחוֹב אֲשֶׁר לִפְנֵי שַׁעַר הַמַּיִם
  choice: जल फाटक के सामने वाले चौक में
  rationale: רְחוֹב खुले सार्वजनिक चौक को दर्शाता है। हिन्दी में स्थान का स्वाभाविक वर्णन ‘...के सामने वाले चौक में’ है और इससे सभा के स्थल का अर्थ स्पष्ट रहता है।
- source_word: מִן הָאוֹר עַד מַחֲצִית הַיּוֹם
  choice: पौ फटने से दोपहर तक
  rationale: מִן הָאוֹר का शाब्दिक अर्थ ‘उजाला होने से’ है और समय-सूचक अर्थ पौ फटना है; מַחֲצִית הַיּוֹם दिन के मध्य, अर्थात दोपहर, को दर्शाता है।
- source_word: נֶגֶד הָאֲנָשִׁים וְהַנָּשִׁים וְהַמְּבִינִים
  choice: पुरुषों, स्त्रियों और उन सभी के सामने ... जो समझ सकते थे
  rationale: नֶגֶד श्रोताओं की उपस्थिति में पढ़े जाने का भाव देता है। पाठ में पुरुषों और स्त्रियों का स्पष्ट उल्लेख बनाए रखा गया है, और participle הַמְּבִינִים को समझने की क्षमता रखने वालों के रूप में व्यक्त किया गया है।
- source_word: וְאָזְנֵי כָל הָעָם אֶל
  choice: सब लोगों के कान ... की ओर लगे रहे
  rationale: यह रूप मूल के सजीव ‘कान’ वाले मुहावरे को बनाए रखते हुए हिन्दी में ध्यानपूर्वक सुनने का स्वाभाविक अर्थ देता है।
- source_word: סֵפֶר הַתּוֹרָה
  choice: व्यवस्था की पुस्तक
  rationale: סֵפֶר पुस्तक, ग्रंथ या लपेटे हुए ग्रंथ को दर्शा सकता है। यहाँ תּוֹרָה लिखित और प्रामाणिक वाचा-संबंधी व्यवस्था है; ‘व्यवस्था की पुस्तक’ सामान्य हिन्दी पाठक के लिए स्पष्ट है।
theological_decisions:
- issue: सार्वजनिक वाचा-वाचन के संदर्भ में תּוֹרָה का अनुवाद
  choice: व्यवस्था
  alternative: शिक्षा; तोराह
  rationale: תּוֹרָה का व्यापक अर्थ ‘शिक्षा’ हो सकता है, पर नहेमायाह 8 में यह उस लिखित, प्रामाणिक वाचा-संबंधी ग्रंथ को दर्शाता है जिसे सभा में पढ़ा गया। ‘व्यवस्था’ इस संदर्भ को स्पष्ट रखती है, जबकि ‘तोराह’ सामान्य पाठक के लिए कम पारदर्शी हो सकता है।
- issue: सभा में शामिल समूहों का वर्णन
  choice: पुरुषों, स्त्रियों और उन सभी ... जो समझ सकते थे
  alternative: सभी समझदार लोगों सहित पुरुषों और स्त्रियों
  rationale: मूल पाठ पुरुषों और स्त्रियों का अलग-अलग उल्लेख करता है और फिर समझ सकने वालों को जोड़ता है। चुना हुआ रूप इन भेदों को बनाए रखता है और यह निश्चित नहीं करता कि तीसरा समूह केवल बच्चे थे।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘कान ... की ओर लगे रहे’ मूल इब्रानी की सजीव अभिव्यक्ति को हिन्दी के स्वाभाविक मुहावरे में बनाए रखता है। सभी पाद-टिप्पणी चिह्न सम्बद्ध शब्दों के तुरंत बाद रखे गए हैं।
