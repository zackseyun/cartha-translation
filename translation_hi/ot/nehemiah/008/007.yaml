base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/007.yaml
  text: And Jeshua[a], Bani, Sherebiah, Jamin, Akkub, Shabbethai, Hodiah, Maaseiah, Kelita, Azariah, Jozabad, Hanan[b], Pelaiah, and the Levites explained the law to the people, while the people remained in their places.
translation:
  language: hi
  text: येशू, बानी, शेरेब्याह, यामीन, अक्कूब, शब्बतै, होदियाह, मासेयाह, कलीता, अजर्याह, योजाबाद, हानान, पलायाह और लेवीय लोग लोगों को व्यवस्था समझने में सहायता करते थे[a], और लोग अपने-अपने स्थान पर बने रहे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “लोगों को व्यवस्था समझाते थे।” इब्रानी क्रिया कारक रूप में है—वे लोगों को व्यवस्था समझने योग्य बना रहे थे।
    reason: lexical_alternative
  - marker: b
    text: अथवा, “लोग अपनी-अपनी जगह खड़े रहे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יֵשׁוּעַ ... פְּלָאיָה
  choice: येशू, बानी, शेरेब्याह, यामीन, अक्कूब, शब्बतै, होदियाह, मासेयाह, कलीता, अजर्याह, योजाबाद, हानान, पलायाह
  rationale: व्यक्तिगत नामों का अनुवाद करने के बजाय उनका देवनागरी लिप्यंतरण किया गया है; जहाँ प्रचलित हिन्दी बाइबलीय रूप उपलब्ध हैं, उन्हें प्राथमिकता दी गई है।
- source_word: וְהַלְוִיִּם
  choice: और लेवीय लोग
  rationale: इब्रानी के संयोजक और संज्ञा को सीधे रखा गया है। सूचीबद्ध पुरुष स्वयं लेवीय हो सकते हैं, फिर भी पाठ के ‘और लेवीय’ को बनाए रखने से उसकी संरचना और संभावित संदिग्धता सुरक्षित रहती है।
- source_word: מְבִינִים
  choice: समझाते थे
  rationale: בין का हिफ़ील कृदंत किसी को समझने योग्य बनाने या समझ उत्पन्न करने का भाव देता है। ‘समझाते थे’ आधुनिक हिन्दी में स्वाभाविक है और इस कारक अर्थ को व्यक्त करता है।
- source_word: אֶת־הָעָם לַתּוֹרָה
  choice: व्यवस्था का अर्थ लोगों को
  rationale: हिन्दी में ‘व्यवस्था का अर्थ लोगों को समझाते थे’ स्वाभाविक ढंग से व्यक्त करता है कि लेवीय लोग व्यवस्था को बोधगम्य बना रहे थे। ‘का अर्थ’ संदर्भगत व्याख्या को स्पष्ट करता है, बिना यह दावा किए कि क्रिया केवल अनुवाद को सूचित करती है।
- source_word: לַתּוֹרָה
  choice: व्यवस्था
  rationale: इस वाचा-संबंधी सार्वजनिक पाठ के प्रसंग में תּוֹרָה के लिए ‘व्यवस्था’ सुबोध और हिन्दी बाइबल परंपरा में स्थापित शब्द है; ‘शिक्षा’ और ‘तोराह’ भी संभावित हैं।
- source_word: וְהָעָם עַל עָמְדָם
  choice: और लोग अपने-अपने स्थान पर बने रहे
  rationale: यह इब्रानी मुहावरा लोगों के अपनी निर्धारित जगह पर टिके रहने या खड़े रहने को सूचित करता है। ‘बने रहे’ अवस्था को अनावश्यक रूप से केवल खड़े होने तक सीमित नहीं करता; वैकल्पिक शाब्दिक अर्थ पादटिप्पणी में दिया गया है।
