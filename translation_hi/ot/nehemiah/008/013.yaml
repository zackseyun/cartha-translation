base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/013.yaml
  text: And on the second day[a], the heads of the fathers’ houses of all the people, the priests, and the Levites gathered to Ezra the scribe to gain insight into the words of the law.
translation:
  language: hi
  text: दूसरे दिन समस्त प्रजा के पितृकुलों के मुखिया[a], याजक और लेवी, व्यवस्था के वचनों को समझने के लिए शास्त्री एज्रा के पास इकट्ठे हुए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात कुलों या विस्तृत परिवारों के अगुए। इब्रानी में शाब्दिक रूप से “पिताओं के प्रधान”।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַיּוֹם הַשֵּׁנִי
  choice: दूसरे दिन
  rationale: यह स्वाभाविक हिन्दी में कथा के अगले दिन का संकेत देता है; आरम्भिक वाव का कथात्मक संबंध हिन्दी में प्रसंग और वाक्य-क्रम से स्पष्ट है।
- source_word: נֶאֶסְפוּ
  choice: इकट्ठे हुए
  rationale: निफ़अल बहुवचन यहाँ अकर्मक सामूहिक क्रिया व्यक्त करता है; ‘इकट्ठे हुए’ सामान्य और स्पष्ट हिन्दी है।
- source_word: רָאשֵׁי הָאָבוֹת לְכָל הָעָם
  choice: समस्त प्रजा के पितृकुलों के मुखिया
  rationale: यह पद पूरे समुदाय के वंशगत या विस्तृत पारिवारिक समूहों के अगुओं को दर्शाता है। ‘पितृकुल’ सामाजिक संरचना को बनाए रखते हुए हिन्दी में संक्षिप्त और बोधगम्य है।
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: याजक और लेवी
  rationale: दोनों समूह पितृकुलों के मुखियाओं के साथ एक ही सूची में हैं; पारंपरिक और व्यापक रूप से समझे जाने वाले पद रखे गए हैं।
- source_word: אֶל עֶזְרָא הַסֹּפֵר
  choice: शास्त्री एज्रा के पास
  rationale: אֶל दिशा या समीप आने को बताता है। इस प्रसंग में סֹפֵר व्यवस्था के विद्वान और मान्य शास्त्री की भूमिका को दर्शाता है।
- source_word: וּלְהַשְׂכִּיל
  choice: समझने के लिए
  rationale: हिफ़इल क्रिया यहाँ उद्देश्य के रूप में सूझ-बूझ या अंतर्दृष्टि प्राप्त करने का भाव देती है; ‘समझने के लिए’ साधारण आधुनिक हिन्दी में यही आशय स्पष्ट करता है।
- source_word: אֶל דִּבְרֵי הַתּוֹרָה
  choice: व्यवस्था के वचनों को
  rationale: यह समझने की विषय-वस्तु, अर्थात तोराह के कथनों या निर्देशों, की ओर संकेत करता है। ‘व्यवस्था’ वाचा-संबंधी תּוֹרָה के लिए परिचित पद है और ‘वचन’ मूल के बहुवचन को बनाए रखता है।
