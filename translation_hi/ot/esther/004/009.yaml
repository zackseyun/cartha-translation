lexical_decisions:
- source_word: וַיָּב֖וֹא
  choice: आकर
  rationale: בוא का अर्थ संदर्भानुसार ‘आना/जाना’ हो सकता है। यहाँ हताक मोर्दकै से लौटकर एस्तेर के पास आता है; ‘आकर’ इस क्रम को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: הֲתָ֑ךְ
  choice: हताक
  rationale: व्यक्तिवाचक नाम का मूल उच्चारण ध्यान में रखते हुए देवनागरी लिप्यंतरण किया गया है।
- source_word: וַיַּגֵּ֣ד
  choice: बता दीं
  rationale: נגד के हिफ़ील रूप का सामान्य अर्थ ‘बताना/सूचित करना’ है। ‘बता दीं’ सरल कथा-शैली में स्वाभाविक है और इसके कर्म ‘बातें’ के साथ मेल खाता है।
- source_word: לְ/אֶסְתֵּ֔ר
  choice: एस्तेर को
  rationale: לְ से चिह्नित अप्रत्यक्ष कर्म को हिंदी में ‘को’ द्वारा स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: אֵ֖ת
  choice: '[अलग से अनूदित नहीं]'
  rationale: यह निश्चित प्रत्यक्ष कर्म का व्याकरणिक चिह्न है; हिंदी वाक्य-विन्यास में इसका अलग शाब्दिक अनुवाद आवश्यक नहीं है।
- source_word: דִּבְרֵ֥י
  choice: की बातें
  rationale: דָּבָר के बहुवचन संबंध-रूप का निकट अर्थ ‘बातें/वचन’ है। इस सामान्य संवादात्मक संदर्भ में ‘बातें’ आधुनिक हिंदी में अधिक स्वाभाविक है, जबकि ‘संदेश’ और ‘जो ... ने कहा था’ भी अर्थगत विकल्प हैं।
- source_word: מָרְדֳּכָֽי
  choice: मोर्दकै
  rationale: व्यक्तिवाचक नाम को हिब्रू रूप के निकट देवनागरी में लिप्यंतरित किया गया है।
