  text: So Hathach went out to Mordecai[a], to the open square of the city that was in front of the king's gate.
translation:
  language: hi
  text: तब हताक बाहर निकलकर मोर्दकै के पास, नगर के उस खुले चौक में गया जो राजा के फाटक के सामने था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: तब ... निकलकर ... गया
  rationale: יצא के दिशात्मक भाव को ‘निकलकर’ व्यक्त करता है, जबकि वय्यिक्तोल का क्रमिक कथात्मक भाव ‘तब’ और पूर्ण भूतकाल से स्वाभाविक हिंदी में आता है।
- source_word: הֲתָךְ
  choice: हताक
  rationale: व्यक्तिनाम का निकट ध्वन्यात्मक देवनागरी लिप्यंतरण।
- source_word: אֶל מָרְדֳּכָי
  choice: मोर्दकै के पास
  rationale: אֶל यहाँ व्यक्ति की ओर जाकर उसके पास पहुँचने का भाव देता है; आधुनिक हिंदी में ‘के पास’ स्वाभाविक है।
- source_word: אֶל רְחוֹב הָעִיר
  choice: नगर के उस खुले चौक में
  rationale: רְחוֹב आधुनिक अर्थ में केवल सड़क नहीं, बल्कि नगर का चौड़ा सार्वजनिक खुला स्थान है; ‘खुला चौक’ इस स्थानगत अर्थ को स्पष्ट रखता है।
- source_word: אֲשֶׁר לִפְנֵי
  choice: जो ... के सामने था
  rationale: संबंधवाचक उपवाक्य और स्थानगत अर्थ को सहज आधुनिक हिंदी में सुरक्षित रखता है।
- source_word: שַׁעַר הַמֶּלֶךְ
  choice: राजा के फाटक
  rationale: इब्रानी संबंधसूचक रचना का सीधा और स्वाभाविक हिंदी रूप; एस्तेर में बार-बार आने वाले राजकीय प्रवेश-स्थान को दर्शाता है।
