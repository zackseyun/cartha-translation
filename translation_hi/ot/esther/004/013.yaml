  text: Then Mordecai said to reply to Esther, “Do not imagine that you alone of all the Jews will escape in the king’s house.
translation:
  language: hi
  text: तब मोर्दकै ने एस्तेर को उत्तर भेजने के लिए कहलवाया, “यह मत सोचो कि तुम राजमहल में, सब यहूदियों में अकेली, बच जाओगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְהָשִׁיב אֶל־אֶסְתֵּר
  choice: एस्तेर को यह उत्तर देने के लिए कहा
  rationale: हिब्रू में शाब्दिक रूप से ‘एस्तेर को उत्तर दिलाने/देने के लिए कहा’ है; हिन्दी में यह स्वाभाविक रूप से संदेश पहुँचाने का भाव व्यक्त करता है, बिना पाठ में अस्पष्ट सर्वनाम जोड़ने के।
- source_word: אַל־תְּדַמִּי בְנַפְשֵׁךְ
  choice: यह मत सोचो
  rationale: मुहावरे का अर्थ ‘अपने मन में कल्पना न करना/मत सोचना’ है; आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक रूप चुना गया।
- source_word: לְהִמָּלֵט
  choice: बच जाओगी
  rationale: निफ़ाल infinitive में संकट से बच निकलने का भाव है; ‘बच जाओगी’ प्रसंगानुकूल और सहज है।
- source_word: בֵּית הַמֶּלֶךְ
  choice: राजमहल में
  rationale: शाब्दिक ‘राजा का घर’ इस प्रसंग में शाही निवास या राजमहल को सूचित करता है।
- source_word: מִכָּל־הַיְּהוּדִים
  choice: सब यहूदियों में से अकेली
  rationale: מן का तुलनात्मक अर्थ (‘अन्य सभी यहूदियों से अधिक’) भी संभव है, पर यहाँ एस्तेर के अकेले अपवाद बनकर बचने की धारणा का स्वाभाविक हिन्दी रूप दिया गया है।
theological_decisions:
- issue: क्या राजमहल एस्तेर को अन्य यहूदियों के विनाश से अलग सुरक्षा देगा
  choice: राजमहल में होने के कारण सब यहूदियों में से अकेली बच जाओगी
  alternative: राजमहल में अन्य सभी यहूदियों से अधिक बच निकलोगी
  rationale: वाक्य का आशय एस्तेर की संभावित आत्म-सुरक्षा की भ्रांति को नकारना है। अनुवाद सुरक्षा के कारण को प्रसंगानुसार स्पष्ट करता है, पर किसी अतिरिक्त धार्मिक व्याख्या को नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सीधा संवाद। स्त्रीलिंग क्रियाएँ एस्तेर को संबोधन के अनुरूप हैं। ‘मोर्दकै’ और ‘एस्तेर’ प्रचलित हिन्दी बाइबलीय नामरूप हैं।
