- source_word: וַיַּגִּידוּ
  choice: तब उन्होंने ... बताईं
  rationale: हिफ़ील वय्यिक्तोल अगली कथात्मक क्रिया बताता है और कर्ता अनिर्दिष्ट बहुवचन है। हिंदी में ‘तब उन्होंने ... बताईं’ प्रसंगानुकूल और स्वाभाविक है।
- source_word: לְמָרְדֳּכָי
  choice: मोर्दकै को
  rationale: לְ अप्रत्यक्ष कर्म को चिह्नित करता है; हिंदी में इसे ‘को’ से व्यक्त किया गया है।
- source_word: אֵת
  choice: '[अलग से अनूदित नहीं]'
  rationale: यह इब्रानी का प्रत्यक्ष-कर्म चिह्न है; हिंदी में इसका कोई स्वतंत्र शब्दगत समतुल्य नहीं है।
- source_word: דִּבְרֵי
  choice: बातें
  rationale: דָּבָר का रचनात्मक बहुवचन यहाँ कही हुई बातों को दर्शाता है। ‘बातें’ आधुनिक हिंदी में स्वाभाविक है और ‘संदेश’ या ‘उत्तर’ की अपेक्षा मूल की व्यापकता बनाए रखता है।
- source_word: אֶסְתֵּר
  choice: एस्तेर की
  rationale: व्यक्तिवाचक नाम का लिप्यंतरण किया गया है और रचनात्मक संबंध को हिंदी के संबंधबोधक ‘की’ से व्यक्त किया गया है।
