base_translation:
  language: en
  yaml_path: translation/ot/esther/004/004.yaml
  text: Esther’s young women and her eunuchs came and told her[a], and the queen was greatly distressed. She sent garments to clothe Mordecai and to remove his sackcloth from him[c][b], but he did not accept them.
translation:
  language: hi
  text: एस्तेर की युवतियाँ[a] और उसके खोजे[b] आए और उन्होंने उसे यह बात बताई। तब रानी बहुत व्याकुल हो उठी। उसने मोर्दकै को पहनाने और उसका टाट[c] उतारने के लिए वस्त्र भेजे, पर उसने उन्हें स्वीकार नहीं किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सेविकाएँ।”
    reason: lexical_alternative
  - marker: b
    text: “खोजे” राजमहल में सेवा करने वाले नपुंसक किए गए पुरुष थे। कुछ प्रसंगों में मूल शब्द का अर्थ “दरबारी अधिकारी” भी हो सकता है।
    reason: cultural_note
  - marker: c
    text: टाट एक खुरदरा वस्त्र था, जिसे शोक, दुःख या अपमान के चिह्न के रूप में पहना जाता था।
    reason: cultural_note
lexical_decisions:
- source_word: נַעֲרוֹת
  choice: युवतियाँ
  rationale: मूल शब्द का सीधा अर्थ ‘युवतियाँ’ है; राजमहल के प्रसंग में ये एस्तेर की सेविकाएँ हैं। मुख्य पाठ मूल की अभिव्यक्ति रखता है और पादटिप्पणी प्रसंगगत अर्थ स्पष्ट करती है।
- source_word: וְסָרִיסֶיהָ
  choice: और उसके खोजे
  rationale: फ़ारसी राजदरबार के प्रसंग में סָרִיס का विशिष्ट और ऐतिहासिक रूप से उपयुक्त अर्थ बधिया किए गए पुरुष दरबारी, अर्थात ‘खोजे’, है; व्यापक अर्थ ‘दरबारी अधिकारी’ पादटिप्पणी में दिया गया है।
- source_word: וַיַּגִּידוּ לָהּ
  choice: आए और उन्होंने उसे यह बात बताई
  rationale: आने और सूचना देने की क्रमिक कथात्मक गति को हिन्दी में स्वाभाविक ढंग से सुरक्षित रखा गया है। ‘यह बात’ प्रसंग से निहित कर्म को स्पष्ट करता है।
- source_word: וַתִּתְחַלְחַל
  choice: बहुत व्याकुल हो उठी
  rationale: क्रिया तीव्र आंतरिक कंपकंपी या विचलन व्यक्त करती है। ‘बहुत व्याकुल हो उठी’ भाव की तीव्रता और अचानक प्रतिक्रिया दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: הַמַּלְכָּה
  choice: रानी
  rationale: यह एस्तेर की राजकीय उपाधि है; हिन्दी में निश्चितता प्रसंग से स्पष्ट है।
- source_word: בְּגָדִים
  choice: वस्त्र
  rationale: ‘वस्त्र’ आधुनिक हिन्दी में स्पष्ट होने के साथ राजकीय प्रसंग के अनुरूप गरिमापूर्ण है।
- source_word: לְהַלְבִּישׁ אֶת מָרְדֳּכַי
  choice: मोर्दकै को पहनाने
  rationale: प्रयोजनसूचक क्रियारूप को सुरक्षित रखते हुए हिन्दी में स्वाभाविक अनुवाद किया गया है। भेजे गए वस्त्र कर्म के रूप में पिछले खंड से स्पष्ट हैं।
- source_word: וּלְהָסִיר שַׂקּוֹ מֵעָלָיו
  choice: और उसके शरीर से टाट उतरवाने
  rationale: מֵעָלָיו का शाब्दिक भाव ‘उसके ऊपर से’ है। ‘उसके शरीर से ... उतरवाने’ ठोस क्रिया को स्पष्ट करता है और एस्तेर द्वारा भेजे गए वस्त्रों के माध्यम से कार्य करवाने का भाव देता है।
- source_word: שַׂקּוֹ
  choice: उसका टाट
  rationale: ‘टाट’ शोक में पहने जाने वाले खुरदरे वस्त्र के विशिष्ट सांस्कृतिक संकेत को बनाए रखता है; अर्थ पादटिप्पणी में समझाया गया है।
- source_word: וְלֹא קִבֵּל
  choice: पर उसने उन्हें स्वीकार नहीं किया
  rationale: मूल में कर्म अनुक्त है, पर प्रसंग से भेजे गए वस्त्र अभिप्रेत हैं। हिन्दी में ‘उन्हें’ जोड़ने से अर्थ स्पष्ट होता है और ‘स्वीकार नहीं किया’ मोर्दकै के इनकार को स्वाभाविक रूप से व्यक्त करता है।
