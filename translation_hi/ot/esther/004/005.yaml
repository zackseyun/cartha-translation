base_translation:
  language: en
  yaml_path: translation/ot/esther/004/005.yaml
  text: Then Esther called for Hathach[a], one of the king’s eunuchs, whom he had appointed to attend her, and commanded him concerning Mordecai, to learn what this was and why it was.
translation:
  language: hi
  text: तब एस्तेर ने हताक[a] को बुलाया। वह राजा के खोजों में से एक था, जिसे राजा ने एस्तेर की सेवा के लिए नियुक्त किया था। एस्तेर ने उसे मोर्दकै के विषय में यह पता लगाने की आज्ञा दी कि यह क्या है और ऐसा क्यों है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “राजा के दरबारी अधिकारियों में से एक।” इब्रानी शब्द विशेष रूप से ‘खोजा’ के लिए प्रयुक्त हो सकता है, पर कुछ संदर्भों में इसका व्यापक अर्थ राज-अधिकारी भी होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרָא
  choice: तब एस्तेर ने ... बुलाया
  rationale: वय्यिक्तोल कथानक को आगे बढ़ाता है; ‘तब’ स्वाभाविक क्रम व्यक्त करता है और ‘बुलाया’ किसी को अपने पास बुलवाने का अर्थ देता है।
- source_word: לַהֲתָךְ
  choice: हताक
  rationale: व्यक्तिनाम का निकट देवनागरी लिप्यंतरण।
- source_word: מִסָּרִיסֵי הַמֶּלֶךְ
  choice: राजा के खोजों में से एक
  rationale: סָרִיס का सामान्य और इस राजदरबारी संदर्भ में उपयुक्त ठोस अर्थ ‘खोजा’ है; व्यापक अर्थ ‘राज-अधिकारी’ पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: אֲשֶׁר הֶעֱמִיד לְפָנֶיהָ
  choice: जिसे राजा ने उसकी सेवा में नियुक्त किया था
  rationale: पिछले पदबंध के आधार पर क्रिया का कर्ता स्वाभाविक रूप से राजा है। यह रूप आधिकारिक नियुक्ति और एस्तेर की व्यक्तिगत सेवा—दोनों को सहज हिंदी में व्यक्त करता है।
- source_word: וַתְּצַוֵּהוּ עַל מָרְדֳּכָי
  choice: एस्तेर ने उसे मोर्दकै के विषय में ... आज्ञा दी
  rationale: צוה की आदेशात्मक शक्ति और עַל द्वारा प्रस्तुत विषय दोनों सुरक्षित रहते हैं; नए वाक्य में नाम दोहराने से हिंदी में सर्वनाम-संदेह दूर होता है।
- source_word: לָדַעַת
  choice: यह पता लगाने
  rationale: उद्देश्यसूचक क्रियार्थक रूप; पूछताछ द्वारा जानकारी प्राप्त करने का भाव स्वाभाविक हिंदी में व्यक्त होता है।
- source_word: מַה זֶּה וְעַל מַה זֶּה
  choice: कि यह क्या है और ऐसा क्यों है
  rationale: पहला प्रश्न स्थिति की पहचान और दूसरा उसके कारण को पूछता है। हिंदी में यह जोड़ी मूल की खुली पूछताछ और अर्थभेद दोनों बनाए रखती है।
