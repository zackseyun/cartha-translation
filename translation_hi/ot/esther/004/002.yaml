  yaml_path: translation/ot/esther/004/002.yaml
  text: He came as far as the front of the king’s gate[b][a], because no one could enter the king’s gate clothed in sackcloth.
translation:
  language: hi
  text: वह राजद्वार के सामने तक आया[a], क्योंकि टाट के वस्त्र पहनकर राजद्वार में प्रवेश की अनुमति नहीं थी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “राजा के द्वार के सामने तक।” इब्रानी वाक्यांश इस बात पर बल देता है कि वह केवल द्वार के सामने वाले स्थान तक पहुँचा।
    reason: lexical_alternative
  - marker: b
    text: अधिक शाब्दिक रूप से, “क्योंकि टाट का वस्त्र पहने राजद्वार में प्रवेश नहीं किया जा सकता था।” प्रसंग में इसका आशय प्रवेश पर रोक से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: वह आया
  rationale: בוא का कथात्मक रूप मोर्दकै के राजद्वार की ओर बढ़ने को बताता है; हिंदी कथा में “आया” सहज है।
- source_word: עַד לִפְנֵי
  choice: के सामने तक
  rationale: עַד सीमा और לִפְנֵי सामने की स्थिति व्यक्त करता है; यह रूप स्पष्ट करता है कि वह द्वार तक पहुँचा, पर भीतर नहीं गया।
- source_word: שַׁעַר הַמֶּלֶךְ
  choice: राजद्वार
  rationale: राजा के द्वार के लिए यह संक्षिप्त, स्वाभाविक और गरिमापूर्ण हिंदी पद है तथा राजकीय परिसर का संदर्भ बनाए रखता है।
- source_word: כִּי אֵין לָבוֹא
  choice: क्योंकि ... प्रवेश करना मना था
  rationale: אֵין + infinitive यहाँ प्रसंगतः प्रवेश-निषेध व्यक्त करता है। “मना था” आधुनिक पाठक के लिए कारण को स्पष्ट और सहज रूप में संप्रेषित करता है।
- source_word: אֶל שַׁעַר הַמֶּלֶךְ
  choice: राजद्वार में प्रवेश करना
  rationale: אֶל का दिशात्मक भाव इस प्रसंग में द्वार के भीतर या उसके द्वारा प्रवेश करने का है; हिंदी में “राजद्वार में प्रवेश करना” स्वाभाविक है।
- source_word: בִּלְבוּשׁ שָׂק
  choice: टाट के कपड़े पहने हुए
  rationale: यह शोक-वस्त्र को ठोस और सामान्य हिंदी में व्यक्त करता है; “टाट” שָׂק का प्रचलित बाइबलीय अर्थ सुरक्षित रखता है।
