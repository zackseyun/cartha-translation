  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘राजकीय खज़ानों’ से मूल के बहुवचन को रखा गया है, और ‘तौलकर देने’ से प्राचीन भार-आधारित भुगतान की छवि सुरक्षित है। कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि פָּרָשַׁת הַכֶּסֶף का प्रसंगानुकूल अर्थ मुख्य पाठ में स्पष्ट रूप से व्यक्त किया जा सकता है।
