base_translation:
  language: en
  yaml_path: translation/ot/esther/004/007.yaml
  text: Mordecai told him everything that had happened to him[a], and the exact amount of money that Haman had said he would weigh out into the king’s treasuries for the destruction of the Jews.
translation:
  language: hi
  text: मोर्दकै ने उसे वह सब बताया जो उसके साथ हुआ था, और उस धन की ठीक-ठीक राशि[a] भी, जिसे हामान ने यहूदियों को नष्ट करने के लिए राजकीय खज़ानों में तौलकर देने की बात कही थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उस धन का पूरा ब्यौरा’ या ‘धनराशि।’ इब्रानी पद हामान द्वारा देने के लिए प्रस्तावित निर्दिष्ट धनराशि, अथवा उसके विवरण, का संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֶּד
  choice: बताया
  rationale: हिफ़ील रूप का अर्थ किसी बात को ज्ञात कराना या बताना है; कथा के प्रसंग में ‘बताया’ स्वाभाविक और स्पष्ट है।
- source_word: לוֹ
  choice: उसे
  rationale: प्रसंग में यह सर्वनाम हताक की ओर संकेत करता है; मूल पाठ की सर्वनामात्मक अभिव्यक्ति बनाए रखी गई है।
- source_word: אֵת כָּל אֲשֶׁר קָרָהוּ
  choice: वह सब ... जो उसके साथ हुआ था
  rationale: प्रत्यय मोर्दकै की ओर संकेत करता है। यह अनुवाद मूल के ‘उसके साथ घटित हुआ’ अर्थ को सहज आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: פָּרָשַׁת הַכֶּסֶף
  choice: उस धन की ठीक-ठीक राशि
  rationale: פָּרָשָׁה यहाँ निर्दिष्ट विवरण या निश्चित राशि को सूचित करता है। प्रसंग में हामान द्वारा प्रस्तावित धनराशि की विशिष्टता प्रमुख है।
- source_word: אָמַר ... לִשְׁקוֹל
  choice: तौलकर देने की बात कही थी
  rationale: यह अभिव्यक्ति मूल के ‘कहा’ और वजन करके चाँदी देने की ठोस आर्थिक छवि, दोनों को सुरक्षित रखती है।
- source_word: עַל גִּנְזֵי הַמֶּלֶךְ
  choice: राजकीय खज़ानों में
  rationale: बहुवचन גִּנְזֵי को ‘खज़ानों’ से दर्शाया गया है और भुगतान को उनमें जमा किए जाने का आशय स्पष्ट किया गया है।
- source_word: ביהודיים לְאַבְּדָם
  choice: यहूदियों का नाश कराने के लिए
  rationale: यहूदियों को विनाशकारी कार्य का लक्ष्य बताया गया है। ‘नाश कराने’ से हामान द्वारा योजनाबद्ध विनाश और उसके प्रयोजन के लिए धन देने का संबंध स्वाभाविक हिन्दी में व्यक्त होता है।
