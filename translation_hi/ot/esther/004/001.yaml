base_translation:
  language: en
  yaml_path: translation/ot/esther/004/001.yaml
  text: When Mordecai learned all that had been done[a], Mordecai tore his clothes and put on sackcloth and ashes. Then he went out into the midst of the city and cried out with a great and bitter cry.
translation:
  language: hi
  text: जब मोर्दकै को उस सब का पता चला जो किया गया था, तब उसने अपने कपड़े फाड़े, टाट ओढ़ा और अपने ऊपर राख डाली। फिर वह नगर के बीचों-बीच गया और बड़ी और कड़वी पुकार लगाई।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָדַע
  choice: मालूम हुआ
  rationale: संदर्भ में क्रिया मोर्दकै के घटनाओं से अवगत होने को दिखाती है; आधुनिक हिन्दी में ‘मालूम हुआ’ इस आरंभिक बोध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כָּל אֲשֶׁר נַעֲשָׂה
  choice: क्या-क्या किया गया है
  rationale: यह इब्रानी के कर्मवाच्य को बनाए रखता है और पूर्ववर्ती आदेश तथा उससे जुड़ी सारी कार्रवाई को समेटता है।
- source_word: וַיִּקְרַע ... אֶת בְּגָדָיו
  choice: अपने कपड़े फाड़े
  rationale: शोक के प्रचलित संकेत को स्पष्ट, आधुनिक और सीधी हिन्दी में व्यक्त करता है।
- source_word: שַׂק וָאֵפֶר
  choice: टाट पहना और राख लगाई
  rationale: ‘टाट’ शोक-वस्त्र को संक्षेप में व्यक्त करता है; हिन्दी में राख के साथ की गई शोक-क्रिया को केवल ‘राख पहनी’ कहने के बजाय ‘राख लगाई’ स्वाभाविक है।
- source_word: בְּתוֹךְ הָעִיר
  choice: नगर के बीच में
  rationale: בְּתוֹךְ के स्थानगत अर्थ ‘बीच/मध्य’ को बिना इसे विशेष रूप से आधुनिक ‘नगर-केंद्र’ बनाने के सुरक्षित रखता है।
- source_word: וַיִּזְעַק זְעָקָה גְדֹלָה וּמָרָה
  choice: ऊँची तथा कड़वी पुकार के साथ चिल्लाने लगा
  rationale: क्रिया और उसी मूल की संज्ञा दोनों का कुछ अंश बनाए रखते हुए हिन्दी में स्वाभाविक अभिव्यक्ति देता है। ‘ऊँची’ श्रव्य संदर्भ में גְדֹלָה का अर्थ स्पष्ट करती है और ‘कड़वी’ मूल भावात्मक रूपक को सुरक्षित रखती है।
