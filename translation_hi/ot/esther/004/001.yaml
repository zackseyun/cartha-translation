  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रूप। ‘मोर्दकै’, ‘टाट’ और ‘नगर’ बाइबिलीय संदर्भ के परिचित शब्द हैं; वाक्य में इब्रानी कथात्मक क्रम और शोक की तीव्रता बनाए रखी गई है।
