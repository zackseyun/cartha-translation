  text: כָּל עַבְדֵ֣י הַ/מֶּ֡לֶךְ וְ/עַם מְדִינ֨וֹת הַ/מֶּ֜לֶךְ יֽוֹדְעִ֗ים אֲשֶׁ֣ר כָּל אִ֣ישׁ וְ/אִשָּׁ֡ה אֲשֶׁ֣ר יָבֽוֹא אֶל הַ/מֶּלֶךְ֩ אֶל הֶ/חָצֵ֨ר הַ/פְּנִימִ֜ית אֲשֶׁ֣ר לֹֽא יִקָּרֵ֗א אַחַ֤ת דָּת/וֹ֙ לְ/הָמִ֔ית לְ֠/בַד מֵ/אֲשֶׁ֨ר יֽוֹשִׁיט ל֥/וֹ הַ/מֶּ֛לֶךְ אֶת שַׁרְבִ֥יט הַ/זָּהָ֖ב וְ/חָיָ֑ה וַ/אֲנִ֗י לֹ֤א נִקְרֵ֨אתי֙ לָ/ב֣וֹא אֶל הַ/מֶּ֔לֶךְ זֶ֖ה שְׁלוֹשִׁ֥ים יֽוֹם־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/004/011.yaml
  text: 'All the king’s servants and the people of the king’s provinces know that for any man or woman who goes to the king in the inner court without being summoned[a], there is one law for him: to be put to death, except for the one to whom the king extends the golden scepter, so that he may live. But as for me[b], I have not been summoned to go in to the king these thirty days.'
translation:
  language: hi
  text: राजा के सभी सेवक और राजा के प्रान्तों के लोग जानते हैं कि जो कोई पुरुष या स्त्री राजा के पास जाने के लिए भीतरी आँगन में बिना बुलाए[a] प्रवेश करता है, उसके लिए एक ही नियम है—उसे मार डाला जाए। केवल वह व्यक्ति जीवित रहेगा जिसकी ओर राजा सोने का राजदण्ड बढ़ाए। पर मुझे तीस दिनों से राजा के पास आने के लिए नहीं बुलाया गया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बिना औपचारिक बुलावे के।” हिब्रू क्रिया राजदरबार में बुलाए जाने को दर्शाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי
  choice: सेवक
  rationale: फ़ारसी राजदरबार के संदर्भ में यह राजा की सेवा में लगे लोगों के लिए व्यापक पद है; ‘सेवक’ स्वाभाविक है और अनावश्यक रूप से दासत्व का अर्थ नहीं जोड़ता।
- source_word: וְעַם מְדִינוֹת הַמֶּלֶךְ
  choice: और राजा के प्रान्तों के लोग
  rationale: यह राजदरबार से बाहर पूरे साम्राज्य की प्रजा को समेटता है; एस्तेर में מְדִינוֹת के लिए ‘प्रान्त’ उपयुक्त प्रशासनिक शब्द है।
- source_word: כָּל אִישׁ וְאִשָּׁה
  choice: जो कोई पुरुष या स्त्री
  rationale: मूल पाठ दोनों लिंगों का स्पष्ट उल्लेख करता है और כָּל का व्यापक, वितरणात्मक भाव रखता है।
- source_word: אֶל הֶחָצֵר הַפְּנִימִית
  choice: भीतरी आँगन में
  rationale: यह महल के उस प्रतिबंधित भीतरी प्रांगण को दर्शाता है जहाँ से राजा के पास पहुँचा जाता था।
- source_word: אֲשֶׁר לֹא יִקָּרֵא
  choice: बिना बुलाए
  rationale: निफ़अल रूप औपचारिक रूप से बुलाए जाने को व्यक्त करता है; सरल हिन्दी में ‘बिना बुलाए’ राजदरबार की औपचारिक अनुमति को पर्याप्त रूप से संप्रेषित करता है।
- source_word: אַחַת דָּתוֹ
  choice: उसके लिए एक ही नियम है
  rationale: हिब्रू मुहावरा ऐसे प्रत्येक मामले में लागू एक निश्चित कानूनी परिणाम बताता है; इस रूप में ‘एक’ का बल सुरक्षित रहता है।
- source_word: לְהָמִית
  choice: उसे मार डाला जाए
  rationale: यह किसी स्वाभाविक मृत्यु नहीं, बल्कि लागू किए जाने वाले मृत्युदण्ड को व्यक्त करता है।
- source_word: לְבַד מֵאֲשֶׁר
  choice: केवल वही
  rationale: यह मृत्युदण्ड के नियम के एकमात्र अपवाद को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יוֹשִׁיט לוֹ
  choice: जिसकी ओर ... बढ़ाए
  rationale: हिफ़ईल क्रिया किसी व्यक्ति की ओर राजदण्ड आगे बढ़ाने की राजकीय मुद्रा को दर्शाती है।
- source_word: שַׁרְבִיט הַזָּהָב
  choice: सोने का राजदण्ड
  rationale: ‘राजदण्ड’ राजकीय सत्ता और अनुग्रह के इस चिह्न के लिए सटीक तथा प्रतिष्ठित हिन्दी शब्द है।
- source_word: וְחָיָה
  choice: बच सकता है
  rationale: संदर्भ में इसका अर्थ मृत्युदण्ड से जीवित बचना है; यह परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि संभावना का भाव राजा की कृपा पर निर्भरता दिखाता है।
- source_word: זֶה שְׁלוֹשִׁים יוֹם
  choice: पिछले तीस दिनों से
  rationale: यह अवधि वर्तमान कथन तक चली आ रही है; ‘पिछले तीस दिनों से’ आधुनिक हिन्दी में उसका स्वाभाविक रूप है।
