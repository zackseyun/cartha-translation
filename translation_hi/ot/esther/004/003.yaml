base_translation:
  language: en
  yaml_path: translation/ot/esther/004/003.yaml
  text: And in every province[a], wherever the king’s word and his decree reached, there was great mourning among the Jews, with fasting and weeping and lamentation; sackcloth and ashes were spread out for many.
translation:
  language: hi
  text: और हर प्रान्त में, जहाँ भी राजा का वचन और उसका राजादेश पहुँचा, वहाँ यहूदियों के बीच बड़ा शोक था—उपवास, रोना और विलाप; टाट और राख बहुतों के लिए बिछाए गए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बहुतों ने टाट और राख का उपयोग किया।” “बहुतों के लिए” वाला इब्रानी वाक्यांश संक्षिप्त है; उसका अर्थ यह भी हो सकता है कि बहुत-से लोगों ने शोक के इन चिह्नों का उपयोग किया।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכָל מְדִינָה וּמְדִינָה
  choice: हर प्रान्त में
  rationale: इब्रानी की वितरणात्मक पुनरुक्ति का स्वाभाविक हिन्दी रूप है और सभी प्रान्तों को समेटता है।
- source_word: מְקוֹם אֲשֶׁר
  choice: जहाँ कहीं
  rationale: यह वाक्यांश प्रत्येक उस स्थान का बोध कराता है जहाँ राजकीय घोषणा पहुँची।
- source_word: דְּבַר הַמֶּלֶךְ וְדָתוֹ
  choice: राजा का आदेश और उसका राजादेश
  rationale: דָּבָר को प्रसंगानुसार 'आदेश' और דָּת को विधिक बल वाला 'राजादेश' कहा गया है; दोनों पदों का भेद बनाए रखा गया है।
- source_word: מַגִּיעַ
  choice: पहुँचा
  rationale: राजकीय आदेश के प्रान्तों में प्रसारित होकर पहुँचने को सहज रूप से व्यक्त करता है।
- source_word: אֵבֶל גָּדוֹל לַיְּהוּדִים
  choice: यहूदियों में बड़ा शोक छा गया
  rationale: समुदाय में व्यापक और गहन मातम को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וְצוֹם וּבְכִי וּמִסְפֵּד
  choice: वे उपवास करने, रोने और विलाप करने लगे
  rationale: संज्ञाओं की शृंखला को हिन्दी में स्वाभाविक क्रियात्मक रूप दिया गया है, जबकि शोक के तीनों रूप सुरक्षित हैं।
- source_word: שַׂק וָאֵפֶר
  choice: टाट और राख
  rationale: ये प्राचीन शोक के पारंपरिक चिह्न हैं; 'टाट' सामान्य हिन्दी में שַׂק का स्पष्ट और परिचित समतुल्य है।
- source_word: יֻצַּע לָרַבִּים
  choice: बहुतों के लिए ... बिछाई गई
  rationale: Hophal क्रिया के शाब्दिक 'बिछाए जाने' और לָרַבִּים के प्राथमिक 'बहुतों के लिए' अर्थ को बनाए रखता है; संक्षिप्त इब्रानी की दूसरी सम्भावना पादटिप्पणी में दी गई है।
