source:
  edition: WLC
  text: וְ/אֶת פַּתְשֶׁ֣גֶן כְּתָֽב הַ֠/דָּת אֲשֶׁר נִתַּ֨ן בְּ/שׁוּשָׁ֤ן לְ/הַשְׁמִידָ/ם֙ נָ֣תַן ל֔/וֹ לְ/הַרְא֥וֹת אֶת אֶסְתֵּ֖ר וּ/לְ/הַגִּ֣יד לָ֑/הּ וּ/לְ/צַוּ֣וֹת עָלֶ֗י/הָ לָ/ב֨וֹא אֶל הַ/מֶּ֧לֶךְ לְ/הִֽתְחַנֶּן ל֛/וֹ וּ/לְ/בַקֵּ֥שׁ מִ/לְּ/פָנָ֖י/ו עַל עַמָּֽ/הּ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/004/008.yaml
  text: He also gave him a copy[a] of the written decree issued in Susa for their destruction, to show it to Esther and explain it to her, and to charge her to go to the king, implore his favor, and plead before him on behalf of her people.
translation:
  language: hi
  text: उसने उसे शूशन में जारी किए गए उस लिखित राजादेश की एक प्रति[a] भी दी, जिसमें उनका नाश करने का आदेश था, ताकि वह उसे एस्तेर को दिखाए और उसका अर्थ समझाए, और उसे निर्देश दे कि वह राजा के पास जाए, उससे कृपा की विनती करे और अपने लोगों की ओर से उसके सामने गुहार लगाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ प्रयुक्त फ़ारसी मूल का शब्द किसी आधिकारिक दस्तावेज़ के पाठ को भी सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּתְשֶׁגֶן כְּתָב
  choice: लिखित राजादेश की एक प्रति
  rationale: फ़ारसी मूल का शब्द आधिकारिक दस्तावेज़ के पाठ या उसकी प्रति को सूचित कर सकता है। मुख्य पाठ में स्वाभाविक हिंदी ‘प्रति’ रखी गई है और व्यापक अर्थ पादटिप्पणी में दिया गया है।
- source_word: הַדָּת
  choice: राजादेश
  rationale: एस्तेर के फ़ारसी राजदरबारी संदर्भ में यह शब्द सामान्य कानून से अधिक किसी जारी शाही आदेश को दर्शाता है।
- source_word: נִתַּן בְּשׁוּשָׁן
  choice: शूशन में जारी किए गए
  rationale: प्रशासनिक संदर्भ में נתן आदेश के जारी या प्रख्यापित किए जाने को व्यक्त करता है; शूशन स्थाननाम का प्रचलित हिंदी रूप है।
- source_word: לְהַשְׁמִידָם
  choice: जिसमें उनका नाश करने का आदेश था
  rationale: यह राजादेश के उद्देश्य और विषयवस्तु को स्पष्ट, स्वाभाविक हिंदी में व्यक्त करता है और विनाशकारी आशय बनाए रखता है।
- source_word: לְהַרְאוֹת אֶת אֶסְתֵּר וּלְהַגִּיד לָהּ
  choice: ताकि वह उसे एस्तेर को दिखाए और उसका अर्थ समझाए
  rationale: इब्रानी में दस्तावेज़ का कर्म संदर्भ से निहित है। हिंदी में सर्वनाम जोड़ने और ‘अर्थ समझाए’ कहने से आशय स्पष्ट होता है, बिना कोई नई सूचना जोड़े।
- source_word: וּלְצַוּוֹת עָלֶיהָ
  choice: और उसे निर्देश दे
  rationale: צוה में दृढ़ निर्देश का भाव है। ‘निर्देश दे’ आधुनिक हिंदी में उसकी गंभीरता रखता है, जबकि मोर्दकै को राजकीय अधिकार वाला नहीं बनाता।
- source_word: לָבוֹא אֶל הַמֶּלֶךְ
  choice: राजा के पास जाए
  rationale: यह आधुनिक हिंदी में स्वाभाविक है; राजदरबार में जोखिमपूर्ण प्रवेश का संदर्भ अगले पदों और कथा से स्पष्ट होता है।
- source_word: לְהִתְחַנֶּן לוֹ
  choice: उससे कृपा की विनती करे
  rationale: हित्पएल रूप अनुग्रह पाने के लिए गंभीर प्रार्थना या विनती का अर्थ देता है; ‘कृपा की विनती’ दोनों पहलुओं को व्यक्त करता है।
- source_word: וּלְבַקֵּשׁ מִלְּפָנָיו עַל עַמָּהּ
  choice: अपने लोगों की ओर से उसके सामने गुहार लगाए
  rationale: यह राजकीय उपस्थिति में निवेदन करने के मुहावरे और एस्तेर के लोगों की ओर से की जाने वाली पैरवी को स्वाभाविक हिंदी में सुरक्षित रखता है।
