    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: तब एस्तेर ने ... कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है, इसलिए ‘तब’ स्वाभाविक है। אמר का मूल अर्थ ‘कहना’ है, जिसे सीधे और सहज रूप में रखा गया है।
- source_word: אֶסְתֵּר
  choice: एस्तेर
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: לַהֲתָךְ
  choice: हताक से
  rationale: ל यहाँ कथन के संबोधित व्यक्ति को सूचित करता है; हिन्दी में ‘से कहा’ स्वाभाविक प्रयोग है। नाम का स्रोतानुकूल लिप्यंतरण ‘हताक’ रखा गया है।
- source_word: וַתְּצַוֵּהוּ
  choice: और उसे ... आज्ञा दी
  rationale: צוה के पिएल रूप में स्पष्ट आदेश देने का भाव है। ‘उसे’ हताक की ओर संकेत करता है।
- source_word: אֶל
  choice: के पास जाने की
  rationale: אֶל का शाब्दिक अर्थ ‘की ओर/के पास’ है। आज्ञा के बाद स्रोत में गति-सूचक क्रिया अंतर्निहित है; हिन्दी में अर्थ पूरा और स्वाभाविक करने के लिए ‘जाने की’ जोड़ा गया है।
- source_word: מָרְדֳּכָי
  choice: मोर्दकै
  rationale: व्यक्तिनाम का स्रोत के स्वरूप के निकट और हिन्दी में सुगम लिप्यंतरण।
