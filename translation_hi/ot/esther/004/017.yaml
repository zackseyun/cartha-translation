  yaml_path: translation/ot/esther/004/017.yaml
  text: So Mordecai went away and did according to all that Esther had commanded him[a].
translation:
  language: hi
  text: तब मोर्दकै वहाँ से चला गया[a] और उसने वैसा ही किया जैसा एस्तेर ने उसे आज्ञा दी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आगे बढ़ गया” अथवा “पार चला गया”; इब्रानी क्रिया का शाब्दिक अर्थ “पार जाना/होकर जाना” है, पर यहाँ संभवतः मोर्दकै के वहाँ से जाकर एस्तेर के निर्देश पूरे करने का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: वहाँ से चला गया
  rationale: עבר का मूल अर्थ ‘पार जाना/होकर जाना’ है, पर इस कथात्मक संदर्भ में यह एस्तेर के निर्देशों को पूरा करने के लिए मोर्दकै के वहाँ से प्रस्थान करने को दर्शाता है। ‘वहाँ से चला गया’ आधुनिक हिन्दी में स्वाभाविक है, जबकि वैकल्पिक शाब्दिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: וַיַּעַשׂ
  choice: उसने ... किया
  rationale: עשה सामान्य क्रिया ‘करना’ है। यह चयन इब्रानी कथन की सादगी बनाए रखता है।
- source_word: כְּכֹל אֲשֶׁר
  choice: वैसा ही ... जैसा
  rationale: यह रचना एस्तेर की पूरी आज्ञा के अनुरूप कार्य करने का भाव देती है। ‘वैसा ही ... जैसा’ सहज हिन्दी में अनुरूपता और समग्रता दोनों व्यक्त करता है।
- source_word: צִוְּתָה
  choice: आज्ञा दी थी
  rationale: צוה का अर्थ ‘आज्ञा देना’ है। ‘दी थी’ पहले दिए गए निर्देश और उसके बाद मोर्दकै के कार्य के कालक्रम को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: עָלָיו
  choice: उसे
  rationale: צוה के साथ על आज्ञा पाने वाले व्यक्ति को चिह्नित करता है; हिन्दी में ‘उसे आज्ञा दी’ इसका स्वाभाविक रूप है।
- source_word: אֶסְתֵּר
  choice: एस्तेर
  rationale: नाम का मानक हिन्दी लिप्यंतरण अपनाया गया है।
