id: EST.4.14
reference: Esther 4:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֣י אִם הַחֲרֵ֣שׁ תַּחֲרִישִׁי֮ בָּ/עֵ֣ת הַ/זֹּאת֒ רֶ֣וַח וְ/הַצָּלָ֞ה יַעֲמ֤וֹד לַ/יְּהוּדִים֙ מִ/מָּק֣וֹם אַחֵ֔ר וְ/אַ֥תְּ וּ/בֵית אָבִ֖י/ךְ תֹּאבֵ֑דוּ וּ/מִ֣י יוֹדֵ֔עַ אִם לְ/עֵ֣ת כָּ/זֹ֔את הִגַּ֖עַתְּ לַ/מַּלְכֽוּת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/004/014.yaml
  text: For if you remain silent at this time, relief and deliverance will arise for the Jews from another place, but you and your father's house will perish. And who knows whether you have come to your royal position for a time like this?
translation:
  language: hi
  text: क्योंकि यदि तुम इस समय चुप ही रहोगी, तो यहूदियों के लिए राहत और छुटकारा किसी और स्थान से प्रकट होंगे, पर तुम और तुम्हारे पिता का घराना नष्ट हो जाओगे। और कौन जानता है कि तुम ऐसे समय के लिए राजपद तक पहुँची हो?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי אִם
  choice: क्योंकि यदि
  rationale: यह पिछले कथन से जुड़ा कारणात्मक और शर्तसूचक संबंध व्यक्त करता है।
- source_word: הַחֲרֵשׁ תַּחֲרִישִׁי
  choice: चुप ही रहोगी
  rationale: धातु के साथ infinitive absolute की तीव्रता को ‘ही’ द्वारा स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: רֶוַח וְהַצָּלָה
  choice: राहत और छुटकारा
  rationale: पहला शब्द संकट से अवकाश या राहत और दूसरा विनाश से बचाव दर्शाता है; दोनों की अलग-अलग अर्थछटाएँ रखी गई हैं।
- source_word: יַעֲמוֹד
  choice: आ खड़ा होगा
  rationale: עמד के मूल ‘खड़ा होना’ और प्रसंगगत ‘उभरना/प्रकट होना’ दोनों को हिन्दी मुहावरे में बनाए रखता है।
- source_word: מִמָּקוֹם אַחֵר
  choice: किसी दूसरी जगह से
  rationale: मदद के स्रोत को मूल पाठ की तरह अनिश्चित रखा गया है।
- source_word: וְאַתְּ וּבֵית אָבִיךְ
  choice: पर तुम और तुम्हारे पिता का घराना
  rationale: ‘पिता का घर’ हिब्रू पारिवारिक अभिव्यक्ति है; ‘घराना’ आधुनिक हिन्दी में परिवार और वंश, दोनों का आयाम संप्रेषित करता है।
- source_word: תֹּאבֵדוּ
  choice: नष्ट हो जाओगे
  rationale: אבד मृत्यु और विनाश दोनों को समेट सकता है; यह चयन उस व्यापकता को बनाए रखता है।
- source_word: וּמִי יוֹדֵעַ
  choice: और कौन जानता है
  rationale: यह निश्चित दावा नहीं, बल्कि खुली आलंकारिक संभावना प्रस्तुत करता है।
- source_word: הִגַּעַתְּ לַמַּלְכוּת
  choice: राजपद तक पहुँची हो
  rationale: मूल क्रिया ‘पहुँचना’ और संज्ञा के राजकीय पद/स्थिति संबंधी अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אִם לְעֵת כָּזֹאת
  choice: कि तुम ऐसे ही समय के लिए
  rationale: אִם को यहाँ ‘कि...क्या’ वाली अप्रत्यक्ष संभाव्यता के रूप में व्यक्त किया गया है; प्रयोजन अथवा विधान को निश्चित नहीं बनाया गया।
theological_decisions:
- issue: ‘किसी दूसरी जगह से’ और ‘ऐसे ही समय के लिए’ में निहित ईश्वरीय विधान
  choice: मुख्य पाठ में परमेश्वर को स्पष्ट रूप से न जोड़ते हुए अप्रत्यक्ष भाषा बनाए रखना
  alternative: ‘परमेश्वर की ओर से’ अथवा ‘परमेश्वर ने तुम्हें इस समय के लिए पहुँचाया है’
  rationale: पद में ईश्वरीय विधान का प्रबल संकेत है, पर हिब्रू पाठ परमेश्वर का नाम स्पष्टतः नहीं लेता। अनिश्चितता और धार्मिक तनाव को मूल रूप में रखा गया है।
- issue: אִם का प्रश्न में अर्थ
  choice: ‘कौन जानता है कि...’ द्वारा संभावना खुली रखना
  alternative: ‘शायद तुम...’ या निश्चित प्रयोजन व्यक्त करना
  rationale: यह कथन एस्तेर के राजपद के प्रयोजन को संभव बताता है, निर्णायक रूप से घोषित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। स्त्रीलिंग ‘रहोगी’ और ‘पहुँची हो’ एस्तेर को संबोधन स्पष्ट करते हैं। ‘छुटकारा’ ऐतिहासिक संकट से बचाव के अर्थ में है, न कि किसी विशिष्ट सांप्रदायिक उद्धार-सिद्धांत के तकनीकी पद के रूप में।
