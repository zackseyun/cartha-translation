source:
  edition: WLC
  text: לֵךְ֩ כְּנ֨וֹס אֶת כָּל הַ/יְּהוּדִ֜ים הַֽ/נִּמְצְאִ֣ים בְּ/שׁוּשָׁ֗ן וְ/צ֣וּמוּ עָ֠לַ/י וְ/אַל תֹּאכְל֨וּ וְ/אַל תִּשְׁתּ֜וּ שְׁלֹ֤שֶׁת יָמִים֙ לַ֣יְלָה וָ/י֔וֹם גַּם אֲנִ֥י וְ/נַעֲרֹתַ֖/י אָצ֣וּם כֵּ֑ן וּ/בְ/כֵ֞ן אָב֤וֹא אֶל הַ/מֶּ֨לֶךְ֙ אֲשֶׁ֣ר לֹֽא כַ/דָּ֔ת וְ/כַ/אֲשֶׁ֥ר אָבַ֖דְתִּי אָבָֽדְתִּי־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/004/016.yaml
  text: Go[a], gather all the Jews who are found in Susa, and fast for me. Do not eat or drink for three days[b], night and day. I and my young women also will fast in the same way. Then I will go to the king, though it is not according to the law; and if I perish[e][d][c], I perish.
translation:
  language: hi
  text: “जाओ, शूशन में उपस्थित सभी यहूदियों को इकट्ठा करो और मेरे लिए उपवास करो। तीन दिन तक रात-दिन न कुछ खाओ, न पियो। मैं और मेरी सेविकाएँ[a] भी इसी तरह उपवास करेंगी। इसके बाद मैं राजा के पास जाऊँगी, यद्यपि यह नियम के अनुसार नहीं है; और यदि मैं नाश हो जाऊँ, तो हो जाऊँ।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरी युवतियाँ” अथवा “मेरी स्त्री परिचारिकाएँ।”
    reason: נַעֲרוֹתַי युवा स्त्रियों को और संदर्भ में एस्तेर की स्त्री परिचारिकाओं/सेविकाओं को सूचित कर सकता है।
  - marker: b
    text: 'अंतिम वाक्य का अनुवाद यह भी हो सकता है: “और जब मैं नाश हो जाऊँ, तब हो जाऊँ।” इब्रानी कथन संक्षिप्त और जोरदार है तथा एस्तेर द्वारा जोखिम स्वीकार करने को व्यक्त करता है।'
    reason: כַאֲשֶׁר और दोहराए गए אָבַדְתִּי के अर्थ-संबंध में वास्तविक अस्पष्टता सुरक्षित रखना।
lexical_decisions:
- source_word: לֵךְ כְּנוֹס
  choice: जाओ... इकट्ठा करो
  rationale: दोनों प्रत्यक्ष आज्ञाओं को सहज और स्पष्ट आधुनिक हिन्दी में रखा गया है।
- source_word: כָּל הַיְּהוּדִים הַנִּמְצְאִים בְּשׁוּשָׁן
  choice: शूशन में उपस्थित सभी यहूदियों
  rationale: הַנִּמְצְאִים का अर्थ यहाँ ‘उपस्थित/जो वहाँ हैं’ है; ‘उपस्थित’ मूल कृदन्त का भाव रखते हुए हिन्दी में स्वाभाविक है। स्थान-नाम को हिन्दी बाइबलीय परंपरा के परिचित रूप ‘शूशन’ में रखा गया है।
- source_word: וְצוּמוּ עָלַי
  choice: मेरे लिए उपवास करो
  rationale: עָלַי एस्तेर की ओर से या उसकी परिस्थिति के संबंध में उपवास का संकेत देता है; ‘मेरे लिए’ संक्षिप्त और स्वाभाविक है।
- source_word: וְאַל תֹּאכְלוּ וְאַל תִּשְׁתּוּ שְׁלֹשֶׁת יָמִים לַיְלָה וָיוֹם
  choice: तीन दिन तक रात-दिन न कुछ खाओ, न पियो
  rationale: दोहराए गए निषेध और निरंतर अवधि के बल को स्वाभाविक हिन्दी क्रम में सुरक्षित रखा गया है।
- source_word: גַּם אֲנִי וְנַעֲרֹתַי אָצוּם כֵּן
  choice: मैं भी अपनी युवतियों के साथ इसी तरह उपवास करूँगी
  rationale: נַעֲרֹתַי राजमहल की एस्तेर से संबद्ध युवतियों/सेविकाओं को दर्शाता है। ‘अपनी युवतियों’ मूल की आयु और स्त्रीलिंग को बनाए रखता है, जबकि ‘के साथ’ हिन्दी में समूहगत उपवास स्पष्ट करता है।
- source_word: וּבְכֵן
  choice: इसके बाद
  rationale: यह अभिव्यक्ति पूर्ववर्ती उपवास के बाद उठाए जाने वाले कदम की ओर संक्रमण दिखाती है।
- source_word: אֲשֶׁר לֹא כַדָּת
  choice: यद्यपि यह नियम के अनुसार नहीं है
  rationale: כַדָּת का शाब्दिक संबंध निर्धारित नियम/कानून से है; संदर्भगत concessive भाव को ‘यद्यपि’ से स्पष्ट किया गया है।
- source_word: וְכַאֲשֶׁר אָבַדְתִּי אָבָדְתִּי
  choice: और यदि मैं नष्ट हुई, तो नष्ट हुई
  rationale: सूत्र की संक्षिप्तता और एक ही क्रिया की जोरदार पुनरावृत्ति सुरक्षित रखी गई है। כַאֲשֶׁר का सटीक संबंध अस्पष्ट है; संदर्भ में शर्त/जोखिम स्वीकार करने वाला पाठ स्वाभाविक है, जबकि वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: अंतिम कथन में एस्तेर की निश्चित मृत्यु या संभावित जोखिम
  choice: यदि मैं नष्ट हुई, तो नष्ट हुई
  alternative: जब मैं नष्ट होऊँगी, तब नष्ट होऊँगी / जैसे मेरा नष्ट होना ठहरा है, वैसे नष्ट होऊँगी
  rationale: मूल כַאֲשֶׁר सामान्य ‘यदि’ शब्द नहीं है और वाक्य अत्यंत संक्षिप्त है। संदर्भ में यह जोखिम की स्वीकारोक्ति है, पर निश्चित मृत्यु का दावा करना आवश्यक नहीं; अतः मुख्य पाठ में प्रचलित शर्तसूचक अर्थ और पादटिप्पणी में अधिक शाब्दिक विकल्प रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। आज्ञाओं की तात्कालिकता, उपवास की कठोरता और अंतिम कथन की संक्षिप्त दृढ़ता को बनाए रखा गया है।
