  text: וְ/נִשְׁמַע֩ פִּתְגָ֨ם הַ/מֶּ֤לֶךְ אֲשֶֽׁר יַעֲשֶׂה֙ בְּ/כָל מַלְכוּת֔/וֹ כִּ֥י רַבָּ֖ה הִ֑יא וְ/כָל הַ/נָּשִׁ֗ים יִתְּנ֤וּ יְקָר֙ לְ/בַעְלֵי/הֶ֔ן לְ/מִ/גָּד֖וֹל וְ/עַד קָטָֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/020.yaml
  text: And when the king’s decree that he makes is heard throughout all his kingdom—for it is vast—all the women will give honor to their husbands[b][a], from great to small.
translation:
  language: hi
  text: और जब राजा की वह राजाज्ञा, जो वह जारी करेगा, उसके सारे राज्य में सुनी जाएगी—क्योंकि उसका राज्य बहुत विशाल है—तब सभी स्त्रियाँ अपने-अपने पतियों का आदर करेंगी,[a] चाहे वे बड़े हों या छोटे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने-अपने पतियों के प्रति सम्मान दिखाएँगी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשְׁמַע
  choice: जब ... सुनी जाएगी
  rationale: निफ़ाल रूप का कर्मवाच्य भाव सुरक्षित रखते हुए इसे परिणाम की परिस्थिति बताने वाले स्वाभाविक हिन्दी वाक्य में रखा गया है।
- source_word: פִּתְגָם הַמֶּלֶךְ אֲשֶׁר יַעֲשֶׂה
  choice: राजा की जो राजाज्ञा जारी की जाएगी
  rationale: फ़ारसी राजदरबार के प्रसंग में פִּתְגָם आधिकारिक राजकीय घोषणा है। עשה का शाब्दिक अर्थ ‘करना’ है, पर इस संयोग में हिन्दी का ‘जारी करना’ आशय को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: בְּכָל מַלְכוּתוֹ
  choice: उसके सारे राज्य में
  rationale: यह राजाज्ञा के पूरे साम्राज्य में प्रसारित और सुने जाने का विस्तार व्यक्त करता है।
- source_word: כִּי רַבָּה הִיא
  choice: क्योंकि उसका राज्य बहुत विशाल है
  rationale: स्त्रीलिंग सर्वनाम का संदर्भ ‘राज्य/राजसत्ता’ से स्पष्ट करते हुए רַבָּה के आकार-संबंधी भाव को ‘बहुत विशाल’ से व्यक्त किया गया है।
- source_word: וְכָל הַנָּשִׁים
  choice: तब सभी स्त्रियाँ
  rationale: मूल का सामान्य बहुवचन ‘सभी स्त्रियाँ’ बनाए रखा गया है; अगले पद में पति-संबंध स्पष्ट हो जाता है।
- source_word: יִתְּנוּ יְקָר
  choice: आदर करेंगी
  rationale: शाब्दिक ‘आदर देंगी’ की अपेक्षा आधुनिक हिन्दी में ‘आदर करेंगी’ अधिक स्वाभाविक है और सम्मान देने का अर्थ सुरक्षित रखता है।
- source_word: לְבַעְלֵיהֶן
  choice: अपने-अपने पतियों का
  rationale: घरेलू प्रसंग में בַּעַל का अर्थ ‘पति’ है; ‘स्वामी’ कहने से अनावश्यक स्वामित्व या प्रभुत्व का भाव आ सकता है।
- source_word: לְמִגָּדוֹל וְעַד קָטָן
  choice: चाहे वे बड़े हों या छोटे
  rationale: यह मुहावरा पूरी सामाजिक श्रेणी को समेटता है। हिन्दी में यह रूप सहज है; ‘वे’ का निकटतम संदर्भ पति हैं।
