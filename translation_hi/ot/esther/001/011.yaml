  text: לְ֠/הָבִיא אֶת וַשְׁתִּ֧י הַ/מַּלְכָּ֛ה לִ/פְנֵ֥י הַ/מֶּ֖לֶךְ בְּ/כֶ֣תֶר מַלְכ֑וּת לְ/הַרְא֨וֹת הָֽ/עַמִּ֤ים וְ/הַ/שָּׂרִים֙ אֶת יָפְיָ֔/הּ כִּֽי טוֹבַ֥ת מַרְאֶ֖ה הִֽיא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/011.yaml
  text: to bring Queen Vashti before the king with the royal crown[a], to show the peoples and the officials her beauty[c][b], for she was beautiful in appearance.
translation:
  language: hi
  text: कि रानी वशती को राजमुकुट के साथ राजा के सामने लाएँ,[a] ताकि लोगों और अधिकारियों को उसकी सुंदरता दिखाएँ, क्योंकि वह देखने में सुंदर थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘राजमुकुट पहने हुए।’ इब्रानी पदबंध का शाब्दिक अर्थ ‘राजमुकुट के साथ’ है; प्रसंग में मुकुट पहनकर उपस्थित होने का भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהָבִיא
  choice: लाएँ
  rationale: בוא के हिफ़ील infinitive में किसी को आने के लिए लाने का कारक भाव है; आज्ञा की पिछली क्रिया से जुड़ने पर हिंदी में ‘लाएँ’ स्वाभाविक है।
- source_word: וַשְׁתִּי הַמַּלְכָּה
  choice: रानी वशती
  rationale: व्यक्तिनाम का देवनागरी लिप्यंतरण किया गया है और उपाधि को स्वाभाविक हिंदी क्रम में रखा गया है।
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: राजा के सामने
  rationale: לִפְנֵי का सीधा अर्थ राजा की उपस्थिति में या उसके सामने है।
- source_word: בְּכֶתֶר מַלְכוּת
  choice: राजमुकुट पहने हुए
  rationale: בְּ साथ होने या अवस्था को व्यक्त कर सकता है; प्रसंग में मुकुट धारण करके उपस्थित होना अभिप्रेत है, इसलिए यह हिंदी में स्पष्ट और स्वाभाविक है।
- source_word: לְהַרְאוֹת
  choice: दिखाएँ
  rationale: ראה के हिफ़ील का अर्थ ‘देखने देना/दिखाना’ है; यह उद्देश्यसूचक रचना में है।
- source_word: הָעַמִּים
  choice: लोगों
  rationale: यद्यपि इब्रानी रूप बहुवचन ‘peoples’ है, आधुनिक हिंदी में ‘लोगों’ स्वाभाविक है और साम्राज्य में उपस्थित विभिन्न जनसमूहों को समेट सकता है।
- source_word: וְהַשָּׂרִים
  choice: और अधिकारियों
  rationale: שָׂרִים उच्च पदस्थ शासकीय या दरबारी पदाधिकारियों को सूचित करता है; ‘अधिकारी’ आधुनिक और व्यापक पद है।
- source_word: יָפְיָהּ
  choice: उसकी सुंदरता
  rationale: यह स्त्रीलिंग प्रत्यययुक्त भाववाचक संज्ञा है, जिसका सीधा अर्थ ‘उसकी सुंदरता’ है।
- source_word: כִּי טוֹבַת מַרְאֶה הִיא
  choice: क्योंकि वह देखने में बहुत सुंदर थी
  rationale: ‘अच्छी रूप-रंग वाली’ इब्रानी मुहावरा शारीरिक सुंदरता व्यक्त करता है; ‘देखने में बहुत सुंदर’ प्राकृतिक हिंदी है। विशेषण טוֹבַת का प्रबल सकारात्मक भाव ‘बहुत सुंदर’ से व्यक्त होता है।
