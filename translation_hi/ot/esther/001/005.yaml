  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। वाक्य में दीर्घ स्थान-वर्णन को स्पष्ट करने के लिए डैश प्रयुक्त हुए हैं। मुख्य पाठ के हर पादटिप्पणी-चिह्न को वाक्य के अंत में अंकित किया गया है।
