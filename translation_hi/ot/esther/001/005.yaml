source:
  edition: WLC
  text: וּ/בִ/מְל֣וֹאת הַ/יָּמִ֣ים הָ/אֵ֗לֶּה עָשָׂ֣ה הַ/מֶּ֡לֶךְ לְ/כָל הָ/עָ֣ם הַ/נִּמְצְאִים֩ בְּ/שׁוּשַׁ֨ן הַ/בִּירָ֜ה לְ/מִ/גָּ֧דוֹל וְ/עַד קָטָ֛ן מִשְׁתֶּ֖ה שִׁבְעַ֣ת יָמִ֑ים בַּ/חֲצַ֕ר גִּנַּ֥ת בִּיתַ֖ן הַ/מֶּֽלֶךְ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/005.yaml
  text: And when these days were completed[a], the king gave a banquet for all the people who were present in Susa the citadel, from great to small, for seven days[d][c][b], in the court of the garden of the king’s palace.
translation:
  language: hi
  text: और जब ये दिन पूरे हुए, तब राजा ने शूशन दुर्ग में उपस्थित सभी लोगों के लिए—बड़े से लेकर छोटे तक—सात दिन तक राजमहल के उद्यान के आँगन में भोज दिया।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “भोज” के लिए प्रयुक्त इब्रानी शब्द प्रायः ऐसे भोज को दर्शाता है जिसमें मद्यपान भी होता था।
    reason: lexical_alternative
  - marker: b
    text: “राजमहल” के लिए प्रयुक्त मूल शब्द का अनुवाद “मंडप” या “भवन” भी हो सकता है।
    reason: lexical_ambiguity
lexical_decisions:
- source_word: וּבִמְלֹאות הַיָּמִים הָאֵלֶּה
  choice: और जब वे दिन पूरे हुए
  rationale: ב के साथ infinitive construct यहाँ समय-सूचक है। हिन्दी में यह स्वाभाविक रूप से पूर्ववर्णित दिनों की समाप्ति बताता है। संदर्भगत अनाफोरिक प्रयोग के कारण הָאֵלֶּה का अनुवाद ‘वे’ किया गया है।
- source_word: עָשָׂה ... מִשְׁתֶּה
  choice: भोज दिया
  rationale: עָשָׂה का מִשְׁתֶּה के साथ अर्थ भोज आयोजित करना या देना है। ‘भोज दिया’ राजकीय प्रसंग में सहज है; מִשְׁתֶּה में मद्यपान का भाव हो सकता है, पर उसे मुख्य पाठ में अनावश्यक रूप से प्रमुख नहीं किया गया।
- source_word: לְכָל הָעָם הַנִּמְצְאִים
  choice: उपस्थित सभी लोगों के लिए
  rationale: הַנִּמְצְאִים का आशय उस स्थान पर पाए जाने वाले अर्थात उपस्थित लोगों से है। עָם यहाँ किसी विशिष्ट जातीय समुदाय के बजाय व्यापक जनसमूह को सूचित करता है।
- source_word: בְּשׁוּשַׁן הַבִּירָה
  choice: शूशन दुर्ग में
  rationale: בִּירָה का मूल अर्थ किलाबंद राजकीय परिसर या दुर्ग है। ‘शूशन दुर्ग’ हिब्रू की स्थान-संज्ञा और apposition को संक्षिप्त, स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: לְמִגָּדוֹל וְעַד קָטָן
  choice: बड़े से लेकर छोटे तक
  rationale: हिब्रू मुहावरे की संरचना को रखते हुए सभी सामाजिक स्तरों के समावेश का भाव व्यक्त किया गया है। इसे केवल आयु का संदर्भ मानकर सीमित नहीं किया गया।
- source_word: שִׁבְעַת יָמִים
  choice: सात दिन तक
  rationale: अवधि का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: בַּחֲצַר גִּנַּת בִּיתַן הַמֶּלֶךְ
  choice: राजमहल के उद्यान के आँगन में
  rationale: חָצֵר को ‘आँगन’ और גִּנָּה को ‘उद्यान’ किया गया है। בִּיתַן संभवतः फ़ारसी मूल का शब्द है और उसके अर्थ में महल, भवन या मंडप की अनिश्चितता है; मुख्य पाठ में राजकीय संदर्भ के अनुकूल ‘राजमहल’ रखा गया और विकल्प पादटिप्पणी में दिए गए हैं।
