  text: וַ/תְּמָאֵ֞ן הַ/מַּלְכָּ֣ה וַשְׁתִּ֗י לָ/בוֹא֙ בִּ/דְבַ֣ר הַ/מֶּ֔לֶךְ אֲשֶׁ֖ר בְּ/יַ֣ד הַ/סָּרִיסִ֑ים וַ/יִּקְצֹ֤ף הַ/מֶּ֨לֶךְ֙ מְאֹ֔ד וַ/חֲמָת֖/וֹ בָּעֲרָ֥ה בֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/012.yaml
  text: But Queen Vashti refused to come at the king’s command by the hand of the eunuchs[a], and the king became very angry[b], and his wrath burned within him.
translation:
  language: hi
  text: परन्तु रानी वशती ने राजा की आज्ञा पर, जो खोजों के माध्यम से पहुँचाई गई थी[a], आने से इनकार कर दिया। तब राजा बहुत क्रोधित हुआ, और उसका रोष उसके भीतर भड़क उठा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “खोजों के हाथ से”; यह मुहावरा बताता है कि राजा की आज्ञा उनके माध्यम से पहुँचाई गई थी।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक भाव, “उसका रोष उसके भीतर जल उठा।” इब्रानी में क्रोध को आग के रूप में चित्रित किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּמָאֵן
  choice: इनकार कर दिया
  rationale: क्रिया מאן जानबूझकर मना करने या अनिच्छा प्रकट करने का बोध कराती है; ‘इनकार कर दिया’ आधुनिक हिन्दी में इसका सीधा और स्वाभाविक रूप है।
- source_word: הַמַּלְכָּה וַשְׁתִּי
  choice: रानी वशती
  rationale: उपाधि और नाम का यह क्रम हिन्दी में स्वाभाविक है और उसके पद तथा व्यक्तिगत पहचान दोनों को बनाए रखता है।
- source_word: לָבוֹא
  choice: आने
  rationale: בוא का सामान्य अर्थ ‘आना’ या ‘प्रवेश करना’ है; राजकीय बुलावे के प्रसंग में ‘आना’ अधिक स्वाभाविक है।
- source_word: בִּדְבַר הַמֶּלֶךְ
  choice: राजा की उस आज्ञा पर
  rationale: यहाँ דָּבָר सामान्य ‘वचन’ नहीं, राजा के निर्देश या आदेश को सूचित करता है; ‘आज्ञा पर’ अर्थ को स्पष्ट और गरिमापूर्ण रखता है।
- source_word: אֲשֶׁר בְּיַד הַסָּרִיסִים
  choice: जो खोजों के हाथ भेजी गई थी
  rationale: ‘हाथ में/हाथ से’ वाला इब्रानी मुहावरा माध्यम या अभिकरण दर्शाता है। हिन्दी में ‘खोजों के हाथ भेजी गई’ मूल बिंब को रखते हुए बताता है कि आज्ञा उनके माध्यम से पहुँचाई गई थी। סָרִיסִים के लिए दरबारी संदर्भ में ‘खोजों’ प्रयुक्त है।
- source_word: וַיִּקְצֹף ... מְאֹד
  choice: बहुत क्रोधित हुआ
  rationale: קצף तीव्र क्रोध और מְאֹד उसकी प्रबलता व्यक्त करता है; यह हिन्दी रूप दोनों को स्पष्टता से संप्रेषित करता है।
- source_word: וַחֲמָתוֹ בָּעֲרָה בוֹ
  choice: उसका रोष उसके भीतर भड़क उठा
  rationale: חֵמָה तीव्र रोष को और בער आग की तरह जलने या भड़कने को व्यक्त करता है। ‘भीतर भड़क उठा’ मूल अग्नि-बिंब और आंतरिक तीव्रता दोनों सुरक्षित रखता है।
