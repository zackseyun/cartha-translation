- source_word: כַדָּת
  choice: यह नियम था
  rationale: दָּת का अर्थ कानून, राजकीय आदेश या औपचारिक नियम हो सकता है। भोज की व्यवस्था के इस प्रसंग में ‘नियम’ स्वाभाविक है, जबकि वैकल्पिक अर्थ पाद-टिप्पणी में सुरक्षित है।
- source_word: אֵין אֹנֵס
  choice: किसी पर कोई दबाव नहीं था
  rationale: यह पद किसी को पीने के लिए बाध्य न किए जाने को व्यक्त करता है। हिन्दी में ‘दबाव’ स्वाभाविक रूप से अभाव की इस घोषणा को संप्रेषित करता है।
- source_word: כִּי כֵן
  choice: क्योंकि
  rationale: यह आगे दिए गए राजकीय निर्देश को उस व्यवस्था का कारण बताता है; हिन्दी में ‘क्योंकि’ कारण-संबंध स्पष्ट और सहज रखता है।
- source_word: יִסַּד
  choice: आदेश दिया था
  rationale: क्रिया का मूल भाव स्थापित या निर्धारित करना है, पर प्रशासनिक प्रसंग में राजा द्वारा व्यवस्था निश्चित करने का व्यावहारिक अर्थ ‘आदेश दिया था’ है।
- source_word: עַל כָּל רַב בֵּיתוֹ
  choice: अपने महल के प्रत्येक अधिकारी को
  rationale: रַב यहाँ राजकीय गृह या महल में अधिकार रखने वाले प्रधान व्यक्ति को सूचित करता है। ‘महल के प्रत्येक अधिकारी’ दरबारी प्रसंग में स्पष्ट है।
- source_word: לַעֲשׂוֹת
  choice: कि वह ... करे
  rationale: हिब्रू उद्देश्यवाचक क्रिया को हिन्दी में आदेश के आशय वाली उपवाक्य-रचना द्वारा सहज रूप दिया गया है।
- source_word: כִּרְצוֹן
  choice: इच्छा के अनुसार
  rationale: רָצוֹן यहाँ व्यक्ति की चाह या पसंद को दर्शाता है; ‘इच्छा’ गरिमापूर्ण और सामान्य हिन्दी है।
- source_word: אִישׁ וָאִישׁ
  choice: हर व्यक्ति
  rationale: दोहराया हुआ हिब्रू पद वितरणात्मक है और प्रत्येक अलग-अलग उपस्थित व्यक्ति को इंगित करता है। हिन्दी में ‘हर व्यक्ति’ इसका स्वाभाविक अर्थ देता है।
