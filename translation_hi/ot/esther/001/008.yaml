base_translation:
  language: en
  yaml_path: translation/ot/esther/001/008.yaml
  text: 'And the drinking was according to the law: there was no compulsion[c][b][a], for so the king had instructed every official of his household to do according to the desire of each man.'
translation:
  language: hi
  text: 'पीने की व्यवस्था नियम के अनुसार थी[a]: किसी पर दबाव नहीं था[b], क्योंकि राजा ने अपने महल के प्रत्येक अधिकारी को निर्देश दिया था कि वे प्रत्येक व्यक्ति की इच्छा के अनुसार करें[c]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कानून के अनुसार”; यहाँ प्रयुक्त इब्रानी शब्द कानून, राजकीय आदेश या औपचारिक नियम को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात किसी को पीने के लिए बाध्य नहीं किया जाता था।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से “हर एक पुरुष की इच्छा के अनुसार”; इब्रानी में दोहराया गया पद प्रत्येक व्यक्ति को अलग-अलग दर्शाता है।
    reason: lexical_alternative
