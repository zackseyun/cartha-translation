base_translation:
  language: en
  yaml_path: translation/ot/esther/001/021.yaml
  text: The matter pleased the king and the officials[b][a], and the king did according to the word of Memucan.
translation:
  language: hi
  text: यह बात राजा और अधिकारियों को अच्छी लगी[a], और राजा ने ममूकान के कहे अनुसार किया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यह प्रस्ताव राजा और अधिकारियों को उचित लगा।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “ममूकान की बात के अनुसार”; अर्थात उसकी सलाह के अनुरूप।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיטַב ... בְּעֵינֵי
  choice: अच्छी लगी
  rationale: यह इब्रानी मुहावरा शाब्दिक रूप से ‘आँखों में अच्छा था’ है। ‘अच्छी लगी’ आधुनिक हिन्दी में स्वाभाविक है और स्वीकृति का भाव बनाए रखता है।
- source_word: הַדָּבָר
  choice: यह बात
  rationale: דָּבָר का अर्थ ‘बात, विषय, वचन’ हो सकता है। यहाँ यह ममूकान द्वारा अभी रखी गई सलाह की ओर संकेत करता है; ‘यह बात’ व्यापकता और प्रसंगगत संदर्भ दोनों को बनाए रखता है।
- source_word: וְהַשָּׂרִים
  choice: और अधिकारियों को
  rationale: שָׂרִים यहाँ राजदरबार के उच्च पदाधिकारियों को दर्शाता है। ‘अधिकारी’ आधुनिक पाठक के लिए स्पष्ट है और ‘राजकुमार’ जैसा अनावश्यक वंशगत अर्थ नहीं जोड़ता।
- source_word: וַיַּעַשׂ
  choice: किया
  rationale: עָשָׂה का सामान्य अर्थ ‘करना’ है। ‘किया’ मूल की सरल क्रिया को निकटता से प्रस्तुत करता है।
- source_word: כִּדְבַר מְמוּכָן
  choice: ममूकान के कहे अनुसार
  rationale: शाब्दिक अर्थ ‘ममूकान की बात के अनुसार’ है। ‘के कहे अनुसार’ हिन्दी में अधिक स्वाभाविक है, वाणी/बात का अर्थ बनाए रखता है और इसे केवल ‘सलाह’ कहकर अर्थ को अत्यधिक सीमित नहीं करता।
- source_word: מְמוּכָן
  choice: ममूकान
  rationale: व्यक्तिवाचक नाम का देवनागरी में ऐसा लिप्यंतरण किया गया है जो इब्रानी उच्चारण के निकट और हिन्दी में पठनीय है।
