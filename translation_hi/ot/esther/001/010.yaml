base_translation:
  language: en
  yaml_path: translation/ot/esther/001/010.yaml
  text: On the seventh day[a], when the king’s heart was merry with wine, he told Mehuman, Biztha, Harbona, Bigtha, Abagtha, Zethar[b], and Karkas—the seven eunuchs who attended King Ahasuerus—
translation:
  language: hi
  text: सातवें दिन, जब मदिरा से राजा का मन प्रसन्न था[a], उसने महूमान, बिजता, हरबोना, बिगता, अबगता, जेतार और कर्कस—राजा अहशवेरोश की सेवा में उपस्थित रहने वाले सात खोजे[b]—से कहा—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब मदिरा के कारण राजा अच्छे मनोभाव में था।” हिब्रू मुहावरा मदिरा से राजा का मन प्रसन्न होने की बात कहता है; वह स्पष्ट रूप से यह नहीं कहता कि राजा नशे में धुत था।
    reason: lexical_alternative
  - marker: b
    text: “खोजे” के लिए प्रयुक्त हिब्रू शब्द कुछ प्रसंगों में अधिक व्यापक अर्थ में राजदरबार के अधिकारियों को भी सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: सातवें दिन
  rationale: यह समय बताने वाला स्वाभाविक हिंदी पदबंध है। मूल पाठ इस पद में किसी भोज या उत्सव का स्पष्ट उल्लेख नहीं करता।
- source_word: כְּטוֹב לֵב הַמֶּלֶךְ בַּיָּיִן
  choice: जब मदिरा से राजा का मन प्रसन्न था
  rationale: यह हिब्रू मुहावरे के ‘मन’ और मदिरा से उत्पन्न प्रसन्नता—दोनों को बनाए रखता है, पर राजा को स्पष्ट रूप से नशे में धुत नहीं बताता।
- source_word: אָמַר לִמְהוּמָן
  choice: उसने महूमान … से कहा
  rationale: אָמַר का सामान्य अर्थ ‘कहा’ है और नाम से पहले लगा ל हिंदी में ‘से’ द्वारा स्वाभाविक रूप से व्यक्त होता है। आगामी कथन अगले पद में आता है, इसलिए अंत में दीर्घ डैश रखा गया है।
- source_word: לִמְהוּמָן בִּזְּתָא חַרְבוֹנָא בִּגְתָא וַאֲבַגְתָא זֵתַר וְכַרְכַּס
  choice: महूमान, बिजता, हरबोना, बिगता, अबगता, जेतेर और कर्कस
  rationale: व्यक्तिनामों को हिब्रू उच्चारण के निकट रहते हुए देवनागरी में पठनीय रूप से लिप्यंतरित किया गया है।
- source_word: שִׁבְעַת הַסָּרִיסִים
  choice: सात खोजों
  rationale: סָרִיס का अधिक सीधा अर्थ ‘खोजा’ है। राजदरबार के अधिकारी का व्यापक अर्थ संभव है, जिसे पाद-टिप्पणी में सुरक्षित रखा गया है।
- source_word: הַמְשָׁרְתִים אֶת פְּנֵי
  choice: की सेवा में उपस्थित रहनेवाले
  rationale: मूल का शाब्दिक भाव ‘मुख के सामने सेवा करना’ राजकीय उपस्थिति में व्यक्तिगत सेवा को दर्शाता है; चुना हुआ रूप हिंदी में स्वाभाविक है।
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: राजा अहशवेरोश
  rationale: राजकीय उपाधि और नाम को हिंदी की स्वाभाविक क्रम-व्यवस्था में रखा गया है।
theological_decisions:
- issue: मदिरा के प्रभाव की तीव्रता
  choice: राजा का मन प्रसन्न था
  alternative: राजा नशे में था
  rationale: हिब्रू पाठ मदिरा के कारण मन के प्रसन्न होने की बात कहता है, पर नशे की अवस्था को स्पष्ट रूप से निर्धारित नहीं करता; इसलिए अस्पष्टता बनाए रखी गई है।
- issue: סָרִיס की पद-संबंधी या शारीरिक पहचान
  choice: खोजे
  alternative: राजकीय अधिकारी
  rationale: सीधा शब्दार्थ मुख्य पाठ में रखा गया है, जबकि दरबारी पद के व्यापक अर्थ की संभावना पाद-टिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। मूल पद अगले पद में आने वाले आदेश से पहले समाप्त होता है, इसलिए हिंदी पाठ को भी दीर्घ डैश पर खुला छोड़ा गया है।
