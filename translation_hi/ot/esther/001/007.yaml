base_translation:
  language: en
  yaml_path: translation/ot/esther/001/007.yaml
  text: Drinks were served in vessels of gold, with vessels differing from vessel to vessel, and royal wine in abundance, according to the king’s bounty.
translation:
  language: hi
  text: पेय सोने के पात्रों में परोसे गए। हर पात्र दूसरे से अलग था, और राजा की उदारता के अनुरूप राजकीय दाखमधु बहुतायत में था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַשְׁקוֹת
  choice: पेय परोसे गए
  rationale: हिब्रू रूप का आशय पीने की वस्तुएँ पिलाने या परोसने से है; प्रसंग में स्वाभाविक हिन्दी निष्क्रिय प्रयोग चुना गया।
- source_word: וְכֵלִים מִכֵּלִים שׁוֹנִים
  choice: हर पात्र दूसरे से अलग था
  rationale: शाब्दिक पुनरुक्ति 'पात्र-पात्र से भिन्न' का अर्थ स्पष्ट और सहज आधुनिक हिन्दी में व्यक्त किया गया, बिना यह जोड़े कि भिन्नता किस प्रकार की थी।
- source_word: וְיֵין מַלְכוּת
  choice: राजकीय दाखमधु
  rationale: מַלְכוּת यहाँ राजकीय/राजा से संबंधित अर्थ देता है; 'दाखमधु' मूल יַיִן के मादक अंगूरी पेय को स्पष्ट रखता है।
- source_word: רָב
  choice: बहुतायत में
  rationale: मात्रा की प्रचुरता को औपचारिक किंतु सामान्य हिन्दी में व्यक्त करता है।
- source_word: כְּיַד הַמֶּלֶךְ
  choice: राजा की उदारता के अनुरूप
  rationale: मुहावरे का आशय राजा के साधनों, वैभव या उदार प्रबंध के अनुसार है; 'उदारता' भोज के प्रसंग में भाव को स्वाभाविक रूप से संप्रेषित करती है।
