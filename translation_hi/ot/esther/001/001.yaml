    text: अहश्वेरोश की ऐतिहासिक पहचान फ़ारसी राजा क्षयर्ष से की जाती है; इसलिए कुछ अनुवाद यहाँ ‘क्षयर्ष’ लिखते हैं।
    reason: alternative_reading
  - marker: b
    text: ‘कूश’ एक प्राचीन क्षेत्र का नाम है; कुछ अनुवाद इसे ‘इथियोपिया’ कहते हैं।
