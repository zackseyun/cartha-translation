- source_word: אֲחַשְׁוֵרוֹשׁ
  choice: अहश्वेरोश
  rationale: इब्रानी नाम का सीधा लिप्यन्तरण रखा गया है; ‘क्षयर्ष’ ऐतिहासिक पहचान पर आधारित वैकल्पिक नाम है।
- source_word: הוּא אֲחַשְׁוֵרוֹשׁ
  choice: यह वही अहश्वेरोश था
  rationale: सर्वनाम और दोहराए गए नाम की पहचानसूचक शक्ति को स्पष्ट तथा स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: הַמֹּלֵךְ
  choice: जो ... राज्य करता था
  rationale: कृदन्त राजा को उसके शासन के द्वारा पहचानता है; सम्बन्धवाचक उपवाक्य हिन्दी में स्वाभाविक है।
- source_word: מֵהֹדּוּ וְעַד כּוּשׁ
  choice: भारत से कूश तक
  rationale: הֹדּוּ का परंपरागत भौगोलिक अर्थ ‘भारत’ है; כּוּשׁ को आधुनिक राष्ट्र ‘इथियोपिया’ से अनावश्यक रूप से समान ठहराने के बजाय प्राचीन क्षेत्रीय नाम के रूप में लिप्यन्तरित किया गया है।
- source_word: שֶׁבַע וְעֶשְׂרִים וּמֵאָה
  choice: एक सौ सत्ताईस
  rationale: इब्रानी संख्या का मानक और स्पष्ट हिन्दी क्रम।
- source_word: מְדִינָה
  choice: प्रान्तों
  rationale: फ़ारसी साम्राज्य के प्रशासनिक सन्दर्भ में यह सुबोध और स्थापित हिन्दी समतुल्य है।
