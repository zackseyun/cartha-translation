  text: וְ/הַ/קָּרֹ֣ב אֵלָ֗י/ו כַּרְשְׁנָ֤א שֵׁתָר֙ אַדְמָ֣תָא תַרְשִׁ֔ישׁ מֶ֥רֶס מַרְסְנָ֖א מְמוּכָ֑ן שִׁבְעַ֞ת שָׂרֵ֣י פָּרַ֣ס וּ/מָדַ֗י רֹאֵי֙ פְּנֵ֣י הַ/מֶּ֔לֶךְ הַ/יֹּשְׁבִ֥ים רִאשֹׁנָ֖ה בַּ/מַּלְכֽוּת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/014.yaml
  text: And those closest to him were Carshena[a], Shethar, Admatha, Tarshish, Meres, Marsena, and Memucan[b], the seven officials of Persia and Media who saw the king’s face and sat first in the kingdom.
translation:
  language: hi
  text: और उसके सबसे निकट रहने वाले थे कर्शना, शेतार, अदमाता, तर्शीश, मेरेस, मर्सना और ममूकान—फ़ारस और मादै के वे सात उच्च अधिकारी, जो राजा का मुख देखते थे[a] और राज्य में प्रथम स्थान पर बैठते थे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह फ़ारसी दरबार की अभिव्यक्ति थी, जिसका अर्थ था कि उन्हें सीधे राजा की उपस्थिति में आने का अधिकार था।
    reason: cultural_note
  - marker: b
    text: या “और राज्य में सर्वोच्च पदों पर आसीन थे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַקָּרֹב אֵלָיו
  choice: और उसके सबसे निकट रहनेवाले थे
  rationale: क़ारोव रूप की दृष्टि से एकवचन है, पर आगे सात दरबारियों की सूची आती है; इसलिए इसे सामूहिक अर्थ में स्वाभाविक हिन्दी बहुवचन से व्यक्त किया गया है।
- source_word: כַּרְשְׁנָא שֵׁתָר אַדְמָתָא תַרְשִׁישׁ מֶרֶס מַרְסְנָא מְמוּכָן
  choice: कर्शना, शेतार, अदमाता, तर्शीश, मेरेस, मर्सना और ममूकान
  rationale: व्यक्तिवाचक नामों को उनके हिब्रू व्यंजन-विन्यास के निकट रहते हुए देवनागरी में लिप्यंतरित किया गया है।
- source_word: שִׁבְעַת שָׂרֵי
  choice: वे सात उच्च अधिकारी
  rationale: सारीम राजकीय पद और अधिकार रखनेवाले व्यक्तियों को सूचित करता है। ‘उच्च अधिकारी’ आधुनिक हिन्दी में उनका दरबारी दर्जा स्पष्ट करता है और अनावश्यक रूप से वंशानुगत ‘राजकुमार’ का भाव नहीं देता।
- source_word: פָּרַס וּמָדַי
  choice: फ़ारस और मादै के
  rationale: यह संयुक्त साम्राज्य के दो राजनीतिक-भौगोलिक घटकों का पारंपरिक हिन्दी नामकरण है।
- source_word: רֹאֵי פְּנֵי הַמֶּלֶךְ
  choice: जो राजा का मुख देखते थे
  rationale: मूल का ठोस दरबारी मुहावरा सुरक्षित रखा गया है; इसका आशय राजा की उपस्थिति में सीधे आने का विशेषाधिकार है, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: הַיֹּשְׁבִים רִאשֹׁנָה בַּמַּלְכוּת
  choice: और राज्य में प्रथम स्थान पर बैठते थे
  rationale: यह अनुवाद बैठने और पद-क्रम, दोनों के मूल रूपक को बनाए रखता है; वैकल्पिक अर्थ सर्वोच्च राजकीय पदों पर आसीन होना है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। दरबारी पदानुक्रम की मूल छवि को मुख्य पाठ में बनाए रखते हुए उसके आशय को पादटिप्पणियों में स्पष्ट किया गया है।
