base_translation:
  language: en
  yaml_path: translation/ot/esther/001/019.yaml
  text: 'If it seems good to the king[a], let a royal decree go out from before him and be written among the laws of Persia and Media, so that it may not be revoked: that Vashti is not to come before King Ahasuerus[c][b], and let the king give her royal position to another woman better than she.'
translation:
  language: hi
  text: 'यदि राजा को उचित लगे[a], तो उसकी ओर से एक राजकीय आदेश जारी किया जाए और उसे फ़ारस और मादै के कानूनों में लिख दिया जाए, ताकि वह रद्द न किया जा सके[b]: वशती राजा अहशवेरोश के सामने न आए, और राजा उसका रानी-पद[c] किसी दूसरी ऐसी स्त्री को दे दे जो उससे अच्छी हो।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘यदि राजा को यह अच्छा लगे।’
    reason: lexical_alternative
  - marker: b
    text: या ‘ताकि उसे बदला न जा सके’ अथवा ‘ताकि उसका उल्लंघन न हो।’ इब्रानी मुहावरा आदेश की अटल कानूनी शक्ति को सूचित करता है।
    reason: lexical_alternative
  - marker: c
    text: शब्दशः ‘उसका राजत्व’; यहाँ आशय उसके रानी के पद या राजकीय हैसियत से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם עַל־הַמֶּלֶךְ טוֹב
  choice: यदि राजा को उचित लगे
  rationale: यह दरबारी विनम्रता से रखा गया प्रस्ताव है। यह हिंदी में स्वाभाविक है और राजा की स्वीकृति का भाव बनाए रखता है।
- source_word: יֵצֵא דְבַר מַלְכוּת מִלְּפָנָיו
  choice: उसकी ओर से एक राजकीय आदेश जारी किया जाए
  rationale: דְבַר מַלְכוּת औपचारिक शाही आदेश को सूचित करता है। מִלְּפָנָיו का शब्दशः रूप हिंदी में अस्वाभाविक होता; 'उसकी ओर से' राजा के अधिकार से आदेश निकलने का भाव स्पष्ट करता है।
- source_word: וְיִכָּתֵב בְּדָתֵי פָרַס וּמָדַי
  choice: उसे फ़ारस और मादै के कानूनों में लिख दिया जाए
  rationale: यह आदेश को मान्य विधि-संग्रह में औपचारिक रूप से दर्ज किए जाने का भाव व्यक्त करता है और मूल का देश-क्रम बनाए रखता है।
- source_word: וְלֹא יַעֲבוֹר
  choice: ताकि वह रद्द न किया जा सके
  rationale: कानूनी संदर्भ में वाक्यांश आदेश की स्थायी और अपरिवर्तनीय शक्ति बताता है। संभावित शाब्दिक अर्थों को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: אֲשֶׁר לֹא תָבוֹא וַשְׁתִּי לִפְנֵי הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: वशती राजा अहशवेरोश के सामने न आए
  rationale: यह आदेश की विषयवस्तु को सीधे और स्वाभाविक निषेध के रूप में व्यक्त करता है। मूल में स्पष्ट रूप से न होने के कारण 'फिर कभी' नहीं जोड़ा गया।
- source_word: וּמַלְכוּתָהּ
  choice: उसका रानी-पद
  rationale: यहाँ מַלְכוּת किसी भूभाग या राज्य के बजाय वशती की राजकीय हैसियत अथवा रानी के पद को सूचित करता है।
- source_word: לִרְעוּתָהּ
  choice: किसी दूसरी स्त्री को
  rationale: इस संदर्भ में शब्द वशती का स्थान लेने वाली अन्य स्त्री को सूचित करता है; 'सहेली' या 'पड़ोसिन' भ्रामक होगा।
- source_word: הַטּוֹבָה מִמֶּנָּה
  choice: उससे अच्छी
  rationale: यह मूल की सामान्य तुलनात्मक भाषा को बनाए रखता है और यह नहीं बताता कि वह किस विशेष अर्थ में बेहतर होगी।
