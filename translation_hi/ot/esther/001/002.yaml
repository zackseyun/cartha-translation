base_translation:
  language: en
  yaml_path: translation/ot/esther/001/002.yaml
  text: In those days[a], when King Ahasuerus sat on his royal throne, which was in Susa the citadel,
translation:
  language: hi
  text: उन दिनों, जब राजा अहश्वेरोश अपने राजसिंहासन पर विराजमान था, जो शूशन[a] के राजदुर्ग में था,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, सूसा।
    reason: स्थान-नाम के प्रचलित वैकल्पिक रूप की जानकारी।
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: उन दिनों
  rationale: यह इब्रानी का प्रचलित कथात्मक काल-सूचक वाक्यांश है; यह अनुवाद संकेतवाचक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: כְּשֶׁבֶת
  choice: जब ... विराजमान था
  rationale: כ के साथ क्रियार्थक संज्ञा यहाँ काल-सूचक उपवाक्य बनाती है। राजा और सिंहासन के प्रसंग में ‘विराजमान था’ स्वाभाविक तथा गरिमापूर्ण है।
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: राजा अहश्वेरोश
  rationale: उपाधि को नाम से पहले रखना स्वाभाविक हिन्दी है; नाम को इब्रानी उच्चारण के निकट लिप्यंतरित किया गया है।
- source_word: עַל כִּסֵּא מַלְכוּתוֹ
  choice: अपने राजसिंहासन पर
  rationale: शाब्दिक अर्थ ‘उसके राज्य/राजत्व का सिंहासन’ है। ‘अपने राजसिंहासन पर’ सम्बन्धसूचक प्रत्यय और राजकीय भाव दोनों को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֲשֶׁר
  choice: जो
  rationale: यह ‘राजसिंहासन’ को विशेषित करने वाला सम्बन्धवाचक उपवाक्य आरम्भ करता है।
- source_word: בְּשׁוּשַׁן
  choice: शूशन
  rationale: स्थान-नाम को इब्रानी रूप के निकट लिप्यंतरित किया गया है; ‘सूसा’ इसका प्रचलित यूनानी-आधारित रूप है।
- source_word: הַבִּירָה
  choice: राजदुर्ग
  rationale: यह शब्द यहाँ किलेबंद राजकीय-प्रशासनिक परिसर को सूचित करता है। ‘राजदुर्ग’ केवल सामान्य किले की अपेक्षा इस विशेष अर्थ को अधिक स्पष्टता से व्यक्त करता है।
