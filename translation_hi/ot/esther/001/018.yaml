translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण दरबारी प्रसंग के अनुरूप किंतु सामान्य पाठकों के लिए सहज। ‘कुलीन स्त्रियाँ’ सामाजिक प्रतिष्ठा बताता है, राजवंशीय संबंध नहीं; अंतिम इब्रानी वाक्यांश की अध्याहृत क्रिया को स्पष्ट हिन्दी के लिए ‘उत्पन्न होगा’ के रूप में पूरा किया गया है।
