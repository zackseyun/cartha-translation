source:
  edition: WLC
  text: וְֽ/הַ/יּ֨וֹם הַ/זֶּ֜ה תֹּאמַ֣רְנָה שָׂר֣וֹת פָּֽרַס וּ/מָדַ֗י אֲשֶׁ֤ר שָֽׁמְעוּ֙ אֶת דְּבַ֣ר הַ/מַּלְכָּ֔ה לְ/כֹ֖ל שָׂרֵ֣י הַ/מֶּ֑לֶךְ וּ/כְ/דַ֖י בִּזָּי֥וֹן וָ/קָֽצֶף׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/018.yaml
  text: And today the noblewomen of Persia and Media who have heard the queen’s word will say the same to all the king’s officials[c][b][a], and there will be enough contempt and wrath.
translation:
  language: hi
  text: और आज ही फ़ारस और मादै की कुलीन स्त्रियाँ, जिन्होंने रानी की बात सुनी है, राजा के सभी अधिकारियों से भी यही कहेंगी; और बहुत तिरस्कार और क्रोध होगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַיּוֹם הַזֶּה
  choice: और आज ही
  rationale: यह समय की तात्कालिकता दिखाता है। ‘आज ही’ स्वाभाविक हिन्दी में प्रसंग का बल व्यक्त करता है।
- source_word: תֹּאמַרְנָה
  choice: कहेंगी
  rationale: यह אמר का स्त्रीलिंग बहुवचन अपूर्ण रूप है और यहाँ मेमूकान की भविष्यवाणी के संदर्भ में भविष्यकाल व्यक्त करता है।
- source_word: שָׂרוֹת
  choice: कुलीन स्त्रियाँ
  rationale: शब्द उच्च पद अथवा प्रतिष्ठा वाली स्त्रियों को सूचित करता है; ‘राजकुमारियाँ’ अनावश्यक रूप से राजवंशीय अर्थ दे सकता है।
- source_word: פָּרַס וּמָדַי
  choice: फ़ारस और मादै की
  rationale: ये दोनों प्रचलित हिन्दी बाइबलीय भौगोलिक नाम हैं और שָׂרוֹת के साथ संबंध स्वाभाविक रूप से ‘की’ से व्यक्त होता है।
- source_word: אֲשֶׁר שָׁמְעוּ
  choice: जिन्होंने ... सुनी है
  rationale: पूर्ण क्रिया ऐसी सुनी हुई बात बताती है जिसका वर्तमान और आगामी व्यवहार पर प्रभाव है; हिन्दी पूर्ण वर्तमान इसे ठीक व्यक्त करता है।
- source_word: אֶת דְּבַר הַמַּלְכָּה
  choice: रानी की बात
  rationale: דבר का अर्थ ‘वचन, बात, मामला’ हो सकता है। ‘रानी की बात’ कथन और उससे संबंधित घटना—दोनों की कुछ व्यापकता बनाए रखता है।
- source_word: לְכֹל שָׂרֵי הַמֶּלֶךְ
  choice: राजा के सभी अधिकारियों से
  rationale: שׂרים शासकीय अथवा दरबारी पदाधिकारियों को दर्शाता है। हिन्दी में कहने के संबोधन के लिए ‘से’ स्वाभाविक है।
- source_word: וּכְדַי בִּזָּיוֹן וָקָצֶף
  choice: और इससे बहुत तिरस्कार और क्रोध उत्पन्न होगा
  rationale: इब्रानी अंतिम उपवाक्य संक्षिप्त/अध्याहृत है—शाब्दिक रूप से ‘और पर्याप्त तिरस्कार और क्रोध’। ‘बहुत ... उत्पन्न होगा’ अर्थ को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בִּזָּיוֹן
  choice: तिरस्कार
  rationale: यह संज्ञा अवमानना अथवा अपमानपूर्ण व्यवहार का बोध कराती है; प्रसंग में ‘तिरस्कार’ उपयुक्त है।
- source_word: וָקָצֶף
  choice: और क्रोध
  rationale: קצף प्रबल रोष को दर्शाता है। ‘क्रोध’ आधुनिक, गरिमापूर्ण और व्यापक रूप से समझा जाने वाला विकल्प है।
