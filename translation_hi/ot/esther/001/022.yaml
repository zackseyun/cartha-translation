source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח סְפָרִים֙ אֶל כָּל מְדִינ֣וֹת הַ/מֶּ֔לֶךְ אֶל מְדִינָ֤ה וּ/מְדִינָה֙ כִּ/כְתָבָ֔/הּ וְ/אֶל עַ֥ם וָ/עָ֖ם כִּ/לְשׁוֹנ֑/וֹ לִ/הְי֤וֹת כָּל אִישׁ֙ שֹׂרֵ֣ר בְּ/בֵית֔/וֹ וּ/מְדַבֵּ֖ר כִּ/לְשׁ֥וֹן עַמּֽ/וֹ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/022.yaml
  text: And he sent letters to all the provinces of the king[a], to each province in its own script and to each people in its own language[d][c][b], that every man should be master in his own house and speak the language of his own people.
translation:
  language: hi
  text: तब उसने राजा के सभी प्रान्तों में पत्र भेजे—हर प्रान्त को उसकी अपनी लिपि में और हर जाति को उसकी अपनी भाषा में[a]—कि हर पुरुष अपने घर में अधिकार रखे[b] और अपने लोगों की भाषा बोले।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “हर प्रान्त को उसके लेख के अनुसार और हर जाति को उसकी भाषा के अनुसार”; आशय है कि आदेश प्रत्येक क्षेत्र और समुदाय के लिए उपयुक्त लिपि और भाषा में भेजा गया।
    reason: cultural_note
  - marker: b
    text: या, “कि हर पति अपने घर पर शासन करे।” इब्रानी में “हर पुरुष” है, पर प्रसंग में आदेश वैवाहिक घराने के अधिकार से सम्बन्धित है।
    reason: lexical_alternative
  - marker: c
    text: अन्तिम वाक्यांश का सीधा अर्थ है कि प्रत्येक पुरुष अपने लोगों की भाषा बोले; इसका व्यापक आशय यह भी हो सकता है कि घर की व्यवस्था पति की भाषायी पहचान के अनुसार हो।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: तब उसने ... भेजे
  rationale: वय्यिक्तोल कथानक को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में क्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: סְפָרִים
  choice: पत्र
  rationale: राजकीय-प्रशासनिक सन्दर्भ में यह साम्राज्य भर में भेजे गए लिखित संदेशों या राजपत्रों को दर्शाता है; ‘पत्र’ सहज और पर्याप्त व्यापक है।
- source_word: כָּל מְדִינוֹת הַמֶּלֶךְ
  choice: राजा के सभी प्रान्तों में
  rationale: सम्बन्धसूचक रचना राजा के राज्याधीन प्रान्तों को बताती है; हिन्दी में गन्तव्य के साथ ‘में पत्र भेजे’ स्वाभाविक है।
- source_word: אֶל מְדִינָה וּמְדִינָה כִּכְתָבָהּ
  choice: हर प्रान्त को उसकी अपनी लिपि में
  rationale: दोहराया हुआ एकवचन वितरणात्मक अर्थ देता है और כִּכְתָבָהּ प्रत्येक प्रान्त की लेखन-लिपि को सूचित करता है।
- source_word: וְאֶל עַם וָעָם כִּלְשׁוֹנוֹ
  choice: हर जाति को उसकी अपनी भाषा में
  rationale: עַם यहाँ साम्राज्य के भीतर भाषायी-जातीय समुदाय है; ‘जाति’ आधुनिक हिन्दी बाइबलीय गद्य में ‘राष्ट्र’ की अपेक्षा इस प्रसंग के लिए अधिक उपयुक्त है।
- source_word: לִהְיוֹת כָּל אִישׁ שֹׂרֵר בְּבֵיתוֹ
  choice: कि हर पुरुष अपने घर में अधिकार रखे
  rationale: לִהְיוֹת आज्ञा की विषयवस्तु व्यक्त करता है और שֹׂרֵר शासन/प्रभुत्व का भाव रखता है। ‘अधिकार रखे’ अर्थ को स्पष्ट करता है, जबकि ‘स्वामी हो’ से उत्पन्न अनावश्यक धार्मिक या स्वामित्वगत अर्थ से बचता है।
- source_word: וּמְדַבֵּר כִּלְשׁוֹן עַמּוֹ
  choice: और अपने लोगों की भाषा बोले
  rationale: मसोरेटी पाठ में यह स्वतंत्र समन्वित उपवाक्य है; अनुवाद उसके प्रत्यक्ष भाषायी अर्थ को बनाए रखता है।
theological_decisions:
- issue: כָּל אִישׁ का दायरा
  choice: हर पुरुष
  alternative: हर पति
  rationale: इब्रानी में सामान्य शब्द ‘पुरुष’ है, यद्यपि प्रसंग वैवाहिक और घरेलू अधिकार से जुड़ा है। मुख्य पाठ में मूल की व्यापक शब्दावली रखी गई और प्रसंगगत विकल्प पादटिप्पणी में दिया गया।
- issue: अन्तिम भाषायी उपवाक्य का आशय
  choice: अपने लोगों की भाषा बोले
  alternative: घर की व्यवस्था पुरुष की भाषायी पहचान के अनुसार हो
  rationale: मुख्य पाठ इब्रानी शब्दों का सीधा अर्थ देता है। व्यापक सामाजिक आशय सम्भव है, पर उसे स्पष्ट तथ्य बनाकर पाठ में आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण प्रशासनिक-कथात्मक गद्य। ‘प्रान्त’, ‘लिपि’, ‘भाषा’ और ‘अधिकार’ सामान्य पाठकों के लिए स्पष्ट हैं। मूल की पुनरुक्त वितरणात्मक रचना को स्वाभाविक हिन्दी ‘हर ...’ से व्यक्त किया गया है; अस्पष्टताओं को मुख्य पाठ में अनावश्यक रूप से नहीं सुलझाया गया।
