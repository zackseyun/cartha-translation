base_translation:
  language: en
  yaml_path: translation/ot/esther/001/015.yaml
  text: According to the law[c][b][a], what is to be done with Queen Vashti because she did not carry out the command of King Ahasuerus delivered by the eunuchs?
translation:
  language: hi
  text: “कानून के अनुसार, रानी वशती के साथ क्या किया जाए, क्योंकि उसने राजा अहश्वेरोश की वह आज्ञा पूरी नहीं की जो खोजों[a][b] के द्वारा पहुँचाई गई थी?”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “खोजों के हाथों”; इब्रानी में शाब्दिक अर्थ है, “खोजों के हाथ के द्वारा।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी शब्द का व्यापक अर्थ राजदरबार के अधिकारी भी हो सकता है, यद्यपि “खोजे” इसका अधिक सीधा अनुवाद है।
    reason: cultural_note
  - marker: c
    text: या, “क्योंकि उसने राजा अहश्वेरोश की आज्ञा नहीं मानी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּדָת
  choice: कानून के अनुसार
  rationale: एस्तेर के फ़ारसी राजदरबार के संदर्भ में דָּת विधि या राजकीय कानून को दर्शाता है; यह अनुवाद प्रश्न के औपचारिक कानूनी स्वर को बनाए रखता है।
- source_word: מַה לַּעֲשׂוֹת
  choice: क्या किया जाए
  rationale: यह हिंदी में स्वाभाविक रहते हुए मूल के निर्वैयक्तिक, विचार-विमर्शात्मक कानूनी भाव को व्यक्त करता है।
- source_word: בַּמַּלְכָּה וַשְׁתִּי
  choice: रानी वशती के साथ
  rationale: यहाँ עשה के साथ ב किसी व्यक्ति के विषय में किए जाने वाले व्यवहार या कार्रवाई को बताता है; ‘के साथ’ दंड या शत्रुता को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: עַל אֲשֶׁר לֹא עָשְׂתָה
  choice: क्योंकि उसने ... पूरा नहीं किया
  rationale: עַל אֲשֶׁר कार्रवाई का कारण देता है और עָשְׂתָה का मूल अर्थ ‘करना’ है; ‘पूरा नहीं किया’ आज्ञा के संदर्भ में स्वाभाविक है और मुख्य पाठ में ‘आज्ञा नहीं मानी’ जैसा अधिक व्याख्यात्मक शब्द नहीं जोड़ता।
- source_word: מַאֲמַר
  choice: आज्ञा
  rationale: राजकीय संदर्भ में यह शब्द अधिकारपूर्ण कथन या आदेश का बोध कराता है; ‘आज्ञा’ आधुनिक गरिमापूर्ण हिंदी में उपयुक्त है।
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: राजा क्षयर्ष
  rationale: राजकीय उपाधि का अनुवाद किया गया है और नाम के लिए हिंदी बाइबल परंपरा में प्रचलित ‘क्षयर्ष’ रूप रखा गया है।
- source_word: בְּיַד הַסָּרִיסִים
  choice: खोजों के हाथ भेजी गई थी
  rationale: शाब्दिक वाक्यांश ‘खोजों के हाथ’ माध्यम या प्रतिनिधि द्वारा संदेश पहुँचाने का मुहावरा है। इसे बनाए रखने से मूल बिंब सुरक्षित रहता है और हिंदी में आशय भी स्पष्ट होता है।
