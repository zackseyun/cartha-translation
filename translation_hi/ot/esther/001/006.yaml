  text: ח֣וּר כַּרְפַּ֣ס וּ/תְכֵ֗לֶת אָחוּז֙ בְּ/חַבְלֵי ב֣וּץ וְ/אַרְגָּמָ֔ן עַל גְּלִ֥ילֵי כֶ֖סֶף וְ/עַמּ֣וּדֵי שֵׁ֑שׁ מִטּ֣וֹת זָהָ֣ב וָ/כֶ֗סֶף עַ֛ל רִֽצְפַ֥ת בַּהַט וָ/שֵׁ֖שׁ וְ/דַ֥ר וְ/סֹחָֽרֶת׀־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/006.yaml
  text: There were hangings of white cotton and blue[a], fastened with cords of fine linen and purple to silver rings and marble pillars, and couches of gold and silver on a pavement of alabaster, marble, mother-of-pearl[c][b], and precious stones.
translation:
  language: hi
  text: वहाँ सफेद सूती और नीले रंग के परदे थे। वे महीन लिनन और बैंगनी रंग की डोरियों से चाँदी के छल्लों[a] और संगमरमर के खंभों से बँधे थे। सोने और चाँदी की भोज-शय्याएँ[b] सिलखड़ी, संगमरमर, सीप की चमकीली परत और बहुमूल्य पत्थरों के फर्श[c] पर रखी थीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘चाँदी की गोल छड़ें’; इब्रानी शब्द किसी गोल अथवा बेलनाकार चाँदी की फिटिंग को भी सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: ये सोने के साधारण पलंग नहीं, बल्कि भोज के समय टेक लगाकर या लेटकर भोजन करने की शय्याकार चौकियाँ थीं।
    reason: cultural_note
  - marker: c
    text: फर्श में प्रयुक्त पदार्थों के इब्रानी नामों की ठीक-ठीक पहचान अनिश्चित है। ‘सिलखड़ी’, ‘संगमरमर’, ‘सीप की चमकीली परत’ और ‘बहुमूल्य पत्थर’ प्रचलित पहचानें हैं; इनके लिए ‘पोर्फिरी’, ‘श्वेत संगमरमर’ या ‘गहरे रंग के पत्थर’ जैसे अन्य अनुवाद भी मिलते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: חוּר כַּרְפַּס וּתְכֵלֶת
  choice: सफेद सूती कपड़े और नीले रंग के परदे
  rationale: חוּר को यहाँ रंग ‘सफेद’, כַּרְפַּס को सूती वस्त्र और תְכֵלֶת को प्रतिष्ठित नीला/नील-बैंगनी रंग समझा गया है। वाक्य में ‘परदे’ जोड़ने से सजावटी वस्त्रों का आशय स्वाभाविक हिंदी में स्पष्ट होता है।
- source_word: חַבְלֵי בוּץ וְאַרְגָּמָן
  choice: महीन सन और बैंगनी रंग की डोरियाँ
  rationale: בּוּץ उत्तम सन के वस्त्र या धागे को और אַרְגָּמָן महँगे बैंगनी रंग को दर्शाता है; ‘डोरियाँ’ इस सजावटी बंधन के संदर्भ में स्वाभाविक है।
- source_word: גְּלִילֵי כֶסֶף
  choice: चाँदी के छल्ले
  rationale: גְּלִילִים का मूल भाव गोल या लपेटी हुई वस्तु है। परदे बाँधने के संदर्भ में ‘छल्ले’ उपयुक्त है, पर वस्तु की सटीक बनावट अनिश्चित होने के कारण विकल्प पाद-टिप्पणी में दिया गया है।
- source_word: עַמּוּדֵי שֵׁשׁ
  choice: संगमरमर के खंभे
  rationale: यहाँ שֵׁשׁ वस्त्र नहीं, श्वेत सजावटी पत्थर को सूचित करता है; स्थापत्य संदर्भ में ‘संगमरमर’ सर्वाधिक स्पष्ट सामान्य पहचान है।
- source_word: מִטּוֹת זָהָב וָכֶסֶף
  choice: सोने और चाँदी की भोज-शय्याएँ
  rationale: מִטּוֹת ऐसी शय्याकार चौकियों को दर्शाता है जिन पर प्राचीन भोजों में टिककर या लेटकर भोजन किया जाता था। ‘भोज-शय्याएँ’ सामान्य सोने के पलंगों से इनका भेद स्पष्ट करता है।
- source_word: רִצְפַת בַּהַט וָשֵׁשׁ וְדַר וְסֹחָרֶת
  choice: सिलखड़ी, संगमरमर, सीप और बहुमूल्य पत्थरों से बना फर्श
  rationale: רִצְפַת निर्मित फर्श है। चारों सजावटी पदार्थों की पहचान पूर्णतः निश्चित नहीं है; मुख्य पाठ में प्रचलित विद्वत्तापूर्ण पहचानों को पठनीय हिंदी में रखा गया और अनिश्चितता पाद-टिप्पणी में सुरक्षित की गई है।
