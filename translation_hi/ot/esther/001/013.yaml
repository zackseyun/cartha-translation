  register: आधुनिक मानक हिन्दी में गरिमापूर्ण कथात्मक शैली। ‘इसी रीति से रखा जाता था’ मूल के כִּי כֵן और לִפְנֵי को स्पष्ट करता है, जबकि वाक्य का अधूरा, अगले पद में जारी रहनेवाला ढाँचा दीर्घ डैश से सुरक्षित रखा गया है।
