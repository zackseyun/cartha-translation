  yaml_path: translation/ot/esther/001/013.yaml
  text: Then the king said to the wise men who knew the times—for this was the king’s procedure before all who knew law and judgment—
translation:
  language: hi
  text: तब राजा ने समयों को जाननेवाले बुद्धिमानों से कहा—क्योंकि विधि और न्याय का ज्ञान रखनेवाले सब लोगों के सामने राजा के मामलों की कार्यवाही इसी रीति से होती थी—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֹדְעֵי הָעִתִּים
  choice: समयों की समझ रखनेवाले
  rationale: शाब्दिक अर्थ ‘समयों को जाननेवाले’ है; यह अभिव्यक्ति उचित समय, परिस्थितियों और राजकीय प्रसंगों की विशेषज्ञ समझ का संकेत दे सकती है। बहुवचन और मूल की व्यापकता बनाए रखी गई है।
- source_word: דְּבַר הַמֶּלֶךְ
  choice: राजा का मामला
  rationale: דָּבָר यहाँ ‘बात’, ‘मामला’ या ‘कार्यवाही’ हो सकता है। प्रसंग में विवाद/राजकीय विषय को विशेषज्ञों के सामने रखने की प्रक्रिया अभिप्रेत है; ‘मामला’ स्वाभाविक है और अनावश्यक रूप से ‘रीति’ का अर्थ इसी पद में नहीं डालता।
- source_word: דָּת וָדִין
  choice: विधि और न्याय
  rationale: דָּת फ़ारसी प्रशासनिक संदर्भ में कानून/विधि है और דִּין न्याय, निर्णय या न्यायिक प्रक्रिया को सूचित करता है। ‘विधि और न्याय’ दोनों पदों का भेद बनाए रखता है।
