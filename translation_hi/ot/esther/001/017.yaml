  text: כִּֽי יֵצֵ֤א דְבַר הַ/מַּלְכָּה֙ עַל כָּל הַ/נָּשִׁ֔ים לְ/הַבְז֥וֹת בַּעְלֵי/הֶ֖ן בְּ/עֵינֵי/הֶ֑ן בְּ/אָמְרָ֗/ם הַ/מֶּ֣לֶךְ אֲחַשְׁוֵר֡וֹשׁ אָמַ֞ר לְ/הָבִ֨יא אֶת וַשְׁתִּ֧י הַ/מַּלְכָּ֛ה לְ/פָנָ֖י/ו וְ/לֹא בָֽאָה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/017.yaml
  text: For the queen’s matter will go out to all women, causing them to despise their husbands in their eyes, when they say, ‘King Ahasuerus said to bring Queen Vashti before him, but she did not come.’
translation:
  language: hi
  text: क्योंकि रानी का मामला सभी स्त्रियों तक पहुँच जाएगा, जिससे वे अपनी दृष्टि में अपने पतियों को तुच्छ समझेंगी, जब वे कहेंगी, ‘राजा अहशवेरोश ने रानी वशती को अपने सामने लाने को कहा, पर वह नहीं आई।’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דְבַר הַמַּלְכָּה
  choice: रानी की बात
  rationale: דָּבָר का अर्थ यहाँ रानी से जुड़ी घटना या मामला है। ‘रानी की बात’ मूल की व्यापकता बनाए रखता है और उसके आचरण का अतिरिक्त मूल्यांकन नहीं जोड़ता।
- source_word: יֵצֵא ... עַל כָּל הַנָּשִׁים
  choice: सब स्त्रियों में फैल जाएगी
  rationale: शाब्दिक ‘निकल जाएगी’ के स्थान पर प्रसंगानुकूल अर्थ व्यक्त करता है कि इस घटना की खबर सभी स्त्रियों तक पहुँचेगी।
- source_word: לְהַבְזוֹת בַּעְלֵיהֶן בְּעֵינֵיהֶן
  choice: वे अपने पतियों को तुच्छ समझने लगेंगी
  rationale: हिब्रू में अपने ही दृष्टिकोण में पतियों को नीचा या तुच्छ मानने का भाव है; हिंदी में यह स्वाभाविक रूप से उसी अर्थ को व्यक्त करता है।
- source_word: אָמַר לְהָבִיא
  choice: लाने को कहा
  rationale: אָמַר का सामान्य अर्थ ‘कहा’ है; ‘आज्ञा दी’ मूल से अधिक स्पष्ट अधिकारात्मक बल जोड़ता।
- source_word: לְפָנָיו
  choice: अपने सामने
  rationale: राजा की उपस्थिति में लाए जाने का सरल और स्वाभाविक हिंदी रूप।
theological_decisions:
- issue: रानी के कार्य का नैतिक निरूपण
  choice: रानी की बात
  alternative: रानी का आचरण
  rationale: मूल דְבַר तटस्थ रूप से ‘बात/मामला’ कह सकता है; ‘आचरण’ नैतिक दोष का अधिक स्पष्ट संकेत जोड़ सकता है।
- issue: राजा के कथन का आदेशात्मक बल
  choice: लाने को कहा
  alternative: लाने की आज्ञा दी
  rationale: मूल में אָמַר ‘कहा’ है। राजकीय प्रसंग आदेश का संकेत दे सकता है, पर अनुवाद में उस निहितार्थ को स्पष्ट आज्ञा बनाकर तनाव का समाधान नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी, सहज किंतु गरिमापूर्ण कथात्मक शैली। व्यक्तिनाम ‘अहशवेरोश’ और ‘वशती’ मूल हिब्रू के निकट रखे गए हैं।
