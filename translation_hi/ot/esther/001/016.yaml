  text: וַ/יֹּ֣אמֶר מומכן לִ/פְנֵ֤י הַ/מֶּ֨לֶךְ֙ וְ/הַ/שָּׂרִ֔ים לֹ֤א עַל הַ/מֶּ֨לֶךְ֙ לְ/בַדּ֔/וֹ עָוְתָ֖ה וַשְׁתִּ֣י הַ/מַּלְכָּ֑ה כִּ֤י עַל כָּל הַ/שָּׂרִים֙ וְ/עַל כָּל הָ֣/עַמִּ֔ים אֲשֶׁ֕ר בְּ/כָל מְדִינ֖וֹת הַ/מֶּ֥לֶךְ אֲחַשְׁוֵרֽוֹשׁ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/016.yaml
  text: Then Memucan said before the king and the officials[a], “Queen Vashti has done wrong not against the king alone, but against all the officials and all the peoples who are in all the provinces of King Ahasuerus.”
translation:
  language: hi
  text: तब ममूकान ने राजा और अधिकारियों के सामने कहा, “रानी वशती ने केवल राजा के विरुद्ध ही गलत नहीं किया, बल्कि राजा अहश्वेरोश के सभी प्रांतों में रहने वाले सभी अधिकारियों और सभी जातियों के लोगों के विरुद्ध भी गलत किया है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने ... कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מומכן
  choice: ममूकान
  rationale: व्यक्तिवाचक नाम का हिब्रू रूप के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: לִפְנֵי
  choice: के सामने
  rationale: यह राजा और अधिकारियों की उपस्थिति में बोलने का अर्थ देता है और हिन्दी में सहज है।
- source_word: הַשָּׂרִים
  choice: अधिकारी
  rationale: फ़ारसी राजदरबार के उच्च पदाधिकारियों के लिए यह स्पष्ट और आधुनिक शब्द है; ‘राजकुमार’ मूल पद की सीमा को अनावश्यक रूप से संकुचित कर सकता है।
- source_word: עָוְתָה
  choice: गलत किया है
  rationale: क्रिया नैतिक रूप से अनुचित या टेढ़ा आचरण करने का बोध देती है; यह अनुवाद उस अर्थ को रखता है, बिना इसे केवल निजी अपमान बना देने के।
- source_word: וַשְׁתִּי הַמַּלְכָּה
  choice: रानी वशती
  rationale: हिन्दी में उपाधि को नाम से पहले रखना स्वाभाविक है और अर्थ अपरिवर्तित रहता है।
- source_word: לֹא עַל הַמֶּלֶךְ לְבַדּוֹ ... כִּי
  choice: केवल राजा के ही विरुद्ध ... नहीं, बल्कि ... भी
  rationale: यह रचना ‘केवल यह नहीं, बल्कि वह भी’ वाले सुधारात्मक विस्तार को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: עַל כָּל הַשָּׂרִים וְעַל כָּל הָעַמִּים
  choice: सभी अधिकारियों और सभी जातियों के लोगों के विरुद्ध
  rationale: ‘अधिकारियों’ और बहुवचन ‘जनसमुदायों’ दोनों को अलग समूहों के रूप में सुरक्षित रखा गया है; ‘सभी जातियों के लोग’ बहुजातीय साम्राज्य के संदर्भ में सहज हिन्दी है।
- source_word: אֲשֶׁר בְּכָל מְדִינוֹת
  choice: सभी प्रांतों में रहने वाले
  rationale: संबंधवाचक वाक्यांश साम्राज्य भर में इन समूहों की उपस्थिति बताता है; हिन्दी में कृदन्तीय रचना अधिक सहज है।
- source_word: מְדִינוֹת
  choice: प्रांत
  rationale: साम्राज्य की प्रशासनिक इकाइयों के लिए मानक और सुबोध हिन्दी शब्द।
- source_word: אֲחַשְׁוֵרוֹשׁ
  choice: अहश्वेरोश
  rationale: राजा के हिब्रू नाम का निकट देवनागरी लिप्यंतरण।
