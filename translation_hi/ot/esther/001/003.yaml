- from: अपने शासन के तीसरे वर्ष में उसने अपने सभी अधिकारियों और सेवकों के लिए एक भोज दिया। फ़ारस और मादै की सेना, कुलीन जन और प्रान्तों के अधिकारी उसके सामने उपस्थित थे।
  to: अपने शासन के तीसरे वर्ष में उसने अपने सभी अधिकारियों और सेवकों—फ़ारस और मादै की सेना, कुलीन जन और प्रान्तों के अधिकारी, जो उसके सामने थे—के लिए एक भोज दिया।
  rationale: The revision retains all of the draft’s sound lexical choices while restoring the source’s single, extended guest-list construction. “जो उसके सामने थे” naturally conveys לְפָנָיו and is positioned to cover the listed attendees without introducing a separate event or assertion.
