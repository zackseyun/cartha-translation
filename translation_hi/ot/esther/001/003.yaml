source:
  edition: WLC
  text: בִּ/שְׁנַ֤ת שָׁלוֹשׁ֙ לְ/מָלְכ֔/וֹ עָשָׂ֣ה מִשְׁתֶּ֔ה לְ/כָל שָׂרָ֖י/ו וַ/עֲבָדָ֑י/ו חֵ֣יל פָּרַ֣ס וּ/מָדַ֗י הַֽ/פַּרְתְּמִ֛ים וְ/שָׂרֵ֥י הַ/מְּדִינ֖וֹת לְ/פָנָֽי/ו־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/003.yaml
  text: In the third year of his reign[a], he gave a banquet for all his officials and servants—the army of Persia and Media, the nobles[c][b], and the officials of the provinces before him.
translation:
  language: hi
  text: अपने शासन के तीसरे वर्ष में उसने अपने सभी अधिकारियों और सेवकों—फ़ारस और मादै की सेना, कुलीन जन और प्रान्तों के अधिकारी, जो उसके सामने थे—के लिए एक भोज दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת שָׁלוֹשׁ לְמָלְכוֹ
  choice: अपने शासन के तीसरे वर्ष में
  rationale: यह स्वाभाविक हिन्दी में काल-सूचना देता है और לְמָלְכוֹ को राज्यारोहण की घटना के बजाय उसके शासनकाल के रूप में व्यक्त करता है।
- source_word: עָשָׂה מִשְׁתֶּה
  choice: एक भोज दिया
  rationale: עָשָׂה का शाब्दिक अर्थ ‘किया/बनाया’ है, पर מִשְׁתֶּה के साथ ‘भोज दिया’ हिन्दी का स्वाभाविक मुहावरा है। מִשְׁתֶּה में पीने और उत्सव का भाव हो सकता है, किंतु ‘भोज’ राजकीय प्रसंग में स्पष्ट और गरिमापूर्ण है।
- source_word: לְכָל שָׂרָיו וַעֲבָדָיו
  choice: अपने सभी अधिकारियों और सेवकों के लिए
  rationale: שָׂרָיו यहाँ पदाधिकारी या शासकीय अधिकारी हैं। עֲבָדָיו राजदरबार के सेवकों अथवा अधीनस्थ कर्मियों को सूचित कर सकता है; ‘सेवक’ स्रोत की व्यापकता बनाए रखता है।
- source_word: חֵיל פָּרַס וּמָדַי
  choice: फ़ारस और मादै की सेना
  rationale: חֵיל के ‘बल’, ‘सैन्य-बल’ और ‘सेना’ अर्थ संभव हैं। इस राजकीय सूची में ‘सेना’ संक्षिप्त, स्वाभाविक और सैन्य आशय के अनुकूल है।
- source_word: הַפַּרְתְּמִים
  choice: कुलीन जन
  rationale: यह फ़ारसी मूल का पद उच्च श्रेणी के अभिजात अथवा कुलीन लोगों के लिए है। ‘कुलीन जन’ आधुनिक हिन्दी में बोधगम्य है और कोई अधिक विशिष्ट दरबारी पद आरोपित नहीं करता।
- source_word: וְשָׂרֵי הַמְּדִינוֹת
  choice: और प्रान्तों के अधिकारी
  rationale: यह प्रान्तीय शासकीय पदाधिकारियों का व्यापक उल्लेख है। ‘राज्यपाल’ कहना मूल से अधिक विशिष्ट होता।
- source_word: לְפָנָיו
  choice: उसके सामने उपस्थित थे
  rationale: शाब्दिक अर्थ ‘उसके सामने’ है और प्रसंग में राजा की उपस्थिति में एकत्र होने का बोध देता है। पूर्ण वाक्य में ‘उपस्थित थे’ जोड़ने से हिन्दी स्वाभाविक बनती है और दरबारी उपस्थिति का आशय स्पष्ट रहता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी और गरिमापूर्ण कथात्मक शैली अपनाई गई है। लम्बी सूची की अस्पष्ट संरचना को हिन्दी में दो वाक्यों में बाँटा गया है; दूसरा वाक्य भोज में उपस्थित प्रमुख समूहों को बताता है। ‘फ़ारस’ और ‘मादै’ प्रचलित बाइबिलीय-ऐतिहासिक नामों के रूप में रखे गए हैं।
