  text: इस दौरान वह बहुत दिनों तक—एक सौ अस्सी दिनों तक—अपने राज्य के गौरव की धन-सम्पत्ति और अपनी महानता की प्रतिष्ठामयी शोभा दिखाता रहा।
  philosophy: optimal-equivalence
lexical_decisions:
