  choice: दिखाता रहा
  rationale: इनफ़िनिटिव रचना जारी परिस्थिति बताती है; हिन्दी में यह रूप दीर्घकाल तक चले प्रदर्शन को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עֹשֶׁר כְּבוֹד מַלְכוּתוֹ
  choice: अपने राज्य की महिमा का धन
  rationale: शाब्दिक संज्ञा-श्रृंखला की भव्यता और अर्थगत बहुलता बनाए रखी गई है; इसे केवल ‘वैभव’ कहकर संकुचित नहीं किया गया।
- source_word: יְקָר תִּפְאֶרֶת גְּדוּלָּתוֹ
  choice: अपनी महानता की प्रतिष्ठा का वैभव
  rationale: יְקָר को ‘प्रतिष्ठा’ और תִּפְאֶרֶת को ‘वैभव’ देकर निकटवर्ती भिन्न संज्ञाओं का अंतर सुरक्षित रखा गया है।
- source_word: יָמִים רַבִּים שְׁמוֹנִים וּמְאַת יוֹם
  choice: बहुत दिनों तक—एक सौ अस्सी दिनों तक
  rationale: मूल के सामान्य काल-वर्णन के बाद आने वाली सटीक अवधि को डैश द्वारा स्पष्ट और प्रभावपूर्ण रखा गया है।
