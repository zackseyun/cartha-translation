  text: וּ/בְ/הַגִּ֡יעַ תֹּר֩ נַעֲרָ֨ה וְ/נַעֲרָ֜ה לָ/ב֣וֹא אֶל הַ/מֶּ֣לֶךְ אֲחַשְׁוֵר֗וֹשׁ מִ/קֵּץ֩ הֱי֨וֹת לָ֜/הּ כְּ/דָ֤ת הַ/נָּשִׁים֙ שְׁנֵ֣ים עָשָׂ֣ר חֹ֔דֶשׁ כִּ֛י כֵּ֥ן יִמְלְא֖וּ יְמֵ֣י מְרוּקֵי/הֶ֑ן שִׁשָּׁ֤ה חֳדָשִׁים֙ בְּ/שֶׁ֣מֶן הַ/מֹּ֔ר וְ/שִׁשָּׁ֤ה חֳדָשִׁים֙ בַּ/בְּשָׂמִ֔ים וּ/בְ/תַמְרוּקֵ֖י הַ/נָּשִֽׁים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/012.yaml
  text: 'When the turn of each young woman came to go in to King Ahasuerus, after she had been under the regulation for the women for twelve months—for in this way the days of their beauty treatments were completed: six months with oil of myrrh, and six months with spices and with the cosmetics for women—'
translation:
  language: hi
  text: 'जब एक-एक युवती की बारी राजा क्षयर्ष के पास जाने की आती थी, तब तक वह स्त्रियों के लिए ठहराई गई विधि के अनुसार बारह महीने पूरे कर चुकी होती थी—क्योंकि उनके सौंदर्य-उपचार की अवधि इसी प्रकार पूरी होती थी: छह महीने गन्धरस के तेल से और छह महीने सुगन्ध-द्रव्यों तथा स्त्रियों के सौंदर्य-प्रसाधनों से—'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תֹּר
  choice: बारी
  rationale: क्रम में आने वाले अवसर का स्वाभाविक और सटीक हिन्दी रूप।
- source_word: כְּדָת הַנָּשִׁים
  choice: स्त्रियों के लिए ठहराई गई विधि के अनुसार
  rationale: דָּת यहाँ राजकीय रूप से निर्धारित नियम या व्यवस्था को दर्शाता है; यह रूप कठोर कानूनी भाषा से बचते हुए बाध्यकारी व्यवस्था स्पष्ट करता है।
- source_word: מְרוּקֵיהֶן
  choice: उनके सौंदर्य-उपचार
  rationale: मूल शब्द शुद्ध करने, सँवारने या सौंदर्य-वर्धक उपचार की प्रक्रिया को सूचित करता है; संदर्भ में 'सौंदर्य-उपचार' व्यापक अर्थ सुरक्षित रखता है।
- source_word: שֶׁמֶן הַמֹּר
  choice: गन्धरस का तेल
  rationale: מֹר का पारंपरिक और समझने योग्य हिन्दी नाम 'गन्धरस' है।
- source_word: בַּבְּשָׂמִים
  choice: सुगन्ध-द्रव्यों
  rationale: बहुवचन सुगंधित पदार्थों या मसालों का बोध कराता है; प्रसाधन-संदर्भ में 'सुगन्ध-द्रव्य' स्वाभाविक है।
- source_word: תַמְרוּקֵי הַנָּשִׁים
  choice: स्त्रियों के अन्य सौंदर्य-प्रसाधनों
  rationale: पहले उल्लिखित उपचारों से संबंध स्पष्ट करने के लिए 'अन्य' स्वाभाविक रूप से निहित श्रेणी को व्यक्त करता है; 'सौंदर्य-प्रसाधन' बाहरी सँवार के साधनों का उपयुक्त आधुनिक शब्द है।
