  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। पद मूल में अगले पद से जुड़ा हुआ अधूरा काल-वाक्य है, इसलिए अंत में दीर्घ डैश रखकर उस वाक्यगत निरंतरता को बनाए रखा गया है। राजा का नाम प्रचलित हिन्दी बाइबलीय रूप 'क्षयर्ष' रखा गया है।
