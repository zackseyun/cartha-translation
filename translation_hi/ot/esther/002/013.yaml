  text: וּ/בָ/זֶ֕ה הַֽ/נַּעֲרָ֖ה בָּאָ֣ה אֶל הַ/מֶּ֑לֶךְ אֵת֩ כָּל אֲשֶׁ֨ר תֹּאמַ֜ר יִנָּ֤תֵֽן לָ/הּ֙ לָ/ב֣וֹא עִמָּ֔/הּ מִ/בֵּ֥ית הַ/נָּשִׁ֖ים עַד בֵּ֥ית הַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/013.yaml
  text: 'And in this way the young woman went to the king: whatever she said would be given to her to take with her from the house of the women to the king’s house[a][b].'
translation:
  language: hi
  text: 'और युवती इस रीति से राजा के पास जाती थी: वह जो कुछ माँगती, वह उसे दे दिया जाता, ताकि वह उसे स्त्रियों के भवन से राजा के भवन तक अपने साथ ले जाए[a][b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “वह जो कुछ कहती।” प्रसंग में इसका अर्थ है, वह जो कुछ अपने साथ ले जाने के लिए माँगती।'
    reason: lexical_alternative
  - marker: b
    text: “स्त्रियों का भवन” इब्रानी अभिव्यक्ति का औपचारिक अनुवाद है; इसका आशय महल में स्त्रियों के निवास-भाग से है।
    reason: cultural_note
lexical_decisions:
- source_word: וּבָזֶה
  choice: और ... इस रीति से
  rationale: यह पदबंध पहले बताई गई प्रक्रिया की ओर संकेत करता है; ‘इस रीति से’ आधुनिक और गरिमापूर्ण हिन्दी में उसके प्रक्रियात्मक अर्थ को व्यक्त करता है।
- source_word: הַנַּעֲרָה
  choice: युवती
  rationale: यह शब्द युवा स्त्री को सूचित करता है; ‘युवती’ स्वाभाविक आधुनिक हिन्दी है और ‘लड़की’ की अपेक्षा आयु को अनावश्यक रूप से कम नहीं दर्शाता।
- source_word: בָּאָה אֶל הַמֶּלֶךְ
  choice: राजा के पास जाती थी
  rationale: בוא के साथ אֶל यहाँ राजा के पास जाने को दर्शाता है। अपूर्ण क्रिया का ‘जाती थी’ रूप प्रसंग में बार-बार अपनाई जाने वाली प्रक्रिया को स्पष्ट करता है।
- source_word: אֵת כָּל אֲשֶׁר תֹּאמַר
  choice: वह जो कुछ माँगती
  rationale: इब्रानी में शाब्दिक अर्थ ‘वह जो कुछ कहती’ है, पर संदर्भ में माँगी गई वस्तुएँ अभिप्रेत हैं। हिन्दी में ‘माँगती’ इस निहित अर्थ को स्वाभाविक रूप से व्यक्त करता है; शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: יִנָּתֵן לָהּ
  choice: वह उसे दे दिया जाता
  rationale: निफ़अल रूप कर्मवाच्य है और अपूर्ण क्रिया यहाँ प्रथागत प्रक्रिया बताती है; ‘दे दिया जाता’ दोनों विशेषताएँ बनाए रखता है।
- source_word: לָבוֹא עִמָּהּ
  choice: ताकि वह उसे ... अपने साथ ले जाए
  rationale: वस्तु संदर्भ से समझी जाती है और युवती के साथ जाने वाली चीज़ को सूचित करती है। हिन्दी में ‘अपने साथ ले जाए’ अपेक्षित अर्थ को सहज ढंग से व्यक्त करता है।
- source_word: מִבֵּית הַנָּשִׁים
  choice: स्त्रियों के भवन से
  rationale: यह इब्रानी अभिव्यक्ति का औपचारिक किंतु बोधगम्य रूप है; ‘हरम’ जैसी अधिक व्याख्यात्मक सांस्कृतिक संज्ञा को मुख्य पाठ में नहीं जोड़ा गया।
- source_word: עַד בֵּית הַמֶּלֶךְ
  choice: राजा के भवन तक
  rationale: ‘तक’ עַד की सीमा-दर्शक शक्ति को सुरक्षित रखता है और ‘राजा का भवन’ בֵּית הַמֶּלֶךְ का निकट एवं स्पष्ट अनुवाद है।
