base_translation:
  language: en
  yaml_path: translation/ot/esther/002/020.yaml
  text: Esther had not made known her family line or her people[a], just as Mordecai had commanded her; and Esther kept doing what Mordecai said[b], as when she was under his care.
translation:
  language: hi
  text: एस्तेर ने अब तक अपने कुल और अपने लोगों के बारे में नहीं बताया था[a], जैसा मोर्दकै ने उसे आदेश दिया था। एस्तेर मोर्दकै की बात मानती रही[b], जैसे उस समय मानती थी जब वह उसकी देखरेख में थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने वंश और अपने लोगों के बारे में।” इब्रानी शब्द जन्म, वंश अथवा नातेदारी को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “जैसे उस समय करती थी जब मोर्दकै उसका पालन-पोषण कर रहा था।” इब्रानी वाक्यांश मोर्दकै की देखरेख में एस्तेर के पहले के जीवन की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין ... מַגֶּדֶת
  choice: अब तक ... नहीं बताया था
  rationale: निषेध के साथ कृदंत कथा के उस समय तक जारी स्थिति दर्शाता है; हिन्दी में ‘अब तक ... नहीं बताया था’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: מוֹלַדְתָּהּ
  choice: अपने कुल
  rationale: यह शब्द जन्म, वंश या नातेदारी का बोध करा सकता है। ‘कुल’ संक्षिप्त, प्रचलित और ‘अपने लोगों’ से अलग वंश/परिवार-समूह का अर्थ रखता है।
- source_word: עַמָּהּ
  choice: अपने लोगों
  rationale: עם यहाँ एस्तेर के जातीय-राष्ट्रीय समुदाय को दर्शाता है; ‘अपने लोग’ आधुनिक हिन्दी में स्वाभाविक और पर्याप्त रूप से व्यापक है।
- source_word: כַּאֲשֶׁר צִוָּה עָלֶיהָ
  choice: ठीक जैसा मोर्दकै ने उसे आज्ञा दी थी
  rationale: צוה आदेश का प्रबल भाव रखता है, जिसे ‘आज्ञा दी’ सुरक्षित रखता है; ‘ठीक जैसा’ כַּאֲשֶׁר का बल व्यक्त करता है।
- source_word: מַאֲמַר מָרְדֳּכַי ... עֹשָׂה
  choice: मोर्दकै की बात मानती रही
  rationale: מַאֲמַר कथन अथवा आदेश हो सकता है और עֹשָׂה निरंतर या अभ्यस्त आचरण दर्शाता है। ‘बात मानती रही’ दोनों को स्वाभाविक हिन्दी में समेटता है।
- source_word: בְאָמְנָה אִתּוֹ
  choice: जब वह उसकी देखरेख में थी
  rationale: अभिव्यक्ति मोर्दकै द्वारा उसके पालन-पोषण और संरक्षण को याद कराती है। ‘देखरेख में’ संबंध को सहज ढंग से व्यक्त करता है, बिना उसे जरूरत से अधिक कानूनी रूप देने के।
