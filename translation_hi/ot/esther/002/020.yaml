  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘कुल’ और ‘अपने लोग’ मूल के दो संबंधित किंतु पृथक पदों को बनाए रखते हैं। ‘मानती रही’ कृदंत के निरंतर/अभ्यस्त पक्ष को व्यक्त करता है।
