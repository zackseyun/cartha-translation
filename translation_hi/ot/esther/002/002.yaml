  yaml_path: translation/ot/esther/002/002.yaml
  text: Then the king’s young men who attended him said[b][a], “Let young virgins beautiful in appearance be sought for the king.”
translation:
  language: hi
  text: तब राजा के युवा परिचारकों ने कहा, “राजा के लिए ऐसी कुँवारी युवतियों की खोज की जाए जो देखने में सुंदर हों।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: נַעֲרֵי הַמֶּלֶךְ
  choice: राजा ... के जवानों
  rationale: נַעַר का मूल अर्थ जवान पुरुष हो सकता है; साथ आए מְשָׁרְתָיו से उनकी सेवकाई अलग से स्पष्ट होती है, इसलिए केवल ‘सेवकों’ के बजाय ‘जवानों’ से शब्दगत भेद सुरक्षित रहता है।
- source_word: מְשָׁרְתָיו
  choice: की सेवा करनेवाले
  rationale: שׁרת का कृदन्त राजा की व्यक्तिगत सेवा में लगे होने का भाव देता है; हिन्दी में संबंधवाचक पदबंध स्वाभाविक है।
- source_word: יְבַקְשׁוּ
  choice: खोज की जाए
  rationale: इब्रानी रूप सक्रिय बहुवचन है, ‘वे खोजें’; पर कर्ता अनिर्दिष्ट है। हिन्दी का कर्मवाच्य प्रस्ताव/निर्देश का भाव स्वाभाविक रूप से रखता है और कोई विशिष्ट कर्ता नहीं जोड़ता।
- source_word: לַמֶּלֶךְ
  choice: राजा के लिए
  rationale: लाभ अथवा उद्देश्य का सामान्य दत्तिव अर्थ सीधे और बिना अतिरिक्त व्याख्या के व्यक्त होता है।
- source_word: נְעָרוֹת בְּתוּלוֹת
  choice: जवान कुँवारियों
  rationale: נְעָרוֹת युवावस्था और בְּתוּלוֹת कुँवारेपन को व्यक्त करता है; संयुक्त अनुवाद दोनों घटकों को स्पष्ट और आधुनिक हिन्दी में बनाए रखता है।
- source_word: טוֹבוֹת מַרְאֶה
  choice: जो देखने में सुंदर हों
  rationale: शाब्दिक भाव ‘रूप में अच्छी’ है; ‘देखने में सुंदर’ शारीरिक रूप-सौंदर्य को सहज हिन्दी में व्यक्त करते हुए מַרְאֶה को भी स्पष्ट रखता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘जवान’ शब्द נַעַר/נַעֲרָה के आयु-संबंधी भाव को बचाता है, जबकि ‘सेवा करनेवाले’ उनकी दरबारी भूमिका स्पष्ट करता है। किसी पाद-टिप्पणी की आवश्यकता नहीं पड़ी।
