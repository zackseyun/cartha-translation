base_translation:
  language: en
  yaml_path: translation/ot/esther/002/016.yaml
  text: So Esther was taken to King Ahasuerus[a], into his royal palace, in the tenth month, which is the month Tebeth[b], in the seventh year of his reign.
translation:
  language: hi
  text: इस प्रकार एस्तेर को राजा क्षयर्ष के पास, उसके राजमहल में, दसवें महीने—अर्थात् तेबेत महीने—में, उसके शासन के सातवें वर्ष में ले जाया गया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “लाया गया।” इब्रानी क्रिया कर्मवाच्य है; इससे यह बल मिलता है कि एस्तेर स्वयं क्रिया करने वाली नहीं, बल्कि क्रिया की पात्र है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּלָּקַח
  choice: ले जाया गया
  rationale: निफ़अल रूप की कर्मवाच्य शक्ति को बनाए रखता है और यह स्पष्ट करता है कि एस्तेर स्वयं पहल करने वाली नहीं, बल्कि क्रिया की पात्र है।
- source_word: אֶל הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: राजा क्षयर्ष के पास
  rationale: पहला אֶל राजा की ओर गति दर्शाता है; हिंदी में ‘के पास’ स्वाभाविक है। אֲחַשְׁוֵרוֹשׁ के लिए प्रचलित हिंदी बाइबलीय रूप ‘क्षयर्ष’ रखा गया है।
- source_word: אֶל בֵּית מַלְכוּתוֹ
  choice: उसके राजमहल में
  rationale: शाब्दिक अर्थ ‘उसके राज्य/राजत्व का भवन’ है; प्रसंग में यह राजा के शाही निवास को दर्शाता है। गति का भाव ‘में ... ले जाया गया’ से व्यक्त होता है।
- source_word: בַּחֹדֶשׁ הָעֲשִׂירִי
  choice: दसवें महीने में
  rationale: कालसूचक वाक्यांश का सीधा और स्वाभाविक हिंदी रूप।
- source_word: הוּא חֹדֶשׁ טֵבֵת
  choice: अर्थात् तेबेत महीने में
  rationale: הוּא यहाँ दसवें महीने का नाम स्पष्ट करने वाला परिचय देता है; ‘अर्थात्’ उस व्याख्यात्मक संबंध को सहज हिंदी में रखता है।
- source_word: טֵבֵת
  choice: तेबेत
  rationale: इब्रानी महीने के नाम का देवनागरी लिप्यंतरण।
- source_word: בִּשְׁנַת שֶׁבַע לְמַלְכוּתוֹ
  choice: उसके राज्य के सातवें वर्ष में
  rationale: राजकीय वर्ष की गणना का स्वाभाविक हिंदी रूप; מלכותו का ‘उसके राज्य’ अनुवाद राज करने की अवधि को संदर्भ में स्पष्ट रखता है।
