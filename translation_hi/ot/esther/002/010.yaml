  yaml_path: translation/ot/esther/002/010.yaml
  text: Esther had not disclosed her people or her kindred[a], because Mordecai had commanded her not to disclose it.
translation:
  language: hi
  text: एस्तेर ने अपने लोगों और अपने वंश[a] के बारे में नहीं बताया था, क्योंकि मोर्दकै ने उसे यह बात न बताने की आज्ञा दी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने कुल” अथवा “अपने मूल-स्थान।” इब्रानी शब्द कुल-सम्बन्ध, वंश या जन्म-स्थान/उद्गम को सूचित कर सकता है; यहाँ सम्भवतः एस्तेर के पारिवारिक वंश का अर्थ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִגִּידָה
  choice: नहीं बताया था
  rationale: हिफ़ील रूप का अर्थ ‘ज्ञात कराना/बताना’ है। प्रसंग में पहचान छिपाने का भाव है, और ‘नहीं बताया था’ हिन्दी कथावाचन में स्वाभाविक रूप से पूर्वकालिक पृष्ठभूमि व्यक्त करता है।
- source_word: עַמָּהּ
  choice: अपने लोगों
  rationale: עַם किसी व्यक्ति के जातीय या राष्ट्रीय समुदाय को सूचित करता है। ‘अपने लोगों’ इस व्यापक सामुदायिक अर्थ को बनाए रखता है और आधुनिक हिन्दी में जाति-व्यवस्था का अनावश्यक संकेत नहीं देता।
- source_word: מוֹלַדְתָּהּ
  choice: अपने वंश
  rationale: यह शब्द जन्म, कुल-सम्बन्ध, वंश या मूल-स्थान का बोध करा सकता है। ‘अपने लोगों’ के साथ प्रयुक्त होने पर ‘वंश’ पारिवारिक उद्गम का अलग किन्तु सम्बद्ध अर्थ स्वाभाविक रूप से व्यक्त करता है; अन्य सम्भावनाएँ पाद-टिप्पणी में सुरक्षित हैं।
- source_word: צִוָּה עָלֶיהָ
  choice: उसे ... आज्ञा दी थी
  rationale: צוה प्रबल आदेश का क्रियापद है; ‘आज्ञा दी थी’ उसकी शक्ति और कथानक में पूर्वकालिकता दोनों बनाए रखता है।
- source_word: אֲשֶׁר לֹא תַגִּיד
  choice: यह बात न बताने
  rationale: यह उपवाक्य मोर्दकै की आज्ञा की विषय-वस्तु बताता है। ‘यह बात’ पहले उल्लिखित लोगों और वंश—दोनों—की ओर संकेत करता है और हिन्दी में अनावश्यक पुनरावृत्ति से बचाता है।
- source_word: אֶסְתֵּר
  choice: एस्तेर
  rationale: नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: מָרְדֳּכַי
  choice: मोर्दकै
  rationale: नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
