  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कथात्मक शैली। इब्रानी पाठ की पुनरावृत्त दैनिक क्रिया और एस्तेर के भविष्य के विषय में अस्पष्टता सुरक्षित रखी गई है।
