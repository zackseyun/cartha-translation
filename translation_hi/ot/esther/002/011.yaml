  text: וּ/בְ/כָל י֣וֹם וָ/י֔וֹם מָרְדֳּכַי֙ מִתְהַלֵּ֔ךְ לִ/פְנֵ֖י חֲצַ֣ר בֵּית הַ/נָּשִׁ֑ים לָ/דַ֨עַת֙ אֶת שְׁל֣וֹם אֶסְתֵּ֔ר וּ/מַה יֵּעָשֶׂ֖ה בָּֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/011.yaml
  text: And every single day Mordecai would walk back and forth in front of the courtyard of the women’s house, to learn how Esther was doing and what would be done with her.
translation:
  language: hi
  text: और मोर्दकै हर दिन स्त्रियों के भवन के आँगन के सामने टहलता रहता था, ताकि जान सके कि एस्तेर कैसी है और उसके साथ क्या किया जाएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְכָל יוֹם וָיוֹם
  choice: और ... हर दिन
  rationale: इब्रानी पुनरुक्ति निरंतर दैनिक क्रिया पर बल देती है; आधुनिक हिन्दी में ‘हर दिन’ इसे स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: מִתְהַלֵּךְ
  choice: टहलता रहता था
  rationale: हित्पएल कृदंत बार-बार या इधर-उधर चलने की चालू क्रिया दर्शाता है; ‘टहलता रहता था’ उस निरंतरता को सुरक्षित रखता है।
- source_word: בֵית הַנָּשִׁים
  choice: स्त्रियों के भवन
  rationale: शाब्दिक अर्थ को बनाए रखते हुए राजमहल के उस निर्धारित आवास का संकेत देता है जहाँ स्त्रियाँ रखी गई थीं।
- source_word: לָדַעַת אֶת שְׁלוֹם אֶסְתֵּר
  choice: ताकि जान सके कि एस्तेर कैसी है
  rationale: ‘शालोम’ यहाँ एस्तेर की कुशल-क्षेम या दशा के अर्थ में है; यह सहज आधुनिक हिन्दी में वही भाव देता है।
- source_word: וּמַה יֵּעָשֶׂה בָּהּ
  choice: और उसके साथ क्या किया जाएगा
  rationale: निष्क्रिय रूप और भविष्य संबंधी अनिश्चितता दोनों को सुरक्षित रखता है; कर्ता या परिणाम को अनावश्यक रूप से स्पष्ट नहीं करता।
theological_decisions: []
