  text: אֲשֶׁ֤ר הָגְלָה֙ מִ/יר֣וּשָׁלַ֔יִם עִם הַ/גֹּלָה֙ אֲשֶׁ֣ר הָגְלְתָ֔ה עִ֖ם יְכָנְיָ֣ה מֶֽלֶךְ יְהוּדָ֑ה אֲשֶׁ֣ר הֶגְלָ֔ה נְבוּכַדְנֶאצַּ֖ר מֶ֥לֶךְ בָּבֶֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/006.yaml
  text: who had been taken into exile from Jerusalem with the exiles who had been taken into exile with Jeconiah king of Judah[a], whom Nebuchadnezzar king of Babylon had taken into exile.
translation:
  language: hi
  text: जिसे यरूशलेम से उन निर्वासितों के साथ निर्वासन में ले जाया गया था, जिन्हें यहूदा के राजा यकोन्याह के साथ निर्वासन में ले जाया गया था—जिसे बाबेल के राजा नबूकदनेस्सर ने निर्वासन में ले गया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲשֶׁר
  choice: जिसे
  rationale: यह संबंधवाचक सर्वनाम पिछले पद के पुरुष-वाचक पूर्वपद से जुड़ता है; हिन्दी में कर्मवाच्य रचना के लिए ‘जिसे’ स्वाभाविक है।
- source_word: הָגְלָה
  choice: निर्वासन में ले जाया गया था
  rationale: यह रूप बलपूर्वक देश से निकाले जाने का भाव देता है। कर्मवाच्य अनुवाद उस व्यक्ति पर हुई कार्रवाई को स्पष्ट रखता है।
- source_word: מִירוּשָׁלַיִם
  choice: यरूशलेम से
  rationale: पूर्वसर्ग और स्थाननाम का सीधा, स्वाभाविक हिन्दी रूप।
- source_word: עִם הַגֹּלָה
  choice: उन निर्वासितों के साथ
  rationale: यह पद निर्वासन की अमूर्त अवस्था से अधिक निर्वासित जनसमूह को सूचित करता है; ‘निर्वासितों’ से सामूहिक अर्थ स्पष्ट होता है।
- source_word: אֲשֶׁר הָגְלְתָה
  choice: जिन्हें ... निर्वासन में ले जाया गया था
  rationale: स्त्रीलिंग एकवचन क्रिया सामूहिक संज्ञा הַגֹּלָה से मेल खाती है; हिन्दी में उस समूह को बहुवचन ‘निर्वासितों’ और ‘जिन्हें’ से व्यक्त करना अधिक स्वाभाविक है।
- source_word: יְכָנְיָה
  choice: यकोन्याह
  rationale: हिब्रू रूप यखोन्याह/यकोन्याह का निकट देवनागरी लिप्यंतरण चुना गया है; इसे किसी समन्वित वैकल्पिक राजकीय नाम से नहीं बदला गया।
- source_word: מֶלֶךְ יְהוּדָה
  choice: यहूदा के राजा
  rationale: इब्रानी संबंधसूचक पदबंध का मानक हिन्दी रूप।
- source_word: אֲשֶׁר הֶגְלָה
  choice: जिन्हें ... निर्वासन में ले गया था
  rationale: यहाँ नबूकदनेस्सर निर्वासन कराने वाला स्पष्ट कर्ता है। ‘निर्वासन में ले गया’ मूल धातु की पुनरावृत्ति और बलपूर्वक निष्कासन का भाव बनाए रखता है।
- source_word: נְבוּכַדְנֶאצַּר
  choice: नबूकदनेस्सर
  rationale: बाबेल के राजा के नाम का हिन्दी बाइबलीय परंपरा में पहचाना जाने वाला और स्रोत-रूप के निकट लिप्यंतरण।
- source_word: מֶלֶךְ בָּבֶל
  choice: बाबेल का राजा
  rationale: इब्रानी संबंधसूचक पदबंध का सीधा और प्रचलित हिन्दी रूप।
theological_decisions:
- issue: एस्तेर 2:6 के संबंधवाचक उपवाक्य का पूर्वपद
  choice: मुख्य पाठ में उपवाक्य को मोर्दकै से संबंधित समझते हुए एकवचन ‘जिसे’ रखा गया है।
  alternative: कालक्रम को देखते हुए यह उपवाक्य मोर्दकै के पूर्वज कीश से संबंधित भी समझा जा सकता है।
  rationale: इब्रानी प्रवाह में निकटतम प्रमुख पुरुष-वाचक संदर्भ मोर्दकै है, इसलिए मुख्य पाठ सतही वाक्यरचना का अनुसरण करता है। फिर भी यकोन्याह के निर्वासन और मोर्दकै की पीढ़ी के बीच कालक्रम की कठिनाई वास्तविक है; अतः वैकल्पिक संबंध को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। גלה की तीनों आवृत्तियों में ‘निर्वासन’ शब्द बनाए रखकर मूल की शब्दगत पुनरावृत्ति सुनाई गई है। वाक्य पिछले पद पर निर्भर संबंधवाचक उपवाक्य है, इसलिए उसे स्वतंत्र पूर्ण वाक्य बनाने की कोशिश नहीं की गई।
