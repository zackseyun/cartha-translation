  text: וְ/יַפְקֵ֨ד הַ/מֶּ֣לֶךְ פְּקִידִים֮ בְּ/כָל מְדִינ֣וֹת מַלְכוּת/וֹ֒ וְ/יִקְבְּצ֣וּ אֶת כָּל נַעֲרָֽה בְ֠תוּלָה טוֹבַ֨ת מַרְאֶ֜ה אֶל שׁוּשַׁ֤ן הַ/בִּירָה֙ אֶל בֵּ֣ית הַ/נָּשִׁ֔ים אֶל יַ֥ד הֵגֶ֛א סְרִ֥יס הַ/מֶּ֖לֶךְ שֹׁמֵ֣ר הַ/נָּשִׁ֑ים וְ/נָת֖וֹן תַּמְרוּקֵי/הֶֽן־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/003.yaml
  text: Let the king appoint officers in all the provinces of his kingdom[a], and let them gather every young virgin of beautiful appearance to Susa the citadel, to the house of the women, into the custody of Hegai the king’s eunuch, keeper of the women[b]; and let their cosmetics be given to them.
translation:
  language: hi
  text: राजा अपने राज्य के सभी प्रान्तों में अधिकारियों को नियुक्त करे, और वे सुन्दर रूपवाली हर जवान कुँवारी को शूशन के राजदुर्ग में, स्त्रियों के भवन[a] में इकट्ठा करके, राजा के खोजे और स्त्रियों के रखवाले हेगे को सौंपें; और उन्हें उनके सौन्दर्य-प्रसाधन[b] दिए जाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा ‘हरम’। इब्रानी में शाब्दिक रूप से ‘स्त्रियों का भवन’ है।
    reason: lexical_alternative
  - marker: b
    text: अथवा ‘उनके सौन्दर्य-उपचारों की व्यवस्था की जाए’। इब्रानी शब्द सौन्दर्य-प्रसाधनों या सौन्दर्य निखारने के उपचारों, दोनों को दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יַפְקֵד
  choice: नियुक्त करे
  rationale: हिफ़ील रूप यहाँ किसी प्रशासनिक काम के लिए अधिकारियों की नियुक्ति का भाव देता है; प्रस्तावसूचक क्रिया-रूप को ‘करे’ से बनाए रखा गया है।
- source_word: פְּקִידִים
  choice: अधिकारियों
  rationale: यह किसी सैन्य पद के बजाय राजा द्वारा काम पर लगाए गए प्रशासनिक कर्मचारियों को दर्शाता है।
- source_word: מְדִינוֹת מַלְכוּתוֹ
  choice: अपने राज्य के सभी प्रान्तों में
  rationale: एस्तेर के फ़ारसी साम्राज्य-संबंधी प्रसंग में מְדִינוֹת के लिए ‘प्रान्त’ स्वाभाविक प्रशासनिक शब्द है।
- source_word: וְיִקְבְּצוּ
  choice: और वे ... इकट्ठा करें
  rationale: यह पहले प्रस्ताव को आगे बढ़ाने वाला आदेशात्मक/प्रस्तावसूचक रूप है; ‘इकट्ठा करें’ व्यक्तियों को एक स्थान पर लाने का भाव स्पष्ट करता है।
- source_word: כָּל נַעֲרָה בְתוּלָה
  choice: हर ... जवान कुँवारी
  rationale: ‘जवान’ נַעֲרָה की युवावस्था और ‘कुँवारी’ בְתוּלָה का अलग अर्थ सुरक्षित रखता है।
- source_word: טוֹבַת מַרְאֶה
  choice: सुन्दर दिखनेवाली
  rationale: शाब्दिक भाव ‘रूप में अच्छी’ है; यह अनुवाद दृश्य रूप-सौन्दर्य पर बल रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: שׁוּשַׁן הַבִּירָה
  choice: शूशन के राजदुर्ग में
  rationale: הַבִּירָה से शूशन का किलेबन्द राजकीय परिसर अभिप्रेत है; ‘राजदुर्ग’ इसे केवल नगर या राजधानी मानने से बचाता है।
- source_word: בֵּית הַנָּשִׁים
  choice: स्त्रियों के भवन
  rationale: यह इब्रानी पद का पारदर्शी अनुवाद है; अधिक व्याख्यात्मक ‘हरम’ को पादटिप्पणी में रखा गया है।
- source_word: אֶל יַד הֵגֶא
  choice: हेगे की देखरेख में
  rationale: ‘हाथ में’ वाला इब्रानी मुहावरा यहाँ किसी के अधिकार और निगरानी में सौंपे जाने का अर्थ देता है।
- source_word: סְרִיס
  choice: खोजे
  rationale: स्त्रियों के भवन के दरबारी प्रसंग में मूल शब्द का सामान्य अर्थ ‘खोजा’ उपयुक्त है; केवल ‘दरबारी अधिकारी’ कहना सम्भावित शारीरिक अर्थ को दबा देता।
- source_word: שֹׁמֵר הַנָּשִׁים
  choice: स्त्रियों के रखवाले
  rationale: यह हेगे के पद और उत्तरदायित्व को निकटता से व्यक्त करता है।
- source_word: וְנָתוֹן תַּמְרוּקֵיהֶן
  choice: और उन्हें उनके सौन्दर्य-प्रसाधन दिए जाएँ
  rationale: पद सौन्दर्य निखारने की सामग्रियों अथवा उपचारों की व्यवस्था को दर्शा सकता है; मुख्य पाठ में संक्षिप्त और समझने योग्य ‘सौन्दर्य-प्रसाधन’ चुना गया है।
