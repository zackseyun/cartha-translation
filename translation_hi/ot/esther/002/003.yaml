translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। राजकीय-प्रशासनिक शब्दावली के लिए ‘प्रान्त’, ‘अधिकारी’ और ‘राजदुर्ग’ प्रयुक्त हुए हैं। मूल पाठ की प्रस्तावसूचक वाक्य-रचना को ‘नियुक्त करे’, ‘इकट्ठा करें’ और ‘दिए जाएँ’ से सुरक्षित रखा गया है। अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी [a] का चिह्न अनुचित स्थान पर था; हिन्दी मुख्य पाठ में दोनों चिह्न उनके वास्तविक पदों—‘स्त्रियों के भवन’ और ‘सौन्दर्य-प्रसाधन’—के साथ लगाए गए हैं।
