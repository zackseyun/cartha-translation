base_translation:
  language: en
  yaml_path: translation/ot/esther/002/007.yaml
  text: He was bringing up Hadassah—that is[a], Esther—the daughter of his uncle, because she had neither father nor mother. The young woman was beautiful in form and attractive in appearance, and when her father and her mother died[b], Mordecai took her as his own daughter.
translation:
  language: hi
  text: वह अपने चाचा की बेटी[a] हदस्सा—अर्थात् एस्तेर—का पालन-पोषण कर रहा था, क्योंकि उसके न तो पिता थे, न माता। वह युवती सुंदर डील-डौल वाली और रूपवती थी। जब उसके पिता और माता मर गए, तब मोर्दकै ने उसे अपनी बेटी के रूप में ले लिया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसके चाचा की बेटी,” अर्थात् उसकी चचेरी बहन।
    reason: lexical_alternative
  - marker: b
    text: या, “मोर्दकै ने उसे अपनी बेटी बना लिया।” इब्रानी में अधिक शाब्दिक रूप से है, उसने “उसे अपने लिए बेटी के रूप में ले लिया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹמֵן
  choice: पालन-पोषण कर रहा था
  rationale: इब्रानी कृदंत मोर्दकै द्वारा लगातार उसकी देखभाल और परवरिश किए जाने को व्यक्त करता है; यह आधुनिक हिन्दी में स्वाभाविक और अर्थनिष्ठ है।
- source_word: הֲדַסָּה הִיא אֶסְתֵּר
  choice: हदस्सा—अर्थात् एस्तेर—
  rationale: הִיא यहाँ एक ही व्यक्ति के दो नामों की व्याख्यात्मक समानता बताता है; दोनों नामों को स्पष्ट रूप से सुरक्षित रखा गया है।
- source_word: בַּת דֹּדוֹ
  choice: अपने चाचा की बेटी
  rationale: अनुवाद इब्रानी की स्पष्ट रिश्तेदारी-अभिव्यक्ति को बनाए रखता है; इससे अभिप्रेत चचेरी बहन होने की बात पादटिप्पणी में स्पष्ट की गई है।
- source_word: כִּי אֵין לָהּ אָב וָאֵם
  choice: क्योंकि उसके न पिता था, न माता
  rationale: इब्रानी दोनों माता-पिता के अभाव को सीधे कहता है; केवल ‘अनाथ’ कहने की अपेक्षा यह मूल अभिव्यक्ति के अधिक निकट है।
- source_word: הַנַּעֲרָה
  choice: वह युवती
  rationale: दरबारी विवाह-संदर्भ में ‘युवती’ आधुनिक, सम्मानपूर्ण और आयु की दृष्टि से उपयुक्त है।
- source_word: יְפַת תֹּאַר
  choice: सुंदर डील-डौल वाली
  rationale: यह पद शारीरिक गठन या आकृति की सुंदरता पर बल देता है; ‘डील-डौल’ सामान्य आधुनिक हिन्दी में इस भेद को व्यक्त करता है।
- source_word: טוֹבַת מַרְאֶה
  choice: रूपवती
  rationale: यह देखने में आकर्षक होने को व्यक्त करता है और पहले पद में वर्णित शारीरिक गठन से संबंधित दोहरे वर्णन को संक्षेप में स्वाभाविक रखता है।
- source_word: וּבְמוֹת אָבִיהָ וְאִמָּהּ
  choice: उसके माता-पिता की मृत्यु के बाद
  rationale: यह समय-संबंधी परिस्थिति को स्वाभाविक हिन्दी में व्यक्त करता है और दोनों अभिभावकों की मृत्यु का अर्थ बनाए रखता है।
- source_word: לְקָחָהּ מָרְדֳּכַי לוֹ לְבַת
  choice: मोर्दकै ने उसे अपनी बेटी के रूप में अपना लिया
  rationale: यह ‘उसे अपने लिए बेटी के रूप में ले लिया’ का स्वाभाविक हिन्दी रूप है; औपचारिक कानूनी दत्तक-प्रक्रिया को अनावश्यक रूप से आरोपित नहीं करता।
