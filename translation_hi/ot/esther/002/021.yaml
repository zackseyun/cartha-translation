  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם וּ/מָרְדֳּכַ֖י יֹשֵׁ֣ב בְּ/שַֽׁעַר הַ/מֶּ֑לֶךְ קָצַף֩ בִּגְתָ֨ן וָ/תֶ֜רֶשׁ שְׁנֵֽי סָרִיסֵ֤י הַ/מֶּ֨לֶךְ֙ מִ/שֹּׁמְרֵ֣י הַ/סַּ֔ף וַ/יְבַקְשׁוּ֙ לִ/שְׁלֹ֣חַ יָ֔ד בַּ/מֶּ֖לֶךְ אֲחַשְׁוֵֽרֹשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/021.yaml
  text: In those days[a], while Mordecai was sitting at the king’s gate, Bigthan and Teresh, two of the king’s eunuchs from those who guarded the threshold[b], became angry and sought to lay hands on King Ahasuerus.
translation:
  language: hi
  text: उन दिनों, जब मोर्दकै राजा के फाटक पर बैठा था, तब राजा के दो खोजे[a]—बिग्तान और तेरेश—जो द्वार की रखवाली करनेवालों में से थे, क्रोधित हो गए और राजा अहशवेरोश पर हाथ डालने का प्रयत्न किया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “राजा के दो राजकीय अधिकारी”; इब्रानी शब्द व्यापक रूप से दरबारी अधिकारियों के लिए भी प्रयुक्त हो सकता है, यद्यपि इस राजदरबारी संदर्भ में “खोजे” संभावित अर्थ है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “राजा के विरुद्ध हाथ बढ़ाने”; अर्थात उस पर हमला करने या उसकी हत्या करने के लिए।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: उन दिनों
  rationale: यह इब्रानी कथा में समय-सूचक प्रचलित पदबंध है; हिन्दी में स्वाभाविक रहते हुए व्यापक समय-संदर्भ बनाए रखता है।
- source_word: יֹשֵׁב
  choice: बैठा था
  rationale: कृदंत यहाँ चल रही परिस्थिति बताता है; फाटक के प्रशासनिक स्थल पर मोर्दकै की उपस्थिति के लिए यह स्वाभाविक है।
- source_word: בְּשַׁעַר הַמֶּלֶךְ
  choice: राजा के फाटक पर
  rationale: यह राजकीय प्रशासन से जुड़े फाटक-क्षेत्र का संकेत देता है; 'पर' आधुनिक हिन्दी में स्थान को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: קָצַף
  choice: क्रोधित हो गए
  rationale: पूर्वस्थित एकवचन क्रिया संयुक्त कर्ता बिगताना और तेरेश के साथ अर्थतः बहुवचन है; अनावश्यक रूप से तीव्रता बढ़ाए बिना क्रोध व्यक्त होता है।
- source_word: סָרִיסֵי הַמֶּלֶךְ
  choice: राजा के दो खोजे
  rationale: फ़ारसी राजदरबार के संदर्भ में सָרִיס का ठोस और संभावित अर्थ 'खोजा' है; 'राजकीय अधिकारी' की व्यापक संभावना पादटिप्पणी में रखी गई है।
- source_word: מִשֹּׁמְרֵי הַסַּף
  choice: जो द्वार की रखवाली करनेवालों में से थे
  rationale: סַף का मूल अर्थ देहरी है, पर पद यहाँ प्रवेश-द्वार की पहरेदारी का दायित्व बताता है; यह हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: וַיְבַקְשׁוּ
  choice: कोशिश करने लगे
  rationale: संदर्भ में क्रिया हिंसक कार्य करने की इच्छा और प्रयास व्यक्त करती है; यह 'षड्यंत्र रचा' जैसी अतिरिक्त व्याख्या नहीं जोड़ती।
- source_word: לִשְׁלֹחַ יָד
  choice: पर हाथ उठाने
  rationale: यह हिन्दी का निकट और स्वाभाविक मुहावरा है, जो हिंसक कार्रवाई का संकेत देता है पर हत्या को मुख्य पाठ में अनिवार्य नहीं बनाता।
- source_word: אֲחַשְׁוֵרוֹשׁ
  choice: अहशवेरोश
  rationale: नाम को इब्रानी रूप के निकट देवनागरी में लिप्यंतरित किया गया है; ऐतिहासिक पहचान 'क्षयर्ष' को पाठ में प्रतिस्थापित नहीं किया गया।
- source_word: בִּגְתָן וָתֶרֶשׁ
  choice: बिगताना और तेरेश
  rationale: व्यक्तिनामों को इब्रानी व्यंजन और मासोरेटिक स्वरांकन के निकट, हिन्दी-पठनीय रूप में लिप्यंतरित किया गया है।
