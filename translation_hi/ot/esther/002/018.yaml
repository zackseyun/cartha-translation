  yaml_path: translation/ot/esther/002/018.yaml
  text: Then the king gave a great banquet for all his officials and servants—the banquet of Esther—and he granted relief to the provinces and gave gifts according to the king’s bounty[a][b].
translation:
  language: hi
  text: तब राजा ने अपने सभी अधिकारियों और सेवकों के लिए एक बड़ी दावत दी—एस्तेर की दावत—और प्रान्तों को राहत दी[a] तथा राजा की उदारता के अनुरूप उपहार दिए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसने प्रान्तों के लिए अवकाश घोषित किया’ या ‘उसने प्रान्तों को देयताओं से छूट दी।’ इब्रानी शब्द का अर्थ व्यापक रूप से विश्राम, राहत या छूट हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ ‘राजा के हाथ के अनुसार’ है—अर्थात राजा की उदारता या राजोचित सामर्थ्य के अनुरूप।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁתֶּה גָדוֹל
  choice: एक बड़ी दावत
  rationale: מִשְׁתֶּה राजकीय प्रसंग में भोज अथवा दावत को दर्शाता है; आधुनिक हिन्दी में ‘दावत’ स्वाभाविक है और גָדוֹל का अर्थ ‘बड़ी’ है।
- source_word: לְכָל שָׂרָיו וַעֲבָדָיו
  choice: अपने सभी अधिकारियों और सेवकों के लिए
  rationale: फ़ारसी राजदरबार के प्रसंग में שָׂרִים उच्च अधिकारियों को और עֲבָדִים सेवकों अथवा राजकीय अधीनस्थों को दर्शाता है; यह अनुवाद मूल के भेद को बनाए रखता है।
- source_word: אֵת מִשְׁתֵּה אֶסְתֵּר
  choice: एस्तेर की दावत
  rationale: सम्बन्धवाचक इब्रानी पदबंध का सीधा और स्वाभाविक हिन्दी रूप है; इससे दावत का एस्तेर से सम्बन्ध बना रहता है, पर यह अनावश्यक रूप से तय नहीं किया जाता कि वह उसकी ओर से थी या उसके सम्मान में।
- source_word: וַהֲנָחָה לַמְּדִינוֹת עָשָׂה
  choice: उसने प्रान्तों को राहत दी
  rationale: הֲנָחָה में विश्राम, राहत या देयताओं से छूट का व्यापक अर्थ सम्भव है। ‘राहत’ इस अस्पष्टता को कर-क्षमा या सार्वजनिक अवकाश में सीमित नहीं करती।
- source_word: מַשְׂאֵת
  choice: उपहार
  rationale: यहाँ शब्द राजा द्वारा प्रदान की गई वस्तुओं अथवा राजकीय भेंटों को सूचित करता है; ‘उपहार’ अर्थ की अपेक्षित व्यापकता रखता है।
- source_word: כְּיַד הַמֶּלֶךְ
  choice: राजा की उदारता के अनुरूप
  rationale: शाब्दिक अर्थ ‘राजा के हाथ के अनुसार’ है; यह मुहावरा राजा के साधनों या राजोचित उदारता के अनुरूप मात्रा को व्यक्त करता है।
- source_word: וַיַּעַשׂ
  choice: दावत दी
  rationale: क्रिया का मूल अर्थ ‘किया/बनाया’ है, पर दावत के साथ आधुनिक हिन्दी का स्वाभाविक प्रयोग ‘दावत देना’ है।
