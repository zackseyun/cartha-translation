  yaml_path: translation/ot/esther/002/019.yaml
  text: When the virgins were gathered a second time[b][a], Mordecai was sitting at the king's gate.
translation:
  language: hi
  text: जब कुँवारियों को दूसरी बार[a] इकट्ठा किया गया, तब मोर्दकै राजद्वार[b] पर बैठा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “फिर से।” इब्रानी में शाब्दिक अर्थ “दूसरी बार” है।
    reason: lexical_alternative
  - marker: b
    text: “राजद्वार” से सम्भवतः राजमहल का द्वार-क्षेत्र अभिप्रेत है, जहाँ राजकीय सेवा और प्रशासनिक कामकाज होता था।
    reason: cultural_note
lexical_decisions:
- source_word: וּבְהִקָּבֵץ
  choice: जब ... इकट्ठा किया गया
  rationale: בְּ के साथ निफ़अल infinitive construct एक कालवाचक उपवाक्य बनाता है; कर्मवाच्य रूप को हिन्दी में ‘इकट्ठा किया गया’ से सुरक्षित रखा गया है। आरम्भिक וּ का कथात्मक संबंध हिन्दी के स्वाभाविक ‘जब...तब’ विन्यास में व्यक्त होता है।
- source_word: בְּתוּלוֹת
  choice: कुँवारियों
  rationale: यह शब्द यहाँ केवल सामान्य ‘युवतियों’ के बजाय उनके कुँवारी होने को स्पष्ट रूप से बताता है; इसलिए अधिक विशिष्ट अर्थ रखा गया है।
- source_word: שֵׁנִית
  choice: दूसरी बार
  rationale: इब्रानी क्रिया-विशेषण का सीधा अर्थ ‘दूसरी बार’ है; ‘फिर से’ स्वाभाविक विकल्प है, पर क्रम-सूचक अर्थ को कम स्पष्ट करता है।
- source_word: וּמָרְדֳּכַי
  choice: मोर्दकै
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण अपनाया गया है।
- source_word: יֹשֵׁב
  choice: बैठा था
  rationale: काल participle की जारी अथवा स्थितिमूलक क्रिया को ‘बैठा था’ स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּשַׁעַר הַמֶּלֶךְ
  choice: राजद्वार पर
  rationale: शाब्दिक अर्थ ‘राजा के फाटक में/पर’ है। ‘राजद्वार पर’ संक्षिप्त और स्वाभाविक है तथा राजमहल के द्वार-क्षेत्र का संकेत बनाए रखता है।
