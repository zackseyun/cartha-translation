base_translation:
  language: en
  yaml_path: translation/ot/esther/002/017.yaml
  text: The king loved Esther more than all the women[a], and she found favor and kindness before him more than all the virgins[b]. So he placed the royal crown on her head and made her queen instead of Vashti.
translation:
  language: hi
  text: राजा ने एस्तेर से सभी स्त्रियों से बढ़कर प्रेम किया,[a] और एस्तेर ने सभी कुँवारियों से बढ़कर राजा की दृष्टि में अनुग्रह और कृपा पाई।[b] तब उसने उसके सिर पर राजमुकुट रखा और वशती के स्थान पर उसे रानी बनाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘स्त्रियाँ’ सामान्य इब्रानी शब्द का अनुवाद है; आगे ‘कुँवारियाँ’ के लिए अधिक विशिष्ट शब्द आया है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी मुहावरे का शाब्दिक भाव है, ‘उसने अनुग्रह और कृपा धारण की।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱהַב
  choice: प्रेम करने लगा
  rationale: אהב प्रेम अथवा स्नेह को व्यक्त करता है। प्रसंग में आरंभिक/विकसित लगाव का स्वाभाविक हिन्दी रूप ‘प्रेम करने लगा’ है; इसे केवल ‘पसंद किया’ कहने से अर्थ हल्का हो जाता।
- source_word: מִכָּל הַנָּשִׁים
  choice: अन्य सभी स्त्रियों से बढ़कर
  rationale: מִן + כָּל की तुलनात्मक रचना को स्पष्ट रखा गया है। נָשִׁים सामान्य शब्द ‘स्त्रियाँ’ है, इसलिए आगे आए अधिक विशिष्ट ‘कुँवारियों’ से इसका भेद बनाए रखा गया है।
- source_word: וַתִּשָּׂא חֵן וָחֶסֶד
  choice: अनुग्रह और कृपा पाई
  rationale: इब्रानी मुहावरे का शाब्दिक रूप ‘अनुग्रह और कृपा धारण/उठाई’ है, पर हिन्दी में ‘पाई’ स्वाभाविक है। חֵן और חֶסֶד दोनों संज्ञाओं को अलग रखा गया है; यहाँ חֶסֶד को वाचा-संबंधी किसी विशिष्ट धर्मवैज्ञानिक अर्थ में सीमित न करके कृपालु व्यवहार के अर्थ में लिया गया है।
- source_word: לְפָנָיו
  choice: उसकी दृष्टि में
  rationale: शाब्दिक भाव ‘उसके सामने/उसके मुख के आगे’ है। ‘उसकी दृष्टि में’ राजा की अनुकूल निगाह का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִכָּל הַבְּתוּלֹת
  choice: अन्य सभी कुँवारियों से बढ़कर
  rationale: בְּתוּלֹת पहले आए נָשִׁים से अधिक विशिष्ट शब्द है। ‘कुँवारियाँ’ इस शब्दगत भेद को आधुनिक, समझने योग्य हिन्दी में सुरक्षित रखता है।
- source_word: וַיָּשֶׂם כֶּתֶר מַלְכוּת
  choice: उसके सिर पर राजमुकुट रखा
  rationale: כֶּתֶר מַלְכוּת का अर्थ ‘राजत्व का मुकुट’ है। ‘राजमुकुट’ संक्षिप्त और स्वाभाविक हिन्दी है तथा राजकीय अर्थ को बनाए रखता है।
- source_word: וַיַּמְלִיכֶהָ
  choice: उसे रानी बनाया
  rationale: מלך का हिफ़ील रूप किसी को राजा या रानी बनाना/राज्य करने के पद पर बैठाना दर्शाता है। स्त्री संदर्भ में ‘रानी बनाया’ सबसे स्पष्ट है।
- source_word: תַּחַת וַשְׁתִּי
  choice: वशती के स्थान पर
  rationale: उत्तराधिकार अथवा प्रतिस्थापन के प्रसंग में תַּחַת का अर्थ ‘के स्थान पर’ है; यहाँ ‘अधीन’ अर्थ उपयुक्त नहीं है।
