  register: आधुनिक मानक हिंदी में गरिमापूर्ण कथात्मक शैली रखी गई है। लंबे वंश-संबंधी मध्यवाक्य को डैश से सीमित किया गया है। ‘कृपादृष्टि’ बाइबिलीय गरिमा बनाए रखते हुए सामान्य पाठक के लिए बोधगम्य है; ‘खोजा’ ऐतिहासिक राजदरबारी भूमिका को स्पष्ट करता है।
