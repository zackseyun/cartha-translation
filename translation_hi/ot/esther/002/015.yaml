base_translation:
  language: en
  yaml_path: translation/ot/esther/002/015.yaml
  text: When Esther’s turn came—the daughter of Abihail[a], the uncle of Mordecai, who had taken her as his own daughter—to go in to the king, she asked for nothing except what Hegai, the king’s eunuch, keeper of the women, advised[b]. And Esther was gaining favor in the eyes of all who saw her.
translation:
  language: hi
  text: जब एस्तेर की—जो अबीहैल की बेटी थी, और अबीहैल मोर्दकै का चाचा था—राजा के पास जाने की बारी आई, तब उसने कुछ भी नहीं माँगा, केवल वही जो राजा का खोजा और स्त्रियों का रखवाला हेगै बताता था[b]। मोर्दकै ने एस्तेर को अपनी बेटी के रूप में ले लिया था[a]। एस्तेर उसे देखने वाले सभी लोगों की कृपादृष्टि पाती गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात मोर्दकै ने एस्तेर को बेटी के समान अपने परिवार और संरक्षण में ले लिया था; मूल भाषा में औपचारिक कानूनी गोद लेने की प्रक्रिया अनिवार्य रूप से निहित नहीं है।
    reason: lexical_alternative
  - marker: b
    text: मूल भाषा में शाब्दिक रूप से ‘जो हेगै कहता’ है। ‘खोजा’ के लिए आया शब्द कुछ प्रसंगों में सामान्य रूप से ‘राजकीय अधिकारी’ भी हो सकता है, लेकिन यहाँ स्त्रियों की देखरेख का प्रसंग अधिक विशिष्ट अर्थ का समर्थन करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהַגִּיעַ תֹּר
  choice: जब ... की बारी आई
  rationale: पूर्वसर्ग और क्रियार्थक संज्ञा का संयोजन समयसूचक उपवाक्य बनाता है, और תֹּר यहाँ क्रम से मिलने वाली बारी को सूचित करता है। यह हिंदी में स्वाभाविक और सटीक है।
- source_word: דֹּד מָרְדֳּכַי
  choice: मोर्दकै का चाचा
  rationale: דֹּד पुरुष संबंधी के लिए प्रयुक्त हो सकता है; 2:7 के पारिवारिक संदर्भ में ‘चाचा’ उपयुक्त है, यद्यपि वंश-संबंध की दिशा पाठ में कुछ असहज बनी रहती है।
- source_word: לָקַח לוֹ לְבַת
  choice: अपनी बेटी के रूप में अपना लिया था
  rationale: यह इब्रानी मुहावरा एस्तेर को बेटी की तरह अपने संरक्षण और परिवार में लेने को दर्शाता है; यह अनुवाद आधुनिक हिंदी में स्पष्ट है और आवश्यक रूप से किसी औपचारिक कानूनी प्रक्रिया का दावा नहीं करता।
- source_word: לָבוֹא אֶל־הַמֶּלֶךְ
  choice: राजा के पास जाने
  rationale: यह राजकीय उपस्थिति में प्रवेश करने का संयत मुहावरा है। हिंदी रूप मूल कथन के अंतर्निहित वैवाहिक/यौन संदर्भ को अनावश्यक रूप से स्पष्ट नहीं करता।
- source_word: לֹא בִקְשָׁה דָּבָר כִּי אִם
  choice: उन चीज़ों के सिवा और कुछ नहीं माँगा
  rationale: अपवादसूचक रचना को स्पष्ट करता है। ‘चीज़ों’ का बहुवचन संदर्भ से पूरित है और तैयारियों अथवा आभूषण-सामग्री की ओर संकेत करता है।
- source_word: אֲשֶׁר יֹאמַר
  choice: जिनकी सलाह ... ने दी थी
  rationale: शाब्दिक अर्थ ‘जो वह कहे’ है, पर प्रसंग में हेगै द्वारा उपयुक्त वस्तुएँ सुझाना निहित है। ‘सलाह दी’ हिंदी में स्वाभाविक है, जबकि पादटिप्पणी इस अर्थ-विस्तार को स्पष्ट करती है।
- source_word: סְרִיס
  choice: खोजा
  rationale: राजकीय स्त्रीगृह के प्रसंग में शब्द का विशिष्ट अर्थ ‘खोजा’ अधिक संभावित है; केवल ‘अधिकारी’ कहना इस जानकारी को खो देगा।
- source_word: שֹׁמֵר הַנָּשִׁים
  choice: स्त्रियों का रखवाला
  rationale: यह हेगै के दायित्व का सीधा और बोधगम्य अनुवाद है, बिना ‘हरम’ जैसे बाहरी शब्द को मूल में जोड़े।
- source_word: וַתְּהִי ... נֹשֵׂאת חֵן בְּעֵינֵי
  choice: कृपादृष्टि पाती गई
  rationale: इब्रानी मुहावरा किसी की दृष्टि में अनुग्रह पाने को दर्शाता है। ‘पाती गई’ कथानक की प्रगतिशीलता और व्यापक होते अनुकूल प्रभाव को व्यक्त करता है।
- source_word: כָּל רֹאֶיהָ
  choice: वे सभी जो उसे देखते थे
  rationale: कृदंत अभिव्यक्ति का सहज हिंदी रूप, जो सार्वत्रिकता को बनाए रखता है।
theological_decisions:
- issue: मोर्दकै और अबीहैल के संबंध की व्याकरणिक अस्पष्टता
  choice: मुख्य पाठ में निकटतम स्वाभाविक वाक्य-विन्यास के अनुसार अबीहैल को मोर्दकै का चाचा कहा
  alternative: ‘एस्तेर, जो मोर्दकै के चाचा अबीहैल की बेटी थी’ या 2:7 के आधार पर संबंध को पुनर्गठित करना
  rationale: व्यंजन-पाठ में appositional रचना असहज है। अनुवाद स्रोत के सतही संबंध को रखता है और उसे किसी सिद्धांतगत या वंशावलीगत सामंजस्य से चुपचाप नहीं बदलता।
- issue: लָקַח לוֹ לְבַת में औपचारिक दत्तक-ग्रहण का प्रश्न
  choice: ‘अपनी बेटी के रूप में अपना लिया था’
  alternative: ‘गोद लिया था’
  rationale: मूल पाठ बेटी-सदृश पारिवारिक देखभाल बताता है, पर औपचारिक कानूनी दत्तक-प्रक्रिया को अनिवार्य नहीं करता।
