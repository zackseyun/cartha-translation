- source_word: וּשְׁמוֹ מָרְדֳּכַי
  choice: जिसका नाम मोर्दकै था
  rationale: हिब्रू के समन्वयी परिचय को स्वाभाविक हिन्दी संबंधवाचक वाक्य में व्यक्त किया गया है।
- source_word: בֶּן יָאִיר בֶּן שִׁמְעִי בֶּן קִישׁ
  choice: याईर का पुत्र, शिमी का पुत्र और कीश का पुत्र
  rationale: वंशावली की क्रमिक बनावट और בֶּן का औपचारिक अर्थ बनाए रखा गया है; दूर का वंशज होने की सम्भावना पादटिप्पणी में स्पष्ट है।
- source_word: אִישׁ יְמִינִי
  choice: एक बिन्यामी
  rationale: यह पद बिन्यामीन गोत्र की सदस्यता बताता है; ‘बिन्यामी’ प्रचलित, संक्षिप्त और स्वाभाविक हिन्दी रूप है।
