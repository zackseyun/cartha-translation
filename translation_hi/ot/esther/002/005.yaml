  text: There was a Jewish man in Susa the citadel[a], and his name was Mordecai son of Jair, son of Shimei, son of Kish[c][b], a Benjaminite.
translation:
  language: hi
  text: शूशन के राजदुर्ग[b] में एक यहूदी[a] पुरुष था; उसका नाम मोर्दकै था। वह याईर का पुत्र, शिमी का पुत्र और कीश का पुत्र था। वह बिन्यामीन के गोत्र का था।
  philosophy: optimal-equivalence
