  text: וַ/תִּיטַ֨ב הַ/נַּעֲרָ֣ה בְ/עֵינָי/ו֮ וַ/תִּשָּׂ֣א חֶ֣סֶד לְ/פָנָי/ו֒ וַ֠/יְבַהֵל אֶת תַּמְרוּקֶ֤י/הָ וְ/אֶת מָנוֹתֶ֨/הָ֙ לָ/תֵ֣ת לָ֔/הּ וְ/אֵת֙ שֶׁ֣בַע הַ/נְּעָר֔וֹת הָ/רְאֻי֥וֹת לָֽ/תֶת לָ֖/הּ מִ/בֵּ֣ית הַ/מֶּ֑לֶךְ וַ/יְשַׁנֶּ֧/הָ וְ/אֶת נַעֲרוֹתֶ֛י/הָ לְ/ט֖וֹב בֵּ֥ית הַ/נָּשִֽׁים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/009.yaml
  text: The young woman pleased him and found favor before him[a], and he quickly provided her with her beauty treatments and her portions, and with seven young women suitable to be given to her from the king’s palace; and he transferred her and her young women to the best place in the women’s house.
translation:
  language: hi
  text: वह युवती उसे अच्छी लगी और उसने उसकी कृपा पाई। उसने तुरन्त उसके सौन्दर्य-उपचार और उसके लिए निर्धारित हिस्से उसे दिलवाए। उसने राजमहल से उसके लिए सात योग्य युवतियाँ भी दीं और उसे तथा उसकी परिचारिकाओं को स्त्रीगृह के सबसे अच्छे भाग[a] में स्थान दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘स्त्रीगृह के सबसे अच्छे कक्षों में।’ यह राजमहल में स्त्रियों के लिए निर्धारित निवास-भाग के भीतर एक श्रेष्ठ स्थान को दर्शाता है, जिसे प्रायः हरम समझा जाता है।
    reason: इब्रानी वाक्यांश स्त्रीगृह के भीतर के श्रेष्ठ भाग या कक्षों का संकेत देता है; ‘हरम’ प्रसंगानुकूल व्याख्या है, मूल शब्द का सीधा अनुवाद नहीं।
lexical_decisions:
- source_word: וַתִּיטַב הַנַּעֲרָה בְעֵינָיו
  choice: वह युवती उसे अच्छी लगी
  rationale: यह इब्रानी मुहावरे ‘उसकी आँखों में अच्छी थी’ का स्वाभाविक आधुनिक हिन्दी रूप है और मूल से अधिक रोमानी या यौन भाव नहीं जोड़ता।
- source_word: וַתִּשָּׂא חֶסֶד לְפָנָיו
  choice: उसने उसकी कृपा पाई
  rationale: दरबारी प्रसंग में חֶסֶד अनुकूल व्यवहार या कृपा को व्यक्त करता है; यह रूप इब्रानी मुहावरे का अर्थ सहज हिन्दी में देता है।
- source_word: וַיְבַהֵל
  choice: उसने तुरन्त ... दिलवाए
  rationale: क्रिया शीघ्रता दर्शाती है। ‘तुरन्त’ उस भाव को स्पष्ट रखता है, जबकि ‘दिलवाए’ राजकीय अधिकारी द्वारा प्रबन्ध किए जाने के प्रसंग में स्वाभाविक है।
- source_word: תַּמְרוּקֶיהָ
  choice: उसके सौन्दर्य-उपचार
  rationale: यह शब्द स्त्रीगृह में की जाने वाली अंगराग अथवा सौन्दर्य-संबंधी तैयारियों को सूचित करता है; आधुनिक पाठक के लिए यह स्पष्ट और प्रसंगानुकूल है।
- source_word: מָנוֹתֶיהָ
  choice: उसके लिए निर्धारित हिस्से
  rationale: מָנוֹת आवंटित हिस्सों, प्रायः भोजन या अन्य प्रावधानों, को दर्शाता है। व्यापक शब्दावली मूल की अनिश्चितता बनाए रखती है।
- source_word: שֶׁבַע הַנְּעָרוֹת הָרְאֻיוֹת
  choice: सात योग्य युवतियाँ उसकी सेवा के लिए
  rationale: הָרְאֻיוֹת का अर्थ उपयुक्त या योग्य है। प्रसंग इन युवतियों की परिचारिका-भूमिका स्पष्ट करता है, इसलिए ‘उसकी सेवा के लिए’ स्वाभाविक रूप से संबंध बताता है।
- source_word: מִבֵּית הַמֶּלֶךְ
  choice: राजमहल से
  rationale: राजकीय संदर्भ में ‘राजा का घर’ हिन्दी में ‘राजमहल’ के रूप में अधिक स्वाभाविक और स्पष्ट है।
- source_word: וַיְשַׁנֶּהָ וְאֶת נַעֲרוֹתֶיהָ לְטוֹב בֵּית הַנָּשִׁים
  choice: उसे तथा उसकी सेविकाओं को स्त्रीगृह के सबसे अच्छे स्थान में पहुँचा दिया
  rationale: वाक्यांश एस्तेर और उसकी सेविकाओं को स्त्रीगृह के भीतर अधिक अच्छे स्थान पर रखने का भाव देता है। ‘पहुँचा दिया’ स्थान-परिवर्तन को व्यक्त करता है, पर पदोन्नति जैसी अतिरिक्त औपचारिक धारणा नहीं जोड़ता।
- source_word: בֵּית הַנָּשִׁים
  choice: स्त्रीगृह
  rationale: यह राजमहल में स्त्रियों के निर्धारित निवास-भाग को दर्शाता है। ‘स्त्रीगृह’ मूल रूपक के निकट, संक्षिप्त और गरिमापूर्ण है; ‘हरम’ अधिक व्याख्यात्मक है।
