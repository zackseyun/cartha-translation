translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप रखा गया है। ‘सौन्दर्य-उपचार’ और ‘स्त्रीगृह’ सामान्य पाठक के लिए स्पष्ट हैं, जबकि ‘निर्धारित हिस्से’ भोजन तक अर्थ को अनावश्यक रूप से सीमित नहीं करता। पाद-टिप्पणी का चिह्न उसी वाक्यांश पर रखा गया है जिससे उसका वास्तविक संबंध है।
