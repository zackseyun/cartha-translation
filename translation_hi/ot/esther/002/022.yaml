  yaml_path: translation/ot/esther/002/022.yaml
  text: When the matter became known to Mordecai[a], he told Queen Esther[c][b], and Esther told the king in Mordecai's name.
translation:
  language: hi
  text: जब यह बात मोर्दकै को मालूम हुई[a], तब उसने रानी एस्तेर को इसकी सूचना दी, और एस्तेर ने मोर्दकै के नाम से राजा को यह बात बताई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब यह बात मोर्दकै को बताई गई।” हिब्रू का निष्क्रिय रूप इस बात पर बल दे सकता है कि यह बात उसके ज्ञान में आई या किसी ने उसे इसकी सूचना दी।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּדַע
  choice: मालूम हुई
  rationale: 'निफ़अल रूप का निष्क्रिय/आरंभिक भाव बना रहता है: बात मोर्दकै के ज्ञान में आई, पर यह नहीं बताया जाता कि उसे किसने सूचित किया।'
- source_word: הַדָּבָר
  choice: यह बात
  rationale: शब्द व्यापक है और निकटवर्ती प्रसंग में पहले बताई गई हत्या की साज़िश की ओर संकेत करता है; ‘यह बात’ स्वाभाविक है और मूल से अधिक स्पष्टता नहीं जोड़ता।
- source_word: וַיַּגֵּד
  choice: इसकी सूचना दी
  rationale: हिफ़इल में क्रिया का अर्थ बताना या सूचना देना है; राजदरबार के संदर्भ में यह सहज और सटीक है।
- source_word: לְאֶסְתֵּר הַמַּלְכָּה
  choice: रानी एस्तेर को
  rationale: हिब्रू के ‘एस्तेर रानी’ को स्वाभाविक आधुनिक हिन्दी पदक्रम में व्यक्त करता है और पदवी सुरक्षित रखता है।
- source_word: וַתֹּאמֶר ... לַמֶּלֶךְ
  choice: राजा को यह बात बताई
  rationale: אמר का संप्रेषणार्थक भाव हिन्दी में ‘बताई’ से स्वाभाविक रूप से व्यक्त होता है; ‘यह बात’ पूर्ववर्ती विषय को स्पष्ट रूप से ग्रहण करती है।
- source_word: בְּשֵׁם מָרְדֳּכָי
  choice: मोर्दकै के नाम से
  rationale: मूल मुहावरे का निकट और स्वाभाविक हिन्दी रूप है, जो मोर्दकै को सूचना के स्रोत के रूप में श्रेय दिए जाने को व्यक्त करता है, बिना इसे केवल प्रतिनिधित्व तक सीमित किए।
