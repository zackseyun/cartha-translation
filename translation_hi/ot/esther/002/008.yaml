source:
  edition: WLC
  text: וַ/יְהִ֗י בְּ/הִשָּׁמַ֤ע דְּבַר הַ/מֶּ֨לֶךְ֙ וְ/דָת֔/וֹ וּֽ/בְ/הִקָּבֵ֞ץ נְעָר֥וֹת רַבּ֛וֹת אֶל שׁוּשַׁ֥ן הַ/בִּירָ֖ה אֶל יַ֣ד הֵגָ֑י וַ/תִּלָּקַ֤ח אֶסְתֵּר֙ אֶל בֵּ֣ית הַ/מֶּ֔לֶךְ אֶל יַ֥ד הֵגַ֖י שֹׁמֵ֥ר הַ/נָּשִֽׁים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/008.yaml
  text: And when the king’s command and his decree were heard[a], and when many young women were gathered to Susa the citadel into the custody of Hegai, Esther also was taken into the king’s house, into the custody of Hegai[b], keeper of the women.
translation:
  language: hi
  text: जब राजा का आदेश और उसकी राजाज्ञा सुनाई पड़ी, और बहुत-सी युवतियाँ शूशन के गढ़ में हेगै की देखरेख में इकट्ठी की गईं, तब एस्तेर भी राजमहल[a] में स्त्रियों के रखवाले हेगै की देखरेख[b] में ले जाई गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “राजा के घर में।”
    reason: lexical_alternative
  - marker: b
    text: या “हेगै के अधिकार में”; शाब्दिक रूप से, “हेगै के हाथ में।”
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּבַר הַמֶּלֶךְ וְדָתוֹ
  choice: राजा का आदेश और उसकी राजाज्ञा
  rationale: दְּבַר यहाँ राजकीय आदेश है और דָת फ़ारसी दरबार के औपचारिक फरमान को सूचित करता है। ‘आदेश’ और ‘राजाज्ञा’ दोनों के भेद तथा औपचारिकता को स्वाभाविक हिन्दी में बनाए रखते हैं।
- source_word: נְעָרוֹת רַבּוֹת
  choice: बहुत-सी युवतियाँ
  rationale: यह विवाह-योग्य आयु की अनेक युवा स्त्रियों को सूचित करता है; ‘युवतियाँ’ न तो अनावश्यक रूप से कम आयु बताता है, न इस पद में स्वयं निहित न होने वाली कौमार्य की बात जोड़ता है।
- source_word: שׁוּשַׁן הַבִּירָה
  choice: शूशन के गढ़ में
  rationale: הַבִּירָה से नगर के किलेबंद राजकीय परिसर का बोध होता है। ‘गढ़’ साधारण पाठक के लिए स्पष्ट और संक्षिप्त है।
- source_word: אֶל יַד הֵגָי
  choice: हेगै की देखरेख में
  rationale: शाब्दिक ‘हेगै के हाथ में’ यहाँ उसके अधिकार और अभिरक्षा के अधीन होने का मुहावरा है। ‘देखरेख में’ प्राकृतिक हिन्दी है, जबकि प्रसंग की संस्थागत और अनैच्छिक प्रकृति निष्क्रिय क्रियाओं से बनी रहती है।
- source_word: וַתִּלָּקַח
  choice: ले जाई गई
  rationale: निष्क्रिय क्रिया एस्तेर की पहल न होने और संभावित बाध्यता को सुरक्षित रखती है। ‘पकड़ ली गई’ बल-प्रयोग को आवश्यकता से अधिक स्पष्ट कर देता।
- source_word: בֵּית הַמֶּלֶךְ
  choice: राजमहल
  rationale: शाब्दिक अर्थ ‘राजा का घर’ है, पर इस दरबारी संदर्भ में राजकीय महल-परिसर अभिप्रेत है; ‘राजमहल’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: שֹׁמֵר הַנָּשִׁים
  choice: स्त्रियों का रखवाला
  rationale: שׁמר का कृदन्त उस अधिकारी को बताता है जो स्त्रियों को रखता और उनकी निगरानी करता था। ‘रखवाला’ स्रोत के निकट है और ‘संरक्षक’ जैसा अनावश्यक हितकारी भाव नहीं जोड़ता।
- source_word: וַיְהִי בְּהִשָּׁמַע ... וּבְהִקָּבֵץ
  choice: जब ... सुनाई पड़ी, और ... इकट्ठी की गईं, तब
  rationale: दोनों कालसूचक रचनाओं का समानांतर रूप और मुख्य घटना की ओर बढ़ता इब्रानी कथात्मक प्रवाह हिन्दी के ‘जब ... और ... तब’ ढाँचे में सुरक्षित रहता है।
