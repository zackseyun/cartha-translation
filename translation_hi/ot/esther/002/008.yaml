translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। दोनों निष्क्रिय क्रियाएँ युवतियों और एस्तेर की सीमित सक्रियता को प्रकट करती हैं, पर पाठ से अधिक बलपूर्वक अपहरण का दावा नहीं करतीं। अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्नों का स्थान उनकी विषयवस्तु से मेल नहीं खाता था; हिन्दी मसौदे में ‘राजमहल’ और ‘देखरेख’ पर चिह्न अर्थानुसार लगाए गए हैं।
