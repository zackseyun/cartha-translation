  text: בָּ/עֶ֣רֶב הִ֣יא בָאָ֗ה וּ֠/בַ/בֹּקֶר הִ֣יא שָׁבָ֞ה אֶל בֵּ֤ית הַ/נָּשִׁים֙ שֵׁנִ֔י אֶל יַ֧ד שַֽׁעֲשְׁגַ֛ז סְרִ֥יס הַ/מֶּ֖לֶךְ שֹׁמֵ֣ר הַ/פִּֽילַגְשִׁ֑ים לֹא תָב֥וֹא עוֹד֙ אֶל הַ/מֶּ֔לֶךְ כִּ֣י אִם חָפֵ֥ץ בָּ֛/הּ הַ/מֶּ֖לֶךְ וְ/נִקְרְאָ֥ה בְ/שֵֽׁם׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/014.yaml
  text: In the evening she would go in[a], and in the morning she would return to the second house of the women, into the care of Shaashgaz, the king’s eunuch, keeper of the concubines[b]. She would not go in again to the king unless the king delighted in her and she was summoned by name.
translation:
  language: hi
  text: शाम को वह राजा के पास प्रवेश करती थी[a], और सुबह वह स्त्रियों के दूसरे भवन में, राजा के खोजे शाशगज के अधीन लौट आती थी, जो रखैलों का प्रभारी था। वह फिर राजा के पास प्रवेश नहीं करती थी, जब तक कि राजा उससे प्रसन्न न हो और उसे नाम लेकर न बुलाया जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “राजा के पास प्रवेश करना” इब्रानी मुहावरा है, जिसका अर्थ राजा की उपस्थिति या उसके कक्ष में प्रवेश करना है; इस प्रसंग में यौन संबंध निहित है, पर मूल पाठ इसे सीधे नहीं कहता।
    reason: cultural_note
lexical_decisions:
- source_word: בָּעֶרֶב הִיא בָאָה
  choice: शाम को वह राजा के पास जाती थी
  rationale: कालसूचक पद और प्रसंगगत गमन को स्वाभाविक हिन्दी में व्यक्त करता है। अपूर्ण भूतकालीन ‘जाती थी’ इस व्यवस्था के अंतर्गत प्रत्येक स्त्री के साथ होने वाली सामान्य प्रक्रिया दिखाता है; ‘राजा के पास’ निकटवर्ती प्रसंग से स्पष्ट पूरक है।
- source_word: וּבַבֹּקֶר הִיא שָׁבָה
  choice: और सुबह वह ... लौट आती थी
  rationale: सरल क्रम और שׁוב के ‘लौटना’ अर्थ को बनाए रखता है।
- source_word: בֵּית הַנָּשִׁים שֵׁנִי
  choice: स्त्रियों का दूसरा भवन
  rationale: इब्रानी के शाब्दिक ‘स्त्रियों का भवन, दूसरा’ को स्पष्ट आधुनिक हिन्दी में रखता है और मुख्य पाठ में ‘हरम’ जैसी व्याख्यात्मक संज्ञा नहीं जोड़ता।
- source_word: אֶל יַד שַׁעֲשְׁגַז
  choice: शाशगज की देखरेख में
  rationale: ‘हाथ में/अधीन’ मुहावरे का प्रशासनिक आशय स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: סְרִיס הַמֶּלֶךְ
  choice: राजा का खोजा
  rationale: दरबारी प्रसंग में סריס का अधिक विशिष्ट और संभावित अर्थ ‘खोजा’ है; केवल ‘अधिकारी’ कहना इस सूचना को खो देगा।
- source_word: שֹׁמֵר הַפִּילַגְשִׁים
  choice: रखैलों का रखवाला
  rationale: שׁמר के निगरानी/प्रभार के भाव और פִּילֶגֶשׁ के ‘रखैल/उपपत्नी’ अर्थ को संक्षेप में रखता है।
- source_word: לֹא תָבוֹא עוֹד אֶל הַמֶּלֶךְ
  choice: वह फिर राजा के पास नहीं जाती थी
  rationale: इब्रानी मुहावरे को यौनार्थ में अत्यधिक स्पष्ट किए बिना राजा की उपस्थिति/कक्ष में प्रवेश का भाव देता है।
- source_word: כִּי אִם חָפֵץ בָּהּ הַמֶּלֶךְ
  choice: जब तक कि राजा उससे प्रसन्न न हो
  rationale: כִּי אִם का अपवादात्मक अर्थ और חפץ ב का प्रसन्न होने/चाहने का व्यापक भाव सुरक्षित रहता है; इसे केवल यौन इच्छा तक सीमित नहीं किया गया।
- source_word: וְנִקְרְאָה בְשֵׁם
  choice: और उसे नाम लेकर न बुलाया जाए
  rationale: निफ़अल रूप की कर्मवाच्यता और ‘नाम लेकर’ बुलाने की विशिष्टता दोनों बनाए रखता है।
