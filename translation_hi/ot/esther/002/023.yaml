  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। मूल पाठ की निष्क्रिय क्रियाएँ जहाँ स्वाभाविक थीं वहाँ सुरक्षित रखी गई हैं। दण्ड की सटीक विधि को मुख्य पाठ में निश्चित नहीं किया गया, क्योंकि इब्रानी शब्दावली उसे स्पष्ट रूप से निर्धारित नहीं करती।
