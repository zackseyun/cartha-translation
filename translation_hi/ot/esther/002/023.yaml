base_translation:
  language: en
  yaml_path: translation/ot/esther/002/023.yaml
  text: When the matter was investigated and found to be so[a], both of them were hanged on a tree, and it was written in the book of the chronicles in the presence of the king.
translation:
  language: hi
  text: जब उस मामले की जाँच की गई और वह सच पाया गया, तब उन दोनों को एक पेड़ पर लटका दिया गया[a], और यह बात राजा की उपस्थिति में वृत्तांतों की पुस्तक में लिखी गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दोनों को लकड़ी के खम्भे पर चढ़ा दिया गया।” इब्रानी में शाब्दिक रूप से “एक पेड़ पर लटका दिया गया” है। फ़ारसी दण्ड-विधि में खम्भे पर चढ़ाना या सार्वजनिक रूप से लटकाना शामिल रहा हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבֻקַּשׁ הַדָּבָר
  choice: जब उस मामले की जाँच की गई
  rationale: यहाँ בקש का निष्क्रिय रूप षड्यंत्र की सूचना की औपचारिक जाँच को व्यक्त करता है; यह अनुवाद न्यायिक भाव और निष्क्रिय रचना दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: וַיִּמָּצֵא
  choice: और वह सच पाया गया
  rationale: संदर्भ में इसका अर्थ है कि सूचना प्रमाणित हुई। 'सच पाया गया' निहित परिणाम को स्पष्ट करते हुए मूल के निष्क्रिय भाव को बनाए रखता है।
- source_word: וַיִּתָּלוּ
  choice: लटका दिया गया
  rationale: תלה मूलतः लटकाने या टाँगने को दर्शाता है और अपने आप में सूली पर चढ़ाने अथवा भाले पर चढ़ाने की निश्चित विधि नहीं बताता।
- source_word: שְׁנֵיהֶם
  choice: उन दोनों को
  rationale: यह दोनों षड्यंत्रकारियों पर दिए गए संयुक्त दण्ड को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עַל עֵץ
  choice: एक पेड़ पर
  rationale: עֵץ का सीधा अर्थ 'पेड़' या 'लकड़ी' है। मुख्य पाठ स्रोत के शब्द के निकट रहता है, जबकि सम्भावित दण्ड-विधि पाद-टिप्पणी में दी गई है।
- source_word: וַיִּכָּתֵב
  choice: लिखी गई
  rationale: כתב के निष्क्रिय रूप का सीधा अर्थ सुरक्षित है; स्त्रीलिंग क्रिया हिन्दी में 'यह बात' से मेल खाती है।
- source_word: בְּסֵפֶר דִּבְרֵי הַיָּמִים
  choice: इतिहास-वृत्तांत की पुस्तक में
  rationale: यह राजकीय घटनाओं के आधिकारिक अभिलेख को दर्शाता है और मूल पदबंध के 'दिनों की घटनाओं' वाले भाव को पठनीय हिन्दी में व्यक्त करता है।
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: राजा की उपस्थिति में
  rationale: לִפְנֵי का स्थानिक और दरबारी अर्थ 'राजा के सामने/उपस्थिति में' है; यह चयन प्रसंग को स्पष्ट रखता है।
