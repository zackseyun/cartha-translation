base_translation:
  language: en
  yaml_path: translation/ot/esther/002/004.yaml
  text: And let the young woman who pleases the king become queen instead of Vashti[a]. The proposal pleased the king[c][b], and he did so.
translation:
  language: hi
  text: “और जो युवती राजा को भाए[a], वह वशती के स्थान पर रानी बने[b]।” यह प्रस्ताव राजा को अच्छा लगा[c], और उसने वैसा ही किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जो राजा की दृष्टि में अच्छी ठहरे।” इब्रानी मुहावरे का शाब्दिक अर्थ है “जो राजा की आँखों में अच्छी हो।”
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक अर्थ: “वशती के स्थान पर राज्य करे।”'
    reason: lexical_alternative
  - marker: c
    text: या “यह बात राजा की दृष्टि में अच्छी थी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעֲרָה
  choice: युवती
  rationale: נַעֲרָה यहाँ विवाह योग्य युवा स्त्री को सूचित करता है। ‘युवती’ आधुनिक, स्वाभाविक और गरिमापूर्ण है; ‘लड़की’ की अपेक्षा आयु के विषय में अनावश्यक रूप से कम उम्र का आभास नहीं देता।
- source_word: אֲשֶׁר תִּיטַב בְּעֵינֵי הַמֶּלֶךְ
  choice: जो राजा को भाए
  rationale: शाब्दिक इब्रानी मुहावरा ‘राजा की आँखों में अच्छी हो’ किसी के निर्णय में अच्छा या मनभावन लगने का अर्थ देता है। ‘राजा को भाए’ इसका संक्षिप्त और स्वाभाविक हिन्दी रूप है।
- source_word: תִּמְלֹךְ
  choice: रानी बने
  rationale: מלך का मूल अर्थ ‘राज्य करना’ है, पर स्त्रीलिंग रूप और वशती का स्थान लेने के प्रसंग में आशय राजपद ग्रहण करके रानी बनने से है। मुख्य पाठ में स्वाभाविक हिन्दी रखी गई है और अधिक शाब्दिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: תַּחַת וַשְׁתִּי
  choice: वशती के स्थान पर
  rationale: תַּחַת यहाँ स्थानापन्न होने का भाव व्यक्त करता है, भौतिक रूप से ‘नीचे’ होने का नहीं।
- source_word: וַיִּיטַב הַדָּבָר בְּעֵינֵי הַמֶּלֶךְ
  choice: यह प्रस्ताव राजा को अच्छा लगा
  rationale: דָּבָר का अर्थ ‘बात’, ‘विषय’ या प्रसंगानुसार ‘प्रस्ताव’ हो सकता है। पिछले पदों में सुझाई गई कार्ययोजना के कारण ‘प्रस्ताव’ अर्थ को स्पष्ट करता है, जबकि ‘अच्छा लगा’ उसी इब्रानी मुहावरे को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיַּעַשׂ כֵּן
  choice: और उसने वैसा ही किया
  rationale: यह सामान्य कथात्मक सूत्र है, जो बताता है कि राजा ने प्रस्ताव के अनुसार कार्य किया।
