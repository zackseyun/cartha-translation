base_translation:
  language: en
  yaml_path: translation/ot/esther/002/001.yaml
  text: After these things[a], when the anger of King Ahasuerus had subsided, he remembered Vashti, what she had done[b], and what had been decreed against her.
translation:
  language: hi
  text: इन घटनाओं के बाद, जब राजा अहश्वेरोश का क्रोध शांत हो चुका था, तब उसने वश्ती को, और जो उसने किया था उसे, तथा उसके विरुद्ध जो ठहराया गया था उसे याद किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: इन घटनाओं के बाद
  rationale: यह इब्रानी कालसूचक सूत्र को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; यहाँ ‘דְּבָרִים’ प्रसंग में घटनाओं को दर्शाता है।
- source_word: כְּשֹׁךְ חֲמַת
  choice: जब ... का क्रोध शांत हो गया
  rationale: שׁכך क्रोध के घटने या थमने को व्यक्त करता है; यह रूप हिन्दी कथा-शैली में स्पष्ट और स्वाभाविक है।
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: राजा अहशवेरोश
  rationale: राजकीय उपाधि और नाम दोनों सुरक्षित रहते हैं तथा हिन्दी का सामान्य पदक्रम अपनाया गया है।
- source_word: זָכַר
  choice: याद किया
  rationale: यह क्रिया का सीधा अर्थ है और बीती बातों को स्मरण करने का भाव बनाए रखता है।
- source_word: וַשְׁתִּי
  choice: वशती
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: אֲשֶׁר עָשָׂתָה
  choice: उसके किए हुए काम को
  rationale: यह ‘जो उसने किया था’ के आशय को संज्ञात्मक समानांतर संरचना में स्वाभाविक हिन्दी में रखता है।
- source_word: אֲשֶׁר נִגְזַר עָלֶיהָ
  choice: उसके विरुद्ध दिए गए आदेश को
  rationale: निष्क्रिय נִגְזַר आधिकारिक निर्णय या आदेश को और עָלֶיהָ उसके प्रतिकूल लागू होने को व्यक्त करता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी की सहज किंतु गरिमापूर्ण कथात्मक शैली अपनाई गई है। तीनों स्मरण-विषयों की समानांतरता बनाए रखी गई है और किसी अतिरिक्त मनोवैज्ञानिक या धर्मवैज्ञानिक निष्कर्ष को नहीं जोड़ा गया।
