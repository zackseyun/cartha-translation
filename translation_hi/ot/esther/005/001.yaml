source:
  edition: WLC
  text: וַ/יְהִ֣י בַּ/יּ֣וֹם הַ/שְּׁלִישִׁ֗י וַ/תִּלְבַּ֤שׁ אֶסְתֵּר֙ מַלְכ֔וּת וַֽ/תַּעֲמֹ֞ד בַּ/חֲצַ֤ר בֵּית הַ/מֶּ֨לֶךְ֙ הַ/פְּנִימִ֔ית נֹ֖כַח בֵּ֣ית הַ/מֶּ֑לֶךְ וְ֠/הַ/מֶּלֶךְ יוֹשֵׁ֞ב עַל כִּסֵּ֤א מַלְכוּת/וֹ֙ בְּ/בֵ֣ית הַ/מַּלְכ֔וּת נֹ֖כַח פֶּ֥תַח הַ/בָּֽיִת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/005/001.yaml
  text: On the third day[a], Esther put on her royal robes and stood in the inner court of the king’s palace, opposite the king’s house, while the king was sitting on his royal throne in the royal house[b], opposite the entrance of the house.
translation:
  language: hi
  text: तीसरे दिन एस्तेर ने राजसी वस्त्र[a] पहने और राजा के महल के भीतरी आँगन में, राजा के भवन के सामने, खड़ी हो गई। उस समय राजा राजमहल[b] में उस भवन के प्रवेश-द्वार के सामने अपने राजसिंहासन पर बैठा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, ‘राजत्व पहना’; आशय राजसी पोशाक या राजचिह्न धारण करना है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ प्रयुक्त इब्रानी शब्द का अर्थ ‘भवन’ या ‘घर’ भी हो सकता है; इस राजकीय संदर्भ में उसका अर्थ ‘राजमहल’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: वाक्य में अलग से अनूदित नहीं
  rationale: यह कथानक को आगे बढ़ाने वाला सूत्र है। आधुनिक हिन्दी में क्रमसूचक संयोजक जोड़े बिना सीधे ‘तीसरे दिन’ से आरम्भ करना स्वाभाविक है।
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: तीसरे दिन
  rationale: मूल के स्पष्ट समय-सूचक पद का सीधा और स्वाभाविक अनुवाद।
- source_word: וַתִּלְבַּשׁ אֶסְתֵּר מַלְכוּת
  choice: एस्तेर ने राजसी वस्त्र पहने
  rationale: מַלְכוּת का शाब्दिक अर्थ ‘राजत्व’ है, पर यहाँ ‘पहनना’ क्रिया के साथ इसका आशय राजकीय पोशाक या राजचिह्नों से है।
- source_word: וַתַּעֲמֹד
  choice: जाकर खड़ी हो गई
  rationale: ‘खड़ी हुई’ मूल अर्थ है; ‘जाकर’ हिन्दी में आँगन के स्थान-सूचक पद के साथ गति और परिणामी स्थिति को स्वाभाविक ढंग से व्यक्त करता है, बिना कोई नया कथानक जोड़ने के।
- source_word: בַּחֲצַר בֵּית־הַמֶּלֶךְ הַפְּנִימִית
  choice: राजा के महल के भीतरी आँगन में
  rationale: दरबारी परिवेश में בֵּית הַמֶּלֶךְ पूरे महल-परिसर को सूचित करता है; ‘भीतरी आँगन’ स्थान को स्पष्ट रखता है।
- source_word: נֹכַח בֵּית הַמֶּלֶךְ
  choice: राजभवन के सामने
  rationale: נֹכַח आमने-सामने की स्थानिक दिशा बताता है। ‘राजभवन’ महल-परिसर के भीतर उस भवन को दर्शाता है जिसकी ओर एस्तेर मुख किए खड़ी थी।
- source_word: וְהַמֶּלֶךְ יוֹשֵׁב
  choice: उस समय राजा ... बैठा था
  rationale: यह खंड एस्तेर के खड़े होने के साथ चल रही पृष्ठभूमि की स्थिति बताता है; ‘उस समय’ हिन्दी में समकालिकता स्पष्ट करता है।
- source_word: עַל כִּסֵּא מַלְכוּתוֹ
  choice: अपने राजसिंहासन पर
  rationale: निर्मित पद का स्वाभाविक हिन्दी अर्थ राजा का राजकीय सिंहासन है।
- source_word: בְּבֵית הַמַּלְכוּת
  choice: राजमहल में
  rationale: यह पद राजकीय भवन या महल को सूचित करता है। ‘राजमहल’ आधुनिक हिन्दी में संक्षिप्त और स्पष्ट है।
- source_word: נֹכַח פֶּתַח הַבָּיִת
  choice: भवन के प्रवेश-द्वार के सामने
  rationale: נֹכַח स्थानिक अभिमुखता और פֶּתַח प्रवेश का खुला स्थान बताता है; ‘प्रवेश-द्वार’ हिन्दी में स्वाभाविक है।
