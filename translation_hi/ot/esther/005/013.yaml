  rationale: וְ संदर्भ में हामान की पिछली डींगों और वर्तमान असंतोष के बीच विरोध दिखाता है; ‘फिर भी’ यह भाव स्वाभाविक हिन्दी में व्यक्त करता है, और כָל זֶה को ‘यह सब’ रखा गया है।
- source_word: אֵינֶנּוּ שֹׁוֶה לִי
  choice: मेरे लिए कुछ भी मूल्य नहीं रखता
  rationale: שׁוה के मूल्य या लाभ संबंधी अर्थ को यह मुहावरेदार आधुनिक हिन्दी में व्यक्त करता है; हामान के लिए उसके सारे सम्मान निष्फल हो जाते हैं।
- source_word: בְּ/כָל עֵת אֲשֶׁר
  choice: जब-जब
  rationale: मूल के ‘हर बार जब’ वाले पुनरावृत्त समय-बोध को संक्षिप्त और स्वाभाविक रूप से बनाए रखता है।
- source_word: רֹאֶה
  choice: मैं… देखता हूँ
  rationale: सर्वनाम के साथ कृदंत निरंतर या बार-बार होने वाली क्रिया बताता है; ‘देखता हूँ’ इस प्रसंग में सहज है।
- source_word: מָרְדֳּכַי
  choice: मोर्दकै
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: הַיְּהוּדִי
  choice: यहूदी
  rationale: फारसी दरबार के प्रवासी परिवेश में यह शब्द मुख्यतः मोर्दकै की जातीय-सामुदायिक पहचान पर बल देता है; भौगोलिक अर्थ ‘यहूदिया-वासी’ भी शब्द में संभव है।
- source_word: יוֹשֵׁב
  choice: बैठा
  rationale: मोर्दकै की मुद्रा और स्थान का सीधा, सजीव वर्णन सुरक्षित रखता है।
- source_word: בְּ/שַׁעַר הַמֶּלֶךְ
  choice: राजा के फाटक पर
  rationale: राजकीय प्रशासन से जुड़े फाटक के परिसर के लिए स्वाभाविक हिन्दी अभिव्यक्ति है।
