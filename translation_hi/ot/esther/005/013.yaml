  text: Yet all this is worth nothing to me whenever I see Mordecai the Jew sitting at the king’s gate[a][b].
translation:
  language: hi
  text: फिर भी, जब-जब मैं यहूदी मोर्दकै को राजा के फाटक पर बैठा देखता हूँ, तब यह सब मेरे लिए किसी मूल्य का नहीं है[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और जब भी मैं यहूदी मोर्दकै को राजा के फाटक पर बैठा देखता हूँ, तब यह सब मेरे लिए किसी मूल्य का नहीं है।”
    reason: lexical_alternative
  - marker: b
    text: “यहूदी” का अनुवाद “यहूदिया-वासी” भी हो सकता है; यहाँ फारसी दरबार के परिवेश में यह शब्द संभवतः मोर्दकै की यहूदी जातीय पहचान पर बल देता है।
    reason: lexical_alternative
