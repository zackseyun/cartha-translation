lexical_decisions:
- source_word: וַיִּתְאַפַּק
  choice: अपने आप को रोक लिया
  rationale: हित्पाएल रूप क्रोध के सामने आत्म-संयम का भाव देता है। यह चयन प्रतिवर्ती अर्थ को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: וַיָּבֹא אֶל־בֵּיתוֹ
  choice: अपने घर चला गया
  rationale: शाब्दिक गति ‘अपने घर की ओर/में गया’ है; हिन्दी में ‘अपने घर चला गया’ स्वाभाविक है और गंतव्य का भाव सुरक्षित रखता है।
- source_word: וַיִּשְׁלַח וַיָּבֵא
  choice: बुलवा भेजा
  rationale: ‘उसने भेजा और बुलवाकर लाया’ की संक्षिप्त इब्रानी क्रिया-श्रृंखला का हिन्दी मुहावरेदार समतुल्य है; इसमें किसी को भेजकर लोगों को अपने पास बुलाने का कारणात्मक भाव बना रहता है।
- source_word: אֹהֲבָיו
  choice: अपने मित्रों
  rationale: यहाँ אהב से बना बहुवचन सामाजिक निकटता रखने वालों, अर्थात मित्रों, को दर्शाता है।
- source_word: זֶרֶשׁ אִשְׁתּוֹ
  choice: अपनी पत्नी जेरेश
  rationale: आधुनिक हिन्दी में संबंध और नाम का यह क्रम सबसे स्पष्ट और स्वाभाविक है, यद्यपि इब्रानी में नाम पहले आता है।
- source_word: וַ
  choice: परन्तु
  rationale: कथा-सूचक वाव को प्रसंग के हल्के विरोध—क्रोध के बावजूद आत्म-संयम—के कारण ‘परन्तु’ से व्यक्त किया गया है।
