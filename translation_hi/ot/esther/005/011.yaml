base_translation:
  language: en
  yaml_path: translation/ot/esther/005/011.yaml
  text: And Haman told them of the glory of his wealth[a], and the multitude of his sons, and all that the king had done to make him great[d][c][b], and how he had exalted him above the officials and servants of the king.
translation:
  language: hi
  text: हामान ने उन्हें अपने धन-वैभव की शान, अपने बहुत-से पुत्रों, उन सब बातों का वर्णन किया जो राजा ने उसे महान बनाने के लिए की थीं, और यह भी कि राजा ने उसे राजकीय अधिकारियों और सेवकों से ऊपर उठाया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: बताया
  rationale: यह क्रिया क्रमिक कथा में हामान द्वारा अपने परिवार और मित्रों के सामने अपनी प्रतिष्ठा का बखान करने को व्यक्त करती है। ‘बताया’ सहज आधुनिक हिन्दी है और मूल के कथनात्मक अर्थ को बनाए रखता है।
- source_word: כְּבוֹד עָשְׁרוֹ
  choice: अपने धन-वैभव
  rationale: כָּבוֹד यहाँ धन से जुड़ी प्रतिष्ठा, भव्यता और प्रभाव को दर्शाता है। ‘धन-वैभव’ हिन्दी में इस संयुक्त भाव को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: רֹב בָּנָיו
  choice: अपने बहुत-से पुत्रों
  rationale: רֹב बहुतायत को और בָּנָיו विशेष रूप से ‘उसके पुत्रों’ को सूचित करता है; इसलिए सामान्य ‘संतान’ के बजाय पुरुष-संदर्भ सुरक्षित रखा गया है।
- source_word: גִּדְּלוֹ
  choice: उसे महान बनाया था
  rationale: גדל का पिएल रूप यहाँ किसी को महान अथवा प्रतिष्ठित बनाने का कारक अर्थ रखता है। यह अनुवाद राजा की सक्रिय भूमिका और मूल की अभिव्यक्ति दोनों को बनाए रखता है।
- source_word: נִשְּׂאוֹ עַל
  choice: उसे ... से ऊँचा पद दिया था
  rationale: इस प्रसंग में נשא עם עַל पद और दर्जे में दूसरों से ऊपर उठाने को व्यक्त करता है। ‘ऊँचा पद दिया’ आधुनिक हिन्दी में दरबारी पदोन्नति का अर्थ स्पष्ट करता है।
- source_word: הַשָּׂרִים
  choice: अधिकारियों
  rationale: फ़ारसी राजदरबार के प्रसंग में שָׂרִים शासकीय पदाधिकारियों को दर्शाता है; ‘अधिकारी’ आधुनिक पाठक के लिए स्पष्ट है और वंशानुगत कुलीनता का अनावश्यक संकेत नहीं देता।
- source_word: עַבְדֵי הַמֶּלֶךְ
  choice: राजा के ... सेवकों
  rationale: यह पद राजकीय सेवा में लगे लोगों के लिए है। ‘सेवक’ दरबारी संदर्भ में सहज है और यहाँ ‘दास’ की अपेक्षा अधिक उपयुक्त है।
