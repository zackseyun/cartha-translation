  yaml_path: translation/ot/esther/005/005.yaml
  text: Then the king said[a], "Hurry, bring Haman, so that Esther's word may be done." So the king and Haman came to the banquet that Esther had prepared.
translation:
  language: hi
  text: तब राजा ने कहा[a], “जल्दी करो, हामान को बुलाओ, ताकि एस्तेर की बात पूरी की जाए।” तब राजा और हामान उस भोज में आए जिसे एस्तेर ने तैयार किया था।
  philosophy: optimal-equivalence
  footnotes:
