    text: या “एस्तेर की बात को पूरा करने के लिए।” इब्रानी में शाब्दिक रूप से “एस्तेर की बात को करना” है; यहाँ “बात” का अर्थ उसका कहा हुआ अनुरोध या निर्देश हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַהֲרוּ אֶת הָמָן
  choice: जल्दी करो, हामान को बुलाओ
  rationale: बहुवचन आज्ञार्थक מַהֲרוּ सेवकों को तत्काल कार्रवाई करने का आदेश देता है। אֶת הָמָן उसका प्रत्यक्ष कर्म है; दरबारी प्रसंग में हामान को राजा के पास उपस्थित कराने के लिए “बुलाओ” स्वाभाविक है।
- source_word: לַעֲשׂוֹת אֶת דְּבַר אֶסְתֵּר
  choice: ताकि एस्तेर की बात पूरी की जाए
  rationale: इब्रानी का शाब्दिक अर्थ “एस्तेर की बात को करना” है। यहाँ דְּבַר उसकी कही हुई बात या अनुरोध को सूचित कर सकता है; “बात पूरी की जाए” इस अर्थ-व्याप्ति और मूल की क्रियात्मक संरचना को बनाए रखता है।
- source_word: וַיָּבֹא
  choice: आए
  rationale: בוא का अर्थ दृष्टिकोण के अनुसार आना या जाना हो सकता है। भोज को गंतव्य मानते हुए हिंदी में “आए” सहज कथात्मक प्रयोग है।
- source_word: הַמִּשְׁתֶּה
  choice: भोज
  rationale: מִשְׁתֶּה खाने-पीने के उत्सवी आयोजन को दर्शाता है। “भोज” राजकीय प्रसंग में स्वाभाविक, संक्षिप्त और आधुनिक हिंदी में सुबोध है।
- source_word: אֲשֶׁר עָשְׂתָה אֶסְתֵּר
  choice: जिसे एस्तेर ने तैयार किया था
  rationale: भोज के साथ עשה का आशय उसे तैयार या आयोजित करना है। “तैयार किया था” उनके आगमन से पहले की तैयारी को स्पष्ट और मुहावरेदार ढंग से व्यक्त करता है।
