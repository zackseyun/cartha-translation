  choice: यदि राजा को अच्छा लगे
  rationale: यह राजदरबार में विनम्र निवेदन का मुहावरा है। यह अनुवाद हिब्रू טוֹב (‘अच्छा’) के निकट रहते हुए आधुनिक हिन्दी में स्वाभाविक और सम्मानपूर्ण है।
- source_word: יָבוֹא
