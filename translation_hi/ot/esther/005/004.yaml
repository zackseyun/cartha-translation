  rationale: रूपतः अपूर्ण काल होने पर भी यहाँ इसका भाव विनम्र आग्रह या निमंत्रण का है। आदरसूचक बहुवचन ‘आएँ’ राजा के प्रति दरबारी सम्मान भी व्यक्त करता है और हामान को साथ सम्मिलित करता है।
- source_word: הַמֶּלֶךְ וְהָמָן
  choice: राजा और हामान
  rationale: मूल पाठ ‘राजा’ पदवी को दोहराता है और राजा का व्यक्तिगत नाम नहीं देता; हिन्दी में भी वही रखा गया है।
- source_word: הַיּוֹם
  choice: आज
  rationale: यह समय की तात्कालिकता को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הַמִּשְׁתֶּה
  choice: भोज
  rationale: यह राजकीय दावत या उत्सवी भोजन को स्वाभाविक हिन्दी में व्यक्त करता है; प्रसंग में मद्यपान निहित हो सकता है, पर उसे अनावश्यक रूप से प्रमुख नहीं किया गया।
- source_word: אֲשֶׁר עָשִׂיתִי לוֹ
  choice: जो मैंने उसके लिए तैयार किया है
  rationale: भोज के साथ עָשָׂה का स्वाभाविक हिन्दी रूप ‘तैयार किया’ है। एकवचन לוֹ को ‘उसके लिए’ रखकर मूल की संदर्भगत अस्पष्टता सुरक्षित की गई है।
