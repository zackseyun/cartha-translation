base_translation:
  language: en
  yaml_path: translation/ot/esther/005/006.yaml
  text: And the king said to Esther at the wine banquet[a], “What is your petition? It will be granted to you. And what is your request? Even up to half the kingdom[b], it will be done.”
translation:
  language: hi
  text: दाखरस की दावत में राजा ने एस्तेर से कहा, “तुम्हारी विनती क्या है? वह तुम्हें प्रदान की जाएगी[a]। और तुम्हारा अनुरोध क्या है? उसे आधे राज्य तक भी पूरा किया जाएगा[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह तुम्हें दी जाएगी।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में, “आधे राज्य तक”; मूल पाठ स्पष्ट रूप से “मेरे राज्य” नहीं कहता।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמִשְׁתֵּה הַיַּיִן
  choice: दाखमधु के भोज के समय
  rationale: מִשְׁתֶּה भोज को और הַיַּיִן दाखमधु को सूचित करता है। यह प्रयोग भोज और मदिरापान से जुड़े अवसर, दोनों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: שְּׁאֵלָתֵךְ
  choice: तुम्हारी विनती
  rationale: यहाँ संज्ञा किसी प्रश्न के बजाय माँगी गई वस्तु या निवेदन को दर्शाती है। ‘विनती’ राजदरबार के प्रसंग के अनुकूल है और आगे आने वाले בַּקָּשָׁה से हल्का भेद बनाए रखती है।
- source_word: וְיִנָּתֵן לָךְ
  choice: वह तुम्हें दे दी जाएगी
  rationale: निफ़अल रूप राजा के इस आश्वासन को व्यक्त करता है कि विनती स्वीकार करके माँगी हुई वस्तु दी जाएगी। हिन्दी में यह वाक्य मूल के ‘देना’ रूपक को भी सुरक्षित रखता है।
- source_word: בַּקָּשָׁתֵךְ
  choice: तुम्हारा अनुरोध
  rationale: בַּקָּשָׁה चाही या माँगी गई बात को दर्शाता है। ‘अनुरोध’ स्वाभाविक है और שְׁאֵלָה के लिए प्रयुक्त ‘विनती’ से सूक्ष्म शब्दगत भेद रखता है।
- source_word: עַד חֲצִי הַמַּלְכוּת
  choice: आधे राज्य तक भी
  rationale: עַד सीमा को व्यक्त करता है और इस राजकीय अतिशयोक्ति में ‘भी’ उसका बल प्रकट करता है। मूल में ‘मेरे’ नहीं है, इसलिए अनुवाद में भी उसे नहीं जोड़ा गया।
- source_word: וְתֵעָשׂ
  choice: उसे पूरा किया जाएगा
  rationale: संदर्भ में स्त्रीलिंग क्रिया अनुरोध को पूरा किए जाने की ओर संकेत करती है। यह निष्क्रिय राजकीय आश्वासन को स्वाभाविक हिन्दी में व्यक्त करता है।
