  text: Then Esther answered and said[a], “My petition and my request are:”
translation:
  language: hi
  text: तब एस्तेर ने उत्तर दिया और कहा[a], “मेरी विनती और मेरा निवेदन यह है:”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और एस्तेर ने उत्तर दिया और कहा, ‘मेरा प्रश्न और मेरा निवेदन यह है:’” इब्रानी में एस्तेर की याचना के लिए औपचारिक रूप से दो निकटार्थी शब्दों का प्रयोग हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַן
  choice: तब ... ने उत्तर दिया
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; ‘तब’ घटनाक्रम को स्वाभाविक हिन्दी में व्यक्त करता है, और ‘उत्तर दिया’ ענה के वाणी-संबंधी सामान्य अर्थ को बनाए रखता है।
- source_word: אֶסְתֵּר
  choice: एस्तेर
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: וַתֹּאמַר
  choice: और कहा
  rationale: इब्रानी की औपचारिक युग्म-अभिव्यक्ति ‘उत्तर दिया और कहा’ के दोनों क्रियापद सुरक्षित रखे गए हैं।
- source_word: שְׁאֵלָתִי
  choice: मेरी विनती
  rationale: इस शब्द का अर्थ ‘प्रश्न’ भी हो सकता है, पर राजदरबार में एस्तेर की औपचारिक याचना के संदर्भ में ‘विनती’ अधिक स्वाभाविक है।
- source_word: וּבַקָּשָׁתִי
  choice: और मेरा निवेदन
  rationale: בַּקָּשָׁה अनुरोध या याचना को दर्शाता है। ‘निवेदन’ निकटार्थी संज्ञाओं के औपचारिक युग्म को रखते हुए שְׁאֵלָה के लिए चुनी गई ‘विनती’ से हल्का भेद बनाए रखता है।
