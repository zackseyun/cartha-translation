base_translation:
  language: en
  yaml_path: translation/ot/esther/005/009.yaml
  text: Haman went out that day joyful and glad of heart. But when Haman saw Mordecai in the king’s gate[a], and that he did not rise or tremble before him, Haman was filled with rage against Mordecai.
translation:
  language: hi
  text: उस दिन हामान आनन्दित और प्रसन्न मन से बाहर निकला। पर जब हामान ने राजद्वार पर मोर्दकै को देखा कि वह उसके सामने न तो उठा, न काँपा,[a] तो हामान मोर्दकै पर क्रोध से भर गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके सामने न उठा, न भय दिखाया।”
    reason: זוע के अर्थ में काँपना, भयभीत होना अथवा भय से विचलित होना सम्मिलित हो सकता है।
lexical_decisions:
- source_word: שָׂמֵחַ וְטוֹב לֵב
  choice: आनन्दित और प्रसन्न मन से
  rationale: यह युग्म हामान की अत्यन्त हर्षित मनःस्थिति व्यक्त करता है; हिन्दी में स्वाभाविक रहते हुए मूल की समानांतर अभिव्यक्ति बनाए रखता है।
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: काल-सूचना को संक्षिप्त और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בְּשַׁעַר הַמֶּלֶךְ
  choice: राजद्वार पर
  rationale: यह राजमहल के द्वार-परिसर में मोर्दकै की स्थिति को स्वाभाविक हिन्दी में दर्शाता है; ב यहाँ 'पर' या 'में' दोनों अर्थ दे सकता है।
- source_word: וְלֹא קָם
  choice: न तो उठा
  rationale: קום यहाँ सम्मान दिखाने के लिए खड़े होने के सामाजिक संकेत को व्यक्त करता है।
- source_word: וְלֹא זָע מִמֶּנּוּ
  choice: न काँपा
  rationale: זוע काँपने, भय से विचलित होने या हिलने का अर्थ दे सकता है। 'न काँपा' मूल की सजीवता और उसकी कुछ अर्थगत व्यापकता को बनाए रखता है।
- source_word: וַיִּמָּלֵא ... חֵמָה
  choice: क्रोध से भर गया
  rationale: मूल की 'भर जाने' वाली रचना और तीव्र रोष दोनों को सहज, गरिमापूर्ण हिन्दी में सुरक्षित रखता है।
- source_word: עַל מָרְדֳּכַי
  choice: मोर्दकै पर
  rationale: क्रोध के साथ עַל उसके लक्ष्य को चिह्नित करता है; हिन्दी में 'मोर्दकै पर क्रोध' स्वाभाविक है।
