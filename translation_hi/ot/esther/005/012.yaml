  yaml_path: translation/ot/esther/005/012.yaml
  text: Then Haman said[a], “Indeed, Queen Esther brought no one with the king to the banquet she prepared except me[b]; and tomorrow also I am invited by her together with the king.”
translation:
  language: hi
  text: तब हामान ने कहा, “और तो और, रानी एस्तेर ने जो भोज तैयार किया था, उसमें राजा के साथ मेरे सिवा किसी और को नहीं बुलाया; और कल भी मुझे उसके द्वारा राजा के साथ बुलाया गया है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ हिन्दी में घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אַף לֹא
  choice: और तो और ... नहीं
  rationale: यह संयोजन हामान के डींग भरे कथन में बल जोड़ता है; यह हिन्दी में उस जोर को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הֵבִיאָה
  choice: बुलाया
  rationale: मूल अर्थ ‘ले आई’ है, पर भोज के प्रसंग में आशय सम्मिलित होने के लिए बुलाने का है; ‘बुलाया’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: אֶסְתֵּר הַמַּלְכָּה
  choice: रानी एस्तेर
  rationale: यह हिन्दी में उपाधि और नाम का स्वाभाविक क्रम है।
- source_word: אֶל הַמִּשְׁתֶּה
  choice: भोज में
  rationale: מִשְׁתֶּה राजकीय दावत या भोज को दर्शाता है; ‘भोज’ गरिमापूर्ण और सामान्य पाठक के लिए सहज है।
- source_word: אֲשֶׁר עָשָׂתָה
  choice: जो ... तैयार किया था
  rationale: शाब्दिक अर्थ ‘जो उसने बनाया’ है; भोज के लिए ‘तैयार किया’ स्वाभाविक हिन्दी है और मेजबानी के प्रसंग को बनाए रखता है।
- source_word: כִּי אִם אוֹתִי
  choice: मेरे सिवा किसी और को नहीं
  rationale: यह अपवाद और विशिष्टता व्यक्त करता है तथा हामान के आत्ममहत्त्वपूर्ण भाव को स्पष्ट रखता है।
- source_word: וְגַם לְמָחָר
  choice: और कल भी
  rationale: यह जोड़ और अगले दिन—दोनों अर्थों को संक्षेप और स्वाभाविक ढंग से सुरक्षित रखता है।
- source_word: קָרוּא לָהּ
  choice: उसके यहाँ आमंत्रित हूँ
  rationale: קָרוּא का शाब्दिक अर्थ ‘बुलाया हुआ’ है, पर भोज के संदर्भ में ‘आमंत्रित’ उचित है; לָהּ को ‘उसके यहाँ’ कहना हिन्दी में मेजबान से संबंध को स्वाभाविक बनाता है।
- source_word: עִם הַמֶּלֶךְ
  choice: राजा के साथ
  rationale: यह हामान की राजा के साथ संयुक्त उपस्थिति को सीधे व्यक्त करता है।
