base_translation:
  language: en
  yaml_path: translation/ot/esther/005/003.yaml
  text: Then the king said to her[a], “What is it[c][b], Queen Esther? And what is your request? Up to half the kingdom—it will be given to you.”
translation:
  language: hi
  text: तब राजा ने उससे कहा, “रानी एस्तेर, क्या बात है?[a] और तुम्हारा निवेदन[b] क्या है? आधे राज्य तक भी, वह तुम्हें दिया जाएगा।”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “रानी एस्तेर, तुम्हें क्या चिंता है?” हिब्रू मुहावरे का शाब्दिक अर्थ है, “तुम्हें क्या है?”
    reason: lexical_alternative
  - marker: b
    text: या, “याचिका।”
    reason: lexical_alternative
  - marker: c
    text: यह उदारता का आश्वासन देने वाली प्रचलित राजकीय अभिव्यक्ति है; इसका अर्थ आवश्यक रूप से राज्य का आधा भाग सचमुच बाँट देने का प्रस्ताव नहीं है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מַה לָּךְ
  choice: क्या बात है?
  rationale: हिब्रू मुहावरे का शाब्दिक अर्थ ‘तुम्हें क्या?’ है। ‘क्या बात है?’ प्रसंग में स्वाभाविक है और अनावश्यक रूप से यह नहीं मानता कि एस्तेर अवश्य व्याकुल थी।
- source_word: אֶסְתֵּר הַמַּלְכָּה
  choice: रानी एस्तेर
  rationale: हिन्दी में उपाधि को नाम से पहले रखना स्वाभाविक है और मूल के नाम तथा राजकीय पद दोनों को बनाए रखता है।
- source_word: בַּקָּשָׁתֵךְ
  choice: तुम्हारा निवेदन
  rationale: בַּקָּשָׁה अनुरोध या याचिका को दर्शाता है; राजदरबार के प्रसंग में ‘निवेदन’ सहज, सम्मानपूर्ण और आधुनिक हिन्दी है।
- source_word: עַד חֲצִי הַמַּלְכוּת
  choice: आधे राज्य तक भी
  rationale: यह राजा की उदार पेशकश की सीमा बताने वाला राजकीय कथन है। यह रूप मूल की अतिशयोक्तिपूर्ण अभिव्यक्ति को बनाए रखता है।
- source_word: וְיִנָּתֵן לָךְ
  choice: वह तुम्हें दे दिया जाएगा
  rationale: निफ़अल अपूर्ण रूप यहाँ निष्क्रिय प्रतिज्ञा व्यक्त करता है। ‘वह’ एस्तेर द्वारा माँगी जाने वाली वस्तु या बात की ओर संकेत करता है।
theological_decisions:
- issue: आधे राज्य की पेशकश का स्वरूप
  choice: मुख्य पाठ में कथन को यथावत रखा और सांस्कृतिक स्पष्टीकरण पादटिप्पणी में दिया
  alternative: इसे मुख्य पाठ में केवल ‘जो माँगोगी, मिलेगा’ जैसा सामान्यीकृत करना
  rationale: मूल की राजकीय अभिव्यक्ति और उसकी संभावित अतिशयोक्ति दोनों सुरक्षित रहने चाहिए; व्याख्या से पाठ को बदलना उचित नहीं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। राजा की वाणी में राजकीय उदारता है, पर अत्यधिक संस्कृतनिष्ठ या पुरातन शब्दावली से बचा गया है।
