  text: אִם מָצָ֨אתִי חֵ֜ן בְּ/עֵינֵ֣י הַ/מֶּ֗לֶךְ וְ/אִם עַל הַ/מֶּ֨לֶךְ֙ ט֔וֹב לָ/תֵת֙ אֶת שְׁאֵ֣לָתִ֔/י וְ/לַ/עֲשׂ֖וֹת אֶת בַּקָּשָׁתִ֑/י יָב֧וֹא הַ/מֶּ֣לֶךְ וְ/הָמָ֗ן אֶל הַ/מִּשְׁתֶּה֙ אֲשֶׁ֣ר אֶֽעֱשֶׂ֣ה לָ/הֶ֔ם וּ/מָחָ֥ר אֶֽעֱשֶׂ֖ה כִּ/דְבַ֥ר הַ/מֶּֽלֶךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/005/008.yaml
  text: If I have found favor in the eyes of the king[a], and if it pleases the king to grant my petition and fulfill my request, let the king and Haman come to the banquet that I will prepare for them[b], and tomorrow I will do according to the king’s word.
translation:
  language: hi
  text: “यदि मुझ पर राजा की कृपादृष्टि हुई है,[a] और यदि राजा को मेरी विनती स्वीकार करना और मेरा निवेदन पूरा करना अच्छा लगे, तो राजा और हामान उस भोज में आएँ जिसे मैं उनके लिए तैयार करूँगी। और कल मैं राजा के कहे के अनुसार करूँगी।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “यदि मैंने राजा की दृष्टि में अनुग्रह पाया है।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָצָאתִי חֵן בְּעֵינֵי
  choice: मुझ पर ... कृपादृष्टि हुई है
  rationale: यह राजदरबार के संदर्भ में अनुग्रहपूर्ण स्वीकृति का स्वाभाविक और गरिमापूर्ण हिन्दी मुहावरा है; पादटिप्पणी अधिक शाब्दिक बिंब को सुरक्षित रखती है।
- source_word: עַל הַמֶּלֶךְ טוֹב
  choice: राजा को ... अच्छा लगे
  rationale: हिब्रू मुहावरे का विनम्र दरबारी भाव बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: לָתֵת אֶת שְׁאֵלָתִי
  choice: मेरी विनती स्वीकार करना
  rationale: शाब्दिक ‘मेरी माँग देना’ की अपेक्षा हिन्दी में स्वाभाविक है और राजकीय निवेदन मंज़ूर करने का अर्थ व्यक्त करता है।
- source_word: וְלַעֲשׂוֹת אֶת בַּקָּשָׁתִי
  choice: मेरा निवेदन पूरा करना
  rationale: ‘करना’ क्रिया का आशय स्वाभाविक हिन्दी में ‘पूरा करना’ से व्यक्त होता है तथा निकटार्थी संज्ञाओं का अंतर भी बना रहता है।
- source_word: שְׁאֵלָתִי / בַּקָּשָׁתִי
  choice: विनती / निवेदन
  rationale: हिब्रू के दो निकटार्थी शब्दों की शैलीगत विविधता को दो अलग, पर स्वाभाविक हिन्दी शब्दों से रखा गया है।
- source_word: יָבֹא
  choice: आएँ
  rationale: इस प्रसंग में अपूर्ण क्रिया का विनम्र इच्छार्थक/अनुरोधात्मक बल है; आदरसूचक बहुवचन हिन्दी राजदरबारी संबोधन के अनुकूल है।
- source_word: הַמִּשְׁתֶּה
  choice: भोज
  rationale: राजकीय दावत के लिए सरल और वर्तमान मानक हिन्दी शब्द; मद्यपान का संभावित घटक अनावश्यक रूप से प्रमुख नहीं किया गया।
- source_word: אֲשֶׁר אֶעֱשֶׂה לָהֶם
  choice: जिसे मैं उनके लिए तैयार करूँगी
  rationale: भोज के साथ हिब्रू ‘करना/बनाना’ का स्वाभाविक हिन्दी समतुल्य ‘तैयार करना’ है।
- source_word: וּמָחָר אֶעֱשֶׂה כִּדְבַר הַמֶּלֶךְ
  choice: और कल मैं राजा के कहे के अनुसार करूँगी
  rationale: यह वाक्यांश की जानबूझकर बनी हुई संक्षिप्तता और अस्पष्टता को सुरक्षित रखता है; इसे ‘अपनी विनती बताऊँगी’ कहकर अधिक स्पष्ट नहीं किया गया।
