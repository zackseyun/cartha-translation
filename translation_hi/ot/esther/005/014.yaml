base_translation:
  language: en
  yaml_path: translation/ot/esther/005/014.yaml
  text: Then Zeresh his wife and all his friends said to him[a], “Let a gallows fifty cubits high be made, and in the morning tell the king to have Mordecai hanged on it. Then go with the king to the banquet rejoicing.” The matter pleased Haman[c][b], and he made the gallows.
translation:
  language: hi
  text: तब उसकी पत्नी जेरेश और उसके सभी मित्रों ने उससे कहा, “पचास हाथ[b] ऊँचा एक लकड़ी का ढाँचा[a] बनवाया जाए। सुबह राजा से कहो कि मोर्दकै को उस पर लटका दिया जाए[c]। फिर आनन्दित होकर राजा के साथ भोज में जाना।” यह बात हामान को अच्छी लगी, और उसने वह लकड़ी का ढाँचा बनवाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “लकड़ी का खम्भा।” इब्रानी शब्द का अर्थ लकड़ी, पेड़, खम्भा या लकड़ी से बनी दण्ड-संरचना हो सकता है; उसका ठीक रूप निश्चित नहीं है।
    reason: lexical_alternative
  - marker: b
    text: पचास हाथ लगभग 75 फुट, या 23 मीटर, होते हैं।
    reason: cultural_note
  - marker: c
    text: या “मोर्दकै को उस पर बेधकर चढ़ा दिया जाए।” इब्रानी अभिव्यक्ति लकड़ी की संरचना पर लटकाने अथवा उस पर बेधकर चढ़ाने के लिए प्रयुक्त हो सकती है; दण्ड देने की ठीक विधि विवादित है।
    reason: alternative_reading
lexical_decisions:
- source_word: אֹהֲבָיו
  choice: उसके सभी मित्रों
  rationale: शाब्दिक अर्थ ‘उससे प्रेम रखनेवाले’ है, पर दरबारी प्रसंग में यह हामान के मित्रों अथवा निकट सहयोगियों को दर्शाता है; ‘मित्रों’ सहज आधुनिक हिन्दी है।
- source_word: יַעֲשׂוּ
  choice: बनवाया जाए
  rationale: अनिर्दिष्ट बहुवचन यहाँ परामर्श या प्रस्ताव व्यक्त करता है। हिन्दी का भाववाच्य रूप कर्ता को अनिर्दिष्ट रखते हुए स्वाभाविक है।
- source_word: עֵץ
  choice: लकड़ी का ढाँचा
  rationale: עֵץ का अर्थ लकड़ी, पेड़, खम्भा या लकड़ी की दण्ड-संरचना हो सकता है। ‘लकड़ी का ढाँचा’ सटीक आकार अथवा फाँसी की आधुनिक संरचना मान लेने से बचता है।
- source_word: גָּבֹהַּ חֲמִשִּׁים אַמָּה
  choice: पचास हाथ ऊँचा
  rationale: ‘हाथ’ प्राचीन अम्मा के लिए हिन्दी बाइबलीय माप-शब्द है और मूल इकाई को बनाए रखता है।
- source_word: וְיִתְלוּ אֶת־מָרְדֳּכַי עָלָיו
  choice: मोर्दकै को उस पर लटका दिया जाए
  rationale: अनिर्दिष्ट बहुवचन और राजकीय अनुमति के आशय को भाववाच्य रूप में रखा गया है। ‘लटकाना’ मूल क्रिया का सामान्य अर्थ है; बेधकर चढ़ाने की सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: מִשְׁתֶּה
  choice: भोज
  rationale: राजकीय दावत के प्रसंग में ‘भोज’ संक्षिप्त, प्रतिष्ठित और सामान्य आधुनिक हिन्दी है।
- source_word: שָׂמֵחַ
  choice: आनन्दित होकर
  rationale: विशेषण यहाँ क्रियाविशेषणवत् हामान की प्रसन्न अवस्था बताता है; ‘आनन्दित होकर’ इस भाव को स्पष्ट रखता है।
- source_word: וַיִּיטַב הַדָּבָר לִפְנֵי הָמָן
  choice: यह बात हामान को अच्छी लगी
  rationale: यह हिब्रू मुहावरे का सीधा और स्वाभाविक हिन्दी समतुल्य है।
- source_word: וַיַּעַשׂ הָעֵץ
  choice: उसने वह लकड़ी का ढाँचा बनवाया
  rationale: हिब्रू में शाब्दिक रूप से ‘उसने बनाया’ है, पर इतने बड़े निर्माण के प्रसंग में हिन्दी ‘बनवाया’ हामान की व्यवस्था और उत्तरदायित्व को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: दण्ड देने की संरचना और विधि की अनिश्चितता
  choice: मुख्य पाठ में ‘लकड़ी का ढाँचा’ और ‘लटका दिया जाए’
  alternative: ‘फाँसी का तख्ता’ और ‘बेधकर चढ़ा दिया जाए’
  rationale: हिब्रू עֵץ और תלה संरचना तथा निष्पादन की ठीक विधि निश्चित नहीं करते। मुख्य पाठ व्यापक अर्थ रखता है और सम्भव वैकल्पिक विधि पादटिप्पणी में देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण कथात्मक शैली। ‘फाँसी का तख्ता’ से जुड़ी आधुनिक संरचना को मूल पर आरोपित न करते हुए ‘लकड़ी का ढाँचा’ चुना गया है। प्राचीन माप ‘पचास हाथ’ मुख्य पाठ में रखा गया; लगभग 23 मीटर की व्याख्या जोड़ी नहीं गई क्योंकि उसके लिए पृथक चिह्न मुख्य पाठ में देना पड़ता और उपलब्ध अंग्रेज़ी पादटिप्पणी-चिह्नों का स्थान असंगत था।
