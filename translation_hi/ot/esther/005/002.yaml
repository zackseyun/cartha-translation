  text: וַ/יְהִי֩ כִ/רְא֨וֹת הַ/מֶּ֜לֶךְ אֶת אֶסְתֵּ֣ר הַ/מַּלְכָּ֗ה עֹמֶ֨דֶת֙ בֶּֽ/חָצֵ֔ר נָשְׂאָ֥ה חֵ֖ן בְּ/עֵינָ֑י/ו וַ/יּ֨וֹשֶׁט הַ/מֶּ֜לֶךְ לְ/אֶסְתֵּ֗ר אֶת שַׁרְבִ֤יט הַ/זָּהָב֙ אֲשֶׁ֣ר בְּ/יָד֔/וֹ וַ/תִּקְרַ֣ב אֶסְתֵּ֔ר וַ/תִּגַּ֖ע בְּ/רֹ֥אשׁ הַ/שַּׁרְבִֽיט־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/esther/005/002.yaml
  text: And when the king saw Esther the queen standing in the court[a], she found favor in his sight, and the king extended to Esther the golden scepter that was in his hand[c][b]. Then Esther came near and touched the top of the scepter.
translation:
  language: hi
  text: जब राजा ने रानी एस्तेर को आँगन[a] में खड़ी देखा, तो उसने राजा की कृपादृष्टि पाई[b]। राजा ने एस्तेर की ओर अपने हाथ में जो सोने का राजदंड था, उसे बढ़ाया। तब एस्तेर पास आई और राजदंड के ऊपरी सिरे[c] को छुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “प्रांगण में।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उसने उसकी आँखों में अनुग्रह पाया,” अर्थात राजा ने उस पर अनुकूल दृष्टि की।
    reason: lexical_alternative
  - marker: c
    text: या “राजदंड की नोक को।” इब्रानी में, “राजदंड के सिर को।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִרְאוֹת
  choice: जब ... देखा
  rationale: यह रचना कथा में समयसूचक उपवाक्य आरम्भ करती है। हिंदी में “जब” स्वाभाविक रूप से घटनाक्रम को आगे बढ़ाता है; “और ऐसा हुआ कि” अनावश्यक रूप से बोझिल होता।
- source_word: אֶסְתֵּר הַמַּלְכָּה
  choice: रानी एस्तेर
  rationale: यद्यपि इब्रानी में नाम के बाद पदवी है, आधुनिक हिंदी में “रानी एस्तेर” अधिक स्वाभाविक और स्पष्ट है।
- source_word: עֹמֶדֶת בֶּחָצֵר
  choice: राजमहल के आँगन में खड़ी
  rationale: חָצֵר किसी घेरे हुए खुले प्रांगण या आँगन को दर्शा सकता है। राजमहल का संदर्भ जोड़ने से स्थान स्पष्ट होता है और इसे राजसभा समझे जाने की आशंका घटती है।
- source_word: נָשְׂאָה חֵן בְּעֵינָיו
  choice: उसने राजा की कृपादृष्टि पाई
  rationale: यह इब्रानी मुहावरा राजा की अनुकूल स्वीकृति को व्यक्त करता है। “कृपादृष्टि पाई” मूल के दृष्टि-संबंधी रूपक को बनाए रखते हुए गरिमापूर्ण हिंदी देता है।
- source_word: וַיּוֹשֶׁט
  choice: की ओर बढ़ाया
  rationale: क्रिया किसी वस्तु को सामने वाले की ओर फैलाने या बढ़ाने का भाव देती है।
- source_word: שַׁרְבִיט הַזָּהָב
  choice: सोने का राजदंड
  rationale: शाही अधिकार के इस चिह्न के लिए आधुनिक हिंदी में “राजदंड” स्पष्ट और उपयुक्त है; הַזָּהָב उसकी स्वर्ण सामग्री बताता है।
- source_word: אֲשֶׁר בְּיָדוֹ
  choice: अपने हाथ में पकड़ा
  rationale: मूल सापेक्ष उपवाक्य का अर्थ स्वाभाविक हिंदी विशेषण-वाक्यांश से व्यक्त किया गया है।
- source_word: וַתִּקְרַב
  choice: तब एस्तेर पास आई
  rationale: यह राजा के संकेत के उत्तर में एस्तेर के निकट आने को दर्शाता है; “तब” कथा का क्रम स्पष्ट करता है।
- source_word: וַתִּגַּע בְּרֹאשׁ הַשַּׁרְבִיט
  choice: राजदंड के ऊपरी सिरे को छुआ
  rationale: רֹאשׁ का मूल अर्थ “सिर” है, पर किसी दंड के लिए हिंदी में “ऊपरी सिरा” स्वाभाविक है और “नोक” की अपेक्षा आकार को कम निश्चित करता है।
