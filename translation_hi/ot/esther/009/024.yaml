base_translation:
  language: en
  yaml_path: translation/ot/esther/009/024.yaml
  text: For Haman son of Hammedatha the Agagite[a], the enemy of all the Jews, had plotted against the Jews to destroy them, and had cast Pur—that is[b], the lot—to crush them and to destroy them.
translation:
  language: hi
  text: क्योंकि हम्मदाता का पुत्र अगागी हामान, जो सभी यहूदियों का शत्रु था, यहूदियों का नाश करने के लिए उनके विरुद्ध षड्यंत्र रच चुका था और उन्हें घबरा देने और उनका नाश करने के लिए पूर—अर्थात् चिट्ठी[a]—डाल चुका था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “पूर” एक आगंतुक शब्द है, जिसकी व्याख्या इसी पद में “चिट्ठी” के रूप में की गई है। इसे बनाए रखने से आसपास के पदों में आए “पुरिम” नाम से इसका संबंध स्पष्ट रहता है। “उन्हें घबरा देने” का अनुवाद “उन्हें भ्रमित करने” या “उन्हें अस्त-व्यस्त करने” भी हो सकता है।
    reason: cultural_note_and_lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन के लिए व्याख्यात्मक आधार प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הָמָן בֶּן הַמְּדָתָא הָאֲגָגִי
  choice: हम्मदाता का पुत्र अगागी हामान
  rationale: व्यक्तिनामों का लिप्यंतरण किया गया है और ‘अगागी’ को वंशीय अथवा जातीय उपाधि के रूप में बनाए रखा गया है।
- source_word: צֹרֵר כָּל הַיְּהוּדִים
  choice: जो सब यहूदियों का शत्रु था
  rationale: कृदंत यहाँ निरंतर विरोधी भूमिका बताता है; संबंधवाचक वाक्य हिन्दी में स्पष्ट और सहज है।
- source_word: חָשַׁב עַל הַיְּהוּדִים
  choice: यहूदियों के विरुद्ध षड्यंत्र रच चुका था
  rationale: क्रिया और संबंधसूचक पद मिलकर दुर्भावनापूर्ण योजना व्यक्त करते हैं; ‘षड्यंत्र रचना’ इस संदर्भ के अनुकूल है।
- source_word: לְאַבְּדָם
  choice: उनका नाश करने के लिए
  rationale: हिफ़ील रूप विनाश कराने को व्यक्त करता है; ‘नाश करना’ प्रबल, स्पष्ट और गरिमापूर्ण हिन्दी है।
- source_word: וְהִפִּיל פּוּר
  choice: उसने पूर ... डाली थी
  rationale: फ़ारसी आगंतुक शब्द ‘पूर’ को पुरिम नाम से संबंध बनाए रखने के लिए ज्यों का त्यों रखा गया है; हिन्दी मुहावरे में चिट्ठी ‘डाली’ जाती है।
- source_word: הוּא הַגּוֹרָל
  choice: अर्थात चिट्ठी
  rationale: मूल पाठ स्वयं ‘पूर’ की व्याख्या करता है। ‘चिट्ठी’ यहाँ निर्णय के लिए डाले जाने वाले lot का स्वाभाविक हिन्दी रूप है।
- source_word: לְהֻמָּם
  choice: उन्हें आतंकित करने
  rationale: המם के अर्थक्षेत्र में घबराहट, व्याकुलता और भ्रम उत्पन्न करना शामिल है। ‘आतंकित करना’ संदर्भगत हिंसक उद्देश्य को व्यक्त करता है, पर वैकल्पिक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וּלְאַבְּדָם
  choice: और उनका नाश करने
  rationale: मूल की पुनरावृत्ति को रखा गया है, जिससे हामान के उद्देश्य की तीव्रता बनी रहती है।
