  text: וַ/תֹּ֤אמֶר אֶסְתֵּר֙ אִם עַל הַ/מֶּ֣לֶךְ ט֔וֹב יִנָּתֵ֣ן גַּם מָחָ֗ר לַ/יְּהוּדִים֙ אֲשֶׁ֣ר בְּ/שׁוּשָׁ֔ן לַ/עֲשׂ֖וֹת כְּ/דָ֣ת הַ/יּ֑וֹם וְ/אֵ֛ת עֲשֶׂ֥רֶת בְּנֵֽי הָמָ֖ן יִתְל֥וּ עַל הָ/עֵֽץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/013.yaml
  text: Esther said[a], “If it pleases the king, let it be granted to the Jews who are in Susa to do tomorrow also according to today’s decree, and let Haman’s ten sons be hanged on the gallows.”
translation:
  language: hi
  text: एस्तेर ने कहा, “यदि राजा को अच्छा लगे, तो शूशन में रहनेवाले यहूदियों को यह अनुमति दी जाए कि वे कल भी आज की राजाज्ञा के अनुसार कार्य करें, और हामान के दसों बेटों को लकड़ी के ढाँचे पर लटका दिया जाए।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “पेड़/लकड़ी पर” है। यह लकड़ी की दंड-संरचना, खंभे, या फाँसी के तख्ते का संकेत हो सकता है; निष्पादन की सटीक विधि स्पष्ट नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם עַל־הַמֶּלֶךְ טוֹב
  choice: यदि राजा को अच्छा लगे
  rationale: यह राजदरबार की विनम्र स्वीकृति-सूचक उक्ति है; यह हिंदी में स्वाभाविक रहते हुए शाब्दिक भाव को भी बनाए रखती है।
- source_word: יִנָּתֵן
  choice: यह अनुमति दी जाए
  rationale: निष्क्रिय इच्छार्थक रूप राजकीय स्वीकृति के लिए किए गए अनुरोध को व्यक्त करता है।
- source_word: גַּם מָחָר
  choice: कल भी
  rationale: यह आज मिली अनुमति को अगले दिन तक बढ़ाने पर बल देता है।
- source_word: לַיְּהוּדִים אֲשֶׁר בְּשׁוּשָׁן
  choice: शूशन में रहनेवाले यहूदियों को
  rationale: यह लाभार्थी कारक और इब्रानी संबंधवाचक उपवाक्य, दोनों को सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: לַעֲשׂוֹת כְּדָת הַיּוֹם
  choice: आज की राजाज्ञा के अनुसार करें
  rationale: दָּת एस्तेर में प्रायः आधिकारिक राजकीय आदेश है; क्रिया को इब्रानी की तरह व्यापक रखा गया है, ताकि कार्य को अनावश्यक रूप से विशिष्ट न बनाया जाए।
- source_word: עֲשֶׂרֶת בְּנֵי הָמָן
  choice: हामान के दसों बेटों
  rationale: सम्बन्ध-रचना को स्वाभाविक हिंदी में व्यक्त किया गया है; ‘दसों’ निश्चित दस व्यक्तियों की संपूर्ण संख्या दर्शाता है।
- source_word: יִתְלוּ עַל־הָעֵץ
  choice: काठ पर लटका दिया जाए
  rationale: תלה का मूल अर्थ ‘लटकाना’ है और עֵץ पेड़, लकड़ी, खंभे या लकड़ी की दंड-संरचना को सूचित कर सकता है। ‘काठ’ मूल की व्यापकता को ‘फाँसी का तख्ता’ की अपेक्षा अधिक सुरक्षित रखता है।
theological_decisions:
- issue: हामान के बेटों को लटकाने की विधि
  choice: काठ पर लटका दिया जाए
  alternative: फाँसी के तख्ते पर लटका दिया जाए; खंभे पर टाँग दिया जाए
  rationale: इब्रानी पद निष्पादन या शव-प्रदर्शन की सटीक विधि स्पष्ट नहीं करता। मुख्य पाठ में व्यापक शब्द और पादटिप्पणी में संभावनाएँ देकर वास्तविक अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘राजाज्ञा’ फारसी दरबार के औपचारिक संदर्भ को व्यक्त करती है। पादटिप्पणी-चिह्न संबंधित वाक्य के अंत में रखा गया है।
