base_translation:
  language: en
  yaml_path: translation/ot/esther/009/002.yaml
  text: The Jews assembled in their cities throughout all the provinces of King Ahasuerus to lay hands on those seeking their harm[a], and no one could stand before them[c][b], because the fear of them had fallen on all the peoples.
translation:
  language: hi
  text: यहूदी राजा क्षयर्ष के सभी प्रान्तों में अपने-अपने नगरों में इकट्ठे हुए, ताकि उन लोगों के विरुद्ध हाथ उठाएँ जो उनकी हानि चाहते थे[a]। कोई भी उनके सामने टिक न सका[b], क्योंकि उनका भय सभी जाति-समुदायों पर छा गया था[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उन लोगों पर आक्रमण करें जो उनकी हानि चाहते थे’; इब्रानी मुहावरे का शाब्दिक अर्थ है ‘किसी के विरुद्ध हाथ बढ़ाना’।
    reason: lexical_alternative
  - marker: b
    text: या ‘कोई भी उनका सामना न कर सका’।
    reason: lexical_alternative
  - marker: c
    text: ‘जाति-समुदायों’ से सम्भवतः साम्राज्य में रहने वाले विभिन्न जातीय समूह और जनसमुदाय अभिप्रेत हैं, न कि केवल एक राष्ट्र।
    reason: cultural_note
lexical_decisions:
- source_word: נִקְהֲלוּ
  choice: इकट्ठे हुए
  rationale: निफ़अल रूप सामूहिक रूप से एकत्र होने को व्यक्त करता है; यह सहज आधुनिक हिन्दी है।
- source_word: בְּעָרֵיהֶם
  choice: अपने-अपने नगरों में
  rationale: सर्वनाम-सूचक प्रत्यय और विभिन्न प्रान्तों में वितरित नगरों का भाव हिन्दी में ‘अपने-अपने’ से स्पष्ट होता है।
- source_word: בְּכָל מְדִינוֹת הַמֶּלֶךְ אֳחַשְׁוֵרוֹשׁ
  choice: राजा क्षयर्ष के सभी प्रान्तों में
  rationale: מְדִינוֹת फ़ारसी साम्राज्य की प्रशासनिक इकाइयाँ हैं; ‘प्रान्त’ इसका स्वाभाविक समतुल्य है।
- source_word: לִשְׁלֹחַ יָד
  choice: हाथ डालें
  rationale: इब्रानी मुहावरे की हस्तक्षेप/आक्रमण की छवि बनाए रखता है; प्रसंग में इसका शत्रुतापूर्ण अर्थ स्पष्ट है और पादटिप्पणी विकल्प बताती है।
- source_word: בִּמְבַקְשֵׁי רָעָתָם
  choice: उन लोगों पर ... जो उनकी हानि चाहते थे
  rationale: शाब्दिक रूप से ‘उनकी बुराई/हानि चाहने वालों’ का सक्रिय शत्रुतापूर्ण आशय सहज हिन्दी में सुरक्षित है।
- source_word: וְאִישׁ לֹא עָמַד לִפְנֵיהֶם
  choice: कोई भी उनके सामने टिक न सका
  rationale: शाब्दिक ‘उनके सामने खड़ा न हुआ’ यहाँ विरोध में टिक सकने की सामर्थ्य का मुहावरा है; ‘कोई भी’ सामान्य संदर्भ में स्वाभाविक है।
- source_word: כִּי נָפַל פַּחְדָּם
  choice: क्योंकि उनका भय ... छा गया था
  rationale: नָפַל की रूपकात्मक गति को हिन्दी में स्वाभाविक ‘छा गया’ से व्यक्त किया गया है, जबकि व्यापक भय का भाव बना रहता है।
- source_word: עַל כָּל הָעַמִּים
  choice: सभी जाति-समुदायों पर
  rationale: बहुवचन עַמִּים साम्राज्य के विभिन्न जनसमूहों को सूचित करता है, न कि केवल एक राष्ट्र या जनता को।
- source_word: אֳחַשְׁוֵרוֹשׁ
  choice: क्षयर्ष
  rationale: हिन्दी बाइबल परम्परा में प्रचलित नाम-रूप अपनाया गया है।
