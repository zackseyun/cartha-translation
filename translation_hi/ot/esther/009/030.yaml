id: EST.9.30
reference: Esther 9:30
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֨ח סְפָרִ֜ים אֶל כָּל הַ/יְּהוּדִ֗ים אֶל שֶׁ֨בַע וְ/עֶשְׂרִ֤ים וּ/מֵאָה֙ מְדִינָ֔ה מַלְכ֖וּת אֲחַשְׁוֵר֑וֹשׁ דִּבְרֵ֥י שָׁל֖וֹם וֶ/אֱמֶֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/030.yaml
  text: And he sent letters to all the Jews in the one hundred twenty-seven provinces of the kingdom of Ahasuerus[a], words of peace and truth[c][b],
translation:
  language: hi
  text: और उसने अहशवेरोश[a] के राज्य के एक सौ सत्ताईस प्रान्तों में रहने वाले सभी यहूदियों के पास पत्र भेजे, जिनमें शान्ति और सच्चाई[b] की बातें[c] थीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अहशवेरोश राजकीय नाम का इब्रानी रूप है; कुछ विद्वान ऐतिहासिक रूप से उसकी पहचान क्षयर्ष प्रथम से करते हैं।
    reason: cultural_note
  - marker: b
    text: यहाँ ‘सच्चाई’ का अर्थ ‘विश्वसनीयता’ या ‘निष्ठा’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में शाब्दिक रूप से ‘शान्ति और सच्चाई की बातें’ है; इसका अनुवाद ‘शान्ति और सच्चाई का सन्देश’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: और उसने ... भेजे
  rationale: वय्यिक्तोल कथानक को आगे बढ़ाता है। हिन्दी में ‘और उसने ... भेजे’ मूल के क्रम और कर्ता के पुल्लिंग एकवचन रूप को बनाए रखता है; कर्ता का नाम इस पद में स्पष्ट न होने के कारण जोड़ा नहीं गया।
- source_word: סְפָרִים
  choice: पत्र
  rationale: फारसी साम्राज्य के प्रशासनिक प्रसंग में यह शब्द भेजे गए लिखित संदेशों को दर्शाता है; ‘पत्र’ सहज और सटीक हिन्दी है।
- source_word: אֶל כָּל הַיְּהוּדִים
  choice: सभी यहूदियों के पास
  rationale: यह सामूहिक रूप से पूरे साम्राज्य में रहने वाले यहूदियों को संकेत करता है। ‘के पास’ पत्र भेजने के लक्ष्य को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֶל שֶׁבַע וְעֶשְׂרִים וּמֵאָה מְדִינָה
  choice: एक सौ सत्ताईस प्रान्तों में रहने वाले
  rationale: दूसरा אֶל प्राप्तकर्ताओं के भौगोलिक विस्तार को बताता है। यह रूप स्पष्ट करता है कि पत्र प्रान्तों को नहीं, उनमें रहने वाले यहूदियों को भेजे गए थे।
- source_word: מְדִינָה
  choice: प्रान्त
  rationale: एस्तेर में यह फारसी साम्राज्य के प्रशासनिक क्षेत्रों का सामान्य पद है; आधुनिक हिन्दी में ‘प्रान्त’ स्पष्ट और प्रतिष्ठित समतुल्य है।
- source_word: מַלְכוּת אֲחַשְׁוֵרוֹשׁ
  choice: अहशवेरोश के राज्य
  rationale: यह इब्रानी सम्बन्धसूचक पदबंध का सीधा और स्वाभाविक अनुवाद है; मूल में यहाँ ‘राजा’ शब्द न होने के कारण उसे नहीं जोड़ा गया।
- source_word: אֲחַשְׁוֵרוֹשׁ
  choice: अहशवेरोश
  rationale: इब्रानी राजकीय नाम का देवनागरी लिप्यन्तरण रखा गया है; ऐतिहासिक पहचान को मुख्य पाठ में प्रतिस्थापित नहीं किया गया।
- source_word: דִּבְרֵי שָׁלוֹם וֶאֱמֶת
  choice: शान्ति और सच्चाई की बातें
  rationale: यह मूल पदबंध के ‘बातें/वचन’, ‘शान्ति’ और ‘सच्चाई’—तीनों घटकों को सुरक्षित रखता है। हिन्दी वाक्य को स्वाभाविक बनाने के लिए इन्हें पत्रों की विषयवस्तु के रूप में व्यक्त किया गया है।
