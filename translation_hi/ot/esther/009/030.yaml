translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘जिनमें ... बातें थीं’ मूल के संक्षिप्त पदबंध को हिन्दी में पूर्ण वाक्य बनाता है, जबकि [c] में उसकी शाब्दिक संरचना सुरक्षित की गई है।
