    issue: Plural agreement in the final passive verb
    rationale: “हामान के दसों पुत्रों” is plural, so standard Hindi requires “लटका दिए गए,” not singular “लटका दिया गया.”
  - severity: low
    issue: Plural agreement in the footnote alternative
    rationale: The alternative describes the ten sons and should read “खंभे पर टाँग दिए गए.”
