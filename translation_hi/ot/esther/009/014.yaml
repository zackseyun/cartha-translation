base_translation:
  language: en
  yaml_path: translation/ot/esther/009/014.yaml
  text: So the king said that it should be done so. A decree was issued in Susa[a], and the ten sons of Haman were hanged.
translation:
  language: hi
  text: तब राजा ने कहा कि ऐसा ही किया जाए। शूशन में एक राजाज्ञा जारी की गई, और हामान के दसों पुत्रों को लटका दिए गए[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “खंभे पर टाँग दिए गए।” हिब्रू क्रिया किसी शव को खूंटे या खंभे पर लटकाने का संकेत दे सकती है; इसका अर्थ आवश्यक रूप से आधुनिक ढंग से गले में फंदा लगाकर फाँसी देना नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ने कहा
  rationale: אמר का सामान्य अर्थ ‘कहना’ है। प्रसंग में यह एस्तेर के निवेदन पर राजा की स्वीकृति व्यक्त करता है; ‘आज्ञा दी’ कहना मूल क्रिया से अधिक स्पष्ट औपचारिकता जोड़ देता।
- source_word: לְהֵעָשׂוֹת כֵּן
  choice: कि ऐसा ही किया जाए
  rationale: यह हिंदी में स्वाभाविक रूप से मूल के निष्क्रिय भाव और כֵּן के ‘ऐसा ही’ अर्थ को बनाए रखता है।
- source_word: וַתִּנָּתֵן דָּת
  choice: एक राजाज्ञा जारी की गई
  rationale: נתן + דת फारसी-कालीन प्रशासनिक प्रयोग है। ‘राजाज्ञा जारी की गई’ प्रसंगानुकूल और सामान्य हिंदी में स्पष्ट है।
- source_word: בְּשׁוּשָׁן
  choice: शूशन में
  rationale: हिंदी बाइबलीय परंपरा में इस स्थान-नाम का प्रचलित रूप ‘शूशन’ है और यह हिब्रू שׁוּשָׁן को निकटता से दर्शाता है।
- source_word: עֲשֶׂרֶת בְּנֵי הָמָן
  choice: हामान के दसों पुत्रों
  rationale: सम्पूर्ण दस की निश्चित संख्या को हिंदी में स्वाभाविक रूप से ‘दसों पुत्रों’ कहा गया है।
- source_word: תָּלוּ
  choice: लटका दिया गया
  rationale: תלה का अर्थ किसी शरीर को पेड़, खंभे या खूंटे पर लटकाना हो सकता है। ‘लटका दिया गया’ आधुनिक अर्थ में केवल गले में फंदा लगाकर फाँसी देने का अनावश्यक निष्कर्ष नहीं निकालता।
