base_translation:
  language: en
  yaml_path: translation/ot/esther/009/031.yaml
  text: to establish these days of Purim at their appointed times[a], just as Mordecai the Jew and Esther the queen had established for them[b], and just as they had established for themselves and for their offspring the matters of the fasts and their cry.
translation:
  language: hi
  text: पूरीम के इन दिनों के पालन को उनके नियत समयों पर ठहराने के लिए[a]—जैसा यहूदी मोर्दकै और रानी एस्तेर ने उनके लिए ठहराया था, और जैसा उन्होंने उपवासों और उनकी पुकार[b] से संबंधित बातों को अपने और अपने वंशजों के लिए स्वीकार किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ठहराने’ के स्थान पर ‘स्थिर करने’ या ‘पुष्टि करने’ का अनुवाद भी सम्भव है। इस पद में बार-बार आया इब्रानी क्रिया-रूप इन दिनों के पालन को औपचारिक रूप से ठहराने या अनुमोदित करने का भाव रखता है।
    reason: lexical_alternative
  - marker: b
    text: ‘पुकार’ का अनुवाद ‘दुहाई’ या ‘विलाप’ भी हो सकता है। सम्भवतः यह उपवासों के साथ की गई समुदाय की तीव्र पुकार को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְקַיֵּם
  choice: मनाना निश्चित करने के लिए
  rationale: पिएल रूप यहाँ पूरीम के पर्व-दिनों के औपचारिक निर्धारण या पुष्टि का भाव देता है। केवल ‘मनाने’ से संस्थापन का भाव छूट जाता, जबकि यह संयुक्त अभिव्यक्ति स्वाभाविक हिन्दी में दोनों पहलुओं को रखती है।
- source_word: יְמֵי הַפֻּרִים הָאֵלֶּה
  choice: पूरीम के इन दिनों
  rationale: निर्देशक ‘इन’ को बनाए रखते हुए पहले से चर्चित विशिष्ट पर्व-दिनों का सीधा अनुवाद।
- source_word: בִּזְמַנֵּיהֶם
  choice: उनके नियत समयों पर
  rationale: זְמָן निर्धारित समय को सूचित करता है; बहुवचन ‘समयों’ मूल रूप और दोनों पर्व-दिनों के नियत अवसरों को सुरक्षित रखता है।
- source_word: כַּאֲשֶׁר קִיַּם עֲלֵיהֶם
  choice: जैसा ... ने उनके लिए निश्चित किया था
  rationale: עַל के बंधनकारी भाव को ‘उन पर थोप दिया’ जैसी अनावश्यक कठोरता के बिना व्यक्त करता है।
- source_word: מָרְדֳּכַי הַיְּהוּדִי
  choice: यहूदी मोर्दकै
  rationale: हिन्दी में स्वाभाविक विशेषण-क्रम रखते हुए जातीय पहचान को स्पष्ट करता है।
- source_word: אֶסְתֵּר הַמַּלְכָּה
  choice: रानी एस्तेर
  rationale: मूल की उपाधि को स्वाभाविक आधुनिक हिन्दी क्रम में प्रस्तुत करता है।
- source_word: וְכַאֲשֶׁר קִיְּמוּ עַל נַפְשָׁם וְעַל זַרְעָם
  choice: और जैसा उन्होंने अपने और अपने वंशजों के लिए ... स्वीकार किया था
  rationale: ‘अपने प्राणों पर’ का शब्दशः रूप हिन्दी में भ्रामक होता; यहाँ भाव स्वयं और भावी वंशजों के लिए दायित्व ग्रहण करने का है।
- source_word: זַרְעָם
  choice: अपने वंशजों
  rationale: सामूहिक זֶרַע के पीढ़ीगत अर्थ को स्पष्ट और स्वाभाविक हिन्दी में देता है।
- source_word: דִּבְרֵי הַצֹּמוֹת וְזַעֲקָתָם
  choice: उपवासों और अपनी पुकार के विषय में
  rationale: דִּבְרֵי को प्रशासनिक अर्थ ‘विषय/बातें’ में लिया गया है। זַעֲקָה की तीव्र पुकार को ‘प्रार्थना’ या ‘विलाप’ तक सीमित नहीं किया गया।
theological_decisions:
- issue: उपवास और पुकार का स्वरूप
  choice: ‘पुकार’ रखा गया
  alternative: ‘विलाप’ या ‘प्रार्थना’
  rationale: मूल זַעֲקָה तीव्र सामुदायिक पुकार को दर्शाता है, पर यह अपने आप में केवल शोक या केवल प्रार्थना निर्धारित नहीं करता; इसलिए मूल की व्यापकता सुरक्षित रखी गई।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। पद मूल में उद्देश्यसूचक infinitive से आरम्भ होकर पिछले वाक्य से जुड़ता है, इसलिए हिन्दी में ‘करने के लिए’ संरचना सुरक्षित रखी गई।
