lexical_decisions:
- source_word: לְקַיֵּם עֲלֵיהֶם
  choice: उन पर यह ठहराने के लिए
  rationale: यह वाक्यांश समुदाय के लिए किसी वार्षिक पालन को बाध्यकारी रूप से स्थापित करने का भाव देता है। ‘उन पर’ עֲלֵיהֶם की दायित्वसूचक शक्ति को बनाए रखता है, और ‘ठहराने’ से प्रशासनिक संदर्भ स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: לִהְיוֹת עֹשִׂים
  choice: कि वे ... मनाएँ
  rationale: शाब्दिक अर्थ ‘करते रहें’ है, पर पर्व अथवा स्मृति-दिवसों के संदर्भ में आधुनिक हिन्दी में ‘दिन मनाना’ सबसे स्वाभाविक है और नियमित पालन का भाव व्यक्त करता है।
- source_word: אֵת יוֹם אַרְבָּעָה עָשָׂר לְחֹדֶשׁ אֲדָר
  choice: अदार महीने के चौदहवें दिन
  rationale: यह इब्रानी तिथि-विन्यास का स्पष्ट और प्रचलित हिन्दी रूप है।
- source_word: וְאֵת יוֹם חֲמִשָּׁה עָשָׂר בּוֹ
  choice: और उसी महीने के पंद्रहवें दिन को
  rationale: בּוֹ पहले बताए गए अदार महीने की ओर संकेत करता है; ‘उसी महीने’ हिन्दी में संदर्भ को अस्पष्ट हुए बिना स्वाभाविक रूप से स्पष्ट करता है।
- source_word: בְּכָל שָׁנָה וְשָׁנָה
  choice: साल-दर-साल
  rationale: इब्रानी में ‘वर्ष’ की पुनरावृत्ति वितरणात्मक बल देकर हर वर्ष निरंतर पालन को दर्शाती है। ‘साल-दर-साल’ हिन्दी में उसी बल को स्वाभाविक ढंग से संप्रेषित करता है।
