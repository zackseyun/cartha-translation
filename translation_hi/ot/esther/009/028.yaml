  text: וְ/הַ/יָּמִ֣ים הָ֠/אֵלֶּה נִזְכָּרִ֨ים וְ/נַעֲשִׂ֜ים בְּ/כָל דּ֣וֹר וָ/ד֗וֹר מִשְׁפָּחָה֙ וּ/מִשְׁפָּחָ֔ה מְדִינָ֥ה וּ/מְדִינָ֖ה וְ/עִ֣יר וָ/עִ֑יר וִ/ימֵ֞י הַ/פּוּרִ֣ים הָ/אֵ֗לֶּה לֹ֤א יַֽעַבְרוּ֙ מִ/תּ֣וֹךְ הַ/יְּהוּדִ֔ים וְ/זִכְרָ֖/ם לֹא יָס֥וּף מִ/זַּרְעָֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/028.yaml
  text: And these days are remembered and observed in every generation[a], every family, every province, and every city; and these days of Purim shall not pass away from among the Jews[c][b], and their remembrance shall not cease from their offspring.
translation:
  language: hi
  text: और ये दिन हर पीढ़ी, हर परिवार, हर प्रान्त और हर नगर में स्मरण किए और मनाए जाएँ[a]। पूरीम के ये दिन यहूदियों के बीच से कभी लुप्त न हों, और उनकी सन्तान में इनका स्मरण कभी समाप्त न हो[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “स्मरण किए और किए जाएँ।” यहाँ “किए जाएँ” का अर्थ पर्व को व्यवहार में मनाना है।
    reason: lexical_alternative
  - marker: b
    text: या, “उनके वंशजों में इनकी स्मृति कभी मिट न जाए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: נִזְכָּרִים וְנַעֲשִׂים
  choice: स्मरण किए और मनाए जाएँ
  rationale: निफ़अल रूप נִזְכָּרִים इन दिनों को स्मरण रखने का भाव देता है, जबकि נַעֲשִׂים का शाब्दिक अर्थ ‘किए जाएँ’ है और यहाँ पर्व को व्यवहार में मनाने की ओर संकेत करता है।
- source_word: בְּכָל דּוֹר וָדוֹר מִשְׁפָּחָה וּמִשְׁפָּחָה מְדִינָה וּמְדִינָה וְעִיר וָעִיר
  choice: हर पीढ़ी, हर परिवार, हर प्रान्त और हर नगर में
  rationale: दोहराए गए एकवचन संज्ञा-पदों का वितरणात्मक बल ‘हर’ द्वारा स्वाभाविक हिन्दी में सुरक्षित रहता है।
- source_word: יְמֵי הַפּוּרִים
  choice: पूरीम के ये दिन
  rationale: स्थापित पर्व-नाम को देवनागरी में लिप्यंतरित करते हुए इब्रानी संबंध-रचना सुरक्षित रखी गई है।
- source_word: לֹא יַעַבְרוּ מִתּוֹךְ הַיְּהוּדִים
  choice: यहूदियों के बीच से कभी लुप्त न हों
  rationale: עבר מן यहाँ समुदाय के जीवन और प्रथा से मिट जाने या समाप्त हो जाने का भाव देता है; ‘लुप्त न हों’ रूपक और गंभीरता दोनों को सहज हिन्दी में रखता है।
- source_word: וְזִכְרָם לֹא יָסוּף מִזַּרְעָם
  choice: उनकी सन्तान में इनका स्मरण कभी समाप्त न हो
  rationale: זֶרַע यहाँ वंशजों को दर्शाता है। ‘इनका स्मरण’ सर्वनाम का स्पष्ट संबंध पूरीम के दिनों से जोड़ता है और יסוף का अर्थ ‘समाप्त होना’ व्यक्त करता है।
