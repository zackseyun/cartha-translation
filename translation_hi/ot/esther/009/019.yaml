source:
  edition: WLC
  text: עַל כֵּ֞ן הַ/יְּהוּדִ֣ים ה/פרוזים הַ/יֹּשְׁבִים֮ בְּ/עָרֵ֣י הַ/פְּרָזוֹת֒ עֹשִׂ֗ים אֵ֠ת י֣וֹם אַרְבָּעָ֤ה עָשָׂר֙ לְ/חֹ֣דֶשׁ אֲדָ֔ר שִׂמְחָ֥ה וּ/מִשְׁתֶּ֖ה וְ/י֣וֹם ט֑וֹב וּ/מִשְׁל֥וֹחַ מָנ֖וֹת אִ֥ישׁ לְ/רֵעֵֽ/הוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/019.yaml
  text: Therefore the Jews of the villages[a], who live in the rural towns, make the fourteenth day of the month of Adar a day of gladness and feasting and a holiday, and of sending portions[b], each man to his neighbor.
translation:
  language: hi
  text: इसी कारण जो यहूदी उन बस्तियों में रहते हैं जिनके चारों ओर नगर-दीवार नहीं है,[a] वे अदार महीने के चौदहवें दिन को आनंद, भोज और उत्सव के दिन के रूप में मनाते हैं, और हर व्यक्ति अपने पड़ोसी को हिस्से भेजता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बिना नगर-दीवार वाले नगरों में रहनेवाले यहूदी।” इब्रानी में खुली अथवा नगर-दीवार-रहित बस्तियों का भाव दो बार आता है।
    reason: शाब्दिक/भौगोलिक विकल्प
  - marker: b
    text: “हिस्से” से सम्भवतः भोज के लिए भोजन के हिस्से या खाद्य उपहार भेजना अभिप्रेत है।
    reason: सांस्कृतिक प्रथा; मूल शब्द की सामान्यता बनाए रखता है।
lexical_decisions:
- source_word: עַל כֵּן
  choice: इसी कारण
  rationale: यह पद पिछले वर्णन से निष्कर्ष निकालता है; यह अभिव्यक्ति कारण और परिणाम के सम्बन्ध को स्वाभाविक हिन्दी में स्पष्ट रखती है।
- source_word: הַיְּהוּדִים
  choice: यहूदी
  rationale: एस्तेर में यह शब्द फ़ारसी साम्राज्य के भीतर यहूदी जातीय-धार्मिक समुदाय को दर्शाता है, केवल यहूदा प्रदेश के निवासियों को नहीं।
- source_word: הפרוזים ... בְּעָרֵי הַפְּרָזוֹת
  choice: गाँवों में रहनेवाले ... जो बिना शहरपनाह की बस्तियों में रहते हैं
  rationale: दोहराए गए इब्रानी मूल का सम्बन्ध खुली अथवा किलेबन्दी-रहित बस्तियों से है। मुख्य वाक्य में प्रचलित 'गाँवों' और व्याख्यात्मक उपवाक्य में अधिक सटीक 'बिना शहरपनाह की बस्तियों' से भौगोलिक भेद सुरक्षित रहता है।
- source_word: עֹשִׂים אֵת יוֹם אַרְבָּעָה עָשָׂר
  choice: चौदहवें दिन को ... दिन मानते हैं
  rationale: दिन के साथ עשה का अर्थ उसे मनाना या नियत प्रकार का दिन मानना है; हिन्दी रचना आगे आनेवाली संज्ञाओं के साथ सहज है।
- source_word: לְחֹדֶשׁ אֲדָר
  choice: अदार महीने के
  rationale: यह मानक तिथि-सूचक वाक्यांश है और हिन्दी में चौदहवें दिन के साथ स्वाभाविक सम्बन्ध बनाता है।
- source_word: שִׂמְחָה
  choice: आनन्द
  rationale: यह उत्सवपूर्ण प्रसन्नता को व्यक्त करनेवाली संज्ञा है और आधुनिक गरिमापूर्ण हिन्दी में सहज है।
- source_word: וּמִשְׁתֶּה
  choice: भोज
  rationale: शब्द उत्सवी दावत, प्रायः पेय सहित, को दर्शाता है; 'भोज' अनावश्यक रूप से मदिरा निर्दिष्ट किए बिना मूल भाव देता है।
- source_word: וְיוֹם טוֹב
  choice: उत्सव का दिन
  rationale: शाब्दिक 'अच्छा दिन' यहाँ मुहावरे के रूप में हर्षपूर्ण पर्व-दिन को दर्शाता है; 'उत्सव का दिन' अर्थ को स्पष्ट और स्वाभाविक रखता है।
- source_word: וּמִשְׁלוֹחַ מָנוֹת
  choice: खाने के हिस्से भेजते हैं
  rationale: מָנוֹת का मूल अर्थ हिस्से है और प्रसंग में सम्भवतः भोज के लिए खाद्य हिस्से अभिप्रेत हैं; पादटिप्पणी इस सांस्कृतिक अर्थ की सम्भाव्यता बताती है।
- source_word: אִישׁ לְרֵעֵהוּ
  choice: एक-दूसरे को
  rationale: यह हिन्दी का स्वाभाविक पारस्परिक रूप है और समुदाय के सदस्यों द्वारा परस्पर भेजने का वितरक भाव व्यक्त करता है; व्याकरणिक पुल्लिंग को जैविक पुरुषों तक सीमित नहीं करता।
theological_decisions:
- issue: אִישׁ לְרֵעֵהוּ का व्याकरणिक पुल्लिंग और वितरक अर्थ
  choice: एक-दूसरे को
  alternative: हर पुरुष अपने पड़ोसी को
  rationale: इब्रानी का पुल्लिंग एकवचन यहाँ पारस्परिक-वितरक मुहावरा है। हिन्दी में शाब्दिक पुल्लिंग समुदाय की प्रथा को केवल पुरुषों तक सीमित समझा सकता है; 'एक-दूसरे को' मूल का सामुदायिक और पारस्परिक अर्थ सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किन्तु सामान्य पाठक के लिए सुबोध। 'शहरपनाह' ऐतिहासिक नगर-किलेबन्दी के अर्थ में प्रयुक्त है और पादटिप्पणी में वैकल्पिक अनुवाद दिया गया है।
