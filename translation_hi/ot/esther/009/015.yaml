id: EST.9.15
reference: Esther 9:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּֽקָּהֲל֞וּ ה/יהודיים אֲשֶׁר בְּ/שׁוּשָׁ֗ן גַּ֠ם בְּ/י֣וֹם אַרְבָּעָ֤ה עָשָׂר֙ לְ/חֹ֣דֶשׁ אֲדָ֔ר וַ/יַּֽהַרְג֣וּ בְ/שׁוּשָׁ֔ן שְׁלֹ֥שׁ מֵא֖וֹת אִ֑ישׁ וּ/בַ֨/בִּזָּ֔ה לֹ֥א שָׁלְח֖וּ אֶת יָדָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/015.yaml
  text: The Jews who were in Susa also assembled on the fourteenth day of the month of Adar[a], and they killed three hundred men in Susa; but they did not lay a hand on the plunder.
translation:
  language: hi
  text: शूशन में रहनेवाले यहूदी अदार महीने के चौदहवें दिन भी इकट्ठे हुए। उन्होंने शूशन में तीन सौ पुरुषों को मार डाला, परन्तु लूट के माल को हाथ नहीं लगाया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקָּהֲלוּ
  choice: इकट्ठे हुए
  rationale: यह क़הל धातु के सामूहिक और उद्देश्यपूर्ण ढंग से एकत्र होने के भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הַיְּהוּדִים אֲשֶׁר בְּשׁוּשָׁן
  choice: शूशन में रहनेवाले यहूदी
  rationale: सम्बन्धवाचक वाक्यांश शूशन में स्थित यहूदियों को निर्दिष्ट करता है; ‘यहूदी’ यहाँ फ़ारसी साम्राज्य में जातीय-धार्मिक समुदाय के लिए उपयुक्त है।
- source_word: גַּם
  choice: भी
  rationale: यह पिछले दिन की घटनाओं के अतिरिक्त चौदहवें दिन भी उनके एकत्र होने का योगात्मक भाव बनाए रखता है।
- source_word: בְּיוֹם אַרְבָּעָה עָשָׂר לְחֹדֶשׁ אֲדָר
  choice: अदार महीने के चौदहवें दिन
  rationale: मूल की पूर्ण तिथि-अभिव्यक्ति को स्पष्ट और स्वाभाविक हिन्दी में रखा गया है।
- source_word: וַיַּהַרְגוּ
  choice: मार डाला
  rationale: הרג के सीधे अर्थ ‘मारना/जान से मारना’ को बिना नरम किए आधुनिक हिन्दी में व्यक्त करता है।
- source_word: שְׁלֹשׁ מֵאוֹת אִישׁ
  choice: तीन सौ पुरुषों
  rationale: אִישׁ के पुल्लिंग मानवीय संकेत को बनाए रखता है और संख्या के साथ स्वाभाविक हिन्दी देता है।
- source_word: וּבַבִּזָּה
  choice: परन्तु लूट के माल को
  rationale: בִּזָּה संघर्ष में प्राप्त की जाने वाली लूट की वस्तुओं को दर्शाता है; प्रसंगगत विरोध के कारण ו को ‘परन्तु’ किया गया है।
- source_word: לֹא שָׁלְחוּ אֶת יָדָם
  choice: हाथ नहीं लगाया
  rationale: मूल मुहावरे ‘अपना हाथ नहीं बढ़ाया’ का स्वाभाविक हिन्दी समतुल्य है और माल पर अधिकार न करने का आशय स्पष्ट रखता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘शूशन’ हिन्दी बाइबलीय परम्परा में परिचित स्थान-नाम है। मूल का हाथ बढ़ाने वाला मुहावरा हिन्दी के स्वाभाविक ‘हाथ नहीं लगाया’ से व्यक्त हुआ है; अलग पाद-टिप्पणी आवश्यक नहीं समझी गई।
