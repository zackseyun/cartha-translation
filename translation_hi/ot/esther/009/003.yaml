base_translation:
  language: en
  yaml_path: translation/ot/esther/009/003.yaml
  text: And all the officials of the provinces[a], the satraps, the governors, and those doing the king’s work were supporting the Jews, because the fear of Mordecai had fallen on them.
translation:
  language: hi
  text: और प्रान्तों के सभी अधिकारी, क्षत्रप, राज्यपाल और राजा का काम-काज सँभालनेवाले लोग यहूदियों का साथ दे रहे थे,[a] क्योंकि मोर्दकै का भय उन पर छा गया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यहूदियों की सहायता कर रहे थे”; इब्रानी क्रिया का अर्थ उन्हें “ऊपर उठाना” या “उनका पक्ष लेना” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי הַמְּדִינוֹת
  choice: प्रान्तों के सभी अधिकारी
  rationale: שָׂרִים प्रशासनिक अधिकारियों या शासकों को सूचित करता है; सूची के प्रशासनिक संदर्भ में ‘अधिकारी’ स्वाभाविक और स्पष्ट है।
- source_word: אֲחַשְׁדַּרְפְּנִים
  choice: क्षत्रप
  rationale: यह फ़ारसी प्रशासनिक पद है; ‘क्षत्रप’ ऐतिहासिक विशिष्टता बनाए रखता है और अगले पद ‘राज्यपाल’ से भेद भी स्पष्ट करता है।
- source_word: פַּחוֹת
  choice: राज्यपाल
  rationale: यह क्षत्रपों से अलग एक प्रादेशिक प्रशासनिक पद है; आधुनिक हिन्दी में ‘राज्यपाल’ इसका स्पष्ट सामान्य समतुल्य है।
- source_word: עֹשֵׂי הַמְּלָאכָה אֲשֶׁר לַמֶּלֶךְ
  choice: राजा का काम-काज सँभालनेवाले लोग
  rationale: शाब्दिक भाव ‘राजा से सम्बन्धित काम करनेवाले’ है; यह रूप राजकीय कर्मचारियों के व्यापक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מְנַשְּׂאִים אֶת־הַיְּהוּדִים
  choice: यहूदियों का साथ दे रहे थे
  rationale: נשׂא के हिफ़ील रूप में उठाने, सहारा देने या अनुग्रह करने का अर्थ हो सकता है। संघर्ष के इस प्रसंग में ‘साथ देना’ व्यावहारिक समर्थन को स्पष्ट करता है, बिना सामाजिक प्रतिष्ठा बढ़ाने का अर्थ अनावश्यक रूप से तय किए।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह अधिकारियों के समर्थन का कारण प्रस्तुत करता है; ‘क्योंकि’ आधुनिक हिन्दी में स्पष्ट कारणसूचक है।
- source_word: נָפַל פַּחַד מָרְדֳּכַי עֲלֵיהֶם
  choice: मोर्दकै का भय उन पर छा गया था
  rationale: मूल इब्रानी में भय के किसी पर ‘पड़ने’ का सजीव मुहावरा है। हिन्दी में ‘छा गया था’ उसी अचानक और व्यापक प्रभाव को स्वाभाविक ढंग से व्यक्त करता है और पूर्ण क्रिया का पूर्वकालिक भाव बनाए रखता है।
- source_word: מָרְדֳּכַי
  choice: मोर्दकै
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यन्तरण अपनाया गया है।
