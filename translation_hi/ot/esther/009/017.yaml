base_translation:
  language: en
  yaml_path: translation/ot/esther/009/017.yaml
  text: on the thirteenth day of the month of Adar[a], and resting on the fourteenth day of it[b], and making it a day of feasting and gladness.
translation:
  language: hi
  text: अदार महीने के तेरहवें दिन, और उसी महीने के चौदहवें दिन विश्राम करके, उन्होंने उस दिन को भोज और आनन्द का दिन बनाया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּיוֹם שְׁלֹשָׁה עָשָׂר
  choice: तेरहवें दिन
  rationale: दिनांक के प्रसंग में संख्या क्रमवाचक अर्थ रखती है; आधुनिक हिन्दी में ‘तेरहवें दिन’ स्वाभाविक है।
- source_word: לְחֹדֶשׁ אֲדָר
  choice: अदार महीने के
  rationale: इब्रानी की दिनांक-संरचना को स्पष्ट रखते हुए महीने के नाम אֲדָר का प्रचलित हिन्दी लिप्यंतरण ‘अदार’ किया गया है।
- source_word: וְנוֹחַ
  choice: फिर उन्होंने ... विश्राम किया
  rationale: נוח यहाँ संघर्ष से विराम लेने का अर्थ देता है। इब्रानी का infinitive absolute प्रसंग में पूर्ववर्ती बहुवचन कर्ता के साथ सीमित क्रिया की तरह काम करता है; इसलिए हिन्दी में स्पष्ट और स्वाभाविक भूतकाल रखा गया है।
- source_word: בְּאַרְבָּעָה עָשָׂר בּוֹ
  choice: उसी महीने के चौदहवें दिन
  rationale: בּוֹ का संकेत अदार महीने की ओर है। ‘उसी महीने’ हिन्दी में सर्वनाम-संदर्भ को स्पष्ट करता है, बिना कोई नई सूचना जोड़े।
- source_word: וְעָשֹׂה אֹתוֹ
  choice: और उसे ... दिन बनाया
  rationale: यह रूप दिन को उत्सव के रूप में ठहराने या मनाने का भाव देता है। प्रसंग में finite भूतकाल हिन्दी में सबसे स्वाभाविक है, जबकि ‘उसे’ चौदहवें दिन की ओर संकेत करता है।
- source_word: יוֹם מִשְׁתֶּה
  choice: भोज ... का दिन
  rationale: מִשְׁתֶּה सामूहिक दावत या भोज को दर्शाता है; ‘भोज’ साधारण आधुनिक हिन्दी में संक्षिप्त और गरिमापूर्ण है।
- source_word: וְשִׂמְחָה
  choice: और आनन्द
  rationale: שִׂמְחָה उत्सवी हर्ष को व्यक्त करता है; ‘आनन्द’ यहाँ संज्ञात्मक समानांतरता और गरिमापूर्ण शैली बनाए रखता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली अपनाई गई है। पद मूल वाक्य की निरंतरता है, इसलिए आरम्भ में ‘यह हुआ’ जोड़कर पिछले प्रसंग से संबंध और हिन्दी वाक्य की पठनीयता स्पष्ट की गई है; इसके बाद कर्ता ‘उन्होंने’ संदर्भ से ग्रहण किया गया है।
