base_translation:
  language: en
  yaml_path: translation/ot/esther/009/025.yaml
  text: But when she came before the king[a], he commanded by letter that his evil scheme which he had devised against the Jews should return on his own head[b], and they hanged him and his sons on the gallows.
translation:
  language: hi
  text: जब वह राजा के सामने आई, तब उसने लिखित आदेश दिया[a] कि हामान की वह बुरी योजना, जो उसने यहूदियों के विरुद्ध बनाई थी, उसी के सिर पर लौट आए; और उन्होंने उसे और उसके पुत्रों को लकड़ी के खंभे पर टाँग दिया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसने पत्र/लेख के साथ कहा।” प्रसंग में इसका आशय है कि राजा ने लिखित आदेश जारी किया।
    reason: मूल इब्रानी की संक्षिप्त और असामान्य अभिव्यक्ति को स्पष्ट करना।
  - marker: b
    text: “टाँग दिया” का अर्थ “सूली पर चढ़ाया” भी हो सकता है। “खंभे” के लिए इब्रानी शब्द का शाब्दिक अर्थ “पेड़/लकड़ी” है और वह लकड़ी के खंभे या अन्य लकड़ी की संरचना का भी संकेत कर सकता है।
    reason: मृत्युदंड की सटीक विधि और लकड़ी की संरचना का स्वरूप मूल में पूरी तरह निश्चित नहीं है।
lexical_decisions:
- source_word: וּבְבֹאָהּ
  choice: पर जब वह आई
  rationale: स्त्रीलिंग एकवचन प्रत्यय का संदर्भ प्रसंग में एस्तेर से है। नाम दोहराने के बजाय सर्वनाम मूल की अनाफोरिक शैली बनाए रखता है।
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: राजा के सामने
  rationale: राजा की उपस्थिति में आने के लिए यह स्वाभाविक और गरिमापूर्ण हिन्दी मुहावरा है।
- source_word: אָמַר עִם הַסֵּפֶר
  choice: उसने लिखित आदेश दिया
  rationale: इब्रानी वाक्यांश संक्षिप्त और कुछ कठिन है; शाब्दिक अर्थ ‘पत्र/लेख के साथ उसने कहा’ है। प्रसंग में राजा द्वारा लिखित राजाज्ञा जारी करना अभिप्रेत है।
- source_word: יָשׁוּב
  choice: लौट आए
  rationale: यह क्रिया हामान की योजना के उसी पर पलट पड़ने का भाव व्यक्त करती है और आदेश के आश्रित वाक्य में उपयुक्त है।
- source_word: מַחֲשַׁבְתּוֹ הָרָעָה אֲשֶׁר חָשַׁב
  choice: उसकी वह बुरी योजना, जो उसने बनाई थी
  rationale: संज्ञा और संबद्ध क्रिया दुर्भावनापूर्ण सोच से अधिक, सोची-समझी योजना को सूचित करती हैं।
- source_word: עַל הַיְּהוּדִים
  choice: यहूदियों के विरुद्ध
  rationale: यहाँ עַל शत्रुतापूर्ण अभिप्राय के कारण ‘के विरुद्ध’ है।
- source_word: עַל רֹאשׁוֹ
  choice: उसी के सिर पर
  rationale: प्रतिशोधात्मक उलटाव का इब्रानी मुहावरा है; ‘उसी’ आत्मसंदर्भ और बल को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: וְתָלוּ אֹתוֹ וְאֶת־בָּנָיו עַל הָעֵץ
  choice: उन्होंने उसे और उसके पुत्रों को काठ पर लटका दिया
  rationale: תלה का मूल भाव लटकाना है और עֵץ पेड़, लकड़ी, खंभे या काठ की संरचना को सूचित कर सकता है। ‘काठ पर लटका दिया’ आधुनिक फाँसीघर का अनावश्यक चित्र आरोपित किए बिना मूल की व्यापकता रखता है।
