  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज कथात्मक शैली रखी गई है। ‘काठ’ मूल के पेड़/लकड़ी के बिंब को बनाए रखता है और ‘फाँसीघर’ से जुड़ी आधुनिक संरचना को आरोपित नहीं करता। मुख्य पाठ के दोनों पादटिप्पणी-चिह्न संबद्ध वाक्यांशों पर लगाए गए हैं।
