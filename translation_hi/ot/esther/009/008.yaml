  rationale: וְ सूची की अगली वस्तुओं को जोड़ता है, जबकि प्रत्यक्ष-कर्म चिह्न אֵת का हिन्दी में अलग अनुवाद आवश्यक नहीं है। प्रत्येक नाम से पहले ‘और’ दोहराने के बजाय स्वाभाविक हिन्दी सूची-रचना अपनाई गई है।
- source_word: פּוֹרָתָא
