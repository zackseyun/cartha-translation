  rationale: यह व्यक्ति का नाम है; हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: אֲדַלְיָא
  choice: अदल्या
  rationale: यह व्यक्ति का नाम है; हिब्रू रूप को स्वाभाविक देवनागरी में लिप्यंतरित किया गया है।
- source_word: אֲרִידָתָא
  choice: अरीदाता
  rationale: यह व्यक्ति का नाम है; हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
