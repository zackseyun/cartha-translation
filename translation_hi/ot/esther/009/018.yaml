  text: ו/ה/יהודיים אֲשֶׁר בְּ/שׁוּשָׁ֗ן נִקְהֲלוּ֙ בִּ/שְׁלֹשָׁ֤ה עָשָׂר֙ בּ֔/וֹ וּ/בְ/אַרְבָּעָ֥ה עָשָׂ֖ר בּ֑/וֹ וְ/נ֗וֹחַ בַּ/חֲמִשָּׁ֤ה עָשָׂר֙ בּ֔/וֹ וְ/עָשֹׂ֣ה אֹת֔/וֹ י֖וֹם מִשְׁתֶּ֥ה וְ/שִׂמְחָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/018.yaml
  text: But the Jews who were in Susa assembled on the thirteenth day of it and on the fourteenth day of it[a], and rested on the fifteenth day of it[b], and made it a day of feasting and gladness.
translation:
  language: hi
  text: परन्तु शूशन में रहनेवाले यहूदी उसी महीने के तेरहवें और चौदहवें दिन इकट्ठे हुए[a]। उन्होंने पन्द्रहवें दिन विश्राम किया और उसे भोज और आनन्द का दिन बनाया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शाब्दिक रूप से, ‘उसमें तेरहवें दिन ... उसमें चौदहवें दिन ... उसमें पन्द्रहवें दिन’; प्रसंग में ‘उसमें’ का संकेत महीने की ओर है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘उसे दावत और हर्ष का दिन बनाया।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיְּהוּדִים אֲשֶׁר בְּשׁוּשָׁן
  choice: परन्तु शूशन में रहनेवाले यहूदी
  rationale: वाव पिछले पद में प्रान्तों के यहूदियों से तुलना का संकेत देता है, इसलिए ‘परन्तु’ स्वाभाविक है। שׁוּשָׁן के लिए हिन्दी बाइबलीय रूप ‘शूशन’ रखा गया है।
- source_word: נִקְהֲלוּ
  choice: इकट्ठे हुए
  rationale: निफ़अल रूप यहाँ एकत्र होने को व्यक्त करता है; यह सरल और प्रसंगानुकूल हिन्दी है तथा उद्देश्य का अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: בִּשְׁלֹשָׁה עָשָׂר בּוֹ וּבְאַרְבָּעָה עָשָׂר בּוֹ
  choice: उसी महीने के तेरहवें और चौदहवें दिन
  rationale: हिब्रू का ‘उसमें’ प्रसंगतः महीने की ओर संकेत करता है। हिन्दी में अस्पष्ट सर्वनाम के स्थान पर ‘उसी महीने’ अर्थ को स्पष्ट और स्वाभाविक बनाता है।
- source_word: וְנוֹחַ
  choice: विश्राम किया
  rationale: נוח संघर्ष के बाद रुकने या चैन पाने को दर्शाता है; ‘विश्राम किया’ निकट और स्वाभाविक अनुवाद है।
- source_word: בַּחֲמִשָּׁה עָשָׂר בּוֹ
  choice: पन्द्रहवें दिन
  rationale: महीने का संदर्भ पिछले वाक्यांश से स्पष्ट है, इसलिए अनावश्यक पुनरावृत्ति के बिना तारीख स्वाभाविक हिन्दी में दी गई है।
- source_word: וְעָשֹׂה אֹתוֹ
  choice: उसे ... दिन बनाया
  rationale: עשה עם कर्म-सर्वनाम यहाँ उस दिन को एक विशेष प्रकार से मनाने या ठहराने का भाव देता है; ‘बनाया’ हिब्रू मुहावरे के निकट है।
- source_word: יוֹם מִשְׁתֶּה וְשִׂמְחָה
  choice: भोज और आनन्द का दिन
  rationale: מִשְׁתֶּה उत्सवी भोज को और שִׂמְחָה हर्ष या आनन्द को व्यक्त करता है। यह हिन्दी गरिमापूर्ण, सुबोध और उत्सवी भाव के अनुरूप है।
