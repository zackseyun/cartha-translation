  rationale: संयोजक वाव और स्थानसूचक उपसर्ग को स्वाभाविक हिन्दी में ‘और ... में’ से व्यक्त किया गया है; स्थान-नाम का रूप ‘शूशन’ इब्रानी उच्चारण के निकट है।
