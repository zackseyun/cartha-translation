base_translation:
  language: en
  yaml_path: translation/ot/esther/009/027.yaml
  text: 'the Jews established and accepted for themselves[a], for their offspring, and for all who joined them, that it should not fail: to observe these two days according to what was written for them and at their appointed time[b], year after year.'
translation:
  language: hi
  text: यहूदियों ने अपने ऊपर, अपने वंशजों पर और उन सब पर जो उनसे जुड़ें[a], यह दायित्व ठहराया और स्वीकार किया कि इन दो दिनों को, जैसा उनके लिए लिखा गया था और उनके नियत समय के अनुसार, हर वर्ष मनाने में चूक न हो[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो उनसे संबद्ध हों।” इब्रानी में उन लोगों का उल्लेख है जो यहूदियों से जुड़ते या उनके साथ गठबंधन करते हैं।
    reason: lexical_alternative
  - marker: b
    text: या, “यह बात टल न जाए,” “लुप्त न हो,” या “उपेक्षित न हो।” आशय यह है कि इन दिनों का वार्षिक पालन समाप्त या उपेक्षित न हो।
    reason: lexical_alternative
