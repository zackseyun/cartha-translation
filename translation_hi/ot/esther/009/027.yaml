  choice: अपने लिए
  rationale: दायित्व अपने ऊपर लेने का स्वाभाविक आधुनिक हिंदी रूप।
- source_word: זַרְעָם
  choice: अपने वंशजों
  rationale: संदर्भ में זרע का पीढ़ीगत अर्थ स्पष्ट और सहज रूप से व्यक्त होता है।
- source_word: כָּל הַנִּלְוִים עֲלֵיהֶם
  choice: उन सभी के लिए जो उनके साथ जुड़ गए थे
  rationale: לוה के साथ जुड़ने या संबद्ध होने के अर्थ को बिना धार्मिक पहचान अधिक स्पष्ट किए सुरक्षित रखता है।
- source_word: וְלֹא יַעֲבוֹר
  choice: मनाना न छोड़ें
  rationale: शाब्दिक ‘न टले/न बीते’ के मुहावरेदार आशय—पालन का लोप न होना—को अगले क्रियापद के साथ स्वाभाविक हिंदी में जोड़ता है।
- source_word: לִהְיוֹת עֹשִׂים
  choice: मनाना
  rationale: पर्व-दिवसों के संदर्भ में लगातार पालन करने का स्वाभाविक हिंदी पद; केवल उत्सवधर्मिता जोड़ने के बजाय अनुष्ठानिक पालन का भाव रखता है।
- source_word: כִּכְתָבָם
  choice: उनके विषय में लिखे गए निर्देश के अनुसार
  rationale: लिखित निर्धारण को सामने रखता है, पर किसी विशिष्ट दस्तावेज़ या लेखक को पाठ से अधिक निश्चित नहीं करता।
- source_word: וְכִזְמַנָּם
  choice: उनके ठहराए हुए समय के अनुसार
  rationale: निर्धारित समय का अर्थ और दो दिनों से संबंधित बहुवचन संकेत सुरक्षित रहता है।
- source_word: בְּכָל שָׁנָה וְשָׁנָה
  choice: हर वर्ष
  rationale: इब्रानी पुनरुक्ति की वार्षिक निरंतरता को सहज आधुनिक हिंदी में व्यक्त करता है।
