source:
  edition: WLC
  text: וּ/בִ/שְׁנֵים֩ עָשָׂ֨ר חֹ֜דֶשׁ הוּא חֹ֣דֶשׁ אֲדָ֗ר בִּ/שְׁלוֹשָׁ֨ה עָשָׂ֥ר יוֹם֙ בּ֔/וֹ אֲשֶׁ֨ר הִגִּ֧יעַ דְּבַר הַ/מֶּ֛לֶךְ וְ/דָת֖/וֹ לְ/הֵעָשׂ֑וֹת בַּ/יּ֗וֹם אֲשֶׁ֨ר שִׂבְּר֜וּ אֹיְבֵ֤י הַ/יְּהוּדִים֙ לִ/שְׁל֣וֹט בָּ/הֶ֔ם וְ/נַהֲפ֣וֹךְ ה֔וּא אֲשֶׁ֨ר יִשְׁלְט֧וּ הַ/יְּהוּדִ֛ים הֵ֖מָּה בְּ/שֹׂנְאֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/001.yaml
  text: 'In the twelfth month[a], that is, the month Adar, on the thirteenth day of it, when the king’s word and his decree were to be carried out, on the day when the enemies of the Jews had hoped to rule over them, the opposite happened: the Jews themselves ruled over those who hated them.'
translation:
  language: hi
  text: 'बारहवें महीने में, अर्थात् अदार महीने के तेरहवें दिन, जब राजा के आदेश और उसकी राजाज्ञा को पूरा करने का समय आया, उसी दिन जब यहूदियों के शत्रुओं ने उन पर अधिकार करने की आशा की थी, स्थिति उलट गई[a]: यहूदियों ने स्वयं उन लोगों पर अधिकार कर लिया जो उनसे घृणा करते थे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इसके विपरीत हुआ” अथवा “स्थिति पलट गई।”
    reason: וְנַהֲפוֹךְ הוּא के सम्भव स्वाभाविक हिन्दी रूप; ये मूल के परिस्थिति-उलटाव के भाव को रखते हैं, बिना अतिरिक्त अर्थ जोड़े।
lexical_decisions:
- source_word: וּבִשְׁנֵים עָשָׂר חֹדֶשׁ
  choice: बारहवें महीने में
  rationale: वाव कथानक को आगे बढ़ाता है; हिन्दी में अलग से ‘और’ या ‘अब’ जोड़े बिना काल-सूचक पद स्वाभाविक है।
- source_word: הוּא חֹדֶשׁ אֲדָר
  choice: अर्थात् अदार महीने
  rationale: הוּא यहाँ बारहवें महीने की व्याख्यात्मक पहचान कराता है; ‘अर्थात्’ इसे स्पष्ट और सहज रखता है।
- source_word: בִּשְׁלוֹשָׁה עָשָׂר יוֹם בּוֹ
  choice: के तेरहवें दिन
  rationale: בּוֹ का संकेत पहले आए महीने की ओर है; हिन्दी संबंध-रचना इसे संक्षेप और स्पष्टता से व्यक्त करती है।
- source_word: אֲשֶׁר הִגִּיעַ דְּבַר הַמֶּלֶךְ וְדָתוֹ לְהֵעָשׂוֹת
  choice: जब राजा के आदेश और उसकी राजाज्ञा को पूरा करने का समय आया
  rationale: הִגִּיעַ का मूल भाव ‘पहुँचना/आना’ है, पर संदर्भ में नियुक्त समय के आ पहुँचने का अर्थ है। ‘आदेश’ और ‘राजाज्ञा’ דָּבָר तथा דָּת के बीच भेद बनाए रखते हैं।
- source_word: שִׂבְּרוּ
  choice: आशा की थी
  rationale: क्रिया अपेक्षा या आशा का भाव रखती है; पूर्वकालिक प्रत्याशा को ‘आशा की थी’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: לִשְׁלֹט בָּהֶם
  choice: उन पर अधिकार करने
  rationale: שׁלט प्रभुत्व या नियंत्रण स्थापित करने को दर्शाता है; ‘अधिकार करना’ हिंसक संघर्ष के इस संदर्भ में ‘शासन करना’ से अधिक सहज है।
- source_word: וְנַהֲפוֹךְ הוּא
  choice: बात उलट गई
  rationale: यह मुहावरा परिस्थिति के पूर्ण उलटाव को बताता है; हिन्दी में यह संक्षिप्त, प्रभावपूर्ण और स्वाभाविक है।
- source_word: אֲשֶׁר יִשְׁלְטוּ הַיְּהוּדִים הֵמָּה
  choice: यहूदियों ने स्वयं ... अधिकार कर लिया
  rationale: הֵמָּה का जोर ‘स्वयं’ द्वारा सुरक्षित है और पूर्ण हुई घटना को ‘कर लिया’ व्यक्त करता है।
- source_word: בְּשֹׂנְאֵיהֶם
  choice: अपने बैरियों पर
  rationale: कृदंत का शाब्दिक अर्थ ‘उनसे घृणा करने वाले’ है; ‘बैरी’ सक्रिय शत्रुता का भाव संक्षेप में बनाए रखता है और אֹיְבֵי के लिए प्रयुक्त ‘शत्रु’ से शब्दगत भेद भी रखता है।
