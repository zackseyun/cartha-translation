base_translation:
  language: en
  yaml_path: translation/ot/esther/009/023.yaml
  text: So the Jews accepted what they had begun to do[a], and what Mordecai had written to them.
translation:
  language: hi
  text: इस प्रकार यहूदियों ने जो करना आरम्भ किया था, उसे स्वीकार कर लिया[a], और जो मोर्दकै ने उन्हें लिखा था, उसे भी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो करना उन्होंने आरम्भ किया था, उसे अपने ऊपर ले लिया।” इब्रानी क्रिया में किसी बात को स्वीकार करने या उसका दायित्व अपने ऊपर लेने—दोनों का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִבֵּל
  choice: स्वीकार कर लिया
  rationale: यहाँ קבל किसी प्रथा या दायित्व को अपने ऊपर लेने अथवा स्वीकार करने का भाव रखता है। ‘स्वीकार कर लिया’ इस अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि केवल ‘ग्रहण किया’ अत्यधिक निष्क्रिय लग सकता है।
- source_word: הַיְּהוּדִים
  choice: यहूदियों
  rationale: निश्चित जातीय-धार्मिक समुदाय के लिए आधुनिक मानक हिन्दी का सीधा और प्रचलित रूप।
- source_word: אֵת אֲשֶׁר הֵחֵלּוּ לַעֲשׂוֹת
  choice: जो करना आरम्भ किया था, उसे
  rationale: हिफ़ील क्रिया הֵחֵלּוּ का अर्थ ‘आरम्भ किया’ है और לַעֲשׂוֹת उस आरम्भ किए गए कार्य को बताता है। हिन्दी वाक्य-विन्यास में ‘उसे’ जोड़ने से यह קבל का कर्म स्पष्ट होता है।
- source_word: וְאֵת אֲשֶׁר כָּתַב
  choice: और जो ... लिखा था, उसे भी
  rationale: दूसरे समानांतर कर्म को स्पष्ट रखने के लिए हिन्दी में ‘उसे भी’ रखा गया है; ‘लिखा था’ पूर्ववर्ती लेखन को कथा-क्रम में स्वाभाविक रूप से दर्शाता है।
- source_word: מָרְדֳּכַי
  choice: मोर्दकै
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: אֲלֵיהֶם
  choice: उन्हें
  rationale: אֶל की दिशात्मकता को लिखित संदेश के प्रसंग में स्वाभाविक हिन्दी ‘उन्हें लिखा’ से व्यक्त किया गया है।
