  text: Therefore they called these days Purim[a], after the name of Pur. Therefore, because of all the words of this letter, and what they had seen concerning this matter, and what had happened to them[b],
translation:
  language: hi
  text: इसी कारण उन्होंने इन दिनों का नाम पूरीम[a] रखा—पूर के नाम के आधार पर। इसी कारण, इस पत्र में लिखी हुई सभी बातों के कारण, और जो कुछ उन्होंने इस विषय में देखा था, और जो कुछ उन पर आ पड़ा था[b],
