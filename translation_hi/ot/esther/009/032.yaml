- source_word: בַּסֵּפֶר
  choice: पुस्तक में
  rationale: סֵפֶר पुस्तक, पुस्तकाकार लेख या अभिलेख हो सकता है; मूल की अनिश्चितता बनाए रखने के लिए ‘पुस्तक’ चुना गया है।
