base_translation:
  language: en
  yaml_path: translation/ot/esther/009/020.yaml
  text: Then Mordecai wrote these things and sent letters to all the Jews who were in all the provinces of King Ahasuerus[a], both near and far.
translation:
  language: hi
  text: तब मोर्दकै ने ये बातें लिखीं और राजा अहश्वेरोश के सभी प्रान्तों में रहने वाले सब यहूदियों को, पास और दूर, पत्र भेजे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: लिखीं
  rationale: כתב का सीधा अर्थ लिखना है; कथात्मक क्रम में यह स्वाभाविक और सटीक है।
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: ये बातें
  rationale: דברים का अर्थ बातें, विषय या घटनाएँ हो सकता है। ‘ये बातें’ पूर्ववर्णित घटनाओं और उनके लिखित विवरण—दोनों की सम्भावना को खुला रखता है।
- source_word: וַיִּשְׁלַח סְפָרִים
  choice: पत्र भेजे
  rationale: फ़ारसी साम्राज्य के प्रशासनिक सन्दर्भ में ספרים लिखित संदेशों या पत्रों को दर्शाता है; ‘पत्र’ आधुनिक हिन्दी में सबसे स्वाभाविक है।
- source_word: כָּל הַיְּהוּדִים
  choice: सब यहूदियों
  rationale: यह पूरे साम्राज्य में फैले यहूदी समुदाय का सीधा उल्लेख है।
- source_word: בְּכָל מְדִינוֹת
  choice: सभी प्रान्तों में
  rationale: מדינות साम्राज्य के प्रशासनिक क्षेत्रों को दर्शाता है; हिन्दी में ‘प्रान्त’ उपयुक्त समतुल्य है।
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: राजा क्षयर्ष
  rationale: हिब्रू नाम אחשורוש के लिए हिन्दी बाइबल परम्परा में प्रचलित और पहचाना जाने वाला रूप ‘क्षयर्ष’ रखा गया है।
- source_word: הַקְּרוֹבִים וְהָרְחוֹקִים
  choice: चाहे वे पास रहते थे या दूर
  rationale: यह निकट और दूर रहनेवाले सभी यहूदियों को समेटने वाला युग्म है; यह रूप हिन्दी में स्वाभाविक ढंग से उसका व्यापक अर्थ व्यक्त करता है।
- source_word: וַ
  choice: तब
  rationale: आरम्भिक वाव कथानक को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में क्रम को स्वाभाविक रूप से प्रकट करता है।
