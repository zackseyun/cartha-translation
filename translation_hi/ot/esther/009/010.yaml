  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप अपनाया गया है। हिब्रू के कर्ता ‘उन्होंने’ को हिन्दी वाक्य-प्रवाह के लिए आरम्भ में रखा गया है; आशय में कोई परिवर्तन नहीं किया गया।
