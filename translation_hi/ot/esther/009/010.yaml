  text: עֲ֠שֶׂרֶת בְּנֵ֨י הָמָ֧ן בֶּֽן הַמְּדָ֛תָא צֹרֵ֥ר הַ/יְּהוּדִ֖ים הָרָ֑גוּ וּ/בַ֨/בִּזָּ֔ה לֹ֥א שָׁלְח֖וּ אֶת יָדָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/010.yaml
  text: the ten sons of Haman son of Hammedatha[a], the enemy of the Jews, they killed; but they did not lay a hand on the plunder.
translation:
  language: hi
  text: उन्होंने यहूदियों के शत्रु, हम्मदाता के पुत्र हामान के दसों पुत्रों को मार डाला; परन्तु लूट के माल पर हाथ नहीं लगाया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲשֶׂרֶת בְּנֵי
  choice: दसों पुत्रों
  rationale: रचना का अर्थ हामान के सूचीबद्ध दस पुत्र हैं। ‘दसों’ हिन्दी में इस निश्चित और पूर्ण समूह को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הָמָן
  choice: हामान
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: בֶּן הַמְּדָתָא
  choice: हम्मदाता के पुत्र
  rationale: यह हामान की वंश-संबंधी पहचान बताने वाला समानाधिकरण पद है; नाम को स्रोत के अनुरूप लिप्यंतरित किया गया है।
- source_word: צֹרֵר הַיְּהוּדִים
  choice: यहूदियों के शत्रु
  rationale: צֹרֵר यहाँ वैर रखने और सताने वाले व्यक्ति को सूचित करता है; ‘शत्रु’ स्पष्ट, स्वाभाविक और प्रसंगानुकूल है।
- source_word: הָרָגוּ
  choice: मार डाला
  rationale: הרג के पूर्ण क्रियार्थ को आधुनिक हिन्दी में सीधे और स्पष्ट रूप से व्यक्त करता है।
- source_word: וּבַבִּזָּה
  choice: परन्तु लूट के माल पर
  rationale: בִּזָּה युद्ध या हिंसा में छीना जाने वाला माल है। वाव को प्रसंगगत विरोध के कारण ‘परन्तु’ किया गया है, क्योंकि हत्या के बाद भी माल न लेने पर बल है।
- source_word: לֹא שָׁלְחוּ אֶת יָדָם
  choice: हाथ नहीं लगाया
  rationale: शाब्दिक ‘अपना हाथ नहीं बढ़ाया’ यहाँ किसी वस्तु को लेने या अपने अधिकार में करने का मुहावरा है। हिन्दी का ‘हाथ नहीं लगाया’ मूल बिंब और आशय दोनों बनाए रखता है।
