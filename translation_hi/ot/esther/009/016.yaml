  text: וּ/שְׁאָ֣ר הַ/יְּהוּדִ֡ים אֲשֶׁר֩ בִּ/מְדִינ֨וֹת הַ/מֶּ֜לֶךְ נִקְהֲל֣וּ וְ/עָמֹ֣ד עַל נַפְשָׁ֗/ם וְ/נ֨וֹחַ֙ מֵ/אֹ֣יְבֵי/הֶ֔ם וְ/הָרֹג֙ בְּ/שֹׂ֣נְאֵי/הֶ֔ם חֲמִשָּׁ֥ה וְ/שִׁבְעִ֖ים אָ֑לֶף וּ/בַ֨/בִּזָּ֔ה לֹ֥א שָֽׁלְח֖וּ אֶת יָדָֽ/ם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/016.yaml
  text: And the rest of the Jews who were in the king’s provinces gathered themselves together and stood for their lives[a], and had relief from their enemies, and killed seventy-five thousand of those who hated them[b]; but they did not lay a hand on the plunder.
translation:
  language: hi
  text: और राजा के प्रांतों में रहने वाले शेष यहूदी इकट्ठे हुए और अपने प्राणों की रक्षा के लिए डटकर खड़े हुए[a]। उन्हें अपने शत्रुओं से चैन मिला, और उन्होंने उनसे घृणा करने वालों में से पचहत्तर हज़ार को मार डाला; लेकिन उन्होंने लूट के माल पर हाथ नहीं डाला[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने प्राण बचाने के लिए खड़े हुए।”
    reason: हिब्रू मुहावरे का अधिक निकट वैकल्पिक रूप।
  - marker: b
    text: “लूट का माल” का अर्थ युद्ध में छीना या कब्ज़े में लिया जाने वाला धन-सामान है।
    reason: प्राचीन युद्ध-संदर्भ में בִּזָּה का अर्थ स्पष्ट करना।
lexical_decisions:
- source_word: וּשְׁאָר הַיְּהוּדִים
  choice: शेष यहूदी
  rationale: שְׁאָר पिछले वर्णित समूह के अतिरिक्त बचे हुए लोगों को दर्शाता है; ‘शेष यहूदी’ संक्षिप्त, स्वाभाविक और सन्दर्भानुकूल है।
- source_word: בִּמְדִינוֹת הַמֶּלֶךְ
  choice: राजा के प्रान्तों में रहनेवाले
  rationale: מְדִינוֹת साम्राज्य के प्रशासनिक प्रान्त हैं; हिन्दी में सम्बन्ध और निवास को स्पष्ट करने के लिए यह स्वाभाविक रूप है।
- source_word: נִקְהֲלוּ
  choice: इकट्ठे हुए
  rationale: क्रिया यहूदियों के सामूहिक रूप से एकत्र होने को व्यक्त करती है और अध्याय में बार-बार आनेवाली कार्रवाई को सहज हिन्दी में रखती है।
- source_word: וְעָמֹד עַל נַפְשָׁם
  choice: अपने प्राणों की रक्षा के लिए डटकर खड़े हुए
  rationale: शाब्दिक चित्र ‘अपने प्राण के लिए खड़े होना’ है और प्रसंग आत्मरक्षा का है। ‘डटकर खड़े हुए’ चित्र को बचाता है, जबकि ‘रक्षा के लिए’ मुहावरे का आशय स्पष्ट करता है।
- source_word: וְנוֹחַ מֵאֹיְבֵיהֶם
  choice: उन्हें अपने शत्रुओं से चैन मिला
  rationale: נוּחַ यहाँ संघर्ष से राहत या विश्राम पाने का भाव देता है; ‘चैन मिला’ सामान्य आधुनिक हिन्दी में सहज है।
- source_word: וְהָרֹג בְּשֹׂנְאֵיהֶם
  choice: उन्होंने अपने से घृणा करनेवालों में से ... को मार डाला
  rationale: שֹׂנְאֵיהֶם को उसके स्पष्ट अर्थ ‘उनसे घृणा करनेवाले’ के रूप में रखा गया है; ב को ‘में से’ द्वारा स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: חֲמִשָּׁה וְשִׁבְעִים אָלֶף
  choice: पचहत्तर हज़ार
  rationale: हिब्रू संख्या-क्रम का स्वाभाविक आधुनिक हिन्दी समतुल्य।
- source_word: וּבַבִּזָּה לֹא שָׁלְחוּ אֶת יָדָם
  choice: लेकिन उन्होंने लूट के माल को हाथ नहीं लगाया
  rationale: בִּזָּה युद्ध में लिया जानेवाला माल है और שׁלח יד यहाँ उसे लेने या हड़पने का मुहावरा है। विरोधी सन्दर्भ में וּ को ‘लेकिन’ से व्यक्त किया गया है।
theological_decisions:
- issue: यहूदियों की हिंसक कार्रवाई का नैतिक प्रस्तुतीकरण
  choice: ‘अपने प्राणों की रक्षा के लिए डटकर खड़े हुए’ द्वारा आत्मरक्षा का स्पष्ट सन्दर्भ बनाए रखा
  alternative: ‘अपने लिए खड़े हुए’ अथवा केवल ‘लड़ने के लिए खड़े हुए’
  rationale: हिब्रू נַפְשָׁם कार्रवाई को उनके प्राणों के संरक्षण से जोड़ता है। अनुवाद न तो हिंसा को छिपाता है, न पाठ में दिए आत्मरक्षा के ढाँचे को हटाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। ‘प्राण’, ‘प्रान्त’ और ‘शत्रु’ कथात्मक-बाइबिलीय गरिमा रखते हैं; वाक्यरचना आधुनिक और प्रवाहपूर्ण रखी गई है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
