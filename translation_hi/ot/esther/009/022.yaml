base_translation:
  language: en
  yaml_path: translation/ot/esther/009/022.yaml
  text: as the days on which the Jews had rest from their enemies[a], and as the month that had been turned for them from sorrow to gladness and from mourning to a good day, to make them days of feasting and gladness, and of sending portions, each man to his neighbor[c][b], and gifts to the poor.
translation:
  language: hi
  text: उन दिनों के रूप में जिनमें यहूदियों को अपने शत्रुओं से चैन मिला था, और उस महीने के रूप में जो उनके लिए दुःख से आनन्द में और शोक से उत्सव के दिन में बदल गया था—कि वे इन्हें भोज और आनन्द के दिन मानें, एक-दूसरे को भोजन के भाग भेजें[a] और निर्धनों को उपहार दें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “भाग भेजें”; यहाँ सम्भवतः उत्सव के अवसर पर भोजन के भाग उपहार में भेजने की बात है।
    reason: cultural_note
lexical_decisions:
- source_word: נָחוּ
  choice: चैन मिला था
  rationale: क्रिया נוח यहाँ शत्रुओं के खतरे से राहत और विश्राम पाने का भाव देती है; आधुनिक हिन्दी में ‘चैन मिला’ स्वाभाविक और सन्दर्भानुकूल है।
- source_word: נֶהְפַּךְ
  choice: बदल गया था
  rationale: הפך के निफ़अल रूप का निष्क्रिय परिवर्तन हिन्दी में स्वाभाविक अकर्मक ‘बदल गया’ से व्यक्त होता है और पूर्ण हो चुके उलटाव को बनाए रखता है।
- source_word: מִיָּגוֹן לְשִׂמְחָה
  choice: शोक से आनन्द में
  rationale: יָגוֹן गहरे दुःख/शोक और שִׂמְחָה आनन्द को दर्शाते हैं; यह जोड़ी मूल के भावात्मक विरोध को स्पष्ट रखती है।
- source_word: וּמֵאֵבֶל לְיוֹם טוֹב
  choice: विलाप से उत्सव के दिन में
  rationale: אֵבֶל को सार्वजनिक शोक या विलाप के रूप में और יוֹם טוֹב को सन्दर्भानुसार उत्सव के दिन के रूप में प्रस्तुत किया गया है; शाब्दिक अर्थ ‘अच्छा दिन’ है, पर यहाँ पर्व का आशय स्पष्ट है।
- source_word: יְמֵי מִשְׁתֶּה וְשִׂמְחָה
  choice: भोज और आनन्द के दिन
  rationale: מִשְׁתֶּה सामूहिक दावत/भोज को दर्शाता है; ‘भोज’ मदिरापान को अनावश्यक रूप से प्रमुख किए बिना उत्सवी अर्थ देता है।
- source_word: וּמִשְׁלוֹחַ מָנוֹת
  choice: भोजन के भाग भेजें
  rationale: מָנוֹת का मूल अर्थ ‘भाग’ है और पर्व के सन्दर्भ में भोजन के हिस्से सम्भावित आशय हैं; स्पष्टता के लिए ‘भोजन के’ जोड़ा गया है, जबकि पादटिप्पणी शाब्दिकता बताती है।
- source_word: אִישׁ לְרֵעֵהוּ
  choice: एक-दूसरे को
  rationale: शाब्दिक रूप ‘एक व्यक्ति अपने साथी को’ है, पर यह वितरणात्मक पारस्परिक मुहावरा है; हिन्दी में ‘एक-दूसरे को’ उसके कार्य और व्यापक सामाजिक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וּמַתָּנוֹת לָאֶבְיוֹנִים
  choice: और निर्धनों को दान दें
  rationale: אֶבְיוֹנִים जरूरतमन्द/निर्धन लोगों को दर्शाता है; ‘दान’ इस प्रसंग में दिए जाने वाले उपहारों का स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: אִישׁ לְרֵעֵהוּ का लिंगयुक्त वितरणात्मक मुहावरा
  choice: एक-दूसरे को
  alternative: हर पुरुष अपने पड़ोसी को
  rationale: इस मुहावरे का आशय पारस्परिक वितरण है, न कि केवल पुरुषों तक आज्ञा सीमित करना। हिन्दी का पारस्परिक रूप मूल के सामाजिक कार्य को सुरक्षित रखता है और कोई अनावश्यक लैंगिक सीमा नहीं जोड़ता।
- issue: יוֹם טוֹב का अर्थ
  choice: उत्सव का दिन
  alternative: अच्छा दिन
  rationale: शाब्दिक अर्थ ‘अच्छा दिन’ है, पर भोज और आनन्द का निकट सन्दर्भ इसे पर्व/उत्सव के दिन के अर्थ में स्पष्ट करता है। मुख्य पाठ में स्वाभाविक अर्थ दिया गया है, बिना किसी विशिष्ट धार्मिक पर्व-संज्ञा को आरोपित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज कथात्मक स्तर रखा गया है। पद पिछले वाक्य से जुड़ा हुआ है, इसलिए आरम्भ में ‘उन दिनों के रूप में’ संरचना को बनाए रखा गया है। ‘चैन मिला’, ‘उत्सव का दिन’ और ‘एक-दूसरे को’ स्वाभाविक हिन्दी के लिए चुने गए हैं; मूल की उलटाव-रचना और उत्सवी-सामाजिक बल सुरक्षित हैं।
