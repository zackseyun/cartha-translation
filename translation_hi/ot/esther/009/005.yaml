base_translation:
  language: en
  yaml_path: translation/ot/esther/009/005.yaml
  text: So the Jews struck all their enemies with the stroke of the sword[a], and with slaughter and destruction[b], and they did to those who hated them as they pleased.
translation:
  language: hi
  text: तब यहूदियों ने अपने सभी शत्रुओं पर तलवार से प्रहार किया[a], और उनका वध और विनाश किया; और जो उनसे घृणा करते थे, उनके साथ जैसा चाहा वैसा किया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “तलवार की मार से।”
    reason: lexical_alternative
  - marker: b
    text: या, “उनकी इच्छा के अनुसार किया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: प्रहार के भाव को ‘तलवार चलाई’ में व्यक्त किया
  rationale: נכה का अर्थ प्रहार करना है। यहाँ आगे आने वाले ‘वध और विनाश’ घातक परिणाम स्पष्ट करते हैं; इसलिए क्रिया को केवल ‘मार डाला’ बनाकर उसके अर्थ को समय से पहले सीमित नहीं किया गया।
- source_word: הַיְּהוּדִים
  choice: यहूदियों
  rationale: एस्तेर के फारसी प्रवासी संदर्भ में יְהוּדִים यहूदी जातीय-धार्मिक समुदाय का स्वाभाविक नाम है।
- source_word: בְּכָל אֹיְבֵיהֶם
  choice: अपने सभी शत्रुओं पर
  rationale: כל की समग्रता को ‘सभी’ से और אֹיְבֵיהֶם को सामान्य तथा स्पष्ट ‘शत्रुओं’ से व्यक्त किया गया।
- source_word: מַכַּת חֶרֶב
  choice: तलवार चलाई
  rationale: शाब्दिक अर्थ ‘तलवार की मार’ है। मुख्य पाठ में स्वाभाविक आधुनिक हिन्दी रखी गई है और शाब्दिक रूप को पाद-टिप्पणी में सुरक्षित किया गया है।
- source_word: וְהֶרֶג וְאַבְדָן
  choice: वध और विनाश
  rationale: दोनों संज्ञाओं को अलग रखकर मूल पाठ में हिंसक शब्दों के संचय और उसकी तीव्रता को न तो नरम किया गया, न बढ़ाया गया।
- source_word: בְשֹׂנְאֵיהֶם
  choice: अपने से घृणा करने वालों के साथ
  rationale: यह participial रूप पहले आए ‘शत्रुओं’ से अलग शब्द है; इसलिए उस lexical distinction को हिन्दी में भी बनाए रखा गया।
- source_word: כִּרְצוֹנָם
  choice: जैसा चाहा वैसा
  rationale: शाब्दिक अर्थ ‘अपनी इच्छा के अनुसार’ है। चुना गया रूप वर्तमान हिन्दी में स्वाभाविक है और उनके विवेकानुसार कार्य करने का भाव बनाए रखता है।
theological_decisions:
- issue: युद्धकालीन हिंसा के वर्णन को न नरम करना, न बढ़ाना
  choice: ‘तलवार’, ‘वध’ और ‘विनाश’—तीनों कठोर तत्व स्पष्ट रूप से बनाए रखे गए
  alternative: इसे केवल ‘हरा दिया’ कहना, अथवा हर पद को ‘सर्वनाश कर दिया’ जैसे अधिक व्याख्यात्मक शब्दों से तीव्र करना
  rationale: इब्रानी पाठ तलवार की मार, वध और विनाश के शब्दों को एकत्र करता है। अनुवाद उसी गंभीरता को सीधे व्यक्त करता है, पर lexical evidence से आगे नहीं जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गंभीर और कथात्मक शैली अपनाई गई है। ‘तलवार की मार’ की अस्वाभाविक कठोरता को मुख्य पाठ में ‘तलवार चलाई’ से व्यक्त करते हुए उसका शाब्दिक रूप पाद-टिप्पणी में दिया गया है। ‘शत्रुओं’ और ‘घृणा करने वालों’ का मूल lexical भेद सुरक्षित रखा गया है।
