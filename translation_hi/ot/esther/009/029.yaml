base_translation:
  language: en
  yaml_path: translation/ot/esther/009/029.yaml
  text: Then Esther the queen[a], daughter of Abihail, and Mordecai the Jew wrote with full authority to confirm this second letter of Purim.
translation:
  language: hi
  text: तब रानी एस्तेर, जो अबीहैल की बेटी थी, और यहूदी मोर्दकै ने पूरे अधिकार के साथ[a] पूरीम के इस दूसरे पत्र की पुष्टि करने के लिए लिखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “संपूर्ण अधिकार के साथ” अथवा “पूरे बल के साथ।” हिब्रू पदबंध पत्र के आधिकारिक बल पर जोर देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכְתֹּב
  choice: तब ... ने ... लिखा
  rationale: वाव-क्रमवाचक कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में क्रम दिखाता है। हिब्रू क्रिया स्त्रीलिंग एकवचन है और एस्तेर से मेल खाती है, जबकि मोर्दकै भी संयुक्त सहभागी के रूप में उल्लिखित है; हिन्दी वाक्य दोनों को कर्ता के रूप में स्वाभाविक ढंग से रखता है।
- source_word: אֶסְתֵּר הַמַּלְכָּה בַת אֲבִיחַיִל
  choice: अबीहैल की बेटी रानी एस्तेर
  rationale: वंश-संबंध और राजकीय पदवी दोनों सुरक्षित रहते हैं, तथा शब्दक्रम आधुनिक हिन्दी में सहज है।
- source_word: וּמָרְדֳּכַי הַיְּהוּדִי
  choice: और यहूदी मोर्दकै
  rationale: यहाँ יְהוּדִי फारसी परिवेश में जातीय पहचान बताता है; ‘यहूदी’ हिन्दी में प्रचलित और प्रसंगानुकूल है।
- source_word: אֶת כָּל תֹּקֶף
  choice: पूरे अधिकार के साथ
  rationale: תֹּקֶף सामर्थ्य, प्रभाव या आधिकारिक बल का बोध करा सकता है। पत्र जारी करने के प्रसंग में यह पदबंध उसके पूर्ण आधिकारिक बल को व्यक्त करता है।
- source_word: לְקַיֵּם
  choice: पुष्ट करने के लिए
  rationale: उद्देश्यवाचक रूप पहले से स्थापित पूरीम-विधान से संबंधित पत्र को प्रमाणित, दृढ़ या प्रभावी करने का भाव देता है; ‘पुष्ट करना’ इस दायरे को संक्षेप में बनाए रखता है।
- source_word: אִגֶּרֶת הַפּוּרִים הַזֹּאת הַשֵּׁנִית
  choice: पूरीम के इस दूसरे पत्र
  rationale: संबंधवाचक हिब्रू रचना, संकेतवाचक ‘इस’ और क्रमवाचक ‘दूसरे’ को निकट औपचारिक हिन्दी में सुरक्षित रखा गया है।
