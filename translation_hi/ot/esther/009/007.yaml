- source_word: פַּרְשַׁנְדָּתָא
  choice: पर्शन्दाता
  rationale: यह संभवतः फ़ारसी मूल का व्यक्तिवाचक नाम है; अर्थानुवाद के बजाय इब्रानी रूप के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: דַּלְפוֹן
  choice: दल्पोन
  rationale: व्यक्तिवाचक नाम को इब्रानी व्यंजन और स्वर-रूप के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: אַסְפָּתָא
  choice: अस्पाता
  rationale: व्यक्तिवाचक नाम का अर्थानुवाद नहीं किया गया; इब्रानी रूप के निकट देवनागरी लिप्यंतरण अपनाया गया है।
