base_translation:
  language: en
  yaml_path: translation/ot/esther/009/012.yaml
  text: Then the king said to Esther the queen[a], “In Susa the citadel the Jews have killed and destroyed five hundred men, along with the ten sons of Haman. What then have they done in the rest of the king’s provinces? Now what is your petition? It will be granted to you. And what is your further request? It will be done.”
translation:
  language: hi
  text: तब राजा ने रानी एस्तेर से कहा, “शूशन के दुर्ग में यहूदियों ने पाँच सौ पुरुषों और हामान के दस पुत्रों को मार डाला और नष्ट कर दिया है। तो फिर राजा के बाकी प्रान्तों में उन्होंने क्या किया है?[a] अब तुम्हारी क्या विनती है? वह तुम्हें दी जाएगी। और इसके अतिरिक्त तुम्हारा क्या अनुरोध है? वह पूरा किया जाएगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “राजा के बाकी प्रान्तों में उन्होंने क्या किया है?” इब्रानी प्रश्न को अधिक सीधे ढंग से भी पढ़ा जा सकता है; मुख्य पाठ में “तो फिर” शूशन की सूचना से राजा द्वारा निकाले गए निष्कर्ष को प्रकट करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשׁוּשַׁן הַבִּירָה
  choice: शूशन के दुर्ग में
  rationale: בִּירָה फ़ारसी राजधानी के किलेबंद राजकीय परिसर को सूचित करता है; ‘दुर्ग’ संक्षिप्त, स्वाभाविक और ‘महल’ से अधिक सटीक है।
- source_word: הָרְגוּ ... וְאַבֵּד
  choice: मारकर नष्ट कर दिया है
  rationale: दोनों इब्रानी क्रियाओं की संचयी तीव्रता बनाए रखी गई है; ‘मारकर नष्ट’ हिन्दी में सहज रहते हुए दूसरे क्रियापद को लोप नहीं करता।
- source_word: חֲמֵשׁ מֵאוֹת אִישׁ
  choice: पाँच सौ पुरुषों
  rationale: संख्या के बाद אִישׁ वितरणात्मक एकवचन है और यहाँ पुरुषों को सूचित करता है; अनावश्यक लिंग-तटस्थीकरण से बचा गया है।
- source_word: וְאֵת עֲשֶׂרֶת בְּנֵי הָמָן
  choice: और हामान के दस पुत्रों को
  rationale: अतिरिक्त प्रत्यक्ष कर्म को सरल हिन्दी समन्वय से स्पष्ट रखा गया है।
- source_word: בִּשְׁאָר מְדִינוֹת הַמֶּלֶךְ
  choice: राजा के बाकी प्रान्तों में
  rationale: מְדִינוֹת का फ़ारसी साम्राज्य-संदर्भ में उपयुक्त अर्थ ‘प्रान्त’ और שְׁאָר का स्वाभाविक अर्थ ‘बाकी’ है।
- source_word: מֶה עָשׂוּ
  choice: तो फिर ... उन्होंने क्या किया होगा?
  rationale: मूल प्रश्न की अनुमानसूचक/वक्तृता-प्रधान शक्ति को ‘तो फिर’ और ‘क्या किया होगा’ व्यक्त करते हैं, जबकि उसका प्रश्नरूप बना रहता है।
- source_word: שְּׁאֵלָתֵךְ
  choice: तुम्हारी क्या विनती
  rationale: एस्तेर में यह शब्द राजा के सामने औपचारिक निवेदन के लिए आता है; ‘विनती’ दरबारी प्रसंग में स्वाभाविक है और अगले निकटार्थक शब्द से कुछ भेद रखता है।
- source_word: וְיִנָּתֵן לָךְ
  choice: वह तुम्हें दी जाएगी
  rationale: मूल के निष्क्रिय ‘तुम्हें दी जाएगी’ को निकटता से सुरक्षित रखा गया है; सन्दर्भ से स्पष्ट है कि विनती स्वीकार की जाएगी।
- source_word: בַּקָּשָׁתֵךְ עוֹד
  choice: तुम्हारा आगे क्या अनुरोध
  rationale: ‘अनुरोध’ निकटार्थकता रखते हुए שאלה से शैलीगत भेद देता है, और ‘आगे’ עוֹד की अतिरिक्तता व्यक्त करता है।
- source_word: וְתֵעָשׂ
  choice: वह पूरा किया जाएगा
  rationale: सन्दर्भ में अनुरोध को कार्यरूप देने का भाव है; ‘पूरा किया जाएगा’ हिन्दी में स्वाभाविक निष्क्रिय अभिव्यक्ति है।
