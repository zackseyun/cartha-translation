source:
  edition: WLC
  text: כִּֽי גָ֤דוֹל מָרְדֳּכַי֙ בְּ/בֵ֣ית הַ/מֶּ֔לֶךְ וְ/שָׁמְע֖/וֹ הוֹלֵ֣ךְ בְּ/כָל הַ/מְּדִינ֑וֹת כִּֽי הָ/אִ֥ישׁ מָרְדֳּכַ֖י הוֹלֵ֥ךְ וְ/גָדֽוֹל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/004.yaml
  text: For Mordecai was great in the king’s house[a], and the report about him was spreading through all the provinces[b], for the man Mordecai was becoming greater and greater.
translation:
  language: hi
  text: क्योंकि राजा के भवन में मोर्दकै महान था, और उसके विषय में समाचार सभी प्रान्तों में फैलता जा रहा था; क्योंकि मोर्दकै नाम का वह व्यक्ति अधिकाधिक महान होता जा रहा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह संयोजक पिछले कथन का कारण बताता है; हिन्दी में ‘क्योंकि’ उसके व्याख्यात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: גָדוֹל
  choice: बड़ा मान था
  rationale: यहाँ विशेषण पद, प्रतिष्ठा और प्रभाव की महानता बताता है। केवल ‘महान था’ की अपेक्षा ‘बड़ा मान था’ राजकीय परिवेश में आशय अधिक स्वाभाविक ढंग से पहुँचाता है, पर इसे केवल राजनीतिक शक्ति तक सीमित नहीं करता।
- source_word: בְּבֵית הַמֶּלֶךְ
  choice: राजा के भवन में
  rationale: यह मूल के ‘राजा के घर में’ बिंब को बनाए रखता है और राजमहल अथवा राजदरबार के व्यापक आशय को अनावश्यक रूप से संकीर्ण नहीं करता।
- source_word: שָׁמְעוֹ
  choice: उसकी ख्याति
  rationale: शब्द का अर्थ उसके विषय में फैली खबर, प्रतिष्ठा या ख्याति हो सकता है। इस प्रसंग में प्रभाव के प्रान्तों में फैलने के कारण ‘ख्याति’ सहज है, यद्यपि ‘उसके विषय की खबर’ भी संभव है।
- source_word: הוֹלֵךְ
  choice: फैलती जा रही थी
  rationale: ‘ख्याति’ के साथ यह कृदन्त निरन्तर विस्तार को दर्शाता है; हिन्दी में ‘फैलती जा रही थी’ इस गतिशील और जारी प्रक्रिया को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּכָל הַמְּדִינוֹת
  choice: सभी प्रान्तों में
  rationale: एस्तेर के फ़ारसी प्रशासनिक संदर्भ में מְדִינוֹת के लिए ‘प्रान्त’ उपयुक्त है; ‘सभी ... में’ उसके व्यापक प्रसार को स्पष्ट करता है।
- source_word: הָאִישׁ מָרְדֳּכַי
  choice: वह पुरुष मोर्दकै
  rationale: मूल में ‘पुरुष’ लेख सहित बलाघातपूर्ण ढंग से आया है। इसे रखना स्रोत की औपचारिक emphatic शैली को बचाता है, यद्यपि हिन्दी में यह सामान्य बोलचाल से कुछ अधिक साहित्यिक है।
- source_word: הוֹלֵךְ וְגָדוֹל
  choice: अधिकाधिक महान होता जा रहा था
  rationale: यह इब्रानी मुहावरा प्रतिष्ठा और प्रभाव में निरन्तर वृद्धि व्यक्त करता है। ‘अधिकाधिक ... होता जा रहा था’ उस क्रमिक तीव्रता को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
