  text: उसी दिन शूशन के दुर्ग में मारे गए लोगों की संख्या राजा के सामने पहुँची।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שׁוּשַׁן הַבִּירָה
  choice: शूशन के दुर्ग में
  rationale: הַבִּירָה यहाँ राजकीय दुर्ग या गढ़वाले प्रशासनिक परिसर को सूचित करता है; ‘दुर्ग’ संक्षिप्त, स्वाभाविक और प्रसंगानुकूल है।
- source_word: בָּא ... לִפְנֵי הַמֶּלֶךְ
  choice: राजा के सामने पहुँची
  rationale: इब्रानी में कर्ता ‘संख्या’ है और क्रिया का शाब्दिक भाव ‘आई/पहुँची’ है। ‘पहुँची’ आधुनिक हिन्दी में सूचना के राजा तक पहुँचने का भाव स्वाभाविक रूप से रखता है, बिना कर्मवाच्य जोड़ने के।
- source_word: מִסְפַּר הַהֲרוּגִים
  choice: मारे गए लोगों की संख्या
  rationale: यह वाक्यांश मृतकों की गणना बताता है; हिन्दी में यह स्पष्ट और मूल संरचना के निकट है।
