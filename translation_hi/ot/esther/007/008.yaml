  yaml_path: translation/ot/esther/007/008.yaml
  text: The king returned from the palace garden to the house of the wine feast, and Haman was falling on the couch where Esther was. Then the king said, “Will he even assault the queen while I am in the house?” As the word went out from the king’s mouth, they covered Haman’s face.
translation:
  language: hi
  text: राजा महल के बगीचे से दाखमधु की दावत के भवन में लौट आया। हामान उस पलंग पर गिर रहा था, जिस पर एस्तेर थी। तब राजा ने कहा, “क्या यह मेरे ही भवन में रानी के साथ ज़ोर-ज़बरदस्ती भी करेगा?” राजा के मुँह से यह बात निकलते ही उन्होंने हामान का मुँह ढक दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּית מִשְׁתֵּה הַיַּיִן
  choice: दाखमधु की दावत का भवन
  rationale: शाब्दिक संरचना ‘दाखमधु की दावत का घर/भवन’ को स्वाभाविक और गरिमापूर्ण हिन्दी में रखा गया है।
- source_word: נֹפֵל
  choice: गिर रहा था
  rationale: हिब्रू वर्तमान कृदन्त चल रही क्रिया का चित्र देता है; इसलिए ‘गिर रहा था’ मूल की गतिशीलता और सम्भावित अस्पष्टता बनाए रखता है।
- source_word: הֲגַם לִכְבּוֹשׁ
  choice: क्या यह ... बल भी चलाएगा?
  rationale: כָּבַשׁ का मूल भाव वश में करने, दबाने या बल प्रयोग करने का है। प्रसंग यौन आक्रमण का संकेत दे सकता है, पर शब्द स्वयं उसे पूरी तरह स्पष्ट नहीं करता; ‘बल चलाना’ उस तनाव को सुरक्षित रखता है।
- source_word: חָפוּ
  choice: उन्होंने ... ढक दिया
  rationale: हिब्रू में क्रिया बहुवचन है, पर कर्ता अनिर्दिष्ट है; हिन्दी में स्वाभाविक अनिर्दिष्ट बहुवचन ‘उन्होंने’ रखा गया है।
theological_decisions:
- issue: राजा के आरोप की प्रकृति
  choice: रानी पर बल भी चलाएगा
  alternative: रानी का यौन उत्पीड़न भी करेगा / रानी को भी वश में करेगा
  rationale: राजा की उक्ति में आरोपात्मक यौन संकेत और כבש का व्यापक बलपूर्वक-वशकरण अर्थ दोनों उपस्थित हैं। चुना गया रूप किसी अतिरिक्त कानूनी या सम्प्रदायगत अर्थ को आरोपित किए बिना दोनों को स्थान देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; राजदरबार के प्रसंग के अनुरूप गरिमापूर्ण, पर सामान्य पाठक के लिए सहज। ‘पलंग’ भोज-कक्ष के टिकने/लेटने वाले आसन को सरलता से व्यक्त करता है।
