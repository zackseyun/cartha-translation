base_translation:
  language: en
  yaml_path: translation/ot/esther/007/009.yaml
  text: Then Harbonah[a], one of the eunuchs before the king, said, “Also, behold, the gallows that Haman made for Mordecai, who spoke good for the king, is standing at Haman’s house, fifty cubits high.” And the king said[c][b], “Hang him on it.”
translation:
  language: hi
  text: तब राजा के सामने रहने वाले खोजों में से एक, हर्बोना ने कहा, “और देखिए—हामान ने उस मर्दकै के लिए जो काठ[a] बनाया था, जिसने राजा के हित में बात कही थी, वह हामान के घर पर खड़ा है; उसकी ऊँचाई पचास हाथ है।” तब राजा ने कहा, “हामान को उसी पर लटका दो[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में “पेड़” या “लकड़ी” है; यहाँ वध के लिए तैयार की गई लकड़ी की संरचना अभिप्रेत है।
    reason: lexical_alternative
  - marker: b
    text: संभवतः “उसी पर बेध दो”; इब्रानी अभिव्यक्ति लकड़ी की संरचना पर लटकाने का व्यापक अर्थ रखती है और बाद के समय की फाँसी की बनावट को निश्चित नहीं करती।
    reason: lexical_alternative
lexical_decisions:
- source_word: חַרְבוֹנָה
  choice: हर्बोना
  rationale: व्यक्तिनाम को मूल उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: הַסָּרִיסִים
  choice: खोजों
  rationale: राजदरबार के प्रसंग में शब्द का सीधा अर्थ बधिया किए गए पुरुष राजसेवक है; केवल ‘अधिकारी’ कहने से यह विशिष्ट अर्थ मिट सकता है।
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: राजा के सामने उपस्थित
  rationale: यह राजकीय उपस्थिति और सेवा का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: גַּם הִנֵּה
  choice: यह भी देखिए—
  rationale: ‘גם’ का योगात्मक बल और ‘הנה’ का ध्यान आकर्षित करने वाला भाव दोनों सुरक्षित हैं।
- source_word: הָעֵץ
  choice: काठ
  rationale: मूल शब्द का अर्थ ‘पेड़/लकड़ी’ है और यहाँ लकड़ी की वध-संरचना अभिप्रेत है। ‘फाँसी का तख्ता’ आधुनिक ढाँचे को अनावश्यक रूप से निश्चित कर देता; ‘काठ’ मूल की व्यापकता बनाए रखता है।
- source_word: עָשָׂה ... לְמָרְדֳּכַי
  choice: मोर्दकै के लिए ... बनवाया था
  rationale: हामान द्वारा अपने आदेश से संरचना तैयार कराने का स्वाभाविक हिन्दी भाव है; ‘के लिए’ मूल के उद्देश्यसूचक לְ को बनाए रखता है।
- source_word: דִּבֶּר טוֹב עַל הַמֶּלֶךְ
  choice: राजा के हित में बात कही थी
  rationale: वाक्यांश का अर्थ राजा के लाभ या पक्ष में बोलना है; इससे षड्यंत्र उजागर करने की ओर संकेत रहता है, पर उसे विस्तार से नहीं जोड़ा जाता।
- source_word: בְּבֵית הָמָן
  choice: हामान के घर पर
  rationale: संरचना हामान के निवास-परिसर में या उसके यहाँ खड़ी होने का स्थान-सूचक भाव देता है।
- source_word: גָּבֹהַּ חֲמִשִּׁים אַמָּה
  choice: उसकी ऊँचाई पचास हाथ है
  rationale: प्राचीन माप ‘अम्मा’ के लिए प्रचलित बाइबलीय हिन्दी ‘हाथ’ रखा गया है; आधुनिक अनुमान मुख्य पाठ में नहीं जोड़ा गया।
- source_word: תְּלֻהוּ עָלָיו
  choice: हामान को उसी पर लटका दो
  rationale: सर्वनाम का संकेत प्रसंग से हामान की ओर है; नाम स्पष्ट करने से हिन्दी में अस्पष्टता घटती है। ‘लटका दो’ मूल क्रिया का व्यापक अर्थ रखता है, जबकि वास्तविक विधि सूली/खूँटे पर चढ़ाना भी हो सकती थी।
theological_decisions:
- issue: वध की विधि
  choice: लटका दो
  alternative: उसी पर चढ़ा दो / उसमें बेध दो
  rationale: इब्रानी शब्दावली लकड़ी की संरचना पर शरीर को लटकाने को बताती है, पर ठीक तकनीक निश्चित नहीं करती। मुख्य पाठ में पारंपरिक और व्यापक अभिव्यक्ति रखकर विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘खोजा’ सामान्य पाठक के लिए ऐतिहासिक राजदरबारी भूमिका को स्पष्ट करता है। लम्बे इब्रानी वाक्य को पठनीय हिन्दी के लिए छोटे वाक्यों में बाँटा गया है, पर सूचना-क्रम और बल यथासंभव सुरक्षित हैं।
