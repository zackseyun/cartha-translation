base_translation:
  language: en
  yaml_path: translation/ot/esther/007/005.yaml
  text: Then King Ahasuerus said to Esther the queen[a], “Who is he, and where is he[b], who has filled his heart to do this?”
translation:
  language: hi
  text: तब राजा अहश्वेरोश ने रानी एस्तेर से कहा, “वह कौन है, और वह कहाँ है[a], जिसने ऐसा करने का साहस किया[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, कम सम्भावित रूप से, “और वह कौन-सा व्यक्ति है?”—यदि इस वाक्यांश को उसके स्थान के बजाय उसकी पहचान पूछने वाला समझा जाए।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक रूप से, “जिसने ऐसा करने के लिए अपने हृदय को भर लिया”; यह इब्रानी मुहावरा ऐसा काम करने का साहस या दुस्साहस करने के अर्थ में है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: तब ... ने ... पूछा
  rationale: पहला क्रियापद कथा को आगे बढ़ाता है; दूसरा उसी कथन का परिचय देता है। प्रश्न के संदर्भ में आधुनिक हिन्दी में ‘पूछा’ स्वाभाविक है और अनावश्यक ‘कहा और कहा’ पुनरावृत्ति से बचाता है।
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: राजा क्षयर्ष
  rationale: राजकीय उपाधि को नाम से पहले रखकर स्वाभाविक हिन्दी क्रम अपनाया गया है; אֲחַשְׁוֵרוֹשׁ के लिए प्रचलित हिन्दी बाइबलीय रूप ‘क्षयर्ष’ रखा गया है।
- source_word: לְאֶסְתֵּר הַמַּלְכָּה
  choice: रानी एस्तेर से
  rationale: हिब्रू का आशय ‘एस्तेर रानी’ है; हिन्दी में पदवी के साथ ‘रानी एस्तेर’ अधिक स्वाभाविक है।
- source_word: מִי הוּא זֶה
  choice: वह कौन है
  rationale: यह व्यक्ति की पहचान पर बल देने वाला प्रश्न है; मूल में स्पष्ट न होने के कारण ‘मनुष्य’ या ‘पुरुष’ नहीं जोड़ा गया।
- source_word: וְאֵי זֶה הוּא
  choice: और कहाँ है वह
  rationale: אֵי का सामान्य अर्थ स्थानवाचक ‘कहाँ’ है। शब्दक्रम में ‘वह’ को अंत में रखकर हिब्रू के जोर को कुछ हद तक बनाए रखा गया है; वैकल्पिक पहचानवाचक अर्थ पादटिप्पणी में दिया गया है।
- source_word: אֲשֶׁר מְלָאוֹ לִבּוֹ
  choice: जिसने ... साहस किया
  rationale: शाब्दिक हृदय-वाक्यांश हिब्रू मुहावरा है, जिसका प्रसंगगत अर्थ स्वयं को ऐसा काम करने के लिए दुस्साहसी बनाना है। आधुनिक हिन्दी में ‘साहस किया’ अर्थ को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לַעֲשׂוֹת כֵּן
  choice: ऐसा करने
  rationale: כֵּן पिछले कथन में बताए गए कार्य की ओर संकेत करता है; ‘ऐसा करने’ हिन्दी में संक्षिप्त और स्वाभाविक है।
