source:
  edition: WLC
  text: כִּ֤י נִמְכַּ֨רְנוּ֙ אֲנִ֣י וְ/עַמִּ֔/י לְ/הַשְׁמִ֖יד לַ/הֲר֣וֹג וּ/לְ/אַבֵּ֑ד וְ֠/אִלּוּ לַ/עֲבָדִ֨ים וְ/לִ/שְׁפָח֤וֹת נִמְכַּ֨רְנוּ֙ הֶחֱרַ֔שְׁתִּי כִּ֣י אֵ֥ין הַ/צָּ֛ר שֹׁוֶ֖ה בְּ/נֵ֥זֶק הַ/מֶּֽלֶךְ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/esther/007/004.yaml
  text: For we have been sold[a], I and my people, to be destroyed, to be killed, and to perish. But if we had been sold as male servants and female servants, I would have kept silent, for the adversary is not worth the damage to the king.
translation:
  language: hi
  text: क्योंकि हम—मैं और मेरे लोग—बेच दिए गए हैं, विनाश किए जाने, मार डाले जाने और मिटा दिए जाने के लिए। परन्तु यदि हम दास-दासियों के रूप में बेचे गए होते, तो मैं चुप रहती, क्योंकि शत्रु राजा की हानि की भरपाई नहीं कर सकता।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि शत्रु राजा को होनेवाली हानि के बराबर नहीं है।” इब्रानी अंतिम उपवाक्य कठिन है। ‘हानि’ का अर्थ क्षति, चोट या आर्थिक नुकसान हो सकता है।
    reason: कठिन इब्रानी वाक्य के वैकल्पिक, अधिक तुलनात्मक अर्थ और נזק के व्यापक अर्थक्षेत्र को सुरक्षित रखता है।
lexical_decisions:
- source_word: נִמְכַּרְנוּ
  choice: हम ... बेच दिए गए हैं
  rationale: מכר के निफ़अल रूप का स्वाभाविक अर्थ ‘बेच दिया जाना’ है। इससे व्यापारिक रूपक बना रहता है और अगले वाक्य में वास्तविक दासता की काल्पनिक स्थिति के साथ विरोध स्पष्ट होता है।
- source_word: עַמִּי
  choice: मेरी प्रजा
  rationale: यहाँ עַם एस्तेर के जातीय-राष्ट्रीय समुदाय को दर्शाता है। राजदरबार के प्रसंग में ‘मेरी प्रजा’ स्वाभाविक और गरिमापूर्ण है।
- source_word: לְהַשְׁמִיד לַהֲרֹג וּלְאַבֵּד
  choice: हमारा विनाश किया जाए, हमें मार डाला जाए और मिटा दिया जाए
  rationale: तीन निकटार्थक क्रियाओं की संचयी वक्तृता को बनाए रखा गया है। हिंदी में कर्मवाच्य प्रयोग पीड़ित समुदाय के दृष्टिकोण और आदेश के उद्देश्य दोनों को स्पष्ट करता है।
- source_word: וְאִלּוּ
  choice: यदि ... होता
  rationale: यह वास्तविक परिस्थिति के विपरीत एक काल्पनिक स्थिति प्रस्तुत करता है। हिंदी की शर्तवाचक रचना उस प्रतिकल्पित भाव को स्वाभाविक रूप से व्यक्त करती है।
- source_word: לַעֲבָדִים וְלִשְׁפָחוֹת
  choice: दास-दासियों के रूप में
  rationale: इब्रानी में पुरुष और स्त्री दासों के अलग शब्द हैं। ‘दास-दासियाँ’ बंधुआ अवस्था को स्पष्ट रखते हुए हिंदी में संक्षिप्त और स्वाभाविक है।
- source_word: הֶחֱרַשְׁתִּי
  choice: मैं चुप रहती
  rationale: यह काल्पनिक परिणाम को व्यक्त करता है; स्त्री वक्ता एस्तेर के अनुसार ‘रहती’ रखा गया है।
- source_word: הַצָּר
  choice: वह शत्रु
  rationale: शब्द hostile opponent या संकट पहुँचानेवाले व्यक्ति को दर्शाता है। ‘वह शत्रु’ हामान की ओर संकेत करता है, पर शब्द को किसी अधिक विशिष्ट व्याख्या तक सीमित नहीं करता।
- source_word: שֹׁוֶה
  choice: के बराबर नहीं ठहरता
  rationale: שוה समान मूल्य या तुल्यता का भाव देता है। यह चयन कठिन इब्रानी वाक्य की तुलना-मूलक भाषा को पूरी तरह व्याख्यायित किए बिना बनाए रखता है।
- source_word: בְּנֵזֶק הַמֶּלֶךְ
  choice: राजा को होनेवाली हानि
  rationale: נזק आर्थिक नुकसान, क्षति या व्यापक हानि को व्यक्त कर सकता है। यह अनुवाद अर्थक्षेत्र को खुला रखता है।
theological_decisions:
- issue: अंतिम उपवाक्य का अर्थ
  choice: ‘वह शत्रु राजा को होनेवाली हानि के बराबर नहीं ठहरता’
  alternative: ‘शत्रु राजा की हानि की भरपाई नहीं कर सकता’ अथवा ‘हमारा कष्ट राजा की हानि के योग्य नहीं होता’
  rationale: इब्रानी अंतिम उपवाक्य अत्यंत संक्षिप्त और अर्थ की दृष्टि से कठिन है। मुख्य पाठ शब्दक्रम और तुल्यता के भाव के निकट रहता है; पादटिप्पणी נזק की अर्थगत व्यापकता को सुरक्षित रखती है और किसी एक राजनीतिक या आर्थिक व्याख्या को निर्णायक नहीं बनाती।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण, सहज राजदरबारी स्वर रखा गया है। ‘हम—मैं और मेरी प्रजा—’ मूल के बहुवचन और उसके स्पष्टीकरण दोनों को उभारता है। विनाश की तीन क्रियाएँ वक्तृता की तीव्रता बनाए रखती हैं; ‘दास-दासियाँ’ बंधुआ अवस्था को नरम किए बिना सामान्य पाठक के लिए स्पष्ट है।
