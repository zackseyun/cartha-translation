source:
  edition: WLC
  text: וַ/יִּתְלוּ֙ אֶת הָמָ֔ן עַל הָ/עֵ֖ץ אֲשֶׁר הֵכִ֣ין לְ/מָרְדֳּכָ֑י וַ/חֲמַ֥ת הַ/מֶּ֖לֶךְ שָׁכָֽכָה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/esther/007/010.yaml
  text: So they hanged Haman on the gallows that he had prepared for Mordecai[a], and the king’s wrath subsided.
translation:
  language: hi
  text: तब उन्होंने हामान को उस लकड़ी के खंभे पर लटका दिया, जिसे उसने मोर्दकै के लिए तैयार किया था[a]। और राजा का क्रोध शांत हो गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्होंने हामान को उस खंभे/पेड़ पर बेध दिया, जिसे उसने मोर्दकै के लिए तैयार किया था।” हिब्रानी शब्द का अर्थ “पेड़,” “लकड़ी” या “लकड़ी का खंभा” हो सकता है, और क्रिया किसी शरीर को लटकाने के व्यापक अर्थ में भी प्रयुक्त होती है। मृत्यु-दंड की ठीक विधि निश्चित नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְלוּ
  choice: उन्होंने ... लटका दिया
  rationale: תלה का मूल अर्थ किसी को या किसी वस्तु को लटकाना अथवा टाँगना है। यह अनुवाद क्रिया का सामान्य अर्थ रखता है और मृत्यु-दंड की ठीक विधि को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: הָמָן
  choice: हामान
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: עַל הָעֵץ
  choice: लकड़ी के खंभे पर
  rationale: עֵץ का अर्थ पेड़, लकड़ी या लकड़ी का खंभा हो सकता है। इस प्रसंग में यह मृत्यु-दंड के लिए तैयार किए गए लकड़ी के ढाँचे को दर्शाता है; 'लकड़ी का खंभा' हिब्रानी की व्यापकता को 'फाँसी का तख्ता' की अपेक्षा बेहतर बनाए रखता है।
- source_word: אֲשֶׁר הֵכִין לְמָרְדֳּכָי
  choice: जिसे उसने मोर्दकै के लिए तैयार करवाया था
  rationale: הכין का अर्थ तैयार करना या तैयार कराना है। पूर्व प्रसंग के अनुसार हामान ने इसे बनवाने का आदेश दिया था, इसलिए हिन्दी में प्रयोजक रूप स्वाभाविक है और कथात्मक विडंबना भी स्पष्ट रहती है।
- source_word: וַחֲמַת הַמֶּלֶךְ
  choice: तब राजा का क्रोध
  rationale: חֵמָה तीव्र रोष या क्रोध को व्यक्त करता है। 'क्रोध' आधुनिक, गरिमापूर्ण और सहज हिन्दी है।
- source_word: שָׁכָכָה
  choice: शांत हो गया
  rationale: שׁכך का अर्थ घटना, थमना या शांत होना है। 'शांत हो गया' सामान्य आधुनिक हिन्दी में स्वाभाविक रूप से भाव के थमने को व्यक्त करता है।
theological_decisions:
- issue: हामान को दिए गए मृत्यु-दंड की सटीक विधि
  choice: मुख्य पाठ में 'लकड़ी के खंभे पर लटका दिया'
  alternative: '''फाँसी पर चढ़ा दिया'' या ''खंभे पर बेध दिया'''
  rationale: हिब्रानी תלה और עֵץ शरीर को लकड़ी पर लटकाने की बात करते हैं, पर यह निश्चित नहीं करते कि आधुनिक अर्थ में फाँसी दी गई थी या खंभे पर बेधा गया था। इसलिए अस्पष्टता मुख्य पाठ और टिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण कथात्मक शैली। 'लकड़ी का खंभा' चुना गया है ताकि मूल हिब्रानी की शब्दगत व्यापकता बनी रहे; पादटिप्पणी में वैकल्पिक मृत्यु-दंड विधि स्पष्ट की गई है।
