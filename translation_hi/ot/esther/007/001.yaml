base_translation:
  language: en
  yaml_path: translation/ot/esther/007/001.yaml
  text: So the king and Haman came to drink with Queen Esther[a].
translation:
  language: hi
  text: तब राजा और हामान रानी एस्तेर के साथ पीने आए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: तब … आए
  rationale: वाव-युक्त कथात्मक क्रिया घटनाक्रम को आगे बढ़ाती है। बहुवचन कर्ता ‘राजा और हामान’ के साथ ‘आए’ स्वाभाविक है; ‘तब’ क्रमिक संबंध व्यक्त करता है।
- source_word: הַמֶּלֶךְ
  choice: राजा
  rationale: पहले से पहचाने गए फ़ारसी राजा के लिए निश्चित अर्थ संदर्भ से स्पष्ट है; हिन्दी में यहाँ अलग निश्चित उपपद आवश्यक नहीं।
- source_word: וְהָמָן
  choice: और हामान
  rationale: संयोजक का सीधा अनुवाद ‘और’ है तथा नाम का प्रचलित हिन्दी लिप्यंतरण ‘हामान’ रखा गया है।
- source_word: לִשְׁתּוֹת
  choice: पीने
  rationale: שׁתה का मूल अर्थ ‘पीना’ है। प्रसंग भोज का है, फिर भी मूल पाठ न तो ‘दावत करने’ और न ही ‘दाखमधु पीने’ को स्पष्ट रूप से कहता है, इसलिए उसे नहीं जोड़ा गया।
- source_word: עִם
  choice: के साथ
  rationale: संगति बताने वाले इस संबंधबोधक का स्वाभाविक हिन्दी रूप ‘के साथ’ है।
- source_word: אֶסְתֵּר הַמַּלְכָּה
  choice: रानी एस्तेर
  rationale: इब्रानी का शब्दक्रम शाब्दिक रूप से ‘एस्तेर रानी’ है, पर आधुनिक हिन्दी में उपाधि को नाम से पहले रखना अधिक स्वाभाविक है और अर्थ अपरिवर्तित रहता है।
