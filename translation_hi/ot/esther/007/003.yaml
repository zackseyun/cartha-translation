base_translation:
  language: en
  yaml_path: translation/ot/esther/007/003.yaml
  text: Then Queen Esther answered and said[a], “If I have found favor in your eyes, O king, and if it pleases the king, let my life be given me at my petition, and my people at my request.”
translation:
  language: hi
  text: तब रानी एस्तेर ने उत्तर दिया, “हे राजा, यदि आपकी दृष्टि में मुझ पर कृपा हुई है और यदि राजा को यह अच्छा लगे, तो मेरी विनती पर मेरा जीवन और मेरे निवेदन पर मेरे लोग मुझे दिए जाएँ[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक मुहावरेदार रूप में, “मेरी विनती पर मुझे मेरा जीवन और मेरे निवेदन पर मेरे लोग दे दिए जाएँ।” हिब्रू में अधिक शाब्दिक रूप से, “मेरा जीवन मुझे दिया जाए, और मेरे लोग मेरे निवेदन पर [दिए जाएँ]” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַן אֶסְתֵּר הַמַּלְכָּה וַתֹּאמַר
  choice: तब रानी एस्तेर ने उत्तर दिया
  rationale: हिब्रू का दोहरा संवाद-सूत्र शब्दशः ‘उत्तर दिया और कहा’ है। आधुनिक हिन्दी में ‘उत्तर दिया’ दोनों क्रियाओं का स्वाभाविक प्रतिनिधित्व करता है और कथा-क्रम को ‘तब’ व्यक्त करता है।
- source_word: אִם מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: यदि आपकी दृष्टि में मुझ पर कृपा हुई है
  rationale: यह दरबारी विनय का रूढ़ हिब्रू प्रयोग है। ‘आपकी दृष्टि में’ मूल बिंब को बनाए रखता है, और ‘मुझ पर कृपा हुई है’ स्वाभाविक हिन्दी है।
- source_word: הַמֶּלֶךְ
  choice: हे राजा
  rationale: यह संबोधन है; ‘हे राजा’ सम्मानपूर्ण और स्पष्ट हिन्दी रूप है।
- source_word: וְאִם עַל הַמֶּלֶךְ טוֹב
  choice: और यदि राजा को यह अच्छा लगे
  rationale: हिब्रू मुहावरे का आशय राजा की स्वीकृति या प्रसन्नता है; यह हिन्दी में औपचारिक किंतु सहज समतुल्य है।
- source_word: תִּנָּתֶן לִי נַפְשִׁי
  choice: मेरा जीवन मुझे दिया जाए
  rationale: निफ़अल की कर्मवाच्य रचना सुरक्षित रखी गई है। इस प्राण-संकट के प्रसंग में נֶפֶשׁ का अर्थ ‘जीवन’ है, ‘आत्मा’ नहीं।
- source_word: בִּשְׁאֵלָתִי
  choice: मेरी विनती पर
  rationale: שְׁאֵלָה यहाँ औपचारिक याचना है; ‘विनती’ प्रसंगानुकूल और सामान्य हिन्दी है।
- source_word: וְעַמִּי בְּבַקָּשָׁתִי
  choice: और मेरे निवेदन पर मेरे लोगों का जीवन बख्शा जाए
  rationale: हिब्रू में दूसरे खंड की क्रिया और अपेक्षित वस्तु पहले खंड से ग्रहण होती है। हिन्दी में अर्थ स्पष्ट करने के लिए ‘जीवन बख्शा जाए’ जोड़ा गया है; ‘निवेदन’ समानार्थी हिब्रू संज्ञाओं की शैलीगत भिन्नता बनाए रखता है।
theological_decisions:
- issue: ‘मेरे लोगों’ के लिए निहित याचना का स्वरूप
  choice: मेरे लोगों का जीवन बख्शा जाए
  alternative: मेरे लोग मुझे दिए जाएँ
  rationale: हिब्रू समानांतरता में ‘मेरा जीवन’ से लोगों के जीवन की रक्षा निहित है। ‘बख्शा जाए’ मृत्यु-दंड से बचाने का आशय स्पष्ट करता है, बिना किसी अतिरिक्त साम्प्रदायिक अर्थ के।
translation_notes:
  register: आधुनिक मानक हिन्दी में सम्मानपूर्ण राजदरबारी शैली रखी गई है। अत्यधिक संस्कृतनिष्ठ शब्दावली से बचते हुए मूल की विनम्रता, कर्मवाच्य अनुरोध और समानांतर संरचना को सुरक्षित रखा गया है।
