  naturalness: The Hindi is generally fluent and appropriately formal. A single shared passive verb can express the Hebrew parallelism naturally without adding “जीवन” or “बख्शा जाए.”
  terminology: “रानी एस्तेर,” “कृपा,” “विनती,” and “निवेदन” suit the register. “जीवन” appropriately renders נֶפֶשׁ in this life-threatening context.
