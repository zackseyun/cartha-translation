source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ הַ/מֶּ֨לֶךְ לְ/אֶסְתֵּ֜ר גַּ֣ם בַּ/יּ֤וֹם הַ/שֵּׁנִי֙ בְּ/מִשְׁתֵּ֣ה הַ/יַּ֔יִן מַה שְּׁאֵלָתֵ֛/ךְ אֶסְתֵּ֥ר הַ/מַּלְכָּ֖ה וְ/תִנָּ֣תֵֽן לָ֑/ךְ וּ/מַה בַּקָּשָׁתֵ֛/ךְ עַד חֲצִ֥י הַ/מַּלְכ֖וּת וְ/תֵעָֽשׂ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/007/002.yaml
  text: And the king said to Esther on the second day also[a], at the banquet of wine, “What is your petition, Queen Esther? It will be granted to you. And what is your request? Even to half the kingdom[b], it shall be done.”
translation:
  language: hi
  text: दूसरे दिन भी दाखरस की दावत में राजा ने एस्तेर से कहा, “रानी एस्तेर, तुम्हारी विनती क्या है? वह तुम्हें दे दी जाएगी। और तुम्हारा अनुरोध क्या है? आधे राज्य तक भी, उसे पूरा किया जाएगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גַּם בַּיּוֹם הַשֵּׁנִי
  choice: दूसरे दिन भी
  rationale: ‘भी’ पहले दिन के भोज से इस दूसरे दिन की निरंतरता को व्यक्त करता है और इब्रानी पदक्रम के निकट रहता है।
- source_word: בְּמִשְׁתֵּה הַיַּיִן
  choice: दाखमधु के भोज के समय
  rationale: यह अनुवाद भोज की परिस्थिति और दाखमधु के स्पष्ट उल्लेख, दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: מַה שְּׁאֵלָתֵךְ
  choice: तुम्हारी विनती क्या है?
  rationale: ‘विनती’ राजदरबार में औपचारिक रूप से माँगी गई बात का उपयुक्त और सहज हिन्दी रूप है।
- source_word: וְתִנָּתֵן לָךְ
  choice: वह तुम्हें दे दी जाएगी
  rationale: यह इब्रानी के निष्क्रिय रूप को सुरक्षित रखता है और विनती के स्वीकार किए जाने का आशय स्वाभाविक रूप से व्यक्त करता है।
- source_word: וּמַה בַּקָּשָׁתֵךְ
  choice: और तुम्हारा अनुरोध क्या है?
  rationale: ‘अनुरोध’ निकटार्थी होते हुए भी दूसरे इब्रानी संज्ञा-रूप की शब्दगत विविधता को बनाए रखता है।
- source_word: עַד חֲצִי הַמַּלְכוּת
  choice: आधे राज्य तक भी
  rationale: ‘तक’ सीमा का अर्थ बनाए रखता है; ‘भी’ इस असाधारण सीमा पर बल देता है। इब्रानी में ‘मेरे’ नहीं है, इसलिए उसे नहीं जोड़ा गया।
- source_word: וְתֵעָשׂ
  choice: उसे पूरा किया जाएगा
  rationale: अनुरोध को कार्यरूप देने का परिणामसूचक, निष्क्रिय भाव स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: אֶסְתֵּר הַמַּלְכָּה
  choice: रानी एस्तेर
  rationale: हिन्दी की स्वाभाविक उपाधि-व्यवस्था के अनुसार यह सम्मानसूचक पद को नाम से पहले रखता है।
theological_decisions:
- issue: ‘आधे राज्य तक’ का स्वरूप
  choice: मुख्य पाठ में राजकीय कथन को ज्यों का त्यों रखना और उसके रूढ़िपरक आशय को टिप्पणी में बताना
  alternative: मुख्य पाठ में इसे केवल ‘तुम जो चाहो’ जैसे सामान्य आश्वासन के रूप में परिभाषित करना
  rationale: मूल कथन की अतिशयोक्तिपूर्ण राजकीय भाषा को सुरक्षित रखना चाहिए; टिप्पणी पाठक को इसे राज्य बाँटने का निश्चित शाब्दिक प्रस्ताव मानने से बचाती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘दाखमधु’ विशिष्ट पेय का उल्लेख सुरक्षित रखता है; ‘विनती’ और ‘अनुरोध’ इब्रानी के दो निकटार्थी शब्दों की विविधता दर्शाते हैं।
