lexical_decisions:
- source_word: אִישׁ צַר וְאוֹיֵב
  choice: वह विरोधी और शत्रु मनुष्य
  rationale: אִישׁ को स्पष्ट रूप से रखते हुए צַר और אוֹיֵב के दोहरे वर्णन को बनाए रखा गया है; इससे मूल की आरोपात्मक और तीखी अभिव्यक्ति सुरक्षित रहती है।
- source_word: הָמָן הָרָע הַזֶּה
  choice: यही दुष्ट हामान है
  rationale: הַזֶּה की संकेतात्मक तीव्रता को ‘यही’ से और רָע को स्वाभाविक हिन्दी ‘दुष्ट’ से व्यक्त किया गया है।
- source_word: נִבְעַת
  choice: भय से काँप उठा
  rationale: यह क्रिया अचानक और प्रबल आतंक व्यक्त करती है; केवल ‘डर गया’ की अपेक्षा ‘भय से काँप उठा’ प्रसंग की तीव्रता को बेहतर दर्शाता है।
- source_word: מִלִּפְנֵי הַמֶּלֶךְ וְהַמַּלְכָּה
  choice: राजा और रानी के सामने
  rationale: מִלִּפְנֵי का यहाँ दरबारी उपस्थिति में भयभीत होने का अर्थ है; ‘के सामने’ इसे सरल और सटीक ढंग से व्यक्त करता है।
