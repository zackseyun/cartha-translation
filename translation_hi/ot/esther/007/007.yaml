  text: וְ/הַ/מֶּ֜לֶךְ קָ֤ם בַּ/חֲמָת/וֹ֙ מִ/מִּשְׁתֵּ֣ה הַ/יַּ֔יִן אֶל גִּנַּ֖ת הַ/בִּיתָ֑ן וְ/הָמָ֣ן עָמַ֗ד לְ/בַקֵּ֤שׁ עַל נַפְשׁ/וֹ֙ מֵֽ/אֶסְתֵּ֣ר הַ/מַּלְכָּ֔ה כִּ֣י רָאָ֔ה כִּֽי כָלְתָ֥ה אֵלָ֛י/ו הָ/רָעָ֖ה מֵ/אֵ֥ת הַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/007/007.yaml
  text: Then the king rose in his wrath from the wine banquet and went into the palace garden[a], but Haman remained to beg Queen Esther for his life[c][b], for he saw that the evil against him had been determined by the king.
translation:
  language: hi
  text: तब राजा क्रोध में दाखरस की दावत से उठकर राजमहल के बाग़[a] में चला गया। पर हामान रानी एस्तेर से अपने प्राणों की भीख माँगने के लिए वहीं रह गया, क्योंकि उसने देख लिया था कि राजा की ओर से उसके विरुद्ध विपत्ति ठहर चुकी थी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पदबंध का अनुवाद “मंडप का बाग़” या “राजमहल-परिसर का बाग़” भी हो सकता है।
    reason: cultural_note
  - marker: b
    text: 'शाब्दिक रूप के अधिक निकट: “क्योंकि उसने देखा कि राजा की ओर से उसके विरुद्ध अनिष्ट निश्चित हो चुका था।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֲמָתוֹ
  choice: क्रोध से भरा हुआ
  rationale: חֵמָה तीव्र, भड़कते हुए क्रोध को व्यक्त करता है; यह हिंदी में स्वाभाविक रहते हुए उसकी तीव्रता बनाए रखता है।
- source_word: מִמִּשְׁתֵּה הַיַּיִן
  choice: दाखमधु की दावत से
  rationale: मूल में भोज और दाखमधु दोनों स्पष्ट हैं; यह रूप एस्तेर की दरबारी दावत के प्रसंग को सहज हिंदी में रखता है।
- source_word: גִּנַּת הַבִּיתָן
  choice: राजमहल के बाग़
  rationale: גִּנָּה का अर्थ बाग़ है और בִּיתָן राजकीय भवन, महल या मंडप-परिसर का संकेत दे सकता है; मुख्य पाठ में सबसे स्पष्ट प्रसंगगत अर्थ चुना गया है।
- source_word: עָמַד
  choice: वहीं रह गया
  rationale: शाब्दिक अर्थ 'खड़ा रहा' है, पर यहाँ राजा के चले जाने के विपरीत हामान के पीछे रह जाने पर बल है।
- source_word: לְבַקֵּשׁ עַל נַפְשׁוֹ
  choice: अपने प्राणों की भीख माँगने
  rationale: यह मुहावरा अपने जीवन को बचाने की विनती करने का अर्थ देता है; 'प्राणों की भीख माँगना' हामान की निराशा और विनती को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: מֵאֶסְתֵּר הַמַּלְכָּה
  choice: रानी एस्तेर से
  rationale: हिंदी में पदवी को नाम से पहले रखना स्वाभाविक है और מִן का स्रोतभाव 'से' द्वारा सुरक्षित रहता है।
- source_word: כִּי כָלְתָה אֵלָיו הָרָעָה
  choice: उसके विनाश का निश्चय कर लिया था
  rationale: כלה यहाँ आने वाली विपत्ति के निश्चित और अपरिवर्तनीय हो जाने को बताता है; 'विनाश' רָעָה के इस प्रसंगगत विपत्ति/अनिष्ट अर्थ को स्पष्ट करता है।
- source_word: מֵאֵת הַמֶּלֶךְ
  choice: राजा ने
  rationale: मूल में राजा उस निश्चित विपत्ति का स्रोत है; सक्रिय हिंदी वाक्य में 'राजा ने ... निश्चय कर लिया' यही संबंध सहज रूप से व्यक्त करता है।
theological_decisions:
- issue: हामान पर आने वाली הָרָעָה का स्वरूप
  choice: विनाश
  alternative: अनिष्ट / विपत्ति / बुराई
  rationale: प्रसंग में यह नैतिक 'बुराई' से अधिक राजा की ओर से निश्चित दंड और घातक विपत्ति को दर्शाता है; फिर भी टिप्पणी में मूल शब्द की व्यापकता बताई गई है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण कथात्मक रूप अपनाया गया है। 'दाखमधु', 'प्राणों की भीख' और 'विनाश का निश्चय' सामान्य पाठक के लिए बोधगम्य रहते हुए दरबारी और संकटपूर्ण प्रसंग की गंभीरता बनाए रखते हैं।
