base_translation:
  language: en
  yaml_path: translation/ot/esther/006/001.yaml
  text: On that night the king could not sleep[a], so he ordered the book of records, the chronicles, to be brought[b], and they were read before the king.
translation:
  language: hi
  text: उस रात राजा को नींद नहीं आई[a]। इसलिए उसने स्मरणों की पुस्तक, अर्थात् घटनाओं के वृत्तांत, मँगाने का आदेश दिया[b], और वे राजा के सामने पढ़े गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “राजा की नींद उड़ गई।”'
    reason: lexical_alternative
  - marker: b
    text: या “स्मरणों की पुस्तक, अर्थात् वार्षिक अभिलेख।”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּלַּיְלָה הַהוּא
  choice: उस रात
  rationale: यह विशिष्ट रात को सूचित करने वाला स्वाभाविक और संक्षिप्त हिन्दी प्रयोग है।
- source_word: נָדְדָה שְׁנַת הַמֶּלֶךְ
  choice: राजा को नींद नहीं आई
  rationale: इब्रानी मुहावरे का शाब्दिक चित्र है कि राजा की नींद उड़ गई या भटक गई; आधुनिक हिन्दी में चुना हुआ रूप अर्थ को सहजता से व्यक्त करता है, जबकि मूल चित्र पादटिप्पणी में सुरक्षित है।
- source_word: וַיֹּאמֶר לְהָבִיא
  choice: उसने ... मँगाने का आदेश दिया
  rationale: यद्यपि וַיֹּאמֶר का मूल अर्थ 'उसने कहा' है, यहाँ वह निर्देश प्रस्तुत करता है; 'मँगाने का आदेश दिया' प्रसंगगत वाक्-क्रिया और अनाम सेवकों द्वारा पुस्तक लाए जाने—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: סֵפֶר הַזִּכְרֹנוֹת
  choice: स्मरण की पुस्तक
  rationale: यह अभिलेख उन बातों को याद रखने के लिए रखा जाता था; यह रूप זִכְרֹנוֹת के स्मरण-संबंधी अर्थ को बनाए रखता है।
- source_word: דִּבְרֵי הַיָּמִים
  choice: इतिहास-वृत्तांत
  rationale: यह पद राजकीय वार्षिक अथवा घटनात्मक अभिलेखों को सूचित करता है और यहाँ पूर्ववर्ती 'पुस्तक' की व्याख्या करता है।
- source_word: וַיִּהְיוּ נִקְרָאִים
  choice: वे ... पढ़े गए
  rationale: बहुवचन क्रिया और कृदंत को सुरक्षित रखते हुए अभिलेखों/वृत्तांतों को कर्ता माना गया है; निष्क्रिय रचना मूल से मेल खाती है।
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: राजा के सामने
  rationale: यह לִפְנֵי के 'सामने/उपस्थिति में' अर्थ को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
