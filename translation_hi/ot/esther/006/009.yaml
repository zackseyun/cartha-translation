base_translation:
  language: en
  yaml_path: translation/ot/esther/006/009.yaml
  text: And let the robe and the horse be entrusted to the hand of one of the king’s noble officials, and let them clothe the man whom the king delights to honor, and let them mount him on the horse through the open square of the city, and proclaim before him, ‘Thus shall it be done for the man whom the king delights to honor.’
translation:
  language: hi
  text: और वह राजसी वस्त्र और घोड़ा राजा के प्रतिष्ठित अधिकारियों में से किसी एक के हाथ सौंप दिया जाए। फिर वे उस मनुष्य को, जिसका सम्मान करने में राजा प्रसन्न होता है, वह वस्त्र पहनाएँ, उसे घोड़े पर बैठाकर नगर के चौक में घुमाएँ और उसके आगे यह घोषणा करें, ‘जिस मनुष्य का सम्मान करने में राजा प्रसन्न होता है, उसके साथ ऐसा ही किया जाता है।’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַפַּרְתְּמִים
  choice: प्रतिष्ठित अधिकारियों
  rationale: यह फ़ारसी मूल का पद उच्च श्रेणी के राजकीय गणमान्य व्यक्तियों या अधिकारियों को सूचित करता है; ‘प्रतिष्ठित अधिकारी’ पद और दर्जे दोनों को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: חָפֵץ בִּיקָרוֹ
  choice: जिसका सम्मान करने से राजा प्रसन्न होता है
  rationale: חפץ इच्छा, रुचि या प्रसन्नता का भाव और יקר सम्मान का भाव रखता है; यह अनुवाद दोनों को बनाए रखता है और राजा की इच्छा को केवल औपचारिक आदेश नहीं बनाता।
- source_word: וְהִרְכִּיבֻהוּ
  choice: उसे घोड़े पर बैठाकर ... घुमाएँ
  rationale: हिफ़ील रूप का मूल अर्थ उसे सवार कराना है; प्रसंग में नगर के चौक से सम्मान-यात्रा कराने का भाव ‘घुमाएँ’ से स्वाभाविक रूप में स्पष्ट होता है।
- source_word: בִּרְחוֹב הָעִיר
  choice: नगर के चौक में
  rationale: רְחוֹב नगर के खुले सार्वजनिक चौक या विस्तृत स्थान को दर्शाता है, केवल आधुनिक अर्थ की सड़क को नहीं।
- source_word: וְקָרְאוּ לְפָנָיו
  choice: उसके आगे यह घोषणा करें
  rationale: לְפָנָיו जुलूस में सम्मानित व्यक्ति के आगे घोषणा किए जाने का स्थानिक भाव देता है।
