  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक राजकीय घोषणा के अनुरूप रखी गई है। हिब्रू के क्रमिक आदेशात्मक ढाँचे को हिन्दी में सहज बनाने के लिए वाक्य-विभाजन किया गया है, जबकि सम्मान-जुलूस की सभी प्रमुख क्रियाएँ सुरक्षित हैं।
