language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּמָּצֵ֣א כָת֗וּב אֲשֶׁר֩ הִגִּ֨יד מָרְדֳּכַ֜י עַל בִּגְתָ֣נָא וָ/תֶ֗רֶשׁ שְׁנֵי֙ סָרִיסֵ֣י הַ/מֶּ֔לֶךְ מִ/שֹּׁמְרֵ֖י הַ/סַּ֑ף אֲשֶׁ֤ר בִּקְשׁוּ֙ לִ/שְׁלֹ֣חַ יָ֔ד בַּ/מֶּ֖לֶךְ אֲחַשְׁוֵרֽוֹשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/006/002.yaml
  text: And it was found written that Mordecai had reported concerning Bigthana and Teresh[a], two of the king’s eunuchs, among those who guarded the threshold[b], who had sought to lay a hand on King Ahasuerus.
translation:
  language: hi
  text: और यह लिखा हुआ मिला कि मोर्दकै ने बिग्ताना और तेरेश[a], राजा के दो खोजों[b], जो दहलीज़ के पहरेदारों में से थे, के विषय में सूचना दी थी; उन्होंने राजा अहशवेरोश पर हाथ डालने का प्रयत्न किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पद में हिब्रू नाम का रूप ‘बिग्ताना’ है; अन्य स्थानों पर यह नाम ‘बिग्तान’ मिलता है।
    reason: alternative_reading
  - marker: b
    text: या ‘राजा के दो राजकीय अधिकारी’; हिब्रू शब्द विशेष रूप से खोजों के लिए, अथवा अधिक व्यापक अर्थ में राजकीय अधिकारियों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמָּצֵא כָתוּב
  choice: अभिलेख में यह लिखा मिला
  rationale: निष्क्रिय रचना और लिखित राजकीय विवरण, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है। ‘अभिलेख में’ प्रसंग से स्पष्ट है और लिखित रूप में पाए जाने का भाव बनाए रखता है।
- source_word: הִגִּיד
  choice: सूचना दी थी
  rationale: राजदरबार के षड्यंत्र की औपचारिक खबर देने के प्रसंग में यह सामान्य ‘बताया’ से अधिक सटीक है।
- source_word: עַל
  choice: के विषय में
  rationale: यहाँ पूर्वसर्ग मोर्दकै की सूचना के विषय को सूचित करता है; ‘के विरुद्ध’ कहने से निहित आरोप को अनावश्यक रूप से व्याकरण में जोड़ दिया जाता।
- source_word: בִּגְתָנָא וָתֶרֶשׁ
  choice: बिगताना और तेरेश
  rationale: इस पद के हिब्रू रूप בִּגְתָנָא को ‘बिगताना’ से दर्शाया गया है; अन्यत्र मिलने वाला छोटा रूप पादटिप्पणी में दिया गया है।
- source_word: שְׁנֵי סָרִיסֵי הַמֶּלֶךְ
  choice: राजा के दो खोजे
  rationale: राजदरबार के इस प्रसंग में סָרִיס का विशिष्ट अर्थ ‘खोजा’ उपयुक्त है, जबकि ‘राजकीय अधिकारी’ का व्यापक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: מִשֹּׁמְרֵי הַסַּף
  choice: दहलीज़ के पहरेदारों में से
  rationale: भागसूचक מִן और סַף के मूल अर्थ ‘दहलीज़’ दोनों को स्पष्ट एवं स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: בִּקְשׁוּ לִשְׁלֹחַ יָד
  choice: हाथ उठाने की कोशिश की थी
  rationale: हिब्रू मुहावरे के शत्रुतापूर्ण आशय को हिन्दी के परिचित मुहावरे से व्यक्त करता है और בִּקְשׁוּ में निहित प्रयास/इरादे को भी बनाए रखता है।
- source_word: בַּמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: राजा अहशवेरोश पर
  rationale: हिब्रू नाम के रूप को सीधे देवनागरी में प्रस्तुत करता है और preceding हिन्दी मुहावरे ‘पर हाथ उठाना’ के साथ स्वाभाविक बैठता है।
