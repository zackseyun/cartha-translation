  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। राजकीय अभिलेख के प्रसंग के कारण ‘अभिलेख’ और ‘सूचना दी’ चुने गए हैं। नामों को हिब्रू रूपों के निकट रखा गया है और अर्थगत अनिश्चितता पादटिप्पणी में सुरक्षित है।
