  text: וַ/יְסַפֵּ֨ר הָמָ֜ן לְ/זֶ֤רֶשׁ אִשְׁתּ/וֹ֙ וּ/לְ/כָל אֹ֣הֲבָ֔י/ו אֵ֖ת כָּל אֲשֶׁ֣ר קָרָ֑/הוּ וַ/יֹּ֩אמְרוּ֩ ל֨/וֹ חֲכָמָ֜י/ו וְ/זֶ֣רֶשׁ אִשְׁתּ֗/וֹ אִ֣ם מִ/זֶּ֣רַע הַ/יְּהוּדִ֡ים מָרְדֳּכַ֞י אֲשֶׁר֩ הַחִלּ֨וֹתָ לִ/נְפֹּ֤ל לְ/פָנָי/ו֙ לֹא תוּכַ֣ל ל֔/וֹ כִּֽי נָפ֥וֹל תִּפּ֖וֹל לְ/פָנָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/006/013.yaml
  text: Then Haman told Zeresh his wife and all his friends everything that had happened to him. Then his wise men and Zeresh his wife said to him[a], “If Mordecai, before whom you have begun to fall, is from the seed of the Jews, you will not prevail against him, for you will surely fall before him.”
translation:
  language: hi
  text: तब हामान ने अपनी पत्नी जेरेश और अपने सभी मित्रों को वह सब बताया जो उसके साथ हुआ था। तब उसके ज्ञानी जनों और उसकी पत्नी जेरेश ने उससे कहा, “यदि मोर्दकै यहूदियों के वंश का है[a], जिसके सामने तुम गिरने लगे हो, तो तुम उस पर प्रबल नहीं हो सकोगे; क्योंकि तुम निश्चय ही उसके सामने गिरोगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “यहूदियों के बीज में से है।”
    reason: ‘बीज’ मूल इब्रानी वंश-बिंब को सुरक्षित रखता है, जबकि मुख्य पाठ में उसका स्वाभाविक हिन्दी अर्थ दिया गया है।
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: बताया
  rationale: यह कथात्मक क्रिया घटी हुई बातों को सुनाने या बयान करने का संकेत देती है; ‘बताया’ सहज आधुनिक हिन्दी है।
- source_word: אֹהֲבָיו
  choice: उसके सभी मित्रों
  rationale: शाब्दिक अर्थ प्रेम रखने वाले लोगों का है, पर इस सामाजिक-दरबारी प्रसंग में आशय हामान के मित्रों या निकट सहयोगियों से है।
- source_word: כָּל אֲשֶׁר קָרָהוּ
  choice: वह सब ... जो उसके साथ हुआ था
  rationale: यह पद उसके साथ घटी सभी घटनाओं को समेटता है; ‘हुआ था’ पूर्ववर्ती घटनाक्रम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: חֲכָמָיו
  choice: उसके बुद्धिमान पुरुषों
  rationale: यह चयन ‘उसके बुद्धिमान जनों’ के शाब्दिक रूप को बनाए रखता है और उन्हें केवल सामान्य सलाहकार कहकर अर्थ सीमित नहीं करता।
- source_word: אִם מִזֶּרַע הַיְּהוּדִים
  choice: यदि मोर्दकै यहूदियों के वंश का है
  rationale: זֶרַע का मूल अर्थ ‘बीज’ है, किंतु यहाँ वह वंश या जातीय मूल को दर्शाता है; मुख्य पाठ में ‘वंश’ स्वाभाविक और स्पष्ट है, जबकि शाब्दिक बिंब पादटिप्पणी में दिया गया है।
- source_word: הַחִלּוֹתָ לִנְפֹּל לְפָנָיו
  choice: जिसके सामने तुम गिरने लगे हो
  rationale: यह आरंभ हो चुके पतन को व्यक्त करता है और अगले खंड में ‘गिरोगे’ की पुनरावृत्ति को सुरक्षित रखता है।
- source_word: לֹא תוּכַל לוֹ
  choice: तुम उस पर प्रबल नहीं हो सकोगे
  rationale: יכל + ל यहाँ किसी विरोधी पर विजय या बढ़त पाने में असमर्थ होने का भाव देता है।
- source_word: נָפוֹל תִּפּוֹל
  choice: तुम निश्चय ही ... गिरोगे
  rationale: क्रिया के साथ प्रयुक्त infinitive absolute निश्चितता और तीव्र बल प्रकट करता है; ‘निश्चय ही’ उसी बल को हिन्दी में व्यक्त करता है।
- source_word: לְפָנָיו
  choice: उसके सामने
  rationale: दोनों स्थानों पर यही रूप रखकर मोर्दकै के संबंध में हामान की पराजय और मूल की पुनरावृत्ति बनाए रखी गई है।
