source:
  edition: WLC
  text: וַ/יֹּ֨אמְר֜וּ נַעֲרֵ֤י הַ/מֶּ֨לֶךְ֙ אֵלָ֔י/ו הִנֵּ֥ה הָמָ֖ן עֹמֵ֣ד בֶּ/חָצֵ֑ר וַ/יֹּ֥אמֶר הַ/מֶּ֖לֶךְ יָבֽוֹא׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/006/005.yaml
  text: The king’s attendants said to him[a], “Look, Haman is standing in the court.” And the king said, “Let him come in.”
translation:
  language: hi
  text: राजा के सेवकों ने उससे कहा, “देखिए, हामान आँगन में खड़ा है।” तब राजा ने कहा, “उसे भीतर आने दो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נַעֲרֵי הַמֶּלֶךְ
  choice: राजा के सेवक
  rationale: नַעַר युवक, सेवक या परिचारक को सूचित कर सकता है। राजदरबार के प्रसंग में “सेवक” उनकी भूमिका को सहज और स्पष्ट हिंदी में व्यक्त करता है, बिना उनकी आयु निश्चित किए।
- source_word: הִנֵּה
  choice: देखिए
  rationale: यह ध्यान आकर्षित करने वाला उद्गार है। राजा को संबोधित करते हुए आदरसूचक “देखिए” आधुनिक हिंदी में स्वाभाविक है और कथन की तात्कालिकता बनाए रखता है।
- source_word: עֹמֵד
  choice: खड़ा है
  rationale: वर्तमान कृदंत जारी अवस्था को व्यक्त करता है; “खड़ा है” मूल में कही गई मुद्रा को सीधे रखता है और “प्रतीक्षा कर रहा है” जैसी व्याख्या नहीं जोड़ता।
- source_word: בֶּחָצֵר
  choice: आँगन में
  rationale: חָצֵר महल के खुले प्रांगण या आँगन को दर्शाता है। “आँगन” साधारण आधुनिक हिंदी में स्पष्ट और इस प्रसंग के अनुकूल है।
- source_word: יָבֹא
  choice: उसे भीतर आने दो
  rationale: यहाँ अपूर्ण रूप आज्ञा अथवा अनुमति का भाव रखता है। “उसे भीतर आने दो” इस निर्देशात्मक बल और राजा की उपस्थिति में प्रवेश की निहित गति—दोनों को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: הָמָן
  choice: हामान
  rationale: व्यक्तिनाम को हिंदी बाइबल परंपरा के प्रचलित लिप्यंतरण के अनुसार रखा गया है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। राजा को सेवकों के संबोधन में आदरसूचक “देखिए” प्रयुक्त है, जबकि राजा की आज्ञा में स्वाभाविक “आने दो” रखा गया है। मूल पाठ בֶּחָצֵר के बाद कोई अस्पष्ट सर्वनाम नहीं रखता; इसलिए अंग्रेज़ी परामर्श-पाठ का [a] चिह्न स्रोत से पुष्ट न होने के कारण हिंदी मुख्य पाठ में नहीं लिया गया।
