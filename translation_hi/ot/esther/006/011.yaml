base_translation:
  language: en
  yaml_path: translation/ot/esther/006/011.yaml
  text: So Haman took the robe and the horse[a], clothed Mordecai, led him on horseback through the city square, and proclaimed before him, “Thus shall it be done for the man whom the king delights to honor.”
translation:
  language: hi
  text: तब हामान ने वह राजकीय वस्त्र और वह घोड़ा लिया, मोर्दकै को वह वस्त्र पहनाया, उसे घोड़े पर बैठाकर नगर के चौक से होकर ले गया[a] और उसके आगे यह घोषणा करता गया, “जिस मनुष्य का सम्मान करने से राजा प्रसन्न होता है, उसके साथ ऐसा ही किया जाता है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या “उसे नगर के चौक में घोड़े पर घुमाया।” इब्रानी क्रिया कारक है: हामान ने मोर्दकै को सार्वजनिक जुलूस में घोड़े पर सवारी कराई।'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְּבוּשׁ
  choice: वह राजकीय वस्त्र
  rationale: संज्ञा निश्चित एकवचन है और पिछले संदर्भ में बताए गए राजा के वस्त्र की ओर संकेत करती है। हिंदी में संदर्भ स्पष्ट रखने के लिए ‘राजकीय वस्त्र’ स्वाभाविक है।
- source_word: הַסּוּס
  choice: वह घोड़ा
  rationale: इब्रानी में केवल निश्चित उपपद सहित ‘घोड़ा’ है; उसका राजकीय संबंध पिछले पद से स्पष्ट है, इसलिए यहाँ अलग से ‘राजकीय’ नहीं जोड़ा गया।
- source_word: וַיַּלְבֵּשׁ אֶת מָרְדֳּכָי
  choice: मोर्दकै को वह वस्त्र पहनाया
  rationale: हिफ़ील क्रिया किसी को वस्त्र पहनाने का भाव देती है; वस्त्र को स्पष्ट दोहराना हिंदी में सहज और संदर्भानुकूल है।
- source_word: וַיַּרְכִּיבֵהוּ
  choice: उसे घोड़े पर बैठाकर … ले गया
  rationale: רכב की कारक क्रिया का अर्थ उसे सवारी कराना है। यह हिंदी अभिव्यक्ति कारक भाव तथा सार्वजनिक जुलूस में हामान की भूमिका दोनों को स्वाभाविक रूप से व्यक्त करती है।
- source_word: בִּרְחוֹב הָעִיר
  choice: नगर के चौक से
  rationale: רְחוֹב यहाँ सामान्य संकरी गली के बजाय खुला सार्वजनिक चौक दर्शाता है। ‘नगर का चौक’ आधुनिक हिंदी में स्पष्ट है।
- source_word: וַיִּקְרָא לְפָנָיו
  choice: उसके आगे यह घोषणा करता गया
  rationale: קרא सार्वजनिक उद्घोषणा है और לְפָנָיו स्थानगत रूप से ‘उसके आगे’ है। ‘करता गया’ जुलूस के दौरान जारी उद्घोषणा को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: כָּכָה יֵעָשֶׂה
  choice: उसके साथ ऐसा ही किया जाता है
  rationale: इब्रानी अपूर्णकालीन निष्क्रिय रूप यहाँ राजकीय प्रथा या सूत्रवत घोषणा व्यक्त कर सकता है। वर्तमान सामान्य निष्क्रिय हिंदी इस अर्थ को बिना अनावश्यक भविष्यकाल थोपे बनाए रखती है।
- source_word: לָאִישׁ אֲשֶׁר הַמֶּלֶךְ חָפֵץ בִּיקָרוֹ
  choice: जिस मनुष्य का सम्मान करने से राजा प्रसन्न होता है
  rationale: חפץ प्रसन्नता या रुचि और יקר सम्मान का भाव देता है। यह अनुवाद दोनों अर्थों को स्पष्ट और गरिमापूर्ण हिंदी में रखता है।
