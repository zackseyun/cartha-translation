base_translation:
  language: en
  yaml_path: translation/ot/esther/006/014.yaml
  text: While they were still speaking with him[b][a], the king’s eunuchs arrived and hurried to bring Haman to the banquet that Esther had prepared.
translation:
  language: hi
  text: जब वे अभी उससे बात कर ही रहे थे, तभी राजा के खोजे[a] आ पहुँचे और हामान को उस भोज में ले जाने के लिए शीघ्रता की[b], जिसे एस्तेर ने तैयार किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘राजा के अधिकारी’; इब्रानी शब्द खोजों के साथ-साथ राजदरबार के पदाधिकारियों को भी सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘हामान को भोज में ले जाने के लिए फुर्ती की’; यहाँ प्रयुक्त इब्रानी क्रिया तात्कालिक और तेज़ी से किए गए कार्य का भाव देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹדָם מְדַבְּרִים עִמּוֹ
  choice: जब वे अभी उससे बात कर ही रहे थे
  rationale: यह रूप जारी क्रिया को दर्शाता है। ‘अभी...कर ही रहे थे’ उस बातचीत के अधूरे रहते अगली घटना घटने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: סָרִיסֵי הַמֶּלֶךְ
  choice: राजा के खोजे
  rationale: סָרִיס का सीधा और इस राजदरबारी संदर्भ में उपयुक्त अर्थ ‘खोजे’ है; फिर भी यह शब्द राजकीय अधिकारियों के लिए भी प्रयुक्त हो सकता है, इसलिए विकल्प पादटिप्पणी में रखा गया है।
- source_word: הִגִּיעוּ
  choice: आ पहुँचे
  rationale: क्रिया का अर्थ घटनास्थल पर पहुँच जाना है। ‘आ पहुँचे’ आगमन को स्पष्ट और कथात्मक ढंग से व्यक्त करता है।
- source_word: וַיַּבְהִלוּ
  choice: जल्दी की
  rationale: בהל के हिफ़ील रूप में यहाँ भयभीत करने के बजाय तत्काल गति से कार्य करने का भाव है। ‘जल्दी की’ अनावश्यक रूप से घबराहट आरोपित किए बिना यह तात्कालिकता व्यक्त करता है।
- source_word: לְהָבִיא אֶת הָמָן
  choice: हामान को ... ले जाने के लिए
  rationale: हिफ़ील infinitive उद्देश्य बताता है। गंतव्य की ओर गति के हिन्दी मुहावरे में ‘ले जाना’ स्वाभाविक है।
- source_word: הַמִּשְׁתֶּה
  choice: भोज
  rationale: מִשְׁתֶּה मदिरापान सहित दावत या राजकीय भोज को सूचित करता है। ‘भोज’ संक्षिप्त, गरिमापूर्ण और एस्तेर के प्रसंग में स्वाभाविक है।
- source_word: אֲשֶׁר עָשְׂתָה אֶסְתֵּר
  choice: जिसे एस्तेर ने तैयार किया था
  rationale: यद्यपि עשה का मूल अर्थ ‘करना/बनाना’ है, भोज के संदर्भ में ‘तैयार किया’ स्वाभाविक हिन्दी है और पहले से हुई तैयारी को स्पष्ट करता है।
