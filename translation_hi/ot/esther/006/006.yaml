base_translation:
  language: en
  yaml_path: translation/ot/esther/006/006.yaml
  text: So Haman came in[a], and the king said to him, “What should be done for the man whom the king delights to honor?” And Haman said in his heart, “Whom would the king delight to honor more than me?”
translation:
  language: hi
  text: तब हामान भीतर आया, और राजा ने उससे कहा, “जिस मनुष्य को राजा सम्मानित करना चाहता है, उसके लिए क्या किया जाए?” हामान ने अपने मन में कहा,[a] “राजा मुझसे बढ़कर और किसे सम्मानित करना चाहेगा?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “हामान ने अपने हृदय में कहा।” अर्थात उसने अपने आप से कहा।
    reason: हिब्रानी मुहावरे की शाब्दिक छवि और उसका आशय दोनों बताने के लिए।
lexical_decisions:
- source_word: וַיָּבוֹא הָמָן
  choice: तब हामान भीतर आया
  rationale: वय्यिक्तोल कथा को आगे बढ़ाता है; ‘भीतर आया’ राजकीय उपस्थिति में प्रवेश का स्वाभाविक हिन्दी रूप है।
- source_word: וַיֹּאמֶר לוֹ הַמֶּלֶךְ
  choice: और राजा ने उससे कहा
  rationale: אָמַר का मूल अर्थ ‘कहना’ है; प्रश्न होने पर भी स्रोत की अभिव्यक्ति सुरक्षित रखी गई है।
- source_word: מַה לַעֲשׂוֹת בָּאִישׁ
  choice: उसके लिए क्या किया जाए
  rationale: यह हिन्दी में स्वाभाविक रूप से कर्तव्य अथवा उचित कार्रवाई का भाव और प्रसंग का अप्रत्यक्ष कर्मवाच्य बनाए रखता है।
- source_word: אֲשֶׁר הַמֶּלֶךְ חָפֵץ בִּיקָרוֹ
  choice: जिस मनुष्य का राजा सम्मान करना चाहता है
  rationale: חָפֵץ यहाँ इच्छा/प्रसन्नता और יְקָר सम्मान का भाव देता है। ‘सम्मान करना चाहता है’ आधुनिक हिन्दी में सहज और राजदरबारी प्रसंग के अनुकूल है।
- source_word: וַיֹּאמֶר הָמָן בְּלִבּוֹ
  choice: हामान ने अपने मन में कहा
  rationale: ‘अपने मन में कहा’ शाब्दिक हृदय-आधारित आंतरिक वाणी की छवि को हिन्दी के स्वाभाविक मुहावरे में सुरक्षित रखता है।
- source_word: לְמִי יַחְפֹּץ הַמֶּלֶךְ לַעֲשׂוֹת יְקָר
  choice: राजा ... और किसका सम्मान करना चाहेगा
  rationale: रूपक प्रश्न और सम्मान प्रदान करने का अर्थ दोनों स्पष्ट हैं; ‘चाहेगा’ हामान के अनुमान को व्यक्त करता है।
- source_word: יוֹתֵר מִמֶּנִּי
  choice: मुझसे बढ़कर
  rationale: तुलनात्मक वाक्यांश हामान के आत्म-महत्त्व को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है।
