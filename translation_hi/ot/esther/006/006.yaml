    issue: “जिस मनुष्य का राजा सम्मान करना चाहता है” uses an inappropriate genitive construction.
    rationale: The king is honoring the man, not the man's honor as a possessed object. The source has a relative object ('the man whom ...'), best rendered in Hindi with “जिस मनुष्य को.”
