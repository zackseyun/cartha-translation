  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘मनुष्य’ राजकीय घोषणा की औपचारिकता रखता है, जबकि ‘अपने मन में कहा’ आंतरिक वाणी को स्वाभाविक ढंग से व्यक्त करता है।
