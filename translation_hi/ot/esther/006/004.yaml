  text: וַ/יֹּ֥אמֶר הַ/מֶּ֖לֶךְ מִ֣י בֶ/חָצֵ֑ר וְ/הָמָ֣ן בָּ֗א לַ/חֲצַ֤ר בֵּית הַ/מֶּ֨לֶךְ֙ הַ/חִ֣יצוֹנָ֔ה לֵ/אמֹ֣ר לַ/מֶּ֔לֶךְ לִ/תְלוֹת֙ אֶֽת מָרְדֳּכַ֔י עַל הָ/עֵ֖ץ אֲשֶׁר הֵכִ֥ין לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/006/004.yaml
  text: And the king said[a], “Who is in the court?” Now Haman had come into the outer court of the king’s palace to speak to the king about hanging Mordecai on the gallows that he had prepared for him.
translation:
  language: hi
  text: तब राजा ने पूछा, “आँगन में कौन है?” उस समय हामान राजमहल के बाहरी आँगन में आया हुआ था, ताकि वह राजा से मोर्दकै को उस लकड़ी की बनी संरचना[a] पर लटकाने की बात करने के लिए आए, जिसे उसने उसके लिए तैयार किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द עֵץ का शाब्दिक अर्थ ‘पेड़’ या ‘लकड़ी’ है। यहाँ यह मृत्युदंड के लिए तैयार की गई लकड़ी की संरचना को दर्शाता है; उसकी सटीक बनावट स्पष्ट नहीं है और वह खंभा, फाँसी की संरचना, या अन्य लकड़ी का उपकरण हो सकता था।
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶחָצֵר / לַחֲצַר
  choice: आँगन / आँगन
  rationale: חָצֵר किसी भवन से जुड़े घेरे हुए आँगन को दर्शाता है। राजमहल के संदर्भ में ‘आँगन’ सहज और स्पष्ट है; दूसरी बार הַחִיצוֹנָה के कारण ‘बाहरी आँगन’ किया गया है।
- source_word: וְהָמָן בָּא
  choice: उस समय हामान ... आया हुआ था
  rationale: यह खंड राजा के प्रश्न के समय की पृष्ठभूमि बताता है। ‘आया हुआ था’ पूर्व आगमन और वर्तमान उपस्थिति—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בֵּית הַמֶּלֶךְ
  choice: राजमहल
  rationale: शाब्दिक अर्थ ‘राजा का घर’ है, पर राजकीय संदर्भ में ‘राजमहल’ अधिक स्वाभाविक और सटीक है।
- source_word: הַחִיצוֹנָה
  choice: बाहरी
  rationale: यह विशेषण इस आँगन को भीतरी आँगन से अलग बताता है; ‘बाहरी’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: לֵאמֹר לַמֶּלֶךְ
  choice: राजा से ... बात करे
  rationale: यहाँ אמר का क्रियार्थ हामान के आने का उद्देश्य बताता है। ‘बात करे’ प्रस्ताव या निवेदन रखने के आशय को बिना अनावश्यक विस्तार के व्यक्त करता है।
- source_word: לִתְלוֹת
  choice: लटकाने
  rationale: תלה का मूल भाव किसी को ऊपर लटकाना है। ‘लटकाने’ से पाठ की अभिव्यक्ति बनी रहती है और यह अनावश्यक रूप से केवल आधुनिक फाँसी की विधि निर्धारित नहीं करता।
- source_word: הָעֵץ
  choice: लकड़ी का खंभा[a]
  rationale: עֵץ का मूल अर्थ ‘पेड़’ या ‘लकड़ी’ है; यहाँ यह मृत्युदंड के लिए तैयार की गई लकड़ी की संरचना को दर्शाता है। ‘लकड़ी का खंभा’ ऐतिहासिक संभावना को आधुनिक फाँसीघर तक सीमित किए बिना संदर्भ स्पष्ट करता है।
- source_word: אֲשֶׁר הֵכִין לוֹ
  choice: जिसे उसने उसके लिए तैयार किया था
  rationale: संदर्भ में ‘उसके लिए’ स्वाभाविक रूप से मोर्दकै की ओर संकेत करता है। सर्वनाम को बनाए रखने से मूल की अभिव्यक्ति और कथात्मक विडंबना सुरक्षित रहती है।
