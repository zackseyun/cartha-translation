  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘राजमहल’, ‘बाहरी आँगन’ और ‘लकड़ी का खंभा’ सामान्य पाठक के लिए स्पष्ट हैं। दंड की सटीक विधि के विषय में इब्रानी पाठ की व्यापकता को मुख्य पाठ और पाद-टिप्पणी में सुरक्षित रखा गया है।
