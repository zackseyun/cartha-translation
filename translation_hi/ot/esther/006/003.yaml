base_translation:
  language: en
  yaml_path: translation/ot/esther/006/003.yaml
  text: Then the king said[a], “What honor and greatness has been bestowed on Mordecai for this?” The king’s young men who attended him said, “Nothing has been done for him.”
translation:
  language: hi
  text: तब राजा ने पूछा[a], “इसके लिए मोर्दकै को क्या आदर और प्रतिष्ठा दी गई है?” राजा के वे युवक, जो उसकी सेवा करते थे, बोले, “उसके लिए कुछ भी नहीं किया गया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मोर्दकै के लिए इस कारण आदर और प्रतिष्ठा के रूप में क्या किया गया?”
    reason: मूल इब्रानी מַה נַּעֲשָׂה के अधिक शाब्दिक कर्मवाच्य और עַל זֶה के कारणसूचक अर्थ को दिखाने वाला वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: מַה נַּעֲשָׂה
  choice: क्या ... दी गई है
  rationale: निफ़ाल कर्मवाच्य यह पूछता है कि कौन-सा कार्य किया गया। ‘आदर और प्रतिष्ठा दी गई’ आधुनिक हिन्दी में स्वाभाविक है और कर्मवाच्य भाव बनाए रखता है।
- source_word: יְקָר
  choice: आदर
  rationale: राजदरबार के इस प्रसंग में शब्द किसी व्यक्ति को दिए गए सम्मान का बोध कराता है, न कि भौतिक बहुमूल्यता का।
- source_word: וּגְדוּלָּה
  choice: प्रतिष्ठा
  rationale: יְקָר के साथ यह ऊँचा सार्वजनिक मान या विशिष्ट दर्जा दिए जाने को सूचित करता है। ‘प्रतिष्ठा’ हिन्दी में स्वाभाविक है और केवल आंतरिक ‘महानता’ कहने से अधिक प्रसंगानुकूल है।
- source_word: לְמָרְדֳּכַי
  choice: मोर्दकै को
  rationale: लामेद यहाँ प्राप्तकर्ता अथवा हितग्राही को चिह्नित करता है; हिन्दी में ‘मोर्दकै को’ स्वाभाविक है।
- source_word: עַל זֶה
  choice: इसके लिए
  rationale: यह पिछले प्रसंग में लिखे मोर्दकै के कार्य की ओर संकेत करता है और उसके कारण मिलने वाले सम्मान को व्यक्त करता है।
- source_word: נַעֲרֵי הַמֶּלֶךְ
  choice: राजा ... के जवानों
  rationale: נְעָרִים का मूल अर्थ ‘जवान/युवक’ है। अगले पदबंध में उनकी सेवा की भूमिका स्पष्ट होने के कारण इस शाब्दिक भेद को रखा गया है।
- source_word: מְשָׁרְתָיו
  choice: उसकी सेवा में रहने वाले
  rationale: שרת का कृदन्त व्यक्तिगत सेवा या परिचर्या का भाव देता है; यह हिन्दी में दरबारी सेवकों की भूमिका स्पष्ट और स्वाभाविक ढंग से बताता है।
- source_word: לֹא נַעֲשָׂה עִמּוֹ דָּבָר
  choice: उसके लिए कुछ भी नहीं किया गया
  rationale: यह निषेधात्मक कर्मवाच्य मुहावरा बताता है कि उसके हित में कोई कार्रवाई नहीं की गई थी।
