source:
  edition: WLC
  text: יָבִ֨יאוּ֙ לְב֣וּשׁ מַלְכ֔וּת אֲשֶׁ֥ר לָֽבַשׁ בּ֖/וֹ הַ/מֶּ֑לֶךְ וְ/ס֗וּס אֲשֶׁ֨ר רָכַ֤ב עָלָי/ו֙ הַ/מֶּ֔לֶךְ וַ/אֲשֶׁ֥ר נִתַּ֛ן כֶּ֥תֶר מַלְכ֖וּת בְּ/רֹאשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/006/008.yaml
  text: Let them bring a royal robe that the king has worn[a], and a horse on which the king has ridden, and on whose head a royal crown has been placed.
translation:
  language: hi
  text: वे ऐसा राजसी वस्त्र लाएँ जिसे राजा ने पहना हो, और ऐसा घोड़ा जिस पर राजा सवार हुआ हो और जिसके सिर पर राजमुकुट रखा गया हो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल भाषा में ‘उसके सिर पर’ है। यह सर्वनाम सबसे स्वाभाविक रूप से घोड़े की ओर संकेत करता है, हालाँकि कुछ पाठकों ने इसे राजा की ओर संकेत करने वाला समझा है।
    reason: मूल सर्वनाम के सम्भव सन्दर्भ की वास्तविक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: יָבִיאוּ
  choice: वे ... लाएँ
  rationale: हिफ़ील अपूर्णकाल, तृतीय पुरुष बहुवचन, यहाँ निर्देश या इच्छा का भाव व्यक्त करता है। ‘वे ... लाएँ’ इस भाव और कर्तृवाच्य दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: לְבוּשׁ מַלְכוּת
  choice: राजसी वस्त्र
  rationale: यह रचना राजत्व से जुड़े विशेष परिधान को दर्शाती है। ‘राजसी वस्त्र’ आधुनिक हिन्दी में सहज और गरिमापूर्ण है।
- source_word: אֲשֶׁר לָבַשׁ בּוֹ הַמֶּלֶךְ
  choice: जिसे राजा ने पहना हो
  rationale: सम्बन्धवाचक उपवाक्य ऐसे वस्त्र की पहचान कराता है जिसे स्वयं राजा पहन चुका है। हिन्दी में ‘जिसे ... पहना हो’ स्वाभाविक रूप से वर्तमान प्रसंग से उसकी प्रासंगिकता भी व्यक्त करता है।
- source_word: וְסוּס
  choice: और ऐसा घोड़ा
  rationale: संज्ञा दूसरी माँगी गई वस्तु का परिचय देती है और आगे के सम्बन्धवाचक उपवाक्य उसे विशिष्ट बनाते हैं; ‘ऐसा’ इस संरचना को हिन्दी में स्पष्ट और सहज बनाता है।
- source_word: אֲשֶׁר רָכַב עָלָיו הַמֶּלֶךְ
  choice: जिस पर राजा सवार हुआ हो
  rationale: यह घोड़े को उस घोड़े के रूप में निर्दिष्ट करता है जिस पर स्वयं राजा सवार हुआ है। ‘जिस पर’ मूल עַל को स्पष्ट रखता है।
- source_word: כֶּתֶר מַלְכוּת
  choice: राजमुकुट
  rationale: यह राजत्व से सम्बद्ध मुकुट है। ‘राजमुकुट’ संक्षिप्त, प्रचलित और प्रसंगानुकूल हिन्दी है।
- source_word: בְּרֹאשׁוֹ
  choice: जिसके सिर पर
  rationale: एकवचन पुल्लिंग सर्वनाम-प्रत्यय का निकटतम और सबसे स्वाभाविक पूर्वपद ‘घोड़ा’ है। ‘जिसके सिर पर’ हिन्दी में सम्बन्ध स्पष्ट करता है, जबकि पादटिप्पणी सम्भव वैकल्पिक सन्दर्भ को सुरक्षित रखती है।
