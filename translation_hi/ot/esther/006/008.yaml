translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज किंतु गरिमापूर्ण रखी गई है। समानान्तर माँगों को ‘ऐसा ... जिसे/जिस पर’ से जोड़ा गया है, और मूल के निर्देशात्मक भाव को कर्तृवाच्य ‘वे ... लाएँ’ में सुरक्षित रखा गया है।
