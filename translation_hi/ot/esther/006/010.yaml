base_translation:
  language: en
  yaml_path: translation/ot/esther/006/010.yaml
  text: Then the king said to Haman[a], “Hurry, take the robe and the horse, just as you have said, and do so for Mordecai the Jew, who sits at the king’s gate[b]. Leave out nothing from all that you have said.”
translation:
  language: hi
  text: तब राजा ने हामान से कहा, “जल्दी कर! पोशाक और घोड़ा ले, जैसा तूने कहा है, और वैसा ही यहूदी[a] मोर्दकै के लिए कर, जो राजा के फाटक पर बैठा रहता है। तूने जो कुछ कहा है, उसमें से कुछ भी मत छोड़ना[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “यहूदी” का अनुवाद “यहूदिया का निवासी” भी हो सकता है, पर यहाँ यह संभवतः कथा में मोर्दकै की जातीय-धार्मिक पहचान बताता है।
    reason: lexical_alternative
  - marker: b
    text: अधिक शाब्दिक रूप में, “तूने जो कुछ कहा है, उसमें से एक भी बात गिरने न देना”; यह एक मुहावरा है, जिसका अर्थ है कि कुछ भी न छोड़ा जाए।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַהֵר
  choice: जल्दी कर
  rationale: यह आज्ञार्थक रूप तत्काल कार्रवाई की माँग करता है; यह प्रयोग आधुनिक हिंदी में स्वाभाविक ढंग से उसकी तत्परता व्यक्त करता है।
- source_word: הַלְּבוּשׁ
  choice: वह पोशाक
  rationale: संदर्भ पिछली आयत में वर्णित राजकीय पोशाक की ओर संकेत करता है। ‘पोशाक’ विशिष्ट परिधान के लिए स्वाभाविक है, जबकि ‘वस्त्र’ अधिक सामान्य हो सकता है।
- source_word: הַסּוּס
  choice: घोड़ा
  rationale: मूल संज्ञा केवल ‘घोड़ा’ कहती है; संदर्भ में उसके राजकीय होने पर भी मुख्य पाठ में अतिरिक्त विशेषण नहीं जोड़ा गया।
- source_word: כַּאֲשֶׁר דִּבַּרְתָּ
  choice: ठीक जैसा तूने कहा है
  rationale: यह हामान के अपने प्रस्ताव से राजा की आज्ञा का स्पष्ट संबंध और कथन की विडंबना दोनों बनाए रखता है।
- source_word: וַעֲשֵׂה כֵן לְמָרְדֳּכַי
  choice: और वैसा ही मोर्दकै के लिए कर
  rationale: लाभार्थक לְ को हिंदी में ‘के लिए’ से स्वाभाविक रूप में व्यक्त किया गया है।
- source_word: הַיְּהוּדִי
  choice: यहूदी
  rationale: एस्तेर की कथा में यह पद मोर्दकै की जातीय-धार्मिक पहचान बताता है; केवल भौगोलिक मूल बताना यहाँ कम संभावित है।
- source_word: הַיּוֹשֵׁב בְּשַׁעַר הַמֶּלֶךְ
  choice: जो राजा के फाटक पर बैठता है
  rationale: कृदंत मोर्दकै की जानी-पहचानी स्थिति या भूमिका का वर्णन करता है; वर्तमानकालीन हिंदी इस स्थायी वर्णन को सहजता से व्यक्त करती है।
- source_word: אַל תַּפֵּל דָּבָר מִכֹּל אֲשֶׁר דִּבַּרְתָּ
  choice: तूने जो कुछ कहा है, उसमें से कुछ भी मत छोड़ना
  rationale: शाब्दिक रूप से किसी बात को ‘गिरने न देने’ वाला मुहावरा यहाँ किसी भी बात को न छोड़ने का अर्थ देता है; हिंदी में अर्थ स्पष्ट रखते हुए उसकी समग्रता बचाई गई है।
