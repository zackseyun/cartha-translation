base_translation:
  language: en
  yaml_path: translation/ot/esther/006/012.yaml
  text: Then Mordecai returned to the king’s gate[a], but Haman hurried to his house[b], mourning and with his head covered.
translation:
  language: hi
  text: तब मोर्दकै राजद्वार पर लौट गया, परन्तु हामान शोक में, सिर ढाँपे हुए,[a] जल्दी से अपने घर चला गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: सिर ढकना शोक, अपमान या गहरे दुःख का सांस्कृतिक चिह्न था।
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: लौट गया
  rationale: שׁוּב का कथात्मक रूप पहले के स्थान पर लौटने को दर्शाता है; आधुनिक हिन्दी में ‘लौट गया’ स्वाभाविक और स्पष्ट है।
- source_word: שַׁעַר הַמֶּלֶךְ
  choice: राजद्वार
  rationale: यह राजा अथवा राजमहल से जुड़े द्वार का बोध कराता है; ‘राजद्वार’ संक्षिप्त, प्रतिष्ठित और सामान्य हिन्दी प्रयोग है।
- source_word: נִדְחַף
  choice: धकेला-सा चला गया
  rationale: דחף के निफ़अल रूप में निष्क्रिय ‘धकेले जाने’ या विवश होकर तेजी से बढ़ने की छाया है। यह अभिव्यक्ति किसी स्पष्ट बाहरी कर्ता को जोड़े बिना उस निष्क्रिय बल और अपमानजनक जल्दबाजी दोनों को बनाए रखती है।
- source_word: בֵּיתוֹ
  choice: अपने घर की ओर
  rationale: सप्रत्यय संज्ञा का अर्थ ‘उसका घर’ है; हिन्दी में वाक्य के कर्ता के संदर्भ में ‘अपने घर’ स्वाभाविक है, और गति-सूचक क्रिया के साथ ‘की ओर’ उचित है।
- source_word: אָבֵל
  choice: शोक करता
  rationale: विशेषण हामान की शोकाकुल अवस्था बताता है; ‘शोक करता’ ठोस और सामान्य आधुनिक हिन्दी है।
- source_word: חֲפוּי רֹאשׁ
  choice: अपना सिर ढके हुए
  rationale: मूल का दृश्यात्मक मुहावरा सुरक्षित रखा गया है; इसे केवल ‘अपमानित’ कहकर व्याख्यात्मक अर्थ में सीमित नहीं किया गया।
