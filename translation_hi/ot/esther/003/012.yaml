base_translation:
  language: en
  yaml_path: translation/ot/esther/003/012.yaml
  text: Then the king’s scribes were summoned in the first month[a], on the thirteenth day of it, and it was written exactly as Haman commanded to the king’s satraps, to the governors who were over each province, and to the officials of each people, to every province in its own script and to every people in its own language[b]. It was written in the name of King Ahasuerus and sealed with the king’s signet ring.
translation:
  language: hi
  text: फिर पहले महीने के तेरहवें दिन राजा के लिपिक बुलाए गए, और हामान ने जो कुछ आज्ञा दी थी, उसके ठीक अनुसार राजा के क्षत्रपों, हर प्रांत पर नियुक्त राज्यपालों और हर जनसमूह के अधिकारियों के लिए लिखा गया—हर प्रांत के लिए उसकी अपनी लिपि[क] में और हर जनसमूह के लिए उसकी अपनी भाषा में। वह राजा अहशवेरोश के नाम से लिखा गया और राजा की मुहरवाली अंगूठी से उस पर मुहर लगाई गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: “लिपि” से आशय प्रत्येक प्रांत में प्रयुक्त लेखन-पद्धति है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקָּרְאוּ
  choice: बुलाए गए
  rationale: निफ़अल रूप का कर्मवाच्य अर्थ स्वाभाविक हिंदी में व्यक्त होता है और राजकीय बुलावे का भाव बनाए रखता है।
- source_word: סֹפְרֵי הַמֶּלֶךְ
  choice: राजा के लिपिक
  rationale: दरबारी संदर्भ में ये आधिकारिक लेखन-कर्मी हैं; ‘लिपिक’ आधुनिक हिंदी में स्पष्ट और प्रशासनिक है।
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן בִּשְׁלוֹשָׁה עָשָׂר יוֹם בּוֹ
  choice: पहले महीने के तेरहवें दिन
  rationale: काल-सूचना को बिना माह का नाम जोड़े सहज हिंदी में प्रस्तुत करता है।
- source_word: וַיִּכָּתֵב
  choice: लिखा गया
  rationale: मूल में स्पष्ट संज्ञा नहीं है, इसलिए ‘आदेश’ या ‘फरमान’ जोड़ने के बजाय कर्मवाच्य की अनिर्दिष्टता सुरक्षित रखी गई है।
- source_word: כְּכָל אֲשֶׁר צִוָּה הָמָן
  choice: हामान ने जो कुछ आज्ञा दी थी, उसके ठीक अनुसार
  rationale: כְּכָל की समग्रता और पूर्ण अनुरूपता दोनों व्यक्त होती हैं।
- source_word: אֲחַשְׁדַּרְפְּנֵי הַמֶּלֶךְ
  choice: राजा के क्षत्रपों
  rationale: फ़ारसी प्रशासनिक पद के लिए प्रचलित और सटीक ऐतिहासिक शब्द है।
- source_word: הַפַּחוֹת אֲשֶׁר עַל מְדִינָה וּמְדִינָה
  choice: प्रत्येक प्रांत पर नियुक्त राज्यपालों
  rationale: क्षत्रपों से अलग अधीनस्थ प्रांतीय अधिकारियों और उनके अधिकार-क्षेत्र को स्पष्ट करता है।
- source_word: שָׂרֵי עַם וָעָם
  choice: प्रत्येक जाति के अधिकारियों
  rationale: प्रशासनिक सूची में שָׂרֵי का व्यापक अर्थ ‘अधिकारी’ उपयुक्त है; עַם को यहाँ जातीय समुदाय के अर्थ में ‘जाति’ कहा गया है।
- source_word: מְדִינָה וּמְדִינָה כִּכְתָבָהּ
  choice: हर प्रांत को उसकी अपनी लिपि में
  rationale: כְּתָב यहाँ लेखन-पद्धति को सूचित करता है; ‘लिपि’ सटीक आधुनिक शब्द है।
- source_word: וְעַם וָעָם כִּלְשׁוֹנוֹ
  choice: हर जाति को उसकी अपनी भाषा में
  rationale: बहुभाषी साम्राज्य के संदर्भ में לָשׁוֹן का अर्थ स्वाभाविक रूप से ‘भाषा’ है।
- source_word: בְּטַבַּעַת הַמֶּלֶךְ
  choice: राजा की मुहरवाली अंगूठी से
  rationale: यह उस राजकीय अंगूठी को दर्शाता है जिससे दस्तावेज़ पर आधिकारिक मुहर लगाई जाती थी।
