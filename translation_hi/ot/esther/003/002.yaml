  text: וְ/כָל עַבְדֵ֨י הַ/מֶּ֜לֶךְ אֲשֶׁר בְּ/שַׁ֣עַר הַ/מֶּ֗לֶךְ כֹּרְעִ֤ים וּ/מִֽשְׁתַּחֲוִים֙ לְ/הָמָ֔ן כִּי כֵ֖ן צִוָּה ל֣/וֹ הַ/מֶּ֑לֶךְ וּ/מָ֨רְדֳּכַ֔י לֹ֥א יִכְרַ֖ע וְ/לֹ֥א יִֽשְׁתַּחֲוֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/002.yaml
  text: And all the king’s servants who were at the king’s gate were bowing down and paying homage to Haman[a], for the king had so commanded concerning him[b]. But Mordecai would not bow down or pay homage.
translation:
  language: hi
  text: और राजा के फाटक पर राजा के सभी सेवक हामान के सामने झुकते और दण्डवत् करते थे[a], क्योंकि राजा ने उसके विषय में ऐसी ही आज्ञा दी थी[b]। परन्तु मोर्दकै न तो झुकता था और न दण्डवत् करता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हामान के सामने भूमि पर दण्डवत् होते थे”; जिस इब्रानी क्रिया का यहाँ अनुवाद “दण्डवत् करते थे” किया गया है, उसका प्रयोग परमेश्वर के संदर्भ में “आराधना करना” के अर्थ में भी होता है।
    reason: lexical_alternative
  - marker: b
    text: या “क्योंकि राजा ने उसे ऐसी ही आज्ञा दी थी”; पर सर्वनाम का हामान की ओर संकेत करना अधिक स्वाभाविक है, अर्थात् आज्ञा उस सम्मान के विषय में थी जो उसे दिया जाना था।
    reason: alternative_reading
lexical_decisions:
- source_word: עַבְדֵי
  choice: सेवक
  rationale: राजदरबार के प्रसंग में यह राजा की सेवा में लगे लोगों के लिए स्वाभाविक और पर्याप्त व्यापक शब्द है; ‘दास’ बँधुआ स्थिति का अनावश्यक संकेत देता और ‘अधिकारी’ अर्थ को अधिक संकीर्ण कर देता।
- source_word: בְּשַׁעַר הַמֶּלֶךְ
  choice: राजा के फाटक पर
  rationale: यह राजकीय कामकाज से जुड़े ठोस सार्वजनिक या प्रशासनिक स्थान को बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: כֹּרְעִים
  choice: झुकते थे
  rationale: कृदन्त रूप प्रसंग में नियमित या प्रचलित व्यवहार बताता है; ‘झुकते थे’ इस निरंतरता को व्यक्त करता है और केवल घुटने टेकने तक अर्थ को सीमित नहीं करता।
- source_word: וּמִשְׁתַּחֲוִים
  choice: दण्डवत् करते थे
  rationale: यह मनुष्य के सामने गहरे सम्मान या अधीनता की शारीरिक मुद्रा व्यक्त करता है, पर ‘आराधना’ जैसा अनिवार्यतः धार्मिक अर्थ नहीं थोपता।
- source_word: כִּי כֵן צִוָּה לוֹ הַמֶּלֶךְ
  choice: क्योंकि राजा ने उसके विषय में ऐसी ही आज्ञा दी थी
  rationale: לוֹ को अधिक स्वाभाविक रूप से हामान के संदर्भ में समझा गया है—अर्थात् आज्ञा उसे दिए जानेवाले सम्मान के विषय में थी—जबकि वैकल्पिक व्याकरणिक समझ को पादटिप्पणी में रखा गया है।
- source_word: וּמָרְדֳּכַי
  choice: परन्तु मोर्दकै
  rationale: मूल संयोजक यहाँ पिछले सार्वभौमिक व्यवहार के साथ स्पष्ट विरोध दिखाता है; ‘परन्तु’ उस वाक्यगत बल को सहज हिन्दी में व्यक्त करता है।
- source_word: לֹא יִכְרַע וְלֹא יִשְׁתַּחֲוֶה
  choice: न तो झुकता था और न दण्डवत् करता था
  rationale: अपूर्ण क्रियाएँ मोर्दकै के निरंतर और इच्छापूर्वक इनकार को बताती हैं; यह रचना उस अभ्यस्त अस्वीकार को स्वाभाविक हिन्दी में प्रकट करती है।
theological_decisions:
- issue: क्या הִשְׁתַּחֲוָה को यहाँ स्पष्ट धार्मिक भाषा ‘आराधना करना’ से अनूदित किया जाए
  choice: दण्डवत् करना
  alternative: आराधना करना; श्रद्धापूर्वक प्रणाम करना
  rationale: इब्रानी क्रिया परमेश्वर की आराधना और मनुष्यों के सामने सम्मानसूचक दण्डवत्—दोनों के लिए आ सकती है। यहाँ उसका लक्ष्य हामान है, इसलिए ‘आराधना’ ऐसा धार्मिक दावा जोड़ सकती है जिसकी पाठ में आवश्यकता नहीं। ‘दण्डवत् करना’ शारीरिक अधीनता और गहरे सम्मान को बनाए रखते हुए मूल की अर्थगत गुंजाइश को अनावश्यक रूप से धर्मवैज्ञानिक दिशा में नहीं बाँधता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘राजा के फाटक’ से मूल का ठोस राजकीय स्थान सुरक्षित है। ‘झुकना’ और ‘दण्डवत् करना’ की जोड़ी दोनों इब्रानी क्रियाओं का भेद बनाए रखती है; ‘दण्डवत्’ प्रचलित बाइबिलीय हिन्दी है, पर यहाँ क्रियात्मक रूप में सरलता से समझ आता है।
