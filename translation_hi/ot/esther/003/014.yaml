  register: भाषा आधुनिक, स्पष्ट और सम्मानपूर्ण रखी गई है। ‘हर एक प्रांत’ इब्रानी की वितरणात्मक पुनरावृत्ति को हिन्दी में स्वाभाविक रूप से व्यक्त करता है; ‘जनसमुदाय’ बहुवचन ‘peoples’ का जाति-विशेष तक सीमित न होने वाला अर्थ सुरक्षित रखता है।
