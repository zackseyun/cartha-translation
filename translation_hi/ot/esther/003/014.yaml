  text: פַּתְשֶׁ֣גֶן הַ/כְּתָ֗ב לְ/הִנָּ֤תֵֽן דָּת֙ בְּ/כָל מְדִינָ֣ה וּ/מְדִינָ֔ה גָּל֖וּי לְ/כָל הָֽ/עַמִּ֑ים לִ/הְי֥וֹת עֲתִדִ֖ים לַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/014.yaml
  text: A copy of the written decree was to be issued as law in every province and province[a], being made known to all the peoples[b], so that they would be ready for this day.
translation:
  language: hi
  text: लिखित आदेश की एक प्रति हर एक प्रांत में[a] कानून के रूप में जारी की जाए और सभी जनसमुदायों को सार्वजनिक रूप से घोषित की जाए, ताकि वे इस दिन[b] के लिए तैयार रहें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “हर प्रांत और प्रांत में।” इब्रानी में ‘प्रांत’ की पुनरावृत्ति प्रत्येक प्रांत को शामिल करने पर बल देती है।
    reason: lexical_alternative
  - marker: b
    text: या, “उस दिन के लिए,” अर्थात आदेश में निर्धारित दिन के लिए।
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּתְשֶׁגֶן הַכְּתָב
  choice: लिखित आदेश की एक प्रति
  rationale: फ़ारसी मूल का शब्द आधिकारिक दस्तावेज़ की प्रति को सूचित करता है; הַכְּתָב संदर्भ में लिखित राजकीय आदेश है। यह अनुवाद प्रशासनिक अर्थ को स्पष्ट और स्वाभाविक रखता है।
- source_word: לְהִנָּתֵן דָּת
  choice: कानून के रूप में जारी की जाए
  rationale: निष्क्रिय क्रिया आधिकारिक प्रकाशन या प्रसारण को और דָּת आदेश की बाध्यकारी कानूनी हैसियत को व्यक्त करती है।
- source_word: בְּכָל מְדִינָה וּמְדִינָה
  choice: हर एक प्रांत में
  rationale: इब्रानी में ‘प्रांत’ की वितरणात्मक पुनरावृत्ति सम्पूर्णता पर बल देती है। आधुनिक हिन्दी में ‘हर एक’ वही बल स्वाभाविक ढंग से व्यक्त करता है।
- source_word: גָּלוּי לְכָל הָעַמִּים
  choice: उसे सब जनसमुदायों के बीच सार्वजनिक किया जाए
  rationale: גָּלוּי खुले रूप से ज्ञात या प्रकाशित किए जाने का भाव रखता है, जबकि עַמִּים साम्राज्य के विभिन्न जनसमुदायों को दर्शाता है।
- source_word: לִהְיוֹת עֲתִדִים
  choice: ताकि वे ... के लिए तैयार रहें
  rationale: यह रचना उद्देश्य या अपेक्षित परिणाम बताती है कि जनसमुदाय निर्धारित दिन के लिए तैयार रहें।
- source_word: לַיּוֹם הַזֶּה
  choice: इस दिन के लिए
  rationale: इब्रानी का औपचारिक अर्थ ‘इस दिन’ है; संदर्भ में यह आदेश में पहले से निर्धारित दिन की ओर संकेत करता है।
