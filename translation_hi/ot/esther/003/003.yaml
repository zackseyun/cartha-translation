  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज कथात्मक रूप अपनाया गया है। ‘राज-द्वार’ दरबार/महल के प्रवेश और प्रशासनिक स्थल का बोध देता है। पद में कोई आवश्यक पाठालोचनात्मक या धर्मवैचारिक पादटिप्पणी नहीं है; उपलब्ध अंग्रेज़ी पादटिप्पणी मुख्य पाठ से असंगत प्रतीत होती है, इसलिए उसे नहीं अपनाया गया।
