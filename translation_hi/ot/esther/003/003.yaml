base_translation:
  language: en
  yaml_path: translation/ot/esther/003/003.yaml
  text: Then the king’s servants who were at the king’s gate said to Mordecai[a], “Why are you transgressing the king’s command?”
translation:
  language: hi
  text: तब राजा के फाटक पर जो सेवक थे, उन्होंने मोर्दकै से कहा, “तुम राजा की आज्ञा का उल्लंघन क्यों कर रहे हो?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: तब ... कहा
  rationale: वाव-क्रमिक कथानक को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में क्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עַבְדֵי הַמֶּלֶךְ
  choice: राजा के सेवकों
  rationale: עֶבֶד का मूल अर्थ ‘सेवक’ है; प्रसंग में ये राजकीय कार्य से जुड़े व्यक्ति हैं, पर ‘अधिकारी’ कहना स्रोत से अधिक विशिष्ट होगा।
- source_word: אֲשֶׁר בְּשַׁעַר הַמֶּלֶךְ
  choice: राज-द्वार पर रहनेवाले
  rationale: यह सेवकों की अवस्थिति बताता है। ‘राज-द्वार’ महल के प्रशासनिक प्रवेश-स्थल को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है; ‘रहनेवाले’ स्थायी निवास नहीं, उस स्थान पर उपस्थित या कार्यरत होने के अर्थ में है।
- source_word: לְמָרְדֳּכָי
  choice: मोर्दकै से
  rationale: कहने की क्रिया के साथ हिन्दी में संबोधित व्यक्ति के लिए ‘से’ स्वाभाविक है।
- source_word: מַדּוּעַ
  choice: क्यों
  rationale: कारण पूछनेवाले प्रश्न का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: אַתָּה
  choice: तुम
  rationale: मोर्दकै को संबोधित द्वितीय पुरुष एकवचन; प्रसंग में ‘तुम’ स्वाभाविक है और अनावश्यक सम्मान-सूचक अर्थ नहीं जोड़ता।
- source_word: עוֹבֵר
  choice: उल्लंघन ... कर रहे हो
  rationale: עבר यहाँ आज्ञा की सीमा लाँघने या उसे तोड़ने के अर्थ में है। ‘उल्लंघन करना’ इस रूपक-संबंधी अर्थ को ‘न मानना’ से अधिक निकटता से रखता है और आधुनिक औपचारिक हिन्दी में स्पष्ट है।
- source_word: אֵת מִצְוַת הַמֶּלֶךְ
  choice: राजा की आज्ञा का
  rationale: מִצְוָה का अर्थ ‘आज्ञा’ है; राजकीय प्रसंग में यह स्वाभाविक है और धार्मिक ‘आज्ञा’ तक सीमित नहीं।
