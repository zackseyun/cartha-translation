  choice: राजा क्षयर्ष के राज्य के बारहवें वर्ष में
  rationale: यह राजकीय वर्ष-गणना का सूत्र है। हिन्दी में केवल ‘राजा के बारहवें वर्ष’ की अपेक्षा ‘राज्य के बारहवें वर्ष’ अर्थ को अधिक स्पष्ट करता है।
- source_word: הִפִּיל פּוּר
  choice: पूर ... डाली गई
  rationale: हिफ़ील रूप यहाँ चिट्ठी डालने का मुहावरा है। कर्मवाच्य अनिर्दिष्ट कर्ता को बनाए रखता है, और विदेशी शब्द ‘पूर’ को मूल के अनुसार सुरक्षित रखता है।
- source_word: הוּא הַגּוֹרָל
  choice: अर्थात् चिट्ठी
  rationale: मूल पाठ स्वयं फ़ारसी ऋणशब्द ‘पूर’ का सामान्य इब्रानी शब्द से अर्थ बताता है। ‘चिट्ठी’ हिन्दी में निर्णय या चयन के लिए डाली जाने वाली lot का सहज समतुल्य है।
- source_word: לִפְנֵי הָמָן
  choice: हामान के सामने
  rationale: לִפְנֵי का स्थानवाचक अर्थ ‘के सामने/उपस्थिति में’ है; ‘के सामने’ संक्षिप्त और स्वाभाविक है।
- source_word: מִיּוֹם לְיוֹם וּמֵחֹדֶשׁ לְחֹדֶשׁ שְׁנֵים עָשָׂר
  choice: दिन और महीने का पता लगाने के लिए चिट्ठी डालते-डालते बारहवाँ महीना ... निकला
  rationale: खंडित और संक्षिप्त इब्रानी वाक्यांश के संदर्भगत आशय को पठनीय हिन्दी में व्यक्त किया गया है। मूल की अधिक शाब्दिक संरचना और उसकी अस्पष्टता पादटिप्पणी में सुरक्षित है।
- source_word: הוּא חֹדֶשׁ אֲדָר
  choice: अर्थात् अदार महीना
  rationale: व्याख्यात्मक समानाधिकरण को ‘अर्थात्’ से स्पष्ट किया गया है और महीने का नाम लिप्यंतरित किया गया है।
