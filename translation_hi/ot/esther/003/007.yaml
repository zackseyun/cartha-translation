base_translation:
  language: en
  yaml_path: translation/ot/esther/003/007.yaml
  text: In the first month[a], that is, the month of Nisan, in the twelfth year of King Ahasuerus, Pur—that is, the lot—was cast before Haman, from day to day and from month to month, until the twelfth month, that is, the month of Adar.
translation:
  language: hi
  text: पहले महीने में, अर्थात् नीसान महीने में, राजा अहश्वेरोश के बारहवें वर्ष में, हामान के सामने पूर—अर्थात् चिट्ठी—डाली गई, दिन से दिन और महीने से महीने, बारहवें महीने तक, अर्थात् अदार महीने तक।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से: “दिन से दिन और महीने से महीने, बारह, अर्थात् अदार महीना।” इब्रानी की संक्षिप्त रचना से यह संकेत मिलता है कि चिट्ठी डालने का क्रम बारहवें महीने, अदार, तक पहुँचा।'
    reason: मूल इब्रानी की संक्षिप्त और कुछ अस्पष्ट काल-संबंधी रचना को दर्ज करना।
