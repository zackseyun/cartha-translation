base_translation:
  language: en
  yaml_path: translation/ot/esther/003/004.yaml
  text: And when they spoke to him day after day and he would not listen to them[a], they told Haman, to see whether Mordecai’s words would stand, for he had told them that he was a Jew.
translation:
  language: hi
  text: जब वे दिन-प्रतिदिन उससे कहते रहे और उसने उनकी बात नहीं मानी, तब उन्होंने हामान को खबर दी, यह देखने के लिए कि मोर्दकै की बातें टिकेंगी या नहीं, क्योंकि उसने उन्हें बता दिया था कि वह यहूदी है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בְאָמְרָם אֵלָיו
  choice: जब वे उससे कहते रहे
  rationale: वַיְהִי के साथ בְּ और infinitive construct यहाँ समय-सूचक कथात्मक संक्रमण बनाते हैं। ‘कहते रहे’ बार-बार किए गए आग्रह को अगले पदबंध के साथ स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יוֹם וָיוֹם
  choice: दिन-प्रतिदिन
  rationale: यह इब्रानी मुहावरा प्रतिदिन दोहराई गई कार्रवाई और लगातार आग्रह को दर्शाता है।
- source_word: וְלֹא שָׁמַע אֲלֵיהֶם
  choice: और उसने उनकी बात नहीं मानी
  rationale: שׁמע אֶל का अर्थ केवल सुनना नहीं, बल्कि बात मानना या ध्यान देना भी है। प्रसंग में मोर्दकै का लगातार इनकार अभिप्रेत है।
- source_word: וַיַּגִּידוּ לְהָמָן
  choice: तब उन्होंने हामान को ... बताया
  rationale: נגד के हिफ़ील रूप का अर्थ बताना या सूचना देना है। ‘बताया’ सरल और स्वाभाविक है।
- source_word: לִרְאוֹת
  choice: यह देखने के लिए
  rationale: Infinitive यहाँ उद्देश्य प्रकट करता है; हिन्दी में यह पदबंध उस उद्देश्य को स्पष्ट रखता है।
- source_word: הֲיַעַמְדוּ דִּבְרֵי מָרְדֳּכַי
  choice: मोर्दकै की बात टिकेगी या नहीं
  rationale: עמד के ‘खड़े रहने/टिकने’ के रूपक को ‘टिकेगी’ बनाए रखता है। דִּבְרֵי बहुवचन होते हुए भी यहाँ मोर्दकै के कथन, दावे या बताए कारण को सामूहिक अर्थ में ‘बात’ कहना स्वाभाविक है और मूल की अस्पष्टता को पूरी तरह समाप्त नहीं करता।
- source_word: כִּי הִגִּיד לָהֶם
  choice: क्योंकि उसने उन्हें बता दिया था
  rationale: כִּי उनके हामान को बताने का कारण देता है, और हिन्दी का पूर्वपूर्ण भाव इस सूचना के पहले दिए जा चुकने को दिखाता है।
- source_word: אֲשֶׁר הוּא יְהוּדִי
  choice: कि वह यहूदी है
  rationale: יְהוּדִי जातीय-धार्मिक पहचान बताता है। प्रत्यक्ष कथन की विषयवस्तु में वर्तमानकालीन ‘है’ हिन्दी में स्वाभाविक है और पहचान की निरंतरता बनाए रखता है।
