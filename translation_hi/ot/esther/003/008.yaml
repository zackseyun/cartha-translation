base_translation:
  language: en
  yaml_path: translation/ot/esther/003/008.yaml
  text: Then Haman said to King Ahasuerus[a], “There is a certain people, scattered and separated among the peoples in all the provinces of your kingdom. Their laws are different from those of every other people, and they do not keep the king’s laws, so it is not in the king’s interest to let them remain.”
translation:
  language: hi
  text: तब हामान ने राजा अहश्वेरोश से कहा, “एक जाति ऐसी है जो आपके राज्य के सभी प्रांतों में अन्य जातियों के बीच बिखरी हुई और अलग-थलग पड़ी है। उसके नियम हर दूसरी जाति के नियमों से भिन्न हैं, और उसके लोग राजा के नियमों का पालन नहीं करते। इसलिए उन्हें रहने देना[a] राजा के हित में नहीं है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उन्हें उनके हाल पर छोड़ देना” अथवा “उन्हें बिना बाधा रहने देना।” इब्रानी क्रिया का अर्थ किसी को रहने देना या उसे बिना छेड़े छोड़ देना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶשְׁנוֹ עַם אֶחָד
  choice: एक जाति ऐसी है
  rationale: यह वाक्यांश किसी एक अनिर्दिष्ट किन्तु लक्षित समुदाय का संकेत देता है। ‘एक जाति ऐसी है’ हामान के जानबूझकर अस्पष्ट और संदेह उत्पन्न करने वाले लहजे को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מְפֻזָּר וּמְפֹרָד
  choice: बिखरी हुई और अलग-अलग रहती है
  rationale: दोनों कृदन्तों को अलग-अलग व्यक्त किया गया है। यह अनुवाद भौगोलिक बिखराव और अन्य समुदायों के बीच अलग स्थिति—दोनों को बनाए रखता है, बिना इसे आन्तरिक फूट मानने के।
- source_word: בֵּין הָעַמִּים
  choice: दूसरी जातियों के बीच
  rationale: यहाँ עַמִּים साम्राज्य के भीतर के जातीय समुदायों को सूचित करता है। हिन्दी में ‘दूसरी जातियों’ तुलना और बहुवचन समुदायों का अर्थ स्पष्ट करता है।
- source_word: בְּכֹל מְדִינוֹת מַלְכוּתֶךָ
  choice: आपके राज्य के सभी प्रान्तों में
  rationale: एस्तेर में מְדִינוֹת प्रशासनिक प्रान्तों के लिए प्रयुक्त होता है; यह उसका सहज और सटीक हिन्दी रूप है।
- source_word: דָתֵיהֶם
  choice: उसके नियम
  rationale: דָּת का अर्थ यहाँ कानून, नियम या राजकीय विधान हो सकता है। ‘नियम’ समुदाय के अपने विधान और आगे आने वाले राजा के नियमों के बीच समान शब्दावली बनाए रखता है। एकवचन ‘जाति’ के अनुरूप हिन्दी में ‘उसके’ स्वाभाविक है।
- source_word: שֹׁנוֹת מִכָּל עָם
  choice: हर दूसरी जाति के नियमों से भिन्न हैं
  rationale: तुलना इस जाति के नियमों और अन्य सभी जातियों के नियमों के बीच है। ‘नियमों’ को दोहराने से आशय हिन्दी में स्पष्ट रहता है।
- source_word: וְאֶת דָּתֵי הַמֶּלֶךְ אֵינָם עֹשִׂים
  choice: उसके लोग राजा के नियमों का पालन नहीं करते
  rationale: नियमों के साथ עָשָׂה का अर्थ उनका पालन करना है। ‘उसके लोग’ जोड़ने से एकवचन सामूहिक संज्ञा ‘जाति’ से बहुवचन कर्ता की ओर स्वाभाविक हिन्दी संक्रमण होता है।
- source_word: וְלַמֶּלֶךְ אֵין שֹׁוֶה
  choice: राजा के हित में नहीं है
  rationale: यह अभिव्यक्ति राजा के लाभ या हित के अनुकूल न होने का भाव देती है। चुना हुआ रूप आधुनिक हिन्दी में स्वाभाविक है और हामान की स्वार्थपरक अपील को बनाए रखता है।
- source_word: לְהַנִּיחָם
  choice: उन्हें रहने देना
  rationale: נוח के हिफ़ील रूप का अर्थ यहाँ किसी को रहने देना, उसके हाल पर छोड़ना या बिना छेड़े रहने देना हो सकता है। मुख्य पाठ का रूप संक्षिप्त है और अनावश्यक रूप से अधिक कठोर अर्थ नहीं जोड़ता।
