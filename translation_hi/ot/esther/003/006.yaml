revisions:
- from: परन्तु मोर्दकै अकेले पर हाथ डालना उसकी दृष्टि में तुच्छ बात थी, क्योंकि लोगों ने उसे बता दिया था कि मोर्दकै किस जाति का है। इसलिए हामान ने क्षयर्ष के पूरे राज्य में रहने वाले सभी यहूदियों—मोर्दकै की जाति के लोगों—का नाश करने का उपाय ढूँढ़ा।
  to: परन्तु मोर्दकै पर अकेले हाथ उठाना हामान को तुच्छ लगा, क्योंकि उसे बताया गया था कि मोर्दकै किस लोगों में से है। इसलिए हामान ने क्षयर्ष के पूरे राज्य में रहने वाले सभी यहूदियों, अर्थात मोर्दकै के लोगों, का नाश करने का प्रयास किया।
  rationale: The revision retains the Hebrew sequence and rhetorical repetition while using modern Hindi that does not conflate a people-group with caste. It also makes the hostile sense of the hand idiom and the deliberative force of ‘sought’ more explicit.
  reviewer_model: gpt-5.6-terra
