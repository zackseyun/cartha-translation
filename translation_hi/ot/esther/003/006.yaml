source:
  edition: WLC
  text: וַ/יִּ֣בֶז בְּ/עֵינָ֗י/ו לִ/שְׁלֹ֤ח יָד֙ בְּ/מָרְדֳּכַ֣י לְ/בַדּ֔/וֹ כִּֽי הִגִּ֥ידוּ ל֖/וֹ אֶת עַ֣ם מָרְדֳּכָ֑י וַ/יְבַקֵּ֣שׁ הָמָ֗ן לְ/הַשְׁמִ֧יד אֶת כָּל הַ/יְּהוּדִ֛ים אֲשֶׁ֛ר בְּ/כָל מַלְכ֥וּת אֲחַשְׁוֵר֖וֹשׁ עַ֥ם מָרְדֳּכָֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/006.yaml
  text: But it seemed contemptible in his eyes to lay a hand on Mordecai alone[a], because they had told him what people Mordecai belonged to. So Haman sought to destroy all the Jews throughout the whole kingdom of Ahasuerus—the people of Mordecai.
translation:
  language: hi
  text: परन्तु मोर्दकै पर अकेले हाथ उठाना हामान को तुच्छ लगा, क्योंकि उसे बताया गया था कि मोर्दकै किस लोगों में से है। इसलिए हामान ने क्षयर्ष के पूरे राज्य में रहने वाले सभी यहूदियों, अर्थात मोर्दकै के लोगों, का नाश करने का प्रयास किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּבֶז בְּעֵינָיו
  choice: उसकी दृष्टि में तुच्छ बात थी
  rationale: यह अभिव्यक्ति हामान के तिरस्कारपूर्ण मूल्यांकन को बनाए रखती है और हिब्रू मुहावरे ‘उसकी आँखों में’ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करती है।
- source_word: לִשְׁלֹחַ יָד בְּ
  choice: पर हाथ डालना
  rationale: ‘हाथ डालना’ हिंसक कार्रवाई करने के ठोस बिंब और आशय दोनों को हिन्दी में सुरक्षित रखता है।
- source_word: לְבַדּוֹ
  choice: अकेले
  rationale: यह मोर्दकै को एकमात्र लक्ष्य बनाने और बाद में पूरी जाति को लक्ष्य बनाने के बीच का विरोध स्पष्ट करता है।
- source_word: כִּי הִגִּידוּ לוֹ
  choice: क्योंकि लोगों ने उसे बता दिया था
  rationale: यह कारणसूचक सम्बन्ध और मुख्य कार्रवाई से पहले सूचना मिल चुकने का कथात्मक क्रम स्पष्ट करता है; अनिर्दिष्ट बहुवचन कर्ता को ‘लोगों’ से स्वाभाविक बनाया गया है।
- source_word: אֶת עַם מָרְדֳּכָי
  choice: कि मोर्दकै किस जाति का है
  rationale: पहली occurrence में शाब्दिक ‘मोर्दकै की जाति’ का सम्बन्धपरक अर्थ साधारण हिन्दी पाठक के लिए स्पष्ट किया गया है।
- source_word: וַיְבַקֵּשׁ
  choice: उपाय ढूँढ़ा
  rationale: בקש यहाँ उद्देश्यपूर्ण प्रयास/योजना का भाव देता है; यह अनुवाद सफलता को पहले से मान लिए बिना हामान के सक्रिय इरादे को व्यक्त करता है।
- source_word: לְהַשְׁמִיד
  choice: नाश करने
  rationale: हिफ़ील रूप के पूर्ण विनाश के प्रबल आशय को गरिमापूर्ण और प्रचलित बाइबलीय हिन्दी में व्यक्त करता है।
- source_word: כָּל הַיְּהוּדִים
  choice: सभी यहूदियों
  rationale: एस्तेर के फ़ारसी प्रवासी संदर्भ में यह शब्द यहूदी लोगों को सूचित करता है, केवल यहूदा प्रदेश के निवासियों को नहीं।
- source_word: אֲשֶׁר בְּכָל מַלְכוּת אֲחַשְׁוֵרוֹשׁ
  choice: क्षयर्ष के पूरे राज्य में रहने वाले
  rationale: यह पूरे साम्राज्य में फैले हुए यहूदियों की व्यापक भौगोलिक सीमा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עַם מָרְדֳּכָי
  choice: मोर्दकै की जाति के लोगों
  rationale: अन्त में दोहराई गई अभिव्यक्ति को समानार्थक apposition के रूप में बनाए रखा गया है, जिससे मूल का आलंकारिक बल सुरक्षित रहता है।
