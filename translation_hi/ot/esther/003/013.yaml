base_translation:
  language: en
  yaml_path: translation/ot/esther/003/013.yaml
  text: Letters were sent by the hand of the couriers to all the provinces of the king[a], to destroy, to kill, and to annihilate all the Jews, from young man to old man, children and women, in one day, on the thirteenth day of the twelfth month, that is, the month Adar[d][c][b], and to plunder their spoil.
translation:
  language: hi
  text: राजा के सभी प्रान्तों में दूतों के हाथों पत्र भेजे गए[a] कि एक ही दिन—बारहवें महीने, अर्थात् अदार महीने के तेरहवें दिन—सभी यहूदियों को, जवान से लेकर बूढ़े तक[c], बच्चों और स्त्रियों समेत, नष्ट कर दिया जाए, मार डाला जाए और मिटा दिया जाए[b], और उनकी सम्पत्ति लूट ली जाए[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘दूतों के द्वारा’; इसका शाब्दिक अर्थ है ‘दौड़ने वालों के हाथों’।
    reason: lexical_alternative
  - marker: b
    text: ‘नष्ट करना, मार डालना और मिटा देना’—हिब्रू आदेश में ये तीन क्रियाएँ हिंसा की सम्पूर्णता पर जानबूझकर बल देती हैं।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से ‘जवान से बूढ़े तक’; यह अभिव्यक्ति पूरी आबादी को सम्मिलित करती है।
    reason: lexical_alternative
  - marker: d
    text: या ‘उनके लूट के माल को लूट लिया जाए’; आशय है कि उनकी वस्तुएँ लूट के रूप में छीन ली जाएँ।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשְׁלוֹחַ סְפָרִים
  choice: पत्र भेजे गए
  rationale: प्रशासनिक प्रसंग में סְפָרִים राजकीय लिखित संदेश हैं; हिन्दी में ‘पत्र’ स्वाभाविक और पर्याप्त औपचारिक है। निष्क्रिय क्रिया भी सुरक्षित रखी गई है।
- source_word: בְּיַד הָרָצִים
  choice: दूतों के हाथ
  rationale: हिब्रू के ‘हाथ से/के हाथ’ मुहावरे को बनाए रखता है; הָרָצִים शाब्दिक रूप से दौड़ने वाले, अर्थात् राजकीय दूत हैं।
- source_word: אֶל כָּל מְדִינוֹת הַמֶּלֶךְ
  choice: राजा के सभी प्रान्तों में
  rationale: गन्तव्य को स्वाभाविक हिन्दी में व्यक्त करते हुए כָּל की समग्रता सुरक्षित रखी गई है।
- source_word: לְהַשְׁמִיד לַהֲרֹג וּלְאַבֵּד
  choice: नष्ट कर दिया जाए, मार डाला जाए और मिटा दिया जाए
  rationale: निकटार्थी तीन क्रियाओं की जानबूझकर की गई तीव्र पुनरुक्ति को बनाए रखा गया है; इसे एक ही ‘संहार’ क्रिया में समेटा नहीं गया।
- source_word: מִנַּעַר וְעַד זָקֵן
  choice: जवान से लेकर बूढ़े तक
  rationale: वितरणात्मक एकवचन और आयु-सीमा दोनों को सहज हिन्दी में रखता है; ‘जवान पुरुष’ कहना सन्दर्भ में अनावश्यक रूप से केवल पुरुषों तक सीमित समझा जा सकता है।
- source_word: טַף וְנָשִׁים
  choice: बच्चों और स्त्रियों समेत
  rationale: टף के सामान्य अर्थ ‘बच्चे/छोटे बच्चे’ को स्पष्ट करता है और decree में गैर-युद्धरत लोगों के समावेश को सुरक्षित रखता है।
- source_word: בְּיוֹם אֶחָד
  choice: एक ही दिन
  rationale: एक निर्धारित दिन में पूरी हिंसा को केन्द्रित करने के बल को हिन्दी में स्वाभाविक रूप से व्यक्त करता है।
- source_word: בִּשְׁלוֹשָׁה עָשָׂר לְחֹדֶשׁ שְׁנֵים עָשָׂר הוּא חֹדֶשׁ אֲדָר
  choice: बारहवें महीने, अर्थात् अदार महीने के तेरहवें दिन
  rationale: हिब्रू तिथि और अदार की व्याख्यात्मक पहचान दोनों को स्पष्ट आधुनिक हिन्दी क्रम में रखता है।
- source_word: וּשְׁלָלָם לָבוֹז
  choice: उनकी सम्पत्ति लूट ली जाए
  rationale: हिब्रू के लूट के लिए उपलब्ध माल और उसे लूटने की क्रिया का आशय स्वाभाविक हिन्दी में व्यक्त होता है; शाब्दिक पुनरुक्ति का विकल्प पादटिप्पणी में दिया गया है।
