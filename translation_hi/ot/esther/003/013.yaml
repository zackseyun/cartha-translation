  register: भाषा आधुनिक, गरिमापूर्ण और स्पष्ट रखी गई है। राजकीय आदेश की औपचारिकता तथा हिब्रू की हिंसक त्रिक अभिव्यक्ति सुरक्षित है। हिन्दी वाक्य को पठनीय बनाने के लिए तिथि को डैशों के बीच रखा गया है; मूल आशय और क्रमगत सम्बन्ध अपरिवर्तित हैं।
