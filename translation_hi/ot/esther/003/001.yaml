base_translation:
  language: en
  yaml_path: translation/ot/esther/003/001.yaml
  text: After these things[a], King Ahasuerus promoted Haman son of Hammedatha the Agagite, exalted him[c][b], and set his throne above all the officials who were with him.
translation:
  language: hi
  text: इन घटनाओं के बाद[a] राजा अहश्वेरोश ने हम्मदाता के पुत्र, अगागी[b] हामान को पद में बढ़ाया, उसे ऊँचा उठाया, और हामान का आसन[c] राजा के साथ रहनेवाले सब अधिकारियों से ऊपर रखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘इन बातों के बाद।’
    reason: lexical_alternative
  - marker: b
    text: ‘अगागी’ इब्रानी संबोधन को सुरक्षित रखता है; यह अगाग से जुड़े वंश या समुदाय का संकेत हो सकता है।
    reason: cultural_note
  - marker: c
    text: या ‘उसका राजकीय आसन।’ यहाँ ‘आसन’ पद और वरिष्ठता का सूचक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: इन घटनाओं के बाद
  rationale: यह कथा में अगले घटनाक्रम को आरम्भ करने वाला समय-सूचक वाक्यांश है। ‘घटनाओं’ से आशय स्वाभाविक रूप से स्पष्ट होता है, जबकि पादटिप्पणी अधिक शाब्दिक विकल्प सुरक्षित रखती है।
- source_word: גִּדַּל
  choice: पद में बढ़ाया
  rationale: राजदरबार के संदर्भ में क्रिया हामान के पद और प्रतिष्ठा को बढ़ाने की ओर संकेत करती है।
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: राजा अहश्वेरोश
  rationale: उपाधि को नाम से पहले रखना स्वाभाविक हिन्दी प्रयोग है; इब्रानी नाम का निकट देवनागरी लिप्यंतरण रखा गया है।
- source_word: הָמָן
  choice: हामान
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: בֶּן הַמְּדָתָא
  choice: हम्मदाता के पुत्र
  rationale: पितृनाम-संबंध को स्पष्ट और प्रत्यक्ष रूप से सुरक्षित रखा गया है।
- source_word: הָאֲגָגִי
  choice: अगागी
  rationale: इब्रानी कुल अथवा जातीय संबोधन को बिना उसके ऐतिहासिक संबंध का अतिरिक्त अर्थ निर्धारित किए लिप्यंतरित किया गया है।
- source_word: וַיְנַשְּׂאֵהוּ
  choice: उसे ऊँचा उठाया
  rationale: यह पदोन्नति के साथ सम्मान और वरिष्ठता में उन्नयन का दूसरा, बलवर्धक कथन है; इसे पहली क्रिया में मिला नहीं दिया गया।
- source_word: וַיָּשֶׂם אֶת כִּסְאוֹ
  choice: उसका सिंहासन ... रखा
  rationale: כִּסֵּא अधिकार और पद-प्रतिष्ठा के आसन को दर्शाता है; ‘सिंहासन’ दरबारी संदर्भ और प्रतीकात्मक वरिष्ठता दोनों व्यक्त करता है।
- source_word: מֵעַל כָּל הַשָּׂרִים
  choice: सब अधिकारियों से ऊपर
  rationale: यह अन्य राजकीय पदाधिकारियों की तुलना में हामान के उच्चतर पद को स्पष्ट करता है।
- source_word: אֲשֶׁר אִתּוֹ
  choice: अपने साथ रहनेवाले
  rationale: संदर्भ में सर्वनाम का स्वाभाविक संबंध राजा से है। हिन्दी का आत्मवाचक ‘अपने’ इसे सहज ढंग से व्यक्त करता है।
