base_translation:
  language: en
  yaml_path: translation/ot/esther/003/010.yaml
  text: So the king took his signet ring from his hand and gave it to Haman son of Hammedatha the Agagite[a], the enemy of the Jews.
translation:
  language: hi
  text: तब राजा ने अपनी मुहरवाली अँगूठी अपने हाथ से उतारी और उसे हम्मदाता के पुत्र, अगागी हामान को दे दी, जो यहूदियों[a] का शत्रु था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘यहूदा/यहूदिया के लोग।’ हिब्रू शब्द יְהוּדִים व्यापक रूप से यहूदी लोगों को, या कुछ संदर्भों में यहूदा/यहूदिया के लोगों को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר
  choice: उतारी
  rationale: क्रिया का अर्थ हटाना या उतारना है; अँगूठी और ‘हाथ से’ के संदर्भ में ‘उतारी’ स्वाभाविक और सटीक है।
- source_word: טַבַּעְתּוֹ
  choice: अपनी मुहरवाली अँगूठी
  rationale: राजदरबार के संदर्भ में यह आधिकारिक मुहर लगाने वाली अँगूठी है; यह अनुवाद उसके राजनीतिक और प्रशासनिक कार्य को स्पष्ट करता है।
- source_word: מֵעַל יָדוֹ
  choice: अपने हाथ से
  rationale: हिब्रू पदबंध की छवि को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וַיִּתְּנָהּ
  choice: उसे ... दे दिया
  rationale: स्त्रीलिंग प्रत्यय का संदर्भ अँगूठी से है; ‘दे दिया’ पूर्ण हुई कथात्मक क्रिया को सहज हिन्दी में व्यक्त करता है।
- source_word: לְהָמָן
  choice: हामान को
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: בֶּן הַמְּדָתָא
  choice: हम्मदाता के पुत्र
  rationale: पितृनाम-संबंधी हिब्रू रचना को सीधे और स्पष्ट रूप में प्रस्तुत करता है।
- source_word: הָאֲגָגִי
  choice: अगागी
  rationale: वंश अथवा जातीय संबोधन के हिब्रू रूप और उसके कथात्मक संकेत को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: צֹרֵר
  choice: शत्रु
  rationale: यह कृदंत विरोध और वैर रखने वाले व्यक्ति को दर्शाता है; संदर्भ में ‘शत्रु’ स्वाभाविक और प्रभावशाली है।
- source_word: הַיְּהוּדִים
  choice: यहूदियों
  rationale: एस्तेर में यहाँ निशाना बनाए गए व्यापक जातीय समुदाय का उल्लेख है; ‘यहूदी’ आधुनिक हिन्दी का मानक और संदर्भानुकूल शब्द है।
- source_word: וַ
  choice: तब
  rationale: कथानक की अगली, पूर्ववर्ती निर्णय के परिणामस्वरूप होने वाली क्रिया को आधुनिक हिन्दी में सहजता से जोड़ता है।
