base_translation:
  language: en
  yaml_path: translation/ot/esther/003/009.yaml
  text: If it seems good to the king[a], let it be written that they be destroyed, and I will weigh out ten thousand talents of silver into the hands of those who do the work[c][b], to bring it into the king’s treasuries.
translation:
  language: hi
  text: यदि राजा को अच्छा लगे[a], तो लिखा जाए कि उनका नाश कर दिया जाए; और मैं चाँदी के दस हज़ार किक्कार तौलकर काम करनेवालों के हाथ में दे दूँगा[b][c], ताकि वे उसे राजा के भंडारों में पहुँचा दें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यदि राजा प्रसन्न हो।”
    reason: lexical_alternative
  - marker: b
    text: मूल भाषा में “चाँदी के दस हज़ार किक्कार”; किक्कार भार की एक बहुत बड़ी प्राचीन इकाई थी। यहाँ सिक्कों की गिनती नहीं, बल्कि भार से मापी गई चाँदी की बात है।
    reason: cultural_note
  - marker: c
    text: “काम करनेवालों के हाथ में” का अर्थ उन लोगों के माध्यम से भी हो सकता है जो यह काम पूरा करने के लिए नियुक्त थे।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם עַל הַמֶּלֶךְ טוֹב
  choice: यदि राजा को अच्छा लगे
  rationale: यह इब्रानी राजकीय स्वीकृति या प्रसन्नता का मुहावरा है। यह हिन्दी में स्वाभाविक रहते हुए मूल अभिव्यक्ति के निकट है।
- source_word: יִכָּתֵב
  choice: तो लिखा जाए
  rationale: निफ़अल रूप का शाब्दिक अर्थ ‘लिखा जाए’ है। दरबारी संदर्भ में यह लिखित राजाज्ञा का संकेत देता है, पर मुख्य पाठ उसे अनावश्यक रूप से स्पष्ट नहीं करता।
- source_word: לְאַבְּדָם
  choice: कि उनका नाश कर दिया जाए
  rationale: यह लिखी जानेवाली बात की विषयवस्तु बताता है और मूल के घातक आशय को बिना अलंकरण के व्यक्त करता है।
- source_word: כִּכַּר כֶּסֶף
  choice: किक्कार चाँदी
  rationale: כִּכָּר भार की एक बड़ी प्राचीन इकाई है। ‘किक्कार’ मूल इकाई को सुरक्षित रखता है; उसका स्वरूप पादटिप्पणी में समझाया गया है।
- source_word: אֶשְׁקוֹל
  choice: तौलकर दूँगा
  rationale: שקל का मूल अर्थ ‘तौलना’ है। चाँदी भार से दी जाती थी; ‘दूँगा’ प्रसंग में भुगतान/सौंपने का स्वाभाविक अर्थ व्यक्त करता है।
- source_word: עַל יְדֵי
  choice: के हाथों
  rationale: यह मुहावरा माध्यम या अभिकरण को दर्शा सकता है और मूल के ‘हाथ’ वाले बिंब को बनाए रखता है।
- source_word: עֹשֵׂי הַמְּלָאכָה
  choice: काम करनेवालों
  rationale: यह अपेक्षाकृत शाब्दिक और व्यापक अनुवाद है, जो व्यक्तियों को निश्चित रूप से ‘अधिकारी’ बताकर मूल की अस्पष्टता दूर नहीं करता।
- source_word: לְהָבִיא
  choice: ताकि वे उसे ... पहुँचा दें
  rationale: मूल क्रिया ‘लाना’ है; हिन्दी में गंतव्य राजा के भंडार हैं, इसलिए ‘पहुँचा दें’ स्वाभाविक रूप से वही दिशा और प्रयोजन व्यक्त करता है।
- source_word: גִּנְזֵי הַמֶּלֶךְ
  choice: राजा के भंडारों
  rationale: इब्रानी संज्ञा बहुवचन है; इसलिए हिन्दी में भी ‘भंडारों’ रखा गया है।
