base_translation:
  language: en
  yaml_path: translation/ot/esther/003/011.yaml
  text: Then the king said to Haman[a], “The silver is given to you, and the people also[b], to do with them as seems good in your eyes.”
translation:
  language: hi
  text: तब राजा ने हामान से कहा, “चाँदी[a] तुम्हें दी जाती है, और ये लोग भी तुम्हें दिए जाते हैं—इनके साथ जो तुम्हारी दृष्टि में अच्छा लगे, करो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “धन।” इब्रानी כֶּסֶף का शाब्दिक अर्थ “चाँदी” है, पर इसका अर्थ “धन” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमवाचक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַמֶּלֶךְ
  choice: राजा
  rationale: मूल पाठ यहाँ राजा का व्यक्तिगत नाम नहीं, उसकी पदवी प्रयोग करता है।
- source_word: לְהָמָן
  choice: हामान से
  rationale: हिन्दी में ‘किसी से कहना’ इस अप्रत्यक्ष कर्म को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הַכֶּסֶף
  choice: चाँदी
  rationale: כֶּסֶף का मूल अर्थ ‘चाँदी’ है और विस्तारित अर्थ ‘धन/रुपया’ भी हो सकता है। मुख्य पाठ में ठोस शब्द रखा गया है और विकल्प पादटिप्पणी में दिया गया है।
- source_word: נָתוּן לָךְ
  choice: तुम्हें दे दी गई है
  rationale: निष्क्रिय कृदन्तीय रचना किसी वस्तु को हामान के अधिकार या निपटारे में दिए जाने का भाव रखती है। यह हिन्दी में स्वाभाविक रहते हुए मूल रूप का भाव बनाए रखती है।
- source_word: וְהָעָם
  choice: और वे लोग भी
  rationale: संयोजक दूसरे विषय को भी राजा की अनुमति के अंतर्गत रखता है। ‘वे लोग’ लक्षित जनसमूह को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לַעֲשׂוֹת בּוֹ
  choice: ताकि तुम उनके साथ ... करो
  rationale: अनन्त क्रिया उद्देश्य या अनुमत परिणाम बताती है। इब्रानी में सर्वनाम एकवचन है क्योंकि ‘लोग/जनता’ सामूहिक एकवचन संज्ञा है; हिन्दी में ‘वे लोग—उनके साथ’ अधिक स्वाभाविक है।
- source_word: כַּטּוֹב בְּעֵינֶיךָ
  choice: जो तुम्हारी दृष्टि में अच्छा हो
  rationale: यह इब्रानी मुहावरा उस कार्य को दर्शाता है जो किसी को उचित या मनभावन प्रतीत हो। अनुवाद मूल की ‘आँखों/दृष्टि’ वाली छवि बनाए रखता है।
