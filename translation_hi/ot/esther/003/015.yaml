  text: הָֽ/רָצִ֞ים יָצְא֤וּ דְחוּפִים֙ בִּ/דְבַ֣ר הַ/מֶּ֔לֶךְ וְ/הַ/דָּ֥ת נִתְּנָ֖ה בְּ/שׁוּשַׁ֣ן הַ/בִּירָ֑ה וְ/הַ/מֶּ֤לֶךְ וְ/הָמָן֙ יָשְׁב֣וּ לִ/שְׁתּ֔וֹת וְ/הָ/עִ֥יר שׁוּשָׁ֖ן נָבֽוֹכָה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/015.yaml
  text: The couriers went out[a], hurried by the king’s command, and the decree was issued in Susa the citadel. And the king and Haman sat down to drink[b], but the city of Susa was thrown into confusion.
translation:
  language: hi
  text: राजा की आज्ञा पर राजकीय दूत जल्दबाज़ी में निकल पड़े। राजाज्ञा शूशन के राजदुर्ग में जारी कर दी गई[a]। राजा और हामान पीने बैठ गए, पर शूशन नगर व्याकुल हो उठा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “कानून शूशन के राजदुर्ग में दे दिया गया।” फ़ारसी प्रशासनिक संदर्भ में דָּת का अर्थ “कानून,” “आदेश” या “राजाज्ञा” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद “भौंचक्का रह गया” या “उथल-पुथल में पड़ गया” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָצִים
  choice: राजकीय दूत
  rationale: फ़ारसी प्रशासनिक संदर्भ में ये शाही संदेश पहुँचाने वाले दूत हैं। केवल शाब्दिक ‘दौड़नेवाले’ की अपेक्षा ‘राजकीय दूत’ उनके आधिकारिक कार्य को स्पष्ट करता है।
- source_word: דְחוּפִים
  choice: तत्काल चलने को बाध्य किए गए
  rationale: यह रूप उन पर डाली गई तात्कालिकता और दबाव को व्यक्त करता है; दूत अपनी ओर से केवल शीघ्र नहीं चले, बल्कि राजकीय आदेश ने उन्हें तुरंत रवाना होने को बाध्य किया।
- source_word: בִּדְבַר הַמֶּלֶךְ
  choice: राजा की आज्ञा से
  rationale: यहाँ דָּבָר सामान्य ‘बात’ नहीं, अधिकारपूर्ण राजकीय आदेश को सूचित करता है।
- source_word: הַדָּת
  choice: राजाज्ञा
  rationale: एस्तेर के फ़ारसी दरबारी संदर्भ में यह आधिकारिक कानूनी आदेश है। ‘राजाज्ञा’ संक्षिप्त, स्पष्ट और प्रसंगानुकूल है।
- source_word: נִתְּנָה
  choice: जारी कर दी गई
  rationale: क्रिया का शाब्दिक अर्थ ‘दी गई’ है, पर प्रशासनिक प्रसंग में आदेश के औपचारिक रूप से जारी किए जाने का भाव है।
- source_word: שׁוּשַׁן הַבִּירָה
  choice: शूशन के राजदुर्ग में
  rationale: בִּירָה शूशन के किलेबंद राजकीय परिसर या दुर्ग को सूचित करता है; ‘राजदुर्ग’ नगर और राजकीय परिसर के बीच भेद को सहज रूप से रखता है।
- source_word: יָשְׁבוּ לִשְׁתּוֹת
  choice: पीने बैठ गए
  rationale: यह इब्रानी अभिव्यक्ति का सीधा और स्वाभाविक हिन्दी रूप है तथा घातक आदेश और शासकों की निश्चिंत मदिरापान-सभा के बीच तीखा विरोध बनाए रखता है।
- source_word: נָבוֹכָה
  choice: असमंजस में पड़ गया
  rationale: यह नगर की व्याकुल, किंकर्तव्यविमूढ़ और उलझी हुई अवस्था को व्यक्त करता है, बिना यह निश्चित किए कि वहाँ खुला उपद्रव हुआ था।
- source_word: וְ
  choice: पर
  rationale: मूल संयोजक सामान्यतः ‘और’ है, किंतु अंतिम खंड में राजा और हामान की निश्चिंतता तथा नगर की उलझन के बीच स्पष्ट कथात्मक विरोध है; हिन्दी में ‘पर’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
