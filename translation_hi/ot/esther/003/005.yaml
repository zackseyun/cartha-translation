base_translation:
  language: en
  yaml_path: translation/ot/esther/003/005.yaml
  text: When Haman saw that Mordecai was neither bowing down nor prostrating himself before him[a], Haman was filled with rage.
translation:
  language: hi
  text: जब हामान ने देखा कि मोर्दकै उसके सामने न तो झुक रहा था, न दण्डवत् कर रहा था[a], तब हामान क्रोध से भर गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘झुककर सम्मान प्रकट कर रहा था।’ इब्रानी में अधीनता या सम्मान दिखाने वाली दो परस्पर सम्बद्ध, किन्तु भिन्न क्रियाएँ प्रयुक्त हुई हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: जब हामान ने देखा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; प्रसंग में इसका कालवाचक संबंध स्वाभाविक हिन्दी में ‘जब ... देखा’ से स्पष्ट होता है।
- source_word: כִּי אֵין מָרְדֳּכַי
  choice: कि मोर्दकै ... न तो ... न
  rationale: אֵין और कृदन्त निरन्तर न की जा रही क्रिया बताते हैं; हिन्दी में युग्मित निषेध दोनों क्रियाओं को सहज रूप से जोड़ता है।
- source_word: כֹּרֵעַ
  choice: झुकता है
  rationale: כרע घुटना मोड़ने अथवा झुकने का बोध देता है। ‘झुकता है’ शारीरिक अधीनता को व्यक्त करता है, पर अनावश्यक रूप से केवल घुटने टेकने तक अर्थ सीमित नहीं करता।
- source_word: וּמִשְׁתַּחֲוֶה
  choice: दण्डवत् करता है
  rationale: השתחוה भूमि की ओर गहराई से झुकने या औंधे होकर सम्मान प्रकट करने की क्रिया है। ‘दण्डवत् करना’ आधुनिक हिन्दी में बोधगम्य है और पहले क्रियापद से अधिक प्रबल शारीरिक भाव बनाए रखता है।
- source_word: לוֹ
  choice: उसके सामने
  rationale: शाब्दिक अर्थ ‘उसके लिए/उसको’ है, पर इन शारीरिक क्रियाओं के साथ हिन्दी में ‘उसके सामने’ लक्ष्य और संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וַיִּמָּלֵא ... חֵמָה
  choice: क्रोध से भर गया
  rationale: मूल का ‘भर जाना’ वाला मुहावरा सुरक्षित रहता है और חֵמָה की तीव्र भावावस्था को स्वाभाविक, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: חֵמָה
  choice: क्रोध
  rationale: यहाँ शब्द प्रचण्ड रोष दर्शाता है। ‘क्रोध’ सामान्य पाठक के लिए स्पष्ट और गरिमापूर्ण है; ‘से भर गया’ के साथ उसकी तीव्रता बनी रहती है।
