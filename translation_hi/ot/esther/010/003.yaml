  choice: यहूदी
  rationale: फारसी परिवेश में मोर्दकै की जातीय-सामुदायिक पहचान व्यक्त होती है; यहाँ भौगोलिक ‘यहूदिया-वासी’ की अपेक्षा ‘यहूदी’ अधिक उपयुक्त है।
- source_word: מִשְׁנֶה לַמֶּלֶךְ
  choice: राजा क्षयर्ष के बाद दूसरे स्थान पर
  rationale: यह राजा के संबंध में दूसरे पद या दर्जे को दर्शाता है और किसी विशिष्ट प्रशासनिक उपाधि को पाठ में जोड़े बिना अर्थ स्पष्ट करता है।
- source_word: וְגָדוֹל לַיְּהוּדִים
  choice: यहूदियों में महान
  rationale: यह यहूदी समुदाय के बीच मोर्दकै के ऊँचे सामाजिक स्थान और प्रतिष्ठा को निकटता से व्यक्त करता है।
- source_word: וְרָצוּי
  choice: प्रिय
  rationale: यह समुदाय द्वारा स्वीकृत, पसंद किए जाने या अनुग्रह की दृष्टि से देखे जाने का भाव सहज हिन्दी में व्यक्त करता है।
- source_word: לְרֹב אֶחָיו
  choice: अपने बहुत-से भाइयों में
  rationale: רֹב बड़ी संख्या अथवा बहुमत—दोनों का बोध करा सकता है। ‘बहुत-से’ संख्या का भाव रखता है, जबकि संकुचित ‘बहुमत’ को मुख्य पाठ में अनिवार्य नहीं बनाता।
- source_word: אֶחָיו
  choice: अपने भाइयों
  rationale: मूल का पारिवारिक रूपक सुरक्षित रखा गया है; संदर्भ में इसका व्यापक आशय साथी यहूदियों या बिरादरी के लोगों से है, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: דֹּרֵשׁ טוֹב לְעַמּוֹ
  choice: अपनी प्रजा की भलाई चाहता
  rationale: सक्रिय रूप से लोगों के हित और कल्याण की खोज करने का भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त होता है।
- source_word: וְדֹבֵר שָׁלוֹם
  choice: शांति की बातें करता
  rationale: שָׁלוֹם में शांति, कुशल और कल्याण का विस्तृत भाव है; यह अभिव्यक्ति मूल के ‘शांति बोलने’ वाले मुहावरे को समझने योग्य हिन्दी में रखती है।
- source_word: לְכָל זַרְעוֹ
  choice: अपने सारे वंश से
  rationale: זֶרַע एक सामूहिक संज्ञा है जो संतान अथवा वंशजों को दर्शाती है। ‘वंश’ इस सामूहिकता को संक्षेप और गरिमा से बनाए रखता है।
