base_translation:
  language: en
  yaml_path: translation/ot/esther/010/003.yaml
  text: For Mordecai the Jew was second to King Ahasuerus[a], great among the Jews, and favored by the multitude of his brothers[c][b], seeking good for his people and speaking peace to all his offspring.
translation:
  language: hi
  text: क्योंकि यहूदी मोर्दकै राजा क्षयर्ष के बाद दूसरे स्थान पर था। वह यहूदियों में महान था और अपने बहुत-से[a] भाइयों[b] को प्रिय था। वह अपने लोगों की भलाई चाहता और अपने सारे वंशजों[c] से कुशल की बातें करता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपने अधिकांश भाइयों को’; इब्रानी शब्द का अर्थ बड़ी संख्या अथवा बहुमत, दोनों हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘भाइयों’ से अभिप्राय संभवतः उसके साथी यहूदियों या बिरादरी के लोगों से है, केवल सगे भाइयों से नहीं।
    reason: lexical_alternative
  - marker: c
    text: या ‘अपने सारे वंश से’; इब्रानी में ‘बीज/संतान’ के लिए प्रयुक्त शब्द सामूहिक अर्थ रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन के कारण या व्याख्यात्मक आधार को जोड़ता है; हिन्दी में ‘क्योंकि’ इसके संयोजक बल को स्वाभाविक रूप से व्यक्त करता है।
