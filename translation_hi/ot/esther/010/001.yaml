- source_word: אחשרש
  choice: अहश्वेरोश
  rationale: यह इब्रानी नाम के प्रचलित हिन्दी बाइबलीय रूप के निकट है और मूल नाम की ध्वनि को पहचानने योग्य रखता है।
- source_word: מַס
  choice: कर
  rationale: इस व्यापक साम्राज्यिक संदर्भ में यह शब्द राजकीय कर या अधिभार को सूचित करता है। ‘कर’ सामान्य पाठक के लिए स्पष्ट है, जबकि शब्द की अन्य संभावनाएँ पाद-टिप्पणी में सुरक्षित रखी गई हैं।
- source_word: הָאָרֶץ
  choice: देश
  rationale: यहाँ आशय राजा के अधीन भूभाग से है, समूची पृथ्वी से नहीं। ‘देश’ उस राजनीतिक-भौगोलिक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְאִיֵּי הַיָּם
  choice: और समुद्र के द्वीपों
  rationale: यह मूल अभिव्यक्ति के भौगोलिक विस्तार को बनाए रखता है; אִיִּים का वैकल्पिक अर्थ ‘तटवर्ती प्रदेश’ पाद-टिप्पणी में दिया गया है।
