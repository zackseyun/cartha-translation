  choice: लगाया
  rationale: שׂוּם מַס עַל के प्रशासनिक मुहावरे में अर्थ किसी पर कर या राजकीय भार लगाने का है; ‘लगाया’ स्वाभाविक आधुनिक हिन्दी है।
