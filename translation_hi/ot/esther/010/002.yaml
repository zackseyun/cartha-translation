source:
  edition: WLC
  text: וְ/כָל מַעֲשֵׂ֤ה תָקְפּ/וֹ֙ וּ/גְב֣וּרָת֔/וֹ וּ/פָרָשַׁת֙ גְּדֻלַּ֣ת מָרְדֳּכַ֔י אֲשֶׁ֥ר גִּדְּל֖/וֹ הַ/מֶּ֑לֶךְ הֲ/לוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֨פֶר֙ דִּבְרֵ֣י הַ/יָּמִ֔ים לְ/מַלְכֵ֖י מָדַ֥י וּ/פָרָֽס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/010/002.yaml
  text: And all the acts of his power and might[a], and the full account of the greatness of Mordecai, to which the king raised him—are they not written in the Book of the Chronicles of the Kings of Media and Persia?
translation:
  language: hi
  text: और उसके सामर्थ्य और पराक्रम के सारे कामों का, तथा मोर्दकै की उस महानता का पूरा विवरण, जिस तक राजा ने उसे पहुँचाया था—क्या ये सब मादी और फ़ारस के राजाओं के इतिहास-वृत्तांत की पुस्तक[a] में नहीं लिखे हैं?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, ‘मादी और फ़ारस के राजाओं के राजकीय अभिलेखों की पुस्तक।’
    reason: ‘इतिहास-वृत्तांत’ के लिए प्रयुक्त इब्रानी पद आधिकारिक राजकीय अभिलेखों या वृत्तांतों को भी सूचित कर सकता है।
lexical_decisions:
- source_word: מַעֲשֵׂה תָקְפּוֹ וּגְבוּרָתוֹ
  choice: उसके सामर्थ्य और पराक्रम के सारे काम
  rationale: यह पदबंध राजा के प्रभावी सामर्थ्य और प्रतापपूर्ण कार्यों को दर्शाता है। ‘सामर्थ्य और पराक्रम’ समानार्थकता को मिटाए बिना इब्रानी के युग्म की गरिमा बनाए रखता है।
- source_word: וּפָרָשַׁת
  choice: पूरा विवरण
  rationale: यह शब्द किसी विषय के विस्तृत या पूर्ण वर्णन को सूचित करता है; ‘पूरा विवरण’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: גְּדֻלַּת מָרְדֳּכַי
  choice: मोर्दकै की उस महानता
  rationale: यह मोर्दकै की महान प्रतिष्ठा अथवा ऊँचे पद को दर्शाता है। ‘महानता’ मूल संज्ञा को बनाए रखती है और अगले उपवाक्य से उसका संबंध स्पष्ट करती है।
- source_word: אֲשֶׁר גִּדְּלוֹ הַמֶּלֶךְ
  choice: जिस तक राजा ने उसे ऊँचा उठाया था
  rationale: पिएल क्रिया גדל यहाँ किसी को महान बनाने या पद में ऊँचा उठाने का अर्थ देती है। यह अनुवाद पदोन्नति का भाव व्यक्त करते हुए संबंधवाचक रचना को सुरक्षित रखता है।
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: क्या ये सब ... नहीं लिखे हैं?
  rationale: मूल का आलंकारिक प्रश्न और बहुवचन दोनों सुरक्षित रखे गए हैं; यह बाइबिल के ऐतिहासिक सारांश की पारंपरिक शैली के अनुरूप है।
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים
  choice: इतिहास-वृत्तांत की पुस्तक
  rationale: यह राजकीय घटनाओं के आधिकारिक क्रमबद्ध अभिलेख का शीर्षक है। ‘इतिहास-वृत्तांत’ हिन्दी पाठक को उसका स्वरूप समझाता है और औपचारिक शैली बनाए रखता है।
- source_word: לְמַלְכֵי מָדַי וּפָרָס
  choice: मादै और फ़ारस के राजाओं के
  rationale: शीर्षक-सूचक संदर्भ में לְ राजाओं से संबंधित या उनके शासनकाल के अभिलेख को दर्शाता है; हिन्दी में संबंधकारक ‘के’ सबसे स्वाभाविक है।
