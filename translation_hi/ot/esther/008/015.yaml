  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। वस्त्रों के वर्णन को स्पष्ट करने के लिए इब्रानी के समन्वित वाक्य को तीन हिन्दी वाक्यों में बाँटा गया है, पर अर्थ-क्रम और दोनों नगर-प्रतिक्रियाएँ सुरक्षित रखी गई हैं।
