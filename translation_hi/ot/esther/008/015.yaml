base_translation:
  language: en
  yaml_path: translation/ot/esther/008/015.yaml
  text: And Mordecai went out from the presence of the king in royal clothing of blue and white[a], with a large crown of gold and a robe of fine linen and purple[e][d][c][b]; and the city of Susa shouted and rejoiced.
translation:
  language: hi
  text: मोर्दकै राजा की उपस्थिति से नीले[a] और सफेद रंग के राजसी वस्त्र पहने हुए निकला। उसके सिर पर सोने का एक बड़ा मुकुट था और उसने महीन लिनन और बैंगनी रंग का बाहरी वस्त्र[b] पहन रखा था। शूशन नगर ने हर्षध्वनि की[c] और आनन्द मनाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह शब्द नीले-बैंगनी रंग की बहुमूल्य राजसी रंजकता का भी बोध करा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “लपेटने वाला वस्त्र” अथवा “चोगा।”
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “पुकार उठी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָצָא מִלִּפְנֵי הַמֶּלֶךְ
  choice: राजा के सामने से ... निकला
  rationale: यह इब्रानी मुहावरे की दरबारी स्थिति और राजा की उपस्थिति से बाहर आने की गति, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְבוּשׁ מַלְכוּת
  choice: राजसी वस्त्र
  rationale: यह राजपद से जुड़े औपचारिक पहनावे को संक्षिप्त और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: תְּכֵלֶת וָחוּר
  choice: नीले और सफेद रंग के
  rationale: दोनों रंगों के स्पष्ट समानांतर को बनाए रखा गया है; תְּכֵלֶת की नीले-बैंगनी रंग की सम्भावना पादटिप्पणी में दी गई है।
- source_word: עֲטֶרֶת זָהָב גְּדוֹלָה
  choice: सोने का एक बड़ा मुकुट
  rationale: यह सिर के भव्य स्वर्णाभूषण के आकार और सामग्री, दोनों को बिना अतिरिक्त व्याख्या के व्यक्त करता है।
- source_word: תַכְרִיךְ בּוּץ וְאַרְגָּמָן
  choice: बारीक सन और बैंगनी रंग का बाहरी वस्त्र
  rationale: תַכְרִיךְ को शरीर पर लपेटे जाने वाले औपचारिक बाहरी परिधान के रूप में व्यक्त किया गया है, जबकि בּוּץ और אַרְגָּמָן की सामग्री/रंग को बनाए रखा गया है।
- source_word: הָעִיר שׁוּשָׁן
  choice: शूशन नगर
  rationale: स्थान-नाम के प्रचलित हिन्दी बाइबलीय रूप को स्वाभाविक हिन्दी पदक्रम में रखा गया है।
- source_word: צָהֲלָה וְשָׂמֵחָה
  choice: जयजयकार की और आनन्द मनाया
  rationale: पहली क्रिया के सार्वजनिक, सुनाई देने वाले उल्लास और दूसरी क्रिया के हर्ष को अलग-अलग बनाए रखा गया है।
