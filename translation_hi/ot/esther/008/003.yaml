base_translation:
  language: en
  yaml_path: translation/ot/esther/008/003.yaml
  text: Then Esther spoke again before the king. She fell before his feet[a], wept, and pleaded with him to avert the evil of Haman the Agagite and his scheme that he had devised against the Jews.
translation:
  language: hi
  text: तब एस्तेर फिर राजा के सामने बोली। वह उसके पाँवों पर गिर पड़ी, रोई और उससे विनती की कि वह अगागी हामान की बुराई और उस योजना को, जो उसने यहूदियों के विरुद्ध रची थी, दूर कर दे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हटा दे” अथवा “निष्फल कर दे।” इब्रानी क्रिया का भाव हामान की बुराई और उसकी योजना को हटा देने, टाल देने, या निष्प्रभावी कर देने का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתּוֹסֶף ... וַתְּדַבֵּר
  choice: फिर ... बोली
  rationale: יסף के साथ अगली क्रिया यहाँ दोबारा या आगे बोलने का भाव देती है। ‘फिर ... बोली’ इसे स्वाभाविक और संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: राजा के सामने
  rationale: यह राजदरबार में राजा की उपस्थिति में बोलने को दर्शाता है और मूल के स्थानिक तथा दरबारी भाव को बनाए रखता है।
- source_word: וַתִּפֹּל לִפְנֵי רַגְלָיו
  choice: उसके पाँवों पर गिर पड़ी
  rationale: यह शारीरिक रूप से दीनतापूर्वक गिरकर याचना करने की मुद्रा है। ‘पाँवों पर गिर पड़ी’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: וַתֵּבְךְּ
  choice: रोई
  rationale: בכה का सीधा अर्थ रोना है; यह प्रसंग की भावनात्मक तीव्रता को स्पष्ट रखता है।
- source_word: וַתִּתְחַנֶּן לוֹ
  choice: उससे विनती की
  rationale: हित्पएल रूप कृपा या दया के लिए गिड़गिड़ाकर निवेदन करने का भाव देता है। ‘विनती की’ गरिमापूर्ण और सहज है।
- source_word: לְהַעֲבִיר
  choice: दूर कर दे
  rationale: हिफ़िल रूप किसी वस्तु को हटा देने, बीत जाने देने या निष्प्रभावी करने का अर्थ देता है। ‘दूर कर दे’ बुराई और योजना दोनों के साथ स्वाभाविक बैठता है, जबकि अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: אֶת רָעַת הָמָן
  choice: हामान की बुराई
  rationale: רָעָה में नैतिक बुराई, हानि या विपत्ति का अर्थ हो सकता है। ‘बुराई’ इसे अगले अलग पद ‘योजना’ में विलीन किए बिना मूल की व्यापकता बनाए रखती है।
- source_word: הָאֲגָגִי
  choice: अगागी
  rationale: यह हामान की जातीय या वंशगत उपाधि है; हिन्दी में प्रचलित लिप्यंतरण उपयुक्त है।
- source_word: וְאֵת מַחֲשַׁבְתּוֹ אֲשֶׁר חָשַׁב
  choice: रची गई उसकी योजना
  rationale: חשב के संज्ञा-क्रिया युग्म में सोच-समझकर षड्यंत्र रचने का भाव है। हिन्दी में शब्दशः पुनरुक्ति से बचते हुए ‘रची गई उसकी योजना’ इस अभिप्राय को व्यक्त करता है।
- source_word: עַל הַיְּהוּדִים
  choice: यहूदियों के विरुद्ध
  rationale: इस शत्रुतापूर्ण प्रसंग में עַל विरोधी लक्ष्य को सूचित करता है; ‘के विरुद्ध’ उसका स्पष्ट और स्वाभाविक अनुवाद है।
