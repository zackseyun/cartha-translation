base_translation:
  language: en
  yaml_path: translation/ot/esther/008/008.yaml
  text: But you may write concerning the Jews as seems good in your eyes[a], in the king’s name, and seal it with the king’s signet ring[b], for a document that is written in the king’s name and sealed with the king’s signet ring cannot be revoked.
translation:
  language: hi
  text: परन्तु तुम यहूदियों के विषय में जैसा तुम्हें उचित लगे,[a] राजा के नाम से लिखो और उस पर राजा की मुहरवाली अँगूठी से मुहर लगाओ; क्योंकि जो लेख राजा के नाम से लिखा और राजा की मुहरवाली अँगूठी से मुहरबंद किया गया हो, उसे रद्द नहीं किया जा सकता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “जैसा तुम्हारी आँखों में अच्छा हो,” अर्थात् “जैसा तुम उचित समझो।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתֶּם
  choice: परन्तु तुम
  rationale: संयोजक और स्पष्ट बहुवचन सर्वनाम पिछले कथन के साथ विरोध दिखाते हैं; ‘परन्तु तुम’ इस संदर्भगत विरोध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כִּתְבוּ
  choice: लिखो
  rationale: यह बहुवचन आज्ञार्थक रूप है। राजकीय अनुमति संदर्भ से स्पष्ट है; सीधा ‘लिखो’ हिब्रू व्याकरण को बनाए रखता है।
- source_word: עַל הַיְּהוּדִים
  choice: यहूदियों के विषय में
  rationale: עַל यहाँ लेख के विषय या सरोकार को बताता है। यह अनुवाद ‘उनके पक्ष में’ जैसा अधिक विशिष्ट अर्थ आरोपित नहीं करता।
- source_word: כַּטּוֹב בְּעֵינֵיכֶם
  choice: जैसा तुम्हें उचित लगे
  rationale: शाब्दिक मुहावरा ‘जैसा तुम्हारी आँखों में अच्छा हो’ अपने निर्णय के अनुसार उचित समझने का भाव देता है; चुना हुआ रूप आधुनिक हिन्दी में स्वाभाविक है।
- source_word: בְּשֵׁם הַמֶּלֶךְ
  choice: राजा के नाम से
  rationale: यह राजकीय नाम और उससे प्राप्त अधिकार—दोनों को दर्शाने वाला निकट और प्रचलित हिन्दी रूप है।
- source_word: וְחִתְמוּ
  choice: उस पर ... मुहर लगाओ
  rationale: क्रिया का अर्थ मुहर लगाना है; लिखे जाने वाले लेख को स्पष्ट करने के लिए ‘उस पर’ जोड़ा गया है।
- source_word: בְּטַבַּעַת הַמֶּלֶךְ
  choice: राजा की मुहरवाली अँगूठी से
  rationale: प्रशासनिक संदर्भ में טַבַּעַת वह अँगूठी है जिससे आधिकारिक मुहर लगाई जाती थी; यह रूप आधुनिक पाठक के लिए उसके कार्य को स्पष्ट करता है।
- source_word: כְתָב
  choice: लेख
  rationale: हिब्रू संज्ञा सामान्यतः लिखित सामग्री या दस्तावेज को दर्शाती है। ‘लेख’ उसकी व्यापकता बनाए रखता है, जबकि ‘राजाज्ञा’ अधिक विशिष्ट होता।
- source_word: אֵין לְהָשִׁיב
  choice: उसे रद्द नहीं किया जा सकता
  rationale: मुहावरे का शाब्दिक भाव ‘वापस नहीं कराया जा सकता’ है; राजकीय-कानूनी संदर्भ में इसका स्वाभाविक अर्थ निरस्त या रद्द न किया जा सकना है।
