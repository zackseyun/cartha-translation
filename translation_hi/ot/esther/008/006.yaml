review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the causal opening, Esther’s rhetorical anguish, the impending calamity for her people, and the destruction of her kindred. However, the Hindi construction “सह सकती हूँ कि ... देखूँ” is not idiomatic for the Hebrew sequence “am I able and see”; it is better expressed with “देखना ... सह सकती हूँ.”
  naturalness: “जन्म-कुल” is understandable but not natural modern standard Hindi, and the repeated “मैं कैसे सह सकती हूँ कि” is syntactically strained. “मेरे स्वजनों” is an established, dignified modern Hindi expression for kindred, while the footnote can retain the wider lexical range.
  terminology: “विपत्ति” and “विनाश” appropriately distinguish calamity from destruction. “स्वजन” is suitable for מוֹלַדְתִּי in the text, with a note preserving the possible sense of people of one’s birth/kinfolk rather than a geographic birthplace.
  issues:
  - severity: medium
    issue: The complement construction “मैं कैसे सह सकती हूँ कि ... देखूँ?” is awkward in modern Hindi.
    rationale: Hindi normally expresses this sense as “... को देखना कैसे सह सकती हूँ?” or an equivalent construction; this more naturally represents Esther’s inability to endure witnessing the events.
  - severity: medium
    issue: “जन्म-कुल” is not a natural modern Hindi term in this context.
    rationale: It may be deciphered as birth-clan, but “स्वजन” is clearer and idiomatic. The footnote preserves that the Hebrew may include kindred or people of one’s birth.
  revised_text: क्योंकि मैं अपने लोगों पर आने वाली विपत्ति को देखना कैसे सह सकती हूँ? और मैं अपने स्वजनों का विनाश देखना कैसे सह सकती हूँ?[a]
