  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। प्रशासनिक पदों में ऐतिहासिक ‘क्षत्रप’ को बनाए रखा गया, जबकि अन्य पदों के लिए परिचित हिन्दी शब्द चुने गए। मूल वाक्य बहुत लंबा है; पठनीयता के लिए उसे तीन वाक्यों में बाँटा गया है, पर सूचना-क्रम और संबंध सुरक्षित हैं।
