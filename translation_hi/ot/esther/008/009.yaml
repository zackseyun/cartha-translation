base_translation:
  language: en
  yaml_path: translation/ot/esther/008/009.yaml
  text: Then the king’s scribes were summoned at that time[a], in the third month, that is, the month of Sivan, on its twenty-third day; and it was written exactly as Mordecai commanded, to the Jews and to the satraps, the governors, and the officials of the provinces from India to Cush, one hundred and twenty-seven provinces, to each province in its own script, to each people in its own language[b], and also to the Jews in their own script and their own language.
translation:
  language: hi
  text: उसी समय, तीसरे महीने में—अर्थात् सीवान महीने के तेईसवें दिन—राजा के लेखकों को बुलाया गया। मोर्दकै ने जो कुछ आज्ञा दी थी, ठीक उसी के अनुसार यहूदियों के लिए, क्षत्रपों, राज्यपालों और भारत से कूश[a] तक के 127 प्रान्तों के अधिकारियों के लिए लिखा गया। हर प्रान्त के लिए उसकी अपनी लिपि में, हर जनसमूह के लिए उसकी अपनी भाषा में, और यहूदियों के लिए उनकी अपनी लिपि और अपनी भाषा में लिखा गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भारत से इथियोपिया तक।” इब्रानी में प्राचीन भौगोलिक नाम “कूश” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּרְאוּ סֹפְרֵי הַמֶּלֶךְ
  choice: राजा के लेखकों को बुलाया गया
  rationale: निफ़अल का कर्मवाच्य अर्थ सुरक्षित रखते हुए राजकीय लेखन-कर्म करने वाले अधिकारियों के लिए सहज हिन्दी प्रयोग चुना गया।
- source_word: בָּעֵת הַהִיא
  choice: उसी समय
  rationale: निर्दिष्ट पूर्ववर्ती समय का स्पष्ट संकेत देता है और आरम्भिक वाव का कथानक-संबंध भी स्वाभाविक रूप से व्यक्त करता है।
- source_word: בַּחֹדֶשׁ הַשְּׁלִישִׁי הוּא חֹדֶשׁ סִיוָן
  choice: तीसरे महीने में—अर्थात् सीवान महीने के
  rationale: मूल के व्याख्यात्मक समानाधिकरण को आधुनिक हिन्दी में स्पष्ट और स्वाभाविक रखा गया।
- source_word: בִּשְׁלוֹשָׁה וְעֶשְׂרִים בּוֹ
  choice: तेईसवें दिन
  rationale: प्रत्यय का संदर्भ पहले उल्लिखित सीवान महीने से हिन्दी वाक्य में स्पष्ट है; अनावश्यक शाब्दिक जटिलता से बचा गया।
- source_word: וַיִּכָּתֵב
  choice: लिखा गया
  rationale: मूल के एकवचन कर्मवाच्य रूप को सुरक्षित रखा गया; आशय राजाज्ञा/लेख से है, पर मूल में निहित संज्ञा नहीं जोड़ी गई।
- source_word: כְּכָל אֲשֶׁר צִוָּה מָרְדֳּכַי
  choice: मोर्दकै ने जो कुछ आज्ञा दी थी, ठीक उसी के अनुसार
  rationale: כְּכָל की पूर्ण अनुरूपता और אֲשֶׁר צִוָּה की सामग्री—दोनों को स्पष्ट रूप से व्यक्त करता है।
- source_word: הָאֲחַשְׁדַּרְפְּנִים
  choice: क्षत्रपों
  rationale: फ़ारसी साम्राज्य के इस ऐतिहासिक प्रशासनिक पद का हिन्दी में प्रचलित सटीक रूप।
- source_word: הַפַּחוֹת
  choice: राज्यपालों
  rationale: प्रशासनिक संदर्भ में आधुनिक पाठक के लिए स्पष्ट समतुल्य।
- source_word: שָׂרֵי הַמְּדִינוֹת
  choice: प्रान्तों के अधिकारियों
  rationale: שָׂרֵי का प्रशासनिक अर्थ व्यक्त करता है और अनावश्यक राजवंशी अर्थ से बचता है।
- source_word: מֵהֹדּוּ וְעַד כּוּשׁ
  choice: भारत से कूश तक
  rationale: הֹדּוּ का परंपरागत भौगोलिक समतुल्य भारत है; כּוּשׁ को प्राचीन भौगोलिक नाम के रूप में लिप्यंतरित किया गया।
- source_word: מְדִינָה וּמְדִינָה כִּכְתָבָהּ וְעַם וָעָם כִּלְשֹׁנוֹ
  choice: हर प्रान्त को उसकी अपनी लिपि में, हर जाति को उसकी अपनी भाषा में
  rationale: वितरणात्मक पुनरुक्ति को स्वाभाविक हिन्दी में ‘हर’ से व्यक्त किया गया और लिपि तथा भाषा का भेद सुरक्षित रखा गया।
- source_word: וְאֶל הַיְּהוּדִים כִּכְתָבָם וְכִלְשׁוֹנָם
  choice: और यहूदियों को उनकी अपनी लिपि और अपनी भाषा में
  rationale: यहूदियों के लिए अलग से दी गई लिपि और भाषा की सूचना को बिना अर्थगत विस्तार के रखा गया।
