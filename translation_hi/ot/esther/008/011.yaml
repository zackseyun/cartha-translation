source:
  edition: WLC
  text: אֲשֶׁר֩ נָתַ֨ן הַ/מֶּ֜לֶךְ לַ/יְּהוּדִ֣ים אֲשֶׁ֣ר בְּ/כָל עִיר וָ/עִ֗יר לְ/הִקָּהֵל֮ וְ/לַ/עֲמֹ֣ד עַל נַפְשָׁ/ם֒ לְ/הַשְׁמִיד֩ וְ/לַ/הֲרֹ֨ג וּ/לְ/אַבֵּ֜ד אֶת כָּל חֵ֨יל עַ֧ם וּ/מְדִינָ֛ה הַ/צָּרִ֥ים אֹתָ֖/ם טַ֣ף וְ/נָשִׁ֑ים וּ/שְׁלָלָ֖/ם לָ/בֽוֹז׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/011.yaml
  text: that the king granted the Jews in every single city to assemble and to stand for their lives[a], to destroy, to kill, and to annihilate every armed force of any people or province that might attack them, including children and women[b], and to plunder their spoil.
translation:
  language: hi
  text: जिसमें राजा ने हर एक नगर में रहने वाले यहूदियों को यह अधिकार दिया कि वे इकट्ठे हों और अपने प्राणों की रक्षा के लिए डटे रहें,[a] और जो भी जनसमूह या प्रान्त उन पर आक्रमण करे, उसकी समस्त सशस्त्र शक्ति को, बाल-बच्चों और स्त्रियों को भी, नष्ट करें, मार डालें और मिटा दें, और उनका माल लूट लें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपने प्राणों के लिए खड़े रहें।”
    reason: मूल हिब्रू रूपक को दिखाने वाला शाब्दिक विकल्प।
lexical_decisions:
- source_word: אֲשֶׁר נָתַן
  choice: जिसमें राजा ने ... यह अधिकार दिया
  rationale: यह सम्बन्धवाचक उपवाक्य पिछले पद में आए राजकीय आदेश की विषयवस्तु को आगे बढ़ाता है; ‘अधिकार दिया’ प्रशासनिक अनुमति का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּכָל עִיר וָעִיר
  choice: हर एक नगर के
  rationale: हिब्रू की वितरणात्मक पुनरुक्ति व्यापकता पर बल देती है; ‘हर एक नगर’ उसका स्वाभाविक और स्पष्ट हिन्दी रूप है।
- source_word: לְהִקָּהֵל
  choice: इकट्ठे हों
  rationale: निफ़अल रूप सामूहिक रूप से एकत्र होने को व्यक्त करता है; यह सामान्य आधुनिक हिन्दी में सहज है।
- source_word: וְלַעֲמֹד עַל נַפְשָׁם
  choice: अपने प्राणों की रक्षा के लिए डटे रहें
  rationale: ‘अपने प्राणों के लिए खड़े रहना’ की हिब्रू छवि और आत्मरक्षा का आशय, दोनों ‘डटे रहें’ में बने रहते हैं।
- source_word: לְהַשְׁמִיד וְלַהֲרֹג וּלְאַבֵּד
  choice: नष्ट करें, मार डालें और मिटा दें
  rationale: मूल के तीन संचयी हिंसात्मक क्रियापदों को अलग-अलग रखा गया है; भाषा को न तो नरम किया गया है, न अनावश्यक रूप से अलंकृत।
- source_word: כָּל חֵיל
  choice: समस्त सशस्त्र शक्ति
  rationale: इस प्रसंग में חֵיל धन-संपत्ति नहीं बल्कि सैन्य या युद्धक्षम बल को सूचित करता है।
- source_word: עַם וּמְדִינָה
  choice: जो भी जनसमूह या प्रान्त
  rationale: यह साम्राज्य के किसी भी जातीय-राजनीतिक समूह की व्यापक और अनिश्चित परिधि व्यक्त करता है।
- source_word: הַצָּרִים אֹתָם
  choice: उन पर आक्रमण करे
  rationale: कृदन्त शत्रुतापूर्ण व्यवहार करनेवालों को सूचित करता है; आदेश के आत्मरक्षात्मक प्रसंग में ‘आक्रमण करे’ इस सक्रिय शत्रुता को स्पष्ट करता है।
- source_word: טַף וְנָשִׁים
  choice: बाल-बच्चों और स्त्रियों समेत
  rationale: טַף आश्रित छोटे बच्चों को सूचित करता है; ‘समेत’ पदबंध को पूर्ववर्ती लक्षित शत्रु-बल के अंतर्गत रखता है।
- source_word: וּשְׁלָלָם לָבוֹז
  choice: उनकी लूट की वस्तुएँ लूट लें
  rationale: मूल की विधिक अभिव्यक्ति में शत्रुओं के माल को लूट के रूप में लेने की अनुमति है; हिन्दी में वस्तु और क्रिया दोनों स्पष्ट रखे गए हैं।
theological_decisions:
- issue: राजकीय आदेश में हिंसा की भाषा
  choice: विनाश के तीनों क्रियापदों और लूट की अनुमति को सीधे व्यक्त करते हुए आत्मरक्षा का प्रसंग बनाए रखा गया।
  alternative: हिंसक भाषा को ‘पराजित करें’ जैसे नरम शब्दों में बदलना या पूरे वाक्य को केवल ‘अपनी रक्षा करें’ कहना।
  rationale: मूल पाठ घातक हिंसा और लूट को स्पष्ट रूप से अधिकृत करता है; अनुवाद को इसकी कठोरता छिपानी नहीं चाहिए। साथ ही ‘अपने प्राणों के लिए डटे रहना’ और शत्रुतापूर्ण कृदन्त आत्मरक्षात्मक परिस्थिति बताते हैं।
- issue: ‘बाल-बच्चों और स्त्रियों’ की परिधि
  choice: इसे लक्षित शत्रु-समूह में सम्मिलित रखते हुए स्पष्ट रूप से अनूदित किया गया।
  alternative: इस पदबंध को छोड़ देना, धुँधला करना, या केवल युद्धरत पुरुषों तक सीमित मानना।
  rationale: वाक्य-विन्यास इसे लक्षित समूह के साथ जोड़ता है। नैतिक तनाव को अनुवाद में न तो मिटाया गया है, न व्याख्या द्वारा हल किया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। राजकीय-विधिक स्वर के लिए ‘यह अधिकार दिया’ और हिंसात्मक त्रिक के लिए स्पष्ट समानांतर क्रियाएँ प्रयुक्त हुई हैं।
