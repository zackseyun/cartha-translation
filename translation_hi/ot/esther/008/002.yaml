base_translation:
  language: en
  yaml_path: translation/ot/esther/008/002.yaml
  text: Then the king removed his signet ring[a], which he had taken away from Haman, and gave it to Mordecai. And Esther appointed Mordecai over the house of Haman.
translation:
  language: hi
  text: तब राजा ने अपनी मुहर की अंगूठी उतारी, जिसे उसने हामान से ले लिया था, और उसे मोर्दकै को दे दिया। एस्तेर ने मोर्दकै को हामान के घराने[a] का प्रभारी नियुक्त किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हामान का घराना” अथवा “हामान की संपत्ति।”
    reason: בֵּית का अर्थ भौतिक घर से व्यापक होकर घराना या संपत्ति हो सकता है।
lexical_decisions:
- source_word: וַיָּסַר
  choice: उतारी
  rationale: यहाँ हिफ़ील क्रिया किसी वस्तु को अपने से अलग करने का भाव देती है; अंगूठी के संदर्भ में ‘उतारी’ स्वाभाविक और सटीक है।
- source_word: טַבַּעְתּוֹ
  choice: अपनी मुहर की अंगूठी
  rationale: एस्तेर के राजकीय संदर्भ में यह अधिकार प्रदान करने वाली मुहरदार अंगूठी है; ‘मुहर की अंगूठी’ उसके कार्य को स्पष्ट करती है।
- source_word: אֲשֶׁר הֶעֱבִיר מֵהָמָן
  choice: जिसे उसने हामान से ले लिया था
  rationale: हिफ़ील रूप यहाँ हामान के पास से अंगूठी हटाने या वापस लेने को दर्शाता है। ‘ले लिया था’ पूर्ववर्ती कार्रवाई को सहज हिंदी में व्यक्त करता है, बिना उसके ढंग के बारे में अतिरिक्त अर्थ जोड़े।
- source_word: וַיִּתְּנָהּ לְמָרְדֳּכָי
  choice: और उसे मोर्दकै को दे दिया
  rationale: स्त्रीलिंग प्रत्यय अंगूठी की ओर संकेत करता है; נתן का सीधा अर्थ ‘देना’ है।
- source_word: וַתָּשֶׂם אֶסְתֵּר אֶת מָרְדֳּכַי עַל
  choice: एस्तेर ने मोर्दकै को ... का अधिकारी नियुक्त किया
  rationale: שׂוּם עַל किसी व्यक्ति को किसी क्षेत्र की जिम्मेदारी या अधिकार सौंपने का भाव देता है; ‘अधिकारी नियुक्त किया’ आधुनिक हिंदी में प्रशासनिक अर्थ स्पष्ट करता है।
- source_word: בֵּית הָמָן
  choice: हामान के घराने
  rationale: בַּיִת का अर्थ घर, घराना, गृहस्थी या संपत्ति-प्रतिष्ठान हो सकता है। ‘घराना’ मूल अभिव्यक्ति की व्यापकता बनाए रखता है, जबकि संदर्भ में संपत्ति का भाव भी संभव है।
