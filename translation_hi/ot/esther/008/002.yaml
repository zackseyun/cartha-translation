translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘मुहर की अंगूठी’ राजकीय अधिकार के संकेत को सामान्य पाठक के लिए स्पष्ट करती है। पादटिप्पणी का चिह्न בֵּית הָמָן के साथ रखा गया है, क्योंकि शब्दगत विकल्प उसी पद से संबंधित हैं।
