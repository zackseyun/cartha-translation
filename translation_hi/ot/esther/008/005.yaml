base_translation:
  language: en
  yaml_path: translation/ot/esther/008/005.yaml
  text: And she said[a], “If it seems good to the king, and if I have found favor before him, and if the matter is proper before the king, and if I am pleasing in his eyes, let it be written to revoke the letters devised by Haman son of Hammedatha the Agagite[b], which he wrote to destroy the Jews who are in all the provinces of the king.”
translation:
  language: hi
  text: उसने कहा, “यदि राजा को अच्छा लगे, यदि मुझ पर उसकी कृपा हुई हो, यदि यह बात राजा की दृष्टि में उचित हो, और यदि मैं उसकी दृष्टि में प्रिय हूँ, तो हम्मदाता के पुत्र, अगागी हामान की योजना वाले उन पत्रों को रद्द करने[a] के लिए लिखा जाए[b], जिन्हें उसने राजा के सभी प्रान्तों में रहने वाले यहूदियों का नाश करने के लिए लिखा था।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उन पत्रों को पलटने” अथवा “वापस लेने के लिए”; इब्रानी क्रिया का अर्थ लौटाना या उलट देना हो सकता है और यहाँ उसका प्रयोग प्रशासनिक अर्थ में हुआ है।
    reason: lexical_alternative
  - marker: b
    text: 'अधिक शाब्दिक रूप: “हामान की योजना—वे पत्र।” अनुवाद में यह स्पष्ट किया गया है कि पत्र हामान की योजना से संबंधित थे।'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם עַל־הַמֶּלֶךְ טוֹב
  choice: यदि राजा को अच्छा लगे
  rationale: यह राजदरबार में प्रयुक्त विनम्र निवेदन का सूत्र है। हिन्दी में यह स्वाभाविक रहते हुए मूल के औपचारिक और अप्रत्यक्ष भाव को बनाए रखता है।
- source_word: מָצָאתִי חֵן לְפָנָיו
  choice: मैंने उसकी कृपादृष्टि पाई हो
  rationale: חֵן यहाँ राजा से मिलने वाली अनुकम्पा या स्वीकृति को दर्शाता है। ‘कृपादृष्टि पाना’ आधुनिक हिन्दी में इस दरबारी मुहावरे का गरिमापूर्ण और सुबोध रूप है।
- source_word: וְכָשֵׁר הַדָּבָר לִפְנֵי הַמֶּלֶךְ
  choice: यदि यह बात राजा की दृष्टि में उचित हो
  rationale: כָשֵׁר का अर्थ यहाँ उपयुक्त, सही या स्वीकार्य होना है। ‘यह बात’ דָּבָר की व्यापकता को बनाए रखती है और इसे विशेष रूप से ‘प्रस्ताव’ नहीं बनाती।
- source_word: וְטוֹבָה אֲנִי בְּעֵינָיו
  choice: यदि मैं उसकी दृष्टि में अच्छी लगती हूँ
  rationale: यह मूल के व्यक्तिगत स्वीकार्यता वाले मुहावरे को बनाए रखता है। स्त्रीलिंग ‘लगती हूँ’ एस्तेर के वक्तव्य के अनुरूप है और इसे केवल पहले वाले ‘कृपादृष्टि’ वाक्यांश की पुनरावृत्ति नहीं बनाता।
- source_word: יִכָּתֵב
  choice: लिखा जाए
  rationale: निष्क्रिय रूप और विनम्र आदेशात्मक भाव दोनों सुरक्षित रहते हैं; मूल में स्पष्ट न होने के कारण ‘आदेश’ शब्द नहीं जोड़ा गया।
- source_word: לְהָשִׁיב אֶת־הַסְּפָרִים
  choice: उन पत्रों को रद्द करने के लिए
  rationale: प्रशासनिक प्रसंग में השׁיב पहले भेजे गए राजकीय पत्रों के प्रभाव को उलटने या वापस लेने की माँग व्यक्त करता है। ‘रद्द करना’ हिन्दी में स्पष्ट है; मूल की अधिक शाब्दिक सम्भावना पादटिप्पणी में दी गई है।
- source_word: הַסְּפָרִים
  choice: पत्रों
  rationale: एस्तेर में यह शब्द साम्राज्य भर में भेजे गए राजकीय लिखित संदेशों के लिए आता है। ‘पत्र’ साधारण पाठक के लिए स्पष्ट और प्रसंगानुकूल है।
- source_word: מַחֲשֶׁבֶת הָמָן
  choice: हामान की योजना के अनुसार लिखे गए
  rationale: मूल का संक्षिप्त संबंध ‘पत्रों’ और ‘हामान की योजना’ को जोड़ता है। यह रूप स्पष्ट करता है कि पत्र उसकी विनाशकारी योजना को कार्यान्वित करते थे, जबकि शाब्दिक संरचना पादटिप्पणी में सुरक्षित है।
- source_word: לְאַבֵּד
  choice: नाश करने के लिए
  rationale: यह कारणवाचक विनाश के अर्थ को सीधे और गंभीर रूप में व्यक्त करता है, बिना अतिरिक्त तीव्रता या व्याख्या जोड़े।
- source_word: הַיְּהוּדִים אֲשֶׁר בְּכָל מְדִינוֹת הַמֶּלֶךְ
  choice: राजा के सभी प्रान्तों में रहने वाले यहूदियों
  rationale: यह मूल के संबंधवाचक उपवाक्य और साम्राज्य के सभी प्रान्तों में फैले यहूदियों के व्यापक दायरे को बनाए रखता है।
