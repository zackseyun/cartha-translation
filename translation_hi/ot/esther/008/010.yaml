  text: וַ/יִּכְתֹּ֗ב בְּ/שֵׁם֙ הַ/מֶּ֣לֶךְ אֲחַשְׁוֵרֹ֔שׁ וַ/יַּחְתֹּ֖ם בְּ/טַבַּ֣עַת הַ/מֶּ֑לֶךְ וַ/יִּשְׁלַ֣ח סְפָרִ֡ים בְּ/יַד֩ הָ/רָצִ֨ים בַּ/סּוּסִ֜ים רֹכְבֵ֤י הָ/רֶ֨כֶשׁ֙ הָֽ/אֲחַשְׁתְּרָנִ֔ים בְּנֵ֖י הָֽ/רַמָּכִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/010.yaml
  text: He wrote in the name of King Ahasuerus[a], sealed it with the king’s signet ring, and sent letters by couriers on horses, riding the royal steeds bred from swift stock.
translation:
  language: hi
  text: उसने राजा अहशवेरोश के नाम से लिखा, राजा की मुहरवाली अंगूठी से उस पर मुहर लगाई, और घोड़ों पर सवार हरकारों के हाथ पत्र भेजे—वे सवारी के घोड़े, अहश्तरानीम, रमाकीम की संतान, थे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पद में घोड़ों के लिए प्रयुक्त इब्रानी शब्द दुर्लभ हैं और उनका ठीक अर्थ अनिश्चित है। अधिक शाब्दिक रूप से वाक्यांश है, “सवारी के घोड़े, अहश्तरानीम, रमाकीम की संतान।” इसका अर्थ राजकीय अस्तबल या राजकीय डाक-सेवा से जुड़े विशेष घोड़े भी हो सकता है; अंतिम शब्द का अर्थ संभवतः प्रजनन-स्टॉक अथवा घोड़ियाँ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: उसने ... लिखा
  rationale: इब्रानी कथात्मक क्रिया को स्वाभाविक हिन्दी भूतकाल में रखा गया है; कर्ता पिछले संदर्भ से प्राप्त होता है।
- source_word: בְּשֵׁם הַמֶּלֶךְ אֲחַשְׁוֵרֹשׁ
  choice: राजा अहशवेरोश के नाम से
  rationale: यह पदबंध राजा के आधिकारिक अधिकार से लिखने का भाव देता है; ‘के नाम से’ हिन्दी में उसी प्रशासनिक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיַּחְתֹּם בְּטַבַּעַת הַמֶּלֶךְ
  choice: राजा की मुहरवाली अंगूठी से उस पर मुहर लगाई
  rationale: राजकीय संदर्भ में טַבַּעַת मुहर लगाने वाली अंगूठी है। एकवचन क्रिया लिखे हुए आदेश को सामूहिक दस्तावेज़ के रूप में देखती है, इसलिए ‘उस पर’ रखा गया है।
- source_word: וַיִּשְׁלַח סְפָרִים
  choice: पत्र भेजे
  rationale: סְפָרִים यहाँ आधिकारिक लिखित संदेश हैं; ‘पत्र’ स्पष्ट, संक्षिप्त और प्रसंगानुकूल है।
- source_word: בְּיַד הָרָצִים
  choice: हरकारों के हाथ
  rationale: בְּיַד माध्यम अथवा प्रतिनिधि के द्वारा किए गए कार्य का मुहावरा है। ‘हरकारे’ घुड़सवार राजकीय संदेशवाहकों की भूमिका को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בַּסּוּסִים רֹכְבֵי
  choice: घोड़ों पर सवार
  rationale: घोड़ों और उन पर सवार संदेशवाहकों—दोनों को स्पष्ट रखते हुए इब्रानी संरचना का अर्थ व्यक्त किया गया है।
- source_word: הָרֶכֶשׁ
  choice: राजकीय घोड़े
  rationale: यह फ़ारसी काल का दुर्लभ शब्द है, जो विशेष सवारी अथवा डाक-सेवा के घोड़ों का संकेत दे सकता है। दरबारी प्रसंग में ‘राजकीय घोड़े’ उपयुक्त है, पर अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: הָאֲחַשְׁתְּרָנִים בְּנֵי הָרַמָּכִים
  choice: जो उत्तम नस्ल की घोड़ियों की संतान थे
  rationale: दोनों शब्द दुर्लभ और अर्थ की दृष्टि से कठिन हैं। ‘संतान’ בְּנֵי की वंश-संबंधी छवि रखता है और ‘घोड़ियों’ अंतिम शब्द की संभावित पहचान को दर्शाता है; ‘उत्तम नस्ल’ विशेष राजकीय प्रजनन-स्रोत का प्रसंगानुकूल, किंतु संयत संकेत है।
