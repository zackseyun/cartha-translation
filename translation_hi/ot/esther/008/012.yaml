  yaml_path: translation/ot/esther/008/012.yaml
  text: on one day in all the provinces of King Ahasuerus, on the thirteenth day of the twelfth month, that is, the month Adar.
translation:
  language: hi
  text: एक दिन, राजा क्षयर्ष के सभी प्रान्तों में—बारहवें महीने, अर्थात् अदार महीने के तेरहवें दिन।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּיוֹם אֶחָד
  choice: एक ही दिन
  rationale: בְּ समय को सूचित करता है और אֶחָד एक दिन पर बल देता है। हिन्दी में ‘एक ही दिन’ स्वाभाविक रूप से इस बात को व्यक्त करता है कि सभी प्रान्तों में कार्रवाई उसी एक निर्धारित दिन होनी थी।
- source_word: בְּכָל מְדִינוֹת
  choice: सभी प्रान्तों में
  rationale: מְדִינוֹת साम्राज्य के प्रशासनिक प्रान्तों को दर्शाता है; ‘सभी प्रान्तों में’ सरल और सटीक स्थानवाचक अनुवाद है।
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: राजा क्षयर्ष के
  rationale: यह पदबंध प्रान्तों के शासक को पहचानता है। ‘क्षयर्ष’ हिन्दी बाइबल परम्परा में प्रचलित नाम-रूप है और यहाँ स्वाभाविक सम्बन्धकारक रचना प्रयुक्त हुई है।
- source_word: בִּשְׁלוֹשָׁה עָשָׂר
  choice: तेरहवें दिन
  rationale: कार्डिनल संख्या प्रसंग में तारीख के क्रमवाचक अर्थ में है। हिन्दी में स्पष्ट और स्वाभाविक तिथि के लिए ‘दिन’ जोड़ा गया है।
- source_word: לְחֹדֶשׁ שְׁנֵים עָשָׂר
  choice: बारहवें महीने
  rationale: शाब्दिक रूप से ‘बारह महीने का’ तिथि-विन्यास है; हिन्दी में ‘बारहवें महीने’ इसका स्वाभाविक रूप है।
- source_word: הוּא חֹדֶשׁ אֲדָר
  choice: अर्थात् अदार महीने
  rationale: הוּא यहाँ व्याख्यात्मक समानाधिकरण का कार्य करता है। ‘अर्थात्’ बारहवें महीने के नाम की स्पष्ट पहचान कराता है और औपचारिक तिथि-शैली बनाए रखता है।
