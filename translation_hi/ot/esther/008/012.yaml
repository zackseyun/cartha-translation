  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज तिथि-विन्यास रखा गया है। यह पद पिछले वाक्य की निरन्तरता है, इसलिए पूर्ण स्वतंत्र वाक्य बनाने के बजाय आरम्भिक पदबंध की संरचना सुरक्षित रखी गई है।
