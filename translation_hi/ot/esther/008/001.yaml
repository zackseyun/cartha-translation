base_translation:
  language: en
  yaml_path: translation/ot/esther/008/001.yaml
  text: On that day King Ahasuerus gave Queen Esther the house of Haman, the enemy of the Jews, and Mordecai came before the king, because Esther had told what he was to her.
translation:
  language: hi
  text: उसी दिन राजा क्षयर्ष ने यहूदियों के शत्रु हामान का घर रानी एस्तेर को दे दिया। और मोर्दकै राजा के सामने उपस्थित हुआ, क्योंकि एस्तेर ने बता दिया था कि मोर्दकै का उससे क्या संबंध था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּית הָמָן
  choice: हामान की संपत्ति
  rationale: यहाँ ‘घर’ से आशय हामान के घराने, संपदा और अधिकार में रही वस्तुओं से है; प्रसंग में राजा द्वारा उसे एस्तेर को देना इसी व्यापक अर्थ की ओर संकेत करता है।
- source_word: צֹרֵר הַיְּהוּדִים
  choice: यहूदियों के शत्रु
  rationale: צֹרֵר सक्रिय विरोधी या सताने वाले को दर्शाता है; सहज हिंदी में ‘शत्रु’ स्पष्ट और प्रसंगानुकूल है।
- source_word: בָּא לִפְנֵי הַמֶּלֶךְ
  choice: राजा के सामने उपस्थित हुआ
  rationale: यह पद केवल भौतिक रूप से आने के साथ राजकीय उपस्थिति या पहुँच का भाव रखता है; ‘उपस्थित हुआ’ स्वाभाविक और गरिमापूर्ण है।
- source_word: מַה הוּא לָהּ
  choice: उसका उससे क्या संबंध था
  rationale: हिब्रू मुहावरा दोनों के पारिवारिक संबंध को बताता है, पर संबंध का प्रकार इस वाक्य में स्वयं स्पष्ट नहीं किया गया; अनुवाद उस अस्पष्टता को बनाए रखता है।
