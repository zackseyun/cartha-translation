  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण और कथात्मक शैली। ‘घर’ के शाब्दिक रूप के बजाय प्रसंगगत ‘संपत्ति’ चुना गया है, जबकि एस्तेर और मोर्दकै के संबंध की मूल अस्पष्टता सुरक्षित रखी गई है।
