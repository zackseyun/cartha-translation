base_translation:
  language: en
  yaml_path: translation/ot/esther/008/014.yaml
  text: The couriers[a], mounted on the royal steeds, went out hastened and pressed on by the king’s command, and the decree was issued in Susa the citadel.
translation:
  language: hi
  text: राजकीय घोड़ों पर सवार दूत[a] राजा की आज्ञा से जल्दी में और आगे बढ़ने के लिए बाध्य होकर निकल पड़े। और राजाज्ञा शूशन के गढ़ में जारी कर दी गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘राजकीय नस्ल के घोड़ों पर सवार दूत’; पशुओं के लिए प्रयुक्त दो इब्रानी शब्द दुर्लभ हैं और उनकी ठीक पहचान अनिश्चित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָצִים
  choice: दूत
  rationale: शब्द का मूल संबंध ‘दौड़ने वालों’ से है, पर फ़ारसी साम्राज्य के संदर्भ में ये राजकीय संदेश पहुँचाने वाले घुड़सवार दूत हैं।
- source_word: רֹכְבֵי
  choice: पर सवार
  rationale: कृदन्त रूप दूतों को सवारी करने वालों के रूप में बताता है; हिंदी में ‘पर सवार’ स्वाभाविक है।
- source_word: הָרֶכֶשׁ הָאֲחַשְׁתְּרָנִים
  choice: राजकीय घोड़ों
  rationale: दोनों दुर्लभ शब्द तीव्र राजकीय परिवहन में प्रयुक्त पशुओं का संकेत देते हैं, पर उनकी ठीक पहचान अनिश्चित है; मुख्य पाठ में सहज और संदर्भानुकूल सामान्य अभिव्यक्ति रखी गई है।
- source_word: יָצְאוּ
  choice: निकल पड़े
  rationale: कथा में प्रस्थान और तत्पर गति दोनों को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: מְבֹהָלִים וּדְחוּפִים
  choice: जल्दबाज़ी में और तेज़ी से
  rationale: दोनों निष्क्रिय कृदन्त दूतों को शीघ्रता करने और आगे बढ़ने के लिए प्रेरित किए जाने की तीव्रता बताते हैं; हिंदी वाक्य को सहज रखते हुए दोहरा बल सुरक्षित है।
- source_word: בִּדְבַר הַמֶּלֶךְ
  choice: राजा की आज्ञा से
  rationale: यहाँ דָּבָר राजा के अधिकारपूर्ण आदेश का अर्थ देता है और בְּ उसके प्रेरक आधार को व्यक्त करता है।
- source_word: וְהַדָּת נִתְּנָה
  choice: और वह राजाज्ञा ... जारी कर दी गई
  rationale: एस्तेर के प्रशासनिक संदर्भ में דָּת शाही आदेश है और נִתְּנָה उसके आधिकारिक प्रकाशन को दर्शाता है।
- source_word: בְּשׁוּשַׁן הַבִּירָה
  choice: शूशन के गढ़ में
  rationale: स्थान-नाम को हिंदी बाइबलीय रूप ‘शूशन’ में और הַבִּירָה को किलाबंद राजकीय परिसर के अर्थ में ‘गढ़’ से व्यक्त किया गया है।
