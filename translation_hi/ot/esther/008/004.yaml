  text: Then the king held out the golden scepter to Esther[a], and Esther rose and stood before the king.
translation:
  language: hi
  text: तब राजा ने एस्तेर की ओर सोने का राजदंड बढ़ाया[a]। एस्तेर उठी और राजा के सामने खड़ी हो गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “एस्तेर की ओर सोने का राजदंड आगे किया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹשֶׁט
  choice: बढ़ाया
  rationale: क्रिया का अर्थ किसी वस्तु को किसी की ओर फैलाना या आगे करना है। राजदंड के प्रसंग में ‘बढ़ाया’ स्वाभाविक और सटीक हिन्दी है।
- source_word: שַׁרְבִיט הַזָּהָב
  choice: सोने का राजदंड
  rationale: यह निश्चित राजकीय राजदंड है, जो सोने का बना हुआ या स्वर्णिम था। ‘सोने का राजदंड’ सामान्य आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: וַתָּקָם
  choice: उठी
  rationale: यह क्रिया उठने की क्रिया बताती है और अगली क्रिया ‘खड़ी हो गई’ से अर्थगत भेद बनाए रखती है।
- source_word: וַתַּעֲמֹד לִפְנֵי הַמֶּלֶךְ
  choice: राजा के सामने खड़ी हो गई
  rationale: לִפְנֵי का अर्थ ‘के सामने’ या ‘की उपस्थिति में’ है। यह अनुवाद दरबारी परिस्थिति को बनाए रखते हुए सहज हिन्दी देता है।
- source_word: וַ
  choice: तब
  rationale: आरंभिक वाव कथा की क्रमिक प्रगति दिखाता है; ‘तब’ हिन्दी में इस अनुक्रम को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לְאֶסְתֵּר
  choice: एस्तेर की ओर
  rationale: राजदंड बढ़ाने की दिशात्मक क्रिया के साथ לְ को ‘की ओर’ कहना हिन्दी में स्वाभाविक है और राजा की क्रिया की दिशा स्पष्ट करता है।
