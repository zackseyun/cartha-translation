  yaml_path: translation/ot/esther/008/007.yaml
  text: Then King Ahasuerus said to Queen Esther and to Mordecai the Jew[a], “Look, I have given Haman’s house to Esther, and they have hanged him on the gallows because he stretched out his hand against the Jews.”
translation:
  language: hi
  text: तब राजा क्षयर्ष ने रानी एस्तेर और यहूदी मोर्दकै से कहा, “देखो, मैंने हामान का घर एस्तेर को दे दिया है, और उसे उस पेड़ पर लटका दिया गया है[a], क्योंकि उसने यहूदियों के विरुद्ध हाथ बढ़ाया था।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में ‘पेड़/लकड़ी पर’ है। इस प्रसंग में इसका संकेत हामान को दंड देने के लिए इस्तेमाल की गई लकड़ी की संरचना की ओर है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ घटनाक्रम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרֹשׁ
  choice: राजा क्षयर्ष
  rationale: हिन्दी बाइबल परंपरा में प्रचलित नामरूप ‘क्षयर्ष’ रखा गया है और उपाधि को नाम से पहले रखा गया है।
- source_word: לְאֶסְתֵּר הַמַּלְכָּה
  choice: रानी एस्तेर से
  rationale: यह आधुनिक हिन्दी में स्वाभाविक है और राजकीय उपाधि को सुरक्षित रखता है।
- source_word: וּלְמָרְדֳּכַי הַיְּהוּדִי
  choice: और यहूदी मोर्दकै से
  rationale: הַיְּהוּדִי का जातीय अर्थ यहाँ ‘यहूदी’ से स्पष्ट और प्रसंगानुकूल व्यक्त होता है।
- source_word: הִנֵּה
  choice: देखो
  rationale: यह संकेत और ध्यान आकर्षित करने वाले बल को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: בֵית הָמָן
  choice: हामान का घर
  rationale: यह मूल संरचना का निकट अनुवाद है; प्रसंग में घराने अथवा संपत्ति का व्यापक भाव भी संभव है, जिसे संकीर्ण नहीं किया गया।
- source_word: נָתַתִּי
  choice: मैंने ... दे दिया है
  rationale: पूर्ण हो चुकी क्रिया और उसके वर्तमान परिणाम—अब संपत्ति एस्तेर के अधिकार में है—दोनों व्यक्त होते हैं।
- source_word: וְאֹתוֹ תָּלוּ
  choice: उसे ... लटका दिया गया है
  rationale: इब्रानी में कर्ता अनिर्दिष्ट बहुवचन है; हिन्दी का कर्मवाच्य अनिर्दिष्ट कर्ता को स्वाभाविक ढंग से सुरक्षित रखता है।
- source_word: עַל הָעֵץ
  choice: उस लकड़ी के खंभे पर
  rationale: עֵץ का मूल अर्थ पेड़/लकड़ी है; एस्तेर के प्रसंग में यह फाँसी अथवा सार्वजनिक दंड के लिए खड़ी लकड़ी की संरचना है। ‘लकड़ी का खंभा’ मूल चित्र को ‘फाँसीघर’ जैसे अधिक विशिष्ट आधुनिक उपकरण में बदलने से बचाता है।
- source_word: עַל אֲשֶׁר
  choice: क्योंकि
  rationale: यह दंड का कारण प्रस्तुत करता है और हिन्दी में सबसे स्पष्ट संयोजक है।
- source_word: שָׁלַח יָדוֹ
  choice: हाथ उठाया था
  rationale: यह विरोध में शत्रुतापूर्ण कार्रवाई करने की इब्रानी उक्त‍ि का स्वाभाविक हिन्दी समतुल्य है और हाथ की मूल छवि बनाए रखता है।
- source_word: ביהודיים
  choice: यहूदियों के विरुद्ध
  rationale: पूर्वसर्ग यहाँ शत्रुतापूर्ण दिशा दर्शाता है; ‘यहूदियों’ जातीय समुदाय को प्रसंगानुकूल रूप से व्यक्त करता है।
