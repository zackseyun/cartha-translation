  terminology: “राजा क्षयर्ष,” “रानी एस्तेर,” “मोर्दकै,” “हामान,” and “यहूदी” are coherent and appropriate for the target register. The footnote should explain the contextual execution structure without making “खंभा” the asserted lexical meaning of the Hebrew.
