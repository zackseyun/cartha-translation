  source_fidelity: The verse’s participants, transfer of Haman’s house, indefinite agency in the execution clause, and causal connection are retained. However, “लकड़ी के खंभे” specifies the Hebrew עֵץ (‘tree/wood’) more narrowly than the source itself does. A literal main-text rendering with an explanatory note better preserves the lexical ambiguity.
