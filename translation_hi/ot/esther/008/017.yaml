  choice: हर एक प्रान्त / हर एक नगर
  rationale: हिब्रू की वितरक पुनरुक्ति को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और व्यापकता बनाए रखता है।
- source_word: דָת
  choice: राजाज्ञा
  rationale: फ़ारसी प्रशासनिक प्रसंग में यह राजा द्वारा जारी वैधानिक आदेश या फरमान है।
- source_word: יוֹם טוֹב
  choice: उत्सव का दिन
  rationale: शाब्दिक ‘अच्छा दिन’ की अपेक्षा प्रसंग में उल्लास और सार्वजनिक उत्सव का भाव स्पष्ट करता है।
- source_word: מִתְיַהֲדִים
  choice: यहूदी बनने लगे
  rationale: दुर्लभ आत्मवाचक/नामधातु रूप यहूदी पहचान अपनाने की प्रक्रिया बताता है; क्रियारूप की जारी प्रक्रिया को ‘बनने लगे’ से व्यक्त किया गया है।
- source_word: פַּחַד הַיְּהוּדִים
  choice: यहूदियों का भय
  rationale: सम्बन्धवाचक हिब्रू संरचना को बनाए रखता है; प्रसंग में इसका अर्थ यहूदियों से लगने वाला भय है।
theological_decisions:
- issue: מִתְיַהֲדִים का आशय वास्तविक धर्म-परिवर्तन था या बाहरी रूप से यहूदी पहचान जताना
  choice: मुख्य पाठ में ‘यहूदी बनने लगे’
  alternative: ‘अपने को यहूदी बताने लगे’ अथवा ‘यहूदी रीति अपनाने लगे’
  rationale: हिब्रू क्रिया पहचान अपनाने को दर्शाती है, पर उसकी आन्तरिक सच्चाई निश्चित नहीं करती। मुख्य पाठ सरल अर्थ देता है और पादटिप्पणी सम्भव बाहरी दावे की अस्पष्टता बचाती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। हिब्रू की वितरक पुनरुक्ति को हिन्दी के स्वाभाविक ‘हर एक’ से व्यक्त किया गया है; ‘आनन्द और हर्ष’ मूल की युग्म अभिव्यक्ति बनाए रखता है।
