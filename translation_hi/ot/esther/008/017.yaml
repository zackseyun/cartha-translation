base_translation:
  language: en
  yaml_path: translation/ot/esther/008/017.yaml
  text: And in every province and province, and in every city and city, wherever the king’s word and his decree reached, there was joy and gladness for the Jews, a feast and a good day. And many from the peoples of the land were becoming Jews, because the fear of the Jews had fallen on them.
translation:
  language: hi
  text: और हर एक प्रान्त और हर एक नगर में, जहाँ कहीं राजा का वचन और उसकी राजाज्ञा पहुँची, वहाँ यहूदियों के लिए आनन्द और हर्ष, भोज और उत्सव का दिन था। देश के लोगों में से बहुत-से लोग यहूदी बनने लगे[a], क्योंकि उन पर यहूदियों का भय छा गया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने को यहूदी बताने लगे” अथवा “यहूदी रीति अपनाने लगे।” हिब्रू शब्द यहूदी पहचान अपनाने का संकेत देता है, पर यह स्पष्ट नहीं करता कि यह मन से किया गया परिवर्तन था या भय के कारण बाहरी दावा।
    reason: दुर्लभ क्रिया מִתְיַהֲדִים की अर्थगत और प्रेरणागत अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
