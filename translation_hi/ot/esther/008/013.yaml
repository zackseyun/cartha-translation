base_translation:
  language: en
  yaml_path: translation/ot/esther/008/013.yaml
  text: A copy of the written decree was to be issued as law in every province and province[a], being made public to all the peoples[d][c][b], and so that the Jews would be ready on that day to avenge themselves on their enemies.
translation:
  language: hi
  text: उस लिखित आदेश की एक प्रति हर एक प्रांत[a] में कानून के रूप में जारी की जाए और सभी जातियों के लिए सार्वजनिक की जाए,[b] ताकि यहूदी उस दिन[c] अपने शत्रुओं से प्रतिशोध लेने[d] के लिए तैयार रहें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “हर प्रांत और प्रांत” है; यह “प्रत्येक प्रांत” के अर्थ में प्रयुक्त पुनरुक्ति है।
    reason: lexical_alternative
  - marker: b
    text: या “सब जातियों के लिए खुले तौर पर प्रकाशित की जाए।”
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में शाब्दिक रूप से “इस दिन के लिए”; आशय पहले से नियुक्त तिथि से है।
    reason: lexical_alternative
  - marker: d
    text: या “अपने शत्रुओं से बदला लेने।” कुछ अनुवाद प्रसंग के आधार पर “अपनी रक्षा करने” कहते हैं, पर यहाँ प्रयुक्त इब्रानी क्रिया विशेष रूप से बदला या प्रतिशोध लेने का अर्थ देती है।
    reason: alternative_reading
lexical_decisions:
- source_word: פַּתְשֶׁגֶן הַכְּתָב
  choice: उस लिखित आदेश की एक प्रति
  rationale: फ़ारसी मूल का פַּתְשֶׁגֶן किसी आधिकारिक दस्तावेज़ की प्रति को दर्शाता है; הַכְּתָב का शाब्दिक अर्थ ‘लिखित सामग्री’ है, पर राजकीय संदर्भ में ‘लिखित आदेश’ स्वाभाविक और स्पष्ट है।
- source_word: לְהִנָּתֵן דָּת
  choice: कानून के रूप में जारी की जाए
  rationale: यह पदबंध राजकीय आदेश को आधिकारिक कानूनी बल के साथ जारी किए जाने को व्यक्त करता है।
- source_word: בְּכָל מְדִינָה וּמְדִינָה
  choice: हर एक प्रान्त में
  rationale: इब्रानी में ‘प्रान्त और प्रान्त’ की पुनरुक्ति वितरणात्मक अर्थ देती है; आधुनिक हिन्दी में ‘हर एक प्रान्त’ उसी व्यापकता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: גָּלוּי לְכָל הָעַמִּים
  choice: सब जातियों के सामने सार्वजनिक की जाए
  rationale: גָּלוּי का भाव खुला, प्रकट या सार्वजनिक होना है; עַמִּים साम्राज्य के विभिन्न जातीय समुदायों को दर्शाता है।
- source_word: הַיְּהוּדִים עֲתוּדִים
  choice: यहूदी ... तैयार रहें
  rationale: עֲתוּדִים का सीधा अर्थ ‘तैयार’ है; הַיְּהוּדִים यहाँ फ़ारसी साम्राज्य में रहने वाले यहूदी लोगों को दर्शाता है।
- source_word: לַיּוֹם הַזֶּה
  choice: उस दिन
  rationale: शाब्दिक रूप से ‘इस दिन के लिए’ है, पर कथा में पहले से नियुक्त तिथि की ओर संकेत होने के कारण हिन्दी में ‘उस दिन’ अधिक स्वाभाविक है।
- source_word: לְהִנָּקֵם מֵאֹיְבֵיהֶם
  choice: अपने शत्रुओं से बदला लेने
  rationale: נקם का निफ़अल रूप स्वयं बदला लेने या प्रतिशोध लेने का स्पष्ट अर्थ रखता है; ‘अपनी रक्षा करने’ से इसकी शब्दार्थगत तीव्रता कम हो जाएगी।
theological_decisions:
- issue: हिंसक प्रतिशोध की भाषा को नरम करने की सम्भावना
  choice: अपने शत्रुओं से बदला लेने
  alternative: अपने शत्रुओं से अपनी रक्षा करने
  rationale: व्यापक प्रसंग में आत्मरक्षा सम्मिलित है, फिर भी इस पद में प्रयुक्त נקם विशेष रूप से बदला या प्रतिशोध लेने को व्यक्त करता है। इसलिए अनुवाद स्रोत की नैतिक और धर्मवैचारिक तनावपूर्ण भाषा को यथावत रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। राजकीय प्रशासनिक प्रसंग के लिए ‘लिखित आदेश’, ‘कानून के रूप में जारी’ और ‘सार्वजनिक’ जैसे प्रचलित पद चुने गए हैं।
