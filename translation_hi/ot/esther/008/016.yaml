  text: For the Jews there was light and gladness and joy and honor[a].
translation:
  language: hi
  text: यहूदियों के लिए उजियाला, आनन्द, हर्ष और सम्मान था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहूदियों को उजियाला, आनन्द, हर्ष और सम्मान मिला।” इब्रानी रचना को अस्तित्वसूचक (“था”) या अधिकार/प्राप्ति के भाव में (“मिला”) समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לַיְּהוּדִים
  choice: यहूदियों के लिए
  rationale: उपसर्ग ל यहाँ सम्बन्ध अथवा अधिकार का भाव दे सकता है। ‘यहूदियों के लिए’ इब्रानी रचना को स्वाभाविक हिन्दी में रखते हुए उसके अस्तित्वसूचक और अधिकारसूचक दोनों सम्भावित अर्थों के लिए जगह छोड़ता है।
- source_word: הָיְתָה
  choice: था
  rationale: आगे रखे गए ‘यहूदियों के लिए’ के साथ היה का सरल अस्तित्वसूचक अर्थ हिन्दी में ‘था’ से स्वाभाविक रूप से व्यक्त होता है।
- source_word: אוֹרָה
  choice: उजियाला
  rationale: यहाँ शब्द का रूपकात्मक आशय छुटकारे और कुशल से है, पर ‘उजियाला’ मूल बिम्ब को बनाए रखता है और आधुनिक हिन्दी में सहज है।
- source_word: שִׂמְחָה
  choice: आनन्द
  rationale: यह प्रसन्नता को व्यक्त करता है और पास आए שָׂשׂוֹן से कुछ शब्दगत भेद बनाए रखता है।
- source_word: שָׂשׂוֹן
  choice: हर्ष
  rationale: यह उल्लासपूर्ण खुशी का स्वाभाविक हिन्दी पर्याय है; ‘आनन्द और हर्ष’ इब्रानी के निकटार्थक संचय को बनाए रखते हैं।
- source_word: יְקָר
  choice: सम्मान
  rationale: सन्दर्भ में यह यहूदियों को मिली प्रतिष्ठा और आदर को दर्शाता है; ‘सम्मान’ आधुनिक हिन्दी में सामाजिक गरिमा का स्पष्ट और स्वाभाविक शब्द है।
