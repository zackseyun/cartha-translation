  text: וַ/יְהִי֩ כְּ/כַלּ֨וֹת יִרְמְיָ֜הוּ לְ/דַבֵּ֣ר אֶל כָּל הָ/עָ֗ם אֶת כָּל דִּבְרֵי֙ יְהוָ֣ה אֱלֹהֵי/הֶ֔ם אֲשֶׁ֧ר שְׁלָח֛/וֹ יְהוָ֥ה אֱלֹהֵי/הֶ֖ם אֲלֵי/הֶ֑ם אֵ֥ת כָּל הַ/דְּבָרִ֖ים הָ/אֵֽלֶּה־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/001.yaml
  text: And when Jeremiah had finished speaking to all the people all the words of Yahweh their God[a], with which Yahweh their God had sent him to them—all these words—
translation:
  language: hi
  text: जब यिर्मयाह सभी लोगों से उनके परमेश्वर याहवे के सारे वचन कह चुका, जिन वचनों के साथ उनके परमेश्वर याहवे ने उसे उनके पास भेजा था—ये सभी वचन—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כְּכַלּוֹת
  choice: जब ... कह चुका
  rationale: यह इब्रानी कालवाचक रचना पहले कार्य की समाप्ति बताती है। आधुनिक हिन्दी में “जब ... चुका” आगामी घटना की भूमिका स्वाभाविक रूप से बनाता है।
- source_word: יִרְמְיָהוּ
  choice: यिर्मयाह
  rationale: इब्रानी नाम का हिन्दी में प्रचलित और स्रोत के निकट रूप।
- source_word: כָּל הָעָם
  choice: सभी लोगों
  rationale: यहाँ עָם से आशय यिर्मयाह को सुन रहे लोगों से है; “सभी लोगों” साधारण हिन्दी में इसी सामूहिक अर्थ को व्यक्त करता है।
- source_word: כָּל דִּבְרֵי יְהוָה
  choice: याहवे के वे सारे वचन
  rationale: דְּבָרִים को “वचन” रखा गया है ताकि भविष्यद्वक्ता द्वारा कही गई परमेश्वर की ठोस वाणी का भाव बना रहे।
- source_word: יְהוָה
  choice: याहवे
  rationale: व्यक्तिगत दिव्य नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֵיהֶם
  choice: उनके परमेश्वर
  rationale: रूप बहुवचन-जैसा होने पर भी याहवे के साथ संबंध में अर्थ एकवचन है।
- source_word: אֲשֶׁר שְׁלָחוֹ יְהוָה אֱלֹהֵיהֶם אֲלֵיהֶם
  choice: जिन्हें देकर उनके परमेश्वर याहवे ने उसे उनके पास भेजा था
  rationale: यह शब्दों और यिर्मयाह के भेजे जाने का संबंध बनाए रखता है; “उसे” यिर्मयाह और “उनके पास” लोगों को सूचित करता है।
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: हाँ, ये सभी वचन
  rationale: मूल में आए पुनरुक्त पद को हटाया नहीं गया; “हाँ” हिन्दी में उसके बलाघात और पुनरुक्ति को स्पष्ट करता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। “याहवे” उसका स्रोत-सन्निकट लिप्यंतरण है और नाम को किसी उपाधि में नहीं बदलता।
- issue: אֱלֹהֵיהֶם की वचन-संख्या
  choice: उनके परमेश्वर
  alternative: उनके देवताओं
  rationale: याहवे के साथ समानाधिकरण और संदर्भ स्पष्ट रूप से एक ही परमेश्वर की ओर संकेत करते हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। पद अगले पद में पूरी होने वाली वाक्य-रचना है, इसलिए अंत में दीर्घ डैश रखा गया है। मूल की पुनरुक्ति को “हाँ, ये सभी वचन” के रूप में सुरक्षित रखा गया है।
