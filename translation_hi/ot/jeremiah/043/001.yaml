- from: जब यिर्मयाह सभी लोगों से उनके परमेश्वर याहवे के वे सारे वचन कह चुका, जिन्हें देकर उनके परमेश्वर याहवे ने उसे उनके पास भेजा था—हाँ, ये सभी वचन[a]—
  to: जब यिर्मयाह सभी लोगों से उनके परमेश्वर याहवे के सारे वचन कह चुका, जिन वचनों के साथ उनके परमेश्वर याहवे ने उसे उनके पास भेजा था—ये सभी वचन—
