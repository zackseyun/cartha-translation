source:
  edition: WLC
  text: וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֡ם כֹּֽה אָמַר֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל הִנְ/נִ֤י שֹׁלֵ֨חַ֙ וְ֠/לָקַחְתִּי אֶת נְבוּכַדְרֶאצַּ֤ר מֶֽלֶךְ בָּבֶל֙ עַבְדִּ֔/י וְ/שַׂמְתִּ֣י כִסְא֔/וֹ מִ/מַּ֛עַל לָ/אֲבָנִ֥ים הָ/אֵ֖לֶּה אֲשֶׁ֣ר טָמָ֑נְתִּי וְ/נָטָ֥ה אֶת שפרור/ו עֲלֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/010.yaml
  text: 'And say to them[a], ‘Thus says Yahweh of hosts, the God of Israel: Behold, I am sending and will take Nebuchadnezzar king of Babylon, my servant, and I will set his throne above these stones that I have hidden, and he will spread his canopy over them.’'
translation:
  language: hi
  text: 'और उनसे कहना, “इस्राएल का परमेश्वर, सेनाओं का याहवे, यों कहता है: ‘देखो, मैं भेज रहा हूँ, और मैं अपने सेवक, बाबेल के राजा नबूकदरेस्सर को ले आऊँगा। मैं उसका सिंहासन इन पत्थरों के ऊपर स्थापित करूँगा, जिन्हें मैंने छिपाया है, और वह उनके ऊपर अपना शाही मंडप[a] तानेगा।’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपना शामियाना,” “अपना राजकीय तंबू”; यहाँ प्रयुक्त इब्रानी शब्द दुर्लभ है और संभवतः राजा द्वारा ताना जाने वाला कोई आवरण सूचित करता है।
    reason: दुर्लभ इब्रानी शब्द के अर्थ की वास्तविक अनिश्चितता और प्रमुख शाब्दिक विकल्पों को सुरक्षित रखना।
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: צְבָאוֹת
  choice: सेनाओं का
  rationale: यह स्थापित दिव्य उपाधि के सामरिक और बहुवचन भाव को स्पष्ट तथा स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: הִנְנִי שֹׁלֵחַ וְלָקַחְתִּי
  choice: देखो, मैं ... को बुलवा भेजकर ले आऊँगा
  rationale: हिब्रानी में निकट भविष्य की सजीव घोषणा और ‘भेजने तथा लेने’ की संयुक्त क्रिया को हिन्दी में स्वाभाविक रूप से व्यक्त करता है; राजा को परमेश्वर के उद्देश्य के लिए बुलवाकर लाने का प्रसंगगत भाव सुरक्षित रहता है।
- source_word: נְבוּכַדְרֶאצַּר
  choice: नबूकदरेस्सर
  rationale: मसोरेटी पाठ में आए नाम के ‘र’ वाले रूप को देवनागरी में सुरक्षित रखा गया है।
- source_word: עַבְדִּי
  choice: अपने सेवक
  rationale: राजा को परमेश्वर के अधीन प्रयुक्त साधन के रूप में प्रस्तुत करता है; ‘दास’ से उत्पन्न अनावश्यक सामाजिक बल से बचते हुए मूल संबंध बनाए रखता है।
- source_word: כִסְאוֹ
  choice: उसका सिंहासन
  rationale: राजकीय प्रसंग में यह केवल आसन नहीं, राजा का सिंहासन है।
- source_word: מִמַּעַל לָאֲבָנִים הָאֵלֶּה
  choice: इन पत्थरों के ऊपर
  rationale: पत्थरों के सापेक्ष ऊपरी स्थान का स्थानिक अर्थ सीधे रूप में सुरक्षित है।
- source_word: טָמָנְתִּי
  choice: जिन्हें मैंने छिपाया है
  rationale: क्रिया का मूल अर्थ छिपाना या गुप्त रखना है और यह निकटवर्ती कथा के अनुकूल है।
- source_word: שפרורו
  choice: अपना शाही मंडप
  rationale: यह दुर्लभ और अर्थ की दृष्टि से कुछ अनिश्चित शब्द संभवतः राजा द्वारा ताने जाने वाले आवरण, मंडप या राजकीय तंबू को सूचित करता है। मुख्य पाठ में ‘शाही मंडप’ स्पष्ट है, जबकि अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: וְנָטָה
  choice: तानेगा
  rationale: आवरण, मंडप या तंबू के साथ हिन्दी में ‘तानना’ मूल के फैलाने अथवा खींचकर लगाने के भाव को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: नबूकदरेस्सर के लिए עַבְדִּי का प्रयोग
  choice: ‘अपने सेवक’—परमेश्वर के न्याय के लिए प्रयुक्त साधन का भाव
  alternative: ‘अपने दास’ अथवा व्याख्यात्मक ‘अपने प्रतिनिधि’
  rationale: पाठ एक गैर-इस्राएली राजा को परमेश्वर के सार्वभौम उद्देश्य के अधीन बताता है, पर उसकी नैतिक स्वीकृति या वाचा-निष्ठा घोषित नहीं करता। ‘सेवक’ इस धर्मवैचारिक तनाव को बिना सुलझाए सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। भविष्यवाणी की गंभीरता के लिए ‘यों कहता है’ और ‘देखो’ बनाए गए हैं। दुर्लभ राजकीय वस्तु को अत्यधिक तकनीकी शब्दावली के बिना ‘शाही मंडप’ कहा गया है।
