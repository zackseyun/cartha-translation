base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/013.yaml
  text: He will shatter the pillars of Beth-shemesh that is in the land of Egypt[b][a], and he will burn the temples of the gods of Egypt with fire.
translation:
  language: hi
  text: वह मिस्र देश में स्थित बेत-शेमेश[b] के स्तंभों[a] को चकनाचूर कर देगा और मिस्र के देवताओं के मंदिरों को आग से जला देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पवित्र स्तंभों’ अथवा ‘खड़े पत्थरों’। इब्रानी शब्द उपासना में प्रयुक्त पत्थर के खड़े स्तंभों को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: ‘बेत-शेमेश’ का अर्थ ‘सूर्य का घर’ है और संभवतः यह उस मिस्री नगर का नाम है जिसे यूनानी में हेलियोपोलिस कहा गया।
    reason: cultural_note
lexical_decisions:
- source_word: וְשִׁבַּר
  choice: वह ... चकनाचूर कर देगा
  rationale: שׁבר का अर्थ तोड़ना या चकनाचूर करना है। भविष्यसूचक न्याय के प्रसंग में ‘चकनाचूर कर देगा’ निर्णायक विनाश को स्वाभाविक हिन्दी में व्यक्त करता है; आरंभिक וְ को हिन्दी वाक्य-प्रवाह में अलग से ‘और’ कहना आवश्यक नहीं है।
- source_word: מַצְּבוֹת
  choice: स्तंभों
  rationale: מַצֵּבָה यहाँ उपासना से जुड़े खड़े पत्थरों या पवित्र स्तंभों को सूचित करता है। मुख्य पाठ में संक्षिप्त और सहज ‘स्तंभों’ रखा गया है, जबकि विशिष्ट धार्मिक अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: בֵּית שֶׁמֶשׁ
  choice: बेत-शेमेश
  rationale: स्थान-नाम को मानक हिन्दी लिप्यंतरण में रखा गया है। इसका शाब्दिक अर्थ और हेलियोपोलिस से संभावित पहचान मुख्य पाठ में आरोपित करने के बजाय पादटिप्पणी में दी गई है।
- source_word: אֲשֶׁר בְּאֶרֶץ מִצְרָיִם
  choice: मिस्र देश में स्थित
  rationale: यह संबंधवाचक उपवाक्य स्वाभाविक रूप से बेत-शेमेश की स्थिति बताता है। ‘मिस्र देश में स्थित’ मूल अर्थ को संक्षिप्त, स्पष्ट और आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: בָּתֵּי אֱלֹהֵי מִצְרַיִם
  choice: मिस्र के देवताओं के मंदिरों
  rationale: בָּתִּים का मूल अर्थ ‘घर’ है, पर इस उपासना-संबंधी प्रसंग में ‘मंदिर’ अभिप्रेत स्थान को सामान्य हिन्दी पाठक के लिए ठीक प्रकार व्यक्त करता है।
- source_word: יִשְׂרֹף בָּאֵשׁ
  choice: आग से जला देगा
  rationale: इब्रानी में जलाने की क्रिया के साथ ‘आग’ भी स्पष्ट रूप से आया है। ‘आग से जला देगा’ इस बलाघात को बनाए रखते हुए स्वाभाविक हिन्दी है।
