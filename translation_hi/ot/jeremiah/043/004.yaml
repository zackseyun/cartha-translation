id: JER.43.4
reference: Jeremiah 43:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/לֹֽא שָׁמַע֩ יוֹחָנָ֨ן בֶּן קָרֵ֜חַ וְ/כָל שָׂרֵ֧י הַ/חֲיָלִ֛ים וְ/כָל הָ/עָ֖ם בְּ/ק֣וֹל יְהוָ֑ה לָ/שֶׁ֖בֶת בְּ/אֶ֥רֶץ יְהוּדָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/004.yaml
  text: But Johanan son of Kareah[a], and all the commanders of the forces, and all the people, did not listen to the voice of Yahweh, to remain in the land of Judah.
translation:
  language: hi
  text: लेकिन कारेह के पुत्र योहानान, सैन्य-दलों के सभी प्रधानों और सभी लोगों ने याहवे की उस वाणी[a] को नहीं सुना कि वे यहूदा देश में बने रहें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ “याहवे की वाणी सुनना” है; इस मुहावरे का अर्थ “याहवे की बात मानना” या “उनकी आज्ञा मानना” भी हो सकता है।
    reason: इब्रानी שׁמע בקול मुहावरे में शाब्दिक रूप से वाणी सुनने और व्यावहारिक रूप से बात मानने—दोनों का भाव है।
lexical_decisions:
- source_word: וְלֹא
  choice: लेकिन ... नहीं
  rationale: संदर्भ में संयोजक וְ पिछले निर्देश के प्रति विरोध प्रकट करता है; इसलिए आधुनिक हिन्दी में “लेकिन” उपयुक्त है और לֹא की स्पष्ट नकारात्मकता बनी रहती है।
- source_word: שָׁמַע ... בְּקוֹל
  choice: वाणी नहीं सुनी
  rationale: इस इब्रानी मुहावरे में सुनने के साथ ध्यान देने और आज्ञा मानने का भाव भी है। मुख्य पाठ में श्रवण-संबंधी बिंब रखा गया है और व्यापक अर्थ को पादटिप्पणी में बताया गया है।
- source_word: יוֹחָנָן בֶּן קָרֵחַ
  choice: कारेह के पुत्र योहानान
  rationale: नामों का ध्वन्यात्मक लिप्यंतरण किया गया है और patronymic को स्वाभाविक हिन्दी क्रम में रखा गया है।
- source_word: שָׂרֵי הַחֲיָלִים
  choice: सैन्य-दलों के सभी प्रधान
  rationale: שָׂרֵי नेतृत्व या सेनापतित्व सूचित करता है और הַחֲיָלִים का बहुवचन अलग-अलग सैन्य दलों को व्यक्त कर सकता है; यह रूप उस बहुवचन को बनाए रखता है।
- source_word: כָל הָעָם
  choice: सभी लोग
  rationale: सामूहिक संज्ञा का सीधा, स्वाभाविक और व्यापक हिन्दी अनुवाद।
- source_word: יְהוָה
  choice: याहवे
  rationale: चतुरक्षरीय व्यक्तिगत ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिन्दी में ध्वन्यात्मक रूप से प्रस्तुत किया गया है।
- source_word: לָשֶׁבֶת
  choice: बने रहें
  rationale: संदर्भ में क्रिया का अर्थ यहूदा को छोड़ने के बजाय वहीं निवास जारी रखना है; “बने रहें” इस निरंतरता को सहज हिन्दी में व्यक्त करता है।
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: यहूदा देश में
  rationale: यह रूप אֶרֶץ के भूक्षेत्रीय अर्थ को बनाए रखता है और बाद के काल के “यहूदिया” नाम से बचता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में व्यक्तिगत नाम स्पष्ट रूप से उपस्थित है। “याहवे” उसे उपाधि में बदले बिना प्रस्तुत करता है, जबकि “प्रभु” नाम को प्रतिस्थापित करता और “यहोवा” एक वैकल्पिक पारंपरिक उच्चारण है।
- issue: שׁמע בקול में सुनने और आज्ञा मानने का संबंध
  choice: मुख्य पाठ में “वाणी नहीं सुनी”
  alternative: “याहवे की आज्ञा नहीं मानी”
  rationale: इब्रानी मुहावरा आज्ञापालन का भाव रखता है, पर ठोस “वाणी सुनने” का बिंब भी उपस्थित है। मुख्य पाठ उस बिंब और अर्थगत तनाव को सुरक्षित रखता है; पादटिप्पणी निहित आज्ञापालन स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक रूप अपनाया गया है। “लेकिन” विरोध को स्पष्ट करता है; “कि वे ... बने रहें” मूल के infinitive को हिन्दी में स्पष्ट विषय-वस्तु के रूप में व्यक्त करता है। पादटिप्पणी-चिह्न उसी पदबंध पर रखा गया है जिसकी व्याख्या पादटिप्पणी करती है।
