    reason: हिब्रू की कथात्मक आरम्भ-संरचना וַיְהִי और अगले कथन का परिचय देने वाले לֵאמֹר के अधिक औपचारिक रूप को दिखाने के लिए।
lexical_decisions:
- source_word: וַיְהִי
  choice: तब ... आया
  rationale: वाव-क्रमागत रूप कथा में अगली घटना आरम्भ करता है; आधुनिक हिन्दी में ‘तब ... आया’ स्वाभाविक है और मूल की घटनात्मक प्रगति बनाए रखता है।
- source_word: דְבַר יְהוָה
  choice: यहोवा का वचन
  rationale: यह मानक भविष्यद्वाणी-सूत्र है। ‘वचन’ ईश्वरीय कथन का औपचारिक और धर्मवैचारिक अर्थ बनाए रखता है, जबकि ‘संदेश’ अधिक व्याख्यात्मक होता।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: אֶל יִרְמְיָהוּ
  choice: यिर्मयाह के पास
  rationale: यहाँ אֶל वचन के प्राप्तकर्ता को चिह्नित करता है; ‘के पास ... आया’ हिन्दी में स्वाभाविक संरचना है।
- source_word: בְּתַחְפַּנְחֵס
  choice: तहपनहेस में
  rationale: בְּ स्थान सूचित करता है; नगर के भीतर यिर्मयाह की उपस्थिति के लिए ‘में’ सीधा और स्वाभाविक अनुवाद है।
- source_word: לֵאמֹר
  choice: इसके बाद आने वाले कथन को आरम्भ करने वाला द्विबिंदु
  rationale: हिब्रू का यह अनन्त क्रियारूप अगले पद में प्रत्यक्ष वाणी प्रस्तुत करता है। हिन्दी में ‘यह कहते हुए’ जोड़ने की अपेक्षा द्विबिंदु अधिक स्वाभाविक है और वही कार्य करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु / याहवे
  rationale: मूल में व्यक्तिगत वाचा-नाम स्पष्ट रूप से उपस्थित है। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में पहचाना जाने वाला लिप्यंतरण है और इसे केवल उपाधि ‘प्रभु’ में नहीं बदलता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। भविष्यद्वाणी-सूत्र के लिए पारंपरिक ‘वचन’ रखा गया है; नामों के रूप ‘यिर्मयाह’ और ‘तहपनहेस’ हैं। मुख्य पाठ में अगले पद की प्रत्यक्ष वाणी के लिए द्विबिंदु प्रयुक्त है।
