  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज हिन्दी। वाक्यक्रम को हिन्दी की स्वाभाविकता के अनुसार रखा गया है। दुर्लभ वास्तुशिल्पीय पद और טמן की अर्थ-सीमा की वास्तविक अनिश्चितता पादटिप्पणियों में सुरक्षित है। ‘यहूदी पुरुषों’ में निहित ‘यहूदिया के पुरुषों’ की सम्भावना मुख्य पाठ से स्पष्ट नहीं होती, इसलिए इसे अनुवाद-संबंधी टिप्पणी में दर्ज किया गया है।
