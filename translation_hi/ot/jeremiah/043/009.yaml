  text: קַ֣ח בְּ/יָדְ/ךָ֞ אֲבָנִ֣ים גְּדֹל֗וֹת וּ/טְמַנְתָּ֤/ם בַּ/מֶּ֨לֶט֙ בַּ/מַּלְבֵּ֔ן אֲשֶׁ֛ר בְּ/פֶ֥תַח בֵּית פַּרְעֹ֖ה בְּ/תַחְפַּנְחֵ֑ס לְ/עֵינֵ֖י אֲנָשִׁ֥ים יְהוּדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/009.yaml
  text: Take large stones in your hand and hide them in the mortar[a], in the brick pavement that is at the entrance of Pharaoh’s house in Tahpanhes[c][b], before the eyes of the Jewish men.
translation:
  language: hi
  text: “अपने हाथ में बड़े-बड़े पत्थर ले और उन्हें यहूदी पुरुषों[c] की आँखों के सामने तहपनहेस में फ़िरौन के भवन के प्रवेश-द्वार पर बनी ईंटों की फ़र्श[a] के गारे में छिपा दे[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ईंटों की चिनाई,” “ईंटों का चबूतरा,” अथवा सम्भवतः “ईंटों का भट्ठा”; इब्रानी शब्द दुर्लभ है और इसका ठीक वास्तुशिल्पीय अर्थ अनिश्चित है।
    reason: lexical_alternative
  - marker: b
    text: या “गाड़ दे”; इब्रानी क्रिया का अर्थ किसी वस्तु को भूमि या संरचना में रखकर छिपाना हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या “यहूदिया के पुरुष।” इब्रानी विशेषण का अर्थ जातीय रूप से “यहूदी” या अधिक विशेष रूप से यहूदिया के लोगों से सम्बन्धित हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח בְּיָדְךָ
  choice: अपने हाथ में ... ले
  rationale: आज्ञार्थक क्रिया और एकवचन ‘हाथ’ दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אֲבָנִים גְּדֹלוֹת
  choice: बड़े-बड़े पत्थर
  rationale: पत्थरों के बड़े आकार पर दिए गए बल को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וּטְמַנְתָּם
  choice: उन्हें ... छिपा दे
  rationale: טמן का व्यापक अर्थ दृष्टि से ओझल करना है, प्रायः भूमि या किसी संरचना में रखकर; ‘गाड़ दे’ सम्भव है, पर अधिक विशिष्ट है।
- source_word: בַּמֶּלֶט
  choice: गारे में
  rationale: निर्माण-संदर्भ में מלט के लिए ‘गारा’ स्वाभाविक और ऐतिहासिक रूप से उपयुक्त है; आधुनिक ‘सीमेंट’ अनावश्यक रूप से विशिष्ट होगा।
- source_word: בַּמַּלְבֵּן
  choice: ईंटों की फ़र्श
  rationale: दुर्लभ वास्तुशिल्पीय शब्द को प्रवेश-द्वार के संदर्भ में ईंटों से बनी पक्की सतह समझना सम्भाव्य है, पर अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: אֲשֶׁר בְּפֶתַח בֵּית פַּרְעֹה
  choice: फ़िरौन के भवन के प्रवेश-द्वार पर बनी
  rationale: ‘फ़िरौन का भवन’ मूल के ‘फ़िरौन का घर’ के निकट रहते हुए राजकीय इमारत के संदर्भ में स्वाभाविक है; ‘महल’ अधिक व्याख्यात्मक होता।
- source_word: בְּתַחְפַּנְחֵס
  choice: तहपनहेस में
  rationale: स्थान-नाम का मानक हिन्दी लिप्यंतरण।
- source_word: לְעֵינֵי
  choice: की आँखों के सामने
  rationale: मूल इब्रानी मुहावरे की दृश्य और सार्वजनिक क्रिया वाली सजीवता बनाए रखता है।
- source_word: אֲנָשִׁים יְהוּדִים
  choice: यहूदी पुरुषों
  rationale: אֲנָשִׁים के स्पष्ट पुल्लिंग और יְהוּדִים के जातीय/क्षेत्रीय अर्थ को व्यक्त करता है; ‘यहूदिया के पुरुष’ भी सम्भव है।
