source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר עֲזַרְיָ֤ה בֶן הוֹשַֽׁעְיָה֙ וְ/יוֹחָנָ֣ן בֶּן קָרֵ֔חַ וְ/כָל הָ/אֲנָשִׁ֖ים הַ/זֵּדִ֑ים אֹמְרִ֣ים אֶֽל יִרְמְיָ֗הוּ שֶׁ֚קֶר אַתָּ֣ה מְדַבֵּ֔ר לֹ֣א שְׁלָחֲ/ךָ֞ יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ לֵ/אמֹ֔ר לֹֽא תָבֹ֥אוּ מִצְרַ֖יִם לָ/ג֥וּר שָֽׁם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/002.yaml
  text: Azariah son of Hoshaiah, Johanan son of Kareah, and all the arrogant men said to Jeremiah, “You are speaking a lie. The LORD our God has not sent you to say, ‘You must not go to Egypt to sojourn there.’”
translation:
  language: hi
  text: तब होशायाह के पुत्र अजर्याह, कारेह के पुत्र योहानान और सभी घमंडी पुरुषों ने यिर्मयाह से कहा, “तुम झूठ बोल रहे हो! हमारे परमेश्वर यहोवा ने तुम्हें यह कहने के लिए नहीं भेजा, ‘मिस्र में परदेशी होकर रहने के लिए मत जाओ।’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַזֵּדִים
  choice: घमंडी
  rationale: इस शब्द का अर्थ उद्दंड या अहंकारी है; ‘घमंडी’ आधुनिक हिन्दी में सहज है और वक्ता के चरित्र पर मूल पाठ के नकारात्मक निर्णय को बनाए रखता है।
- source_word: שֶׁקֶר אַתָּה מְדַבֵּר
  choice: तुम झूठ बोल रहे हो
  rationale: यह सीधा आरोप है; हिन्दी में यही स्वाभाविक और मूल के बल के अनुरूप है।
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: हमारे परमेश्वर यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम और ‘हमारे परमेश्वर’—दोनों को स्पष्ट रूप से सुरक्षित रखा गया है।
- source_word: לָגוּר שָׁם
  choice: वहाँ परदेशी होकर रहने
  rationale: גור अस्थायी या प्रवासी निवासी के रूप में रहने का भाव देता है; यह केवल सामान्य ‘बसने’ से अधिक सटीक है।
- source_word: לֹא תָבֹאוּ מִצְרַיִם
  choice: तुम मिस्र ... मत जाओ
  rationale: हिब्रू में बहुवचन निषेध है। हिन्दी में ‘मत जाओ’ समूह को संबोधित करने का स्वाभाविक रूप है और संदर्भगत आज्ञा को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में ईश्वर का व्यक्तिगत नाम है; ‘यहोवा’ उसे सामान्य उपाधि में बदलने के बजाय नाम के रूप में दर्शाता है।
- issue: लोगों के आरोप की प्रत्यक्षता
  choice: “तुम झूठ बोल रहे हो!”
  alternative: “तुम असत्य कह रहे हो”
  rationale: मूल कथन कठोर और सीधा है; उसे नरम करना कथानक के तनाव को घटा देता।
- issue: मिस्र जाने के निषेध का बल
  choice: “मत जाओ”
  alternative: “तुम्हें नहीं जाना चाहिए”
  rationale: मूल לֹא + अपूर्ण क्रिया यहाँ उद्धृत निषेध व्यक्त करती है। सीधी आज्ञा अर्थ को बिना अतिरिक्त अनिवार्यता जोड़े व्यक्त करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। नामों के प्रचलित हिन्दी बाइबलीय रूप रखे गए हैं। प्रत्यक्ष वचन की कठोरता और ‘परदेशी होकर रहने’ का प्रवासी भाव सुरक्षित रखा गया है।
