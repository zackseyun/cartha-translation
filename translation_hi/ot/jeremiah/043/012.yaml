base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/012.yaml
  text: And he will set fire to the temples of the gods of Egypt[a], and he will burn them and carry them away. He will wrap himself in the land of Egypt as a shepherd wraps himself in his garment[b], and he will go out from there in peace.
translation:
  language: hi
  text: और मैं मिस्र के देवताओं के मंदिरों में आग लगा दूँगा[a]; वह उन्हें जला देगा और ले जाएगा[b]। वह मिस्र देश को ऐसे ओढ़ लेगा, जैसे चरवाहा अपना वस्त्र ओढ़ता है, और वहाँ से सकुशल निकल जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू पाठ में है, ‘और मैं ... आग लगा दूँगा।’ संदर्भ और इसके बाद की क्रियाओं के अनुसार इसे बाबेल के राजा के विषय में ‘और वह ... आग लगा देगा’ भी समझा गया है।
    reason: कर्ता से संबंधित पाठगत और संदर्भगत विकल्प को सुरक्षित रखना।
  - marker: b
    text: या ‘उन्हें बंदी बनाकर ले जाएगा।’ ‘उन्हें’ से देवताओं, उनकी मूर्तियों अथवा मंदिरों की संपत्ति का संकेत हो सकता है।
    reason: क्रिया के शाब्दिक विकल्प और कर्म की अस्पष्ट पहचान को स्पष्ट करना।
lexical_decisions:
- source_word: וְהִצַּתִּי
  choice: और मैं ... आग लगा दूँगा
  rationale: WLC का रूप प्रथम पुरुष एकवचन है, इसलिए मुख्य पाठ में उसके व्याकरणिक रूप को सुरक्षित रखा गया है। इसके बाद आने वाली तृतीय पुरुष क्रियाओं के कारण उत्पन्न पाठगत तनाव को मिटाया नहीं गया; संदर्भानुसार तृतीय पुरुष अर्थ को पादटिप्पणी में दिया गया है।
- source_word: בְּבָתֵּי אֱלֹהֵי מִצְרַיִם
  choice: मिस्र के देवताओं के मंदिरों में
  rationale: בָּתֵּי का शाब्दिक अर्थ ‘घरों’ है, पर देवताओं के संदर्भ में ‘मंदिरों’ से आशय स्पष्ट और स्वाभाविक रूप से व्यक्त होता है।
- source_word: וּשְׂרָפָם
  choice: वह उन्हें जला देगा
  rationale: क्रिया का सीधा विनाशकारी अर्थ रखा गया है। बहुवचन कर्म-सर्वनाम के सटीक संदर्भ—मंदिर, देवता/मूर्तियाँ अथवा उनसे जुड़ी वस्तुएँ—को जानबूझकर खुला छोड़ा गया है।
- source_word: וְשָׁבָם
  choice: और ले जाएगा
  rationale: שבה सामान्यतः बंदी बनाने या पकड़कर ले जाने को व्यक्त करता है। यहाँ कर्म देवता, उनकी मूर्तियाँ या मंदिरों की संपत्ति हो सकता है; इसलिए मुख्य पाठ में व्यापक ‘ले जाएगा’ रखा गया है और अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: וְעָטָה אֶת אֶרֶץ מִצְרַיִם
  choice: वह मिस्र देश को ... ओढ़ लेगा
  rationale: עָטָה के वस्त्र पहनने/ओढ़ने वाले चित्र को बनाए रखते हुए मिस्र पर सहज और पूर्ण अधिकार का रूपक सुरक्षित रखा गया है।
- source_word: כַּאֲשֶׁר יַעְטֶה הָרֹעֶה אֶת בִּגְדוֹ
  choice: जैसे चरवाहा अपना वस्त्र ओढ़ता है
  rationale: दोनों उपवाक्यों में एक ही हिब्रू क्रिया है; ‘ओढ़ना’ उसकी पुनरावृत्ति और वस्त्र-संबंधी उपमा दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וְיָצָא מִשָּׁם בְּשָׁלוֹם
  choice: और वहाँ से सकुशल निकल जाएगा
  rationale: בְּשָׁלוֹם यहाँ सुरक्षित और बिना हानि के प्रस्थान का भाव देता है; ‘सकुशल’ आधुनिक हिन्दी में इस प्रसंग का स्वाभाविक अर्थ है।
theological_decisions:
- issue: आरंभिक प्रथम पुरुष וְהִצַּתִּי और उसके बाद की तृतीय पुरुष क्रियाओं के बीच कर्ता का परिवर्तन
  choice: मुख्य पाठ में स्रोत-पाठ का प्रथम पुरुष ‘मैं ... आग लगा दूँगा’ रखा गया है; फिर तृतीय पुरुष ‘वह’ के साथ क्रम जारी है।
  alternative: संदर्भगत एकरूपता के लिए आरंभ से ही ‘वह ... आग लगा देगा’ पढ़ना।
  rationale: मसोरेटिक पाठ स्पष्ट रूप से प्रथम पुरुष है, जबकि निकटवर्ती संदर्भ में बाबेल का राजा तृतीय पुरुष कर्ता है। मुख्य पाठ को संदर्भ के आधार पर चुपचाप बदलने के बजाय व्याकरणिक तनाव सुरक्षित रखा गया है और वैकल्पिक संदर्भगत समझ पादटिप्पणी में बताई गई है।
- issue: וְשָׁבָם के कर्म की पहचान
  choice: ‘उन्हें ... ले जाएगा’ कहकर कर्म की पहचान खुली रखी गई है।
  alternative: विशेष रूप से देवताओं की मूर्तियाँ या मंदिरों की संपत्ति लूटकर ले जाने की बात कहना।
  rationale: हिब्रू बहुवचन सर्वनाम यह निश्चित नहीं करता कि आशय मंदिर, देवता/मूर्तियाँ या मंदिर की संपत्ति है; किसी एक पहचान को मुख्य पाठ में थोपना उचित नहीं है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘मंदिर’, ‘ओढ़ लेगा’ और ‘सकुशल’ सामान्य पाठक के लिए स्पष्ट हैं, जबकि हिब्रू की कर्ता-संबंधी असंगति, कर्म की अनिश्चितता और वस्त्र-रूपक को सुरक्षित रखा गया है।
