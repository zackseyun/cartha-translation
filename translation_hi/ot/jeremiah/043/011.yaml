base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/011.yaml
  text: 'He will come and strike the land of Egypt: those for death[a], to death; those for captivity, to captivity; and those for the sword, to the sword.'
translation:
  language: hi
  text: 'वह आकर मिस्र देश पर प्रहार करेगा: जो मृत्यु के लिए हैं, वे मृत्यु के लिए; जो बंदी बनाए जाने के लिए हैं, वे बंदी बनाए जाने के लिए; और जो तलवार के लिए हैं, वे तलवार के लिए।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो मृत्यु के लिए ठहराए गए हैं, वे मृत्यु के लिए; जो बंदी बनाए जाने के लिए ठहराए गए हैं, वे बंदी बनाए जाने के लिए; और जो तलवार के लिए ठहराए गए हैं, वे तलवार के लिए।” हिब्रू में न्याय का यह सूत्र संक्षिप्त और जानबूझकर दोहरावयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאָה
  choice: वह आकर
  rationale: संयोजक उपसर्ग के साथ पूर्ण क्रिया यहाँ भविष्यसूचक क्रम में भविष्य का अर्थ देती है। निकटवर्ती संदर्भ में कर्ता बाबेल का राजा है; हिंदी में संयुक्त क्रिया-रचना ‘आकर ... मारेगा’ स्वाभाविक है।
- source_word: וְהִכָּה
  choice: मारेगा
  rationale: נכה का मूल अर्थ ‘मारना/प्रहार करना’ है। ‘मारेगा’ व्यापक बल को बनाए रखता है और आक्रमण की रीति को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: אֶת־אֶרֶץ מִצְרַיִם
  choice: मिस्र देश को
  rationale: אֶרֶץ को व्यक्त करते हुए यह मिस्र की भूमि/प्रदेश पर होने वाले प्रहार को सामने रखता है; कर्मचिह्न אֶת का अलग अनुवाद नहीं होता।
- source_word: אֲשֶׁר לַמָּוֶת לַמָּוֶת
  choice: जो मृत्यु के लिए है, वह मृत्यु को
  rationale: हिब्रू की संक्षिप्त, वितरणात्मक और दोहरावयुक्त न्याय-सूत्र शैली को बनाए रखा गया है। ‘के लिए’ मूल की अस्पष्ट नियति/निर्धारण की भावना को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
- source_word: וַאֲשֶׁר לַשְּׁבִי לַשֶּׁבִי
  choice: जो बँधुआई के लिए है, वह बँधुआई को
  rationale: שְׁבִי बंदी बनाए जाने अथवा बँधुआई को सूचित करता है। ‘बँधुआई’ निर्वासन की अपेक्षा बंदी बनाए जाने के पक्ष को अधिक ठीक व्यक्त करता और दोहराव को बनाए रखता है।
- source_word: וַאֲשֶׁר לַחֶרֶב לֶחָרֶב
  choice: जो तलवार के लिए है, वह तलवार को
  rationale: חֶרֶב का शाब्दिक अर्थ ‘तलवार’ है और यहाँ यह युद्ध में हिंसक मृत्यु का भी संकेत दे सकता है। शाब्दिक रूप त्रिपदी समानांतरता और हिब्रू बिंब को बचाता है।
theological_decisions:
- issue: एकवचन पुल्लिंग कर्ता का संदर्भ
  choice: ‘वह’ रखा गया है; संदर्भ में यह बाबेल के राजा को दर्शाता है, जो दैवी न्याय का साधन है।
  alternative: ‘नबूकदनेस्सर’ को स्पष्ट रूप से जोड़ना, अथवा निर्वैयक्तिक अनुवाद करना।
  rationale: हिब्रू क्रियाएँ पुल्लिंग एकवचन हैं और निकटवर्ती संदर्भ कर्ता की पहचान देता है। सर्वनाम मूल पाठ का रूप बनाए रखता है और नाम को इस पद में आयात नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी में गंभीर, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली रखी गई है। ‘बँधुआई’ बाइबलीय संदर्भ में परिचित है, जबकि मूल की कठोर पुनरुक्ति और त्रिपदी लय जानबूझकर सुरक्षित रखी गई है।
