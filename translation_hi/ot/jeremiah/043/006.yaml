base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/006.yaml
  text: the men[a], the women, the little children, the king’s daughters, and every person whom Nebuzaradan the captain of the guard had left with Gedaliah son of Ahikam, son of Shaphan, and Jeremiah the prophet[c][b], and Baruch son of Neriah—
translation:
  language: hi
  text: पुरुषों, स्त्रियों, छोटे बच्चों[a], राजा की बेटियों और हर उस व्यक्ति[b] को, जिसे अंगरक्षकों के प्रधान[c] नबूजरदान ने शापान के पोते और अहीकाम के पुत्र गदल्याह के पास छोड़ दिया था, साथ ही यिर्मयाह नबी और नेरियाह के पुत्र बारूक को—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बच्चों”; इब्रानी शब्द छोटे बच्चों अथवा अधिक व्यापक अर्थ में आश्रित बच्चों को दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “हर प्राण”; यहाँ “प्राण” व्यक्ति को दर्शाने का इब्रानी तरीका है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में शाब्दिक अर्थ “वध करने वालों का प्रधान” है; यह एक राजकीय पदवी थी, जिसका सामान्य अनुवाद “अंगरक्षकों का प्रधान” किया जाता है।
    reason: cultural_note
lexical_decisions:
- source_word: הַגְּבָרִים
  choice: पुरुषों
  rationale: स्त्रियों और बच्चों के साथ दी गई सूची में גְּבָרִים का स्वाभाविक अर्थ वयस्क पुरुष है; ‘सैनिकों’ का अर्थ संदर्भ से सिद्ध नहीं होता।
- source_word: הַנָּשִׁים
  choice: स्त्रियों
  rationale: נָשִׁים यहाँ सामान्य रूप से स्त्रियों को दर्शाता है; ‘पत्नियों’ कहना अनावश्यक रूप से विशिष्ट होगा।
- source_word: הַטַּף
  choice: छोटे बच्चों
  rationale: טַף प्रायः छोटे या आश्रित बच्चों को दर्शाता है। मुख्य पाठ में ‘छोटे बच्चों’ से आयु और आश्रितता का भाव सहज रूप में आता है।
- source_word: בְּנוֹת הַמֶּלֶךְ
  choice: राजा की बेटियों
  rationale: यह इब्रानी पदबंध का सीधा रूप है और ‘राजकुमारियों’ की अपेक्षा मूल की पारिवारिक अभिव्यक्ति को बनाए रखता है।
- source_word: כָּל הַנֶּפֶשׁ
  choice: हर उस व्यक्ति
  rationale: נֶפֶשׁ यहाँ मनुष्य या व्यक्ति के अर्थ में प्रयुक्त है, न कि केवल अभौतिक ‘आत्मा’ के अर्थ में। ‘हर उस व्यक्ति’ आगामी संबंधवाचक उपवाक्य से स्वाभाविक रूप से जुड़ता है।
- source_word: הִנִּיחַ
  choice: छोड़ दिया था
  rationale: संदर्भ में इसका अर्थ लोगों को गदल्याह के पास रहने या उसकी देखरेख में छोड़ना है। यह अनुवाद मूल क्रिया की सादगी बनाए रखता है।
- source_word: רַב טַבָּחִים
  choice: अंगरक्षकों के प्रधान
  rationale: यह बाबुली राजकीय या सैन्य पदवी है। शाब्दिक ‘वध करने वालों का प्रधान’ आधुनिक पाठक को भ्रमित कर सकता है; ‘अंगरक्षकों के प्रधान’ पद के प्रचलित कार्यात्मक अर्थ को स्पष्ट करता है।
- source_word: אֶת גְּדַלְיָהוּ בֶּן אֲחִיקָם בֶּן שָׁפָן
  choice: शापान के पोते और अहीकाम के पुत्र गदल्याह के पास
  rationale: ‘के पास’ הִנִּיחַ के साथ संबंध को स्वाभाविक हिन्दी में व्यक्त करता है। वंशावली को हिन्दी के स्पष्ट क्रम में रखा गया है।
- source_word: יִרְמְיָהוּ הַנָּבִיא
  choice: यिर्मयाह नबी
  rationale: नाम और मूल में स्पष्ट उपाधि दोनों सुरक्षित रखे गए हैं।
- source_word: בָּרוּךְ בֶּן נֵרִיָּהוּ
  choice: नेरियाह के पुत्र बारूक
  rationale: इब्रानी संरक्षक-नाम को स्वाभाविक हिन्दी क्रम में व्यक्त किया गया है।
