  text: וַ/יִּקַּ֞ח יוֹחָנָ֤ן בֶּן קָרֵ֨חַ֙ וְ/כָל שָׂרֵ֣י הַ/חֲיָלִ֔ים אֵ֖ת כָּל שְׁאֵרִ֣ית יְהוּדָ֑ה אֲשֶׁר שָׁ֗בוּ מִ/כָּל הַ/גּוֹיִם֙ אֲשֶׁ֣ר נִדְּחוּ שָׁ֔ם לָ/ג֖וּר בְּ/אֶ֥רֶץ יְהוּדָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/005.yaml
  text: Then Johanan son of Kareah[a], and all the commanders of the forces, took all the remnant of Judah who had returned from all the nations where they had been driven away[b], to sojourn in the land of Judah—
translation:
  language: hi
  text: तब कारेह के पुत्र योहानान और सभी सेनापतियों ने यहूदा के सारे बचे हुए लोगों को, जो उन सभी राष्ट्रों में से लौट आए थे जहाँ उन्हें खदेड़ दिया गया था[a], यहूदा देश में रहने के लिए[b] ले लिया—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘जहाँ वे तितर-बितर कर दिए गए थे।’ इब्रानी क्रिया में खदेड़े जाने, निर्वासित किए जाने या बिखेर दिए जाने के अर्थ हो सकते हैं।
    reason: lexical_alternative
  - marker: b
    text: या, ‘यहूदा देश में अस्थायी निवासी के रूप में रहने के लिए।’ इब्रानी क्रिया में प्रायः किसी स्थान पर अस्थायी या आश्रित निवासी के रूप में रहने का भाव होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: तब ... ले लिया
  rationale: वाव-क्रमवाचक कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में क्रम दिखाता है और לקח का मूल अर्थ बनाए रखता है।
- source_word: יוֹחָנָן בֶּן קָרֵחַ
  choice: कारेह के पुत्र योहानान
  rationale: हिब्रू नामों का मानक देवनागरी लिप्यंतरण किया गया है और वंशसूचक ‘पुत्र’ सुरक्षित रखा गया है।
- source_word: שָׂרֵי הַחֲיָלִים
  choice: सभी सेनापति
  rationale: यह पद सैन्य-दलों के अगुओं या अधिकारियों को दर्शाता है; ‘सेनापति’ वर्तमान हिन्दी में संक्षिप्त, स्पष्ट और गरिमापूर्ण है।
- source_word: כָּל שְׁאֵרִית יְהוּדָה
  choice: यहूदा के बचे हुए सभी लोग
  rationale: שְׁאֵרִית का आशय बचा हुआ समुदाय है। यह रूप सामान्य पाठक के लिए स्वाभाविक रहते हुए ‘शेष’ की सामूहिक धारणा को व्यक्त करता है।
- source_word: אֲשֶׁר שָׁבוּ
  choice: ये वे लोग थे जो ... लौट आए थे
  rationale: मुख्य क्रिया से पहले हो चुके लौटने को पूर्ण भूतकाल द्वारा स्पष्ट किया गया है; अलग वाक्य हिन्दी में लंबे संबंधवाचक ढाँचे को सहज बनाता है।
- source_word: מִכָּל הַגּוֹיִם
  choice: उन सभी जातियों में से
  rationale: מִן के स्रोत-बोध और גּוֹיִם के विदेशी जातियों/राष्ट्रों वाले अर्थ को बनाए रखता है।
- source_word: אֲשֶׁר נִדְּחוּ שָׁם
  choice: जहाँ उन्हें खदेड़ दिया गया था
  rationale: निफ़अल रूप विवश करके दूर किए जाने का भाव देता है। ‘खदेड़ दिया गया’ उस बलपूर्वक विस्थापन को स्पष्ट रखता है।
- source_word: לָגוּר
  choice: परदेशी होकर रहने
  rationale: גור केवल सामान्य निवास नहीं, बल्कि परदेशी या आश्रित निवासी के रूप में रहने का भाव रख सकता है। अपने ही देश में लौटने के संदर्भ की अर्थगत तनातनी को मिटाया नहीं गया है।
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: यहूदा देश में
  rationale: यह भू-क्षेत्र का नाम है; ‘यहूदा देश’ आधुनिक हिन्दी में स्वाभाविक और इब्रानी बाइबल के संदर्भ के अनुकूल है।
theological_decisions:
- issue: לָגוּר का उद्देश्यगत संबंध
  choice: 'इसे लौट आने के उद्देश्य से जोड़ा गया: ‘यहूदा देश में ... रहने के लिए लौट आए थे’'
  alternative: इसे मुख्य क्रिया ‘ले लिया’ के बाद स्वतंत्र उद्देश्य-वाक्यांश मानना
  rationale: हिब्रू शब्दक्रम में לָגוּר निकटतम क्रिया שָׁבוּ के उद्देश्य को स्वाभाविक रूप से बताता है। यह निर्वासितों के लौटकर यहूदा में रहने के प्रसंग से भी मेल खाता है, पर पद की अंतर्निहित निवास-संबंधी तनातनी सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है। पद की लंबी इब्रानी संरचना को स्पष्टता के लिए दो वाक्यों में बाँटा गया है, किंतु अंतिम दीर्घ विराम-चिह्न द्वारा अगले पद से उसका कथात्मक संबंध बनाए रखा गया है। ‘परदेशी होकर रहने’ जानबूझकर कुछ अर्थगत तनाव सुरक्षित रखता है, क्योंकि लोग अपने ही यहूदा देश में लौट रहे हैं।
