source:
  edition: WLC
  text: וַ/יָּבֹ֨אוּ֙ אֶ֣רֶץ מִצְרַ֔יִם כִּ֛י לֹ֥א שָׁמְע֖וּ בְּ/ק֣וֹל יְהוָ֑ה וַ/יָּבֹ֖אוּ עַד תַּחְפַּנְחֵֽס־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/007.yaml
  text: So they entered the land of Egypt[a], for they did not listen to the voice of Yahweh, and they came as far as Tahpanhes.
translation:
  language: hi
  text: इस प्रकार वे मिस्र देश में प्रवेश कर गए, क्योंकि उन्होंने याहवे की वाणी नहीं सुनी[a]; और वे तहपनहेस तक आ पहुँचे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे की आज्ञा नहीं मानी।” इब्रानी मुहावरा “किसी की वाणी सुनना” उसकी बात मानने या उसका आज्ञापालन करने का भाव भी रख सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ אֶרֶץ מִצְרַיִם
  choice: वे मिस्र देश में प्रवेश कर गए
  rationale: בוא के साथ אֶרֶץ מִצְרַיִם गति करके किसी भूभाग में जाने को दर्शाता है। ‘प्रवेश कर गए’ इस अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है, और ‘मिस्र देश’ मूल के क्षेत्रीय भाव को बनाए रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ כִּי उनके मिस्र में प्रवेश करने का कारण बताता है; ‘क्योंकि’ आधुनिक हिन्दी में इस व्याख्यात्मक संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: לֹא שָׁמְעוּ בְּקוֹל
  choice: वाणी नहीं सुनी
  rationale: यह चयन इब्रानी मुहावरे की श्रवण-छवि को बनाए रखता है। प्रसंग में इसका आशय आज्ञा न मानना भी है, जिसे पादटिप्पणी में स्पष्ट किया गया है ताकि मूल की अर्थ-व्याप्ति बनी रहे।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: וַיָּבֹאוּ עַד
  choice: वे … तक आ पहुँचे
  rationale: עַד किसी स्थान तक पहुँचने की सीमा व्यक्त करता है। ‘तक आ पहुँचे’ गंतव्य तक पहुँचने का भाव स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: תַּחְפַּנְחֵס
  choice: तहपनहेस
  rationale: स्थान-नाम को इब्रानी रूप के निकट देवनागरी में लिप्यंतरित किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा प्रभु
  rationale: पद में व्यक्तिगत ईश्वरीय नाम सीधे प्रयुक्त है। ‘याहवे’ उसे उपाधि में बदले बिना प्रस्तुत करता है; ‘यहोवा’ एक पारंपरिक वैकल्पिक उच्चारण है और ‘प्रभु’ नाम के स्थान पर उपाधि रखता है।
- issue: שׁמע בקול में सुनने और आज्ञा मानने का संबंध
  choice: वाणी नहीं सुनी
  alternative: आज्ञा नहीं मानी
  rationale: शाब्दिक श्रवण-छवि और उसके निहित आज्ञापालन—दोनों को खुला रखने के लिए मुख्य पाठ में ‘वाणी नहीं सुनी’ रखा गया है और अधिक अर्थगत विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘इस प्रकार’ पूर्ववर्ती प्रसंग से परिणामसूचक संबंध दर्शाता है; अर्धविराम दोनों क्रमिक आगमन-वाक्यों को स्पष्ट रूप से अलग करता है।
