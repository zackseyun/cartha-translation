source:
  edition: WLC
  text: כִּ֗י בָּרוּךְ֙ בֶּן נֵ֣רִיָּ֔ה מַסִּ֥ית אֹתְ/ךָ֖ בָּ֑/נוּ לְמַעַן֩ תֵּ֨ת אֹתָ֤/נוּ בְ/יַֽד הַ/כַּשְׂדִּים֙ לְ/הָמִ֣ית אֹתָ֔/נוּ וּ/לְ/הַגְל֥וֹת אֹתָ֖/נוּ בָּבֶֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/003.yaml
  text: For Baruch son of Neriah is inciting you against us[a], in order to give us into the hand of the Chaldeans[c][b], to put us to death and to carry us away into exile to Babylon.
translation:
  language: hi
  text: क्योंकि नेरिय्याह का पुत्र बारूक तुम्हें हमारे विरुद्ध भड़का रहा है[a], ताकि तुम हमें कसदियों के हाथ में सौंप दो[b], ताकि वे हमें मार डालें और हमें निर्वासन में बाबेल ले जाएँ[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘तुम्हें हमारे विरुद्ध उकसा रहा है’ अथवा ‘तुम्हें हमारे विरुद्ध कर रहा है।’
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘कसदियों के हाथ में’; यह उनके अधिकार या वश में सौंपे जाने का इब्रानी मुहावरा है।
    reason: cultural_note
  - marker: c
    text: या, ‘हमें बाबेल निर्वासित कर दें’ अथवा ‘हमें देश-निकाला देकर बाबेल भेज दें।’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन के समर्थन में आरोप का कारण प्रस्तुत करता है; ‘क्योंकि’ हिन्दी में इस व्याख्यात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בָּרוּךְ בֶּן נֵרִיָּה
  choice: नेरिय्याह का पुत्र बारूक
  rationale: नामों का प्रचलित हिन्दी लिप्यंतरण रखा गया है और इब्रानी पितृनाम-संबंध को स्पष्ट किया गया है।
- source_word: מַסִּית
  choice: भड़का रहा है
  rationale: हिफ़ील कृदन्त में किसी को दूसरे के विरुद्ध उकसाने या भड़काने का शत्रुतापूर्ण भाव है; ‘भड़का रहा है’ आधुनिक हिन्दी में स्वाभाविक और सशक्त है।
- source_word: אֹתְךָ בָּנוּ
  choice: तुम्हें हमारे विरुद्ध
  rationale: संदर्भ में क्रिया की दिशा शत्रुतापूर्ण है—आरोप है कि बारूक यिर्मयाह को वक्ताओं के विरुद्ध कर रहा है।
- source_word: לְמַעַן תֵּת אֹתָנוּ
  choice: ताकि तुम हमें … सौंप दो
  rationale: לְמַעַן उद्देश्य बताता है और תֵּת का कर्ता व्याकरणतः द्वितीय पुरुष एकवचन ‘तुम’ है; हिन्दी में इसे स्पष्ट करने से मूल वाक्य-संबंध सुरक्षित रहता है।
- source_word: בְיַד הַכַּשְׂדִּים
  choice: कसदियों के हाथ में
  rationale: ‘हाथ में’ मूल इब्रानी मुहावरे को बनाए रखता है, जिसका अर्थ उनके अधिकार या वश में देना है; ‘कसदी’ इस जनसमूह का प्रचलित हिन्दी नाम है।
- source_word: לְהָמִית אֹתָנוּ
  choice: वे हमें मार डालें
  rationale: מות के हिफ़ील रूप में मृत्यु का कारण बनने का भाव है। ‘मार डालें’ स्पष्ट और स्वाभाविक हिन्दी है; ‘वे’ निकटवर्ती कसदियों को परिणामकारी कर्ता के रूप में व्यक्त करता है।
- source_word: וּלְהַגְלוֹת אֹתָנוּ בָּבֶל
  choice: हमें बँधुआई में बाबेल ले जाएँ
  rationale: גלה का हिफ़ील जबरन देश-निकाले और स्थानांतरण दोनों को व्यक्त करता है; यह वाक्यांश दोनों भावों को सहज हिन्दी में रखता है।
theological_decisions:
- issue: मृत्यु और निर्वासन कराने वाले का वाक्यगत संबंध
  choice: ‘जिससे वे’ द्वारा कसदियों को व्यावहारिक कर्ता के रूप में व्यक्त किया
  alternative: ‘ताकि हमें मरवा दिया जाए और बाबेल निर्वासित कर दिया जाए’ अथवा सभी उद्देश्यसूचक क्रियाओं का कर्ता ‘तुम’ समझना
  rationale: इब्रानी में अनन्त क्रियाएँ उद्देश्य/परिणाम की शृंखला बनाती हैं और उनका प्रत्यक्ष व्याकरणिक कर्ता व्यक्त नहीं है। संदर्भ में कसदियों के हाथ सौंपे जाने के बाद वही मृत्यु और निर्वासन के कारक होंगे; अनुवाद इस अर्थ को स्वाभाविक बनाता है, जबकि पादटिप्पणी की आवश्यकता के बिना आरोप का मूल तनाव बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘भड़का रहा है’ आरोप की तीव्रता व्यक्त करता है; ‘बँधुआई’ बाइबिलीय संदर्भ में परिचित है, और साथ का ‘ले जाएँ’ उसका अर्थ साधारण पाठक के लिए स्पष्ट करता है।
