  text: כִּ֣י אִם הִכִּיתֶ֞ם כָּל חֵ֤יל כַּשְׂדִּים֙ הַ/נִּלְחָמִ֣ים אִתְּ/כֶ֔ם וְ/נִ֨שְׁאֲרוּ בָ֔/ם אֲנָשִׁ֖ים מְדֻקָּרִ֑ים אִ֤ישׁ בְּ/אָהֳל/וֹ֙ יָק֔וּמוּ וְ/שָֽׂרְפ֛וּ אֶת הָ/עִ֥יר הַ/זֹּ֖את בָּ/אֵֽשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/010.yaml
  text: For even if you were to strike down the whole army of the Chaldeans who are fighting against you[a], and only wounded men remained among them, each in his tent[b], they would rise up and burn this city with fire.
translation:
  language: hi
  text: क्योंकि यदि तुम अपने विरुद्ध लड़ने वाली कसदियों की पूरी सेना को मार भी डालो[a], और उनमें केवल भेदे हुए लोग[b] ही बचे रहें, हर एक अपने तंबू में, तो वे उठ खड़े होंगे और इस नगर को आग से जला देंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा ‘बाबुलियों की।’ इब्रानी में ‘कसदियों’ है—यिर्मयाह में बाबुल की सेनाओं के लिए प्रायः प्रयुक्त जातिनाम।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ ‘भेदे हुए’ या ‘आर-पार छेदे हुए पुरुष।’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: क्योंकि यदि ... भी
  rationale: यह रूप संदर्भ में व्याख्यात्मक ‘क्योंकि’ और प्रबल काल्पनिक रियायत—‘यदि ... भी’—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הִכִּיתֶם
  choice: मार ... डालो
  rationale: נכה का सैन्य-संदर्भगत अर्थ प्रहार करके मार गिराना है; काल्पनिक शर्त के कारण हिन्दी में ‘मार भी डालो’ उपयुक्त है।
- source_word: כָּל חֵיל כַּשְׂדִּים
  choice: कसदियों की पूरी सेना
  rationale: חֵיל यहाँ सैन्यबल या सेना है; ‘पूरी सेना’ एकवचन सामूहिक संज्ञा के साथ כָּל का सहज हिन्दी रूप है।
- source_word: כַּשְׂדִּים
  choice: कसदियों
  rationale: यह इब्रानी जातिनाम का सीधा और बाइबलीय हिन्दी में परिचित रूप है; संदर्भ में वे बाबुल की सेना हैं।
- source_word: הַנִּלְחָמִים אִתְּכֶם
  choice: अपने विरुद्ध लड़ने वाली
  rationale: לחם के साथ אֵת यहाँ साथ नहीं, विरोध व्यक्त करता है; वाक्य में ‘सेना’ के अनुरूप स्त्रीलिंग प्रयोग किया गया है।
- source_word: וְנִשְׁאֲרוּ בָם
  choice: और उनमें केवल ... ही बचे रहें
  rationale: ‘बचे रहें’ शेष रह जाने का अर्थ देता है; ‘केवल ... ही’ इस काल्पनिक स्थिति में अत्यल्प बचे लोगों की निहित सीमितता स्पष्ट करता है।
- source_word: אֲנָשִׁים מְדֻקָּרִים
  choice: वेध दिए गए लोग
  rationale: מְדֻקָּרִים का मूल अर्थ छेदे या आर-पार किए गए लोग है। ‘वेध दिए गए’ स्रोत की तीव्र छवि को ‘घायल’ की अपेक्षा अधिक ठीक रखता है, पर घाव की घातकता को अनिवार्य नहीं बनाता।
- source_word: אִישׁ בְּאָהֳלוֹ
  choice: हर एक अपने तंबू में
  rationale: वितरणात्मक एकवचन אִישׁ को ‘हर एक’ और स्वत्व को स्वाभाविक हिन्दी ‘अपने तंबू में’ से व्यक्त किया गया है।
- source_word: יָקֻמוּ
  choice: वे उठ खड़े होंगे
  rationale: अपूर्ण क्रिया काल्पनिक परिणाम को आगे बढ़ाती है; ‘उठ खड़े होंगे’ शारीरिक उठने और फिर सक्रिय होने की नाटकीय शक्ति दोनों रखता है।
- source_word: וְשָׂרְפוּ אֶת הָעִיר הַזֹּאת בָּאֵשׁ
  choice: इस नगर को आग से जला देंगे
  rationale: यह क्रिया और साधनवाचक ‘आग से’ दोनों को सुरक्षित रखता है तथा आधुनिक हिन्दी में स्पष्ट है।
