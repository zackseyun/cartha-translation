  text: Jeremiah went out from Jerusalem to go to the land of Benjamin[a], to receive his portion there among the people.
translation:
  language: hi
  text: यिर्मयाह यरूशलेम से निकलकर बिन्यामीन के प्रदेश में गया, ताकि वहाँ से लोगों के बीच अपना हिस्सा ले।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वहाँ लोगों के बीच अपने हिस्से पर दावा करे।” इब्रानी क्रिया לַחֲלִק का अर्थ यहाँ निश्चित नहीं है; इसका आशय हिस्सा प्राप्त करना, हिस्सा बाँटना, या किसी हिस्से पर दावा करना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: निकलकर … गया
  rationale: יצא का सामान्य अर्थ ‘निकलना’ है। संयुक्त हिंदी अभिव्यक्ति स्थान से बाहर निकलने और आगे जाने—दोनों गतियों को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: מִירוּשָׁלִַם
  choice: यरूशलेम से
  rationale: מִן स्थान से अलग होने या प्रस्थान करने का संकेत देता है; ‘से’ इसका सीधा और स्वाभाविक हिंदी रूप है।
- source_word: לָלֶכֶת
  choice: … गया, ताकि
  rationale: הלך के उद्देश्यसूचक infinitive को हिंदी में ‘ताकि’ वाले उपवाक्य से व्यक्त किया गया है, जिससे वाक्य सहज रहता है और उद्देश्य स्पष्ट होता है।
- source_word: אֶרֶץ בִּנְיָמִן
  choice: बिन्यामीन के प्रदेश में
  rationale: אֶרֶץ यहाँ गोत्रीय भूभाग या क्षेत्र को सूचित करता है। आधुनिक हिंदी में ‘प्रदेश’ इस क्षेत्रीय अर्थ को ‘देश’ की अपेक्षा अधिक स्वाभाविक और सटीक ढंग से व्यक्त करता है।
- source_word: לַחֲלִק
  choice: अपना हिस्सा प्राप्त करे
  rationale: यह कठिन रूप संभवतः हिस्सा पाने, बाँटने या उस पर दावा करने से संबंधित है। मुख्य पाठ में ‘अपना हिस्सा प्राप्त करे’ संभावित प्रसंगगत अर्थ देता है, जबकि पाद-टिप्पणी वास्तविक शाब्दिक अनिश्चितता सुरक्षित रखती है।
- source_word: מִשָּׁם
  choice: वहाँ
  rationale: प्रसंग में यह बिन्यामीन के प्रदेश को संदर्भित करता है। हिंदी में ‘वहाँ’ स्वाभाविक है; ‘वहाँ से’ इस वाक्य में असहज होगा और आशय को अनावश्यक रूप से कठोर बना सकता है।
- source_word: בְּתוֹךְ הָעָם
  choice: लोगों के बीच
  rationale: शाब्दिक अर्थ ‘लोगों के मध्य’ है। ‘लोगों के बीच’ आधुनिक हिंदी में स्वाभाविक है और युद्धकालीन प्रसंग के आधार पर עָם को अनिश्चित रूप से ‘सैनिक’ नहीं बनाता।
