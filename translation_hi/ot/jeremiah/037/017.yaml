base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/017.yaml
  text: Then King Zedekiah sent and had him brought[a], and the king questioned him privately in his house, and said, “Is there any word from Yahweh?” Jeremiah said, “There is.” Then he said[b], “You will be given into the hand of the king of Babylon.”
translation:
  language: hi
  text: तब राजा सिदकिय्याह ने भेजकर यिर्मयाह को बुलवाया। राजा ने अपने भवन में उससे एकांत में[a] पूछा, “क्या याहवे की ओर से कोई वचन है?” यिर्मयाह ने कहा, “है।” फिर उसने कहा, “आप बाबेल के राजा के हाथ में[b] दे दिए जाएँगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “गुप्त रूप से।”
    reason: בַּסֵּתֶר स्थानगत एकांत और गोपनीय ढंग—दोनों अर्थ दे सकता है।
  - marker: b
    text: “हाथ में” एक इब्रानी मुहावरा है, जिसका अर्थ है “अधिकार में।”
    reason: स्रोत की रूपकात्मक अभिव्यक्ति का अर्थ आधुनिक पाठक के लिए स्पष्ट करना।
lexical_decisions:
- source_word: וַיִּשְׁלַח ... וַיִּקָּחֵהוּ
  choice: लोगों को भेजकर ... बुलवा लिया
  rationale: दोनों क्रमिक क्रियाओं—भेजना और उसे ले आना—का प्रसंगानुकूल संयुक्त अनुवाद; इससे यह स्पष्ट रहता है कि राजा ने स्वयं जाकर यिर्मयाह को नहीं पकड़ा, बल्कि उसे मँगवाया।
- source_word: בְּבֵיתוֹ
  choice: अपने भवन में
  rationale: בַּיִת का मूल अर्थ घर/भवन है और राजकीय संदर्भ में निवास-भवन को दर्शाता है; ‘महल’ संभव है, पर वह स्रोत से अधिक विशिष्ट होगा।
- source_word: בַּסֵּתֶר
  choice: एकांत में
  rationale: यह छिपे या गुप्त स्थान अथवा गोपनीय ढंग का बोध देता है। ‘एकांत में’ आधुनिक हिन्दी में स्वाभाविक रूप से निजी पूछताछ व्यक्त करता है; ‘गुप्त रूप से’ पादटिप्पणी में रखा गया है।
- source_word: הֲיֵשׁ דָּבָר מֵאֵת יְהוָה
  choice: क्या याहवे की ओर से कोई वचन है?
  rationale: भविष्यवाणी के संदर्भ में דָּבָר के लिए ‘वचन’ उपयुक्त है और ‘की ओर से’ מֵאֵת के स्रोत/प्रेषक भाव को स्पष्ट करता है।
- source_word: יֵשׁ
  choice: हाँ, है
  rationale: इब्रानी उत्तर अत्यंत संक्षिप्त, शाब्दिक रूप से ‘है’, है। हिन्दी में प्रश्न का स्वाभाविक संक्षिप्त उत्तर ‘हाँ, है’ उसी नाटकीय संक्षिप्तता को बनाए रखता है।
- source_word: בְּיַד
  choice: के हाथ में
  rationale: इब्रानी मुहावरा किसी की सत्ता या अधिकार में दिए जाने का भाव रखता है। मुख्य पाठ में स्रोत-चित्र को रखा गया है और उसका अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: תִּנָּתֵן
  choice: कर दिए जाएँगे
  rationale: निफ़अल निष्क्रिय रूप ‘दिए जाओगे’ को व्यक्त करता है। राजकीय संबोधन के कारण आधुनिक हिन्दी में सम्मानसूचक बहुवचन रूप अपनाया गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले परमेश्वर के निजी नाम को उपाधि से बदलने के बजाय हिन्दी लिपि में ‘याहवे’ रूप में दिया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: स्रोत में निजी वाचा-नाम सीधे आया है; ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे किसी उपाधि में नहीं बदलता।
- issue: भविष्यवाणी में कर्मकर्ता का अनुल्लेख
  choice: निष्क्रिय रूप ‘कर दिए जाएँगे’ बनाए रखा
  alternative: ‘याहवे आपको सौंप देगा’
  rationale: इब्रानी पाठ तִּנָּתֵן में निष्क्रिय वाच्य रखता है और देने वाले को स्पष्ट नहीं करता। अनुवाद उस धर्मवैज्ञानिक अनिश्चितता को अनावश्यक रूप से नहीं भरता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। सिदकिय्याह के प्रति सीधे संबोधन में प्रसंगानुकूल सम्मानसूचक ‘आप’ रखा गया है; वाक्यरचना स्रोत के क्रम और संक्षिप्त नाटकीय संवाद को बनाए रखती है।
