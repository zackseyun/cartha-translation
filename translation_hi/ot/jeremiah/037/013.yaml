translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। लंबे इब्रानी परिचय-वाक्य को पठनीयता के लिए छोटे वाक्यों में बाँटा गया है, और वंशावली को स्वाभाविक हिन्दी में ‘पुत्र’ तथा ‘पोता’ द्वारा व्यक्त किया गया है।
