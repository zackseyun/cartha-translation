source:
  edition: WLC
  text: וַ/יְהִי ה֞וּא בְּ/שַׁ֣עַר בִּנְיָמִ֗ן וְ/שָׁם֙ בַּ֣עַל פְּקִדֻ֔ת וּ/שְׁמ/וֹ֙ יִרְאִיָּ֔יה בֶּן שֶֽׁלֶמְיָ֖ה בֶּן חֲנַנְיָ֑ה וַ/יִּתְפֹּ֞שׂ אֶֽת יִרְמְיָ֤הוּ הַ/נָּבִיא֙ לֵ/אמֹ֔ר אֶל הַ/כַּשְׂדִּ֖ים אַתָּ֥ה נֹפֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/013.yaml
  text: And when he was at the Benjamin Gate[a], there was a captain of the guard there whose name was Irijah son of Shelemiah, son of Hananiah, and he seized Jeremiah the prophet, saying, “You are deserting to the Chaldeans!”
translation:
  language: hi
  text: जब वह बिन्यामीन फाटक पर था, तब वहाँ पहरे का एक अधिकारी था, जिसका नाम यिरिय्याह था। वह शलेम्याह का पुत्र और हनन्याह का पोता था। उसने यिर्मयाह नबी को पकड़ लिया और कहा, “तुम कसदियों से जा मिल रहे हो![a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम कसदियों के पक्ष में जा रहे हो!” इब्रानी मुहावरे का शाब्दिक अर्थ है, “तुम कसदियों की ओर गिर रहे हो।”
    reason: मुहावरे के वैकल्पिक अर्थ और शाब्दिक रूप को सुरक्षित रखना।
lexical_decisions:
- source_word: בְּשַׁעַר בִּנְיָמִן
  choice: बिन्यामीन फाटक पर
  rationale: यह पदबंध नगर के नामित फाटक को दर्शाता है; ‘पर’ आधुनिक हिन्दी में स्थान को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בַּעַל פְּקִדֻת
  choice: पहरे का एक अधिकारी
  rationale: शब्दशः यह किसी जिम्मेदारी या निगरानी के प्रभारी व्यक्ति को सूचित करता है। प्रसंग में फाटक की पहरेदारी से जुड़ा अधिकारी अभिप्रेत है; यह अनुवाद अनिश्चित पदवी को अनावश्यक रूप से ‘सेनापति’ नहीं बनाता।
- source_word: יִרְאִיָּה
  choice: यिरिय्याह
  rationale: इब्रानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण।
- source_word: וַיִּתְפֹּשׂ
  choice: पकड़ लिया
  rationale: क्रिया बलपूर्वक थामने या गिरफ्त में लेने को व्यक्त करती है। ‘पकड़ लिया’ शारीरिक और विरोधी कार्रवाई को बनाए रखता है, पर औपचारिक न्यायिक गिरफ्त की अतिरिक्त धारणा नहीं जोड़ता।
- source_word: יִרְמְיָהוּ הַנָּבִיא
  choice: यिर्मयाह नबी
  rationale: इब्रानी संज्ञा और उसके पदनाम को संक्षिप्त, स्वाभाविक हिन्दी क्रम में रखा गया है।
- source_word: אֶל הַכַּשְׂדִּים אַתָּה נֹפֵל
  choice: तुम कसदियों से जा मिल रहे हो
  rationale: נפל אֶל सैन्य-राजनीतिक प्रसंग में विरोधी पक्ष में चले जाने का मुहावरा है। ‘जा मिल रहे हो’ आरोप को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है तथा ‘कसदियों’ को इब्रानी जातीय-राजनीतिक नाम के रूप में बनाए रखता है।
