source:
  edition: WLC
  text: וַ/יִּקְצְפ֧וּ הַ/שָּׂרִ֛ים עַֽל יִרְמְיָ֖הוּ וְ/הִכּ֣וּ אֹת֑/וֹ וְ/נָתְנ֨וּ אוֹת֜/וֹ בֵּ֣ית הָ/אֵס֗וּר בֵּ֚ית יְהוֹנָתָ֣ן הַ/סֹּפֵ֔ר כִּֽי אֹת֥/וֹ עָשׂ֖וּ לְ/בֵ֥ית הַ/כֶּֽלֶא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/015.yaml
  text: And the officials were enraged at Jeremiah[a], and they beat him and put him in the prison house, in the house of Jehonathan the scribe[b], for they had made it a prison.
translation:
  language: hi
  text: तब अधिकारी यिर्मयाह पर अत्यन्त क्रोधित हुए[a]। उन्होंने उसे पीटा और लिपिक यहोनातान के घर के बन्दीगृह में डाल दिया[b], क्योंकि उन्होंने उस घर को कारागार बना दिया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तब प्रधान यिर्मयाह पर क्रोधित हुए।”
    reason: इब्रानी शब्द अधिकारियों, प्रधानों या राजकुमारों के लिए प्रयुक्त हो सकता है; साथ ही क्रोध की तीव्रता को सरल रूप में भी व्यक्त किया जा सकता है।
  - marker: b
    text: इब्रानी में “बन्द किए जाने का घर”; अर्थात यहोनातान के घर को कारागार के रूप में उपयोग किया गया था।
    reason: यह टिप्पणी इब्रानी पदबंध की ठोस अभिव्यक्ति और यहोनातान के घर के अस्थायी कारागार में बदले जाने की सांस्कृतिक स्थिति स्पष्ट करती है।
lexical_decisions:
- source_word: וַיִּקְצְפוּ
  choice: अत्यन्त क्रोधित हुए
  rationale: क़ात्सफ़ क्रोध और रोष की तीव्रता व्यक्त करता है; यह चयन उस तीव्रता को स्वाभाविक और गरिमापूर्ण हिन्दी में प्रकट करता है।
- source_word: הַשָּׂרִים
  choice: अधिकारी
  rationale: सारीम यहाँ शासन-व्यवस्था से जुड़े पदाधिकारियों को दर्शाता है। ‘अधिकारी’ राजपुत्र होने का अनावश्यक अर्थ दिए बिना प्रसंग के अनुकूल है।
- source_word: וְהִכּוּ אֹתוֹ
  choice: उन्होंने उसे पीटा
  rationale: नाखाह का अर्थ मारना या प्रहार करना है; शत्रुतापूर्ण व्यवहार के इस प्रसंग में ‘पीटा’ शारीरिक दुर्व्यवहार को स्पष्ट करता है।
- source_word: וְנָתְנוּ אֹתוֹ
  choice: उसे ... डाल दिया
  rationale: नातन का मूल अर्थ देना या रखना है; बन्दीगृह के साथ हिन्दी में ‘डाल दिया’ स्वाभाविक है और बलपूर्वक कैद किए जाने का भाव रखता है।
- source_word: בֵּית הָאֵסוּר
  choice: बन्दीगृह
  rationale: इस पदबंध का शाब्दिक भाव ‘बन्द किए जाने का घर’ है। ‘बन्दीगृह’ ठोस स्थान और कैद—दोनों भाव सुरक्षित रखता है।
- source_word: בֵּית יְהוֹנָתָן הַסֹּפֵר
  choice: लिपिक यहोनातान के घर
  rationale: दोहराया गया ‘घर’ उस भवन की पहचान यहोनातान के घर के रूप में करता है। ‘लिपिक’ सोफ़ेर के लेखन अथवा सचिवीय पद को आधुनिक पाठक के लिए ‘लेखक’ से अधिक स्पष्ट करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह अव्यय यहाँ यहोनातान के घर में बन्दीगृह होने का कारण बताता है।
- source_word: עָשׂוּ לְבֵית הַכֶּלֶא
  choice: उन्होंने उस घर को कारागार बना दिया था
  rationale: आसाह के साथ ले उपसर्ग किसी वस्तु को किसी रूप में बना देने का अर्थ दे सकता है। पूर्वकालिक पूर्ण कार्य को ‘बना दिया था’ से स्पष्ट किया गया है।
