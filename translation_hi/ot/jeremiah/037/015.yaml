translation_notes:
  register: आधुनिक मानक हिन्दी का स्वाभाविक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रूप अपनाया गया है। वाक्य-विन्यास को हिन्दी के अनुरूप किया गया, पर यहोनातान के घर और बन्दीगृह के बीच स्रोत-पाठ का सम्बन्ध बनाए रखा गया है।
