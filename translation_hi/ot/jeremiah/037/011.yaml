  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। वाक्यांश को अगले पद से जुड़ने वाले अधूरे कालवाचक उपवाक्य के रूप में छोड़ा गया है, जैसा स्रोत में है। ‘उठ गई थी’ हिन्दी में सैन्य घेरे के उठने का स्वाभाविक मुहावरा है और हिब्रू क्रिया की छवि भी बचाता है।
