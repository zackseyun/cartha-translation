  yaml_path: translation/ot/jeremiah/037/011.yaml
  text: When the army of the Chaldeans had gone up from Jerusalem because of Pharaoh’s army,[a]
translation:
  language: hi
  text: जब कसदियों की सेना फ़िरौन की सेना के कारण यरूशलेम का घेरा उठाकर हट गई थी,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब कसदियों की सेना फ़िरौन की सेना के कारण यरूशलेम पर से उठी थी”; इस संदर्भ में इसका आशय है कि उन्होंने घेरा उठाकर वहाँ से हटना शुरू कर दिया था।
    reason: क्रिया עלה के मूल ‘ऊपर उठने/जाने’ के भाव और घेराबंदी के संदर्भ में उसके ‘घेरा उठाकर हटने’ के मुहावरेदार अर्थ—दोनों को सामने रखने के लिए।
lexical_decisions:
- source_word: וְהָיָה
  choice: जब
  rationale: यह कथात्मक सूत्र यहाँ नई परिस्थिति प्रस्तुत करता है और अगले पद के मुख्य वाक्य से जुड़ता है। आधुनिक हिन्दी में अलग से ‘और ऐसा हुआ’ जोड़ने के बजाय कालवाचक ‘जब’ स्वाभाविक है।
- source_word: בְּהֵעָלוֹת
  choice: उठ गई थी
  rationale: בְּ के साथ infinitive construct कालवाचक परिस्थिति बताता है। עלה का मूल भाव ‘ऊपर जाना/उठना’ है, पर מֵעַל יְרוּשָׁלַם और घेराबंदी के सैन्य संदर्भ में इसका अर्थ सेना का घेरा उठाकर हट जाना है। हिन्दी ‘उठ गई थी’ स्रोत की छवि और प्रसंगगत अर्थ दोनों को स्वाभाविक रूप से रखता है।
- source_word: חֵיל
  choice: सेना
  rationale: यहाँ शब्द संगठित सैन्य बल के लिए प्रयुक्त है; ‘सेना’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: הַכַּשְׂדִּים
  choice: कसदियों
  rationale: हिब्रू जातिवाचक नाम को सीधे ‘कसदी’ के रूप में रखा गया है; ऐतिहासिक रूप से ये बाबुल की साम्राज्यवादी सेना थे, पर स्रोत में ‘बाबुली’ नहीं है।
- source_word: מֵעַל יְרוּשָׁלִָם
  choice: यरूशलेम पर से
  rationale: शाब्दिक संबंध ‘यरूशलेम के ऊपर/विरुद्ध से’ है। घेराबंदी के संदर्भ में ‘यरूशलेम पर से’ उस दबाव या घेरे के हटने को व्यक्त करता है और עלה की छवि से भी जुड़ता है।
- source_word: מִפְּנֵי
  choice: के कारण
  rationale: यहाँ पूर्वसर्ग फ़िरौन की सेना के सामने आने से उत्पन्न कारण को दर्शाता है; ‘के कारण’ उसका स्पष्ट हिन्दी रूप है।
- source_word: חֵיל פַּרְעֹה
  choice: फ़िरौन की सेना
  rationale: यह सीधा संबंधवाचक पदबंध है और आधुनिक हिन्दी में स्वाभाविक रूप से ‘फ़िरौन की सेना’ बनता है।
