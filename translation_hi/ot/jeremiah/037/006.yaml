  text: Then the word of Yahweh came to Jeremiah the prophet[a], saying,
translation:
  language: hi
  text: 'तब याहवे का वचन भविष्यद्वक्ता यिर्मयाह के पास आया:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: तब ... आया
  rationale: कथात्मक क्रम में अगली घटना का स्वाभाविक संकेत देता है और ‘ऐसा हुआ’ जैसे अधिक शब्दशः रूप की अपेक्षा आधुनिक हिन्दी में सहज है।
- source_word: דְּבַר
  choice: वचन
  rationale: दְּבַר יְהוָה की स्थापित भविष्यसूचक अभिव्यक्ति को पारदर्शी रूप से बनाए रखता है; यहाँ केवल सामान्य ‘संदेश’ से अधिक औपचारिक दिव्य प्रकाशन का भाव है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि ‘प्रभु’ से बदलने के बजाय हिन्दी में प्रचलित नाम-रूप से प्रस्तुत करता है।
- source_word: אֶל
  choice: के पास
  rationale: वचन के किसी व्यक्ति तक पहुँचने के लिए यह आधुनिक हिन्दी की स्वाभाविक अभिव्यक्ति है।
- source_word: יִרְמְיָהוּ
  choice: यिर्मयाह
  rationale: व्यक्तिनाम का हिन्दी बाइबलीय परंपरा में पहचाना जाने वाला लिप्यंतरण है।
- source_word: הַנָּבִיא
  choice: नबी
  rationale: संज्ञा נָבִיא का सामान्य, सुबोध हिन्दी समतुल्य है और यिर्मयाह की भूमिका बताता है।
- source_word: לֵאמֹר
  choice: ':'
  rationale: यह रूप अगले पद में आने वाली प्रत्यक्ष वाणी का परिचय देता है; हिन्दी में पद के अंत का द्विबिंदु ‘यह कहते हुए’ की तुलना में अधिक स्वाभाविक और वही कार्य करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। ‘यहोवा’ आधुनिक हिन्दी के सामान्य पाठकों में व्यापक रूप से पहचाना जाने वाला नाम-रूप है और इसे उपाधि ‘प्रभु’ से नहीं बदलता; ‘याहवे’ मूल उच्चारण के निकटतर वैकल्पिक लिप्यंतरण है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। भविष्यसूचक सूत्र ‘यहोवा का वचन ... के पास आया’ को बनाए रखा गया है। לֵאמֹר को अगले पद की वाणी आरम्भ कराने वाले द्विबिंदु से व्यक्त किया गया है।
