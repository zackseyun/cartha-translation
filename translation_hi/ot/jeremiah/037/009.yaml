source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה אַל תַּשִּׁ֤אוּ נַפְשֹֽׁתֵי/כֶם֙ לֵ/אמֹ֔ר הָלֹ֛ךְ יֵלְכ֥וּ מֵ/עָלֵ֖י/נוּ הַ/כַּשְׂדִּ֑ים כִּי לֹ֖א יֵלֵֽכוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/009.yaml
  text: 'Thus says Yahweh: Do not deceive yourselves[a], saying[c][b], ‘The Chaldeans will surely go away from us,’ for they will not go away.'
translation:
  language: hi
  text: 'याहवे यह कहता है: यह कहकर अपने आपको धोखा मत दो[a], ‘कसदी[b] निश्चय ही हमारे पास से चले जाएँगे[c],’ क्योंकि वे नहीं जाएँगे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने आपको झूठी तसल्ली मत दो।” इब्रानी मुहावरे में शाब्दिक रूप से “तुम्हारे प्राण” आता है, पर यहाँ आशय आत्म-प्रवंचना या झूठे भरोसे से है।
    reason: lexical_alternative
  - marker: b
    text: “कसदी” से यहाँ बाबुल की सेना अभिप्रेत है।
    reason: cultural_note
  - marker: c
    text: या, “अवश्य चले जाएँगे।” इब्रानी में क्रिया के साथ उसी धातु का infinitive absolute प्रयुक्त है, जो कथन पर बल देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: याहवे यों कहता है
  rationale: यह प्रचलित भविष्यद्वक्तापरक संदेश-सूत्र को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है तथा इब्रानी व्यक्तिगत नाम को बनाए रखता है।
- source_word: אַל תַּשִּׁאוּ נַפְשֹׁתֵיכֶם
  choice: अपने आप को धोखा मत दो
  rationale: נשׂא और נפשׁ का यह मुहावरा यहाँ शाब्दिक रूप से ‘अपने प्राणों को उठाना’ नहीं, बल्कि झूठी आशा में पड़कर स्वयं को धोखा देना दर्शाता है।
- source_word: לֵאמֹר
  choice: यह कहकर
  rationale: यह आत्म-प्रवंचना की कथित बात का परिचय देता है और निषेध के साथ उसका संबंध सहज हिन्दी में स्पष्ट करता है।
- source_word: הָלֹךְ יֵלְכוּ
  choice: निश्चय ही ... चले जाएँगे
  rationale: क्रिया के साथ प्रयुक्त infinitive absolute कथन पर बल देता है; ‘निश्चय ही’ उस बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: מֵעָלֵינוּ
  choice: हमारे यहाँ से
  rationale: संदर्भ में यह यहूदा के सामने से शत्रु-सेना के हट जाने को सूचित करता है; यह चयन उस स्थानिक और सैन्य भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: הַכַּשְׂדִּים
  choice: कसदी
  rationale: यह इब्रानी के ऐतिहासिक जातीय नाम को बनाए रखता है; संदर्भ में इससे बाबुल की सेना अभिप्रेत है।
- source_word: כִּי לֹא יֵלֵכוּ
  choice: क्योंकि वे नहीं जाएँगे
  rationale: כִּי कारण बताता है, और उसी क्रिया की पुनरावृत्ति पहले किए गए दावे के साथ तीखा विरोध बनाए रखती है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में उपाधि नहीं, चार अक्षरों वाला व्यक्तिगत नाम है। ‘याहवे’ उसका व्यापक रूप से मान्य लिप्यंतरण है और नाम तथा उपाधि के बीच का भेद सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और प्रत्यक्ष भविष्यद्वक्तापरक लहजा रखा गया है। बहुवचन संबोधन को हिन्दी के सामान्य ‘अपने आप को ... मत दो’ से व्यक्त किया गया है। ऐतिहासिक पद ‘कसदी’ बनाए रखते हुए पादटिप्पणी में उसका संदर्भ स्पष्ट किया गया है।
