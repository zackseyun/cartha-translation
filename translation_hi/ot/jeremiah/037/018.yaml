  yaml_path: translation/ot/jeremiah/037/018.yaml
  text: Then Jeremiah said to King Zedekiah, “What have I sinned against you, against your servants, and against this people, that you have put me into the prison?”
translation:
  language: hi
  text: तब यिर्मयाह ने राजा सिदकिय्याह से कहा, “मैंने आपके, आपके सेवकों और इस प्रजा के विरुद्ध क्या पाप किया है कि आप लोगों ने मुझे बंदीगृह में डाल दिया?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֶה חָטָאתִי
  choice: मैंने ... ऐसा कौन-सा पाप किया है
  rationale: शाब्दिक संरचना ‘मैंने क्या पाप किया?’ को स्वाभाविक आधुनिक हिन्दी में प्रश्न की चुनौतीपूर्ण शक्ति सहित व्यक्त करता है।
- source_word: עֲבָדֶיךָ
  choice: आपके सेवकों
  rationale: राजकीय संदर्भ में ‘सेवक’ व्यापक है और अधिकारियों अथवा अधीनस्थों तक अर्थ को सीमित नहीं करता।
- source_word: הָעָם הַזֶּה
  choice: इस प्रजा
  rationale: राजा से संबोधन के संदर्भ में ‘प्रजा’ स्वाभाविक है और सामूहिक अर्थ बनाए रखता है।
- source_word: בֵּית הַכֶּלֶא
  choice: बंदीगृह
  rationale: इब्रानी का शाब्दिक भाव ‘कैद का घर’ है; ‘बंदीगृह’ उसी अर्थ का संक्षिप्त, प्रतिष्ठित और सहज हिन्दी रूप है।
theological_decisions:
- issue: यिर्मयाह के प्रश्न में निर्दोषता का दावा
  choice: 'प्रश्न को खुला और प्रत्यक्ष रखा गया है: ‘ऐसा कौन-सा पाप किया है’'
  alternative: ‘मैंने कोई पाप नहीं किया’
  rationale: मूल पाठ अलंकारिक प्रश्न करता है, स्पष्ट घोषणात्मक उत्तर नहीं देता; इसलिए उसकी विधिक और भावात्मक तीक्ष्णता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; राजा के लिए आदरसूचक ‘आप’ और गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज शब्दावली।
