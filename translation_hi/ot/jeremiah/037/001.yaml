source:
  edition: WLC
  text: וַ/יִּ֨מְלָךְ מֶ֔לֶךְ צִדְקִיָּ֖הוּ בֶּן יֹֽאשִׁיָּ֑הוּ תַּ֗חַת כָּנְיָ֨הוּ֙ בֶּן יְה֣וֹיָקִ֔ים אֲשֶׁ֥ר הִמְלִ֛יךְ נְבוּכַדְרֶאצַּ֥ר מֶֽלֶךְ בָּבֶ֖ל בְּ/אֶ֥רֶץ יְהוּדָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/001.yaml
  text: And King Zedekiah son of Josiah reigned in place of Coniah son of Jehoiakim[b][a], whom Nebuchadnezzar king of Babylon had made king in the land of Judah.
translation:
  language: hi
  text: और योशिय्याह का पुत्र राजा सिदकिय्याह, यहोयाकीम के पुत्र कोन्याह[a] के स्थान पर राज्य करने लगा। बाबेल के राजा नबूकदनेस्सर[b] ने सिदकिय्याह को यहूदा देश में राजा बनाया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में कोन्याह; अन्य स्थानों पर वह यकोन्याह नाम से भी जाना जाता है।
    reason: alternative_reading
  - marker: b
    text: यहाँ इब्रानी वर्तनी नबूकदरेस्सर है; प्रचलित हिन्दी नाम-रूप नबूकदनेस्सर है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְלָךְ
  choice: राज्य करने लगा
  rationale: यह कथात्मक क्रियारूप सिदकिय्याह के राजगद्दी संभालने और उसके शासन के आरंभ को व्यक्त करता है। ‘राज्य करने लगा’ आधुनिक हिन्दी में स्वाभाविक है और केवल नियुक्ति से अधिक राजकीय उत्तराधिकार का भाव देता है।
- source_word: תַּחַת
  choice: के स्थान पर
  rationale: उत्तराधिकार के इस संदर्भ में यह शब्द एक राजा की जगह दूसरे के आने को दर्शाता है।
- source_word: כָּנְיָהוּ
  choice: कोन्याह
  rationale: यहाँ आए इब्रानी नाम-रूप को किसी अधिक परिचित समानांतर रूप से मिलाए बिना देवनागरी में निकटता से प्रस्तुत किया गया है।
- source_word: הִמְלִיךְ
  choice: राजा बनाया था
  rationale: מלך का हिफ़ील रूप कारणवाचक है—‘राजा बनाना’। ‘था’ से स्पष्ट होता है कि यह कार्य सिदकिय्याह के राज्य करने से पहले हुआ था।
- source_word: נְבוּכַדְרֶאצַּר
  choice: नबूकदनेस्सर
  rationale: पाठक-परिचित हिन्दी नाम-रूप मुख्य पाठ में रखा गया है; मूल इब्रानी वर्तनी के अधिक निकट रूप को पाद-टिप्पणी में बताया गया है।
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: यहूदा देश में
  rationale: पूर्वसर्ग और ‘देश/भूमि’ दोनों को स्पष्ट रखते हुए स्वाभाविक हिन्दी दी गई है; ‘यहूदा पर’ कहने से मूल में निहित न होने वाला शासन-क्षेत्र का अतिरिक्त भाव आ सकता था।
theological_decisions:
- issue: אֲשֶׁר הִמְלִיךְ में संबंधवाचक उपवाक्य का संदर्भ
  choice: ‘उसे’ का संकेत सिदकिय्याह की ओर रखा गया
  alternative: निकटतम नाम कोन्याह की ओर संकेत समझना
  rationale: ऐतिहासिक और व्यापक साहित्यिक संदर्भ में बाबेल के राजा द्वारा यहूदा में राजा बनाया गया व्यक्ति सिदकिय्याह है। हिन्दी वाक्य में ‘उसे’ मुख्य कर्ता सिदकिय्याह से जुड़ता है, जबकि मूल कथन की संरचना और आशय बनाए रखे गए हैं।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। राजकीय और वंशावली संबंधी शब्दावली को औपचारिक रखा गया है, पर वाक्यरचना सामान्य पाठक के लिए स्पष्ट बनाई गई है।
