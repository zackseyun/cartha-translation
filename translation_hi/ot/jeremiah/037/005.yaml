  yaml_path: translation/ot/jeremiah/037/005.yaml
  text: Pharaoh’s army had come out from Egypt[a], and when the Chaldeans who were besieging Jerusalem heard the report about them[c][b], they withdrew from Jerusalem.
translation:
  language: hi
  text: फ़िरौन की सेना मिस्र से निकल चुकी थी। जब यरूशलेम की घेराबंदी कर रहे कसदियों[a] ने फ़िरौन की सेना के बारे में समाचार[b] सुना, तो वे यरूशलेम का घेरा छोड़कर हट गए[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् बेबीलोन के लोग।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उनका समाचार”; अर्थात् फ़िरौन की सेना के विषय में समाचार।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “वे यरूशलेम के ऊपर से चढ़ गए”; इस सैन्य संदर्भ में यह मुहावरा घेराबंदी से पीछे हटने को दर्शाता है।
    reason: idiom
lexical_decisions:
- source_word: חֵיל
  choice: सेना
  rationale: फ़िरौन और सैनिक गतिविधि के संदर्भ में यह शब्द धन या सामान्य सामर्थ्य नहीं, बल्कि सैन्य बल को दर्शाता है।
- source_word: פַּרְעֹה
  choice: फ़िरौन
  rationale: यह मिस्र के राजा की उपाधि का मानक हिन्दी रूप है।
- source_word: יָצָא מִמִּצְרָיִם
  choice: मिस्र से निकल चुकी थी
  rationale: पूर्ण क्रिया इसके बाद की घटनाओं से पहले हो चुकी कार्रवाई बताती है; ‘निकल चुकी थी’ हिन्दी में इस पूर्वकालिक संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הַכַּשְׂדִּים
  choice: कसदियों
  rationale: यह इब्रानी जातिनाम का सीधा और परंपरागत हिन्दी रूप है; संदर्भ में ये बेबीलोन के लोग हैं।
- source_word: הַצָּרִים עַל יְרוּשָׁלִַם
  choice: यरूशलेम को घेरनेवाले
  rationale: सैन्य संदर्भ में क्रिया का अर्थ किसी नगर की घेराबंदी करना है; यह रूप जारी कार्रवाई को स्पष्ट रखता है।
- source_word: אֶת שִׁמְעָם
  choice: फ़िरौन की सेना के बारे में समाचार
  rationale: शाब्दिक रूप ‘उनका समाचार’ है। संदर्भ में बहुवचन प्रत्यय फ़िरौन की सैन्य टुकड़ियों की ओर संकेत करता है; मुख्य पाठ में संदर्भ को स्पष्ट किया गया है और शाब्दिक रूप पादटिप्पणी में रखा गया है।
- source_word: וַיֵּעָלוּ מֵעַל יְרוּשָׁלִָם
  choice: वे यरूशलेम के पास से हट गए
  rationale: शाब्दिक संरचना ‘यरूशलेम के ऊपर से चढ़/हट गए’ है, पर घेराबंदी के संदर्भ में इसका आशय वहाँ से पीछे हटना है। ‘के पास से’ यह स्पष्ट करता है कि सेना नगर के विरुद्ध अपने स्थान से हटी, न कि नगर के भीतर से।
- source_word: וְ
  choice: वाक्य-संबंध द्वारा व्यक्त
  rationale: आरंभिक संयोजक कथा को आगे बढ़ाता है। हिन्दी में अलग ‘अब’ जोड़ने के बजाय पिछले संदर्भ और वाक्य-क्रम से यह संबंध स्वाभाविक रूप में व्यक्त होता है।
