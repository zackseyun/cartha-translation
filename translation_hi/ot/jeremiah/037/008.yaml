  text: Then the Chaldeans will return and fight against this city[a], and they will capture it and burn it with fire.
translation:
  language: hi
  text: तब कसदी[a] लौट आएँगे और इस नगर के विरुद्ध युद्ध करेंगे। वे इसे अपने अधिकार में कर लेंगे और आग से जला देंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बेबीलोनवासी।’ इब्रानी में ‘कसदी’ है, जो इस पूरे प्रसंग में प्रयुक्त ऐतिहासिक पदनाम है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁבוּ
  choice: तब ... लौट आएँगे
  rationale: שׁוּב का अर्थ यहाँ लौटना है। आरंभिक וְ को प्रसंग की भावी घटनाओं के क्रम के अनुसार स्वाभाविक हिन्दी में ‘तब’ से व्यक्त किया गया है।
- source_word: הַכַּשְׂדִּים
  choice: कसदी
  rationale: यह इब्रानी का ऐतिहासिक जातीय-राजनीतिक पदनाम है; ‘बेबीलोनी’ इसका प्रसंगगत विकल्प है, पर मुख्य पाठ में मूल पदनाम सुरक्षित रखा गया है।
- source_word: וְנִלְחֲמוּ עַל
  choice: के विरुद्ध युद्ध करेंगे
  rationale: נלחם के साथ עַל यहाँ किसी स्थान पर सैन्य आक्रमण अथवा उसके विरुद्ध युद्ध करने का अर्थ देता है।
- source_word: הָעִיר הַזֹּאת
  choice: इस नगर
  rationale: זֹאת निकटवाची संकेतवाचक है; इसलिए ‘इस नगर’ सीधा और स्वाभाविक अनुवाद है।
- source_word: וּלְכָדֻהָ
  choice: इसे अपने अधिकार में कर लेंगे
  rationale: לכד का नगर के विषय में अर्थ उसे सैन्य बल से पकड़ना या जीतकर अधिकार में लेना है; यह अभिव्यक्ति आधुनिक हिन्दी में आशय स्पष्ट करती है।
- source_word: וּשְׂרָפֻהָ בָאֵשׁ
  choice: आग से जला देंगे
  rationale: यह इब्रानी पदबंध का सीधा और स्वाभाविक हिन्दी रूप है तथा आग द्वारा विनाश के बलाघात को बनाए रखता है।
