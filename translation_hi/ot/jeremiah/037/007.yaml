base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/007.yaml
  text: 'Thus says Yahweh[a], the God of Israel: Thus you shall say to the king of Judah, who sent you to me to inquire of me, ‘Behold, Pharaoh’s army, which came out to help you, has returned to its own land[c][b], Egypt.’'
translation:
  language: hi
  text: 'इस्राएल का परमेश्वर याहवे यों कहता है: “तुम यहूदा के राजा से, जिसने मुझसे पूछने के लिए[a] तुम्हें मेरे पास भेजा है, यों कहना: ‘देखो, फ़िरौन की सेना, जो तुम्हारी सहायता के लिए निकली थी,[b] अपने देश, मिस्र, लौट गई है।[c]’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मुझे खोजने” अथवा “मुझसे परामर्श करने के लिए।” इब्रानी क्रिया खोजने या पूछताछ करने का अर्थ दे सकती है; यहाँ आशय यिर्मयाह के माध्यम से परमेश्वर का उत्तर जानने से है।
    reason: lexical_alternative
  - marker: b
    text: या “जो तुम्हारी सहायता के लिए निकल रही है।” इब्रानी में कृदंत है, जिसे कथा की स्थिति को देखते हुए मुख्य पाठ में भूतकाल से व्यक्त किया गया है।
    reason: lexical_alternative
  - marker: c
    text: या “वापस मुड़कर मिस्र देश चली गई है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम के प्रचलित विद्वत्तापूर्ण लिप्यंतरण को देवनागरी में प्रस्तुत करता है; इसे किसी उपाधि से नहीं बदलता।
- source_word: כֹּה אָמַר
  choice: यों कहता है
  rationale: भविष्यद्वाणी के मानक संदेशवाहक-सूत्र को स्वाभाविक और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल का परमेश्वर
  rationale: इब्रानी संबंधवाचक संरचना का सीधा और स्वाभाविक हिन्दी अनुवाद है।
- source_word: כֹּה תֹאמְרוּ
  choice: यों कहना
  rationale: बहुवचन संबोधन और दिए गए संदेश को आगे सुनाने की आज्ञा—दोनों को संक्षेप में सुरक्षित रखता है।
- source_word: הַשֹּׁלֵחַ אֶתְכֶם אֵלַי
  choice: जिसने ... तुम्हें मेरे पास भेजा है
  rationale: इब्रानी कृदंत को कथा-स्थिति के अनुरूप पूर्ण हुई, किंतु वर्तमान प्रसंग से जुड़ी कार्रवाई के रूप में स्वाभाविक हिन्दी में प्रस्तुत करता है।
- source_word: לְדָרְשֵׁנִי
  choice: मुझसे पूछने के लिए
  rationale: यहाँ क्रिया का अर्थ भविष्यद्वक्ता के माध्यम से परमेश्वर से उत्तर जानना है; प्रथम पुरुष ‘मुझसे’ को बनाए रखा गया है।
- source_word: הִנֵּה
  choice: देखो
  rationale: आने वाली निर्णायक घोषणा की ओर ध्यान खींचता है और आधुनिक हिन्दी में ‘निहारो’ की अपेक्षा अधिक स्वाभाविक है।
- source_word: חֵיל פַּרְעֹה
  choice: फ़िरौन की सेना
  rationale: इस प्रसंग में חֵיל सैन्य बल को दर्शाता है, संपत्ति या सामान्य सामर्थ्य को नहीं।
- source_word: הַיֹּצֵא לָכֶם לְעֶזְרָה
  choice: जो तुम्हारी सहायता के लिए निकली थी
  rationale: कृदंत की कालगत खुली प्रकृति को कथा-संदर्भ के अनुसार भूतकाल में व्यक्त किया गया है; वैकल्पिक वर्तमान अर्थ पादटिप्पणी में रखा गया है।
- source_word: שָׁב לְאַרְצוֹ מִצְרָיִם
  choice: लौटकर अपने देश मिस्र चली गई है
  rationale: सेना के वापस मुड़ने और उसके अपने देश मिस्र लौट जाने—दोनों बातों को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के चार-अक्षरीय इब्रानी नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में प्रयुक्त व्यक्तिगत नाम को उपाधि से बदलने के बजाय लिप्यंतरित किया गया है; ‘याहवे’ उपलब्ध भाषावैज्ञानिक प्रमाण के निकट है।
- issue: לְדָרְשֵׁנִי में परमेश्वर से पूछने का माध्यम
  choice: मूल प्रथम-पुरुष कथन ‘मुझसे पूछने’ को बनाए रखा
  alternative: ‘यिर्मयाह के द्वारा याहवे से पूछने’ जैसा व्याख्यात्मक विस्तार
  rationale: प्रसंग में यिर्मयाह माध्यम है, पर मूल वाक्य परमेश्वर का प्रत्यक्ष कथन है; अनुवाद में वह तनाव सुरक्षित रखा गया है और अनावश्यक व्याख्या नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी की सहज, गरिमापूर्ण भविष्यद्वाणी-शैली अपनाई गई है। ‘यों कहता है’, ‘देखो’ और प्रत्यक्ष उद्धरण संदेशवाहक-सूत्र की औपचारिकता रखते हैं, जबकि वाक्य-रचना सामान्य पाठक के लिए स्पष्ट है। सभी पादटिप्पणी-चिह्न संबंधित पदांश के तुरंत बाद रखे गए हैं।
