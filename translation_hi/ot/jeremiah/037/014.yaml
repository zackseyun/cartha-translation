  yaml_path: translation/ot/jeremiah/037/014.yaml
  text: But Jeremiah said[a], “That is a lie; I am not defecting to the Chaldeans.” But he would not listen to him[c][b], and Irijah seized Jeremiah and brought him to the officials.
translation:
  language: hi
  text: परन्तु यिर्मयाह ने कहा, “यह झूठ है! मैं कसदियों[b] के पक्ष में नहीं जा रहा हूँ[a]।” लेकिन यिरिय्याह ने उसकी बात नहीं मानी और यिर्मयाह को पकड़कर अधिकारियों[c] के पास ले गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मैं कसदियों के पास नहीं जा रहा हूँ” या “मैं कसदियों की ओर नहीं जा रहा हूँ।” यहाँ इब्रानी मुहावरे का आशय शत्रु-पक्ष में चले जाने का है।
    reason: lexical_alternative
  - marker: b
    text: “कसदी” बाबुल की सेनाओं के लिए प्रयुक्त नाम है।
    reason: cultural_note
  - marker: c
    text: इब्रानी शब्द का अर्थ “हाकिमों” या “प्रधानों” से भी हो सकता है; यहाँ उच्च पदस्थ शासकीय अधिकारी अभिप्रेत हैं।
    reason: lexical_alternative
