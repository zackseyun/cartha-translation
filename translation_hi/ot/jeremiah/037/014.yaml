- source_word: הַשָּׂרִים
  choice: अधिकारियों
  rationale: यहाँ उच्च पदस्थ शासकीय व्यक्तियों के लिए सहज आधुनिक हिन्दी शब्द है; ‘हाकिम’ या ‘राजकुमार’ की अपेक्षा कम भ्रामक है।
- source_word: וַיְבִאֵהוּ אֶל
