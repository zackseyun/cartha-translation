- source_word: וְלֹא נָתְנוּ אֹתוֹ
  choice: और उन्होंने उसे … नहीं डाला था
  rationale: וְ को उसके सामान्य संयोजक अर्थ ‘और’ में रखा गया है। हिन्दी में कारावास के लिए ‘उसे … में डालना’ स्वाभाविक है; पूर्वकालिक स्थिति को ‘नहीं डाला था’ स्पष्ट करता है। स्रोत में ‘अभी तक’ का अलग शब्द नहीं है, इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
- source_word: בֵּית הַכְּלִיא
  choice: बन्दीगृह
  rationale: शाब्दिक अर्थ ‘बन्दी बनाए रखने का घर’ है। ‘बन्दीगृह’ इस ठोस रचना और कारावास के भाव दोनों को संक्षिप्त, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: וְיִרְמְיָהוּ
  choice: यिर्मयाह
  rationale: आरम्भिक וְ कथावृत्त को आगे बढ़ाता है; हिन्दी में अलग ‘और’ या ‘अब’ जोड़े बिना नाम से वाक्य आरम्भ करना स्वाभाविक है और किसी स्पष्ट कालसूचक शब्द का आभास नहीं देता।
