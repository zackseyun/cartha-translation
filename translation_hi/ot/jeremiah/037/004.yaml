lexical_decisions:
- source_word: בָּא וְיֹצֵא
  choice: आता-जाता था
  rationale: यह युग्म लोगों के बीच यिर्मयाह की स्वतंत्र आवाजाही या सामान्य सार्वजनिक गतिविधि व्यक्त करता है। ‘आता-जाता था’ हिब्रू अभिव्यक्ति को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: בְּתוֹךְ הָעָם
  choice: लोगों के बीच
