- source_word: בָא
  choice: पहुँच चुका था
  rationale: पूर्ण क्रिया को ऐसी पूर्वघटित अवस्था के रूप में व्यक्त किया गया है जो उसके लंबे समय तक वहाँ रहने से पहले हुई थी।
- source_word: בֵּית הַבּוֹר
  choice: कोठरीवाला तहखाना
  rationale: शाब्दिक अर्थ ‘गड्ढे/कुंड का घर’ है; कारावास के संदर्भ में यह भूमिगत बंदीगृह का बोध देता है, जबकि ‘तहखाना’ ठोस स्थानिक छवि को बनाए रखता है।
- source_word: הַחֲנֻיוֹת
  choice: बंद कमरे
  rationale: यह दुर्लभ शब्द कारागार के भीतर घिरे हुए छोटे कक्षों का संकेत देता प्रतीत होता है। सटीक स्थापत्य अर्थ अनिश्चित होने के कारण विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: וַיֵּשֶׁב שָׁם
  choice: वहाँ ... रहा
  rationale: ישב के ‘बैठना, रहना, ठहरे रहना’ अर्थों में से कारावास की निरंतर अवधि के लिए स्वाभाविक हिन्दी ‘रहा’ चुना गया है।
- source_word: יָמִים רַבִּים
  choice: बहुत दिनों तक
  rationale: हिब्रू कालवाचक मुहावरे को सहज और निकट रूप में सुरक्षित रखा गया है।
