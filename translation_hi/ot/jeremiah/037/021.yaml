source:
  edition: WLC
  text: וַ/יְצַוֶּ֞ה הַ/מֶּ֣לֶךְ צִדְקִיָּ֗הוּ וַ/יַּפְקִ֣דוּ אֶֽת יִרְמְיָהוּ֮ בַּ/חֲצַ֣ר הַ/מַּטָּרָה֒ וְ/נָתֹן֩ ל֨/וֹ כִכַּר לֶ֤חֶם לַ/יּוֹם֙ מִ/ח֣וּץ הָ/אֹפִ֔ים עַד תֹּ֥ם כָּל הַ/לֶּ֖חֶם מִן הָ/עִ֑יר וַ/יֵּ֣שֶׁב יִרְמְיָ֔הוּ בַּ/חֲצַ֖ר הַ/מַּטָּרָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/021.yaml
  text: So King Zedekiah gave orders[a], and they committed Jeremiah to the court of the guard, and gave him a loaf of bread daily from the bakers’ street, until all the bread from the city was gone. So Jeremiah remained in the court of the guard.
translation:
  language: hi
  text: तब राजा सिदकिय्याह ने आदेश दिया, और उन्होंने यिर्मयाह को पहरे के आँगन में रखा। रोटी बनानेवालों की गली[a] से उसे हर दिन एक रोटी दी जाती रही, जब तक नगर की सारी रोटी समाप्त न हो गई। इस प्रकार यिर्मयाह पहरे के आँगन में रहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘रोटी बनानेवालों के बाहर/गली से’; सम्भवतः वह गली या मुहल्ला जहाँ रोटी बनानेवाले काम करते और रोटी बेचते थे।
    reason: cultural_note
lexical_decisions:
- source_word: וַיְצַוֶּה
  choice: आदेश दिया
  rationale: צוה राजकीय आदेश देने को सूचित करता है; ‘आदेश दिया’ आधुनिक और गरिमापूर्ण हिन्दी में स्वाभाविक है।
- source_word: וַיַּפְקִדוּ
  choice: उन्होंने ... रखा
  rationale: इस प्रसंग में פקד का अर्थ यिर्मयाह को आधिकारिक रूप से निगरानी वाली हिरासत में रखना है। ‘रखा’ अर्थ को सहज रूप से व्यक्त करता है, जबकि स्थान का उल्लेख हिरासत का भाव स्पष्ट करता है।
- source_word: חֲצַר הַמַּטָּרָה
  choice: पहरे का आँगन
  rationale: यह यिर्मयाह की पुस्तक में पहरे से संबद्ध वह आँगन है जहाँ बंदियों को रखा जाता था। यह अनुवाद उसे पूरी जेल मान लेने के बजाय संस्थागत और स्थानगत अर्थ बनाए रखता है।
- source_word: וְנָתוֹן לוֹ
  choice: उसे ... दी जाती रही
  rationale: यह रूप पहले दिए गए राजकीय आदेश के अंतर्गत नियमित प्रबंध को व्यक्त करता है। हिन्दी का कर्मवाच्य उस अनिर्दिष्ट कर्ता को सुरक्षित रखता है जो इब्रानी में स्पष्ट नहीं किया गया।
- source_word: כִכַּר לֶחֶם
  choice: एक रोटी
  rationale: ככר यहाँ गोल रोटी या रोटी की एक पूरी इकाई को दर्शाता है। ‘एक रोटी’ साधारण आधुनिक हिन्दी में स्वाभाविक है और अनावश्यक आकार-विवरण नहीं जोड़ता।
- source_word: לַיּוֹם
  choice: हर दिन
  rationale: यह नियमित दैनिक राशन को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: מִחוּץ הָאֹפִים
  choice: रोटी बनानेवालों की गली
  rationale: शाब्दिक संरचना ‘रोटी पकानेवालों के बाहर/गली से’ है और सम्भवतः उस गली या मुहल्ले को दर्शाती है जहाँ रोटी बनानेवाले काम करते और बेचते थे। यह चुनाव आधुनिक पाठक के लिए ‘नानबाई’ से अधिक सर्वसुलभ है।
- source_word: עַד תֹּם כָּל הַלֶּחֶם מִן הָעִיר
  choice: जब तक नगर की सारी रोटी समाप्त न हो गई
  rationale: यह अवधि नगर की रोटी की आपूर्ति पूरी तरह चुक जाने तक बताती है। ‘नगर की’ इब्रानी מִן הָעִיר के स्रोत/क्षेत्रगत भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיֵּשֶׁב
  choice: रहा
  rationale: ישב यहाँ बैठने से अधिक किसी स्थान पर बने रहने को दर्शाता है; हिरासत का प्रसंग ‘रहा’ का आशय स्पष्ट करता है।
- source_word: יִרְמְיָהוּ
  choice: यिर्मयाह
  rationale: नाम का रूप आधुनिक हिन्दी बाइबलीय प्रयोग और इब्रानी उच्चारण के निकट प्रचलित लिप्यंतरण के अनुरूप है।
- source_word: צִדְקִיָּהוּ
  choice: सिदकिय्याह
  rationale: नाम का यह रूप आधुनिक हिन्दी बाइबलीय प्रयोग में पहचाना जाता है और मूल इब्रानी नाम का उपयुक्त लिप्यंतरण है।
