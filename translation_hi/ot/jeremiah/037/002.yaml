base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/002.yaml
  text: But he and his servants and the people of the land did not listen to the words of Yahweh that he spoke through Jeremiah the prophet[a][b][c].
translation:
  language: hi
  text: परन्तु उसने, उसके सेवकों ने और देश के लोगों[b] ने याहवे के उन वचनों को नहीं सुना[a], जो याहवे ने यिर्मयाह नबी के द्वारा[c] कहे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘याहवे के वचनों पर ध्यान नहीं दिया’ या ‘याहवे के वचनों को नहीं माना’ भी हो सकता है। इब्रानी क्रिया का अर्थ ‘सुनना,’ ‘ध्यान देना’ या प्रसंगानुसार ‘आज्ञा मानना’ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘देश के लोग’; यह पदबंध व्यापक जनता या सामान्य लोगों के लिए प्रयुक्त हो सकता है।
    reason: cultural_note
  - marker: c
    text: शाब्दिक रूप से ‘यिर्मयाह नबी के हाथ से।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לֹא
  choice: परन्तु ... न तो ... न ...
  rationale: संयोजक इस कथन को पिछले पद के विपरीत परिणाम के रूप में आगे बढ़ाता है। हिन्दी में ‘परन्तु’ और समन्वित कर्ताओं के साथ ‘न तो ... न’ स्वाभाविक है।
- source_word: שָׁמַע ... אֶל
  choice: वचनों पर ध्यान दिया
  rationale: इस प्रयोग में क्रिया का अर्थ केवल ध्वनि सुनना नहीं, बल्कि ध्यान देकर ग्रहण करना है। ‘ध्यान दिया’ आज की हिन्दी में यह भाव स्पष्ट करता है, जबकि आज्ञापालन का निहितार्थ पादटिप्पणी में सुरक्षित है।
- source_word: וַ/עֲבָדָיו
  choice: उसके सेवकों
  rationale: राजकीय संदर्भ में यह शब्द सेवकों या अधिकारियों को सूचित कर सकता है। ‘सेवक’ व्यापक अर्थ बनाए रखता है और अनावश्यक रूप से पदाधिकार निश्चित नहीं करता।
- source_word: וְ/עַם הָ/אָרֶץ
  choice: देश के लोगों
  rationale: यह इब्रानी पदबंध का निकट और सुबोध अनुवाद है; इसका आशय सामान्य जनता भी हो सकता है, जिसे पादटिप्पणी में बताया गया है।
- source_word: דִּבְרֵי יְהוָה
  choice: याहवे के ... वचनों
  rationale: बहुवचन דִּבְרֵי को ‘वचनों’ से व्यक्त किया गया है और परमेश्वर के व्यक्तिगत नाम יהוה को ‘याहवे’ लिखा गया है।
- source_word: אֲשֶׁר דִּבֶּר
  choice: जो उसने ... कहे थे
  rationale: सम्बन्धवाचक उपवाक्य ‘वचनों’ को विशेषित करता है और ‘उसने’ का संदर्भ याहवे है। पूर्वकालिक कथन के लिए ‘कहे थे’ स्वाभाविक है।
- source_word: בְּ/יַד
  choice: के द्वारा
  rationale: शाब्दिक अर्थ ‘के हाथ से’ है, पर यहाँ यह भविष्यद्वक्ता को संदेश का माध्यम बताने वाला मुहावरा है; ‘के द्वारा’ उसका स्वाभाविक हिन्दी रूप है।
- source_word: יִרְמְיָהוּ הַ/נָּבִיא
  choice: यिर्मयाह नबी
  rationale: यह मूल शब्दक्रम के निकट रहते हुए आधुनिक हिन्दी में सहज और सम्मानपूर्ण है।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में उपाधि नहीं बल्कि चतुरक्षरीय व्यक्तिगत नाम יהוה है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और नाम को उपाधि से नहीं बदलता।
- issue: שׁמע में सुनने और आज्ञा मानने का संबंध
  choice: मुख्य पाठ में ‘ध्यान दिया’
  alternative: ‘आज्ञा मानी’; ‘सुना’
  rationale: संदर्भ में उत्तरदायी ढंग से सुनना अभिप्रेत है, जिसमें आज्ञापालन निहित हो सकता है। मुख्य पाठ किसी एक अर्थ को अत्यधिक संकीर्ण नहीं करता और वैकल्पिक अर्थ पादटिप्पणी में देता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज किंतु गरिमापूर्ण रखी गई है। समन्वित कर्ताओं के लिए ‘न तो ... न’ का प्रयोग वाक्य को स्वाभाविक बनाता है। ‘वचन,’ ‘नबी’ और ‘याहवे’ बाइबलीय संदर्भ बनाए रखते हैं, जबकि कठिन इब्रानी मुहावरों को पादटिप्पणियों में स्पष्ट किया गया है।
