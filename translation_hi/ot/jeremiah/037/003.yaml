base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/003.yaml
  text: Then King Zedekiah sent Jehucal son of Shelemiah and Zephaniah son of Maaseiah the priest to Jeremiah the prophet[a], saying, “Please pray to Yahweh our God for us.”
translation:
  language: hi
  text: तब राजा सिदकिय्याह ने शलेम्याह के पुत्र यहूकल[a] और मासेयाह के पुत्र याजक सपन्याह को यिर्मयाह नबी के पास यह कहने के लिए भेजा, “कृपया हमारे लिए हमारे परमेश्वर याहवे से प्रार्थना कीजिए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में नाम यहूकल है; कुछ अंग्रेज़ी अनुवादों में संबंधित संदर्भों में संक्षिप्त रूप ‘जूकल’ मिलता है।
    reason: इब्रानी नाम यहूकल और अंग्रेज़ी अनुवाद-परंपरा के वैकल्पिक रूप की जानकारी देना, बिना यह दावा किए कि संक्षिप्त रूप मूल इब्रानी पाठ में है।
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: तब ... भेजा
  rationale: वय्यिक्तोल कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में क्रम व्यक्त करता है।
- source_word: הַמֶּלֶךְ צִדְקִיָּהוּ
  choice: राजा सिदकिय्याह
  rationale: उपाधि और नाम का यह क्रम मानक हिन्दी में स्वाभाविक है।
- source_word: יְהוּכַל
  choice: यहूकल
  rationale: इस पद के पूर्ण इब्रानी नाम का देवनागरी लिप्यंतरण; संबंधित संदर्भ में संक्षिप्त रूप ‘यूकल’ भी मिलता है।
- source_word: צְפַנְיָהוּ בֶן מַעֲשֵׂיָה הַכֹּהֵן
  choice: मासेयाह के पुत्र याजक सपन्याह
  rationale: संदर्भ में ‘याजक’ का संबंध सपन्याह से होना सबसे स्वाभाविक है; हिन्दी क्रम इस संबंध को स्पष्ट रखता है।
- source_word: אֶל יִרְמְיָהוּ הַנָּבִיא
  choice: यिर्मयाह नबी के पास
  rationale: अर्थ के निकट और हिन्दी में सहज अभिव्यक्ति।
- source_word: לֵאמֹר
  choice: यह कहने के लिए
  rationale: प्रत्यक्ष कथन आरंभ कराने वाले इब्रानी क्रियारूप को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הִתְפַּלֶּל נָא
  choice: कृपया ... प्रार्थना कीजिए
  rationale: आज्ञार्थक क्रिया और विनम्र अनुरोध सूचक נָא दोनों को आदरसूचक हिन्दी में बनाए रखता है।
- source_word: בַעֲדֵנוּ
  choice: हमारे लिए
  rationale: यहाँ किसी की ओर से मध्यस्थ प्रार्थना करने का सहज हिन्दी रूप।
- source_word: יְהוָה
  choice: यहवे
  rationale: चतुरक्षरीय व्यक्तिगत ईश्वरीय नाम का प्रचलित हिन्दी लिप्यंतरण, उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: אֱלֹהֵינוּ
  choice: हमारे परमेश्वर
  rationale: प्रथम पुरुष बहुवचन संबंधसूचक प्रत्यय को पूर्णतः व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ व्यक्तिगत नाम का प्रयोग करता है; ‘यहवे’ उसे नाम के रूप में सुरक्षित रखता है, जबकि ‘प्रभु’ उसे उपाधि बना देता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध हिन्दी। व्यक्तिनामों के लिए हिन्दी बाइबल परंपरा से परिचित रूप रखे गए हैं; वाक्यक्रम ऐसा रखा गया है कि ‘याजक’ स्पष्टतः सपन्याह को विशेषित करे।
