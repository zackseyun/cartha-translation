source:
  edition: WLC
  text: וְ/עַתָּ֕ה שְֽׁמַֽע נָ֖א אֲדֹנִ֣/י הַ/מֶּ֑לֶךְ תִּפָּל נָ֤א תְחִנָּתִ/י֙ לְ/פָנֶ֔י/ךָ וְ/אַל תְּשִׁבֵ֗/נִי בֵּ֚ית יְהוֹנָתָ֣ן הַ/סֹּפֵ֔ר וְ/לֹ֥א אָמ֖וּת שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/020.yaml
  text: So now[a], please hear, my lord the king; please let my plea fall before you, and do not send me back to the house of Jehonathan the scribe, lest I die there.
translation:
  language: hi
  text: अब, हे मेरे प्रभु राजा, कृपया मेरी सुनिए। कृपया मेरी विनती आपके सामने आने दें[a], और मुझे यहोनातान शास्त्री के घर वापस न भेजिए, कहीं ऐसा न हो कि मैं वहीं मर जाऊँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “मेरी विनती आपके सामने गिर पड़े।” यह किसी अधिकारी के सामने याचना प्रस्तुत करने का इब्रानी मुहावरा है।'
    reason: मुख्य पाठ में मुहावरे का स्वाभाविक हिंदी अर्थ दिया गया है, जबकि पादटिप्पणी मूल रूपक सुरक्षित रखती है।
lexical_decisions:
- source_word: וְעַתָּה
  choice: इसलिए अब
  rationale: यह संयोजक पद पिछले प्रसंग से जुड़ी तत्काल और आग्रहपूर्ण अपील आरम्भ करता है; ‘इसलिए अब’ וְ की संबंधसूचक शक्ति और עַתָּה का समयबोध दोनों व्यक्त करता है।
- source_word: שְׁמַע נָא
  choice: कृपया मेरी सुनिए
  rationale: שׁמע का मूल अर्थ ‘सुनना’ है और נָא विनम्र किंतु अत्यावश्यक अनुरोध प्रकट करता है। हिंदी में ‘मेरी सुनिए’ अपील के प्रसंग में स्वाभाविक है।
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: हे मेरे प्रभु राजा
  rationale: यह राजदरबार का आदरसूचक संबोधन है। ‘मेरे प्रभु’ संबंधसूचक सम्मान और ‘राजा’ पदवी, दोनों को सुरक्षित रखता है।
- source_word: תִּפָּל נָא תְחִנָּתִי לְפָנֶיךָ
  choice: मेरी विनती आपके सामने स्वीकार हो
  rationale: इब्रानी में विनती के ‘सामने गिरने’ का रूढ़ प्रयोग किसी वरिष्ठ के समक्ष याचना प्रस्तुत और ग्रहण किए जाने के लिए है। मुख्य पाठ में स्वाभाविक हिंदी दी गई है और शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: תְחִנָּתִי
  choice: मेरी विनती
  rationale: ‘विनती’ गंभीर और दीनतापूर्ण अनुरोध को आधुनिक, सहज हिंदी में व्यक्त करती है।
- source_word: וְאַל תְּשִׁבֵנִי
  choice: मुझे ... वापस न भेजिए
  rationale: שוב का हिफ़ील रूप कारणवाचक है—‘मुझे लौटाना’। बंदीगृह के संदर्भ में ‘वापस न भेजिए’ सबसे स्वाभाविक है।
- source_word: בֵּית יְהוֹנָתָן הַסֹּפֵר
  choice: यहोन्तान शास्त्री के घर
  rationale: ‘घर’ בֵּית का सीधा अर्थ सुरक्षित रखता है, यद्यपि प्रसंग में यह बंदी रखने का स्थान है। ‘यहोन्तान’ יְהוֹנָתָן के पूर्ण इब्रानी नामरूप को दर्शाता है; ‘शास्त्री’ यहाँ लेखकीय/राजकीय पद का पारंपरिक और समझने योग्य नाम है।
- source_word: וְלֹא אָמוּת שָׁם
  choice: कहीं ऐसा न हो कि मैं वहीं मर जाऊँ
  rationale: व्याकरणतः यह ‘और मैं वहाँ न मरूँ’ है, पर संदर्भ में अनुरोध का भयावह संभावित परिणाम बताता है। ‘कहीं ऐसा न हो’ उस आशंका को स्पष्ट रखते हुए उसे निश्चित भविष्यवाणी नहीं बनाता।
