source:
  edition: WLC
  text: ו/אי/ו נְבִ֣יאֵי/כֶ֔ם אֲשֶׁר נִבְּא֥וּ לָ/כֶ֖ם לֵ/אמֹ֑ר לֹֽא יָבֹ֤א מֶֽלֶךְ בָּבֶל֙ עֲלֵי/כֶ֔ם וְ/עַ֖ל הָ/אָ֥רֶץ הַ/זֹּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/019.yaml
  text: And where are your prophets who prophesied to you[a], saying, ‘The king of Babylon will not come against you or against this land’?”
translation:
  language: hi
  text: और तुम्हारे नबी कहाँ हैं, जिन्होंने तुमसे यह कहते हुए भविष्यवाणी की थी, ‘बाबेल का राजा तुम्हारे विरुद्ध और इस देश के विरुद्ध नहीं आएगा’?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַיּוֹ
  choice: और ... अब कहाँ हैं
  rationale: संयोजक और तीखे आलंकारिक प्रश्न—दोनों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; ‘अब’ प्रसंग में निहित चुनौती को स्पष्ट करता है।
- source_word: נְבִיאֵיכֶם
  choice: तुम्हारे वे नबी
  rationale: द्वितीय पुरुष बहुवचन स्वत्व को सीधे रखता है; ‘वे’ आगे आने वाले संबंधवाचक उपवाक्य से नबियों की पहचान सहजता से जोड़ता है।
- source_word: אֲשֶׁר נִבְּאוּ לָכֶם
  choice: जिन्होंने तुमसे भविष्यवाणी करके कहा था
  rationale: נבא की भविष्यवाणी करने की क्रिया और לָכֶם के संबोधित श्रोताओं को सुरक्षित रखता है; हिन्दी में ‘कहा था’ को לֵאמֹר के साथ जोड़ने से उद्धरण स्वाभाविक बनता है।
- source_word: לֵאמֹר
  choice: कहा था
  rationale: यह उद्धरण आरम्भ कराने वाला रूप है; हिन्दी में पूर्व कथन का सीधा उद्धरण प्रस्तुत करने के लिए यह स्वाभाविक है।
- source_word: לֹא יָבֹא
  choice: न तो ... आएगा
  rationale: निषेध सहित अपूर्ण क्रिया का भावी पूर्वकथन व्यक्त करता है और अगले समन्वित पद के साथ ‘न तो...न...’ संरचना बनाता है।
- source_word: מֶלֶךְ בָּבֶל
  choice: बाबेल का राजा
  rationale: इब्रानी संबंध-रचना का पारदर्शी और हिन्दी बाइबलीय प्रयोग में परिचित अनुवाद है।
- source_word: עֲלֵיכֶם
  choice: तुम्हारे विरुद्ध
  rationale: शत्रुतापूर्ण सैन्य आगमन के प्रसंग में עַל का विरोधात्मक अर्थ स्पष्ट करता है।
- source_word: וְעַל הָאָרֶץ הַזֹּאת
  choice: न इस देश के विरुद्ध
  rationale: दोनों लक्ष्यों पर लागू निषेध को हिन्दी की स्वाभाविक ‘न तो...न...’ रचना में व्यक्त करता है; ‘इस देश’ संकेतवाचक बल को बनाए रखता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सीधे संबोधन वाली है। आलंकारिक प्रश्न की तीक्ष्णता बनाए रखी गई है। पद में कोई आवश्यक पाठालोचनात्मक या धर्मवैज्ञानिक टिप्पणी नहीं है; इसलिए पादटिप्पणी नहीं दी गई।
