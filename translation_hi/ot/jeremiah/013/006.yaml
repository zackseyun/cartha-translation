source:
  edition: WLC
  text: וַ/יְהִ֕י מִ/קֵּ֖ץ יָמִ֣ים רַבִּ֑ים וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י ק֚וּם לֵ֣ךְ פְּרָ֔תָ/ה וְ/קַ֤ח מִ/שָּׁם֙ אֶת הָ֣/אֵז֔וֹר אֲשֶׁ֥ר צִוִּיתִ֖י/ךָ לְ/טָמְנ/וֹ שָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/006.yaml
  text: And it happened after many days that Yahweh said to me[a], “Arise, go to Perath[c][b], and take from there the waistband that I commanded you to hide there.”
translation:
  language: hi
  text: बहुत दिनों के बाद याहवे ने मुझसे कहा, “उठ, परात[a] जा और वहाँ से वह कमरबंद[b] ले आ, जिसे मैंने तुझे वहाँ छिपाने[c] की आज्ञा दी थी।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘परात’ से फरात (यूफ्रेटीस) नदी का संकेत हो सकता है; मूल स्थान-नाम को यहाँ लिप्यंतरित किया गया है।
    reason: alternative_reading
  - marker: b
    text: या “लंगोटी,” “पेटी,” अथवा “पटुका।”
    reason: lexical_alternative
  - marker: c
    text: या “गाड़ देने”; हिब्रू क्रिया का अर्थ छिपाना या गुप्त रखना है, कभी-कभी गाड़कर।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִקֵּץ יָמִים רַבִּים
  choice: बहुत दिनों के बाद
  rationale: हिब्रू कथात्मक सूत्र और समय-सूचक वाक्यांश का स्वाभाविक आधुनिक हिन्दी रूप; अलग से ‘ऐसा हुआ’ जोड़ना हिन्दी में अनावश्यक बोझिलता पैदा करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के व्यक्तिगत नाम का प्रचलित लिप्यंतरण, जो मूल चतुरक्षरीय नाम को उपाधि से नहीं बदलता।
- source_word: קוּם לֵךְ
  choice: उठ, ... जा
  rationale: दोनों आज्ञार्थक क्रियाओं का सीधा और स्वाभाविक हिन्दी रूप, जिसमें गति की तत्परता बनी रहती है।
- source_word: פְּרָתָה
  choice: परात
  rationale: स्थान-नाम को मुख्य पाठ में लिप्यंतरित किया गया है, क्योंकि इसका संकेत फरात नदी की ओर हो सकता है, पर इसे निश्चित कर देना मूल की संभावित अस्पष्टता मिटा देगा।
- source_word: וְקַח מִשָּׁם
  choice: वहाँ से ... ले आ
  rationale: वक्ता की ओर वस्तु वापस लाने का प्रसंग हिन्दी में ‘ले आ’ से स्वाभाविक रूप में व्यक्त होता है।
- source_word: הָאֵזוֹר
  choice: कमरबंद
  rationale: कमर के चारों ओर पहनी जाने वाली वस्तु के लिए व्यापक और सहज शब्द; यह वस्त्र के सटीक प्रकार को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: אֲשֶׁר צִוִּיתִיךָ
  choice: जिसे मैंने तुझे ... की आज्ञा दी थी
  rationale: पूर्व में दी गई अधिकारपूर्ण आज्ञा का स्पष्ट और स्वाभाविक हिन्दी निरूपण।
- source_word: לְטָמְנוֹ שָׁם
  choice: वहाँ छिपाने
  rationale: טמן का व्यापक अर्थ ‘छिपाना’ है; गाड़कर छिपाना संभव है, लेकिन मुख्य पाठ में उसे निश्चित नहीं किया गया।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम है, इसलिए उसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया। आधुनिक हिन्दी बाइबल-परंपरा में ‘यहोवा’ अधिक पहचाना जाने वाला रूप है, जबकि ‘याहवे’ संभावित वैकल्पिक उच्चारण है।
- issue: פְּרָתָה की भौगोलिक पहचान
  choice: परात
  alternative: फरात नदी के पास
  rationale: रूप सामान्यतः फरात की दिशा या स्थान का संकेत दे सकता है, किंतु इस प्रसंग में वैकल्पिक स्थानीय पहचान की संभावना के कारण मुख्य पाठ में लिप्यंतरण रखकर अस्पष्टता सुरक्षित की गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। संबोधन में एकवचन ‘तू’ के रूप ‘उठ/जा/तुझे’ मूल के एकवचन आदेश को दर्शाते हैं और भविष्यद्वक्ता से ईश्वरीय संबोधन की पारंपरिक हिन्दी शैली के अनुरूप हैं। सभी पाद-टिप्पणी चिह्न संबंधित शब्दों के तुरंत बाद मुख्य पाठ में दिए गए हैं।
