id: JER.13.1
reference: Jeremiah 13:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כֹּֽה אָמַ֨ר יְהוָ֜ה אֵלַ֗/י הָל֞וֹךְ וְ/קָנִ֤יתָ לְּ/ךָ֙ אֵז֣וֹר פִּשְׁתִּ֔ים וְ/שַׂמְתּ֖/וֹ עַל מָתְנֶ֑י/ךָ וּ/בַ/מַּ֖יִם לֹ֥א תְבִאֵֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/001.yaml
  text: 'Thus Yahweh said to me: “Go and buy yourself a linen waistband[a], and put it on your waist, but do not put it in water.”'
translation:
  language: hi
  text: 'याहवे ने मुझसे यों कहा: “जा, अपने लिए लिनन का एक कमरबंद[a] खरीद और उसे अपनी कमर पर बाँध, पर उसे पानी में मत डालना।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “लिनन की पेटी,” “लिनन का पटका,” अथवा संभवतः “लिनन की लँगोटी।” इब्रानी शब्द אֵזוֹר कमर पर पहनी जाने वाली वस्तु को दर्शाता है।
    reason: मूल इब्रानी शब्द वस्त्र के सटीक प्रकार को निश्चित नहीं करता, इसलिए प्रमुख शाब्दिक विकल्प दिए गए हैं।
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के विशिष्ट वाचा-नाम को सामान्य उपाधि से बदलने के बजाय उसके प्रचलित हिन्दी लिप्यंतरण में रखा गया है।
- source_word: כֹּה אָמַר
  choice: यों कहा
  rationale: यह भविष्यवाणी-संबंधी मानक कथन-प्रारूप का स्वाभाविक और गरिमापूर्ण हिन्दी रूप है।
- source_word: הָלוֹךְ וְקָנִיתָ לְּךָ
  choice: जा, अपने लिए ... खरीद
  rationale: आज्ञार्थक बल, क्रय का अर्थ और לְּךָ का आत्मवाची भाव—तीनों सुरक्षित रहते हैं।
- source_word: אֵזוֹר פִּשְׁתִּים
  choice: सन का एक कमरबंद
  rationale: אֵזוֹר कमर पर पहनी जाने वाली वस्तु है और פִּשְׁתִּים सन/लिनन को दर्शाता है; ‘कमरबंद’ वस्तु का प्रकार बताए बिना अर्थ को पर्याप्त व्यापक रखता है।
- source_word: וְשַׂמְתּוֹ עַל מָתְנֶיךָ
  choice: उसे अपनी कमर पर बाँध
  rationale: आधुनिक हिन्दी में कमर पर पहने जाने वाले कमरबंद के लिए ‘बाँध’ स्वाभाविक है और מָתְנַיִם के कमर-कटि क्षेत्र को स्पष्ट करता है।
- source_word: וּבַמַּיִם לֹא תְבִאֵהוּ
  choice: पर उसे पानी में मत डालना
  rationale: हिफ़ील रूप का शाब्दिक भाव ‘पानी में प्रवेश कराना’ है; हिन्दी में ‘पानी में डालना’ उसका स्पष्ट और मुहावरेदार समतुल्य है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में विशिष्ट चतुरक्षरीय नाम है; ‘याहवे’ उसे उपाधि में बदले बिना प्रत्यक्ष रूप से प्रस्तुत करता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। परमेश्वर की यिर्मयाह को दी गई एकवचन प्रत्यक्ष आज्ञा के लिए ‘जा/खरीद’ का प्रयोग हुआ है। ‘कमरबंद’ को मुख्य पाठ में व्यापक पद के रूप में रखा गया है और अधिक विशिष्ट संभावनाएँ पादटिप्पणी में दी गई हैं।
