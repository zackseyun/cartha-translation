  text: זֶ֣ה גוֹרָלֵ֧/ךְ מְנָת מִדַּ֛יִ/ךְ מֵֽ/אִתִּ֖/י נְאֻם יְהוָ֑ה אֲשֶׁר֙ שָׁכַ֣חַתְּ אוֹתִ֔/י וַֽ/תִּבְטְחִ֖י בַּ/שָּֽׁקֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/025.yaml
  text: This is your lot[a], the portion measured out to you from me, declares Yahweh[b], because you have forgotten me and trusted in falsehood.
translation:
  language: hi
  text: “यही तुम्हारा भाग्य[a] है—मेरी ओर से तुम्हारे लिए नापा गया हिस्सा—याहवे की यह घोषणा है—क्योंकि तुम मुझे भूल गई हो और झूठ[b] पर भरोसा किया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तुम्हारा ठहराया हुआ भाग’ अथवा ‘तुम्हारे हिस्से में आया परिणाम।’ इब्रानी में ‘भाग्य/चिट्ठी से निकला भाग’ और ‘हिस्सा’—दोनों भाव वाले शब्द साथ आए हैं।
    reason: lexical_alternative
  - marker: b
    text: या ‘असत्य’ अथवा ‘छल।’ इब्रानी शब्द שֶׁקֶר झूठ, असत्य या धोखे को दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה גוֹרָלֵךְ
  choice: यही तुम्हारा भाग्य है
  rationale: זֶה घोषणा को संकेतात्मक बल देता है, और גוֹרָל यहाँ किसी को मिले या ठहराए गए भाग्य अथवा हिस्से को दर्शाता है। ‘यही तुम्हारा भाग्य है’ न्याय की घोषणा के प्रसंग में स्वाभाविक और स्पष्ट है।
- source_word: מְנָת מִדַּיִךְ מֵאִתִּי
  choice: मेरी ओर से तुम्हारे लिए नापा गया हिस्सा
  rationale: מְנָת और माप से संबंधित מִדַּיִךְ मिलकर निर्धारित तथा नापकर दिए गए हिस्से पर बल देते हैं; מֵאִתִּי उसका स्रोत वक्ता को बताता है।
- source_word: נְאֻם יְהוָה
  choice: याहवे की यह घोषणा है
  rationale: נְאֻם भविष्यद्वाणी की गंभीर घोषणात्मक शैली है। יְהוָה को उसके व्यक्तिगत नाम के लिप्यंतरण ‘याहवे’ से व्यक्त किया गया है।
- source_word: אֲשֶׁר שָׁכַחַתְּ אוֹתִי
  choice: क्योंकि तुम मुझे भूल गई हो
  rationale: इस प्रसंग में אֲשֶׁר कारण प्रस्तुत करता है। स्त्रीलिंग एकवचन क्रिया को ‘भूल गई हो’ में बनाए रखा गया है, क्योंकि संबोधन यहूदा/यरूशलेम को सामूहिक स्त्रीलिंग रूप में है।
- source_word: וַתִּבְטְחִי בַּשָּׁקֶר
  choice: और झूठ पर भरोसा किया है
  rationale: בּטח भरोसा रखने को और שֶׁקֶר व्यापक रूप से झूठ, असत्य या छल को दर्शाता है। ‘झूठ’ सामान्य आधुनिक हिन्दी में संक्षिप्त है और आशय को अनावश्यक रूप से किसी एक प्रकार के छल तक सीमित नहीं करता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में परमेश्वर का विशिष्ट नाम है, इसलिए उसे उपाधि से बदलने के बजाय ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- issue: द्वितीय पुरुष स्त्रीलिंग एकवचन का संदर्भ
  choice: ‘तुम’ के साथ स्त्रीलिंग ‘भूल गई हो’ बनाए रखा गया
  alternative: पाठ में ‘यहूदा’ या ‘यरूशलेम’ नाम स्पष्ट रूप से जोड़ना
  rationale: इब्रानी पाठ किसी स्त्रीलिंग एकवचन सत्ता—प्रसंगतः यहूदा/यरूशलेम—से सीधा संबोधन करता है। नाम जोड़ने के बजाय व्याकरणिक संकेत सुरक्षित रखा गया है।
- issue: שֶׁקֶר का संभावित धार्मिक या राजनीतिक आशय
  choice: व्यापक शब्द ‘झूठ’
  alternative: झूठे देवता; छलपूर्ण राजनीतिक सहारा
  rationale: मूल शब्द दोनों प्रकार के संदर्भ समेट सकता है, पर इस पद में किसी एक को स्पष्ट नहीं करता। अनुवाद इस अर्थगत खुलापन को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सीधी रखी गई है। आरंभिक कथन में विराम-चिह्नों से ‘भाग्य’ और ‘नापा गया हिस्सा’ के समानार्थी बल को दिखाया गया है। ‘भूल गई हो’ मूल के स्त्रीलिंग एकवचन संबोधन को सुनाई देता हुआ रखता है; अगले खंड में हिन्दी की स्वाभाविक संयुक्त रचना अपनाई गई है।
