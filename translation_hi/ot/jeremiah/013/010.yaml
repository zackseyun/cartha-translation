base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/010.yaml
  text: This evil people[a], who refuse to hear my words, who walk in the stubbornness of their heart, and who go after other gods to serve them and to bow down to them, will become like this waistband, which is good for nothing.
translation:
  language: hi
  text: यह दुष्ट प्रजा, जो मेरी बातें सुनने से इनकार करती है, जो अपने हृदय की हठ पर चलती है और दूसरे देवताओं के पीछे चलकर उनकी सेवा करती और उनके आगे दण्डवत् प्रणाम करती है, इस कमरबन्द[a] के समान हो जाएगी, जो किसी काम का नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘कमरपट्टे’ अथवा ‘पटुका’। इब्रानी शब्द אֵזוֹר कमर पर पहने जाने वाले वस्त्र को दर्शाता है; उसकी सटीक बनावट निश्चित नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעָם הַזֶּה הָרָע
  choice: यह दुष्ट प्रजा
  rationale: עָם यहाँ यहूदा और यरूशलेम के सामूहिक समुदाय को दर्शाता है; ‘प्रजा’ इस सामूहिक एकवचन को बनाए रखता है। רַע का ‘दुष्ट’ नैतिक दोष की नबी-संबंधी तीव्रता व्यक्त करता है।
- source_word: הַמֵּאֲנִים לִשְׁמוֹעַ אֶת־דְּבָרַי
  choice: जो मेरी बातें सुनने से इनकार करती है
  rationale: מָאֵן केवल न सुन पाने को नहीं, बल्कि जानबूझकर इनकार करने को दर्शाता है। ‘सुनने’ में ध्यान देने और आज्ञा मानने का हिब्रू भाव खुला रहता है; דְּבָרַי का बहुवचन ‘मेरी बातें’ में सुरक्षित है।
- source_word: הַהֹלְכִים בִּשְׁרִרוּת לִבָּם
  choice: जो अपने हृदय की हठ पर चलती है
  rationale: הלך के चलने वाले रूपक और שְׁרִרוּת की हठ/अड़ियलपन की धारणा दोनों को रखा गया है। सामूहिक एकवचन לִבָּם को ‘अपने हृदय’ से प्रतिबिंबित किया गया है।
- source_word: וַיֵּלְכוּ אַחֲרֵי אֱלֹהִים אֲחֵרִים
  choice: और दूसरे देवताओं के पीछे चलकर
  rationale: ‘पीछे चलना’ मूल के धार्मिक निष्ठा त्यागने वाले ठोस रूपक को बनाए रखता है और इसे केवल सामान्य ‘पूजा करना’ में नहीं बदलता।
- source_word: לְעָבְדָם וּלְהִשְׁתַּחֲוֺת לָהֶם
  choice: उनकी सेवा करती और उनके आगे दण्डवत् करती है
  rationale: עבד और השתחוה दो अलग क्रियाएँ हैं। ‘सेवा’ निष्ठापूर्ण अधीनता को और ‘दण्डवत्’ शारीरिक रूप से झुकने को व्यक्त करता है।
- source_word: וִיהִי כָּאֵזוֹר הַזֶּה
  choice: इस कमरबन्द के समान हो जाएगी
  rationale: ‘हो जाएगी’ आगामी परिणति को स्पष्ट करता है। אֵזוֹר कमर पर पहना जाने वाला वस्त्र है; ‘कमरबन्द’ उसके स्थान और कार्य को सहज हिन्दी में व्यक्त करता है, जबकि उसकी सटीक बनावट अनिश्चित रहने दी गई है।
- source_word: אֲשֶׁר לֹא יִצְלַח לַכֹּל
  choice: जो किसी काम का नहीं है
  rationale: यह स्वाभाविक आधुनिक हिन्दी मुहावरा मूल में व्यक्त पूर्ण अनुपयोगिता को संक्षेप और प्रभावपूर्ण ढंग से रखता है।
theological_decisions:
- issue: मूर्तिपूजा का वर्णन करने वाली दो क्रियाओं का भेद
  choice: עבד को ‘सेवा करना’ और השתחוה को ‘दण्डवत् करना’
  alternative: दोनों को सामान्य रूप से ‘पूजा करना’
  rationale: मूल पाठ मूर्तिपूजक निष्ठा के दो पहलुओं—सेवा और झुककर प्रणाम—को अलग-अलग रखता है। दोनों को एक शब्द में मिलाने से आरोप की आलंकारिक पूर्णता घट जाती।
- issue: ‘सुनने’ में निहित आज्ञाकारिता
  choice: ‘सुनने से इनकार करती है’
  alternative: ‘मानने से इनकार करती है’
  rationale: ‘सुनना’ मूल क्रिया के श्रवण और आज्ञापालन दोनों संभावित आयामों को खुला रखता है; केवल ‘मानना’ कहने से ठोस श्रवण-रूपक लुप्त हो जाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। सामूहिक ‘प्रजा’ के साथ स्त्रीलिंग एकवचन क्रियाएँ प्रयोग की गई हैं। ‘हृदय की हठ’ और ‘पीछे चलना’ जैसे मूल रूपकों को अर्थ की तीव्रता और वाचा-संबंधी प्रतिध्वनि बनाए रखने के लिए सुरक्षित रखा गया है।
