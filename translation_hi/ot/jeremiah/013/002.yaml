base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/002.yaml
  text: So I bought the loincloth according to the word of Yahweh[a], and put it on my waist.
translation:
  language: hi
  text: तब मैंने याहवे के वचन के अनुसार वह कमरबंद[a] खरीदा और उसे अपनी कमर पर पहन लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पटुका” अथवा “कटिवस्त्र”; इब्रानी शब्द कमर के चारों ओर शरीर से सटाकर पहने जाने वाले वस्त्र या पट्टे को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקְנֶה
  choice: तब मैंने ... मोल लिया
  rationale: קנה के प्रथम पुरुष एकवचन वय्यिक्तोल रूप में कथा की अगली क्रिया है। ‘मोल लिया’ खरीदने का स्पष्ट और स्वाभाविक हिन्दी रूप है; ‘तब’ घटनाक्रम को व्यक्त करता है।
- source_word: הָאֵזוֹר
  choice: वह कमरबंद
  rationale: אֵזוֹר कमर के चारों ओर पहने जाने वाले वस्त्र या पट्टे को दर्शाता है। ‘कमरबंद’ हिन्दी में अर्थ स्पष्ट रखता है, जबकि वस्तु का ठीक स्वरूप संदर्भ में कुछ अस्पष्ट है; इसलिए विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: כִּדְבַר יְהוָה
  choice: यहोवा के वचन के अनुसार
  rationale: यह पदबंध शाब्दिक रूप से ‘यहोवा के वचन के अनुसार’ है और बताता है कि यिर्मयाह ने मिले हुए आदेश के अनुरूप काम किया।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय ईश-नाम יהוה को हिन्दी में प्रचलित व्यक्तिगत नाम ‘यहोवा’ से व्यक्त किया गया है, न कि किसी उपाधि से।
- source_word: וָאָשִׂם עַל־מָתְנָי
  choice: और उसे अपनी कमर पर बाँध लिया
  rationale: שׂים का मूल अर्थ ‘रखना/लगाना’ है; कमर पर पहने जाने वाले कमरबंद के संदर्भ में ‘बाँध लिया’ स्वाभाविक हिन्दी है। מָתְנַיִם यहाँ कमर को दर्शाता है।
theological_decisions:
- issue: ईश-नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत ईश-नाम सीधे आया है। हिन्दी पाठकों में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ को रखा गया है; ‘प्रभु’ करने से नाम उपाधि में बदल जाता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। कथा-क्रम के लिए ‘तब’ और पहनने की क्रिया के लिए ‘बाँध लिया’ रखा गया है। वस्तु के निश्चित स्वरूप को मुख्य पाठ में अत्यधिक विशिष्ट न बनाकर पादटिप्पणी में वास्तविक शाब्दिक विकल्प सुरक्षित रखे गए हैं।
