  text: קַ֧ח אֶת הָ/אֵז֛וֹר אֲשֶׁ֥ר קָנִ֖יתָ אֲשֶׁ֣ר עַל מָתְנֶ֑י/ךָ וְ/קוּם֙ לֵ֣ךְ פְּרָ֔תָ/ה וְ/טָמְנֵ֥/הוּ שָׁ֖ם בִּ/נְקִ֥יק הַ/סָּֽלַע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/004.yaml
  text: Take the waistband that you bought[a], which is on your waist, and arise, go to Perath, and hide it there in a crevice of the rock.
translation:
  language: hi
  text: “जो कमरबंद तुमने खरीदा था और जो तुम्हारी कमर पर है, उसे लो; उठो, परात जाओ और वहाँ उसे चट्टान की एक दरार में छिपा दो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵזוֹר
  choice: कमरबंद
  rationale: यह शब्द कमर पर पहनी जाने वाली वस्तु को दर्शाता है। ‘कमरबंद’ आधुनिक हिन्दी में स्वाभाविक है और ‘पेटी’ या अधिक व्याख्यात्मक ‘लंगोटी’ की तुलना में अर्थ को खुला रखता है।
- source_word: קָנִיתָ
  choice: तुमने खरीदा है
  rationale: क्रिया का सामान्य अर्थ ‘खरीदना/प्राप्त करना’ है; निकटवर्ती कथा-संदर्भ में ठोस अर्थ ‘खरीदा’ उपयुक्त है।
- source_word: עַל מָתְנֶיךָ
  choice: तुम्हारी कमर पर
  rationale: מָתְנַיִם कमर-कटि क्षेत्र को सूचित करता है। यह वर्तमान हिन्दी में स्पष्ट और स्वाभाविक अभिव्यक्ति है।
- source_word: וְקוּם
  choice: उठो
  rationale: आज्ञार्थक क्रिया अगले कार्य की तत्पर शुरुआत कराती है; ‘उठो’ गरिमापूर्ण और सहज हिन्दी है।
- source_word: פְּרָתָה
  choice: परात
  rationale: मुख्य पाठ में हिब्रू स्थान-नाम का लिप्यंतरण रखा गया है, ताकि फरात नदी के साथ उसकी पारंपरिक परंतु विवादित पहचान को पाठ में निश्चित न कर दिया जाए।
- source_word: טָמְנֵהוּ
  choice: उसे ... छिपा दो
  rationale: क्रिया का व्यापक अर्थ छिपाना या गुप्त रखना है। ‘गाड़ दो’ किसी विशेष विधि को अनावश्यक रूप से जोड़ देगा।
- source_word: נְקִיק
  choice: दरार
  rationale: शब्द चट्टान की फाँक या दरार को दर्शाता है; ‘दरार’ साधारण आधुनिक हिन्दी में स्पष्ट है।
- source_word: הַסָּלַע
  choice: चट्टान
  rationale: סֶלַע चट्टान या शैल-खंड को सूचित करता है। ‘चट्टान की ... दरार’ हिन्दी में स्वाभाविक संयोजन है।
theological_decisions:
- issue: פְּרָתָה की पहचान
  choice: मुख्य पाठ में स्थान-नाम ‘परात’
  alternative: फरात नदी
  rationale: हिब्रू रूप को स्थान-नाम के रूप में लिप्यंतरित करने से भौगोलिक पहचान से जुड़ी वास्तविक अनिश्चितता बनी रहती है। पारंपरिक पहचान को पादटिप्पणी में दिया गया है, न कि मुख्य पाठ में निर्णायक बनाया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। आज्ञाओं का क्रम हिब्रू के निकट रखा गया है, जबकि हिन्दी की स्वाभाविक वाक्य-रचना के लिए वस्तु-सूचक पदों को स्पष्ट रूप से व्यवस्थित किया गया है।
