  register: आधुनिक मानक हिन्दी; न्याय-वाणी की गंभीरता बनाए रखते हुए वाक्य को सामान्य पाठक के लिए स्वाभाविक रखा गया है। ‘तितर-बितर’ सामूहिक बिखराव को और ‘उड़ता जाता है’ मूल कृदन्त की जारी गति को व्यक्त करता है।
