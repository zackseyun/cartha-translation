  text: וַ/אֲפִיצֵ֖/ם כְּ/קַשׁ עוֹבֵ֑ר לְ/ר֖וּחַ מִדְבָּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/024.yaml
  text: So I will scatter them like chaff passing away before the desert wind[a].
translation:
  language: hi
  text: इसलिए मैं उन्हें भूसे की तरह तितर-बितर कर दूँगा, जो मरुभूमि की हवा के आगे उड़ता चला जाता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “सूखी पुआल की तरह, जो निर्जन प्रदेश की हवा के आगे उड़ती चली जाती है।”'
    reason: कַשׁ के लिए ‘भूसा’ या ‘सूखी पुआल’ और מִדְבָּר के लिए ‘मरुभूमि’ या ‘निर्जन प्रदेश’ संभव हैं। עוֹבֵר לְרוּחַ की हवा के रुख में चलती हुई छवि को ‘हवा के आगे उड़ता चला जाता है’ से व्यक्त किया गया है।
lexical_decisions:
- source_word: וַאֲפִיצֵם
  choice: इसलिए मैं उन्हें ... तितर-बितर कर दूँगा
  rationale: हिफ़ील रूप का अर्थ ‘बिखेर देना/तितर-बितर करना’ है; प्रथम पुरुष एकवचन कर्ता और तृतीय पुरुष बहुवचन कर्म को स्पष्ट रखा गया है। आरंभिक וַ को प्रसंगानुसार परिणामसूचक ‘इसलिए’ से व्यक्त किया गया है।
- source_word: כקש
  choice: भूसे की तरह
  rationale: קַשׁ सूखी पुआल, ठूँठ या भूसे जैसे अवशेष का द्योतक हो सकता है। हवा में उड़ने वाली वस्तु की इस उपमा में ‘भूसा’ सहज और बोधगम्य है।
- source_word: עובר
  choice: उड़ता जाता है
  rationale: עבר का कृदन्त शाब्दिक रूप से ‘गुज़रता हुआ’ है। हवा के संदर्भ में ‘उड़ता जाता है’ निरंतर गतिशीलता को स्वाभाविक हिन्दी में व्यक्त करता है, बिना क्रिया को पूर्णतः निष्क्रिय रूप देने के।
- source_word: לרוח
  choice: हवा के सामने
  rationale: ל यहाँ हवा के आगे या उसके रुख में बहते जाने की छवि देता है। ‘हवा के सामने’ मूल संबंध को बनाए रखता है; ‘हवा से’ भी प्रसंगगत अर्थ हो सकता है।
- source_word: מדבר
  choice: मरुभूमि
  rationale: מִדְבָּר का अर्थ निर्जन प्रदेश, जंगल या मरुस्थल हो सकता है। हवा की कठोर, शुष्क छवि के लिए ‘मरुभूमि’ उपयुक्त और गरिमापूर्ण है।
