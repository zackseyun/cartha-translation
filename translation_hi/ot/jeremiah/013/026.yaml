  edition: WLC
  text: וְ/גַם אֲנִ֛י חָשַׂ֥פְתִּי שׁוּלַ֖יִ/ךְ עַל פָּנָ֑יִ/ךְ וְ/נִרְאָ֖ה קְלוֹנֵֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/026.yaml
  text: So I myself have also lifted up your skirts over your face[c][b][a], and your shame has been seen.
translation:
  language: hi
  text: मैं स्वयं भी तुम्हारे वस्त्र के छोर तुम्हारे चेहरे पर उठा चुका हूँ,[a][b] और तुम्हारी लज्जा प्रकट हो गई है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारे वस्त्र के छोर तुम्हारे चेहरे पर उघाड़े हैं।” मूल क्रिया का अर्थ “खोलना/उघाड़ना” है; वस्त्र के इस बिंब में “उठा चुका हूँ” अधिक स्वाभाविक हिन्दी है।
    reason: lexical_alternative
  - marker: b
    text: यह जबरन अनावरण के द्वारा सार्वजनिक अपमान का बिंब है—न्याय के अधीन होने वाली दुर्दशा का भविष्यसूचक रूपक।
    reason: cultural_note
lexical_decisions:
- source_word: וְגַם
  choice: इसलिए ... भी
  rationale: संयोजक और योगसूचक कण पिछले न्याय-वचन को आगे बढ़ाते हुए बल देते हैं; आधुनिक हिन्दी में ‘इसलिए ... भी’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֲנִי
  choice: मैं स्वयं
  rationale: क्रिया में पुरुष पहले से निहित है, इसलिए स्पष्ट सर्वनाम बलाघातपूर्ण है; ‘मैं स्वयं’ परमेश्वर के अपने न्यायकारी कार्य पर बल बनाए रखता है।
- source_word: חָשַׂפְתִּי
  choice: उठा दूँगा
  rationale: मूल क्रिया का अर्थ खोलना या उघाड़ना है। वस्त्र के छोर के साथ ‘उठा दूँगा’ हिन्दी में स्वाभाविक है और जबरन अनावरण का ठोस बिंब बनाए रखता है। हिब्रू पूर्ण रूप यहाँ भविष्य के निश्चित न्याय को पूर्ण मानकर कहता है।
- source_word: שׁוּלַיִךְ
  choice: तुम्हारे वस्त्र के छोर
  rationale: शब्द वस्त्र के निचले किनारों या दामन को सूचित करता है। ‘वस्त्र के छोर’ लिंग-निरपेक्ष रूप से ठोस परिधान-बिंब को स्पष्ट रखता है।
- source_word: עַל פָּנַיִךְ
  choice: तुम्हारे मुँह पर
  rationale: עַל यहाँ स्थान-सूचक है; वस्त्र को चेहरे के ऊपर उठाने का तीखा बिंब इससे सुरक्षित रहता है।
- source_word: וְנִרְאָה
  choice: और ... दिखाई देगी
  rationale: 'निफ़अल रूप निष्क्रिय या परिणामात्मक अर्थ देता है: लज्जा प्रत्यक्ष हो जाती है। संदर्भ में निश्चित आगामी न्याय के अनुरूप भविष्यकाल स्वाभाविक है।'
- source_word: קְלוֹנֵךְ
  choice: तुम्हारी लज्जा
  rationale: यह संज्ञा सार्वजनिक अपमान और बदनामी को व्यक्त करती है; ‘लज्जा’ सामाजिक और व्यक्तिगत दोनों पहलुओं को समेटती है।
theological_decisions:
- issue: ईश्वरीय न्याय में सार्वजनिक अनावरण का रूपक
  choice: वस्त्र के छोर को मुँह पर उठाने और लज्जा दिखाई देने के ठोस बिंब को बनाए रखा गया है।
  alternative: बिंब को नरम करके केवल ‘मैं तुम्हें अपमानित करूँगा’ कहना।
  rationale: हिब्रू पाठ यरूशलेम पर न्याय को सार्वजनिक और जबरन अनावरण के तीखे रूपक द्वारा व्यक्त करता है। इसे सामान्य ‘अपमान’ में बदलना मूल की शक्ति और असहजता को घटा देता।
- issue: हिब्रू पूर्ण क्रियाओं का कालगत मूल्य
  choice: हिन्दी में निश्चित आगामी न्याय के रूप में ‘उठा दूँगा’ और ‘दिखाई देगी’।
  alternative: 'भूत/पूर्ण रूप: ‘मैंने उठा दिए हैं’ और ‘दिखाई दी है’।'
  rationale: निकटवर्ती संदर्भ भावी दंड की घोषणा है; भविष्यसूचक पूर्ण रूप घटना की निश्चितता को पूर्ण मानकर प्रस्तुत कर सकता है। हिन्दी भविष्यकाल संदर्भगत अर्थ स्पष्ट करता है, जबकि पूर्णता की भविष्यसूचक शक्ति वाक्य के दृढ़ कथन में बनी रहती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सीधे समझ में आने वाली रखी गई है। स्त्रीलिंग संबोधन मूल पाठ और यरूशलेम के मानवीकरण के अनुरूप है। ‘दामन’ की संभावित अस्पष्टता से बचते हुए ‘वस्त्र के छोर’ चुना गया है।
