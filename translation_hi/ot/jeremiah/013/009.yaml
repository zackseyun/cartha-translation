base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/009.yaml
  text: 'Thus says Yahweh: In this way I will ruin the pride of Judah and the great pride of Jerusalem[a][b].'
translation:
  language: hi
  text: याहवे यों कहता है, “इसी प्रकार मैं यहूदा के घमंड को और यरूशलेम के बहुत बड़े घमंड को बरबाद कर दूँगा[a][b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “नष्ट कर दूँगा” अथवा “बिगाड़ दूँगा।” इब्रानी क्रिया का अर्थ बरबाद करना, बिगाड़ना या नष्ट करना हो सकता है; यहाँ बिगड़े हुए कमरबंद का बिंब है।
    reason: lexical_alternative
  - marker: b
    text: “घमंड” का अनुवाद “अभिमान” भी हो सकता है; यह शब्द कभी “गौरव” या “वैभव” के अर्थ में भी आता है, यद्यपि यहाँ इसकी संभावना कम है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: כֹּה אָמַר
  choice: यों कहता है
  rationale: यह नबूवत का प्रचलित संदेशवाहक-सूत्र है; यह हिन्दी में स्वाभाविक रहते हुए उसकी औपचारिक गरिमा बनाए रखता है।
- source_word: כָּכָה
  choice: इसी प्रकार
  rationale: यह आरंभिक כֹּה से अलग, चिन्ह-कर्म में दिखाए गए ढंग की ओर संकेत करता है।
- source_word: אַשְׁחִית
  choice: बरबाद कर दूँगा
  rationale: שׁחת के हिफ़ील रूप में बिगाड़ने, नष्ट करने या अनुपयोगी कर देने का भाव हो सकता है। कमरबंद के बिगड़ जाने वाले निकटवर्ती बिंब के साथ ‘बरबाद कर दूँगा’ उपयुक्त और स्वाभाविक है।
- source_word: גְּאוֹן
  choice: घमंड
  rationale: न्याय के इस प्रसंग में नकारात्मक आत्म-अभिमान प्रमुख है, यद्यपि मूल शब्द कभी ऊँचाई, गौरव या वैभव भी व्यक्त कर सकता है।
- source_word: גְּאוֹן יְהוּדָה
  choice: यहूदा के घमंड
  rationale: सम्बन्धवाचक इब्रानी पदबंध का सीधा अनुवाद है और अगले समानांतर पदबंध से मेल रखता है।
- source_word: גְּאוֹן יְרוּשָׁלִַם הָרָב
  choice: यरूशलेम के बड़े घमंड
  rationale: הָרָב को ‘बड़े’ के रूप में रखकर घमंड की मात्रा/महानता और यहूदा के साथ समानांतरता सुरक्षित की गई है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है; ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
- issue: גְּאוֹן का नकारात्मक या सकारात्मक अर्थ
  choice: घमंड
  alternative: अभिमान; गौरव; वैभव
  rationale: आने वाले न्याय और बिगड़े हुए कमरबंद के प्रसंग में नकारात्मक अर्थ अधिक संभावित है, पर सकारात्मक ‘गौरव/वैभव’ की शब्दार्थगत संभावना पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज भविष्यद्वाणी-शैली रखी गई है। दोहराए गए ‘को’ से इब्रानी के समानांतर कर्म-पद स्पष्ट रहते हैं; उद्धरण-चिह्न प्रत्यक्ष ईश्वरीय वचन को पठनीय बनाते हैं।
