source:
  edition: WLC
  text: תְּנוּ֩ לַ/יהוָ֨ה אֱלֹהֵי/כֶ֤ם כָּבוֹד֙ בְּ/טֶ֣רֶם יַחְשִׁ֔ךְ וּ/בְ/טֶ֛רֶם יִֽתְנַגְּפ֥וּ רַגְלֵי/כֶ֖ם עַל הָ֣רֵי נָ֑שֶׁף וְ/קִוִּיתֶ֤ם לְ/אוֹר֙ וְ/שָׂמָ֣/הּ לְ/צַלְמָ֔וֶת ישית לַ/עֲרָפֶֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/016.yaml
  text: Give glory to Yahweh your God before he brings darkness[a], and before your feet stumble on the mountains at twilight. Then you will hope for light, but he will make it deep darkness; he will turn it into gloom.
translation:
  language: hi
  text: अपने परमेश्वर यहोवा की महिमा करो, इससे पहले कि वह अंधकार ले आए और इससे पहले कि साँझ के धुँधलके में पहाड़ों पर तुम्हारे पाँव ठोकर खाएँ। तब तुम उजाले की आशा करोगे, पर वह उसे घोर अंधकार बना देगा[a]; वह उसे घने अंधकार में बदल देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, पारम्परिक रूप में, “मृत्यु की छाया।” इब्रानी शब्द का अर्थ बहुत गहरा या मृत्यु-जैसा अंधकार भी हो सकता है।
    reason: צלמות के पारम्परिक और सम्भव lexical विकल्प को उसी पदबंध पर स्पष्ट करना।
lexical_decisions:
- source_word: תְּנוּ ... כָּבוֹד
  choice: महिमा करो
  rationale: शाब्दिक रूप से ‘महिमा दो’; हिन्दी में परमेश्वर के प्रति आदर और उसकी महिमा स्वीकार करने की आज्ञा के लिए ‘महिमा करो’ अधिक स्वाभाविक है और बहुवचन आज्ञार्थ का बल बनाए रखता है।
- source_word: לַיהוָה אֱלֹהֵיכֶם
  choice: अपने परमेश्वर यहोवा की
  rationale: द्वितीय पुरुष बहुवचन सम्बन्धसूचक रूप को ‘अपने परमेश्वर’ से व्यक्त किया गया है और दिव्य नाम יהוה को ‘यहोवा’ के रूप में रखा गया है।
- source_word: יַחְשִׁךְ
  choice: वह अँधेरा कर दे
  rationale: हिफ़ील रूप का कारणवाचक भाव सुरक्षित है; आगे की क्रियाओं की तरह कर्ता परमेश्वर है।
- source_word: יִתְנַגְּפוּ רַגְלֵיכֶם
  choice: तुम्हारे पाँव ठोकर खाएँ
  rationale: हित्पएल क्रिया यहाँ पाँवों के टकराने अथवा लड़खड़ाने का बोध देती है; ‘ठोकर खाएँ’ स्वाभाविक और चित्रात्मक है।
- source_word: עַל הָרֵי נָשֶׁף
  choice: साँझ के धुँधलके में पहाड़ों पर
  rationale: נשף को स्थान-नाम मानने के बजाय साँझ अथवा धुँधलके के समय के रूप में लिया गया है; हिन्दी क्रम दृश्य को स्पष्ट रखता है।
- source_word: וְקִוִּיתֶם לְאוֹר
  choice: तब तुम उजाले की आशा करोगे
  rationale: קוה में प्रतीक्षा और आशा दोनों का भाव हो सकता है; न्याय से राहत की अपेक्षा के सन्दर्भ में ‘आशा करोगे’ उपयुक्त है।
- source_word: וְשָׂמָהּ לְצַלְמָוֶת
  choice: पर वह उसे घोर अन्धकार बना देगा
  rationale: स्त्रीलिंग प्रत्यय का संकेत ‘उजाले’ की ओर अर्थगत रूप से लौटता है। צלמות को यहाँ अत्यन्त गहरे अन्धकार के अर्थ में लिया गया है; पारम्परिक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: יָשִׁית לַעֲרָפֶל
  choice: वह उसे गहरी धुंध में बदल देगा
  rationale: ערפל घने अन्धकार, कुहरे या धुंध का बोध देता है। ‘गहरी धुंध’ पिछले ‘घोर अन्धकार’ की अनावश्यक हूबहू पुनरावृत्ति से बचते हुए मूल की दूसरी अन्धकार-छवि बनाए रखती है।
theological_decisions:
- issue: आने वाले अन्धकार में परमेश्वर की सक्रिय भूमिका
  choice: परमेश्वर स्वयं न्याय के रूप में अँधेरा करता है।
  alternative: अँधेरा स्वाभाविक रूप से छा जाता है।
  rationale: יַחְשִׁךְ का हिफ़ील रूप कारणवाचक है और बाद की क्रियाओं में भी वही कर्ता बना रहता है; इसलिए दैवी न्याय की सक्रियता को अस्पष्ट नहीं किया गया।
- issue: צלמות का अर्थ
  choice: घोर अन्धकार
  alternative: मृत्यु की छाया
  rationale: इस पद में यह शब्द अत्यन्त गहरे, प्राणघातक अन्धकार का संकेत दे सकता है। मुख्य पाठ में प्रसंगानुकूल अर्थ रखा गया है और पारम्परिक, सम्भव विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय, सीधी भविष्यद्वाणी-संबन्धी चेतावनी। ‘तुम’ बहुवचन समुदाय को सम्बोधित करता है। अन्धकार, धुँधलके और ठोकर की मूल काव्यात्मक छवियाँ बनाए रखी गई हैं।
