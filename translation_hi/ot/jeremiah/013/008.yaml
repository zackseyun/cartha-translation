  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “और ऐसा हुआ, यहोवा का वचन मेरे पास आया, यह कहते हुए।”'
    reason: मूल इब्रानी की अधिक शाब्दिक वाक्य-संरचना और לֵאמֹר का स्पष्ट रूप दिखाने के लिए।
lexical_decisions:
- source_word: וַיְהִי
  choice: तब ... आया
  rationale: वाव-क्रमिक रूप कथा में अगली घटना प्रस्तुत करता है। हिन्दी में ‘तब’ घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है; ‘ऐसा हुआ’ अधिक शब्दशः विकल्प है।
- source_word: דְבַר יְהוָה
  choice: यहोवा का वचन
  rationale: यह सामान्य भविष्यद्वक्ताई सूत्र है। ‘वचन’ דָּבָר की शाब्दिक बनावट और उसके स्थापित धार्मिक अर्थ को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में प्रयुक्त परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नाम-रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: אֵלַי
  choice: मेरे पास
  rationale: इस भविष्यद्वक्ताई सूत्र में हिन्दी का स्वाभाविक प्रयोग ‘वचन मेरे पास आया’ है; अर्थ मूल के ‘मेरी ओर/मुझ तक’ के अनुरूप है।
- source_word: לֵאמֹר
  choice: इसके बाद आने वाले प्रत्यक्ष कथन को दिखाने वाला द्विबिंदु
  rationale: यह रूप अगले पद में आने वाली वाणी का परिचय देता है। हिन्दी में ‘कहते हुए’ की अपेक्षा द्विबिंदु अधिक स्वाभाविक है, जबकि उसका कार्य सुरक्षित रहता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल का व्यक्तिगत नाम बनाए रखा गया है। आधुनिक हिन्दी बाइबलीय प्रयोग में ‘यहोवा’ सामान्य पाठकों के लिए अधिक परिचित रूप है; ‘याहवे’ अधिक निकट लिप्यंतरण माना जाता है।
translation_notes:
