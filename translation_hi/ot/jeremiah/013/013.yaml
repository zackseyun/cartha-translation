source:
  edition: WLC
  text: וְ/אָמַרְתָּ֨ אֲלֵי/הֶ֜ם כֹּֽה אָמַ֣ר יְהוָ֗ה הִנְ/נִ֣י מְמַלֵּ֣א אֶת כָּל יֹשְׁבֵ֣י הָ/אָ֪רֶץ הַ/זֹּ֟את וְ/אֶת הַ/מְּלָכִ֣ים הַ/יֹּשְׁבִים֩ לְ/דָוִ֨ד עַל כִּסְא֜/וֹ וְ/אֶת הַ/כֹּהֲנִ֣ים וְ/אֶת הַ/נְּבִיאִ֗ים וְ/אֵ֛ת כָּל יֹשְׁבֵ֥י יְרוּשָׁלִָ֖ם שִׁכָּרֽוֹן־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/013.yaml
  text: 'Then you shall say to them[a], ‘Thus says Yahweh: Behold, I am about to fill all the inhabitants of this land—and the kings who sit on David’s throne, and the priests, and the prophets[b], and all the inhabitants of Jerusalem—with drunkenness.’'
translation:
  language: hi
  text: 'तब तुम उनसे कहना, “याहवे यों कहते हैं: देखो, मैं इस देश के सभी निवासियों को—दाऊद के सिंहासन पर बैठनेवाले राजाओं[a], याजकों, भविष्यवक्ताओं और यरूशलेम के सभी निवासियों को—मतवालेपन से भरने वाला हूँ।[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसे अधिक शाब्दिक रूप से “दाऊद के लिए, दाऊद के अपने सिंहासन पर बैठनेवाले राजा” भी कहा जा सकता है; यह दाऊद के राजवंश में उनके उत्तराधिकार को उभारता है।
    reason: lexical_alternative
  - marker: b
    text: “मतवालापन” संभवतः परमेश्वर द्वारा लाई गई दिशाहीनता और न्याय का रूपक है, फिर भी मूल पाठ इस चित्र को ठोस ही रहने देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: तब तुम उनसे कहना
  rationale: वाव पूर्ववर्ती कथन को आगे बढ़ाता है; ‘तब’ क्रमसूचक संबंध व्यक्त करता है और ‘कहना’ हिन्दी में निर्देश का स्वाभाविक रूप है।
- source_word: כֹּה אָמַר יְהוָה
  choice: याहवे यों कहते हैं
  rationale: यह भविष्यद्वक्ताओं का मानक संदेशवाहक सूत्र है; परमेश्वर के निज नाम יהוה को ‘याहवे’ रूप में रखा गया है।
- source_word: הִנְנִי מְמַלֵּא
  choice: देखो, मैं … भरने वाला हूँ
  rationale: הִנְנִי वक्ता की जोरदार संलग्नता की ओर ध्यान खींचता है, और कृदंत निकट या सुनिश्चित होने वाली क्रिया को व्यक्त करता है।
- source_word: כָּל יֹשְׁבֵי הָאָרֶץ הַזֹּאת
  choice: इस देश के सभी निवासी
  rationale: संदर्भ में אֶרֶץ समूची पृथ्वी नहीं, बल्कि यहूदा का देश है; יֹשְׁבֵי के लिए ‘निवासी’ सहज और सटीक है।
- source_word: הַמְּלָכִים הַיֹּשְׁבִים לְדָוִד עַל כִּסְאוֹ
  choice: दाऊद के सिंहासन पर बैठनेवाले राजा
  rationale: यह स्वाभाविक हिन्दी में दाऊदी राजवंश के उत्तराधिकारियों का अर्थ देता है; असामान्य לְדָוִד की अधिक शाब्दिक बारीकी पादटिप्पणी में सुरक्षित है।
- source_word: הַכֹּהֲנִים וְאֶת הַנְּבִיאִים
  choice: याजक और भविष्यवक्ता
  rationale: दोनों पद धार्मिक तथा भविष्यसूचक पदाधिकारियों के सामान्य नाम हैं; पाठ यह निर्धारित नहीं करता कि सभी भविष्यवक्ता सच्चे थे।
- source_word: שִׁכָּרוֹן
  choice: मतवालापन
  rationale: यह मदहोशी का ठोस बिंब बनाए रखता है और पिछले पदों के दाखमधु के पात्रों वाले चित्र से जुड़ता है; इसे केवल ‘भ्रम’ या ‘अचेतावस्था’ कहने से रूपक समय से पहले खुल जाता।
theological_decisions:
- issue: परमेश्वर के निज नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में चार अक्षरों वाला निज नाम सीधे आया है; ‘याहवे’ उसे पदवी में बदले बिना प्रस्तुत करता है।
- issue: שִׁכָּרוֹן के न्याय-संबंधी रूपक का स्वरूप
  choice: ठोस बिंब के रूप में ‘मतवालापन’ बनाए रखना
  alternative: भ्रम / स्तब्धता / मदहोशी
  rationale: संदर्भ में यह परमेश्वर द्वारा लाई जाने वाली दिशाहीनता और न्याय का रूपक हो सकता है, पर मूल कथन जानबूझकर मदहोशी के ठोस चित्र को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘यों कहते हैं’ भविष्यसूचक सूत्र की गंभीरता बनाए रखता है, जबकि वाक्य-विन्यास सामान्य हिन्दी पाठक के लिए स्वाभाविक है।
