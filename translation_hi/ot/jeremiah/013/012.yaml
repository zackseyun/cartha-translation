  text: וְ/אָמַרְתָּ֨ אֲלֵי/הֶ֜ם אֶת הַ/דָּבָ֣ר הַ/זֶּ֗ה כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל כָּל נֵ֖בֶל יִמָּ֣לֵא יָ֑יִן וְ/אָמְר֣וּ אֵלֶ֔י/ךָ הֲ/יָדֹ֨עַ֙ לֹ֣א נֵדַ֔ע כִּ֥י כָל נֵ֖בֶל יִמָּ֥לֵא יָֽיִן־ס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/012.yaml
  text: 'So you shall say to them this word: Thus says the LORD, the God of Israel, ‘Every jar will be filled with wine.’ And they will say to you, ‘Do we not certainly know that every jar will be filled with wine?’'
translation:
  language: hi
  text: 'तुम उनसे यह वचन कहना: इस्राएल का परमेश्वर यहोवा यों कहता है, ‘हर घड़ा दाखमधु से भर जाएगा।’ तब वे तुमसे कहेंगे, ‘क्या हम भली-भाँति नहीं जानते कि हर घड़ा दाखमधु से भर जाएगा?’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֵבֶל
  choice: घड़ा
  rationale: यह शब्द यहाँ दाखमधु रखने के बड़े मिट्टी के पात्र को सूचित करता है; ‘घड़ा’ आधुनिक हिन्दी में सहज और प्रसंगानुकूल है।
- source_word: יָיִן
  choice: दाखमधु
  rationale: हिब्रानी शब्द का अर्थ अंगूर से बना मद्य है; ‘दाखमधु’ गरिमापूर्ण बाइबलीय हिन्दी में इस अर्थ को स्पष्ट रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के विशिष्ट नाम को उपाधि में बदलने के बजाय नाम के रूप में प्रस्तुत किया गया है।
- source_word: הֲיָדֹעַ לֹא נֵדַע
  choice: क्या हम यह भली-भाँति नहीं जानते
  rationale: मूल की emphatic infinitive absolute construction को स्वाभाविक हिन्दी में निश्चित और कुछ व्यंग्यपूर्ण प्रत्युत्तर के रूप में व्यक्त करता है।
theological_decisions:
- issue: दाखमधु से भरने के कथन का अर्थ
  choice: कथन को बिना व्याख्यात्मक विस्तार के अक्षरशः रखा गया
  alternative: इसे इसी पद में न्याय या मतवालेपन का रूपक बताना
  rationale: इस पद में श्रोताओं को यह सामान्य कथन ही सुनाया जाता है; उसका न्यायसूचक अर्थ आगे के पदों में खुलता है, इसलिए उसे यहाँ पहले से स्पष्ट करना तनाव और क्रम को मिटा देता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘यों कहता है’ भविष्यद्वक्ताओं के सूत्रवाक्य का परिचित हिन्दी रूप है; उद्धरणों में वक्ताओं का अंतर साफ रखा गया है।
