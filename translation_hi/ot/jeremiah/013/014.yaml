base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/014.yaml
  text: And I will smash them against each other[a], man against his brother, fathers and sons together, declares Yahweh. I will not spare, nor will I pity, nor will I have compassion[b], from destroying them.
translation:
  language: hi
  text: “मैं उन्हें—हर एक को उसके भाई पर, पिताओं और पुत्रों को एक साथ—पटककर चकनाचूर कर दूँगा[a], याहवे की यह घोषणा है। मैं न बख्शूँगा, न तरस खाऊँगा, न दया करूँगा कि उनका विनाश करने से रुक जाऊँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “एक-दूसरे पर दे मारूँगा” अथवा “एक-दूसरे पर पटककर टुकड़े-टुकड़े कर दूँगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִפַּצְתִּים
  choice: मैं उन्हें…पटककर चकनाचूर कर दूँगा
  rationale: נפץ हिंसक ढंग से पटकने और तोड़ डालने का बोध देता है। संयुक्त अभिव्यक्ति क्रिया की ठोस और प्रबल छवि बनाए रखती है।
- source_word: אִישׁ אֶל אָחִיו
  choice: हर एक को उसके भाई पर
  rationale: यह वितरणात्मक एकवचन और पुरुषवाचक पारिवारिक संबंध दोनों को सुरक्षित रखता है; इसे केवल ‘एक-दूसरे पर’ कहने से संबंध की विशिष्टता खो जाती।
- source_word: וְהָאָבוֹת וְהַבָּנִים יַחְדָּו
  choice: पिता और पुत्र भी एक साथ
  rationale: इब्रानी पाठ स्पष्ट रूप से पुरुष पारिवारिक संबंधों को नाम देता है। ‘भी’ निकट संबंधियों तक न्याय पहुँचने की तीव्रता को स्वाभाविक हिन्दी में उभारता है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: स्थिर भविष्यद्वाणी-सूत्र को गरिमापूर्ण आधुनिक हिन्दी में रखा गया है और परमेश्वर के निजी नाम को ‘याहवे’ लिखा गया है।
- source_word: לֹא אֶחְמֹל
  choice: मैं उन्हें न छोड़ूँगा
  rationale: חמל इस न्याय-संदर्भ में दया के कारण किसी को विनाश से बचाने या छोड़ देने का अर्थ रखता है।
- source_word: וְלֹא אָחוּס
  choice: न उन पर तरस खाऊँगा
  rationale: חוס में तरस या दयाभाव का अर्थ है। यह अनुवाद पास-पास आए तीन समानार्थी पदों का भेद बनाए रखता है।
- source_word: וְלֹא אֲרַחֵם
  choice: और न दया करके…रुकूँगा
  rationale: רחם को ‘दया’ से व्यक्त किया गया है और अगले מִן-वाक्यांश से स्वाभाविक हिन्दी संबंध जोड़ा गया है।
- source_word: מֵהַשְׁחִיתָם
  choice: उनका विनाश करने से रुकूँगा
  rationale: מִן के साथ infinitive किसी कार्य से रुकने का भाव देता है। नकार के संदर्भ में इसका अर्थ है कि दया परमेश्वर को उनका विनाश करने से नहीं रोकेगी।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: पाठ में चार-अक्षरीय निजी नाम सीधे आया है; ‘याहवे’ उसे उपाधि में बदले बिना प्रस्तुत करता है।
- issue: पुरुषवाचक पारिवारिक भाषा
  choice: हर एक को उसके भाई पर; पिता और पुत्र
  alternative: एक को दूसरे पर; माता-पिता और बच्चे
  rationale: मूल में אָחִיו, אָבוֹת और בָּנִים जैसे स्पष्ट पुरुषवाचक संबंध-सूचक शब्द हैं। उन्हें सामान्यीकृत करने से पारिवारिक बंधनों के टूटने की मूल छवि का विवरण घट जाता।
- issue: दया और विनाश के अंतिम संबंध का अर्थ
  choice: न दया करके उनका विनाश करने से रुकूँगा
  alternative: न दया करूँगा—उनका विनाश कर दूँगा
  rationale: यह रूप מִן + infinitive के ‘कार्य से रुकने’ वाले संबंध को स्वाभाविक हिन्दी में स्पष्ट करता है, जबकि न्याय की कठोरता को कम नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पटककर चकनाचूर’ मूल क्रिया की हिंसक ठोसता व्यक्त करता है; डैश वाक्य के भविष्यद्वाणी-संबंधी प्रहार और पारिवारिक सूची को स्पष्ट बनाते हैं।
