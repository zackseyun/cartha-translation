id: JER.13.22
reference: Jeremiah 13:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/כִ֤י תֹאמְרִי֙ בִּ/לְבָבֵ֔/ךְ מַדּ֖וּעַ קְרָאֻ֣/נִי אֵ֑לֶּה בְּ/רֹ֧ב עֲוֺנֵ֛/ךְ נִגְל֥וּ שׁוּלַ֖יִ/ךְ נֶחְמְס֥וּ עֲקֵבָֽיִ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/022.yaml
  text: And if you say in your heart[a], ‘Why have these things happened to me?’—because of the greatness of your iniquity your skirts have been uncovered[b], your heels have been violated.
translation:
  language: hi
  text: और यदि तू अपने मन में कहे, “ये बातें मुझ पर क्यों आ पड़ीं?”[a]—तो तेरे अधर्म की बहुतायत के कारण तेरे वस्त्र के छोर उठा दिए गए हैं और तेरी एड़ियों के साथ दुर्व्यवहार किया गया है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ये बातें मेरे साथ क्यों हुईं?”
    reason: קְרָאֻנִי אֵלֶּה के मुहावरेदार अर्थ का अधिक सामान्य हिन्दी विकल्प।
  - marker: b
    text: “तेरी एड़ियों के साथ दुर्व्यवहार किया गया है” अपमानजनक अनावरण की छवि को आगे बढ़ाता है; इब्रानी का अर्थ अधिक सामान्य रूप से हिंसक दुर्व्यवहार भी हो सकता है।
    reason: נֶחְמְסוּ की सटीक छवि संदर्भ में कठोर है, पर कुछ हद तक अस्पष्ट बनी रहती है।
lexical_decisions:
- source_word: וְכִי
  choice: और यदि
  rationale: यह पद पिछले कथन से जुड़ते हुए एक संभावित आपत्ति या प्रश्न प्रस्तुत करता है; ‘और यदि’ शर्त और प्रवाह दोनों बनाए रखता है।
- source_word: תֹאמְרִי בִּלְבָבֵךְ
  choice: तू अपने मन में कहे
  rationale: यह इब्रानी के आंतरिक कथन वाले मुहावरे को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है। स्त्रीलिंग एकवचन संबोधन भी ‘तू’ और ‘कहे’ से सुरक्षित है।
- source_word: קְרָאֻנִי אֵלֶּה
  choice: ये बातें मुझ पर आ पड़ीं
  rationale: इस रचना में क्रिया का भाव विपत्तियों के किसी पर आ पड़ने का है। यह हिन्दी में स्वाभाविक है और केवल सामान्यतः ‘घटने’ की अपेक्षा संकट के भाव को अधिक स्पष्ट रखता है।
- source_word: בְּרֹב עֲוֺנֵךְ
  choice: तेरे अधर्म की अधिकता के कारण
  rationale: רֹב की मात्रा/बहुलता और עָוֹן के नैतिक भार दोनों को व्यक्त करता है; בְּ यहाँ कारण बताता है।
- source_word: נִגְלוּ שׁוּלַיִךְ
  choice: तेरे वस्त्र के छोर उठा दिए गए हैं
  rationale: שׁוּלַיִם वस्त्र के निचले छोरों को सूचित करता है। हिन्दी में यह अनावश्यक रूप से किसी आधुनिक विशिष्ट परिधान का नाम लिए बिना अपमानजनक अनावरण की छवि बनाए रखता है।
- source_word: נֶחְמְסוּ עֲקֵבָיִךְ
  choice: तेरी एड़ियों के साथ हिंसा की गई है
  rationale: निफ़अल रूप हिंसक दुर्व्यवहार या उल्लंघन का भाव देता है। यह अनावरण और अपमान की कठोर छवि को बनाए रखता है, पर किसी ऐसे विशिष्ट यौन कृत्य को नहीं जोड़ता जिसे इब्रानी स्पष्ट नहीं करता।
theological_decisions:
- issue: न्याय के रूप में अपमानजनक और संभवतः यौन-संकेतयुक्त अनावरण की भविष्यद्वाणी-संबंधी छवि
  choice: वस्त्र उठाए जाने और एड़ियों के साथ हिंसा की छवि को स्पष्ट किंतु अनिर्दिष्ट रखा गया है।
  alternative: इसे केवल ‘तेरी नग्नता प्रकट हुई’ कहना, या इसे किसी विशिष्ट यौन आक्रमण के रूप में अधिक स्पष्ट करना।
  rationale: मूल पाठ सार्वजनिक अपमान और हिंसक दुर्व्यवहार की गंभीर छवि देता है, पर उसके सटीक स्वरूप को पूर्णतः परिभाषित नहीं करता। अनुवाद उसी तनाव और अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सुबोध हिन्दी; यरूशलेम को स्त्रीलिंग एकवचन संबोधन के कारण ‘तू/तेरे/तेरी’ रखा गया है। शैली भविष्यद्वाणी की कठोरता और सार्वजनिक अपमान की छवि बनाए रखती है, बिना अनावश्यक व्याख्यात्मक विस्तार के।
