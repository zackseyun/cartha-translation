review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the conditional rhetorical question, the causal force of 'because of,' the feminine singular address, and the severe but not fully specified imagery of exposure and violent wronging. 'एड़ियों के साथ हिंसा की गई है' is understandable but is syntactically unnatural Hindi and weakly renders the passive sense of נֶחְמְסוּ.
  naturalness: The register is appropriately dignified. Replacing the awkward instrumental-style expression 'एड़ियों के साथ हिंसा' with 'एड़ियों के साथ दुर्व्यवहार' makes the final clause more idiomatic while preserving its ambiguity. 'बहुतायत' is a more natural elevated rendering of the quantity expressed by רֹב than 'अधिकता' here.
  terminology: ‘अधर्म’ suitably conveys עָוֹן in this prophetic context. ‘वस्त्र के छोर’ preserves the garment imagery without imposing a specific item of clothing. The revised final clause avoids specifying sexual assault while retaining the force of violent mistreatment.
  issues:
  - severity: medium
    issue: The wording 'तेरी एड़ियों के साथ हिंसा की गई है' is unnatural in modern standard Hindi.
    rationale: Hindi normally uses 'दुर्व्यवहार किया गया है' or a comparable passive construction with body parts in this context. The revision preserves the Hebrew's difficult, violent, and somewhat indeterminate imagery rather than supplying a more specific act.
  - severity: low
    issue: ‘अधर्म की अधिकता’ is less idiomatic than an elevated modern Hindi expression for abundance.
    rationale: ‘तेरे अधर्म की बहुतायत’ retains the quantitative and moral force of בְּרֹב עֲוֺנֵךְ with smoother biblical Hindi.
