  edition: WLC
  text: הֲ/יַהֲפֹ֤ךְ כּוּשִׁי֙ עוֹר֔/וֹ וְ/נָמֵ֖ר חֲבַרְבֻּרֹתָ֑י/ו גַּם אַתֶּם֙ תּוּכְל֣וּ לְ/הֵיטִ֔יב לִמֻּדֵ֖י הָרֵֽעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/023.yaml
  text: Can a Cushite change his skin[b][a], or a leopard its spots? Then you also can do good—you who are trained in evil.
translation:
  language: hi
  text: क्या कूशी[a] अपनी त्वचा बदल सकता है, या तेंदुआ अपने धब्बे? तब तुम भी भलाई कर सकोगे—तुम, जो बुराई करने के अभ्यस्त[b] हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘इथियोपियाई’। इब्रानी में ‘कूशी’ है, अर्थात कूश देश का व्यक्ति।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘बुराई में सिखाए/प्रशिक्षित’; भाव यह है कि वे बुराई करने के अभ्यस्त या उसमें प्रशिक्षित हो चुके हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: כּוּשִׁי
  choice: कूशी
  rationale: इब्रानी जातिनाम को सीधे रखा गया है; ‘इथियोपियाई’ बाद की भौगोलिक पहचान को पाठ में ले आएगा।
- source_word: הֲיַהֲפֹךְ
  choice: क्या ... बदल सकता है
  rationale: अलंकारिक प्रश्न में किसी स्वाभाविक दशा को बदलने की असम्भवता को सहज हिन्दी में व्यक्त करता है।
- source_word: עוֹרוֹ
  choice: अपनी त्वचा
  rationale: मानव शरीर के संदर्भ में इब्रानी शब्द का स्वाभाविक और स्पष्ट हिन्दी समतुल्य।
- source_word: נָמֵר
  choice: तेंदुआ
  rationale: इस पशु के लिए मानक हिन्दी शब्द।
- source_word: חֲבַרְבֻּרֹתָיו
  choice: अपने धब्बे
  rationale: तेंदुए के विशिष्ट चिह्नों को सटीक और प्रचलित ढंग से व्यक्त करता है।
- source_word: גַּם אַתֶּם תּוּכְלוּ
  choice: तब तुम भी ... कर सकोगे
  rationale: पहले दो असम्भव परिवर्तनों और यहूदा की नैतिक दशा के बीच निहित शर्त तथा विडम्बना को बनाए रखता है।
- source_word: לְהֵיטִיב
  choice: भलाई करना
  rationale: अच्छा या उचित काम करने के अर्थ को संक्षिप्त, स्वाभाविक हिन्दी में देता है।
- source_word: לִמֻּדֵי הָרֵעַ
  choice: बुराई करने के अभ्यस्त
  rationale: रूप का अर्थ अभ्यास के द्वारा बुराई में ढल जाने या प्रशिक्षित हो जाने का है; ‘अभ्यस्त’ हिन्दी में इस जड़ जमा चुकी आदत को स्पष्ट करता है।
theological_decisions:
- issue: अलंकारिक तुलना द्वारा व्यक्त नैतिक असमर्थता
  choice: पद यहूदा के लोगों की बुराई में जड़ जमा चुकी आदत को लगभग असम्भव परिवर्तन की तुलना से व्यक्त करता है।
  alternative: इसे हर मनुष्य की हर प्रकार की पूर्ण असमर्थता पर सार्वभौमिक धर्मसैद्धान्तिक कथन मानना, या इसे नैतिक असमर्थता के वास्तविक संकेत से रहित केवल अतिशयोक्ति मानना।
  rationale: इब्रानी पाठ स्थिर शारीरिक लक्षणों को बदलने की असम्भवता की तुलना गहरे अभ्यास से बनी नैतिक दशा से करता है। अनुवाद इस तीव्रता को रखता है, पर पद के तात्कालिक प्रसंग से आगे कोई व्यवस्थित धर्मसिद्धान्त नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और मौखिक पठन के अनुकूल है। अलंकारिक प्रश्न और उसके निष्कर्ष की विडम्बना सुरक्षित रखी गई है।
