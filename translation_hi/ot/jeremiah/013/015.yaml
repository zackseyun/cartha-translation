  text: שִׁמְע֥וּ וְ/הַאֲזִ֖ינוּ אַל תִּגְבָּ֑הוּ כִּ֥י יְהוָ֖ה דִּבֵּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/015.yaml
  text: Hear and listen; do not be proud[a], for Yahweh has spoken.
translation:
  language: hi
  text: सुनो और ध्यान से सुनो; घमंड न करो[a], क्योंकि याहवे ने कहा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अभिमानी न बनो’ अथवा ‘अपने आपको ऊँचा न उठाओ।’ इब्रानी क्रिया अहंकार के अर्थ में ऊँचा होने को व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: सुनो
  rationale: बहुवचन आज्ञार्थक रूप है। पहले आदेश को सीधे ‘सुनो’ कहना इब्रानी की दोहरी अभिव्यक्ति को बनाए रखता है।
- source_word: וְהַאֲזִינוּ
  choice: और ध्यान से सुनो
  rationale: हिफ़ील आज्ञार्थक रूप ध्यान लगाकर सुनने का भाव देता है। यह पहले ‘सुनो’ को दोहराते हुए उसकी तीव्रता भी स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אַל
  choice: न करो
  rationale: निषेधात्मक आदेश का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: תִּגְבָּהוּ
  choice: घमण्ड न करो
  rationale: मूल क्रिया का शाब्दिक भाव ‘ऊँचा होना’ है, पर यहाँ नैतिक अर्थ में अभिमान या अहंकार करना अभिप्रेत है। ‘घमण्ड न करो’ आधुनिक हिन्दी में स्पष्ट और सहज है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह निषेध का कारण प्रस्तुत करता है; ‘क्योंकि’ इस संबंध को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नाम-रूप ‘यहोवा’ द्वारा प्रस्तुत किया गया है।
- source_word: דִּבֵּר
  choice: ने कहा है
  rationale: पिएल पूर्ण रूप एक सम्पन्न कथन को वर्तमान प्रासंगिकता सहित व्यक्त करता है। हिन्दी में ‘ने कहा है’ प्राकृतिक है और भविष्यद्वाणी की घोषणा के अनुकूल है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: पाठ में चार-अक्षरीय दिव्य नाम प्रत्यक्ष रूप से है। हिन्दी पाठकों के लिए परिचित व्यक्तिगत नाम ‘यहोवा’ रखा गया है, न कि उसे ‘प्रभु’ जैसी उपाधि से बदला गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक घोषणा के योग्य रखी गई है। ‘सुनो और ध्यान से सुनो’ मूल के निकटार्थक दो आज्ञार्थकों की अलंकारिक पुनरुक्ति को स्पष्ट हिन्दी में सुरक्षित रखता है।
