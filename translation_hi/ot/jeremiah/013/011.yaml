source:
  edition: WLC
  text: כִּ֡י כַּ/אֲשֶׁר֩ יִדְבַּ֨ק הָ/אֵז֜וֹר אֶל מָתְנֵי אִ֗ישׁ כֵּ֣ן הִדְבַּ֣קְתִּי אֵ֠לַ/י אֶת כָּל בֵּ֨ית יִשְׂרָאֵ֜ל וְ/אֶת כָּל בֵּ֤ית יְהוּדָה֙ נְאֻם יְהוָ֔ה לִֽ/הְי֥וֹת לִ/י֙ לְ/עָ֔ם וּ/לְ/שֵׁ֥ם וְ/לִ/תְהִלָּ֖ה וּ/לְ/תִפְאָ֑רֶת וְ/לֹ֖א שָׁמֵֽעוּ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/011.yaml
  text: For as the waistband clings to a man's waist[a], so I made the whole house of Israel and the whole house of Judah cling to me, declares Yahweh, to be for me a people, a name, a praise, and a glory[c][b], but they did not listen.
translation:
  language: hi
  text: क्योंकि जैसे कमरबंद[a] किसी आदमी की कमर से चिपका रहता है, वैसे ही मैंने इस्राएल के पूरे घराने और यहूदा के पूरे घराने को अपने से चिपका लिया था—याहवे की यह घोषणा है—ताकि वे मेरे लिए एक प्रजा, एक नाम[b], प्रशंसा और गौरव हों; पर उन्होंने मेरी बात नहीं सुनी[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘कमरबंद’ के लिए मूल शब्द का अनुवाद ‘पेटी’, ‘पटुका’ या संभवतः ‘लंगोटी’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘नाम’; यहाँ इसका आशय प्रतिष्ठा या कीर्ति से हो सकता है।
    reason: idiom_clarification
  - marker: c
    text: ‘मेरी बात नहीं सुनी’ में ‘ध्यान नहीं दिया’ या ‘आज्ञा नहीं मानी’ का भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵזוֹר
  choice: कमरबंद
  rationale: यह वस्त्र कमर पर पहना जाता है। ‘कमरबंद’ ठोस बिंब को बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है, जबकि अधिक विशिष्ट अर्थ ‘लंगोटी’ यहाँ निश्चित नहीं है।
- source_word: יִדְבַּק / הִדְבַּקְתִּי
  choice: लगा रहता है / अपने से लगा लिया था
  rationale: דבק शारीरिक रूप से लगे रहने और निकट संबंध, दोनों का भाव दे सकता है। हिन्दी में यही क्रिया उपमा और उसके वाचा-संबंधी प्रयोग दोनों को जोड़ती है; हिफ़ील रूप का कारक भाव ‘लगा लिया’ से व्यक्त हुआ है।
- source_word: מָתְנֵי אִישׁ
  choice: किसी आदमी की कमर
  rationale: מָתְנַיִם का यहाँ स्वाभाविक आधुनिक हिन्दी रूप ‘कमर’ है। אִישׁ के प्रतिनिधिक एकवचन पुल्लिंग को ‘किसी आदमी’ से स्पष्ट रखा गया है।
- source_word: כָּל בֵּית יִשְׂרָאֵל וְאֶת כָּל בֵּית יְהוּדָה
  choice: इस्राएल के पूरे घराने और यहूदा के पूरे घराने
  rationale: ‘घराना’ सामूहिक और पारिवारिक वाचा-भाषा को बनाए रखता है; ‘पूरा’ כָּל का स्वाभाविक हिन्दी रूप है।
- source_word: נְאֻם יְהוָה
  choice: याहवे की यह घोषणा है
  rationale: नबी की गंभीर उद्घोषणा और मूल पाठ में आए परमेश्वर के व्यक्तिगत नाम, दोनों को प्रत्यक्ष रूप से सुरक्षित रखा गया है।
- source_word: לִהְיוֹת לִי לְעָם
  choice: ताकि वे मेरे लिए एक प्रजा ... बनें
  rationale: उद्देश्यवाचक रचना तथा परमेश्वर से संबंधित प्रजा होने का भाव सुरक्षित है; इसे केवल ‘मेरी प्रजा’ बनाकर संक्षिप्त नहीं किया गया।
- source_word: לְשֵׁם
  choice: कीर्ति
  rationale: שֵׁם का शाब्दिक अर्थ ‘नाम’ है, पर इस उद्देश्यसूची में वह प्रतिष्ठा या कीर्ति का मुहावरेदार भाव रखता है। मुख्य पाठ में अर्थ स्पष्ट किया गया और शाब्दिक रूप पादटिप्पणी में रखा गया है।
- source_word: לִתְהִלָּה
  choice: प्रशंसा
  rationale: यह चुनाव संज्ञात्मक समानांतर क्रम को बनाए रखते हुए תְּהִלָּה का सीधा अर्थ देता है।
- source_word: לְתִפְאָרֶת
  choice: गौरव
  rationale: תִּפְאֶרֶת में शोभा, वैभव और गौरव के अर्थ संभव हैं। ‘गौरव’ इस वाचा-संबंधी उद्देश्यसूची में स्वाभाविक है और अर्थक्षेत्र को अत्यधिक संकीर्ण नहीं करता।
- source_word: וְלֹא שָׁמֵעוּ
  choice: पर उन्होंने मेरी नहीं सुनी
  rationale: שׁמע सुनने, ध्यान देने और आज्ञा मानने तक का भाव रख सकता है। ‘मेरी नहीं सुनी’ हिन्दी में सुनने और न मानने दोनों की प्रतिध्वनि बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का रूप
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम प्रत्यक्ष है। ‘याहवे’ उसे उपाधि में बदले बिना प्रस्तुत करता है।
- issue: द्विपक्षीय सामूहिक संबोधन
  choice: इस्राएल के पूरे घराने और यहूदा के पूरे घराने
  alternative: समस्त इस्राएल और समस्त यहूदा
  rationale: दोनों घरानों का पृथक उल्लेख और ‘घर’ की वाचा-संबंधी सामूहिक छवि मूल पाठ के अनुसार रखी गई है।
- issue: वाचा के उद्देश्य की चार-संज्ञात्मक शृंखला
  choice: मेरे लिए एक प्रजा, कीर्ति, प्रशंसा और गौरव
  alternative: मेरी प्रजा, मेरा नाम, मेरी प्रशंसा और मेरी महिमा
  rationale: यह रूप לִי तथा लगातार आए לְ उपसर्गों की उद्देश्य/संबंध-सूचक संरचना को बनाए रखता है और प्रत्येक पद में ऐसे स्वामित्ववाचक सर्वनाम नहीं जोड़ता जो इब्रानी में अलग से नहीं हैं।
- issue: שׁמע में सुनने और आज्ञापालन का तनाव
  choice: उन्होंने मेरी नहीं सुनी
  alternative: उन्होंने मेरी आज्ञा नहीं मानी
  rationale: मुख्य पाठ सुनने की मूल छवि को सुरक्षित रखता है, जबकि हिन्दी मुहावरा अवज्ञा का आशय भी दे सकता है; स्पष्ट वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘घराना’, ‘प्रजा’ और उद्घोषणा-सूत्र भविष्यद्वाणी तथा वाचा के औपचारिक स्वर को बनाए रखते हैं। डैश केवल नबी-सूत्र को वाक्य के भीतर स्पष्ट करने के लिए प्रयुक्त हैं; अंतिम विरोध ‘पर’ से सीधा रखा गया है।
