id: JER.13.18
reference: Jeremiah 13:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אֱמֹ֥ר לַ/מֶּ֛לֶךְ וְ/לַ/גְּבִירָ֖ה הַשְׁפִּ֣ילוּ שֵׁ֑בוּ כִּ֤י יָרַד֙ מַרְאֲשׁ֣וֹתֵי/כֶ֔ם עֲטֶ֖רֶת תִּֽפְאַרְתְּ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/018.yaml
  text: Say to the king and to the queen mother[a], ‘Humble yourselves; sit down[b], for your glorious crown has come down from your heads.’
translation:
  language: hi
  text: राजा और राजमाता[a] से कह, “अपने आप को नीचा करो और बैठ जाओ, क्योंकि तुम्हारा शोभायमान मुकुट[b] तुम्हारे सिरों से उतर गया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी גְּבִירָה एक राजकीय उपाधि है, जो केवल राजा की पत्नी नहीं, बल्कि विशेष रूप से राजा की माता को भी सूचित कर सकती है।
    reason: cultural_note
  - marker: b
    text: अधिक शाब्दिक रूप में, “तुम्हारी शोभा का मुकुट।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֹר
  choice: कह
  rationale: यह אמר का एकवचन आज्ञार्थक रूप है और भविष्यद्वक्ता को राजघराने के लिए संदेश सुनाने का आदेश देता है।
- source_word: לַמֶּלֶךְ
  choice: राजा से
  rationale: संज्ञा निश्चित एकवचन में है और तत्कालीन शासक राजा को संबोधित करती है।
- source_word: וְלַגְּבִירָה
  choice: और राजमाता से
  rationale: राजदरबार के संदर्भ में גְּבִירָה किसी उच्चपदस्थ राजस्त्री, विशेषकर राजा की माता की उपाधि हो सकती है; आधुनिक हिन्दी में ‘राजमाता’ इस पद को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הַשְׁפִּילוּ
  choice: अपने आप को नीचा करो
  rationale: שׁפל के हिफ़ील बहुवचन आज्ञार्थक में नीचे होने और ऊँचा पद छोड़ने, दोनों की छवि है; यह चयन शारीरिक और सामाजिक अवनति की संयुक्त ध्वनि बनाए रखता है।
- source_word: שֵׁבוּ
  choice: बैठ जाओ
  rationale: ישׁב का बहुवचन आज्ञार्थक रूप है; पहले आदेश के साथ मिलकर ऊँचे स्थान से नीचे बैठने का भाव देता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले आदेशों का कारण प्रस्तुत करता है।
- source_word: יָרַד
  choice: उतर गया है
  rationale: ירד का मूल अर्थ नीचे जाना या उतरना है। ‘उतर गया है’ मुकुट के नीचे आने की छवि बचाता है और यह अनावश्यक रूप से तय नहीं करता कि वह गिरा या उतारा गया।
- source_word: מַרְאֲשׁוֹתֵיכֶם
  choice: तुम्हारे सिरों से
  rationale: शब्द कभी सिरहाने या सिर की ओर के स्थान को दर्शाता है, पर मुकुट के साथ यहाँ स्वाभाविक आशय उन सिरों से है जिन पर वह रखा था; बहुवचन को बनाए रखा गया है।
- source_word: עֲטֶרֶת תִּפְאַרְתְּכֶם
  choice: तुम्हारा शोभायमान मुकुट
  rationale: इस रचना का अधिक शाब्दिक अर्थ ‘तुम्हारी शोभा का मुकुट’ है। ‘शोभायमान मुकुट’ वर्तमान हिन्दी में सहज है और वैभव तथा राजकीय सम्मान का भाव रखता है।
