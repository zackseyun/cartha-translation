  edition: WLC
  text: שאי עֵֽינֵי/כֶם֙ ו/ראי הַ/בָּאִ֖ים מִ/צָּפ֑וֹן אַיֵּ֗ה הָ/עֵ֨דֶר֙ נִתַּן לָ֔/ךְ צֹ֖אן תִּפְאַרְתֵּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/020.yaml
  text: Lift up your eyes and see those who are coming from the north. Where is the flock that was given to you[a], your beautiful sheep?
translation:
  language: hi
  text: अपनी आँखें उठाकर उत्तर से आने वालों को देखो। वह झुंड कहाँ है जो तुम्हें दिया गया था—तुम्हारी सुंदर भेड़ें[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हारी शोभायुक्त भेड़ें” अथवा “तुम्हारी महिमामय भेड़ें।” इब्रानी शब्द सुंदरता, शोभा या महिमा का भाव दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שאי עֵינֵיכֶם וראי
  choice: अपनी आँखें उठाकर ... देखो
  rationale: आँखें उठाने की इब्रानी छवि को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक आज्ञार्थक अभिव्यक्ति दी गई है। इब्रानी में आज्ञाएँ स्त्रीलिंग एकवचन हैं, जबकि ‘तुम्हारी आँखें’ का प्रत्यय बहुवचन है; हिन्दी का ‘देखो’ इस असंगति को कृत्रिम रूप से सुलझाए बिना सामूहिक संबोधन के लिए स्वाभाविक रहता है।
- source_word: הַבָּאִים מִצָּפוֹן
  choice: उत्तर से आनेवालों को
  rationale: कृदन्त की जारी/निकट आती हुई क्रिया और उत्तर दिशा—दोनों को सीधे रखा गया है; आक्रमणकारियों की पहचान पाठ में जोड़कर स्पष्ट नहीं की गई।
- source_word: הָעֵדֶר נִתַּן לָךְ
  choice: वह झुंड ... जो तुम्हें सौंपा गया था
  rationale: निष्क्रिय क्रिया ‘दिया गया’ यहाँ देखभाल के लिए दिए जाने का भाव रख सकती है; ‘सौंपा गया’ आधुनिक हिन्दी में उस भाव को स्वाभाविक ढंग से व्यक्त करता है और कर्ता को अनकहा ही रहने देता है।
- source_word: צֹאן תִּפְאַרְתֵּךְ
  choice: तुम्हारी सुंदर भेड़ें
  rationale: צֹאן को ‘भेड़ें’ कहा गया है ताकि पहले आए עֵדֶר (‘झुंड’) से भेद और समानाधिकरण बना रहे। תפארת के सौंदर्य/शोभा के अर्थ को सहज हिन्दी में ‘सुंदर’ से व्यक्त किया गया है; ‘शोभा’ और ‘महिमा’ की वैकल्पिक छटा पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: झुंड का रूपकात्मक संकेत
  choice: मुख्य पाठ में चरवाही का रूपक ज्यों का त्यों रखा गया है।
  alternative: इसे स्पष्ट रूप से यहूदा/यरूशलेम की प्रजा या राजकीय प्रजा कहना।
  rationale: इब्रानी पद स्वयं झुंड की पहचान नहीं खोलता। उसे स्पष्ट कर देना पद की आलंकारिक और आरोपात्मक शक्ति को संकीर्ण कर देता।
- issue: यरूशलेम से संबोधन में वचन और लिंग
  choice: हिन्दी में ‘तुम्हें’ और ‘देखो’ के द्वारा संबोधन रखा गया है, बिना किसी नाम को जोड़ने के।
  alternative: ‘हे यरूशलेम’ जोड़ना या केवल स्त्रीलिंग एकवचन को स्पष्ट करने वाला रूप गढ़ना।
  rationale: मूल में स्त्रीलिंग एकवचन आज्ञाओं के साथ द्वितीय पुरुष बहुवचन प्रत्यय आता है। अनुवाद ने न तो पाठ-संशोधन किया है, न संबोधित पात्र का नाम पद में जोड़ा है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘आनेवालों’ में सहभागिता-सूचक रूप बना रहता है, और डैश अंतिम पदबंध को ‘झुंड’ की व्याख्यात्मक समानाधिकरण के रूप में स्पष्ट करता है।
