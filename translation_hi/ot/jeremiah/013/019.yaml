base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/019.yaml
  text: The cities of the Negev are shut up[a], with no one to open them; all Judah has been carried away into exile[c][b], wholly carried away into exile.
translation:
  language: hi
  text: नेगेव के नगर बंद कर दिए गए हैं[a], और उन्हें खोलने वाला कोई नहीं है। समूचा यहूदा निर्वासन में ले जाया गया है—पूरी तरह निर्वासन में ले जाया गया है[b][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दक्षिणी प्रदेश के नगर।” “नेगेव” विशेष रूप से यहूदा के दक्षिणी भूभाग का नाम हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “यहूदा निर्वासन में ले जाया गया, पूरा का पूरा; पूरी तरह निर्वासन में ले जाया गया।”
    reason: lexical_alternative
  - marker: c
    text: संभवतः “शांति से निर्वासन में ले जाया गया”; पर इस संदर्भ में शांतिपूर्ण ढंग की अपेक्षा संपूर्णता पर बल होने की अधिक संभावना है।
    reason: alternative_reading
lexical_decisions:
- source_word: עָרֵי הַנֶּגֶב
  choice: नेगेव के नगर
  rationale: נֶגֶב यहाँ यहूदा के दक्षिणी, शुष्क भूभाग का भौगोलिक नाम हो सकता है; ‘नेगेव’ उस विशिष्टता को बनाए रखता है, जबकि पादटिप्पणी सामान्य अर्थ ‘दक्षिणी प्रदेश’ बताती है।
- source_word: סֻגְּרוּ
  choice: बन्द कर दिए गए हैं
  rationale: निष्क्रिय पूर्ण क्रिया नगरों को बन्द कर दिए जाने और उसके परिणामस्वरूप बनी वर्तमान अवस्था—दोनों को व्यक्त करती है।
- source_word: וְאֵין פֹּתֵחַ
  choice: और उन्हें खोलनेवाला कोई नहीं है
  rationale: यह अनुपलब्ध कर्ता को स्वाभाविक हिन्दी में व्यक्त करता है और ‘खोलने’ की मूल छवि बनाए रखता है।
- source_word: הָגְלָת
  choice: निर्वासन में ले जाया गया है
  rationale: 'गלה का होफ़ाल रूप बाध्यकारी निष्क्रियता दर्शाता है: यहूदा स्वेच्छा से नहीं गया, उसे निर्वासित किया गया।'
- source_word: יְהוּדָה כֻּלָּהּ
  choice: समूचा यहूदा
  rationale: כֻּלָּהּ की व्यापकता और बल को संक्षिप्त, स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: הָגְלָת שְׁלוֹמִים
  choice: पूरी तरह निर्वासन में ले जाया गया है
  rationale: सन्दर्भ में שְׁלוֹמִים को पूर्णता बतानेवाले क्रियाविशेषणीय प्रयोग के रूप में लिया गया है; दोहराव न्याय की सम्पूर्णता पर बल देता है।
theological_decisions:
- issue: निर्वासन-सूत्र में שְׁלוֹמִים का अर्थ
  choice: 'पूर्णता: ‘पूरी तरह’'
  alternative: ‘शान्ति से’ या ‘कुशलपूर्वक’
  rationale: כֻּלָּהּ के साथ समानान्तरता और निर्वासन की पुनरुक्ति सम्पूर्णता पर बल देती है। फिर भी ‘शान्ति से’ का शाब्दिक रूप से सम्भव अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज रूप अपनाया गया है। ‘नेगेव’ को भौगोलिक नाम के रूप में रखा गया है; ‘निर्वासन में ले जाया गया’ बलपूर्वक देश-निकाले की निष्क्रिय क्रिया को स्पष्ट करता है। मूल की emphatic पुनरुक्ति को डैश के साथ बनाए रखा गया है।
