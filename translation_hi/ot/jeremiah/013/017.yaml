source:
  edition: WLC
  text: וְ/אִם֙ לֹ֣א תִשְׁמָע֔וּ/הָ בְּ/מִסְתָּרִ֥ים תִּבְכֶּֽה נַפְשִׁ֖/י מִ/פְּנֵ֣י גֵוָ֑ה וְ/דָמֹ֨עַ תִּדְמַ֜ע וְ/תֵרַ֤ד עֵינִ/י֙ דִּמְעָ֔ה כִּ֥י נִשְׁבָּ֖ה עֵ֥דֶר יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/017.yaml
  text: But if you will not listen[a], my soul will weep in secret because of pride; my eyes will weep bitterly and run down with tears[e][d][c][b], because the flock of Yahweh has been taken captive.
translation:
  language: hi
  text: पर यदि तुम यह बात न सुनोगे[a], तो मेरा प्राण छिपे स्थानों में[b] घमंड के कारण[c] रोएगा; मेरी आँखें फूट-फूटकर रोएँगी[d] और उनसे आँसू बह निकलेंगे, क्योंकि याहवे का झुंड[e] बंदी बना लिया गया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यदि तुम इसे न सुनोगे” अथवा “यदि तुम इसकी बात न मानोगे”; इब्रानी क्रिया में सुनने और ध्यान देकर मानने, दोनों का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद “गुप्त स्थानों में” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या “अहंकार के कारण।”
    reason: lexical_alternative
  - marker: d
    text: इब्रानी में क्रिया पर विशेष बल है; शाब्दिक भाव है, “रोते हुए खूब रोएँगी।”
    reason: lexical_alternative
  - marker: e
    text: 'परंपरागत अनुवाद: “प्रभु का झुंड।” मूल इब्रानी में परमेश्वर का निजी नाम याहवे है।'
    reason: translation_tradition
lexical_decisions:
- source_word: תִשְׁמָעוּהָ
  choice: तुम यह बात न सुनोगे
  rationale: שׁמע में सुनने, ध्यान देने और मानने—तीनों का भाव हो सकता है। स्त्रीलिंग एकवचन कर्म-प्रत्यय को निकटवर्ती भविष्यवाणी अथवा चेतावनी की ओर संकेत मानते हुए ‘यह बात’ कहा गया है, पर पादटिप्पणी में अर्थ-व्याप्ति सुरक्षित रखी गई है।
- source_word: בְּמִסְתָּרִים
  choice: छिपे स्थानों में
  rationale: इब्रानी बहुवचन का स्थानगत और काव्यात्मक चित्र सीधे रखा गया है; इसका आशय लोगों की दृष्टि से दूर, गुप्त रूप से शोक करना है।
- source_word: תִּבְכֶּה נַפְשִׁי
  choice: मेरा प्राण ... रोएगा
  rationale: נפשׁ को केवल ‘मैं’ में समतल करने के बजाय ‘मेरा प्राण’ रखा गया है, ताकि वक्ता की भीतरी पीड़ा और मूल का व्यक्तिकरण बना रहे।
- source_word: מִפְּנֵי גֵוָה
  choice: घमंड के कारण
  rationale: यहाँ מן־פני कारण व्यक्त करता है और גֵוָה घमंड या अहंकार को सूचित करता है। ‘घमंड’ सामान्य आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: וְדָמֹעַ תִּדְמַע
  choice: फूट-फूटकर रोएँगी
  rationale: क्रिया के साथ infinitive absolute रोने की तीव्रता को बढ़ाता है। हिन्दी का ‘फूट-फूटकर’ इस बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְתֵרַד עֵינִי דִּמְעָה
  choice: मेरी आँखें ... और उनसे आँसू बह निकलेंगे
  rationale: इब्रानी में काव्यात्मक एकवचन ‘मेरी आँख’ है; हिन्दी में बहुवचन अधिक स्वाभाविक है। ‘आँसू बह निकलेंगे’ नीचे बहने के सजीव बिंब को बनाए रखता है।
- source_word: נִשְׁבָּה
  choice: बंदी बना लिया गया है
  rationale: שׁבה के निफ़अल रूप का अर्थ पकड़ा जाना अथवा बंदी बनाया जाना है। यह निर्वासन जैसी अधिक व्यापक धारणा जोड़े बिना मूल अर्थ देता है।
- source_word: עֵדֶר יְהוָה
  choice: याहवे का झुंड
  rationale: सम्बन्धसूचक रचना परमेश्वर के लोगों को याहवे के अपने झुंड के रूप में प्रस्तुत करती है; चरवाहे और झुंड का रूपक सुरक्षित रखा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले दिव्य नाम को उपाधि से बदलने के बजाय उसके प्रचलित लिप्यंतरण ‘याहवे’ से व्यक्त किया गया है।
theological_decisions:
- issue: תִשְׁמָעוּהָ के स्त्रीलिंग प्रत्यय का संदर्भ
  choice: इसे अभी कही गई भविष्यवाणी, बात या चेतावनी की ओर संकेत माना गया है।
  alternative: यह चेतावनी को सामान्य रूप से सूचित कर सकता है; अथवा अनुवाद में कर्म को अव्यक्त छोड़कर केवल ‘न सुनोगे’ कहा जा सकता है।
  rationale: मूल में कर्म-प्रत्यय उपस्थित है। ‘यह बात’ उसे हिन्दी में व्यक्त करता है, पर किसी विशेष संज्ञा को कठोरता से निर्धारित नहीं करता।
- issue: विलाप की वाणी
  choice: पहले पुरुष का वक्ता यिर्मयाह है, जो आने वाली बंदी अवस्था पर अपना शोक प्रकट करता है।
  alternative: भविष्यद्वक्ता की वाणी के माध्यम से याहवे का अपना शोक भी इसमें सुनाई दे सकता है।
  rationale: अनुवाद ‘मेरा प्राण’ को बनाए रखता है और यह तय नहीं करता कि भविष्यद्वक्ता की पीड़ा में दिव्य करुणा किस सीमा तक प्रतिध्वनित होती है।
- issue: גֵוָה का धारक
  choice: केवल ‘घमंड के कारण’ कहा गया है।
  alternative: संदर्भ के आधार पर ‘तुम्हारे घमंड के कारण’ कहा जा सकता है।
  rationale: मूल पाठ घमंड के धारक को व्याकरणिक रूप से स्पष्ट नहीं करता; इसलिए अनुवाद में अनावश्यक रूप से ‘तुम्हारे’ नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण काव्यात्मक गद्य अपनाया गया है। ‘मेरा प्राण’, ‘छिपे स्थानों में’ और ‘याहवे का झुंड’ मूल बिंबों को बनाए रखते हैं; ‘फूट-फूटकर’ इब्रानी की तीव्रता को सामान्य पाठक के लिए स्वाभाविक ढंग से व्यक्त करता है।
