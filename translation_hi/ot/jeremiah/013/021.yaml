source:
  edition: WLC
  text: מַה תֹּֽאמְרִי֙ כִּֽי יִפְקֹ֣ד עָלַ֔יִ/ךְ וְ֠/אַתְּ לִמַּ֨דְתְּ אֹתָ֥/ם עָלַ֛יִ/ךְ אַלֻּפִ֖ים לְ/רֹ֑אשׁ הֲ/ל֤וֹא חֲבָלִים֙ יֹאחֱז֔וּ/ךְ כְּמ֖וֹ אֵ֥שֶׁת לֵדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/021.yaml
  text: What will you say when he appoints over you those whom you yourself taught to be leaders over you? Will not labor pains seize you like a woman giving birth?[a][b]
translation:
  language: hi
  text: जब वह उन्हीं को तुम्हारे ऊपर शासक ठहराएगा, जिन्हें तुमने स्वयं अपने ऊपर अगुआ बनने के लिए प्रशिक्षित किया था, तब तुम क्या कहोगी?[a][b] क्या प्रसव की पीड़ाएँ तुम्हें उस स्त्री के समान नहीं जकड़ लेंगी जो बच्चे को जन्म दे रही है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब वह तुम्हारी सुधि लेगा/तुम्हें दण्ड देगा।” इब्रानी क्रिया का अर्थ ‘ध्यान देना, सुधि लेना, दण्ड देना’ या ‘नियुक्त करना’ हो सकता है; यहाँ संदर्भ संभवतः यहूदा पर शासक ठहराने का है।
    reason: lexical_alternative
  - marker: b
    text: “अगुआ” के लिए प्रयुक्त इब्रानी शब्द का अर्थ “प्रधान,” “कुल-नायक” या “घनिष्ठ साथी” भी हो सकता है। यहाँ संभवतः उन लोगों की ओर संकेत है जिनसे यहूदा ने संबंध बढ़ाए थे और जो अब उस पर शासन करने वाले हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה תֹּאמְרִי
  choice: तब तुम क्या कहोगी?
  rationale: स्त्रीलिंग एकवचन संबोधन को बनाए रखा गया है; यह मानवीकृत यहूदा/सिय्योन से किया गया आलंकारिक प्रश्न है।
- source_word: כִּי יִפְקֹד עָלַיִךְ
  choice: जब वह ... तुम पर प्रधान ठहराएगा
  rationale: פקד के व्यापक अर्थों में यहाँ आगे आने वाले शासन-संबंधी पदबंध के कारण ‘नियुक्त/ठहराना’ सबसे संदर्भानुकूल है; कर्ता को इब्रानी की तरह अनिर्दिष्ट रखा गया है।
- source_word: וְאַתְּ לִמַּדְתְּ אֹתָם
  choice: जिन्हें तुमने स्वयं ... सिखाया था
  rationale: Piel रूप का अर्थ ‘सिखाना/प्रशिक्षित करना’ है और स्वतंत्र सर्वनाम का बल ‘स्वयं’ से व्यक्त किया गया है।
- source_word: עָלַיִךְ אַלֻּפִים לְרֹאשׁ
  choice: अपने ऊपर अगुआ होना ... तुम पर प्रधान
  rationale: אַלֻּפִים में ‘अगुए/प्रधान’ और कभी ‘घनिष्ठ साथी’ का अर्थ संभव है; לְרֹאשׁ तथा עָלַיִךְ के साथ राजनीतिक अधीनता प्रमुख है। दो अभिव्यक्तियों से मूल में शासन-संबंधी बल और ‘तुम पर’ की पुनरावृत्ति का आशय सुरक्षित रहता है।
- source_word: חֲבָלִים יֹאחֱזוּךְ
  choice: प्रसव-पीड़ा तुम्हें ... जकड़ लेगी
  rationale: जन्म देती स्त्री की उपमा के कारण חֲבָלִים स्पष्टतः प्रसव की पीड़ा है; אחז का सशक्त अर्थ ‘जकड़ लेना’ है।
- source_word: כְּמוֹ אֵשֶׁת לֵדָה
  choice: उस स्त्री के समान ... जो बच्चे को जन्म दे रही हो
  rationale: मूल उपमा को स्पष्ट, स्वाभाविक आधुनिक हिन्दी में रखा गया है।
theological_decisions:
- issue: יִפְקֹד के अनकहे पुल्लिंग एकवचन कर्ता की पहचान
  choice: ‘वह’ कहकर कर्ता अनिर्दिष्ट रखा गया
  alternative: यहोवा, शत्रु राजा, अथवा सहयोगी शक्ति को स्पष्ट कर्ता मानना
  rationale: इब्रानी पाठ कर्ता का नाम नहीं बताता। यह परमेश्वर की विदेशी शक्तियों के माध्यम से कार्रवाई या स्वयं शत्रु शक्ति की कार्रवाई की ओर संकेत कर सकता है; किसी एक अर्थ को थोपना उचित नहीं।
- issue: פקד का अर्थ
  choice: प्रधान ठहराना
  alternative: सुधि लेना/दण्ड देना/आक्रमण के लिए नियुक्त करना
  rationale: अगले पदबंध ‘तुम पर ... अगुआ/प्रधान’ से प्रशासनिक अर्थ सबसे स्वाभाविक है, पर वैकल्पिक अर्थ पाठ-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, स्त्रीलिंग एकवचन संबोधन और भविष्यकालीन आलंकारिक प्रश्न सुरक्षित हैं। भाषा गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट रखी गई है; ‘प्रसव-पीड़ा’ और ‘जकड़ लेगी’ मूल बिंब की तीव्रता बनाए रखते हैं।
