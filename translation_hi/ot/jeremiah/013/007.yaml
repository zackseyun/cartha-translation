base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/007.yaml
  text: So I went to Perath[a], and dug, and took the waistband from the place where I had hidden it. And behold, the waistband was ruined[b]; it was good for nothing.
translation:
  language: hi
  text: तब मैं परात[a] गया, वहाँ खोदा और जिस स्थान पर मैंने कमरबंद[b] छिपाया था, वहाँ से उसे निकाल लिया। और देखो, कमरबंद बिगड़ चुका था; वह किसी काम का न रहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘परात’ से फ़रात नदी का अभिप्राय हो सकता है; हिब्रू पाठ में स्थान का नाम ‘परात’ है।
    reason: alternative_reading
  - marker: b
    text: या ‘पट्टा,’ ‘लंगोटी’ अथवा ‘कमर का पटका।’ हिब्रू शब्द कमर के चारों ओर पहनी जाने वाली वस्तु को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּרָתָה
  choice: परात
  rationale: हिब्रू रूप स्थान-नाम ‘परात’ है। मुख्य पाठ में नाम का लिप्यंतरण रखा गया है; ‘फ़रात नदी’ की सम्भावित और पारम्परिक पहचान पादटिप्पणी में दी गई है, ताकि अनिश्चितता बनी रहे।
- source_word: אֵזוֹר
  choice: कमरबंद
  rationale: यह शब्द कमर के चारों ओर पहने जाने वाले वस्त्र या पट्टे को दर्शाता है। ‘कमरबंद’ स्वाभाविक हिन्दी है और वस्तु का रूप अनावश्यक रूप से निश्चित नहीं करता।
- source_word: טְמַנְתִּיו
  choice: मैंने ... छिपाया था
  rationale: क्रिया का अर्थ छिपाना या गाड़कर छिपाना हो सकता है। पद में खोदने का उल्लेख पहले से है, इसलिए ‘छिपाया था’ व्यापक अर्थ को सुरक्षित रखता है।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: यह अभिव्यक्ति खोज के परिणाम की ओर अचानक ध्यान खींचती है। ‘और देखो’ आधुनिक हिन्दी में उस कथात्मक बल को बनाए रखता है।
- source_word: נִשְׁחַת
  choice: नष्ट हो चुका था
  rationale: यहाँ क्रिया कमरबंद के बिगड़कर अनुपयोगी हो जाने को व्यक्त करती है। ‘नष्ट हो चुका था’ क्षति की पूर्णता और अगले वाक्य में उसकी अनुपयोगिता, दोनों के अनुकूल है।
- source_word: לֹא יִצְלַח לַכֹּל
  choice: वह किसी काम का न रहा
  rationale: यह मुहावरा पूर्ण अनुपयोगिता बताता है। चुना हुआ वाक्यांश स्पष्ट, स्वाभाविक और अर्थनिष्ठ आधुनिक हिन्दी है।
- source_word: וָאֵלֵךְ ... וָאֶחְפֹּר ... וָאֶקַּח
  choice: तब मैं ... गया, वहाँ खोदा और ... निकाल लिया
  rationale: क्रमिक हिब्रू क्रियाएँ एक के बाद एक हुई कार्रवाइयों का वर्णन करती हैं। हिन्दी वाक्य-विन्यास में ‘तब’ और ‘और’ इस कथात्मक क्रम को सहज रूप से व्यक्त करते हैं।
