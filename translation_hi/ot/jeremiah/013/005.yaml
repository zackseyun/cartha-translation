source:
  edition: WLC
  text: וָ/אֵלֵ֕ךְ וָ/אֶטְמְנֵ֖/הוּ בִּ/פְרָ֑ת כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אוֹתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/005.yaml
  text: So I went and hid it by the Euphrates[a], as Yahweh had commanded me.
translation:
  language: hi
  text: तब मैं गया और उसे फ़रात[a] के पास छिपा दिया, जैसा यहोवा ने मुझे आज्ञा दी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘परात’; इसे सामान्यतः फ़रात नदी समझा जाता है, पर कुछ लोग इसे ‘परात’ नाम का कोई स्थानीय स्थान मानते हैं।
    reason: मूल स्थान-नाम की पहचान पर वास्तविक अनिश्चितता को सुरक्षित रखना।
lexical_decisions:
- source_word: וָאֵלֵךְ
  choice: तब मैं गया
  rationale: वाव-क्रमिक क्रिया कथा को आगे बढ़ाती है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम स्वाभाविक रूप से व्यक्त करता है।
- source_word: וָאֶטְמְנֵהוּ
  choice: उसे … छिपा दिया
  rationale: טמן का मूल अर्थ छिपाना या गुप्त रखना है। ‘दबा दिया’ छिपाने की विधि को अनावश्यक रूप से निश्चित कर देता। पुल्लिंग एकवचन प्रत्यय पिछले संदर्भ की वस्तु की ओर संकेत करता है।
- source_word: בִּפְרָת
  choice: फ़रात के पास
  rationale: פְרָת सामान्यतः फ़रात नदी का नाम है। यहाँ ב स्थान-संबंध बताता है; छिपाने की क्रिया के साथ ‘के पास’ सहज है, जबकि ‘में’ अनावश्यक रूप से नदी के भीतर का अर्थ दे सकता है। स्थानीय स्थान-नाम की सम्भावना पाद-टिप्पणी में रखी गई है।
- source_word: כַּאֲשֶׁר
  choice: जैसा
  rationale: यह क्रिया के ढंग और पहले दी गई आज्ञा के अनुरूपता को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: צִוָּה
  choice: आज्ञा दी थी
  rationale: हिन्दी का पूर्ण भूतकाल स्पष्ट करता है कि आज्ञा यिर्मयाह के जाने और छिपाने से पहले दी गई थी।
- source_word: יְהוָה
  choice: यहोवा
  rationale: यह इब्रानी विशिष्ट नाम YHWH को नाम के रूप में प्रस्तुत करता है और उसे सामान्य उपाधि में नहीं बदलता।
- source_word: אוֹתִי
  choice: मुझे
  rationale: प्रत्यक्ष कर्म-चिह्न के साथ प्रथम पुरुष एकवचन प्रत्यय; ‘आज्ञा देना’ के साथ स्वाभाविक हिन्दी रूप ‘मुझे’ है।
theological_decisions:
- issue: פְרָת की पहचान
  choice: फ़रात
  alternative: परात नाम का कोई स्थानीय स्थान
  rationale: शब्द का सामान्य और पारंपरिक भौगोलिक अर्थ फ़रात नदी है। फिर भी व्यापक कथा में दूरी संबंधी प्रश्नों के कारण स्थानीय स्थान-नाम की सम्भावना को पाद-टिप्पणी में सुरक्षित रखा गया है।
- issue: יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में निजी वाचा-नाम है। ‘यहोवा’ हिन्दी बाइबिल परंपरा में व्यापक रूप से पहचाना जाता है और नाम को उपाधि बनाकर मूल का भेद नहीं मिटाता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। कथा-क्रम के लिए ‘तब’, व्यापक अर्थ बनाए रखने के लिए ‘छिपा दिया’, और नदी के भीतर छिपाने का अनपेक्षित अर्थ टालने के लिए ‘के पास’ चुना गया है।
