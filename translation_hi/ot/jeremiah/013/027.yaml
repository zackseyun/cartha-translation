  edition: WLC
  text: נִֽאֻפַ֤יִ/ךְ וּ/מִצְהֲלוֹתַ֨יִ/ךְ֙ זִמַּ֣ת זְנוּתֵ֔/ךְ עַל גְּבָעוֹת֙ בַּ/שָּׂדֶ֔ה רָאִ֖יתִי שִׁקּוּצָ֑יִ/ךְ א֥וֹי לָ/ךְ֙ יְר֣וּשָׁלִַ֔ם לֹ֣א תִטְהֲרִ֔י אַחֲרֵ֥י מָתַ֖י עֹֽד־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/027.yaml
  text: Your adulteries[a], your lustful neighings, the depravity of your prostitution on the hills in the field—I have seen your abominations. Woe to you, Jerusalem! Will you not be made clean?[d][c][b] How long will it still be?
translation:
  language: hi
  text: तेरे व्यभिचार, तेरी वासना-भरी हिनहिनाहटें, और खुले मैदान की पहाड़ियों पर तेरी वेश्यावृत्ति की निर्लज्जता[a]—मैंने तेरे घृणित काम देखे हैं। हे यरूशलेम, तुझ पर हाय! क्या तू शुद्ध न होगी?[b] आखिर कब तक?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरी वेश्यावृत्ति की अश्लीलता/दुष्टता।” इब्रानी शब्द में निर्लज्ज यौनाचार के साथ नैतिक विकृति का भाव भी है।
    reason: lexical_alternative
  - marker: b
    text: इसे “तू शुद्ध नहीं होगी” भी समझा जा सकता है। इब्रानी क्रिया का रूप शुद्ध होने और शुद्ध किए जाने—दोनों का भाव दे सकता है; संदर्भ में इसे व्याकुल आलंकारिक प्रश्न के रूप में रखा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: נִאֻפַיִךְ
  choice: तेरे व्यभिचार
  rationale: बहुवचन को बनाए रखते हुए यरूशलेम की वैवाहिक और वाचा-संबंधी बेवफाई का ठोस रूपक सुरक्षित रखता है।
- source_word: וּמִצְהֲלוֹתַיִךְ
  choice: तेरी वासना-भरी हिनहिनाहटें
  rationale: हिनहिनाने की तीखी अश्व-छवि को बनाए रखता है और प्रसंग में उसकी कामुक अभिलाषा स्पष्ट करता है।
- source_word: זִמַּת זְנוּתֵךְ
  choice: तेरी वेश्यावृत्ति की निर्लज्जता
  rationale: זִמָּה की अश्लीलता, दुष्टता और निर्लज्ज कामुकता को זְנוּת के साथ स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: עַל גְּבָעוֹת בַּשָּׂדֶה
  choice: मैदान की पहाड़ियों पर
  rationale: मूल स्थल-सूचना को सहज हिन्दी पदक्रम में रखता है और खुले स्थानों में मूर्तिपूजक गतिविधि की संभावित पृष्ठभूमि को अनिर्दिष्ट छोड़ता है।
- source_word: רָאִיתִי שִׁקּוּצַיִךְ
  choice: मैंने तेरे घिनौने काम देखे हैं
  rationale: पूर्ण क्रिया की वर्तमान-संबद्ध अभियोगात्मक शक्ति रखता है; 'घिनौने काम' आधुनिक पाठक के लिए स्वाभाविक है और नैतिक तथा उपासना-संबंधी दोनों संकेतों को समेट सकता है।
- source_word: אוֹי לָךְ
  choice: तुझ पर हाय
  rationale: भविष्यद्वक्ताओं की विलाप और न्याय की स्थापित उद्घोषणा को dignified, परिचित हिन्दी में रखता है।
- source_word: לֹא תִטְהֲרִי
  choice: क्या तू शुद्ध न होगी?
  rationale: अपूर्ण क्रिया को संदर्भानुकूल व्याकुल आलंकारिक प्रश्न के रूप में प्रस्तुत करता है, जबकि शुद्ध होने की मध्यवाची/कर्मवाची अस्पष्टता को हिन्दी में पूरी तरह समाप्त नहीं करता।
- source_word: אַחֲרֵי מָתַי עוֹד
  choice: आखिर कब तक?
  rationale: इब्रानी की संक्षिप्त, दीर्घकालिक विलंब जताने वाली उक्ति का स्वाभाविक और तीखा हिन्दी समतुल्य है।
theological_decisions:
- issue: यौन भाषा का वाचा-भंग और मूर्तिपूजा के रूपक के रूप में प्रयोग
  choice: व्यभिचार, वासना-भरी हिनहिनाहटें और वेश्यावृत्ति जैसी ठोस भाषा बनाए रखी गई।
  alternative: इसे केवल 'बेवफाई' या 'अनैतिकता' जैसे अमूर्त शब्दों में नरम करना।
  rationale: यिर्मयाह की जानबूझकर तीखी रूपक-भाषा न्याय के अभियोग का अंग है; उसे नरम करना मूल की भविष्यद्वक्तापूर्ण शक्ति घटा देता।
- issue: לֹא תִטְהֲרִי का वाक्य-बल
  choice: 'आलंकारिक प्रश्न: ''क्या तू शुद्ध न होगी?'''
  alternative: 'घोषणात्मक कथन: ''तू शुद्ध नहीं होगी।'''
  rationale: इसके बाद की संक्षिप्त पुकार 'आखिर कब तक?' इसे न्याय और मन-फिराव की अपील के बीच तनाव रखने वाला व्याकुल प्रश्न समझने का समर्थन करती है; फिर भी वैकल्पिक घोषणात्मक पठन पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन के लिए एकवचन स्त्रीलिंग 'तू/तेरे' रखा गया है क्योंकि यरूशलेम को स्त्री के रूप में संबोधित किया गया है। भाषा गरिमापूर्ण लेकिन तीखी है; मूल की यौन और अश्व-संबंधी छवियों को नरम नहीं किया गया।
