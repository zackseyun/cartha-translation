  edition: WLC
  text: לֶ/אֱד֗וֹם כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת הַ/אֵ֥ין ע֛וֹד חָכְמָ֖ה בְּ/תֵימָ֑ן אָבְדָ֤ה עֵצָה֙ מִ/בָּנִ֔ים נִסְרְחָ֖ה חָכְמָתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/007.yaml
  text: 'Concerning Edom: Thus says Yahweh of hosts: Is there no longer wisdom in Teman? Has counsel perished from the prudent? Has their wisdom become corrupted?[a][b]'
translation:
  language: hi
  text: 'एदोम के विषय में:


    सेनाओं का याहवे यों कहता है:


    “क्या तेमान में अब बुद्धि नहीं रही?

    क्या समझदारों[a] की सलाह नष्ट हो गई है?

    क्या उनकी बुद्धि सड़ गई है?[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “समझ रखनेवालों”; इब्रानी शब्द विवेकशील लोगों को दर्शाता है, जैविक अर्थ में “पुत्रों” को नहीं।
    reason: lexical_alternative
  - marker: b
    text: या, “क्या उनकी बुद्धि भ्रष्ट हो गई है?” इब्रानी क्रिया किसी वस्तु के सड़ने, बिगड़ने या दूषित हो जाने का भाव देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶאֱדוֹם
  choice: एदोम के विषय में
  rationale: राष्ट्र के नाम से पहले लगा ל इस भविष्यवाणी के विषय को प्रस्तुत करता है। यह अनुवाद ‘एदोम के विरुद्ध’ कहकर आशय को आवश्यकता से अधिक निश्चित नहीं करता।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का याहवे
  rationale: याहवे वाचा-संबंधी दिव्य नाम को लिप्यंतरित करता है, जबकि ‘सेनाओं’ से צְבָאוֹת की सैन्य और आकाशीय छवि बनी रहती है।
- source_word: הַאֵין עוֹד חָכְמָה
  choice: क्या ... अब बुद्धि नहीं रही?
  rationale: प्रश्नवाचक रचना और עוֹד मिलकर पूछते हैं कि क्या बुद्धि अब शेष नहीं है; सहज हिंदी में ‘अब ... नहीं रही’ इसी समाप्ति-बोध को व्यक्त करता है।
- source_word: בְּתֵימָן
  choice: तेमान में
  rationale: तेमान एदोम का स्थान-नाम है; ‘में’ सीधे स्थानवाचक अर्थ को व्यक्त करता है।
- source_word: אָבְדָה עֵצָה
  choice: क्या ... सलाह जाती रही?
  rationale: אָבַד के नष्ट या लुप्त हो जाने के भाव को ‘जाती रही’ व्यक्त करता है, और ‘सलाह’ עֵצָה के व्यावहारिक परामर्श-बोध के लिए सामान्य आधुनिक हिंदी है।
- source_word: מִבָּנִים
  choice: समझदारों से
  rationale: यह रूप בין, ‘समझना’, से संबंधित विवेकशील व्यक्तियों को दर्शाता है, न कि בנים, ‘पुत्रों’, को।
- source_word: נִסְרְחָה חָכְמָתָם
  choice: क्या उनकी बुद्धि सड़ गई है?
  rationale: दुर्लभ क्रिया के बिगड़ने, दूषित होने या सड़ने के ठोस रूपक को ‘सड़ गई’ सुरक्षित रखता है; वैकल्पिक अमूर्त अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ के व्यक्तिगत वाचा-संबंधी नाम को सामान्य उपाधि में बदलने के बजाय स्पष्ट लिप्यंतरण से सुरक्षित रखा गया है।
- issue: נִסְרְחָה में बुद्धि के बिगड़ने का रूपक
  choice: सड़ गई है
  alternative: भ्रष्ट हो गई है
  rationale: मूल क्रिया की ठोस और कुछ असामान्य छवि को मुख्य पाठ में बनाए रखा गया है; ‘भ्रष्ट’ अर्थ को अधिक अमूर्त और नैतिक बना सकता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और बोलचाल में समझ आने वाली मानक हिंदी। भविष्यवाणी की प्रश्नात्मक लय बनाए रखने के लिए तीन समानांतर प्रश्न अलग पंक्तियों में रखे गए हैं। ‘समझदारों’ और ‘सलाह’ जैसे सामान्य शब्द पठनीयता देते हैं, जबकि अंतिम पंक्ति का ‘सड़ गई’ मूल के तीखे रूपक को बनाए रखता है।
