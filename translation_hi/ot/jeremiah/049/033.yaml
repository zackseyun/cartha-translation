source:
  edition: WLC
  text: וְ/הָיְתָ֨ה חָצ֜וֹר לִ/מְע֥וֹן תַּנִּ֛ים שְׁמָמָ֖ה עַד עוֹלָ֑ם לֹֽא יֵשֵׁ֥ב שָׁם֙ אִ֔ישׁ וְ/לֹֽא יָג֥וּר בָּ֖/הּ בֶּן אָדָֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/033.yaml
  text: Hazor will become a haunt of jackals[a], a desolation forever; no man will dwell there[b], and no son of man will sojourn in it.
translation:
  language: hi
  text: हासोर सियारों का बसेरा और सदा के लिए उजाड़ स्थान बन जाएगा; वहाँ कोई मनुष्य निवास नहीं करेगा, और उसमें कोई मनुष्य परदेशी के रूप में नहीं रहेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיְתָה
  choice: हो जाएगा
  rationale: भविष्यसूचक प्रसंग में यह भावी परिणाम और अवस्था-परिवर्तन व्यक्त करता है।
- source_word: חָצוֹר
  choice: हासोर
  rationale: स्थान-नाम का आधुनिक हिन्दी में प्रचलित लिप्यंतरण।
- source_word: לִמְעוֹן
  choice: बसेरा
  rationale: מָעוֹן निवास-स्थान को सूचित करता है; उजड़े नगर में जंगली पशुओं के रहने की छवि के लिए ‘बसेरा’ स्वाभाविक हिन्दी है।
- source_word: תַּנִּים
  choice: सियारों
  rationale: भविष्यद्वाणी के उजाड़-वर्णनों में यह शब्द सामान्यतः सियारों को सूचित करता है, न कि पौराणिक अजगरों को।
- source_word: שְׁמָמָה
  choice: उजाड़
  rationale: यह संज्ञा विनाश और निर्जनता की दशा व्यक्त करती है; ‘उजाड़’ हिन्दी में संज्ञात्मक और स्वाभाविक है।
- source_word: עַד עוֹלָם
  choice: सदा के लिए
  rationale: न्याय-संबंधी वाणी में दीर्घस्थायी अवधि का सहज हिन्दी रूप।
- source_word: לֹא יֵשֵׁב שָׁם אִישׁ
  choice: वहाँ कोई मनुष्य निवास नहीं करेगा
  rationale: יָשַׁב के स्थायी रहने के भाव को ‘निवास’ व्यक्त करता है; אִישׁ यहाँ सामान्य मानव-संदर्भ में है।
- source_word: וְלֹא יָגוּר בָּהּ
  choice: और कोई मानव उसमें परदेशी होकर नहीं रहेगा
  rationale: גוּר अस्थायी रूप से या परदेशी के रूप में रहने का भाव रखता है; यह पहले आए स्थायी ‘निवास’ से भेद बनाए रखता है।
- source_word: בֶּן אָדָם
  choice: कोई मानव
  rationale: इस समानांतर न्याय-सूत्र में शाब्दिक ‘मनुष्य का पुत्र’ का अर्थ एक मानव प्राणी है; स्वाभाविक हिन्दी में ‘मानव’ अर्थ को स्पष्ट रखता है।
theological_decisions:
- issue: न्याय-सूत्र में लिंगयुक्त मानव-संदर्भ
  choice: אִישׁ को ‘मनुष्य’ और בֶּן־אָדָם को ‘मानव’ कहना
  alternative: ‘कोई पुरुष ... मनुष्य का कोई पुत्र’
  rationale: दोनों इब्रानी पद यहाँ प्रतिनिधिक और सामान्य मानवीय अर्थ में समानांतर हैं। हिन्दी में अत्यधिक शाब्दिक रूप अनचाहा पुरुष-विशेष अर्थ या मसीही उपाधि का संकेत दे सकता है; चुना हुआ रूप मूल के सामान्य मानव-संदर्भ को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘निवास’ और ‘परदेशी होकर रहना’ के द्वारा יָשַׁב तथा גוּר का अर्थ-भेद बनाए रखा गया है।
