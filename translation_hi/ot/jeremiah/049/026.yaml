  choice: सभी योद्धा
  rationale: शाब्दिक अर्थ ‘युद्ध के पुरुष’ है। ‘योद्धा’ आधुनिक हिन्दी में स्वाभाविक रूप से युद्ध करनेवाले पुरुषों का भाव व्यक्त करता है।
- source_word: יִדַּמּוּ
  choice: मौन कर दिए जाएँगे
  rationale: निफ़अल रूप चुप, निश्चल या नष्ट कर दिए जाने का अर्थ दे सकता है। ‘मौन कर दिए जाएँगे’ मूल बिंब और उसकी गंभीर अस्पष्टता को बनाए रखता है।
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: भविष्यद्वाणी के कथन में यह मानक कालसूचक अभिव्यक्ति है और हिन्दी में स्वाभाविक है।
- source_word: נְאֻם
  choice: यह घोषणा करता है
  rationale: यह परमेश्वर के वचन की प्रामाणिकता बताने वाला भविष्यद्वाणी-सूत्र है; यह रूप वर्तमान हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले परमेश्वर के निज नाम को किसी उपाधि से बदलने के बजाय देवनागरी लिप्यंतरण में प्रस्तुत किया गया है।
- source_word: צְבָאוֹת
  choice: सेनाओं का
  rationale: צְבָאוֹת का सैन्य भाव इस न्याय और युद्ध के प्रसंग में प्रत्यक्ष रखा गया है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ निज नाम का प्रयोग करता है। ‘याहवे’ उसे उपाधि में बदले बिना प्रस्तुत करता है; पारंपरिक हिन्दी रूप पादटिप्पणी में बताया गया है।
- issue: יִדַּמּוּ में मौन होने और नष्ट होने के बीच अर्थगत तनाव
  choice: मौन कर दिए जाएँगे
  alternative: नष्ट हो जाएँगे; काट डाले जाएँगे
  rationale: इब्रानी क्रिया चुप या निश्चल कर दिए जाने के साथ विनाश का भी संकेत दे सकती है। मुख्य पाठ मूल बिंब रखता है और पादटिप्पणी प्रसंगगत कठोर अर्थ बताती है।
- issue: יְהוָה צְבָאוֹת उपाधि का रूप
  choice: सेनाओं का याहवे
  alternative: सेनाओं का यहोवा; सेनाओं का प्रभु
  rationale: यह रूप परमेश्वर के निज नाम और צְבָאוֹת के सैन्य अर्थ—दोनों को स्पष्ट रूप से बनाए रखता है।
