  yaml_path: translation/ot/jeremiah/049/026.yaml
  text: Therefore her young men will fall in her streets[a], and all the men of war will be silenced on that day[c][b], declares Yahweh of Armies.
translation:
  language: hi
  text: इसलिए उसके जवान उसकी सड़कों[a] पर गिरेंगे, और उस दिन उसके सभी योद्धा मौन कर दिए जाएँगे[b]—सेनाओं के याहवे की यह घोषणा है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसके चौकों में’ अथवा ‘उसके खुले स्थानों में।’
    reason: lexical_alternative
  - marker: b
    text: या ‘नष्ट हो जाएँगे’ अथवा ‘काट डाले जाएँगे।’ इब्रानी क्रिया मौन, निश्चल या नष्ट कर दिए जाने का भाव व्यक्त कर सकती है।
    reason: lexical_alternative
  - marker: c
    text: 'पारंपरिक हिन्दी रूप: ‘सेनाओं का यहोवा’ या ‘सेनाओं का प्रभु।’'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह निष्कर्षसूचक अव्यय पिछले न्याय-वचन के परिणाम को प्रस्तुत करता है; ‘इसलिए’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: יִפְּלוּ
  choice: गिरेंगे
  rationale: युद्ध और न्याय के प्रसंग में נפל युद्ध में गिरने, और प्रायः मारे जाने, का संकेत देता है। ‘गिरेंगे’ इब्रानी बिंब को बनाए रखता है और अर्थ को अनावश्यक रूप से ‘मारे जाएँगे’ तक सीमित नहीं करता।
- source_word: בַחוּרֶיהָ
  choice: उसके जवान
  rationale: בָּחוּר सामान्यतः युवावस्था के बलवान पुरुषों, विशेषकर युद्ध के योग्य जवानों, को दर्शाता है।
- source_word: בִּרְחֹבֹתֶיהָ
  choice: उसकी सड़कों पर
  rationale: רְחוֹב चौड़ी सड़क, सार्वजनिक चौक या खुला स्थान दर्शा सकता है। मुख्य पाठ में ‘सड़कों’ सहज है, जबकि अन्य संभावनाएँ पादटिप्पणी में सुरक्षित हैं।
