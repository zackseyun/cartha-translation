source:
  edition: WLC
  text: לָ/כֵ֡ן הִנֵּה֩ יָמִ֨ים בָּאִ֜ים נְאֻם יְהוָ֗ה וְ֠/הִשְׁמַעְתִּי אֶל רַבַּ֨ת בְּנֵי עַמּ֜וֹן תְּרוּעַ֣ת מִלְחָמָ֗ה וְ/הָֽיְתָה֙ לְ/תֵ֣ל שְׁמָמָ֔ה וּ/בְנֹתֶ֖י/הָ בָּ/אֵ֣שׁ תִּצַּ֑תְנָה וְ/יָרַ֧שׁ יִשְׂרָאֵ֛ל אֶת יֹרְשָׁ֖י/ו אָמַ֥ר יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/002.yaml
  text: Therefore[a], behold, days are coming, declares Yahweh, when I will cause the battle cry to be heard against Rabbah of the Ammonites, and it will become a desolate mound, and its daughter towns will be set on fire. Then Israel will dispossess those who dispossessed him[c][b], says Yahweh.
translation:
  language: hi
  text: इसलिए देखो, वे दिन आने वाले हैं—याहवे की यह घोषणा है—जब मैं अम्मोनियों के रब्बा के विरुद्ध युद्ध का नाद सुनवाऊँगा[a]। वह उजाड़ टीला हो जाएगा, और उसके अधीन नगर[b] आग में जला दिए जाएँगे। तब इस्राएल उन लोगों को बेदखल करेगा जिन्होंने उसे बेदखल किया था[c]—याहवे कहता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘युद्ध की ललकार’ या ‘युद्ध की चेतावनी’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘उसकी बेटियाँ’; यह मुख्य नगर पर निर्भर छोटे नगरों या बस्तियों के लिए प्रयुक्त मुहावरा है।
    reason: cultural_note
  - marker: c
    text: 'इब्रानी में एक ही क्रिया की शब्द-क्रीड़ा है: इस्राएल उन्हें ‘बेदखल करेगा’ जिन्होंने उसे ‘बेदखल किया था।’'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले आरोप और आने वाले दण्ड के बीच कारण-परिणाम का संबंध स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הִנֵּה
  choice: देखो
  rationale: भविष्यवाणी की ओर ध्यान खींचने वाला बल बनाए रखता है और आधुनिक हिन्दी में सहज है।
- source_word: יָמִים בָּאִים
  choice: वे दिन आने वाले हैं
  rationale: आसन्न ईश्वरीय कार्य की मानक भविष्यसूचक अभिव्यक्ति को स्पष्ट और स्वाभाविक रूप देता है।
- source_word: נְאֻם יְהוָה
  choice: याहवे की यह घोषणा है
  rationale: औपचारिक भविष्यसूचक सूत्र और वक्तव्य की गंभीरता को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिवाचक वाचा-नाम को उपाधि में बदलने के बजाय लिप्यंतरित करता है।
- source_word: וְהִשְׁמַעְתִּי
  choice: मैं ... सुनवाऊँगा
  rationale: שׁמע के हिफ़ईल रूप का कारक अर्थ, अर्थात किसी ध्वनि को सुनाई देना कराना, सुरक्षित रखता है।
- source_word: אֶל רַבַּת בְּנֵי עַמּוֹן
  choice: अम्मोनियों के रब्बा के विरुद्ध
  rationale: सैन्य प्रसंग में אֶל की प्रतिकूल दिशा को ‘के विरुद्ध’ व्यक्त करता है; रब्बा को अम्मोनियों के प्रमुख नगर के रूप में स्पष्ट करता है।
- source_word: תְּרוּעַת מִלְחָמָה
  choice: युद्ध का नाद
  rationale: युद्ध की ऊँची पुकार, रण-संकेत या चेतावनी की अर्थ-सीमा को संक्षिप्त और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: וְהָיְתָה לְתֵל שְׁמָמָה
  choice: वह उजाड़ खंडहरों का टीला हो जाएगा
  rationale: תֵל के नगर-विनाश से बने मलबे या खंडहरों के टीले के ठोस बिंब को सुरक्षित रखता है।
- source_word: וּבְנֹתֶיהָ
  choice: उसके अधीन नगर
  rationale: ‘उसकी बेटियाँ’ के प्राचीन नगरीय मुहावरे का आशय सामान्य पाठक के लिए स्पष्ट करता है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: וְיָרַשׁ ... אֶת יֹרְשָׁיו
  choice: बेदखल करेगा ... जिन्होंने उसे बेदखल किया था
  rationale: एक ही इब्रानी धातु की पुनरावृत्ति और प्रतिशोधात्मक शब्द-क्रीड़ा को हिन्दी में भी पुनरावृत्ति द्वारा बनाए रखता है।
- source_word: אָמַר יְהוָה
  choice: याहवे कहता है
  rationale: समापन के सीधे कथन-सूत्र को औपचारिक घोषणा वाले पहले सूत्र से अलग रखते हुए निकटता से प्रस्तुत करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में व्यक्तिवाचक चतुरक्षरीय नाम है; ‘याहवे’ उसे किसी उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: יִשְׂרָאֵל और יֹרְשָׁיו का सामूहिक एकवचन
  choice: इस्राएल ... जिन्होंने उसे बेदखल किया था
  alternative: इस्राएली ... जिन्होंने उन्हें बेदखल किया था
  rationale: इब्रानी में इस्राएल को सामूहिक एकवचन माना गया है और प्रत्यय भी एकवचन है; हिन्दी का ‘उसे’ इस संरचना को स्वाभाविक रूप से सुरक्षित रखता है।
- issue: ירש की अर्थगत द्विधा और शब्द-क्रीड़ा
  choice: दोनों स्थानों पर ‘बेदखल करना’
  alternative: अधिकार करना / उत्तराधिकारी होना
  rationale: सैन्य न्याय के प्रसंग में बेदखली का अर्थ उपयुक्त है और उसी क्रिया की पुनरावृत्ति स्रोत की जानबूझकर की गई शब्द-क्रीड़ा तथा प्रतिलोम न्याय को बनाए रखती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और श्रव्य-पाठ के अनुकूल रखी गई है। भविष्यसूचक गंभीरता के लिए डैशों से घोषणा-सूत्र अलग किया गया है। ‘देखो’ स्रोत के ध्यानाकर्षक संकेत को बनाए रखता है; ‘अधीन नगर’ अप्रचलित शाब्दिक मुहावरे को स्पष्ट करता है, जबकि उसका मूल बिंब पादटिप्पणी में सुरक्षित है।
