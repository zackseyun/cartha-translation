source:
  edition: WLC
  text: הִ֠נֵּה כְּ/אַרְיֵ֞ה יַעֲלֶ֨ה מִ/גְּא֣וֹן הַ/יַּרְדֵּן֮ אֶל נְוֵ֣ה אֵיתָן֒ כִּֽי אַרְגִּ֤יעָה אֲרִיצֶ֨/נּוּ מֵֽ/עָלֶ֔י/הָ וּ/מִ֥י בָח֖וּר אֵלֶ֣י/הָ אֶפְקֹ֑ד כִּ֣י מִ֤י כָמ֨וֹ/נִי֙ וּ/מִ֣י יֹעִידֶ֔/נִּי וּ/מִי זֶ֣ה רֹעֶ֔ה אֲשֶׁ֥ר יַעֲמֹ֖ד לְ/פָנָֽ/י־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/019.yaml
  text: Look[a], like a lion he will come up from the thicket of the Jordan against a secure pasture; for in an instant I will make him run from it, and I will appoint over it whomever is chosen. For who is like me[b], and who will summon me? And who is the shepherd who can stand before me?
translation:
  language: hi
  text: देखो, सिंह की तरह वह यरदन की घनी झाड़ियों[a] से निकलकर सुरक्षित चरागाह पर चढ़ आएगा। क्योंकि मैं पल भर में उसे वहाँ से भगा दूँगा, और जिसे चुना गया है, उसे मैं उस पर नियुक्त करूँगा। क्योंकि मेरे समान कौन है? मुझे कौन तलब करेगा[b]? और वह कौन-सा चरवाहा है जो मेरे सामने टिक सके?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘यरदन के गर्व/वैभव’ से; यह इब्रानी मुहावरा सम्भवतः यरदन के किनारे की घनी वनस्पति को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: 'या ‘मेरे लिए समय कौन ठहराएगा?’ सम्भव न्यायिक अर्थ: ‘मुझे न्याय के लिए कौन बुलाएगा?’'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह उद्घोषणा को सजीव और तात्कालिक बनाता है; आधुनिक हिन्दी में स्वाभाविक रहते हुए इब्रानी संकेतवाचक बल को बनाए रखता है।
- source_word: כְּאַרְיֵה
  choice: सिंह की तरह
  rationale: उपमा को सीधे और स्पष्ट रूप में सुरक्षित रखा गया है।
- source_word: יַעֲלֶה
  choice: निकलकर ... चढ़ आएगा
  rationale: עלה की ऊपर आने अथवा चढ़ने की दिशात्मक छवि रखी गई है; ‘निकलकर’ पिछले पदबंध के साथ गति को स्वाभाविक हिन्दी में जोड़ता है।
- source_word: מִגְּאוֹן הַיַּרְדֵּן
  choice: यरदन की घनी झाड़ियों
  rationale: गאון का सामान्य अर्थ ‘गर्व/वैभव’ है, पर यरदन के साथ यह आवर्ती मुहावरा सम्भवतः नदी-तट की सघन वनस्पति को दर्शाता है, जहाँ सिंह छिपते थे। शाब्दिक सम्भावना पादटिप्पणी में रखी गई है।
- source_word: נְוֵה אֵיתָן
  choice: सुरक्षित चरागाह
  rationale: נוה के चरागाह/निवास और איתן के दृढ़, स्थायी या सुरक्षित होने—दोनों भावों को संक्षेप में व्यक्त करता है तथा चरवाही की छवि बनाए रखता है।
- source_word: כִּי אַרְגִּיעָה
  choice: क्योंकि मैं पल भर में
  rationale: यहाँ רגע का हिफ़ील रूप अचानक या एक क्षण में किए जाने वाले कार्य का क्रियाविशेषणीय भाव देता है।
- source_word: אֲרִיצֶנּוּ מֵעָלֶיהָ
  choice: उसे वहाँ से भगा दूँगा
  rationale: क्रिया का प्रेरणार्थक बल—किसी को दौड़ाकर अथवा शीघ्र हटाना—स्वाभाविक हिन्दी में व्यक्त किया गया है। सर्वनाम की पहचान को नाम जोड़कर निश्चित नहीं किया गया।
- source_word: וּמִי בָחוּר אֵלֶיהָ אֶפְקֹד
  choice: और जिसे चुना गया है, उसे मैं उस पर नियुक्त करूँगा
  rationale: संक्षिप्त और कुछ कठिन इब्रानी वाक्य में בחור को ‘चुना गया’ और פקד को अधिकार के पद पर ‘नियुक्त करना’ समझा गया है; चुनाव करने वाले की पहचान नहीं जोड़ी गई।
- source_word: מִי כָמוֹנִי
  choice: मेरे समान कौन है?
  rationale: अतुलनीयता के आलंकारिक प्रश्न को सीधे रखा गया है।
- source_word: וּמִי יוֹעִידֶנִּי
  choice: मुझे कौन तलब करेगा?
  rationale: יעד के हिफ़ील रूप में निर्धारित भेंट या न्यायिक सामना करने के लिए बुलाने का भाव हो सकता है। ‘तलब’ उस चुनौतीपूर्ण और सम्भावित न्यायिक बल को संक्षेप में रखता है; दूसरा सम्भव अर्थ पादटिप्पणी में दिया गया है।
- source_word: רֹעֶה
  choice: चरवाहा
  rationale: शासक का रूपक सम्भव होने पर भी मूल चरवाही की छवि को अनावश्यक व्याख्या के बिना सुरक्षित रखा गया है।
- source_word: יַעֲמֹד לְפָנַי
  choice: मेरे सामने टिक सके
  rationale: आलंकारिक प्रश्न केवल खड़े होने की भविष्यकालीन क्रिया नहीं, बल्कि परम वक्ता का सामना कर पाने की क्षमता को चुनौती देता है; ‘टिक सके’ आधुनिक हिन्दी में यही बल देता है।
theological_decisions:
- issue: प्रथम पुरुष में बोलने वाले की पहचान
  choice: ‘मैं/मेरे’ को परमेश्वर का वचन मानते हुए भी पद में ‘यहोवा’ या ‘परमेश्वर’ नाम जोड़कर नहीं लिखा गया।
  alternative: ‘यहोवा कहता है’ अथवा ‘परमेश्वर’ को स्पष्ट कर्ता के रूप में जोड़ना।
  rationale: व्यापक प्रसंग दिव्य वाणी है, पर इस पद के इब्रानी पाठ में वक्ता प्रथम पुरुष में बोलता है और यहाँ दिव्य नाम नहीं आया। अनुवाद पाठ की अपनी प्रस्तुति बनाए रखता है।
- issue: ‘चरवाहा’ का रूपक
  choice: रूपक को ‘चरवाहा’ ही रखा गया।
  alternative: इसे ‘राजा’, ‘शासक’ या ‘नेता’ के रूप में खोल देना।
  rationale: यह शासक की ओर संकेत कर सकता है, पर मूल पाठ जानबूझकर चरवाही की भाषा उपयोग करता है। अनुवाद रूपक की धर्मवैचारिक और साहित्यिक व्यापकता को सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘तलब’ प्रचलित न्यायिक शब्द है और यहाँ मूल की सम्भावित कानूनी चुनौती को बनाए रखता है। छोटे आलंकारिक प्रश्नों को अलग वाक्यों में रखा गया है ताकि मूल की चुनौतीपूर्ण लय स्पष्ट रहे।
