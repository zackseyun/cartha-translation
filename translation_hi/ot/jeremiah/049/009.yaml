source:
  edition: WLC
  text: אִם בֹּֽצְרִים֙ בָּ֣אוּ לָ֔/ךְ לֹ֥א יַשְׁאִ֖רוּ עֽוֹלֵל֑וֹת אִם גַּנָּבִ֥ים בַּ/לַּ֖יְלָה הִשְׁחִ֥יתוּ דַיָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/009.yaml
  text: If grape gatherers came to you[a], would they not leave gleanings? If thieves came by night, they would destroy only enough for themselves.
translation:
  language: hi
  text: यदि अंगूर तोड़नेवाले तुम्हारे पास आते, तो क्या वे कुछ बचे हुए अंगूर न छोड़ जाते? यदि रात में चोर आते, तो वे केवल उतना ही नष्ट करते जितना उनके लिए पर्याप्त होता।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या दूसरी पंक्ति का अर्थ हो सकता है: “यदि रात में चोर आते, तो क्या वे केवल उतना ही न चुराते जितना उनके लिए पर्याप्त होता?” अन्तिम इब्रानी पदबंध का शाब्दिक अर्थ है “उनका पर्याप्त।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: यदि
  rationale: दोनों उपवाक्यों में काल्पनिक तुलना और शर्तसूचक बल को बनाए रखता है।
- source_word: בֹּצְרִים
  choice: अंगूर तोड़नेवाले
  rationale: यह सामान्य कटनी करनेवालों के बजाय विशेष रूप से अंगूर इकट्ठा करनेवालों को दर्शाता है और आधुनिक हिन्दी में स्पष्ट है।
- source_word: בָּאוּ לָךְ
  choice: तुम्हारे पास आते
  rationale: इब्रानी के ‘तुम्हारे पास/तुम पर आते’ की व्यापकता को बनाए रखता है; शत्रुतापूर्ण भाव प्रसंग से स्पष्ट होता है।
- source_word: לֹא יַשְׁאִירוּ
  choice: तो क्या वे ... न छोड़ते?
  rationale: इब्रानी कथन में निहित अपेक्षित उत्तर वाले आलंकारिक प्रश्न को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עֹלֵלוֹת
  choice: कुछ अंगूर बीनने के लिए
  rationale: कटनी के बाद बचे अंगूरों के तकनीकी कृषि-संबंधी अर्थ को साधारण पाठक के लिए स्पष्ट करता है।
- source_word: גַּנָּבִים בַּלַּיְלָה
  choice: रात में चोर
  rationale: रात्रि में चोरी की गुप्तता और मूल संज्ञा का सीधा अर्थ सुरक्षित रखता है।
- source_word: הִשְׁחִיתוּ
  choice: नाश करते
  rationale: हिफ़ील रूप के ‘बिगाड़ना/नष्ट करना’ वाले प्रबल अर्थ को बनाए रखता है।
- source_word: דַיָּם
  choice: केवल अपने लिए पर्याप्त
  rationale: शाब्दिक ‘उनका पर्याप्त’ मुहावरे का अर्थ है कि चोर उतना ही नाश या ले जाते हैं जितना उनके लिए काफ़ी हो; ‘केवल’ तुलना में सीमित मात्रा को स्पष्ट करता है।
theological_decisions:
- issue: दूसरी पंक्ति का वाक्य-विन्यास और आलंकारिक बल
  choice: 'इसे मुख्य पाठ में कथन के रूप में रखा गया: ‘वे केवल अपने लिए पर्याप्त ही नाश करते।’'
  alternative: 'इसे प्रश्न के रूप में पढ़ना: ‘क्या वे केवल उतना ही न चुराते जितना उनके लिए पर्याप्त होता?’'
  rationale: व्यंजनयुक्त इब्रानी पाठ में दूसरी पंक्ति औपचारिक रूप से कथन है, जबकि समानांतरता प्रश्नात्मक पाठ की संभावना देती है। मुख्य पाठ मसोराई वाक्य-विन्यास का अनुसरण करता है और पादटिप्पणी वास्तविक अस्पष्टता सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण शैली। ‘अंगूर तोड़नेवाले’ और ‘बीनने के लिए’ से दाखबारी का चित्र सामान्य पाठक के लिए स्पष्ट किया गया है। स्त्रीलिंग एकवचन ‘तुम्हारे’ का संकेत लक्ष्य एदोम से है, पर हिन्दी में अलग लिंग-रूप आवश्यक नहीं।
