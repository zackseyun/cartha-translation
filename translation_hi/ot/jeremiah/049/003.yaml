source:
  edition: WLC
  text: הֵילִ֨ילִי חֶשְׁבּ֜וֹן כִּ֣י שֻׁדְּדָה עַ֗י צְעַקְנָה֮ בְּנ֣וֹת רַבָּה֒ חֲגֹ֣רְנָה שַׂקִּ֔ים סְפֹ֕דְנָה וְ/הִתְשׁוֹטַ֖טְנָה בַּ/גְּדֵר֑וֹת כִּ֤י מַלְכָּ/ם֙ בַּ/גּוֹלָ֣ה יֵלֵ֔ךְ כֹּהֲנָ֥י/ו וְ/שָׂרָ֖י/ו יַחְדָּֽיו־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/003.yaml
  text: Wail[a], Heshbon, for Ai is devastated! Cry out, daughters of Rabbah! Put on sackcloth, mourn, and wander about among the walls, for their king will go into exile, together with his priests and his officials.
translation:
  language: hi
  text: हे हेशबोन, विलाप कर, क्योंकि ऐ उजाड़ दिया गया है! हे रब्बा की बेटियो, पुकारो! टाट ओढ़ो, शोक मनाओ और बाड़ों के बीच भटकती फिरो; क्योंकि उनका राजा[a] निर्वासन में चला जाएगा—उसके याजक और अधिकारी भी उसके साथ जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मिल्कोम निर्वासन में चला जाएगा।” ‘मिल्कोम’ (जिसे ‘मल्काम’ भी लिखा जाता है) अम्मोनियों के देवता का नाम है; इब्रानी व्यंजन-पाठ को इस नाम के रूप में भी पढ़ा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: הֵילִילִי
  choice: विलाप कर
  rationale: स्त्रीलिंग एकवचन आज्ञार्थक रूप तीव्र शोक-ध्वनि व्यक्त करता है। ‘विलाप कर’ आधुनिक, गरिमापूर्ण हिन्दी में स्वाभाविक है और संबोधित नगर के व्याकरणिक एकवचन को बनाए रखता है।
- source_word: חֶשְׁבּוֹן
  choice: हेशबोन
  rationale: स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: שֻׁדְּדָה
  choice: उजाड़ दिया गया है
  rationale: שׁדד का कर्मवाच्य रूप हिंसक विनाश या लूट से हुई बरबादी दर्शाता है। यह अनुवाद केवल लूट या पूर्ण नाश में से किसी एक अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: עַי
  choice: ऐ
  rationale: मसोरेटिक पाठ के स्थान-नाम को बिना पाठ-संशोधन के लिप्यंतरित किया गया है।
- source_word: צְעַקְנָה
  choice: पुकार उठो
  rationale: स्त्रीलिंग बहुवचन आज्ञार्थक रूप संकट और शोक में ऊँची आवाज़ से पुकारने का भाव रखता है।
- source_word: בְּנוֹת רַבָּה
  choice: रब्बा की बेटियो
  rationale: ‘की बेटियाँ’ स्त्री निवासियों या आश्रित बस्तियों की सामी उपमा हो सकती है। शोक करती स्त्रियों को प्रत्यक्ष संबोधन यहाँ स्वाभाविक है, और मूल बिंब सुरक्षित रहता है।
- source_word: חֲגֹרְנָה שַׂקִּים
  choice: टाट ओढ़ो
  rationale: शोक के वस्त्र धारण करने की सांस्कृतिक क्रिया को सहज हिन्दी में व्यक्त करता है।
- source_word: סְפֹדְנָה
  choice: शोक मनाओ
  rationale: यह क्रिया आपदा या मृत्यु पर औपचारिक विलाप और मातम का अर्थ देती है।
- source_word: וְהִתְשׁוֹטַטְנָה
  choice: भटकती फिरो
  rationale: रूप बेचैनी से इधर-उधर घूमने का भाव देता है; ‘भटकती फिरो’ शोकपूर्ण, व्याकुल गति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בַּגְּדֵרוֹת
  choice: बाड़ों के बीच
  rationale: גדרות दीवारों, बाड़ों या घेरों को दर्शाता है। ‘बाड़ों के बीच’ शब्द के ठोस अर्थ और मूल की अस्पष्टता को ‘नगरपनाह’ जैसे अधिक विशिष्ट अर्थ में सीमित किए बिना रखता है।
- source_word: מַלְכָּם
  choice: उनका राजा
  rationale: मसोरेटिक स्वरांकन ‘उनका राजा’ का समर्थन करता है। वही व्यंजन अम्मोनी देवता मिल्कोम के नाम के रूप में भी पढ़े जा सकते हैं, इसलिए विकल्प पादटिप्पणी में रखा गया है।
- source_word: בַּגּוֹלָה יֵלֵךְ
  choice: बँधुआई में चला जाएगा
  rationale: निर्वासन और जबरन देश-निकाले की मानक अभिव्यक्ति; आधुनिक बाइबलीय हिन्दी में स्पष्ट और स्वाभाविक।
- source_word: כֹּהֲנָיו וְשָׂרָיו יַחְדָּו
  choice: उसके याजक और अधिकारी भी उसके साथ जाएँगे
  rationale: ‘एक साथ’ के आशय को हिन्दी वाक्य-विन्यास में ‘उसके साथ’ से व्यक्त किया गया है; बहुवचन कर्ताओं के लिए ‘जाएँगे’ स्पष्टता हेतु निहित क्रिया को दोहराता है।
theological_decisions:
- issue: מַלְכָּם का अर्थ मानवीय ‘उनका राजा’ है या अम्मोनी देवता ‘मिल्कोम’
  choice: उनका राजा
  alternative: मिल्कोम (जिसे मल्काम भी लिखा जाता है)
  rationale: मसोरेटिक स्वरांकन ‘उनका राजा’ पढ़ता है और ‘उसके याजक और अधिकारी’ के साथ इसका वाक्यगत संबंध संभव है। फिर भी व्यंजन-पाठ देवता के नाम की पढ़त की अनुमति देता है और अम्मोन के संदर्भ में वह महत्वपूर्ण है; अतः तनाव को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर भविष्यवाणी और सार्वजनिक विलाप के अनुरूप गरिमापूर्ण रखी गई है। स्त्रीलिंग संबोधनों ‘बेटियो’, ‘पुकार उठो’ और ‘भटकती फिरो’ से इब्रानी व्याकरण और नगर की स्त्रीरूप कल्पना सुरक्षित है।
