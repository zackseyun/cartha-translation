reference: Jeremiah 49:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: נֻ֤סוּ הָפְנוּ֙ הֶעְמִ֣יקוּ לָ/שֶׁ֔בֶת יֹשְׁבֵ֖י דְּדָ֑ן כִּ֣י אֵ֥יד עֵשָׂ֛ו הֵבֵ֥אתִי עָלָ֖י/ו עֵ֥ת פְּקַדְתִּֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/008.yaml
  text: Flee[a], turn back, dwell deep, inhabitants of Dedan, for I have brought Esau’s calamity upon him[c][b], the time when I punish him.
translation:
  language: hi
  text: हे ददान के निवासियो, भागो, पीछे हटो, और दूर-दुर्गम स्थानों में जाकर बसो[a], क्योंकि मैं एसाव पर विपत्ति ले आऊँगा[b], जब मैं उसे दण्ड दूँगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “गहराई में जाकर बसो”; इस हिब्रू मुहावरे का भाव दूर या ऐसे दुर्गम स्थानों में चले जाना है जहाँ पहुँचना कठिन हो।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “एसाव” से आशय उसके वंशजों, अर्थात् एदोम से है।
    reason: cultural_note
  - marker: c
    text: या, “जब मैं उसकी सुधि लूँगा” या “जब मैं उसका लेखा लूँगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: נֻסוּ
  choice: भागो
  rationale: बहुवचन आज्ञार्थक क्रिया है और आसन्न संकट से बच निकलने की सीधी आज्ञा देती है।
- source_word: הָפְנוּ
  choice: पीछे हटो
  rationale: भागने की आज्ञा के बाद यह खतरे से मुड़कर हट जाने का भाव व्यक्त करता है; आधुनिक हिन्दी में यह स्वाभाविक है।
- source_word: הֶעְמִיקוּ לָשֶׁבֶת
  choice: दूर दुर्गम स्थानों में जा बसो
  rationale: शाब्दिक रूप से ‘गहराई में जाकर बसो’ का बिंब है, पर इस मुहावरे का आशय दूर या कठिन पहुँच वाले स्थान में शरण लेना है। चयनित वाक्यांश अर्थ को स्पष्ट रखते हुए पीछे हटने की तीव्रता बचाता है।
- source_word: יֹשְׁבֵי דְּדָן
  choice: हे ददान के निवासियो
  rationale: सम्बोधन को स्पष्ट करने के लिए ‘हे’ जोड़ा गया है; ‘निवासियो’ मूल के बहुवचन रचनात्मक रूप के अनुरूप है।
- source_word: אֵיד עֵשָׂו
  choice: एसाव पर विपत्ति
  rationale: אֵיד विनाशकारी विपत्ति या संकट को दर्शाता है। मूल में ‘एसाव’ है, इसलिए उसे ‘एदोम’ से मुख्य पाठ में प्रतिस्थापित नहीं किया गया।
- source_word: הֵבֵאתִי עָלָיו
  choice: मैं एसाव पर विपत्ति ले आया हूँ
  rationale: पूर्ण क्रिया न्याय की निश्चितता को व्यक्त करती है; हिन्दी का वर्तमान पूर्ण रूप मूल की पूर्णता और भविष्यसूचक निश्चितता दोनों को सम्भव रखता है।
- source_word: עֵת פְּקַדְתִּיו
  choice: वह समय आ गया है जब मैं उसे दण्ड दूँगा
  rationale: न्याय-सन्दर्भ में פקד दण्ड देने के लिए ध्यान देने या हिसाब लेने का भाव रखता है। ‘दण्ड दूँगा’ प्रसंगगत अर्थ स्पष्ट करता है, जबकि पादटिप्पणी व्यापक विकल्प सुरक्षित रखती है।
theological_decisions:
- issue: न्याय-वाणी में פקד का अर्थ
  choice: दण्ड दूँगा
  alternative: उसका लेखा लूँगा / उससे मिलने आऊँगा
  rationale: इस प्रसंग में यह तटस्थ भेंट नहीं, दैवी न्याय की कार्रवाई है। फिर भी पादटिप्पणी ‘लेखा लेने’ के व्यापक हिब्रू भाव को सुरक्षित रखती है।
- issue: ‘एसाव’ की सामूहिक पहचान
  choice: मुख्य पाठ में ‘एसाव’
  alternative: एदोम
  rationale: मूल पाठ पूर्वज का नाम लेकर उसके वंशज राष्ट्र एदोम को सूचित करता है। मुख्य पाठ मूल नाम को बनाए रखता है और सांस्कृतिक संकेत पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यद्वाणी-शैली रखी गई है। आज्ञाओं की तीव्र, क्रमिक लय बनाए रखने के लिए ‘भागो, पीछे हटो’ रखा गया है। कठिन हिब्रू मुहावरे को मुख्य पाठ में अर्थ-स्पष्ट रूप दिया गया है और उसका शाब्दिक बिंब पादटिप्पणी में सुरक्षित है।
