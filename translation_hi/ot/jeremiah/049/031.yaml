  text: ק֣וּמוּ עֲל֗וּ אֶל גּ֥וֹי שְׁלֵ֛יו יוֹשֵׁ֥ב לָ/בֶ֖טַח נְאֻם יְהוָ֑ה לֹא דְלָתַ֧יִם וְ/לֹֽא בְרִ֛יחַ ל֖/וֹ בָּדָ֥ד יִשְׁכֹּֽנוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/031.yaml
  text: Rise up[a], go up against a nation at ease, dwelling securely, declares Yahweh, that has no doors or bars[b]; they dwell alone.
translation:
  language: hi
  text: “उठो, उस निश्चिंत[a] राष्ट्र पर चढ़ाई करो, जो सुरक्षित होकर बसा हुआ है,” याहवे की घोषणा है, “जिसके न किवाड़ हैं, न अर्गला[b]; वे अकेले रहते हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शान्त” अथवा “आत्मसंतुष्ट।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उसके न किवाड़ हैं और न अर्गला”; आशय है कि वे किलेबंद नहीं हैं और अपने को सुरक्षित समझते हैं।
    reason: cultural_note
lexical_decisions:
- source_word: ק֣וּמוּ עֲל֗וּ
  choice: उठो … पर चढ़ाई करो
  rationale: दोनों बहुवचन आज्ञार्थकों को रखा गया है। युद्ध-संदर्भ में עֲלוּ אֶל का अर्थ किसी लक्ष्य के विरुद्ध आगे बढ़ना या चढ़ाई करना है।
- source_word: גּ֥וֹי שְׁלֵ֛יו
  choice: निश्चिन्त जाति
  rationale: שְׁלֵו शान्त, निश्चिन्त जीवन के साथ असावधानी या आत्मसन्तुष्टि की छाया भी रख सकता है; ‘निश्चिन्त’ इस अर्थ-विस्तार को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יוֹשֵׁ֥ב לָבֶ֖טַח
  choice: जो बेखटके बसी है
  rationale: यह पद स्थिर निवास और सुरक्षा की अनुभूति व्यक्त करता है। ‘बेखटके बसी है’ आधुनिक, सहज हिन्दी में दोनों भाव देता है।
- source_word: נְאֻם יְהוָ֑ה
  choice: याहवे की घोषणा है
  rationale: भविष्यद्वाणी के औपचारिक सूत्र נְאֻם को ‘घोषणा’ और परमेश्वर के व्यक्तिवाचक नाम יהוה को ‘याहवे’ के रूप में प्रस्तुत किया गया है।
- source_word: לֹא דְלָתַ֧יִם וְלֹֽא בְרִ֛יחַ ל֖וֹ
  choice: जिसके न किवाड़ हैं, न अर्गला
  rationale: मूल के ‘न किवाड़ और न उसके लिए अर्गला’ को निकटता से रखा गया है। यहाँ ये सुरक्षा-किलेबन्दी के अभाव को सूचित करते हैं।
- source_word: בָּדָ֥ד יִשְׁכֹּֽנוּ
  choice: वे अकेले रहते हैं
  rationale: בָּדָד का अलग-थलग या अपने आप रहने का भाव और יִשְׁכֹּנוּ का बहुवचन स्पष्ट रूप से सुरक्षित रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में परमेश्वर का व्यक्तिवाचक वाचा-नाम सीधे आया है। ‘याहवे’ उसे उपाधि में बदले बिना और किसी विशिष्ट साम्प्रदायिक व्याख्या को जोड़े बिना प्रस्तुत करता है।
- issue: שְׁלֵו में शान्ति और आत्मसन्तुष्टि के बीच अर्थ-तनाव
  choice: निश्चिन्त
  alternative: शान्त; आत्मसन्तुष्ट
  rationale: ‘निश्चिन्त’ शान्त सुरक्षा तथा सम्भावित असावधानी—दोनों को खुला रखता है; ‘आत्मसन्तुष्ट’ नकारात्मक अर्थ को आवश्यकता से अधिक निश्चित कर देता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण पर सहज रखी गई है। ‘चढ़ाई करो’ युद्ध-संबंधी आह्वान को स्पष्ट करता है; ‘किवाड़’ और ‘अर्गला’ मूल बिम्ब को बनाए रखते हैं, जबकि पादटिप्पणी उसका सांस्कृतिक आशय बताती है।
