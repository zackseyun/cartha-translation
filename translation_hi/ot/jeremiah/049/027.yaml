source:
  edition: WLC
  text: וְ/הִצַּ֥תִּי אֵ֖שׁ בְּ/חוֹמַ֣ת דַּמָּ֑שֶׂק וְ/אָכְלָ֖ה אַרְמְנ֥וֹת בֶּן הֲדָֽד־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/027.yaml
  text: And I will kindle a fire in the wall of Damascus[a], and it will consume the palaces of Ben-hadad.
translation:
  language: hi
  text: और मैं दमिश्क की शहरपनाह में[a] आग लगाऊँगा, और वह बेन-हदद के महलों को भस्म कर देगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दमिश्क की शहरपनाह के विरुद्ध।” इब्रानी पूर्वसर्ग यहाँ स्थान का थोड़ा भिन्न संबंध व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִצַּתִּי
  choice: और मैं ... आग लगाऊँगा
  rationale: हिफ़ील पूर्ण, प्रथम पुरुष एकवचन, संदर्भ में भविष्यसूचक न्याय की भावी क्रिया व्यक्त करता है। यह चयन परमेश्वर की प्रत्यक्ष कारक भूमिका और स्वाभाविक आधुनिक हिन्दी—दोनों को बनाए रखता है।
- source_word: אֵשׁ
  choice: आग
  rationale: हिन्दी में ‘आग लगाना’ स्वाभाविक मुहावरा है और यहाँ अलग अनिश्चित उपपद की आवश्यकता नहीं है।
- source_word: בְּחוֹמַת
  choice: शहरपनाह में
  rationale: ב का मूल स्थानिक भाव ‘में’ रखा गया है। חוֹמָה के लिए ‘शहरपनाह’ किलेबंद नगर की रक्षात्मक दीवार को साधारण ‘दीवार’ से अधिक ठीक व्यक्त करता है। स्थानिक अर्थ में हल्की अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: דַּמָּשֶׂק
  choice: दमिश्क
  rationale: स्थान-नाम का हिन्दी बाइबल परंपरा में प्रचलित रूप।
- source_word: וְאָכְלָה
  choice: और वह ... भस्म कर देगी
  rationale: स्त्रीलिंग क्रिया का कर्ता ‘आग’ है। अग्नि के विनाशकारी प्रभाव के लिए ‘भस्म कर देना’ स्वाभाविक और प्रबल हिन्दी है तथा क्रिया के ‘खा जाना/नष्ट कर देना’ भाव को संदर्भानुकूल व्यक्त करता है।
- source_word: אַרְמְנוֹת
  choice: महलों
  rationale: यह शब्द महल अथवा किलेबंद राजकीय भवनों को सूचित कर सकता है। बेन-हदद से जुड़े राजकीय भवनों के संदर्भ में ‘महल’ सबसे सहज चयन है, जबकि दुर्ग-सदृश अर्थ को अनावश्यक रूप से निश्चित नहीं किया गया।
- source_word: בֶּן הֲדָד
  choice: बेन-हदद
  rationale: अरामी राजकीय नाम/उपाधि का स्पष्ट और प्रचलित देवनागरी लिप्यंतरण।
theological_decisions:
- issue: अंतर्निहित दिव्य वक्ता और न्याय का कर्ता
  choice: प्रथम पुरुष कथन को सीधे ‘मैं ... लगाऊँगा’ के रूप में रखा गया है।
  alternative: ‘यहोवा कहता है’ जैसे परिचय को पद में जोड़ना।
  rationale: संदर्भ में वक्ता यहोवा है, पर इस पद में उनका नाम फिर से नहीं आता। अनुवाद प्रत्यक्ष दिव्य कर्तृत्व को बनाए रखते हुए मूल में अनुपस्थित शब्द नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज भविष्यसूचक न्याय-वचन। ‘शहरपनाह’ नगर की किलेबंद दीवार के लिए सटीक और व्यापक रूप से बोधगम्य है; ‘भस्म कर देगी’ अग्नि की छवि को स्वाभाविक हिन्दी में प्रबलता से रखता है।
