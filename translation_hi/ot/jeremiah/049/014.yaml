id: JER.49.14
reference: Jeremiah 49:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: שְׁמוּעָ֤ה שָׁמַ֨עְתִּי֙ מֵ/אֵ֣ת יְהוָ֔ה וְ/צִ֖יר בַּ/גּוֹיִ֣ם שָׁל֑וּחַ הִֽתְקַבְּצוּ֙ וּ/בֹ֣אוּ עָלֶ֔י/הָ וְ/ק֖וּמוּ לַ/מִּלְחָמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/014.yaml
  text: 'I have heard a report from Yahweh[a], and a messenger has been sent among the nations: “Gather yourselves, and come against her[b], and rise up for battle.”'
translation:
  language: hi
  text: 'मैंने याहवे से एक समाचार सुना है, और राष्ट्रों के बीच एक दूत[a] भेजा गया है: “इकट्ठे हो जाओ, उसके विरुद्ध[b] आओ, और युद्ध के लिए उठ खड़े हो।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “प्रतिनिधि” अथवा “राजदूत।”
    reason: lexical_alternative
  - marker: b
    text: “उसके” से आशय एदोम है, जिसे आसपास के संदर्भ में एक स्त्री के रूप में प्रस्तुत किया गया है।
    reason: cross_reference
lexical_decisions:
- source_word: שְׁמוּעָה
  choice: एक समाचार
  rationale: यह संज्ञा सुनी हुई खबर या संदेश को दर्शाती है। ‘समाचार’ आधुनिक हिन्दी में स्वाभाविक है और भविष्यद्वाणी की घोषणा के संदर्भ में उपयुक्त बैठता है।
- source_word: שָׁמַעְתִּי
  choice: मैंने ... सुना है
  rationale: इब्रानी पूर्ण क्रिया को यहाँ वर्तमान से जुड़ी हुई प्राप्त सूचना के रूप में ‘सुना है’ कहना स्वाभाविक है।
- source_word: מֵאֵת יְהוָה
  choice: याहवे से
  rationale: מֵאֵת स्रोत को दर्शाता है, और परमेश्वर के नाम יהוה को लिप्यंतरित करके ‘याहवे’ रखा गया है।
- source_word: צִיר
  choice: एक दूत
  rationale: शब्द संदेशवाहक, राजदूत या प्रतिनिधि को सूचित कर सकता है। ‘दूत’ व्यापक, संक्षिप्त और युद्ध-संदेश के संदर्भ में स्पष्ट है; राजनयिक अर्थ की संभावना पादटिप्पणी में रखी गई है।
- source_word: בַּגּוֹיִם
  choice: राष्ट्रों के बीच
  rationale: גּוֹיִם यहाँ आसपास के राष्ट्रों को दर्शाता है; בְּ का स्थानिक अर्थ ‘के बीच’ से सुरक्षित रहता है।
- source_word: שָׁלוּחַ
  choice: भेजा गया है
  rationale: निष्क्रिय कृदंत दूत को भेजे जा चुके प्रतिनिधि के रूप में प्रस्तुत करता है; हिन्दी का पूर्ण पक्ष इसके वर्तमान महत्त्व को व्यक्त करता है।
- source_word: הִתְקַבְּצוּ
  choice: इकट्ठे हो जाओ
  rationale: बहुवचन आत्मवाचक आज्ञा को सहज आधुनिक हिन्दी में सामूहिक बुलावे के रूप में व्यक्त किया गया है।
- source_word: וּבֹאוּ עָלֶיהָ
  choice: उसके विरुद्ध आओ
  rationale: सैन्य संदर्भ में בוא על किसी लक्ष्य के विरुद्ध आगे बढ़ने को दर्शाता है। यह अनुवाद आक्रमण का भाव रखता है, पर मूल क्रिया ‘आना’ को अनावश्यक रूप से ‘आक्रमण करना’ नहीं बनाता।
- source_word: וְקוּמוּ לַמִּלְחָמָה
  choice: युद्ध के लिए उठ खड़े हो
  rationale: यह युद्ध में सक्रिय होने का आह्वान है। ‘उठ खड़े हो’ קום की क्रियात्मक शक्ति और ‘युद्ध के लिए’ לַמִּלְחָמָה का उद्देश्य दोनों बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला विशिष्ट वाचा-नाम सीधे प्रयुक्त है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे सामान्य उपाधि में नहीं बदलता।
- issue: עָלֶיהָ में स्त्रीलिंग लक्ष्य
  choice: उसके विरुद्ध
  alternative: उस स्त्री के विरुद्ध / एदोम के विरुद्ध
  rationale: इब्रानी सर्वनाम स्त्रीलिंग एकवचन है और संदर्भ में स्त्रीरूप में प्रस्तुत एदोम की ओर संकेत करता है। हिन्दी मुख्य पाठ में ‘उसके’ स्वाभाविक है; संदर्भगत पहचान पादटिप्पणी में स्पष्ट की गई है, ताकि मूल की परोक्षता बनी रहे।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक पाठ के लिए सहज रखी गई है। आज्ञाओं में सीधे बहुवचन रूप हैं। ‘राष्ट्र’ ने जातीय या बाद की धार्मिक अर्थछाया से बचते हुए גּוֹיִם का राजनीतिक-सामूहिक अर्थ रखा है।
