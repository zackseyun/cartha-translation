reference: Jeremiah 49:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לִ/בְנֵ֣י עַמּ֗וֹן כֹּ֚ה אָמַ֣ר יְהוָ֔ה הֲ/בָנִ֥ים אֵין֙ לְ/יִשְׂרָאֵ֔ל אִם יוֹרֵ֖שׁ אֵ֣ין ל֑/וֹ מַדּ֗וּעַ יָרַ֤שׁ מַלְכָּ/ם֙ אֶת גָּ֔ד וְ/עַמּ֖/וֹ בְּ/עָרָ֥י/ו יָשָֽׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/001.yaml
  text: 'Concerning the sons of Ammon[a], thus says Yahweh: Does Israel have no sons? Does he have no heir? Why then has Milcom taken possession of Gad, and his people settled in its cities?'
translation:
  language: hi
  text: 'अम्मोनियों के विषय में यहोवा यों कहता है:


    “क्या इस्राएल के कोई पुत्र नहीं हैं?


    क्या उसका कोई वारिस नहीं है?


    फिर मिल्कोम[a] ने गाद पर अधिकार क्यों कर लिया,


    और उसके लोग गाद के नगरों में क्यों बस गए?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में “मिल्कोम” को “उनका राजा” भी पढ़ा जा सकता है: “फिर उनके राजा ने गाद पर अधिकार क्यों कर लिया...?”'
    reason: alternative_reading
lexical_decisions:
- source_word: לִבְנֵי עַמּוֹן
  choice: अम्मोनियों के विषय में
  rationale: ל शीर्षक में विषय का संकेत देता है। शाब्दिक ‘अम्मोन के पुत्रों’ की अपेक्षा आधुनिक हिन्दी में ‘अम्मोनियों’ स्वाभाविक और स्पष्ट जातिवाचक रूप है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिवाचक नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ रखा गया है।
- source_word: הֲבָנִים אֵין לְיִשְׂרָאֵל
  choice: क्या इस्राएल के कोई पुत्र नहीं हैं?
  rationale: בנים का अर्थ ‘पुत्र’ है और यहाँ भूमि के उत्तराधिकार का तर्क प्रमुख है; इसलिए व्यापक ‘सन्तान’ के बजाय ‘पुत्र’ रखा गया है।
- source_word: אִם יוֹרֵשׁ אֵין לוֹ
  choice: क्या उसका कोई वारिस नहीं है?
  rationale: אִם यहाँ पिछले प्रश्न को आगे बढ़ाने वाला प्रश्नसूचक/विकल्पसूचक पद है। एकवचन יוֹרֵשׁ के लिए ‘वारिस’ स्वाभाविक है।
- source_word: מַדּוּעַ יָרַשׁ
  choice: फिर ... ने ... पर अधिकार क्यों कर लिया
  rationale: ירש यहाँ किसी भूभाग को अपने अधिकार में लेने का बोध देता है। ‘अधिकार कर लिया’ भूमि और उत्तराधिकार की छाया बनाए रखते हुए सहज हिन्दी देता है।
- source_word: מַלְכָּם
  choice: मिल्कोम
  rationale: व्यंजन-पाठ को अम्मोनी देवता मिल्कोम के नाम के रूप में लिया गया है; सम्भव वैकल्पिक अर्थ ‘उनका राजा’ पादटिप्पणी में सुरक्षित है।
- source_word: אֶת גָּד
  choice: गाद पर
  rationale: मूल में केवल ‘गाद’ है; सन्दर्भ में यह गाद के भूभाग को सूचित करता है। ‘पर’ अधिकार ग्रहण करने की हिन्दी संरचना के अनुकूल है।
- source_word: וְעַמּוֹ בְּעָרָיו יָשָׁב
  choice: और उसके लोग उसके नगरों में क्यों बस गए?
  rationale: पहला ‘उसके’ मिल्कोम के लोगों अर्थात अम्मोनियों को और दूसरा गाद से सम्बद्ध नगरों को सन्दर्भानुसार व्यक्त करता है। समान सर्वनाम मूल की वास्तविक संदर्भगत अस्पष्टता को कुछ सीमा तक बनाए रखता है; प्रश्नसूचक ‘क्यों’ संयुक्त वाक्य में स्वाभाविक रूप से दोहराया गया है।
theological_decisions:
- issue: מַלְכָּם का पाठ
  choice: मिल्कोम—अम्मोनियों का देवता
  alternative: उनका राजा
  rationale: मसोरेटिक स्वरांकन और अम्मोन से जुड़ा सन्दर्भ देवता मिल्कोम के नाम का समर्थन करते हैं, पर वही व्यंजन ‘उनका राजा’ भी पढ़े जा सकते हैं। इस वास्तविक पाठगत/अर्थगत सम्भावना को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में भविष्यद्वाणी की गरिमा रखते हुए छोटे, स्पष्ट आलंकारिक प्रश्न दिए गए हैं। जातिवाचक ‘अम्मोनियों’ सामान्य पाठक के लिए ‘अम्मोन के पुत्रों’ से अधिक स्वाभाविक है। मुख्य पाठ में पादटिप्पणी चिह्न [a] उसी पद के शीर्षक के साथ उपस्थित है।
