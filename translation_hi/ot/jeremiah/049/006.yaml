base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/006.yaml
  text: But afterward I will restore the fortunes of the people of Ammon[a], declares Yahweh.
translation:
  language: hi
  text: परन्तु इसके बाद मैं अम्मोन के लोगों की स्थिति फिर से बहाल करूँगा[a], याहवे की यह घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अम्मोन के लोगों की बन्धुआई को लौटा लाऊँगा।” इब्रानी मुहावरा बन्धुआई के उलट दिए जाने या, अधिक व्यापक रूप से, उनकी स्थिति की पुनर्बहाली का अर्थ दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: परन्तु इसके बाद
  rationale: यह पद न्याय के बाद पुनर्स्थापना की ओर मोड़ दिखाता है। ‘इसके बाद’ कालक्रम को और ‘परन्तु’ प्रसंगगत विरोध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אָשִׁיב
  choice: मैं ... फिर सुधार दूँगा
  rationale: שוב के हिफ़ील रूप का अर्थ यहाँ वापस लाना या पुनर्स्थापित करना है। שְׁבוּת के साथ मिलकर यह किसी समुदाय की दशा पलटने का सूत्र है।
- source_word: אֶת שְׁבוּת
  choice: की दशा फिर सुधार दूँगा
  rationale: यह इब्रानी मुहावरा केवल बन्दी अवस्था से वापसी तक सीमित न होकर व्यापक पुनर्बहाली भी व्यक्त कर सकता है। सरल आधुनिक हिन्दी में ‘दशा फिर सुधार दूँगा’ उस व्यापक अर्थ को रखता है; शाब्दिक सम्भावना पादटिप्पणी में दी गई है।
- source_word: בְּנֵי עַמּוֹן
  choice: अम्मोन के लोगों
  rationale: शाब्दिक रूप से ‘अम्मोन के पुत्र’; यहाँ इसका आशय अम्मोन के जातीय या राष्ट्रीय समुदाय से है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: मानक भविष्यद्वाणी-सूत्र को गरिमापूर्ण और स्पष्ट हिन्दी में व्यक्त किया गया है तथा יהוה को उसके व्यक्तिगत नाम ‘याहवे’ से रखा गया है।
theological_decisions:
- issue: न्याय के बाद अम्मोन के लिए पुनर्स्थापना की प्रतिज्ञा
  choice: इसे अम्मोन के लोगों के लिए भविष्य में होने वाली वास्तविक पुनर्बहाली की प्रतिज्ञा के रूप में रखा गया है, पर उसके स्वरूप और सीमा को अनिर्धारित छोड़ा गया है।
  alternative: इसे केवल राजनीतिक पुनर्स्थापना मानना, या इसके राष्ट्रीय सन्दर्भ से अलग केवल आत्मिक अर्थ देना।
  rationale: इब्रानी पाठ पुनर्स्थापना का आश्वासन देता है, लेकिन यह नहीं बताता कि वह पूर्णतः किस रूप में होगी। इसलिए अनुवाद पाठ की वास्तविक अस्पष्टता और धर्मवैज्ञानिक तनाव बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य। ‘परन्तु’ न्याय से पुनर्स्थापना की ओर प्रसंगगत मोड़ दिखाता है। दिव्य नाम को ‘याहवे’ के रूप में लिप्यन्तरित किया गया है।
