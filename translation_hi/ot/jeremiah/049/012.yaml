base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/012.yaml
  text: 'For thus says Yahweh: Behold[a], those who were not sentenced to drink the cup will surely drink, and are you the one who will go unpunished? You will not go unpunished[c][b], for you will surely drink.'
translation:
  language: hi
  text: 'क्योंकि यहोवा यों कहता है: “देख, जिनके लिए कटोरा[c] पीना न्यायोचित नहीं था,[a] वे निश्चय ही पीएँगे; और क्या तू ही दण्ड से बच जाएगा? तू दण्ड से नहीं बचेगा,[b] क्योंकि तू निश्चय ही पीएगा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिनके लिए कटोरा पीना उनका न्यायोचित भाग नहीं था,” अथवा “जिन्हें कटोरा पीने का दण्ड नहीं सुनाया गया था।” इब्रानी शब्द מִשְׁפָּט का अर्थ ‘न्याय,’ ‘न्यायिक निर्णय’ या ‘नियत भाग’ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “क्या तू सचमुच निर्दोष ठहराया जाएगा? तू निर्दोष नहीं ठहराया जाएगा।”
    reason: lexical_alternative
  - marker: c
    text: “कटोरा” भविष्यद्वक्ताओं में उस न्याय या दण्ड का चित्र है जिसे परमेश्वर राष्ट्रों को पीने के लिए देता है।
    reason: cross_reference
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के विशिष्ट वाचा-नाम का प्रचलित और पहचाना हुआ रूप; इसे सामान्य उपाधि ‘प्रभु’ से नहीं बदला गया।
- source_word: הִנֵּה
  choice: देख
  rationale: भविष्यद्वक्ता के ध्यान आकर्षित करने वाले संकेत और कथन की गंभीरता को सहज आधुनिक हिन्दी में रखता है।
- source_word: אֲשֶׁר אֵין מִשְׁפָּטָם לִשְׁתּוֹת הַכּוֹס
  choice: जिनके लिए कटोरा पीना न्यायानुसार ठहराया नहीं गया था
  rationale: מִשְׁפָּט के ‘न्यायिक निर्णय/उचित ठहराव/नियत दण्ड’ के अर्थ-क्षेत्र को बनाए रखता है और केवल ‘दोषी ठहराए गए’ कहकर अस्पष्टता को अत्यधिक सीमित नहीं करता।
- source_word: הַכּוֹס
  choice: कटोरा
  rationale: मूल रूपक को ज्यों का त्यों रखा गया है; मुख्य पाठ में ‘क्रोध का कटोरा’ जोड़ना मूल से अधिक व्याख्यात्मक होता।
- source_word: שָׁתוֹ יִשְׁתּוּ
  choice: निश्चय ही उसे पिएँगे
  rationale: क्रिया के साथ infinitive absolute द्वारा व्यक्त निश्चितता और बल को स्वाभाविक हिन्दी में दर्शाता है।
- source_word: נָקֹה תִּנָּקֶה ... לֹא תִנָּקֶה
  choice: क्या तू ही दण्ड से बच जाएगा? तू दण्ड से नहीं बचेगा
  rationale: נקה के निर्दोष ठहरने अथवा दण्ड से छूटने के न्यायिक-पारितोषिक अर्थ को प्रसंगानुकूल हिन्दी में व्यक्त करता है; वैकल्पिक ‘निर्दोष ठहराया जाएगा’ पादटिप्पणी में सुरक्षित है।
- source_word: כִּי שָׁתֹה תִּשְׁתֶּה
  choice: क्योंकि तू निश्चय ही उसे पिएगा
  rationale: दोहराई गई emphatic Hebrew construction की अनिवार्यता और निश्चितता को स्पष्ट करता है।
theological_decisions:
- issue: ‘कटोरे’ का रूपक
  choice: मुख्य पाठ में केवल ‘कटोरा’ रखा गया
  alternative: ‘क्रोध का कटोरा’ अथवा ‘दण्ड का कटोरा’
  rationale: इब्रानी पाठ केवल ‘कटोरा’ कहता है। न्याय का रूपक प्रसंग से स्पष्ट किया जा सकता है, पर मुख्य पाठ में ‘क्रोध’ जोड़ना अनावश्यक व्याख्यात्मक विस्तार होगा।
- issue: מִשְׁפָּטָם की न्यायिक अस्पष्टता
  choice: ‘न्यायानुसार ठहराया नहीं गया था’
  alternative: ‘जिन्हें कटोरा पीने का दण्ड नहीं सुनाया गया था’
  rationale: चुना गया रूप न्याय, निर्णय और नियत भाग के बीच मूल की अर्थगत व्यापकता कुछ हद तक बनाए रखता है; पादटिप्पणी अन्य संभावनाएँ बताती है।
- issue: נקה का अर्थ
  choice: ‘दण्ड से बचना’
  alternative: ‘निर्दोष ठहराया जाना’
  rationale: एदोम पर दण्ड की घोषणा के प्रसंग में ‘दण्ड से बचना’ स्वाभाविक है, जबकि न्यायिक ‘निर्दोष ठहरना’ भी वास्तविक शब्दार्थ है और पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गंभीर और मौखिक पाठ के योग्य रखी गई है। एदोम को संबोधित एकवचन ‘तू’ मूल की सीधी और टकरावपूर्ण वाणी को बचाता है। ‘यों कहता है’ भविष्यद्वाणी-सूत्र की गरिमा बनाए रखता है; सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
