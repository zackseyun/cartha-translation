id: JER.49.13
reference: Jeremiah 49:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֣י בִ֤/י נִשְׁבַּ֨עְתִּי֙ נְאֻם יְהוָ֔ה כִּֽי לְ/שַׁמָּ֧ה לְ/חֶרְפָּ֛ה לְ/חֹ֥רֶב וְ/לִ/קְלָלָ֖ה תִּֽהְיֶ֣ה בָצְרָ֑ה וְ/כָל עָרֶ֥י/הָ תִהְיֶ֖ינָה לְ/חָרְב֥וֹת עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/013.yaml
  text: For I have sworn by myself, declares the LORD, that Bozrah will become a horror, a reproach, a ruin, and a curse, and all her cities will become everlasting ruins.
translation:
  language: hi
  text: क्योंकि मैंने अपनी ही शपथ खाई है—यह यहोवा की घोषणा है—कि बोसरा भय का कारण, निंदा का विषय, उजाड़ और शाप बन जाएगा; और उसके सभी नगर सदा के लिए खंडहर हो जाएँगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִי נִשְׁבַּעְתִּי
  choice: मैंने अपनी ही शपथ खाई है
  rationale: इब्रानी में परमेश्वर स्वयं को शपथ का आधार बनाते हैं; ‘अपनी ही’ इस आत्म-संदर्भ को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: נְאֻם יְהוָה
  choice: यह यहोवा की घोषणा है
  rationale: नबी-साहित्य के औपचारिक दैवी वचन-सूत्र को स्पष्ट और गरिमापूर्ण रूप में व्यक्त करता है; व्यक्तिगत नाम יהוה को ‘यहोवा’ रखा गया है।
- source_word: לְשַׁמָּה
  choice: भय का कारण
  rationale: यह शब्द ऐसी विनाशकारी दशा बताता है जिसे देखकर लोग स्तब्ध या भयभीत हों; केवल भौतिक ‘उजाड़’ कहने से अगले पदों के साथ अर्थ-संकीर्णता होती।
- source_word: לְחֶרְפָּה
  choice: निंदा का विषय
  rationale: सार्वजनिक अपमान और तिरस्कार का भाव सुरक्षित रखता है।
- source_word: לְחֹרֶב
  choice: उजाड़
  rationale: ध्वंस और निर्जनता की अवस्था के लिए सहज हिन्दी; पद के अंत में आए बहुवचन חָרְבוֹת के ‘खंडहर’ से आवश्यक भेद भी बना रहता है।
- source_word: לִקְלָלָה
  choice: शाप
  rationale: नगर की दशा ऐसी होगी कि उसका नाम शाप या अभिशाप के उदाहरण के रूप में प्रयुक्त हो; संक्षिप्त मूल संज्ञा की तनावपूर्ण व्यापकता बनाए रखी गई है।
- source_word: חָרְבוֹת עוֹלָם
  choice: सदा के लिए खंडहर
  rationale: स्थायी ध्वंस का भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; עוֹלָם की दीर्घकालिक/स्थायी शक्ति सुरक्षित है।
theological_decisions:
- issue: दैवी आत्म-शपथ
  choice: मैंने अपनी ही शपथ खाई है
  alternative: मैंने अपने जीवन की शपथ खाई है
  rationale: मूल पाठ में केवल בִי, ‘अपने द्वारा/अपनी ही’, है; ‘जीवन’ जोड़ना यहाँ पाठ से अधिक विशिष्ट होता।
- issue: יהוה का निरूपण
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में परमेश्वर का व्यक्तिगत वाचा-नाम है; उसे उपाधि में बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण रखा गया है।
- issue: עוֹלָם की अवधि
  choice: सदा के लिए
  alternative: बहुत समय तक
  rationale: न्याय-वाणी की पूर्ण शक्ति को बनाए रखता है, जबकि वाक्य नगरों के खंडहर बने रहने की बात करता है और इससे कोई अतिरिक्त व्यवस्थित धर्मवैज्ञानिक दावा नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण भविष्यवाणी-संबंधी शैली। समानांतर संज्ञाओं की लय और बोसरा से उसके अधीन नगरों की ओर बढ़ती संरचना को सुरक्षित रखा गया है। कोई पादटिप्पणी आवश्यक नहीं समझी गई।
