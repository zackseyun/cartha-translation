  yaml_path: translation/ot/jeremiah/049/021.yaml
  text: At the sound of their fall the earth quakes[a]; their cry is heard at the Red Sea.
translation:
  language: hi
  text: उनके गिरने की आवाज़ से धरती काँप उठी; उनकी पुकार लाल समुद्र[a] तक सुनाई दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में: “सरकंडों का समुद्र।” परंपरागत अनुवाद: “लाल समुद्र।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקּוֹל
  choice: की आवाज़ से
  rationale: מִן के साथ קוֹל यहाँ स्रोत या कारण का भाव देता है; हिंदी में ‘की आवाज़ से’ इस संबंध को स्वाभाविक और स्पष्ट रखता है।
- source_word: נִפְלָם
  choice: उनके गिरने
  rationale: נפל के मूल ‘गिरना’ रूपक को सुरक्षित रखा गया है; ‘पतन’ संभव है, पर अधिक अमूर्त और व्याख्यात्मक होता।
- source_word: רָעֲשָׁה הָאָרֶץ
  choice: धरती काँप उठती है
  rationale: רעשׁ तीव्र हिलने या काँपने को व्यक्त करता है। ‘काँप उठती है’ विनाशकारी घटना पर धरती की जोरदार प्रतिक्रिया को सहज हिंदी में व्यक्त करता है।
- source_word: צְעָקָה
  choice: उनकी चीख
  rationale: यह संज्ञा पुकार, चीत्कार या चीख को दर्शाती है। संदर्भ में संकट की तीव्रता के कारण ‘चीख’ उपयुक्त है; ‘उनकी’ पिछले बहुवचन प्रत्यय से संबंध स्पष्ट करता है।
- source_word: בְּיַם סוּף
  choice: लाल समुद्र तक
  rationale: יַם־סוּף का पारंपरिक स्थान-नाम ‘लाल समुद्र’ रखा गया है। हिंदी में ‘तक सुनाई देती है’ उस दूरस्थ स्थान तक ध्वनि पहुँचने का भाव स्वाभाविक ढंग से व्यक्त करता है; शाब्दिक विकल्प पाद-टिप्पणी में दिया गया है।
- source_word: נִשְׁמַע קוֹלָהּ
  choice: सुनाई देती है
  rationale: निफ़अल रूप निष्क्रिय अर्थ ‘सुनी जाती है’ देता है, और स्त्रीलिंग प्रत्यय צְעָקָה की ओर लौटता है। हिंदी में ‘उनकी चीख … सुनाई देती है’ अनावश्यक पुनरुक्ति के बिना यही अर्थ रखता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक रूप से सहज है। ‘धरती’ व्यापक, लगभग विश्वव्यापी न्याय-दृश्य को बनाए रखती है, जबकि ‘काँप उठती है’ इब्रानी क्रिया की तीव्रता व्यक्त करता है। पाद-टिप्पणी का चिह्न संबंधित स्थान-नाम के तुरंत बाद रखा गया है।
