base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/017.yaml
  text: Edom will become a desolation[b][a]; everyone who passes by her will be appalled and will whistle at all her wounds.
translation:
  language: hi
  text: एदोम एक उजाड़ स्थान बन जाएगा[a]; उसके पास से होकर जाने वाला हर व्यक्ति स्तब्ध रह जाएगा और उसके सब घावों को देखकर सीटी बजाएगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “भयावह दृश्य” या “भय का कारण।” इब्रानी शब्द उजाड़ होने की दशा और उसे देखकर उत्पन्न होने वाले भयावह विस्मय, दोनों का संकेत दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “फुफकारेगा।” इब्रानी क्रिया विस्मय या उपहास में निकाली जाने वाली तीखी ध्वनि को दर्शाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: हो जाएगा
  rationale: भविष्यसूचक संदर्भ में संयोजक वाव के साथ पूर्ण क्रिया भावी परिणामी अवस्था व्यक्त करती है; आधुनिक हिन्दी में ‘हो जाएगा’ इसे स्वाभाविक रूप से प्रकट करता है।
- source_word: אֱדוֹם
  choice: एदोम
  rationale: राष्ट्र और भूभाग के नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: לְשַׁמָּה
  choice: उजाड़
  rationale: यह शब्द विनाश और उससे उपजने वाले भयावह विस्मय, दोनों का संकेत दे सकता है। मुख्य पाठ में ‘उजाड़’ भौतिक दशा को स्पष्ट रखता है और व्यापक अर्थ को पादटिप्पणी में सुरक्षित किया गया है।
- source_word: כָּל עֹבֵר עָלֶיהָ
  choice: जो कोई उसके पास से गुज़रेगा
  rationale: सामूहिक एकवचन का सहज हिन्दी रूप; स्त्रीलिंग प्रत्यय को हिन्दी में एदोम/भूमि के लिए स्वाभाविक ‘उसके’ से व्यक्त किया गया है।
- source_word: יִשֹּׁם
  choice: चकित रह जाएगा
  rationale: שמם यहाँ उजाड़ देखकर स्तब्ध या भयभीत हो जाने की प्रतिक्रिया व्यक्त करता है; ‘चकित रह जाएगा’ हिन्दी में इस तीव्र विस्मय को सहजता से बताता है।
- source_word: וְיִשְׁרֹק
  choice: सीटी बजाएगा
  rationale: क्रिया विस्मय या उपहास में निकाली गई तीखी ध्वनि को दर्शाती है। ‘सीटी बजाना’ आधुनिक हिन्दी में प्रत्यक्ष और बोधगम्य है; ‘फुफकारना’ विकल्प के रूप में पादटिप्पणी में दिया गया है।
- source_word: עַל כָּל מַכּוֹתֶיהָ
  choice: उसके सब घावों को देखकर
  rationale: מַכּוֹת का मूल अर्थ प्रहार और उससे बने घाव हैं। עַל को यहाँ प्रतिक्रिया के कारण/विषय के रूप में ‘को देखकर’ कहना स्वाभाविक हिन्दी है।
