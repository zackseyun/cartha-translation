source:
  edition: WLC
  text: אֵ֥יךְ לֹֽא עֻזְּבָ֖ה עִ֣יר תהלה קִרְיַ֖ת מְשׂוֹשִֽׂ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/025.yaml
  text: How is the city of praise not abandoned[b][a], the city of my joy?
translation:
  language: hi
  text: प्रशंसा[a] की नगरी को कैसे नहीं छोड़ा गया—वह नगरी जो मेरा आनंद है?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘प्रसिद्ध नगरी’।
    reason: इब्रानी תהלה का शाब्दिक अर्थ ‘प्रशंसा’ है, पर यहाँ इसका आशय प्रशंसित या प्रसिद्ध होने से भी हो सकता है।
  - marker: b
    text: इब्रानी में ‘मेरा आनंद’; इस विलाप में ‘मेरा’ किसकी वाणी है, इस पर मतभेद है।
    reason: प्रथम पुरुष प्रत्यय को बनाए रखते हुए वक्ता की अस्पष्ट पहचान बताना आवश्यक है।
lexical_decisions:
- source_word: אֵיךְ
  choice: कैसे
  rationale: यह प्रश्नवाचक-विस्मयवाचक अव्यय आश्चर्य और विलाप व्यक्त करता है। ‘कैसे’ उसके आलंकारिक बल को बनाए रखता है, बिना उसे केवल कारण पूछने वाले ‘क्यों’ में बदलने के।
- source_word: לֹא עֻזְּבָה
  choice: छोड़ी नहीं गई
  rationale: निषेध לֹא और עזב के स्त्रीलिंग कर्मवाच्य पूर्ण रूप को सीधे व्यक्त करता है। ‘त्यागी नहीं गई’ की अपेक्षा यह सामान्य आधुनिक हिन्दी में अधिक सहज है और नगरी के उजड़ने या खाली कर दिए जाने का भाव खुला रखता है।
- source_word: עִיר תהלה
  choice: प्रशंसा की नगरी
  rationale: עִיר का सामान्य अर्थ ‘नगर/नगरी’ और תהלה का मूल अर्थ ‘प्रशंसा’ है। स्त्रीलिंग ‘नगरी’ काव्यात्मक संदर्भ में स्वाभाविक है; यह अनुवाद ‘प्रसिद्ध नगरी’ के संभावित अर्थ को पादटिप्पणी में रखते हुए मूल रूपक को बचाता है।
- source_word: קִרְיַת
  choice: वह नगर
  rationale: रचनात्मक समानांतरता में पहले पद का पुनर्नामकरण करता है। ‘वह नगर’ हिन्दी में संबंध स्पष्ट करता है और दोनों पदों को अनावश्यक रूप से एक विशेषण-समूह में नहीं मिलाता।
- source_word: מְשׂוֹשִׂי
  choice: मेरा आनंद
  rationale: מָשׂוֹשׂ में प्रथम पुरुष एकवचन प्रत्यय स्पष्ट है। ‘मेरा आनंद’ उसे सीधे बनाए रखता है और वक्ता की पहचान तय नहीं करता।
theological_decisions:
- issue: ‘मेरा आनंद’ में बोलने वाले की पहचान
  choice: प्रथम पुरुष ‘मेरा’ को मूल के अनुसार बनाए रखा गया और वक्ता को मुख्य पाठ में नहीं पहचाना गया।
  alternative: इसे दमिश्क के निवासियों, व्यक्तिरूप दमिश्क, भविष्यद्वक्ता या परमेश्वर की वाणी के रूप में स्पष्ट करना।
  rationale: इब्रानी रूप प्रथम पुरुष को स्पष्ट करता है, पर इस एक वाक्य में वक्ता की पहचान निश्चित नहीं करता। किसी एक पहचान को जोड़ना वास्तविक व्याख्यात्मक अस्पष्टता को समाप्त कर देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘कैसे...नहीं’ की असामान्य किंतु अर्थपूर्ण विस्मयात्मक रचना मूल इब्रानी के तनाव को सुरक्षित रखती है। ‘नगर’ और ‘नगरी’ का क्रम हिन्दी की सहजता तथा इब्रानी समानांतरता दोनों को ध्यान में रखता है।
