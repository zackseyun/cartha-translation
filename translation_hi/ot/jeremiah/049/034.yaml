source:
  edition: WLC
  text: אֲשֶׁ֨ר הָיָ֧ה דְבַר יְהוָ֛ה אֶל יִרְמְיָ֥הוּ הַ/נָּבִ֖יא אֶל עֵילָ֑ם בְּ/רֵאשִׁ֗ית מַלְכ֛וּת צִדְקִיָּ֥ה מֶֽלֶךְ יְהוּדָ֖ה לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/034.yaml
  text: 'The word of Yahweh that came to Jeremiah the prophet concerning Elam[a], at the beginning of the reign of Zedekiah king of Judah, saying:'
translation:
  language: hi
  text: 'याहवे का वह वचन जो यहूदा के राजा सिदकिय्याह के राज्यकाल के आरम्भ में एलाम के विषय में[a] यिर्मयाह नबी को मिला:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘एलाम के विरुद्ध।’ इब्रानी पूर्वसर्ग किसी राष्ट्र के विषय में या उसके विरुद्ध बोली गई भविष्यवाणी का परिचय दे सकता है; प्रसंग के अनुसार इसका अनुवाद ‘के विषय में’ या ‘के विरुद्ध’ हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: דְבַר יְהוָה
  choice: यहोवा का वह वचन
  rationale: भविष्यवाणी की भूमिका में דָּבָר परमेश्वर से प्राप्त वचन या संदेश को दर्शाता है। ‘वचन’ इस परिचित सूत्र की गरिमा बनाए रखता है, और יְהוָה को व्यक्तिगत नाम ‘यहोवा’ के रूप में प्रस्तुत किया गया है।
- source_word: הָיָה ... אֶל יִרְמְיָהוּ הַנָּבִיא
  choice: यिर्मयाह नबी के पास पहुँचा
  rationale: शाब्दिक ‘हुआ/था’ के बजाय हिन्दी में प्रकाशना-सूत्र के लिए ‘के पास पहुँचा’ स्वाभाविक है और אֶל द्वारा सूचित प्राप्तकर्ता को स्पष्ट रखता है।
- source_word: אֶל עֵילָם
  choice: एलाम के विषय में
  rationale: राष्ट्र के साथ אֶל यहाँ भविष्यवाणी का विषय या लक्ष्य बता सकता है। ‘के विषय में’ तटस्थ है और न्यायसूचक ‘के विरुद्ध’ अर्थ को मुख्य पाठ में अनिवार्य नहीं बनाता।
- source_word: בְּרֵאשִׁית מַלְכוּת
  choice: शासन के आरम्भ में
  rationale: מַלְכוּת यहाँ राज्य-प्रदेश नहीं, राजा के शासनकाल को दर्शाता है; पूरा पद समय की आरम्भिक अवधि बताता है।
- source_word: צִדְקִיָּה מֶלֶךְ יְהוּדָה
  choice: यहूदा के राजा सिदकिय्याह
  rationale: हिन्दी की स्वाभाविक पद-रचना में राजकीय पहचान को स्पष्ट रूप से रखा गया है।
- source_word: לֵאמֹר
  choice: कोलन द्वारा अगले कथन की भूमिका
  rationale: यह रूप अगले पद से आरम्भ होने वाले कथन को प्रस्तुत करता है। हिन्दी में वाक्य के अंत का कोलन ‘यह कहते हुए’ की अपेक्षा अधिक स्वाभाविक और समान रूप से पारदर्शी है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम है। हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ को रखा गया है; ‘याहवे’ अधिक प्रत्यक्ष विद्वत् लिप्यंतरण है, पर मुख्य पाठ में किसी उपाधि से नाम को प्रतिस्थापित नहीं किया गया।
- issue: אֶל עֵילָם का आशय
  choice: एलाम के विषय में
  alternative: एलाम के विरुद्ध
  rationale: पूर्वसर्ग भविष्यवाणी के विषय/दिशा के साथ-साथ प्रतिकूल लक्ष्य भी सूचित कर सकता है। मुख्य पाठ तटस्थ सम्भावना रखता है और वैकल्पिक न्यायसूचक अर्थ पाद-टिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। भविष्यवाणी-संबंधी पारंपरिक शब्द ‘वचन’ और ‘नबी’ रखे गए हैं; वाक्यक्रम हिन्दी की स्वाभाविकता के अनुसार व्यवस्थित है।
