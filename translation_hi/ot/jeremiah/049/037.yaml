  text: וְ/הַחְתַּתִּ֣י אֶת עֵ֠ילָם לִ/פְנֵ֨י אֹיְבֵי/הֶ֜ם וְ/לִ/פְנֵ֣י מְבַקְשֵׁ֣י נַפְשָׁ֗/ם וְ/הֵבֵאתִ֨י עֲלֵי/הֶ֧ם רָעָ֛ה אֶת חֲר֥וֹן אַפִּ֖/י נְאֻם יְהוָ֑ה וְ/שִׁלַּחְתִּ֤י אַֽחֲרֵי/הֶם֙ אֶת הַ/חֶ֔רֶב עַ֥ד כַּלּוֹתִ֖/י אוֹתָֽ/ם־׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/037.yaml
  text: I will shatter Elam before their enemies and before those who seek their life[a]. I will bring disaster on them, my burning anger, declares Yahweh[c][b], and I will send the sword after them until I have consumed them.
translation:
  language: hi
  text: मैं एलाम को उनके शत्रुओं के सामने और उनके प्राण लेनेवालों के सामने चकनाचूर कर दूँगा[a][b]। मैं उन पर विपत्ति, अर्थात् अपना धधकता क्रोध, लाऊँगा[c]—याहवे की यह घोषणा है। मैं उनके पीछे तलवार भेजूँगा, जब तक कि मैं उन्हें समाप्त न कर दूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं एलाम को भयभीत कर दूँगा” अथवा “हताश कर दूँगा।” इब्रानी क्रिया आतंक उत्पन्न करने या ध्वस्त कर देने—दोनों का भाव दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ, “जो उनके प्राण को खोजते हैं”; यह इब्रानी मुहावरा उन्हें मार डालने की कोशिश करनेवालों के लिए है।
    reason: lexical_alternative
  - marker: c
    text: यहाँ “विपत्ति” के लिए प्रयुक्त इब्रानी शब्द न्यायस्वरूप आनेवाली आपदा या अनर्थ को दर्शाता है, नैतिक बुराई को नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַחְתַּתִּי
  choice: चकनाचूर कर दूँगा
  rationale: हिफ़ील रूप भयभीत, हतोत्साहित या ध्वस्त कर देने का भाव रखता है। युद्ध और न्याय के प्रसंग में यह चुनाव मानसिक आतंक तथा राष्ट्रीय पराजय—दोनों को समेटता है।
- source_word: עֵילָם
  choice: एलाम
  rationale: स्थान/जनसमूह के नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: לִפְנֵי אֹיְבֵיהֶם
  choice: उसके शत्रुओं के सामने
  rationale: לִפְנֵי का स्वाभाविक अर्थ ‘के सामने/उपस्थिति में’ है। सामूहिक संज्ञा एलाम के साथ हिन्दी में एकवचन सर्वनाम सहज है।
- source_word: מְבַקְשֵׁי נַפְשָׁם
  choice: उसके प्राण के खोजियों
  rationale: इब्रानी मुहावरे ‘उनके प्राण को खोजनेवाले’ का रूपक बचाया गया है; आशय उन्हें मार डालने की चेष्टा करनेवालों से है।
- source_word: וְהֵבֵאתִי עֲלֵיהֶם רָעָה
  choice: मैं उन पर विपत्ति को लाऊँगा
  rationale: न्याय के इस प्रसंग में רָעָה नैतिक बुराई नहीं, विनाशकारी विपत्ति को सूचित करता है।
- source_word: אֶת חֲרוֹן אַפִּי
  choice: अपने धधकते क्रोध
  rationale: यह पदबंध क्रोध की जलती हुई तीव्रता का रूपक रखता है; ‘धधकता क्रोध’ उसे स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: נְאֻם יְהוָה
  choice: यह यहोवा की घोषणा है
  rationale: गंभीर भविष्यवाणी-सूत्र का स्पष्ट और गरिमापूर्ण हिन्दी रूप।
- source_word: יְהוָה
  choice: यहोवा
  rationale: दिव्य नाम को उपाधि से बदलने के बजाय हिन्दी में व्यापक रूप से पहचाने जानेवाले लिप्यंतरण द्वारा व्यक्त किया गया है।
- source_word: וְשִׁלַּחְתִּי אַחֲרֵיהֶם אֶת הַחֶרֶב
  choice: मैं उनके पीछे तलवार भेजूँगा
  rationale: पीछा करती हुई तलवार का सजीव इब्रानी बिंब और אַחֲרֵיהֶם का ‘पीछे’ अर्थ सुरक्षित है।
- source_word: עַד כַּלּוֹתִי אוֹתָם
  choice: जब तक कि मैं उनका अन्त न कर दूँ
  rationale: כלה यहाँ पूर्णतः समाप्त कर देने का अर्थ देता है। यह हिन्दी में स्वाभाविक है और न्याय की समग्रता व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय कार्य के लिए רָעָה का अनुवाद
  choice: विपत्ति
  alternative: बुराई; अनर्थ
  rationale: भविष्यवाणी के न्याय-संदर्भ में शब्द का आशय लाई गई विपत्ति है, नैतिक बुराई नहीं।
- issue: दिव्य नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में निजी दिव्य नाम है; उसे सामान्य उपाधि ‘प्रभु’ में बदलने के बजाय हिन्दी पाठकों के बीच स्थापित लिप्यंतरण चुना गया है।
- issue: אֶת חֲרוֹן אַפִּי का रָעָה से संबंध
  choice: विपत्ति—अपने धधकते क्रोध—को
  alternative: विपत्ति, अर्थात अपने धधकते क्रोध को; विपत्ति और अपना धधकता क्रोध
  rationale: אֶת पदबंध को रָעָה का समानाधिकरण मानते हुए मूल की संक्षिप्तता और तनाव को डैश से रखा गया है; इसे अलग दूसरी वस्तु के रूप में निर्णायक ढंग से नहीं खोला गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिन्दी। ‘प्राण के खोजियों’ में मूल मुहावरा जानबूझकर रखा गया है; संदर्भ से हत्या का आशय स्पष्ट होता है। सामूहिक ‘एलाम’ के लिए पहले एकवचन और आगे मूल के बहुवचन अनुरूप ‘उन पर/उनके’ रखा गया है, जिससे मूल की सामूहिकता सुरक्षित रहती है।
