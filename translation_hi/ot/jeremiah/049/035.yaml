source:
  edition: WLC
  text: כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת הִנְ/נִ֥י שֹׁבֵ֖ר אֶת קֶ֣שֶׁת עֵילָ֑ם רֵאשִׁ֖ית גְּבוּרָתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/035.yaml
  text: 'Thus says Yahweh of hosts: Behold[a], I am breaking the bow of Elam, the chief of their might.'
translation:
  language: hi
  text: 'सेनाओं का याहवे यों कहता है: “देखो, मैं एलाम का धनुष तोड़ने जा रहा हूँ, जो उनके पराक्रम का प्रमुख अंग है।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: यह कहता है
  rationale: यह नबूवत की वाणी आरम्भ करने वाला मानक सूत्र है; हिन्दी में ‘यह कहता है’ औपचारिकता और प्रत्यक्ष घोषणा, दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का याहवे
  rationale: व्यक्तिगत ईश्वरीय नाम को ‘याहवे’ के रूप में रखा गया है और צְבָאוֹת की व्यापक सैन्य तथा स्वर्गीय पृष्ठभूमि के लिए प्रचलित ‘सेनाओं का’ चुना गया है।
- source_word: הִנְנִי
  choice: देखो, मैं
  rationale: यह ध्यान आकर्षित करने के साथ याहवे की बलपूर्ण और निकट कार्रवाई पर जोर देता है।
- source_word: שֹׁבֵר
  choice: तोड़ने जा रहा हूँ
  rationale: הִנְנִי के साथ कृदन्त निकट, निश्चित कार्रवाई व्यक्त करता है; यह हिन्दी में केवल चल रही क्रिया का भ्रामक अर्थ दिए बिना उस भाव को स्वाभाविक रूप से रखता है।
- source_word: קֶשֶׁת עֵילָם
  choice: एलाम के धनुष
  rationale: एकवचन ‘धनुष’ मूल सैन्य बिम्ब को बनाए रखता है और उसे सामान्य सैन्य शक्ति जैसे अधिक व्याख्यात्मक पद से नहीं बदलता।
- source_word: רֵאשִׁית גְּבוּרָתָם
  choice: जो उनके पराक्रम में प्रधान है
  rationale: यह धनुष को एलाम के सामर्थ्य का प्रमुख तत्व बताने वाली समानाधिकरणीय अभिव्यक्ति को सहज हिन्दी में रखता है, जबकि ‘प्रधान भाग’ और ‘मुख्य आधार’ के बीच की अर्थगत गुंजाइश को पादटिप्पणी में सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम सीधे प्रयुक्त है; उसे किसी उपाधि से बदलने के बजाय देवनागरी में ‘याहवे’ रूप में लिप्यंतरित किया गया है।
- issue: एलाम के धनुष और उसके पराक्रम का सम्बन्ध
  choice: धनुष उनके पराक्रम में प्रधान है
  alternative: धनुष उनकी शक्ति का मुख्य आधार है
  rationale: मूल का רֵאשִׁית ‘प्रधान/प्रमुख भाग’ या ‘मुख्य आधार’ का भाव दे सकता है। मुख्य पाठ अपेक्षाकृत औपचारिक और कम व्याख्यात्मक रूप रखता है; अधिक साधनात्मक अर्थ को निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण नबूवती लहजा रखा गया है। वाक्यरचना सामान्य पाठक के लिए सहज है, और मूल सैन्य बिम्ब तथा ईश्वरीय घोषणा की तत्परता सुरक्षित रखी गई है।
