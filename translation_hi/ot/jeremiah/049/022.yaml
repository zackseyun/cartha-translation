source:
  edition: WLC
  text: הִנֵּ֤ה כַ/נֶּ֨שֶׁר֙ יַעֲלֶ֣ה וְ/יִדְאֶ֔ה וְ/יִפְרֹ֥שׂ כְּנָפָ֖י/ו עַל בָּצְרָ֑ה וְֽ֠/הָיָה לֵ֞ב גִּבּוֹרֵ֤י אֱדוֹם֙ בַּ/יּ֣וֹם הַ/ה֔וּא כְּ/לֵ֖ב אִשָּׁ֥ה מְצֵרָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/022.yaml
  text: Behold[a], like an eagle he will rise up and swoop down and spread his wings over Bozrah, and the heart of Edom’s warriors on that day will become like the heart of a woman in labor.
translation:
  language: hi
  text: देखो[a], वह उकाब के समान ऊपर उठेगा और उड़ेगा और अपने पंख बोस्रा के ऊपर फैलाएगा, और उस दिन एदोम के वीरों का हृदय प्रसव-पीड़ा से पीड़ित स्त्री के हृदय के समान हो जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “गिद्ध के समान”; इब्रानी शब्द व्यापक अर्थ में किसी बड़े शिकारी पक्षी के लिए भी प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह भविष्यवाणी में ध्यान आकर्षित करने वाले उद्गार को स्वाभाविक, वर्तमान मानक हिन्दी में बनाए रखता है।
- source_word: כַנֶּשֶׁר
  choice: उकाब के समान
  rationale: נֶשֶׁר किसी बड़े शिकारी पक्षी, सम्भवतः गिद्ध, को भी सूचित कर सकता है; मुख्य पाठ में परम्परागत और प्रसंगानुकूल ‘उकाब’ रखा गया है और विकल्प पादटिप्पणी में दिया गया है।
- source_word: יַעֲלֶה וְיִדְאֶה
  choice: ऊपर उठेगा और तेजी से उड़ेगा
  rationale: पहला क्रियापद ऊपर जाने और दूसरा तीव्र उड़ान का बोध कराता है। यह अनुवाद मूल में स्पष्ट न किए गए नीचे झपटने के भाव को नहीं जोड़ता।
- source_word: וְיִפְרֹשׂ כְּנָפָיו עַל בָּצְרָה
  choice: अपने पंख बोस्रा के ऊपर फैलाएगा
  rationale: पंख फैलाने की सजीव छवि और עַל का स्थानगत अर्थ ‘ऊपर’ सुरक्षित रहता है।
- source_word: לֵב גִּבּוֹרֵי אֱדוֹם
  choice: एदोम के वीरों का हृदय
  rationale: ‘वीर’ सैन्य सामर्थ्य वाले पुरुषों को दर्शाता है और ‘हृदय’ को ‘साहस’ कहकर व्याख्यायित करने के बजाय मूल रूपक बनाए रखता है।
- source_word: וְהָיָה ... כְּלֵב אִשָּׁה מְצֵרָה
  choice: प्रसव-पीड़ा में पड़ी स्त्री के हृदय के समान हो जाएगा
  rationale: וְהָיָה के परिणामस्वरूप उत्पन्न दशा को ‘हो जाएगा’ व्यक्त करता है; מְצֵרָה की प्रसव-वेदना और व्याकुलता की छवि भी सुरक्षित रहती है।
theological_decisions:
- issue: उकाब-समान आक्रमणकारी की पहचान
  choice: एकवचन ‘वह’ रखा गया, पर उसकी पहचान नहीं जोड़ी गई।
  alternative: बाबुल का राजा/नबूकदनेस्सर, यहोवा द्वारा निर्देशित न्याय, अथवा कोई अनिर्दिष्ट आक्रमणकारी
  rationale: निकटवर्ती प्रसंग बाबुली आक्रमणकारी की ओर संकेत करता है, पर इस पद में कर्ता का नाम नहीं है। अनुवाद पाठ की इस खुली हुई पहचान को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘देखो’ भविष्यवाणी की चेतावनीपूर्ण शैली बनाए रखता है; ‘उकाब’ और ‘बोस्रा’ जैसे रूप हिन्दी बाइबलीय नामावली के अनुरूप हैं।
