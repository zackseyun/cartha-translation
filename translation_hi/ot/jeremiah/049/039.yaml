    text: या, “मैं एलाम की बन्धुआई को वापस लौटा दूँगा,” अथवा “मैं एलाम के बन्दियों को लौटा लाऊँगा।” इब्रानी पुनर्स्थापना-सूत्र विशेष रूप से बन्धुआई से वापसी, या अधिक व्यापक रूप से बिगड़ी स्थिति की बहाली का संकेत दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: परन्तु
  rationale: यह पद पिछले न्याय-वचन के बाद भविष्य में होने वाले उलटाव को प्रस्तुत करता है; हिन्दी में ‘परन्तु’ इस विरोधात्मक मोड़ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: अन्त के दिनों में
  rationale: यह भविष्य के समय के लिए प्रयुक्त भविष्यद्वाणी-संबंधी मुहावरा है, जिसमें अन्तकाल-संबंधी अर्थ की सम्भावना बनी रहती है, पर कोई विशिष्ट समय-सारणी निर्धारित नहीं होती।
- source_word: אשוב אֶת שבית
  choice: मैं ... की दशा फिर सुधार दूँगा
  rationale: यह इब्रानी पुनर्स्थापना-सूत्र बन्धुआई से वापसी, बन्दियों को लौटाने या व्यापक रूप से बिगड़ी दशा के पलटने का संकेत दे सकता है। मुख्य पाठ में स्वाभाविक और व्यापक अर्थ रखा गया है।
- source_word: עֵילָם
  choice: एलाम
  rationale: राष्ट्र अथवा क्षेत्र के नाम का प्रचलित हिन्दी लिप्यन्तरण।
- source_word: נְאֻם יְהוָה
  choice: यहोवा की यह घोषणा है
  rationale: यह गम्भीर भविष्यद्वाणी-सूत्र को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता और परमेश्वर के व्यक्तिगत नाम को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार अक्षरों वाले इब्रानी दिव्य नाम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित रूप ‘यहोवा’ से प्रस्तुत किया गया है।
