  rationale: इब्रानी अभिव्यक्ति किसी संकीर्ण अर्थ तक स्पष्ट रूप से सीमित नहीं है। मुख्य पाठ व्यापक पुनर्स्थापना व्यक्त करता है और अधिक शाब्दिक सम्भावना पाद-टिप्पणी में सुरक्षित रखी गई है।
