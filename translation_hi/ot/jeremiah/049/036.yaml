base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/036.yaml
  text: I will bring against Elam the four winds from the four ends of the heavens[a], and I will scatter them to all these winds[b]. There will be no nation to which the outcasts of Elam will not go.
translation:
  language: hi
  text: मैं आकाश के चारों छोरों से चार हवाएँ एलाम पर ले आऊँगा[a], और एलाम के लोगों को इन सब हवाओं की ओर तितर-बितर कर दूँगा। ऐसा कोई राष्ट्र नहीं होगा, जहाँ एलाम के निर्वासित लोग न पहुँचें[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आकाश के चारों कोनों से।”
    reason: lexical_alternative
  - marker: b
    text: या “एलाम के बिखेरे गए लोग” अथवा “एलाम से निकाले गए लोग।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבֵאתִי אֶל עֵילָם
  choice: मैं एलाम पर ... चलाऊँगा
  rationale: हिफ़ील क्रिया और אֶל इस न्याय-संदर्भ में प्रतिकूल रूप से किसी वस्तु को एलाम पर लाने का भाव देते हैं। हवाओं के साथ हिन्दी में ‘हवाएँ चलाना’ स्वाभाविक है और शत्रुतापूर्ण कार्रवाई स्पष्ट करता है।
- source_word: אַרְבַּע רוּחוֹת
  choice: चारों हवाएँ
  rationale: यहाँ רוּחוֹת दिशाओं से आने वाली हवाओं को सूचित करता है; अगले पदबंध ‘आकाश के चारों छोरों से’ से यही अर्थ पुष्ट होता है।
- source_word: מֵאַרְבַּע קְצוֹת הַשָּׁמַיִם
  choice: आकाश के चारों छोरों से
  rationale: קְצוֹת का मूल भाव छोर या सीमाएँ है। ‘चारों छोर’ स्रोत के स्थानिक बिंब को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וְזֵרִתִים
  choice: और उन्हें ... तितर-बितर कर दूँगा
  rationale: זרה यहाँ पछोरने से उत्पन्न बिखराव के न्याय-बिंब को व्यक्त करता है। ‘तितर-बितर’ व्यापक और बलपूर्ण बिखराव को सहज हिन्दी में बताता है।
- source_word: לְכֹל הָרֻחוֹת הָאֵלֶּה
  choice: इन सभी हवाओं की ओर
  rationale: दूसरी बार भी ‘हवाएँ’ रखने से इब्रानी का दोहराया हुआ बिंब सुरक्षित रहता है; यह विभिन्न दिशाओं की ओर बिखराव भी सूचित करता है।
- source_word: וְלֹא יִהְיֶה הַגּוֹי אֲשֶׁר לֹא יָבוֹא שָׁם
  choice: कोई ऐसा राष्ट्र नहीं होगा, जहाँ ... न पहुँचें
  rationale: यह रचना मूल के दोहरे निषेध और सर्वव्यापी बिखराव को स्वाभाविक हिन्दी में बनाए रखती है। ‘पहुँचें’ गमन के परिणाम को स्पष्ट करता है।
- source_word: נִדְּחֵי עֵילָם
  choice: एलाम से निकाले गए लोग
  rationale: נִדְּחֵי उन लोगों को दर्शाता है जिन्हें खदेड़कर, निर्वासित करके या बिखेरकर दूर किया गया हो। ‘निकाले गए लोग’ सामान्य पाठक के लिए स्पष्ट है और कारणगत निष्कासन का भाव रखता है।
