  yaml_path: translation/ot/jeremiah/049/029.yaml
  text: They will take their tents and their flocks; they will carry off their tent curtains and all their goods and their camels[a], and they will cry out against them, “Terror on every side!”
translation:
  language: hi
  text: वे उनके तंबू और भेड़-बकरियों के झुंड ले लेंगे; उनके तंबुओं के परदे, उनका सारा सामान और उनके ऊँट उठा ले जाएँगे। वे उनके विरुद्ध पुकारेंगे[a], “चारों ओर आतंक!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “वे उनके विषय में पुकारेंगे” या “वे उनके ऊपर पुकारेंगे” भी हो सकता है। इब्रानी वाक्य-रचना किसी के विरुद्ध, उसके विषय में, या उसके ऊपर की गई पुकार का बोध करा सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אָהֳלֵיהֶם
  choice: उनके तंबू
  rationale: אֹהֶל खानाबदोशों के चलायमान निवास को दर्शाता है; प्रसंग में ‘तंबू’ स्वाभाविक और सटीक है।
- source_word: צֹאנָם
  choice: भेड़-बकरियों के झुंड
  rationale: צֹאן छोटे पालतू पशुओं, विशेषकर भेड़ और बकरियों, का सामूहिक बोध कराता है; यह हिन्दी में अर्थ को ‘झुंड’ से अधिक स्पष्ट करता है।
- source_word: יִקָּחוּ
  choice: ले लेंगे
  rationale: לקח का मूल अर्थ ‘लेना’ है। युद्ध और लूट का भाव प्रसंग से स्पष्ट है, इसलिए अनावश्यक रूप से अधिक तीखा ‘छीन लेंगे’ नहीं चुना गया।
- source_word: יְרִיעוֹתֵיהֶם
  choice: उनके तंबुओं के परदे
  rationale: יְרִיעָה तंबू के कपड़े के परदे या पट को सूचित करता है; केवल ‘परदे’ कहने से संदर्भ अस्पष्ट हो सकता था।
- source_word: כָּל־כְּלֵיהֶם
  choice: उनका सारा सामान
  rationale: כְּלִי का अर्थ पात्र, औज़ार, वस्तु या उपकरण हो सकता है। लूट की इस सूची में ‘सारा सामान’ इसकी व्यापकता बनाए रखता है।
- source_word: גְּמַלֵּיהֶם
  choice: उनके ऊँट
  rationale: यह גָּמָל के बहुवचन रूप का सीधा और स्वाभाविक अनुवाद है।
- source_word: יִשְׂאוּ לָהֶם
  choice: उठा ले जाएँगे
  rationale: נשא और लाभसूचक לָהֶם यहाँ वस्तुओं को लूटकर ले जाने का भाव देते हैं। हिन्दी का ‘उठा ले जाएँगे’ गति और हरण दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְקָרְאוּ עֲלֵיהֶם
  choice: वे उनके विरुद्ध पुकारेंगे
  rationale: קרא על का अर्थ किसी के विरुद्ध, उसके विषय में, या उसके ऊपर पुकारना हो सकता है। मुख्य पाठ में ‘विरुद्ध’ आक्रमण और विनाश-घोषणा के प्रसंग के अनुकूल है, जबकि मूल की व्यापकता पादटिप्पणी में सुरक्षित है।
- source_word: מָגוֹר מִסָּבִיב
  choice: चारों ओर आतंक!
  rationale: यह यिर्मयाह में आने वाला सूत्रात्मक वाक्यांश है, जो चारों ओर से घेरे हुए भय या आतंक को व्यक्त करता है। संक्षिप्त विस्मयात्मक रूप मूल पुकार की तीव्रता बनाए रखता है।
