source:
  edition: WLC
  text: כִּֽי אֲנִ֞י חָשַׂ֣פְתִּי אֶת עֵשָׂ֗ו גִּלֵּ֨יתִי֙ אֶת מִסְתָּרָ֔י/ו וְ/נֶחְבָּ֖ה לֹ֣א יוּכָ֑ל שֻׁדַּ֥ד זַרְע֛/וֹ וְ/אֶחָ֥י/ו וּ/שְׁכֵנָ֖י/ו וְ/אֵינֶֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/010.yaml
  text: For I have stripped Esau bare[a]; I have uncovered his hiding places, and he will not be able to hide himself. His offspring, his brothers, and his neighbors are destroyed[b], and he is no more.
translation:
  language: hi
  text: क्योंकि मैंने एसाव को निर्वस्त्र कर दिया है[a]; मैंने उसके छिपने के स्थान उजागर कर दिए हैं, और वह अपने आपको छिपा नहीं सकेगा। उसकी संतान, उसके भाई और उसके पड़ोसी नष्ट हो गए हैं[b], और वह अब नहीं रहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘एसाव’ से आशय एसाव के वंशजों के राष्ट्र, अर्थात् एदोम, से है।
    reason: cross_reference
  - marker: b
    text: या, ‘लूट लिए गए हैं’ अथवा ‘उजाड़ दिए गए हैं।’
    reason: lexical_alternative
lexical_decisions:
- source_word: חָשַׂפְתִּי
  choice: मैंने ... को निर्वस्त्र कर दिया है
  rationale: क्रिया आवरण हटाकर पूरी तरह प्रकट करने का ठोस बिंब देती है। ‘निर्वस्त्र कर दिया’ उस तीव्रता को बनाए रखता है और अगले वाक्य में छिपने के स्थान खोले जाने से स्वाभाविक रूप से जुड़ता है।
- source_word: עֵשָׂו
  choice: एसाव
  rationale: मूल पाठ में व्यक्तिगत नाम ‘एसाव’ है। यहाँ वह अपने वंश से बने एदोम राष्ट्र का प्रतिनिधित्व करता है, फिर भी अनुवाद मूल नाम को सुरक्षित रखता है।
- source_word: גִּלֵּיתִי
  choice: मैंने ... खोल दिए हैं
  rationale: यहाँ क्रिया का अर्थ छिपी हुई वस्तु को खोलना या प्रकट करना है। ‘खोल दिए’ स्थानगत और ठोस चित्र को बनाए रखता है।
- source_word: מִסְתָּרָיו
  choice: उसके छिपने के स्थान
  rationale: यह शब्द अमूर्त रहस्यों के बजाय छिपने या छिपाने के स्थानों को सूचित करता है।
- source_word: וְנֶחְבָּה לֹא יוּכָל
  choice: वह अपने आपको छिपा नहीं सकेगा
  rationale: निफ़अल रूप और सामर्थ्य-सूचक क्रिया मिलकर स्वयं को छिपाने में असमर्थता व्यक्त करते हैं; पुल्लिंग एकवचन कर्ता एसाव की ओर लौटता है।
- source_word: שֻׁדַּד
  choice: नष्ट हो गए हैं
  rationale: क्रिया हिंसक लूट, विध्वंस या उजाड़े जाने को व्यक्त कर सकती है। संदर्भ में ‘नष्ट’ व्यापक विनाश को स्वाभाविक हिंदी में व्यक्त करता है; निकटवर्ती संज्ञाओं की सूची के कारण बहुवचन क्रिया हिंदी में सहज है।
- source_word: זַרְעוֹ
  choice: उसकी संतान
  rationale: एकवचन सामूहिक संज्ञा वंश या संतति को दर्शाती है; ‘संतान’ उसका सामूहिक अर्थ बनाए रखती है।
- source_word: אֶחָיו
  choice: उसके भाई
  rationale: मूल पारिवारिक शब्द को रखा गया है, यद्यपि राष्ट्रीय संदर्भ में इसमें संबंधित जातीय समूह भी सम्मिलित हो सकते हैं।
- source_word: שְׁכֵנָיו
  choice: उसके पड़ोसी
  rationale: शब्द निकट रहने वालों या आसपास के लोगों को दर्शाता है; ‘पड़ोसी’ उसका सीधा और स्वाभाविक हिंदी समतुल्य है।
- source_word: וְאֵינֶנּוּ
  choice: और वह अब नहीं रहा
  rationale: यह इब्रानी मुहावरा अनुपस्थिति, समाप्ति या विनाश की गंभीर अंतिमता व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: संयोजक यहाँ पहले घोषित न्याय का कारण या स्पष्टीकरण प्रस्तुत करता है।
theological_decisions:
- issue: एदोम के विरुद्ध भविष्यवाणी में ‘एसाव’ का संदर्भ
  choice: व्यक्तिगत नाम ‘एसाव’ का अनुवाद न करके लिप्यंतरण किया गया है, जबकि राष्ट्रीय संकेत संदर्भ और पादटिप्पणी से स्पष्ट किया गया है।
  alternative: मुख्य पाठ में व्याख्यात्मक रूप से ‘एदोम’ लिखा जा सकता था।
  rationale: मूल इब्रानी स्पष्टतः ‘एसाव’ कहता है। भविष्यवाणी में यह नाम एसाव से निकले एदोम राष्ट्र का प्रतिनिधित्व करता है; नाम को बनाए रखने से मूल अभिव्यक्ति और उसका रूपकात्मक तनाव सुरक्षित रहता है।
- issue: שֻׁדַּד का अर्थ-क्षेत्र
  choice: मुख्य पाठ में व्यापक अर्थ ‘नष्ट हो गए हैं’ रखा गया है।
  alternative: ‘लूट लिए गए हैं’ या ‘उजाड़ दिए गए हैं’ भी संभव हैं।
  rationale: क्रिया लूटे जाने और उजाड़े जाने दोनों को व्यक्त कर सकती है। संदर्भ सर्वांगीण न्याय और समाप्ति का है, इसलिए व्यापक अर्थ मुख्य पाठ में रखा गया और संकरा अर्थ पादटिप्पणी में सुरक्षित किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण, स्पष्ट और सामान्य पाठकों के लिए सुबोध रूप। समानांतर वाक्य-विन्यास और न्याय की गंभीर अंतिमता बनाए रखी गई है; अत्यधिक संस्कृतनिष्ठ या सांप्रदायिक शब्दावली से बचा गया है।
