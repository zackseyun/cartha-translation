language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: מַה תִּתְהַֽלְלִי֙ בָּֽ/עֲמָקִ֔ים זָ֣ב עִמְקֵ֔/ךְ הַ/בַּ֖ת הַ/שּֽׁוֹבֵבָ֑ה הַ/בֹּֽטְחָה֙ בְּ/אֹ֣צְרֹתֶ֔י/הָ מִ֖י יָב֥וֹא אֵלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/004.yaml
  text: Why do you boast in the valleys[a], your valley flowing away, O faithless daughter, who trusts in her treasures, saying, ‘Who will come against me?’
translation:
  language: hi
  text: तू घाटियों में क्यों घमंड करती है? तेरी घाटी बहती जाती है[a], हे विश्वासघाती बेटी, जो अपने खज़ानों पर भरोसा करके कहती है, “कौन मेरे विरुद्ध आएगा?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी वाक्यांश कठिन है। इसका अनुवाद “तेरी घाटी जल से भरी है,” “तेरी घाटी उमड़ रही है,” या “तेरी घाटी उपजाऊ है” भी हो सकता है। संभवतः यह घाटी की प्राकृतिक समृद्धि या उसकी रक्षात्मक स्थिति की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתְהַֽלְלִי
  choice: घमंड करती है
  rationale: हितपएल रूप यहाँ आत्मप्रशंसा और अपने ऊपर इतराने का भाव देता है। ‘घमंड करना’ आधुनिक हिन्दी में स्वाभाविक है और भविष्यद्वक्ता की फटकार बनाए रखता है।
- source_word: בָּעֲמָקִים
  choice: घाटियों पर
  rationale: עֵמֶק का ठोस भौगोलिक अर्थ ‘घाटी’ है। בְ यहाँ उस भौगोलिक विशेषता को घमंड का आधार बताता है, इसलिए हिन्दी में ‘पर’ स्वाभाविक है।
- source_word: זָב עִמְקֵךְ
  choice: अपनी बहती हुई घाटी पर
  rationale: यह कठिन इब्रानी पदबंध घाटी के बहने, जल से भरपूर होने, उमड़ने या उपजाऊ होने की ओर संकेत कर सकता है। मुख्य पाठ में प्रवाह का प्रत्यक्ष बिंब रखा गया है और अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
- source_word: הַבַּת הַשּׁוֹבֵבָה
  choice: हे विश्वासघाती बेटी
  rationale: שׁוֹבֵבָה में विमुखता, अविश्वासयोग्यता और विद्रोही भटकाव का भाव है। ‘विश्वासघाती’ वर्तमान हिन्दी में स्पष्ट और स्वाभाविक है; ‘बेटी’ राष्ट्र/नगर के स्त्रीलिंगी मानवीकरण को सुरक्षित रखता है।
- source_word: הַבֹּטְחָה בְּאֹצְרֹתֶיהָ
  choice: तू अपने खज़ानों पर भरोसा करके
  rationale: אֹצָר धन, भंडार या खज़ाना हो सकता है। यहाँ झूठी सुरक्षा का आधार संचित संपत्ति है, जिसे ‘खज़ानों’ से संक्षेप और स्वाभाविक रूप में व्यक्त किया गया है।
- source_word: מִי יָבֹוא אֵלָי
  choice: कौन मुझ पर चढ़ाई करेगा?
  rationale: शाब्दिक अर्थ ‘कौन मेरी ओर आएगा?’ है, पर शत्रुतापूर्ण संदर्भ में आशय आक्रमण का है। ‘चढ़ाई करेगा’ उस विरोधी गति और अभेद्यता के दंभ को स्पष्ट करता है।
theological_decisions:
- issue: अम्मोन का स्त्रीलिंग एकवचन में मानवीकरण
  choice: ‘बेटी’ और स्त्रीलिंग संबोधन बनाए रखा गया है।
  alternative: ‘हे विद्रोही लोगो’ या राष्ट्र का निरपेक्ष उल्लेख
  rationale: इब्रानी पाठ संबोधित समुदाय को सीधे एक बेटी के रूप में चित्रित करता है। इस रूपक को बनाए रखने से भविष्यद्वाणी की काव्यात्मक और वाचागत शक्ति सुरक्षित रहती है।
- issue: הַשּׁוֹבֵבָה में संबंध-विच्छेद और विद्रोह का तनाव
  choice: विश्वासघाती
  alternative: भटकी हुई; विद्रोही; विमुख बेटी
  rationale: शब्द के अर्थ-क्षेत्र को किसी विशिष्ट धर्मशास्त्रीय पद, जैसे पूर्ण धर्मत्याग, तक सीमित किए बिना संबंधगत बेवफाई का भाव रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, प्रत्यक्ष स्त्रीलिंग ‘तू’ संबोधन और गरिमापूर्ण भविष्यद्वाणी शैली। प्रश्न और आत्मविश्वासी कथन की तीखी लय बनाए रखने के लिए वाक्य को दो प्रश्नात्मक खंडों में रखा गया है।
