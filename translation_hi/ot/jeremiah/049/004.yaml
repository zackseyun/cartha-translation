review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the feminine-singular personification, the rebuke for self-exaltation, reliance on treasures, and the hostile sense of the final question. However, בָּעֲמָקִים means “in the valleys,” not “over/on the valleys,” and זָב עִמְקֵךְ is syntactically a following clause rather than an apposition that warrants repeating “पर.”
  naturalness: The direct feminine singular तू is appropriate in prophetic address. Revising “घाटियों पर” to “घाटियों में” and separating the difficult valley clause produces a more accurate and natural Hindi sentence. “विश्वासघाती बेटी” is retained as an intelligible, suitably serious rendering of the personified faithlessness.
  terminology: “खज़ानों पर भरोसा” accurately represents trust in stored wealth. “मेरे विरुद्ध आएगा” preserves the adversative contextual sense of אֵלַי without adding more specific military imagery than the Hebrew requires.
  issues:
  - severity: medium
    issue: “घाटियों पर” renders בָּעֲמָקִים inaccurately.
    rationale: 'The preposition בְ is locative here: the boast is “in the valleys,” not “on/upon” them.'
  - severity: medium
    issue: The phrase “अपनी बहती हुई घाटी पर” recasts זָב עִמְקֵךְ as an object of boasting and repeats the unsupported postposition “पर.”
    rationale: The difficult Hebrew phrase follows as a clause/predication concerning the valley. It should be presented independently while retaining the stated lexical uncertainty in the footnote.
