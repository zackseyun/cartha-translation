  to: तू घाटियों में क्यों घमंड करती है? तेरी घाटी बहती जाती है[a], हे विश्वासघाती बेटी, जो अपने खज़ानों पर भरोसा करके कहती है, “कौन मेरे विरुद्ध आएगा?”
  rationale: The revision corrects the locative sense of “in the valleys” and restores the difficult valley expression as a separate clause. The footnote continues to signal the disputed sense without forcing a single interpretation. The final question is rendered as an adversative challenge while remaining less interpretively specific than “चढ़ाई करेगा.”
