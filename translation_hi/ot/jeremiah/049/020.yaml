  text: לָ/כֵ֞ן שִׁמְע֣וּ עֲצַת יְהוָ֗ה אֲשֶׁ֤ר יָעַץ֙ אֶל אֱד֔וֹם וּ/מַ֨חְשְׁבוֹתָ֔י/ו אֲשֶׁ֥ר חָשַׁ֖ב אֶל יֹשְׁבֵ֣י תֵימָ֑ן אִם לֹ֤א יִסְחָבוּ/ם֙ צְעִירֵ֣י הַ/צֹּ֔אן אִם לֹ֥א יַשִּׁ֛ים עֲלֵי/הֶ֖ם נְוֵ/הֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/020.yaml
  text: 'Therefore hear the counsel of Yahweh that he has planned against Edom[a], and his thoughts that he has devised against the inhabitants of Teman: Surely the little ones of the flock will drag them away[b]; surely he will make their pasture desolate over them.'
translation:
  language: hi
  text: 'इसलिए यहोवा की वह योजना सुनो, जो उसने एदोम के विरुद्ध बनाई है, और वे विचार भी, जो उसने तेमान के निवासियों के विरुद्ध किए हैं: निश्चय ही झुंड के सबसे छोटे उन्हें घसीट ले जाएँगे[a]; निश्चय ही वह उनके चरागाह को उन पर उजाड़ देगा[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “झुंड के छोटे,” “सबसे कम उम्र वाले,” अथवा “सबसे तुच्छ।” यह वाक्यांश संभवतः सबसे निर्बल या कम महत्त्वपूर्ण आक्रमणकारियों के लिए रूपक है, पर मुख्य पाठ में झुंड की छवि रखी गई है।
    reason: lexical_alternative
  - marker: b
    text: “चरागाह” के लिए “निवास-स्थान” या “बाड़ा” भी संभव है। अंतिम पदबंध का अधिक शाब्दिक भाव “उन पर/उनके ऊपर” है; हिब्रू में इसका सटीक संबंध संक्षिप्त और कुछ अस्पष्ट है।
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह निष्कर्ष या परिणाम बताने वाला संबंधसूचक शब्द है और पिछले कथन से इस भविष्यवाणी को जोड़ता है।
- source_word: שִׁמְעוּ
  choice: सुनो
  rationale: बहुवचन आज्ञार्थक रूप है; भविष्यद्वक्ता के गंभीर आह्वान को सीधे और स्वाभाविक ढंग से रखता है।
- source_word: עֲצַת יְהוָה
  choice: यहोवा की योजना
  rationale: עֵצָה का अर्थ सम्मति, योजना या उद्देश्य हो सकता है। प्रसंग में 'योजना' स्वाभाविक है और अगले क्रियापद יָעַץ से संबंध बनाए रखता है।
- source_word: יָעַץ אֶל אֱדוֹם
  choice: एदोम के विरुद्ध बनाई है
  rationale: इस न्याय-संदर्भ में אֶל विरोधी दिशा व्यक्त करता है; हिंदी में 'के विरुद्ध' स्पष्ट और स्वाभाविक है।
- source_word: מַחְשְׁבוֹתָיו
  choice: उसके विचार
  rationale: यह शब्द विचार, अभिप्राय या योजनाएँ दर्शा सकता है। 'विचार' עֲצָה से शब्दगत भेद बनाए रखता है।
- source_word: חָשַׁב אֶל
  choice: के विरुद्ध किए हैं
  rationale: क्रिया सोचना, विचार करना या ठहराना दर्शाती है। 'विचार किए हैं' मूल की पुनरुक्तिपूर्ण शैली को यथासंभव सुरक्षित रखता है।
- source_word: יֹשְׁבֵי תֵימָן
  choice: तेमान के निवासी
  rationale: निर्माण का सीधा और प्रतिष्ठित हिंदी रूप।
- source_word: אִם לֹא
  choice: निश्चय ही
  rationale: यहाँ शपथ-सदृश दृढ़ कथन है, वास्तविक शर्त नहीं; 'निश्चय ही' उसके बल को व्यक्त करता है।
- source_word: יִסְחָבוּם
  choice: उन्हें घसीट ले जाएँगे
  rationale: סחב बलपूर्वक घसीटने का जीवंत चित्र देता है; 'घसीट ले जाएँगे' उस दिशा और परिणाम को व्यक्त करता है।
- source_word: צְעִירֵי הַצֹּאן
  choice: झुंड के छोटे-से-छोटे
  rationale: צָעִיר छोटे, कम उम्र या तुच्छ/कम महत्त्वपूर्ण को सूचित कर सकता है। यह रूप झुंड का रूपक बनाए रखते हुए अर्थ की व्यापकता बचाता है।
- source_word: נְוֵהֶם
  choice: उनके चरागाह
  rationale: נָוֶה निवास, बाड़ा या चरागाह हो सकता है। निकटवर्ती झुंड की छवि के कारण मुख्य पाठ में 'चरागाह' उपयुक्त है।
- source_word: עֲלֵיהֶם
  choice: उनके कारण
  rationale: यह पद शाब्दिक रूप से 'उन पर' है, पर इस विनाशकारी प्रसंग में कारण या परिणाम-संबंध व्यक्त कर सकता है; असामान्य हिंदी से बचते हुए अर्थ दिया गया है और विकल्प पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम है। आधुनिक हिंदी बाइबलीय प्रयोग में व्यापक रूप से पहचाने जाने वाले 'यहोवा' को रखा गया है; इसे केवल उपाधि 'प्रभु' से प्रतिस्थापित नहीं किया गया।
- issue: צְעִירֵי הַצֹּאן की रूपकात्मक पहचान
  choice: झुंड की छवि को मुख्य पाठ में बनाए रखना
  alternative: सबसे निर्बल आक्रमणकारी
  rationale: मूल यह स्पष्ट नहीं करता कि रूपक किन मानवीय साधनों को सूचित करता है; व्याख्यात्मक पहचान थोपने के बजाय वास्तविक अस्पष्टता सुरक्षित रखी गई है।
- issue: अंतिम उपवाक्य का कर्ता
  choice: वह
  alternative: कोई अनिर्दिष्ट कर्ता
  rationale: एकवचन क्रिया का सबसे स्वाभाविक पूर्वगामी यहोवा है, फिर भी पाठ कर्ता को दोबारा नाम से नहीं कहता; इसलिए सर्वनाम रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में गंभीर भविष्यवाणी-संबंधी शैली रखी गई है। वाक्य को सामान्य पाठक के लिए सुबोध बनाया गया है, किंतु दोहरे दृढ़ कथन 'निश्चय ही' और झुंड/चरागाह की मूल काव्यात्मक छवि सुरक्षित रखी गई है।
