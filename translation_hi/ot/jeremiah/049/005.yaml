source:
  edition: WLC
  text: הִנְ/נִי֩ מֵבִ֨יא עָלַ֜יִ/ךְ פַּ֗חַד נְאֻם אֲדֹנָ֧/י יְהוִ֛ה צְבָא֖וֹת מִ/כָּל סְבִיבָ֑יִ/ךְ וְ/נִדַּחְתֶּם֙ אִ֣ישׁ לְ/פָנָ֔י/ו וְ/אֵ֥ין מְקַבֵּ֖ץ לַ/נֹּדֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/005.yaml
  text: Behold[a], I am bringing terror upon you from all around you, declares the Lord GOD of hosts, and each man will be driven out before him[b], with no one to gather the fugitive.
translation:
  language: hi
  text: देखो, मैं तुम्हारे चारों ओर से तुम पर आतंक ला रहा हूँ—यह सेनाओं के स्वामी प्रभु यहोवा की घोषणा है। तुम सब खदेड़े जाओगे—हर एक अपने आगे की ओर[a]—और जो भाग रहा है[b] उसे इकट्ठा करने वाला कोई न होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हर एक सीधे आगे” अथवा “हर पुरुष उसके सामने।” इब्रानी पदबंध संक्षिप्त और कठिन है; संभवतः यह ऐसी घबराई हुई भगदड़ बताता है जिसमें हर व्यक्ति दूसरों की परवाह किए बिना आगे भागता है।
    reason: lexical_alternative
  - marker: b
    text: या “भटकने वाला” अथवा “भगोड़ा।”
    reason: alternative_reading
lexical_decisions:
- source_word: הִנְנִי
  choice: देखो, मैं
  rationale: यह पदबंध गंभीर और आसन्न ईश्वरीय घोषणा का परिचय देता है। ‘देखो’ भविष्यद्वाणी की ध्यानाकर्षक शक्ति बनाए रखता है।
- source_word: מֵבִיא
  choice: ला रहा हूँ
  rationale: הִנְנִי के साथ कृदन्त आसन्न और सजीव क्रिया व्यक्त करता है; वर्तमान प्रगतिशील रूप उसी प्रभाव को स्वाभाविक हिन्दी में देता है।
- source_word: פַּחַד
  choice: आतंक
  rationale: न्याय के कारण उत्पन्न तीव्र भय और घबराहट के लिए ‘आतंक’ साधारण ‘भय’ से अधिक उपयुक्त है।
- source_word: נְאֻם אֲדֹנָי יְהוִה צְבָאוֹת
  choice: यह सेनाओं के स्वामी प्रभु यहोवा की घोषणा है
  rationale: נְאֻם को भविष्यद्वाणी-संबंधी औपचारिक घोषणा के रूप में रखा गया है; אֲדֹנָי को ‘प्रभु’, יהוה को उसके निज नाम ‘यहोवा’, और צְבָאוֹת को ‘सेनाओं के स्वामी’ द्वारा व्यक्त किया गया है।
- source_word: מִכָּל סְבִיבַיִךְ
  choice: तुम्हारे चारों ओर से
  rationale: यह घेर लेने वाले संकट की स्थानिक छवि को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: וְנִדַּחְתֶּם
  choice: खदेड़ा जाएगा
  rationale: निफ़अल रूप जबरन दूर किए या तितर-बितर किए जाने का भाव देता है; निकटवर्ती אִישׁ के कारण हिन्दी वाक्य को वितरणात्मक एकवचन में ढाला गया है।
- source_word: אִישׁ לְפָנָיו
  choice: हर एक अपने सामने की ओर
  rationale: संक्षिप्त और कठिन इब्रानी पदबंध को इस प्रकार रखा गया है कि प्रत्येक व्यक्ति के अलग-अलग, सीधे आगे भागने या खदेड़े जाने का भाव उभरे, पर उसकी अनिश्चितता पादटिप्पणी में सुरक्षित रहे।
- source_word: וְאֵין מְקַבֵּץ
  choice: इकट्ठा करने वाला कोई न होगा
  rationale: यह बिखरे लोगों को फिर एकत्र करने वाले किसी व्यक्ति के पूर्ण अभाव को व्यक्त करता है।
- source_word: לַנֹּדֵד
  choice: भागे हुए व्यक्ति
  rationale: कृदन्त ऐसे व्यक्ति को सूचित करता है जो खदेड़े जाने के कारण भाग रहा या भटक रहा है; मुख्य पाठ में न्याय और पलायन का प्रसंग स्पष्ट रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु / याहवे
  rationale: मूल पाठ में वाचा का निज नाम सीधे आया है। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में पहचाना जाने वाला नाम है और इसे सामान्य उपाधि ‘प्रभु’ में विलीन नहीं करता; אֲדֹנָי को अलग से ‘प्रभु’ कहा गया है।
- issue: אִישׁ का वितरणात्मक और लिंग-सूचक रूप
  choice: हर एक
  alternative: हर पुरुष
  rationale: यहाँ אִישׁ मुख्यतः समूह के प्रत्येक सदस्य को अलग-अलग दिखाता है। हिन्दी में ‘हर एक’ उस वितरणात्मक बल को स्वाभाविक रूप से व्यक्त करता है और ऐसे पुरुष-विशेष अर्थ का दावा नहीं करता जिसे संदर्भ निश्चित नहीं करता।
- issue: אִישׁ לְפָנָיו की अस्पष्ट दिशा
  choice: हर एक अपने सामने की ओर
  alternative: हर एक अपने रास्ते / हर पुरुष उसके सामने
  rationale: सर्वनाम का संदर्भ और मुहावरे का ठीक अर्थ कठिन है। मुख्य पाठ संभावित घबराए हुए सीधे पलायन को व्यक्त करता है, जबकि पादटिप्पणी अन्य शाब्दिक संभावनाएँ खुली रखती है।
translation_notes:
  register: भाषा आधुनिक, गंभीर और भविष्यद्वाणी-सुलभ रखी गई है। ‘देखो’, ‘आतंक’ और ‘घोषणा’ पद की औपचारिक तीव्रता बनाए रखते हैं, जबकि कठिन इब्रानी वाक्यांश की अनिश्चितता को मुख्य पाठ में अति-व्याख्यायित न करके पादटिप्पणी में स्पष्ट किया गया है।
