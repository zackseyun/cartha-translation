  yaml_path: translation/ot/jeremiah/049/015.yaml
  text: For look, I have made you small among the nations, despised among men.
translation:
  language: hi
  text: देखो, मैंने तुझे जातियों के बीच छोटा और मनुष्यों के बीच तिरस्कृत बना दिया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי הִנֵּה
  choice: क्योंकि देख
  rationale: כִּי को कारणसूचक ‘क्योंकि’ और הִנֵּה को ध्यान आकर्षित करने वाले सीधे आदेश ‘देख’ से व्यक्त किया गया है।
- source_word: קָטֹן נְתַתִּיךָ
  choice: मैंने तुझे ... छोटा ... ठहराया है
  rationale: נתן के साथ विधेय विशेषण קטן यहाँ किसी को निम्न/अमहत्त्वपूर्ण स्थिति में रखने का भाव देता है; ‘ठहराया है’ इस रचना को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בַּגּוֹיִם
  choice: जातियों के बीच
  rationale: גּוֹיִם का सामूहिक राजनीतिक-जातीय अर्थ ‘जातियाँ’ से रखा गया है।
- source_word: בָּזוּי בָּאָדָם
  choice: मनुष्यों के बीच तुच्छ
  rationale: בזוי का अर्थ ‘तुच्छ समझा गया/तिरस्कृत’ है; सामूहिक אדם को ‘मनुष्यों’ से व्यक्त किया गया है और समानान्तर पंक्ति-संरचना बचाई गई है।
theological_decisions:
- issue: ईश्वर की क्रिया और एदोम की स्थिति
  choice: ‘मैंने तुझे ... ठहराया है’
  alternative: ‘मैं तुझे ... कर दूँगा’
  rationale: मसोरेटिक पाठ में נתתי पूर्णकाल रूप है; भविष्यसूचक परिणाम मानकर उसे भविष्यकाल में बदलने के बजाय स्रोत की पूर्ण क्रिया को बनाए रखा गया है।
