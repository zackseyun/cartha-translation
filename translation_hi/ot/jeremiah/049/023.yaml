base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/023.yaml
  text: 'Concerning Damascus: Hamath and Arpad are put to shame[a], for they have heard bad news; they melt away. There is anxiety like the sea; it cannot be quiet.'
translation:
  language: hi
  text: 'दमिश्क के विषय में:


    हमात और अर्पद लज्जित हैं,


    क्योंकि उन्होंने बुरी खबर सुनी है;


    वे पिघल गए हैं।


    समुद्र जैसी व्याकुलता है[a];


    समुद्र शांत नहीं हो सकता।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी कठिन है; शब्दशः: “समुद्र में/समुद्र के समान, व्याकुलता; शांत होना वह नहीं कर सकता।” इसका अर्थ या तो यह हो सकता है कि उनकी व्याकुलता अशांत समुद्र जैसी है, या यह कि समुद्र के पास व्याकुलता है और उसे शांत नहीं किया जा सकता।'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדַמֶּשֶׂק
  choice: दमिश्क के विषय में
  rationale: भविष्यवाणी के शीर्षक में לְ को तटस्थ और स्वाभाविक रूप से प्रस्तुत करता है; न्याय का प्रसंग होते हुए भी स्वयं पूर्वसर्ग को अनिवार्य रूप से “विरुद्ध” नहीं बनाता।
- source_word: בּוֹשָׁה חֲמָת וְאַרְפָּד
  choice: हमात और अर्पद लज्जित हैं
  rationale: एकवचन स्त्रीलिंग क्रिया के बावजूद संयुक्त स्थान-नामों का सामूहिक आशय है। “लज्जित हैं” सार्वजनिक अपमान और निराशा, दोनों की गुंजाइश रखता है।
- source_word: שְׁמֻעָה רָעָה
  choice: बुरी खबर
  rationale: विपत्ति के समाचार का सीधा, आधुनिक और सहज हिन्दी रूप।
- source_word: נָמֹגוּ
  choice: वे पिघल गए हैं
  rationale: मूल क्रिया के ‘पिघलने’ के सजीव रूपक को बनाए रखता है, जो साहस टूटने या भय से निढाल होने का संकेत देता है।
- source_word: בַּיָּם דְּאָגָה
  choice: समुद्र जैसी व्याकुलता
  rationale: अगली पंक्ति में शांत न हो सकने के उल्लेख के साथ समुद्र की बेचैनी की उपमा संदर्भ में सुसंगत है; फिर भी कठिन इब्रानी की स्थानवाचक संभावना पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: הַשְׁקֵט לֹא יוּכָל
  choice: वह शांत नहीं हो सकता
  rationale: शांत या स्थिर होने की असमर्थता व्यक्त करता है और मुख्य पाठ में समुद्र के रूपक से स्वाभाविक रूप से जुड़ता है।
