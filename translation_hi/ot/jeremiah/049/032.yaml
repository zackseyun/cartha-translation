source:
  edition: WLC
  text: וְ/הָי֨וּ גְמַלֵּי/הֶ֜ם לָ/בַ֗ז וַ/הֲמ֤וֹן מִקְנֵי/הֶם֙ לְ/שָׁלָ֔ל וְ/זֵרִתִ֥י/ם לְ/כָל ר֖וּחַ קְצוּצֵ֣י פֵאָ֑ה וּ/מִ/כָּל עֲבָרָ֛י/ו אָבִ֥יא אֶת אֵידָ֖/ם נְאֻם יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/032.yaml
  text: Their camels will become plunder[a], and their many livestock spoil. I will scatter to every wind those who cut the corners of their hair, and from all sides of them I will bring their disaster[b], declares Yahweh.
translation:
  language: hi
  text: उनके ऊँट लूट का माल बन जाएँगे, और उनका बहुत-सा पशुधन युद्ध की लूट बन जाएगा। मैं बालों के किनारे कतरनेवालों[a] को हर दिशा में तितर-बितर कर दूँगा; मैं चारों ओर से उन पर विपत्ति लाऊँगा[b]—यह याहवे की घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “किनारा/कोना कतरनेवाले।” यह सम्भवतः कनपटियों या सिर के पार्श्व के बाल काटने की एक विशिष्ट प्रथा का संकेत है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उसके सब ओर से”; सामूहिक अर्थ में “उनके चारों ओर से” भी समझा जा सकता है।
    reason: source_ambiguity
lexical_decisions:
- source_word: גְמַלֵּיהֶם
  choice: उनके ऊँट
  rationale: संज्ञा सामान्य रूप से ऊँटों को दर्शाती है; अधिक विशिष्ट प्रजाति बताना मूल से आगे जाता।
- source_word: לָבַז
  choice: लूट का माल
  rationale: युद्ध में शत्रु द्वारा छीन ली जानेवाली संपत्ति का स्वाभाविक और स्पष्ट हिन्दी रूप।
- source_word: הֲמוֹן מִקְנֵיהֶם
  choice: उनके बहुत-से पशुधन
  rationale: הֲמוֹן की बहुलता और מִקְנֶה के पशुधन-संबंधी अर्थ दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: לְשָׁלָל
  choice: युद्ध की लूट
  rationale: समानांतर בַז से अर्थगत निकटता रखते हुए युद्ध में प्राप्त लूट का आशय स्पष्ट करता है।
- source_word: וְזֵרִתִים לְכָל רוּחַ
  choice: मैं ... हर दिशा में तितर-बितर कर दूँगा
  rationale: शाब्दिक रूप से 'हर हवा की ओर' बिखेरने का मुहावरा है; हिन्दी में 'हर दिशा में' उसका स्पष्ट प्राकृतिक अर्थ देता है।
- source_word: קְצוּצֵי פֵאָה
  choice: कनपटियों के बाल कतरनेवाले
  rationale: यह किसी विशिष्ट केश-सज्जा प्रथा को सूचित करता है। 'कनपटियों के बाल' सम्भावित शारीरिक स्थान बताता है, जबकि पादटिप्पणी शाब्दिक अस्पष्टता सुरक्षित रखती है।
- source_word: מִכָּל עֲבָרָיו
  choice: चारों ओर से उन पर
  rationale: मूल के 'उसके/उनके सब ओर से' आनेवाली विपत्ति को स्वाभाविक हिन्दी में व्यक्त करता है; वचन-संबंधी अस्पष्टता पादटिप्पणी में दी गई है।
- source_word: אָבִיא אֶת אֵידָם
  choice: उन पर विपत्ति लाऊँगा
  rationale: אֵיד न्याय-संदर्भ की घोर विपत्ति या विनाशकारी आपदा है; 'विपत्ति' गरिमापूर्ण और सामान्यतः बोधगम्य है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: मानक नबी-सूत्र की गंभीरता रखते हुए יהוה को व्यक्तिगत वाचा-नाम 'याहवे' के रूप में प्रस्तुत करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में टेट्राग्राम יהוה सीधे आया है; लिप्यंतरण व्यक्तिगत ईश्वरीय नाम को सामान्य उपाधि में बदले बिना सुरक्षित रखता है।
- issue: קְצוּצֵי פֵאָה से सूचित समूह की पहचान
  choice: कनपटियों के बाल कतरनेवाले
  alternative: बालों के किनारे काटनेवाले; दाढ़ी के सिरे कतरनेवाले
  rationale: यह जातीय या धार्मिक प्रथा की ओर संकेत कर सकता है, पर पद स्वयं उसकी पहचान या धार्मिक व्याख्या स्पष्ट नहीं करता; इसलिए अनावश्यक सिद्धान्तगत निष्कर्ष नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण भविष्यवाणी-संबंधी स्वर रखा गया है। समानार्थी युद्ध-शब्दों בַז और שָׁלָל को क्रमशः 'लूट का माल' और 'युद्ध की लूट' से कुछ अलग रखा गया है। मूल के सामूहिक एकवचन प्रत्यय को मुख्य पाठ में स्वाभाविक बहुवचन से व्यक्त कर उसकी अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
