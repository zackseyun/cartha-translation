id: JER.49.18
reference: Jeremiah 49:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כְּֽ/מַהְפֵּכַ֞ת סְדֹ֧ם וַ/עֲמֹרָ֛ה וּ/שְׁכֵנֶ֖י/הָ אָמַ֣ר יְהוָ֑ה לֹֽא יֵשֵׁ֥ב שָׁם֙ אִ֔ישׁ וְ/לֹֽא יָג֥וּר בָּ֖/הּ בֶּן אָדָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/018.yaml
  text: As when Sodom and Gomorrah and their neighboring towns were overthrown[a], says Yahweh, no man will dwell there[b], and no son of man will sojourn in her.
translation:
  language: hi
  text: जिस प्रकार सदोम, अमोरा और उनके आस-पास के नगर उलट दिए गए थे[a], उसी प्रकार—याहवे की यह वाणी है—वहाँ कोई व्यक्ति नहीं बसेगा, और कोई मानव-पुत्र[b] उसमें आकर नहीं टिकेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सदोम, अमोरा और उसके पड़ोसियों के उलट दिए जाने के समान।” इब्रानी में ‘उसके’ का रूप स्त्रीलिंग एकवचन है।
    reason: lexical_alternative
  - marker: b
    text: “मानव-पुत्र” यहाँ एक इब्रानी मुहावरा है, जिसका अर्थ मनुष्य या नश्वर मानव है; इस प्रसंग में यह मसीही उपाधि नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמַהְפֵּכַת
  choice: जिस प्रकार ... उलट दिए गए थे
  rationale: כְּ तुलना सूचित करता है और מַהְפֵּכָה विनाशकारी ढंग से उलट दिए जाने को। क्रियात्मक हिन्दी वाक्यांश तुलना को स्वाभाविक रखते हुए मूल बिंब बचाता है।
- source_word: סְדֹם וַעֲמֹרָה וּשְׁכֵנֶיהָ
  choice: सदोम, अमोरा और उनके आस-पास के नगर
  rationale: שְׁכֵנֶיהָ का रूप स्त्रीलिंग एकवचन प्रत्यय के साथ ‘उसके पड़ोसी’ है, पर प्रसंग में सदोम-अमोरा से जुड़े निकटवर्ती बसेरे अभिप्रेत हैं। मुख्य पाठ में सहज सामूहिक अर्थ रखा गया और रूपगत विकल्प पादटिप्पणी में दिया गया।
- source_word: אָמַר יְהוָה
  choice: याहवे की यह वाणी है
  rationale: यह प्रचलित भविष्यद्वाणी-सूत्र का गरिमापूर्ण हिन्दी रूप है। יהוה को वाचा-नाम के रूप में ‘याहवे’ लिखा गया है।
- source_word: יֵשֵׁב
  choice: बसेगा
  rationale: निवास-संदर्भ में ישׁב का अर्थ बसना या निवास करना है; ‘बसेगा’ उजाड़ हो जाने की भविष्यद्वाणी के अनुकूल और सहज है।
- source_word: אִישׁ
  choice: कोई व्यक्ति
  rationale: यहाँ एकवचन संज्ञा प्रतिनिधिक और सामान्य अर्थ में प्रयुक्त है। ‘कोई व्यक्ति’ हिन्दी में इस सार्वत्रिक निषेध को स्वाभाविक रूप से व्यक्त करता है, बिना केवल पुरुष लिंग तक अर्थ सीमित किए।
- source_word: יָגוּר
  choice: आकर ... टिकेगा
  rationale: גור अस्थायी रूप से रहने या परदेशी की तरह निवास करने का भाव रखता है। ‘आकर टिकेगा’ उस अस्थायित्व को व्यक्त करता और ‘बसेगा’ से समानांतर क्रिया का भेद बनाए रखता है।
- source_word: בָּהּ
  choice: उसमें
  rationale: स्त्रीलिंग एकवचन प्रत्यय उस नगर या भूमि की ओर संकेत करता है। हिन्दी में ‘उसमें’ व्याकरणिक रूप से स्वाभाविक है और संदर्भ को खुला रखता है।
- source_word: בֶּן אָדָם
  choice: मानव-पुत्र
  rationale: शाब्दिक संरचना और אִישׁ के साथ काव्यात्मक समानांतरता बचाई गई है। इस प्रसंग में मुहावरे का अर्थ सामान्य मनुष्य है, जिसे पादटिप्पणी स्पष्ट करती है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुरक्षरीय वाचा-नाम सीधे आया है; ‘याहवे’ उसका आधुनिक हिन्दी लिप्यंतरण है और उसे सामान्य उपाधि में नहीं बदलता।
- issue: בֶּן אָדָם का आशय
  choice: मुख्य पाठ में ‘मानव-पुत्र’, अर्थ-स्पष्टीकरण पादटिप्पणी में
  alternative: मनुष्य; नश्वर मनुष्य
  rationale: यहाँ पदबंध किसी विशिष्ट मसीही उपाधि के रूप में नहीं, बल्कि मानव के लिए इब्रानी मुहावरे के रूप में आया है। शाब्दिक रूप समानांतरता बचाता है और पादटिप्पणी संभावित भ्रम दूर करती है।
- issue: אִישׁ का प्रतिनिधिक प्रयोग
  choice: कोई व्यक्ति
  alternative: कोई पुरुष; कोई आदमी
  rationale: निषेध का आशय किसी भी मानव निवासी से है, केवल वयस्क पुरुष से नहीं। इसलिए सामान्य अर्थ को स्पष्ट रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य हिन्दी। भविष्यद्वाणी-सूत्र के लिए ‘याहवे की यह वाणी है’ रखा गया है। ‘बसेगा’ और ‘आकर टिकेगा’ स्थायी तथा अस्थायी निवास के बीच मूल समानांतर भेद को सुनाई देते हैं।
