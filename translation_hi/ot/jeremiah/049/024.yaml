  text: רָפְתָ֥ה דַמֶּ֛שֶׂק הִפְנְתָ֥ה לָ/נ֖וּס וְ/רֶ֣טֶט הֶחֱזִ֑יקָה צָרָ֧ה וַ/חֲבָלִ֛ים אֲחָזַ֖תָּ/ה כַּ/יּוֹלֵדָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/024.yaml
  text: Damascus has become feeble[a]; she has turned to flee, and trembling has seized her. Distress and labor pains have taken hold of her[c][b], like a woman giving birth.
translation:
  language: hi
  text: दमिश्क दुर्बल पड़ गई है[a]; वह भागने के लिए मुड़ गई है, और थरथराहट ने उसे जकड़ लिया है[b]। संकट और प्रसव-पीड़ाओं ने उसे ऐसे आ पकड़ा है, जैसे वे प्रसव करती स्त्री को पकड़ती हैं[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘शक्तिहीन हो गई है’ अथवा ‘उसका साहस टूट गया है।’ इब्रानी क्रिया शक्ति या साहस के घटने का भाव दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या ‘कँपकँपी ने उसे जकड़ लिया है।’ इब्रानी शब्द का मूल अर्थ काँपना या थरथराना है, संभवतः भय के कारण।
    reason: lexical_alternative
  - marker: c
    text: या ‘वेदनाओं’ अथवा ‘जन्म देने की पीड़ाओं।’ अगले वाक्यांश में प्रसव करती स्त्री का उपमान प्रसव-संबंधी अर्थ का समर्थन करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רָפְתָה
  choice: निर्बल हो गया है
  rationale: रפה यहाँ शक्ति या साहस के ढीले पड़ने को व्यक्त करता है। ‘निर्बल हो गया है’ शारीरिक और मानसिक दुर्बलता—दोनों की संभाव्यता बनाए रखता है।
- source_word: דַמֶּשֶׂק
  choice: दमिश्क
  rationale: इस स्थान-नाम का प्रचलित मानक हिन्दी रूप। नगर का नाम हिन्दी में सामान्यतः पुल्लिंग व्याकरण के साथ आता है।
- source_word: הִפְנְתָה לָנוּס
  choice: भागने को मुड़ा है
  rationale: हिफ़िल क्रिया ‘मुड़ना/फिरना’ और उद्देश्यसूचक ‘भागने को’ को निकटता से और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְרֶטֶט
  choice: और थरथराहट
  rationale: רֶטֶט का मूल बिंब काँपने या थरथराने का है; यह ‘आतंक’ जैसे अधिक व्याख्यात्मक शब्द के बजाय शारीरिक बिंब सुरक्षित रखता है।
- source_word: הֶחֱזִיקָה
  choice: ने उसे जकड़ लिया है
  rationale: यहाँ חזק का हिफ़िल रूप दृढ़ता से पकड़ लेने का भाव देता है; ‘जकड़ लिया’ भयजनित थरथराहट के साथ स्वाभाविक और सजीव है।
- source_word: צָרָה
  choice: संकट
  rationale: צָרָה कष्ट, विपत्ति या घोर परेशानी को दर्शाता है। ‘संकट’ व्यापक अर्थ बनाए रखता है और अगले पद के पीड़ा-बिंब के साथ सुगम है।
- source_word: וַחֲבָלִים
  choice: और प्रसव-पीड़ाओं
  rationale: חֲבָלִים का अर्थ संदर्भानुसार पीड़ाएँ या प्रसव-वेदनाएँ हो सकता है। अगले उपमान में जनती हुई स्त्री होने से प्रसव-संबंधी अर्थ स्पष्ट है।
- source_word: אֲחָזַתָּה
  choice: ने उसे आ पकड़ा है
  rationale: אחז दृढ़ता से पकड़ने को बताता है। ‘आ पकड़ा’ अचानक और अपरिहार्य रूप से चपेट में आने का स्वाभाविक हिन्दी भाव देता है।
- source_word: כַּיּוֹלֵדָה
  choice: जैसे जनती हुई स्त्री को
  rationale: ילד का स्त्रीलिंग कृदंत प्रसव की क्रिया में लगी स्त्री को दर्शाता है। यह रूप उपमान को संक्षिप्त और स्रोत के निकट रखता है।
