id: JER.49.30
reference: Jeremiah 49:30
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: נֻסוּ֩ נֻּ֨דוּ מְאֹ֜ד הֶעְמִ֧יקוּ לָ/שֶׁ֛בֶת יֹשְׁבֵ֥י חָצ֖וֹר נְאֻם יְהוָ֑ה כִּֽי יָעַ֨ץ עֲלֵי/כֶ֜ם נְבוּכַדְרֶאצַּ֤ר מֶֽלֶךְ בָּבֶל֙ עֵצָ֔ה וְ/חָשַׁ֥ב עלי/הם מַחֲשָׁבָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/030.yaml
  text: Flee! Wander far away! Dwell deep[a], inhabitants of Hazor, declares Yahweh[b], for Nebuchadnezzar king of Babylon has taken counsel against you and devised a plan against you.
translation:
  language: hi
  text: भागो! बहुत दूर निकल जाओ! गहराई में जाकर बसो[a], हे हासोर के निवासियो—यह याहवे की घोषणा है—क्योंकि बाबेल के राजा नबूकदरेस्सर ने तुम्हारे विरुद्ध युक्ति रची है और उनके विरुद्ध योजना बनाई है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ ‘गहराई में बसो’ है; यह दूरस्थ या छिपे हुए स्थानों में पीछे हट जाने का मुहावरा है।
    reason: cultural_note
  - marker: b
    text: इब्रानी पाठ पहले ‘तुम्हारे विरुद्ध’ कहता है, लेकिन पद के अंत में ‘उनके विरुद्ध’ हो जाता है; अनुवाद में यह परिवर्तन सुरक्षित रखा गया है।
    reason: textual_note
lexical_decisions:
- source_word: נֻסוּ
  choice: भागो!
  rationale: नוס का बहुवचन आज्ञार्थक रूप संकट से तत्काल पलायन की सीधी आज्ञा देता है।
- source_word: נֻּדוּ מְאֹד
  choice: बहुत दूर निकल जाओ!
  rationale: नוד के दूर हटने/भटककर चले जाने के भाव और מְאֹד की तीव्रता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הֶעְמִיקוּ לָשֶׁבֶת
  choice: गहराई में जाकर बसो
  rationale: शाब्दिक 'गहरा करके बसना' का रूपक दूरस्थ अथवा छिपे स्थानों में शरण लेने की ओर संकेत करता है; हिन्दी में रूपक को बनाए रखते हुए वाक्य स्वाभाविक रखा गया है।
- source_word: יֹשְׁבֵי חָצוֹר
  choice: हे हासोर के निवासियो
  rationale: प्रत्यक्ष संबोधन और स्थाननाम दोनों को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: मानक नबी-सूत्र की गंभीरता और יְהוָה के व्यक्तिगत वाचा-नाम को सुरक्षित रखता है।
- source_word: יָעַץ ... עֵצָה
  choice: युक्ति रची है
  rationale: सजातीय क्रिया-संज्ञा का बल योजनाबद्ध शत्रुतापूर्ण विचार पर है; 'युक्ति रची' हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: וְחָשַׁב ... מַחֲשָׁבָה
  choice: और ... योजना बनाई है
  rationale: दूसरी सजातीय अभिव्यक्ति को पहली से अलग रखते हुए सोची-समझी योजना का भाव व्यक्त करता है।
- source_word: עֲלֵיכֶם ... עליהם
  choice: तुम्हारे विरुद्ध ... उनके विरुद्ध
  rationale: मसोरा-पाठ में द्वितीय पुरुष से तृतीय पुरुष की वास्तविक और अर्थपूर्ण पारी को बिना समरस किए सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल में परमेश्वर का व्यक्तिगत चतुरक्षरीय नाम है; उसका लिप्यंतरण नाम की विशिष्टता को बनाए रखता है।
- issue: पद के अंत में सर्वनाम का परिवर्तन
  choice: ‘तुम्हारे विरुद्ध’ से ‘उनके विरुद्ध’ का परिवर्तन सुरक्षित रखा गया
  alternative: दोनों स्थानों पर ‘तुम्हारे विरुद्ध’ करके समरूप बनाना
  rationale: प्राप्त मसोरा-पाठ सीधे संबोधन से तृतीय पुरुष की ओर बदलता है। इस तनाव को शैलीगत सुविधा के लिए मिटाया नहीं गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रत्यक्ष नबी-संबोधन के अनुरूप रखी गई है। छोटे आज्ञार्थक वाक्य चेतावनी की तात्कालिकता व्यक्त करते हैं; ‘गहराई में जाकर बसो’ मूल रूपक को बनाए रखता है और पादटिप्पणी उसका मुहावरेदार आशय स्पष्ट करती है।
