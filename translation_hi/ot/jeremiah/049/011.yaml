  text: עָזְבָ֥/ה יְתֹמֶ֖י/ךָ אֲנִ֣י אֲחַיֶּ֑ה וְ/אַלְמְנֹתֶ֖י/ךָ עָלַ֥/י תִּבְטָֽחוּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/011.yaml
  text: Leave your fatherless children; I will keep them alive[a]. And let your widows trust in me.
translation:
  language: hi
  text: अपने पिता-विहीन बच्चों को छोड़ दे[क]; मैं उन्हें जीवित रखूँगा। और तेरी विधवाएँ मुझ पर भरोसा रखें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: या, “अनाथ बच्चे।” इब्रानी शब्द विशेष रूप से पिता-विहीन बच्चे को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עָזְבָה
  choice: छोड़ जा
  rationale: पुल्लिंग एकवचन आज्ञार्थक रूप को बनाए रखता है। यहाँ इसका अर्थ पीछे छोड़ना या किसी की देखभाल में छोड़ना हो सकता है; इसलिए अधिक कठोर ‘त्याग दे’ नहीं चुना गया।
- source_word: יְתֹמֶיךָ
  choice: अपने अनाथ बच्चों को
  rationale: יָתוֹם विशेष रूप से पिता-विहीन बच्चे को दर्शाता है। आधुनिक हिन्दी में ‘अनाथ बच्चे’ सबसे स्वाभाविक है, जबकि संदर्भ में विधवाओं का उल्लेख पिता-विहीनता का आशय स्पष्ट करता है।
- source_word: אֲנִי אֲחַיֶּה
  choice: मैं उन्हें जीवित रखूँगा
  rationale: स्वतंत्र सर्वनाम אֲנִי के बल और חיה के पिएल रूप के जीवन बचाए रखने वाले कारक अर्थ—दोनों को व्यक्त करता है।
- source_word: וְאַלְמְנֹתֶיךָ
  choice: और तेरी विधवाएँ
  rationale: स्त्रीलिंग बहुवचन संज्ञा का सीधा और स्वाभाविक हिन्दी रूप; एकवचन सम्बोधन के अनुरूप ‘तेरी’ रखा गया है।
- source_word: עָלַי תִּבְטָחוּ
  choice: मुझ पर भरोसा रखें
  rationale: בטח के साथ על भरोसे के आधार या आश्रय को दर्शाता है। क्रिया का रूप आग्रह ‘रखें’ और कथन ‘रखेंगी’ दोनों की सम्भावना देता है; यहाँ निकटवर्ती सन्दर्भ और अंग्रेज़ी परामर्श-पाठ के अनुरूप आग्रह रखा गया है।
theological_decisions:
- issue: वक्ता की पहचान और असहाय बचे हुए लोगों के प्रति दया
  choice: प्रथम पुरुष में परमेश्वर की प्रत्यक्ष प्रतिज्ञा को बिना व्याख्यात्मक विस्तार के रखा गया है।
  alternative: इसे किसी सामान्य संरक्षक की ओर से कही गई सुरक्षा की बात मानना।
  rationale: यिर्मयाह 49 के प्रसंग में वक्ता यहोवा है, पर पद में उसका नाम दोहराया नहीं गया। इसलिए अनुवाद केवल ‘मैं’ रखता है और न्याय के बीच दया के तनाव को बना रहने देता है।
- issue: תִּבְטָחוּ का भाव
  choice: 'आग्रह: ‘भरोसा रखें’'
  alternative: 'भविष्यवाणी/आश्वासन: ‘भरोसा रखेंगी’'
  rationale: अपूर्ण क्रिया-रूप दोनों अर्थ दे सकता है। वाक्य-संरचना इसे आग्रह के रूप में पढ़ने की अनुमति देती है; वैकल्पिक अर्थ को सिद्धान्तगत रूप से निर्णायक नहीं बनाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और प्रत्यक्ष काव्यात्मक गद्य। एदोम से एकवचन सम्बोधन के कारण ‘अपने/तेरी’ रखा गया है। ‘छोड़ जा’ में मूल आज्ञा का बल है, पर ‘त्याग दे’ जैसी अनावश्यक कठोरता नहीं।
