  text: תִּֽפְלַצְתְּ/ךָ֞ הִשִּׁ֤יא אֹתָ/ךְ֙ זְד֣וֹן לִבֶּ֔/ךָ שֹֽׁכְנִי֙ בְּ/חַגְוֵ֣י הַ/סֶּ֔לַע תֹּפְשִׂ֖י מְר֣וֹם גִּבְעָ֑ה כִּֽי תַגְבִּ֤יהַ כַּ/נֶּ֨שֶׁר֙ קִנֶּ֔/ךָ מִ/שָּׁ֥ם אֽוֹרִידְ/ךָ֖ נְאֻם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/016.yaml
  text: The terror you inspire has deceived you[a], the arrogance of your heart— you who dwell in the clefts of the rock, who occupy the height of the hill. Though you make your nest as high as the eagle, from there I will bring you down[c][b], declares Yahweh.
translation:
  language: hi
  text: तेरे फैलाए आतंक और तेरे मन के अहंकार ने तुझे धोखा दिया है[a][b]—हे चट्टान की दरारों में रहनेवाले[c], पहाड़ी की ऊँचाई पर अधिकार जमाए हुए! चाहे तू उकाब की तरह अपना घोंसला ऊँचा बनाए, फिर भी मैं तुझे वहाँ से नीचे उतार दूँगा—यह याहवे की घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तेरा आतंक’ अथवा ‘तेरी भयावहता’; इब्रानी शब्द एदोम के फैलाए भय या उसकी डरावनी प्रतिष्ठा की ओर संकेत कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘तेरे मन के घमंड ने’।
    reason: lexical_alternative
  - marker: c
    text: ‘चट्टान की दरारें’ एदोम के दुर्गम और लगभग अभेद्य समझे जाने वाले पहाड़ी गढ़ों की छवि प्रस्तुत करती हैं।
    reason: cultural_note
lexical_decisions:
- source_word: תִּפְלַצְתְּךָ
  choice: तेरे फैलाए आतंक
  rationale: פלץ से बना यह रूप आतंक या भयावहता का बोध करा सकता है। प्रसंग में एदोम की डर पैदा करने वाली प्रतिष्ठा अभिप्रेत हो सकती है; ‘फैलाए आतंक’ इस संबंध को स्वाभाविक हिन्दी में स्पष्ट करता है, जबकि पादटिप्पणी मूल की संभावित व्यापकता बचाती है।
- source_word: הִשִּׁיא אֹתָךְ
  choice: तुझे धोखा दिया है
  rationale: नשׁא का हिफ़ील रूप यहाँ बहकाने या धोखा देने के अर्थ में है। आधुनिक हिन्दी में ‘धोखा दिया है’ सीधा और स्वाभाविक है।
- source_word: זְדוֹן לִבֶּךָ
  choice: तेरे मन के अहंकार
  rationale: זָדוֹן में घमंड, उद्दंडता और दुस्साहसी आत्मविश्वास का भाव है। ‘अहंकार’ नैतिक अति-आत्मविश्वास व्यक्त करता है; לֵב को यहाँ स्वाभाविक हिन्दी के अनुसार ‘मन’ कहा गया है।
- source_word: שֹׁכְנִי בְּחַגְוֵי הַסֶּלַע
  choice: हे चट्टान की दरारों में रहनेवाले
  rationale: सहभागी रूप संबोधन की तरह प्रयुक्त है। यह अनुवाद चट्टानी शरणस्थलों की भौगोलिक छवि को बनाए रखता है।
- source_word: תֹּפְשִׂי מְרוֹם גִּבְעָה
  choice: पहाड़ी की ऊँचाई पर अधिकार जमाए हुए
  rationale: תפשׂ का मूल भाव पकड़ने या अधिकार में लेने का है और यहाँ ऊँचे स्थान पर दृढ़ कब्ज़े का संकेत देता है। ‘अधिकार जमाए हुए’ शाब्दिक सजीवता और निवास/सुरक्षा के प्रसंग दोनों को व्यक्त करता है।
- source_word: כִּי תַגְבִּיהַ כַּנֶּשֶׁר קִנֶּךָ
  choice: चाहे तू उकाब की तरह अपना घोंसला ऊँचा बनाए
  rationale: כִּי यहाँ रियायती अर्थ देता है और גבה का हिफ़ील ‘ऊँचा करना’ है। ‘चाहे...फिर भी’ विरोध और उकाब के दुर्गम ऊँचे घोंसले की उपमा दोनों स्पष्ट करता है।
- source_word: מִשָּׁם אוֹרִידְךָ
  choice: मैं तुझे वहाँ से नीचे उतार दूँगा
  rationale: ירד के हिफ़ील का कारणवाचक अर्थ ‘नीचे उतारना’ है। यह एदोम की स्वयं अर्जित ऊँचाई के उलटाव को सहज हिन्दी में बनाए रखता है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: נְאֻם भविष्यद्वक्ताओं में प्रामाणिक ईश्वरीय घोषणा का सूत्र है। יְהוָה को व्यक्तिवाचक वाचा-नाम ‘याहवे’ के रूप में रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में चार अक्षरों वाला विशिष्ट ईश्वरीय नाम है। ‘याहवे’ उसका सीधा लिप्यंतरण है और सामान्य उपाधि में बदलने से बचाता है।
- issue: एदोम की सुरक्षा-संबंधी छवि
  choice: चट्टानी, ऊँचे गढ़ों पर आधारित अहंकारी आत्म-सुरक्षा के विरुद्ध न्याय
  alternative: केवल मनोवैज्ञानिक भय अथवा प्रसंग से अलग अंतिम-कालीन अर्थ
  rationale: चट्टान की दरारें, पहाड़ी की ऊँचाई और उकाब का घोंसला एदोम की दुर्गम भौगोलिक सुरक्षा दिखाते हैं। अनुवाद इसी ऐतिहासिक-भविष्यवाणी संबंध को रखता है और अतिरिक्त सिद्धांत नहीं जोड़ता।
- issue: תִּפְלַצְתְּךָ और זְדוֹן לִבֶּךָ का वाक्यगत संबंध
  choice: दोनों को विराम-चिह्न द्वारा निकट संबद्ध कारणों के रूप में रखना
  alternative: केवल अहंकार को धोखे का कर्ता मानना, या दोनों को स्पष्ट संयुक्त कर्ता बनाना
  rationale: इब्रानी की संक्षिप्त रचना में ‘तेरा आतंक’ और ‘तेरे मन का अहंकार’ का सटीक वाक्यगत संबंध कुछ खुला है। हिन्दी में अल्पविराम और डैश इस तनाव को पूरी तरह समतल किए बिना पठनीय रखते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यवाणी-शैली रखी गई है। एकवचन अनौपचारिक ‘तू/तेरे’ सामूहिक एदोम को सीधे और तीखे संबोधन के रूप में प्रस्तुत करता है। ‘उकाब’ बाइबिलीय और साहित्यिक प्रयोग में परिचित है; वाक्यरचना सामान्य पाठक के लिए सहज रखते हुए मूल की काव्यात्मक संक्षिप्तता और अस्पष्टता बचाती है।
