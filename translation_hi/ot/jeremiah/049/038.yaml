base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/038.yaml
  text: And I will set my throne in Elam[a], and I will destroy from there king and officials[b], declares Yahweh.
translation:
  language: hi
  text: मैं एलाम में अपना सिंहासन स्थापित करूँगा[a], और वहाँ से राजा और अधिकारियों[b] को नष्ट कर दूँगा—यह याहवे की घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपना सिंहासन रखूँगा।” इब्रानी क्रिया का अर्थ “रखना,” “स्थापित करना” या “ठहराना” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “हाकिमों” अथवा “प्रधानों।” इब्रानी शब्द उच्च पदस्थ शासकों या राजकीय पदाधिकारियों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: मैं ... स्थापित करूँगा
  rationale: שׂוּם का मूल अर्थ ‘रखना/स्थापित करना’ है। सिंहासन के साथ ‘स्थापित करना’ आधुनिक हिन्दी में स्वाभाविक है और राजकीय उपस्थिति के बिंब को बनाए रखता है; अन्य सम्भव अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: כִסְאִי
  choice: अपना सिंहासन
  rationale: כִּסֵּא यहाँ दिव्य वक्ता के राजकीय और न्यायिक अधिकार का ठोस बिंब है; इसे अमूर्त ‘शासन’ में नहीं बदला गया।
- source_word: בְּעֵילָם
  choice: एलाम में
  rationale: पूर्वसर्ग בְּ का सामान्य स्थानवाचक अर्थ ‘में’ है। ‘एलाम के विरुद्ध’ कहना मूल पाठ में निहित न होने वाला विरोधार्थ जोड़ देता।
- source_word: וְהַאֲבַדְתִּי
  choice: नष्ट कर दूँगा
  rationale: אבד के हिफ़ील रूप का अर्थ किसी को नाश करना अथवा मिटा देना है। ‘नष्ट कर दूँगा’ भविष्यसूचक न्याय की तीव्रता को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִשָּׁם
  choice: वहाँ से
  rationale: यह स्थान से हटाए जाने या नष्ट किए जाने को सीधे व्यक्त करता है।
- source_word: מֶלֶךְ
  choice: राजा
  rationale: इब्रानी में संज्ञा निश्चित उपपद के बिना है; इसलिए हिन्दी में भी अनावश्यक रूप से ‘उस राजा’ जैसी अधिक निश्चित अभिव्यक्ति नहीं जोड़ी गई।
- source_word: וְשָׂרִים
  choice: अधिकारियों
  rationale: שָׂרִים उच्च पदस्थ शासकों, प्रधानों या राजकीय अधिकारियों को सूचित कर सकता है। ‘अधिकारी’ आधुनिक पाठक के लिए सहज है, जबकि ‘हाकिम/सरदार’ जैसे विकल्प अलग अर्थच्छाया ला सकते हैं।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: मानक भविष्यसूचक सूत्र נְאֻם को गंभीर और स्वाभाविक हिन्दी में ‘घोषणा’ से व्यक्त किया गया है, और יהוה को उसके व्यक्तिगत नाम ‘याहवे’ के रूप में रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसका व्यापक रूप से स्वीकृत लिप्यंतरण है और नाम को उपाधि में नहीं बदलता।
- issue: ‘अपना सिंहासन’ का आशय
  choice: ठोस राजकीय बिंब को यथावत रखना
  alternative: अपना शासन; अपना न्यायासन
  rationale: पद एलाम पर परमेश्वर की सार्वभौमिक सत्ता और न्याय को सिंहासन के बिंब से व्यक्त करता है। अनुवाद इस बिंब का अर्थ खोलकर किसी एक व्याख्या तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, स्पष्ट भविष्यसूचक गद्य। ‘सिंहासन’ और ‘घोषणा’ जैसे परिचित बाइबलीय शब्द रखे गए हैं, पर वाक्य-विन्यास आधुनिक और सहज है।
