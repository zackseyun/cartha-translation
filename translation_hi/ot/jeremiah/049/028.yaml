source:
  edition: WLC
  text: לְ/קֵדָ֣ר וּֽ/לְ/מַמְלְכ֣וֹת חָצ֗וֹר אֲשֶׁ֤ר הִכָּה֙ נבוכדראצור מֶֽלֶךְ בָּבֶ֔ל כֹּ֖ה אָמַ֣ר יְהוָ֑ה ק֚וּמוּ עֲל֣וּ אֶל קֵדָ֔ר וְ/שָׁדְד֖וּ אֶת בְּנֵי קֶֽדֶם׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/028.yaml
  text: 'Concerning Kedar and the kingdoms of Hazor[a], which Nebuchadnezzar king of Babylon struck down: Thus says Yahweh: Rise up, go up against Kedar[b], and plunder the people of the east.'
translation:
  language: hi
  text: 'केदार और हासोर के राज्यों के विषय में, जिन्हें बाबेल के राजा नबूकदनेस्सर[a] ने परास्त किया। याहवे यह कहता है:


    “उठो, केदार के विरुद्ध चढ़ाई करो,

    और पूरब के लोगों[b] को लूटो।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में यहाँ नाम की वर्तनी ‘नबूकदरेस्सर’ के अधिक निकट है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक रूप: “पूर्व के पुत्र”; यह पूर्वी मरुस्थलीय लोगों के लिए प्रयुक्त एक मुहावरा है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְקֵדָר
  choice: केदार के विषय में
  rationale: भविष्यवाणी के शीर्षक में לְ विषय का परिचय देता है; इसलिए दिशासूचक ‘केदार को’ के बजाय ‘केदार के विषय में’ स्वाभाविक है।
- source_word: וּלְמַמְלְכוֹת חָצוֹר
  choice: और हासोर के राज्यों के
  rationale: מַמְלְכוֹת बहुवचन है, इसलिए ‘राज्यों’ को बनाए रखा गया है। यहाँ हासोर संभवतः मरुस्थलीय राज्यों या समुदायों के समूह का नाम है।
- source_word: אֲשֶׁר הִכָּה
  choice: जिन्हें ... पराजित किया था
  rationale: सैनिक प्रसंग में נכה प्रहार करके परास्त करने का भाव रखता है। ‘पराजित किया था’ आधुनिक हिन्दी में स्वाभाविक है और कथित घटना की पूर्णता व्यक्त करता है।
- source_word: נבוכדראצור
  choice: नबूकदनेस्सर
  rationale: हिब्रू वर्तनी ‘नबूकदरेस्सर’ के निकट है, पर हिन्दी बाइबल परंपरा में अधिक पहचाना जाने वाला नामरूप ‘नबूकदनेस्सर’ रखा गया है; वर्तनी का अंतर पादटिप्पणी में बताया गया है।
- source_word: כֹּה אָמַר יְהוָה
  choice: याहवे यों कहता है
  rationale: भविष्यद्वक्ता की संदेश-सूचक रूढ़ि को संक्षिप्त और गरिमापूर्ण हिन्दी में रखा गया है तथा יהוה को व्यक्तिगत नाम ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: קוּמוּ
  choice: उठो
  rationale: बहुवचन आज्ञार्थ का बल सहज और संक्षिप्त आधुनिक हिन्दी में व्यक्त होता है।
- source_word: עֲלוּ אֶל קֵדָר
  choice: केदार पर चढ़ाई करो
  rationale: इसके बाद लूटने की आज्ञा होने के कारण עלה אל का सैनिक अर्थ अभिप्रेत है; ‘चढ़ाई करो’ उस शत्रुतापूर्ण गति को स्पष्ट करता है।
- source_word: וְשָׁדְדוּ
  choice: और ... लूट लो
  rationale: युद्ध के संदर्भ में שׁדד का सामान्य अर्थ लूटना है। ‘लूट लो’ आज्ञार्थ और क्रिया की पूर्णता दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּנֵי קֶדֶם
  choice: पूर्व के लोगों
  rationale: शाब्दिक रूप ‘पूर्व के पुत्र’ पूर्वी मरुस्थलीय जातियों के लिए मुहावरा है। ‘पूर्व के लोग’ अर्थ को स्पष्ट रखते हुए भौगोलिक संकेत बचाता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत ईश्वरीय नाम सीधे प्रयुक्त हुआ है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और नाम को सामान्य उपाधि में नहीं बदलता।
- issue: אֲשֶׁר הִכָּה में पूर्ण क्रिया का कालगत बल
  choice: पराजित किया था
  alternative: पराजित करेगा; जिस पर उसने आक्रमण किया
  rationale: हिब्रू में हिफ़ील पूर्ण रूप आया है और वाक्य इसे बाबेल के राजा द्वारा की गई कार्रवाई के रूप में प्रस्तुत करता है। भविष्यसूचक संदर्भ में पूर्ण रूप की अन्य व्याख्या संभव हो सकती है, पर पद की शीर्षक-सदृश रचना में भूतकाल सबसे सीधा पठन है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यवाणी-शैली रखी गई है। काव्यात्मक आज्ञाओं को अलग पंक्तियों में दिया गया है। अपरिचित शाब्दिक मुहावरे और राजकीय नाम की हिब्रू वर्तनी पादटिप्पणियों में सुरक्षित हैं।
