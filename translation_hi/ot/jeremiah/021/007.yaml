base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/007.yaml
  text: And after that[a], declares Yahweh, I will give Zedekiah king of Judah, his servants, the people, and those left in this city from the plague, from the sword, and from the famine into the hand of Nebuchadnezzar king of Babylon, into the hand of their enemies, and into the hand of those seeking their life; and he will strike them down with the edge of the sword. He will not spare them or have pity or compassion.
translation:
  language: hi
  text: '“इसके बाद याहवे की यह घोषणा है: मैं यहूदा के राजा सिदकिय्याह, उसके सेवकों, लोगों और उन लोगों को जो इस नगर में महामारी, तलवार और अकाल से बचे हैं, बाबेल के राजा नबूकदनेस्सर[a] के हाथ, उनके शत्रुओं के हाथ और उनके प्राण लेने वालों के हाथ सौंप दूँगा। वह उन्हें तलवार की धार से मार डालेगा। वह न उन्हें बख्शेगा, न उन पर तरस खाएगा और न उन पर दया करेगा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में नाम का रूप ‘नबूकदरेस्सर’ है; यहाँ प्रचलित रूप ‘नबूकदनेस्सर’ रखा गया है।
    reason: नाम के मूल इब्रानी रूप और प्रचलित हिन्दी रूप के अंतर को सुरक्षित रखना।
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: इसके बाद
  rationale: यह पहले बताए गए न्याय के कार्यों के बाद होने वाली अगली घटना को स्वाभाविक और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: נְאֻם יְהוָה
  choice: याहवे की यह घोषणा है
  rationale: यह भविष्यद्वाणी के गंभीर और अधिकारपूर्ण सूत्र को बनाए रखता है तथा परमेश्वर के व्यक्तिगत नाम को सीधे प्रस्तुत करता है।
- source_word: אֶתֵּן ... בְּיַד
  choice: हाथ में ... कर दूँगा
  rationale: सत्ता के अधीन सौंपने का भाव व्यक्त करते हुए इब्रानी के ‘हाथ’ वाले चित्र को भी सुरक्षित रखता है।
- source_word: עֲבָדָיו
  choice: उसके सेवकों
  rationale: राजकीय संदर्भ में यह दरबारी सेवकों या अधिकारियों को समेट सकता है; ‘सेवक’ मूल शब्द की व्यापकता को बनाए रखता है।
- source_word: הַנִּשְׁאָרִים
  choice: बचे हुए लोगों
  rationale: यह पूर्व विनाश से जीवित बचे लोगों को दर्शाता है और अनावश्यक रूप से धर्मवैज्ञानिक अर्थ वाला पारिभाषिक शब्द नहीं जोड़ता।
- source_word: מִן הַדֶּבֶר מִן הַחֶרֶב וּמִן הָרָעָב
  choice: महामारी, तलवार और अकाल से
  rationale: न्याय की तीनों विपत्तियों को उसी क्रम में स्पष्ट, आधुनिक हिन्दी में रखता है।
- source_word: מְבַקְשֵׁי נַפְשָׁם
  choice: जो उनके प्राण लेना चाहते हैं
  rationale: शाब्दिक ‘उनके प्राण के खोजी’ के जानलेवा आशय को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְפִי חֶרֶב
  choice: तलवार की धार से
  rationale: इब्रानी मुहावरे का अर्थ और उसका सजीव चित्र दोनों सुरक्षित रहते हैं।
- source_word: לֹא יָחוּס ... וְלֹא יַחְמֹל וְלֹא יְרַחֵם
  choice: न तो उन्हें छोड़ेगा, न उन पर तरस खाएगा और न उन पर दया करेगा
  rationale: तीन निकटार्थी नकारात्मक क्रियाओं की संचयी कठोरता और लय को बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत दिव्य नाम सीधे आया है। ‘याहवे’ उसे उपाधि में बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- issue: הַנִּשְׁאָרִים में ‘शेष’ संबंधी संभावित धर्मवैज्ञानिक अर्थ
  choice: बचे हुए लोगों
  alternative: शेष बचे लोग / बचे हुओं का समुदाय
  rationale: इस संदर्भ में शब्द का सीधा संकेत महामारी, तलवार और अकाल से जीवित बचने वालों की ओर है; अनुवाद इससे अधिक विशिष्ट धर्मवैज्ञानिक अर्थ आरोपित नहीं करता।
- issue: अंतिम क्रिया וְהִכָּם का कर्ता
  choice: वह उन्हें ... मार डालेगा
  alternative: नबूकदनेस्सर उन्हें ... मार डालेगा
  rationale: इब्रानी में कर्ता एकवचन और अंतर्निहित है; निकटतम प्रमुख एकवचन व्यक्ति नबूकदनेस्सर है। सर्वनाम मूल की अभिव्यक्ति और संदर्भगत स्पष्टता दोनों बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गंभीर और सामान्य पाठक के लिए सुबोध रखी गई है। भविष्यद्वाणी की कठोर लय बनाए रखने के लिए अंतिम तीन नकारात्मक वाक्यांश समानांतर रूप में दिए गए हैं; अत्यधिक पुरातन शब्दावली से बचा गया है।
