  edition: WLC
  text: כֹּֽה אָמַ֨ר יְהוָ֜ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל הִנְ/נִ֣י מֵסֵב֮ אֶת כְּלֵ֣י הַ/מִּלְחָמָה֮ אֲשֶׁ֣ר בְּ/יֶדְ/כֶם֒ אֲשֶׁ֨ר אַתֶּ֜ם נִלְחָמִ֣ים בָּ֗/ם אֶת מֶ֤לֶךְ בָּבֶל֙ וְ/אֶת הַ/כַּשְׂדִּ֔ים הַ/צָּרִ֣ים עֲלֵי/כֶ֔ם מִ/ח֖וּץ לַֽ/חוֹמָ֑ה וְ/אָסַפְתִּ֣י אוֹתָ֔/ם אֶל תּ֖וֹךְ הָ/עִ֥יר הַ/זֹּֽאת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/004.yaml
  text: 'Thus says Yahweh[a], the God of Israel: Behold, I am turning back the weapons of war that are in your hands, with which you are fighting against the king of Babylon and against the Chaldeans who are besieging you outside the wall, and I will gather them into the midst of this city.'
translation:
  language: hi
  text: 'इस्राएल का परमेश्वर याहवे[a] यों कहता है: ‘देखो, मैं युद्ध के उन हथियारों को, जो तुम्हारे हाथों में हैं और जिनसे तुम बाबेल के राजा और कसदियों से लड़ रहे हो—जो नगर की दीवार के बाहर तुम्हें घेरा डाले हुए हैं—वापस मोड़ रहा हूँ; और मैं उन्हें[b] इस नगर के भीतर इकट्ठा करूँगा।’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘याहवे’ इब्रानी नाम יהוה का हिन्दी लिप्यंतरण है।
    reason: divine_name
  - marker: b
    text: ‘उन्हें’ का संकेत बाबेल के राजा और कसदियों की ओर भी हो सकता है; तब अर्थ होगा कि परमेश्वर शत्रु सेनाओं को इस नगर के भीतर ले आएगा।
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: הִנְנִי
  choice: देखो
  rationale: यह आसन्न और गंभीर ईश्वरीय कार्रवाई की ओर ध्यान खींचने वाला स्वाभाविक आधुनिक हिन्दी उद्घोष है।
- source_word: מֵסֵב
  choice: पीछे मोड़ दूँगा
  rationale: क्रिया के सैन्य प्रसंग और निकट भविष्य की ईश्वरीय कार्रवाई को व्यक्त करता है; आशय है कि यहोवा रक्षकों के हथियारों को शत्रु से फेर देगा।
- source_word: כְּלֵי הַמִּלְחָמָה
  choice: युद्ध के हथियार
  rationale: मूल पदबंध का स्पष्ट, सहज और सैन्य अर्थ सुरक्षित रहता है।
- source_word: בְּיֶדְכֶם
  choice: तुम्हारे हाथों में
  rationale: मूल की ठोस छवि बनाए रखते हुए हथियारों के वर्तमान उपयोग और अधिकार को दर्शाता है।
- source_word: נִלְחָמִים בָּם
  choice: जिनसे तुम ... लड़ रहे हो
  rationale: בָּם के साधनवाचक अर्थ और जारी युद्ध-क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֶת מֶלֶךְ בָּבֶל וְאֶת הַכַּשְׂדִּים
  choice: बाबेल के राजा और कसदियों से
  rationale: हिन्दी में ‘लड़ना’ के साथ ‘से’ विरोधी पक्ष को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַכַּשְׂדִּים
  choice: कसदी
  rationale: मूल के जातीय-ऐतिहासिक नाम को सामान्य ‘बाबेली’ में समतल नहीं किया गया।
- source_word: הַצָּרִים עֲלֵיכֶם
  choice: जो ... तुम्हें घेरे हुए हैं
  rationale: शहरपनाह और सैन्य आक्रमण के प्रसंग में צור का घेराबंदी-संबंधी अर्थ स्पष्ट करता है।
- source_word: מִחוּץ לַחוֹמָה
  choice: शहरपनाह के बाहर
  rationale: नगर की रक्षात्मक दीवार का स्थान स्पष्ट और संक्षिप्त रूप से बताता है।
- source_word: וְאָסַפְתִּי אֹתָם
  choice: और उन्हें ... इकट्ठा करूँगा
  rationale: निकटतम व्याकरणिक पूर्वपद ‘युद्ध के हथियार’ को मुख्य पाठ में संदर्भ माना गया है और אָסַף की छवि बनाए रखी गई है।
- source_word: אֶל תּוֹךְ הָעִיר הַזֹּאת
  choice: इस नगर के बीच में
  rationale: मूल के भीतर/मध्य की स्थानिक अभिव्यक्ति को औपचारिक किंतु सहज हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: וְאָסַפְתִּי אֹתָם में ‘उन्हें’ का संदर्भ
  choice: मुख्य पाठ में ‘उन्हें’ से युद्ध के हथियार अभिप्रेत हैं।
  alternative: यह सर्वनाम बाबेल के राजा और कसदियों की ओर संकेत कर सकता है, अर्थात परमेश्वर शत्रु सेनाओं को नगर के भीतर ले आएगा।
  rationale: ‘युद्ध के हथियार’ व्याकरण की दृष्टि से उपयुक्त पूर्वपद है और हथियारों को पीछे मोड़कर नगर में इकट्ठा करने का क्रम न्याय की घोषणा के रूप में संगत है। फिर भी शत्रु सेनाओं वाला संदर्भ प्रसंगतः संभव है, इसलिए अस्पष्टता पाद-टिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, भविष्यवाणी के अनुकूल गंभीर और गरिमापूर्ण रखी गई है। ‘शहरपनाह’ घेराबंदी के ऐतिहासिक प्रसंग को संक्षेप में स्पष्ट करता है। मुख्य पाठ में सर्वनाम की संभावित अस्पष्टता को अर्थपूर्ण पुनरावृत्ति से स्पष्ट किया गया है, जबकि वैकल्पिक संदर्भ पाद-टिप्पणी में संरक्षित है।
