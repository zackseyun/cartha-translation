source:
  edition: WLC
  text: דְּרָשׁ נָ֤א בַעֲדֵ֨/נוּ֙ אֶת יְהוָ֔ה כִּ֛י נְבוּכַדְרֶאצַּ֥ר מֶֽלֶךְ בָּבֶ֖ל נִלְחָ֣ם עָלֵ֑י/נוּ אוּלַי֩ יַעֲשֶׂ֨ה יְהוָ֤ה אוֹתָ֨/נוּ֙ כְּ/כָל נִפְלְאֹתָ֔י/ו וְ/יַעֲלֶ֖ה מֵ/עָלֵֽי/נוּ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/002.yaml
  text: Please inquire of Yahweh on our behalf[a], because Nebuchadnezzar king of Babylon is fighting against us. Perhaps Yahweh will act for us according to all his wondrous acts[c][b], so that he will withdraw from us.
translation:
  language: hi
  text: कृपया हमारी ओर से याहवे से पूछिए[a], क्योंकि बाबेल का राजा नबूकदनेस्सर[b] हमारे विरुद्ध युद्ध कर रहा है। शायद याहवे अपने सभी अद्भुत कार्यों के अनुसार हमारे लिए कार्य करे, और नबूकदनेस्सर हम पर से हट जाए[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘पूछिए’ का अर्थ है नबी के माध्यम से याहवे से उत्तर जानना।
    reason: lexical_clarification
  - marker: b
    text: 'इब्रानी वर्तनी के अधिक निकट: ‘नबूकदरेस्सर’।'
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, ‘और वह हमारे ऊपर से चढ़ जाए।’ इस सैनिक प्रसंग में इसका आशय आक्रमणकारी राजा का घेराबंदी हटाकर चले जाना है। इब्रानी में कर्ता को दोबारा स्पष्ट रूप से नहीं कहा गया है।
    reason: ambiguity_and_idiom
lexical_decisions:
- source_word: דְּרָשׁ נָא
  choice: कृपया ... पूछिए
  rationale: דרשׁ के साथ נא यहाँ नबी के माध्यम से परमेश्वर से उत्तर जानने का विनम्र अनुरोध है। ‘पूछिए’ आधुनिक हिन्दी में सहज है, जबकि ‘खोजिए’ इस संदर्भ में अपेक्षाकृत अस्पष्ट होता।
- source_word: בַעֲדֵנוּ
  choice: हमारी ओर से
  rationale: בעד प्रतिनिधित्व अथवा किसी के पक्ष में की गई मध्यस्थता का भाव देता है; ‘हमारी ओर से’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: यह चार-अक्षरीय व्यक्तिगत नाम का हिन्दी लिप्यंतरण है; इसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: נְבוּכַדְרֶאצַּר
  choice: नबूकदनेस्सर
  rationale: पाठ में प्रचलित और आसानी से पहचाना जाने वाला हिन्दी नाम रखा गया है; स्रोत की अधिक निकट वर्तनी पादटिप्पणी में दी गई है।
- source_word: נִלְחָם עָלֵינוּ
  choice: हमारे विरुद्ध युद्ध कर रहा है
  rationale: निफ़अल कृदंत चल रही शत्रुतापूर्ण सैनिक कार्रवाई व्यक्त करता है।
- source_word: אוּלַי
  choice: शायद
  rationale: यह शब्द निवेदन में निहित आशा के साथ अनिश्चितता को भी बनाए रखता है।
- source_word: יַעֲשֶׂה יְהוָה אוֹתָנוּ
  choice: याहवे ... हमारे लिए कार्य करे
  rationale: सन्दर्भ में राजा याहवे से अपने लोगों के पक्ष में हस्तक्षेप की आशा करता है। यह हिन्दी में स्वाभाविक रहते हुए क्रिया के व्यापक अर्थ को बनाए रखता है।
- source_word: כְּכָל נִפְלְאֹתָיו
  choice: अपने सभी अद्भुत कामों के अनुसार
  rationale: נפלאות परमेश्वर के असाधारण, विस्मयकारी कार्यों को दर्शाता है और כְּכָל पूर्व के ऐसे कार्यों के प्रतिरूप के अनुसार हस्तक्षेप की आशा व्यक्त करता है।
- source_word: וְיַעֲלֶה מֵעָלֵינוּ
  choice: और वह हमारे ऊपर से हट जाए
  rationale: सैनिक प्रसंग में עלה מן/מעל आक्रमण या घेराबंदी हटाकर चले जाने का संकेत देता है। निकट-शाब्दिक रूप मूल में अंतर्निहित कर्ता की अस्पष्टता को भी बनाए रखता है; आशय पादटिप्पणी में स्पष्ट किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु; यहोवा
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। ‘याहवे’ उस नाम को उपाधि में बदले बिना आधुनिक हिन्दी लिपि में प्रस्तुत करता है।
- issue: וְיַעֲלֶה מֵעָלֵינוּ का अंतर्निहित कर्ता
  choice: मुख्य पाठ में ‘वह’ रखकर मूल की व्याकरणिक अस्पष्टता बनाए रखना
  alternative: ‘नबूकदनेस्सर हमारे पास से लौट जाए’ कहकर कर्ता स्पष्ट करना
  rationale: प्रसंग में सबसे स्वाभाविक आशय आक्रमणकारी राजा अथवा उसकी सेना का हटना है, पर इब्रानी क्रिया में कर्ता दोबारा व्यक्त नहीं हुआ। इसलिए मुख्य पाठ अस्पष्टता रखता है और पादटिप्पणी प्रासंगिक आशय बताती है।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘कृपया’, ‘हमारे विरुद्ध युद्ध कर रहा है’ और ‘अद्भुत काम’ सामान्य पाठक के लिए सहज हैं। अंतिम उपवाक्य में मूल की कर्ता-संबंधी अस्पष्टता जानबूझकर सुरक्षित रखी गई है और मुहावरे का अर्थ पादटिप्पणी में दिया गया है।
