source:
  edition: WLC
  text: וְ/הִכֵּיתִ֗י אֶת יֽוֹשְׁבֵי֙ הָ/עִ֣יר הַ/זֹּ֔את וְ/אֶת הָ/אָדָ֖ם וְ/אֶת הַ/בְּהֵמָ֑ה בְּ/דֶ֥בֶר גָּד֖וֹל יָמֻֽתוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/006.yaml
  text: And I will strike the inhabitants of this city, both man and beast; they will die by a great pestilence.
translation:
  language: hi
  text: और मैं इस नगर के निवासियों पर—मनुष्य और पशु दोनों पर—प्रहार करूँगा; वे भयंकर महामारी से मरेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִכֵּיתִי
  choice: और मैं ... पर प्रहार करूँगा
  rationale: नכה के हिफ़ील रूप का मूल भाव ‘मारना/प्रहार करना’ है। ‘प्रहार करूँगा’ परमेश्वर की सीधी न्यायकारी कार्रवाई को बनाए रखता है, जबकि मृत्यु का परिणाम अगले खंड में अलग से व्यक्त होता है।
- source_word: יֹשְׁבֵי הָעִיר הַזֹּאת
  choice: इस नगर के निवासियों
  rationale: यह ישב के कृदंत रूप द्वारा नगर में रहने वालों को सामूहिक रूप से सूचित करता है। ‘निवासी’ आधुनिक, सहज और गरिमापूर्ण हिन्दी है।
- source_word: וְאֶת הָאָדָם וְאֶת הַבְּהֵמָה
  choice: मनुष्य और पशु दोनों पर
  rationale: दोहराए गए कर्मचिह्न दोनों वर्गों के समावेश पर बल देते हैं। ‘मनुष्य और पशु दोनों’ स्रोत के मानव-पशु विरोध और समावेशी बल को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: בְּדֶבֶר גָּדוֹל
  choice: भयंकर महामारी से
  rationale: דֶּבֶר यहाँ व्यापक, घातक संक्रामक विपत्ति है। ‘महामारी’ उसके विशिष्ट भाव को व्यक्त करती है और ‘भयंकर’ גָּדוֹל की तीव्रता को आधुनिक हिन्दी में स्वाभाविक ढंग से दर्शाता है।
- source_word: יָמֻתוּ
  choice: वे ... मरेंगे
  rationale: इस संदर्भ में अपूर्ण क्रिया आगामी और निश्चित परिणाम को सूचित करती है; सामान्य भविष्यकाल हिन्दी में स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: אָדָם का पशु के साथ न्याय-सूत्र में अनुवाद
  choice: मनुष्य
  alternative: लोग / मानवजाति
  rationale: यहाँ אָדָם सामूहिक रूप से मनुष्यों को पशुओं के विपरीत रखता है। ‘मनुष्य’ इस पारंपरिक और अर्थपूर्ण विरोध को बनाए रखता है, जबकि ‘मानवजाति’ इस नगर-विशेष के संदर्भ में अनावश्यक रूप से सार्वभौमिक लग सकता है।
- issue: न्याय में परमेश्वर की सीधी भूमिका
  choice: मैं ... प्रहार करूँगा
  alternative: उन पर विपत्ति पड़ेगी
  rationale: स्रोत में प्रथम पुरुष कर्ता स्पष्ट है। अनुवाद उस प्रत्यक्ष ईश्वरीय कार्रवाई को निष्क्रिय या परोक्ष बनाकर धर्मवैचारिक तनाव को कम नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में है। ‘नगर,’ ‘निवासी,’ ‘प्रहार’ और ‘महामारी’ भविष्यद्वाणी के गंभीर, गरिमापूर्ण स्वर को बनाए रखते हुए सामान्य पाठक के लिए बोधगम्य हैं। डैश से ‘मनुष्य और पशु दोनों’ को व्याख्यात्मक समावेश के रूप में स्पष्ट किया गया है।
