  yaml_path: translation/ot/jeremiah/021/010.yaml
  text: For I have set my face against this city for harm and not for good[a], declares Yahweh. It will be given into the hand of the king of Babylon[b], and he will burn it with fire.
translation:
  language: hi
  text: क्योंकि मैंने इस नगर के विरुद्ध अपना रुख कर लिया है—इसके अहित के लिए, न कि इसकी भलाई के लिए—याहवे की यह घोषणा है। इसे बाबेल के राजा के हाथ में दे दिया जाएगा[b], और वह इसे आग से जला देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “बाबेल के राजा के हाथ में”; यह मुहावरा उसके अधिकार या वश में दिए जाने का अर्थ रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂמְתִּי פָנַי
  choice: मैंने ... के विरुद्ध अपना मुख कर लिया है
  rationale: इब्रानी मुहावरे की मुख-सम्बन्धी छवि और दृढ़ विरोध का भाव बनाए रखता है; प्रसंग के आधार पर ‘के विरुद्ध’ स्वाभाविक रूप से स्पष्ट किया गया है।
- source_word: לְרָעָה וְלֹא לְטוֹבָה
  choice: उसकी भलाई के लिए नहीं, बल्कि उसकी हानि के लिए
  rationale: इब्रानी के तीखे ‘हानि/भलाई’ विरोध को स्वाभाविक हिन्दी क्रम में रखता है। यहाँ רָעָה नैतिक बुराई के बजाय विपत्ति या हानिकारक न्याय को सूचित करता है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: गंभीर भविष्यद्वाणी-सूत्र को आधुनिक, गरिमापूर्ण हिन्दी में व्यक्त करता है और יהוה को उसके व्यक्तिगत नाम ‘याहवे’ से प्रस्तुत करता है।
- source_word: בְּיַד מֶלֶךְ בָּבֶל
  choice: बाबेल के राजा के हाथ में
  rationale: मूल इब्रानी मुहावरा सुरक्षित रहता है; इसका आशय राजा के अधिकार या वश में सौंपा जाना है।
- source_word: תִּנָּתֵן
  choice: दे दिया जाएगा
  rationale: निफ़अल के कर्मवाच्य रूप को दर्शाता है; स्त्रीलिंग कर्ता ‘नगर’ के लिए हिन्दी में स्वाभाविक पुल्लिंग क्रिया रखी गई है।
- source_word: וּשְׂרָפָהּ בָּאֵשׁ
  choice: और वह उसे आग में जला देगा
  rationale: क्रिया के सक्रिय रूप, पुल्लिंग एकवचन कर्ता और नगर को सूचित करने वाले कर्म को बनाए रखता है; निहित कर्ता बाबेल का राजा है।
theological_decisions:
- issue: לְרָעָה में ईश्वरीय न्याय की भाषा
  choice: हानि के लिए
  alternative: बुराई के लिए; विपत्ति के लिए
  rationale: प्रसंग में רָעָה का अर्थ नगर पर आने वाली विपत्ति अथवा हानिकारक न्याय है। ‘हानि’ मूल के व्यापक प्रतिकूल भाव और ‘भलाई’ के साथ उसके विरोध को रखता है, पर परमेश्वर की ओर नैतिक बुराई का अर्थ अनावश्यक रूप से आरोपित नहीं करता।
- issue: יהוה का निरूपण
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: व्यक्तिगत ईश्वरीय नाम को शीर्षक से बदलने के बजाय लिप्यंतरित करना मूल पाठ की विशिष्टता को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘अपना मुख कर लिया है’ और ‘हाथ में’ जैसे मूल इब्रानी बिंब सुरक्षित हैं, जबकि वाक्य-विन्यास हिन्दी की स्वाभाविकता के अनुसार है।
