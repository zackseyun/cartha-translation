  text: הַ/יֹּשֵׁב֙ בָּ/עִ֣יר הַ/זֹּ֔את יָמ֕וּת בַּ/חֶ֖רֶב וּ/בָ/רָעָ֣ב וּ/בַ/דָּ֑בֶר וְ/הַ/יּוֹצֵא֩ וְ/נָפַ֨ל עַל הַ/כַּשְׂדִּ֜ים הַ/צָּרִ֤ים עֲלֵי/כֶם֙ יחיה וְ/הָֽיְתָה לּ֥/וֹ נַפְשׁ֖/וֹ לְ/שָׁלָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/009.yaml
  text: The one who stays in this city will die by the sword[a], by famine, and by pestilence; but the one who goes out and defects to the Chaldeans who are besieging you will live[b], and his life will be to him as plunder.
translation:
  language: hi
  text: जो कोई इस नगर में रहेगा, वह तलवार, अकाल और महामारी से मरेगा; पर जो कोई बाहर निकलकर तुम्हें घेरने वाले कसदियों की ओर जा मिलेगा[a], वह जीवित रहेगा, और उसका जीवन उसके लिए लूट के समान होगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् वह कसदियों के पक्ष में चला जाएगा या उनके सामने आत्मसमर्पण कर देगा। इब्रानी में शाब्दिक भाव है, “उन पर जा गिरेगा।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उसका जीवन उसके लिए लूट होगा”; अर्थात् वह केवल अपना जीवन बचाकर निकलेगा।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיֹּשֵׁב בָּעִיר הַזֹּאת
  choice: जो कोई इस नगर में रहेगा
  rationale: ישב का कृदंत यहाँ केवल बैठने नहीं, घेराबंदी के दौरान नगर में बने रहने का भाव देता है। ‘जो कोई’ प्रतिनिधिक एकवचन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בַּחֶרֶב וּבָרָעָב וּבַדָּבֶר
  choice: तलवार, अकाल और महामारी से
  rationale: यह यिर्मयाह में बार-बार आने वाली त्रयी है। ‘तलवार’ ठोस बिंब बनाए रखता है और דֶּבֶר के न्याय-संदर्भित अर्थ के लिए ‘महामारी’ सहज आधुनिक हिन्दी है।
- source_word: וְהַיּוֹצֵא וְנָפַל עַל
  choice: पर जो कोई बाहर निकलकर … के पास चला जाएगा
  rationale: संयोजक यहाँ विरोध दर्शाता है। सैन्य संदर्भ में נפל על शत्रु-पक्ष के पास चले जाने या उसके सामने आत्मसमर्पण करने का मुहावरा है; मुख्य पाठ का चयन अर्थ को स्पष्ट रखता है, जबकि अधिक स्पष्ट राजनीतिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: הַכַּשְׂדִּים
  choice: कसदियों
  rationale: मूल जातिनाम ‘कसदी’ को बनाए रखा गया है; ‘बाबुलवासी’ ऐतिहासिक संदर्भ तो स्पष्ट करता, पर मूल की शब्दावली को बदल देता।
- source_word: הַצָּרִים עֲלֵיכֶם
  choice: तुम्हें घेरने वाले
  rationale: צור का कृदंत इस प्रसंग में सैन्य घेराबंदी को सूचित करता है।
- source_word: יִחְיֶה
  choice: जीवित रहेगा
  rationale: सामान्य क्रिया ‘जीना’ को रखा गया है; यहाँ व्यावहारिक अर्थ बच निकलना है, जिसे अगला मुहावरा स्पष्ट करता है।
- source_word: וְהָיְתָה לּוֹ נַפְשׁוֹ לְשָׁלָל
  choice: और उसका प्राण उसके लिए लूट के समान होगा
  rationale: यिर्मयाह में मिलने वाले ‘प्राण लूट के रूप में’ मुहावरे का रूपक सुरक्षित रखा गया है। इसका आशय है कि विपत्ति में उसके हाथ केवल उसका जीवन लगेगा।
- source_word: נַפְשׁוֹ
  choice: उसका प्राण
  rationale: נפש यहाँ जीवित जीवन या जान को दर्शाता है, अमूर्त आत्मा के विषय में कोई पृथक दावा नहीं। ‘प्राण’ हिन्दी बाइबलीय गरिमा और जीवन के अर्थ दोनों को सँभालता है।
theological_decisions:
- issue: बच निकलने के मुहावरे में נֶפֶשׁ का मानवशास्त्रीय अर्थ
  choice: मुख्य पाठ में ‘उसका प्राण’ और पादटिप्पणी में ‘केवल अपनी जान बचाकर निकलेगा’
  alternative: ‘उसकी आत्मा’
  rationale: प्रसंग घेराबंदी में शारीरिक जीवन बचने का है। ‘आत्मा’ अनावश्यक रूप से देह से पृथक अमूर्त सत्ता का धार्मिक दावा सुझा सकती है; ‘प्राण’ यहाँ जीवन/जान का संदर्भ बनाए रखता है।
- issue: וְנָפַל עַל का सैन्य-राजनीतिक आशय
  choice: ‘के पास चला जाएगा’ के साथ पादटिप्पणी में ‘उनके पक्ष में चला जाएगा/आत्मसमर्पण करेगा’
  alternative: मुख्य पाठ में केवल ‘पक्ष बदलकर जा मिलेगा’
  rationale: हिब्रू के गति-बिंब और उसके प्रसंगगत आत्मसमर्पण-अर्थ दोनों को सुरक्षित रखा गया है, बिना यह तय किए कि कार्य को केवल राजनीतिक दलबदल कहा जाए या औपचारिक आत्मसमर्पण।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सुबोध शैली रखी गई है। ‘कसदी’, ‘प्राण’ और ‘लूट’ मूल के जातिनाम तथा रूपक को सुरक्षित रखते हैं; दोनों कठिन इब्रानी मुहावरों को पादटिप्पणियों में स्पष्ट किया गया है।
