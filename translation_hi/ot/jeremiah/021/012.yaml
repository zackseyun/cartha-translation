  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בֵּ֣ית דָּוִ֗ד כֹּ֚ה אָמַ֣ר יְהוָ֔ה דִּ֤ינוּ לַ/בֹּ֨קֶר֙ מִשְׁפָּ֔ט וְ/הַצִּ֥ילוּ גָז֖וּל מִ/יַּ֣ד עוֹשֵׁ֑ק פֶּן תֵּצֵ֨א כָ/אֵ֜שׁ חֲמָתִ֗/י וּ/בָעֲרָה֙ וְ/אֵ֣ין מְכַבֶּ֔ה מִ/פְּנֵ֖י רֹ֥עַ מעללי/הם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/012.yaml
  text: 'House of David[a], thus says Yahweh: Administer justice in the morning, and deliver the one who has been robbed from the hand of the oppressor, lest my wrath go out like fire and burn with no one to quench it[c][b], because of the evil of their deeds.'
translation:
  language: hi
  text: 'हे दाऊद के घराने, यहोवा यों कहता है: सुबह न्याय करो, और लूटे गए व्यक्ति को अत्याचारी के हाथ से छुड़ाओ[a], ऐसा न हो कि मेरा क्रोध आग की तरह निकल पड़े[b] और भड़के, और उसे बुझानेवाला कोई न हो—उनके बुरे कामों के कारण।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अत्याचारी के हाथ से” एक मुहावरा है; इसका अर्थ उसके अधिकार या नियंत्रण से है।
    reason: cultural_note
  - marker: b
    text: 'या: “मेरा रोष आग की तरह निकल पड़े।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית דָּוִד
  choice: हे दाऊद के घराने
  rationale: यह संबोधन दाऊद के राजवंश अथवा राजघराने से है। ‘घराना’ आधुनिक हिन्दी में वंश और राजपरिवार दोनों का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ रखा गया है।
- source_word: דִּינוּ לַבֹּקֶר מִשְׁפָּט
  choice: हर सुबह न्याय करो
  rationale: דין और מִשְׁפָּט का संयुक्त प्रयोग शासकीय न्याय करने की आज्ञा देता है। לַבֹּקֶר नियमित और तत्पर न्याय का संकेत दे सकता है; ‘हर सुबह’ इसे संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְהַצִּילוּ גָזוּל
  choice: लूटे गए व्यक्ति को ... छुड़ाओ
  rationale: גָזוּל उस व्यक्ति को सूचित करता है जिसे लूटा या अन्यायपूर्वक वंचित किया गया है; הַצִּילוּ ठोस हस्तक्षेप करके उसे बचाने की आज्ञा है।
- source_word: מִיַּד עוֹשֵׁק
  choice: अत्याचारी के हाथ से
  rationale: ‘हाथ से’ मूल इब्रानी बिंब को बनाए रखता है और यहाँ किसी की शक्ति अथवा नियंत्रण से छुड़ाने का मुहावरा है।
- source_word: פֶּן
  choice: नहीं तो
  rationale: यह चेतावनी के रूप में आने वाले परिणाम को प्रस्तुत करता है। आधुनिक हिन्दी में ‘नहीं तो’ गंभीरता को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: תֵּצֵא כָאֵשׁ חֲמָתִי
  choice: मेरा क्रोध आग के समान भड़क उठेगा
  rationale: शाब्दिक ‘आग के समान निकल पड़े’ हिन्दी में अस्वाभाविक होता; ‘भड़क उठेगा’ क्रोध के बाहर प्रकट होने और अग्नि-बिंब दोनों को सुरक्षित रखता है।
- source_word: וּבָעֲרָה וְאֵין מְכַבֶּה
  choice: और ऐसा जलेगा कि कोई उसे बुझा न सके
  rationale: यह आग के रूपक को जारी रखते हुए न्याय-दंड के अनिवार्य और न बुझ सकने वाले स्वरूप को व्यक्त करता है।
- source_word: מִפְּנֵי רֹעַ מעלליהם
  choice: तुम्हारे बुरे कामों के कारण
  rationale: मासोरेटिक पाठ का प्रत्यय तृतीय पुरुष बहुवचन (‘उनके’) है, पर संबोधन द्वितीय पुरुष में है और कुछ पाठ-साक्ष्य द्वितीय पुरुष का समर्थन करते हैं। मुख्य पाठ में संदर्भानुकूल ‘तुम्हारे’ रखा गया और पाठांतर को टिप्पणी में बताया गया है।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: व्यक्तिगत नाम को उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं किया गया। ‘यहोवा’ हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला रूप है।
- issue: न्याय की आज्ञा की कालगत शक्ति
  choice: हर सुबह न्याय करो
  alternative: सुबह न्याय करो; प्रतिदिन सवेरे न्याय करो
  rationale: לַבֹּקֶר का मूल अर्थ ‘सुबह’ है और राजकीय न्याय के संदर्भ में नियमितता का अर्थ संभव है। ‘हर सुबह’ इसी संभावित पुनरावृत्ति को व्यक्त करता है, बिना न्याय को केवल एक घटना बनाने के।
- issue: क्रोध और आग के संबंध का चित्रण
  choice: मेरा क्रोध आग के समान भड़क उठेगा
  alternative: मेरा रोष आग के समान निकल पड़ेगा
  rationale: रूपक को वास्तविक आग या केवल भावना में सीमित नहीं किया गया; भाषा परमेश्वर के क्रोध से आने वाले दंड का सजीव बिंब बनाए रखती है।
- issue: अंतिम सर्वनाम का पाठगत तनाव
  choice: तुम्हारे बुरे कामों के कारण
  alternative: उनके बुरे कामों के कारण
  rationale: व्याकरणिक संबोधन के अनुरूप द्वितीय पुरुष स्वाभाविक है, जबकि WLC में तृतीय पुरुष प्रत्यय है। अस्पष्टता को छिपाने के बजाय पादटिप्पणी में मूल पाठ का रूप दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘हे दाऊद के घराने’ भविष्यद्वाणी के सीधे संबोधन को बनाए रखता है। न्याय-संबंधी शब्दावली सामान्य पाठक के लिए स्पष्ट है, जबकि ‘अत्याचारी के हाथ से’ जैसे मूल बिंब को संक्षिप्त टिप्पणी के साथ सुरक्षित रखा गया है।
