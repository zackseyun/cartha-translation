id: JER.21.5
reference: Jeremiah 21:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/נִלְחַמְתִּ֤י אֲנִי֙ אִתְּ/כֶ֔ם בְּ/יָ֥ד נְטוּיָ֖ה וּ/בִ/זְר֣וֹעַ חֲזָקָ֑ה וּ/בְ/אַ֥ף וּ/בְ/חֵמָ֖ה וּ/בְ/קֶ֥צֶף גָּדֽוֹל׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/005.yaml
  text: And I myself will fight against you with an outstretched hand and a strong arm[b][a], and with anger and wrath and great fury.
translation:
  language: hi
  text: और मैं स्वयं तुम्हारे विरुद्ध अपने बढ़ाए हुए हाथ और बलवान भुजा से[a], और क्रोध, रोष और बड़े प्रकोप के साथ लड़ूँगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘बढ़ाए हुए हाथ और बलवान भुजा से।’ यह निर्णायक ईश्वरीय सामर्थ्य का प्रचलित पदबंध है, जिसका प्रयोग प्रायः निर्गमन के प्रसंगों में होता है; पर यहाँ यह न्याय के लिए प्रयुक्त हुआ है।
    reason: cross_reference
  - marker: b
    text: ‘बड़े प्रकोप’ का अनुवाद ‘महान रोष’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִלְחַמְתִּי
  choice: और ... लड़ूँगा
  rationale: निफ़अल रूप यहाँ प्रथम पुरुष एकवचन भावी क्रिया है। ‘लड़ूँगा’ स्वाभाविक हिन्दी में परमेश्वर की प्रत्यक्ष विरोधी कार्रवाई को स्पष्ट रखता है।
- source_word: אֲנִי
  choice: मैं स्वयं
  rationale: क्रिया में पुरुष पहले से निहित होने पर भी स्वतंत्र सर्वनाम बल देता है; ‘मैं स्वयं’ उस जोर को बनाए रखता है।
- source_word: אִתְּכֶם
  choice: तुम्हारे विरुद्ध
  rationale: נלחם के साथ אֵת का अर्थ शत्रुतापूर्ण रूप से ‘के विरुद्ध’ है, न कि सहयोग के अर्थ में ‘के साथ’।
- source_word: בְּיָד נְטוּיָה
  choice: बढ़े हुए हाथ से
  rationale: यह निर्णायक ईश्वरीय सामर्थ्य का स्थापित मानवरूपी बिंब है। शाब्दिक चित्र और निर्गमन-संबंधी प्रतिध्वनि दोनों सुरक्षित रहते हैं।
- source_word: וּבִזְרֹעַ חֲזָקָה
  choice: और बलवन्त भुजा से
  rationale: यह समानांतर शारीरिक बिंब को बनाए रखता है; ‘बलवन्त’ गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य है।
- source_word: וּבְאַף
  choice: और क्रोध ... के साथ
  rationale: אַף का शाब्दिक अर्थ ‘नाक’ है, पर यहाँ मुहावरे में क्रोध है। ‘क्रोध’ अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וּבְחֵמָה
  choice: जलजलाहट
  rationale: חֵמָה उष्ण, प्रचंड क्रोध को दर्शाता है। ‘जलजलाहट’ भविष्यद्वाणी के गरिमापूर्ण स्तर और मूल की क्रमिक क्रोध-शब्दावली को बनाए रखती है।
- source_word: וּבְקֶצֶף גָּדוֹל
  choice: बड़े रोष के साथ
  rationale: קֶצֶף तीव्र रोष है और גָּדוֹל उसकी प्रबलता बढ़ाता है। ‘बड़े रोष’ से चरमोत्कर्ष बना रहता है और पिछले पदों की अनावश्यक पुनरावृत्ति नहीं होती।
theological_decisions:
- issue: ईश्वरीय कार्रवाई की मानवरूपी भाषा
  choice: ‘बढ़े हुए हाथ और बलवन्त भुजा’ के शारीरिक बिंब को बनाए रखा गया।
  alternative: ‘महान सामर्थ्य से’ कहकर अर्थानुवाद करना।
  rationale: मूल इब्रानी जानबूझकर परमेश्वर की सीधी और निर्णायक शक्ति का देहात्मक बिंब प्रयोग करता है, जो निर्गमन और न्याय के प्रसंगों से जुड़ता है। इसे सपाट व्याख्या में बदलना अंतर्पाठीय प्रतिध्वनि खो देगा।
- issue: निर्गमन के उद्धार-बिंब का न्याय की ओर पलटना
  choice: स्थापित पदबंध को इस न्याय-वचन में बिना नरम किए रखा गया।
  alternative: केवल सामान्य युद्ध-शक्ति के रूप में परिभाषित करना।
  rationale: जिस भाषा का प्रयोग प्रायः उद्धार के लिए होता है, यहाँ वही यरूशलेम के विरुद्ध न्याय के लिए आती है; इस धर्मवैचारिक तनाव को सुरक्षित रखना आवश्यक है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यद्वाणी-शैली रखी गई है। ‘मैं स्वयं’ मूल के जोर को, और तीन अलग क्रोध-संज्ञाएँ मूल की संचयी तीव्रता को व्यक्त करती हैं।
