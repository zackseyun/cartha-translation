  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ने कहा
  rationale: वाव-परिणामी कथा में अगली घटना बताता है; आधुनिक हिन्दी में बार-बार ‘और’ जोड़ने के बजाय ‘ने कहा’ स्वाभाविक है।
- source_word: יִרְמְיָהוּ
  choice: यिर्मयाह
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: אֲלֵיהֶם
  choice: उनसे
  rationale: אֶל तथा तृतीय पुरुष बहुवचन प्रत्यय संबोधित श्रोताओं को दर्शाते हैं; हिन्दी में ‘उनसे कहा’ स्वाभाविक प्रयोग है।
- source_word: כֹּה
  choice: यह
  rationale: यह औपचारिक संदेश की विषय-वस्तु प्रस्तुत करता है; ‘यह कहना’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक संदेश-सूत्र है।
- source_word: תֹאמְרֻן
  choice: तुम लोग ... कहना
  rationale: द्वितीय पुरुष पुल्लिंग बहुवचन अपूर्ण रूप यहाँ निर्देशात्मक है; ‘तुम लोग’ बहुवचन को स्पष्ट करता है और ‘कहना’ आदेश का स्वाभाविक हिन्दी रूप है।
- source_word: אֶל
  choice: से
  rationale: यह संदेश के संबोधित व्यक्ति को चिह्नित करता है; ‘सिदकिय्याह से ... कहना’ मानक हिन्दी वाक्य-विन्यास है।
- source_word: צִדְקִיָּהוּ
  choice: सिदकिय्याह
  rationale: राजा के नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
