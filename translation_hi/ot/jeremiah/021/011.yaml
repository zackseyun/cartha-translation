base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/011.yaml
  text: 'And to the house of the king of Judah: Hear the word of Yahweh[a].'
translation:
  language: hi
  text: और यहूदा के राजा के घराने[a], याहवे का वचन सुनो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और यहूदा के राजा के घराने के विषय में।” इब्रानी संबंधबोधक उपसर्ग नए संबोधन को राजघराने की ओर निर्देशित भी कर सकता है और उसके विषय में कथन का परिचय भी दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/בֵית
  choice: और ... के घराने से कहो
  rationale: וּ पिछले कथन से जोड़ता है और לְ नए संबोधन को चिह्नित करता है। हिन्दी में केवल ‘घराने को’ अस्वाभाविक है, इसलिए निहित संबोधन को ‘से कहो’ द्वारा स्वाभाविक रूप दिया गया है; בֵית को ‘घराना’ कहा गया है क्योंकि यहाँ राजपरिवार या राजकीय वंश सामूहिक रूप से संबोधित है।
- source_word: מֶלֶךְ יְהוּדָה
  choice: यहूदा के राजा
  rationale: यह रचनात्मक संबंध का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: שִׁמְעוּ
  choice: सुनो
  rationale: बहुवचन आज्ञार्थक रूप है, जो पूरे राजघराने को संबोधित करता है; ‘सुनो’ भविष्यद्वक्ताई आदेश की संक्षिप्त और प्रभावी शक्ति बनाए रखता है।
- source_word: דְּבַר
  choice: वचन
  rationale: भविष्यद्वक्ताई सूत्र में דָּבָר के लिए ‘वचन’ स्थापित, गरिमापूर्ण और अर्थानुकूल हिन्दी है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा ‘प्रभु’
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे प्रयुक्त है; ‘याहवे’ उसका निकट लिप्यंतरण है और नाम को उपाधि में नहीं बदलता।
- issue: בֵית מֶלֶךְ יְהוּדָה का आशय
  choice: यहूदा के राजा का घराना
  alternative: यहूदा के राजा का भवन/महल
  rationale: सामूहिक बहुवचन आज्ञा שִׁמְעוּ संकेत करती है कि संबोधन राजकीय परिवार या राजघराने से है, केवल इमारत से नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यद्वक्ताई शैली रखी गई है। ‘घराना’ सामान्य पाठक के लिए राजपरिवार/राजवंश का अर्थ स्पष्ट करता है; उद्धरण-चिह्न निहित प्रत्यक्ष संबोधन को पठनीय बनाते हैं।
