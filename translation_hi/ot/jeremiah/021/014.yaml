reference: Jeremiah 21:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/פָקַדְתִּ֧י עֲלֵי/כֶ֛ם כִּ/פְרִ֥י מַעַלְלֵי/כֶ֖ם נְאֻם יְהוָ֑ה וְ/הִצַּ֤תִּי אֵשׁ֙ בְּ/יַעְרָ֔/הּ וְ/אָכְלָ֖ה כָּל סְבִיבֶֽי/הָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/014.yaml
  text: And I will punish you according to the fruit of your deeds[a], declares Yahweh, and I will kindle a fire in her forest[b], and it will consume all that is around her.
translation:
  language: hi
  text: 'याहवे की यह घोषणा है: “मैं तुम्हारे कामों के फल के अनुसार तुम्हें दंड दूँगा[a], और मैं उसके वन में आग लगाऊँगा[b], और वह उसके चारों ओर की सब वस्तुओं को भस्म कर देगी।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस इब्रानी क्रिया का अर्थ “तुम्हारी सुधि लेना” या “तुम्हारा लेखा लेना” भी हो सकता है; यहाँ न्याय के प्रसंग में दंड का भाव स्पष्ट है।
    reason: lexical_alternative
  - marker: b
    text: “उसका वन” सम्भवतः काव्यात्मक रूप से यरूशलेम या उसके राजकीय अथवा महल-परिसर की ओर संकेत करता है। कुछ लोग “वन” को इमारतों या किलेबंदियों की घनी पंक्ति का रूपक मानते हैं।
    reason: cultural_note
lexical_decisions:
- source_word: וּפָקַדְתִּי עֲלֵיכֶם
  choice: मैं तुम्हें दण्ड दूँगा
  rationale: פקד का अर्थ-क्षेत्र व्यापक है, पर न्याय के इस प्रसंग में दण्ड देना स्वाभाविक अर्थ है; על को हिन्दी में सीधे कर्म के रूप में व्यक्त किया गया है।
- source_word: כִּפְרִי מַעַלְלֵיכֶם
  choice: तुम्हारे कामों के फल के अनुसार
  rationale: फल का प्रतिफल-सूचक रूपक बनाए रखते हुए כ की अनुरूपता या माप की भावना व्यक्त होती है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: मानक नबूवत-सूत्र का स्पष्ट और गरिमापूर्ण हिन्दी रूप; याहवे व्यक्तिगत ईश्वरीय नाम को सुरक्षित रखता है।
- source_word: וְהִצַּתִּי אֵשׁ
  choice: मैं ... आग लगाऊँगा
  rationale: हिफ़ील रूप आग प्रज्वलित करने का कारक अर्थ देता है; ‘आग लगाऊँगा’ आधुनिक हिन्दी में सहज है।
- source_word: בְּיַעְרָהּ
  choice: उसके वन में
  rationale: יער का सीधा अर्थ ‘वन’ है और स्त्रीलिंग प्रत्यय को ‘उसके’ द्वारा सुरक्षित रखा गया है, बिना उसके संकेतित पात्र को मुख्य पाठ में निश्चित किए।
- source_word: וְאָכְלָה כָּל סְבִיבֶיהָ
  choice: और वह उसके चारों ओर की हर वस्तु को भस्म कर देगी
  rationale: आग के विषय में אכל का अर्थ निगलना या भस्म करना है; ‘वह’ आग की ओर संकेत करता है और स्त्रीलिंग नगर-संबंधी प्रत्यय ‘उसके’ में बना रहता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुरक्षरी व्यक्तिगत नाम है; लिप्यंतरण नाम को उपाधि से प्रतिस्थापित नहीं करता।
- issue: ‘उसके वन’ और ‘उसके चारों ओर’ के स्त्रीलिंग प्रत्ययों का संकेत
  choice: स्त्रीलिंग/एकवचन संकेत को ‘उसके’ के रूप में बनाए रखना और मुख्य पाठ में पात्र को अनिर्धारित छोड़ना
  alternative: यरूशलेम, सिय्योन या राजमहल-परिसर को स्पष्ट रूप से लिखना
  rationale: मूल सम्भवतः नगर को स्त्री के रूप में व्यक्त करता है, पर वन का ठीक संकेत व्याख्यात्मक रूप से विवाद्य है; इसलिए साहित्यिक अस्पष्टता सुरक्षित रखी गई है।
- issue: פקד का न्याय-संदर्भीय बल
  choice: दण्ड दूँगा
  alternative: तुम्हारी सुधि लूँगा; तुमसे लेखा लूँगा
  rationale: क्रिया व्यापक अर्थ रखती है, किन्तु कामों के फल के अनुसार प्रतिफल देने और आग द्वारा विनाश के प्रसंग में दण्डात्मक अर्थ प्रमुख है; व्यापकता पादटिप्पणी में बताई गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण नबूवत-संबंधी शैली रखी गई है। ‘कामों के फल’ का मूल रूपक, ईश्वरीय नाम ‘याहवे’, और स्त्रीलिंग नगर-संकेत की अस्पष्टता सुरक्षित हैं।
