source:
  edition: WLC
  text: הַ/דָּבָ֛ר אֲשֶׁר הָיָ֥ה אֶֽל יִרְמְיָ֖הוּ מֵ/אֵ֣ת יְהוָ֑ה בִּ/שְׁלֹ֨חַ אֵלָ֜י/ו הַ/מֶּ֣לֶךְ צִדְקִיָּ֗הוּ אֶת פַּשְׁחוּר֙ בֶּן מַלְכִּיָּ֔ה וְ/אֶת צְפַנְיָ֧ה בֶן מַעֲשֵׂיָ֛ה הַ/כֹּהֵ֖ן לֵ/אמֹֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/001.yaml
  text: The word that came to Jeremiah from Yahweh when King Zedekiah sent to him Pashhur son of Malchiah and Zephaniah son of Maaseiah the priest[a], saying,
translation:
  language: hi
  text: 'यह वह वचन है जो याहवे[a] की ओर से यिर्मयाह के पास उस समय आया, जब राजा सिदकिय्याह ने मल्किय्याह के पुत्र पशहूर और मासेयाह के पुत्र याजक सपन्याह को उसके पास भेजा और कहा:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में परमेश्वर का व्यक्तिगत नाम יהוה (YHWH) है; यहाँ उसका लिप्यंतरण ‘याहवे’ किया गया है।
    reason: ईश्वरीय नाम के स्रोत-रूप और अनुवाद-पद्धति को स्पष्ट करना।
lexical_decisions:
- source_word: הַדָּבָר
  choice: वचन
  rationale: नबूवत के आरंभिक सूत्र में דָּבָר परमेश्वर से प्राप्त ‘वचन’ या ‘संदेश’ को दर्शाता है। ‘वचन’ सूत्रात्मक बल बनाए रखता है और हिंदी बाइबलीय भाषा में सहज है।
- source_word: אֲשֶׁר הָיָה אֶל
  choice: जो ... के पास ... आया
  rationale: यह नबूवत संबंधी प्रचलित इब्रानी मुहावरा है। हिंदी में ‘वचन ... के पास आया’ प्रकाशन के यिर्मयाह तक पहुँचने का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: מֵאֵת יְהוָה
  choice: याहवे की ओर से
  rationale: מֵאֵת स्रोत बताता है; इसलिए ‘की ओर से’ उपयुक्त है। יהוה को उसके व्यक्तिगत नाम ‘याहवे’ से लिप्यंतरित किया गया है।
- source_word: בִּשְׁלֹחַ
  choice: उस समय ... जब ... ने ... भेजा
  rationale: בְּ के साथ infinitive construct यहाँ समय-संबंध प्रकट करता है। यह हिंदी रचना उस कालिक संबंध को स्पष्ट और सहज रखती है।
- source_word: אֵלָיו
  choice: उसके पास
  rationale: सर्वनाम का संदर्भ यिर्मयाह है। ‘उसके पास’ मूल पाठ की सर्वनामिक कड़ी बनाए रखता है।
- source_word: הַמֶּלֶךְ צִדְקִיָּהוּ
  choice: राजा सिदकिय्याह
  rationale: हिंदी में पदवी को नाम से पहले रखना स्वाभाविक है।
- source_word: פַּשְׁחוּר בֶּן מַלְכִּיָּה
  choice: मल्किय्याह के पुत्र पशहूर
  rationale: हिंदी की स्वाभाविक संबंधसूचक रचना अपनाते हुए दोनों व्यक्तिनामों का लिप्यंतरण किया गया है।
- source_word: צְפַנְיָה בֶן מַעֲשֵׂיָה הַכֹּהֵן
  choice: मासेयाह के पुत्र याजक सपन्याह
  rationale: ‘याजक’ को सपन्याह की उपाधि मानते हुए हिंदी में उसके नाम से पहले रखा गया है; इससे लंबी वंशसूचक अभिव्यक्ति स्पष्ट रहती है।
- source_word: לֵאמֹר
  choice: यह कहने के लिए
  rationale: यह उद्धरण-सूचक पद अगले पद में आने वाले कथन का परिचय देता है। पद के अंत में विसर्ग अगले कथन की ओर संकेत करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे प्रयुक्त है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और नाम तथा उपाधि के बीच भेद बनाए रखता है।
- issue: הַכֹּהֵן (‘याजक’) किसकी पहचान कराता है
  choice: सपन्याह
  alternative: मासेयाह
  rationale: निकटवर्ती संरचना को अलग-अलग तरह से समझना संभव दिख सकता है, पर यिर्मयाह में इसी व्यक्ति की अन्य पहचान और नाम-उपाधि की इब्रानी संरचना ‘याजक’ को सपन्याह की उपाधि मानने का समर्थन करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘वचन’ नबूवत के पारंपरिक सूत्र को सुरक्षित रखता है, जबकि वाक्यक्रम हिंदी के अनुरूप है। पद अगले पद में जारी कथन का परिचय है, इसलिए अंत में विसर्ग लगाया गया है।
