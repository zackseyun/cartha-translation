id: JER.21.8
reference: Jeremiah 21:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אֶל הָ/עָ֤ם הַ/זֶּה֙ תֹּאמַ֔ר כֹּ֖ה אָמַ֣ר יְהוָ֑ה הִנְ/נִ֤י נֹתֵן֙ לִ/פְנֵי/כֶ֔ם אֶת דֶּ֥רֶךְ הַ/חַיִּ֖ים וְ/אֶת דֶּ֥רֶךְ הַ/מָּֽוֶת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/008.yaml
  text: 'And to this people you shall say[a], ‘Thus says Yahweh: Behold, I am setting before you the way of life and the way of death.’'
translation:
  language: hi
  text: 'और इस प्रजा से कहना, “याहवे यों कहता है: देखो, मैं तुम्हारे सामने जीवन का मार्ग और मृत्यु का मार्ग रख रहा हूँ।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֶל הָ/עָם הַ/זֶּה
  choice: और इस प्रजा से
  rationale: संयोजक וְ पिछले प्रसंग से संबंध बनाए रखता है; עָם का एकवचन सामूहिक अर्थ ‘प्रजा’ से स्वाभाविक रूप में व्यक्त होता है।
- source_word: תֹּאמַר
  choice: तुम कहना
  rationale: यहाँ अपूर्ण क्रिया यिर्मयाह को दिए गए निर्देश का कार्य करती है; हिंदी में ‘तुम कहना’ उसका सीधा और स्वाभाविक आदेशात्मक रूप है।
- source_word: כֹּה אָמַר יְהוָה
  choice: याहवे यह कहता है
  rationale: यह नबी-संदेश का स्थापित सूत्र है। यह रूप आधुनिक हिंदी में स्वाभाविक रहते हुए कथन की औपचारिक गंभीरता और वर्तमान घोषणा को बनाए रखता है।
- source_word: הִנְנִי
  choice: देखो
  rationale: यह कण श्रोता का ध्यान खींचकर घोषणा की तत्क्षणता और गंभीरता प्रकट करता है।
- source_word: נֹתֵן לִפְנֵיכֶם
  choice: मैं तुम्हारे सामने … रख रहा हूँ
  rationale: נֹתֵן का मूल अर्थ ‘देना’ है, पर לִפְנֵיכֶם के साथ यहाँ विकल्पों को सामने रखने का मुहावरेदार भाव है; कृदंत वर्तमान/आसन्न क्रिया दिखाता है।
- source_word: דֶּרֶךְ הַחַיִּים
  choice: जीवन का मार्ग
  rationale: דֶּרֶךְ यहाँ परिणाम की ओर ले जाने वाली दिशा या जीवन-पद्धति का रूपक है; חַיִּים बहुवचन रूप में होते हुए अमूर्त ‘जीवन’ व्यक्त करता है।
- source_word: דֶּרֶךְ הַמָּוֶת
  choice: मृत्यु का मार्ग
  rationale: यह ‘जीवन का मार्ग’ के समानांतर और उसके विरोध में है; समान संरचना इब्रानी संतुलन को सुरक्षित रखती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ में उपाधि नहीं, चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम है। ‘याहवे’ उसका व्यापक रूप से स्वीकृत आधुनिक लिप्यंतरण है और नाम को उपाधि से प्रतिस्थापित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी की, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘प्रजा’ सामूहिक एकवचन को बनाए रखता है और ‘जीवन का मार्ग… मृत्यु का मार्ग’ मूल समानांतरता को सुरक्षित रखता है।
