source:
  edition: WLC
  text: הִנְ/נִ֨י אֵלַ֜יִ/ךְ יֹשֶׁ֧בֶת הָ/עֵ֛מֶק צ֥וּר הַ/מִּישֹׁ֖ר נְאֻם יְהוָ֑ה הָ/אֹֽמְרִים֙ מִֽי יֵחַ֣ת עָלֵ֔י/נוּ וּ/מִ֥י יָב֖וֹא בִּ/מְעוֹנוֹתֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/013.yaml
  text: Behold[a], I am against you, O inhabitant of the valley, O rock of the plain, declares Yahweh—you who say, “Who will come down against us[b], and who will enter into our dwellings?”
translation:
  language: hi
  text: “देख, हे घाटी में बसनेवाली, हे समतल भूमि की चट्टान, मैं तेरे विरुद्ध हूँ,” याहवे की घोषणा है—“तुम लोग जो कहते हो, ‘कौन हमारे विरुद्ध उतर आएगा[a], और कौन हमारे निवासों[b] में प्रवेश करेगा?’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस इब्रानी क्रिया का अर्थ यहाँ कठिन है। इसका अनुवाद “कौन हम पर उतर पड़ेगा?” भी हो सकता है। आशय यह है कि नगर अपने को आक्रमण से सुरक्षित समझता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ “निवास-स्थान”; यहाँ सुरक्षित निवासों या गढ़ों का भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי אֵלַיִךְ
  choice: देख ... मैं तेरे विरुद्ध हूँ
  rationale: न्याय की भविष्यवाणी में यह इब्रानी मुहावरा गंभीर घोषणा के साथ शत्रुतापूर्ण विरोध व्यक्त करता है। ‘देख’ उसकी आलंकारिक शक्ति बनाए रखता है और स्त्रीलिंग एकवचन ‘तेरे’ नगर के मानवीकरण को दर्शाता है।
- source_word: יֹשֶׁבֶת הָעֵמֶק
  choice: हे घाटी में रहनेवाली
  rationale: स्त्रीलिंग एकवचन कृदंत को संबोधन के रूप में रखा गया है; यह नगर को एक स्त्री के रूप में संबोधित करता है।
- source_word: צוּר הַמִּישֹׁר
  choice: हे समतल भूमि की चट्टान
  rationale: शाब्दिक भौगोलिक बिंब को सुरक्षित रखा गया है। ‘गढ़’ करने से रक्षा-संबंधी आशय मुख्य पाठ में अनावश्यक रूप से निश्चित हो जाता।
- source_word: נְאֻם יְהוָה
  choice: याहवे की घोषणा है
  rationale: यह पारंपरिक भविष्यवाणीय सूत्र है; याहवे परमेश्वर के व्यक्तिगत नाम को प्रत्यक्ष रूप में प्रस्तुत करता है।
- source_word: הָאֹמְרִים
  choice: तुम लोग, जो कहते हो
  rationale: मूल में यह बहुवचन है और मानवीकृत नगर के निवासियों की वाणी बताता है; इसलिए पहले के स्त्रीलिंग एकवचन संबोधन के साथ मूल का वचन-परिवर्तन बनाए रखा गया है।
- source_word: מִי יֵחַת עָלֵינוּ
  choice: कौन हमारे विरुद्ध उतर आएगा
  rationale: क्रिया कठिन है, पर प्रसंग में ऊपर या सुरक्षित स्थान पर बसे नगर पर नीचे उतरकर आक्रमण करने का भाव संभावित है। ‘उतर आएगा’ भौगोलिक और सैनिक दोनों संकेतों को खुला रखता है।
- source_word: בִּמְעוֹנוֹתֵינוּ
  choice: हमारे निवास-स्थानों में
  rationale: मָעוֹן का मूल अर्थ निवास या रहने का स्थान है। ‘गढ़ों’ की तुलना में यह कम व्याख्यात्मक है, जबकि संभावित सुरक्षा-संबंधी अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: व्यक्तिगत ईश्वरीय नाम को नाम के रूप में बनाए रखा गया है; किसी उपाधि से बदलकर मूल की विशिष्टता को कम नहीं किया गया।
- issue: स्त्रीलिंग एकवचन नगर-संबोधन और बहुवचन बोलनेवालों का संबंध
  choice: ‘रहनेवाली/तेरे’ के बाद ‘तुम लोग, जो कहते हो’
  alternative: पूरे संबोधन को केवल एकवचन या केवल बहुवचन कर देना
  rationale: मूल पाठ मानवीकृत नगर को स्त्रीलिंग एकवचन में संबोधित करता है, फिर उसके निवासियों के लिए बहुवचन प्रयोग करता है। इस तनाव को सहज हिंदी में भी बनाए रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक पाठ के अनुकूल रखी गई है। ‘हे’ भविष्यवाणीय संबोधन को स्पष्ट करता है, जबकि ‘तुम लोग’ मूल के एकवचन नगर-संबोधन से बहुवचन निवासियों की वाणी की ओर बदलाव को स्वाभाविक हिंदी में दर्शाता है।
