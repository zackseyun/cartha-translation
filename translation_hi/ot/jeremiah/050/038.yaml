source:
  edition: WLC
  text: חֹ֥רֶב אֶל מֵימֶ֖י/הָ וְ/יָבֵ֑שׁוּ כִּ֣י אֶ֤רֶץ פְּסִלִים֙ הִ֔יא וּ/בָ/אֵימִ֖ים יִתְהֹלָֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/038.yaml
  text: A drought is against her waters[a], and they will dry up, for it is a land of carved idols[b], and they are mad over terrifying things.
translation:
  language: hi
  text: उसके जल पर सूखा पड़ेगा[a], और वे सूख जाएँगे; क्योंकि वह तराशी हुई मूर्तियों का देश है, और वे भयावह वस्तुओं पर उन्मत्त होते हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके जल के विरुद्ध तलवार होगी।” इब्रानी शब्द חֹרֶב का अर्थ “तलवार” या “सूखा/शुष्कता” हो सकता है; यहाँ दोनों अर्थों की प्रतिध्वनि संभव है।
    reason: alternative_reading
  - marker: b
    text: या, “वे भयानक मूर्तियों पर उन्मत्त होते हैं”; इब्रानी अभिव्यक्ति का अर्थ “वे आतंकों के विषय में पागलपन करते हैं” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹרֶב
  choice: सूखा
  rationale: जल के सूख जाने का निकट संदर्भ यहाँ ‘सूखा’ अर्थ को प्रबल बनाता है; फिर भी यही रूप ‘तलवार’ भी समझा जा सकता है, इसलिए वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: אֶל
  choice: के विरुद्ध
  rationale: न्याय की घोषणा में लक्ष्य या विरोध को दर्शाता है; ‘के विरुद्ध’ मूल संरचना को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: מֵימֶיהָ
  choice: उसके जल
  rationale: स्त्रीलिंग एकवचन प्रत्यय बाबेल/उस देश की ओर संकेत करता है; हिन्दी में ‘उसके जल’ स्वाभाविक है और संदर्भ को बनाए रखता है।
- source_word: וְיָבֵשׁוּ
  choice: और वे सूख जाएँगे
  rationale: कर्ता ‘जल’ है और क्रिया अकर्मक भाव में उसके सूख जाने को बताती है।
- source_word: אֶרֶץ פְּסִלִים
  choice: खुदी हुई मूर्तियों का देश
  rationale: פְּסִלִים तराशकर या खोदकर बनाई गई उपासना-मूर्तियों को सूचित करता है; यह अनुवाद ठोस अर्थ को स्पष्ट रखता है।
- source_word: וּבָאֵימִים
  choice: भयावनी वस्तुओं के पीछे
  rationale: אֵימִים का शाब्दिक क्षेत्र ‘भय/भयावनी वस्तुएँ’ है; संदर्भ में ये भयानक मूर्तियाँ हो सकती हैं, पर मूल की संदर्भगत अस्पष्टता रखी गई है।
- source_word: יִתְהֹלָלוּ
  choice: पागल हुए फिरते हैं
  rationale: यह रूप उन्मत्त या विवेकहीन आचरण व्यक्त करता है; आधुनिक हिन्दी में यह निरंतर विक्षिप्त आसक्ति का स्वाभाविक और सजीव बोध देता है।
theological_decisions:
- issue: חֹרֶב का अर्थ और जल से उसका संबंध
  choice: मुख्य पाठ में ‘सूखा’
  alternative: ‘तलवार’
  rationale: जल के तुरंत बाद ‘सूख जाएँगे’ आने से ‘सूखा’ अर्थ संदर्भानुकूल है, किंतु इब्रानी रूप और यिर्मयाह की न्याय-सूत्र शैली ‘तलवार’ अर्थ की वास्तविक संभावना भी रखते हैं। इसलिए उसे पादटिप्पणी में संरक्षित किया गया है।
- issue: אֵימִים का संदर्भ
  choice: ‘भयावनी वस्तुएँ’ कहकर संदर्भ खुला रखा गया
  alternative: ‘भयानक मूर्तियाँ’
  rationale: मूर्ति-पूजा का संदर्भ इन्हें मूर्तियाँ समझने की ओर संकेत करता है, लेकिन शब्द स्वयं सामान्यतः भय उत्पन्न करने वाली वस्तुओं या आतंक का द्योतक हो सकता है; अनुवाद इस तनाव को अनावश्यक रूप से नहीं सुलझाता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज स्तर रखा गया है। ‘सूखा पड़ेगा’ और ‘पागल हुए फिरते हैं’ सामान्य पाठक के लिए स्वाभाविक हैं। सभी पादटिप्पणी चिह्न मुख्य पाठ में दिए गए हैं; वास्तविक इब्रानी अस्पष्टताओं को पादटिप्पणियों में संरक्षित किया गया है।
