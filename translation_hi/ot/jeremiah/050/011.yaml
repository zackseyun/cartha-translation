id: JER.50.11
reference: Jeremiah 50:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֤י תשמחי כִּ֣י תעלזי שֹׁסֵ֖י נַחֲלָתִ֑/י כִּ֤י תפושי כְּ/עֶגְלָ֣ה דָשָׁ֔ה ו/תצהלי כָּ/אֲבִּרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/011.yaml
  text: Because you rejoice[a], because you exult, plunderers of my inheritance, because you frolic like a threshing heifer and neigh like stallions[b],
translation:
  language: hi
  text: क्योंकि तू आनंद मनाती है, क्योंकि तू उल्लसित होती है[a]—हे मेरी विरासत को लूटनेवालो[b]—क्योंकि तू अनाज रौंदती हुई बछिया के समान उछलती-कूदती है और बलवान घोड़ों के समान हिनहिनाती है[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यद्यपि तू आनंद मनाती है, यद्यपि तू उल्लसित होती है।” इब्रानी כִּי का अर्थ यहाँ “क्योंकि” अथवा रियायती अर्थ में “यद्यपि” लिया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: “मेरी विरासत” से आशय यहोवा के अपने लोग और/या उनकी भूमि हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में क्रियाएँ स्त्रीलिंग एकवचन हैं, जो बाबेल नगर को संबोधित करती हैं। “लूटनेवालो” बहुवचन संबोधन है; उसके बाद की क्रियाएँ भी स्त्रीलिंग एकवचन ही रहती हैं।
    reason: grammar
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: बार-बार आया यह अव्यय अपने सामान्य कारणसूचक अर्थ में रखा गया है। अगले पद में आनेवाला दण्ड इस आनन्द और उन्मत्त व्यवहार का प्रत्युत्तर है; concessive अर्थ भी संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: תשמחי / תעלזי
  choice: तू आनन्द मनाती है / तू मगन होती है
  rationale: दोनों स्त्रीलिंग एकवचन क्रियाओं का भेद रखते हुए बाबेल को मानवीकृत स्त्री-नगर के रूप में संबोधित किया गया है। 'मगन' दूसरी क्रिया के अधिक उन्मुक्त उल्लास को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שֹׁסֵי נַחֲלָתִי
  choice: हे मेरी विरासत को लूटनेवालो
  rationale: बहुवचन कृदन्त को संबोधन के रूप में रखा गया है। 'विरासत' भूमि और लोगों—दोनों के लिए सम्भव वाचिक विस्तार को खुला रखती है।
- source_word: תפושי
  choice: तुम ... उछलते-कूदते हो
  rationale: संदर्भ में क्रिया उन्मुक्त, चंचल पशु-गतिविधि बताती है। यह आधुनिक हिन्दी में चित्र और उपहास दोनों को बनाए रखती है।
- source_word: כְּעֶגְלָה דָשָׁה
  choice: अनाज रौंदती हुई बछिया के समान
  rationale: शाब्दिक रूप से दाँवने या अनाज रौंदने में लगी बछिया का कृषि-बिंब है। केवल 'दाँवनेवाली बछिया' की अपेक्षा यह सामान्य पाठक के लिए अधिक स्पष्ट है।
- source_word: ותצהלי כָּאֲבִּרִים
  choice: बलवान घोड़ों के समान हिनहिनाते हो
  rationale: צהל घोड़ों की ध्वनि के लिए 'हिनहिनाना' है। אַבִּירִים मूलतः बलवानों/शक्तिशाली प्राणियों का बहुवचन है; घोड़े का अर्थ संदर्भ से स्पष्ट होता है, पर 'नर घोड़े' की विशिष्टता अनिवार्य नहीं की गई।
theological_decisions:
- issue: स्त्रीलिंग एकवचन और बहुवचन संबोधन का referent
  choice: आरम्भ में बाबेल को मानवीकृत स्त्री-नगर के रूप में 'तू' और आगे उसके लुटेरों को 'तुम'
  alternative: पूरे पद में सामूहिक 'तुम' रखकर व्याकरणिक परिवर्तन को समतल करना
  rationale: इब्रानी के स्त्रीलिंग एकवचन से बहुवचन की ओर परिवर्तन को हिन्दी में दिखाई देना स्रोत की काव्यात्मक और व्याख्यात्मक तनाव को सुरक्षित रखता है।
- issue: כִּי का कारणसूचक या रियायती अर्थ
  choice: मुख्य पाठ में 'क्योंकि'
  alternative: '''यद्यपि'' या ''भले ही'''
  rationale: अव्यय का सामान्य कारणसूचक अर्थ और दण्डादेश का आधार यहाँ सुसंगत है; फिर भी रियायती पाठ सम्भव है और पादटिप्पणी में दिया गया है।
- issue: נַחֲלָתִי का विस्तार
  choice: मेरी विरासत
  alternative: मेरी निज सम्पत्ति / मेरा पैतृक भाग
  rationale: '''विरासत'' वाचा-संबंधी स्वामित्व का संकेत बनाए रखती है और इसे केवल भूमि या केवल लोगों तक सीमित नहीं करती।'
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। 'तू' यहाँ अनादर का सूचक नहीं, बल्कि एक नगर को एकवचन काव्यात्मक संबोधन है। कृषि-बिंब को सामान्य हिन्दी पाठक के लिए स्पष्ट करने हेतु 'अनाज रौंदती हुई' कहा गया है।
