source:
  edition: WLC
  text: כְּ/מַהְפֵּכַ֨ת אֱלֹהִ֜ים אֶת סְדֹ֧ם וְ/אֶת עֲמֹרָ֛ה וְ/אֶת שְׁכֵנֶ֖י/הָ נְאֻם יְהוָ֑ה לֹֽא יֵשֵׁ֥ב שָׁם֙ אִ֔ישׁ וְ/לֹֽא יָג֥וּר בָּ֖/הּ בֶּן אָדָֽם־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/040.yaml
  text: As when God overthrew Sodom and Gomorrah and their neighboring towns[a], declares Yahweh, no man will live there[b], and no son of man will dwell in her.
translation:
  language: hi
  text: जिस प्रकार परमेश्वर ने सदोम, अमोरा और उनके आस-पास के नगरों[a] को उलट दिया था, उसी प्रकार—याहवे की यह घोषणा है—वहाँ कोई मनुष्य नहीं बसेगा, और न कोई मनुष्य उसमें निवास करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “उसके पड़ोसी”; अर्थात सदोम और अमोरा से जुड़े आस-पास के नगर या बस्तियाँ।
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמַהְפֵּכַת
  choice: जैसे ... उलट दिया था, वैसे ही
  rationale: उपसर्ग כְּ तुलना प्रकट करता है और מַהְפֵּכָה विनाशकारी रूप से उलट देने को सूचित करता है। यह रचना उपमा को स्पष्ट और स्वाभाविक हिन्दी में रखती है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: यहाँ यह एकमात्र सच्चे परमेश्वर के लिए प्रयुक्त है, जो सदोम और अमोरा को उलट देने वाला कर्ता है।
- source_word: שְׁכֵנֶיהָ
  choice: उनके आस-पास के नगरों
  rationale: इब्रानी का शाब्दिक अर्थ ‘उसके पड़ोसी’ है। प्रसंग में आशय सदोम और अमोरा से जुड़े निकटवर्ती नगरों या बस्तियों से है; हिन्दी में बहुवचन ‘उनके’ सामूहिक संदर्भ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: यह मानक भविष्यद्वाणी-सूत्र है। ‘घोषणा’ उसके गंभीर और प्रामाणिक स्वर को बनाए रखती है, और יְהוָה को उसके व्यक्तिगत वाचा-नाम ‘याहवे’ से प्रस्तुत किया गया है।
- source_word: יֵשֵׁב
  choice: बसेगा
  rationale: ישׁב का मूल अर्थ बैठना या निवास करना है; उजाड़ होने के इस सूत्र में ‘बसना’ स्थायी मानव आबादी के अभाव को सहज हिन्दी में व्यक्त करता है।
- source_word: אִישׁ
  choice: कोई मनुष्य
  rationale: एकवचन पुल्लिंग संज्ञा यहाँ प्रतिनिधिक अर्थ रखती है। ‘कोई मनुष्य’ मूल अर्थ को रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: יָגוּר
  choice: निवास करेगा
  rationale: גור ठहरने, परदेशी की तरह रहने या निवास करने को सूचित कर सकता है। यहाँ व्यापक आशय यह है कि वहाँ कोई मानव नहीं रहेगा; ‘निवास करेगा’ उस अर्थ और समानांतर पंक्ति दोनों को बनाए रखता है।
- source_word: בֶּן אָדָם
  choice: मनुष्य का कोई पुत्र
  rationale: यह मूल पद का निकट, औपचारिक अनुवाद है और אִישׁ के साथ उसकी काव्यात्मक समानांतरता को सुरक्षित रखता है। पादटिप्पणी इसका सामान्य अर्थ स्पष्ट करती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसका व्यापक रूप से स्वीकृत स्वरांकन है और नाम को सामान्य उपाधि से नहीं बदलता।
- issue: בֶּן אָדָם की संभावित मसीही प्रतिध्वनि
  choice: मनुष्य का कोई पुत्र
  alternative: कोई मानव
  rationale: इस पद में यह अभिव्यक्ति किसी विशिष्ट मसीही उपाधि के रूप में नहीं, बल्कि אִישׁ के समानांतर सामान्य मानव के अर्थ में है। निकट अनुवाद को मुख्य पाठ में रखते हुए पादटिप्पणी उसके सामान्य आशय को स्पष्ट करती है, ताकि न तो संभावित भाषिक प्रतिध्वनि मिटे और न यहाँ अनुचित विशिष्ट अर्थ आरोपित हो।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य रखी गई है। ‘उलट दिया’ मूल विनाशकारी उलटाव की छवि बचाता है; ‘बसेगा/निवास करेगा’ समानांतर पंक्तियों में हल्का शैलीगत अंतर बनाए रखते हैं। स्त्रीलिंग एकवचन प्रत्यय को बाबेल/उस स्थान की ओर संकेत करते हुए ‘उसमें’ से सुरक्षित रखा गया है।
