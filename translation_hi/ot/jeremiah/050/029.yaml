  text: הַשְׁמִ֣יעוּ אֶל בָּבֶ֣ל רַ֠בִּים כָּל דֹּ֨רְכֵי קֶ֜שֶׁת חֲנ֧וּ עָלֶ֣י/הָ סָבִ֗יב אַל יְהִי פְּלֵטָ֔ה שַׁלְּמוּ לָ֣/הּ כְּ/פָעֳלָ֔/הּ כְּ/כֹ֛ל אֲשֶׁ֥ר עָשְׂתָ֖ה עֲשׂוּ לָ֑/הּ כִּ֧י אֶל יְהוָ֛ה זָ֖דָה אֶל קְד֥וֹשׁ יִשְׂרָאֵֽל־׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/029.yaml
  text: Summon many against Babylon[a], all who bend the bow; encamp around her on every side; let there be no escape. Repay her according to her work; according to all that she has done, do to her. For she has acted arrogantly against Yahweh, against the Holy One of Israel.
translation:
  language: hi
  text: बाबेल के विरुद्ध बहुत-से लोगों को बुलाओ—धनुष चढ़ाने वालों सबको। उसके चारों ओर डेरा डालो; कोई बचकर न निकल पाए।[a] उसके काम के अनुसार उसे बदला दो; उसने जो कुछ किया है, उसके साथ वैसा ही करो। क्योंकि उसने याहवे के विरुद्ध, इस्राएल के पवित्र परमेश्वर के विरुद्ध, धृष्टता की है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कोई जीवित न बचे” अथवा “बच निकला हुआ कोई जन न रहे।” इब्रानी शब्द פְּלֵטָה का अर्थ बच निकलना या बच निकले हुए लोग—दोनों हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְׁמִיעוּ אֶל בָּבֶל רַבִּים
  choice: बाबेल के विरुद्ध बहुतों को बुलाओ
  rationale: हिफ़ील आज्ञार्थक הַשְׁמִיעוּ यहाँ सैन्य बलों को एकत्र होने के लिए पुकारने का भाव देता है। ‘बहुतों को बुलाओ’ स्वाभाविक हिन्दी में इस प्रयोजन को व्यक्त करता है, जबकि אֶל को प्रसंगानुसार ‘के विरुद्ध’ किया गया है।
- source_word: כָּל דֹּרְכֵי קֶשֶׁת
  choice: उन सबको जो धनुष चढ़ाते हैं
  rationale: शाब्दिक बिंब ‘धनुष को पैर से दबाकर चढ़ाने/तानने वाले’ अर्थात धनुर्धर है। ‘धनुष चढ़ाते हैं’ युद्ध-संबंधी मूल बिंब को पठनीय हिन्दी में बनाए रखता है।
- source_word: חֲנוּ עָלֶיהָ סָבִיב
  choice: उसके चारों ओर डेरा डालो
  rationale: बहुवचन आज्ञा और घेराबंदी का भाव स्पष्ट रहता है; ‘चारों ओर’ पूर्ण घेराव को व्यक्त करता है।
- source_word: אַל יְהִי פְּלֵטָה
  choice: कोई बचकर न निकल पाए
  rationale: פְּלֵטָה का अर्थ बच निकलना, बचाव, अथवा बच निकला हुआ जन हो सकता है। यहाँ घेराबंदी के क्रम में क्रियात्मक हिन्दी ‘कोई बचकर न निकल पाए’ उपयुक्त है, पर वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: שַׁלְּמוּ לָהּ כְּפָעֳלָהּ
  choice: उसके काम के अनुसार उसे बदला दो
  rationale: पिएल שׁלם प्रतिफल या प्रत्युपकार के अर्थ में है। ‘बदला दो’ न्यायिक प्रतिदान को साधारण आधुनिक हिन्दी में व्यक्त करता है; ‘काम के अनुसार’ פעל की अलग शब्दावली बनाए रखता है।
- source_word: כְּכֹל אֲשֶׁר עָשְׂתָה עֲשׂוּ לָהּ
  choice: जैसा-जैसा उसने किया है, वैसा ही उसके साथ करो
  rationale: मूल के प्रत्युत्तरात्मक न्याय और עשה की पुनरावृत्ति को स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: זָדָה
  choice: घमण्ड से काम किया है
  rationale: क्रिया उद्दण्ड, अहंकारी या धृष्ट आचरण दर्शाती है। यह चयन मनोभाव और व्यवहार दोनों को सरल, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित नामरूप ‘यहोवा’ को शीर्षक ‘प्रभु’ से बदलने के बजाय मूल चतुरक्षरीय दिव्य नाम के प्रतिनिधि रूप में रखा गया है।
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: इस्राएल का पवित्र परमेश्वर
  rationale: यह नबूवत-साहित्य का विशिष्ट ईश्वरीय संबोधन है। ‘इस्राएल का पवित्र परमेश्वर’ हिन्दी में स्पष्ट और स्वाभाविक रहते हुए उपाधि का धार्मिक आशय रखता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल में व्यक्तिगत दिव्य नाम है, केवल उपाधि नहीं। आधुनिक हिन्दी पाठकों के लिए परिचित नामरूप ‘यहोवा’ उस भेद को बनाए रखता है।
- issue: פְּלֵטָה का न्याय-वाणी में अर्थ
  choice: कोई बचकर न निकल पाए
  alternative: कोई जीवित न बचे / बचा हुआ कोई जन न हो
  rationale: घेराबंदी का तत्काल प्रसंग ‘बच निकलने’ के अर्थ का समर्थन करता है, किन्तु इब्रानी संज्ञा बच निकले व्यक्ति या बचे हुए जन को भी सूचित कर सकती है; इसलिए अधिक विनाशकारी अर्थ को मुख्य पाठ में अनिवार्य नहीं बनाया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, आज्ञार्थक सैन्य लय और नबूवत-संबंधी गरिमा के साथ रखी गई है। बाबेल को स्त्रीलिंग नगर के रूप में आए सर्वनामों को हिन्दी में ‘उसके/उसे’ से स्वाभाविक बनाया गया है।
