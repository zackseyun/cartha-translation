id: JER.50.27
reference: Jeremiah 50:27
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: חִרְבוּ֙ כָּל פָּרֶ֔י/הָ יֵרְד֖וּ לַ/טָּ֑בַח ה֣וֹי עֲלֵי/הֶ֔ם כִּֽי בָ֥א יוֹמָ֖/ם עֵ֥ת פְּקֻדָּתָֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/027.yaml
  text: Slay all her bulls; let them go down to the slaughter. Woe to them[a], for their day has come, the time of their punishment.
translation:
  language: hi
  text: उसके सब बैलों को मार डालो; वे वध के लिए नीचे उतरें। हाय उन पर[a]! क्योंकि उनका दिन आ पहुँचा है, उनके दण्ड का समय।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनका लेखा लेने का समय।” इब्रानी शब्द का अर्थ निरीक्षण, सुधि लेना, लेखा लेना या दण्ड देना हो सकता है; यहाँ प्रसंग दण्डात्मक न्याय का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חִרְבוּ
  choice: मार डालो
  rationale: हिफ़ील आज्ञार्थक रूप यहाँ आक्रमणकारियों को वध करने की आज्ञा देता है। अगले वाक्यांश ‘वध के लिए’ के कारण हिंसक अर्थ स्पष्ट रखना उचित है।
- source_word: פָּרֶיהָ
  choice: उसके सब बैलों
  rationale: संज्ञा का शाब्दिक अर्थ बैल/जवान बैल है और यह सम्भवतः बाबेल के वीरों या प्रधानों का रूपक है। व्याख्या को मूल पाठ में रखने के बजाय पशु-रूपक सुरक्षित रखा गया है।
- source_word: יֵרְדוּ לַטָּבַח
  choice: वे वध के लिए नीचे उतरें
  rationale: ירד का अर्थ ‘नीचे उतरना’ और טבח का अर्थ ‘वध’ है। क्रिया को इच्छार्थक/आज्ञासूचक बल के साथ प्रस्तुत किया गया है।
- source_word: הוֹי עֲלֵיהֶם
  choice: उन पर हाय
  rationale: भविष्यद्वाणी के विलाप और न्याय की गंभीर पुकार को बनाए रखता है और हिब्रू संरचना के निकट है।
- source_word: כִּי בָא יוֹמָם
  choice: क्योंकि उनका दिन आ पहुँचा है
  rationale: पूर्ण क्रिया दिन के आ जाने को व्यक्त करती है; ‘आ पहुँचा’ नियत न्याय के उपस्थित होने का स्वाभाविक हिन्दी रूप है।
- source_word: עֵת פְּקֻדָּתָם
  choice: उनके दण्ड का समय
  rationale: פקדה में निरीक्षण, लेखा लेने या दण्ड देने के लिए आगमन का अर्थ हो सकता है। बाबेल के विरुद्ध न्याय के इस प्रसंग में ‘दण्ड’ मुख्य अर्थ को स्पष्ट और सहज हिन्दी में देता है।
theological_decisions:
- issue: פְּקֻדָּה जैसे न्याय-सूचक शब्द का अनुवाद
  choice: दण्ड
  alternative: लेखा लेने का समय / सुधि लेने का समय
  rationale: प्रसंग दण्डात्मक ईश्वरीय न्याय का है, इसलिए मुख्य पाठ में ‘दण्ड’ स्वाभाविक है। फिर भी शब्द की व्यापक ‘निरीक्षण/लेखा लेने के लिए आगमन’ संबंधी अर्थ-सीमा को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: ‘बैलों’ की रूपकात्मक पहचान
  choice: रूपक को ज्यों का त्यों रखना
  alternative: वीर योद्धा या प्रधान
  rationale: हिब्रू पाठ स्वयं बैलों की छवि प्रयोग करता है। उन्हें सीधे योद्धा या प्रधान कहना सम्भावित व्याख्या को अनुवाद में निश्चित कर देता, इसलिए मूल रूपक सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर भविष्यद्वाणी-संबंधी शैली रखी गई है। ‘मार डालो’ और ‘वध’ सामान्य पाठक के लिए स्पष्ट हैं; ‘नीचे उतरें’ मूल की गतिशील छवि बनाए रखता है। हर पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित है।
