id: JER.50.12
reference: Jeremiah 50:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בּ֤וֹשָׁה אִמְּ/כֶם֙ מְאֹ֔ד חָפְרָ֖ה יֽוֹלַדְתְּ/כֶ֑ם הִנֵּה֙ אַחֲרִ֣ית גּוֹיִ֔ם מִדְבָּ֖ר צִיָּ֥ה וַ/עֲרָבָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/012.yaml
  text: Your mother will be utterly ashamed; she who gave birth to you will be disgraced. Behold[a], she will be the last of the nations, a wilderness, a dry land, and a desert.
translation:
  language: hi
  text: तुम्हारी माता बहुत लज्जित होगी; जिसने तुम्हें जन्म दिया, वह अपमानित होगी। देखो, वह राष्ट्रों में सबसे अन्तिम होगी—एक निर्जन प्रदेश, सूखी भूमि और मरुभूमि।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בּוֹשָׁה
  choice: लज्जित होगी
  rationale: भविष्यवाणी के प्रसंग में पूर्ण क्रिया निश्चित भावी परिणाम व्यक्त करती है; यह प्रयोग हिन्दी में स्वाभाविक है और बाहरी कर्ता को अनावश्यक रूप से स्पष्ट नहीं करता।
- source_word: אִמְּכֶם
  choice: तुम्हारी माता
  rationale: मूल मातृ-रूपक को बिना व्याख्यात्मक विस्तार के सीधे सुरक्षित रखा गया है।
- source_word: מְאֹד
  choice: बहुत
  rationale: यह लज्जा की तीव्रता को सरल और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: חָפְרָה
  choice: अपमानित होगी
  rationale: दूसरे लज्जासूचक इब्रानी शब्द का भेद बनाए रखते हुए तिरस्कार और मानहानि का भाव व्यक्त करता है।
- source_word: יֽוֹלַדְתְּכֶם
  choice: तुम्हें जन्म देनेवाली
  rationale: स्त्रीलिंग कृदन्त और द्वितीय पुरुष बहुवचन प्रत्यय का अर्थ स्पष्ट रखते हुए मातृ-समानांतरता बचाता है।
- source_word: הִנֵּה
  choice: देखो
  rationale: घोषित परिणाम की ओर ध्यान खींचनेवाला बल आधुनिक हिन्दी में स्वाभाविक ढंग से व्यक्त होता है।
- source_word: אַחֲרִית גּוֹיִם
  choice: राष्ट्रों में सबसे पिछली
  rationale: אַחֲרִית में अन्तिम स्थान या घटे हुए दर्जे—दोनों की सम्भावना है; 'सबसे पिछली' इस अर्थ-तनाव को पर्याप्त रूप से बनाए रखता है।
- source_word: מִדְבָּר
  choice: एक निर्जन प्रदेश
  rationale: न्याय के इस प्रसंग में उजाड़ और निर्जनता का अर्थ देता है तथा बाद के भू-दृश्य शब्दों से भेद रखता है।
- source_word: צִיָּה
  choice: सूखी भूमि
  rationale: शुष्कता का सीधा अर्थ सहज हिन्दी में व्यक्त करता है।
- source_word: וַעֲרָבָה
  choice: और मरुभूमि
  rationale: शुष्क, रेगिस्तानी भूभाग का अर्थ स्पष्ट करता है और काव्यात्मक त्रिक को पूरा करता है।
theological_decisions:
- issue: बाबुल का माता और जन्म देनेवाली के रूप में मानवीकरण
  choice: मुख्य पाठ में मातृ-रूपक को सीधे बनाए रखना
  alternative: मुख्य पाठ में 'मातृ-नगर' या 'मातृभूमि' कहकर रूपक की व्याख्या करना
  rationale: इब्रानी पाठ बाबुल को काव्यात्मक रूप से माता बताता है; सीधा रूपक अनावश्यक व्याख्या या साम्प्रदायिक अर्थ आरोपित किए बिना मूल की छवि सुरक्षित रखता है।
- issue: भविष्यसूचक पूर्ण क्रियाओं का कालगत बल
  choice: आरम्भिक क्रियाओं को निश्चित भविष्य के रूप में प्रस्तुत करना
  alternative: 'उन्हें वर्तमान या परिणामसूचक रूप में प्रस्तुत करना: ''लज्जित है ... अपमानित है'''
  rationale: न्याय की भविष्यवाणी में इब्रानी पूर्ण रूप प्रायः निश्चित भावी परिणाम बताते हैं; हिन्दी भविष्यकाल इस प्रवचनगत कार्य को स्पष्ट करता है।
- issue: אַחֲרִית גּוֹיִם का आशय
  choice: राष्ट्रों में सबसे पिछली
  alternative: राष्ट्रों में सबसे छोटी/तुच्छ
  rationale: मूल अभिव्यक्ति अन्तिम स्थान, अन्तिम दशा या घटे हुए दर्जे का संकेत दे सकती है; मुख्य पाठ में 'सबसे पिछली' और पादटिप्पणी में वैकल्पिक अर्थ देकर अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। 'माता' और 'मरुभूमि' काव्यात्मक-भविष्यसूचक शैली बनाए रखते हैं; 'देखो' हִנֵּה का स्वाभाविक ध्यानाकर्षक रूप है।
