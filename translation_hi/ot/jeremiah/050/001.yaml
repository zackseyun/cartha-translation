id: JER.50.1
reference: Jeremiah 50:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הַ/דָּבָ֗ר אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה אֶל בָּבֶ֖ל אֶל אֶ֣רֶץ כַּשְׂדִּ֑ים בְּ/יַ֖ד יִרְמְיָ֥הוּ הַ/נָּבִֽיא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/001.yaml
  text: 'The word that Yahweh spoke concerning Babylon[a], concerning the land of the Chaldeans[b], by the hand of Jeremiah the prophet:'
translation:
  language: hi
  text: 'वह वचन जो याहवे ने बाबेल[a] के विषय में, कसदियों के देश के विषय में, यिर्मयाह नबी के द्वारा[b] कहा:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बाबेल के विरुद्ध, कसदियों के देश के विरुद्ध।” इब्रानी पूर्वसर्ग किसी राष्ट्र के विरुद्ध कही गई भविष्यवाणी का परिचय दे सकता है; यहाँ शीर्षक में उसका व्यापक अनुवाद “के विषय में” किया गया है।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक रूप से “यिर्मयाह के हाथ से”; यह इब्रानी मुहावरा यहाँ “यिर्मयाह के द्वारा” या “यिर्मयाह को माध्यम बनाकर” के अर्थ में है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּבָר
  choice: वह वचन
  rationale: भविष्यवाणी की भूमिका में דָּבָר के लिए ‘वचन’ स्वाभाविक और गरिमापूर्ण है तथा ईश्वरीय संदेश के सूत्रात्मक परिचय को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय आधुनिक हिन्दी लिप्यंतरण में प्रस्तुत किया गया है।
- source_word: אֶל
  choice: के विषय में
  rationale: इस भविष्यवाणीय शीर्षक में אֶל कथन के विषय को सूचित कर सकता है। ‘के विषय में’ इसकी व्यापकता बनाए रखता है; ‘के विरुद्ध’ भी प्रसंगानुकूल संभव है, पर वह न्याय के भाव को पहले ही स्पष्ट कर देता है।
- source_word: בָּבֶל
  choice: बाबेल
  rationale: स्थान-नाम का हिन्दी बाइबलीय रूप, जो मूल בָּבֶל के निकट है।
- source_word: אֶרֶץ כַּשְׂדִּים
  choice: कसदियों का देश
  rationale: इब्रानी संबंध-वाचक पदबंध का सीधा अनुवाद है और जातीय-भौगोलिक अभिव्यक्ति को सुरक्षित रखता है।
- source_word: בְּיַד
  choice: के द्वारा
  rationale: शाब्दिक अर्थ ‘के हाथ से’ है, पर यहाँ यह माध्यम अथवा प्रतिनिधि को सूचित करने वाला इब्रानी मुहावरा है; आधुनिक हिन्दी में ‘के द्वारा’ उसका स्वाभाविक अर्थ देता है।
- source_word: יִרְמְיָהוּ הַנָּבִיא
  choice: यिर्मयाह नबी
  rationale: व्यक्तिनाम के प्रचलित हिन्दी रूप और उसके पदनाम को संक्षिप्त, स्वाभाविक apposition में रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसे उपाधि से बदले बिना और आधुनिक विद्वत्तापूर्ण उच्चारण के अनुरूप प्रस्तुत करता है।
- issue: भविष्यवाणीय शीर्षक में אֶל का आशय
  choice: के विषय में
  alternative: के विरुद्ध
  rationale: आगे का संदेश न्याय का है, फिर भी इस शीर्षक में पूर्वसर्ग व्यापक रूप से विषय का परिचय दे सकता है। इसलिए मुख्य पाठ में तटस्थ व्यापकता रखी गई और विरोधसूचक अर्थ पादटिप्पणी में दिया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज रखी गई है। दोहराए गए אֶל को दोनों बार ‘के विषय में’ कहकर मूल शीर्षक की समानांतर रचना सुरक्षित रखी गई है। पद के अंत का द्विबिंदु आगे आने वाली भविष्यवाणी की भूमिका दर्शाता है।
