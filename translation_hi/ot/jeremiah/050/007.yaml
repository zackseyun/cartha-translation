  text: כָּל מוֹצְאֵי/הֶ֣ם אֲכָל֔וּ/ם וְ/צָרֵי/הֶ֥ם אָמְר֖וּ לֹ֣א נֶאְשָׁ֑ם תַּ֗חַת אֲשֶׁ֨ר חָטְא֤וּ לַֽ/יהוָה֙ נְוֵה צֶ֔דֶק וּ/מִקְוֵ֥ה אֲבֽוֹתֵי/הֶ֖ם יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/007.yaml
  text: All who found them devoured them[a], and their adversaries said, “We are not guilty, because they sinned against Yahweh, the habitation of righteousness[b], the hope of their fathers—Yahweh.”
translation:
  language: hi
  text: जितनों ने उन्हें पाया, उन सब ने उन्हें निगल लिया, और उनके विरोधियों ने कहा, “हम दोषी नहीं हैं, क्योंकि उन्होंने याहवे के विरुद्ध पाप किया—याहवे, जो धार्मिकता का निवास[a] और उनके पूर्वजों की आशा[b] है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “धार्मिकता का चरागाह।” इब्रानी शब्द का अर्थ चरागाह, बसेरा या निवास हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “उनके पूर्वजों की अपेक्षा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל מוֹצְאֵיהֶם
  choice: जो कोई उन्हें पाता
  rationale: मूल के सार्वत्रिक भाव और संज्ञा के रूप में प्रयुक्त कृदंत को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אֲכָלוּם
  choice: उन्हें निगल जाता था
  rationale: शाब्दिक अर्थ ‘खा जाता’ है, पर यहाँ विनाशकारी आक्रमण का रूपक है; ‘निगल जाता’ उस हिंसक बिंब को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: צָרֵיהֶם
  choice: उनके विरोधी
  rationale: शत्रुतापूर्ण पक्ष का व्यापक अर्थ रखता है और इसे केवल सैनिक शत्रुओं तक सीमित नहीं करता।
- source_word: לֹא נֶאְשָׁם
  choice: हम दोषी नहीं हैं
  rationale: विरोधियों द्वारा अपने को निर्दोष ठहराने के दावे को सीधी और स्वाभाविक हिन्दी में रखता है।
- source_word: תַּחַת אֲשֶׁר
  choice: क्योंकि
  rationale: यह पदबंध उनके दावे का कारण बताता है; हिन्दी में स्पष्ट कारणवाचक संबंध देता है।
- source_word: חָטְאוּ לַיהוָה
  choice: उन्होंने याहवे के विरुद्ध पाप किया है
  rationale: חטא के साथ ל यहाँ पाप का लक्ष्य बताता है; ‘के विरुद्ध’ हिन्दी का स्वाभाविक समतुल्य है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित करता है।
- source_word: נְוֵה צֶדֶק
  choice: धार्मिकता का निवास
  rationale: נְוֵה के ‘निवास/चरागाह’ अर्थों में से प्रसंगानुकूल औपचारिक अर्थ चुना गया है; चरवाही-संबंधी वैकल्पिक अर्थ पाद-टिप्पणी में सुरक्षित है।
- source_word: מִקְוֵה אֲבוֹתֵיהֶם
  choice: उनके पूर्वजों की आशा
  rationale: מִקְוֵה का यहाँ उपाधि-सदृश ‘आशा’ अर्थ सबसे संगत है; ‘अपेक्षा’ की संभावना पाद-टिप्पणी में दी गई है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत ईश्वरीय नाम का प्रयोग करता है; लिप्यंतरण उसे उपाधि से प्रतिस्थापित नहीं करता।
- issue: נְוֵה צֶדֶק और מִקְוֵה אֲבוֹתֵיהֶם का संबंध
  choice: दोनों को याहवे का परिचय देने वाले समानाधिकरण पद माना गया है
  alternative: נְוֵה צֶדֶק को इस्राएल की भूमि या बाड़े का संकेत मानना
  rationale: वाक्य-विन्यास में दोनों पद याहवे के बाद आते हैं और अंत का יהוה इस समानाधिकरण को पुष्ट करता है; फिर भी נְוֵה की शब्दार्थगत व्यापकता पाद-टिप्पणी में रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘निगल जाता था’ मूल के भक्षण-वाले रूपक को बनाए रखता है। डैश के बाद याहवे से जुड़े दोनों उपाधि-पद स्पष्ट किए गए हैं, बिना उनके बीच की काव्यात्मक समानाधिकरण संरचना मिटाए।
