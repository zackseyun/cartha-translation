translation:
  language: hi
  text: 'देश में युद्ध का कोलाहल है,

    और भारी विनाश![a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “देश में युद्ध का कोलाहल और टूटने की बड़ी आवाज़!” इब्रानी शब्द שֶׁבֶר का अर्थ प्रसंग के अनुसार ‘टूटना,’ ‘टूटने की आवाज़,’ ‘ध्वंस’ या ‘विनाश’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל
  choice: कोलाहल
  rationale: यहाँ קוֹל युद्ध की सुनाई देने वाली ध्वनि या शोर को दर्शाता है। ‘कोलाहल’ आधुनिक हिन्दी में युद्ध के प्रचंड शोर को स्वाभाविक और संक्षिप्त रूप से व्यक्त करता है।
- source_word: מִלְחָמָה
  choice: युद्ध
  rationale: מִלְחָמָה का अर्थ युद्ध या लड़ाई हो सकता है; बाबेल के विरुद्ध इस व्यापक न्याय-संदर्भ में ‘युद्ध’ उपयुक्त है।
- source_word: בָּאָרֶץ
  choice: देश में
  rationale: אֶרֶץ यहाँ सारी पृथ्वी के बजाय बाबेल के भू-क्षेत्र या देश की ओर संकेत करता है। इसलिए ‘देश में’ प्रसंगानुकूल है।
- source_word: וְשֶׁבֶר
  choice: और भारी विनाश
  rationale: שֶׁבֶר का मूल भाव टूटना है और यह ध्वंस, विपत्ति या विनाश को भी दर्शा सकता है। मुख्य पाठ में ‘विनाश’ युद्ध के परिणाम को स्पष्ट करता है, जबकि ध्वन्यात्मक ‘टूटने की बड़ी आवाज़’ को पाद-टिप्पणी में सुरक्षित रखा गया है।
- source_word: גָּדוֹל
  choice: भारी
  rationale: גָּדוֹל का सामान्य अर्थ बड़ा या महान है। ‘भारी विनाश’ वर्तमान हिन्दी में विनाश की विशालता और गंभीरता दोनों को स्वाभाविक ढंग से व्यक्त करता है।
