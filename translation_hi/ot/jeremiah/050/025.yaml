base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/025.yaml
  text: Yahweh has opened his storehouse and brought out the weapons of his wrath[d][c][b][a], for this is a work of the Lord GOD of Armies in the land of the Chaldeans.
translation:
  language: hi
  text: याहवे ने अपना भंडार[a] खोल दिया है और अपने प्रकोप के हथियार[b] निकाल लाया है, क्योंकि कसदियों के देश[d] में यह प्रभु याहवे, सेनाओं के परमेश्वर का कार्य है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपना कोष” अथवा, इस संदर्भ में, “अपना शस्त्रागार।”
    reason: lexical_alternative
  - marker: b
    text: या “अपने प्रकोप के उपकरण”; इब्रानी शब्द सामान, पात्र या उपकरण के लिए भी प्रयुक्त हो सकता है, पर यहाँ सम्भवतः उसका सैनिक अर्थ है।
    reason: lexical_alternative
  - marker: d
    text: या “कसदिया देश में।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय उसका देवनागरी लिप्यंतरण किया गया है।
- source_word: פָּתַח
  choice: खोल दिया है
  rationale: पूर्ण हो चुकी क्रिया को भविष्यद्वाणी के सजीव संदर्भ में स्वाभाविक हिन्दी पूर्ण वर्तमान से व्यक्त किया गया है।
- source_word: אֹצָרוֹ
  choice: अपना भंडार
  rationale: אוֹצָר का व्यापक अर्थ ‘भंडार’ या ‘कोष’ है; ‘शस्त्रागार’ कहना अगले वाक्यांश के आधार पर अर्थ को अनावश्यक रूप से सीमित कर देता।
- source_word: וַיּוֹצֵא
  choice: निकाल लाया है
  rationale: यह रूप किसी वस्तु को भीतर से बाहर लाने का भाव रखता है और भंडार के बिंब के साथ स्वाभाविक बैठता है।
- source_word: כְּלֵי
  choice: हथियार
  rationale: शब्द का अर्थ सामान, उपकरण या पात्र भी हो सकता है, पर बाबेल के विरुद्ध न्याय के इस सैनिक संदर्भ में ‘हथियार’ सर्वाधिक उपयुक्त है।
- source_word: זַעְמוֹ
  choice: अपने प्रकोप के
  rationale: זַעַם में न्यायकारी तीव्र रोष का भाव है; ‘प्रकोप’ उस गंभीरता को सामान्य ‘क्रोध’ से बेहतर व्यक्त करता है।
- source_word: מְלָאכָה
  choice: काम
  rationale: यह व्यापक और सहज शब्द मूल के ‘कार्य/काम’ को बिना उसके स्वरूप को अधिक निर्दिष्ट किए रखता है।
- source_word: לַאדֹנָי יְהוִה צְבָאוֹת
  choice: प्रभु याहवे, सेनाओं के परमेश्वर, का
  rationale: אֲדֹנָי को ‘प्रभु’, दिव्य नाम को ‘याहवे’, और צְבָאוֹת को प्रचलित तथा बोधगम्य हिन्दी शीर्षक ‘सेनाओं के परमेश्वर’ से व्यक्त किया गया है।
- source_word: בְּאֶרֶץ כַּשְׂדִּים
  choice: कसदियों के देश में
  rationale: यह मूल के जातिवाचक बहुवचन ‘कसदियों’ को बनाए रखता है, बजाय उसे केवल भौगोलिक नाम ‘कसदिया’ बनाने के।
theological_decisions:
- issue: संयुक्त दिव्य उपाधि אֲדֹנָי יְהוִה का अनुवाद
  choice: प्रभु याहवे
  alternative: प्रभु परमेश्वर
  rationale: ‘प्रभु याहवे’ אֲדֹנָי की उपाधि और יְהוָה के व्यक्तिगत नाम—दोनों को स्पष्ट रखता है। हिन्दी में अंग्रेज़ी जैसी ‘Lord GOD’ प्रतिस्थापन-परंपरा अपनाना आवश्यक नहीं है।
- issue: צְבָאוֹת का आशय
  choice: सेनाओं के परमेश्वर
  alternative: सेनाओं के प्रभु / सेनाओं के याहवे
  rationale: यह प्रचलित हिन्दी धार्मिक भाषा में दिव्य सैन्य सार्वभौमिकता को स्पष्ट करता है, जबकि पादटिप्पणी पारंपरिक रूप की जानकारी देती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज स्तर रखा गया है। ‘भंडार’ मूल रूपक को खुला रखता है, जबकि ‘हथियार’ प्रसंग का सैनिक आशय स्पष्ट करता है। दिव्य नाम ‘याहवे’ के रूप में प्रत्यक्ष रखा गया है।
