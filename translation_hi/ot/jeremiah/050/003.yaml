id: JER.50.3
reference: Jeremiah 50:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֣י עָלָה֩ עָלֶ֨י/הָ גּ֜וֹי מִ/צָּפ֗וֹן הֽוּא יָשִׁ֤ית אֶת אַרְצָ/הּ֙ לְ/שַׁמָּ֔ה וְ/לֹֽא יִהְיֶ֥ה יוֹשֵׁ֖ב בָּ֑/הּ מֵ/אָדָ֥ם וְ/עַד בְּהֵמָ֖ה נָ֥דוּ הָלָֽכוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/003.yaml
  text: For a nation has come up against her from the north; it will make her land a desolation[a], and there will be no inhabitant in it. From man to beast, they have fled; they have gone away.
translation:
  language: hi
  text: क्योंकि उत्तर दिशा से एक राष्ट्र उसके विरुद्ध चढ़ आया है। वह उसके देश को उजाड़ बना देगा, और उसमें कोई निवासी न रहेगा। मनुष्य से लेकर पशु तक, सब भाग गए हैं; वे चले गए हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद पिछले कथन का कारण बताता है; इसलिए हिन्दी में स्वाभाविक कारणसूचक शब्द चुना गया है।
- source_word: עָלָה עָלֶיהָ
  choice: उसके विरुद्ध चढ़ आया है
  rationale: यह प्रयोग किसी स्थान पर शत्रुतापूर्ण सैनिक चढ़ाई को दर्शाता है; ‘चढ़ आया’ उस गति और विरोध दोनों को बनाए रखता है।
- source_word: גּוֹי
  choice: राष्ट्र
  rationale: यहाँ आक्रमण करने वाली राजनीतिक-राष्ट्रीय शक्ति अभिप्रेत है।
- source_word: מִצָּפוֹן
  choice: उत्तर दिशा से
  rationale: आक्रमण के स्रोत की दिशासूचक अभिव्यक्ति को सीधे और स्वाभाविक हिन्दी में रखा गया है।
- source_word: יָשִׁית אֶת אַרְצָהּ לְשַׁמָּה
  choice: वह उसके देश को उजाड़ बना देगा
  rationale: क्रिया और परिणामसूचक पद मिलकर देश को विनाश की दशा में पहुँचाने का अर्थ देते हैं।
- source_word: וְלֹא יִהְיֶה יוֹשֵׁב בָּהּ
  choice: और उसमें कोई निवासी न रहेगा
  rationale: यह पूर्ण जनशून्यता व्यक्त करता है और हिन्दी में संक्षिप्त तथा स्पष्ट है।
- source_word: מֵאָדָם וְעַד בְּהֵמָה
  choice: मनुष्य से लेकर पशु तक
  rationale: इब्रानी समावेशी मुहावरे की सीमा-रचना को बनाए रखते हुए मनुष्यों और पशुओं—दोनों की पूर्ण विदाई व्यक्त की गई है।
- source_word: נָדוּ הָלָכוּ
  choice: सब भाग गए हैं; वे चले गए हैं
  rationale: 'दोनों क्रमिक क्रियाओं को अलग रखा गया है: पहली संकट में पलायन और दूसरी प्रस्थान की पूर्णता बताती है। ‘सब’ मुहावरे में निहित समग्रता स्पष्ट करता है।'
theological_decisions:
- issue: אָדָם का सामान्य मानवजातीय अर्थ
  choice: मनुष्य
  alternative: आदमी
  rationale: यहाँ शब्द किसी एक पुरुष के लिए नहीं, पशुओं के विपरीत समस्त मानव निवासियों के लिए है; ‘मनुष्य’ आधुनिक मानक हिन्दी में इस सामान्य अर्थ को ठीक रखता है।
- issue: बाबेल के लिए स्त्रीलिंगी इब्रानी सर्वनाम
  choice: उसके
  alternative: उसकी
  rationale: हिन्दी में संबंधसूचक रूप ‘देश’ के पुल्लिंग के अनुसार ‘उसके’ होता है। संदर्भ बाबेल का है, पर अप्राकृतिक स्त्री-व्यक्तिकरण थोपे बिना वही संदर्भ सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। सैनिक चढ़ाई, पूर्ण उजाड़ और मनुष्य-पशु दोनों के पलायन की इब्रानी संरचना यथासंभव सुरक्षित रखी गई है।
