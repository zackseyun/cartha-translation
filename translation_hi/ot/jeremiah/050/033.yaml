id: JER.50.33
reference: Jeremiah 50:33
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת עֲשׁוּקִ֛ים בְּנֵי יִשְׂרָאֵ֥ל וּ/בְנֵי יְהוּדָ֖ה יַחְדָּ֑ו וְ/כָל שֹֽׁבֵי/הֶם֙ הֶחֱזִ֣יקוּ בָ֔/ם מֵאֲנ֖וּ שַׁלְּחָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/033.yaml
  text: 'Thus says Yahweh of hosts: The sons of Israel and the sons of Judah alike are oppressed[a]; all their captors hold them fast[b]; they refuse to let them go.'
translation:
  language: hi
  text: 'सेनाओं का याहवे यों कहता है:

    “इस्राएल के लोग और यहूदा के लोग, दोनों ही उत्पीड़ित हैं[a]। उन्हें बंदी बनानेवाले सभी लोग उन्हें कसकर पकड़े हुए हैं; वे उन्हें छोड़ने से इनकार करते हैं।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “इस्राएल के पुत्र और यहूदा के पुत्र एक साथ उत्पीड़ित हैं।”
    reason: मूल इब्रानी के पुत्र-संबंधी पदबंध और יַחְדָּו के अधिक शाब्दिक रूप को सुरक्षित रखना।
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: यों कहता है
  rationale: यह भविष्यवाणी में परमेश्वर की घोषणा प्रस्तुत करने वाला प्रचलित सूत्र है; ‘यों कहता है’ औपचारिकता बनाए रखते हुए स्वाभाविक हिन्दी है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का याहवे
  rationale: याहवे नाम को नाम के रूप में रखा गया है और צְבָאוֹת का व्यापक सैन्य आशय ‘सेनाओं’ से व्यक्त किया गया है।
- source_word: עֲשׁוּקִים
  choice: उत्पीड़ित हैं
  rationale: निष्क्रिय कृदंत दोनों समुदायों की वर्तमान, दबाई हुई दशा बताता है; ‘उत्पीड़ित हैं’ उस निष्क्रिय और स्थितिगत अर्थ को सुरक्षित रखता है।
- source_word: בְּנֵי יִשְׂרָאֵל וּבְנֵי יְהוּדָה
  choice: इस्राएल के लोग और यहूदा के लोग
  rationale: בְּנֵי का शाब्दिक अर्थ ‘पुत्र’ है, पर यहाँ यह दोनों जनसमुदायों को सूचित करता है। मुख्य पाठ में स्वाभाविक सामुदायिक अभिव्यक्ति रखी गई है और शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: יַחְדָּו
  choice: दोनों ही
  rationale: यह क्रियाविशेषण इस्राएल और यहूदा की साझी दशा पर बल देता है; संयुक्त कर्ता के साथ ‘दोनों ही’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: שֹׁבֵיהֶם
  choice: उन्हें बंदी बनानेवाले सभी लोग
  rationale: सक्रिय कृदंत उन व्यक्तियों या शक्तियों को दर्शाता है जिन्होंने उन्हें बंदी बनाया; यह रूप ‘बंदी बनानेवाले’ का विशिष्ट अर्थ स्पष्ट करता है।
- source_word: הֶחֱזִיקוּ בָם
  choice: उन्हें कसकर पकड़े हुए हैं
  rationale: यह पदबंध दृढ़तापूर्वक रोके रखने का भाव देता है, केवल छूने या सामान्यतः पकड़ने का नहीं।
- source_word: מֵאֲנוּ שַׁלְּחָם
  choice: उन्हें छोड़ने से इनकार करते हैं
  rationale: बंदीपन के संदर्भ में שׁלח का अर्थ मुक्त कर देना है; वर्तमान हिन्दी रूप उनके लगातार इनकार को व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में विशिष्ट वाचा-नाम उपस्थित है; उसे किसी उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में नाम के रूप में रखा गया है।
- issue: בְּנֵי को शाब्दिक या सामुदायिक रूप में प्रस्तुत करना
  choice: मुख्य पाठ में ‘लोग’, पादटिप्पणी में ‘पुत्र’
  alternative: मुख्य पाठ में ‘इस्राएल के पुत्र ... यहूदा के पुत्र’
  rationale: यहाँ पदबंध पूरे जनसमुदायों का द्योतक है। ‘लोग’ आधुनिक हिन्दी में अर्थ स्पष्ट करता है, जबकि पादटिप्पणी मूल की पुत्र-संबंधी अभिव्यक्ति को पारदर्शी रखती है।
- issue: יַחְדָּו का संबंध
  choice: दोनों समुदाय समान रूप से उत्पीड़ित हैं
  alternative: यहूदा के लोग इस्राएल के लोगों के साथ उत्पीड़ित हैं
  rationale: इब्रानी वाक्य दोनों समूहों को एक संयुक्त कर्ता के रूप में प्रस्तुत करता है और יַחְדָּו उनकी साझी दशा बताता है; मुख्य पाठ किसी एक समूह को दूसरे के अधीन नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर भविष्यवाणी-सूत्र के लिए गरिमापूर्ण ‘यों कहता है’ रखा गया है। वाक्य छोटे और स्पष्ट हैं; बंदीपन तथा उत्पीड़न की तीव्रता को बिना अतिरिक्त व्याख्या के व्यक्त किया गया है।
