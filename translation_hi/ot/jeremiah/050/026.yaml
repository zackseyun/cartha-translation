base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/026.yaml
  text: Come against her from the farthest border[a]; open her storehouses; pile her up like heaps, and devote her to destruction[c][b]; let no remnant remain to her.
translation:
  language: hi
  text: उसके विरुद्ध सबसे दूरस्थ छोर से[a] आओ; उसके भंडार खोल दो[b]; उसे ढेरों की तरह ढेर कर दो और विनाश के लिए समर्पित कर दो[c]; उसका कोई अवशेष न बचे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अंत से” अथवा “छोर से।” इब्रानी पद देश या क्षेत्र के सबसे दूरस्थ छोर की ओर संकेत कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “अन्नशालाएँ,” “पशुशालाएँ” अथवा “नांदें।” इब्रानी शब्द मूलतः पशुओं के खाने की जगह को सूचित कर सकता है और इस प्रसंग में अनाज या रसद रखने के स्थान के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में ऐसा शब्द है जिसका अर्थ किसी को पूर्ण विनाश के लिए निषिद्ध ठहराना या समर्पित करना है।
    reason: lexical_alternative
