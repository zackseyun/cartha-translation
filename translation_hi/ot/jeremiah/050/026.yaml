- source_word: סָלּוּהָ כְמוֹ עֲרֵמִים
  choice: उसे ढेरों के समान ढेर कर दो
  rationale: स्त्रीलिंग कर्म-प्रत्यय को बाबुल से जोड़ते हुए סלל की ‘ढेर लगाना’ वाली सजीव छवि और עֲרֵמִים की अनिर्दिष्ट बहुवचनता बनाए रखी गई है।
- source_word: וְהַחֲרִימוּהָ
  choice: और विनाश के लिए समर्पित कर दो
  rationale: חרם के हिफ़ील रूप में केवल नष्ट करने से अधिक, किसी वस्तु को निषिद्ध ठहराकर पूर्ण विनाश के लिए सौंपने का तकनीकी भाव है।
- source_word: אַל תְּהִי לָהּ שְׁאֵרִית
  choice: उसका कोई अवशेष न बचे
  rationale: शेष या बचे हुए समूह के अर्थ वाले שְׁאֵרִית को संक्षिप्त, स्वाभाविक और भविष्यद्वक्ताई प्रतिध्वनि रखने वाली हिन्दी में प्रस्तुत करता है।
theological_decisions:
- issue: न्याय-वाणी में החרים का अनुवाद
  choice: विनाश के लिए समर्पित कर दो
  alternative: उसका सर्वनाश कर दो; उसे विनाश के निषेध के अधीन कर दो
  rationale: चुना हुआ रूप पूर्ण विनाश के साथ जुड़े धार्मिक-न्यायिक और ‘प्रतिबंध के अधीन करने’ के भाव को साधारण ‘नष्ट करना’ में समतल नहीं करता; पादटिप्पणी तकनीकी अर्थ स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में आज्ञार्थक बहुवचन का प्रयोग किया गया है। शैली गंभीर और भविष्यद्वक्ताई है, पर सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘ढेरों के समान ढेर कर दो’ की जानबूझकर रखी गई पुनरुक्ति मूल इब्रानी की तीखी विनाश-छवि को सुरक्षित करती है।
