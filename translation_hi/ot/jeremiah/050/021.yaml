source:
  edition: WLC
  text: עַל הָ/אָ֤רֶץ מְרָתַ֨יִם֙ עֲלֵ֣ה עָלֶ֔י/הָ וְ/אֶל יוֹשְׁבֵ֖י פְּק֑וֹד חֲרֹ֨ב וְ/הַחֲרֵ֤ם אַֽחֲרֵי/הֶם֙ נְאֻם יְהוָ֔ה וַ/עֲשֵׂ֕ה כְּ/כֹ֖ל אֲשֶׁ֥ר צִוִּיתִֽי/ךָ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/021.yaml
  text: Go up against the land of Merathaim[a], against it, and against the inhabitants of Pekod. Put them to the sword and devote them to destruction after them, declares Yahweh[c][b], and do all that I have commanded you.
translation:
  language: hi
  text: “मरातैम[a] देश के विरुद्ध चढ़ाई कर, उसके विरुद्ध, और पकोद[b] के निवासियों के विरुद्ध। उन्हें तलवार से मार डाल, और उनके पीछे उन्हें विनाश के लिए समर्पित कर दे।[d][c] वह सब कर जिसकी आज्ञा मैंने तुझे दी है।” याहवे की यह घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मरातैम संभवतः बाबेल का प्रतीकात्मक नाम है। इसकी ध्वनि “दुगुना विद्रोह” या संभवतः “दुगुनी कड़वाहट” से मिलती है।
    reason: lexical_alternative
  - marker: b
    text: पकोद किसी स्थान या समुदाय का नाम है; यह इब्रानी मूल शब्द की ओर भी संकेत कर सकता है, जिसका अर्थ “दंड देना,” “ध्यान देना,” या “निरीक्षण करना” हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी क्रिया का अर्थ किसी को प्रतिबंध के अधीन करके विनाश के लिए समर्पित करना है; इसका अनुवाद “पूरी तरह नष्ट कर दे” भी हो सकता है।
    reason: lexical_alternative
  - marker: d
    text: शाब्दिक रूप से “उनके पीछे।” इसका आशय संभवतः पीछा करते हुए विनाश पूरा करना है, पर इब्रानी वाक्यांश का सटीक संबंध अनिश्चित है।
    reason: source_ambiguity
lexical_decisions:
- source_word: מְרָתַיִם
  choice: मरातैम
  rationale: यहाँ यह बाबेल के लिए प्रयुक्त स्थान-सूचक नाम है, इसलिए मुख्य पाठ में इसका लिप्यंतरण किया गया है; नाम में निहित संभावित शब्द-क्रीड़ा टिप्पणी में रखी गई है।
- source_word: עֲלֵה עָלֶיהָ
  choice: उस पर चढ़ाई कर
  rationale: सैनिक प्रसंग में עלה का अर्थ किसी देश के विरुद्ध आगे बढ़ना या चढ़ाई करना है। यह हिंदी में स्वाभाविक रहते हुए युद्ध-संबंधी भाव बनाए रखता है।
- source_word: יוֹשְׁבֵי פְּקוֹד
  choice: पकोद के निवासी
  rationale: יֹשְׁבֵי किसी स्थान में रहने वाले लोगों का सामूहिक बोध कराता है। पकोद को नाम मानकर लिप्यंतरित किया गया है।
- source_word: חֲרֹב
  choice: उन्हें तलवार से मार डाल
  rationale: आज्ञार्थक रूप इस युद्ध-वाणी में हिंसक विनाश का आह्वान करता है। 'तलवार से मार डाल' प्रसंगगत सैन्य अर्थ को स्पष्ट और बलपूर्ण ढंग से व्यक्त करता है।
- source_word: וְהַחֲרֵם
  choice: उन्हें विनाश के लिए अर्पित कर दे
  rationale: חרם का हिफ़ील रूप किसी व्यक्ति या वस्तु को प्रतिबंध के अधीन करके विनाश के लिए समर्पित करने का तकनीकी भाव रखता है; केवल 'नष्ट कर' कहने से यह विशेष अर्थ खो जाता।
- source_word: אַחֲרֵיהֶם
  choice: उनके पीछे जाकर
  rationale: इब्रानी पद का शाब्दिक अर्थ 'उनके पीछे' है और इसका सटीक संबंध कठिन है। यह अनुवाद पीछा करने की संभावित भावना को व्यक्त करता है, जबकि टिप्पणी में अनिश्चितता सुरक्षित रखी गई है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: यह भविष्यवाणी-साहित्य का औपचारिक घोषणात्मक सूत्र है। 'घोषणा' उसके भार को बनाए रखता है और याहवे व्यक्तिगत ईश्वरीय नाम का लिप्यंतरण है।
- source_word: וַעֲשֵׂה כְּכֹל אֲשֶׁר צִוִּיתִיךָ
  choice: वह सब कर जिसकी आज्ञा मैंने तुझे दी है
  rationale: यह समापन आज्ञापालन की संपूर्णता को व्यक्त करता है। एकवचन संबोधन के लिए गरिमापूर्ण 'तुझे' रखा गया है।
theological_decisions:
- issue: न्याय और युद्ध की कठोर भाषा को नरम करना या यथावत रखना
  choice: '''तलवार से मार डाल'' और ''विनाश के लिए अर्पित कर दे'' के द्वारा उसकी पूरी कठोरता बनाए रखना'
  alternative: सामान्य और नरम शब्दों में केवल 'हरा दे' या 'नष्ट कर दे' कहना
  rationale: इब्रानी पाठ युद्ध और חרם की प्रबल भाषा इस्तेमाल करता है। उसे नरम करने से ईश्वरीय न्याय-वाणी की गंभीरता और पाठ में उपस्थित धार्मिक तनाव छिप जाता।
- issue: मरातैम और पकोद को नाम मानना या उनके संभावित अर्थों का अनुवाद करना
  choice: मुख्य पाठ में दोनों का लिप्यंतरण और टिप्पणियों में संभावित शब्द-क्रीड़ा
  alternative: मुख्य पाठ में 'दुगुना विद्रोह'/'दुगुनी कड़वाहट' और 'दंड' जैसे अर्थ देना
  rationale: दोनों पद वाक्य में स्थान अथवा समुदाय के नाम की तरह काम करते हैं। लिप्यंतरण से भौगोलिक और प्रतीकात्मक दोनों संभावनाएँ खुली रहती हैं।
- issue: אַחֲרֵיהֶם के कठिन संबंध को कैसे प्रस्तुत किया जाए
  choice: '''उनके पीछे जाकर'' के साथ पाठगत अस्पष्टता की टिप्पणी'
  alternative: '''उनका पूरी तरह अंत कर दे'' जैसे व्याख्यात्मक अर्थ में समाहित करना'
  rationale: मूल पद का सीधा अर्थ 'उनके पीछे' है, पर यहाँ उसका ठीक आशय अनिश्चित है। स्पष्टता के नाम पर एक ही व्याख्या थोपने के बजाय संभावित पीछा करने का भाव मुख्य पाठ में और अनिश्चितता टिप्पणी में रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सीधे संबोधन वाली रखी गई है। युद्ध-वाणी की कठोरता को बिना नरम किए स्वाभाविक हिंदी में व्यक्त किया गया है। स्थान-नामों को देवनागरी में लिप्यंतरित किया गया है और ईश्वरीय नाम יְהוָה को 'याहवे' लिखा गया है।
