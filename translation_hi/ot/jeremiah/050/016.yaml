source:
  edition: WLC
  text: כִּרְת֤וּ זוֹרֵ֨עַ֙ מִ/בָּבֶ֔ל וְ/תֹפֵ֥שׂ מַגָּ֖ל בְּ/עֵ֣ת קָצִ֑יר מִ/פְּנֵי֙ חֶ֣רֶב הַ/יּוֹנָ֔ה אִ֤ישׁ אֶל עַמּ/וֹ֙ יִפְנ֔וּ וְ/אִ֥ישׁ לְ/אַרְצ֖/וֹ יָנֻֽסוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/016.yaml
  text: Cut off from Babylon the sower[a], and the one who handles the sickle at the time of harvest. Because of the sword of the oppressor, each man will turn to his own people, and each will flee to his own land.
translation:
  language: hi
  text: बाबेल से बोने वाले को और कटनी के समय हँसिया चलाने वाले को मिटा दो। अत्याचारी की तलवार[a] के कारण हर एक अपने लोगों की ओर लौटेगा और अपने देश भाग जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अत्याचार करने वाले की तलवार।” इस हिब्रू अभिव्यक्ति का अर्थ कुछ लोग “क्रूर तलवार” भी मानते हैं; अधिक शाब्दिक, किंतु इस प्रसंग में कम संभावित अर्थ “कबूतर की तलवार” है।
    reason: חֶרֶב הַיּוֹנָה की वास्तविक शब्दगत अस्पष्टता और प्रमुख वैकल्पिक व्याख्याओं को सुरक्षित रखना।
lexical_decisions:
- source_word: כִּרְתוּ
  choice: मिटा दो
  rationale: यह क़ाल बहुवचन आज्ञार्थक रूप न्याय के प्रसंग में किसी को उस स्थान से समाप्त या दूर कर देने का भाव रखता है। ‘मिटा दो’ आधुनिक हिन्दी में स्वाभाविक है और साधन को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: זוֹרֵעַ
  choice: बोनेवाले
  rationale: कृदंत यहाँ संज्ञा के रूप में खेत में बीज बोनेवाले व्यक्ति को दर्शाता है।
- source_word: וְתֹפֵשׂ מַגָּל
  choice: हँसिया चलानेवाले
  rationale: शाब्दिक अर्थ ‘हँसिया पकड़नेवाला’ है; कटनी के प्रसंग में ‘हँसिया चलानेवाला’ हिन्दी में अधिक स्वाभाविक होकर वही कार्य स्पष्ट करता है।
- source_word: בְּעֵת קָצִיר
  choice: कटनी के समय
  rationale: यह समयसूचक वाक्यांश का सीधा और प्रचलित हिन्दी रूप है।
- source_word: מִפְּנֵי
  choice: के कारण
  rationale: इस प्रसंग में यह पलायन का कारण बताता है, इसलिए स्थानसूचक शाब्दिक रूप के बजाय कारणसूचक रूप उचित है।
- source_word: חֶרֶב הַיּוֹנָה
  choice: अत्याचारी की तलवार
  rationale: הַיּוֹנָה को यहाँ अत्याचार करनेवाले से संबंधित रूप मानना प्रसंगानुकूल है; साथ ही वास्तविक शाब्दिक और व्याख्यात्मक अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: אִישׁ אֶל עַמּוֹ יִפְנוּ
  choice: हर एक अपने लोगों की ओर लौटेगा
  rationale: אִישׁ यहाँ वितरणात्मक है। ‘हर एक’ सामान्य हिन्दी में सभी संबंधित व्यक्तियों को समेटता है, और ‘लौटेगा’ पीछे अपने समुदाय की ओर मुड़ने का प्रसंगगत भाव देता है।
- source_word: וְאִישׁ לְאַרְצוֹ יָנֻסוּ
  choice: और अपने देश को भाग जाएगा
  rationale: נוּס का अर्थ भागना या पलायन करना है; ‘देश’ यहाँ व्यक्ति की अपनी भूमि को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: אִישׁ का वितरणात्मक प्रयोग
  choice: हर एक
  alternative: हर पुरुष
  rationale: यहाँ पुल्लिंग एकवचन रूप वितरणात्मक ढंग से प्रत्येक व्यक्ति के लिए प्रयुक्त है। ‘हर एक’ अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है और पाठ में अनावश्यक रूप से केवल पुरुषों तक अर्थ सीमित नहीं करता।
- issue: חֶרֶב הַיּוֹנָה की अस्पष्टता
  choice: अत्याचारी की तलवार
  alternative: अत्याचार करनेवाले की तलवार; क्रूर तलवार; कबूतर की तलवार
  rationale: बाबेल के विरुद्ध युद्ध और पलायन के प्रसंग में अत्याचारी से जुड़ा अर्थ सर्वाधिक संगत है, पर हिब्रू अभिव्यक्ति की असामान्यता और अन्य संभावनाएँ पादटिप्पणी में स्पष्ट रखी गई हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप। कृषि-संबंधी शब्दावली सामान्य रखी गई है; समानांतर वाक्यरचना और न्यायवाणी का आदेशात्मक बल बनाए रखा गया है।
