  text: יָקֹ֨שְׁתִּי לָ֤/ךְ וְ/גַם נִלְכַּדְתְּ֙ בָּבֶ֔ל וְ/אַ֖תְּ לֹ֣א יָדָ֑עַתְּ נִמְצֵאת֙ וְ/גַם נִתְפַּ֔שְׂתְּ כִּ֥י בַֽ/יהוָ֖ה הִתְגָּרִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/024.yaml
  text: I set a trap for you[a], and you also were caught, Babylon, and you did not know it; you were found and also seized[c][b], because you contended against Yahweh.
translation:
  language: hi
  text: मैंने तेरे लिए फंदा बिछाया[a], और हे बाबेल, तू पकड़ी भी गई, और तुझे पता न चला; तेरा पता लगा और तुझे पकड़ लिया गया[b], क्योंकि तूने यहोवा का विरोध किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैंने तेरे विरुद्ध फंदा बिछाया।”
    reason: lexical_alternative
  - marker: b
    text: या, “तेरा पता लगा और तुझे पकड़ लिया गया”; ये दोनों क्रियाएँ बाबेल के पतन की तीव्रता बढ़ाती हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: יָקֹשְׁתִּי לָךְ
  choice: मैंने तेरे लिए फंदा लगाया
  rationale: यह वाक्यांश फंदा लगाने के ठोस रूपक और बाबेल को संबोधित स्त्रीलिंग एकवचन को सुरक्षित रखता है।
- source_word: וְגַם נִלְכַּדְתְּ
  choice: और तू पकड़ी भी गई
  rationale: נלכדת का निष्क्रिय अर्थ और גם का बल ‘भी’ से व्यक्त होता है; स्त्रीलिंग रूप बाबेल के मानवीकरण के अनुरूप है।
- source_word: וְאַתְּ לֹא יָדָעַתְּ
  choice: पर तुझे पता न चला
  rationale: इब्रानी में कर्म स्पष्ट नहीं है; स्वाभाविक हिन्दी में यह उस फंदे और पकड़े जाने से अनजान रहने का अर्थ देता है, बिना अनावश्यक विवरण जोड़े।
- source_word: נִמְצֵאת וְגַם נִתְפַּשְׂתְּ
  choice: तू पाई गई और धर ली गई
  rationale: दोनों अलग निष्क्रिय क्रियाओं को बनाए रखते हुए खोज निकाले जाने से बलपूर्वक पकड़ लिए जाने की प्रगति व्यक्त की गई है।
- source_word: בַיהוָה
  choice: यहोवा से
  rationale: टेट्राग्राम को हिन्दी में प्रचलित व्यक्तिगत नाम ‘यहोवा’ से व्यक्त किया गया है; उपसर्ग ב विरोधसूचक क्रिया के साथ ‘से’ बनता है।
- source_word: הִתְגָּרִית
  choice: तू भिड़ गई थी
  rationale: हित्पएल रूप किसी के विरुद्ध अपने को उकसाने, उससे उलझने या संघर्ष मोल लेने का भाव देता है; ‘भिड़ गई’ आधुनिक, स्पष्ट और प्रतिद्वंद्वितापूर्ण भाव के निकट है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है, सामान्य उपाधि ‘प्रभु’ नहीं। हिन्दी पाठकों के लिए ‘यहोवा’ व्यापक रूप से पहचाना जाने वाला रूप है; ‘याहवे’ अधिक निकट लिप्यंतरण है।
- issue: הִתְגָּרִית में विरोध की प्रकृति
  choice: तू यहोवा से भिड़ गई थी
  alternative: तू यहोवा के विरुद्ध उठ खड़ी हुई थी
  rationale: मूल क्रिया में चुनौती, उलझाव और संघर्ष मोल लेने की गुंजाइश है। चुना हुआ पाठ इसे सामान्य विद्रोह या केवल वाद-विवाद तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। बाबेल को संबोधित करने वाले सभी रूप स्त्रीलिंग एकवचन में हैं। ‘हे बाबेल’ प्रत्यक्ष संबोधन को स्पष्ट करता है।
