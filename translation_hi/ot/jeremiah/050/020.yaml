source:
  edition: WLC
  text: בַּ/יָּמִ֣ים הָ/הֵם֩ וּ/בָ/עֵ֨ת הַ/הִ֜יא נְאֻם יְהוָ֗ה יְבֻקַּ֞שׁ אֶת עֲוֺ֤ן יִשְׂרָאֵל֙ וְ/אֵינֶ֔/נּוּ וְ/אֶת חַטֹּ֥את יְהוּדָ֖ה וְ/לֹ֣א תִמָּצֶ֑אינָה כִּ֥י אֶסְלַ֖ח לַ/אֲשֶׁ֥ר אַשְׁאִֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/020.yaml
  text: In those days and at that time, declares the LORD, the guilt of Israel will be sought, but there will be none, and the sins of Judah, but they will not be found; for I will forgive those whom I leave as a remnant.
translation:
  language: hi
  text: उन दिनों और उस समय—यह यहोवा की घोषणा है—इस्राएल का अधर्म ढूँढ़ा जाएगा, पर वह नहीं मिलेगा; और यहूदा के पाप ढूँढ़े जाएँगे, पर वे नहीं मिलेंगे; क्योंकि जिन्हें मैं शेष रहने दूँगा, उन्हें मैं क्षमा कर दूँगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עָוֺן
  choice: अधर्म
  rationale: यह शब्द दोष, अपराध और उसके परिणाम की अर्थ-सीमा रखता है। यहाँ पापों के समानांतर होने के कारण ‘अधर्म’ स्वाभाविक है और नैतिक अपराध की गंभीरता बनाए रखता है।
- source_word: חַטֹּאת
  choice: पाप
  rationale: बहुवचन रूप और समानांतर वाक्य-संरचना को रखते हुए सामान्य, स्पष्ट हिन्दी शब्द चुना गया है।
- source_word: נְאֻם יְהוָה
  choice: यह यहोवा की घोषणा है
  rationale: नबी-साहित्य के औपचारिक दैवी-वचन सूत्र को स्पष्ट और गरिमापूर्ण हिन्दी में व्यक्त करता है तथा व्यक्तिगत नाम יהוה को ‘यहोवा’ से दर्शाता है।
- source_word: אֶסְלַח
  choice: मैं क्षमा कर दूँगा
  rationale: सलाख क्रिया पाप अथवा अपराध को ईश्वर द्वारा क्षमा किए जाने को सूचित करती है; भविष्यकालीन संदर्भ के अनुरूप यह रूप स्वाभाविक है।
- source_word: לַאֲשֶׁר אַשְׁאִיר
  choice: जिन्हें मैं बचे हुए लोगों के रूप में रहने दूँगा
  rationale: אשר की व्यक्ति-संबंधी अनिश्चितता और שׁאר के ‘बचा छोड़ना/शेष रहने देना’ भाव को सुरक्षित रखते हुए अवशिष्ट समुदाय का आशय स्पष्ट किया गया है।
theological_decisions:
- issue: इस्राएल के अधर्म और यहूदा के पापों का न मिलना
  choice: इसे अगले उपवाक्य में परमेश्वर की क्षमा के आधार पर प्रस्तुत किया गया है।
  alternative: इसे केवल अपराधों के मिट जाने या दंड पूरा हो जाने के रूप में समझाकर अनुवाद करना।
  rationale: मूल पाठ स्वयं ‘क्योंकि मैं क्षमा कर दूँगा’ कहता है; अनुवाद इस कारण-संबंध को रखता है, पर क्षमा की प्रक्रिया पर अतिरिक्त धर्मवैज्ञानिक व्याख्या नहीं जोड़ता।
- issue: अवशिष्ट लोगों की पहचान
  choice: ‘जिन्हें मैं बचे हुए लोगों के रूप में रहने दूँगा’
  alternative: ‘मेरे चुने हुए बचे हुए लोग’ या ‘जो बच जाएँगे’
  rationale: मूल में परमेश्वर कर्ता हैं और लोगों को बचा छोड़ते हैं; ‘चुने हुए’ जोड़ना पाठ से आगे जाता, जबकि केवल ‘जो बच जाएँगे’ दैवी कर्तृत्व को कम कर देता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। इब्रानी की दोहरी समय-अभिव्यक्ति और समानांतर वाक्य-संरचना को यथासंभव बनाए रखा गया है। कोई पाद-टिप्पणी आवश्यक नहीं समझी गई।
