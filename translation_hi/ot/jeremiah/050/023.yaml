  yaml_path: translation/ot/jeremiah/050/023.yaml
  text: How the hammer of the whole earth has been cut down and broken! How Babylon has become a desolation among the nations![a][b]
translation:
  language: hi
  text: सारी पृथ्वी का हथौड़ा कैसे काट डाला गया और तोड़ दिया गया है! कैसे बाबेल राष्ट्रों के बीच उजाड़ बन गई है![a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सारी पृथ्वी का युद्ध-हथौड़ा।” इब्रानी रूपक बाबेल को राष्ट्रों को कुचलने वाले साधन के रूप में प्रस्तुत करता है।
    reason: lexical_alternative
  - marker: b
    text: या “राष्ट्रों के बीच आतंक और विस्मय का विषय बन गई है।” इब्रानी शब्द उजाड़ दशा और उस विनाश को देखकर उत्पन्न स्तब्ध विस्मय—दोनों पर बल दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ
  choice: हाय, ... कैसे
  rationale: यह प्रश्न नहीं, बल्कि विस्मय और विलाप प्रकट करने वाला उद्गार है; ‘हाय’ और ‘कैसे’ मिलकर उसके भाव को स्वाभाविक हिन्दी में बनाए रखते हैं।
- source_word: נִגְדַּע
  choice: काट गिराया गया
  rationale: גדע के निफ़ाल रूप का अर्थ काट डाला या काट गिराया जाना है; यह शक्तिशाली बाबेल के गिराए जाने की छवि बनाए रखता है।
- source_word: וַיִּשָּׁבֵר
  choice: और तोड़ दिया गया
  rationale: שבר का निष्क्रिय अर्थ ‘तोड़ा गया’ है; यह मूल पाठ की संयत अभिव्यक्ति को बिना अनावश्यक तीव्रता बढ़ाए प्रस्तुत करता है।
- source_word: פַּטִּישׁ
  choice: हथौड़ा
  rationale: मूल संज्ञा का सीधा और सुबोध अर्थ ‘हथौड़ा’ है; बाबेल को राष्ट्रों को कुचलने वाले साधन के रूप में दिखाने वाला रूपक सुरक्षित रहता है।
- source_word: כָּל הָאָרֶץ
  choice: सारी पृथ्वी का
  rationale: आगे ‘राष्ट्रों के बीच’ आने के कारण यहाँ स्थानीय ‘देश’ से अधिक व्यापक अंतरराष्ट्रीय अर्थ है।
- source_word: הָיְתָה לְשַׁמָּה
  choice: उजाड़ हो गई है
  rationale: यह वाक्यांश विनाश और विस्मयकारी दुर्दशा, दोनों का संकेत दे सकता है; मुख्य पाठ में स्वाभाविक हिन्दी के लिए ‘उजाड़’ चुना गया है और दूसरा भाव पादटिप्पणी में रखा गया है।
- source_word: בָּבֶל
  choice: बाबेल
  rationale: हिन्दी बाइबलीय परंपरा में इस इब्रानी स्थान-नाम का प्रचलित रूप ‘बाबेल’ है।
- source_word: בַּגּוֹיִם
  choice: राष्ट्रों के बीच
  rationale: इस भू-राजनीतिक न्याय-संदर्भ में גוים सामान्य रूप से राष्ट्रों को सूचित करता है, किसी बाद की धार्मिक श्रेणी को नहीं।
theological_decisions:
- issue: बाबेल की पहचान ‘सारी पृथ्वी के हथौड़े’ के रूप में
  choice: रूपक को सीधे ‘हथौड़ा’ के रूप में बनाए रखना
  alternative: ‘सारी पृथ्वी का विनाशक’ या ‘युद्ध का हथौड़ा’
  rationale: मूल का महत्वपूर्ण व्यंग्य यही है कि दूसरों को कुचलने वाला साधन स्वयं काट गिराया और तोड़ा गया। ‘विनाशक’ कहने से रूपक मिट जाता, जबकि ‘युद्ध का’ मूल में स्पष्ट रूप से नहीं है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। दोहराए गए אֵיךְ की विस्मयात्मक-विलापात्मक शक्ति को ‘हाय ... कैसे’ और ‘कैसी’ से व्यक्त किया गया है; मुख्य रूपक और उसकी काव्यात्मक तीव्रता बनाए रखी गई है।
