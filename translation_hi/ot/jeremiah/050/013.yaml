source:
  edition: WLC
  text: מִ/קֶּ֤צֶף יְהוָה֙ לֹ֣א תֵשֵׁ֔ב וְ/הָיְתָ֥ה שְׁמָמָ֖ה כֻּלָּ֑/הּ כֹּ֚ל עֹבֵ֣ר עַל בָּבֶ֔ל יִשֹּׁ֥ם וְ/יִשְׁרֹ֖ק עַל כָּל מַכּוֹתֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/013.yaml
  text: Because of the wrath of Yahweh[a], it will not be inhabited, but will become a complete desolation. Everyone who passes by Babylon will be appalled and will hiss over all her wounds.
translation:
  language: hi
  text: याहवे के प्रकोप के कारण वह आबाद नहीं होगी, बल्कि पूरी तरह उजाड़ हो जाएगी। बाबेल के पास से गुज़रने वाला हर व्यक्ति स्तब्ध रह जाएगा और उसके सारे घावों पर सीटी बजाएगा[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “फुफकारेगा।” इब्रानी क्रिया सीटी बजाने या फुफकारने की ध्वनि बता सकती है; यहाँ यह संभवतः बाबेल के विनाश पर उपहास या स्तब्धता की प्रतिक्रिया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקֶּצֶף יְהוָה
  choice: याहवे के प्रकोप के कारण
  rationale: מִן यहाँ कारण व्यक्त करता है और קֶצֶף तीव्र दैवी क्रोध को दर्शाता है; ‘प्रकोप’ उसका बल और न्याय-संबंधी स्वर बनाए रखता है। יְהוָה को उपाधि से बदलने के बजाय व्यक्तिगत नाम ‘याहवे’ के रूप में रखा गया है।
- source_word: לֹא תֵשֵׁב
  choice: वह बसाई नहीं जाएगी
  rationale: स्त्रीलिंग क्रिया बाबेल नगरी से मेल खाती है और इस संदर्भ में उसका अर्थ है कि नगर आबाद नहीं रहेगा। हिंदी में कर्मवाच्य स्वाभाविक है।
- source_word: וְהָיְתָה שְׁמָמָה כֻּלָּהּ
  choice: बल्कि पूरी तरह उजाड़ हो जाएगी
  rationale: שְׁמָמָה विनाश और निर्जनता को तथा כֻּלָּהּ उसकी संपूर्णता को व्यक्त करता है। यह रूप स्वाभाविक हिंदी में दोनों भाव सुरक्षित रखता है।
- source_word: כֹּל עֹבֵר עַל בָּבֶל
  choice: बाबेल के पास से गुज़रने वाला हर व्यक्ति
  rationale: यह पद उजड़े नगर के पास से जाने वाले राहगीरों को दर्शाता है; ‘के पास से गुज़रने वाला’ हिंदी में स्पष्ट और सहज है।
- source_word: יִשֹּׁם
  choice: स्तब्ध रह जाएगा
  rationale: שׁמם यहाँ विनाश देखकर भय-मिश्रित विस्मय या स्तब्धता की प्रतिक्रिया बताता है। ‘स्तब्ध रह जाएगा’ इस संदर्भ में स्वाभाविक है और केवल बौद्धिक आश्चर्य तक अर्थ सीमित नहीं करता।
- source_word: וְיִשְׁרֹק
  choice: सीटी बजाएगा
  rationale: שרק सीटी बजाने या फुफकारने जैसी ध्वनि को दर्शा सकता है। मुख्य पाठ में सहज हिंदी के लिए ‘सीटी बजाएगा’ रखा गया है और ध्वनि तथा उसके भाव की अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: עַל כָּל מַכּוֹתֶיהָ
  choice: उसके सारे घावों को देखकर
  rationale: מַכָּה प्रहार से लगे घाव या आई विपत्ति को दर्शाता है। ‘घाव’ बाबेल के स्त्रीलिंग मानवीकरण को बनाए रखता है; עַל को प्रसंगानुसार प्रतिक्रिया के आधार के रूप में ‘को देखकर’ व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा ‘प्रभु’
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
- issue: बाबेल के विनाश पर राहगीरों की प्रतिक्रिया
  choice: ‘सीटी बजाएगा’ के साथ पादटिप्पणी में उपहास या स्तब्धता की संभावना खुली रखी गई
  alternative: ‘फुफकारेगा’ या स्पष्ट रूप से ‘उपहास करेगा’
  rationale: इब्रानी क्रिया ध्वनि तो बताती है, पर उसका सटीक भाव संदर्भ से निर्धारित होता है। पाठ में किसी एक धार्मिक या व्याख्यात्मक अर्थ को अनावश्यक रूप से निश्चित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। बाबेल को स्त्रीलिंग नगर के रूप में मानवीकृत करने वाला मूल भाव ‘वह’ और ‘उसके घावों’ में सुरक्षित है।
