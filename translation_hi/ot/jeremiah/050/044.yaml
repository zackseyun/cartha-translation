base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/044.yaml
  text: Look[a], like a lion he comes up from the thicket of the Jordan against a secure pasture; for in an instant I will make them run from it, and I will appoint over it whoever is chosen. For who is like me[c][b], and who can summon me? What shepherd can stand before me?
translation:
  language: hi
  text: देखो, सिंह की तरह वह यरदन की घनी झाड़ियों[a] में से निकलकर सुरक्षित चरागाह की ओर चढ़ आता है। क्योंकि मैं पल भर में उन्हें वहाँ से दौड़ा दूँगा[b], और जिसे चुना गया है उसे मैं उस पर नियुक्त करूँगा। क्योंकि मेरे समान कौन है? कौन मुझे बुला सकता है[c]? और ऐसा कौन-सा चरवाहा है जो मेरे सामने टिक सके?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “यरदन के गौरव में से”; यह अभिव्यक्ति संभवतः यरदन के किनारे की घनी, हरी-भरी झाड़ियों को दर्शाती है।
    reason: lexical_alternative
  - marker: b
    text: या, “उन्हें वहाँ से खदेड़ दूँगा।”
    reason: lexical_alternative
  - marker: c
    text: या, “कौन मेरे लिए मिलने का समय ठहरा सकता है?” इब्रानी क्रिया में मिलने का समय ठहराने या किसी को उपस्थित होने के लिए बुलाने का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह कथन को सजीव और तात्कालिक बनाने वाला संकेतक है; ‘देखो’ आधुनिक हिन्दी में स्वाभाविक रहते हुए उसका बल बनाए रखता है।
- source_word: כְּאַרְיֵה יַעֲלֶה
  choice: जैसे सिंह … में से निकलकर … चढ़ आता है
  rationale: उपमा और עלה की ऊपर आने/चढ़ आने की गति दोनों को सजीव हिन्दी में व्यक्त किया गया है।
- source_word: מִגְּאוֹן הַיַּרְדֵּן
  choice: यरदन की घनी झाड़ियों में से
  rationale: यरदन के साथ גאון यहाँ संभवतः नदी-तट की ऊँची, सघन और हरी-भरी झाड़ियों का मुहावरा है; शाब्दिक ‘यरदन का गौरव’ स्थान-चित्र को अस्पष्ट कर देता।
- source_word: אֶל נְוֵה אֵיתָן
  choice: सुरक्षित चरागाह पर
  rationale: נוה पशुओं के चरने या रहने की जगह और איתן दृढ़ता/स्थायित्व दर्शाता है; सिंह और चरवाहे के बिंब के अनुरूप ‘सुरक्षित चरागाह’ चुना गया।
- source_word: כִּי אַרְגִּעָה
  choice: क्योंकि मैं पल भर में
  rationale: רגע का यह रूप अचानक अथवा बहुत थोड़े समय में कार्य करने का भाव देता है।
- source_word: ארוצם מֵעָלֶיהָ
  choice: उन्हें वहाँ से खदेड़ दूँगा
  rationale: पाठ में दौड़ने के लिए विवश करने या भगा देने का कारणवाचक भाव है; स्त्रीलिंग प्रत्यय को हिन्दी में उस स्थान के लिए ‘वहाँ से’ कहा गया है।
- source_word: וּמִי בָחוּר אֵלֶיהָ אֶפְקֹד
  choice: और जिसे चुना गया है उसे मैं उस पर नियुक्त करूँगा
  rationale: संक्षिप्त इब्रानी वाक्य में בחור का चुना हुआ होना और פקד का अधिकार पर नियुक्त करना—दोनों सुरक्षित रखे गए हैं।
- source_word: כִּי מִי כָמוֹנִי
  choice: क्योंकि मेरे समान कौन है?
  rationale: परमेश्वर की अतुलनीयता व्यक्त करने वाला प्रश्न औपचारिक रूप से बनाए रखा गया है।
- source_word: וּמִי יוֹעִדֶנִּי
  choice: कौन मुझे बुला सकता है?
  rationale: יעד के हिफ़इल रूप में समय ठहराने, उपस्थित होने के लिए बुलाने या सामना करने के लिए तलब करने का अर्थ हो सकता है; मुख्य पाठ में संक्षिप्त और खुला ‘बुला सकता है’ रखा गया है।
- source_word: וּמִי זֶה רֹעֶה אֲשֶׁר יַעֲמֹד לְפָנָי
  choice: और ऐसा कौन-सा चरवाहा है जो मेरे सामने टिक सके?
  rationale: चरवाहे का मूल बिंब बनाए रखते हुए ‘सामने टिक सके’ से सफलतापूर्वक सामना करने का मुहावरेदार अर्थ व्यक्त होता है।
theological_decisions:
- issue: सिंह के बिंब और प्रथम पुरुष में परमेश्वर की वाणी का संबंध
  choice: तीसरे पुरुष के सिंह-बिंब और उसके बाद परमेश्वर की प्रथम-पुरुष घोषणा—दोनों को बनाए रखा गया है।
  alternative: सिंह को केवल आक्रमणकारी शासक कहकर स्पष्ट कर देना, या सीधे परमेश्वर से उसकी पहचान कर देना।
  rationale: इब्रानी पाठ स्वयं ‘वह चढ़ आता है’ से ‘मैं खदेड़ दूँगा’ की ओर जाता है। अनुवाद इस तनाव को हल किए बिना आक्रमण के पीछे परमेश्वर की सार्वभौमिक सत्ता को सुनने देता है।
- issue: וּמִי יוֹעִדֶנִּי में न्यायिक अथवा समय-निर्धारण का भाव
  choice: मुख्य पाठ में ‘कौन मुझे बुला सकता है?’ रखा गया और वैकल्पिक अर्थ पादटिप्पणी में दिया गया।
  alternative: ‘कौन मेरे लिए समय ठहरा सकता है?’
  rationale: क्रिया बुलाने, भेंट का समय ठहराने या उत्तरदायित्व के लिए तलब करने का भाव धारण कर सकती है; किसी एक न्यायिक व्याख्या को अनिवार्य नहीं बनाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सजीव किंतु गरिमापूर्ण भविष्यवाणी-वाचक रूप अपनाया गया है। ‘देखो’, ‘पल भर में’ और ‘टिक सके’ साधारण पाठक के लिए सहज हैं; ‘चरागाह’, ‘नियुक्त’ और अलंकारिक सिंह/चरवाहा-बिंब मूल की गंभीरता बनाए रखते हैं।
