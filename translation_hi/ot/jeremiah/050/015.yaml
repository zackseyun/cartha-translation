source:
  edition: WLC
  text: הָרִ֨יעוּ עָלֶ֤י/הָ סָבִיב֙ נָתְנָ֣ה יָדָ֔/הּ נָֽפְלוּ֙ אשויתי/ה נֶהֶרְס֖וּ חֽוֹמוֹתֶ֑י/הָ כִּי֩ נִקְמַ֨ת יְהוָ֥ה הִיא֙ הִנָּ֣קְמוּ בָ֔/הּ כַּ/אֲשֶׁ֥ר עָשְׂתָ֖ה עֲשׂוּ לָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/015.yaml
  text: Raise a shout against her all around[a]; she has given her hand; her foundations have fallen, her walls are torn down. For it is the vengeance of Yahweh—take vengeance on her; as she has done[b], do to her.
translation:
  language: hi
  text: चारों ओर से उसके विरुद्ध युद्धघोष करो! उसने अपना हाथ दे दिया है[a]; उसके सहारे ढह गए हैं[b], उसकी शहरपनाहें गिरा दी गई हैं। क्योंकि यह यहोवा का प्रतिशोध है—उससे बदला लो; जैसा उसने किया है, वैसा ही उसके साथ करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् उसने आत्मसमर्पण कर दिया है। मूल में शाब्दिक रूप से, “उसने अपना हाथ दे दिया है।”
    reason: lexical_alternative
  - marker: b
    text: यहाँ प्रयुक्त इब्रानी शब्द का अर्थ अनिश्चित है; इससे नींवें, पुश्ते अथवा अन्य रक्षात्मक सहारे अभिप्रेत हो सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרִיעוּ עָלֶיהָ סָבִיב
  choice: चारों ओर से उसके विरुद्ध युद्धघोष करो
  rationale: सैन्य घेराबंदी के प्रसंग में हिफ़इल आज्ञार्थक הָרִיעוּ युद्ध या आक्रमण की पुकार का संकेत देता है; עָלֶיהָ को विरोधार्थक और סָבִיב को चारों ओर से घेरने के भाव में रखा गया है।
- source_word: נָתְנָה יָדָהּ
  choice: उसने हाथ दे दिया है
  rationale: इब्रानी मुहावरे की सजीव और कुछ अस्पष्ट शाब्दिक छवि सुरक्षित रखी गई है; संदर्भ में इसका आशय आत्मसमर्पण करना है, जिसे पादटिप्पणी में स्पष्ट किया गया है।
- source_word: אשויתיה
  choice: उसके सहारे
  rationale: यह दुर्लभ और अर्थ की दृष्टि से अनिश्चित शब्द है। घेराबंदी तथा समानांतर 'शहरपनाहें' के संदर्भ में यह आधारों, पुश्तों या अन्य रक्षात्मक सहारों को सूचित कर सकता है; सामान्य 'सहारे' अनावश्यक वास्तु-विशिष्टता से बचाता है।
- source_word: נֶהֶרְסוּ חוֹמוֹתֶיהָ
  choice: उसकी शहरपनाहें गिरा दी गई हैं
  rationale: निफ़अल נֶהֶרְסוּ ध्वस्त या गिराए जाने को व्यक्त करता है। חוֹמוֹתֶיהָ के लिए घेराबंदी के संदर्भ में 'शहरपनाहें' साधारण 'दीवारों' से अधिक स्पष्ट और स्वाभाविक है।
- source_word: נִקְמַת יְהוָה הִיא
  choice: यह यहोवा का प्रतिशोध है
  rationale: इब्रानी वाक्य घटना को यहोवा के प्रतिशोध के रूप में पहचानता है; יהוה को व्यक्तिगत दिव्य नाम 'यहोवा' से प्रस्तुत किया गया है।
- source_word: הִנָּקְמוּ בָהּ
  choice: उससे बदला लो
  rationale: बहुवचन आज्ञार्थक का न्यायात्मक-प्रतिदानात्मक बल सहज आधुनिक हिन्दी में व्यक्त होता है।
- source_word: כַּאֲשֶׁר עָשְׂתָה עֲשׂוּ לָהּ
  choice: जैसा उसने किया है, वैसा ही उसके साथ करो
  rationale: मूल की संक्षिप्त पारस्परिक प्रतिदान-रचना और आज्ञा का बल सुरक्षित रखा गया है।
theological_decisions:
- issue: נָתְנָה יָדָהּ को शाब्दिक छवि या अर्थगत आत्मसमर्पण के रूप में प्रस्तुत करना
  choice: मुख्य पाठ में 'उसने हाथ दे दिया है'
  alternative: '''उसने आत्मसमर्पण कर दिया है'''
  rationale: मुहावरे का संदर्भगत अर्थ संभवतः आत्मसमर्पण है, पर मुख्य पाठ में मूल छवि रखने से उसकी वास्तविक अभिव्यक्ति और हल्की अस्पष्टता बनी रहती है; अर्थ पादटिप्पणी में दिया गया है।
- issue: अनिश्चित אשויתיה का वास्तु-संबंधी अर्थ
  choice: '''सहारे'''
  alternative: '''नींवें'', ''पुश्ते'', या ''रक्षात्मक प्राचीरें'''
  rationale: शब्द दुर्लभ और पाठार्थ अनिश्चित है। 'सहारे' संरचनात्मक या रक्षात्मक अर्थ की गुंजाइश बनाए रखता है, जबकि पादटिप्पणी अन्य प्रमुख संभावनाएँ बताती है।
- issue: נקם की प्रतिशोधात्मक भाषा
  choice: यहोवा के प्रतिशोध और बाबेल के कर्मों के अनुरूप प्रतिदान को सीधे बनाए रखना
  alternative: इसे सामान्य दंड या न्याय कहकर नरम करना
  rationale: मूल पाठ स्पष्ट रूप से प्रतिशोध और कर्मानुसार प्रत्युत्तर की भाषा बोलता है; अनुवाद इसे न तो कम करता है, न किसी व्यापक सिद्धांत से बढ़ाता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। सैन्य प्रसंग में 'युद्धघोष' और नगर-रक्षा के लिए 'शहरपनाहें' चुने गए हैं। दिव्य नाम יהוה को 'यहोवा' लिखा गया है।
