base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/031.yaml
  text: Behold[a], I am against you, O arrogant one, declares the Lord GOD of hosts, for your day has come[b], the time when I will punish you.
translation:
  language: hi
  text: “हे अभिमानी[a], देखो, मैं तेरे विरुद्ध हूँ,” सेनाओं के प्रभु याहवे की यह वाणी है, “क्योंकि तेरा दिन आ पहुँचा है—वह समय जब मैं तुझसे लेखा लूँगा[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अभिमानी’ का अनुवाद ‘घमंडी’ या ‘धृष्ट’ भी हो सकता है। इब्रानी זָדוֹן यहाँ बाबेल को उसके अहंकार के आधार पर दिया गया संबोधन है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक भाव ‘वह समय जब मैं तुझसे भेंट करूँगा/तेरी सुधि लूँगा’ है। यहाँ यह भेंट न्याय में उत्तरदायी ठहराने और दंड देने के अर्थ में है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: देख, मैं
  rationale: यह एक गंभीर भविष्यद्वाणी-संबंधी घोषणा का सूत्र है। ‘देख’ उसके ध्यानाकर्षक बल को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: אֵלֶיךָ
  choice: तेरे विरुद्ध
  rationale: न्याय के प्रसंग में הִנְנִי के साथ यह केवल दिशा नहीं, बल्कि विरोध व्यक्त करता है।
- source_word: זָדוֹן
  choice: अभिमानी
  rationale: यह संज्ञा दुष्ट अहंकार या धृष्टता को व्यक्त करती है और यहाँ मानवीकृत बाबेल के संबोधन के रूप में प्रयुक्त है। ‘अभिमानी’ आधुनिक हिन्दी में नैतिक दोष को स्पष्ट रखता है।
- source_word: נְאֻם
  choice: की यह वाणी है
  rationale: यह अधिकारपूर्ण ईश्वरीय घोषणा का प्रचलित भविष्यद्वाणी-सूत्र है; हिन्दी में ‘वाणी’ उसकी गरिमा और कथन-स्वरूप दोनों को व्यक्त करती है।
- source_word: אֲדֹנָי יְהוִה צְבָאוֹת
  choice: प्रभु याहवे, सेनाओं के स्वामी
  rationale: ‘प्रभु’ אֲדֹנָי को, ‘याहवे’ ईश्वरीय नाम יהוה को, और ‘सेनाओं के स्वामी’ צְבָאוֹת के अधिकार-संबंधी अर्थ को व्यक्त करता है। इससे मूल पदवी के सभी अंग बने रहते हैं।
- source_word: בָּא יוֹמְךָ
  choice: तेरा दिन आ पहुँचा है
  rationale: पूर्ण क्रिया नियुक्त दिन को निश्चित और उपस्थित बताती है। ‘आ पहुँचा है’ इस पूर्णता और तात्कालिकता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עֵת
  choice: वह समय
  rationale: यह न्याय के विशिष्ट अवसर को सूचित करता है और पिछले खंड में आए ‘दिन’ का स्पष्टीकरण करता है।
- source_word: פְּקַדְתִּיךָ
  choice: मैं तुझसे लेखा लूँगा
  rationale: פקד का मूल अर्थ ध्यान देने या भेंट करने तक व्यापक है, पर न्याय के इस प्रसंग में इसका भाव दंड देने अथवा उत्तरदायी ठहराने का है। ‘लेखा लूँगा’ न्यायिक भाव को स्पष्ट रखते हुए मूल की अर्थ-व्याप्ति को ‘दंड दूँगा’ की अपेक्षा कुछ अधिक सुरक्षित रखता है।
theological_decisions:
- issue: अֲדֹנָי יְהוִה צְבָאוֹת में ईश्वरीय नाम और संयुक्त पदवी का अनुवाद
  choice: प्रभु याहवे, सेनाओं के स्वामी
  alternative: प्रभु परमेश्वर, सेनाओं के यहोवा; सेनाओं के प्रभु याहवे
  rationale: मूल में יהוה व्यक्तिगत ईश्वरीय नाम है, इसलिए उसे ‘याहवे’ के रूप में रखा गया है। साथ ही אֲדֹנָי और צְבָאוֹת को अलग-अलग व्यक्त करने से पदवी का कोई अंग लुप्त नहीं होता और अतिरिक्त ‘परमेश्वर’ जोड़ने से बचा जाता है।
- issue: פְּקַדְתִּיךָ में ईश्वरीय न्याय का स्वरूप
  choice: मैं तुझसे लेखा लूँगा
  alternative: मैं तुझे दंड दूँगा; मैं तेरी सुधि लूँगा
  rationale: प्रसंग स्पष्टतः बाबेल के न्याय का है, फिर भी פקד का शाब्दिक अर्थ केवल ‘दंड देना’ नहीं है। ‘लेखा लेना’ उत्तरदायित्व और न्याय दोनों को व्यक्त करता है तथा मूल की व्यापकता को पूरी तरह संकुचित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक पाठ के अनुकूल रखी गई है। बाबेल के मानवीकरण के कारण एकवचन आत्मीय संबोधन ‘तेरे/तुझसे’ रखा गया है। उद्धरण-विन्यास से ईश्वरीय वाणी और वक्ता-सूत्र स्पष्ट होते हैं।
