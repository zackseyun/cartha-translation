language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: עִרְכ֨וּ עַל בָּבֶ֤ל סָבִיב֙ כָּל דֹּ֣רְכֵי קֶ֔שֶׁת יְד֣וּ אֵלֶ֔י/הָ אַֽל תַּחְמְל֖וּ אֶל חֵ֑ץ כִּ֥י לַֽ/יהוָ֖ה חָטָֽאָה־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/014.yaml
  text: Draw up against Babylon all around, all you who bend the bow; shoot at her; do not spare an arrow, for she has sinned against Yahweh.
translation:
  language: hi
  text: हे धनुष चलानेवालो, तुम सब बाबुल को चारों ओर से घेरकर मोर्चा बाँधो। उस पर तीर चलाओ; एक भी तीर मत बचाओ, क्योंकि उसने याहवे के विरुद्ध पाप किया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עִרְכוּ עַל בָּבֶל סָבִיב
  choice: बाबुल के विरुद्ध चारों ओर मोर्चा बाँधो
  rationale: ערך का यह बहुवचन आज्ञार्थक रूप सैन्य-संदर्भ में युद्ध के लिए पंक्ति बाँधने या मोर्चा लेने का निर्देश देता है। 'चारों ओर' סָבִיב के घेराबंदी-संबंधी भाव को स्पष्ट रखता है।
- source_word: כָּל דֹּרְכֵי קֶשֶׁת
  choice: हे धनुष खींचनेवालो, तुम सब
  rationale: शाब्दिक चित्र 'धनुष को पाँव से दबाने/मोड़नेवाले' धनुर्धरों के लिए मुहावरा है। 'धनुष खींचनेवाले' मूल चित्र को पर्याप्त रूप से बचाते हुए सहज आधुनिक हिन्दी है।
- source_word: יְדוּ אֵלֶיהָ
  choice: उस पर तीर चलाओ
  rationale: ידה का हिफ़ील रूप यहाँ धनुर्विद्या के संदर्भ में तीर चलाने का अर्थ देता है। बाबुल लक्ष्य है; हिन्दी में 'उस पर' स्वाभाविक है।
- source_word: אַל תַּחְמְלוּ אֶל חֵץ
  choice: एक भी तीर मत बचाओ
  rationale: חמל यहाँ किसी तीर को रोक रखने या बचाने से मना करता है। एकवचन חֵץ को नकारात्मक वाक्य में 'एक भी तीर' कहना मूल के पूर्ण निषेध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כִּי לַיהוָה חָטָאָה
  choice: क्योंकि उसने याहवे के विरुद्ध पाप किया है
  rationale: חטא के साथ ל उस व्यक्ति को चिह्नित करता है जिसके विरुद्ध पाप हुआ। पूर्ण क्रिया के लिए 'पाप किया है' वर्तमान न्यायादेश की पृष्ठभूमि में उपयुक्त है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में वाचा का विशिष्ट नाम יהוה है। लिप्यंतरण 'याहवे' उस नाम को सामान्य उपाधि में बदलने के बजाय उसकी विशिष्टता बनाए रखता है।
- issue: बाबुल के पाप का लक्ष्य
  choice: याहवे के विरुद्ध पाप किया है
  alternative: याहवे के प्रति पाप किया है
  rationale: यद्यपि मूल में संबंधबोधक ל है, חטא के साथ यह उस व्यक्ति को बताता है जिसके विरुद्ध अपराध किया गया; इसलिए 'के विरुद्ध' अर्थ को स्पष्ट और बिना धर्मवैज्ञानिक विस्तार के व्यक्त करता है।
- issue: बाबुल का स्त्रीलिंग मानवीकरण
  choice: उस पर… उसने
  alternative: उस नगरी पर… उस नगरी ने
  rationale: इब्रानी में बाबुल के लिए स्त्रीलिंग एकवचन रूप हैं। हिन्दी के सर्वनाम यहाँ व्याकरणिक लिंग को अनावश्यक रूप से निर्धारित नहीं करते, इसलिए मानवीकरण का संदर्भ बना रहता है और पाठ कृत्रिम नहीं होता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और घोषणात्मक रखी गई है। 'मोर्चा बाँधो' सैन्य आदेश की शक्ति देता है, जबकि छोटे आज्ञार्थक वाक्य मूल की तीव्रता बनाए रखते हैं।
