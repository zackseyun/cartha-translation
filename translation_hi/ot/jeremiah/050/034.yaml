base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/034.yaml
  text: Their Redeemer is strong[a]; Yahweh of Armies is his name. He will surely plead their case[d][c][b], so that he may give rest to the earth and bring unrest to the inhabitants of Babylon.
translation:
  language: hi
  text: उनका छुड़ानेवाला शक्तिशाली है[a]; उसका नाम सेनाओं के याहवे है[b]। वह निश्चय ही उनका मुक़दमा लड़ेगा[c], ताकि वह पृथ्वी को विश्राम दे[d] और बाबेल के निवासियों को अशांत कर दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनका निकट संबंधी होकर छुड़ानेवाला शक्तिशाली है।” इब्रानी शब्द में उस संबंधी का पारिवारिक-कानूनी भाव भी है जो अपने रिश्तेदार को छुड़ाता या उसका न्यायोचित अधिकार दिलाता है।
    reason: lexical_alternative
  - marker: b
    text: 'परंपरागत अनुवाद: “सेनाओं के यहोवा” या “सेनाओं के प्रभु।”'
    reason: lexical_alternative
  - marker: c
    text: या, “वह निश्चय ही उनके पक्ष में संघर्ष करेगा।” इब्रानी में न्यायिक विवाद का शब्द बल देने के लिए दोहराया गया है।
    reason: lexical_alternative
  - marker: d
    text: “पृथ्वी” का अनुवाद “देश” या “भूमि” भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: גֹּאֲלָם
  choice: उनका छुड़ानेवाला
  rationale: גאל उस व्यक्ति को दर्शाता है जो किसी संबंधी को छुड़ाता, उसके अधिकार पुनःस्थापित करता या उसका पक्ष लेकर न्याय दिलाता है। ‘छुड़ानेवाला’ सामान्य पाठक के लिए स्वाभाविक है; पारिवारिक-कानूनी आशय पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: חָזָק
  choice: शक्तिशाली
  rationale: यह विशेषण सामर्थ्य या बल बताता है। ‘शक्तिशाली’ आधुनिक हिन्दी में स्पष्ट और इस गंभीर भविष्यद्वाणी-संदर्भ के अनुरूप है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का याहवे
  rationale: יְהוָה को व्यक्तिगत वाचा-नाम ‘याहवे’ के रूप में रखा गया है और צְבָאוֹת का ठोस अर्थ ‘सेनाओं’ से व्यक्त किया गया है।
- source_word: רִיב יָרִיב אֶת רִיבָם
  choice: वह निश्चय ही उनका मुक़दमा लड़ेगा
  rationale: एक ही मूल से बने क्रियारूपों की पुनरुक्ति क्रिया पर बल देती है, जिसे ‘निश्चय ही’ व्यक्त करता है। ריב का न्यायिक-विवाद संबंधी अर्थ ‘मुक़दमा लड़ना’ से सहज हिन्दी में सुरक्षित रहता है।
- source_word: הִרְגִּיעַ אֶת הָאָרֶץ
  choice: पृथ्वी को विश्राम दे
  rationale: हिफ़ील रूप शांत या स्थिर करने का कारण बनना व्यक्त करता है। ‘विश्राम दे’ इस कारक भाव को और अगले खंड के अशांत करने के साथ विरोध को बनाए रखता है।
- source_word: וְהִרְגִּיז לְיֹשְׁבֵי בָבֶל
  choice: बाबेल के निवासियों को अशांत कर दे
  rationale: רגז के कारक रूप में कंपकंपी, व्याकुलता या हलचल उत्पन्न करने का भाव है। ‘अशांत कर दे’ स्वाभाविक हिन्दी में पहले खंड के ‘विश्राम’ के साथ स्पष्ट विरोध रचता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में वाचा का विशिष्ट नाम है; ‘याहवे’ उसे उपाधि में बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- issue: הָאָרֶץ का भौगोलिक विस्तार
  choice: पृथ्वी
  alternative: देश / भूमि
  rationale: शब्द का अर्थ ‘पृथ्वी’ या ‘देश/भूमि’ दोनों हो सकता है। बाबेल के निवासियों के विपरीत व्यापक राहत का संकेत देखते हुए मुख्य पाठ में ‘पृथ्वी’ रखा गया है, पर संकुचित अर्थ पादटिप्पणी में दिया गया है।
- issue: ריב की न्यायिक छवि
  choice: मुक़दमा लड़ेगा
  alternative: उनके पक्ष में संघर्ष करेगा
  rationale: मूल शब्द न्यायिक विवाद और पक्षसमर्थन दोनों का भाव रखता है। ‘मुक़दमा लड़ेगा’ न्यायालयीन छवि को अस्पष्ट किए बिना सामान्य हिन्दी में व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘छुड़ानेवाला’, ‘मुक़दमा लड़ेगा’, ‘विश्राम’ और ‘अशांत’ मूल की उद्धार, न्यायिक विवाद और काव्यात्मक विरोध की छवियों को स्वाभाविक हिन्दी में बनाए रखते हैं।
