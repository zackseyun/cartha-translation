source:
  edition: WLC
  text: ק֥וֹל נָסִ֛ים וּ/פְלֵטִ֖ים מֵ/אֶ֣רֶץ בָּבֶ֑ל לְ/הַגִּ֣יד בְּ/צִיּ֗וֹן אֶת נִקְמַת֙ יְהוָ֣ה אֱלֹהֵ֔י/נוּ נִקְמַ֖ת הֵיכָלֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/028.yaml
  text: The sound of fugitives and escapees from the land of Babylon[a], to declare in Zion the vengeance of Yahweh our God[c][b], the vengeance for his temple.
translation:
  language: hi
  text: बाबेल की भूमि से भागने वालों और बच निकलने वालों की आवाज़[a] सुनाई देती है; वे सिय्योन में हमारे परमेश्वर याहवे के प्रतिशोध की, उसके मन्दिर के लिए प्रतिशोध की[b], घोषणा करते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “एक पुकार।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ “उसके मन्दिर का प्रतिशोध”; आशय सम्भवतः उसके मन्दिर के साथ किए गए अन्याय का प्रतिशोध है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֥וֹל
  choice: आवाज़ आ रही है
  rationale: קוֹל का अर्थ ‘आवाज़’, ‘ध्वनि’ या ‘पुकार’ हो सकता है। हिन्दी में अपूर्ण नाम-वाक्य को स्वाभाविक बनाने के लिए ‘आ रही है’ जोड़ा गया है, जबकि सुनाई देने का दृश्य सुरक्षित रहता है।
- source_word: נָסִים וּפְלֵטִים
  choice: भागनेवालों और बच निकलनेवालों
  rationale: 'दोनों कृदन्तों का समानान्तर रूप बनाए रखा गया है: पहला पलायन पर और दूसरा सफलतापूर्वक बच निकलने पर बल देता है।'
- source_word: מֵאֶרֶץ בָּבֶל
  choice: बाबेल देश से
  rationale: मूल पाठ के אֶרֶץ ‘देश/भूमि’ को बनाए रखते हुए हिन्दी में संक्षिप्त और स्वाभाविक क्रम अपनाया गया है।
- source_word: לְהַגִּיד בְּצִיּוֹן
  choice: सिय्योन में ... घोषणा करने
  rationale: לְ उपसर्ग उद्देश्य और בְ स्थान व्यक्त करता है; इसलिए घोषणा सिय्योन में की जाती है, केवल सिय्योन की ओर नहीं।
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: हमारे परमेश्वर याहवे
  rationale: व्यक्तिगत ईश्वरीय नाम और प्रथम पुरुष बहुवचन संबंध—‘हमारे परमेश्वर’—दोनों सुरक्षित रखे गए हैं।
- source_word: נִקְמַת הֵיכָלוֹ
  choice: उसके मन्दिर के लिए लिए गए प्रतिशोध
  rationale: 'निर्मित संबंध को कारण अथवा हित के अर्थ में स्वाभाविक हिन्दी दी गई है: मन्दिर के साथ किए गए अन्याय के कारण लिया गया प्रतिशोध। शाब्दिक संरचना पादटिप्पणी में दी गई है।'
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में उपाधि नहीं, चतुरक्षरीय व्यक्तिगत नाम है; ‘याहवे’ उसे नाम के रूप में प्रत्यक्ष रखता है।
- issue: मन्दिर से जुड़े प्रतिशोध का संबंध
  choice: उसके मन्दिर के लिए लिया गया प्रतिशोध
  alternative: उसके मन्दिर का प्रतिशोध
  rationale: निर्मित पदबंध व्याकरणतः संक्षिप्त और कुछ हद तक खुला है। मुख्य पाठ सम्भावित आशय—मन्दिर के साथ किए गए अन्याय का दण्ड—व्यक्त करता है; अधिक शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। भविष्यद्वाणी की श्रव्य और घोषणात्मक छवि बची रहे, इसलिए ‘आवाज़ आ रही है’ और ‘घोषणा’ चुने गए हैं।
