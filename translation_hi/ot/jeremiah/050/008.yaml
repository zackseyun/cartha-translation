source:
  edition: WLC
  text: נֻ֚דוּ מִ/תּ֣וֹךְ בָּבֶ֔ל וּ/מֵ/אֶ֥רֶץ כַּשְׂדִּ֖ים יצאו וִ/הְי֕וּ כְּ/עַתּוּדִ֖ים לִ/פְנֵי צֹֽאן־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/008.yaml
  text: Flee from the midst of Babylon[a], and go out from the land of the Chaldeans; and be like male goats before the flock.
translation:
  language: hi
  text: बाबेल के बीच से भाग निकलो और कसदियों के देश से बाहर निकल जाओ; और झुंड के आगे नर बकरों के समान हो जाओ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֻדוּ
  choice: भाग निकलो
  rationale: यह आज्ञार्थक रूप बाबेल से तत्काल प्रस्थान का आह्वान करता है। ‘भाग निकलो’ प्रसंग की तात्कालिकता और दूर हो जाने, दोनों भावों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִתּוֹךְ בָּבֶל
  choice: बाबेल के बीच से
  rationale: यह पदबंध बाबेल के भीतर से बाहर निकलने पर बल देता है; ‘के बीच से’ मूल बिंब को बनाए रखता है।
- source_word: וּמֵאֶרֶץ כַּשְׂדִּים יצאו
  choice: और कसदियों के देश से बाहर निकल जाओ
  rationale: יצאו का रूप कथनात्मक प्रतीत हो सकता है, पर आज्ञाओं की इस शृंखला में यह आज्ञार्थक बल रखता है। ‘कसदियों का देश’ मूल के जातिवाचक निर्माण को सुरक्षित रखता है।
- source_word: וִהְיוּ כְּעַתּוּדִים
  choice: नर बकरों के समान हो जाओ
  rationale: עַתּוּדִים नर बकरों को सूचित करता है, मेढ़ों को नहीं। ‘नर बकरे’ आधुनिक हिन्दी में स्पष्ट और सटीक है।
- source_word: לִפְנֵי צֹאן
  choice: झुंड के आगे चलनेवाले
  rationale: לִפְנֵי का मूल अर्थ ‘के सामने/आगे’ है। प्रसंग में नर बकरों का झुंड के आगे बढ़ना अभिप्रेत है; ‘आगे चलनेवाले’ चित्र को सहज बनाता है, जबकि पादटिप्पणी अधिक शाब्दिक रूप देती है।
theological_decisions:
- issue: नर बकरों की उपमा में नेतृत्व का भाव
  choice: मुख्य पाठ में ‘झुंड के आगे चलनेवाले’
  alternative: ‘झुंड के आगे नर बकरों के समान’
  rationale: मूल पाठ स्पष्ट रूप से ‘नेतृत्व’ का अमूर्त शब्द नहीं कहता, बल्कि स्थानगत बिंब देता है। इसलिए मुख्य पाठ क्रियात्मक बिंब को स्पष्ट करता है और पादटिप्पणी अधिक शाब्दिक विकल्प सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘बाबेल’ और ‘कसदी’ हिन्दी बाइबलीय प्रयोग में परिचित नाम हैं। आज्ञाओं की तात्कालिकता बनाए रखने के लिए ‘भाग निकलो’ और ‘बाहर निकल जाओ’ प्रयुक्त हैं।
