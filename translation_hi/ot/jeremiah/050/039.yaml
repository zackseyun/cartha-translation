  text: לָ/כֵ֗ן יֵשְׁב֤וּ צִיִּים֙ אֶת אִיִּ֔ים וְ/יָ֥שְׁבוּ בָ֖/הּ בְּנ֣וֹת יַֽעֲנָ֑ה וְ/לֹֽא תֵשֵׁ֥ב עוֹד֙ לָ/נֶ֔צַח וְ/לֹ֥א תִשְׁכּ֖וֹן עַד דּ֥וֹר וָ/דֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/039.yaml
  text: Therefore desert creatures will dwell there with hyenas[a], and ostriches will dwell in her; she will never again be inhabited forever[c][b], nor will she be lived in from generation to generation.
translation:
  language: hi
  text: इसलिए मरुभूमि के जीव वहाँ लकड़बग्घों[a] के साथ बसेंगे, और शुतुरमुर्ग[b] उसमें निवास करेंगे; वह सदा के लिए फिर कभी आबाद न होगी[c], और पीढ़ी-दर-पीढ़ी उसमें कोई न बसेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सियारों’ अथवा ‘हाहाकार करने वाले जीवों’। इन इब्रानी मरुस्थलीय प्राणियों की ठीक-ठीक पहचान अनिश्चित है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘शुतुरमुर्ग की बेटियाँ’, अर्थात शुतुरमुर्ग। कुछ पुराने अनुवादों में इसे ‘उल्लू’ कहा गया है।
    reason: lexical_alternative
  - marker: c
    text: 'इब्रानी में नगर को स्त्री के रूप में प्रस्तुत किया गया है: ‘उसमें’ और ‘वह आबाद न होगी’।'
    reason: cultural_note
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह बाबेल पर घोषित न्याय के परिणाम का परिचय देने वाला सामान्य निष्कर्षसूचक शब्द है।
- source_word: צִיִּים
  choice: मरुभूमि के जीव
  rationale: यह उजाड़ या मरुस्थलीय स्थानों से जुड़े जीवों के लिए प्रयुक्त होता है; प्राणी की सटीक पहचान अनिश्चित होने के कारण व्यापक अभिव्यक्ति रखी गई है।
- source_word: אֶת
  choice: के साथ
  rationale: यहाँ यह प्रत्यक्ष कर्म-चिह्न नहीं, बल्कि दो प्रकार के मरुस्थलीय जीवों को जोड़ने वाला साहचर्यसूचक प्रयोग है।
- source_word: אִיִּים
  choice: लकड़बग्घों
  rationale: शब्द संभवतः खंडहरों में रहने वाले जंगली, आवाज़ करने वाले या मृतभक्षी जीवों को दर्शाता है। मुख्य पाठ में एक प्रचलित संभावना रखी गई है और अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: בְּנוֹת יַעֲנָה
  choice: शुतुरमुर्ग
  rationale: शाब्दिक अर्थ ‘शुतुरमुर्ग की बेटियाँ’ है, पर यह इब्रानी मुहावरा शुतुरमुर्गों के लिए प्रयुक्त होता है।
- source_word: בָהּ
  choice: उसमें
  rationale: स्त्रीलिंग एकवचन प्रत्यय बाबेल नगरी की ओर संकेत करता है। स्वाभाविक हिन्दी में ‘उसमें’ रखा गया है, जबकि आगे ‘आबाद न होगी’ नगर के स्त्रीलिंग व्यक्तिकरण को बनाए रखता है।
- source_word: לֹא תֵשֵׁב עוֹד לָנֶצַח
  choice: वह फिर कभी, सदा के लिए, आबाद न होगी
  rationale: ‘फिर कभी नहीं’ और ‘सदा के लिए’ दोनों बलसूचक काल-वाक्यांशों को बनाए रखा गया है, यद्यपि उनकी संयुक्त अभिव्यक्ति हिन्दी में भी जानबूझकर प्रबल है।
- source_word: לֹא תִשְׁכּוֹן
  choice: उसमें कोई न बसेगा
  rationale: इब्रानी क्रिया ‘बसना/निवास करना’ का स्वाभाविक हिन्दी रूप है; निषेध का आशय है कि वहाँ कोई निवासी नहीं रहेगा।
- source_word: עַד דּוֹר וָדוֹר
  choice: पीढ़ी-दर-पीढ़ी
  rationale: लगातार आने वाली पीढ़ियों तक स्थायी दशा को व्यक्त करने वाला स्वाभाविक हिन्दी मुहावरा है।
