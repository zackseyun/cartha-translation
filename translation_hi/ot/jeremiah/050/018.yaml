source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּֽה אָמַ֞ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הִנְ/נִ֥י פֹקֵ֛ד אֶל מֶ֥לֶךְ בָּבֶ֖ל וְ/אֶל אַרְצ֑/וֹ כַּ/אֲשֶׁ֥ר פָּקַ֖דְתִּי אֶל מֶ֥לֶךְ אַשּֽׁוּר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/018.yaml
  text: 'Therefore thus says Yahweh of hosts[a], the God of Israel: Behold, I am about to punish the king of Babylon and his land, just as I punished the king of Assyria.'
translation:
  language: hi
  text: 'इसलिए सेनाओं का याहवे[a], इस्राएल का परमेश्वर, यह कहता है: “देखो, मैं बाबेल के राजा और उसके देश को दण्ड देने वाला हूँ, ठीक वैसे ही जैसे मैंने अश्शूर के राजा को दण्ड दिया था।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं बाबेल के राजा और उसके देश का लेखा लेने वाला हूँ ... जैसे मैंने अश्शूर के राजा का लेखा लिया था।” इब्रानी क्रिया פקד का अर्थ “भेंट करना,” “ध्यान देना,” या “लेखा लेना” भी हो सकता है; यहाँ न्याय के संदर्भ में इसका दण्डात्मक अर्थ है।
    reason: इब्रानी פקד के व्यापक अर्थ-क्षेत्र को सुरक्षित रखते हुए संदर्भानुकूल ‘दण्ड देना’ का कारण स्पष्ट करना।
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले संदर्भ से निकलने वाले निष्कर्ष को स्वाभाविक और स्पष्ट ढंग से व्यक्त करता है।
- source_word: כֹּה אָמַר
  choice: यह कहता है
  rationale: यह भविष्यद्वाणी के संदेशवाहक-सूत्र का आधुनिक, गरिमापूर्ण और सहज हिन्दी रूप है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का यहोवा
  rationale: व्यक्तिगत दिव्य नाम को सुरक्षित रखते हुए צְבָאוֹת के व्यापक सैन्य/स्वर्गीय समूहवाचक भाव को व्यक्त करता है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल का परमेश्वर
  rationale: इब्रानी संबंधवाचक पदबंध का सीधा और स्वाभाविक अनुवाद।
- source_word: הִנְנִי
  choice: देखो, मैं ... देने वाला हूँ
  rationale: ध्यान आकर्षित करने वाले הִנֵּה और आसन्न दैवी कार्य के भाव, दोनों को व्यक्त करता है।
- source_word: פֹקֵד / פָּקַדְתִּי
  choice: दण्ड देने वाला हूँ / दण्ड दिया था
  rationale: न्याय के इस प्रसंग में פקד का अर्थ दण्डात्मक हस्तक्षेप है; दोनों प्रयोगों में समान अर्थ रखा गया है।
- source_word: מֶלֶךְ בָּבֶל
  choice: बाबेल के राजा
  rationale: इब्रानी संबंधवाचक संरचना का सीधा रूप।
- source_word: אַרְצוֹ
  choice: उसके देश
  rationale: यहाँ אֶרֶץ राजा के अधीन भूभाग अथवा राज्य को सूचित करता है; आधुनिक हिन्दी में ‘देश’ स्पष्ट है।
- source_word: כַּאֲשֶׁר
  choice: ठीक वैसे ही जैसे
  rationale: बाबेल के आगामी दण्ड और अश्शूर के पूर्व दण्ड के बीच स्पष्ट तुलना व्यक्त करता है।
- source_word: מֶלֶךְ אַשּׁוּר
  choice: अश्शूर के राजा
  rationale: प्राचीन साम्राज्य के नाम का प्रचलित हिन्दी बाइबलीय रूप रखते हुए पदबंध का सीधा अनुवाद।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत दिव्य नाम को किसी उपाधि से प्रतिस्थापित नहीं किया गया; सामान्य हिन्दी पाठकों में पहचाने जाने वाले ‘यहोवा’ रूप को रखा गया है।
- issue: न्याय-संदर्भ में פקד का अर्थ
  choice: दण्ड देना
  alternative: सुधि लेना / लेखा लेना
  rationale: बाबेल और अश्शूर पर न्याय के समानांतर संदर्भ में दण्डात्मक अर्थ प्रमुख है, पर मूल क्रिया की व्यापकता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण भविष्यद्वाणी शैली। वाक्य को सहज बनाने के लिए ‘इसलिए’ और ‘देखो’ रखा गया है; न्याय-संदर्भ में פקד को मुख्य पाठ में स्पष्ट रूप से ‘दण्ड देना’ कहा गया है।
