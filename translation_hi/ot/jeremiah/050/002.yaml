  text: הַגִּ֨ידוּ בַ/גּוֹיִ֤ם וְ/הַשְׁמִ֨יעוּ֙ וּֽ/שְׂאוּ נֵ֔ס הַשְׁמִ֖יעוּ אַל תְּכַחֵ֑דוּ אִמְרוּ֩ נִלְכְּדָ֨ה בָבֶ֜ל הֹבִ֥ישׁ בֵּל֙ חַ֣ת מְרֹדָ֔ךְ הֹבִ֣ישׁוּ עֲצַבֶּ֔י/הָ חַ֖תּוּ גִּלּוּלֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/002.yaml
  text: Declare among the nations and proclaim[a]; lift up a banner. Proclaim; do not hide it. Say, “Babylon is captured; Bel is put to shame; Merodach is shattered. Her images are put to shame[b]; her idols are shattered.”
translation:
  language: hi
  text: राष्ट्रों के बीच घोषणा करो और सुनाओ; ध्वज ऊँचा उठाओ। सुनाओ, इसे मत छिपाओ। कहो, “बाबुल पर अधिकार कर लिया गया है; बेल लज्जित हुआ है; मरोदक[a] भयभीत हो गया है। उसकी प्रतिमाएँ लज्जित हुई हैं; उसकी घिनौनी मूर्तियाँ[b] भयभीत हो गई हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मरोदक’ बाबुली देवता के नाम का इब्रानी रूप है; इसे अधिक सामान्यतः ‘मारदुक’ कहा जाता है।
    reason: alternative_reading
  - marker: b
    text: यहाँ प्रयुक्त इब्रानी शब्द मूर्तियों के लिए अत्यंत तिरस्कारपूर्ण है और उसमें घृणित या गंदी वस्तु होने का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּידוּ בַגּוֹיִם
  choice: जाति-जाति में घोषणा करो
  rationale: नגד का हिफ़ील आज्ञार्थ सार्वजनिक रूप से समाचार घोषित करने का भाव देता है; בַגּוֹיִם का आशय विदेशी राष्ट्रों के बीच व्यापक घोषणा से है।
- source_word: וְהַשְׁמִיעוּ / הַשְׁמִיעוּ
  choice: और सुनाओ / सुनाओ
  rationale: שׁמע का हिफ़ील संदेश को लोगों तक पहुँचाने या सुनाने का भाव रखता है। मूल की पुनरावृत्ति बनाए रखी गई है।
- source_word: וּשְׂאוּ נֵס
  choice: झंडा खड़ा करो
  rationale: נֵס सार्वजनिक या सैनिक संकेत के लिए ऊँचा किया जाने वाला ध्वज अथवा निशान है; यह प्रयोग आधुनिक हिन्दी में स्वाभाविक और चित्रात्मक है।
- source_word: אַל תְּכַחֵדוּ
  choice: इसे मत छिपाओ
  rationale: כחד का पिएल रूप सूचना को छिपाने या दबाने का निषेध करता है। हिन्दी में कर्म स्पष्ट करने के लिए ‘इसे’ स्वाभाविक रूप से जोड़ा गया है।
- source_word: נִלְכְּדָה בָבֶל
  choice: बाबुल पर अधिकार कर लिया गया है
  rationale: לכד का निफ़अल पूर्ण रूप नगर के पकड़े या जीत लिए जाने की घोषणा करता है; हिन्दी में यह निष्क्रिय परिणाम स्पष्ट करता है।
- source_word: הֹבִישׁ / הֹבִישׁוּ
  choice: लज्जित हुआ है / लज्जित हुई हैं
  rationale: בוש का हिफ़ील यहाँ अपमानित या लज्जित दशा में पहुँचने का परिणाम व्यक्त करता है।
- source_word: בֵּל
  choice: बेल
  rationale: बाबुली देवता के इब्रानी नाम का देवनागरी लिप्यंतरण।
- source_word: חַת / חַתּוּ
  choice: घबरा गया है / घबरा गई हैं
  rationale: חתת इन रूपों में भयभीत, आतंकित या घबराई हुई दशा व्यक्त कर सकता है। ‘चकनाचूर’ भौतिक टूटने का अर्थ अनावश्यक रूप से निश्चित कर देता; ‘घबरा गया’ मूल की अवस्थात्मक क्रिया और उसकी संभावित अर्थ-सीमा को बेहतर बचाता है।
- source_word: מְרֹדָךְ
  choice: मरोदक
  rationale: इब्रानी रूप מְרֹדָךְ का हिन्दी लिप्यंतरण; अधिक प्रचलित अक्कादी नाम ‘मारदुक’ से इसकी पहचान टिप्पणी में दी जा सकती है।
- source_word: עֲצַבֶּיהָ
  choice: उसकी प्रतिमाएँ
  rationale: עֲצַבִּים गढ़ी हुई देव-प्रतिमाओं को सूचित करता है; साथ आए अधिक निंदात्मक גִּלּוּלִים से शब्दगत भेद रखा गया है।
- source_word: גִּלּוּלֶיהָ
  choice: उसकी घिनौनी मूरतें
  rationale: גִּלּוּלִים मूर्तियों के लिए अत्यंत तिरस्कारपूर्ण शब्द है। ‘घिनौनी’ उसके निंदात्मक बल को मुख्य पाठ में व्यक्त करता है।
theological_decisions:
- issue: बाबुली देवताओं के नाम
  choice: ‘बेल’ और ‘मरोदक’ के रूप में लिप्यंतरण
  alternative: मुख्य पाठ में उनकी मेसोपोटामियाई पहचान या उपाधियों का अनुवाद करना
  rationale: मूल पाठ की ऐतिहासिक विशिष्टता बनाए रखने के लिए नामों का लिप्यंतरण किया गया है; व्याख्यात्मक पहचान मुख्य पाठ पर आरोपित नहीं की गई।
- issue: חתת का अर्थ
  choice: ‘घबरा गया/गई हैं’
  alternative: ‘चकनाचूर हो गया/गई हैं’
  rationale: धातु भय, आतंक, हताशा या टूट जाने की दशा बता सकती है। इस वाक्य में व्याकरणिक रूप अवस्थात्मक है और समानांतर ‘लज्जित’ के साथ ‘घबरा गया’ अधिक प्रत्यक्ष है; भौतिक विनाश को निश्चित नहीं किया गया।
- issue: मूर्तियों के लिए तिरस्कारपूर्ण शब्दावली
  choice: עֲצַבִּים के लिए ‘प्रतिमाएँ’ और גִּלּוּלִים के लिए ‘घिनौनी मूरतें’
  alternative: दोनों के लिए समान रूप से ‘मूर्तियाँ’ कहना
  rationale: दो अलग इब्रानी शब्दों का अंतर और दूसरे शब्द का प्रबल तिरस्कारपूर्ण भाव सुरक्षित रखा गया है, बिना किसी सम्प्रदायगत व्याख्या के।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण घोषणात्मक शैली। मूल के छोटे आज्ञार्थ वाक्य और ‘सुनाओ’ की पुनरावृत्ति सुरक्षित हैं। ‘जाति-जाति’ व्यापक राष्ट्रसमूह को स्वाभाविक हिन्दी में व्यक्त करता है।
