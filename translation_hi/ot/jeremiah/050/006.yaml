  yaml_path: translation/ot/jeremiah/050/006.yaml
  text: My people have been lost sheep[a]; their shepherds have led them astray, turning them away on the mountains. They have gone from mountain to hill[b]; they have forgotten their resting place.
translation:
  language: hi
  text: मेरी प्रजा खोई हुई भेड़ों के समान थी[a]। उनके चरवाहों ने उन्हें भटका दिया; उन्होंने उन्हें पहाड़ों पर भटकाया। वे पहाड़ से पहाड़ी तक गए[b] और अपना विश्राम-स्थान भूल गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “मेरी प्रजा खोई हुई भेड़ें थी; उनके चरवाहों ने उन्हें भटका दिया; पहाड़ों ने उन्हें भटकाया।” यहाँ इब्रानी पदबंध कठिन है।'
    reason: lexical_alternative
  - marker: b
    text: “पहाड़ से पहाड़ी तक” का कथन संभवतः उन ऊँचे स्थानों की ओर भी संकेत करता है जहाँ इस्राएल धर्मत्याग में उपासना करता था; यिर्मयाह में यह एक बार-बार आने वाली छवि है।
    reason: cross_reference
lexical_decisions:
- source_word: צֹאן אֹבְדוֹת
  choice: खोई हुई भेड़ें
  rationale: צֹאן सामूहिक रूप से भेड़-बकरियों या झुंड को दर्शा सकता है, पर स्त्रीलिंग बहुवचन אֹבְדוֹת और चरवाही के पूरे रूपक के कारण ‘खोई हुई भेड़ें’ स्वाभाविक और सटीक है। אבד यहाँ अंतिम विनाश की अपेक्षा खो जाने की दशा पर बल देता है।
- source_word: עַמִּי
  choice: मेरे लोग
  rationale: यह परमेश्वर द्वारा अपनी वाचा की प्रजा के लिए प्रयुक्त सीधा संबोधन है। ‘मेरे लोग’ आधुनिक हिन्दी में स्वाभाविक है और आगे आने वाले बहुवचन क्रियापदों से मेल खाता है।
- source_word: רֹעֵיהֶם
  choice: उनके चरवाहों
  rationale: शाब्दिक चरवाही का रूपक बनाए रखा गया है; केवल ‘अगुओं’ कहना यिर्मयाह की जानबूझकर प्रयुक्त छवि को सपाट कर देता।
- source_word: הִתְעוּם
  choice: उन्हें भटका दिया
  rationale: 'תעה का हिफ़ील रूप कारणवाचक है: चरवाहों ने लोगों को भटकने का कारण बनाया। यह अनुवाद उनकी उत्तरदायित्वपूर्ण भूमिका स्पष्ट रखता है।'
- source_word: הָרִים שובבים
  choice: पहाड़ों पर इधर-उधर भटकाते रहे
  rationale: यह इब्रानी पदबंध व्याकरण की दृष्टि से कठिन है। मुख्य पाठ में प्रसंगानुकूल अर्थ रखा गया है कि चरवाहों के कारण भेड़ें पहाड़ों पर दिशाहीन घूमती रहीं; अधिक औपचारिक संभावना पादटिप्पणी में सुरक्षित है।
- source_word: מֵהַר אֶל גִּבְעָה
  choice: पहाड़ से पहाड़ी तक
  rationale: यह लगातार और दिशाहीन आवागमन की छवि को संक्षिप्त रूप से बनाए रखता है, जबकि ऊँचे पूजा-स्थानों की संभावित अनुगूँज को मुख्य पाठ में स्पष्ट व्याख्या नहीं बनाता।
- source_word: הָלָכוּ
  choice: जाते रहे
  rationale: मूल क्रिया का सामान्य अर्थ ‘गए/चले’ है। ‘जाते रहे’ आसपास के प्रसंग में निरंतर भटकाव का भाव आने देता है, बिना क्रिया में ही ‘भटकना’ दोबारा जोड़ने के।
- source_word: רִבְצָם
  choice: अपना विश्राम-स्थान
  rationale: רבץ से बना यह शब्द पशुओं के लेटने और विश्राम करने की जगह बताता है। ‘विश्राम-स्थान’ चरवाही की छवि बचाता है और ‘बाड़े’ या ‘चरागाह’ जैसी अनावश्यक विशिष्टता से बचता है।
theological_decisions:
- issue: पहाड़ और पहाड़ी में मूर्तिपूजक ऊँचे स्थानों की संभावित अनुगूँज
  choice: मुख्य पाठ में भौगोलिक और चरवाही की भाषा को यथावत रखना
  alternative: अनुवाद में सीधे मूर्तिपूजक ऊँचे स्थानों का उल्लेख करना
  rationale: यिर्मयाह में पहाड़ और पहाड़ियाँ धर्मत्याग से जुड़ सकते हैं, पर इस पद की प्रत्यक्ष छवि चरवाहों द्वारा भटकाई गई भेड़ों की है। इसलिए संभावित धार्मिक संकेत को पादटिप्पणी में रखा गया है, मुख्य पाठ में निश्चित अर्थ बनाकर नहीं जोड़ा गया।
- issue: कठिन पदबंध הָרִים שובבים का संबंध और अर्थ
  choice: इसे प्रसंग में चरवाहों द्वारा पहाड़ों पर कराए गए दिशाहीन भटकाव के रूप में व्यक्त करना
  alternative: ‘भटकाने वाले/विमुख करने वाले पहाड़’ जैसा अधिक औपचारिक संबंध
  rationale: שובבים का रूप הָרִים के साथ विशेषणवत जुड़ सकता है, पर परिणामी वाक्य हिन्दी में अस्पष्ट होगा। चुना गया पाठ समानांतर पंक्तियों के प्रवाह को व्यक्त करता है; औपचारिक अनिश्चितता पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘मेरे लोग’ साधारण पाठक के लिए स्वाभाविक है और मूल के बहुवचन संदर्भ को बनाए रखता है। चरवाही का रूपक पूरे पद में सुरक्षित है; कठिन इब्रानी वाक्यरचना और ऊँचे स्थानों की संभावित धार्मिक अनुगूँज को पादटिप्पणियों में रखा गया है।
