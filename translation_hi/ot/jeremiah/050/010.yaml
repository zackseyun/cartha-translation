base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/010.yaml
  text: And Chaldea will become plunder[a]; all who plunder her will have their fill[b], declares Yahweh.
translation:
  language: hi
  text: और कसदियों का देश लूट का माल बन जाएगा[a]; उसे लूटने वाले सभी तृप्त हो जाएँगे[b]—यह याहवे की घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कसदी लोग”; हिब्रू रूप बहुवचन है, पर आगे आया “उसे” यहाँ उनके देश या राज्य की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: या “संतुष्ट हो जाएँगे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: और ... बन जाएगा
  rationale: भविष्यसूचक कथन में संयोजक सहित पूर्ण क्रिया भावी परिणाम व्यक्त करती है; ‘बन जाएगा’ अवस्था-परिवर्तन को स्पष्ट रखता है।
- source_word: כַשְׂדִּים
  choice: कसदियों का देश
  rationale: रूप व्याकरणतः बहुवचन है, पर आगे का स्त्रीलिंग एकवचन प्रत्यय और लूट के संदर्भ से यहाँ देश अथवा राज्य अभिप्रेत है। ‘कसदियों का देश’ आधुनिक हिन्दी में अर्थ स्पष्ट करता है और जातिनाम से संबंध बनाए रखता है।
- source_word: לְשָׁלָל
  choice: लूट का माल
  rationale: यह सैनिक लूट में हाथ आए धन-सामान को दर्शाता है; आधुनिक हिन्दी में ‘लूट का माल’ स्वाभाविक और स्पष्ट है।
- source_word: כָּל שֹׁלְלֶיהָ
  choice: उसे लूटनेवाले सब
  rationale: कृदंत लूट करनेवाले व्यक्तियों को सूचित करता है और स्त्रीलिंग प्रत्यय पूर्वोक्त देश की ओर संकेत करता है। वाक्यांश हिब्रू के व्यापक ‘सब’ और सक्रिय अर्थ दोनों को बनाए रखता है।
- source_word: יִשְׂבָּעוּ
  choice: भरपूर पाएँगे
  rationale: मूल क्रिया का अर्थ भर जाना अथवा तृप्त होना है। लूट के प्रसंग में ‘भरपूर पाएँगे’ प्रचुर लाभ का स्वाभाविक हिन्दी बोध देता है, जबकि पादटिप्पणी अधिक शाब्दिक विकल्प सुरक्षित रखती है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: यह मानक भविष्यसूचक उद्घोषणा-सूत्र है। ‘याहवे’ मूल निजी दिव्य नाम को प्रत्यक्ष रूप में रखता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला दिव्य नाम प्रत्यक्ष है। ‘याहवे’ उसका प्रचलित विद्वत्तापरक लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज भविष्यसूचक शैली अपनाई गई है। ‘कसदियों का देश’ अस्पष्ट जातिनाम को संदर्भानुसार स्पष्ट करता है; पादटिप्पणी मूल बहुवचन विकल्प को सुरक्षित रखती है।
