id: JER.50.4
reference: Jeremiah 50:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בַּ/יָּמִ֨ים הָ/הֵ֜מָּה וּ/בָ/עֵ֤ת הַ/הִיא֙ נְאֻם יְהוָ֔ה יָבֹ֧אוּ בְנֵֽי יִשְׂרָאֵ֛ל הֵ֥מָּה וּ/בְנֵֽי יְהוּדָ֖ה יַחְדָּ֑ו הָל֤וֹךְ וּ/בָכוֹ֙ יֵלֵ֔כוּ וְ/אֶת יְהוָ֥ה אֱלֹהֵי/הֶ֖ם יְבַקֵּֽשׁוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/004.yaml
  text: In those days and at that time[a], declares Yahweh, the children of Israel will come, they and the children of Judah together. Going and weeping, they will go[b], and they will seek Yahweh their God.
translation:
  language: hi
  text: “उन दिनों और उसी समय,” यहोवा की यह वाणी है, “इस्राएल की सन्तान और उनके साथ यहूदा की सन्तान, दोनों एक साथ आएँगे। वे रोते हुए चलते जाएँगे[a] और अपने परमेश्वर यहोवा को खोजेंगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में ‘जाने/चलने’ का विचार दोहराया गया है; शब्दशः: ‘चलते और रोते हुए वे चलते जाएँगे।’ यह आँसुओं के साथ जारी यात्रा को व्यक्त करता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵמָּה וּבָעֵת הַהִיא
  choice: उन दिनों और उसी समय
  rationale: इब्रानी की दोहरी काल-सूचना को बिना समेटे स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: נְאֻם יְהוָה
  choice: यहोवा की यह वाणी है
  rationale: यह भविष्यद्वाणी का प्रामाणिक उद्घोष-सूत्र है; 'वाणी' נְאֻם की औपचारिक गंभीरता व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार-अक्षरीय ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नामरूप से व्यक्त किया गया है।
- source_word: בְנֵי יִשְׂרָאֵל ... וּבְנֵי יְהוּדָה
  choice: इस्राएल की सन्तान ... यहूदा की सन्तान
  rationale: בְנֵי के पारिवारिक और सामूहिक बिंब को बनाए रखते हुए दोनों समुदायों का पृथक उल्लेख सुरक्षित रखा गया है।
- source_word: הֵמָּה ... יַחְדָּו
  choice: और उनके साथ ... दोनों एक साथ
  rationale: हिब्रू के पुनरुक्त/बलसूचक सर्वनाम को सहज हिन्दी संरचना में व्यक्त किया गया है और दोनों समूहों के संयुक्त आने पर बल रखा गया है।
- source_word: הָלוֹךְ וּבָכוֹ יֵלֵכוּ
  choice: वे रोते हुए चलते जाएँगे
  rationale: इन्फिनिटिव एब्सोल्यूट और सीमित क्रिया से व्यक्त निरंतर गति तथा उसके साथ चलने वाले रोने को स्वाभाविक हिन्दी में रखा गया है; शाब्दिक पुनरावृत्ति पादटिप्पणी में दी गई है।
- source_word: וְאֶת יְהוָה אֱלֹהֵיהֶם יְבַקֵּשׁוּ
  choice: और अपने परमेश्वर यहोवा को खोजेंगे
  rationale: בקשׁ के खोजने/ओर मुड़ने के अर्थ को संक्षिप्त रखा गया है और सम्बन्धवाचक 'अपने परमेश्वर' से वाचा-संबंध की भाषा बनी रहती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में व्यक्तिगत वाचा-नाम है; उसे सामान्य उपाधि में बदलने के बजाय हिन्दी में परिचित नामरूप दिया गया है।
- issue: इस्राएल और यहूदा की संयुक्त पुनर्स्थापना
  choice: दोनों समूहों को अलग-अलग नाम देकर उनके एक साथ आने को स्पष्ट रखना
  alternative: सभी इस्राएली
  rationale: मूल पाठ दोनों को पृथक नाम देता है और उनके मेल पर बल देता है; किसी बाद की धार्मिक पहचान से इसकी व्याख्या नहीं की गई।
- issue: रोते हुए चलने का भाव
  choice: यात्रा के साथ जारी रोना
  alternative: पश्चात्ताप करते हुए आना
  rationale: रोना पश्चात्ताप का संकेत हो सकता है, पर मूल इस पद में उसका कारण स्पष्ट नहीं करता; इसलिए भावार्थ को संप्रदायगत या व्याख्यात्मक रूप से सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी अपनाई गई है। ‘सन्तान’ मूल के पारिवारिक-सामूहिक मुहावरे को बनाए रखता है। उद्धरण-चिह्नों से ‘यहोवा की यह वाणी है’ के बाद आने वाली ईश्वरीय वाणी को स्पष्ट किया गया है।
