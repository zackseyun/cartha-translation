base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/043.yaml
  text: The king of Babylon has heard the report about them[a], and his hands have gone limp; distress has seized him, anguish like a woman in labor.
translation:
  language: hi
  text: बाबेल के राजा ने उनके विषय में समाचार सुना है[a], और उसके हाथ ढीले पड़ गए हैं। संकट ने उसे जकड़ लिया है—ऐसी पीड़ा, जैसी प्रसव-वेदना में स्त्री को होती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनका समाचार।” इब्रानी में इसका अधिक शाब्दिक अर्थ “उनका समाचार” है; प्रसंग में आशय आगे बढ़ती शत्रु-सेना के विषय में मिले समाचार से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע
  choice: सुना है
  rationale: कालगत पूर्णता और उसके वर्तमान परिणाम—समाचार सुनकर राजा का तत्काल भयभीत होना—दोनों व्यक्त होते हैं।
- source_word: מֶלֶךְ בָּבֶל
  choice: बाबेल के राजा
  rationale: इब्रानी संबंध-रचना का स्वाभाविक और स्पष्ट हिन्दी रूप।
- source_word: שִׁמְעָם
  choice: उनके विषय में समाचार
  rationale: שֵׁמַע का अर्थ ‘समाचार/खबर’ है और बहुवचन प्रत्यय यहाँ आने वाली शत्रु-सेना के विषय में सूचना को सूचित करता है; यह अस्पष्टता कि समाचार उनसे आया या उनके विषय में है, पादटिप्पणी में दर्शाई गई है।
- source_word: וְרָפוּ יָדָיו
  choice: उसके हाथ ढीले पड़ गए हैं
  rationale: शक्ति और साहस खो देने के इब्रानी शारीरिक मुहावरे तथा उसके दृश्य बिंब को बनाए रखता है।
- source_word: צָרָה
  choice: संकट
  rationale: बाहरी विपत्ति और उससे उत्पन्न मानसिक घबराहट, दोनों के लिए उपयुक्त सामान्य हिन्दी शब्द।
- source_word: הֶחֱזִיקַתְהוּ
  choice: उसे जकड़ लिया है
  rationale: חזק के हिफ़ील रूप का यहाँ किसी को बलपूर्वक पकड़ लेने या अपने वश में कर लेने का सजीव भाव है।
- source_word: חִיל
  choice: पीड़ा
  rationale: यहाँ ऐंठन, व्याकुलता या प्रसव-जैसी वेदना का अर्थ है; अगली उपमा इसे स्पष्ट करती है।
- source_word: כַּיּוֹלֵדָה
  choice: जैसी प्रसव में पड़ी स्त्री को होती है
  rationale: स्त्रीलिंग कृदंत और तुलना को आधुनिक, सहज हिन्दी में व्यक्त करता है और प्रसव-वेदना का चित्र बनाए रखता है।
