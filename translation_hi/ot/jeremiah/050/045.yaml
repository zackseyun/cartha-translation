- source_word: יַשִּׁים עֲלֵיהֶם נָוֶה
  choice: वह उनकी चरागाह उजाड़ देगा
  rationale: विनाशकारी संदर्भ और समानांतर प्रयोग के अनुरूप वाक्य को स्वाभाविक हिन्दी में दिया गया है; कठिन עֲלֵיהֶם को स्वामित्वसूचक रूप में समझा गया, जबकि वैकल्पिक संबंध टिप्पणी में सुरक्षित है।
