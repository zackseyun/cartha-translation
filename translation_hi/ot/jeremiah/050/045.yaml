  yaml_path: translation/ot/jeremiah/050/045.yaml
  text: 'Therefore hear the counsel of Yahweh that he has planned against Babylon[a], and his thoughts that he has devised against the land of the Chaldeans: Surely the little ones of the flock will drag them away[c][b]; surely he will make their pasture desolate.'
translation:
  language: hi
  text: 'इसलिए याहवे की वह योजना सुनो, जो उसने बाबेल के विरुद्ध बनाई है, और उसके वे विचार भी, जो उसने कसदियों के देश के विरुद्ध सोचे हैं: निश्चय ही झुंड के नन्हे मेम्ने[a] उन्हें घसीट ले जाएँगे; निश्चय ही वह उनके चरागाह[b] को उजाड़ देगा।[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘झुंड के सबसे छोटे जन’। यह रूपक संभवतः बाबेल पर चढ़ाई करने वालों में सबसे कम महत्त्वपूर्ण या कमज़ोर लोगों की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘निवास-स्थान’। इब्रानी शब्द का अर्थ ‘चरागाह’, ‘बाड़ा’ या ‘निवास’ हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: 'अंतिम वाक्यांश का अनुवाद यह भी हो सकता है: ‘वह उनके कारण चरागाह उजाड़ देगा।’ इब्रानी वाक्य-रचना संक्षिप्त और कठिन है।'
    reason: source_ambiguity
