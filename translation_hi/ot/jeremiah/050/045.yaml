- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिगत ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: יָעַץ אֶל־בָּבֶל
  choice: बाबेल के विरुद्ध बनाई है
  rationale: शत्रुतापूर्ण न्याय-संदर्भ में אֶל का आशय ‘के विरुद्ध’ है; हिन्दी में योजना ‘बनाना’ स्वाभाविक है।
- source_word: וּמַחְשְׁבוֹתָיו
  choice: और उसके वे विचार भी
  rationale: ‘विचार’ मूल के मानसिक-विचार/अभिप्राय के भाव को रखता और עֲצָה से शब्दगत भेद बचाता है।
- source_word: חָשַׁב
  choice: किए हैं
  rationale: हिन्दी में ‘विचार करना’ स्वाभाविक है; इससे जानबूझकर सोचे गए अभिप्राय का भाव आता है।
- source_word: אֶרֶץ כַּשְׂדִּים
  choice: कसदियों का देश
  rationale: इब्रानी पदबंध का पारदर्शी रूप है और जातिनाम को बनाए रखता है।
- source_word: אִם לֹא
  choice: निश्चय ही
  rationale: दोनों स्थानों पर यह शपथ-सदृश दृढ़ कथन है, साधारण शर्त नहीं।
