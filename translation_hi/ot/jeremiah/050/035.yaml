source:
  edition: WLC
  text: חֶ֥רֶב עַל כַּשְׂדִּ֖ים נְאֻם יְהוָ֑ה וְ/אֶל יֹשְׁבֵ֣י בָבֶ֔ל וְ/אֶל שָׂרֶ֖י/הָ וְ/אֶל חֲכָמֶֽי/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/035.yaml
  text: A sword is against the Chaldeans[a], declares Yahweh, and against the inhabitants of Babylon, and against her officials[b], and against her wise men.
translation:
  language: hi
  text: कसदियों[a] के विरुद्ध तलवार है—याहवे की यह घोषणा है—और बाबेल के निवासियों के विरुद्ध, उसके अधिकारियों[b] के विरुद्ध और उसके बुद्धिमान लोगों के विरुद्ध।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “कसदियों” के स्थान पर “बाबेलियों” भी अनुवाद किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: “अधिकारियों” के स्थान पर “प्रधानों” या “शासकों” भी अनुवाद किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶרֶב עַל
  choice: पर तलवार है
  rationale: इब्रानी का क्रियारहित भविष्यद्वाणी-सूत्र न्याय और युद्ध के आसन्न प्रहार की घोषणा करता है। हिंदी में यह संक्षिप्त रूप मूल की तीव्रता बनाए रखता है।
- source_word: כַּשְׂדִּים
  choice: कसदियों
  rationale: मूल जातिनाम को बनाए रखा गया है; संदर्भ में ये बाबेल के लोग हैं, जिसे पादटिप्पणी में स्पष्ट किया गया है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: मानक नबूवत-सूत्र की गंभीरता बनाए रखते हुए परमेश्वर के व्यक्तिगत नाम को याहवे रूप में प्रस्तुत किया गया है।
- source_word: יֹשְׁבֵי בָבֶל
  choice: बाबेल के निवासियों
  rationale: शाब्दिक अर्थ 'बाबेल में रहनेवाले' है; 'निवासियों' स्वाभाविक और सामूहिक आधुनिक हिंदी है।
- source_word: שָׂרֶיהָ
  choice: उसके अधिकारियों
  rationale: शब्द शासकीय प्रधानों, हाकिमों या अधिकारियों को सूचित कर सकता है। 'अधिकारियों' आधुनिक संदर्भ में प्रशासनिक-राजनीतिक वर्ग को स्पष्ट करता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: חֲכָמֶיהָ
  choice: उसके बुद्धिमानों
  rationale: यह बाबेल के ज्ञानी और विद्वान परामर्शदाता वर्ग का सीधा संकेत है; 'बुद्धिमानों' मूल की व्यापकता बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे उपस्थित है। लिप्यंतरण 'याहवे' नाम और उपाधि के बीच का भेद बनाए रखता है।
- issue: तलवार के कथन का आशय
  choice: न्याय की प्रत्यक्ष भविष्यद्वाणी के रूप में 'पर तलवार है'
  alternative: तलवार चलेगी; युद्ध होगा
  rationale: मूल में क्रिया नहीं है और 'तलवार' युद्ध तथा हिंसक न्याय का प्रतीक हो सकती है। अनुवाद मूल बिंब को रखता है और उसे केवल सामान्य 'युद्ध' में नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, गंभीर और घोषणात्मक रखी गई है। लंबे समानांतर क्रम को विराम-चिह्नों से स्पष्ट किया गया है; स्त्रीलिंगी बाबेल के इब्रानी सर्वनाम को स्वाभाविक हिंदी में 'उसके' कहा गया है।
