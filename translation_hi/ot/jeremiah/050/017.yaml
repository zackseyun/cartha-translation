source:
  edition: WLC
  text: שֶׂ֧ה פְזוּרָ֛ה יִשְׂרָאֵ֖ל אֲרָי֣וֹת הִדִּ֑יחוּ הָ/רִאשׁ֤וֹן אֲכָל/וֹ֙ מֶ֣לֶךְ אַשּׁ֔וּר וְ/זֶ֤ה הָ/אַחֲרוֹן֙ עִצְּמ֔/וֹ נְבוּכַדְרֶאצַּ֖ר מֶ֥לֶךְ בָּבֶֽל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/017.yaml
  text: Israel is a scattered sheep[a]; lions have driven him away. First the king of Assyria devoured him[c][b], and this last one—Nebuchadnezzar king of Babylon—has gnawed his bones.
translation:
  language: hi
  text: इस्राएल एक बिखरी हुई भेड़ है; सिंहों ने उसे खदेड़ दिया है। पहले अश्शूर के राजा ने उसे निगल लिया, और इस बाद वाले ने, अर्थात् बाबेल के राजा नबूकदरेस्सर[a] ने, उसकी हड्डियाँ चबा डाली हैं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस नाम का अधिक प्रचलित रूप “नबूकदनेस्सर” है; यहाँ इब्रानी वर्तनी के निकट “नबूकदरेस्सर” रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: इस इब्रानी क्रिया का अर्थ “उसकी हड्डियाँ चबा डाली हैं,” “उसकी हड्डियाँ नोंचकर साफ़ कर दी हैं,” या अधिक सामान्य रूप से “उसे कुचल डाला है” हो सकता है।
    reason: lexical_ambiguity
lexical_decisions:
- source_word: שֶׂה פְזוּרָה
  choice: एक बिखरी हुई भेड़
  rationale: שֶׂה छोटे पालतू पशु, विशेषतः भेड़ या मेमने, को सूचित कर सकता है; यहाँ शिकारी सिंहों के सामने असहाय राष्ट्रीय रूपक के लिए ‘भेड़’ स्वाभाविक है। פְזוּרָה के बिखराव के भाव को बनाए रखा गया है।
- source_word: אֲרָיוֹת הִדִּיחוּ
  choice: सिंहों ने उसे खदेड़ दिया है
  rationale: हिफ़ील क्रिया किसी को भगा देने या दूर खदेड़ने का भाव देती है और शिकारी रूपक को स्पष्ट रखती है।
- source_word: אֲכָלוֹ
  choice: उसे खा लिया
  rationale: मूल क्रिया का सीधा अर्थ ‘खाना’ है; प्रसंग में इसकी हिंसक, निगल जाने वाली रूपकात्मक शक्ति अपने आप स्पष्ट है।
- source_word: וְזֶה הָאַחֲרוֹן
  choice: और अब इस अंतिम ने
  rationale: यह पहले आक्रमणकारी के विपरीत बाद वाले आक्रमणकारी की ओर संकेत करता है; ‘इस अंतिम’ मूल के संकेतवाचक और क्रम-संबंधी बल को सुरक्षित रखता है।
- source_word: עִצְּמוֹ
  choice: उसकी हड्डियाँ तक चबा डाली हैं
  rationale: यह दुर्लभ क्रिया हड्डियाँ चबाने, नोंचकर साफ़ करने या कुचलने का भाव दे सकती है। चुना हुआ रूप सिंह-भेड़ के सजीव शिकारी रूपक को आगे बढ़ाता है; ‘तक’ विनाश की तीव्रता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: נְבוּכַדְרֶאצַּר
  choice: नबूकदरेस्सर
  rationale: यह लिप्यंतरण इस पद के इब्रानी रूप में उपस्थित ר (र) को सुरक्षित रखता है, यद्यपि हिन्दी में ‘नबूकदनेस्सर’ अधिक परिचित रूप है।
- source_word: מֶלֶךְ אַשּׁוּר / מֶלֶךְ בָּבֶל
  choice: अश्शूर के राजा / बाबेल के राजा
  rationale: दोनों संबंधवाचक पदबंध आधुनिक हिन्दी में सीधे और स्वाभाविक ढंग से प्रस्तुत किए गए हैं।
theological_decisions:
- issue: इस्राएल का एकवचन पशु-रूपक
  choice: इस्राएल को एक भेड़ के रूप में प्रस्तुत करके आगे एकवचन ‘उसे/उसकी’ रखा गया है।
  alternative: इस्राएल को बहुवचन झुंड मानकर बहुवचन सर्वनाम देना।
  rationale: इब्रानी पाठ में राष्ट्रीय नाम के साथ एकवचन पशु-संज्ञा है और आगे के कर्म-प्रत्यय भी एकवचन हैं; इसलिए सामूहिक राष्ट्र और एक असहाय पशु के बीच मूल तनाव को बनाए रखा गया है।
- issue: अंतिम क्रिया की हिंसक छवि
  choice: ‘हड्डियाँ तक चबा डाली हैं’
  alternative: ‘उसकी हड्डियाँ कुचल दी हैं’ या अधिक सामान्य ‘उसे चूर कर दिया है’
  rationale: चुना हुआ पाठ शिकारी पशुओं के रूपक को निरंतर रखता है, जबकि पादटिप्पणी दुर्लभ क्रिया की वास्तविक अर्थगत अनिश्चितता बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमामय और सामान्य पाठक के लिए सुबोध रखी गई है। ‘खा लिया’ और ‘हड्डियाँ तक चबा डाली’ मूल के विस्तृत शिकारी रूपक को बिना धर्मसांप्रदायिक व्याख्या जोड़े बनाए रखते हैं।
