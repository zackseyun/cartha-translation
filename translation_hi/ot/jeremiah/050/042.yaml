  text: קֶ֣שֶׁת וְ/כִידֹ֞ן יַחֲזִ֗יקוּ אַכְזָרִ֥י הֵ֨מָּה֙ וְ/לֹ֣א יְרַחֵ֔מוּ קוֹלָ/ם֙ כַּ/יָּ֣ם יֶהֱמֶ֔ה וְ/עַל סוּסִ֖ים יִרְכָּ֑בוּ עָר֗וּךְ כְּ/אִישׁ֙ לַ/מִּלְחָמָ֔ה עָלַ֖יִ/ךְ בַּת בָּבֶֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/042.yaml
  text: They seize bow and javelin; they are cruel and will show no mercy. Their sound roars like the sea[a], and they ride on horses, arrayed like a man for battle against you, daughter Babylon.
translation:
  language: hi
  text: वे धनुष और भाला थामे हुए हैं; वे क्रूर हैं और दया नहीं करेंगे। उनकी आवाज़ समुद्र के समान गरजती है। वे घोड़ों पर सवार हैं और युद्ध के लिए एक पुरुष के समान[a] पंक्ति बाँधे हुए हैं—हे बाबेल की बेटी, तेरे विरुद्ध।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक जन के समान,” अर्थात् पूरी सेना एकजुट होकर।
    reason: כְּאִישׁ का शाब्दिक अर्थ ‘एक पुरुष के समान’ है, पर प्रसंग में यह सेना की एकीकृत युद्ध-पंक्ति पर बल देने वाला मुहावरा भी हो सकता है।
lexical_decisions:
- source_word: קֶשֶׁת
  choice: धनुष
  rationale: यह एकवचन सामूहिक अथवा हथियार-सूचक संज्ञा है; हिन्दी में ‘धनुष’ स्वाभाविक रूप से वही अर्थ देता है।
- source_word: כִידֹן
  choice: भाला
  rationale: यह धनुष से भिन्न, फेंकने या भोंकने वाला डंडाकार हथियार है। ‘भाला’ आधुनिक हिन्दी में स्पष्ट और व्यापक रूप से समझा जाने वाला निकटतम शब्द है।
- source_word: יַחֲזִיקוּ
  choice: थामे हुए हैं
  rationale: हिफ़ील रूप यहाँ हथियार को दृढ़ता से पकड़कर तैयार रहने का भाव देता है; यह अभिव्यक्ति उस तत्पर अवस्था को स्वाभाविक हिन्दी में प्रकट करती है।
- source_word: אַכְזָרִי
  choice: क्रूर
  rationale: यह आक्रमणकारियों के कठोर और दयारहित स्वभाव का सीधा वर्णन है; अगला वाक्यांश दया न करने की बात अलग से कहता है।
- source_word: לֹא יְרַחֵמוּ
  choice: दया नहीं करेंगे
  rationale: यह हिब्रू क्रिया के भाव और प्रसंग में उसके भावी परिणाम को सहज हिन्दी में बनाए रखता है।
- source_word: קוֹלָם
  choice: उनकी आवाज़
  rationale: קוֹל का अर्थ आवाज़, ध्वनि या शोर हो सकता है। सेना की सामूहिक ध्वनि और समुद्र से उसकी तुलना के लिए ‘आवाज़’ पर्याप्त व्यापक और स्वाभाविक है।
- source_word: כַיָּם יֶהֱמֶה
  choice: समुद्र के समान गरजती है
  rationale: क्रिया उमड़ती हुई तेज़ ध्वनि या गर्जन व्यक्त करती है; ‘गरजती है’ तुलना की शक्ति को स्पष्ट रखता है।
- source_word: עַל סוּסִים יִרְכָּבוּ
  choice: वे घोड़ों पर सवार हैं
  rationale: यह सेना की अश्वारूढ़ स्थिति का सीधा और सहज हिन्दी वर्णन है।
- source_word: עָרוּךְ
  choice: पाँति बाँधे हुए
  rationale: निष्क्रिय कृदन्त सुव्यवस्थित युद्ध-विन्यास और तत्परता बताता है; ‘पाँति बाँधे हुए’ हिन्दी में सैन्य गठन का स्वाभाविक बोध देता है।
- source_word: כְּאִישׁ
  choice: एक पुरुष के समान
  rationale: मुख्य पाठ हिब्रू के व्याकरणिक रूप और मार्शल उपमा को सुरक्षित रखता है; एकजुट सेना के अर्थ की सम्भावना पादटिप्पणी में दी गई है।
- source_word: לַמִּלְחָמָה
  choice: युद्ध के लिए
  rationale: यह युद्ध-सज्जा के तत्काल प्रसंग में מִלְחָמָה का सीधा और स्वाभाविक हिन्दी समतुल्य है।
- source_word: בַּת בָּבֶל
  choice: हे बाबेल की बेटी
  rationale: यह नगर और उसके लोगों को बेटी के रूप में सम्बोधित करने वाले हिब्रू काव्यात्मक मानवीकरण को बनाए रखता है।
theological_decisions:
- issue: כְּאִישׁ में पुल्लिंग एकवचन वाली युद्ध-उपमा
  choice: एक पुरुष के समान
  alternative: एक जन के समान
  rationale: मुख्य पाठ स्रोत के पुल्लिंग एकवचन और उसकी उपमा को बिना व्याख्यात्मक परिवर्तन के रखता है। फिर भी प्रसंग में इसे पूरी सेना के ‘एक जन के समान’ एकजुट होने के अर्थ में समझना सम्भव है, इसलिए वह अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। काव्यात्मक प्रत्यक्ष सम्बोधन ‘हे बाबेल की बेटी’ तथा समुद्र की गर्जना का बिंब सुरक्षित है। पादटिप्पणी-चिह्न उसी विवादित वाक्यांश के बाद रखा गया है, न कि समुद्र वाली उपमा के बाद।
