id: JER.50.19
reference: Jeremiah 50:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/שֹׁבַבְתִּ֤י אֶת יִשְׂרָאֵל֙ אֶל נָוֵ֔/הוּ וְ/רָעָ֥ה הַ/כַּרְמֶ֖ל וְ/הַ/בָּשָׁ֑ן וּ/בְ/הַ֥ר אֶפְרַ֛יִם וְ/הַ/גִּלְעָ֖ד תִּשְׂבַּ֥ע נַפְשֽׁ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/019.yaml
  text: And I will bring Israel back to his pasture[a], and he will graze on Carmel and Bashan; and on the hill country of Ephraim and Gilead his appetite will be satisfied.
translation:
  language: hi
  text: मैं इस्राएल को उसके चरागाह में लौटा लाऊँगा, और वह कर्मेल और बाशान में चरेगा; एप्रैम के पहाड़ी प्रदेश और गिलाद में उसकी भूख तृप्त होगी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, “उसका प्राण तृप्त होगा।”
    reason: נֶפֶשׁ के शाब्दिक रूप और प्रसंगगत अर्थ—‘भूख’—दोनों को स्पष्ट रखने के लिए।
lexical_decisions:
- source_word: וְשֹׁבַבְתִּי
  choice: मैं ... लौटा लाऊँगा
  rationale: यहाँ क्रिया इस्राएल को फिर उसके चरागाह तक पहुँचाने का भाव देती है। ‘लौटा लाऊँगा’ वास्तविक वापसी और पुनर्स्थापना—दोनों संकेतों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: נָוֵהוּ
  choice: उसके चरागाह में
  rationale: נָוֶה का अर्थ निवास, बाड़ा या चरने का स्थान हो सकता है। अगली क्रिया ‘चरेगा’ के कारण ‘चरागाह’ पशुपालकीय रूपक को सबसे स्पष्ट रूप से बनाए रखता है।
- source_word: וְרָעָה
  choice: और वह ... चरेगा
  rationale: यहाँ רעה अकर्मक रूप में झुंड के चरने का बोध कराता है। इससे एक झुंड के रूप में चित्रित इस्राएल का रूपक सुरक्षित रहता है।
- source_word: הַכַּרְמֶל
  choice: कर्मेल
  rationale: यह स्थान का नाम है; हिन्दी बाइबलीय परंपरा के अनुरूप लिप्यंतरण किया गया है।
- source_word: הַבָּשָׁן
  choice: बाशान
  rationale: यह प्रदेश का नाम है; इब्रानी के निश्चयवाचक उपसर्ग को हिन्दी में अलग से व्यक्त करना आवश्यक नहीं है।
- source_word: וּבְהַר אֶפְרַיִם
  choice: एप्रैम के पहाड़ी प्रदेश में
  rationale: הַר किसी एक पर्वत के साथ-साथ पर्वतीय या पहाड़ी भूभाग को भी सूचित कर सकता है। यहाँ प्रादेशिक संदर्भ में ‘पहाड़ी प्रदेश’ भौगोलिक अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְהַגִּלְעָד
  choice: और गिलाद में
  rationale: यह एक प्रादेशिक नाम है। समानांतर भौगोलिक वाक्यांश के अनुसार हिन्दी में ‘में’ समझकर व्यक्त किया गया है।
- source_word: תִּשְׂבַּע נַפְשׁוֹ
  choice: उसकी भूख तृप्त होगी
  rationale: शाब्दिक रूप से ‘उसका प्राण तृप्त होगा’। चरने और भोजन के इस संदर्भ में נֶפֶשׁ जीवित व्यक्ति की इच्छा या भूख को सूचित करता है; ‘भूख’ प्रसंगगत अर्थ को स्पष्ट करता है, जबकि शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: यहाँ लोगों के समुदाय को एकवचन सामूहिक इकाई के रूप में चित्रित किया गया है, इसलिए आगे एकवचन ‘उसके’ और ‘वह’ रखा गया है।
theological_decisions:
- issue: इस्राएल का मानवीकरण और वचन
  choice: इस्राएल के लिए एकवचन ‘उसके’, ‘वह’ और ‘उसकी’ का प्रयोग
  alternative: सामूहिक लोगों के अर्थ में बहुवचन सर्वनामों का प्रयोग
  rationale: इब्रानी पाठ इस्राएल को एकवचन सामूहिक व्यक्तित्व के रूप में प्रस्तुत करता है और एकवचन क्रिया तथा प्रत्ययों का प्रयोग करता है। एकवचन रखने से स्रोत की व्याकरणिक बनावट और झुंड का रूपक सुरक्षित रहते हैं।
- issue: भोजन के संदर्भ में נֶפֶשׁ का अर्थ
  choice: मुख्य पाठ में ‘भूख’
  alternative: अधिक शाब्दिक ‘प्राण’
  rationale: पशुपालकीय और भोजन-संबंधी संदर्भ में נֶפֶשׁ को ‘भूख’ कहना बाद की किसी विशिष्ट आत्मा-संबंधी धारणा को पाठ पर आरोपित किए बिना इब्रानी मुहावरे का प्रसंगगत बल व्यक्त करता है। शाब्दिक विकल्प पारदर्शिता के लिए पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। पशुपालकीय बिंब के लिए ‘चरागाह’ और ‘चरेगा’ जैसे सामान्य शब्द चुने गए हैं। अर्धविराम दोनों समानांतर चराई-क्षेत्रों को जोड़ते हुए अंतिम तृप्ति-वाक्य को स्पष्ट करता है। पादटिप्पणी का चिह्न उसी वाक्यांश के बाद रखा गया है जिसकी शाब्दिक वैकल्पिक अभिव्यक्ति पादटिप्पणी में दी गई है।
