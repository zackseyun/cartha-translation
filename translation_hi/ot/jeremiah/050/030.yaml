base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/030.yaml
  text: Therefore her young men will fall in her streets[a], and all her warriors will be silenced on that day, declares Yahweh.
translation:
  language: hi
  text: इसलिए उसके जवान उसकी सड़कों में गिर पड़ेंगे, और उस दिन उसके सभी योद्धा मौन हो जाएँगे[a]—याहवे की यह घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “नष्ट हो जाएँगे।” इब्रानी क्रिया का अर्थ “मौन या निश्चल हो जाना” हो सकता है और इस प्रसंग में मृत्यु में निश्चल हो जाने का संकेत दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह परिणाम सूचित करने वाला सामान्य संबंधबोधक है और पिछले न्याय-वचन से सीधा तार्किक संबंध बनाए रखता है।
- source_word: יִפְּלוּ
  choice: गिर पड़ेंगे
  rationale: נפל का मूल बिंब ‘गिरना’ है; युद्ध और न्याय के प्रसंग में मृत्यु निहित है, पर अनुवाद मूल बिंब को स्पष्टतः बनाए रखता है।
- source_word: בַחוּרֶיהָ
  choice: उसके जवान
  rationale: בָּחוּר प्रायः जीवन के उत्कर्ष पर पहुँचे युवकों को बताता है और यहाँ सैनिक अर्थ-संकेत रखता है। ‘जवान’ आधुनिक हिन्दी में आयु और युद्ध-संदर्भ दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בִּרְחֹבֹתֶיהָ
  choice: उसके चौकों में
  rationale: רְחֹבוֹת नगर की चौड़ी सड़कों या खुले सार्वजनिक चौकों को सूचित कर सकता है। यहाँ बहुवचन ‘चौकों’ से शहरी सार्वजनिक स्थान का बिंब सुरक्षित रहता है।
- source_word: אַנְשֵׁי מִלְחַמְתָּהּ
  choice: उसके सभी योद्धा
  rationale: शाब्दिक अर्थ ‘उसके युद्ध के पुरुष’ है। ‘योद्धा’ इसका सहज और संक्षिप्त हिन्दी समतुल्य है; כָל के लिए ‘सभी’ रखा गया है।
- source_word: יִדַּמּוּ
  choice: चुप करा दिए जाएँगे
  rationale: דמם का निफ़अल रूप चुप या निश्चल कर दिए जाने का भाव दे सकता है। कर्मवाच्य हिन्दी मूल रूप और हिंसक न्याय-संदर्भ दोनों को बनाए रखती है, जबकि मृत्यु का अर्थ स्पष्ट करके थोपती नहीं।
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह भविष्यसूचक समय-सूचक पद का स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: נְאֻם भविष्यद्वक्ताओं में प्रामाणिक ईश्वरीय घोषणा का सूत्र है। यह रूप ‘कहता है’ से अधिक औपचारिक बल सुरक्षित रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ के व्यक्तिगत दिव्य नाम को उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में रखा गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल में चतुरक्षरी व्यक्तिगत नाम है; ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और नाम को किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: יִדַּמּוּ में मौन और मृत्यु का संबंध
  choice: चुप करा दिए जाएँगे
  alternative: नष्ट हो जाएँगे
  rationale: क्रिया का मौन या निश्चल होने का बिंब सुरक्षित रखा गया है, जबकि युद्ध-न्याय का प्रसंग मृत्यु की ओर संकेत करता है। अधिक स्पष्ट मृत्यु-अर्थ को पादटिप्पणी में दिया गया है ताकि मूल की अर्थगत व्यापकता बनी रहे।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘गिर पड़ेंगे’ और ‘चुप करा दिए जाएँगे’ मूल के न्याय-संबंधी बिंबों को बनाए रखते हैं; मृत्यु का आशय प्रसंग और पादटिप्पणी से स्पष्ट होता है।
