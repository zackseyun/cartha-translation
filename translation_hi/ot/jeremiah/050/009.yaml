id: JER.50.9
reference: Jeremiah 50:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֣י הִנֵּ֣ה אָנֹכִ֡י מֵעִיר֩ וּ/מַעֲלֶ֨ה עַל בָּבֶ֜ל קְהַל גּוֹיִ֤ם גְּדֹלִים֙ מֵ/אֶ֣רֶץ צָפ֔וֹן וְ/עָ֣רְכוּ לָ֔/הּ מִ/שָּׁ֖ם תִּלָּכֵ֑ד חִצָּי/ו֙ כְּ/גִבּ֣וֹר מַשְׁכִּ֔יל לֹ֥א יָשׁ֖וּב רֵיקָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/009.yaml
  text: For behold[a], I am stirring up and bringing against Babylon an assembly of great nations from the land of the north. They will array themselves against her; from there she will be captured. Their arrows are like those of a skilled warrior[b]; none returns empty-handed.
translation:
  language: hi
  text: क्योंकि देखो, मैं उत्तर देश से बड़ी-बड़ी जातियों की एक सभा को उभारकर बाबेल के विरुद्ध ला रहा हूँ। वे उसके विरुद्ध युद्ध-पंक्ति बाँधेंगी; वहीं से वह पकड़ी जाएगी। उनके तीर कुशल योद्धा के तीरों के समान होंगे[a]; कोई भी निष्फल नहीं लौटेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके तीर उस कुशल योद्धा के समान हैं जो खाली नहीं लौटता।” इब्रानी में उपमा संकुचित है, इसलिए तीरों और कुशल योद्धा के बीच ठीक संबंध को अधिक शाब्दिक ढंग से भी अनुवाद किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעִיר וּמַעֲלֶה
  choice: उभारकर ... ला रहा हूँ
  rationale: 'दोनों हिफ़ील रूप परमेश्वर की कारक भूमिका व्यक्त करते हैं: वह जातियों को कार्रवाई के लिए उठाता और बाबेल के विरुद्ध लाता है।'
- source_word: קְהַל גּוֹיִם גְּדֹלִים
  choice: बड़ी-बड़ी जातियों की एक सभा
  rationale: קהל का मूल अर्थ एकत्रित सभा है; גוים גדלים को बिना अनावश्यक व्याख्या के स्वाभाविक आधुनिक हिन्दी में रखा गया है।
- source_word: מֵאֶרֶץ צָפוֹן
  choice: उत्तर देश से
  rationale: यह भविष्यद्वाणी-साहित्य का प्रचलित भौगोलिक पद है और हिन्दी में संक्षिप्त तथा स्पष्ट है।
- source_word: וְעָרְכוּ לָהּ
  choice: वे उसके विरुद्ध युद्ध-पंक्ति बाँधेंगी
  rationale: ערך का सैनिक संदर्भ में अर्थ युद्ध के लिए पंक्ति या व्यूह बाँधना है; यह अनुवाद निहित सैनिक भाव को स्पष्ट करता है।
- source_word: מִשָּׁם תִּלָּכֵד
  choice: वहीं से वह पकड़ लिया जाएगा
  rationale: מִשָּׁם को आक्रमणकारी सेनाओं के मोर्चे की ओर संकेत करने दिया गया है और לכד के निफ़ाल का कर्मवाच्य भाव सुरक्षित है।
- source_word: חִצָּיו
  choice: उनके तीर
  rationale: एकवचन प्रत्यय सामूहिक आक्रमणकारी दल की ओर संकेत कर सकता है; स्वाभाविक हिन्दी में बहुवचन जातियों/सभा के लिए 'उनके' उपयुक्त है।
- source_word: כְּגִבּוֹר מַשְׂכִּיל
  choice: कुशल योद्धा के तीरों के समान
  rationale: मसोरी पाठ की संकुचित उपमा को समझने योग्य बनाने के लिए 'तीरों' की पूर्ति की गई है; מַשְׂכִּיל यहाँ दक्षता अथवा सफल कौशल बताता है।
- source_word: לֹא יָשׁוּב רֵיקָם
  choice: कोई भी निष्फल नहीं लौटेगा
  rationale: शाब्दिक 'खाली नहीं लौटेगा' का आशय तीरों के लक्ष्य-विहीन या बेअसर न रहने से है; 'निष्फल' रूपक और परिणाम दोनों को संक्षेप में रखता है।
theological_decisions:
- issue: आक्रमणकारी जातियों के पीछे कर्तृत्व
  choice: परमेश्वर स्वयं उन्हें उभारकर बाबेल के विरुद्ध ला रहा है।
  alternative: इसे केवल आक्रमण की वर्णनात्मक भविष्यवाणी मानना।
  rationale: प्रथम पुरुष אָנֹכִי तथा दोनों कारक कृदन्त परमेश्वर के सक्रिय कर्तृत्व को पाठ में स्पष्ट करते हैं।
- issue: तीरों और कुशल योद्धा के बीच संकुचित उपमा
  choice: तीरों को कुशल योद्धा के तीरों के समान बताया गया है।
  alternative: ‘उसके तीर उस कुशल योद्धा के समान हैं जो खाली नहीं लौटता।’
  rationale: हिब्रू वाक्यरचना संकुचित और कुछ अस्पष्ट है; मुख्य पाठ स्वाभाविक हिन्दी देता है, जबकि पादटिप्पणी अधिक शाब्दिक विकल्प सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध स्तर रखा गया है। ‘युद्ध-पंक्ति बाँधेंगी’ सैनिक संदर्भ स्पष्ट करता है; ‘निष्फल नहीं लौटेगा’ मूल रूपक को सहज हिन्दी में सुरक्षित रखता है।
