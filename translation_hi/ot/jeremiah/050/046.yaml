  text: מִ/קּוֹל֙ נִתְפְּשָׂ֣ה בָבֶ֔ל נִרְעֲשָׁ֖ה הָ/אָ֑רֶץ וּ/זְעָקָ֖ה בַּ/גּוֹיִ֥ם נִשְׁמָֽע׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/046.yaml
  text: At the sound of Babylon being captured, the earth quakes, and a cry is heard among the nations.
translation:
  language: hi
  text: बाबेल के पकड़े जाने की आवाज़ से पृथ्वी काँपती है, और राष्ट्रों में पुकार सुनाई देती है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִקּוֹל נִתְפְּשָׂה בָבֶל
  choice: बाबेल के पकड़े जाने की आवाज़ से
  rationale: מִקּוֹל को कारणसूचक ‘आवाज़ से’ और निफ़ाल נִתְפְּשָׂה को ‘पकड़े जाने’ के रूप में रखा गया है; यह नगर के शत्रु के हाथ आ जाने का भाव देता है।
- source_word: נִרְעֲשָׁה הָאָרֶץ
  choice: पृथ्वी काँप उठेगी
  rationale: רעש के तीव्र कंपने के अर्थ को स्वाभाविक हिन्दी ‘काँप उठेगी’ से व्यक्त किया गया है।
- source_word: וּזְעָקָה בַגּוֹיִם נִשְׁמָע
  choice: और उसकी पुकार जाति-जाति के लोगों के बीच सुनाई देगी
  rationale: זְעָקָה को संकट और विलाप की खुली अर्थ-सीमा बनाए रखने के लिए ‘पुकार’ कहा गया है। בַגּוֹיִם के लिए ‘जाति-जाति के लोगों के बीच’ सामान्य पाठक को बहुवचन राष्ट्रों/जातियों का अर्थ स्पष्ट करता है।
theological_decisions:
- issue: पृथ्वी के काँपने का दायरा
  choice: ‘पृथ्वी’ को यथावत रखा गया
  alternative: ‘देश’ या ‘भूमि’
  rationale: הָאָרֶץ का अर्थ ‘पृथ्वी’ अथवा ‘देश/भूमि’ हो सकता है। व्यापक अंतरराष्ट्रीय संदर्भ और राष्ट्रों के उल्लेख के कारण मुख्य पाठ में ‘पृथ्वी’ चुना गया, पर अतिशयोक्ति को किसी विशिष्ट सिद्धान्त में नहीं बदला गया।
- issue: זְעָקָה का संदर्भ
  choice: ‘उसकी पुकार’
  alternative: ‘एक पुकार’ या ‘चीत्कार’
  rationale: हिब्रू में अधिकारसूचक सर्वनाम नहीं है, पर प्रसंग इसे बाबेल के पतन से उठी पुकार से जोड़ता है। ‘पुकार’ विलाप, सहायता की पुकार या युद्ध-चीत्कार में से किसी एक को अनावश्यक रूप से निश्चित नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी; भविष्यवाणी के प्रसंग के अनुरूप भविष्यकाल रखा गया है। भाषा गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज है।
