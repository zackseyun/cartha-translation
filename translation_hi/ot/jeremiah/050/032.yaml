  text: וְ/כָשַׁ֤ל זָדוֹן֙ וְ/נָפַ֔ל וְ/אֵ֥ין ל֖/וֹ מֵקִ֑ים וְ/הִצַּ֤תִּי אֵשׁ֙ בְּ/עָרָ֔י/ו וְ/אָכְלָ֖ה כָּל סְבִיבֹתָֽי/ו־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/032.yaml
  text: And the arrogant one will stumble and fall[a], with no one to raise him up; and I will kindle a fire in his cities[b], and it will consume all around him.
translation:
  language: hi
  text: और वह घमण्डी ठोकर खाकर गिर पड़ेगा[a]; उसे उठाने वाला कोई न होगा। मैं उसके नगरों में आग भड़काऊँगा[b], और वह उसके चारों ओर का सब कुछ भस्म कर देगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “घमण्ड” अथवा “ढिठाई।” हिब्रू शब्द זָדוֹן प्रायः अमूर्त अर्थ रखता है, पर यहाँ पुल्लिंग एकवचन क्रियाओं और सर्वनामों के कारण उसका अनुवाद व्यक्तिगत रूप में “वह घमण्डी” किया गया है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “उसके नगरों में।” इस पद में बाबेल को एक पुरुष के रूप में मानवीकृत किया गया है।
    reason: cultural_note
lexical_decisions:
- source_word: זָדוֹן
  choice: वह घमण्डी
  rationale: यह संज्ञा प्रायः ‘घमण्ड’ या ‘ढिठाई’ जैसे अमूर्त अर्थ देती है, पर यहाँ पुल्लिंग एकवचन क्रियाएँ और सर्वनाम इसे बाबेल के मानवीकृत नाम के रूप में प्रस्तुत करते हैं।
- source_word: כָשַׁל וְנָפַל
  choice: ठोकर खाकर गिर पड़ेगा
  rationale: दोनों क्रियाओं का क्रम और पतन की तीव्रता सुरक्षित रहती है; भविष्यकाल न्याय की भविष्यवाणी के प्रसंग के अनुकूल है।
- source_word: מֵקִים
  choice: उठानेवाला
  rationale: गिरे हुए को फिर उठाने की मूल छवि बनाए रखता है और राजनीतिक पुनर्स्थापना जैसा अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: הִצַּתִּי אֵשׁ
  choice: मैं ... आग भड़काऊँगा
  rationale: हिब्रू के स्पष्ट ‘आग’ और उसे प्रज्वलित करने की क्रिया, दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: בְּעָרָיו
  choice: उसके नगरों में
  rationale: पुल्लिंग एकवचन प्रत्यय को बनाए रखकर बाबेल के मानवीकरण को सुरक्षित करता है।
- source_word: וְאָכְלָה
  choice: और वह ... भस्म कर देगी
  rationale: स्त्रीलिंग क्रिया का कर्ता ‘आग’ है; ‘भस्म कर देगी’ अग्नि द्वारा पूर्ण विनाश को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כָּל סְבִיבֹתָיו
  choice: उसके चारों ओर की हर वस्तु
  rationale: चारों ओर स्थित समस्त चीज़ों के व्यापक अर्थ को स्पष्ट करते हुए पुल्लिंग एकवचन मानवीकरण बनाए रखता है।
theological_decisions:
- issue: बाबेल का पुल्लिंग एकवचन मानवीकरण
  choice: ‘वह घमण्डी ... उसे ... उसके नगरों’ के रूप में व्यक्तिगत पुल्लिंग संदर्भ बनाए रखा गया।
  alternative: ‘घमण्ड’ जैसे अमूर्त अर्थ में अनुवाद करना, अथवा बाबेल को निर्जीव मानकर उसके लिए तटस्थ संदर्भ लेना।
  rationale: हिब्रू व्याकरण में क्रियाएँ और सर्वनाम लगातार पुल्लिंग एकवचन हैं। यह बाबेल को एक घमण्डी व्यक्ति के रूप में चित्रित करता है; इस तनाव को समतल करना पाठ की छवि को कम कर देगा।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली रखी गई है। ‘घमण्डी’, ‘ठोकर खाकर गिर पड़ेगा’ और ‘भस्म कर देगी’ सामान्य पाठक के लिए स्पष्ट हैं, जबकि मूल की व्यक्ति-छवि, आग का स्त्रीलिंग संबंध और भविष्यसूचक न्याय का बल सुरक्षित हैं।
