  text: הִנֵּ֛ה עַ֥ם בָּ֖א מִ/צָּפ֑וֹן וְ/ג֤וֹי גָּדוֹל֙ וּ/מְלָכִ֣ים רַבִּ֔ים יֵעֹ֖רוּ מִ/יַּרְכְּתֵי אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/041.yaml
  text: Behold[a], a people is coming from the north[b], and a great nation and many kings will be stirred up from the farthest parts of the earth.
translation:
  language: hi
  text: देखो, उत्तर से एक जनसमूह आ रहा है; एक बड़ा राष्ट्र और बहुत-से राजा पृथ्वी के दूरस्थ भागों से जगाए जाएँगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उकसाए जाएँगे,” “लामबंद किए जाएँगे,” अथवा “जाग उठेंगे”; इब्रानी क्रिया जगाए या सक्रिय किए जाने का भाव दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला प्रवचन-सूचक है। ‘देखो’ आधुनिक हिन्दी में स्वाभाविक रहते हुए भविष्यद्वाणी की सजीवता बनाए रखता है।
- source_word: עַם
  choice: एक जाति
  rationale: यहाँ עַם एक विशिष्ट जनसमूह को दर्शाता है; ‘जाति’ अगले גּוֹי גָּדוֹל के लिए प्रयुक्त ‘राष्ट्र’ से शब्दगत भेद भी बनाए रखता है।
- source_word: בָּא
  choice: आ रही है
  rationale: הִנֵּה के बाद पूर्ण रूप भविष्यद्वाणी में आसन्न और सजीव घटना व्यक्त करता है; हिन्दी का वर्तमान प्रगतिशील रूप इस बल को स्वाभाविक ढंग से देता है।
- source_word: מִצָּפוֹן
  choice: उत्तर दिशा से
  rationale: दिशासूचक वाक्यांश का स्पष्ट और स्वाभाविक हिन्दी रूप।
- source_word: גּוֹי גָּדוֹל
  choice: एक बड़ा राष्ट्र
  rationale: גּוֹי को राजनीतिक-सामूहिक अर्थ में ‘राष्ट्र’ कहना उपयुक्त है और पहले आए עַם से भेद बनाए रखता है।
- source_word: וּמְלָכִים רַבִּים
  choice: और बहुत-से राजा
  rationale: सरल समन्वित पदबंध; राजाओं की बहुलता स्पष्ट रखता है।
- source_word: יֵעֹרוּ
  choice: युद्ध के लिए जगाए जाएँगे
  rationale: עור का निफ़अल रूप जगाए या सक्रिय किए जाने का निष्क्रिय भाव देता है। प्रसंग सैन्य लामबंदी का संकेत करता है; ‘युद्ध के लिए’ इसे स्वाभाविक हिन्दी में स्पष्ट करता है, जबकि टिप्पणी मूल क्रिया की व्यापकता बचाती है।
- source_word: מִיַּרְכְּתֵי אָרֶץ
  choice: पृथ्वी के दूर-दूर के भागों से
  rationale: यह वाक्यांश पृथ्वी के दूरस्थ छोरों या प्रदेशों को दर्शाता है; चुना हुआ रूप स्वाभाविक है और भौगोलिक दूरत्व सुरक्षित रखता है।
