  verdict: revise
  source_fidelity: The draft correctly renders the vivid imminent arrival, northern origin, great nation, many kings, and remote regions. However, “युद्ध के लिए” adds a purpose not expressed in the Hebrew; the military context may inform interpretation but should not be inserted into the translation.
  naturalness: The Hindi is generally clear and appropriately elevated. “जनसमूह” avoids the modern caste-related ambiguity that “जाति” can carry, while retaining a useful distinction from “राष्ट्र.” “पृथ्वी के दूरस्थ भागों” is concise and natural.
  terminology: “देखो,” “एक जनसमूह,” “एक बड़ा राष्ट्र,” and “जगाए जाएँगे” preserve the source wording and prophetic register without making the lexical alternative doctrinally or interpretively specific.
  issues:
  - severity: medium
    issue: The phrase “युद्ध के लिए” is absent from the Hebrew text.
    rationale: The verb יֵעֹרוּ can convey being roused or mobilized, likely in a military setting, but the verse itself does not state “for war.” Adding it narrows and expands the source meaning.
  - severity: low
    issue: “जाति” can be misunderstood in modern Hindi as caste.
    rationale: Although it can mean a people or ethnic group, “जनसमूह” is less ambiguous here and still distinguishes עַם from the following גּוֹי (“राष्ट्र”).
  revised_text: देखो, उत्तर से एक जनसमूह आ रहा है; एक बड़ा राष्ट्र और बहुत-से राजा पृथ्वी के दूरस्थ भागों से जगाए जाएँगे।[a]
