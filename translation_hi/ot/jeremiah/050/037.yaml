base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/037.yaml
  text: A sword against his horses and against his chariots[a], and against all the mixed people in her midst, and they will become women. A sword against her treasuries[b], and they will be plundered.
translation:
  language: hi
  text: '“उसके घोड़ों और उसके रथों के विरुद्ध तलवार!


    उसके बीच में रहने वाले सभी मिश्रित जनसमूह[a] के विरुद्ध भी!


    वे स्त्रियाँ हो जाएँगे।[b]


    उसके भंडारों के विरुद्ध तलवार!


    वे लूट लिए जाएँगे!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सभी विदेशी सहायक सैनिकों” अथवा “सारा मिश्रित जनसमूह।” इब्रानी शब्द संभवतः बाबुल के भीतर की मिश्रित जनसंख्या या सहायक सैनिकों को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “वे स्त्रियाँ हो जाएँगे।” प्राचीन युद्ध-संदर्भ में यह भयभीत होने या युद्ध का साहस खो देने का मुहावरा है।
    reason: cultural_note
lexical_decisions:
- source_word: חֶרֶב
  choice: तलवार ... पर चले
  rationale: इब्रानी में यह बिना क्रिया का संक्षिप्त न्याय-सूत्र है। हिन्दी में ‘पर चले’ जोड़ने से आक्रमण का आशय स्वाभाविक रूप से व्यक्त होता है और भविष्यद्वाणी की तीक्ष्णता बनी रहती है।
- source_word: סוּסָיו
  choice: उसके घोड़ों
  rationale: पुल्लिंग एकवचन प्रत्यय बाबुल की ओर संकेत करता है; हिन्दी का ‘उसके’ मूल व्याकरणिक रूप को सहजता से रखता है।
- source_word: רִכְבּוֹ
  choice: उसके रथों
  rationale: एकवचन सामूहिक संज्ञा यहाँ रथ-सेना को सूचित करती है; हिन्दी में बहुवचन ‘रथों’ सैन्य संदर्भ में अधिक स्वाभाविक है।
- source_word: כָּל הָעֶרֶב
  choice: सभी मिले-जुले लोगों
  rationale: עֶרֶב बाबुल में रहने वाली मिश्रित जनसंख्या या विदेशी सहायक सैनिकों का बोध करा सकता है। यह चयन मूल के व्यापक अर्थ को रखता है और ‘भाड़े के सैनिक’ जैसा अनिश्चित विशेषीकरण नहीं करता।
- source_word: בְּתוֹכָהּ
  choice: उसके भीतर के
  rationale: स्त्रीलिंग प्रत्यय नगररूप में बाबुल को सूचित करता है। हिन्दी में ‘उसके भीतर के’ स्थान-संबंध को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְהָיוּ לְנָשִׁים
  choice: वे स्त्रियाँ बन जाएँगे
  rationale: यह मूल वाक्यांश ‘स्त्रियाँ हो/बन जाएँगे’ को सीधे सुरक्षित रखता है। युद्ध में साहस खो देने का प्राचीन मुहावरेदार आशय टिप्पणी में समझाया गया है, मुख्य पाठ में नहीं मिलाया गया।
- source_word: אוֹצְרֹתֶיהָ
  choice: उसके खज़ानों
  rationale: बहुवचन संज्ञा धन के भंडारों अथवा संचित संपदा को सूचित करती है। ‘खज़ानों’ सामान्य हिन्दी में दोनों पहलुओं को संक्षेप में व्यक्त करता है।
- source_word: וּבֻזָּזוּ
  choice: और वे लूट लिए जाएँगे
  rationale: निष्क्रिय बहुवचन क्रिया का संबंध सबसे स्वाभाविक रूप से खज़ानों से है; हिन्दी अनुवाद निष्क्रियता और युद्धजनित लूट, दोनों को बनाए रखता है।
theological_decisions:
- issue: לְנָשִׁים में लिंग-संबंधी प्राचीन युद्ध-मुहावरा
  choice: वे स्त्रियाँ बन जाएँगे
  alternative: वे स्त्रियों के समान हो जाएँगे / वे साहस खो बैठेंगे
  rationale: मुख्य पाठ इब्रानी के स्पष्ट लिंग-संबंधी शब्दों और उसकी असहज ऐतिहासिक अभिव्यक्ति को सुरक्षित रखता है। उसका संदर्भगत अर्थ—युद्ध में भयभीत होना या साहस खोना—पादटिप्पणी में दिया गया है, ताकि मूल के तनाव को चुपचाप समाप्त न किया जाए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और घोषणात्मक रखी गई है। दोहराया गया ‘तलवार ... पर चले’ भविष्यद्वाणी के संक्षिप्त न्याय-वचन की लय बनाए रखता है। पादटिप्पणी-चिह्न संबंधित पदों—‘मिले-जुले लोगों’ और ‘स्त्रियाँ बन जाएँगे’—के तुरंत बाद रखे गए हैं।
