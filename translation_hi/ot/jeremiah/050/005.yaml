    text: हिब्रू क्रियारूप व्याकरण की दृष्टि से कठिन है। इसका अर्थ “हम जुड़ जाएँ” लिया जा सकता है; इसमें “जोड़े जाएँ” का कर्मवाच्य भाव भी संभव है।
    reason: lexical_and_grammatical_alternative
