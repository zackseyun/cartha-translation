  yaml_path: translation/ot/jeremiah/050/005.yaml
  text: 'They will ask the way to Zion[a], with their faces turned toward it: ‘Come[b], let us join ourselves to Yahweh in an everlasting covenant that will not be forgotten.’'
translation:
  language: hi
  text: वे सिय्योन का मार्ग पूछेंगे; उनके मुख उसी ओर किए हुए होंगे। वे कहेंगे, “आओ, हम याहवे से जुड़ जाएँ[a]—एक ऐसी चिरस्थायी वाचा में जो भुलाई नहीं जाएगी।”[b]
  philosophy: optimal-equivalence
  footnotes:
