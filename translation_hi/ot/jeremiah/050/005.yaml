- source_word: לֹא תִשָּׁכֵחַ
  choice: जिसे भुलाया नहीं जाएगा
  rationale: निफ़अल का कर्मवाच्य अर्थ और स्त्रीलिंग ‘वाचा’ से उसका संबंध स्पष्ट रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: पाठ में वाचा का निजी ईश्वरीय नाम सीधे आया है; उसे उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- issue: וְנִלְווּ में सहभागिता का स्वर
  choice: हम ... जुड़ जाएँ
  alternative: अपने आपको ... जोड़ लें / उनसे जुड़ जाएँ
  rationale: ‘जुड़ना/जुड़ जाना’ निफ़अल की मध्यवाची या कर्मवाची खुलावट को अनावश्यक रूप से संकीर्ण नहीं करता और स्वेच्छापूर्ण वाचा-संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सामूहिक भविष्यवाणी-संबंधी स्वर रखा गया है। ‘मार्ग’, ‘वाचा’ और ‘चिरस्थायी’ जैसे परिचित बाइबलीय शब्द अर्थ की गंभीरता बनाए रखते हैं। प्रत्यक्ष कथन को स्पष्ट करने के लिए ‘वे कहेंगे’ जोड़ा गया है, जो प्रसंग से निहित है, न कि स्रोत का पृथक शब्द।
