reference: Jeremiah 27:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/עָבְד֤וּ אֹת/וֹ֙ כָּל הַ/גּוֹיִ֔ם וְ/אֶת בְּנ֖/וֹ וְ/אֶֽת בֶּן בְּנ֑/וֹ עַ֣ד בֹּא עֵ֤ת אַרְצ/וֹ֙ גַּם ה֔וּא וְ/עָ֤בְדוּ ב/וֹ֙ גּוֹיִ֣ם רַבִּ֔ים וּ/מְלָכִ֖ים גְּדֹלִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/007.yaml
  text: All the nations will serve him[a], and his son, and his grandson, until the time of his own land comes[c][b]; then many nations and great kings will make even him serve them.
translation:
  language: hi
  text: सभी जातियाँ उसकी, उसके बेटे की और उसके पोते की सेवा करेंगी, जब तक उसके अपने देश का समय न आ जाए[a]; तब बहुत-सी जातियाँ और बड़े-बड़े राजा उसे भी अपनी सेवा में लगा देंगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “जब तक उसके देश का समय न आ जाए”—अर्थात बाबेल के अपने देश से संबंधित नियत समय।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी का भाव है कि बहुत-सी जातियाँ और बड़े-बड़े राजा उसे अपनी सेवा में लगा देंगे; अधिक शाब्दिक रूप हो सकता है, “उसके द्वारा सेवा कराएँगे।”
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָבְדוּ אֹתוֹ
  choice: उसकी सेवा करेंगी
  rationale: राजनीतिक संदर्भ में עבד किसी शासक या साम्राज्य की अधीनता और सेवा को व्यक्त करता है; हिन्दी में यह स्वाभाविक और सटीक है।
- source_word: כָּל הַגּוֹיִם
  choice: सभी जातियाँ
  rationale: यहाँ גּוֹיִם राजनीतिक समुदायों या राष्ट्रों को दर्शाता है। बाइबलीय हिन्दी में ‘जातियाँ’ सुबोध है और धार्मिक रूप से आरोपित ‘अन्यजाति’ से बचता है।
- source_word: וְאֶת בְּנוֹ וְאֶת בֶּן בְּנוֹ
  choice: उसके बेटे और उसके पोते की
  rationale: शाब्दिक ‘उसके बेटे के बेटे’ का स्वाभाविक आधुनिक हिन्दी समतुल्य ‘उसके पोते’ है; राजवंशीय उत्तराधिकार सुरक्षित रहता है।
- source_word: עַד בֹּא עֵת אַרְצוֹ
  choice: जब तक उसके अपने देश का समय नहीं आ जाता
  rationale: संक्षिप्त इब्रानी वाक्यांश बाबेल के अपने देश से संबंधित नियत समय की ओर संकेत करता है। ‘अपने’ संबंध को स्पष्ट करता है, जबकि ‘समय’ की वास्तविक प्रकृति को मुख्य पाठ में अनावश्यक रूप से नहीं खोलता।
- source_word: גַּם הוּא
  choice: उससे भी
  rationale: 'גם הוא का जोर सत्ता-पलट पर है: वह स्वयं भी अधीन होकर सेवा करेगा। हिन्दी में ‘उससे भी’ इस बल को स्वाभाविक ढंग से रखता है।'
- source_word: וְעָבְדוּ בוֹ
  choice: अपनी सेवा करवाएँगे
  rationale: עבד के साथ ב यहाँ उसके द्वारा सेवा कराने अथवा उसे सेवा में लगाने का कारक भाव देता है, न कि उसकी सेवा करने का। यह अनुवाद सत्ता के उलटाव को स्पष्ट रखते हुए क्रिया की राजनीतिक सेवा-अधीनता को बचाता है।
- source_word: גּוֹיִם רַבִּים וּמְלָכִים גְּדֹלִים
  choice: बहुत-सी जातियाँ और बड़े-बड़े राजा
  rationale: यह इब्रानी समानांतरता और राजनीतिक विस्तार को सहज आधुनिक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: अंतिम खंड में बाबेल की स्थिति का उलटाव
  choice: नियत समय आने पर बहुत-सी जातियाँ और बड़े-बड़े राजा बाबेल के शासक से भी अपनी सेवा करवाएँगे।
  alternative: 'अधिक शाब्दिक रूप से: ‘बहुत-सी जातियाँ और बड़े-बड़े राजा उसके द्वारा अपने लिए सेवा कराएँगे/उसे सेवा में लगाएँगे।’'
  rationale: व्यापक संदर्भ बाबेल के अस्थायी प्रभुत्व के बाद उसके अधीन किए जाने की घोषणा करता है। וְעָבְדוּ בוֹ को कारक अर्थ में देना संदर्भ और व्याकरण दोनों के अनुकूल है, पर पादटिप्पणी इब्रानी की अभिव्यक्ति की बनावट को खुला रखती है।
- issue: ‘उसके देश का समय’ का आशय
  choice: मुख्य पाठ में ‘उसके अपने देश का समय’ रखकर नियत समय के स्वरूप को पूर्णतः व्याख्यायित नहीं किया गया।
  alternative: ‘उसके देश के दण्ड/विनाश का समय’
  rationale: इब्रानी केवल ‘उसके देश का समय’ कहती है। संदर्भ न्याय या अधीनता का संकेत देता है, लेकिन उसे मुख्य पाठ में जोड़ना मूल की संक्षिप्तता और तनाव को समय से पहले सुलझा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘सेवा करवाएँगे’ सत्ता और अधीनता के उलटाव को स्वाभाविक हिन्दी में व्यक्त करता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में क्रम से दिए गए हैं।
