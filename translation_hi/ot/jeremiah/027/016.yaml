- source_word: כֹּה אָמַר יְהוָה
  choice: याहवे यों कहता है
  rationale: मानक भविष्यद्वाणी-सूत्र को बनाए रखते हुए יְהוָה को उसके व्यक्तिगत नाम ‘याहवे’ से प्रस्तुत करता है।
- source_word: אַל תִּשְׁמְעוּ אֶל דִּבְרֵי נְבִיאֵיכֶם
  choice: अपने नबियों की बातें मत सुनो
  rationale: שׁמע אֶל का अर्थ केवल ध्वनि सुनना नहीं, बल्कि बात पर ध्यान देना या उसे मानना है; हिन्दी में यह निषेध स्वाभाविक रूप से वही भाव देता है।
- source_word: הַנִּבְּאִים לָכֶם
  choice: जो तुमसे यह भविष्यवाणी कर रहे हैं
  rationale: कृदन्त से व्यक्त चल रही गतिविधि और श्रोताओं की ओर निर्देशित कथन—दोनों को बनाए रखता है।
- source_word: הִנֵּה
  choice: देखो
  rationale: संकेत और ध्यान आकर्षित करने वाले बल का आधुनिक, गरिमापूर्ण हिन्दी रूप।
