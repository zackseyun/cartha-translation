- source_word: מוּשָׁבִים מִבָּבֶלָה
  choice: बाबुल से वापस लाए जा रहे हैं
  rationale: שׁוב के होफाल कृदन्त का कर्मवाच्य-प्रेरणार्थक भाव और कथित वर्तमान/आसन्न वापसी दोनों व्यक्त होते हैं।
- source_word: עַתָּה מְהֵרָה
  choice: अब शीघ्र ही
  rationale: दोनों क्रियाविशेषणों को बनाए रखते हुए हिन्दी में झूठे नबियों द्वारा जताई गई तात्कालिकता स्वाभाविक ढंग से व्यक्त करता है।
- source_word: שֶׁקֶר הֵמָּה נִבְּאִים לָכֶם
  choice: वे तुमसे झूठी भविष्यवाणी कर रहे हैं
  rationale: שֶׁקֶר को विधेयात्मक अर्थ में लेकर स्वाभाविक हिन्दी में भविष्यवाणी की असत्यता स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में वाचा-संबंधी व्यक्तिगत नाम सीधे उपस्थित है; ‘याहवे’ उसे किसी उपाधि में बदले बिना सुरक्षित रखता है।
- issue: झूठे नबियों की आसन्नता-संबंधी घोषणा
  choice: अब शीघ्र ही ... वापस लाए जा रहे हैं
  alternative: बहुत जल्द ... वापस लाए जाएँगे
  rationale: कृदन्त और ‘अब, शीघ्र’ की असामान्य तीव्रता को पूरी तरह भविष्यकाल में समतल नहीं किया गया; वैकल्पिक स्वाभाविक समझ पाद-टिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भविष्यद्वाणी-सूत्र में गरिमा रखी गई है, पर अनावश्यक संस्कृतनिष्ठता से बचा गया है। ‘प्रजा’, ‘नबी’, ‘भविष्यवाणी’, ‘भवन’ और ‘पात्र’ व्यापक रूप से समझ आने वाले बाइबलीय शब्द हैं।
