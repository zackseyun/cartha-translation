    rationale: In Hindi, “तुमसे” normally means ‘from you/with you,’ whereas the Hebrew לָכֶם is ‘to/for you.’ “जो तुम्हारे लिए भविष्यवाणी कर रहे हैं” retains the dative relationship and avoids the unintended sense.
