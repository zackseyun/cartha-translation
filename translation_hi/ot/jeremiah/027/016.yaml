base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/016.yaml
  text: 'And to the priests and to all this people I spoke[a], saying, “Thus says Yahweh: Do not listen to the words of your prophets who are prophesying to you, saying, ‘Behold, the vessels of the house of Yahweh are being brought back from Babylon now, quickly,’ for they are prophesying falsely to you.”'
translation:
  language: hi
  text: 'मैंने याजकों और इस सारी प्रजा से कहा, “याहवे यों कहता है: अपने नबियों की बातें मत सुनो, जो तुम्हारे लिए भविष्यवाणी कर रहे हैं और कह रहे हैं, ‘देखो, याहवे के भवन के पात्र अब शीघ्र ही[a] बाबुल से वापस लाए जा रहे हैं।’ क्योंकि वे तुम्हारे लिए झूठी भविष्यवाणी कर रहे हैं।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बहुत जल्द बाबुल से वापस लाए जाएँगे।” हिब्रू में शाब्दिक रूप से “अब, शीघ्र” है, जो झूठे नबियों के दावे की तात्कालिकता पर बल देता है।
    reason: מוּשָׁבִים और עַתָּה מְהֵרָה के वर्तमान/आसन्न अर्थ तथा अधिक स्वाभाविक भविष्यकालीन विकल्प को सुरक्षित रखना।
lexical_decisions:
