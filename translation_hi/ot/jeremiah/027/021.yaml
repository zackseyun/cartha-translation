base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/021.yaml
  text: 'For thus says Yahweh of hosts[a], the God of Israel, concerning the vessels that remain in the house of Yahweh, in the house of the king of Judah[b], and in Jerusalem:'
translation:
  language: hi
  text: 'क्योंकि सेनाओं के याहवे, इस्राएल के परमेश्वर, उन पात्रों के विषय में जो याहवे के भवन[a] में, यहूदा के राजा के भवन[b] में और यरूशलेम में बचे रह गए हैं, यों कहते हैं:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे का मन्दिर।”
    reason: lexical_alternative
  - marker: b
    text: या, “यहूदा के राजा का राजमहल।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इस संयोजक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כֹה אָמַר
  choice: यह कहते हैं
  rationale: भविष्यद्वक्ताओं के संदेश-सूत्र का वर्तमान और प्रभावकारी बल सहज आधुनिक हिन्दी में सुरक्षित रहता है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं के यहोवा
  rationale: व्यक्तिगत दिव्य नाम को लिप्यंतरित रखा गया है और צְבָאוֹת को उसके व्यापक सैन्य/स्वर्गीय आशय सहित ‘सेनाओं’ से व्यक्त किया गया है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर
  rationale: इब्रानी संबंधसूचक पदबंध का सीधा और स्वाभाविक अनुवाद।
- source_word: עַל
  choice: के विषय में
  rationale: यहाँ यह ईश्वरीय कथन का विषय प्रस्तुत करता है, विरोध का अर्थ नहीं।
- source_word: הַכֵּלִים הַנּוֹתָרִים
  choice: बचे हुए पात्रों
  rationale: मन्दिर-संदर्भ में כֵּלִים के लिए ‘पात्र’ स्थापित और पर्याप्त व्यापक शब्द है; participle पूर्व की लूट के बाद शेष वस्तुओं को दर्शाता है।
- source_word: בֵּית יְהוָה
  choice: यहोवा के भवन
  rationale: ‘भवन’ इब्रानी בַּיִת की शब्दावली और अगले पदबंध के साथ उसकी पुनरावृत्ति को बनाए रखता है; संदर्भतः यह मन्दिर है।
- source_word: בֵּית מֶלֶךְ יְהוּדָה
  choice: यहूदा के राजा के भवन
  rationale: मूल पाठ की ‘भवन’ वाली पुनरावृत्ति सुरक्षित है; संदर्भ में ‘राजमहल’ भी सम्भव है।
- source_word: וִירוּשָׁלִָם
  choice: और यरूशलेम में
  rationale: श्रृंखला में संयोजक और निहित स्थानवाचक संबंध को हिन्दी में स्पष्ट किया गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ के व्यक्तिगत दिव्य नाम को उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं किया गया। आधुनिक हिन्दी बाइबल-पाठकों के लिए परिचित लिप्यंतरण ‘यहोवा’ चुना गया, जबकि ‘याहवे’ अधिक प्रत्यक्ष शैक्षिक लिप्यंतरण है।
- issue: צְבָאוֹת की व्याप्ति
  choice: सेनाओं के
  alternative: सेनाधीश
  rationale: ‘सेनाओं के’ मूल बहुवचन संबंधसूचक संरचना और उसके स्वर्गीय तथा पृथ्वीगत व्यापक संकेत को बनाए रखता है; ‘सेनाधीश’ अर्थ को एक पदवी में समेट देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘भवन’ की पुनरावृत्ति मूल इब्रानी के अनुरूप जानबूझकर सुरक्षित रखी गई है, जबकि पादटिप्पणियाँ दोनों स्थानों का संदर्भ स्पष्ट करती हैं।
