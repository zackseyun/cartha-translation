  yaml_path: translation/ot/jeremiah/027/012.yaml
  text: And to Zedekiah king of Judah I spoke all these words[a], saying, “Bring your necks under the yoke of the king of Babylon, and serve him and his people[b], and live.”
translation:
  language: hi
  text: 'मैंने यहूदा के राजा सिदकिय्याह से इन सब बातों के अनुसार कहा: “अपनी गर्दनें बाबेल के राजा के जूए के नीचे ले आओ[a], और उसकी और उसकी प्रजा की सेवा करो, और जीवित रहो[b]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'और अधिक अक्षरशः: “अपनी गर्दनें बाबेल के राजा के जूए में ले आओ।”'
    reason: lexical_alternative
  - marker: b
    text: “और जीवित रहो” का अर्थ परिणाम के रूप में “तब तुम जीवित रहोगे” या उद्देश्य के रूप में “ताकि तुम जीवित रहो” भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבַּרְתִּי
  choice: मैंने ... कहीं
  rationale: पिएल रूप का अर्थ ‘बोलना/कहना’ है। हिन्दी में ‘बातें कहीं’ स्वाभाविक है और अगले לֵאמֹר को अलग से अनावश्यक ‘यह कहते हुए’ बनाए बिना उसका परिचय उद्धरण से हो जाता है।
- source_word: כְּכָל הַדְּבָרִים הָאֵלֶּה
  choice: ये सब बातें
  rationale: דברים का सीधा अर्थ ‘बातें/वचन’ है। यहाँ כְּ कथन की विषय-वस्तु अथवा अनुरूपता बताता है; हिन्दी में ‘ये सब बातें’ अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הָבִיאוּ אֶת צַוְּארֵיכֶם
  choice: अपनी गर्दनें ... ले आओ
  rationale: हिफ़ील आज्ञार्थक ‘ले आओ’ और बहुवचन ‘गर्दनें’ मूल रूपक तथा सामूहिक संबोधन को बनाए रखते हैं।
- source_word: בְּעֹל מֶלֶךְ בָּבֶל
  choice: बाबेल के राजा के जूए के नीचे
  rationale: בְּ का अक्षरशः अर्थ ‘में’ हो सकता है, पर जूए के रूपक के साथ आधुनिक हिन्दी में ‘जूए के नीचे’ स्वाभाविक और स्पष्ट है।
- source_word: וְעִבְדוּ אֹתוֹ וְעַמּוֹ
  choice: उसकी तथा उसकी प्रजा की सेवा करो
  rationale: עבד राजनीतिक अधीनता में सेवा करना दर्शाता है। ‘उसकी ... सेवा करो’ सीधे अर्थ को रखता है; עַמּוֹ के लिए ‘उसकी प्रजा’ राजकीय संदर्भ में स्वाभाविक है।
- source_word: וִחְיוּ
  choice: और जीवित रहो
  rationale: आज्ञार्थक रूप और वाव की संक्षिप्तता सुरक्षित रहती है; परिणाम अथवा उद्देश्य की सम्भावना को मुख्य पाठ में तय नहीं किया गया।
- source_word: צִדְקִיָּה
  choice: सिदकिय्याह
  rationale: हिन्दी बाइबलीय नाम-परंपरा के अनुरूप लिप्यंतरण।
- source_word: מֶלֶךְ יְהוּדָה
  choice: यहूदा के राजा
  rationale: सम्बन्धवाचक रचना का सीधा और स्वाभाविक हिन्दी रूप।
theological_decisions:
- issue: बाबेल के शासन के अधीन राजनीतिक समर्पण
  choice: आज्ञा को बाबेल के राजा और उसकी प्रजा की ठोस राजनीतिक सेवा के रूप में प्रस्तुत किया गया।
  alternative: इसे सामान्य नम्रता या केवल आत्मिक अधीनता के रूप में व्याख्यायित करना।
  rationale: पद ऐतिहासिक-राजनीतिक अधीनता की भविष्यद्वाणीपूर्ण आज्ञा देता है; अनुवाद को इस तनाव को नरम या आध्यात्मिकीकृत नहीं करना चाहिए।
- issue: וִחְיוּ में आज्ञा और परिणाम/उद्देश्य का सम्बन्ध
  choice: मुख्य पाठ में ‘और जीवित रहो’ रखा गया।
  alternative: ‘तब तुम जीवित रहोगे’ अथवा ‘ताकि तुम जीवित रहो’।
  rationale: हिब्रू रूप आज्ञार्थक है, जबकि क्रम परिणाम या उद्देश्य का भाव भी दे सकता है। मुख्य पाठ रूप को रखता है और टिप्पणी सम्भावित सम्बन्ध बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; स्वर गरिमापूर्ण पर सामान्य पाठक के लिए सुबोध है। ‘जूआ’, ‘सेवा करो’ और ‘जीवित रहो’ मूल की ठोस छवि, राजनीतिक आशय और संक्षिप्त आग्रह को बनाए रखते हैं।
