id: JER.27.11
reference: Jeremiah 27:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הַ/גּ֗וֹי אֲשֶׁ֨ר יָבִ֧יא אֶת צַוָּאר֛/וֹ בְּ/עֹ֥ל מֶֽלֶךְ בָּבֶ֖ל וַֽ/עֲבָד֑/וֹ וְ/הִנַּחְתִּ֤י/ו עַל אַדְמָת/וֹ֙ נְאֻם יְהוָ֔ה וַֽ/עֲבָדָ֖/הּ וְ/יָ֥שַׁב בָּֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/011.yaml
  text: But the nation that brings its neck under the yoke of the king of Babylon and serves him[a], I will let remain on its own land, declares Yahweh[b], and it will till it and dwell in it.
translation:
  language: hi
  text: परन्तु जो राष्ट्र अपनी गर्दन बाबेल के राजा के जूए के नीचे लाएगा और उसकी सेवा करेगा, उसे मैं उसकी अपनी भूमि पर रहने दूँगा—याहवे की यह घोषणा है—और वह उस पर खेती करेगा और उसमें निवास करेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַגּוֹי
  choice: जाति
  rationale: यहाँ राजनीतिक रूप से बाबेल के अधीन होने वाले जनसमूह या राष्ट्र का बोध है; आधुनिक हिन्दी बाइबलीय संदर्भ में ‘जाति’ इस सामूहिक अर्थ को संक्षेप में व्यक्त करती है।
- source_word: יָבִיא אֶת צַוָּארוֹ בְּעֹל
  choice: अपनी गर्दन ... जूए के नीचे लाएगी
  rationale: इब्रानी की ठोस अधीनता-वाली छवि को बनाए रखा गया है, उसे केवल ‘अधीन होगी’ कहकर सपाट नहीं किया गया।
- source_word: עֹל
  choice: जूआ
  rationale: राजनीतिक पराधीनता का केंद्रीय रूपक सुरक्षित रहता है।
- source_word: מֶלֶךְ בָּבֶל
  choice: बाबेल का राजा
  rationale: इब्रानी संबंधसूचक पदबंध का सीधा और प्रचलित हिन्दी रूप।
- source_word: וַעֲבָדוֹ
  choice: और उसकी सेवा करेगी
  rationale: यह बाबेल के राजा के प्रति राजनीतिक सेवा और अधीनता को व्यक्त करता है।
- source_word: וְהִנַּחְתִּיו עַל אַדְמָתוֹ
  choice: उसे मैं उसकी अपनी भूमि पर रहने दूँगा
  rationale: हिफ़ील क्रिया का भाव यहाँ उस जाति को उसकी भूमि में बने रहने देने का है; ‘अपनी’ स्वामित्व-सूचक प्रत्यय को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: भविष्यद्वक्ताओं का घोषणात्मक सूत्र सुरक्षित है और दिव्य नाम יהוה को ‘याहवे’ रूप में प्रस्तुत किया गया है।
- source_word: וַעֲבָדָהּ
  choice: उस भूमि पर खेती करेगी
  rationale: स्त्रीलिंग प्रत्यय भूमि की ओर संकेत करता है; भूमि के साथ עבד का कृषि-संदर्भित अर्थ ‘खेती करना’ स्वाभाविक और स्पष्ट है।
- source_word: וְיָשַׁב בָּהּ
  choice: और उसमें बसी रहेगी
  rationale: भूमि में निवास और निरंतर बने रहने—दोनों भावों को सहज आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिवाचक वाचा-नाम सीधे आया है; ‘याहवे’ उसे उपाधि में बदले बिना सुरक्षित रखता है।
- issue: वचन में निहित अधीनता और भूमि में बने रहने का संबंध
  choice: बाबेल की सेवा स्वीकार करने वाली जाति को अपनी भूमि में रहने और खेती करने दिया जाएगा
  alternative: राजनीतिक अधीनता को केवल सामान्य आज्ञाकारिता या आध्यात्मिक सेवा मानना
  rationale: संदर्भ और जूए का रूपक ऐतिहासिक-राजनीतिक पराधीनता बताते हैं; अनुवाद इस तनाव को बिना धार्मिक विस्तार जोड़े बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘जूआ’ मूल रूपक को सुरक्षित रखता है; ‘खेती करेगी’ भूमि के संदर्भ में अस्पष्ट ‘उसकी सेवा करेगी’ से अधिक स्वाभाविक है। किसी पादटिप्पणी की आवश्यकता नहीं पड़ी।
