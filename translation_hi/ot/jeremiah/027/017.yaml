source:
  edition: WLC
  text: אַל תִּשְׁמְע֣וּ אֲלֵי/הֶ֔ם עִבְד֥וּ אֶת מֶֽלֶךְ בָּבֶ֖ל וִֽ/חְי֑וּ לָ֧/מָּה תִֽהְיֶ֛ה הָ/עִ֥יר הַ/זֹּ֖את חָרְבָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/017.yaml
  text: Do not listen to them[a]. Serve the king of Babylon and live[b]. Why should this city become a ruin?
translation:
  language: hi
  text: उनकी बात मत सुनो[a]। बाबेल के राजा की सेवा करो और जीवित रहो। यह नगर क्यों उजाड़ हो जाए[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उनकी बात मत मानो।’ इब्रानी क्रिया का अर्थ सुनने के साथ-साथ ध्यान देना या मानना भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘खंडहर बन जाए?’ इब्रानी संज्ञा विनाश या उजड़ी हुई दशा को दर्शाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּשְׁמְעוּ אֲלֵיהֶם
  choice: उनकी बात मत सुनो
  rationale: שׁמע עם אֶל का अर्थ किसी की बात सुनना या उस पर ध्यान देना हो सकता है। यहाँ झूठे भविष्यद्वक्ताओं के संदेश को न मानने का भाव है; ‘उनकी बात मत सुनो’ आधुनिक हिन्दी में स्वाभाविक है और दोनों अर्थों की गुंजाइश रखता है।
- source_word: עִבְדוּ
  choice: सेवा करो
  rationale: यहाँ עבד बाबेल के राजा के अधीन होकर उसकी सेवा करने का राजनीतिक भाव रखता है। ‘सेवा करो’ मूल की व्यापकता और आदेशात्मक रूप को बनाए रखता है।
- source_word: אֶת מֶלֶךְ בָּבֶל
  choice: बाबेल के राजा की
  rationale: यह इब्रानी संबंध-वाचक पदबंध का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: וִחְיוּ
  choice: और जीवित रहो
  rationale: वाव से जुड़ा दूसरा आदेश परिणाम का भाव भी देता है। ‘और जीवित रहो’ मूल की संक्षिप्त समानांतर रचना को सुरक्षित रखता है।
- source_word: לָמָּה תִהְיֶה
  choice: क्यों ... हो जाए
  rationale: यह भावी विनाश के विषय में आलंकारिक प्रश्न है। ‘क्यों ... हो जाए’ संक्रमण और निवेदन दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הָעִיר הַזֹּאת
  choice: यह नगर
  rationale: यह संकेतवाचक रचना का स्पष्ट और गरिमापूर्ण हिन्दी रूप है।
- source_word: חָרְבָּה
  choice: उजाड़
  rationale: संज्ञा חָרְבָּה विनाश, उजाड़ या खंडहर हुई दशा को दर्शाती है। ‘उजाड़’ सामान्य हिन्दी में स्पष्ट है और नगर की विनष्ट अवस्था बताता है।
