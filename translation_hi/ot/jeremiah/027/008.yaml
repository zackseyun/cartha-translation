source:
  edition: WLC
  text: וְ/הָיָ֨ה הַ/גּ֜וֹי וְ/הַ/מַּמְלָכָ֗ה אֲשֶׁ֨ר לֹֽא יַעַבְד֤וּ אֹת/וֹ֙ אֶת נְבוּכַדְנֶאצַּ֣ר מֶֽלֶךְ בָּבֶ֔ל וְ/אֵ֨ת אֲשֶׁ֤ר לֹֽא יִתֵּן֙ אֶת צַוָּאר֔/וֹ בְּ/עֹ֖ל מֶ֣לֶךְ בָּבֶ֑ל בַּ/חֶרֶב֩ וּ/בָ/רָעָ֨ב וּ/בַ/דֶּ֜בֶר אֶפְקֹ֨ד עַל הַ/גּ֤וֹי הַ/הוּא֙ נְאֻם יְהוָ֔ה עַד תֻּמִּ֥/י אֹתָ֖/ם בְּ/יָדֽ/וֹ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/008.yaml
  text: And it shall be that the nation or the kingdom that will not serve him[a], Nebuchadnezzar king of Babylon, and that will not put its neck under the yoke of the king of Babylon, I will punish that nation with the sword, with famine, and with pestilence, declares Yahweh[c][b], until I have finished them by his hand.
translation:
  language: hi
  text: “और ऐसा होगा कि जो जाति या राज्य[a] बाबेल के राजा नबूकदनेस्सर की सेवा नहीं करेगा और बाबेल के राजा के जुए के नीचे अपनी गरदन नहीं रखेगा[b], उस जाति को मैं तलवार, अकाल और महामारी से दण्ड दूँगा,” याहवे की यह घोषणा है, “जब तक मैं नबूकदनेस्सर के हाथ से उनका अन्त न कर दूँ।”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “जाति और राज्य”; हिब्रू में ये दोनों राजनीतिक पद साथ रखे गए हैं और चेतावनी हर उस राज्य-व्यवस्था के लिए है जो बाबेल की अधीनता अस्वीकार करे।
    reason: lexical_alternative
  - marker: b
    text: “जुए के नीचे अपनी गरदन रखना” बाबेल के शासन के अधीन होने का चित्र है।
    reason: cultural_note
  - marker: c
    text: या, “जब तक मैं नबूकदनेस्सर के हाथ से उन्हें पूरी तरह नष्ट न कर दूँ।”
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: और ऐसा होगा
  rationale: यह भविष्य में आने वाले परिणाम का परिचय देता है और आधुनिक हिन्दी में भविष्यवाणी की गरिमा बनाए रखता है।
- source_word: הַגּוֹי וְהַמַּמְלָכָה
  choice: जो जाति या राज्य
  rationale: हिब्रू में दोनों पद ‘और’ से जुड़े हैं, पर चेतावनी वितरणात्मक है—जो भी राजनीतिक समुदाय अधीन न हो। हिन्दी में ‘या’ इस आशय को स्वाभाविक रूप से व्यक्त करता है; शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: יַעַבְדוּ אֹתוֹ אֶת נְבוּכַדְנֶאצַּר
  choice: बाबेल के राजा नबूकदनेस्सर की सेवा नहीं करेगा
  rationale: עבד यहाँ सामान्य श्रम नहीं, बल्कि साम्राज्यवादी शासक की राजनीतिक अधीनता और सेवा को दर्शाता है।
- source_word: יִתֵּן אֶת צַוָּארוֹ בְּעֹל
  choice: जुए के नीचे अपनी गरदन नहीं रखेगा
  rationale: अधीनता का ठोस हिब्रू रूपक सुरक्षित रखा गया है और आधुनिक हिन्दी में स्पष्ट है।
- source_word: בַּחֶרֶב וּבָרָעָב וּבַדֶּבֶר
  choice: तलवार, अकाल और महामारी से
  rationale: यिर्मयाह में बार-बार आने वाली न्याय की त्रयी को संक्षिप्त और परिचित हिन्दी शब्दों में सुरक्षित रखता है।
- source_word: אֶפְקֹד עַל
  choice: दण्ड दूँगा
  rationale: न्याय के प्रसंग में פקד על का सीधा अर्थ दण्ड देना है।
- source_word: נְאֻם יְהוָה
  choice: याहवे की यह घोषणा है
  rationale: यह भविष्यवाणी का औपचारिक सूत्र है; ‘घोषणा’ उसके अधिकारपूर्ण स्वर को बनाए रखता है।
- source_word: עַד תֻּמִּי אֹתָם
  choice: जब तक ... उनका अन्त न कर दूँ
  rationale: תמם यहाँ किसी प्रक्रिया को पूर्ण करके अन्त तक पहुँचाने का संकेत देता है। यह अनुवाद विनाश की गंभीरता रखता है, पर उसकी विधि को मूल से अधिक विशिष्ट नहीं बनाता।
- source_word: בְּיָדוֹ
  choice: नबूकदनेस्सर के हाथ से
  rationale: हिब्रू का ‘उसके हाथ से’ साधन अथवा कर्तृत्व का मुहावरा है। हिन्दी में संभावित अस्पष्टता दूर करने के लिए निकटतम अभिप्रेत व्यक्ति का नाम दोहराया गया है, जबकि ‘हाथ से’ का स्रोत-रूपक सुरक्षित है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है। उसका लिप्यंतरण नाम को सामान्य उपाधि में बदलने से बचाता है।
- issue: बाबेल की अधीनता और ईश्वरीय दण्ड का सम्बन्ध
  choice: पद के कारणात्मक क्रम को बिना नरम किए रखा गया है
  alternative: इसे केवल राजनीतिक पूर्वानुमान के रूप में व्यक्त करना
  rationale: वक्ता स्वयं तलवार, अकाल और महामारी से दण्ड देने की घोषणा करता है और नबूकदनेस्सर को अपना साधन बताता है; अनुवाद इस धार्मिक तनाव को यथावत रखता है।
- issue: עַד תֻּמִּי की तीव्रता
  choice: उनका अन्त न कर दूँ
  alternative: उन्हें पूरी तरह नष्ट न कर दूँ
  rationale: मूल क्रिया पूर्णता अथवा अन्त तक पहुँचाने को व्यक्त करती है। चुना हुआ रूप कठोर परिणाम बनाए रखता है, लेकिन विनाश की रीति या सीमा को अनावश्यक रूप से अधिक निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गंभीर भविष्यवाणीपरक शैली के साथ रखी गई है। ‘गरदन’ और ‘जुआ’ जैसे ठोस शब्द मूल रूपक को साधारण पाठक के लिए सुबोध रखते हैं। जाति/राज्य के सामूहिक कर्ता के साथ एकवचन क्रिया हिन्दी की स्वाभाविक संरचना के अनुसार है; अन्त में ‘उनका’ सामूहिक समुदायों की ओर संकेत करता है।
