  terminology: The established Hindi biblical forms एदोम, मोआब, अम्मोनी, सोर, सीदोन, यरूशलेम, and सिदकिय्याह are suitable. ‘दूत’ correctly retains the broad sense of מַלְאָכִים without over-specifying diplomatic office.
