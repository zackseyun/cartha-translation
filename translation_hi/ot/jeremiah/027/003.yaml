  revised_text: और उन्हें एदोम के राजा, मोआब के राजा, अम्मोनियों के राजा[a], सोर के राजा और सीदोन के राजा के पास उन दूतों के हाथों भेज दो, जो यरूशलेम में यहूदा के राजा सिदकिय्याह के पास आ रहे हैं।
