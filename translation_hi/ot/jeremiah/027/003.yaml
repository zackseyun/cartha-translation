id: JER.27.3
reference: Jeremiah 27:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/שִׁלַּחְתָּ/ם֩ אֶל מֶ֨לֶךְ אֱד֜וֹם וְ/אֶל מֶ֣לֶךְ מוֹאָ֗ב וְ/אֶל מֶ֨לֶךְ֙ בְּנֵ֣י עַמּ֔וֹן וְ/אֶל מֶ֥לֶךְ צֹ֖ר וְ/אֶל מֶ֣לֶךְ צִיד֑וֹן בְּ/יַ֤ד מַלְאָכִים֙ הַ/בָּאִ֣ים יְרוּשָׁלִַ֔ם אֶל צִדְקִיָּ֖הוּ מֶ֥לֶךְ יְהוּדָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/003.yaml
  text: And send them to the king of Edom[a], the king of Moab, the king of the Ammonites, the king of Tyre, and the king of Sidon, by the hand of the messengers who are coming to Jerusalem to Zedekiah king of Judah.
translation:
  language: hi
  text: और उन्हें एदोम के राजा, मोआब के राजा, अम्मोनियों के राजा[a], सोर के राजा और सीदोन के राजा के पास उन दूतों के हाथों भेज दो, जो यरूशलेम में यहूदा के राजा सिदकिय्याह के पास आ रहे हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, ‘अम्मोन के पुत्रों का राजा’; अर्थात, ‘अम्मोनियों का राजा।’
    reason: मूल जातीय अभिव्यक्ति के शाब्दिक रूप को सुरक्षित रखना।
lexical_decisions:
- source_word: וְשִׁלַּחְתָּם
  choice: और उन्हें ... भेजना
  rationale: पिएल पूर्ण रूप यहाँ निर्देशों की शृंखला में आज्ञार्थक बल रखता है। हिंदी में ‘भेजना’ मौखिक निर्देश की स्वाभाविक और स्पष्ट शैली है; ‘और’ क्रम-संबंध बनाए रखता है।
- source_word: מֶלֶךְ
  choice: '... के राजा'
  rationale: हर देश या नगर के नाम के साथ रचनात्मक संबंध को स्वाभाविक हिंदी में ‘के राजा’ से व्यक्त किया गया है और सूची में इसकी पुनरावृत्ति रखी गई है।
- source_word: אֱדוֹם / מוֹאָב / צֹר / צִידוֹן
  choice: एदोम / मोआब / सोर / सीदोन
  rationale: ये आधुनिक हिंदी बाइबल-परंपरा में पहचाने जाने योग्य प्रचलित नाम-रूप हैं।
- source_word: בְּנֵי עַמּוֹן
  choice: अम्मोनी
  rationale: शाब्दिक अर्थ ‘अम्मोन के पुत्र’ है, पर इस राजनयिक सूची में यह जातीय नाम है; ‘अम्मोनी’ आधुनिक हिंदी में अधिक स्वाभाविक है। शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: בְּיַד
  choice: दूतों के हाथ
  rationale: हिब्रू मुहावरे में माध्यम/एजेंसी का भाव है। ‘के हाथ’ भविष्यद्वाणी की गरिमामय शैली और मूल बिंब दोनों को बनाए रखता है।
- source_word: מַלְאָכִים
  choice: दूत
  rationale: शब्द का मूल अर्थ संदेशवाहक है। प्रसंग राजनयिक प्रतिनिधियों का है, पर ‘राजदूत’ कहने से पद को अनावश्यक रूप से अधिक निश्चित किया जाता; इसलिए व्यापक ‘दूत’ चुना गया।
- source_word: הַבָּאִים
  choice: जो ... आ रहे हैं
  rationale: संज्ञीकृत कृदंत की जारी प्रक्रिया को वर्तमान प्रगतिशील अभिव्यक्ति से दर्शाया गया है।
- source_word: אֶל צִדְקִיָּהוּ
  choice: सिदकिय्याह के पास
  rationale: אֶל यहाँ व्यक्तिवाचक गंतव्य बताता है; हिंदी में व्यक्ति के संदर्भ में ‘के पास’ स्वाभाविक है।
theological_decisions:
- issue: בְּנֵי עַמּוֹן का जातीय और लिंग-सूचक रूप
  choice: मुख्य पाठ में ‘अम्मोनियों’, पादटिप्पणी में ‘अम्मोन के पुत्र’
  alternative: मुख्य पाठ में ‘अम्मोन के पुत्रों’
  rationale: राजाओं और राष्ट्रों की इस सूची में यह स्थापित जातीय पद है, न कि केवल जैविक पुरुष वंशजों पर बल देने वाला कथन। मुहावरे का शाब्दिक रूप पादटिप्पणी में देकर स्रोत की संरचना भी दिखाई गई है और मुख्य पाठ को स्वाभाविक रखा गया है।
- issue: בְּיַד में एजेंसी का मुहावरा
  choice: ‘दूतों के हाथ’
  alternative: ‘दूतों के द्वारा’
  rationale: दोनों अर्थतः संभव हैं; ‘के हाथ’ मूल हिब्रू बिंब को बनाए रखते हुए हिंदी में समझने योग्य और गरिमामय है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, गरिमामय किंतु सरल रखी गई है। देश और नगर के पारंपरिक हिंदी नाम-रूप अपनाए गए हैं। लंबी सूची की हिब्रू समानांतर संरचना को बनाए रखते हुए हिंदी वाक्यक्रम स्वाभाविक किया गया है।
