  text: וְ/עַתָּ֗ה אָֽנֹכִי֙ נָתַ֨תִּי֙ אֶת כָּל הָ/אֲרָצ֣וֹת הָ/אֵ֔לֶּה בְּ/יַ֛ד נְבוּכַדְנֶאצַּ֥ר מֶֽלֶךְ בָּבֶ֖ל עַבְדִּ֑/י וְ/גַם֙ אֶת חַיַּ֣ת הַ/שָּׂדֶ֔ה נָתַ֥תִּי ל֖/וֹ לְ/עָבְדֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/006.yaml
  text: And now I have given all these lands into the hand of Nebuchadnezzar king of Babylon[a], my servant[b]; and I have also given him the beasts of the field to serve him.
translation:
  language: hi
  text: और अब मैं इन सभी देशों को बाबेल के राजा नबूकदनेस्सर[a], अपने सेवक[b], के हाथ में दे चुका हूँ; मैदान के जंगली पशुओं को भी मैंने उसकी सेवा करने के लिए उसे दे दिया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस नाम का एक अन्य प्रचलित लिप्यंतरण ‘नबूकदरेस्सर’ है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘अपने सेवक’ का अर्थ है कि परमेश्वर नबूकदनेस्सर को अपने उद्देश्य के साधन के रूप में काम में ले रहा है; इसका अर्थ उसके चरित्र या सभी कामों को नैतिक स्वीकृति देना नहीं है।
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: और अब
  rationale: संयोजक ו और कालवाचक עַתָּה दोनों को स्वाभाविक हिन्दी में व्यक्त करता है और वर्तमान ईश्वरीय घोषणा को पिछले प्रसंग से जोड़ता है।
- source_word: אָנֹכִי נָתַתִּי
  choice: मैं ... दे चुका हूँ
  rationale: स्वतंत्र सर्वनाम से कर्ता पर बल और पूर्ण क्रिया के पूरे हो चुके, वर्तमानतः प्रभावी कार्य—दोनों को व्यक्त करता है।
- source_word: כָּל הָאֲרָצוֹת הָאֵלֶּה
  choice: इन सभी देशों को
  rationale: सन्दर्भ में यह आसपास के राजनीतिक भूभागों और राज्यों को सूचित करता है; आधुनिक हिन्दी में ‘देश’ स्पष्ट और सहज है।
- source_word: בְּיַד
  choice: के हाथ में
  rationale: नियंत्रण या अधिकार सौंपने वाले इब्रानी मुहावरे का बिंब सुरक्षित रखता है और हिन्दी में भी स्वाभाविक है।
- source_word: נְבוּכַדְנֶאצַּר מֶלֶךְ בָּבֶל
  choice: बाबेल के राजा नबूकदनेस्सर
  rationale: राजकीय उपाधि और राज्य को स्पष्ट रखते हुए हिन्दी बाइबलीय परम्परा में परिचित नाम-रूप अपनाया गया है।
- source_word: עַבְדִּי
  choice: अपने सेवक
  rationale: यहाँ राजा की सामाजिक दासता नहीं, बल्कि परमेश्वर के उद्देश्य के साधन के रूप में उसकी भूमिका प्रमुख है; ‘सेवक’ इस अर्थ को बिना धार्मिक अनुमोदन जोड़े सुरक्षित रखता है।
- source_word: חַיַּת הַשָּׂדֶה
  choice: मैदान के जंगली जानवरों
  rationale: सामूहिक पद भूमि पर रहने वाले वन्य पशुओं को दर्शाता है; यह अनुवाद इब्रानी बिंब और आशय दोनों को स्पष्ट करता है।
- source_word: נָתַתִּי לוֹ לְעָבְדוֹ
  choice: मैंने उसके अधीन कर दिया है कि वे उसकी सेवा करें
  rationale: ‘देने’ के साथ निहित अधिकार-सौंपने का अर्थ तथा उद्देश्य/परिणाम बताने वाले infinitive—दोनों को सहज हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: एक गैर-इस्राएली राजा को परमेश्वर का ‘सेवक’ कहना
  choice: अपने सेवक
  alternative: अपने दास
  rationale: मूल पाठ बाबेल के राजा को परमेश्वर के शासनकारी उद्देश्य का साधन कहता है। ‘सेवक’ इस तनावपूर्ण दावे को बनाए रखता है, पर इससे उसके चरित्र या कर्मों के नैतिक अनुमोदन का निष्कर्ष नहीं जोड़ा जाता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘के हाथ में’ मूल मुहावरे को बनाए रखता है, जबकि पशुओं के विषय में ‘अधीन कर दिया’ उसके निहित अधिकार-संबंध को स्पष्ट करता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
