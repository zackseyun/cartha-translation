  text: אָנֹכִ֞י עָשִׂ֣יתִי אֶת הָ/אָ֗רֶץ אֶת הָ/אָדָ֤ם וְ/אֶת הַ/בְּהֵמָה֙ אֲשֶׁר֙ עַל פְּנֵ֣י הָ/אָ֔רֶץ בְּ/כֹחִ/י֙ הַ/גָּד֔וֹל וּ/בִ/זְרוֹעִ֖/י הַ/נְּטוּיָ֑ה וּ/נְתַתִּ֕י/הָ לַ/אֲשֶׁ֖ר יָשַׁ֥ר בְּ/עֵינָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/005.yaml
  text: I myself made the earth[a], mankind, and the animals that are on the face of the earth, by my great power and by my outstretched arm, and I give it to whomever is right in my eyes.
translation:
  language: hi
  text: मैंने स्वयं पृथ्वी, मनुष्य[a] और पृथ्वी की सतह पर रहनेवाले पशुओं को अपनी महान सामर्थ्य और अपनी फैलाई हुई भुजा से बनाया, और मैं पृथ्वी उसे देता हूँ जिसे मैं अपनी दृष्टि में उचित समझता हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मानवजाति’; इब्रानी में शब्द एकवचन है, पर यहाँ वह पूरी मानवजाति का प्रतिनिधित्व कर सकता है।
    reason: הָאָדָם के जातिवाचक एकवचन और सामूहिक अर्थ को स्पष्ट करना।
lexical_decisions:
- source_word: אָנֹכִי
  choice: मैंने स्वयं
  rationale: स्वतंत्र सर्वनाम क्रिया में पहले से निहित कर्ता पर बल देता है; ‘स्वयं’ उस बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: עָשִׂיתִי
  choice: बनाया है
  rationale: עשה का सामान्य अर्थ ‘बनाना’ है। ‘सृष्टि की’ कहना मूल में प्रयुक्त क्रिया से अधिक विशिष्ट सृष्टि-शब्दावली जोड़ देता।
- source_word: הָאָרֶץ
  choice: पृथ्वी
  rationale: मनुष्य और पृथ्वी पर रहनेवाले पशुओं के साथ यह व्यापक सृष्टि-संदर्भ है, इसलिए स्थानीय ‘देश/भूमि’ की अपेक्षा ‘पृथ्वी’ उपयुक्त है।
- source_word: הָאָדָם
  choice: मनुष्य
  rationale: संज्ञा इब्रानी में एकवचन है, पर यहाँ समूची मानवजाति का प्रतिनिधित्व करती है। हिन्दी का ‘मनुष्य’ एकवचन रूप और जातिवाचक अर्थ दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַבְּהֵמָה
  choice: पशुओं
  rationale: इब्रानी एकवचन सामूहिक अर्थ रखता है; हिन्दी में बहुवचन ‘पशुओं’ इस व्यापक सामूहिक अर्थ को सहजता से व्यक्त करता है।
- source_word: אֲשֶׁר עַל־פְּנֵי הָאָרֶץ
  choice: पृथ्वी की सतह पर रहनेवाले
  rationale: ‘सतह पर’ मूल मुहावरे ‘पृथ्वी के मुख पर’ का अर्थ स्पष्ट रखता है; ‘रहनेवाले’ हिन्दी में संबंधवाचक वाक्यांश को स्वाभाविक बनाता है।
- source_word: בְּכֹחִי הַגָּדוֹל
  choice: अपनी महान सामर्थ्य से
  rationale: उपसर्ग ב यहाँ साधन प्रकट करता है; ‘सामर्थ्य’ गरिमापूर्ण और स्पष्ट हिन्दी है।
- source_word: וּבִזְרוֹעִי הַנְּטוּיָה
  choice: और अपनी बढ़ाई हुई भुजा से
  rationale: यह परमेश्वर की सक्रिय शक्ति का मानवरूपी बिंब है। शाब्दिक बिंब को बनाए रखा गया है, न कि केवल ‘शक्ति’ कहकर समतल किया गया।
- source_word: וּנְתַתִּיהָ
  choice: और मैं उसे ... दे देता हूँ
  rationale: स्त्रीलिंग कर्म-प्रत्यय का संकेत ‘पृथ्वी’ की ओर है। वर्तमान सामान्य रूप इस प्रसंग में परमेश्वर के निरंतर सार्वभौम अधिकार को व्यक्त करता है।
- source_word: לַאֲשֶׁר יָשַׁר בְּעֵינָי
  choice: जिसे अपनी दृष्टि में उचित समझता हूँ
  rationale: यह इब्रानी मुहावरा वक्ता के निर्णय में उचित या अनुकूल होने को व्यक्त करता है। हिन्दी में ‘दृष्टि में उचित समझना’ अर्थ और दृष्टिकोण दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: सृष्टि-संदर्भ में הָאָדָם का जातिवाचक एकवचन
  choice: मनुष्य
  alternative: मानवजाति
  rationale: ‘मनुष्य’ मूल के एकवचन रूप और पूरी मानव जाति के प्रतिनिधि अर्थ दोनों को रखता है; पादटिप्पणी सामूहिक अर्थ स्पष्ट करती है।
- issue: יָשַׁר בְּעֵינָי में परमेश्वर के निर्णय का स्वरूप
  choice: जिसे अपनी दृष्टि में उचित समझता हूँ
  alternative: जो मेरी आँखों में ठीक है / जो मुझे प्रसन्न करता है
  rationale: चयन परमेश्वर के सार्वभौम निर्णय को व्यक्त करता है, लेकिन मुहावरे को केवल भावनात्मक प्रसन्नता या किसी व्यक्ति की नैतिक धार्मिकता तक सीमित नहीं करता।
- issue: וּנְתַתִּיהָ का कालगत मूल्य
  choice: दे देता हूँ
  alternative: मैंने दे दी / मैं देता हूँ
  rationale: संदर्भ में कथन केवल अतीत की एक घटना नहीं, पृथ्वी को सौंपने के परमेश्वर के सामान्य सार्वभौम अधिकार की घोषणा है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। ‘बढ़ाई हुई भुजा’ जैसे मूल बिंब को सुरक्षित रखा गया है, जबकि ‘पृथ्वी के मुख पर’ को अधिक स्वाभाविक ‘पृथ्वी की सतह पर’ किया गया है।
