  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। भविष्यसूचक घोषणा के औपचारिक स्वर को डैश से अलग रखा गया है। मूल के उद्देश्य/परिणाम संबंध की वास्तविक अस्पष्टता को मुख्य पाठ में परिणामगत रूप देकर और निर्णय-टिप्पणी में वैकल्पिक उद्देश्यगत अर्थ दर्ज करके सुरक्षित रखा गया है।
