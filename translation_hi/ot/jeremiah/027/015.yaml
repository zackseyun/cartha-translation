base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/015.yaml
  text: For I did not send them[a], declares Yahweh, and they are prophesying falsely in my name, so that I may drive you out[b], and you will perish—you and the prophets who are prophesying to you.
translation:
  language: hi
  text: क्योंकि मैंने उन्हें नहीं भेजा—याहवे की यह घोषणा है—और वे मेरे नाम से झूठी भविष्यवाणी कर रहे हैं, ताकि मैं तुम्हें देश से निकाल दूँ[a], और तुम नष्ट हो जाओ—तुम और वे भविष्यवक्ता जो तुम्हें भविष्यवाणी कर रहे हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ताकि मैं तुम्हें दूर कर दूँ” या “निर्वासित कर दूँ।” इब्रानी क्रिया का अर्थ दूर धकेलना, निकाल देना, या निर्वासित करना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ स्वाभाविक और स्पष्ट है।
- source_word: לֹא שְׁלַחְתִּים
  choice: मैंने उन्हें नहीं भेजा है
  rationale: Qal पूर्ण रूप और तृतीय पुरुष बहुवचन कर्म-प्रत्यय को स्पष्ट रखता है; वर्तमान पूर्ण काल उन भविष्यद्वक्ताओं के वर्तमान दावे से संबंध बनाए रखता है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: भविष्यसूचक घोषणा-सूत्र की औपचारिकता बनाए रखते हुए יְהוָה को व्यक्तिवाचक वाचा-नाम ‘याहवे’ के रूप में प्रस्तुत किया गया है।
- source_word: וְהֵם נִבְּאִים בִּשְׁמִי לַשָּׁקֶר
  choice: फिर भी वे मेरे नाम से झूठी भविष्यवाणी कर रहे हैं
  rationale: וְ का प्रसंगगत विरोध ‘फिर भी’ से स्वाभाविक रूप में व्यक्त होता है; participle की जारी क्रिया और לַשָּׁקֶר का असत्य भाव सुरक्षित है।
- source_word: לְמַעַן הַדִּיחִי אֶתְכֶם
  choice: इसका परिणाम यह होगा कि मैं तुम्हें निकाल दूँगा
  rationale: לְמַעַן उद्देश्य अथवा परिणाम दोनों का संकेत दे सकता है। यहाँ झूठे भविष्यवक्ताओं को परमेश्वर द्वारा इसी उद्देश्य से भेजे जाने का अर्थ देने से बचते हुए परिणामगत संबंध स्पष्ट किया गया है, और נדח का निर्वासन-संदर्भ भी बना रहता है।
- source_word: וַאֲבַדְתֶּם
  choice: और तुम नष्ट हो जाओगे
  rationale: यह भविष्यसूचक क्रम में भावी विनाश को व्यक्त करता है; ‘नष्ट हो जाओगे’ मृत्यु या किसी एक विशेष प्रकार के विनाश तक अर्थ को सीमित नहीं करता।
- source_word: הַנְּבִאִים הַנִּבְּאִים לָכֶם
  choice: वे भविष्यद्वक्ता भी जो तुम्हारे लिए भविष्यवाणी कर रहे हैं
  rationale: संज्ञा और participle की पुनरुक्ति का बल तथा जारी गतिविधि रखी गई है। לָכֶם को ‘तुम्हारे लिए’ कहना उनके श्रोताओं की ओर निर्देशित भविष्यवाणी को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में वाचा-नाम प्रत्यक्ष है; लिप्यंतरण उसे किसी उपाधि से प्रतिस्थापित किए बिना सुरक्षित रखता है।
- issue: לְמַעַן में उद्देश्य और परिणाम का संबंध
  choice: इसका परिणाम यह होगा कि
  alternative: ताकि मैं तुम्हें निकाल दूँ
  rationale: ‘ताकि’ मूल की उद्देश्यगत धार को अधिक सीधे रखता है, पर हिन्दी में उससे यह भ्रम हो सकता है कि याहवे ने झूठी भविष्यवाणी को स्वयं अधिकृत किया। परिणामगत अनुवाद व्याकरण की संभावित परिणामी शक्ति को रखता है और प्रसंग के कथन—‘मैंने उन्हें नहीं भेजा’—से मेल खाता है।
- issue: झूठे भविष्यद्वक्ताओं की गतिविधि और दैवी न्याय
  choice: झूठी गतिविधि उनकी है; निष्कासन दैवी न्याय का परिणाम है
  alternative: परमेश्वर ने उन्हें झूठ बोलने के उद्देश्य से कार्यरत किया
  rationale: पद स्वयं उनके भेजे जाने का स्पष्ट निषेध करता है। अनुवाद इस तनाव को बनाए रखता है कि उनकी अनधिकृत भविष्यवाणी अंततः श्रोताओं और भविष्यद्वक्ताओं दोनों पर न्याय लाती है।
