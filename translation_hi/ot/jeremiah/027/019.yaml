id: JER.27.19
reference: Jeremiah 27:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֣י כֹ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת אֶל הָֽ/עַמֻּדִ֔ים וְ/עַל הַ/יָּ֖ם וְ/עַל הַ/מְּכֹנ֑וֹת וְ/עַל֙ יֶ֣תֶר הַ/כֵּלִ֔ים הַ/נּוֹתָרִ֖ים בָּ/עִ֥יר הַ/זֹּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/019.yaml
  text: 'For thus says Yahweh of Armies concerning the pillars[a], the Sea, the stands[b], and the rest of the vessels that remain in this city:'
translation:
  language: hi
  text: 'क्योंकि सेनाओं का यहोवा उन खम्भों, समुद्र[a], आधारों[b] और उन शेष वस्तुओं के विषय में, जो इस नगर में रह गई हैं, यह कहता है:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘समुद्र’ मन्दिर की सामग्री में काँसे का बना हुआ विशाल हौद था।
    reason: cultural_note
  - marker: b
    text: या, ‘टेकों’।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है और हिन्दी में प्रसंग-संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כֹה אָמַר
  choice: यह कहता है
  rationale: यह नबूवत का मानक सन्देशवाहक-सूत्र है; वर्तमानकालीन हिन्दी रूप पवित्रशास्त्रीय कथन को स्वाभाविक रखता है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम को ‘यहोवा’ के रूप में रखते हुए צְבָאוֹת के ठोस बहुवचन अर्थ को ‘सेनाओं’ से व्यक्त किया गया है।
- source_word: אֶל ... וְעַל
  choice: के विषय में
  rationale: यहाँ पूर्वसर्ग निर्जीव वस्तुओं को सीधे सम्बोधित नहीं करते, बल्कि आने वाली घोषणा का विषय बताते हैं।
- source_word: הָעַמֻּדִים
  choice: उन खम्भों
  rationale: यह मन्दिर के स्थापत्य-सम्बन्धी खम्भों के लिए स्पष्ट और प्रचलित हिन्दी शब्द है।
- source_word: הַיָּם
  choice: समुद्र
  rationale: यह मन्दिर के विशाल हौद का विशिष्ट नाम है; मूल का संक्षिप्त नाम बनाए रखा गया है और सांस्कृतिक जानकारी पादटिप्पणी में दी गई है।
- source_word: הַמְּכֹנוֹת
  choice: आधारों
  rationale: यह मन्दिर के पात्रों से जुड़े सहायक ढाँचों या टेकों को दर्शाता है; ‘आधार’ अर्थ को बिना अनावश्यक विशिष्टीकरण के स्पष्ट करता है।
- source_word: יֶתֶר הַכֵּלִים
  choice: शेष वस्तुओं
  rationale: כֵּלִים यहाँ मन्दिर की सामग्री के लिए व्यापक शब्द है; ‘वस्तुएँ’ हिन्दी में उसकी व्यापकता बनाए रखता है।
- source_word: הַנּוֹתָרִים
  choice: जो ... रह गई हैं
  rationale: इब्रानी कृदन्त को स्वाभाविक हिन्दी सम्बन्धवाचक उपवाक्य में व्यक्त किया गया है।
- source_word: בָּעִיר הַזֹּאת
  choice: इस नगर में
  rationale: यह यरूशलेम को सूचित करने वाला सीधा स्थानवाचक वाक्यांश है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम स्पष्ट रूप से उपस्थित है; हिन्दी में प्रचलित लिप्यन्तरण ‘यहोवा’ उसे सामान्य उपाधि में बदलने से बचाता है।
- issue: ईश्वरीय उपाधि צְבָאוֹת का अनुवाद
  choice: सेनाओं का
  alternative: स्वर्गीय सेनाओं का; सबाओं का
  rationale: ‘सेनाओं का’ मूल के ठोस बहुवचन और सैन्य भाव को समझने योग्य हिन्दी में बनाए रखता है, जबकि ‘स्वर्गीय’ मूल में प्रत्यक्ष रूप से नहीं है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण परन्तु सहज रखी गई है। वाक्य के अन्त का द्विबिन्दु अगले पदों में आने वाली यहोवा की घोषणा से इसका सम्बन्ध दिखाता है।
