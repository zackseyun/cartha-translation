id: JER.27.10
reference: Jeremiah 27:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֣י שֶׁ֔קֶר הֵ֖ם נִבְּאִ֣ים לָ/כֶ֑ם לְמַ֨עַן הַרְחִ֤יק אֶתְ/כֶם֙ מֵ/עַ֣ל אַדְמַתְ/כֶ֔ם וְ/הִדַּחְתִּ֥י אֶתְ/כֶ֖ם וַ/אֲבַדְתֶּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/010.yaml
  text: For they are prophesying lies to you[a], in order to remove you from your land; and I will drive you out[c][b], and you will perish.
translation:
  language: hi
  text: क्योंकि वे तुम्हारे लिए झूठी भविष्यवाणी कर रहे हैं[a], ताकि तुम्हें तुम्हारी भूमि से दूर करें; और मैं तुम्हें निकाल दूँगा[b], और तुम नष्ट हो जाओगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “झूठ” या “मिथ्या बात।”
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी में यहाँ कर्ता स्पष्ट रूप से परमेश्वर है: “मैं तुम्हें निकाल दूँगा, और तुम नष्ट हो जाओगे।”'
    reason: agency_clarification
lexical_decisions:
- source_word: שֶׁקֶר
  choice: झूठी भविष्यवाणी
  rationale: שֶׁקֶר का अर्थ झूठ या मिथ्या बात है। हिंदी में נִבְּאִים के साथ ‘झूठी भविष्यवाणी कर रहे हैं’ स्वाभाविक है और छलपूर्ण संदेश का भाव स्पष्ट रखता है।
- source_word: נִבְּאִים לָכֶם
  choice: तुमसे ... भविष्यवाणी कर रहे हैं
  rationale: נבא का निफ़ाल कृदंत यहाँ चल रही क्रिया व्यक्त करता है। ‘कर रहे हैं’ उस अपूर्ण/निरंतर पक्ष को दर्शाता है; ‘तुमसे’ संबोधन और संदेश-प्रेषण दोनों के लिए स्वाभाविक हिंदी है।
- source_word: לְמַעַן
  choice: ताकि
  rationale: यह उद्देश्य अथवा उसके लक्षित परिणाम को सूचित करता है। ‘ताकि’ आधुनिक हिंदी में संक्षिप्त और स्पष्ट है।
- source_word: הַרְחִיק אֶתְכֶם מֵעַל אַדְמַתְכֶם
  choice: तुम्हें तुम्हारी भूमि से दूर कर दें
  rationale: רחק का हिफ़ील दूरी उत्पन्न करने का कारक भाव रखता है, और מֵעַל स्थान से अलग किए जाने को व्यक्त करता है। यह अनुवाद निर्वासन के संदर्भ में दोनों भाव सुरक्षित रखता है।
- source_word: אַדְמַתְכֶם
  choice: तुम्हारी भूमि
  rationale: אֲדָמָה मूलतः भूमि/मिट्टी है; यहाँ प्रादेशिक और निर्वासन-संबंधी संदर्भ में ‘भूमि’ सर्वाधिक उपयुक्त है।
- source_word: וְהִדַּחְתִּי אֶתְכֶם
  choice: तब मैं तुम्हें वहाँ से निकाल दूँगा
  rationale: נדח का हिफ़ील दूर हाँकने, निकालने या निर्वासित करने का अर्थ देता है। ‘मैं’ स्पष्ट ईश्वरीय कर्ता को सुरक्षित रखता है; ‘वहाँ से’ हिंदी में भूमि से निष्कासन का संदर्भ स्वाभाविक रूप से जोड़ता है।
- source_word: וַאֲבַדְתֶּם
  choice: और तुम नष्ट हो जाओगे
  rationale: אבד यहाँ विनाश या समाप्त हो जाने को व्यक्त करता है। ‘नष्ट हो जाओगे’ गंभीर परिणाम को स्पष्ट करता है, पर विनाश की विधि अनावश्यक रूप से निर्धारित नहीं करता।
theological_decisions:
- issue: न्याय-क्रम में कर्तृत्व
  choice: झूठे भविष्यवक्ता लोगों को भूमि से दूर किए जाने की दिशा में झूठी भविष्यवाणी करते हैं; इसके बाद परमेश्वर स्पष्ट प्रथम पुरुष में कहता है कि वह उन्हें निकाल देगा।
  alternative: पूरे निष्कासन का कर्ता केवल झूठे भविष्यवक्ताओं को समझना।
  rationale: לְמַעַן הַרְחִיק भविष्यवक्ताओं की झूठी भविष्यवाणी के उद्देश्य/परिणाम को बताता है, जबकि וְהִדַּחְתִּי में प्रथम पुरुष एकवचन परमेश्वर के प्रत्यक्ष कर्तृत्व को सामने लाता है। अनुवाद इस भेद और तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी, सम्मानपूर्ण किंतु सामान्य पाठक के लिए सहज। वाक्य में भविष्यवक्ताओं की चाल और परमेश्वर के स्पष्ट न्यायकारी कर्तृत्व के बीच अंतर रखा गया है।
