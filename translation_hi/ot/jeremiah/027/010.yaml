- from: क्योंकि वे तुमसे झूठी भविष्यवाणी कर रहे हैं[a], ताकि तुम्हें तुम्हारी भूमि से दूर कर दें; तब मैं तुम्हें वहाँ से निकाल दूँगा[b], और तुम नष्ट हो जाओगे।
  to: क्योंकि वे तुम्हारे लिए झूठी भविष्यवाणी कर रहे हैं[a], ताकि तुम्हें तुम्हारी भूमि से दूर करें; और मैं तुम्हें निकाल दूँगा[b], और तुम नष्ट हो जाओगे।
  rationale: The revision corrects the Hindi dative expression, removes added temporal and deictic details, and preserves the Hebrew’s transition from the prophets’ deceptive purpose to God’s explicit first-person action. “ताकि ... दूर करें” keeps the purpose relation while remaining concise and idiomatic.
