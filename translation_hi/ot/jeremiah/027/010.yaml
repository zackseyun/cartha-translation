review_pass:
  verdict: revise
  source_fidelity: The draft conveys the overall sense and retains the explicit first-person divine action in the final clause. However, “तब” introduces an unwarranted temporal sequence, “वहाँ से” adds a deictic element not present in the Hebrew, and “तुमसे ... भविष्यवाणी” is not the natural Hindi equivalent of prophesying to/for the people.
  naturalness: “तुम्हारे लिए झूठी भविष्यवाणी कर रहे हैं” is idiomatic modern Hindi. Rendering the purpose with “तुम्हें तुम्हारी भूमि से दूर करने के लिए” is natural and avoids unnecessarily fixing the agent of the infinitive.
  terminology: “भूमि,” “भविष्यवाणी,” “निकाल दूँगा,” and “नष्ट हो जाओगे” are suitable in this register. “झूठी भविष्यवाणी” appropriately expresses the Hebrew phrase in context.
  issues:
  - severity: medium
    issue: “तुमसे झूठी भविष्यवाणी कर रहे हैं”
    rationale: In Hindi, this can suggest that the prophets are prophesying from or through the audience. “तुम्हारे लिए” more naturally represents the Hebrew dative (“to/for you”).
  - severity: medium
    issue: “तब मैं”
    rationale: The Hebrew conjunction is simply “and”; “तब” adds a temporal implication that is not explicit in the source.
  - severity: low
    issue: “वहाँ से निकाल दूँगा”
    rationale: “वहाँ से” is an added deictic specification. The preceding reference to the land supplies the context without adding this element.
  - severity: low
    issue: Purpose clause uses “कर दें”
    rationale: This explicitly makes the false prophets the agents of removal. The Hebrew infinitive does not expressly identify the agent in this clause; an infinitival Hindi construction better preserves the syntactic openness before the explicit divine “मैं” in the next clause.
  revised_text: क्योंकि वे तुम्हारे लिए झूठी भविष्यवाणी कर रहे हैं[a], ताकि तुम्हें तुम्हारी भूमि से दूर करें; और मैं तुम्हें निकाल दूँगा[b], और तुम नष्ट हो जाओगे।
  revised_footnotes:
  - marker: a
    text: या, “झूठ” या “मिथ्या बात।”
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी में यहाँ कर्ता स्पष्ट रूप से परमेश्वर है: “मैं तुम्हें निकाल दूँगा, और तुम नष्ट हो जाओगे।”'
    reason: agency_clarification
  revision_rationale: The revision corrects the Hindi dative expression, removes added temporal and deictic details, and preserves the Hebrew’s transition from the prophets’ deceptive purpose to God’s explicit first-person action. “ताकि ... दूर करें” keeps the purpose relation while remaining concise and idiomatic.
