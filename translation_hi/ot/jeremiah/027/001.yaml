  text: בְּ/רֵאשִׁ֗ית מַמְלֶ֛כֶת יְהוֹיָקִ֥ם בֶּן יֹאושִׁיָּ֖הוּ מֶ֣לֶךְ יְהוּדָ֑ה הָיָ֞ה הַ/דָּבָ֤ר הַ/זֶּה֙ אֶֽל יִרְמְיָ֔ה מֵ/אֵ֥ת יְהוָ֖ה לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/001.yaml
  text: At the beginning of the reign of Jehoiakim son of Josiah[a], king of Judah, this word came to Jeremiah from Yahweh, saying[b],
translation:
  language: hi
  text: 'यहूदा के राजा योशिय्याह के पुत्र यहोयाकीम[a] के शासनकाल के आरम्भ में याहवे की ओर से यिर्मयाह के पास यह वचन पहुँचा:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पद में इब्रानी पाठ ‘यहोयाकीम’ कहता है, पर अध्याय के आगे के प्रसंग में सिदकिय्याह का उल्लेख है (27:3, 12); इसलिए यहाँ एक पाठगत या कालक्रम-संबंधी कठिनाई दिखाई देती है।
    reason: textual_variant
lexical_decisions:
- source_word: בְּרֵאשִׁית מַמְלֶכֶת
  choice: के शासन के आरम्भ में
  rationale: यह पदबंध राजा के शासनकाल के आरम्भिक समय को सूचित करता है। ‘शासन के आरम्भ में’ आधुनिक हिन्दी में स्वाभाविक है और कालगत अर्थ को स्पष्ट रखता है।
- source_word: יְהוֹיָקִם בֶּן־יֹאשִׁיָּהוּ
  choice: योशिय्याह के पुत्र यहोयाकीम
  rationale: नामों का हिन्दी में प्रचलित बाइबलीय लिप्यंतरण करते हुए पुत्र-संबंध को स्पष्ट रूप से बनाए रखा गया है।
- source_word: מֶלֶךְ יְהוּדָה
  choice: यहूदा के राजा
  rationale: राजकीय उपाधि और राज्य का सीधा तथा स्वाभाविक हिन्दी रूप।
- source_word: הָיָה הַדָּבָר הַזֶּה אֶל־יִרְמְיָה
  choice: यिर्मयाह के पास यह वचन पहुँचा
  rationale: भविष्यद्वाणी की प्रचलित इब्रानी अभिव्यक्ति को हिन्दी में स्वाभाविक रूप दिया गया है। ‘वचन’ דָּבָר की भविष्यद्वाणी-संबंधी प्रकृति को ‘संदेश’ की अपेक्षा अधिक निकटता से बनाए रखता है।
- source_word: מֵאֵת יְהוָה
  choice: यहोवा की ओर से
  rationale: מֵאֵת स्रोत को सूचित करता है; ‘की ओर से’ स्पष्ट करता है कि वचन का उद्गम यहोवा है।
- source_word: לֵאמֹר
  choice: ':'
  rationale: अगले पद में आने वाले प्रत्यक्ष कथन का परिचय आधुनिक हिन्दी में पूर्णविराम-चिह्न द्वारा स्वाभाविक रूप से दिया गया है; इससे इब्रानी ‘यह कहते हुए’ का कार्य बना रहता है, बिना असहज शब्दशः अभिव्यक्ति के।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ में विशिष्ट ईश्वरीय नाम है। हिन्दी के व्यापक बाइबलीय प्रयोग में पहचाने जाने वाले ‘यहोवा’ को रखकर इसे सामान्य उपाधि ‘प्रभु’ में नहीं बदला गया।
- issue: यहोयाकीम और प्रसंग में सिदकिय्याह के उल्लेखों के बीच कठिनाई
  choice: मुख्य पाठ में WLC का ‘यहोयाकीम’ बनाए रखा गया
  alternative: मुख्य पाठ में ‘सिदकिय्याह’ रखना
  rationale: प्राप्त इब्रानी पाठ का पाठन बिना मौन संशोधन के सुरक्षित रखा गया है; प्रसंगगत कठिनाई को पाद-टिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। भविष्यद्वाणी-सूत्र के लिए ‘वचन पहुँचा’ चुना गया है और अगले पद के कथन को आरम्भ कराने के लिए अंत में द्विबिंदु लगाया गया है।
