language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ֠/אַתֶּם אַל תִּשְׁמְע֨וּ אֶל נְבִיאֵי/כֶ֜ם וְ/אֶל קֹֽסְמֵי/כֶ֗ם וְ/אֶל֙ חֲלֹמֹ֣תֵי/כֶ֔ם וְ/אֶל עֹֽנְנֵי/כֶ֖ם וְ/אֶל כַּשָּׁפֵי/כֶ֑ם אֲשֶׁר הֵ֞ם אֹמְרִ֤ים אֲלֵי/כֶם֙ לֵ/אמֹ֔ר לֹ֥א תַעַבְד֖וּ אֶת מֶ֥לֶךְ בָּבֶֽל־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/009.yaml
  text: But you[a], do not listen to your prophets, your diviners, your dreamers, your soothsayers, or your sorcerers, who are saying to you, ‘You will not serve the king of Babylon.’
translation:
  language: hi
  text: पर तुम अपने भविष्यद्वक्ताओं, भविष्य बतानेवालों, स्वप्न देखनेवालों[a], शकुन बतानेवालों और जादू-टोना करनेवालों की मत सुनो, जो तुमसे कहते हैं, “तुम बाबेल के राजा की सेवा नहीं करोगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक शाब्दिक रूप से, “तुम्हारे स्वप्न।” इब्रानी शब्द का रूप ‘स्वप्न’ है, पर इस सूची में संभवतः इसका आशय उन लोगों से है जो स्वप्नों के द्वारा संदेश पाने का दावा करते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתֶּם
  choice: पर तुम
  rationale: संयोजक और स्वतंत्र सर्वनाम मिलकर पिछले कथन के बरक्स श्रोताओं पर बल देते हैं; ‘पर तुम’ इस विरोधात्मक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אַל תִּשְׁמְעוּ אֶל
  choice: की मत सुनो
  rationale: इस प्रयोग में क्रिया का अर्थ किसी की बात सुनना या उस पर ध्यान देना है। ‘की मत सुनो’ निषेध को स्वाभाविक रखता है और आज्ञापालन का अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: נְבִיאֵיכֶם
  choice: अपने भविष्यद्वक्ताओं
  rationale: संज्ञा और उसके बहुवचन संबंधसूचक प्रत्यय दोनों सुरक्षित हैं। पद स्वयं उन्हें ‘झूठा’ नहीं कहता, इसलिए वह विशेषण नहीं जोड़ा गया।
- source_word: קֹסְמֵיכֶם
  choice: भविष्य बतानेवालों
  rationale: यह शब्द गुप्त विधियों से भावी बात जानने या बताने का संकेत देता है। यह रूप सामान्य पाठक के लिए स्पष्ट है और किसी एक विशेष तकनीक तक अर्थ को सीमित नहीं करता।
- source_word: חֲלֹמֹתֵיכֶם
  choice: स्वप्न देखनेवालों[a]
  rationale: रूपतः शब्द ‘तुम्हारे स्वप्न’ है, पर आसपास व्यक्तियों की सूची में यह संभवतः दैवी संदेश के दावे वाले स्वप्नदर्शियों के लिए लक्षणा है। मुख्य पाठ सूची का समानांतर ढाँचा रखता है और पादटिप्पणी शाब्दिक रूप बताती है।
- source_word: עֹנְנֵיכֶם
  choice: शकुन बतानेवालों
  rationale: यह शकुन या संकेतों के आधार पर कथन करनेवालों का बोध कराता है। चयन समझने योग्य है और विवादित व्युत्पत्ति के आधार पर ‘बादल देखनेवाले’ जैसा संकीर्ण अर्थ नहीं थोपता।
- source_word: כַּשָּׁפֵיכֶם
  choice: जादू-टोना करनेवालों
  rationale: यह जादू या टोने के अभ्यासियों को दर्शाता है। आधुनिक हिन्दी में यह स्पष्ट और सहज है।
- source_word: אֲשֶׁר הֵם אֹמְרִים אֲלֵיכֶם לֵאמֹר
  choice: जो तुमसे कहते हैं
  rationale: यह संबंधवाचक उपवाक्य उनके संदेश की विषयवस्तु प्रस्तुत करता है। हिन्दी का सामान्य वर्तमान कृदंत के चलते आ रहे कथन को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לֹא תַעַבְדוּ
  choice: तुम ... सेवा नहीं करोगे
  rationale: 'कथित वाणी के भीतर अपूर्ण क्रिया को भविष्यसूचक कथन समझना प्रसंगानुकूल है: वे कहते हैं कि बाबेल के अधीन सेवा नहीं करनी पड़ेगी। इसे ‘सेवा मत करो’ कहना अनुचित रूप से आज्ञा बना देता।'
- source_word: אֶת מֶלֶךְ בָּבֶל
  choice: बाबेल के राजा की
  rationale: इब्रानी संबंध-रचना का सीधा और प्रचलित हिन्दी रूप है; ‘सेवा करना’ के साथ संबंधकारक स्वाभाविक है।
theological_decisions:
- issue: अविश्वसनीय प्रकाशन का दावा करनेवाले लोगों की सूची को कैसे प्रस्तुत किया जाए
  choice: पाठ के अनुसार उन्हें सीधे ‘भविष्यद्वक्ता’, ‘भविष्य बतानेवाले’, ‘स्वप्न देखनेवाले’, ‘शकुन बतानेवाले’ और ‘जादू-टोना करनेवाले’ कहा गया है; उनकी बात न सुनने की आज्ञा ही उनकी अविश्वसनीयता स्पष्ट करती है।
  alternative: ‘झूठे भविष्यद्वक्ता’ या ‘तथाकथित भविष्यद्वक्ता’ कहकर असत्यता को संज्ञा में ही स्पष्ट करना।
  rationale: इब्रानी इस पद में ‘झूठे’ या ‘तथाकथित’ नहीं जोड़ता। ऐसा विशेषण व्याख्यात्मक निष्कर्ष को मूल पाठ का प्रत्यक्ष कथन बना देता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। सूची के तकनीकी पदों के लिए ऐसे सहज हिन्दी रूप चुने गए हैं जो उनके सामान्य अर्थ बताते हैं, पर विवादित विधियों या अतिरिक्त धार्मिक निर्णयों को पाठ में नहीं जोड़ते।
