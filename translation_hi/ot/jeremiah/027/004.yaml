base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/004.yaml
  text: 'And command them to say to their masters[a], ‘Thus says Yahweh of hosts, the God of Israel: Thus you shall say to your masters,’'
translation:
  language: hi
  text: 'और उन्हें आज्ञा देना कि वे अपने स्वामियों[a] से कहें, “याहवे, सेनाओं का परमेश्वर, इस्राएल का परमेश्वर, यह कहता है: तुम अपने स्वामियों से यह कहना—”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘उनके प्रभुओं’ और आगे ‘तुम्हारे प्रभुओं’ है। यहाँ यह शब्द मानवीय शासकों के लिए है, इसलिए परमेश्वर के लिए प्रयुक्त उपाधि ‘प्रभु’ से भ्रम से बचने के लिए ‘स्वामियों’ कहा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִוִּיתָ
  choice: और उन्हें आज्ञा देना
  rationale: संयोजक वाव के साथ द्वितीय पुरुष एकवचन क्रिया प्रसंग में यिर्मयाह को दिए जा रहे अगले निर्देश को व्यक्त करती है; हिन्दी में निर्देशात्मक अनंत रूप स्वाभाविक है।
- source_word: אֶל אֲדֹנֵיהֶם / אֶל אֲדֹנֵיכֶם
  choice: अपने स्वामियों से
  rationale: אָדוֹן यहाँ दूतों के मानवीय शासकों के लिए है। ‘स्वामी’ अधिकार का भाव रखता है और परमेश्वर के लिए प्रयुक्त ‘प्रभु’ उपाधि से अनावश्यक भ्रम नहीं पैदा करता। दोनों प्रत्यय प्रसंगानुसार ‘अपने’ से स्वाभाविक रूप में व्यक्त होते हैं।
- source_word: לֵאמֹר
  choice: कि वे ... कहें
  rationale: यह अनंत रूप कथन की विषयवस्तु आरम्भ करता है; हिन्दी में अप्रत्यक्ष निर्देश की संरचना के भीतर ‘कि वे ... कहें’ सहज है।
- source_word: כֹּה אָמַר
  choice: यह कहता है
  rationale: मानक भविष्यद्वक्ताई संदेश-सूत्र को आधुनिक, गरिमापूर्ण हिन्दी में वर्तमानकालीन कथन के रूप में रखा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिपि में लिप्यंतरित किया गया है।
- source_word: צְבָאוֹת
  choice: सेनाओं का
  rationale: स्थिर दिव्य उपाधि में यह बहुवचन सेनाओं अथवा समुदायों का बोध देता है; ‘सेनाओं का’ मूल रूपक और परिचित बाइबलीय गरिमा दोनों बनाए रखता है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल का परमेश्वर
  rationale: सम्बन्धसूचक पदबंध का सीधा और स्वाभाविक हिन्दी रूप, जो वाचा-संबंधी उपाधि को सुरक्षित रखता है।
- source_word: כֹּה תֹּאמְרוּ
  choice: तुम ... यह कहना
  rationale: द्वितीय पुरुष बहुवचन दूतों को सामूहिक निर्देश देता है; हिन्दी का निर्देशात्मक ‘कहना’ उसके आज्ञार्थक बल को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ व्यक्तिगत दिव्य नाम का प्रयोग करता है। ‘याहवे’ उसका प्रत्यक्ष हिन्दी लिप्यंतरण है और नाम को किसी उपाधि से नहीं बदलता।
- issue: צְבָאוֹת में सेनाओं की पहचान
  choice: सेनाओं का
  alternative: स्वर्गीय सेनाओं का / सर्वशक्तिमान
  rationale: मूल पद स्वयं यह स्पष्ट नहीं करता कि यहाँ केवल स्वर्गीय सेनाएँ अभिप्रेत हैं। सामान्य ‘सेनाओं का’ मूल की व्यापकता और संभावित अर्थ-तनाव को बनाए रखता है; ‘सर्वशक्तिमान’ अर्थगत व्याख्या जोड़ देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल किंतु गरिमापूर्ण भविष्यद्वक्ताई शैली रखी गई है। उद्धरण अगले पद में जारी रहता है, इसलिए अंत में दीर्घ विराम-चिह्न लगाया गया है।
