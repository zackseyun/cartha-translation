base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/018.yaml
  text: But if they are prophets[a], and if the word of Yahweh is with them, let them now plead with Yahweh of hosts that the vessels remaining in the house of Yahweh, in the house of the king of Judah[c][b], and in Jerusalem may not go to Babylon.
translation:
  language: hi
  text: पर यदि वे नबी हैं और यहोवा का वचन उनके साथ है, तो वे अब सेनाओं के यहोवा से विनती करें[a] कि यहोवा के भवन में, यहूदा के राजा के भवन[b] में और यरूशलेम में बचे हुए पात्र बाबेल न जाएँ[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे अब सेनाओं के यहोवा से अनुनय करें” या “निवेदन करें।” हिब्रू क्रिया विनती करने या मध्यस्थता करने का भाव दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “यहूदा के राजा के राजमहल में।” हिब्रू में शाब्दिक रूप से “यहूदा के राजा के भवन में” है।
    reason: lexical_alternative
  - marker: c
    text: हिब्रू में शाब्दिक रूप से “बाबेल न आएँ”; यरूशलेम में वक्ता के दृष्टिकोण से हिन्दी में “बाबेल न जाएँ” स्वाभाविक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם נְבִאִים הֵם
  choice: पर यदि वे सचमुच नबी हैं
  rationale: शर्त के साथ पूर्ववर्ती दावे को चुनौती देने वाला विरोध स्पष्ट किया गया है। ‘सचमुच’ हिब्रू के स्वतंत्र सर्वनाम הֵם के बल को स्वाभाविक हिन्दी में व्यक्त करता है, बिना कथन को निश्चयात्मक बनाए।
- source_word: דְּבַר יְהוָה אִתָּם
  choice: यहोवा का वचन उनके साथ है
  rationale: हिब्रू अस्तित्वसूचक मुहावरे और ‘साथ’ के संबंध को निकटता से सुरक्षित रखता है; इसे ‘उन्हें वचन मिला है’ कहकर अधिक व्याख्यायित नहीं किया गया।
- source_word: יִפְגְּעוּ נָא בַּיהוָה צְבָאוֹת
  choice: वे अब सेनाओं के यहोवा से विनती करें
  rationale: פגע ב यहाँ आग्रहपूर्वक प्रार्थना या मध्यस्थता करने का भाव रखता है। ‘विनती करें’ सामान्य आधुनिक हिन्दी में स्वाभाविक है; ‘अब’ נָא की तात्कालिकता को दर्शाता है।
- source_word: הַכֵּלִים הַנּוֹתָרִים
  choice: बचे हुए पात्र
  rationale: כֵּלִים संदर्भ में भवन और राजभवन की वस्तुओं/पात्रों को सूचित करता है। ‘पात्र’ मंदिर-संबंधी संदर्भ के अनुकूल है और ‘बचे हुए’ निर्वासन से अब तक शेष रहने का अर्थ देता है।
- source_word: בְּבֵית יְהוָה
  choice: यहोवा के भवन में
  rationale: בֵּית का निकट औपचारिक अनुवाद रखते हुए समानांतर ‘राजा के भवन’ को भी सुरक्षित किया गया है; संदर्भ से मंदिर स्पष्ट है।
- source_word: וּבֵית מֶלֶךְ יְהוּדָה
  choice: यहूदा के राजा के भवन में
  rationale: मसोरेटिक पाठ में दूसरे पद के आरंभ पर पूर्वसर्ग स्पष्ट रूप से दोहराया नहीं गया, पर सूची की समानांतर रचना में उसका अर्थ पहले पद से ग्रहण होता है। ‘भवन’ मूल की पुनरावृत्ति बचाता है।
- source_word: לְבִלְתִּי בֹאוּ ... בָּבֶלָה
  choice: कि ... बाबेल न जाएँ
  rationale: לְבִלְתִּי उद्देश्य/निवारण व्यक्त करता है। בוא का मूल अर्थ ‘आना’ है, पर यरूशलेम में बोलने वाले के दृष्टिकोण से बाबेल की दिशा में गति को हिन्दी में स्वाभाविक रूप से ‘जाना’ कहा जाता है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं के यहोवा
  rationale: צְבָאוֹת की बहुवचन ‘सेनाएँ’ वाली छवि को सुरक्षित रखते हुए ईश्वरीय नाम को सीधे ‘यहोवा’ दिया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में चतुरक्षरीय निजी नाम है। हिन्दी में परिचित प्रतिलेखन ‘यहोवा’ नाम को पदवी में बदलने के बजाय उसकी विशिष्टता सुरक्षित रखता है।
- issue: יִפְגְּעוּ का प्रार्थनात्मक/मध्यस्थतापरक भाव
  choice: विनती करें
  alternative: मध्यस्थता करें
  rationale: हिब्रू क्रिया आग्रह अथवा मध्यस्थता दोनों का अर्थ दे सकती है। मुख्य पाठ में व्यापक ‘विनती’ रखकर तकनीकी धार्मिक अर्थ आरोपित नहीं किया गया; वैकल्पिक अर्थ पाद-टिप्पणी में दिया गया है।
- issue: कथित नबियों की प्रामाणिकता
  choice: यदि वे सचमुच नबी हैं
  alternative: यदि वे नबी हैं
  rationale: वाक्य एक शर्तपूर्ण चुनौती है, निर्णय नहीं। ‘सचमुच’ चुनौती का बल दिखाता है, जबकि ‘यदि’ वास्तविक अनिश्चितता बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल किंतु गरिमापूर्ण धार्मिक गद्य। ‘नबी’, ‘वचन’, ‘विनती’, ‘भवन’ और ‘पात्र’ जैसे व्यापक रूप से समझे जाने वाले शब्द चुने गए हैं। मूल की शर्तपूर्ण चुनौती, स्थानों की समानांतर सूची और प्रार्थना/मध्यस्थता की अर्थगत खुलावट सुरक्षित रखी गई है।
