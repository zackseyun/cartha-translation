source:
  edition: WLC
  text: וְ/אַֽל תִּשְׁמְע֞וּ אֶל דִּבְרֵ֣י הַ/נְּבִאִ֗ים הָ/אֹמְרִ֤ים אֲלֵי/כֶם֙ לֵ/אמֹ֔ר לֹ֥א תַעַבְד֖וּ אֶת מֶ֣לֶךְ בָּבֶ֑ל כִּ֣י שֶׁ֔קֶר הֵ֖ם נִבְּאִ֥ים לָ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/014.yaml
  text: And do not listen to the words of the prophets who are saying to you[a], ‘You will not serve the king of Babylon,’ for they are prophesying a lie to you.
translation:
  language: hi
  text: और उन भविष्यद्वक्ताओं की बातों पर ध्यान मत दो, जो तुमसे कह रहे हैं, ‘तुम बाबेल के राजा की सेवा नहीं करोगे।’[a] क्योंकि वे तुमसे झूठी भविष्यवाणी कर रहे हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बाबेल के राजा की सेवा मत करो।” हिब्रू रूप को निषेधात्मक आदेश भी समझा जा सकता है, पर प्रसंग में इसे भविष्यद्वक्ताओं की इस झूठी भविष्यवाणी के रूप में समझना अधिक उपयुक्त है कि यहूदा को बाबेल की सेवा नहीं करनी पड़ेगी।
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אַל תִּשְׁמְעוּ אֶל דִּבְרֵי
  choice: और ... की बातों पर ध्यान मत दो
  rationale: וְ प्रसंग की कड़ी बनाए रखता है और אַל के साथ क्रिया निषेधात्मक आज्ञा देती है। שׁמע אֶל का आशय केवल सुनना नहीं, बल्कि ध्यान देकर मानना है; आधुनिक हिन्दी में ‘बातों पर ध्यान मत दो’ स्वाभाविक और स्पष्ट है।
- source_word: הַנְּבִאִים הָאֹמְרִים אֲלֵיכֶם
  choice: उन भविष्यद्वक्ताओं ... जो तुमसे कह रहे हैं
  rationale: निश्चित लेख प्रसंग में पहचाने हुए समूह को सूचित करता है; कृदन्त הָאֹמְרִים उनकी जारी या दोहराई जा रही वाणी को दर्शाता है।
- source_word: לֹא תַעַבְדוּ
  choice: तुम ... सेवा नहीं करोगे
  rationale: עבד किसी मानवीय राजा के साथ उसकी सेवा करने या उसके अधीन रहने का अर्थ देता है। उद्धृत भविष्यवाणी में अपूर्ण क्रिया को भविष्यसूचक कथन के रूप में प्रस्तुत किया गया है, जबकि निषेधात्मक पाठ की संभावना पाद-टिप्पणी में सुरक्षित है।
- source_word: אֶת מֶלֶךְ בָּבֶל
  choice: बाबेल के राजा की
  rationale: यह रचनात्मक संबंध का सीधा और हिन्दी में प्रचलित रूप है; ‘बाबेल’ हिब्रू בָּבֶל का पारंपरिक बाइबिलीय नाम है।
- source_word: כִּי שֶׁקֶר הֵם נִבְּאִים לָכֶם
  choice: क्योंकि वे तुमसे झूठी भविष्यवाणी कर रहे हैं
  rationale: כִּי कारण प्रस्तुत करता है। שֶׁקֶר को हिन्दी में विशेषणात्मक ‘झूठी’ के रूप में रखना स्वाभाविक है और נִבְּאִים की जारी गतिविधि ‘भविष्यवाणी कर रहे हैं’ से व्यक्त होती है।
theological_decisions:
- issue: झूठे भविष्यद्वक्ताओं के संदेश का स्वरूप
  choice: ‘तुम ... सेवा नहीं करोगे’—एक झूठी भविष्यवाणी
  alternative: ‘बाबेल के राजा की सेवा मत करो’—एक निषेधात्मक आदेश
  rationale: व्यापक प्रसंग में ये भविष्यद्वक्ता बाबेल की अधीनता न आने का दावा कर रहे हैं। उद्धृत वाणी में हिब्रू अपूर्ण क्रिया भविष्यसूचक कथन हो सकती है, और अगला वाक्य इसे झूठी भविष्यवाणी बताता है। फिर भी व्याकरणिक निषेधात्मक संभावना पाद-टिप्पणी में रखी गई है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘भविष्यद्वक्ता’ तथा ‘बाबेल’ जैसे परिचित बाइबिलीय पद बनाए गए हैं। सर्वनाम ‘तुम’ मूल के बहुवचन संबोधन को सामान्य आधुनिक हिन्दी में व्यक्त करता है।
