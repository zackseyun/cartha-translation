base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/002.yaml
  text: 'Thus said Yahweh to me: “Make for yourself bonds and yoke-bars[a], and put them on your neck.”'
translation:
  language: hi
  text: 'याहवे ने मुझसे यह कहा: “अपने लिए बंधन और जुए की छड़ें[a] बना, और उन्हें अपनी गर्दन पर रख।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “बंधन और जुए की छड़ें”; कुछ अनुवाद इसे “पट्टियाँ और जुए” कहते हैं।
    reason: मूल के दो उपकरण-संबंधी शब्दों का सटीक आशय और प्रचलित सरल विकल्प बताना।
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה אֵלַי
  choice: याहवे ने मुझसे यह कहा
  rationale: यह अभिव्यक्ति भविष्यवाणी-सूत्र और भूतकालीन कथन, दोनों को स्वाभाविक आधुनिक हिन्दी में बनाए रखती है; אֵלַי का अर्थ यहाँ ‘मुझसे’ है।
- source_word: עֲשֵׂה לְךָ
  choice: अपने लिए ... बना
  rationale: आज्ञार्थक क्रिया और लाभार्थक/निजवाचक לְךָ को स्पष्ट तथा सहज हिन्दी में व्यक्त करता है।
- source_word: מוֹסֵרוֹת
  choice: बंधन
  rationale: यह बहुवचन संज्ञा जुए के साथ प्रयुक्त बाँधने वाली पट्टियों या बंधनों को दर्शाती है; ‘बंधन’ मूल की व्यापकता बनाए रखता है।
- source_word: מֹטוֹת
  choice: जुए की छड़ें
  rationale: यह शब्द केवल पूरे जुए के बजाय उसकी छड़ों को सूचित कर सकता है; यह अनुवाद उस यांत्रिक अर्थ को स्पष्ट रखता है।
- source_word: וּנְתַתָּם עַל צַוָּארֶךָ
  choice: और उन्हें अपनी गर्दन पर रख
  rationale: संयोजित पूर्ण क्रिया यहाँ पिछली आज्ञा को आगे बढ़ाती है; बहुवचन प्रत्यय को ‘उन्हें’ से व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा-संबंधी व्यक्तिगत नाम स्पष्ट रूप से उपस्थित है। ‘याहवे’ उसे उपाधि में बदले बिना आधुनिक हिन्दी लिप्यंतरण में सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। परमेश्वर द्वारा एक पुरुष से सीधे संबोधन के कारण एकवचन आज्ञार्थक ‘बना’ और ‘रख’ प्रयुक्त हैं।
