source:
  edition: WLC
  text: לָ֤/מָּה תָמ֨וּתוּ֙ אַתָּ֣ה וְ/עַמֶּ֔/ךָ בַּ/חֶ֖רֶב בָּ/רָעָ֣ב וּ/בַ/דָּ֑בֶר֙ כַּֽ/אֲשֶׁר֙ דִּבֶּ֣ר יְהוָ֔ה אֶל הַ/גּ֕וֹי אֲשֶׁ֥ר לֹֽא יַעֲבֹ֖ד אֶת מֶ֥לֶךְ בָּבֶֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/013.yaml
  text: Why will you and your people die by the sword, by famine, and by pestilence, just as the LORD has spoken concerning the nation that will not serve the king of Babylon?
translation:
  language: hi
  text: तुम और तुम्हारी प्रजा तलवार से, अकाल से और महामारी से क्यों मरोगे, जैसा कि यहोवा ने उस राष्ट्र के विषय में कहा है जो बाबेल के राजा की सेवा नहीं करेगा?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָמָּה תָמוּתוּ
  choice: क्यों मरोगे
  rationale: प्रश्नवाचक चेतावनी को स्वाभाविक आधुनिक हिन्दी में रखा गया है; यहाँ अपूर्ण क्रिया आसन्न परिणाम को व्यक्त करती है।
- source_word: בַּחֶרֶב בָּרָעָב וּבַדָּבֶר
  choice: तलवार, अकाल और महामारी से
  rationale: तीनों न्याय-साधनों की समानांतर सूची और בְּ के साधन/कारण संबंध को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: כַּאֲשֶׁר
  choice: ठीक वैसे ही जैसे
  rationale: पूर्ववर्ती घोषित वचन के अनुरूप परिणाम का बल बनाए रखता है।
- source_word: דִּבֶּר יְהוָה אֶל הַגּוֹי
  choice: यहोवा ने उस जाति के विषय में कहा है
  rationale: אֶל का संदर्भगत अर्थ यहाँ उस जाति के संबंध में कही गई घोषणा है; 'विषय में' हिन्दी में स्वाभाविक है।
- source_word: יַעֲבֹד אֶת מֶלֶךְ בָּבֶל
  choice: बाबेल के राजा की सेवा नहीं करेगी
  rationale: עבד का राजनीतिक अधीनता/सेवा का अर्थ सुरक्षित है; इसे अधिक व्याख्यात्मक 'आज्ञा मानेगी' या 'कर देगी' नहीं बनाया गया।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का रूप
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ के विशिष्ट नाम को हिन्दी में प्रचलित व्यक्तिगत नाम के रूप में सुरक्षित रखा गया है, जिससे सामान्य उपाधि और नाम के बीच का भेद बना रहे।
- issue: भविष्यवाणी और परिणाम का संबंध
  choice: ठीक वैसे ही जैसे यहोवा ने ... कहा है
  alternative: क्योंकि यहोवा ने ... कहा है
  rationale: כַּאֲשֶׁר की तुलनात्मक/अनुरूपतामूलक शक्ति को रखा गया है; पाठ में प्रत्यक्ष कारणसूचक संयोजक नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण है। राजा को संबोधित एकवचन 'तुम' और सामूहिक 'तुम्हारी प्रजा' का भेद रखा गया है। 'जाति' भविष्यवाणी-साहित्य के संदर्भ में स्वाभाविक है; वाक्य की तीखी आलंकारिक चेतावनी बनाए रखी गई है।
