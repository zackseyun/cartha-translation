base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/022.yaml
  text: They will be brought to Babylon[a], and there they will remain until the day I attend to them, declares Yahweh[b]. Then I will bring them up and restore them to this place.
translation:
  language: hi
  text: उन्हें बाबेल ले जाया जाएगा और वे वहीं उस दिन तक रहेंगे जब मैं उनकी सुधि लूँगा[a]—यह याहवे की घोषणा है। तब मैं उन्हें ऊपर ले आऊँगा[b] और उन्हें इस स्थान पर लौटा दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं उनकी ओर ध्यान दूँगा” अथवा “मैं उनसे भेंट करूँगा।” इब्रानी क्रिया का अर्थ किसी पर ध्यान देना, उससे भेंट करना या उसके लिए हस्तक्षेप करना हो सकता है; यहाँ आगे आने वाला वचन पुनर्स्थापना की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: या, “मैं उन्हें वापस ले आऊँगा।” इब्रानी में शाब्दिक चित्र “ऊपर ले आना” है, जो निर्वासन से देश में लौटने के लिए प्रचलित अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּבֶלָה
  choice: बाबेल
  rationale: स्थानवाचक दिशासूचक ה गति को बाबेल की ओर दर्शाता है; हिन्दी में ‘बाबेल ले जाए जाएँगे’ यह दिशा स्वाभाविक रूप से व्यक्त करता है।
- source_word: יוּבָאוּ
  choice: ले जाए जाएँगे
  rationale: 'בוא का होफ़ाल रूप कर्मवाच्य और प्रेरणार्थक है: वस्तुएँ दूसरों के द्वारा बाबेल पहुँचाई जाएँगी। गन्तव्य से दूर निर्वासन के सन्दर्भ में ‘ले जाए जाएँगे’ स्वाभाविक हिन्दी है।'
- source_word: וְשָׁמָּה יִהְיוּ
  choice: और वहीं ... रहेंगे
  rationale: शाब्दिक अर्थ ‘वहाँ होंगे’ है, पर स्थानवाचक שָׁמָּה और समय-सीमा के साथ यह लगातार वहाँ बने रहने का भाव देता है।
- source_word: פָּקְדִי אֹתָם
  choice: मैं उनकी सुधि लूँगा
  rationale: פקד ध्यान देने, भेंट करने अथवा हस्तक्षेप करने को व्यक्त कर सकता है और कभी न्याय, कभी अनुग्रह के लिए प्रयुक्त होता है। ‘सुधि लूँगा’ अनुकूल सन्दर्भ से मेल खाता है, पर क्रिया को अत्यधिक विशिष्ट नहीं बनाता।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: यह मानक नबूवत-सूत्र है। יְהוָה को उपाधि से बदलने के बजाय उसके व्यक्तिगत नाम ‘याहवे’ के रूप में प्रस्तुत किया गया है।
- source_word: וְהַעֲלִיתִים
  choice: मैं उन्हें ऊपर ले आऊँगा
  rationale: עלה के हिफ़ील रूप का मूल चित्र ‘ऊपर ले आना’ है; निर्वासन से देश में वापसी के लिए यह सामान्य इब्रानी अभिव्यक्ति है।
- source_word: וַהֲשִׁיבֹתִים
  choice: और उन्हें ... वापस पहुँचा दूँगा
  rationale: שׁוב का हिफ़ील रूप किसी को लौटाने या वापस लाने को दर्शाता है। ‘इस स्थान पर वापस पहुँचा दूँगा’ गन्तव्य सहित अर्थ को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: इस स्थान पर
  rationale: मूल पाठ में ‘इस स्थान’ ही है; सन्दर्भगत स्थान को ‘देश’ या ‘यरूशलेम’ बनाकर अधिक स्पष्ट नहीं किया गया।
theological_decisions:
- issue: पुनर्स्थापना के सन्दर्भ में פקד का अर्थ
  choice: अनुकूल, पर पर्याप्त रूप से खुला ‘उनकी सुधि लूँगा’
  alternative: ‘उन्हें दण्ड दूँगा’ अथवा अधिक तटस्थ ‘उनसे भेंट करूँगा’
  rationale: अगले उपवाक्य में याहवे उन्हें ऊपर लाने और इस स्थान पर वापस पहुँचाने का वचन देता है, इसलिए यहाँ दण्ड का अर्थ असम्भाव्य है। फिर भी פקד की व्यापक अर्थ-सीमा बनाए रखने के लिए अनुवाद ने सीधे ‘उन्हें छुड़ाऊँगा’ नहीं कहा।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी अपनाई गई है। ‘सुधि लूँगा’ थोड़ा साहित्यिक किन्तु परिचित पद है और פקד की अर्थगत व्यापकता बनाए रखता है। दोनों पादटिप्पणी-चिह्न सम्बद्ध शब्दों के तुरन्त बाद रखे गए हैं; दिए गए अंग्रेज़ी परामर्श-पाठ में चिह्नों का स्थान पादटिप्पणियों की सामग्री से मेल नहीं खाता था, इसलिए स्रोत के अनुसार उन्हें सुधारा गया है।
