base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/020.yaml
  text: which Nebuchadnezzar king of Babylon did not take when he exiled Jeconiah son of Jehoiakim[a], king of Judah, from Jerusalem to Babylon[c][b], along with all the nobles of Judah and Jerusalem.
translation:
  language: hi
  text: जिन्हें बाबेल के राजा नबूकदनेस्सर ने उस समय नहीं लिया था, जब उसने यहोयाकीम के पुत्र, यहूदा के राजा यकोन्याह[a] को यरूशलेम से बाबेल निर्वासित किया था, और उसके साथ यहूदा तथा यरूशलेम के सभी कुलीनों[b] को भी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यकोन्याह नाम का रूप ‘यकोनियाह’ भी लिखा जाता है।
    reason: lexical_alternative
  - marker: b
    text: ‘कुलीनों’ का अनुवाद ‘प्रमुख लोगों’ या ‘अधिकारियों’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר לֹא לְקָחָם
  choice: जिन्हें ... नहीं ले गया था
  rationale: सम्बन्धवाचक पद पिछले पद में आए पात्रों की ओर संकेत करता है। हिन्दी में बहुवचन निर्जीव वस्तुओं के लिए ‘जिन्हें’ स्वाभाविक है; पूर्वकालिक घटना होने के कारण ‘नहीं ले गया था’ प्रसंगानुकूल है।
- source_word: נְבוּכַדְנֶאצַּר מֶלֶךְ בָּבֶל
  choice: बाबेल का राजा नबूकदनेस्सर
  rationale: राजकीय उपाधि और नाम को सीधे, प्रचलित हिन्दी बाइबलीय रूपों में रखा गया है।
- source_word: בַּגְלוֹתוֹ
  choice: उस समय ... बंदी बनाकर ... ले गया था
  rationale: बेथ सहित infinitive construct का कालवाचक अर्थ ‘जब/उस समय’ है और גלה यहाँ निर्वासन में ले जाने को दर्शाता है। ‘बंदी बनाकर ... ले गया’ साधारण हिन्दी में निर्वासन का अर्थ स्पष्ट रखता है।
- source_word: יְכָונְיָה בֶן יְהוֹיָקִים מֶלֶךְ יְהוּדָה
  choice: यहूदा के राजा यहोयाकीम के पुत्र यकोन्याह
  rationale: इब्रानी वंश-सूचना और राजकीय पहचान को बनाए रखा गया है। वाक्य-विन्यास ऐसा रखा गया है कि ‘यहूदा का राजा’ यकोन्याह को भी पहचान देता है, यद्यपि हिन्दी में संबंध-श्रृंखला क्षणिक अस्पष्ट हो सकती है।
- source_word: מִירוּשָׁלִַם בָּבֶלָה
  choice: यरूशलेम से ... बाबेल
  rationale: מִן उद्गम और दिशासूचक ה गंतव्य व्यक्त करते हैं; हिन्दी में ‘से ... ले गया’ यही गति स्वाभाविक रूप से बताती है।
- source_word: כָּל חֹרֵי יְהוּדָה וִירוּשָׁלִָם
  choice: यहूदा तथा यरूशलेम के सभी कुलीन लोगों
  rationale: חֹרֵי यहाँ सामाजिक-राजनीतिक उच्चवर्ग या प्रमुख पुरुषों को सूचित करता है। ‘कुलीन लोग’ आधुनिक हिन्दी में ‘रईसों’ से अधिक गरिमापूर्ण और ‘अधिकारियों’ से कम संकीर्ण है।
