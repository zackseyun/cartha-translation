  yaml_path: translation/ot/jeremiah/024/002.yaml
  text: One basket had very good figs[a], like first-ripe figs, and one basket had very bad figs[b], which could not be eaten because of their badness.
translation:
  language: hi
  text: एक टोकरी में बहुत अच्छे अंजीर थे, पहले पकने वाले अंजीरों[a] के समान; और दूसरी टोकरी में बहुत खराब अंजीर थे, जो खराब होने के कारण खाए नहीं जा सकते थे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘आरम्भ में पकने वाले अंजीरों’ अथवा ‘पहली फसल के अंजीरों’।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक अर्थ है, ‘जो खराबी के कारण खाए नहीं जा सकते थे’; खराबी का सटीक प्रकार नहीं बताया गया है।
    reason: lexical_alternative
