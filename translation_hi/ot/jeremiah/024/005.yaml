source:
  edition: WLC
  text: כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל כַּ/תְּאֵנִ֥ים הַ/טֹּב֖וֹת הָ/אֵ֑לֶּה כֵּֽן אַכִּ֞יר אֶת גָּל֣וּת יְהוּדָ֗ה אֲשֶׁ֨ר שִׁלַּ֜חְתִּי מִן הַ/מָּק֥וֹם הַ/זֶּ֛ה אֶ֥רֶץ כַּשְׂדִּ֖ים לְ/טוֹבָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/024/005.yaml
  text: 'Thus says Yahweh[a], the God of Israel: Like these good figs, so I will regard the exiles of Judah, whom I sent away from this place to the land of the Chaldeans[b], for good.'
translation:
  language: hi
  text: 'इस्राएल का परमेश्वर यहोवा यों कहता है: “इन अच्छे अंजीरों के समान ही मैं यहूदा के उन निर्वासितों[a] को भलाई की दृष्टि से देखूँगा[b], जिन्हें मैंने इस स्थान से कसदियों के देश में भेजा है।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यहूदा के निर्वासन” अथवा “यहूदा की बंधुआई।” इब्रानी शब्द निर्वासित लोगों या निर्वासन की दशा/घटना—दोनों का बोध करा सकता है; यहाँ “जिन्हें मैंने...भेजा” के कारण लोगों वाला अर्थ अधिक उपयुक्त है।
    reason: alternative_reading
  - marker: b
    text: या “उनकी भलाई के लिए।” इब्रानी में केवल “भलाई के लिए” है; किसकी भलाई, यह स्पष्ट रूप से नहीं कहा गया।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबल परंपरा में प्रचलित रूप; वाचा-संबंधी दिव्य नाम को सामान्य उपाधि से अलग रखता है।
- source_word: כֹּה אָמַר
  choice: यों कहता है
  rationale: भविष्यद्वक्ताओं की मानक संदेशवाहक उक्ति को संक्षिप्त, स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल का परमेश्वर
  rationale: इब्रानी संबंधवाचक रचना का सीधा और स्वाभाविक अनुवाद।
- source_word: כַּתְּאֵנִים הַטֹּבוֹת הָאֵלֶּה ... כֵּן
  choice: इन अच्छे अंजीरों के समान ही ...
  rationale: दर्शन में उपस्थित अंजीरों की ओर संकेत और ‘जैसे...वैसे’ तुलना दोनों को बनाए रखता है।
- source_word: אַכִּיר
  choice: दृष्टि से देखूँगा
  rationale: यहाँ हिफ़ील रूप केवल मानसिक पहचान नहीं, बल्कि किसी को एक विशेष ढंग से ग्रहण करने या उसके प्रति व्यवहार रखने का भाव देता है; לְטוֹבָה के साथ यह हिन्दी में स्वाभाविक है।
- source_word: גָּלוּת יְהוּדָה
  choice: यहूदा के उन निर्वासितों
  rationale: संज्ञा निर्वासन की दशा या निर्वासित समुदाय दोनों का बोध करा सकती है; अगले बहुवचन-सापेक्ष आशय और अंजीरों से तुलना के कारण व्यक्तियों का सामूहिक अर्थ मुख्य पाठ में अधिक उपयुक्त है।
- source_word: שִׁלַּחְתִּי
  choice: मैंने ... भेजा है
  rationale: निर्वासन में परमेश्वर की सक्रिय भूमिका को बनाए रखता है, पर मूल से अधिक तकनीकी राजनीतिक शब्द नहीं जोड़ता।
- source_word: מִן הַמָּקוֹם הַזֶּה
  choice: इस स्थान से
  rationale: मूल स्थान-सूचक पद का सीधा और सहज अनुवाद।
- source_word: אֶרֶץ כַּשְׂדִּים
  choice: कसदियों के देश में
  rationale: इब्रानी जातीय-भौगोलिक पद को बनाए रखता है; इसे सामान्यीकृत करके ‘बाबुल’ नहीं करता।
- source_word: לְטוֹבָה
  choice: भलाई की दृष्टि से
  rationale: ‘भलाई के लिए/भले रूप में’ के संक्षिप्त इब्रानी भाव को सहज हिन्दी में व्यक्त करता है और लाभ पाने वाले को स्पष्ट रूप से नहीं जोड़ता।
theological_decisions:
- issue: גָּלוּת יְהוּדָה का संदर्भ
  choice: 'व्यक्तिगत-सामूहिक अर्थ: ‘यहूदा के निर्वासितों’'
  alternative: 'अमूर्त/दशात्मक अर्थ: ‘यहूदा का निर्वासन’ या ‘यहूदा की बंधुआई’'
  rationale: अच्छे अंजीरों से तुलना और ‘जिन्हें मैंने...भेजा’ का भाव निर्वासित लोगों की ओर संकेत करता है; फिर भी पद की शब्दार्थगत व्यापकता पादटिप्पणी में सुरक्षित है।
- issue: לְטוֹבָה का आशय
  choice: मूल पाठ की तरह लाभार्थी को अनकहा रखते हुए ‘भलाई की दृष्टि से’
  alternative: 'लाभार्थक अर्थ: ‘उनकी भलाई के लिए’'
  rationale: इब्रानी में कोई स्पष्ट सर्वनाम नहीं है। मुख्य अनुवाद अनुकूल मूल्यांकन/व्यवहार का भाव देता है, जबकि पादटिप्पणी संभावित लाभार्थक अर्थ बताती है।
- issue: निर्वासन में परमेश्वर की भूमिका
  choice: ‘जिन्हें मैंने ... भेजा है’ में प्रत्यक्ष कर्तृत्व बनाए रखा गया
  alternative: कर्मवाच्य या केवल ऐतिहासिक निर्वासन का उल्लेख
  rationale: मूल पाठ स्पष्ट रूप से परमेश्वर को भेजने वाला बताता है; इसे नरम करना पद के न्याय और भावी भलाई के तनाव को घटा देता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर भविष्यद्वक्ताओं की घोषणा के अनुरूप गरिमापूर्ण रखी गई है। ‘यों कहता है’, ‘निर्वासितों’ और ‘कसदियों के देश’ जैसे रूप सामान्य पाठक के लिए स्पष्ट रहते हुए मूल की औपचारिकता और ऐतिहासिक शब्दावली बनाए रखते हैं।
