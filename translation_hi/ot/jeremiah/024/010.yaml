base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/024/010.yaml
  text: And I will send against them the sword[a], the famine, and the pestilence, until they are consumed from the land that I gave to them and to their fathers.
translation:
  language: hi
  text: और मैं उनके विरुद्ध तलवार, अकाल और महामारी[a] भेजूँगा, जब तक कि वे उस भूमि पर से मिट न जाएँ जिसे मैंने उन्हें और उनके पुरखाओं को दिया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “संक्रामक रोग।” इब्रानी शब्द व्यापक रूप से फैलनेवाली घातक बीमारी को दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּחְתִּי בָם
  choice: मैं उनके विरुद्ध ... भेजूँगा
  rationale: שׁלח के साथ ב यहाँ दंड के साधनों को शत्रुतापूर्वक किसी पर भेजने का भाव देता है। ‘उनके विरुद्ध’ इस दिशा और विरोध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַחֶרֶב
  choice: तलवार
  rationale: मूल शब्द का ठोस अर्थ ‘तलवार’ है, यद्यपि यह युद्ध और हिंसक मृत्यु का भी द्योतक हो सकता है। ठोस शब्द रखने से यिर्मयाह की प्रचलित त्रयी बनी रहती है।
- source_word: הָרָעָב
  choice: अकाल
  rationale: न्याय के इस प्रसंग में רָעָב व्यक्तिगत भूख नहीं, बल्कि व्यापक खाद्य-संकट या अकाल को दर्शाता है।
- source_word: הַדָּבֶר
  choice: महामारी
  rationale: דֶּבֶר भविष्यद्वाणी के दंड-सूत्रों में व्यापक रूप से फैलनेवाली घातक बीमारी को दर्शाता है। आधुनिक हिन्दी में ‘महामारी’ स्वाभाविक और गंभीर है।
- source_word: עַד תֻּמָּם
  choice: जब तक कि वे ... मिट न जाएँ
  rationale: תמם का परिणामसूचक भाव उनके पूर्ण अंत तक पहुँचने का है। ‘मिट न जाएँ’ दंड के संदर्भ में स्वाभाविक है और समाप्त हो जाने का भाव रखता है।
- source_word: מֵעַל הָאֲדָמָה
  choice: उस भूमि पर से
  rationale: מֵעַל का ‘ऊपर से/पर से’ वाला स्थानिक बल सुरक्षित रखा गया है, जबकि אֲדָמָה यहाँ केवल मिट्टी नहीं, परमेश्वर द्वारा दी गई भूमि है।
- source_word: אֲשֶׁר נָתַתִּי לָהֶם וְלַאֲבוֹתֵיהֶם
  choice: जिसे मैंने उन्हें और उनके पुरखाओं को दिया था
  rationale: यह वाक्य वर्तमान पीढ़ी और उसके पितृ-पूर्वजों को भूमि दिए जाने की वाचा-संबंधी स्मृति जगाता है। ‘पुरखाओं’ से אבותיהם की ऐतिहासिक और पुरुषवाची विशिष्टता बनी रहती है।
theological_decisions:
- issue: वाचा में दी गई भूमि का वर्णन
  choice: उस भूमि ... जिसे मैंने उन्हें और उनके पुरखाओं को दिया था
  alternative: उस देश ... जिसे मैंने उन्हें और उनके पूर्वजों को दिया था
  rationale: ‘भूमि’ אֲדָמָה के क्षेत्रगत अर्थ को व्यक्त करती है, और ‘पुरखाओं’ से इस्राएल की पीढ़ियों तथा पितृकालीन वाचा की ऐतिहासिक विशिष्टता सामान्यीकृत नहीं होती।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘तलवार, अकाल और महामारी’ भविष्यद्वाणी की दंड-त्रयी को संक्षिप्त रूप में बनाए रखता है। पादटिप्पणी का चिह्न अर्थानुसार ‘महामारी’ के साथ रखा गया है।
