  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י מָֽה אַתָּ֤ה רֹאֶה֙ יִרְמְיָ֔הוּ וָ/אֹמַ֖ר תְּאֵנִ֑ים הַ/תְּאֵנִ֤ים הַ/טֹּבוֹת֙ טֹב֣וֹת מְאֹ֔ד וְ/הָֽ/רָעוֹת֙ רָע֣וֹת מְאֹ֔ד אֲשֶׁ֥ר לֹא תֵאָכַ֖לְנָה מֵ/רֹֽעַ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/024/003.yaml
  text: Then Yahweh said to me[a], “What do you see, Jeremiah?” And I said, “Figs—the good figs are very good, and the bad figs are very bad, so bad that they cannot be eaten.”
translation:
  language: hi
  text: तब याहवे ने मुझसे कहा, “यिर्मयाह, तुम क्या देखते हो?” मैंने कहा, “अंजीर। अच्छे अंजीर बहुत अच्छे हैं, और खराब अंजीर इतने खराब हैं कि खाए नहीं जा सकते।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो अपनी खराबी के कारण खाए नहीं जा सकते।”
    reason: מֵרֹעַ कारण अथवा खराब दशा की तीव्रता व्यक्त कर सकता है; मुख्य पाठ स्वाभाविक परिणामसूचक हिन्दी देता है और पादटिप्पणी अधिक शाब्दिक विकल्प सुरक्षित रखती है।
lexical_decisions:
- source_word: יְהוָה
  choice: यहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय आधुनिक हिन्दी में प्रचलित निकट लिप्यंतरण द्वारा रखा गया है।
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमवाचक कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में क्रम को व्यक्त करता है।
- source_word: מָה אַתָּה רֹאֶה
  choice: तुम क्या देखते हो?
  rationale: कृदन्तीय रचना की वर्तमान और तात्कालिक दृष्टि को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: תְּאֵנִים
  choice: अंजीर
  rationale: फल का सामान्य हिन्दी नाम; हिन्दी में यही रूप एकवचन और बहुवचन दोनों संदर्भों में चलता है।
- source_word: הַתְּאֵנִים הַטֹּבוֹת טֹבוֹת מְאֹד
  choice: अच्छे अंजीर बहुत अच्छे हैं
  rationale: मूल के विशेषण की जोरदार पुनरावृत्ति को स्पष्ट और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וְהָרָעוֹת רָעוֹת מְאֹד
  choice: और खराब अंजीर इतने खराब हैं
  rationale: רעות यहाँ नैतिक बुराई नहीं, फल की खराब दशा बताता है; ‘इतने’ आगे आने वाले परिणामसूचक वाक्य से सहज संबंध बनाता है।
- source_word: אֲשֶׁר לֹא תֵאָכַלְנָה מֵרֹעַ
  choice: कि खाए नहीं जा सकते
  rationale: निफ़अल का कर्मवाच्य अर्थ और खराब दशा के कारण अयोग्य होने का भाव संक्षेप में देता है; कारण की अधिक शाब्दिक अभिव्यक्ति पादटिप्पणी में रखी गई है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत चतुरक्षरीय नाम है। उसे केवल उपाधि ‘प्रभु’ से प्रतिस्थापित न करके हिन्दी लिप्यंतरण में सुरक्षित रखा गया है; ‘यहोवा’ एक वैकल्पिक पारंपरिक स्वरूप है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कथात्मक शैली। मूल की ‘अच्छे—बहुत अच्छे / खराब—बहुत खराब’ पुनरावृत्ति सुरक्षित है। संबोधन ‘यिर्मयाह’ को हिन्दी में स्वाभाविक स्थान पर रखा गया है।
