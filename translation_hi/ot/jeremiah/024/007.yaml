source:
  edition: WLC
  text: וְ/נָתַתִּי֩ לָ/הֶ֨ם לֵ֜ב לָ/דַ֣עַת אֹתִ֗/י כִּ֚י אֲנִ֣י יְהוָ֔ה וְ/הָיוּ לִ֣/י לְ/עָ֔ם וְ/אָ֣נֹכִ֔י אֶהְיֶ֥ה לָ/הֶ֖ם לֵ/אלֹהִ֑ים כִּֽי יָשֻׁ֥בוּ אֵלַ֖/י בְּ/כָל לִבָּֽ/ם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/024/007.yaml
  text: And I will give them a heart to know me[a], that I am Yahweh; and they will be my people, and I will be their God[b], for they will return to me with all their heart.
translation:
  language: hi
  text: और मैं उन्हें ऐसा हृदय दूँगा ताकि वे मुझे जानें कि मैं याहवे हूँ।[a] वे मेरी प्रजा होंगे, और मैं उनका परमेश्वर होऊँगा, क्योंकि वे अपने पूरे हृदय से मेरे पास लौटेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में यहाँ परमेश्वर का नाम יהוה है; इसका एक पारंपरिक हिन्दी रूप ‘यहोवा’ भी है। ‘कि मैं याहवे हूँ’ के स्थान पर ‘क्योंकि मैं याहवे हूँ’ भी संभव है।
    reason: ईश्वरीय नाम और כִּי के वाक्य-संबंध की वैकल्पिक समझ
lexical_decisions:
- source_word: וְנָתַתִּי לָהֶם לֵב
  choice: और मैं उन्हें ऐसा हृदय दूँगा
  rationale: भविष्य की प्रतिज्ञा को स्पष्ट रखा गया है। לֵב को केवल बुद्धि या समझ तक सीमित न करके ‘हृदय’ कहा गया है, क्योंकि यहाँ समूचा भीतरी व्यक्ति—बोध, इच्छा और निष्ठा—अभिप्रेत है।
- source_word: לָדַעַת אֹתִי
  choice: कि वे मुझे जानें
  rationale: ‘जानें’ परमेश्वर के साथ संबंधपरक और वाचागत पहचान को बनाए रखता है; ‘स्वीकार करें’ इसका अर्थ अनावश्यक रूप से संकुचित कर देता।
- source_word: כִּי אֲנִי יְהוָה
  choice: कि मैं यहोवा हूँ
  rationale: כִּי को यहाँ उनके ज्ञान की विषय-वस्तु बताने वाला माना गया है। יהוה को एक उपाधि से बदलने के बजाय हिन्दी में प्रचलित नाम-रूप ‘यहोवा’ रखा गया है।
- source_word: וְהָיוּ לִי לְעָם
  choice: वे मेरी प्रजा होंगे
  rationale: यह वाचा का परिचित सूत्र है। ‘मेरी प्रजा’ स्वाभाविक हिन्दी में संबंध और अपनापन दोनों व्यक्त करता है।
- source_word: וְאָנֹכִי אֶהְיֶה לָהֶם לֵאלֹהִים
  choice: और मैं उनका परमेश्वर होऊँगा
  rationale: वाचा के पारस्परिक सूत्र को बिना व्याख्यात्मक विस्तार के सुरक्षित रखा गया है।
- source_word: כִּי יָשֻׁבוּ אֵלַי
  choice: क्योंकि वे मेरे पास लौट आएँगे
  rationale: अंतिम כִּי को कारणसूचक और שׁוּב को संबंध की पुनर्स्थापना सूचित करने वाला ‘लौटना’ समझा गया है।
- source_word: בְּכָל לִבָּם
  choice: अपने पूरे हृदय से
  rationale: यह इब्रानी मुहावरे की समग्रता बनाए रखता है और आधुनिक हिन्दी में सहज है।
theological_decisions:
- issue: वाचा का पारस्परिक सूत्र
  choice: ‘वे मेरी प्रजा होंगे और मैं उनका परमेश्वर होऊँगा’ को सूत्रात्मक रूप में बनाए रखना
  alternative: अपनापन या संरक्षण समझाने वाला विस्तृत भावानुवाद
  rationale: इब्रानी पाठ यिर्मयाह में बार-बार आने वाला वाचा-सूत्र प्रयोग करता है; उसका परिचित रूप अंतर्पाठीय और धर्मवैचारिक संबंध सुरक्षित रखता है।
- issue: ‘मुझे जानें’ का स्वरूप
  choice: सीधे ‘मुझे जानें’
  alternative: ‘मुझे स्वीकार करें’ अथवा ‘समझें कि मैं यहोवा हूँ’
  rationale: मूल क्रिया संबंधपरक और वाचागत ज्ञान को समेटती है। सीधा अनुवाद इस गहराई और संभावित अर्थ-विस्तार को खुला रखता है।
- issue: ईश्वरीय नाम יהוה
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: नाम को उपाधि में बदलने के बजाय हिन्दी में व्यापक रूप से पहचाना जाने वाला नाम-रूप चुना गया है; पादटिप्पणी अन्य प्रचलित लिप्यंतरण बताती है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘हृदय’, ‘प्रजा’ और वाचा-सूत्र जैसे बाइबिलीय पदों को उनकी अर्थ-गहराई के कारण रखा गया है; वाक्य-विन्यास को हिन्दी में स्वाभाविक बनाने के लिए ‘ऐसा हृदय’ और ‘मेरे पास लौट आएँगे’ का प्रयोग किया गया है।
