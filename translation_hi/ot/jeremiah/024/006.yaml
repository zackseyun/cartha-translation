source:
  edition: WLC
  text: וְ/שַׂמְתִּ֨י עֵינִ֤/י עֲלֵי/הֶם֙ לְ/טוֹבָ֔ה וַ/הֲשִׁבֹתִ֖י/ם עַל הָ/אָ֣רֶץ הַ/זֹּ֑את וּ/בְנִיתִי/ם֙ וְ/לֹ֣א אֶהֱרֹ֔ס וּ/נְטַעְתִּ֖י/ם וְ/לֹ֥א אֶתּֽוֹשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/024/006.yaml
  text: I will set my eyes on them for good[a], and I will bring them back to this land. I will build them up and not tear them down[c][b]; I will plant them and not uproot them.
translation:
  language: hi
  text: मैं उन पर भलाई के लिए अपनी दृष्टि रखूँगा[a] और उन्हें इस देश में लौटा लाऊँगा[b]। मैं उन्हें बनाऊँगा और ढाऊँगा नहीं; मैं उन्हें रोपूँगा और उखाड़ूँगा नहीं[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनकी भलाई के लिए उन पर अपनी दृष्टि रखूँगा।”
    reason: lexical_alternative
  - marker: b
    text: या “उन्हें इस देश में फिर से स्थापित करूँगा।” इब्रानी क्रिया का मूल भाव वापस लाना है।
    reason: lexical_alternative
  - marker: c
    text: 'इब्रानी में पुनर्स्थापना के दो जोड़ीदार रूपक हैं: “बनाना—न ढाना” और “रोपना—न उखाड़ना।”'
    reason: cross_reference
lexical_decisions:
- source_word: וְשַׂמְתִּי עֵינִי עֲלֵיהֶם
  choice: मैं उन पर ... अपनी दृष्टि रखूँगा
  rationale: इब्रानी मुहावरे में किसी पर अपनी आँख रखने का चित्र है। हिंदी में ‘अपनी दृष्टि रखना’ इस चित्र और कृपालु ध्यान—दोनों को स्वाभाविक, गरिमापूर्ण ढंग से बनाए रखता है।
- source_word: לְטוֹבָה
  choice: भलाई के लिए
  rationale: यह अनुकूल उद्देश्य या परिणाम बताता है। ‘भलाई के लिए’ व्यापक अर्थ को बनाए रखता है; संदर्भ से स्पष्ट है कि यह उन्हीं की भलाई है।
- source_word: וַהֲשִׁבֹתִים
  choice: उन्हें ... लौटा लाऊँगा
  rationale: שׁוב का हिफ़ील रूप यहाँ किसी को वापस लाने का ठोस, स्थानगत अर्थ देता है, क्योंकि संदर्भ निर्वासन से देश में वापसी का है।
- source_word: עַל הָאָרֶץ הַזֹּאת
  choice: इस देश में
  rationale: עַל वापसी के क्रियापद के साथ दिशात्मक अर्थ रख सकता है। यहाँ הָאָרֶץ किसी सामान्य पृथ्वी को नहीं, यहूदा के विशिष्ट देश को दर्शाता है। स्वाभाविक हिंदी में ‘इस देश में’ उपयुक्त है।
- source_word: וּבְנִיתִים
  choice: मैं उन्हें बनाऊँगा
  rationale: लोग कर्म हैं, और क्रिया रूपकात्मक पुनर्स्थापना दर्शाती है। ‘बनाऊँगा’ मूल निर्माण-चित्र को सुरक्षित रखता है तथा अगले ‘ढा नहीं दूँगा’ के साथ स्पष्ट युग्म बनाता है।
- source_word: וְלֹא אֶהֱרֹס
  choice: ढा नहीं दूँगा
  rationale: הרס, בנה का स्वाभाविक विपरीत है। ‘बनाऊँगा/ढा नहीं दूँगा’ निर्माण और विध्वंस के मूल रूपकात्मक विरोध को संक्षिप्त रूप में बनाए रखता है।
- source_word: וּנְטַעְתִּים
  choice: मैं उन्हें रोपूँगा
  rationale: कृषि-रूपक को व्याख्यात्मक ‘स्थापित करूँगा’ में बदलने के बजाय मूल पौधा लगाने का चित्र रखा गया है।
- source_word: וְלֹא אֶתּוֹשׁ
  choice: उखाड़ नहीं दूँगा
  rationale: נתש पौधे को जड़ से निकालने का भाव देता है। ‘उखाड़ना’ आधुनिक हिंदी में स्पष्ट है और ‘रोपूँगा’ के साथ मूल रूपकात्मक जोड़ी सुरक्षित रखता है।
theological_decisions:
- issue: वाचा-संबंधी न्याय और उद्धार के संदर्भ में पुनर्स्थापना
  choice: ईश्वर के कृपालु ध्यान, निर्वासन से इस देश में वास्तविक वापसी, और बनाने तथा रोपने के रूपकों को ठोस प्रतिज्ञा के रूप में प्रस्तुत किया गया है।
  alternative: इसे केवल सामान्य समृद्धि या पूर्णतः आत्मिक पुनर्स्थापना की प्रतिज्ञा के रूप में प्रस्तुत करना।
  rationale: निकट संदर्भ उन निर्वासितों के विषय में है जिन पर यहोवा अनुग्रह की दृष्टि रखेगा और जिन्हें देश में वापस लाएगा। अनुवाद ऐतिहासिक और भौगोलिक आशय को स्पष्ट रखता है, पर बाद की किसी विशिष्ट धर्मसैद्धांतिक व्याख्या को आरोपित नहीं करता।
- issue: बनाने और रोपने के रूपकों की व्याख्या
  choice: दोनों रूपकों को उनके नकारात्मक प्रतिरूपों—ढाना और उखाड़ना—के साथ ज्यों का त्यों रखा गया है।
  alternative: रूपकों को केवल ‘पुनर्स्थापित और सुरक्षित करूँगा’ जैसे अमूर्त कथन में बदलना।
  rationale: यिर्मयाह में ये युग्म न्याय और पुनर्स्थापना के बीच जानबूझकर रचा गया तनाव व्यक्त करते हैं; मूल चित्रों को बनाए रखना इस साहित्यिक और धर्मवैचारिक बल को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज किंतु गरिमापूर्ण स्तर अपनाया गया है। ‘दृष्टि रखना’ ईश्वरीय कृपालु ध्यान का मूल नेत्र-चित्र बचाता है। ‘देश’ विशिष्ट भूभाग को दर्शाता है। निर्माण और कृषि के समानांतर रूपकों को संक्षिप्त, सामान्य पाठक के लिए स्पष्ट भाषा में सुरक्षित रखा गया है।
