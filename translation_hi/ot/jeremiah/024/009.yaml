  to: मैं उन्हें पृथ्वी के सभी राज्यों के लिए घोर भय का कारण[a] और विपत्ति, तथा उन सभी स्थानों में जहाँ मैं उन्हें खदेड़ दूँगा[c], निन्दा, कहावत[b], उपहास और शाप बना दूँगा।
