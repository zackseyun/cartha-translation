id: JER.24.9
reference: Jeremiah 24:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/נְתַתִּי/ם֙ ל/זועה לְ/רָעָ֔ה לְ/כֹ֖ל מַמְלְכ֣וֹת הָ/אָ֑רֶץ לְ/חֶרְפָּ֤ה וּ/לְ/מָשָׁל֙ לִ/שְׁנִינָ֣ה וְ/לִ/קְלָלָ֔ה בְּ/כָל הַ/מְּקֹמ֖וֹת אֲשֶֽׁר אַדִּיחֵ֥/ם שָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/024/009.yaml
  text: I will make them a horror[a], a calamity, to all the kingdoms of the earth—a reproach, a proverb, a taunt[c][b], and a curse in all the places where I drive them.
translation:
  language: hi
  text: मैं उन्हें पृथ्वी के सभी राज्यों के लिए घोर भय का कारण[a] और विपत्ति, तथा उन सभी स्थानों में जहाँ मैं उन्हें खदेड़ दूँगा[c], निन्दा, कहावत[b], उपहास और शाप बना दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘भय से सिहरा देने वाली वस्तु’।
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘कहावत’ का अर्थ उनके विषय में तिरस्कार से बार-बार कही जाने वाली उक्ति भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘निर्वासित कर दूँगा’। इस क्रिया का अर्थ बलपूर्वक दूर करना या देश से निकाल देना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתַתִּים
  choice: मैं उन्हें ... बना दूँगा
  rationale: נתן के साथ לְ की इस विधेयात्मक रचना में किसी दशा या स्थिति में कर देने का भाव है; इसलिए यह स्वाभाविक हिन्दी में कारणात्मक अर्थ को व्यक्त करता है।
- source_word: לְזַוֲעָה
  choice: आतंक का कारण
  rationale: संज्ञा ऐसी वस्तु या दशा को बताती है जिसे देखकर लोग भय और सिहरन से भर जाएँ; ‘आतंक का कारण’ हिन्दी में इस वस्तुगत भाव को स्पष्ट करता है।
- source_word: לְרָעָה
  choice: विपत्ति
  rationale: इस न्याय-सूची में רָעָה नैतिक बुराई की अपेक्षा अनिष्ट या विनाशकारी विपत्ति का अर्थ देती है।
- source_word: לְכָל מַמְלְכוֹת הָאָרֶץ
  choice: पृथ्वी के सभी राज्यों के लिए
  rationale: לְ उन राज्यों को वह व्यापक क्षेत्र या समुदाय बताता है जिनकी दृष्टि में वे आतंक और विपत्ति बनेंगे।
- source_word: לְחֶרְפָּה
  choice: निन्दा का विषय
  rationale: חֶרְפָּה अपमान, तिरस्कार और निन्दा को व्यक्त करता है; ‘का विषय’ हिन्दी में लोगों की प्रतिक्रिया को स्वाभाविक रूप से सामने लाता है।
- source_word: וּלְמָשָׁל
  choice: कहावत
  rationale: מָשָׁל यहाँ उनके विषय में बार-बार कही जाने वाली तिरस्कारपूर्ण उक्ति या लोकोक्ति है; मूल शब्द की व्यापकता बनाए रखने के लिए ‘कहावत’ रखा गया है।
- source_word: לִשְׁנִינָה
  choice: उपहास
  rationale: यह दुर्लभ संज्ञा ताना मारने वाली, अपमानजनक बोली को सूचित करती है; ‘उपहास’ इसे מָשָׁל से अलग रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: וְלִקְלָלָה
  choice: शाप का विषय
  rationale: קְלָלָה शाप या शाप देने की उक्ति को बताता है; आशय है कि उनका भाग्य शाप के उदाहरण के रूप में प्रयुक्त होगा।
- source_word: בְּכָל הַמְּקֹמוֹת
  choice: उन सभी स्थानों में
  rationale: यह सीधा स्थानवाचक पद है और निर्वासन के प्रत्येक गन्तव्य को समेटता है।
- source_word: אֲשֶׁר אַדִּיחֵם שָׁם
  choice: जहाँ मैं उन्हें खदेड़ दूँगा
  rationale: נדח का हिफ़ील रूप बलपूर्वक दूर कर देने या निर्वासित करने का अर्थ रखता है; ‘खदेड़ दूँगा’ उस सक्रिय बल को बचाता है।
theological_decisions:
- issue: ईश्वरीय न्याय की संचित सूची
  choice: आतंक, विपत्ति, निन्दा, कहावत, उपहास और शाप को अलग-अलग परिणामों की सूची के रूप में बनाए रखा गया है।
  alternative: पूरी सूची को ‘वे सब राष्ट्रों में बदनाम और अभिशप्त हो जाएँगे’ जैसे एक सार-वाक्य में समेटना।
  rationale: मूल इब्रानी में बार-बार לְ लगाकर न्याय के अनेक सार्वजनिक परिणाम संचित किए गए हैं। सूची बनाए रखने से उसकी वाग्मिता और धार्मिक तनाव सुरक्षित रहता है।
- issue: מָשָׁל और שְׁנִינָה का परस्पर सम्बन्ध
  choice: उन्हें क्रमशः ‘कहावत’ और ‘उपहास’ के रूप में अलग रखा गया है।
  alternative: दोनों को ‘ताना’ या ‘बदनामी की कहावत’ में मिला देना।
  rationale: दोनों शब्दों के अर्थ-क्षेत्र एक-दूसरे से मिलते हैं, फिर भी मूल पाठ उन्हें अलग पदों के रूप में रखता है; अनुवाद ने उस भेद को कृत्रिम रूप से समाप्त नहीं किया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज और भविष्यद्वाणी-संगत स्वर रखा गया है। लम्बी इब्रानी सूची को हिन्दी में स्पष्ट करने के लिए दूसरे खण्ड में ‘का विषय बनेंगे’ जोड़ा गया है, पर सूची के पृथक पद सुरक्षित हैं।
