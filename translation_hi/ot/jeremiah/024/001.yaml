  text: הִרְאַ/נִי֮ יְהוָה֒ וְ/הִנֵּ֗ה שְׁנֵי֙ דּוּדָאֵ֣י תְאֵנִ֔ים מוּעָדִ֕ים לִ/פְנֵ֖י הֵיכַ֣ל יְהוָ֑ה אַחֲרֵ֣י הַגְל֣וֹת נְבוּכַדְרֶאצַּ֣ר מֶֽלֶךְ בָּבֶ֡ל אֶת יְכָנְיָ֣הוּ בֶן יְהוֹיָקִ֣ים מֶֽלֶךְ יְהוּדָה֩ וְ/אֶת שָׂרֵ֨י יְהוּדָ֜ה וְ/אֶת הֶ/חָרָ֤שׁ וְ/אֶת הַ/מַּסְגֵּר֙ מִ/יר֣וּשָׁלִַ֔ם וַ/יְבִאֵ֖/ם בָּבֶֽל־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/024/001.yaml
  text: Yahweh showed me[a], and behold, two baskets of figs were set before the temple of Yahweh, after Nebuchadrezzar king of Babylon had taken into exile Jeconiah son of Jehoiakim, king of Judah, along with the officials of Judah, the craftsmen, and the smiths from Jerusalem[c][b], and had brought them to Babylon.
translation:
  language: hi
  text: 'याहवे ने मुझे यह दिखाया: देखो, याहवे के मंदिर के सामने अंजीरों से भरी दो टोकरियाँ रखी थीं। यह उस घटना के बाद की बात है, जब बाबेल का राजा नबूकदरेस्सर[a] यहूदा के राजा यहोयाकीम के पुत्र यकन्याह, यहूदा के अधिकारियों[b], कारीगरों और धातुकर्मियों[c] को यरूशलेम से निर्वासित करके बाबेल ले गया था।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में नाम का रूप ‘नबूकदरेस्सर’ है; अधिक परिचित रूप ‘नबूकदनेस्सर’ है।
    reason: lexical_alternative
  - marker: b
    text: या, “यहूदा के प्रधानों।”
    reason: lexical_alternative
  - marker: c
    text: या, “लोहारों।” इब्रानी शब्द का सटीक अर्थ अनिश्चित है; संभवतः यह कुशल धातुकर्मियों को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִרְאַנִי
  choice: ने मुझे यह दिखाया
  rationale: ראה के हिफ़ील रूप का स्वाभाविक हिन्दी अर्थ ‘दिखाया’ है; ‘यह’ आगे आने वाले दृश्य की ओर संकेत करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: व्यक्तिगत ईश्वरीय नाम को उपाधि से प्रतिस्थापित न करके स्रोत के अनुसार लिप्यंतरित किया गया है।
- source_word: וְהִנֵּה
  choice: देखो
  rationale: दृश्य की सजीव और आकस्मिक प्रस्तुति को बनाए रखता है।
- source_word: שְׁנֵי דּוּדָאֵי תְאֵנִים
  choice: अंजीरों से भरी दो टोकरियाँ
  rationale: דּוּד यहाँ उपज रखने की टोकरी को दर्शाता है; हिन्दी में ‘अंजीरों से भरी’ पात्र और सामग्री का सम्बन्ध सहज रूप से व्यक्त करता है।
- source_word: מוּעָדִים
  choice: रखी थीं
  rationale: यहाँ יעד का निष्क्रिय कृदन्त वस्तुओं के किसी स्थान पर रखे होने को दर्शाता है।
- source_word: לִפְנֵי הֵיכַל יְהוָה
  choice: याहवे के मन्दिर के सामने
  rationale: הֵיכָל का प्रसंगानुकूल अर्थ मन्दिर है और לִפְנֵי स्थानगत रूप से ‘के सामने’ है।
- source_word: אַחֲרֵי הַגְלוֹת
  choice: उस समय के बाद ... निर्वासित करके
  rationale: पूर्वकालिक क्रम तथा बलपूर्वक देश से ले जाए जाने का भाव स्पष्ट करता है।
- source_word: נְבוּכַדְרֶאצַּר
  choice: नबूकदरेस्सर
  rationale: इस पद में पाए जाने वाले इब्रानी रूप को अधिक परिचित वैकल्पिक रूप से मिलाए बिना निकटता से लिप्यंतरित किया गया है।
- source_word: יְכָנְיָהוּ
  choice: यकन्याह
  rationale: इब्रानी नामरूप का निकट हिन्दी लिप्यंतरण है।
- source_word: שָׂרֵי יְהוּדָה
  choice: यहूदा के अधिकारियों
  rationale: שָׂרִים शासकीय पदाधिकारियों या प्रधानों को दर्शा सकता है; ‘अधिकारी’ आधुनिक हिन्दी में स्पष्ट है और राजपुत्र होने का अनावश्यक संकेत नहीं देता।
- source_word: הֶחָרָשׁ
  choice: कारीगरों
  rationale: एकवचन सामूहिक संज्ञा को समूह के अर्थ में बहुवचन किया गया है; शब्द विभिन्न प्रकार के कुशल शिल्पियों को दर्शा सकता है।
- source_word: הַמַּסְגֵּר
  choice: धातु-कर्मियों
  rationale: शब्द का सटीक पेशागत अर्थ विवादित है, पर सम्भवतः धातु का काम करने वाले कुशल श्रमिक अभिप्रेत हैं; इसे पादटिप्पणी में खुला रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत नाम का प्रयोग करता है; उसे उपाधि में बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- issue: שָׂרֵי יְהוּדָה की सामाजिक पहचान
  choice: यहूदा के अधिकारी
  alternative: यहूदा के प्रधान
  rationale: शब्द का अर्थ शासकीय नेता या प्रधान दोनों हो सकता है; मुख्य पाठ में आधुनिक और व्यापक ‘अधिकारी’ रखा गया तथा विकल्प पादटिप्पणी में दिया गया है।
- issue: दो निर्वासित पेशागत समूहों की पहचान
  choice: कारीगर और धातु-कर्मी
  alternative: शिल्पी और लोहार/दुर्ग-निर्माता
  rationale: इब्रानी पदों की सटीक पेशागत सीमाएँ अनिश्चित हैं; इसलिए मुख्य पाठ सम्भावित व्यापक अर्थ देता है और पादटिप्पणी अस्पष्टता सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, कथात्मक शैली रखी गई है। ‘देखो’ ने दर्शनीय प्रकाशन की जीवंतता बनाए रखी है। ‘निर्वासित करके बाबेल ले गया’ घटना की बलपूर्वकता और गन्तव्य दोनों स्पष्ट करता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में सम्बद्ध शब्दों के तुरंत बाद दिए गए हैं।
