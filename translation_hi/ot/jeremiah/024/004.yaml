- source_word: יְהוָה
  choice: यहोवा
  rationale: यह इब्रानी चतुरक्षरीय दिव्य नाम का हिन्दी में प्रचलित लिप्यंतरण है, किसी उपाधि से उसका प्रतिस्थापन नहीं।
- source_word: אֵלַי
  choice: मेरे पास
  rationale: प्रसंग में दिशा-सूचक अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: לֵאמֹר
  choice: ':'
  rationale: यह रूप अगले पद में आने वाले प्रत्यक्ष कथन का स्वाभाविक परिचय देता है; हिन्दी में ‘यह कहते हुए’ जोड़ना अनावश्यक रूप से भारी होगा।
theological_decisions:
