  rationale: यह नबूवत की प्रचलित इब्रानी अभिव्यक्ति का स्वाभाविक हिन्दी रूप है; शाब्दिक ‘हुआ’ की अपेक्षा ‘वचन ... आया’ अर्थ और शैली दोनों को बेहतर रखता है।
- source_word: דְבַר
