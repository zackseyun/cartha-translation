  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम है। हिन्दी पाठकों के लिए स्थापित रूप ‘यहोवा’ नाम को नाम ही रहने देता है; ‘प्रभु’ उसे उपाधि में बदल देता, जबकि ‘याहवे’ अधिक विद्वतापूर्ण पुनर्निर्मित उच्चारण है।
translation_notes:
