id: JER.24.8
reference: Jeremiah 24:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/כַ/תְּאֵנִים֙ הָֽ/רָע֔וֹת אֲשֶׁ֥ר לֹא תֵאָכַ֖לְנָה מֵ/רֹ֑עַ כִּי כֹ֣ה אָמַ֣ר יְהוָ֗ה כֵּ֣ן אֶ֠תֵּן אֶת צִדְקִיָּ֨הוּ מֶֽלֶךְ יְהוּדָ֤ה וְ/אֶת שָׂרָי/ו֙ וְ/אֵ֣ת שְׁאֵרִ֣ית יְרוּשָׁלִַ֗ם הַ/נִּשְׁאָרִים֙ בָּ/אָ֣רֶץ הַ/זֹּ֔את וְ/הַ/יֹּשְׁבִ֖ים בְּ/אֶ֥רֶץ מִצְרָֽיִם־־׀־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/024/008.yaml
  text: 'But like the bad figs that cannot be eaten because they are so bad[a], thus says Yahweh: so I will make Zedekiah king of Judah, his officials, the remnant of Jerusalem who remain in this land, and those who dwell in the land of Egypt.'
translation:
  language: hi
  text: '“परन्तु जैसे खराब अंजीर इतने खराब होते हैं कि खाए नहीं जा सकते, वैसे ही याहवे यों कहता है: मैं यहूदा के राजा सिदकिय्याह को, उसके अधिकारियों को, यरूशलेम के उन बचे हुए लोगों को जो इस देश में रह गए हैं, और उन लोगों को जो मिस्र देश में रहते हैं, दे दूँगा[a]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “दूँगा।” प्रसंग में इसका भाव “सौंप दूँगा” या “उनके साथ इन खराब अंजीरों के समान व्यवहार करूँगा” हो सकता है।
    reason: इब्रानी נתן के शाब्दिक अर्थ और उपमा से प्राप्त संदर्भगत न्यायार्थ, दोनों को सुरक्षित रखना।
lexical_decisions:
- source_word: וְ/כַ/תְּאֵנִים הָרָעוֹת
  choice: परन्तु उन खराब अंजीरों के समान
  rationale: वाव को पिछले पद के अच्छे अंजीरों से विरोध दिखाने के लिए ‘परन्तु’ और तुलनात्मक כ को ‘के समान’ से व्यक्त किया गया है। फल की दशा के लिए ‘खराब’ स्वाभाविक है और अनावश्यक नैतिक अर्थ नहीं जोड़ता।
- source_word: לֹא תֵאָכַלְנָה מֵרֹעַ
  choice: जो इतने खराब हैं कि खाए नहीं जा सकते
  rationale: मִן के कारणसूचक भाव और अंजीरों की अत्यधिक खराब दशा, जिसके कारण वे अखाद्य हैं, दोनों को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी व्यक्तिवाचक ईश्वरीय नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: כֵּן אֶתֵּן
  choice: वैसे ही मैं ... दे दूँगा
  rationale: נתן के मूल अर्थ ‘देना’ को बनाए रखते हुए ‘वैसे ही’ से खराब अंजीरों की पूर्ववर्ती तुलना से इसका संबंध स्पष्ट किया गया है। आगे के पद बताते हैं कि किस परिणाम के लिए दिया जाएगा; यहाँ उसे पहले से विस्तार देकर नहीं जोड़ा गया।
- source_word: שָׂרָיו
  choice: उसके अधिकारियों
  rationale: राजकीय और दरबारी नेतृत्व के लिए आधुनिक हिन्दी में ‘अधिकारी’ स्पष्ट है; ‘हाकिमों’ या ‘राजकुमारों’ की अपेक्षा संदर्भानुकूल है।
- source_word: שְׁאֵרִית יְרוּשָׁלִַם הַנִּשְׁאָרִים
  choice: यरूशलेम के उन बचे हुए लोगों को जो ... रह गए हैं
  rationale: ‘बचे हुए लोग’ שְׁאֵרִית का सामूहिक अर्थ और הַנִּשְׁאָרִים का शेष रह जाने वाला भाव दोनों स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְהַיֹּשְׁבִים בְּאֶרֶץ מִצְרָיִם
  choice: और उन लोगों को जो मिस्र देश में रहते हैं
  rationale: निवाससूचक कृदन्त और ‘मिस्र देश’ की इब्रानी अभिव्यक्ति दोनों सुरक्षित रखे गए हैं।
theological_decisions:
- issue: खराब अंजीरों की उपमा में כֵּן אֶתֵּן का अर्थ
  choice: मुख्य पाठ में ‘वैसे ही मैं ... दे दूँगा’
  alternative: ‘वैसे ही मैं ... बना दूँगा’ अथवा ‘सौंप दूँगा’
  rationale: इब्रानी נתן का शाब्दिक अर्थ ‘देना’ है, जबकि तुलना उसके न्यायात्मक आशय की ओर संकेत करती है। ‘दे दूँगा’ मूल शब्द और तत्काल पाठ की अपूर्ण-सी तनावपूर्ण अभिव्यक्ति को बनाए रखता है; पादटिप्पणी संभावित संदर्भगत अर्थ स्पष्ट करती है, बिना अगले पदों का विवरण यहाँ आयात किए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। भविष्यवाणी की औपचारिक घोषणा के लिए ‘यहॊवा यों कहता है’ और भू-राजनीतिक संदर्भ के लिए ‘यहूदा’, ‘यरूशलेम’ तथा ‘मिस्र देश’ के प्रचलित हिन्दी रूप प्रयुक्त हैं।
