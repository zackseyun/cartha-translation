- source_word: בְּשַׁעַר הַתָּוֶךְ
  choice: मध्य फाटक में
  rationale: शब्दशः ‘बीच/मध्य का फाटक’; सम्भवतः यह किसी विशिष्ट फाटक का नाम या पदनाम है। בְ के कारण ‘में’ मुख्य पाठ में रखा गया है, जबकि ‘पर’ भी प्रसंगानुकूल सम्भव है।
- source_word: נֵרְגַל שַׂר אֶצֶר
  choice: नेर्गल-शरेसेर
  rationale: बेबीलोनी व्यक्तिगत नाम का हिन्दी लिप्यंतरण किया गया है।
- source_word: סַמְגַּר נְבוּ
  choice: समगर-नबू
  rationale: मसोरा-पाठ के अनुसार नाम का लिप्यंतरण; पूरे नाम-पद अनुक्रम का विभाजन अनिश्चित है।
- source_word: שַׂר סְכִים
  choice: सर-सकीम
  rationale: मसोरा-पाठ इसे नाम के रूप में पढ़ने की अनुमति देता है; लिप्यंतरण अनिश्चित पद-विभाजन को मुख्य पाठ में अतिनिश्चित नहीं बनाता।
- source_word: רַב סָרִיס
  choice: रब-सारीस
  rationale: यह बेबीलोनी पदवी है। लिप्यंतरण ‘प्रधान खोजा’ जैसी सम्भव पर सीमित व्याख्या को मुख्य पाठ पर आरोपित करने से बचाता है।
- source_word: רַב מָג
  choice: रब-माग
  rationale: प्राचीन बेबीलोनी उच्च पदवी का लिप्यंतरण किया गया है, क्योंकि इसका सटीक कार्य अनिश्चित है।
- source_word: וְכָל שְׁאֵרִית שָׂרֵי מֶלֶךְ בָּבֶל
  choice: और बाबेल के राजा के शेष सभी अधिकारी
  rationale: שְׁאֵרִית यहाँ उन बाकी अधिकारियों को सूचित करता है जिनके नाम अलग से नहीं दिए गए।
