base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/003.yaml
  text: 'Then all the officials of the king of Babylon came in and sat in the Middle Gate: Nergal-sharezer[a], Samgar-nebu, Sarsechim the Rab-saris, Nergal-sharezer the Rab-mag[d][c][b], and all the rest of the officials of the king of Babylon.'
translation:
  language: hi
  text: 'तब बाबेल के राजा के सभी अधिकारी भीतर आए और मध्य फाटक में[a] बैठ गए: नेर्गल-शरेसेर, समगर-नबू, सर-सकीम रब-सारीस[b], नेर्गल-शरेसेर रब-माग[c], और बाबेल के राजा के शेष सभी अधिकारी।[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मध्य फाटक पर’। इस प्रसंग में इब्रानी संबंधबोधक शब्द का अनुवाद दोनों प्रकार से हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘रब-सारीस’ एक बेबीलोनी पदवी है, जिसे परम्परागत रूप से ‘प्रधान खोजा’ या ‘प्रधान राज-अधिकारी’ के समान समझा जाता है।
    reason: cultural_note
  - marker: c
    text: ‘रब-माग’ एक बेबीलोनी पदवी है; सम्भवतः इसका अर्थ ‘प्रधान माग’ अथवा कोई उच्च धार्मिक-अनुष्ठानिक अधिकारी है।
    reason: cultural_note
  - marker: d
    text: ‘समगर-नबू, सर-सकीम रब-सारीस’ वाला नाम-पद अनुक्रम कठिन है। कुछ विद्वान नामों और पदवियों का विभाजन अलग प्रकार से करते हैं—जैसे ‘समगर’ को पदवी या ‘सर-सकीम’ को व्यक्तिगत नाम के बजाय पद मानना।
    reason: alternative_reading
