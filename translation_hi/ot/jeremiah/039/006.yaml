  text: וַ/יִּשְׁחַט֩ מֶ֨לֶךְ בָּבֶ֜ל אֶת בְּנֵ֧י צִדְקִיָּ֛הוּ בְּ/רִבְלָ֖ה לְ/עֵינָ֑י/ו וְ/אֵת֙ כָּל חֹרֵ֣י יְהוּדָ֔ה שָׁחַ֖ט מֶ֥לֶךְ בָּבֶֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/006.yaml
  text: The king of Babylon slaughtered the sons of Zedekiah at Riblah before his eyes[a], and the king of Babylon slaughtered all the nobles of Judah.
translation:
  language: hi
  text: बाबेल के राजा ने रिबला में सिदकिय्याह की आँखों के सामने सिदकिय्याह के पुत्रों का वध किया; और बाबेल के राजा ने यहूदा के सभी कुलीनों[a] का वध किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा “यहूदा के अधिकारियों।”
    reason: חֹרֵי का अर्थ उच्च पद वाले कुलीन या शासकीय अधिकारी हो सकता है; मुख्य पाठ सामाजिक प्रतिष्ठा पर बल देता है और पादटिप्पणी संभावित पदाधिकार-संबंधी अर्थ सुरक्षित रखती है।
lexical_decisions:
- source_word: וַיִּשְׁחַט / שָׁחַט
  choice: वध किया
  rationale: यह प्रयोग हिंसक रूप से जान लेने के भाव को बनाए रखता है और साधारण ‘मार दिया’ की अपेक्षा मूल क्रिया की कठोरता को अधिक स्पष्ट करता है।
- source_word: מֶלֶךְ בָּבֶל
  choice: बाबेल के राजा
  rationale: यह संबंधसूचक पदबंध का सीधा और स्वाभाविक हिन्दी रूप है। इब्रानी की पुनरावृत्ति के अनुसार इसे दोनों खंडों में रखा गया है।
- source_word: בְּנֵי צִדְקִיָּהוּ
  choice: सिदकिय्याह के पुत्रों
  rationale: בְּנֵי यहाँ पुरुष संतानों को सूचित करता है; इसलिए ‘पुत्रों’ सटीक है।
- source_word: בְּרִבְלָה
  choice: रिबला में
  rationale: स्थानवाचक בְּ का स्वाभाविक हिन्दी रूप ‘में’ है।
- source_word: לְעֵינָיו
  choice: उसकी आँखों के सामने
  rationale: यह इब्रानी मुहावरे की सजीवता बनाए रखते हुए स्पष्ट करता है कि सिदकिय्याह ने यह घटना स्वयं देखी।
- source_word: כָּל
  choice: सभी
  rationale: सामूहिक बहुवचन ‘कुलीनों’ के साथ ‘सभी’ स्वाभाविक है।
- source_word: חֹרֵי יְהוּדָה
  choice: यहूदा के कुलीनों
  rationale: חֹרִים यहाँ उच्च सामाजिक या राजनीतिक पद वाले लोगों को दर्शाता है। ‘कुलीनों’ इसका प्रमुख अर्थ रखता है, जबकि ‘अधिकारियों’ भी प्रसंगानुकूल संभव है।
- source_word: יְהוּדָה
  choice: यहूदा
  rationale: इस क्षेत्र और राजनीतिक इकाई के नाम का प्रचलित हिन्दी बाइबलीय रूप।
