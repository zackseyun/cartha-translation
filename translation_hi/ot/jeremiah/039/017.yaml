source:
  edition: WLC
  text: וְ/הִצַּלְתִּ֥י/ךָ בַ/יּוֹם הַ/ה֖וּא נְאֻם יְהוָ֑ה וְ/לֹ֤א תִנָּתֵן֙ בְּ/יַ֣ד הָֽ/אֲנָשִׁ֔ים אֲשֶׁר אַתָּ֥ה יָג֖וֹר מִ/פְּנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/017.yaml
  text: But I will deliver you on that day[a], declares Yahweh[b], and you will not be given into the hand of the men of whom you are afraid.
translation:
  language: hi
  text: “पर उस दिन मैं तुझे छुड़ा लूँगा[a]—यह याहवे की घोषणा है—और तुझे उन पुरुषों के हाथ में[b] नहीं सौंपा जाएगा, जिनसे तू डरता है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बचा लूँगा।” इब्रानी क्रिया का अर्थ किसी को खतरे से छुड़ाना या बचाना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “हाथ में” का अर्थ यहाँ “अधिकार में” या “वश में” है।
    reason: idiom_explanation
lexical_decisions:
- source_word: וְהִצַּלְתִּיךָ
  choice: पर … मैं तुझे छुड़ा लूँगा
  rationale: हिफ़ील रूप यहाँ खतरे से बचाने या छुड़ाने का भाव देता है। प्रसंग के विरोधात्मक संबंध को स्वाभाविक हिन्दी में व्यक्त करने के लिए וְ को ‘पर’ किया गया है।
- source_word: בַיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह सामान्य कालवाचक पदबंध है; ‘उस दिन’ आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: भविष्यद्वाणी के प्रामाणिक सूत्र को सहज, गरिमापूर्ण हिन्दी में रखा गया है और परमेश्वर के व्यक्तिगत नाम को लिप्यंतरित किया गया है।
- source_word: וְלֹא תִנָּתֵן
  choice: और तू … नहीं दिया जाएगा
  rationale: निफ़ाल रूप के कर्मवाच्य अर्थ को सीधे बनाए रखा गया है; अगले पदबंध से शत्रुओं के अधिकार में सौंपे जाने का भाव स्पष्ट होता है।
- source_word: בְּיַד הָאֲנָשִׁים
  choice: उन पुरुषों के हाथ में
  rationale: ‘हाथ में’ स्रोत की सजीव उपमा को सुरक्षित रखता है और हिन्दी में अधिकार या नियंत्रण का अर्थ भी समझ में आता है। הָאֲנָשִׁים को इस विशिष्ट पुरुष-समूह के लिए ‘पुरुषों’ कहा गया है।
- source_word: אֲשֶׁר אַתָּה יָגוֹר מִפְּנֵיהֶם
  choice: जिनसे तू डरता है
  rationale: גור और מִפְּנֵיהֶם का संयुक्त भाव इन लोगों से भय खाने का है; यह रूप आधुनिक हिन्दी में स्वाभाविक है और भय की तीव्रता को अनावश्यक रूप से नहीं बढ़ाता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: इब्रानी पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसे सामान्य उपाधि में बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: הִצִּיל के उद्धार-संबंधी अर्थ की सीमा
  choice: छुड़ा लूँगा
  alternative: बचा लूँगा; उद्धार करूँगा
  rationale: यहाँ निकट प्रसंग शत्रु पुरुषों से शारीरिक सुरक्षा का है। ‘छुड़ा लूँगा’ इस ठोस अर्थ को रखता है और व्यापक आध्यात्मिक उद्धार का अर्थ पाठ पर नहीं थोपता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली अपनाई गई है। एक व्यक्ति को संबोधन होने के कारण पूरे वाक्य में ‘तू/तुझे’ रखा गया है। स्रोत की ‘हाथ’ वाली उपमा सुरक्षित है, और विराम-चिह्नों से भविष्यद्वाणी-सूत्र को मुख्य प्रतिज्ञा से स्पष्ट किया गया है।
