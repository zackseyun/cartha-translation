  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सहज कथात्मक शैली। वंशावली को हिन्दी की स्वाभाविक क्रम-रचना ‘शापान के पोते, अहीकाम के पुत्र’ में रखा गया है। मूल की ‘घर’ संबंधी अस्पष्टता को किसी व्यक्ति का घर बताकर सीमित नहीं किया गया।
