  text: So they sent and took Jeremiah from the court of the guard, and they entrusted him to Gedaliah son of Ahikam, son of Shaphan, to bring him home. So he lived among the people.
translation:
  language: hi
  text: तब उन्होंने भेजकर यिर्मयाह को पहरेदारों के आँगन से ले आया और उसे अहीकाम के पुत्र, शापान के पोते गदल्याह को सौंप दिया, ताकि वह उसे घर ले जाए। इस प्रकार यिर्मयाह लोगों के बीच रहने लगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵחֲצַר הַמַּטָּרָה
  choice: पहरेदारों के आँगन से
  rationale: यह बंदी रखने या निगरानी के लिए प्रयुक्त सुरक्षित प्रांगण को दर्शाता है; आधुनिक हिन्दी में यह स्वाभाविक और संदर्भानुकूल है।
- source_word: וַיִּתְּנוּ אֹתוֹ אֶל גְּדַלְיָהוּ
  choice: उसे ... गदल्याह को सौंप दिया
  rationale: शाब्दिक ‘दिया’ की अपेक्षा ‘सौंप दिया’ यहाँ व्यक्ति को किसी की देखरेख में देने का भाव स्पष्ट करता है।
- source_word: לְהוֹצִיאֵהוּ אֶל הַבָּיִת
  choice: ताकि वह उसे घर ले जाए
  rationale: הַבַּיִת का शाब्दिक अर्थ ‘घर’ है। सन्दर्भ यह निश्चित नहीं करता कि यह गदल्याह का घर था या यिर्मयाह का; इसलिए स्वामित्व नहीं जोड़ा गया।
- source_word: וַיֵּשֶׁב בְּתוֹךְ הָעָם
  choice: इस प्रकार यिर्मयाह लोगों के बीच रहने लगा
  rationale: क्रिया का अर्थ बैठना या निवास करना हो सकता है; कथा-संदर्भ में निरंतर निवास का भाव उपयुक्त है और स्पष्टता के लिए कर्ता का नाम दोहराया गया है।
