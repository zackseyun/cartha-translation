  text: הָל֣וֹךְ וְ/אָמַרְתָּ֡ לְ/עֶבֶד מֶ֨לֶךְ הַ/כּוּשִׁ֜י לֵ/אמֹ֗ר כֹּֽה אָמַ֞ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הִנְ/נִי֩ מבי אֶת דְּבָרַ֜/י אֶל הָ/עִ֥יר הַ/זֹּ֛את לְ/רָעָ֖ה וְ/לֹ֣א לְ/טוֹבָ֑ה וְ/הָי֥וּ לְ/פָנֶ֖י/ךָ בַּ/יּ֥וֹם הַ/הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/016.yaml
  text: 'Go and say to Ebed-melech the Cushite[a], ‘Thus says Yahweh of hosts, the God of Israel: Behold, I am bringing my words against this city for harm and not for good[b], and they will come to pass before you on that day.’'
translation:
  language: hi
  text: '“जाकर कूशी एबेद-मेलेक[a] से कह, ‘सेनाओं का याहवे, इस्राएल का परमेश्वर, यों कहता है: देख, मैं अपने वचनों को इस नगर के विरुद्ध विपत्ति के लिए, भलाई के लिए नहीं, ला रहा हूँ[b]; और उस दिन वे तेरे सामने होंगे।’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इथियोपियाई।” इब्रानी में “कूशी” है।
    reason: lexical_alternative
  - marker: b
    text: या “अनिष्ट के लिए, भलाई के लिए नहीं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלוֹךְ וְאָמַרְתָּ
  choice: जाकर ... कह
  rationale: इन्फिनिटिव ऐब्सोल्यूट और सीमित क्रिया मिलकर आदेश को दृढ़ बनाते हैं। आधुनिक हिन्दी में “जाकर ... कह” उसका स्वाभाविक निर्देशात्मक बल व्यक्त करता है।
- source_word: לְעֶבֶד מֶלֶךְ
  choice: एबेद-मेलेक से
  rationale: यहाँ यह व्यक्ति का नाम है; इसलिए इसका अर्थानुवाद न करके देवनागरी में लिप्यंतरण किया गया है।
- source_word: הַכּוּשִׁי
  choice: कूशी
  rationale: यह मूल जातिसूचक शब्द ‘कूश’ से सीधे बना रूप है और बाद की भौगोलिक पहचान को पाठ पर आरोपित नहीं करता।
- source_word: כֹּה אָמַר
  choice: यों कहता है
  rationale: यह भविष्यद्वक्ताओं का मानक संदेशवाहक सूत्र है; हिन्दी में यह गरिमापूर्ण और सहज है।
- source_word: יְהוָה
  choice: याहवे
  rationale: उपाधि से बदलने के बजाय परमेश्वर के व्यक्तिगत नाम का प्रचलित हिन्दी लिप्यंतरण रखा गया है।
- source_word: צְבָאוֹת
  choice: सेनाओं का
  rationale: यह ईश्वरीय उपाधि परमेश्वर के अधीन स्वर्गीय और सांसारिक सैन्य-समूहों की व्यापक धारणा को व्यक्त करती है।
- source_word: הִנְנִי
  choice: देख, मैं
  rationale: यह रचना गंभीरता और आसन्न क्रिया पर ध्यान खींचती है; “देख” आधुनिक हिन्दी में स्पष्ट रहते हुए उस बल को बनाए रखता है।
- source_word: מבי (מֵבִיא)
  choice: ला रहा हूँ
  rationale: कृदंत आसन्न अथवा निश्चित क्रिया को दर्शाता है; वर्तमान प्रगतिशील हिन्दी रूप इसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֶת דְּבָרַי
  choice: अपने वचन
  rationale: मूल में बहुवचन है और यह पहले घोषित न्याय-संदेशों की ओर संकेत करता है; हिन्दी में ‘वचन’ का रूप संख्या की दृष्टि से समान रह सकता है, पर प्रसंग इसे सामूहिक बहुवचन अर्थ देता है।
- source_word: אֶל הָעִיר הַזֹּאת
  choice: इस नगर के विरुद्ध
  rationale: אֶל सामान्यतः दिशा बताता है, पर न्याय के वचनों के प्रसंग में हिन्दी का “के विरुद्ध” प्रतिकूल दिशा को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְרָעָה וְלֹא לְטוֹבָה
  choice: विपत्ति के लिए ... भलाई के लिए नहीं
  rationale: न्याय के प्रसंग में רָעָה नैतिक बुराई से अधिक अनिष्ट या विपत्ति को दर्शाता है। ‘भलाई’ के साथ मूल विरोध भी सुरक्षित रखा गया है।
- source_word: וְהָיוּ לְפָנֶיךָ
  choice: वे तेरे सामने पूरे होंगे
  rationale: शाब्दिक रूप ‘वे तेरे सामने होंगे’ है। प्रसंग में वचनों का सामने होना उनके प्रत्यक्ष रूप से घटित/पूरा होने को बताता है; अनुवाद इस अर्थ को स्पष्ट करता है और ‘तेरे सामने’ को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे आया है। उसे उपाधि से बदलने के बजाय लिप्यंतरित करने से वाचा-संबंधी नाम सुरक्षित रहता है; ‘यहोवा’ एक पारंपरिक वैकल्पिक स्वरूप है।
- issue: न्यायसूचक רָעָה का अर्थ
  choice: विपत्ति
  alternative: अनिष्ट; बुराई
  rationale: यहाँ नगर पर घोषित ऐतिहासिक न्याय की बात है, परमेश्वर द्वारा नैतिक बुराई करने की नहीं। इसलिए ‘विपत्ति’ प्रसंगगत अर्थ को व्यक्त करता है, जबकि पादटिप्पणी निकट वैकल्पिक शब्द देती है।
- issue: וְהָיוּ לְפָנֶיךָ में भविष्यवाणी के साकार होने का भाव
  choice: तेरे सामने पूरे होंगे
  alternative: तेरे सामने होंगे
  rationale: मूल अभिव्यक्ति संक्षिप्त है और शाब्दिक रूप से ‘होंगे’ कहती है। वचन नगर पर आने वाले हैं, इसलिए प्रसंग में उनका एबेद-मेलेक की आँखों के सामने साकार होना अभिप्रेत है; ‘तेरे सामने’ मूल की प्रत्यक्षता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यद्वक्ताई शैली रखी गई है। संबोधन के लिए एकवचन ‘तेरे’ मूल के एकवचन रूप और ईश्वरीय संदेश की सीधी शैली को दर्शाता है। वाक्य सामान्य पाठक के लिए सुबोध है, जबकि ‘यों कहता है’ और ‘वचन’ जैसे पद बाइबलीय गरिमा बनाए रखते हैं।
