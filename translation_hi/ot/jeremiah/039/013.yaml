  text: וַ/יִּשְׁלַ֞ח נְבֽוּזַרְאֲדָ֣ן רַב טַבָּחִ֗ים וּ/נְבֽוּשַׁזְבָּ רַב סָרִ֔יס וְ/נֵרְגַ֥ל שַׂר אֶ֖צֶר רַב מָ֑ג וְ/כֹ֖ל רַבֵּ֥י מֶֽלֶךְ בָּבֶֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/013.yaml
  text: Nebuzaradan the captain of the guard[a], Nebushazban the chief officer, Nergal-sharezer the chief magus[c][b], and all the chief officials of the king of Babylon sent word.
translation:
  language: hi
  text: तब अंगरक्षक-दल के प्रधान नबूजरदान, प्रधान राज-अधिकारी नबूशजबान[b], प्रधान मागी नेर्गल-शरेसेर[c] और बाबेल के राजा के सभी प्रमुख अधिकारियों ने भेजा[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या केवल, “भेजा।” इब्रानी में यहाँ क्रिया का कर्म व्यक्त नहीं किया गया है, और अगला पद उनके द्वारा आरम्भ की गई कार्रवाई को आगे बढ़ाता है।
    reason: lexical_alternative
  - marker: b
    text: “प्रधान राज-अधिकारी” वाली उपाधि का अनुवाद “प्रधान खोजा” या “दरबार का प्रधान अधिकारी” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: “प्रधान मागी” बाबेल के दरबार की एक उपाधि है; परंपरागत रूप से कुछ अनुवाद इसे बिना अनुवाद किए “रब-माग” लिखते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: भेजा
  rationale: मूल क्रिया का अर्थ केवल ‘भेजना’ है और उसका कर्म यहाँ व्यक्त नहीं किया गया; अगला पद आरम्भ की गई कार्रवाई को आगे बढ़ाता है। इसलिए अनिश्चित कर्म को मुख्य पाठ में जोड़ने के बजाय मूल की दीर्घवृत्तता सुरक्षित रखी गई है। संयुक्त कर्ताओं के कारण हिंदी में ‘ने’ का बहुवचन-संगत प्रयोग हुआ है।
- source_word: רַב טַבָּחִים
  choice: अंगरक्षक-दल के प्रधान
  rationale: यह राजदरबार का पद है, जिसका आशय शाही पहरे या अंगरक्षक-दल के प्रमुख से है; शाब्दिक ‘जल्लादों के प्रधान’ से आधुनिक पाठक को पद का दायरा अनावश्यक रूप से संकीर्ण लग सकता है।
- source_word: רַב סָרִיס
  choice: प्रधान राज-अधिकारी
  rationale: סָרִיס का अर्थ नपुंसक दरबारी भी हो सकता है और उच्च राज-अधिकारी भी। प्रसंग में पद सूचित करना निश्चित है, जबकि शारीरिक स्थिति निश्चित नहीं; इसलिए मुख्य पाठ में व्यापक अर्थ चुना गया और विकल्प पादटिप्पणी में रखा गया।
- source_word: נְבוּשַׁזְבָּ
  choice: नबूशजबान
  rationale: व्यक्तिनाम को अर्थानुवाद करने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: וְנֵרְגַל שַׂר אֶצֶר
  choice: नेर्गल-शरेसेर
  rationale: इस पूरे क्रम को एक बाबेली व्यक्तिनाम मानकर प्रचलित पुनर्निर्मित उच्चारण के निकट देवनागरी लिप्यंतरण दिया गया है।
- source_word: רַב מָג
  choice: प्रधान मागी
  rationale: यह बाबेली दरबार की उपाधि है। ‘प्रधान मागी’ विदेशी दरबारी परिवेश को बनाए रखते हुए पद का सामान्य आशय देता है; पारंपरिक अनूदित-न-की गई उपाधि पादटिप्पणी में दी गई है।
- source_word: וְכֹל רַבֵּי מֶלֶךְ בָּבֶל
  choice: और बाबेल के राजा के सभी प्रमुख अधिकारियों
  rationale: רַבֵּי यहाँ राजा के उच्च पदस्थ अधिकारियों को सूचित करता है। ‘प्रमुख अधिकारी’ आधुनिक हिंदी में उनकी हैसियत स्पष्ट करता है और ‘राजकुमारों’ जैसा वंशगत अर्थ नहीं जोड़ता।
