  register: भाषा आधुनिक, गरिमापूर्ण और सहज रखी गई है। बाबेली व्यक्तिनामों को देवनागरी में लिप्यंतरित किया गया है। पदनामों को अर्थपूर्ण हिंदी में दिया गया है, पर जहाँ अर्थ अनिश्चित है वहाँ विकल्प पादटिप्पणी में सुरक्षित हैं। मूल इब्रानी की अपूर्ण/दीर्घवृत्त क्रिया को जानबूझकर पूरी तरह स्पष्ट नहीं किया गया, ताकि अगला पद उससे स्वाभाविक रूप से जुड़ा रहे।
