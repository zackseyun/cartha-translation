base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/012.yaml
  text: Take him, keep your eyes on him, and do him no harm; rather, do with him just as he speaks to you.
translation:
  language: hi
  text: उसे ले लो, उस पर नज़र रखना और उसके साथ कोई बुराई न करना; बल्कि वह तुमसे जैसा कहे, उसके साथ वैसा ही व्यवहार करना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָחֶנּוּ
  choice: उसे अपने साथ ले जाओ
  rationale: यह आज्ञार्थक रूप है, जिसका मूल अर्थ ‘उसे लो’ है; प्रसंग में किसी व्यक्ति को अपनी देखरेख में साथ ले जाने का भाव स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: וְעֵינֶיךָ שִׂים עָלָיו
  choice: उस पर नज़र रखना
  rationale: शाब्दिक मुहावरा ‘अपनी आँखें उस पर रखना’ सतर्क देखभाल और निगरानी का संकेत देता है; हिन्दी में ‘नज़र रखना’ उसी अर्थ का सहज मुहावरा है।
- source_word: וְאַל־תַּעַשׂ לוֹ מְאוּמָה רָּע
  choice: उसके साथ कोई बुराई न करना
  rationale: מְאוּמָה רָע का अर्थ ‘कोई बुरी चीज़/कुछ भी बुरा’ है; यह अनिष्ट या दुर्व्यवहार न करने की व्यापक मनाही बनाए रखता है।
- source_word: כִּי אִם
  choice: बल्कि
  rationale: यहाँ यह पहले निषेध के विपरीत सकारात्मक निर्देश प्रस्तुत करता है; ‘बल्कि’ उस विरोधात्मक संबंध को स्पष्ट और संक्षिप्त रूप से रखता है।
- source_word: כַּאֲשֶׁר יְדַבֵּר אֵלֶיךָ כֵּן עֲשֵׂה עִמּוֹ
  choice: वह तुमसे जैसा कहे, उसके साथ वैसा ही करना
  rationale: ‘जैसा…वैसा’ मूल की सहसंबंधी रचना को सुरक्षित रखता है और यिर्मयाह की कही बात के अनुसार उसके साथ व्यवहार करने की आज्ञा व्यक्त करता है।
