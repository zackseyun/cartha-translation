  register: आधुनिक मानक हिन्दी का सहज, कथात्मक और गरिमापूर्ण रूप अपनाया गया है। पद अगले वाक्य में जारी रहने के कारण अंत में अल्पविराम रखा गया है। मुख्य पाठ में राजकीय पदनाम को अर्थानुकूल बनाया गया है, जबकि उसकी कठोर शाब्दिक पृष्ठभूमि पादटिप्पणी में सुरक्षित है।
