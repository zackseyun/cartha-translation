source:
  edition: WLC
  text: וַ/יְצַ֛ו נְבוּכַדְרֶאצַּ֥ר מֶֽלֶךְ בָּבֶ֖ל עַֽל יִרְמְיָ֑הוּ בְּ/יַ֛ד נְבוּזַרְאֲדָ֥ן רַב טַבָּחִ֖ים לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/011.yaml
  text: Nebuchadnezzar king of Babylon gave orders concerning Jeremiah through Nebuzaradan[a], the captain of the guard, saying,
translation:
  language: hi
  text: बाबेल के राजा नबूकदनेस्सर ने यिर्मयाह के विषय में अंगरक्षकों के प्रधान नबूजरदान[a] के द्वारा यह आज्ञा दी,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘जल्लादों का प्रधान’; शाब्दिक अर्थ, ‘वध करनेवालों/कसाइयों का प्रधान।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: आज्ञा दी
  rationale: क्रिया צוה आदेश देने का अर्थ व्यक्त करती है। ‘आज्ञा दी’ स्वाभाविक और गरिमापूर्ण हिन्दी है तथा अगले पद में आने वाली आज्ञा की भूमिका बाँधती है।
- source_word: נְבוּכַדְרֶאצַּר
  choice: नबूकदनेस्सर
  rationale: हिन्दी बाइबल परंपरा में प्रचलित और पहचानने योग्य नामरूप चुना गया है, यद्यपि यहाँ का इब्रानी वर्तनी-रूप ‘नबूकदरेस्सर’ के अधिक निकट है।
- source_word: מֶלֶךְ בָּבֶל
  choice: बाबेल के राजा
  rationale: यह संबंधवाचक पदबंध राजा और उसके राज्य की सीधी पहचान कराता है।
- source_word: עַל יִרְמְיָהוּ
  choice: यिर्मयाह के विषय में
  rationale: צוה के साथ עַל उस व्यक्ति या विषय को सूचित कर सकता है जिसके संबंध में निर्देश दिए गए हों; आज्ञा सीधे यिर्मयाह को नहीं, बल्कि उसके विषय में दी गई है।
- source_word: בְּיַד
  choice: के द्वारा
  rationale: ‘हाथ से’ वाला इब्रानी मुहावरा यहाँ माध्यम या प्रतिनिधि को दर्शाता है; आधुनिक हिन्दी में ‘के द्वारा’ इसे स्पष्ट रूप से व्यक्त करता है।
- source_word: נְבוּזַרְאֲדָן
  choice: नबूजरदान
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: רַב טַבָּחִים
  choice: अंगरक्षकों के प्रधान
  rationale: राजकीय-सैनिक संदर्भ में यह पद राजा के अंगरक्षकों अथवा मृत्युदंड देने वाले अधिकारियों के प्रमुख को सूचित करता है। मुख्य पाठ में स्वाभाविक पदनाम रखा गया है और उसका अधिक शाब्दिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: לֵאמֹר
  choice: यह आज्ञा दी
  rationale: यह उद्धरणसूचक रूप अगले पद में आदेश की विषयवस्तु प्रस्तुत करता है। हिन्दी में ‘यह आज्ञा दी,’ उसी आगे जुड़ने वाले संबंध को स्वाभाविक ढंग से व्यक्त करता है।
