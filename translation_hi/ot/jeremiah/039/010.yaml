source:
  edition: WLC
  text: וּ/מִן הָ/עָ֣ם הַ/דַּלִּ֗ים אֲשֶׁ֤ר אֵין לָ/הֶם֙ מְא֔וּמָה הִשְׁאִ֛יר נְבוּזַרְאֲדָ֥ן רַב טַבָּחִ֖ים בְּ/אֶ֣רֶץ יְהוּדָ֑ה וַ/יִּתֵּ֥ן לָ/הֶ֛ם כְּרָמִ֥ים וִֽ/יגֵבִ֖ים בַּ/יּ֥וֹם הַ/הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/010.yaml
  text: But Nebuzaradan the captain of the guard left some of the poorest of the people[a], who had nothing, in the land of Judah, and on that day he gave them vineyards and fields.
translation:
  language: hi
  text: परन्तु अंगरक्षक-दल के प्रधान नबूजरदान ने प्रजा के सबसे निर्धन लोगों में से कुछ को, जिनके पास कुछ भी नहीं था, यहूदा देश में रहने दिया और उसी दिन उन्हें दाख की बारियाँ और खेत[a] दे दिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अंतिम इब्रानी शब्द का अर्थ अनिश्चित है; इसका अर्थ संभवतः “हौद” या “दाखरस के कुंड” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן הָעָם הַדַּלִּים
  choice: परन्तु ... प्रजा के सबसे निर्धन लोगों में से कुछ को
  rationale: וּמִן का खंडात्मक भाव ‘में से कुछ’ द्वारा और पूर्ववर्ती प्रसंग से इसका विरोध ‘परन्तु’ द्वारा व्यक्त किया गया है। הַדַּלִּים सामाजिक-आर्थिक निर्धनता को सूचित करता है।
- source_word: אֲשֶׁר אֵין לָהֶם מְאוּמָה
  choice: जिनके पास कुछ भी नहीं था
  rationale: यह स्वाभाविक आधुनिक हिन्दी में पूर्ण अभाव पर मूल पाठ के बल को बनाए रखता है।
- source_word: הִשְׁאִיר
  choice: रहने दिया
  rationale: हिफ़ील रूप का आशय यहाँ लोगों को यहूदा में छोड़ देना या वहीं बने रहने देना है; ‘रहने दिया’ प्रशासनिक कार्य और प्रसंग को स्पष्ट रूप से व्यक्त करता है।
- source_word: נְבוּזַרְאֲדָן
  choice: नबूजरदान
  rationale: नाम का प्रचलित हिन्दी लिप्यंतरण अपनाया गया है।
- source_word: רַב טַבָּחִים
  choice: अंगरक्षक-दल का प्रधान
  rationale: यह बाबुली अधिकारी की पदवी है। मूल संज्ञा का संबंध वध करने वालों, जल्लादों या राजकीय अंगरक्षकों से हो सकता है; प्रसंग में पदवी के कार्यात्मक अर्थ को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: यहूदा देश में
  rationale: ‘देश’ मूल के क्षेत्रीय अर्थ को बनाए रखता है।
- source_word: וַיִּתֵּן לָהֶם
  choice: उन्हें ... दे दिए
  rationale: सरल कथात्मक क्रिया को स्वाभाविक हिन्दी वाक्यक्रम में रखा गया है।
- source_word: כְּרָמִים
  choice: दाख की बारियाँ
  rationale: यह शब्द अंगूर की खेती वाली बारियों को स्पष्ट रूप से सूचित करता है; ‘दाख’ बाइबलीय हिन्दी में परिचित और सुबोध है।
- source_word: וִיגֵבִים
  choice: खेत
  rationale: शब्द का अर्थ अनिश्चित है। दाख की बारियों के साथ गरीब लोगों को दी गई कृषि-संपत्ति के प्रसंग में ‘खेत’ उपयुक्त मुख्य-पाठ विकल्प है; अन्य संभावनाएँ पादटिप्पणी में सुरक्षित रखी गई हैं।
- source_word: בַּיּוֹם הַהוּא
  choice: उसी दिन
  rationale: यह मूल कालवाचक पद का स्वाभाविक हिन्दी रूप है और उस विशेष दिन पर बल बनाए रखता है।
