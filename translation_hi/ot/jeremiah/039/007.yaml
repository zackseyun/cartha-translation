- source_word: בַּנְחֻשְׁתַּיִם
  choice: काँसे की बेड़ियों
  rationale: यह पद काँसे के बंधनों को दर्शाता है। ‘बेड़ियाँ’ आधुनिक हिन्दी में स्पष्ट है, जबकि वस्तु की ठीक बनावट—जंजीरें या अन्य बंधन—निश्चित नहीं है।
- source_word: לָבִיא אֹתוֹ
  choice: ताकि उसे ... ले जाए
  rationale: यह उद्देश्यसूचक infinitive है; ‘ताकि’ हिन्दी में उद्देश्य को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בָּבֶלָה
  choice: बाबेल ले जाए
  rationale: दिशासूचक ה बाबेल की ओर गति बताता है; हिन्दी में ‘बाबेल ले जाए’ इसका स्वाभाविक रूप है।
