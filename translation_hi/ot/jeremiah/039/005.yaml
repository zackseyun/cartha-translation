source:
  edition: WLC
  text: וַ/יִּרְדְּפ֨וּ חֵיל כַּשְׂדִּ֜ים אַחֲרֵי/הֶ֗ם וַ/יַּשִּׂ֣גוּ אֶת צִדְקִיָּהוּ֮ בְּ/עַֽרְב֣וֹת יְרֵחוֹ֒ וַ/יִּקְח֣וּ אֹת֗/וֹ וַֽ֠/יַּעֲלֻ/הוּ אֶל נְבוּכַדְרֶאצַּ֧ר מֶֽלֶךְ בָּבֶ֛ל רִבְלָ֖תָ/ה בְּ/אֶ֣רֶץ חֲמָ֑ת וַ/יְדַבֵּ֥ר אִתּ֖/וֹ מִשְׁפָּטִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/005.yaml
  text: But the army of the Chaldeans pursued them and overtook Zedekiah in the plains of Jericho. They seized him and brought him up to Nebuchadnezzar king of Babylon at Riblah[a], in the land of Hamath, and he passed sentence on him.
translation:
  language: hi
  text: परन्तु कसदियों की सेना ने उनका पीछा किया और यरीहो के मैदानों में सिदकिय्याह को जा पकड़ा। उन्होंने उसे पकड़ लिया और हमात देश में रिबला को बाबेल के राजा नबूकदरेस्सर[a] के पास ऊपर ले गए; और उसने उसके विरुद्ध न्यायिक निर्णय सुनाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस नाम का एक अधिक प्रचलित रूप “नबूकदनेस्सर” है; यहाँ इब्रानी पाठ के निकट “नबूकदरेस्सर” रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵיל כַּשְׂדִּים
  choice: कसदियों की सेना
  rationale: חֵיל सैन्य बल या सेना को और כַּשְׂדִּים कसदियों को दर्शाता है। संदर्भगत ‘बाबेलियों’ के बजाय मूल जातीय-राजनीतिक पद सुरक्षित रखा गया है।
- source_word: וַיִּרְדְּפוּ ... אַחֲרֵיהֶם
  choice: उनका पीछा किया
  rationale: רדף के साथ אַחֲרֵי का स्वाभाविक और अर्थ-सटीक हिन्दी रूप।
- source_word: וַיַּשִּׂגוּ
  choice: जा पकड़ा
  rationale: यहाँ נשׂג भागते व्यक्ति को पीछा करके पकड़ लेने का बोध देता है; ‘जा पकड़ा’ सैन्य पीछा और उसके सफल परिणाम दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: בְּעַרְבוֹת יְרֵחוֹ
  choice: यरीहो के मैदानों में
  rationale: עֲרָבוֹת यहाँ यरदन घाटी के समतल मैदानी भूभाग को सूचित करता है; तकनीकी ‘स्तेपी प्रदेश’ की अपेक्षा यह साधारण पाठक के लिए स्पष्ट है।
- source_word: וַיִּקְחוּ אֹתוֹ
  choice: उन्होंने उसे पकड़ लिया
  rationale: לקח का मूल अर्थ ‘लेना’ है, पर सैन्य गिरफ्तारी के प्रसंग में ‘पकड़ लिया’ निहित बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיַּעֲלֻהוּ אֶל
  choice: उसके पास ऊपर ले गए
  rationale: हिफ़ील रूप में עלה का ‘ऊपर ले जाना’ वाला दिशात्मक संकेत रखा गया है, यद्यपि हिन्दी में केवल ‘ले गए’ भी संभव है।
- source_word: נְבוּכַדְרֶאצַּר
  choice: नबूकदरेस्सर
  rationale: WLC में उपस्थित व्यंजनात्मक रूप Nebuchadrezzar का निकट हिन्दी लिप्यंतरण चुना गया है; अधिक परिचित वैकल्पिक नाम-रूप पादटिप्पणी में दिया गया है।
- source_word: רִבְלָתָה
  choice: रिबला में
  rationale: स्थानवाचक ה को हिन्दी के स्वाभाविक अधिकरण ‘में’ से व्यक्त किया गया है।
- source_word: בְּאֶרֶץ חֲמָת
  choice: हमात देश के
  rationale: אֶרֶץ का ‘देश’ सीधा रूप है; हिन्दी वाक्य-विन्यास में ‘हमात देश के रिबला में’ स्वाभाविक है।
- source_word: וַיְדַבֵּר אִתּוֹ מִשְׁפָּטִים
  choice: उस पर दण्ड की आज्ञाएँ सुनाईं
  rationale: मुहावरे का न्यायिक आशय व्यक्त करते हुए מִשְׁפָּטִים के बहुवचन को सुरक्षित रखा गया है। केवल ‘दण्डादेश सुनाया’ अधिक स्वाभाविक है, पर वह बहुवचन को समतल कर देता।
theological_decisions:
- issue: וַיְדַבֵּר אִתּוֹ מִשְׁפָּטִים में बहुवचन और न्यायिक मुहावरा
  choice: उस पर दण्ड की आज्ञाएँ सुनाईं
  alternative: उसे दण्डादेश सुनाया
  rationale: सन्दर्भ न्यायिक दण्ड-निर्णय का है, फिर भी मूल के बहुवचन מִשְׁפָּטִים को यथासंभव बनाए रखा गया है; इससे आगे के पदों में वर्णित अनेक दण्डात्मक निर्णयों की सम्भावना को अनावश्यक रूप से एकवचन नहीं बनाया जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण कथात्मक शैली रखी गई है। ‘परन्तु’, ‘कसदी’, ‘हमात’ जैसे पारंपरिक बाइबलीय पद नामों की पहचान बनाए रखते हैं, जबकि वाक्य-विन्यास साधारण आधुनिक पाठक के लिए सहज रखा गया है।
