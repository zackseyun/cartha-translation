base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/008.yaml
  text: The Chaldeans burned the king’s house and the houses of the people with fire[b][a], and they tore down the walls of Jerusalem.
translation:
  language: hi
  text: कसदियों[b] ने राजा का भवन[a] और लोगों के घर आग से जला दिए, और यरूशलेम की दीवारों को ढा दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “राजमहल।”
    reason: lexical_alternative
  - marker: b
    text: “कसदी” यहाँ बेबीलोन की सेना को दर्शाता है।
    reason: cultural_note
lexical_decisions:
- source_word: בֵּית הַמֶּלֶךְ
  choice: राजा का भवन
  rationale: शाब्दिक अर्थ ‘राजा का घर’ है, पर राजकीय संदर्भ में यह महल को दर्शा सकता है। ‘राजा का भवन’ मूल अभिव्यक्ति को पारदर्शी रखते हुए आधुनिक हिन्दी में गरिमापूर्ण और स्वाभाविक है; ‘महल’ वैकल्पिक अर्थ के रूप में पादटिप्पणी में दिया गया है।
- source_word: בֵּית הָעָם
  choice: लोगों के घरों
  rationale: एकवचन रचना सामूहिक अथवा वितरणात्मक अर्थ रखती है। नगर के विनाश के संदर्भ में हिन्दी बहुवचन ‘लोगों के घरों’ अभिप्रेत निवास-स्थानों को स्पष्ट करता है और मूल में निहित न होने वाला सामाजिक-वर्ग भेद नहीं जोड़ता।
- source_word: שָׂרְפוּ
  choice: जला दिया
  rationale: क्रिया का सीधा अर्थ ‘जलाना’ है। ‘जला दिया’ कथात्मक हिन्दी में स्वाभाविक है और पूर्ण विनाश को अनावश्यक रूप से बढ़ा-चढ़ाकर नहीं कहता।
- source_word: הַכַּשְׂדִּים
  choice: कसदियों
  rationale: यह मूल जातीय नाम ‘कसदी’ का सीधा रूप है। संदर्भ में इससे बेबीलोन की सेना अभिप्रेत है, जिसे सांस्कृतिक स्पष्टता के लिए पादटिप्पणी में बताया गया है।
- source_word: בָּאֵשׁ
  choice: आग से
  rationale: यहाँ ב साधन सूचित करता है; ‘आग से’ हिन्दी में स्वाभाविक और स्रोत के निकट है।
- source_word: חֹמוֹת יְרוּשָׁלִַם
  choice: यरूशलेम की शहरपनाह
  rationale: חֹמוֹת नगर की रक्षात्मक दीवारों को दर्शाता है। ‘शहरपनाह’ हिन्दी बाइबलीय कथन में संक्षिप्त और सटीक है तथा साधारण भवनों की दीवारों से भेद स्पष्ट करता है।
- source_word: נָתָצוּ
  choice: ढा दी
  rationale: क्रिया का अर्थ किसी संरचना को तोड़कर गिराना है। ‘ढा दी’ संक्षिप्त, सजीव और स्वाभाविक हिन्दी है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘कसदी’ मूल जातीय पद को बनाए रखता है, जबकि पादटिप्पणी उसका ऐतिहासिक संदर्भ स्पष्ट करती है। सभी पादटिप्पणी-चिह्न संबंधित पदों के तुरंत बाद रखे गए हैं।
