base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/004.yaml
  text: And when Zedekiah king of Judah and all the men of war saw them[a], they fled and went out by night from the city by way of the king’s garden, through the gate between the two walls[b]; and he went out by way of the Arabah.
translation:
  language: hi
  text: जब यहूदा के राजा सिदकिय्याह और सभी योद्धाओं ने उन्हें देखा, तो वे भाग निकले। वे रात को नगर से बाहर निकले और राजा के उद्यान के मार्ग से, दोनों दीवारों के बीच के फाटक से होकर गए; फिर वह निकल गया[a] अराबा[b] के मार्ग से।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू की अंतिम क्रिया एकवचन है—‘वह निकल गया’; कुछ अनुवाद पहले की बहुवचन क्रियाओं के अनुरूप इसे ‘वे निकल गए’ कर देते हैं।
    reason: मूल पाठ की व्याकरणिक संख्या और अनुवाद में उसे समतल करने की संभावना स्पष्ट करना
  - marker: b
    text: ‘अराबा’ का अनुवाद ‘मैदान’ या ‘यरदन की घाटी’ भी किया जा सकता है।
    reason: भौगोलिक पद के वैकल्पिक अर्थ बताना
lexical_decisions:
- source_word: רָאָם
  choice: उन्हें देखा
  rationale: क्रिया के साथ तृतीय पुरुष बहुवचन कर्म-प्रत्यय है; संदर्भ में इसका संकेत पहले उल्लिखित बाबुली सेनाओं की ओर है।
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: योद्धाओं
  rationale: यह युद्ध में लगे पुरुषों को सूचित करता है। ‘योद्धा’ आधुनिक हिन्दी में स्वाभाविक और संक्षिप्त है तथा सैन्य अर्थ बनाए रखता है।
- source_word: וַיִּבְרְחוּ
  choice: वे भाग निकले
  rationale: यह ברח के पलायन के भाव को स्पष्ट करता है और हिन्दी कथन में स्वाभाविक है।
- source_word: וַיֵּצְאוּ לַיְלָה
  choice: वे रात को नगर से बाहर निकले
  rationale: ‘रात को’ हिब्रू काल-सूचक पद का सहज हिन्दी रूप है; ‘बाहर निकले’ नगर छोड़ने की गति को बनाए रखता है।
- source_word: דֶּרֶךְ גַּן הַמֶּלֶךְ
  choice: राजा की बारी के रास्ते से
  rationale: דֶּרֶךְ मार्ग को सूचित करता है। ‘बारी’ घिरी हुई राजकीय वाटिका के लिए परिचित बाइबिलीय हिन्दी शब्द है, जबकि वाक्य यह अनावश्यक रूप से निश्चित नहीं करता कि वे उसके भीतर से गए या उसके पास वाले मार्ग से।
- source_word: בְּשַׁעַר בֵּין הַחֹמֹתָיִם
  choice: दोनों दीवारों के बीच के फाटक से
  rationale: חֹמֹתָיִם द्विवचन है, इसलिए ‘दोनों दीवारों’ से उसकी संख्या सुरक्षित रहती है; ‘फाटक से’ मार्ग का स्वाभाविक हिन्दी वर्णन है।
- source_word: וַיֵּצֵא
  choice: वह ... निकल गया
  rationale: मसोरेटी पाठ में क्रिया एकवचन है। पहले आए बहुवचन को देखकर इसे बहुवचन बनाने के बजाय मूल का अचानक एकवचन सुरक्षित रखा गया है।
- source_word: הָעֲרָבָה
  choice: अराबा
  rationale: यहाँ यह भौगोलिक नाम या विशिष्ट क्षेत्र-संज्ञा है। लिप्यंतरण इसे केवल सामान्य ‘मैदान’ मान लेने से बचाता है।
