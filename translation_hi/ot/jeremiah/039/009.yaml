  text: וְ/אֵת֩ יֶ֨תֶר הָ/עָ֜ם הַ/נִּשְׁאָרִ֣ים בָּ/עִ֗יר וְ/אֶת הַ/נֹּֽפְלִים֙ אֲשֶׁ֣ר נָפְל֣וּ עָלָ֔י/ו וְ/אֵ֛ת יֶ֥תֶר הָ/עָ֖ם הַ/נִּשְׁאָרִ֑ים הֶגְלָ֛ה נְבֽוּזַר אֲדָ֥ן רַב טַבָּחִ֖ים בָּבֶֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/009.yaml
  text: As for the rest of the people who remained in the city[a], and the deserters who had gone over to him, together with the rest of the people who remained, Nebuzaradan, the captain of the guard[c][b], carried away to Babylon.
translation:
  language: hi
  text: नगर में शेष बचे लोगों को, और उन लोगों को जो दलबदल करके उसके पास जा मिले थे[a], और शेष बचे लोगों को[b], अंगरक्षक-दल का प्रधान[c] नबूजरदान निर्वासन में बाबेल ले गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी मुहावरे का शाब्दिक अर्थ है, “जो उसके पास गिर पड़े थे”; युद्ध के प्रसंग में इसका अर्थ विरोधी पक्ष को छोड़कर उसके पास चले जाना या उससे जा मिलना है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी पाठ में “शेष बचे लोगों” का पदबंध दोहराया गया है; इस पुनरावृत्ति को हटाया नहीं गया है।
    reason: lexical_alternative
  - marker: c
    text: इस पदवी का शाब्दिक संबंध “वध करने वालों के प्रधान” से है; बाबेली राजकीय-सैनिक संदर्भ में यह आम तौर पर अंगरक्षक-दल के प्रधान के अर्थ में प्रयुक्त होती है।
    reason: cultural_note
lexical_decisions:
- source_word: יֶתֶר הָעָם הַנִּשְׁאָרִים
  choice: बचे हुए बाकी लोग
  rationale: यह पदबंध शेष रह गए लोगों को सूचित करता है। ‘बचे हुए बाकी लोग’ मूल की ‘शेष’ और ‘रह गए’ दोनों धारणाओं को बनाए रखता है और अंतिम पुनरावृत्ति को भी ज्यों का त्यों रखना संभव बनाता है।
- source_word: בָּעִיר
  choice: नगर में
  rationale: सरल स्थानवाचक पदबंध; आधुनिक मानक हिन्दी में स्वाभाविक और सटीक।
- source_word: הַנֹּפְלִים אֲשֶׁר נָפְלוּ עָלָיו
  choice: जो उसका पक्ष लेकर उसके पास जा मिले थे
  rationale: נפל על सैन्य-राजनीतिक प्रसंग में विरोधी पक्ष के पास चले जाने या उससे जा मिलने का मुहावरा है। यह चयन वास्तविक पक्ष-परिवर्तन स्पष्ट करता है, जबकि ‘उसका’ के संदर्भ को मूल की तरह अनिर्दिष्ट रहने देता है।
- source_word: הֶגְלָה
  choice: निर्वासित करके ... ले गया
  rationale: גלה का हिफ़ील रूप बलपूर्वक देश से निकालकर दूसरी जगह ले जाने को दर्शाता है। यह अभिव्यक्ति निर्वासन और गंतव्य—दोनों को स्पष्ट करती है।
- source_word: נְבוּזַר אֲדָן
  choice: नबूजरदान
  rationale: व्यक्तिनाम का हिन्दी ध्वन्यात्मक लिप्यंतरण।
- source_word: רַב טַבָּחִים
  choice: अंगरक्षक-दल का प्रधान
  rationale: शब्दशः संबंध वध करने वालों से है, पर बाबेली राजकीय-सैनिक संदर्भ में यह अंगरक्षक-दल के प्रधान का आधिकारिक पद है। चयन भ्रामक शाब्दिकता से बचते हुए पद का कार्य बताता है।
- source_word: בָּבֶל
  choice: बाबेल
  rationale: इब्रानी स्थाननाम בָּבֶל का प्रचलित हिन्दी बाइबलीय रूप।
theological_decisions:
- issue: ‘उसका’ का संदर्भ
  choice: सर्वनाम को अनिर्दिष्ट रखा गया
  alternative: बाबेल के राजा या सेनापति का नाम स्पष्ट रूप से जोड़ना
  rationale: मूल पाठ में केवल עליו, ‘उसके पास/उसकी ओर,’ है। निकटवर्ती कथा से संदर्भ समझा जा सकता है, पर पद स्वयं व्यक्ति का नाम नहीं देता; इसलिए अस्पष्टता को नहीं मिटाया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वाक्य में मूल के तीन समन्वित कर्मों और जानबूझकर की गई पुनरावृत्ति को सुरक्षित रखा गया है।
