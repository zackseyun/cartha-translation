source:
  edition: WLC
  text: וְ/אֶֽל יִרְמְיָ֖הוּ הָיָ֣ה דְבַר יְהוָ֑ה בִּֽ/הְיֹת֣/וֹ עָצ֔וּר בַּ/חֲצַ֥ר הַ/מַּטָּרָ֖ה לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/015.yaml
  text: The word of Yahweh had come to Jeremiah while he was confined in the court of the guard[a], saying,
translation:
  language: hi
  text: 'याहवे का वचन यिर्मयाह के पास उस समय आया था, जब वह पहरे के आँगन[a] में हिरासत में रखा गया था:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, पहरेदारों के आँगन में।
    reason: मַטָּרָה को पहरे की व्यवस्था अथवा पहरेदारों से सम्बद्ध हिरासत-स्थल, दोनों रूपों में समझा जा सकता है।
lexical_decisions:
- source_word: וְ/אֶל
  choice: यिर्मयाह के पास
  rationale: אֶל की दिशात्मकता को स्वाभाविक हिन्दी में ‘के पास’ से व्यक्त किया गया है। आरम्भिक וְ को अलग से ‘और’ नहीं बनाया गया, क्योंकि यहाँ वह कथानक को जोड़ता है और हिन्दी वाक्य में उसका बल प्रसंग से स्पष्ट है।
- source_word: יִרְמְיָהוּ
  choice: यिर्मयाह
  rationale: नबी के इब्रानी नाम का हिन्दी में प्रचलित लिप्यंतरण।
- source_word: הָיָה
  choice: आया था
  rationale: דְבַר יְהוָה के साथ यह प्रकाशना प्राप्त होने का प्रचलित नबूवत-सूत्र है। ‘आया था’ घटना को वर्तमान कथानक की अपेक्षा पूर्वकालीन परिस्थिति के रूप में रखता है।
- source_word: דְבַר יְהוָה
  choice: याहवे का वचन
  rationale: ‘वचन’ नबूवत-सूत्र और उसके धार्मिक भार को बनाए रखता है; ‘सन्देश’ की अपेक्षा यह मूल के अधिक निकट है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले परमेश्वर के व्यक्तिगत नाम का हिन्दी लिप्यंतरण किया गया है, उपाधि से प्रतिस्थापित नहीं।
- source_word: בִּֽ/הְיֹת֣/וֹ
  choice: उस समय ... जब वह ... था
  rationale: सर्वनाम-प्रत्यययुक्त infinitive construct से व्यक्त जारी समयगत परिस्थिति को स्वाभाविक हिन्दी संरचना में रखा गया है।
- source_word: עָצוּר
  choice: बन्द
  rationale: शब्द का आशय निगरानी में रोके या सीमित रखे जाने से है। ‘बन्द’ हिरासत को व्यक्त करता है, पर औपचारिक कारावास का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: בַּ/חֲצַר הַ/מַּטָּרָה
  choice: पहरे के आँगन
  rationale: חָצֵר खुले आँगन को और מַטָּרָה यहाँ पहरे अथवा हिरासत के स्थान को सूचित करता है। यह पद यिर्मयाह को रखे जाने के ज्ञात परिसर के अनुकूल है।
- source_word: לֵ/אמֹר
  choice: ':'
  rationale: मूल का यह रूप आगे आने वाले सीधे कथन का परिचय देता है। हिन्दी में द्विबिन्दु उसी संक्रमण को स्वाभाविक रूप से व्यक्त करता है, बिना बोझिल ‘यह कहते हुए’ जोड़े।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है। ‘याहवे’ उसका निकट लिप्यंतरण है और उसे किसी उपाधि में नहीं बदलता।
- issue: नबूवत-सूत्र דְבַר יְהוָה
  choice: याहवे का वचन ... आया था
  alternative: याहवे का सन्देश ... मिला; प्रभु का वचन ... आया
  rationale: ‘वचन’ मूल सूत्र को पहचानने योग्य रखता है, और ‘आया था’ आसपास के वृत्तान्त में इस प्रकाशना के पूर्वकालीन होने को दर्शाता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। वाक्य को अगले पद के सीधे कथन की ओर ले जाने के लिए अन्त में द्विबिन्दु रखा गया है।
