base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/001.yaml
  text: In the ninth year of Zedekiah king of Judah[a], in the tenth month, Nebuchadnezzar king of Babylon came to Jerusalem with all his army, and they laid siege to it.
translation:
  language: hi
  text: यहूदा के राजा सिदकिय्याह के शासन के नौवें वर्ष के दसवें महीने में, बाबेल का राजा नबूकदरेस्सर[a] अपनी पूरी सेना के साथ यरूशलेम आया, और उन्होंने उसकी घेराबंदी की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में नाम का रूप ‘नबूकदरेस्सर’ है; हिन्दी बाइबलों में पारंपरिक रूप ‘नबूकदनेस्सर’ भी मिलता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּשָּׁנָה הַתְּשִׁעִית לְצִדְקִיָּהוּ מֶלֶךְ יְהוּדָה
  choice: यहूदा के राजा सिदकिय्याह के शासन के नौवें वर्ष
  rationale: इब्रानी काल-सूचक वाक्यांश राजकीय शासन-वर्ष बताता है। हिन्दी में ‘के शासन के नौवें वर्ष’ उसका अर्थ स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: בַּחֹדֶשׁ הָעֲשִׂרִי
  choice: दसवें महीने में
  rationale: क्रमवाचक संख्या और काल-सूचक संबंध को सीधे तथा स्वाभाविक हिन्दी में रखा गया है।
- source_word: בָּא
  choice: आया
  rationale: בוא का मूल अर्थ ‘आना’ है। सैन्य प्रसंग होने पर भी ‘चढ़ आया’ या ‘कूच करके आया’ कहकर क्रिया में अतिरिक्त भाव नहीं जोड़ा गया।
- source_word: נְבוּכַדְרֶאצַּר
  choice: नबूकदरेस्सर
  rationale: लिप्यंतरण इस पद में पाए जाने वाले इब्रानी रूप को दर्शाता है, जिसमें ר के अनुरूप ‘र’ आता है। अधिक परिचित वैकल्पिक रूप को पादटिप्पणी में दिया गया है।
- source_word: מֶלֶךְ בָּבֶל
  choice: बाबेल का राजा
  rationale: समासिक राजकीय उपाधि का सीधा और प्रचलित हिन्दी रूप।
- source_word: וְכָל חֵילוֹ
  choice: अपनी पूरी सेना के साथ
  rationale: सैन्य संदर्भ में חַיִל का अर्थ सेना है। संयोजक पद का आशय साथ आने का है, जिसे हिन्दी में इस प्रकार स्वाभाविक बनाया गया है।
- source_word: אֶל יְרוּשָׁלִַם
  choice: यरूशलेम आया
  rationale: אֶל की दिशात्मकता ‘यरूशलेम आया’ में सुरक्षित है; शत्रुतापूर्ण उद्देश्य अगली क्रिया से स्पष्ट होता है।
- source_word: וַיָּצֻרוּ עָלֶיהָ
  choice: और उन्होंने नगर को घेर लिया
  rationale: צור यहाँ घेराबंदी करने का अर्थ देता है। बहुवचन क्रिया को ‘उन्होंने’ से सुरक्षित रखा गया है; स्त्रीलिंग प्रत्यय का संदर्भ यरूशलेम से है, जिसे हिन्दी में अस्पष्टता से बचाने के लिए ‘नगर’ कहा गया है।
