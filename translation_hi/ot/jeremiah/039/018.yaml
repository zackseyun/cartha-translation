language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֤י מַלֵּט֙ אֲמַלֶּטְ/ךָ֔ וּ/בַ/חֶ֖רֶב לֹ֣א תִפֹּ֑ל וְ/הָיְתָ֨ה לְ/ךָ֤ נַפְשְׁ/ךָ֙ לְ/שָׁלָ֔ל כִּֽי בָטַ֥חְתָּ בִּ֖/י נְאֻם יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/018.yaml
  text: For I will surely rescue you[a], and you will not fall by the sword. Your life will be yours as plunder, because you have trusted in me[b], declares Yahweh.
translation:
  language: hi
  text: क्योंकि मैं निश्चय ही तुझे छुड़ाऊँगा[a], और तू तलवार से नहीं गिरेगा। तेरा जीवन तेरे लिए लूट का माल होगा[b], क्योंकि तूने मुझ पर भरोसा रखा है—यह याहवे की घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में एक ही क्रिया के क्रियार्थक संज्ञा-रूप और सीमित रूप को साथ रखकर विशेष बल दिया गया है; अर्थात, “मैं तुझे अवश्य छुड़ाऊँगा।”
    reason: lexical_alternative
  - marker: b
    text: “तेरा जीवन तेरे लिए लूट का माल होगा” युद्धकालीन मुहावरा है, जिसका अर्थ है कि तू कम-से-कम अपना जीवन बचाकर निकल जाएगा।
    reason: cultural_note
lexical_decisions:
- source_word: מַלֵּט אֲמַלֶּטְךָ
  choice: मैं निश्चय ही तुझे छुड़ाऊँगा
  rationale: एक ही धातु के क्रियार्थक संज्ञा-रूप और सीमित क्रिया के साथ आने से प्रतिज्ञा पर विशेष बल पड़ता है। “निश्चय ही” उस बल को स्वाभाविक हिन्दी में व्यक्त करता है, और “छुड़ाऊँगा” यहाँ शारीरिक संकट से बचाने के भाव के अनुकूल है।
- source_word: וּבַחֶרֶב לֹא תִפֹּל
  choice: और तू तलवार से नहीं गिरेगा
  rationale: נפל का मूल अर्थ “गिरना” है और युद्ध के प्रसंग में इसका आशय तलवार से मारे जाने से हो सकता है। “तलवार से नहीं गिरेगा” मूल बिंब और उसका युद्ध-संबंधी अर्थ दोनों बनाए रखता है।
- source_word: וְהָיְתָה לְךָ נַפְשְׁךָ לְשָׁלָל
  choice: तेरा जीवन तेरे लिए लूट का माल होगा
  rationale: 'यह यिर्मयाह में प्रयुक्त युद्धकालीन रूपक है: व्यक्ति बाकी सब खोकर भी अपना जीवन बचा लेता है, मानो वही उसे लूट के माल के रूप में मिला हो। अनुवाद रूपक को मिटाए बिना हिन्दी में समझने योग्य रखता है।'
- source_word: נַפְשְׁךָ
  choice: तेरा जीवन
  rationale: इस प्रसंग में נֶפֶשׁ मनुष्य के जीवित बचने को दर्शाता है, न कि विशेष रूप से अमूर्त “आत्मा” को।
- source_word: לְשָׁלָל
  choice: लूट का माल
  rationale: यह युद्ध में हाथ लगे माल का बिंब स्पष्ट करता है और आधुनिक हिन्दी में “लूट” या “लूट की वस्तु” से अधिक स्वाभाविक है।
- source_word: כִּי בָטַחְתָּ בִּי
  choice: क्योंकि तूने मुझ पर भरोसा रखा है
  rationale: בטח निर्भरता और भरोसे का भाव रखता है। “मुझ पर भरोसा रखा है” सम्बन्धपरक अर्थ तथा उस पूर्व विश्वास को व्यक्त करता है जो इस प्रतिज्ञा का आधार बताया गया है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: נְאֻם भविष्यवाणी की औपचारिक उद्घोषणा का सूत्र है; “घोषणा” उसका भार बनाए रखती है। יְהוָה को उसके व्यक्तिगत वाचा-नाम के रूप में “याहवे” लिखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुरक्षरी व्यक्तिगत नाम सीधे आया है। “याहवे” उसे किसी उपाधि से बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: נֶפֶשׁ का आशय
  choice: जीवन
  alternative: प्राण; आत्मा
  rationale: तलवार और युद्ध से बचाए जाने के इस संदर्भ में शब्द का आशय व्यक्ति का जीवित बचना है। “आत्मा” कहना ऐसा पारिभाषिक मानवशास्त्रीय अर्थ जोड़ सकता है जिसकी यहाँ आवश्यकता नहीं है।
- issue: “जीवन लूट का माल होगा” रूपक
  choice: रूपक को मुख्य पाठ में बनाए रखा गया
  alternative: तू अपना जीवन बचाकर निकल जाएगा
  rationale: व्याख्यात्मक विकल्प अर्थ स्पष्ट करता है, पर युद्ध-संबंधी मूल रूपक हटा देता है। मुख्य पाठ बिंब को सुरक्षित रखता है और पादटिप्पणी उसका आशय बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज और प्रत्यक्ष शैली-स्तर रखा गया है। संबोधन में एकवचन “तू/तुझे/तेरा” मूल इब्रानी के एकवचन और ईश्वरीय प्रत्यक्ष वचन की निकटता को दर्शाता है। “तलवार से नहीं गिरेगा” और “लूट का माल” जैसे मूल बिंब सुरक्षित रखे गए हैं, जबकि पादटिप्पणियाँ उनके निहितार्थ स्पष्ट करती हैं।
