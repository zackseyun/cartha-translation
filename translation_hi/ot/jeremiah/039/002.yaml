lexical_decisions:
- source_word: בְּ/עַשְׁתֵּי עֶשְׂרֵה שָׁנָה לְ/צִדְקִיָּהוּ
  choice: सिदकिय्याह के शासन के ग्यारहवें वर्ष में
  rationale: इब्रानी पदबंध राजकीय वर्ष का समय बताता है। केवल ‘सिदकिय्याह के ग्यारहवें वर्ष’ की अपेक्षा ‘शासन’ जोड़ने से आधुनिक हिन्दी में आशय स्वाभाविक और स्पष्ट होता है।
- source_word: בַּ/חֹדֶשׁ הָ/רְבִיעִי
  choice: चौथे महीने के
  rationale: मूल पाठ महीने को क्रमसूचक संख्या से बताता है; इसलिए किसी आधुनिक महीने का नाम देने के बजाय यही पद्धति रखी गई है।
- source_word: בְּ/תִשְׁעָה לַ/חֹדֶשׁ
  choice: नौवें दिन
  rationale: इस इब्रानी कालवाचक मुहावरे में ‘दिन’ निहित है। स्पष्ट और स्वाभाविक हिन्दी के लिए उसे मुख्य पाठ में व्यक्त किया गया है।
- source_word: הָבְקְעָה
  choice: सेंध लगा दी गई
  rationale: בקע का निफ़अल रूप सैनिक घेराबंदी में सुरक्षा-व्यवस्था को तोड़कर प्रवेश का मार्ग बना दिए जाने को दर्शाता है। ‘सेंध लगा दी गई’ इस भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הָ/עִיר
  choice: नगर
  rationale: मूल में निश्चित रूप से ‘नगर’ है और प्रसंग में इसका संकेत यरूशलेम की ओर है; अनुवाद में मूल संज्ञा को बनाए रखा गया है।
theological_decisions:
- issue: הָבְקְעָה הָעִיר में नगर और उसकी प्रतिरक्षा का संबंध
  choice: नगर में सेंध लगा दी गई
  alternative: नगर की शहरपनाह तोड़ दी गई
  rationale: मूल पाठ शाब्दिक रूप से ‘नगर’ को विषय बनाता है और ‘शहरपनाह’ शब्द नहीं कहता। चुना हुआ अनुवाद सैन्य आशय स्पष्ट करता है, पर दीवार को मूल पाठ में स्पष्ट रूप से उपस्थित मानकर नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज रखी गई है। तिथि-विन्यास इब्रानी क्रम के निकट है। ‘शासन’ स्पष्टता के लिए जोड़ा गया है, और ‘नगर में सेंध’ घेराबंदी के सैन्य प्रसंग को सामान्य पाठक के लिए स्वाभाविक रूप से व्यक्त करता है।
