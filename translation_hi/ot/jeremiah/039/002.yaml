  yaml_path: translation/ot/jeremiah/039/002.yaml
  text: In the eleventh year of Zedekiah[a], in the fourth month, on the ninth day of the month, the city was breached.
translation:
  language: hi
  text: सिदकिय्याह के शासन के ग्यारहवें वर्ष में, चौथे महीने के नौवें दिन[a], नगर में सेंध लग गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक शाब्दिक रूप से, “महीने की नौवीं को।”
