id: JER.22.21
reference: Jeremiah 22:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: דִּבַּ֤רְתִּי אֵלַ֨יִ/ךְ֙ בְּ/שַׁלְוֺתַ֔יִ/ךְ אָמַ֖רְתְּ לֹ֣א אֶשְׁמָ֑ע זֶ֤ה דַרְכֵּ/ךְ֙ מִ/נְּעוּרַ֔יִ/ךְ כִּ֥י לֹֽא שָׁמַ֖עַתְּ בְּ/קוֹלִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/021.yaml
  text: I spoke to you in your prosperity[a], but you said, ‘I will not listen.’ This has been your way from your youth[b], for you have not listened to my voice.
translation:
  language: hi
  text: मैंने तेरे सुख-चैन के समय[a] तुझसे कहा था, पर तूने कहा, “मैं नहीं सुनूँगी[b]।” तेरी युवावस्था से ही तेरा यही ढंग रहा है, क्योंकि तूने मेरी आवाज़ नहीं सुनी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तेरी समृद्धि के समय” अथवा “जब तू सुरक्षित और निश्चिंत थी।” इब्रानी शब्द सुख-चैन, सुरक्षा या समृद्धि की दशा बता सकता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ और पद के अंत में “सुनना” का अर्थ “बात मानना” या “आज्ञा मानना” भी हो सकता है; इब्रानी क्रिया प्रायः दोनों भाव लिए होती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבַּרְתִּי אֵלַיִךְ
  choice: मैंने ... तुझसे बात की थी
  rationale: यह अभिव्यक्ति परमेश्वर के पहले किए गए सीधे संबोधन को स्वाभाविक हिन्दी में रखती है और אֶל की दिशात्मकता को “तुझसे” द्वारा व्यक्त करती है।
- source_word: בְּשַׁלְוֺתַיִךְ
  choice: तेरे सुख-चैन के समय
  rationale: שַׁלְוָה में शांति, निश्चिंतता, सुरक्षा और समृद्धि के अर्थ-क्षेत्र मिलते हैं। “सुख-चैन” मूल की शांत और सुरक्षित दशा को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि पादटिप्पणी अन्य संभावित अर्थों को सुरक्षित रखती है।
- source_word: לֹא אֶשְׁמָע
  choice: मैं नहीं सुनूँगी
  rationale: שׁמע के सुनने और आज्ञा मानने—दोनों अर्थों को अनावश्यक रूप से किसी एक तक सीमित न करते हुए श्रवण-रूपक बनाए रखा गया है। स्त्रीलिंग “सुनूँगी” मूल के स्त्रीलिंग एकवचन संबोधन को प्रकट करता है।
- source_word: זֶה דַרְכֵּךְ מִנְּעוּרַיִךְ
  choice: तेरी युवावस्था से ही तेरा यही ढंग रहा है
  rationale: “ढंग” यहाँ लगातार बने रहे आचरण को सहज हिन्दी में व्यक्त करता है; “रहा है” युवावस्था से वर्तमान तक चली आ रही प्रवृत्ति को स्पष्ट करता है।
- source_word: לֹא שָׁמַעַתְּ בְּקוֹלִי
  choice: तूने मेरी आवाज़ नहीं सुनी
  rationale: यह अनुवाद שׁמע और קוֹל की पुनरावृत्ति तथा आवाज़ की मूल छवि को बनाए रखता है, साथ ही प्रसंग में न मानने का निहित भाव खुला छोड़ता है।
theological_decisions:
- issue: स्त्रीलिंग एकवचन में संबोधित व्यक्ति या समुदाय की पहचान
  choice: मुख्य पाठ में संबोधित पक्ष को यरूशलेम, यहूदा या राजघराना कहकर स्पष्ट नहीं किया गया; स्त्रीलिंग क्रिया “सुनूँगी” से मूल का व्याकरणिक संकेत रखा गया है।
  alternative: मुख्य पाठ में संबोधित पक्ष को स्पष्ट रूप से यरूशलेम, यहूदा या राजघराना बताना।
  rationale: इब्रानी पाठ स्त्रीलिंग एकवचन रूपों में सीधे संबोधित करता है, पर इस पद में नाम नहीं देता। पहचान जोड़ना प्रसंग की एक व्याख्या को पाठ में स्थापित कर देता।
- issue: שׁמע का सुनना और आज्ञा मानना
  choice: मुख्य पाठ में “सुनना” रखा गया और आज्ञापालन का अर्थ पादटिप्पणी में बताया गया।
  alternative: दोनों स्थानों पर “आज्ञा मानना” या “बात मानना” लिखना।
  rationale: वाचा-संबंधी प्रसंग में आज्ञापालन निहित है, पर मूल शब्द की श्रवण-छवि और पद के भीतर उसकी पुनरावृत्ति को बनाए रखना उचित है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। सीधे दैवी उलाहने के लिए “तू/तेरा” का प्रयोग किया गया है। स्त्रीलिंग उद्धरण मूल के व्यक्तिकृत स्त्रीलिंग संबोधन को बिना उसका नाम निर्धारित किए दर्शाता है।
