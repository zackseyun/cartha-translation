base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/007.yaml
  text: And I will set apart destroyers against you[a], each with his weapons[c][b]; they will cut down the choicest of your cedars and cast them into the fire.
translation:
  language: hi
  text: और मैं तेरे विरुद्ध विनाश करनेवालों को अलग ठहराऊँगा[a], हर एक अपने हथियारों के साथ[b]; वे तेरे श्रेष्ठ देवदारों को काट गिराएँगे और उन्हें आग में डाल देंगे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘विनाश करनेवालों को पवित्र ठहराऊँगा।’ इब्रानी क्रिया प्रायः ‘पवित्र करना’ या किसी विशेष उद्देश्य के लिए ‘अलग करना’ व्यक्त करती है; यहाँ वे न्याय के कार्य के लिए अलग ठहराए गए हैं।
    reason: lexical_alternative
  - marker: b
    text: या ‘हर एक अपने औज़ारों/उपकरणों के साथ।’ इब्रानी शब्द अनेक प्रकार की वस्तुओं या उपकरणों को सूचित कर सकता है; इस प्रसंग में सम्भवतः हथियार अथवा विनाश के साधन अभिप्रेत हैं।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से ‘आग पर गिरा देंगे।’ ‘आग में डाल देंगे’ हिन्दी में अभिप्रेत अर्थ को अधिक स्वाभाविक रूप से व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִדַּשְׁתִּי
  choice: अलग ठहराऊँगा
  rationale: קדשׁ का मूल भाव किसी को पवित्र अथवा किसी विशेष उद्देश्य के लिए अलग करना है। न्याय के इस प्रसंग में ‘अलग ठहराऊँगा’ उस विशिष्ट नियुक्ति का भाव बचाता है, पर विनाश करनेवालों को नैतिक रूप से पवित्र नहीं बताता।
- source_word: מַשְׁחִתִים
  choice: विनाश करनेवालों
  rationale: שׁחת का यह कृदन्त विनाश के कर्ताओं को सूचित करता है। यह रूप आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: עָלֶיךָ
  choice: तेरे विरुद्ध
  rationale: शत्रुतापूर्ण कार्रवाई के प्रसंग में על का अर्थ ‘विरुद्ध’ है। एकवचन पुल्लिंग सम्बोधन बनाए रखा गया है।
- source_word: אִישׁ וְכֵלָיו
  choice: हर एक को उसके हथियारों सहित
  rationale: बहुवचन समूह के बाद אִישׁ का प्रयोग वितरणार्थक है, इसलिए ‘हर एक’। כְּלִי के व्यापक अर्थ में पात्र, औज़ार, उपकरण या हथियार आ सकते हैं; यहाँ सैन्य विनाश के प्रसंग में ‘हथियार’ सर्वाधिक सम्भावित है।
- source_word: וְכָרְתוּ
  choice: काट गिराएँगे
  rationale: वृक्षों के लिए כרת का अर्थ काटना या धराशायी करना है; ‘काट गिराना’ दोनों पक्षों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִבְחַר
  choice: उत्तम से उत्तम
  rationale: מִבְחָר चुनी हुई अथवा सर्वोत्तम वस्तुओं को दर्शाता है। ‘उत्तम से उत्तम’ सामान्य पाठक के लिए सहज रहते हुए उत्कृष्टता का बल बनाए रखता है।
- source_word: אֲרָזֶיךָ
  choice: तेरे ... देवदारों
  rationale: ठोस वृक्ष-चित्र को बनाए रखा गया है; प्रसंग में ये राजमहल की भव्य देवदार की लकड़ी की ओर भी संकेत कर सकते हैं।
- source_word: וְהִפִּילוּ עַל הָאֵשׁ
  choice: आग में डाल देंगे
  rationale: शाब्दिक रूप से ‘आग पर गिराएँगे’ है, पर हिन्दी में अभिप्रेत परिणाम को ‘आग में डाल देंगे’ अधिक स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: न्याय की भविष्यवाणी में पवित्रीकरण-संबंधी क्रिया का निर्वाह
  choice: अलग ठहराऊँगा
  alternative: नियुक्त करूँगा; पवित्र करूँगा
  rationale: ‘नियुक्त करूँगा’ मूल क्रिया के धार्मिक-सांस्कृतिक रंग को मिटा देता, जबकि ‘पवित्र करूँगा’ विनाशकों की नैतिक पवित्रता का भ्रामक संकेत दे सकता था। ‘अलग ठहराऊँगा’ परमेश्वर द्वारा न्याय के कार्य के लिए उन्हें विशेष रूप से निर्धारित करने का तनाव बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सुबोध स्तर रखा गया है। मूल पाठ के एकवचन पुल्लिंग सम्बोधन के कारण ‘तेरे/तेरे विरुद्ध’ रखा गया है। ‘विनाश करनेवालों’ और ‘अलग ठहराऊँगा’ जैसे पद सामान्य पाठक के लिए स्पष्ट हैं और मूल की न्याय-संबंधी तथा धार्मिक शब्दावली के बीच का तनाव भी सुरक्षित रखते हैं।
