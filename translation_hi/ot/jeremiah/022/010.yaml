base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/010.yaml
  text: Do not weep for the dead[a], and do not mourn for him. Weep bitterly for the one going away[b], for he will never return or see the land of his birth.
translation:
  language: hi
  text: मरे हुए के लिए मत रोओ और न उसके लिए शोक मनाओ। जो जा रहा है, उसके लिए फूट-फूटकर रोओ[a], क्योंकि वह फिर कभी नहीं लौटेगा और न अपनी जन्मभूमि को देखेगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “रोओ, रोओ।” इब्रानी में आज्ञार्थक क्रिया के साथ उसी क्रिया का इन्फिनिटिव ऐब्सोल्यूट रूप जोड़कर विशेष बल दिया गया है।
    reason: lexical_alternative
  - marker: b
    text: संदर्भ में “जो जा रहा है” उस शासक की ओर संकेत करता है जिसे बंदी बनाकर निर्वासन में ले जाया जा रहा है।
    reason: cultural_note
lexical_decisions:
- source_word: תִּבְכּוּ
  choice: रोओ
  rationale: בכה का सामान्य अर्थ रोना है; शोक के इस प्रसंग में सरल और स्वाभाविक हिन्दी ‘रोओ’ उपयुक्त है।
- source_word: לְמֵת
  choice: मरे हुए के लिए
  rationale: एकवचन रूप किसी विशिष्ट मृत व्यक्ति की ओर संकेत कर सकता है; यह अनुवाद उसकी संक्षिप्तता और संदर्भगत विशिष्टता बनाए रखता है।
- source_word: תָּנֻדוּ לוֹ
  choice: उसके लिए शोक मनाओ
  rationale: नूद शोक, संवेदना या शोकसूचक भाव प्रकट करने को दर्शा सकता है; ‘शोक मनाओ’ किसी विशेष शारीरिक संकेत को अनावश्यक रूप से निश्चित किए बिना अर्थ देता है।
- source_word: בְּכוּ בָכוֹ
  choice: फूट-फूटकर रोओ
  rationale: आज्ञार्थक क्रिया के साथ infinitive absolute आदेश को तीव्र करता है; ‘फूट-फूटकर’ आधुनिक हिन्दी में उस प्रबलता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לַהֹלֵךְ
  choice: जो जा रहा है, उसके लिए
  rationale: मूल में ‘जानेवाला’ है। यह रूप निर्वासन को मुख्य पाठ में स्पष्ट जोड़ने के बजाय जाने की मूल छवि और संदर्भगत अस्पष्टता बनाए रखता है।
- source_word: לֹא יָשׁוּב עוֹד
  choice: वह फिर कभी नहीं लौटेगा
  rationale: עוֹד के साथ निषेध स्थायी रूप से न लौटने का भाव देता है; ‘फिर कभी नहीं’ हिन्दी में उसके बल को स्पष्ट और स्वाभाविक ढंग से रखता है।
- source_word: וְרָאָה
  choice: और न ... देखेगा
  rationale: यह पहले निषेध के अधीन समन्वित दूसरी क्रिया है; हिन्दी में ‘और न’ दोनों भावों पर निषेध स्पष्ट करता है।
- source_word: אֶרֶץ מוֹלַדְתּוֹ
  choice: अपनी जन्मभूमि
  rationale: מוֹלֶדֶת जन्म या मूल देश को और אֶרֶץ भूमि को दर्शाता है; ‘जन्मभूमि’ संक्षिप्त, स्वाभाविक और भौगोलिक अर्थयुक्त है।
