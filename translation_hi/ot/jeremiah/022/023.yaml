translation_notes:
  register: 'आधुनिक मानक हिन्दी में काव्यात्मक, गरिमापूर्ण और सीधे संबोधन का स्वर रखा गया है। स्त्रीलिंग एकवचन रूपों से व्यक्तित्व दिए गए यरूशलेम/यहूदा का संकेत सुरक्षित है। ‘तुझ’ प्राचीन भविष्यद्वाणी के एकवचन संबोधन को स्पष्ट रखता है। पादटिप्पणी-चिह्नों को उनके वास्तविक विषयों से जोड़ा गया है: [a] कठिन क्रिया ‘कराहेगी’ पर और [b] ‘लबानोन’ की सांस्कृतिक छवि पर।'
