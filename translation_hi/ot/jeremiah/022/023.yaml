source:
  edition: WLC
  text: ישבתי בַּ/לְּבָנ֔וֹן מקננתי בָּֽ/אֲרָזִ֑ים מַה נֵּחַנְתְּ֙ בְּ/בֹא לָ֣/ךְ חֲבָלִ֔ים חִ֖יל כַּ/יֹּלֵדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/023.yaml
  text: You who dwell in Lebanon[a], who nest in the cedars, how you will groan when pangs come upon you[b], pain like that of a woman giving birth.
translation:
  language: hi
  text: हे लबानोन में रहने वाली[b], देवदारों के बीच अपना घोंसला बनाने वाली, जब तुझ पर वेदनाएँ आएँगी—प्रसव करती स्त्री की-सी पीड़ा—तब तू कैसी कराहेगी![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब तुझ पर वेदनाएँ आएँगी, तब तुझ पर कैसी दया की जाएगी!” जिस इब्रानी क्रिया का अनुवाद “कराहेगी” किया गया है, उसका अर्थ निश्चित नहीं है; कुछ लोग इसे कराहने के बजाय दया पाने के अर्थ में लेते हैं।
    reason: lexical_alternative
  - marker: b
    text: लबानोन और देवदार संभवतः लबानोन के देवदार की लकड़ी से बने राजमहल की ओर संकेत करते हैं; इस प्रकार यह यहूदा के शासकों को ऊँचाई पर सुरक्षित बसे हुए दिखाता है।
    reason: cultural_note
lexical_decisions:
- source_word: ישבתי
  choice: रहनेवाली
  rationale: संदर्भ और आगे के स्त्रीलिंग एकवचन रूपों के अनुसार यह यरूशलेम/यहूदा को स्त्री के रूप में संबोधन है। ישב का अर्थ यहाँ बैठना नहीं, निवास करना है।
- source_word: בַּלְּבָנוֹן
  choice: लबानोन में
  rationale: स्थानवाचक अर्थ को सीधे रखा गया है; राजमहल और ऊँची सुरक्षित स्थिति की संभावित प्रतीकात्मकता को मुख्य पाठ में निश्चित नहीं किया गया।
- source_word: מקננתי
  choice: अपना घोंसला बनानेवाली
  rationale: קנן के घोंसला बनाने और सुरक्षित निवास करने के सजीव रूपक को बनाए रखता है।
- source_word: בָּאֲרָזִים
  choice: देवदारों के बीच
  rationale: बहुवचन देवदारों की छवि को सुरक्षित रखते हुए स्वाभाविक हिन्दी देता है; यह वास्तविक वृक्षों या देवदार की इमारत, दोनों की ओर संकेत कर सकता है।
- source_word: מַה
  choice: कैसी
  rationale: यहाँ מַה प्रश्न से अधिक विस्मयबोधक तीव्रता व्यक्त करता है; ‘कैसी कराहेगी!’ हिन्दी में उस बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: נֵּחַנְתְּ
  choice: कराहेगी
  rationale: क्रिया कठिन है, पर आनेवाली प्रसव-वेदना के संदर्भ में कराहने का अर्थ उपयुक्त है; ‘दया की जाएगी’ वाली वैकल्पिक व्याख्या पादटिप्पणी में दी गई है।
- source_word: בְּבֹא לָךְ
  choice: जब तुझ पर ... आएँगी
  rationale: पूर्वसर्गयुक्त infinitive construct की कालवाचक भूमिका और विपत्ति के आ पड़ने का भाव स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: חֲבָלִים
  choice: वेदनाएँ
  rationale: प्रसव की उपमा के संदर्भ में यह पीड़ा की ऐंठन या प्रसव-वेदनाओं को दर्शाता है; अगला वाक्यांश उसका स्वरूप स्पष्ट करता है।
- source_word: חִיל
  choice: पीड़ा
  rationale: यह काँपने, तड़पने या मरोड़ की तीव्र व्यथा को व्यक्त करता है; ‘पीड़ा’ सामान्य पाठक के लिए स्पष्ट है और प्रसव की उपमा से तीव्रता मिलती है।
- source_word: כַּיֹּלֵדָה
  choice: प्रसव करती स्त्री की-सी
  rationale: मूल उपमा को स्पष्ट, आधुनिक और गरिमापूर्ण हिन्दी में सीधे व्यक्त करता है।
