  yaml_path: translation/ot/jeremiah/022/025.yaml
  text: And I will give you into the hand of those who seek your life[a], into the hand of those before whom you are afraid, into the hand of Nebuchadnezzar king of Babylon[b], and into the hand of the Chaldeans.
translation:
  language: hi
  text: मैं तुझे उन लोगों के हाथ में सौंप दूँगा जो तेरे प्राण के पीछे पड़े हैं, उन लोगों के हाथ में जिनसे तू डरता है, बाबेल के राजा नबूकदनेस्सर[a] के हाथ में और कसदियों[b] के हाथ में।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “नबूकदरेस्सर”; यह रूप यहाँ प्रयुक्त इब्रानी वर्तनी के अधिक निकट है।
    reason: lexical_alternative
  - marker: b
    text: इस प्रसंग में “कसदियों” का अनुवाद “बाबेलवासियों” भी किया जा सकता है, क्योंकि यह शब्द व्यापक रूप से बाबेल की सेनाओं के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתַתִּיךָ
  choice: मैं तुझे ... हाथ में कर दूँगा
  rationale: נתן के साथ बार-बार आने वाला בְיַד किसी को दूसरे के अधिकार में सौंपने का मुहावरा है। यह रूप हिन्दी में स्वाभाविक रहते हुए सौंपे जाने का भाव व्यक्त करता है।
- source_word: בְּיַד
  choice: के हाथ में
  rationale: यह चयन मूल की ठोस छवि और पद में चार बार आने वाली आलंकारिक पुनरावृत्ति को बनाए रखता है।
- source_word: מְבַקְשֵׁי נַפְשֶׁךָ
  choice: जो तेरे प्राण के पीछे पड़े हैं
  rationale: यहाँ נֶפֶשׁ का अर्थ व्यक्ति का जीवन या प्राण है। हिन्दी मुहावरा शत्रुतापूर्वक जान लेने की चेष्टा स्पष्ट करता है, बिना इसे अमूर्त 'आत्मा' बनाने के।
- source_word: אֲשֶׁר אַתָּה יָגוֹר מִפְּנֵיהֶם
  choice: जिनसे तू डरता है
  rationale: יָגוֹר यहाँ भय या आतंक का भाव रखता है। संक्षिप्त हिन्दी रूप मूल संबंधवाचक वाक्य का स्वाभाविक समतुल्य है।
- source_word: נְבוּכַדְרֶאצַּר
  choice: नबूकदनेस्सर
  rationale: मुख्य पाठ में हिन्दी पाठकों के बीच प्रचलित नाम-रूप रखा गया है; मूल इब्रानी वर्तनी के अधिक निकट रूप को पादटिप्पणी में दिया गया है।
- source_word: מֶלֶךְ בָּבֶל
  choice: बाबेल के राजा
  rationale: सम्बन्धसूचक इब्रानी पदबंध का सीधा और स्वाभाविक हिन्दी अनुवाद।
- source_word: הַכַּשְׂדִּים
  choice: कसदियों
  rationale: यह मूल जातीय नाम को सीधे सुरक्षित रखता है; प्रसंग में बाबेल की व्यापक सेना या बाबेलवासियों का अर्थ सम्भव है, जिसे पादटिप्पणी में दर्शाया गया है।
