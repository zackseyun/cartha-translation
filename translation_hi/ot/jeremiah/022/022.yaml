source:
  edition: WLC
  text: כָּל רֹעַ֨יִ/ךְ֙ תִּרְעֶה ר֔וּחַ וּֽ/מְאַהֲבַ֖יִ/ךְ בַּ/שְּׁבִ֣י יֵלֵ֑כוּ כִּ֣י אָ֤ז תֵּבֹ֨שִׁי֙ וְ/נִכְלַ֔מְתְּ מִ/כֹּ֖ל רָעָתֵֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/022.yaml
  text: All your shepherds the wind will shepherd[a], and your lovers will go into captivity[b]; then you will surely be ashamed and humiliated because of all your evil.
translation:
  language: hi
  text: तेरे सभी चरवाहों को हवा हाँक ले जाएगी[a], और तेरे प्रेमी बंदी होकर चले जाएँगे[b]; तब तू अपनी सारी बुराई के कारण लज्जित और अपमानित होगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरे सभी अगुओं को हवा तितर-बितर कर देगी।” हिब्रू में “चरवाहों” और हवा की उन्हें “हाँकने/चराने” वाली क्रिया के लिए एक ही मूल शब्द है; इससे विडंबनापूर्ण शब्द-क्रीड़ा बनती है।
    reason: lexical_alternative
  - marker: b
    text: “तेरे प्रेमी” भविष्यद्वाणी का एक रूपक है, जो यहूदा के अनुचित राजनीतिक सहयोगियों और आसक्तियों की ओर संकेत करता है।
    reason: cultural_note
lexical_decisions:
- source_word: רֹעַיִךְ
  choice: तेरे सब चरवाहों
  rationale: शाब्दिक ‘चरवाहे’ को बनाए रखा गया है; यिर्मयाह में यह शासकों या अगुओं का रूपक है, पर मुख्य पाठ में बिंब सुरक्षित रहता है।
- source_word: תִּרְעֶה רוּחַ
  choice: हवा हाँक ले जाएगी
  rationale: רעה की चरवाही-संबंधी क्रिया को स्वाभाविक हिन्दी ‘हाँक ले जाएगी’ से व्यक्त किया गया है। इससे चरवाहों के स्वयं हवा द्वारा हाँके जाने की विडंबना बनी रहती है, यद्यपि हिब्रू की पूर्ण शब्द-पुनरावृत्ति हिन्दी में संभव नहीं।
- source_word: מְאַהֲבַיִךְ
  choice: तेरे प्रेमी
  rationale: ‘प्रेमी’ भविष्यद्वाणी के उस रूपक और नैतिक तीखेपन को बनाए रखता है जिसमें यहूदा के राजनीतिक सहयोगी और अनुचित आसक्तियाँ संकेतित हैं।
- source_word: בַּשְּׁבִי יֵלֵכוּ
  choice: बंदी होकर चले जाएँगे
  rationale: यह ‘बंदी अवस्था में जाने’ का स्वाभाविक हिन्दी रूप है और निर्वासन की अपेक्षा שבי के बंदीपन-संबंधी अर्थ को अधिक सीधे रखता है।
- source_word: כִּי אָז
  choice: तब
  rationale: यहाँ आगामी न्याय के परिणाम की ओर संकेत है; ‘तब’ हिन्दी में स्वाभाविक रूप से उस क्रम को व्यक्त करता है।
- source_word: תֵּבֹשִׁי וְנִכְלַמְתְּ
  choice: निश्चय ही लज्जित और अपमानित होगी
  rationale: दो निकटार्थी हिब्रू क्रियाओं को अलग-अलग शब्दों से रखा गया है, ताकि लज्जा और अपमान दोनों का संचयी बल बना रहे।
- source_word: מִכֹּל רָעָתֵךְ
  choice: अपने सारे बुरे कामों के कारण
  rationale: מן को प्रसंगानुसार कारण के रूप में लिया गया है। רָעָה का अमूर्त ‘बुराई’ भी संभव है; ‘बुरे काम’ आधुनिक हिन्दी में अपराधपूर्ण आचरण को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: यहूदा के राजनीतिक और आत्मिक विश्वासघात की रूपकात्मक भाषा
  choice: मुख्य पाठ में ‘चरवाहों’ और ‘प्रेमी’ के बिंब बनाए रखे गए हैं।
  alternative: ‘अगुवों’ और ‘सहयोगियों’ जैसे व्याख्यात्मक शब्द रखे जा सकते थे।
  rationale: मूल भविष्यद्वाणी शासकों और विदेशी संबंधों की निंदा रूपकों के द्वारा करती है। बिंबों को बनाए रखने से राजनीतिक संकेत के साथ उसका नैतिक और धर्मवैचारिक तनाव भी सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। स्त्रीलिंग एकवचन ‘तू/तेरे’ मूल के स्त्रीलिंग संबोधन को सुरक्षित रखता है, जिसका संदर्भ यरूशलेम/यहूदा है। ‘हाँक ले जाएगी’ चरवाही के बिंब को स्वाभाविक हिन्दी में बनाए रखता है।
