  edition: WLC
  text: לָ/כֵ֞ן כֹּֽה אָמַ֣ר יְהוָ֗ה אֶל יְהוֹיָקִ֤ים בֶּן יֹאשִׁיָּ֨הוּ֙ מֶ֣לֶךְ יְהוּדָ֔ה לֹא יִסְפְּד֣וּ ל֔/וֹ ה֥וֹי אָחִ֖/י וְ/ה֣וֹי אָח֑וֹת לֹא יִסְפְּד֣וּ ל֔/וֹ ה֥וֹי אָד֖וֹן וְ/ה֥וֹי הֹדֹֽ/ה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/018.yaml
  text: 'Therefore thus says Yahweh concerning Jehoiakim son of Josiah[a], king of Judah: They will not lament for him, saying, “Alas, my brother!” or “Alas, sister!” They will not lament for him, saying, “Alas, lord!” or “Alas[d][c][b], his majesty!”'
translation:
  language: hi
  text: 'इसलिए याहवे यहोयाकीम के विषय में, जो योशिय्याह का पुत्र और यहूदा का राजा है, यह कहता है:

    “उसके लिए कोई यह कहकर विलाप[a] नहीं करेगा,

    ‘हाय, मेरे भाई!’ या ‘हाय, बहन!’[b]

    उसके लिए कोई यह कहकर विलाप नहीं करेगा,

    ‘हाय, स्वामी!’[c] या ‘हाय, उसका वैभव!’[d]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी क्रिया विशेष रूप से मृतक के लिए किए जाने वाले औपचारिक शोक-विलाप को सूचित करती है; इसका अनुवाद “शोक मनाना” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “बहन” के साथ इब्रानी में “मेरी” स्पष्ट रूप से नहीं है, जबकि “मेरे भाई” में संबंधसूचक प्रत्यय मौजूद है। अर्थ की समानांतरता के आधार पर “मेरी बहन” भी समझा जा सकता है।
    reason: textual_form_ambiguity
  - marker: c
    text: इब्रानी उपाधि का अर्थ “स्वामी,” “मालिक” या “प्रभु” हो सकता है और यहाँ वह किसी वरिष्ठ अथवा शासक को संबोधित करती है।
    reason: lexical_alternative
  - marker: d
    text: इब्रानी अभिव्यक्ति का शाब्दिक अर्थ “हाय, उसका वैभव!” है; इसे “हाय, उसकी महिमा!” भी अनूदित किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले न्याय-वचन से निकलने वाले निष्कर्ष को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: כֹּה אָמַר יְהוָה
  choice: याहवे ... यह कहता है
  rationale: यह भविष्यद्वाणी का मानक संदेशवाहक-सूत्र है; हिंदी वाक्य-क्रम के अनुसार विषय-संबंधी पद को इसके बीच रखा गया है।
- source_word: אֶל יְהוֹיָקִים
  choice: यहोयाकीम के विषय में
  rationale: यहाँ אֶל प्रत्यक्ष संबोधन से अधिक उस व्यक्ति को सूचित करता है जिसके विषय में न्याय-वचन है।
- source_word: לֹא יִסְפְּדוּ לוֹ
  choice: उसके लिए कोई ... विलाप नहीं करेगा
  rationale: ספד विशेष रूप से मृतक के लिए किए जाने वाले औपचारिक शोक-विलाप को दर्शाता है; एकवचन ‘कोई ... नहीं करेगा’ हिंदी में अनिश्चित बहुवचन कर्ता का स्वाभाविक रूप है।
- source_word: הוֹי
  choice: हाय
  rationale: अंत्येष्टि-विलाप की पुकार के लिए यह आधुनिक हिंदी का स्वाभाविक और गरिमापूर्ण विस्मयादिबोधक है।
- source_word: אָחִי
  choice: मेरे भाई
  rationale: इब्रानी शब्द में प्रथम पुरुष एकवचन संबंधसूचक प्रत्यय स्पष्ट है।
- source_word: אָחוֹת
  choice: बहन
  rationale: इब्रानी रूप में ‘मेरी’ का संबंधसूचक प्रत्यय नहीं है; समानांतरता के लिए उसे जोड़ने के बजाय मूल रूप की विषमता सुरक्षित रखी गई है।
- source_word: אָדוֹן
  choice: स्वामी
  rationale: यह किसी वरिष्ठ, अधिकारी या शासक के लिए सम्मानसूचक उपाधि हो सकती है; ‘स्वामी’ उस सामाजिक पद को व्यक्त करता है और याहवे के नाम से भेद बनाए रखता है।
- source_word: הֹדֹה
  choice: उसका वैभव
  rationale: הוֹד राजसी वैभव, प्रताप या महिमा को दर्शाता है और प्रत्यय ‘उसका’ को स्पष्ट करता है; पाठ की असामान्य शोक-पुकार को सामान्य उपाधि में नहीं बदला गया।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का विशिष्ट नाम सीधे आया है; उसका लिप्यंतरण नाम और उपाधि के बीच का अंतर बनाए रखता है।
- issue: הֹדֹה को राजकीय उपाधि या गुण के रूप में समझना
  choice: उसका वैभव
  alternative: उसकी महिमा; महाराज
  rationale: शब्द का मूल अर्थ वैभव/प्रताप है और उसमें तृतीय पुरुष संबंधसूचक प्रत्यय है। ‘महाराज’ अधिक स्वाभाविक शोक-पुकार होती, पर वह मूल की रूपात्मक और अर्थगत असामान्यता को मिटा देती।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में है। भविष्यद्वाणी-सूत्र गरिमापूर्ण रखा गया है, जबकि ‘हाय’ शोक-विलाप की सहज सार्वजनिक पुकार है। पद्यात्मक पंक्ति-विन्यास मूल की दो समानांतर विलाप-पंक्तियों को स्पष्ट करता है।
