source:
  edition: WLC
  text: חַי אָנִי֮ נְאֻם יְהוָה֒ כִּ֣י אִם יִהְיֶ֞ה כָּנְיָ֤הוּ בֶן יְהֽוֹיָקִים֙ מֶ֣לֶךְ יְהוּדָ֔ה חוֹתָ֖ם עַל יַ֣ד יְמִינִ֑/י כִּ֥י מִ/שָּׁ֖ם אֶתְּקֶֽ/נְךָּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/024.yaml
  text: As I live[a], declares Yahweh, even if Coniah son of Jehoiakim, king of Judah, were a signet ring on my right hand[b], even from there I would tear you off.
translation:
  language: hi
  text: 'याहवे की यह घोषणा है: “मेरे जीवन की शपथ, चाहे यहूदा का राजा, यहोयाकीम का पुत्र कोन्याह[a], मेरे दाहिने हाथ में पहनी मुहर की अंगूठी[b] होता, तो भी मैं तुम्हें वहाँ से खींचकर उतार दूँगा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसी राजा को अन्य स्थानों पर यकोन्याह भी कहा गया है।
    reason: alternative_name
  - marker: b
    text: इसे ‘मुहर’ या ‘मुद्रिका’ भी कहा जा सकता है। यहाँ हाथ में पहनी जाने वाली राजकीय मुहर का बिंब है, जो अधिकार और अत्यंत मूल्यवान होने का प्रतीक थी।
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי אָנִי
  choice: मेरे जीवन की शपथ
  rationale: यह एक गंभीर ईश्वरीय शपथ-सूत्र है। यह हिन्दी में स्वाभाविक ढंग से ‘मेरे जीवन की शपथ’ के रूप में उसका बल बनाए रखता है।
- source_word: נְאֻם יְהוָה
  choice: याहवे की यह घोषणा है
  rationale: मानक नबूवत-सूत्र को गरिमापूर्ण और सहज आधुनिक हिन्दी में प्रस्तुत करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में आए परमेश्वर के विशिष्ट वाचा-नाम को लिप्यंतरित किया गया है।
- source_word: כִּי אִם
  choice: चाहे … तो भी
  rationale: 'यहाँ प्रबल स्वीकारात्मक परिकल्पना है: कल्पित स्थिति मान लेने पर भी घोषित दण्ड नहीं बदलता।'
- source_word: כָּנְיָהוּ
  choice: कोन्याहू
  rationale: इस पद में उपस्थित हिब्रू नामरूप का सीधा देवनागरी लिप्यंतरण है; इसे अन्यत्र मिलने वाले अधिक प्रचलित रूप से नहीं मिलाया गया।
- source_word: חוֹתָם
  choice: मुहर की अंगूठी
  rationale: ऐसी मुहर को सूचित करता है जो हाथ पर पहनी जाती थी और अधिकार तथा मूल्यवान निकटता का चिह्न थी। यह चयन वस्तु और पद के बिंब, दोनों को स्पष्ट रखता है।
- source_word: עַל יַד יְמִינִי
  choice: मेरे दाहिने हाथ की
  rationale: दाहिने हाथ पर पहनी हुई मुहर की अंगूठी के बिंब को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִשָּׁם
  choice: वहाँ से
  rationale: यह उसी कल्पित प्रतिष्ठित स्थान—याहवे के दाहिने हाथ—की ओर संकेत करता है।
- source_word: אֶתְּקֶנְךָּ
  choice: मैं तुम्हें … खींचकर उतार देता
  rationale: क्रिया נתק के बलपूर्वक अलग करने के अर्थ को सुरक्षित रखता है और हाथ से अंगूठी उतारने के बिंब में स्वाभाविक बैठता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल में विशिष्ट वाचा-नाम सीधे आया है; लिप्यंतरण उसके नामगत स्वरूप को सुरक्षित रखता है।
- issue: כָּנְיָהוּ के नामरूप का निर्वाह
  choice: कोन्याहू
  alternative: यकोन्याह
  rationale: इसी पद में पाए जाने वाले संक्षिप्त हिब्रू नामरूप को सुरक्षित रखा गया है, जबकि पाठकों के लिए दूसरा नामरूप पादटिप्पणी में दिया गया है।
- issue: तीसरे पुरुष से दूसरे पुरुष में परिवर्तन
  choice: ‘कोन्याहू … होता’ के बाद ‘तुम्हें’
  alternative: पूरे वाक्य को तीसरे पुरुष में समरूप करना
  rationale: हिब्रू पाठ कोन्याहू का उल्लेख तीसरे पुरुष में करके फिर सीधे उसी को दूसरे पुरुष में सम्बोधित करता है। अनुवाद इस तीखे अलंकारिक परिवर्तन को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ईश्वरीय घोषणा की गंभीरता के लिए ‘मेरे जीवन की शपथ’ और न्याय की तीव्रता के लिए ‘खींचकर उतार देता’ चुना गया है। नाम और मुहर से जुड़ी आवश्यक जानकारी संक्षिप्त पादटिप्पणियों में दी गई है।
