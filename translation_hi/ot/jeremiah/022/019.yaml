  yaml_path: translation/ot/jeremiah/022/019.yaml
  text: He will be buried with the burial of a donkey—dragged off and thrown out beyond the gates of Jerusalem[a][b].
translation:
  language: hi
  text: उसे गधे का-सा दफन मिलेगा[a]—उसे घसीटकर यरूशलेम के फाटकों के परे फेंक दिया जाएगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “गधे का दफन”; या, “उसे गधे की तरह दफनाया जाएगा।”
    reason: lexical_alternative
  - marker: b
    text: यह चित्रण सम्मानजनक दफन के बजाय शव को अपमानजनक ढंग से नगर के बाहर फेंक दिए जाने को दर्शाता है।
    reason: cultural_note
lexical_decisions:
- source_word: קְבוּרַת חֲמוֹר
  choice: गधे की तरह दफनाया
  rationale: इब्रानी संबंधवाचक पद का शाब्दिक रूप ‘गधे का दफन’ है; हिन्दी में ‘गधे की तरह दफनाया’ तुलना और अपमानजनक आशय को स्वाभाविक ढंग से व्यक्त करता है, जबकि वैकल्पिक शाब्दिक रूप पादटिप्पणी में रखा गया है।
- source_word: יִקָּבֵר
  choice: दफनाया जाएगा
  rationale: קבר का निफ़अल अपूर्ण रूप भविष्यकालीन कर्मवाच्य अर्थ देता है।
- source_word: סָחוֹב
  choice: घसीटकर
  rationale: यह क्रिया-भाववाचक रूप अगले क्रियात्मक पद के साथ शव को अपमानपूर्वक घसीटे जाने का ढंग बताता है।
- source_word: וְהַשְׁלֵךְ
  choice: फेंक दिया जाएगा
  rationale: שלך के हिफ़इल रूप में बलपूर्वक फेंकने या डाल देने का भाव है; हिन्दी कर्मवाच्य मुख्य वाक्य की संरचना से मेल खाता है।
- source_word: מֵהָלְאָה לְשַׁעֲרֵי
  choice: फाटकों के बाहर
  rationale: यह स्थानसूचक अभिव्यक्ति नगर के फाटकों से परे, नगर-सीमा के बाहर फेंके जाने को दर्शाती है।
- source_word: יְרוּשָׁלִָם
  choice: यरूशलेम
  rationale: स्थान-नाम का प्रचलित आधुनिक हिन्दी रूप।
theological_decisions:
- issue: ‘गधे के दफन’ की तुलना का स्वरूप
  choice: इसे सम्मानजनक मानव दफन के विपरीत, गधे के शव जैसी अपमानजनक निकासी के रूप में व्यक्त किया गया है।
  alternative: इसे केवल दफनाने की रीति का तटस्थ, शाब्दिक वर्णन मानना।
  rationale: ‘गधे का दफन’ के बाद ‘घसीटकर’ और ‘फाटकों के बाहर फेंक दिया जाएगा’ स्पष्ट रूप से अनादर और उचित दफन से वंचित किए जाने की छवि बनाते हैं; अनुवाद इससे आगे कोई doctrinal निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण हिन्दी है। ‘घसीटकर’ और ‘फेंक दिया जाएगा’ मूल की कठोर, अपमानजनक छवि बनाए रखते हैं; ‘फाटकों के बाहर’ स्थान-संबंध को सामान्य पाठक के लिए स्पष्ट करता है।
