reference: Jeremiah 22:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: עֲלִ֤י הַ/לְּבָנוֹן֙ וּֽ/צְעָ֔קִי וּ/בַ/בָּשָׁ֖ן תְּנִ֣י קוֹלֵ֑/ךְ וְ/צַֽעֲקִי֙ מֵֽ/עֲבָרִ֔ים כִּ֥י נִשְׁבְּר֖וּ כָּל מְאַהֲבָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/020.yaml
  text: Go up to Lebanon and cry out[a]; raise your voice in Bashan; cry out from Abarim[b], for all your lovers are shattered.
translation:
  language: hi
  text: लबानोन पर चढ़कर पुकारो; बाशान में अपनी आवाज़ ऊँची करो; अबारीम से पुकारो[a], क्योंकि तुम्हारे सभी प्रेमी चकनाचूर हो गए हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पार जाने के स्थानों से” अथवा “पार के प्रदेशों से”; यहाँ लबानोन और बाशान के साथ आए होने के कारण इब्रानी शब्द संभवतः अबारीम नामक स्थान को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: “तुम्हारे प्रेमी” भविष्यद्वक्ताओं की भाषा में यहूदा के विदेशी सहयोगियों या राजनीतिक साझेदारों के लिए प्रयुक्त रूपक है।
    reason: cultural_note
lexical_decisions:
- source_word: עֲלִי הַלְּבָנוֹן
  choice: लबानोन पर चढ़कर
  rationale: स्त्रीलिंग एकवचन आज्ञार्थक क्रिया के आरोहण-संबंधी दिशात्मक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וּצְעָקִי / וְצַעֲקִי
  choice: पुकारो
  rationale: दोनों आवृत्तियों में एक ही शब्द रखकर इब्रानी की समानांतरता और ऊँची, व्याकुल पुकार का भाव सुरक्षित रखा गया है।
- source_word: וּבַבָּשָׁן תְּנִי קוֹלֵךְ
  choice: बाशान में अपनी आवाज़ ऊँची करो
  rationale: शाब्दिक मुहावरे ‘अपनी आवाज़ दो’ का अर्थ वर्तमान हिन्दी के सहज मुहावरे से व्यक्त किया गया है।
- source_word: מֵעֲבָרִים
  choice: अबारीम से
  rationale: लबानोन और बाशान के साथ भौगोलिक क्रम में इसे स्थाननाम समझना सबसे उपयुक्त है; सामान्य संज्ञा वाला संभावित अर्थ पादटिप्पणी में रखा गया है।
- source_word: נִשְׁבְּרוּ
  choice: चकनाचूर हो गए हैं
  rationale: निफ़अल पूर्ण क्रिया के विनाशकारी परिणाम और भविष्यद्वाणी की प्रबल काव्यात्मक छवि को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מְאַהֲבָיִךְ
  choice: तुम्हारे सभी प्रेमी
  rationale: ‘सहयोगी’ कहकर रूपक को खोल देने के बजाय भविष्यद्वाणी की तीखी प्रेमी-वाली उपमा सुरक्षित रखी गई है।
theological_decisions:
- issue: ‘प्रेमियों’ का रूपकात्मक संदर्भ
  choice: मुख्य पाठ में ‘प्रेमी’ का रूपक बनाए रखा गया है।
  alternative: ‘सहयोगी’ या ‘राजनीतिक मित्र’
  rationale: संदर्भ में यह यहूदा/यरूशलेम के विदेशी राजनीतिक साझेदारों की ओर संकेत करता है, पर व्याख्यात्मक अनुवाद करने से वाचा-संबंधी भविष्यद्वक्तापूर्ण रूपक का साहित्यिक और धर्मवैचारिक तनाव घट जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, काव्यात्मक और सीधे संबोधन वाला रूप रखा गया है। स्त्रीलिंग एकवचन संबोधन हिन्दी की क्रिया में अलग से दिखाई नहीं देता, इसलिए संदर्भगत अस्पष्टता को कृत्रिम रूप से नहीं सुलझाया गया।
