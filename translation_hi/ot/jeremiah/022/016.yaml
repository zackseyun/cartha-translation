  naturalness: “क्या मुझे जानना यही नहीं है?” is markedly awkward. “क्या मुझे जानना इसी को नहीं कहते?” is idiomatic modern Hindi while retaining the rhetorical force; a literal rendering can be retained in the footnote. “गरीबों और ज़रूरतमंदों” is clearer and more contemporary than “दीन-दुखियों” while preserving the twofold expression.
  terminology: “यहोवा” consistently renders the divine name. “मामले का न्याय किया” appropriately conveys the judicial idiom without suggesting merely abstract justice or importing advocacy beyond the text.
  issues:
