source:
  edition: WLC
  text: דָּ֛ן דִּין עָנִ֥י וְ/אֶבְי֖וֹן אָ֣ז ט֑וֹב הֲ/לוֹא הִ֛יא הַ/דַּ֥עַת אֹתִ֖/י נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/016.yaml
  text: He defended the cause of the poor and needy[a]; then it was well[b]. Is not that what it means to know me? declares Yahweh.
translation:
  language: hi
  text: उसने गरीबों और ज़रूरतमंदों के मामले का न्याय किया[a]; तब भला हुआ। क्या मुझे जानना इसी को नहीं कहते?[b] यहोवा की यह घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने गरीबों और ज़रूरतमंदों का मुक़दमा लड़ा।” इब्रानी मुहावरा न्यायिक है और उनके कानूनी पक्ष तथा अधिकार को कायम रखने का भाव रखता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “क्या यही मुझे जानना नहीं है?”
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּן דִּין
  choice: मुक़दमे में न्याय किया
  rationale: क्रिया और सजातीय संज्ञा का यह इब्रानी प्रयोग न्यायिक है। यह अनुवाद किसी मामले का न्यायपूर्वक निर्णय करने और निर्बल पक्ष के अधिकार को कायम रखने—दोनों भावों को व्यक्त करता है।
- source_word: עָנִי וְאֶבְיוֹן
  choice: दीन-दुखियों
  rationale: यह युग्म गरीबी, अभाव और सामाजिक असुरक्षा से ग्रस्त लोगों को दर्शाता है। प्रचलित हिंदी युग्म स्वाभाविक है और दोनों शब्दों के संयुक्त बल को संक्षेप में रखता है।
- source_word: אָז טוֹב
  choice: तब भला हुआ
  rationale: ‘तब’ कालगत और परिणामसूचक संबंध रखता है; ‘भला हुआ’ טוֹב के संक्षिप्त विधेयात्मक प्रयोग को अनावश्यक विस्तार के बिना व्यक्त करता है।
- source_word: הֲלוֹא הִיא הַדַּעַת אֹתִי
  choice: क्या मुझे जानना यही नहीं है?
  rationale: रूपक प्रश्न और ‘मुझे जानना’ की संज्ञात्मक रचना दोनों को निकटता से सुरक्षित रखा गया है; इससे न्यायपूर्ण आचरण और परमेश्वर को जानने के संबंध को बिना अतिरिक्त व्याख्या के व्यक्त किया जाता है।
- source_word: נְאֻם יְהוָה
  choice: यह यहोवा की घोषणा है
  rationale: मानक नबी-सूत्र की गंभीरता बनाए रखते हुए יְהוָה को उसके व्यक्तिगत नाम ‘यहोवा’ से प्रस्तुत किया गया है।
theological_decisions:
- issue: यहोवा को ‘जानने’ का अर्थ
  choice: दीन-दुखियों के लिए न्याय करना यहोवा को जानने की ठोस अभिव्यक्ति है
  alternative: इसे केवल बौद्धिक ज्ञान मानना, या परमेश्वर को जानने का संपूर्ण अर्थ केवल सामाजिक नैतिकता तक सीमित कर देना
  rationale: इब्रानी पाठ दोनों बातों के बीच सीधा संबंध रखता है, पर यह नहीं कहता कि न्याय का यह कार्य परमेश्वर को जानने के हर पहलू को समाप्त रूप से परिभाषित करता है। प्रश्नवाचक रचना इस धार्मिक तनाव को बनाए रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘मुक़दमा’ न्यायिक संदर्भ को स्पष्ट करता है; ‘दीन-दुखियों’ प्रचलित हिंदी में सामाजिक और आर्थिक असुरक्षा का संयुक्त भाव देता है।
