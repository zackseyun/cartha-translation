  text: וְ/עַל הָ/אָ֗רֶץ אֲשֶׁר הֵ֛ם מְנַשְּׂאִ֥ים אֶת נַפְשָׁ֖/ם לָ/שׁ֣וּב שָׁ֑ם שָׁ֖מָּ/ה לֹ֥א יָשֽׁוּבוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/027.yaml
  text: But to the land to which they lift up their soul to return[a], there they will not return.
translation:
  language: hi
  text: पर जिस देश में लौटने के लिए वे तरसते हैं[a], वहाँ वे नहीं लौटेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “जिस देश में लौटने के लिए वे अपना प्राण उठाते हैं।” “अपना प्राण उठाना” तीव्र इच्छा या लालसा व्यक्त करने वाला इब्रानी मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: पर जिस
  rationale: וְ का विरोधसूचक प्रवाह ‘पर’ से व्यक्त किया गया है। עַל से आरम्भ होने वाले विषयगत पद को हिन्दी में स्वाभाविक सम्बन्धवाचक रचना ‘जिस देश में’ के भीतर समाहित किया गया है।
- source_word: הָאָרֶץ
  choice: देश
  rationale: निर्वासन और वापसी के इस प्रसंग में אֶרֶץ किसी निश्चित देश या स्वदेश को सूचित करता है, पूरी पृथ्वी को नहीं। आधुनिक हिन्दी में ‘देश’ सर्वाधिक स्वाभाविक है।
- source_word: מְנַשְּׂאִים אֶת־נַפְשָׁם
  choice: वे तरसते हैं
  rationale: शाब्दिक अर्थ ‘वे अपना प्राण उठाते हैं’ है, पर यह तीव्र अभिलाषा का इब्रानी मुहावरा है। ‘तरसते हैं’ उसकी प्रबल लालसा को सहज आधुनिक हिन्दी में व्यक्त करता है; शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: לָשׁוּב ... לֹא יָשׁוּבוּ
  choice: लौटने ... नहीं लौटेंगे
  rationale: दोनों रूपों में שׁוּב की पुनरावृत्ति को हिन्दी में ‘लौटना’ दोहराकर बनाए रखा गया है।
- source_word: שָׁם ... שָׁמָּה
  choice: जिस देश में ... वहाँ
  rationale: पहला स्थानवाचक संकेत सम्बन्धवाचक ‘जिस देश में’ में स्वाभाविक रूप से समाहित है, जबकि दूसरे को ‘वहाँ’ के रूप में स्पष्ट रखकर इब्रानी के बलाघात को सुरक्षित किया गया है।
