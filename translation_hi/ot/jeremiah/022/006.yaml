id: JER.22.6
reference: Jeremiah 22:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּֽי כֹ֣ה אָמַ֣ר יְהוָ֗ה עַל בֵּית֙ מֶ֣לֶךְ יְהוּדָ֔ה גִּלְעָ֥ד אַתָּ֛ה לִ֖/י רֹ֣אשׁ הַ/לְּבָנ֑וֹן אִם לֹ֤א אֲשִֽׁיתְ/ךָ֙ מִדְבָּ֔ר עָרִ֖ים לֹ֥א נושבה־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/006.yaml
  text: 'For thus says Yahweh concerning the house of the king of Judah: You are Gilead to me[a], the summit of Lebanon; surely I will make you a wilderness[c][b], cities not inhabited.'
translation:
  language: hi
  text: 'क्योंकि यहोवा यहूदा के राजा के भवन के विषय में यों कहता है: “तू मेरे लिए गिलाद, लबानोन का शिखर है; निश्चय ही मैं तुझे उजाड़, निर्जन नगर बना दूँगा।”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “निश्चय ही मैं तुझे ... बना दूँगा” बलयुक्त, शपथ-सदृश इब्रानी अभिव्यक्ति का अनुवाद है (शाब्दिक रूप से, “यदि मैं तुझे ... न बनाऊँ”)। “निर्जन नगर” का अनुवाद “नगर जो बसे हुए नहीं हैं” भी हो सकता है; इब्रानी वाक्यांश उजाड़े जाने के परिणाम की ओर संकेत कर सकता है।
    reason: אִם לֹא की शपथ-सदृश बलवत्ता और עָרִים לֹא נוֹשָׁבָה की वाक्यगत/अर्थगत अस्पष्टता को सुरक्षित रखता है।
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के वाचा-नाम का प्रचलित और स्पष्ट लिप्यंतरण।
- source_word: עַל בֵּית מֶלֶךְ יְהוּדָה
  choice: यहूदा के राजा के भवन के विषय में
  rationale: עַל को तटस्थ ‘के विषय में’ और בֵּית को ‘भवन’ रखा गया है, जिससे राजमहल और राजकीय प्रतिष्ठान—दोनों की संभावित व्यापकता बनी रहती है।
- source_word: גִּלְעָד אַתָּה לִי
  choice: तू मेरी दृष्टि में गिलाद ... है
  rationale: לִי संबंध अथवा मूल्यांकन दर्शाता है; ‘मेरी दृष्टि में’ आधुनिक हिन्दी में इसका स्वाभाविक अर्थ देता है और रूपक को बनाए रखता है।
- source_word: רֹאשׁ הַלְּבָנוֹן
  choice: लबानोन का शिखर
  rationale: רֹאשׁ का भौगोलिक रूपक में अर्थ ‘शिखर/ऊपरी भाग’ है; ‘शिखर’ ऊँचाई और प्रमुखता दोनों व्यक्त करता है।
- source_word: אִם לֹא
  choice: फिर भी ... निश्चय ही
  rationale: यहाँ यह शाब्दिक शर्त नहीं, बल्कि शपथ-सदृश दृढ़ कथन है। ‘निश्चय ही’ बल को व्यक्त करता है; ‘फिर भी’ सम्मानसूचक रूपक से आने वाले न्याय की तीव्र विपरीतता को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: אֲשִׁיתְךָ מִדְבָּר
  choice: मैं ... तुझे उजाड़ बना दूँगा
  rationale: שׂים के परिणामसूचक प्रयोग को ‘बना दूँगा’ और מִדְבָּר की निर्जनता को ‘उजाड़’ से सहज तथा संक्षिप्त रूप में व्यक्त किया गया है।
- source_word: עָרִים לֹא נוֹשָׁבָה
  choice: ऐसे नगर, जिनमें कोई न बसेगा
  rationale: असामान्य अपपदात्मक वाक्यांश को परिणामसूचक स्पष्टीकरण के रूप में रखा गया है, जबकि निर्जन नगरों की मूल छवि बनी रहती है।
theological_decisions:
- issue: सम्मानसूचक भौगोलिक रूपक के तुरंत बाद न्याय की घोषणा
  choice: राजकीय भवन को परमेश्वर की दृष्टि में गिलाद और लबानोन के शिखर के समान मूल्यवान/ऊँचा दिखाकर भी उसके निश्चित उजाड़े जाने की घोषणा को साथ रखा गया है।
  alternative: स्थान-नामों को मुख्यतः देवदार की लकड़ी से बने राजमहल अथवा वनाच्छादित क्षेत्रों के अधिक ठोस संकेत के रूप में समझना।
  rationale: मूल इब्रानी सम्मान और न्याय के बीच तनाव को स्पष्ट करता है, पर रूपक का सटीक आधार नहीं खोलता; अनुवाद उसी अस्पष्टता और तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘यों कहता है’ भविष्यद्वाणी के पारंपरिक सूत्र को बनाए रखता है; ‘भवन’ मूल की व्यापकता और ‘उजाड़’ निर्जनता की छवि सुरक्षित रखते हैं।
