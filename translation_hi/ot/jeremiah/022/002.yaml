source:
  edition: WLC
  text: וְ/אָֽמַרְתָּ֙ שְׁמַ֣ע דְּבַר יְהוָ֔ה מֶ֣לֶךְ יְהוּדָ֔ה הַ/יֹּשֵׁ֖ב עַל כִּסֵּ֣א דָוִ֑ד אַתָּ֤ה וַ/עֲבָדֶ֨י/ךָ֙ וְ/עַמְּ/ךָ֔ הַ/בָּאִ֖ים בַּ/שְּׁעָרִ֥ים הָ/אֵֽלֶּה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/002.yaml
  text: and say[a], ‘Hear the word of Yahweh, O king of Judah, who sits on the throne of David—you, your servants, and your people who enter through these gates.’
translation:
  language: hi
  text: और कहना, “हे यहूदा के राजा, जो दाऊद की राजगद्दी पर बैठता है, याहवे का वचन सुनो—तुम, तुम्हारे सेवक[a] और तुम्हारी प्रजा, जो इन फाटकों से प्रवेश करते हो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हारे अधिकारी”; राजदरबार के संदर्भ में “सेवक” अधिकारियों को भी सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: और कहना
  rationale: पूर्ववर्ती आदेश को आगे बढ़ाने वाला संबद्ध पूर्ण रूप है; हिन्दी में ‘और कहना’ निर्देश की निरंतरता और प्रत्यक्ष वचन की भूमिका दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: שְׁמַע
  choice: सुन
  rationale: एकवचन पुल्लिंग आज्ञार्थक रूप राजा को सीधे संबोधित करता है। ‘सुन’ संदेश ग्रहण करने की भविष्यद्वक्ताई पुकार को बनाए रखता है और अर्थ को केवल ‘आज्ञा मान’ तक सीमित नहीं करता।
- source_word: דְּבַר יְהוָה
  choice: याहवे का वचन
  rationale: यह मानक भविष्यद्वक्ताई सूत्र है। ‘वचन’ דָּבָר के प्रकाशनात्मक और वाचागत भार को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में आए परमेश्वर के विशिष्ट नाम को उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत किया गया है।
- source_word: מֶלֶךְ יְהוּדָה
  choice: हे यहूदा के राजा
  rationale: प्रत्यक्ष संबोधन स्पष्ट है; ‘हे’ आधुनिक हिन्दी में गरिमापूर्ण संबोधन को चिह्नित करता है।
- source_word: הַיֹּשֵׁב עַל כִּסֵּא דָוִד
  choice: जो दाऊद की राजगद्दी पर बैठता है
  rationale: एकवचन कृदंत राजा को विशेषित करता है। ‘राजगद्दी’ राजकीय तथा वंशगत अर्थ को सामान्य पाठक के लिए स्पष्ट रखती है।
- source_word: אַתָּה וַעֲבָדֶיךָ וְעַמְּךָ
  choice: तू, तेरे सेवक और तेरी प्रजा
  rationale: अलग से आया सर्वनाम राजा पर बल देता है और फिर संबोधन को उसके अधीनस्थों तथा प्रजा तक विस्तृत करता है। עֲבָדִים का व्यापक अर्थ ‘सेवक’ रखा गया है।
- source_word: הַבָּאִים בַּשְּׁעָרִים הָאֵלֶּה
  choice: जो इन फाटकों से प्रवेश करते हैं
  rationale: कृदंत इन लोगों की नियमित या वर्णनात्मक क्रिया बताता है; गति के संदर्भ में בְּ को हिन्दी में स्वाभाविक रूप से ‘से’ व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में चतुरक्षरीय व्यक्तिगत नाम सीधे उपस्थित है। ‘याहवे’ उसे नाम के रूप में बनाए रखता है, किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: ‘दाऊद की राजगद्दी’ का वंशगत संकेत
  choice: मूल राजकीय रूपक को यथावत रखना
  alternative: दाऊद के वंश का राजा
  rationale: ‘राजगद्दी पर बैठता है’ वर्तमान राजकीय पद और दाऊदी वंश—दोनों का संकेत दे सकता है; व्याख्यात्मक विस्तार करने के बजाय मूल की अर्थ-समृद्धि रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रत्यक्ष भविष्यद्वक्ताई संबोधन के अनुरूप है। राजा के लिए एकवचन ‘तू’ मूल हिब्रू के सीधे और अधिकारपूर्ण संबोधन को बनाए रखता है; बहुवचन क्रिया बाद में सेवकों और प्रजा सहित पूरे समूह से मेल खाती है।
