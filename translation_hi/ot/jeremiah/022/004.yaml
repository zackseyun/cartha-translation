language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֤י אִם עָשׂוֹ֙ תַּֽעֲשׂ֔וּ אֶת הַ/דָּבָ֖ר הַ/זֶּ֑ה וּ/בָ֣אוּ בְ/שַׁעֲרֵ֣י הַ/בַּ֣יִת הַ/זֶּ֡ה מְלָכִים֩ יֹשְׁבִ֨ים לְ/דָוִ֜ד עַל כִּסְא֗/וֹ רֹֽכְבִים֙ בָּ/רֶ֣כֶב וּ/בַ/סּוּסִ֔ים ה֥וּא ו/עבד/ו וְ/עַמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/004.yaml
  text: For if you truly do this thing[a], then kings sitting on David’s throne will enter through the gates of this house, riding in chariots and on horses—he, his servants[b], and his people.
translation:
  language: hi
  text: क्योंकि यदि तुम सचमुच यह काम करोगे[a], तो दाऊद के सिंहासन पर बैठनेवाले राजा रथों में और घोड़ों पर सवार होकर इस भवन के फाटकों से प्रवेश करेंगे—हर राजा अपने सेवकों[b] और अपनी प्रजा के साथ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यह बात,” “यह मामला,” अथवा “यह वचन।” हिब्रू शब्द דָּבָר के ये सभी अर्थ हो सकते हैं।
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में शाब्दिक रूप से “वह, उसके सेवक और उसकी प्रजा” है। बहुवचन “राजाओं” के बाद एकवचन सर्वनाम प्रत्येक राजा के लिए अलग-अलग प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: क्योंकि यदि
  rationale: यह पद पिछले आदेश से तार्किक रूप से जुड़कर एक शर्त प्रस्तुत करता है; ‘क्योंकि यदि’ उस संबंध और शर्त, दोनों को बनाए रखता है।
- source_word: עָשׂוֹ תַּעֲשׂוּ
  choice: तुम सचमुच ... करोगे
  rationale: क्रिया के साथ प्रयुक्त infinitive absolute कार्य पर जोर देता है; ‘सचमुच’ आधुनिक हिन्दी में उस बल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הַדָּבָר הַזֶּה
  choice: यह काम
  rationale: דָּבָר का अर्थ ‘बात’, ‘वचन’, ‘मामला’ या ‘काम’ हो सकता है। संदर्भ में यह पिछले पद में बताए गए आचरण की ओर संकेत करता है, इसलिए ‘काम’ उपयुक्त है; शब्द की व्यापकता पादटिप्पणी में दी गई है।
- source_word: וּבָאוּ בְשַׁעֲרֵי הַבַּיִת הַזֶּה
  choice: इस भवन के फाटकों से प्रवेश करेंगे
  rationale: गति और फाटकों के उल्लेख के कारण וּבָאוּ को ‘प्रवेश करेंगे’ कहना स्वाभाविक है। ‘भवन’ हिब्रू ‘घर’ को बनाए रखते हुए राजमहल-संदर्भ के लिए भी उपयुक्त है।
- source_word: מְלָכִים יֹשְׁבִים לְדָוִד עַל כִּסְאוֹ
  choice: दाऊद के सिंहासन पर बैठनेवाले राजा
  rationale: यह दाऊद के राजवंश में सिंहासन संभालने वाले उत्तराधिकारियों को दर्शाता है, पर अनुवाद स्रोत से अधिक स्पष्ट वंशगत या मसीहाई भाषा नहीं जोड़ता।
- source_word: רֹכְבִים בָּרֶכֶב וּבַסּוּסִים
  choice: रथों में और घोड़ों पर सवार होकर
  rationale: हिन्दी में रथ के लिए ‘में’ और घोड़े के लिए ‘पर’ स्वाभाविक है। हिब्रू का एकवचन ‘रथ’ यहाँ सामूहिक अथवा सामान्य अर्थ में है।
- source_word: הוּא וַעֲבָדָיו וְעַמּוֹ
  choice: हर राजा अपने सेवकों और अपनी प्रजा के साथ
  rationale: हिब्रू में बहुवचन ‘राजाओं’ के बाद एकवचन सर्वनाम वितरणात्मक रूप में आता है। ‘हर राजा’ इस असामान्य संख्या-संबंध को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘दाऊद के सिंहासन’ में राजवंशीय प्रतिज्ञा
  choice: दाऊद के सिंहासन पर बैठने वाले राजाओं के निरंतर उत्तराधिकार के रूप में अनुवाद
  alternative: इसे सीधे मसीहाई कथन बनाना या ‘दाऊद के वंश के राजा’ जोड़ना
  rationale: तात्कालिक संदर्भ आज्ञापालन से जुड़ी दाऊदी राजतंत्र की निरंतरता का है। पद में बाद की मसीहाई व्याख्या को आरोपित किए बिना ऐतिहासिक-राजवंशीय अर्थ और उसकी धर्मवैज्ञानिक संभावनाएँ खुली रखी गई हैं।
- issue: बहुवचन ‘राजा’ के बाद एकवचन सर्वनाम
  choice: ‘हर राजा’ द्वारा वितरणात्मक अर्थ व्यक्त करना
  alternative: शाब्दिक रूप से ‘वह, उसके सेवक और उसकी प्रजा’ रखना, या इसे पूर्णतः बहुवचन ‘वे, उनके’ कर देना
  rationale: यह चयन हिब्रू के एकवचन रूप का अर्थ सुरक्षित रखता है और हिन्दी में संदर्भ को अस्पष्ट अथवा व्याकरणतः असहज नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘भवन’ मूल के ‘घर’ को निकटता से दर्शाता है और संदर्भगत राजमहल की संभावना को बिना अनावश्यक रूप से निश्चित किए सुरक्षित रखता है।
