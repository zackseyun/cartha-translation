base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/001.yaml
  text: 'Thus says Yahweh: Go down to the house of the king of Judah[c][b][a], and speak there this word:'
translation:
  language: hi
  text: 'याहवे यों कहता है:[a] “यहूदा के राजा के भवन तक नीचे जा और वहाँ यह वचन[c] कह:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे यह कहता है।”
    reason: lexical_alternative
  - marker: c
    text: या, “यह संदेश।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: याहवे यों कहता है
  rationale: यह प्रचलित भविष्यद्वाणी-संदेश सूत्र है। वर्तमानकालीन ‘कहता है’ कथन को तत्काल प्रस्तुत करता है, जबकि ‘यों’ मूल के כֹּה की औपचारिक गरिमा बनाए रखता है।
- source_word: רֵד
  choice: नीचे जा
  rationale: आज्ञार्थक क्रिया ירד की दिशात्मकता को सहज आधुनिक हिन्दी में स्पष्ट रूप से व्यक्त करता है।
- source_word: בֵּית מֶלֶךְ יְהוּדָה
  choice: यहूदा के राजा के भवन
  rationale: मूल का शाब्दिक अर्थ ‘यहूदा के राजा का घर/भवन’ है। ‘भवन’ हिन्दी में राजकीय निवास के लिए स्वाभाविक है, पर ‘महल’ कहकर अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: וְדִבַּרְתָּ שָׁם
  choice: और वहाँ … कह
  rationale: आज्ञा के बाद आया यह क्रियारूप उसी आज्ञार्थक क्रम को आगे बढ़ाता है। हिन्दी में ‘कह’ सरल और स्वाभाविक है तथा ‘घोषणा कर’ जैसा अतिरिक्त बल नहीं जोड़ता।
- source_word: אֶת־הַדָּבָר הַזֶּה
  choice: यह वचन
  rationale: דָּבָר यहाँ आगे आने वाले एक विशिष्ट भविष्यद्वाणी-कथन को दर्शाता है। ‘वचन’ एकवचन और भविष्यद्वाणी-संदर्भ दोनों को बनाए रखता है; ‘संदेश’ भी सम्भव है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूपांतरण
  choice: याहवे
  alternative: यहोवा अथवा प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत वाचा-नाम सीधे उपस्थित है। ‘याहवे’ उसे उपाधि में बदले बिना और किसी सम्प्रदायगत व्याख्या को जोड़े बिना नाम के रूप में सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। भविष्यद्वाणी-सूत्र में औपचारिक लय रखी गई है। अंतिम विसर्ग अगले पद में आने वाले प्रत्यक्ष संदेश का परिचय देता है; आरम्भिक उद्धरण-चिह्न भी उसी निरन्तर कथन को संकेत करता है।
