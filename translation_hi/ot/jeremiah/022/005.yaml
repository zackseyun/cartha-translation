  text: וְ/אִם֙ לֹ֣א תִשְׁמְע֔וּ אֶת הַ/דְּבָרִ֖ים הָ/אֵ֑לֶּה בִּ֤/י נִשְׁבַּ֨עְתִּי֙ נְאֻם יְהוָ֔ה כִּי לְ/חָרְבָּ֥ה יִֽהְיֶ֖ה הַ/בַּ֥יִת הַ/זֶּֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/005.yaml
  text: But if you do not listen to these words[a], I swear by myself, declares Yahweh, that this house will become a ruin.
translation:
  language: hi
  text: पर यदि तुम इन बातों को नहीं सुनोगे, तो मैं अपनी ही शपथ खाता हूँ—याहवे की यह घोषणा है—कि यह भवन[a] खंडहर हो जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यह राजभवन”; प्रसंग में “यह भवन” संभवतः यहूदा के राजा के राजभवन को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: पर यदि
  rationale: यह पिछले कथन के विपरीत परिणाम वाली शर्त प्रस्तुत करता है; ‘पर यदि’ हिन्दी में इस विरोध और शर्त, दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לֹא תִשְׁמְעוּ
  choice: नहीं सुनोगे
  rationale: שׁמע का अर्थ सुनना, ध्यान देना या आज्ञा मानना हो सकता है। ‘नहीं सुनोगे’ मूल श्रवण-रूपक को बनाए रखते हुए बात मानने का आशय भी संकेतित करता है।
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: इन बातों को
  rationale: דברים यहाँ कही गई बातों/वचनों को दर्शाता है। आधुनिक हिन्दी में ‘इन बातों को सुनना’ अधिक स्वाभाविक है, जबकि अर्थ स्रोत के निकट रहता है।
- source_word: בִּי נִשְׁבַּעְתִּי
  choice: मैं अपनी ही शपथ खाकर कहता हूँ
  rationale: यह दैवी शपथ-सूत्र है, जिसका आशय है कि याहवे स्वयं को शपथ का आधार बनाते हैं। यह हिन्दी अभिव्यक्ति उस गंभीरता को स्पष्ट और स्वाभाविक ढंग से व्यक्त करती है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: मानक भविष्यद्वाणी-सूत्र को गरिमापूर्ण और स्पष्ट आधुनिक हिन्दी में रखा गया है।
- source_word: לְחָרְבָּה
  choice: उजाड़
  rationale: यह शब्द विनाश और निर्जन दशा को व्यक्त करता है। ‘उजाड़ हो जाएगा’ हिन्दी में स्वाभाविक है और केवल ढही हुई इमारत से अधिक व्यापक तबाही का भाव बनाए रखता है।
- source_word: הַבַּיִת הַזֶּה
  choice: यह भवन
  rationale: בַּיִת का मूल अर्थ घर/भवन है; प्रसंग में यह यहूदा के राजा के राजभवन का संकेत हो सकता है। ‘भवन’ मूल की व्यापकता बनाए रखता है और संदर्भगत अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: दैवी शपथ-सूत्र का काल और बल
  choice: मैं अपनी ही शपथ खाकर कहता हूँ
  alternative: मैंने अपनी ही शपथ खाई है
  rationale: हिब्रू पूर्ण रूप यहाँ प्रत्यक्ष वाणी में क्रियात्मक शपथ की तरह समझा जा सकता है। वर्तमानकालीन हिन्दी कथन चेतावनी की तात्कालिकता और गंभीरता को बनाए रखता है।
- issue: ‘इस भवन’ का संदर्भ
  choice: यह भवन
  alternative: यह राजभवन
  rationale: निकटवर्ती प्रसंग यहूदा के राजा के भवन को संबोधित करता है, पर हिब्रू में सामान्य शब्द בַּיִת है। इसलिए मुख्य पाठ में व्यापक शब्द रखा गया है और संभावित विशिष्ट अर्थ पादटिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। भविष्यद्वाणी की चेतावनी तथा दैवी शपथ की गंभीरता बनाए रखने के लिए वाक्य में दीर्घ विरामों का प्रयोग किया गया है। ‘याहवे’ के रूप में दैवी नाम का लिप्यंतरण किया गया है।
