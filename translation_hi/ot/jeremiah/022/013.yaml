id: JER.22.13
reference: Jeremiah 22:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: ה֣וֹי בֹּנֶ֤ה בֵית/וֹ֙ בְּֽ/לֹא צֶ֔דֶק וַ/עֲלִיּוֹתָ֖י/ו בְּ/לֹ֣א מִשְׁפָּ֑ט בְּ/רֵעֵ֨/הוּ֙ יַעֲבֹ֣ד חִנָּ֔ם וּ/פֹעֲל֖/וֹ לֹ֥א יִתֶּן לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/013.yaml
  text: Woe to him who builds his house without righteousness[a], and his upper rooms without justice[c][b], who makes his neighbor work for nothing and does not give him his wages.
translation:
  language: hi
  text: “हाय उस पर जो अपना घर अनीति से[a] और अपने ऊपरी कक्ष[b] अन्याय से बनाता है; जो अपने पड़ोसी से बिना मजदूरी काम कराता है और उसे उसकी मजदूरी[c] नहीं देता!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “न्याय के बिना।” यहाँ प्रयुक्त צֶדֶק और आगे प्रयुक्त מִשְׁפָּט के अर्थ निकट हैं और कभी-कभी एक-दूसरे से मिलते हैं।
    reason: lexical_alternative
  - marker: b
    text: “ऊपरी कक्ष” का अनुवाद “ऊपरी कोठरियाँ” या “ऊपरी मंजिल के कमरे” भी हो सकता है; संकेत किसी बड़े घर के ऊपरी भाग की ओर है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से “उसका काम”; इस प्रसंग में आशय काम के बदले मजदूर को मिलने वाली देय मजदूरी से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: हाय उस पर
  rationale: यह भविष्यद्वक्ता की ओर से शोक और दंड-घोषणा, दोनों का तीखा भाव व्यक्त करता है और हिन्दी में संबोधित व्यक्ति पर आने वाली विपत्ति को स्वाभाविक ढंग से प्रकट करता है।
- source_word: בֹּנֶה בֵיתוֹ
  choice: जो अपना घर ... बनाता है
  rationale: कृदंत यहाँ व्यक्ति के निरंतर या विशिष्ट आचरण का वर्णन करता है। 'घर' मूल शब्द का सीधा अर्थ रखता है; राजकीय प्रसंग में महल का संकेत संदर्भ से समझा जा सकता है।
- source_word: בְּלֹא צֶדֶק
  choice: अनीति से
  rationale: शाब्दिक संरचना 'צֶדֶק के बिना' है। इस निर्माण को संभव बनाने वाले अनैतिक आचरण के संदर्भ में 'अनीति से' सहज हिन्दी है और अगले पद के 'अन्याय' से संबंधित किंतु अलग अभिव्यक्ति बनाए रखता है।
- source_word: וַעֲלִיּוֹתָיו
  choice: और अपने ऊपरी कक्ष
  rationale: यह बड़े घर के ऊपरी भाग में बने कमरों या कोठरियों को दर्शाता है। 'ऊपरी कक्ष' स्पष्ट, गरिमापूर्ण और स्थापत्य बिंब के निकट है।
- source_word: בְּלֹא מִשְׁפָּט
  choice: अन्याय से
  rationale: מִשְׁפָּט यहाँ उचित अधिकार और न्यायपूर्ण व्यवहार को सूचित करता है। 'अन्याय से' मजदूर को उसका हक न देने की सामाजिक बुराई स्पष्ट करता है।
- source_word: בְּרֵעֵהוּ
  choice: अपने पड़ोसी से
  rationale: רֵעַ सामाजिक संबंध में दूसरे व्यक्ति, साथी या पड़ोसी को दर्शाता है। 'पड़ोसी' प्रचलित बाइबलीय हिन्दी है और दूसरे मनुष्य के प्रति उत्तरदायित्व का भाव रखता है।
- source_word: יַעֲבֹד חִנָּם
  choice: बेगार कराता है
  rationale: मुहावरे का अर्थ किसी से बिना पारिश्रमिक काम कराना है। 'बेगार कराता है' शोषण और भुगतान के अभाव को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: וּפֹעֲלוֹ לֹא יִתֶּן לוֹ
  choice: और उसे उसकी मजदूरी नहीं देता
  rationale: פֹּעַל का मूल संबंध काम से है, पर 'देना' और बिना भुगतान के श्रम कराने के संदर्भ में इसका आशय काम का देय पारिश्रमिक है। 'मजदूरी' इसे स्पष्ट करती है।
theological_decisions:
- issue: צֶדֶק और מִשְׁפָּט की संबंधित नैतिक जोड़ी
  choice: अनीति से ... अन्याय से
  alternative: धार्मिकता के बिना ... न्याय के बिना
  rationale: दोनों इब्रानी शब्दों के अर्थ परस्पर मिल सकते हैं, फिर भी मूल में दो अलग शब्द हैं। हिन्दी में 'अनीति' और 'अन्याय' उस निकटता और भेद दोनों को बनाए रखते हैं, जबकि संदर्भ के सामाजिक-आर्थिक शोषण को किसी संप्रदायगत अर्थ से नहीं बाँधते।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यद्वक्तीय शैली रखी गई है। 'हाय उस पर' दंड-घोषणा का बल बनाए रखता है; 'बेगार कराता है' साधारण पाठक के लिए शोषण को तुरंत स्पष्ट करता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
