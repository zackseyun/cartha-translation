  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶרֶץ / אָרֶץ
  choice: देश
  rationale: यह संज्ञा ‘देश/भूमि’ या व्यापक अर्थ में ‘पृथ्वी’ को सूचित कर सकती है। प्रसंग में यहूदा के देश को संबोधन अधिक संभावित है; तीन बार की पुनरावृत्ति भविष्यद्वाणी की तीव्रता बनाए रखती है। स्वाभाविक हिन्दी संबोधन के लिए ‘हे’ जोड़ा गया है।
- source_word: שִׁמְעִי
  choice: सुन
  rationale: यह स्त्रीलिंग एकवचन आज्ञार्थक रूप है और אֶרֶץ को संबोधित करता है। ‘सुन’ प्रत्यक्ष अर्थ के साथ ध्यान देकर ग्रहण करने का भाव भी बनाए रखता है।
- source_word: דְּבַר
  choice: वचन
  rationale: भविष्यद्वाणी के प्रचलित और गरिमापूर्ण सूत्र ‘यहोवा का वचन’ में ‘वचन’ मूल के अर्थ और धार्मिक साहित्यिक प्रतिध्वनि को सुरक्षित रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित व्यक्तिगत नाम ‘यहोवा’ चतुराक्षरीय ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला नाम-रूप है और इसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: אֶרֶץ के संबोधन का क्षेत्र
  choice: देश
  alternative: पृथ्वी
  rationale: निकटवर्ती प्रसंग स्थानीय देश, विशेषकर यहूदा, की ओर संकेत करता है; फिर भी शब्द की व्यापक अर्थ-संभावना को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा संक्षिप्त, गरिमापूर्ण और घोषणात्मक रखी गई है। मूल की त्रिगुण पुनरावृत्ति और प्रत्यक्ष संबोधन सुरक्षित हैं; हिन्दी में संबोधन स्पष्ट और स्वाभाविक बनाने के लिए प्रत्येक पद के साथ ‘हे’ रखा गया है।
