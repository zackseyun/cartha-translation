source:
  edition: WLC
  text: הֲ/תִֽמְלֹ֔ךְ כִּ֥י אַתָּ֖ה מְתַחֲרֶ֣ה בָ/אָ֑רֶז אָבִ֜י/ךָ הֲ/ל֧וֹא אָכַ֣ל וְ/שָׁתָ֗ה וְ/עָשָׂ֤ה מִשְׁפָּט֙ וּ/צְדָקָ֔ה אָ֖ז ט֥וֹב לֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/015.yaml
  text: Do you reign because you compete in cedar? Did not your father eat and drink and do justice and righteousness? Then it was well with him[a][b].
translation:
  language: hi
  text: क्या तू इसलिए राज करता है कि देवदार को लेकर होड़ करता है?[a] क्या तेरे पिता ने खाया-पिया नहीं और न्याय और धार्मिकता के काम नहीं किए? तब उसका भला हुआ।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी अभिव्यक्ति दुर्लभ है। इसका अनुवाद “देवदार में होड़ करता है,” “देवदार के लिए होड़ करता है,” या “देवदार के लिए उत्सुक रहता है” भी हो सकता है। संभवतः इसका संकेत देवदार से सजे राजमहलों द्वारा किए जाने वाले शाही दिखावे और प्रतिस्पर्धा की ओर है।
    reason: lexical_alternative
  - marker: b
    text: “न्याय और धार्मिकता” का अनुवाद “न्याय और उचित काम” भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: הֲתִמְלֹךְ
  choice: क्या तू ... राज करता है
  rationale: प्रश्नवाचक अपूर्ण क्रिया यहाँ वर्तमान स्थिति और राजत्व के आधार को चुनौती देने वाला आलंकारिक प्रश्न है।
- source_word: כִּי אַתָּה מְתַחֲרֶה בָאָרֶז
  choice: इसलिए ... कि देवदार के काम में होड़ करता है
  rationale: दुर्लभ अभिव्यक्ति राजमहल के देवदार-युक्त निर्माण द्वारा की जाने वाली प्रतिस्पर्धा या आत्मप्रदर्शन की ओर संकेत करती जान पड़ती है। 'देवदार के काम में' अर्थ को सहज बनाता है, पर पादटिप्पणी में वास्तविक अनिश्चितता रखी गई है।
- source_word: אָבִיךָ
  choice: तेरे पिता
  rationale: सीधा पितृ-संबंध; निकट संदर्भ में संभवतः योशिय्याह की ओर संकेत है, पर नाम पाठ में नहीं जोड़ा गया।
- source_word: אָכַל וְשָׁתָה
  choice: खाया-पिया
  rationale: सामान्य जीवन और उसके उचित आनंद का सहज हिन्दी मुहावरा; इसे भोग-विलास के रूप में नैतिकीकृत नहीं किया गया।
- source_word: וְעָשָׂה מִשְׁפָּט וּצְדָקָה
  choice: न्याय और धार्मिकता के काम किए
  rationale: मुख्य वाचाई युग्म के दोनों पहलुओं को अलग रखते हुए हिन्दी में स्वाभाविक क्रियात्मक रूप दिया गया है।
- source_word: אָז טוֹב לוֹ
  choice: तब उसका भला हुआ
  rationale: אָז के परिणामसूचक बल और טוֹב לוֹ के कल्याणकारी अर्थ को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: מִשְׁפָּט וּצְדָקָה में צְדָקָה का अनुवाद
  choice: न्याय और धार्मिकता
  alternative: न्याय और सही काम
  rationale: '''धार्मिकता'' नैतिक और वाचाई आयाम को बनाए रखती है तथा इसे ''न्याय'' का मात्र दूसरा पर्याय नहीं बनाती; अधिक सहज वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।'
translation_notes:
  register: आधुनिक मानक हिन्दी में राजकीय-भविष्यद्वाणी का गरिमापूर्ण, सीधा संबोधन रखा गया है। एकवचन 'तू/तेरे' मूल के 2ms रूप और कठोर भविष्यद्वक्तापूर्ण फटकार को व्यक्त करता है। दुर्लभ देवदार-संबंधी वाक्यांश की अनिश्चितता पादटिप्पणी में सुरक्षित है।
