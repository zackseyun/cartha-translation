  text: כִּ֗י בִּ/מְק֛וֹם אֲשֶׁר הִגְל֥וּ אֹת֖/וֹ שָׁ֣ם יָמ֑וּת וְ/אֶת הָ/אָ֥רֶץ הַ/זֹּ֖את לֹֽא יִרְאֶ֥ה עֽוֹד־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/012.yaml
  text: For in the place where they have exiled him[a], there he will die, and he will never see this land again.
translation:
  language: hi
  text: क्योंकि जिस स्थान पर वे उसे निर्वासन में ले गए हैं[a], वहीं वह मरेगा और इस देश को फिर कभी नहीं देखेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे उसे बंदी बनाकर ले गए हैं” अथवा “वे उसे निर्वासित करके ले गए हैं।” इब्रानी क्रिया का विशेष अर्थ किसी को निर्वासन में भेजना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण बताता है; आधुनिक हिन्दी में ‘क्योंकि’ इसका स्पष्ट और स्वाभाविक संयोजक है।
- source_word: בִּמְקוֹם אֲשֶׁר
  choice: जिस स्थान पर
  rationale: इब्रानी के स्थानवाचक संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: הִגְלוּ אֹתוֹ
  choice: वे उसे निर्वासन में ले गए हैं
  rationale: גלה के हिफ़ील रूप में किसी को देश से निकालकर निर्वासन में पहुँचाने का अर्थ है। ‘वे’ मूल के अनिर्दिष्ट बहुवचन कर्ता को सुरक्षित रखता है।
- source_word: שָׁם
  choice: वहीं
  rationale: मूल में स्थान की पुनरुक्ति पर दिए गए बल को हिन्दी में ‘वहीं’ स्पष्ट रूप से व्यक्त करता है।
- source_word: יָמוּת
  choice: वह मरेगा
  rationale: अपूर्ण क्रिया के भावी, निश्चित परिणाम को सरल आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וְאֶת־הָאָרֶץ הַזֹּאת
  choice: और इस देश को
  rationale: संदर्भ में אֶרֶץ व्यक्ति की अपनी मातृभूमि, अर्थात यहूदा, को सूचित करता है; ‘देश’ सामान्य हिन्दी पाठक के लिए स्वाभाविक है।
- source_word: לֹא יִרְאֶה עוֹד
  choice: फिर कभी नहीं देखेगा
  rationale: निषेध और עוֹד की अंतिमता को मुहावरेदार हिन्दी में व्यक्त करता है।
