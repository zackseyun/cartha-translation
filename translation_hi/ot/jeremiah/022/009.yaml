id: JER.22.9
reference: Jeremiah 22:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אָ֣מְר֔וּ עַ֚ל אֲשֶׁ֣ר עָֽזְב֔וּ אֶת בְּרִ֥ית יְהוָ֖ה אֱלֹֽהֵי/הֶ֑ם וַ/יִּֽשְׁתַּחֲו֛וּ לֵ/אלֹהִ֥ים אֲחֵרִ֖ים וַ/יַּעַבְדֽוּ/ם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/009.yaml
  text: And they will say[b][a], ‘Because they abandoned the covenant of Yahweh their God and bowed down to other gods and served them.’
translation:
  language: hi
  text: और वे कहेंगे, “क्योंकि उन्होंने अपने परमेश्वर याहवे की वाचा को त्याग दिया[a] और दूसरे देवताओं के आगे दण्डवत् किया और उनकी सेवा की[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “छोड़ दिया।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “दूसरे देवताओं को दण्डवत् किया और उनकी सेवा की”; दोनों क्रियाएँ मिलकर मूर्तिपूजक आराधना का वर्णन करती हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: और वे कहेंगे
  rationale: यह रूप पिछले पद के भविष्याभिमुख कथन को आगे बढ़ाता है; ‘और’ इब्रानी वाक्य-संबंध को बनाए रखता है।
- source_word: עַל אֲשֶׁר
  choice: क्योंकि
  rationale: यह पदबंध न्याय का कारण बताता है; आधुनिक हिन्दी में ‘क्योंकि’ इसका स्वाभाविक कारणसूचक अनुवाद है।
- source_word: עָזְבוּ
  choice: त्याग दिया
  rationale: यह वाचा के प्रति निष्ठाहीन होकर उसे छोड़ देने का भाव स्पष्ट और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: בְּרִית
  choice: वाचा
  rationale: यहाँ यह याहवे और उसकी प्रजा के बीच स्थापित वाचा-संबंध को दर्शाता है; ‘वाचा’ मानक बाइबलीय हिन्दी शब्द है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में रखा गया है।
- source_word: אֱלֹהֵיהֶם
  choice: अपने परमेश्वर
  rationale: सर्वनाम का संबंध वाक्य के कर्ता से है और वाचा-सूत्र में यह इस्राएल के एकमात्र परमेश्वर को सूचित करता है।
- source_word: וַיִּשְׁתַּחֲווּ
  choice: दण्डवत् किया
  rationale: यह झुककर प्रणाम करने की शारीरिक क्रिया को सुरक्षित रखता है, जबकि प्रसंग और अगली क्रिया उसके मूर्तिपूजक आराधना-संबंधी अर्थ को स्पष्ट करते हैं।
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: दूसरे देवताओं के आगे
  rationale: यह उन देवताओं को दण्डवत् करने का स्वाभाविक हिन्दी प्रयोग है और इब्रानी संबंध को स्पष्ट करता है।
- source_word: וַיַּעַבְדוּם
  choice: और उनकी सेवा की
  rationale: ‘सेवा की’ पिछली क्रिया से शब्दगत भेद बनाए रखते हुए देवताओं के प्रति धार्मिक भक्ति और आराधना का भाव व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे प्रयुक्त है; ‘याहवे’ उसे उपाधि से बदले बिना प्रस्तुत करता है।
- issue: झुकने और सेवा करने वाली दो क्रियाओं का संबंध
  choice: दोनों क्रियाओं को अलग रखते हुए संयुक्त मूर्तिपूजक आराधना का भाव
  alternative: दोनों को मिलाकर केवल ‘पूजा की’
  rationale: अलग अनुवाद मूल की शब्दगत बनावट और शारीरिक दण्डवत् तथा धार्मिक सेवा—दोनों पहलुओं को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण वाक्य रखा गया है। ‘वाचा’ और ‘दण्डवत्’ बाइबलीय प्रसंग में परिचित हैं, फिर भी सामान्य पाठक के लिए अर्थगम्य हैं।
