source:
  edition: WLC
  text: וְ/עָֽבְרוּ֙ גּוֹיִ֣ם רַבִּ֔ים עַ֖ל הָ/עִ֣יר הַ/זֹּ֑את וְ/אָֽמְרוּ֙ אִ֣ישׁ אֶל רֵעֵ֔/הוּ עַל מֶ֨ה עָשָׂ֤ה יְהוָה֙ כָּ֔כָה לָ/עִ֥יר הַ/גְּדוֹלָ֖ה הַ/זֹּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/008.yaml
  text: And many nations will pass by this city[a], and each man will say to his neighbor[b], ‘Why has Yahweh done thus to this great city?’
translation:
  language: hi
  text: और बहुत-से राष्ट्र इस नगर के पास से गुजरेंगे[a], और हर आदमी अपने साथी से कहेगा[b], “याहवे ने इस महान नगर के साथ ऐसा क्यों किया?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस नगर के आगे से गुजरेंगे।” हिब्रू पूर्वसर्ग यहाँ नगर के पास से या उसके आगे से जाने का भाव दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “एक पुरुष अपने साथी से”; यह व्यक्तियों के आपस में बात करने का वितरणात्मक हिब्रू मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבְרוּ ... עַל הָעִיר הַזֹּאת
  choice: इस नगर के पास से होकर जाएँगी
  rationale: עבר के साथ עַל यहाँ नगर के पास से या उसके आगे निकलने की गति व्यक्त करता है; यह अनुवाद नगर के भीतर से होकर जाने का अर्थ थोपे बिना स्वाभाविक हिन्दी देता है।
- source_word: גּוֹיִם רַבִּים
  choice: बहुत-सी जातियाँ
  rationale: यह राजनीतिक-सामूहिक अर्थ में अनेक राष्ट्रों/जातियों को दर्शाता है; ‘गैर-यहूदी’ जैसा बाद का धार्मिक भेद यहाँ उचित नहीं।
- source_word: אִישׁ אֶל־רֵעֵהוּ
  choice: हर एक अपने साथी से
  rationale: यह हिब्रू का वितरणात्मक मुहावरा है, जिसका आशय व्यक्तियों का आपस में बात करना है। ‘हर एक’ अर्थ को स्पष्ट रखता है और हिन्दी में अनावश्यक रूप से केवल पुरुषों तक सीमित नहीं करता।
- source_word: עַל־מֶה
  choice: क्यों
  rationale: कारण पूछने वाले हिब्रू वाक्यांश का सहज और सटीक हिन्दी रूप।
- source_word: עָשָׂה יְהוָה כָּכָה
  choice: याहवे ने ... ऐसा क्यों किया
  rationale: כָּכָה का ‘ऐसा’ स्वाभाविक हिन्दी है और देखी हुई नगर-दशा के कारण पर प्रश्न की गंभीरता बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में आए परमेश्वर के विशिष्ट नाम को उपाधि से प्रतिस्थापित करने के बजाय नाम के रूप में सुरक्षित रखा गया है।
- source_word: לָעִיר הַגְּדוֹלָה הַזֹּאת
  choice: इस महान नगर के साथ
  rationale: गָּדוֹל केवल भौतिक आकार नहीं, नगर की महत्ता भी व्यक्त कर सकता है; हिन्दी में किसी के साथ ‘ऐसा करना’ स्वाभाविक प्रयोग है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल में चार-अक्षरीय विशिष्ट नाम प्रत्यक्ष है; ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और नाम तथा उपाधि के अंतर को बनाए रखता है।
- issue: אִישׁ אֶל־רֵעֵהוּ का लिंग और वितरणात्मक अर्थ
  choice: हर एक अपने साथी से
  alternative: हर पुरुष अपने पड़ोसी से
  rationale: वाक्यांश व्याकरणतः पुल्लिंग एकवचन में है, पर हिब्रू में यह पारस्परिक/वितरणात्मक मुहावरा है। चुना हुआ रूप उसके सामान्य मानवीय संदर्भ को व्यक्त करता है, जबकि ‘साथी’ רֵעַ की व्यापकता बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘महान नगर’ भविष्यद्वाणी की गंभीरता बनाए रखता है; उद्धरण में सहज हिन्दी प्रश्न-विन्यास अपनाया गया है।
