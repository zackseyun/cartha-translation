base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/028.yaml
  text: Is this man Coniah a despised[a], broken vessel[b], or a vessel in which there is no delight? Why have he and his offspring been hurled out and cast into a land that they did not know?
translation:
  language: hi
  text: क्या यह मनुष्य, कोन्याह, तुच्छ समझा हुआ, चकनाचूर मिट्टी का बर्तन[a] है, या ऐसा पात्र है जिसमें किसी की रुचि न हो? क्यों उसे और उसके वंश को बाहर फेंक दिया गया और ऐसे देश में डाल दिया गया जिसे वे नहीं जानते थे?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुच्छ समझी गई, चकनाचूर मूर्ति/प्रतिमा।” इब्रानी शब्द किसी गढ़ी हुई वस्तु, विशेषकर मूर्ति या प्रतिमा, के लिए प्रयुक्त हो सकता है। परन्तु आगे आए “पात्र” के समानांतर होने के कारण यहाँ मिट्टी के बर्तन का बिंब भी संभव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֶצֶב
  choice: वस्तु
  rationale: यह शब्द मनुष्य के हाथ से गढ़ी हुई वस्तु, प्रतिमा या मूर्ति को सूचित कर सकता है। अगले 'पात्र' के साथ इसका संबंध टूटकर फेंकी जाने वाली गढ़ी हुई वस्तु का चित्र प्रस्तुत करता है; इसलिए मुख्य पाठ में व्यापक 'वस्तु' रखा गया है और वैकल्पिक अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: נִבְזֶה נָפוּץ
  choice: तुच्छ समझी गई, चकनाचूर
  rationale: पहला शब्द अपमान और अस्वीकृति का कर्मवाच्य भाव रखता है; दूसरा इस प्रसंग में किसी ठोस वस्तु के टूट जाने को सूचित करता है।
- source_word: כָּנְיָהוּ
  choice: कोन्याह
  rationale: यहाँ उपस्थित संक्षिप्त इब्रानी नामरूप का लिप्यंतरण किया गया है।
- source_word: אִם
  choice: या
  rationale: आलंकारिक प्रश्न में यह दूसरी वैकल्पिक तुलना प्रस्तुत करता है।
- source_word: כְּלִי אֵין חֵפֶץ בּוֹ
  choice: ऐसा पात्र जिससे किसी को प्रसन्नता नहीं
  rationale: यह अनचाहे या बेकार पात्र का अर्थ थोपे बिना חֵפֶץ के प्रसन्नता/रुचि के भाव को स्वाभाविक हिन्दी में रखता है।
- source_word: הוּטֲלוּ ... וְהֻשְׁלְכוּ
  choice: उठाकर फेंक दिया गया ... डाल दिया गया
  rationale: दोनों कर्मवाच्य क्रियाओं में बलपूर्वक निष्कासन और फेंके जाने की पुनरुक्त तीव्रता बनी रहती है।
- source_word: זַרְעוֹ
  choice: उसके वंश
  rationale: यहाँ 'बीज' का रूपक जैविक संतान और वंशजों को सूचित करता है; 'वंश' हिन्दी में स्वाभाविक और सामूहिक है।
- source_word: עַל הָאָרֶץ אֲשֶׁר לֹא יָדָעוּ
  choice: ऐसे देश में ... जिसे वे नहीं जानते थे
  rationale: फेंके जाने की दिशा निर्वासन के गंतव्य देश की ओर है; बहुवचन क्रिया के अनुरूप 'वे' को स्पष्ट रखा गया है।
