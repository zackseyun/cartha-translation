base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/011.yaml
  text: 'For thus says Yahweh concerning Shallum son of Josiah[a], king of Judah, who reigned in place of Josiah his father, who went out from this place: He shall never return there again.'
translation:
  language: hi
  text: 'क्योंकि याहवे यहूदा के राजा शल्लूम[a], जो योशिय्याह का पुत्र था और जिसने अपने पिता योशिय्याह के स्थान पर राज किया तथा इस स्थान से चला गया, के विषय में यों कहता है: “वह फिर कभी वहाँ नहीं लौटेगा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शल्लूम से”; इब्रानी पूर्वसर्ग का अधिक शाब्दिक अर्थ प्रत्यक्ष संबोधन हो सकता है, पर यहाँ संभवतः वह भविष्यवाणी के विषय का परिचय देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי כֹה אָמַר
  choice: क्योंकि ... यों कहता है
  rationale: כִּי पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; כֹה אָמַר मानक नबूवतीय संदेश-सूत्र है। वर्तमानकालीन हिंदी अभिव्यक्ति स्वाभाविक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिंदी में उसके प्रचलित विद्वत्तापूर्ण उच्चारण का लिप्यंतरण किया गया है।
- source_word: אֶל
  choice: के विषय में
  rationale: यद्यपि אֶל का सामान्य अर्थ ‘से/की ओर’ है, यहाँ यह आने वाली राजकीय भविष्यवाणी के विषय का परिचय देता प्रतीत होता है; वास्तविक व्याकरणिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: שַׁלֻּם בֶּן יֹאשִׁיָּהוּ מֶלֶךְ יְהוּדָה
  choice: यहूदा के राजा योशिय्याह के पुत्र शल्लूम
  rationale: नाम, वंश-संबंध और राजकीय पहचान को स्रोत के अनुसार बनाए रखते हुए स्वाभाविक हिंदी शब्दक्रम अपनाया गया है।
- source_word: הַמֹּלֵךְ תַּחַת יֹאשִׁיָּהוּ אָבִיו
  choice: जो अपने पिता योशिय्याह के स्थान पर राज्य करता था
  rationale: सकर्मक कृदंत और תַּחַת राजकीय उत्तराधिकार तथा किसी के स्थान पर शासन करने का भाव देते हैं।
- source_word: אֲשֶׁר יָצָא מִן הַמָּקוֹם הַזֶּה
  choice: और इस स्थान से चला गया
  rationale: יָצָא का निर्गमन/प्रस्थान का भाव सरल आधुनिक हिंदी में व्यक्त किया गया है; ‘इस स्थान’ का संकेत जानबूझकर अनिर्दिष्ट रखा गया है।
- source_word: לֹא יָשׁוּב שָׁם עוֹד
  choice: वह फिर कभी वहाँ नहीं लौटेगा
  rationale: नकारात्मक अपूर्ण क्रिया और עוֹד स्थायी गैर-वापसी पर बल देते हैं; ‘वहाँ’ שָׁם के स्थान-संकेत को सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम है। ‘याहवे’ उसे किसी उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: אֶל द्वारा शल्लूम का संबंध
  choice: शल्लूम के विषय में
  alternative: शल्लूम से
  rationale: संदर्भ में शल्लूम स्वयं उपस्थित श्रोता की अपेक्षा भविष्यवाणी का विषय अधिक प्रतीत होता है, फिर भी प्रत्यक्ष संबोधन की व्याकरणिक संभावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। राजकीय और नबूवतीय शैली को बनाए रखते हुए अनावश्यक पुरातन शब्दावली से बचा गया है।
