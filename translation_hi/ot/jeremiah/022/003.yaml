  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה עֲשׂ֤וּ מִשְׁפָּט֙ וּ/צְדָקָ֔ה וְ/הַצִּ֥ילוּ גָז֖וּל מִ/יַּ֣ד עָשׁ֑וֹק וְ/גֵר֩ יָת֨וֹם וְ/אַלְמָנָ֤ה אַל תֹּנוּ֙ אַל תַּחְמֹ֔סוּ וְ/דָ֣ם נָקִ֔י אַֽל תִּשְׁפְּכ֖וּ בַּ/מָּק֥וֹם הַ/זֶּֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/003.yaml
  text: 'Thus says Yahweh: Do justice and righteousness[a], and deliver the robbed person from the hand of the oppressor. Do not oppress the resident foreigner, the fatherless, or the widow, and do not do violence[c][b], and do not shed innocent blood in this place.'
translation:
  language: hi
  text: 'याहवे यों कहता है: “न्याय और धार्मिकता से काम करो[a]। लूटे गए व्यक्ति को अत्याचारी के हाथ से छुड़ाओ। परदेशी[b], अनाथ और विधवा को न सताओ और न उनके साथ हिंसा करो[c]। इस स्थान पर निर्दोष का खून न बहाओ।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो न्यायपूर्ण और सही है, वह करो।” इब्रानी में ‘न्याय’ और ‘धार्मिकता’ के लिए दो शब्द हैं, जो साथ मिलकर सार्वजनिक और नैतिक जीवन में सही आचरण व्यक्त करते हैं।
    reason: lexical_alternative
  - marker: b
    text: “परदेशी” उस गैर-इस्राएली व्यक्ति के लिए है जो इस्राएलियों के बीच रहता था और प्रायः सामाजिक रूप से असुरक्षित होता था।
    reason: cultural_note
  - marker: c
    text: या, “परदेशी, अनाथ और विधवा पर अत्याचार या हिंसा न करो।” यहाँ दो इब्रानी क्रियाएँ शोषक दुर्व्यवहार और हिंसक या क्रूर अन्याय का बोध कराती हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: याहवे यों कहता है
  rationale: यह नबी का मानक संदेश-सूत्र है। परमेश्वर के विशिष्ट वाचा-नाम יְהוָה को ‘याहवे’ के रूप में रखा गया है।
- source_word: עֲשׂוּ מִשְׁפָּט וּצְדָקָה
  choice: न्याय और धार्मिकता के काम करो
  rationale: दोनों समन्वित नैतिक शब्दों का भेद बनाए रखते हुए ‘के काम’ जोड़ने से हिन्दी में स्वाभाविक क्रियात्मक अर्थ स्पष्ट होता है।
- source_word: וְהַצִּילוּ גָזוּל
  choice: लूटे गए व्यक्ति को ... छुड़ाओ
  rationale: निष्क्रिय रूप גָזוּל पीड़ित व्यक्ति पर केंद्रित है और हिफ़ील आज्ञा सक्रिय हस्तक्षेप की मांग करती है।
- source_word: מִיַּד עָשׁוֹק
  choice: अत्याचारी के हाथ से
  rationale: ‘हाथ’ को शक्ति या नियंत्रण के सजीव इब्रानी मुहावरे के रूप में सुरक्षित रखा गया है।
- source_word: גֵר
  choice: परदेशी निवासी
  rationale: यह ऐसा गैर-इस्राएली व्यक्ति है जो समुदाय के बीच रहता था और सामाजिक रूप से असुरक्षित हो सकता था; केवल ‘परदेशी’ की अपेक्षा यह अधिक सटीक है।
- source_word: יָתוֹם
  choice: अनाथ
  rationale: आधुनिक हिन्दी में यह सामाजिक संरक्षण से वंचित बालक के लिए सबसे सहज शब्द है, यद्यपि इब्रानी शब्द विशेष रूप से पिता-विहीनता पर बल दे सकता है।
- source_word: אַל תֹּנוּ אַל תַּחְמֹסוּ
  choice: न सताओ और न उनके साथ हिंसा करो
  rationale: 'दोनों निषेध अलग रखे गए हैं: पहला शोषक दुर्व्यवहार और दूसरा हिंसक अन्याय व्यक्त करता है। सर्वनाम से स्पष्ट किया गया है कि दोनों क्रियाएँ पहले गिनाए गए असुरक्षित लोगों से संबंधित हैं।'
- source_word: וְדָם נָקִי אַל תִּשְׁפְּכוּ
  choice: निर्दोष का खून न बहाओ
  rationale: इब्रानी की ठोस अभिव्यक्ति और हत्या के स्पष्ट निषेध को स्वाभाविक हिन्दी में बनाए रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में वाचा का विशिष्ट नाम सीधे आया है; लिप्यंतरण उसे सामान्य उपाधि में बदलने से बचाता है।
- issue: מִשְׁפָּט וּצְדָקָה को एक ही धारणा में मिलाना
  choice: न्याय और धार्मिकता
  alternative: जो न्यायपूर्ण और सही है
  rationale: दो अलग किंतु संबद्ध इब्रानी नैतिक शब्दों को बनाए रखने से पद का भविष्यद्वक्तापरक जोर और अर्थगत तनाव सुरक्षित रहता है।
- issue: दो निषेधों אַל תֹּנוּ और אַל תַּחְמֹסוּ का संबंध
  choice: न सताओ और न उनके साथ हिंसा करो
  alternative: उनके साथ अन्याय या हिंसा न करो
  rationale: दोनों क्रियाओं को एक सामान्य निषेध में विलीन नहीं किया गया; साथ ही निकटवर्ती तीनों असुरक्षित समूहों पर उनका लागू होना स्पष्ट रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। आज्ञार्थक बहुवचन को हिन्दी के सम्मानसूचक या अस्पष्ट रूप के बजाय सीधे सामूहिक आदेश के रूप में व्यक्त किया गया है। ‘धार्मिकता’ बाइबिलीय नैतिक अर्थ को बनाए रखती है, जबकि फुटनोट उसका साधारण हिन्दी विकल्प देता है।
