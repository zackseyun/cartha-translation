base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/026.yaml
  text: And I will hurl you and your mother who gave birth to you into another land[a], where you were not born, and there you will die.
translation:
  language: hi
  text: मैं तुझे और तेरी माँ को, जिसने तुझे जन्म दिया, उठाकर एक अन्य देश में फेंक दूँगा[a], जहाँ तुम दोनों पैदा नहीं हुए थे; और वहीं तुम दोनों मर जाओगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में संबोधन एकवचन ‘तुझे’ से आगे बहुवचन क्रियाओं में बदल जाता है; वहाँ राजा और उसकी माँ, दोनों को साथ संबोधित किया गया है।
    reason: व्याकरणिक संख्या-परिवर्तन को स्पष्ट करना
lexical_decisions:
- source_word: וְהֵטַלְתִּי
  choice: उठाकर ... फेंक दूँगा
  rationale: हिफ़ील रूप बलपूर्वक फेंके जाने का भाव देता है। हिंदी में यह प्रयोग न्याय और जबरन निष्कासन की तीव्रता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֹתְךָ וְאֶת אִמְּךָ
  choice: तुझे और तेरी माँ को
  rationale: दोनों कर्मों को सीधे रखता है और आरंभिक एकवचन संबोधन को बनाए रखता है।
- source_word: אֲשֶׁר יְלָדַתְךָ
  choice: जिसने तुझे जन्म दिया
  rationale: सम्बन्धवाचक उपवाक्य 'माँ' का वर्णन करता है; यह आधुनिक हिंदी में स्पष्ट और स्वाभाविक है।
- source_word: עַל הָאָרֶץ אַחֶרֶת
  choice: एक दूसरे देश में
  rationale: फेंकने की क्रिया और निर्वासन के संदर्भ में עַל गंतव्य का भाव देता है। 'देश' यहाँ किसी अन्य भूभाग में जबरन भेजे जाने को सहज हिंदी में व्यक्त करता है।
- source_word: אֲשֶׁר לֹא יֻלַּדְתֶּם שָׁם
  choice: जहाँ तुम दोनों पैदा नहीं हुए थे
  rationale: इब्रानी क्रिया बहुवचन है और राजा तथा उसकी माँ दोनों को साथ संबोधित करती है; 'तुम दोनों' हिंदी में इस बदलाव को स्पष्ट करता है।
- source_word: וְשָׁם תָּמֽוּתוּ
  choice: और वहीं तुम दोनों मर जाओगे
  rationale: बहुवचन क्रिया दोनों व्यक्तियों के लिए निश्चित भविष्यवाणी को व्यक्त करती है।
