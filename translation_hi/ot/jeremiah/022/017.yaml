source:
  edition: WLC
  text: כִּ֣י אֵ֤ין עֵינֶ֨י/ךָ֙ וְ/לִבְּ/ךָ֔ כִּ֖י אִם עַל בִּצְעֶ֑/ךָ וְ/עַ֤ל דַּֽם הַ/נָּקִי֙ לִ/שְׁפּ֔וֹךְ וְ/עַל הָ/עֹ֥שֶׁק וְ/עַל הַ/מְּרוּצָ֖ה לַ/עֲשֽׂוֹת־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/017.yaml
  text: But your eyes and your heart are set on nothing except your dishonest gain[a], on shedding innocent blood, and on practicing oppression and extortion.
translation:
  language: hi
  text: परन्तु तेरी आँखें और तेरा मन केवल तेरे बेईमानी से कमाए लाभ पर, निर्दोषों का खून बहाने पर, और अत्याचार तथा हिंसा[a] करने पर ही लगे हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘हिंसा’ के लिए प्रयुक्त शब्द दुर्लभ है। इसका अर्थ “जबरन वसूली” या, अधिक व्यापक रूप से, “निर्मम या हिंसक कृत्य” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין ... כִּי אִם
  choice: केवल ... पर ही लगे हैं
  rationale: यह इब्रानी संरचना पूर्णतः एक ही लक्ष्य पर ध्यान लगे होने का भाव देती है; हिन्दी में यह प्रयोग स्वाभाविक रूप से उस विशिष्ट और अनन्य झुकाव को व्यक्त करता है।
- source_word: עֵינֶיךָ וְלִבְּךָ
  choice: तेरी आँखें और तेरा मन
  rationale: ‘आँखें’ का रूपक बनाए रखा गया है। לֵב इच्छा, विचार और संकल्प के केंद्र को दर्शाता है; आधुनिक हिन्दी में इस प्रसंग में ‘मन’ इस व्यापक भाव को ‘हृदय’ से अधिक सहज रूप में व्यक्त करता है।
- source_word: בִּצְעֶךָ
  choice: तेरे बेईमानी के लाभ
  rationale: यह शब्द प्रायः अन्याय या शोषण से प्राप्त लाभ को दर्शाता है। ‘बेईमानी का लाभ’ आर्थिक प्राप्ति और उसकी नैतिक भ्रष्टता, दोनों को स्पष्ट करता है।
- source_word: דַּם הַנָּקִי לִשְׁפּוֹךְ
  choice: निर्दोषों का खून बहाने
  rationale: यह हत्या और निरपराध लोगों के विरुद्ध हिंसा का प्रचलित बाइबलीय मुहावरा है; हिन्दी में ‘खून बहाना’ स्वाभाविक और स्पष्ट है।
- source_word: הָעֹשֶׁק
  choice: अत्याचार
  rationale: यह संज्ञा दमन, शोषण और अन्यायपूर्ण व्यवहार को सूचित करती है; ‘अत्याचार’ सामान्य पाठक के लिए व्यापक और स्पष्ट है।
- source_word: הַמְּרוּצָה
  choice: हिंसा
  rationale: यह दुर्लभ शब्द संभवतः हिंसक या निर्मम कृत्य को दर्शाता है। अर्थ अनिश्चित होने के कारण मुख्य पाठ में व्यापक ‘हिंसा’ चुना गया और वैकल्पिक समझ पाद-टिप्पणी में दी गई है।
- source_word: לַעֲשׂוֹת
  choice: करने
  rationale: यह अंतिम दो संज्ञाओं के साथ उन बुरे कामों को अंजाम देने का भाव देता है; ‘करने’ हिन्दी में सरल और स्वाभाविक है।
theological_decisions:
- issue: עֵינֶיךָ וְלִבְּךָ में मानवीय अंतःकरण का अर्थ
  choice: आँखें और मन
  alternative: आँखें और हृदय
  rationale: पद का आरोप ध्यान, इच्छा और संकल्प पर है, केवल भावना पर नहीं। ‘मन’ आधुनिक हिन्दी में इस दायरे को सहजता से व्यक्त करता है, जबकि आँखों का मूल रूपक ज्यों का त्यों रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सीधी हिन्दी; राजा को संबोधित एकवचन निकट रूप ‘तेरी/तेरा’ मूल इब्रानी के प्रत्यक्ष आरोप की तीव्रता बनाए रखता है। दुर्लभ अंतिम संज्ञा की अनिश्चितता को मुख्य पाठ में व्यापक अर्थ और पाद-टिप्पणी में विकल्प देकर सुरक्षित रखा गया है।
