base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/030.yaml
  text: 'Thus says Yahweh: Write this man down as childless[a], a man who will not prosper in his days; for none of his offspring will prosper[b] to sit on the throne of David and rule again in Judah.'
translation:
  language: hi
  text: 'याहवेह यों कहता है: “इस मनुष्य को निःसंतान[a] के रूप में दर्ज करो—ऐसे पुरुष के रूप में जो अपने जीवनकाल में सफल न होगा; क्योंकि उसके वंश में से कोई भी दाऊद के सिंहासन पर बैठने और यहूदा में फिर से शासन करने में सफल न होगा[b]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या “इस मनुष्य को उत्तराधिकारी-विहीन दर्ज करो।” इब्रानी में “निःसंतान” है, पर अगला खंड दिखाता है कि मुख्य बात राजवंशीय उत्तराधिकार की है: उसके वंश में से कोई दाऊद के सिंहासन पर बैठने और यहूदा में शासन करने में सफल नहीं होगा।'
    reason: lexical_alternative
  - marker: b
    text: अर्थात यह न्यायादेश इस बात पर केंद्रित है कि उसके वंश में से कोई यहूदा में दाऊदी राजा के रूप में सफलतापूर्वक शासन नहीं करेगा।
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: याहवेह
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में सुरक्षित रखा गया है।
- source_word: כִּתְבוּ
  choice: नाम ... लिखो
  rationale: बहुवचन आज्ञार्थक क्रिया का आशय किसी व्यक्ति को आधिकारिक रूप से दर्ज करना है; ‘नाम ... लिखो’ आधुनिक हिन्दी में इस प्रशासनिक भाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עֲרִירִי
  choice: निःसंतान
  rationale: शब्द का सीधा अर्थ सुरक्षित रखा गया है, जबकि अगला खंड स्पष्ट करता है कि प्रसंग में मुख्य बल राजवंशीय उत्तराधिकार पर है।
- source_word: לֹא יִצְלַח בְּיָמָיו
  choice: अपने जीवनकाल में सफल न होगा
  rationale: צלח के सफलता पाने के भाव और בימיו के कालगत अर्थ को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: מִזַּרְעוֹ
  choice: उसके वंश में से
  rationale: זרע सामूहिक रूप से संतान या वंशजों को दर्शाता है; राजवंशीय प्रसंग में ‘वंश’ सहज और सटीक है।
- source_word: אִישׁ יֹשֵׁב עַל כִּסֵּא דָוִד וּמֹשֵׁל עוֹד בִּיהוּדָה
  choice: कोई भी दाऊद के सिंहासन पर बैठने और यहूदा पर फिर से शासन करने में सफल न होगा
  rationale: राजकीय भूमिका के दोनों जुड़े पक्ष—दाऊद के सिंहासन पर बैठना और यहूदा पर शासन करना—सुरक्षित हैं; ‘फिर से’ עוֹד के आगे होने या पुनः होने के भाव को व्यक्त करता है।
theological_decisions:
- issue: ज्ञात वंशजों के होते हुए राजा को ‘निःसंतान’ कहे जाने का अर्थ
  choice: मुख्य पाठ में शाब्दिक ‘निःसंतान’ रखा गया और पादटिप्पणी में राजवंशीय उत्तराधिकारी पर केंद्रित अर्थ बताया गया।
  alternative: मुख्य पाठ में ‘उत्तराधिकारी-विहीन’ लिखना।
  rationale: अगला खंड बताता है कि न्यायादेश का केंद्र जैविक संतान का पूर्ण अभाव नहीं, बल्कि दाऊद के सिंहासन पर सफल उत्तराधिकार का न होना है; अनुवाद मूल शब्द की तीक्ष्णता और संदर्भगत स्पष्टीकरण दोनों बचाता है।
- issue: अंतिम खंड में सफलता और राजत्व का संबंध
  choice: किसी वंशज के दाऊद के सिंहासन पर बैठकर यहूदा पर शासन करने में सफल न होने के रूप में अनुवाद किया गया।
  alternative: बैठने और शासन करने को सफलता से अलग दो स्वतंत्र निषेध मानना।
  rationale: हिब्रू वाक्यरचना में יִצְלַח के साथ राजकीय भूमिका का वर्णन जुड़ा है; इसलिए यह अनुवाद राजवंशीय सफलता के निषेध को सुरक्षित रखता है, बिना सभी अर्थगत तनाव मिटाए।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘यों कहता है’ भविष्यद्वाणी-सूत्र की औपचारिकता बनाए रखता है; ‘जीवनकाल’ शब्दशः ‘उसके दिनों में’ की अपेक्षा अधिक स्वाभाविक हिन्दी है।
