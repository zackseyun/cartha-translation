    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה הָעָם
  choice: ये वे लोग हैं
  rationale: इब्रानी में वाक्यांश व्याकरण की दृष्टि से एकवचन है, पर आगे लोगों की संख्या दी गई है; इसलिए हिन्दी में स्वाभाविक सामूहिक परिचय के रूप में बहुवचन रखा गया है।
- source_word: הֶגְלָה
  choice: निर्वासित किया
  rationale: गלה के हिफ़ील रूप का अर्थ किसी को अपना देश छोड़कर जाने के लिए बाध्य करना है। ‘निर्वासित किया’ बलपूर्वक देश से हटाए जाने के भाव को संक्षेप और स्पष्ट रूप से व्यक्त करता है।
- source_word: נְבוּכַדְרֶאצַּר
  choice: नबूकदनेस्सर
  rationale: बाबुल के राजा के नाम का हिन्दी बाइबलीय परंपरा में प्रचलित रूप।
- source_word: בִּשְׁנַת שֶׁבַע
  choice: उसके शासन के सातवें वर्ष में
  rationale: मूल में शाब्दिक रूप से ‘सातवें वर्ष में’ है। प्रसंग से यह नबूकदनेस्सर के राजकीय वर्ष को सूचित करता है; ‘उसके शासन के’ हिन्दी में संदर्भ स्पष्ट और स्वाभाविक बनाता है।
- source_word: יְהוּדִים
  choice: यहूदा-निवासी
  rationale: इस निर्वासनकालीन ऐतिहासिक संदर्भ में शब्द मुख्यतः यहूदा राज्य या प्रदेश के लोगों को दर्शाता है। यह चयन बाद के अधिक धार्मिक अर्थ वाले ‘यहूदी’ की अपेक्षा भौगोलिक-जातीय संकेत को स्पष्ट रखता है।
- source_word: שְׁלֹשֶׁת אֲלָפִים וְעֶשְׂרִים וּשְׁלֹשָׁה
  choice: 3,023
  rationale: इब्रानी संख्या सीधे ‘तीन हजार, बीस और तीन’ है। सूची-जैसे विवरण में अंकों का प्रयोग अर्थ को बिना बदले पठनीयता बढ़ाता है।
