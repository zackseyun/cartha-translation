reference: Jeremiah 52:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּשְׂרֹ֥ף אֶת בֵּית יְהוָ֖ה וְ/אֶת בֵּ֣ית הַ/מֶּ֑לֶךְ וְ/אֵ֨ת כָּל בָּתֵּ֧י יְרוּשָׁלִַ֛ם וְ/אֶת כָּל בֵּ֥ית הַ/גָּד֖וֹל שָׂרַ֥ף בָּ/אֵֽשׁ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/013.yaml
  text: He burned the house of Yahweh[a], the house of the king, and all the houses of Jerusalem[c][b]; every great house he burned with fire.
translation:
  language: hi
  text: उसने याहवे के भवन[a], राजा के भवन[b] और यरूशलेम के सभी घरों को जला दिया; हर बड़े भवन[c] को उसने आग में जला दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “याहवे का मन्दिर।” इब्रानी में शाब्दिक रूप से “याहवे का भवन” है।
    reason: lexical_alternative
  - marker: b
    text: या “राजमहल।” इब्रानी में शाब्दिक रूप से “राजा का भवन” है।
    reason: lexical_alternative
  - marker: c
    text: या “हर विशाल भवन” अथवा “हर प्रमुख भवन।” इब्रानी शब्द आकार या महत्त्व, दोनों को सूचित कर सकता है।
    reason: lexical_ambiguity
lexical_decisions:
- source_word: וַיִּשְׂרֹף
  choice: उसने ... जला दिया
  rationale: שׂרף के क़ाल वय्यिक्तोल रूप को स्वाभाविक हिन्दी कथन में पूर्ण हुई घटना के रूप में व्यक्त किया गया है; आरम्भिक וַ को अलग से ‘और’ कहना आवश्यक नहीं है।
- source_word: בֵּית יְהוָה
  choice: याहवे के भवन
  rationale: यह इब्रानी पद का निकट अर्थ ‘याहवे का भवन’ सुरक्षित रखता है। ‘मन्दिर’ सन्दर्भानुकूल है, पर अधिक व्याख्यात्मक होने के कारण पादटिप्पणी में दिया गया है।
- source_word: בֵּית הַמֶּלֶךְ
  choice: राजा के भवन
  rationale: शाब्दिक संरचना और בֵּית की पुनरावृत्ति बनाए रखी गई है। आशय राजमहल से है, जिसे पादटिप्पणी में स्पष्ट किया गया है।
- source_word: כָּל בָּתֵּי יְרוּשָׁלִַם
  choice: यरूशलेम के सभी घरों
  rationale: यह नगर में स्थित समस्त घरों को दर्शाता है और इब्रानी सम्बन्धवाचक संरचना को स्वाभाविक हिन्दी में रखता है।
- source_word: כָּל בֵּית הַגָּדוֹל
  choice: हर बड़े भवन
  rationale: כָּל के वितरणात्मक अर्थ और בֵּית הַגָּדוֹל के एकवचन रूप को बनाए रखा गया है। गָּדוֹל आकार या महत्त्व, दोनों का संकेत दे सकता है।
- source_word: שָׂרַף בָּאֵשׁ
  choice: आग में जला दिया
  rationale: मूल पाठ में जलाने की क्रिया के साथ आग का स्पष्ट उल्लेख बल देता है; हिन्दी में ‘आग में जला दिया’ उस बल को बिना अनावश्यक जटिलता के सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला निजी ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसे उपाधि ‘प्रभु’ में बदलने के बजाय नाम के रूप में प्रस्तुत करता है; ‘यहोवा’ प्रचलित वैकल्पिक हिन्दी रूप है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘भवन’ द्वारा आरम्भ और अन्त की इब्रानी शब्द-पुनरावृत्ति आंशिक रूप से सुरक्षित है, जबकि यरूशलेम के सामान्य निवासों के लिए स्वाभाविक ‘घरों’ का प्रयोग किया गया है।
