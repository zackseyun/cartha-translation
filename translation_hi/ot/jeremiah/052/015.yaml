- source_word: יֶתֶר הָאָמֹון
  choice: बाकी कारीगरों को
  rationale: אָמֹון कठिन शब्द है। निर्वासन के प्रसंग और 2 राजा 25:11 के समानांतर विवरण के आधार पर ‘कारीगर’ संभावित अर्थ है, पर वैकल्पिक पाठ पादटिप्पणी में सुरक्षित है।
