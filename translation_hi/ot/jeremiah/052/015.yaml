  yaml_path: translation/ot/jeremiah/052/015.yaml
  text: And some of the poorest of the people[a], and the rest of the people who remained in the city, and the deserters who had defected to the king of Babylon, and the rest of the craftsmen—Nebuzaradan, the captain of the guard[c][b], carried into exile.
translation:
  language: hi
  text: और प्रजा के सबसे गरीब लोगों में से कुछ को, नगर में बचे हुए बाकी लोगों को, और उन लोगों को जो बाबेल के राजा की ओर जा मिले थे,[b] तथा बाकी कारीगरों को[a]—राज-अंगरक्षकों का प्रधान नबूजरदान[c] निर्वासन में ले गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शेष जनसमूह को।” यहाँ का इब्रानी शब्द कठिन है; 2 राजा 25:11 के समानांतर के आलोक में बहुत-से विद्वान इसे कारीगरों या शिल्पकारों के अर्थ में समझते हैं।
