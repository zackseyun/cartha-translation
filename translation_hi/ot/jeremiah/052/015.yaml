- source_word: רַב טַבָּחִים
  choice: अंगरक्षकों का प्रधान
  rationale: पदवी का शाब्दिक रूप ‘वध करने वालों का प्रधान’ है, पर राजकीय संदर्भ में यह अंगरक्षक-दल तथा दंडाधिकारी कार्यों से जुड़ा उच्च अधिकारी था; कार्यात्मक पदनाम अपनाया गया है।
