source:
  edition: WLC
  text: וּ/מִן הָ/עִ֡יר לָקַח֩ סָרִ֨יס אֶחָ֜ד אֲֽשֶׁר הָיָ֥ה פָקִ֣יד עַל אַנְשֵׁ֣י הַ/מִּלְחָמָ֗ה וְ/שִׁבְעָ֨ה אֲנָשִׁ֜ים מֵ/רֹאֵ֤י פְנֵי הַ/מֶּ֨לֶךְ֙ אֲשֶׁ֣ר נִמְצְא֣וּ בָ/עִ֔יר וְ/אֵ֗ת סֹפֵר֙ שַׂ֣ר הַ/צָּבָ֔א הַ/מַּצְבִּ֖א אֶת עַ֣ם הָ/אָ֑רֶץ וְ/שִׁשִּׁ֥ים אִישׁ֙ מֵ/עַ֣ם הָ/אָ֔רֶץ הַֽ/נִּמְצְאִ֖ים בְּ/ת֥וֹךְ הָ/עִֽיר־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/025.yaml
  text: And from the city he took one court official who had been appointed over the men of war[a], and seven men from those who saw the king’s face, who were found in the city, and the scribe of the commander of the army, who mustered the people of the land, and sixty men from the people of the land who were found within the city.
translation:
  language: hi
  text: और नगर में से उसने एक राजदरबारी अधिकारी को पकड़ लिया, जो योद्धाओं पर नियुक्त था; और उन लोगों में से सात जनों को, जो राजा का मुख देखते थे[a] और नगर में पाए गए थे; और सेनापति के लिपिक को, जो देश के लोगों को सेना में भरती करता था; और देश के लोगों में से साठ जनों को, जो नगर के भीतर पाए गए थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “राजा के निजी सेवकों में से।” “राजा का मुख देखना” एक दरबारी मुहावरा है, जिसका अर्थ राजा तक सीधी पहुँच होना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: סָרִיס
  choice: राजदरबारी अधिकारी
  rationale: यह शब्द नपुंसक अथवा व्यापक अर्थ में राजकीय अधिकारी को सूचित कर सकता है। यहाँ पद और दायित्व पर बल है; इसलिए शारीरिक स्थिति का अनावश्यक निष्कर्ष निकाले बिना प्रशासनिक अर्थ रखा गया है।
- source_word: פָקִיד עַל
  choice: पर नियुक्त था
  rationale: यह किसी को अधिकार देकर देखरेख के पद पर रखने का भाव व्यक्त करता है। यह हिन्दी प्रयोग प्रत्यायोजित अधिकार को सहज रूप से बताता है।
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: योद्धाओं
  rationale: शाब्दिक भाव ‘युद्ध के पुरुष’ है। ‘योद्धाओं’ से सैन्य अर्थ संक्षिप्त, स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त होता है।
- source_word: מֵרֹאֵי פְנֵי הַמֶּלֶךְ
  choice: उन लोगों में से, जो राजा का मुख देखते थे
  rationale: मुख्य पाठ में इब्रानी दरबारी मुहावरे की ठोस छवि सुरक्षित रखी गई है। सीधे राजकीय प्रवेश या निजी सेवा का आशय पादटिप्पणी में दिया गया है।
- source_word: סֹפֵר שַׂר הַצָּבָא
  choice: सेनापति का लेखक
  rationale: समास का स्वाभाविक अर्थ सेना के प्रधान से संबद्ध लेखक या सचिव है। ‘लेखक’ मूल पदनाम के निकट रहते हुए हिन्दी पाठक के लिए बोधगम्य है।
- source_word: הַמַּצְבִּא
  choice: सेना में भरती करता था
  rationale: हिफ़ील कृदन्त यहाँ लोगों को सैन्य सेवा के लिए एकत्र या नामांकित करने को सूचित करता है। ‘सेना में भरती करना’ आधुनिक हिन्दी में इस कार्य को स्पष्ट करता है।
- source_word: עַם הָאָרֶץ
  choice: देश के लोग
  rationale: इस पदबंध में सामान्य जनसमुदाय के साथ सामाजिक-राजनीतिक अर्थछाया भी हो सकती है। ‘देश के लोग’ उस व्यापकता को बनाए रखता है और इसे केवल निम्न वर्ग तक सीमित नहीं करता।
- source_word: בְּתוֹךְ הָעִיר
  choice: नगर के भीतर
  rationale: यह नगर की सीमाओं के अंदर पाए जाने पर दिए गए स्थानवाचक बल को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: לָקַח
  choice: पकड़ लिया
  rationale: युद्धोत्तर गिरफ्तारी के इस प्रसंग में केवल ‘ले लिया’ की अपेक्षा ‘पकड़ लिया’ क्रिया के संदर्भगत आशय को अधिक स्वाभाविक रूप से व्यक्त करता है।
