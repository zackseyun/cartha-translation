  text: He spoke kindly to him and set his throne above the thrones of the kings who were with him in Babylon[a].
translation:
  language: hi
  text: उसने उससे कृपापूर्वक बातें कीं और उसका सिंहासन उन राजाओं के सिंहासनों से ऊँचा रखा, जो बाबेल में उसके साथ थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר אִתּוֹ טֹבוֹת
  choice: उसने उससे कृपा से बातें कीं
  rationale: דבר אֶת का अर्थ ‘किसी से बात करना’ है, और טֹבוֹת यहाँ क्रियाविशेषणवत् अनुकूल या भले ढंग से बोलने का भाव देता है। ‘कृपा से बातें कीं’ स्वाभाविक हिन्दी में राजकीय अनुग्रह का भाव बनाए रखता है।
- source_word: וַיִּתֵּן אֶת כִּסְאוֹ
  choice: उसके सिंहासन को ... रखा
  rationale: נתן यहाँ राजकीय आसन को स्थान या पद देने के अर्थ में है। ‘रखा’ ठोस सिंहासन-चित्र को बनाए रखता है और अगले स्थानसूचक वाक्यांश से सहज जुड़ता है।
- source_word: כִּסְאוֹ
  choice: उसके सिंहासन
  rationale: राजाओं और उनकी पद-प्रतिष्ठा के प्रसंग में כִּסֵּא के लिए ‘सिंहासन’ ‘आसन’ की अपेक्षा अधिक सटीक है।
- source_word: מִמַּעַל לְכִסֵּא מְלָכִים
  choice: उन राजाओं के सिंहासनों से ऊँचा
  rationale: यह वाक्यांश अन्य राजाओं से ऊँचे स्थान अथवा पद को व्यक्त करता है। हिन्दी में ‘सिंहासनों से ऊँचा’ स्थान और प्रतिष्ठा दोनों का संकेत सुरक्षित रखता है।
- source_word: אֲשֶׁר אִתּוֹ בְּבָבֶל
  choice: जो बाबेल में उसके साथ थे
  rationale: सम्बन्धवाचक उपवाक्य बाबेल में राजा के साथ उपस्थित अन्य राजाओं की पहचान करता है। ‘बाबेल’ हिब्रू स्थाननाम का निकट रूप है।
