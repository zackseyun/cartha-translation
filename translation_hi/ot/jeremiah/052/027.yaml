  yaml_path: translation/ot/jeremiah/052/027.yaml
  text: And the king of Babylon struck them down and put them to death at Riblah in the land of Hamath[a]. So Judah was taken into exile from its land.
translation:
  language: hi
  text: और बाबेल के राजा ने हमात देश के रिबला में उन पर प्रहार किया और उन्हें मार डाला। इस प्रकार यहूदा को उसकी भूमि से निर्वासन में ले जाया गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּכֶּה אוֹתָם
  choice: उन्हें मार गिराया
  rationale: नכה का हिफ़ईल रूप यहाँ हिंसक दंडात्मक प्रहार बताता है। अगले अलग क्रियापद ‘मरवा डाला’ के साथ क्रम बनाए रखने के लिए इसे केवल ‘मारा’ या उसी में मृत्यु समेट देने के बजाय ‘मार गिराया’ कहा गया है।
- source_word: מֶלֶךְ בָּבֶל
  choice: बाबेल के राजा
  rationale: इब्रानी संबंधसूचक संरचना का स्वाभाविक और प्रचलित हिन्दी रूप।
- source_word: וַיְמִתֵם
  choice: मरवा डाला
  rationale: מות का हिफ़ईल रूप ‘मरने का कारण बनना’ है। ‘मरवा डाला’ राजा द्वारा कराए गए वध की causative शक्ति रखता है, पर औपचारिक न्यायिक प्रक्रिया का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: בְּרִבְלָה בְּאֶרֶץ חֲמָת
  choice: हमात देश के रिबला में
  rationale: दोनों स्थानवाचक पदों को स्पष्ट, स्वाभाविक हिन्दी क्रम में रखा गया है और ‘देश’ द्वारा אֶרֶץ का भौगोलिक अर्थ सुरक्षित है।
- source_word: וַיִּגֶל
  choice: निर्वासन में ले जाया गया
  rationale: גלה यहाँ बलपूर्वक देश-निकाले को सूचित करता है। हिन्दी का कर्मवाच्य मूल सक्रिय रूप से थोड़ा हटता है, किंतु बाबेली निर्वासन की बाध्य प्रकृति और राष्ट्रीय परिणाम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוּדָה
  choice: यहूदा
  rationale: मूल व्यक्तिवाचक नाम को रखा गया है; यह राज्य या उसकी प्रजा के लिए सामूहिक रूप से भी प्रयुक्त हो सकता है।
- source_word: מֵעַל אַדְמָתוֹ
  choice: उसकी भूमि से
  rationale: אַדָמָה का यहाँ राष्ट्रीय-भौगोलिक अर्थ ‘भूमि’ है। पुल्लिंग एकवचन प्रत्यय का हिन्दी में ‘उसकी’ रूप भूमि के स्त्रीलिंग के कारण है; इससे यहूदा की भूमि का संबंध स्वाभाविक रूप से बना रहता है।
theological_decisions:
- issue: מֵעַל אַדְמָתוֹ में यहूदा की ओर संकेत करता पुल्लिंग एकवचन प्रत्यय
  choice: उसकी भूमि से
  alternative: अपनी भूमि से
  rationale: हिन्दी में स्वत्वसूचक रूप स्वामी नहीं, संज्ञा ‘भूमि’ के लिंग के अनुसार ‘उसकी’ होता है। यह मूल के एकवचन संबंध को सुरक्षित रखता है और ‘यहूदा’ को राज्य/लोगों के रूप में समझने की गुंजाइश खुली छोड़ता है।
- issue: וַיִּגֶל में सक्रिय रूप और बलपूर्वक निर्वासन का भाव
  choice: निर्वासन में ले जाया गया
  alternative: निर्वासन में चला गया
  rationale: संदर्भ में यह स्वैच्छिक प्रस्थान नहीं बल्कि बाबेल द्वारा देश-निकाला है। कर्मवाच्य हिन्दी में इस बाध्यता को स्पष्ट करता है, बिना अतिरिक्त धर्मवैज्ञानिक निष्कर्ष जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘बाबेल’, ‘हमात’, ‘रिबला’, ‘यहूदा’ जैसे पारंपरिक बाइबलीय नाम रखे गए हैं। दो इब्रानी क्रियाओं को अलग-अलग ‘मार गिराया’ और ‘मरवा डाला’ से सुरक्षित रखा गया है।
