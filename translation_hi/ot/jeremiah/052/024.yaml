base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/024.yaml
  text: And the captain of the guard took Seraiah the chief priest[a], and Zephaniah the second priest[c][b], and the three keepers of the threshold.
translation:
  language: hi
  text: तब अंगरक्षक-दल के प्रधान ने प्रधान याजक सरायाह[a], दूसरे पद के याजक सपन्याह[b] और देहरी के तीन पहरेदारों[c] को ले लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “महायाजक।” इब्रानी पदवी का शाब्दिक अर्थ “प्रधान/मुख्य याजक” है।
    reason: lexical_alternative
  - marker: b
    text: या, “उप-याजक।” इसका आशय पदक्रम में दूसरे स्थान के याजक से है।
    reason: lexical_alternative
  - marker: c
    text: या, “द्वारपाल।”
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב טַבָּחִים
  choice: अंगरक्षक-दल का प्रधान
  rationale: शब्दशः पद में ‘वध करनेवालों का प्रधान’ जैसा भाव है, पर नव-बेबीलोनी राजकीय संदर्भ में यह शाही अंगरक्षक-दल के अधिकारी का पदनाम है। यह हिन्दी रूप पद और उसके नेतृत्वकारी कार्य—दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וַיִּקַּח
  choice: पकड़ लिया
  rationale: לקח का सामान्य अर्थ ‘लेना’ है, पर यहाँ व्यक्तियों को हिरासत में लेने का प्रसंग है। ‘पकड़ लिया’ उस प्रसंगगत अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: שְׂרָיָה
  choice: सरायाह
  rationale: इब्रानी व्यक्तिगत नाम का हिन्दी लिप्यंतरण।
- source_word: כֹּהֵן הָרֹאשׁ
  choice: प्रधान याजक
  rationale: इब्रानी पदवी का निकट अर्थ ‘मुख्य/प्रधान याजक’ है। यह रूप मूल शब्दावली को पारदर्शी रखता है; प्रचलित वैकल्पिक पदवी ‘महायाजक’ को पादटिप्पणी में रखा गया है।
- source_word: צְפַנְיָה
  choice: सपन्याह
  rationale: इब्रानी व्यक्तिगत नाम का हिन्दी में प्रचलित और उच्चारण-सुलभ लिप्यंतरण।
- source_word: כֹּהֵן הַמִּשְׁנֶה
  choice: दूसरे पद का याजक
  rationale: מִשְׁנֶה दूसरे क्रम अथवा प्रतिनिधि पद को दर्शाता है। यह अनुवाद पदक्रम स्पष्ट करता है, पर उसे किसी अधिक विशिष्ट संस्थागत पदवी में नहीं बदलता।
- source_word: שְׁלֹשֶׁת
  choice: तीन
  rationale: आगे आनेवाले पदनाम के साथ संख्या का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: שֹׁמְרֵי הַסַּף
  choice: देहरी के पहरेदार
  rationale: यह मूल के ‘देहरी की रखवाली करनेवाले’ ठोस चित्र और आधिकारिक कार्य दोनों को बनाए रखता है। ‘द्वारपाल’ अधिक संक्षिप्त वैकल्पिक अर्थ है।
theological_decisions:
- issue: כֹּהֵן הָרֹאשׁ को तकनीकी पदवी के रूप में व्यक्त करना
  choice: प्रधान याजक
  alternative: महायाजक
  rationale: मूल में ‘याजक’ के साथ ‘प्रधान/मुख्य’ (רֹאשׁ) है। इसलिए मुख्य पाठ में निकट शब्दार्थ रखा गया है और प्रचलित तकनीकी पदवी को विकल्प के रूप में दिया गया है, ताकि पद की पहचान और मूल की शब्दावली दोनों सुरक्षित रहें।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, कथात्मक और गरिमापूर्ण शैली रखी गई है। राजकीय पद को स्पष्ट करने के लिए ‘अंगरक्षक-दल’ और मंदिर-संबंधी भूमिका के ठोस इब्रानी बिंब को बनाए रखने के लिए ‘देहरी के पहरेदार’ चुना गया है। सभी वैकल्पिक पदनाम पादटिप्पणियों में दिए गए हैं।
