base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/009.yaml
  text: They captured the king and brought him up to the king of Babylon at Riblah in the land of Hamath[a], and he passed sentence on him.
translation:
  language: hi
  text: उन्होंने राजा को पकड़ लिया और उसे हमात देश के रिबला में बाबेल के राजा के पास ले गए। तब बाबेल के राजा ने उसके विषय में न्यायिक निर्णय सुनाए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “उसके साथ/उससे न्याय के निर्णय बोले”; यह न्यायिक निर्णय सुनाने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפְּשׂוּ אֶת־הַמֶּלֶךְ
  choice: उन्होंने राजा को पकड़ लिया
  rationale: תפשׂ यहाँ युद्ध के प्रसंग में किसी को अपने अधिकार में कर लेने को दर्शाता है। ‘पकड़ लिया’ आधुनिक हिन्दी में स्वाभाविक है और बिना अनावश्यक विस्तार के गिरफ्तारी का भाव देता है।
- source_word: וַיַּעֲלוּ אֹתוֹ אֶל־מֶלֶךְ בָּבֶל
  choice: उसे बाबेल के राजा के पास ले गए
  rationale: עלה का मूल दिशात्मक भाव ‘ऊपर ले जाना’ है, पर हिन्दी में यहाँ ‘ऊपर’ भ्रामक और अस्वाभाविक होगा। ‘ले गए’ गन्तव्य तक पहुँचाने का आशय स्पष्ट रखता है।
- source_word: רִבְלָתָה בְּאֶרֶץ חֲמָת
  choice: हमात देश के रिबला में
  rationale: स्थानवाचक प्रत्यय को ‘में’ से व्यक्त किया गया है। רִבְלָה और חֲמָת का रूपान्तरण क्रमशः ‘रिबला’ और ‘हमात’ रखा गया है; אֶרֶץ को यहाँ भौगोलिक क्षेत्र के सामान्य नाम ‘देश’ से व्यक्त किया गया है।
- source_word: וַיְדַבֵּר אִתּוֹ מִשְׁפָּטִים
  choice: उसके विरुद्ध दण्डादेश सुनाया
  rationale: शाब्दिक रूप ‘उसके साथ/उससे न्याय-निर्णय बोले’ है, जो न्यायिक मुहावरा है। प्रसंग में बाबेल का राजा अभियुक्त राजा को दण्ड देने का निर्णय सुनाता है; ‘दण्डादेश सुनाया’ हिन्दी में स्पष्ट और स्वाभाविक न्यायिक अभिव्यक्ति है।
theological_decisions:
- issue: दण्डादेश देने वाले कर्ता की पहचान
  choice: बाबेल के राजा ने
  alternative: उसने
  rationale: इब्रानी क्रिया का एकवचन कर्ता निकटतम पुरुषवाचक संज्ञा ‘बाबेल का राजा’ है। नाम को दोहराने से हिन्दी में सर्वनाम की सम्भावित अस्पष्टता दूर होती है; कोई अतिरिक्त धार्मिक व्याख्या नहीं जोड़ी जाती।
- issue: מִשְׁפָּטִים के बहुवचन का हिन्दी रूप
  choice: एकवचन भाववाचक ‘दण्डादेश’
  alternative: ‘न्याय के निर्णय सुनाए’
  rationale: इब्रानी बहुवचन न्यायिक निर्णयों या दण्ड-विधानों को संकेत कर सकता है, पर हिन्दी न्यायिक मुहावरे में समूची सजा के औपचारिक उच्चारण के लिए ‘दण्डादेश सुनाया’ अधिक स्वाभाविक है। शाब्दिक बहुवचन को पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सरल किन्तु गरिमापूर्ण रखी गई है। ‘दण्डादेश’ न्यायिक प्रसंग के लिए सटीक है। स्थान-नामों के लिए ‘बाबेल’, ‘रिबला’ और ‘हमात’ रूप अपनाए गए हैं।
