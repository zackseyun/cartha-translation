source:
  edition: WLC
  text: וַ/יְהִי֩ בִ/שְׁלֹשִׁ֨ים וָ/שֶׁ֜בַע שָׁנָ֗ה לְ/גָלוּת֙ יְהוֹיָכִ֣ן מֶֽלֶךְ יְהוּדָ֔ה בִּ/שְׁנֵ֤ים עָשָׂר֙ חֹ֔דֶשׁ בְּ/עֶשְׂרִ֥ים וַ/חֲמִשָּׁ֖ה לַ/חֹ֑דֶשׁ נָשָׂ֡א אֱוִ֣יל מְרֹדַךְ֩ מֶ֨לֶךְ בָּבֶ֜ל בִּ/שְׁנַ֣ת מַלְכֻת֗/וֹ אֶת רֹאשׁ֙ יְהוֹיָכִ֣ין מֶֽלֶךְ יְהוּדָ֔ה וַ/יֹּצֵ֥א אוֹת֖/וֹ מִ/בֵּ֥ית ה/כליא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/031.yaml
  text: And it happened in the thirty-seventh year of the exile of Jehoiachin king of Judah[a], in the twelfth month, on the twenty-fifth day of the month, that Evil-merodach king of Babylon, in the first year of his reign[b], lifted up the head of Jehoiachin king of Judah and brought him out from the prison.
translation:
  language: hi
  text: यहूदा के राजा यहोयाकीन के निर्वासन के सैंतीसवें वर्ष में, बारहवें महीने के पच्चीसवें दिन, बाबेल के राजा एवील-मरोदक[a] ने अपने राज्य के पहले वर्ष में यहूदा के राजा यहोयाकीन का सिर ऊँचा किया[b] और उसे बंदीगृह से बाहर निकाला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: एवील-मरोदक का ऐतिहासिक अक्कादी नाम अमेल-मर्दुक भी लिखा जाता है।
    reason: alternative_reading
  - marker: b
    text: यह एक हिब्रू मुहावरा है, जिसका अर्थ है कि उसने यहोयाकीन पर कृपा की और उसका सम्मान बढ़ाया।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: …के वर्ष में…
  rationale: हिब्रू का कथात्मक आरंभ हिंदी वाक्य में काल-सूचक संरचना से स्वाभाविक रूप में व्यक्त किया गया है; अलग से ‘और ऐसा हुआ’ जोड़ना अनावश्यक और भारी होता।
- source_word: לְגָלוּת
  choice: निर्वासन
  rationale: यह शब्द देश से निकाले जाने के बाद की अवस्था और अवधि को दर्शाता है; ‘निर्वासन’ आधुनिक मानक हिंदी में स्पष्ट है।
- source_word: יְהוֹיָכִין
  choice: यहोयाकीन
  rationale: हिब्रू व्यक्तिगत नाम का प्रचलित हिंदी बाइबलीय लिप्यंतरण।
- source_word: בִּשְׁנֵים עָשָׂר חֹדֶשׁ בְּעֶשְׂרִים וַחֲמִשָּׁה לַחֹדֶשׁ
  choice: बारहवें महीने के पच्चीसवें दिन
  rationale: हिब्रू तिथि-सूत्र का स्पष्ट और स्वाभाविक हिंदी रूप।
- source_word: אֱוִיל מְרֹדַךְ
  choice: एवील-मरोदक
  rationale: नाम का हिब्रू रूप लिप्यंतरित किया गया है; ऐतिहासिक अक्कादी रूप पादटिप्पणी में दिया गया है।
- source_word: בִּשְׁנַת מַלְכֻתוֹ
  choice: अपने राज्य के पहले वर्ष में
  rationale: यह पद उसके राजारोहण/प्रथम राज्य-वर्ष को सूचित करता है, जैसा समानांतर पाठ 2 राजा 25:27 भी स्पष्ट करता है।
- source_word: נָשָׂא אֶת רֹאשׁ
  choice: का सिर ऊँचा किया
  rationale: हिब्रू मुहावरे को मुख्य पाठ में पारदर्शी और हिंदी में बोधगम्य रूप से रखा गया है; उसका आशय पादटिप्पणी में स्पष्ट है।
- source_word: וַיֹּצֵא אוֹתוֹ מִבֵּית הַכְּלִיא
  choice: और उसे बंदीगृह से बाहर निकाला
  rationale: हिफ़ील क्रिया का प्रत्यक्ष अर्थ ‘बाहर निकालना’ है; यह रिहाई का संकेत देता है, पर मुख्य पाठ स्रोत की क्रियात्मक अभिव्यक्ति बनाए रखता है।
