  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। तिथि-सूत्र को स्वाभाविक हिंदी क्रम में रखा गया है और ‘सिर ऊँचा किया’ मुहावरे को स्रोत-पारदर्शिता के लिए बनाए रखते हुए पादटिप्पणी में समझाया गया है।
