  text: וְ/אֶת עַמּוּדֵ֨י הַ/נְּחֹ֜שֶׁת אֲשֶׁ֣ר לְ/בֵית יְהוָ֗ה וְֽ/אֶת הַ/מְּכֹנ֞וֹת וְ/אֶת יָ֧ם הַ/נְּחֹ֛שֶׁת אֲשֶׁ֥ר בְּ/בֵית יְהוָ֖ה שִׁבְּר֣וּ כַשְׂדִּ֑ים וַ/יִּשְׂא֥וּ אֶת כָּל נְחֻשְׁתָּ֖/ם בָּבֶֽלָ/ה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/017.yaml
  text: And the Chaldeans broke in pieces the bronze pillars that were in the house of Yahweh[a], and the stands, and the bronze Sea that was in the house of Yahweh[b], and carried all their bronze to Babylon.
translation:
  language: hi
  text: कसदियों[b] ने याहवे के भवन के काँसे के खंभों और आधारों[a] को, और काँसे के उस सागर को भी, जो याहवे के भवन में था, टुकड़े-टुकड़े कर दिया और उन वस्तुओं का सारा काँसा बाबेल ले गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ये मंदिर के पात्रों को थामने वाले पहिएदार आधार थे; अनुवाद ‘चौकियाँ’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘कसदी’ यहाँ बाबेली सेना के लोगों के लिए प्रयुक्त नाम है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמּוּדֵי הַנְּחֹשֶׁת
  choice: काँसे के खंभों
  rationale: मंदिर की साज-सज्जा के संदर्भ में נְחֹשֶׁת के लिए ‘काँसा’ और עַמּוּדִים के लिए सहज आधुनिक शब्द ‘खंभे’ उपयुक्त हैं।
- source_word: אֲשֶׁר לְבֵית יְהוָה
  choice: याहवे के भवन के
  rationale: לְ यहाँ केवल स्थान नहीं, बल्कि संबंध या स्वामित्व बताता है। संक्षिप्त हिन्दी पदबंध स्रोत में आगे आने वाले בְּבֵית (‘भवन में’) से भेद बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चतुरक्षरीय ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिन्दी में उसके प्रचलित लिप्यंतरण से प्रस्तुत किया गया है।
- source_word: הַמְּכֹנוֹת
  choice: आधारों
  rationale: यह मंदिर के पात्रों को थामने वाले चल आधारों के लिए प्रयुक्त शब्द है। ‘आधार’ आधुनिक पाठक के लिए स्पष्ट है; पादटिप्पणी में उनकी पहिएदार बनावट बताई गई है।
- source_word: יָם הַנְּחֹשֶׁת
  choice: काँसे के उस सागर
  rationale: ‘सागर’ मंदिर के विशाल काँसे के जल-पात्र का पारंपरिक वस्तु-नाम है; ‘उस’ से यह स्पष्ट होता है कि किसी प्राकृतिक समुद्र की बात नहीं हो रही।
- source_word: אֲשֶׁר בְּבֵית יְהוָה
  choice: जो याहवे के भवन में था
  rationale: इब्रानी में निकटतम पूर्वपद ‘काँसे का सागर’ एकवचन है; इसलिए एकवचन संबंधवाचक वाक्यांश रखा गया और בְּ का स्थानवाचक अर्थ स्पष्ट किया गया।
- source_word: שִׁבְּרוּ
  choice: टुकड़े-टुकड़े कर दिया
  rationale: यह बड़े काँसे के सामान को ढुलाई योग्य टुकड़ों में तोड़ने की क्रिया व्यक्त करता है।
- source_word: כַשְׂדִּים
  choice: कसदियों
  rationale: ‘बाबेलियों’ कहकर सामान्यीकृत करने के बजाय स्रोत का ऐतिहासिक जातिनाम सुरक्षित रखा गया है।
- source_word: וַיִּשְׂאוּ
  choice: ले गए
  rationale: संदर्भ में क्रिया लूट के धातु को उठाकर बाबेल पहुँचाने का भाव देती है; ‘ले गए’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: כָּל נְחֻשְׁתָּם
  choice: उनका सारा काँसा
  rationale: बहुवचन प्रत्यय पहले गिनाई गई वस्तुओं की ओर लौटता है; हिन्दी में यही संक्षिप्त और स्वाभाविक रूप है।
- source_word: בָּבֶלָה
  choice: बाबेल
  rationale: दिशासूचक प्रत्यय गति को बाबेल की ओर बताता है; ‘ले गए’ के साथ हिन्दी में अलग ‘को’ आवश्यक नहीं है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उस नाम को बनाए रखता है और उसे किसी उपाधि से नहीं बदलता।
- issue: אֲשֶׁר בְּבֵית יְהוָה संबंधवाचक उपवाक्य का दायरा
  choice: इसे निकटतम एकवचन ‘काँसे के सागर’ से जोड़ा गया
  alternative: इसे खंभों, आधारों और सागर—पूरी सूची—से जोड़ना
  rationale: इब्रानी में संबंधवाचक उपवाक्य सीधे एकवचन ‘सागर’ के बाद आता है और व्याकरणिक रूप से एकवचन पाठ स्वाभाविक है; व्यापक दायरा संभव होने पर भी उसे चुपचाप आरोपित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सुबोध रखी गई है। ‘याहवे’, ‘कसदी’, ‘बाबेल’ और मंदिर-वस्तु के नाम ‘सागर’ से मूल पाठ का ऐतिहासिक तथा धार्मिक रंग सुरक्षित है; पादटिप्पणियाँ संभावित अपरिचित शब्दों को संक्षेप में स्पष्ट करती हैं।
