source:
  edition: WLC
  text: וְ/אֶת הַ֠/סִּפִּים וְ/אֶת הַ/מַּחְתּ֨וֹת וְ/אֶת הַ/מִּזְרָק֜וֹת וְ/אֶת הַ/סִּיר֣וֹת וְ/אֶת הַ/מְּנֹר֗וֹת וְ/אֶת הַ/כַּפּוֹת֙ וְ/אֶת הַ/מְּנַקִי֔וֹת אֲשֶׁ֤ר זָהָב֙ זָהָ֔ב וַ/אֲשֶׁר כֶּ֖סֶף כָּ֑סֶף לָקַ֖ח רַב טַבָּחִֽים־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/019.yaml
  text: And the bowls[a], the firepans, the basins, the pots, the lampstands, the cups, and the vessels for pouring—whatever was gold, gold, and whatever was silver[d][c][b], silver—the captain of the guard took.
translation:
  language: hi
  text: और कटोरे[a], अंगारदान[b], छिड़काव के पात्र, हाँड़ियाँ, दीपदान, प्याले और उँडेलने के पात्र—जो सोने के थे, सोने के, और जो चाँदी के थे, चाँदी के[c]—अंगरक्षकों का प्रधान[d] उठा ले गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “प्याले”; इस सूची में मन्दिर के कई प्रकार के पात्रों के बीच ठीक-ठीक भेद अनिश्चित है।
    reason: lexical_alternative
  - marker: b
    text: या “धूपदान।”
    reason: lexical_alternative
  - marker: c
    text: हिब्रू में बल देने के लिए “सोना, सोना” और “चाँदी, चाँदी” की पुनरुक्ति है।
    reason: source_form
  - marker: d
    text: या “जल्लादों का प्रधान”; यह बाबुल के एक उच्च अधिकारी का पदनाम है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסִּפִּים
  choice: कटोरे
  rationale: मन्दिर के पात्र के लिए यह स्वाभाविक और व्यापक शब्द है; सटीक प्रकार अनिश्चित है, इसलिए विकल्प पादटिप्पणी में दिया गया है।
- source_word: הַמַּחְתּוֹת
  choice: अंगारदान
  rationale: यह पवित्रस्थान की सेवा में अंगारे या धूप रखने-ले जाने के पात्र को ठोस रूप से व्यक्त करता है; ‘धूपदान’ भी सम्भव है।
- source_word: הַמִּזְרָקוֹת
  choice: छिड़काव के पात्र
  rationale: यह अनुष्ठान में प्रयुक्त कटोरेनुमा पात्रों का सम्भावित कार्य स्पष्ट करता है और सूची के दूसरे कटोरों से भेद रखता है।
- source_word: הַסִּירוֹת
  choice: हाँड़ियाँ
  rationale: मूल शब्द सामान्यतः हाँड़ी या बर्तन को दर्शाता है; प्रयोग को इससे अधिक विशिष्ट नहीं किया गया।
- source_word: הַמְּנֹרוֹת
  choice: दीपदान
  rationale: यह केवल दीप नहीं, उन्हें धारण करने वाले मन्दिर-उपकरण को दर्शाता है।
- source_word: הַכַּפּוֹת
  choice: प्याले
  rationale: मन्दिर की सूची में यह छोटे पात्रों, प्यालों या चम्मचों का द्योतक हो सकता है; यहाँ ‘प्याले’ आरम्भिक ‘कटोरे’ से भेद बनाए रखता है।
- source_word: הַמְּנַקִיּוֹת
  choice: उँडेलने के पात्र
  rationale: दुर्लभ शब्द के सम्भावित कार्य को सहज हिन्दी में व्यक्त करता है, बिना उसके सटीक आकार या उपयोग को निश्चित किए।
- source_word: אֲשֶׁר זָהָב זָהָב וַאֲשֶׁר כֶּסֶף כָּסֶף
  choice: जो सोने के थे, सोने के, और जो चाँदी के थे, चाँदी के
  rationale: हिब्रू की सूची-जैसी बलात्मक पुनरुक्ति को असामान्य होने पर भी सुरक्षित रखा गया है।
- source_word: לָקַח
  choice: उठा ले गया
  rationale: सन्दर्भ में वस्तुएँ लूटकर ले जाने का भाव है; यह हिन्दी में केवल ‘लिया’ से अधिक स्वाभाविक है, जबकि मूल क्रिया की सादगी बनी रहती है।
- source_word: רַב טַבָּחִים
  choice: अंगरक्षकों का प्रधान
  rationale: बाबुली अधिकारी के पदनाम का सम्भावित सैन्य-दरबारी अर्थ व्यक्त करता है; शाब्दिक ‘जल्लादों का प्रधान’ विकल्प पादटिप्पणी में रखा गया है।
