id: JER.52.14
reference: Jeremiah 52:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אֶת כָּל חֹמ֥וֹת יְרוּשָׁלִַ֖ם סָבִ֑יב נָֽתְצוּ֙ כָּל חֵ֣יל כַּשְׂדִּ֔ים אֲשֶׁ֖ר אֶת רַב טַבָּחִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/014.yaml
  text: And all the walls around Jerusalem were broken down by all the army of the Chaldeans that was with the captain of the guard[a][b].
translation:
  language: hi
  text: और कसदियों[a] की सारी सेना ने, जो अंगरक्षकों के प्रधान[b] के साथ थी, यरूशलेम के चारों ओर की सारी शहरपनाह ढा दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बाबुलियों”।
    reason: इब्रानी में जातिनाम ‘कसदी’ है; इस प्रसंग में वह बाबुलियों को सूचित करता है।
  - marker: b
    text: इब्रानी में “वध करनेवालों का प्रधान”; यह उपाधि संभवतः राजकीय अंगरक्षक दल के सेनापति के लिए थी।
    reason: मूल उपाधि का शाब्दिक अर्थ और उसका संभावित राजकीय कार्य दोनों सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: חֹמוֹת
  choice: शहरपनाह
  rationale: बहुवचन संज्ञा यहाँ यरूशलेम की रक्षात्मक दीवारों को दर्शाती है। हिन्दी में ‘शहरपनाह’ नगर की किलेबंदी वाली दीवार का स्वाभाविक और सटीक शब्द है; ‘सारी’ के साथ इसका सामूहिक एकवचन प्रयोग सहज है।
- source_word: סָבִיב
  choice: चारों ओर की
  rationale: यह यरूशलेम को घेरे हुए शहरपनाह के पूरे विस्तार को व्यक्त करता है।
- source_word: נָתְצוּ
  choice: ढा दी
  rationale: נתץ किसी निर्माण को तोड़कर गिराने के अर्थ में है। सक्रिय वाक्य हिन्दी में स्वाभाविक है और इब्रानी में अंततः बताए गए कर्ता को स्पष्ट रखता है।
- source_word: חֵיל
  choice: सेना
  rationale: इस प्रसंग में חֵיל धन या सामर्थ्य नहीं, सैन्य बल को सूचित करता है।
- source_word: כַּשְׂדִּים
  choice: कसदियों
  rationale: यह इब्रानी जातिनाम का सीधा रूप है। प्रसंग में इससे बाबुल की साम्राज्यिक सेना अभिप्रेत है, जिसे पादटिप्पणी में स्पष्ट किया गया है।
- source_word: אֲשֶׁר אֶת
  choice: जो ... के साथ थी
  rationale: यह संबंधवाचक रचना सेना और अधिकारी के साथ होने का संबंध व्यक्त करती है; सामूहिक ‘सेना’ के अनुसार स्त्रीलिंग एकवचन क्रिया स्वाभाविक है।
- source_word: רַב טַבָּחִים
  choice: अंगरक्षकों के प्रधान
  rationale: शाब्दिक अर्थ ‘वध करनेवालों का प्रधान’ है, पर यह बाबुल के एक उच्च राजकीय अधिकारी की उपाधि है, जो संभवतः राजकीय अंगरक्षक दल का सेनापति था। चुना हुआ रूप पद का कार्य सहज हिन्दी में बताता है और शाब्दिक अर्थ पादटिप्पणी में सुरक्षित है।
