translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज ऐतिहासिक गद्य। ‘शहरपनाह’ रक्षात्मक नगर-दीवार के लिए प्रचलित सटीक पद है। कर्ता को पहले रखकर सक्रिय संरचना अपनाई गई है, क्योंकि इब्रानी का कर्म-प्रारंभिक क्रम हिन्दी में ज्यों का त्यों रखने से वाक्य कम स्वाभाविक होता।
