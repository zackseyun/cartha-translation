base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/007.yaml
  text: Then the city was breached[a], and all the men of war fled and went out of the city by night by way of the gate between the two walls, which was by the king’s garden, while the Chaldeans were all around the city[c][b]; and they went by way of the Arabah.
translation:
  language: hi
  text: तब नगर की दीवार में सेंध लग गई[a]। सभी योद्धा रात को नगर से भाग निकले। वे दो दीवारों के बीच के उस फाटक के रास्ते से निकले, जो राजा के बगीचे के पास था। उस समय कसदी[b] नगर को चारों ओर से घेरे हुए थे। फिर वे अरावा[c] के रास्ते चले गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “नगर में दरार पड़ गई।” घेराबंदी के इस प्रसंग में आशय नगर की सुरक्षा-दीवार में सेंध लगने से है।
    reason: lexical_alternative
  - marker: b
    text: “कसदी” इब्रानी में प्रयुक्त जातीय नाम है, जो यहाँ बाबेल की सेना के लिए आया है।
    reason: cultural_note
  - marker: c
    text: “अरावा” यरदन घाटी से मृत सागर और उसके दक्षिण तक फैले दरार-घाटी क्षेत्र का नाम है; कुछ अनुवाद इसे “मैदान” कहते हैं।
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּבָּקַע הָעִיר
  choice: नगर की शहरपनाह में सेंध लग गई
  rationale: इब्रानी में शाब्दिक रूप से ‘नगर में दरार पड़ गई/नगर तोड़ दिया गया’ है; घेराबंदी के प्रसंग में इसका आशय नगर की सुरक्षा-दीवार में सेंध लगने से है। हिंदी में ‘शहरपनाह में सेंध’ सैन्य प्रसंग को स्पष्ट और स्वाभाविक रखता है।
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: सभी योद्धा
  rationale: यह युद्ध करने वाले पुरुषों के लिए प्रयुक्त इब्रानी पद है। ‘योद्धा’ आधुनिक हिंदी में संक्षिप्त, गरिमापूर्ण और सहज है।
- source_word: יִבְרְחוּ וַיֵּצְאוּ מֵהָעִיר לַיְלָה
  choice: रात को नगर से भाग निकले
  rationale: कथात्मक क्रम में अपूर्ण क्रिया भूतकालीन घटना बताती है। ‘भाग निकले’ में भागने और नगर से बाहर निकलने, दोनों क्रियाओं का स्वाभाविक हिंदी संयोजन है।
- source_word: דֶּרֶךְ שַׁעַר בֵּין הַחֹמֹתַיִם
  choice: दोनों शहरपनाहों के बीच उस फाटक के रास्ते से
  rationale: חֹמֹתַיִם का द्विवचन दो दीवारों को स्पष्ट करता है और דֶּרֶךְ मार्ग को सूचित करता है।
- source_word: אֲשֶׁר עַל גַּן הַמֶּלֶךְ
  choice: जो राजा के बगीचे के पास था
  rationale: यहाँ עַל स्थान-संबंधी अर्थ में निकटता बताता है; ‘पास’ हिंदी में स्वाभाविक है।
- source_word: וְכַשְׂדִּים עַל הָעִיר סָבִיב
  choice: उस समय कसदी नगर को चारों ओर से घेरे हुए थे
  rationale: यह उपवाक्य भागने की परिस्थिति बताता है। ‘कसदी’ मूल जातीय-ऐतिहासिक नाम को सुरक्षित रखता है।
- source_word: וַיֵּלְכוּ דֶּרֶךְ הָעֲרָבָה
  choice: फिर वे अरावा के रास्ते चले गए
  rationale: अरावा विशिष्ट भौगोलिक प्रदेश है; नाम का लिप्यंतरण ‘मैदान’ जैसे सामान्य अर्थ से अधिक सटीक है। דֶּרֶךְ को ‘रास्ते’ से व्यक्त किया गया है।
