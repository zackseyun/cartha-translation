base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/022.yaml
  text: And on it was a bronze capital[a], and the height of the one capital was five cubits, with latticework and pomegranates on the capital all around, all of bronze. And the second pillar had the same[b], with pomegranates.
translation:
  language: hi
  text: उस पर काँसे का एक स्तंभ-शीर्ष था। उस एक स्तंभ-शीर्ष की ऊँचाई पाँच हाथ थी। स्तंभ-शीर्ष के चारों ओर जालीदार सजावट[a] और अनार[b] थे; ये सब काँसे के थे। दूसरे स्तंभ पर भी ऐसी ही जालीदार सजावट और अनार थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘जाल जैसी बनावट’।
    reason: lexical_alternative
  - marker: b
    text: यहाँ अनार के आकार की सजावटी आकृतियाँ अभिप्रेत हैं।
    reason: cultural_note
lexical_decisions:
- source_word: כֹתֶרֶת
  choice: स्तंभ-शीर्ष
  rationale: यह शब्द स्तंभ के सजावटी ऊपरी भाग को दर्शाता है। ‘स्तंभ-शीर्ष’ आधुनिक हिन्दी में स्पष्ट है और केवल ‘शीर्ष’ की अपेक्षा वास्तु-संदर्भ को अधिक ठीक से व्यक्त करता है।
- source_word: נְחֹשֶׁת
  choice: काँसा
  rationale: मन्दिर के इन धातु-निर्मित अवयवों के संदर्भ में यह शब्द सामान्यतः काँसे को दर्शाता है; ‘पीतल’ ऐतिहासिक रूप से कम सटीक और ‘ताँबा’ यहाँ कम सम्भावित है।
- source_word: קוֹמַת
  choice: ऊँचाई
  rationale: यहाँ स्तंभ-शीर्ष की नापी हुई खड़ी लंबाई अभिप्रेत है; ‘ऊँचाई’ सहज और सटीक है।
- source_word: הָאַחַת
  choice: उस एक स्तंभ-शीर्ष
  rationale: इब्रानी पद दो स्तंभ-शीर्षों में से एक को अलग करके बताता है, पर उसे अनिवार्यतः ‘पहला’ नहीं कहता।
- source_word: חָמֵשׁ אַמּוֹת
  choice: पाँच हाथ
  rationale: मूल पाठ की प्राचीन माप-इकाई को बिना आधुनिक रूपांतरण के रखा गया है; हिन्दी बाइबलीय प्रयोग में ‘हाथ’ cubit का प्रचलित और संक्षिप्त रूप है।
- source_word: שְׂבָכָה
  choice: जालीदार सजावट
  rationale: यह शब्द स्तंभ-शीर्ष पर लगी जाल जैसी सजावटी बनावट को दर्शाता है। ‘जालीदार सजावट’ सामान्य पाठक के लिए ‘जाल’ मात्र से अधिक स्पष्ट है।
- source_word: רִמּוֹנִים
  choice: अनार
  rationale: शब्द का शाब्दिक अर्थ ‘अनार’ है; वास्तु-संदर्भ में इससे अनार के आकार की सजावटी आकृतियाँ अभिप्रेत हैं, जिसे टिप्पणी में स्पष्ट किया गया है।
- source_word: סָבִיב
  choice: चारों ओर
  rationale: यह स्तंभ-शीर्ष को घेरे हुए सजावट की स्थिति को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הַכֹּל נְחֹשֶׁת
  choice: ये सब काँसे के थे
  rationale: यह जालीदार सजावट और अनारों की धातु-सामग्री का सार स्पष्ट और सहज हिन्दी में बताता है।
- source_word: וְכָאֵלֶּה לָעַמּוּד הַשֵּׁנִי
  choice: दूसरे स्तंभ पर भी ऐसी ही जालीदार सजावट
  rationale: इब्रानी वाक्यांश संक्षिप्त और लुप्त क्रिया वाला है। हिन्दी में ‘पर भी ... थी’ का भाव पूरा करने और तुलना स्पष्ट करने के लिए पहले वर्णित वस्तु को दोहराया गया है।
