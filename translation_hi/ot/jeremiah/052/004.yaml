base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/004.yaml
  text: And in the ninth year of his reign[a], in the tenth month, on the tenth day of the month, Nebuchadnezzar king of Babylon came—he and all his army—against Jerusalem[b], and they encamped against it and built a siege wall around it.
translation:
  language: hi
  text: उसके राज्य के नौवें वर्ष के दसवें महीने के दसवें दिन, बाबेल का राजा नबूकदरेस्सर[a] अपनी सारी सेना के साथ यरूशलेम के विरुद्ध आया। उन्होंने उसके विरुद्ध डेरे डाले और उसके चारों ओर घेराबंदी की दीवार[b] बनाई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ में राजा के नाम का रूप “नबूकदरेस्सर” के निकट है; “नबूकदनेस्सर” इसका अधिक प्रचलित रूप है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी शब्द का अनुवाद “घेराबंदी के निर्माण-कार्य,” “घेराबंदी का परकोटा,” या “घेराबंदी का बाँध” भी हो सकता है।
    reason: lexical_alternative
