base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/006.yaml
  text: In the fourth month[a], on the ninth day of the month, the famine became severe in the city, and there was no bread for the people of the land.
translation:
  language: hi
  text: चौथे महीने[a] के नौवें दिन अकाल नगर में तीव्र हो गया, और देश के लोगों के लिए रोटी नहीं थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “साधारण लोगों के लिए।” इब्रानी पदबंध “देश के लोग” कुछ प्रसंगों में विशेष रूप से सामान्य जनता या साधारण लोगों को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֹדֶשׁ הָרְבִיעִי
  choice: चौथे महीने
  rationale: इब्रानी में निश्चित क्रमवाचक संख्या के साथ समय-सूचक वाक्यांश है। ‘वर्ष के’ मूल में स्पष्ट नहीं है, इसलिए उसे नहीं जोड़ा गया।
- source_word: בְּתִשְׁעָה לַחֹדֶשׁ
  choice: के नौवें दिन
  rationale: यह इब्रानी की प्रचलित तिथि-सूचक अभिव्यक्ति है; हिन्दी में ‘दिन’ जोड़ना स्वाभाविक और अर्थानुरूप है।
- source_word: וַיֶּחֱזַק הָרָעָב
  choice: अकाल बहुत भयंकर हो गया
  rationale: חזק का मूल भाव ‘बलवान होना’ है, पर अकाल के साथ इसका आशय तीव्र या विकराल हो जाना है। ‘बहुत भयंकर हो गया’ घेराबंदी की गंभीरता को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בָּעִיר
  choice: नगर में
  rationale: यह सामान्य स्थानवाचक प्रयोग है। प्रसंग में नगर यरूशलेम है, पर इस पद में नाम दोहराना आवश्यक नहीं।
- source_word: וְלֹא הָיָה לֶחֶם
  choice: और ... रोटी नहीं थी
  rationale: לֶחֶם का सीधा अर्थ ‘रोटी’ है। यह व्यापक अर्थ में भोजन भी सूचित कर सकता है, फिर भी यहाँ ठोस और जीवंत मूल शब्द सुरक्षित रखा गया है।
- source_word: לְעַם הָאָרֶץ
  choice: देश के लोगों के लिए
  rationale: शाब्दिक अर्थ ‘देश के लोग’ है। सामाजिक अर्थ ‘साधारण लोग’ भी संभव है, इसलिए मुख्य पाठ में मूल की व्यापकता रखकर विकल्प पाद-टिप्पणी में दिया गया है।
