base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/002.yaml
  text: And he did what was evil in the eyes of Yahweh[a], according to all that Jehoiakim had done.
translation:
  language: hi
  text: और उसने वही किया जो याहवे की दृष्टि में[a] बुरा था, ठीक वैसे ही जैसे यहोयाकीम ने किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “याहवे की आँखों में”; यह इब्रानी का प्रचलित मुहावरा है, जिसका अर्थ है “याहवे की दृष्टि में।”'
    reason: मूल इब्रानी मुहावरे और उसके अर्थ को स्पष्ट करना।
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: और उसने किया
  rationale: वय्यिक्तोल कथा को आगे बढ़ाता है; ‘और’ उसके क्रमिक कथात्मक बल को सहज हिन्दी में बनाए रखता है।
- source_word: הָרַע
  choice: वही किया जो…बुरा था
  rationale: עשה הרע का स्वाभाविक हिन्दी रूप है; यह शब्दशः और असहज ‘बुराई को किया’ से बचता है।
- source_word: בְּעֵינֵי
  choice: की दृष्टि में
  rationale: यह इब्रानी का मूल्यांकन-सूचक मुहावरा है। ‘की दृष्टि में’ उसके अर्थ और मूल रूपक, दोनों को सुरक्षित रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले परमेश्वर के निज नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: כְּכֹל אֲשֶׁר עָשָׂה
  choice: ठीक वैसे ही जैसे…ने किया था
  rationale: यह तुलना और आचरण के अनुरूप होने का भाव स्वाभाविक हिन्दी में व्यक्त करता है; ‘ठीक’ כְּכֹל के व्यापक अनुरूपता-बल को दर्शाता है।
- source_word: יְהוֹיָקִים
  choice: यहोयाकीम
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण अपनाया गया है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में निज नाम יְהוָה सीधे आया है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। वाक्य ने मूल की कथात्मक क्रमबद्धता, नैतिक मूल्यांकन और यहोयाकीम के आचरण से तुलना को सुरक्षित रखा है।
