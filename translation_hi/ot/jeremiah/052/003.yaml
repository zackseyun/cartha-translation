source:
  edition: WLC
  text: כִּ֣י עַל אַ֣ף יְהוָ֗ה הָֽיְתָה֙ בִּ/ירוּשָׁלִַ֣ם וִֽ/יהוּדָ֔ה עַד הִשְׁלִיכ֥/וֹ אוֹתָ֖/ם מֵ/עַ֣ל פָּנָ֑י/ו וַ/יִּמְרֹ֥ד צִדְקִיָּ֖הוּ בְּ/מֶ֥לֶךְ בָּבֶֽל׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/003.yaml
  text: For because of the anger of Yahweh it came to pass in Jerusalem and Judah[a], until he cast them out from before his face[b]; and Zedekiah rebelled against the king of Babylon.
translation:
  language: hi
  text: क्योंकि यहोवा के क्रोध के कारण यरूशलेम और यहूदा में ऐसा हुआ, जब तक कि उसने उन्हें अपने सामने से निकाल न दिया[a]। और सिदकिय्याह ने बाबेल के राजा के विरुद्ध विद्रोह कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “अपने मुख के सामने से”; अर्थात अपनी उपस्थिति से दूर।'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद पिछले प्रसंग का कारण बताता है; ‘क्योंकि’ उस व्याख्यात्मक संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: עַל אַף יְהוָה
  choice: यहोवा के क्रोध के कारण
  rationale: इब्रानी मुहावरा दैवी क्रोध को घटनाओं का कारण बताता है; ‘क्रोध’ अर्थ की तीव्रता को बिना नरम किए व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत दैवी नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: הָיְתָה
  choice: ऐसा हुआ
  rationale: क्रिया का स्पष्ट कर्ता नहीं है और यह पूर्ववर्ती परिस्थिति की ओर संकेत करती है; ‘ऐसा हुआ’ हिन्दी में स्वाभाविक रहते हुए इस अंतर्निहित संदर्भ को सुरक्षित रखता है।
- source_word: בִּירוּשָׁלִַם וִיהוּדָה
  choice: यरूशलेम और यहूदा में
  rationale: नगर और प्रदेश दोनों को मूल के स्थानवाचक संबंध सहित रखा गया है।
- source_word: עַד הִשְׁלִיכוֹ אֹתָם
  choice: यहाँ तक कि उसने उन्हें ... निकाल दिया
  rationale: השליך बलपूर्वक दूर किए जाने का भाव देता है; ‘निकाल दिया’ स्पष्ट और स्वाभाविक हिन्दी है, जबकि ‘यहाँ तक कि’ परिणाम की सीमा को दर्शाता है।
- source_word: מֵעַל פָּנָיו
  choice: अपने सामने से
  rationale: यह मूल के ‘उसके मुख के सामने से’ वाले स्थानिक रूपक को स्वाभाविक हिन्दी में बनाए रखता है और केवल ‘उपस्थिति से’ कहकर उसे अमूर्त नहीं करता।
- source_word: וַיִּמְרֹד
  choice: और ... ने ... विद्रोह कर दिया
  rationale: राजनीतिक अधीनता तोड़ने के संदर्भ में מרד का मानक अर्थ ‘विद्रोह करना’ है; ‘कर दिया’ कथानक की पूर्ण घटना को सहज हिन्दी में व्यक्त करता है।
- source_word: בְּמֶלֶךְ בָּבֶל
  choice: बाबेल के राजा के विरुद्ध
  rationale: מרד के साथ ב का संबंध हिन्दी में स्वाभाविक रूप से ‘के विरुद्ध’ व्यक्त होता है।
theological_decisions:
- issue: दैवी क्रोध और ऐतिहासिक न्याय के कारण-परिणाम संबंध को बनाए रखना
  choice: ‘यहोवा के क्रोध के कारण ... ऐसा हुआ’
  alternative: इसे केवल ऐतिहासिक घटना के रूप में कहना या ‘क्रोध’ को ‘अप्रसन्नता’ से नरम करना
  rationale: मूल पाठ עַל אַף יְהוָה द्वारा घटनाओं को स्पष्ट रूप से यहोवा के क्रोध से जोड़ता है; अनुवाद न इस दावे को कम करता है, न उससे आगे कोई कारण जोड़ता है।
- issue: מֵעַל פָּנָיו में दैवी उपस्थिति और स्थानिक रूपक
  choice: ‘अपने सामने से’
  alternative: ‘अपनी उपस्थिति से दूर’
  rationale: चुना हुआ पाठ मूल के ‘मुख/सामने’ के बिंब को बचाता है, जबकि अर्थ भी आधुनिक हिन्दी पाठक के लिए स्पष्ट रहता है।
- issue: הָיְתָה के अंतर्निहित कर्ता को हिन्दी में व्यक्त करना
  choice: ‘ऐसा हुआ’
  alternative: ‘यह घटित हुआ’ या ‘यह था’
  rationale: इब्रानी में कर्ता स्पष्ट नहीं है। ‘ऐसा हुआ’ पूर्व प्रसंग की ओर संकेत करता है, पर किसी विशिष्ट घटना या व्याख्या को पाठ में नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वाक्य की कारणात्मक संरचना तथा दैवी न्याय की तीव्रता सुरक्षित है। ‘बाबेल’ और ‘सिदकिय्याह’ जैसे पारंपरिक हिन्दी बाइबलीय नाम-रूप अपनाए गए हैं।
