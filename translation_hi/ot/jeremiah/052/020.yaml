source:
  edition: WLC
  text: הָ/עַמּוּדִ֣ים שְׁנַ֗יִם הַ/יָּ֤ם אֶחָד֙ וְ/הַ/בָּקָ֞ר שְׁנֵים עָשָׂ֤ר נְחֹ֨שֶׁת֙ אֲשֶׁר תַּ֣חַת הַ/מְּכֹנ֔וֹת אֲשֶׁ֥ר עָשָׂ֛ה הַ/מֶּ֥לֶךְ שְׁלֹמֹ֖ה לְ/בֵ֣ית יְהוָ֑ה לֹא הָיָ֣ה מִשְׁקָ֔ל לִ/נְחֻשְׁתָּ֖/ם כָּל הַ/כֵּלִ֥ים הָ/אֵֽלֶּה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/020.yaml
  text: As for the two pillars[a], the one Sea, and the twelve bronze oxen that were under the stands[b], which King Solomon had made for the house of Yahweh—there was no weighing the bronze of all these vessels.
translation:
  language: hi
  text: दो खम्भों, एक समुद्र[a], और काँसे के उन बारह बैलों का, जो आधारों के नीचे थे और जिन्हें राजा सुलैमान ने यहोवा के भवन के लिए बनाया था—इन सब वस्तुओं के काँसे का कोई वजन नहीं था।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “समुद्र” मन्दिर में रखा हुआ एक विशाल जलपात्र था।
    reason: technical_term
  - marker: b
    text: 'शाब्दिक अर्थ: “इन सब वस्तुओं के काँसे का कोई भार नहीं था”; आशय यह भी हो सकता है कि उनका भार नहीं किया गया था या वह गणना से परे था।'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעַמּוּדִים שְׁנַיִם
  choice: दोनों खम्भों
  rationale: मन्दिर के स्थापत्य-सन्दर्भ में עַמּוּדִים के लिए ‘खम्भे’ स्वाभाविक और प्रचलित हिन्दी शब्द है।
- source_word: הַיָּם אֶחָד
  choice: एक समुद्र
  rationale: यह सामान्य समुद्र नहीं, मन्दिर के विशाल जलपात्र का विशेष नाम है; ‘एक’ मूल के सूचीबद्ध वर्णन को बनाए रखता है।
- source_word: וְהַבָּקָר שְׁנֵים עָשָׂר נְחֹשֶׁת
  choice: पीतल के उन बारह बैलों
  rationale: בָּקָר यहाँ सहारा देने वाली बैल-आकृतियों को सूचित करता है। נְחֹשֶׁת के लिए हिन्दी बाइबलीय और सामान्य प्रयोग में ‘पीतल’ अधिक सहज है, यद्यपि धातु को ‘काँसा’ भी कहा जा सकता है।
- source_word: אֲשֶׁר תַּחַת הַמְּכֹנוֹת
  choice: जो आधारों के नीचे थे
  rationale: מְכֹנוֹת मन्दिर के पात्रों से जुड़े आधारों/चौकियों को सूचित करता है; ‘आधार’ व्यापक और स्पष्ट है। मूल में इस सम्बन्ध का विन्यास कठिन है, इसलिए अर्थ को निर्णायक रूप से पुनर्गठित नहीं किया गया।
- source_word: אֲשֶׁר עָשָׂה הַמֶּלֶךְ שְׁלֹמֹה
  choice: जिन्हें राजा सुलैमान ने ... बनवाया था
  rationale: राजकीय निर्माण के सन्दर्भ में ‘बनवाया’ स्वाभाविक हिन्दी है और पूर्वकालिक क्रिया को व्यक्त करता है।
- source_word: לְבֵית יְהוָה
  choice: यहोवा के भवन के लिए
  rationale: בֵית का रूपक ‘भवन’ से सुरक्षित रहता है और יְהוָה को उसके व्यक्तिगत वाचा-नाम ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: לֹא הָיָה מִשְׁקָל לִנְחֻשְׁתָּם
  choice: पीतल का कोई लेखा नहीं था
  rationale: शाब्दिक अर्थ ‘उनके पीतल का कोई भार नहीं था’ है; मुहावरे का आशय है कि भार दर्ज नहीं था या गणना से परे था। ‘कोई लेखा नहीं था’ दोनों सम्भावनाओं को खुला रखता है।
- source_word: כָּל הַכֵּלִים הָאֵלֶּה
  choice: इन सभी वस्तुओं
  rationale: כֵּלִים यहाँ सूचीबद्ध मन्दिर-सामग्री के लिए व्यापक शब्द है; खम्भों और बैल-आकृतियों सहित पूरी सूची के लिए ‘वस्तुएँ’ ‘पात्रों’ से अधिक उपयुक्त है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल में चार-अक्षरी व्यक्तिगत नाम प्रत्यक्ष है। हिन्दी में परिचित व्यक्तिगत-नाम रूप ‘यहोवा’ नाम को उपाधि ‘प्रभु’ में बदलने से बचाता है; ‘याहवे’ अधिक सम्भावित प्राचीन उच्चारण का वैकल्पिक लिप्यन्तरण है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी अपनाई गई है। सूची की संक्षिप्त शैली और अन्तिम वाक्यांश की वास्तविक अर्थगत अनिश्चितता सुरक्षित रखी गई है।
