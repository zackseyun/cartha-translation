  text: וַ/יִּרְדְּפ֤וּ חֵיל כַּשְׂדִּים֙ אַחֲרֵ֣י הַ/מֶּ֔לֶךְ וַ/יַּשִּׂ֥יגוּ אֶת צִדְקִיָּ֖הוּ בְּ/עַֽרְבֹ֣ת יְרֵח֑וֹ וְ/כָל חֵיל֔/וֹ נָפֹ֖צוּ מֵ/עָלָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/008.yaml
  text: But the army of the Chaldeans pursued the king and overtook Zedekiah in the plains of Jericho[b][a], and all his army was scattered from him.
translation:
  language: hi
  text: परन्तु कसदियों की सेना ने राजा का पीछा किया और यरीहो के मैदानी इलाके[a] में सिदकिय्याह को जा पकड़ा। तब उसकी सारी सेना उसे छोड़कर तितर-बितर हो गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यरीहो के स्तेपी प्रदेश में।”
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵיל כַּשְׂדִּים
  choice: कसदियों की सेना
  rationale: חֵיל यहाँ सैन्य दल या सेना को दर्शाता है, और כַּשְׂדִּים का औपचारिक जातीय-राजनीतिक नाम ‘कसदी’ है; ‘बाबेल की सेना’ संदर्भगत रूप से संभव, पर मूल से कम निकट है।
- source_word: וַיִּרְדְּפוּ אַחֲרֵי הַמֶּלֶךְ
  choice: राजा का पीछा किया
  rationale: רדף और אַחֲרֵי का संयुक्त भाव सैन्य पीछा करना है; हिन्दी में ‘का पीछा किया’ स्वाभाविक और सटीक है।
- source_word: וַיַּשִּׂיגוּ אֶת צִדְקִיָּהוּ
  choice: सिदकिय्याह को जा पकड़ा
  rationale: נשׂג पीछा करते हुए किसी तक पहुँच जाने या उसे पकड़ लेने का भाव देता है; ‘जा पकड़ा’ कथा के सैन्य संदर्भ में इस पूर्ण भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: בְּעַרְבֹת יְרֵחוֹ
  choice: यरीहो के मैदानी इलाके
  rationale: עֲרָבוֹת मैदानों अथवा स्तेपी भूभाग को दर्शाता है। ‘मैदानी इलाके’ सामान्य पाठक के लिए सुबोध है, जबकि अधिक तकनीकी विकल्प पादटिप्पणी में रखा गया है।
- source_word: וְכָל חֵילוֹ נָפֹצוּ מֵעָלָיו
  choice: तब उसकी सारी सेना उसे छोड़कर तितर-बितर हो गई
  rationale: נפץ का बहुवचन सेना के सदस्यों के बिखर जाने को दिखाता है। हिन्दी में सामूहिक संज्ञा ‘सेना’ के साथ ‘हो गई’ स्वाभाविक है; מֵעָלָיו के अलगाव का भाव ‘उसे छोड़कर’ से स्पष्ट होता है।
