  register: आधुनिक मानक हिन्दी का सहज, dignified कथात्मक स्वर रखा गया है। व्यक्तिनाम ‘सिदकिय्याह’ और जातिनाम ‘कसदी’ मूल हिब्रू के निकट हैं। मुख्य पाठ में ‘मैदानी इलाके’ सामान्य पाठकों के लिए स्पष्ट है और ‘स्तेपी प्रदेश’ को वैकल्पिक पादटिप्पणी में सुरक्षित रखा गया है।
