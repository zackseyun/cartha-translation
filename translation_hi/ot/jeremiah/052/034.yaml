  yaml_path: translation/ot/jeremiah/052/034.yaml
  text: And his allowance[a], a continual allowance, was given to him from the king of Babylon, a daily portion day by day, until the day of his death, all the days of his life.
translation:
  language: hi
  text: 'और उसका निर्वाह-भत्ता—निरंतर मिलने वाला निर्वाह-भत्ता—बाबेल के राजा की ओर से उसे दिया जाता रहा: हर दिन के लिए उसका नियत भाग, दिन-प्रतिदिन, उसकी मृत्यु के दिन तक, उसके जीवन के सारे दिनों तक।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲרֻחָה / אֲרֻחָתוֹ
  choice: भोजन-भत्ता
  rationale: संदर्भ में यह यहोयाकीन के निर्वाह के लिए राजकीय रूप से निर्धारित दैनिक सामग्री या राशि है। ‘भोजन-भत्ता’ भोजन/निर्वाह और नियत आवंटन, दोनों भावों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: תָּמִיד
  choice: नियमित
  rationale: यह शब्द लगातार और नियमित रूप से मिलने की बात बताता है। ‘नियमित’ यहाँ आवर्ती राजकीय प्रबंध के लिए सहज है।
- source_word: נִתְּנָה
  choice: दिया जाता रहा
  rationale: निफ़ाल के कर्मवाच्य भाव को बनाए रखते हुए हिन्दी में जारी व्यवस्था का भाव व्यक्त करता है।
- source_word: מֵאֵת מֶלֶךְ בָּבֶל
  choice: बाबेल के राजा की ओर से
  rationale: מֵאֵת के स्रोतभाव को स्पष्ट करता है और केवल प्रत्यक्ष कर्ता का अर्थ थोपने से बचता है।
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: हर दिन का भाग उसी दिन
  rationale: मुहावरे का अर्थ प्रत्येक दिन के लिए निर्धारित मात्रा है। यह अनुवाद उसके वितरणात्मक अर्थ और हिब्रू की पुनरुक्ति दोनों को सुरक्षित रखता है।
- source_word: עַד יוֹם מוֹתוֹ
  choice: उसकी मृत्यु के दिन तक
  rationale: मूल की पूर्ण अभिव्यक्ति और उसकी औपचारिक लय को बनाए रखता है।
- source_word: כֹּל יְמֵי חַיָּיו
  choice: उसके जीवन के सारे दिनों में
  rationale: हिब्रू मुहावरे को निकटता से व्यक्त करते हुए स्वाभाविक और गरिमापूर्ण हिन्दी देता है।
