base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/016.yaml
  text: But some of the poorest of the land Nebuzaradan[a], the captain of the guard[b], left as vinedressers and farmers.
translation:
  language: hi
  text: परन्तु देश के सबसे निर्धन लोगों में से कुछ को नबूजरदान, पहरेदारों का प्रधान[a], दाख की बारियों में काम करनेवाले और खेतिहर[b] के रूप में छोड़ दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जल्लादों का प्रधान”; इब्रानी पद का शब्दशः अर्थ “वध करनेवालों का प्रधान” है, पर सम्भवतः यह दरबार या सेना का आधिकारिक पदनाम था।
    reason: lexical_alternative
  - marker: b
    text: या “हल चलानेवाले” अथवा “खेतों में काम करनेवाले”।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִדַּלּוֹת הָאָרֶץ
  choice: परन्तु देश के सबसे निर्धन लोगों में से कुछ को
  rationale: מִן का अंशसूचक भाव ‘में से कुछ’ द्वारा व्यक्त किया गया है। דַּלּוֹת यहाँ देश के निर्धन लोगों को सूचित करता है; पूर्ववर्ती विनाश और निर्वासन के विपरीत शेष छोड़े जाने के कारण וּ को प्रसंगानुसार ‘परन्तु’ कहा गया है।
- source_word: הִשְׁאִיר
  choice: वहीं छोड़ दिया
  rationale: हिफ़ील क्रिया का मूल अर्थ किसी को शेष रहने देना या पीछे छोड़ देना है। ‘वहीं’ हिन्दी में संदर्भित देश में छोड़े जाने का भाव स्वाभाविक रूप से स्पष्ट करता है।
- source_word: נְבוּזַרְאֲדָן
  choice: नबूजरदान
  rationale: व्यक्तिनाम का मानक हिन्दी लिप्यंतरण।
- source_word: רַב טַבָּחִים
  choice: पहरेदारों के प्रधान
  rationale: यह बाबुल का एक आधिकारिक सैनिक अथवा दरबारी पदनाम है। मुख्य पाठ में पद का स्वाभाविक हिन्दी रूप दिया गया है, जबकि शब्दशः अधिक कठोर अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: לְכֹרְמִים
  choice: दाख की बारियों के माली
  rationale: כֹרְמִים दाख की बारियों की देखभाल करनेवालों को दर्शाता है। यह साधारण पाठक के लिए ‘दाख की बारियों में काम करनेवाले’ से अधिक संक्षिप्त और स्वाभाविक है।
- source_word: וּלְיֹגְבִים
  choice: और खेतिहर
  rationale: दुर्लभ कृषि-संबंधी शब्द खेत या मिट्टी पर काम करनेवालों, संभवतः हल चलानेवालों, को दर्शाता है। ‘खेतिहर’ व्यापक अर्थ और मूल की अनिश्चित विशिष्टता दोनों बनाए रखता है।
