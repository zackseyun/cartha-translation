  text: וַ/יִּשְׁחַ֧ט מֶֽלֶךְ בָּבֶ֛ל אֶת בְּנֵ֥י צִדְקִיָּ֖הוּ לְ/עֵינָ֑י/ו וְ/גַ֛ם אֶת כָּל שָׂרֵ֥י יְהוּדָ֖ה שָׁחַ֥ט בְּ/רִבְלָֽתָ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/010.yaml
  text: Then the king of Babylon slaughtered the sons of Zedekiah before his eyes[a], and he also slaughtered all the officials of Judah at Riblah.
translation:
  language: hi
  text: तब बाबेल के राजा ने सिदकिय्याह के बेटों को उसकी आँखों के सामने वध कर दिया। उसने यहूदा के सभी अधिकारियों[a] को भी रिबला में वध कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘प्रधानों’ अथवा ‘राजकुमारों।’ इब्रानी शब्द שָׂרֵי ऊँचे पद के शासकों, अधिकारियों या राजकुमारों को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחַט / שָׁחַט
  choice: वध कर दिया
  rationale: यह क्रिया हिंसक रूप से जान लेने या वध करने को व्यक्त करती है। ‘वध कर दिया’ प्रसंग की क्रूरता बनाए रखता है, और दोनों स्थानों पर इसकी पुनरावृत्ति इब्रानी की शब्दगत पुनरावृत्ति को सुरक्षित रखती है।
- source_word: מֶלֶךְ בָּבֶל
  choice: बाबेल के राजा
  rationale: यह संबंधवाचक रचना का सीधा, स्वाभाविक और प्रचलित हिन्दी रूप है।
- source_word: בְּנֵי צִדְקִיָּהוּ
  choice: सिदकिय्याह के बेटों
  rationale: בְּנֵי का स्पष्ट अर्थ ‘बेटे’ है; ‘बच्चे’ कहना मूल की अपेक्षा कम सटीक होता।
- source_word: לְעֵינָיו
  choice: उसकी आँखों के सामने
  rationale: यह मुहावरा इस बात पर बल देता है कि सिदकिय्याह ने स्वयं अपने बेटों का वध देखा। हिन्दी में यह रूप सजीव और स्वाभाविक है।
- source_word: וְגַם
  choice: भी
  rationale: ‘भी’ मूल के योगात्मक बल को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כָּל שָׂרֵי יְהוּדָה
  choice: यहूदा के सभी अधिकारियों
  rationale: שָׂרֵי उच्च पदस्थ शासकों, अधिकारियों या प्रधानों को सूचित कर सकता है। आधुनिक पाठक के लिए ‘अधिकारियों’ स्पष्ट है और अनावश्यक रूप से वंशानुगत राजपद का संकेत नहीं देता।
- source_word: בְּרִבְלָתָה
  choice: रिबला में
  rationale: स्थानवाचक रूप को सहज हिन्दी में व्यक्त किया गया है।
