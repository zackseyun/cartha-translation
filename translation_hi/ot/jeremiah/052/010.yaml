  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। हिंसा की तीव्रता तथा मूल में ‘वध’ की पुनरावृत्ति सुरक्षित रखी गई है। अंग्रेज़ी परामर्श-पाठ में [a] का चिह्न ‘उसकी आँखों के सामने’ के बाद था, पर उसकी टिप्पणी שָׂרֵי से संबंधित है; इसलिए हिन्दी में चिह्न को ‘अधिकारियों’ के साथ रखा गया है।
