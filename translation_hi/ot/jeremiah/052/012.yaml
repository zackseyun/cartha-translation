- source_word: בֶּעָשׂוֹר לַחֹדֶשׁ
  choice: महीने के दसवें दिन
  rationale: इब्रानी तिथि-विधान का स्पष्ट और स्वाभाविक हिंदी रूप।
- source_word: הִיא שְׁנַת תְּשַׁע עֶשְׂרֵה שָׁנָה לַמֶּלֶךְ
  choice: यह ... के राज्य का उन्नीसवाँ वर्ष था
  rationale: स्त्रीलिंग सर्वनाम הִיא पूर्ववर्ती तिथि की व्याख्या करता है; 'राज्य का ... वर्ष' हिंदी में राजकीय वर्ष-गणना को स्पष्ट करता है।
- source_word: נְבוּכַדְרֶאצַּר
  choice: नबूकदरेस्सर
  rationale: नाम को इस पद के इब्रानी रूप के निकट लिप्यंतरित किया गया है, जिसमें द-र क्रम उपस्थित है।
- source_word: רַב טַבָּחִים
  choice: राज-अंगरक्षकों का प्रधान
  rationale: शाब्दिक अर्थ वध करने वालों अथवा जल्लादों के प्रधान की ओर संकेत करता है, पर राजदरबार में यह एक उच्च शाही अधिकारी का पद था; मुख्य पाठ में कार्य-संदर्भ के अनुकूल प्रचलित अर्थ दिया गया है और शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: עָמַד לִפְנֵי מֶלֶךְ בָּבֶל
  choice: जो बाबेल के राजा के सम्मुख खड़ा रहता था
  rationale: इब्रानी दरबारी मुहावरे को लगभग शाब्दिक रूप में रखा गया है; इसका आशय राजा की उपस्थिति में आधिकारिक सेवा करना है।
- source_word: בִּירוּשָׁלִָם
  choice: यरूशलेम आया
  rationale: ב उपसर्ग का रूपतः अर्थ 'में' है, किंतु गति-सूचक בָּא के साथ यहाँ गंतव्य अभिप्रेत है; हिंदी में बिना परसर्ग के 'यरूशलेम आया' स्वाभाविक रूप से वही अर्थ देता है।
