  text: וּ/בַ/חֹ֤דֶשׁ הַֽ/חֲמִישִׁי֙ בֶּ/עָשׂ֣וֹר לַ/חֹ֔דֶשׁ הִ֗יא שְׁנַת֙ תְּשַֽׁע עֶשְׂרֵ֣ה שָׁנָ֔ה לַ/מֶּ֖לֶךְ נְבוּכַדְרֶאצַּ֣ר מֶֽלֶךְ בָּבֶ֑ל בָּ֗א נְבֽוּזַרְאֲדָן֙ רַב טַבָּחִ֔ים עָמַ֛ד לִ/פְנֵ֥י מֶֽלֶךְ בָּבֶ֖ל בִּ/ירוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/012.yaml
  text: In the fifth month[a], on the tenth day of the month—which was the nineteenth year of King Nebuchadnezzar, king of Babylon—Nebuzaradan the captain of the guard, who stood before the king of Babylon[c][b], came to Jerusalem.
translation:
  language: hi
  text: पाँचवें महीने में, महीने के दसवें दिन—यह बाबेल के राजा नबूकदरेस्सर के राज्य का उन्नीसवाँ वर्ष था—राज-अंगरक्षकों का प्रधान[a] नबूजरदान, जो बाबेल के राजा के सम्मुख खड़ा था[b], यरूशलेम आया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पदवी का अधिक शाब्दिक अनुवाद “जल्लादों का प्रधान” या “वध करने वालों का प्रधान” हो सकता है; संभवतः यह राज-अंगरक्षक दल पर नियुक्त एक उच्च अधिकारी की पदवी थी।
    reason: lexical_alternative
  - marker: b
    text: “राजा के सम्मुख खड़ा रहना” राजदरबार का मुहावरा है, जिसका अर्थ राजा की उपस्थिति में उसकी सेवा करना है।
    reason: cultural_note
lexical_decisions:
