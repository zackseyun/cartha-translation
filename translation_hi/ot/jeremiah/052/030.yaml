base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/030.yaml
  text: In the twenty-third year of Nebuchadnezzar[a], Nebuzaradan the captain of the guard carried away 745 Judeans[c][b]. All the persons were 4,600.
translation:
  language: hi
  text: नबूकदनेस्सर के शासन के तेईसवें वर्ष में, अंगरक्षकों के प्रधान नबूजरदान ने 745 यहूदावासियों को निर्वासन में भेज दिया।[a][b] कुल मिलाकर 4,600 व्यक्ति थे।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “निर्वासित कर दिया” अथवा “देश-निकाला दे दिया।” इब्रानी क्रिया का अर्थ किसी को निर्वासन में जाने के लिए विवश करना है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में दोनों गणनाओं के साथ “प्राण” (נֶפֶשׁ) है; यहाँ यह व्यक्तियों के लिए प्रयुक्त मुहावरा है।
    reason: lexical_alternative
  - marker: c
    text: 4,600 की कुल संख्या पद 28–30 में बताए गए निर्वासितों का योग है।
    reason: cross_reference
