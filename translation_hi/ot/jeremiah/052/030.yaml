  choice: नबूकदनेस्सर के शासन के तेईसवें वर्ष में
  rationale: लְ संबंधसूचक रूप यहाँ राजकीय वर्ष-गणना बताता है; हिन्दी में ‘के शासन के’ जोड़ने से आशय स्पष्ट और स्वाभाविक होता है।
- source_word: הֶגְלָה
  choice: निर्वासन में भेज दिया
  rationale: גלה के हिफ़ील रूप का अर्थ किसी को देश से निकालकर निर्वासन में भेजना है। यह चयन क्रिया की कारणवाचकता को स्पष्ट रखता है।
- source_word: נְבוּזַרְאֲדָן
  choice: नबूजरदान
  rationale: व्यक्तिनाम का हिन्दी में ध्वन्यात्मक लिप्यंतरण किया गया है।
- source_word: רַב טַבָּחִים
  choice: अंगरक्षकों के प्रधान
  rationale: शाब्दिक रूप से पदवी का संबंध वध करने वालों से है, पर इस ऐतिहासिक प्रसंग में यह बाबुल के एक उच्च राजकीय या सैनिक अधिकारी की पदवी है; ‘अंगरक्षकों के प्रधान’ हिन्दी में प्रचलित और प्रसंगानुकूल है।
- source_word: יְהוּדִים
  choice: यहूदावासी
  rationale: इस निर्वासनकालीन संदर्भ में शब्द यहूदा प्रदेश के लोगों को जातीय-भौगोलिक अर्थ में दर्शाता है; ‘यहूदावासी’ उस भेद को ‘यहूदी’ की अपेक्षा अधिक स्पष्ट रखता है।
- source_word: נֶפֶשׁ / כָּל נֶפֶשׁ
  choice: व्यक्ति / कुल मिलाकर … व्यक्ति
  rationale: गणना के प्रसंग में נֶפֶשׁ व्यक्तियों के लिए प्रयुक्त मुहावरा है। हिन्दी में ‘प्राण’ या ‘आत्माएँ’ भ्रामक होता; ‘व्यक्ति’ आशय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: שְׁבַע מֵאוֹת אַרְבָּעִים וַחֲמִשָּׁה / אַרְבַּעַת אֲלָפִים וְשֵׁשׁ מֵאוֹת
  choice: 745 / 4,600
  rationale: अंकों का प्रयोग ठीक संख्या को स्पष्ट और सरल पठनीय रूप में रखता है।
