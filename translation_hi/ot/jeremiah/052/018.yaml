  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। सूची की ठोस शब्दावली को बनाए रखते हुए अनिश्चित मन्दिर-उपकरणों की पहचान पादटिप्पणियों में खुली रखी गई है।
