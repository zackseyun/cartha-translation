base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/018.yaml
  text: They took away the pots[a], the shovels, the snuffers, the basins, the dishes[c][b], and all the bronze vessels with which they ministered.
translation:
  language: hi
  text: उन्होंने हंडों, फावड़ों, बत्ती कतरने के औज़ारों[a], कटोरों[b], छोटी तश्तरियों[c] और काँसे के सभी पात्रों को ले लिया, जिनसे वे सेवा करते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कतरने की छुरियाँ।” सम्भवतः इनसे दीपकों की बत्तियाँ काटी या सँवारी जाती थीं।
    reason: lexical_alternative
  - marker: b
    text: या “छिड़काव के पात्र।” ये बलि के रक्त या दूसरे द्रव के लिए प्रयुक्त कटोरे हो सकते थे।
    reason: lexical_alternative
  - marker: c
    text: या “छोटे कटोरे” अथवा “चम्मच-जैसे पात्र।” इस वस्तु का ठीक आकार निश्चित नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסִּרוֹת
  choice: हंडों
  rationale: सִיר सामान्यतः पकाने या अन्य काम के बड़े पात्र को दर्शाता है। ‘हंडे’ इस मन्दिर-सामग्री की सूची में स्वाभाविक और पर्याप्त रूप से व्यापक है।
- source_word: הַיָּעִים
  choice: फावड़ों
  rationale: יָעִים राख या अंगारे हटाने के उपकरण थे; ‘फावड़े’ इसका स्पष्ट और प्रचलित हिन्दी रूप है।
- source_word: הַמְזַמְּרוֹת
  choice: बत्ती कतरने के औज़ारों
  rationale: यह शब्द काटने या कतरने के उपकरणों को सूचित करता है और मन्दिर-सामग्री के प्रसंग में सामान्यतः दीपकों की बत्तियाँ सँवारने वाले औज़ार समझा जाता है। पहचान पूरी तरह निश्चित न होने के कारण पादटिप्पणी दी गई है।
- source_word: הַמִּזְרָקֹת
  choice: कटोरों
  rationale: מִזְרָקוֹת बलि के रक्त या अन्य द्रव को लेने अथवा छिड़कने के पात्र थे। ‘कटोरे’ सहज हिन्दी है; अधिक विशिष्ट सम्भावना पादटिप्पणी में रखी गई है।
- source_word: הַכַּפּוֹת
  choice: छोटी तश्तरियों
  rationale: כַּפּוֹת छोटे कटोरे, तश्तरियाँ या चम्मच-जैसे पात्र हो सकते हैं। ‘छोटी तश्तरियाँ’ पात्र का सामान्य भाव रखता है, जबकि अनिश्चित विकल्प पादटिप्पणी में हैं।
- source_word: כָּל כְּלֵי הַנְּחֹשֶׁת
  choice: काँसे के उन सभी पात्रों
  rationale: मन्दिर की सामग्री के प्रसंग में נְחֹשֶׁת के लिए ‘काँसा’ उपयुक्त धातु-संज्ञा है और כְּלֵי के लिए ‘पात्र’ सूची की शैली के अनुकूल है।
- source_word: אֲשֶׁר יְשָׁרְתוּ בָהֶם
  choice: जिनसे वे सेवा करते थे
  rationale: שרת यहाँ पवित्र अथवा उपासना-सम्बन्धी सेवा का भाव रखता है। ‘सेवा करते थे’ इस धार्मिक अर्थ को बनाए रखता है, पर मूल में न आए कर्ता या स्थान को स्पष्ट रूप से नहीं जोड़ता।
- source_word: לָקָחוּ
  choice: उन्होंने ... ले लिया
  rationale: לקח का मूल अर्थ ‘लेना’ है। हिन्दी वाक्य में ‘ले लिया’ इस लूट-सन्दर्भ में वस्तुओं को उठा ले जाने का भाव स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: שרת के उपासना-सम्बन्धी अर्थ का निर्वाह
  choice: सेवा करते थे
  alternative: काम में लेते थे
  rationale: मूल क्रिया सामान्य उपयोग से अधिक पवित्र सेवा को सूचित कर सकती है। चुना हुआ रूप उस धार्मिक संकेत को बनाए रखता है, फिर भी यह नहीं बताता कि सेवा करने वाले कौन थे।
