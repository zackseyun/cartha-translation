  yaml_path: translation/ot/jeremiah/052/011.yaml
  text: Then he blinded Zedekiah’s eyes[a], bound him with bronze shackles, and the king of Babylon brought him to Babylon and put him in the house of custody until the day of his death.
translation:
  language: hi
  text: फिर उसने सिदकिय्याह की आँखें फोड़ दीं, उसे काँसे की बेड़ियों से बाँधा, और बाबेल का राजा उसे बाबेल ले गया। उसने उसे हिरासत के भवन[a] में उसकी मृत्यु के दिन तक रखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा “कारागार।” इब्रानी में शाब्दिक रूप से “हिरासत का भवन” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֵי צִדְקִיָּהוּ עִוֵּר
  choice: सिदकिय्याह की आँखें फोड़ दीं
  rationale: इब्रानी में सिदकिय्याह की ‘आँखों’ का स्पष्ट उल्लेख है और क्रिया का अर्थ अंधा करना है। हिन्दी में ‘आँखें फोड़ दीं’ इस क्रूर कृत्य को ठोस और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וַיַּאַסְרֵהוּ
  choice: उसे ... बाँधा
  rationale: אסר का सामान्य अर्थ बाँधना है; आगे आने वाला पदबंध बंधन का साधन बताता है।
- source_word: בַנְחֻשְׁתַּיִם
  choice: काँसे की बेड़ियों से
  rationale: यह रूप काँसे के जोड़ेदार बंधनों को सूचित करता है। ‘बेड़ियाँ’ कैदी के शारीरिक बंधन को आधुनिक हिन्दी में स्पष्ट करती हैं और ‘काँसा’ धातु को यथार्थ रूप में रखता है।
- source_word: וַיְבִאֵהוּ ... בָּבֶלָה
  choice: उसे बाबेल ले गया
  rationale: हिफ़ील क्रिया का अर्थ ‘ले आना/ले जाना’ है; हिन्दी में कथन के दृष्टिकोण से ‘बाबेल ले गया’ स्वाभाविक है और दिशासूचक रूप को सुरक्षित रखता है।
- source_word: בֵּית הַפְּקֻדֹּת
  choice: हिरासत का भवन
  rationale: यह विशिष्ट पद किसी निगरानी या बंदीकरण के स्थान को दर्शाता है। ‘हिरासत का भवन’ इब्रानी की औपचारिक संरचना और उसकी कुछ lexical अस्पष्टता बनाए रखता है; सहज विकल्प ‘कारागार’ पादटिप्पणी में दिया गया है।
- source_word: עַד יוֹם מוֹתוֹ
  choice: उसकी मृत्यु के दिन तक
  rationale: यह इब्रानी अभिव्यक्ति का औपचारिक और गंभीर रूप बनाए रखता है, बजाय इसे केवल ‘मरने तक’ कर देने के।
