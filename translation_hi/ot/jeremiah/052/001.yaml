base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/001.yaml
  text: Zedekiah was twenty-one years old when he became king[a], and he reigned eleven years in Jerusalem[b]. His mother’s name was Hamutal the daughter of Jeremiah of Libnah.
translation:
  language: hi
  text: 'सिदकिय्याह इक्कीस वर्ष का था जब वह राजा बना[a], और उसने यरूशलेम में ग्यारह वर्ष राज्य किया। उसकी माता का नाम हमूतल था। वह लिब्ना के यिर्मयाह की बेटी थी।


    [a] या, “जब उसने राज्य करना आरम्भ किया।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब उसने राज्य करना आरम्भ किया।”
    reason: בְמָלְכוֹ के कालगत अर्थ को व्यक्त करने वाला निकट lexical alternative।
lexical_decisions:
