  rationale: यह आयु बताने वाला मानक इब्रानी मुहावरा है; शब्दशः ‘इक्कीस वर्षों का पुत्र’ आधुनिक हिन्दी में अस्वाभाविक होगा।
- source_word: בְמָלְכוֹ
  choice: जब वह राजा बना
  rationale: בְּ के साथ מלך का infinitive construct राजगद्दी सँभालने के समय को दर्शाता है। यह अनुवाद स्वाभाविक हिन्दी में उस कालगत अर्थ को स्पष्ट रखता है।
- source_word: מָלַךְ
  choice: राज्य किया
  rationale: क्रिया का अर्थ राजा के रूप में शासन करना है; ‘राज्य किया’ आधुनिक हिन्दी में सटीक और प्रचलित है।
- source_word: בִּירוּשָׁלִָם
  choice: यरूशलेम में
  rationale: स्थानवाचक בְּ का सीधा और स्वाभाविक अनुवाद।
- source_word: וְשֵׁם אִמּוֹ
  choice: उसकी माता का नाम ... था
  rationale: वंश-संबंधी सूचना को मूल अर्थ बनाए रखते हुए स्वाभाविक हिन्दी शब्दक्रम में प्रस्तुत किया गया है।
- source_word: חמיטל
  choice: हमूतल
  rationale: व्यक्तिवाचक नाम का अनुवाद नहीं, देवनागरी लिप्यंतरण किया गया है।
- source_word: בַּת יִרְמְיָהוּ
  choice: यिर्मयाह की बेटी
  rationale: בַּת का स्पष्ट पुत्री-संबंध आधुनिक और सहज हिन्दी में व्यक्त किया गया है।
- source_word: מִלִּבְנָה
  choice: लिब्ना के रहनेवाले
  rationale: מִן नगर से उत्पत्ति या निवास-संबंध बताता है। ‘लिब्ना के रहनेवाले’ हिन्दी में ‘लिब्ना से’ की अपेक्षा व्यक्ति के स्थान-संबंध को अधिक स्पष्ट करता है।
