  choice: हर खंभे की ऊँचाई अठारह हाथ थी
  rationale: इब्रानी का शाब्दिक विन्यास ‘एक खंभे की ऊँचाई अठारह हाथ’ है। बहुवचन विषय और दोनों समान खंभों के वर्णन के संदर्भ में ‘हर खंभे’ से माप के प्रत्येक पर लागू होने का आशय स्वाभाविक रूप से व्यक्त होता है।
- source_word: חוּט
  choice: डोरी
  rationale: यह शब्द डोरी या नापने की रेखा को दर्शाता है; खंभे को चारों ओर घेरने वाली वास्तविक माप-डोरी के चित्र के लिए ‘डोरी’ सहज और ठोस है।
- source_word: שְׁתֵּים עֶשְׂרֵה אַמָּה יְסֻבֶּנּוּ
  choice: बारह हाथ लंबी एक डोरी उसे चारों ओर से घेर लेती थी
  rationale: सבב और कर्मवाचक प्रत्यय खंभे को चारों ओर घेरने का भाव देते हैं; यह उसकी परिधि को मापने की छवि सुरक्षित रखता है।
- source_word: עָבְיוֹ
  choice: उसकी मोटाई
  rationale: यह खोखले खंभे के पदार्थ या दीवार की मोटाई बताता है, न कि उसकी कुल चौड़ाई।
- source_word: אַרְבַּע אַצְבָּעוֹת
  choice: चार अंगुल[a]
  rationale: शाब्दिक अर्थ ‘चार उँगलियाँ’ है और यह उँगली की चौड़ाई पर आधारित प्राचीन माप है। हिंदी ‘अंगुल’ संक्षेप में उसी माप को व्यक्त करता है; पादटिप्पणी उसका शाब्दिक आधार स्पष्ट करती है।
- source_word: נָבוּב
  choice: वह खोखला था
  rationale: यह खंभे को भीतर से रिक्त बताने वाला विधेय है; पूर्ण हिंदी उपवाक्य अर्थ को स्पष्ट और स्वाभाविक रखता है।
