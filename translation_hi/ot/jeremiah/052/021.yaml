  yaml_path: translation/ot/jeremiah/052/021.yaml
  text: As for the pillars[a], the height of each pillar was eighteen cubits, and a line of twelve cubits would go around it; its thickness was four fingers, and it was hollow.
translation:
  language: hi
  text: खंभों में से प्रत्येक की ऊँचाई अठारह हाथ थी। बारह हाथ की एक डोरी उसे चारों ओर घेरती थी। उसकी मोटाई चार अंगुल[a] थी, और वह खोखला था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “चार उँगलियाँ”; यह उँगली की चौड़ाई पर आधारित माप था।
    reason: इब्रानी के शरीर-आधारित माप की ठोस अभिव्यक्ति और हिंदी “अंगुल” का अर्थ स्पष्ट करता है।
lexical_decisions:
