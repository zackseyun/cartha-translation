  choice: खंभों की बात करें, तो
  rationale: बहुवचन निश्चित संज्ञा के साथ आरंभिक वाव यहाँ विवरण में खंभों को विषय बनाता है; यह हिंदी में स्वाभाविक विषय-सूचक अभिव्यक्ति है।
