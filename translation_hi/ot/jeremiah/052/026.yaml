  yaml_path: translation/ot/jeremiah/052/026.yaml
  text: Nebuzaradan[a], the captain of the guard[b], took them and brought them to the king of Babylon at Riblah.
translation:
  language: hi
  text: अंगरक्षक-दल का प्रधान नबूजरदान उन्हें अपने साथ ले गया और रिबला में बाबेल के राजा के पास ले गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: अपने साथ लिया
  rationale: לקח का सामान्य अर्थ ‘लेना’ है। यहाँ अधिकारियों को हिरासत में साथ ले जाने का भाव है; ‘पकड़ लिया’ या ‘बंदी बना लिया’ मूल से अधिक बल जोड़ सकता है।
- source_word: אוֹתָם
  choice: उन्हें
  rationale: यह कर्मवाचक सर्वनाम पिछले पद में बताए गए अधिकारियों की ओर संकेत करता है।
- source_word: נְבוּזַרְאֲדָן
  choice: नबूजरदान
  rationale: व्यक्तिनाम का प्रचलित और सहज हिन्दी लिप्यंतरण।
- source_word: רַב טַבָּחִים
  choice: अंगरक्षकों के प्रधान
  rationale: शब्दशः पदवी वध करने वालों या जल्लादों के प्रधान का संकेत दे सकती है, पर राजकीय संदर्भ में यह राजा के अंगरक्षक-दल के अधिकारी की पदवी है। मुख्य पाठ में स्वाभाविक पदवी रखी गई और शाब्दिक अर्थ पादटिप्पणी में सुरक्षित किया गया।
- source_word: וַיֹּלֶךְ
  choice: ले गया
  rationale: הלך के कारक रूप का यहाँ अर्थ किसी को गंतव्य तक ले जाना है। हिन्दी में ‘ले गया’ दिशा और बंदियों को राजा के पास पहुँचाने—दोनों भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֶל מֶלֶךְ בָּבֶל
  choice: बाबेल के राजा के पास
  rationale: אֶל का सीधा अर्थ ‘की ओर/के पास’ है; ‘के सामने’ कहना अनावश्यक व्याख्या जोड़ता।
- source_word: רִבְלָתָה
  choice: रिबला में
  rationale: स्थाननाम के दिशासूचक अंत से रिबला की ओर गति का भाव संभव है, पर वाक्य और प्रसंग में यह स्वाभाविक रूप से रिबला में उपस्थित राजा का स्थान बताता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘अपने साथ लिया’ और ‘ले गया’ मूल की दो अलग क्रियाओं को स्पष्ट रखते हैं। पदवी का प्रासंगिक अर्थ मुख्य पाठ में और उसका कठोर शाब्दिक पक्ष पादटिप्पणी में दिया गया है।
