  text: And he changed out of his prison clothes and ate bread before him continually all the days of his life[a][b].
translation:
  language: hi
  text: उसने कैद के अपने कपड़े बदल लिए[a], और वह जीवन भर लगातार उसके सामने भोजन करता रहा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “उसने अपने कारावास के वस्त्र बदल दिए।”'
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक रूप में: “उसके सामने रोटी खाता रहा”; संभवतः इसका अर्थ है कि वह राजा की उपस्थिति में भोजन करता था।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁנָּה
  choice: बदल लिए
  rationale: यहाँ क्रिया कपड़े बदलने का भाव देती है। हिंदी में ‘अपने कैद के कपड़े बदल लिए’ स्वाभाविक रूप से पुराने वस्त्र उतारकर दूसरे वस्त्र पहनने का अर्थ व्यक्त करता है।
- source_word: אֵת בִּגְדֵי כִלְאוֹ
  choice: अपने कैद के कपड़े
  rationale: בִּגְדֵי का अर्थ ‘कपड़े/वस्त्र’ और כִלְאוֹ का अर्थ उसकी कैद या बंदी अवस्था है। ‘कैद के कपड़े’ सरल, आधुनिक और अर्थ की दृष्टि से सटीक है।
- source_word: וְאָכַל לֶחֶם
  choice: भोजन करता रहा
  rationale: शाब्दिक अर्थ ‘रोटी खाता रहा’ है, पर यह इब्रानी मुहावरा सामान्यतः भोजन करने को दर्शाता है। मुख्य पाठ में स्वाभाविक हिंदी रखी गई है और शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: לְפָנָיו
  choice: उसके सामने
  rationale: यह स्रोत के ‘उसके सामने/उसकी उपस्थिति में’ को सीधे बनाए रखता है और ‘उसकी मेज़ पर’ जैसी अतिरिक्त व्याख्या नहीं जोड़ता।
- source_word: תָּמִיד
  choice: लगातार
  rationale: यह नियमित और निरंतर रूप से जारी रहने का भाव व्यक्त करता है।
- source_word: כָּל יְמֵי חַיָּו
  choice: जीवन भर
  rationale: यह ‘उसके जीवन के सब दिनों’ का स्वाभाविक आधुनिक हिंदी रूप है और पूरी शेष जीवनावधि का अर्थ देता है।
