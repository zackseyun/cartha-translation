base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/023.yaml
  text: There were ninety-six pomegranates toward the outside[a]; all the pomegranates on the lattice all around were one hundred.
translation:
  language: hi
  text: बाहर की ओर अनारों की संख्या छियानवे थी[a]; जाली पर चारों ओर लगे सभी अनार कुल एक सौ थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “एक दिशा में,” अथवा संभवतः “हवा की ओर।” यहाँ प्रयुक्त इब्रानी शब्द कठिन है; आशय संभवतः यह है कि एक ओर से छियानवे अनार गिने गए, जबकि जाली के चारों ओर उनकी कुल संख्या एक सौ थी।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרִמֹּנִים
  choice: अनार
  rationale: रִמּוֹנִים का शाब्दिक अर्थ ‘अनार’ है; यहाँ यह खंभों की सजावट में अनार के आकार के अलंकारों को सूचित करता है। मुख्य पाठ में मूल रूपक बनाए रखने के लिए ‘अनार’ रखा गया है।
- source_word: תִּשְׁעִים וְשִׁשָּׁה
  choice: छियानवे
  rationale: यह सीधी संख्या-संरचना है, जिसका अर्थ 96 है।
- source_word: רוּחָה
  choice: बाहर की ओर
  rationale: दिशासूचक रूप רוּחָה इस स्थापत्य प्रसंग में कठिन और कुछ अस्पष्ट है। ‘बाहर की ओर’ संभावित स्थानिक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि अन्य संभावनाएँ पादटिप्पणी में सुरक्षित हैं।
- source_word: כָּל הָרִמּוֹנִים מֵאָה
  choice: सभी अनार कुल एक सौ थे
  rationale: כָּל और संख्या पूरे परिमाण को बताते हैं। हिन्दी में ‘कुल’ जोड़ने से 96 और 100 के बीच गिनती का संबंध स्पष्ट और स्वाभाविक होता है।
- source_word: הַשְּׂבָכָה
  choice: जाली
  rationale: שְׂבָכָה खंभे के शीर्ष पर बनी जालीदार सजावट को दर्शाता है; ‘जाली’ संक्षिप्त, प्रचलित और स्थापत्य-संदर्भ में सहज है।
- source_word: סָבִיב
  choice: चारों ओर
  rationale: यह परिधि में चारों तरफ होने का भाव देता है; ‘चारों ओर’ आधुनिक हिन्दी का स्वाभाविक समतुल्य है।
