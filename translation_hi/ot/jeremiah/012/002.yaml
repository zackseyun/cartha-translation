  edition: WLC
  text: נְטַעְתָּ/ם֙ גַּם שֹׁרָ֔שׁוּ יֵלְכ֖וּ גַּם עָ֣שׂוּ פֶ֑רִי קָר֤וֹב אַתָּה֙ בְּ/פִי/הֶ֔ם וְ/רָח֖וֹק מִ/כִּלְיוֹתֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/002.yaml
  text: You planted them; they have even taken root. They grow; they even produce fruit. You are near in their mouth[a], but far from their innermost being.
translation:
  language: hi
  text: तूने उन्हें रोपा; उन्होंने जड़ भी पकड़ ली। वे बढ़ते जाते हैं और फल भी उत्पन्न करते हैं। तू उनकी बातों में निकट है, पर उनके अंतरतम[a] से दूर है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “उनके गुर्दों से दूर।” इब्रानी में “गुर्दे” अंतरतम मनुष्य, विशेषकर छिपे विचारों, भावों या उद्देश्यों के लिए प्रयुक्त हो सकते हैं।
    reason: मूल इब्रानी शारीरिक रूपक को सुरक्षित रखते हुए उसके मुहावरेदार अर्थ को स्पष्ट करना।
lexical_decisions:
- source_word: נְטַעְתָּם
  choice: तूने उन्हें रोपा
  rationale: נטע का मूल अर्थ पौधा लगाना या रोपना है। परमेश्वर को संबोधित एकवचन रूप और दुष्टों के लिए बहुवचन कर्म-सर्वनाम दोनों स्पष्ट रखे गए हैं।
- source_word: גַּם שֹׁרָשׁוּ
  choice: उन्होंने जड़ भी पकड़ ली
  rationale: שׁרשׁ कृषि-रूपक में जड़ पकड़ने को दर्शाता है; גַּם का बल ‘भी’ से व्यक्त किया गया है।
- source_word: יֵלְכוּ
  choice: वे बढ़ते जाते हैं
  rationale: הלך का मूल भाव चलने या आगे बढ़ने का है। रोपे जाने, जड़ पकड़ने और फल लाने के कृषि-संदर्भ में ‘बढ़ते जाते हैं’ निरंतर प्रगति को स्वाभाविक हिन्दी में व्यक्त करता है, बिना इसे सीधे ‘समृद्ध होते हैं’ कहकर अर्थ को सीमित किए।
- source_word: גַּם עָשׂוּ פֶרִי
  choice: और फल भी लाते हैं
  rationale: עשה + פרי का मुहावरेदार अर्थ फल उत्पन्न करना है। ‘फल लाते हैं’ हिन्दी में स्वाभाविक है और दूसरा גַּם ‘भी’ के रूप में सुरक्षित है।
- source_word: קָרוֹב אַתָּה בְּפִיהֶם
  choice: तू उनके मुँह में निकट है
  rationale: शाब्दिक मुख-चित्र को बनाए रखा गया है ताकि उनके बाहरी उच्चारण और भीतरी वास्तविकता का विरोध स्पष्ट रहे।
- source_word: וְרָחוֹק מִכִּלְיוֹתֵיהֶם
  choice: पर उनके अंतरतम से दूर है
  rationale: כִּלְיוֹת का शाब्दिक अर्थ ‘गुर्दे’ है, पर इब्रानी मानव-विज्ञान में यह छिपे विचारों, भावों और उद्देश्यों सहित भीतरी व्यक्ति को दर्शाता है। ‘अंतरतम’ आधुनिक हिन्दी में इस आशय को संक्षेप और गरिमा से व्यक्त करता है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: כִּלְיוֹתֵיהֶם में भीतरी मनुष्य का शारीरिक रूपक
  choice: मुख्य पाठ में ‘उनके अंतरतम’
  alternative: ‘उनके गुर्दों’ अथवा ‘उनके अंतःकरण’
  rationale: यहाँ बाहरी वाणी और परमेश्वर से दूर भीतरी वास्तविकता के बीच तनाव है। ‘अंतरतम’ उस विरोध को समझने योग्य बनाता है, जबकि पादटिप्पणी मूल शारीरिक रूपक को सुरक्षित रखती है। ‘अंतःकरण’ नैतिक विवेक का अपेक्षाकृत संकरा अर्थ ला सकता है, इसलिए उसे नहीं चुना गया।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। परमेश्वर के लिए निकट, प्रत्यक्ष संबोधन ‘तू’ रखा गया है। कृषि-रूपक की क्रमिकता—रोपना, जड़ पकड़ना, बढ़ना और फल लाना—बनाए रखी गई है।
