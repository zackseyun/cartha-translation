  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה עַל כָּל שְׁכֵנַ/י֙ הָֽ/רָעִ֔ים הַ/נֹּֽגְעִים֙ בַּֽ/נַּחֲלָ֔ה אֲשֶׁר הִנְחַ֥לְתִּי אֶת עַמִּ֖/י אֶת יִשְׂרָאֵ֑ל הִנְ/נִ֤י נֹֽתְשָׁ/ם֙ מֵ/עַ֣ל אַדְמָתָ֔/ם וְ/אֶת בֵּ֥ית יְהוּדָ֖ה אֶתּ֥וֹשׁ מִ/תּוֹכָֽ/ם׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/014.yaml
  text: 'Thus says Yahweh concerning all my wicked neighbors who touch the inheritance that I caused my people Israel to inherit: behold[a], I am about to uproot them from upon their land[b], and I will uproot the house of Judah from among them.'
translation:
  language: hi
  text: 'याहवे यों कहते हैं: “मेरे उन सभी दुष्ट पड़ोसियों के विषय में, जो उस विरासत को छूते हैं[a] जिसे मैंने अपनी प्रजा इस्राएल को विरासत में दिया है—देखो, मैं उन्हें उनकी भूमि से उखाड़ने वाला हूँ[b], और यहूदा के घराने को भी उनके बीच से उखाड़ दूँगा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में शाब्दिक रूप से “विरासत को छूते हैं”; संदर्भ में शत्रुतापूर्वक दखल देना या अतिक्रमण करना अभिप्रेत है।
    reason: lexical_alternative
  - marker: b
    text: या “मैं उन्हें उखाड़ दूँगा।” यह इब्रानी क्रिया यिर्मयाह में न्याय के रूपक के तौर पर बार-बार प्रयुक्त होती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: याहवे यों कहते हैं
  rationale: प्रचलित भविष्यद्वाणी-संदेश सूत्र को स्वाभाविक, गरिमापूर्ण हिन्दी में रखा गया है और परमेश्वर के व्यक्तिगत नाम को ‘याहवे’ के रूप में प्रस्तुत किया गया है।
- source_word: שְׁכֵנַי הָרָעִים
  choice: मेरे उन सभी दुष्ट पड़ोसियों
  rationale: ‘पड़ोसी’ आसपास के शत्रुतापूर्ण राष्ट्रों को सूचित करता है; ‘दुष्ट’ רָעִים के नैतिक और विरोधी भाव को व्यक्त करता है।
- source_word: הַנֹּגְעִים בַּנַּחֲלָה
  choice: जो उस विरासत पर हाथ डालते हैं
  rationale: नגע का मूल अर्थ ‘छूना’ है, पर संदर्भ में भूमि में शत्रुतापूर्ण हस्तक्षेप निहित है। हिन्दी मुहावरा ‘हाथ डालना’ मूल बिंब और अतिक्रमण—दोनों को बनाए रखता है।
- source_word: אֲשֶׁר הִנְחַלְתִּי אֶת עַמִּי אֶת יִשְׂרָאֵל
  choice: जिसे मैंने अपनी प्रजा इस्राएल को विरासत में दिया है
  rationale: हिफ़ील क्रिया का अर्थ ‘विरासत में देना/अधिकारी बनाना’ है; ‘विरासत’ की पुनरावृत्ति נחלה और נחל के शब्द-संबंध को सुरक्षित रखती है।
- source_word: הִנְנִי נֹתְשָׁם
  choice: देखो, मैं उन्हें ... उखाड़ने वाला हूँ
  rationale: הִנְנִי के बलाघात और उसके साथ आए कृदंत से निकट भविष्य में होने वाली निश्चित कार्रवाई व्यक्त होती है।
- source_word: מֵעַל אַדְמָתָם
  choice: उनकी भूमि पर से
  rationale: यह מֵעַל के ‘ऊपर से/पर से’ और אַדְמָה के भूमि-संबंधी अर्थ को स्वाभाविक हिन्दी में दर्शाता है।
- source_word: בֵּית יְהוּדָה
  choice: यहूदा के घराने
  rationale: राष्ट्रीय-सामूहिक पदबंध ‘यहूदा का घराना’ बनाए रखा गया है, इसे केवल ‘यहूदा’ नहीं किया गया।
- source_word: אֶתּוֹשׁ מִתּוֹכָם
  choice: उनके बीच से उखाड़ दूँगा
  rationale: נתש के उसी उखाड़ने वाले न्याय-बिंब को दोहराया गया है और מִתּוֹכָם को ‘उनके बीच से’ के रूप में सुरक्षित रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे आया है; ‘याहवे’ उसे पदवी में बदले बिना प्रस्तुत करता है।
- issue: הִנְנִי के बाद कृदंत נֹתְשָׁם का काल-पक्ष
  choice: मैं ... उखाड़ने वाला हूँ
  alternative: मैं ... उखाड़ दूँगा / मैं ... उखाड़ रहा हूँ
  rationale: यह रचना आसन्न और निश्चित ईश्वरीय कार्रवाई का संकेत देती है; हिन्दी का ‘करने वाला हूँ’ इसी तनाव को स्वाभाविक रूप से रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण भविष्यद्वाणी-रजिस्टर अपनाया गया है। वाक्य को समझने योग्य रखते हुए ‘विरासत’, ‘उखाड़ना’ और ‘यहूदा का घराना’ जैसे मूल के प्रमुख बिंब व पदबंध सुरक्षित रखे गए हैं।
