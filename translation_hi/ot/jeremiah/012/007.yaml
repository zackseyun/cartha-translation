source:
  edition: WLC
  text: עָזַ֨בְתִּי֙ אֶת בֵּיתִ֔/י נָטַ֖שְׁתִּי אֶת נַחֲלָתִ֑/י נָתַ֛תִּי אֶת יְדִד֥וּת נַפְשִׁ֖/י בְּ/כַ֥ף אֹיְבֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/007.yaml
  text: I have forsaken my house[a]; I have abandoned my inheritance[c][b]; I have given the beloved of my soul into the hand of her enemies.
translation:
  language: hi
  text: 'मैंने अपना घर छोड़ दिया है;

    मैंने अपनी विरासत त्याग दी है;

    मैंने मेरे प्राणों की प्रिया[a] को उसके शत्रुओं[b] के हाथ में[c] दे दिया है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मेरे प्राणों की प्रिया’ आत्मीय स्नेह का पदबंध है; इसका अर्थ ‘जो मुझे प्राणों से प्रिय है’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: मूल इब्रानी में ‘उसके’ के लिए स्त्रीलिंग रूप है। इसका संकेत विरासत, व्यक्तिरूप में यहूदा/यरूशलेम, या प्रिया की ओर हो सकता है; पाठ इसे अधिक स्पष्ट नहीं करता।
    reason: alternative_reading
  - marker: c
    text: शाब्दिक रूप से ‘उसके शत्रुओं की हथेली में’; यह उनके अधिकार या वश में दिए जाने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עָזַבְתִּי
  choice: मैंने ... छोड़ दिया है
  rationale: यह काल और पूर्ण की गई क्रिया को व्यक्त करता है। ‘छोड़ दिया’ सामान्य आधुनिक हिन्दी में स्वाभाविक है और प्रसंग में परित्याग की गंभीरता भी रखता है।
- source_word: בֵּיתִי
  choice: अपना घर
  rationale: मूल शब्द का सामान्य अर्थ ‘घर’ है। यहाँ ‘मन्दिर’ या ‘घराना’ निश्चित कर देना मूल की व्यापकता को अनावश्यक रूप से सीमित करता।
- source_word: נָטַשְׁתִּי
  choice: मैंने ... त्याग दी है
  rationale: यह पहले क्रियापद के समानांतर है, पर उससे अलग शब्द है। ‘त्याग दी’ समानार्थकता और काव्यात्मक विविधता दोनों बनाए रखता है।
- source_word: נַחֲלָתִי
  choice: अपनी विरासत
  rationale: यह शब्द उत्तराधिकार में मिली भूमि, निज संपत्ति या वाचा-संबंधी प्रजा का संकेत दे सकता है। ‘विरासत’ इन अर्थ-संभावनाओं को खुला रखता है।
- source_word: נָתַתִּי
  choice: मैंने ... दे दिया है
  rationale: मूल क्रिया का सीधा अर्थ ‘देना’ है; शत्रुओं के अधिकार में सौंपे जाने का भाव आगे के वाक्यांश से स्पष्ट होता है।
- source_word: יְדִדוּת נַפְשִׁי
  choice: अपने प्राणों की प्रिया
  rationale: यह आत्मीय स्नेह का गहरा पदबंध है। ‘प्राणों की प्रिया’ उसके प्रेमपूर्ण और काव्यात्मक स्वर को बनाए रखता है, यद्यपि आधुनिक पाठक के लिए स्पष्टीकरण पादटिप्पणी में दिया गया है।
- source_word: בְּכַף
  choice: के हाथ में
  rationale: शाब्दिक अर्थ ‘हथेली में’ है, पर यहाँ यह किसी के अधिकार या वश में देने का मुहावरा है। हिन्दी में ‘हाथ में’ रूप और मुहावरे, दोनों को स्वाभाविक रूप से रखता है।
- source_word: אֹיְבֶיהָ
  choice: उसके शत्रुओं
  rationale: मूल में स्त्रीलिंग एकवचन प्रत्यय है। हिन्दी का ‘उसके’ व्याकरणिक लिंग प्रकट नहीं करता, लेकिन निकटवर्ती स्त्रीलिंग ‘प्रिया’ और ‘विरासत’ दोनों से संबंध की संभावना खुली रखता है।
theological_decisions:
- issue: ‘उसके शत्रुओं’ में स्त्रीलिंग प्रत्यय का संदर्भ
  choice: संदर्भ को अनिर्धारित रखते हुए ‘उसके शत्रुओं’ कहा गया है।
  alternative: ‘यहूदा के शत्रुओं’, ‘यरूशलेम के शत्रुओं’ या ‘उस प्रिया के शत्रुओं’ के रूप में संदर्भ स्पष्ट करना।
  rationale: मूल इब्रानी स्त्रीलिंग प्रत्यय देता है, पर यह निश्चित नहीं करता कि उसका संकेत विरासत, व्यक्तिरूप में यहूदा/यरूशलेम, या प्रिया की ओर है। अनुवाद इस काव्यात्मक और धर्मवैचारिक अस्पष्टता को सुरक्षित रखता है।
- issue: ‘मेरे घर’ की पहचान
  choice: ‘अपना घर’ को बिना व्याख्यात्मक विस्तार के रखा गया है।
  alternative: ‘अपना मन्दिर’ या ‘अपने घराने’ के रूप में स्पष्ट करना।
  rationale: प्रसंग में मन्दिर, प्रजा या वाचा-समुदाय की प्रतिध्वनि संभव है, पर मूल पद केवल ‘घर’ कहता है; किसी एक पहचान को पाठ में निश्चित करना उचित नहीं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। तीन समानांतर प्रथम-पुरुष वाक्यों से इब्रानी की लय और क्रम सुरक्षित हैं। ‘प्राणों की प्रिया’ अपेक्षाकृत ऊँचा काव्यात्मक प्रयोग है, पर पादटिप्पणी इसे सामान्य पाठक के लिए स्पष्ट करती है।
