base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/010.yaml
  text: Many shepherds have ruined my vineyard[a]; they have trampled my portion[b]; they have made my pleasant portion a desolate wilderness.
translation:
  language: hi
  text: बहुत-से चरवाहों ने मेरी दाखबारी उजाड़ दी है[a]; उन्होंने मेरे भू-भाग को पैरों तले रौंदा है; उन्होंने मेरे मनभावने भू-भाग को उजाड़ बियाबान बना दिया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बहुत-से शासक” अथवा “बहुत-से अगुए”; इब्रानी में शाब्दिक अर्थ “चरवाहे” है, जो शासन या देखरेख करनेवालों के लिए भविष्यद्वाणी-साहित्य में एक सामान्य रूपक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹעִים רַבִּים
  choice: बहुत-से चरवाहों
  rationale: ‘चरवाहों’ मूल रूपक को बनाए रखता है; भविष्यद्वाणी के प्रसंग में यह शासकों या अगुओं को भी सूचित कर सकता है।
- source_word: שִׁחֲתוּ
  choice: उजाड़ दी है
  rationale: यह क्रिया बिगाड़ने, नष्ट करने या बरबाद करने का भाव देती है; दाखबारी के संदर्भ में ‘उजाड़ दी’ स्वाभाविक और सशक्त है।
- source_word: כַרְמִי
  choice: मेरी दाखबारी
  rationale: मूल कृषि-रूपक को सीधे और आधुनिक मानक हिन्दी में व्यक्त करता है।
- source_word: בֹּסְסוּ
  choice: पैरों तले रौंदा है
  rationale: मूल क्रिया के भौतिक और विध्वंसकारी बिंब को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: חֶלְקָתִי
  choice: मेरे भू-भाग
  rationale: חֶלְקָה किसी हिस्से या भूमि के खंड को दर्शाता है; ‘भू-भाग’ भूमि-संबंधी अर्थ को स्पष्ट रखते हुए ‘विरासत’ जैसी व्याख्या नहीं जोड़ता।
- source_word: נָתְנוּ
  choice: बना दिया है
  rationale: לְ के साथ यह रचना परिणामी अर्थ देती है—किसी वस्तु को दूसरी दशा में कर देना।
- source_word: חֶלְקַת חֶמְדָּתִי
  choice: मेरे मनभावने भू-भाग
  rationale: חֶמְדָּה में प्रिय, वांछनीय और मनोहर होने का भाव है; ‘मनभावने’ वक्ता के भावनात्मक लगाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְמִדְבַּר שְׁמָמָה
  choice: उजाड़ मरुभूमि
  rationale: ‘मरुभूमि’ निर्जन प्रदेश और ‘उजाड़’ विनाश की अवस्था व्यक्त करता है; दोनों मिलकर मूल पदबंध का संक्षिप्त और स्वाभाविक रूप देते हैं।
theological_decisions:
- issue: क्या ‘चरवाहों’ को मुख्य पाठ में शासक या अगुए कहकर स्पष्ट किया जाए
  choice: मुख्य पाठ में ‘चरवाहों’ का रूपक बनाए रखना
  alternative: शासक; अगुए
  rationale: मूल इब्रानी सीधे रूपक का प्रयोग करती है। इसे बनाए रखने से भविष्यद्वाणी का साहित्यिक और धर्मवैचारिक बहुस्तरीय अर्थ सुरक्षित रहता है।
- issue: क्या दाखबारी और भू-भाग को यहूदा, इस्राएल या देश के रूप में स्पष्ट किया जाए
  choice: भूमि-संबंधी रूपकों को बनाए रखना
  alternative: मेरा देश; मेरी विरासत
  rationale: पद में दाखबारी और भूमि के हिस्से के परस्पर जुड़े बिंब हैं; किसी एक ऐतिहासिक या धर्मवैचारिक संदर्भ में उन्हें सीमित करना मूल की अर्थगत व्यापकता घटा देगा।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘दाखबारी’, ‘चरवाहों’, ‘भू-भाग’ और ‘मरुभूमि’ मूल के कृषि तथा भूमि-संबंधी बिंबों को बनाए रखते हैं। केवल आवश्यक वैकल्पिक अर्थ के लिए पादटिप्पणी दी गई है।
