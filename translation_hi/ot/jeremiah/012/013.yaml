source:
  edition: WLC
  text: זָרְע֤וּ חִטִּים֙ וְ/קֹצִ֣ים קָצָ֔רוּ נֶחְל֖וּ לֹ֣א יוֹעִ֑לוּ וּ/בֹ֨שׁוּ֙ מִ/תְּבוּאֹ֣תֵי/כֶ֔ם מֵ/חֲר֖וֹן אַף יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/013.yaml
  text: They have sown wheat[a], but they have reaped thorns; they have exhausted themselves, but they profit nothing. Be ashamed of your produce because of the burning anger of Yahweh.
translation:
  language: hi
  text: 'उन्होंने गेहूँ बोया, पर काँटे काटे;

    उन्होंने अपने को थका डाला, पर उन्हें कोई लाभ न हुआ।

    याहवे के धधकते क्रोध के कारण

    अपनी उपज के विषय में लज्जित होओ।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे के धधकते क्रोध के कारण तुम अपनी उपज के विषय में लज्जित होगे,” यदि וּבֹשׁוּ को आज्ञा के बजाय भविष्यसूचक कथन माना जाए।
    reason: alternative_reading
lexical_decisions:
- source_word: זָרְעוּ חִטִּים
  choice: उन्होंने गेहूँ बोया
  rationale: זָרְעוּ पूर्ण क्रिया है और חִטִּים का विशिष्ट अर्थ ‘गेहूँ’ है। हिन्दी में सामान्य भूतकाल इस पूरी हो चुकी क्रिया को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְקֹצִים קָצָרוּ
  choice: पर काँटे काटे
  rationale: וְ का मूल अर्थ ‘और’ है, पर यहाँ गेहूँ बोने और काँटे पाने का स्पष्ट विरोध है; इसलिए ‘पर’ अर्थ-संबंध को स्वाभाविक हिन्दी में प्रकट करता है। קצר की कटनी-संबंधी छवि बनाए रखने के लिए ‘काटे’ चुना गया है।
- source_word: נֶחְלוּ
  choice: वे थक गए
  rationale: इस संदर्भ में חלה के निफ़अल रूप का आशय श्रम से निर्बल या थका होना है। ‘वे थक गए’ सहज हिन्दी है और संदिग्ध ‘विरासत पाना’ वाले विश्लेषण से बचता है।
- source_word: לֹא יוֹעִלוּ
  choice: उन्हें कोई लाभ न हुआ
  rationale: יעל के हिफ़इल रूप का अर्थ लाभ या फायदा पहुँचाना है। यह प्रयोग निष्फल परिश्रम का भाव स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וּבֹשׁוּ
  choice: लज्जित होओ
  rationale: रूप को पुल्लिंग बहुवचन आज्ञार्थक मानते हुए प्रत्यक्ष संबोधन रखा गया है। इससे तीसरे पुरुष के वर्णन से दूसरे पुरुष की तीखी भविष्यद्वाणी-संबंधी फटकार की ओर बदलाव सुरक्षित रहता है।
- source_word: מִתְּבוּאֹתֵיכֶם
  choice: अपनी उपज पर
  rationale: תְּבוּאָה खेत की उपज, पैदावार या कटनी को दर्शाता है। ‘उपज’ आधुनिक हिन्दी में संक्षिप्त और व्यापक है; ‘अपनी’ दूसरे पुरुष बहुवचन प्रत्यय को संबोधन के अनुरूप व्यक्त करता है।
- source_word: מֵחֲרוֹן אַף
  choice: धधकते क्रोध के कारण
  rationale: חֲרוֹן אַף तीव्र या जलते हुए क्रोध का मुहावरा है। ‘धधकते क्रोध’ उसकी अग्नि-संबंधी छवि बनाए रखता है और מִן को यहाँ कारणसूचक रूप में व्यक्त किया गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी परमेश्वर के व्यक्तिगत नाम יהוה को उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण ‘याहवे’ से व्यक्त किया गया है।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: प्रभु; यहोवा
  rationale: मूल पाठ में वाचा-संबंधी व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उस नाम को उपाधि में बदले बिना सुरक्षित रखता है।
- issue: וּבֹשׁוּ का आज्ञार्थक या भविष्यसूचक अर्थ
  choice: 'प्रत्यक्ष संबोधन में आज्ञार्थक: ‘लज्जित होओ’'
  alternative: 'भविष्यसूचक: ‘तुम ... लज्जित होगे’'
  rationale: दूसरे पुरुष बहुवचन रूप और अगले शब्द के ‘तुम्हारी उपज’ प्रत्यय के कारण आज्ञार्थक पाठ स्वाभाविक है। फिर भी भविष्यसूचक अर्थ व्याकरण की दृष्टि से संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। कृषि-संबंधी समानांतरता ‘गेहूँ बोया/काँटे काटे’ में सुरक्षित है। तीसरे पुरुष के वर्णन से दूसरे पुरुष के प्रत्यक्ष संबोधन की आकस्मिक शैलिगत करवट जानबूझकर बनाए रखी गई है। पादटिप्पणी का चिह्न उसी विवादित क्रिया ‘लज्जित होओ’ के बाद रखा गया है।
