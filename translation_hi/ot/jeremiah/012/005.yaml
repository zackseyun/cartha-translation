id: JER.12.5
reference: Jeremiah 12:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֣י אֶת רַגְלִ֥ים רַ֨צְתָּה֙ וַ/יַּלְא֔וּ/ךָ וְ/אֵ֥יךְ תְּתַֽחֲרֶ֖ה אֶת הַ/סּוּסִ֑ים וּ/בְ/אֶ֤רֶץ שָׁלוֹם֙ אַתָּ֣ה בוֹטֵ֔חַ וְ/אֵ֥יךְ תַּעֲשֶׂ֖ה בִּ/גְא֥וֹן הַ/יַּרְדֵּֽן־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/005.yaml
  text: If you have run with footmen and they have worn you out[a], then how will you compete with horses? And if in a land of peace you feel secure, then what will you do in the thicket of the Jordan?
translation:
  language: hi
  text: यदि तू पैदल लोगों के साथ दौड़ा और उन्होंने तुझे थका दिया, तो तू घोड़ों के साथ कैसे होड़ लगाएगा? यदि तू शान्ति के देश में अपने को सुरक्षित समझता है, तो यरदन की घनी झाड़ियों[a] में क्या करेगा?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यरदन के गर्व/वैभव में” अथवा “यरदन के उफान में।” इब्रानी पद גְּאוֹן הַיַּרְדֵּן का अर्थ विवादित है; यह यरदन के किनारे की घनी झाड़ियों, नदी के उफान, या अधिक शाब्दिक रूप से उसके “गर्व/वैभव” की ओर संकेत कर सकता है।
    reason: वैकल्पिक पाठार्थ
lexical_decisions:
- source_word: רַגְלִים
  choice: पैदल चलनेवाले
  rationale: शाब्दिक अर्थ ‘पैरोंवाले/पैदल लोग’ है; घोड़ों के साथ तुलना के कारण यहाँ पैदल दौड़नेवाले अभिप्रेत हैं। यह ‘पैदल सैनिक’ से कम सैन्य-विशिष्ट है और मूल की व्यापकता बनाए रखता है।
- source_word: רַצְתָּה
  choice: तू ... दौड़ा
  rationale: क्रिया का सीधा अर्थ ‘दौड़ना’ है; शर्तवाचक वाक्य में हिन्दी का सामान्य भूतकाल स्वाभाविक है।
- source_word: וַיַּלְאוּךָ
  choice: उन्होंने तुझे थका दिया
  rationale: לאה का अर्थ थका देना या क्लान्त कर देना है। यह अभिव्यक्ति आधुनिक हिन्दी में सहज और अर्थ की दृष्टि से निकट है।
- source_word: תְּתַחֲרֶה
  choice: तू ... होड़ लगाएगा
  rationale: क्रिया प्रतिस्पर्धा या मुकाबले में उतरने का भाव देती है। दौड़ने के बिम्ब में ‘होड़ लगाना’ स्वाभाविक है और इसे केवल दौड़ तक सीमित नहीं करता।
- source_word: הַסּוּסִים
  choice: घोड़े
  rationale: सीधा शब्दार्थ; पैदल लोगों के मुकाबले कठिनतर चुनौती को प्रकट करता है।
- source_word: בְאֶרֶץ שָׁלוֹם
  choice: शान्ति के देश में
  rationale: मूल की संज्ञात्मक संरचना ‘शान्ति का देश’ सुरक्षित, उपद्रवरहित परिस्थिति का संकेत देती है।
- source_word: בּוֹטֵחַ
  choice: अपने को सुरक्षित समझता है
  rationale: בטח यहाँ भरोसा करने और सुरक्षित या निश्चिन्त होने के बीच अर्थ रख सकता है। प्रसंग में अनुकूल परिस्थितियों के बीच सुरक्षा का अनुभव मुख्य है; यह अनुवाद उसी स्थितिगत भाव को व्यक्त करता है।
- source_word: תַּעֲשֶׂה
  choice: क्या करेगा
  rationale: עשה व्यापक अर्थ वाली क्रिया है; इस आलंकारिक प्रश्न में ‘क्या करेगा’ सीधा और स्वाभाविक है।
- source_word: גְּאוֹן הַיַּרְדֵּן
  choice: यरदन का घना जंगल
  rationale: यह विवादित पद यरदन के किनारे की घनी और खतरनाक वनस्पति का द्योतक हो सकता है। मुख्य पाठ में संभावित भौगोलिक आशय दिया गया है, जबकि शाब्दिक विकल्प पादटिप्पणी में सुरक्षित हैं।
theological_decisions:
- issue: בּוֹטֵחַ का प्रसंगगत अर्थ
  choice: परिस्थितिजन्य सुरक्षा—‘अपने को सुरक्षित समझता है’
  alternative: ‘भरोसा रखता है’ या ‘सुरक्षित है’
  rationale: पद सामान्य कठिनाई और अधिक बड़े खतरे की तुलना करता है; इसमें परमेश्वर पर विश्वास का स्पष्ट उल्लेख नहीं है। चुनी हुई अभिव्यक्ति बिना धर्मवैज्ञानिक अर्थ जोड़े सुरक्षा की अनुभूति को रखती है।
- issue: גְּאוֹן הַיַּרְדֵּן की व्याख्या
  choice: यरदन के किनारे का खतरनाक घना जंगल
  alternative: ‘यरदन का गर्व/वैभव’ अथवा ‘यरदन की बाढ़/उफान’
  rationale: इब्रानी पद बहुअर्थी और विवादित है। मुख्य पाठ प्रसंग में सर्वाधिक सम्भावित ठोस स्थल को व्यक्त करता है, और पादटिप्पणी अन्य वास्तविक सम्भावनाएँ देकर अस्पष्टता को पारदर्शी रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किन्तु गरिमापूर्ण रूप अपनाया गया है। परमेश्वर द्वारा यिर्मयाह को सीधे सम्बोधन के अनुरूप एकवचन ‘तू’ रखा गया है। ‘घना जंगल’ सामान्य पाठक के लिए बोधगम्य है, और विवादित इब्रानी मुहावरे की अन्य सम्भावनाएँ पादटिप्पणी में दी गई हैं।
