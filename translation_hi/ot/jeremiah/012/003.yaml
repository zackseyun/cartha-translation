id: JER.12.3
reference: Jeremiah 12:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אַתָּ֤ה יְהוָה֙ יְדַעְתָּ֔/נִי תִּרְאֵ֕/נִי וּ/בָחַנְתָּ֥ לִבִּ֖/י אִתָּ֑/ךְ הַתִּקֵ/ם֙ כְּ/צֹ֣אן לְ/טִבְחָ֔ה וְ/הַקְדִּשֵׁ֖/ם לְ/י֥וֹם הֲרֵגָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/003.yaml
  text: But you[a], O Yahweh, know me; you see me, and you test my heart toward you. Pull them out like sheep for slaughter[c][b], and set them apart for the day of killing.
translation:
  language: hi
  text: परन्तु हे याहवे, आप मुझे जानते हैं; आप मुझे देखते हैं और जाँचते हैं कि मेरा हृदय आपकी ओर लगा है।[a] उन्हें वध के लिए भेड़ों की तरह खींचकर निकालिए और उन्हें अलग ठहराइए[b] मार डालने के दिन के लिए।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरा हृदय आपके साथ है।” इब्रानी वाक्यांश बहुत संक्षिप्त है और यह याहवे के प्रति यिर्मयाह के भीतरी झुकाव या निष्ठा को व्यक्त कर सकता है।
    reason: alternative_reading
  - marker: b
    text: या “उन्हें समर्पित कीजिए।” मूल अर्थ है किसी उद्देश्य के लिए अलग करना; यहाँ यह आशीष के लिए नहीं, दण्ड के लिए है।
    reason: lexical_alternative
  - marker: c
    text: या “वध के दिन के लिए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में निकट लिप्यंतरण के रूप में रखा गया है।
- source_word: יְדַעְתָּנִי
  choice: आप मुझे जानते हैं
  rationale: इब्रानी पूर्ण क्रिया यहाँ वर्तमान में बनी हुई वास्तविकता व्यक्त करती है; यह स्वाभाविक हिन्दी में यिर्मयाह के विषय में यहवे के सच्चे ज्ञान को बताती है।
- source_word: תִּרְאֵנִי
  choice: आप मुझे देखते हैं
  rationale: यह केवल शारीरिक दृष्टि नहीं, बल्कि भली-भाँति देखने और पहचानने का भाव रखता है तथा ‘जानते हैं’ के समानांतर है।
- source_word: וּבָחַנְתָּ לִבִּי
  choice: मेरे हृदय को जाँचते हैं
  rationale: בחן किसी के भीतरी चरित्र को परखने या जाँचने का बोध देता है; ‘हृदय’ के मूल रूपक को बनाए रखा गया है।
- source_word: אִתָּךְ
  choice: वह आपकी ओर है
  rationale: संक्षिप्त और व्याकरण की दृष्टि से कठिन इब्रानी पदबंध को यिर्मयाह के हृदय की यहवे की ओर अभिमुखता के रूप में व्यक्त किया गया है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: הַתִּקֵם
  choice: उन्हें ... खींचकर निकालिए
  rationale: נתק के हिफ़ील रूप में खींचकर अलग निकालने का अर्थ है; यह वध के लिए ले जाई जा रही भेड़ों की उपमा को स्पष्ट और सशक्त रखता है।
- source_word: כְּצֹאן לְטִבְחָה
  choice: वध के लिए भेड़ों के समान
  rationale: यह वध के लिए नियत भेड़ों की स्पष्ट उपमा है; ‘वध’ मूल की कठोरता को बिना नरम किए व्यक्त करता है।
- source_word: וְהַקְדִּשֵׁם
  choice: उन्हें अलग ठहराइए
  rationale: קדש के हिफ़ील का मूल भाव किसी विशेष उद्देश्य के लिए अलग करना है। यहाँ उद्देश्य दण्ड है, इसलिए ऐसा शब्द चुना गया है जो सकारात्मक पवित्रीकरण का अनावश्यक संकेत न दे।
- source_word: לְיוֹם הֲרֵגָה
  choice: मार डालने के दिन के लिए
  rationale: यह हत्या या संहार के दिन की सीधी और कठोर छवि बनाए रखता है; ‘वध के दिन’ को पादटिप्पणी में वैकल्पिक रूप से दिया गया है।
theological_decisions:
- issue: दुष्टों के विरुद्ध दण्ड की प्रार्थना
  choice: यिर्मयाह की प्रार्थना को वध और मार डालने की स्पष्ट भाषा सहित सीधे रूप में प्रस्तुत किया गया है।
  alternative: इसे केवल रूपकात्मक अनावरण मानना या ‘न्याय के लिए तैयार कीजिए’ कहकर हिंसक चित्र को नरम करना।
  rationale: इब्रानी पाठ वध और मार डालने की भाषा स्पष्ट रूप से प्रयोग करता है। अनुवाद उसकी गंभीरता बनाए रखता है, पर पाठ से बाहर कोई अतिरिक्त धार्मिक औचित्य नहीं जोड़ता।
- issue: אִתָּךְ के साथ हृदय का सम्बन्ध
  choice: ‘वह आपकी ओर है’—हृदय की यहवे की ओर अभिमुखता या निष्ठा।
  alternative: ‘मेरा हृदय आपके साथ है।’
  rationale: इब्रानी पदबंध अत्यन्त संक्षिप्त और वास्तविक रूप से संदिग्ध है। मुख्य पाठ में स्वाभाविक हिन्दी दी गई है और दूसरी सम्भावना पादटिप्पणी में रखी गई है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी अपनाई गई है। परमेश्वर को आदरपूर्वक ‘आप’ कहा गया है। काव्यात्मक समानांतरता और न्याय की कठोर छवि सुरक्षित रखी गई है; कठिन इब्रानी पदबंध की अस्पष्टता पादटिप्पणी में स्पष्ट की गई है।
