- from: परन्तु हे यहवे, आप मुझे जानते हैं; आप मुझे देखते हैं और मेरे हृदय को जाँचते हैं—वह आपकी ओर है।[a] उन्हें वध के लिए भेड़ों के समान खींचकर निकालिए और मार डालने के दिन के लिए उन्हें अलग ठहराइए।[b][c]
