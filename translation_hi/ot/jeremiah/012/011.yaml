  text: שָׂמָ/הּ֙ לִ/שְׁמָמָ֔ה אָבְלָ֥ה עָלַ֖/י שְׁמֵמָ֑ה נָשַׁ֨מָּה֙ כָּל הָ/אָ֔רֶץ כִּ֛י אֵ֥ין אִ֖ישׁ שָׂ֥ם עַל לֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/011.yaml
  text: They have made it a desolation[a]; it mourns before me, desolate. The whole land is laid waste[c][b], because no one takes it to heart.
translation:
  language: hi
  text: उन्होंने उसे उजाड़ बना दिया है[a]; वह मेरे सामने उजड़ी हुई शोक मना रही है। पूरा देश उजाड़ पड़ा है[b], क्योंकि कोई भी इसे गंभीरता से नहीं लेता[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने उसे उजाड़ बना दिया है”; हिब्रू क्रिया एकवचन में है, जबकि “उन्होंने” पिछले पद में आए विनाशकों को कर्ता मानता है।
    reason: alternative_reading
  - marker: b
    text: “देश” का अनुवाद “भूमि” या “पृथ्वी” भी हो सकता है; यहाँ संभवतः यहूदा का देश अभिप्रेत है।
    reason: alternative_reading
  - marker: c
    text: शाब्दिक रूप से, “कोई मन पर नहीं रखता”; यह मुहावरा किसी बात को गंभीरता से लेने या उस पर ध्यान देने को व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂמָהּ
  choice: उन्होंने उसे … बना दिया है
  rationale: क्रिया रूप व्याकरणतः एकवचन पुल्लिंग है—शाब्दिक रूप से ‘उसने उसे बनाया’—पर पिछले पद के विनाशकों को प्रसंगगत कर्ता मानकर हिन्दी में बहुवचन ‘उन्होंने’ स्वाभाविक है; वैकल्पिक शाब्दिक पाठ पादटिप्पणी में रखा गया है।
- source_word: לִשְׁמָמָה
  choice: उजाड़
  rationale: שְׁמָמָה पूर्ण विनाश और निर्जनता की दशा बताता है। ‘उजाड़’ आधुनिक हिन्दी में संक्षिप्त, प्रबल और स्वाभाविक है।
- source_word: אָבְלָה
  choice: शोक मना रही है
  rationale: אבל का मूल अर्थ ‘शोक करना’ है। भूमि के स्त्रीलिंग मानवीकरण को हिन्दी में बनाए रखा गया है।
- source_word: עָלַי
  choice: मेरे सामने
  rationale: यहाँ भूमि का शोक परमेश्वर की दृष्टि/उपस्थिति में होने का भाव है; ‘मेरे सामने’ हिन्दी में यही संबंध सहजता से व्यक्त करता है।
- source_word: שְׁמֵמָה
  choice: उजड़ी हुई
  rationale: विशेषणात्मक रूप भूमि की उजड़ी दशा बताता है और ‘शोक मना रही है’ के साथ हिब्रू की संक्षिप्त वर्णनात्मक संरचना बनाए रखता है।
- source_word: נָשַׁמָּה
  choice: उजाड़ पड़ा है
  rationale: यह रूप उजाड़ हो जाने की परिणामी अवस्था व्यक्त करता है। ‘उजाड़ पड़ा है’ स्वाभाविक हिन्दी है और वर्तमान विनाश-दशा पर बल देता है।
- source_word: כָּל הָאָרֶץ
  choice: पूरा देश
  rationale: אֶרֶץ का अर्थ ‘भूमि/देश/पृथ्वी’ हो सकता है। निकट प्रसंग यहूदा के देश की तबाही का है, इसलिए ‘पूरा देश’ चुना गया है।
- source_word: כִּי אֵין אִישׁ
  choice: क्योंकि कोई भी
  rationale: אִישׁ यहाँ सामान्य मानव-संदर्भ में है। हिन्दी में ‘कोई भी’ उसके सार्वत्रिक नकार को स्वाभाविक और अर्थनिष्ठ ढंग से व्यक्त करता है।
- source_word: שָׂם עַל לֵב
  choice: इस बात को मन में नहीं रखता
  rationale: शाब्दिक मुहावरा ‘हृदय पर रखना’ है, जिसका अर्थ गंभीरता से ध्यान देना या भीतर विचार करना है। ‘मन में रखना’ हिन्दी में आंतरिक ध्यान की छवि को बनाए रखता है।
theological_decisions:
- issue: אֶרֶץ का संदर्भ
  choice: देश
  alternative: पृथ्वी
  rationale: यिर्मयाह 12 के निकट साहित्यिक प्रसंग में यह यहूदा और उसकी भूमि की उजाड़ दशा को सूचित करता है; ‘पृथ्वी’ अनावश्यक रूप से विश्वव्यापी अर्थ दे सकती है।
- issue: שָׂמָהּ के कर्ता की संख्या
  choice: उन्होंने
  alternative: उसने
  rationale: मसोरेटिक रूप एकवचन है, लेकिन पिछले पद के बहुत-से विनाशक संभावित प्रसंगगत कर्ता हैं। मुख्य पाठ में प्रवचनगत अर्थ और पादटिप्पणी में रूपगत अस्पष्टता सुरक्षित रखी गई है।
- issue: भूमि का मानवीकरण
  choice: वह … शोक मना रही है
  alternative: वह शोकग्रस्त पड़ी है
  rationale: मूल क्रिया सचमुच ‘शोक करना’ व्यक्त करती है; इसलिए भूमि के सक्रिय मानवीकरण और परमेश्वर के सामने उसके विलाप का तनाव बनाए रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘उजाड़’ की पुनरावृत्ति मूल के शब्दगत प्रतिध्वनि को दर्शाती है। भूमि के स्त्रीलिंग मानवीकरण के कारण ‘उजड़ी हुई’ और ‘शोक मना रही है’ प्रयोग किए गए हैं।
