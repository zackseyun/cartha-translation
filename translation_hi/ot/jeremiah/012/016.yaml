base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/016.yaml
  text: And it will happen that if they indeed learn the ways of my people[a], to swear by my name, ‘As Yahweh lives,’ just as they taught my people to swear by Baal[c][b], then they will be built up in the midst of my people.
translation:
  language: hi
  text: और ऐसा होगा कि यदि वे सचमुच मेरी प्रजा के मार्ग सीखें[a] और मेरे नाम की शपथ खाकर कहें, ‘याहवे जीवित है,’[b] ठीक जैसे उन्होंने मेरी प्रजा को बाल के नाम की शपथ खाना सिखाया था, तो वे मेरी प्रजा के बीच स्थापित किए जाएँगे।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘सीखना’ क्रिया की पुनरुक्त संरचना बल देती है; इसका अनुवाद ‘निश्चय ही सीखें’ या ‘भली-भाँति सीखें’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यह इब्रानी शपथ-सूत्र है; इसका अनुवाद ‘याहवे के जीवन की शपथ’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में शाब्दिक रूप से, ‘वे मेरी प्रजा के बीच बनाए जाएँगे’; इसका अनुवाद ‘स्थापित किए जाएँगे’ भी किया जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: और ऐसा होगा
  rationale: यह भविष्य में होने वाले परिणाम का परिचय देने वाला स्वाभाविक हिन्दी वाक्यांश है।
- source_word: לָמֹד יִלְמְדוּ
  choice: सचमुच ... सीखें
  rationale: क्रिया के साथ प्रयुक्त infinitive absolute के बलाघात को बिना अतिरिक्त परिश्रम या पूर्णता का भाव जोड़े व्यक्त करता है।
- source_word: דַּרְכֵי עַמִּי
  choice: मेरी प्रजा के मार्ग
  rationale: मूल रूपक को बनाए रखता है और आचरण तथा उपासना, दोनों की व्यापक अर्थच्छाया को खुला छोड़ता है।
- source_word: לְהִשָּׁבֵעַ בִּשְׁמִי
  choice: मेरे नाम की शपथ खाकर
  rationale: नाम के द्वारा शपथ लेने के वाचा-संबंधी भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: חַי יְהוָה
  choice: याहवे के जीवन की शपथ
  rationale: इब्रानी शपथ-सूत्र की क्रियात्मक शक्ति को स्पष्ट और प्रचलित हिन्दी रूप में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में आए परमेश्वर के विशिष्ट वाचा-नाम को नाम के रूप में प्रस्तुत करता है।
- source_word: לְהִשָּׁבֵעַ בַּבָּעַל
  choice: बाल की शपथ खाना
  rationale: पहले शपथ-वाक्य के साथ समानांतरता और मूर्तिपूजक विरोध को बनाए रखता है।
- source_word: וְנִבְנוּ בְּתוֹךְ עַמִּי
  choice: वे मेरी प्रजा के बीच बसाए जाएँगे
  rationale: נבנה के रूपकात्मक निष्क्रिय अर्थ को हिन्दी में समुदाय के भीतर स्थापित किए जाने के रूप में व्यक्त करता है; शाब्दिक निर्माण-रूपक फुटनोट में सुरक्षित है।
theological_decisions:
- issue: यְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में चतुरक्षरीय विशिष्ट नाम है; उसे सामान्य उपाधि में बदलने के बजाय नाम के रूप में रखा गया है।
- issue: וְנִבְנוּ בְּתוֹךְ עַמִּי का आशय
  choice: मेरी प्रजा के बीच बसाए जाएँगे
  alternative: मेरी प्रजा के बीच उनका निर्माण किया जाएगा; वे मेरी प्रजा के बीच स्थापित किए जाएँगे
  rationale: संदर्भ में अन्यजातियों का परमेश्वर की प्रजा के बीच स्वीकार और स्थापन प्रमुख है। अनुवाद समुदाय में सम्मिलित किए जाने का संकेत देता है, पर उसकी विधि या धर्मवैज्ञानिक सीमाएँ निर्धारित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और सार्वजनिक पाठ के योग्य शैली। ‘प्रजा’ वाचा-समुदाय के सामूहिक भाव को रखता है; ‘मार्ग’ नैतिक और उपासना-संबंधी दोनों अर्थों को सुरक्षित रखता है।
