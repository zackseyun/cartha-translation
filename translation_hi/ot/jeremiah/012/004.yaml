source:
  edition: WLC
  text: עַד מָתַי֙ תֶּאֱבַ֣ל הָ/אָ֔רֶץ וְ/עֵ֥שֶׂב כָּל הַ/שָּׂדֶ֖ה יִיבָ֑שׁ מֵ/רָעַ֣ת יֹֽשְׁבֵי בָ֗/הּ סָפְתָ֤ה בְהֵמוֹת֙ וָ/ע֔וֹף כִּ֣י אָמְר֔וּ לֹ֥א יִרְאֶ֖ה אֶת אַחֲרִיתֵֽ/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/004.yaml
  text: How long will the land mourn, and the grass of every field dry up? Because of the evil of those who dwell in it, beasts and birds are swept away, for they say, “He will not see our end.”
translation:
  language: hi
  text: 'कब तक भूमि शोक मनाती रहेगी,

    और हर खेत की घास सूखती रहेगी?

    उसमें रहने वालों की बुराई के कारण

    पशु और पक्षी नष्ट हो गए हैं;

    क्योंकि वे कहते हैं,

    “वह हमारा अंत नहीं देखेगा।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תֶּאֱבַל
  choice: शोक मनाता रहेगा
  rationale: क्रिया का मूल अर्थ मातम या शोक करना है; भूमि के मानवीकरण को बनाए रखते हुए हिन्दी में स्वाभाविक अभिव्यक्ति दी गई है।
- source_word: סָפְתָה
  choice: नष्ट हो गए हैं
  rationale: यह रूप समाप्त हो जाने, मिट जाने या उठा लिए जाने का भाव देता है। पशु-पक्षियों के लिए 'नष्ट हो गए हैं' संदर्भानुकूल है और कारणसूचक वाक्य से जुड़ता है।
- source_word: אַחֲרִיתֵנוּ
  choice: हमारा अंत
  rationale: אַחֲרִית का अर्थ अंत, अंतिम दशा या परिणाम हो सकता है। 'हमारा अंत' मूल की संक्षिप्तता और संभावित अस्पष्टता सुरक्षित रखता है।
theological_decisions:
- issue: “वह” का संकेत किसकी ओर है
  choice: सर्वनाम “वह” को बिना स्पष्ट संज्ञा जोड़े रखा गया है।
  alternative: “परमेश्वर” हमारा अंत नहीं देखेगा।
  rationale: इब्रानी पाठ केवल तीसरे पुरुष का सर्वनाम-संकेत देता है; परमेश्वर को स्पष्ट रूप से जोड़ना संभव व्याख्या है, पर पाठ की अंतर्निहित अस्पष्टता को समाप्त कर देगा।
- issue: दुष्टों के कथन में אַחֲרִית का आशय
  choice: “हमारा अंत”
  alternative: “हमारा भविष्य” या “हमारा अंतिम परिणाम”
  rationale: यह शब्द भविष्यगत परिणाम को भी सूचित कर सकता है, पर यहाँ शाब्दिक और तनावपूर्ण कथन 'हमारा अंत' मूल अर्थ-क्षेत्र को अधिक सीधे सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक पंक्ति-विन्यास रखा गया है। भाषा सरल, गरिमापूर्ण और बोलचाल से ऊपर किंतु सामान्य पाठक के लिए सहज है। भूमि के मानवीकरण तथा अंतिम कथन की अस्पष्टता को सुरक्षित रखा गया है।
