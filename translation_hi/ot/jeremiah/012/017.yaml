source:
  edition: WLC
  text: וְ/אִ֖ם לֹ֣א יִשְׁמָ֑עוּ וְ/נָ֨תַשְׁתִּ֜י אֶת הַ/גּ֥וֹי הַ/ה֛וּא נָת֥וֹשׁ וְ/אַבֵּ֖ד נְאֻם יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/017.yaml
  text: But if they do not listen[a], then I will uproot that nation, uprooting and destroying it, declares Yahweh.
translation:
  language: hi
  text: परन्तु यदि वे न सुनें[a], तो मैं उस राष्ट्र को उखाड़ दूँगा—उसे पूरी तरह उखाड़कर नष्ट कर दूँगा—याहवे की यह घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘आज्ञा न मानें।’ इब्रानी क्रिया का अर्थ प्रसंग के अनुसार ‘सुनना’ और ‘आज्ञा मानना’, दोनों हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: परन्तु यदि
  rationale: पिछले पद की प्रतिज्ञा के विपरीत एक शर्त प्रस्तुत होती है; इसलिए केवल ‘और यदि’ की अपेक्षा ‘परन्तु यदि’ प्रसंगगत विरोध को अधिक स्पष्ट करता है।
- source_word: לֹא יִשְׁמָעוּ
  choice: वे न सुनें
  rationale: שׁמע का मूल अर्थ ‘सुनना’ है, पर प्रसंग में इसमें ‘आज्ञा मानना’ भी निहित है। मुख्य पाठ में ‘सुनें’ रखकर मूल बिंब और अर्थगत तनाव सुरक्षित रखा गया है।
- source_word: וְנָתַשְׁתִּי ... נָתוֹשׁ
  choice: मैं ... उखाड़ दूँगा—उसे जड़ से उखाड़कर
  rationale: एक ही धातु की सीमित क्रिया और infinitive absolute की पुनरावृत्ति जोर देती है। हिन्दी में पुनरुक्ति तथा ‘जड़ से’ उस कृषि-बिंब और प्रबलता को स्वाभाविक ढंग से व्यक्त करते हैं।
- source_word: הַגּוֹי הַהוּא
  choice: उस जाति को
  rationale: גּוֹי यहाँ आसपास की एक राष्ट्रीय जन-इकाई को सूचित करता है; बाइबलीय हिन्दी में ‘जाति’ इस अर्थ को संक्षेप और गरिमा के साथ व्यक्त करती है।
- source_word: וְאַבֵּד
  choice: नष्ट कर दूँगा
  rationale: हिफ़ील रूप किसी को मिटा देने या विनाश में डालने का कारक अर्थ देता है; ‘नष्ट कर दूँगा’ स्पष्ट और स्वाभाविक हिन्दी है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: भविष्यद्वाणी के इस औपचारिक सूत्र की गंभीरता ‘घोषणा’ से बनी रहती है, और יְהוָה को उपाधि से बदलने के बजाय व्यक्तिगत नाम ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम है। ‘याहवे’ उसका सामान्य विद्वत्तापूर्ण हिन्दी लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
- issue: ‘सुनना’ और ‘आज्ञा मानना’ का अर्थगत संबंध
  choice: मुख्य पाठ में ‘सुनें’, पादटिप्पणी में ‘आज्ञा मानें’
  alternative: मुख्य पाठ में केवल ‘आज्ञा मानें’
  rationale: इब्रानी क्रिया दोनों अर्थ दे सकती है। ‘सुनें’ मूल शब्दार्थ को सुरक्षित रखता है, जबकि पादटिप्पणी प्रसंगगत आज्ञाकारिता का अर्थ स्पष्ट करती है और वास्तविक अस्पष्टता को समाप्त नहीं करती।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘उखाड़ दूँगा—उसे जड़ से उखाड़कर’ मूल की जोरदार पुनरावृत्ति को बनाए रखता है; डैश हिन्दी में वाक्य को बोझिल हुए बिना उस बलाघात को स्पष्ट करते हैं।
