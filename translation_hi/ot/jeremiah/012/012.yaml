  text: עַֽל כָּל שְׁפָיִ֣ם בַּ/מִּדְבָּ֗ר בָּ֚אוּ שֹֽׁדְדִ֔ים כִּ֣י חֶ֤רֶב לַֽ/יהוָה֙ אֹֽכְלָ֔ה מִ/קְצֵה אֶ֖רֶץ וְ/עַד קְצֵ֣ה הָ/אָ֑רֶץ אֵ֥ין שָׁל֖וֹם לְ/כָל בָּשָֽׂר־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/012.yaml
  text: Upon all the bare heights in the wilderness destroyers have come[a], for the sword of Yahweh is devouring from one end of the land to the other end of the land[c][b]; there is no peace for any flesh.
translation:
  language: hi
  text: निर्जन प्रदेश की सभी उजाड़ ऊँचाइयों पर विनाशक आ पहुँचे हैं[a], क्योंकि याहवे की तलवार देश के एक छोर से दूसरे छोर तक निगलती जा रही है[b]; किसी भी प्राणी के लिए शांति नहीं है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘नंगी पहाड़ियाँ’ अथवा ‘वृक्षहीन ऊँचाइयाँ’।
    reason: lexical_alternative
  - marker: b
    text: या ‘धरती के एक छोर से दूसरे छोर तक’। इब्रानी אֶרֶץ का अर्थ ‘देश’ या ‘धरती’ हो सकता है।
    reason: alternative_reading
  - marker: c
    text: शाब्दिक अर्थ ‘किसी भी मांस के लिए’; यह मुहावरा जीवित मनुष्यों या प्राणियों को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁפָיִם
  choice: उजाड़ ऊँचाइयों
  rationale: यह शब्द खुली, वृक्षहीन अथवा वनस्पतिहीन ऊँची जगहों को दर्शाता है। ‘उजाड़ ऊँचाइयाँ’ उस स्थल-चित्र को स्वाभाविक हिन्दी में बनाए रखता है और उपासना-स्थलों का अनावश्यक संकेत नहीं देता।
- source_word: בַּמִּדְבָּר
  choice: जंगल में
  rationale: מִדְבָּר निर्जन प्रदेश, वनप्रदेश या मरुस्थलीय भूभाग को दर्शा सकता है। आधुनिक बाइबलीय हिन्दी में ‘जंगल’ यहाँ निर्जन भूभाग का सहज बोध देता है, बिना अत्यधिक रेतीले मरुस्थल का अर्थ थोपे।
- source_word: שֹׁדְדִים
  choice: विनाशक
  rationale: यह कृदंत लूटने और उजाड़ने वाले हिंसक आक्रमणकारियों को दर्शाता है; ‘विनाशक’ सैन्य तबाही के व्यापक भाव को संक्षेप में व्यक्त करता है।
- source_word: חֶרֶב לַיהוָה
  choice: यहोवा की तलवार
  rationale: सम्बन्धसूचक प्रयोग तलवार को यहोवा की अथवा उसके द्वारा चलाई जाने वाली तलवार के रूप में प्रस्तुत करता है।
- source_word: אֹכְלָה
  choice: निगलती जा रही है
  rationale: स्त्रीलिंग रूप ‘तलवार’ से मेल खाता है और जारी, सजीव मानवीकरण को व्यक्त करता है।
- source_word: מִקְצֵה אֶרֶץ וְעַד קְצֵה הָאָרֶץ
  choice: देश के एक छोर से दूसरे छोर तक
  rationale: सन्दर्भ यहूदा के भूभाग के विनाश पर केन्द्रित है। हिन्दी मुहावरे में ‘एक छोर से दूसरे छोर तक’ इब्रानी विस्तार और पुनरावृत्त अर्थ को स्वाभाविक ढंग से व्यक्त करता है; ‘धरती’ की सम्भावना पादटिप्पणी में रखी गई है।
- source_word: אֵין שָׁלוֹם
  choice: शांति नहीं है
  rationale: युद्ध और न्याय के सन्दर्भ में ‘शांति’ सुरक्षा, कुशल और चैन के व्यापक शालोम-अर्थ को पर्याप्त रूप से वहन करती है।
- source_word: לְכָל בָּשָׂר
  choice: किसी भी प्राणी के लिए
  rationale: नकारात्मक वाक्य में यह इब्रानी मुहावरा किसी भी जीवित मनुष्य अथवा प्राणी को दर्शाता है। शाब्दिक ‘किसी भी मांस के लिए’ आधुनिक हिन्दी में भ्रामक होता, इसलिए अर्थ-स्पष्ट रूप चुना गया और शाब्दिकता पादटिप्पणी में दी गई है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में वाचा का विशिष्ट नाम יהוה है। आधुनिक हिन्दी के सामान्य पाठकों में स्थापित और पहचाना जाने वाला रूप ‘यहोवा’ नाम को उपाधि ‘प्रभु’ में बदलने के बजाय उसका नामात्मक स्वरूप बनाए रखता है।
- issue: אֶרֶץ का भौगोलिक विस्तार
  choice: देश
  alternative: धरती
  rationale: यिर्मयाह 12 के निकट सन्दर्भ में यहूदा का उजड़ा हुआ भूभाग प्रमुख है, फिर भी इब्रानी शब्द व्यापक ‘धरती’ भी अर्थ दे सकता है; इस वास्तविक अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: לְכָל בָּשָׂר का दायरा
  choice: किसी भी प्राणी के लिए
  alternative: किसी भी मनुष्य के लिए
  rationale: בָּשָׂר जीवित मानवों या व्यापक जीवधारी सृष्टि का संकेत कर सकता है। ‘प्राणी’ व्यापकता को सुरक्षित रखता है और केवल मनुष्यों तक अर्थ सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘आ पहुँचे हैं’ अकस्मात और पूर्ण आगमन का भाव देता है, जबकि ‘निगलती जा रही है’ तलवार के जारी मानवीकरण को बनाए रखता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में क्रम से उपस्थित हैं।
