source:
  edition: WLC
  text: הַ/עַ֨יִט צָב֤וּעַ נַחֲלָתִ/י֙ לִ֔/י הַ/עַ֖יִט סָבִ֣יב עָלֶ֑י/הָ לְכ֗וּ אִסְפ֛וּ כָּל חַיַּ֥ת הַ/שָּׂדֶ֖ה הֵתָ֥יוּ לְ/אָכְלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/009.yaml
  text: Is my inheritance to me a speckled bird of prey? Are the birds of prey against her all around? Go[a], gather all the beasts of the field[b]; bring them to devour.
translation:
  language: hi
  text: क्या मेरी विरासत मेरे लिए चितकबरा शिकारी पक्षी है? क्या शिकारी पक्षी उसे चारों ओर से घेरे हुए हैं? जाओ,[a] मैदान के सब जंगली पशुओं को इकट्ठा करो; उन्हें भक्षण करने के लिए ले आओ।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या संभवतः, “लकड़बग्घा।” कुछ व्याख्याकार यहाँ दोहराए गए इब्रानी शब्द עַיִט को लकड़बग्घे जैसे हिंस्र पशु से जोड़ते हैं: “क्या मेरी विरासत मेरे लिए चितकबरा लकड़बग्घा है?” मुख्य पाठ इस शब्द का अधिक सामान्य अर्थ “शिकारी पक्षी” अपनाता है।'
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “शिकारी पक्षी” एकवचन रूप में है और समूहवाचक अर्थ में प्रयुक्त हो सकता है। अंतिम वाक्य में किसे भक्षण करना है, यह भी स्पष्ट रूप से नहीं कहा गया है।
    reason: source_ambiguity
lexical_decisions:
- source_word: הַעַיִט
  choice: शिकारी पक्षी
  rationale: עַיִט सामान्यतः शिकार करने वाले या मुरदार खाने वाले पक्षी को दर्शाता है। जाति विशेष बताए बिना हिन्दी में ‘शिकारी पक्षी’ इस व्यापक अर्थ और रूपक को बनाए रखता है।
- source_word: צָבוּעַ
  choice: चितकबरा
  rationale: यह शब्द विविध रंगों या विशिष्ट चिह्नों से युक्त होने का भाव देता है। ‘चितकबरा’ सहज आधुनिक हिन्दी में उस असामान्य रूप को व्यक्त करता है।
- source_word: נַחֲלָתִי
  choice: मेरी विरासत
  rationale: נַחֲלָה उत्तराधिकार में मिले भाग, धरोहर या निज भाग को सूचित कर सकता है। ‘मेरी विरासत’ वाचिक अर्थ और वाचा-संबंधी अनुगूँज दोनों को खुला रखता है।
- source_word: לִי
  choice: मेरे लिए
  rationale: सम्बन्धसूचक दातृवाचक को बनाए रखते हुए प्रश्न की असामान्य और बलपूर्ण संरचना व्यक्त की गई है।
- source_word: הַעַיִט סָבִיב עָלֶיהָ
  choice: शिकारी पक्षी चारों ओर उसके विरुद्ध हैं
  rationale: एकवचन עַיִט को यहाँ समूहवाचक समझना स्वाभाविक है। עָלֶיהָ में केवल स्थान नहीं, विरोध या आक्रमण का भाव भी संभव है; ‘उसके विरुद्ध’ उस तनाव को सुरक्षित रखता है।
- source_word: לְכוּ אִסְפוּ
  choice: जाओ, ... इकट्ठा करो
  rationale: दोनों आज्ञार्थक क्रियाओं को सीधे और स्वाभाविक आह्वान के रूप में रखा गया है।
- source_word: כָּל חַיַּת הַשָּׂדֶה
  choice: मैदान के सब जंगली पशु
  rationale: यह जंगली जीवों के लिए प्रचलित बाइबलीय पदबंध है। ‘मैदान के सब जंगली पशु’ आधुनिक हिन्दी में स्पष्ट रहते हुए मूल चित्र को बनाए रखता है।
- source_word: הֵתָיוּ לְאָכְלָה
  choice: उन्हें भक्षण करने के लिए ले आओ
  rationale: आज्ञा और उद्देश्य को स्पष्ट करते हुए आक्रामक खाने का भाव ‘भक्षण’ से व्यक्त किया गया है; कर्म को मूल की तरह अनिर्दिष्ट रखा गया है।
theological_decisions:
- issue: ‘मेरी विरासत’ का संदर्भ
  choice: अनुवाद में केवल ‘मेरी विरासत’ रखा गया है
  alternative: यहूदा, यरूशलेम, देश, अथवा वाचा के लोग
  rationale: मूल पद तत्काल वाक्य में संदर्भ को स्पष्ट रूप से सीमित नहीं करता। इसलिए अनुवाद यहूदा, देश या लोगों में से किसी एक पहचान को पाठ में आरोपित नहीं करता।
- issue: עַיִט की प्राणी-संबंधी पहचान
  choice: शिकारी पक्षी
  alternative: लकड़बग्घा
  rationale: बाइबलीय प्रयोग में עַיִט का सामान्य अर्थ शिकारी अथवा मुरदारखोर पक्षी है, पर प्रस्तावित ‘लकड़बग्घा’ अर्थ को पाठ-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘विरासत’ और ‘भक्षण’ बाइबलीय गंभीरता बनाए रखते हैं, जबकि वाक्यरचना को अत्यधिक संस्कृतनिष्ठ नहीं बनाया गया। प्रश्नों की रूपकीय असामान्यता और मूल का अनिर्दिष्ट संदर्भ जानबूझकर सुरक्षित रखा गया है।
