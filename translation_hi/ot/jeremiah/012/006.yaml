id: JER.12.6
reference: Jeremiah 12:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֧י גַם אַחֶ֣י/ךָ וּ/בֵית אָבִ֗י/ךָ גַּם הֵ֨מָּה֙ בָּ֣גְדוּ בָ֔/ךְ גַּם הֵ֛מָּה קָרְא֥וּ אַחֲרֶ֖י/ךָ מָלֵ֑א אַל תַּאֲמֵ֣ן בָּ֔/ם כִּֽי יְדַבְּר֥וּ אֵלֶ֖י/ךָ טוֹבֽוֹת־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/006.yaml
  text: For even your brothers and your father’s house—even they have dealt treacherously with you[a]; even they have called out loudly after you. Do not trust them[b], though they speak good things to you.
translation:
  language: hi
  text: क्योंकि तुम्हारे भाई[b] और तुम्हारे पिता का घराना—उन्होंने भी तुम्हारे साथ विश्वासघात किया है; उन्होंने भी तुम्हारे पीछे पूरे ज़ोर से पुकारा है[a]। उन पर भरोसा मत करना, चाहे वे तुमसे भली बातें कहें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारे पीछे पूरी आवाज़ से पुकारा है।” इससे शत्रुतापूर्ण सार्वजनिक चिल्लाहट या पीछा किए जाने का संकेत मिल सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “भाई” व्याकरण की दृष्टि से पुल्लिंग बहुवचन है; यहाँ इसका संकेत यिर्मयाह के निकट पुरुष संबंधियों की ओर है, जबकि “पिता का घराना” अधिक व्यापक परिवार को दर्शाता है।
    reason: cultural_note
lexical_decisions:
- source_word: אַחֶיךָ
  choice: तुम्हारे भाई
  rationale: इब्रानी में אָח का पुल्लिंग बहुवचन रूप है। ‘भाई’ स्रोत की निकट संबंध-सूचक और लिंग-सूचक भाषा को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וּבֵית אָבִיךָ
  choice: और तुम्हारे पिता का घराना
  rationale: ‘पिता का घराना’ इब्रानी सामाजिक मुहावरे को सुरक्षित रखते हुए परिवार से व्यापक पैतृक गृह-समुदाय का भाव व्यक्त करता है।
- source_word: בָּגְדוּ בָךְ
  choice: तुम्हारे साथ विश्वासघात किया है
  rationale: בגד में छल, बेवफाई और विश्वासघात का नैतिक भार है; यह हिन्दी पदबंध अर्थ को स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: קָרְאוּ אַחֲרֶיךָ מָלֵא
  choice: तुम्हारे पीछे पूरे ज़ोर से पुकारा है
  rationale: קרא ‘पुकारना’, אַחֲרֵי ‘पीछे/पीछे से’, और מָלֵא यहाँ तीव्रता या पूरी आवाज़ का भाव देता है। अनुवाद क्रिया और उसकी संभावित शत्रुतापूर्ण ध्वनि को बिना अत्यधिक निश्चित किए रखता है।
- source_word: אַל תַּאֲמֵן בָּם
  choice: उन पर भरोसा मत करना
  rationale: इस व्यक्तिगत चेतावनी के संदर्भ में אמן का हिफ़ील रूप विश्वास या भरोसा रखने का अर्थ देता है।
- source_word: כִּי יְדַבְּרוּ אֵלֶיךָ טוֹבוֹת
  choice: चाहे वे तुमसे भली बातें कहें
  rationale: टוֹבוֹת अनुकूल, भली या मनभावनी बातों को दर्शाता है। निषेध के बाद כִּי को प्रसंगानुसार रियायती अर्थ ‘चाहे’ दिया गया है।
