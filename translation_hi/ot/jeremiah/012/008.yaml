source:
  edition: WLC
  text: הָיְתָה לִּ֥/י נַחֲלָתִ֖/י כְּ/אַרְיֵ֣ה בַ/יָּ֑עַר נָתְנָ֥ה עָלַ֛/י בְּ/קוֹלָ֖/הּ עַל כֵּ֥ן שְׂנֵאתִֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/008.yaml
  text: My inheritance has become to me like a lion in the forest[a]; she has lifted up her voice against me[c][b]; therefore I hate her.
translation:
  language: hi
  text: मेरी विरासत मेरे लिए जंगल में एक सिंह के समान हो गई है[a]; उसने[b] मेरे विरुद्ध अपनी आवाज़ उठाई है; इसलिए मैं उससे घृणा करता हूँ[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘वह मेरे विरुद्ध गरजी है।’ इब्रानी में शाब्दिक रूप से ‘उसने मेरे विरुद्ध अपनी आवाज़ दी’ है; यह विरोधपूर्ण पुकार का मुहावरा है, और सिंह की उपमा के कारण ‘गरजी’ भी संदर्भानुकूल अनुवाद है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में यहाँ ‘वह/उसकी’ के स्त्रीलिंग रूप हैं। उनका संबंध ‘मेरी विरासत’ से है, जो इब्रानी में स्त्रीलिंग संज्ञा है और यहाँ व्यक्तिरूप में चित्रित की गई है।
    reason: cultural_note
  - marker: c
    text: या, ‘इसलिए मैंने उससे घृणा की है।’ इब्रानी क्रिया-रूप को संदर्भ में भूतकाल अथवा वर्तमान में बनी हुई पूर्ण स्थिति के रूप में समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחֲלָתִי
  choice: मेरी विरासत
  rationale: נַחֲלָה विरासत, पैतृक भाग या अधिकार में मिली संपत्ति को सूचित करता है। ‘विरासत’ वाचा-संबंधी और आत्मीय भाव को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: כְּאַרְיֵה בַיָּעַר
  choice: वन के सिंह के समान
  rationale: אַרְיֵה का सामान्य अर्थ ‘सिंह’ और יַעַר का अर्थ ‘वन’ है। כְּ द्वारा व्यक्त उपमा को ‘के समान’ से स्पष्ट रूप में रखा गया है।
- source_word: נָתְנָה עָלַי בְּקוֹלָהּ
  choice: उसने मेरे विरुद्ध अपनी आवाज़ उठाई है
  rationale: शाब्दिक रूप से यह ‘उसने मेरे विरुद्ध अपनी आवाज़ दी’ है, जो विरोधपूर्ण पुकार का मुहावरा है। चुना हुआ अनुवाद शत्रुता को स्पष्ट करता है, पर सिंह की उपमा के आधार पर अर्थ को केवल ‘गरजना’ तक सीमित नहीं करता।
- source_word: עַל כֵּן
  choice: इसलिए
  rationale: यह पहले कथन के परिणाम या निष्कर्ष को प्रस्तुत करने वाला सामान्य कारणसूचक पदबंध है।
- source_word: שְׂנֵאתִיהָ
  choice: मैं उससे घृणा करता हूँ
  rationale: שׂנא का सीधा अर्थ ‘घृणा करना’ है। वर्तमानकालीन हिन्दी निकट संदर्भ में व्यक्त वर्तमान परिणाम को स्वाभाविक ढंग से रखती है और क्रिया की कठोरता को नरम नहीं करती।
- source_word: -הּ स्त्रीलिंग सर्वनाम-प्रत्यय
  choice: उसने / उससे
  rationale: इन प्रत्ययों का संबंध स्त्रीलिंग संज्ञा נַחֲלָה से है। हिन्दी में ‘विरासत’ भी स्त्रीलिंग है; सर्वनामों के साथ उसका व्यक्तिकरण बनाए रखा गया है, यद्यपि हिन्दी के इन सर्वनाम-रूपों में लिंग प्रत्यक्ष नहीं दिखता।
theological_decisions:
- issue: שְׂנֵאתִיהָ में व्यक्त परमेश्वर की कठोर मनोवृत्ति
  choice: मैं उससे घृणा करता हूँ
  alternative: मैंने उसे त्याग दिया है / मैं उससे घृणा करने लगा हूँ
  rationale: इब्रानी पाठ वाचा के न्याय के संदर्भ में परमेश्वर की विरासत के प्रति अत्यंत कठोर और चौंकाने वाली भाषा रखता है। ‘घृणा’ को सीधे बनाए रखना इस धार्मिक तनाव को सुरक्षित रखता है; इसे केवल प्रशासनिक ‘त्याग’ में बदलना अर्थ को नरम कर देता।
- issue: שְׂנֵאתִיהָ के पूर्ण पक्ष का कालगत मूल्य
  choice: वर्तमान परिणाम के रूप में ‘घृणा करता हूँ’
  alternative: ‘मैंने उससे घृणा की है’
  rationale: इब्रानी क़ातल रूप भूतकाल अथवा वर्तमान में परिणत पूर्ण स्थिति, दोनों की अनुमति देता है। עַל כֵּן के बाद वर्तमान हिन्दी यहाँ तत्काल परिणाम को स्वाभाविक ढंग से व्यक्त करती है, जबकि वैकल्पिक पूर्णकाल को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘वन’, ‘सिंह’ और ‘घृणा’ पाठ की काव्यात्मक गंभीरता तथा न्याय की तीव्रता बनाए रखते हैं। वाक्य-संरचना मूल इब्रानी की तीन क्रमिक धाराओं के निकट है, पर हिन्दी में स्वाभाविक विराम-चिह्नों के साथ प्रस्तुत की गई है।
