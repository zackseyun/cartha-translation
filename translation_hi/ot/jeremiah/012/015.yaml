  yaml_path: translation/ot/jeremiah/012/015.yaml
  text: And it will happen[a], after I have uprooted them, that I will return and have compassion on them, and I will bring them back[c][b], each man to his inheritance and each man to his land.
translation:
  language: hi
  text: और ऐसा होगा कि उन्हें जड़ से उखाड़ने के बाद[a] मैं फिर उनकी ओर मुड़ूँगा और उन पर दया करूँगा[b]; और मैं हर एक को उसकी विरासत और उसके देश में वापस ले आऊँगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उन्हें उखाड़ने के बाद।’ इब्रानी क्रिया में पौधे को जड़ों समेत खींचकर निकालने का चित्र है; यिर्मयाह में यह न्याय का प्रचलित रूपक है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘उन पर करुणा करूँगा’ अथवा ‘उन पर दया दिखाऊँगा।’
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, ‘हर पुरुष को उसकी विरासत और हर पुरुष को उसके देश में।’ इब्रानी का एकवचन पुल्लिंग रूप यहाँ वितरणात्मक है और लौटाए जाने वाले लोगों में से प्रत्येक को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: और ऐसा होगा कि
  rationale: यह भावी परिस्थिति का परिचय देता है; आधुनिक हिन्दी में स्वाभाविक रहते हुए इब्रानी कथन-शैली को बनाए रखता है।
- source_word: נָתְשִׁי
  choice: उन्हें जड़ से उखाड़ने के बाद
  rationale: נתש न्याय के प्रसंग में पौधे को जड़ों समेत उखाड़ने का रूपक है; ‘जड़ से उखाड़ना’ इस चित्र को स्पष्ट रखता है।
- source_word: אָשׁוּב
  choice: मैं फिर उनकी ओर फिरूँगा
  rationale: שׁוב को यहाँ परमेश्वर के उन लोगों की ओर दोबारा कृपापूर्वक मुड़ने के रूप में लिया गया है। ‘उनकी ओर’ हिन्दी में आशय स्पष्ट करता है, जबकि ‘फिरूँगा’ अगले उसी धातु से बने क्रियापद के साथ शब्द-संबंध भी कुछ हद तक बनाए रखता है।
- source_word: וְרִחַמְתִּים
  choice: और उन पर दया करूँगा
  rationale: רחם करुणा से उपजी दया व्यक्त करता है; यह सामान्य, गरिमापूर्ण और संदर्भानुकूल हिन्दी है।
- source_word: וַהֲשִׁבֹתִים
  choice: और मैं ... लौटा लाऊँगा
  rationale: 'שׁוב का हिफ़ील रूप कारणवाचक है: परमेश्वर उन्हें लौटाता है। ‘लौटा लाऊँगा’ स्थानगत वापसी को स्पष्ट करता है।'
- source_word: אִישׁ ... וְאִישׁ
  choice: उनमें से हर एक को
  rationale: दोहराया गया एकवचन पुल्लिंग रूप वितरणात्मक है। हिन्दी में ‘हर एक’ प्रत्येक व्यक्ति का भाव स्वाभाविक ढंग से व्यक्त करता है और संदर्भ को केवल पुरुषों तक सीमित नहीं करता।
- source_word: לְנַחֲלָתוֹ
  choice: उसकी विरासत
  rationale: נחלה पैतृक अथवा आबंटित अधिकार-भूमि को दर्शाता है; ‘विरासत’ इसके उत्तराधिकार और वाचा-भूमि संबंधी अर्थ को बनाए रखती है।
- source_word: לְאַרְצוֹ
  choice: उसकी भूमि
  rationale: אֶרֶץ यहाँ संबंधित जन की क्षेत्रीय भूमि को दर्शाता है; ‘भूमि’ सीधा और संदर्भानुकूल है।
theological_decisions:
- issue: न्याय के बाद प्रतिज्ञात पुनर्स्थापना का स्वरूप
  choice: उखाड़े जाने के बाद परमेश्वर फिर दया करेगा और विस्थापित लोगों में से हर एक को उसकी विरासत और भूमि में लौटाएगा।
  alternative: भौगोलिक वापसी पर बल दिए बिना केवल सामान्य आत्मिक पुनर्स्थापना।
  rationale: ‘विरासत’ और ‘भूमि’ ठोस क्षेत्रीय वापसी का संकेत देते हैं। अनुवाद इस अर्थ को बनाए रखता है, पर पद से आगे कोई अतिरिक्त धर्मवैज्ञानिक दावा नहीं जोड़ता।
- issue: אָשׁוּב में परमेश्वर की वापसी अथवा पुनः क्रिया
  choice: ‘मैं फिर उनकी ओर फिरूँगा’—इसे परमेश्वर के लोगों की ओर दोबारा कृपापूर्वक मुड़ने के रूप में व्यक्त किया गया है।
  alternative: ‘मैं फिर उन पर दया करूँगा’—שׁוב को केवल अगली क्रिया को संशोधित करने वाले ‘फिर’ के अर्थ में लेना।
  rationale: इब्रानी रूप स्वतंत्र क्रिया के रूप में पढ़ा जा सकता है; मुख्य पाठ इस मौखिक तनाव को बनाए रखता है और हिन्दी में आवश्यक दिशा-सूचक पद जोड़ता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। न्याय के कृषि-रूपक, परमेश्वर के पुनः मुड़ने और ठोस भूमि-वापसी—तीनों को बनाए रखा गया है। सभी पाद-टिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
