  naturalness: The revised Hindi is modern, clear, and suitably dignified. «फिर उनकी ओर मुड़ूँगा» is a natural way to express the implied renewed turning, and «हर एक को» is cleaner than «उनमें से हर एक को».
  terminology: «जड़ से उखाड़ना» preserves Jeremiah’s agricultural judgment metaphor. «दया करूँगा» suitably renders רחם. «विरासत» and «देश» convey the inherited holding and the territorial sense of נחלה and ארץ respectively.
  issues:
  - severity: low
    issue: Explicit directional addition in «मैं फिर उनकी ओर फिरूँगा»
    rationale: The Hebrew says literally ‘I will return/turn,’ without an explicit object or directional phrase. Although the sense is likely a renewed favorable turning toward the peoples, the added «उनकी ओर» narrows the wording beyond the source.
  - severity: low
    issue: Added partitive sense in «उनमें से हर एक»
    rationale: The distributive singular איש ... ואיש means ‘each one,’ but does not require the added ‘from among them.’
