id: JER.12.1
reference: Jeremiah 12:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: צַדִּ֤יק אַתָּה֙ יְהוָ֔ה כִּ֥י אָרִ֖יב אֵלֶ֑י/ךָ אַ֤ךְ מִשְׁפָּטִים֙ אֲדַבֵּ֣ר אוֹתָ֔/ךְ מַדּ֗וּעַ דֶּ֤רֶךְ רְשָׁעִים֙ צָלֵ֔חָה שָׁל֖וּ כָּל בֹּ֥גְדֵי בָֽגֶד־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/001.yaml
  text: 'You are righteous[a], O Yahweh, when I bring a case before you[c][b]; yet I would speak with you about matters of justice: Why does the way of the wicked prosper? Why are all who deal treacherously at ease?'
translation:
  language: hi
  text: 'हे याहवे, जब मैं आपके सामने अपना मुकदमा रखता हूँ[a], तब भी आप धर्मी हैं। फिर भी मैं न्याय के विषयों[b] पर आपसे बात करना चाहता हूँ: दुष्टों का मार्ग क्यों फलता-फूलता है? विश्वासघात करनेवाले सभी लोग[c] क्यों चैन से रहते हैं?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यद्यपि मैं आपसे वाद-विवाद करूँ”; इब्रानी क्रिया का अर्थ विवाद करना अथवा विधिक मुकदमा लड़ना हो सकता है।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक रूप से “न्यायों” या “निर्णयों”; बहुवचन का आशय न्याय से जुड़े विषय या मामले हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: 'इब्रानी में सजातीय शब्दों की जोरदार अभिव्यक्ति है: “विश्वासघात का विश्वासघात करनेवाले,” अर्थात बहुत विश्वासघाती ढंग से आचरण करनेवाले।'
    reason: lexical_alternative
lexical_decisions:
- source_word: צַדִּיק
  choice: धर्मी
  rationale: यह विधिक संदर्भ में याहवे की नैतिक धार्मिकता और न्यायपरायणता दोनों को व्यक्त करता है; केवल ‘न्यायी’ कहना अर्थ को अधिक संकीर्ण कर सकता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में आए परमेश्वर के विशिष्ट वाचा-नाम को लिप्यंतरित किया गया है।
- source_word: כִּי אָרִיב אֵלֶיךָ
  choice: जब मैं आपके सामने अपना मुकदमा रखता हूँ
  rationale: ריב में विवाद करने और विधिक मुकदमा प्रस्तुत करने, दोनों का भाव हो सकता है। निकटवर्ती מִשְׁפָּטִים के कारण मुख्य पाठ में विधिक अर्थ स्वाभाविक है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: אַךְ
  choice: फिर भी
  rationale: यह परमेश्वर की धार्मिकता की स्वीकृति से न्याय-संबंधी प्रश्न की ओर जानेवाले विरोधात्मक संक्रमण को स्पष्ट करता है।
- source_word: מִשְׁפָּטִים
  choice: न्याय के विषयों
  rationale: बहुवचन यहाँ न्याय से संबंधित मामलों या प्रश्नों को सूचित कर सकता है; यह अनुवाद विधिक और नैतिक दोनों आयाम रखता है।
- source_word: דֶּרֶךְ רְשָׁעִים
  choice: दुष्टों का मार्ग
  rationale: ‘मार्ग’ जीवन-चर्या और आचरण के लिए प्रयुक्त इब्रानी रूपक को बनाए रखता है।
- source_word: צָלֵחָה
  choice: फलता-फूलता है
  rationale: यह क्रिया सफल या समृद्ध होने का भाव देती है; वर्तमान प्रश्न में दुष्टों की दिखाई देनेवाली उन्नति अभिप्रेत है।
- source_word: שָׁלוּ
  choice: चैन से रहते हैं
  rationale: यह निश्चिंतता, आराम और निर्बाध स्थिति को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בֹּגְדֵי בָגֶד
  choice: विश्वासघात करनेवाले सभी लोग
  rationale: सजातीय संज्ञा और कृदंत से बनी इब्रानी अभिव्यक्ति विश्वासघात पर जोर देती है; उसकी तीव्रता पादटिप्पणी में स्पष्ट की गई है।
theological_decisions:
- issue: यिर्मयाह द्वारा परमेश्वर के सामने न्याय का प्रश्न उठाने का स्वर
  choice: परमेश्वर को धर्मी स्वीकार करते हुए उनके सामने विधिक शिकायत रखना
  alternative: परमेश्वर से सीधे वाद-विवाद करना
  rationale: पद में श्रद्धापूर्ण स्वीकारोक्ति और साहसपूर्ण प्रश्न साथ-साथ हैं। मुख्य पाठ विधिक रूपक को बनाए रखता है और वैकल्पिक टकरावपूर्ण अर्थ को पादटिप्पणी में देता है, ताकि तनाव समाप्त न हो।
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: विशिष्ट इब्रानी वाचा-नाम को सामान्य उपाधि से बदलने के बजाय उसका निकट लिप्यंतरण रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी अपनाई गई है। परमेश्वर के संबोधन में आदरसूचक ‘आप’ रखा गया है। ‘मुकदमा’, ‘न्याय’ और ‘मार्ग’ मूल के विधिक तथा रूपकात्मक स्वर को बनाए रखते हैं।
