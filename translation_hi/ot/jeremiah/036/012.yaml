base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/012.yaml
  text: 'he went down to the king''s house, to the scribe''s chamber, and behold, all the officials were sitting there: Elishama the scribe, Delaiah son of Shemaiah, Elnathan son of Achbor, Gemariah son of Shaphan, Zedekiah son of Hananiah, and all the officials.'
translation:
  language: hi
  text: 'वह नीचे उतरकर राजमहल में, सचिव के कक्ष में गया। वहाँ सभी अधिकारी बैठे हुए थे: सचिव एलीशामा, शमायाह का पुत्र दलायाह, अकबोर का पुत्र एलनातान, शापान का पुत्र गमर्याह, हनन्याह का पुत्र सिदकिय्याह, और अन्य सभी अधिकारी।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּית הַמֶּלֶךְ
  choice: राजमहल
  rationale: शाब्दिक अर्थ ‘राजा का घर’ है, पर इस प्रशासनिक प्रसंग में स्वाभाविक आधुनिक हिन्दी ‘राजमहल’ है।
- source_word: לִשְׁכַּת הַסֹּפֵר
  choice: सचिव के कक्ष
  rationale: סֹפֵר राजकीय लेखन और प्रशासन से जुड़े पदाधिकारी को दर्शाता है; यहाँ ‘सचिव’ आधुनिक पाठक के लिए ‘शास्त्री’ से अधिक प्रसंगानुकूल है।
- source_word: הַשָּׂרִים
  choice: अधिकारी
  rationale: यहाँ शब्द राजकीय पदाधिकारियों के समूह के लिए है; ‘हाकिम’ की अपेक्षा ‘अधिकारी’ वर्तमान मानक हिन्दी में स्पष्ट है।
- source_word: וְהִנֵּה
  choice: वहाँ
  rationale: इब्रानी का प्रस्तुतीकरण-सूचक भाव दृश्य को सामने लाता है; हिन्दी में अलग से ‘देखो’ कहना अस्वाभाविक होने के कारण इसे सहज दृश्यात्मक वाक्य में व्यक्त किया गया है।
- source_word: וְכָל הַשָּׂרִים
  choice: और अन्य सभी अधिकारी
  rationale: सूची में पहले उल्लिखित अधिकारी भी शामिल हैं; हिन्दी में ‘अन्य’ जोड़ने से अंतिम समाहार का आशय स्पष्ट और स्वाभाविक होता है।
