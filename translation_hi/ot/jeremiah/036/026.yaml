  text: וַ/יְצַוֶּ֣ה הַ֠/מֶּלֶךְ אֶת יְרַחְמְאֵ֨ל בֶּן הַ/מֶּ֜לֶךְ וְ/אֶת שְׂרָיָ֣הוּ בֶן עַזְרִיאֵ֗ל וְ/אֶת שֶֽׁלֶמְיָ֨הוּ֙ בֶּֽן עַבְדְּאֵ֔ל לָ/קַ֨חַת֙ אֶת בָּר֣וּךְ הַ/סֹּפֵ֔ר וְ/אֵ֖ת יִרְמְיָ֣הוּ הַ/נָּבִ֑יא וַ/יַּסְתִּרֵ֖/ם יְהוָֽה־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/026.yaml
  text: Then the king commanded Jerahmeel the king’s son[a], and Seraiah son of Azriel, and Shelemiah son of Abdeel, to seize Baruch the scribe and Jeremiah the prophet[b], but Yahweh hid them.
translation:
  language: hi
  text: तब राजा ने राजा के पुत्र यरहमेल, अज्रीएल के पुत्र सरायाह और अब्देल के पुत्र शेलेम्याह को आदेश दिया कि वे लिपिक बारूक और नबी यिर्मयाह को पकड़ लें[a]। लेकिन याहवे ने उन्हें छिपा दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “लेने के लिए”; इस प्रसंग में आशय उन्हें पकड़ने का है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַוֶּה הַמֶּלֶךְ
  choice: तब राजा ने ... आदेश दिया
  rationale: צוה अधिकारपूर्वक आज्ञा देने को व्यक्त करता है। हिन्दी कथात्मक प्रवाह में वाव-क्रम को ‘तब’ से स्वाभाविक रूप दिया गया है।
- source_word: יְרַחְמְאֵל בֶּן הַמֶּלֶךְ
  choice: राजपुत्र यरहमेल
  rationale: בן המלך का शाब्दिक अर्थ ‘राजा का पुत्र’ है; ‘राजपुत्र’ उसी संबंध को संक्षिप्त, स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है, बिना उसे केवल प्रशासनिक पद मानने के।
- source_word: שְׂרָיָהוּ בֶן עַזְרִיאֵל
  choice: अज्रीएल के पुत्र सरायाह
  rationale: हिब्रू संरक्षक-नाम संबंध को स्पष्ट हिन्दी क्रम में रखा गया है।
- source_word: שֶׁלֶמְיָהוּ בֶּן עַבְדְּאֵל
  choice: अब्देल के पुत्र शेलेम्याह
  rationale: व्यक्तिनामों का लिप्यंतरण करते हुए בן की वंश-सूचक भूमिका को ‘के पुत्र’ से सुरक्षित रखा गया है।
- source_word: לָקַחַת
  choice: पकड़ लें
  rationale: मूल क्रिया का सामान्य अर्थ ‘लेना’ है, लेकिन इस प्रसंग में राजा के आदमियों द्वारा दोनों व्यक्तियों को बलपूर्वक हिरासत में लेने का आशय है। ‘पकड़ लें’ hostile apprehension को व्यक्त करता है, पर आधुनिक कानूनी ‘गिरफ़्तारी’ को अनावश्यक रूप से आरोपित नहीं करता।
- source_word: בָּרוּךְ הַסֹּפֵר
  choice: शास्त्री बारूक
  rationale: סֹפֵר लेखक, लिपिक अथवा सचिव का द्योतक हो सकता है। यहाँ लिखित पुस्तक से जुड़े बारूक की भूमिका के लिए प्रचलित बाइबलीय पद ‘शास्त्री’ उपयुक्त है।
- source_word: יִרְמְיָהוּ הַנָּבִיא
  choice: नबी यिर्मयाह
  rationale: נביא का सीधा और आधुनिक हिन्दी में व्यापक रूप से समझा जाने वाला समतुल्य ‘नबी’ है।
- source_word: וַיַּסְתִּרֵם
  choice: उन्हें छिपा दिया
  rationale: סתר के हिफ़ील रूप में कर्ता द्वारा उन्हें छिपाने का स्पष्ट कारणात्मक भाव है; हिन्दी में ‘छिपा दिया’ इसे सहजता से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम יהוה है। उसे किसी उपाधि से बदलने के बजाय हिन्दी में ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: हिब्रू पाठ में उपाधि नहीं बल्कि चतुरक्षरीय व्यक्तिगत नाम है; ‘याहवे’ उसके संभावित प्राचीन उच्चारण का निकट हिन्दी लिप्यंतरण है।
- issue: लोगों को लेने के लिए भेजे जाने का आशय
  choice: पकड़ लें
  alternative: ले आएँ / गिरफ़्तार करें
  rationale: प्रसंग शत्रुतापूर्ण ढंग से हिरासत में लेने का है। ‘पकड़ लें’ इस बल को बनाए रखता है, जबकि ‘गिरफ़्तार करें’ आधुनिक औपचारिक कानूनी प्रक्रिया का अतिरिक्त अर्थ ला सकता है।
- issue: याहवे की प्रत्यक्ष क्रिया
  choice: याहवे ने उन्हें छिपा दिया
  alternative: वे छिप गए
  rationale: हिब्रू में याहवे स्पष्ट कर्ता हैं और क्रिया कारणात्मक है; अनुवाद दैवी कार्य को निष्क्रिय या मानवीय आत्म-रक्षा में परिवर्तित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, कथात्मक और गरिमापूर्ण रखी गई है। नामों को हिन्दी ध्वन्यात्मक रूप में दिया गया है। वाक्य की लंबी हिब्रू समन्वयी संरचना को पठनीय हिन्दी क्रम में रखा गया है, जबकि सभी व्यक्तियों, उनके पितृनामों और याहवे की निर्णायक क्रिया को सुरक्षित रखा गया है।
