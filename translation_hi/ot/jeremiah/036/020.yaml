  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘कक्ष’ राजदरबार के औपचारिक परिवेश के अनुकूल है; ‘लपेटा हुआ पत्र’ सामान्य पाठक के लिए ‘स्क्रॉल’ से अधिक सहज है।
