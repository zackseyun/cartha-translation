base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/020.yaml
  text: Then they went to the king in the court[a], and they deposited the scroll in the chamber of Elishama the scribe[b], and they reported all the words in the hearing of the king.
translation:
  language: hi
  text: तब वे आँगन में राजा के पास गए। उन्होंने उस लपेटे हुए लेख को शास्त्री एलीशामा के कक्ष में सुरक्षित रख दिया[a] और राजा को सारी बातें सुनाईं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शास्त्री एलीशामा के कक्ष में सुरक्षा के लिए सौंप दिया।”
    reason: הִפְקִדוּ में सुरक्षित रखने और किसी की देखरेख में सौंपने—दोनों का भाव संभव है।
  - marker: b
    text: 'शाब्दिक अर्थ: “राजा के कानों में सारी बातें बताईं।”'
    reason: इब्रानी मुहावरे के शाब्दिक रूप को दर्ज करने के लिए।
lexical_decisions:
- source_word: וַיָּבֹאוּ אֶל־הַמֶּלֶךְ חָצֵרָה
  choice: तब वे राजमहल के आँगन में राजा के पास गए
  rationale: क्रमसूचक וַיָּבֹאוּ को स्वाभाविक हिन्दी में ‘तब ... गए’ कहा गया है। दिशासूचक ה वाला חָצֵרָה आँगन की ओर प्रवेश सूचित करता है; प्रसंग के अनुसार इसे राजमहल का आँगन स्पष्ट किया गया है।
- source_word: הַמְּגִלָּה
  choice: लपेटा हुआ पत्र
  rationale: מְגִלָּה लिखित स्क्रॉल है। ‘लपेटा हुआ पत्र’ साधारण आधुनिक हिन्दी में वस्तु और उसकी लिखित प्रकृति दोनों को स्पष्ट करता है।
- source_word: הִפְקִדוּ
  choice: सुरक्षित रख दिया
  rationale: פקד के हिफ़ील रूप में यहाँ केवल रख देने के साथ सुरक्षा या सुपुर्दगी का भाव भी है; यह अनुवाद उस अर्थ को संक्षेप में व्यक्त करता है।
- source_word: בְּלִשְׁכַּת אֱלִישָׁמָע הַסֹּפֵר
  choice: शास्त्री एलीशामा के कक्ष में
  rationale: לִשְׁכָּה राजकीय परिसर का कक्ष है। סֹפֵר को पारंपरिक और सीधा पदनाम ‘शास्त्री’ दिया गया है, यद्यपि प्रसंग में वह राजकीय सचिव भी हो सकता है।
- source_word: וַיַּגִּידוּ ... אֵת כָּל־הַדְּבָרִים
  choice: सारी बातें सुनाईं
  rationale: נגד का हिफ़ील यहाँ बताने या सूचना देने का अर्थ रखता है। דְּבָרִים संदर्भ में कही या पढ़ी गई सारी सामग्री को दर्शाता है; ‘सारी बातें’ स्वाभाविक हिन्दी है।
- source_word: בְּאָזְנֵי הַמֶּלֶךְ
  choice: राजा को ... सुनाईं
  rationale: शाब्दिक रूप ‘राजा के कानों में’ है। हिन्दी में ‘राजा को ... सुनाईं’ उसी श्रवण-केंद्रित मुहावरे का स्वाभाविक अर्थ देता है।
