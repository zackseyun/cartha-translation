    issue: ‘शास्त्री’ for הַסֹּפֵר
    rationale: In contemporary standard Hindi, ‘शास्त्री’ commonly means a scholar or an expert in religious texts. The Hebrew title denotes a scribe/official writer; ‘लिपिक’ better preserves this without adding a specific rank.
  - severity: medium
    issue: ‘यहोवा’ does not follow the supplied audit-trail rendering decision for יְהוָה
    rationale: The English POB theological decision explicitly chooses ‘Yahweh.’ ‘याहवे’ is the corresponding Hindi transliteration and retains the personal divine name.
  - severity: low
    issue: Heavy relative-clause punctuation for the location phrases
    rationale: The Hebrew simply stacks prepositional phrases. Removing the inserted relative clause avoids making an interpretive claim beyond the straightforward spatial description and improves Hindi flow.
