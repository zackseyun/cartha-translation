id: JER.36.10
reference: Jeremiah 36:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּקְרָ֨א בָר֥וּךְ בַּ/סֵּ֛פֶר אֶת דִּבְרֵ֥י יִרְמְיָ֖הוּ בֵּ֣ית יְהוָ֑ה בְּ/לִשְׁכַּ֡ת גְּמַרְיָהוּ֩ בֶן שָׁפָ֨ן הַ/סֹּפֵ֜ר בֶּ/חָצֵ֣ר הָ/עֶלְי֗וֹן פֶּ֣תַח שַׁ֤עַר בֵּית יְהוָה֙ הֶֽ/חָדָ֔שׁ בְּ/אָזְנֵ֖י כָּל הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/010.yaml
  text: And Baruch read from the scroll the words of Jeremiah in the house of Yahweh[a], in the chamber of Gemariah son of Shaphan the scribe, in the upper court, at the entrance of the new gate of the house of Yahweh, in the hearing of all the people.
translation:
  language: hi
  text: तब बारूक ने याहवे के भवन में, शापान के पुत्र गमर्याह लिपिक के कक्ष में, ऊपरी आँगन में, याहवे के भवन के नए फाटक के प्रवेश पर, उस पुस्तक से यिर्मयाह के वचन सब लोगों के सुनते हुए पढ़े।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: पढ़े
  rationale: पुस्तक के साथ प्रयुक्त קרא यहाँ लिखित सामग्री को ऊँचे स्वर में पढ़ने का अर्थ देता है; सार्वजनिक श्रवण का भाव आगे के वाक्यांश से स्पष्ट है।
- source_word: בַּסֵּפֶר
  choice: उस पुस्तक से
  rationale: סֵפֶר लिखित पुस्तक अथवा लपेटे हुए ग्रंथ को दर्शा सकता है। हिंदी में ‘पुस्तक’ स्वाभाविक है और इसी अध्याय में उल्लिखित लिखित दस्तावेज़ की ओर संकेत करने के लिए ‘उस’ जोड़ा गया है।
- source_word: דִּבְרֵי יִרְמְיָהוּ
  choice: यिर्मयाह के वचन
  rationale: यह संबंधसूचक पदबंध का सीधा अनुवाद है और भविष्यद्वक्तीय कथन के लिए ‘वचन’ उपयुक्त गरिमापूर्ण शब्द है।
- source_word: בֵּית יְהוָה
  choice: यहोवा का भवन
  rationale: בֵּית का मूल रूपक ‘भवन/घर’ रखा गया है; प्रसंग में यह मंदिर-परिसर को दर्शाता है। יְהוָה को निजी ईश्वरीय नाम ‘यहोवा’ से व्यक्त किया गया है।
- source_word: בְּלִשְׁכַּת
  choice: के कक्ष में
  rationale: לִשְׁכָּה मंदिर-परिसर के आधिकारिक कमरे या कक्ष को दर्शाता है; ‘कक्ष’ आधुनिक, संक्षिप्त और स्थापत्य-संदर्भ में उपयुक्त है।
- source_word: גְּמַרְיָהוּ בֶן שָׁפָן
  choice: शापान के पुत्र गमर्याह
  rationale: हिब्रू पितृनाम-संबंध को स्वाभाविक हिंदी क्रम में रखा गया है और नामों का देवनागरी लिप्यंतरण किया गया है।
- source_word: הַסֹּפֵר
  choice: शास्त्री
  rationale: סֹפֵר लेखक, लिपिक या प्रशासनिक सचिव का पद हो सकता है। ‘शास्त्री’ पारंपरिक रूप से व्यापक पदनाम बनाए रखता है, बिना उसके सरकारी कार्य को अनावश्यक रूप से निश्चित किए।
- source_word: בֶּחָצֵר הָעֶלְיוֹן
  choice: ऊपरी आँगन में
  rationale: חָצֵר खुले प्रांगण को दर्शाता है; साधारण हिंदी में ‘आँगन’ ‘कोर्ट’ की अपेक्षा अधिक स्पष्ट है।
- source_word: פֶּתַח שַׁעַר ... הֶחָדָשׁ
  choice: नए फाटक के प्रवेश-द्वार पर
  rationale: פֶּתַח प्रवेश या मुख को बताता है और שַׁעַר फाटक को; दोनों तत्वों को बनाए रखते हुए स्थान स्पष्ट किया गया है।
- source_word: בְּאָזְנֵי כָּל הָעָם
  choice: सब लोगों को सुनाते हुए
  rationale: शाब्दिक अर्थ ‘सब लोगों के कानों में’ सार्वजनिक रूप से श्रव्य पाठ का मुहावरा है; यह हिंदी अभिव्यक्ति उसके आशय को स्वाभाविक ढंग से रखती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ के व्यक्तिवाचक वाचा-नाम को सामान्य पद ‘प्रभु’ से नहीं बदला गया। आधुनिक हिंदी बाइबल-पाठकों में परिचित ‘यहोवा’ रूप चुना गया है; ‘याहवे’ अधिक समीपी वैकल्पिक लिप्यंतरण है।
- issue: בֵּית יְהוָה का अभिप्राय
  choice: यहोवा का भवन
  alternative: यहोवा का मंदिर
  rationale: मूल के ‘भवन/घर’ रूपक को मुख्य पाठ में सुरक्षित रखा गया है, जबकि प्रसंगगत अर्थ ‘मंदिर’ को पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। लंबी स्थान-सूचना को डैश के बीच रखकर यह स्पष्ट किया गया है कि ऊपरी आँगन और नए फाटक का विवरण गमर्याह के कक्ष की स्थिति बताता है।
