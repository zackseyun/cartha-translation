  terminology: Use ‘याहवे’ for יְהוָה in accordance with the supplied English theological decision. Use ‘लिपिक’ for סֹפֵר. ‘भवन’ appropriately preserves the literal ‘house,’ with a footnote identifying the temple referent. ‘पुस्तक’ remains an acceptable general Hindi rendering of סֵפֶר, though the context is a scroll.
  issues:
