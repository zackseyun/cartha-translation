source:
  edition: WLC
  text: וַ/יֹּאמְר֤וּ הַ/שָּׂרִים֙ אֶל בָּר֔וּךְ לֵ֥ךְ הִסָּתֵ֖ר אַתָּ֣ה וְ/יִרְמְיָ֑הוּ וְ/אִ֥ישׁ אַל יֵדַ֖ע אֵיפֹ֥ה אַתֶּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/019.yaml
  text: Then the officials said to Baruch, “Go, hide yourself, you and Jeremiah, and let no one know where you are.”
translation:
  language: hi
  text: तब अधिकारियों ने बारूक से कहा, “जाओ, तुम और यिर्मयाह छिप जाओ, और किसी को पता न चले कि तुम दोनों कहाँ हो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: तब ... ने कहा
  rationale: वाव-क्रमवाचक कथा को आगे बढ़ाता है; आधुनिक हिन्दी में ‘तब’ घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַשָּׂרִים
  choice: अधिकारियों
  rationale: यहाँ שָׂרִים राजकीय प्रशासन और दरबार के उच्च पदाधिकारियों को सूचित करता है; ‘अधिकारी’ आधुनिक हिन्दी में स्पष्ट है और ‘राजकुमार’ जैसा वंशगत अर्थ नहीं जोड़ता।
- source_word: לֵךְ הִסָּתֵר
  choice: जाओ ... छिप जाओ
  rationale: दोनों आज्ञार्थक रूपों का बल रखा गया है। हिन्दी वाक्य-रचना में संबद्ध कर्ताओं को बीच में रखने से आदेश स्वाभाविक और स्पष्ट बनता है।
- source_word: אַתָּה וְיִרְמְיָהוּ
  choice: तुम और यिर्मयाह
  rationale: इब्रानी में व्यक्त ‘तुम’ पर बल है और उसके साथ यिर्मयाह को जोड़ा गया है; अनुवाद इस संरचना को बनाए रखता है।
- source_word: וְאִישׁ אַל יֵדַע
  choice: और किसी को पता न चले
  rationale: नकार के साथ אִישׁ का अर्थ यहाँ ‘किसी व्यक्ति’ है। यह निषेधात्मक भाव को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אֵיפֹה אַתֶּם
  choice: कि तुम दोनों कहाँ हो
  rationale: बहुवचन אַתֶּם बारूक और यिर्मयाह दोनों को संदर्भित करता है; ‘दोनों’ जोड़ने से हिन्दी में मूल का बहुवचन स्पष्ट होता है, जबकि स्थान-संबंधी अर्थ सुरक्षित रहता है।
