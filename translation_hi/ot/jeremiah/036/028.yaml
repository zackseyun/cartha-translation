base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/028.yaml
  text: Take for yourself another scroll and write on it all the former words that were on the first scroll[a], which Jehoiakim king of Judah burned.
translation:
  language: hi
  text: तू फिर अपने लिए एक और लेख-पत्र ले[a] और उस पर वे सभी पहले वाले वचन लिख, जो उस पहले लेख-पत्र पर थे, जिसे यहूदा के राजा यहोयाकीम ने जला दिया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तू लौटकर अपने लिए एक और लेख-पत्र ले।” हिब्रू वाक्य का आरम्भ ऐसे आदेश से होता है जिसका मूल अर्थ “लौट” या “फिर” है; यहाँ वह “ले” के साथ मिलकर किसी काम को दोबारा करने का भाव देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוּב קַח לְךָ
  choice: तू फिर अपने लिए ... ले
  rationale: שׁוּב अगले आदेश קַח के साथ क्रियाविशेषण की तरह प्रयुक्त होकर काम को दोबारा करने का भाव देता है। ‘फिर ... ले’ इस भाव और לְךָ के व्यक्तिगत निर्देश—‘अपने लिए’—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: מְגִלָּה אַחֶרֶת
  choice: एक और पुस्तक-पट
  rationale: מְגִלָּה लिखने के लिए प्रयुक्त लपेटे जाने वाले पुस्तक-पट को दर्शाता है। ‘पुस्तक-पट’ सामग्री के विषय में अनावश्यक अनुमान लगाए बिना प्राचीन स्क्रॉल का स्पष्ट और संक्षिप्त हिन्दी रूप है; אַחֶרֶת का अर्थ ‘एक और’ है।
- source_word: וּכְתֹב עָלֶיהָ
  choice: और उस पर ... लिख
  rationale: संयुक्त आदेश को सीधे रखा गया है और עָלֶיהָ का स्वाभाविक अर्थ ‘उस पर’ दिया गया है।
- source_word: אֵת כָּל הַדְּבָרִים הָרִאשֹׁנִים
  choice: वे सभी पहले के वचन
  rationale: דְּבָרִים यहाँ लिखित भविष्यवाणी की बातों या वचनों को सूचित करता है। ‘वचन’ प्रसंगानुकूल है, जबकि ‘पहले के’ प्रतिस्थापन पुस्तक-पट पर पहले लिखी सामग्री का संकेत देता है।
- source_word: אֲשֶׁר הָיוּ עַל הַמְּגִלָּה הָרִאשֹׁנָה
  choice: जो उस पहले पुस्तक-पट पर थे
  rationale: सम्बन्धवाचक उपवाक्य मूल पुस्तक-पट पर पहले से लिखे वचनों की पहचान करता है। הָרִאשֹׁנָה को यहाँ ‘पहले’ से व्यक्त किया गया है।
- source_word: אֲשֶׁר שָׂרַף יְהוֹיָקִים מֶלֶךְ יְהוּדָה
  choice: जिसे यहूदा के राजा यहोयाकीम ने जला दिया था
  rationale: हिब्रू सम्बन्धवाचक रचना को स्वाभाविक हिन्दी क्रम में रखा गया है। שָׂרַף का अर्थ बिना अतिरिक्त तीव्रता जोड़े ‘जला दिया’ और राजकीय उपाधि का स्वाभाविक रूप ‘यहूदा के राजा’ दिया गया है।
