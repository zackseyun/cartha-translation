  yaml_path: translation/ot/jeremiah/036/015.yaml
  text: And they said to him[a], “Please sit down and read it in our hearing.” So Baruch read it in their hearing.
translation:
  language: hi
  text: तब उन्होंने उससे कहा, “कृपया बैठ जाइए और इसे हमें पढ़कर सुनाइए।” तब बारूक ने उन्हें पढ़कर सुनाया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֵלָיו
  choice: तब उन्होंने उससे कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में घटनाक्रम स्पष्ट करता है, बिना संयोजक का अतिरिक्त अर्थ लगाए।
- source_word: שֵׁב נָא
  choice: कृपया बैठ जाइए
  rationale: שֵׁב यहाँ बैठने की आज्ञा है और נָא विनम्र अनुरोध व्यक्त करता है; आदरसूचक बहुवचन हिन्दी संवाद में स्वाभाविक और गरिमापूर्ण है।
- source_word: וּקְרָאֶנָּה
  choice: और इसे ... पढ़कर सुनाइए
  rationale: קרא लिखित सामग्री के संदर्भ में ‘पढ़ना’ है; स्त्रीलिंग कर्म-प्रत्यय पूर्वोक्त पुस्तक/लपेटे हुए लेख को सूचित करता है। ‘पढ़कर सुनाइए’ अगले श्रवण-संबंधी वाक्यांश का स्वाभाविक हिन्दी रूप है।
- source_word: בְּאָזְנֵינוּ
  choice: हमें ... सुनाइए
  rationale: शाब्दिक अर्थ ‘हमारे कानों में’ है, पर यह इब्रानी मुहावरा सुनने योग्य ढंग से पढ़ने को कहता है। हिन्दी में ‘हमें पढ़कर सुनाइए’ वही अर्थ स्पष्ट और स्वाभाविक रूप से देता है।
- source_word: וַיִּקְרָא בָרוּךְ
  choice: तब बारूक ने ... पढ़कर सुनाया
  rationale: यह अनुरोध के प्रति बारूक की अगली क्रिया बताता है; ‘तब’ कथात्मक क्रम बनाए रखता है।
- source_word: בְּאָזְנֵיהֶם
  choice: उन्हें ... पढ़कर सुनाया
  rationale: ‘उनके कानों में’ का मुहावरेदार आशय है कि उन्होंने उसे सुना; हिन्दी में कर्म ‘उन्हें’ और संयुक्त क्रिया ‘पढ़कर सुनाया’ इसे संक्षेप और स्वाभाविकता से व्यक्त करते हैं।
