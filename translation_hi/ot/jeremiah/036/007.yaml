source:
  edition: WLC
  text: אוּלַ֞י תִּפֹּ֤ל תְּחִנָּתָ/ם֙ לִ/פְנֵ֣י יְהוָ֔ה וְ/יָשֻׁ֕בוּ אִ֖ישׁ מִ/דַּרְכּ֣/וֹ הָ/רָעָ֑ה כִּֽי גָד֤וֹל הָ/אַף֙ וְ/הַ֣/חֵמָ֔ה אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה אֶל הָ/עָ֥ם הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/007.yaml
  text: Perhaps their plea will fall before Yahweh[a], and each man will turn from his evil way[c][b], for great is the anger and the wrath that Yahweh has spoken against this people.
translation:
  language: hi
  text: शायद उनकी विनती याहवे के सामने पहुँचे[a], और हर एक पुरुष[b] अपने बुरे मार्ग से मुड़ जाए; क्योंकि याहवे ने इस प्रजा के विरुद्ध[c] जिस क्रोध और प्रकोप की बात कही है, वह बहुत बड़ा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उनकी विनती याहवे के सामने गिरे।” इसका अर्थ यह भी हो सकता है, “उनकी विनती याहवे के सामने आए” या “याहवे के सामने प्रस्तुत की जाए।”
    reason: lexical_alternative
  - marker: b
    text: या, “हर एक।” इब्रानी में शाब्दिक रूप से “हर एक पुरुष” है; एकवचन पुल्लिंग रूप यहाँ वितरणात्मक अर्थ रखता है।
    reason: lexical_alternative
  - marker: c
    text: या, “इस प्रजा की ओर” या “इस प्रजा को।” इब्रानी संबंधबोधक शब्द का सामान्य अर्थ “की ओर” है; “विरुद्ध” न्याय के प्रसंग को सामने लाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלַי
  choice: शायद
  rationale: यह संभावना और आशा प्रकट करता है, निश्चितता नहीं। आधुनिक हिन्दी में ‘शायद’ इसका स्वाभाविक और संक्षिप्त रूप है।
- source_word: תִּפֹּל תְּחִנָּתָם לִפְנֵי יְהוָה
  choice: उनकी विनती याहवे के सामने पहुँचे
  rationale: इब्रानी में शाब्दिक चित्र ‘विनती ... सामने गिरे’ है, जिसका आशय किसी के समक्ष विनती पहुँचने या रखे जाने से है। हिन्दी में ‘सामने पहुँचे’ मुहावरे का अर्थ स्वाभाविक रूप से देता है; शाब्दिक चित्र पादटिप्पणी में सुरक्षित है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिपि में लिप्यंतरित किया गया है।
- source_word: וְיָשֻׁבוּ
  choice: फिर जाए
  rationale: שׁוּב का मूल रूपक लौटने या मुड़ने का है। ‘फिर जाए’ पश्चाताप के संदर्भ को व्यक्त करता है, पर उसे किसी अधिक विशिष्ट धर्मशास्त्रीय शब्द में नहीं बदलता।
- source_word: אִישׁ
  choice: हर एक पुरुष
  rationale: एकवचन पुल्लिंग संज्ञा यहाँ वितरणात्मक अर्थ में प्रयुक्त है; यह प्रत्येक पुरुष की व्यक्तिगत प्रतिक्रिया पर बल देती है।
- source_word: מִדַּרְכּוֹ הָרָעָה
  choice: अपने बुरे मार्ग से
  rationale: ‘मार्ग’ आचरण के लिए प्रयुक्त मूल बाइबिलीय रूपक को बनाए रखता है, और ‘बुरा’ רָעָה का सीधा तथा सहज समतुल्य है।
- source_word: כִּי גָדוֹל הָאַף וְהַחֵמָה
  choice: क्योंकि ... क्रोध और प्रकोप ... बहुत भयंकर है
  rationale: दोनों निकटार्थी क्रोध-संज्ञाओं को बनाए रखा गया है। ‘बहुत भयंकर’ גָדוֹל की तीव्रता को इस हिन्दी वाक्य-विन्यास में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֲשֶׁר דִּבֶּר יְהוָה אֶל הָעָם הַזֶּה
  choice: इस प्रजा के विरुद्ध याहवे ने ... बात कही है
  rationale: אֶל का सामान्य अर्थ ‘से/की ओर’ है, लेकिन यहाँ कही गई बात न्याय का संदेश है। ‘विरुद्ध’ उस प्रसंगगत दिशा को स्पष्ट करता है; औपचारिक विकल्प पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत चतुरक्षरीय नाम है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना आधुनिक हिन्दी में प्रस्तुत करता है।
- issue: אִישׁ का लिंग और वितरणात्मक अर्थ
  choice: हर एक पुरुष
  alternative: हर एक; प्रत्येक व्यक्ति
  rationale: मूल में स्पष्ट पुल्लिंग एकवचन है और उसका प्रयोग वितरणात्मक है। मुख्य पाठ इस रूप को सुरक्षित रखता है, जबकि अधिक सामान्य विकल्प पादटिप्पणी में बताया गया है।
- issue: אֶל הָעָם הַזֶּה में कथन की दिशा
  choice: इस प्रजा के विरुद्ध
  alternative: इस प्रजा से; इस प्रजा के विषय में
  rationale: व्याकरणतः אֶל ‘से/की ओर’ हो सकता है, जबकि अध्याय का न्याय-संदर्भ विरोधात्मक अर्थ सुझाता है। मुख्य पाठ प्रसंगगत अर्थ देता है और पादटिप्पणी वास्तविक भाषिक विकल्प बनाए रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘याहवे’, ‘मार्ग’, ‘क्रोध’ और ‘प्रकोप’ मूल की धार्मिक तथा रूपकात्मक बनावट को बनाए रखते हैं। वाक्य-विन्यास हिन्दी में स्वाभाविक बनाने के लिए अंतिम उपवाक्य को पुनर्गठित किया गया है, पर संभावना, व्यक्तिगत लौटने की पुकार और आने वाले न्याय की तीव्रता सुरक्षित है।
