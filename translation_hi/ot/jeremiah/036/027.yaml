  text: וַ/יְהִ֥י דְבַר יְהוָ֖ה אֶֽל יִרְמְיָ֑הוּ אַחֲרֵ֣י שְׂרֹ֣ף הַ/מֶּ֗לֶךְ אֶת הַ/מְּגִלָּה֙ וְ/אֶת הַ/דְּבָרִ֔ים אֲשֶׁ֨ר כָּתַ֥ב בָּר֛וּךְ מִ/פִּ֥י יִרְמְיָ֖הוּ לֵ/אמֹֽר־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/027.yaml
  text: Then the word of Yahweh came to Jeremiah[a], after the king had burned the scroll and the words that Baruch had written from the mouth of Jeremiah, saying,
translation:
  language: hi
  text: 'तब, राजा के उस पत्र-लपेटे और उन वचनों को जला देने के बाद, जिन्हें बारूक ने यिर्मयाह के कहने पर लिखा था, यहोवा का वचन यिर्मयाह के पास आया, यह कहते हुए:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי דְבַר יְהוָה אֶל יִרְמְיָהוּ
  choice: तब यहोवा का वचन यिर्मयाह के पास आया
  rationale: मानक भविष्यद्वाणी-सूत्र और कथा के अगले घटनाक्रम को स्वाभाविक आधुनिक हिन्दी में सुरक्षित रखता है; יְהוָה को व्यक्तिगत नाम ‘यहोवा’ के रूप में प्रस्तुत किया गया है।
- source_word: אַחֲרֵי שְׂרֹף הַמֶּלֶךְ
  choice: यह उस समय के बाद की बात है, जब राजा ने ... जला दिया था
  rationale: पूर्वसर्ग और infinitive construct के समय-संबंध को स्पष्ट करता है और जलाने की घटना को वचन आने से पहले रखता है।
- source_word: הַמְּגִלָּה
  choice: पुस्तक-लपेटे
  rationale: लिखित, लपेटे जाने वाले दस्तावेज़ का अर्थ आधुनिक पाठक के लिए स्पष्ट करता है; केवल ‘पुस्तक’ कहने से प्राचीन भौतिक रूप खो सकता था।
- source_word: וְאֶת הַדְּבָרִים
  choice: और उन वचनों को
  rationale: भौतिक पुस्तक-लपेटे और उस पर लिखे भविष्यद्वाणी के वचनों के बीच मूल पाठ का भेद बनाए रखता है।
- source_word: אֲשֶׁר כָּתַב בָּרוּךְ מִפִּי יִרְמְיָהוּ
  choice: जिन्हें बारूक ने यिर्मयाह के मुँह से सुनकर लिखा था
  rationale: शाब्दिक ‘यिर्मयाह के मुँह से’ की मौखिकता रखते हुए हिन्दी में यह स्पष्ट करता है कि बारूक ने यिर्मयाह से सुनकर लिखा था; ‘लिखवाने पर’ का विकल्प टिप्पणी में दिया गया है।
- source_word: לֵאמֹר
  choice: यहोवा ने कहा,
  rationale: अगले पद में आने वाले ईश्वरीय कथन की सहज भूमिका बनाता है; हिन्दी में अकेला ‘कहते हुए’ अस्वाभाविक और अस्पष्ट होता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ के व्यक्तिगत ईश्वरीय नाम को उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं किया गया। आधुनिक हिन्दी बाइबलीय परिचय में प्रचलित ‘यहोवा’ चुना गया, जबकि ‘याहवे’ अधिक प्रत्यक्ष विद्वत्तापूर्ण लिप्यंतरण है।
- issue: מִפִּי יִרְמְיָהוּ में लेखन की प्रक्रिया
  choice: यिर्मयाह के मुँह से सुनकर
  alternative: यिर्मयाह के लिखवाने पर
  rationale: मूल मुहावरे की मौखिक छवि और श्रुतलेख का आशय दोनों सुरक्षित हैं; पाठ यह निर्धारित नहीं करता कि प्रक्रिया किस तकनीकी विधि से हुई।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। लंबे इब्रानी वाक्य को पठनीय हिन्दी के लिए तीन वाक्यात्मक इकाइयों में बाँटा गया है, पर समय-क्रम और अगले पद की कथन-भूमिका सुरक्षित है।
