  text: וַ/יַּגֵּ֤ד לָ/הֶם֙ מִכָ֔יְהוּ אֵ֥ת כָּל הַ/דְּבָרִ֖ים אֲשֶׁ֣ר שָׁמֵ֑עַ בִּ/קְרֹ֥א בָר֛וּךְ בַּ/סֵּ֖פֶר בְּ/אָזְנֵ֥י הָ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/013.yaml
  text: And Micaiah told them all the words that he had heard when Baruch read the scroll in the hearing of the people[a].
translation:
  language: hi
  text: तब मीकायाह ने उन्हें वे सब वचन बता दिए जो उसने उस समय सुने थे, जब बारूक लोगों के सुनते हुए पुस्तक[a] पढ़ रहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पुस्तक-पट’।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: बता दिए
  rationale: हिफ़ील रूप यहाँ सुनी हुई बातों को दूसरों को बताने या सूचित करने का अर्थ देता है। ‘बता दिए’ आधुनिक हिन्दी में स्वाभाविक है और पूर्ण हुई क्रिया को व्यक्त करता है।
- source_word: לָהֶם
  choice: उन्हें
  rationale: यह प्रसंग में उपस्थित अधिकारियों की ओर संकेत करने वाला परोक्ष कर्म सर्वनाम है।
- source_word: מִכָיְהוּ
  choice: मीकायाह
  rationale: इब्रानी व्यक्तिगत नाम का हिन्दी में प्रचलित बाइबलीय लिप्यंतरण।
- source_word: אֵת כָּל הַדְּבָרִים
  choice: वे सब वचन
  rationale: דְּבָרִים का मूल अर्थ ‘वचन/बातें’ है। ‘सब वचन’ लिखे और पढ़े गए संदेश पर यिर्मयाह की पुस्तक के बल को बनाए रखता है।
- source_word: אֲשֶׁר שָׁמֵעַ
  choice: जो उसने ... सुने थे
  rationale: क़ातल रूप उस सुनने को बताने की क्रिया से पहले पूर्ण हुआ दिखाता है; हिन्दी का पूर्ण भूतकाल इसे स्पष्ट करता है।
- source_word: בִּקְרֹא
  choice: जब ... पढ़ रहा था
  rationale: पूर्वसर्ग सहित infinitive construct समयगत परिस्थिति बताता है। ‘जब ... पढ़ रहा था’ पढ़ने के दौरान मीकायाह के सुनने का स्वाभाविक बोध देता है और क्रिया की कालगत अस्पष्टता को अत्यधिक सीमित नहीं करता।
- source_word: בָרוּךְ
  choice: बारूक
  rationale: इब्रानी व्यक्तिगत नाम का हिन्दी में प्रचलित लिप्यंतरण।
- source_word: בַּסֵּפֶר
  choice: पुस्तक
  rationale: סֵפֶר का अर्थ पुस्तक, लिखित दस्तावेज़ या पुस्तकाकार लपेटा हुआ पत्र हो सकता है। यिर्मयाह 36 में यह लिखित ग्रंथ-पट है; मुख्य पाठ में सहज ‘पुस्तक’ रखा गया है और अधिक भौतिक रूप ‘पुस्तक-पट’ को पादटिप्पणी में दिया गया है।
- source_word: בְּאָזְנֵי הָעָם
  choice: लोगों के सुनते हुए
  rationale: शाब्दिक ‘लोगों के कानों में’ हिन्दी में अस्वाभाविक होगा। यह चयन सार्वजनिक रूप से उनकी श्रवण-सीमा में पढ़े जाने का अर्थ सुरक्षित रखता है।
