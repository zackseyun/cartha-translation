    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַוֶּה
  choice: आज्ञा देते हुए
  rationale: पिअेल रूप का निर्देशात्मक बल बनाए रखता है; केवल ‘समझाया’ या ‘बताया’ की अपेक्षा अधिक सटीक है।
- source_word: לֵאמֹר
  choice: कहा
  rationale: यह कथन का मानक परिचायक है; हिन्दी में ‘आज्ञा देते हुए कहा’ स्वाभाविक रूप से दोनों इब्रानी पदों का अर्थ व्यक्त करता है।
- source_word: עָצוּר
  choice: मुझे रोक दिया गया है
  rationale: यह किसी के रोके, सीमित किए या किसी बाधा के कारण न जा पाने की स्थिति को व्यक्त करता है, पर प्रतिबंध के ठीक स्वरूप को निश्चित नहीं करता।
- source_word: לֹא אוּכַל
  choice: मैं … नहीं जा सकता
  rationale: नकारात्मक יכל का सीधा और स्वाभाविक हिन्दी रूप, जो असमर्थता व्यक्त करता है।
- source_word: לָבוֹא
  choice: में … जा सकता
  rationale: वक्ता के दृष्टिकोण से याहवे के भवन में प्रवेश करने का स्वाभाविक हिन्दी निरूपण है।
- source_word: בֵּית יְהוָה
  choice: याहवे का भवन
  rationale: इब्रानी ‘याहवे का घर/भवन’ की अभिव्यक्ति को बनाए रखता है और मन्दिर का संकेत देता है, बिना उसे व्याख्यात्मक रूप से प्रतिस्थापित किए।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय दिव्य नाम को हिन्दी में प्रचलित निकट लिप्यंतरण द्वारा प्रस्तुत करता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में दिव्य नाम प्रत्यक्ष रूप से है; ‘याहवे’ उसका लिप्यंतरण करता है और उसे उपाधि ‘प्रभु’ से नहीं बदलता।
- issue: यिर्मयाह पर लगी रोक का स्वरूप
  choice: अनिर्दिष्ट रखा गया—‘मुझे रोक दिया गया है’
  alternative: मैं बन्दी हूँ; मैं कारागार में हूँ; मैं अशुद्ध हूँ
  rationale: עָצוּר यह स्पष्ट नहीं करता कि बाधा सरकारी हिरासत, बन्दीकरण, धार्मिक कारण या कोई अन्य रोक थी; इसलिए पाठ से अधिक निश्चित अर्थ नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप। ‘आज्ञा देते हुए कहा’ निर्देश और कथन-परिचायक दोनों को स्वाभाविक ढंग से व्यक्त करता है। मुख्य पाठ में [a] चिह्न संबंधित अस्पष्ट पद के तुरंत बाद रखा गया है।
