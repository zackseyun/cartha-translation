  text: וְ/יִרְמְיָ֜הוּ לָקַ֣ח מְגִלָּ֣ה אַחֶ֗רֶת וַֽ/יִּתְּנָ/הּ֮ אֶל בָּר֣וּךְ בֶּן נֵרִיָּהוּ֮ הַ/סֹּפֵר֒ וַ/יִּכְתֹּ֤ב עָלֶ֨י/הָ֙ מִ/פִּ֣י יִרְמְיָ֔הוּ אֵ֚ת כָּל דִּבְרֵ֣י הַ/סֵּ֔פֶר אֲשֶׁ֥ר שָׂרַ֛ף יְהוֹיָקִ֥ים מֶֽלֶךְ יְהוּדָ֖ה בָּ/אֵ֑שׁ וְ/ע֨וֹד נוֹסַ֧ף עֲלֵי/הֶ֛ם דְּבָרִ֥ים רַבִּ֖ים כָּ/הֵֽמָּה׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/032.yaml
  text: Then Jeremiah took another scroll and gave it to Baruch son of Neriah[a], the scribe, and he wrote on it from the mouth of Jeremiah all the words of the scroll that Jehoiakim king of Judah had burned in the fire; and many similar words were added to them besides.
translation:
  language: hi
  text: तब यिर्मयाह ने एक और लेख-पत्र लिया और उसे नेरिय्याह के पुत्र बारूक लिपिक को दे दिया। बारूक ने यिर्मयाह के कहने पर[a] उस पुस्तक के सभी वचन उस पर लिख दिए, जिसे यहूदा के राजा यहोयाकीम ने आग में जला दिया था। और उनके साथ उन्हीं के समान बहुत-से वचन और जोड़ दिए गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “यिर्मयाह के मुँह से”; अर्थात यिर्मयाह के बोलकर लिखवाने पर।
    reason: मִפִּי יִרְמְיָהוּ की शाब्दिक अभिव्यक्ति तथा उसके मुहावरेदार श्रुतलेख-संबंधी आशय को स्पष्ट करता है।
lexical_decisions:
- source_word: מְגִלָּה אַחֶרֶת
  choice: एक और लपेटा हुआ लेख-पत्र
  rationale: מְגִלָּה लिखित scroll को दर्शाता है। यह अनुवाद उसकी लपेटी जाने वाली भौतिक आकृति को स्पष्ट करता है, बिना किसी ऐसी सामग्री—जैसे चमड़ा—का उल्लेख किए जो मूल में नहीं है।
- source_word: וַיִּתְּנָהּ אֶל בָּרוּךְ
  choice: उसे ... बारूक ... को दे दिया
  rationale: נתן עם אֶל का सीधा और स्वाभाविक अर्थ ‘किसी को देना’ है।
- source_word: הַסֹּפֵר
  choice: शास्त्री
  rationale: סֹפֵר यहाँ पेशेवर लेखक अथवा राजकीय लिपिक को दर्शाता है। ‘शास्त्री’ ऐतिहासिक पद को बनाए रखता है; आधुनिक ‘सचिव’ इस प्रसंग में अनावश्यक रूप से कार्यालयी लगेगा।
- source_word: וַיִּכְתֹּב עָלֶיהָ
  choice: बारूक ने ... उस पर लिख दिए
  rationale: संदर्भ में निकटतम कर्ता बारूक है, जिसे लेख-पत्र दिया गया था। עַל लेखन की सतह के लिए ‘उस पर’ है। स्पष्टता के लिए सर्वनाम के स्थान पर बारूक का नाम दोहराया गया है।
- source_word: מִפִּי יִרְמְיָהוּ
  choice: यिर्मयाह के मुख से सुनकर
  rationale: शाब्दिक चित्र ‘यिर्मयाह के मुख से’ सुरक्षित है और ‘सुनकर’ से मौखिक कथन को लिखने का प्रसंग स्वाभाविक हिंदी में स्पष्ट होता है। पादटिप्पणी इसका आशय ‘बोलकर लिखवाने पर’ भी बताती है।
- source_word: אֵת כָּל דִּבְרֵי הַסֵּפֶר
  choice: उस लेख-पत्र के वे सभी वचन
  rationale: סֵפֶר सामान्यतः पुस्तक या लिखित दस्तावेज हो सकता है, पर यहाँ वही भौतिक scroll अभिप्रेत है जिसे जलाया गया और फिर बदला गया। ‘वचन’ דְּבָרִים के साहित्यिक-भविष्यवाणी संबंधी स्वर को बनाए रखता है।
- source_word: אֲשֶׁר שָׂרַף ... בָּאֵשׁ
  choice: जिसे ... आग में जला दिया था
  rationale: यह संबंधवाचक उपवाक्य पहले वाले लेख-पत्र को संदर्भित करता है। पूर्ण क्रिया पूर्व घटना को स्वाभाविक हिंदी में व्यक्त करती है।
- source_word: וְעוֹד נוֹסַף עֲלֵיהֶם
  choice: उनके साथ ... और भी ... जोड़ दिए गए
  rationale: יסף का निफ़अल रूप कर्मवाच्य है और अतिरिक्त सामग्री जोड़े जाने को दर्शाता है; וְעוֹד को ‘और भी’ से व्यक्त किया गया है।
- source_word: דְּבָרִים רַבִּים כָּהֵמָּה
  choice: वैसे ही और भी बहुत-से वचन
  rationale: כָּהֵמָּה का अर्थ ‘उनके जैसे/वैसे ही’ है। यह रूप समान प्रकार के अनेक अतिरिक्त वचनों का अर्थ बनाए रखता है।
