translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण, कथात्मक रूप अपनाया गया है। ‘लपेटा हुआ लेख-पत्र’ ऐतिहासिक वस्तु को सामान्य पाठक के लिए स्पष्ट करता है और मूल में अनुपस्थित सामग्री का अनुमान नहीं लगाता। नामों के लिए प्रचलित हिंदी बाइबलीय रूप—यिर्मयाह, नेरिय्याह, बारूक और यहोयाकीम—रखे गए हैं।
