  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יַּ֗עַשׂ בָּרוּךְ֙ בֶּן נֵ֣רִיָּ֔ה כְּ/כֹ֥ל אֲשֶׁר צִוָּ֖/הוּ יִרְמְיָ֣הוּ הַ/נָּבִ֑יא לִ/קְרֹ֥א בַ/סֵּ֛פֶר דִּבְרֵ֥י יְהוָ֖ה בֵּ֥ית יְהֹוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/008.yaml
  text: And Baruch son of Neriah did according to all that Jeremiah the prophet had commanded him, to read from the scroll the words of the LORD in the house of the LORD.
translation:
  language: hi
  text: नेरियाह के पुत्र बारूक ने वह सब किया जिसकी आज्ञा यिर्मयाह नबी ने उसे दी थी कि वह यहोवा के भवन में पुस्तक में से यहोवा के वचन पढ़े।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ ... כְּכֹל
  choice: ने ... वह सब किया
  rationale: इब्रानी कथन की पूर्ण आज्ञाकारिता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: לִקְרֹא
  choice: पढ़कर सुनाए
  rationale: यहाँ सार्वजनिक रूप से लिखित वचन पढ़ने का संदर्भ है; केवल ‘पढ़े’ की अपेक्षा ‘पढ़कर सुनाए’ श्रोताओं के सामने किए गए पाठ को अधिक स्पष्टता से व्यक्त करता है।
- source_word: בַסֵּפֶר
  choice: पुस्तक से
  rationale: סֵפֶר इस संदर्भ में लिखित ग्रंथ-पुस्तक को सूचित करता है; हिन्दी में ‘पुस्तक’ सहज और गरिमापूर्ण है, जबकि उसकी लपेटी हुई भौतिक बनावट को अनावश्यक रूप से प्रमुख नहीं किया गया।
- source_word: בֵּית יְהוָה
  choice: यहोवा के भवन में
  rationale: בֵּית का मूल बिंब सुरक्षित रखते हुए यह वाक्यांश मंदिर-परिसर के अभिप्रेत धार्मिक स्थान को स्वाभाविक बाइबलीय हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के विशिष्ट नाम को सामान्य उपाधि में बदलने के बजाय हिन्दी में प्रचलित नामरूप से प्रस्तुत किया गया है।
theological_decisions:
- issue: यिर्मयाह की आज्ञा और सार्वजनिक पाठ के बीच वाक्यगत संबंध
  choice: द्विबिंदु के बाद ‘उसने ... पढ़कर सुनाए’
  alternative: ‘... आज्ञा दी थी कि वह ... पढ़े’
  rationale: इब्रानी לִקְרֹא को आज्ञा की विषयवस्तु अथवा बारूक के कार्य की व्याख्या—दोनों रूपों में समझा जा सकता है। चुना हुआ रूप आदेश के पालन को स्पष्ट करता है, पर कोई अतिरिक्त धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
- issue: दिव्य नाम का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में יהוה विशिष्ट नाम है। ‘यहोवा’ नाम और ‘प्रभु’ उपाधि के भेद को बनाए रखता है और किसी संप्रदाय-विशेष की व्याख्या आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘नबी’, ‘भवन’ और ‘वचन’ जैसे परिचित बाइबलीय शब्दों का प्रयोग किया गया है; वाक्य को हिन्दी में सहज बनाने के लिए इब्रानी उद्देश्यवाचक रचना को द्विबिंदु के बाद स्वतंत्र उपवाक्य के रूप में प्रस्तुत किया गया है।
