base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/014.yaml
  text: Then all the officials sent Jehudi son of Nethaniah[a], son of Shelemiah, son of Cushi, to Baruch, saying, “Take in your hand the scroll from which you read in the hearing of the people, and come.” So Baruch son of Neriah took the scroll in his hand and came to them.
translation:
  language: hi
  text: तब सभी अधिकारियों ने नतन्याह के पुत्र, शेलेम्याह के पुत्र, कूशी के पुत्र यहूदी को बारूक के पास यह कहने के लिए भेजा, “वह लपेटी हुई पुस्तक, जिसमें से तुमने लोगों को पढ़कर सुनाया था, अपने हाथ में लो और आ जाओ[a]।” तब नेरिय्याह का पुत्र बारूक उस लपेटी हुई पुस्तक को अपने हाथ में लेकर उनके पास आया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “और जाओ।” बुलाने वालों के स्थान की ओर आने के अर्थ में हिन्दी में “आ जाओ” अधिक स्वाभाविक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׂרִים
  choice: अधिकारी
  rationale: इस राजकीय-प्रशासनिक प्रसंग में שַׂר का अर्थ वंशगत ‘राजकुमार’ से अधिक राज्य के उच्च अधिकारी हैं।
- source_word: יְהוּדִי
  choice: यहूदी
  rationale: वंशावली से स्पष्ट है कि यहाँ यह व्यक्तिगत नाम है; इसलिए इसका अनुवाद जातिसूचक शब्द के रूप में नहीं किया गया।
- source_word: הַמְּגִלָּה
  choice: पुस्तक-लपेटा
  rationale: מְגִלָּה लिखित सामग्री के लपेटे हुए रूप को दर्शाता है। ‘पुस्तक-लपेटा’ वस्तु का स्वरूप और लिखित पाठ—दोनों स्पष्ट करता है।
- source_word: קָרָאתָ בָּהּ בְּאָזְנֵי הָעָם
  choice: जिसमें से तुमने लोगों को पढ़कर सुनाया था
  rationale: קרא עם ב लिखित पाठ में से ऊँचे स्वर में पढ़ने का भाव देता है, और ‘लोगों को पढ़कर सुनाया’ בְּאָזְנֵי की सार्वजनिक श्रव्यता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: קָחֶנָּה בְיָדְךָ
  choice: उसे अपने हाथ में लो
  rationale: स्त्रीलिंग कर्म-प्रत्यय पुस्तक-लपेटे की ओर संकेत करता है; ‘अपने हाथ में’ मूल की मूर्त अभिव्यक्ति और आगे बारूक के अनुपालन से समानता बनाए रखता है।
- source_word: וָלֵךְ
  choice: और आ जाओ
  rationale: मूल क्रिया का शाब्दिक अर्थ ‘जाओ’ है, पर बुलाने वालों के स्थान की ओर आने की आज्ञा आधुनिक हिन्दी में स्वाभाविक रूप से ‘आ जाओ’ कही जाती है।
- source_word: וַיָּבֹא אֲלֵיהֶם
  choice: उनके पास आया
  rationale: बारूक अधिकारियों के स्थान तक पहुँचा; गंतव्य-केंद्रित हिन्दी में ‘उनके पास आया’ सहज और सटीक है।
