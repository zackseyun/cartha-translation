source:
  edition: WLC
  text: קַח לְ/ךָ֮ מְגִלַּת סֵפֶר֒ וְ/כָתַבְתָּ֣ אֵלֶ֗י/הָ אֵ֣ת כָּל הַ/דְּבָרִ֞ים אֲשֶׁר דִּבַּ֧רְתִּי אֵלֶ֛י/ךָ עַל יִשְׂרָאֵ֥ל וְ/עַל יְהוּדָ֖ה וְ/עַל כָּל הַ/גּוֹיִ֑ם מִ/יּ֞וֹם דִּבַּ֤רְתִּי אֵלֶ֨י/ךָ֙ מִ/ימֵ֣י יֹאשִׁיָּ֔הוּ וְ/עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/002.yaml
  text: Take for yourself a scroll[a], and write on it all the words that I have spoken to you concerning Israel and concerning Judah and concerning all the nations, from the day I spoke to you, from the days of Josiah until this day.
translation:
  language: hi
  text: अपने लिए एक लेखपत्र लो और उस पर वे सभी वचन लिखो जो मैंने इस्राएल, यहूदा और सभी राष्ट्रों के विषय में[a] तुमसे कहे हैं—उस दिन से जब मैंने तुमसे बात की, अर्थात् योशिय्याह के दिनों से इस दिन तक।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस्राएल, यहूदा और सभी राष्ट्रों के विरुद्ध।” भविष्यद्वाणी के प्रसंगों में इस इब्रानी पूर्वसर्ग का अर्थ “के विषय में” या “के विरुद्ध,” दोनों हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: קַח לְךָ
  choice: अपने लिए ... लो
  rationale: आज्ञार्थक क्रिया के साथ לְךָ नबी की व्यक्तिगत भागीदारी पर हल्का बल देता है; इसलिए केवल ‘लो’ के बजाय ‘अपने लिए ... लो’ रखा गया है।
- source_word: מְגִלַּת סֵפֶר
  choice: एक लपेटा हुआ पुस्तक-पत्र
  rationale: यह पद लिखने के लिए प्रयुक्त पुस्तकाकार लपेटे हुए पत्र, अर्थात् स्क्रॉल, को दर्शाता है। ‘लपेटा हुआ पुस्तक-पत्र’ आधुनिक पाठक को वस्तु का रूप समझाता है और केवल अंग्रेज़ी आगत शब्द पर निर्भर नहीं रहता।
- source_word: וְכָתַבְתָּ אֵלֶיהָ
  choice: और उस पर ... लिखो
  rationale: प्रारम्भिक आज्ञा के बाद यह क्रियारूप क्रमिक आज्ञा का कार्य करता है; स्त्रीलिंग प्रत्यय का संदर्भ पुस्तक-पत्र से है।
- source_word: אֵת כָּל הַדְּבָרִים
  choice: वे सभी वचन
  rationale: भविष्यद्वाणी के लेखन के संदर्भ में דְּבָרִים के लिए ‘वचन’ मौखिक ईश्वरीय संदेश का भाव बनाए रखता है।
- source_word: אֲשֶׁר דִּבַּרְתִּי אֵלֶיךָ
  choice: जो मैंने ... तुमसे कहे हैं
  rationale: पूर्ण हुई वाणी की वर्तमान आदेश में बनी हुई प्रासंगिकता को ‘कहे हैं’ सहज हिन्दी में व्यक्त करता है।
- source_word: עַל יִשְׂרָאֵל וְעַל יְהוּדָה וְעַל כָּל הַגּוֹיִם
  choice: इस्राएल, यहूदा और सभी जातियों के विषय में
  rationale: עַל यहाँ विषय-संबंधी ‘के विषय में’ अथवा विरोधी ‘के विरुद्ध’ दोनों अर्थ दे सकता है। मुख्य पाठ में व्यापक और कम व्याख्यात्मक अर्थ चुना गया है तथा दूसरा अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: מִיּוֹם דִּבַּרְתִּי אֵלֶיךָ מִימֵי יֹאשִׁיָּהוּ וְעַד הַיּוֹם הַזֶּה
  choice: उस दिन से जब मैंने तुमसे बात की, अर्थात् योशियाह के दिनों से लेकर आज के दिन तक
  rationale: दो आरम्भ-सूचक מִן पदबंधों और अंतिम सीमा עַד को स्पष्ट, स्वाभाविक हिन्दी में रखा गया है; ‘अर्थात्’ दूसरे काल-सूचक पदबंध को पहले की व्याख्या के रूप में दर्शाता है।
theological_decisions:
- issue: इस्राएल, यहूदा और जातियों के साथ עַל का अर्थ
  choice: के विषय में
  alternative: के विरुद्ध
  rationale: यह पद यिर्मयाह को समय भर मिले समस्त वचनों का सार देता है, जिनका दायरा केवल दण्डादेश तक सीमित नहीं है। इसलिए मुख्य पाठ में व्यापक अर्थ रखा गया है, जबकि भविष्यद्वाणी के प्रसंग में सम्भव विरोधी अर्थ को पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘पुस्तक-पत्र’ के साथ ‘लपेटा हुआ’ जोड़कर प्राचीन स्क्रॉल का रूप बिना सामग्री का अनुमान लगाए स्पष्ट किया गया है।
