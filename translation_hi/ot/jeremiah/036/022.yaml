- source_word: וְהַמֶּלֶךְ
  choice: राजा
  rationale: निश्चित उपपद के कारण ‘राजा’ निश्चित है। आरंभिक וְ कथा को पिछले प्रसंग से जोड़ता है; हिंदी में अलग से ‘और’ लगाना यहाँ अनावश्यक और असहज होगा।
- source_word: יוֹשֵׁב
  choice: बैठा हुआ था
  rationale: कृदंत इस दृश्य में जारी अवस्था व्यक्त करता है; ‘बैठा हुआ था’ उस अपूर्णतापरक भाव को स्वाभाविक हिंदी में रखता है।
- source_word: בֵּית הַחֹרֶף
  choice: शीतकालीन भवन
  rationale: शाब्दिक अर्थ ‘सर्दी का घर’ है, अर्थात ठंड के मौसम में उपयोग होने वाला निवास। ‘भवन’ मूल के निकट रहते हुए ‘महल’ की अपेक्षा कम विशिष्ट है।
- source_word: בַּחֹדֶשׁ הַתְּשִׁיעִי
  choice: नौवें महीने में
  rationale: यह काल-सूचक पदबंध का सीधा और स्वाभाविक अनुवाद है।
- source_word: וְאֶת הָאָח לְפָנָיו
  choice: और उसके सामने अंगीठी
  rationale: यह साथ चल रही परिस्थिति को प्रस्तुत करता है। हिंदी में ‘और उसके सामने’ दृश्य के दूसरे तत्व को स्वाभाविक ढंग से जोड़ता है।
- source_word: הָאָח
  choice: अंगीठी
  rationale: यह गर्मी पाने के लिए आग या अंगारे रखने के पात्र को दर्शाता है। ‘अंगीठी’ आधुनिक हिंदी में सटीक और सामान्यतः समझा जाने वाला शब्द है।
- source_word: מְבֹעָרֶת
  choice: जल रही थी
  rationale: स्त्रीलिंग निष्क्रिय कृदंत जलती हुई अवस्था बताता है; ‘जल रही थी’ हिंदी में स्पष्ट रूप से जारी अवस्था व्यक्त करता है।
