id: JER.36.1
reference: Jeremiah 36:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַֽ/יְהִי֙ בַּ/שָּׁנָ֣ה הָ/רְבִיעִ֔ת לִ/יהוֹיָקִ֥ים בֶּן יֹאשִׁיָּ֖הוּ מֶ֣לֶךְ יְהוּדָ֑ה הָיָ֞ה הַ/דָּבָ֤ר הַ/זֶּה֙ אֶֽל יִרְמְיָ֔הוּ מֵ/אֵ֥ת יְהוָ֖ה לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/001.yaml
  text: In the fourth year of Jehoiakim son of Josiah[a], king of Judah, this word came to Jeremiah from Yahweh, saying,
translation:
  language: hi
  text: 'यहूदा के राजा योशिय्याह के पुत्र यहोयाकीम के शासन के चौथे वर्ष में याहवे[a] की ओर से यिर्मयाह के पास यह वचन आया:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में यहाँ परमेश्वर का व्यक्तिगत नाम יהוה (YHWH) है, जिसका लिप्यंतरण ‘याहवे’ किया गया है।
    reason: ईश्वरीय नाम के मूल रूप और अनुवाद-पद्धति को स्पष्ट करना।
lexical_decisions:
- source_word: וַיְהִי
  choice: '[अलग आरंभिक शब्द के रूप में व्यक्त नहीं]'
  rationale: यह कथात्मक पृष्ठभूमि आरंभ करता है। आधुनिक हिन्दी में काल-सूचक वाक्यांश से वाक्य आरंभ करना इसके प्रवचनात्मक कार्य को स्वाभाविक रूप से व्यक्त करता है; ‘और ऐसा हुआ’ जोड़ना अनावश्यक और कुछ पुरातन लगता।
- source_word: בַּשָּׁנָה הָרְבִיעִת לִיהוֹיָקִים
  choice: यहोयाकीम के शासन के चौथे वर्ष में
  rationale: मूल में शाब्दिक रूप से ‘यहोयाकीम के चौथे वर्ष में’ है; राजकीय संदर्भ में निहित ‘शासन’ हिन्दी में अर्थ को स्वाभाविक और स्पष्ट करता है।
- source_word: לִיהוֹיָקִים בֶּן־יֹאשִׁיָּהוּ מֶלֶךְ יְהוּדָה
  choice: यहूदा के राजा योशिय्याह के पुत्र यहोयाकीम
  rationale: हिन्दी की स्वाभाविक संबंध-रचना अपनाई गई है और सभी व्यक्तियों तथा राजकीय पद का संबंध सुरक्षित रखा गया है।
- source_word: הַדָּבָר הַזֶּה
  choice: यह वचन
  rationale: דָּבָר के लिए ‘बात’ या ‘संदेश’ संभव हैं, पर भविष्यद्वाणी के सूत्र में ‘वचन’ दैवी प्रकाशन की साहित्यिक और धर्मवैज्ञानिक प्रतिध्वनि को बनाए रखता है।
- source_word: אֶל־יִרְמְיָהוּ
  choice: यिर्मयाह के पास
  rationale: इब्रानी दिशा-सूचक अभिव्यक्ति का स्वाभाविक हिन्दी रूप, जो वचन के भविष्यद्वक्ता तक आने की छवि बनाए रखता है।
- source_word: מֵאֵת יְהוָה
  choice: याहवे की ओर से
  rationale: מֵאֵת स्रोत को दर्शाता है। יְהוָה को उसके व्यक्तिगत वाचा-नाम ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: לֵאמֹר
  choice: ':'
  rationale: यह आगामी प्रत्यक्ष कथन का परिचय देता है। आधुनिक हिन्दी में वाक्य के अंत का द्विबिंदु ‘यह कहते हुए’ की तुलना में अधिक स्वाभाविक ढंग से वही कार्य करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे प्रयुक्त है। ‘याहवे’ उसका व्यापक रूप से स्वीकृत विद्वतापरक उच्चारण-सन्निकटन है और नाम को उपाधि में नहीं बदलता।
- issue: דָּבָר का भविष्यद्वाणी-संबंधी अर्थ
  choice: वचन
  alternative: संदेश / बात
  rationale: ‘वचन’ दैवी संप्रेषण का भाव सुरक्षित रखता है, जबकि यह दावा नहीं करता कि इसका अर्थ केवल बोले गए एक शब्द तक सीमित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। नामों के प्रचलित हिन्दी बाइबिलीय रूप अपनाए गए हैं। आरंभिक וַיְהִי का अलग, कृत्रिम अनुवाद नहीं जोड़ा गया; לֵאמֹר को आगामी प्रत्यक्ष वचन के लिए द्विबिंदु से व्यक्त किया गया है।
