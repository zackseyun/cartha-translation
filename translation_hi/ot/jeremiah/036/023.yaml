  text: וַ/יְהִ֣י כִּ/קְר֣וֹא יְהוּדִ֗י שָׁלֹ֣שׁ דְּלָתוֹת֮ וְ/אַרְבָּעָה֒ יִֽקְרָעֶ֨/הָ֙ בְּ/תַ֣עַר הַ/סֹּפֵ֔ר וְ/הַשְׁלֵ֕ךְ אֶל הָ/אֵ֖שׁ אֲשֶׁ֣ר אֶל הָ/אָ֑ח עַד תֹּם֙ כָּל הַ/מְּגִלָּ֔ה עַל הָ/אֵ֖שׁ אֲשֶׁ֥ר עַל הָ/אָֽח׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/023.yaml
  text: And whenever Yehudi had read three or four columns[a], he would cut it off with the scribe’s knife and throw it into the fire that was in the brazier[b], until the entire scroll was consumed in the fire that was in the brazier.
translation:
  language: hi
  text: जब भी यिहूदी ग्रंथ-पत्र के तीन या चार स्तंभ[a] पढ़ चुका होता, वह उसे लिपिक की छुरी से काटकर अँगीठी[b] की आग में फेंक देता, और ऐसा तब तक करता रहता जब तक पूरा ग्रंथ-पत्र अँगीठी की आग में जलकर समाप्त नहीं हो गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शाब्दिक रूप से “तीन या चार दरवाज़े”; यहाँ यह ग्रंथ-पत्र के भागों को सूचित करता है, सम्भवतः उसके स्तंभों या पैनलों को।
    reason: lexical_alternative
  - marker: b
    text: इसके लिए “आग रखने का पात्र” या “अग्निकुंड” भी कहा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּקְרֹא
  choice: जब-जब ... पढ़ लेता
  rationale: כְּ के साथ क्रिया और प्रसंग में क्रमशः दोहराई गई कार्रवाई को आधुनिक हिन्दी में स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוּדִי
  choice: यहूदी
  rationale: यह व्यक्ति का नाम है; इसे हिब्रू उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: שָׁלֹשׁ דְּלָתוֹת וְאַרְבָּעָה
  choice: तीन-चार खाने
  rationale: דְּלָתוֹת का शाब्दिक अर्थ ‘दरवाज़े’ है, पर यहाँ ग्रंथ-पत्र के क्रमिक लिखित भाग अभिप्रेत हैं; ‘खाने’ पैनल या कॉलम का सहज हिन्दी बोध देता है।
- source_word: יִקְרָעֶהָ
  choice: उस हिस्से को ... काट देता
  rationale: क्रिया का सामान्य अर्थ फाड़ना है, किंतु छुरी के उल्लेख के कारण यहाँ काटना अधिक सटीक है; ‘उस हिस्से’ से पढ़े हुए भाग को अलग करने की कार्रवाई स्पष्ट होती है।
- source_word: בְּתַעַר הַסֹּפֵר
  choice: लिपिक की छुरी से
  rationale: תַּעַר काटने का धारदार औज़ार है और סֹפֵר लिखने वाला लिपिक; प्रसंग में ‘छुरी’ स्वाभाविक है।
- source_word: וְהַשְׁלֵךְ
  choice: और ... फेंक देता
  rationale: यह बार-बार होने वाली अगली कार्रवाई को सरल, वर्तमान हिन्दी में व्यक्त करता है।
- source_word: הָאָח
  choice: अँगीठी
  rationale: शीतकालीन कक्ष के प्रसंग में आग रखने के पात्र या खुले ताप-पात्र के लिए ‘अँगीठी’ सर्वाधिक सहज हिन्दी शब्द है।
- source_word: עַד תֹּם כָּל הַמְּגִלָּה
  choice: जब तक पूरा ग्रंथ-पत्र ... जलकर समाप्त नहीं हो गया
  rationale: हिब्रू वाक्यांश विनाश-प्रक्रिया के अंतिम बिंदु को बताता है; जलना निकट प्रसंग से स्पष्ट है।
- source_word: הַמְּגִלָּה
  choice: ग्रंथ-पत्र
  rationale: מְגִלָּה लिखित स्क्रॉल है। ‘ग्रंथ-पत्र’ लिखित, लपेटे जाने वाले दस्तावेज़ का अर्थ देता है और इसे सामान्य पुस्तक से अलग रखता है।
- source_word: אֶל הָאֵשׁ אֲשֶׁר אֶל הָאָח / עַל הָאֵשׁ אֲשֶׁר עַל הָאָח
  choice: अँगीठी की आग में
  rationale: हिब्रू में पूर्वसर्गों का हल्का अंतर है, पर हिन्दी में यह आग और अँगीठी का संबंध संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: काटने और आग में फेंकने वाली क्रियाओं का कर्ता
  choice: वह
  alternative: राजा
  rationale: हिब्रू में इन क्रियाओं का कर्ता संज्ञा के रूप में दोबारा नहीं दिया गया है। ‘वह’ मूल की व्याकरणिक अस्पष्टता बनाए रखता है और प्रसंग से ‘राजा’ को अनुवाद में नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘जब-जब’ तथा ‘ऐसा तब तक होता रहा’ दोहराई गई कार्रवाई को स्पष्ट करते हैं। मुख्य पाठ में [a] और [b] दोनों पादटिप्पणी-चिह्न उपस्थित हैं।
