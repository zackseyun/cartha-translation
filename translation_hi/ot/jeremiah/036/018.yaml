  yaml_path: translation/ot/jeremiah/036/018.yaml
  text: Then Baruch said to them[a], “He would recite all these words to me with his mouth, and I was writing them on the scroll with ink.”
translation:
  language: hi
  text: तब बारूक ने उनसे कहा[a], “वह ये सब वचन अपने मुँह से मुझे बोलकर सुनाते थे, और मैं उन्हें स्याही से उस लिपटे हुए पत्र पर लिखता था।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह ये सब वचन अपने मुँह से मुझे पढ़कर सुनाते थे, और मैंने उन्हें स्याही से उस लिपटे हुए पत्र पर लिखा।” हिब्रू क्रिया का अर्थ प्रायः “पढ़ना” होता है, पर यहाँ का प्रसंग यह अर्थ भी समर्थित करता है कि वह बारूक को लिखने के लिए वचन बोलकर सुना रहा था।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם בָּרוּךְ
  choice: तब बारूक ने उनसे कहा
  rationale: वाव-क्रम कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में क्रम स्पष्ट करता है। नाम בָּרוּךְ का मानक रूप ‘बारूक’ रखा गया है।
- source_word: מִפִּיו יִקְרָא אֵלַי
  choice: वह ... अपने मुँह से मुझे बोलकर सुनाते जाते थे
  rationale: קרא सामान्यतः ‘पढ़ना/पुकारना’ है, पर यहाँ यिर्मयाह द्वारा बारूक को लिखने के लिए मौखिक रूप से वचन सुनाने का प्रसंग है। यह चयन श्रुतलेखन का आशय देता है और מִפִּיו की ठोस अभिव्यक्ति भी बचाए रखता है।
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: ये सब वचन
  rationale: דברים यहाँ भविष्यद्वाणी के बोले और लिखे गए वचनों को सूचित करता है; ‘वचन’ प्रसंगानुकूल और गरिमापूर्ण है।
- source_word: וַאֲנִי כֹּתֵב
  choice: और मैं उन्हें ... लिखता जाता था
  rationale: यह रूप सुनाए जाने के साथ चलती हुई, बार-बार जारी लेखन-क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है। स्पष्टता के लिए ‘उन्हें’ जोड़ा गया है, जिसका संदर्भ ‘ये सब वचन’ है।
- source_word: עַל הַסֵּפֶר
  choice: पुस्तक-पट पर
  rationale: סֵפֶר यहाँ आधुनिक जिल्दबंद पुस्तक नहीं, लिखने की लपेटी जाने वाली सामग्री को दर्शाता है। ‘पुस्तक-पट’ ऐतिहासिक वस्तु का संकेत देता है और ‘पर’ हिब्रू עַל को बनाए रखता है।
- source_word: בַּדְּיוֹ
  choice: स्याही से
  rationale: בְּ यहाँ साधन अथवा सामग्री सूचित करता है; ‘स्याही से’ स्वाभाविक और सटीक हिन्दी है।
