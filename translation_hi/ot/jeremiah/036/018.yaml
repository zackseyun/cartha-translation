translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘बोलकर सुनाते जाते थे / लिखता जाता था’ समकालिक और जारी क्रियाओं को स्पष्ट करता है। ‘पुस्तक-पट’ का प्रयोग प्राचीन scroll को आधुनिक पुस्तक से अलग दिखाने के लिए किया गया है।
