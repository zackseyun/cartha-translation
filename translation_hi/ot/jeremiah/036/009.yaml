language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יְהִ֣י בַ/שָּׁנָ֣ה הַ֠/חֲמִשִׁית לִ/יהוֹיָקִ֨ים בֶּן יֹאשִׁיָּ֤הוּ מֶֽלֶךְ יְהוּדָה֙ בַּ/חֹ֣דֶשׁ הַ/תְּשִׁעִ֔י קָרְא֨וּ צ֜וֹם לִ/פְנֵ֧י יְהוָ֛ה כָּל הָ/עָ֖ם בִּ/ירֽוּשָׁלִָ֑ם וְ/כָל הָ/עָ֗ם הַ/בָּאִ֛ים מֵ/עָרֵ֥י יְהוּדָ֖ה בִּ/ירוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/009.yaml
  text: And it happened in the fifth year of Jehoiakim son of Josiah[a], king of Judah, in the ninth month, that they proclaimed a fast before Yahweh for all the people in Jerusalem and all the people coming from the cities of Judah into Jerusalem.
translation:
  language: hi
  text: यहूदा के राजा योशिय्याह के पुत्र यहोयाकीम के शासन के पाँचवें वर्ष के नौवें महीने में ऐसा हुआ कि यरूशलेम में उपस्थित सब लोगों और यहूदा के नगरों से यरूशलेम आनेवाले सब लोगों के लिए यहोवा के सामने उपवास की घोषणा की गई।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: ऐसा हुआ
  rationale: यह इब्रानी कथात्मक सूत्र नई घटना का परिचय देता है; यह हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: בַשָּׁנָה הַחֲמִשִׁית לִיהוֹיָקִים
  choice: यहोयाकीम के शासन के पाँचवें वर्ष
  rationale: राजकीय तिथि-सूत्र में नाम के साथ लगा ל शासन-वर्ष को सूचित करता है; स्पष्ट हिन्दी के लिए ‘शासन के’ जोड़ा गया है।
- source_word: בַּחֹדֶשׁ הַתְּשִׁעִי
  choice: नौवें महीने में
  rationale: मूल के साधारण पंचांग-संबंधी कथन को बिना अनावश्यक विस्तार के रखा गया है।
- source_word: קָרְאוּ צוֹם
  choice: उपवास की घोषणा की गई
  rationale: इस मुहावरे का अर्थ सार्वजनिक रूप से उपवास ठहराना है। इब्रानी क्रिया का कर्ता अनिर्दिष्ट है; हिन्दी का भाववाच्य किसी कर्ता का अनुमान लगाने से बचता है।
- source_word: לִפְנֵי יְהוָה
  choice: यहोवा के सामने
  rationale: לִפְנֵי की उपस्थिति/अभिमुखता और परमेश्वर के व्यक्तिगत नाम दोनों को सीधे व्यक्त किया गया है।
- source_word: כָּל הָעָם בִּירוּשָׁלָם
  choice: यरूशलेम में रहनेवाले सब लोगों
  rationale: स्थानवाचक בִּ को बनाए रखते हुए यह स्पष्ट किया गया है कि लोग यरूशलेम में उपस्थित थे, केवल उसके मूल निवासी होना आवश्यक नहीं।
- source_word: וְכָל הָעָם הַבָּאִים מֵעָרֵי יְהוּדָה בִּירוּשָׁלָם
  choice: और यहूदा के नगरों से यरूशलेम आए सब लोगों
  rationale: भागधातु הַבָּאִים को स्वाभाविक हिन्दी संबंधसूचक वाक्यांश में व्यक्त किया गया है और गति का लक्ष्य यरूशलेम रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल में चतुरक्षरी व्यक्तिगत नाम सीधे आया है। हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाने जानेवाले ‘यहोवा’ से नाम और उपाधि का भेद सुरक्षित रहता है।
- issue: उपवास की घोषणा करनेवाला कर्ता
  choice: अनिर्दिष्ट कर्ता को भाववाच्य में रखा गया
  alternative: लोगों ने उपवास की घोषणा की
  rationale: קָרְאוּ बहुवचन है, पर उसका स्पष्ट कर्ता नहीं दिया गया। लोगों को ही घोषणाकर्ता बनाना मूल से अधिक निश्चितता जोड़ता; इसलिए तनाव और अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण कथात्मक शैली। राजकीय तिथि को सहज बनाने के लिए ‘शासन के’ जोड़ा गया है। नामों के रूप हिन्दी बाइबलीय परंपरा के परिचित रूपों में रखे गए हैं।
