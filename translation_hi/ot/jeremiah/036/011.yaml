source:
  edition: WLC
  text: וַ֠/יִּשְׁמַ֗ע מִכָ֨יְהוּ בֶן גְּמַרְיָ֧הוּ בֶן שָׁפָ֛ן אֶת כָּל דִּבְרֵ֥י יְהוָ֖ה מֵ/עַ֥ל הַ/סֵּֽפֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/011.yaml
  text: And Micaiah son of Gemariah[a], son of Shaphan, heard all the words of Yahweh from the scroll.
translation:
  language: hi
  text: तब शापान के पुत्र गमर्याह के पुत्र मीकायाह ने पुस्तक से याहवे के सभी वचन सुने।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: YHWH; परंपरागत रूप से “प्रभु” अनूदित।'
    reason: ईश्वरीय नाम के मूल इब्रानी रूप और पारंपरिक प्रतिस्थापन को स्पष्ट करना।
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: सुने
  rationale: यह क्रिया कथा में बीती हुई घटना बताती है। यहाँ आशय पुस्तक से पढ़े जा रहे वचनों को सुनने का है।
- source_word: מִכָיְהוּ
  choice: मीकायाह
  rationale: नाम का यह देवनागरी रूप हिब्रू उच्चारण के निकट है और हिन्दी बाइबल-पाठकों के लिए पहचानने योग्य है।
- source_word: בֶן גְּמַרְיָהוּ בֶן שָׁפָן
  choice: शापान के पोते और गमर्याह के पुत्र
  rationale: हिब्रू वंशावली-श्रृंखला का संबंध स्पष्ट और स्वाभाविक हिन्दी में व्यक्त किया गया है; दोनों पीढ़ियों की पहचान सुरक्षित रहती है।
- source_word: כָּל
  choice: सभी
  rationale: यह सुनी गई बातों की संपूर्णता को व्यक्त करता है।
- source_word: דִּבְרֵי יְהוָה
  choice: यहोवा के सभी वचन
  rationale: דִּבְרֵי का औपचारिक अर्थ ‘वचन’ रखा गया है और יְהוָה को व्यक्तिगत ईश्वरीय नाम के रूप में प्रस्तुत किया गया है।
- source_word: מֵעַל הַסֵּפֶר
  choice: पुस्तक में से
  rationale: इस प्रसंग में लिखित ग्रंथ से पढ़कर सुनाए जाने का भाव है। ‘पुस्तक’ आधुनिक हिन्दी में स्वाभाविक है, जबकि प्राचीन लिखित माध्यम का स्वरूप पादटिप्पणी में स्पष्ट किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में उपाधि नहीं बल्कि चतुरक्षरीय व्यक्तिगत नाम है। हिन्दी में प्रचलित नामरूप ‘यहोवा’ उसे नाम के रूप में सुरक्षित रखता है; वैकल्पिक लिप्यंतरण पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। वंश-संबंध को हिन्दी के स्वाभाविक क्रम में स्पष्ट किया गया है। मुख्य पाठ में ‘पुस्तक’ रखा गया है, जो लिखित ग्रंथ के अर्थ को संप्रेषित करता है; संदर्भतः यह लपेटी हुई पुस्तक या पुस्तक-पत्र हो सकती थी।
