source:
  edition: WLC
  text: אוּלַ֤י יִשְׁמְעוּ֙ בֵּ֣ית יְהוּדָ֔ה אֵ֚ת כָּל הָ֣/רָעָ֔ה אֲשֶׁ֛ר אָנֹכִ֥י חֹשֵׁ֖ב לַ/עֲשׂ֣וֹת לָ/הֶ֑ם לְמַ֣עַן יָשׁ֗וּבוּ אִ֚ישׁ מִ/דַּרְכּ֣/וֹ הָ/רָעָ֔ה וְ/סָלַחְתִּ֥י לַ/עֲוֺנָ֖/ם וּ/לְ/חַטָּאתָֽ/ם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/003.yaml
  text: Perhaps the house of Judah will hear of all the disaster that I am planning to bring on them[a], so that each man may turn from his evil way[b], and I will forgive their iniquity and their sin.
translation:
  language: hi
  text: शायद यहूदा का घराना उस सारी विपत्ति के बारे में सुने, जिसे मैं उन पर लाने की योजना बना रहा हूँ[a], ताकि हर एक पुरुष अपने बुरे मार्ग से मुड़ जाए[b], और मैं उनके अधर्म और उनके पाप को क्षमा कर दूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उस सारे संकट के बारे में।” इब्रानी में शाब्दिक अर्थ “सारी बुराई/विपत्ति” है। यहाँ आशय उस न्यायपूर्ण विपत्ति से है जिसे परमेश्वर यहूदा पर लाने की चेतावनी देता है, परमेश्वर द्वारा की जाने वाली नैतिक बुराई से नहीं।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “हर एक पुरुष।” एकवचन पुल्लिंग रूप यहाँ यहूदा के लोगों में से प्रत्येक सदस्य का प्रतिनिधित्व करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלַי
  choice: शायद
  rationale: संभावना और आशा का भाव बनाए रखता है, पर परिणाम को निश्चित नहीं बताता।
- source_word: יִשְׁמְעוּ
  choice: सुने
  rationale: मूल क्रिया का सीधा अर्थ ‘सुनना’ है; अपेक्षित प्रतिक्रिया को आगे का उद्देश्य-वाक्य स्पष्ट करता है।
- source_word: בֵּית יְהוּדָה
  choice: यहूदा का घराना
  rationale: यहूदा के लोगों के लिए प्रयुक्त इब्रानी सामूहिक और वाचागत अभिव्यक्ति को बनाए रखता है।
- source_word: אֵת כָּל הָרָעָה
  choice: उस सारी विपत्ति के बारे में
  rationale: इस न्याय-संदर्भ में רָעָה नैतिक बुराई नहीं, बल्कि यहूदा पर आने वाली विपत्ति को दर्शाता है। ‘के बारे में’ हिन्दी में संदेश सुनने का स्वाभाविक प्रयोग है।
- source_word: חֹשֵׁב לַעֲשׂוֹת לָהֶם
  choice: जिसे मैं उन पर लाने की योजना बना रहा हूँ
  rationale: इच्छित या नियोजित कार्य का भाव व्यक्त करता है और विपत्ति को ‘उन पर लाने’ की दिशात्मकता स्पष्ट रखता है।
- source_word: לְמַעַן יָשׁוּבוּ
  choice: ताकि ... फिर जाए
  rationale: उद्देश्य-सूचक रचना और שׁוב के मुड़ने या लौटने के भविष्यद्वक्ताई भाव को बनाए रखता है; ‘पश्चाताप करे’ की अपेक्षा मूल रूपक के निकट है।
- source_word: אִישׁ מִדַּרְכּוֹ הָרָעָה
  choice: हर एक पुरुष अपने बुरे मार्ग से फिर जाए
  rationale: אִישׁ के एकवचन पुल्लिंग रूप और उसके प्रतिनिधिक सामूहिक प्रयोग, दोनों को सुरक्षित रखता है। ‘बुरा मार्ग’ पापपूर्ण आचरण के मूल रूपक को बनाए रखता है।
- source_word: וְסָלַחְתִּי
  choice: और मैं ... क्षमा कर दूँ
  rationale: लोगों के फिरने के बाद अपेक्षित ईश्वरीय प्रत्युत्तर को स्वाभाविक हिन्दी में व्यक्त करता है, बिना शर्त-संबंध को आवश्यकता से अधिक स्पष्ट किए।
- source_word: לַעֲוֺנָם וּלְחַטָּאתָם
  choice: उनके अधर्म और उनके पाप को
  rationale: עָוֹן और חַטָּאת के बीच शब्दगत भेद को ‘अधर्म’ और ‘पाप’ द्वारा बनाए रखता है।
theological_decisions:
- issue: धमकाए गए ईश्वरीय न्याय के संदर्भ में רָעָה का अनुवाद
  choice: विपत्ति
  alternative: बुराई; संकट
  rationale: यहाँ शब्द उस न्यायपूर्ण विपत्ति को दर्शाता है जिसे परमेश्वर यहूदा पर लाने की योजना बताता है, न कि परमेश्वर में किसी नैतिक बुराई को।
- issue: प्रतिनिधिक पुल्लिंग אִישׁ
  choice: हर एक पुरुष
  alternative: हर एक व्यक्ति; हर कोई
  rationale: इब्रानी का रूप एकवचन पुल्लिंग है, यद्यपि उसका आशय यहूदा के लोगों में से प्रत्येक सदस्य से है। मुख्य पाठ स्रोत-रूप को बनाए रखता है और पादटिप्पणी उसका प्रतिनिधिक विस्तार स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली अपनाई गई है। ‘यहूदा का घराना,’ ‘बुरा मार्ग,’ ‘अधर्म’ और ‘पाप’ जैसे प्रमुख भविष्यद्वक्ताई और वाचागत पदों को संरक्षित रखा गया है; वाक्य-विन्यास को सामान्य पाठक के लिए स्वाभाविक बनाया गया है।
