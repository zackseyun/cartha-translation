  text: וְ/לֹ֣א פָחֲד֔וּ וְ/לֹ֥א קָרְע֖וּ אֶת בִּגְדֵי/הֶ֑ם הַ/מֶּ֨לֶךְ֙ וְ/כָל עֲבָדָ֔י/ו הַ/שֹּׁ֣מְעִ֔ים אֵ֥ת כָּל הַ/דְּבָרִ֖ים הָ/אֵֽלֶּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/024.yaml
  text: Yet neither the king nor any of his servants who heard all these words were afraid[b][a], nor did they tear their garments.
translation:
  language: hi
  text: फिर भी राजा और उसके सभी सेवक, जिन्होंने ये सब वचन सुने थे, न तो डरे और न ही अपने वस्त्र फाड़े।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: प्राचीन निकट पूर्व में अपने वस्त्र फाड़ना शोक, भयावहता से स्तब्ध होने या पश्चाताप का प्रचलित संकेत था।
    reason: cultural_note
  - marker: b
    text: या, “अपने कपड़े फाड़े।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא ... וְלֹא
  choice: न तो ... और न ही
  rationale: दोनों निषेधों को स्वाभाविक हिन्दी समांतर रचना में व्यक्त करता है; आरम्भ का ‘फिर भी’ प्रसंग में निहित विरोधात्मक बल को स्पष्ट करता है।
- source_word: פָחֲדוּ
  choice: डरे
  rationale: यह פחד के भय या आशंका के सामान्य अर्थ को सहज आधुनिक हिन्दी में रखता है, बिना भय की तीव्रता बढ़ाए।
- source_word: קָרְעוּ אֶת־בִּגְדֵיהֶם
  choice: अपने वस्त्र फाड़े
  rationale: मूल क्रिया और सांस्कृतिक संकेत दोनों को सुरक्षित रखता है। ‘वस्त्र’ गरिमापूर्ण और समझने योग्य है; ‘कपड़े’ अधिक बोलचाल का विकल्प है।
- source_word: הַמֶּלֶךְ
  choice: राजा
  rationale: निश्चित संज्ञा का सीधा और स्वाभाविक अनुवाद।
- source_word: וְכָל־עֲבָדָיו
  choice: और उसके सभी सेवक
  rationale: כָל के समष्टिगत अर्थ को बनाए रखता है। राजदरबार के प्रसंग में ‘सेवक’ उपयुक्त है और अनावश्यक रूप से दासत्व का अर्थ प्रमुख नहीं करता।
- source_word: הַשֹּׁמְעִים
  choice: जिन्होंने ... सुने थे
  rationale: कर्तृवाचक कृदन्त को हिन्दी में सम्बन्धवाचक उपवाक्य के रूप में स्वाभाविक ढंग से प्रस्तुत करता है और पूर्व घटित श्रवण को स्पष्ट करता है।
- source_word: אֵת כָּל־הַדְּבָרִים הָאֵלֶּה
  choice: ये सब वचन
  rationale: लिखित पुस्तक के पढ़े जाने के प्रसंग में דְּבָרִים का ‘वचन’ अनुवाद पाठ के शब्दात्मक स्वरूप को बनाए रखता है; ‘बातें’ भी सम्भव है।
