base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/031.yaml
  text: And I will punish him and his offspring and his servants for their iniquity[a], and I will bring on them, on the inhabitants of Jerusalem, and on the men of Judah all the disaster that I spoke against them, but they did not listen.
translation:
  language: hi
  text: और मैं उसे, उसके वंशजों और उसके सेवकों को उनके अधर्म के कारण दण्ड दूँगा; और मैं उन पर, यरूशलेम के निवासियों पर और यहूदा के प्रत्येक पुरुष[a] पर वह सारी विपत्ति लाऊँगा जिसके विषय में मैंने उनसे कहा था, पर उन्होंने नहीं सुना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप में, “यहूदा के प्रत्येक पुरुष।” यह अभिव्यक्ति एकवचन और पुल्लिंग रूप में वितरणात्मक है; इसका अनुवाद “यहूदा के लोग” या “यहूदा में हर व्यक्ति” भी किया जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָקַדְתִּי עָלָיו
  choice: मैं उसे ... दण्ड दूँगा
  rationale: न्याय के इस प्रसंग में פקד על दण्डात्मक लेखा लेने को व्यक्त करता है; आधुनिक हिन्दी में ‘दण्ड दूँगा’ इसका स्पष्ट और स्वाभाविक अर्थ है।
- source_word: זַרְעוֹ
  choice: उसके वंशजों
  rationale: यहाँ זֶרַע जैविक बीज नहीं, भावी वंश या संतति का सामूहिक बोध देता है; ‘वंशजों’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: עֲבָדָיו
  choice: उसके सेवकों
  rationale: राजकीय प्रसंग में עֶבֶד राजा के अधीन सेवकों या अधिकारियों को सूचित कर सकता है; बंधुआ स्थिति को अनावश्यक रूप से निश्चित किए बिना ‘सेवकों’ उपयुक्त है।
- source_word: אֶת עֲוֺנָם
  choice: उनके अधर्म का
  rationale: עָוֹן यहाँ उस दोषपूर्ण पाप को दर्शाता है जिसके कारण दण्ड दिया जाएगा; ‘अधर्म’ नैतिक भार बनाए रखता है।
- source_word: וְהֵבֵאתִי עֲלֵיהֶם
  choice: मैं उन पर ... लाऊँगा
  rationale: הביא על किसी पर न्याय या विपत्ति लाने का प्रचलित प्रयोग है; हिन्दी में यही संरचना स्वाभाविक है।
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: यरूशलेम के निवासियों
  rationale: सहभागी रूप का अर्थ नगर में रहने वाले लोग है; ‘निवासी’ संक्षिप्त और सहज है।
- source_word: וְאֶל אִישׁ יְהוּדָה
  choice: और यहूदा के प्रत्येक पुरुष पर
  rationale: אִישׁ व्याकरणतः पुल्लिंग एकवचन है और यहाँ वितरणात्मक बल रखता है; ‘प्रत्येक पुरुष’ इस रूप को सुरक्षित रखता है, जबकि पूर्ववर्ती עַל के समान लक्ष्यसूचक अर्थ में ‘पर’ प्रयुक्त हुआ है।
- source_word: כָּל הָרָעָה
  choice: वह सारी विपत्ति
  rationale: न्यायसूचक भविष्यवाणी में רָעָה नैतिक बुराई के बजाय आने वाली विपत्ति को दर्शाता है।
- source_word: אֲשֶׁר דִּבַּרְתִּי אֲלֵיהֶם
  choice: जिसके विषय में मैंने उनसे कहा था
  rationale: मूल में אֶל का सामान्य अर्थ ‘से/को’ है। हिन्दी वाक्य में ‘जिसके विषय में ... कहा’ चेतावनी की विषयवस्तु व्यक्त करता है, पर ‘उनके विरुद्ध’ जोड़कर अर्थ को अनावश्यक रूप से अधिक निश्चित नहीं करता।
- source_word: וְלֹא שָׁמֵעוּ
  choice: पर उन्होंने नहीं सुना
  rationale: שמע में सुनने और मानने दोनों की अर्थ-छाया संभव है। ‘नहीं सुना’ मूल अभिव्यक्ति और उसकी आज्ञापालन-संबंधी अंतर्निहित अस्पष्टता बनाए रखता है; ‘पर’ प्रसंगगत विरोध दर्शाता है।
theological_decisions:
- issue: अधर्म का दण्ड व्यक्ति, उसके वंशजों और सेवकों तक पहुँचना
  choice: स्रोत की सामूहिक न्याय-भाषा को ज्यों का त्यों रखना
  alternative: इसे केवल उनके अपने-अपने व्यक्तिगत अपराधों के दण्ड के रूप में स्पष्ट करना
  rationale: पद स्वयं ‘उनके अधर्म’ कहता है और राजा, वंशजों तथा सेवकों को एक साथ न्याय का लक्ष्य बनाता है। अनुवाद यह निर्धारित नहीं करता कि प्रत्येक का व्यक्तिगत दोष किस प्रकार समझा जाए।
- issue: אִישׁ יְהוּדָה का वितरणात्मक और पुल्लिंग रूप
  choice: यहूदा के प्रत्येक पुरुष
  alternative: यहूदा के लोग / यहूदा में हर व्यक्ति
  rationale: ‘प्रत्येक पुरुष’ हिब्रू के एकवचन वितरणात्मक और व्याकरणिक पुल्लिंग रूप को सुरक्षित रखता है; अधिक व्यापक सामूहिक अनुवाद संभव है, इसलिए उसे पादटिप्पणी में बताया गया है।
- issue: שמע में सुनना अथवा मानना
  choice: नहीं सुना
  alternative: नहीं माना / आज्ञा नहीं मानी
  rationale: शाब्दिक श्रवण और चेतावनी को मानने की अर्थ-छायाएँ दोनों उपस्थित रह सकती हैं; ‘नहीं सुना’ इस तनाव को समय से पहले नहीं सुलझाता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमामय और सामान्य पाठक के लिए सुबोध रखी गई है। ‘दण्ड’, ‘अधर्म’ और ‘विपत्ति’ भविष्यवाणी के न्यायपूर्ण स्वर को बनाए रखते हैं। पादटिप्पणी-सूचक [a] संबंधित पदांश के बाद रखा गया है।
