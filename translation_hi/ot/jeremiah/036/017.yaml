  yaml_path: translation/ot/jeremiah/036/017.yaml
  text: And they asked Baruch[a], saying, “Please tell us, how did you write all these words from his mouth?”
translation:
  language: hi
  text: तब उन्होंने बारूक से पूछा, “कृपया हमें बताओ, तुमने ये सारे शब्द उसके मुँह से कैसे लिखे?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक, “उसके मुँह से”; अर्थात यिर्मयाह के मौखिक कथन के आधार पर।
    reason: हिब्रू पदबंध מִפִּיו को मुख्य पाठ में शाब्दिक रखा गया है; पादटिप्पणी उसके प्रसंगगत, मौखिक-श्रुतलेख संबंधी अर्थ को स्पष्ट करती है।
lexical_decisions:
- source_word: שָׁאֲלוּ
  choice: पूछा
  rationale: यह सामान्य पूछताछ का स्वाभाविक आधुनिक हिन्दी रूप है और प्रत्यक्ष प्रश्न के संदर्भ में उपयुक्त है।
- source_word: לֵאמֹר
  choice: प्रत्यक्ष प्रश्न द्वारा व्यक्त
  rationale: हिब्रू का मानक वचन-परिचायक हिन्दी में अलग से ‘यह कहते हुए’ रखने पर कृत्रिम लगता; उद्धरण स्वयं उसके अर्थ को स्पष्ट करता है।
- source_word: הַגֶּד נָא לָנוּ
  choice: कृपया हमें बताओ
  rationale: आज्ञार्थक क्रिया और נָא की विनम्र अनुरोधात्मक छाया दोनों को सहज हिन्दी में रखता है।
- source_word: אֵיךְ כָּתַבְתָּ
  choice: तुमने ... कैसे लिखीं
  rationale: पूर्ण हो चुके लेखन-कार्य के ढंग के विषय में सीधे प्रश्न को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כָּל הַדְּבָרִים הָאֵלֶּה
  choice: ये सारी बातें
  rationale: דברים में ‘शब्द/बातें’ दोनों अर्थ संभव हैं; यहाँ भविष्यद्वाणी की कही और लिखी गई सामग्री के लिए ‘बातें’ अधिक सहज है, जबकि वचनात्मक आशय बना रहता है।
- source_word: מִפִּיו
  choice: उसके मुँह से सुनकर
  rationale: शाब्दिक ‘उसके मुँह से’ को सुरक्षित रखते हुए ‘सुनकर’ हिन्दी में यह स्पष्ट करता है कि बारूक ने मौखिक कथन के आधार पर लिखा था; ‘लिखवाने’ जैसी अधिक व्याख्यात्मक शब्दावली से बचा गया है।
- source_word: וְאֶת בָּרוּךְ
  choice: तब उन्होंने बारूक से पूछा
  rationale: अग्रस्थ कर्म बारूक को पूछे जाने वाले व्यक्ति के रूप में चिह्नित करता है; ‘तब’ कथा के क्रम को स्वाभाविक हिन्दी में जोड़ता है।
