  text: וְ/עַל יְהוֹיָקִ֤ים מֶֽלֶךְ יְהוּדָה֙ תֹּאמַ֔ר כֹּ֖ה אָמַ֣ר יְהוָ֑ה אַ֠תָּה שָׂרַ֜פְתָּ אֶת הַ/מְּגִלָּ֤ה הַ/זֹּאת֙ לֵ/אמֹ֔ר מַדּוּעַ֩ כָּתַ֨בְתָּ עָלֶ֜י/הָ לֵ/אמֹ֗ר בֹּֽא יָב֤וֹא מֶֽלֶךְ בָּבֶל֙ וְ/הִשְׁחִית֙ אֶת הָ/אָ֣רֶץ הַ/זֹּ֔את וְ/הִשְׁבִּ֥ית מִמֶּ֖/נָּה אָדָ֥ם וּ/בְהֵמָֽה־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/029.yaml
  text: 'And concerning Jehoiakim king of Judah[a], you shall say, ‘Thus says Yahweh: You have burned this scroll, saying, “Why have you written on it, saying, ‘The king of Babylon will surely come and destroy this land, and cut off from it man and beast’?”’'
translation:
  language: hi
  text: 'और यहूदा के राजा यहोयाकीम के विषय में कहना, ‘याहवे यों कहता है: तुमने इस पुस्तक को जला दिया और कहा, “तुमने इसमें यह क्यों लिखा है: ‘बाबेल का राजा निश्चय ही आएगा, इस देश को नष्ट कर देगा, और इसमें से मनुष्य और पशु को मिटा देगा[a]’?”’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “लोगों और पशुओं को मिटा देगा।” इब्रानी में “मनुष्य और पशु” पूर्ण विनाश और उजाड़ को व्यक्त करने वाली एक प्रचलित अभिव्यक्ति है। “पुस्तक” एक लिपटी हुई लिखित पुस्तक (स्क्रॉल) को सूचित करती है।
    reason: אָדָם वּבְהֵמָה के सामूहिक, सूत्रात्मक आशय को स्पष्ट करना और מְגִלָּה के ऐतिहासिक रूप को बिना अस्वाभाविक मुख्य-पाठ पद के बताना।
lexical_decisions:
- source_word: וְעַל
  choice: और ... के विषय में
  rationale: यहाँ עַל वाणी के विषय या संबोधित व्यक्ति का परिचय देता है; संदर्भ न्याय का है, फिर भी मूल अर्थ को अनावश्यक रूप से ‘विरुद्ध’ बनाना उचित नहीं।
- source_word: תֹּאמַר
  choice: तुम कहना
  rationale: द्वितीय पुरुष एकवचन अपूर्ण क्रिया यहाँ यिर्मयाह को दिया गया निर्देश है; यह रूप हिन्दी में निर्देशात्मक बल को सहजता से रखता है।
- source_word: כֹּה אָמַר יְהוָה
  choice: याहवे यह कहता है
  rationale: भविष्यद्वक्ता का मानक संदेशवाहक सूत्र है; आधुनिक हिन्दी में स्वाभाविक रहते हुए दिव्य नाम को स्पष्ट रखता है।
- source_word: שָׂרַפְתָּ
  choice: तुमने ... जला दिया
  rationale: पूर्ण क्रिया यहोयाकीम के पूरे हो चुके कार्य का आरोप करती है।
- source_word: הַמְּגִלָּה הַזֹּאת
  choice: इस पुस्तक-लपेटे को
  rationale: מְגִלָּה लिखित, लपेटी जाने वाली सामग्री है। ‘पुस्तक-लपेटा’ ऐतिहासिक वस्तु को सामान्य पाठक के लिए ‘पत्र’ या आधुनिक पुस्तक समझे जाने से बचाता है।
- source_word: כָּתַבְתָּ עָלֶיהָ
  choice: तुमने इसमें ... लिखा
  rationale: हिन्दी में किसी लिखित दस्तावेज़ की सामग्री के लिए ‘इसमें लिखा’ अधिक स्वाभाविक है, जबकि עַל का आशय सुरक्षित रहता है।
- source_word: בֹּא יָבוֹא
  choice: निश्चय ही आएगा
  rationale: क्रिया के infinitive absolute और imperfect का मेल आगमन की निश्चितता पर जोर देता है।
- source_word: וְהִשְׁחִית
  choice: नष्ट कर देगा
  rationale: हिफ़ील रूप देश पर गंभीर विनाशकारी कार्रवाई बताता है।
- source_word: וְהִשְׁבִּית מִמֶּנָּה
  choice: इसमें से ... का अंत कर देगा
  rationale: שׁבת का हिफ़ील यहाँ मनुष्य और पशु को देश में रहने या बने रहने से समाप्त कर देने का अर्थ देता है; ‘अंत कर देगा’ व्यापक परिणाम को स्पष्ट करता है।
- source_word: אָדָם וּבְהֵמָה
  choice: मनुष्य और पशु दोनों
  rationale: मूल की युग्मात्मक, सर्वसमावेशी विनाश-सूचक अभिव्यक्ति को बनाए रखते हुए ‘दोनों’ हिन्दी में उसकी व्यापकता स्पष्ट करता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल में चतुरक्षरीय निजी नाम प्रत्यक्ष है; ‘याहवे’ उसे उपाधि में बदले बिना सुरक्षित रखता है।
- issue: אָדָם וּבְהֵמָה की विनाश-सूचक अभिव्यक्ति
  choice: मनुष्य और पशु दोनों
  alternative: लोगों और जानवरों / मानवजाति और पशुओं
  rationale: शाब्दिक युग्म और भविष्यद्वक्ताई लय को रखा गया है; पादटिप्पणी स्पष्ट करती है कि इसका आशय पूर्ण उजाड़ है, केवल किसी एक पुरुष से नहीं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में गरिमापूर्ण और प्रत्यक्ष रखी गई है। उद्धरणों के भीतर उद्धरण मूल वाक्य-संरचना के अनुसार सुरक्षित हैं। ‘पुस्तक-लपेटा’ ऐतिहासिक מְגִלָּה को दर्शाता है; ‘निश्चय ही’ मूल के जोर को व्यक्त करता है।
