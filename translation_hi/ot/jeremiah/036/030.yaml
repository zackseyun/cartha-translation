source:
  edition: WLC
  text: לָ/כֵ֞ן כֹּֽה אָמַ֣ר יְהוָ֗ה עַל יְהֽוֹיָקִים֙ מֶ֣לֶךְ יְהוּדָ֔ה לֹא יִֽהְיֶה לּ֥/וֹ יוֹשֵׁ֖ב עַל כִּסֵּ֣א דָוִ֑ד וְ/נִבְלָת/וֹ֙ תִּֽהְיֶ֣ה מֻשְׁלֶ֔כֶת לַ/חֹ֥רֶב בַּ/יּ֖וֹם וְ/לַ/קֶּ֥רַח בַּ/לָּֽיְלָה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/030.yaml
  text: 'Therefore this is what Yahweh says concerning Jehoiakim king of Judah: He will have no one to sit on the throne of David[a], and his dead body will be thrown out to the heat by day and to the frost by night.'
translation:
  language: hi
  text: 'इसलिए यहोवा यहूदा के राजा यहोयाकीम के विषय में यह कहता है: दाऊद के सिंहासन पर बैठनेवाला उसका कोई न होगा, और उसका शव दिन की गरमी और रात के पाले में बाहर फेंक दिया जाएगा।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“गरमी” के लिए प्रयुक्त इब्रानी शब्द का अर्थ “सूखापन” या “सूखा” भी हो सकता है। इसलिए इसका अनुवाद यह भी हो सकता है: “उसका शव दिन के सूखे और रात के पाले में बाहर फेंक दिया जाएगा।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: पूर्ववर्ती प्रसंग से निकलने वाले न्याय के परिणाम को स्वाभाविक और स्पष्ट हिंदी में व्यक्त करता है।
- source_word: כֹּה אָמַר יְהוָה
  choice: यहोवा ... यह कहता है
  rationale: भविष्यद्वक्ताओं के संदेश-सूत्र की औपचारिकता रखते हुए आधुनिक हिंदी वाक्य-विन्यास अपनाया गया है।
- source_word: עַל יְהוֹיָקִים מֶלֶךְ יְהוּדָה
  choice: यहूदा के राजा यहोयाकीम के विषय में
  rationale: עַל को यहाँ न्याय-वचन के विषय का परिचायक माना गया है; 'के विरुद्ध' संभव है, पर मूल संबंध को आवश्यकता से अधिक सीमित कर देता।
- source_word: לֹא יִהְיֶה לּוֹ יוֹשֵׁב עַל כִּסֵּא דָוִד
  choice: दाऊद के सिंहासन पर बैठनेवाला उसका कोई न होगा
  rationale: मूल इब्रानी की 'उसका कोई बैठनेवाला न होगा' संरचना और वंशगत संकेत को सुरक्षित रखता है, बिना स्पष्ट रूप से 'वंशज' जोड़ने के।
- source_word: נִבְלָתוֹ
  choice: उसका शव
  rationale: मृत देह और उससे जुड़े अपमान को संक्षिप्त, स्पष्ट और गरिमापूर्ण आधुनिक हिंदी में व्यक्त करता है।
- source_word: מֻשְׁלֶכֶת
  choice: बाहर फेंका पड़ा रहेगा
  rationale: निष्क्रिय रूप, तिरस्कारपूर्वक फेंके जाने और निरंतर खुले पड़े रहने—दोनों भावों को प्रसंगानुकूल रूप से व्यक्त करता है।
- source_word: לַחֹרֶב בַּיּוֹם
  choice: दिन में गरमी के सामने
  rationale: חֹרֶב के प्रमुख संदर्भगत अर्थ 'गरमी' को चुना गया है; खुले पड़े शव पर दिन की गरमी का प्रभाव रात्रि के पाले के समानांतर है।
- source_word: לַקֶּרַח בַּלָּיְלָה
  choice: रात में पाले के सामने
  rationale: קֶרַח का ठोस अर्थ 'पाला' दिन-रात के पर्यावरणीय विरोध और मूल बिंब को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: इब्रानी व्यक्तिवाचक वाचा-नाम को उपाधि से नहीं बदला गया; हिंदी में व्यापक रूप से पहचाना जाने वाला पारंपरिक लिप्यंतरण 'यहोवा' अपनाया गया है।
- issue: राजवंशीय न्याय-वचन में לּוֹ का आशय
  choice: उसका कोई
  alternative: उसका कोई वंशज
  rationale: संदर्भ वंशगत उत्तराधिकारी का संकेत देता है, किंतु मूल पद में 'वंशज' स्पष्ट रूप से नहीं है; इसलिए अर्थगत तनाव को खुला रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी, सहज किंतु गरिमापूर्ण भविष्यद्वाणी-वचन शैली। 'शव' और 'बाहर फेंका पड़ा रहेगा' न्याय की कठोरता और मृत देह के अपमान को स्पष्ट रखते हैं; वाक्य में अनावश्यक संस्कृतनिष्ठता से बचा गया है।
