base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/016.yaml
  text: And when they heard all the words[a], each man turned in fear to his companion, and they said to Baruch, “We must surely tell the king all these words.”
translation:
  language: hi
  text: जब उन्होंने वे सारी बातें सुनीं, तो वे डरकर एक-दूसरे की ओर देखने लगे[a] और बारूक से बोले, “हम राजा को ये सारी बातें अवश्य बताएँगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे डर गए और एक-दूसरे की ओर देखने लगे।” इब्रानी मुहावरे का शाब्दिक रूप है, “वे डरे, हर एक अपने साथी की ओर,” जो उनकी परस्पर भयभीत प्रतिक्रिया व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּשָׁמְעָם
  choice: जब उन्होंने ... सुनीं
  rationale: यह कथात्मक प्रयोग समय-संबंध व्यक्त करता है। हिन्दी में ‘जब उन्होंने’ स्वाभाविक रूप से वही अर्थ देता है; ‘और ऐसा हुआ’ जोड़ना अनावश्यक रूप से शाब्दिक होता।
- source_word: אֶת כָּל הַדְּבָרִים
  choice: वे सारी बातें
  rationale: संदर्भ में ये लिखे हुए सन्देश के वचन हैं। आधुनिक हिन्दी में ‘सारी बातें’ स्वाभाविक है और बाद के स्पष्ट संकेतवाचक ‘ये’ से भेद भी बनाए रखता है।
- source_word: פָּחֲדוּ אִישׁ אֶל רֵעֵהוּ
  choice: वे डरकर एक-दूसरे की ओर देखने लगे
  rationale: इब्रानी वाक्यांश सामूहिक भय और परस्पर उन्मुख प्रतिक्रिया व्यक्त करता है। हिन्दी में यह अनुवाद उस दृश्य प्रतिक्रिया को स्वाभाविक ढंग से प्रकट करता है, जबकि पादटिप्पणी मूल मुहावरे की शाब्दिक असामान्यता बताती है।
- source_word: וַיֹּאמְרוּ אֶל בָּרוּךְ
  choice: और बारूक से बोले
  rationale: यह कथानक की सीधी अगली क्रिया है; ‘बोले’ बहुवचन कर्ता के साथ स्वाभाविक हिन्दी है।
- source_word: הַגֵּיד נַגִּיד
  choice: हम ... अवश्य बताएँगे
  rationale: धातु के निरपेक्ष क्रियारूप और अपूर्ण रूप का संयोग कथन में दृढ़ता और जोर देता है। ‘अवश्य बताएँगे’ प्रथम पुरुष बहुवचन और निश्चित संकल्प दोनों को सुरक्षित रखता है।
- source_word: לַמֶּלֶךְ
  choice: राजा को
  rationale: संदर्भ में यह उस समय के निश्चित शासक का उल्लेख है; हिन्दी में उपपद के बिना ‘राजा को’ स्वाभाविक और निश्चित है।
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: ये सारी बातें
  rationale: संकेतवाचक הָאֵלֶּה को ‘ये’ से और संदर्भानुकूल דְּבָרִים को ‘बातें’ से व्यक्त किया गया है; इससे मूल की पुनरावृत्ति भी बनी रहती है।
