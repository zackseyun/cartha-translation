base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/021.yaml
  text: Then the king sent Jehudi to get the scroll[a], and he took it from the chamber of Elishama the scribe[d][c][b]. And Jehudi read it in the hearing of the king and in the hearing of all the officials standing beside the king.
translation:
  language: hi
  text: तब राजा ने यहूदी को वह लेखपत्र[a] लाने के लिए भेजा। वह उसे एलीशामा मुंशी के कक्ष से ले आया। फिर यहूदी ने उसे राजा और राजा के पास खड़े सभी अधिकारियों को पढ़कर सुनाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह लेखपत्र लेने के लिए।” ‘लेखपत्र’ यहाँ लपेटे हुए लिखित पत्र (स्क्रॉल) को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: भेजा
  rationale: कथात्मक क्रम में שׁלח का स्वाभाविक और सटीक हिन्दी रूप।
- source_word: יְהוּדִי
  choice: यहूदी
  rationale: यहाँ यह एक व्यक्ति का नाम है; हिन्दी बाइबलीय परंपरा के अनुरूप लिप्यंतरण किया गया है।
- source_word: לָקַחַת
  choice: लाने के लिए
  rationale: राजा द्वारा भेजे जाने के उद्देश्य को स्वाभाविक हिन्दी में व्यक्त करता है; प्रसंग में वस्तु को राजा के पास लाना अभिप्रेत है, जबकि मूल क्रिया का अधिक शाब्दिक अर्थ ‘लेना’ भी हो सकता है।
- source_word: הַמְּגִלָּה
  choice: पुस्तक-लपेटा
  rationale: מְגִלָּה लिखित सामग्री के लपेटे हुए रूप को दर्शाता है; यह शब्द आधुनिक पाठक को वस्तु का स्वरूप बताता है और केवल सामान्य ‘पुस्तक’ कहने से बचता है।
- source_word: וַיִּקָּחֶהָ
  choice: वह उसे ... ले आया
  rationale: स्त्रीलिंग प्रत्यय का संदर्भ पुस्तक-लपेटे से है; ‘ले आया’ राजा की ओर लाने की प्रसंगगत दिशा को स्वाभाविक हिन्दी में प्रकट करता है।
- source_word: מִלִּשְׁכַּת
  choice: के कक्ष से
  rationale: לִשְׁכָּה किसी भवन में औपचारिक कमरे या कक्ष को दर्शाता है; राजकीय परिवेश में ‘कक्ष’ उपयुक्त है।
- source_word: אֱלִישָׁמָע
  choice: एलीशामा
  rationale: व्यक्तिनाम का देवनागरी लिप्यंतरण।
- source_word: הַסֹּפֵר
  choice: मुंशी
  rationale: סֹפֵר लेखक अथवा राजकीय सचिव जैसे अधिकारी को सूचित कर सकता है; ‘मुंशी’ लेखन और प्रशासन, दोनों का भाव सहज हिन्दी में रखता है।
- source_word: וַיִּקְרָאֶהָ
  choice: उसे ... पढ़कर सुनाया
  rationale: लिखित वस्तु के साथ קרא का अर्थ पढ़ना है; श्रोताओं की स्पष्ट उपस्थिति के कारण हिन्दी में श्रव्य पाठ को स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: בְּאָזְנֵי
  choice: को ... पढ़कर सुनाया
  rationale: शाब्दिक ‘कानों में’ एक हिब्रू मुहावरा है जिसका अर्थ किसी की सुनवाई में पढ़ना है; हिन्दी वाक्य-विन्यास में ‘को पढ़कर सुनाया’ वही श्रव्य बल रखता है।
- source_word: הַשָּׂרִים
  choice: अधिकारियों
  rationale: राजदरबार के संदर्भ में שָׂרִים उच्च पदस्थ अधिकारियों को दर्शाता है; ‘राजकुमारों’ से अनावश्यक वंशगत अर्थ आ सकता है।
- source_word: הָעֹמְדִים מֵעַל הַמֶּלֶךְ
  choice: राजा के पास खड़े
  rationale: शाब्दिक स्थानिक अभिव्यक्ति ‘राजा के ऊपर/निकट खड़े’ दरबार में उसके पास उपस्थित लोगों के लिए प्रयुक्त है; ‘पास खड़े’ श्रेष्ठता का भ्रामक संकेत दिए बिना अर्थ व्यक्त करता है।
