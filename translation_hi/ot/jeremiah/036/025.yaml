  text: Yet even Elnathan[a], Delaiah, and Gemariah urged the king not to burn the scroll, but he did not listen to them.
translation:
  language: hi
  text: फिर भी एलनातान, दलायाह और गमर्याह ने राजा से बहुत आग्रह किया कि वह उस लपेटे हुए लेख[a] को न जलाए, लेकिन उसने उनकी बात नहीं सुनी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात, लिखित सामग्री का वह लंबा पत्र जिसे लपेटकर रखा जाता था।
    reason: ‘लपेटे हुए लेख’ के द्वारा अनूदित इब्रानी מְגִלָּה के प्राचीन स्क्रॉल-रूप को स्पष्ट करता है।
lexical_decisions:
- source_word: וְגַם
  choice: फिर भी
  rationale: संदर्भ में यह पूर्ववर्ती घटनाओं के बावजूद इन अधिकारियों के हस्तक्षेप को जोड़ता है; ‘फिर भी’ स्वाभाविक हिन्दी में हल्का विरोध दर्शाता है। तीनों नामों का स्पष्ट उल्लेख मूल के योगात्मक बल को बनाए रखता है।
- source_word: הִפְגִּיעוּ בַמֶּלֶךְ
  choice: राजा से बहुत आग्रह किया
  rationale: פגע के हिफ़ील रूप में यहाँ राजा से की गई earnest entreaty का भाव है। ‘बहुत आग्रह किया’ आधुनिक हिन्दी में तीव्र निवेदन को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לְבִלְתִּי שְׂרֹף
  choice: कि वह ... न जलाए
  rationale: यह रचना अनुरोध किए गए निषेध को व्यक्त करती है। हिन्दी में ‘कि वह ... न जलाए’ इस आशय का स्वाभाविक पूरक है।
- source_word: הַמְּגִלָּה
  choice: पुस्तक-लपेटा
  rationale: מְגִלָּה उस लिखित सामग्री को दर्शाता है जो लपेटकर रखी जाती थी। ‘पुस्तक-लपेटा’ सामान्य ‘पुस्तक’ की अपेक्षा वस्तु के प्राचीन स्वरूप को स्पष्ट करता है।
- source_word: וְלֹא שָׁמַע אֲלֵיהֶם
  choice: लेकिन उसने उनकी बात नहीं सुनी
  rationale: यहाँ וְ संदर्भतः विरोधसूचक है। ‘उनकी बात नहीं सुनी’ आधुनिक हिन्दी में न मानने या ध्यान न देने का स्वाभाविक अर्थ देता है।
