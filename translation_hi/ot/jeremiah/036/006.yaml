base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/006.yaml
  text: So you yourself must go and read from the scroll that you wrote from my mouth—the words of Yahweh—in the hearing of the people in the house of Yahweh on a day of fasting[b][a]; and you must also read them in the hearing of all Judah who come from their cities.
translation:
  language: hi
  text: इसलिए तुम स्वयं जाकर उस लिपि-पत्र से, जिसे तुमने मेरे मुँह से सुनकर लिखा है[a], यहोवा के वचन लोगों को यहोवा के भवन[b] में उपवास के दिन पढ़कर सुनाना। और यहूदा के वे सब लोग जो अपने-अपने नगरों से आएँ, उन्हें भी ये वचन पढ़कर सुनाना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिसे तुमने मेरे बोलने पर लिखा है”; शाब्दिक अर्थ, “जिसे तुमने मेरे मुँह से लिखा है।”
    reason: lexical_alternative
  - marker: b
    text: “यहोवा का भवन” यहाँ मन्दिर को दर्शाता है।
    reason: cultural_note
lexical_decisions:
- source_word: וּבָאתָ אַתָּה
  choice: इसलिए तुम स्वयं जाकर
  rationale: संदर्भ में वाव सहित पूर्ण क्रिया निर्देश को आगे बढ़ाती है और आज्ञार्थक बल रखती है। אַתָּה का बल ‘तुम स्वयं’ से सुरक्षित है; लक्ष्य की ओर गति के लिए हिन्दी में ‘जाकर’ स्वाभाविक है।
- source_word: וְקָרָאתָ בַמְּגִלָּה
  choice: उस पुस्तक से ... पढ़कर सुनाना
  rationale: लिखित वस्तु के साथ קרא का अर्थ ऊँचे स्वर में पढ़ना है। सार्वजनिक श्रवण-संदर्भ को स्पष्ट करने के लिए ‘पढ़कर सुनाना’ और ב के दस्तावेज-स्रोत भाव के लिए ‘से’ चुना गया है।
- source_word: מְגִלָּה
  choice: पुस्तक
  rationale: यह लपेटी हुई लिखित पुस्तक अर्थात पुस्तक-पट को दर्शाता है। सामान्य आधुनिक हिन्दी में ‘पुस्तक’ सहज है, जबकि संदर्भ उसके लिखित दस्तावेज होने को स्पष्ट रखता है।
- source_word: אֲשֶׁר כָּתַבְתָּ מִפִּי
  choice: जिसे तुमने मेरे मुँह से सुनकर लिखा है
  rationale: ‘मेरे मुँह से’ की स्रोत-भाषा की सजीव अभिव्यक्ति सुरक्षित रखी गई है; ‘सुनकर’ हिन्दी में आशय स्पष्ट करता है, बिना इसे केवल तकनीकी ‘श्रुतलेख’ तक सीमित किए।
- source_word: אֶת דִּבְרֵי יְהוָה
  choice: यहोवा के वचन
  rationale: דברים यहाँ लिखे और पढ़े जाने वाले संदेश/वचनों को दर्शाता है। यְהוָה को व्यक्तिगत ईश्वरीय नाम ‘यहोवा’ के रूप में लिप्यंतरित किया गया है।
- source_word: בְּאָזְנֵי הָעָם
  choice: लोगों को ... पढ़कर सुनाना
  rationale: शाब्दिक ‘लोगों के कानों में’ हिन्दी में अस्वाभाविक है; ‘लोगों को पढ़कर सुनाना’ श्रवण और सार्वजनिक मौखिक प्रस्तुति दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בֵּית יְהוָה
  choice: यहोवा का भवन
  rationale: ‘यहोवा का घर/भवन’ मूल रूपक को बनाए रखता है। गरिमापूर्ण हिन्दी में ‘भवन’ उपयुक्त है; पादटिप्पणी स्पष्ट करती है कि इसका संकेत मन्दिर से है।
- source_word: בְּיוֹם צוֹם
  choice: उपवास के दिन
  rationale: यह सार्वजनिक उपवास के अवसर को बताता है; किसी विशिष्ट नामित पर्व का अनावश्यक संकेत नहीं जोड़ा गया।
- source_word: בְּאָזְנֵי כָל יְהוּדָה הַבָּאִים מֵעָרֵיהֶם
  choice: यहूदा के सभी लोग जो अपने-अपने नगरों से आएँ, उन्हें भी
  rationale: ‘सारा यहूदा’ का सामूहिक आशय लोगों के रूप में स्पष्ट किया गया है। बहुवचन स्वामित्व को स्वाभाविक हिन्दी ‘अपने-अपने नगरों’ से व्यक्त किया गया है; participle को अपेक्षित आगमन के अनुरूप ‘आएँ’ कहा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ में चतुरक्षरी व्यक्तिगत नाम सीधे उपस्थित है। हिन्दी पाठकों में स्थापित नामरूप ‘यहोवा’ व्यक्तिगत नाम को बनाए रखता है और उसे केवल उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं करता।
- issue: מִפִּי में यिर्मयाह की वाणी और यहोवा के वचनों का सम्बन्ध
  choice: ‘मेरे मुँह से सुनकर’ तथा ‘यहोवा के वचन’ दोनों को साथ बनाए रखना
  alternative: ‘मेरे श्रुतलेख पर’
  rationale: पाठ यिर्मयाह के मुख से बोले जाने और उन शब्दों के यहोवा के होने—दोनों को साथ रखता है। अनुवाद इस धार्मिक तनाव को किसी यांत्रिक श्रुतलेख-सिद्धान्त में सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, सार्वजनिक पाठ के योग्य और गरिमापूर्ण शैली अपनाई गई है। ‘पढ़कर सुनाना’ श्रवण-सूचक इब्रानी मुहावरे को सहज हिन्दी में व्यक्त करता है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में मौजूद हैं।
