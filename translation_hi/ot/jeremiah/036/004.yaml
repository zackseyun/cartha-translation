  text: וַ/יִּקְרָ֣א יִרְמְיָ֔הוּ אֶת בָּר֖וּךְ בֶּן נֵֽרִיָּ֑ה וַ/יִּכְתֹּ֨ב בָּר֜וּךְ מִ/פִּ֣י יִרְמְיָ֗הוּ אֵ֣ת כָּל דִּבְרֵ֧י יְהוָ֛ה אֲשֶׁר דִּבֶּ֥ר אֵלָ֖י/ו עַל מְגִלַּת סֵֽפֶר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/004.yaml
  text: So Jeremiah called Baruch son of Neriah[a], and Baruch wrote on a scroll all the words of Yahweh from Jeremiah’s mouth[b], which he had spoken to him.
translation:
  language: hi
  text: तब यिर्मयाह ने नेरिय्याह के पुत्र बारूक को बुलाया, और बारूक ने यिर्मयाह से सुनकर[a] याहवे के वे सब वचन, जो उसने यिर्मयाह से कहे थे, एक पुस्तक की पट्टी[b] पर लिखे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “यिर्मयाह के मुँह से”; अर्थात यिर्मयाह के बोलने के अनुसार।
    reason: lexical_alternative
  - marker: b
    text: या, अधिक शाब्दिक रूप से, “एक पुस्तक की लपेटी हुई पट्टी पर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: बुलाया
  rationale: इस प्रसंग में קרא का अर्थ किसी को अपने पास बुलाना है। ‘बुलाया’ सहज और पर्याप्त रूप से गरिमापूर्ण है; ‘तलब किया’ अनावश्यक रूप से अधिक कठोर होता।
- source_word: בָּרוּךְ בֶּן־נֵרִיָּה
  choice: नेरिय्याह के पुत्र बारूक
  rationale: हिब्रू नामों का प्रचलित देवनागरी लिप्यंतरण किया गया है और वंश-संबंध को स्वाभाविक हिन्दी क्रम में रखा गया है।
- source_word: וַיִּכְתֹּב
  choice: लिख दिए
  rationale: כתב का मूल अर्थ ‘लिखना’ है। हिन्दी में पूरे संदेश को लिखित रूप देने की पूर्ण क्रिया के लिए ‘लिख दिए’ स्वाभाविक है।
- source_word: מִפִּי יִרְמְיָהוּ
  choice: यिर्मयाह से सुनकर
  rationale: शाब्दिक अर्थ ‘यिर्मयाह के मुँह से’ है और प्रसंग में आशय उसके बोलने के अनुसार लिखना है। मुख्य पाठ में सहज हिन्दी रखी गई है तथा मूल बिंब को पादटिप्पणी में सुरक्षित किया गया है।
- source_word: כָּל־דִּבְרֵי יְהוָה
  choice: याहवे ने ... जो-जो वचन कहे थे, वे सब
  rationale: ‘जो-जो ... वे सब’ כל की समग्रता को स्वाभाविक हिन्दी में व्यक्त करता है, और ‘वचन’ prophetic utterances की ठोस भाषिक प्रकृति बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले परमेश्वर के व्यक्तिगत नाम का हिन्दी में सीधा लिप्यंतरण किया गया है; उसे किसी उपाधि से नहीं बदला गया।
- source_word: אֲשֶׁר דִּבֶּר אֵלָיו
  choice: याहवे ने यिर्मयाह से जो-जो वचन कहे थे
  rationale: निकटतम और प्रसंगानुकूल अर्थ यह है कि याहवे ने ये वचन यिर्मयाह से कहे थे। स्पष्ट संज्ञाओं से हिन्दी में अस्पष्ट सर्वनाम-श्रृंखला से बचा गया है, बिना ‘उसके द्वारा’ जैसा अतिरिक्त माध्यम-विचार जोड़े।
- source_word: עַל־מְגִלַּת־סֵפֶר
  choice: एक लपेटे पर
  rationale: यह पद लिखने योग्य पुस्तक-लपेटे को सूचित करता है। ‘लपेटा’ आधुनिक हिन्दी पाठक को भौतिक रूप समझाता है; अधिक शाब्दिक पूर्ण पद पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम है। ‘याहवे’ उसका निकट लिप्यंतरण है और नाम को उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं करता।
- issue: אֲשֶׁר דִּבֶּר אֵלָיו में वक्ता और संबोधित व्यक्ति
  choice: याहवे ने यिर्मयाह से जो वचन कहे थे
  alternative: जो उसने उससे कहे थे
  rationale: व्याकरण और प्रसंग में याहवे वक्ता तथा यिर्मयाह संबोधित व्यक्ति हैं। हिन्दी में नाम दोहराने से अर्थ स्पष्ट होता है, जबकि ‘यिर्मयाह के द्वारा’ कहना मूल के אֵלָיו को अनावश्यक रूप से माध्यमवाचक बना देता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्य को दो भागों में बाँटकर कथानक स्पष्ट किया गया है। ‘वचन’ भविष्यद्वाणी-संदेश की मौखिक प्रकृति को बनाए रखता है, और दोनों पादटिप्पणी-चिह्न संबंधित पदों के तुरंत बाद रखे गए हैं।
