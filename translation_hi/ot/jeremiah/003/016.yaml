source:
  edition: WLC
  text: וְ/הָיָ֡ה כִּ֣י תִרְבּוּ֩ וּ/פְרִיתֶ֨ם בָּ/אָ֜רֶץ בַּ/יָּמִ֤ים הָ/הֵ֨מָּה֙ נְאֻם יְהוָ֔ה לֹא יֹ֣אמְרוּ ע֗וֹד אֲרוֹן֙ בְּרִית יְהוָ֔ה וְ/לֹ֥א יַעֲלֶ֖ה עַל לֵ֑ב וְ/לֹ֤א יִזְכְּרוּ ב/וֹ֙ וְ/לֹ֣א יִפְקֹ֔דוּ וְ/לֹ֥א יֵעָשֶׂ֖ה עֽוֹד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/016.yaml
  text: And it shall be[a], when you have multiplied and been fruitful in the land in those days, declares Yahweh, they will no longer say, ‘The ark of the covenant of Yahweh.’ It will not come to mind, and they will not remember it or miss it[b], nor will it be made again.
translation:
  language: hi
  text: और उन दिनों, जब तुम इस देश में बहुत बढ़ोगे और फलवंत होगे—याहवे की यह घोषणा है—तब लोग फिर कभी नहीं कहेंगे, “याहवे की वाचा का संदूक।” वह मन में भी नहीं आएगा; वे न उसे स्मरण करेंगे, न उसकी सुध लेंगे[a], और न वह फिर बनाया जाएगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “न उस पर ध्यान देंगे,” “न उसे खोजेंगे,” अथवा “न उसकी कमी महसूस करेंगे।” इब्रानी क्रिया के कई परस्पर संबंधित अर्थ हो सकते हैं; यहाँ भाव संभवतः यह है कि लोग संदूक की आवश्यकता या उसके अभाव पर फिर ध्यान नहीं देंगे।
    reason: lexical_alternative
  - marker: b
    text: या, “और न कोई दूसरा बनाया जाएगा।” इब्रानी में क्रिया कर्मवाच्य है और उसका विषय स्पष्ट रूप से नहीं कहा गया; आशय संभवतः यह है कि उसके स्थान पर दूसरा संदूक नहीं बनाया जाएगा।
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: और ... जब ... तब
  rationale: यह पद भविष्य की परिस्थिति प्रस्तुत करता है। हिन्दी में ‘जब…तब’ उस समय-संबंध को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: תִרְבּוּ וּפְרִיתֶם
  choice: बहुत बढ़ जाओगे और फलवन्त होगे
  rationale: रבה जनसंख्या में बढ़ने और פרה फलवन्त होने को व्यक्त करता है। दोनों अलग क्रियाएँ रखी गई हैं ताकि मूल की प्रचलित युग्म-अभिव्यक्ति और उसकी वाचागत प्रतिध्वनि बनी रहे।
- source_word: בָּאָרֶץ
  choice: इस देश में
  rationale: संदर्भ में אָרֶץ समस्त पृथ्वी नहीं, बल्कि इस्राएल/यहूदा के देश की ओर संकेत करता है। हिन्दी में ‘इस देश’ प्रासंगिक अर्थ स्पष्ट करता है।
- source_word: נְאֻם יְהוָה
  choice: याहवे की यह घोषणा है
  rationale: यह भविष्यद्वाणी की गंभीर उद्घोषणा-सूत्र है; ‘घोषणा’ נְאֻם की औपचारिक शक्ति को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: याहवे की वाचा का संदूक
  rationale: निर्मित पद-शृंखला का सीधा और हिन्दी बाइबलीय शब्दावली में सुबोध रूप। इसे उद्धरण में रखा गया है क्योंकि मूल कहता है कि लोग यह पदबंध फिर नहीं कहेंगे।
- source_word: וְלֹא יַעֲלֶה עַל־לֵב
  choice: वह उनके मन में भी नहीं आएगा
  rationale: शाब्दिक मुहावरा ‘हृदय पर चढ़ना’ है, जिसका आशय मन में आना या ध्यान में आना है। हिन्दी मुहावरा अर्थ को स्वाभाविक ढंग से देता है।
- source_word: וְלֹא יִזְכְּרוּ בוֹ
  choice: वे न उसे स्मरण करेंगे
  rationale: सर्वनाम का निकटतम संदर्भ वाचा का संदूक है। ‘स्मरण करना’ זכר का सीधा, गरिमापूर्ण रूप है।
- source_word: וְלֹא יִפְקֹדוּ
  choice: न उसकी सुधि लेंगे
  rationale: פקד के यहाँ ध्यान देने, खोजने, हाल लेने अथवा अभाव अनुभव करने जैसे संबंधित अर्थ संभव हैं। ‘सुधि लेना’ जानबूझकर कुछ व्यापकता रखता है और संदूक की ओर फिर ध्यान न दिए जाने का भाव व्यक्त करता है।
- source_word: וְלֹא יֵעָשֶׂה עוֹד
  choice: और न वह फिर बनाया जाएगा
  rationale: मूल में क्रिया कर्मवाच्य है और कर्ता/विषय निहित है। निकट संदर्भ के आधार पर ‘वह’ संदूक को दर्शाता है, जबकि कर्मवाच्य रूप कायम रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में चार-अक्षरीय वाचा-नाम प्रत्यक्ष है। ‘याहवे’ उसे उपाधि में बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- issue: भविष्य में वाचा के संदूक की स्थिति
  choice: पद में कही गई बात को संदूक के उल्लेख, स्मरण, उसकी सुधि लेने और उसे फिर बनाने के निषेध तक सीमित रखा गया है।
  alternative: इसे केवल संदूक के खो जाने की भविष्यवाणी मानना; अथवा इससे पूरी पूर्ववर्ती वाचा का निरसन निकालना
  rationale: मूल ठोस रूप से संदूक से संबंधित क्रियाओं की शृंखला को नकारता है, पर व्यापक वाचागत सिद्धान्त को स्पष्ट नहीं करता। अनुवाद उस धार्मिक तनाव को बिना अतिरिक्त निष्कर्ष जोड़े बनाए रखता है।
- issue: וְלֹא יִפְקֹדוּ की अर्थगत अनिश्चितता
  choice: न उसकी सुधि लेंगे
  alternative: न उसकी कमी महसूस करेंगे; न उस पर ध्यान देंगे; न उसे खोजेंगे
  rationale: פקד बहुअर्थी है और इस प्रसंग में एक ही हिन्दी अर्थ निश्चित करना कठिन है। मुख्य पाठ में व्यापक हिन्दी अभिव्यक्ति और पादटिप्पणी में विकल्प देकर वास्तविक अस्पष्टता सुरक्षित रखी गई है।
