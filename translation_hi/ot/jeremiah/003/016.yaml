  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘फलवन्त,’ ‘वाचा’ और ‘संदूक’ जैसे स्थापित बाइबलीय शब्द प्रसंग की गंभीरता और मूल की प्रतिध्वनियों को बनाए रखते हैं। भविष्यद्वाणी-सूत्र को डैश के बीच रखकर वाक्य का प्रवाह स्पष्ट किया गया है।
