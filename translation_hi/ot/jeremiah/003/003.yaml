source:
  edition: WLC
  text: וַ/יִּמָּנְע֣וּ רְבִבִ֔ים וּ/מַלְק֖וֹשׁ ל֣וֹא הָיָ֑ה וּ/מֵ֨צַח אִשָּׁ֤ה זוֹנָה֙ הָ֣יָה לָ֔/ךְ מֵאַ֖נְתְּ הִכָּלֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/003.yaml
  text: Therefore the showers were withheld[a], and there was no spring rain; yet you had the forehead of a prostitute—you refused to be ashamed.
translation:
  language: hi
  text: इसलिए वर्षा की बौछारें रोक दी गईं, और वसंत की वर्षा[a] नहीं हुई; फिर भी तुम्हारा माथा वेश्या जैसा था—तुमने लज्जित होने से इनकार किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पछेती वर्षा।” इब्रानी शब्द कृषि-ऋतु के अंत में होने वाली देर की मौसमी वर्षा को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמָּנְעוּ
  choice: रोक दी गईं
  rationale: निफ़अल रूप यहाँ निष्क्रिय अर्थ देता है; यह न्याय के रूप में वर्षा के रोके जाने को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: רְבִבִים
  choice: वर्षा की झड़ियाँ
  rationale: शब्द वर्षा की बौछारों या झड़ियों को दर्शाता है; यह चयन सामान्य पाठक के लिए स्पष्ट है।
- source_word: מַלְקוֹשׁ
  choice: वसन्त की वर्षा
  rationale: यह कृषि-ऋतु के अंत में होने वाली देर की मौसमी वर्षा है; आधुनिक हिन्दी में ऋतु-संदर्भ स्पष्ट रखने के लिए यह अभिव्यक्ति चुनी गई है।
- source_word: מֵצַח
  choice: माथा
  rationale: मूल का ठोस शारीरिक बिंब बनाए रखता है और निर्लज्जता के रूपक को कमजोर नहीं करता।
- source_word: אִשָּׁה זוֹנָה
  choice: वेश्या
  rationale: यह मूल के यौन रूपक को सीधे, वर्तमान और गरिमापूर्ण हिन्दी में सुरक्षित रखता है।
- source_word: הָיָה לָךְ
  choice: तुम्हारा ... था
  rationale: हिब्रू का स्वामित्व-सूचक मुहावरा हिन्दी में स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: מֵאַנְתְּ
  choice: तुमने ... इनकार कर दिया
  rationale: क्रिया की दृढ़ अस्वीकृति को स्पष्ट और प्रभावी ढंग से व्यक्त करता है।
- source_word: הִכָּלֵם
  choice: लज्जित होने
  rationale: संदर्भ में इसका अर्थ लज्जा अनुभव करना है; यह आधुनिक हिन्दी में सीधा और सहज है।
theological_decisions:
- issue: वाचा के प्रति अविश्वास के लिए यौन अनैतिकता का रूपक
  choice: “तुम्हारा माथा वेश्या के माथे जैसा था” के रूप में स्पष्ट रूपक बनाए रखा गया।
  alternative: “तुम निर्लज्ज थीं” या “तुम ढीठ थीं।”
  rationale: यिर्मयाह का वेश्या-वाला बिंब यहूदा की मूर्तिपूजा और वाचा-भंग को व्यभिचार के रूप में प्रस्तुत करता है। सामान्यीकृत अनुवाद भविष्यद्वाणी की तीव्रता और धार्मिक संबंध को कमजोर कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सीधी, गंभीर और भविष्यद्वाणी की तीव्रता के अनुरूप है। स्त्रीलिंग संबोधन को जहाँ क्रियारूप से आवश्यक है वहाँ बनाए रखा गया है, क्योंकि संदर्भ में संबोधित सत्ता स्त्री के रूप में चित्रित है।
