language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: שְׂאִֽי עֵינַ֨יִ/ךְ עַל שְׁפָיִ֜ם וּ/רְאִ֗י אֵיפֹה֙ לֹ֣א שגלת עַל דְּרָכִים֙ יָשַׁ֣בְתְּ לָ/הֶ֔ם כַּ/עֲרָבִ֖י בַּ/מִּדְבָּ֑ר וַ/תַּחֲנִ֣יפִי אֶ֔רֶץ בִּ/זְנוּתַ֖יִ/ךְ וּ/בְ/רָעָתֵֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/002.yaml
  text: 'Lift up your eyes to the bare heights and see: where have you not been lain with? By the roads you sat waiting for them[a], like an Arab in the wilderness[b], and you have polluted the land with your prostitution and with your wickedness.'
translation:
  language: hi
  text: अपनी आँखें उठाकर उजाड़ पहाड़ियों की ओर देखो—ऐसी कौन-सी जगह है जहाँ तुम्हारे साथ किसी ने शयन नहीं किया? रास्तों के किनारे तुम उनकी बाट जोहती बैठी रहीं, जैसे मरुभूमि में कोई अरबी बैठा हो[a]। तुमने अपनी वेश्यावृत्ति और अपनी दुष्टता से देश को अशुद्ध कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“जैसे मरुभूमि में कोई अरबी बैठा हो”: यह उपमा संभवतः मरुभूमि के मार्गों के निकट घात लगाकर या प्रतीक्षा करते व्यक्ति का चित्र प्रस्तुत करती है, और जानबूझकर की गई सार्वजनिक खोज पर बल देती है; यह जातीयता पर टिप्पणी नहीं है।'
    reason: cultural_note
lexical_decisions:
- source_word: שְׂאִי עֵינַיִךְ
  choice: अपनी आँखें उठाकर
  rationale: हिब्रू मुहावरे में स्त्रीलिंग एकवचन आज्ञा के साथ आँखें उठाने, अर्थात ऊपर दृष्टि करने, का भाव है।
- source_word: עַל שְׁפָיִם
  choice: उजाड़ पहाड़ियों की ओर
  rationale: शब्द वृक्षहीन या नंगी ऊँचाइयों को सूचित करता है; यह स्थलाकृति और अनुचित उपासना से जुड़े संभावित संकेत दोनों को बनाए रखता है।
- source_word: שגלת
  choice: तुम्हारे साथ संभोग नहीं किया गया
  rationale: यह एक भद्दा और स्पष्ट यौन क्रिया-शब्द है। यह अनुवाद उसकी कठोरता को पर्याप्त रूप से बनाए रखता है, लेकिन मूल में निहित न होने वाले बलात्कार या जबरदस्ती के भाव को नहीं जोड़ता।
- source_word: עַל דְּרָכִים יָשַׁבְתְּ לָהֶם
  choice: रास्तों के किनारे तुम उनकी बाट जोहती बैठी रहीं
  rationale: शाब्दिक 'उनके लिए बैठी' का प्रसंगगत अर्थ प्रतीक्षा करना या स्वयं को उनके लिए प्रस्तुत करना है; 'बाट जोहती' स्वाभाविक हिन्दी में यह निहितार्थ व्यक्त करता है।
- source_word: כַּעֲרָבִי בַּמִּדְבָּר
  choice: जैसे मरुभूमि में कोई अरबी घात लगाए बैठा हो
  rationale: עֲרָבִי का सीधा अर्थ अरबी/अरब व्यक्ति है। उपमा में मरुभूमि के मार्ग पर प्रतीक्षारत घात लगाने वाले का भाव संदर्भ से स्पष्ट किया गया है।
- source_word: וַתַּחֲנִיפִי אֶרֶץ
  choice: तुमने ... देश को अशुद्ध कर दिया
  rationale: हिफ़ील रूप नैतिक या धार्मिक प्रदूषण/अपवित्रीकरण बताता है; 'अशुद्ध' भूमि के दूषित होने के भविष्यद्वाणी-संबंधी भाव को व्यक्त करता है।
- source_word: בִּזְנוּתַיִךְ
  choice: अपनी वेश्यावृत्ति से
  rationale: यह स्पष्ट यौन रूपक है जो वाचा के प्रति विश्वासघात को चित्रित करता है; आधुनिक हिन्दी में 'वेश्यावृत्ति' उसका तीखापन बनाए रखता है।
- source_word: וּבְרָעָתֵךְ
  choice: अपनी दुष्टता से
  rationale: व्यापक नैतिक बुराई के लिए स्वाभाविक और गरिमापूर्ण हिन्दी पद।
theological_decisions:
- issue: मूर्तिपूजा और वाचा-विच्छेद के लिए भविष्यद्वाणी का यौन रूपक
  choice: मुख्य पाठ में स्पष्ट यौन बिंब बनाए रखा गया है।
  alternative: यौन शब्दावली हटाकर सीधे 'मूर्तिपूजा' या 'अविश्वासयोग्यता' कहना।
  rationale: हिब्रू जानबूझकर चौंकाने वाला यौन रूपक इस्तेमाल करता है। उसे व्याख्यात्मक धार्मिक शब्द से बदलना मूल की वाग्मिता और तनाव को कम कर देता।
- issue: שגלת में कर्तृत्व और जबरदस्ती
  choice: निष्क्रिय अभिव्यक्ति 'तुम्हारे साथ संभोग नहीं किया गया' रखी गई है।
  alternative: '''तुम्हारा बलात्कार नहीं हुआ'' या सक्रिय रूप में ''तुमने व्यभिचार नहीं किया''।'
  rationale: मूल रूप निष्क्रिय है और यौन संबंध को स्पष्ट करता है, पर जबरदस्ती को अनिवार्य रूप से व्यक्त नहीं करता। इसलिए बलात्कार का भाव नहीं जोड़ा गया और सक्रिय कर्तृत्व भी आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; स्वर स्पष्ट, गंभीर और भविष्यद्वाणी की कठोरता के अनुरूप है। 'संभोग' मूल के स्पष्ट यौन अर्थ को बिना जबरदस्ती जोड़े व्यक्त करता है। स्त्रीलिंग संबोधन को 'जोहती बैठी रहीं' में बनाए रखा गया है। मुख्य पाठ में [a] चिह्न संबंधित उपमा के बाद उपस्थित है।
