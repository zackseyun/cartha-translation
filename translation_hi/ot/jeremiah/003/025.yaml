base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/025.yaml
  text: Let us lie down in our shame[a], and let our disgrace cover us, for we have sinned against Yahweh our God—we and our fathers—from our youth even to this day, and we have not obeyed the voice of Yahweh our God.
translation:
  language: hi
  text: हम अपनी लज्जा में लेट जाएँ, और हमारा अपमान हमें ढाँप ले; क्योंकि हम ने और हमारे पिताओं[a] ने अपनी जवानी से लेकर आज तक अपने परमेश्वर याहवे के विरुद्ध पाप किया है, और अपने परमेश्वर याहवे की वाणी नहीं मानी है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘हम और हमारे पूर्वज।’ हिब्रू में ‘हम और हमारे पिता’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁכְּבָה
  choice: आओ, हम ... पड़े रहें
  rationale: काल सहॉर्टेटिव प्रथम पुरुष बहुवचन है; यह प्रायश्चित्तपूर्ण स्वैच्छिक भाव और लज्जा में भूमि पर पड़े होने के बिंब को बनाए रखता है।
- source_word: בְּבָשְׁתֵּנוּ
  choice: अपनी लज्जा में
  rationale: בְּ यहाँ उस दशा या क्षेत्र को व्यक्त करता है जिसमें वे पड़े हैं; 'लज्जा' בֹּשֶׁת का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: וּתְכַסֵּנוּ
  choice: और ... हमें ढाँप ले
  rationale: यह तृतीय स्त्रीलिंग एकवचन अपूर्ण क्रिया है, जिसका कर्ता अगला स्त्रीलिंग भाववाचक पद 'हमारा अपमान' है। पहले सहॉर्टेटिव के समानांतर 'ढाँप ले' इच्छार्थक भाव रखता है।
- source_word: כְּלִמָּתֵנוּ
  choice: हमारा अपमान
  rationale: כְּלִמָּה और בֹּשֶׁת के अर्थ निकट हैं, फिर भी अलग शब्द चुनकर समानांतरता में निहित अर्थभेद सुरक्षित रखा गया है।
- source_word: לַיהוָה ... חָטָאנוּ
  choice: यहवे के विरुद्ध पाप किया है
  rationale: חטא के साथ ל उस व्यक्ति को सूचित कर सकता है जिसके विरुद्ध अपराध हुआ; हिन्दी में 'के विरुद्ध पाप करना' संबंधपरक अपराध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: यहवे
  rationale: चतुराक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में निकट ध्वन्यात्मक लिप्यंतरण दिया गया है।
- source_word: אֲנַחְנוּ וַאֲבוֹתֵינוּ
  choice: हमने और हमारे पुरखाओं ने
  rationale: हिब्रू में अक्षरशः 'हम और हमारे पिता' है। यहाँ सामूहिक ऐतिहासिक स्वीकारोक्ति में 'पुरखा' स्वाभाविक हिन्दी है और पूर्वज पिताओं का आशय व्यक्त करता है।
- source_word: מִנְּעוּרֵינוּ וְעַד הַיּוֹם הַזֶּה
  choice: अपनी जवानी से लेकर आज तक
  rationale: यह अभिव्यक्ति आरंभिक अवस्था से वर्तमान दिन तक विद्रोह की निरंतरता बताती है; हिन्दी रूप मूल की कालगत सीमा को बनाए रखता है।
- source_word: וְלֹא שָׁמַעְנוּ בְּקוֹל
  choice: और हमने ... की वाणी नहीं मानी
  rationale: हिब्रू मुहावरा केवल सुनने नहीं, बल्कि आज्ञापालन का अर्थ देता है। 'वाणी नहीं मानी' सुनने के बिंब और अवज्ञा, दोनों को स्वाभाविक हिन्दी में रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे प्रयुक्त है। उसका लिप्यंतरण नाम और उपाधि के बीच का अंतर सुरक्षित रखता है, जबकि किसी संप्रदाय-विशेष की व्याख्या नहीं जोड़ता।
- issue: राष्ट्रीय स्वीकारोक्ति में 'हम और हमारे पिता'
  choice: हमने और हमारे पुरखाओं ने
  alternative: हमने और हमारे पिताओं ने
  rationale: यह स्वीकारोक्ति वर्तमान पीढ़ी और पिछली पीढ़ियों के निरंतर पाप को जोड़ती है। 'पुरखा' हिन्दी में इस ऐतिहासिक-सामूहिक अर्थ को स्पष्ट करता है, पर व्यक्तिगत और सामूहिक उत्तरदायित्व के तनाव को नहीं मिटाता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गंभीर और स्वीकारोक्तिपूर्ण रखी गई है। 'आओ ... पड़े रहें' और 'ढाँप ले' मूल के इच्छार्थक समानांतर भाव को व्यक्त करते हैं। वाक्य की काव्यात्मक गति बनाए रखते हुए विरामचिह्नों से 'हमने और हमारे पुरखाओं ने' पर बल दिया गया है।
