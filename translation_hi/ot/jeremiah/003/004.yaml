base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/004.yaml
  text: Have you not just now called to me[a], ‘My Father[b], you are the friend of my youth’?”
translation:
  language: hi
  text: क्या तूने अभी-अभी[b] यह कहकर मुझे नहीं पुकारा, “मेरे पिता, तू मेरी जवानी का घनिष्ठ साथी[a] है”?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरी जवानी का मार्गदर्शक।” हिब्रू शब्द का अर्थ संदर्भ के अनुसार घनिष्ठ साथी, मित्र या अगुवा हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “अभी-अभी” के स्थान पर “अब से” भी संभव है। यहाँ इसे हाल ही में की गई पुकार के अर्थ में लिया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא
  choice: क्या ... नहीं
  rationale: यह अलंकारिक प्रश्न है, जिसमें सकारात्मक उत्तर अपेक्षित है; हिंदी में ‘क्या ... नहीं’ उसका प्रश्नात्मक बल बनाए रखता है।
- source_word: מֵעַתָּה
  choice: अभी-अभी
  rationale: संदर्भ में यह हाल ही में की गई पुकार की ओर संकेत करता है, यद्यपि ‘अब से’ भी शाब्दिक रूप से संभव है।
- source_word: קראתי לִי
  choice: तूने मुझे पुकारकर ... कहा
  rationale: मसोरेटिक पाठ में क्रिया स्त्रीलिंग एकवचन है और व्यक्तिरूप यहूदा से कही गई है। לִי अप्रत्यक्ष कर्म है; हिंदी मुहावरे में उद्धृत संबोधन के साथ ‘मुझे पुकारकर कहा’ स्वाभाविक है।
- source_word: אָבִי
  choice: मेरे पिता
  rationale: यह परमेश्वर के लिए प्रत्यक्ष संबोधन है; हिंदी में संबंध और संबोधन दोनों स्पष्ट रहते हैं।
- source_word: אַלּוּף
  choice: घनिष्ठ साथी
  rationale: इस संबंधपरक संदर्भ में शब्द निकट सहयोगी या आत्मीय साथी का अर्थ दे सकता है; ‘घनिष्ठ साथी’ निकटता को व्यक्त करता है, जबकि नेतृत्व का संभावित अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: נְעֻרַי
  choice: मेरी जवानी का
  rationale: रचनात्मक संबंध को सहज आधुनिक हिंदी में बनाए रखता है।
- source_word: אָתָּה
  choice: तू ... है
  rationale: स्वतंत्र सर्वनाम पर बल है और संबोधन निकटता का है; हिंदी का एकवचन ‘तू’ मूल के व्याकरणिक एकवचन और आत्मीय दावे को दर्शाता है।
theological_decisions:
- issue: वक्ता और संबोधित व्यक्ति
  choice: यहोवा स्त्रीरूप में व्यक्त यहूदा/इस्राएल को संबोधित करते हुए उसकी पुकार उद्धृत करता है।
  alternative: इसे सच्चे पश्चात्ताप की प्रार्थना या ऊपरी पश्चात्ताप पर व्यंग्यात्मक प्रकाश—दोनों रूपों में संदर्भानुसार समझा जा सकता है।
  rationale: स्त्रीलिंग क्रियारूप संबोधित पक्ष को स्पष्ट करता है, पर यह पद अकेले उसकी पुकार की सच्चाई का अंतिम निर्णय नहीं करता।
- issue: מֵעַתָּה का कालगत अर्थ
  choice: हाल की पुकार—‘अभी-अभी’।
  alternative: ‘अब से’ अर्थात भविष्य की ओर उन्मुख संबोधन।
  rationale: निकट संदर्भ हाल की अपील के अर्थ का समर्थन करता है, लेकिन हिब्रू वाक्यांश की वास्तविक वैकल्पिक संभावना पादटिप्पणी में रखी गई है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिंदी। व्यक्तिरूप यहूदा के लिए स्त्रीलिंग क्रिया तथा परमेश्वर से आत्मीय एकवचन संबोधन ‘तू’ रखा गया है। दोनों पादटिप्पणी चिह्न मुख्य पाठ में संबद्ध शब्दों के बाद दिए गए हैं।
