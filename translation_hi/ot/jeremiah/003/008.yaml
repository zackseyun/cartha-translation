  text: וָ/אֵ֗רֶא כִּ֤י עַל כָּל אֹדוֹת֙ אֲשֶׁ֤ר נִֽאֲפָה֙ מְשֻׁבָ֣ה יִשְׂרָאֵ֔ל שִׁלַּחְתִּ֕י/הָ וָ/אֶתֵּ֛ן אֶת סֵ֥פֶר כְּרִיתֻתֶ֖י/הָ אֵלֶ֑י/הָ וְ/לֹ֨א יָֽרְאָ֜ה בֹּֽגֵדָ֤ה יְהוּדָה֙ אֲחוֹתָ֔/הּ וַ/תֵּ֖לֶךְ וַ/תִּ֥זֶן גַּם הִֽיא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/008.yaml
  text: And I saw that because backsliding Israel had committed adultery in all these matters[a], I had sent her away and given her a certificate of divorce. Yet her treacherous sister Judah did not fear[c][b], but she too went and prostituted herself.
translation:
  language: hi
  text: और मैंने देखा कि विश्वास से फिर जानेवाली इस्राएल ने जिन-जिन बातों में व्यभिचार किया था, उन सब के कारण मैंने उसे छोड़ दिया और उसे तलाक़ का पत्र[a] दे दिया। फिर भी उसकी विश्वासघाती बहन यहूदा नहीं डरी, बल्कि वह भी जाकर वेश्यावृत्ति करने लगी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तलाक़नामा”; इब्रानी में यह विवाह-विच्छेद का औपचारिक कानूनी दस्तावेज़ है।
    reason: lexical_alternative
  - marker: b
    text: या “जाकर वेश्या बन गई।” यह वाचा के प्रति बेवफ़ाई का यौन रूपक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵרֶא
  choice: और मैंने देखा
  rationale: ראה के सामान्य अर्थ और क्रमिक कथन-शैली को बनाए रखता है।
- source_word: עַל כָּל אֹדוֹת אֲשֶׁר נִאֲפָה
  choice: उसने व्यभिचार किया था; इसी कारण
  rationale: इब्रानी की संकुचित कारणवाचक रचना को स्वाभाविक हिन्दी में व्यक्त करता है; כָּל की व्यापकता व्यभिचार के समग्र आचरण के संदर्भ में निहित रहती है।
- source_word: מְשֻׁבָה יִשְׂרָאֵל
  choice: भटक जानेवाली इस्राएल
  rationale: מְשֻׁבָה में मुड़ जाने या विमुख होने का भाव है; यह सरल आधुनिक हिन्दी में उस गति-रूपक को बचाता है।
- source_word: שִׁלַּחְתִּיהָ
  choice: मैंने उसे निकाल दिया
  rationale: विवाह-विच्छेद के प्रसंग में 'भेज देना/निकाल देना' का भाव है; यहाँ 'निकाल दिया' सम्बन्ध-विच्छेद को स्पष्ट और स्वाभाविक बनाता है।
- source_word: סֵפֶר כְּרִיתֻתֶיהָ
  choice: तलाक़ का पत्र
  rationale: विधिक विवाह-विच्छेद दस्तावेज़ का स्पष्ट, प्रचलित हिन्दी रूप।
- source_word: וְלֹא יָרְאָה
  choice: नहीं डरी
  rationale: ירא का सीधा अर्थ सुरक्षित रखता है और चेतावनी से भय न खाने का नैतिक भार बनाए रखता है।
- source_word: בֹּגֵדָה יְהוּדָה
  choice: विश्वासघाती ... यहूदा
  rationale: בגד का छलपूर्ण विश्वासघात का भाव व्यक्त करता है और מְשֻׁבָה से अलग शब्दावली बनाए रखता है।
- source_word: וַתֵּלֶךְ וַתִּזֶן
  choice: वह भी जाकर वेश्या बन गई
  rationale: זנה के प्रबल यौन रूपक को आधुनिक, समझने योग्य हिन्दी में बनाए रखता है।
theological_decisions:
- issue: वाचा-भंग के लिए विवाह, व्यभिचार और तलाक़ के रूपक
  choice: व्यभिचार, निकाल देना, तलाक़ का पत्र और वेश्या बनना—सभी चित्र बनाए रखे गए
  alternative: इन्हें सामान्यतः 'अविश्वासयोग्यता' या 'मूर्तिपूजा' कहकर नरम करना
  rationale: मूल पाठ जानबूझकर वैवाहिक, यौन और विधिक भाषा प्रयोग करता है; उसे सामान्यीकृत करने से भविष्यद्वाणी का आरोप और तनाव कम हो जाएगा।
- issue: מְשֻׁבָה और בֹּגֵדָה का भेद
  choice: क्रमशः 'भटक जानेवाली' और 'विश्वासघाती'
  alternative: दोनों के लिए एक ही शब्द, जैसे 'विश्वासहीन'
  rationale: यिर्मयाह की अलग-अलग आरोपात्मक संज्ञाओं और उनके अलंकारिक भेद को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। कठोर वैवाहिक और यौन रूपक को नरम नहीं किया गया। 'इस्राएल' और 'यहूदा' को स्त्रीरूप में व्यक्त किया गया है, क्योंकि मूल में दोनों बहनों के रूप में मानवीकृत हैं।
