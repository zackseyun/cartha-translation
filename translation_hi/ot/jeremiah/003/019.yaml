source:
  edition: WLC
  text: וְ/אָנֹכִ֣י אָמַ֗רְתִּי אֵ֚יךְ אֲשִׁיתֵ֣/ךְ בַּ/בָּנִ֔ים וְ/אֶתֶּן לָ/ךְ֙ אֶ֣רֶץ חֶמְדָּ֔ה נַחֲלַ֥ת צְבִ֖י צִבְא֣וֹת גּוֹיִ֑ם וָ/אֹמַ֗ר אָבִ/י֙ תקראו לִ֔/י וּ/מֵ/אַחֲרַ֖/י לֹ֥א תשובו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/019.yaml
  text: And I said[a], ‘How I would set you among the sons and give you a desirable land, the most beautiful inheritance of the nations' armies.’ And I said, ‘You will call me[b], “My Father,” and you will not turn away from following me.’
translation:
  language: hi
  text: और मैंने कहा, “मैं तुझे पुत्रों में[a] कैसे स्थान दूँ और तुझे एक मनभावनी भूमि, राष्ट्रों की सबसे शोभायमान विरासत[b], दूँ?” फिर मैंने कहा, “तू मुझे पुकारेगी, ‘हे मेरे पिता,’ और मेरे पीछे चलने से नहीं फिरेगी।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘पुत्रों में’; संदर्भ में इसका व्यापक अर्थ ‘संतानों में’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यह इब्रानी पदबंध कठिन है। इसका अर्थ ‘राष्ट्रों की परम शोभायमान विरासत,’ ‘राष्ट्रों के बीच एक महिमामय विरासत,’ अथवा अधिक शाब्दिक रूप से ‘राष्ट्रों की सेनाओं/समूहों की सबसे सुंदर विरासत’ भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: אֵיךְ
  choice: कैसे
  rationale: यह शब्द विस्मय, विचार या प्रश्न का भाव व्यक्त कर सकता है। ‘कैसे’ मूल की खुली हुई अर्थ-संभावना बनाए रखता है।
- source_word: אֲשִׁיתֵךְ בַּבָּנִים
  choice: तुझे पुत्रों में स्थान दूँ
  rationale: שׁית का अर्थ ‘रखना/स्थान देना’ और בנים का शाब्दिक अर्थ ‘पुत्र’ है। स्त्रीलिंग एकवचन संबोधन को ‘तुझे’ से बनाए रखते हुए पुत्रत्व की मूल छवि सुरक्षित रखी गई है।
- source_word: אֶרֶץ חֶמְדָּה
  choice: एक मनभावनी भूमि
  rationale: חמדה में चाहने योग्य, प्रिय और आनंददायक होने का भाव है; ‘मनभावनी’ आधुनिक और स्वाभाविक हिन्दी में इस अर्थ-क्षेत्र को व्यक्त करता है।
- source_word: נַחֲלַת צְבִי צִבְאוֹת גּוֹיִם
  choice: राष्ट्रों की सेनाओं की सबसे सुंदर विरासत
  rationale: यह संक्षिप्त इब्रानी पदबंध व्याकरण और अर्थ दोनों की दृष्टि से कठिन है। मुख्य पाठ में ‘विरासत’, ‘सुंदरता/शोभा’, ‘सेनाएँ/समूह’ और ‘राष्ट्र’ के प्रमुख शाब्दिक घटक दिखाई देते हैं; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: אָבִי תִּקְרְאִי לִי
  choice: तू मुझे ‘मेरे पिता’ कहकर पुकारेगी
  rationale: קרא עם ל यहाँ सीधे संबोधन का भाव देता है। स्त्रीलिंग एकवचन क्रिया को ‘पुकारेगी’ से व्यक्त किया गया है।
- source_word: וּמֵאַחֲרַי לֹא תָשׁוּבִי
  choice: मेरे पीछे चलने से नहीं फिरेगी
  rationale: ‘मेरे पीछे से न फिरना’ एक इब्रानी मुहावरा है, जिसका आशय परमेश्वर का अनुसरण करना न छोड़ना है। हिन्दी में दिशात्मक रूपक और वाचा-संबंधी भाव दोनों बनाए गए हैं।
theological_decisions:
- issue: בַּבָּנִים में लिंग-सूचक पुत्रत्व की भाषा
  choice: पुत्रों में
  alternative: संतानों में
  rationale: मूल पाठ में पुरुषवाचक बहुवचन ‘पुत्र’ है और यहाँ परिवार में स्थान मिलने की छवि महत्त्वपूर्ण है। व्यापक अर्थ को पादटिप्पणी में स्वीकार किया गया है।
- issue: נַחֲלַת צְבִי צִבְאוֹת גּוֹיִם का कठिन अर्थ
  choice: राष्ट्रों की सेनाओं की सबसे सुंदर विरासत
  alternative: राष्ट्रों की परम शोभायमान विरासत / राष्ट्रों के बीच एक महिमामय विरासत
  rationale: पदबंध को किसी एक सहज व्याख्या में पूरी तरह समतल करने के बजाय मुख्य पाठ में उसके प्रमुख शाब्दिक तत्व रखे गए हैं और वास्तविक अर्थगत अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
- issue: संबोधित व्यक्ति का व्याकरणिक लिंग
  choice: स्त्रीलिंग एकवचन—‘पुकारेगी’, ‘फिरेगी’
  alternative: लिंग-निरपेक्ष बहुवचन
  rationale: इब्रानी संदर्भ में इस्राएल/यहूदा को स्त्रीलिंग एकवचन में संबोधित किया गया है; हिन्दी क्रियाओं में इसे स्पष्ट रूप से सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रूप अपनाया गया है। परमेश्वर के सीधे संबोधन में ‘तू/तुझे’ बाइबिलीय निकटता और एकवचन व्याकरण को व्यक्त करता है; स्त्रीलिंग क्रियाएँ संबोधित इस्राएल/यहूदा के मूल व्याकरणिक रूप को सुरक्षित रखती हैं।
