source:
  edition: WLC
  text: ק֚וֹל עַל שְׁפָיִ֣ים נִשְׁמָ֔ע בְּכִ֥י תַחֲנוּנֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל כִּ֤י הֶעֱוּוּ֙ אֶת דַּרְכָּ֔/ם שָׁכְח֖וּ אֶת יְהֹוָ֥ה אֱלֹהֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/021.yaml
  text: A voice is heard on the bare heights[a], the weeping and pleas for mercy of the sons of Israel, because they have made their way crooked[c][b]; they have forgotten Yahweh their God.
translation:
  language: hi
  text: उजाड़ ऊँचाइयों[a] पर एक आवाज़ सुनाई देती है—इस्राएल के पुत्रों[b] का रोना और दया की गुहार। क्योंकि उन्होंने अपने मार्ग को टेढ़ा कर दिया है[c]; वे अपने परमेश्वर याहवे[d] को भूल गए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बंजर ऊँचाइयों’ अथवा ‘नंगी पहाड़ियों पर’।
    reason: lexical_alternative
  - marker: b
    text: या ‘इस्राएल की संतान’ अथवा ‘इस्राएल के लोग’।
    reason: lexical_alternative
  - marker: c
    text: या ‘उन्होंने अपने मार्ग को विकृत कर दिया है’।
    reason: lexical_alternative
  - marker: d
    text: इब्रानी में YHWH; इसका सटीक प्राचीन उच्चारण निश्चित नहीं है। इसे ‘यहोवा’ भी कहा गया है और परंपरागत रूप से ‘प्रभु’ अनूदित किया गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: ק֚וֹל
  choice: एक आवाज़
  rationale: קול का सामान्य अर्थ ‘आवाज़’ या ‘ध्वनि’ है। आगे रोने और गुहार का उल्लेख होने के कारण ‘आवाज़’ यहाँ सजीव और स्वाभाविक है।
- source_word: עַל שְׁפָיִם
  choice: उजाड़ ऊँचाइयों पर
  rationale: שְׁפָיִם खुली, वृक्षहीन या बंजर ऊँचाइयों को सूचित करता है। ‘उजाड़ ऊँचाइयाँ’ स्थल की ऊँचाई और वीरानी दोनों व्यक्त करता है तथा इसे अनिवार्य रूप से उपासना-स्थलों का तकनीकी नाम नहीं बनाता।
- source_word: נִשְׁמָע
  choice: सुनाई देती है
  rationale: שמע का निफ़अल रूप यहाँ कर्मवाच्य अर्थ देता है; आधुनिक हिन्दी में ‘सुनाई देती है’ सहज है।
- source_word: בְּכִי תַחֲנוּנֵי
  choice: रोने और दया की गुहार लगाने की आवाज़
  rationale: בכי ‘रोना’ और תחנונים कृपा या दया के लिए की गई earnest विनती है। वाक्य में इसे आरंभिक ‘आवाज़’ का स्पष्टीकरण बनाकर रखा गया है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: यह इब्रानी पद का रूपगत निकट अनुवाद है। सामूहिक अर्थ ‘इस्राएल के लोग’ भी संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: הֶעֱוּוּ אֶת דַּרְכָּם
  choice: उन्होंने अपने मार्ग टेढ़े कर लिए हैं
  rationale: עוה का हिफ़ील रूप किसी वस्तु को टेढ़ा या विकृत करने का भाव देता है। ‘मार्ग टेढ़े करना’ मूल नैतिक रूपक को बनाए रखता है।
- source_word: שָׁכְחוּ
  choice: भूल गए हैं
  rationale: पूर्ण क्रिया बीते हुए विश्वासघात के वर्तमान परिणाम को व्यक्त करती है; हिन्दी का पूर्णकाल यहाँ स्वाभाविक है।
- source_word: יְהֹוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत वाचा-नाम YHWH है। ‘याहवे’ उसका प्रचलित विद्वतापूर्ण उच्चारण दर्शाता है; पारंपरिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: אֱלֹהֵיהֶם
  choice: अपने परमेश्वर
  rationale: ‘अपने परमेश्वर’ हिन्दी में संबंधसूचक प्रत्यय का स्वाभाविक अनुवाद है और वाचा-संबंध की विडंबना को बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पद में उपाधि नहीं, चतुराक्षरी व्यक्तिगत नाम YHWH आया है। नाम को मुख्य पाठ में रखना स्रोत की विशिष्टता सुरक्षित करता है; उच्चारण की अनिश्चितता और पारंपरिक रूप पादटिप्पणी में बताए गए हैं।
- issue: בְּנֵי יִשְׂרָאֵל का लिंग और सामूहिक अर्थ
  choice: इस्राएल के पुत्रों
  alternative: इस्राएल की संतान; इस्राएल के लोग
  rationale: मुख्य पाठ इब्रानी के पुल्लिंग बहुवचन रूप को बनाए रखता है, जबकि पादटिप्पणी स्पष्ट करती है कि यह पद पूरे समुदाय के लिए भी प्रयुक्त हो सकता है।
- issue: ‘मार्ग टेढ़े करने’ का नैतिक रूपक
  choice: रूपक को यथावत रखा गया
  alternative: अपने आचरण को भ्रष्ट कर लिया
  rationale: मूल पाठ नैतिक भ्रष्टता को मार्ग के टेढ़ेपन के ठोस रूपक में व्यक्त करता है। उसे अमूर्त व्याख्या से बदलने पर मूल चित्र खो जाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘दया की गुहार’ सामान्य पाठक के लिए ‘अनुनय-विनय’ या ‘याचनाओं’ से अधिक स्पष्ट है। आरंभिक आवाज़ और उसके स्पष्टीकरण के बीच दीर्घ विराम-चिह्न इब्रानी की काव्यात्मक समानाधिकरण संरचना को सहज हिन्दी में व्यक्त करता है।
