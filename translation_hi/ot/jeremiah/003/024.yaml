base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/024.yaml
  text: But shame has devoured the labor of our fathers from our youth—their flocks and their herds[a], their sons and their daughters.
translation:
  language: hi
  text: परन्तु लज्जा[a] ने हमारी युवावस्था से ही हमारे पुरखों की मेहनत की कमाई को निगल लिया है—उनके भेड़-बकरियों के झुंड और गाय-बैलों के झुंड, उनके बेटे और उनकी बेटियाँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “लज्जाजनक वस्तु”; सम्भवतः यह बाल अथवा मूर्तिपूजा के लिए तिरस्कारपूर्ण संकेत है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַבֹּשֶׁת
  choice: परन्तु लज्जा
  rationale: संज्ञा का मूल अर्थ “लज्जा” है और यहाँ उसे निगलने वाले कर्ता के रूप में व्यक्त किया गया है। सन्दर्भ में वְ को विरोधसूचक “परन्तु” कहना स्वाभाविक है। यह रूप सम्भावित मूर्तिपूजा-संबंधी संकेत को मुख्य पाठ में स्पष्ट करके मूल की अर्थगत गुंजाइश को समाप्त नहीं करता।
- source_word: אָכְלָה
  choice: ने … निगल लिया है
  rationale: אכל का मूल बिंब “खाना” है; सम्पत्ति और सन्तानों के साथ “निगल लिया” विनाशकारी उपभोग का सजीव रूपक बनाए रखता है। पूर्ण क्रिया के परिणाम की वर्तमान प्रासंगिकता “लिया है” से व्यक्त होती है।
- source_word: יְגִיעַ
  choice: मेहनत की कमाई
  rationale: यह शब्द परिश्रम और उससे प्राप्त उपज या संपत्ति दोनों का बोध करा सकता है। “मेहनत की कमाई” आगामी सूची—पशुधन और सन्तान—के लिए “उपज” की अपेक्षा अधिक व्यापक और स्वाभाविक है।
- source_word: אֲבוֹתֵינוּ
  choice: हमारे पुरखाओं की
  rationale: “पुरखा” आधुनिक हिन्दी में पूर्वज पिताओं के लिए स्वाभाविक है और इब्रानी के पुल्लिंग बहुवचन को बनाए रखता है।
- source_word: מִנְּעוּרֵינוּ
  choice: हमारी युवावस्था से ही
  rationale: यह आरम्भ-बिन्दु से चली आ रही अवधि व्यक्त करता है। “से ही” इब्रानी מִן के कालगत बल को सहज हिन्दी में प्रकट करता है।
- source_word: צֹאנָם
  choice: उनके भेड़-बकरियों के झुंड
  rationale: צֹאן छोटे पालतू पशुओं, विशेषकर भेड़ और बकरियों, का सामूहिक शब्द है। स्पष्ट हिन्दी के लिए दोनों प्रमुख पशुओं का उल्लेख किया गया है।
- source_word: בְּקָרָם
  choice: गाय-बैलों के झुंड
  rationale: בקר बड़े गोवंशीय पशुओं को सूचित करता है। “गाय-बैल” सामान्य पाठक के लिए अर्थ स्पष्ट करता और צֹאן के साथ भेद बनाए रखता है।
- source_word: בְּנֵיהֶם וְאֶת־בְּנוֹתֵיהֶם
  choice: उनके बेटे और उनकी बेटियाँ
  rationale: मूल पाठ के पुत्र-पुत्री के स्पष्ट युग्म को सामान्यीकृत “सन्तान” में नहीं बदला गया है।
theological_decisions:
- issue: הַבֹּשֶׁת का सम्भावित संकेत बाल अथवा मूर्तिपूजा की ओर
  choice: मुख्य पाठ में “लज्जा”
  alternative: “लज्जाजनक वस्तु” अथवा व्याख्यात्मक रूप से “बाल”
  rationale: यिर्मयाह में “लज्जा” बाल या मूर्तिपूजा के लिए तिरस्कारपूर्ण परोक्ष नाम हो सकता है, पर यहाँ केवल अमूर्त लज्जा का मानवीकरण भी सुनाई देता है। मुख्य पाठ इब्रानी अभिव्यक्ति और उसकी द्विअर्थी धार्मिक धार को बनाए रखता है; सम्भावित संकेत पाद-टिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। “निगल लिया” मूल रूपक को जीवित रखता है, जबकि पशुधन के दोनों वर्गों को हिन्दी में स्पष्ट किया गया है।
