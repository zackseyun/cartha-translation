source:
  edition: WLC
  text: בָּ/עֵ֣ת הַ/הִ֗יא יִקְרְא֤וּ לִ/ירוּשָׁלִַ֨ם֙ כִּסֵּ֣א יְהוָ֔ה וְ/נִקְוּ֨וּ אֵלֶ֧י/הָ כָֽל הַ/גּוֹיִ֛ם לְ/שֵׁ֥ם יְהוָ֖ה לִ/ירוּשָׁלִָ֑ם וְ/לֹא יֵלְכ֣וּ ע֔וֹד אַחֲרֵ֕י שְׁרִר֖וּת לִבָּ֥/ם הָ/רָֽע־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/017.yaml
  text: At that time they will call Jerusalem ‘the throne of Yahweh,’ and all the nations will gather to it[a], to Jerusalem, for the name of Yahweh[b]. They will no longer walk after the stubbornness of their evil heart.
translation:
  language: hi
  text: उस समय वे यरूशलेम को ‘याहवे का सिंहासन’ कहेंगे, और सभी राष्ट्र वहाँ—यरूशलेम में—याहवे के नाम के लिए[b] इकट्ठे होंगे[a]। फिर वे अपने बुरे मन की हठ के पीछे नहीं चलेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसकी ओर इकट्ठे होंगे” अथवा “उसकी ओर उमड़ेंगे।” यहाँ प्रयुक्त इब्रानी क्रिया कठिन है; प्रसंग में यह राष्ट्रों के यरूशलेम की ओर आकर एकत्र होने का वर्णन करती है।
    reason: lexical_alternative
  - marker: b
    text: “याहवे के नाम के लिए” का अर्थ उसके नाम के सम्मान में या उसके नाम की ओर उन्मुख होकर भी हो सकता है; इब्रानी वाक्यांश संबंध को संक्षेप में व्यक्त करता है।
    reason: lexical_ambiguity
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: उस समय
  rationale: यह भविष्य में होनेवाली पुनर्स्थापना के दृश्य का परिचय देनेवाला सामान्य कालसूचक वाक्यांश है।
- source_word: יִקְרְאוּ לִירוּשָׁלַם כִּסֵּא יְהוָה
  choice: वे यरूशलेम को ‘याहवे का सिंहासन’ कहेंगे
  rationale: इब्रानी के सक्रिय बहुवचन क्रिया-रूप और ‘सिंहासन’ के प्रत्यक्ष रूपक को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: दिव्य नाम को उपाधि से बदलने के बजाय देवनागरी लिप्यंतरण में प्रस्तुत किया गया है।
- source_word: וְנִקְוּוּ אֵלֶיהָ
  choice: वहाँ … इकट्ठे होंगे
  rationale: यह कठिन निफ़अल रूप प्रसंग में यरूशलेम की ओर राष्ट्रों के एकत्र होने को व्यक्त करता है; सहज हिन्दी के लिए स्त्रीलिंग सर्वनाम के स्थान पर स्थानवाचक ‘वहाँ’ रखा गया है।
- source_word: כָל הַגּוֹיִם
  choice: सभी राष्ट्र
  rationale: यहाँ व्यापक रूप से संसार के राष्ट्र अभिप्रेत हैं; ‘ग़ैर-यहूदी’ कहना अनावश्यक रूप से अर्थ को संकुचित करता।
- source_word: לְשֵׁם יְהוָה
  choice: याहवे के नाम के लिए
  rationale: यह इब्रानी पूर्वसर्ग की दिशा और सम्मान के भाव को बनाए रखता है, बिना उसे केवल आराधना, कारण या उद्देश्य के अर्थ में सीमित किए।
- source_word: לִירוּשָׁלָם
  choice: यरूशलेम में
  rationale: मूल पाठ में यरूशलेम की पुनरुक्ति को स्पष्टता सहित बनाए रखा गया है; हिन्दी में एकत्र होने के गंतव्य के लिए ‘में’ स्वाभाविक है।
- source_word: וְלֹא יֵלְכוּ עוֹד אַחֲרֵי
  choice: फिर वे … के पीछे नहीं चलेंगे
  rationale: मूल के ‘पीछे चलने’ वाले रूपक को स्वाभाविक हिन्दी में सुरक्षित रखता है और עוֹד का भाव ‘फिर … नहीं’ से व्यक्त करता है।
- source_word: שְׁרִרוּת לִבָּם הָרָע
  choice: अपने बुरे मन की हठ
  rationale: שְׁרִרוּת की हठ अथवा दुराग्रह की धारणा को व्यक्त करता है; हिन्दी में ‘मन’ नैतिक इच्छा और आंतरिक प्रवृत्ति के लिए अधिक सहज है।
theological_decisions:
- issue: यरूशलेम को ‘याहवे का सिंहासन’ कहना
  choice: रूपक को सीधे बनाए रखा गया है।
  alternative: इसे केवल प्रतीकात्मक शासन या किसी विशिष्ट भावी राज्य-व्यवस्था के रूप में समझाकर अनुवाद करना।
  rationale: पद स्वयं यरूशलेम को याहवे के राजकीय शासन से जोड़ता है, पर व्यापक युगांतशास्त्रीय व्यवस्था निर्धारित नहीं करता।
- issue: राष्ट्रों का यरूशलेम की ओर एकत्र होना
  choice: सामूहिक रूप से यरूशलेम में इकट्ठे होना
  alternative: इसे विशेष रूप से तीर्थयात्रा, धर्मांतरण या राजनीतिक अधीनता कहना।
  rationale: मूल पाठ गति और एकत्रीकरण बताता है, पर उसके धार्मिक अथवा राजनीतिक स्वरूप को और सीमित नहीं करता।
- issue: לְשֵׁם יְהוָה का संबंध
  choice: ‘याहवे के नाम के लिए’ के रूप में अपेक्षाकृत खुला रखा गया है।
  alternative: ‘याहवे के नाम की आराधना करने’, ‘याहवे के नाम के कारण’ या ‘याहवे के नाम के पास’ कहना।
  rationale: पूर्वसर्ग उद्देश्य, सम्मान और दिशा के बीच अर्थगत विस्तार रख सकता है; अनुवाद इस वास्तविक अस्पष्टता को पूरी तरह हल नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय और सहज शैली रखी गई है। ‘याहवे’ दिव्य नाम का लिप्यंतरण है। ‘सिंहासन’, ‘राष्ट्र’, ‘मन की हठ’ और ‘पीछे चलना’ मूल के प्रमुख रूपकों तथा नैतिक भाषा को सुरक्षित रखते हैं।
