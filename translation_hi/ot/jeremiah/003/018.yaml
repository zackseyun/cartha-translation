id: JER.3.18
reference: Jeremiah 3:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בַּ/יָּמִ֣ים הָ/הֵ֔מָּה יֵלְכ֥וּ בֵית יְהוּדָ֖ה עַל בֵּ֣ית יִשְׂרָאֵ֑ל וְ/יָבֹ֤אוּ יַחְדָּו֙ מֵ/אֶ֣רֶץ צָפ֔וֹן עַל הָ/אָ֕רֶץ אֲשֶׁ֥ר הִנְחַ֖לְתִּי אֶת אֲבוֹתֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/018.yaml
  text: In those days the house of Judah will go with the house of Israel[b][a], and they will come together from the land of the north to the land that I gave as an inheritance to your fathers.
translation:
  language: hi
  text: उन दिनों यहूदा का घराना इस्राएल के घराने के साथ चलेगा[a], और वे उत्तर के देश से उस देश में एक साथ आएँगे, जिसे मैंने तुम्हारे पूर्वजों को विरासत में दिया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “यहूदा का घराना इस्राएल के घराने के पास जाएगा।” इब्रानी संबंधबोधक शब्द का अधिक शाब्दिक अनुवाद ऐसा हो सकता है; प्रसंग में संभवतः इस्राएल के साथ यहूदा के पुनर्मिलन का भाव है।'
    reason: alternative_reading
lexical_decisions:
- source_word: בַּיָּמִים הָהֵמָּה
  choice: उन दिनों
  rationale: यह भविष्य में होने वाली पुनर्स्थापना का परिचित भविष्यद्वाणी-संबंधी कालवाचक मुहावरा है।
- source_word: יֵלְכוּ ... עַל בֵּית יִשְׂרָאֵל
  choice: इस्राएल के घराने के साथ चलेगा
  rationale: הלך का मूल अर्थ ‘चलना/जाना’ है। यहाँ עַל और अगले वाक्यांश ‘एक साथ’ के संदर्भ में यह यहूदा के इस्राएल से जुड़ने और दोनों की पुनःस्थापित एकता को व्यक्त करता है।
- source_word: בֵית יְהוּדָה / בֵית יִשְׂרָאֵל
  choice: यहूदा का घराना / इस्राएल का घराना
  rationale: ‘घराना’ सामूहिक और वाचा-संबंधी भाव बनाए रखता है तथा आधुनिक हिन्दी में ‘घर’ की अपेक्षा अधिक स्वाभाविक है।
- source_word: וְיָבֹאוּ יַחְדָּו
  choice: वे ... एक साथ आएँगे
  rationale: क्रिया ‘आएँगे’ और יחדו का साथ होने का भाव दोनों स्पष्ट रूप से सुरक्षित हैं।
- source_word: מֵאֶרֶץ צָפוֹן
  choice: उत्तर के देश से
  rationale: निर्वासन से वापसी के भौगोलिक और भविष्यद्वाणी-संबंधी संकेत को निकटता से बनाए रखता है।
- source_word: עַל הָאָרֶץ
  choice: उस देश में
  rationale: यहाँ עַל गंतव्य की ओर और उसमें पहुँचने की गति बताता है; हिन्दी में ‘देश में आएँगे’ स्वाभाविक है।
- source_word: אֲשֶׁר הִנְחַלְתִּי
  choice: जिसे मैंने ... विरासत में दिया था
  rationale: נחל के हिफ़ील रूप में किसी को विरासत दिलाने अथवा विरासत के रूप में देने का भाव है।
- source_word: אֶת אֲבוֹתֵיכֶם
  choice: तुम्हारे पूर्वजों को
  rationale: אָבוֹת का सामान्य सामूहिक अर्थ वंश के पहले के पितर/पूर्वज है; ‘पूर्वज’ आधुनिक हिन्दी में स्वाभाविक और अर्थ की दृष्टि से सटीक है।
theological_decisions:
- issue: यहूदा और इस्राएल की पुनःस्थापना
  choice: यहूदा का घराना इस्राएल के घराने के साथ चलेगा
  alternative: यहूदा का घराना इस्राएल के घराने के पास जाएगा
  rationale: עַל का शाब्दिक दायरा एक से अधिक अर्थ देता है, पर निकटवर्ती ‘एक साथ’ पुनर्मिलन की ओर संकेत करता है। मुख्य पाठ एकता को व्यक्त करता है, जबकि पादटिप्पणी गंतव्य-संबंधी विकल्प सुरक्षित रखती है।
- issue: אֲבוֹתֵיכֶם का लिंग और सामूहिक संदर्भ
  choice: तुम्हारे पूर्वजों को
  alternative: तुम्हारे पितरों को
  rationale: इब्रानी शब्द व्याकरणतः पुल्लिंग बहुवचन है, किंतु यहाँ लोगों की पिछली पीढ़ियों को सामूहिक रूप से दर्शाता है। ‘पूर्वज’ बिना अर्थ घटाए आधुनिक हिन्दी में अधिक सहज है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी अपनाई गई है। भविष्यद्वाणी के सामूहिक पदों के लिए ‘घराना’ और भूमि-अधिकार के भाव के लिए ‘विरासत’ रखा गया है। मुख्य पाठ में लगे [a] का पादटिप्पणी से सीधा मेल है।
