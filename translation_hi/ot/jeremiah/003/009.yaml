source:
  edition: WLC
  text: וְ/הָיָה֙ מִ/קֹּ֣ל זְנוּתָ֔/הּ וַ/תֶּחֱנַ֖ף אֶת הָ/אָ֑רֶץ וַ/תִּנְאַ֥ף אֶת הָ/אֶ֖בֶן וְ/אֶת הָ/עֵֽץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/009.yaml
  text: And because of the lightness of her prostitution[b][a], she polluted the land and committed adultery with stone and wood.
translation:
  language: hi
  text: उसकी वेश्यावृत्ति की चर्चा के कारण[a] उसने भूमि को अपवित्र कर दिया और पत्थर और लकड़ी के साथ व्यभिचार किया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी वेश्यावृत्ति के शोर/चर्चे के कारण”; अथवा, “उसकी वेश्यावृत्ति के हल्केपन के कारण।” इब्रानी अभिव्यक्ति कठिन है और इसका अर्थ अनिश्चित है।
    reason: lexical_alternative
  - marker: b
    text: “पत्थर और लकड़ी” से आशय इन सामग्रियों से बनी मूर्तियों से है।
    reason: cultural_note
lexical_decisions:
- source_word: מִקּוֹל
  choice: की बदनामी के कारण
  rationale: קוֹל का मूल अर्थ ‘आवाज़, शोर, चर्चा/खबर’ है। इस कठिन प्रयोग में ‘बदनामी’ उस व्यापक चर्चा या कुख्याति को स्वाभाविक हिन्दी में व्यक्त करती है, जबकि वैकल्पिक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: זְנוּתָהּ
  choice: उसकी वेश्यावृत्ति
  rationale: यह शब्द यौन अनैतिकता का प्रबल रूपक है और भविष्यवाणी के संदर्भ में मूर्तिपूजा द्वारा वाचा से विश्वासघात को दर्शाता है। ‘वेश्यावृत्ति’ आधुनिक हिन्दी में इसकी तीव्रता बनाए रखती है।
- source_word: וַתֶּחֱנַף
  choice: उसने ... अशुद्ध कर दिया
  rationale: भूमि/देश के कर्म के साथ यह क्रिया अपवित्र या दूषित करने का भाव देती है। ‘अशुद्ध कर दिया’ धार्मिक और नैतिक अशुद्धता दोनों को व्यक्त करता है।
- source_word: הָאָרֶץ
  choice: देश
  rationale: संदर्भ में यह समूची पृथ्वी के बजाय इस्राएल/यहूदा की भूमि की ओर संकेत करता है। हिन्दी में ‘देश’ इस वाचा-संबंधी भौगोलिक संदर्भ को सहजता से व्यक्त करता है।
- source_word: וַתִּנְאַף
  choice: व्यभिचार किया
  rationale: נאף व्यभिचार के लिए सीधा शब्द है। यह वैवाहिक-वाचा के रूपक को बिना नरम किए बनाए रखता है।
- source_word: אֶת־הָאֶבֶן וְאֶת־הָעֵץ
  choice: पत्थर और लकड़ी के साथ
  rationale: मूल पाठ सामग्री के नाम लेकर उनसे बनी मूर्तियों की ओर संकेत करता है। मुख्य पाठ में ‘मूर्तियाँ’ न जोड़कर इस तीखे लाक्षणिक प्रयोग को सुरक्षित रखा गया है।
theological_decisions:
- issue: मूर्तिपूजा के लिए यौन रूपक
  choice: वेश्यावृत्ति और व्यभिचार की भाषा को मुख्य पाठ में बनाए रखा गया।
  alternative: इसे केवल ‘विश्वासघात’ या ‘धर्मत्याग’ कहना।
  rationale: यिर्मयाह जानबूझकर वैवाहिक और यौन भाषा द्वारा वाचा से विश्वासघात को चित्रित करता है; इसे नरम करने से मूल की धर्मवैज्ञानिक तीव्रता घटेगी।
- issue: ‘पत्थर और लकड़ी’ का अंतर्निहित संकेत
  choice: मुख्य पाठ में सामग्री के नाम ही रखे गए और अर्थ पादटिप्पणी में बताया गया।
  alternative: मुख्य पाठ में ‘पत्थर और लकड़ी की मूर्तियों’ को स्पष्ट रूप से जोड़ना।
  rationale: इब्रानी पाठ मूर्तियों का नाम सीधे नहीं लेता, बल्कि सामग्री द्वारा उनकी ओर संकेत करता है; अनुवाद उसी लाक्षणिकता को बनाए रखता है।
- issue: מִקּוֹל זְנוּתָהּ की अस्पष्टता
  choice: मुख्य पाठ में इसे वेश्यावृत्ति की ‘बदनामी’ अर्थात व्यापक चर्चा/कुख्याति के रूप में लिया गया।
  alternative: ‘उसने अपनी वेश्यावृत्ति को हल्की बात समझा’ या ‘उसकी वेश्यावृत्ति के शोर/चर्चे के कारण’।
  rationale: मसोरेटी स्वरांकन ‘आवाज़/चर्चा’ का समर्थन करता है, पर मुहावरा कठिन है और ‘तुच्छ समझने’ की पारंपरिक व्याख्या भी संभव है; इसलिए निर्णायक समाधान थोपने के बजाय विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सीधी रखी गई है। भविष्यद्वक्ता के तीखे यौन रूपक को बिना शिष्टोक्ति से नरम किए प्रस्तुत किया गया है। कठिन इब्रानी मुहावरे की वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है।
