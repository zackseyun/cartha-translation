id: JER.3.15
reference: Jeremiah 3:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/נָתַתִּ֥י לָ/כֶ֛ם רֹעִ֖ים כְּ/לִבִּ֑/י וְ/רָע֥וּ אֶתְ/כֶ֖ם דֵּעָ֥ה וְ/הַשְׂכֵּֽיל׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/015.yaml
  text: And I will give you shepherds after my own heart[c][b][a], and they will shepherd you with knowledge and understanding.
translation:
  language: hi
  text: और मैं तुम्हें अपने मन के अनुसार[a] चरवाहे[b] दूँगा, और वे ज्ञान और सूझ-बूझ से[c] तुम्हारी चरवाही करेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मेरे हृदय के अनुसार”; इसका आशय परमेश्वर की अपनी इच्छा और अभिप्राय के अनुरूप है।
    reason: lexical_alternative
  - marker: b
    text: “चरवाहे” परमेश्वर के लोगों की देखभाल और अगुवाई करने वालों का रूपक है; इसे किसी विशिष्ट कलीसियाई पद तक सीमित नहीं समझना चाहिए।
    reason: metaphor_clarification
  - marker: c
    text: या “ज्ञान और समझ के साथ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי לָכֶם
  choice: और मैं तुम्हें ... दूँगा
  rationale: भविष्यसूचक प्रसंग में संयोजक सहित पूर्ण क्रिया भविष्य की प्रतिज्ञा व्यक्त करती है। यह हिंदी रूप संबंध और प्रतिज्ञा दोनों को स्वाभाविक ढंग से रखता है।
- source_word: רֹעִים
  choice: चरवाहे
  rationale: यह רעה से बना शब्द शाब्दिक रूप से ‘चरवाहों’ को दर्शाता है। इससे नेतृत्व का मूल इब्रानी रूपक सुरक्षित रहता है और बाद के किसी विशिष्ट कलीसियाई पद का संकेत नहीं जुड़ता।
- source_word: כְּלִבִּי
  choice: अपने मन के अनुसार
  rationale: शाब्दिक चित्र ‘मेरे हृदय के अनुसार’ है, पर आधुनिक हिंदी में ‘अपने मन के अनुसार’ परमेश्वर की इच्छा, अभिप्राय और मानदंड के अनुरूप होने का भाव अधिक स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְרָעוּ אֶתְכֶם
  choice: और वे ... तुम्हारी चरवाही करेंगे
  rationale: क्रिया רעה चराने, देखभाल करने और मार्गदर्शन देने के पूरे चरवाही-रूपक को समेटती है। संज्ञा और क्रिया के संबंध को बनाए रखने के लिए ‘चरवाही करेंगे’ चुना गया है।
- source_word: דֵּעָה
  choice: ज्ञान
  rationale: यह संज्ञा सामान्यतः ज्ञान का अर्थ देती है और इसे अगले पद से अलग रखने पर दोनों गुणों का युग्म सुरक्षित रहता है।
- source_word: וְהַשְׂכֵּיל
  choice: और सूझ-बूझ
  rationale: यहाँ रूप विवेकपूर्ण समझ या अंतर्दृष्टि का भाव देता है। ‘सूझ-बूझ’ आधुनिक हिंदी में ज्ञान से अलग व्यावहारिक और विवेकपूर्ण समझ को स्पष्ट करता है।
theological_decisions:
- issue: प्रतिज्ञा किए गए चरवाहों की पहचान
  choice: परमेश्वर द्वारा दिए गए मानवीय अगुओं के लिए व्यापक चरवाहा-रूपक
  alternative: विशेष रूप से पादरी अथवा केवल राजा-शासक
  rationale: यिर्मयाह के प्रसंग में यह पुनर्स्थापित प्रजा के नेतृत्व की व्यापक प्रतिज्ञा है। ‘चरवाहे’ मूल रूपक को बनाए रखता है और बाद की कलीसियाई पद-व्यवस्था को पाठ में नहीं जोड़ता।
- issue: ‘अपने मन के अनुसार’ का आशय
  choice: परमेश्वर की इच्छा, अभिप्राय और मानदंड के अनुरूप अगुए
  alternative: केवल ऐसे अगुए जो परमेश्वर को भावनात्मक रूप से प्रिय हों
  rationale: इब्रानी मुहावरा केवल स्नेह नहीं, बल्कि परमेश्वर के हृदय/मन के अनुरूपता का संकेत देता है; अनुवाद इस अर्थ-तनाव को बिना अत्यधिक व्याख्या के बनाए रखता है।
- issue: ज्ञान और सूझ-बूझ की वाक्यगत भूमिका
  choice: चरवाही करने की रीति या साधन के रूप में
  alternative: चरवाहों द्वारा लोगों को दी जाने वाली दो वस्तुओं के रूप में
  rationale: इब्रानी में बिना पूर्वसर्ग के आए ये शब्द कुछ संक्षिप्तता और संभावित अस्पष्टता रखते हैं। ‘से’ उन्हें स्वाभाविक हिंदी में चरवाही की गुणयुक्त रीति के रूप में प्रस्तुत करता है, जबकि पादटिप्पणी वैकल्पिक ‘के साथ’ को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘चरवाहे/चरवाही’ की पुनरावृत्ति जानबूझकर रखी गई है ताकि मूल इब्रानी का रूपक और शब्द-संबंध सुरक्षित रहे।
