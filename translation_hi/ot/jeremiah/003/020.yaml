id: JER.3.20
reference: Jeremiah 3:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אָכֵ֛ן בָּגְדָ֥ה אִשָּׁ֖ה מֵ/רֵעָ֑/הּ כֵּ֣ן בְּגַדְתֶּ֥ם בִּ֛/י בֵּ֥ית יִשְׂרָאֵ֖ל נְאֻם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/020.yaml
  text: Surely[a], as a woman betrays her companion, so you have betrayed me, O house of Israel, declares Yahweh.
translation:
  language: hi
  text: निश्चय ही[a], जैसे कोई स्त्री अपने साथी से विश्वासघात करती है, वैसे ही, हे इस्राएल के घराने, तुमने मुझसे विश्वासघात किया है—यह यहोवा की घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “निश्चय ही, जैसे कोई पत्नी अपने पति से विश्वासघात करती है।” इब्रानी में शाब्दिक रूप से “स्त्री” और “उसका साथी” है, पर आसपास के प्रसंग में इस्राएल की बेवफाई के लिए वैवाहिक चित्रण प्रयुक्त हुआ है।
    reason: वैकल्पिक अर्थ; मूल शब्दावली संबंध को स्पष्ट रूप से वैवाहिक नहीं ठहराती, जबकि प्रसंग उस अर्थ की अनुमति देता है।
lexical_decisions:
- source_word: אָכֵן
  choice: निश्चय ही
  rationale: यह पद के कथन पर बल देता है; ‘निश्चय ही’ आधुनिक हिन्दी में उसके गंभीर और निश्चयात्मक भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בָּגְדָה / בְּגַדְתֶּם
  choice: विश्वासघात करती है / विश्वासघात किया है
  rationale: בגד संबंध या वाचा में बेवफाई और छलपूर्ण विश्वासघात को दर्शाता है। तुलना में सामान्य क्रिया और इस्राएल के संबोधन में पूर्ण हो चुके किंतु वर्तमान प्रभाव वाले कार्य को हिन्दी में इन रूपों से व्यक्त किया गया है।
- source_word: אִשָּׁה
  choice: कोई स्त्री
  rationale: אִשָּׁה का अर्थ ‘स्त्री’ या ‘पत्नी’ हो सकता है। यहाँ वैवाहिक स्थिति स्पष्ट रूप से नहीं कही गई, इसलिए मुख्य पाठ में व्यापक अर्थ रखा गया है।
- source_word: מֵרֵעָהּ
  choice: अपने साथी के साथ
  rationale: רֵעַ साथी, संगी या मित्र को सूचित कर सकता है। ‘साथी’ संबंध की व्यापकता बनाए रखता है और उसे अनावश्यक रूप से ‘पति’ तक सीमित नहीं करता।
- source_word: כֵּן
  choice: वैसे ही
  rationale: यह उपमा और इस्राएल के आचरण के बीच स्पष्ट तुलनात्मक संबंध स्थापित करता है।
- source_word: בִּי
  choice: मेरे साथ
  rationale: בגד के साथ यह उस व्यक्ति को बताता है जिसके विरुद्ध विश्वासघात हुआ। हिन्दी मुहावरे में ‘मेरे साथ विश्वासघात’ स्वाभाविक है।
- source_word: בֵּית יִשְׂרָאֵל
  choice: हे इस्राएल के घराने
  rationale: यह सामूहिक और वाचागत पदवी को बनाए रखता है; ‘हे’ प्रत्यक्ष संबोधन को स्पष्ट और गरिमापूर्ण बनाता है।
- source_word: נְאֻם יְהוָה
  choice: यह यहोवा की घोषणा है
  rationale: यह मानक भविष्यद्वाणी-सूत्र की गंभीरता को स्वाभाविक हिन्दी में बनाए रखता है और व्यक्तिगत नाम יהוה को ‘यहोवा’ के रूप में प्रस्तुत करता है।
theological_decisions:
- issue: तुलना में संबंध का स्वरूप
  choice: मुख्य पाठ में ‘स्त्री’ और ‘साथी’ रखकर संबंध को व्यापक रहने दिया गया है।
  alternative: ‘जैसे कोई पत्नी अपने पति के साथ विश्वासघात करती है’
  rationale: यिर्मयाह 3 का व्यापक प्रसंग वैवाहिक रूपक का उपयोग करता है, इसलिए पत्नी-पति का अर्थ संभव है। फिर भी इस पद में אִשָּׁה और רֵעַ आए हैं, न कि पति के लिए कोई स्पष्ट शब्द; अतः मुख्य पाठ मूल की अस्पष्टता को बनाए रखता है और वैवाहिक अर्थ को पादटिप्पणी में देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘विश्वासघात’ संबंधपरक तथा वाचागत बेवफाई दोनों को व्यक्त करता है। वाक्य में प्रत्यक्ष संबोधन और भविष्यद्वाणी-सूत्र की गंभीरता सुरक्षित रखी गई है।
