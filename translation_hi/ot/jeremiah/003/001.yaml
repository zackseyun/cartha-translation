source:
  edition: WLC
  text: לֵ/אמֹ֡ר הֵ֣ן יְשַׁלַּ֣ח אִ֣ישׁ אֶת אִשְׁתּ/וֹ֩ וְ/הָלְכָ֨ה מֵ/אִתּ֜/וֹ וְ/הָיְתָ֣ה לְ/אִישׁ אַחֵ֗ר הֲ/יָשׁ֤וּב אֵלֶ֨י/הָ֙ ע֔וֹד הֲ/ל֛וֹא חָנ֥וֹף תֶּחֱנַ֖ף הָ/אָ֣רֶץ הַ/הִ֑יא וְ/אַ֗תְּ זָנִית֙ רֵעִ֣ים רַבִּ֔ים וְ/שׁ֥וֹב אֵלַ֖/י נְאֻם יְהֹוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/001.yaml
  text: It is said[a], ‘If a man sends away his wife, and she goes from him and becomes another man’s, will he return to her again? Would not that land be utterly polluted? But you have prostituted yourself with many lovers[b], and would you return to me?’ declares Yahweh.
translation:
  language: hi
  text: कहा जाता है, “यदि कोई पुरुष अपनी पत्नी को त्याग दे, और वह उसके पास से चली जाए और किसी दूसरे पुरुष की पत्नी बन जाए,[b] तो क्या वह पुरुष फिर उसके पास लौटेगा? क्या वह भूमि पूरी तरह दूषित न हो जाएगी? पर तूने तो बहुत-से प्रेमियों के साथ व्यभिचार किया है; फिर क्या तू मेरे पास लौटेगी?”[a] याहवे की यह वाणी है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “फिर भी मेरे पास लौट आ।” अंतिम वाक्यांश को अलंकारिक प्रश्न के बजाय आज्ञार्थक निमंत्रण के रूप में भी समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: इब्रानी में शब्दशः, “किसी दूसरे पुरुष की हो जाए”; आशय है कि वह उसकी पत्नी बन जाए।
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵאמֹר
  choice: कहा जाता है
  rationale: यहाँ यह रूप कानूनी उदाहरण को उद्धरण-जैसे ढंग से प्रस्तुत करता है; निर्वैयक्तिक हिंदी अभिव्यक्ति उसके आरंभिक बल को स्वाभाविक रूप से व्यक्त करती है।
- source_word: הֵן
  choice: यदि
  rationale: यह शब्द यहाँ किसी बात पर ध्यान दिलाने से अधिक एक कानूनी परिकल्पना आरंभ करता है।
- source_word: יְשַׁלַּח ... אֶת אִשְׁתּוֹ
  choice: अपनी पत्नी को त्याग दे
  rationale: वैवाहिक प्रसंग में क्रिया पत्नी को विदा कर देने, अर्थात तलाक देने, का संकेत करती है; ‘त्याग दे’ मूल की गति और संबंध-विच्छेद दोनों को संक्षेप में रखता है।
- source_word: וְהָלְכָה מֵאִתּוֹ
  choice: वह उसके पास से चली जाए
  rationale: यह मूल पाठ की गति-सूचक भाषा को सहज आधुनिक हिंदी में बनाए रखता है।
- source_word: וְהָיְתָה לְאִישׁ אַחֵר
  choice: किसी दूसरे पुरुष की पत्नी बन जाए
  rationale: इब्रानी अभिव्यक्ति शब्दशः कुछ संक्षिप्त है, पर वैवाहिक संदर्भ में उसका स्वाभाविक अर्थ दूसरे पुरुष की पत्नी बनना है।
- source_word: הֲיָשׁוּב אֵלֶיהָ עוֹד
  choice: क्या वह पुरुष फिर उसके पास लौटेगा?
  rationale: प्रश्न अलंकारिक और कानूनी स्वर वाला है; कर्ता को दोबारा स्पष्ट करने से हिंदी में संदर्भ अस्पष्ट नहीं होता।
- source_word: הֲלוֹא חָנוֹף תֶּחֱנַף הָאָרֶץ הַהִיא
  choice: क्या वह भूमि पूरी तरह दूषित न हो जाएगी?
  rationale: अनंत क्रिया और सीमित क्रिया की पुनरुक्ति तीव्रता व्यक्त करती है; ‘पूरी तरह दूषित’ अपवित्रता के इस बल को सहज हिंदी में देता है।
- source_word: וְאַתְּ זָנִית
  choice: पर तूने तो ... वेश्यावृत्ति की है
  rationale: यह भविष्यद्वक्ताओं में वाचा के प्रति बेवफाई का तीखा यौन रूपक है; अनौपचारिक या पुरातन गाली के बिना उसकी कठोरता बनाए रखी गई है।
- source_word: רֵעִים רַבִּים
  choice: बहुत-से प्रेमियों के साथ
  rationale: रֵעִים सामान्यतः साथियों या मित्रों को कह सकता है, किंतु इस यौन रूपक में ‘प्रेमियों’ से आशय स्पष्ट होता है।
- source_word: וְשׁוֹב אֵלַי
  choice: फिर क्या तू मेरे पास लौटेगी?
  rationale: तात्कालिक संदर्भ के अलंकारिक प्रश्नों की शृंखला में इसे विस्मय और आरोप से भरे प्रश्न के रूप में पढ़ा गया है; आज्ञार्थक संभावना पादटिप्पणी में सुरक्षित है।
- source_word: נְאֻם יְהוָה
  choice: याहवे की यह वाणी है
  rationale: यह गंभीर भविष्यद्वाणी-सूत्र को स्वाभाविक और प्रतिष्ठित हिंदी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: दिव्य नाम को उपाधि से बदलने के बजाय उसका प्रचलित हिंदी लिप्यंतरण दिया गया है।
theological_decisions:
- issue: וְשׁוֹב אֵלַי को आज्ञार्थक निमंत्रण मानें या अलंकारिक प्रश्न
  choice: 'अलंकारिक प्रश्न: “फिर क्या तू मेरे पास लौटेगी?”'
  alternative: 'आज्ञार्थक निमंत्रण: “फिर भी मेरे पास लौट आ।”'
  rationale: इससे व्यवस्थाविवरण-सदृश वैवाहिक उदाहरण से निकलने वाले प्रश्नों की शृंखला और आरोप की तीक्ष्णता बनी रहती है। फिर भी व्याकरण और व्याख्या में आज्ञार्थक पाठ संभव है, जो अनुग्रहपूर्ण बुलाहट का आशय दे सकता है; इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। परमेश्वर द्वारा स्त्रीरूप में संबोधित समुदाय के लिए ‘तू’ और स्त्रीलिंग क्रियाओं का प्रयोग मूल रूपक की निकटता और तीक्ष्णता बनाए रखता है। कानूनी परिकल्पना, भूमि की अशुद्धि और वैवाहिक/यौन रूपक को नरम नहीं किया गया है। पादटिप्पणी-चिह्न उसी संबंधित वाक्यांश पर लगाए गए हैं, भले ही परामर्श-पाठ में उनकी स्थिति विस्थापित थी।
