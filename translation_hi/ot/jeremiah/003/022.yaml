source:
  edition: WLC
  text: שׁ֚וּבוּ בָּנִ֣ים שׁוֹבָבִ֔ים אֶרְפָּ֖ה מְשׁוּבֹֽתֵי/כֶ֑ם הִנְ/נוּ֙ אָתָ֣נוּ לָ֔/ךְ כִּ֥י אַתָּ֖ה יְהֹוָ֥ה אֱלֹהֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/022.yaml
  text: Return[a], O backsliding children; I will heal your backslidings. Behold, we come to you[b], for you are Yahweh our God.
translation:
  language: hi
  text: '“लौट आओ, हे भटके हुए पुत्रों[a]; मैं तुम्हारे भटकाव को चंगा कर दूँगा।”


    “देखो, हम तेरे पास आए हैं[b], क्योंकि तू याहवे, हमारा परमेश्वर है।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘भटके हुए पुत्रों’ का अनुवाद ‘विमुख पुत्रों’ या ‘विश्वास से हटे हुए बच्चों’ भी हो सकता है। हिब्रू में ‘लौटना’, ‘भटका हुआ’ और ‘भटकाव’ आपस में जुड़े शब्द हैं, जिससे मुड़ जाने और फिर लौट आने की ध्वनि बनती है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक भाव: ‘देखो, हम यहाँ हैं; हम तेरे पास आए हैं।’ यह लोगों का तत्पर उत्तर है।'
    reason: source_clarity
lexical_decisions:
- source_word: שׁוּבוּ
  choice: लौट आओ
  rationale: बहुवचन आज्ञार्थक क्रिया परमेश्वर के पास संबंधात्मक और वाचागत वापसी का आह्वान करती है; ‘लौट आओ’ इसे केवल मन के पश्चाताप तक सीमित नहीं करता।
- source_word: בָּנִים שׁוֹבָבִים
  choice: भटके हुए पुत्रो
  rationale: בָּנִים का पुल्लिंग रूप ‘पुत्रो’ में सुरक्षित है, जबकि שׁוֹבָבִים उन लोगों को बताता है जो सही संबंध और मार्ग से मुड़ गए हैं। संबोधन पूरे वाचा-समुदाय के लिए है।
- source_word: אֶרְפָּה
  choice: मैं ... चंगा कर दूँगा
  rationale: רפא का ठोस ‘चंगा करना’ रूपक नैतिक और आत्मिक पुनर्स्थापना को बिना व्याख्यात्मक रूप से सपाट किए बनाए रखता है।
- source_word: מְשׁוּבֹתֵיכֶם
  choice: तुम्हारे भटकाव
  rationale: यह शब्द שוב/שובב के उसी मूल-विचार से जुड़ा है और विमुख होने की दशा अथवा उसके प्रकट रूपों को दर्शाता है। हिंदी में ‘भटकाव’ स्वाभाविक सामूहिक संज्ञा है।
- source_word: הִנְנוּ אָתָנוּ לָךְ
  choice: देख, हम तेरे पास आ गए हैं
  rationale: הִנְנוּ उत्तर की तत्परता और उपस्थिति प्रकट करता है, और पूर्ण क्रिया אָתָנוּ परमेश्वर की ओर आ चुकने को बताती है। संयुक्त हिंदी वाक्यांश दोनों बातों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יְהֹוָה
  choice: याहवे
  rationale: मूल पाठ में आए वाचा-नाम को उपाधि से बदलने के बजाय हिंदी में सीधे लिप्यंतरित किया गया है।
- source_word: אֱלֹהֵינוּ
  choice: हमारा परमेश्वर
  rationale: प्रथम पुरुष बहुवचन प्रत्यय सहित यह प्रचलित वाचागत अभिव्यक्ति है।
theological_decisions:
- issue: वाचा-नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पद सीधे चार-अक्षरीय परमेश्वर-नाम का प्रयोग करता है। ‘याहवे’ उसे एक सामान्य उपाधि में बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: בָּנִים का लिंग और सामूहिक संदर्भ
  choice: पुत्रो
  alternative: सन्तानो; बच्चो
  rationale: हिब्रू शब्द व्याकरणतः पुल्लिंग बहुवचन है, इसलिए उसका रूप सुरक्षित रखा गया है; फिर भी संदर्भ में संबोधन समूचे वाचा-समुदाय से है।
- issue: भटकाव को चंगा करने का रूपक
  choice: चंगा कर दूँगा
  alternative: दूर कर दूँगा; सुधार दूँगा
  rationale: मूल का उपचार-संबंधी रूपक परमेश्वर की पुनर्स्थापना को प्रकट करता है और भटकाव की नैतिक गंभीरता तथा उपचार की प्रतिज्ञा—दोनों को साथ रखता है।
translation_notes:
  register: भाषा आधुनिक, dignified और बोलने-सुनने में स्वाभाविक रखी गई है। परमेश्वर तथा सामूहिक इस्राएल के बीच प्रत्यक्ष संवाद होने के कारण एकवचन ‘तेरे/तू’ रखा गया है। ‘चंगा करना’ मूल रूपक को सुरक्षित रखता है, जबकि ‘भटकाव’ हिंदी में अस्वाभाविक बहुवचन से बचते हुए हिब्रू की सामूहिक बहुवचन धारणा व्यक्त करता है।
