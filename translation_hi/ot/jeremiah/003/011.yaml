reference: Jeremiah 3:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֵלַ֔/י צִדְּקָ֥ה נַפְשָׁ֖/הּ מְשֻׁבָ֣ה יִשְׂרָאֵ֑ל מִ/בֹּגֵדָ֖ה יְהוּדָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/011.yaml
  text: And Yahweh said to me[a], “Faithless Israel has shown herself more righteous than treacherous Judah.”
translation:
  language: hi
  text: यहोवा ने मुझसे कहा, “भटकी हुई इस्राएल ने विश्वासघाती यहूदा की अपेक्षा अपने को अधिक धर्मी सिद्ध किया है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... कहा
  rationale: कथात्मक वय्यिक्तोल को प्रसंगानुकूल स्वाभाविक हिन्दी में ‘तब ... कहा’ किया गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के वाचा-संबंधी व्यक्तिगत नाम को हिन्दी में प्रचलित रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: אֵלַי
  choice: मुझसे
  rationale: बोलने के क्रियापद के साथ आधुनिक हिन्दी में ‘मुझसे कहा’ स्वाभाविक है।
- source_word: צִדְּקָה נַפְשָׁהּ
  choice: अपने आपको ... अधिक धर्मी ठहराया है
  rationale: इब्रानी मुहावरे में निहित आत्मवाचक भाव और तुलनात्मक संदर्भ दोनों को सुरक्षित रखता है; यह निरपेक्ष निर्दोषता नहीं, यहूदा की तुलना में सापेक्ष धार्मिकता बताता है।
- source_word: מְשֻׁבָה
  choice: विश्वासघाती
  rationale: यह शब्द मुड़ जाने और वाचा-संबंधी निष्ठा त्यागने का भाव रखता है। ‘विश्वासघाती’ आधुनिक पाठक के लिए स्पष्ट है और स्त्रीलिंग रूप में व्यक्तित्व दिए गए इस्राएल से मेल खाता है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: राष्ट्रीय नाम का हिन्दी में स्थापित लिप्यंतरण।
- source_word: מִבֹּגֵדָה
  choice: कपटी ... से
  rationale: तुलनात्मक מִן को ‘से अधिक’ की संरचना में रखा गया है; בגד सक्रिय छल और संबंध-विरोधी दगा को सूचित करता है, जिसे ‘कपटी’ संक्षेप में व्यक्त करता है।
- source_word: יְהוּדָה
  choice: यहूदा
  rationale: दक्षिणी राज्य के नाम का हिन्दी में स्थापित लिप्यंतरण; संदर्भ में इसे स्त्री के रूप में व्यक्तित्व दिया गया है।
theological_decisions:
- issue: इस्राएल और यहूदा की सापेक्ष धार्मिकता
  choice: इस्राएल ने अपने आपको यहूदा से अधिक धर्मी ठहराया है
  alternative: इस्राएल यहूदा की तुलना में अधिक सही सिद्ध हुई है
  rationale: तुलनात्मक संरचना दोनों दोषी समुदायों के बीच चौंकाने वाला सापेक्ष निर्णय देती है। अनुवाद इस्राएल को परमेश्वर के सामने निरपेक्ष रूप से निर्दोष घोषित नहीं करता, पर मूल की धार्मिक तनावपूर्ण भाषा को बनाए रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘धर्मी ठहराया’ बाइबिलीय अर्थ-क्षेत्र को बनाए रखता है, जबकि ‘अपने आपको’ मूल के आत्मवाचक भाव को स्पष्ट करता है।
