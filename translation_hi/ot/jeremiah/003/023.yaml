source:
  edition: WLC
  text: אָכֵ֥ן לַ/שֶּׁ֛קֶר מִ/גְּבָע֖וֹת הָמ֣וֹן הָרִ֑ים אָכֵן֙ בַּ/יהֹוָ֣ה אֱלֹהֵ֔י/נוּ תְּשׁוּעַ֖ת יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/023.yaml
  text: Surely[a], from the hills comes only falsehood, the tumult on the mountains; surely in Yahweh our God is the salvation of Israel.
translation:
  language: hi
  text: निश्चय ही पहाड़ियों से तो केवल झूठ ही मिलता है, पहाड़ों का कोलाहल भी; निश्चय ही हमारे परमेश्वर यहोवा में इस्राएल का उद्धार है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָכֵן
  choice: निश्चय ही
  rationale: यह बलपूर्ण स्वीकारोक्ति सूचक अव्यय है; दोनों occurrences में एक ही रूप रखने से पद का विरोधात्मक ढाँचा बना रहता है।
- source_word: לַשֶּׁקֶר
  choice: झूठी है
  rationale: שֶׁקֶר का मूल अर्थ झूठ/मिथ्यापन है। संक्षिप्त इब्रानी वाक्य में पहाड़ियों से अपेक्षित सहायता के मिथ्या सिद्ध होने का भाव है; हिंदी में विधेय रूप स्वाभाविक है।
- source_word: מִגְּבָעוֹת
  choice: पहाड़ियों से
  rationale: मूल स्रोत-चित्र को बनाए रखता है और यिर्मयाह के संदर्भ में ऊँचे पूजा-स्थलों की अंतर्ध्वनि को बिना स्पष्ट रूप से जोड़े रहने देता है।
- source_word: הָמוֹן הָרִים
  choice: पहाड़ों का कोलाहल
  rationale: הָמוֹן के शोर, हलचल या भीड़ जैसे अर्थों में से 'कोलाहल' पर्वतीय उपासना की संभावित हलचल को व्यक्त करता है, पर संकुचित इब्रानी की अस्पष्टता के लिए पादटिप्पणी दी गई है।
- source_word: בַּיהוָה
  choice: यहोवा में ही
  rationale: בְּ को उद्धार के वास्तविक आधार/स्रोत के रूप में व्यक्त करता है; 'ही' पहाड़ियों की मिथ्या आशा के साथ निहित विरोध स्पष्ट करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुर्वर्णीय ईश्वरीय नाम को हिंदी में प्रचलित व्यक्तिगत नाम 'यहोवा' से प्रस्तुत किया गया है, किसी उपाधि से नहीं।
- source_word: אֱלֹהֵינוּ
  choice: हमारे परमेश्वर
  rationale: वाचा-संबंधी सामूहिक स्वीकारोक्ति को सीधे और गरिमापूर्ण ढंग से रखता है।
- source_word: תְּשׁוּעַת יִשְׂרָאֵל
  choice: इस्राएल का उद्धार
  rationale: रचना-संबंध को निकटता से बनाए रखता है; 'उद्धार' यहाँ बचाव/छुटकारे के व्यापक अर्थ को वहन करता है।
theological_decisions:
- issue: पहाड़ियों और पहाड़ों से जुड़ी मिथ्या आशा बनाम यहोवा में सच्चा उद्धार
  choice: पहाड़ियों से अपेक्षित सहायता को झूठा और यहोवा को इस्राएल के उद्धार का वास्तविक आधार बताया गया है।
  alternative: הָמוֹן הָרִים को अधिक शाब्दिक रूप में 'पहाड़ों की भीड़/बहुलता' समझा जा सकता है।
  rationale: यिर्मयाह के व्यापक संदर्भ में पहाड़ियाँ और पर्वत धर्मत्यागी उपासना से जुड़े हैं। फिर भी मूल पद में 'मूर्तियाँ' या 'ऊँचे पूजा-स्थान' नहीं जोड़े गए, जिससे अंतर्ध्वनि और अस्पष्टता सुरक्षित रहती है।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। इब्रानी की संक्षिप्तता को समझने योग्य बनाने के लिए 'मिलनेवाली सहायता' निहितार्थ के रूप में जोड़ा गया है; सांप्रदायिक शब्दावली से बचा गया है।
