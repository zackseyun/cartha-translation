source:
  edition: WLC
  text: שׁ֣וּבוּ בָנִ֤ים שׁוֹבָבִים֙ נְאֻם יְהוָ֔ה כִּ֥י אָנֹכִ֖י בָּעַ֣לְתִּי בָ/כֶ֑ם וְ/לָקַחְתִּ֨י אֶתְ/כֶ֜ם אֶחָ֣ד מֵ/עִ֗יר וּ/שְׁנַ֨יִם֙ מִ/מִּשְׁפָּחָ֔ה וְ/הֵבֵאתִ֥י אֶתְ/כֶ֖ם צִיּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/014.yaml
  text: Return[a], O faithless children, declares Yahweh, for I am your master; and I will take you, one from a city and two from a clan, and I will bring you to Zion.
translation:
  language: hi
  text: “हे भटके हुए पुत्रो, लौट आओ,” यहोवा की यह घोषणा है, “क्योंकि मैं तुम्हारा स्वामी हूँ[a]। मैं तुम्हें—किसी नगर में से एक को और किसी कुल में से दो को—ले लूँगा, और तुम्हें सिय्योन ले आऊँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं तुम्हारा पति हूँ,” अथवा “मैंने तुमसे विवाह किया है।” इब्रानी क्रिया प्रभुत्व और वैवाहिक संबंध—दोनों का भाव व्यक्त कर सकती है।
    reason: alternative_reading
lexical_decisions:
- source_word: שׁוּבוּ
  choice: लौट आओ
  rationale: यह बहुवचन आज्ञार्थक रूप है और यहोवा तथा वाचा के संबंध की ओर वापस आने के आह्वान को व्यक्त करता है; ‘मन फिराओ’ की अपेक्षा मूल के संबंधात्मक और स्थानगत बिंब को अधिक सुरक्षित रखता है।
- source_word: בָנִים שׁוֹבָבִים
  choice: भटके हुए पुत्रो
  rationale: בָנִים का मूल अर्थ ‘पुत्र’ है, जबकि שׁוֹבָבִים मुड़ जाने, भटकने और विश्वासघाती होने का भाव रखता है। यह चयन संबोधन की पुल्लिंग बहुवचन संरचना और वाचा से विमुखता, दोनों को बनाए रखता है।
- source_word: נְאֻם יְהוָה
  choice: यहोवा की यह घोषणा है
  rationale: गंभीर भविष्यद्वाणी-सूत्र को स्वाभाविक और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में प्रयुक्त परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय प्रचलित हिन्दी लिप्यंतरण में रखा गया है।
- source_word: כִּי אָנֹכִי בָּעַלְתִּי בָכֶם
  choice: क्योंकि मैं तुम्हारा स्वामी हूँ
  rationale: בעל प्रभुत्व या स्वामित्व के साथ वैवाहिक संबंध भी व्यक्त कर सकता है। मुख्य पाठ में अधिकार का अर्थ रखा गया है और वैवाहिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: וְלָקַחְתִּי אֶתְכֶם
  choice: मैं तुम्हें ले आऊँगा
  rationale: आगे सिय्योन तक पहुँचाने के संदर्भ में हिन्दी का संयुक्त प्रयोग ‘ले आऊँगा’ संग्रह और पुनर्स्थापना की गति को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֶחָד מֵעִיר וּשְׁנַיִם מִמִּשְׁפָּחָה
  choice: किसी नगर में से एक को और किसी कुल में से दो को
  rationale: मूल में वितरण का भाव है, पर ‘हर’ स्पष्ट रूप से नहीं है। מִשְׁפָּחָה यहाँ केवल एकल परिवार नहीं, व्यापक संबंध-समूह या कुल का बोध कराता है।
- source_word: וְהֵבֵאתִי אֶתְכֶם צִיּוֹן
  choice: और तुम्हें सिय्योन ले आऊँगा
  rationale: गंतव्य की ओर लाने का सीधा अर्थ और सिय्योन नाम की धार्मिक-ऐतिहासिक प्रतिध्वनि सुरक्षित रहती है।
theological_decisions:
- issue: בָּעַלְתִּי में प्रभुत्व और वैवाहिक संबंध के अतिव्यापी अर्थ
  choice: मुख्य पाठ में ‘मैं तुम्हारा स्वामी हूँ’
  alternative: ‘मैं तुम्हारा पति हूँ’ अथवा ‘मैंने तुमसे विवाह किया है’
  rationale: तात्कालिक संबोधन ‘पुत्रो’ है, इसलिए मुख्य पाठ में वैवाहिक रूप हिन्दी में असहज हो सकता है; फिर भी पूरे अध्याय की विवाह-संबंधी वाचा-छवि के कारण वैकल्पिक अर्थ को पादटिप्पणी में रखा गया है, ताकि मूल की धार्मिक और अर्थगत तन्यता न मिटे।
translation_notes:
  register: आधुनिक मानक हिन्दी, प्रत्यक्ष संबोधन में गरिमापूर्ण किंतु सहज शैली। ‘पुत्रो’ मूल के पुल्लिंग बहुवचन को सुरक्षित रखता है; ‘कुल’ प्राचीन व्यापक संबंध-समूह को व्यक्त करता है। उद्धरण और विराम-चिह्न भविष्यद्वाणी की घोषणा तथा यहोवा के प्रत्यक्ष वचन को स्पष्ट करते हैं।
