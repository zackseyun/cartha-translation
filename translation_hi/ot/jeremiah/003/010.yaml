  edition: WLC
  text: וְ/גַם בְּ/כָל זֹ֗את לֹא שָׁ֨בָה אֵלַ֜/י בָּגוֹדָ֧ה אֲחוֹתָ֛/הּ יְהוּדָ֖ה בְּ/כָל לִבָּ֑/הּ כִּ֥י אִם בְּ/שֶׁ֖קֶר נְאֻם יְהוָֽה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/010.yaml
  text: Yet in spite of all this[a], faithless Judah, her sister did not return to me with all her heart, but only in falsehood[b], declares Yahweh.
translation:
  language: hi
  text: फिर भी, इन सब बातों के बावजूद[a], उसकी विश्वासघाती बहन यहूदा पूरे मन से मेरी ओर नहीं लौटी, बल्कि झूठे ढंग से ही लौटी[b]—याहवे की यह घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “इस सबके साथ भी”; अर्थात पिछले न्याय और चेतावनी के बावजूद।
    reason: मुहावरे के शाब्दिक रूप और उसके संदर्भगत रियायती अर्थ को दर्शाना।
  - marker: b
    text: या “असत्य में,” “झूठ के साथ,” अथवा “छल से”; आशय यह है कि यहूदा का लौटना पूरे मन से और निष्कपट नहीं था।
    reason: בְּשֶׁקֶר के निकटतर शब्दगत विकल्प और उसका संदर्भगत आशय देना।
lexical_decisions:
- source_word: וְגַם בְּכָל זֹאת
  choice: फिर भी, यह सब देखकर भी
  rationale: संयुक्त पदबंध पिछले न्याय और चेतावनी के बावजूद यहूदा की प्रतिक्रिया न होने का विरोधात्मक और रियायती भाव देता है। हिंदी में यह रूप स्वाभाविक है।
- source_word: שָׁבָה אֵלַי
  choice: मेरी ओर नहीं लौटी
  rationale: यह शारीरिक वापसी के साथ-साथ संबंधपरक और वाचागत लौटने का अर्थ खुला रखता है; पश्चात्ताप को व्याख्यात्मक रूप से पाठ में नहीं जोड़ा गया।
- source_word: בָּגוֹדָה
  choice: विश्वासघाती
  rationale: यह शब्द विश्वास तोड़ने और संबंध में दगा करने का भाव रखता है। 'विश्वासघाती' आधुनिक हिंदी में इस वाचागत बेवफाई को स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: אֲחוֹתָהּ יְהוּדָה
  choice: उसकी विश्वासघाती बहन यहूदा
  rationale: हिब्रू के स्त्रीलिंग पारिवारिक रूपक और यहूदा की समानाधिकरणात्मक पहचान को स्वाभाविक हिंदी क्रम में बनाए रखता है।
- source_word: בְּכָל לִבָּהּ
  choice: पूरे मन से
  rationale: यह समग्र निष्ठा और निष्कपटता का प्रचलित हिंदी मुहावरा है।
- source_word: כִּי אִם בְּשֶׁקֶר
  choice: बल्कि केवल दिखावे के लिए लौटी
  rationale: כִּי אִם पहले निषेध के बाद सीमित विरोध प्रस्तुत करता है और בְּשֶׁקֶר झूठे या निष्कपट न होने वाले ढंग को बताता है। क्रिया की पुनरावृत्ति हिंदी में आशय स्पष्ट करती है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: यह मानक भविष्यद्वाणी-सूत्र की गंभीरता बनाए रखता है और ईश्वरीय नाम को शीर्षक से नहीं बदलता।
theological_decisions:
- issue: यहूदा के 'लौटने' का वाचागत आशय
  choice: '''मेरी ओर लौटी'' रखा गया, जिसमें संबंध की बहाली और पश्चात्ताप निहित हो सकते हैं'
  alternative: '''मन फिराकर मेरे पास लौटी'''
  rationale: मूल क्रिया व्यापक है। चुना हुआ रूप वाचागत संदर्भ को बनाए रखता है, पर पाठ में स्पष्ट रूप से न दिए गए पश्चात्ताप को अनिवार्य व्याख्या नहीं बनाता।
- issue: यहूदा का बहन के रूप में स्त्रीलिंग मानवीकरण
  choice: '''उसकी ... बहन यहूदा'' के रूप में रूपक स्पष्ट रखा गया'
  alternative: केवल 'विश्वासघाती यहूदा' कहकर बहन का रूपक हटा देना
  rationale: आसपास के प्रसंग में यहूदा उत्तरी राज्य की बहन के रूप में मानवीकृत है; इसे बनाए रखना भविष्यद्वाणी की वाचागत बेवफाई वाली छवि के लिए आवश्यक है।
- issue: בְּשֶׁקֶר में वापसी की निष्कपटता
  choice: '''केवल दिखावे के लिए'''
  alternative: '''झूठे ढंग से'' / ''छल से'''
  rationale: यह रूप बाहरी वापसी और भीतरी निष्ठा के अभाव के तनाव को स्पष्ट करता है, बिना यह तय किए कि दिखावे का विशिष्ट ऐतिहासिक रूप क्या था।
translation_notes:
  register: आधुनिक मानक हिंदी, सहज किंतु गरिमापूर्ण भविष्यद्वाणी-शैली। 'याहवे' से ईश्वरीय नाम सुरक्षित रखा गया है। मुख्य वाक्य में स्त्रीलिंग राष्ट्र-रूपक स्पष्ट है; 'दिखावे के लिए लौटी' हिंदी में असत्य वापसी का अर्थ अधिक स्वाभाविक रूप से देता है।
