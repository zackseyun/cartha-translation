id: JER.3.6
reference: Jeremiah 3:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י בִּ/ימֵי֙ יֹאשִׁיָּ֣הוּ הַ/מֶּ֔לֶךְ הֲֽ/רָאִ֔יתָ אֲשֶׁ֥ר עָשְׂתָ֖ה מְשֻׁבָ֣ה יִשְׂרָאֵ֑ל הֹלְכָ֨ה הִ֜יא עַל כָּל הַ֣ר גָּבֹ֗הַּ וְ/אֶל תַּ֛חַת כָּל עֵ֥ץ רַעֲנָ֖ן וַ/תִּזְנִי שָֽׁם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/006.yaml
  text: And the LORD said to me in the days of King Josiah, “Have you seen what faithless Israel has done? She went up on every high hill and under every green tree, and there she prostituted herself.”
translation:
  language: hi
  text: राजा योशियाह के दिनों में यहोवा ने मुझसे कहा, “क्या तुमने देखा कि विश्वासघाती इस्राएल ने क्या किया है? वह हर ऊँचे पर्वत पर और हर हरे-भरे पेड़ के नीचे गई, और वहाँ उसने वेश्यावृत्ति की।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को प्रचलित और स्पष्ट हिन्दी रूप में रखा गया है।
- source_word: מְשֻׁבָה
  choice: विश्वासघाती
  rationale: यहाँ इस्राएल को संबोधित स्त्रीलिंग विशेषण उसके विमुख और बेवफ़ा आचरण को व्यक्त करता है; ‘विश्वासघाती’ रूपक और वाचा-संबंधी तनाव दोनों बनाए रखता है।
- source_word: הַר גָּבֹהַּ
  choice: ऊँची पहाड़ी
  rationale: शाब्दिक भौगोलिक चित्र बनाए रखते हुए यह वाक्यांश मूर्तिपूजक उपासना-स्थलों की ओर संकेत कर सकता है, पर अनुवाद संकेत को व्याख्या में नहीं बदलता।
- source_word: עֵץ רַעֲנָן
  choice: हरा-भरा पेड़
  rationale: रענן की सजीव, पत्तेदार हरियाली को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וַתִּזְנִי
  choice: उसने वेश्यावृत्ति की
  rationale: क्रिया के प्रबल यौन रूपक को नरम किए बिना रखा गया है; संदर्भ में यह धार्मिक/वाचा-संबंधी विश्वासघात का चित्र है।
theological_decisions:
- issue: इस्राएल के व्यभिचार का रूपक
  choice: ‘विश्वासघाती इस्राएल’ और ‘उसने वेश्यावृत्ति की’
  alternative: ‘भटकी हुई इस्राएल’ और ‘उसने व्यभिचार किया’
  rationale: हिब्रू पाठ इस्राएल को स्त्री के रूप में चित्रित कर उसकी बेवफ़ाई को वेश्यावृत्ति की तीखी भाषा में कहता है। अनुवाद इस रूपक को स्पष्ट रखता है और यह तय करके नहीं बताता कि प्रत्येक स्थल पर कौन-सा विशिष्ट अनुष्ठान हुआ।
- issue: ऊँची पहाड़ियों और हरे-भरे पेड़ों का आशय
  choice: चित्रात्मक भाषा का सीधा अनुवाद
  alternative: ‘हर मूर्तिपूजक पूजा-स्थान पर’ जैसी व्याख्यात्मक अभिव्यक्ति
  rationale: ऐतिहासिक संदर्भ मूर्तिपूजा की ओर संकेत करता है, किंतु मूल पाठ स्वयं स्थल-चित्र देता है; इसलिए निहितार्थ को मुख्य पाठ में विस्तार देकर सीमित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। स्त्रीलिंग सर्वनाम और क्रियाएँ इस्राएल के मूल रूपक को बनाए रखती हैं।
