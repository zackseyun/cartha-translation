  text: וָ/אֹמַ֗ר אַחֲרֵ֨י עֲשׂוֹתָ֧/הּ אֶת כָּל אֵ֛לֶּה אֵלַ֥/י תָּשׁ֖וּב וְ/לֹא שָׁ֑בָה ו/תראה בָּגוֹדָ֥ה אֲחוֹתָ֖/הּ יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/007.yaml
  text: And I said[a], ‘After she had done all these things, she will return to me,’ but she did not return[c][b]; and her treacherous sister Judah saw it.
translation:
  language: hi
  text: तब मैंने कहा, “ये सब काम करने के बाद वह मेरे पास लौट आएगी[a],” पर वह नहीं लौटी[b]। उसकी विश्वासघाती[c] बहन यहूदा ने यह देखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वह मेरे पास लौटेगी,” अर्थात् ऐसा अपेक्षित था। इब्रानी अपूर्ण क्रिया भूतकाल के किसी बिंदु से अपेक्षित भविष्य को व्यक्त कर सकती है।
    reason: lexical_alternative
  - marker: b
    text: “लौटना” का अनुवाद “पलट आना” भी हो सकता है; वाचा के संदर्भ में इसमें “मन फिराने” का भाव भी है।
    reason: lexical_alternative
  - marker: c
    text: “विश्वासघाती” का अनुवाद “बेवफ़ा” भी हो सकता है। इब्रानी शब्द विश्वास तोड़ने या द्रोह करने पर बल देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: तब मैंने कहा
  rationale: वाव-परिवर्ती कथात्मक क्रम को स्वाभाविक हिन्दी में व्यक्त करता है; ‘तब’ प्रसंग की आगे बढ़ती हुई कथा को दिखाता है।
- source_word: אַחֲרֵי עֲשׂוֹתָהּ אֶת כָּל אֵלֶּה
  choice: ये सब काम करने के बाद
  rationale: पूर्वसर्ग और प्रत्यययुक्त infinitive construct को सहज कालवाचक हिन्दी उपवाक्य में व्यक्त किया गया है।
- source_word: אֵלַי תָּשׁוּב
  choice: वह मेरे पास लौट आएगी
  rationale: שׁוּב के लौटने तथा वाचा-संबंधी मन-फिराव, दोनों संकेतों को ‘लौट’ सुरक्षित रखता है; अपूर्ण क्रिया भूतकालीन दृष्टिबिंदु से अपेक्षित भविष्य बताती है।
- source_word: וְלֹא שָׁבָה
  choice: पर वह नहीं लौटी
  rationale: विरोध को ‘पर’ से और उसी धातु की पुनरावृत्ति को ‘लौटी’ से बनाए रखा गया है।
- source_word: וַתֵּרֶא
  choice: ने यह देखा
  rationale: ראה का सीधा अर्थ ‘देखना’ है; हिन्दी में ‘यह’ पिछले पूरे घटनाक्रम को स्वाभाविक ढंग से संदर्भित करता है।
- source_word: בָּגוֹדָה
  choice: विश्वासघाती
  rationale: यह शब्द केवल अविश्वास नहीं, बल्कि संबंध और वाचा के प्रति द्रोह का भाव भी रखता है; ‘विश्वासघाती’ आधुनिक हिन्दी में उस तीखे अर्थ को संप्रेषित करता है।
- source_word: אֲחוֹתָהּ יְהוּדָה
  choice: उसकी ... बहन यहूदा
  rationale: इस्राएल और यहूदा के बीच भविष्यद्वक्ताई पारिवारिक रूपक को स्पष्टतः बनाए रखता है।
theological_decisions:
- issue: שׁוּב का वाचा-संबंधी अर्थ
  choice: लौट आएगी / लौटी
  alternative: पलट आएगी; मन फिराएगी
  rationale: ‘लौटना’ स्थानगत वापसी और परमेश्वर की ओर वाचा-संबंधी वापसी, दोनों अर्थों की तनावपूर्ण व्यापकता को बनाए रखता है; ‘मन फिराना’ अर्थ को केवल पश्चात्ताप तक सीमित कर सकता है।
- issue: यहूदा के लिए בָּגוֹדָה का चरित्रांकन
  choice: विश्वासघाती बहन यहूदा
  alternative: बेवफ़ा बहन यहूदा; दग़ाबाज़ बहन यहूदा
  rationale: ‘विश्वासघाती’ वाचा के उल्लंघन और संबंधपरक द्रोह की तीव्रता को गरिमापूर्ण, सामान्य आधुनिक हिन्दी में सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण रखी गई है। मुख्य वाक्य में भविष्यद्वाणी की पारिवारिक उपमा, लौटने की वाचा-संबंधी बहुअर्थता और यहूदा के विश्वासघात की तीक्ष्णता सुरक्षित है।
