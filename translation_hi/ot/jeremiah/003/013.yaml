id: JER.3.13
reference: Jeremiah 3:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אַ֚ךְ דְּעִ֣י עֲוֺנֵ֔/ךְ כִּ֛י בַּ/יהוָ֥ה אֱלֹהַ֖יִ/ךְ פָּשָׁ֑עַתְּ וַ/תְּפַזְּרִ֨י אֶת דְּרָכַ֜יִ/ךְ לַ/זָּרִ֗ים תַּ֚חַת כָּל עֵ֣ץ רַעֲנָ֔ן וּ/בְ/קוֹלִ֥/י לֹא שְׁמַעְתֶּ֖ם נְאֻם יְהֹוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/013.yaml
  text: Only acknowledge your guilt[a], that you have rebelled against Yahweh your God and scattered your ways among strangers under every green tree, and you have not obeyed my voice[b], declares Yahweh.
translation:
  language: hi
  text: 'बस अपना अपराध स्वीकार कर: तूने अपने परमेश्वर यहवे से विद्रोह किया है; हर हरे-भरे पेड़ के नीचे तूने अपने मार्गों को परायों[a] की ओर फैला दिया है[b], और तुमने मेरी बात नहीं मानी—यहवे की घोषणा है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पराए देवताओं की ओर।” हिब्रू में केवल “परायों” कहा गया है। प्रसंग व्यभिचार और मूर्तिपूजा के रूपक से जुड़ा है, पर “देवताओं” शब्द स्पष्ट रूप से नहीं आया।
    reason: alternative_reading
  - marker: b
    text: “हर हरे-भरे पेड़ के नीचे” अनुचित उपासना के स्थानों के लिए बार-बार प्रयुक्त होने वाला वाक्यांश है।
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: बस
  rationale: यह सीमित करने वाला बल व्यक्त करता है—इस समय अपेक्षित बात अपराध को स्वीकार करना है।
- source_word: דְּעִי עֲוֺנֵךְ
  choice: अपना अपराध मान ले
  rationale: דְּעִי का मूल अर्थ ‘जान’ है, पर अपराध के साथ इसका आशय उसे पहचानना और स्वीकार करना है। ‘अपराध’ עָוֹן की नैतिक गंभीरता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: פָּשָׁעַתְּ בַּיהוָה אֱלֹהַיִךְ
  choice: तूने अपने परमेश्वर यहवे से विद्रोह किया है
  rationale: פשע अधिकार और वाचा के विरुद्ध विद्रोह का बोध देता है; ईश्वरीय नाम को ‘यहवे’ के रूप में रखा गया है।
- source_word: וַתְּפַזְּרִי אֶת דְּרָכַיִךְ לַזָּרִים
  choice: तूने परायों की ओर अपने मार्ग बिखेर दिए हैं
  rationale: यह हिन्दी में असामान्य किंतु समझ में आने वाला रूपक है, जो ‘मार्ग बिखेरने’ और ‘परायों’—दोनों हिब्रू छवियों को बिना ‘देवताओं’ को मुख्य पाठ में जोड़ने के सुरक्षित रखता है।
- source_word: תַּחַת כָּל עֵץ רַעֲנָן
  choice: हर हरे-भरे पेड़ के नीचे
  rationale: רַעֲנָן पत्तों से भरे, फलते-फूलते या हरे वृक्ष को दर्शाता है; यह वाक्यांश अनुचित उपासना-स्थलों के लिए बार-बार आता है।
- source_word: וּבְקוֹלִי לֹא שְׁמַעְתֶּם
  choice: और तुम लोगों ने मेरी बात नहीं मानी
  rationale: ‘आवाज़ सुनना’ यहाँ आज्ञापालन का अर्थ रखता है। ‘तुम लोगों ने’ हिब्रू में स्त्रीलिंग एकवचन संबोधन से बहुवचन में अचानक हुए परिवर्तन को सुरक्षित रखता है।
- source_word: נְאֻם יְהוָה
  choice: यहवे की यह घोषणा है
  rationale: यह भविष्यद्वाणी का औपचारिक संदेश-सूत्र है; हिन्दी में गरिमामय और स्पष्ट रूप चुना गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का विशिष्ट नाम सीधे आया है; लिप्यंतरण उसे सामान्य उपाधि में बदलने से बचाता है।
- issue: לַזָּרִים में मूर्तिपूजा को स्पष्ट करना
  choice: परायों की ओर
  alternative: पराए देवताओं की ओर
  rationale: संदर्भ व्यभिचार और मूर्तिपूजा के मिले-जुले रूपक की ओर संकेत करता है, पर हिब्रू में ‘देवताओं’ शब्द नहीं है। मुख्य पाठ वास्तविक अस्पष्टता बनाए रखता है।
- issue: अंतिम क्रिया में वचन-परिवर्तन
  choice: तुम लोगों ने
  alternative: तूने
  rationale: पद के अधिकांश भाग में स्त्रीलिंग एकवचन है, किंतु שְׁמַעְתֶּם पुल्लिंग बहुवचन है। इसे समतल करने के बजाय हिन्दी में दृश्यमान रखा गया है।
translation_notes:
  register: आधुनिक, गरिमामय और सीधे संबोधन वाली हिन्दी। स्त्रीलिंग एकवचन ‘तू’ इस्राएल/यहूदा को स्त्री के रूप में संबोधित करने वाली मूल छवि रखता है; अंतिम ‘तुम लोगों ने’ मूल के आकस्मिक बहुवचन को जानबूझकर सुरक्षित रखता है।
