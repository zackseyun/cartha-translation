id: JER.3.5
reference: Jeremiah 3:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הֲ/יִנְטֹ֣ר לְ/עוֹלָ֔ם אִם יִשְׁמֹ֖ר לָ/נֶ֑צַח הִנֵּ֥ה דברתי וַ/תַּעֲשִׂ֥י הָ/רָע֖וֹת וַ/תּוּכָֽל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/005.yaml
  text: Will he be angry forever? Will he keep it to the end? Look[a], you have spoken, and you have done evil things[c][b], and you have prevailed.
translation:
  language: hi
  text: क्या वह सदा क्रोध बनाए रखेगा? क्या वह उसे हमेशा सँभालकर रखेगा?[a] देख, तूने कहा है[b], और बुराइयाँ की हैं, और तू सफल रही है।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “क्या वह सदा क्रोध को संजोए रखेगा? क्या वह उसे निरन्तर सँभाले रखेगा?”'
    reason: lexical_alternative
  - marker: b
    text: हिब्रू व्यंजन-पाठ को “मैंने कहा है” भी पढ़ा जा सकता है; पर प्रसंग यहूदा की कही बातों को संबोधित करने के पक्ष में है।
    reason: textual_variant
  - marker: c
    text: या, “और तू समर्थ थी” अथवा “और तू प्रबल हुई”; आशय यह हो सकता है कि तू बुराई करते रहने में सफल रही।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיִנְטֹר לְעוֹלָם
  choice: क्या वह सदा क्रोध रखे रहेगा?
  rationale: נטר का मूल भाव क्रोध या वैर को पकड़े रखना है। ‘क्रोध रखे रहेगा’ इस बिंब को बचाते हुए आधुनिक हिन्दी में स्वाभाविक है; לְעוֹלָם के लिए ‘सदा’ प्रश्न की दीर्घकालिकता व्यक्त करता है।
- source_word: אִם יִשְׁמֹר לָנֶצַח
  choice: क्या वह उसे हमेशा बनाए रखेगा?
  rationale: שׁמר का अर्थ रखना/सँभालना है और उसका निहित कर्म पहले खंड का क्रोध है। दूसरा स्वतंत्र प्रश्न हिन्दी में समानांतर अलंकार को बनाए रखता है।
- source_word: הִנֵּה
  choice: देख
  rationale: यह ध्यान आकर्षित करने वाला संवाद-सूचक है। ‘देख’ सीधा, वर्तमान और इस स्त्रीलिंग एकवचन संबोधन के अनुकूल है।
- source_word: דברתי
  choice: तूने ये बातें कही हैं
  rationale: संदर्भ में यह यहूदा द्वारा पिछले पद में कही गई बातों की ओर संकेत करता है। ‘ये बातें’ निहित संदर्भ स्पष्ट करता है, जबकि व्यंजन-पाठ से संभव प्रथम पुरुष पाठ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וַתַּעֲשִׂי הָרָעוֹת
  choice: और बुरे काम किए हैं
  rationale: बहुवचन הָרָעוֹת ठोस बुरे कर्मों को सूचित करता है। सरल ‘और’ हिब्रू संयोजक को बिना अनावश्यक विरोधार्थक अर्थ जोड़े प्रस्तुत करता है।
- source_word: וַתּוּכָל
  choice: और तू अपनी मनमानी में सफल रही है
  rationale: יכל में समर्थ होने या सफल/प्रबल होने का भाव है। संदर्भ में यह बुराई करते रहने में यहूदा की सफल जिद को सूचित करता है; अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: आरोप वाले अंतिम वाक्य में वक्ता और संबोधित व्यक्ति
  choice: 'अंतिम तीनों क्रियाएँ यहूदा को स्त्रीलिंग एकवचन में संबोधित करती हैं: ‘तूने ... कही’, ‘काम किए’, ‘सफल रही’।'
  alternative: व्यंजन-पाठ דברתי को ‘मैंने कहा है’ पढ़ना।
  rationale: आसपास का प्रसंग यहूदा की कही बातों और उसके विपरीत कर्मों पर सीधा आरोप लगाता है। फिर भी व्यंजन-पाठ की वास्तविक अस्पष्टता को पादटिप्पणी में रखा गया है, उसे सिद्धान्तगत रूप से समाप्त नहीं किया गया।
- issue: וַתּוּכָל में सफलता का नैतिक अर्थ
  choice: इसे बुराई में अपनी मनमानी सफलतापूर्वक चलाने के व्यंग्यात्मक आरोप के रूप में व्यक्त किया गया है।
  alternative: ‘और तू समर्थ थी’ या ‘और तू प्रबल हुई’।
  rationale: मूल क्रिया सफलता/सामर्थ्य दोनों व्यक्त कर सकती है। मुख्य पाठ प्रसंगगत अर्थ को स्वाभाविक हिन्दी में देता है, जबकि पादटिप्पणी शाब्दिक विस्तार बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सीधा भविष्यद्वक्तीय संबोधन रखा गया है। यहूदा को स्त्रीलिंग एकवचन ‘तू’ कहना हिब्रू की स्त्रीलिंग क्रियाओं और निकट, आरोपात्मक वाणी को दर्शाता है। ‘क्रोध रखे रहना’ और ‘अपनी मनमानी में सफल रहना’ सामान्य पाठक के लिए बोधगम्य हैं, जबकि शाब्दिक और पाठगत विकल्प पादटिप्पणियों में सुरक्षित हैं।
