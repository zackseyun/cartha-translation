  text: הָלֹ֡ךְ וְ/קָֽרָאתָ֩ אֶת הַ/דְּבָרִ֨ים הָ/אֵ֜לֶּה צָפ֗וֹנָ/ה וְ֠/אָמַרְתָּ שׁ֣וּבָ/ה מְשֻׁבָ֤ה יִשְׂרָאֵל֙ נְאֻם יְהוָ֔ה לֽוֹא אַפִּ֥יל פָּנַ֖/י בָּ/כֶ֑ם כִּֽי חָסִ֤יד אֲנִי֙ נְאֻם יְהוָ֔ה לֹ֥א אֶטּ֖וֹר לְ/עוֹלָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/012.yaml
  text: 'Go and proclaim these words toward the north[a], and say: Return, faithless Israel, declares Yahweh. I will not look on you in anger, for I am faithful, declares Yahweh; I will not stay angry forever.'
translation:
  language: hi
  text: 'जा और उत्तर दिशा की ओर इन बातों की घोषणा कर और कह: “हे विश्वासघाती इस्राएल, लौट आ,” यहोवा की यह वाणी है। “मैं तुम पर क्रोध भरी दृष्टि नहीं डालूँगा, क्योंकि मैं निष्ठावान[a] हूँ,” यहोवा की यह वाणी है; “मैं सदा क्रोध नहीं रखूँगा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दयालु।” इब्रानी शब्द वाचा की निष्ठा, कृपा या दया का भाव व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלֹךְ וְקָרָאתָ
  choice: जा और ... घोषणा कर
  rationale: आज्ञार्थक बल और भविष्यद्वक्ताई सार्वजनिक उद्घोषणा—दोनों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: צָפוֹנָה
  choice: उत्तर दिशा की ओर
  rationale: दिशासूचक रूप का बल बनाए रखता है; सम्भवतः निर्वासित उत्तरी इस्राएल की दिशा अभिप्रेत है।
- source_word: שׁוּבָה מְשֻׁבָה יִשְׂרָאֵל
  choice: हे विश्वासघाती इस्राएल, लौट आ
  rationale: שׁוב की लौटने की स्थानिक और वाचा-संबंधी दोनों प्रतिध्वनियां रखता है; מְשֻׁבָה इस्राएल की वाचा-विमुखता दर्शाता है।
- source_word: לֹא אַפִּיל פָּנַי בָּכֶם
  choice: मैं क्रोध से तुम पर दृष्टि नहीं करूंगा
  rationale: शाब्दिक मुख-संबंधी मुहावरे को अस्पष्ट बनाए बिना उसके क्रोधपूर्ण दृष्टि के आशय को व्यक्त करता है।
- source_word: חָסִיד אֲנִי
  choice: मैं निष्ठावान हूं
  rationale: חסד से जुड़े वाचा-निष्ठा के अर्थ को प्रमुखता देता है; ‘दयालु’ सम्भव अर्थ है और पादटिप्पणी में सुरक्षित है।
- source_word: לֹא אֶטּוֹר לְעוֹלָם
  choice: मैं सदा क्रोध नहीं रखूंगा
  rationale: נטר के क्रोध या रोष को पकड़े रखने के मुहावरेदार अर्थ को संक्षिप्त और स्वाभाविक हिन्दी में देता है।
- source_word: נְאֻם יְהוָה
  choice: यहोवा की यह वाणी है
  rationale: गम्भीर भविष्यद्वक्ताई सूत्र को सुरक्षित रखते हुए परमेश्वर के व्यक्तिगत वाचा-नाम को प्रत्यक्ष रूप से प्रस्तुत करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में आए विशिष्ट वाचा-नाम को सामान्य उपाधि में बदलने के बजाय हिन्दी में प्रचलित प्रत्यक्ष रूप से प्रस्तुत किया गया है।
- issue: यहोवा के लिए प्रयुक्त חָסִיד का भाव
  choice: निष्ठावान
  alternative: दयालु
  rationale: यहां इस्राएल की विश्वासघातिता के सामने यहोवा की वाचा-निष्ठा उभरती है; फिर भी दया का अर्थ वास्तविक है, इसलिए उसे पादटिप्पणी में रखा गया है।
- issue: לֹא אַפִּיל פָּנַי בָּכֶם में ईश्वरीय मुख का मुहावरा
  choice: मैं क्रोध से तुम पर दृष्टि नहीं करूंगा
  alternative: मैं अपना मुख तुम्हारे विरुद्ध नहीं करूंगा
  rationale: हिन्दी पाठक के लिए आशय स्पष्ट किया गया है, पर क्रोधपूर्ण ईश्वरीय दृष्टि की रूपकात्मक धारणा को पूरी तरह हटाया नहीं गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सार्वजनिक उद्घोषणा के अनुकूल हिन्दी। एकवचन आज्ञाएं ‘जा’, ‘कर’ और ‘लौट आ’ मूल के सीधे, तात्कालिक सम्बोधन को बनाए रखती हैं।
