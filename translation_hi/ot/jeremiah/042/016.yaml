  text: וְ/הָיְתָ֣ה הַ/חֶ֗רֶב אֲשֶׁ֤ר אַתֶּם֙ יְרֵאִ֣ים מִמֶּ֔/נָּה שָׁ֛ם תַּשִּׂ֥יג אֶתְ/כֶ֖ם בְּ/אֶ֣רֶץ מִצְרָ֑יִם וְ/הָ/רָעָ֞ב אֲשֶׁר אַתֶּ֣ם דֹּאֲגִ֣ים מִמֶּ֗/נּוּ שָׁ֣ם יִדְבַּ֧ק אַחֲרֵי/כֶ֛ם מִצְרַ֖יִם וְ/שָׁ֥ם תָּמֻֽתוּ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/016.yaml
  text: Then the sword that you fear will overtake you there in the land of Egypt[a], and the famine that you dread will follow close after you there in Egypt[b], and there you will die.
translation:
  language: hi
  text: तब जिस तलवार से तुम डरते हो, वह वहाँ मिस्र की भूमि में तुम्हें आ पकड़ेगी; और जिस अकाल को लेकर तुम चिंतित हो[a], वह वहाँ मिस्र में तुम्हारे पीछे लगा रहेगा[b]; और वहीं तुम मर जाओगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘जिस अकाल के विषय में तुम व्याकुल हो।’
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘तुम्हारे पीछे चिपका रहेगा’; यह लगातार पीछा करने का चित्र है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: तब … वह
  rationale: यह पद पिछले वचन के परिणाम को आगे बढ़ाता है। शाब्दिक ‘और ऐसा होगा कि’ के बजाय ‘तब’ आधुनिक हिन्दी में स्वाभाविक है और भावी परिणाम को स्पष्ट रखता है।
- source_word: הַחֶרֶב
  choice: तलवार
  rationale: हिब्रू के ठोस भविष्यद्वाणी-संबंधी बिंब को बनाए रखा गया है; इसे व्याख्यात्मक रूप से ‘युद्ध’ नहीं किया गया।
- source_word: יְרֵאִים מִמֶּנָּה
  choice: जिससे तुम डरते हो
  rationale: יִרְאָה के अर्थ और מִן के संबंध को सीधी, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: תַּשִּׂיג אֶתְכֶם
  choice: तुम्हें जा पकड़ेगी
  rationale: हिफ़ील रूप में क्रिया का अर्थ पीछा करते हुए पकड़ लेना या आ पहुँचना है। ‘जा पकड़ेगी’ खतरे के उनसे आगे निकलने नहीं, बल्कि उनके भागने पर भी उन्हें पकड़ लेने का भाव देता है।
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: वहाँ मिस्र देश में
  rationale: שָׁם और ‘मिस्र देश’ दोनों को रखा गया है, जिससे उसी शरणस्थल पर न्याय आने का जोर बना रहता है।
- source_word: הָרָעָב
  choice: अकाल
  rationale: यहाँ רָעָב व्यक्तिगत भूख नहीं, व्यापक अकाल को दर्शाता है।
- source_word: דֹּאֲגִים מִמֶּנּוּ
  choice: जिसे लेकर तुम चिंतित हो
  rationale: דאג चिंता और व्याकुलता व्यक्त करता है। ‘चिंतित हो’ अर्थ को बिना अनावश्यक तीव्रता जोड़े स्वाभाविक हिन्दी में रखता है।
- source_word: יִדְבַּק אַחֲרֵיכֶם
  choice: तुम्हारे पीछे लगा रहेगा
  rationale: דבק का मूल भाव चिपके रहने का है और אַחֲרֵי के साथ निरंतर पीछा करने का चित्र बनता है। हिन्दी मुहावरा ‘पीछे लगा रहेगा’ इस अथक पीछा करने के भाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְשָׁם תָּמֻתוּ
  choice: और वहीं तुम मर जाओगे
  rationale: दोहराए गए שָׁם को ‘वहीं’ से उभारा गया है, ताकि मिस्र ही मृत्यु का स्थान होगा—यह जोर बना रहे।
theological_decisions:
- issue: ‘तलवार’ और ‘अकाल’ के न्याय-संबंधी बिंब
  choice: दोनों ठोस बिंबों को ज्यों का त्यों रखा गया है।
  alternative: ‘युद्ध और भुखमरी’ जैसे व्याख्यात्मक शब्द
  rationale: हिब्रू में प्रयुक्त भविष्यद्वाणी और वाचा-संबंधी न्याय के ठोस शब्दों को बनाए रखना पाठ के धार्मिक बल को बिना व्याख्यात्मक विस्तार के सामने आने देता है।
- issue: मिस्र में सुरक्षा पाने की आशा और वहीं न्याय मिलने का विरोधाभास
  choice: ‘वहाँ’ और ‘वहीं’ की पुनरावृत्ति बनाए रखी गई है।
  alternative: स्थान-सूचक पुनरावृत्ति को शैलीगत रूप से हटा देना
  rationale: पाठ जानबूझकर इस बात पर जोर देता है कि जिस स्थान को वे सुरक्षा के लिए चुनना चाहते हैं, न्याय उन्हें उसी स्थान पर आ पकड़ेगा।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और भविष्यद्वाणी के चेतावनीपूर्ण स्वर के अनुरूप है। अर्धविराम समानांतर तीन परिणामों को स्पष्ट करते हैं, और ‘वहाँ/वहीं’ की पुनरावृत्ति मूल पाठ का जोर बनाए रखती है।
