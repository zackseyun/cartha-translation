base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/002.yaml
  text: And they said to Jeremiah the prophet[a], “Please let our plea come before you, and pray for us to Yahweh your God, for all this remnant, for we are left as few out of many[b], as your eyes see us.”
translation:
  language: hi
  text: उन्होंने यिर्मयाह नबी से कहा, “कृपया हमारी विनती को अपने सम्मुख आने दें[a] और हमारे लिए—इस समस्त बचे हुए समुदाय के लिए[b]—आपके परमेश्वर याहवे से प्रार्थना करें। क्योंकि बहुतों में से हम थोड़े ही बचे हैं, जैसा कि आप अपनी आँखों से देख रहे हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “हमारी विनती आपके सामने गिरने पाए”; यह गंभीर निवेदन प्रस्तुत करने का इब्रानी मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: या, “इस पूरे बचे हुए समुदाय के लिए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפָּל נָא תְחִנָּתֵנוּ לְפָנֶיךָ
  choice: कृपया हमारी विनती स्वीकार करें
  rationale: शाब्दिक चित्र ‘हमारी विनती आपके सामने गिरे’ है, पर यह इब्रानी में किसी के सामने गंभीर निवेदन रखने का मुहावरा है। ‘विनती स्वीकार करें’ आधुनिक हिन्दी में स्वाभाविक रूप से वही आग्रह व्यक्त करता है; मूल चित्र पादटिप्पणी में सुरक्षित है।
- source_word: וְהִתְפַּלֵּל בַּעֲדֵנוּ
  choice: हमारे लिए ... प्रार्थना करें
  rationale: हित्पएल क्रिया यहाँ प्रार्थना करने या पक्ष में मध्यस्थता करने का भाव रखती है। ‘प्रार्थना करें’ सरल है और ‘मध्यस्थता’ जैसा अधिक व्याख्यात्मक शब्द नहीं जोड़ता।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में प्रयुक्त परमेश्वर के व्यक्तिगत नाम יהוה का लिप्यंतरण किया गया है, किसी उपाधि से उसका स्थान नहीं लिया गया।
- source_word: אֱלֹהֶיךָ
  choice: अपने परमेश्वर
  rationale: वक्ता स्पष्ट रूप से यिर्मयाह से ‘तुम्हारे परमेश्वर’ कहते हैं। हिन्दी में संबोधन के आदरसूचक स्तर के अनुसार ‘अपने परमेश्वर’ उसी संबंध को स्वाभाविक रूप में व्यक्त करता है।
- source_word: כָּל הַשְּׁאֵרִית הַזֹּאת
  choice: इस सारे बचे हुए समुदाय
  rationale: שְׁאֵרִית का अर्थ वह शेष समुदाय है जो विपत्ति के बाद बचा है। ‘बचा हुआ समुदाय’ साधारण पाठक के लिए स्पष्ट रहते हुए यिर्मयाह की ‘शेष’ विषयवस्तु को बनाए रखता है।
- source_word: נִשְׁאַרְנוּ מְעַט מֵהַרְבֵּה
  choice: बहुतों में से हम थोड़े ही बचे हैं
  rationale: यह वर्तमान छोटी संख्या को पहले के बड़े जनसमूह के विपरीत रखता है। ‘ही’ अल्प संख्या पर दिए गए बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כַּאֲשֶׁר עֵינֶיךָ רֹאוֹת אֹתָנוּ
  choice: जैसा कि आप अपनी आँखों से देख रहे हैं
  rationale: ‘आपकी आँखें हमें देखती हैं’ के मूल चित्र को स्वाभाविक हिन्दी मुहावरे ‘अपनी आँखों से देखना’ में रखा गया है।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में वाचा का व्यक्तिगत नाम सीधे आया है। ‘याहवे’ प्रचलित विद्वत्तापूर्ण उच्चारण का देवनागरी लिप्यंतरण है और नाम को उपाधि में नहीं बदलता।
- issue: שְׁאֵרִית की भविष्यवाणी-संबंधी शब्दावली
  choice: बचा हुआ समुदाय
  alternative: बचे हुए लोग; शेष जन
  rationale: यह चुनाव केवल जीवित बचे अलग-अलग व्यक्तियों के बजाय उस सामूहिक ‘शेष’ को व्यक्त करता है जिसकी यिर्मयाह में धार्मिक और ऐतिहासिक प्रतिध्वनि है, पर किसी विशिष्ट सिद्धान्त को नहीं जोड़ता।
- issue: ‘तुम्हारे परमेश्वर’ में वक्ताओं की दूरी
  choice: अपने परमेश्वर याहवे
  alternative: हमारे परमेश्वर याहवे
  rationale: मूल पाठ वक्ताओं को ‘हमारे’ नहीं, यिर्मयाह के परमेश्वर की बात करते दिखाता है। इसे बदलना कथन में निहित संभावित संबंधगत दूरी को मिटा देता।
translation_notes:
  register: भाषा आधुनिक, आदरसूचक और सार्वजनिक पाठ के योग्य रखी गई है। ‘नबी’, ‘विनती’ और ‘बचा हुआ समुदाय’ गरिमापूर्ण किंतु सामान्यतः समझ आने वाले शब्द हैं। यिर्मयाह के लिए बहुवचन आदरसूचक क्रियारूप प्रयुक्त हैं।
