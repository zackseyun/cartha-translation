  text: דִּבֶּ֨ר יְהוָ֤ה עֲלֵי/כֶם֙ שְׁאֵרִ֣ית יְהוּדָ֔ה אַל תָּבֹ֖אוּ מִצְרָ֑יִם יָדֹ֨עַ֙ תֵּֽדְע֔וּ כִּי הַעִידֹ֥תִי בָ/כֶ֖ם הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/019.yaml
  text: 'Yahweh has spoken concerning you[a], remnant of Judah: Do not go to Egypt. Know for certain that I have warned you today.'
translation:
  language: hi
  text: हे यहूदा के बचे हुए लोगों, यहोवा ने तुम्हारे विषय में कहा है, “मिस्र मत जाओ।” यह निश्चय जान लो कि मैंने आज तुम्हें चेतावनी दी है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैंने आज तुम्हारे विरुद्ध गंभीर साक्ष्य दिया है।” इब्रानी क्रिया औपचारिक रूप से साक्ष्य देने या चेतावनी देने—दोनों अर्थ रख सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבֶּר
  choice: कहा है
  rationale: पूर्ण क्रिया बीते हुए दिव्य कथन को वर्तमान प्रासंगिकता के साथ प्रस्तुत करती है; ‘कहा है’ आधुनिक हिन्दी में इस बल को स्वाभाविक रूप से रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ रखा गया है।
- source_word: עֲלֵיכֶם
  choice: तुम्हारे विषय में
  rationale: דבר के साथ עַל यहाँ सामान्यतः ‘के विषय में/के संबंध में’ है; ‘तुम्हारे विरुद्ध’ संदर्भ से अधिक विरोधात्मक हो सकता है।
- source_word: שְׁאֵרִית יְהוּדָה
  choice: यहूदा के बचे हुए लोगो
  rationale: यह वाक्यांश ऐतिहासिक रूप से जीवित बचे समुदाय को स्पष्ट करता है और भविष्यवाणी-साहित्य में ‘शेष’ की अनुगूँज को अर्थ के स्तर पर बनाए रखता है। संबोधन के कारण ‘लोगो’ का प्रयोग किया गया है।
- source_word: אַל תָּבֹאוּ מִצְרָיִם
  choice: मिस्र मत जाओ
  rationale: निषेधात्मक रूप यात्रा को रोकता है; आधुनिक हिन्दी में ‘मत जाओ’ स्वाभाविक है, जबकि शाब्दिक ‘प्रवेश मत करो’ यहाँ अनावश्यक रूप से कठोर है।
- source_word: יָדֹעַ תֵּדְעוּ
  choice: यह निश्चित रूप से जान लो
  rationale: क्रियार्थक संज्ञा और सीमित क्रिया की पुनरुक्ति तीव्र बल देती है; ‘निश्चित रूप से जान लो’ उस जोर को स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: הַעִידֹתִי בָכֶם
  choice: मैंने तुम्हें चेतावनी दी है
  rationale: עוּד के हिफ़ील रूप में औपचारिक साक्ष्य देने और सावधान करने, दोनों का अर्थ संभव है। प्रसंग में चेतावनी मुख्य संप्रेषणात्मक कार्य है; औपचारिक वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: הַיּוֹם
  choice: आज
  rationale: समकालीन हिन्दी का सीधा और स्वाभाविक समतुल्य।
theological_decisions:
- issue: यहोवा के नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम है; उसे केवल उपाधि ‘प्रभु’ से प्रतिस्थापित न करके हिन्दी में परिचित नाम-रूप रखा गया है।
- issue: שְׁאֵרִית का ऐतिहासिक और धर्मवैचारिक स्वर
  choice: यहूदा के बचे हुए लोग
  alternative: यहूदा का शेष भाग
  rationale: ‘बचे हुए लोग’ सामान्य पाठक के लिए तत्काल ऐतिहासिक अर्थ स्पष्ट करता है, जबकि समुदाय के अवशेष होने का भाव भी बनाए रखता है; कोई अतिरिक्त धर्मसैद्धांतिक निष्कर्ष नहीं जोड़ा गया।
- issue: הַעִידֹתִי בָכֶם में चेतावनी बनाम प्रतिकूल साक्ष्य
  choice: मैंने तुम्हें चेतावनी दी है
  alternative: मैंने आज तुम्हारे विरुद्ध गंभीर साक्ष्य दिया है
  rationale: प्रसंग में यिर्मयाह लोगों को मिस्र न जाने की गंभीर चेतावनी दे रहा है। फिर भी इब्रानी क्रिया और בְּ औपचारिक अथवा प्रतिकूल साक्ष्य का अर्थ दे सकते हैं, इसलिए उस वास्तविक अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। बहुवचन संबोधन ‘लोगो’ तथा ‘तुम्हें’ सामान्य आधुनिक हिन्दी में स्पष्ट हैं। प्रत्यक्ष आज्ञा को उद्धरण-चिह्नों में रखा गया है; पादटिप्पणी-चिह्न [a] उसी वाक्य के अंत में उपस्थित है जिसकी वैकल्पिक व्याख्या दी गई है।
