id: JER.42.17
reference: Jeremiah 42:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/יִֽהְי֣וּ כָל הָ/אֲנָשִׁ֗ים אֲשֶׁר שָׂ֨מוּ אֶת פְּנֵי/הֶ֜ם לָ/ב֤וֹא מִצְרַ֨יִם֙ לָ/ג֣וּר שָׁ֔ם יָמ֕וּתוּ בַּ/חֶ֖רֶב בָּ/רָעָ֣ב וּ/בַ/דָּ֑בֶר וְ/לֹֽא יִהְיֶ֤ה לָ/הֶם֙ שָׂרִ֣יד וּ/פָלִ֔יט מִ/פְּנֵי֙ הָֽ/רָעָ֔ה אֲשֶׁ֥ר אֲנִ֖י מֵבִ֥יא עֲלֵי/הֶֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/017.yaml
  text: Then all the men who have set their faces to go to Egypt to sojourn there shall die by the sword[a], by famine, and by pestilence[b]. None of them shall have a survivor or an escapee from the disaster that I am bringing on them.
translation:
  language: hi
  text: तब वे सभी पुरुष, जिन्होंने मिस्र जाकर वहाँ परदेशी के रूप में रहने का निश्चय कर लिया है, तलवार, अकाल और महामारी से मरेंगे। उनमें से न कोई जीवित बचेगा, न कोई उस विपत्ति से बच निकलेगा जिसे मैं उन पर ला रहा हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיִהְיוּ ... יָמוּתוּ
  choice: तब ... मरेंगे
  rationale: हिब्रू वाक्य पूर्ववर्ती चेतावनी का परिणाम बताता है। हिन्दी में ‘तब ... मरेंगे’ भविष्यसूचक निर्णय को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כָל הָאֲנָשִׁים
  choice: वे सभी पुरुष
  rationale: אֲנָשִׁים का पुल्लिंग बहुवचन यहाँ सम्बोधित समूह के पुरुषों को इंगित करता है; इसलिए इसे तटस्थ ‘लोग’ बनाकर व्यापक नहीं किया गया।
- source_word: אֲשֶׁר שָׂמוּ אֶת־פְּנֵיהֶם
  choice: जिन्होंने ... निश्चय कर लिया है
  rationale: शाब्दिक मुहावरा ‘अपना मुख लगाया’ दृढ़ संकल्प व्यक्त करता है। आधुनिक हिन्दी में ‘निश्चय कर लिया है’ वही अर्थ स्पष्ट और स्वाभाविक रूप से देता है।
- source_word: לָבוֹא מִצְרַיִם
  choice: मिस्र जाकर
  rationale: בוא सन्दर्भानुसार आना, जाना या प्रवेश करना हो सकता है; वर्तमान दृष्टिकोण से मिस्र ‘जाना’ स्वाभाविक है।
- source_word: לָגוּר שָׁם
  choice: वहाँ परदेशी के रूप में रहने
  rationale: גור केवल रहने के साथ विदेशी अथवा अस्थायी निवासी के रूप में बसने का भाव भी रखता है। यह रूप उस अर्थ-छाया को साधारण हिन्दी में सुरक्षित रखता है।
- source_word: בַּחֶרֶב בָּרָעָב וּבַדָּבֶר
  choice: तलवार, अकाल और महामारी से
  rationale: यिर्मयाह में बार-बार आने वाली न्याय की त्रयी को ठोस और परिचित हिन्दी शब्दों में रखा गया है। ‘तलवार’ हिंसक मृत्यु और ‘महामारी’ व्यापक घातक रोग का बोध कराती है।
- source_word: שָׂרִיד וּפָלִיט
  choice: न कोई जीवित बचेगा, न कोई ... बच निकलेगा
  rationale: 'दोनों निकटार्थी शब्दों का भेद हिन्दी क्रियात्मक समानांतरता से स्पष्ट किया गया है: कोई शेष जीवित नहीं रहेगा और कोई भागकर नहीं बचेगा।'
- source_word: מִפְּנֵי הָרָעָה
  choice: उस विपत्ति से
  rationale: इस न्याय-सन्दर्भ में רָעָה नैतिक बुराई नहीं, आने वाली विपत्ति या अनिष्ट है।
- source_word: אֲשֶׁר אֲנִי מֵבִיא עֲלֵיהֶם
  choice: जिसे मैं उन पर ला रहा हूँ
  rationale: מֵבִיא कृदन्त निकटस्थ अथवा प्रगतिशील कार्रवाई व्यक्त करता है; ‘ला रहा हूँ’ उस पक्ष और प्रत्यक्ष दिव्य कर्तृत्व को बनाए रखता है।
theological_decisions:
- issue: आने वाली विपत्ति में परमेश्वर का प्रत्यक्ष कर्तृत्व
  choice: जिसे मैं उन पर ला रहा हूँ
  alternative: जो उन पर आने वाली है
  rationale: हिब्रू पाठ स्पष्ट रूप से ‘मैं’ को विपत्ति लाने वाला बताता है। अनुवाद इस तनावपूर्ण न्याय-भाषा को निष्क्रिय या मृदु नहीं करता।
- issue: שָׂרִיד וּפָלִיט को किसी धर्मवैचारिक ‘शेष’ अवधारणा से जोड़ना
  choice: न कोई जीवित बचेगा, न कोई ... बच निकलेगा
  alternative: न कोई शेष रहेगा, न कोई भगोड़ा
  rationale: यहाँ युग्म सम्पूर्ण विनाश और बच निकलने की असम्भवता पर बल देता है। सामान्य हिन्दी अभिव्यक्ति अनावश्यक पारिभाषिक या सम्प्रदायगत अर्थ आरोपित नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी में गम्भीर भविष्यसूचक शैली रखी गई है। कठिन शाब्दिक मुहावरों को अर्थ-सटीक, सहज हिन्दी में व्यक्त किया गया है; ‘परदेशी के रूप में’ גור की विशिष्ट अर्थ-छाया सुरक्षित रखता है। किसी पादटिप्पणी की आवश्यकता नहीं पड़ी, इसलिए मुख्य पाठ में कोई पादटिप्पणी-चिह्न नहीं है।
