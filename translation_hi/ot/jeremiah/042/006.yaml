source:
  edition: WLC
  text: אִם ט֣וֹב וְ/אִם רָ֔ע בְּ/ק֣וֹל יְהוָ֣ה אֱלֹהֵ֗י/נוּ אֲשֶׁ֨ר אנו שֹׁלְחִ֥ים אֹתְ/ךָ֛ אֵלָ֖י/ו נִשְׁמָ֑ע לְמַ֨עַן֙ אֲשֶׁ֣ר יִֽיטַב לָ֔/נוּ כִּ֣י נִשְׁמַ֔ע בְּ/ק֖וֹל יְהוָ֥ה אֱלֹהֵֽי/נוּ־־׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/006.yaml
  text: Whether it is good or whether it is bad, we will obey the voice of the LORD our God, to whom we are sending you, so that it may go well with us when we obey the voice of the LORD our God.
translation:
  language: hi
  text: चाहे वह अच्छा हो या बुरा, हम यहोवा, अपने परमेश्वर, की वाणी मानेंगे, जिनके पास हम आपको भेज रहे हैं, ताकि हमारा भला हो, क्योंकि[a] हम यहोवा, अपने परमेश्वर, की वाणी मानेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब हम यहोवा, अपने परमेश्वर, की वाणी मानेंगे।” हिब्रू כִּי सामान्यतः ‘क्योंकि’ है, पर यहाँ इसे परिस्थिति या समय बताने वाले अर्थ में भी समझा जा सकता है।
    reason: כִּי के कारणसूचक और परिस्थिति/कालसूचक, दोनों संभव अर्थों को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: אִם טוֹב וְאִם רָע
  choice: चाहे वह अच्छा हो या बुरा
  rationale: शाब्दिक विरोध को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक रियायती अभिव्यक्ति दी गई है; आशय उस उत्तर का है जो उन्हें मिलेगा।
- source_word: בְּקוֹל ... נִשְׁמָע
  choice: की वाणी मानेंगे
  rationale: हिब्रू में ‘वाणी सुनना’ आज्ञापालन का मुहावरा है; ‘वाणी मानना’ सुनने और आज्ञापालन दोनों को संक्षेप में व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम को हिन्दी में प्रचलित लिप्यंतरण द्वारा सुरक्षित रखा गया है।
- source_word: לְמַעַן אֲשֶׁר יִיטַב לָנוּ
  choice: ताकि ... हमारा भला हो
  rationale: उद्देश्यसूचक לְמַעַן और יִיטַב के कल्याण/अनुकूल परिणाम के अर्थ को स्वाभाविक हिन्दी में रखा गया है।
- source_word: כִּי נִשְׁמַע
  choice: जब हम ... मानें
  rationale: यहाँ כִּי को आज्ञापालन की परिस्थिति बताने वाला ‘जब’ समझा गया है, जैसा परामर्श-पाठ में है; कारणसूचक अर्थ भी संभव है।
theological_decisions:
- issue: 'כִּי का संबंध: कारण या परिस्थिति'
  choice: जब हम ... मानें
  alternative: क्योंकि हम ... मानेंगे
  rationale: ‘जब’ आज्ञापालन और भलाई के संबंध को व्यक्त करता है, बिना इस कथन को आत्म-धार्मिक दावे के रूप में कठोर बनाने के; मूल में कारणसूचक ‘क्योंकि’ की संभावना बनी रहती है।
- issue: ईश्वरीय नाम יהוה का निरूपण
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल के व्यक्तिवाचक नाम को पाठ में प्रत्यक्ष रखा गया है और उसे केवल उपाधि में नहीं बदला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; सामूहिक प्रतिज्ञा का गंभीर और गरिमापूर्ण स्वर। ‘आपको’ द्वारा यिर्मयाह के प्रति बहुवचन समुदाय का सम्मानसूचक संबोधन रखा गया है।
