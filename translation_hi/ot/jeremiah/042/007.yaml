translation:
  language: hi
  text: दस दिन पूरे होने पर ऐसा हुआ कि यहोवा का वचन यिर्मयाह के पास आया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי ... וַיְהִי
  choice: '... आया'
  rationale: दोनों कथात्मक रूप मिलकर घटना की अगली कड़ी बताते हैं। स्वाभाविक हिन्दी में पहले וַיְהִי को अलग से दोहराने के बजाय पूरी संरचना को ‘वचन ... आया’ से व्यक्त किया गया है।
- source_word: מִקֵּץ עֲשֶׂרֶת יָמִים
  choice: दस दिन पूरे होने पर
  rationale: מִקֵּץ अवधि के समाप्ति-बिंदु को सूचित करता है। यह प्रयोग आधुनिक हिन्दी में स्वाभाविक रहते हुए ‘दस दिनों के अंत में’ का ठीक अर्थ देता है।
- source_word: דְבַר יְהוָה
  choice: यहोवा का वचन
  rationale: मानक भविष्यद्वाणी-सूत्र को बनाए रखने के लिए דָּבָר का अनुवाद ‘वचन’ किया गया है; यह केवल सामान्य ‘संदेश’ से अधिक निकट है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय ईश-नाम को हिन्दी बाइबलीय प्रयोग में पहचाने जाने वाले व्यक्तिगत नाम ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से नहीं।
- source_word: אֶל יִרְמְיָהוּ
  choice: यिर्मयाह के पास
  rationale: वचन के किसी व्यक्ति तक पहुँचने के लिए हिन्दी में ‘के पास आया’ स्वाभाविक समतुल्य है। नाम का रूप प्रचलित हिन्दी बाइबलीय वर्तनी के अनुसार है।
theological_decisions:
- issue: ईश-नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश-नाम है। हिन्दी पाठक के लिए परिचित नाम-रूप ‘यहोवा’ उस नामात्मक स्वरूप को सुरक्षित रखता है और उसे ‘प्रभु’ जैसी उपाधि से नहीं बदलता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। कथात्मक सूत्र को शब्दशः दोहराने के बजाय हिन्दी की स्वाभाविक वाक्य-रचना अपनाई गई है; भविष्यद्वाणी-संबंधी ‘वचन आया’ पदबंध सुरक्षित रखा गया है।
