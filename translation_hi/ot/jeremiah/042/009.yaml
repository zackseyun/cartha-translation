  yaml_path: translation/ot/jeremiah/042/009.yaml
  text: And he said to them, “Thus says the LORD, the God of Israel, to whom you sent me to lay your plea before him:”
translation:
  language: hi
  text: 'उसने उनसे कहा, “इस्राएल का परमेश्वर यहोवा यों कहता है, जिसके पास तुमने मुझे भेजा था कि मैं उसके सामने तुम्हारी विनती रखूँ:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: यों कहता है
  rationale: यह भविष्यद्वाणी-संदेश का पारंपरिक सूत्र है; हिन्दी में स्वाभाविक रहते हुए मूल की औपचारिकता बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल में प्रयुक्त परमेश्वर के व्यक्तिगत नाम को नाम के रूप में प्रस्तुत किया गया है, न कि सामान्य उपाधि से।
- source_word: לְהַפִּיל תְּחִנַּתְכֶם לְפָנָיו
  choice: उसके पास अपनी विनती रखने के लिए
  rationale: शाब्दिक रूप से ‘उसके सामने अपनी विनती डालना’; चुना हुआ वाक्यांश विनम्र निवेदन का भाव और गंतव्य दोनों स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: हिब्रू पाठ यहाँ विशिष्ट वाचा-नाम का प्रयोग करता है; उसका लिप्यंतर नाम और उपाधि के भेद को सुरक्षित रखता है।
- issue: אֵלָיו / לְפָנָיו में सर्वनाम का संदर्भ
  choice: जिसके पास … उसके पास
  alternative: जिससे … उसके सामने
  rationale: दोनों सर्वनाम यहोवा की ओर संकेत करते हैं; हिन्दी में स्पष्ट और सहज संबंध रखते हुए कोई अतिरिक्त व्याख्या नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी; भविष्यद्वाणी की गरिमा और प्रत्यक्ष कथन की औपचारिकता बनाए रखते हुए सामान्य पाठक के लिए सहज शब्दावली। पद अगले वचन में जारी रहने के कारण अंत में द्विबिंदु रखा गया है।
