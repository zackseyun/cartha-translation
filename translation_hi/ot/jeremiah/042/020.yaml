  text: כִּ֣י התעתי/ם בְּ/נַפְשֽׁוֹתֵי/כֶם֒ כִּֽי אַתֶּ֞ם שְׁלַחְתֶּ֣ם אֹתִ֗/י אֶל יְהוָ֤ה אֱלֹֽהֵי/כֶם֙ לֵ/אמֹ֔ר הִתְפַּלֵּ֣ל בַּעֲדֵ֔/נוּ אֶל יְהוָ֖ה אֱלֹהֵ֑י/נוּ וּ/כְ/כֹל֩ אֲשֶׁ֨ר יֹאמַ֜ר יְהוָ֧ה אֱלֹהֵ֛י/נוּ כֵּ֥ן הַגֶּד לָ֖/נוּ וְ/עָשִֽׂינוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/020.yaml
  text: For you have deceived yourselves[a], because you sent me to Yahweh your God, saying, ‘Pray for us to Yahweh our God, and whatever Yahweh our God says, tell us, and we will do it.’
translation:
  language: hi
  text: क्योंकि तुमने अपने आप को धोखा दिया है[a]—तुमने मुझे अपने परमेश्वर याहवे के पास यह कहकर भेजा था, ‘हमारे लिए हमारे परमेश्वर याहवे से प्रार्थना करो, और हमारा परमेश्वर याहवे जो कुछ कहे, वह हमें बताना; हम वैसा ही करेंगे।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम अपने प्राणों की कीमत पर भटक गए हो।” इब्रानी अभिव्यक्ति उनकी भूल के आत्म-विनाशकारी परिणाम पर भी बल दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: התעיתם בנפשותיכם
  choice: तुमने अपने आप को धोखा दिया है
  rationale: हिफ़ईल रूप और בְּנַפְשׁוֹתֵיכֶם का संयोजन कठिन है। प्रसंग में लोग आज्ञा मानने का दावा करते हुए स्वयं को भ्रम में रखते हैं; इसलिए यह स्वाभाविक हिन्दी आरोप आत्म-छल का भाव व्यक्त करता है। अपने प्राणों को संकट में डालने का संभावित अर्थ पादटिप्पणी में रखा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में ध्वन्यात्मक रूप से प्रस्तुत किया गया है।
- source_word: הִתְפַּלֵּל בַּעֲדֵנוּ
  choice: हमारे लिए ... प्रार्थना करो
  rationale: क्रिया और בַּעַד मिलकर किसी की ओर से प्रार्थना करने का अर्थ देते हैं; यह आधुनिक हिन्दी में स्पष्ट और सहज है।
- source_word: וּכְכֹל אֲשֶׁר יֹאמַר
  choice: जो कुछ कहे
  rationale: यह वाक्यांश कही जाने वाली हर बात के व्यापक दायरे को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַגֶּד לָנוּ
  choice: वह हमें बताना
  rationale: आज्ञार्थक נגד का सरल और प्रसंगानुकूल हिन्दी रूप है।
- source_word: וְעָשִׂינוּ
  choice: हम वैसा ही करेंगे
  rationale: क्रिया का कर्म पिछली बात से समझा जाता है; ‘वैसा ही’ उनके घोषित पूर्ण पालन को स्वाभाविक हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसे किसी उपाधि से प्रतिस्थापित किए बिना प्रचलित विद्वत्तापूर्ण उच्चारण के अनुसार प्रस्तुत करता है।
- issue: התעיתם בנפשותיכם में आरोप का अर्थ
  choice: तुमने अपने आप को धोखा दिया है
  alternative: तुम अपने प्राणों की कीमत पर भटक गए हो
  rationale: वाक्यांश आत्म-छल और आत्म-विनाशकारी भूल, दोनों की ओर संकेत कर सकता है। निकट प्रसंग में उनकी असच्ची आज्ञाकारिता प्रमुख है, इसलिए मुख्य पाठ में आत्म-छल रखा गया और जीवन के संकट वाला अर्थ पादटिप्पणी में सुरक्षित किया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। प्रत्यक्ष कथन में बोलचाल की स्पष्टता है, जबकि ‘याहवे’ मूल के व्यक्तिगत ईश्वरीय नाम को सुरक्षित रखता है।
