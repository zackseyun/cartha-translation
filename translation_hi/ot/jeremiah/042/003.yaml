  yaml_path: translation/ot/jeremiah/042/003.yaml
  text: that Yahweh your God may tell us the way in which we should walk[a], and the thing that we should do.
translation:
  language: hi
  text: कि आपका परमेश्वर याहवे हमें वह मार्ग बताए जिस पर हमें चलना चाहिए, और वह बात बताए जो हमें करनी चाहिए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह कार्य जो हमें करना चाहिए।”
    reason: हिब्रू दावार का यहाँ ‘बात/विषय’ और प्रसंगानुसार ‘कार्य’—दोनों सम्भव अर्थ हैं।
lexical_decisions:
- source_word: וְיַגֶּד
  choice: हमें बताए
  rationale: נגד का हिफ़ील रूप यहाँ पिछली विनती के आशय को आगे बढ़ाता है; ‘बताए’ आधुनिक हिन्दी में स्वाभाविक रहते हुए निवेदन का भाव रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה को उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में सुरक्षित रखा गया है।
- source_word: אֱלֹהֶיךָ
  choice: आपका परमेश्वर
  rationale: द्वितीय पुरुष पुल्लिंग एकवचन प्रत्यय यिर्मयाह को संबोधित करता है; आदरसूचक ‘आपका’ प्रसंग और हिन्दी की गरिमा के अनुकूल है।
- source_word: הַדֶּרֶךְ
  choice: मार्ग
  rationale: ‘मार्ग’ वास्तविक रास्ते और आचरण की दिशा—दोनों अर्थों को सम्भव रखता है तथा ‘चलना’ के साथ स्वाभाविक है।
- source_word: אֲשֶׁר נֵלֶךְ בָּהּ
  choice: जिस मार्ग पर हमें चलना चाहिए
  rationale: הלך का चलने का रूपक सुरक्षित है; ‘चाहिए’ माँगे गए मार्गदर्शन को व्यक्त करता है, केवल भविष्यवाणी को नहीं। हिन्दी में ‘मार्ग पर’ स्वाभाविक प्रयोग है।
- source_word: הַדָּבָר אֲשֶׁר נַעֲשֶׂה
  choice: क्या करना चाहिए
  rationale: דבר और עשה का संयुक्त आशय उस कार्य या कदम से है जिसे करना है। संक्षिप्त हिन्दी ‘क्या करना चाहिए’ मूल समानांतरता का अर्थ स्वाभाविक ढंग से देती है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम स्पष्ट रूप से उपस्थित है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना सुरक्षित रखता है।
- issue: माँगे गए मार्गदर्शन की शक्ति
  choice: हमें ... चलना चाहिए और क्या करना चाहिए
  alternative: हम ... चलें और ... करें
  rationale: हिब्रू रूप उद्देश्य/विनती के प्रसंग में हैं। ‘चाहिए’ मार्गदर्शन की अपेक्षा व्यक्त करता है, पर ‘अवश्य’ जैसी अतिरिक्त कठोर अनिवार्यता नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक पाठ के योग्य। यिर्मयाह के लिए आदरसूचक एकवचन ‘आपका’ रखा गया है। मूल का ‘मार्ग पर चलना’ रूपक सुरक्षित है; दूसरे समानांतर खंड को स्वाभाविक हिन्दी में ‘क्या करना चाहिए’ कहा गया है।
