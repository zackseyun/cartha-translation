source:
  edition: WLC
  text: אִם שׁ֤וֹב תֵּֽשְׁבוּ֙ בָּ/אָ֣רֶץ הַ/זֹּ֔את וּ/בָנִ֤יתִי אֶתְ/כֶם֙ וְ/לֹ֣א אֶהֱרֹ֔ס וְ/נָטַעְתִּ֥י אֶתְ/כֶ֖ם וְ/לֹ֣א אֶתּ֑וֹשׁ כִּ֤י נִחַ֨מְתִּי֙ אֶל הָ֣/רָעָ֔ה אֲשֶׁ֥ר עָשִׂ֖יתִי לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/010.yaml
  text: If you will indeed remain in this land[a], then I will build you up and not tear you down, and I will plant you and not uproot you[c][b]; for I relent concerning the harm that I did to you.
translation:
  language: hi
  text: यदि तुम सचमुच इसी देश में बसे रहोगे,[a] तो मैं तुम्हें बसाऊँगा और ढाऊँगा नहीं; मैं तुम्हें रोपूँगा और उखाड़ूँगा नहीं।[b] क्योंकि जो विपत्ति मैं तुम पर लाया हूँ, उसके विषय में मैं नरम पड़ गया हूँ।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यदि तुम वास्तव में इसी देश में ठहरे रहोगे।” इब्रानी में क्रिया से पहले उसी क्रिया-भाव का एक विशेष रूप रखकर बात पर बल दिया गया है।
    reason: lexical_alternative
  - marker: b
    text: “रोपूँगा” और “उखाड़ूँगा” लोगों को देश में स्थिर करने या वहाँ से हटा देने के कृषि-रूपक हैं।
    reason: metaphor_clarification
  - marker: c
    text: या, “उस विपत्ति के विषय में मुझे खेद है” या “मैं उस विपत्ति से फिर गया हूँ।” यहाँ “विपत्ति” का अर्थ नैतिक बुराई नहीं, दंडस्वरूप आया अनिष्ट है।
    reason: lexical_and_theological_clarification
lexical_decisions:
- source_word: שׁוֹב תֵּשְׁבוּ
  choice: सचमुच ... बसे रहोगे
  rationale: שׁוֹב infinitive absolute finite verb תֵּשְׁבוּ को बल देता है। संदर्भ में अर्थ देश छोड़कर मिस्र जाने के विपरीत वहीं बने रहने का है; ‘सचमुच ... बसे रहोगे’ बल और निवास, दोनों को व्यक्त करता है।
- source_word: בָּאָרֶץ הַזֹּאת
  choice: इसी देश में
  rationale: ‘देश’ भौगोलिक और वाचिक अनुगूँज बनाए रखता है; ‘इसी’ निकटवाची संकेत और प्रसंगगत बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וּבָנִיתִי אֶתְכֶם
  choice: मैं तुम्हें बनाऊँगा
  rationale: मूल के निर्माण-रूपक को सीधे रखा गया है। ‘बसाऊँगा’ अर्थ को स्थापना की ओर सीमित कर देता, जबकि ‘बनाऊँगा’ अगले ‘ढाऊँगा’ के साथ मूल विरोध को सुरक्षित रखता है।
- source_word: וְלֹא אֶהֱרֹס
  choice: ढाऊँगा नहीं
  rationale: निर्माण और विध्वंस के समानांतर रूपक को संक्षिप्त, स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וְנָטַעְתִּי אֶתְכֶם
  choice: मैं तुम्हें रोपूँगा
  rationale: यिर्मयाह में प्रयुक्त कृषि-रूपक को ‘स्थापित करूँगा’ जैसे अमूर्त अनुवाद से समतल किए बिना सुरक्षित रखता है।
- source_word: וְלֹא אֶתּוֹשׁ
  choice: उखाड़ूँगा नहीं
  rationale: रोपने के विपरीत कृषि-चित्र को स्पष्ट आधुनिक हिन्दी में व्यक्त करता है।
- source_word: נִחַמְתִּי
  choice: मैं द्रवित हुआ हूँ
  rationale: נחם यहाँ पूर्व दंड-विपत्ति के संबंध में ईश्वर के करुणापूर्वक मुड़ने या नरम पड़ने को व्यक्त करता है। ‘पछताया हूँ’ नैतिक भूल का अनावश्यक संकेत दे सकता है, जबकि ‘द्रवित हुआ हूँ’ भावात्मक और क्रियात्मक तनाव को बनाए रखता है।
- source_word: אֶל הָרָעָה
  choice: विपत्ति ... उसके विषय में
  rationale: רָעָה यहाँ नैतिक बुराई नहीं, न्यायस्वरूप आई विपत्ति या अनिष्ट है। ‘विपत्ति’ इस अर्थ को स्पष्ट रखती है।
- source_word: אֲשֶׁר עָשִׂיתִי לָכֶם
  choice: जो विपत्ति मैंने तुम पर डाली है
  rationale: शाब्दिक ‘जो मैंने तुम्हारे साथ की’ हिन्दी में अस्वाभाविक और भ्रामक होता। ‘तुम पर डाली’ दैवी न्याय के रूप में आई calamity को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: ईश्वर के विषय में נִחַמְתִּי का अर्थ
  choice: उसके विषय में मैं द्रवित हुआ हूँ
  alternative: उस विपत्ति से मैं पछताया हूँ / उस विपत्ति को लाने से मैं रुक गया हूँ
  rationale: मूल पाठ ईश्वर की पूर्व न्याय-क्रिया के संबंध में करुणापूर्वक मुड़ने की मानवीय भाषा रखता है। ‘द्रवित हुआ हूँ’ इस तनाव को बचाता है, पर ईश्वर द्वारा नैतिक बुराई करने या नैतिक दोष स्वीकारने का अर्थ आरोपित नहीं करता।
- issue: הָרָעָה का नैतिक या आपदात्मक अर्थ
  choice: विपत्ति
  alternative: बुराई / अनिष्ट
  rationale: संदर्भ बाबेल के द्वारा आए दंड और विनाश का है; इसलिए शब्द यहाँ नैतिक दुष्टता के बजाय दुःखद विपत्ति को सूचित करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु साधारण पाठक के लिए स्पष्ट रूप अपनाया गया है। निर्माण और कृषि के समानांतर रूपकों को बनाए रखा गया है। ‘द्रवित हुआ हूँ’ साहित्यिक है, पर प्रचलित और बोधगम्य है; पादटिप्पणी वैकल्पिक अर्थ खोलती है।
