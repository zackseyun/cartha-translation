base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/005.yaml
  text: And they said to Jeremiah[b][a], “May Yahweh be a true and faithful witness against us if we do not act according to all the word that Yahweh your God sends to us through you.”
translation:
  language: hi
  text: तब उन्होंने यिर्मयाह से कहा, “याहवे हमारे विरुद्ध सच्चा और विश्वासयोग्य साक्षी हो[a], यदि हम उस पूरे संदेश के अनुसार कार्य न करें जो याहवे, तुम्हारा परमेश्वर, तुम्हारे द्वारा हमारे पास भेजे[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे हमारे बीच सच्चा और विश्वासयोग्य साक्षी हो।” इब्रानी पदबंध का अधिक शाब्दिक अर्थ “हममें/हमारे बीच” है, पर इस शपथ के संदर्भ में संभवतः आशय यह है कि आज्ञा न मानने पर वह उनके विरुद्ध साक्षी होगा।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “जो याहवे, तुम्हारा परमेश्वर, तुम्हें हमारे पास भेजेगा।” इब्रानी में यिर्मयाह को भेजे जाने की बात है; उसके द्वारा संदेश भेजा जाना प्रसंग में निहित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵמָּה אָמְרוּ אֶל יִרְמְיָהוּ
  choice: तब उन्होंने यिर्मयाह से कहा
  rationale: संयोजक וְ को प्रसंगानुकूल ‘तब’ से व्यक्त किया गया है; शेष वाक्यांश का सीधा और स्वाभाविक हिंदी रूप रखा गया है।
- source_word: יְהִי
  choice: हो
  rationale: यह आज्ञार्थक/कामनार्थक रूप शपथ में आह्वान व्यक्त करता है; ‘साक्षी हो’ आधुनिक हिंदी में इस भाव को संक्षेप और गरिमा से प्रकट करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले व्यक्तिगत ईश्वरीय नाम को उपाधि से बदलने के बजाय हिंदी में उसके प्रचलित लिप्यंतरण से प्रस्तुत किया गया है।
- source_word: בָּנוּ לְעֵד
  choice: हमारे विरुद्ध ... साक्षी
  rationale: शपथ के न्यायिक प्रसंग में आशय यह है कि आज्ञा न मानने पर याहवे बोलने वालों के विरुद्ध साक्षी ठहरें; ‘हमारे बीच’ की अधिक शाब्दिक संभावना पादटिप्पणी में सुरक्षित है।
- source_word: אֱמֶת וְנֶאֱמָן
  choice: सच्चा और विश्वासयोग्य
  rationale: दोनों इब्रानी विशेषणों को अलग रखते हुए साक्षी की सत्यता और भरोसेमंदी व्यक्त की गई है।
- source_word: אִם לֹא
  choice: यदि ... न करें
  rationale: यह शपथ की वह शर्त प्रस्तुत करता है जिसके उल्लंघन पर बुलाया गया साक्षी उनके विरुद्ध होगा।
- source_word: כְּכָל הַדָּבָר
  choice: उस पूरी बात के अनुसार
  rationale: एकवचन דָּבָר यहाँ संपूर्ण संदेश को सूचित करता है; यह रूप उसकी एकवचनता और व्यापकता दोनों बनाए रखता है।
- source_word: יִשְׁלָחֲךָ ... אֵלֵינוּ
  choice: जिसके लिए ... तुम्हें हमारे पास भेजेगा
  rationale: इब्रानी का अधिक सीधा अर्थ ‘तुम्हें हमारे पास भेजेगा’ है और संदेश प्रसंग से निहित है; हिंदी में ‘जिसके लिए’ जोड़ने से संदेशवाहक का आशय स्वाभाविक ढंग से स्पष्ट होता है।
- source_word: אֱלֹהֶיךָ
  choice: तुम्हारा परमेश्वर
  rationale: दूसरे पुरुष एकवचन प्रत्यय को यथावत रखा गया है; इसे ‘हमारा परमेश्वर’ बनाकर वक्ताओं की मूल शब्दावली का सामंजस्यीकरण नहीं किया गया।
- source_word: כֵּן נַעֲשֶׂה
  choice: उस पूरी बात के अनुसार न करें
  rationale: ‘वैसा ही हम करेंगे’ के सकारात्मक कथन को इब्रानी शपथ-सूत्र אִם לֹא के साथ हिंदी की स्वाभाविक नकारात्मक शर्त में व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल में व्यक्तिगत नाम है; इसलिए उसे उपाधि ‘प्रभु’ से नहीं बदला गया। ‘याहवे’ हिंदी में Yahweh का निकट लिप्यंतरण है।
- issue: בָּנוּ का शपथ-संदर्भ में संबंध
  choice: हमारे विरुद्ध
  alternative: हमारे बीच
  rationale: न्यायिक शपथ में साक्षी का आह्वान अवज्ञा की दशा में वक्ताओं के विरुद्ध गवाही के लिए है; फिर भी ‘हमारे बीच’ का अधिक शाब्दिक अर्थ वास्तविक संभावना है और पादटिप्पणी में दिया गया है।
- issue: ‘तुम्हारा परमेश्वर’ में संबंधसूचक सर्वनाम
  choice: तुम्हारा परमेश्वर
  alternative: हमारा परमेश्वर
  rationale: इब्रानी पाठ स्पष्टतः यिर्मयाह को संबोधित दूसरे पुरुष एकवचन का प्रयोग करता है। संभावित धार्मिक या संबंधपरक तनाव को बदलकर सरल नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी की, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। शपथ की औपचारिकता बनाए रखने के लिए ‘सच्चा और विश्वासयोग्य साक्षी हो’ प्रयुक्त हुआ है। ‘याहवे’ व्यक्तिगत नाम के रूप में और ‘तुम्हारा परमेश्वर’ मूल के संबंधपरक तनाव सहित सुरक्षित रखा गया है।
