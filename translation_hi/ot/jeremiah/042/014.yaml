  text: לֵ/אמֹ֗ר לֹ֚א כִּ֣י אֶ֤רֶץ מִצְרַ֨יִם֙ נָב֔וֹא אֲשֶׁ֤ר לֹֽא נִרְאֶה֙ מִלְחָמָ֔ה וְ/ק֥וֹל שׁוֹפָ֖ר לֹ֣א נִשְׁמָ֑ע וְ/לַ/לֶּ֥חֶם לֹֽא נִרְעָ֖ב וְ/שָׁ֥ם נֵשֵֽׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/014.yaml
  text: saying[a], ‘No, but we will go into the land of Egypt, where we will not see war, and we will not hear the sound of the trumpet, and we will not be hungry for bread; and there we will live.’
translation:
  language: hi
  text: यह कहते हुए[a], ‘नहीं, बल्कि हम मिस्र देश में जाएँगे, जहाँ न हम युद्ध देखेंगे, न नरसिंगे की आवाज़ सुनेंगे, न रोटी के लिए भूखे रहेंगे; और वहीं हम बसेंगे।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘यह कहकर।’ इब्रानी पद पिछले वाक्य से जुड़कर आगे उद्धृत कथन का परिचय देता है।
    reason: discourse_alternative
lexical_decisions:
- source_word: לֵאמֹר
  choice: यह कहते हुए
  rationale: यह पद पिछले वाक्य से जुड़ा है और आगे लोगों के कथन की विषयवस्तु प्रस्तुत करता है; ‘यह कहते हुए’ इस संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: לֹא כִּי
  choice: नहीं, बल्कि
  rationale: यह संयोजन पहले विकल्प का दृढ़ निषेध करके उसके विपरीत संकल्प व्यक्त करता है।
- source_word: אֶרֶץ מִצְרַיִם
  choice: मिस्र देश
  rationale: मूल में उपस्थित ‘देश/भूमि’ को बनाए रखते हुए हिन्दी की स्वाभाविक अभिव्यक्ति दी गई है।
- source_word: נָבֹוא
  choice: हम ... में जाएँगे
  rationale: गंतव्य के साथ בוא यहाँ किसी देश में जाने या प्रवेश करने का भाव देता है।
- source_word: לֹא נִרְאֶה מִלְחָמָה
  choice: न हम युद्ध देखेंगे
  rationale: मूल की ठोस अभिव्यक्ति ‘युद्ध देखना’ को बिना ‘अनुभव करना’ जैसी व्याख्यात्मक विस्तृति के सुरक्षित रखा गया है।
- source_word: קוֹל שׁוֹפָר
  choice: नरसिंगे की आवाज़
  rationale: שׁוֹפָר युद्ध-संकेत में प्रयुक्त सींग का वाद्य है; ‘नरसिंगा’ आधुनिक हिन्दी में इस वस्तु और प्रसंग को ‘तुरही’ से अधिक विशिष्ट रूप में व्यक्त करता है।
- source_word: לֹא נִשְׁמָע
  choice: न ... सुनेंगे
  rationale: संदर्भ में प्रथम पुरुष बहुवचन का स्वाभाविक हिन्दी रूप है और आसपास के क्रियापदों की शृंखला से मेल खाता है।
- source_word: וְלַלֶּחֶם לֹא נִרְעָב
  choice: न रोटी के लिए भूखे रहेंगे
  rationale: ‘रोटी’ के ठोस बिंब और उसके साथ प्रयुक्त संबंधसूचक भाव दोनों को बनाए रखा गया है।
- source_word: וְשָׁם נֵשֵׁב
  choice: और वहीं हम बसेंगे
  rationale: ישׁב यहाँ स्थान बदलकर स्थायी रूप से रहने का भाव दे सकता है; ‘बसेंगे’ आधुनिक, सहज और इस संदर्भ के अनुकूल है।
