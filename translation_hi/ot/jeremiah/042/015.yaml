  choice: याहवे का वचन सुनो
  rationale: भविष्यद्वक्ताओं के आह्वान की गंभीरता और स्थिर सूत्र ‘याहवे का वचन’ सुरक्षित रहता है।
- source_word: שְׁאֵרִית יְהוּדָה
  choice: हे यहूदा के बचे हुए लोगो
  rationale: प्रत्यक्ष संबोधन तथा विनाश से बचे समुदाय—दोनों अर्थ स्पष्ट और सामान्य हिन्दी में आते हैं।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का याहवे
  rationale: ईश्वरीय उपाधि में निहित सैन्य और व्यापक सामर्थ्य का संकेत बिना अनावश्यक व्याख्या के सुरक्षित है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल का परमेश्वर
  rationale: सम्बन्धवाचक इब्रानी पदबंध का सीधा और स्वाभाविक अनुवाद है।
- source_word: אִם אַתֶּם שׂוֹם תְּשִׂימוּן פְּנֵיכֶם
  choice: यदि तुम ... जाने का पक्का निश्चय कर चुके हो
  rationale: धातु की पुनरुक्ति से उत्पन्न तीव्रता और ‘अपना मुख लगाना’ मुहावरे के दृढ़ संकल्प वाले आशय को आधुनिक हिन्दी में व्यक्त करता है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: לָבוֹא מִצְרַיִם
