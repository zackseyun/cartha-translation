base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/015.yaml
  text: 'Now therefore hear the word of Yahweh[a], O remnant of Judah. Thus says Yahweh of hosts, the God of Israel: If you are determined to go to Egypt and to go to sojourn there,'
translation:
  language: hi
  text: 'अब इसलिए, हे यहूदा के बचे हुए लोगो, याहवे का वचन सुनो। सेनाओं के याहवे, इस्राएल के परमेश्वर, यह कहते हैं: यदि तुम मिस्र जाने का दृढ़ निश्चय करो[a] और वहाँ परदेशी बनकर रहने के लिए जाओ,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “यदि तुम सचमुच मिस्र जाने के लिए अपना रुख करो”—यह दृढ़ निश्चय व्यक्त करने वाला इब्रानी मुहावरा है।'
    reason: मूल मुहावरे तथा अनन्त क्रिया और परिमित क्रिया की पुनरुक्ति से व्यक्त दृढ़ता को सुरक्षित रखना।
