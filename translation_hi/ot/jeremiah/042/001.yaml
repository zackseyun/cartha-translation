  text: וַֽ/יִּגְּשׁוּ֙ כָּל שָׂרֵ֣י הַ/חֲיָלִ֔ים וְ/יֽוֹחָנָן֙ בֶּן קָרֵ֔חַ וִֽ/יזַנְיָ֖ה בֶּן הוֹשַֽׁעְיָ֑ה וְ/כָל הָ/עָ֖ם מִ/קָּטֹ֥ן וְ/עַד גָּדֽוֹל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/001.yaml
  text: Then all the commanders of the forces approached[a], along with Yohanan son of Kareah and Yizaniah son of Hoshaiah[b], and all the people from the least to the greatest.
translation:
  language: hi
  text: तब सैन्य दलों के सभी अधिकारी[a], कारेह का पुत्र योहानान, होशायाह का पुत्र यज़न्याह, और छोटे से बड़े तक[b] सभी लोग निकट आए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सैन्य दलों के सभी प्रधान” अथवा “सेना के सभी सेनापति।”
    reason: lexical_alternative
  - marker: b
    text: मूल इब्रानी में “छोटे से बड़े तक”; यह पूरे समुदाय के सभी स्तरों के लोगों को समेटने वाली अभिव्यक्ति है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: के पास आए
  rationale: נגשׁ का अर्थ निकट आना है। अगले पद से स्पष्ट होता है कि वे यिर्मयाह के पास आए; हिंदी में यह अभिव्यक्ति स्वाभाविक है, यद्यपि गंतव्य इस पद में निहित है।
- source_word: כָּל שָׂרֵי הַחֲיָלִים
  choice: सेना के सभी अधिकारी
  rationale: שָׂרֵי नेतृत्वकारी सैन्य पद को और חֲיָלִים सैन्य दलों को सूचित करता है। 'सेना के अधिकारी' आधुनिक हिंदी में सहज है और किसी विशिष्ट आधुनिक रैंक को आरोपित नहीं करता।
- source_word: וְיוֹחָנָן בֶּן־קָרֵחַ
  choice: कारेह का पुत्र योहानान
  rationale: नामों का लिप्यंतरण हिब्रू उच्चारण के निकट रखा गया है; בֶּן को स्वाभाविक हिंदी वंशसूचक रूप 'का पुत्र' से व्यक्त किया गया है।
- source_word: וִיזַנְיָה בֶּן־הוֹשַׁעְיָה
  choice: होशायाह का पुत्र यिज़न्याह
  rationale: व्यंजन ז को 'ज़' और ईश्वरीय नामांश को 'याह' से दर्शाते हुए हिब्रू रूप के निकट लिप्यंतरण किया गया है।
- source_word: וְכָל הָעָם
  choice: और ... सभी लोग
  rationale: הָעָם यहाँ एकत्र समुदाय के लोगों को सामूहिक रूप से दर्शाता है; आधुनिक हिंदी में 'सभी लोग' स्वाभाविक है।
- source_word: מִקָּטֹן וְעַד־גָּדוֹל
  choice: छोटे से लेकर बड़े तक
  rationale: मूल का व्यापकता-सूचक युग्म ज्यों का त्यों रखा गया है। यह समुदाय के हर स्तर के लोगों को समेटता है और केवल आयु का निश्चित अर्थ आरोपित नहीं करता।
