  text: וְ/עַתָּה֙ יָדֹ֣עַ תֵּֽדְע֔וּ כִּ֗י בַּ/חֶ֛רֶב בָּ/רָעָ֥ב וּ/בַ/דֶּ֖בֶר תָּמ֑וּתוּ בַּ/מָּקוֹם֙ אֲשֶׁ֣ר חֲפַצְתֶּ֔ם לָ/ב֖וֹא לָ/ג֥וּר שָֽׁם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/022.yaml
  text: Now therefore[a], know for certain that you will die by the sword, by famine, and by pestilence in the place where you desired to go to sojourn there.
translation:
  language: hi
  text: इसलिए अब यह निश्चित जान लो कि जिस स्थान पर तुम परदेशी होकर रहने के लिए जाना चाहते थे, वहीं तुम तलवार, अकाल और महामारी[a] से मरोगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “संक्रामक रोग” या “महामारी।” इब्रानी शब्द व्यापक रूप से फैलने वाले रोग को भी सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: इसलिए अब
  rationale: यह पिछले कथन के परिणामस्वरूप आने वाली गंभीर चेतावनी की ओर संकेत करता है; ‘इसलिए’ प्रसंगगत निष्कर्ष और ‘अब’ तात्कालिकता को व्यक्त करता है।
- source_word: יָדֹעַ תֵּדְעוּ
  choice: यह निश्चित जान लो
  rationale: क्रिया के साथ प्रयुक्त धात्वर्थक रूप ज्ञान की निश्चितता पर बल देता है; यह हिंदी में स्वाभाविक रीति से उस जोर को बनाए रखता है।
- source_word: בַּחֶרֶב בָּרָעָב וּבַדֶּבֶר
  choice: तलवार, अकाल और महामारी से
  rationale: यह भविष्यद्वक्ताओं में बार-बार आने वाली न्याय की त्रयी है। समानांतर और संक्षिप्त अभिव्यक्ति उसके गंभीर स्वर को बनाए रखती है।
- source_word: תָּמוּתוּ
  choice: तुम ... मरोगे
  rationale: यहाँ कथन एक निश्चित भावी परिणाम की घोषणा करता है; साधारण भविष्यकाल आधुनिक हिंदी में स्पष्ट और गंभीर है।
- source_word: אֲשֶׁר חֲפַצְתֶּם לָבוֹא
  choice: जहाँ ... जाने की इच्छा की थी
  rationale: חפץ इच्छा या चाह को व्यक्त करता है। भूतकाल उस पहले से किए गए निश्चय और उनके चुने हुए गंतव्य की विडंबना को सुरक्षित रखता है।
- source_word: לָגוּר שָׁם
  choice: परदेशी होकर रहने के लिए
  rationale: גור केवल रहने के बजाय किसी स्थान में परदेशी या अस्थायी निवासी के रूप में बसने का भाव रखता है।
theological_decisions:
- issue: न्याय की त्रयी חרב / רעב / דבר का अनुवाद
  choice: तलवार, अकाल और महामारी
  alternative: तलवार, अकाल और संक्रामक रोग
  rationale: चुना गया रूप परिचित भविष्यद्वाणी-संबंधी त्रयी और उसके न्याय के भार को बनाए रखता है, जबकि पादटिप्पणी דבר के व्यापक रोग-संबंधी अर्थ को खुला रखती है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘परदेशी होकर रहने’ से גור की अस्थायी अथवा विदेशी निवास की विशेषता बचती है। पादटिप्पणी-चिह्न को उसी शब्द ‘महामारी’ पर रखा गया है जिससे वह संबंधित है।
