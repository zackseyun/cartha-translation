reference: Jeremiah 42:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וָ/אַגִּ֥ד לָ/כֶ֖ם הַ/יּ֑וֹם וְ/לֹ֣א שְׁמַעְתֶּ֗ם בְּ/קוֹל֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם וּ/לְ/כֹ֖ל אֲשֶׁר שְׁלָחַ֥/נִי אֲלֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/021.yaml
  text: I have told you today[a], but you have not obeyed the voice of Yahweh your God or anything for which he sent me to you.
translation:
  language: hi
  text: मैंने आज तुम्हें बता दिया है[a], पर तुमने न तो अपने परमेश्वर याहवे की वाणी मानी, न उन सब बातों को माना जिन्हें लेकर उसने मुझे तुम्हारे पास भेजा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैंने आज तुम्हें बताया, पर तुमने अपने परमेश्वर याहवे की वाणी नहीं सुनी, न उन सब बातों को जिन्हें लेकर उसने मुझे तुम्हारे पास भेजा था।”
    reason: ‘वाणी सुनना’ इब्रानी मुहावरे का अधिक शाब्दिक रूप है; संदर्भ में इसका अर्थ वाणी मानना, अर्थात आज्ञापालन करना, है। अंतिम खंड की संक्षिप्त इब्रानी रचना में क्रिया निहित है।
lexical_decisions:
- source_word: וָאַגִּד
  choice: मैंने ... बता दिया है
  rationale: נגד के हिफ़ील रूप का अर्थ ‘बताना/प्रकट करना’ है। पूर्ण हो चुकी घोषणा की वर्तमान प्रासंगिकता दिखाने के लिए स्वाभाविक हिन्दी में ‘बता दिया है’ चुना गया।
- source_word: הַיּוֹם
  choice: आज
  rationale: कालवाचक पद का सीधा और स्वाभाविक आधुनिक हिन्दी रूप ‘आज’ है।
- source_word: וְלֹא שְׁמַעְתֶּם בְּקוֹל
  choice: वाणी नहीं मानी
  rationale: שׁמע בְּקוֹל केवल सुनाई पड़ने के बजाय ध्यान देकर आज्ञापालन करने का भाव रखता है। ‘वाणी नहीं मानी’ मूल रूपक और आज्ञापालन—दोनों को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֵיכֶם
  choice: अपने परमेश्वर
  rationale: द्वितीय पुरुष बहुवचन प्रत्यय का अर्थ ‘तुम्हारे परमेश्वर’ है; हिन्दी वाक्य में ‘अपने परमेश्वर’ अधिक स्वाभाविक है और वही संबंध स्पष्ट करता है।
- source_word: וּלְכֹל אֲשֶׁר שְׁלָחַנִי אֲלֵיכֶם
  choice: और न उस किसी बात को माना जिसके लिए उसने मुझे तुम्हारे पास भेजा था
  rationale: लामेद से जुड़ा यह खंड पहले ‘नहीं माना’ के साथ समन्वित है और संदेश की समग्रता पर बल देता है। हिन्दी में निहित ‘संदेश/बात’ को स्पष्ट करके अर्थ सुबोध रखा गया है, बिना संदेश की विषयवस्तु जोड़ने के।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम प्रत्यक्ष रूप से है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है; ‘प्रभु’ नाम को उपाधि में बदल देता, जबकि ‘यहोवा’ बाद की मिश्रित उच्चारण-परंपरा को दर्शाता है।
- issue: שׁמע בְּקוֹל में सुनने और आज्ञापालन का संबंध
  choice: वाणी नहीं मानी
  alternative: वाणी नहीं सुनी
  rationale: इब्रानी मुहावरा सुनने के साथ आज्ञापालन का भाव रखता है। मुख्य पाठ में ‘मानी’ इस नैतिक उत्तरदायित्व को व्यक्त करता है, जबकि पादटिप्पणी अधिक शाब्दिक विकल्प सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और प्रत्यक्ष संबोधन रखा गया है। ‘वाणी’ मूल קוֹל की छवि को बनाए रखती है, जबकि ‘मानी’ उसके आज्ञापालन-संबंधी बल को स्पष्ट करती है।
