review_pass:
  verdict: revise
  source_fidelity: The draft preserves the divine title, the past/future parallel of wrath being poured out, the temporal clause about entering Egypt, and the fourfold consequence. However, “शाप की शपथ” is not a natural Hindi expression for אָלָה in this context and can misleadingly imply that the people themselves will utter an oath rather than become an object/formula of cursing. The alternative should be placed in the main text, while the oath-related lexical sense remains in the note.
  naturalness: “जलजलाहट” is intelligible but markedly literary/archaic and unnatural for modern standard Hindi. “प्रकोप” is current, dignified, and suitably distinguishes the second term from “क्रोध.” “आतंक का कारण” communicates שַׁמָּה more idiomatically than the comparatively broad “भय का कारण.”
  terminology: “सेनाओं का यहोवा,” “इस्राएल का परमेश्वर,” and “निन्दा” are appropriate. “क्रोध और प्रकोप” retains the Hebrew pairing without excessive lexical novelty. The footnote retains the genuine oath/curse ambiguity of אָלָה without forcing an unnatural compound into the text.
  issues:
  - severity: medium
    issue: “जलजलाहट” is not natural modern standard Hindi in this register.
    rationale: It is an uncommon and stylistically dated term. “प्रकोप” provides a clear, elevated rendering of חֵמָה while preserving its distinction from אַף, “क्रोध.”
  - severity: medium
    issue: “शाप की शपथ” is awkward and may misstate the contextual sense of אָלָה.
    rationale: In the consequence list, the people become a curse-object or curse-formula, rather than simply a “curse’s oath.” “शाप का विषय” is idiomatic Hindi and contextually precise; the note can preserve the lexical sense of a curse-invoking oath.
  - severity: low
    issue: The singular feminine verb “उंडेली गई” follows a paired masculine expression awkwardly.
    rationale: With “क्रोध और प्रकोप,” plural “उंडेले गए” is natural and retains the Hebrew’s paired terms; the later singular “प्रकोप ... उंडेला जाएगा” reflects the Hebrew’s singular future subject.
