  edition: WLC
  text: כִּי֩ כֹ֨ה אָמַ֜ר יְהוָ֣ה צְבָאוֹת֮ אֱלֹהֵ֣י יִשְׂרָאֵל֒ כַּ/אֲשֶׁר֩ נִתַּ֨ךְ אַפִּ֜/י וַ/חֲמָתִ֗/י עַל יֹֽשְׁבֵי֙ יְר֣וּשָׁלִַ֔ם כֵּ֣ן תִּתַּ֤ךְ חֲמָתִ/י֙ עֲלֵי/כֶ֔ם בְּ/בֹאֲ/כֶ֖ם מִצְרָ֑יִם וִ/הְיִיתֶ֞ם לְ/אָלָ֤ה וּ/לְ/שַׁמָּה֙ וְ/לִ/קְלָלָ֣ה וּ/לְ/חֶרְפָּ֔ה וְ/לֹֽא תִרְא֣וּ ע֔וֹד אֶת הַ/מָּק֖וֹם הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/018.yaml
  text: 'For thus says Yahweh of hosts[a], the God of Israel: Just as my anger and my wrath were poured out on the inhabitants of Jerusalem, so my wrath will be poured out on you when you enter Egypt, and you will become an oath, a horror, a curse, and a reproach, and you will never again see this place.'
translation:
  language: hi
  text: 'क्योंकि सेनाओं का यहोवा[a], इस्राएल का परमेश्वर, यह कहता है: जैसे मेरा क्रोध और मेरा प्रकोप यरूशलेम के निवासियों पर उंडेले गए, वैसे ही जब तुम मिस्र में प्रवेश करोगे, तब मेरा प्रकोप तुम पर उंडेला जाएगा। तुम शाप का विषय[b], आतंक का कारण, शाप और निन्दा बन जाओगे; और इस स्थान को फिर कभी नहीं देखोगे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “सेनाओं का यहोवा” परमेश्वर की एक उपाधि है; “सेनाएँ” स्वर्गीय और पृथ्वी की सेनाओं की ओर संकेत कर सकती हैं।
    reason: दिव्य उपाधि के व्यापक आशय को स्पष्ट करना।
  - marker: b
    text: या “शाप बुलाने वाली शपथ”; इब्रानी शब्द ऐसी शपथ का भी अर्थ दे सकता है जिसमें शाप बुलाया जाता है।
    reason: मूल शब्द की शपथ और शाप-संबंधी वास्तविक अर्थगत अस्पष्टता सुरक्षित रखना।
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का यहोवा
  rationale: दिव्य नाम को लिप्यंतरित रूप में रखा गया है और צְבָאוֹת को 'सेनाओं' से व्यक्त किया गया है, जिससे उपाधि का सैन्य तथा व्यापक स्वर्गीय आशय खुला रहता है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल का परमेश्वर
  rationale: इब्रानी संबंधवाचक पदबंध का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: נִתַּךְ ... תִּתַּךְ
  choice: उंडेली गई ... उंडेली जाएगी
  rationale: क्रोध को तरल पदार्थ की तरह उंडेलने का मूल रूपक और भूतकाल-भविष्यकाल का समानांतर सुरक्षित रखा गया है।
- source_word: אַפִּי וַחֲמָתִי
  choice: मेरा क्रोध और मेरी जलजलाहट
  rationale: दो निकटार्थक न्याय-सूचक शब्दों को अलग-अलग रखकर इब्रानी की तीव्रता और पुनरुक्ति सुरक्षित की गई है।
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: यरूशलेम के निवासी
  rationale: सहभागी रूप का स्वाभाविक आधुनिक हिन्दी अनुवाद।
- source_word: בְּבֹאֲכֶם מִצְרָיִם
  choice: जब तुम मिस्र में प्रवेश करोगे
  rationale: ב के साथ infinitive construct का समयवाचक अर्थ और मिस्र में आने/जाने की गति दोनों स्पष्ट होते हैं।
- source_word: לְאָלָה
  choice: शाप की शपथ
  rationale: אָלָה में शपथ और उसके द्वारा बुलाए गए शाप, दोनों का अर्थ संभव है; संयुक्त अभिव्यक्ति उस द्विअर्थता को संक्षेप में सुरक्षित रखती है।
- source_word: לְשַׁמָּה
  choice: भय का कारण
  rationale: यह पद विनाश देखकर उत्पन्न स्तब्ध भय या आतंक को दर्शाता है; हिन्दी में परिणामसूचक रूप अधिक स्वाभाविक है।
- source_word: לִקְלָלָה
  choice: शाप
  rationale: संदर्भ में वे शाप देने की मिसाल अथवा विषय बनेंगे; संक्षिप्त संज्ञा मूल सूची की लय बनाए रखती है।
- source_word: לְחֶרְפָּה
  choice: निन्दा
  rationale: यह सार्वजनिक अपमान, तिरस्कार और बदनामी का व्यापक अर्थ व्यक्त करता है।
theological_decisions:
- issue: दिव्य न्याय के लिए אַף और חֵמָה की युग्मित अभिव्यक्ति
  choice: क्रोध और जलजलाहट
  alternative: क्रोध और प्रकोप
  rationale: दोनों पदों को एक शब्द में मिलाने के बजाय अलग रखा गया है, ताकि मूल की अलंकारिक तीव्रता बनी रहे; אַף का शाब्दिक 'नाक' यहाँ स्पष्ट मुहावरे के कारण नहीं अपनाया गया।
- issue: אָלָה का अर्थ
  choice: शाप की शपथ
  alternative: शाप का विषय
  rationale: यह शब्द शपथ, विशेषकर शाप बुलाने वाली शपथ, या ऐसी शापोक्ति का विषय—दोनों सूचित कर सकता है। मुख्य पाठ और पादटिप्पणी इस वास्तविक अस्पष्टता को बनाए रखते हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। न्याय की तरल-वस्तु वाली छवि, समानांतर वाक्यरचना और चार परिणामसूचक संज्ञाओं की सूची को यथासंभव सुरक्षित रखा गया है।
