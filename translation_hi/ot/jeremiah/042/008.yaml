  text: וַ/יִּקְרָ֗א אֶל יֽוֹחָנָן֙ בֶּן קָרֵ֔חַ וְ/אֶ֛ל כָּל שָׂרֵ֥י הַ/חֲיָלִ֖ים אֲשֶׁ֣ר אִתּ֑/וֹ וּ/לְ/כָ֨ל הָ/עָ֔ם לְ/מִ/קָּטֹ֥ן וְ/עַד גָּדֽוֹל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/008.yaml
  text: Then he called Johanan son of Kareah, all the commanders of the forces who were with him, and all the people, from the least to the greatest,
translation:
  language: hi
  text: तब उसने कारेह के पुत्र योहानान को, उसके साथ के सभी सेनानायकों को, और छोटे से लेकर बड़े तक सब लोगों को बुलाया,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: तब उसने ... बुलाया
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ क्रम को स्वाभाविक हिन्दी में व्यक्त करता है। קרא का सामान्य अर्थ यहाँ ‘बुलाना’ है।
- source_word: יוֹחָנָן בֶּן קָרֵחַ
  choice: कारेह के पुत्र योहानान
  rationale: नामों का मानक हिन्दी लिप्यंतरण किया गया है और इब्रानी पितृनाम-संबंध को ‘के पुत्र’ के द्वारा बनाए रखा गया है।
- source_word: כָּל שָׂרֵי הַחֲיָלִים
  choice: सभी सेनानायकों
  rationale: सैन्य संदर्भ में שָׂרֵי नेतृत्व करने वाले अधिकारियों को और חֲיָלִים सैन्य दलों को सूचित करता है। संक्षिप्त और स्वाभाविक हिन्दी में ‘सेनानायक’ दोनों के संयुक्त आशय को व्यक्त करता है।
- source_word: אֲשֶׁר אִתּוֹ
  choice: उसके साथ के
  rationale: यह संबंधवाचक पद योहानान के साथ उपस्थित या संबद्ध सैन्य अगुओं को दर्शाता है। ‘उसके साथ के’ आधुनिक हिन्दी में सहज है और संबंध को सुरक्षित रखता है।
- source_word: וּלְכָל הָעָם
  choice: और ... सब लोगों को
  rationale: लामेद बुलाए जाने वाले अगले समूह को चिह्नित करता है; हिन्दी में ‘को’ को समन्वित पद के अंत में रखना स्वाभाविक है।
- source_word: לְמִקָּטֹן וְעַד גָּדוֹל
  choice: छोटे से लेकर बड़े तक
  rationale: यह मुहावरा पूरे सामाजिक या सामुदायिक विस्तार को समेटता है। ‘छोटे से लेकर बड़े तक’ हिन्दी का स्वाभाविक समतुल्य है और इसे शारीरिक आकार तक सीमित नहीं करता।
