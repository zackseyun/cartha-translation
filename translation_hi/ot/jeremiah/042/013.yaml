- source_word: אֱלֹהֵיכֶם
  choice: अपने परमेश्वर
  rationale: द्वितीय पुरुष बहुवचन सम्बन्ध को हिन्दी में ‘अपने परमेश्वर’ स्वाभाविक रूप से व्यक्त करता है और वाचा-संबंधी सम्बोधन बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है। ‘यहवे’ उसे उपाधि में बदले बिना आधुनिक हिन्दी लिपि में प्रस्तुत करता है।
- issue: שׁמע בְקול का अर्थ
  choice: वाणी मानना
  alternative: वाणी सुनना; आज्ञा मानना
  rationale: यह अभिव्यक्ति केवल श्रवण नहीं, प्रत्युत्तरकारी आज्ञापालन का संकेत देती है। ‘वाणी मानना’ मूल की वाणी-छवि और आज्ञापालन का भाव दोनों बनाए रखता है।
- issue: לְבִלְתִּי का संबंध
  choice: और इस प्रकार ... नहीं मानते
  alternative: ताकि ... न मानें; ... की वाणी न मानकर
  rationale: यहाँ उद्देश्य और परिणाम के बीच कुछ व्याकरणिक तनाव है। चुनी हुई अभिव्यक्ति किसी एक अर्थ को अनावश्यक रूप से कठोर नहीं बनाती और पिछले कथन से उसका संबंध स्पष्ट रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन बहुवचन ‘तुम’ में रखा गया है। शैली गरिमापूर्ण पर सामान्य पाठक के लिए सहज है। पद अगले वाक्य में जारी रहता है, इसलिए अंत में दीर्घ डैश रखा गया है।
