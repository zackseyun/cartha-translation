- source_word: בָּאָרֶץ הַזֹּאת
  choice: इस देश में
  rationale: इस प्रसंग में אֶרֶץ यहूदा के भूभाग और राजनीतिक-भौगोलिक निवास-स्थान को दर्शाता है; ‘देश’ सामान्य हिन्दी में सहज है।
- source_word: לְבִלְתִּי שְׁמֹעַ בְּקוֹל
  choice: और इस प्रकार ... की वाणी नहीं मानते
