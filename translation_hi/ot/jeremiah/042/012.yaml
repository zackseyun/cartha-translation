source:
  edition: WLC
  text: וְ/אֶתֵּ֥ן לָ/כֶ֛ם רַחֲמִ֖ים וְ/רִחַ֣ם אֶתְ/כֶ֑ם וְ/הֵשִׁ֥יב אֶתְ/כֶ֖ם אֶל אַדְמַתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/012.yaml
  text: And I will show you mercy[a], and he will have mercy on you and restore you to your own land.
translation:
  language: hi
  text: और मैं तुम पर दया करूँगा[a], और वह तुम पर दया करेगा और तुम्हें तुम्हारी भूमि में लौटा देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “और मैं तुम्हें दया दूँगा; और वह तुम पर दया करेगा और तुम्हें तुम्हारी भूमि में लौटा देगा।”
    reason: נתן का मूल अर्थ ‘देना’ है, और इब्रानी में उसका कर्म רַחֲמִים (‘दया/करुणा’) है; मुख्य पाठ में स्वाभाविक हिन्दी मुहावरे का प्रयोग किया गया है।
lexical_decisions:
- source_word: וְ/אֶתֵּן לָ/כֶם רַחֲמִים
  choice: और मैं तुम पर दया करूँगा
  rationale: शाब्दिक संरचना ‘मैं तुम्हें दया दूँगा’ है, पर आधुनिक हिन्दी में ‘तुम पर दया करूँगा’ स्वाभाविक है और רַחֲמִים का दया/करुणा का भाव सुरक्षित रखती है। वैकल्पिक शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: וְ/רִחַם אֶתְ/כֶם
  choice: और वह तुम पर दया करके
  rationale: तीसरे पुरुष एकवचन को स्पष्ट रूप से बनाए रखा गया है। ‘दया’ के प्रयोग से संज्ञा רַחֲמִים और सजातीय क्रिया רחם की शब्दगत प्रतिध्वनि भी बनी रहती है।
- source_word: וְ/הֵשִׁיב אֶתְ/כֶם
  choice: तुम्हें ... वापस पहुँचा देगा
  rationale: שוב के हिफ़ील रूप का कारक अर्थ ‘वापस ले आना/पहुँचा देना’ है। यहाँ राजा के द्वारा उन्हें उनकी भूमि में लौटाए जाने के संदर्भ में यह सहज हिन्दी है।
- source_word: אֶל אַדְמַתְ/כֶם
  choice: तुम्हारी भूमि में
  rationale: אֶל गंतव्य की ओर गति और אַדְמָה भूमि/धरती को व्यक्त करता है। ‘तुम्हारी भूमि में’ वापसी के आशय को स्वाभाविक हिन्दी में प्रकट करता है।
theological_decisions:
- issue: ईश्वर के प्रथम पुरुष से तीसरे पुरुष पुल्लिंग एकवचन में कर्ता-परिवर्तन
  choice: ‘मैं ... करूँगा’ के बाद ‘वह ... पहुँचा देगा’
  alternative: 'सभी क्रियाओं को ईश्वर के प्रथम पुरुष में कर देना: ‘मैं ... तुम्हें वापस पहुँचा दूँगा’'
  rationale: इब्रानी में אֶתֵּן प्रथम पुरुष एकवचन है, जबकि רִחַם और הֵשִׁיב तीसरे पुरुष पुल्लिंग एकवचन हैं। इस परिवर्तन को बनाए रखने से मूल की वास्तविक व्याकरणिक और धार्मिक तनावपूर्णता सुरक्षित रहती है; प्रसंग में ‘वह’ बाबेल के राजा की ओर संकेत करता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। बहुवचन ‘तुम’ मूल के לָכֶם/אֶתְכֶם को दर्शाता है। तीसरे पुरुष ‘वह’ को हटाया या ईश्वर के प्रथम पुरुष में समतल नहीं किया गया।
