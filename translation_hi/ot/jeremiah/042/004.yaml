base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/004.yaml
  text: Then Jeremiah the prophet said to them[a], “I have heard. Behold, I am praying to Yahweh your God according to your words, and whatever Yahweh answers you, I will tell you[b]. I will not withhold a word from you.”
translation:
  language: hi
  text: तब यिर्मयाह नबी ने उनसे कहा, “मैंने आपकी बात सुन ली है। देखिए, मैं आपकी बातों के अनुसार[a] आपके परमेश्वर याहवे से प्रार्थना करूँगा। याहवे आपको जो भी उत्तर देगा, वह मैं आपको बता दूँगा; मैं आपसे कोई बात नहीं रोकूँगा[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “तुम्हारे शब्दों के अनुसार”; अर्थात जैसा आपने निवेदन किया है।'
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक अर्थ: “मैं तुमसे एक भी बात नहीं रोकूँगा।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; आधुनिक हिन्दी में ‘तब’ स्वाभाविक रूप से क्रम व्यक्त करता है।
- source_word: יִרְמְיָהוּ הַנָּבִיא
  choice: यिर्मयाह नबी
  rationale: व्यक्तिनाम का प्रचलित हिन्दी रूप और נָבִיא के लिए सहज, गरिमापूर्ण ‘नबी’ रखा गया है।
- source_word: שָׁמַעְתִּי
  choice: मैंने आपकी बात सुन ली है
  rationale: पूर्ण क्रिया यहाँ लोगों के निवेदन को ग्रहण करने और उसके वर्तमान परिणाम को व्यक्त करती है; ‘बात’ प्रसंग से स्पष्ट की गई है।
- source_word: הִנְנִי מִתְפַּלֵּל
  choice: देखिए, मैं ... प्रार्थना करूँगा
  rationale: הִנְנִי ध्यान आकर्षित करता है और कृदंत आसन्न कार्रवाई दर्शा सकता है। हिन्दी में ‘देखिए’ और भविष्यकाल इस प्रत्युत्तर को स्वाभाविक बनाते हैं।
- source_word: אֶל יְהוָה אֱלֹהֵיכֶם
  choice: याहवे, आपके परमेश्वर से
  rationale: दैवी नाम को ‘याहवे’ के रूप में रखा गया है और बहुवचन संबोधन के सम्मानसूचक हिन्दी रूप में ‘आपके’ आया है।
- source_word: כְּדִבְרֵיכֶם
  choice: आपकी बात के अनुसार
  rationale: शाब्दिक अर्थ ‘तुम्हारे शब्दों के अनुसार’ है; हिन्दी में यह उनके कहे और किए गए निवेदन दोनों को स्वाभाविक ढंग से दर्शाता है।
- source_word: כָּל הַדָּבָר אֲשֶׁר יַעֲנֶה יְהוָה אֶתְכֶם
  choice: याहवे आपको जो भी उत्तर देगा
  rationale: ‘जो भी’ पूरे उत्तर की अनिर्धारित विषयवस्तु को समेटता है और ענה ... אתכם को ‘आपको उत्तर देगा’ के रूप में सीधे व्यक्त करता है।
- source_word: אַגִּיד לָכֶם
  choice: वह मैं आपको बता दूँगा
  rationale: हिफ़िल क्रिया का अर्थ किसी बात को प्रकट या ज्ञात कराना है; ‘बता दूँगा’ पूर्ण और स्पष्ट संप्रेषण का वादा व्यक्त करता है।
- source_word: לֹא אֶמְנַע מִכֶּם דָּבָר
  choice: मैं आपसे एक भी बात नहीं छिपाऊँगा
  rationale: מנע का अर्थ रोक रखना है। ‘एक भी बात नहीं छिपाऊँगा’ आधुनिक हिन्दी में पूर्ण प्रकटीकरण का भाव देता है, जबकि पादटिप्पणी अधिक शाब्दिक रूप सुरक्षित रखती है।
theological_decisions:
- issue: दैवी नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुरक्षरी दैवी नाम सीधे दो बार आया है। ‘याहवे’ उसे उपाधि में बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: אֱלֹהֵיכֶם में ‘तुम्हारे परमेश्वर’
  choice: आपके परमेश्वर
  alternative: हमारे परमेश्वर
  rationale: यिर्मयाह लोगों के अपने शब्दों को बनाए रखते हुए ‘तुम्हारे/आपके परमेश्वर’ कहता है। इसे ‘हमारे’ में बदलने से पाठ का सूक्ष्म तनाव मिट जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानसूचक बहुवचन ‘आप’, और गरिमापूर्ण किंतु सामान्य पाठकों के लिए सहज शैली अपनाई गई है। ‘नबी’ और ‘याहवे’ बाइबिलीय संदर्भ को स्पष्ट रखते हैं; अत्यधिक संस्कृतनिष्ठ शब्दावली से बचा गया है।
