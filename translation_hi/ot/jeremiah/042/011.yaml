id: JER.42.11
reference: Jeremiah 42:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אַל תִּֽירְא֗וּ מִ/פְּנֵי֙ מֶ֣לֶךְ בָּבֶ֔ל אֲשֶׁר אַתֶּ֥ם יְרֵאִ֖ים מִ/פָּנָ֑י/ו אַל תִּֽירְא֤וּ מִמֶּ֨/נּוּ֙ נְאֻם יְהוָ֔ה כִּֽי אִתְּ/כֶ֣ם אָ֔נִי לְ/הוֹשִׁ֧יעַ אֶתְ/כֶ֛ם וּ/לְ/הַצִּ֥יל אֶתְ/כֶ֖ם מִ/יָּדֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/011.yaml
  text: Do not fear the king of Babylon[a], before whom you are afraid. Do not fear him, declares Yahweh[b], for I am with you to save you and to deliver you from his hand.
translation:
  language: hi
  text: बाबेल के राजा से मत डरो, जिससे तुम डरते हो। उससे मत डरो—यह याहवे[a] की घोषणा है—क्योंकि मैं तुम्हारे साथ हूँ, ताकि तुम्हें बचाऊँ और उसके हाथ से छुड़ाऊँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: יהוה (YHWH), परमेश्वर का विशिष्ट नाम; हिन्दी में इसे ‘यहोवा’ भी लिखा जाता है और अनेक अनुवादों में ‘प्रभु’ दिया जाता है।'
    reason: divine_name
lexical_decisions:
- source_word: תִּירְאוּ / יְרֵאִים
  choice: मत डरो / डरते हो
  rationale: दोनों रूपों में एक ही धातु ירא की पुनरावृत्ति को स्वाभाविक हिन्दी में बनाए रखा गया है। कृदन्त יְרֵאִים उनके वर्तमान और जारी भय को दर्शाता है; ‘डरते हो’ इसे बिना कृत्रिमता के व्यक्त करता है।
- source_word: מִפְּנֵי ... מִפָּנָיו
  choice: बाबेल के राजा से ... जिससे
  rationale: यहाँ מִן + פָּנִים, ירא के साथ, किसी व्यक्ति से डरने का इब्रानी मुहावरा है। शाब्दिक ‘उसके मुख के सामने से’ आधुनिक हिन्दी में भ्रामक होता, इसलिए अर्थ को स्वाभाविक रूप में दिया गया है।
- source_word: מֶלֶךְ בָּבֶל
  choice: बाबेल का राजा
  rationale: यह इब्रानी संबंध-रचना का स्पष्ट और प्रचलित हिन्दी रूप है।
- source_word: מִמֶּנּוּ
  choice: उससे
  rationale: ירא के बाद आया संबंधसूचक रूप हिन्दी में ‘उससे डरना’ के रूप में स्वाभाविक है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: नबी-संबंधी स्थिर सूत्र נְאֻם को गरिमापूर्ण और स्पष्ट आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में आए परमेश्वर के विशिष्ट नाम को उपाधि में बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: כִּי אִתְּכֶם אָנִי
  choice: क्योंकि मैं तुम्हारे साथ हूँ
  rationale: כִּי आज्ञा का आधार बताता है, और इब्रानी में ‘तुम्हारे साथ’ पर आए बल को हिन्दी का यह क्रम स्वाभाविक रूप से सुरक्षित रखता है।
- source_word: לְהוֹשִׁיעַ
  choice: तुम्हें बचाऊँ
  rationale: ישׁע के हिफ़ील रूप का सामान्य अर्थ ‘बचाना’ है; अगले अलग क्रियापद से इसका भेद भी बना रहता है।
- source_word: וּלְהַצִּיל
  choice: और ... छुड़ाऊँ
  rationale: נצל को ‘छुड़ाना’ कहना पहले क्रियापद ‘बचाना’ से शब्दगत भेद बनाए रखता है और शत्रु के अधिकार से निकालने का भाव देता है।
- source_word: מִיָּדוֹ
  choice: उसके हाथ से
  rationale: ‘हाथ’ अधिकार या नियंत्रण का इब्रानी रूपक है। यह बाइबलीय मुहावरा हिन्दी में भी बोधगम्य है, इसलिए इसे सुरक्षित रखा गया है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: पद में चतुरक्षरीय विशिष्ट नाम सीधे उपस्थित है। ‘याहवे’ मूल नाम और उसके वाचक स्वरूप को बनाए रखता है; पादटिप्पणी पाठक को अन्य परिचित रूपों से अवगत कराती है, बिना मुख्य पाठ में किसी एक परम्परागत उपाधि को आरोपित किए।
- issue: उद्धार बताने वाली दो निकटार्थक क्रियाओं का संबंध
  choice: बचाऊँ और ... छुड़ाऊँ
  alternative: दोनों को ‘बचाऊँ’ कहना
  rationale: לְהוֹשִׁיעַ और לְהַצִּיל अलग क्रियाएँ हैं। दो हिन्दी क्रियाएँ रखने से इब्रानी समानांतरता और अर्थगत सूक्ष्म भेद दोनों सुरक्षित रहते हैं; इसे किसी विशेष धर्मवैज्ञानिक क्रम के रूप में नहीं समझाया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सीधी और गरिमापूर्ण रखी गई है। ‘मत डरो’ की पुनरावृत्ति मूल पाठ के आग्रह को बनाए रखती है। ‘उसके हाथ से’ जैसे समझ में आने वाले बाइबलीय रूपक को सुरक्षित रखा गया है; अनावश्यक संस्कृतनिष्ठता से बचा गया है।
