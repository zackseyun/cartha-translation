base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/020.yaml
  text: We acknowledge[a], O Yahweh, our wickedness, the iniquity of our fathers, for we have sinned against you.
translation:
  language: hi
  text: हे याहवे, हम अपनी दुष्टता और हमारे पिताओं[a] के अधर्म को स्वीकार करते हैं, क्योंकि हमने तेरे विरुद्ध पाप किया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमारे पुरखाओं के।” इब्रानी में शाब्दिक रूप से “हमारे पिताओं” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדַעְנוּ
  choice: हम ... स्वीकार करते हैं
  rationale: ידע का मूल अर्थ ‘जानना’ है, पर इस पश्चात्तापपूर्ण संदर्भ में यह अपने दोष को पहचानने और मान लेने का भाव देता है। ‘स्वीकार करते हैं’ संज्ञान और अंगीकार—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: हे यहोवा
  rationale: हिन्दी बाइबल परंपरा में प्रचलित नामरूप ‘यहोवा’ रखा गया है; सम्बोधन को ‘हे’ से व्यक्त किया गया है।
- source_word: רִשְׁעֵנוּ
  choice: अपनी दुष्टता
  rationale: רֶשַׁע यहाँ नैतिक बुराई अथवा दुष्टता का अमूर्त बोध कराता है और अगले पद ‘अधर्म’ के साथ समानांतर है।
- source_word: עֲוֺן
  choice: अधर्म
  rationale: עָוֹן अपराध, दोष या उसके परिणाम का बोध करा सकता है। यहाँ ‘दुष्टता’ और ‘पाप किया’ के बीच ‘अधर्म’ इसकी नैतिक गंभीरता और अलग शब्दावली को बनाए रखता है।
- source_word: אֲבוֹתֵינוּ
  choice: अपने पुरखाओं
  rationale: शाब्दिक अर्थ ‘हमारे पिताओं’ है, पर यहाँ सामूहिक पूर्वजों का संकेत है। ‘पुरखाओं’ हिन्दी में पुरुषवाची रूप और वंशगत संदर्भ दोनों को स्वाभाविक ढंग से सुरक्षित रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह स्वीकारोक्ति का कारण प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ स्पष्ट और स्वाभाविक है।
- source_word: חָטָאנוּ
  choice: हमने ... पाप किया है
  rationale: पूर्ण क्रिया को वर्तमान प्रासंगिकता वाली स्वीकारोक्ति के रूप में हिन्दी पूर्णकाल से व्यक्त किया गया है।
- source_word: לָךְ
  choice: तेरे विरुद्ध
  rationale: חטא के साथ यह उपसर्ग उस व्यक्ति को सूचित करता है जिसके विरुद्ध पाप हुआ; हिन्दी में ‘विरुद्ध पाप करना’ स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में उपाधि नहीं, चतुरक्षरीय व्यक्तिगत नाम है। इसलिए ‘प्रभु’ से प्रतिस्थापित नहीं किया गया; हिन्दी पाठकों में व्यापक रूप से पहचाने जाने वाले नामरूप ‘यहोवा’ को रखा गया।
- issue: אֲבוֹתֵינוּ का लिंग और दायरा
  choice: पुरखाओं
  alternative: पिताओं / पूर्वजों
  rationale: मूल रूप पुल्लिंग बहुवचन है। ‘पुरखाओं’ उस पुरुषवाची रूप को बनाए रखते हुए यहाँ अभिप्रेत पिछली पीढ़ियों के व्यापक वंशगत भाव को भी व्यक्त करता है।
- issue: वर्तमान पीढ़ी और पुरखाओं के अधर्म का संबंध
  choice: दुष्टता को वर्तमान समुदाय की और अधर्म को पुरखाओं का बताया गया है
  alternative: दोनों को सामूहिक वंशगत दोष के रूप में मिला देना
  rationale: मूल की व्याकरणिक रचना ‘हमारी दुष्टता, हमारे पुरखाओं का अधर्म’ का भेद रखती है; अनुवाद उस तनाव को बनाए रखता है और विरासत में मिले व्यक्तिगत दोष का कोई अतिरिक्त सिद्धांत नहीं जोड़ता।
translation_notes:
  register: आधुनिक, प्रार्थनात्मक और गरिमापूर्ण हिन्दी। परमेश्वर के लिए निकट संबोधन ‘तेरे’ रखा गया है, और तीन अलग नैतिक पदों—दुष्टता, अधर्म, पाप—का भेद यथासंभव सुरक्षित है।
