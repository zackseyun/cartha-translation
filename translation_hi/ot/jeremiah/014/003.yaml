base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/003.yaml
  text: Their nobles send their servants for water[a]; they come to the cisterns and find no water. They return with their containers empty; they are ashamed and humiliated[c][b], and they cover their heads.
translation:
  language: hi
  text: उनके प्रमुख लोगों ने अपने सेवकों[a] को पानी लाने भेजा। वे जलकुंडों[b] तक पहुँचे, पर पानी नहीं पाया। वे अपने पात्र खाली लेकर लौटे; वे लज्जित और अपमानित हुए और उन्होंने अपने सिर ढक लिए[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपने युवकों’ अथवा ‘अपने छोटों’ को। मूल शब्द (צְעוּרֵיהֶם) आयु में छोटे या सामाजिक रूप से अधीन लोगों को दर्शा सकता है; यहाँ संदर्भ सेवकों का संकेत देता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘गड्ढों’ अथवा ‘जलाशयों’ पर।
    reason: lexical_alternative
  - marker: c
    text: सिर ढकना लज्जा, शोक या संकट का सांस्कृतिक संकेत था।
    reason: cultural_note
lexical_decisions:
- source_word: אַדִּירֵיהֶם
  choice: उनके प्रतिष्ठित लोग
  rationale: यह शब्द सामर्थ्यवान, प्रमुख या कुलीन व्यक्तियों को दर्शाता है। अकाल के इस सामाजिक संदर्भ में ‘प्रतिष्ठित लोग’ स्वाभाविक है और उनके अधीन भेजे गए लोगों से उनका अंतर स्पष्ट करता है।
- source_word: צְעוּרֵיהֶם
  choice: अपने सेवकों
  rationale: मूल शब्द का शाब्दिक संबंध छोटे या युवा लोगों से हो सकता है, पर यहाँ बड़े लोगों द्वारा पानी लाने के लिए अधीनस्थों को भेजने का भाव है। इसलिए मुख्य पाठ में ‘सेवकों’ रखा गया और आयु-आधारित विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: לַמָּיִם
  choice: पानी लाने
  rationale: שׁלח के साथ यह पद उद्देश्य बताता है—उन्हें केवल पानी के पास नहीं, बल्कि पानी लाने के लिए भेजा गया।
- source_word: גֵּבִים
  choice: जलकुंडों
  rationale: यह पानी जमा करने वाले खोदे हुए स्थानों, कुंडों या जलाशयों को दर्शाता है। सूखे के संदर्भ में ‘जलकुंड’ सटीक और सहज है।
- source_word: שָׁבוּ כְלֵיהֶם רֵיקָם
  choice: वे अपने पात्र खाली लेकर लौटते हैं
  rationale: वाक्य का आशय है कि पानी रखने के उनके बर्तन खाली हैं जब वे लौटते हैं। ‘पात्र’ मूल के अनिर्दिष्ट כלי को पर्याप्त व्यापकता से व्यक्त करता है।
- source_word: בֹּשׁוּ וְהָכְלְמוּ
  choice: वे लज्जित और अपमानित होते हैं
  rationale: दोनों निकटार्थी क्रियाएँ मिलकर गहरी लज्जा और दुर्दशा पर बल देती हैं; दो अलग शब्द रखने से इब्रानी की समानांतर अभिव्यक्ति बनी रहती है।
- source_word: וְחָפוּ רֹאשָׁם
  choice: और अपने सिर ढक लेते हैं
  rationale: यह मूल सांस्कृतिक संकेत का सीधा अनुवाद है। उसके निहितार्थ को मुख्य पाठ में सीमित करने के बजाय पादटिप्पणी में स्पष्ट किया गया है।
