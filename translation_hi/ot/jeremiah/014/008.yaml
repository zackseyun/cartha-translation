reference: Jeremiah 14:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: מִקְוֵה֙ יִשְׂרָאֵ֔ל מֽוֹשִׁיע֖/וֹ בְּ/עֵ֣ת צָרָ֑ה לָ֤/מָּה תִֽהְיֶה֙ כְּ/גֵ֣ר בָּ/אָ֔רֶץ וּ/כְ/אֹרֵ֖חַ נָטָ֥ה לָ/לֽוּן׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/008.yaml
  text: O Hope of Israel[a], his Savior in time of distress, why should you be like a foreigner in the land[b], like a traveler who turns aside to spend the night?
translation:
  language: hi
  text: हे इस्राएल की आशा, संकट के समय उसके उद्धारकर्ता, आप देश में एक परदेशी[a] के समान क्यों हों, उस यात्री के समान जो रात बिताने के लिए रास्ते से हटकर ठहरता है[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “देश में रहनेवाले निवासी परदेशी के समान।”
    reason: גֵר किसी देश में रहनेवाले, किंतु वहाँ के मूल निवासी न होनेवाले व्यक्ति का भाव दे सकता है; ‘परदेशी’ संक्षिप्त है, जबकि यह विकल्प निवास की बारीकी स्पष्ट करता है।
  - marker: b
    text: या, “उस मुसाफिर के समान, जो केवल रात भर ठहरता है।”
    reason: נָטָה לָלוּן का मुख्य भाव यात्रा के बीच अस्थायी रात्रि-विश्राम है; वैकल्पिक अनुवाद उसके अल्पकालिक ठहराव पर बल देता है।
lexical_decisions:
- source_word: מִקְוֵה
  choice: आशा
  rationale: यहाँ यह संज्ञा परमेश्वर को सीधे संबोधित करती है—वह जिस पर इस्राएल आशा रखता है। ‘आशा’ यिर्मयाह में इसके संदर्भगत और धर्मवैचारिक बल को स्वाभाविक रूप से व्यक्त करती है।
- source_word: מוֹשִׁיעוֹ
  choice: उसके उद्धारकर्ता
  rationale: तीसरे पुरुष एकवचन प्रत्यय सामूहिक एकवचन ‘इस्राएल’ की ओर संकेत करता है। यह रूप मूल व्याकरण और परमेश्वर को दिए गए संबोधन, दोनों को बनाए रखता है।
- source_word: בְּעֵת צָרָה
  choice: संकट के समय
  rationale: यह वाक्यांश विपत्ति अथवा घोर कठिनाई की घड़ी बताता है; ‘संकट के समय’ आधुनिक मानक हिन्दी में स्पष्ट और गंभीर है।
- source_word: לָמָּה תִהְיֶה
  choice: आप ... क्यों हों
  rationale: अपूर्ण क्रिया यहाँ विलापपूर्ण आलंकारिक प्रश्न का भाव रखती है। संभावनार्थक ‘क्यों हों’ उस तनाव को भविष्यवाणी में बदले बिना व्यक्त करता है।
- source_word: כְּגֵר בָּאָרֶץ
  choice: देश में एक परदेशी के समान
  rationale: גֵר ऐसे बाहरी व्यक्ति को दर्शाता है जो किसी देश में रह रहा हो, पर वहाँ का मूल निवासी न हो। ‘परदेशी’ इस बाहरीपन को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וּכְאֹרֵחַ
  choice: उस यात्री के समान
  rationale: אֹרֵחַ यात्रा पर निकले व्यक्ति को दर्शाता है। ‘यात्री’ स्पष्ट, प्रचलित और अनावश्यक रूप से पुरातन नहीं है।
- source_word: נָטָה לָלוּן
  choice: जो रात बिताने के लिए रास्ते से हटकर ठहरता है
  rationale: यह रूप मार्ग से मुड़कर अस्थायी रूप से रात बिताने का भाव देता है। अनुवाद गति और अल्पकालिक ठहराव, दोनों को बनाए रखता है।
theological_decisions:
- issue: परमेश्वर को सीधा संबोधन और उपाधि-सदृश संज्ञाएँ
  choice: 'आरंभ को परमेश्वर के प्रति सीधे संबोधन के रूप में रखा गया है: ‘हे इस्राएल की आशा, संकट के समय उसके उद्धारकर्ता!’'
  alternative: ‘इस्राएल की आशा और संकट के समय उसका उद्धार करनेवाला’ को कथन के रूप में पढ़ना
  rationale: संदर्भ प्रार्थना और विलाप का है; इसलिए आरंभिक संज्ञाएँ परमेश्वर के लिए संबोधन हैं। अनुवाद इसी भक्तिपूर्ण बल को रखता है, पर बाद की किसी विशिष्ट धर्मसैद्धांतिक धारणा को नहीं जोड़ता।
- issue: ईश्वरीय उपस्थिति की अनुभूत दूरी
  choice: ‘परदेशी’ और थोड़ी देर ठहरनेवाले ‘यात्री’ की दोनों उपमाएँ यथावत रखी गई हैं।
  alternative: भाव को स्पष्ट करके कहना कि परमेश्वर ने देश या लोगों को छोड़ दिया है
  rationale: मूल पाठ प्रश्न और उपमा के द्वारा अनुभूत दूरी व्यक्त करता है; वह परमेश्वर के वास्तविक परित्याग का सीधा सिद्धांत प्रस्तुत नहीं करता। इसलिए विलाप का तनाव बिना समाधान जोड़े सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सम्मानसूचक ‘आप’ अपनाया गया है, जबकि ‘हे’ ने प्रार्थनात्मक और गंभीर स्वर बनाए रखा है। पंक्तिविन्यास हिब्रू काव्य की समानांतर उपमाओं को स्पष्ट करता है। ‘उद्धारकर्ता’ परिचित धार्मिक शब्द है, पर वाक्यरचना सरल रखी गई है।
