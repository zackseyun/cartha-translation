source:
  edition: WLC
  text: הֲ/יֵ֨שׁ בְּ/הַבְלֵ֤י הַ/גּוֹיִם֙ מַגְשִׁמִ֔ים וְ/אִם הַ/שָּׁמַ֖יִם יִתְּנ֣וּ רְבִבִ֑ים הֲ/לֹ֨א אַתָּה ה֜וּא יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ וּ֨/נְקַוֶּה לָּ֔/ךְ כִּֽי אַתָּ֥ה עָשִׂ֖יתָ אֶת כָּל אֵֽלֶּה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/022.yaml
  text: Are there any among the idols of the nations that bring rain? Or can the heavens give showers? Is it not you[a], O Yahweh our God? And we wait for you[c][b], for you have made all these things.
translation:
  language: hi
  text: क्या राष्ट्रों की मूर्तियों[a] में से कोई वर्षा करा सकती है? या क्या आकाश बौछारें बरसा सकता है? हे याहवे, हमारे परमेश्वर, क्या आप ही नहीं हैं? और हम आपकी बाट जोहते हैं[b], क्योंकि यह सब आपने ही बनाया है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “राष्ट्रों की व्यर्थताओं”; यहाँ आशय उनके व्यर्थ देवताओं या मूर्तियों से है।
    reason: lexical_alternative
  - marker: b
    text: या “हम आप पर आशा रखते हैं।” इब्रानी क्रिया आशाभरी प्रतीक्षा को व्यक्त कर सकती है।
    reason: lexical_alternative
  - marker: c
    text: या “यह सब आपने ही किया है।”
    reason: alternative_reading
lexical_decisions:
- source_word: הַבְלֵי הַגּוֹיִם
  choice: राष्ट्रों की मूर्तियों
  rationale: הֶבֶל का मूल भाव भाप, व्यर्थता या निष्फलता है, पर इस भविष्यवाणी-संदर्भ में इसका संकेत राष्ट्रों के झूठे देवताओं अथवा उनकी मूर्तियों की ओर है। ‘मूर्तियों’ से आशय सामान्य पाठक के लिए स्पष्ट होता है, जबकि पादटिप्पणी मूल शब्द-चित्र बचाती है।
- source_word: מַגְשִׁמִים
  choice: वर्षा करा सके
  rationale: यह גשם का कारक रूप है और वर्षा उत्पन्न कराने को व्यक्त करता है। ‘वर्षा करा सके’ प्रश्न की अलंकारिक शक्ति और कारक अर्थ दोनों बनाए रखता है।
- source_word: הַשָּׁמַיִם יִתְּנוּ רְבִבִים
  choice: आकाश वर्षा की बौछारें बरसा सकता है
  rationale: रְבִבִים वर्षा की बौछारों या झड़ियों को दर्शाता है। हिंदी में ‘बौछारें बरसाना’ शाब्दिक ‘देना’ की अपेक्षा स्वाभाविक है और वही आशय व्यक्त करता है।
- source_word: הֲלֹא אַתָּה הוּא
  choice: क्या वह आप ही नहीं हैं
  rationale: הוּא के साथ אַתָּה पर दिया गया बल ‘आप ही’ से सुरक्षित रहता है। वाक्य जानबूझकर अलंकारिक और पहचान पर केंद्रित रखा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिंदी में लिप्यंतरित किया गया है।
- source_word: וּנְקַוֶּה לָּךְ
  choice: और हम आपकी बाट जोहते हैं
  rationale: קוה में प्रतीक्षा और आशाभरी अपेक्षा दोनों समाए हैं। ‘बाट जोहते हैं’ इस सक्रिय, आशापूर्ण प्रतीक्षा को संक्षेप में व्यक्त करता है; आरंभिक וּ को ‘और’ से रखा गया है।
- source_word: עָשִׂיתָ אֶת כָּל אֵלֶּה
  choice: इन सबको आपने ही बनाया है
  rationale: עשה का अर्थ ‘करना’ और ‘बनाना’ दोनों हो सकता है। आकाश और वर्षा के प्रसंग में ‘बनाया’ परमेश्वर की सृजनकारी सामर्थ्य को स्वाभाविक रूप से व्यक्त करता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: יְהוָה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ व्यक्तिगत नाम יְהוָה का प्रयोग करता है। ‘याहवे’ उसे उपाधि में बदले बिना प्रस्तुत करता है और पाठ से परे कोई सांप्रदायिक विशिष्टता नहीं जोड़ता।
- issue: הֲלֹא אַתָּה הוּא में एकमात्र दैवी कर्ता पर बल
  choice: क्या वह आप ही नहीं हैं
  alternative: क्या आप नहीं हैं
  rationale: ‘ही’ मूल के emphatic pronoun construction को बनाए रखता है और मूर्तियों तथा याहवे के बीच पाठ में उपस्थित विरोध को स्पष्ट करता है।
- issue: עָשִׂיתָ का अर्थ
  choice: बनाया है
  alternative: किया है
  rationale: तात्कालिक संदर्भ प्राकृतिक जगत और वर्षा पर अधिकार का है, इसलिए ‘बनाया’ उपयुक्त है; फिर भी क्रिया की वास्तविक अर्थगत व्यापकता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में है, पर प्रार्थना और भविष्यवाणी के गरिमापूर्ण स्वर के लिए ‘बाट जोहते हैं’ रखा गया है। आदरसूचक ‘आप’ परमेश्वर को सीधे संबोधन में स्वाभाविक हिंदी प्रयोग देता है। अलंकारिक प्रश्नों, दैवी नाम और मूल पाठ की ‘करना/बनाना’ तथा ‘प्रतीक्षा/आशा’ संबंधी अर्थगत गुंजाइश को सुरक्षित रखा गया है।
