source:
  edition: WLC
  text: אָבְלָ֣ה יְהוּדָ֔ה וּ/שְׁעָרֶ֥י/הָ אֻמְלְל֖וּ קָדְר֣וּ לָ/אָ֑רֶץ וְ/צִוְחַ֥ת יְרוּשָׁלִַ֖ם עָלָֽתָה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/002.yaml
  text: Judah mourns[a], and her gates languish; they grow dark on the ground, and the cry of Jerusalem goes up.
translation:
  language: hi
  text: यहूदा शोक करती है, और उसके फाटक निढाल पड़े हैं; वे भूमि पर काले पड़ गए हैं[a], और यरूशलेम की पुकार ऊपर उठती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे भूमि तक अँधेरे पड़ गए हैं।” इब्रानी क्रिया का अर्थ अँधेरा या काला पड़ना हो सकता है और शोक के प्रसंगों में उसमें शोक का भाव भी हो सकता है।
    reason: कָדְרוּ לָאָרֶץ के अर्थ में ‘काला पड़ना’ और ‘अँधेरा पड़ना’ दोनों संभावित हैं; पादटिप्पणी इस विकल्प और शोक-संदर्भ को बिना अतिरिक्त मुद्रा जोड़े स्पष्ट करती है।
lexical_decisions:
- source_word: אָבְלָה
  choice: शोक में है
  rationale: यह क्रिया शोक करने या दुःखी होने का भाव देती है। वर्तमान अवस्था बताने वाला यह प्रयोग हिन्दी में स्वाभाविक है और काव्यात्मक वर्णन को बनाए रखता है।
- source_word: יְהוּדָה
  choice: यहूदा
  rationale: राष्ट्र और भू-प्रदेश का मानक हिन्दी नाम।
- source_word: שְׁעָרֶיהָ
  choice: उसके फाटक
  rationale: मूल ठोस बिंब को रखा गया है; यहाँ फाटक नगर के सार्वजनिक और सामुदायिक जीवन का भी प्रतिनिधित्व कर सकते हैं।
- source_word: אֻמְלְלוּ
  choice: निढाल पड़े हैं
  rationale: यह रूप दुर्बल, क्षीण या दयनीय हो जाने की परिणामी अवस्था व्यक्त करता है। ‘निढाल पड़े हैं’ सहज हिन्दी में असहायता और शिथिलता दोनों बताता है।
- source_word: קָדְרוּ לָאָרֶץ
  choice: वे शोक में भूमि तक झुक गए हैं
  rationale: קָדְרוּ अँधेरा या काला पड़ने के साथ शोकमय अवस्था भी जता सकता है, और לָאָרֶץ भूमि की ओर दीन मुद्रा का संकेत दे सकता है। मुख्य पाठ में स्वाभाविक हिन्दी और शोक का बिंब रखा गया है; अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: צִוְחַת
  choice: दुहाई
  rationale: यह संकट और पीड़ा में उठी पुकार है। ‘दुहाई’ साधारण पुकार की अपेक्षा व्यथा और सहायता की माँग को अधिक स्पष्ट करती है।
- source_word: יְרוּשָׁלִַם
  choice: यरूशलेम
  rationale: नगर का मानक हिन्दी नाम।
- source_word: עָלָתָה
  choice: ऊपर उठ रही है
  rationale: मूल क्रिया के ऊपर चढ़ने या उठने के ठोस बिंब को बनाए रखते हुए हिन्दी में चल रही करुण पुकार का स्वाभाविक वर्णन किया गया है।
