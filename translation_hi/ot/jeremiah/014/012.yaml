id: JER.14.12
reference: Jeremiah 14:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֣י יָצֻ֗מוּ אֵינֶ֤/נִּי שֹׁמֵ֨עַ֙ אֶל רִנָּתָ֔/ם וְ/כִ֧י יַעֲל֛וּ עֹלָ֥ה וּ/מִנְחָ֖ה אֵינֶ֣/נִּי רֹצָ֑/ם כִּ֗י בַּ/חֶ֨רֶב֙ וּ/בָ/רָעָ֣ב וּ/בַ/דֶּ֔בֶר אָנֹכִ֖י מְכַלֶּ֥ה אוֹתָֽ/ם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/012.yaml
  text: Though they fast[a], I do not hear their cry; and though they offer up burnt offering and grain offering, I do not accept them. Rather, by the sword, by famine[d][c][b], and by pestilence I am consuming them.
translation:
  language: hi
  text: चाहे वे उपवास करें, मैं उनकी पुकार पर ध्यान नहीं दूँगा; और चाहे वे होमबलि और अन्नबलि चढ़ाएँ, मैं उन्हें स्वीकार नहीं करूँगा। बल्कि मैं तलवार, अकाल और महामारी से उनका अंत कर रहा हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי יָצֻמוּ
  choice: चाहे वे उपवास करें
  rationale: 'संदर्भ में כִּי रियायती अर्थ देता है: उनके उपवास करने पर भी यहोवा उनकी नहीं सुनेगा। हिंदी में ‘चाहे’ इस भाव को स्वाभाविक रूप से व्यक्त करता है।'
- source_word: אֵינֶנִּי שֹׁמֵעַ אֶל רִנָּתָם
  choice: मैं उनकी पुकार पर ध्यान नहीं दूँगा
  rationale: שׁמע אל केवल ध्वनि सुनने के बजाय पुकार पर ध्यान देने या उसे मानने का भाव रखता है। भविष्यकालीन हिंदी रूप इस प्रसंग की घोषित अस्वीकृति के अनुरूप है।
- source_word: עֹלָה
  choice: होमबलि
  rationale: यह उस बलि का मानक धार्मिक पद है जो पूरी तरह वेदी पर जलाई जाती थी।
- source_word: מִנְחָה
  choice: अन्नबलि
  rationale: बलिदानी संदर्भ में מִנְחָה विशेष रूप से अनाज की भेंट को दर्शाता है; ‘अन्नबलि’ संक्षिप्त और प्रचलित हिंदी रूप है।
- source_word: אֵינֶנִּי רֹצָם
  choice: मैं उन्हें स्वीकार नहीं करूँगा
  rationale: बलिदानी संदर्भ में רצה का अर्थ अनुग्रहपूर्वक स्वीकार करना है। ‘उन्हें’ मूल के सर्वनाम की संभावित संदर्भ-अस्पष्टता को बनाए रखता है।
- source_word: בַּחֶרֶב וּבָרָעָב וּבַדֶּבֶר
  choice: तलवार, अकाल और महामारी से
  rationale: यह न्याय की पारंपरिक त्रयी है। ‘महामारी’ דֶּבֶר के व्यापक और आधुनिक हिंदी अर्थ को स्पष्ट करता है।
- source_word: מְכַלֶּה אוֹתָם
  choice: उनका अंत कर रहा हूँ
  rationale: כלה का पिएल रूप समाप्त कर देने या नष्ट कर डालने की सक्रिय प्रक्रिया बताता है। यह अनुवाद उसकी तीव्रता और प्रगतिशील पक्ष दोनों रखता है।
theological_decisions:
- issue: न्याय के समय उपवास और बलियों की अस्वीकृति
  choice: पद उपवास की पुकार और चढ़ाई गई बलियों—दोनों को अस्वीकार बताता है और इसके विपरीत परमेश्वर के सक्रिय न्याय की घोषणा करता है।
  alternative: अस्वीकृति केवल प्रार्थना की हो, या न्याय पर बल दिए बिना केवल अस्थायी अस्वीकृति हो।
  rationale: दो समानांतर रियायती उपवाक्यों के बाद तलवार, अकाल और महामारी द्वारा विनाश का स्पष्ट कथन आता है; अनुवाद इससे आगे कोई व्यापक धार्मिक निष्कर्ष नहीं जोड़ता।
- issue: רֹצָם में ‘उन्हें’ का संदर्भ
  choice: हिंदी में ‘उन्हें’ रखकर मूल सर्वनाम की अस्पष्टता सुरक्षित रखी गई है।
  alternative: इसे स्पष्ट रूप से केवल ‘इन बलियों’ या केवल ‘इन लोगों’ के रूप में अनूदित करना।
  rationale: निकटतम पूर्वपद होमबलि और अन्नबलि हैं, किंतु पुल्लिंग बहुवचन प्रत्यय चढ़ाने वालों की ओर भी संकेत समझा जा सकता है। किसी एक अर्थ को अनावश्यक रूप से बंद नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण, सहज और सार्वजनिक पाठ के योग्य रूप। ‘होमबलि’ और ‘अन्नबलि’ बाइबलीय बलिदानी शब्दावली की सटीकता रखते हैं; शेष वाक्य सामान्य पाठक के लिए सीधा रखा गया है।
