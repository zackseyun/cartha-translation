  text: וְ/אָמַרְתָּ֤ אֲלֵי/הֶם֙ אֶת הַ/דָּבָ֣ר הַ/זֶּ֔ה תֵּרַ֨דְנָה עֵינַ֥/י דִּמְעָ֛ה לַ֥יְלָה וְ/יוֹמָ֖ם וְ/אַל תִּדְמֶ֑ינָה כִּי֩ שֶׁ֨בֶר גָּד֜וֹל נִשְׁבְּרָ֗ה בְּתוּלַת֙ בַּת עַמִּ֔/י מַכָּ֖ה נַחְלָ֥ה מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/017.yaml
  text: 'And you shall say to them this word: ‘Let my eyes run down with tears night and day[a], and let them not cease, for the virgin daughter of my people is broken with a great breaking[c][b], with a very grievous wound.’'
translation:
  language: hi
  text: 'और तुम उनसे यह वचन कहना: “मेरी आँखों से रात-दिन आँसू बहते रहें[a], और वे थमने न पाएँ; क्योंकि मेरी प्रजा की कुँवारी बेटी बड़ी टूटन से टूट गई है[c][b]; उसका घाव अत्यन्त गंभीर है।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “और वे शांत न हों” अथवा “उन्हें विश्राम न मिले”; इब्रानी क्रिया का अर्थ स्थिर या शांत होना, अथवा रुक जाना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “मेरी प्रजा की कुँवारी बेटी” इब्रानी काव्य में प्रजा को एक युवती के रूप में प्रस्तुत करने वाला मानवीकरण है।
    reason: cultural_note
  - marker: c
    text: इब्रानी में बल देने के लिए सजातीय संज्ञा और क्रिया का प्रयोग है—शाब्दिक रूप से, “बड़ी टूटन से टूट गई है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ אֲלֵיהֶם אֶת־הַדָּבָר הַזֶּה
  choice: और तुम उनसे यह वचन कहना
  rationale: भविष्यवाणी-संबंधी निर्देश की आज्ञार्थक शक्ति को स्वाभाविक हिन्दी में रखा गया है; דָּבָר के लिए औपचारिक और सुसंगत ‘वचन’ चुना गया।
- source_word: תֵּרַדְנָה עֵינַי דִּמְעָה
  choice: मेरी आँखों से ... आँसू बहते रहें
  rationale: इब्रानी चित्र में आँखें आँसू बहाती हुई दिखाई गई हैं। हिन्दी में ‘आँखों से आँसू बहना’ उसी चित्र को सहज रूप में व्यक्त करता है।
- source_word: לַיְלָה וְיוֹמָם
  choice: रात-दिन
  rationale: यह निरन्तरता बताने वाला परिचित युग्म है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: וְאַל תִּדְמֶינָה
  choice: और वे थमने न पाएँ
  rationale: सन्दर्भ में क्रिया का अर्थ स्थिर हो जाना या रुक जाना है; बहुवचन ‘वे’ निकटतम ‘आँसू’ की ओर सहज संकेत करता है।
- source_word: שֶׁבֶר גָּדוֹל נִשְׁבְּרָה
  choice: बड़ी टूटन से टूट गई है
  rationale: संज्ञा और सजातीय क्रिया की इब्रानी पुनरुक्ति को जानबूझकर बचाया गया है, जिससे विनाश की तीव्रता उभरती है।
- source_word: בְּתוּלַת בַּת־עַמִּי
  choice: मेरी प्रजा की कुँवारी बेटी
  rationale: लोगों को युवती के रूप में प्रस्तुत करने वाले मूल काव्यात्मक मानवीकरण को बिना व्याख्यात्मक विस्तार के सुरक्षित रखा गया है।
- source_word: מַכָּה נַחְלָה מְאֹד
  choice: उसका घाव अत्यन्त गहरा है
  rationale: נַחְלָה की बहुत गंभीर या असाध्य दशा को ‘अत्यन्त गहरा’ स्वाभाविक हिन्दी में व्यक्त करता है, जबकि ‘असाध्य’ जैसे अधिक निश्चित चिकित्सकीय निष्कर्ष से बचता है।
theological_decisions:
- issue: ‘मेरी प्रजा की कुँवारी बेटी’ का मानवीकरण
  choice: काव्यात्मक पदबंध को ज्यों का त्यों बनाए रखा गया
  alternative: यहूदा की प्रजा / मेरी प्रजा
  rationale: मूल पाठ प्रजा को एक कुँवारी बेटी के रूप में प्रस्तुत करता है। इसे सामान्य संज्ञा में बदलने से भविष्यद्वक्ता के विलाप की संवेदना और वाचा-संबंधी काव्यात्मक तनाव घट जाता।
- issue: विलाप में बोलने वाले की पहचान
  choice: ‘मेरी आँखों’ और ‘मेरी प्रजा’ को बिना व्याख्यात्मक पहचान जोड़े रखा गया
  alternative: यिर्मयाह की आँखें / परमेश्वर की प्रजा
  rationale: पद में वक्ता की वाणी भविष्यद्वक्ता और परमेश्वर के विलाप के बीच अर्थपूर्ण तनाव रख सकती है; अनुवाद इसे किसी एक व्याख्या तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण भविष्यद्वाणी-काव्यात्मक स्वर रखा गया है। ‘वचन’, ‘कुँवारी बेटी’ और ‘बड़ी टूटन से टूट गई’ मूल की औपचारिकता तथा चित्रात्मकता बचाते हैं; वाक्य फिर भी सामान्य पाठक के लिए बोधगम्य है। सभी पादटिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
