source:
  edition: WLC
  text: וָ/אֹמַ֞ר אֲהָ֣הּ אֲדֹנָ֣/י יְהוִ֗ה הִנֵּ֨ה הַ/נְּבִאִ֜ים אֹמְרִ֤ים לָ/הֶם֙ לֹֽא תִרְא֣וּ חֶ֔רֶב וְ/רָעָ֖ב לֹֽא יִהְיֶ֣ה לָ/כֶ֑ם כִּֽי שְׁל֤וֹם אֱמֶת֙ אֶתֵּ֣ן לָ/כֶ֔ם בַּ/מָּק֖וֹם הַ/זֶּֽה׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/013.yaml
  text: Then I said, “Ah, Lord GOD, look, the prophets are saying to them, ‘You will not see the sword, and famine will not come upon you, for I will give you true peace in this place.’”
translation:
  language: hi
  text: तब मैंने कहा, “हाय, प्रभु यहोवा! देखिए, भविष्यद्वक्ता उनसे कह रहे हैं, ‘तुम तलवार नहीं देखोगे और न तुम पर अकाल पड़ेगा, क्योंकि मैं इस स्थान में तुम्हें सच्ची शान्ति दूँगा।’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲהָהּ
  choice: हाय
  rationale: यह विस्मय और व्यथा व्यक्त करने वाला उद्गार है; ‘हाय’ आधुनिक हिन्दी में उसके भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: אֲדֹנָי को ‘प्रभु’ और परमेश्वर के निज नाम יהוה को ‘यहोवा’ रखा गया है, ताकि मूल के दोनों पद अलग और स्पष्ट रहें।
- source_word: לֹא תִרְאוּ חֶרֶב
  choice: तुम तलवार नहीं देखोगे
  rationale: मूल की ठोस अभिव्यक्ति को बनाए रखा गया है; यहाँ ‘तलवार’ युद्ध और हिंसक विनाश की ओर संकेत करती है।
- source_word: וְרָעָב לֹא יִהְיֶה לָכֶם
  choice: और न तुम पर अकाल पड़ेगा
  rationale: शाब्दिक ‘अकाल तुम्हारे लिए नहीं होगा’ की अपेक्षा यह स्वाभाविक हिन्दी है और आशय को बिना विस्तार दिए व्यक्त करती है।
- source_word: שְׁלוֹם אֱמֶת
  choice: सच्ची शान्ति
  rationale: संज्ञा-संयोजन स्थायी, भरोसेमंद या वास्तविक शान्ति का भाव दे सकता है; ‘सच्ची शान्ति’ मूल की संक्षिप्तता और दावे की शक्ति बनाए रखती है।
theological_decisions:
- issue: झूठे भविष्यद्वक्ताओं के कथन में प्रथम पुरुष वक्ता
  choice: ‘मैं ... दूँगा’ को उद्धरण में यथावत रखा
  alternative: ‘यहोवा ... देगा’ अथवा ऐसा संकेत जोड़ना कि दावा झूठा था
  rationale: भविष्यद्वक्ता परमेश्वर की ओर से बोलने का दावा कर रहे हैं। मूल इस पद में उस दावे पर अलग से टिप्पणी नहीं जोड़ता; इसलिए कथन का तनाव और संदर्भगत विडम्बना सुरक्षित रखी गई है।
- issue: יהוה का निरूपण
  choice: यहोवा
  alternative: प्रभु/परमेश्वर अथवा बड़े अक्षरों के समकक्ष कोई मुद्रण-परंपरा
  rationale: हिन्दी में निज नाम का सीधा, प्रचलित लिप्यंतरण मूल भाषा के भेद को स्पष्ट रखता है और אֲדֹנָי के ‘प्रभु’ से उसे अलग करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण और मौखिक रूप से सहज। भविष्यद्वक्ताओं के भीतर के कथन के लिए एकल उद्धरण-चिह्न रखे गए हैं। ‘शान्ति’ की पारंपरिक वर्तनी अपनाई गई है।
