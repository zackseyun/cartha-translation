  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אִם עֲוֺנֵ֨י/נוּ֙ עָ֣נוּ בָ֔/נוּ יְהוָ֕ה עֲשֵׂ֖ה לְמַ֣עַן שְׁמֶ֑/ךָ כִּֽי רַבּ֥וּ מְשׁוּבֹתֵ֖י/נוּ לְ/ךָ֥ חָטָֽאנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/007.yaml
  text: Though our iniquities testify against us[a], O Yahweh, act for your name’s sake; for our apostasies are many[b]; against you we have sinned.
translation:
  language: hi
  text: यद्यपि हमारे अधर्म हमारे विरुद्ध गवाही देते हैं[a], हे याहवे, अपने नाम की खातिर कार्य कर; क्योंकि हमारे विश्वासघात बहुत हैं[b]; हमने तेरे विरुद्ध पाप किया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यदि हमारे अधर्म हमारे विरुद्ध गवाही देते हैं।” इब्रानी אִם का अर्थ “यदि” या “यद्यपि” हो सकता है; इस प्रार्थना के संदर्भ में “यद्यपि” अधिक उपयुक्त जान पड़ता है।
    reason: lexical_alternative
  - marker: b
    text: या, “हमारे फिराव” या “हमारे पीछे हटने के काम।” इब्रानी शब्द याहवे के प्रति निष्ठा से मुड़ जाने या बेवफाई के कामों को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: यद्यपि
  rationale: 'प्रार्थना के संदर्भ में यह शब्द केवल शर्त नहीं, बल्कि स्वीकारोक्तिपूर्ण रियायत व्यक्त करता है: दोष प्रमाणित होने पर भी प्रार्थी याहवे से कार्य करने की विनती करते हैं।'
- source_word: עֲוֺנֵינוּ
  choice: हमारे अधर्म
  rationale: यह शब्द पापमय टेढ़ेपन और उससे जुड़ी दोषिता का भार रखता है; ‘अधर्म’ आधुनिक हिन्दी में इस नैतिक गंभीरता को संक्षेप में व्यक्त करता है।
- source_word: עָנוּ בָנוּ
  choice: हमारे विरुद्ध गवाही देते हैं
  rationale: क्रिया और पूर्वसर्ग का मेल न्यायिक भाव में किसी के विरुद्ध उत्तर देने या साक्षी ठहरने का अर्थ दे सकता है; ‘गवाही देते हैं’ यह भाव स्पष्ट रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी पाठ में परमेश्वर का व्यक्तिगत वाचा-नाम है; उसे किसी उपाधि से बदलने के बजाय हिन्दी लिपि में लिप्यंतरित किया गया है।
- source_word: עֲשֵׂה
  choice: कार्य कर
  rationale: इब्रानी आज्ञार्थक क्रिया व्यापक है और यहाँ उद्धारकारी हस्तक्षेप की विनती करती है; ‘कार्य कर’ उसके परिणाम को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: לְמַעַן שְׁמֶךָ
  choice: अपने नाम की खातिर
  rationale: यह याहवे के नाम, अर्थात उसकी प्रकट प्रतिष्ठा और चरित्र, के आधार पर की गई अपील है।
- source_word: מְשׁוּבֹתֵינוּ
  choice: हम बार-बार तुझसे फिर गए हैं
  rationale: संज्ञा वाचा की निष्ठा से मुड़ने के अनेक कृत्यों को दर्शाती है। हिन्दी में क्रियात्मक रूप मूल के बहुवचन और बारंबारता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לְךָ חָטָאנוּ
  choice: हमने तेरे विरुद्ध पाप किया है
  rationale: חטא के साथ पूर्वसर्ग उस व्यक्ति को दर्शाता है जिसके विरुद्ध पाप हुआ; हिन्दी में ‘तेरे विरुद्ध’ इसका स्वाभाविक समतुल्य है।
theological_decisions:
- issue: אִם का शर्तसूचक या रियायती अर्थ
  choice: यद्यपि
  alternative: यदि
  rationale: संदर्भ सामूहिक दोष-स्वीकार और उसी के बीच दया की याचना है, इसलिए रियायती अर्थ अधिक उपयुक्त है; फिर भी इब्रानी की शर्तसूचक संभावना पादटिप्पणी में सुरक्षित है।
- issue: याहवे के नाम पर अपील
  choice: अपने नाम की खातिर कार्य कर
  alternative: अपने नाम के कारण कार्य कर
  rationale: विनती लोगों की योग्यता पर नहीं, याहवे के अपने नाम पर आधारित है। अनिर्दिष्ट ‘कार्य कर’ यह तय नहीं करता कि अपेक्षित कार्य किस विशिष्ट रूप में होगा।
- issue: מְשׁוּבֹתֵינוּ की वाचागत गंभीरता
  choice: हम बार-बार तुझसे फिर गए हैं
  alternative: हमारे विश्वासघात के काम बहुत हैं
  rationale: चुना गया रूप याहवे से बार-बार मुड़ने की बात स्पष्ट और स्वाभाविक हिन्दी में कहता है, जबकि किसी बाद की तकनीकी धर्मशास्त्रीय श्रेणी को पाठ पर आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामूहिक स्वीकारोक्ति के अनुकूल रखी गई है। ‘हे याहवे’ संबोधन की प्रार्थनात्मक गंभीरता बनाए रखता है; ‘तुझसे/तेरे’ एकवचन संबोधन मूल इब्रानी के निकट है। अर्धविरामों से मूल की विनती, कारण और अंतिम स्वीकारोक्ति अलग किंतु परस्पर जुड़ी रहती हैं।
