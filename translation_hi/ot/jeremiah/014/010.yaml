source:
  edition: WLC
  text: כֹּֽה אָמַ֨ר יְהוָ֜ה לָ/עָ֣ם הַ/זֶּ֗ה כֵּ֤ן אָֽהֲבוּ֙ לָ/נ֔וּעַ רַגְלֵי/הֶ֖ם לֹ֣א חָשָׂ֑כוּ וַ/יהוָה֙ לֹ֣א רָצָ֔/ם עַתָּה֙ יִזְכֹּ֣ר עֲוֺנָ֔/ם וְ/יִפְקֹ֖ד חַטֹּאתָֽ/ם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/010.yaml
  text: 'Thus says Yahweh concerning this people: Thus they have loved to wander[a]; they have not restrained their feet. Therefore Yahweh does not accept them[c][b]. Now he will remember their iniquity and punish their sins.'
translation:
  language: hi
  text: 'याहवे इस प्रजा के विषय में यों कहता है: “इसी प्रकार उन्होंने भटकना पसंद किया है[a]; उन्होंने अपने पाँव नहीं रोके। इसलिए याहवे उन्हें स्वीकार नहीं करता[b]। अब वह उनके अधर्म को स्मरण करेगा और उनके पापों के लिए उन्हें दंड देगा[c]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक शाब्दिक रूप में, “उन्होंने भटकने से प्रेम किया” या “उन्हें इधर-उधर फिरना प्रिय रहा है।”
    reason: lexical_alternative
  - marker: b
    text: या, “याहवे उनसे प्रसन्न नहीं है।”
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप में, “वह उनके अधर्म को स्मरण करेगा और उनके पापों का हिसाब लेगा।” यह इब्रानी न्यायिक मुहावरा पापों को उत्तरदायी ठहराकर उनके विरुद्ध कार्रवाई करने का भाव रखता है।
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में उसका निकट लिप्यंतरण रखा गया है।
- source_word: לָעָם הַזֶּה
  choice: इस प्रजा के विषय में
  rationale: यहाँ ל उस प्रजा को सूचित करता है जिसके विषय में वचन कहा जा रहा है; यह हिन्दी में स्वाभाविक और प्रसंगानुकूल है।
- source_word: כֵּן אָהֲבוּ לָנוּעַ
  choice: इसी प्रकार उन्हें भटकना प्रिय रहा है
  rationale: यह अनुवाद אָהַב की रुचि/चाह और נוּעַ के भटकने के भाव को बनाए रखता है, जबकि כֵּן को भी स्पष्ट करता है।
- source_word: רַגְלֵיהֶם לֹא חָשָׂכוּ
  choice: उन्होंने अपने पाँव नहीं रोके
  rationale: मूल के पाँव वाले रूपक को स्वाभाविक हिन्दी में बनाए रखा गया है; आशय उनके अनियंत्रित आचरण से है।
- source_word: לֹא רָצָם
  choice: उन्हें स्वीकार नहीं करता
  rationale: רצה यहाँ अनुकूल स्वीकृति का बोध कराता है; केवल भावनात्मक अप्रसन्नता तक अर्थ को सीमित नहीं किया गया।
- source_word: יִזְכֹּר עֲוֺנָם
  choice: उनके अधर्म को स्मरण करेगा
  rationale: न्यायिक संदर्भ में ‘स्मरण’ केवल याद आने के बजाय दोष को न्याय के लिए ध्यान में रखने का संकेत देता है; मूल बिंब सुरक्षित है।
- source_word: וְיִפְקֹד חַטֹּאתָם
  choice: उनके पापों के लिए उन्हें दण्ड देगा
  rationale: न्याय के संदर्भ में פקד का अर्थ पापों का लेखा लेकर दण्ड देना है; हिन्दी में न्यायिक आशय स्पष्ट किया गया है।
theological_decisions:
- issue: अन्तिम खण्ड में ईश्वरीय न्याय की भाषा
  choice: अब वह उनके अधर्म को स्मरण करेगा और उनके पापों के लिए उन्हें दण्ड देगा
  alternative: अब वह उनके अधर्म को स्मरण करेगा और उनके पापों का लेखा लेगा
  rationale: मुख्य पाठ न्याय के सक्रिय परिणाम को स्पष्ट करता है, पर किसी अतिरिक्त दार्शनिक या सम्प्रदायगत ढाँचे को नहीं जोड़ता; अधिक शाब्दिक इब्रानी मुहावरा पादटिप्पणी में दिया गया है।
- issue: רצה में स्वीकृति और प्रसन्नता का संबंध
  choice: उन्हें स्वीकार नहीं करता
  alternative: उनसे प्रसन्न नहीं है
  rationale: ‘स्वीकार’ अनुकूल ग्रहण किए जाने के वाचा-संबंधी भाव को व्यक्त करता है, जबकि वैकल्पिक भावार्थ भी पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘अपने पाँव नहीं रोके’ और ‘अधर्म को स्मरण करेगा’ जैसे मूल इब्रानी बिंब सुरक्षित हैं, जबकि अस्पष्ट लग सकने वाले न्यायिक मुहावरे को मुख्य पाठ और पादटिप्पणी के संयोजन से स्पष्ट किया गया है।
