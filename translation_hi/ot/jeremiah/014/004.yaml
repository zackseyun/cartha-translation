base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/004.yaml
  text: Because the ground is dismayed[a], since there has been no rain in the land, the farmers are ashamed[b]; they cover their heads.
translation:
  language: hi
  text: भूमि फट गई है—क्योंकि देश में वर्षा नहीं हुई—इस कारण किसान लज्जित हैं; वे अपने सिर ढाँपते हैं[b]।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भूमि व्याकुल है” अथवा “भूमि टूट गई है।” इब्रानी क्रिया टूटने या व्याकुल होने का भाव व्यक्त कर सकती है; सूखे के इस संदर्भ में संभवतः धरती के फट जाने का वर्णन है।
    reason: lexical_alternative
  - marker: b
    text: सिर ढाँपना लज्जा, शोक या विलाप का सांस्कृतिक संकेत था।
    reason: cultural_note
lexical_decisions:
- source_word: בַּעֲבוּר
  choice: क्योंकि
  rationale: यह कारण बताने वाला पद है। हिन्दी में वाक्य की स्वाभाविक संरचना के अनुसार इसे भूमि की दशा के बाद रखा गया है।
- source_word: הָאֲדָמָה
  choice: भूमि
  rationale: यहाँ सूखे से प्रभावित खेती योग्य धरती अभिप्रेत है; ‘भूमि’ गरिमापूर्ण, स्पष्ट और ‘देश’ से पृथक है।
- source_word: חַתָּה
  choice: फट गई है
  rationale: क्रिया का अर्थ टूटना, चूर होना या भयभीत/व्याकुल होना हो सकता है। वर्षा के अभाव के संदर्भ में ‘फट गई है’ सूखी धरती की प्रत्यक्ष दशा को स्वाभाविक रूप से व्यक्त करता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह भूमि की दशा का कारण स्पष्ट करता है और आधुनिक हिन्दी में सहज है।
- source_word: גֶשֶׁם
  choice: वर्षा
  rationale: मानक और गरिमापूर्ण हिन्दी में वर्षण के लिए स्पष्ट शब्द।
- source_word: בָּאָרֶץ
  choice: देश में
  rationale: यह सूखे से प्रभावित भू-प्रदेश को दर्शाता है और הָאֲדָמָה के लिए प्रयुक्त ‘भूमि’ से अर्थगत भेद बनाए रखता है।
- source_word: בֹּשׁוּ
  choice: लज्जित हैं
  rationale: मूल क्रिया की लज्जा और अपमान की भावना को सीधे बनाए रखता है; निराशा तक अर्थ को सीमित नहीं करता।
- source_word: אִכָּרִים
  choice: किसान
  rationale: आधुनिक पाठक के लिए कृषि-कर्मियों का सहज और व्यापक पद।
- source_word: חָפוּ רֹאשָׁם
  choice: अपने सिर ढक लेते हैं
  rationale: मूल सांस्कृतिक संकेत को बिना उसकी भावनात्मक व्याख्या मुख्य पाठ में जोड़े प्रत्यक्ष रूप से प्रस्तुत करता है।
