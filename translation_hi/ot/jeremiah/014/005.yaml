base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/005.yaml
  text: For even the doe in the field gives birth and abandons her young[a], because there is no grass.
translation:
  language: hi
  text: क्योंकि मैदान में हिरनी भी बच्चे को जन्म देकर उसे त्याग देती है[a], क्योंकि घास नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे छोड़ देती है”; इब्रानी में कर्म स्पष्ट रूप से नहीं दिया गया है, पर प्रसंग से आशय है कि घास न होने के कारण हिरनी अपने नवजात बच्चे को त्याग देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले विलाप के कारण या समर्थन को प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: גַם
  choice: भी
  rationale: यह इस बात पर बल देता है कि सूखे से जंगली पशु तक प्रभावित हैं; ‘हिरनी भी’ हिन्दी में इस समावेशी बल को स्वाभाविक ढंग से रखता है।
- source_word: אַיֶּלֶת
  choice: हिरनी
  rationale: शब्द विशेष रूप से मादा हिरन को दर्शाता है; ‘हिरनी’ सटीक, आधुनिक और सहज हिन्दी है।
- source_word: בַּשָּׂדֶה
  choice: मैदान में
  rationale: यह स्थानसूचक पद खुले क्षेत्र या मैदान का ठोस चित्र बनाए रखता है।
- source_word: יָלְדָה
  choice: बच्चे को जन्म देकर
  rationale: क्रिया संतान उत्पन्न करने को दर्शाती है। अगली क्रिया के साथ हिन्दी में कृदन्तीय रचना घटनाओं का संबंध स्पष्ट और स्वाभाविक बनाती है।
- source_word: וְעָזוֹב
  choice: उसे छोड़ देती है
  rationale: עזב का अर्थ छोड़ना या त्याग देना है। इब्रानी में कर्म व्यक्त नहीं है; ‘उसे’ निकटतम नवजात बच्चे की ओर संकेत करता है, जबकि पादटिप्पणी मूल की अंतर्निहितता बताती है।
- source_word: כִּי לֹא הָיָה
  choice: क्योंकि ... नहीं है
  rationale: यह बच्चे को छोड़ने का कारण बताता है। वर्तमानकाल सूखे की सजीव और जारी दशा को हिन्दी में स्वाभाविक रूप से प्रस्तुत करता है।
- source_word: דֶּשֶׁא
  choice: घास
  rationale: यह कोमल हरी घास या नई वनस्पति को सूचित करता है; ‘घास’ सबसे स्पष्ट और संक्षिप्त सामान्य हिन्दी रूप है।
