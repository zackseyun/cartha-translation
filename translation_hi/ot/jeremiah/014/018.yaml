source:
  edition: WLC
  text: אִם יָצָ֣אתִי הַ/שָּׂדֶ֗ה וְ/הִנֵּה֙ חַלְלֵי חֶ֔רֶב וְ/אִם֙ בָּ֣אתִי הָ/עִ֔יר וְ/הִנֵּ֖ה תַּחֲלוּאֵ֣י רָעָ֑ב כִּֽי גַם נָבִ֧יא גַם כֹּהֵ֛ן סָחֲר֥וּ אֶל אֶ֖רֶץ וְ/לֹ֥א יָדָֽעוּ־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/018.yaml
  text: If I go out into the field[a], look—those slain by the sword! And if I enter the city[b], look—those sick with famine! For both prophet and priest wander through the land and do not know what to do.
translation:
  language: hi
  text: यदि मैं मैदान में निकलूँ, तो देखो—तलवार से मारे गए लोग! और यदि मैं नगर में प्रवेश करूँ, तो देखो—अकाल से बीमार लोग! क्योंकि नबी और याजक दोनों देश में घूमते-फिरते हैं[a] और नहीं जानते[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘देश में घूमते-फिरते हैं’ का अनुवाद ‘देश में घूम-घूमकर व्यापार करते हैं’ भी हो सकता है, क्योंकि इब्रानी क्रिया में घूमने-फिरने के साथ व्यापार करने का भाव भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: अंतिम इब्रानी वाक्यांश कठिन है। इसका अर्थ ‘वे ऐसे देश में चले गए हैं जिसे वे नहीं जानते’ या केवल ‘वे नहीं जानते’ भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: אִם יָצָאתִי הַשָּׂדֶה
  choice: यदि मैं बाहर मैदान में जाता हूँ
  rationale: शर्तसूचक אִם और पूर्ण क्रिया यहाँ सजीव काल्पनिक अवलोकन व्यक्त करते हैं; हिन्दी का सामान्य वर्तमान उस प्रभाव को स्वाभाविक रूप से रखता है। שׂדה नगर के विपरीत खुले क्षेत्र को सूचित करता है, इसलिए ‘मैदान’ चुना गया।
- source_word: וְהִנֵּה
  choice: तो देखो—
  rationale: הִנֵּה दृश्य की ओर तत्काल ध्यान खींचता है; ‘देखो—’ आधुनिक और गरिमापूर्ण हिन्दी में उसकी आकस्मिकता बनाए रखता है।
- source_word: חַלְלֵי חֶרֶב
  choice: तलवार से मारे गए लोग
  rationale: यह युद्ध में हिंसक मृत्यु पाए लोगों के लिए प्रयुक्त पदबंध है; चयन स्पष्ट है और मूल के ठोस दृश्य को रखता है।
- source_word: תַּחֲלוּאֵי רָעָב
  choice: अकाल से रोगी पड़े लोग
  rationale: पदबंध बीमारी अथवा बीमार व्यक्तियों को सूचित कर सकता है; समानांतर पंक्ति में दिखाई देने वाले पीड़ित लोग अभिप्रेत जान पड़ते हैं।
- source_word: כִּי גַם נָבִיא גַם כֹּהֵן
  choice: क्योंकि नबी और याजक दोनों
  rationale: כִּי व्याख्यात्मक संबंध और दोहरे גַם दोनों समूहों पर बल देते हैं; हिन्दी क्रम इसे स्पष्ट रखता है।
- source_word: סָחֲרוּ אֶל אֶרֶץ
  choice: देश में भटकते फिरते हैं
  rationale: दुर्बोध पदबंध में घूमने-फिरने और संभवतः व्यापार करने का भाव हो सकता है। मुख्य पाठ में संदर्भानुकूल गति और दिशाहीनता रखी गई है, जबकि व्यापार-संबंधी संभावना टिप्पणी में दी गई है।
- source_word: וְלֹא יָדָעוּ
  choice: और नहीं जानते कि क्या करें
  rationale: मूलतः ‘और वे नहीं जानते’ है, जिसका कर्म अनुक्त है। हिन्दी में ‘कि क्या करें’ प्रसंगगत असमंजस को स्वाभाविक बनाता है, पर मूल की संक्षिप्त अस्पष्टता टिप्पणी में सुरक्षित है।
theological_decisions:
- issue: नबी और याजक की दशा
  choice: धार्मिक अगुए भी न्याय और विपत्ति के बीच दिशाहीन और असहाय दिखाए गए हैं।
  alternative: वे जीविका के लिए व्यापार कर रहे हों, या किसी अनजान देश में चले गए हों।
  rationale: कठिन इब्रानी पदबंध किसी एक अधिक विशिष्ट धार्मिक निष्कर्ष को निर्णायक नहीं बनाता; अतः मुख्य पाठ असमंजस का चित्र रखता है और अन्य संभावनाएँ टिप्पणियों में सुरक्षित करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; दृश्यात्मक और शोकपूर्ण लहजा। ‘नबी’, ‘याजक’, ‘अकाल’ जैसे परिचित बाइबलीय शब्द रखे गए हैं। सभी टिप्पणी-चिह्न मुख्य पाठ में सम्मिलित हैं।
