source:
  edition: WLC
  text: לָ֤/מָּה תִֽהְיֶה֙ כְּ/אִ֣ישׁ נִדְהָ֔ם כְּ/גִבּ֖וֹר לֹא יוּכַ֣ל לְ/הוֹשִׁ֑יעַ וְ/אַתָּ֧ה בְ/קִרְבֵּ֣/נוּ יְהוָ֗ה וְ/שִׁמְ/ךָ֛ עָלֵ֥י/נוּ נִקְרָ֖א אַל תַּנִּחֵֽ/נוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/009.yaml
  text: Why should you be like a stunned man[a], like a warrior who cannot save? Yet you are in our midst, O Yahweh, and your name is called over us; do not forsake us.
translation:
  language: hi
  text: तू क्यों एक स्तब्ध मनुष्य के समान, एक योद्धा के समान हो जो बचा नहीं सकता? फिर भी, हे याहवे, तू हमारे बीच में है, और तेरा नाम हमारे ऊपर पुकारा जाता है[a]; हमें मत त्याग।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात्, “हम तेरे नाम से कहलाते हैं।” शाब्दिक रूप से, “तेरा नाम हमारे ऊपर पुकारा जाता है।”
    reason: मूल इब्रानी मुहावरे के शाब्दिक बिंब और उसके स्वाभाविक हिंदी अर्थ दोनों को सुरक्षित रखना।
lexical_decisions:
- source_word: לָמָּה תִהְיֶה
  choice: तू क्यों ... हो
  rationale: प्रश्नवाचक क्रियाविशेषण और अपूर्ण क्रिया यहाँ भविष्यवाणी नहीं, बल्कि प्रार्थनापूर्ण विरोध और विनती व्यक्त करते हैं। हिंदी में “तू क्यों ... हो” इस भाव को स्वाभाविक रूप से रखता है।
- source_word: כְּאִישׁ נִדְהָם
  choice: एक स्तब्ध मनुष्य के समान
  rationale: נִדְהָם का निफ़अल कृदंत चकित, जड़ या असहाय-सा रह जाने का भाव देता है। “स्तब्ध” संक्षिप्त, गरिमापूर्ण और अगले समानांतर वाक्यांश के अनुकूल है।
- source_word: כְּגִבּוֹר
  choice: एक ऐसे वीर योद्धा के समान
  rationale: גִּבּוֹר यहाँ युद्ध और बचाव के प्रसंग में सामर्थी योद्धा को दर्शाता है। “वीर योद्धा” शक्ति और सैनिक भूमिका दोनों स्पष्ट करता है।
- source_word: לֹא יוּכַל לְהוֹשִׁיעַ
  choice: जो बचा नहीं सकता
  rationale: יכול के साथ हिफ़ील धातुरूप הושיע असमर्थता के साथ बचाने या छुड़ाने का अर्थ देता है। “बचा नहीं सकता” आधुनिक हिंदी में सीधा और स्वाभाविक है।
- source_word: וְאַתָּה בְקִרְבֵּנוּ
  choice: फिर भी ... तू हमारे बीच में है
  rationale: וְ यहाँ पहले चित्रों के विपरीत वास्तविक ईश्वरीय उपस्थिति पर बल देता है; इसलिए “फिर भी” प्रसंगगत विरोध को स्पष्ट करता है। בְקִרְבֵּנוּ का अर्थ “हमारे बीच में” है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: וְשִׁמְךָ עָלֵינוּ נִקְרָא
  choice: तेरा नाम हम पर पुकारा गया है
  rationale: यह रूप इब्रानी बिंब को सुरक्षित रखता है, जिसमें किसी पर नाम पुकारा जाना उसके स्वामित्व, पहचान और वाचा-संबंध को सूचित करता है। अधिक मुहावरेदार अर्थ पाद-टिप्पणी में दिया गया है।
- source_word: אַל תַּנִּחֵנוּ
  choice: हमें मत त्याग
  rationale: यह निषेधात्मक विनती छोड़ देने या परित्याग करने का भाव रखती है। “मत त्याग” संक्षिप्त है और वाचा-संबंधी विनती की गंभीरता बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: हे याहवे
  alternative: हे प्रभु
  rationale: मूल में वाचा का व्यक्तिगत नाम स्पष्ट रूप से आया है; इसलिए उसे उपाधि से प्रतिस्थापित न करके लिप्यंतरित किया गया है।
- issue: וְשִׁמְךָ עָלֵינוּ נִקְרָא का वाचा-संबंधी मुहावरा
  choice: तेरा नाम हम पर पुकारा गया है
  alternative: हम तेरे नाम से कहलाते हैं
  rationale: मुख्य पाठ मूल रूपक और उसकी संभावित व्यापकता—पहचान, संबंध और अधिकार—को बनाए रखता है; स्वाभाविक हिंदी अर्थ पाद-टिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, प्रार्थनापूर्ण और गरिमापूर्ण रखी गई है। परमेश्वर के लिए एकवचन “तू/तेरा” मूल के एकवचन संबोधन और निकट वाचा-संबंध को बनाए रखता है। पाद-टिप्पणी का चिह्न उसी वाक्यांश के बाद रखा गया है जिसकी वह व्याख्या करती है।
