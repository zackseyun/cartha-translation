review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the casting out, famine and sword, absence of burial, comprehensive family list, and the ambiguous רָעָתָם. However, לָהֶם in נִבְּאִים לָהֶם denotes prophetic speech directed to the people, not prophecy undertaken for their benefit.
  naturalness: The proposed revision uses idiomatic, modern standard Hindi. It also replaces the awkward negative apposition after ‘दफ़नाने वाला कोई न होगा’ with a direct, complete list of those left without burial.
  terminology: ‘अकाल,’ ‘तलवार,’ ‘दफ़नाना,’ and ‘उँडेल दूँगा’ suitably preserve the grave register and concrete imagery. ‘बुराई’ retains the source ambiguity, while the footnote supplies the viable judgment-related senses.
  issues:
  - severity: medium
    issue: ‘जिन लोगों के लिए वे भविष्यवाणी कर रहे हैं’ renders לָהֶם as ‘for whom.’
    rationale: In this context the Hebrew means that the prophets are speaking prophecy to/directed toward these people. ‘For’ can imply advocacy or benefit and changes the relationship.
  - severity: low
    issue: ‘उन्हें दफ़नाने वाला कोई न होगा—न उन्हें, न उनकी पत्नियों, बेटों और बेटियों को’ is syntactically strained.
    rationale: The Hebrew’s emphatic resumptive pronoun and appositional family list are better conveyed by directly specifying all those whom no one will bury.
  revised_text: और जिन लोगों से वे भविष्यवाणी कर रहे हैं, वे अकाल और तलवार के कारण यरूशलेम की गलियों में फेंक दिए जाएँगे। उन्हें, उनकी पत्नियों, उनके बेटों और उनकी बेटियों को दफ़नाने वाला कोई न होगा। मैं उनकी बुराई[a] उन पर उँडेल दूँगा।
  revised_footnotes:
  - marker: a
    text: या “उनकी दुष्टता,” अथवा “उनके हिस्से की विपत्ति” या “उनकी विपत्ति।” इब्रानी शब्द नैतिक बुराई या उसके फलस्वरूप आने वाली विपत्ति—दोनों को व्यक्त कर सकता है।
    reason: alternative_reading
  revision_rationale: The revision corrects the directional force of לָהֶם without adding a claim about the prophets’ intentions. It recasts the burial clause into natural Hindi while retaining the Hebrew emphasis that the people themselves, their wives, sons, and daughters will all remain unburied. The final clause and footnote continue to preserve the lexical ambiguity of רָעָתָם.
