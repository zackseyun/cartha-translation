id: JER.14.16
reference: Jeremiah 14:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הָ/עָ֣ם אֲשֶׁר הֵ֣מָּה נִבְּאִ֣ים לָ/הֶ֡ם יִֽהְי֣וּ מֻשְׁלָכִים֩ בְּ/חֻצ֨וֹת יְרוּשָׁלִַ֜ם מִ/פְּנֵ֣י הָ/רָעָ֣ב וְ/הַ/חֶ֗רֶב וְ/אֵ֤ין מְקַבֵּר֙ לָ/הֵ֔מָּה הֵ֣מָּה נְשֵׁי/הֶ֔ם וּ/בְנֵי/הֶ֖ם וּ/בְנֹֽתֵי/הֶ֑ם וְ/שָׁפַכְתִּ֥י עֲלֵי/הֶ֖ם אֶת רָעָתָֽ/ם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/016.yaml
  text: And the people to whom they are prophesying will be thrown out into the streets of Jerusalem because of the famine and the sword[a], with no one to bury them—them, their wives, their sons, and their daughters. And I will pour out on them their evil.
translation:
  language: hi
  text: और जिन लोगों से वे भविष्यवाणी कर रहे हैं, वे अकाल और तलवार के कारण यरूशलेम की गलियों में फेंक दिए जाएँगे। उन्हें, उनकी पत्नियों, उनके बेटों और उनकी बेटियों को दफ़नाने वाला कोई न होगा। मैं उनकी बुराई[a] उन पर उँडेल दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनकी दुष्टता,” अथवा “उनके हिस्से की विपत्ति” या “उनकी विपत्ति।” इब्रानी शब्द नैतिक बुराई या उसके फलस्वरूप आने वाली विपत्ति—दोनों को व्यक्त कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: נִבְּאִים לָהֶם
  choice: जिन लोगों के लिए वे भविष्यवाणी कर रहे हैं
  rationale: निफ़अल कृदंत यहाँ जारी भविष्यवाणी के कार्य को व्यक्त करता है। לָהֶם को ‘उनके लिए’ कहना झूठे भविष्यवक्ताओं द्वारा लोगों के हित में होने का दावा करते हुए संदेश सुनाने के प्रसंग में स्वाभाविक है; इसे केवल दिशा-सूचक अर्थ तक सीमित नहीं किया गया।
- source_word: מֻשְׁלָכִים בְּחֻצוֹת יְרוּשָׁלִַם
  choice: यरूशलेम की गलियों में फेंक दिए जाएँगे
  rationale: होफ़अल रूप निष्क्रिय ढंग से फेंके जाने को बताता है और חֻצוֹת नगर की गलियों अथवा खुले स्थानों को। यह अनदफ़न शवों के अपमानजनक पड़े रहने की छवि बनाए रखता है।
- source_word: מִפְּנֵי הָרָעָב וְהַחֶרֶב
  choice: अकाल और तलवार के कारण
  rationale: מִפְּנֵי यहाँ कारण बताता है। ‘तलवार’ को ‘युद्ध’ बनाकर सामान्यीकृत न करके इब्रानी की ठोस न्याय-संबंधी छवि सुरक्षित रखी गई है।
- source_word: וְאֵין מְקַבֵּר לָהֵמָּה
  choice: उन्हें दफ़नाने वाला कोई न होगा
  rationale: אֵין और कृदंत का संयोजन दफ़नाने वाले किसी भी व्यक्ति के अभाव को व्यक्त करता है। भावी संदर्भ के कारण हिन्दी में ‘न होगा’ स्वाभाविक है।
- source_word: הֵמָּה נְשֵׁיהֶם וּבְנֵיהֶם וּבְנֹתֵיהֶם
  choice: न उन्हें, न उनकी पत्नियों, बेटों और बेटियों को
  rationale: पुनरुक्त सर्वनाम के बल और परिवार के सभी सदस्यों के दफ़न न होने की व्यापकता को हिन्दी की ‘न…न…’ रचना से स्पष्ट और स्वाभाविक बनाया गया है।
- source_word: וְשָׁפַכְתִּי
  choice: मैं … उँडेल दूँगा
  rationale: שׁפך की ‘उँडेलना’ वाली न्याय-संबंधी रूपकात्मक भाषा को सुरक्षित रखा गया है। ‘दूँगा’ पूर्ण परिणाम और भावी घोषणा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֶת רָעָתָם
  choice: उनकी बुराई
  rationale: רָעָה नैतिक बुराई और उससे उत्पन्न विपत्ति दोनों का बोध करा सकता है। मुख्य पाठ में निकटतम अभिव्यक्ति रखी गई और वैकल्पिक अर्थ पादटिप्पणी में दिए गए हैं।
theological_decisions:
- issue: दैवी न्याय के कथन में רָעָתָם का अर्थ
  choice: उनकी बुराई
  alternative: उनकी दुष्टता; उनके हिस्से की विपत्ति; उनकी विपत्ति
  rationale: इब्रानी पद उनके अपने नैतिक दोष को उन्हीं पर लौटाने अथवा उन पर आने वाली विपत्ति को व्यक्त कर सकता है। मुख्य पाठ शाब्दिक तनाव बनाए रखता है और पादटिप्पणी संभावित न्यायपरक अर्थों को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज और सामान्य पाठक के लिए बोधगम्य रूप। ‘भविष्यवाणी कर रहे हैं,’ ‘तलवार,’ और ‘उँडेल दूँगा’ मूल की कालगत, ठोस और रूपकात्मक विशेषताओं को बनाए रखते हैं।
