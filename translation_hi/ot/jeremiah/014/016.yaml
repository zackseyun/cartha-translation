revisions:
- from: और जिन लोगों के लिए वे भविष्यवाणी कर रहे हैं, वे अकाल और तलवार के कारण यरूशलेम की गलियों में फेंक दिए जाएँगे। उन्हें दफ़नाने वाला कोई न होगा—न उन्हें, न उनकी पत्नियों, बेटों और बेटियों को। मैं उनकी बुराई[a] उन्हीं पर उँडेल दूँगा।
  to: और जिन लोगों से वे भविष्यवाणी कर रहे हैं, वे अकाल और तलवार के कारण यरूशलेम की गलियों में फेंक दिए जाएँगे। उन्हें, उनकी पत्नियों, उनके बेटों और उनकी बेटियों को दफ़नाने वाला कोई न होगा। मैं उनकी बुराई[a] उन पर उँडेल दूँगा।
