source:
  edition: WLC
  text: אַל תִּנְאַץ֙ לְמַ֣עַן שִׁמְ/ךָ֔ אַל תְּנַבֵּ֖ל כִּסֵּ֣א כְבוֹדֶ֑/ךָ זְכֹ֕ר אַל תָּפֵ֥ר בְּרִֽיתְ/ךָ֖ אִתָּֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/021.yaml
  text: Do not spurn us for the sake of your name; do not dishonor your glorious throne[a]. Remember; do not break your covenant with us.
translation:
  language: hi
  text: अपने नाम की खातिर हमें तुच्छ न जान; अपने महिमामय सिंहासन[a] का अनादर न कर। स्मरण कर; हमारे साथ अपनी वाचा न तोड़।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, “तेरी महिमा का सिंहासन।”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּנְאַץ
  choice: हमारा तिरस्कार न कर
  rationale: נאץ यहाँ केवल अस्वीकार करने से अधिक, तिरस्कारपूर्वक ठुकराने का भाव रखता है। प्रार्थना के संदर्भ से निहित कर्म ‘हमें/हमारा’ स्पष्ट किया गया है।
- source_word: לְמַעַן שִׁמְךָ
  choice: अपने नाम की खातिर
  rationale: यह मुहावरा परमेश्वर के नाम—अर्थात उसकी प्रतिष्ठा और प्रकट चरित्र—को विनती का आधार बनाता है। यह रूप आधुनिक हिन्दी में स्वाभाविक रहते हुए उस आशय को बनाए रखता है।
- source_word: תְּנַבֵּל
  choice: अनादर न कर
  rationale: पिएल रूप यहाँ लज्जित, अपमानित या अनादर करने का अर्थ देता है। ‘अनादर’ सिंहासन के साथ स्वाभाविक है और अनावश्यक रूप से धार्मिक अशुद्धि का भाव नहीं जोड़ता।
- source_word: כִּסֵּא כְבוֹדֶךָ
  choice: अपने महिमामय सिंहासन
  rationale: शाब्दिक रचना ‘अपनी महिमा का सिंहासन’ है। ‘महिमामय सिंहासन’ सहज हिन्दी में उसी अर्थ को व्यक्त करता है; अधिक शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: זְכֹר
  choice: स्मरण कर
  rationale: यह परमेश्वर से की गई सीधी, तात्कालिक विनती है और वाचा-संबंधी संदर्भ में ‘स्मरण कर’ उपयुक्त तथा गरिमापूर्ण है।
- source_word: תָּפֵר
  choice: न तोड़
  rationale: פרר वाचा के साथ उसे तोड़ने या भंग करने का सामान्य अर्थ देता है; ‘वाचा न तोड़’ स्पष्ट और स्वाभाविक हिन्दी है।
- source_word: בְּרִיתְךָ אִתָּנוּ
  choice: हमारे साथ अपनी वाचा
  rationale: इब्रानी पदबंध सीधे ‘हमारे साथ अपनी वाचा’ कहता है। इसमें ‘बाँधी हुई’ जैसे व्याख्यात्मक शब्द जोड़े बिना संबंध सुरक्षित रखा गया है।
theological_decisions:
- issue: ‘अपने महिमामय सिंहासन’ का संकेत
  choice: मुख्य पाठ में केवल ‘अपने महिमामय सिंहासन’ रखा गया है।
  alternative: इसे विशेष रूप से मन्दिर/सिय्योन अथवा परमेश्वर का स्वर्गीय सिंहासन बताना।
  rationale: इब्रानी पदबंध कई स्तरों पर संकेत कर सकता है और स्वयं किसी एक संदर्भ को निश्चित नहीं करता। अनुवाद इस सम्भावित बहुअर्थता को खुला रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और प्रार्थनात्मक हिन्दी। परमेश्वर के लिए एकवचन आत्मीय सम्बोधन रखा गया है। वाक्य की संक्षिप्त, आग्रहपूर्ण लय और इब्रानी की तीन निषेधात्मक विनतियाँ सुरक्षित हैं।
