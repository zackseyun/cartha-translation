  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י שֶׁ֚קֶר הַ/נְּבִאִים֙ נִבְּאִ֣ים בִּ/שְׁמִ֔/י לֹ֤א שְׁלַחְתִּי/ם֙ וְ/לֹ֣א צִוִּיתִ֔י/ם וְ/לֹ֥א דִבַּ֖רְתִּי אֲלֵי/הֶ֑ם חֲז֨וֹן שֶׁ֜קֶר וְ/קֶ֤סֶם ו/אלול ו/תרמות לִבָּ֔/ם הֵ֖מָּה מִֽתְנַבְּאִ֥ים לָ/כֶֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/014.yaml
  text: And Yahweh said to me[a], “The prophets are prophesying lies in my name. I did not send them, nor did I command them, nor did I speak to them. They are prophesying to you a false vision, divination, emptiness, and the deceit of their own heart.”
translation:
  language: hi
  text: यहोवा ने मुझसे कहा, “ये भविष्यद्वक्ता मेरे नाम से झूठी भविष्यवाणी कर रहे हैं। मैंने उन्हें नहीं भेजा, न उन्हें आज्ञा दी, और न उनसे बात की। वे तुम्हें झूठे दर्शन, शकुन-विचार, व्यर्थता[a] और उनके अपने मन के छल की भविष्यवाणी कर रहे हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “निकम्मापन”; इस इब्रानी शब्द का अर्थ कुछ संदर्भों में “मूर्ति” भी हो सकता है।
    reason: אֱלִיל यहाँ रिक्तता या मूल्यहीनता के अर्थ में उपयुक्त है; इसका वैकल्पिक अर्थ सुरक्षित रखा गया है।
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: दिव्य नाम को हिन्दी में प्रचलित और स्पष्ट रूप ‘यहोवा’ से व्यक्त किया गया है, सामान्य पदवी ‘प्रभु’ से नहीं।
- source_word: שֶׁקֶר / חֲזוֹן שֶׁקֶר
  choice: झूठी भविष्यवाणी / झूठे दर्शन
  rationale: मूल के असत्य और छलपूर्ण होने के अर्थ को दोनों प्रयोगों में सहज हिन्दी के अनुसार रखा गया है।
- source_word: הַנְּבִאִים נִבְּאִים
  choice: ये भविष्यद्वक्ता ... भविष्यवाणी कर रहे हैं
  rationale: संज्ञा और क्रिया की मूल पुनरुक्ति तथा जारी गतिविधि का भाव सुरक्षित रहता है।
- source_word: בִּשְׁמִי
  choice: मेरे नाम से
  rationale: यह कथित दैवी अधिकार या प्रतिनिधित्व के दावे को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לֹא שְׁלַחְתִּים וְלֹא צִוִּיתִים וְלֹא דִבַּרְתִּי אֲלֵיהֶם
  choice: न तो मैंने उन्हें भेजा, न उन्हें आज्ञा दी, और न उनसे कुछ कहा
  rationale: भेजने, आज्ञा देने और बोलने—तीनों दैवी निषेधों की क्रमिक संरचना बनाए रखी गई है। ‘कुछ’ हिन्दी में कर्म के लोप को सहज बनाता है।
- source_word: קֶסֶם
  choice: शकुन-विचार
  rationale: यह निषिद्ध संकेतों या शकुनों के आधार पर भविष्य अथवा गुप्त बात जानने की क्रिया को साधारण पाठक के लिए बोधगम्य बनाता है।
- source_word: אֱלִיל
  choice: व्यर्थ बातें
  rationale: संदर्भ में रिक्तता या मूल्यहीनता का अर्थ उपयुक्त है; बहुवचन ‘बातों’ सूची में भविष्यवाणी की सामग्री को स्वाभाविक हिन्दी में व्यक्त करता है। संभावित अर्थ ‘मूर्ति’ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: תַּרְמוּת לִבָּם
  choice: अपने ही मन का छल
  rationale: हृदय को विचार और अंतःस्रोत के अर्थ में आधुनिक हिन्दी के सहज ‘मन’ से व्यक्त किया गया है; ‘ही’ संदेश के स्वयं उनके भीतर से उत्पन्न होने पर बल देता है।
- source_word: הֵמָּה מִתְנַבְּאִים לָכֶם
  choice: वे तुमसे ... भविष्यवाणी कर रहे हैं
  rationale: मूल के बलयुक्त सर्वनाम और संबोधित लोगों को स्पष्ट रखा गया है।
theological_decisions:
- issue: झूठे भविष्यद्वक्ताओं के संदेश का स्रोत और स्वरूप
  choice: अनुवाद दैवी प्रेषण, आज्ञा और वचन—तीनों का निषेध करता है तथा संदेश को झूठे दर्शन, शकुन-विचार, व्यर्थ बातों और उनके अपने मन के छल से जोड़ता है।
  alternative: सूची को चार स्पष्ट तकनीकी श्रेणियों के बजाय झूठी भविष्यवाणी के एक-दूसरे से मिलते-जुलते वर्णनों का संचय समझा जा सकता है।
  rationale: सूची को बिना अतिरिक्त वर्गीकरण के ज्यों का त्यों रखा गया है, जिससे मूल का धर्मवैचारिक बल और उसकी संभावित अस्पष्टता दोनों सुरक्षित रहें।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। भविष्यवाणी-संबंधी शब्दावली को स्पष्ट रखा गया है और मूल की त्रिस्तरीय निषेधात्मक लय यथासंभव बचाई गई है।
