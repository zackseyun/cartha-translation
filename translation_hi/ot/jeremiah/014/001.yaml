  rationale: इब्रानी चतुरक्षरीय दिव्य नाम को किसी उपाधि से बदलने के बजाय उसके नाम के प्रचलित लिप्यंतरण से प्रस्तुत किया गया है।
- source_word: עַל דִּבְרֵי
  choice: के विषय में
  rationale: यह पदबंध यहाँ भविष्यवाणी के विषय को बताता है; शब्दशः ‘बातों के ऊपर’ कहना आधुनिक हिन्दी में अस्वाभाविक होता।
- source_word: הַבַּצָּרוֹת
  choice: सूखों
  rationale: यह बहुवचन संज्ञा सूखे की स्थितियों या उनसे उत्पन्न संकटों को सूचित करती है। ‘सूखों’ मूल के बहुवचन को बनाए रखता है, जबकि ‘अकालों’ परिणाम को आवश्यकता से अधिक निश्चित कर देता।
theological_decisions:
