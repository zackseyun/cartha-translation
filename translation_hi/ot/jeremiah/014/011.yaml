reference: Jeremiah 14:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֵלָ֑/י אַל תִּתְפַּלֵּ֛ל בְּעַד הָ/עָ֥ם הַ/זֶּ֖ה לְ/טוֹבָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/011.yaml
  text: Then Yahweh said to me[a], “Do not pray for the welfare of this people.”
translation:
  language: hi
  text: तब याहवे ने मुझसे कहा, “इस प्रजा की भलाई के लिए प्रार्थना मत कर।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत नाम יהוה को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से नहीं।
- source_word: אֵלָי
  choice: मुझसे
  rationale: कहने की क्रिया के साथ आधुनिक हिन्दी में ‘मुझसे कहा’ स्वाभाविक समतुल्य है।
- source_word: אַל תִּתְפַּלֵּל
  choice: प्रार्थना मत कर
  rationale: אַל और अपूर्ण/आज्ञार्थक रूप यहाँ निषेध व्यक्त करते हैं; ‘मत कर’ सीधा और स्वाभाविक हिन्दी निषेध है।
- source_word: בְּעַד הָעָם הַזֶּה
  choice: इस प्रजा ... के लिए
  rationale: בְּעַד किसी की ओर से या उसके हित में मध्यस्थ प्रार्थना को दर्शाता है; ‘के लिए’ संक्षिप्त और स्वाभाविक है। सामूहिक एकवचन הָעָם को ‘प्रजा’ से सुरक्षित रखा गया है।
- source_word: לְטוֹבָה
  choice: भलाई के लिए
  rationale: यह पदबंध उस प्रजा के हित, कल्याण या लाभ को व्यक्त करता है। ‘भलाई के लिए’ मूल की संक्षिप्तता और अर्थगत व्यापकता बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: यहाँ मूल पाठ व्यक्तिगत ईश्वरीय नाम का प्रयोग करता है। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय परंपरा में पहचाना जाने वाला लिप्यंतरण है और नाम को उपाधि ‘प्रभु’ से नहीं बदलता।
- issue: लְטוֹבָה का आशय
  choice: भलाई के लिए
  alternative: कल्याण के लिए
  rationale: ‘भलाई’ लाभ, हित और अच्छी दशा की व्यापकता बनाए रखती है; ‘कल्याण’ भी संभव है, पर वह कुछ पाठकों को अधिक औपचारिक या धार्मिक रंग दे सकता है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। सीधे संबोधन में ‘प्रार्थना मत कर’ प्रसंगानुकूल एकवचन निषेध है। पद में कोई पाद-टिप्पणी आवश्यक नहीं मानी गई, क्योंकि ‘भलाई के लिए’ בְּעַד और לְטוֹבָה दोनों के संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
