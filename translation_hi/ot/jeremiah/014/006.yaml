  text: And the wild donkeys stand on the bare heights[a]; they pant for air like jackals. Their eyes fail[c][b], because there is no grass.
translation:
  language: hi
  text: और जंगली गधे उजाड़ ऊँचाइयों पर खड़े हैं; वे सियारों की तरह हवा के लिए हाँफते हैं[a]। उनकी आँखें धुँधली पड़ गई हैं, क्योंकि घास नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, “वे सियारों की तरह हवा खींचते हैं”; इसका अर्थ “साँस के लिए हाँफते हैं” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְרָאִים
  choice: और जंगली गधे
  rationale: פְרָאִים पालतू गधों के बजाय वन में रहने वाले जंगली गधों को दर्शाता है; आधुनिक हिन्दी में यह सहज और सटीक है।
- source_word: עָמְדוּ
  choice: खड़े हैं
  rationale: यद्यपि इब्रानी क्रिया पूर्ण रूप में है, यहाँ अकाल के जीवंत, जारी दृश्य का वर्णन है; इसलिए हिन्दी वर्तमान काल स्वाभाविक है।
- source_word: עַל שְׁפָיִם
  choice: उजाड़ ऊँचाइयों पर
  rationale: שְׁפָיִם वृक्षहीन, खुली पहाड़ी ऊँचाइयों को दर्शाता है। ‘उजाड़ ऊँचाइयाँ’ सूखे और खुले भूभाग—दोनों भावों को व्यक्त करता है।
- source_word: שָׁאֲפוּ רוּחַ
  choice: हवा के लिए हाँफते हैं
  rationale: पदबंध का शाब्दिक अर्थ हवा खींचना है। सूखे से व्याकुल पशुओं के संदर्भ में ‘हवा के लिए हाँफना’ आधुनिक हिन्दी में आशय को स्पष्ट रखता है।
- source_word: כַּתַּנִּים
  choice: सियारों की तरह
  rationale: इस स्थलीय, उजाड़ परिवेश में תַּנִּים का सबसे संभावित अर्थ सियार है, जो नबूवत के साहित्य में उजाड़ स्थानों से जुड़ा पशु है।
- source_word: כָּלוּ עֵינֵיהֶם
  choice: उनकी आँखें धुँधली पड़ गई हैं
  rationale: כלה का आँखों के साथ प्रयोग थकावट और अभाव से दृष्टि के क्षीण या विफल होने को व्यक्त करता है। यह हिन्दी वाक्यांश उस शारीरिक दुर्बलता को सहज रूप में बताता है।
- source_word: כִּי אֵין עֵשֶׂב
  choice: क्योंकि घास नहीं है
  rationale: עֵשֶׂב यहाँ चरने वाले पशुओं के लिए उपलब्ध घास या हरियाली को दर्शाता है; ‘घास’ सबसे स्वाभाविक और संदर्भानुकूल चयन है।
