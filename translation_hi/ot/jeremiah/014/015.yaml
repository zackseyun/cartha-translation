source:
  edition: WLC
  text: לָ/כֵ֞ן כֹּֽה אָמַ֣ר יְהוָ֗ה עַֽל הַ/נְּבִאִ֞ים הַ/נִּבְּאִ֣ים בִּ/שְׁמִ/י֮ וַ/אֲנִ֣י לֹֽא שְׁלַחְתִּי/ם֒ וְ/הֵ֨מָּה֙ אֹֽמְרִ֔ים חֶ֣רֶב וְ/רָעָ֔ב לֹ֥א יִהְיֶ֖ה בָּ/אָ֣רֶץ הַ/זֹּ֑את בַּ/חֶ֤רֶב וּ/בָֽ/רָעָב֙ יִתַּ֔מּוּ הַ/נְּבִאִ֖ים הָ/הֵֽמָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/015.yaml
  text: 'Therefore thus says Yahweh concerning the prophets who prophesy in my name though I did not send them[a], and who say, ‘Sword and famine will not be in this land’: by sword and by famine those prophets will be consumed.'
translation:
  language: hi
  text: 'इसलिए याहवे उन भविष्यद्वक्ताओं के विषय में यह कहता है, जो मेरे नाम से भविष्यद्वाणी करते हैं, यद्यपि मैंने उन्हें नहीं भेजा, और जो कहते हैं, ‘इस देश में तलवार और अकाल नहीं होंगे[a]’: तलवार और अकाल से उन भविष्यद्वक्ताओं का अंत होगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “युद्ध और अकाल इस देश पर नहीं आएँगे।” इब्रानी में शाब्दिक रूप से है, “तलवार और अकाल इस देश में नहीं होगा।”
    reason: ‘तलवार’ युद्ध के लिए प्रयुक्त हो सकती है, और इब्रानी के अस्तित्वसूचक वाक्य का अधिक मुहावरेदार हिन्दी रूप वैकल्पिक रूप में दिया गया है।
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले प्रसंग से निकले निष्कर्ष को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כֹּה אָמַר יְהוָה
  choice: याहवे ... यह कहता है
  rationale: भविष्यद्वक्ताओं की संदेशवाहक-वाणी का औपचारिक भाव बनाए रखते हुए आधुनिक हिन्दी की स्वाभाविक शब्दावली अपनाई गई है; יהוה को व्यक्तिवाचक वाचा-नाम ‘याहवे’ के रूप में रखा गया है।
- source_word: עַל
  choice: के विषय में
  rationale: यहाँ पूर्वसर्ग इन नबियों के बारे में होने वाली ईश्वरीय घोषणा का विषय बताता है; न्याय का भाव आगे के कथन से स्पष्ट होता है।
- source_word: הַנְּבִאִים הַנִּבְּאִים
  choice: उन नबियों ... जो ... भविष्यद्वाणी करते हैं
  rationale: संज्ञा और उसी मूल की क्रिया के इब्रानी शब्द-साम्य को हिन्दी में यथासंभव बनाए रखा गया है।
- source_word: בִּשְׁמִי
  choice: मेरे नाम से
  rationale: यह कथित अधिकार और प्रतिनिधित्व को दर्शाने वाला स्वाभाविक हिन्दी मुहावरा है।
- source_word: וַאֲנִי לֹא שְׁלַחְתִּים
  choice: यद्यपि मैंने उन्हें नहीं भेजा
  rationale: ‘यद्यपि’ उनके दावे और याहवे द्वारा उन्हें न भेजे जाने के बीच का विरोध स्पष्ट करता है।
- source_word: וְהֵמָּה אֹמְרִים
  choice: और जो कहते हैं
  rationale: इब्रानी कृदंत के वर्तमान/चलते हुए कथन को बिना अनावश्यक पुनरावृत्तिमूलक अर्थ जोड़े सीधे रूप में व्यक्त करता है।
- source_word: חֶרֶב וְרָעָב
  choice: तलवार और अकाल
  rationale: ‘तलवार’ युद्ध का भविष्यद्वाणी-साहित्य में प्रयुक्त मूर्त प्रतीक है; शाब्दिक छवि और यिर्मयाह की न्याय-विषयक शब्दावली सुरक्षित रहती है।
- source_word: לֹא יִהְיֶה בָּאָרֶץ הַזֹּאת
  choice: इस देश में ... नहीं होगा
  rationale: अस्तित्वसूचक इब्रानी रचना का निकट और बोधगम्य हिन्दी रूप है।
- source_word: בַּחֶרֶב וּבָרָעָב
  choice: तलवार और अकाल से ही
  rationale: ‘से’ साधन का अर्थ देता है और ‘ही’ उन्हीं झूठे आश्वासनों के पलटकर न्याय का साधन बनने पर इब्रानी वाक्य के बल को व्यक्त करता है।
- source_word: יִתַּמּוּ
  choice: अंत होगा
  rationale: क्रिया के ‘समाप्त हो जाना/मिट जाना’ अर्थ को बनाए रखता है और संदर्भ में विनाश को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַנְּבִאִים הָהֵמָּה
  choice: उन नबियों
  rationale: संकेतवाचक पद पहले बताए गए उन्हीं नबियों की ओर स्पष्ट रूप से लौटता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिवाचक नाम सीधे आया है। ‘याहवे’ उसका व्यापक रूप से स्वीकृत आधुनिक लिप्यंतरण है और उसे किसी उपाधि में नहीं बदलता।
- issue: तलवार का आशय
  choice: मुख्य पाठ में ‘तलवार’
  alternative: युद्ध
  rationale: ‘तलवार’ मूल रूपक और यिर्मयाह की न्याय-वाणी की छवि को सुरक्षित रखती है, जबकि पाद-टिप्पणी उसका प्रसंगगत अर्थ ‘युद्ध’ बताती है।
- issue: יִתַּמּוּ में विनाश की तीव्रता
  choice: उन नबियों का अंत होगा
  alternative: वे नष्ट हो जाएँगे; वे समाप्त हो जाएँगे
  rationale: चुना गया रूप मृत्यु/विनाश को संदर्भ में स्पष्ट करता है, पर क्रिया को किसी अधिक विशिष्ट दंड-विधान के रूप में नहीं बाँधता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर भविष्यद्वाणी की घोषणा के अनुरूप गरिमापूर्ण और औपचारिक रखी गई है। ‘भविष्यद्वाणी करते हैं’ संज्ञा-क्रिया के मूलभूत शब्द-साम्य को बनाए रखता है। उद्धरण में इब्रानी का एकवचन ‘होगा’ सुरक्षित रखा गया है, यद्यपि वैकल्पिक मुहावरेदार रूप पाद-टिप्पणी में बहुवचन के साथ दिया गया है।
