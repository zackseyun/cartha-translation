  text: הֲ/מָאֹ֨ס מָאַ֜סְתָּ אֶת יְהוּדָ֗ה אִם בְּ/צִיּוֹן֙ גָּעֲלָ֣ה נַפְשֶׁ֔/ךָ מַדּ֨וּעַ֙ הִכִּיתָ֔/נוּ וְ/אֵ֥ין לָ֖/נוּ מַרְפֵּ֑א קַוֵּ֤ה לְ/שָׁלוֹם֙ וְ/אֵ֣ין ט֔וֹב וּ/לְ/עֵ֥ת מַרְפֵּ֖א וְ/הִנֵּ֥ה בְעָתָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/019.yaml
  text: Have you utterly rejected Judah? Does your soul loathe Zion? Why have you struck us so that there is no healing for us? We hoped for peace[a], but there was no good, and for a time of healing, but behold[b], terror.
translation:
  language: hi
  text: क्या तूने यहूदा को पूरी तरह ठुकरा दिया है? क्या तेरा मन सिय्योन से घृणा करता है?[a] तूने हमें क्यों मारा कि हमारे लिए कोई चंगाई नहीं है? हमने शांति की आशा की, पर कोई भलाई नहीं; चंगाई के समय की आशा की, पर देखो, आतंक।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “या क्या तेरा मन सिय्योन से घृणा करता है?” इब्रानी अव्यय दूसरे प्रश्न को विकल्पसूचक अर्थ में भी आरम्भ कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/מָאֹס מָאַסְתָּ
  choice: क्या तूने ... पूरी तरह ठुकरा दिया है
  rationale: क्रिया के साथ प्रयुक्त धात्वर्थक रूप अस्वीकृति पर बल देता है; ‘पूरी तरह’ इस तीव्रता को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אִם בְּ/צִיּוֹן גָּעֲלָה נַפְשֶׁךָ
  choice: क्या तेरा मन सिय्योन से घृणा करता है?
  rationale: אִם यहाँ समानांतर दूसरा प्रश्न आरम्भ कर सकता है। נֶפֶשׁ का शब्दशः अर्थ ‘प्राण’ है, पर इस प्रसंग में यह व्यक्ति के भीतरी मन अथवा स्वयं व्यक्ति को सूचित करता है; ‘तेरा मन’ हिन्दी में स्वाभाविक रहते हुए भाव की तीव्रता बचाता है।
- source_word: מַדּוּעַ הִכִּיתָנוּ
  choice: तूने हमें क्यों मारा
  rationale: נכה का मूर्त अर्थ ‘मारना/प्रहार करना’ है; निर्णय को केवल सामान्य ‘दुःख देना’ बनाकर नरम नहीं किया गया।
- source_word: מַרְפֵּא
  choice: चंगाई
  rationale: दोनों प्रयोगों में घाव से स्वस्थ होने की उपमा बनाए रखने के लिए एक ही संज्ञा रखी गई है।
- source_word: קַוֵּה לְ/שָׁלוֹם
  choice: हमने शान्ति की आशा की
  rationale: रूप अपेक्षा अथवा प्रतीक्षा का भाव देता है; प्रसंग में भूतकालीन ‘आशा की’ विलाप की विफल अपेक्षा स्पष्ट करता है।
- source_word: וְ/אֵין טוֹב
  choice: पर कुछ भला नहीं हुआ
  rationale: טוֹב की व्यापकता को ‘भला’ से सुरक्षित रखा गया है, जबकि ‘हुआ’ हिन्दी वाक्य को स्वाभाविक बनाता है।
- source_word: וְ/הִנֵּה בְעָתָה
  choice: पर देखो, आतंक छा गया
  rationale: הִנֵּה को ‘देखो’ के रूप में स्पष्ट रखा गया है। בְּעָתָה आकस्मिक भय या आतंक को दर्शाता है; ‘छा गया’ हिन्दी में उसके उपस्थित हो जाने को सहज रूप से व्यक्त करता है।
theological_decisions:
- issue: यहूदा और सिय्योन के प्रति परमेश्वर की अस्वीकृति की भाषा
  choice: प्रार्थना के तीखे प्रश्नों को बिना नरम किए प्रत्यक्ष रूप में रखा गया है।
  alternative: इसे केवल अस्थायी अनुशासन या त्याग-जैसी अनुभूति के रूप में व्याख्यायित करना।
  rationale: मूल पाठ न्याय के बीच परमेश्वर से किया गया तनावपूर्ण विलाप प्रस्तुत करता है; अनुवाद को उस तनाव का doctrinal समाधान नहीं जोड़ना चाहिए।
- issue: אִם द्वारा आरम्भ दूसरे प्रश्न का संबंध
  choice: इसे स्वतंत्र समानांतर प्रश्न के रूप में प्रस्तुत किया गया है।
  alternative: इसे ‘या’ के साथ पहले प्रश्न का विकल्पसूचक दूसरा भाग समझना।
  rationale: दोनों विश्लेषण सम्भव हैं। मुख्य पाठ में स्वाभाविक प्रश्न रखा गया है और विकल्प को पादटिप्पणी में सुरक्षित किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण प्रार्थनात्मक लहजा रखा गया है। परमेश्वर को सम्बोधन में एकवचन ‘तू/तेरा’ मूल के निकट और हिन्दी बाइबलीय काव्य के अनुरूप है। ‘सिय्योन’, ‘शान्ति’ और ‘चंगाई’ सामान्यतः पहचाने जाने वाले बाइबलीय शब्द हैं। अंग्रेज़ी परामर्श पाठ की पादटिप्पणियों में चिह्न-विषय असंगति थी; स्रोत के आधार पर केवल אִם की वास्तविक वैकल्पिक व्याख्या को [a] में रखा गया है।
