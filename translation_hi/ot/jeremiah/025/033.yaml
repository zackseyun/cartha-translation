base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/033.yaml
  text: And the slain of Yahweh on that day will be from one end of the earth even to the other end of the earth[a]. They will not be mourned, or gathered, or buried[c][b]; they will become dung on the surface of the ground.
translation:
  language: hi
  text: उस दिन यहोवा के मारे हुए लोग[a] पृथ्वी के एक छोर से दूसरे छोर तक पड़े होंगे।[b] उनके लिए शोक नहीं मनाया जाएगा, न उन्हें इकट्ठा किया जाएगा, न दफ़नाया जाएगा। वे भूमि की सतह पर[c] मल के समान होंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “यहोवा के मारे हुए लोग” का अनुवाद “यहोवा द्वारा मारे गए लोग” भी हो सकता है। इब्रानी संबंध-रचना यहोवा के कर्तृत्व को अधिक स्पष्ट रूप से सूचित कर सकती है।
    reason: alternative_reading
  - marker: b
    text: '“पृथ्वी” के लिए प्रयुक्त इब्रानी शब्द का अर्थ “देश” या “भूमि” भी हो सकता है। इसलिए अनुवाद यह भी हो सकता है: “देश के एक छोर से दूसरे छोर तक।”'
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “भूमि के मुख पर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: חַלְלֵי יְהוָה
  choice: यहोवा के मारे हुए लोग
  rationale: חַלְלֵי बहुवचन संबंध-रूप में ‘मारे हुए/वध किए गए लोग’ है। हिंदी में यह अभिव्यक्ति संबंधसूचक रचना की संक्षिप्तता बनाए रखती है और प्रसंग में यहोवा के न्यायकारी कर्तृत्व को स्वाभाविक रूप से व्यक्त करती है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिंदी बाइबल परंपरा में प्रचलित व्यक्तिवाचक रूप ‘यहोवा’ रखा गया है, जिससे मूल पाठ का दिव्य नाम किसी उपाधि से प्रतिस्थापित नहीं होता।
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह आधुनिक हिंदी में स्वाभाविक भविष्यसूचक काल-सूचक अभिव्यक्ति है।
- source_word: מִקְצֵה הָאָרֶץ וְעַד קְצֵה הָאָרֶץ
  choice: पृथ्वी के एक छोर से दूसरे छोर तक
  rationale: אֶרֶץ का अर्थ ‘देश/भूमि’ अथवा ‘पृथ्वी’ हो सकता है। राष्ट्रों पर व्यापक न्याय के संदर्भ में ‘पृथ्वी’ चुना गया है; दो छोरों की अभिव्यक्ति समग्र विस्तार को दर्शाती है।
- source_word: לֹא יִסָּפְדוּ
  choice: उनके लिए शोक नहीं मनाया जाएगा
  rationale: निफ़अल रूप मृतकों के लिए विलाप या शोक किए जाने का निषेध व्यक्त करता है; हिंदी का कर्मवाच्य अर्थ और गंभीर लहजा बनाए रखता है।
- source_word: וְלֹא יֵאָסְפוּ
  choice: न उन्हें बटोरा जाएगा
  rationale: यह युद्ध या विपत्ति के बाद शवों को उठाकर एकत्र करने की क्रिया है। ‘बटोरा’ इस ठोस दृश्य को ‘इकट्ठा’ की अपेक्षा अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְלֹא יִקָּבֵרוּ
  choice: न दफ़नाया जाएगा
  rationale: קבר के कर्मवाच्य का सीधा और स्वाभाविक हिंदी समतुल्य है।
- source_word: לְדֹמֶן
  choice: खाद
  rationale: דֹמֶן गोबर, खाद अथवा मल को सूचित करता है। ‘खाद’ आधुनिक हिंदी में सहज है और भूमि पर पड़े शवों की अपमानजनक दशा को बनाए रखता है।
- source_word: עַל־פְּנֵי הָאֲדָמָה
  choice: भूमि की सतह पर
  rationale: शाब्दिक अर्थ ‘भूमि के मुख पर’ है; ‘भूमि की सतह पर’ ठोस स्थानिक बिंब को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: יִהְיוּ
  choice: बनकर पड़े रहेंगे
  rationale: היה मूलतः ‘होना’ है; לְדֹמֶן के साथ परिणामसूचक अवस्था बनती है। ‘बनकर पड़े रहेंगे’ बिना ‘समान’ जोड़कर उस परिणाम और शवों के खुले पड़े रहने दोनों को व्यक्त करता है।
theological_decisions:
- issue: אֶרֶץ का विस्तार
  choice: पृथ्वी
  alternative: देश/भूमि
  rationale: आसपास का संदेश राष्ट्रों तक फैले न्याय का वर्णन करता है, इसलिए सार्वभौमिक विस्तार वाला ‘पृथ्वी’ अधिक उपयुक्त है; फिर भी मूल शब्द स्थानीय ‘देश’ भी दर्शा सकता है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
- issue: חַלְלֵי יְהוָה में संबंध का बल
  choice: यहोवा के मारे हुए लोग
  alternative: यहोवा द्वारा मारे गए लोग
  rationale: इब्रानी संबंध-रचना कर्ता को स्पष्ट कर सकती है, पर उसकी संक्षिप्तता कुछ संबंधगत अस्पष्टता भी रखती है। मुख्य पाठ स्वाभाविक और निकट रूप रखता है; अधिक स्पष्ट कर्तृवाचक अर्थ पादटिप्पणी में दिया गया है।
- issue: לְדֹמֶן ... יִהְיוּ की प्रकृति
  choice: खाद बनकर पड़े रहेंगे
  alternative: खाद के समान पड़े रहेंगे
  rationale: मूल में तुलना-सूचक अलग शब्द नहीं है। परिणामसूचक वाक्य को रूपक की तीव्रता सहित रखा गया है, न कि ‘के समान’ जोड़कर स्पष्ट उपमा बनाया गया है।
translation_notes:
  register: भाषा आधुनिक, गंभीर और भविष्यसूचक है। छोटे समानांतर खंड मूल की न्याय-वाणी की लय बनाए रखते हैं। ‘दफ़नाया’ सामान्य आधुनिक हिंदी है; ‘खाद बनकर पड़े रहेंगे’ मूल बिंब की कठोरता को नरम नहीं करता।
