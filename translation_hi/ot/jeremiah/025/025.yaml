  source_fidelity: हिब्रानी पाठ की तीन समानांतर कर्म-रचनाएँ—‘ज़िम्री के सभी राजा,’ ‘एलाम के सभी राजा,’ और ‘मादै के सभी राजा’—सटीक रूप से बनी हुई हैं। आरंभिक ‘और’ तथा अंत का ‘को’ पिछले पद से चल रही कर्म-सूची को स्वाभाविक हिन्दी में व्यक्त करते हैं।
