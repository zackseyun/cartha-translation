source:
  edition: WLC
  text: וְ/אֵ֣ת כָּל מַלְכֵ֣י זִמְרִ֗י וְ/אֵת֙ כָּל מַלְכֵ֣י עֵילָ֔ם וְ/אֵ֖ת כָּל מַלְכֵ֥י מָדָֽי׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/025.yaml
  text: and all the kings of Zimri[a], and all the kings of Elam, and all the kings of Media[b];
translation:
  language: hi
  text: और ज़िम्री[a] के सभी राजाओं, एलाम के सभी राजाओं और मादै[b] के सभी राजाओं को;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ज़िम्री की पहचान निश्चित नहीं है; संभव है कि यह किसी ऐसे जनसमूह या क्षेत्र का नाम हो जिसकी अन्यत्र स्पष्ट पहचान नहीं मिलती।
    reason: cultural_note
  - marker: b
    text: इब्रानी शब्द ‘मादै’ से मादियों के देश या मादी लोगों—दोनों का बोध हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת
  choice: और … को
  rationale: וְ का अनुवाद ‘और’ किया गया है; אֵת का स्वतंत्र शब्दार्थ नहीं है, पर पूर्वपद से चली आ रही कर्म-सूची को हिन्दी में ‘को’ द्वारा स्पष्ट किया गया है।
- source_word: כָּל מַלְכֵי
  choice: के सभी राजाओं
  rationale: כָּל बहुवचन रचना में समूचे समूह को दर्शाता है, और מַלְכֵי ‘राजाओं’ का संबंधवाचक रूप है; इसलिए स्वाभाविक हिन्दी में ‘के सभी राजाओं’ कहा गया है।
- source_word: זִמְרִי
  choice: ज़िम्री
  rationale: अनिश्चित पहचान वाले इस नाम को अर्थानुवाद करने के बजाय इब्रानी उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: עֵילָם
  choice: एलाम
  rationale: प्राचीन भू-नाम का हिन्दी में प्रचलित लिप्यंतरण रखा गया है।
- source_word: מָדָי
  choice: मादै
  rationale: यह शब्द भूभाग ‘मीडिया’ अथवा मादी लोगों का द्योतक हो सकता है। मूल नाम के निकट और हिन्दी बाइबलीय प्रयोग के अनुरूप ‘मादै’ रखा गया है, जबकि वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
theological_decisions: []
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी; पद को पिछले वाक्य की कर्म-सूची मानकर अंत में ‘को’ रखा गया है। समानांतर संरचना बनाए रखते हुए प्रत्येक समूह के साथ ‘सभी राजाओं’ दोहराया गया है।
