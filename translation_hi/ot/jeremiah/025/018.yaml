  text: Jerusalem[a], the cities of Judah, her kings, and her officials—to make them a ruin, a horror, a hissing, and a curse[b], as it is this day.
translation:
  language: hi
  text: यरूशलेम को, यहूदा के नगरों को, उसके राजाओं और उसके अधिकारियों को—उन्हें उजाड़, भयावह दृश्य[a], सीटी बजाने का विषय[b] और शाप का विषय बनाने के लिए, जैसा आज है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘स्तब्ध कर देने वाली दशा।’ इब्रानी शब्द विनाश को देखकर उत्पन्न भय और विस्मय की प्रतिक्रिया पर बल दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘सीटी।’ इब्रानी शब्द उस तिरस्कारपूर्ण ध्वनि को दर्शाता है जो लोग किसी उजड़े हुए स्थान को देखकर निकालते थे।
    reason: lexical_alternative
