  rationale: स्त्रीलिंग एकवचन प्रत्यय यहूदा/यरूशलेम की सामूहिक सत्ता की ओर संकेत करता है; हिन्दी में ‘उसके’ इस संदर्भ को बिना अस्वाभाविक मानवीकरण के सुरक्षित रखता है।
- source_word: שָׂרֶיהָ
  choice: उसके अधिकारियों
  rationale: שׂרים यहाँ राजाओं के साथ राजनीतिक-प्रशासनिक पदाधिकारियों को दर्शाता है; ‘अधिकारी’ आधुनिक पाठक के लिए स्पष्ट है और इसे केवल राजकुमारों तक सीमित नहीं करता।
- source_word: לָתֵת אֹתָם
  choice: उन्हें … बनाने के लिए
  rationale: נתן के infinitive और उसके बाद आए לְ-संज्ञा-समूह परिणाम या स्थिति को व्यक्त करते हैं; यह हिन्दी में स्वाभाविक रूप से कारणित परिणाम बताता है।
- source_word: לְחָרְבָּה
  choice: उजाड़
  rationale: विनाश के बाद की निर्जन और ध्वस्त दशा को संक्षिप्त, परिचित भाषा में व्यक्त करता है।
- source_word: לְשַׁמָּה
  choice: भयावह दृश्य
  rationale: यह शब्द विनाश से उत्पन्न स्तब्ध भय और देखने वालों की प्रतिक्रिया दोनों को सूचित कर सकता है; ‘भयावह दृश्य’ उस प्रभाव को सहज हिन्दी में रखता है।
- source_word: לִשְׁרֵקָה
  choice: उपहास की सीटी
  rationale: शब्द उजड़े स्थान को देखकर बजाई जाने वाली तिरस्कारपूर्ण सीटी की ठोस ध्वनि-छवि सुरक्षित रखता है।
- source_word: וְלִקְלָלָה
  choice: शाप का विषय
  rationale: भाव यह है कि वे ऐसी मिसाल बनें जिनका नाम शाप देते समय लिया जाए; हिन्दी में केवल ‘शाप’ की अपेक्षा यह अर्थ अधिक स्पष्ट है।
- source_word: כַּיּוֹם הַזֶּה
  choice: जैसा आज है
  rationale: इब्रानी मुहावरा वर्तमान दिखाई देने वाली दशा को पूर्ति के प्रमाण के रूप में इंगित करता है; संक्षिप्त रूप मूल की संकेतात्मक शक्ति बनाए रखता है।
