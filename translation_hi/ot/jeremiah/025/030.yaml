source:
  edition: WLC
  text: וְ/אַתָּה֙ תִּנָּבֵ֣א אֲלֵי/הֶ֔ם אֵ֥ת כָּל הַ/דְּבָרִ֖ים הָ/אֵ֑לֶּה וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֗ם יְהוָ֞ה מִ/מָּר֤וֹם יִשְׁאָג֙ וּ/מִ/מְּע֤וֹן קָדְשׁ/וֹ֙ יִתֵּ֣ן קוֹל֔/וֹ שָׁאֹ֤ג יִשְׁאַג֙ עַל נָוֵ֔/הוּ הֵידָד֙ כְּ/דֹרְכִ֣ים יַֽעֲנֶ֔ה אֶ֥ל כָּל יֹשְׁבֵ֖י הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/030.yaml
  text: 'And you, you shall prophesy all these words against them, and you shall say to them: The LORD will roar from on high, and from his holy dwelling he will give his voice; he will surely roar against his pasture. He will answer with a shout like those who tread grapes, against all the inhabitants of the earth.'
translation:
  language: hi
  text: 'और तू, हाँ तू, इन सब वचनों को उनके विरुद्ध भविष्यवाणी के रूप में कहना और उनसे कहना:


    “यहोवा ऊँचाई से गरजेगा;

    अपने पवित्र निवास से अपना स्वर सुनाएगा।

    वह अपने चरागाह के विरुद्ध निश्चय ही गरजेगा[a];

    अंगूर रौंदनेवालों की-सी ललकार के साथ वह उत्तर देगा[b],

    पृथ्वी के सभी निवासियों के विरुद्ध।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “चरागाह” के लिए प्रयुक्त इब्रानी शब्द का अर्थ “निवास” या “बसने का स्थान” भी हो सकता है।
    reason: मूल शब्द נָוֶה की अर्थगत व्यापकता को सुरक्षित रखना।
  - marker: b
    text: इब्रानी में शाब्दिक रूप से, “वह अंगूर रौंदनेवालों के समान हेदाद/ललकार का उत्तर देगा।” “हेदाद” अंगूर रौंदते समय के ऊँचे सामूहिक घोष को सूचित करता है।
    reason: יַעֲנֶה (‘उत्तर देगा’) और הֵידָד की असामान्य संरचना तथा उसके संभावित शाब्दिक अर्थ को स्पष्ट करना।
lexical_decisions:
- source_word: וְאַתָּה
  choice: और तू, हाँ तू
  rationale: स्वतंत्र सर्वनाम और क्रियात्मक व्यक्ति-सूचकता से उत्पन्न बल को स्वाभाविक हिन्दी में स्पष्ट किया गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ के विशिष्ट ईश्वरीय नाम को सामान्य संज्ञा में बदले बिना हिन्दी में प्रचलित रूप से प्रस्तुत किया गया है।
- source_word: יִתֵּן קוֹלוֹ
  choice: अपनी आवाज़ बुलंद करेगा
  rationale: शाब्दिक ‘अपनी आवाज़ देगा’ के स्थान पर उसी अर्थ का स्वाभाविक हिन्दी मुहावरा चुना गया है।
- source_word: שָׁאֹג יִשְׁאַג
  choice: निश्चय ही गरजेगा
  rationale: इनफिनिटिव ऐब्सलूट और सीमित क्रिया की पुनरुक्ति से व्यक्त तीव्र निश्चय को सुरक्षित रखा गया है।
- source_word: נָוֵהוּ
  choice: अपने चरागाह
  rationale: नָוֶה का मूल pastoral अर्थ रखा गया है, यद्यपि ‘निवास’ भी संभव है; अस्पष्टता पादटिप्पणी में बताई गई है।
- source_word: הֵידָד כְּדֹרְכִים יַעֲנֶה
  choice: अंगूर रौंदनेवालों के समान ऊँची पुकार लगाएगा
  rationale: अंगूर रौंदते समय किए जाने वाले सामूहिक ऊँचे घोष को सहज हिन्दी में व्यक्त किया गया है; יַעֲנֶה की शाब्दिक बनावट पादटिप्पणी में सुरक्षित है।
- source_word: כָּל יֹשְׁבֵי הָאָרֶץ
  choice: पृथ्वी के सभी निवासियों
  rationale: व्यापक विश्वव्यापी न्याय के संदर्भ में הָאָרֶץ को ‘पृथ्वी’ समझा गया है, न कि केवल किसी एक देश को।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु / याहवे
  rationale: मूल में उपस्थित व्यक्तिगत नाम को प्रत्यक्ष रखना उचित समझा गया; ‘यहोवा’ हिन्दी पाठकों में व्यापक रूप से पहचाना जाने वाला रूप है।
- issue: ‘अपने चरागाह के विरुद्ध’ का आशय
  choice: रूपक को बिना व्याख्यात्मक विस्तार के रखा गया
  alternative: अपनी भूमि/अपने निवास के विरुद्ध
  rationale: यह वाक्य परमेश्वर के अपने लोगों, देश या निवास-क्षेत्र की ओर संकेत कर सकता है; मुख्य पाठ किसी एक धर्मवैज्ञानिक पहचान को अंतिम नहीं ठहराता।
- issue: הָאָרֶץ का क्षेत्र
  choice: पृथ्वी
  alternative: देश/भूमि
  rationale: आसपास के राष्ट्रव्यापी न्याय-संदर्भ और ‘सभी निवासियों’ की व्यापकता ‘पृथ्वी’ का समर्थन करती है, फिर भी मूल शब्द दोनों अर्थ दे सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, काव्यात्मक और मौखिक पाठ के योग्य रूप अपनाया गया है। समानांतर पंक्तियाँ इब्रानी काव्य की लय बनाए रखती हैं; दुर्बोध शाब्दिक मुहावरों को स्वाभाविक हिन्दी में रखा गया है और वास्तविक अस्पष्टताएँ पादटिप्पणियों में दी गई हैं।
