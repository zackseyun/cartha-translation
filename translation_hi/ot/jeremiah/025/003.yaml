source:
  edition: WLC
  text: מִן שְׁלֹ֣שׁ עֶשְׂרֵ֣ה שָׁנָ֡ה לְ/יֹאשִׁיָּ֣הוּ בֶן אָמוֹן֩ מֶ֨לֶךְ יְהוּדָ֜ה וְ/עַ֣ד הַ/יּ֣וֹם הַ/זֶּ֗ה זֶ֚ה שָׁלֹ֤שׁ וְ/עֶשְׂרִים֙ שָׁנָ֔ה הָיָ֥ה דְבַר יְהוָ֖ה אֵלָ֑/י וָ/אֲדַבֵּ֧ר אֲלֵי/כֶ֛ם אַשְׁכֵּ֥ים וְ/דַבֵּ֖ר וְ/לֹ֥א שְׁמַעְתֶּֽם־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/003.yaml
  text: From the thirteenth year of Josiah son of Amon[a], king of Judah, even to this day, these twenty-three years, the word of Yahweh has come to me, and I have spoken to you, rising early and speaking, but you have not listened.
translation:
  language: hi
  text: यहूदा के राजा आमोन के पुत्र योशिय्याह के शासन के तेरहवें वर्ष से लेकर आज के दिन तक—इन तेईस वर्षों से—मुझे याहवे का वचन मिलता रहा है। मैं सवेरे उठ-उठकर तुमसे बोलता रहा[a], पर तुमने नहीं सुना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह इब्रानी मुहावरा बार-बार और तत्परता से बोलने का भाव व्यक्त करता है।
    reason: ‘सवेरे उठ-उठकर’ के शाब्दिक बिंब के साथ मुहावरे का अभिप्रेत, लगातार आग्रह का अर्थ स्पष्ट करने के लिए।
lexical_decisions:
- source_word: מִן ... וְעַד
  choice: से लेकर ... तक
  rationale: आरंभ-बिंदु से वर्तमान दिन तक की पूरी समयावधि को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: שְׁלֹשׁ עֶשְׂרֵה שָׁנָה לְיֹאשִׁיָּהוּ
  choice: योशिय्याह के शासन के तेरहवें वर्ष
  rationale: यह तेरह वर्षों की अवधि नहीं, बल्कि राजा के शासन का क्रमसूचक वर्ष है; ‘शासन के’ जोड़ने से हिन्दी में आशय स्पष्ट होता है।
- source_word: הַיּוֹם הַזֶּה
  choice: आज के दिन
  rationale: मूल के संकेतवाचक और भविष्यद्वक्तापूर्ण स्वर को रखते हुए आधुनिक हिन्दी में सहज है।
- source_word: זֶה שָׁלֹשׁ וְעֶשְׂרִים שָׁנָה
  choice: इन तेईस वर्षों से
  rationale: प्रदर्शक זֶה और वर्तमान तक चली आ रही अवधि, दोनों को हिन्दी में व्यक्त करता है।
- source_word: הָיָה דְבַר יְהוָה אֵלַי
  choice: याहवे का वचन मेरे पास आता रहा है
  rationale: दी गई पूरी अवधि में वचन के बार-बार आने का भाव प्रकट करता है और דְבַר की पारंपरिक भविष्यद्वक्तापूर्ण अभिव्यक्ति ‘वचन’ को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले ईश्वरीय निज नाम को उपाधि से बदलने के बजाय हिन्दी लिपि में लिप्यंतरित करता है।
- source_word: אַשְׁכֵּים וְדַבֵּר
  choice: सवेरे उठ-उठकर ... बोलता रहा
  rationale: मूल की ठोस इब्रानी छवि और उसकी पुनरावृत्त, तत्पर कार्रवाई—दोनों को बनाए रखता है; मुहावरे का आशय पादटिप्पणी में स्पष्ट किया गया है।
- source_word: וְלֹא שְׁמַעְתֶּם
  choice: पर तुमने नहीं सुना
  rationale: שׁמע के श्रवण-संबंधी रूपक को सुरक्षित रखता है और उसे केवल ‘आज्ञा नहीं मानी’ कहकर व्याख्यायित नहीं करता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में निज नाम सीधे प्रयुक्त है; ‘याहवे’ उसका आधुनिक हिन्दी लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
- issue: אַשְׁכֵּים וְדַבֵּר में निहित भविष्यद्वक्तापूर्ण मुहावरा
  choice: सवेरे उठ-उठकर ... बोलता रहा
  alternative: बार-बार बोलता रहा
  rationale: मुख्य पाठ में मूल की छवि को रखते हुए ‘उठ-उठकर’ और ‘बोलता रहा’ से निरंतरता और पुनरावृत्ति व्यक्त की गई है; पादटिप्पणी मुहावरे का आशय बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। समयावधि को डैशों के बीच रखकर मूल के व्याख्यात्मक सारांश को स्पष्ट किया गया है। पादटिप्पणी-चिह्न उसी वाक्यांश पर रखा गया है जिससे वह संबंधित है।
