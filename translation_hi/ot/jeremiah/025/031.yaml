  text: בָּ֤א שָׁאוֹן֙ עַד קְצֵ֣ה הָ/אָ֔רֶץ כִּ֣י רִ֤יב לַֽ/יהוָה֙ בַּ/גּוֹיִ֔ם נִשְׁפָּ֥ט ה֖וּא לְ/כָל בָּשָׂ֑ר הָ/רְשָׁעִ֛ים נְתָנָ֥/ם לַ/חֶ֖רֶב נְאֻם יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/031.yaml
  text: An uproar has come to the end of the earth[a], for Yahweh has a case against the nations; he is entering into judgment with all flesh. He has given the wicked to the sword[d][c][b], declares Yahweh.
translation:
  language: hi
  text: धरती के छोर तक कोलाहल पहुँच गया है[a], क्योंकि यहोवा का राष्ट्रों के विरुद्ध मुकदमा है[b]; वह समस्त मानवजाति के साथ न्याय की कार्यवाही कर रहा है[c]। उसने दुष्टों को तलवार के हवाले कर दिया है[d]—यहोवा की यह घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘गर्जना’ अथवा ‘उथल-पुथल’।
    reason: lexical_alternative
  - marker: b
    text: ‘मुकदमा’ के लिए प्रयुक्त इब्रानी शब्द का अनुवाद ‘विवाद’ या ‘अभियोग’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से ‘समस्त देह’; यह इब्रानी मुहावरा यहाँ पूरी मानवजाति को दर्शाता है।
    reason: idiom_explanation
  - marker: d
    text: या ‘दुष्टों को तलवार के लिए सौंप दिया है।’
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁאוֹן
  choice: कोलाहल
  rationale: यह शब्द न्याय और युद्ध के प्रसंग में ऊँची, अस्त-व्यस्त हलचल या गर्जना व्यक्त करता है; ‘कोलाहल’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: בָּא
  choice: पहुँच गया है
  rationale: पूर्ण क्रिया के भविष्यसूचक, सजीव बल को वर्तमान पूर्ण रूप में व्यक्त करता है और עַד के साथ स्वाभाविक हिन्दी बनाता है।
- source_word: עַד קְצֵה הָאָרֶץ
  choice: धरती के छोर तक
  rationale: एकवचन קְצֵה को बनाए रखते हुए समूची धरती की दूरस्थ सीमा का भाव देता है।
- source_word: רִיב לַיהוָה בַּגּוֹיִם
  choice: यहोवा का राष्ट्रों के विरुद्ध मुकदमा है
  rationale: רִיב का न्यायिक अर्थ सुरक्षित रखता है; प्रसंग में בַּגּוֹיִם का प्रतिकूल संबंध हिन्दी में ‘विरुद्ध’ से स्पष्ट होता है।
- source_word: נִשְׁפָּט הוּא
  choice: वह ... न्याय-विवाद कर रहा है
  rationale: निफ़अल रूप की न्यायिक और पारस्परिक छाया को बनाए रखता है; इसे केवल दंड सुनाने के अर्थ में सीमित नहीं करता।
- source_word: לְכָל בָּשָׂר
  choice: समस्त मानवजाति के साथ
  rationale: शाब्दिक ‘समस्त देह’ हिन्दी में अस्पष्ट हो सकता है; यह इब्रानी मुहावरे के सार्वभौमिक मानवीय आशय को स्पष्ट करता है।
- source_word: הָרְשָׁעִים
  choice: दुष्टों
  rationale: नैतिक श्रेणी को बिना नरम किए संक्षेप और स्वाभाविक रूप में व्यक्त करता है।
- source_word: נְתָנָם לַחֶרֶב
  choice: उन्हें तलवार के हवाले कर दिया है
  rationale: युद्ध द्वारा मृत्यु के लिए सौंपे जाने वाले इब्रानी मुहावरे का स्वाभाविक हिन्दी रूप है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण द्वारा प्रस्तुत करता है, किसी उपाधि से प्रतिस्थापित नहीं करता।
- source_word: נְאֻם יְהוָה
  choice: यहोवा की यह घोषणा है
  rationale: प्रामाणिक भविष्यसूचक सूत्र को आधुनिक, गरिमापूर्ण हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय न्याय की न्यायालय-संबंधी भाषा
  choice: ‘मुकदमा’ और ‘न्याय-विवाद’ दोनों रखे गए हैं।
  alternative: ‘विवाद’ या केवल ‘न्याय कर रहा है।’
  rationale: רִיב और נִשְׁפָּט मिलकर स्पष्ट न्यायिक चित्र बनाते हैं। यह रूप परमेश्वर को वादी और न्याय करने वाले के रूप में दिखाने वाली मूल पाठ की तनावपूर्ण छवि को बिना व्यवस्थित धर्मशास्त्रीय समाधान थोपे सुरक्षित रखता है।
- issue: כָל־בָּשָׂר का दायरा
  choice: मुख्य पाठ में ‘समस्त मानवजाति’।
  alternative: ‘समस्त देह’ या ‘हर प्राणी’।
  rationale: यहाँ मुहावरा सार्वभौमिक मानवीय दायरे को सूचित करता है; ‘हर प्राणी’ पशुओं को भी शामिल करने का भ्रम दे सकता है, जबकि शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- issue: दुष्टों को तलवार के हवाले करना
  choice: युद्धजनित दंड की कठोर छवि यथावत रखी गई है।
  alternative: ‘दुष्टों को मार डाला है।’
  rationale: ‘तलवार’ मूल रूपक और दैवी सौंपे जाने की भाषा दोनों को बचाती है; सीधा ‘मार डाला’ कारण और रूपक को अनावश्यक रूप से समतल कर देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी; शैली गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध है। न्यायालय-संबंधी शब्दावली को स्पष्ट रखा गया है, और अत्यधिक संस्कृतनिष्ठ या संप्रदाय-विशिष्ट भाषा से बचा गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में संबद्ध पदों के तुरंत बाद दिए गए हैं।
