  text: הִנְ/נִ֣י שֹׁלֵ֡חַ וְ/לָקַחְתִּי֩ אֶת כָּל מִשְׁפְּח֨וֹת צָפ֜וֹן נְאֻם יְהוָ֗ה וְ/אֶל נְבֽוּכַדְרֶאצַּ֣ר מֶֽלֶךְ בָּבֶל֮ עַבְדִּ/י֒ וַ/הֲבִ֨אֹתִ֜י/ם עַל הָ/אָ֤רֶץ הַ/זֹּאת֙ וְ/עַל יֹ֣שְׁבֶ֔י/הָ וְ/עַ֛ל כָּל הַ/גּוֹיִ֥ם הָ/אֵ֖לֶּה סָבִ֑יב וְ/הַ֣חֲרַמְתִּ֔י/ם וְ/שַׂמְתִּי/ם֙ לְ/שַׁמָּ֣ה וְ/לִ/שְׁרֵקָ֔ה וּ/לְ/חָרְב֖וֹת עוֹלָֽם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/009.yaml
  text: Look[a], I am sending for and taking all the clans of the north, declares Yahweh, and Nebuchadnezzar king of Babylon, my servant, and I will bring them against this land and against its inhabitants and against all these surrounding nations[b]. I will devote them to destruction and make them a horror, a hissing[c], and everlasting ruins.
translation:
  language: hi
  text: “देखो, मैं उत्तर के सभी कुलों को बुलवा रहा हूँ और इकट्ठा कर रहा हूँ,” यहोवा की घोषणा है, “और बाबेल के राजा नबूकदनेस्सर को भी, जो मेरा सेवक है। मैं उन सबको इस देश, इसके निवासियों और आसपास के इन सभी राष्ट्रों के विरुद्ध लाऊँगा। मैं इन्हें विनाश के लिए समर्पित कर दूँगा और इन्हें भय का विषय, सीटी बजाने का विषय और सदा के लिए खंडहर बना दूँगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנְנִי
  choice: देखो
  rationale: यह गंभीर ईश्वरीय घोषणा की ओर ध्यान खींचता है और आधुनिक हिन्दी में स्वाभाविक रहते हुए संकेतात्मक बल बनाए रखता है।
- source_word: שֹׁלֵחַ וְלָקַחְתִּי
  choice: बुलवा रहा हूँ
  rationale: इस प्रसंग में दोनों क्रियाएँ लोगों को संदेश भेजकर बुलाने और एकत्र करने की संयुक्त धारणा व्यक्त करती हैं। वर्तमान प्रगतिशील रूप आसन्न और निश्चित भविष्यसूचक कार्य को सजीव रखता है।
- source_word: מִשְׁפְּחוֹת צָפוֹן
  choice: उत्तर के सभी कुलों
  rationale: מִשְׁפְּחוֹת यहाँ केवल घर-परिवार नहीं, बल्कि व्यापक वंशीय या जनसमूहों को सूचित करता है; ‘कुल’ इस अर्थ को संक्षेप में सुरक्षित रखता है।
- source_word: נְאֻם יְהוָה
  choice: यहोवा की घोषणा है
  rationale: मानक भविष्यसूचक सूत्र का गरिमापूर्ण और स्पष्ट हिन्दी रूप; יהוה को व्यक्तिगत नाम ‘यहोवा’ के रूप में रखा गया है।
- source_word: וְאֶל נְבוּכַדְרֶאצַּר מֶלֶךְ בָּבֶל עַבְדִּי
  choice: और अपने सेवक, बाबेल के राजा नबूकदनेस्सर को भी
  rationale: मसोराई पाठ का אֶל वाक्यरचना में कठिन है। हिन्दी में इसे बुलाए जा रहे पक्षों में नबूकदनेस्सर को सम्मिलित करते हुए स्वाभाविक बनाया गया है; ‘अपने सेवक’ को उसके धर्मपरायण होने का अतिरिक्त दावा किए बिना अक्षरशः सुरक्षित रखा गया है।
- source_word: וַהֲבִאֹתִים עַל
  choice: मैं उन सबको ... के विरुद्ध लाऊँगा
  rationale: सैन्य और न्याय-संबंधी प्रसंग में עַל विरोधी दिशा दर्शाता है; भविष्यकाल घटनाक्रम को स्पष्ट करता है।
- source_word: וְהַחֲרַמְתִּים
  choice: मैं इन्हें विनाश के लिए अर्पित कर दूँगा
  rationale: यह חרם के हिफ़ील रूप में निहित ‘प्रतिबंध के अधीन करके विनाश हेतु समर्पित करना’ का तकनीकी भार बचाता है, जबकि मुख्य पाठ को समझने योग्य रखता है।
- source_word: לְשַׁמָּה
  choice: आतंक का विषय
  rationale: शब्द उजाड़ दशा और उसे देखकर उत्पन्न भय या स्तब्धता दोनों सूचित कर सकता है; यह चयन प्रभाव को व्यक्त करता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: לִשְׁרֵקָה
  choice: उपहास में सीटी बजाने का कारण
  rationale: शाब्दिक ‘सीटी’ को बनाए रखते हुए हिन्दी पाठक के लिए यह स्पष्ट करता है कि उजाड़ दशा दर्शकों की तिरस्कारपूर्ण या स्तब्ध प्रतिक्रिया का कारण बनेगी।
- source_word: לְחָרְבוֹת עוֹלָם
  choice: सदा के लिए खंडहर
  rationale: חרבות का भौतिक उजाड़पन और עולם की अनिश्चित दीर्घकालिकता गरिमापूर्ण, सहज हिन्दी में व्यक्त होती है।
theological_decisions:
- issue: नबूकदनेस्सर के लिए ‘मेरा सेवक’
  choice: उसे यहोवा के न्याय के साधन के रूप में ‘अपने सेवक’ कहा गया है।
  alternative: यह पदवी उसकी व्यक्तिगत भक्ति या वाचा के प्रति निष्ठा सिद्ध करती है।
  rationale: निकटवर्ती प्रसंग राष्ट्रों पर ईश्वरीय प्रभुता और बाबेल को न्याय के साधन के रूप में इस्तेमाल किए जाने पर केंद्रित है। अनुवाद पदवी को बनाए रखता है, पर उसमें व्यक्तिगत धार्मिक स्वीकृति नहीं जोड़ता।
- issue: חרם का अर्थ
  choice: विनाश के लिए अर्पित कर देना
  alternative: पूरी तरह नष्ट कर देना
  rationale: चुना हुआ रूप विनाश की तीव्रता के साथ किसी को प्रतिबंध के अधीन विनाश के लिए समर्पित करने की तकनीकी-धार्मिक छाया भी बनाए रखता है।
- issue: עוֹלָם की कालगत शक्ति
  choice: सदा के लिए
  alternative: बहुत लंबे समय तक
  rationale: हिब्रू शब्द स्थायी या अनिश्चित दीर्घ अवधि व्यक्त कर सकता है। मुख्य पाठ पारंपरिक प्रबल अभिव्यक्ति रखता है, बिना दार्शनिक रूप से अनंत अवधि की विस्तृत व्याख्या थोपे।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यसूचक शैली रखती है। ‘देखो’, ‘घोषणा’, ‘निवासी’, ‘विनाश’ और ‘खंडहर’ सामान्य पाठकों के लिए बोधगम्य हैं। लंबे हिब्रू वाक्य को दो वाक्यों में बाँटकर स्पष्टता बढ़ाई गई है। पादटिप्पणी-चिह्नों को उनके वास्तविक विषय—‘अपने सेवक’, חרם और शׁמה/שרקה—के साथ रखा गया है।
