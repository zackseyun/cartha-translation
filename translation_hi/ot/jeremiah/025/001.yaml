reference: Jeremiah 25:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הַ/דָּבָ֞ר אֲשֶׁר הָיָ֤ה עַֽל יִרְמְיָ֨הוּ֙ עַל כָּל עַ֣ם יְהוּדָ֔ה בַּ/שָּׁנָה֙ הָֽ/רְבִעִ֔ית לִ/יהוֹיָקִ֥ים בֶּן יֹאשִׁיָּ֖הוּ מֶ֣לֶךְ יְהוּדָ֑ה הִ֗יא הַ/שָּׁנָה֙ הָ/רִ֣אשֹׁנִ֔ית לִ/נְבֽוּכַדְרֶאצַּ֖ר מֶ֥לֶךְ בָּבֶֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/001.yaml
  text: The word that came to Yirmeyahu concerning all the people of Judah in the fourth year of Jehoiakim son of Josiah[a], king of Judah—it was the first year of Nebuchadnezzar king of Babylon—
translation:
  language: hi
  text: योशिय्याह के पुत्र, यहूदा के राजा यहोयाकीम के राज्य के चौथे वर्ष में, यहूदा की सारी प्रजा के विषय में[a] यिर्मयाह के पास यह वचन आया। यह बाबेल के राजा नबूकदरेस्सर के राज्य का पहला वर्ष था—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहूदा की सारी प्रजा के विरुद्ध।” भविष्यद्वाणी के प्रसंगों में हिब्रू पूर्वसर्ग के दोनों अर्थ संभव हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: הַדָּבָר
  choice: यह वचन
  rationale: भविष्यद्वाणी की भूमिका में דָּבָר प्रायः परमेश्वर से मिले संदेश को सूचित करता है। ‘वचन’ इस पारंपरिक भाव को बनाए रखता है और ‘संदेश’ की अपेक्षा मूल रूप के अधिक निकट है।
- source_word: אֲשֶׁר הָיָה עַל יִרְמְיָהוּ
  choice: यिर्मयाह के पास ... आया
  rationale: नबी के साथ היה על का यह स्वाभाविक हिन्दी रूप है; ‘यिर्मयाह पर हुआ’ अत्यधिक शाब्दिक और असहज होता।
- source_word: עַל כָּל עַם יְהוּדָה
  choice: यहूदा की सारी प्रजा के विषय में
  rationale: עַל यहाँ ‘के विषय में’ अथवा ‘के विरुद्ध’ हो सकता है। मुख्य पाठ में व्यापक और कम निर्णायक अर्थ रखा गया है, जबकि दूसरा संभव अर्थ पादटिप्पणी में दिया गया है।
- source_word: בַּשָּׁנָה הָרְבִעִית לִיהוֹיָקִים
  choice: यहोयाकीम के राज्य के चौथे वर्ष में
  rationale: राजकीय कालगणना को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करने के लिए ‘राज्य के’ प्रयुक्त है; इससे राजा की आयु समझे जाने की संभावना नहीं रहती।
- source_word: הִיא הַשָּׁנָה הָרִאשֹׁנִית לִנְבוּכַדְרֶאצַּר
  choice: यह ... नबूकदरेस्सर के राज्य का पहला वर्ष था
  rationale: सर्वनाम הִיא पहले बताए वर्ष को दूसरे राजा के शासन-वर्ष से समान ठहराता है। ‘राज्य का पहला वर्ष’ हिन्दी में राजकीय कालगणना का स्पष्ट रूप है।
- source_word: יִרְמְיָהוּ
  choice: यिर्मयाह
  rationale: हिन्दी में पहचाने जाने योग्य रूप रखते हुए हिब्रू नाम के निकट लिप्यंतरण।
- source_word: נְבוּכַדְרֶאצַּר
  choice: नबूकदरेस्सर
  rationale: इस पद में पाए जाने वाले हिब्रू रूप की र ध्वनि को सुरक्षित रखते हुए देवनागरी लिप्यंतरण।
- source_word: מֶלֶךְ בָּבֶל
  choice: बाबेल का राजा
  rationale: राजकीय उपाधि का सीधा अनुवाद; בָּבֶל के लिए स्रोत-निकट ‘बाबेल’ रखा गया है।
theological_decisions:
- issue: यहूदा की सारी प्रजा के साथ עַל का भाव
  choice: के विषय में
  alternative: के विरुद्ध
  rationale: अध्याय में न्याय का स्वर होने पर भी भूमिका का यह पूर्वसर्ग स्वयं केवल विषय या लक्ष्य बता सकता है। मुख्य पाठ में तटस्थ व्यापकता रखी गई है और विरोधात्मक संभावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। वाक्य के अंत में दीर्घ विराम-चिह्न इसलिए रखा गया है क्योंकि यह पद अगले पद में जारी होने वाली भूमिका है।
