  text: וְ/אֵ֣ת כָּל מַלְכֵ֣י הַ/צָּפ֗וֹן הַ/קְּרֹבִ֤ים וְ/הָֽ/רְחֹקִים֙ אִ֣ישׁ אֶל אָחִ֔י/ו וְ/אֵת֙ כָּל הַ/מַּמְלְכ֣וֹת הָ/אָ֔רֶץ אֲשֶׁ֖ר עַל פְּנֵ֣י הָ/אֲדָמָ֑ה וּ/מֶ֥לֶךְ שֵׁשַׁ֖ךְ יִשְׁתֶּ֥ה אַחֲרֵי/הֶֽם׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/026.yaml
  text: and all the kings of the north[a], both near and far, each one with his brother, and all the kingdoms of the earth that are on the face of the ground. And the king of Sheshach will drink after them.
translation:
  language: hi
  text: और उत्तर दिशा के सभी राजाओं को—निकट हों या दूर, हर एक अपने भाई के साथ—और पृथ्वी के उन सभी राज्यों को जो भूमि की सतह पर हैं। उनके बाद शेशक[a] का राजा पिएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘शेशक’ को व्यापक रूप से बाबुल का एक गूढ़ नाम माना जाता है, जो संभवतः अतबश नामक अक्षर-विनिमय पद्धति से बना है।
    reason: नाम की संभावित पहचान और शब्द-कूट की व्याख्या
lexical_decisions:
- source_word: מַלְכֵי הַצָּפוֹן
  choice: उत्तर दिशा के सभी राजा
  rationale: इब्रानी संबंधवाचक रचना और भौगोलिक अर्थ को बिना किसी विशेष क्षेत्र की पहचान जोड़े सीधे व्यक्त करता है।
- source_word: הַקְּרֹבִים וְהָרְחֹקִים
  choice: चाहे वे निकट हों या दूर
  rationale: निकट और दूर की समावेशी जोड़ी को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: אִישׁ אֶל אָחִיו
  choice: एक-दूसरे के साथ
  rationale: शाब्दिक ‘हर एक अपने भाई के साथ’ यहाँ वास्तविक भाईचारे का भ्रामक संकेत दे सकता है। यह रूप राजाओं के पारस्परिक क्रम या निकटता को व्यक्त करते हुए मूल की कुछ अस्पष्टता बनाए रखता है।
- source_word: כָּל הַמַּמְלְכוֹת הָאָרֶץ
  choice: पृथ्वी के सभी राज्य
  rationale: आगे के सार्वभौमिक विस्तार के अनुरूप אֶרֶץ को यहाँ ‘पृथ्वी’ कहा गया है, न कि किसी एक देश या भूभाग को।
- source_word: אֲשֶׁר עַל פְּנֵי הָאֲדָמָה
  choice: भूमि के ऊपर स्थित
  rationale: אֲדָמָה को पिछले אֶרֶץ से अलग दिखाने के लिए ‘भूमि’ रखा गया है; हिन्दी में सहजता के लिए ‘मुख पर’ के स्थान पर ‘ऊपर स्थित’ कहा गया है।
- source_word: שֵׁשַׁךְ
  choice: शेशक
  rationale: मूल पाठ के गूढ़ व्यक्तिवाचक नाम को मुख्य पाठ में लिप्यंतरित किया गया है; उसकी संभावित पहचान टिप्पणी में दी गई है।
- source_word: יִשְׁתֶּה אַחֲרֵיהֶם
  choice: उनके बाद पिएगा
  rationale: पिछले प्रसंग के क्रोध के प्याले की छवि को जारी रखते हुए क्रिया और कालक्रम को सुरक्षित रखता है, पर इस पद में अनुपस्थित ‘प्याला’ नहीं जोड़ता।
theological_decisions:
- issue: ‘शेशक’ की पहचान
  choice: मुख्य पाठ में ‘शेशक’ रखा गया और टिप्पणी में बाबुल की संभावित पहचान बताई गई।
  alternative: मुख्य पाठ में सीधे ‘बाबुल’ लिखना।
  rationale: इब्रानी पाठ में שֵׁשַׁךְ है, בָּבֶל नहीं। अतः पाठ की जानबूझकर रखी गई गूढ़ता को मिटाए बिना संभावित अर्थ पाठक को टिप्पणी में बताया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। पद पिछले वाक्य की कर्म-सूची को आगे बढ़ाता है, इसलिए आरम्भ में ‘और’ तथा ‘को’ बनाए रखे गए हैं।
