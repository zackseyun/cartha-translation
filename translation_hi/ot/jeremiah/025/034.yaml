id: JER.25.34
reference: Jeremiah 25:34
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הֵילִ֨ילוּ הָ/רֹעִ֜ים וְ/זַעֲק֗וּ וְ/הִֽתְפַּלְּשׁוּ֙ אַדִּירֵ֣י הַ/צֹּ֔אן כִּֽי מָלְא֥וּ יְמֵי/כֶ֖ם לִ/טְב֑וֹחַ וּ/תְפוֹצ֣וֹתִי/כֶ֔ם וּ/נְפַלְתֶּ֖ם כִּ/כְלִ֥י חֶמְדָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/034.yaml
  text: Wail[a], you shepherds, and cry out; roll in the dust, you lords of the flock, for the days of your slaughter are fulfilled[b], and your dispersions have come[e][d][c], and you will fall like a precious vessel.
translation:
  language: hi
  text: हे चरवाहो, विलाप करो[a] और दुहाई दो; धूल में लोटो[b], हे झुंड के प्रधानो[c], क्योंकि तुम्हारे वध के दिन पूरे हो गए हैं, और तुम्हारे तितर-बितर होने का समय आ गया है[d]; तुम बहुमूल्य पात्र के समान गिरोगे[e]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हाहाकार मचाओ।” इब्रानी क्रिया ऊँची आवाज़ में किए जाने वाले शोक को व्यक्त करती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “अपने को लोटाओ”; सम्भवतः धूल या राख में लोटने की शोक-क्रिया अभिप्रेत है।
    reason: cultural_note
  - marker: c
    text: या “झुंड के कुलीनो/सामर्थियो।” यह पद प्रतिष्ठित और शक्तिशाली अगुओं को दर्शा सकता है।
    reason: lexical_alternative
  - marker: d
    text: “तुम्हारे तितर-बितर होने” वाला इब्रानी पद कठिन है। उसका अर्थ “तुम्हारे बिखराव” भी हो सकता है; यहाँ समय आने का भाव पिछले उपवाक्य से ग्रहण किया गया है।
    reason: alternative_reading
  - marker: e
    text: या “मनोहर पात्र के समान।” चित्र किसी मूल्यवान वस्तु का है, जो गिरकर टूट सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵילִילוּ
  choice: विलाप करो
  rationale: यह बहुवचन आज्ञार्थक क्रिया ऊँची आवाज़ में शोक करने या हाहाकार मचाने को व्यक्त करती है। ‘विलाप करो’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है; पादटिप्पणी इसकी तीव्र ध्वनि स्पष्ट करती है।
- source_word: הָרֹעִים
  choice: हे चरवाहो
  rationale: मूल पाठ का चरवाही-रूपक बनाए रखा गया है। यद्यपि सन्दर्भ में यह शासकों या अगुओं की ओर संकेत करता है, मुख्य पाठ में रूपक की व्याख्या डालना उचित नहीं होगा।
- source_word: וְזַעֲקוּ
  choice: और दुहाई दो
  rationale: זעק संकट में ऊँची पुकार को व्यक्त करता है। ‘दुहाई दो’ न्याय और विपत्ति के प्रसंग में तीव्र पुकार का स्वाभाविक हिन्दी रूप है।
- source_word: וְהִתְפַּלְּשׁוּ
  choice: धूल में लोटो
  rationale: हित्पएल रूप यहाँ शोक और अपमान की देहगत मुद्रा को सूचित करता है। मूल में ‘धूल’ स्पष्ट रूप से नहीं है, पर इसी सांस्कृतिक क्रिया का आशय बताने के लिए इसे मुख्य पाठ में रखा गया और पादटिप्पणी में स्पष्ट किया गया है।
- source_word: אַדִּירֵי הַצֹּאן
  choice: हे झुंड के प्रधानो
  rationale: אַדִּירֵי प्रतिष्ठित, सामर्थी या कुलीन व्यक्तियों को दर्शाता है। ‘प्रधानो’ अधिकार और ऊँचे पद का भाव रखता है और झुंड का रूपक भी सुरक्षित रहता है।
- source_word: כִּי מָלְאוּ יְמֵיכֶם לִטְבוֹחַ
  choice: क्योंकि तुम्हारे वध के दिन पूरे हो गए हैं
  rationale: यह अनुवाद नियुक्त समय के पूर्ण हो जाने और हिंसक न्याय—दोनों को बनाए रखता है। ‘विनाश’ जैसे नरम विकल्प के बजाय ‘वध’ मूल की तीक्ष्णता व्यक्त करता है।
- source_word: וּתְפוֹצוֹתִיכֶם
  choice: और तुम्हारे तितर-बितर होने का समय आ गया है
  rationale: स्वरांकित रूप संज्ञा ‘तुम्हारे बिखराव/तितर-बितर होने’ की ओर संकेत करता है, किंतु पदबंध कठिन है और उसमें व्यक्त क्रिया नहीं है। पिछले उपवाक्य से समय पूरा होने का भाव लेकर हिन्दी में इसे बोधगम्य बनाया गया है, जबकि पादटिप्पणी अनिश्चितता सुरक्षित रखती है।
- source_word: וּנְפַלְתֶּם
  choice: तुम ... गिरोगे
  rationale: न्याय की भविष्यवाणी के प्रसंग में पूर्ण क्रिया का परिणामसूचक भविष्य अर्थ है। सरल ‘गिरोगे’ मूल बिंब को बिना बढ़ाए रखता है।
- source_word: כִּכְלִי חֶמְדָּה
  choice: बहुमूल्य पात्र के समान
  rationale: כְּלִי किसी पात्र या वस्तु और חֶמְדָּה मूल्यवान, मनोहर या चाहने योग्य होने का भाव देता है। ‘बहुमूल्य पात्र’ मूल्य और टूट सकने की अंतर्निहित छवि दोनों बनाए रखता है।
theological_decisions:
- issue: ‘चरवाहों’ और ‘झुंड के प्रधानों’ का अभिप्राय
  choice: मुख्य पाठ में चरवाही का रूपक बनाए रखा गया है।
  alternative: इसे सीधे ‘शासको’ या ‘अगुओ’ के रूप में प्रस्तुत करना।
  rationale: यिर्मयाह में यह रूपक राष्ट्रीय अगुओं के लिए प्रयुक्त हो सकता है, पर मूल पद स्वयं चरवाहों और झुंड की भाषा रखता है। उसे सुरक्षित रखना व्याख्यात्मक अतिरेक और किसी विशिष्ट शासन-सिद्धान्त को आरोपित करने से बचाता है।
- issue: वध की न्याय-संबंधी भाषा
  choice: ‘वध’ की स्पष्ट और कठोर भाषा रखी गई है।
  alternative: इसे ‘विनाश’ या ‘मृत्यु’ कहकर नरम करना।
  rationale: לִטְבוֹחַ का हिंसक बल पाठ के न्याय-बिंब का अंग है; उसे नरम करना मूल की तीव्रता घटा देता।
- issue: וּתְפוֹצוֹתִיכֶם की कठिनता
  choice: मुख्य पाठ में तितर-बितर होने के समय का भाव दिया गया है और पादटिप्पणी में व्याकरणिक कठिनता बताई गई है।
  alternative: निश्चयपूर्वक ‘मैं तुम्हें तितर-बितर कर दूँगा’ या ‘तुम्हारे टूटे टुकड़े’ कहना।
  rationale: स्वरांकित मसोराई रूप संज्ञात्मक है और स्पष्ट कर्तृवाचक क्रिया नहीं देता। इसलिए संभावित अर्थ को बोधगम्य बनाते हुए उसकी वास्तविक अनिश्चितता छिपाई नहीं गई।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण भविष्यवाणी-संबंधी लहजा रखा गया है। ‘चरवाहो’, ‘झुंड’ और ‘पात्र’ जैसे मूल बिंब सुरक्षित हैं; कठिन इब्रानी पद को सहज हिन्दी में प्रस्तुत करके उसकी अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
