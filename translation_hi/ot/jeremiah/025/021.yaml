base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/021.yaml
  text: Edom[a], Moab, and the sons of Ammon;
translation:
  language: hi
  text: एदोम, मोआब और अम्मोन के पुत्रों[a] को;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अम्मोनियों” (शाब्दिक अर्थ, “अम्मोन के पुत्रों”)।
    reason: ‘בְּנֵי עַמּוֹן’ का शाब्दिक संबंधसूचक रूप और उसका स्वाभाविक जातिवाचक अर्थ दोनों स्पष्ट करने के लिए।
lexical_decisions:
- source_word: אֱדוֹם
  choice: एदोम
  rationale: यह राष्ट्र अथवा भूभाग का व्यक्तिवाचक नाम है; इसलिए इसे जातिवाचक ‘एदोमियों’ में बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: מוֹאָב
  choice: मोआब
  rationale: मूल में राष्ट्र अथवा भूभाग का व्यक्तिवाचक नाम है; ‘मोआबियों’ की अपेक्षा ‘मोआब’ स्रोत के रूप को अधिक सीधे दर्शाता है।
- source_word: בְּנֵי עַמּוֹן
  choice: अम्मोन के पुत्रों
  rationale: इब्रानी के संबंधसूचक पदबंध ‘अम्मोन के पुत्र’ को सुरक्षित रखा गया है। प्रसंग में इसका अर्थ अम्मोन के लोग अथवा अम्मोनी है, जिसे पादटिप्पणी में दिया गया है।
- source_word: אֶת ... וְאֶת ... וְאֶת
  choice: … को; तथा सूची में ‘और’
  rationale: इब्रानी का कर्म-सूचक אֶת हिन्दी में सूची के अंत में ‘को’ से व्यक्त किया गया है; וְ को स्वाभाविक हिन्दी सूची-रचना के अनुसार अंतिम पद से पहले ‘और’ किया गया है।
