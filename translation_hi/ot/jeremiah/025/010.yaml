id: JER.25.10
reference: Jeremiah 25:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הַאֲבַדְתִּ֣י מֵ/הֶ֗ם ק֤וֹל שָׂשׂוֹן֙ וְ/ק֣וֹל שִׂמְחָ֔ה ק֥וֹל חָתָ֖ן וְ/ק֣וֹל כַּלָּ֑ה ק֥וֹל רֵחַ֖יִם וְ/א֥וֹר נֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/010.yaml
  text: And I will destroy from among them the sound of joy and the sound of gladness[a], the voice of the bridegroom and the voice of the bride[b], the sound of the millstones and the light of the lamp.
translation:
  language: hi
  text: और मैं उनके बीच से हर्ष का स्वर और आनन्द का स्वर[a], दूल्हे की आवाज़ और दुल्हन की आवाज़[b], चक्की के पाटों की आवाज़ और दीपक का प्रकाश मिटा दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मैं उनके बीच से … समाप्त कर दूँगा।” इब्रानी क्रिया कारणवाचक है और किसी वस्तु को नष्ट या लुप्त कर देने का भाव रखती है।
    reason: lexical_alternative
  - marker: b
    text: “दूल्हे की आवाज़ और दुल्हन की आवाज़” विवाहोत्सव और सामान्य सामुदायिक जीवन का प्रचलित बिम्ब है।
    reason: cultural_note
lexical_decisions:
- source_word: וְהַאֲבַדְתִּי
  choice: मिटा दूँगा
  rationale: אבד के हिफ़ील रूप का अर्थ किसी वस्तु को नष्ट कर देना अथवा लुप्त कर देना है। यहाँ कर्म मनुष्य नहीं, बल्कि जीवन के स्वर और चिह्न हैं; इसलिए “मिटा दूँगा” कारणवाचक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מֵהֶם
  choice: उनके बीच से
  rationale: מן के साथ सर्वनाम समुदाय के मध्य से हटाए जाने का भाव देता है।
- source_word: קוֹל שָׂשׂוֹן וְקוֹל שִׂמְחָה
  choice: हर्ष का स्वर और आनन्द का स्वर
  rationale: שָׂשׂוֹן और שִׂמְחָה के निकटार्थी किन्तु अलग शब्दों को “हर्ष” और “आनन्द” से अलग रखा गया है; קוֹל की पुनरावृत्ति भी बनाए रखी गई है।
- source_word: קוֹל חָתָן וְקוֹל כַּלָּה
  choice: दूल्हे की आवाज़ और दुल्हन की आवाज़
  rationale: मानवीय कंठध्वनि और विवाहोत्सव के ठोस बिम्ब को आधुनिक, सहज हिन्दी में सुरक्षित रखा गया है।
- source_word: קוֹל רֵחַיִם
  choice: चक्की के पाटों की आवाज़
  rationale: רֵחַיִם द्विवचन रूप है और अनाज पीसने वाले पाटों की ओर संकेत करता है; यह घरेलू जीवन की सामान्य गतिविधि का बिम्ब है।
- source_word: אוֹר נֵר
  choice: दीपक का प्रकाश
  rationale: मूल के सरल संबंधवाचक पदबंध और बसे हुए घर के दृश्य-चिह्न को औपचारिक किन्तु बोधगम्य हिन्दी में रखा गया है।
theological_decisions:
- issue: न्याय के अन्तर्गत सामान्य सामुदायिक जीवन के चिह्नों का हटना
  choice: मूल में गिनाए गए आनन्द, विवाह, पीसने और दीपक के ठोस बिम्बों को ज्यों का त्यों रखा गया है।
  alternative: भावार्थ रूप में “मैं उनके जीवन की सारी खुशी और चहल-पहल समाप्त कर दूँगा।”
  rationale: भावार्थ विनाश का सामान्य आशय तो देता, पर सामुदायिक और घरेलू जीवन के क्रमिक बिम्बों तथा उनकी काव्यात्मक पुनरावृत्ति को खो देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज भविष्यकालीन वाक्य। קוֹל की पुनरावृत्ति को “स्वर/आवाज़” के माध्यम से यथासम्भव बनाए रखा गया है, जबकि हिन्दी की स्वाभाविकता के लिए आनन्द के अमूर्त पदों के साथ “स्वर” और मानवीय तथा यांत्रिक ध्वनियों के साथ “आवाज़” चुना गया है।
