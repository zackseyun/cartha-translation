source:
  edition: WLC
  text: וְ/שָׁלַח֩ יְהוָ֨ה אֲלֵי/כֶ֜ם אֶֽת כָּל עֲבָדָ֧י/ו הַ/נְּבִאִ֛ים הַשְׁכֵּ֥ם וְ/שָׁלֹ֖חַ וְ/לֹ֣א שְׁמַעְתֶּ֑ם וְ/לֹֽא הִטִּיתֶ֥ם אֶֽת אָזְנְ/כֶ֖ם לִ/שְׁמֹֽעַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/004.yaml
  text: And Yahweh sent to you all his servants the prophets[a], rising early and sending them, but you did not listen, nor did you incline your ear to hear.
translation:
  language: hi
  text: और यहोवा ने अपने सभी सेवकों अर्थात् नबियों को तुम्हारे पास बड़े यत्न से बार-बार भेजा[a], परन्तु तुमने न सुना और न सुनने के लिए कान लगाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “सवेरे उठकर भेजा”; यह इब्रानी मुहावरा नबियों को बार-बार, तत्परता और बड़े यत्न से भेजने का भाव व्यक्त करता है।
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׁלַח
  choice: और ... भेजा
  rationale: संयोजक वाव के साथ काल रूप को प्रसंगानुसार सामान्य भूतकाल में रखा गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के विशिष्ट नाम को हिन्दी में प्रचलित नामरूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: כָּל עֲבָדָיו הַנְּבִאִים
  choice: अपने सभी सेवकों, नबियों को
  rationale: ‘नबियों’ को ‘सेवकों’ की व्याख्या करने वाले समानाधिकरण पद के रूप में रखा गया है; यहाँ עבד नियुक्त सेवक का आदरसूचक अर्थ देता है।
- source_word: הַשְׁכֵּם וְשָׁלֹחַ
  choice: बड़े यत्न से बार-बार भेजा
  rationale: इन दो क्रियारूपों का संयुक्त प्रयोग तत्परता, आग्रह और पुनरावृत्ति व्यक्त करने वाला इब्रानी मुहावरा है; हिन्दी में उसका आशय स्वाभाविक रूप से व्यक्त किया गया है और मूल बिंब पादटिप्पणी में दिया गया है।
- source_word: וְלֹא שְׁמַעְתֶּם
  choice: फिर भी तुमने न सुना
  rationale: यहाँ ‘सुनना’ केवल ध्वनि ग्रहण करना नहीं, बल्कि ध्यान देकर स्वीकार करना भी सूचित करता है; ‘फिर भी’ विरोधात्मक संबंध स्पष्ट करता है।
- source_word: וְלֹא הִטִּיתֶם אֶת אָזְנְכֶם לִשְׁמֹעַ
  choice: और न सुनने के लिए कान लगाया
  rationale: कान झुकाने के मूल रूपक को सहज हिन्दी मुहावरे ‘कान लगाना’ से सुरक्षित रखा गया है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में चार अक्षरों वाला विशिष्ट ईश्वरीय नाम है। उसे सामान्य उपाधि ‘प्रभु’ से बदलने के बजाय हिन्दी पाठकों में परिचित नामरूप ‘यहोवा’ रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘बड़े यत्न से बार-बार’ मूल मुहावरे की पुनरावृत्ति और तत्परता दोनों व्यक्त करता है; ‘कान लगाया’ मूल रूपक को स्वाभाविक हिन्दी में बनाए रखता है।
