  text: and all the mixed people[a], and all the kings of the land of Uz, and all the kings of the land of the Philistines—Ashkelon, Gaza, Ekron, and the remnant of Ashdod[c][b];
translation:
  language: hi
  text: और सारी मिली-जुली आबादी[a], ऊज़ देश के सभी राजाओं, और पलिश्तियों के देश[b] के सभी राजाओं—अश्कलोन, गाज़ा, एक्रोन, और अशदोद के बचे हुए अंश[c]—को;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मिला-जुला जनसमुदाय”; सम्भवतः किसी एक जाति के बजाय विभिन्न मूल के विदेशियों की मिली-जुली आबादी।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “पलिश्तियों का देश”; परम्परागत रूप से “पलिश्तिया।”
    reason: lexical_alternative
  - marker: c
    text: या “अशदोद का बचा हुआ भाग” अथवा “अशदोद के जीवित बचे लोग।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֶרֶב
  choice: मिली-जुली आबादी
  rationale: यहाँ यह शब्द संभवतः किसी एक जातीय समूह के बजाय विविध मूल के लोगों की मिश्रित आबादी को सूचित करता है। यह अनुवाद उस सामूहिक अर्थ को स्वाभाविक आधुनिक हिन्दी में रखता है और ‘अरबियों’ जैसा अनिश्चित विशिष्टीकरण नहीं करता।
- source_word: מַלְכֵי אֶרֶץ הָעוּץ
  choice: ऊज़ देश के सभी राजा
  rationale: אֶרֶץ को इस भू-राजनीतिक सूची में ‘देश’ और עוּץ को स्थाननाम ‘ऊज़’ के रूप में रखा गया है।
- source_word: מַלְכֵי אֶרֶץ פְּלִשְׁתִּים
  choice: पलिश्तियों के देश के सभी राजा
  rationale: यह इब्रानी के जातीय-भौगोलिक वाक्यांश को स्पष्ट रूप से सुरक्षित रखता है; केवल ‘पलिश्तिया’ कहना अधिक संक्षिप्त होता, पर स्रोत की संरचना कम दिखाई देती।
- source_word: אַשְׁקְלוֹן
  choice: अश्कलोन
  rationale: पलिश्ती नगर के इब्रानी नाम का हिन्दी लिप्यंतरण।
- source_word: עַזָּה
  choice: गाज़ा
  rationale: इस प्रसिद्ध स्थाननाम का प्रचलित आधुनिक हिन्दी रूप।
- source_word: עֶקְרוֹן
  choice: एक्रोन
  rationale: इब्रानी नगरनाम का सुबोध हिन्दी लिप्यंतरण।
- source_word: שְׁאֵרִית אַשְׁדּוֹד
  choice: अशदोद के बचे हुए लोग
  rationale: שְׁאֵרִית किसी विनाश के बाद बचे शेष को दर्शाता है। मुख्य पाठ में लोगों का अर्थ स्वाभाविक है, जबकि पादटिप्पणी नगर या राज्य के बचे हुए अंश की वास्तविक सम्भावना को सुरक्षित रखती है।
