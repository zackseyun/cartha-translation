  text: כִּ֣י כֹה֩ אָמַ֨ר יְהוָ֜ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ אֵלַ֔/י קַ֠ח אֶת כּ֨וֹס הַ/יַּ֧יִן הַ/חֵמָ֛ה הַ/זֹּ֖את מִ/יָּדִ֑/י וְ/הִשְׁקִיתָ֤ה אֹת/וֹ֙ אֶת כָּל הַ/גּוֹיִ֔ם אֲשֶׁ֧ר אָנֹכִ֛י שֹׁלֵ֥חַ אוֹתְ/ךָ֖ אֲלֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/015.yaml
  text: 'For thus said Yahweh[a], the God of Israel, to me: “Take from my hand this cup of the wine of wrath, and make all the nations to whom I am sending you drink it.”'
translation:
  language: hi
  text: 'क्योंकि इस्राएल के परमेश्वर यहोवा ने मुझसे ऐसा कहा: “मेरे हाथ से कोप[a] की मदिरा का यह प्याला ले और उन सभी राष्ट्रों को इसे पिला, जिनके पास मैं तुझे भेज रहा हूँ।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “रोष की मदिरा।”
    reason: חֵמָה के लिए ‘कोप’ का निकटवर्ती शब्दार्थिक विकल्प।
lexical_decisions:
- source_word: כִּי כֹה אָמַר
  choice: क्योंकि ... ने मुझसे यह कहा
  rationale: כִּי के प्रसंग-संबंधी कारणसूचक बल और כֹה की ओर संकेत करने वाली अभिव्यक्ति को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: ईश्वर के विशिष्ट वाचा-नाम को सामान्य उपाधि से बदलने के बजाय हिन्दी में प्रचलित नामरूप से प्रस्तुत करता है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर
  rationale: इब्रानी संबंध-वाचक संरचना का सीधा और स्वाभाविक हिन्दी अनुवाद।
- source_word: קַח אֶת כּוֹס
  choice: यह प्याला ले
  rationale: आज्ञार्थक क्रिया और प्याले के ठोस बिंब को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: הַיַּיִן הַחֵמָה
  choice: कोप की मदिरा
  rationale: दैवी न्याय के रूपक को बनाए रखते हुए חֵמָה के प्रबल न्यायसूचक अर्थ को ‘कोप’ से व्यक्त करता है।
- source_word: מִיָּדִי
  choice: मेरे हाथ से
  rationale: प्याला स्वयं परमेश्वर के हाथ से मिलने का मूल बिंब अक्षुण्ण रखता है।
- source_word: וְהִשְׁקִיתָה אֹתוֹ
  choice: इसे पिला
  rationale: हिफ़ील के प्रयोजक अर्थ को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כָּל הַגּוֹיִם
  choice: सभी राष्ट्रों
  rationale: अंतरराष्ट्रीय न्याय के प्रसंग में גּוֹיִם का अर्थ ‘राष्ट्र’ है; बाद के धार्मिक अर्थ वाला ‘अन्यजाति’ यहाँ अनावश्यक होगा।
- source_word: אֲשֶׁר אָנֹכִי שֹׁלֵחַ אוֹתְךָ אֲלֵיהֶם
  choice: जिनके पास मैं तुझे भेज रहा हूँ
  rationale: भेजे जाने की दिशा और जारी दायित्व, दोनों को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: חֵמָה में दैवी न्याय और तीव्र क्रोध का अर्थ
  choice: कोप
  alternative: प्रचंड क्रोध
  rationale: ‘कोप’ दैवी न्याय की गंभीरता और तीव्रता को गरिमापूर्ण ढंग से व्यक्त करता है, जबकि ‘प्रचंड क्रोध’ सम्भव विकल्प है पर मुख्य पाठ में भाव को कुछ अधिक व्याख्यायित कर सकता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। भविष्यवाणी के प्याले और मदिरा के रूपक को शाब्दिक रूप से बनाए रखा गया है; ‘तुझे’ एकवचन सम्बोधन को स्पष्ट करता है।
