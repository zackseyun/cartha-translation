  terminology: ‘सेनाओं का यहोवा’ and ‘इस्राएल का परमेश्वर’ appropriately render the divine name and titles. The revised order follows the Hebrew appositional order. ‘उलटी करो’ is a clear modern-Hindi rendering; the footnote supplies the more formal lexical alternative ‘वमन करो।’
