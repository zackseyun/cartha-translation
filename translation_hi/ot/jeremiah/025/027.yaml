reference: Jeremiah 25:27
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֡ם כֹּֽה אָמַר֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל שְׁת֤וּ וְ/שִׁכְרוּ֙ וּ/קְי֔וּ וְ/נִפְל֖וּ וְ/לֹ֣א תָק֑וּמוּ מִ/פְּנֵ֣י הַ/חֶ֔רֶב אֲשֶׁ֛ר אָנֹכִ֥י שֹׁלֵ֖חַ בֵּינֵי/כֶֽםס־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/027.yaml
  text: 'You shall say to them[a], ‘Thus says Yahweh of hosts, the God of Israel: Drink and become drunk, and vomit, and fall, and do not rise, because of the sword that I am sending among you.’'
translation:
  language: hi
  text: 'तुम उनसे कहना, “सेनाओं का यहोवा, इस्राएल का परमेश्वर, यह कहता है: ‘पीओ और मतवाले हो जाओ, उलटी करो[a], गिर पड़ो, और उठो मत, क्योंकि मैं तुम्हारे बीच तलवार भेज रहा हूँ।’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वमन करो।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: तुम उनसे कहना
  rationale: भविष्यवाणी के निर्देशात्मक प्रसंग में वाव-सहित पूर्ण क्रिया को स्वाभाविक हिन्दी आज्ञार्थक रूप में व्यक्त किया गया है।
- source_word: כֹּה אָמַר
  choice: यह कहता है
  rationale: यह मानक भविष्यद्वक्ताई संदेश-सूत्र है; वर्तमान काल ईश्वरीय वचन की तात्कालिकता बनाए रखता है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम को ‘यहोवा’ रूप में रखा गया है और צְבָאוֹת का व्यापक तथा परिचित अर्थ ‘सेनाओं’ से व्यक्त किया गया है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल का परमेश्वर
  rationale: सम्बन्धवाचक रचना का सीधा और स्वाभाविक हिन्दी अनुवाद।
- source_word: שְׁתוּ וְשִׁכְרוּ
  choice: पीओ और मतवाले हो जाओ
  rationale: दोनों बहुवचन आज्ञाओं और नशे में आने की क्रमिक क्रिया को स्पष्ट रूप से बनाए रखता है।
- source_word: וּקְיוּ
  choice: उलटी करो
  rationale: दुर्लभ क्रिया का मूल अर्थ वमन करना है; ‘उलटी करो’ आधुनिक सामान्य हिन्दी में सीधा और स्पष्ट है।
- source_word: וְנִפְלוּ וְלֹא תָקוּמוּ
  choice: गिर पड़ो; फिर उठ न सको
  rationale: पतन और न उठ पाने की क्रमिक छवि सुरक्षित है। ‘सको’ परिणामसूचक हिन्दी में स्वाभाविक है, जबकि ‘फिर’ प्रसंगगत स्थायित्व को व्यक्त करता है।
- source_word: מִפְּנֵי הַחֶרֶב
  choice: क्योंकि ... तलवार
  rationale: यहाँ पदबंध तलवार को उनके न उठ पाने का कारण बताता है; हिन्दी में कारणवाचक रचना सर्वाधिक स्पष्ट है।
- source_word: אֲשֶׁר אָנֹכִי שֹׁלֵחַ בֵּינֵיכֶם
  choice: मैं तुम्हारे बीच तलवार भेज रहा हूँ
  rationale: בֵּינֵיכֶם की स्थानगत बारीकी ‘तुम्हारे बीच’ से सुरक्षित रहती है; ‘तुम्हारे विरुद्ध’ निहितार्थ को अनावश्यक रूप से स्पष्ट नहीं किया गया।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में उपाधि नहीं, चतुरक्षरीय व्यक्तिगत नाम है। हिन्दी बाइबलीय प्रयोग में व्यापक और समझने योग्य लिप्यंतरण ‘यहोवा’ चुना गया है; इसे ‘प्रभु’ से प्रतिस्थापित नहीं किया गया।
- issue: मदिरा और तलवार की संयुक्त न्याय-छवि
  choice: शाब्दिक क्रम और तनाव बनाए रखा
  alternative: पीने को केवल रूपक बताकर अर्थ खोल देना
  rationale: पद स्वयं प्याले के आदेश और भेजी जा रही तलवार के बीच संबंध को पूरी तरह नहीं खोलता; अनुवाद ने इस काव्यात्मक-धार्मिक तनाव को व्याख्या द्वारा समाप्त नहीं किया।
translation_notes:
  register: आधुनिक, dignified और सामान्य पाठक के लिए स्पष्ट हिन्दी। बहुवचन आज्ञाओं को प्रत्यक्ष रखा गया है। उद्धरण-स्तरों से यह स्पष्ट किया गया है कि यिर्मयाह को लोगों से यहोवा का संदेश कहना है।
