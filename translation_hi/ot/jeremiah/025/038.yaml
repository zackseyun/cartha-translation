source:
  edition: WLC
  text: עָזַ֥ב כַּ/כְּפִ֖יר סֻכּ֑/וֹ כִּֽי הָיְתָ֤ה אַרְצָ/ם֙ לְ/שַׁמָּ֔ה מִ/פְּנֵי֙ חֲר֣וֹן הַ/יּוֹנָ֔ה וּ/מִ/פְּנֵ֖י חֲר֥וֹן אַפּֽ/וֹ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/038.yaml
  text: Like a young lion[a], he has left his den, for their land has become a desolation because of the burning anger of the oppressor[b], and because of his burning anger.
translation:
  language: hi
  text: जवान सिंह के समान उसने अपनी मांद छोड़ दी है, क्योंकि अत्याचारी[a] के धधकते क्रोध और उसके[b] धधकते क्रोध के कारण उनका देश उजाड़ हो गया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘कबूतर’। इब्रानी का लिखित रूप इस तरह पढ़ा जा सकता है, लेकिन प्रसंग ‘अत्याचारी’ जैसे अर्थ का अधिक समर्थन करता है।
    reason: alternative_reading
  - marker: b
    text: आस-पास के प्रसंग में ‘उसके’ से संभवतः यहोवा अभिप्रेत हैं; कुछ लोग इसे पिछले वाक्यांश के अत्याचारी से संबंधित समझते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: עָזַב
  choice: छोड़ दी है
  rationale: काल रूप पूर्ण हो चुकी क्रिया बताता है; हिन्दी का पूर्ण वर्तमान उसके वर्तमान परिणाम को भी स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כַּכְּפִיר
  choice: जवान सिंह के समान
  rationale: כפיר सामान्यतः शक्तिशाली युवा सिंह को सूचित करता है; यह रूपक को स्पष्ट रखता है और उसे केवल छोटे शावक तक सीमित नहीं करता।
- source_word: סֻכּוֹ
  choice: अपनी मांद
  rationale: मूल शब्द का सामान्य अर्थ छप्पर या आश्रय है, पर सिंह के रूपक में उसका निवास-स्थान अभिप्रेत है; हिन्दी में ‘मांद’ स्वाभाविक है।
- source_word: הָיְתָה אַרְצָם לְשַׁמָּה
  choice: उनका देश उजाड़ हो गया है
  rationale: यह परिणामी विनाश व्यक्त करता है। हिन्दी में विशेषणात्मक ‘उजाड़ हो गया’ मूल संज्ञा שַׁמָּה का अर्थ सहज और स्पष्ट ढंग से देता है।
- source_word: מִפְּנֵי
  choice: के कारण
  rationale: इस वाक्य-विन्यास में इसका कारणसूचक अर्थ है।
- source_word: חֲרוֹן
  choice: धधकता क्रोध
  rationale: חרון में जलने या तपने की उपमा निहित है; ‘धधकता क्रोध’ उस चित्रात्मकता को आधुनिक हिन्दी में बनाए रखता है।
- source_word: הַיּוֹנָה
  choice: अत्याचारी
  rationale: संदर्भ में यह रूप उत्पीड़न करनेवाले के अर्थ में समझा जाता है और देश के विनाश से मेल खाता है। फिर भी व्यंजनात्मक लिखित रूप को ‘कबूतर’ पढ़ना संभव है, इसलिए विकल्प पादटिप्पणी में रखा गया है।
- source_word: וּמִפְּנֵי חֲרוֹן אַפּוֹ
  choice: और उसके धधकते क्रोध के कारण
  rationale: אַף का शाब्दिक अर्थ ‘नाक’ है, पर यह क्रोध का प्रचलित इब्रानी मुहावरा है। ‘उसके’ मूल की संदर्भगत अस्पष्टता को बनाए रखता है।
theological_decisions:
- issue: सिंह के रूपक और अंतिम सर्वनाम का संदर्भ
  choice: मुख्य पाठ में कर्ता और अंतिम ‘उसके’ को नाम देकर निश्चित नहीं किया गया; निकटवर्ती संदर्भ में इनके यहोवा की ओर संकेत करने की संभावना बताई गई है।
  alternative: सिंह और अंतिम सर्वनाम नबूकदनेस्सर अथवा किसी मानवीय अत्याचारी की ओर संकेत कर सकते हैं।
  rationale: यिर्मयाह 25:30–38 में न्याय करनेवाला प्रमुख कर्ता यहोवा है, इसलिए सिंह का रूपक और अंतिम सर्वनाम संभवतः उसी से संबंधित हैं। किंतु बीच में ‘अत्याचारी’ आने से व्याकरणिक अस्पष्टता बनी रहती है; हिन्दी मुख्य पाठ में ‘उसके’ उसे अनावश्यक रूप से नहीं मिटाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘मांद’, ‘उजाड़’ और ‘धधकता क्रोध’ सामान्य पाठक के लिए स्पष्ट हैं तथा मूल रूपक और समानांतर वाक्य-विन्यास को बनाए रखते हैं।
