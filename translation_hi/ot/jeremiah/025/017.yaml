id: JER.25.17
reference: Jeremiah 25:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וָ/אֶקַּ֥ח אֶת הַ/כּ֖וֹס מִ/יַּ֣ד יְהוָ֑ה וָֽ/אַשְׁקֶה֙ אֶת כָּל הַ/גּוֹיִ֔ם אֲשֶׁר שְׁלָחַ֥/נִי יְהוָ֖ה אֲלֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/017.yaml
  text: So I took the cup from the hand of Yahweh and made all the nations to whom Yahweh had sent me drink[a][b].
translation:
  language: hi
  text: तब मैंने याहवे के हाथ से वह प्याला लिया[a] और उन सभी राष्ट्रों को, जिनके पास याहवे ने मुझे भेजा था, पिलाया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “याहवे के हाथ से”; यह अभिव्यक्ति बताती है कि प्याला सीधे उसी से मिला।
    reason: cultural_note
  - marker: b
    text: या “पीने को दिया”; इब्रानी क्रिया कारक रूप में है—अर्थात “पिलाया/पीने का कारण बना।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקַּח
  choice: तब मैंने ... लिया
  rationale: לקח के क़ाल वय्यिक्तोल रूप से कथा में अगली क्रमिक क्रिया व्यक्त होती है; ‘तब’ आधुनिक हिन्दी में इस प्रवाह को स्वाभाविक रूप से दिखाता है।
- source_word: הַכּוֹס
  choice: वह प्याला
  rationale: כּוֹס का अर्थ ‘प्याला’ है। हिन्दी में निश्चित वस्तु और पिछले पद में उल्लिखित प्याले की ओर संकेत करने के लिए ‘वह’ स्वाभाविक है, बिना ‘क्रोध’ को इस पद में जोड़ने के।
- source_word: מִיַּד יְהוָה
  choice: याहवे के हाथ से
  rationale: मूल पाठ की सजीव ‘हाथ से’ अभिव्यक्ति को बनाए रखा गया है; इसका भाव है कि प्याला सीधे याहवे से मिला।
- source_word: יְהוָה
  choice: याहवे
  rationale: टेट्राग्रामाटन को उपाधि से बदलने के बजाय परमेश्वर के व्यक्तिगत नाम के रूप में लिप्यंतरित किया गया है।
- source_word: וָאַשְׁקֶה
  choice: पिलाया
  rationale: שׁקה का हिफ़ील रूप कारक है। ‘पिलाया’ हिन्दी में संक्षिप्त और स्वाभाविक रूप से ‘पीने को दिया/पीने के लिए विवश किया’ का कारक भाव रखता है।
- source_word: כָּל הַגּוֹיִם
  choice: उन सभी राष्ट्रों को
  rationale: संदर्भ में גּוֹיִם उन विदेशी राष्ट्रों को सूचित करता है जिनके विषय में आगे भविष्यवाणियाँ आती हैं; इसलिए ‘राष्ट्रों’ उपयुक्त है।
- source_word: אֲשֶׁר שְׁלָחַנִי יְהוָה אֲלֵיהֶם
  choice: जिनके पास याहवे ने मुझे भेजा था
  rationale: सम्बन्धवाचक उपवाक्य को ‘राष्ट्रों’ के तुरंत बाद रखा गया है, जिससे उसका सम्बन्ध स्पष्ट रहता है। ‘भेजा था’ मुख्य क्रिया से पहले हुई भेजने की क्रिया को दर्शाता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में व्यक्तिगत वाचा-नाम है। ‘याहवे’ उस नाम का निकट लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: राष्ट्रों को प्याला पिलाने में यिर्मयाह की भूमिका
  choice: पिलाया
  alternative: पीने को दिया
  rationale: मूल हिफ़ील क्रिया का कारक बल बनाए रखा गया है। यह पद प्रतीकात्मक क्रिया और भविष्यवाणी के प्रभाव के बीच सम्बन्ध को पूरी तरह स्पष्ट नहीं करता, इसलिए अनुवाद भी उस तनाव को नहीं सुलझाता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘प्याला’, ‘हाथ से’ और ‘पिलाया’ मूल की सजीव तथा कारक अभिव्यक्तियों को बनाए रखते हैं; सम्बन्धवाचक उपवाक्य को हिन्दी के स्वाभाविक क्रम में रखा गया है।
