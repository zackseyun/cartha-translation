  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण भविष्यद्वक्ताई गद्य। वाक्य पद 1 पर निर्भर संबंधवाचक उपवाक्य है, इसलिए आरम्भ में ‘जिसे’ रखा गया है।
