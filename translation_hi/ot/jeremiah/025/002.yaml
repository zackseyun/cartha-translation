id: JER.25.2
reference: Jeremiah 25:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אֲשֶׁ֨ר דִּבֶּ֜ר יִרְמְיָ֤הוּ הַ/נָּבִיא֙ עַל כָּל עַ֣ם יְהוּדָ֔ה וְ/אֶ֛ל כָּל יֹשְׁבֵ֥י יְרוּשָׁלִַ֖ם לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/002.yaml
  text: 'which Jeremiah the prophet spoke to all the people of Judah and to all the inhabitants of Jerusalem[b][a], saying:'
translation:
  language: hi
  text: 'जिसे यिर्मयाह नबी ने यहूदा के सभी लोगों और यरूशलेम के सभी निवासियों से कहा[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिसे यिर्मयाह नबी ने यहूदा के सभी लोगों के विषय में—या उनके विरुद्ध—और यरूशलेम के सभी निवासियों से कहा।”
    reason: עַל के अर्थ-क्षेत्र में ‘से’, ‘के विषय में’ और प्रसंगानुसार ‘के विरुद्ध’ शामिल हो सकते हैं; मुख्य पाठ समानांतर וְאֶל और संबोधन के प्रसंग के आधार पर ‘से’ अपनाता है।
lexical_decisions:
- source_word: אֲשֶׁר
  choice: जिसे
  rationale: यह संबंधवाचक सर्वनाम पद 1 के ‘वचन’ की ओर संकेत करता है और हिन्दी में अगले उपवाक्य से स्वाभाविक रूप से जुड़ता है।
- source_word: דִּבֶּר
  choice: कहा
  rationale: דבר का मूल अर्थ ‘बोलना/कहना’ है। यहाँ संबोधित समुदायों के साथ ‘कहा’ सहज आधुनिक हिन्दी है; לֵאמֹר का भाव विराम-चिह्न से व्यक्त किया गया है।
- source_word: יִרְמְיָהוּ הַנָּבִיא
  choice: यिर्मयाह नबी
  rationale: व्यक्तिनाम का मानक हिन्दी रूप और उसके साथ लगा पदनाम संक्षिप्त, स्वाभाविक हिन्दी क्रम में रखा गया है।
- source_word: עַל
  choice: से
  rationale: דבר के साथ और समानांतर וְאֶל के आलोक में यहाँ यह संबोधित श्रोताओं को चिह्नित करता है। ‘के विषय में’ या ‘के विरुद्ध’ भी शाब्दिक संभावनाएँ हैं, इसलिए विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: כָּל עַם יְהוּדָה
  choice: यहूदा के सभी लोगों
  rationale: सामूहिक एकवचन עַם को हिन्दी में स्वाभाविक बहुवचन ‘लोगों’ से व्यक्त किया गया है; यहूदा राज्य/समुदाय का पारंपरिक नाम है।
- source_word: וְאֶל כָּל יֹשְׁבֵי יְרוּשָׁלִַם
  choice: और यरूशलेम के सभी निवासियों से
  rationale: יֹשְׁבֵי का अर्थ वहाँ बसने वाले लोग है; ‘निवासी’ गरिमापूर्ण और सामान्य आधुनिक हिन्दी है।
- source_word: לֵאמֹר
  choice: ':'
  rationale: यह आगामी प्रत्यक्ष कथन का परिचायक है। हिन्दी में ‘यह कहते हुए’ जोड़ने की अपेक्षा द्विबिंदु अधिक स्वाभाविक ढंग से वही प्रवचनात्मक कार्य करता है।
theological_decisions: []
