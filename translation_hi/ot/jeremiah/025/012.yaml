id: JER.25.12
reference: Jeremiah 25:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הָיָ֣ה כִ/מְלֹ֣אות שִׁבְעִ֣ים שָׁנָ֡ה אֶפְקֹ֣ד עַל מֶֽלֶךְ בָּבֶל֩ וְ/עַל הַ/גּ֨וֹי הַ/ה֧וּא נְאֻם יְהוָ֛ה אֶת עֲוֺנָ֖/ם וְ/עַל אֶ֣רֶץ כַּשְׂדִּ֑ים וְ/שַׂמְתִּ֥י אֹת֖/וֹ לְ/שִֽׁמְמ֥וֹת עוֹלָֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/012.yaml
  text: And when seventy years are completed[a], I will punish the king of Babylon and that nation—oracle of Yahweh—for their iniquity, and the land of the Chaldeans[b], and I will make it an everlasting desolation.
translation:
  language: hi
  text: और जब सत्तर वर्ष पूरे हो जाएँगे, तब मैं बाबेल के राजा और उस राष्ट्र को—यह याहवे की वाणी है[a]—उनके अधर्म के कारण दण्ड दूँगा; और कसदियों के देश को भी दण्ड दूँगा और उसे सदा के लिए उजाड़ बना दूँगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे की घोषणा है।”
    reason: नबी-वाणी के सूत्र נְאֻם יְהוָה का वैकल्पिक स्वाभाविक अनुवाद।
  - marker: b
    text: मूल इब्रानी में शाब्दिक रूप से “सदा के उजाड़ों” है; यह बहुवचन उजाड़ की गहन या व्यापक अवस्था व्यक्त कर सकता है।
    reason: हिब्रू बहुवचन मुहावरे और हिन्दी के एकवचन भावानुवाद को स्पष्ट करना।
lexical_decisions:
- source_word: וְהָיָה כִמְלֹאות שִׁבְעִים שָׁנָה
  choice: और जब सत्तर वर्ष पूरे हो जाएँगे
  rationale: यह पदबंध भविष्य में उस समय को बताता है जब सत्तर वर्षों की अवधि पूरी हो चुकी होगी। आधुनिक हिन्दी में यह स्वाभाविक और स्रोत के कालगत अर्थ के निकट है।
- source_word: אֶפְקֹד עַל
  choice: दण्ड दूँगा
  rationale: न्याय के प्रसंग में פקד על किसी को उसके अपराध के लिए दण्ड देने या लेखा लेने का अर्थ रखता है। यहाँ स्पष्ट हिन्दी के लिए ‘दण्ड दूँगा’ उपयुक्त है।
- source_word: מֶלֶךְ בָּבֶל
  choice: बाबेल के राजा
  rationale: निर्मित पदबंध का सीधा अनुवाद; ‘बाबेल’ बाइबलीय स्थान-नाम को बनाए रखता है।
- source_word: הַגּוֹי הַהוּא
  choice: उस राष्ट्र
  rationale: גוי यहाँ बाबेल की राजनीतिक-सामुदायिक इकाई को सूचित करता है; ‘राष्ट्र’ प्रसंगानुकूल है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की वाणी है
  rationale: यह नबी-वाणी का औपचारिक सूत्र है। ‘वाणी’ उसके घोषणात्मक और औपचारिक स्वर को बनाए रखती है।
- source_word: אֶת עֲוֺנָם
  choice: उनके अधर्म के कारण
  rationale: עון यहाँ वह नैतिक अपराध है जिसके कारण दण्ड दिया जाता है। हिन्दी में कारण-संबंध स्पष्ट करने के लिए ‘के कारण’ स्वाभाविक रूप से जोड़ा गया है।
- source_word: אֶרֶץ כַּשְׂדִּים
  choice: कसदियों के देश
  rationale: यह ऐतिहासिक जातीय नाम को सुरक्षित रखता है और उसे सामान्यीकृत करके केवल ‘बाबेलवासियों’ नहीं बनाता।
- source_word: וְשַׂמְתִּי אֹתוֹ
  choice: और उसे ... बना दूँगा
  rationale: एकवचन सर्वनाम का निकटतम एकवचन पूर्वपद ‘देश’ है; שׂים + ל किसी अवस्था में कर देने का अर्थ देता है।
- source_word: לְשִׁמְמוֹת עוֹלָם
  choice: सदा के लिए उजाड़
  rationale: हिब्रू बहुवचन שׁממות यहाँ उजाड़ की प्रबल या अमूर्त अवस्था व्यक्त कर सकता है। हिन्दी में एकवचन भाव ‘उजाड़’ स्वाभाविक है, जबकि עולם की दीर्घस्थायी शक्ति ‘सदा के लिए’ से बनी रहती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा ‘यहोवा प्रभु’ जैसी परंपरागत अभिव्यक्ति
  rationale: मूल पाठ में चतुरक्षरीय निजी नाम सीधे उपस्थित है; ‘याहवे’ उसे किसी उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: אֹתוֹ (‘उसे’) का संदर्भ
  choice: कसदियों का देश
  alternative: राजा, राष्ट्र और देश को सम्मिलित रूप से एक न्यायाधीन इकाई मानना
  rationale: निकटतम स्पष्ट एकवचन पूर्वपद ‘देश’ है और देश को उजाड़ बनाने का वाक्यार्थ सहज है; फिर भी व्यापक सामूहिक संकेत की संभावना को पूर्णतः नकारा नहीं जाता।
- issue: עֲוֺנָם में अपराध और दण्डफल का संबंध
  choice: उनका अधर्म, दण्ड का कारण
  alternative: उनका दोष अथवा दोष का दण्डफल
  rationale: इस न्याय-संदर्भ में नैतिक अपराध का अर्थ सबसे सीधा है। हिन्दी वाक्य ‘अधर्म के कारण’ दण्ड के आधार को व्यक्त करता है, बिना इस शब्द में दण्डफल का अर्थ अनिवार्य करने के।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण और सार्वजनिक पाठ के योग्य। वाक्य-विन्यास को सहज रखा गया है, पर नबी-वाणी का औपचारिक स्वर, ईश्वरीय नाम और कसदियों का ऐतिहासिक नाम सुरक्षित हैं।
