  text: וְ/שָׁת֕וּ וְ/הִֽתְגֹּֽעֲשׁ֖וּ וְ/הִתְהֹלָ֑לוּ מִ/פְּנֵ֣י הַ/חֶ֔רֶב אֲשֶׁ֛ר אָנֹכִ֥י שֹׁלֵ֖חַ בֵּינֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/016.yaml
  text: They will drink[a], and stagger, and act like madmen because of the sword that I am sending among them.
translation:
  language: hi
  text: वे पीएँगे, लड़खड़ाएँगे और उस तलवार के कारण पागलों-सा व्यवहार करेंगे[a], जिसे मैं उनके बीच भेज रहा हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पागल हो जाएँगे।” इब्रानी क्रिया विवेकहीन ढंग से व्यवहार करने या उन्मत्त हो जाने, दोनों का भाव दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁתוּ
  choice: वे पीएँगे
  rationale: भविष्यसूचक क्रम में यह क्रिया पिछले आदेश के परिणाम को व्यक्त करती है। ‘पीएँगे’ प्याले के ठोस बिंब को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וְהִתְגֹּעֲשׁוּ
  choice: लड़खड़ाएँगे
  rationale: यह क्रिया तीव्र डगमगाहट या विचलन का भाव दे सकती है। क्रोध के प्याले के संदर्भ में ‘लड़खड़ाएँगे’ शारीरिक अस्थिरता के बिंब को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: וְהִתְהֹלָלוּ
  choice: पागलों-सा व्यवहार करेंगे
  rationale: इस रूप का अर्थ उन्मत्त या विवेकहीन ढंग से व्यवहार करना हो सकता है। चुना हुआ अनुवाद व्यवहारगत अर्थ को रखता है; ‘पागल हो जाएँगे’ भी संभव है और पाद-टिप्पणी में दिया गया है।
- source_word: מִפְּנֵי הַחֶרֶב
  choice: उस तलवार के कारण
  rationale: 'מִפְּנֵי यहाँ कारणसूचक है: लोगों की लड़खड़ाहट और उन्मत्त व्यवहार उस तलवार के कारण हैं। ‘तलवार’ युद्ध और न्याय के मूल ठोस बिंब को सुरक्षित रखता है।'
- source_word: אֲשֶׁר אָנֹכִי שֹׁלֵחַ
  choice: जिसे मैं ... भेज रहा हूँ
  rationale: सर्वनाम के साथ कृदन्त आसन्न या जारी ईश्वरीय कार्रवाई दर्शाता है। ‘भेज रहा हूँ’ उसके वर्तमान-प्रगतिशील बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בֵּינֹתָם
  choice: उनके बीच
  rationale: यह राष्ट्रों के मध्य या उनके बीच तलवार भेजे जाने को दर्शाता है; ‘उनके बीच’ संक्षिप्त, स्वाभाविक और अर्थानुकूल है।
theological_decisions:
- issue: न्याय के बिंब का स्वरूप
  choice: पीने, लड़खड़ाने और पागलों-से व्यवहार करने के ठोस बिंबों को तलवार द्वारा आने वाले ईश्वरीय न्याय के प्रभावों के रूप में बनाए रखा गया है।
  alternative: इसे सामान्य भय, अराजकता या राजनीतिक पतन के अमूर्त वर्णन के रूप में कहना।
  rationale: पद क्रोध के प्याले के व्यापक प्रसंग में है और इन प्रभावों को परमेश्वर द्वारा भेजी गई ‘तलवार’ से स्पष्टतः जोड़ता है। इसलिए व्याख्यात्मक अमूर्तीकरण के बजाय मूल भविष्यसूचक चित्रमयता रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रूप। समानांतर क्रियाओं की लय बनाए रखने के लिए ‘पीएँगे, लड़खड़ाएँगे ... व्यवहार करेंगे’ का क्रम रखा गया है। पाद-टिप्पणी का चिह्न उसी संदिग्ध इब्रानी क्रिया के अनुवाद के बाद लगाया गया है जिससे वह वास्तव में संबंधित है।
