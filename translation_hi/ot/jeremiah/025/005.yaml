  text: לֵ/אמֹ֗ר שֽׁוּבוּ נָ֞א אִ֣ישׁ מִ/דַּרְכּ֤/וֹ הָֽ/רָעָה֙ וּ/מֵ/רֹ֣עַ מַעַלְלֵי/כֶ֔ם וּ/שְׁבוּ֙ עַל הָ֣/אֲדָמָ֔ה אֲשֶׁ֨ר נָתַ֧ן יְהוָ֛ה לָ/כֶ֖ם וְ/לַ/אֲבֽוֹתֵי/כֶ֑ם לְ/מִן עוֹלָ֖ם וְ/עַד עוֹלָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/005.yaml
  text: saying[a], ‘Please turn back, each man from his evil way and from the evil of your deeds[b], and dwell in the land that Yahweh gave to you and to your fathers from of old and forever.’
translation:
  language: hi
  text: यह कहते हुए, “कृपया, तुम में से हर एक अपने बुरे मार्ग और अपने कामों की बुराई से लौट आओ, और उस भूमि पर बसो जिसे याहवे ने तुम्हें और तुम्हारे पुरखों को बहुत पहले से और सदा के लिए[a] दी है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अनादि काल से और सदा तक”; यह इब्रानी मुहावरा अतीत से भविष्य तक फैले हुए समय को व्यक्त करता है।
    reason: cultural_note
lexical_decisions:
- source_word: לֵאמֹר
  choice: वे कहते थे
  rationale: यह पद पिछले वाक्य में उल्लिखित नबियों के संदेश की विषयवस्तु प्रस्तुत करता है। अलग पद के रूप में आधुनिक हिन्दी में “वे कहते थे” स्वाभाविक है और प्रसंगगत बहुवचन कर्ता को स्पष्ट करता है।
- source_word: שׁוּבוּ נָא
  choice: कृपा करके ... लौट आए
  rationale: שׁוּב नैतिक और आध्यात्मिक दिशा बदलने का आह्वान है। נָא यहाँ समयसूचक “अब” से अधिक विनती या आग्रह का भाव देता है, जिसे “कृपा करके” व्यक्त करता है।
- source_word: אִישׁ מִדַּרְכּוֹ הָרָעָה
  choice: तुममें से हर एक अपने बुरे मार्ग से
  rationale: אִישׁ बहुवचन आज्ञा के साथ वितरणात्मक अर्थ रखता है। “हर एक” सभी व्यक्तियों पर लागू आग्रह को दिखाता है, और “मार्ग” जीवन-चाल का मूल रूपक बनाए रखता है।
- source_word: וּמֵרֹעַ מַעַלְלֵיכֶם
  choice: और अपने कामों की बुराई से
  rationale: यह वाक्यांश केवल “बुरे कामों” के बजाय शाब्दिक रूप से “तुम्हारे कामों की बुराई” कहता है। हिन्दी में “अपने” सामूहिक सम्बोधन के प्रत्येक सदस्य से स्वाभाविक रूप से जुड़ता है।
- source_word: וּשְׁבוּ עַל הָאֲדָמָה
  choice: और उस भूमि पर बसे रहो
  rationale: יָשַׁב यहाँ स्थायी निवास का भाव रखता है। “बसे रहो” उस निरंतर निवास को व्यक्त करता है, जबकि “भूमि पर” עַל הָאֲדָמָה की छवि को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी पाठ में परमेश्वर का व्यक्तिगत नाम יהוה है; हिन्दी लिप्यंतरण “याहवे” नाम को किसी उपाधि से प्रतिस्थापित नहीं करता।
- source_word: לָכֶם וְלַאֲבוֹתֵיכֶם
  choice: तुम्हें और तुम्हारे पुरखों को
  rationale: “पुरखे” אבות के पारिवारिक और पीढ़ीगत अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: לְמִן עוֹלָם וְעַד עוֹלָם
  choice: प्राचीन काल से सदा के लिए
  rationale: पहला खंड अतीत की प्राचीनता की ओर और दूसरा भविष्य की स्थायित्व की ओर संकेत करता है। यह अनुवाद उस असममित कालगत विस्तार को बनाए रखता है।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: मूल पाठ उपाधि नहीं बल्कि चतुरक्षरी व्यक्तिगत नाम का प्रयोग करता है; इसलिए नाम का हिन्दी लिप्यंतरण रखा गया है।
- issue: भूमि के दान की कालगत भाषा
  choice: प्राचीन काल से सदा के लिए
  alternative: सदा से सदा तक
  rationale: इब्रानी अभिव्यक्ति में अतीत की प्राचीनता और भविष्य की निरंतरता दोनों हैं। चुना हुआ पाठ इसे भूमि के दान के व्यापक कालगत क्षितिज के रूप में रखता है, बिना इस तनाव को किसी व्यवस्थित धर्मवैज्ञानिक निष्कर्ष में बदलने के।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। “कृपा करके” आग्रह का भाव, “मार्ग” नैतिक जीवन का बाइबलीय रूपक, और “बसे रहो” स्थायी निवास का अर्थ बनाए रखते हैं।
