id: JER.25.28
reference: Jeremiah 25:28
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הָיָ֗ה כִּ֧י יְמָאֲנ֛וּ לָ/קַֽחַת הַ/כּ֥וֹס מִ/יָּדְ/ךָ֖ לִ/שְׁתּ֑וֹת וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֗ם כֹּ֥ה אָמַ֛ר יְהוָ֥ה צְבָא֖וֹת שָׁת֥וֹ תִשְׁתּֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/028.yaml
  text: 'And if they refuse to take the cup from your hand to drink[a], then you shall say to them, ‘Thus says Yahweh of hosts: You shall surely drink.’'
translation:
  language: hi
  text: 'और यदि वे पीने के लिए तुम्हारे हाथ से वह प्याला लेने से इनकार करें, तो तुम उनसे कहना, “सेनाओं का यहोवा यह कहता है: तुम्हें अवश्य ही पीना पड़ेगा।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: और यदि
  rationale: यह पदबंध भविष्य की एक संभावित स्थिति प्रस्तुत करता है; ‘और यदि’ शर्त के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְמָאֲנוּ
  choice: इनकार करें
  rationale: पिएल रूप सक्रिय अनिच्छा अथवा अस्वीकार को व्यक्त करता है; ‘इनकार करें’ प्रसंग में सहज और सटीक है।
- source_word: לָקַחַת הַכּוֹס מִיָּדְךָ
  choice: तुम्हारे हाथ से वह प्याला लेने
  rationale: मूल के ‘लेना’, ‘प्याला’ और एकवचन ‘तुम्हारे हाथ’ को बनाए रखा गया है; प्याले के रूपक की व्याख्या मुख्य पाठ में नहीं जोड़ी गई।
- source_word: לִשְׁתּוֹת
  choice: पीने के लिए
  rationale: यह उद्देश्य बताने वाला क्रियार्थक रूप है और प्याला लेने के प्रयोजन को स्पष्ट करता है।
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: तो तुम उनसे कहना
  rationale: निर्देशात्मक भविष्य भाव को आधुनिक, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כֹּה אָמַר
  choice: यह कहता है
  rationale: मानक भविष्यद्वक्ताई संदेश-सूत्र का स्पष्ट और वर्तमान हिन्दी रूप।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम और צבאות के ‘सेनाओं’ अर्थ, दोनों को पारदर्शी ढंग से सुरक्षित रखा गया है।
- source_word: שָׁתוֹ תִשְׁתּוּ
  choice: तुम्हें अवश्य ही पीना पड़ेगा
  rationale: क्रियार्थक निरपेक्ष और सीमित क्रिया का संयोजन तीव्र बल तथा अपरिहार्यता व्यक्त करता है; यह हिन्दी पदबंध दोनों को स्वाभाविक रूप से संप्रेषित करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ के व्यक्तिगत नाम को किसी उपाधि जैसे ‘प्रभु’ से प्रतिस्थापित नहीं किया गया। आधुनिक हिन्दी बाइबल-पाठकों में पहचाने जाने वाले ‘यहोवा’ रूप को चुना गया; उच्चारण-पुनर्निर्माण ‘याहवे’ वैकल्पिक रूप है।
- issue: प्याले के प्रतीक को मुख्य पाठ में खोलना
  choice: केवल ‘वह प्याला’ बनाए रखना
  alternative: ‘क्रोध का प्याला’ कहना
  rationale: आसपास का प्रसंग इसे दैवी न्याय से जोड़ता है, पर इस पद में ‘क्रोध’ शब्द नहीं है; इसलिए रूपक को बिना व्याख्यात्मक विस्तार के रखा गया।
- issue: שָׁתוֹ תִשְׁתּוּ में आज्ञा और निश्चितता
  choice: ‘तुम्हें अवश्य ही पीना पड़ेगा’
  alternative: ‘तुम निश्चय पीओगे’
  rationale: इब्रानी रचना बलाघात के साथ ऐसी अनिवार्यता व्यक्त करती है जिसमें आदेश और निश्चित परिणाम दोनों की छाया है; चुना हुआ रूप इस तनाव को पूरी तरह केवल भविष्यवाणी या केवल आज्ञा नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। वाक्य-संरचना को अत्यधिक संस्कृतनिष्ठ या शब्दशः कठोर बनाने से बचाया गया है। मुख्य पाठ में कोई फुटनोट आवश्यक नहीं माना गया।
