  text: और अरब[a] के सभी राजाओं को, और उन सभी मिश्रित लोगों के राजाओं को, जो मरुभूमि[b] में रहते हैं;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अरबियों के सभी राजाओं को।” इब्रानी में यह शब्द अगले वाक्यांश में ‘मिश्रित लोगों’ के लिए आए शब्द से अलग है।
    reason: lexical_alternative
  - marker: b
    text: या “निर्जन प्रदेश में।”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְכֵי
  choice: के ... राजाओं को
  rationale: यह מֶלֶךְ का construct बहुवचन है। हिन्दी में संबंधसूचक ‘के’ और प्रसंग से अपेक्षित कर्मचिह्न ‘को’ के साथ यह सूची स्वाभाविक रूप से व्यक्त होती है।
- source_word: עֲרָב
  choice: अरब
  rationale: यह अरब क्षेत्र अथवा उसके लोगों का नाम है। ‘अरब’ आधुनिक हिन्दी में स्वाभाविक है और निकटवर्ती הָעֶרֶב से शब्दगत भेद बनाए रखता है।
- source_word: הָעֶרֶב
  choice: मिली-जुली जातियाँ
  rationale: यह निकटवर्ती עֲרָב से अलग संज्ञा है और मिश्रित जनसमूह का बोध कराती है। ‘मिली-जुली जातियाँ’ इस भेद को स्पष्ट रखते हुए सामान्य पाठक के लिए सहज है।
- source_word: הַשֹּׁכְנִים
  choice: जो ... रहती हैं
  rationale: ישׁב का Qal कृदंत बहुवचन पूर्ववर्ती जनसमूहों का विशेषण है; हिन्दी में संबंधवाचक उपवाक्य स्वाभाविक है। ‘जातियाँ’ के अनुसार स्त्रीलिंग बहुवचन रखा गया है।
- source_word: בַּמִּדְבָּר
  choice: निर्जन प्रदेश में
  rationale: מִדְבָּר मरुभूमि अथवा आबादी से दूर निर्जन भूभाग दोनों का संकेत दे सकता है। ‘निर्जन प्रदेश’ अर्थ-परास को अनावश्यक रूप से केवल रेतीले रेगिस्तान तक सीमित नहीं करता।
- source_word: וְאֵת ... וְאֵת
  choice: और ... को, और ... को
  rationale: दोहराया गया संयोजक और निश्चित कर्मचिह्न पिछली आयत से चली आ रही सूची को आगे बढ़ाते हैं; हिन्दी में ‘और’ तथा ‘को’ से इसका कार्य व्यक्त किया गया है।
