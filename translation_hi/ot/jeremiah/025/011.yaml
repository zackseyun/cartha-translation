language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הָֽיְתָה֙ כָּל הָ/אָ֣רֶץ הַ/זֹּ֔את לְ/חָרְבָּ֖ה לְ/שַׁמָּ֑ה וְ/עָ֨בְד֜וּ הַ/גּוֹיִ֥ם הָ/אֵ֛לֶּה אֶת מֶ֥לֶךְ בָּבֶ֖ל שִׁבְעִ֥ים שָׁנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/011.yaml
  text: And all this land will become a ruin and a horror[a], and these nations will serve the king of Babylon for seventy years.
translation:
  language: hi
  text: और यह सारा देश उजाड़ और विस्मय का विषय हो जाएगा, और ये राष्ट्र सत्तर वर्ष तक बाबुल के राजा की सेवा करेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיְתָה
  choice: और ... हो जाएगा
  rationale: भविष्यसूचक कथन में संयोजक सहित पूर्ण क्रिया भावी परिणामी अवस्था व्यक्त करती है; ‘हो जाएगा’ इस परिवर्तन को स्वाभाविक हिन्दी में दर्शाता है।
- source_word: כָּל הָאָרֶץ הַזֹּאת
  choice: यह सारा देश
  rationale: संदर्भ यहूदा और आसपास के क्षेत्र पर न्याय का है; ‘देश’ क्षेत्रीय अर्थ रखता है और כָּל तथा संकेतवाचक दोनों को व्यक्त करता है।
- source_word: לְחָרְבָּה
  choice: उजाड़
  rationale: यह संज्ञा विनाश से उत्पन्न उजड़ी हुई दशा बताती है; ‘उजाड़’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: לְשַׁמָּה
  choice: भय का कारण
  rationale: שַׁמָּה विनाश देखकर उत्पन्न स्तब्ध भय या आतंक को सूचित कर सकता है; ‘भय का कारण’ भूमि को उस प्रतिक्रिया की वस्तु के रूप में प्रस्तुत करता है।
- source_word: וְעָבְדוּ
  choice: सेवा करेंगी
  rationale: राजा को प्रत्यक्ष कर्म बनाकर प्रयुक्त עבד राजनीतिक अधीनता में सेवा करने का अर्थ देता है; हिन्दी में ‘सेवा करेंगी’ मूल की सीधी अभिव्यक्ति बनाए रखता है।
- source_word: הַגּוֹיִם הָאֵלֶּה
  choice: ये जातियाँ
  rationale: यहाँ גּוֹיִם राजनीतिक जातियों अथवा राष्ट्रों को दर्शाता है; ‘जातियाँ’ बाइबलीय भविष्यवाणी के संदर्भ में परिचित और सुबोध है।
- source_word: אֶת מֶלֶךְ בָּבֶל
  choice: बाबुल के राजा की
  rationale: सम्बन्धसूचक वाक्यांश का सीधा और स्वाभाविक हिन्दी रूप; ‘सेवा करना’ के साथ सम्बन्धकारक ‘की’ मानक प्रयोग है।
- source_word: שִׁבְעִים שָׁנָה
  choice: सत्तर वर्ष तक
  rationale: अवधि को हिन्दी में स्वाभाविक रूप से ‘तक’ द्वारा व्यक्त किया गया है, बिना समयावधि के अर्थ को बदले।
theological_decisions:
- issue: न्याय-वाणी में ‘देश’ का दायरा
  choice: यह उस पूरे क्षेत्रीय देश को सूचित करता है जिस पर न्याय घोषित है
  alternative: समूची पृथ्वी, अथवा व्यापक अतिशयोक्तिपूर्ण अर्थ
  rationale: तात्कालिक संदर्भ यहूदा और आसपास की जातियों पर बाबुल के प्रभुत्व का है। ‘देश’ वैश्विक दायरा आरोपित किए बिना אֶרֶץ की संदर्भगत व्यापकता बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठकों के लिए सुबोध भविष्यसूचक गद्य। ‘उजाड़’ और ‘भय का कारण’ साथ रखकर विनाश की अवस्था तथा उसे देखकर होने वाली प्रतिक्रिया, दोनों को अलग-अलग व्यक्त किया गया है।
