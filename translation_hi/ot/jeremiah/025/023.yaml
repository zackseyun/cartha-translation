- source_word: דְּדָן
  choice: ददान
  rationale: स्थान अथवा जाति का नाम; प्रचलित हिन्दी बाइबलीय लिप्यंतरण रखा गया है।
- source_word: תֵּימָא
  choice: तेमा
  rationale: अरबी मरूद्यान अथवा उससे जुड़े जनसमूह का नाम; हिन्दी में सरल और स्रोत के निकट लिप्यंतरण।
- source_word: בּוּז
  choice: बूज़
  rationale: किसी जनसमूह अथवा क्षेत्र का व्यक्तिवाचक नाम; उच्चारण स्पष्ट रखने के लिए दीर्घ ऊ और ज़ का प्रयोग किया गया है।
- source_word: כָּל
  choice: उन सभी को
  rationale: सूची के समानांतर कर्म-रूप को बनाए रखते हुए समावेशी परिमाण को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: קְצוּצֵי
  choice: कतरते हैं
  rationale: קצץ का अर्थ काटना या कतरना है; बाल सँवारने की ठोस क्रिया के लिए 'कतरना' स्वाभाविक है।
- source_word: פֵאָה
  choice: कनपटियों के बाल
  rationale: शाब्दिक अर्थ 'कोना/किनारा' है। इस जातीय पहचान-सूचक मुहावरे में सिर के किनारों के बाल अभिप्रेत हो सकते हैं; हिन्दी में बोधगम्यता के लिए इसे स्पष्ट किया गया है, जबकि पाद-टिप्पणी मूल की व्यापकता और वैकल्पिक समझ सुरक्षित रखती है।
