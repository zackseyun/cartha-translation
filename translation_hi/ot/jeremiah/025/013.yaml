id: JER.25.13
reference: Jeremiah 25:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: ו/הבאיתי עַל הָ/אָ֣רֶץ הַ/הִ֔יא אֶת כָּל דְּבָרַ֖/י אֲשֶׁר דִּבַּ֣רְתִּי עָלֶ֑י/הָ אֵ֤ת כָּל הַ/כָּתוּב֙ בַּ/סֵּ֣פֶר הַ/זֶּ֔ה אֲשֶׁר נִבָּ֥א יִרְמְיָ֖הוּ עַל כָּל הַ/גּוֹיִֽם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/013.yaml
  text: And I will bring upon that land all my words that I have spoken against it—all that is written in this book[b][a], which Jeremiah prophesied against all the nations.
translation:
  language: hi
  text: और मैं उस देश पर अपने वे सारे वचन पूरे करूँगा जो मैंने उसके विरुद्ध कहे हैं—वह सब जो इस पुस्तक[a] में लिखा है और जिसकी भविष्यवाणी यिर्मयाह ने सब राष्ट्रों के विरुद्ध[b] की थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस स्क्रॉल में।” इब्रानी शब्द लिखित पुस्तक या स्क्रॉल को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “सब राष्ट्रों के विषय में।” इब्रानी पूर्वसर्ग का अर्थ अधिक व्यापक हो सकता है, यद्यपि यहाँ संदर्भ “विरुद्ध” अर्थ का समर्थन करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵבֵאתִי
  choice: मैं ... पूरी करूँगा
  rationale: हिफ़ील रूप का शाब्दिक अर्थ ‘ले आऊँगा’ है, पर यहाँ परमेश्वर द्वारा पहले कही गई न्याय-वाणियों को उस देश पर घटित करने का भाव है। हिंदी में ‘बातें पूरी करूँगा’ इस कारणात्मक और परिणामी अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עַל הָאָרֶץ הַהִיא
  choice: उस देश पर
  rationale: אֶרֶץ यहाँ न्याय के अधीन भू-राजनीतिक देश को सूचित करता है; इसलिए ‘देश’ उपयुक्त है। עַל का अर्थ इस संदर्भ में ‘पर’ है।
- source_word: אֶת כָּל דְּבָרַי
  choice: अपनी वे सारी बातें
  rationale: דָּבָר भविष्यद्वाणी में बोले गए वचनों या घोषणाओं को दर्शाता है। ‘बातें’ सरल आधुनिक हिंदी है और कही हुई बातों के पूरा होने का संबंध बनाए रखता है।
- source_word: אֲשֶׁר דִּבַּרְתִּי עָלֶיהָ
  choice: जो मैंने उसके विरुद्ध कही हैं
  rationale: עַל यहाँ न्यायात्मक-विरोधी भाव रखता है। पूर्ण क्रिया पूर्व में कही गई बातों की वर्तमान प्रासंगिकता दिखाती है, जिसे ‘कही हैं’ व्यक्त करता है।
- source_word: אֵת כָּל הַכָּתוּב
  choice: वह सब जो ... लिखा है
  rationale: यह रचना लिखी हुई सामग्री की समग्रता पर बल देती है; हिंदी में यह वाक्य-विन्यास स्पष्ट और स्वाभाविक है।
- source_word: בַּסֵּפֶר הַזֶּה
  choice: इस पुस्तक में
  rationale: סֵפֶר पुस्तक अथवा लपेटे हुए लिखित ग्रंथ दोनों को सूचित कर सकता है। आधुनिक पाठक के लिए ‘पुस्तक’ स्वाभाविक है; ऐतिहासिक विकल्प फुटनोट में सुरक्षित है।
- source_word: אֲשֶׁר נִבָּא יִרְמְיָהוּ
  choice: जिसकी भविष्यवाणी यिर्मयाह ने ... की थी
  rationale: निफ़अल נבא का सामान्य अर्थ ‘भविष्यवाणी करना’ है। हिंदी में सक्रिय रचना कर्ता यिर्मयाह को स्पष्ट रखती है। संबंधवाचक ‘जिसकी’ निकटतम लिखित सामग्री की ओर लौटता है।
- source_word: עַל כָּל הַגּוֹיִם
  choice: सब राष्ट्रों के विरुद्ध
  rationale: न्याय-वाणियों के संदर्भ में עַל का विरोधात्मक अर्थ प्रमुख है। גּוֹיִם के लिए ‘राष्ट्र’ आधुनिक, गरिमापूर्ण और व्यापक रूप से बोधगम्य है।
theological_decisions:
- issue: अंतिम उपवाक्य में भविष्यवाणियों का स्वरूप
  choice: सब राष्ट्रों के विरुद्ध
  alternative: सब राष्ट्रों के विषय में
  rationale: נבא के साथ עַל सामान्यतः ‘के विषय में’ भी हो सकता है, किंतु यहाँ घोषित दंड और राष्ट्रों के विरुद्ध न्याय-वाणियों का साहित्यिक संदर्भ विरोधात्मक अर्थ का समर्थन करता है। व्यापक संभाव्यता को फुटनोट में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी, सरल किंतु गरिमापूर्ण भविष्यद्वाणी-संबंधी शैली। ‘पूरी करूँगा’ को हिंदी की स्वाभाविक अभिव्यक्ति के रूप में चुना गया है, ताकि शाब्दिक ‘ले आऊँगा’ से उत्पन्न अस्पष्टता से बचते हुए घोषित वचनों के घटित होने का अर्थ सुरक्षित रहे। सभी पाठ-आधारित विकल्प फुटनोट में दिए गए हैं।
