reference: Jeremiah 25:32
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת הִנֵּ֥ה רָעָ֛ה יֹצֵ֖את מִ/גּ֣וֹי אֶל גּ֑וֹי וְ/סַ֣עַר גָּד֔וֹל יֵע֖וֹר מִ/יַּרְכְּתֵי אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/032.yaml
  text: 'Thus says Yahweh of hosts: Behold[a], disaster is going out from nation to nation[c][b], and a great storm is being stirred up from the farthest parts of the earth.'
translation:
  language: hi
  text: 'सेनाओं का याहवे यों कहता है: “देखो, विपत्ति[a] एक राष्ट्र से दूसरे राष्ट्र तक फैल रही है[b], और पृथ्वी के सुदूर छोरों से[c] एक बड़ा तूफ़ान उठेगा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बुराई” अथवा “विपत्ति।” इब्रानी शब्द का अर्थ “बुराई” भी हो सकता है, पर यहाँ उसका आशय नैतिक बुराई नहीं, बल्कि विनाशकारी विपत्ति से है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “राष्ट्र से राष्ट्र की ओर।” या “एक राष्ट्र से दूसरे राष्ट्र की ओर।”
    reason: alternative_reading
  - marker: c
    text: या “पृथ्वी के सबसे दूरस्थ भागों से” अथवा “पृथ्वी के सिरों से।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: यह कहता है
  rationale: यह भविष्यद्वाणी के संदेशवाहक-सूत्र को स्वाभाविक, आधुनिक हिन्दी में व्यक्त करता है और कथन के दैवी स्रोत को स्पष्ट रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम का लिप्यंतरण किया गया है; उसके स्थान पर कोई उपाधि नहीं रखी गई।
- source_word: צְבָאוֹת
  choice: सेनाओं का
  rationale: यह व्यापक इब्रानी उपाधि को सुरक्षित रखता है; केवल मानवीय या केवल स्वर्गीय सेनाएँ कहना अर्थ को अनावश्यक रूप से सीमित करता।
- source_word: הִנֵּה
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाली शक्ति और भविष्यद्वाणी की तात्कालिकता को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: רָעָה
  choice: विपत्ति
  rationale: इस न्याय-संदर्भ में शब्द विनाशकारी अनिष्ट को दर्शाता है, नैतिक बुराई को नहीं। ‘विपत्ति’ अर्थ की गंभीरता और कुछ व्यापकता दोनों रखता है।
- source_word: יֹצֵאת
  choice: बढ़ती जा रही है
  rationale: वर्तमान कृदंत की गतिशील, प्रगतिशील क्रिया को व्यक्त करते हुए यह बताता है कि विपत्ति राष्ट्रों के बीच आगे बढ़ रही है; शाब्दिक ‘निकल रही है’ हिन्दी में कम स्वाभाविक होता।
- source_word: מִגּוֹי אֶל גּוֹי
  choice: एक राष्ट्र से दूसरे राष्ट्र तक
  rationale: यह विपत्ति के क्रमशः राष्ट्रों में फैलने की दिशा को स्पष्ट करता है, बिना ‘राष्ट्र के विरुद्ध राष्ट्र’ जैसा अतिरिक्त शत्रुतापूर्ण अर्थ जोड़े।
- source_word: סַעַר גָּדוֹל
  choice: एक प्रचंड आँधी
  rationale: ‘प्रचंड’ גָּדוֹל की तीव्रता को इस तूफ़ानी न्याय-चित्र में स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יֵעוֹר
  choice: उठाई जा रही है
  rationale: निफ़अल रूप के निष्क्रिय भाव—जगाए या उभारे जाने—और भविष्यद्वाणी की सजीव प्रगतिशीलता को बनाए रखता है।
- source_word: מִיַּרְכְּתֵי אָרֶץ
  choice: पृथ्वी के सुदूर छोरों से
  rationale: यह पृथ्वी के अत्यंत दूरस्थ भागों का बिंब संक्षिप्त और स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: दैवी न्याय के कथन में רָעָה का स्वरूप
  choice: ‘विपत्ति’
  alternative: ‘बुराई’ या ‘महाविपत्ति’
  rationale: यहाँ प्रसंग राष्ट्रों पर आने वाले विनाशकारी न्याय का है। ‘बुराई’ नैतिक दुष्टता का ऐसा संकेत दे सकती है जिसे इब्रानी शब्द इस संदर्भ में आवश्यक नहीं बनाता; ‘विपत्ति’ मूल अर्थ को बिना किसी अतिरिक्त धर्मवैचारिक निष्कर्ष के व्यक्त करती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी अपनाई गई है। भविष्यद्वाणी की गंभीर लय बनाए रखते हुए अत्यधिक संस्कृतनिष्ठ या पुरातन शब्दावली से बचा गया है। दैवी नाम ‘याहवे’ को नाम के रूप में और צְבָאוֹת को व्यापक ‘सेनाओं’ के रूप में रखा गया है।
