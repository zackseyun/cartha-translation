reference: Jeremiah 25:29
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּי֩ הִנֵּ֨ה בָ/עִ֜יר אֲשֶׁ֧ר נִֽקְרָא שְׁמִ֣/י עָלֶ֗י/הָ אָֽנֹכִי֙ מֵחֵ֣ל לְ/הָרַ֔ע וְ/אַתֶּ֖ם הִנָּקֵ֣ה תִנָּק֑וּ לֹ֣א תִנָּק֔וּ כִּ֣י חֶ֗רֶב אֲנִ֤י קֹרֵא֙ עַל כָּל יֹשְׁבֵ֣י הָ/אָ֔רֶץ נְאֻ֖ם יְהוָ֥ה צְבָאֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/029.yaml
  text: For behold[a], in the city over which my name is called, I am beginning to bring harm, and shall you indeed go unpunished? You shall not go unpunished, for I am calling for a sword against all the inhabitants of the earth[b], declares Yahweh of hosts.
translation:
  language: hi
  text: क्योंकि देखो, जिस नगर पर मेरा नाम पुकारा गया है[a], उसी पर मैं विपत्ति लाना आरम्भ कर रहा हूँ; तो क्या तुम सचमुच दण्ड से बच जाओगे? तुम दण्ड से नहीं बचोगे, क्योंकि मैं पृथ्वी[b] के सभी निवासियों के विरुद्ध तलवार को बुला रहा हूँ—सेनाओं का यहोवा यह घोषणा करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो नगर मेरे नाम से कहलाता है।” इब्रानी मुहावरा शब्दशः है, “जिस नगर पर मेरा नाम पुकारा गया है।”
    reason: lexical_alternative
  - marker: b
    text: या, “देश।” इब्रानी शब्द का अर्थ “देश” या “पृथ्वी” दोनों हो सकता है; यहाँ व्यापक सन्दर्भ के कारण “पृथ्वी” लिया गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: בָעִיר אֲשֶׁר נִקְרָא שְׁמִי עָלֶיהָ
  choice: जिस नगर पर मेरा नाम पुकारा गया है
  rationale: यह अनुवाद स्वामित्व और विशेष सम्बन्ध दर्शाने वाले इब्रानी मुहावरे की मूल छवि को बनाए रखता है; अधिक सहज विकल्प फुटनोट में दिया गया है।
- source_word: מֵחֵל לְהָרַע
  choice: विपत्ति लाना आरम्भ कर रहा हूँ
  rationale: यहाँ הֵרַע नैतिक बुराई करने के बजाय न्यायस्वरूप हानि या विपत्ति लाने को सूचित करता है; 'विपत्ति' आधुनिक हिन्दी में इस सन्दर्भ को स्पष्ट रखता है।
- source_word: הִנָּקֵה תִנָּקוּ / לֹא תִנָּקוּ
  choice: क्या तुम सचमुच दण्ड से बच जाओगे? तुम दण्ड से नहीं बचोगे
  rationale: क्रिया से पहले आए infinitive absolute की तीव्रता को 'सचमुच' से व्यक्त किया गया है और प्रश्न तथा उत्तर में एक ही न्यायिक अर्थ बनाए रखा गया है।
- source_word: חֶרֶב אֲנִי קֹרֵא
  choice: मैं ... तलवार को बुला रहा हूँ
  rationale: यह तलवार को न्याय के लिए बुलाए जाने वाले सजीव अभिकर्ता के रूप में प्रस्तुत करने वाली मूल छवि को बनाए रखता है, उसे सामान्यीकृत करके केवल 'युद्ध' नहीं बनाता।
- source_word: כָּל יֹשְׁבֵי הָאָרֶץ
  choice: पृथ्वी के सभी निवासी
  rationale: आसपास के सन्दर्भ में राष्ट्रों तक फैले न्याय के कारण व्यापक अर्थ चुना गया है; क्षेत्रीय अर्थ 'देश' की वास्तविक सम्भावना फुटनोट में सुरक्षित है।
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: यह सेनाओं के यहोवा की घोषणा है
  rationale: נְאֻם को स्वाभाविक भविष्यद्वाणी-सूत्र 'घोषणा' से, יהוה को उसके व्यक्तिवाचक नाम 'यहोवा' से और צְבָאוֹת को अर्थपूर्ण उपाधि 'सेनाओं के' से व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिवाचक नाम है; हिन्दी में प्रचलित और स्पष्ट रूप 'यहोवा' इसे सामान्य उपाधि 'प्रभु' में नहीं बदलता।
- issue: क्या לְהָרַע परमेश्वर द्वारा नैतिक बुराई करने का संकेत देता है
  choice: विपत्ति लाना
  alternative: बुराई करना / हानि पहुँचाना
  rationale: इस न्याय-सन्दर्भ में हिफ़ील रूप का आशय दण्डात्मक विपत्ति लाना है, नैतिक दुष्टता करना नहीं; अनुवाद उस अर्थ को व्यक्त करता है पर न्याय की कठोरता को कम नहीं करता।
- issue: הָאָרֶץ का व्यापक या क्षेत्रीय अर्थ
  choice: पृथ्वी
  alternative: देश
  rationale: राष्ट्रों के विरुद्ध विस्तृत न्याय का सन्दर्भ व्यापक अर्थ का समर्थन करता है, फिर भी शब्द की क्षेत्रीय सम्भावना फुटनोट में रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सार्वजनिक पठन के योग्य रूप अपनाया गया है। 'नगर', 'विपत्ति', 'दण्ड' और 'घोषणा' जैसे शब्द सामान्य पाठक के लिए समझने योग्य रहते हुए भविष्यद्वाणी की औपचारिक गम्भीरता बनाए रखते हैं।
