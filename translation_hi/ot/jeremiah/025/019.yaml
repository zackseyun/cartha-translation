  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण राजकीय शब्द-विन्यास अपनाया गया है। पद बड़े वाक्य की कर्म-सूची का अंश है, इसलिए अंत में ‘को’ और अर्धविराम रखा गया है।
