translation:
  language: hi
  text: मिस्र के राजा फ़िरौन, उसके सेवकों, उसके अधिकारियों और उसकी सारी प्रजा को;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּרְעֹה
  choice: फ़िरौन
  rationale: यह मिस्र के शासक की परंपरागत उपाधि/नाम है; आधुनिक मानक हिन्दी में प्रचलित रूप ‘फ़िरौन’ रखा गया है।
- source_word: מֶלֶךְ מִצְרַיִם
  choice: मिस्र के राजा
  rationale: इब्रानी संबंध-पदबंध फ़िरौन को मिस्र का शासक बताता है। हिन्दी में ‘मिस्र के राजा फ़िरौन’ स्वाभाविक और स्पष्ट समानाधिकरण है।
- source_word: עֲבָדָיו
  choice: उसके सेवकों
  rationale: עֶבֶד का अर्थ सेवक, दास अथवा राजकीय परिचर हो सकता है। राजदरबार के इस प्रसंग में ‘सेवक’ व्यापक अर्थ बनाए रखता है और अनावश्यक रूप से दासत्व का विशिष्ट अर्थ नहीं थोपता।
- source_word: שָׂרָיו
  choice: उसके अधिकारियों
  rationale: שַׂר शासक, पदाधिकारी, प्रधान या सेनापति का बोध करा सकता है। ‘अधिकारी’ यहाँ राजकीय नेतृत्व का व्यापक और आधुनिक हिन्दी में स्पष्ट अर्थ देता है।
- source_word: כָּל עַמּוֹ
  choice: उसकी सारी प्रजा
  rationale: עַם सामूहिक रूप से लोगों या राष्ट्र को दर्शाता है। राजा के संबंध में ‘प्रजा’ स्वाभाविक हिन्दी है और כָּל की समग्रता ‘सारी’ से व्यक्त होती है।
- source_word: אֶת ... וְאֶת ... וְאֶת ... וְאֶת
  choice: को-चिह्नित समन्वित सूची
  rationale: बार-बार आया אֶת बड़े वाक्य में पीने के लिए दिए गए कर्मों की सूची बनाता है। हिन्दी में विभक्ति ‘को’ को सूची के अंत में रखकर सभी पदों पर लागू किया गया है और समन्वय स्वाभाविक रखा गया है।
theological_decisions: []
