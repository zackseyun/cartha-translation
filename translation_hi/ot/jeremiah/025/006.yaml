source:
  edition: WLC
  text: וְ/אַל תֵּלְכ֗וּ אַֽחֲרֵי֙ אֱלֹהִ֣ים אֲחֵרִ֔ים לְ/עָבְדָ֖/ם וּ/לְ/הִשְׁתַּחֲוֺ֣ת לָ/הֶ֑ם וְ/לֹֽא תַכְעִ֤יסוּ אוֹתִ/י֙ בְּ/מַעֲשֵׂ֣ה יְדֵי/כֶ֔ם וְ/לֹ֥א אָרַ֖ע לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/006.yaml
  text: And do not go after other gods to serve them and to bow down to them[a], and do not provoke me to anger by the work of your hands[b], and I will do you no harm.
translation:
  language: hi
  text: दूसरे देवताओं के पीछे न चलो[a], उनकी सेवा न करो और उनके आगे दण्डवत न करो। अपने हाथों के काम से मुझे क्रोध न दिलाओ, और मैं तुम्हें कोई हानि नहीं पहुँचाऊँगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दूसरे देवताओं का अनुसरण न करो।”
    reason: lexical_alternative
  - marker: b
    text: या, “और मैं तुम पर विपत्ति नहीं लाऊँगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּלְכוּ אַחֲרֵי
  choice: पीछे न चलो
  rationale: यह इब्रानी मुहावरे की ‘पीछे चलने’ वाली छवि को बनाए रखता है और साथ ही निष्ठापूर्वक अनुसरण करने का भाव व्यक्त करता है।
- source_word: אֱלֹהִים אֲחֵרִים
  choice: दूसरे देवताओं
  rationale: यह वाक्यांश यहोवा के अतिरिक्त अन्य देवताओं को सीधे व्यक्त करता है; ‘विदेशी देवता’ मूल में निहित न होने वाला भौगोलिक भाव जोड़ सकता है।
- source_word: לְעָבְדָם
  choice: उनकी सेवा न करो
  rationale: עבד का मूल अर्थ ‘सेवा करना’ है और देवताओं के संदर्भ में उपासना-संबंधी सेवा को समेटता है; इसे अगले दण्डवत करने वाले क्रियापद से अलग रखा गया है।
- source_word: וּלְהִשְׁתַּחֲוֺת לָהֶם
  choice: उनके आगे दण्डवत न करो
  rationale: यह श्रद्धा में झुकने या भूमि पर गिरने की शारीरिक क्रिया को व्यक्त करता है और पिछले ‘सेवा’ वाले पद के साथ उसका भेद बनाए रखता है।
- source_word: תַכְעִיסוּ אֹתִי
  choice: मुझे क्रोध न दिलाओ
  rationale: यह खעס के हिफ़ईल रूप की कारणवाचक शक्ति को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: בְּמַעֲשֵׂה יְדֵיכֶם
  choice: अपने हाथों की बनाई वस्तुओं से
  rationale: यह इब्रानी ‘तुम्हारे हाथों के काम’ का स्वाभाविक हिन्दी रूप है और प्रसंग में मनुष्य-निर्मित मूर्तियों की ओर संकेत को खुला रखता है।
- source_word: וְלֹא אָרַע לָכֶם
  choice: और मैं तुम्हें कोई हानि नहीं पहुँचाऊँगा
  rationale: רעע के हिफ़ईल का अर्थ हानि करना या विपत्ति लाना हो सकता है। यह रूप नैतिक अर्थ में ‘बुरा करना’ कहने से बचते हुए व्यापक अर्थ को सुरक्षित रखता है।
theological_decisions:
- issue: अंतिम उपवाक्य में निषेध के साथ जुड़ा परिणाम या आश्वासन
  choice: और मैं तुम्हें कोई हानि नहीं पहुँचाऊँगा
  alternative: ताकि मैं तुम्हें हानि न पहुँचाऊँ / और मैं तुम पर विपत्ति नहीं लाऊँगा
  rationale: मूल में साधारण संयोजक וְ के साथ प्रथम पुरुष का नकारात्मक क्रियापद है। अनुवाद इसे उद्देश्यवाचक बनाकर अधिक स्पष्ट नहीं करता, बल्कि आज्ञा से जुड़े दिव्य आश्वासन या परिणाम की स्वाभाविक अनिश्चितता बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और भविष्यद्वाणी-संबंधी चेतावनी के अनुरूप शैली। ‘दण्डवत’ श्रद्धापूर्वक झुकने की शारीरिक क्रिया को स्पष्ट रखता है; ‘हाथों की बनाई वस्तुएँ’ प्रसंगगत मूर्तियों की ओर संकेत करती हैं, पर मूल से अधिक स्पष्ट व्याख्या नहीं जोड़ती।
