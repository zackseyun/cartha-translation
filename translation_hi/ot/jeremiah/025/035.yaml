id: JER.25.35
reference: Jeremiah 25:35
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אָבַ֥ד מָנ֖וֹס מִן הָֽ/רֹעִ֑ים וּ/פְלֵיטָ֖ה מֵ/אַדִּירֵ֥י הַ/צֹּֽאן־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/035.yaml
  text: Escape has perished from the shepherds[b][a], and deliverance from the lords of the flock.
translation:
  language: hi
  text: चरवाहों के लिए भागने का कोई रास्ता न रहेगा,[a][b] और झुंड के सामर्थी जनों के लिए बच निकलने का कोई उपाय न रहेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “चरवाहों का बच निकलना मिट जाएगा, और झुंड के सामर्थी जनों का पलायन भी।”
    reason: lexical_alternative
  - marker: b
    text: '“चरवाहे” और “झुंड” भविष्यसूचक रूपक हैं: चरवाहे लोगों के नेताओं को और झुंड उनके अधीन लोगों को दर्शाता है।'
    reason: cultural_note
lexical_decisions:
- source_word: וְאָבַד
  choice: कोई ... न रहेगा
  rationale: 'אבד का पूर्ण रूप यहाँ निकट और निश्चित न्याय की भविष्यवाणी करता है: बच निकलने की संभावना समाप्त हो जाएगी। स्वाभाविक हिन्दी में अस्तित्व-निषेध के साथ यह भाव स्पष्ट होता है।'
- source_word: מָנוֹס
  choice: भागने का ... रास्ता
  rationale: מָנוֹס भागने की जगह या संभावना को सूचित करता है। 'भागने का रास्ता' न्याय के प्रसंग में सहज और अर्थ-सटीक हिन्दी है।
- source_word: מִן הָרֹעִים
  choice: चरवाहों के लिए
  rationale: מן यहाँ उस समूह को दिखाता है जिससे बच निकलने का साधन छिन जाता है। हिन्दी में 'चरवाहों से भागने का रास्ता नष्ट होगा' भ्रामक हो सकता है, इसलिए संबंध को स्वाभाविक रूप से 'के लिए' व्यक्त किया गया है; चरवाही का रूपक बनाए रखा गया है।
- source_word: וּפְלֵיטָה
  choice: बच निकलने का ... उपाय
  rationale: פְלֵיטָה यहाँ समानांतर रूप में जीवित बच निकलने या छुटकारे की संभावना को सूचित करता है। 'बच निकलने का उपाय' पहले पद की पुनरुक्ति किए बिना समान अर्थ रखता है।
- source_word: מֵאַדִּירֵי הַצֹּאן
  choice: झुंड के सामर्थी जनों के लिए
  rationale: אַדִּירֵי प्रतिष्ठित, शक्तिशाली या महान व्यक्तियों को दर्शाता है। 'सामर्थी जन' मूल की व्यापकता और झुंड के रूपक को बनाए रखता है; 'स्वामी' मूल में उपस्थित न होने वाला अधिकार-संबंध अधिक स्पष्ट कर सकता था।
theological_decisions:
- issue: चरवाहों और झुंड के प्रमुख सदस्यों द्वारा जन-नेताओं का रूपक
  choice: मुख्य पाठ में 'चरवाहों' और 'झुंड के सामर्थी जनों' का चरवाही-रूपक बनाए रखना
  alternative: मुख्य पाठ में सीधे 'शासक' या 'नेता' कहना
  rationale: इब्रानी पाठ सतत चरवाही-बिंब का उपयोग करता है। रूपक को सुरक्षित रखना मूल की काव्यात्मक और भविष्यसूचक तनावशीलता को बचाता है; उसका आशय पादटिप्पणी में बताया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज किंतु गरिमापूर्ण है। समानांतर काव्य-रचना तथा चरवाहे–झुंड का मूल रूपक सुरक्षित रखा गया है।
