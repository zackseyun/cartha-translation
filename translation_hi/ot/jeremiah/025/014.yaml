source:
  edition: WLC
  text: כִּ֣י עָֽבְדוּ בָ֤/ם גַּם הֵ֨מָּה֙ גּוֹיִ֣ם רַבִּ֔ים וּ/מְלָכִ֖ים גְּדוֹלִ֑ים וְ/שִׁלַּמְתִּ֥י לָ/הֶ֛ם כְּ/פָעֳלָ֖/ם וּ/כְ/מַעֲשֵׂ֥ה יְדֵי/הֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/014.yaml
  text: For many nations and great kings will make even them serve[a], and I will repay them according to their work and according to the work of their hands.
translation:
  language: hi
  text: क्योंकि बहुत-सी जातियाँ और बड़े-बड़े राजा उनसे भी सेवा करवाएँगे[a], और मैं उन्हें उनके काम के अनुसार और उनके हाथों के काम के अनुसार प्रतिफल दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से संभव अनुवाद: “क्योंकि बहुत-सी जातियों और बड़े-बड़े राजाओं ने भी उनसे काम लिया है।” इब्रानी वाक्य संक्षिप्त और अस्पष्ट है; संदर्भ में सबसे संभावित अर्थ यह है कि बाबेल से भी बहुत-सी जातियाँ और बड़े राजा सेवा करवाएँगे।'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עָבְדוּ בָם
  choice: उनसे ... सेवा करवाएँगे
  rationale: इब्रानी रचना संक्षिप्त और अर्थ की दृष्टि से अस्पष्ट है। निकटवर्ती संदर्भ में बाबेल पर पलटकर आने वाले दण्ड का भाव है, इसलिए भावी काल में दूसरों द्वारा उनसे सेवा करवाया जाना सबसे संभावित अर्थ है; पादटिप्पणी अधिक शाब्दिक विकल्प सुरक्षित रखती है।
- source_word: גַּם הֵמָּה
  choice: उनसे भी
  rationale: 'גם और बलाघाती सर्वनाम प्रभुत्व के उलट जाने पर जोर देते हैं: जिन्होंने दूसरों को अधीन किया, उनसे भी सेवा करवाई जाएगी।'
- source_word: גּוֹיִם רַבִּים
  choice: बहुत-सी जातियाँ
  rationale: राजनीतिक-सामूहिक संदर्भ में גּוֹיִם के लिए ‘जातियाँ’ प्रचलित और सुबोध बाइबलीय हिन्दी है।
- source_word: וּמְלָכִים גְּדוֹלִים
  choice: और बड़े-बड़े राजा
  rationale: גדולים का मूल अर्थ ‘बड़े/महान’ है; ‘बड़े-बड़े राजा’ यहाँ सामर्थ्य और महत्त्व दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: וְשִׁלַּמְתִּי לָהֶם
  choice: और मैं उन्हें ... बदला दूँगा
  rationale: पिअल שׁלם प्रतिफल या दण्ड चुकाने का न्यायिक भाव रखता है। ‘बदला दूँगा’ इस प्रतिदान को सामान्य आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: כְּפָעֳלָם
  choice: उनके काम ... के अनुसार
  rationale: פעל काम या कर्म को दर्शाता है; ‘काम’ सरल है और अगले हस्त-रूपक से पर्याप्त भिन्न रहता है।
- source_word: וּכְמַעֲשֵׂה יְדֵיהֶם
  choice: उनके हाथों के किए के अनुसार
  rationale: यह अनुवाद ‘हाथों’ की इब्रानी छवि बनाए रखता है और स्वाभाविक हिन्दी में उनके ठोस कर्मों को व्यक्त करता है।
theological_decisions:
- issue: न्याय के उलटाव में ‘उनसे’ का संदर्भ
  choice: यह बाबेलियों/कसदियों की ओर संकेत करता है, जिनसे अब बहुत-सी जातियाँ और बड़े राजा सेवा करवाएँगे।
  alternative: इसे अधिक शाब्दिक रूप से ‘बहुत-सी जातियों और बड़े-बड़े राजाओं ने उनकी सेवा की/उनके द्वारा अपने लिए काम कराया’ समझना।
  rationale: यिर्मयाह 25:12-14 का निकटवर्ती संदर्भ बाबेल के राजा और उसके देश पर दण्ड की घोषणा करता है। फिर भी क्रिया का इब्रानी रूप स्वयं साधारण Qal है, इसलिए उसकी वास्तविक भाषिक अस्पष्टता पादटिप्पणी में रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘सेवा करवाएँगे’ संदर्भगत उलटाव को स्पष्ट करता है, जबकि पादटिप्पणी मूल इब्रानी की संक्षिप्तता और वैकल्पिक शाब्दिक अर्थ को सुरक्षित रखती है।
