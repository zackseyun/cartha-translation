id: JER.25.36
reference: Jeremiah 25:36
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: ק֚וֹל צַעֲקַ֣ת הָֽ/רֹעִ֔ים וִֽ/ילְלַ֖ת אַדִּירֵ֣י הַ/צֹּ֑אן כִּֽי שֹׁדֵ֥ד יְהוָ֖ה אֶת מַרְעִיתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/036.yaml
  text: The sound of the cry of the shepherds[a], and the wailing of the leaders of the flock[b], for Yahweh is devastating their pasture.
translation:
  language: hi
  text: चरवाहों की पुकार सुनाई दे रही है, और झुंड के अगुवों[a] का विलाप भी,[b] क्योंकि याहवे उनकी चरागाह को उजाड़ रहा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “झुंड के सामर्थी जनों” अथवा “झुंड के कुलीन जनों।”
    reason: lexical_alternative
  - marker: b
    text: चरवाहे और झुंड का यह बिंब संभवतः शासकों और उनकी देखरेख में रहने वाले लोगों की ओर संकेत करता है।
    reason: cultural_note
lexical_decisions:
- source_word: קוֹל
  choice: सुनाई दे रही है
  rationale: यहाँ קוֹל पुकार और विलाप की सुनाई देने वाली ध्वनि को प्रस्तुत करता है। हिंदी में ‘सुनाई दे रही है’ मूल संज्ञात्मक रचना को स्वाभाविक वाक्य में व्यक्त करता है।
- source_word: צַעֲקַת
  choice: पुकार
  rationale: צעק संकट और दुःख में उठी तीखी पुकार को दर्शाता है; ‘पुकार’ आधुनिक हिंदी में स्पष्ट और प्रसंगानुकूल है।
- source_word: הָרֹעִים
  choice: चरवाहों
  rationale: यद्यपि प्रसंग में यह शासकों का रूपक हो सकता है, मूल चरवाही-बिंब को बनाए रखने के लिए ‘चरवाहों’ रखा गया है।
- source_word: וִילְלַת
  choice: विलाप
  rationale: ילל गहरे शोक में रोने या विलाप करने को व्यक्त करता है; ‘विलाप’ गरिमापूर्ण और स्वाभाविक हिंदी है।
- source_word: אַדִּירֵי הַצֹּאן
  choice: झुंड के अगुवों
  rationale: אַדִּירֵי का अर्थ सामर्थी, प्रतिष्ठित या प्रधान जन हो सकता है। ‘अगुवों’ झुंड के भीतर उनकी प्रमुख स्थिति स्पष्ट करता है, जबकि रूपक भी बना रहता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पुकार और विलाप का कारण प्रस्तुत करता है।
- source_word: שֹׁדֵד
  choice: उजाड़ रहा है
  rationale: שׁדד का कृदंत रूप जारी विनाश या बरबादी को दर्शाता है; ‘उजाड़ रहा है’ उसकी प्रगतिशील और विध्वंसकारी शक्ति को सहज हिंदी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिंदी में लिप्यंतरित किया गया है।
- source_word: מַרְעִיתָם
  choice: उनकी चरागाह
  rationale: מַרְעִית चरने की जगह या चरागाह है। ‘चरागाह’ चरवाहे और झुंड के मूल बिंब को सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा ‘प्रभु’
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसका हिंदी लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: चरवाहे और झुंड के बिंब की व्याख्या
  choice: मुख्य पाठ में चरवाहे, झुंड और चरागाह का रूपक सुरक्षित रखा गया
  alternative: इसे स्पष्टतः ‘शासक, प्रजा और देश’ कहना
  rationale: प्रसंग में राजनीतिक अर्थ संभावित है, पर मूल पाठ रूपक के माध्यम से बोलता है। व्याख्यात्मक अर्थ को पादटिप्पणी में बताने से मूल की काव्यात्मकता और अर्थगत खुलापन दोनों बने रहते हैं।
- issue: אַדִּירֵי का अर्थ
  choice: अगुवों
  alternative: सामर्थी जनों अथवा कुलीन जनों
  rationale: शब्द पद, सामर्थ्य या प्रतिष्ठा का बोध करा सकता है। ‘अगुवों’ प्रसंग में स्वाभाविक है, जबकि अन्य वास्तविक अर्थ पादटिप्पणी में सुरक्षित हैं।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज, गरिमापूर्ण और भविष्यद्वाणी-संगत स्वर रखा गया है। इब्रानी की संज्ञात्मक उद्घोषणा को हिंदी में स्वाभाविक बनाने के लिए ‘सुनाई दे रही है’ का प्रयोग किया गया है। पादटिप्पणी [a] को उसी पदबंध के बाद रखा गया है जिससे उसका शब्दार्थ-संबंध है; [b] पूरे चरवाहा-झुंड रूपक पर लागू है।
