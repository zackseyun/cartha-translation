  text: וְ/נָדַ֖מּוּ נְא֣וֹת הַ/שָּׁל֑וֹם מִ/פְּנֵ֖י חֲר֥וֹן אַף יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/037.yaml
  text: And the peaceful pastures are laid waste because of the burning anger of Yahweh[a].
translation:
  language: hi
  text: और शांत चरागाह[a] याहवे के धधकते क्रोध के कारण उजाड़ हो गए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “शांति के चरागाह।”
    reason: मूल इब्रानी संबंधवाचक पदबंध को सुरक्षित रखना।
lexical_decisions:
- source_word: וְנָדַמּוּ
  choice: उजड़ गई हैं
  rationale: דמם के निफ़अल रूप का मूल भाव चुप या निश्चल हो जाना हो सकता है, पर चरागाहों और दिव्य क्रोध के इस संदर्भ में परिणामस्वरूप वीरानी प्रकट होती है। ‘उजड़ गई हैं’ इस संदर्भगत अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: נְאוֹת
  choice: चरागाहें
  rationale: यहाँ शब्द पशुओं के चरने के स्थानों या चरागाहों को सूचित करता है; यिर्मयाह के ग्रामीण चित्रण में यही अर्थ सबसे उपयुक्त है।
- source_word: הַשָּׁלוֹם
  choice: शान्त
  rationale: शाब्दिक संबंधवाचक पदबंध ‘शान्ति की चरागाहें’ है। मुख्य पाठ में ‘शान्त चरागाहें’ सुरक्षित और निर्विघ्न स्थानों का भाव अधिक स्वाभाविक हिन्दी में देता है, जबकि शाब्दिक रूप पाद-टिप्पणी में रखा गया है।
- source_word: מִפְּנֵי
  choice: के कारण
  rationale: यहाँ पूर्वसर्ग स्थान नहीं, कारण व्यक्त करता है।
- source_word: חֲרוֹן אַף
  choice: धधकते क्रोध
  rationale: इब्रानी मुहावरा तीव्र, जलते हुए क्रोध का चित्र प्रस्तुत करता है। ‘धधकते क्रोध’ उस ऊष्मा-रूपक को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले परमेश्वर के निज नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिपि में लिप्यंतरित किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में निज नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण उच्चारण दर्शाता है और उसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज हिन्दी है। ‘धधकते क्रोध’ मूल के ऊष्मा-रूपक को बनाए रखता है; ‘उजड़ गई हैं’ चरागाहों के संदर्भ में דמם के परिणामसूचक अर्थ को व्यक्त करता है।
