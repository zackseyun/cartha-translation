  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/לֹֽא שְׁמַעְתֶּ֥ם אֵלַ֖/י נְאֻם יְהוָ֑ה לְמַ֧עַן הכעסו/ני בְּ/מַעֲשֵׂ֥ה יְדֵי/כֶ֖ם לְ/רַ֥ע לָ/כֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/007.yaml
  text: Yet you did not listen to me[a], declares Yahweh, to provoke me to anger by the work of your hands, to your own harm.
translation:
  language: hi
  text: फिर भी तुमने मेरी बात नहीं सुनी[a], याहवे की यह घोषणा है, जिससे तुम अपने हाथों के कामों से मुझे क्रोध दिलाओ और अपना ही अहित करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुमने मेरी बात नहीं मानी।” “अपने हाथों के कामों” का वाक्यांश यिर्मयाह में प्रायः मूर्तियों या मूर्तिपूजा से जुड़े कार्यों की ओर संकेत करता है।
    reason: शׁמע के ‘सुनना/मानना’ अर्थ-क्षेत्र तथा मुहावरे के संभावित मूर्तिपूजक संकेत को दर्ज करता है, बिना मुख्य पाठ में उसे अनिवार्य किए।
lexical_decisions:
- source_word: וְלֹא שְׁמַעְתֶּם אֵלַי
  choice: फिर भी तुमने मेरी नहीं सुनी
  rationale: संदर्भ में וְלֹא विरोधात्मक निरंतरता दिखाता है; ‘फिर भी’ बार-बार की गई भविष्यद्वक्ताई पुकार के बावजूद लोगों की प्रतिक्रिया को स्वाभाविक हिन्दी में व्यक्त करता है। שׁמע का ‘सुनना’ अर्थ रखा गया है, जिसमें आज्ञा न मानने का भाव निहित है पर उसे अनावश्यक रूप से स्पष्ट नहीं किया गया।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: यह मानक भविष्यद्वक्ताई सूत्र की गंभीरता बनाए रखता है और יְהוָה को उसके व्यक्तिवाचक नाम ‘याहवे’ के रूप में प्रस्तुत करता है।
- source_word: לְמַעַן הַכְעִסוּנִי
  choice: ताकि ... मुझे क्रोध दिलाओ
  rationale: לְמַעַן उद्देश्य अथवा परिणाम दोनों का संकेत दे सकता है। ‘ताकि’ इस तनाव को पूरी तरह समाप्त किए बिना हिन्दी में वाक्य-संबंध बनाए रखता है; causative הַכְעִסוּנִי को ‘मुझे क्रोध दिलाओ’ कहा गया है।
- source_word: בְּמַעֲשֵׂה יְדֵיכֶם
  choice: अपने हाथों के बनाए कामों से
  rationale: यह मुहावरे की ठोस छवि बनाए रखता है और बहुवचन सम्बोधन को स्पष्ट करता है। यद्यपि यिर्मयाह में यह प्रायः मूर्तियों या मूर्तिपूजक कृतियों की ओर संकेत करता है, मुख्य पाठ उसे केवल ‘मूर्तियाँ’ कहकर सीमित नहीं करता।
- source_word: לְרַע לָכֶם
  choice: अपना ही अहित करो
  rationale: यह लोगों पर लौटने वाले हानिकारक परिणाम को सहज आधुनिक हिन्दी में व्यक्त करता है और לָכֶם के आत्म-हानि वाले बल को ‘अपना ही’ से बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिवाचक नाम सीधे आया है; उसका लिप्यंतरण covenant name को उपाधि में बदलने से बचाता है।
- issue: בְּמַעֲשֵׂה יְדֵיכֶם को स्पष्ट रूप से मूर्तिपूजा कहना
  choice: अपने हाथों के बनाए कामों से
  alternative: अपने हाथों से बनाई मूर्तियों से
  rationale: संदर्भ मूर्तिपूजा की ओर संकेत कर सकता है, पर इस पद में ‘मूर्तियाँ’ स्पष्ट रूप से नहीं कहा गया। व्यापक मुहावरा रखने से वास्तविक संकेत बना रहता है और व्याख्या को मूल पाठ में नहीं जोड़ा जाता।
- issue: לְמַעַן में उद्देश्य और परिणाम का संबंध
  choice: ताकि
  alternative: जिसके परिणामस्वरूप
  rationale: हिब्रू रूप उद्देश्य, अभिप्रेत प्रवृत्ति या परिणाम का भाव दे सकता है। ‘ताकि’ कठोर दार्शनिक निर्धारण किए बिना मूल की चुभती हुई आरोपात्मक संरचना बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण भविष्यद्वक्ताई शैली के साथ सामान्य पाठक के लिए सहज शब्दावली। ‘मेरी नहीं सुनी’ स्वाभाविक हिन्दी मुहावरा है। ‘कामों’ सामूहिक अर्थ को स्पष्ट करता है, जबकि मूल का ‘हाथों का काम’ मुहावरा सुरक्षित रहता है।
