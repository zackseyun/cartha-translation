source:
  edition: WLC
  text: לָ/כֵ֣ן הִנְ/נִ֔י וְ/נָשִׁ֥יתִי אֶתְ/כֶ֖ם נָשֹׁ֑א וְ/נָטַשְׁתִּ֣י אֶתְ/כֶ֗ם וְ/אֶת הָ/עִיר֙ אֲשֶׁ֨ר נָתַ֧תִּי לָ/כֶ֛ם וְ/לַ/אֲבוֹתֵי/כֶ֖ם מֵ/עַ֥ל פָּנָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/039.yaml
  text: Therefore[a], behold, I will surely lift you up and cast you away, you and the city that I gave to you and to your fathers[b], from before my face.
translation:
  language: hi
  text: इसलिए देखो, मैं निश्चय ही तुम्हें उठाऊँगा[a] और तुम्हें तथा उस नगर को, जिसे मैंने तुम्हें और तुम्हारे पूर्वजों को दिया था, अपने सामने से दूर फेंक दूँगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं तुम्हें पूरी तरह भुला दूँगा।” यहाँ इब्रानी पाठ कठिन है; कुछ लोग क्रिया का अर्थ “उठाना/ले जाना” के बजाय “भुला देना” समझते हैं।
    reason: alternative_reading
  - marker: b
    text: या, “अपनी उपस्थिति से।”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले कथन के परिणाम को प्रस्तुत करने वाला स्वाभाविक और स्पष्ट निष्कर्षसूचक शब्द है।
- source_word: הִנְנִי
  choice: देखो
  rationale: भविष्यद्वाणी की गंभीरता और ध्यान खींचने वाले संकेत को आधुनिक, सहज हिन्दी में बनाए रखता है।
- source_word: וְנָשִׁיתִי ... נָשֹׂא
  choice: मैं निश्चय ही तुम्हें उठाऊँगा
  rationale: मसोरेटिक पाठ के व्यंजनात्मक शब्द-खेल और नָשֹׂא द्वारा दिए गए बल को सुरक्षित रखता है। सन्दर्भ में यह सम्मानपूर्वक ऊँचा उठाना नहीं, बल्कि आगे आने वाले ‘दूर फेंक दूँगा’ के साथ न्यायिक विडम्बना है। कठिन वैकल्पिक अर्थ ‘भुला दूँगा’ को पादटिप्पणी में रखा गया है।
- source_word: וְנָטַשְׁתִּי
  choice: दूर फेंक दूँगा
  rationale: त्यागने या छोड़ देने के मूल भाव को מֵעַל פָּנַי के साथ मिलाकर न्यायिक निष्कासन की सशक्त छवि के रूप में व्यक्त करता है।
- source_word: הָעִיר
  choice: उस नगर
  rationale: सन्दर्भ में यरूशलेम अभिप्रेत है, पर मूल पाठ इस पद में उसका नाम नहीं लेता; इसलिए ‘नगर’ ही रखा गया है।
- source_word: אֲשֶׁר נָתַתִּי לָכֶם וְלַאֲבוֹתֵיכֶם
  choice: जिसे मैंने तुम्हें और तुम्हारे पूर्वजों को दिया था
  rationale: वर्तमान पीढ़ी और उसके पूर्वजों को दिए गए नगर के वाचा-ऐतिहासिक सन्दर्भ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מֵעַל פָּנַי
  choice: अपने सामने से
  rationale: शाब्दिक ‘मेरे मुख के सामने से’ की मानवरूपी उपस्थिति-भाषा को हिन्दी में सहज रूप से बनाए रखता है; ‘अपनी उपस्थिति से’ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: וְנָשִׁיתִי ... נָשֹׂא की पाठगत और शब्दार्थगत अस्पष्टता
  choice: मैं निश्चय ही तुम्हें उठाऊँगा
  alternative: मैं तुम्हें पूरी तरह भुला दूँगा; अथवा, मैं निश्चय ही तुम्हें उठा ले जाऊँगा
  rationale: प्रदत्त मसोरेटिक पाठ और निकटवर्ती מַשָּׂא (‘बोझ/ईशवाणी’) से जुड़े शब्द-खेल को मुख्य पाठ में बनाए रखा गया है। ‘उठाऊँगा’ को ‘दूर फेंक दूँगा’ के साथ रखने से उसकी न्यायिक विडम्बना स्पष्ट होती है। चूँकि ‘भुला दूँगा’ एक प्राचीन और व्यापक वैकल्पिक समझ है, उसे चुपचाप हटाने के बजाय पादटिप्पणी में सुरक्षित रखा गया है।
- issue: מֵעַל פָּנַי में परमेश्वर की उपस्थिति की भाषा
  choice: अपने सामने से
  alternative: अपनी उपस्थिति से
  rationale: मुख्य पाठ मूल की ‘मुख/सामने’ वाली ठोस, मानवरूपी भाषा को रखता है, जबकि अर्थ को अधिक अमूर्त ढंग से व्यक्त करने वाला विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर भविष्यद्वाणी के अनुरूप गंभीर और गरिमापूर्ण रखी गई है। ‘देखो’ ध्यानाकर्षक हִנְנִי को सहज रूप देता है। डैशयुक्त ‘हाँ’ मूल में कर्म ‘तुम्हें’ की पुनरावृत्ति और उसके साथ नगर को जोड़ने की संरचना स्पष्ट करता है।
