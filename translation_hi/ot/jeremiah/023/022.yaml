source:
  edition: WLC
  text: וְ/אִֽם עָמְד֖וּ בְּ/סוֹדִ֑/י וְ/יַשְׁמִ֤עוּ דְבָרַ/י֙ אֶת עַמִּ֔/י וִֽ/ישִׁבוּ/ם֙ מִ/דַּרְכָּ֣/ם הָ/רָ֔ע וּ/מֵ/רֹ֖עַ מַֽעַלְלֵי/הֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/022.yaml
  text: But if they had stood in my council[a], then they would have caused my people to hear my words, and they would have turned them from their evil way and from the evil of their deeds.
translation:
  language: hi
  text: परन्तु यदि वे मेरी सभा[a] में उपस्थित हुए होते, तो वे मेरी प्रजा को मेरे वचन सुनाते और उन्हें उनके बुरे मार्ग से और उनके कामों की बुराई से फेर देते।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरी गुप्त सभा में” अथवा “मेरे परामर्श में।” इब्रानी शब्द סוֹד किसी घनिष्ठ या गोपनीय सभा, अथवा परामर्श को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: परन्तु यदि
  rationale: पिछले प्रसंग में झूठे भविष्यद्वक्ताओं की निन्दा के विपरीत यह शर्त रखी गई है; इसलिए संयोजक का विरोधसूचक बल व्यक्त किया गया है।
- source_word: עָמְדוּ
  choice: उपस्थित हुए होते
  rationale: शाब्दिक अर्थ ‘खड़े हुए होते’ है, पर सभा में प्रवेश और सहभागिता के भाव को आधुनिक हिन्दी में ‘उपस्थित हुए होते’ स्वाभाविक रूप से व्यक्त करता है; अवास्तविक भूतकालीन शर्त भी बनी रहती है।
- source_word: בְּסוֹדִי
  choice: मेरी सभा
  rationale: סוֹד यहाँ घनिष्ठ अथवा गोपनीय परामर्श-सभा को सूचित कर सकता है। ‘सभा’ सामूहिक उपस्थिति की छवि बचाती है, जबकि केवल ‘परामर्श’ उसे सलाह के अमूर्त अर्थ तक सीमित कर सकता है। विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: וְיַשְׁמִעוּ דְבָרַי אֶת־עַמִּי
  choice: वे मेरी प्रजा को मेरे वचन सुनाते
  rationale: שׁמע के हिफ़ील का कारणवाचक अर्थ ‘सुनाना’ में स्वाभाविक और संक्षिप्त हिन्दी में सुरक्षित है; דְבָרַי का बहुवचन ‘वचन’ के रूप में प्रसंगानुकूल है।
- source_word: וִישִׁבוּם
  choice: उन्हें ... फेर देते
  rationale: 'שׁוב के हिफ़ील का कारणवाचक अर्थ रखा गया है: भविष्यद्वक्ता लोगों को उनके बुरे आचरण से फिराते।'
- source_word: מִדַּרְכָּם הָרָע
  choice: उनके बुरे मार्ग से
  rationale: ‘मार्ग’ को आचरण के रूपक के रूप में बनाए रखा गया है और רַע को सीधे ‘बुरा’ कहा गया है।
- source_word: וּמֵרֹעַ מַעַלְלֵיהֶם
  choice: और उनके बुरे कामों से
  rationale: यह सहज हिन्दी है। मूल का अधिक शाब्दिक रूप ‘उनके कामों की बुराई से’ सम्भव है, पर हिन्दी में भारी और अप्राकृतिक लगता है।
theological_decisions:
- issue: ईश्वरीय סוֹד का स्वरूप
  choice: ‘मेरी सभा’—परमेश्वर की निकट परामर्श-सभा में भविष्यद्वक्ता की उपस्थिति की छवि
  alternative: ‘मेरे गुप्त परामर्श में’ या ‘मेरी मंत्रणा में’
  rationale: अनुवाद सच्चे भविष्यद्वक्ता की परमेश्वर के निकट उपस्थित होने की छवि को बनाए रखता है, पर इब्रानी शब्द की ‘गोपनीय मंडली’ और ‘परामर्श’ संबंधी वास्तविक अर्थ-सीमा को पादटिप्पणी में खुला छोड़ता है।
- issue: लोगों को बुराई से फेरने में भविष्यद्वक्ता की भूमिका
  choice: कारणवाचक रूप ‘उन्हें ... फेर देते’
  alternative: ‘वे ... फिर जाते’
  rationale: इब्रानी हिफ़ील भविष्यद्वक्ताओं की माध्यमिक भूमिका को स्पष्ट करता है; यह परमेश्वर और मानवीय प्रत्युत्तर के व्यापक संबंध को इस पद में आवश्यकता से अधिक परिभाषित नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘उपस्थित हुए होते ... सुनाते ... फेर देते’ से अवास्तविक भूतकालीन शर्त स्वाभाविक ढंग से व्यक्त होती है। ‘प्रजा’ वाचा-संबंधी सामूहिक भाव रखती है, और ‘वचन’ बाइबलीय प्रयोग से परिचित होते हुए भी वर्तमान हिन्दी में बोधगम्य है।
