source:
  edition: WLC
  text: וַ/אֲנִ֗י אֲקַבֵּץ֙ אֶת שְׁאֵרִ֣ית צֹאנִ֔/י מִ/כֹּל֙ הָ/אֲרָצ֔וֹת אֲשֶׁר הִדַּ֥חְתִּי אֹתָ֖/ם שָׁ֑ם וַ/הֲשִׁבֹתִ֥י אֶתְ/הֶ֛ן עַל נְוֵ/הֶ֖ן וּ/פָר֥וּ וְ/רָבֽוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/003.yaml
  text: And I myself will gather the remnant of my flock out of all the lands where I have driven them[a], and I will bring them back to their pasture[b], and they will be fruitful and multiply.
translation:
  language: hi
  text: और मैं स्वयं अपने झुंड के बचे हुओं को उन सब देशों से इकट्ठा करूँगा, जहाँ मैंने उन्हें खदेड़ दिया था[a]। मैं उन्हें उनके चरागाहों में फिर ले आऊँगा[b], और वे फलेंगे-फूलेंगे और संख्या में बढ़ेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘जहाँ मैंने उन्हें तितर-बितर कर दिया था।’ इब्रानी क्रिया का अर्थ दूर खदेड़ना या बिखेर देना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘उनके बाड़ों में’ अथवा ‘उनके निवास-स्थानों में।’ इब्रानी शब्द चरागाह, निवास या विश्राम-स्थान को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: और मैं स्वयं
  rationale: स्वतंत्र सर्वनाम אֲנִי कर्ता पर विशेष बल देता है; ‘मैं स्वयं’ उस बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אֲקַבֵּץ
  choice: इकट्ठा करूँगा
  rationale: קבץ बिखरे हुए लोगों या झुंड को फिर से एकत्र करने के लिए प्रयुक्त होता है; यह आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: שְׁאֵרִית צֹאנִי
  choice: अपनी भेड़-बकरियों के बचे हुओं
  rationale: צֹאן छोटे पालतू पशुओं के सामूहिक झुंड को दर्शाता है, इसलिए ‘भेड़-बकरियाँ’ अर्थ को स्पष्ट करता है; שְׁאֵרִית को ‘बचे हुए’ कहना शेष बचे समूह का भाव सुरक्षित रखता है।
- source_word: מִכֹּל הָאֲרָצוֹת
  choice: उन सब देशों से
  rationale: बहुवचन אֲרָצוֹת यहाँ निर्वासन के विभिन्न भूभागों या देशों को सूचित करता है; ‘देशों’ सामान्य पाठक के लिए सहज है।
- source_word: הִדַּחְתִּי
  choice: मैंने उन्हें खदेड़ दिया था
  rationale: हिफ़ील रूप में क्रिया किसी को दूर कर देने या तितर-बितर कर देने की कारक क्रिया है; ‘खदेड़ दिया’ ईश्वरीय कर्तृत्व और न्याय की कठोरता दोनों बनाए रखता है।
- source_word: וַהֲשִׁבֹתִי
  choice: मैं उन्हें ... लौटा लाऊँगा
  rationale: שוב का कारक रूप वापस ले आने को व्यक्त करता है; ‘लौटा लाऊँगा’ ठोस वापसी और परमेश्वर की सक्रिय भूमिका दोनों दिखाता है।
- source_word: עַל נְוֵיהֶן
  choice: उनके चरागाह में
  rationale: נָוֶה का अर्थ चरागाह, निवास या विश्राम-स्थान हो सकता है; झुंड के रूपक में ‘चरागाह’ सर्वाधिक स्वाभाविक है।
- source_word: וּפָרוּ וְרָבוּ
  choice: वे फलेंगे-फूलेंगे और बहुत बढ़ जाएँगे
  rationale: פרה और רבה की जोड़ी फलने तथा संख्या में बढ़ने का वाचा-संबंधी प्रतिध्वनित भाव रखती है; यह हिन्दी प्रयोग अर्थ और लय दोनों को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: निर्वासन और पुनर्स्थापना में परमेश्वर का कर्तृत्व
  choice: परमेश्वर द्वारा उन्हें खदेड़े जाने और फिर स्वयं इकट्ठा करके लौटाए जाने—दोनों को स्पष्ट रखा गया है।
  alternative: निर्वासन में परमेश्वर की भूमिका को हल्का करके केवल ‘जहाँ वे तितर-बितर हो गए थे’ कहना।
  rationale: इब्रानी पाठ प्रथम पुरुष में परमेश्वर को खदेड़ने का कर्ता बताता है और उसी को पुनर्स्थापना का कर्ता भी बताता है; न्याय और दया के इस तनाव को अनसुलझा ही सुरक्षित रखना चाहिए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘भेड़-बकरियों’ से צֹאן का सामूहिक अर्थ स्पष्ट होता है, जबकि ‘चरागाह’ पूरे पद में चरवाहे और झुंड के रूपक को बनाए रखता है।
