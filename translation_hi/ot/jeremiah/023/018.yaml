source:
  edition: WLC
  text: כִּ֣י מִ֤י עָמַד֙ בְּ/ס֣וֹד יְהוָ֔ה וְ/יֵ֖רֶא וְ/יִשְׁמַ֣ע אֶת דְּבָר֑/וֹ מִֽי הִקְשִׁ֥יב דבר/י וַ/יִּשְׁמָֽע־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/018.yaml
  text: For who has stood in the council of Yahweh[a], that he should see and hear his word? Who has paid attention to my word and heard it?
translation:
  language: hi
  text: क्योंकि कौन याहवे की सभा[a] में खड़ा हुआ है कि वह उसके वचन को देखे और सुने? किसने मेरे वचन पर ध्यान दिया और उसे सुना है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “याहवे की गुप्त अथवा घनिष्ठ मंत्रणा में।” इब्रानी शब्द סוֹד गोपनीय मंत्रणा के साथ-साथ सभा को भी सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन के लिए तर्कात्मक आधार प्रस्तुत करता है और हिन्दी में संबंध को स्वाभाविक रूप से बनाए रखता है।
- source_word: עָמַד
  choice: खड़ा हुआ है
  rationale: पूर्ण क्रिया को ऐसे रूप में रखा गया है जो अतीत में हुई सहभागिता और वर्तमान प्रश्न—दोनों से उसका संबंध दिखाता है।
- source_word: בְּסוֹד
  choice: सभा में
  rationale: यहाँ סוֹד संभवतः उस दिव्य विचार-विमर्श सभा को सूचित करता है जहाँ सच्चा नबी याहवे का वचन ग्रहण करता है; इसकी ‘गुप्त/घनिष्ठ मंत्रणा’ वाली अर्थ-छाया पादटिप्पणी में सुरक्षित है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिगत ईश्वरीय नाम का लिप्यंतरण किया गया है।
- source_word: וְיֵרֶא
  choice: कि वह ... देखे
  rationale: सभा में खड़े होने से निकलने वाले परिणाम या उद्देश्य को व्यक्त करता है और मूल के असामान्य ‘देखने’ के बिंब को बनाए रखता है।
- source_word: וְיִשְׁמַע
  choice: और सुने
  rationale: नबूवत ग्रहण करने के संदर्भ में ‘देखना’ और ‘सुनना’ की जोड़ी सुरक्षित रखी गई है।
- source_word: דְּבָרוֹ
  choice: उसका वचन
  rationale: दָּבָר की नबूवतीय और प्रकाशनात्मक शक्ति को बिना अतिरिक्त व्याख्या के बनाए रखता है।
- source_word: הִקְשִׁיב
  choice: ध्यान लगाया
  rationale: हिफ़ील रूप साधारण सुनने से अधिक, ध्यानपूर्वक ग्रहण करने का भाव देता है।
- source_word: דְבָרִי
  choice: मेरे वचन
  rationale: मूल पाठ में तीसरे पुरुष ‘उसका वचन’ से पहले पुरुष ‘मेरे वचन’ की ओर हुए परिवर्तन को यथावत रखा गया है।
- source_word: וַיִּשְׁמָע
  choice: और उसे सुना है
  rationale: सुनने की पुनरावृत्ति को बनाए रखता है; ‘उसे’ से हिन्दी में कर्म स्पष्ट होता है, जबकि ‘आज्ञा मानी’ जैसी अधिक व्याख्यात्मक व्यंजना नहीं जोड़ी गई।
theological_decisions:
- issue: סוֹד יְהוָה का अर्थ
  choice: याहवे की सभा
  alternative: याहवे की गुप्त अथवा घनिष्ठ मंत्रणा
  rationale: नबियों के विरुद्ध इस विवाद में दिव्य विचार-विमर्श सभा तक पहुँच का बिंब उपयुक्त है, पर इब्रानी शब्द की गोपनीय मंत्रणा वाली वास्तविक अर्थ-संभावना पादटिप्पणी में दी गई है।
- issue: ‘उसका वचन’ से ‘मेरे वचन’ की ओर पुरुष-परिवर्तन
  choice: परिवर्तन को यथावत रखना
  alternative: दोनों स्थानों पर एक ही पुरुष रखकर वाक्य को समरूप बनाना
  rationale: इब्रानी पाठ का यह परिवर्तन वक्ता और संदर्भ के बीच एक वास्तविक तनाव है; उसे चुपचाप समतल नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘सभा’ परिचित शब्द है; पादटिप्पणी उसके अधिक विशिष्ट और वैकल्पिक अर्थों को स्पष्ट करती है।
