id: JER.23.36
reference: Jeremiah 23:36
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/מַשָּׂ֥א יְהוָ֖ה לֹ֣א תִזְכְּרוּ ע֑וֹד כִּ֣י הַ/מַּשָּׂ֗א יִֽהְיֶה֙ לְ/אִ֣ישׁ דְּבָר֔/וֹ וַ/הֲפַכְתֶּ֗ם אֶת דִּבְרֵי֙ אֱלֹהִ֣ים חַיִּ֔ים יְהוָ֥ה צְבָא֖וֹת אֱלֹהֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/036.yaml
  text: But you shall no longer mention ‘the burden of Yahweh,’ for each man's own word will become his burden[a], and you have twisted the words of the living God, Yahweh of hosts[b], our God.
translation:
  language: hi
  text: परन्तु तुम फिर कभी ‘याहवे का भार’ न कहना, क्योंकि हर मनुष्य का अपना वचन उसका भार[a] बनेगा[b]; और तुमने जीवित परमेश्वर—सेनाओं के याहवे, हमारे परमेश्वर—के वचनों को तोड़-मरोड़ दिया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द מַשָּׂא का अर्थ ‘भार’ भी हो सकता है और भविष्यद्वाणी के प्रसंग में ‘वाणी’ या ‘संदेश’ भी। यहाँ दोनों अर्थों पर शब्द-खेल जान पड़ता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “हर मनुष्य के लिए उसका वचन ही भार होगा।” सम्भवतः आशय यह है कि हर व्यक्ति का अपना कहा हुआ वचन उसी पर लौटकर भार बनेगा, न कि याहवे का सच्चा वचन ठहरेगा।
    reason: alternative_reading
lexical_decisions:
- source_word: מַשָּׂא
  choice: भार
  rationale: इब्रानी शब्द का अर्थ वास्तविक ‘भार’ और भविष्यद्वाणी-संदेश दोनों हो सकता है। दोनों बार ‘भार’ रखने से पद का जानबूझकर किया गया शब्द-खेल सुरक्षित रहता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम का लिप्यंतरण किया गया है, उसे किसी उपाधि से नहीं बदला गया।
- source_word: תִזְכְּרוּ
  choice: न कहना
  rationale: उद्धृत वाक्यांश के साथ क्रिया का आशय उसे याद करना नहीं, बल्कि उसका उल्लेख करना या उसे बोलना है। सहज हिन्दी में ‘न कहना’ इस निषेध को स्पष्ट करता है।
- source_word: הַמַּשָּׂא יִהְיֶה לְאִישׁ דְּבָרוֹ
  choice: हर मनुष्य का अपना वचन उसका भार बनेगा
  rationale: संक्षिप्त इब्रानी रचना को स्पष्ट हिन्दी में रखते हुए यह भाव सुरक्षित किया गया है कि वक्ता का अपना कथन उसी पर भार बन जाएगा।
- source_word: וַהֲפַכְתֶּם
  choice: तोड़-मरोड़ दिया है
  rationale: यहाँ הפך परमेश्वर के वचनों को उलटने या विकृत करने का दोष बताता है। ‘तोड़-मरोड़ दिया’ आधुनिक हिन्दी में सजीव और स्पष्ट है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं के याहवे
  rationale: यह अनुवाद ‘सेनाओं’ के मूल रूपक को बनाए रखता है और ‘सर्वशक्तिमान’ जैसी व्याख्यात्मक उपाधि नहीं अपनाता।
- source_word: דִּבְרֵי אֱלֹהִים חַיִּים
  choice: जीवित परमेश्वर के वचन
  rationale: मूल पदबंध का सीधा और स्वाभाविक हिन्दी रूप, जिसमें ‘जीवित परमेश्वर’ की धर्मवैचारिक शक्ति बनी रहती है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है; ‘याहवे’ उसका निकट लिप्यंतरण है और नाम को उपाधि में नहीं बदलता।
- issue: מַשָּׂא के दोहरे अर्थ का निर्वाह
  choice: दोनों स्थानों पर ‘भार’
  alternative: भविष्यवाणी; संदेश; ईशवाणी
  rationale: यह पद लोगों की भविष्यद्वाणी-संबंधी बोली को उन्हीं पर पलटता है। एक ही शब्द रखने से ‘भविष्यवाणी-संदेश’ और ‘बोझ’ के बीच का तनाव तथा चेतावनी दोनों बने रहते हैं।
- issue: हर मनुष्य के वचन के भार बनने का अर्थ
  choice: कथन को खुला रखते हुए ‘उसका भार बनेगा’
  alternative: उसका कथन उसी के विरुद्ध दण्ड बन जाएगा
  rationale: मूल पाठ परिणाम की पूरी प्रक्रिया स्पष्ट नहीं करता। अनुवाद संभावित प्रत्याघात को संकेतित करता है, पर उसे दण्ड की विशिष्ट व्याख्या तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘तोड़-मरोड़ दिया’ दोष की सजीवता व्यक्त करता है; दीर्घ पदवी को डैशों के बीच रखकर वाक्य की पठनीयता बनाए रखी गई है।
