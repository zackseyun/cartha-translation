  text: כֹּֽה אָמַ֞ר יְהוָ֣ה צְבָא֗וֹת אַֽל תִּשְׁמְע֞וּ עַל דִּבְרֵ֤י הַ/נְּבִאִים֙ הַ/נִּבְּאִ֣ים לָ/כֶ֔ם מַהְבִּלִ֥ים הֵ֖מָּה אֶתְ/כֶ֑ם חֲז֤וֹן לִבָּ/ם֙ יְדַבֵּ֔רוּ לֹ֖א מִ/פִּ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/016.yaml
  text: 'Thus says Yahweh of hosts: Do not listen to the words of the prophets who prophesy to you; they are deluding you. They speak a vision of their own heart[a], not from the mouth of Yahweh.'
translation:
  language: hi
  text: 'सेनाओं का याहवे यह कहता है: “उन भविष्यद्वक्ताओं की बातों पर ध्यान मत दो, जो तुम्हें भविष्यवाणी सुनाते हैं। वे तुम्हें भरमा रहे हैं[a]। वे अपने ही हृदय का दर्शन सुनाते हैं, न कि याहवे के मुख से निकली बात।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे तुम्हें व्यर्थता की ओर ले जा रहे हैं”; अधिक शाब्दिक रूप में, “वे तुम्हें खोखला बना रहे हैं।” हिब्रू क्रिया में खोखलापन या व्यर्थता उत्पन्न करने का भाव है।
    reason: מַהְבִּלִים की अर्थ-व्याप्ति और अधिक शाब्दिक विकल्प को सुरक्षित रखना।
lexical_decisions:
