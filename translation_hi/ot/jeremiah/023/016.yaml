  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। ‘भविष्यद्वक्ता’, ‘दर्शन’, ‘हृदय’ और ‘याहवे के मुख’ जैसे मूल-पाठ के प्रमुख धार्मिक एवं रूपकात्मक पद सुरक्षित रखे गए हैं; वाक्य-विन्यास हिन्दी की स्वाभाविकता के अनुसार रखा गया है।
