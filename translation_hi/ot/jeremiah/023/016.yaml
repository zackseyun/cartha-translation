- source_word: אַל תִּשְׁמְעוּ עַל דִּבְרֵי
  choice: बातों पर ध्यान मत दो
  rationale: इस प्रसंग में שמע על का स्वाभाविक हिन्दी अर्थ केवल सुनना नहीं, बल्कि बात मानना या उस पर ध्यान देना है; ‘बातों’ से मूल का बहुवचन भी बना रहता है।
- source_word: הַנְּבִאִים הַנִּבְּאִים לָכֶם
  choice: भविष्यद्वक्ताओं…जो तुम्हारे लिए भविष्यवाणी कर रहे हैं
  rationale: संज्ञा और उसी धातु से बने कृदन्त की हिब्रू पुनरुक्ति तथा לָכֶם का प्रत्यक्ष संबोधन सुरक्षित रखता है।
- source_word: מַהְבִּלִים הֵמָּה אֶתְכֶם
  choice: वे तुम्हें भरमा रहे हैं
  rationale: הבל के हिफ़ील रूप में निहित खोखलेपन, व्यर्थता और भ्रम उत्पन्न करने के भाव को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है; अर्थ की व्यापकता पाद-टिप्पणी में दी गई है।
- source_word: חֲזוֹן לִבָּם
  choice: अपने ही हृदय का दर्शन
  rationale: एकवचन ‘दर्शन’ और हिब्रू ‘हृदय’ की छवि को बनाए रखता है; यहाँ हृदय विचार, इच्छा और आंतरिक स्रोत को समेटता है।
- source_word: לֹא מִפִּי יְהוָה
  choice: न कि याहवे के मुख से निकली बात
  rationale: ‘मुख से’ की ठोस हिब्रू छवि को बनाए रखते हुए हिन्दी में स्पष्ट करता है कि संदेश याहवे की वाणी से नहीं निकला।
theological_decisions:
- issue: झूठे भविष्यद्वक्ताओं का श्रोताओं पर प्रभाव
  choice: वे तुम्हें भरमा रहे हैं
  alternative: वे तुम्हें खोखला/व्यर्थ बना रहे हैं; वे तुम्हें खोखली आशा दे रहे हैं
  rationale: מַהְבִּלִים में भ्रम के साथ खोखलेपन या व्यर्थता का कारण बनने का भाव है। मुख्य पाठ में स्वाभाविक अर्थ रखा गया है, जबकि पाद-टिप्पणी मूल की कठिन और व्यापक अर्थ-छाया सुरक्षित रखती है।
- issue: לֵב से जुड़ी मानवशास्त्रीय छवि
  choice: हृदय
  alternative: मन
  rationale: ‘हृदय’ मूल की छवि और स्वयं से उपजे दर्शन बनाम याहवे के मुख से निकली वाणी का तनाव बनाए रखता है; इसे केवल बौद्धिक ‘मन’ तक सीमित नहीं किया गया।
