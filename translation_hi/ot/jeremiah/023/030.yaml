source:
  edition: WLC
  text: לָ/כֵ֛ן הִנְ/נִ֥י עַל הַ/נְּבִאִ֖ים נְאֻם יְהוָ֑ה מְגַנְּבֵ֣י דְבָרַ֔/י אִ֖ישׁ מֵ/אֵ֥ת רֵעֵֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/030.yaml
  text: Therefore[a], behold, I am against the prophets, declares Yahweh, who steal my words, each from his neighbor.
translation:
  language: hi
  text: इसलिए, देखो, मैं उन भविष्यद्वक्ताओं के विरुद्ध हूँ—याहवे की यह घोषणा है—जो मेरे वचनों को, हर एक अपने साथी से, चुराते हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शब्दशः: “हर एक अपने साथी से।”'
    reason: मूल इब्रानी की वितरणात्मक, व्याकरणतः पुल्लिंग एकवचन संरचना को दिखाने के लिए।
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले कथन से परिणामस्वरूप आने वाली निंदा को स्वाभाविक और स्पष्ट हिन्दी में जोड़ता है।
- source_word: הִנְנִי עַל
  choice: देखो, मैं ... के विरुद्ध हूँ
  rationale: הִנְנִי की ध्यान आकर्षित करने वाली emphatic घोषणा और עַל के न्याय-संदर्भ में विरोधी भाव—दोनों सुरक्षित रहते हैं।
- source_word: הַנְּבִאִים
  choice: उन भविष्यद्वक्ताओं
  rationale: निश्चित बहुवचन को दर्शाता है और हिन्दी में पहले से लक्षित वर्ग की ओर संकेत स्वाभाविक बनाता है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: स्थिर भविष्यसूचक सूत्र की औपचारिक शक्ति बनाए रखता है और יְהוָה को उपाधि से बदलने के बजाय व्यक्तिगत नाम के रूप में प्रस्तुत करता है।
- source_word: מְגַנְּבֵי
  choice: जो ... चुराते हैं
  rationale: भागवाचक रूप इन भविष्यद्वक्ताओं की विशेषता बताता है; हिन्दी में संबंधवाचक उपवाक्य स्वाभाविक है और जारी/अभ्यस्त कार्य का भाव देता है।
- source_word: דְבָרַי
  choice: मेरे वचनों को
  rationale: मूल के बहुवचन को बनाए रखता है; ‘संदेश’ कहने से आने वाली अनावश्यक व्याख्या से बचता है।
- source_word: אִישׁ מֵאֵת רֵעֵהוּ
  choice: एक-दूसरे से
  rationale: वितरणात्मक इब्रानी मुहावरे का स्वाभाविक हिन्दी रूप है; पारस्परिक चोरी का आशय स्पष्ट करता है, जबकि अधिक शब्दशः रूप पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना लिप्यंतरित करता है।
- issue: אִישׁ ... רֵעֵהוּ का वितरणात्मक अर्थ
  choice: एक-दूसरे से
  alternative: हर एक अपने साथी से
  rationale: हिन्दी में ‘एक-दूसरे से’ पारस्परिक और वितरणात्मक अर्थ को सहजता से व्यक्त करता है; शब्दशः संरचना को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘देखो’ मूल की आकस्मिक और बलपूर्ण दिव्य घोषणा को बनाए रखता है। डैश भविष्यसूचक सूत्र को मुख्य आरोप से स्पष्ट रूप से अलग करते हैं।
