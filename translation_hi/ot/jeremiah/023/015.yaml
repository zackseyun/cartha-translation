review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the oracle’s addressees, the concrete images of wormwood and poisonous water, the causal clause, and the scope of ‘all the land.’ Future forms in Hindi naturally convey the announced judgment. However, ‘भक्तिहीनता’ is too narrowly about a lack of devotional feeling for חֲנֻפָּה, which denotes impiety/profaneness and moral-religious corruption.
  naturalness: The passage is clear and appropriately solemn in modern standard Hindi. ‘भक्तिहीनता’ is less idiomatic and less precise in this context. The footnote’s phrase ‘कड़वे विष का पानी’ is awkward Hindi.
  terminology: ‘याहवे,’ ‘सेनाओं का,’ ‘नबियों के विषय में,’ ‘नागदौना,’ and ‘विषैला पानी’ are suitable. Replacing ‘भक्तिहीनता’ with ‘अधर्म’ better conveys the Hebrew term’s combined religious and ethical force without imposing an interpretation.
  issues:
  - severity: medium
    issue: ‘भक्तिहीनता’ for חֲנֻפָּה
    rationale: This Hindi word primarily means lack of devotion, whereas the Hebrew refers more broadly to impiety, profaneness, and corrupt conduct. ‘अधर्म’ is a natural, sufficiently broad equivalent in this prophetic judgment context.
  - severity: low
    issue: Footnote wording ‘कड़वे विष का पानी’
    rationale: The expression is stylistically awkward and can suggest a specific compound not stated by the Hebrew. ‘विष का पानी’ preserves the lexical alternative ‘water of gall/poison,’ while the explanation retains the ambiguity of רֹאשׁ.
