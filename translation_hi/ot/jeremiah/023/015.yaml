source:
  edition: WLC
  text: לָ/כֵ֞ן כֹּֽה אָמַ֨ר יְהוָ֤ה צְבָאוֹת֙ עַל הַ/נְּבִאִ֔ים הִנְ/נִ֨י מַאֲכִ֤יל אוֹתָ/ם֙ לַֽעֲנָ֔ה וְ/הִשְׁקִתִ֖י/ם מֵי רֹ֑אשׁ כִּ֗י מֵ/אֵת֙ נְבִיאֵ֣י יְרוּשָׁלִַ֔ם יָצְאָ֥ה חֲנֻפָּ֖ה לְ/כָל הָ/אָֽרֶץ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/015.yaml
  text: 'Therefore this is what Yahweh of Armies says concerning the prophets: ‘Look[a], I am feeding them wormwood and making them drink poisoned water, because from the prophets of Jerusalem ungodliness has gone out into all the land.’'
translation:
  language: hi
  text: 'इसलिए सेनाओं का याहवे नबियों के विषय में यह कहता है:


    “देखो, मैं उन्हें नागदौना खिलाऊँगा

    और विषैला पानी[a] पिलाऊँगा,

    क्योंकि यरूशलेम के नबियों से

    अधर्म सारे देश में फैल गया है।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “विष का पानी।” इब्रानी में शाब्दिक रूप से “रोश का पानी” है; ‘रोश’ किसी कड़वे या विषैले पदार्थ को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को ‘याहवे’ के रूप में रखा गया है और צְבָאוֹת के ठोस सैन्य अर्थ को ‘सेनाओं’ से व्यक्त किया गया है।
- source_word: עַל הַנְּבִאִים
  choice: नबियों के विषय में
  rationale: עַל यहाँ ‘के विषय में’ और ‘के विरुद्ध’ दोनों भाव दे सकता है; व्यापक अर्थ ‘के विषय में’ रखा गया है, जबकि दंड की घोषणा विरोध का भाव स्पष्ट कर देती है।
- source_word: הִנְנִי
  choice: देखो, मैं ... खिलाऊँगा ... पिलाऊँगा
  rationale: ‘देखो’ ध्यान आकर्षित करने वाली जोरदार भूमिका को व्यक्त करता है। प्रसंग में आने वाले दंड की निश्चित घोषणा के कारण हिन्दी में भविष्यकाल स्वाभाविक है।
- source_word: לַעֲנָה
  choice: नागदौना
  rationale: यह कड़वे पौधे wormwood को सूचित करता है; पौधे की ठोस दंडात्मक छवि को सामान्य ‘कड़वाहट’ में नहीं बदला गया।
- source_word: מֵי רֹאשׁ
  choice: विषैला पानी
  rationale: इस पदबंध में רֹאשׁ किसी कड़वे या विषैले पदार्थ को दर्शाता है। ‘विषैला पानी’ आधुनिक हिन्दी में अर्थ स्पष्ट करता है, जबकि अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: חֲנֻפָּה
  choice: भक्तिहीनता
  rationale: यह शब्द धार्मिक और नैतिक भ्रष्टता, अपवित्रता अथवा ईश्वर-विमुख आचरण का भाव रखता है; ‘भक्तिहीनता’ उसके धार्मिक आयाम को बनाए रखता है।
- source_word: יָצְאָה
  choice: फैल गई है
  rationale: शाब्दिक अर्थ ‘निकल गई है’ है, पर यहाँ यरूशलेम के नबियों से पूरे देश में भ्रष्टता के प्रसार को ‘फैल गई है’ स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְכָל הָאָרֶץ
  choice: सारे देश में
  rationale: यरमियाह के प्रसंग में הָאָרֶץ से पूरी पृथ्वी की अपेक्षा संबंधित देश का संकेत अधिक स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय दंड की ठोस छवि
  choice: याहवे नबियों को नागदौना खिलाने और विषैला पानी पिलाने की घोषणा करते हैं।
  alternative: ‘मैं उन्हें कड़वा दंड दूँगा’ जैसे अमूर्त अर्थानुवाद।
  rationale: मूल इब्रानी की सजीव दंडात्मक उपमा धार्मिक भार रखती है, इसलिए उसे सामान्यीकृत नहीं किया गया।
- issue: עַל का संबंध
  choice: नबियों के विषय में
  alternative: नबियों के विरुद्ध
  rationale: पूर्वसर्ग दोनों अर्थों की अनुमति देता है। ‘के विषय में’ अस्पष्टता को अधिक सुरक्षित रखता है; कथन की दंडात्मक विषयवस्तु विरोध को स्वतः प्रकट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर भविष्यद्वाणी-संबंधी शैली रखी गई है। पद्य-पंक्तियों से घोषणा का समानांतर ढाँचा स्पष्ट होता है। ‘नागदौना’ ठोस वनस्पति-छवि को और ‘भक्तिहीनता’ धार्मिक तथा नैतिक भ्रष्टता के संयुक्त भाव को बनाए रखते हैं।
