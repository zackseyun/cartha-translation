  text: לֹא שָׁלַ֥חְתִּי אֶת הַ/נְּבִאִ֖ים וְ/הֵ֣ם רָ֑צוּ לֹא דִבַּ֥רְתִּי אֲלֵי/הֶ֖ם וְ/הֵ֥ם נִבָּֽאוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/021.yaml
  text: I did not send the prophets[a], yet they ran; I did not speak to them, yet they prophesied.
translation:
  language: hi
  text: मैंने भविष्यद्वक्ताओं को नहीं भेजा, फिर भी[a] वे दौड़े; मैंने उनसे नहीं बोला, फिर भी उन्होंने भविष्यवाणी की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और वे दौड़े।” हिब्रू संयोजक का अनुवाद केवल “और” भी हो सकता है, लेकिन यहाँ वह प्रबल विरोध व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַחְתִּי
  choice: भेजा था
  rationale: मूल क्रिया का सामान्य अर्थ ‘भेजना’ है; प्रसंग में ईश्वरीय अधिकार देकर भेजने का भाव निहित है, पर अनुवाद उसे अनावश्यक रूप से स्पष्ट नहीं करता।
- source_word: הַנְּבִאִים
  choice: उन भविष्यद्वक्ताओं
  rationale: निश्चित पद प्रसंग में आरोपित भविष्यद्वक्ताओं की ओर संकेत करता है। हिन्दी में ‘उन’ संदर्भ को स्वाभाविक रूप से व्यक्त करता है, जबकि मूल से अधिक तीखा ‘इन’ नहीं जोड़ता।
- source_word: רָצוּ
  choice: दौड़े
  rationale: शाब्दिक और सजीव बिंब बनाए रखा गया है; यहाँ बिना भेजे उत्सुकता या उतावली से अपने काम में निकल पड़ने का भाव हो सकता है।
- source_word: דִבַּרְתִּי אֲלֵיהֶם
  choice: उनसे नहीं कहा था
  rationale: हिब्रू मुहावरे का अर्थ उनसे बोलना है। इस प्रसंग में हिन्दी ‘कहा’ स्वाभाविक है और किसी दिव्य संदेश के न दिए जाने को सीधे व्यक्त करता है।
- source_word: נִבָּאוּ
  choice: भविष्यवाणी की
  rationale: नבא की निफ़अल क्रिया के लिए यह प्रचलित और सीधा हिन्दी समतुल्य है।
- source_word: וְהֵם
  choice: फिर भी वे
  rationale: וְ का मूल संयोजक अर्थ ‘और’ हो सकता है, किंतु दोनों समानांतर वाक्यों में प्रबल विरोध है; ‘फिर भी’ उसे स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לֹא
  choice: नहीं ... था
  rationale: निषेध के साथ पूर्ण क्रियाएँ इस प्रसंग में पूर्वकालीन, पूर्ण कार्रवाई के अभाव को बताती हैं; हिन्दी पूर्ण भूतकाल इसे सहज रूप से व्यक्त करता है।
theological_decisions:
- issue: झूठे भविष्यद्वक्ताओं की गतिविधि का स्वरूप
  choice: पद कहता है कि उन्होंने परमेश्वर के भेजे और उनसे बोले बिना भविष्यवाणी की।
  alternative: इसे केवल उनकी उतावली की आलोचना माना जा सकता है, न कि हर प्रकार के ईश्वरीय अधिकार का पूर्ण निषेध।
  rationale: ‘मैंने नहीं भेजा’ और ‘मैंने नहीं कहा’ की समानांतर उक्तियाँ अधिकार और प्रकाशन के अभाव पर बल देती हैं। अनुवाद इसी आरोप को रखता है, पर भविष्यवाणी के विषय में इससे आगे कोई व्यापक सिद्धांत नहीं जोड़ता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘दौड़े’ द्वारा मूल का सजीव रूपक सुरक्षित रखा गया है। पादटिप्पणी-चिह्न वाक्य के अंत में रखा गया है क्योंकि वही संयोजक दोनों समानांतर खंडों में आता है।
