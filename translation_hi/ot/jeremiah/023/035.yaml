source:
  edition: WLC
  text: כֹּ֥ה תֹאמְר֛וּ אִ֥ישׁ עַל רֵעֵ֖/הוּ וְ/אִ֣ישׁ אֶל אָחִ֑י/ו מֶה עָנָ֣ה יְהוָ֔ה וּ/מַה דִּבֶּ֖ר יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/035.yaml
  text: Thus each man shall say to his neighbor[a], and each man to his brother, ‘What has Yahweh answered?’ and[b], ‘What has Yahweh spoken?’
translation:
  language: hi
  text: तुम में से हर एक अपने पड़ोसी से और अपने भाई से इस प्रकार कहे, “याहवे ने क्या उत्तर दिया है, और याहवे ने क्या कहा है?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה תֹאמְרוּ
  choice: यह कहे
  rationale: כֹּה बोलने के निर्धारित ढंग का परिचय देता है, और बहुवचन संबोधन के साथ आने वाला אִישׁ हिन्दी में ‘तुममें से हर एक ... कहे’ द्वारा स्वाभाविक तथा निर्देशात्मक रूप में व्यक्त होता है।
- source_word: אִישׁ עַל רֵעֵהוּ
  choice: तुममें से हर एक अपने पड़ोसी से
  rationale: אִישׁ का यहाँ वितरणात्मक भाव है। बोलने के प्रसंग में עַל संबोधित व्यक्ति को सूचित करता है, और רֵעַ के लिए ‘पड़ोसी’ उपयुक्त है।
- source_word: וְאִישׁ אֶל אָחִיו
  choice: और अपने भाई से
  rationale: दूसरा אִישׁ पहले के वितरणात्मक कर्ता को समानांतर रूप से दोहराता है; हिन्दी में अनावश्यक पुनरुक्ति से बचते हुए אָחִיו का स्पष्ट अर्थ ‘अपने भाई से’ रखा गया है।
- source_word: מֶה עָנָה יְהוָה
  choice: याहवे ने क्या उत्तर दिया है?
  rationale: עָנָה का मूल अर्थ ‘उत्तर देना’ है। पूर्ण क्रिया को वर्तमान प्रसंग में प्राप्त उत्तर के विषय में प्रश्न के रूप में ‘दिया है’ से व्यक्त किया गया है।
- source_word: וּמַה דִּבֶּר יְהוָה
  choice: और “याहवे ने क्या कहा है?”
  rationale: דִּבֶּר का सामान्य अर्थ ‘बोलना/कहना’ है। आधुनिक हिन्दी में ‘क्या कहा है’ अधिक स्वाभाविक है और किसी औपचारिक घोषणा का अतिरिक्त भाव नहीं जोड़ता।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम टेट्राग्रामटन है; इसे किसी उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण ‘याहवे’ रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल इब्रानी में व्यक्तिगत वाचा-नाम सीधे प्रयुक्त है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और नाम को उपाधि में नहीं बदलता।
- issue: עָנָה और דִּבֶּר के बीच भेद
  choice: ‘उत्तर दिया है’ और ‘कहा है’
  alternative: दोनों को ‘कहा है’ करना
  rationale: दोनों प्रश्नों की समानांतरता बनाए रखते हुए पहले क्रियापद के प्रत्युत्तर वाले विशिष्ट अर्थ को सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘तुममें से हर एक’ बहुवचन संबोधन तथा वितरणात्मक אִישׁ दोनों को स्पष्ट करता है। ‘भाई’ मूल के पुरुषवाची संबंध-संज्ञा को बनाए रखता है।
