source:
  edition: WLC
  text: לָ/כֵן֩ יִֽהְיֶ֨ה דַרְכָּ֜/ם לָ/הֶ֗ם כַּ/חֲלַקְלַקּוֹת֙ בָּֽ/אֲפֵלָ֔ה יִדַּ֖חוּ וְ/נָ֣פְלוּ בָ֑/הּ כִּֽי אָבִ֨יא עֲלֵי/הֶ֥ם רָעָ֛ה שְׁנַ֥ת פְּקֻדָּתָ֖/ם נְאֻם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/012.yaml
  text: Therefore their way will be to them like slippery places in the darkness; they will be driven along and fall in it[a], for I will bring disaster on them in the year of their punishment, declares Yahweh.
translation:
  language: hi
  text: इसलिए उनका मार्ग उनके लिए अँधेरे में फिसलन भरे स्थानों जैसा होगा; वे धकेले जाएँगे और वहीं गिर पड़ेंगे। क्योंकि मैं उनके दण्ड के वर्ष[a] में उन पर विपत्ति लाऊँगा—यह याहवे की घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस वर्ष में जब मैं उनसे लेखा लूँगा।” इब्रानी पद का अर्थ वह समय भी हो सकता है जब परमेश्वर न्याय या हिसाब के लिए उनकी सुधि लेता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले अभियोग के परिणामस्वरूप आने वाले न्याय को स्पष्ट रूप से जोड़ता है और इब्रानी के निष्कर्षसूचक बल को बनाए रखता है।
- source_word: יִהְיֶה דַרְכָּם לָהֶם
  choice: उनका मार्ग उनके लिए ... होगा
  rationale: इब्रानी रचना और ‘मार्ग’ के जीवन-क्रम तथा भावी दशा वाले रूपक को बनाए रखता है; ‘उनके लिए’ से यह भाव भी रहता है कि उनका अपना मार्ग उनके लिए संकट बन जाएगा।
- source_word: כַּחֲלַקְלַקּוֹת
  choice: फिसलन भरे स्थानों जैसा
  rationale: बहुवचन और खतरनाक, चिकने स्थानों की सजीव छवि दोनों सुरक्षित रहते हैं।
- source_word: בָּאֲפֵלָה
  choice: अँधेरे में
  rationale: यह दृश्य के वास्तविक और रूपकात्मक—दोनों प्रकार के संकट को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יִדַּחוּ
  choice: वे धकेले जाएँगे
  rationale: निफ़अल रूप बाहरी बल द्वारा आगे या दूर धकेले जाने का भाव देता है; अनावश्यक रूप से नीचे गिराए जाने का अर्थ नहीं जोड़ा गया।
- source_word: וְנָפְלוּ בָהּ
  choice: और वहीं गिर पड़ेंगे
  rationale: स्त्रीलिंग एकवचन प्रत्यय को हिन्दी में अस्वाभाविक सर्वनाम से बाँधने के बजाय ‘वहीं’ स्थानगत संदर्भ को बनाए रखता है और अँधेरे/उस संकटमय मार्ग के बीच संभावित संदर्भ को अतिनिश्चित नहीं करता।
- source_word: כִּי אָבִיא עֲלֵיהֶם רָעָה
  choice: क्योंकि मैं ... उन पर विपत्ति लाऊँगा
  rationale: न्याय के प्रसंग में רָעָה नैतिक बुराई नहीं, बल्कि विनाशकारी विपत्ति दर्शाता है; ‘विपत्ति’ कठोरता को बनाए रखते हुए यह भेद स्पष्ट करती है।
- source_word: שְׁנַת פְּקֻדָּתָם
  choice: उनके दण्ड के वर्ष
  rationale: न्याय के इस प्रसंग में פְּקֻדָּה का प्रमुख आशय दण्ड या लेखा लेने का समय है; ‘दण्ड के वर्ष’ संक्षिप्त और स्वाभाविक है, जबकि वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: यह गंभीर भविष्यद्वाणी-सूत्र को स्वाभाविक हिन्दी में रखता है और व्यक्तिवाचक वाचा-नाम को लिप्यंतरित करता है।
theological_decisions:
- issue: יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला दिव्य नाम सीधे आया है; ‘याहवे’ उस वाचा-नाम को उपाधि में बदले बिना प्रस्तुत करता है।
- issue: ईश्वरीय न्याय में רָעָה का अर्थ
  choice: विपत्ति
  alternative: बुराई; अनिष्ट; महाविपत्ति
  rationale: यहाँ शब्द परमेश्वर द्वारा लाए जाने वाले दण्डात्मक संकट को बताता है, नैतिक बुराई को नहीं; ‘विपत्ति’ इस अर्थ और न्याय की गंभीरता दोनों को सुरक्षित रखती है।
- issue: פְּקֻדָּה का न्याय-संबंधी अर्थ
  choice: दण्ड
  alternative: सुधि लेना; लेखा लेना; निरीक्षण
  rationale: प्रसंग दण्डात्मक न्याय का है, इसलिए मुख्य पाठ में ‘दण्ड’ सर्वाधिक स्पष्ट है; फिर भी शब्द में ईश्वर के आकर लेखा लेने का अर्थ-संकेत है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। मार्ग, अँधेरा और फिसलन की संयुक्त काव्यात्मक छवि सुरक्षित है। छोटे वाक्य-विभाजन से न्याय की घोषणा स्पष्ट होती है, और किसी विशिष्ट सम्प्रदाय की पारिभाषिक शब्दावली नहीं जोड़ी गई।
