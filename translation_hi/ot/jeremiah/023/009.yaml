  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत चतुरक्षरीय नाम सीधे आया है। ‘याहवे’ उसे एक उपाधि से बदले बिना प्रस्तुत करता है।
- issue: מִפְּנֵי का कारणसूचक या स्थानसूचक अर्थ
  choice: के कारण
  alternative: के सामने; की उपस्थिति के कारण
  rationale: वाक्य में यह यिर्मयाह की अभिभूत शारीरिक और भावात्मक दशा का कारण सबसे स्वाभाविक रूप से व्यक्त करता है, पर स्थान या उपस्थिति का अर्थ पूर्णतः असंभव नहीं है।
- issue: לַנְּבִאִים का विषयसूचक या विरोधात्मक बल
  choice: नबियों के विषय में
  alternative: नबियों के विरुद्ध
  rationale: यह वाणी के विषय का शीर्षक हो सकता है; आगामी संदर्भ विरोध प्रकट करता है, किंतु उसे स्वयं इस पदबंध में अनिवार्य रूप से भरना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज, गरिमापूर्ण और काव्यात्मक गद्य अपनाया गया है। शारीरिक रूपकों को अक्षुण्ण रखा गया है; ‘दाखमधु’ बाइबलीय संदर्भ में परिचित और गरिमापूर्ण शब्द है। संभावित अर्थों को मुख्य पाठ में जबरन नहीं सुलझाया गया, बल्कि आवश्यक विकल्प पादटिप्पणियों में दिए गए हैं।
