- source_word: עֲבָרוֹ יָיִן
  choice: जिस पर दाखमधु ने काबू पा लिया हो
  rationale: עבר और ‘दाखमधु’ का प्रयोग यहाँ मदिरा से अभिभूत या वशीभूत हो जाने का भाव देता है।
- source_word: מִפְּנֵי יְהוָה
  choice: याहवे के कारण
  rationale: संदर्भ में מִפְּנֵי वक्ता की अभिभूत दशा का कारण बताता है; स्थानसूचक ‘याहवे के सामने’ भी व्याकरणतः संभव है और पादटिप्पणी में दिया गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिंदी लिप्यंतरण में प्रस्तुत किया गया है।
