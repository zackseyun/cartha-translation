base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/009.yaml
  text: 'Concerning the prophets: my heart is broken within me[a]; all my bones tremble. I have become like a drunken man, like a strong man overcome by wine[c][b], because of Yahweh and because of his holy words.'
translation:
  language: hi
  text: 'नबियों के विषय में[a]: मेरा हृदय मेरे भीतर टूट गया है; मेरी सारी हड्डियाँ काँप रही हैं[b]। मैं मतवाले मनुष्य के समान हो गया हूँ, एक बलवान पुरुष के समान जिसे दाखमधु ने वश में कर लिया है—याहवे के कारण और उसके पवित्र वचनों के कारण[c]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘नबियों के विरुद्ध।’ इब्रानी पदबंध वाणी का विषय बता सकता है, अथवा संदर्भ के अनुसार विरोध का भाव दे सकता है।
    reason: alternative_reading
  - marker: b
    text: या ‘मेरी सारी हड्डियाँ थरथरा रही हैं।’
    reason: lexical_alternative
  - marker: c
    text: या ‘याहवे के सामने और उसके पवित्र वचनों के सामने।’ यहाँ मुख्य पाठ वक्ता की अभिभूत दशा का कारण व्यक्त करता है।
    reason: lexical_alternative
