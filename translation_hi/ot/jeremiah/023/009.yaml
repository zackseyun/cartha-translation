  choice: मेरी सारी हड्डियाँ काँप रही हैं
  rationale: רחף यहाँ शरीर के थरथराने या काँपने को दर्शाता है। वर्तमान हिंदी में यह स्पष्ट और स्वाभाविक है।
- source_word: הָיִיתִי כְּאִישׁ שִׁכּוֹר
