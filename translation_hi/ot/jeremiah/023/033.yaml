source:
  edition: WLC
  text: וְ/כִי יִשְׁאָלְ/ךָ֩ הָ/עָ֨ם הַ/זֶּ֜ה אֽוֹ הַ/נָּבִ֤יא אֽוֹ כֹהֵן֙ לֵ/אמֹ֔ר מַה מַשָּׂ֖א יְהוָ֑ה וְ/אָמַרְתָּ֤ אֲלֵי/הֶם֙ אֶת מַה מַשָּׂ֔א וְ/נָטַשְׁתִּ֥י אֶתְ/כֶ֖ם נְאֻם יְהוָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/033.yaml
  text: And when this people, or a prophet, or a priest asks you, saying, ‘What is the burden of the LORD?’ then you shall say to them, ‘You are the burden, and I will cast you off,’ declares the LORD.
translation:
  language: hi
  text: “जब यह प्रजा, या कोई भविष्यद्वक्ता, या कोई याजक तुमसे पूछे, ‘यहोवा का बोझ क्या है?’ तब तुम उनसे कहना, ‘कौन-सा बोझ?[a] मैं तुम्हें त्याग दूँगा,’ यहोवा की घोषणा है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू पाठ का सीधा अर्थ “कौन-सा बोझ?” है; कुछ प्राचीन अनुवादों और एक संभावित वैकल्पिक हिब्रू पठन के अनुसार, “तुम ही बोझ हो।”
    reason: कठिन हिब्रू वाक्यांश और उससे जुड़े प्राचीन पाठ-साक्ष्य की वास्तविक अस्पष्टता बताने के लिए।
lexical_decisions:
- source_word: מַשָּׂא
  choice: बोझ
  rationale: इस शब्द का अर्थ ‘बोझ’ और ‘ईश्वरीय संदेश/भविष्यवाणी’ दोनों हो सकता है। ‘बोझ’ रखने से पद में निहित जानबूझकर किया गया शब्द-खेल और आगे के संदर्भ का तनाव बना रहता है।
- source_word: וְנָטַשְׁתִּי אֶתְכֶם
  choice: मैं तुम्हें त्याग दूँगा
  rationale: נטשׁ का सीधा अर्थ छोड़ना या त्याग देना है; यह अनुवाद दैवी अस्वीकृति की कठोरता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: נְאֻם יְהוָה
  choice: यहोवा की घोषणा है
  rationale: नबी-साहित्य के औपचारिक दैवी उद्घोष-सूत्र को संक्षिप्त और गरिमापूर्ण हिन्दी में रखा गया है।
theological_decisions:
- issue: אֶת־מַה מַשָּׂא की पाठगत/व्याकरणिक कठिनाई
  choice: ‘कौन-सा बोझ?’ को मुख्य पाठ में रखा गया
  alternative: ‘तुम ही बोझ हो’
  rationale: दिए गए WLC व्यंजन-पाठ का निकटतम सीधा पठन ‘क्या/कौन-सा बोझ?’ है। ‘तुम ही बोझ हो’ प्राचीन अनुवाद-परंपरा और संभावित वैकल्पिक हिब्रू पठन को दर्शाता है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है; इस प्रकार वास्तविक पाठगत अस्पष्टता को चुपचाप हल नहीं किया गया।
- issue: מַשָּׂא का धार्मिक अर्थ
  choice: ‘बोझ’
  alternative: ‘संदेश’ या ‘भविष्यवाणी’
  rationale: सिर्फ ‘संदेश’ कहने से यहोवा के उत्तर में मौजूद कटाक्ष और शब्द-खेल मिट जाता; ‘बोझ’ प्रसंग में उसी तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सीधे संबोधन और गरिमापूर्ण नबी-साहित्यिक शैली का प्रयोग किया गया है। ‘यहोवा’ नाम को स्पष्ट रूप से रखा गया है और ‘बोझ’ की पुनरावृत्ति द्वारा मूल का शब्द-खेल सुरक्षित किया गया है।
