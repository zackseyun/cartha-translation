source:
  edition: WLC
  text: שָׁמַ֗עְתִּי אֵ֤ת אֲשֶׁר אָֽמְרוּ֙ הַ/נְּבִאִ֔ים הַֽ/נִּבְּאִ֥ים בִּ/שְׁמִ֛/י שֶׁ֖קֶר לֵ/אמֹ֑ר חָלַ֖מְתִּי חָלָֽמְתִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/025.yaml
  text: I have heard what the prophets have said[a], those who prophesy lies in my name, saying, ‘I have dreamed! I have dreamed!’
translation:
  language: hi
  text: मैंने उन भविष्यद्वक्ताओं की बातें सुनी हैं[a] जो मेरे नाम से झूठी भविष्यवाणी करते हैं और कहते हैं, ‘मैंने स्वप्न देखा है! मैंने स्वप्न देखा है!’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “...जो मेरे नाम से झूठ की भविष्यवाणी करते हैं।”
    reason: इब्रानी שֶׁקֶר को भविष्यवाणी की विषयवस्तु (‘झूठ’) अथवा उसके असत्य स्वरूप (‘झूठी’) के रूप में समझा जा सकता है।
lexical_decisions:
- source_word: שָׁמַעְתִּי
  choice: मैंने सुना है
  rationale: कालगत पूर्णता और वर्तमान प्रसंग में उसकी प्रासंगिकता—दोनों व्यक्त होती हैं; यह आधुनिक हिन्दी में स्वाभाविक है।
- source_word: אֵת אֲשֶׁר אָמְרוּ
  choice: कि ... क्या कहते हैं
  rationale: इब्रानी का आशय ‘वे जो कहते हैं, वह मैंने सुना है’ है। हिन्दी में ‘मैंने सुना है कि वे ... क्या कहते हैं’ वाक्य-विन्यास स्वाभाविक रहते हुए कथन की विषयवस्तु पर बल बनाए रखता है।
- source_word: הַנְּבִאִים
  choice: वे भविष्यद्वक्ता
  rationale: निश्चित बहुवचन संज्ञा को सन्दर्भ-सूचक ‘वे’ के साथ प्रस्तुत किया गया है।
- source_word: הַנִּבְּאִים
  choice: जो ... भविष्यवाणी करते हुए
  rationale: निफ़अल कृदन्त को भविष्यद्वक्ताओं का वर्णन करने वाले सम्बन्धवाचक पदबंध के रूप में रखा गया है।
- source_word: בִּשְׁמִי
  choice: मेरे नाम से
  rationale: यह परमेश्वर के अधिकार का दावा करके बोलने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שֶׁקֶר
  choice: झूठी
  rationale: यहाँ संज्ञा שֶׁקֶר भविष्यवाणी की असत्य प्रकृति या विषयवस्तु को बताती है। ‘झूठी भविष्यवाणी’ हिन्दी में स्पष्ट और सहज है; वैकल्पिक संरचना पादटिप्पणी में दी गई है।
- source_word: לֵאמֹר
  choice: कहते हैं
  rationale: उद्धरण आरम्भ कराने वाले इब्रानी रूप को हिन्दी के स्वाभाविक कथन-क्रिया रूप में व्यक्त किया गया है।
- source_word: חָלַמְתִּי חָלָמְתִּי
  choice: मैंने स्वप्न देखा है! मैंने स्वप्न देखा है!
  rationale: मूल की पुनरुक्ति और दावे की तीव्रता सुरक्षित रखी गई है; ‘स्वप्न’ गरिमापूर्ण किंतु सामान्यतः समझ में आने वाला शब्द है।
theological_decisions:
- issue: झूठे भविष्यद्वक्ताओं के दावे का स्वरूप
  choice: जो मेरे नाम से झूठी भविष्यवाणी करते हुए कहते हैं
  alternative: जो मेरे नाम से झूठ की भविष्यवाणी करते हुए कहते हैं
  rationale: שֶׁקֶר भविष्यवाणी की विषयवस्तु (‘झूठ’) या उसके असत्य स्वरूप (‘झूठी’) को व्यक्त कर सकता है। मुख्य पाठ में स्वाभाविक हिन्दी चुनी गई है और संज्ञात्मक विकल्प पादटिप्पणी में सुरक्षित रखा गया है; परमेश्वर के नाम से अधिकार का झूठा दावा स्पष्ट रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘भविष्यद्वक्ता’, ‘भविष्यवाणी’ और ‘स्वप्न’ प्रचलित बाइबलीय शब्दावली हैं। मूल की जोरदार पुनरुक्ति ज्यों की त्यों रखी गई है।
