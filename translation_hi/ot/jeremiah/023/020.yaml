  text: לֹ֤א יָשׁוּב֙ אַף יְהוָ֔ה עַד עֲשֹׂת֥/וֹ וְ/עַד הֲקִימ֖/וֹ מְזִמּ֣וֹת לִבּ֑/וֹ בְּ/אַֽחֲרִית֙ הַ/יָּמִ֔ים תִּתְבּ֥וֹנְנוּ בָ֖/הּ בִּינָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/020.yaml
  text: The anger of Yahweh will not turn back until he has done it[a], and until he has established the purposes of his heart[c][b]. In the latter days you will understand it clearly.
translation:
  language: hi
  text: याहवे का क्रोध तब तक वापस नहीं मुड़ेगा[a], जब तक वह इसे कर न ले और अपने मन के संकल्पों[b] को पूरा न कर दे। अन्तिम दिनों में[c] तुम इसे भली-भाँति समझोगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पीछे नहीं हटेगा’; इब्रानी में याहवे के क्रोध के तब तक वापस न मुड़ने का बिंब है, जब तक उसका उद्देश्य पूरा न हो जाए।
    reason: lexical_alternative
  - marker: b
    text: या ‘अपने मन की योजनाएँ’।
    reason: lexical_alternative
  - marker: c
    text: या ‘आनेवाले दिनों में’; इब्रानी का शाब्दिक भाव ‘दिनों के अन्त में’ है।
    reason: alternative_reading
lexical_decisions:
- source_word: אַף
  choice: क्रोध
  rationale: यहाँ यह शब्द शाब्दिक ‘नाक’ नहीं, बल्कि याहवे के न्यायपूर्ण रोष को व्यक्त करने वाला मुहावरा है। ‘क्रोध’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय उसका प्रचलित हिन्दी लिप्यंतरण रखा गया है।
- source_word: לֹא יָשׁוּב
  choice: नहीं लौटेगा
  rationale: שׁוּב के ‘लौटना/वापस मुड़ना’ बिंब को बनाए रखता है और यह नहीं जोड़ता कि याहवे अपना विचार बदलेंगे।
- source_word: עַד עֲשֹׂתוֹ
  choice: जब तक वह अपना काम पूरा न कर ले
  rationale: इब्रानी वाक्यांश अपेक्षाकृत व्यापक है। हिन्दी में ‘अपना काम पूरा करना’ उसके अभिप्रेत कार्य की पूर्णता को स्वाभाविक ढंग से व्यक्त करता है, बिना कार्य को अनावश्यक रूप से निश्चित किए।
- source_word: וְעַד הֲקִימוֹ
  choice: और ... पूरा न कर दे
  rationale: हिफ़ील रूप यहाँ मन के संकल्पों को दृढ़ प्रभाव में लाने या कार्यान्वित करने का भाव देता है। हिन्दी में ‘संकल्पों को पूरा करना’ इसी अर्थ को सहजता से व्यक्त करता है।
- source_word: מְזִמּוֹת לִבּוֹ
  choice: अपने मन के संकल्पों
  rationale: מְזִמּוֹת सोची-समझी योजनाओं या उद्देश्यों को दर्शाता है; ‘संकल्प’ नकारात्मक ‘षड्यंत्र’ का भाव जोड़े बिना दृढ़ अभिप्राय व्यक्त करता है। לֵב को हिन्दी मुहावरे के अनुसार ‘मन’ कहा गया है।
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: अन्तिम दिनों में
  rationale: यह अनुवाद भविष्यकालीन और सम्भावित युगान्तकारी दोनों अर्थों की भविष्यद्वाणी-संबंधी गूँज को बनाए रखता है।
- source_word: תִּתְבּוֹנְנוּ בָהּ בִּינָה
  choice: तुम इसे भली-भाँति समझोगे
  rationale: क्रिया और उसके साथ प्रयुक्त संज्ञा समझ-बूझ पर बल देती हैं; ‘भली-भाँति समझोगे’ उस बल को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: בְּאַחֲרִית הַיָּמִים का भविष्यद्वाणी-संबंधी कालार्थ
  choice: अन्तिम दिनों में
  alternative: आनेवाले दिनों में
  rationale: ‘अन्तिम दिनों में’ मूल पदबंध की युगान्तकारी सम्भावना को सुरक्षित रखता है, पर अपने आप कोई विशिष्ट अन्त-समय प्रणाली आरोपित नहीं करता। विकल्प को पाद-टिप्पणी में देकर सामान्य भविष्यकालीन अर्थ भी खुला रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘याहवे’ व्यक्तिगत नाम को सुरक्षित रखता है; ‘संकल्प’ और ‘भली-भाँति’ औपचारिकता तथा स्पष्टता के बीच संतुलन रखते हैं। सभी पाद-टिप्पणी चिह्न मुख्य पाठ में दिए गए हैं।
