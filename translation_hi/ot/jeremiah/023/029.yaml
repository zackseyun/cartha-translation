base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/029.yaml
  text: Is not my word like fire—oracle of Yahweh—and like a hammer that shatters rock?[a]
translation:
  language: hi
  text: क्या मेरा वचन आग के समान नहीं है—याहवे की वाणी है—और चट्टान को चकनाचूर कर देने वाले हथौड़े के समान नहीं है?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲלֹוא
  choice: क्या ... नहीं है
  rationale: यह अलंकारिक प्रश्न सकारात्मक उत्तर की अपेक्षा करता है; प्रश्नवाचक रूप इब्रानी की अभिव्यक्ति को सीधे बनाए रखता है।
- source_word: דְבָרִי
  choice: मेरा वचन
  rationale: एकवचन और परमेश्वर की कही हुई बात के समग्र भाव, दोनों को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: כָּאֵשׁ
  choice: आग के समान
  rationale: तुलना को स्पष्ट, सजीव और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की वाणी है
  rationale: भविष्यद्वाणी के सूत्र की मूल संज्ञात्मक प्रकृति को यथासंभव बनाए रखते हुए हिन्दी में एक पूर्ण और स्वाभाविक वाक्यांश देता है।
- source_word: וּכְפַטִּישׁ
  choice: और उस हथौड़े के समान
  rationale: संयोजक और दूसरी उपमा दोनों सुरक्षित हैं; ‘उस’ आगे आने वाले संबंधवाचक उपवाक्य से सहज रूप से जुड़ता है।
- source_word: יְפֹצֵץ
  choice: चकनाचूर कर देता है
  rationale: क्रिया में निहित हिंसक ढंग से टुकड़े-टुकड़े करने की तीव्रता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: סָלַע
  choice: चट्टान
  rationale: बड़े, कठोर शैलखंड की छवि के लिए ‘चट्टान’ सामान्य ‘पत्थर’ से अधिक सटीक है।
theological_decisions:
- issue: नְאֻם יְהוָה भविष्यद्वाणी-सूत्र का अनुवाद
  choice: यह याहवे की वाणी है
  alternative: याहवे घोषणा करता है
  rationale: मुख्य पाठ इब्रानी के संज्ञात्मक ‘वाणी/उक्ति’ रूप को बनाए रखता है और यְהוָה को व्यक्तिगत नाम ‘याहवे’ के रूप में प्रस्तुत करता है; वैकल्पिक क्रियात्मक अनुवाद पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सजीव रूप अपनाया गया है। अलंकारिक प्रश्न तथा आग और हथौड़े की समानांतर उपमाएँ सुरक्षित रखी गई हैं; भविष्यद्वाणी-सूत्र को डैशों के बीच रखकर मूल वाक्य में उसके अंतःक्षेप का प्रभाव बनाए रखा गया है।
