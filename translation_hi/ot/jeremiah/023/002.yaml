  edition: WLC
  text: לָ֠/כֵן כֹּֽה אָמַ֨ר יְהוָ֜ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל עַֽל הָ/רֹעִים֮ הָ/רֹעִ֣ים אֶת עַמִּ/י֒ אַתֶּ֞ם הֲפִצֹתֶ֤ם אֶת צֹאנִ/י֙ וַ/תַּדִּח֔וּ/ם וְ/לֹ֥א פְקַדְתֶּ֖ם אֹתָ֑/ם הִנְ/נִ֨י פֹקֵ֧ד עֲלֵי/כֶ֛ם אֶת רֹ֥עַ מַעַלְלֵי/כֶ֖ם נְאֻם יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/002.yaml
  text: 'Therefore this is what Yahweh[a], the God of Israel, says concerning the shepherds who shepherd my people: You have scattered my flock and driven them away, and you have not attended to them. Behold, I am about to attend to you for the evil of your deeds[b], declares Yahweh.'
translation:
  language: hi
  text: 'इसलिए याहवे, इस्राएल का परमेश्वर, उन चरवाहों के विषय में[a], जो मेरी प्रजा को चराते हैं, यह कहता है: “तुमने मेरे झुंड को तितर-बितर कर दिया, उन्हें दूर भगा दिया और उनकी सुधि नहीं ली। देखो, मैं तुम्हारे बुरे कामों के कारण तुम्हारी सुधि लेने वाला हूँ[b]।” यह याहवे की वाणी है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन चरवाहों के विरुद्ध”; यहाँ प्रयुक्त इब्रानी पूर्वसर्ग ऐसे वचन का परिचय दे सकता है जो उनके विरुद्ध निर्देशित हो।
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी में दोनों जगह एक ही क्रिया दोहराई गई है: “तुमने उनकी सुधि नहीं ली ... मैं तुम्हारी सुधि लेने वाला हूँ।” इससे उपेक्षा के बदले न्याय का जानबूझकर अर्थ-पलट बनता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को शीर्षक से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल का परमेश्वर
  rationale: इब्रानी संबंधवाचक रचना का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: עַל
  choice: के विषय में
  rationale: भविष्यद्वाणी की भूमिका में यह पूर्वसर्ग ‘के विषय में’ अथवा प्रतिकूल संदर्भ में ‘के विरुद्ध’ हो सकता है; मुख्य पाठ में व्यापक अर्थ रखा गया और वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: הָרֹעִים הָרֹעִים אֶת עַמִּי
  choice: उन चरवाहों ... जो मेरी प्रजा की चरवाही करते हैं
  rationale: चरवाहे की केंद्रीय उपमा और मूल की शब्द-पुनरावृत्ति दोनों को बनाए रखता है, बिना इसे सीधे ‘अगुवे’ या ‘शासक’ कहकर व्याख्यायित किए।
- source_word: הֲפִצֹתֶם אֶת צֹאנִי
  choice: तुमने मेरे झुंड को तितर-बितर कर दिया
  rationale: कारक क्रिया और सामूहिक झुंड की चरवाही-संबंधी छवि को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַתַּדִּחוּם
  choice: उन्हें दूर भगा दिया
  rationale: झुंड को बलपूर्वक दूर करने के कारक भाव को स्पष्ट रखता है।
- source_word: וְלֹא פְקַדְתֶּם אֹתָם ... הִנְנִי פֹקֵד עֲלֵיכֶם
  choice: उनकी सुधि नहीं ली ... तुम्हारी सुधि लेने वाला हूँ
  rationale: פקד की जानबूझकर की गई पुनरावृत्ति और देखभाल से दंडात्मक निरीक्षण की ओर उसके अर्थ-पलट को हिन्दी में यथासंभव सुरक्षित रखता है।
- source_word: אֶת רֹעַ מַעַלְלֵיכֶם
  choice: तुम्हारे बुरे कामों के कारण
  rationale: न्याय का आधार स्पष्ट करता है और हिन्दी में स्वाभाविक कारणवाचक रचना देता है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की वाणी है
  rationale: मानक भविष्यद्वाणी-सूत्र का गरिमापूर्ण हिन्दी रूप, जिसमें दिव्य नाम बना रहता है।
theological_decisions:
- issue: פקד की पुनरावृत्ति में उपेक्षा और न्याय का अर्थ-पलट
  choice: दोनों वाक्यांशों में ‘सुधि लेना’ रखा गया है और दूसरे को ‘बुरे कामों के कारण’ से दंडात्मक बनाया गया है।
  alternative: पहले ‘देखभाल करना’ और दूसरे में ‘दंड देना’ कहना।
  rationale: एक ही इब्रानी क्रिया का दोहरा प्रयोग चरवाहों की उपेक्षा को उन्हीं पर आने वाले परमेश्वर के न्याय से जोड़ता है; समान हिन्दी अभिव्यक्ति उस अलंकार और तनाव को बचाती है।
- issue: चरवाहों की उपमा का अर्थ
  choice: ‘चरवाहों’ और ‘चरवाही’ को प्रत्यक्ष रूप से बनाए रखा गया है।
  alternative: इसे ‘अगुवों’, ‘शासकों’ या ‘नेताओं’ के रूप में स्पष्ट करना।
  rationale: संदर्भ में मानव नेतृत्व अभिप्रेत है, पर मूल पाठ की चरवाहे और झुंड की छवि इस अनुच्छेद की संरचना तथा धर्मवैचारिक तनाव के लिए केंद्रीय है।
- issue: עַל का संबंधवाचक या विरोधात्मक भाव
  choice: मुख्य पाठ में ‘के विषय में’, पादटिप्पणी में ‘के विरुद्ध’।
  alternative: मुख्य पाठ में केवल ‘के विरुद्ध’।
  rationale: पूर्वसर्ग दोनों अर्थों की अनुमति देता है। आगे का न्याय-वचन विरोधात्मक दिशा स्पष्ट करता है, किंतु भूमिका की वास्तविक शाब्दिक अस्पष्टता बनाए रखना उचित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, किंतु सामान्य पाठक के लिए सुबोध रूप। ‘सुधि लेना’ थोड़ा औपचारिक है, पर वह देखभाल और दंडात्मक खोज-खबर—दोनों भावों को समेटते हुए मूल शब्दालंकार को बनाए रखता है।
