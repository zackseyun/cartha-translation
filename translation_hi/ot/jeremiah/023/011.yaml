source:
  edition: WLC
  text: כִּֽי גַם נָבִ֥יא גַם כֹּהֵ֖ן חָנֵ֑פוּ גַּם בְּ/בֵיתִ֛/י מָצָ֥אתִי רָעָתָ֖/ם נְאֻם יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/011.yaml
  text: For both prophet and priest are ungodly[a]; even in my house I have found their evil[b], declares Yahweh.
translation:
  language: hi
  text: क्योंकि भविष्यद्वक्ता और याजक दोनों अधर्मी हैं[a]; यहाँ तक कि मैंने अपने भवन में उनकी बुराई पाई है[b]—याहवे की यह वाणी है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘अपवित्र हैं,’ ‘भ्रष्ट हैं,’ या ‘कपटी हैं’ भी किया जा सकता है। हिब्रू क्रिया नैतिक और धार्मिक भ्रष्टता अथवा ईश्वर-विमुखता का भाव रखती है।
    reason: lexical_alternative
  - marker: b
    text: ‘मेरे भवन’ से आशय मंदिर है।
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद पिछले कथन के लिए कारण प्रस्तुत करता है; ‘क्योंकि’ इस व्याख्यात्मक संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: גַם ... גַם
  choice: दोनों ... और
  rationale: दोहराया गया גַם भविष्यद्वक्ता और याजक—दोनों वर्गों को आरोप में सम्मिलित करता है।
- source_word: נָבִיא
  choice: भविष्यद्वक्ता
  rationale: यह נָבִיא का प्रचलित और सन्दर्भानुकूल हिन्दी रूप है।
- source_word: כֹּהֵן
  choice: याजक
  rationale: यह כֹּהֵן का मानक हिन्दी अनुवाद है और मन्दिर-सन्दर्भ के अनुकूल है।
- source_word: חָנֵפוּ
  choice: अधर्मी हो गए हैं
  rationale: यह क्रिया नैतिक और धार्मिक भ्रष्टता अथवा ईश्वर-विमुखता का बोध कराती है। ‘अधर्मी’ सामान्य पाठक के लिए स्पष्ट है और इसे केवल कपट तक सीमित नहीं करता।
- source_word: גַּם
  choice: यहाँ तक कि ... भी
  rationale: 'तीसरा גַם आरोप को तीव्र करता है: उनकी बुराई याहवे के अपने भवन में भी पाई गई।'
- source_word: בְּבֵיתִי
  choice: अपने भवन में
  rationale: हिब्रू का शाब्दिक अर्थ ‘मेरे घर/भवन में’ है। हिन्दी में वक्ता की ओर संकेत स्पष्ट रखने के लिए ‘अपने भवन’ स्वाभाविक है; यहाँ आशय मन्दिर से है।
- source_word: מָצָאתִי
  choice: मैंने ... पाई है
  rationale: हिब्रू पूर्ण क्रिया को ऐसी भूतकालीन खोज के रूप में व्यक्त किया गया है जिसकी वर्तमान प्रासंगिकता बनी हुई है।
- source_word: רָעָתָם
  choice: उनकी बुराई
  rationale: यह רָעָה के नैतिक अर्थ को निकटता से और बिना अनावश्यक विस्तार के व्यक्त करता है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की वाणी है
  rationale: यह गम्भीर भविष्यसूचक सूत्र को स्वाभाविक, प्रतिष्ठित हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में आए परमेश्वर के विशिष्ट नाम को उपाधि से बदलने के बजाय लिप्यन्तरित किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुरक्षरीय विशिष्ट नाम सीधे प्रयुक्त हुआ है; ‘याहवे’ उसे नाम के रूप में सुरक्षित रखता है, जबकि ‘प्रभु’ उसे उपाधि में बदल देता।
- issue: חָנֵפוּ में धार्मिक-नैतिक भ्रष्टता का स्वर
  choice: अधर्मी हो गए हैं
  alternative: अपवित्र हो गए हैं; भ्रष्ट हो गए हैं; कपटी हैं
  rationale: शब्द ईश्वर-विमुख नैतिक और धार्मिक भ्रष्टता को समेटता है। ‘कपटी’ अर्थ को केवल ढोंग तक सीमित कर सकता है, जबकि ‘अधर्मी’ व्यापक तनाव को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। भविष्यसूचक सूत्र के लिए ‘यह याहवे की वाणी है’ अपनाया गया है। ‘अपने भवन’ हिन्दी में वक्ता याहवे के भवन का सम्बन्ध स्वाभाविक रूप से स्पष्ट करता है, और पादटिप्पणी मन्दिर-सन्दर्भ बताती है।
