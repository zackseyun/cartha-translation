id: JER.23.26
reference: Jeremiah 23:26
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: עַד מָתַ֗י הֲ/יֵ֛שׁ בְּ/לֵ֥ב הַ/נְּבִאִ֖ים נִבְּאֵ֣י הַ/שָּׁ֑קֶר וּ/נְבִיאֵ֖י תַּרְמִ֥ת לִבָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/026.yaml
  text: How long will this be in the heart of the prophets who prophesy falsehood[b][a], and who prophesy the deceit of their own heart?
translation:
  language: hi
  text: कब तक यह उन भविष्यद्वक्ताओं के मन में रहेगा[a], जो झूठ की भविष्यवाणी करते हैं[b] और अपने ही मन के छल की भविष्यवाणी करते हैं?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “क्या भविष्यद्वक्ताओं के मन में है...?” इब्रानी वाक्य संक्षिप्त और कुछ अस्पष्ट है; मुख्य पाठ में प्रसंग से निहित अर्थ स्पष्ट किया गया है।'
    reason: मूल इब्रानी की दीर्घवृत्तीय प्रश्न-रचना और उसके वैकल्पिक शाब्दिक रूप को सुरक्षित रखना।
  - marker: b
    text: “जो झूठ की भविष्यवाणी करते हैं” का संक्षिप्त अनुवाद “झूठे भविष्यद्वक्ता” भी हो सकता है।
    reason: क्रियात्मक मूल अभिव्यक्ति का प्रचलित संक्षिप्त विकल्प बताना।
lexical_decisions:
- source_word: עַד מָתַי
  choice: कब तक
  rationale: यह स्वाभाविक हिन्दी कालवाचक प्रश्न है और परमेश्वर की धीरजपूर्ण झुँझलाहट को व्यक्त करता है।
- source_word: הֲיֵשׁ
  choice: यह ... रहेगा
  rationale: इब्रानी में प्रश्नवाचक अस्तित्वसूचक पद है और वाक्य अपूर्ण या संक्षिप्त है। प्रसंग से निहित बात को हिन्दी में स्पष्ट करने के लिए ‘यह ... रहेगा’ रखा गया है, जबकि शाब्दिक संरचना पादटिप्पणी में दी गई है।
- source_word: בְּלֵב
  choice: मन में
  rationale: यहाँ לֵב विचार, अभिप्राय और इच्छा के आंतरिक केंद्र को सूचित करता है। आधुनिक हिन्दी में ‘मन’ इस अर्थ को ‘हृदय’ की अपेक्षा अधिक स्वाभाविक ढंग से पहुँचाता है।
- source_word: הַנְּבִאִים
  choice: भविष्यद्वक्ताओं
  rationale: बहुवचन संज्ञा का सीधा और प्रचलित हिन्दी रूप।
- source_word: נִבְּאֵי הַשָּׁקֶר
  choice: जो झूठ की भविष्यवाणी करते हैं
  rationale: यह अनुवाद केवल ‘झूठे भविष्यद्वक्ता’ कहने के बजाय इब्रानी की क्रियात्मक शक्ति और उनकी भविष्यवाणी की झूठी विषयवस्तु दोनों को बनाए रखता है।
- source_word: וּנְבִיאֵי תַּרְמִת
  choice: और ... छल की भविष्यवाणी करते हैं
  rationale: समानांतर रचना को हिन्दी में क्रियात्मक रूप देकर आरोप को स्पष्ट और प्रवाहपूर्ण रखा गया है।
- source_word: לִבָּם
  choice: अपने ही मन के
  rationale: सर्वनामिक प्रत्यय को स्पष्ट रखा गया है; ‘अपने ही’ यह दिखाता है कि छल उन्हीं के भीतर से उत्पन्न है।
theological_decisions:
- issue: לֵב का मानवशास्त्रीय अर्थ
  choice: मन
  alternative: हृदय; अंतर्मन
  rationale: इब्रानी पद भावना तक सीमित नहीं, बल्कि विचार, इच्छा और अभिप्राय को भी समेटता है। वर्तमान हिन्दी में ‘मन’ इस व्यापक आंतरिक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- issue: נִבְּאֵי הַשָּׁקֶר को संक्षिप्त पदवी मानना या क्रियात्मक आरोप
  choice: जो झूठ की भविष्यवाणी करते हैं
  alternative: झूठे भविष्यद्वक्ता
  rationale: मूल पाठ उनके वर्गीकरण से अधिक उनके कार्य और संदेश की झूठी प्रकृति पर बल देता है; इसलिए क्रियात्मक रूप सुरक्षित रखा गया है।
- issue: הֲיֵשׁ की अपूर्ण प्रश्नात्मक रचना
  choice: प्रसंगानुसार निहित अर्थ को मुख्य पाठ में स्पष्ट करना
  alternative: 'अधिक शाब्दिक: ‘क्या ... के मन में है?’'
  rationale: इब्रानी की वास्तविक संक्षिप्तता को पादटिप्पणी में सुरक्षित रखते हुए मुख्य हिन्दी वाक्य को बोधगम्य बनाया गया है; प्रश्न के आशय को अंतिम रूप से संकीर्ण नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘भविष्यद्वक्ता’ बाइबलीय हिन्दी का परिचित पद है। दोहराव मूल इब्रानी के समानांतर आरोप को बनाए रखने के लिए जानबूझकर रखा गया है।
