source:
  edition: WLC
  text: הַ/נָּבִ֞יא אֲשֶׁר אִתּ֤/וֹ חֲלוֹם֙ יְסַפֵּ֣ר חֲל֔וֹם וַ/אֲשֶׁ֤ר דְּבָרִ/י֙ אִתּ֔/וֹ יְדַבֵּ֥ר דְּבָרִ֖/י אֱמֶ֑ת מַה לַ/תֶּ֥בֶן אֶת הַ/בָּ֖ר נְאֻם יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/028.yaml
  text: Let the prophet who has a dream tell the dream[a], but let the one who has my word speak my word truthfully[b]. What is straw to grain? declares Yahweh.
translation:
  language: hi
  text: “जिस नबी के पास स्वप्न हो, वह अपना स्वप्न सुनाए; पर जिसके पास मेरा वचन हो, वह मेरा वचन सच्चाई से बोले।[a] भूसे का अनाज से क्या संबंध है?[b]” यह याहवे की वाणी है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरा वचन सत्य के साथ बोले,” अथवा “मेरा सच्चा वचन बोले।” इब्रानी में बल बोलने के सच्चे ढंग पर भी हो सकता है और स्वयं वचन की सत्यता पर भी।
    reason: lexical_alternative
  - marker: b
    text: या, “भूसे और अनाज में क्या समानता है?”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנָּבִיא אֲשֶׁר אִתּוֹ חֲלוֹם
  choice: जिस नबी के पास स्वप्न हो
  rationale: निश्चित उपपद सहित ‘नबी’ यहाँ वर्ग-सूचक रूप में है। ‘जिसके पास स्वप्न हो’ इब्रानी स्वामित्व-सूचक मुहावरे का स्वाभाविक हिन्दी रूप है और स्वप्न को उससे अधिक विशिष्ट प्रकाशन नहीं बनाता।
- source_word: יְסַפֵּר חֲלוֹם
  choice: वह अपना स्वप्न सुनाए
  rationale: पिएल रूप יְסַפֵּר का अर्थ यहाँ ‘वर्णन करना/सुनाना’ है। हिन्दी में ‘स्वप्न सुनाए’ सहज है; ‘अपना’ संदर्भित स्वप्न को स्पष्ट करता है।
- source_word: וַאֲשֶׁר דְּבָרִי אִתּוֹ
  choice: पर जिसके पास मेरा वचन हो
  rationale: विस्तृत प्रसंग में स्वप्न के दावों और याहवे के वचन के बीच विरोध है, इसलिए संयोजक को ‘पर’ से व्यक्त किया गया है।
- source_word: יְדַבֵּר דְּבָרִי אֱמֶת
  choice: वह मेरा वचन सच्चाई से सुनाए
  rationale: אֱמֶת को क्रिया-विशेषण की तरह लेकर बोलने की सच्ची और निष्ठापूर्ण रीति व्यक्त की गई है। इब्रानी में यह ‘सच्चा वचन’ को विशेषित भी कर सकता है, इसलिए विकल्प पादटिप्पणी में रखा गया है।
- source_word: מַה לַתֶּבֶן אֶת הַבָּר
  choice: भूसे का अनाज से क्या संबंध?
  rationale: תֶּבֶן ‘भूसा’ और בָּר सामान्यतः ‘अनाज/शुद्ध अनाज’ है। प्रश्न दोनों के तीखे अंतर को बिना ‘गेहूँ’ या ‘भूसी’ जैसी अतिरिक्त विशिष्टता जोड़े सुरक्षित रखता है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की वाणी है
  rationale: यह गंभीर भविष्यद्वक्ताई उद्घोषणा का स्वाभाविक हिन्दी रूप है और परमेश्वर के नाम को ‘याहवे’ के रूप में प्रस्तुत करता है।
theological_decisions:
- issue: झूठे स्वप्न-दावों और याहवे के प्रामाणिक वचन के बीच विरोध
  choice: दोनों खंडों को आज्ञार्थक ढंग से रखते हुए ‘पर’ द्वारा स्पष्ट विरोध व्यक्त किया गया है।
  alternative: दोनों खंडों को केवल ‘और’ से जोड़कर अपेक्षाकृत तटस्थ समानांतर कथन बनाना।
  rationale: आसपास का प्रसंग छलपूर्ण स्वप्नों को याहवे के वचन के सामने रखता है, और भूसे तथा अनाज का रूपक इस विरोध को पुष्ट करता है।
- issue: אֱמֶת का व्याकरणिक संबंध
  choice: इसे क्रिया-विशेषणात्मक मानकर ‘सच्चाई से सुनाए’ किया गया है।
  alternative: इसे ‘वचन’ का विशेषण मानकर ‘मेरा सच्चा वचन सुनाए’ करना।
  rationale: दोनों अर्थ इब्रानी से संभव हैं; मुख्य पाठ में स्वाभाविक हिन्दी चुनी गई है और वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण भविष्यद्वक्ताई शैली रखी गई है। ‘स्वप्न’, ‘वचन’, ‘भूसा’ और ‘अनाज’ सामान्य पाठक के लिए बोधगम्य हैं। उद्धरण-चिह्न याहवे के प्रत्यक्ष कथन को समापन सूत्र से अलग करते हैं।
