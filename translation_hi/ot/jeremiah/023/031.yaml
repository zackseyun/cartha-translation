source:
  edition: WLC
  text: הִנְ/נִ֥י עַל הַ/נְּבִיאִ֖ם נְאֻם יְהוָ֑ה הַ/לֹּקְחִ֣ים לְשׁוֹנָ֔/ם וַֽ/יִּנְאֲמ֖וּ נְאֻֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/031.yaml
  text: Behold[a], I am against the prophets, declares Yahweh, who take their own tongues and declare, ‘Declaration!’
translation:
  language: hi
  text: “देखो, मैं उन नबियों के विरुद्ध हूँ—याहवे की यह घोषणा है—जो अपनी जीभ चलाकर कहते हैं, ‘घोषणा!’[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, “जो अपनी जीभ का उपयोग करके कहते हैं, ‘वाणी!’” इब्रानी वाक्य बहुत संक्षिप्त और संभवतः व्यंग्यात्मक है: ये नबी अपने ही मुँह की बात को अधिकारपूर्ण ईश्वरीय घोषणा जैसा प्रस्तुत करते हैं।'
    reason: לקח (‘लेना/इस्तेमाल करना’) और נְאֻם (‘घोषणा/वाणी’) के असामान्य, संक्षिप्त प्रयोग के वैकल्पिक अनुवाद और निहित व्यंग्य को बताना।
lexical_decisions:
- source_word: הִנְנִי
  choice: देखो, मैं
  rationale: यह पद एक गंभीर और बलयुक्त ईश्वरीय घोषणा आरम्भ करता है; ‘देखो’ आधुनिक हिन्दी में ध्यान आकर्षित करते हुए मूल का भविष्यसूचक बल बनाए रखता है।
- source_word: עַל
  choice: के विरुद्ध
  rationale: ‘मैं अमुक के विरुद्ध हूँ’ वाले प्रयोग में यह न्याय और विरोध प्रकट करता है, स्थान-संबंध नहीं।
- source_word: הַנְּבִיאִם
  choice: उन नबियों
  rationale: मूल में केवल ‘नबियों’ कहा गया है; प्रसंग के आधार पर मुख्य पाठ में ‘झूठे’ जोड़ना अनावश्यक व्याख्या होती। हिन्दी में निर्दिष्ट समूह को स्वाभाविक बनाने के लिए ‘उन’ रखा गया है।
- source_word: נְאֻם יְהוָה
  choice: याहवे की यह घोषणा है
  rationale: यह मानक भविष्यसूचक सूत्र है। यह रूप अधिकारपूर्ण कथन को व्यक्त करता और इसी पद में נְאֻם की पुनरावृत्ति को सुनाई देने देता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के विशिष्ट वाचा-नाम को उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत किया गया है।
- source_word: הַלֹּקְחִים לְשׁוֹנָם
  choice: जो अपनी जीभ चलाकर
  rationale: शब्दशः ‘जो अपनी जीभ लेते हैं’ हिन्दी में अर्थहीन लगेगा। ‘अपनी जीभ चलाकर’ उनके अपने मुँह से अधिकारपूर्ण वाणी बनाने की क्रिया को स्वाभाविक हिन्दी में रखता है, पर ‘गढ़ते हैं’ जैसी अधिक स्पष्ट व्याख्या मुख्य पाठ में नहीं जोड़ता।
- source_word: וַיִּנְאֲמוּ נְאֻם
  choice: कहते हैं, ‘घोषणा!’
  rationale: एक ही मूल से बने क्रिया और संज्ञा के तीखे, संभवतः व्यंग्यात्मक प्रयोग को संक्षिप्त उद्धरण द्वारा रखा गया है। हिन्दी में उसी धातु को दोहराना अस्वाभाविक होता, इसलिए क्रिया के लिए ‘कहते हैं’ और संज्ञा के लिए ‘घोषणा’ चुना गया।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ यहाँ चतुरक्षरीय विशिष्ट नाम का प्रयोग करता है; ‘याहवे’ उसे एक निजी वाचा-नाम के रूप में सुरक्षित रखता है।
- issue: नबियों को स्पष्टतः ‘झूठे नबी’ कहना या न कहना
  choice: उन नबियों
  alternative: उन झूठे नबियों
  rationale: व्यापक प्रसंग उनकी झूठी भविष्यवाणी स्पष्ट करता है, पर इस पद में विशेषण ‘झूठे’ नहीं है; इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
- issue: अंतिम נְאֻם को पूर्ण ईश्वरीय सूत्र बनाना
  choice: ‘घोषणा!’
  alternative: ‘याहवे की घोषणा है!’
  rationale: मसोरेटिक पाठ में अंत में केवल संक्षिप्त संज्ञा נְאֻם है। पूर्ण सूत्र जोड़ना व्यंग्य को स्पष्ट कर सकता है, पर मूल की असामान्य संक्षिप्तता को मिटा देगा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और बोलचाल में बोधगम्य रखी गई है। डैश ईश्वरीय घोषणा-सूत्र को मुख्य आरोप से अलग करते हैं। अंतिम ‘घोषणा!’ की जानबूझकर असामान्य संक्षिप्तता मूल के तनाव और व्यंग्य को सुरक्षित रखती है।
