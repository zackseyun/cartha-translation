reference: Jeremiah 23:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֤י מְנָֽאֲפִים֙ מָלְאָ֣ה הָ/אָ֔רֶץ כִּֽי מִ/פְּנֵ֤י אָלָה֙ אָבְלָ֣ה הָ/אָ֔רֶץ יָבְשׁ֖וּ נְא֣וֹת מִדְבָּ֑ר וַ/תְּהִ֤י מְרֽוּצָתָ/ם֙ רָעָ֔ה וּ/גְבוּרָתָ֖/ם לֹא כֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/010.yaml
  text: For the land is full of adulterers[a]; because of the curse the land mourns, and the pastures of the wilderness are dried up. Their course is evil[c][b], and their might is not right.
translation:
  language: hi
  text: क्योंकि देश व्यभिचारियों से भर गया है। शाप के कारण[a] देश शोक मना रहा है, और निर्जन प्रदेश की चरागाहें सूख गई हैं। उनका चाल-चलन[b] बुरा है, और उनका बल उचित नहीं है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शपथ के कारण”; इब्रानी शब्द शपथ, विशेषकर शाप का आह्वान करने वाली शपथ, को भी दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ “उनकी दौड़”; यहाँ आशय उनके जीवन की दिशा या आचरण से हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी कथन संक्षिप्त है; इसे “उनका बल ठीक नहीं है,” “उनका पराक्रम उचित नहीं है,” या अधिक शाब्दिक रूप में “उनका बल ऐसा नहीं है” भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מְנָאֲפִים
  choice: व्यभिचारियों
  rationale: इब्रानी कृदंत बहुवचन ऐसे लोगों को दर्शाता है जिनकी पहचान व्यभिचार से होती है। यह शाब्दिक नैतिक अर्थ को बनाए रखता है और वाचा-विषयक व्यापक संकेत को पाठक पर छोड़ता है।
- source_word: מָלְאָה הָאָרֶץ
  choice: देश ... से भर गया है
  rationale: यिर्मयाह के यहूदा-केंद्रित संदर्भ में אֶרֶץ के लिए ‘देश’ स्वाभाविक है; पूर्ण अवस्था को आधुनिक हिन्दी में ‘भर गया है’ स्पष्ट करता है।
- source_word: מִפְּנֵי אָלָה
  choice: शाप के कारण
  rationale: אָלָה शपथ, विशेषतः शापयुक्त शपथ, अथवा स्वयं शाप को सूचित कर सकता है। देश के शोक और सूखे के संदर्भ में ‘शाप’ उपयुक्त है; वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: אָבְלָה
  choice: शोक मना रहा है
  rationale: भूमि के मानवीकरण को बनाए रखते हुए אבל के ‘शोक करना’ अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יָבְשׁוּ
  choice: सूख गई हैं
  rationale: क्रिया से उत्पन्न वर्तमान दशा व्यक्त होती है; हिन्दी पूर्ण रूप परिणाम को सहजता से बताता है।
- source_word: נְאוֹת מִדְבָּר
  choice: निर्जन प्रदेश की चरागाहें
  rationale: נְאוֹת चरने की जगहों या चरागाहों को और מִדְבָּר निर्जन, कम आबाद वन्य क्षेत्र को दर्शाता है; ‘रेगिस्तान’ अनावश्यक रूप से केवल बालू वाले भूभाग का संकेत दे सकता है।
- source_word: מְרוּצָתָם
  choice: उनका चाल-चलन
  rationale: मूल शब्द का शाब्दिक संबंध दौड़ या गति से है, पर यहाँ यह आचरण की दिशा या जीवन-पथ का रूपक है। ‘चाल-चलन’ सामान्य आधुनिक हिन्दी में नैतिक आचरण स्पष्ट करता है।
- source_word: רָעָה
  choice: बुरा
  rationale: यह उनके आचरण का नैतिक मूल्यांकन करता है; ‘बुरा’ स्पष्ट और स्वाभाविक है।
- source_word: גְבוּרָתָם
  choice: उनका बल
  rationale: גְבוּרָה शक्ति, सामर्थ्य या पराक्रम को दर्शाता है; ‘बल’ संक्षिप्त और प्रसंगानुकूल है।
- source_word: לֹא כֵן
  choice: सही काम में नहीं लगता
  rationale: इब्रानी वाक्यांश अत्यंत संक्षिप्त और अपूर्णार्थक है। यह अनुवाद नैतिक अनुपयुक्तता को सहज हिन्दी में व्यक्त करता है, जबकि अधिक शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: क्या ‘व्यभिचारियों’ को शाब्दिक रखा जाए या वाचा के प्रति विश्वासघात के रूप में स्पष्ट किया जाए
  choice: मुख्य पाठ में ‘व्यभिचारियों’
  alternative: ‘विश्वासघाती लोगों’
  rationale: मूल शब्द सीधे व्यभिचार करने वालों को दर्शाता है। यहाँ रूपक को स्पष्ट रूप से चिह्नित नहीं किया गया, इसलिए शाब्दिक अर्थ रखा गया है और व्यापक भविष्यद्वक्तीय अनुगूँज को अनिर्णीत छोड़ा गया है।
- issue: इस प्रसंग में אָלָה का अर्थ
  choice: ‘शाप’
  alternative: ‘शपथ’ या ‘शापयुक्त शपथ’
  rationale: देश के शोक और चरागाहों के सूखने से न्यायस्वरूप शाप का अर्थ अधिक संगत है, पर वास्तविक शब्दगत अस्पष्टता पादटिप्पणी में संरक्षित है।
- issue: לֹא כֵן की संक्षिप्त नैतिक अभिव्यक्ति
  choice: ‘उनका बल सही काम में नहीं लगता’
  alternative: ‘उनका बल ठीक नहीं है’ या ‘उनका पराक्रम ऐसा नहीं है’
  rationale: मूल कथन में अपेक्षित मानदंड स्पष्ट नहीं किया गया है। मुख्य पाठ अर्थ को पठनीय बनाता है, पर पादटिप्पणी अधिक शाब्दिक संभावनाएँ देती है और तनाव को पूरी तरह समाप्त नहीं करती।
