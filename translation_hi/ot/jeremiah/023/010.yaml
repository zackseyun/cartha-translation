  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज स्तर अपनाया गया है। ‘देश’, ‘चरागाहें’ और ‘चाल-चलन’ सामान्य पाठक के लिए स्पष्ट हैं। मुख्य पाठ में मानवीकरण और नैतिक तीखापन सुरक्षित रखा गया है; वास्तविक शब्दगत अस्पष्टताएँ पादटिप्पणियों में दी गई हैं।
