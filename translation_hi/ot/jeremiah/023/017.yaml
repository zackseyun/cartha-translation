source:
  edition: WLC
  text: אֹמְרִ֤ים אָמוֹר֙ לִֽ/מְנַאֲצַ֔/י דִּבֶּ֣ר יְהוָ֔ה שָׁל֖וֹם יִֽהְיֶ֣ה לָ/כֶ֑ם וְ֠/כֹל הֹלֵ֞ךְ בִּ/שְׁרִר֤וּת לִבּ/וֹ֙ אָֽמְר֔וּ לֹֽא תָב֥וֹא עֲלֵי/כֶ֖ם רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/017.yaml
  text: 'They keep saying to those who despise me[a], ‘Yahweh has spoken: You will have peace’; and to everyone who walks in the stubbornness of his own heart they say[c][b], ‘No disaster will come upon you.’'
translation:
  language: hi
  text: 'वे मेरा तिरस्कार करनेवालों से बार-बार कहते हैं, ‘याहवे ने कहा है: तुम्हारा कल्याण होगा[a]’; और अपने ही मन की हठ पर चलनेवाले हर व्यक्ति से वे कहते हैं, ‘तुम पर कोई विपत्ति नहीं आएगी[b]।’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘कल्याण’ का अर्थ यहाँ शांति, कुशल या सुरक्षित भलाई भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘कोई बुराई’; यहाँ इसका अर्थ नैतिक बुराई नहीं, बल्कि विपत्ति या आपदा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹמְרִים אָמוֹר
  choice: बार-बार कहते हैं
  rationale: कृदन्त के साथ infinitive absolute कथन की निरंतर और जोरदार पुनरावृत्ति व्यक्त करता है; यह हिंदी प्रयोग उस iterative बल को स्वाभाविक ढंग से रखता है।
- source_word: לִמְנַאֲצַי
  choice: मेरा तिरस्कार करनेवालों से
  rationale: נאץ का कृदन्त प्रथम पुरुष एकवचन प्रत्यय के साथ उन लोगों को सूचित करता है जो वक्ता को तुच्छ जानते या ठुकराते हैं। ‘मेरा’ मूल की संदर्भगत अस्पष्टता को बनाए रखता है।
- source_word: דִּבֶּר יְהוָה
  choice: याहवे ने कहा है
  rationale: पूर्ण क्रिया झूठे भविष्यद्वक्ताओं द्वारा दैवी अधिकार के दावे को व्यक्त करती है; हिंदी में पूर्ण वर्तमान इस घोषणात्मक बल को स्वाभाविक रूप देता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चतुरक्षरीय परमेश्वर-नाम को उपाधि से बदलने के बजाय देवनागरी में उसके प्रचलित लिप्यंतरण द्वारा प्रस्तुत किया गया है।
- source_word: שָׁלוֹם
  choice: कल्याण
  rationale: यहाँ שָׁלוֹם केवल संघर्ष का अभाव नहीं, बल्कि कुशल, सुरक्षा और भलाई का आश्वासन देता है; ‘कल्याण’ इस व्यापक अर्थ को संदर्भ में अधिक स्पष्ट रखता है।
- source_word: וְכֹל הֹלֵךְ
  choice: और ... चलनेवाले हर व्यक्ति से
  rationale: यह सामान्य वर्ग को दर्शाता है और ‘चलना’ वाली नैतिक जीवन-पद्धति की रूपक-भाषा को सुरक्षित रखता है।
- source_word: בִּשְׁרִרוּת לִבּוֹ
  choice: अपने ही मन की हठ पर
  rationale: שְׁרִרוּת हठ या दुराग्रह है। ‘अपने ही’ आत्म-निर्देशित जिद को उभारता है, और ‘मन’ आधुनिक हिंदी में לֵב के इच्छा-विचार केंद्र को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לֹא תָבוֹא עֲלֵיכֶם רָעָה
  choice: तुम पर कोई विपत्ति नहीं आएगी
  rationale: न्याय-संबंधी भविष्यवाणी में רָעָה का आशय नैतिक बुराई नहीं, आनेवाली आपदा या विपत्ति है; वाक्य-विन्यास ‘तुम पर ... आएगी’ मूल मुहावरे को भी रखता है।
theological_decisions:
- issue: ‘मेरा तिरस्कार करनेवालों’ में प्रथम पुरुष का संदर्भ
  choice: अनुवाद में केवल ‘मेरा’ रखकर वचन की प्रत्यक्ष वक्तृता और मूल रूप को सुरक्षित रखा गया; संदर्भ में इसका सबसे स्वाभाविक संकेत याहवे की ओर है।
  alternative: ‘मेरा’ को यिर्मयाह का संदर्भ मानना।
  rationale: निकटवर्ती प्रसंग याहवे के वचन को अस्वीकार करने और झूठे भविष्यद्वक्ताओं के ‘याहवे ने कहा है’ दावे पर केंद्रित है। फिर भी नाम जोड़कर मूल से अधिक स्पष्टता नहीं थोपी गई।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘करनेवालों’ और ‘चलनेवाले’ जैसे संयुक्त रूप वर्तमान मानक हिंदी वर्तनी के अनुरूप हैं। समानांतर कथन-संरचना तथा ‘चलना’ की नैतिक रूपक-छवि सुरक्षित रखी गई है।
