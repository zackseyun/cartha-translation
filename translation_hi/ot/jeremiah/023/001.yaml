source:
  edition: WLC
  text: ה֣וֹי רֹעִ֗ים מְאַבְּדִ֧ים וּ/מְפִצִ֛ים אֶת צֹ֥אן מַרְעִיתִ֖/י נְאֻם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/001.yaml
  text: Woe to the shepherds who are destroying and scattering the sheep of my pasture[a], declares Yahweh.
translation:
  language: hi
  text: “उन चरवाहों पर हाय, जो मेरी चरागाह की भेड़ों[a] को नष्ट कर रहे हैं और तितर-बितर कर रहे हैं!” यहोवा की यह वाणी है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरी चरागाह का झुंड।”
    reason: צֹאן का अर्थ सामूहिक रूप से ‘झुंड’ भी हो सकता है; यह विकल्प इब्रानी की सामूहिक संज्ञा को अधिक प्रत्यक्ष रूप से दर्शाता है।
lexical_decisions:
- source_word: הוֹי
  choice: हाय ... पर
  rationale: यह पद न्याय की भविष्यवाणी और शोक—दोनों का स्वर रखता है; हिन्दी में ‘हाय उन ... पर’ इस निंदात्मक भविष्यवाणी की शक्ति को स्वाभाविक रूप से व्यक्त करता है।
- source_word: רֹעִים
  choice: चरवाहों
  rationale: मूल पाठ का प्रत्यक्ष चरवाही-रूपक सुरक्षित रखा गया है; संदर्भ में यह शासकों या अगुओं की ओर संकेत करता है, पर मुख्य पाठ में उसका अर्थ खोलकर रूपक को हटाया नहीं गया।
- source_word: מְאַבְּדִים
  choice: नष्ट कर रहे
  rationale: हिफ़ील कृदंत चल रही, विनाशकारी क्रिया बताता है; ‘नष्ट कर रहे’ उसकी कारक और कालगत शक्ति को व्यक्त करता है।
- source_word: וּמְפִצִים
  choice: और तितर-बितर कर रहे
  rationale: दूसरा कृदंत पहले के समानांतर निरंतर क्रिया व्यक्त करता है; ‘तितर-बितर’ झुंड को अलग-अलग कर देने का सजीव अर्थ रखता है।
- source_word: אֶת צֹאן
  choice: भेड़ों
  rationale: צֹאן झुंड या छोटे पालतू पशुओं को सूचित कर सकता है; चरवाहों और चरागाह के संदर्भ में ‘भेड़ों’ से ठोस रूपक स्पष्ट और स्वाभाविक रहता है।
- source_word: מַרְעִיתִי
  choice: मेरी चरागाह की
  rationale: מַרְעִית का मूल अर्थ चरागाह या चराई का स्थान है और प्रत्यय प्रथम पुरुष एकवचन है; यह प्रयोग भेड़ों के यहोवा से संबंध और उनकी देखभाल—दोनों का संकेत बनाए रखता है।
- source_word: נְאֻם יְהוָה
  choice: यहोवा की यह वाणी है
  rationale: यह गंभीर भविष्यवाणीय सूत्र का स्वाभाविक हिन्दी रूप है और इसे साधारण ‘कहता है’ की अपेक्षा विशिष्ट रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ द्वारा प्रस्तुत किया गया है।
theological_decisions:
- issue: चरवाहों और भेड़ों के रूपक का अनुवाद
  choice: मुख्य पाठ में ‘चरवाहों’ और ‘भेड़ों’ का मूल रूपक बनाए रखा गया।
  alternative: ‘अगुओं’ और ‘मेरी प्रजा’ जैसे व्याख्यात्मक पदों से रूपक को स्पष्ट करना।
  rationale: इब्रानी पाठ में चरवाही का रूपक स्पष्ट है और यिर्मयाह 23 के साहित्यिक तथा धर्मवैचारिक विकास के लिए महत्वपूर्ण है; उसे बनाए रखना अनावश्यक व्याख्यात्मक संकुचन से बचाता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और भविष्यवाणीय है। विस्मयादिबोधक वाक्य न्याय-घोषणा की तीव्रता रखता है, जबकि अंतिम सूत्र उसकी गंभीरता बनाए रखता है।
