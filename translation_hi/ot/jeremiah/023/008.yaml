  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֣י אִם חַי יְהוָ֗ה אֲשֶׁ֣ר הֶעֱלָה֩ וַ/אֲשֶׁ֨ר הֵבִ֜יא אֶת זֶ֨רַע בֵּ֤ית יִשְׂרָאֵל֙ מֵ/אֶ֣רֶץ צָפ֔וֹנָ/ה וּ/מִ/כֹּל֙ הָֽ/אֲרָצ֔וֹת אֲשֶׁ֥ר הִדַּחְתִּ֖י/ם שָׁ֑ם וְ/יָשְׁב֖וּ עַל אַדְמָתָֽ/ם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/008.yaml
  text: but[a], ‘As Yahweh lives[d][c][b], who brought up and who brought in the offspring of the house of Israel from the land of the north and from all the lands where I had driven them,’ and they shall dwell on their own soil.
translation:
  language: hi
  text: बल्कि[a], “जीवित याहवे की शपथ[b], जो इस्राएल के घराने के वंशजों[c] को उत्तर के देश से और उन सब देशों से निकाल लाया और वापस ले आया, जहाँ मैंने[d] उन्हें खदेड़ दिया था, और वे अपनी ही धरती[e] पर बसेंगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘इसके बजाय’ या ‘बल्कि यह कहा जाएगा’ भी हो सकता है। यह पद पिछले पद की पुरानी शपथ-पद्धति का स्थान लेने वाली नई शपथ को आगे बढ़ाता है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक रूप के अधिक निकट: ‘याहवे जीवित है।’ यह एक गंभीर इब्रानी शपथ-पद्धति है।'
    reason: idiom_explanation
  - marker: c
    text: अर्थात ‘इस्राएल के घराने की संतान’ या ‘इस्राएल के घराने के वंशज।’
    reason: lexical_alternative
  - marker: d
    text: इब्रानी में यहाँ अचानक तीसरे पुरुष (‘जो ... लाया’) से पहले पुरुष (‘मैंने’) में परिवर्तन होता है। कुछ अनुवाद इसे ‘जहाँ उसने उन्हें खदेड़ा था’ करके समरूप बनाते हैं।
    reason: textual_ambiguity
  - marker: e
    text: इसका अनुवाद ‘अपनी ही भूमि पर’ भी हो सकता है। इब्रानी शब्द का विशेष अर्थ मिट्टी, जमीन या धरती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: बल्कि
  rationale: यह पद 7 की पुरानी शपथ-पद्धति के स्थान पर नई शपथ-पद्धति प्रस्तुत करता है। ‘बल्कि’ इस सुधारात्मक विरोध को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: חַי יְהוָה
  choice: जीवित याहवे की शपथ
  rationale: यह इब्रानी की प्रचलित शपथ-पद्धति है। हिंदी में यह रूप उसके शपथ-संबंधी बल और गंभीरता को स्वाभाविक रूप से व्यक्त करता है; יְהוָה को व्यक्तिगत नाम ‘याहवे’ के रूप में रखा गया है।
- source_word: הֶעֱלָה וַאֲשֶׁר הֵבִיא
  choice: निकाल लाया और वापस ले आया
  rationale: दो अलग हिफ़ील क्रियाओं को अलग रखा गया है। पहला निर्वासन से बाहर निकालने और निर्गमन की प्रतिध्वनि देता है, जबकि दूसरा स्वदेश में पुनः लाए जाने को व्यक्त करता है। ‘वापस’ लक्ष्य को संदर्भ से स्पष्ट करता है।
- source_word: זֶרַע בֵּית יִשְׂרָאֵל
  choice: इस्राएल के घराने के वंश
  rationale: זֶרַע यहाँ सामूहिक अर्थ में भावी पीढ़ी अथवा वंशजों को दर्शाता है। ‘वंश’ संक्षिप्त, प्रतिष्ठित और आधुनिक हिंदी में सुबोध है; ‘घराना’ राष्ट्रीय-पारिवारिक पदवी को बनाए रखता है।
- source_word: מֵאֶרֶץ צָפוֹנָה
  choice: उत्तर के देश से
  rationale: यह यिर्मयाह में उत्तर दिशा से जुड़े आक्रमण और निर्वासन के भौगोलिक-धार्मिक संकेत को बनाए रखता है।
- source_word: וּמִכֹּל הָאֲרָצוֹת
  choice: और उन सब देशों से
  rationale: बहुवचन הָאֲרָצוֹת को ‘देशों’ से व्यक्त किया गया है और ‘उन’ आगे आने वाले संबंधवाचक उपवाक्य से स्वाभाविक रूप से जुड़ता है।
- source_word: אֲשֶׁר הִדַּחְתִּים שָׁם
  choice: जहाँ मैंने उन्हें खदेड़ दिया था
  rationale: हिफ़ील क्रिया के प्रबल, सक्रिय अर्थ को ‘खदेड़ दिया’ व्यक्त करता है। पूर्वकालिक निर्वासन को हिंदी संयुक्त भूतकाल से दिखाया गया है और प्रथम पुरुष ‘मैंने’ को मूल पाठ के अनुसार ज्यों का त्यों रखा गया है।
- source_word: וְיָשְׁבוּ
  choice: तब वे ... बसेंगे
  rationale: ישב में रहने और बस जाने दोनों का भाव है। पुनर्स्थापन के संदर्भ में ‘बसेंगे’ स्थायी निवास को स्वाभाविक रूप से व्यक्त करता है; ‘तब’ परिणाम-संबंध को स्पष्ट करता है।
- source_word: עַל אַדְמָתָם
  choice: अपनी ही धरती पर
  rationale: אֲדָמָה का मूल अर्थ भूमि, मिट्टी या धरती है। ‘धरती’ उसकी ठोस भौमिक छवि को बचाती है और ‘ही’ अपने स्वदेश में पुनर्स्थापन पर बल देता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम सीधे आया है। उसका लिप्यंतरण नाम और उपाधि के बीच का भेद बनाए रखता है, बिना किसी सांप्रदायिक व्याख्या को जोड़ने के।
- issue: पुनर्स्थापन में निर्गमन और वापसी की संयुक्त छवि
  choice: ‘निकाल लाया’ और ‘वापस ले आया’—दोनों क्रियाएँ अलग रखना
  alternative: दोनों को केवल ‘ले आया’ कहना
  rationale: मूल की दो क्रियाएँ छुटकारे और स्वदेश में पुनः प्रवेश, दोनों को साथ रखती हैं। उन्हें अलग रखने से नया-निर्गमन जैसा संकेत सुरक्षित रहता है, पर उसे व्याख्यात्मक सिद्धांत में नहीं बदला जाता।
- issue: तीसरे पुरुष से पहले पुरुष में अचानक परिवर्तन
  choice: ‘जो ... लाया’ के बाद मूल का ‘मैंने’ बनाए रखना
  alternative: व्याकरण को समरूप करके ‘जहाँ उसने उन्हें खदेड़ा था’ करना
  rationale: इब्रानी पाठ में याहवे के लिए तीसरे पुरुष से अचानक प्रथम पुरुष में परिवर्तन है। इसे समतल करना वास्तविक पाठगत और वाक्यगत तनाव को मिटा देता; इसलिए परिवर्तन मुख्य पाठ में सुरक्षित और टिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी की है, पर शपथ और पुनर्स्थापन की गंभीरता के अनुरूप गरिमापूर्ण रखी गई है। ‘घराना’, ‘वंश’, ‘धरती’ और ‘बसेंगे’ सामान्य पाठक के लिए सुबोध हैं। पद 7 पर निर्भर आरंभिक खंड को ‘बल्कि’ से जोड़ा गया है; उद्धरण के भीतर मूल पाठ का असामान्य पुरुष-परिवर्तन जानबूझकर नहीं सुधारा गया।
