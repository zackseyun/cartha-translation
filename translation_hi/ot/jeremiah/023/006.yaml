source:
  edition: WLC
  text: בְּ/יָמָי/ו֙ תִּוָּשַׁ֣ע יְהוּדָ֔ה וְ/יִשְׂרָאֵ֖ל יִשְׁכֹּ֣ן לָ/בֶ֑טַח וְ/זֶה שְּׁמ֥/וֹ אֲֽשֶׁר יִקְרְא֖/וֹ יְהוָ֥ה צִדְקֵֽ/נוּ־־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/006.yaml
  text: 'In his days Judah will be saved[a], and Israel will dwell securely[b]; and this is the name by which he will be called: Yahweh Is Our Righteousness.'
translation:
  language: hi
  text: 'उसके दिनों में यहूदा बचाया जाएगा और इस्राएल सुरक्षित बसा रहेगा। और यह वह नाम है जिससे उसे पुकारा जाएगा: “याहवे हमारी धार्मिकता है।”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसे बिना संयोजक क्रिया के “याहवे हमारी धार्मिकता” भी पढ़ा जा सकता है; हिब्रू नाम-सूत्र में “है” लिखा नहीं है।
    reason: व्याकरणिक और नाम-सूत्र संबंधी वैकल्पिक पाठ
  - marker: b
    text: “धार्मिकता” के लिए प्रयुक्त हिब्रू शब्द का अनुवाद “न्याय” भी किया जा सकता है।
    reason: शब्दार्थ की वास्तविक वैकल्पिक संभावना
lexical_decisions:
- source_word: בְּיָמָיו
  choice: उसके दिनों में
  rationale: यह वाक्यांश शाब्दिक रूप से आनेवाले धर्मी दाऊदी राजा के समय की ओर संकेत करता है; हिन्दी में यह स्वाभाविक और संदर्भानुकूल है।
- source_word: תִּוָּשַׁע
  choice: बचाया जाएगा
  rationale: निफ़अल रूप बचाए या छुड़ाए जाने को व्यक्त करता है। यह चुनाव उद्धार के सैनिक, राष्ट्रीय या आत्मिक पहलुओं में से किसी एक को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: יִשְׁכֹּן לָבֶטַח
  choice: सुरक्षित बसा रहेगा
  rationale: שׁכן का अर्थ बसना या निवास करना और לָבֶטַח का अर्थ सुरक्षा में है; यह रूप स्थायी और निश्चिंत निवास का भाव रखता है।
- source_word: אֲשֶׁר יִקְרְאוֹ
  choice: जिससे लोग उसे पुकारेंगे
  rationale: हिब्रू क्रिया बहुवचन कर्ता और एकवचन कर्म-प्रत्यय रखती है। ‘लोग’ अनिर्दिष्ट बहुवचन कर्ता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: צִדְקֵנוּ
  choice: हमारी धार्मिकता
  rationale: צדק के अर्थ-क्षेत्र में धार्मिकता और न्याय दोनों आते हैं। इस राजकीय नाम-सूत्र में ‘धार्मिकता’ वाचा के अनुरूप सही संबंध और सही दशा के व्यापक भाव को बनाए रखती है।
theological_decisions:
- issue: राजकीय नाम-सूत्र יְהוָה צִדְקֵנוּ का अर्थ
  choice: याहवे हमारी धार्मिकता है
  alternative: याहवे हमारी धार्मिकता; अथवा याहवे हमारा न्याय है
  rationale: हिब्रू में स्पष्ट संयोजक क्रिया नहीं है। हिन्दी में ‘है’ जोड़ने से विधेयात्मक अर्थ सहज होता है, पर पादटिप्पणी बिना संयोजक क्रिया वाले नाम-पाठ की संभावना सुरक्षित रखती है। ‘धार्मिकता’ मुख्य पाठ में व्यापक वाचागत अर्थ देती है, जबकि ‘न्याय’ की वास्तविक अर्थ-संभावना भी पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप। ‘इस्राएल’ और ‘याहवे’ स्रोत-नामों के मानक देवनागरी रूप हैं। सामूहिक राष्ट्रवाचक संज्ञाओं के साथ एकवचन क्रियाएँ रखी गई हैं।
