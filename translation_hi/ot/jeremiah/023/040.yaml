  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/נָתַתִּ֥י עֲלֵי/כֶ֖ם חֶרְפַּ֣ת עוֹלָ֑ם וּ/כְלִמּ֣וּת עוֹלָ֔ם אֲשֶׁ֖ר לֹ֥א תִשָּׁכֵֽחַ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/040.yaml
  text: And I will put on you everlasting reproach and everlasting disgrace[a], which will not be forgotten.
translation:
  language: hi
  text: और मैं तुम पर सदा की निन्दा और सदा का अपमान[a] डालूँगा, जिसे कभी भुलाया नहीं जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “चिरस्थायी निन्दा और चिरस्थायी अपमान।” इब्रानी עוֹלָם प्रसंग के अनुसार सदा बने रहने या अनिश्चित रूप से बहुत लंबे समय तक टिके रहने का भाव दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: और मैं ... डालूँगा
  rationale: נתן का मूल अर्थ ‘देना’ है, पर עֲלֵיכֶם और अमूर्त कर्मों के साथ यहाँ किसी दशा को आरोपित करने का भाव है; हिन्दी में ‘तुम पर ... डालूँगा’ इस मुहावरे को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עֲלֵיכֶם
  choice: तुम पर
  rationale: עַל प्रत्यय सहित उन सम्बोधित लोगों को दर्शाता है जिन पर निन्दा और अपमान डाले जाएंगे।
- source_word: חֶרְפַּת
  choice: निन्दा
  rationale: חֶרְפָּה सार्वजनिक तिरस्कार, उपहास और बदनामी का भाव रखता है। ‘निन्दा’ अगले निकटार्थक शब्द ‘अपमान’ से पर्याप्त भिन्नता बनाए रखता है।
- source_word: עוֹלָם
  choice: सदा की / सदा का
  rationale: עוֹלָם दीर्घस्थायी अथवा अनिश्चित-अवधि की निरन्तरता व्यक्त कर सकता है। ‘सदा’ न्याय-वचन की गंभीरता बनाए रखता है, जबकि इसकी प्रसंगगत व्यापकता पर पादटिप्पणी संकेत करती है।
- source_word: וּכְלִמּוּת
  choice: और ... अपमान
  rationale: כְּלִמּוּת लज्जा, बेइज्जती या अपमान को दर्शाता है। ‘अपमान’ सहज आधुनिक हिन्दी है और ‘निन्दा’ के साथ समानार्थी होते हुए भी उससे अलग पहलू प्रकट करता है।
- source_word: אֲשֶׁר לֹא תִשָּׁכֵחַ
  choice: जिसे कभी भुलाया नहीं जाएगा
  rationale: שׁכח का निफ़अल रूप निष्क्रिय अर्थ ‘भुलाया जाना’ देता है। ‘कभी’ हिन्दी में निषेध और स्थायित्व के संयुक्त बल को स्वाभाविक ढंग से सामने लाता है।
theological_decisions:
- issue: न्याय-वचन में עוֹלָם का कालगत बल
  choice: सदा की / सदा का
  alternative: चिरस्थायी; युगों तक रहनेवाली
  rationale: यह चुनाव घोषित निन्दा और अपमान के टिके रहने की गंभीरता को बनाए रखता है, पर עוֹלָם को दार्शनिक अर्थ में तकनीकी ‘अनन्तता’ मानकर तनाव को चुपचाप समाप्त नहीं करता।
- issue: सम्बन्धवाचक उपवाक्य का दायरा
  choice: ‘जिसे’ को संयुक्त ‘निन्दा और अपमान’ की समष्टि से सम्बद्ध रखा गया
  alternative: केवल निकटतम संज्ञा ‘अपमान’ से सम्बद्ध करना
  rationale: इब्रानी स्त्रीलिंग एकवचन क्रिया निकटतम स्त्रीलिंग संज्ञा से मेल खाती है, फिर भी अर्थ की दृष्टि से पूरा संयुक्त न्याय-वचन इसका पूर्वपद हो सकता है। हिन्दी एकवचन ‘जिसे’ इस समष्टिगत समझ को सम्भव रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर, सार्वजनिक-पाठ योग्य शैली रखी गई है। ‘निन्दा’ और ‘अपमान’ मूल के दो निकटार्थक संज्ञा-पदों का भेद बनाए रखते हैं; वाक्य विन्यास स्पष्ट और सामान्य पाठक के लिए सहज है।
