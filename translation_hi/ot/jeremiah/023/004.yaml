base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/004.yaml
  text: And I will raise up over them shepherds who will shepherd them[a], and they will no longer fear, nor be dismayed, nor will any be missing, declares Yahweh.
translation:
  language: hi
  text: मैं उनके ऊपर ऐसे चरवाहे नियुक्त करूँगा जो उनकी चरवाही करेंगे, और वे फिर कभी न डरेंगे, न घबराएँगे, और उनमें से कोई भी लापता न होगा[a]—यह यहोवा की घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनमें किसी की कमी न होगी”; अथवा, “कोई भी खोया हुआ न होगा।” इब्रानी का आशय संभवतः यह है कि झुंड में से कोई भी गायब या ऐसा न होगा जिसका पता न हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: मैं ... नियुक्त करूँगा
  rationale: हिफ़ील रूप यहाँ परमेश्वर द्वारा अगुवों को ठहराने या खड़ा करने का भाव देता है। आधुनिक हिन्दी में ‘नियुक्त करूँगा’ नेतृत्व के प्रसंग में स्वाभाविक है और दैवी पहल को स्पष्ट रखता है।
- source_word: עֲלֵיהֶם
  choice: उनके ऊपर
  rationale: עַל नेतृत्व और उत्तरदायित्व के प्रसंग में अधिकार तथा देखरेख का संबंध व्यक्त करता है; ‘उनके ऊपर’ मूल संरचना को निकटता से रखता है।
- source_word: רֹעִים
  choice: चरवाहे
  rationale: शाब्दिक चरवाहा-रूपक निकटवर्ती संदर्भ का केंद्रीय चित्र है; ‘अगुवे’ कहने से यह रूपक सपाट हो जाता।
- source_word: וְרָעוּם
  choice: जो उनकी चरवाही करेंगे
  rationale: संज्ञा רֹעִים और उसी मूल से बने क्रिया रूप के शब्द-संबंध को ‘चरवाहे/चरवाही’ द्वारा बनाए रखा गया है।
- source_word: וְלֹא יִירְאוּ עוֹד
  choice: तब वे फिर न डरेंगे
  rationale: ‘फिर न’ עוֹד के कालगत भाव को स्वाभाविक हिन्दी में व्यक्त करता है; कर्ता झुंड अर्थात लोग हैं।
- source_word: וְלֹא יֵחַתּוּ
  choice: न घबराएँगे
  rationale: חתת का निफ़ाल भयभीत, आतंकित या हतोत्साहित होने का भाव दे सकता है। ‘घबराएँगे’ सामान्य आधुनिक हिन्दी में ‘डरेंगे’ से संबंधित किंतु अलग मनोदशा व्यक्त करता है।
- source_word: וְלֹא יִפָּקֵדוּ
  choice: उनमें से कोई भी लापता न होगा
  rationale: פקד का निफ़ाल यहाँ अनुपस्थित, कम या गिनती से बाहर पाए जाने का अर्थ देता है। ‘कोई भी लापता न होगा’ झुंड के एक भी सदस्य के गायब न होने का संभावित आशय स्पष्ट करता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: נְאֻם יְהוָה
  choice: यह यहोवा की घोषणा है
  rationale: נְאֻם मानक नबूवती घोषणा-सूत्र है। यह रूप आधुनिक, गरिमापूर्ण हिन्दी में सूत्रात्मक बल रखता है और יהוה को व्यक्तिगत नाम ‘यहोवा’ के रूप में प्रस्तुत करता है।
theological_decisions:
- issue: चरवाहे के रूपक का अनुवाद
  choice: ‘चरवाहे’ और ‘चरवाही करेंगे’ को बनाए रखना
  alternative: ‘अगुवे’ और ‘देखभाल करेंगे’
  rationale: इस खंड में दोषी और पुनर्स्थापित नेतृत्व का अर्थ चरवाहे के रूपक से व्यक्त होता है। रूपक बनाए रखने से नबूवती चित्र और संज्ञा-क्रिया का संबंध दोनों सुरक्षित रहते हैं।
- issue: וְלֹא יִפָּקֵדוּ का आशय
  choice: ‘उनमें से कोई भी लापता न होगा’
  alternative: ‘उन्हें किसी बात की घटी न होगी’ अथवा ‘उनमें से कोई खोया न जाएगा’
  rationale: मूल पद का अर्थ गायब, अनुपस्थित या कमी में पाया जाना हो सकता है। मुख्य पाठ में झुंड के किसी सदस्य के लापता न होने का ठोस अर्थ चुना गया है, पर पादटिप्पणी वास्तविक शाब्दिक संभावनाओं को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज। चरवाहे का मूल रूपक और ‘चरवाहे/चरवाही’ का शब्द-संबंध बनाए रखा गया है। ‘यहोवा’ देवनागरी में प्रचलित बाइबलीय रूप है।
