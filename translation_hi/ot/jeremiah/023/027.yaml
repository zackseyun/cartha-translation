base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/027.yaml
  text: who plan to make my people forget my name by their dreams that they tell[a], each man to his neighbor[b], just as their fathers forgot my name because of Baal.
translation:
  language: hi
  text: जो अपने सपनों के द्वारा[a], जिन्हें वे हर एक अपने साथी को सुनाते हैं, मेरी प्रजा से मेरा नाम भुलवाने की योजना बनाते हैं—ठीक वैसे ही जैसे उनके पुरखाओं ने बाल के कारण[b] मेरा नाम भुला दिया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने सपनों में।” इब्रानी उपसर्ग साधन या क्षेत्र, दोनों का बोध करा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “बाल के लिए” अथवा “बाल के द्वारा।” सम्भवतः आशय यह है कि बाल के प्रति उनकी भक्ति के कारण वे यहोवा का नाम भूल गए।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֹשְׁבִים
  choice: जो ... योजना बनाते हैं
  rationale: यह कृदंत यहाँ केवल मन में सोचने के बजाय झूठे भविष्यवक्ताओं के सोद्देश्य इरादे को व्यक्त करता है।
- source_word: לְהַשְׁכִּיחַ
  choice: भुला देने
  rationale: שׁכח का हिफ़ील रूप कारणवाचक है; ‘भुला देने’ से किसी को भूलने के लिए प्रेरित करने का भाव स्वाभाविक हिन्दी में बना रहता है।
- source_word: עַמִּי
  choice: मेरी प्रजा
  rationale: मूल पाठ के स्पष्ट संबंधवाचक रूप और वाचा-संबंधी आशय को बनाए रखता है।
- source_word: שְׁמִי
  choice: मेरा नाम
  rationale: दोनों स्थानों पर शाब्दिक ‘मेरा नाम’ परमेश्वर की प्रकट पहचान से जुड़े अर्थभार को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: בַּחֲלֹמוֹתָם
  choice: उन सपनों के द्वारा
  rationale: 'यहाँ בְּ को साधन के अर्थ में लिया गया है: सुनाए जाने वाले सपने प्रजा को भुलाने का माध्यम हैं; क्षेत्रसूचक अर्थ की संभावना पादटिप्पणी में रखी गई है।'
- source_word: אֲשֶׁר יְסַפְּרוּ
  choice: जिन्हें वे ... सुनाते हैं
  rationale: पिएल रूप में ספר का सामान्य अर्थ किसी बात या अनुभव को सुनाना है; ‘सुनाते हैं’ मौखिक प्रसार के प्रसंग में सहज है।
- source_word: אִישׁ לְרֵעֵהוּ
  choice: हर एक अपने साथी को
  rationale: यह איש की वितरणात्मक शक्ति और רֵעַ के निकट-संबंधी अर्थ को बनाए रखता है।
- source_word: כַּאֲשֶׁר
  choice: ठीक वैसे ही जैसे
  rationale: वर्तमान झूठे भविष्यवक्ताओं और पिछली पीढ़ी के धर्मत्याग के बीच स्पष्ट तुलना को व्यक्त करता है।
- source_word: שָׁכְחוּ אֲבוֹתָם
  choice: उनके पुरखाओं ने ... भुला दिया था
  rationale: ‘पुरखाओं’ से אבות का पीढ़ीगत आशय स्वाभाविक आधुनिक हिन्दी में आता है; पूर्ण भूतकाल पहले हुई घटना को स्पष्ट करता है।
- source_word: בַּבָּעַל
  choice: बाल के कारण
  rationale: 'בְּ को यहाँ कारण या संगति-सूचक माना गया है: बाल के प्रति निष्ठा ने उन्हें यहोवा का नाम भुलाने की ओर लगाया। अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।'
theological_decisions:
- issue: वाचा-संबंधी ‘नाम’ की भाषा
  choice: दोनों बार ‘मेरा नाम’
  alternative: ‘मेरी कीर्ति’ अथवा ‘मैं कौन हूँ’
  rationale: शाब्दिक रूप परमेश्वर की प्रकट पहचान और वाचा-संबंधी धर्मत्याग के आशय को सुरक्षित रखता है, पर उसे अनावश्यक रूप से खोलकर नहीं बताता।
- issue: אִישׁ לְרֵעֵהוּ का वितरणात्मक और लिंगयुक्त रूप
  choice: हर एक अपने साथी को
  alternative: एक-दूसरे को
  rationale: चुना गया रूप मूल के एकवचन वितरणात्मक ढाँचे और पुरुषवाचक प्रसंग को अधिक निकटता से रखता है।
- issue: बाल से जुड़े בְּ का अर्थ
  choice: बाल के कारण
  alternative: बाल के लिए; बाल के द्वारा
  rationale: मुख्य पाठ में कारण/संबंध का अर्थ प्रसंगानुकूल है, पर इब्रानी उपसर्ग की वास्तविक अर्थगत खुली संभावना पादटिप्पणी में सुरक्षित रखी गई है।
