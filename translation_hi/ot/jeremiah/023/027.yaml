  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। वाक्य को मूल के संबंधवाचक ‘जो’ से आरम्भ करके पूर्ववर्ती प्रसंग से उसका व्याकरणिक संबंध बनाए रखा गया है। ‘प्रजा,’ ‘पुरखे’ और ‘बाल’ जैसे परिचित बाइबलीय शब्द रखे गए हैं; वास्तविक पूर्वसर्गीय अस्पष्टताएँ पादटिप्पणियों में दी गई हैं।
