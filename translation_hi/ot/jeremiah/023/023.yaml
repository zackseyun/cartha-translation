theological_decisions:
- issue: परमेश्वर की निकटता और दूरी के विषय में अलंकारिक प्रश्न
  choice: क्या मैं केवल पास का परमेश्वर हूँ ... और दूर का परमेश्वर नहीं?
  alternative: क्या मैं पास का परमेश्वर हूँ ... और दूर का परमेश्वर नहीं?
  rationale: ‘केवल’ प्रश्न के आशय—यहोवा को निकट क्षेत्र या निकट बातों तक सीमित मानने का खंडन—को हिंदी में स्वाभाविक बनाता है। फिर भी इसे मुख्य पाठ में रखने से अधिक शाब्दिक संभावना पादटिप्पणी में दी गई है, ताकि मूल की संक्षिप्तता और संभावित अस्पष्टता छिपे नहीं।
