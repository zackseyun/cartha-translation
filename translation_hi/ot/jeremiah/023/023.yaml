  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘पास’ और ‘दूर’ सामान्य पाठक के लिए स्पष्ट हैं; नबी-वाणी की औपचारिकता ‘यह यहोवा की घोषणा है’ से सुरक्षित रहती है।
