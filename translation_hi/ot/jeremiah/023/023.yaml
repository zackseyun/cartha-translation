- source_word: נְאֻם יְהוָה
  choice: यह यहोवा की घोषणा है
  rationale: यह मानक नबी-वाणी सूत्र की गरिमा बनाए रखता है और יְהוָה को उपाधि से बदलने के बजाय व्यक्तिगत नाम ‘यहोवा’ के रूप में प्रस्तुत करता है।
- source_word: וְ/לֹא אֱלֹהֵי מֵ/רָחֹק
  choice: और दूर का परमेश्वर नहीं
