  footnotes:
  - marker: a
    text: या, “क्या मैं केवल निकट का परमेश्वर हूँ ... और दूर का परमेश्वर नहीं?” यह अलंकारिक प्रश्न इस धारणा का खंडन करता है कि यहोवा केवल निकट तक सीमित है।
