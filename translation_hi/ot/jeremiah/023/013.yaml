source:
  edition: WLC
  text: וּ/בִ/נְבִיאֵ֥י שֹׁמְר֖וֹן רָאִ֣יתִי תִפְלָ֑ה הִנַּבְּא֣וּ בַ/בַּ֔עַל וַ/יַּתְע֥וּ אֶת עַמִּ֖/י אֶת יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/013.yaml
  text: 'And among the prophets of Samaria I saw something offensive: they prophesied by Baal and led my people Israel astray[a][b].'
translation:
  language: hi
  text: 'और सामरिया के भविष्यद्वक्ताओं में मैंने एक घृणित बात देखी: उन्होंने बाल के नाम से भविष्यवाणी की[a] और मेरी प्रजा इस्राएल को भटका दिया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बाल के द्वारा” अथवा “बाल के लिए भविष्यवाणी की।” आशय यह है कि वे बाल के कथित अधिकार से या उसके नाम पर भविष्यवाणी करते थे।
    reason: alternative_reading
lexical_decisions:
- source_word: וּבִנְבִיאֵי שֹׁמְרוֹן
  choice: और सामरिया के भविष्यद्वक्ताओं में
  rationale: ב को यहाँ उस समूह या क्षेत्र के रूप में समझा गया है जिसमें यह बात देखी गई; हिंदी में यह रचना स्वाभाविक रहते हुए मूल के निकट है।
- source_word: רָאִיתִי תִפְלָה
  choice: मैंने एक घृणित बात देखी
  rationale: תִפְלָה यहाँ केवल बौद्धिक मूर्खता नहीं, बल्कि नैतिक और धार्मिक रूप से आपत्तिजनक तथा निंदनीय बात को सूचित करता है। 'घृणित बात' इस तीव्र मूल्यांकन को सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: הִנַּבְּאוּ בַבַּעַל
  choice: उन्होंने बाल के नाम से भविष्यवाणी की
  rationale: בַבַּעַל भविष्यवाणी का बाल से संबंध अथवा उसके कथित अधिकार को दर्शाता है। 'बाल के नाम से' हिंदी में इस आशय को स्पष्ट करता है, जबकि अन्य संभावित संबंधों को पादटिप्पणी में रखा गया है।
- source_word: וַיַּתְעוּ
  choice: और ... को भटका दिया
  rationale: תעה का हिफ़ील रूप कारणवाचक है—किसी को मार्ग से भटका देना। यह नैतिक और वाचागत भटकाव की छवि बनाए रखता है।
- source_word: אֶת עַמִּי אֶת יִשְׂרָאֵל
  choice: मेरी प्रजा इस्राएल को
  rationale: दोनों कर्मचिह्नों वाली रचना में 'इस्राएल' पहले पद 'मेरी प्रजा' की समानाधिकरणात्मक पहचान करता है; हिंदी में बिना अतिरिक्त 'अर्थात्' के यह स्वाभाविक और स्पष्ट है।
theological_decisions:
- issue: הִנַּבְּאוּ בַבַּעַל में भविष्यद्वक्ताओं का बाल से संबंध
  choice: बाल के नाम से भविष्यवाणी की
  alternative: बाल के द्वारा / बाल के लिए भविष्यवाणी की
  rationale: चुनी हुई अभिव्यक्ति उनके भविष्यवाणी करने को बाल के कथित नाम या अधिकार से जोड़ती है, पर मूल से आगे बढ़कर उसके प्रभाव की कोई विस्तृत धर्मवैज्ञानिक व्याख्या नहीं करती।
- issue: תִפְלָה का नैतिक-धार्मिक बल
  choice: एक घृणित बात
  alternative: मूर्खता / एक भयंकर बात
  rationale: संदर्भ में दोष केवल विवेकहीनता नहीं, बल्कि झूठी उपासना और भ्रष्ट भविष्यवाणी से जुड़ा धार्मिक अपराध है। 'घृणित बात' उस निंदात्मक बल को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। 'भविष्यद्वक्ता' और 'भविष्यवाणी' प्रचलित बाइबलीय शब्द हैं। वाक्य में मूल की आरोपात्मक तीव्रता तथा 'मेरी प्रजा इस्राएल' की समानाधिकरणात्मक रचना सुरक्षित रखी गई है।
