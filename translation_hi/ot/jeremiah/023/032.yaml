source:
  edition: WLC
  text: הִ֠נְ/נִי עַֽל נִבְּאֵ֞י חֲלֹמ֥וֹת שֶׁ֨קֶר֙ נְאֻם יְהוָ֔ה וַֽ/יְסַפְּרוּ/ם֙ וַ/יַּתְע֣וּ אֶת עַמִּ֔/י בְּ/שִׁקְרֵי/הֶ֖ם וּ/בְ/פַחֲזוּתָ֑/ם וְ/אָנֹכִ֨י לֹֽא שְׁלַחְתִּ֜י/ם וְ/לֹ֣א צִוִּיתִ֗י/ם וְ/הוֹעֵ֛יל לֹֽא יוֹעִ֥ילוּ לָֽ/עָם הַ/זֶּ֖ה נְאֻם יְהוָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/032.yaml
  text: Behold[a], I am against those who prophesy lying dreams, declares Yahweh, and who tell them and lead my people astray by their lies and by their recklessness, though I did not send them or command them. They do not profit this people at all[b], declares Yahweh.
translation:
  language: hi
  text: “देखो, मैं उन लोगों के विरुद्ध हूँ जो झूठे सपनों[a] की भविष्यवाणी करते हैं,” याहवे की घोषणा है, “और जो उन्हें सुनाकर अपने झूठ और अपनी लापरवाही[b] से मेरी प्रजा को भटका देते हैं। मैंने न तो उन्हें भेजा, न उन्हें आज्ञा दी; वे इस प्रजा को तनिक भी लाभ नहीं पहुँचाते,” याहवे की घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “झूठ के सपने” भी हो सकता है। इब्रानी में शाब्दिक रूप से “झूठ के सपने” है, जहाँ “झूठ” संज्ञा विशेषण का काम करती है।
    reason: lexical_alternative
  - marker: b
    text: इस कठिन इब्रानी शब्द का अनुवाद “उतावलापन,” “धृष्टता,” “डींग,” या “छिछोरापन” भी किया गया है। इसका भाव गैर-जिम्मेदार और अपनी मर्यादा से आगे बढ़े हुए आचरण से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי עַל
  choice: देखो, मैं ... के विरुद्ध हूँ
  rationale: यह इब्रानी मुहावरा न्याय की गंभीर घोषणा और सक्रिय विरोध व्यक्त करता है; ‘देखो’ भविष्यद्वाणी की उद्घोषणात्मक शक्ति बनाए रखता है।
- source_word: נִבְּאֵי חֲלֹמוֹת שֶׁקֶר
  choice: जो झूठ भरे सपनों की भविष्यवाणी करते हैं
  rationale: सहभागी रूप लोगों को उनके कार्य से पहचानता है। ‘झूठ भरे सपने’ שֶׁקֶר को केवल विशेषण बनाकर उसकी संज्ञात्मक तीव्रता खोने से बचाता है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: यह मानक भविष्यद्वाणी-सूत्र है; ‘घोषणा’ नְאֻם की औपचारिक, अधिकारपूर्ण ध्वनि व्यक्त करता है।
- source_word: וַיְסַפְּרוּם
  choice: जो उन सपनों को सुनाकर
  rationale: क्रिया से जुड़ा बहुवचन कर्म-प्रत्यय पहले बताए गए सपनों की ओर लौटता है; उसे स्पष्ट करने से हिन्दी में संदर्भ सहज रहता है।
- source_word: וַיַּתְעוּ אֶת עַמִּי
  choice: मेरी प्रजा को भटका देते हैं
  rationale: हिफ़ील रूप किसी को मार्ग से भटकाने या भ्रामक दिशा में ले जाने का कारण बनने का भाव देता है।
- source_word: בְּשִׁקְרֵיהֶם
  choice: अपने झूठ से
  rationale: בְּ साधन का बोध देता है और बहुवचन שִׁקְרֵיהֶם को हिन्दी में सामूहिक ‘झूठ’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: וּבְפַחֲזוּתָם
  choice: अपनी दुस्साहसपूर्ण लापरवाही से
  rationale: दुर्लभ शब्द פחזות गैर-जिम्मेदार, उतावले और धृष्ट आचरण का मिश्रित भाव रखता है। संयुक्त हिन्दी पद किसी एक अनिश्चित अर्थ को निर्णायक बनाए बिना उस अर्थ-क्षेत्र को व्यक्त करता है।
- source_word: וְאָנֹכִי לֹא שְׁלַחְתִּים וְלֹא צִוִּיתִים
  choice: मैंने न तो उन्हें भेजा, न उन्हें आज्ञा दी
  rationale: אָנֹכִי का बल हिन्दी में स्पष्ट कर्ता ‘मैंने’ से आता है; दोहरी नकारात्मक समानांतरता को बनाए रखा गया है।
- source_word: וְהוֹעֵיל לֹא יוֹעִילוּ
  choice: वे ... तनिक भी लाभदायक नहीं हैं
  rationale: क्रिया से पहले उसी धातु का infinitive absolute नकार को प्रबल करता है; ‘तनिक भी ... नहीं’ उस जोर को सहज हिन्दी में व्यक्त करता है।
- source_word: לָעָם הַזֶּה
  choice: इस प्रजा के लिए
  rationale: עָם यहाँ परमेश्वर की प्रजा को दर्शाता है; ‘इस प्रजा’ मूल की संकेतात्मक और किंचित दूरीभरी भविष्यद्वाणी-भाषा रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल में परमेश्वर का विशिष्ट वाचा-नाम प्रयुक्त है; उसका लिप्यंतरण नाम और उपाधि के बीच का भेद सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ चार-अक्षरीय विशिष्ट नाम का प्रयोग करता है। ‘याहवे’ उसे सामान्य उपाधि में बदले बिना आधुनिक हिन्दी में प्रस्तुत करता है।
- issue: झूठे भविष्यद्वक्ताओं की उपयोगिता पर अंतिम कथन
  choice: वे इस प्रजा के लिए तनिक भी लाभदायक नहीं हैं
  alternative: वे इस प्रजा को कोई लाभ नहीं पहुँचाएँगे
  rationale: इब्रानी रूप के कालगत पक्ष को भविष्यकाल में सीमित किए बिना उसके जोरदार पूर्ण निषेध को रखा गया है; कथन उनकी वर्तमान और व्यापक निरुपयोगिता व्यक्त कर सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। प्रत्यक्ष ईश्वरीय वचन को उद्धरण-चिह्नों में रखा गया है। ‘उन सपनों’ कहकर इब्रानी कर्म-प्रत्यय का संदर्भ स्पष्ट किया गया है। कठिन פחזות को मुख्य पाठ में अर्थ-क्षेत्र समेटने वाले संयुक्त पद से और पादटिप्पणी में वास्तविक विकल्पों सहित प्रस्तुत किया गया है।
