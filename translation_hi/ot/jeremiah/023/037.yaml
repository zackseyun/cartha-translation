source:
  edition: WLC
  text: כֹּ֥ה תֹאמַ֖ר אֶל הַ/נָּבִ֑יא מֶה עָנָ֣/ךְ יְהוָ֔ה וּ/מַה דִּבֶּ֖ר יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/037.yaml
  text: 'Thus you shall say to the prophet: ‘What has Yahweh answered you[a], and what has Yahweh spoken?’'
translation:
  language: hi
  text: 'तुम नबी से इस प्रकार कहना: “याहवे ने तुझे[a] क्या उत्तर दिया, और याहवे ने क्या कहा?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘तुझे’ के अनुरूप प्रत्यय द्वितीय पुरुष स्त्रीलिंग एकवचन है।
    reason: मूल इब्रानी के स्त्रीलिंग एकवचन प्रत्यय को चिह्नित करना; मुख्य पाठ में हिंदी का ‘तुझे’ स्वाभाविक रूप से लिंग नहीं बताता।
lexical_decisions:
- source_word: כֹּה תֹאמַר
  choice: तुम इस प्रकार कहना
  rationale: כֹּה एक निर्धारित कथन-विधि का परिचय देता है, और अपूर्ण क्रिया תֹאמַר यहाँ निर्देशात्मक है। यह हिंदी में स्वाभाविक रहते हुए आदेश का भाव बनाए रखता है।
- source_word: אֶל הַנָּבִיא
  choice: नबी से
  rationale: एकवचन הַנָּבִיא को बनाए रखा गया है; हिंदी में ‘किसी से कहना’ स्वाभाविक प्रयोग है।
- source_word: מֶה עָנָךְ יְהוָה
  choice: याहवे ने तुझे क्या उत्तर दिया
  rationale: ענה का मूल अर्थ ‘उत्तर देना’ है। वाक्य-क्रम को स्वाभाविक हिंदी के अनुसार रखा गया है, जबकि प्रश्न और द्वितीय पुरुष एकवचन को सुरक्षित रखा गया है।
- source_word: וּמַה דִּבֶּר יְהוָה
  choice: और याहवे ने क्या कहा
  rationale: דבר का अर्थ यहाँ ‘बोलना/कहना’ है। ‘क्या कहा’ आधुनिक हिंदी में अधिक स्वाभाविक है और पहले खंड के ‘उत्तर दिया’ से अर्थगत भेद भी बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम चतुरक्षरीय יהוה को किसी उपाधि से बदलने के बजाय हिंदी लिप्यंतरण ‘याहवे’ से व्यक्त किया गया है।
theological_decisions:
- issue: יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम है, इसलिए उसे उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं किया गया।
- issue: עָנָךְ में संबोधित व्यक्ति का व्याकरणिक लिंग
  choice: मुख्य पाठ में स्वाभाविक ‘तुझे’, और पादटिप्पणी में स्त्रीलिंग रूप की सूचना
  alternative: मुख्य पाठ में ‘तुझ स्त्री से’ जैसा अस्वाभाविक स्पष्टीकरण
  rationale: इब्रानी प्रत्यय द्वितीय पुरुष स्त्रीलिंग एकवचन है, जबकि निकटवर्ती ‘नबी’ पुल्लिंग है। हिंदी ‘तुझे’ स्वाभाविक रूप से लिंग नहीं बताता; पादटिप्पणी मूल की असामान्यता को बिना हल किए सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘इस प्रकार कहना’ निर्देशात्मक स्वर को व्यक्त करता है; ‘याहवे’ दिव्य नाम का देवनागरी लिप्यंतरण है।
