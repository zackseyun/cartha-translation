  text: לָ/כֵ֛ן הִנֵּֽה יָמִ֥ים בָּאִ֖ים נְאֻם יְהוָ֑ה וְ/לֹא יֹ֤אמְרוּ עוֹד֙ חַי יְהוָ֔ה אֲשֶׁ֧ר הֶעֱלָ֛ה אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל מֵ/אֶ֥רֶץ מִצְרָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/007.yaml
  text: Therefore[a], behold, days are coming, declares Yahweh, when they will no longer say, ‘As Yahweh lives, who brought up the sons of Israel from the land of Egypt,’
translation:
  language: hi
  text: इसलिए देखो, दिन आ रहे हैं—यह याहवे की घोषणा है—जब लोग अब यह नहीं कहेंगे, “याहवे के जीवन की शपथ—उस याहवे की, जिसने इस्राएल के पुत्रों[a] को मिस्र देश से निकाल लाया,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक मुहावरेदार रूप में, “इस्राएली।”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: पिछले प्रसंग से निकलने वाले निष्कर्ष या परिणाम का संबंध स्पष्ट करता है।
- source_word: הִנֵּה
  choice: देखो
  rationale: भविष्यवाणी की ओर ध्यान खींचने वाली संकेतात्मक और गंभीर शक्ति को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: יָמִים בָּאִים
  choice: ऐसे दिन आ रहे हैं
  rationale: भविष्य के एक आने वाले समय की मानक भविष्यवाणी-सूचक अभिव्यक्ति है; ‘ऐसे’ हिन्दी में आगामी वर्णन की ओर स्वाभाविक संकेत देता है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: भविष्यद्वक्ता के संदेश-सूत्र को गरिमापूर्ण और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय लिप्यंतरित करता है।
- source_word: וְלֹא יֹאמְרוּ עוֹד
  choice: जब लोग फिर यह नहीं कहेंगे
  rationale: अनिर्दिष्ट बहुवचन कर्ता को हिन्दी में सामान्य ‘लोग’ से व्यक्त करते हुए עוֹד के समाप्ति-बोध को ‘फिर ... नहीं’ द्वारा रखता है।
- source_word: חַי יְהוָה
  choice: जीवित याहवे की शपथ
  rationale: यह स्थिर शपथ-सूत्र है; शाब्दिक ‘याहवे जीवित है’ की अपेक्षा हिन्दी में इसके शपथार्थ को स्पष्ट और स्वाभाविक बनाता है।
- source_word: אֲשֶׁר הֶעֱלָה
  choice: जो ... निकाल लाया
  rationale: निर्गमन के प्रसंग में हिफ़ील क्रिया का आशय किसी देश से बाहर ले आने का है; हिन्दी में ‘निकाल लाया’ यही गति स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: मूल के पुरुषवाचक संबंध-पद को औपचारिक रूप से सुरक्षित रखता है, जबकि अधिक मुहावरेदार सामूहिक अर्थ पाद-टिप्पणी में दिया गया है।
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: मिस्र देश से
  rationale: ‘देश’ को बनाए रखकर मूल पदबंध और उसके वाचा-ऐतिहासिक स्वर को सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है; ‘याहवे’ उसका सीधा लिप्यंतरण है और उसे उपाधि में नहीं बदलता।
- issue: בְּנֵי יִשְׂרָאֵל में लिंग और सामूहिक अर्थ
  choice: इस्राएल के पुत्रों
  alternative: इस्राएलियों
  rationale: मुख्य पाठ मूल की पुरुषवाचक संरचना बनाए रखता है; पाद-टिप्पणी स्पष्ट करती है कि प्रसंग में यह इस्राएलियों के लिए सामूहिक जातिनाम भी है।
- issue: חַי יְהוָה का वाक्यगत बल
  choice: जीवित याहवे की शपथ
  alternative: याहवे के जीवन की शपथ / याहवे जीवित है
  rationale: यह कथन मात्र नहीं, एक प्रचलित शपथ-सूत्र है; चयनित रूप उसके प्रकार्य को स्पष्ट करता है, बिना शपथ की विषयवस्तु बदले।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण भविष्यवाणी-शैली के साथ सामान्य पाठक के लिए स्पष्ट वाक्य-विन्यास। ‘देखो’ मूल के ध्यानाकर्षक संकेत को रखता है, और डैश संदेश-सूत्र को मुख्य वाक्य से स्पष्ट करते हैं। यह पद अगले पद में पूरी होने वाली उक्ति का आरंभ है, इसलिए अंत में अल्पविराम रखा गया है।
