base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/034.yaml
  text: And as for the prophet[a], the priest, or the people who say, “The burden of Yahweh,” I will punish that man and his household.
translation:
  language: hi
  text: और यदि कोई नबी हो, याजक हो या लोगों में से कोई कहे, “याहवे का बोझ[a],” तो मैं उस व्यक्ति और उसके घराने को दण्ड दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “याहवे की ईशवाणी।” हिब्रू शब्द मस्सा का अर्थ “ईशवाणी” हो सकता है, पर यहाँ यिर्मयाह उसके अधिक शाब्दिक अर्थ “बोझ” का उपयोग अपनी फटकार में करते जान पड़ते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנָּבִיא
  choice: नबी
  rationale: नָבִיא का प्रचलित, सहज और गरिमापूर्ण हिन्दी रूप; समन्वित पदों के साथ निश्चितता का भाव स्वाभाविक वाक्य-विन्यास में निहित है।
- source_word: הַכֹּהֵן
  choice: याजक
  rationale: כֹּהֵן के लिए मानक बाइबलीय हिन्दी पद, जो धार्मिक पदाधिकारी का अर्थ स्पष्ट रखता है।
- source_word: הָעָם אֲשֶׁר יֹאמַר
  choice: लोगों में से कोई कहे
  rationale: यद्यपि עָם सामूहिक रूप से ‘लोग’ है, एकवचन יֹאמַר और आगे הָאִישׁ הַהוּא प्रत्येक दोषी व्यक्ति पर दण्ड केंद्रित करते हैं; हिन्दी में यह वितरणार्थ स्पष्ट और स्वाभाविक है।
- source_word: מַשָּׂא יְהוָה
  choice: याहवे का बोझ
  rationale: מַשָּׂא का अर्थ ‘भविष्यवाणी/ईशवाणी’ हो सकता है, पर इस प्रसंग में उसके शाब्दिक अर्थ ‘बोझ’ पर आधारित शब्द-क्रीड़ा और फटकार प्रमुख है।
- source_word: יְהוָה
  choice: याहवे
  rationale: हिब्रू व्यक्तिगत ईश्वरीय नाम को नाम के रूप में प्रत्यक्ष प्रस्तुत करता है।
- source_word: וּפָקַדְתִּי עַל
  choice: मैं ... दण्ड दूँगा
  rationale: न्याय के इस संदर्भ में פקד על का स्पष्ट अर्थ दण्ड देना या न्याय करना है।
- source_word: הָאִישׁ הַהוּא
  choice: उस व्यक्ति
  rationale: निर्दिष्ट एकवचन दोषी को दर्शाता है; ‘व्यक्ति’ नबी, याजक अथवा लोगों में से किसी सदस्य—सभी पर स्वाभाविक रूप से लागू होता है।
- source_word: בֵּיתוֹ
  choice: उसके घराने
  rationale: בַּיִת यहाँ केवल भवन नहीं, बल्कि परिवार अथवा गृहस्थी को सूचित करता है; ‘घराना’ इस सामाजिक अर्थ को सुरक्षित रखता है।
theological_decisions:
- issue: מַשָּׂא יְהוָה का अर्थ और यिर्मयाह की शब्द-क्रीड़ा
  choice: याहवे का बोझ
  alternative: याहवे की ईशवाणी
  rationale: ‘ईशवाणी’ पद के पारिभाषिक अर्थ को व्यक्त करता, लेकिन 23:33–40 में ‘बोझ’ का शाब्दिक अर्थ फटकार का आधार बनता है। मुख्य पाठ में ‘बोझ’ और पादटिप्पणी में वैकल्पिक अर्थ रखने से दोनों अर्थ सुरक्षित रहते हैं।
- issue: יְהוָה का निरूपण
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में उपस्थित व्यक्तिगत ईश्वरीय नाम को बिना किसी सम्प्रदायगत व्याख्या के नाम के रूप में रखा गया है।
- issue: दण्ड का व्यक्तिगत लक्ष्य
  choice: लोगों में से कोई ... उस व्यक्ति
  alternative: लोग ... उस मनुष्य
  rationale: एकवचन क्रिया और ‘उस व्यक्ति’ प्रत्येक बोलने वाले को अलग-अलग उत्तरदायी ठहराते हैं; यह सामूहिक ‘लोग’ को बिना भेद के दण्डित करने का अर्थ नहीं देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल किंतु गरिमापूर्ण शैली। समन्वित कर्ताओं और हिब्रू एकवचन क्रिया का वितरणार्थ ‘लोगों में से कोई’ द्वारा स्पष्ट किया गया है। ‘दण्ड’ और ‘घराना’ सामान्य पाठक के लिए समझने योग्य बाइबलीय शब्दावली हैं।
