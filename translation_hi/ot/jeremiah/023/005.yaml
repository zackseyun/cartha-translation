  text: הִנֵּ֨ה יָמִ֤ים בָּאִים֙ נְאֻם יְהוָ֔ה וַ/הֲקִמֹתִ֥י לְ/דָוִ֖ד צֶ֣מַח צַדִּ֑יק וּ/מָ֤לַךְ מֶ֨לֶךְ֙ וְ/הִשְׂכִּ֔יל וְ/עָשָׂ֛ה מִשְׁפָּ֥ט וּ/צְדָקָ֖ה בָּ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/005.yaml
  text: Behold[a], days are coming, declares Yahweh, when I will raise up for David a righteous Branch, and he will reign as king and act wisely[b], and he will do justice and righteousness in the land.
translation:
  language: hi
  text: “देखो, वे दिन आ रहे हैं,” याहवे की यह घोषणा है, “जब मैं दाऊद के लिए एक धर्मी अंकुर[a] उत्पन्न करूँगा। वह राजा होकर राज्य करेगा और बुद्धिमानी से कार्य करेगा[b]; वह देश में न्याय और धार्मिकता करेगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “धर्मी शाखा” अथवा “धर्मी कोंपल।” इब्रानी रूपक दाऊद के वंश से निकलने वाले एक दाऊदी वंशज को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या “कुशलता से काम करेगा” अथवा “सफल होगा।” इब्रानी क्रिया में बुद्धिमानी से कार्य करने और उसके फलस्वरूप सफल होने—दोनों भाव हो सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह भविष्यसूचक घोषणा की ओर गंभीरता से ध्यान खींचता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: יָמִים בָּאִים
  choice: वे दिन आ रहे हैं
  rationale: यह भविष्य में परमेश्वर द्वारा ठहराए गए समय की परिचित भविष्यसूचक अभिव्यक्ति को बनाए रखता है।
- source_word: נְאֻם יְהוָה
  choice: याहवे की यह घोषणा है
  rationale: נְאֻם की अधिकारपूर्ण भविष्यसूचक घोषणा और יְהוָה के व्यक्तिगत वाचा-नाम, दोनों को स्पष्ट रूप से व्यक्त करता है।
- source_word: וַהֲקִמֹתִי
  choice: उत्पन्न करूँगा
  rationale: हिफ़ील रूप यहाँ दाऊद के वंश से एक शासक को प्रकट करने या खड़ा करने का भाव रखता है; ‘उत्पन्न करूँगा’ अंकुर के रूपक के साथ हिन्दी में स्वाभाविक है।
- source_word: לְדָוִד
  choice: दाऊद के लिए
  rationale: पूर्वसर्ग के स्पष्ट रूप को बनाए रखता है और ‘दाऊद के घराने में’ जैसी व्याख्यात्मक वृद्धि से बचता है।
- source_word: צֶמַח צַדִּיק
  choice: एक धर्मी अंकुर
  rationale: צֶמַח का वनस्पति-संबंधी रूपक और दाऊद के वंश से निकलने वाली नई राजकीय शाखा का संकेत सुरक्षित रहता है।
- source_word: וּמָלַךְ מֶלֶךְ
  choice: वह राजा होकर राज्य करेगा
  rationale: क्रिया और समान-मूल संज्ञा के द्वारा दिए गए राजकीय बलाघात को यथासंभव स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וְהִשְׂכִּיל
  choice: बुद्धिमानी से कार्य करेगा
  rationale: राजकीय संदर्भ में विवेकपूर्ण और कुशल आचरण को सामने रखता है, जबकि सफलता या समृद्धि का संभावित अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: מִשְׁפָּט וּצְדָקָה
  choice: न्याय और धार्मिकता
  rationale: यह जोड़ी न्यायपूर्ण शासन और नैतिक-वाचागत सहीपन, दोनों को व्यक्त करती है।
- source_word: בָאָרֶץ
  choice: देश में
  rationale: यिर्मयाह के राजकीय और यहूदा-केंद्रित संदर्भ में ‘देश’ सर्वाधिक स्वाभाविक है, यद्यपि शब्द का व्यापक अर्थ ‘पृथ्वी’ भी हो सकता है।
theological_decisions:
- issue: दाऊद के ‘अंकुर’ का मसीहाई आशय
  choice: दाऊदी वंश और राजकीय रूपक को पाठ में बनाए रखना, पर व्यक्ति को स्पष्ट रूप से ‘मसीह’ या किसी अन्य नाम से न पहचानना
  alternative: ‘अंकुर’ को उपाधि बनाकर प्रस्तुत करना अथवा सीधे ‘मसीह’ कहना
  rationale: इब्रानी पाठ इस भावी व्यक्ति को दाऊद से संबंधित धर्मी צֶמַח और राजा के रूप में प्रस्तुत करता है, पर उसे यहाँ सीधे ‘मसीह’ नहीं कहता। हिन्दी में अक्षर-पूँजीकरण से उपाधि सूचित नहीं की जा सकती, इसलिए रूपक को बिना अतिरिक्त पहचान जोड़े रखा गया है।
- issue: वְהִשְׂכִּיל में बुद्धिमानी और सफलता का संबंध
  choice: मुख्य पाठ में ‘बुद्धिमानी से कार्य करेगा’
  alternative: ‘सफल होगा’ या ‘समृद्ध होगा’
  rationale: क्रिया विवेकपूर्ण आचरण और उससे मिलने वाली सफलता दोनों को समेट सकती है। निकटवर्ती न्यायपूर्ण शासन के संदर्भ में विवेकपूर्ण कार्य मुख्य पाठ के लिए उपयुक्त है, और फलस्वरूप सफलता की छाया पादटिप्पणी में दी गई है।
- issue: ईश्वरीय नाम יְהוָה
  choice: याहवे
  alternative: यहोवा या प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम सीधे आया है; लिप्यंतरण उसे किसी पदवी से बदलने के बजाय सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। भविष्यसूचक उद्घोषणा की गंभीरता के लिए ‘देखो’ और ‘याहवे की यह घोषणा है’ प्रयुक्त हैं। ‘राजा होकर राज्य करेगा’ जानबूझकर हल्की पुनरुक्ति रखता है, क्योंकि मूल इब्रानी में समान-मूल क्रिया और संज्ञा से राजत्व पर बल दिया गया है।
