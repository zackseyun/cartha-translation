id: JER.23.19
reference: Jeremiah 23:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הִנֵּ֣ה סַעֲרַ֣ת יְהוָ֗ה חֵמָה֙ יָֽצְאָ֔ה וְ/סַ֖עַר מִתְחוֹלֵ֑ל עַ֛ל רֹ֥אשׁ רְשָׁעִ֖ים יָחֽוּל׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/019.yaml
  text: Look[a], the storm of Yahweh has gone out in wrath, a whirling tempest[c][b]; it will whirl down on the head of the wicked.
translation:
  language: hi
  text: देखो, यहोवा का तूफ़ान—उसका प्रचण्ड क्रोध—निकल पड़ा है[a], एक घूमता हुआ बवंडर; वह दुष्टों के सिर पर घूमता हुआ आ पड़ेगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘निकल पड़ा है’ पूर्णकाल में है; भावी न्याय को इतना निश्चित बताया गया है मानो वह पहले ही चल पड़ा हो।
    reason: व्याकरणिक अस्पष्टता और भविष्यसूचक पूर्णकाल की शक्ति स्पष्ट करना।
  - marker: b
    text: इसका अनुवाद ‘दुष्टों के सिर पर टूट पड़ेगा’ भी हो सकता है; अन्तिम इब्रानी क्रिया तूफ़ान के घूमने और उसके प्रचण्ड प्रहार, दोनों पर बल दे सकती है।
    reason: अन्तिम इब्रानी क्रिया के सम्भव गतिशील अर्थों को सुरक्षित रखना।
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह शब्द घोषणा को तात्कालिक और सजीव बनाता है। ‘देखो’ आधुनिक हिन्दी में स्वाभाविक है और ध्यान आकर्षित करने की मूल शक्ति को बनाए रखता है।
- source_word: סַעֲרַת יְהוָה
  choice: यहोवा का तूफ़ान
  rationale: סַעֲרָה प्रचण्ड तूफ़ान या आँधी को सूचित करता है। ‘तूफ़ान’ सामान्य पाठक के लिए स्पष्ट है, और सम्बन्धवाचक रचना इसे यहोवा से आने वाला या उसका तूफ़ान बताती है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ के विशिष्ट वाचा-नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ द्वारा सुरक्षित रखा गया है।
- source_word: חֵמָה
  choice: उसका प्रचण्ड क्रोध
  rationale: यह संज्ञा उग्र रोष या प्रकोप व्यक्त करती है। इसे तूफ़ान के समानाधिकरणात्मक वर्णन के रूप में रखा गया है; ‘उसका’ हिन्दी में सम्बन्ध स्पष्ट करता है, बिना क्रोध को तूफ़ान से अलग घटना बनाए।
- source_word: יָצְאָה
  choice: निकल पड़ा है
  rationale: इब्रानी पूर्ण क्रिया न्याय को इतना निश्चित दिखाती है मानो वह पहले ही चल पड़ा हो। हिन्दी का वर्तमान पूर्ण रूप इस भविष्यसूचक निश्चितता को बनाए रखता है।
- source_word: וְסַעַר מִתְחוֹלֵל
  choice: वह एक घूमता हुआ बवंडर है
  rationale: यह पद पहले तूफ़ान का और अधिक तीव्र वर्णन करता है। ‘घूमता हुआ बवंडर’ हिंसक घूर्णन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עַל רֹאשׁ רְשָׁעִים
  choice: दुष्टों के सिर पर
  rationale: इब्रानी में एकवचन ‘सिर’ और बहुवचन ‘दुष्टों’ का सामूहिक मुहावरा है; हिन्दी में यही रूप अर्थ और चित्र दोनों को सुरक्षित रखता है।
- source_word: יָחוּל
  choice: टूट पड़ेगा
  rationale: सन्दर्भ में क्रिया घूमते तूफ़ान के हिंसक रूप से आ पड़ने को दर्शाती है। ‘टूट पड़ेगा’ उसके प्रहार को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि पादटिप्पणी घूर्णन के सम्भव बल को सुरक्षित रखती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: पद में चार-अक्षरीय विशिष्ट ईश्वरीय नाम सीधे आया है। उसका लिप्यंतरण वाचा-संबंधी नाम को सामान्य उपाधि में बदलने से बचाता है।
- issue: भविष्यसूचक पूर्णकाल יָצְאָה
  choice: निकल पड़ा है
  alternative: निकल पड़ेगा
  rationale: पूर्ण क्रिया भावी न्याय को पहले से आरम्भ या निश्चित घटना के रूप में प्रस्तुत करती है। वर्तमान पूर्ण रूप उस अलंकारिक तनाव को बनाए रखता है।
- issue: חֵמָה का वाक्यगत सम्बन्ध
  choice: 'तूफ़ान का समानाधिकरणात्मक वर्णन: ‘उसका प्रचण्ड क्रोध’'
  alternative: 'अलग वाक्य: ‘क्रोध निकल पड़ा है’'
  rationale: इब्रानी वाक्य-रचना दोनों सम्बन्धों की गुंजाइश देती है। चुना गया रूप तूफ़ान और यहोवा के प्रकोप की घनिष्ठ पहचान बनाए रखता है, पर उसे किसी विशिष्ट व्यवस्थित धर्मवैज्ञानिक व्याख्या में सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सजीव, गम्भीर और भविष्यवाणी-संगत शैली रखी गई है। छोटे वाक्यों और परिचित शब्दों से पठनीयता बनाए रखते हुए तूफ़ान, क्रोध और निश्चित न्याय की काव्यात्मक तीव्रता सुरक्षित की गई है।
