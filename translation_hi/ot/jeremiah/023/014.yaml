reference: Jeremiah 23:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/בִ/נְבִאֵ֨י יְרוּשָׁלִַ֜ם רָאִ֣יתִי שַׁעֲרוּרָ֗ה נָא֞וֹף וְ/הָלֹ֤ךְ בַּ/שֶּׁ֨קֶר֙ וְ/חִזְּקוּ֙ יְדֵ֣י מְרֵעִ֔ים לְ/בִ֨לְתִּי שָׁ֔בוּ אִ֖ישׁ מֵ/רָֽעָת֑/וֹ הָֽיוּ לִ֤/י כֻלָּ/ם֙ כִּ/סְדֹ֔ם וְ/יֹשְׁבֶ֖י/הָ כַּ/עֲמֹרָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/014.yaml
  text: 'And among the prophets of Jerusalem I have seen a horrible thing: committing adultery and walking in falsehood[a]; they have strengthened the hands of evildoers, so that no man turns back from his evil. All of them are to me like Sodom[b], and her inhabitants like Gomorrah.'
translation:
  language: hi
  text: 'और यरूशलेम के नबियों में मैंने एक भयानक बात देखी है: वे व्यभिचार करते और झूठ के मार्ग पर चलते हैं; उन्होंने बुराई करने वालों के हाथ मज़बूत किए हैं, जिससे कोई भी अपनी बुराई से नहीं लौटता। वे सब मेरे लिए सदोम के समान हैं, और यरूशलेम के निवासी अमोरा के समान।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבִנְבִיאֵי יְרוּשָׁלִַם
  choice: और यरूशलेम के नबियों में
  rationale: ב को समूह के भीतर स्थान के अर्थ में ‘में’ रखा गया है; आरंभिक ו को सरल संयोजक ‘और’ से व्यक्त किया गया है।
- source_word: שַׁעֲרוּרָה
  choice: एक घिनौनी बात
  rationale: यह शब्द नैतिक रूप से अत्यंत आपत्तिजनक और भयावह बात का बोध कराता है; ‘घिनौनी बात’ आधुनिक हिन्दी में स्वाभाविक और तीखा है।
- source_word: נָאוֹף
  choice: वे व्यभिचार करते
  rationale: इब्रानी रूप की क्रियात्मक शक्ति बनाए रखने के लिए इसे केवल संज्ञा ‘व्यभिचार’ के बजाय क्रिया के रूप में अनूदित किया गया है।
- source_word: וְהָלֹךְ בַּשֶּׁקֶר
  choice: और झूठ के मार्ग पर चलते हैं
  rationale: הלך की चाल-चलन संबंधी रूपकात्मकता तथा שקר के झूठ/मिथ्याचार के क्षेत्र को सहज हिन्दी में बनाए रखता है।
- source_word: וְחִזְּקוּ יְדֵי מְרֵעִים
  choice: वे बुराई करनेवालों के हाथ मजबूत करते हैं
  rationale: ‘हाथ मजबूत करना’ प्रोत्साहित या निर्भीक करने का इब्रानी मुहावरा है और हिन्दी में भी समझ में आनेवाला चित्र है।
- source_word: לְבִלְתִּי שָׁבוּ אִישׁ מֵרָעָתוֹ
  choice: जिससे कोई भी अपनी बुराई से नहीं फिरता
  rationale: לבלתי को परिणामसूचक ‘जिससे’ और שוב को उसके दिशा-परिवर्तन तथा पश्चाताप-संबंधी संकेत सहित ‘फिरता’ कहा गया है; איש का यहाँ वितरणात्मक प्रतिनिधि अर्थ ‘कोई भी’ है।
- source_word: הָיוּ לִי כֻלָּם כִּסְדֹם
  choice: वे सब मेरे लिए सदोम के समान हैं
  rationale: לִי में निहित वक्ता के मूल्यांकन को ‘मेरे लिए’ से और तुलना को स्पष्ट रूप से रखा गया है।
- source_word: וְיֹשְׁבֶיהָ כַּעֲמֹרָה
  choice: और यरूशलेम के निवासी अमोरा के समान
  rationale: स्त्रीलिंग प्रत्यय का संदर्भ यरूशलेम है; हिन्दी में अस्पष्ट ‘उसके’ के बजाय नगर का नाम दोहराने से संदर्भ स्पष्ट रहता है।
theological_decisions:
- issue: אִישׁ का वितरणात्मक एकवचन
  choice: कोई भी अपनी बुराई से नहीं फिरता
  alternative: कोई पुरुष अपनी बुराई से नहीं फिरता
  rationale: यहाँ איש किसी एक पुरुष की पहचान नहीं, बल्कि समूह के प्रत्येक सदस्य को प्रतिनिधि रूप से सूचित करता है; ‘कोई भी’ हिन्दी में उसी वितरणात्मक अर्थ को स्वाभाविक ढंग से देता है।
- issue: שוב में पश्चाताप का भाव
  choice: अपनी बुराई से नहीं फिरता
  alternative: अपनी बुराई से पश्चाताप नहीं करता
  rationale: ‘फिरना’ मूल क्रिया के दिशा बदलनेवाले चित्र को सुरक्षित रखता है और संदर्भ में नैतिक पश्चाताप का भाव भी व्यक्त होने देता है, बिना उसे अधिक स्पष्ट धार्मिक शब्दावली में सीमित किए।
- issue: सदोम और अमोरा से तुलना
  choice: वे सब मेरे लिए सदोम के समान हैं, और यरूशलेम के निवासी अमोरा के समान
  alternative: वे सब मेरी दृष्टि में सदोम और उसके निवासी अमोरा के समान हैं
  rationale: 'दो समानांतर तुलनाओं को अलग रखा गया है: नबी सदोम के समान और यरूशलेम के निवासी अमोरा के समान। इससे मूल की न्याय-संबंधी तुलना बिना अतिरिक्त व्याख्या के बनी रहती है।'
translation_notes:
  register: भाषा आधुनिक, dignified और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘झूठ के मार्ग पर चलना’ और ‘हाथ मजबूत करना’ जैसे मूल रूपक हिन्दी में अर्थगम्य होने के कारण सुरक्षित रखे गए हैं।
