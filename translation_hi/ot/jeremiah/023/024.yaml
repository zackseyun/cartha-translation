id: JER.23.24
reference: Jeremiah 23:24
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אִם יִסָּתֵ֨ר אִ֧ישׁ בַּ/מִּסְתָּרִ֛ים וַ/אֲנִ֥י לֹֽא אֶרְאֶ֖/נּוּ נְאֻם יְהוָ֑ה הֲ/ל֨וֹא אֶת הַ/שָּׁמַ֧יִם וְ/אֶת הָ/אָ֛רֶץ אֲנִ֥י מָלֵ֖א נְאֻם יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/024.yaml
  text: Can a man hide himself in secret places so that I do not see him? declares Yahweh[b][a]. Do I not fill heaven and earth? declares Yahweh.
translation:
  language: hi
  text: क्या कोई मनुष्य गुप्त स्थानों में अपने आप को इस तरह छिपा सकता है कि मैं उसे न देखूँ?[a]—यह याहवे की घोषणा है। क्या मैं आकाश और पृथ्वी को नहीं भरता?[b]—यह याहवे की घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इसे इस प्रकार भी अनुवाद किया जा सकता है: “यदि कोई मनुष्य गुप्त स्थानों में छिपे, तो क्या मैं उसे नहीं देखूँगा?”'
    reason: इब्रानी אִם को शर्तवाचक रूप में भी समझा जा सकता है, जबकि मुख्य पाठ उसका आलंकारिक प्रश्नवाचक बल प्रस्तुत करता है।
  - marker: b
    text: इब्रानी में “आकाशों और पृथ्वी” है।
    reason: इब्रानी הַשָּׁמַיִם रूपतः बहुवचन है; मुख्य पाठ में हिन्दी के स्वाभाविक प्रयोग के अनुसार ‘आकाश’ है।
lexical_decisions:
- source_word: אִם יִסָּתֵר אִישׁ
  choice: क्या कोई मनुष्य ... अपने आपको ... छिपा सकता है
  rationale: אִם यहाँ सामान्य शर्त से अधिक एक आलंकारिक चुनौती आरम्भ करता है। हिन्दी में ‘क्या ... सकता है’ उसका अपेक्षित नकारात्मक उत्तर और स्वाभाविक प्रश्नवाचक बल बनाए रखता है; निफ़अल יִסָּתֵר को प्रसंगानुसार आत्मवाचक रूप में व्यक्त किया गया है।
- source_word: בַּמִּסְתָּרִים
  choice: गुप्त स्थानों में
  rationale: बहुवचन संज्ञा छिपे हुए स्थानों या कोनों का बोध कराती है; यह रूप बहुवचन और अर्थ दोनों को सहज हिन्दी में सुरक्षित रखता है।
- source_word: וַאֲנִי לֹא אֶרְאֶנּוּ
  choice: इस तरह ... कि मैं उसे न देखूँ
  rationale: शाब्दिक संयोजक ‘और’ यहाँ छिपने के कथित परिणाम को सामने रखता है। ‘इस तरह ... कि’ हिन्दी में आलंकारिक प्रश्न का आशय स्पष्ट करता है, बिना इस दावे को बदलकर कि याहवे उस व्यक्ति को देखता है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: नबी-संबंधी सूत्र נְאֻם का भार ‘घोषणा’ से बना रहता है और יְהוָה को उपाधि से बदलने के बजाय उसके व्यक्तिगत नाम ‘याहवे’ के रूप में प्रस्तुत किया गया है।
- source_word: הֲלוֹא
  choice: क्या ... नहीं
  rationale: यह प्रश्नवाचक अव्यय सहमति-सूचक उत्तर की अपेक्षा करता है; हिन्दी का ‘क्या ... नहीं’ उसी आलंकारिक बल को सुरक्षित रखता है।
- source_word: אֶת הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: आकाश और पृथ्वी को
  rationale: यह युग्म समस्त सृष्टि को समेटने वाला प्रचलित द्वंद्व है। ‘आकाश और पृथ्वी’ आधुनिक हिन्दी में स्वाभाविक है; इब्रानी הַשָּׁמַיִם का रूपात्मक बहुवचन पादटिप्पणी में बताया गया है।
- source_word: אֲנִי מָלֵא
  choice: मैं ... भरता
  rationale: ‘भरता’ मूल के सशक्त स्थानात्मक रूपक को बनाए रखता है और उसे ‘सर्वव्यापी हूँ’ जैसी धर्मवैज्ञानिक व्याख्या में नहीं बदलता।
theological_decisions:
- issue: ईश्वरीय सर्वव्यापकता की भाषा
  choice: क्या मैं आकाश और पृथ्वी को नहीं भरता?
  alternative: क्या मैं सारे आकाश और पृथ्वी में उपस्थित नहीं हूँ?
  rationale: मूल पाठ ‘भरने’ का रूपक प्रयोग करता है। चुना हुआ अनुवाद उसी ठोस और धर्मवैज्ञानिक रूप से अर्थपूर्ण भाषा को सुरक्षित रखता है, न कि उसे अमूर्त सिद्धान्त में समझाकर प्रस्तुत करता है।
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में वाचा-संबंधी व्यक्तिगत नाम सीधे प्रयुक्त हुआ है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और नाम को किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: पहले प्रश्न की वाक्यगत सम्भावना
  choice: क्या कोई मनुष्य ... छिपा सकता है कि मैं उसे न देखूँ?
  alternative: यदि कोई मनुष्य गुप्त स्थानों में छिपे, तो क्या मैं उसे नहीं देखूँगा?
  rationale: אִם सामान्यतः ‘यदि’ है, पर इस संरचना में आलंकारिक चुनौती भी व्यक्त कर सकता है। मुख्य पाठ स्वाभाविक हिन्दी में चुनौती को रखता है; वैकल्पिक शर्तवाचक विश्लेषण को पादटिप्पणी में सुरक्षित किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; स्वर गरिमापूर्ण, प्रत्यक्ष और सामान्य पाठक के लिए सुबोध है। ‘मनुष्य’ मूल के एकवचन पुल्लिंग सामान्य-संज्ञक रूप को रखता है। भविष्यकाल ‘देखूँगा’ के बजाय संभावनार्थक ‘देखूँ’ प्रश्न की चुनौती के साथ अधिक स्वाभाविक है। हर पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित है।
