base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/038.yaml
  text: 'But if you say[a], ‘The burden of Yahweh,’ therefore this is what Yahweh says: Because you have said this word, ‘The burden of Yahweh,’ though I sent to you, saying, ‘You shall not say, “The burden of Yahweh,”’'
translation:
  language: hi
  text: 'पर यदि तुम कहो[a], “याहवे का भार,” तो याहवे यों कहता है: “क्योंकि तुमने यह बात कही है, ‘याहवे का भार,’ जबकि मैंने तुम्हें यह कहते हुए भेजा था, ‘तुम यह न कहना, “याहवे का भार,”’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “याहवे की ईशवाणी।” इब्रानी शब्द मस्सा का अर्थ भविष्यद्वक्ताई वचन भी हो सकता है; यहाँ “भार” रखने से इस अनुच्छेद में बार-बार दोहराई गई शब्द-क्रीड़ा सुरक्षित रहती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: पर यदि
  rationale: यह पिछले निषेध के विपरीत एक शर्त प्रस्तुत करता है; ‘पर यदि’ संयोजक और विरोधात्मक, दोनों बलों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מַשָּׂא
  choice: भार
  rationale: इस शब्द का अर्थ बोझ/भार और भविष्यद्वाणी-संबंधी वचन, दोनों हो सकता है। ‘भार’ रखने से इस अनुच्छेद की पुनरुक्ति, शब्द-क्रीड़ा और व्यंग्य सुरक्षित रहते हैं।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय ईश्वरीय नाम को उपाधि में बदलने के बजाय नाम के रूप में प्रस्तुत किया गया है।
- source_word: תֹּאמֵרוּ
  choice: तुम कहो
  rationale: द्वितीय पुरुष बहुवचन के सामान्य कथन-क्रिया रूप का सीधा और स्वाभाविक अनुवाद।
- source_word: לָכֵן
  choice: तो
  rationale: शर्त के परिणाम और आने वाली न्याय-घोषणा के तार्किक संबंध को आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: כֹּה אָמַר יְהוָה
  choice: याहवे यह कहता है
  rationale: मानक भविष्यद्वक्ताई संदेश-सूत्र को स्पष्ट, गरिमापूर्ण और वर्तमान हिन्दी में रखा गया है।
- source_word: יַעַן
  choice: क्योंकि
  rationale: यह दण्ड की घोषणा का कारण प्रस्तुत करता है।
- source_word: אֲמָרְכֶם אֶת־הַדָּבָר הַזֶּה
  choice: तुमने यह बात कही है
  rationale: דבר यहाँ उनके द्वारा बोले गए विशेष वाक्यांश की ओर संकेत करता है; ‘यह बात’ हिन्दी में स्वाभाविक रहते हुए उस निश्चित कथन को बनाए रखता है।
- source_word: וָאֶשְׁלַח אֲלֵיכֶם לֵאמֹר
  choice: जबकि मैंने तुम्हें यह कहला भेजा था
  rationale: 'वाव् का प्रसंगगत रियायती भाव व्यक्त होता है: पहले से चेतावनी भेजे जाने के बावजूद उन्होंने वही पद कहा। ‘कहला भेजा’ किसी अनिर्दिष्ट संदेशवाहक को पाठ में जोड़े बिना संप्रेषण का भाव देता है।'
- source_word: לֹא תֹאמְרוּ
  choice: तुम यह न कहना
  rationale: निषेध को सीधी, गंभीर और स्वाभाविक हिन्दी में प्रस्तुत करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में वाचा का विशिष्ट नाम है; ‘याहवे’ उसे सामान्य उपाधि बनाए बिना नाम के रूप में सुरक्षित रखता है।
- issue: भविष्यद्वक्ताई संदर्भ में מַשָּׂא
  choice: भार
  alternative: ईशवाणी / भविष्यद्वाणी का वचन / संदेश
  rationale: संदर्भ में इस पद के दुरुपयोग पर वाक्-प्रहार है। ‘भार’ मूल की पुनरुक्ति और सम्भावित शब्द-क्रीड़ा को सुरक्षित रखता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- issue: וָאֶשְׁלַח का प्रसंगगत संबंध
  choice: जबकि मैंने…कहला भेजा था
  alternative: और मैंने…कहला भेजा था
  rationale: मूल संयोजक का साधारण अर्थ ‘और’ सम्भव है, पर प्रसंग चेतावनी के बावजूद अवज्ञा को रेखांकित करता है। ‘जबकि’ उसी निहित तनाव को व्यक्त करता है, बिना कथ्य बदले।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सीधे भविष्यद्वक्ताई कथन का प्रयोग किया गया है। उद्धरणों के भीतर उद्धरण स्पष्ट रखने के लिए दोहरे और एकहरे उद्धरण-चिह्न क्रमशः प्रयुक्त हैं। पद अगले वाक्यांश की ओर बढ़ता है, इसलिए मूल की अधूरी वाक्य-संरचना को कृत्रिम रूप से पूरा नहीं किया गया।
