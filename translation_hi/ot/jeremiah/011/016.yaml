- from: यहोवा ने तुम्हारा नाम रखा था, “हरा-भरा जैतून का पेड़, सुंदर और अच्छे फल वाला।” पर बड़े कोलाहल की आवाज़ के साथ उसने उसमें आग लगा दी, और उसकी डालियाँ नष्ट हो गईं।
  to: यहोवा ने तुम्हारा नाम रखा था, “हरे-भरे जैतून का पेड़, जिसके फल और रूप सुंदर हैं।” बड़े कोलाहल की आवाज़ पर उसने उसमें आग लगा दी, और उसकी डालियाँ नष्ट हो गईं।
  rationale: The revision corrects the rendering of the difficult phrase יפה פרי תאר by retaining its two elements, fruit and form, without choosing an overly narrow interpretation. It also makes the relation expressed by לקול more exact while maintaining the draft’s natural register and its explicit divine subject.
