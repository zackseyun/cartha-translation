  edition: WLC
  text: זַ֤יִת רַֽעֲנָן֙ יְפֵ֣ה פְרִי תֹ֔אַר קָרָ֥א יְהוָ֖ה שְׁמֵ֑/ךְ לְ/ק֣וֹל הֲמוּלָּ֣ה גְדֹלָ֗ה הִצִּ֥ית אֵשׁ֙ עָלֶ֔י/הָ וְ/רָע֖וּ דָּלִיּוֹתָֽי/ו־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/016.yaml
  text: The LORD called your name, ‘A green olive tree, beautiful with good fruit.’ At the sound of a great roar he set fire to it, and its branches are ruined.
translation:
  language: hi
  text: यहोवा ने तुम्हारा नाम रखा था, “हरे-भरे जैतून का पेड़, जिसके फल और रूप सुंदर हैं।” बड़े कोलाहल की आवाज़ पर उसने उसमें आग लगा दी, और उसकी डालियाँ नष्ट हो गईं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זַיִת רַעֲנָן
  choice: हरा-भरा जैतून का पेड़
  rationale: रַעֲנָן ताजगी, हरियाली और फलते-फूलते जीवन का भाव देता है; ‘हरा-भरा’ आधुनिक हिन्दी में इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְפֵה פְרִי תֹאַר
  choice: सुंदर और अच्छे फल वाला
  rationale: इब्रानी पदबंध कठिन है और ‘सुंदर फल/रूप’ अथवा ‘सुंदर, अच्छे फल वाला’ जैसे अर्थ दे सकता है। यह चयन संदर्भानुकूल है और फल की गुणवत्ता तथा पेड़ की सुंदरता दोनों को सहज हिन्दी में रखता है।
- source_word: הֲמוּלָּה גְדֹלָה
  choice: बड़ा कोलाहल
  rationale: הֲמוּלָּה भीड़ के शोर, गर्जन या भारी हलचल को सूचित कर सकता है; ‘कोलाहल’ इस व्यापकता को बिना अनावश्यक रूप से केवल ‘गर्जना’ तय किए बनाए रखता है।
- source_word: וְרָעוּ דָּלִיּוֹתָיו
  choice: उसकी डालियाँ नष्ट हो गईं
  rationale: רָעַע का यहाँ भाव टूटने, बिगड़ने या नष्ट होने का है; आग के प्रसंग में ‘नष्ट हो गईं’ स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: कर्ता और दंड का संबंध
  choice: ‘उसने उसमें आग लगा दी’ में यहोवा को कर्ता बनाए रखा गया
  alternative: 'निष्क्रिय रूप: ‘उसमें आग लगा दी गई’'
  rationale: मसोरेटिक पाठ में הִצִּית एकवचन पुल्लिंग कर्ता को जारी रखता है, जिसका निकटतम संदर्भ यहोवा है; इसलिए दैवी न्याय की पाठगत स्पष्टता नहीं हटाई गई।
- issue: ‘नाम रखना’ का रूपक
  choice: ‘तुम्हारा नाम रखा था’
  alternative: ‘तुम्हें कहा था’
  rationale: קָרָא ... שְׁמֵךְ का औपचारिक रूपक पहचान/उपाधि देने का है; इसे केवल संबोधन में सरल करने से मूल की नामकरण-विषयक शक्ति घटती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘यहोवा’ व्यक्तिगत दिव्य नाम को दर्शाता है। स्त्रीलिंग ‘तुम्हारा’ का हिन्दी में अलग रूप न होने से संबोधित यरूशलेम/यहूदा की व्याकरणिक स्त्रीलिंगता संदर्भ से समझी जाती है।
