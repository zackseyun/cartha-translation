  text: אֲשֶׁ֣ר צִוִּ֣יתִי אֶת אֲבֽוֹתֵי/כֶ֡ם בְּ/י֣וֹם הוֹצִיאִֽ/י אוֹתָ֣/ם מֵ/אֶֽרֶץ מִצְרַיִם֩ מִ/כּ֨וּר הַ/בַּרְזֶ֜ל לֵ/אמֹ֗ר שִׁמְע֤וּ בְ/קוֹלִ/י֙ וַ/עֲשִׂיתֶ֣ם אוֹתָ֔/ם כְּ/כֹ֥ל אֲשֶׁר אֲצַוֶּ֖ה אֶתְ/כֶ֑ם וִ/הְיִ֤יתֶם לִ/י֙ לְ/עָ֔ם וְ/אָ֣נֹכִ֔י אֶהְיֶ֥ה לָ/כֶ֖ם לֵ/אלֹהִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/004.yaml
  text: which I commanded your fathers on the day I brought them out from the land of Egypt[a], from the iron furnace, saying, ‘Listen to my voice and do them, according to all that I command you; and you shall be my people[c][b], and I will be your God,’
translation:
  language: hi
  text: जिसे मानने की आज्ञा मैंने तुम्हारे पुरखों[a] को उस दिन दी थी, जब मैं उन्हें मिस्र देश से—लोहे की भट्ठी[b] से—निकाल लाया था। मैंने कहा था, ‘मेरी बात सुनो[c] और जो कुछ मैं तुम्हें आज्ञा देता हूँ, उस सबका पालन करो। और तुम मेरी प्रजा होगे और मैं तुम्हारा परमेश्वर होऊँगा।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘तुम्हारे पिताओं’; यहाँ आशय इस्राएल की पिछली पीढ़ियों से है।
    reason: lexical_alternative
  - marker: b
    text: ‘लोहे की भट्ठी’ मिस्र में कठोर उत्पीड़न और दुःख का रूपक है।
    reason: cultural_note
  - marker: c
    text: ‘मेरी बात सुनो’ का अर्थ यहाँ आज्ञापूर्वक सुनना, अर्थात मेरी बात मानना भी है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר צִוִּיתִי
  choice: जिसे मानने की आज्ञा मैंने … दी थी
  rationale: यह पिछले पद में उल्लिखित वाचा अथवा उसके वचनों से जुड़ा संबंधवाचक उपवाक्य है। हिंदी में ‘मानने की आज्ञा’ संबंध को स्वाभाविक रखते हुए आज्ञा की प्रामाणिकता व्यक्त करता है।
- source_word: אֲבוֹתֵיכֶם
  choice: तुम्हारे पुरखों
  rationale: ‘पुरखे’ आधुनिक हिंदी में पिछली पीढ़ियों के पुरुष पूर्वजों के लिए स्वाभाविक है और इब्रानी के स्पष्ट पुल्लिंग बहुवचन को बनाए रखता है।
- source_word: בְּיוֹם הוֹצִיאִי אוֹתָם מֵאֶרֶץ מִצְרַיִם
  choice: उस दिन … जब मैं उन्हें मिस्र देश से … निकाल लाया था
  rationale: निर्गमन की ठोस कालगत पृष्ठभूमि और ‘मिस्र देश’ की औपचारिक अभिव्यक्ति दोनों सुरक्षित रहती हैं।
- source_word: מִכּוּר הַבַּרְזֶל
  choice: लोहे की भट्ठी
  rationale: मूल रूपक को संक्षिप्त और समझने योग्य हिंदी में रखा गया है; यह मिस्र के कठोर उत्पीड़न का चित्र है।
- source_word: שִׁמְעוּ בְקוֹלִי
  choice: मेरी बात सुनो
  rationale: श्रवण का मूल बिंब बनाए रखता है। प्रसंग में आज्ञापालन का भाव अगली आज्ञा ‘पालन करो’ से स्पष्ट होता है।
- source_word: וַעֲשִׂיתֶם אוֹתָם כְּכֹל אֲשֶׁר אֲצַוֶּה אֶתְכֶם
  choice: जो कुछ मैं तुम्हें आज्ञा देता हूँ, उस सबका पालन करो
  rationale: इब्रानी के व्यापक ‘सब’ और आज्ञाओं को व्यवहार में लाने के अर्थ को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: וִהְיִיתֶם לִי לְעָם
  choice: तब तुम मेरी प्रजा होगे
  rationale: यह वाचा-सूत्र का स्वाभाविक हिंदी रूप है; ‘तब’ आज्ञा और परिणामी वाचा-संबंध के बीच वाक्यगत संबंध स्पष्ट करता है।
- source_word: וְאָנֹכִי אֶהְיֶה לָכֶם לֵאלֹהִים
  choice: मैं तुम्हारा परमेश्वर होऊँगा
  rationale: वाचा-संबंध की पारस्परिकता को प्रचलित और गरिमापूर्ण बाइबिलीय हिंदी में व्यक्त करता है।
theological_decisions:
- issue: पूर्वजों के लिए लिंग-सूचक भाषा
  choice: तुम्हारे पुरखों
  alternative: तुम्हारे पूर्वजों
  rationale: इब्रानी पाठ में ‘पिता’ का पुल्लिंग बहुवचन है। मुख्य पाठ में ‘पुरखों’ से यह रूप बना रहता है, जबकि पादटिप्पणी व्यापक सामूहिक संदर्भ स्पष्ट करती है।
- issue: שִׁמְעוּ בְקוֹלִי में आज्ञापालन का भाव
  choice: मेरी बात सुनो
  alternative: मेरी बात मानो
  rationale: इब्रानी मुहावरे में आज्ञापालन निहित हो सकता है, पर अगला वाक्यांश पालन की माँग को स्पष्ट कर देता है। इसलिए मुख्य पाठ श्रवण के बिंब और आज्ञापालन के तनाव दोनों को बनाए रखता है।
- issue: वाचा-सूत्र में संबंध और परिणाम
  choice: तब तुम मेरी प्रजा होगे
  alternative: और तुम मेरी प्रजा होगे
  rationale: वाव को हिंदी में प्रसंगानुकूल परिणामसूचक ‘तब’ से व्यक्त किया गया है; इससे कोई अतिरिक्त धर्मसैद्धांतिक शर्त नहीं जोड़ी जाती, बल्कि वाक्य का आज्ञा-परिणाम संबंध स्पष्ट होता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। ‘पुरखे,’ ‘भट्ठी,’ और ‘पालन करो’ सामान्य पाठक के लिए सहज हैं। वाक्य का आरंभ संबंधवाचक रूप में रखा गया है, क्योंकि यह पिछले पद के वाचा-वचनों से जुड़ता है।
