id: JER.11.20
reference: Jeremiah 11:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַֽ/יהוָ֤ה צְבָאוֹת֙ שֹׁפֵ֣ט צֶ֔דֶק בֹּחֵ֥ן כְּלָי֖וֹת וָ/לֵ֑ב אֶרְאֶ֤ה נִקְמָֽתְ/ךָ֙ מֵ/הֶ֔ם כִּ֥י אֵלֶ֖י/ךָ גִּלִּ֥יתִי אֶת רִיבִֽ/י־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/020.yaml
  text: But you[a], O Yahweh of hosts, who judge righteously, who test the kidneys and the heart, let me see your vengeance on them[c][b], for to you I have revealed my case.
translation:
  language: hi
  text: 'परन्तु हे सेनाओं के याहवे,

    न्यायपूर्वक न्याय करनेवाले,

    गुर्दों और हृदय को परखनेवाले[a],

    मुझे उन पर तेरा प्रतिशोध[b] देखने दे,

    क्योंकि मैंने अपना मुक़दमा[c] तेरे सामने खोलकर रख दिया है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘गुर्दों और हृदय को’; इब्रानी में यह मनुष्य के सबसे गहरे विचारों, भावनाओं और अभिप्रायों की ओर संकेत करने वाला बिंब है।
    reason: cultural_note
  - marker: b
    text: या, ‘तेरा बदला लेना’; इस प्रसंग में इससे यिर्मयाह को न्याय मिलना और उसका पक्ष सही ठहराया जाना भी सूचित हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या, ‘अपना विवाद’, ‘अपना पक्ष’ अथवा ‘अपना मामला’।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה צְבָאוֹת
  choice: परन्तु हे सेनाओं के याहवे
  rationale: וַ को प्रसंग के विरोधसूचक प्रवाह के अनुसार ‘परन्तु’ किया गया है। याहवे नाम को लिप्यंतरित रखा गया और צְבָאוֹת की व्यापक सैन्य तथा स्वर्गीय छवि के लिए ‘सेनाओं के’ चुना गया।
- source_word: שֹׁפֵט צֶדֶק
  choice: न्यायपूर्वक न्याय करनेवाले
  rationale: कृदन्त प्रभु के निरन्तर चरित्र और कार्य को व्यक्त करता है; צֶדֶק न्याय की सही और धर्मसंगत रीति बताता है।
- source_word: בֹּחֵן כְּלָיוֹת וָלֵב
  choice: गुर्दों और हृदय को परखनेवाले
  rationale: मूल इब्रानी की ठोस मानवशास्त्रीय छवि सुरक्षित रखी गई है। ‘परखनेवाले’ भीतर तक जाँचने के भाव को व्यक्त करता है; मुहावरे का आशय पादटिप्पणी में स्पष्ट है।
- source_word: אֶרְאֶה
  choice: मुझे … देखने दे
  rationale: रूपतः यह प्रथम पुरुष अपूर्ण क्रिया है, पर प्रार्थना के प्रसंग में इच्छासूचक निवेदन है; हिन्दी में यह विनती का स्वाभाविक रूप है।
- source_word: נִקְמָתְךָ מֵהֶם
  choice: उन पर तेरा प्रतिशोध
  rationale: נקמה का सीधा अर्थ प्रतिशोध या बदला लेना है और מֵהֶם यहाँ उसके लक्ष्य को दिखाता है। ‘प्रतिशोध’ ईश्वर के न्यायकारी प्रत्युत्तर का गंभीर भाव बनाए रखता है।
- source_word: אֵלֶיךָ גִּלִּיתִי אֶת רִיבִי
  choice: मैंने अपना मुक़दमा तेरे सामने खोलकर रख दिया है
  rationale: רִיב का न्यायिक भाव ‘मुक़दमा’ से व्यक्त होता है। גלה की ‘खोलने/प्रकट करने’ की छवि को स्वाभाविक हिन्दी ‘सामने खोलकर रख दिया’ में सुरक्षित रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: वाचा-संबंधी व्यक्तिगत नाम को उपाधि में बदलने के बजाय उसका निकट हिन्दी लिप्यंतरण रखा गया है।
- issue: ‘गुर्दों और हृदय’ का मानवशास्त्रीय मुहावरा
  choice: मुख्य पाठ में ठोस इब्रानी बिंब बनाए रखना
  alternative: अन्तर्मन और हृदय / गहरे विचार और अभिप्राय
  rationale: इब्रानी मानवशास्त्र में ये भीतर के विचारों, भावनाओं, इच्छाओं और प्रेरणाओं को सूचित करते हैं। मूल बिंब को पाठ में रखकर अर्थ पादटिप्पणी में बताया गया है, ताकि सांस्कृतिक दूरी मिटे नहीं।
- issue: נקמה में प्रतिशोध और निर्दोष सिद्ध किए जाने का संबंध
  choice: प्रतिशोध
  alternative: बदला लेना / न्याय दिलाना अथवा पक्ष सही ठहराना
  rationale: शब्द का प्राथमिक अर्थ दुष्टों के विरुद्ध प्रतिशोध है, पर इस न्यायिक प्रसंग में उससे यिर्मयाह का पक्ष सही ठहरना भी जुड़ा है; इस अर्थ-छाया को पादटिप्पणी में खुला रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रार्थनात्मक है। ‘करनेवाले/परखनेवाले’ संबोधन की काव्यात्मक समानता को बनाए रखते हैं। ‘गुर्दों’ की सांस्कृतिक अपरिचितता को जानबूझकर मूल बिंब की पारदर्शिता के लिए रखा गया है और पादटिप्पणी से समझाया गया है।
