source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֵלַ֔/י קְרָ֨א אֶת כָּל הַ/דְּבָרִ֤ים הָ/אֵ֨לֶּה֙ בְּ/עָרֵ֣י יְהוּדָ֔ה וּ/בְ/חֻצ֥וֹת יְרוּשָׁלִַ֖ם לֵ/אמֹ֑ר שִׁמְע֗וּ אֶת דִּבְרֵי֙ הַ/בְּרִ֣ית הַ/זֹּ֔את וַ/עֲשִׂיתֶ֖ם אוֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/006.yaml
  text: 'And Yahweh said to me[a], “Proclaim all these words in the cities of Judah and in the streets of Jerusalem[b], saying: Hear the words of this covenant and do them.”'
translation:
  language: hi
  text: 'और याहवे ने मुझसे कहा, “यहूदा के नगरों और यरूशलेम के सार्वजनिक स्थानों[a] में इन सब वचनों की घोषणा कर और कह: ‘इस वाचा के वचन सुनो[b] और उनका पालन करो।’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यरूशलेम की गलियों” अथवा “यरूशलेम के चौकों”; इब्रानी शब्द नगर के खुले सार्वजनिक स्थानों को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: “सुनो” का अनुवाद “ध्यान से सुनो” भी हो सकता है। कुछ अनुवाद इसे “मानो” कहते हैं, पर अगला वाक्यांश पालन करने की बात अलग से कहता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम का देवनागरी लिप्यंतरण किया गया है; इसे किसी उपाधि से नहीं बदला गया।
- source_word: קְרָא
  choice: घोषणा कर
  rationale: यह आज्ञा सार्वजनिक रूप से संदेश सुनाने के लिए है; ‘घोषणा कर’ इस प्रसंग में स्वाभाविक और स्पष्ट है।
- source_word: כָּל הַדְּבָרִים הָאֵלֶּה
  choice: इन सब वचनों
  rationale: भविष्यद्वाणी के प्रसंग और आगे दिए प्रत्यक्ष कथन के कारण דְּבָרִים का अर्थ यहाँ बोले गए ‘वचन’ है।
- source_word: בְּעָרֵי יְהוּדָה
  choice: यहूदा के नगरों में
  rationale: यह इब्रानी के स्थानवाचक और भौगोलिक अर्थ को सीधे बनाए रखता है।
- source_word: וּבְחֻצוֹת יְרוּשָׁלִַם
  choice: और यरूशलेम के सार्वजनिक स्थानों में
  rationale: חֻצוֹת नगर के खुले सार्वजनिक स्थानों को दर्शाता है; यह चुनाव केवल संकरी गलियों का अर्थ देने से बचता है और सार्वजनिक घोषणा के प्रसंग के अनुकूल है।
- source_word: לֵאמֹר
  choice: 'और कह:'
  rationale: यह घोषणा की विषय-वस्तु का परिचय स्वाभाविक हिन्दी में देता है।
- source_word: שִׁמְעוּ
  choice: सुनो
  rationale: मूल क्रिया का प्राथमिक अर्थ ‘सुनना’ है। अगली क्रिया अलग से पालन की माँग करती है, इसलिए दोनों चरणों को बनाए रखा गया है।
- source_word: דִּבְרֵי הַבְּרִית הַזֹּאת
  choice: इस वाचा के वचन
  rationale: यह ‘वचन’ की शाब्दिक कड़ी और वाचा-संबंधी भाषा दोनों को सुरक्षित रखता है।
- source_word: וַעֲשִׂיתֶם אוֹתָם
  choice: और उनका पालन करो
  rationale: वाचा के वचनों को ‘करने’ का आशय उन्हें व्यवहार में लाना है; ‘पालन करो’ आधुनिक हिन्दी में इस अर्थ को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: वाचा-नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा अथवा ‘प्रभु’
  rationale: व्यक्तिगत ईश्वरीय नाम को उपाधि से बदलने के बजाय उसका लिप्यंतरण किया गया है, बिना किसी संप्रदायगत विशिष्टता को जोड़े।
- issue: שִׁמְעוּ में सुनने और आज्ञापालन का संबंध
  choice: “सुनो ... और उनका पालन करो”
  alternative: “इस वाचा के वचनों को मानो”
  rationale: इब्रानी पाठ सुनने और करने को दो अलग क्रियाओं के रूप में रखता है। चुना हुआ पाठ इस आलंकारिक और धर्मवैचारिक क्रम को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘वाचा’ बाइबलीय अर्थ की सटीकता के लिए रखा गया है। आज्ञाएँ एकवचन भविष्यद्वक्ता (‘घोषणा कर’, ‘कह’) और बहुवचन श्रोताओं (‘सुनो’, ‘पालन करो’) के बीच मूल पाठ का भेद बनाए रखती हैं।
