  text: לְמַעַן֩ הָקִ֨ים אֶת הַ/שְּׁבוּעָ֜ה אֲשֶׁר נִשְׁבַּ֣עְתִּי לַ/אֲבֽוֹתֵי/כֶ֗ם לָ/תֵ֤ת לָ/הֶם֙ אֶ֣רֶץ זָבַ֥ת חָלָ֛ב וּ/דְבַ֖שׁ כַּ/יּ֣וֹם הַ/זֶּ֑ה וָ/אַ֥עַן וָ/אֹמַ֖ר אָמֵ֥ן יְהוָֽה־־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/005.yaml
  text: so that I may establish the oath that I swore to your fathers[a], to give them a land flowing with milk and honey, as it is this day.” And I answered and said, “Amen[b], Yahweh.”
translation:
  language: hi
  text: ताकि मैं उस शपथ को पूरा करूँ जो मैंने तुम्हारे पूर्वजों[a] से खाई थी, कि मैं उन्हें दूध और मधु से बहने वाला देश दूँ—जैसा कि आज है।” और मैंने उत्तर देकर कहा, “आमीन, याहवे[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “तुम्हारे पितरों।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में परमेश्वर का नाम יהוה (YHWH) है। ‘याहवे’ उसका प्रचलित पुनर्निर्मित उच्चारण है; मूल उच्चारण निश्चित नहीं है।
    reason: alternative_reading
lexical_decisions:
- source_word: לְמַעַן
  choice: ताकि
  rationale: पूर्ववर्ती आदेश के उद्देश्य अथवा परिणाम को स्वाभाविक और संक्षिप्त हिंदी में व्यक्त करता है।
- source_word: הָקִים אֶת הַשְּׁבוּעָה
  choice: उस शपथ को पूरा करूँ
  rationale: हिफ़ील הָקִים का शपथ के साथ अर्थ उसे प्रभाव में लाना या निभाना है; हिंदी में ‘शपथ को पूरा करना’ अर्थ को स्पष्ट और स्वाभाविक रखता है।
- source_word: נִשְׁבַּעְתִּי לַאֲבוֹתֵיכֶם
  choice: मैंने तुम्हारे पूर्वजों से खाई थी
  rationale: हिंदी मुहावरे में शपथ किसी से अथवा उसके सामने खाई जा सकती है। ‘पूर्वजों’ से सामूहिक वंशगत संदर्भ स्पष्ट होता है, जबकि पादटिप्पणी शाब्दिक ‘पितरों’ को सुरक्षित रखती है।
- source_word: לָתֵת לָהֶם
  choice: कि मैं उन्हें ... दूँगा
  rationale: यह शपथ की विषयवस्तु बताने वाले infinitive को सहज हिंदी आश्रित वाक्य में व्यक्त करता है।
- source_word: אֶרֶץ זָבַת חָלָב וּדְבַשׁ
  choice: दूध और मधु से बहने वाला देश
  rationale: मूल की समृद्धि-सूचक काव्यात्मक छवि को परिचित बाइबलीय हिंदी में बनाए रखता है।
- source_word: כַּיּוֹם הַזֶּה
  choice: जैसा कि आज है
  rationale: वर्तमान स्थिति को प्रतिज्ञा की पूर्ति के प्रमाण के रूप में इंगित करने वाली इब्रानी अभिव्यक्ति को निकटता से रखता है।
- source_word: וָאַעַן וָאֹמַר
  choice: तब मैंने उत्तर दिया
  rationale: दोनों इब्रानी क्रियाओं का आशय स्वाभाविक हिंदी में व्यक्त होता है; ‘उत्तर देकर कहा’ अनावश्यक रूप से भारी होता।
- source_word: אָמֵן
  choice: आमीन
  rationale: नबी की सहमति और पुष्टि को पारंपरिक, पारदर्शी रूप में सुरक्षित रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: टेट्राग्रामटन को उपाधि में बदलने के बजाय हिंदी में व्यापक रूप से पहचाने जाने वाले नामरूप से प्रस्तुत करता है।
theological_decisions:
- issue: הָקִים के द्वारा शपथ के संबंध में ईश्वरीय कार्य
  choice: शपथ को पूरा करूँ
  alternative: शपथ को स्थापित करूँ
  rationale: संदर्भ में बात पहले खाई गई शपथ को कार्यान्वित करने की है। ‘स्थापित’ रूपात्मक रूप से निकट है, पर हिंदी में शपथ के साथ अस्पष्ट और अस्वाभाविक हो सकता है।
- issue: לַאֲבוֹתֵיכֶם का वंशगत संकेत
  choice: तुम्हारे पूर्वजों
  alternative: तुम्हारे पितरों
  rationale: ‘पूर्वजों’ आधुनिक पाठक के लिए स्वाभाविक है और सामूहिक पैतृक पीढ़ियों को दर्शाता है; मूल का शाब्दिक पुल्लिंग रूप पादटिप्पणी में दिया गया है।
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में व्यक्तिगत वाचा-नाम है, इसलिए केवल उपाधि ‘प्रभु’ से उसे प्रतिस्थापित नहीं किया गया। उच्चारण की अनिश्चितता और विकल्प पादटिप्पणी में स्पष्ट हैं।
- issue: אָמֵן का अर्थ
  choice: आमीन
  alternative: ऐसा ही हो
  rationale: लिप्यंतर मूल की संक्षिप्त पुष्टि और उसके धार्मिक भार को बनाए रखता है; ‘ऐसा ही हो’ एक संभावित अर्थ-व्याख्या है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली रखी गई है। मूल की उद्देश्य-संरचना, प्रतिज्ञा, देश की काव्यात्मक छवि और नबी की संक्षिप्त पुष्टि सुरक्षित हैं। विराम-चिह्न बताता है कि पद पिछले कथन को आगे बढ़ाता है।
