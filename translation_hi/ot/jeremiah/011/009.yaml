id: JER.11.9
reference: Jeremiah 11:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֵלָ֑/י נִֽמְצָא קֶ֨שֶׁר֙ בְּ/אִ֣ישׁ יְהוּדָ֔ה וּ/בְ/יֹשְׁבֵ֖י יְרוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/009.yaml
  text: And Yahweh said to me[b][a], “A conspiracy has been found among the men of Judah and among the inhabitants of Jerusalem.”
translation:
  language: hi
  text: तब याहवे ने मुझसे कहा, “यहूदा के लोगों[b] और यरूशलेम के निवासियों के बीच एक षड्यंत्र का पता चला है[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “एक साज़िश उजागर हुई है” अथवा “एक राजद्रोही षड्यंत्र का पता चला है।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “यहूदा का मनुष्य”; यहाँ एकवचन शब्द सामूहिक अर्थ में यहूदा के लोगों के लिए आया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब … ने कहा
  rationale: वय्यिक्तोल कथानक में अगली घटना आरम्भ करता है। ‘तब’ आधुनिक हिन्दी में घटनाक्रम को स्वाभाविक रूप से आगे बढ़ाता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुराक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: אֵלָי
  choice: मुझसे
  rationale: इब्रानी पूर्वसर्ग और प्रथम पुरुष एकवचन प्रत्यय का स्वाभाविक हिन्दी रूप।
- source_word: נִמְצָא
  choice: का पता चला है
  rationale: निफ़अल पूर्ण रूप किसी बात के खोजे या उजागर होने की वर्तमान-प्रासंगिक स्थिति बताता है; यह हिन्दी में निष्क्रिय अर्थ को सहज ढंग से व्यक्त करता है।
- source_word: קֶשֶׁר
  choice: एक षड्यंत्र
  rationale: राजकीय और भविष्यद्वक्ताई संदर्भों में यह शब्द गुप्त, संभवतः राजद्रोही, साज़िश को सूचित करता है। ‘षड्यंत्र’ गरिमापूर्ण और स्पष्ट है।
- source_word: בְּאִישׁ יְהוּדָה
  choice: यहूदा के लोगों के बीच
  rationale: אִישׁ रूप में एकवचन है, पर यहाँ सामूहिक अर्थ में यहूदा के लोगों को दर्शाता है। हिन्दी में ‘लोगों’ से यह अर्थ स्पष्ट और स्वाभाविक रहता है।
- source_word: וּבְיֹשְׁבֵי יְרוּשָׁלִָם
  choice: और यरूशलेम के निवासियों के बीच
  rationale: יֹשְׁבֵי स्थान में रहने वालों के लिए संज्ञात्मक रूप से प्रयुक्त कृदंत है; ‘निवासी’ इसका स्वाभाविक हिन्दी समतुल्य है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: קֶשֶׁר की प्रकृति
  choice: षड्यंत्र
  alternative: साज़िश / राजद्रोही षड्यंत्र
  rationale: शब्द में गुप्त गठजोड़ या राजद्रोह का भाव हो सकता है, किंतु इस पद में लक्ष्य स्पष्ट नहीं किया गया; इसलिए मुख्य पाठ उस संभावित अर्थ को अनावश्यक रूप से संकीर्ण नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्पष्ट, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रूप अपनाया गया है। ‘का पता चला है’ मूल के निष्क्रिय खोज-अर्थ को स्वाभाविक हिन्दी में रखता है; ‘षड्यंत्र’ शब्द संभावित राजद्रोही आशय को पूरी तरह नकारे बिना मूल की व्यापकता बनाए रखता है।
