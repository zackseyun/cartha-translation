id: JER.11.11
reference: Jeremiah 11:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִ֨י מֵבִ֤יא אֲלֵי/הֶם֙ רָעָ֔ה אֲשֶׁ֥ר לֹֽא יוּכְל֖וּ לָ/צֵ֣את מִמֶּ֑/נָּה וְ/זָעֲק֣וּ אֵלַ֔/י וְ/לֹ֥א אֶשְׁמַ֖ע אֲלֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/011.yaml
  text: 'Therefore thus says Yahweh: Behold[a], I am bringing on them a disaster from which they will not be able to escape; and they will cry out to me, but I will not listen to them.'
translation:
  language: hi
  text: इसलिए याहवे यों कहता है, “देखो, मैं उन पर एक विपत्ति[a] ला रहा हूँ, जिससे वे बचकर नहीं निकल सकेंगे। वे मेरी दुहाई देंगे, पर मैं उनकी नहीं सुनूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आपदा”; यहाँ इब्रानी רָעָה का अर्थ नैतिक बुराई नहीं, बल्कि न्याय के रूप में आने वाली विनाशकारी विपत्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले अभियोग के परिणाम को स्पष्ट करने वाला निष्कर्षसूचक शब्द है; ‘इसलिए’ आधुनिक हिन्दी में इसका स्वाभाविक और सटीक रूप है।
- source_word: כֹּה אָמַר יְהוָה
  choice: याहवे यों कहता है
  rationale: यह भविष्यद्वक्ताओं की मानक संदेशवाहक उद्घोषणा है। ‘यों कहता है’ उसकी औपचारिक गम्भीरता बनाए रखता है, और ‘याहवे’ परमेश्वर के व्यक्तिगत वाचा-नाम को दर्शाता है।
- source_word: הִנְנִי
  choice: देखो
  rationale: यह आने वाली ईश्वरीय कार्रवाई की ओर गम्भीरता और तात्कालिकता से ध्यान खींचता है।
- source_word: מֵבִיא אֲלֵיהֶם
  choice: मैं उन पर ... ला रहा हूँ
  rationale: הִנְנִי के साथ कृदन्त निकट और निश्चित कार्रवाई व्यक्त करता है। ‘ला रहा हूँ’ उसके पहलू और तात्कालिकता को बनाए रखता है।
- source_word: רָעָה
  choice: विपत्ति
  rationale: इस न्याय-सन्दर्भ में शब्द नैतिक बुराई नहीं, बल्कि विनाशकारी आपदा या दण्ड को बताता है। ‘विपत्ति’ स्पष्ट, स्वाभाविक और सन्दर्भानुकूल है।
- source_word: אֲשֶׁר לֹא יוּכְלוּ לָצֵאת מִמֶּנָּה
  choice: जिससे वे बचकर नहीं निकल सकेंगे
  rationale: शाब्दिक रूप से ‘उसमें से निकलना’ यहाँ आने वाली विपत्ति से छुटकारा पाने को सूचित करता है; यह हिन्दी रूप मूल बिम्ब और आशय दोनों को स्वाभाविक ढंग से रखता है।
- source_word: וְזָעֲקוּ אֵלַי
  choice: वे मेरी दुहाई देंगे
  rationale: זעק संकट में सहायता के लिए की गई तीव्र पुकार है। ‘दुहाई देंगे’ साधारण ‘पुकारेंगे’ की अपेक्षा उस व्याकुलता को अधिक स्पष्ट करता है।
- source_word: וְלֹא אֶשְׁמַע אֲלֵיהֶם
  choice: पर मैं उनकी नहीं सुनूँगा
  rationale: שׁמע यहाँ केवल ध्वनि सुनने के बजाय पुकार पर ध्यान देने और उत्तर देने का भाव रखता है। ‘पर’ अपेक्षित सहायता और ईश्वरीय अस्वीकार के विरोध को स्वाभाविक बनाता है।
theological_decisions:
- issue: न्याय के लिए प्रयुक्त רָעָה का अर्थ
  choice: विपत्ति
  alternative: बुराई; आपदा
  rationale: सन्दर्भ वाचा के उल्लंघन पर आने वाले ईश्वरीय दण्ड का है। ‘विपत्ति’ विनाशकारी न्याय का अर्थ बनाए रखता है और यह भ्रम नहीं पैदा करता कि परमेश्वर नैतिक बुराई करता है।
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण ध्वन्यात्मक रूप है और उसे किसी उपाधि से नहीं बदलता।
- issue: पुकार न सुनने का आशय
  choice: मैं उनकी नहीं सुनूँगा
  alternative: मैं उनकी आवाज़ नहीं सुनूँगा
  rationale: यह कथन श्रवण-अक्षमता नहीं, बल्कि न्याय के समय उनकी सहायता-पुकार स्वीकार न करने को व्यक्त करता है; फिर भी अनुवाद मूल के संक्षिप्त और कठोर कथन को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गम्भीर और भविष्यद्वक्ताओं की उद्घोषणा के अनुरूप रखी गई है। ‘यों कहता है’ औपचारिक भविष्यद्वाणी-शैली को बनाए रखता है, जबकि शेष वाक्य सामान्य पाठक के लिए सहज है।
