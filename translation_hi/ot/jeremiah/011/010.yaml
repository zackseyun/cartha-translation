  text: שָׁ֩בוּ֩ עַל עֲוֺנֹ֨ת אֲבוֹתָ֜/ם הָ/רִֽאשֹׁנִ֗ים אֲשֶׁ֤ר מֵֽאֲנוּ֙ לִ/שְׁמ֣וֹעַ אֶת דְּבָרַ֔/י וְ/הֵ֣מָּה הָלְכ֗וּ אַחֲרֵ֛י אֱלֹהִ֥ים אֲחֵרִ֖ים לְ/עָבְדָ֑/ם הֵפֵ֤רוּ בֵֽית יִשְׂרָאֵל֙ וּ/בֵ֣ית יְהוּדָ֔ה אֶת בְּרִיתִ֕/י אֲשֶׁ֥ר כָּרַ֖תִּי אֶת אֲבוֹתָֽ/ם־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/010.yaml
  text: They have returned to the iniquities of their first fathers[a], who refused to hear my words, and they themselves have gone after other gods to serve them[c][b]. The house of Israel and the house of Judah have broken my covenant that I made with their fathers.
translation:
  language: hi
  text: वे अपने पहले के पूर्वजों के अधर्मों की ओर लौट गए हैं, जिन्होंने मेरी बातें सुनने से इनकार कर दिया था; और वे स्वयं दूसरे देवताओं के पीछे उनकी सेवा करने के लिए चल पड़े हैं। इस्राएल का घराना और यहूदा का घराना मेरी उस वाचा को तोड़ चुके हैं, जो मैंने उनके पूर्वजों के साथ बाँधी थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁבוּ עַל עֲוֺנֹת
  choice: अधर्मों की ओर लौट गए हैं
  rationale: שוב על यहाँ पहले के पापपूर्ण आचरण की ओर फिर लौटने को व्यक्त करता है। ‘अधर्म’ עָוֹן का नैतिक भार बनाए रखता है।
- source_word: אֲבוֹתָם הָרִאשֹׁנִים
  choice: अपने पहले के पुरखाओं
  rationale: शाब्दिक भाव ‘पहले/पूर्वकालीन पुरखे’ है। ‘पहले के पुरखाओं’ आरंभिक पीढ़ियों पर दिए गए बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: מֵאֲנוּ לִשְׁמוֹעַ אֶת דְּבָרַי
  choice: मेरी बातें सुनने से इनकार कर दिया था
  rationale: מָאֵן स्पष्टतः इनकार करना है। שׁמע में आज्ञापालन का भाव हो सकता है, पर मुख्य पाठ ‘सुनने’ को रखकर उस अर्थ-व्याप्ति को खुला छोड़ता है।
- source_word: וְהֵמָּה
  choice: और वे स्वयं
  rationale: स्वतंत्र सर्वनाम के बल को ‘स्वयं’ से व्यक्त किया गया है।
- source_word: הָלְכוּ אַחֲרֵי אֱלֹהִים אֲחֵרִים
  choice: दूसरे देवताओं के पीछे चल पड़े हैं
  rationale: הלך אחרי निष्ठा और उपासना में अनुसरण करने का मुहावरा है; हिन्दी में ‘पीछे चल पड़े’ मूल रूपक को बनाए रखता है।
- source_word: לְעָבְדָם
  choice: ताकि उनकी सेवा करें
  rationale: עבד देवताओं के संदर्भ में उपासनापूर्ण सेवा को समेटता है; ‘सेवा’ इसका सीधा समतुल्य है और अर्थ को केवल ‘पूजा’ तक सीमित नहीं करता।
- source_word: בֵּית יִשְׂרָאֵל וּבֵית יְהוּדָה
  choice: इस्राएल के घराने और यहूदा के घराने
  rationale: दोनों स्थानों पर ‘घराना’ रखकर मूल की वाचागत-सामुदायिक भाषा और पुनरुक्ति सुरक्षित रखी गई है।
- source_word: הֵפֵרוּ אֶת בְּרִיתִי
  choice: मेरी वाचा को तोड़ दिया है
  rationale: פרר का हिफ़ील वाचा के संदर्भ में भंग करने या तोड़ने का अर्थ देता है।
- source_word: כָּרַתִּי אֶת אֲבוֹתָם
  choice: उनके पुरखाओं के साथ बाँधी थी
  rationale: כרת ברית का शाब्दिक मुहावरा ‘वाचा काटना’ है; हिन्दी में स्थापित और स्वाभाविक अभिव्यक्ति ‘वाचा बाँधना’ है।
theological_decisions:
- issue: वर्तमान पीढ़ी और पुरखाओं के बीच वाचागत निरंतरता
  choice: वर्तमान लोगों के अधर्म को पुरखाओं के विद्रोह से जोड़ा गया है और उन्हें उसी वाचा को तोड़ने वाला कहा गया है जो परमेश्वर ने उनके पुरखाओं के साथ बाँधी थी।
  alternative: वाचा को केवल अतीत की ऐतिहासिक घटना मानकर वर्तमान पीढ़ी से उसका संबंध ढीला कर देना।
  rationale: इब्रानी पाठ वर्तमान वापसी, पुरखाओं के अधर्म और पुरखाओं के साथ बाँधी गई वाचा को स्पष्ट रूप से जोड़ता है; अनुवाद इस तनाव को बिना किसी बाद की धार्मिक प्रणाली को आरोपित किए सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सुबोध रखी गई है। ‘अधर्म’, ‘वाचा’ और ‘घराना’ जैसे बाइबिलीय शब्द संदर्भगत सटीकता के कारण बनाए रखे गए हैं।
