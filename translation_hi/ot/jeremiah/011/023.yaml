source:
  edition: WLC
  text: וּ/שְׁאֵרִ֕ית לֹ֥א תִֽהְיֶ֖ה לָ/הֶ֑ם כִּֽי אָבִ֥יא רָעָ֛ה אֶל אַנְשֵׁ֥י עֲנָת֖וֹת שְׁנַ֥ת פְּקֻדָּתָֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/023.yaml
  text: And no remnant will remain for them[a], for I will bring disaster on the men of Anathoth in the year of their punishment.
translation:
  language: hi
  text: और उनमें कोई शेष न बचेगा, क्योंकि मैं अनातोत के पुरुषों पर उनके दण्ड के वर्ष में विपत्ति लाऊँगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּשְׁאֵרִית לֹא תִהְיֶה לָהֶם
  choice: और उनमें से कोई शेष न रहेगा
  rationale: שְׁאֵרִית जीवित बचे हुए अंश या शेष जन को दर्शाता है। ‘कोई शेष न रहेगा’ भविष्यवाणी की गंभीरता और मूल रूपक को बनाए रखते हुए स्वाभाविक हिन्दी है; ‘उनमें से’ לָהֶם के आशय को स्पष्ट करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ כִּי पिछले न्याय-वचन का कारण प्रस्तुत करता है।
- source_word: אָבִיא רָעָה
  choice: विपत्ति लाऊँगा
  rationale: न्याय के इस प्रसंग में רָעָה नैतिक बुराई नहीं, बल्कि आने वाली हानिकारक आपदा या विपत्ति है। ‘विपत्ति’ आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: אֶל אַנְשֵׁי עֲנָתוֹת
  choice: अनातोत के पुरुषों पर
  rationale: אַנְשֵׁי का शाब्दिक और प्रसंगानुकूल अर्थ ‘पुरुष’ है; पिछले प्रसंग में अनातोत के षड्यंत्रकारी पुरुष संबोधित हैं। אֶל के साथ विपत्ति लाने का लक्ष्य हिन्दी में ‘पर’ से स्वाभाविक रूप से व्यक्त होता है।
- source_word: שְׁנַת פְּקֻדָּתָם
  choice: उनके दण्ड के वर्ष में
  rationale: פְּקֻדָּה के अर्थ-क्षेत्र में निरीक्षण, लेखा लेना और दण्ड देना शामिल हैं। न्याय के प्रसंग में ‘दण्ड’ उपयुक्त है, और ‘वर्ष’ שְׁנַת की काल-संबंधी विशिष्टता को सुरक्षित रखता है।
theological_decisions:
- issue: जब परमेश्वर רָעָה लाता है, तब शब्द का अर्थ
  choice: ‘विपत्ति’
  alternative: ‘बुराई’ या ‘आपदा’
  rationale: प्रसंग दैवी न्याय के रूप में विनाशकारी घटना की बात करता है, परमेश्वर के नैतिक बुराई करने की नहीं। ‘विपत्ति’ इस प्रसंगगत अर्थ को बिना अतिरिक्त धर्मसैद्धांतिक दावा जोड़े व्यक्त करता है।
- issue: אַנְשֵׁי עֲנָתוֹת का दायरा
  choice: ‘अनातोत के पुरुष’
  alternative: ‘अनातोत के लोग’
  rationale: मूल पाठ में स्पष्ट रूप से पुल्लिंग बहुवचन है और निकटवर्ती प्रसंग यिर्मयाह के विरुद्ध षड्यंत्र करने वाले पुरुषों की ओर संकेत करता है; इसलिए व्यापक लिंग-निरपेक्ष रूप नहीं अपनाया गया।
- issue: פְּקֻדָּה का न्याय-संबंधी अर्थ
  choice: मुख्य पाठ में ‘दण्ड’
  alternative: ‘लेखा लेने’ या ‘निरीक्षण’ का वर्ष
  rationale: यह शब्द अपने आप में तटस्थ ‘निरीक्षण/भेंट’ भी व्यक्त कर सकता है, पर यहाँ घोषित विपत्ति इसे दण्डात्मक बनाती है। मूल की अर्थगत व्यापकता पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गंभीर और भविष्यवाणी-साहित्य के अनुरूप गरिमापूर्ण स्तर रखा गया है। ‘शेष’, ‘विपत्ति’ और ‘दण्ड’ सामान्य पाठक के लिए बोधगम्य हैं और मूल पाठ के न्याय-विषयक स्वर को बनाए रखते हैं।
