  text: כִּ֚י מִסְפַּ֣ר עָרֶ֔י/ךָ הָי֥וּ אֱלֹהֶ֖י/ךָ יְהוּדָ֑ה וּ/מִסְפַּ֞ר חֻצ֣וֹת יְרוּשָׁלִַ֗ם שַׂמְתֶּ֤ם מִזְבְּחוֹת֙ לַ/בֹּ֔שֶׁת מִזְבְּח֖וֹת לְ/קַטֵּ֥ר לַ/בָּֽעַל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/013.yaml
  text: For your gods[a], O Judah, have become as numerous as your cities; and as numerous as the streets of Jerusalem, you have set up altars to Shame[b], altars to make offerings to Baal.
translation:
  language: hi
  text: क्योंकि, हे यहूदा, तेरे देवता तेरे नगरों जितने हो गए हैं; और यरूशलेम की सड़कों जितनी वेदियाँ तुमने ‘लज्जा’[a] के लिए स्थापित की हैं—बाल के लिए धूप जलाने की वेदियाँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘लज्जा’ किसी मूर्तिपूजक देवता के लिए प्रयुक्त तिरस्कारपूर्ण नाम है; यहाँ संभवतः बाल अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद पिछले कथन का कारण बताता है; आधुनिक हिन्दी में ‘क्योंकि’ इस व्याख्यात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִסְפַּר עָרֶיךָ
  choice: तेरे नगरों जितने
  rationale: संख्यात्मक समानता के इब्रानी मुहावरे को संक्षिप्त और स्वाभाविक हिन्दी तुलना में रखा गया है।
- source_word: הָיוּ אֱלֹהֶיךָ יְהוּדָה
  choice: हे यहूदा, तेरे देवता ... हो गए हैं
  rationale: ‘यहूदा’ को प्रत्यक्ष संबोधन के रूप में रखा गया है और היה के परिणामस्वरूप बनी अवस्था को ‘हो गए हैं’ से व्यक्त किया गया है।
- source_word: חֻצוֹת
  choice: सड़कों
  rationale: यहाँ नगर के सार्वजनिक मार्ग अभिप्रेत हैं; ‘सड़कें’ साधारण आधुनिक हिन्दी में सर्वाधिक स्पष्ट है।
- source_word: שַׂמְתֶּם מִזְבְּחוֹת
  choice: वेदियाँ तुमने ... खड़ी की हैं
  rationale: שׂים के साथ वेदियों की स्थापना का भाव है; ‘खड़ी की हैं’ हिन्दी में पूजा-स्थल स्थापित करने का स्वाभाविक प्रयोग है।
- source_word: לַבֹּשֶׁת
  choice: लज्जा
  rationale: शाब्दिक अर्थ ‘लज्जा’ है और यह किसी मूर्तिपूजक देवता, संभवतः बाल, के लिए तिरस्कारपूर्ण प्रतिस्थापन है; मुख्य पाठ में भविष्यद्वक्ता की कटु शब्दावली सुरक्षित रखी गई है।
- source_word: לְקַטֵּר
  choice: धूप जलाने
  rationale: यह पिएल क्रिया सामान्यतः सुगंधित धुआँ चढ़ाने या धूप जलाने की उपासना-क्रिया बताती है। यहाँ कर्म व्यक्त न होने पर भी ‘धूप जलाना’ स्रोत क्रिया का सटीक और सहज हिन्दी रूप है।
- source_word: לַבָּעַל
  choice: बाल के लिए
  rationale: देवता के नाम को मानक हिन्दी रूप ‘बाल’ में रखा गया है और לְ को समर्पण/लाभार्थ के अर्थ में ‘के लिए’ से व्यक्त किया गया है।
theological_decisions:
- issue: यहूदा के एकवचन संबोधन से बहुवचन क्रिया में परिवर्तन
  choice: पहले ‘तेरे’ द्वारा यहूदा को सामूहिक एकवचन मानकर संबोधित किया गया है, फिर ‘तुमने’ द्वारा उसके निवासियों को बहुवचन में संबोधित किया गया है।
  alternative: पूरे पद को केवल एकवचन या केवल बहुवचन में समतल कर देना।
  rationale: इब्रानी पाठ जानबूझकर एकवचन रूपों से बहुवचन שַׂמְתֶּם की ओर बदलता है; हिन्दी में यह तनाव बोधगम्य रहते हुए सुरक्षित रखा गया है।
- issue: לַבֹּשֶׁת की पहचान
  choice: मुख्य पाठ में ‘लज्जा’ रखा गया है और संभावित बाल-संदर्भ पादटिप्पणी में बताया गया है।
  alternative: मुख्य पाठ में सीधे ‘बाल’ या ‘लज्जाजनक वस्तु’ लिखना।
  rationale: इससे इब्रानी का तिरस्कारपूर्ण नाम-प्रतिस्थापन बना रहता है और संभावित ऐतिहासिक पहचान को निश्चित तथ्य बनाकर नहीं थोपा जाता।
- issue: לְקַטֵּר की उपासना-क्रिया
  choice: ‘धूप जलाने’
  alternative: अधिक व्यापक ‘भेंट चढ़ाने’ या शाब्दिक ‘धुआँ चढ़ाने’।
  rationale: क्रिया प्रायः धूप अथवा धुएँ वाली भेंट चढ़ाने के लिए प्रयुक्त होती है। संदर्भ में ‘धूप जलाने’ से विशिष्ट उपासना-क्रिया स्पष्ट होती है, जबकि इसे सामान्य बलिदान में नहीं मिलाया जाता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। ‘हे यहूदा’ प्रत्यक्ष संबोधन को स्पष्ट करता है। एकवचन ‘तेरे’ से बहुवचन ‘तुमने’ की ओर स्रोत-पाठ का परिवर्तन जानबूझकर सुरक्षित रखा गया है।
