  text: שִׁמְע֕וּ אֶת דִּבְרֵ֖י הַ/בְּרִ֣ית הַ/זֹּ֑את וְ/דִבַּרְתָּ/ם֙ אֶל אִ֣ישׁ יְהוּדָ֔ה וְ/עַל יֹשְׁבֵ֖י יְרוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/002.yaml
  text: Hear the words of this covenant[a], and speak them to the men of Judah and to the inhabitants of Jerusalem.
translation:
  language: hi
  text: “इस वाचा के वचनों को सुनो और इन्हें यहूदा के हर एक जन[a] और यरूशलेम के निवासियों से कहो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “यहूदा का हर एक पुरुष”; यह एक सामूहिक-वितरणात्मक अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: सुनो
  rationale: बहुवचन आज्ञार्थक रूप को सीधे बनाए रखता है और ध्यानपूर्वक सुनने का भाव देता है; मुख्य पाठ में इसे ‘मानो’ कहना अर्थ को अनावश्यक रूप से निश्चित कर देता।
- source_word: דִּבְרֵי הַבְּרִית הַזֹּאת
  choice: इस वाचा के वचनों
  rationale: דְּבָרִים के ‘वचन’ और בְּרִית के मानक धर्मशास्त्रीय अर्थ ‘वाचा’ को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: וְדִבַּרְתָּם
  choice: और इन्हें ... कहो
  rationale: पुल्लिंग बहुवचन प्रत्यय का संदर्भ पहले आए ‘वचनों’ से है; ‘इन्हें’ उस कर्म को हिन्दी में स्पष्ट करता है। संदर्भ में पूर्ण रूप आज्ञा की अगली कड़ी के रूप में कार्य करता है।
- source_word: אִישׁ יְהוּדָה
  choice: यहूदा के हर एक जन
  rationale: एकवचन אִישׁ का यहाँ वितरणात्मक-सामूहिक प्रयोग है। ‘हर एक जन’ स्रोत के एकवचन-वितरणात्मक रूप को ‘यहूदा के लोगों’ की अपेक्षा अधिक निकटता से रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: וְעַל יֹשְׁבֵי יְרוּשָׁלִָם
  choice: और यरूशलेम के निवासियों से
  rationale: बोलने की क्रिया और समानांतर אֶל के कारण עַל यहाँ संबोधित श्रोताओं को सूचित करता है; हिन्दी में ‘से कहो’ स्वाभाविक है। יֹשְׁבֵי का संक्षिप्त अर्थ ‘निवासी’ है।
theological_decisions:
- issue: אִישׁ יְהוּדָה में लिंगयुक्त सामूहिक/वितरणात्मक भाषा
  choice: यहूदा के हर एक जन
  alternative: यहूदा के पुरुषों / यहूदा के लोगों
  rationale: इब्रानी पुल्लिंग एकवचन אִישׁ यहाँ प्रत्येक व्यक्ति को वितरणात्मक ढंग से संबोधित करता है। ‘हर एक जन’ उस रूप और व्यापक सामूहिक संदर्भ दोनों को बनाए रखता है; ‘पुरुषों’ से आशय अनावश्यक रूप से केवल वयस्क पुरुषों तक सीमित लग सकता है, जबकि ‘लोगों’ से वितरणात्मक एकवचन दब जाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली। ‘वाचा’ बाइबिलीय धर्मशास्त्रीय पद के रूप में रखा गया है; ‘वचन’ मूल के औपचारिक स्वर को बनाए रखता है।
