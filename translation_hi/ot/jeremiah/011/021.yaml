  edition: WLC
  text: לָ/כֵ֗ן כֹּֽה אָמַ֤ר יְהוָה֙ עַל אַנְשֵׁ֣י עֲנָת֔וֹת הַֽ/מְבַקְשִׁ֥ים אֶֽת נַפְשְׁ/ךָ֖ לֵ/אמֹ֑ר לֹ֤א תִנָּבֵא֙ בְּ/שֵׁ֣ם יְהוָ֔ה וְ/לֹ֥א תָמ֖וּת בְּ/יָדֵֽ/נוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/021.yaml
  text: Therefore[a], this is what Yahweh says concerning the men of Anathoth who are seeking your life, saying, “Do not prophesy in the name of Yahweh[c][b], lest you die by our hand.”
translation:
  language: hi
  text: 'इसलिए याहवे यह कहता है: अनातोत के उन पुरुषों के विषय में जो तेरी जान लेना चाहते हैं[a] और कहते हैं, “याहवे के नाम से भविष्यवाणी मत कर, नहीं तो तू हमारे हाथों मारा जाएगा[b]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “जो तेरे प्राण की खोज कर रहे हैं”; यह किसी को मार डालने की इच्छा या प्रयत्न के लिए प्रयुक्त इब्रानी मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी में कथन का रूप शाब्दिक रूप से नकारात्मक है: “और तू हमारे हाथों नहीं मरेगा।” इस प्रसंग में इसका बल धमकी का है।'
    reason: textual_ambiguity
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले प्रसंग से निकले निष्कर्ष को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כֹּה אָמַר יְהוָה
  choice: याहवे ... यह कहता है
  rationale: यह भविष्यद्वक्ताओं का मानक संदेश-सूत्र है; हिन्दी वाक्य-क्रम के अनुसार कर्ता और विषय के बीच इसे स्वाभाविक ढंग से रखा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में आए परमेश्वर के विशिष्ट नाम को उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: עַל אַנְשֵׁי עֲנָתוֹת
  choice: अनातोत के उन पुरुषों के विषय में
  rationale: עַל का व्यापक अर्थ ‘के विषय में’ रखा गया है; אַנְשֵׁי का पुरुषवाचक रूप भी सुरक्षित है।
- source_word: הַמְבַקְשִׁים אֶת נַפְשְׁךָ
  choice: जो तेरी जान लेना चाहते हैं
  rationale: ‘तेरे प्राण को खोजते हैं’ मृत्यु की इच्छा या हत्या के प्रयत्न का इब्रानी मुहावरा है; हिन्दी में उसका आशय स्पष्ट और सहज रूप में दिया गया है।
- source_word: לֹא תִנָּבֵא בְּשֵׁם יְהוָה
  choice: याहवे के नाम से भविष्यवाणी मत कर
  rationale: निषेध और परमेश्वर के अधिकार से बोलने का भाव सीधे रूप में सुरक्षित है।
- source_word: וְלֹא תָמוּת בְּיָדֵנוּ
  choice: नहीं तो तू हमारे हाथ से मारा जाएगा
  rationale: शाब्दिक नकारात्मक रचना प्रसंग में धमकी का काम करती है। हिन्दी में ‘नहीं तो’ उसी व्यावहारिक बल को स्पष्ट करता है, जबकि ‘हमारे हाथ से’ मूल बिंब को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: यह पद चतुरक्षरीय विशिष्ट नाम का प्रयोग करता है; ‘याहवे’ उसे नाम के रूप में बनाए रखता है और उपाधि से प्रतिस्थापित नहीं करता।
- issue: וְלֹא תָמוּת בְּיָדֵנוּ में नकारात्मक रूप का आशय
  choice: 'धमकी के रूप में: ‘नहीं तो तू हमारे हाथ से मारा जाएगा’'
  alternative: 'अधिक शाब्दिक: ‘और हमारे हाथ से मत मर’ / ‘ताकि तू हमारे हाथ से न मरे’'
  rationale: पूर्ववर्ती निषेध और हत्या की साजिश के प्रसंग में कथन वास्तविक चेतावनी नहीं बल्कि धमकी है। पादटिप्पणी शाब्दिक नकारात्मक संरचना को दर्ज करती है, ताकि उसकी असामान्यता छिपे नहीं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सीधी रखी गई है। ‘तेरी/तू’ एकवचन संबोधन मूल इब्रानी के एकवचन रूप को सुरक्षित रखता है। ‘हमारे हाथ से’ मूल की ठोस अभिव्यक्ति बनाए रखता है, जबकि ‘मारा जाएगा’ हिन्दी में मृत्यु की धमकी को स्वाभाविक बनाता है।
