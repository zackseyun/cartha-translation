lexical_decisions:
- source_word: הַדָּבָר
  choice: वचन
  rationale: דָּבָר का अर्थ ‘वचन’, ‘बात’ या ‘संदेश’ हो सकता है। भविष्यवाणी की आरंभिक शैली में ‘वचन’ सूत्रात्मक अभिव्यक्ति को बनाए रखता है और उसे केवल ‘संदेश’ तक सीमित नहीं करता।
- source_word: הָיָה אֶל
  choice: के पास आया
  rationale: शाब्दिक रूप से הָיָה ‘था/हुआ’ है, पर यह पूरा इब्रानी मुहावरा भविष्यवाणी के संदर्भ में किसी व्यक्ति तक वचन पहुँचने को दर्शाता है; आधुनिक हिन्दी में ‘के पास आया’ स्वाभाविक है।
- source_word: מֵאֵת
  choice: की ओर से
  rationale: यह पदबंध स्रोत या उद्गम बताता है। ‘की ओर से’ स्पष्ट करता है कि वचन यहोवा से प्राप्त हुआ।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबलीय परंपरा में प्रचलित देवनागरी रूप ‘यहोवा’ व्यक्तिगत ईश्वरीय नाम को शीर्षक से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- source_word: יִרְמְיָהוּ
  choice: यिर्मयाह
  rationale: नाम का प्रचलित हिन्दी बाइबलीय रूप अपनाया गया है।
- source_word: לֵאמֹר
  choice: द्विबिंदु द्वारा व्यक्त
  rationale: यह रूप आगे आने वाली वाणी का परिचय देता है। हिन्दी में वाक्य के अंत का द्विबिंदु इस कार्य को स्वाभाविक ढंग से व्यक्त करता है और अनावश्यक ‘यह कहते हुए’ से बचाता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में चतुरक्षरी व्यक्तिगत नाम है। मुख्य पाठ में नाम को बनाए रखा गया है; पादटिप्पणी उच्चारण और पारंपरिक शीर्षक की वैकल्पिक प्रस्तुति बताती है, बिना मूल की निश्चितता से अधिक दावा किए।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘यह वह वचन है’ इब्रानी के निश्चित पद הַדָּבָר और भविष्यवाणी-सूत्र की औपचारिकता को सुरक्षित रखता है। अगले पद में आने वाली प्रत्यक्ष वाणी को संकेत करने के लिए अंत में द्विबिंदु रखा गया है।
