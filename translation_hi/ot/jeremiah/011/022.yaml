base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/022.yaml
  text: 'Therefore thus says Yahweh of hosts: Behold[a], I am about to punish them. The young men will die by the sword; their sons and their daughters will die by famine.'
translation:
  language: hi
  text: 'इसलिए सेनाओं का याहवे यों कहता है: “देखो,[a] मैं उन्हें दंड देने वाला हूँ। उनके युवक तलवार से मरेंगे, और उनके पुत्र और पुत्रियाँ अकाल से मरेंगे।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “देखो, मैं उन पर न्याय लाने वाला हूँ।” इब्रानी में शाब्दिक रूप से, “मैं उन पर ध्यान देने वाला हूँ/उनकी सुधि लेने वाला हूँ”; लेकिन न्याय के प्रसंगों में यह क्रिया उन्हें लेखा देने के लिए बुलाने और दंड देने का भाव रखती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले प्रसंग से निकलने वाले निष्कर्ष को स्वाभाविक और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: כֹּה אָמַר
  choice: यों कहता है
  rationale: यह भविष्यद्वक्ताओं की मानक संदेश-सूचना शैली को गरिमापूर्ण और सहज हिन्दी में बनाए रखता है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का यहोवा
  rationale: यह दिव्य नाम को लिप्यंतरित करता और צְבָאוֹת के व्यापक सैन्य आशय को अनावश्यक रूप से सीमित किए बिना सुरक्षित रखता है।
- source_word: הִנְנִי פֹקֵד עֲלֵיהֶם
  choice: देखो, मैं उन्हें दण्ड देने वाला हूँ
  rationale: הִנְנִי का जोर और निकट भविष्य का भाव तथा न्याय-संदर्भ में פקד का दण्ड देने का अर्थ स्वाभाविक आधुनिक हिन्दी में व्यक्त होता है।
- source_word: הַבַּחוּרִים
  choice: उनके जवान
  rationale: यह युवा वयस्क पुरुषों, सम्भवतः युद्ध-योग्य पुरुषों, को दर्शाता है और अगले तलवार-संबंधी कथन के अनुकूल है।
- source_word: יָמֻתוּ בַחֶרֶב
  choice: तलवार से मारे जाएँगे
  rationale: शाब्दिक क्रिया 'मरेंगे' है, पर तलवार के माध्यम से हिंसक मृत्यु का आशय हिन्दी में इस प्रकार अधिक स्वाभाविक और स्पष्ट है।
- source_word: בְּנֵיהֶם וּבְנוֹתֵיהֶם
  choice: उनके बेटे-बेटियाँ
  rationale: मूल पाठ में पुत्रों और पुत्रियों का स्पष्ट भेद है; संक्षिप्त हिन्दी युग्म उसी विशिष्टता को बनाए रखता है।
- source_word: יָמֻתוּ בָּרָעָב
  choice: अकाल से मर जाएँगे
  rationale: רָעָב यहाँ केवल व्यक्तिगत भूख नहीं, व्यापक अकाल को दर्शाता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: हिन्दी बाइबलीय प्रयोग में 'यहोवा' व्यापक रूप से पहचाना जाने वाला नामरूप है और मूल पाठ के व्यक्तिवाचक दिव्य नाम को सामान्य उपाधि में नहीं बदलता।
- issue: הִנְנִי פֹקֵד עֲלֵיהֶם में न्याय का भाव
  choice: देखो, मैं उन्हें दण्ड देने वाला हूँ
  alternative: देखो, मैं उनका न्याय करने वाला हूँ
  rationale: न्याय-संदर्भ में פקד का आशय उत्तरदायी ठहराकर दण्ड देना है; चुना गया रूप स्पष्ट है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
