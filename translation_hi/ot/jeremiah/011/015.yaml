  edition: WLC
  text: מֶ֣ה לִֽ/ידִידִ֞/י בְּ/בֵיתִ֗/י עֲשׂוֹתָ֤/הּ הַֽ/מְזִמָּ֨תָ/ה֙ הָֽ/רַבִּ֔ים וּ/בְשַׂר קֹ֖דֶשׁ יַעַבְר֣וּ מֵֽ/עָלָ֑יִ/ךְ כִּ֥י רָעָתֵ֖/כִי אָ֥ז תַּעֲלֹֽזִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/015.yaml
  text: What right has my beloved in my house[c][b][a], when she has done her many wicked schemes? Can holy flesh remove your evil from you? Then you rejoice!
translation:
  language: hi
  text: मेरी प्रिया का मेरे घर में क्या काम है[a], जबकि वह अपनी बहुत-सी दुष्ट युक्तियाँ करती है? क्या पवित्र बलि-मांस तुम्हारी बुराई को तुमसे दूर कर सकता है[b][c]? तब तुम आनन्द मनाती हो!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरी प्रिया का मेरे घर में क्या अधिकार है...?”
    reason: lexical_alternative
  - marker: b
    text: “पवित्र बलि-मांस” सम्भवतः बलिदानों से मिले उस मांस को दर्शाता है जिसे उपासक खाते थे; संदर्भ में भाव यह है कि ऐसे पवित्र अनुष्ठान उनकी बुराई को दूर नहीं कर सकते थे।
    reason: cultural_note
  - marker: c
    text: 'इस पद का इब्रानी पाठ कठिन है। अधिक शाब्दिक रूप: “और पवित्र मांस तुम्हारे ऊपर से गुज़र जाएगा, क्योंकि तुम्हारी बुराई—तब तुम आनन्द मनाती हो।”'
    reason: alternative_reading
lexical_decisions:
- source_word: מֶה לִידִידִי בְּבֵיתִי
  choice: मेरी प्रिया को मेरे भवन में रहने का क्या अधिकार है
  rationale: यह इब्रानी मुहावरा केवल ‘क्या’ नहीं, बल्कि किसी के वहाँ होने के अधिकार या औचित्य पर प्रश्न उठाता है। ‘भवन’ मूल के ‘मेरे घर’ को बनाए रखते हुए मंदिर-संदर्भ में स्वाभाविक है।
- source_word: לִידִידִי
  choice: मेरी प्रिया
  rationale: यְדִיד का प्रेमपूर्ण और वाचागत संबोधन सुरक्षित रहता है; स्त्रीलिंग संदर्भ यहूदा/यरूशलेम की सामूहिक पहचान की ओर संकेत करता है।
- source_word: עֲשׂוֹתָהּ הַמְזִמָּתָה הָרַבִּים
  choice: जब वह बहुत-से दुष्ट षड्यंत्र करती है
  rationale: कठिन वाक्य-विन्यास को कालगत उपवाक्य के रूप में व्यक्त किया गया है। מְזִמָּה के नकारात्मक नैतिक भाव को ‘दुष्ट षड्यंत्र’ स्पष्ट करता है।
- source_word: וּבְשַׂר קֹדֶשׁ
  choice: पवित्र बलि-मांस
  rationale: शाब्दिक ‘पवित्र मांस’ के साथ ‘बलि’ जोड़ने से संभावित उपासना-संदर्भ साधारण पाठक के लिए स्पष्ट होता है, बिना बिंब हटाए।
- source_word: יַעַבְרוּ מֵעָלָיִךְ
  choice: तुम्हारी बुराई तुमसे दूर कर सकता है
  rationale: עבר का मूल भाव ‘दूर होना/गुज़रना’ है। कठिन इब्रानी में अगली पदावली ‘तुम्हारी बुराई’ को आशयगत कर्म मानकर प्रश्न स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: כִּי רָעָתֵכִי
  choice: तुम्हारी बुराई
  rationale: संदर्भ में רָעָה नैतिक दुष्टता को सूचित करती है, केवल विपत्ति को नहीं।
- source_word: אָז תַּעֲלֹזִי
  choice: तब तुम आनन्द मनाती हो
  rationale: स्त्रीलिंग संबोधन और व्यंग्यपूर्ण, उल्लाससूचक क्रिया दोनों सुरक्षित हैं।
theological_decisions:
- issue: ‘मेरी प्रिया’ की पहचान
  choice: यहूदा/यरूशलेम को प्रभु की प्रिया के रूप में व्यंग्यपूर्ण वाचागत संबोधन
  alternative: कोई सामान्य उपासक या बिना व्यंग्य के मंदिर-समुदाय
  rationale: स्त्रीलिंग क्रिया और सर्वनाम एक स्त्रीलिंग सामूहिक सत्ता की ओर संकेत करते हैं; ‘प्रिया’ बनाए रखने से टूटी हुई वाचा का तनाव बना रहता है।
- issue: बलि-संबंधी भाषा का कार्य
  choice: पवित्र बलि-मांस में भाग लेना निरन्तर बुराई को दूर नहीं कर सकता
  alternative: सामान्य मंदिर-अनुष्ठान का उल्लेख; अथवा पाठ इतना कठिन है कि निश्चित अर्थ न दिया जाए
  rationale: ‘पवित्र मांस’ और ‘तुम्हारी बुराई’ का समीपस्थ होना अनुष्ठान पर झूठे भरोसे की आलोचना सुझाता है, पर कठिन मूल-पाठ को पादटिप्पणी में खुला रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध शैली। ‘भवन’ मंदिर का संकेत देता है, जबकि मूल के ‘घर’ रूपक से निकटता रखता है। कठिन इब्रानी को मुख्य पाठ में अर्थपूर्ण प्रश्न के रूप में दिया गया है और वास्तविक अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
