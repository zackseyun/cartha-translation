source:
  edition: WLC
  text: כִּי֩ הָעֵ֨ד הַעִדֹ֜תִי בַּ/אֲבֽוֹתֵי/כֶ֗ם בְּ/יוֹם֩ הַעֲלוֹתִ֨/י אוֹתָ֜/ם מֵ/אֶ֤רֶץ מִצְרַ֨יִם֙ וְ/עַד הַ/יּ֣וֹם הַ/זֶּ֔ה הַשְׁכֵּ֥ם וְ/הָעֵ֖ד לֵ/אמֹ֑ר שִׁמְע֖וּ בְּ/קוֹלִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/007.yaml
  text: For I solemnly warned your fathers in the day I brought them up from the land of Egypt[a], and to this day, rising early and warning them, saying, ‘Listen to my voice.’
translation:
  language: hi
  text: क्योंकि जिस दिन मैं तुम्हारे पुरखाओं को मिस्र देश से निकालकर ले आया, उसी दिन मैंने उन्हें गंभीरता से चेतावनी दी थी; और उस दिन से आज तक मैं भोर से उठकर चेतावनी देता रहा हूँ, यह कहते हुए, ‘मेरी वाणी सुनो[a]।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरी बात मानो।” इब्रानी अभिव्यक्ति, विशेषकर वाचा के प्रसंगों में, सुनने के साथ आज्ञापालन का अर्थ भी दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार या कारण प्रस्तुत करता है और हिन्दी में प्रसंग-संबंध स्वाभाविक रखता है।
- source_word: הָעֵד הַעִדֹתִי
  choice: बड़े आग्रह से चेतावनी देता आया हूँ
  rationale: धातु के साथ प्रयुक्त infinitive absolute क्रिया को तीव्र करता है। इस वाचा-संबंधी प्रसंग में केवल गवाही देने के बजाय गंभीर और आग्रहपूर्ण चेतावनी का भाव प्रमुख है।
- source_word: בַּאֲבוֹתֵיכֶם
  choice: तुम्हारे पुरखाओं
  rationale: यह पितृ-पूर्वजों के लिए प्रयुक्त मूल पुरुषवाचक पारिवारिक पद का स्वाभाविक हिन्दी समतुल्य है और वाचा-इतिहास का भाव बनाए रखता है।
- source_word: בְּיוֹם הַעֲלוֹתִי אוֹתָם מֵאֶרֶץ מִצְרַיִם
  choice: जिस दिन मैं ... मिस्र देश से निकाल लाया
  rationale: हिफ़ील עָלָה निर्गमन के प्रचलित मुहावरे में ‘ऊपर ले आना/निकाल लाना’ है। हिन्दी में ‘मिस्र से निकाल लाया’ उसी ऐतिहासिक घटना को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְעַד הַיּוֹם הַזֶּה
  choice: उस दिन से आज तक
  rationale: आरंभ-बिंदु को पहले काल-वाक्यांश से जोड़कर हिन्दी में निरंतरता को स्पष्ट करता है।
- source_word: הַשְׁכֵּם וְהָעֵד
  choice: बार-बार ... बड़े आग्रह से चेतावनी देता आया हूँ
  rationale: शाब्दिक ‘भोर को उठकर’ यिर्मयाह में तत्पर, निरंतर और बारंबार किए गए कार्य का मुहावरा है। हिन्दी रूप उसी बल को प्राकृतिक ढंग से व्यक्त करता है; ‘उन्हें’ पूर्वजों को निहित कर्म मानकर जोड़ा गया है।
- source_word: לֵאמֹר
  choice: —उद्धरण के रूप में प्रस्तुत
  rationale: हिन्दी में ‘यह कहते हुए’ जोड़े बिना कोलन और प्रत्यक्ष कथन से उद्धरण स्वाभाविक रूप से आरंभ होता है।
- source_word: שִׁמְעוּ בְּקוֹלִי
  choice: मेरी बात सुनो
  rationale: यह मूल श्रवण-रूप को बनाए रखता है, पर हिन्दी में ‘मेरी आवाज़ सुनो’ की अपेक्षा ‘मेरी बात सुनो’ आज्ञा मानने की संभावित वाचागत छाया सहित अधिक स्वाभाविक है।
theological_decisions:
- issue: שִׁמְעוּ בְּקוֹלִי का वाचा-संबंधी बल
  choice: मेरी बात सुनो
  alternative: मेरी आज्ञा मानो
  rationale: इब्रानी पद सुनने और आज्ञापालन दोनों का भाव धारण कर सकता है। मुख्य पाठ श्रवण की शब्द-छवि और निहित आज्ञापालन के बीच तनाव बनाए रखता है; स्पष्ट आज्ञापालन-वाला अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली। ‘पुरखाओं’ से वाचा-इतिहास का पारिवारिक भाव सुरक्षित है। इब्रानी ‘भोर को उठकर’ मुहावरे को शाब्दिक अस्वाभाविकता से बचाते हुए ‘बार-बार’ और ‘बड़े आग्रह से’ द्वारा उसकी तत्परता, निरंतरता और तीव्रता व्यक्त की गई है।
