source:
  edition: WLC
  text: וַ/אֲנִ֕י כְּ/כֶ֥בֶשׂ אַלּ֖וּף יוּבַ֣ל לִ/טְב֑וֹחַ וְ/לֹֽא יָדַ֜עְתִּי כִּֽי עָלַ֣/י חָשְׁב֣וּ מַחֲשָׁב֗וֹת נַשְׁחִ֨יתָה עֵ֤ץ בְּ/לַחְמ/וֹ֙ וְ/נִכְרְתֶ֨/נּוּ֙ מֵ/אֶ֣רֶץ חַיִּ֔ים וּ/שְׁמ֖/וֹ לֹֽא יִזָּכֵ֥ר עֽוֹד־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/019.yaml
  text: 'But I was like a gentle lamb led to the slaughter[a], and I did not know that they had devised plans against me: ‘Let us destroy the tree with its food, and let us cut him off from the land of the living[b], so that his name will be remembered no more.’'
translation:
  language: hi
  text: 'परन्तु मैं एक भोले मेमने के समान था, जिसे वध के लिए ले जाया जा रहा था[a]। मैं नहीं जानता था कि उन्होंने मेरे विरुद्ध षड्यन्त्र रचे थे: “आओ, हम पेड़ को उसके भोजन समेत नष्ट कर दें[b]; हम उसे जीवितों के देश से काट डालें, ताकि उसका नाम फिर कभी याद न किया जाए।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पालतू मेमने” अथवा “मनुष्यों से परिचित मेमने के समान”; यहाँ प्रयुक्त इब्रानी विशेषण का अर्थ अनिश्चित है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी वाक्यांश अस्पष्ट है; शाब्दिक अर्थ “पेड़ को उसकी रोटी/भोजन समेत” है। बहुत-से लोग इसका भाव पेड़ को उसकी उपज सहित पूरी तरह नष्ट करना समझते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכֶבֶשׂ אַלּוּף
  choice: उस भोले मेमने के समान
  rationale: כֶּבֶשׂ का अर्थ ‘मेमना’ है। कठिन विशेषण אַלּוּף यहाँ पालतू, मनुष्य से परिचित, विनम्र या निरापद पशु का संकेत देता जान पड़ता है। ‘भोला’ प्रसंग में उसकी अनभिज्ञता और असुरक्षित सहजता को स्वाभाविक हिन्दी में व्यक्त करता है; अन्य सम्भावनाएँ पाद-टिप्पणी में रखी गई हैं।
- source_word: יוּבַל לִטְבוֹחַ
  choice: जिसे वध के लिए ले जाया जा रहा हो
  rationale: יבל के निष्क्रिय रूप और טבח के क्रियार्थक रूप का सीधा अर्थ ‘वध के लिए ले जाया जाना’ है; यह मूल वध-चित्र को बनाए रखता है।
- source_word: וְלֹא יָדַעְתִּי
  choice: मैं नहीं जानता था
  rationale: प्रथम पुरुष एकवचन पूर्ण क्रिया का सीधा और स्वाभाविक अनुवाद है।
- source_word: חָשְׁבוּ מַחֲשָׁבוֹת
  choice: वे मेरे विरुद्ध यह षड्यन्त्र रच रहे थे
  rationale: सजातीय क्रिया-संज्ञा का प्रयोग सोच-समझकर की गई शत्रुतापूर्ण योजना पर बल देता है। ‘षड्यन्त्र रचना’ हिन्दी में उसी आशय को संक्षेप और स्पष्टता से व्यक्त करता है।
- source_word: נַשְׁחִיתָה
  choice: आओ, हम ... नष्ट कर दें
  rationale: प्रथम पुरुष बहुवचन इच्छार्थक रूप षड्यन्त्रकारियों का प्रस्ताव व्यक्त करता है। ‘आओ’ उस इच्छार्थक बल को स्वाभाविक हिन्दी में दर्शाता है।
- source_word: עֵץ בְּלַחְמוֹ
  choice: पेड़ को उसके भोजन समेत
  rationale: לֶחֶם सामान्यतः ‘रोटी/भोजन’ है और पूरा पद अत्यन्त कठिन है। मुख्य पाठ मूल के निकट ‘भोजन’ रखता है, जबकि सम्भावित भाव—पेड़ और उसकी उपज का सम्पूर्ण विनाश—पाद-टिप्पणी में दिया गया है।
- source_word: וְנִכְרְתֶנּוּ
  choice: हम उसे ... काट डालें
  rationale: כרת का मूल बिम्ब ‘काट देना’ है। पुल्लिंग एकवचन प्रत्यय को ‘उसे’ से रखा गया है; अगली पंक्तियाँ स्पष्ट करती हैं कि लक्ष्य यिर्मयाह है।
- source_word: מֵאֶרֶץ חַיִּים
  choice: जीवितों की धरती से
  rationale: यह जीवित लोगों के संसार के लिए प्रचलित इब्रानी मुहावरा है; हिन्दी वाक्यांश मूल बिम्ब और अर्थ दोनों को सुरक्षित रखता है।
- source_word: וּשְׁמוֹ לֹא יִזָּכֵר עוֹד
  choice: ताकि उसका नाम फिर कभी याद न किया जाए
  rationale: זכר का निफ़ाल ‘याद किया जाना’ या ‘उल्लेख किया जाना’ हो सकता है। यहाँ व्यक्ति की स्मृति मिटाने का आशय है, इसलिए ‘याद न किया जाए’ उपयुक्त है।
theological_decisions:
- issue: षड्यन्त्रकारियों की हिंसक उपमा का अर्थ
  choice: मुख्य पाठ इसे यिर्मयाह के जीवन के विरुद्ध तत्कालीन षड्यन्त्र के रूप में अनूदित करता है और मसीही रूपक नहीं जोड़ता।
  alternative: इसे मुख्यतः मसीह के दुःखभोग की प्रतिरूपात्मक भविष्यवाणी के रूप में प्रस्तुत करना।
  rationale: निकटवर्ती सन्दर्भ यिर्मयाह के विरुद्ध हत्या की योजना है। बाद की प्रतिरूपात्मक व्याख्या सम्भव हो सकती है, पर वह इब्रानी पाठ में प्रत्यक्ष रूप से कही हुई बात नहीं है और उसे अनुवाद में आरोपित नहीं करना चाहिए।
- issue: עֵץ בְּלַחְמוֹ में अस्पष्ट पेड़-भोजन बिम्ब
  choice: शाब्दिक निकटता रखते हुए ‘पेड़ को उसके भोजन समेत’ और स्पष्टीकरण पाद-टिप्पणी में।
  alternative: मुख्य पाठ में अर्थ स्पष्ट करके ‘पेड़ को उसके फल समेत’ या ‘पेड़ को उसकी उपज समेत’।
  rationale: इब्रानी वाक्यांश अस्पष्ट है। ‘फल/उपज’ सम्भावित भाव है, पर मुख्य पाठ में उसे निश्चित कर देना वास्तविक पाठगत तनाव को मिटा देगा।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। ‘वध’, ‘षड्यन्त्र’ और ‘जीवितों की धरती’ मूल की गंभीरता तथा काव्यात्मक बिम्ब बनाए रखते हैं। कठिन इब्रानी पद को अनावश्यक रूप से स्पष्ट करने के बजाय उसकी अस्पष्टता पाद-टिप्पणी सहित सुरक्षित रखी गई है।
