source:
  edition: WLC
  text: וַ/יהוָ֤ה צְבָאוֹת֙ הַ/נּוֹטֵ֣עַ אוֹתָ֔/ךְ דִּבֶּ֥ר עָלַ֖יִ/ךְ רָעָ֑ה בִּ֠/גְלַל רָעַ֨ת בֵּֽית יִשְׂרָאֵ֜ל וּ/בֵ֣ית יְהוּדָ֗ה אֲשֶׁ֨ר עָשׂ֥וּ לָ/הֶ֛ם לְ/הַכְעִסֵ֖/נִי לְ/קַטֵּ֥ר לַ/בָּֽעַל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/017.yaml
  text: And Yahweh of Armies[a], who planted you, has spoken disaster against you because of the evil of the house of Israel and the house of Judah, which they have done to themselves, provoking me to anger by making offerings to Baal.
translation:
  language: hi
  text: और सेनाओं के यहोवा ने, जिसने तुझे रोपा, तेरे विरुद्ध विपत्ति की घोषणा की है, इस्राएल के घराने और यहूदा के घराने की उस बुराई के कारण जो उन्होंने अपने ही लिए की थी, ताकि वे बाल के लिए धूप जलाकर मुझे क्रोध दिलाएँ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘बाल के लिए धुआँ उठाने वाली भेंट चढ़ाकर।’ इब्रानी क्रिया आराधना में धुआँ उत्पन्न करने को बताती है और प्रायः धूप जलाने के लिए प्रयुक्त होती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יהוה צבאות
  choice: सेनाओं के यहोवा
  rationale: व्यक्तिगत नाम יהוה को ‘यहोवा’ और צבאות को स्पष्ट, प्रचलित उपाधि ‘सेनाओं के’ के रूप में रखा गया है; इससे दैवी सेनाओं पर अधिकार का भाव बना रहता है।
- source_word: הַנּוֹטֵעַ אוֹתָךְ
  choice: जिसने तुझे रोपा था
  rationale: यह निकटवर्ती जैतून-वृक्ष के रूपक को बनाए रखता है और हिन्दी में संबंधवाचक उपवाक्य स्वाभाविक है।
- source_word: דִּבֶּר עָלַיִךְ רָעָה
  choice: तेरे विरुद्ध विपत्ति की घोषणा की है
  rationale: यहाँ רָעָה नैतिक बुराई नहीं, घोषित दंड या विपत्ति है; ‘घोषणा’ דִּבֶּר के वाचिक भाव को व्यक्त करती है।
- source_word: רָעַת בֵּית יִשְׂרָאֵל וּבֵית יְהוּדָה
  choice: इस्राएल के घराने और यहूदा के घराने की वह बुराई
  rationale: दूसरी बार इसी मूल का अर्थ नैतिक बुराई है। ‘घराना’ सामूहिक और वंशगत अभिव्यक्ति को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: אֲשֶׁר עָשׂוּ לָהֶם
  choice: जो उन्होंने अपने ही लिए की
  rationale: לָהֶם को छोड़ा नहीं गया है। ‘अपने ही लिए’ उनके अपने पक्ष में या अपने ही परिणाम के लिए किए गए कर्म की वास्तविक अस्पष्टता को कुछ हद तक बनाए रखता है।
- source_word: לְהַכְעִסֵנִי
  choice: मुझे क्रोध दिलाया
  rationale: हिफ़ील रूप का कारणवाचक भाव संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: לְקַטֵּר לַבָּעַל
  choice: बाल के लिए धूप जलाकर
  rationale: קטר का आराधनात्मक धुआँ उत्पन्न करने का विशिष्ट भाव यहाँ ‘धूप जलाकर’ से सबसे स्पष्ट रूप में आता है; व्यापक वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: יהוה צבאות की उपाधि
  choice: सेनाओं के यहोवा
  alternative: सेनाओं का प्रभु
  rationale: ‘यहोवा’ मूल व्यक्तिगत नाम को स्पष्ट रखता है, जबकि ‘सेनाओं के’ उपाधि की सैन्य और व्यापक सामर्थ्य को व्यक्त करता है।
- issue: רעה मूल के दो भिन्न अर्थ
  choice: पहले ‘विपत्ति’, फिर ‘बुराई’
  alternative: दोनों स्थानों पर ‘बुराई’
  rationale: पहला प्रयोग परमेश्वर द्वारा घोषित दंड का है और दूसरा इस्राएल तथा यहूदा के नैतिक अपराध का। अलग हिन्दी शब्द अर्थ स्पष्ट करते हैं, बिना मूल के कारण-परिणाम संबंध को मिटाए।
- issue: לָהֶם का अर्थ
  choice: अपने ही लिए
  alternative: इसे हिन्दी में अप्रकट रखना, या ‘अपने ही विरुद्ध’ कहना
  rationale: सर्वनाम को स्पष्ट रूप से रखा गया है, पर ‘अपने ही विरुद्ध’ कहकर आत्महानि का अर्थ निश्चित नहीं किया गया, क्योंकि इब्रानी संबंधकारक इतना विशिष्ट नहीं है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वृक्ष-रूपक, सामूहिक ‘घराना’, दैवी उपाधि और विपत्ति तथा नैतिक बुराई के बीच का अर्थभेद सुरक्षित रखा गया है।
