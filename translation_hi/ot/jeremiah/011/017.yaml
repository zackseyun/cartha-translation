revisions:
- from: और सेनाओं के यहोवा ने, जिसने तुझे रोपा था, तेरे विरुद्ध विपत्ति की घोषणा की है। इसका कारण इस्राएल के घराने और यहूदा के घराने की वह बुराई है, जो उन्होंने अपने ही लिए की—बाल के लिए धूप जलाकर[a] मुझे क्रोध दिलाया।
  to: और सेनाओं के यहोवा ने, जिसने तुझे रोपा, तेरे विरुद्ध विपत्ति की घोषणा की है, इस्राएल के घराने और यहूदा के घराने की उस बुराई के कारण जो उन्होंने अपने ही लिए की थी, ताकि वे बाल के लिए धूप जलाकर मुझे क्रोध दिलाएँ।[a]
  rationale: The revision retains every principal lexical decision of the draft, including the deliberately noncommittal ‘अपने ही लिए’ for לָהֶם. It restructures the final clause so that the plural actors, the purpose of provoking God, and the means of burning incense to Baal are clear and idiomatic in modern Hindi. The footnote anchor remains attached to ‘धूप जलाकर,’ the expression it qualifies.
  reviewer_model: gpt-5.6-terra
