id: JER.11.14
reference: Jeremiah 11:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אַתָּ֗ה אַל תִּתְפַּלֵּל֙ בְּעַד הָ/עָ֣ם הַ/זֶּ֔ה וְ/אַל תִּשָּׂ֥א בַעֲדָ֖/ם רִנָּ֣ה וּ/תְפִלָּ֑ה כִּ֣י אֵינֶ֣/נִּי שֹׁמֵ֗עַ בְּ/עֵ֛ת קָרְאָ֥/ם אֵלַ֖/י בְּעַ֥ד רָעָתָֽ/ם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/014.yaml
  text: But as for you[a], do not pray for this people, and do not lift up a cry or prayer on their behalf, for I am not listening at the time when they call to me because of their disaster.
translation:
  language: hi
  text: पर तुम इस प्रजा के लिए प्रार्थना मत करो और न उनकी ओर से पुकार या प्रार्थना उठाओ, क्योंकि जिस समय वे अपनी विपत्ति[a] के कारण मुझे पुकारते हैं, उस समय मैं उनकी नहीं सुनता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपनी बुराई के कारण।’ इब्रानी शब्द का अर्थ ‘बुराई’ भी हो सकता है, पर यहाँ संभवतः उन पर आई विपत्ति अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: पर तुम
  rationale: संयोजक और स्वतंत्र सर्वनाम यिर्मयाह को दिए गए आदेश में विरोध और बल प्रकट करते हैं; ‘पर तुम’ इसे स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: אַל תִּתְפַּלֵּל
  choice: प्रार्थना मत करो
  rationale: निषेधात्मक particle और क्रियारूप स्पष्ट मनाही व्यक्त करते हैं; ‘प्रार्थना करना’ यहाँ क्रिया का सामान्य और व्यापक अर्थ है।
- source_word: בְּעַד הָעָם הַזֶּה
  choice: इस प्रजा के लिए
  rationale: בְּעַד किसी के हित में या उसकी ओर से किए गए निवेदन को दर्शाता है; यह वाक्यांश मध्यस्थ प्रार्थना का भाव रखता है।
- source_word: וְאַל תִּשָּׂא
  choice: और न ... उठाओ
  rationale: נשא का मूल चित्र ‘उठाना’ है; प्रार्थना के संदर्भ में इसे रखने से इब्रानी अभिव्यक्ति का बिंब सुरक्षित रहता है।
- source_word: בַעֲדָם
  choice: उनकी ओर से
  rationale: यह फिर से प्रतिनिधिक या मध्यस्थ निवेदन का संकेत देता है।
- source_word: רִנָּה
  choice: पुकार
  rationale: यह शब्द यहाँ आनंद-घोष नहीं, बल्कि संकट में की गई ऊँची और आग्रहपूर्ण पुकार को दर्शाता है।
- source_word: וּתְפִלָּה
  choice: या प्रार्थना
  rationale: इब्रानी संयोजक का शाब्दिक अर्थ ‘और’ है, पर दो निषिद्ध प्रकारों को जोड़ते हुए हिन्दी में ‘या’ अधिक स्वाभाविक है और आशय को ठीक रखता है।
- source_word: כִּי אֵינֶנִּי שֹׁמֵעַ
  choice: क्योंकि ... मैं उनकी नहीं सुनता
  rationale: नकार के साथ कृदंत वर्तमान और सक्रिय रूप से न सुनने, अर्थात ध्यान न देने, का भाव देता है; ‘उनकी नहीं सुनता’ हिन्दी में केवल ध्वनि न सुन पाने के बजाय उनकी विनती स्वीकार न करने को व्यक्त करता है।
- source_word: בְּעֵת קָרְאָם אֵלַי
  choice: जिस समय वे ... मुझे पुकारते हैं
  rationale: בְּעֵת समय-संबंध को स्पष्ट करता है; यह रूप मूल के ‘उनके पुकारने के समय’ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּעַד רָעָתָם
  choice: अपनी विपत्ति के कारण
  rationale: רָעָה नैतिक बुराई या आई हुई विपत्ति दोनों का अर्थ दे सकता है। यहाँ लोगों की पुकार का अवसर उनके ऊपर आई विपत्ति है; ‘विपत्ति’ तात्कालिक संदर्भ के अनुकूल है, जबकि वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: अंतिम खंड में רָעָה का अर्थ
  choice: विपत्ति
  alternative: बुराई / दुष्टता
  rationale: लोग संकट के समय यहोवा को पुकार रहे हैं, इसलिए यह शब्द उस विपत्ति को सूचित करता है जिसके कारण वे सहायता माँगते हैं। फिर भी शब्द की नैतिक ‘बुराई’ वाली संभाव्यता को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: परमेश्वर के न सुनने का काल और भाव
  choice: मैं उनकी नहीं सुनता
  alternative: मैं उनकी नहीं सुनूँगा
  rationale: אֵינֶנִּי שֹׁמֵעַ नकारयुक्त कृदंत है, जो वर्तमान या सामान्य सक्रिय अस्वीकृति व्यक्त करता है। भविष्यकाल संदर्भ में संभव है, पर मूल की व्याकरणिक बनावट को कम प्रत्यक्ष बनाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सीधा संबोधन रखा गया है। ‘पुकार या प्रार्थना उठाओ’ मूल की काव्यात्मक छवि को सुरक्षित रखता है, जबकि शेष वाक्य सामान्य पाठक के लिए सहज है। पादटिप्पणी-चिह्न को संबंधित शब्द ‘विपत्ति’ के बाद रखा गया है।
