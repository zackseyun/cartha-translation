  text: וְ/הָֽלְכ֞וּ עָרֵ֣י יְהוּדָ֗ה וְ/יֹשְׁבֵי֙ יְר֣וּשָׁלִַ֔ם וְ/זָֽעֲקוּ֙ אֶל הָ֣/אֱלֹהִ֔ים אֲשֶׁ֛ר הֵ֥ם מְקַטְּרִ֖ים לָ/הֶ֑ם וְ/הוֹשֵׁ֛עַ לֹֽא יוֹשִׁ֥יעוּ לָ/הֶ֖ם בְּ/עֵ֥ת רָעָתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/012.yaml
  text: Then the cities of Judah and the inhabitants of Jerusalem will go and cry out to the gods to whom they burn incense[a], but they will certainly not save them in the time of their trouble.
translation:
  language: hi
  text: तब यहूदा के नगरों के लोग और यरूशलेम के निवासी जाकर उन देवताओं को पुकारेंगे, जिन्हें वे धूप चढ़ाते हैं; पर वे उनकी मुसीबत के समय[a] उन्हें बिलकुल नहीं बचाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनकी विपत्ति के समय” अथवा “उनकी आपदा के समय।”
    reason: רָעָה के इस प्रसंग में ‘मुसीबत’, ‘विपत्ति’ और ‘आपदा’ सम्भव अर्थ हैं; मुख्य पाठ में सबसे सहज सामान्य हिन्दी रखी गई है।
lexical_decisions:
- source_word: וְהָלְכוּ
  choice: तब ... जाकर
  rationale: संदर्भ में वाव-संयुक्त पूर्ण क्रिया आगामी और परिणामस्वरूप होने वाली कार्रवाई बताती है; ‘तब’ इस क्रम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עָרֵי יְהוּדָה
  choice: यहूदा के नगरों
  rationale: सम्बन्धवाचक रचना का सीधा और सहज हिन्दी रूप। ‘जाकर’ के साथ कर्ता होने के कारण ‘नगरों’ का तिर्यक रूप आया है।
- source_word: וְיֹשְׁבֵי יְרוּשָׁלִַם
  choice: और यरूशलेम के निवासियों के लोग
  rationale: कृदन्त रूप वहाँ रहने वाली जनसंख्या को सामूहिक रूप से दर्शाता है। ‘लोग’ जोड़ने से ‘नगरों ... जाकर’ के साथ मानवीय कर्ता स्पष्ट रहता है।
- source_word: וְזָעֲקוּ אֶל
  choice: पुकारेंगे
  rationale: זעק संकट में सहायता के लिए लगाई गई व्याकुल पुकार को दर्शाता है; ‘पुकारेंगे’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: הָאֱלֹהִים
  choice: उन देवताओं
  rationale: सापेक्ष उपवाक्य और मूर्तिपूजा का निकट संदर्भ यहाँ बहुवचन झूठे देवताओं की ओर संकेत करता है।
- source_word: אֲשֶׁר הֵם מְקַטְּרִים לָהֶם
  choice: जिनके लिए वे धूप जलाते हैं
  rationale: यह उपवाक्य देवताओं को उनके लिए किए जाने वाले धूप-अर्पण से पहचानता है; ‘धूप जलाते हैं’ קטר का स्पष्ट और प्रचलित हिन्दी रूप है।
- source_word: וְהוֹשֵׁעַ לֹא יוֹשִׁיעוּ לָהֶם
  choice: पर वे ... उन्हें कदापि नहीं बचाएँगे
  rationale: क्रिया के साथ प्रयुक्त infinitive absolute निषेध को बल देता है। ‘कदापि नहीं’ इस emphatic force को गरिमापूर्ण और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּעֵת רָעָתָם
  choice: उनकी मुसीबत के समय
  rationale: यहाँ רָעָה नैतिक बुराई के बजाय झेली जाने वाली विपत्ति या संकट को दर्शाता है; ‘मुसीबत’ आम पाठक के लिए सहज है।
theological_decisions:
- issue: אֱלֹהִים का अभिप्राय
  choice: यहूदा और यरूशलेम द्वारा पूजे जाने वाले अनेक देवता
  alternative: कोई सामान्य एकवचन ‘ईश्वर’ या ‘देवता’
  rationale: ‘जिनके लिए वे धूप जलाते हैं’ और यिर्मयाह 11 का मूर्तिपूजा-विरोधी संदर्भ बहुवचन अभिप्राय स्पष्ट करते हैं; इसलिए ‘देवताओं’ मूल आशय को बिना अतिरिक्त धर्मवैज्ञानिक विस्तार के व्यक्त करता है।
- issue: הוֹשֵׁעַ לֹא יוֹשִׁיעוּ में बल
  choice: ‘कदापि नहीं बचाएँगे’ द्वारा निषेध का बल बनाए रखना
  alternative: ‘नहीं बचाएँगे’
  rationale: infinitive absolute और finite verb का संयोजन यहाँ बचा पाने के पूर्ण निषेध पर बल देता है; हिन्दी में ‘कदापि नहीं’ उस तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण शैली। वाक्य में भविष्यसूचक क्रम, मूर्तिपूजक देवताओं का बहुवचन और बचाव के emphatic निषेध को बनाए रखा गया है।
