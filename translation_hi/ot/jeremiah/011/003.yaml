reference: Jeremiah 11:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֔ם כֹּֽה אָמַ֥ר יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל אָר֣וּר הָ/אִ֔ישׁ אֲשֶׁר֙ לֹ֣א יִשְׁמַ֔ע אֶת דִּבְרֵ֖י הַ/בְּרִ֥ית הַ/זֹּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/003.yaml
  text: 'And you shall say to them, ‘Thus says the LORD, the God of Israel: Cursed is the man who does not listen to the words of this covenant,’'
translation:
  language: hi
  text: 'और उनसे कहना, “इस्राएल का परमेश्वर यहोवा यों कहता है: शापित है वह मनुष्य जो इस वाचा के वचनों को नहीं सुनता।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: और उनसे कहना
  rationale: इब्रानी वे-क़ातल रूप यहाँ दिए जा रहे निर्देश को आगे बढ़ाता है; आधुनिक हिंदी में ‘कहना’ स्वाभाविक और निर्देशात्मक है।
- source_word: כֹּה אָמַר
  choice: यों कहता है
  rationale: नबी-संदेश के पारंपरिक सूत्र का स्वाभाविक, गरिमापूर्ण हिंदी रूप।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए ईश्वरीय व्यक्तिगत नाम को नाम के रूप में स्पष्ट रखा गया है।
- source_word: אָרוּר הָאִישׁ
  choice: शापित है वह मनुष्य
  rationale: शाप-घोषणा की बलाघाती संरचना और सामान्य मानवीय संदर्भ दोनों सुरक्षित रहते हैं।
- source_word: לֹא יִשְׁמַע
  choice: नहीं सुनता
  rationale: שׁמע का मूल अर्थ ‘सुनना’ है और संदर्भ में आज्ञापालन का भाव निहित हो सकता है; ‘सुनता’ रखने से यह अर्थ-व्याप्ति और मूल की तनावपूर्ण व्यापकता बनी रहती है।
- source_word: דִּבְרֵי הַבְּרִית הַזֹּאת
  choice: इस वाचा के वचनों को
  rationale: ‘वचन’ दִּבְרֵי के बहुवचन और वाचा में कही गई बातों/शर्तों को निकटता से व्यक्त करता है।
theological_decisions:
- issue: ‘सुनना’ और ‘आज्ञा मानना’ के बीच अर्थ
  choice: नहीं सुनता
  alternative: पालन नहीं करता / आज्ञा नहीं मानता
  rationale: इब्रानी שׁמע सुनने और आज्ञापालन दोनों की ओर संकेत कर सकता है। मुख्य पाठ में ‘सुनता’ मूल शब्द को अधिक सीधे प्रस्तुत करता है और निहित आज्ञापालन को अनावश्यक रूप से एकमात्र अर्थ नहीं बनाता।
- issue: दिव्य नाम का निरूपण
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में चतुरक्षरीय व्यक्तिगत नाम יהוה है; उसे सामान्य उपाधि से बदलने के बजाय हिंदी में प्रचलित नामरूप दिया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी; भविष्यवाणी-सूत्र के लिए गरिमापूर्ण बाइबलीय शैली रखी गई है, पर वाक्यरचना साधारण पाठक के लिए सहज है। कोई पादटिप्पणी आवश्यक नहीं।
