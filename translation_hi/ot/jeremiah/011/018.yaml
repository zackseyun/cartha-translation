reference: Jeremiah 11:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַֽ/יהוָ֥ה הֽוֹדִיעַ֖/נִי וָֽ/אֵדָ֑עָ/ה אָ֖ז הִרְאִיתַ֥/נִי מַעַלְלֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/018.yaml
  text: And Yahweh made it known to me[a], and I knew; then you showed me their deeds.
translation:
  language: hi
  text: और यहवे ने मुझे यह बात जता दी[a], और मैं जान गया; तब आपने मुझे उनके काम दिखाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में पहले यहवे का उल्लेख तृतीय पुरुष में है, फिर वाक्य द्वितीय पुरुष (‘आपने मुझे दिखाए’) में बदल जाता है। संभवतः यिर्मयाह यहाँ सीधे यहवे को संबोधित कर रहा है; कुछ अनुवाद इसे समतल करके ‘उन्होंने मुझे दिखाए’ करते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיהוָה
  choice: और यहवे
  rationale: वाव को ‘और’ से रखा गया है तथा परमेश्वर के निज नाम יהוה को हिन्दी में ‘यहवे’ रूप में लिप्यंतरित किया गया है।
- source_word: הוֹדִיעַנִי
  choice: मुझे यह बात जता दी
  rationale: ידע के हिफ़ील रूप का कारणवाचक अर्थ ‘ज्ञात कराना’ है। ‘यह बात’ इब्रानी में निहित, पर अनिर्दिष्ट, कर्म को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וָאֵדָעָה
  choice: और मैं जान गया
  rationale: संयोजक वाव को बनाए रखते हुए ज्ञान प्राप्त होने का भाव स्वाभाविक हिन्दी में व्यक्त किया गया है; अनावश्यक रूप से स्पष्ट कारणार्थ नहीं जोड़ा गया।
- source_word: אָז
  choice: तब
  rationale: यह कालसूचक क्रियाविशेषण घटनाक्रम में अगले क्षण या चरण को दर्शाता है।
- source_word: הִרְאִיתַנִי
  choice: आपने मुझे ... दिखाए
  rationale: ראה के हिफ़ील रूप का अर्थ ‘दिखाना’ है। द्वितीय पुरुष एकवचन को ‘आपने’ द्वारा रखा गया है, जिससे यहवे के उल्लेख से उन्हें सीधे संबोधन की ओर मूल पाठ का परिवर्तन सुरक्षित रहता है।
- source_word: מַעַלְלֵיהֶם
  choice: उनके काम
  rationale: מַעֲלָל कर्मों या किए गए कामों को दर्शाता है और संदर्भ में नैतिक रंग हो सकता है। ‘काम’ सरल व स्वाभाविक है तथा यहाँ ‘बुरे’ जोड़कर अर्थ को अधिक स्पष्ट नहीं करता।
theological_decisions:
- issue: परमेश्वर के निज नाम יהוה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का निज नाम सीधे आया है; ‘यहवे’ उसे उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित करता है।
- issue: परमेश्वर के लिए तृतीय पुरुष से द्वितीय पुरुष की ओर परिवर्तन
  choice: ‘यहवे ने ... तब आपने’—परिवर्तन को बनाए रखना
  alternative: ‘यहवे ने ... तब उन्होंने’—पूरे वाक्य को तृतीय पुरुष में समतल करना
  rationale: इब्रानी पाठ पहले יהוה का नाम लेता है और फिर द्वितीय पुरुष एकवचन में सीधे संबोधित करता है। इस आकस्मिक परिवर्तन को बनाए रखना उसकी वाक्पटुता और संभावित प्रार्थनात्मक संबोधन को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। परमेश्वर के लिए आदरसूचक द्वितीय पुरुष ‘आप’ रखा गया है। अर्धविराम मूल की दो निकट संबद्ध उद्घाटन-क्रियाओं को अलग करता है और व्यक्ति-परिवर्तन को स्पष्ट रहने देता है।
