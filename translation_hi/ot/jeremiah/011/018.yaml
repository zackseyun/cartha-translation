  source_fidelity: The translation accurately represents the waw, the causative sense of הוֹדִיעַנִי ('मुझे यह बात जता दी'), Jeremiah's resulting knowledge, אָז ('तब'), and the causative second-person singular verb הִרְאִיתַנִי. The shift from reference to Yahweh in the third person to direct second-person address is retained. 'उनके काम' suitably renders מַעַלְלֵיהֶם without importing an explicit negative qualifier.
