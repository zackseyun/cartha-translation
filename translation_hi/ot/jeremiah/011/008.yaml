base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/008.yaml
  text: Yet they did not listen or incline their ear[a], but each one walked in the stubbornness of his evil heart; so I brought upon them all the words of this covenant, which I commanded them to do[b], but they did not do them.
translation:
  language: hi
  text: फिर भी उन्होंने न सुना, न कान झुकाया[a], बल्कि हर एक अपने बुरे मन की हठ के अनुसार चलता रहा। इसलिए मैं इस वाचा की सारी बातें उन पर ले आया, जिन्हें करने की आज्ञा मैंने उन्हें दी थी[b], पर उन्होंने वैसा नहीं किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ध्यान नहीं दिया”; इस प्रसंग में सुनने से इनकार के साथ आज्ञा न मानने का भाव भी है।
    reason: lexical_alternative
  - marker: b
    text: मूल में “इस वाचा की सारी बातें”; इसमें वाचा में घोषित दण्ड भी शामिल हो सकते हैं, केवल उसकी आज्ञाएँ ही नहीं।
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁמְעוּ
  choice: मेरी बात सुनी
  rationale: שׁמע का अर्थ सुनना, ध्यान देना या आज्ञा मानना हो सकता है। प्रसंग में परमेश्वर की बात न सुनने का भाव है; हिन्दी में ‘मेरी बात सुनी’ श्रवण और आज्ञापालन, दोनों संकेतों को स्वाभाविक रूप से बनाए रखता है।
- source_word: הִטּוּ אֶת אָזְנָם
  choice: मेरी ओर कान लगाया
  rationale: यह ध्यानपूर्वक सुनने का इब्रानी मुहावरा है। ‘कान लगाया’ मूल रूपक को रखते हुए आधुनिक हिन्दी में बोधगम्य है; ‘मेरी ओर’ प्रसंग से निहित वक्ता को स्पष्ट करता है।
- source_word: וַיֵּלְכוּ אִישׁ
  choice: हर एक ... चलता रहा
  rationale: אִישׁ यहाँ वितरणात्मक अर्थ में ‘हर एक’ है, केवल पुरुषों का संकेत नहीं। ‘चलता रहा’ आचरण के लिए प्रयुक्त इब्रानी रूपक और लगातार व्यवहार का भाव रखता है।
- source_word: בִּשְׁרִירוּת לִבָּם הָרָע
  choice: अपने बुरे मन की हठ पर
  rationale: שׁרירות स्वेच्छाचारी हठ या जिद को व्यक्त करता है। לב को यहाँ हिन्दी के स्वाभाविक नैतिक-अंतरंग अर्थ में ‘मन’ कहा गया है। ‘हर एक’ के साथ ‘अपने’ मूल के वितरणात्मक भाव को बनाए रखता है।
- source_word: וָאָבִיא עֲלֵיהֶם
  choice: इसलिए मैं उन पर ... ले आया
  rationale: वाव यहाँ विद्रोह के परिणाम को आगे बढ़ाता है। ‘इसलिए’ संबंध स्पष्ट करता है, और ‘उन पर ... ले आया’ मूल क्रिया और न्याय के आ पड़ने की छवि को रखता है।
- source_word: כָּל דִּבְרֵי הַבְּרִית הַזֹּאת
  choice: इस वाचा की वे सब बातें
  rationale: דִּבְרֵי का मूल अर्थ ‘बातें/वचन’ है। ‘बातें’ विधान और घोषित दण्ड, दोनों को समेट सकने वाली व्यापकता बनाए रखता है।
- source_word: אֲשֶׁר צִוִּיתִי לַעֲשׂוֹת
  choice: जिन्हें करने की आज्ञा मैंने उन्हें दी थी
  rationale: इब्रानी ‘करने’ को सीधा रखता है। हिन्दी में संदर्भगत कर्म और प्राप्तकर्ता को स्पष्ट करने के लिए ‘जिन्हें’ तथा ‘उन्हें’ जोड़े गए हैं।
- source_word: וְלֹא עָשׂוּ
  choice: पर उन्होंने उन्हें नहीं किया
  rationale: कर्म पूर्ववर्ती वाचा की ‘बातें’ हैं। ‘उन्हें नहीं किया’ मूल की पुनरुक्ति और आज्ञाओं को पूरा न करने पर दिए बल को बनाए रखता है।
theological_decisions:
- issue: ‘इस वाचा की सब बातें’ में वाचा के दण्ड-वचनों का समावेश
  choice: मुख्य पाठ में व्यापक और मूलानुरूप ‘बातें’ रखा गया है।
  alternative: इस वाचा के सब शाप; इस वाचा की सब शर्तें
  rationale: प्रसंग में घोषित दण्डों का उन पर आना सम्भावित है, पर इब्रानी पाठ ‘बातें/वचन’ कहता है। इसे किसी एक अर्थ तक सीमित न करके वास्तविक व्यापकता और तनाव सुरक्षित रखा गया है।
- issue: אִישׁ का लिंग और वितरणात्मक प्रयोग
  choice: हर एक
  alternative: हर पुरुष
  rationale: यहाँ शब्द समुदाय के प्रत्येक सदस्य को वितरणात्मक रूप से दर्शाता है; ‘हर एक’ स्रोत के आशय को बिना अनावश्यक पुरुष-सीमा के व्यक्त करता है।
- issue: שׁמע में सुनने और आज्ञा मानने का संबंध
  choice: मुख्य पाठ में ‘मेरी बात सुनी’, पादटिप्पणी में आज्ञापालन का संकेत
  alternative: मेरी आज्ञा नहीं मानी
  rationale: सिर्फ ‘आज्ञा नहीं मानी’ कहना श्रवण-रूपक को समाप्त कर देता। मुख्य पाठ और पादटिप्पणी मिलकर शब्द की वास्तविक अर्थ-व्याप्ति रखते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्वाभाविक, गरिमापूर्ण स्तर रखा गया है। ‘वाचा’ बाइबलीय संकल्पना की सटीकता के लिए प्रयुक्त है। ‘कान लगाया’, ‘चलता रहा’ और ‘उन पर ... ले आया’ जैसे रूपक मूल की छवियों को यथासम्भव बनाए रखते हैं।
