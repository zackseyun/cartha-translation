  text: הַ/דָּבָר֙ אֲשֶׁ֣ר הָיָ֣ה אֶֽל יִרְמְיָ֔הוּ מֵ/אֵ֥ת יְהוָ֖ה לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/001.yaml
  text: The word that came to Jeremiah from Yahweh[a], saying,
translation:
  language: hi
  text: 'वह वचन जो याहवे[a] की ओर से यिर्मयाह के पास आया, यह कहते हुए:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: YHWH (יהוה), परमेश्वर का व्यक्तिगत नाम; यहाँ ‘याहवे’ लिप्यंतरित किया गया है। अनेक अनुवादों में इसे ‘प्रभु’ के रूप में प्रस्तुत किया जाता है।'
    reason: दिव्य नाम के इब्रानी रूप, अपनाए गए हिंदी लिप्यंतरण, और पारंपरिक प्रतिस्थापन को स्पष्ट करना।
lexical_decisions:
- source_word: הַדָּבָר
  choice: वह वचन
  rationale: נבואीय आरंभ-सूत्र में דָּבָר परमेश्वर से प्राप्त वचन या संदेश को दर्शाता है। ‘वचन’ सूत्रात्मकता और धार्मिक संदर्भ दोनों बनाए रखता है; निश्चित उपपद को ‘वह’ से व्यक्त किया गया है।
- source_word: אֲשֶׁר הָיָה אֶל
  choice: जो … के पास आया
  rationale: הָיָה का मूल अर्थ ‘हुआ/था’ है, पर इस प्रचलित नबूवतीय सूत्र में हिंदी का स्वाभाविक अर्थ ‘के पास आया’ है और यिर्मयाह को प्राप्तकर्ता के रूप में स्पष्ट करता है।
- source_word: יִרְמְיָהוּ
  choice: यिर्मयाह
  rationale: व्यक्तिनाम का हिंदी बाइबलीय परंपरा में प्रचलित लिप्यंतरण।
- source_word: מֵאֵת
  choice: की ओर से
  rationale: यह संयुक्त संबंधबोधक स्रोत या उद्गम बताता है। ‘की ओर से’ स्पष्ट करता है कि वचन यहोवा से आया।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिंदी पाठकों में व्यापक रूप से पहचाना जाने वाला दिव्य नाम; शीर्षक से बदलने के बजाय इब्रानी चतुरक्षर YHWH को नाम के रूप में सुरक्षित रखता है।
- source_word: לֵאמֹר
  choice: ':'
  rationale: यह रूप आगे आने वाले प्रत्यक्ष कथन का परिचय देता है। आधुनिक हिंदी में पद के अंत पर विसर्ग अगले पद के उद्धरण से संबंध को स्वाभाविक और संक्षिप्त रूप में व्यक्त करता है; शाब्दिक ‘यह कहते हुए’ यहाँ कृत्रिम लगता।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ व्यक्तिगत दिव्य नाम YHWH रखता है। ‘यहोवा’ आधुनिक हिंदी बाइबल-परंपरा में परिचित नामरूप है; ‘प्रभु’ नाम को उपाधि में बदल देता, जबकि ‘याहवे’ मूल उच्चारण का अधिक संभावित शैक्षिक पुनर्निर्माण है। पादटिप्पणी मूल रूप और उच्चारण की अनिश्चितता बताती है।
- issue: לֵאמֹר द्वारा अगले कथन की प्रस्तावना
  choice: विसर्ग द्वारा प्रत्यक्ष कथन का संकेत
  alternative: यह कहते हुए
  rationale: मूल का वाक्य-संबंध सुरक्षित रखते हुए हिंदी में अनावश्यक और अस्वाभाविक कृदंत से बचा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिंदी पाठक के लिए सहज रखी गई है। नबूवतीय आरंभ-सूत्र को बनाए रखते हुए वाक्य को अगले पद के प्रत्यक्ष कथन से जोड़ने के लिए अंत में विसर्ग रखा गया है।
