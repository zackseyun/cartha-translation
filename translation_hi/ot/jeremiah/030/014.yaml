source:
  edition: WLC
  text: כָּל מְאַהֲבַ֣יִ/ךְ שְׁכֵח֔וּ/ךְ אוֹתָ֖/ךְ לֹ֣א יִדְרֹ֑שׁוּ כִּי֩ מַכַּ֨ת אוֹיֵ֤ב הִכִּיתִי/ךְ֙ מוּסַ֣ר אַכְזָרִ֔י עַ֚ל רֹ֣ב עֲוֺנֵ֔/ךְ עָצְמ֖וּ חַטֹּאתָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/014.yaml
  text: All your lovers have forgotten you[a]; they do not seek you. For I have struck you with the wound of an enemy, with cruel discipline, because of the greatness of your iniquity[b]; your sins are numerous.
translation:
  language: hi
  text: तेरे सभी प्रेमी तुझे भूल गए हैं[a]; वे तेरी खोज-खबर नहीं लेते। क्योंकि मैंने तुझ पर शत्रु-जैसा प्रहार किया है, तुझे निर्दय ताड़ना दी है, तेरे अधर्म की अधिकता के कारण[b]; तेरे पाप बहुत बढ़ गए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तेरे सहयोगी।” इब्रानी में शाब्दिक रूप से “तेरे प्रेमी” है; यिर्मयाह में यह उन विदेशी सहयोगियों और अनुचित राजनीतिक तथा आत्मिक संबंधों का रूपक है जिनके पीछे लोग गए थे।
    reason: lexical_alternative
  - marker: b
    text: “निर्दय ताड़ना” का अनुवाद “कठोर सुधार” या “निर्दय दंड” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מְאַהֲבַיִךְ
  choice: तेरे सभी प्रेमी
  rationale: शाब्दिक अर्थ ‘प्रेमी’ है और यिर्मयाह में विदेशी सहयोगियों तथा अनुचित राजनीतिक-आत्मिक लगावों के रूपक को बनाए रखता है।
- source_word: שְׁכֵחוּךְ
  choice: तुझे भूल गए हैं
  rationale: שׁכח का मूल अर्थ ‘भूलना’ है; हिन्दी पूर्ण पक्ष वर्तमान परिणाम को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אוֹתָךְ לֹא יִדְרֹשׁוּ
  choice: वे तेरी खोज-खबर नहीं लेते
  rationale: דרש यहाँ केवल ढूँढ़ने से अधिक, किसी का हाल पूछने या उसकी सुध लेने का भाव रखता है; यह सहज हिन्दी उस संदर्भगत अर्थ को व्यक्त करती है।
- source_word: מַכַּת אוֹיֵב
  choice: शत्रु के-से घाव
  rationale: מכה ‘चोट/घाव’ हो सकता है। ‘शत्रु के-से’ तुलना का वह कठोर भाव सुरक्षित रखता है जिसमें परमेश्वर का प्रहार शत्रु-जैसा बताया गया है।
- source_word: הִכִּיתִיךְ
  choice: मैंने तुझे ... मारा है
  rationale: נכה का सामान्य अर्थ ‘मारना/प्रहार करना’ है; अनुवाद परमेश्वर की प्रत्यक्ष कर्तृता को बनाए रखता है।
- source_word: מוּסַר אַכְזָרִי
  choice: निर्दय ताड़ना
  rationale: מוּסָר सुधारात्मक अनुशासन या ताड़ना और אַכְזָרִי निर्दय/कठोर को व्यक्त करता है। ‘निर्दय ताड़ना’ संक्षिप्त, गंभीर और आधुनिक हिन्दी में बोधगम्य है।
- source_word: עַל רֹב עֲוֺנֵךְ
  choice: तेरे अधर्म की अधिकता के कारण
  rationale: רֹב बहुतायत/अधिकता और עָוֹן अधर्म या दोष का अर्थ रखता है; कारणसूचक संबंध स्पष्ट रखा गया है।
- source_word: עָצְמוּ חַטֹּאתָיִךְ
  choice: तेरे पाप बहुत बढ़ गए हैं
  rationale: עצם यहाँ पापों के बहुत या प्रबल हो जाने का भाव दे सकता है। ‘बहुत बढ़ गए हैं’ संख्या और गंभीरता, दोनों की संभावित छाया को स्वाभाविक हिन्दी में खुला रखता है।
theological_decisions:
- issue: न्याय में परमेश्वर की कर्तृता
  choice: ‘मैंने तुझे ... मारा है’ द्वारा परमेश्वर को प्रत्यक्ष कर्ता रखा गया है।
  alternative: इसे केवल शत्रु की कार्रवाई या पाप के स्वतः परिणाम के रूप में नरम करना।
  rationale: इब्रानी पाठ स्पष्टतः प्रथम पुरुष में ‘मैंने तुझे मारा’ कहता है और इसका कारण अधर्म तथा पाप बताता है; अनुवाद इस धर्मवैज्ञानिक तनाव को बिना नरम किए सुरक्षित रखता है।
- issue: ‘प्रेमियों’ की रूपकात्मक पहचान
  choice: मुख्य पाठ में ‘प्रेमी’ रखा गया है।
  alternative: मुख्य पाठ में ‘सहयोगी’ रखना।
  rationale: ‘प्रेमी’ यिर्मयाह के वैवाहिक और राजनीतिक रूपक को सुरक्षित रखता है, जबकि पादटिप्पणी राजनीतिक आशय स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में एकवचन स्त्रीलिंग संबोधन के लिए ‘तेरे/तुझे/तेरी’ रखा गया है, क्योंकि संदर्भ सिय्योन/यहूदा को व्यक्तिरूप में संबोधित करता है। भाषा गंभीर और भविष्यद्वक्तात्मक है, पर अनावश्यक संस्कृतनिष्ठता से बचती है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
