  text: לָ/כֵ֞ן כָּל אֹכְלַ֨יִ/ךְ֙ יֵאָכֵ֔לוּ וְ/כָל צָרַ֥יִ/ךְ כֻּלָּ֖/ם בַּ/שְּׁבִ֣י יֵלֵ֑כוּ וְ/הָי֤וּ שֹׁאסַ֨יִ/ךְ֙ לִ/מְשִׁסָּ֔ה וְ/כָל בֹּזְזַ֖יִ/ךְ אֶתֵּ֥ן לָ/בַֽז־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/016.yaml
  text: Therefore all who devour you will be devoured[a], and all your adversaries, every one of them, will go into captivity; those who plunder you will become plunder, and all who prey on you I will give up to prey.
translation:
  language: hi
  text: इसलिए जो तुझे निगलते हैं, वे सब निगल लिए जाएँगे; तेरे सारे विरोधी, उनमें से हर एक, बंदी बनाकर ले जाए जाएँगे। जो तुझे लूटते हैं, वे स्वयं लूट का माल हो जाएँगे; और तेरे सब लुटेरों को मैं लूट के लिए सौंप दूँगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो तेरा माल छीनते हैं, उन सबको मैं लूट का माल बना दूँगा।” अंतिम उपवाक्य में इब्रानी भाषा लूटने और लूट के माल के लिए निकट संबंध वाले शब्दों का प्रयोग करती है।
    reason: अंतिम इब्रानी वाक्यांश की अधिक रूपात्मक वैकल्पिक अभिव्यक्ति और उसकी शब्द-क्रीड़ा को दर्ज करना।
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले कथन से निकलने वाले परिणाम को सहज और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: אֹכְלַיִךְ / יֵאָכֵלוּ
  choice: जो तुझे निगल जाते हैं, वे सब निगल लिए जाएँगे
  rationale: मूल क्रिया का शाब्दिक अर्थ ‘खाना’ है, पर यहाँ शत्रुओं द्वारा विनाश करने का रूपक है। ‘निगलना’ उस सजीव रूपक और प्रतिफल की शब्द-क्रीड़ा दोनों को बनाए रखता है।
- source_word: צָרַיִךְ
  choice: तेरे सारे विरोधी
  rationale: यह शत्रुता करने वालों को दर्शाता है; ‘विरोधी’ आधुनिक हिन्दी में स्वाभाविक है और अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: כֻּלָּם
  choice: एक-एक करके
  rationale: ‘सारे’ के बाद मूल पाठ में आए बलाघात को हिन्दी में वितरणात्मक ढंग से स्पष्ट करता है—उनमें से कोई नहीं बचेगा।
- source_word: בַּשְּׁבִי יֵלֵכוּ
  choice: बंधुआई में जाएँगे
  rationale: यह केवल स्थान-परिवर्तन या निर्वासन नहीं, बल्कि बंदी बनाकर ले जाए जाने की दशा को व्यक्त करता है।
- source_word: שֹׁאסַיִךְ / לִמְשִׁסָּה
  choice: जो तुझे लूटते हैं, वे स्वयं लूट का माल हो जाएँगे
  rationale: कर्ता और उसके प्रतिफल के बीच मूल पाठ की उलटफेर वाली शब्द-क्रीड़ा को स्पष्ट हिन्दी में बनाए रखता है।
- source_word: בֹּזְזַיִךְ / אֶתֵּן לָבַז
  choice: जो तेरा माल छीनते हैं, उन सबको मैं लूट का माल बना दूँगा
  rationale: בזז और בז के निकट संबंध को ‘माल छीनना/लूट का माल’ द्वारा व्यक्त किया गया है। यह दैवी न्याय के रूप में अपराध के उलटे प्रतिफल को बनाए रखता है।
theological_decisions:
- issue: युद्ध और प्रतिफल के रूपक
  choice: निगलने, बंधुआई और लूट के चित्रों को बनाए रखना
  alternative: इन्हें सामान्य दंड की भाषा में सरल कर देना
  rationale: 'पद का आशय उसी उलटफेर से प्रकट होता है: जिन्होंने परमेश्वर के लोगों को नष्ट और लूटा, वे वैसा ही प्रतिफल पाएँगे। चित्रात्मक भाषा हटाने से मूल का न्याय-संबंधी बल घट जाएगा।'
- issue: दूसरे पुरुष एकवचन स्त्रीलिंग का संदर्भ
  choice: मूल के एकवचन संबोधन को ‘तुझे/तेरे/तेरा’ के रूप में रखना
  alternative: इसे स्पष्ट रूप से ‘सिय्योन’, ‘यरूशलेम’ या ‘इस्राएल’ कहना
  rationale: व्यापक संदर्भ संबोधित समुदाय की पहचान में सहायता करता है, पर इस पद में नाम नहीं दिया गया है। अनुवाद मूल की व्याकरणिक संबोधन-रीति को सुरक्षित रखता है और पहचान को पाठ में जोड़कर तय नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। संबोधन के लिए एकवचन ‘तू’ के तिर्यक रूप ‘तुझे/तेरे’ रखे गए हैं, क्योंकि मूल पाठ स्त्रीलिंग एकवचन समुदाय को संबोधित करता है। ‘बंधुआई’ भविष्यद्वाणी-संबंधी संदर्भ में परिचित है और बंदी बनाए जाने का विशिष्ट अर्थ सुरक्षित रखती है।
