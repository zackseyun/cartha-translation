    reason: lexical_alternative
lexical_decisions:
- source_word: וִהְיִיתֶם
  choice: तुम ... ठहरोगे
  rationale: היה का यह रूप संयोजक वाव के साथ यहाँ भविष्यसूचक अर्थ रखता है। ‘ठहरोगे’ भावी संबंध को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: לִי לְעָם
  choice: मेरी प्रजा
  rationale: शाब्दिक रचना ‘मेरे लिए एक प्रजा’ है, पर वाचा-सूत्र में हिन्दी का स्वाभाविक समतुल्य ‘मेरी प्रजा’ है; इससे पारस्परिक अपनापन सुरक्षित रहता है।
- source_word: וְאָנֹכִי
  choice: और मैं
  rationale: स्वतंत्र सर्वनाम אָנֹכִי में बल है। संतुलित वाक्यरचना में ‘और मैं’ इस बल को पर्याप्त रूप से बनाए रखता है, बिना हिन्दी को कृत्रिम बनाए।
- source_word: אֶהְיֶה
  choice: ठहरूँगा
  rationale: היה का अपूर्ण रूप यहाँ भविष्य अर्थ देता है। ‘ठहरूँगा’ पहले खंड के साथ क्रियात्मक समानता बनाए रखता है।
- source_word: לָכֶם לֵאלֹהִים
  choice: तुम्हारा परमेश्वर
  rationale: शाब्दिक रूप ‘तुम्हारे लिए परमेश्वर’ है; वाचा के इस प्रसंग में स्वाभाविक हिन्दी अधिकार-संबंधी अभिव्यक्ति ‘तुम्हारा परमेश्वर’ है। אֱלֹהִים यहाँ इस्राएल के परमेश्वर को सूचित करता है।
theological_decisions:
- issue: वाचा-सूत्र का अनुवाद
  choice: तुम मेरी प्रजा ठहरोगे, और मैं तुम्हारा परमेश्वर ठहरूँगा
  alternative: तुम मेरे लिए एक प्रजा होगे, और मैं तुम्हारे लिए परमेश्वर होऊँगा
  rationale: चुना हुआ पाठ मूल के भावी काल, दोनों पक्षों की समानांतर रचना और पारस्परिक वाचा-संबंध को स्वाभाविक आधुनिक हिन्दी में सुरक्षित रखता है। यह संबंध की प्रकृति के विषय में कोई अतिरिक्त सांप्रदायिक दावा नहीं जोड़ता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज हिन्दी। ‘प्रजा’ बाइबिलीय वाचा-संदर्भ में עָם के सामूहिक अर्थ को ‘लोग’ की अपेक्षा अधिक स्पष्टता से व्यक्त करती है; ‘ठहरोगे/ठहरूँगा’ मूल की समांतरता और भावी बल बनाए रखते हैं।
