reference: Jeremiah 30:23
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הִנֵּ֣ה סַעֲרַ֣ת יְהוָ֗ה חֵמָה֙ יָֽצְאָ֔ה סַ֖עַר מִתְגּוֹרֵ֑ר עַ֛ל רֹ֥אשׁ רְשָׁעִ֖ים יָחֽוּל׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/023.yaml
  text: Look[a], Yahweh’s storm of wrath has gone out, a sweeping tempest[b]; it will whirl down on the head of the wicked.
translation:
  language: hi
  text: देखो[a], यहोवा के कोप का तूफ़ान निकल पड़ा है—एक उमड़ता-घुमड़ता बवंडर; वह दुष्टों के सिर पर घूमता हुआ आ पड़ेगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “देखो, यहोवा का तूफ़ान—कोप—निकल पड़ा है, एक उमड़ता-घुमड़ता बवंडर।” इब्रानी में बल देने के लिए तूफ़ान से जुड़े शब्द एक के बाद एक रखे गए हैं।
    reason: lexical_alternative
  - marker: b
    text: या, “वह दुष्टों के सिर पर आ पड़ेगा।” अंतिम इब्रानी क्रिया का अर्थ कठिन है; मुख्य पाठ तूफ़ान की घूमती गति को प्रमुखता देता है।
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: घोषणा को सजीव और तात्कालिक बनाता है; आधुनिक हिन्दी में स्वाभाविक रहते हुए संकेतात्मक बल बनाए रखता है।
- source_word: סַעֲרַת יְהוָה
  choice: यहोवा के ... का तूफ़ान
  rationale: सम्बन्धवाचक इब्रानी रचना को स्वाभाविक हिन्दी में व्यक्त करता है और तूफ़ान को यहोवा की ओर से आने वाला बताता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- source_word: חֵמָה
  choice: कोप
  rationale: न्यायकारी और प्रचण्ड क्रोध का गरिमापूर्ण, परिचित हिन्दी रूप है।
- source_word: יָצְאָה
  choice: निकल पड़ा है
  rationale: पूर्ण क्रिया की भविष्यसूचक सजीवता और पहले ही गतिमान हो चुके न्याय—दोनों को व्यक्त करता है।
- source_word: סַעַר מִתְגּוֹרֵר
  choice: एक उमड़ता-घुमड़ता बवंडर
  rationale: दूसरे तूफ़ानी पद की तीव्रता तथा कठिन कृदन्त में निहित उग्र, चक्करदार गति को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: עַל רֹאשׁ רְשָׁעִים
  choice: दुष्टों के सिर पर
  rationale: न्याय के किसी पर लौटने या उतरने की ठोस इब्रानी छवि को अक्षुण्ण रखता है।
- source_word: יָחֽוּל
  choice: चक्कर खाता हुआ टूट पड़ेगा
  rationale: कठिन अंतिम क्रिया को तूफ़ान की घूमती गति और दुष्टों पर उसके हिंसक आ पड़ने, दोनों के संदर्भ में व्यक्त करता है; अनिश्चितता पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: टेट्राग्राम को सामान्य उपाधि ‘प्रभु’ से नहीं बदला गया। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला नाम-रूप है; ‘याहवे’ अधिक निकट ध्वन्यात्मक विकल्प है।
- issue: दिव्य कोप और तूफ़ान का सम्बन्ध
  choice: यहोवा के कोप का तूफ़ान
  alternative: यहोवा का तूफ़ान—कोप—निकल पड़ा है
  rationale: मुख्य पाठ में חֵמָה को तूफ़ान का गुण/स्वरूप मानकर सहज हिन्दी दी गई है, जबकि इब्रानी पद-संचय की अधिक खंडित सम्भावना पादटिप्पणी में रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी, स्पष्ट किंतु भविष्यद्वाणी के अनुरूप गरिमापूर्ण और प्रबल। ‘उमड़ता-घुमड़ता’ तथा ‘टूट पड़ेगा’ तूफ़ानी दृश्य को जीवंत रखते हैं; पादटिप्पणियाँ मूल की वाक्यगत और शब्दार्थगत अनिश्चितता को स्पष्ट करती हैं।
