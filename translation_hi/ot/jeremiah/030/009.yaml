  edition: WLC
  text: וְ/עָ֣בְד֔וּ אֵ֖ת יְהוָ֣ה אֱלֹֽהֵי/הֶ֑ם וְ/אֵת֙ דָּוִ֣ד מַלְכָּ֔/ם אֲשֶׁ֥ר אָקִ֖ים לָ/הֶֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/009.yaml
  text: They will serve Yahweh their God and David their king[a], whom I will raise up for them.
translation:
  language: hi
  text: वे अपने परमेश्वर यहोवा की और अपने राजा दाऊद[a] की सेवा करेंगे, जिसे मैं उनके लिए खड़ा करूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भावी दाऊदी राजा।” बहुत से व्याख्याकार यहाँ “दाऊद” को स्वयं दाऊद के बजाय मसीहा की ओर संकेत करने वाले भविष्यसूचक संदर्भ के रूप में समझते हैं।
    reason: मुख्य पाठ की शाब्दिक अभिव्यक्ति बनाए रखते हुए ‘दाऊद’ की संभावित भविष्यसूचक व्याख्या स्पष्ट करना।
lexical_decisions:
- source_word: וְעָבְדוּ
  choice: वे ... सेवा करेंगे
  rationale: עבד का मूल अर्थ ‘सेवा करना’ है और वाचा के संदर्भ में इसमें उपासना-भाव भी समाहित हो सकता है; ‘सेवा करेंगे’ इस व्यापकता को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार अक्षरों वाले दिव्य नाम को हिन्दी में प्रचलित नामरूप ‘यहोवा’ से व्यक्त किया गया है, न कि किसी उपाधि से।
- source_word: אֱלֹהֵיהֶם
  choice: अपने परमेश्वर
  rationale: हिब्रू का शाब्दिक अर्थ ‘उनके परमेश्वर’ है; हिन्दी में वाक्य के कर्ता के साथ संबंध स्पष्ट और स्वाभाविक बनाने के लिए ‘अपने परमेश्वर’ कहा गया है।
- source_word: וְאֵת דָּוִד מַלְכָּם
  choice: और अपने राजा दाऊद की
  rationale: दूसरे निश्चित कर्म को पहले के साथ जोड़ा गया है। ‘राजा’ מלך की राजकीय विशिष्टता और ‘दाऊद’ मूल पाठ का नाम सुरक्षित रखते हैं। हिन्दी में ‘सेवा’ के साथ ‘की’ स्वाभाविक है।
- source_word: אֲשֶׁר אָקִים לָהֶם
  choice: जिसे मैं उनके लिए खड़ा करूँगा
  rationale: קום के हिफ़ील रूप में किसी अगुवे को उठाने, नियुक्त करने या स्थापित करने का भाव है। ‘खड़ा करूँगा’ मूल रूपक को बनाए रखते हुए वर्तमान हिन्दी में बोधगम्य है; לָהֶם को ‘उनके लिए’ कहा गया है।
theological_decisions:
- issue: ‘उनके राजा दाऊद’ की पहचान
  choice: मुख्य पाठ में ‘दाऊद’ नाम को ज्यों का त्यों रखा गया है।
  alternative: भावी दाऊदी राजा; मसीहा
  rationale: मूल पाठ स्पष्टतः ‘दाऊद’ कहता है, पर भविष्यसूचक संदर्भ में इसे भावी दाऊदी राजा और मसीही पाठ में मसीहा के संकेत के रूप में समझा जाता है। मुख्य पाठ इस व्याख्या को आरोपित नहीं करता; पादटिप्पणी संभावित अर्थ बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली। ‘अपने परमेश्वर’ और ‘अपने राजा’ हिन्दी के निजवाचक प्रयोग के अनुसार हैं। ‘खड़ा करूँगा’ हिब्रू रूपक को सुरक्षित रखता है।
