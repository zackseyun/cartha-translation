  text: כִּי כֹה֙ אָמַ֣ר יְהוָ֔ה ק֥וֹל חֲרָדָ֖ה שָׁמָ֑עְנוּ פַּ֖חַד וְ/אֵ֥ין שָׁלֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/005.yaml
  text: 'For thus says Yahweh: “We have heard a sound of trembling[a], of fear[b], and there is no peace.”'
translation:
  language: hi
  text: 'क्योंकि याहवे यों कहता है:


    “हमने थरथराहट की आवाज़[a] सुनी है—


    भय है, और शान्ति नहीं है।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “थरथराहट की ध्वनि”; इब्रानी קוֹל का अर्थ सन्दर्भ के अनुसार “आवाज़,” “ध्वनि” या “कोलाहल” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह आगे आने वाली ईश्वरीय घोषणा को पिछले प्रसंग से व्याख्यात्मक रूप से जोड़ता है; हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כֹה אָמַר
  choice: यों कहता है
  rationale: यह मानक भविष्यद्वक्ताई संदेश-सूत्र है; वर्तमानकालीन ‘कहता है’ उसकी घोषणात्मक शक्ति बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय परमेश्वर-नाम को उपाधि में बदलने के बजाय हिन्दी में प्रचलित नामरूप से प्रस्तुत किया गया है।
- source_word: קוֹל
  choice: आवाज़
  rationale: यहाँ शब्द सुनी जाने वाली ध्वनि को दर्शाता है; ‘आवाज़’ हिन्दी में स्वाभाविक है और ‘ध्वनि’ की अपेक्षा मानवीय व्यथा की सम्भावना को खुला रखता है।
- source_word: חֲרָדָה
  choice: थरथराहट
  rationale: यह भय से उत्पन्न काँपने या घबराहट का बोध देता है; ‘थरथराहट’ उसके मूर्त, शारीरिक प्रभाव को बनाए रखता है।
- source_word: שָׁמָעְנוּ
  choice: हमने ... सुनी है
  rationale: प्रथम पुरुष बहुवचन और पूर्ण क्रिया की वर्तमान प्रासंगिकता दोनों को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: פַּחַד
  choice: भय
  rationale: यह भय या आतंक का व्यापक शब्द है; ‘भय’ मूल अर्थ को बिना अनावश्यक तीव्रता जोड़े व्यक्त करता है।
- source_word: וְאֵין
  choice: '... नहीं'
  rationale: अस्तित्व के निषेध को हिन्दी में संक्षिप्त और स्वाभाविक रूप से व्यक्त किया गया है; पंक्ति-विन्यास समन्वय को स्पष्ट करता है।
- source_word: שָׁלוֹם
  choice: शान्ति
  rationale: सन्दर्भ में यह भय के विपरीत शान्ति, सुरक्षा और कुशलता का बोध देता है; ‘शान्ति’ इसका सर्वाधिक स्वाभाविक मुख्य अनुवाद है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत परमेश्वर-नाम सीधे आया है। हिन्दी पाठकों में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ रूप से उसे उपाधि ‘प्रभु’ में बदले बिना सुरक्षित रखा गया है।
- issue: פַּחַד וְאֵין שָׁלוֹם की संरचना
  choice: भय ही भय है, शान्ति नहीं
  alternative: भय है, और शान्ति नहीं
  rationale: ‘ही भय’ हिन्दी में संकट की तीव्रता को स्वाभाविक बनाता है, जबकि मूल के दो समन्वित कथनों—भय की उपस्थिति और शान्ति की अनुपस्थिति—को बनाए रखता है; इसे किसी विशिष्ट अन्तकालीन व्याख्या से नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किन्तु गरिमापूर्ण भविष्यद्वक्ताई शैली। ‘यों कहता है’ पारम्परिक संदेश-सूत्र को सहज रखता है। कविता-जैसा पंक्ति-विन्यास भय और शान्ति के विरोध को उभारता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
