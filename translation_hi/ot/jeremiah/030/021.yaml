  yaml_path: translation/ot/jeremiah/030/021.yaml
  text: His ruler will be one of them[a], and his governor will come out from his midst. I will bring him near, and he will approach me[c][b], for who is this who has pledged his heart to approach me? declares Yahweh.
translation:
  language: hi
  text: उसका प्रतापी अगुआ उसी में से होगा[a], और उसका शासक उसके बीच में से निकलेगा[b]। मैं उसे निकट लाऊँगा, और वह मेरे निकट आएगा; क्योंकि यह कौन है, जिसने मेरे निकट आने के लिए अपने हृदय को दाँव पर लगाया है?[c] यहोवा की यह घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसका कुलीन जन” अथवा “उसका सामर्थी जन”; इब्रानी शब्द किसी प्रतिष्ठित, सामर्थी या कुलीन अगुए को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: “उसी में से” और “उसके बीच में से” का आशय हो सकता है, “उन्हीं में से” और “उनके बीच में से”; अगुआ स्वयं लोगों में से उठता है।
    reason: lexical_alternative
  - marker: c
    text: या, “जिसने मेरे पास आने का साहस किया है?” इब्रानी मुहावरा शाब्दिक रूप से अपने हृदय को गिरवी रखने या दाँव पर लगाने की बात करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: אַדִּירוֹ
  choice: उसका महान अगुआ
  rationale: אַדִּיר किसी सामर्थी, प्रतिष्ठित या कुलीन प्रमुख को सूचित कर सकता है। समानांतर מֹשְׁלוֹ के साथ नेतृत्व का अर्थ उपयुक्त है, जबकि ‘महान’ उसकी प्रतिष्ठा और सामर्थ्य की छाया बनाए रखता है।
- source_word: מִמֶּנּוּ
  choice: उसी में से
  rationale: प्रसंग में एकवचन सामूहिक समुदाय, अर्थात याकूब/इस्राएल, की ओर संकेत करता है। यह रूप मूल की व्याकरणिक अस्पष्टता रखते हुए बताता है कि अगुआ बाहर से नहीं, अपने लोगों में से उठेगा।
- source_word: מֹשְׁלוֹ
  choice: उसका शासक
  rationale: משׁל का कृदन्त ‘शासन करनेवाला’ दर्शाता है। ‘शासक’ राजनीतिक नेतृत्व के अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִקִּרְבּוֹ
  choice: उसके बीच में से
  rationale: קֶרֶב का अर्थ ‘बीच/भीतर’ है। यह समुदाय के अपने भीतर से शासक के निकलने की इब्रानी छवि को सुरक्षित रखता है।
- source_word: וְהִקְרַבְתִּיו
  choice: मैं उसे निकट लाऊँगा
  rationale: קרב का हिफ़ील रूप कारणवाचक है; पहल यहोवा की है, जो इस अगुए को अपने निकट आने का अधिकार देता है।
- source_word: וְנִגַּשׁ אֵלַי
  choice: और वह मेरे पास आएगा
  rationale: נגשׁ आदरपूर्ण ढंग से निकट आने को व्यक्त करता है और संभवतः उपासना या राज-दरबार में विशेष पहुँच की ध्वनि रखता है। ‘मेरे पास आएगा’ सहज हिन्दी में वही गंभीरता रखता है।
- source_word: עָרַב אֶת־לִבּוֹ
  choice: अपने हृदय को दाँव पर लगाया है
  rationale: ערב में गिरवी रखने, जमानत देने या जोखिम उठाकर प्रतिबद्ध होने का भाव है। ‘हृदय को दाँव पर लगाना’ मूल रूपक और साहसपूर्ण आत्म-प्रतिबद्धता दोनों को बनाए रखता है।
- source_word: לָגֶשֶׁת אֵלַי
  choice: मेरे पास आने के लिए
  rationale: यह पहले आए נגשׁ की पुनरावृत्ति है। हिन्दी में समान अभिव्यक्ति रखने से दिव्य उपस्थिति तक पहुँच का गंभीर भाव बना रहता है।
- source_word: נְאֻם יְהוָה
  choice: यहोवा की यह घोषणा है
  rationale: यह नबूवत का औपचारिक सूत्र है। ‘यहोवा की यह घोषणा है’ आधुनिक, गरिमापूर्ण हिन्दी में उसके अधिकारपूर्ण स्वर को व्यक्त करता है और ईश्वरीय नाम को प्रत्यक्ष रखता है।
theological_decisions:
- issue: अगुए की परमेश्वर तक पहुँच का स्वरूप
  choice: पाठ उसे अपने लोगों में से उठा ऐसा अगुआ बताता है जिसे यहोवा स्वयं निकट लाता है; भाषा विशेष, संभवतः उपासना-संबंधी या राजकीय पहुँच का संकेत देती है, पर उसे स्पष्टतः याजक या मसीह नहीं कहती।
  alternative: इसे विशेष रूप से मसीही राजा, निर्वासन-पश्चात राजनीतिक शासक, या याजक-राजा के रूप में पहचाना जा सकता है।
  rationale: इब्रानी पाठ अगुए के सामुदायिक मूल और यहोवा द्वारा दी गई निकटता पर बल देता है। अनुवाद किसी एक धर्मवैज्ञानिक पहचान को आरोपित किए बिना इस तनाव को सुरक्षित रखता है।
- issue: निकट आने में दिव्य पहल और मानवीय साहस
  choice: पहले यहोवा उसे निकट लाता है, फिर वह निकट आता है और अपने हृदय को दाँव पर लगानेवाला कहा जाता है।
  alternative: अंतिम प्रश्न को केवल ‘किसने साहस किया?’ के रूप में समझा जा सकता है।
  rationale: अनुवाद कारणवाचक क्रिया और ערב के गिरवी/प्रतिबद्धता वाले रूपक दोनों को रखता है, ताकि दिव्य अनुमति और मानवीय आत्म-समर्पण के बीच का तनाव न मिटे।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण नबूवतीय स्वर रखा गया है। ‘महान अगुआ’ और ‘शासक’ समानांतर नेतृत्व-पदों को बिना अनावश्यक पुनरावृत्ति के अलग करते हैं। सामूहिक पूर्वपद की एकवचन/बहुवचन अस्पष्टता मुख्य पाठ और पादटिप्पणी में सुरक्षित है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
