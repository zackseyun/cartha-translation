id: JER.30.20
reference: Jeremiah 30:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הָי֤וּ בָנָי/ו֙ כְּ/קֶ֔דֶם וַ/עֲדָת֖/וֹ לְ/פָנַ֣/י תִּכּ֑וֹן וּ/פָ֣קַדְתִּ֔י עַ֖ל כָּל לֹחֲצָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/020.yaml
  text: His children will be as in former times[a], and his congregation will be established before me[d][c][b]; and I will punish all his oppressors.
translation:
  language: hi
  text: उसकी[d] सन्तान[a] पहले जैसी[b] होगी, और उसकी मण्डली[c] मेरे सामने स्थिर की जाएगी; और उसके सभी अत्याचारियों को मैं दण्ड दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘उसके पुत्र’; यहाँ ‘सन्तान’ सामूहिक अर्थ में बच्चों या वंशजों को सूचित कर सकती है।
    reason: lexical_alternative
  - marker: b
    text: या ‘प्राचीन समय के समान’ अथवा ‘जैसी पहले थी।’
    reason: lexical_alternative
  - marker: c
    text: या ‘सभा’ अथवा ‘समुदाय।’
    reason: lexical_alternative
  - marker: d
    text: एकवचन ‘उसकी’ सम्भवतः याकूब/इस्राएल को एक सामूहिक व्यक्तित्व के रूप में प्रस्तुत करता है।
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיוּ
  choice: होगी
  rationale: भविष्यसूचक प्रसंग में यह रूप भावी पुनर्स्थापना को व्यक्त करता है। हिन्दी में सामूहिक संज्ञा ‘सन्तान’ के साथ एकवचन क्रिया स्वाभाविक है।
- source_word: בָנָיו
  choice: उसकी सन्तान
  rationale: शाब्दिक अर्थ ‘उसके पुत्र’ है, पर यहाँ यह सामूहिक रूप से बच्चों अथवा वंशजों को सूचित कर सकता है; ‘सन्तान’ लिंग-समावेशी और प्रसंगानुकूल है।
- source_word: כְּקֶדֶם
  choice: पहले जैसी
  rationale: यह पहले की अवस्था से तुलना व्यक्त करता है और आधुनिक हिन्दी में सहज है।
- source_word: וַעֲדָתוֹ
  choice: उसकी मण्डली
  rationale: עֵדָה एक एकत्र समुदाय या सभा को सूचित करता है; ‘मण्डली’ उसके सामुदायिक भाव को बनाए रखती है।
- source_word: לְפָנַי
  choice: मेरे सामने
  rationale: यह मूल पूर्वसर्गीय वाक्यांश का सीधा और स्वाभाविक अनुवाद है तथा परमेश्वर की उपस्थिति का भाव बनाए रखता है।
- source_word: תִּכּוֹן
  choice: स्थिर की जाएगी
  rationale: כּון के निफ़अल रूप में स्थापित, दृढ़ या सुरक्षित किए जाने का परिणामात्मक भाव है; यह अनुवाद उसके कर्मवाच्य स्वरूप को सुरक्षित रखता है।
- source_word: וּפָקַדְתִּי
  choice: मैं दण्ड दूँगा
  rationale: פקד के अर्थ व्यापक हैं, पर עַל और अत्याचारियों के साथ इस न्याय-सन्दर्भ में इसका दण्डात्मक अर्थ स्पष्ट है।
- source_word: עַל כָּל לֹחֲצָיו
  choice: उसके सभी अत्याचारियों को
  rationale: לחץ दबाने या उत्पीड़ित करने का भाव रखता है; कृदन्त रूप उन लोगों को सूचित करता है जो उस पर अत्याचार करते हैं।
theological_decisions:
- issue: एकवचन सम्बन्धसूचक प्रत्ययों का सन्दर्भ—‘उसकी सन्तान,’ ‘उसकी मण्डली,’ ‘उसके अत्याचारी’
  choice: मूल के एकवचन सम्बन्ध को ‘उसकी/उसके’ द्वारा बनाए रखा गया है।
  alternative: इसे याकूब/इस्राएल के सामूहिक बहुवचन के रूप में स्पष्ट करके ‘उनकी सन्तान’ या ‘उनकी मण्डली’ कहना।
  rationale: इब्रानी पाठ एकवचन प्रत्ययों का प्रयोग करता है और सम्भवतः याकूब/इस्राएल को एक सामूहिक व्यक्तित्व के रूप में प्रस्तुत करता है। एकवचन बनाए रखने से पाठ की वास्तविक अस्पष्टता अनावश्यक रूप से हल नहीं होती।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और स्रोत-सन्निकट शैली अपनाई गई है। ‘सन्तान’ और ‘मण्डली’ सामान्य पाठक के लिए बोधगम्य रहते हुए सामूहिक अर्थ को बनाए रखते हैं; एकवचन सम्बन्धसूचक रूप मूल की अस्पष्टता सुरक्षित रखता है।
