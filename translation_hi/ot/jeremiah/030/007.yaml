id: JER.30.7
reference: Jeremiah 30:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: ה֗וֹי כִּ֥י גָד֛וֹל הַ/יּ֥וֹם הַ/ה֖וּא מֵ/אַ֣יִן כָּמֹ֑/הוּ וְ/עֵֽת צָרָ֥ה הִיא֙ לְ/יַֽעֲקֹ֔ב וּ/מִמֶּ֖/נָּה יִוָּשֵֽׁעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/007.yaml
  text: Alas! For that day is great[a]; there is none like it. It is a time of distress for Jacob[c][b], yet he will be saved out of it.
translation:
  language: hi
  text: हाय! क्योंकि वह दिन महान[a] है; उसके समान कोई नहीं। वह याकूब के लिए संकट का समय[b] है, फिर भी वह उसमें से बचाया जाएगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘भयंकर’; मूल शब्द का आधारभूत अर्थ ‘महान’ है, जबकि प्रसंग उसकी भयावहता दिखाता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘याकूब के लिए क्लेश का समय।’
    reason: lexical_alternative
  - marker: c
    text: या ‘वह उसमें से छुड़ाया जाएगा।’
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: हाय!
  rationale: यह विस्मयादिबोधक शब्द शोक या भय व्यक्त करता है। ‘हाय!’ आधुनिक हिन्दी में इसके भाव को स्वाभाविक रूप से व्यक्त करता है, बिना इसे अनिवार्यतः शाप-सूचक बनाने के।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह आरम्भिक विलाप का कारण बताता है; ‘क्योंकि’ उसके व्याख्यात्मक संबंध को बनाए रखता है।
- source_word: גָדוֹל
  choice: महान
  rationale: मूल विशेषण आकार या महत्त्व में महान होने का भाव देता है। प्रसंग उसकी भयावहता स्पष्ट करता है, इसलिए मुख्य पाठ में ‘भयानक’ जोड़ना आवश्यक नहीं।
- source_word: הַיּוֹם הַהוּא
  choice: वह दिन
  rationale: यह भविष्य के एक विशिष्ट दिन या काल की ओर संकेत करने वाली प्रचलित भविष्यवाणी-संबंधी अभिव्यक्ति है।
- source_word: מֵאַיִן כָּמֹהוּ
  choice: उसके समान कोई नहीं
  rationale: यह इब्रानी मुहावरा उस दिन की अनुपमता व्यक्त करता है; हिन्दी रूप स्पष्ट और स्रोत के निकट है।
- source_word: וְעֵת צָרָה
  choice: संकट का समय
  rationale: עֵת समय को और צָרָה संकट, विपत्ति या क्लेश को दर्शाता है। यह चयन गम्भीरता बनाए रखते हुए सहज हिन्दी देता है।
- source_word: לְיַעֲקֹב
  choice: याकूब के लिए
  rationale: मूल में व्यक्ति का नाम है, जो प्रसंग में उसके वंश या समुदाय का प्रतिनिधित्व कर सकता है। नाम को बनाए रखने से व्याख्या मुख्य पाठ में आरोपित नहीं होती।
- source_word: וּמִמֶּנָּה
  choice: उसमें से
  rationale: स्त्रीलिंग प्रत्यय निकटवर्ती ‘संकट का समय’ की ओर लौटता है; हिन्दी में ‘उसमें से’ छुटकारे के स्रोत-क्षेत्र को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יִוָּשֵׁעַ
  choice: वह बचाया जाएगा
  rationale: ישׁע का निफ़अल रूप बचाए या छुड़ाए जाने का भाव देता है। कर्मवाच्य रूप मूल की व्याकरणिक बनावट और उद्धारकर्ता के अनकहे रहने को सुरक्षित रखता है।
theological_decisions:
- issue: ‘याकूब’ का संदर्भ
  choice: मुख्य पाठ में ‘याकूब’ को ही रखा गया है, जो यहाँ सामूहिक रूप से वाचा-समुदाय का प्रतिनिधित्व कर सकता है।
  alternative: इस्राएल; याकूब के वंशज; परमेश्वर के लोग
  rationale: इब्रानी पाठ स्पष्ट रूप से ‘याकूब’ कहता है। नाम बनाए रखने से भविष्यवाणी और वाचा की भाषा सुरक्षित रहती है तथा सामूहिक संदर्भ को अनावश्यक रूप से निश्चित नहीं किया जाता।
- issue: יִוָּשֵׁעַ का अर्थ और कर्ता
  choice: ‘वह बचाया जाएगा’
  alternative: वह छुड़ाया जाएगा; वह बच निकलेगा
  rationale: यह रूप व्यापक बाइबलीय बचाव/उद्धार की शब्दावली से जुड़ा है, पर तत्काल प्रसंग इसे संकट से बचाए जाने के रूप में सीमित करता है। कर्मवाच्य अनकहे उद्धारकर्ता को स्पष्ट रूप से जोड़ने से बचता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गम्भीर और भविष्यवाणी-सुलभ शैली रखी गई है। ‘हाय’, ‘संकट’ और ‘बचाया जाएगा’ सामान्य पाठक के लिए सुबोध हैं; ‘याकूब’ को व्याख्यात्मक रूप से ‘इस्राएल’ से नहीं बदला गया।
