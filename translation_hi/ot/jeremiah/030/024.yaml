source:
  edition: WLC
  text: לֹ֣א יָשׁ֗וּב חֲרוֹן֙ אַף יְהוָ֔ה עַד עֲשֹׂת֥/וֹ וְ/עַד הֲקִימ֖/וֹ מְזִמּ֣וֹת לִבּ֑/וֹ בְּ/אַחֲרִ֥ית הַ/יָּמִ֖ים תִּתְבּ֥וֹנְנוּ בָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/024.yaml
  text: The burning anger of Yahweh will not turn back until he has done it[a], and until he has established the purposes of his heart. In the latter days you will understand it.
translation:
  language: hi
  text: याहवे का धधकता क्रोध तब तक नहीं लौटेगा, जब तक वह इसे कर न ले और अपने हृदय की योजनाओं को साकार न कर ले। आने वाले दिनों में[a] तुम इसे समझोगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अन्त के दिनों में” अथवा “बाद के दिनों में।” इब्रानी अभिव्यक्ति परमेश्वर के उद्देश्यों की भावी परिणति का संकेत दे सकती है, पर उसका ठीक समय निर्धारित नहीं करती।
    reason: वैकल्पिक अनुवाद और भविष्यसूचक समय-अभिव्यक्ति की वास्तविक व्यापकता स्पष्ट करना।
lexical_decisions:
- source_word: חֲרוֹן אַף
  choice: धधकता क्रोध
  rationale: यह इब्रानी पदबंध क्रोध की जलती हुई तीव्रता का सजीव बिंब देता है; यह चयन उस बिंब को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: יָשׁוּב
  choice: वापस नहीं मुड़ेगा
  rationale: שׁוּב का मूल अर्थ लौटना या मुड़ना है। यहाँ यह क्रोध के अपने लक्ष्य को पूरा किए बिना न हटने या न पलटने को व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: עַד עֲשֹׂתוֹ
  choice: जब तक वह इसे कर न ले
  rationale: इब्रानी में कर्म निहित और अनिर्दिष्ट है; ‘इसे’ उसी अस्पष्टता को बनाए रखता है और पिछले कथन की ओर संकेत करता है।
- source_word: הֲקִימוֹ
  choice: पूरा न कर ले
  rationale: हिफ़ील रूप यहाँ किसी योजना को प्रभावी करने या कार्यान्वित करने का भाव देता है। ‘पूरा करना’ हिन्दी में ‘योजनाओं’ के साथ स्वाभाविक है।
- source_word: מְזִמּוֹת לִבּוֹ
  choice: अपने हृदय की योजनाओं
  rationale: מְזִמּוֹת सोची-समझी योजनाओं या उद्देश्यों को दर्शाता है; ‘हृदय’ לֵב के आंतरिक संकल्प का बिंब सुरक्षित रखता है।
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: आनेवाले दिनों में
  rationale: यह भविष्य के दिनों अथवा परमेश्वर के उद्देश्यों की भावी परिणति का संकेत दे सकता है। यह हिन्दी अभिव्यक्ति समय को अनावश्यक रूप से किसी निश्चित अन्त-कालीन योजना तक सीमित नहीं करती।
- source_word: תִּתְבּוֹנְנוּ בָהּ
  choice: तुम इसे समझोगे
  rationale: क्रिया ध्यानपूर्वक विचार करके समझने या पहचानने का भाव रखती है। स्त्रीलिंग प्रत्यय पूर्वोक्त बात की ओर संकेत करता है, जिसे हिन्दी में स्वाभाविक रूप से ‘इसे’ कहा गया है।
theological_decisions:
- issue: भविष्यसूचक समय-अभिव्यक्ति בְּאַחֲרִית הַיָּמִים का विस्तार
  choice: आनेवाले दिनों में
  alternative: अन्त के दिनों में; बाद के दिनों में
  rationale: इब्रानी पदबंध में अन्त-कालीन प्रतिध्वनि हो सकती है, पर वह भविष्य की व्यापक परिणति भी बता सकता है। मुख्य पाठ और पादटिप्पणी इस तनाव को किसी एक निश्चित व्याख्या में सीमित नहीं करते।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘धधकता क्रोध’ मूल के सजीव बिंब को बचाता है, जबकि छोटे और सीधे वाक्यांश भविष्यवाणी की गंभीरता बनाए रखते हैं। पादटिप्पणी-चिह्न उसी समय-अभिव्यक्ति के बाद रखा गया है जिससे वह संबंधित है।
