id: JER.30.8
reference: Jeremiah 30:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הָיָה֩ בַ/יּ֨וֹם הַ/ה֜וּא נְאֻ֣ם יְהוָ֣ה צְבָא֗וֹת אֶשְׁבֹּ֤ר עֻלּ/וֹ֙ מֵ/עַ֣ל צַוָּארֶ֔/ךָ וּ/מוֹסְרוֹתֶ֖י/ךָ אֲנַתֵּ֑ק וְ/לֹא יַעַבְדוּ ב֥/וֹ ע֖וֹד זָרִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/008.yaml
  text: And it shall happen in that day[a], declares Yahweh of Armies, that I will break his yoke from off your neck, and I will tear off your bonds[b], and foreigners shall no longer make him their servant.
translation:
  language: hi
  text: 'सेनाओं के याहवे की यह घोषणा है: “उस दिन ऐसा होगा कि मैं तेरी गर्दन पर से उसका जूआ तोड़ दूँगा और तेरे बंधन तोड़ डालूँगा; और परदेशी उससे फिर दास का काम नहीं कराएँगे[a]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'हिब्रू का अंतिम उपवाक्य संक्षिप्त है। ‘उससे’ के लिए आया पुल्लिंग एकवचन सर्वनाम संदर्भ में याकूब/इस्राएल की ओर संकेत करता समझा जाता है। इसका अनुवाद यह भी हो सकता है: “परदेशी उसे फिर दास नहीं बनाएँगे।”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה בַיּוֹם הַהוּא
  choice: उस दिन ऐसा होगा
  rationale: यह भविष्य की घटना बताने वाला भविष्यसूचक सूत्र है। यह रूप आधुनिक हिन्दी में स्वाभाविक है और ‘उस दिन’ की भविष्यसूचक गूँज बनाए रखता है।
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: सेनाओं के याहवे की घोषणा है
  rationale: נְאֻם को भविष्यद्वक्ता की प्रामाणिक घोषणा के सूत्र के रूप में व्यक्त किया गया है। יְהוָה को व्यक्तिगत वाचा-नाम ‘याहवे’ और צְבָאוֹת को पारदर्शी रूप से ‘सेनाओं के’ अनूदित किया गया है।
- source_word: אֶשְׁבֹּר עֻלּוֹ מֵעַל צַוָּארֶךָ
  choice: मैं तेरी गरदन पर से उसका जूआ तोड़ दूँगा
  rationale: ‘उसका’ और ‘तेरी’ के अलग-अलग पुरुषवाचक प्रत्ययों को समतल किए बिना रखा गया है। ‘गरदन पर से’ מֵעַל की स्थानिक छवि और जूए को हटाने की क्रिया स्पष्ट करता है।
- source_word: וּמוֹסְרוֹתֶיךָ אֲנַתֵּק
  choice: और तेरे बंधन काट डालूँगा
  rationale: מוֹסְרוֹת दासता में बाँधने वाले बंधनों को दर्शाता है, और נתק उन्हें बलपूर्वक अलग करने या तोड़ने का भाव देता है। ‘काट डालूँगा’ हिन्दी में मुक्ति की सजीव छवि देता है।
- source_word: וְלֹא יַעַבְדוּ בוֹ עוֹד זָרִים
  choice: परदेशी फिर उससे दास का काम नहीं कराएँगे
  rationale: जूए और बंधनों के संदर्भ में עבד का बाध्य सेवा या दासता वाला भाव प्रमुख है। ‘उससे’ בוֹ के पुल्लिंग एकवचन रूप को बचाता है, जबकि पादटिप्पणी संक्षिप्त हिब्रू वाक्य-विन्यास की अस्पष्टता बताती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम है। ‘याहवे’ उसके संभावित प्राचीन उच्चारण को सीधे दर्शाता है और उसे किसी उपाधि से नहीं बदलता।
- issue: צְבָאוֹת की उपाधि
  choice: सेनाओं के
  alternative: सेनाओं का प्रभु; स्वर्गीय सेनाओं के
  rationale: ‘सेनाओं के’ मूल के व्यापक सैन्य और स्वर्गीय समूहों के अर्थ को खुला रखता है; ‘स्वर्गीय’ जोड़ने से अर्थ अनावश्यक रूप से सीमित हो जाता।
- issue: अंतिम उपवाक्य में עבד का बल
  choice: दास का काम कराना
  alternative: दास बनाना; सेवा कराना; उसका उपयोग करना
  rationale: निकटवर्ती जूए और बंधनों की छवियाँ बाध्य श्रम और विदेशी अधीनता का संकेत देती हैं। फिर भी अस्पष्ट सर्वनाम और संक्षिप्त रचना को पादटिप्पणी में स्वीकार किया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। एकवचन संबोधन के लिए ‘तेरी/तेरे’ रखा गया है, क्योंकि मूल पाठ याकूब/इस्राएल को सामूहिक व्यक्ति के रूप में संबोधित करता है। ‘जूआ’, ‘बंधन’ और ‘दास का काम’ मूल की दासता-मुक्ति संबंधी रूपक-श्रृंखला को बनाए रखते हैं।
