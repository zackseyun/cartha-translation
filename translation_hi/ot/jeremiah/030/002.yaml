base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/002.yaml
  text: 'Thus says Yahweh[a], the God of Israel: Write for yourself in a scroll all the words that I have spoken to you.'
translation:
  language: hi
  text: 'याहवे, इस्राएल का परमेश्वर, यों कहता है: “जो सारे वचन मैंने तुझसे कहे हैं, उन्हें अपने लिए एक लिपटे हुए लेख[a] में लिख।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक पुस्तक में।” इब्रानी शब्द סֵפֶר किसी लिखित दस्तावेज़ को दर्शाता है, जो इस ऐतिहासिक संदर्भ में प्रायः एक स्क्रॉल होता था।
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: यों कहता है
  rationale: यह नबूवत की प्रचलित संदेशवाहक-शैली है। ‘यों कहता है’ उसके औपचारिक अधिकार और वर्तमान उद्घोषणा, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिवाचक दिव्य नाम को उपाधि से बदलने के बजाय हिन्दी लिपि में उसके प्रचलित विद्वत्तापूर्ण उच्चारण के निकट रखा गया है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल का परमेश्वर
  rationale: सम्बन्धवाचक इब्रानी पदबंध का स्पष्ट और स्वाभाविक हिन्दी रूप।
- source_word: לֵאמֹר
  choice: ':'
  rationale: यहाँ यह प्रत्यक्ष कथन का परिचय देता है; हिन्दी में विराम-चिह्न और उद्धरण-चिह्न इसका कार्य स्वाभाविक रूप से करते हैं।
- source_word: כְּתָב
  choice: लिख
  rationale: यिर्मयाह को दिए गए एकवचन पुल्लिंग आदेश का सीधा समतुल्य।
- source_word: לְךָ
  choice: अपने लिए
  rationale: व्यक्तिगत हित अथवा सम्बद्धता का दत्तिव भाव बनाए रखता है, यद्यपि प्रसंग में इसका बल हल्का हो सकता है।
- source_word: כָּל הַדְּבָרִים
  choice: सारे वचन
  rationale: דְּבָרִים का अर्थ ‘बातें’ भी हो सकता है, पर परमेश्वर द्वारा कही गई सामग्री को लिखने के प्रसंग में ‘वचन’ मौखिक स्वरूप को सुरक्षित रखता है।
- source_word: אֲשֶׁר דִּבַּרְתִּי אֵלֶיךָ
  choice: जो ... मैंने तुझसे कहे हैं
  rationale: पूर्व में कहे गए और अब लिखे जाने वाले वचनों का वर्तमान सम्बन्ध हिन्दी पूर्णकाल से स्वाभाविक रूप में व्यक्त होता है। ‘तुझसे’ मूल के एकवचन सम्बोधन को सुरक्षित रखता है।
- source_word: אֶל־סֵפֶר
  choice: एक पुस्तक में
  rationale: סֵפֶר किसी लिखित दस्तावेज़ को दर्शाता है और उस युग में वह प्रायः लपेटा हुआ दस्तावेज़ होता था। ‘पुस्तक’ सुबोध हिन्दी है; ऐतिहासिक माध्यम की सम्भावना पादटिप्पणी में दी गई है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में परमेश्वर का व्यक्तिवाचक वाचा-नाम सीधे आया है। ‘याहवे’ उसे किसी उपाधि में बदले बिना हिन्दी में लिप्यंतरित करता है; ‘यहोवा’ एक पारम्परिक वैकल्पिक उच्चारण है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘तुझसे’ और ‘लिख’ मूल के एकवचन सम्बोधन को स्पष्ट करते हैं। नबूवत की औपचारिक लय के लिए ‘यों कहता है’ रखा गया है।
