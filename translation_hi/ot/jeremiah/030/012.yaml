source:
  edition: WLC
  text: כִּ֣י כֹ֥ה אָמַ֛ר יְהוָ֖ה אָנ֣וּשׁ לְ/שִׁבְרֵ֑/ךְ נַחְלָ֖ה מַכָּתֵֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/012.yaml
  text: 'For thus says Yahweh: Your fracture is incurable[a]; your wound is grievous.'
translation:
  language: hi
  text: 'क्योंकि याहवे यों कहता है:


    “तेरी चोट असाध्य है[a];

    तेरा घाव बहुत गंभीर है।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरा भंग उपचारातीत है; तेरा घाव विकट है।”
    reason: שֶׁבֶר के लिए ‘भंग’ अधिक शाब्दिक विकल्प है; אָנושׁ और נַחְלָה के लिए ‘उपचारातीत’ और ‘विकट’ वैकल्पिक सटीक अभिव्यक्तियाँ हैं।
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद पिछले प्रसंग से जुड़ी दैवी घोषणा का कारण या स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כֹה אָמַר יְהוָה
  choice: यहोवा यों कहता है
  rationale: यह मानक नबूवत-संदेश सूत्र है। ‘यों कहता है’ उसकी औपचारिक और गरिमापूर्ण लय बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय दैवी नाम को हिन्दी में उसके प्रचलित नामरूप ‘यहोवा’ से व्यक्त किया गया है, न कि उपाधि से।
- source_word: אָנושׁ
  choice: ऐसी है जिसका उपचार नहीं हो सकता
  rationale: यह शब्द यहाँ रोग या चोट की निराशाजनक, असाध्य दशा बताता है। हिन्दी में यह वाक्यांश चिकित्सा-रूपक को स्पष्ट और स्वाभाविक रखता है।
- source_word: לְשִׁבְרֵךְ
  choice: तेरी टूट
  rationale: שֶׁבֶר का मूल बिंब टूटने या भंग होने का है। ‘टूट’ शारीरिक चोट और व्यापक विनाश—दोनों अर्थों की गुंजाइश बनाए रखता है।
- source_word: נַחְלָה
  choice: बहुत गंभीर है
  rationale: स्त्रीलिंग विशेषण यहाँ घाव की अत्यंत विकट या गंभीर दशा बताता है। ‘बहुत गंभीर’ आधुनिक हिन्दी में स्वाभाविक है और पहले खंड की ‘उपचार नहीं हो सकता’ वाली अभिव्यक्ति की अनावश्यक पुनरावृत्ति से बचाता है।
- source_word: מַכָּתֵךְ
  choice: तेरा घाव
  rationale: चोट, प्रहार या विपत्ति के अर्थों में से यहाँ चिकित्सा-रूपक के कारण ‘घाव’ सबसे उपयुक्त है।
theological_decisions:
- issue: दैवी नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में निजी दैवी नाम स्पष्ट रूप से है। हिन्दी के व्यापक बाइबिलीय प्रयोग में पहचाने जाने वाले ‘यहोवा’ को रखा गया है; इसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया।
- issue: चोट के बिंब को केवल नैतिक या आत्मिक दशा मानना
  choice: ‘टूट’ और ‘घाव’ के ठोस रूपक बनाए रखे गए
  alternative: ‘तेरी दशा’ या ‘तेरा पाप’
  rationale: मूल पद शारीरिक चोट की भाषा द्वारा सामूहिक विनाश को चित्रित करता है, पर उसका आशय खुलकर नहीं समझाता। इसलिए अनुवाद उस धार्मिक या नैतिक व्याख्या को पाठ में नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण नबूवतीय शैली। स्त्रीलिंग एकवचन संबोधन ‘तेरी/तेरा’ मूल के स्त्रीलिंग एकवचन प्रत्ययों को दर्शाता है और प्रसंग में सिय्योन/याकूब रूपी समुदाय को संबोधित कर सकता है।
