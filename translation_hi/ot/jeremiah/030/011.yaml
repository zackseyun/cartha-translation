  text: כִּֽי אִתְּ/ךָ֥ אֲנִ֛י נְאֻם יְהוָ֖ה לְ/הֽוֹשִׁיעֶ֑/ךָ כִּי֩ אֶעֱשֶׂ֨ה כָלָ֜ה בְּ/כָֽל הַ/גּוֹיִ֣ם אֲשֶׁ֧ר הֲפִצוֹתִ֣י/ךָ שָּׁ֗ם אַ֤ךְ אֹֽתְ/ךָ֙ לֹֽא אֶעֱשֶׂ֣ה כָלָ֔ה וְ/יִסַּרְתִּ֨י/ךָ֙ לַ/מִּשְׁפָּ֔ט וְ/נַקֵּ֖ה לֹ֥א אֲנַקֶּֽ/ךָּ־־־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/011.yaml
  text: For I am with you—oracle of Yahweh—to save you[a]. For I will make a full end of all the nations where I have scattered you, but of you I will not make a full end. I will discipline you with justice[b], and I will by no means leave you unpunished.
translation:
  language: hi
  text: क्योंकि मैं तुझे बचाने के लिए तेरे साथ हूँ—यह यहोवा की वाणी है।[a] जिन सब जातियों में मैंने तुझे तितर-बितर किया है, उनका मैं पूरी तरह से अन्त कर दूँगा; पर तेरा मैं पूरी तरह से अन्त नहीं करूँगा। मैं न्याय के अनुसार तुझे अनुशासित करूँगा और तुझे दण्ड दिए बिना किसी भी तरह नहीं छोड़ूँगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘यह यहोवा की वाणी है’ का अनुवाद ‘यहोवा की यह घोषणा है’ भी हो सकता है। इब्रानी נְאֻם יְהוָה भविष्यद्वाणी में प्रयुक्त एक औपचारिक सूत्र है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक भाव: ‘मैं तुझे निश्चय ही निर्दोष नहीं ठहराऊँगा।’ इब्रानी में क्रिया के अनन्त रूप और परिमित क्रिया का निषेध के साथ संयोजन विशेष बल देता है; अर्थ ‘दोषमुक्त करना/निर्दोष ठहराना’ भी हो सकता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबल परम्परा में प्रचलित रूप रखते हुए परमेश्वर के व्यक्तिगत वाचा-नाम को सामान्य उपाधि में नहीं बदला गया।
- source_word: נְאֻם יְהוָה
  choice: यह यहोवा की वाणी है
  rationale: यह भविष्यद्वाणी का औपचारिक सूत्र है। ‘वाणी’ उसके गंभीर भविष्यद्वक्तापरक स्वर को बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक भी है।
- source_word: לְהוֹשִׁיעֶךָ
  choice: तुझे बचाने के लिए
  rationale: ישׁע के हिफ़ील रूप में संकट से बचाने या छुड़ाने का व्यापक अर्थ है; ‘बचाने’ स्पष्ट और सहज हिन्दी है।
- source_word: כָלָה
  choice: पूरी तरह अन्त
  rationale: यह पूर्ण समाप्ति या विनाश को दर्शाता है। दोनों बार एक ही अभिव्यक्ति रखकर इब्रानी की पुनरावृत्ति और जातियों तथा इस्राएल के बीच का विरोध सुरक्षित रखा गया।
- source_word: הֲפִצוֹתִיךָ
  choice: मैंने तुझे तितर-बितर किया है
  rationale: यह निर्वासन में विभिन्न जातियों के बीच फैलाए जाने को व्यक्त करता है; ‘तितर-बितर’ आधुनिक हिन्दी में उस बलपूर्वक बिखराव को स्वाभाविक रूप से बताता है।
- source_word: אַךְ
  choice: पर
  rationale: यह जातियों के पूर्ण अन्त और संबोधित प्रजा के अपूर्ण अन्त के बीच स्पष्ट विरोध प्रकट करता है।
- source_word: וְיִסַּרְתִּיךָ
  choice: मैं ... तुझे अनुशासित करूँगा
  rationale: יסר सुधारात्मक ताड़ना या अनुशासन का बोध देता है। ‘अनुशासित’ केवल प्रतिशोधात्मक दण्ड की अपेक्षा उसके सुधारात्मक आयाम को भी बचाता है।
- source_word: לַמִּשְׁפָּט
  choice: न्याय के अनुसार
  rationale: यह ताड़ना के न्यायसंगत और मापे हुए स्वरूप को व्यक्त करता है; इसे केवल ‘न्याय के लिए’ कहने से सम्भावित उद्देश्यगत अर्थ अनावश्यक रूप से उभर सकता था।
- source_word: וְנַקֵּה לֹא אֲנַקֶּךָּ
  choice: तुझे दण्ड दिए बिना कदापि नहीं छोड़ूँगा
  rationale: मूल में क्रिया की पुनरुक्त रचना निषेध को प्रबल करती है। यह हिन्दी रूप उसी ज़ोर को ‘कदापि नहीं’ से व्यक्त करता और निकटवर्ती अनुशासन के प्रसंग से स्वाभाविक रूप से जुड़ता है।
theological_decisions:
- issue: अन्तिम वाक्यांश को न्यायालयीन ‘निर्दोष ठहराना’ कहा जाए या अनुशासनात्मक ‘दण्ड दिए बिना छोड़ना’
  choice: मुख्य पाठ में ‘तुझे दण्ड दिए बिना कदापि नहीं छोड़ूँगा’
  alternative: ‘मैं तुझे निश्चय ही निर्दोष नहीं ठहराऊँगा’
  rationale: निकटवर्ती वाक्य सुधारात्मक अनुशासन की बात करता है, इसलिए मुख्य पाठ में दण्ड-संबंधी भाषा प्रसंगानुकूल है। साथ ही ‘कदापि नहीं’ मूल निषेध का बल बनाए रखता है। पादटिप्पणी न्यायालयीन विकल्प को सुरक्षित रखती है, जिससे उद्धार, संरक्षण और उत्तरदायी ठहराए जाने के बीच का तनाव बना रहता है।
- issue: जातियों और संबोधित प्रजा के ‘अन्त’ के बीच अंतर
  choice: दोनों खंडों में ‘पूरी तरह अन्त’ की समान भाषा
  alternative: पहले खंड में ‘सर्वनाश’ और दूसरे में ‘नाश’
  rationale: 'समान शब्दावली मूल के जानबूझकर किए गए दोहराव को बनाए रखती है: जातियों का पूर्ण अन्त होगा, पर संबोधित प्रजा का पूर्ण अन्त नहीं होगा। इससे संरक्षण का आश्वासन अनुशासन की चेतावनी को मिटाता नहीं।'
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। एकवचन ‘तू’ के रूप ‘तुझे/तेरा’ मूल के एकवचन संबोधन तथा हिन्दी बाइबल की भविष्यद्वक्तापरक शैली के अनुरूप हैं। अर्धविराम ने जातियों और संबोधित प्रजा के भिन्न परिणामों का तीखा विरोध सुरक्षित रखा है।
