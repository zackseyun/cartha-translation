  yaml_path: translation/ot/jeremiah/030/019.yaml
  text: From them will come thanksgiving and the sound of those who rejoice[a]; I will multiply them, and they will not be few; I will honor them[b], and they will not be insignificant.
translation:
  language: hi
  text: उनमें से धन्यवाद और आनन्द मनानेवालों का स्वर निकलेगा[a]। मैं उनकी संख्या बढ़ाऊँगा, और वे थोड़े न रहेंगे; मैं उन्हें आदर दूँगा[b], और वे तुच्छ न रहेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उत्सव मनानेवालों/खेलनेवालों का स्वर”; इब्रानी कृदन्त उत्सवी हँसी, खेल या आनन्द मनाने का भाव दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “मैं उन्हें प्रतिष्ठित करूँगा, और वे छोटे न रहेंगे।” इब्रानी शब्द आदर या महत्त्व और छोटा या तुच्छ होने—दोनों अर्थ-क्षेत्रों को व्यक्त कर सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא מֵהֶם
  choice: उनमें से ... निकलेगा
  rationale: यह पदबंध स्रोत या उद्गम बताता है। भविष्यसूचक प्रसंग में पूर्ण क्रिया भविष्य का भाव रखती है; ‘निकलेगा’ समुदाय के भीतर से धन्यवाद और उत्सव का स्वर उठने की छवि सुरक्षित रखता है।
- source_word: תּוֹדָה
  choice: धन्यवाद
  rationale: यहाँ शब्द किसी विशिष्ट धन्यवाद-बलि से अधिक कृतज्ञतापूर्ण स्तुति को सूचित करता है। ‘धन्यवाद’ आधुनिक हिन्दी में सहज है और मूल का कृतज्ञता-भाव बनाए रखता है।
- source_word: וְקוֹל מְשַׂחֲקִים
  choice: और आनन्द मनानेवालों का स्वर
  rationale: קוֹל श्रव्य स्वर को और שׂחק का कृदन्त हँसी, खेल या उत्सवी उल्लास को व्यक्त कर सकता है। प्रसंग में ‘आनन्द मनानेवाले’ सामुदायिक उत्सव को स्वाभाविक ढंग से व्यक्त करता है, जबकि पाद-टिप्पणी व्यापक अर्थ-सीमा सुरक्षित रखती है।
- source_word: וְהִרְבִּתִים
  choice: मैं उनकी संख्या बढ़ाऊँगा
  rationale: रבה के हिफ़ील रूप का अर्थ उन्हें बहुत या बहुसंख्यक करना है। स्पष्ट हिन्दी के लिए संख्या को व्यक्त किया गया है, जिससे अगली पंक्ति ‘थोड़े न रहेंगे’ के साथ समानांतरता भी स्पष्ट होती है।
- source_word: וְלֹא יִמְעָטוּ
  choice: और वे थोड़े न रहेंगे
  rationale: מעט यहाँ संख्या में कम या थोड़े होने का अर्थ देता है, विशेषकर पहले आए बढ़ाने के वचन के समानांतर।
- source_word: וְהִכְבַּדְתִּים
  choice: मैं उन्हें आदर दूँगा
  rationale: כבד का हिफ़ील रूप भारी/महत्त्वपूर्ण बनाना या सम्मानित करना सूचित कर सकता है। यहाँ सामाजिक प्रतिष्ठा और गरिमा के अर्थ में ‘आदर दूँगा’ स्वाभाविक है।
- source_word: וְלֹא יִצְעָרוּ
  choice: और वे तुच्छ न रहेंगे
  rationale: צער छोटा, गौण या नगण्य होने को सूचित कर सकता है। ‘आदर दूँगा’ के विपरीत समानांतर में ‘तुच्छ’ प्रतिष्ठा और महत्त्व की कमी को व्यक्त करता है; शाब्दिक ‘छोटे’ विकल्प को पाद-टिप्पणी में रखा गया है।
theological_decisions:
- issue: प्रतिज्ञात पुनर्स्थापना की आशीषों का स्वरूप
  choice: पद को धन्यवाद, उत्सव, जन-वृद्धि और आदर में प्रकट ठोस सामुदायिक पुनर्स्थापना के रूप में प्रस्तुत किया गया है।
  alternative: इसे केवल आत्मिक आशीष या केवल राष्ट्रीय-राजनीतिक उत्कर्ष मानना।
  rationale: इब्रानी पाठ स्वयं समुदाय से उठनेवाले धन्यवाद और उत्सव तथा उनकी वृद्धि और प्रतिष्ठा की बात करता है। अनुवाद इन बातों को बनाए रखता है, पर किसी बाद की कलीसियाई, युगान्तिक या राजनीतिक व्यवस्था को पाठ में नहीं जोड़ता।
- issue: כבד और צער के बीच अर्थगत तनाव
  choice: ‘आदर दूँगा’ और ‘तुच्छ न रहेंगे’ द्वारा सामाजिक प्रतिष्ठा का प्रमुख अर्थ व्यक्त किया गया है।
  alternative: ‘उन्हें बड़ा करूँगा’ और ‘वे छोटे न रहेंगे’ द्वारा आकार या संख्या का अर्थ सामने रखना।
  rationale: दोनों शब्द महत्त्व/प्रतिष्ठा और बड़ा/छोटा होने की परस्पर जुड़ी अर्थ-सीमा रखते हैं। निकटवर्ती पहली जोड़ी पहले ही संख्या-वृद्धि स्पष्ट करती है, इसलिए दूसरी जोड़ी में प्रतिष्ठा अधिक संभावित है; फिर भी वैकल्पिक अर्थ पाद-टिप्पणी में सुरक्षित है।
