  text: כִּי֩ אַעֲלֶ֨ה אֲרֻכָ֥ה לָ֛/ךְ וּ/מִ/מַּכּוֹתַ֥יִ/ךְ אֶרְפָּאֵ֖/ךְ נְאֻם יְהוָ֑ה כִּ֤י נִדָּחָה֙ קָ֣רְאוּ לָ֔/ךְ צִיּ֣וֹן הִ֔יא דֹּרֵ֖שׁ אֵ֥ין לָֽ/הּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/017.yaml
  text: 'For I will bring healing to you[a], and I will heal you from your wounds, declares Yahweh, because they have called you an outcast: ‘It is Zion[c][b]; no one cares for her.’'
translation:
  language: hi
  text: 'क्योंकि मैं तेरे लिए चंगाई ले आऊँगा[a], और तेरे घावों से तुझे चंगा करूँगा—याहवे की घोषणा है—क्योंकि उन्होंने तुझे ‘ठुकराई हुई’[b] कहा है: ‘यह सिय्योन है; इसकी सुध लेनेवाला कोई नहीं।’[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं तुझे फिर स्वस्थ करूँगा।” हिब्रू मुहावरे का शाब्दिक भाव है, “मैं तेरे लिए चंगाई को उगा दूँगा।”
    reason: lexical_alternative
  - marker: b
    text: या, “दूर हटा दी गई” अथवा “बहिष्कृत।” हिब्रू कृदंत का अर्थ ऐसी स्त्री या नगरी हो सकता है जिसे दूर कर दिया गया या ठुकरा दिया गया है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “सिय्योन—उसका खोजनेवाला कोई नहीं,” अर्थात उसकी खोज-खबर लेने या उसकी सहायता को आनेवाला कोई नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַעֲלֶה אֲרֻכָה
  choice: मैं तेरे लिए चंगाई ले आऊँगा
  rationale: हिब्रू का कारणवाचक मुहावरा शाब्दिक रूप से किसी के लिए चंगाई या नया मांस ‘उगा देने/ऊपर लाने’ की बात करता है। ‘चंगाई ले आऊँगा’ कारणवाचक भाव और पुनर्स्थापना, दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וּמִמַּכּוֹתַיִךְ אֶרְפָּאֵךְ
  choice: तेरे घावों से तुझे चंगा करूँगा
  rationale: מַכָּה का अर्थ प्रहार, चोट या घाव हो सकता है। चंगाई के संदर्भ में ‘घाव’ उपयुक्त है; ‘तुझे’ और ‘घावों से’ मूल के द्वितीय-पुरुष कर्म तथा מִן-वाक्यांश को सुरक्षित रखते हैं।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: यह मानक भविष्यद्वक्तापरक सूत्र है। ‘घोषणा’ נְאֻם की गंभीरता को व्यक्त करता है और יְהוָה को उसके व्यक्तिवाचक वाचा-नाम ‘याहवे’ के रूप में रखता है।
- source_word: נִדָּחָה
  choice: त्यागी हुई
  rationale: स्त्रीलिंग निष्क्रिय कृदंत किसी निकाली गई, दूर हटा दी गई या त्याग दी गई स्त्री/नगरी को सूचित करता है। ‘त्यागी हुई’ सामाजिक तिरस्कार को व्यक्त करते हुए मूल के स्त्रीलिंग को भी बनाए रखता है।
- source_word: קָרְאוּ לָךְ
  choice: उन्होंने तुझे … कहा है
  rationale: पूर्ण क्रिया दूसरों द्वारा सिय्योन पर लगाए गए स्थापित नाम या लांछन को बताती है। हिन्दी का पूर्ण पक्ष उसकी वर्तमान प्रासंगिकता बनाए रखता है।
- source_word: צִיּוֹן
  choice: सिय्योन
  rationale: परंपरागत और व्यापक रूप से पहचाना जाने वाला हिन्दी लिप्यंतरण।
- source_word: דֹּרֵשׁ אֵין לָהּ
  choice: इसकी सुध लेनेवाला कोई नहीं
  rationale: शाब्दिक अर्थ ‘उसका खोजने/पूछनेवाला कोई नहीं’ है। संदर्भ में यह उसकी खोज-खबर लेने, परवाह करने या सहायता को आनेवाले व्यक्ति के अभाव को दर्शाता है; ‘सुध लेना’ इस अर्थ-क्षेत्र को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम יְהוָה है। ‘याहवे’ उसे उपाधि में बदलने के बजाय वाचा-नाम के रूप में प्रस्तुत करता है; हिन्दी में प्रचलित वैकल्पिक रूपों को मूल पाठ में नहीं जोड़ा गया।
- issue: नִדָּחָה में त्याग का स्वरूप
  choice: त्यागी हुई
  alternative: निकाली हुई; बहिष्कृत
  rationale: पद यह स्पष्ट नहीं करता कि त्याग सामाजिक, राजनीतिक या वाचागत अर्थ में है। इसलिए अनुवाद उस तनाव को खुला रखता है और किसी विशिष्ट धर्मवैज्ञानिक कारण को नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में एकवचन निकट संबोधन ‘तू/तेरा’ के तिर्यक रूप ‘तुझे/तेरे’ रखे गए हैं, क्योंकि वचन में सिय्योन को स्त्री के रूप में सीधे संबोधित किया गया है। शैली भविष्यद्वक्तापरक और गरिमापूर्ण है, पर वाक्य सामान्य पाठक के लिए सहज रखा गया है।
