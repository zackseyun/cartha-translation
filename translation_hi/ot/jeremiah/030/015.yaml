id: JER.30.15
reference: Jeremiah 30:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: מַה תִּזְעַק֙ עַל שִׁבְרֵ֔/ךְ אָנ֖וּשׁ מַכְאֹבֵ֑/ךְ עַ֣ל רֹ֣ב עֲוֺנֵ֗/ךְ עָֽצְמוּ֙ חַטֹּאתַ֔יִ/ךְ עָשִׂ֥יתִי אֵ֖לֶּה לָֽ/ךְ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/015.yaml
  text: Why do you cry out over your injury? Your pain is incurable[a]. Because your iniquity is great, because your sins are many[b], I have done these things to you.
translation:
  language: hi
  text: तू अपनी चोट[a] पर क्यों चिल्लाती है? तेरी पीड़ा असाध्य[b] है। तेरे अधर्म की अधिकता के कारण, और तेरे पाप बहुत बढ़ गए हैं, इसलिए मैंने तेरे साथ यह सब किया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरा घाव।” “चोट” के लिए प्रयुक्त इब्रानी शब्द टूटने, भंग होने, चोट या घाव का अर्थ दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “अत्यन्त गंभीर,” “निराशाजनक,” या “चंगा होने से परे।” इब्रानी विशेषण गंभीर रूप से रोगग्रस्त अथवा उपचार से परे होने का भाव दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה תִּזְעַק
  choice: तू ... क्यों चिल्लाती है?
  rationale: מַה यहाँ आलंकारिक प्रश्न में ‘क्यों’ का भाव देता है, और זעק संकट में ऊँचे स्वर से पुकारने या चिल्लाने को व्यक्त करता है। संबोधन का स्त्रीलिंग रूप याकूब/सिय्योन को संबोधित काव्यात्मक वाणी के अनुरूप रखा गया है।
- source_word: עַל שִׁבְרֵךְ
  choice: अपनी चोट के कारण
  rationale: שֶׁבֶר टूटने, विनाश, चोट या घाव का बोध करा सकता है। ‘चोट’ रूपक को व्यापक रखता है; עַל को यहाँ विलाप के कारण के रूप में स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: אָנושׁ מַכְאֹבֵךְ
  choice: तेरी पीड़ा असाध्य है
  rationale: מַכְאוֹב का सीधा अर्थ पीड़ा/दुःख है और אָנושׁ गंभीर, निराशाजनक अथवा उपचार से परे दशा बता सकता है। ‘असाध्य’ इस संदर्भ में संभावित मुख्य अर्थ को संक्षेप में व्यक्त करता है।
- source_word: עַל רֹב עֲוֺנֵךְ
  choice: तेरे अधर्म की अधिकता के कारण
  rationale: עַל यहाँ दण्ड का कारण बताता है; רֹב बहुतायत/अधिकता और עָוֹן नैतिक अधर्म या दोष को सूचित करता है।
- source_word: עָצְמוּ חַטֹּאתַיִךְ
  choice: तेरे पापों के बहुत हो जाने के कारण
  rationale: עצם का अर्थ बलवान या बहुसंख्य होना हो सकता है। बहुवचन ‘पापों’ और समानांतर कारण-वाक्य में संख्यात्मक/तीव्र भाव स्वाभाविक है।
- source_word: עָשִׂיתִי אֵלֶּה לָךְ
  choice: मैंने तेरे साथ ये सब किया है
  rationale: प्रथम पुरुष एकवचन क्रिया दैवी कर्तृत्व को स्पष्ट रखती है। אֵלֶּה बहुवचन है; ‘ये सब’ हिन्दी में पूर्वोक्त विपत्तियों की समष्टि को स्वाभाविक रूप से दर्शाता है।
theological_decisions:
- issue: न्याय में परमेश्वर का कर्तृत्व
  choice: ‘मैंने तेरे साथ ये सब किया है’ के द्वारा वक्ता के प्रत्यक्ष कर्तृत्व को बनाए रखा गया है।
  alternative: ‘ये सब तेरे साथ हुआ है’ जैसा निर्वैयक्तिक अनुवाद।
  rationale: इब्रानी עָשִׂיתִי स्पष्ट प्रथम पुरुष एकवचन है। इसलिए न्याय को केवल परिस्थिति या संयोग के रूप में नरम नहीं किया गया।
- issue: पीड़ा की निरुपायता
  choice: ‘असाध्य’ मुख्य पाठ में रखा गया है।
  alternative: ‘अत्यन्त गंभीर’ या ‘निराशाजनक’।
  rationale: אָנושׁ में गंभीरता और उपचार से परे होने, दोनों की अर्थ-सीमा है। संदर्भ में ‘असाध्य’ उपयुक्त है, पर वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। मूल के स्त्रीलिंग एकवचन संबोधन को ‘तू/तेरी’ से बनाए रखा गया है। समानांतर कारण-वाक्यों और प्रत्यक्ष दैवी कर्तृत्व को स्पष्ट रखा गया है।
