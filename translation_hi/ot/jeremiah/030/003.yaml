id: JER.30.3
reference: Jeremiah 30:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֠י הִנֵּ֨ה יָמִ֤ים בָּאִים֙ נְאֻם יְהוָ֔ה וְ֠/שַׁבְתִּי אֶת שְׁב֨וּת עַמִּ֧/י יִשְׂרָאֵ֛ל וִֽ/יהוּדָ֖ה אָמַ֣ר יְהוָ֑ה וַ/הֲשִׁבֹתִ֗י/ם אֶל הָ/אָ֛רֶץ אֲשֶׁר נָתַ֥תִּי לַ/אֲבוֹתָ֖/ם וִֽ/ירֵשֽׁוּ/הָ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/003.yaml
  text: For look, days are coming, declares the LORD, when I will restore the fortunes of my people Israel and Judah, says the LORD, and I will bring them back to the land that I gave to their fathers, and they will possess it.
translation:
  language: hi
  text: क्योंकि देखो, ऐसे दिन आ रहे हैं—यहोवा की घोषणा है—जब मैं अपनी प्रजा इस्राएल और यहूदा की दशा बहाल करूँगा,” यहोवा कहता है, “और मैं उन्हें उस देश में वापस ले आऊँगा जो मैंने उनके पूर्वजों को दिया था, और वे उस पर अधिकार करेंगे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला संकेतक है; ‘देखो’ मूल की प्रत्यक्षता बनाए रखते हुए आधुनिक हिन्दी में स्पष्ट है।
- source_word: וְשַׁבְתִּי אֶת שְׁבוּת
  choice: फिर से समृद्ध करूँगा
  rationale: यह हिब्रू मुहावरा दशा/भाग्य पलटने और पुनर्बहाली का अर्थ देता है; संदर्भ में निर्वासन से लौटना शामिल है, पर अगला वाक्य भौगोलिक वापसी को अलग से स्पष्ट करता है।
- source_word: נְאֻם יְהוָה
  choice: यहोवा की घोषणा है
  rationale: नबी की वाणी में प्रयुक्त औपचारिक दैवी घोषणा-सूत्र को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: לַאֲבוֹתָם
  choice: उनके पूर्वजों को
  rationale: आधुनिक हिन्दी में वंशगत पूर्वजों के लिए स्पष्ट और समावेशी अभिव्यक्ति।
- source_word: וִירֵשׁוּהָ
  choice: वे उस पर अधिकार करेंगे
  rationale: क्रिया ירשׁ के देश को अपने अधिकार/विरासत में लेने के भाव को बनाए रखता है।
theological_decisions:
- issue: שׁוּב שְׁבוּת मुहावरे का अर्थ
  choice: फिर से समृद्ध करूँगा
  alternative: बँधुआई से लौटा लाऊँगा / दशा बहाल करूँगा
  rationale: मुहावरा केवल स्थानांतरण नहीं, व्यापक पुनर्बहाली का संकेत दे सकता है। अगली पंक्ति में देश में वापस लाने का स्पष्ट कथन होने के कारण यहाँ अर्थ को उसी कथन में सीमित नहीं किया गया।
- issue: परमेश्वर के नाम יהוה का निरूपण
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में उपस्थित विशिष्ट दैवी नाम को हिन्दी बाइबिल परंपरा में व्यापक रूप से पहचाने जाने वाले रूप में प्रस्तुत किया गया है।
- issue: भूमि पर अधिकार का कथन
  choice: उस पर अधिकार करेंगे
  alternative: उसके अधिकारी होंगे / उसे अपने वश में करेंगे
  rationale: वचन में भूमि के दान और भावी अधिकार दोनों को बिना किसी अतिरिक्त धर्मवैज्ञानिक व्याख्या के सीधे रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। भविष्यवाणी की औपचारिक घोषणा को डैश और प्रत्यक्ष कथन से स्पष्ट किया गया है; ‘इस्राएल और यहूदा’ तथा भूमि-वापसी की समानांतर संरचना सुरक्षित है।
