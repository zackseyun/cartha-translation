  text: וְ/אַתָּ֡ה אַל תִּירָא֩ עַבְדִּ֨/י יַעֲקֹ֤ב נְאֻם יְהֹוָה֙ וְ/אַל תֵּחַ֣ת יִשְׂרָאֵ֔ל כִּ֠י הִנְ/נִ֤י מוֹשִֽׁיעֲ/ךָ֙ מֵֽ/רָח֔וֹק וְ/אֶֽת זַרְעֲ/ךָ֖ מֵ/אֶ֣רֶץ שִׁבְיָ֑/ם וְ/שָׁ֧ב יַעֲקֹ֛ב וְ/שָׁקַ֥ט וְ/שַׁאֲנַ֖ן וְ/אֵ֥ין מַחֲרִֽיד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/010.yaml
  text: But as for you[a], do not fear, my servant Jacob, declares Yahweh, and do not be dismayed, Israel; for behold, I am saving you from far away, and your offspring from the land of their captivity. Jacob will return and be quiet and at ease[c][b], with no one to make him afraid.
translation:
  language: hi
  text: पर तू, हे मेरे सेवक याकूब, मत डर—याहवे की यह घोषणा है—और हे इस्राएल, हताश न हो; क्योंकि देख, मैं तुझे दूर से बचा रहा हूँ[a], और तेरे वंशजों को उनकी बंधुआई के देश से[b]। याकूब लौट आएगा, शांत रहेगा और निश्चिंत रहेगा; उसे डराने वाला कोई न होगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मैं तुझे बचाऊँगा।’ ‘देख, मैं’ के साथ प्रयुक्त इब्रानी कृदन्त निकट अथवा निश्चित भविष्य के कार्य को भी व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उस देश से जहाँ वे बन्दी हैं’; अधिक व्यापक अर्थ में, ‘निर्वासन के देश से।’
    reason: lexical_alternative
  - marker: c
    text: या ‘और कोई उसे भयभीत न करेगा।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: पर तू
  rationale: संयोजक और स्वतंत्र सर्वनाम मिलकर बलयुक्त विरोध अथवा विषय-परिवर्तन दिखाते हैं। ‘पर तू’ हिन्दी में संक्षिप्त, स्वाभाविक और स्पष्ट है।
- source_word: אַל תִּירָא
  choice: मत डर
  rationale: ירא के साथ यह सीधा निषेध है। यह सामान्य आधुनिक हिन्दी है और अगले अलग क्रियापद ‘हताश न हो’ से भेद बनाए रखता है।
- source_word: עַבְדִּי
  choice: मेरे सेवक
  rationale: यहाँ עבד याकूब/इस्राएल के लिए सम्मानसूचक वाचा-संबंधी पद है; ‘दास’ की अपेक्षा ‘सेवक’ इस प्रसंग के भाव को अधिक ठीक व्यक्त करता है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: यह स्थिर भविष्यद्वाणी-सूत्र है। ‘घोषणा’ उसकी गंभीरता रखता है और याहवे परमेश्वर के व्यक्तिगत वाचा-नाम को दर्शाता है।
- source_word: וְאַל תֵּחַת
  choice: हताश न हो
  rationale: Niphal में חתת टूट जाने, व्याकुल अथवा निरुत्साहित होने का भाव दे सकता है। ‘हताश न हो’ पहले आए ‘मत डर’ की मात्र पुनरावृत्ति किए बिना मानसिक विघटन का भाव रखता है।
- source_word: הִנְנִי
  choice: क्योंकि देख, मैं
  rationale: हִנְנִי बल और तात्कालिकता प्रकट करता है। ‘देख’ भविष्यद्वाणी की गरिमा रखते हुए इस संकेत को अनूदित करता है।
- source_word: מוֹשִׁיעֲךָ
  choice: तुझे ... बचा रहा हूँ
  rationale: हִנְנִי के साथ कृदन्त आसन्न अथवा निश्चित कार्य प्रस्तुत करता है। वर्तमान प्रगतिशील रूप उस सजीव तात्कालिकता को बनाए रखता है; निश्चित भविष्य का अर्थ पादटिप्पणी में दिया गया है।
- source_word: מֵרָחוֹק
  choice: दूर देश से
  rationale: शाब्दिक अर्थ ‘दूर से’ है; निर्वासन और वापसी के स्थानिक प्रसंग में ‘दूर देश से’ आधुनिक हिन्दी में स्वाभाविक रूप से निहित स्थान को स्पष्ट करता है।
- source_word: זַרְעֲךָ
  choice: तेरे वंशजों
  rationale: זֶרַע सामूहिक एकवचन में भावी संतति को दर्शाता है। ‘वंशजों’ आधुनिक हिन्दी में स्पष्ट है और ‘बीज’ के अस्वाभाविक शाब्दिक प्रयोग से बचता है।
- source_word: מֵאֶרֶץ שִׁבְיָם
  choice: उनकी बन्धुआई के देश से
  rationale: यह चुनाव इब्रानी संबंध-वाक्यांश और captivity के मूल भाव को रखता है; इसे केवल व्यापक ‘निर्वासन’ में नहीं बदलता।
- source_word: וְשָׁב
  choice: लौट आएगा
  rationale: שׁוב यहाँ अपने स्थान पर पुनः आने और पुनर्स्थापना का भाव देता है। ‘लौट आएगा’ सहज हिन्दी है।
- source_word: וְשָׁקַט וְשַׁאֲנַן
  choice: शान्ति और निश्चिन्तता से रहेगा
  rationale: दोनों क्रियाएँ व्यवधानरहित विश्राम और सुरक्षा के निकटवर्ती, पर अलग भाव रखती हैं। संयुक्त हिन्दी पदावली दोनों को स्वाभाविक ढंग से सुरक्षित रखती है।
- source_word: וְאֵין מַחֲרִיד
  choice: उसे डराने वाला कोई न होगा
  rationale: מחריד कारणवाचक अर्थ में किसी को भयभीत करने वाले को दर्शाता है। यह रूप कर्ता की अनुपस्थिति और स्थायी सुरक्षा दोनों व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे प्रयुक्त है। ‘याहवे’ उसे किसी उपाधि से प्रतिस्थापित किए बिना आधुनिक हिन्दी लिपि में प्रस्तुत करता है।
- issue: याकूब और इस्राएल का संदर्भ
  choice: दोनों वाचा-नामों को समानान्तर रूप में बनाए रखना
  alternative: दोनों स्थानों पर केवल ‘इस्राएल’ कहना
  rationale: इब्रानी पाठ जानबूझकर ‘याकूब’ और ‘इस्राएल’ दोनों नामों का प्रयोग करता है। दोनों को रखने से साहित्यिक समानान्तरता और वाचा-संबंधी बनावट सुरक्षित रहती है।
- issue: याकूब की भावी दशा
  choice: शान्ति और निश्चिन्तता से रहेगा
  alternative: चुप रहेगा और सुखी होगा
  rationale: शब्दों का आशय केवल मौन या भावनात्मक सुख नहीं, बल्कि व्यवधान और भय से मुक्त सुरक्षित विश्राम है। अनुवाद इस व्यापक आशय को रखता है, बिना उसे किसी विशिष्ट अंतकालीन योजना से बाँधे।
