  register: आधुनिक मानक हिन्दी का गरिमापूर्ण भविष्यद्वाणी-रजिस्टर अपनाया गया है। सम्बोधन में ‘तू/तेरे’ मूल के एकवचन याकूब-इस्राएल को बनाए रखता है और यहाँ अपमानसूचक नहीं, बल्कि निकट वाचा-संबंधी शैली में प्रयुक्त है। ‘बन्धुआई’ पाठ की ऐतिहासिक-सामूहिक स्थिति को व्यक्त करती है; वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित हैं।
