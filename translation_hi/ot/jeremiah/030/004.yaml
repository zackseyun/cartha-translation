  text: וְ/אֵ֣לֶּה הַ/דְּבָרִ֗ים אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה אֶל יִשְׂרָאֵ֖ל וְ/אֶל יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/004.yaml
  text: And these are the words that Yahweh spoke concerning Israel and Judah:[a]
translation:
  language: hi
  text: और ये वे वचन हैं जो याहवे ने इस्राएल और यहूदा के विषय में कहे:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस्राएल और यहूदा से कहे।” इब्रानी पूर्वसर्ग का अधिक शाब्दिक अनुवाद इस प्रकार हो सकता है, पर यहाँ संभवतः वह दोनों लोगों के विषय में कही गई बातों का परिचय देता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: और ये
  rationale: וְ पिछले प्रसंग से संबंध बनाए रखता है, और אֵלֶּה का संकेतवाचक अर्थ ‘ये’ से स्वाभाविक रूप में व्यक्त होता है।
- source_word: הַ/דְּבָרִים
  choice: वे वचन
  rationale: भविष्यवाणी के परिचय में דְּבָרִים कही गई ईश्वरीय वाणी को दर्शाता है; ‘वचन’ आधुनिक धार्मिक हिन्दी में गरिमापूर्ण और सुबोध है।
- source_word: אֲשֶׁר דִּבֶּר
  choice: जो ... कहे
  rationale: דִּבֶּר का मूल अर्थ बोलना है। हिन्दी में ‘वे वचन जो ... कहे’ अधिक स्वाभाविक है और कथन का आशय सुरक्षित रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुराक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: אֶל יִשְׂרָאֵל וְ/אֶל יְהוּדָה
  choice: इस्राएल और यहूदा के विषय में
  rationale: इस भविष्यवाणी-संबंधी शीर्षक में אֶל दोनों लोगों से प्रत्यक्ष संबोधन के बजाय उनके विषय में आने वाली वाणी का परिचय दे सकता है। फिर भी ‘से’ का अधिक शाब्दिक अर्थ संभव है, इसलिए उसे पाद-टिप्पणी में रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में व्यक्तिगत नाम है; ‘याहवे’ उसे उपाधि में बदले बिना आधुनिक हिन्दी लिपि में प्रस्तुत करता है।
- issue: इस्राएल और यहूदा के साथ אֶל का आशय
  choice: के विषय में
  alternative: से
  rationale: पद आगामी भविष्यवाणी का परिचय है, इसलिए प्रसंग में ‘के विषय में’ उपयुक्त है; किंतु इब्रानी पूर्वसर्ग प्रत्यक्ष रूप से ‘से/की ओर’ भी समझा जा सकता है, अतः इस वास्तविक अस्पष्टता को पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सरल किंतु गरिमापूर्ण रखी गई है। ‘वचन’ भविष्यवाणी-संबंधी सूत्र के लिए चुना गया है और ‘याहवे’ मूल ईश्वरीय नाम का लिप्यंतरण है।
