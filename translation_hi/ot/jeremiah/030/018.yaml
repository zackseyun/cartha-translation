source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה הִנְ/נִי שָׁב֙ שְׁבוּת֙ אָהֳלֵ֣י יַֽעֲק֔וֹב וּ/מִשְׁכְּנֹתָ֖י/ו אֲרַחֵ֑ם וְ/נִבְנְתָ֥ה עִיר֙ עַל תִּלָּ֔/הּ וְ/אַרְמ֖וֹן עַל מִשְׁפָּט֥/וֹ יֵשֵֽׁב׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/018.yaml
  text: 'Thus says Yahweh: Behold[a], I am restoring the fortunes of the tents of Jacob, and I will have compassion on his dwellings. The city will be rebuilt on its mound, and the palace will stand in its proper place.'
translation:
  language: hi
  text: 'याहवे यों कहता है: देखो, मैं याकूब के तंबुओं की दशा बहाल कर रहा हूँ[a], और उसके निवास-स्थानों पर करुणा करूँगा। नगर अपने टीले पर फिर बनाया जाएगा, और राजमहल अपने उचित स्थान पर खड़ा होगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं याकूब के तंबुओं के बंदियों को वापस ला रहा हूँ,” अथवा “मैं याकूब को बंधुआई से पुनःस्थापित कर रहा हूँ।” इब्रानी मुहावरा विशेष रूप से बंधुआई से वापसी या अधिक व्यापक रूप से बिगड़ी दशा की बहाली—दोनों का संकेत दे सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के वाचाई व्यक्तिगत नाम को सामान्य उपाधि से बदलने के बजाय उसका लिप्यंतरण किया गया है।
- source_word: הִנְנִי
  choice: देखो, मैं
  rationale: यह चयन इब्रानी सूचक और बलाघाती अभिव्यक्ति को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: שָׁב שְׁבוּת
  choice: दशा फिर से सुधार रहा हूँ
  rationale: यह इब्रानी मुहावरे के व्यापक अर्थ—विपत्ति को पलटकर पुनःस्थापित करना—को व्यक्त करता है, जबकि बंधुआई से लौटाने की सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: אָהֳלֵי יַעֲקֹב
  choice: याकूब के तंबू
  rationale: याकूब के समुदाय के लिए प्रयुक्त ठोस और सामूहिक बिंब को यथासंभव सीधे रूप में रखा गया है।
- source_word: מִשְׁכְּנֹתָיו
  choice: उसके निवास
  rationale: यह तंबुओं के समानांतर निवास-स्थान का बिंब बनाए रखता है और आधुनिक हिन्दी में सहज है।
- source_word: אֲרַחֵם
  choice: दया करूँगा
  rationale: यह क्रिया करुणा और अनुग्रहपूर्ण दया का भाव संक्षेप और स्वाभाविक रूप से व्यक्त करती है।
- source_word: וְנִבְנְתָה עִיר
  choice: नगर ... फिर बनाया जाएगा
  rationale: संदर्भ किसी सामान्य अनिश्चित नगर के बजाय पुनःस्थापित परिचित नगर की ओर संकेत करता है; 'फिर बनाया' पुनर्निर्माण का आशय स्पष्ट करता है।
- source_word: עַל תִּלָּהּ
  choice: अपने ही टीले पर
  rationale: תֵּל नगर के टीले अथवा ध्वंसावशेषों के टीले को सूचित कर सकता है; 'टीला' अर्थ को अनावश्यक रूप से सीमित नहीं करता और 'अपने ही' मूल स्थान का भाव उभारता है।
- source_word: אַרְמוֹן
  choice: राजमहल
  rationale: पुनःस्थापित नगर के प्रमुख शासकीय या राजकीय भवन के लिए यह स्पष्ट और स्वाभाविक हिन्दी चयन है।
- source_word: עַל מִשְׁפָּטוֹ יֵשֵׁב
  choice: अपने उचित स्थान पर खड़ा होगा
  rationale: यह कठिन इब्रानी मुहावरे में निहित उचित व्यवस्था, नियत स्थिति या अधिकारपूर्ण स्थान के भाव को पठनीय हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: שָׁב שְׁבוּת में पुनःस्थापना का दायरा
  choice: याकूब की दशा का व्यापक सुधार और पुनःस्थापन
  alternative: बंधुओं को लौटा लाना, अथवा बंधुआई से याकूब को पुनःस्थापित करना
  rationale: मुहावरा निर्वासन से वास्तविक वापसी को समेट सकता है, पर उसका अर्थ व्यापक रूप से विपत्ति के पलटने तक भी जाता है। तंबुओं, निवासों, नगर और राजमहल का संदर्भ समग्र पुनःस्थापना के अनुकूल है; संकीर्ण सम्भावना पादटिप्पणी में रखी गई है।
- issue: עַל מִשְׁפָּטוֹ יֵשֵׁב का आशय
  choice: राजमहल अपने उचित स्थान पर खड़ा होगा
  alternative: राजमहल अपनी प्रथा/व्यवस्था के अनुसार आबाद होगा
  rationale: מִשְׁפָּט यहाँ उचित स्थान, निर्धारित व्यवस्था या प्रचलित रीति का संकेत दे सकता है। मुख्य पाठ में स्थानगत पुनःस्थापना चुनी गई है, लेकिन इसे किसी विशेष राजनैतिक या उपासना-संबंधी सिद्धान्त से नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक के लिए सुबोध रूप अपनाया गया है। भविष्यवाणी की गंभीरता के लिए ‘यों कहता है’ और बलाघात के लिए ‘देखो’ रखा गया है। वाक्यरचना स्वाभाविक हिन्दी की है, पर तंबू, निवास और टीले जैसे मूल बिंब सुरक्षित रखे गए हैं।
