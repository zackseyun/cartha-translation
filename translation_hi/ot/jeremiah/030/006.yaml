base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/006.yaml
  text: 'Ask now[a], and see: does a male give birth? Why then do I see every man with his hands on his loins like a woman in labor, and every face turned pale?'
translation:
  language: hi
  text: 'ज़रा पूछो और देखो: क्या कोई पुरुष बच्चे को जन्म देता है? तो फिर क्यों मुझे हर पुरुष प्रसव-वेदना में स्त्री की तरह दोनों हाथ अपनी कमर पर रखे हुए दिखाई देता है, और हर चेहरा पीला पड़ गया है[a]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हर चेहरा हरिताभ पीला पड़ गया है।” इब्रानी शब्द रोग जैसी पीली-हरी रंगत का संकेत देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁאֲלוּ נָא וּרְאוּ
  choice: ज़रा पूछो और देखो
  rationale: बहुवचन आज्ञाओं और आग्रह/प्रोत्साहन सूचक נָא को सहज आधुनिक हिन्दी में रखा गया है; दोनों क्रियाओं का अलग बल भी बना रहता है।
- source_word: אִם יֹלֵד זָכָר
  choice: क्या कोई पुरुष बच्चे को जन्म देता है?
  rationale: यह अलंकारिक प्रश्न पुरुष के प्रसव करने की असंभवता पर बल देता है। स्पष्ट हिन्दी के लिए निहित कर्म ‘बच्चे को’ जोड़ा गया है।
- source_word: מַדּוּעַ רָאִיתִי
  choice: तो फिर क्यों मुझे … दिखाई देता है
  rationale: מַדּוּעַ का तर्कसूचक संबंध ‘तो फिर क्यों’ से और यहाँ पूर्ण क्रिया के सजीव वर्तमान भाव को ‘दिखाई देता है’ से व्यक्त किया गया है।
- source_word: כָל גֶּבֶר
  choice: हर पुरुष
  rationale: גֶּבֶר में पुरुषत्व और सामर्थ्य का भाव हो सकता है; प्रसव-पीड़ा के चित्र के साथ विरोध बनाए रखने के लिए ‘हर पुरुष’ स्वाभाविक और पर्याप्त है।
- source_word: יָדָיו עַל חֲלָצָיו
  choice: अपनी कमर पर हाथ रखे
  rationale: חֲלָצַיִם कमर/कटि-प्रदेश को दर्शाता है। ‘कमर’ सामान्य पाठक के लिए स्पष्ट है और शारीरिक पीड़ा की मुद्रा को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כַּיּוֹלֵדָה
  choice: प्रसव-पीड़ा से जूझती स्त्री की तरह
  rationale: स्त्रीलिंग कृदन्त प्रसव कर रही स्त्री का स्पष्ट चित्र देता है; चुना हुआ वाक्यांश पीड़ा और प्रसव दोनों को सजीव बनाता है।
- source_word: וְנֶהֶפְכוּ כָל־פָּנִים לְיֵרָקוֹן
  choice: और हर चेहरा पीला पड़ गया है
  rationale: यह रंग बदलने और भय या व्यथा से छा गई अस्वस्थ पीलिमा को सहज हिन्दी में व्यक्त करता है; विशेष हरिताभ रंग-छाया पादटिप्पणी में सुरक्षित है।
