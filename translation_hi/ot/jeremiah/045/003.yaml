  text: אָמַ֨רְתָּ֙ אֽוֹי נָ֣א לִ֔/י כִּֽי יָסַ֧ף יְהוָ֛ה יָג֖וֹן עַל מַכְאֹבִ֑/י יָגַ֨עְתִּי֙ בְּ/אַנְחָתִ֔/י וּ/מְנוּחָ֖ה לֹ֥א מָצָֽאתִי־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/045/003.yaml
  text: You said[a], ‘Woe is me now, for Yahweh has added sorrow to my pain. I am weary with my groaning, and I have found no rest.’
translation:
  language: hi
  text: तुमने कहा, “हाय[a], अब मुझ पर विपत्ति है! क्योंकि याहवे ने मेरी पीड़ा पर शोक और बढ़ा दिया है। मैं अपनी कराहों से थक गया हूँ, और मैंने विश्राम नहीं पाया।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हाय मुझ पर!” इब्रानी पुकार विलाप और गहरे संकट को व्यक्त करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַרְתָּ
  choice: तुमने कहा
  rationale: यह אמר का काल पूर्ण, द्वितीय पुरुष एकवचन पुल्लिंग रूप है, जो बारूक की कही हुई शिकायत का परिचय देता है।
- source_word: אֽוֹי נָא לִי
  choice: हाय, अब मेरा क्या होगा!
  rationale: אוי विलाप और संकट की पुकार है; נא यहाँ विनम्र अनुरोध से अधिक भावात्मक तीव्रता देता है। यह स्वाभाविक हिन्दी में व्यक्तिगत व्यथा को व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह विलाप का कारण प्रस्तुत करता है और वाक्यों का व्याख्यात्मक संबंध बनाए रखता है।
- source_word: יָסַף
  choice: और बढ़ा दिया है
  rationale: יסף का मूल अर्थ जोड़ना या बढ़ाना है। यहाँ पहले से मौजूद दुःख के ऊपर शोक बढ़ाए जाने का भाव है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में परमेश्वर का निज नाम चतुराक्षर रूप में है; हिन्दी में प्रचलित सीधा नामरूप ‘यहोवा’ रखा गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: יָגוֹן
  choice: शोक
  rationale: यह गहरे मानसिक दुःख या संताप को दर्शाता है और מַכְאוֹב से शब्दगत भेद बनाए रखता है।
- source_word: עַל מַכְאֹבִי
  choice: मेरे दुःख पर
  rationale: עַל पहले से उपस्थित पीड़ा के ऊपर एक और बोझ जोड़े जाने का चित्र बनाए रखता है।
- source_word: יָגַעְתִּי
  choice: मैं ... थक गया हूँ
  rationale: पूर्ण रूप निरंतर कराहने से उत्पन्न वर्तमान थकावट की परिणामी अवस्था व्यक्त करता है।
- source_word: בְּאַנְחָתִי
  choice: कराहते-कराहते
  rationale: אַנְחָה कराह या आह को दर्शाता है; ב को कारण अथवा साथ चलने वाली परिस्थिति समझा जा सकता है। हिन्दी का यह प्रयोग निरंतर कराह और उससे आई थकान दोनों व्यक्त करता है।
- source_word: וּמְנוּחָה לֹא מָצָאתִי
  choice: और मुझे विश्राम नहीं मिला
  rationale: यह מְנוּחָה के विश्राम या राहत के अर्थ और ‘न पाने’ के अनुभव को स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: पद में ईश्वरीय निज नाम सीधे आया है। किसी उपाधि के स्थान पर नाम को रखा गया है; ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला रूप है।
- issue: दुःख बढ़ाने वाले कर्ता के रूप में यहोवा
  choice: यहोवा ने मेरे दुःख पर शोक और बढ़ा दिया है
  alternative: यहोवा ने मेरे दुःख को और बढ़ा दिया है
  rationale: मूल पाठ में यָגוֹן और מַכְאוֹב दो अलग संज्ञाएँ हैं और यह कथन बारूक की शिकायत के रूप में उद्धृत है। अनुवाद उस धार्मिक तनाव को नरम नहीं करता कि बारूक अपनी बढ़ी हुई व्यथा का संबंध यहोवा से जोड़ता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। उद्धृत विलाप की तीव्रता को विस्मयादिबोधक वाक्य से व्यक्त किया गया है; ‘शोक’ और ‘दुःख’ द्वारा मूल की दो निकट, पर अलग, पीड़ासूचक संज्ञाओं का भेद रखा गया है।
