base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/045/001.yaml
  text: 'The word that Jeremiah the prophet spoke to Baruch son of Neriah when he wrote these words in a scroll at the mouth of Jeremiah[a], in the fourth year of Jehoiakim son of Josiah, king of Judah, saying:'
translation:
  language: hi
  text: 'वह वचन जो यिर्मयाह भविष्यद्वक्ता ने नेरिय्याह के पुत्र बारूक से कहा, जब बारूक ने ये वचन यिर्मयाह के मुँह से[a] एक लिखित स्क्रॉल में लिखे, यहूदा के राजा योशिय्याह के पुत्र यहोयाकीम के चौथे वर्ष में, यह कहते हुए:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यिर्मयाह के श्रुतलेखन पर”; शाब्दिक अर्थ, “यिर्मयाह के मुँह से।”
    reason: מִפִּי יִרְמְיָהוּ के शाब्दिक रूप तथा उसके श्रुतलेखन-संबंधी मुहावरेदार अर्थ को दर्शाना।
