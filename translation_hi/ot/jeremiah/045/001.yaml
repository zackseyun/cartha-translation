- source_word: הַנָּבִיא
  choice: भविष्यद्वक्ता
  rationale: यिर्मयाह के पद को स्पष्ट करने वाला प्रचलित बाइबलीय हिन्दी शब्द है।
- source_word: בְּכָתְבוֹ
