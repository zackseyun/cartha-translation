- source_word: עַל סֵפֶר
  choice: एक पुस्तक-पट पर
  rationale: प्राचीन लिखित दस्तावेज़ को आधुनिक जिल्दबद्ध पुस्तक समझे जाने से बचाते हुए ‘पर’ से मूल עַל को दर्शाता है।
- source_word: מִפִּי יִרְמְיָהוּ
  choice: यिर्मयाह के मुँह से सुनकर
