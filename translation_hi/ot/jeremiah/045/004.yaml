source:
  edition: WLC
  text: כֹּ֣ה תֹּאמַ֣ר אֵלָ֗י/ו כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנֵּ֤ה אֲשֶׁר בָּנִ֨יתִי֙ אֲנִ֣י הֹרֵ֔ס וְ/אֵ֥ת אֲשֶׁר נָטַ֖עְתִּי אֲנִ֣י נֹתֵ֑שׁ וְ/אֶת כָּל הָ/אָ֖רֶץ הִֽיא׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/045/004.yaml
  text: 'This is what you shall say to him: ‘This is what Yahweh says: Behold[a], what I have built I am tearing down, and what I have planted I am uprooting, that is, the whole land.’'
translation:
  language: hi
  text: 'तुम उससे यह कहना: “याहवे यह कहता है: देखो, जिसे मैंने बनाया है, उसे मैं ढा रहा हूँ, और जिसे मैंने लगाया है, उसे मैं उखाड़ रहा हूँ—पूरे देश को ही[a]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पूरी पृथ्वी को ही।” इब्रानी אֶרֶץ का अर्थ “देश/भूमि” या “पृथ्वी” हो सकता है; यहाँ यहूदा पर न्याय के निकट प्रसंग के कारण “देश” को प्राथमिकता दी गई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה תֹּאמַר אֵלָיו
  choice: तुम उससे यह कहना
  rationale: כֹּה प्रत्यक्ष कथन का परिचय देता है। निर्देशात्मक अपूर्ण क्रिया को स्वाभाविक आधुनिक हिन्दी में ‘यह कहना’ से व्यक्त किया गया है।
- source_word: כֹּה אָמַר יְהוָה
  choice: याहवे यह कहता है
  rationale: यह भविष्यद्वक्ताओं का प्रचलित संदेशवाहक-सूत्र है। אָמַר रूपतः पूर्ण क्रिया है, पर इस सूत्र में हिन्दी का वर्तमानकाल ‘कहता है’ परमेश्वर की अभी घोषित की जा रही अधिकारपूर्ण वाणी को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में रखा गया है।
- source_word: הִנֵּה
  choice: देख
  rationale: यह ध्यान खींचने और आगामी घोषणा पर गंभीर बल देने वाला शब्द है। ‘देख’ आधुनिक हिन्दी में स्पष्ट और प्रभावशाली है।
- source_word: אֲשֶׁר בָּנִיתִי אֲנִי הֹרֵס
  choice: जिसे मैंने बनाया है, उसे मैं ढा रहा हूँ
  rationale: बनाने और ढाने का रूपक सुरक्षित रखा गया है। कृदन्त הֹרֵס वर्तमान अथवा आसन्न जारी कार्रवाई को सूचित करता है, इसलिए ‘ढा रहा हूँ’ चुना गया है।
- source_word: וְאֵת אֲשֶׁר נָטַעְתִּי אֲנִי נֹתֵשׁ
  choice: और जिसे मैंने लगाया है, उसे मैं उखाड़ रहा हूँ
  rationale: ‘लगाना’ और ‘उखाड़ना’ यिर्मयाह में बार-बार आने वाले कृषि-रूपक को सुरक्षित रखते हैं।
- source_word: וְאֶת כָּל הָאָרֶץ הִיא
  choice: —अर्थात् इस पूरे देश को
  rationale: इब्रानी वाक्यांश संक्षिप्त और अंडाकार है। इसे पिछले दोनों क्रियात्मक पदों के दायरे को स्पष्ट करने वाले समानाधिकरण के रूप में समझा गया है। प्रसंग में הָאָרֶץ से यहूदा का देश अधिक संभावित है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है; ‘याहवे’ उसे उपाधि में बदले बिना प्रस्तुत करता है।
- issue: הָאָרֶץ का भौगोलिक दायरा
  choice: पूरा देश
  alternative: पूरी पृथ्वी
  rationale: אֶרֶץ का अर्थ ‘देश/भूमि’ या ‘पृथ्वी’ दोनों हो सकता है। यिर्मयाह के निकट प्रसंग में यहूदा पर न्याय प्रमुख है, इसलिए ‘देश’ चुना गया है, जबकि व्यापक शाब्दिक संभावना पादटिप्पणी में रखी गई है।
- issue: अंतिम वाक्यांश का संबंध
  choice: पिछली दोनों क्रियाओं के दायरे को स्पष्ट करने वाला समानाधिकरण
  alternative: 'एक स्वतंत्र कथन: ‘और वह पूरा देश है’'
  rationale: וְאֶת में कर्म-चिह्न और वाक्यांश की अंडाकार संरचना इसे ‘बनाए/लगाए’ गए समूचे क्षेत्र की व्याख्या मानने का समर्थन करती है; ‘अर्थात्’ हिन्दी में इस संबंध को बिना अतिरिक्त कारण जोड़े स्पष्ट करता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘देख’ भविष्यद्वाणी की गंभीरता बनाए रखता है, जबकि ‘ढा रहा हूँ’ और ‘उखाड़ रहा हूँ’ मूल के समानांतर रूपकों और जारी/आसन्न कार्रवाई को सुरक्षित रखते हैं।
