  edition: WLC
  text: כֹּֽה אָמַ֥ר יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל עָלֶ֖י/ךָ בָּרֽוּךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/045/002.yaml
  text: 'Thus says Yahweh[a], the God of Israel, concerning you, Baruch:'
translation:
  language: hi
  text: 'याहवे, इस्राएल का परमेश्वर, तुम्हारे विषय में[a] इस प्रकार कहता है, हे बारूक:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारे बारे में”; कम सम्भव, “तुम्हारे विरुद्ध।”
    reason: עָלֶיךָ में संबंधात्मक ‘विषय में/बारे में’ और संभावित विरोधात्मक ‘विरुद्ध’ अर्थ की अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: כֹּה
  choice: इस प्रकार
  rationale: यह भविष्यवाणी के संदेश का पारंपरिक परिचय है; ‘इस प्रकार’ उसके औपचारिक स्वर को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אָמַר
  choice: कहता है
  rationale: रूप भूतकालिक है, पर כֹּה אָמַר संदेशवाहक-सूत्र के रूप में वर्तमान वाणी का परिचय देता है; इसलिए हिन्दी में वर्तमान काल स्वाभाविक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले ईश्वरीय निज नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल का परमेश्वर
  rationale: सम्बन्धवाचक इब्रानी पदबंध को उसके पूर्ण वाचा-संबंधी शीर्षक के रूप में सीधे और स्वाभाविक ढंग से रखा गया है।
- source_word: עָלֶיךָ
  choice: तुम्हारे विषय में
  rationale: על यहाँ बारूक से संबंधित संदेश का संकेत देता है। यह अनुवाद संभावित अर्थ को व्यक्त करता है, बिना इसे अनिवार्य रूप से विरोधी अर्थ ‘तुम्हारे विरुद्ध’ देने के।
- source_word: בָּרוּךְ
  choice: बारूक
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण अपनाया गया है; संबोधन को स्पष्ट करने के लिए ‘हे’ जोड़ा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा ‘प्रभु’
  rationale: मूल पाठ में ईश्वर का निज नाम सीधे आया है। ‘याहवे’ उसका लिप्यंतरण करता है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: עָלֶיךָ का संबंधात्मक या विरोधात्मक अर्थ
  choice: तुम्हारे विषय में
  alternative: तुम्हारे विरुद्ध
  rationale: संदर्भ में यह बारूक से संबंधित वचन का परिचय देता है। विरोधात्मक अर्थ व्याकरणतः संभव है, पर यहाँ कम संभावित है; इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण भविष्यवाणी-संबंधी शैली रखी गई है। ‘तुम्हारे’ आधुनिक पाठकों के लिए स्वाभाविक है, जबकि ‘इस प्रकार कहता है’ मूल संदेशवाहक-सूत्र की औपचारिकता बनाए रखता है। पादटिप्पणी-चिह्न उसी पदबंध पर रखा गया है जिससे उसका lexical विकल्प संबंधित है।
