  text: וְ/אַתָּ֛ה תְּבַקֶּשׁ לְ/ךָ֥ גְדֹל֖וֹת אַל תְּבַקֵּ֑שׁ כִּ֡י הִנְ/נִי֩ מֵבִ֨יא רָעָ֤ה עַל כָּל בָּשָׂר֙ נְאֻם יְהוָ֔ה וְ/נָתַתִּ֨י לְ/ךָ֤ אֶֽת נַפְשְׁ/ךָ֙ לְ/שָׁלָ֔ל עַ֥ל כָּל הַ/מְּקֹמ֖וֹת אֲשֶׁ֥ר תֵּֽלֶךְ שָֽׁם־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/045/005.yaml
  text: And you—are you seeking great things for yourself? Do not seek them, for behold, I am bringing disaster on all flesh, declares the LORD. But I will give you your life as plunder in every place where you go.
translation:
  language: hi
  text: और तू—क्या तू अपने लिए बड़ी-बड़ी चीज़ें चाहता है? उन्हें मत चाह; क्योंकि देख, मैं सब प्राणियों[a] पर विपत्ति लाने वाला हूँ—यह यहोवा की वाणी है। पर जहाँ कहीं तू जाएगा, वहाँ मैं तेरा जीवन तुझे लूट के माल के रूप में[b] दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “सब मांस”; यह अभिव्यक्ति यहाँ सभी मनुष्यों अथवा सभी नश्वर प्राणियों की ओर संकेत कर सकती है।
    reason: मूल मुहावरे की व्यापकता और उसका संभावित दायरा स्पष्ट करना।
  - marker: b
    text: अर्थात आने वाले विनाश के बीच उसका अपना जीवन बच जाना ही उसके हाथ लगा लाभ होगा।
    reason: हिब्रू रूपक का आशय समझाना, जबकि मुख्य पाठ में रूपक सुरक्षित है।
lexical_decisions:
- source_word: גְדֹלוֹת (gedolot)
  choice: बड़ी-बड़ी बातें
  rationale: मूल का व्यापक और कुछ हद तक अस्पष्ट बहुवचन बनाए रखा गया है; इसे केवल पद, धन या उपलब्धियों तक सीमित नहीं किया गया।
- source_word: רָעָה (ra‘ah)
  choice: विपत्ति
  rationale: संदर्भ में इसका अर्थ नैतिक बुराई नहीं, बल्कि आने वाली विनाशकारी आपदा है।
- source_word: כָּל־בָּשָׂר (kol-basar)
  choice: सब प्राणियों
  rationale: शाब्दिक ‘सब मांस’ के हिब्रू मुहावरे को स्वाभाविक हिन्दी में रखा गया है, बिना इसे निश्चित रूप से केवल ‘सब मनुष्यों’ तक सीमित किए।
- source_word: נַפְשְׁךָ לְשָׁלָל (nafshekha leshalal)
  choice: तेरा प्राण तुझे लूट के माल के रूप में
  rationale: जीवन बच निकलने को युद्ध में मिले लूट के माल के समान बताने वाले प्रभावशाली रूपक को सुरक्षित रखा गया है।
- source_word: יְהוָה (YHWH)
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत नाम को सामान्य उपाधि से प्रतिस्थापित नहीं किया गया।
theological_decisions:
- issue: כָּל־בָּשָׂר का विस्तार
  choice: सब प्राणियों
  alternative: सब मनुष्यों
  rationale: हिब्रू अभिव्यक्ति का दायरा संदर्भ में मानवजाति की ओर संकेत कर सकता है, पर अनुवाद ने मूल की व्यापक भाषा को बनाए रखा है।
- issue: נֶפֶשׁ का अर्थ
  choice: प्राण
  alternative: जीवन
  rationale: यहाँ आशय बारूक का जीवित बचना है; ‘प्राण’ हिन्दी में व्यक्ति के जीवन और स्वयं दोनों की छाया बनाए रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सीधा हिन्दी गद्य। एकवचन संबोधन के लिए ‘तू/तेरा’ रखा गया है, जो भविष्यवाणी के व्यक्तिगत और गंभीर स्वर के अनुकूल है। प्रश्न और निषेध की पुनरावृत्ति मूल की वाक्यगत तीव्रता बनाए रखती है।
