- from: '“अब सेनाओं का परमेश्वर, इस्राएल का परमेश्वर याहवे यह कहता है: तुम अपने ही विरुद्ध इतनी बड़ी बुराई[a] क्यों कर रहे हो? इससे यहूदा में से तुम्हारे पुरुष और स्त्री, बालक और दूध-पीते शिशु तक मिट जाएँगे और तुम्हारा कोई शेष नहीं बचेगा।”'
  to: '“अब याहवे, सेनाओं का परमेश्वर, इस्राएल का परमेश्वर, यह कहता है: तुम अपने ही विरुद्ध इतनी बड़ी बुराई[a] क्यों कर रहे हो, कि यहूदा में से पुरुष और स्त्री, बालक और दूध पीते शिशु तक का नाश हो जाए और तुम्हारे लिए कोई शेष न रहे?”'
  rationale: The revision corrects the main syntactic issue by linking the threatened cutting off directly to the people’s self-destructive conduct. It preserves the Hebrew titles, the ambiguity of רָעָה through the footnote, the four population groups, Judah as the setting from which they are cut off, and the significant term “शेष.”
