    issue: The clause “इससे ... मिट जाएँगे” recasts the infinitival clause לְהַכְרִית as a detached future consequence.
    rationale: The Hebrew asks why they are doing great evil to themselves so as to bring about the cutting off of man, woman, child, and nursing infant from Judah, leaving no remnant. The revision keeps that action-result linkage in the question.
  - severity: low
    issue: “तुम्हारे पुरुष और स्त्री” adds an explicit possessive to the population categories.
    rationale: The source lists “man and woman, child and nursing infant” without attaching “your.” Omitting it is closer and avoids an unnecessary narrowing.
