source:
  edition: WLC
  text: וְ/עַתָּ֡ה כֹּֽה אָמַ֣ר יְהוָה֩ אֱלֹהֵ֨י צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל לָ/מָה֩ אַתֶּ֨ם עֹשִׂ֜ים רָעָ֤ה גְדוֹלָה֙ אֶל נַפְשֹׁ֣תֵ/כֶ֔ם לְ/הַכְרִ֨ית לָ/כֶ֧ם אִישׁ וְ/אִשָּׁ֛ה עוֹלֵ֥ל וְ/יוֹנֵ֖ק מִ/תּ֣וֹךְ יְהוּדָ֑ה לְ/בִלְתִּ֛י הוֹתִ֥יר לָ/כֶ֖ם שְׁאֵרִֽית־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/007.yaml
  text: 'And now[a], thus says Yahweh, the God of hosts, the God of Israel: Why are you doing this great evil against yourselves, to cut off from among Judah man and woman, child and infant, leaving yourselves no remnant?'
translation:
  language: hi
  text: '“अब याहवे, सेनाओं का परमेश्वर, इस्राएल का परमेश्वर, यह कहता है: तुम अपने ही विरुद्ध इतनी बड़ी बुराई[a] क्यों कर रहे हो, कि यहूदा में से पुरुष और स्त्री, बालक और दूध पीते शिशु तक का नाश हो जाए और तुम्हारे लिए कोई शेष न रहे?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम अपने आपको इतनी बड़ी हानि क्यों पहुँचा रहे हो?” इब्रानी शब्द רָעָה का अर्थ नैतिक बुराई या हानि/विपत्ति हो सकता है; यहाँ दोनों भाव निकटता से जुड़े हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: सेनाओं का परमेश्वर
  rationale: यह צְבָאוֹת की सैन्य अथवा स्वर्गीय सेनाओं से जुड़ी व्यापकता बनाए रखता है और हिन्दी में परिचित, गरिमापूर्ण उपाधि है।
- source_word: עֹשִׂים רָעָה גְדוֹלָה אֶל נַפְשֹׁתֵיכֶם
  choice: तुम अपने ही विरुद्ध इतनी बड़ी बुराई क्यों कर रहे हो
  rationale: נפשׁותיכם को यहाँ व्यक्तियों के लिए प्रयुक्त मुहावरे के रूप में ‘अपने ही’ कहा गया है। ‘बुराई’ नैतिक अर्थ को रखती है, जबकि पद का परिणाम स्वयं को भारी हानि पहुँचाना है; इस द्विअर्थता को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: לְהַכְרִית
  choice: मिट जाएँगे
  rationale: हिफ़ील क्रिया के विनाशकारी परिणाम को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; प्रसंग में उनके कर्मों के फलस्वरूप समुदाय का उच्छेद अभिप्रेत है।
- source_word: אִישׁ וְאִשָּׁה עוֹלֵל וְיוֹנֵק
  choice: पुरुष और स्त्री, बालक और दूध-पीते शिशु तक
  rationale: चारों वर्गों को स्पष्ट रखते हुए יוֹנֵק का शाब्दिक आयु-संकेत ‘दूध-पीते’ में सुरक्षित किया गया है; ‘तक’ सर्वसमावेशी बल दिखाता है।
- source_word: מִתּוֹךְ יְהוּדָה
  choice: यहूदा में से
  rationale: समुदाय अथवा क्षेत्र के बीच से हटाए जाने का अर्थ संक्षेप और स्वाभाविक रूप में व्यक्त होता है।
- source_word: שְׁאֵרִית
  choice: शेष
  rationale: न्याय के बाद बचे हुए लोगों के लिए यिर्मयाह का महत्त्वपूर्ण भविष्यद्वक्तात्मक शब्द सुरक्षित रहता है।
theological_decisions:
- issue: רָעָה का नैतिक बुराई और हानिकारक विपत्ति के बीच अर्थ
  choice: बड़ी बुराई
  alternative: अपने आपको इतनी बड़ी हानि
  rationale: ‘बुराई’ लोगों के कर्म की नैतिक गंभीरता को व्यक्त करती है, पर आत्म-विनाश का निकट संदर्भ ‘हानि’ के अर्थ को भी सक्रिय रखता है; पादटिप्पणी दोनों को सामने रखती है।
- issue: שְׁאֵרִית का अनुवाद
  choice: शेष
  alternative: बचे हुए लोग
  rationale: ‘शेष’ तत्काल अर्थ के साथ इस शब्द की भविष्यद्वक्तात्मक प्रतिध्वनि भी बनाए रखता है, बिना उसे किसी विशिष्ट सिद्धान्त से भरने के।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। प्रत्यक्ष कथन की तीव्रता बनाए रखने के लिए प्रश्न को दो वाक्यों में स्वाभाविक रूप से प्रवाहित किया गया है।
