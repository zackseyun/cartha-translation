reference: Jeremiah 44:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וָ/אֶשְׁלַ֤ח אֲלֵי/כֶם֙ אֶת כָּל עֲבָדַ֣/י הַ/נְּבִיאִ֔ים הַשְׁכֵּ֥ים וְ/שָׁלֹ֖חַ לֵ/אמֹ֑ר אַל נָ֣א תַעֲשׂ֗וּ אֵ֛ת דְּבַֽר הַ/תֹּעֵבָ֥ה הַ/זֹּ֖את אֲשֶׁ֥ר שָׂנֵֽאתִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/004.yaml
  text: Yet I sent to you all my servants the prophets[a], rising early and sending them, saying[b], 'Please do not do this abominable thing that I hate.'
translation:
  language: hi
  text: फिर भी मैं अपने सभी सेवकों, अर्थात् नबियों, को तुम्हारे पास बार-बार भेजता रहा और यह कहता रहा, “कृपा करके यह घृणित काम मत करो, जिससे मैं घृणा करता हूँ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֶשְׁלַח
  choice: फिर भी मैं ... भेजता रहा
  rationale: वाव-क्रम कथा को आगे बढ़ाता है, पर संदर्भ में लोगों की अवज्ञा के बावजूद परमेश्वर द्वारा चेतावनी भेजते रहने का हल्का विरोधात्मक भाव है; इसलिए ‘फिर भी’ उपयुक्त है। ‘भेजता रहा’ आगे आने वाले पुनरावृत्ति-सूचक मुहावरे के साथ निरंतर प्रयास व्यक्त करता है।
- source_word: אֲלֵיכֶם
  choice: तुम्हारे पास
  rationale: द्वितीय पुरुष बहुवचन के साथ दिशा का स्वाभाविक आधुनिक हिन्दी रूप।
- source_word: כָּל עֲבָדַי הַנְּבִיאִים
  choice: अपने सभी सेवकों—नबियों—को
  rationale: दोनों संज्ञाओं को स्पष्ट रखते हुए नबियों को ‘सेवकों’ का समानाधिकरण माना गया है; यह उनकी दिव्य नियुक्ति को व्यक्त करता है।
- source_word: הַשְׁכֵּים וְשָׁלֹחַ
  choice: बार-बार भेजता रहा
  rationale: शाब्दिक चित्र ‘सवेरे उठकर भेजना’ है, जो इब्रानी में तत्परता, आग्रह और निरंतर दोहराव का मुहावरा है। मुख्य पाठ में उसका स्वाभाविक हिन्दी अर्थ दिया गया है और शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: לֵאמֹר
  choice: और उनसे कहलवाया
  rationale: यह भेजे गए नबियों के संदेश का परिचय देता है। हिन्दी में ‘उनसे कहलवाया’ वक्ता, संदेशवाहक और संदेश के संबंध को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: אַל נָא תַעֲשׂוּ
  choice: कृपा करके ... मत करो
  rationale: אַל निषेध प्रकट करता है और נָא विनती अथवा आग्रह का भाव जोड़ता है; ‘कृपा करके ... मत करो’ दोनों को बनाए रखता है।
- source_word: דְּבַר הַתּוֹעֵבָה הַזֹּאת
  choice: यह घिनौना काम
  rationale: דבר यहाँ ‘बात/कार्य’ के अर्थ में है और תועבה किसी अत्यंत घृणित, विशेषतः मूर्तिपूजा-संबंधी कार्य को बताता है। ‘घिनौना काम’ आधुनिक पाठक के लिए स्पष्ट है और मूल की तीव्र नैतिक शक्ति बनाए रखता है।
- source_word: אֲשֶׁר שָׂנֵאתִי
  choice: जिससे मैं घृणा करता हूँ
  rationale: इब्रानी सिद्ध क्रिया परमेश्वर के स्थिर मूल्यांकन को व्यक्त करती है; हिन्दी वर्तमान काल उस जारी और अटल विरोध को स्वाभाविक ढंग से संप्रेषित करता है।
theological_decisions:
- issue: मूर्तिपूजक आचरण के प्रति परमेश्वर की अप्रसन्नता को न नरम करना, न उसका धर्मवैज्ञानिक विस्तार करना
  choice: जिससे मैं घृणा करता हूँ
  alternative: जो मुझे घिनौना लगता है / जिससे मैंने घृणा की
  rationale: मूल पाठ उस कार्य के प्रति परमेश्वर की घृणा को सीधे व्यक्त करता है। चुना हुआ रूप उसकी नैतिक तीव्रता बनाए रखता है, पर पाठ से परे कोई बाद की धर्मसैद्धांतिक श्रेणी नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘कृपा करके’ में चेतावनी का विनतीपूर्ण आग्रह, ‘घिनौना काम’ में मूल की तीव्रता, और ‘बार-बार भेजता रहा’ में इब्रानी मुहावरे का आशय सुरक्षित है।
