base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/009.yaml
  text: Have you forgotten the evil deeds of your fathers[a], the evil deeds of the kings of Judah, the evil deeds of their wives, your own evil deeds, and the evil deeds of your wives[b], which they did in the land of Judah and in the streets of Jerusalem?
translation:
  language: hi
  text: क्या तुम अपने पुरखाओं के बुरे काम, यहूदा के राजाओं के बुरे काम, उनकी पत्नियों के बुरे काम[a], अपने बुरे काम और अपनी पत्नियों के बुरे काम भूल गए हो—वे काम जो उन्होंने यहूदा की भूमि और यरूशलेम की गलियों में किए थे?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “उसकी पत्नियों” है; पर यहूदा के अनेक राजाओं के संदर्भ में इसका सामूहिक अर्थ “उनकी पत्नियों” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְׁכַחְתֶּם
  choice: क्या तुम ... भूल गए हो
  rationale: इब्रानी प्रश्नवाचक रूप को वर्तमान परिणाम वाली स्वाभाविक हिन्दी अभिव्यक्ति में रखा गया है; यह प्रश्न एक फटकार है।
- source_word: רָעוֹת / רָעֹתֵיכֶם
  choice: बुरे काम
  rationale: बहुवचन संज्ञा यहाँ किए गए नैतिक रूप से बुरे कार्यों की ओर संकेत करती है, विशेषतः आगे אֲשֶׁר עָשׂוּ (‘जो उन्होंने किए’) आने के कारण।
- source_word: אֲבוֹתֵיכֶם
  choice: तुम्हारे पुरखाओं
  rationale: ‘पुरखे’ पुरुषवाचक पारिवारिक और पीढ़ीगत भाव को बनाए रखते हुए आधुनिक हिन्दी में ‘पितरों’ की अपेक्षा अधिक सहज है।
- source_word: מַלְכֵי יְהוּדָה
  choice: यहूदा के राजाओं
  rationale: सम्बन्धकारक पदबंध का सीधा और स्वाभाविक अनुवाद।
- source_word: נָשָׁיו
  choice: उनकी पत्नियों
  rationale: प्रत्यय रूपतः एकवचन ‘उसकी’ है, पर पूर्ववर्ती बहुवचन ‘यहूदा के राजाओं’ के बाद सामूहिक अथवा वितरणात्मक अर्थ में हिन्दी का ‘उनकी’ स्वाभाविक है; अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: נְשֵׁיכֶם
  choice: अपनी पत्नियों
  rationale: द्वितीय पुरुष बहुवचन स्वामित्व को हिन्दी के आत्मवाचक ‘अपनी’ से स्वाभाविक रूप में व्यक्त किया गया है।
- source_word: אֲשֶׁר עָשׂוּ
  choice: वे काम जो उन्होंने ... किए थे
  rationale: עשה के सामान्य अर्थ ‘करना’ को बनाए रखा गया है; ‘वे काम’ जोड़कर सम्बन्धवाचक उपवाक्य का आश्रय हिन्दी में स्पष्ट किया गया है।
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: यहूदा देश में
  rationale: אֶרֶץ का भौगोलिक अर्थ ‘देश’ आधुनिक हिन्दी में सहज और स्पष्ट है।
- source_word: בְּחֻצוֹת יְרוּשָׁלִָם
  choice: यरूशलेम की गलियों में
  rationale: חֻצוֹת नगर के सार्वजनिक मार्गों अथवा खुले स्थानों को दर्शाता है; यहाँ ‘गलियाँ’ सबसे स्वाभाविक हिन्दी विकल्प है।
theological_decisions:
- issue: רָעוֹת का नैतिक और ठोस अर्थ
  choice: बुरे काम
  alternative: बुराइयाँ / दुष्ट काम
  rationale: पद विभिन्न समूहों द्वारा किए गए दोषपूर्ण कार्य गिनाता है और उन्हें ‘जो उन्होंने किए’ से विशेषित करता है; इसलिए कार्यसूचक अनुवाद उपयुक्त है।
- issue: אֲבוֹתֵיכֶם का पीढ़ीगत पुरुषवाचक अर्थ
  choice: तुम्हारे पुरखे
  alternative: तुम्हारे पूर्वज / तुम्हारे पिता
  rationale: ‘पुरखे’ मूल के पुरुषवाचक, पारिवारिक और पीढ़ीगत बल को स्वाभाविक आधुनिक हिन्दी में सुरक्षित रखता है।
- issue: נָשָׁיו का एकवचन प्रत्यय और बहुवचन संदर्भ
  choice: उनकी पत्नियाँ, साथ में पादटिप्पणी
  alternative: उसकी पत्नियाँ
  rationale: रूपतः एकवचन प्रत्यय को छिपाया नहीं गया, पर बहुवचन ‘राजाओं’ के संदर्भ में वितरणात्मक अर्थ मुख्य पाठ में पठनीय हिन्दी से व्यक्त किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन के लिए बहुवचन ‘तुम’ रखा गया है। शैली स्पष्ट, गंभीर और आरोपात्मक है। समानांतर सूची को दोहराव सहित सुरक्षित रखा गया है, और मूल की वास्तविक व्याकरणिक अस्पष्टता पादटिप्पणी में दी गई है।
