source:
  edition: WLC
  text: מִ/פְּנֵ֣י רָעָתָ֗/ם אֲשֶׁ֤ר עָשׂוּ֙ לְ/הַכְעִסֵ֔/נִי לָ/לֶ֣כֶת לְ/קַטֵּ֔ר לַ/עֲבֹ֖ד לֵ/אלֹהִ֣ים אֲחֵרִ֑ים אֲשֶׁר֙ לֹ֣א יְדָע֔וּ/ם הֵ֖מָּה אַתֶּ֥ם וַ/אֲבֹתֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/003.yaml
  text: because of their evil that they did to provoke me to anger[a], by going to burn incense and to serve other gods[b], whom they had not known—they, you, and your fathers.
translation:
  language: hi
  text: उनकी उस बुराई के कारण, जो उन्होंने मुझे क्रोधित करने के लिए की—वे जाकर धूप जलाते और दूसरे देवताओं की सेवा[a] करते थे, जिन्हें न वे जानते थे, न तुम, न तुम्हारे पुरखे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘दूसरे देवताओं की उपासना करते थे।’ हिब्रू क्रिया धार्मिक सेवा या उपासना, दोनों को व्यक्त कर सकती है।
    reason: lexical_alternative
  - marker: b
    text: 'हिब्रू के अंत में बलाघातपूर्ण कर्ता-सूची आती है: ‘वे, तुम और तुम्हारे पुरखे।’'
    reason: source_structure
lexical_decisions:
- source_word: מִפְּנֵי רָעָתָם
  choice: उनकी उस बुराई के कारण
  rationale: מִפְּנֵי यहाँ कारण बताता है और רָעָה मूर्तिपूजक कर्मों से स्पष्ट की गई नैतिक बुराई को दर्शाता है।
- source_word: אֲשֶׁר עָשׂוּ לְהַכְעִסֵנִי
  choice: जो उन्होंने मुझे क्रोधित करने के लिए की
  rationale: यह अनुवाद सरल संबंधवाचक वाक्य और כעס के हिफ़ील रूप की कारणवाचक शक्ति को बनाए रखता है।
- source_word: לָלֶכֶת לְקַטֵּר
  choice: वे जाकर धूप जलाते
  rationale: לָלֶכֶת आगे के कर्म का ढंग प्रस्तुत करता है; हिन्दी में ‘जाकर’ स्वाभाविक है। קטר का पिएल रूप इस धार्मिक संदर्भ में धूप जलाने को सूचित करता है।
- source_word: לַעֲבֹד לֵאלֹהִים אֲחֵרִים
  choice: दूसरे देवताओं की सेवा करते थे
  rationale: עבד का सीधा अर्थ ‘सेवा करना’ है, जिसमें यहाँ धार्मिक निष्ठा और उपासना सम्मिलित है, पर उसे केवल ‘उपासना’ तक सीमित नहीं किया गया।
- source_word: אֲשֶׁר לֹא יְדָעוּם
  choice: जिन्हें ... जाना था
  rationale: ידע के मूल ‘जानना’ को रखा गया है, ताकि उसके संभावित संबंधपरक अर्थ को किसी अधिक व्याख्यात्मक शब्द से सीमित न किया जाए।
- source_word: הֵמָּה אַתֶּם וַאֲבֹתֵיכֶם
  choice: न उन्होंने ... न तुमने और न तुम्हारे पुरखाओं ने
  rationale: हिब्रू की बलाघातपूर्ण त्रयी को स्पष्ट, स्वाभाविक हिन्दी में अलग-अलग कर्ताओं के रूप में रखा गया है; אבות के पुरुषवाचक स्वरूप के लिए ‘पुरखाओं’ का प्रयोग किया गया है।
theological_decisions:
- issue: मूर्तिपूजक धार्मिक सेवा का अनुवाद
  choice: दूसरे देवताओं की सेवा करते थे
  alternative: दूसरे देवताओं की उपासना करते थे
  rationale: עבד धार्मिक उपासना को समाहित कर सकता है, पर इसका अर्थ अधिक व्यापक रूप से सेवा और निष्ठा भी है; ‘सेवा’ उस व्यापकता को सुरक्षित रखती है।
- issue: אבות में लिंगसूचक पूर्वज-संबंध
  choice: तुम्हारे पुरखाओं
  alternative: तुम्हारे पूर्वजों
  rationale: ‘पुरखाओं’ से स्रोत का पुरुषवाचक संकेत बना रहता है और आधुनिक हिन्दी में यह सहज भी है।
- issue: अंतिम बलाघातपूर्ण कर्ता-सूची
  choice: न उन्होंने जाना था, न तुमने और न तुम्हारे पुरखाओं ने
  alternative: उन्होंने नहीं जाना था—उन्होंने, तुमने और तुम्हारे पुरखाओं ने
  rationale: चुना गया रूप हिब्रू की तीनों श्रेणियों और उनके बल को बनाए रखते हुए हिन्दी में भ्रमरहित है; पादटिप्पणी अधिक शब्दानुसार संरचना बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किन्तु गरिमापूर्ण शैली रखी गई है। ‘धूप जलाना’, ‘सेवा करना’ और ‘पुरखे’ सामान्य पाठक के लिए स्पष्ट हैं। डैश मूल वाक्य में बुराई के विशिष्ट रूप की व्याख्या को उभारता है।
