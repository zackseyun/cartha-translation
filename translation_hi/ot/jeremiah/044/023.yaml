base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/023.yaml
  text: Because you burned incense and sinned against Yahweh[a], and did not listen to the voice of Yahweh or walk in his law, his statutes, and his testimonies, therefore this disaster has come upon you[d][c][b], as it is this day.
translation:
  language: hi
  text: क्योंकि तुमने धूप जलाई[a] और यहोवा के विरुद्ध पाप किया, और यहोवा की वाणी नहीं सुनी[b] और न उसकी व्यवस्था[c], विधियों और साक्ष्यों के अनुसार चले, इसी कारण यह विपत्ति तुम पर आ पड़ी[d], जैसा आज है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “धूप चढ़ाई।” इब्रानी क्रिया बलि के रूप में धुआँ या धूप चढ़ाने को सूचित करती है।
    reason: lexical_alternative
  - marker: b
    text: या, “यहोवा की आज्ञा नहीं मानी।” शाब्दिक रूप से, “यहोवा की वाणी नहीं सुनी।”
    reason: lexical_alternative
  - marker: c
    text: '“व्यवस्था” का अनुवाद “शिक्षा” भी किया जा सकता है (इब्रानी: तोराह)।'
    reason: lexical_alternative
  - marker: d
    text: या, “यह अनर्थ तुम पर आ गया।” यहाँ इब्रानी शब्द का अर्थ नैतिक बुराई के बजाय विपत्ति या संकट है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפְּנֵי אֲשֶׁר
  choice: क्योंकि
  rationale: यह न्याय के कारण का परिचय देता है; आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: קִטַּרְתֶּם
  choice: तुमने धूप जलाई
  rationale: यह क्रिया बलि-संबंधी धुआँ या धूप चढ़ाने को सूचित करती है; प्रसंग में सीधा और स्वाभाविक अनुवाद।
- source_word: חֲטָאתֶם לַיהוָה
  choice: यहोवा के विरुद्ध पाप किया
  rationale: לַיהוָה यहाँ पाप के लक्ष्य को बताता है, इसलिए ‘के विरुद्ध’ उपयुक्त है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के व्यक्तिगत वाचा-नाम की प्रचलित लिप्यंतरण-परंपरा को सुरक्षित रखता है।
- source_word: שְׁמַעְתֶּם בְּקוֹל יְהוָה
  choice: यहोवा की वाणी नहीं सुनी
  rationale: मूल के ‘वाणी सुनना’ मुहावरे को बनाए रखता है; इसमें आज्ञापालन का आशय निहित है।
- source_word: וּבְתוֹרָתוֹ
  choice: उसकी व्यवस्था
  rationale: वाचागत कानूनी सूची में תּוֹרָה के लिए स्पष्ट और परिचित हिन्दी शब्द; ‘शिक्षा’ भी संभव है।
- source_word: וּבְחֻקֹּתָיו
  choice: विधियों
  rationale: חֻקּוֹת के वाचागत और नियामक अर्थ को संक्षेप में व्यक्त करता है।
- source_word: וּבְעֵדְוֹתָיו
  choice: साक्षियों
  rationale: עֵדוֹת की शाब्दिक विशिष्टता को व्यवस्था और विधियों से अलग रखता है।
- source_word: לֹא הֲלַכְתֶּם
  choice: के अनुसार चले
  rationale: ‘चलना’ आचरण के मूल रूपक को बचाता है, जबकि ‘के अनुसार’ हिन्दी में सूची के साथ स्वाभाविक संबंध बनाता है।
- source_word: עַל כֵּן
  choice: इसी कारण
  rationale: पूर्ववर्ती अपराधों और परिणाम के बीच स्पष्ट कारणात्मक संबंध दिखाता है।
- source_word: קָרָאת אֶתְכֶם הָרָעָה הַזֹּאת
  choice: यह विपत्ति तुम पर आ पड़ी
  rationale: רָעָה यहाँ नैतिक बुराई नहीं, दंडस्वरूप आई विपत्ति है; हिन्दी में घटना का भाव स्वाभाविक रूप से व्यक्त होता है।
- source_word: כַּיּוֹם הַזֶּה
  choice: जैसा आज दिखाई दे रहा है
  rationale: वर्तमान, प्रत्यक्ष दशा की ओर संकेत करने वाले इब्रानी मुहावरे का स्वाभाविक हिन्दी रूप।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: दोनों नाम के लिप्यंतरण हैं; ‘यहोवा’ साधारण हिन्दी पाठकों में अधिक परिचित है और पदवी से बदलने के बजाय व्यक्तिगत नाम को बनाए रखता है।
- issue: न्याय के प्रसंग में רָעָה का अर्थ
  choice: विपत्ति
  alternative: बुराई / अनर्थ
  rationale: यहाँ शब्द लोगों पर आए दंडात्मक संकट को सूचित करता है, नैतिक बुराई को नहीं; ‘विपत्ति’ इस अर्थ को बिना अतिरिक्त धर्मवैज्ञानिक निष्कर्ष के व्यक्त करता है।
- issue: ‘वाणी सुनने’ का आशय
  choice: वाणी नहीं सुनी
  alternative: आज्ञा नहीं मानी
  rationale: मुख्य पाठ मूल अभिव्यक्ति को सुरक्षित रखता है; पादटिप्पणी उसके आज्ञापालन-संबंधी आशय को स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘वाणी सुनना’ और ‘चलना’ जैसे मूल रूपक सुरक्षित हैं, पर वाक्य-संरचना हिन्दी के अनुरूप बनाई गई है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में क्रम से उपस्थित हैं।
