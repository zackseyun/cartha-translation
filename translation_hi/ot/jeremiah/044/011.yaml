id: JER.44.11
reference: Jeremiah 44:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּֽה אָמַ֞ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הִנְ/נִ֨י שָׂ֥ם פָּנַ֛/י בָּ/כֶ֖ם לְ/רָעָ֑ה וּ/לְ/הַכְרִ֖ית אֶת כָּל יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/011.yaml
  text: 'Therefore[a], this is what Yahweh of Armies, the God of Israel, says: Behold, I am setting my face against you for harm[b], to cut off all Judah.'
translation:
  language: hi
  text: 'इसलिए सेनाओं का याहवे[a], इस्राएल का परमेश्वर, यह कहता है: “देखो, मैं तुम्हारे विरुद्ध अपना मुख किए हुए हूँ—तुम पर विपत्ति लाने[b] और समूचे यहूदा का नाश करने के लिए।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सेनाओं का प्रभु।”
    reason: दिव्य नाम और पारंपरिक उपाधि का वैकल्पिक अनुवाद।
  - marker: b
    text: यहाँ “विपत्ति” का अर्थ न्याय के रूप में आने वाली आपदा या हानि है, नैतिक बुराई नहीं।
    reason: רָעָה के संदर्भगत अर्थ को स्पष्ट करना।
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले अभियोग से निकलने वाले निष्कर्ष को सहज और स्पष्ट हिंदी में व्यक्त करता है।
- source_word: כֹּה אָמַר
  choice: यह कहता है
  rationale: भविष्यद्वक्ताओं के संदेश-सूत्र की औपचारिकता बनाए रखते हुए यह आधुनिक हिंदी में स्वाभाविक है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का याहवे
  rationale: याहवे को व्यक्तिगत दिव्य नाम के रूप में लिप्यंतरित किया गया है और צְבָאוֹת का अर्थ पारदर्शी ढंग से ‘सेनाओं’ दिया गया है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल का परमेश्वर
  rationale: यह संबंधवाचक पदबंध का सीधा और प्रचलित हिंदी रूप है।
- source_word: הִנְנִי
  choice: देखो, मैं
  rationale: यह परमेश्वर के गंभीर और दृढ़ संकल्प की ओर ध्यान खींचने वाले बल को बनाए रखता है।
- source_word: שָׂם פָּנַי בָּכֶם
  choice: मैं तुम्हारे विरुद्ध अपना मुख कर रहा हूँ
  rationale: मूल रूपक को बनाए रखते हुए यह दृढ़ विरोध और न्याय की मुद्रा व्यक्त करता है।
- source_word: לְרָעָה
  choice: तुम पर विपत्ति लाने
  rationale: संदर्भ में רָעָה नैतिक बुराई नहीं, बल्कि दंडस्वरूप आने वाली हानि या आपदा है; ‘विपत्ति’ इस अर्थ को स्पष्ट रखती है।
- source_word: וּלְהַכְרִית
  choice: मिटा डालने
  rationale: हिफ़ील रूप के विनाशकारी और निर्णायक भाव को साधारण आधुनिक हिंदी में प्रभावी ढंग से व्यक्त करता है।
- source_word: כָּל יְהוּדָה
  choice: समूचे यहूदा
  rationale: यह संक्षिप्त सामूहिक अभिव्यक्ति को बनाए रखता है और उसे केवल भूभाग तक सीमित नहीं करता।
theological_decisions:
- issue: दिव्य उपाधि יְהוָה צְבָאוֹת का अनुवाद
  choice: सेनाओं का याहवे
  alternative: सेनाओं का प्रभु
  rationale: मूल में चार-अक्षरीय दिव्य नाम सीधे आया है; इसलिए उसे उपाधि ‘प्रभु’ से बदलने के बजाय ‘याहवे’ के रूप में लिप्यंतरित किया गया है। ‘सेनाओं’ से צְבָאוֹת का मूल बिंब भी सुरक्षित रहता है।
- issue: לְרָעָה में परमेश्वर द्वारा लाई जाने वाली ‘बुराई’ का आशय
  choice: विपत्ति
  alternative: अनिष्ट
  rationale: यहाँ आशय न्याय के रूप में आई आपदा या हानि है, परमेश्वर में नैतिक बुराई नहीं। ‘विपत्ति’ संदर्भगत अर्थ स्पष्ट करती है, जबकि दंड की कठोरता को कम नहीं करती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और भविष्यद्वाणी के गंभीर स्वर के अनुरूप रखी गई है। मूल का ‘मुख’ वाला रूपक सुरक्षित है; निर्णायक विनाश के लिए सहज हिंदी ‘मिटा डालने’ चुना गया है।
