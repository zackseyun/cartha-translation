  text: וּ/פָקַדְתִּ֗י עַ֤ל הַ/יּֽוֹשְׁבִים֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם כַּ/אֲשֶׁ֥ר פָּקַ֖דְתִּי עַל יְרֽוּשָׁלִָ֑ם בַּ/חֶ֥רֶב בָּ/רָעָ֖ב וּ/בַ/דָּֽבֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/013.yaml
  text: And I will punish those who dwell in the land of Egypt[a], just as I punished Jerusalem, with the sword, with famine[b], and with pestilence.
translation:
  language: hi
  text: और मैं मिस्र देश में रहने वालों को दण्ड दूँगा[a], ठीक वैसे ही जैसे मैंने यरूशलेम को दण्ड दिया था—तलवार, अकाल और महामारी[b] से।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं मिस्र देश में रहने वालों के विरुद्ध न्याय करूँगा ... जैसे मैंने यरूशलेम के विरुद्ध न्याय किया था।” इब्रानी क्रिया פקד का अर्थ किसी पर ध्यान देना, भेंट करना, या न्याय के संदर्भ में दण्ड देना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “महामारी” का अनुवाद “प्लेग” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָקַדְתִּי ... פָּקַדְתִּי
  choice: दण्ड दूँगा ... दण्ड दिया था
  rationale: פקד का अर्थ-क्षेत्र व्यापक है, पर यहाँ तलवार, अकाल और महामारी के न्याय-संदर्भ में दण्ड देने का भाव प्रमुख है। दोनों प्रयोगों का एक समान अनुवाद तुलना को स्पष्ट रखता है।
- source_word: עַל הַיּוֹשְׁבִים
  choice: रहनेवालों को
  rationale: ישב का कृदन्त यहाँ निवास करनेवाले लोगों को सूचित करता है; हिन्दी में यह स्वाभाविक और स्पष्ट है। עַל को दण्ड देना क्रिया के कर्म-चिह्न ‘को’ में समाहित किया गया है।
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: मिस्र देश में
  rationale: यह इब्रानी के ‘मिस्र के देश में’ को निकटता से व्यक्त करते हुए आधुनिक हिन्दी में सहज है।
- source_word: כַּאֲשֶׁר
  choice: ठीक वैसे ही जैसे
  rationale: यह मिस्र पर आनेवाले न्याय और यरूशलेम पर हो चुके न्याय के बीच स्पष्ट तुलना को बनाए रखता है।
- source_word: בַּחֶרֶב בָּרָעָב וּבַדָּבֶר
  choice: तलवार, अकाल और महामारी से
  rationale: בְּ यहाँ साधन का बोध देता है। तीनों संज्ञाओं के साथ एक बार ‘से’ लगाना हिन्दी में स्वाभाविक है और मूल की त्रिपदी न्याय-सूची सुरक्षित रखता है।
- source_word: דֶּבֶר
  choice: महामारी
  rationale: भविष्यद्वाणी के न्याय-संदर्भों में यह संक्रामक महामारी अथवा व्यापक रोग-मृत्यु को दर्शाता है; ‘महामारी’ वर्तमान हिन्दी में स्पष्ट है।
theological_decisions:
- issue: פקד में ईश्वरीय न्याय की अभिव्यक्ति
  choice: 'स्पष्ट दण्डात्मक अर्थ: ‘दण्ड दूँगा’'
  alternative: ‘लेखा लूँगा’ या ‘न्याय करने आऊँगा’
  rationale: तलवार, अकाल और महामारी का निकट संदर्भ दण्डात्मक अर्थ को पुष्ट करता है। फिर भी शब्द के व्यापक ‘ध्यान देना/भेंट करना’ अर्थ-क्षेत्र को पादटिप्पणी में बताया गया है, ताकि वास्तविक शब्दार्थ-विस्तार न खोए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली रखी गई है। ‘दण्ड’ न्याय की गंभीरता व्यक्त करता है; ‘सज़ा’ की अपेक्षा यह बाइबिलीय साहित्यिक संदर्भ में अधिक उपयुक्त है। विराम-चिह्न द्वारा न्याय के तीन साधनों को यरूशलेम के दण्ड से स्पष्ट रूप से जोड़ा गया है।
