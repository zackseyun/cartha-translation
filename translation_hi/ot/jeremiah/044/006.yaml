source:
  edition: WLC
  text: וַ/תִּתַּ֤ךְ חֲמָתִ/י֙ וְ/אַפִּ֔/י וַ/תִּבְעַר֙ בְּ/עָרֵ֣י יְהוּדָ֔ה וּ/בְ/חֻצ֖וֹת יְרֽוּשָׁלִָ֑ם וַ/תִּהְיֶ֛ינָה לְ/חָרְבָּ֥ה לִ/שְׁמָמָ֖ה כַּ/יּ֥וֹם הַ/זֶּֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/006.yaml
  text: So my wrath and my anger were poured out and burned in the cities of Judah and in the streets of Jerusalem[a], and they became a ruin and a desolation, as they are this day.
translation:
  language: hi
  text: तब मेरा प्रकोप और मेरा क्रोध उँडेल दिए गए और यहूदा के नगरों और यरूशलेम की सड़कों[a] में भड़क उठे; और वे उजाड़ और वीरान हो गए, जैसे आज हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘चौकों’ अथवा ‘खुले स्थानों’।
    reason: חֻצוֹת के संभावित अर्थों—सड़कें, चौक, खुले स्थान—को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: וַתִּתַּךְ
  choice: उँडेल दिया गया
  rationale: निष्क्रिय रूप और दैवी क्रोध के उँडेले जाने का ठोस रूपक सुरक्षित रखता है। हिब्रू क्रिया एकवचन है और निकटवर्ती संयुक्त भाव को समष्टि के रूप में प्रस्तुत करती है, इसलिए हिन्दी में एकवचन निष्क्रिय रूप स्वाभाविक है।
- source_word: חֲמָתִי וְאַפִּי
  choice: मेरी जलजलाहट और मेरा क्रोध
  rationale: חֵמָה की दहकती प्रचंडता के लिए ‘जलजलाहट’ और אַף के रूढ़ार्थ के लिए ‘क्रोध’ चुना गया है; इससे समानांतर लेकिन अलग शब्द बने रहते हैं।
- source_word: וַתִּבְעַר
  choice: भड़क उठा
  rationale: בער के जलने या धधकने के रूपक को बनाए रखता है। हिन्दी में निकटतम संयुक्त कर्ता ‘क्रोध’ के अनुसार पुल्लिंग एकवचन स्वाभाविक है, जबकि दोनों भावों का प्रभाव अभिप्रेत है।
- source_word: בְּעָרֵי יְהוּדָה
  choice: यहूदा के नगरों में
  rationale: בְ को स्थानसूचक ‘में’ के रूप में और construct phrase को सीधे, स्वाभाविक हिन्दी में प्रस्तुत करता है।
- source_word: וּבְחֻצוֹת יְרוּשָׁלִָם
  choice: और यरूशलेम की सड़कों में
  rationale: חֻצוֹת के सामान्य प्रसंगानुकूल अर्थ ‘सड़कें’ को मुख्य पाठ में रखा गया है; ‘चौक’ या ‘खुले स्थान’ की संभावना पादटिप्पणी में सुरक्षित है।
- source_word: וַתִּהְיֶינָה
  choice: और वे ... हो गए
  rationale: स्त्रीलिंग बहुवचन क्रिया पूर्वोक्त नगरीय जगहों की सामूहिक परिणति दिखाती है। हिन्दी का बहुवचन ‘वे’ इस संदर्भ को स्पष्ट रखता है।
- source_word: לְחָרְבָּה לִשְׁמָמָה
  choice: उजाड़ और वीरान
  rationale: दोनों निकटार्थी शब्दों को स्वाभाविक हिन्दी युग्म से व्यक्त किया गया है; पहला ध्वंस की दशा और दूसरा निर्जनता को उभारता है।
- source_word: כַּיּוֹם הַזֶּה
  choice: जैसे आज हैं
  rationale: वर्तमान, प्रत्यक्ष दशा की ओर संकेत करने वाले मुहावरे को संक्षिप्त आधुनिक हिन्दी में रखा गया है और बहुवचन संदर्भ बनाए रखा गया है।
theological_decisions:
- issue: दैवी न्याय की रूपकात्मक भाषा
  choice: ‘जलजलाहट’, ‘क्रोध’, ‘उँडेल दिया गया’ और ‘भड़क उठा’ जैसे ठोस शब्द बनाए रखे गए।
  alternative: इसे व्याख्यात्मक रूप से ‘दण्ड आया’ या ‘न्याय हुआ’ कहना।
  rationale: मूल पाठ परमेश्वर के व्यक्तिगत और सक्रिय न्याय को उँडेलने तथा जलने के रूपकों में व्यक्त करता है; उसे नरम या अमूर्त नहीं किया गया।
- issue: अंतिम बहुवचन क्रिया का संदर्भ
  choice: ‘वे ... हो गए, जैसे आज हैं’ को पूर्वोक्त नगरों और यरूशलेम की जगहों पर सामूहिक रूप से लागू किया गया।
  alternative: निर्वैयक्तिक एकवचन ‘वह उजाड़ हो गया, जैसा आज है’।
  rationale: हिब्रू की स्त्रीलिंग बहुवचन क्रिया अनेक स्थान-संज्ञाओं की ओर स्वाभाविक रूप से लौटती है; हिन्दी में बहुवचन रखने से यह संबंध बना रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भविष्यद्वक्ताओं की वाणी के अनुरूप गरिमामय और सशक्त शैली। ‘जलजलाहट’ बाइबलीय हिन्दी में परिचित है और חֵמָה की दहकती तीव्रता को ‘क्रोध’ से अलग बनाए रखती है।
