  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/מִן אָ֡ז חָדַ֜לְנוּ לְ/קַטֵּ֨ר לִ/מְלֶ֧כֶת הַ/שָּׁמַ֛יִם וְ/הַסֵּֽךְ לָ֥/הּ נְסָכִ֖ים חָסַ֣רְנוּ כֹ֑ל וּ/בַ/חֶ֥רֶב וּ/בָ/רָעָ֖ב תָּֽמְנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/018.yaml
  text: But from the time we stopped burning incense to the Queen of Heaven and pouring out drink offerings to her[a], we have lacked everything[c][b], and we have been consumed by the sword and by famine.
translation:
  language: hi
  text: परन्तु जब से हमने आकाश की रानी[a] के लिए धूप जलाना और उसके लिए पेय-भेंट उंडेलना छोड़ दिया, तब से हमें हर चीज़ की कमी रही है, और हम तलवार और अकाल से नष्ट हो गए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह उन लोगों द्वारा पूजी गई देवी की उपाधि है।
    reason: cultural_note
lexical_decisions:
- source_word: וּמִן אָז
  choice: परन्तु जब से ... तब से
  rationale: यह वाक्य को पिछले कथन से विरोधात्मक ढंग से जोड़ते हुए समय के आरम्भ-बिंदु को स्पष्ट करता है; स्वाभाविक हिन्दी के लिए सहसंबंधी ‘जब से ... तब से’ प्रयोग किया गया है।
- source_word: חָדַלְנוּ
  choice: हमने ... छोड़ दिया
  rationale: क्रिया का अर्थ किसी कार्य को बन्द करना या उससे विरत होना है; ‘छोड़ दिया’ आधुनिक हिन्दी में सहज है।
- source_word: לְקַטֵּר
  choice: धूप जलाना
  rationale: इस उपासना-सन्दर्भ में क्रिया धूप अथवा धूम-बलि जलाने को सूचित करती है; ‘धूप जलाना’ स्पष्ट और प्रचलित अभिव्यक्ति है।
- source_word: לִמְלֶכֶת הַשָּׁמַיִם
  choice: आकाश की रानी
  rationale: यहाँ यह लोगों द्वारा पूजी गई एक देवी की उपाधि है। ‘आकाश की रानी’ मूल पदवी को सीधे रखता है और बाद की धार्मिक धारणाएँ नहीं जोड़ता।
- source_word: וְהַסֵּךְ לָהּ נְסָכִים
  choice: उसके लिए अर्घ चढ़ाना
  rationale: मूल में देवी के लिए पेय-भेंट उँडेलने की अनुष्ठानिक क्रिया है। ‘अर्घ चढ़ाना’ हिन्दी में द्रव-भेंट के धार्मिक कार्य को स्वाभाविक और संक्षिप्त रूप से व्यक्त करता है।
- source_word: חָסַרְנוּ כֹל
  choice: हमें हर चीज़ की कमी रही है
  rationale: यह व्यापक अभाव को व्यक्त करता है और मूल के ‘सब कुछ/हर चीज़’ के बल को बनाए रखता है।
- source_word: וּבַחֶרֶב וּבָרָעָב
  choice: तलवार और अकाल से
  rationale: पूर्वसर्ग विनाश के साधन अथवा परिस्थिति को दर्शाता है; हिन्दी में ‘से’ दोनों के साथ स्वाभाविक रूप से लागू होता है।
- source_word: תָּמְנוּ
  choice: हम ... नष्ट हो गए हैं
  rationale: क्रिया समाप्त, चुक या विनष्ट हो जाने का भाव देती है। ‘नष्ट हो गए हैं’ तलवार और अकाल के परिणाम को स्पष्ट करता है, जबकि शब्द की सम्भव अर्थ-सीमा को टिप्पणी में रखा जा सकता है।
theological_decisions:
- issue: מְלֶכֶת הַשָּׁמַיִם की मूर्तिपूजक उपाधि का अनुवाद
  choice: आकाश की रानी
  alternative: आकाशमण्डल की रानी
  rationale: पद को यहाँ वक्ताओं द्वारा पूजी गई देवी की उपाधि के रूप में रखा गया है। अनुवाद न तो इसे किसी बाद की मसीही उपाधि से जोड़ता है, न देवी की पहचान को मूल से अधिक निश्चित करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। अनुष्ठानिक נְסָכִים के लिए ‘अर्घ’ चुना गया है, जो द्रव-भेंट का संकेत देता है; देवी की विशिष्ट ऐतिहासिक पहचान पाठ में आरोपित नहीं की गई।
