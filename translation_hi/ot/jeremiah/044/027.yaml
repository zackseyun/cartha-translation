  text: הִנְ/נִ֨י שֹׁקֵ֧ד עֲלֵי/הֶ֛ם לְ/רָעָ֖ה וְ/לֹ֣א לְ/טוֹבָ֑ה וְ/תַמּוּ֩ כָל אִ֨ישׁ יְהוּדָ֜ה אֲשֶׁ֧ר בְּ/אֶֽרֶץ מִצְרַ֛יִם בַּ/חֶ֥רֶב וּ/בָ/רָעָ֖ב עַד כְּלוֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/027.yaml
  text: Behold[a], I am watching over them for harm and not for good, and every man of Judah who is in the land of Egypt will come to an end by the sword and by famine[c][b], until they are consumed.
translation:
  language: hi
  text: देखो, मैं उनकी भलाई के लिए नहीं, बल्कि उनकी हानि[a] के लिए उन पर नज़र रखे हुए हूँ। यहूदा का हर पुरुष, जो मिस्र देश में रहता है, तलवार और अकाल से समाप्त हो जाएगा, जब तक कि वे सब पूरी तरह नष्ट न हो जाएँ[c][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘हानि’ का अनुवाद ‘विपत्ति’ या ‘अनिष्ट’ भी हो सकता है; यहाँ इब्रानी शब्द नैतिक बुराई नहीं, बल्कि दंड से आनेवाली हानि को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘यहूदा का हर पुरुष’; इब्रानी में पुल्लिंग एकवचन अभिव्यक्ति का प्रयोग वितरणात्मक अर्थ में हुआ है।
    reason: lexical_alternative
  - marker: c
    text: या, ‘जब तक उनका पूरा अंत न हो जाए।’
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: देखो
  rationale: यह शब्द गंभीर ईश्वरीय घोषणा की ओर ध्यान खींचता है; आधुनिक हिन्दी में ‘देखो’ स्वाभाविक रहते हुए भविष्यद्वाणी की गंभीरता बनाए रखता है।
- source_word: שֹׁקֵד עֲלֵיהֶם
  choice: उन पर नज़र रखे हुए हूँ
  rationale: שׁקד निरंतर जागरूक और उद्देश्यपूर्ण निगरानी बताता है। ‘नज़र रखे हुए हूँ’ उसके सक्रिय, जारी पक्ष को व्यक्त करता है; निर्णय का प्रतिकूल उद्देश्य अगले वाक्यांश से स्पष्ट होता है।
- source_word: לְרָעָה וְלֹא לְטוֹבָה
  choice: उनकी भलाई के लिए नहीं, बल्कि उनकी हानि के लिए
  rationale: यहाँ רָעָה नैतिक बुराई नहीं, बल्कि हानिकारक परिणाम या दंडजनित विपत्ति को दर्शाता है। हिन्दी का विरोधात्मक क्रम अर्थ को स्पष्ट और स्वाभाविक बनाता है।
- source_word: וְתַמּוּ
  choice: समाप्त हो जाएगा
  rationale: תמם का भाव अंत तक पहुँचने या समाप्त हो जाने का है। यह चयन निकटवर्ती अंतिम उपवाक्य की पूर्ण विनाश की तीव्रता को समय से पहले नहीं दोहराता।
- source_word: כָל אִישׁ יְהוּדָה
  choice: यहूदा का हर पुरुष
  rationale: मूल में पुल्लिंग एकवचन איש का वितरणात्मक प्रयोग है। ‘हर पुरुष’ उसी व्याकरणिक रूप और एक-एक व्यक्ति पर लागू व्यापकता को बनाए रखता है।
- source_word: אֲשֶׁר בְּאֶרֶץ מִצְרַיִם
  choice: मिस्र देश में रहनेवाला
  rationale: यह ‘मिस्र देश में जो है’ का स्वाभाविक हिन्दी रूप है और मिस्र की भूमि का पूरा भौगोलिक संकेत बनाए रखता है।
- source_word: בַּחֶרֶב וּבָרָעָב
  choice: तलवार और अकाल से
  rationale: यह यिर्मयाह में प्रचलित दंड-सूत्र का स्पष्ट और संक्षिप्त हिन्दी रूप है तथा साधनसूचक अर्थ सुरक्षित रखता है।
- source_word: עַד כְּלוֹתָם
  choice: जब तक कि वे सब पूरी तरह नष्ट न हो जाएँ
  rationale: כלה का यह रूप समूह के पूर्ण क्षय या विनाश को व्यक्त करता है। ‘वे सब’ बहुवचन प्रत्यय को और ‘पूरी तरह’ परिणति की पूर्णता को स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय न्याय के संदर्भ में רָעָה का अर्थ
  choice: हानि
  alternative: बुराई; विपत्ति; अनिष्ट
  rationale: संदर्भ में यह नैतिक बुराई करने का दावा नहीं, बल्कि न्याय के हानिकारक या विपत्तिजनक परिणाम को बताता है। ‘हानि’ भलाई के साथ मूल विरोध को भी सुरक्षित रखता है।
- issue: כָל אִישׁ יְהוּדָה का लिंग और वितरणात्मक बल
  choice: यहूदा का हर पुरुष
  alternative: यहूदा का हर व्यक्ति; यहूदा के सभी पुरुष
  rationale: मूल का पुल्लिंग एकवचन वितरणात्मक है। चुना हुआ रूप उसे लिंग-निरपेक्ष बनाए बिना प्रत्येक संबंधित पुरुष पर लागू निर्णय को व्यक्त करता है।
- issue: תמם और כלה के निकटवर्ती अंत-सूचक भाव
  choice: समाप्त हो जाएगा ... पूरी तरह नष्ट न हो जाएँ
  alternative: नष्ट हो जाएगा ... उनका अंत हो जाए
  rationale: दोनों क्रियाओं के बीच कुछ शब्दगत भेद रखते हुए मूल की बढ़ती हुई अंतिमता सुरक्षित की गई है; इससे न्याय की व्यापकता न तो घटती है, न उससे आगे कोई निष्कर्ष जोड़ा जाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गंभीर, भविष्यद्वाणी-संगत किंतु सामान्य पाठक के लिए सुबोध रूप अपनाया गया है। ‘देखो’ उद्घोषणा की गंभीरता रखता है; वाक्य-विन्यास हिन्दी की स्वाभाविक विरोधात्मक संरचना के अनुसार है।
