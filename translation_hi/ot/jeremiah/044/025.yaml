source:
  edition: WLC
  text: כֹּֽה אָמַ֣ר יְהוָֽה צְבָאוֹת֩ אֱלֹהֵ֨י יִשְׂרָאֵ֜ל לֵ/אמֹ֗ר אַתֶּ֨ם וּ/נְשֵׁי/כֶ֜ם וַ/תְּדַבֵּ֣רְנָה בְּ/פִי/כֶם֮ וּ/בִ/ידֵי/כֶ֣ם מִלֵּאתֶ֣ם לֵ/אמֹר֒ עָשֹׂ֨ה נַעֲשֶׂ֜ה אֶת נְדָרֵ֗י/נוּ אֲשֶׁ֤ר נָדַ֨רְנוּ֙ לְ/קַטֵּר֙ לִ/מְלֶ֣כֶת הַ/שָּׁמַ֔יִם וּ/לְ/הַסֵּ֥ךְ לָ֖/הּ נְסָכִ֑ים הָקֵ֤ים תָּקִ֨ימְנָה֙ אֶת נִדְרֵי/כֶ֔ם וְ/עָשֹׂ֥ה תַעֲשֶׂ֖ינָה אֶת נִדְרֵי/כֶֽם־־׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/025.yaml
  text: 'Thus says the LORD of hosts, the God of Israel: You and your wives have spoken with your mouths and fulfilled it with your hands, saying, ‘We will surely carry out our vows that we have vowed, to burn incense to the Queen of Heaven and to pour out drink offerings to her.’ Go ahead, confirm your vows and carry out your vows.'
translation:
  language: hi
  text: 'सेनाओं का यहोवा, इस्राएल का परमेश्वर, यह कहता है: “तुम और तुम्हारी पत्नियों ने अपने मुँह से कहा और अपने हाथों से उसे पूरा किया, यह कहते हुए, ‘जो मन्नतें हमने मानी हैं, उन्हें हम अवश्य पूरा करेंगे—आकाश की रानी के लिए धूप जलाएँगे और उसके लिए पेय-बलियाँ उंडेलेंगे।’ तुम स्त्रियो, अपनी मन्नतों को निश्चय ही पूरा करो, और अपनी मन्नतों को पूरा करो!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का यहोवा
  rationale: ईश्वरीय नाम और צְבָאוֹת के सैन्य/स्वर्गीय समूहों से जुड़े व्यापक अर्थ को पारंपरिक, संक्षिप्त रूप में बनाए रखता है।
- source_word: נְדָרֵינוּ
  choice: हमने जो मन्नतें मानी हैं
  rationale: נדר के लिए आधुनिक हिन्दी का स्वाभाविक धार्मिक मुहावरा; संज्ञा और क्रिया की इब्रानी पुनरुक्ति का भाव बनाए रखता है।
- source_word: לְקַטֵּר
  choice: धूप जलाएँगे
  rationale: पंथीय संदर्भ में धूप अर्पित करने के अर्थ को सामान्य पाठक के लिए स्पष्ट और स्वाभाविक बनाता है।
- source_word: לִמְלֶכֶת הַשָּׁמַיִם
  choice: आकाश की रानी
  rationale: उपाधि का सीधा अनुवाद है; संबंधित देवी की पहचान को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: לְהַסֵּךְ לָהּ נְסָכִים
  choice: उसके लिए पेय-बलियाँ उंडेलेंगे
  rationale: נסכים के अनुष्ठानिक पेय-अर्पण और נסך की उंडेलने की क्रिया, दोनों को व्यक्त करता है।
- source_word: הָקֵים תָּקִימְנָה ... וְעָשֹׂה תַעֲשֶׂינָה
  choice: अपनी मन्नतें दृढ़ता से निभाओ और उन्हें अवश्य पूरा करो
  rationale: दोनों emphatic infinitive-absolute constructions की तीव्रता और समानांतरता को स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: अंतिम आज्ञाओं का भाव
  choice: “तो अब ... निभाओ ... अवश्य पूरा करो!”
  alternative: इसे परमेश्वर की वास्तविक स्वीकृति के रूप में नरम कर देना
  rationale: संदर्भ में वचन व्यंग्यात्मक/न्यायसूचक चुनौती है। अनुवाद आज्ञात्मक तीखापन रखता है, पर व्याख्या को मुख्य पाठ में स्पष्ट रूप से आरोपित नहीं करता।
- issue: आकाश की रानी की पहचान
  choice: केवल उपाधि “आकाश की रानी”
  alternative: किसी विशिष्ट प्राचीन देवी का नाम जोड़ना
  rationale: इब्रानी पाठ देवी का निजी नाम नहीं देता; इसलिए वास्तविक ऐतिहासिक पहचान की अनिश्चितता सुरक्षित रखी गई है।
- issue: दूसरे पुरुष के लिंग-रूप
  choice: समूह को “तुमने और तुम्हारी पत्नियों ने” कहकर संबोधित करना
  alternative: अंतिम वाक्य को केवल स्त्रियों के लिए स्पष्ट कर देना
  rationale: इब्रानी में आरंभिक संबोधन मिश्रित समूह का है, जबकि कुछ क्रियारूप स्त्रीलिंग बहुवचन हैं। हिन्दी में अस्पष्टता को अनावश्यक रूप से केवल स्त्रियों तक सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा गरिमापूर्ण पर सहज है। “मन्नतें मानना/निभाना,” “धूप जलाना,” और “पेय-बलियाँ उंडेलना” सामान्य समझ और अनुष्ठानिक सटीकता के बीच संतुलन रखते हैं।
