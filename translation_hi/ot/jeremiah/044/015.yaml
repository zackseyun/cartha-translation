  text: וַ/יַּעֲנ֣וּ אֶֽת יִרְמְיָ֗הוּ כָּל הָ/אֲנָשִׁ֤ים הַ/יֹּֽדְעִים֙ כִּֽי מְקַטְּר֤וֹת נְשֵׁי/הֶם֙ לֵ/אלֹהִ֣ים אֲחֵרִ֔ים וְ/כָל הַ/נָּשִׁ֥ים הָ/עֹמְד֖וֹת קָהָ֣ל גָּד֑וֹל וְ/כָל הָ/עָ֛ם הַ/יֹּשְׁבִ֥ים בְּ/אֶֽרֶץ מִצְרַ֖יִם בְּ/פַתְר֥וֹס לֵ/אמֹֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/015.yaml
  text: Then all the men who knew that their wives were burning incense to other gods[a], and all the women who were standing by—a great assembly—and all the people who were living in the land of Egypt, in Pathros, answered Jeremiah, saying,
translation:
  language: hi
  text: 'तब उन सभी पुरुषों ने, जो जानते थे कि उनकी पत्नियाँ दूसरे देवताओं के लिए धूप जला रही थीं, और वहाँ खड़ी सभी स्त्रियों ने[a]—जो एक बड़ी सभा थी—और मिस्र देश में, पत्रोस में रहने वाले सभी लोगों ने यिर्मयाह को उत्तर दिया और कहा,


    [a] इब्रानी में शाब्दिक अर्थ “खड़ी सभी स्त्रियाँ” है; “वहाँ” प्रसंग से स्पष्ट होता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ “खड़ी सभी स्त्रियाँ” है; “वहाँ” प्रसंग से स्पष्ट होता है।
    reason: “वहाँ” को स्पष्ट रूप से प्रसंगगत पूर्ति बताने और इब्रानी कृदंत की शाब्दिकता सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: उत्तर देते हुए कहा
  rationale: ענה यहाँ यिर्मयाह को दिए गए प्रत्युत्तर का परिचय देता है; साथ का לֵאמֹר हिन्दी में स्वाभाविक रूप से “उत्तर देते हुए कहा” में व्यक्त होता है।
- source_word: כָּל הָאֲנָשִׁים
  choice: उन सभी पुरुषों
  rationale: यहाँ אֲנָשִׁים पुरुषों को सूचित करता है, क्योंकि उनकी पत्नियों का उल्लेख है और स्त्रियों का समूह अलग से बताया गया है।
- source_word: הַיֹּדְעִים
  choice: जो जानते थे
  rationale: कृदंत उन पुरुषों की पहचान करता है जिन्हें अपनी पत्नियों के कार्य का ज्ञान था।
- source_word: מְקַטְּרוֹת
  choice: धूप जला रही थीं
  rationale: पिएल रूप קטר उपासना में धूप जलाने या चढ़ाने के लिए प्रयुक्त होता है; यह चयन क्रिया और धार्मिक संदर्भ दोनों को स्पष्ट रखता है।
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: दूसरे देवताओं के लिए
  rationale: पूर्वसर्ग ל यहाँ धूप अर्पित किए जाने की दिशा या उद्देश्य बताता है; हिन्दी में “के लिए” स्वाभाविक है।
- source_word: וְכָל הַנָּשִׁים הָעֹמְדוֹת
  choice: और वहाँ खड़ी सभी स्त्रियों ने
  rationale: עמד का कृदंत स्त्रियों की घटनास्थल पर खड़ी उपस्थिति बताता है; “वहाँ” प्रसंगगत है और पादटिप्पणी में शाब्दिक रूप दिया गया है।
- source_word: קָהָל גָּדוֹל
  choice: जो एक बड़ी सभा थी
  rationale: קָהָל संगठित या एकत्र समुदाय को दर्शाता है; निकटतम पूर्ववर्ती स्त्री-समूह के साथ इसका संबंध रखते हुए हिन्दी वाक्य स्पष्ट किया गया है।
- source_word: וְכָל הָעָם
  choice: और ... सभी लोगों ने
  rationale: עָם व्यापक जनसमूह को दर्शाता है, जो पहले विशेष रूप से उल्लिखित पुरुषों और स्त्रियों के बाद आता है।
- source_word: הַיֹּשְׁבִים
  choice: रहने वाले
  rationale: भौगोलिक संदर्भ में ישׁב का अर्थ निवास करना है; आधुनिक हिन्दी में “रहने वाले” सहज है।
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: मिस्र देश में
  rationale: “देश” को बनाए रखने से אֶרֶץ की औपचारिक भौगोलिक अभिव्यक्ति सुरक्षित रहती है।
- source_word: בְּפַתְרוֹס
  choice: पथरोस में
  rationale: स्थान-नाम का इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: לֵאמֹר
  choice: कहा
  rationale: यह अगले पद में आने वाले प्रत्यक्ष कथन का परिचय देता है; हिन्दी में पूर्ववर्ती “उत्तर देते हुए” के साथ “कहा” स्वाभाविक है।
theological_decisions:
- issue: “बड़ी सभा” का व्याकरणिक संबंध
  choice: इसे निकटवर्ती स्त्रियों के समूह का समानाधिकरण माना गया है।
  alternative: इसे पूरे एकत्र जनसमूह का वर्णन माना जा सकता है।
  rationale: इब्रानी शब्दक्रम קָהָל גָּדוֹל को “खड़ी सभी स्त्रियों” के तुरंत बाद रखता है; इसलिए निकटवर्ती संबंध सबसे सीधा है, यद्यपि व्यापक समूह-संदर्भ पूर्णतः असंभव नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सहज कथात्मक रूप अपनाया गया है। लंबे इब्रानी वाक्य की समांतर सूची को बनाए रखा गया है और डैश से “एक बड़ी सभा” का समानाधिकरण स्पष्ट किया गया है।
