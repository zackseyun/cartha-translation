base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/020.yaml
  text: Then Jeremiah said to all the people—to the men[a], to the women, and to all the people who were answering him, saying,
translation:
  language: hi
  text: 'तब यिर्मयाह ने सभी लोगों से—पुरुषों से, स्त्रियों से, और उन सभी लोगों से जो उसे उत्तर दे रहे थे[a]—कहा:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘उत्तर देना’ के साथ ‘बात/शब्द’ भी है; इसका अर्थ है, ‘जो उसे उत्तर दे रहे थे।’
    reason: इब्रानी की संक्षिप्त अभिव्यक्ति में דָּבָר (‘बात/शब्द’) को दर्शाता है, बिना हिन्दी में भ्रामक या असहज शब्दशः अनुवाद किए।
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... कहा
  rationale: वाव-क्रमवाचक कथा को आगे बढ़ाता है; ‘तब’ हिन्दी में घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יִרְמְיָהוּ
  choice: यिर्मयाह
  rationale: भविष्यद्वक्ता के नाम का हिन्दी बाइबलीय रूप।
- source_word: אֶל כָּל הָעָם
  choice: सभी लोगों से
  rationale: אֶל के संबोधनात्मक अर्थ और עָם के सामूहिक अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: עַל הַגְּבָרִים וְעַל הַנָּשִׁים
  choice: पुरुषों, स्त्रियों ... से
  rationale: यहाँ עַל पहले उल्लिखित श्रोताओं का विस्तार करता है; दोहराया हुआ ‘से’ हिन्दी में संबोधित समूहों को स्पष्ट करता है।
- source_word: וְעַל כָּל הָעָם
  choice: और उन सभी लोगों से
  rationale: इब्रानी की पुनरावृत्ति और व्यापक श्रोता-समूह को बनाए रखा गया है; ‘उन’ से वाक्य का संबंध स्पष्ट होता है।
- source_word: הָעֹנִים אֹתוֹ דָּבָר
  choice: जो उसे उत्तर दे रहे थे[a]
  rationale: वर्तमान कृदंत की जारी क्रिया को ‘दे रहे थे’ से व्यक्त किया गया है। דָּבָר का शाब्दिक रूप मुख्य पाठ में जोड़ना हिन्दी में अनावश्यक और असहज होता, इसलिए उसकी सघन इब्रानी अभिव्यक्ति पादटिप्पणी में दी गई है।
- source_word: לֵאמֹר
  choice: 'कहा:'
  rationale: यह पद अगले पद के प्रत्यक्ष कथन का परिचय देता है; हिन्दी में ‘कहा:’ वही कार्य स्वाभाविक ढंग से करता है और अनावश्यक ‘कहते हुए’ से बचता है।
