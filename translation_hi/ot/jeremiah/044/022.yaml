  text: וְ/לֹֽא יוּכַל֩ יְהוָ֨ה ע֜וֹד לָ/שֵׂ֗את מִ/פְּנֵי֙ רֹ֣עַ מַעַלְלֵי/כֶ֔ם מִ/פְּנֵ֥י הַ/תּוֹעֵבֹ֖ת אֲשֶׁ֣ר עֲשִׂיתֶ֑ם וַ/תְּהִ֣י אַ֠רְצְ/כֶם לְ/חָרְבָּ֨ה וּ/לְ/שַׁמָּ֧ה וְ/לִ/קְלָלָ֛ה מֵ/אֵ֥ין יוֹשֵׁ֖ב כְּ/הַ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/022.yaml
  text: And Yahweh could no longer bear it because of the evil of your deeds[a], because of the abominations that you committed. So your land became a ruin, a desolation, and a curse, without inhabitant[c][b], as it is this day.
translation:
  language: hi
  text: तुम्हारे बुरे कामों और उन घिनौने कामों के कारण जो तुमने किए हैं, यहोवा अब और सह न सका। इसलिए तुम्हारा देश उजाड़, वीरान[a] और शाप का विषय[b] हो गया, जिसमें कोई निवासी नहीं है, जैसा कि आज है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “वीरान” का अर्थ यहाँ “भय या विस्मय का विषय” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात ऐसा उदाहरण जिसका नाम लेकर लोग शाप दें।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के वाचा-सूचक नाम की प्रचलित और स्पष्ट लिप्यंतरण परंपरा को अपनाता है।
- source_word: וְלֹא יוּכַל ... עוֹד לָשֵׂאת
  choice: इसे और सह न सका
  rationale: इब्रानी मुहावरे का अर्थ सहने या बर्दाश्त करने की सीमा समाप्त होना है; ‘इसे’ हिन्दी में स्वाभाविकता के लिए जोड़ा गया है और आगे के कारण-वाक्यांश उसका संदर्भ स्पष्ट करते हैं।
- source_word: מִפְּנֵי רֹעַ מַעַלְלֵיכֶם
  choice: तुम्हारे बुरे कामों के कारण
  rationale: कारणसूचक מִפְּנֵי और कर्मों की नैतिक बुराई, दोनों को सरल आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הַתּוֹעֵבוֹת אֲשֶׁר עֲשִׂיתֶם
  choice: तुम्हारे द्वारा किए गए घिनौने कामों
  rationale: תּוֹעֵבוֹת की तीव्र नैतिक और धार्मिक घृणास्पदता बनाए रखता है, जबकि हिन्दी में सहज रहता है।
- source_word: וַתְּהִי אַרְצְכֶם
  choice: इसलिए तुम्हारा देश ... हो गया
  rationale: वाव-क्रम से प्रकट परिणाम को हिन्दी में ‘इसलिए’ द्वारा स्पष्ट किया गया है।
- source_word: לְחָרְבָּה
  choice: उजाड़
  rationale: देश की बरबाद और निर्जन दशा को संक्षिप्त, प्रचलित हिन्दी में व्यक्त करता है।
- source_word: וּלְשַׁמָּה
  choice: वीरान
  rationale: मुख्य संदर्भ में विनाश और निर्जनता का भाव प्रमुख है; भय या विस्मय का संभावित अर्थ पादटिप्पणी में रखा गया है।
- source_word: וְלִקְלָלָה
  choice: शाप का विषय
  rationale: सिर्फ ‘शाप’ की अपेक्षा यह स्पष्ट करता है कि देश ऐसा उदाहरण बन गया जिसका उल्लेख शाप देते समय किया जा सकता था।
- source_word: מֵאֵין יוֹשֵׁב
  choice: उसमें कोई निवासी न रहा
  rationale: पूर्ण जनशून्यता के इब्रानी भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: כְּהַיּוֹם הַזֶּה
  choice: जैसा आज है
  rationale: वक्ता के समय दिखाई दे रही वर्तमान स्थिति को सीधे और संक्षेप में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में वाचा-सूचक व्यक्तिगत नाम सीधे आया है; उसे उपाधि ‘प्रभु’ से बदलने के बजाय हिन्दी में परिचित नाम-रूप से सुरक्षित रखा गया है।
- issue: यहोवा के ‘और सह न सकने’ का कथन
  choice: मानवीय भाषा में वर्णित सहनशीलता की सीमा को यथावत रखना
  alternative: इसे केवल तत्काल दंड का निर्णय कहकर भाव को हल्का करना
  rationale: मूल पाठ ईश्वरीय सहनशीलता के अंत को तीखे मानवीय मुहावरे में व्यक्त करता है; अनुवाद इस तनाव को बिना दार्शनिक व्याख्या जोड़े बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। पद की कारण-परिणाम संरचना स्पष्ट की गई है, पर मूल की तीव्र नैतिक भाषा और ‘सह न सकने’ का धर्मवैचारिक तनाव सुरक्षित रखा गया है।
