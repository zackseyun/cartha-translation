- source_word: בְּמַעֲשֵׂי יְדֵיכֶם
  choice: अपने हाथों के कामों से
  rationale: इब्रानी मुहावरे को जानबूझकर खुला रखा गया है; संदर्भ में इसका संकेत मनुष्य-निर्मित मूर्तियों और उनसे जुड़े उपासना-कर्मों, दोनों की ओर हो सकता है।
- source_word: לְקַטֵּר
  choice: धूप जलाकर
  rationale: आराधना-संबंधी संदर्भ में קטר के पिएल रूप का सामान्य अर्थ धूप या सुगन्धित अर्पण जलाना है।
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: दूसरे देवताओं के लिए
  rationale: אֲחֵרִים का सीधा अर्थ ‘दूसरे’ है; ‘विदेशी’ कहना अनावश्यक व्याख्या जोड़ता।
- source_word: אֲשֶׁר אַתֶּם בָּאִים לָגוּר שָׁם
  choice: जहाँ तुम परदेशी होकर रहने आए हो
  rationale: גור में अपने देश से बाहर परदेशी निवासी के रूप में रहने का भाव है। मिस्र में उपस्थित श्रोताओं के संदर्भ में ‘रहने आए हो’ स्वाभाविक है।
- source_word: לְמַעַן הַכְרִית לָכֶם
  choice: तुम अपने आपको मिटा डालोगे
  rationale: לָכֶם के आत्मघाती/स्वहित-विरोधी बल को सामने रखता है और लोगों के कर्मों के परिणाम को व्यक्त करता है; फिर भी कर्तृत्व की वैकल्पिक समझ पादटिप्पणी में सुरक्षित है।
- source_word: לִקְלָלָה וּלְחֶרְפָּה
  choice: शाप और निन्दा का पात्र
  rationale: ‘का पात्र’ जोड़ने से हिन्दी में स्पष्ट होता है कि लोग दूसरों के शाप और तिरस्कार का लक्ष्य बनेंगे, जबकि दोनों संज्ञाओं का मूल भाव बना रहता है।
- source_word: בְּכֹל גּוֹיֵי הָאָרֶץ
  choice: पृथ्वी की सभी जातियों के बीच
  rationale: बहुवचन ‘सभी जातियों’ के साथ הָאָרֶץ का व्यापक अर्थ ‘पृथ्वी’ उपयुक्त है; בְּ सामाजिक क्षेत्र में ‘के बीच’ के रूप में स्वाभाविक है।
theological_decisions:
- issue: לְמַעַן הַכְרִית לָכֶם में विनाश का कर्ता
  choice: 'आत्मवाचक/परिणामसूचक: ‘तुम अपने आपको मिटा डालोगे’'
  alternative: 'निष्क्रिय: ‘तुम मिटा दिए जाओगे’; अथवा निहित ईश्वरीय कर्ता: ‘मैं तुम्हें मिटा डालूँगा’'
  rationale: इस उपवाक्य में नया कर्ता स्पष्ट नहीं है और לָכֶם लोगों के अपने ही अहित की ओर संकेत कर सकता है। चुना हुआ पाठ उनकी जिम्मेदारी बनाए रखता है, पर व्यापक संदर्भ में परमेश्वर के न्याय को नकारता नहीं; दूसरी सम्भावनाएँ पादटिप्पणी में दी गई हैं।
- issue: לִקְלָלָה का अर्थ
  choice: ‘शाप का पात्र’
  alternative: ‘शाप’ अथवा ‘शाप देते समय लिया जाने वाला उदाहरण’
  rationale: संज्ञा स्वयं शाप या शाप के लक्ष्य/सूत्र में प्रयुक्त उदाहरण—दोनों का अर्थ दे सकती है। मुख्य पाठ में सहज हिन्दी चुनी गई है और विशेष अर्थ पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। पद मूल इब्रानी में पिछले वाक्य से व्याकरणिक रूप से जुड़ा है; हिन्दी में ‘मुझे क्रोध दिलाकर’ उस संबंध को बनाए रखता है। ‘निन्दा’ यहाँ सार्वजनिक अपमान और तिरस्कार का भाव देती है।
