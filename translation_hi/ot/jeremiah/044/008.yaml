base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/008.yaml
  text: provoking me to anger by the works of your hands[a], by burning incense to other gods in the land of Egypt, where you are going to sojourn[c][b], so that you may cut yourselves off and so that you may become a curse and a reproach among all the nations of the earth.
translation:
  language: hi
  text: अपने हाथों के कामों से[a] मुझे क्रोध दिलाकर, मिस्र की भूमि में—जहाँ तुम परदेशी बनकर रहने जा रहे हो[b]—दूसरे देवताओं के लिए धूप जलाकर, तुम ऐसा करते हो ताकि तुम अपने को नाश कर लो[c] और पृथ्वी के सब राष्ट्रों के बीच शाप[d] और निन्दा का पात्र बनो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘हाथों के काम’ उनके कर्मों का संकेत हो सकता है; इस संदर्भ में यह उनके बनाए हुए देव-प्रतिरूपों की ओर भी संकेत कर सकता है।
    reason: lexical_ambiguity
  - marker: b
    text: 'शाब्दिक भाव: ‘जहाँ तुम परदेशी के रूप में रहने जा रहे हो।’ संदर्भानुसार इसे ‘रहने आए हो’ भी कहा जा सकता है।'
    reason: lexical_nuance
  - marker: c
    text: इसका अनुवाद ‘ताकि तुम नाश किए जाओ’ भी हो सकता है; संदर्भ में परमेश्वर द्वारा उनका नाश किया जाना भी निहित हो सकता है।
    reason: agency_ambiguity
  - marker: d
    text: ‘शाप’ का अर्थ ‘शाप का पात्र’ या शाप देते समय उदाहरण के रूप में लिया जाने वाला समुदाय भी हो सकता है।
    reason: lexical_alternative
