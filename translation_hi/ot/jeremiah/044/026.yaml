  register: आधुनिक मानक हिन्दी में गंभीर भविष्यद्वाणी-संबंधी शैली रखी गई है। ‘समस्त’, ‘वचन’ और ‘यह वाणी है’ गरिमा देते हैं, जबकि वाक्यरचना सामान्य पाठक के लिए स्पष्ट है। पादटिप्पणी-चिह्न [a] मुख्य पाठ में संबंधित शपथ-वाक्य के बाद रखा गया है।
