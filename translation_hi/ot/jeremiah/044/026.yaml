base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/026.yaml
  text: 'Therefore hear the word of Yahweh[a], all Judah who dwell in the land of Egypt: Behold, I have sworn by my great name, says Yahweh, that my name shall no longer be called upon by the mouth of any man of Judah in all the land of Egypt, saying, ‘As the Lord GOD lives.’'
translation:
  language: hi
  text: 'इसलिए, हे मिस्र देश में रहने वाले समस्त यहूदा, यहोवा का वचन सुनो: देखो, मैंने अपने महान नाम की शपथ खाई है, यहोवा कहता है, कि पूरे मिस्र देश में यहूदा के किसी भी पुरुष के मुँह से फिर कभी मेरा नाम लेकर[a] यह नहीं कहा जाएगा, “प्रभु यहोवा के जीवन की शपथ।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप में: “मेरा नाम यहूदा के किसी भी पुरुष के मुँह से फिर नहीं पुकारा जाएगा।” यह इब्रानी मुहावरा यहाँ शपथ खाते समय परमेश्वर का नाम लेने या उसका आह्वान करने को सूचित करता है।'
    reason: इब्रानी निष्क्रिय मुहावरे की मौखिक छवि तथा तत्काल आने वाले शपथ-वाक्य से स्पष्ट होने वाला अर्थ दोनों को सुरक्षित रखता है।
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले न्याय-वचन से निकलने वाले निष्कर्ष को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: דְבַר יְהוָה
  choice: यहोवा का वचन
  rationale: भविष्यद्वाणी के प्रचलित सूत्र और परमेश्वर के वचन के धार्मिक भार को बनाए रखता है; יהוה को व्यक्तिगत नाम ‘यहोवा’ के रूप में प्रस्तुत किया गया है।
- source_word: כָּל יְהוּדָה הַיֹּשְׁבִים בְּאֶרֶץ מִצְרָיִם
  choice: हे मिस्र देश में रहने वाले समस्त यहूदा
  rationale: सामूहिक सम्बोधन और אֶרֶץ (‘देश’) दोनों को सुरक्षित रखते हुए हिन्दी में सम्बोधन स्पष्ट करता है।
- source_word: הִנְנִי
  choice: देखो
  rationale: गंभीर ईश्वरीय घोषणा की ओर ध्यान खींचने वाला स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: נִשְׁבַּעְתִּי בִּשְׁמִי הַגָּדוֹל
  choice: मैंने अपने महान नाम की शपथ खाई है
  rationale: सम्पन्न शपथ और उसके वर्तमान प्रभाव को व्यक्त करता है तथा ‘महान नाम’ की मूल छवि बनाए रखता है।
- source_word: אִם יִהְיֶה עוֹד
  choice: फिर कभी ... नहीं
  rationale: शपथ-सूत्र के बाद אִם से निहित प्रबल निषेध को हिन्दी में स्पष्ट करता है।
- source_word: שְׁמִי נִקְרָא בְּפִי
  choice: मेरे नाम का उच्चारण ... के मुँह से किया जाएगा
  rationale: קרא के निष्क्रिय रूप और ‘मुँह में/से’ की मौखिक छवि को निकटता से सुरक्षित रखता है; अगले वाक्यांश से स्पष्ट है कि प्रसंग शपथ में नाम लेने का है।
- source_word: כָּל אִישׁ יְהוּדָה
  choice: यहूदा के किसी भी पुरुष
  rationale: אִישׁ के पुल्लिंग एकवचन और वितरणात्मक अर्थ को बनाए रखता है।
- source_word: חַי אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा के जीवन की शपथ
  rationale: इब्रानी शपथ-सूत्र का स्वाभाविक हिन्दी समतुल्य है और אֲדֹנָי तथा יהוה दोनों को अलग-अलग दर्शाता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम सीधे आया है; ‘यहोवा’ सामान्य हिन्दी पाठक के लिए परिचित नाम-रूप है और उसे केवल उपाधि ‘प्रभु’ में नहीं बदलता।
- issue: שְׁמִי נִקְרָא בְּפִי का आशय
  choice: मुख्य पाठ में शपथ के प्रसंगानुसार ‘मेरा नाम लेकर ... कहा जाएगा’
  alternative: ‘मेरा नाम किसी के होंठों पर न होगा’ अथवा शाब्दिक ‘मेरा नाम उसके मुँह में पुकारा जाएगा’
  rationale: इब्रानी मुहावरा कुछ असामान्य है, पर तुरन्त आने वाला אֹמֵר और शपथ-वाक्य दिखाते हैं कि आशय ईश्वरीय नाम लेकर शपथ कहना है। पादटिप्पणी शाब्दिक मौखिक छवि और वैकल्पिक अभिव्यक्ति सुरक्षित रखती है।
- issue: כָּל אִישׁ יְהוּדָה में लिंग
  choice: यहूदा के किसी भी पुरुष
  alternative: यहूदा का कोई भी व्यक्ति
  rationale: मूल का व्याकरणिक पुल्लिंग एकवचन रखा गया है, बिना इससे अतिरिक्त धर्मवैज्ञानिक निष्कर्ष निकाले।
