  text: וְ/לָקַחְתִּ֞י אֶת שְׁאֵרִ֣ית יְהוּדָ֗ה אֲשֶׁר שָׂ֨מוּ פְנֵי/הֶ֜ם לָ/ב֣וֹא אֶֽרֶץ מִצְרַיִם֮ לָ/ג֣וּר שָׁם֒ וְ/תַ֨מּוּ כֹ֜ל בְּ/אֶ֧רֶץ מִצְרַ֣יִם יִפֹּ֗לוּ בַּ/חֶ֤רֶב בָּֽ/רָעָב֙ יִתַּ֔מּוּ מִ/קָּטֹן֙ וְ/עַד גָּד֔וֹל בַּ/חֶ֥רֶב וּ/בָ/רָעָ֖ב יָמֻ֑תוּ וְ/הָיוּ֙ לְ/אָלָ֣ה לְ/שַׁמָּ֔ה וְ/לִ/קְלָלָ֖ה וּ/לְ/חֶרְפָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/012.yaml
  text: And I will take the remnant of Judah who have set their faces to enter the land of Egypt to sojourn there[a], and they will all come to an end in the land of Egypt. They will fall by the sword and by famine; from the least even to the greatest, they will come to an end. By the sword and by famine they will die, and they will become an oath, a horror, a curse, and a reproach.
translation:
  language: hi
  text: और मैं यहूदा के बचे हुए लोगों को—जिन्होंने वहाँ परदेशी होकर रहने के लिए मिस्र देश में जाने का दृढ़ निश्चय किया है—ले लूँगा। वे सब मिस्र देश में समाप्त हो जाएँगे। वे तलवार और अकाल से गिरेंगे; छोटे से बड़े तक, वे तलवार और अकाल से समाप्त हो जाएँगे; वे तलवार और अकाल से मरेंगे। वे शाप-शपथ[a], भय का कारण, अभिशाप और निन्दा का विषय बन जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द אָלָה का अर्थ ‘शपथ’ हो सकता है, विशेषकर ऐसी शपथ या शपथ-सूत्र जिसमें शाप निहित हो। इसलिए इसे अगले शब्द ‘अभिशाप’ से अलग रखा गया है।
    reason: אָלָה में शपथ और शाप दोनों की अर्थ-छाया है, जबकि कְלָלָה के लिए पाठ में अलग शब्द है।
lexical_decisions:
- source_word: וְלָקַחְתִּי
  choice: अपने हाथ में लूँगा
  rationale: לקח का मूल अर्थ ‘लेना’ है; न्याय के प्रसंग में ‘अपने हाथ में लेना’ दण्ड के लिए उन्हें अपने अधिकार में लेने का संकेत देता है, पर ‘नष्ट करूँगा’ जैसा अर्थ पाठ में नहीं जोड़ता।
- source_word: שְׁאֵרִית יְהוּדָה
  choice: यहूदा के बचे हुए लोग
  rationale: שְׁאֵרִית विपत्ति के बाद शेष बचे समुदाय को दर्शाता है। आधुनिक सामान्य हिन्दी में यह ‘यहूदा के बचे हुए लोग’ के रूप में अधिक सहज है।
- source_word: אֲשֶׁר שָׂמוּ פְנֵיהֶם
  choice: जिन्होंने ... निश्चय किया है
  rationale: शाब्दिक ‘अपना मुँह लगाया’ हिन्दी में अस्पष्ट होता। इब्रानी मुहावरा किसी दिशा में दृढ़तापूर्वक बढ़ने का निश्चय व्यक्त करता है।
- source_word: לָבוֹא אֶרֶץ מִצְרַיִם לָגוּר שָׁם
  choice: मिस्र देश में जाकर वहाँ परदेशी के रूप में रहने
  rationale: גור केवल रहना नहीं, बल्कि परदेशी अथवा प्रवासी के रूप में निवास करना व्यक्त करता है; ‘परदेशी के रूप में रहने’ से यह भाव स्पष्ट रहता है।
- source_word: וְתַמּוּ כֹל / יִתַּמּוּ
  choice: सब ... समाप्त हो जाएँगे / समाप्त हो जाएँगे
  rationale: दोनों रूप एक ही मूल תמם से हैं। समान हिन्दी क्रिया रखकर इब्रानी की जानबूझकर की गई पुनरावृत्ति और सम्पूर्ण विनाश का बल सुरक्षित रखा गया है।
- source_word: יִפֹּלוּ בַּחֶרֶב
  choice: तलवार से गिरेंगे
  rationale: נפל का ठोस बिम्ब ‘गिरना’ न्याय-सूत्र में स्वाभाविक है और उसे सामान्य ‘मरेंगे’ में समतल नहीं करता।
- source_word: מִקָּטֹן וְעַד גָּדוֹל
  choice: छोटे से लेकर बड़े तक
  rationale: यह समस्त समुदाय को समेटने वाला इब्रानी युग्म है। हिन्दी में यही संक्षिप्त और स्वाभाविक समतुल्य है; सामाजिक पद या आयु को अनावश्यक रूप से निश्चित नहीं किया गया।
- source_word: לְאָלָה
  choice: शाप की शपथ
  rationale: אָלָה ऐसी शपथ को सूचित कर सकता है जिसमें शाप निहित हो। ‘शाप की शपथ’ इसे अगले अलग शब्द קְלָלָה (‘अभिशाप’) से पृथक रखते हुए उसका विशेष अर्थ बताता है।
- source_word: לְשַׁמָּה
  choice: भय का कारण
  rationale: שַׁמָּה उजाड़, स्तब्ध कर देने वाली भयावह दशा अथवा आतंक का विषय सूचित करता है। यहाँ व्यक्तियों के ‘बन जाने’ के साथ ‘भय का कारण’ स्वाभाविक हिन्दी है।
- source_word: וְלִקְלָלָה וּלְחֶרְפָּה
  choice: अभिशाप और निन्दा का विषय
  rationale: קְלָלָה को ‘अभिशाप’ और חֶרְפָּה को अपमानजनक ‘निन्दा’ के रूप में अलग रखा गया है; ‘का विषय’ दोनों पर स्वाभाविक रूप से लागू होता है।
theological_decisions:
- issue: ईश्वरीय न्याय की पुनरुक्त और कठोर भाषा
  choice: ‘समाप्त हो जाएँगे’, ‘गिरेंगे’ और ‘मरेंगे’ को अलग-अलग तथा תם की पुनरावृत्ति को समान शब्दों में रखा गया।
  alternative: पुनरावृत्ति घटाकर सबको ‘नष्ट हो जाएँगे’ कहना।
  rationale: मूल पाठ न्याय के अनेक शब्दों और पुनरावृत्ति द्वारा चेतावनी का भार बढ़ाता है। इसे न नरम किया गया, न मूल से अधिक पूर्ण विनाश का कोई व्यवस्थित धर्मवैज्ञानिक दावा जोड़ा गया।
- issue: אָלָה और קְלָלָה का भेद
  choice: क्रमशः ‘शाप की शपथ’ और ‘अभिशाप’।
  alternative: दोनों को केवल ‘शाप’ कहना, अथवा אָלָה को केवल ‘शपथ’ कहना।
  rationale: दो संबद्ध किन्तु पृथक इब्रानी संज्ञाओं का भेद बनाए रखते हुए אָלָה में निहित शापयुक्त शपथ का अर्थ भी व्यक्त किया गया।
- issue: וְלָקַחְתִּי में न्याय का निहितार्थ
  choice: ‘अपने हाथ में लूँगा’।
  alternative: ‘पकड़ लूँगा’, ‘उठा ले जाऊँगा’ या सीधे ‘नष्ट करूँगा’।
  rationale: इस प्रसंग में क्रिया दण्ड के लिए अधिकार में लेने का संकेत दे सकती है, पर मूल क्रिया केवल ‘लेना’ है। चुना हुआ रूप संकेत को रहने देता है और परिणाम को क्रिया के भीतर पहले से नहीं भरता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण भविष्यवाणी-शैली और सामान्य पाठक के लिए स्पष्ट वाक्य-विन्यास। ‘परदेशी के रूप में’ ने גור की प्रवासी-निवास की छाया सुरक्षित रखी है। ‘अपना मुँह ठानना’ जैसे अस्वाभाविक शाब्दिक मुहावरे के स्थान पर ‘निश्चय किया’ रखा गया, जबकि न्याय-सूत्र में ‘तलवार से गिरेंगे’ का मूल बिम्ब बचाया गया है।
