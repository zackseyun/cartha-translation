base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/028.yaml
  text: And a few survivors of the sword will return from the land of Egypt to the land of Judah[a], and all the remnant of Judah who came to the land of Egypt to sojourn there will know whose word will stand[b], mine or theirs.
translation:
  language: hi
  text: और तलवार से बचे हुए लोग मिस्र देश से यहूदा देश लौटेंगे—वे गिनती में बहुत थोड़े होंगे[a]। यहूदा के बचे हुए वे सभी लोग, जो मिस्र देश में परदेशी बनकर रहने आए थे, जान लेंगे कि किसका वचन पूरा होगा[b]—मेरा या उनका।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “तलवार से बचे हुए लोग ... गिनती के मनुष्य।”'
    reason: lexical_alternative
  - marker: b
    text: या “किसका वचन स्थिर रहेगा—मेरा या उनका।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְלִיטֵי חֶרֶב
  choice: तलवार से बचे हुए लोग
  rationale: यह प्रयोग तलवार अर्थात हिंसक न्याय से बच निकलने वालों को दर्शाता है। हिन्दी में ‘तलवार से बचे हुए’ मूल बिंब और बच निकलने का भाव दोनों बनाए रखता है।
- source_word: יְשֻׁבוּן
  choice: लौटेंगे
  rationale: שוב का सामान्य अर्थ ‘लौटना’ है और यहाँ भविष्यवाणी के संदर्भ में सामान्य भविष्यकाल स्वाभाविक है।
- source_word: מִן אֶרֶץ מִצְרַיִם אֶרֶץ יְהוּדָה
  choice: मिस्र देश से यहूदा देश
  rationale: मूल में ‘देश’ की पुनरावृत्ति को स्पष्ट और स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: מְתֵי מִסְפָּר
  choice: गिनती में बहुत थोड़े
  rationale: यह मुहावरा बहुत छोटी, गिनी जा सकने वाली संख्या बताता है। इसे उसी खंड में रखना मूल वाक्यक्रम के निकट है।
- source_word: וְיָדְעוּ
  choice: तब ... जान लेंगे
  rationale: भविष्य में परिणामस्वरूप होने वाली पहचान का भाव है; ‘तब’ हिन्दी में इस परिणाम-संबंध को स्पष्ट करता है।
- source_word: כָּל שְׁאֵרִית יְהוּדָה
  choice: यहूदा के बचे हुए वे सभी लोग
  rationale: यह सहज आधुनिक हिन्दी में שְׁאֵרִית के ‘शेष बचे समुदाय’ का अर्थ देता है, बिना अनावश्यक पारिभाषिकता के।
- source_word: הַבָּאִים לְאֶרֶץ מִצְרַיִם לָגוּר שָׁם
  choice: जो मिस्र देश में परदेशी बनकर रहने आए थे
  rationale: גור स्थायी स्वामित्व वाले निवास के बजाय परदेशी या अस्थायी निवासी के रूप में रहने का भाव रखता है; ‘परदेशी बनकर रहने’ से यह सूक्ष्मता बचती है।
- source_word: דְּבַר מִי יָקוּם
  choice: किसका वचन पूरा होकर रहेगा
  rationale: קום का शाब्दिक बिंब ‘खड़ा रहना’ है, पर इस मुहावरे में किसी कथन के सिद्ध या पूरा होने का अर्थ है। ‘पूरा होकर रहेगा’ दृढ़ता और परिणति दोनों व्यक्त करता है।
- source_word: מִמֶּנִּי וּמֵהֶם
  choice: मेरा या उनका
  rationale: सर्वनाम पहले आए ‘वचन’ की ओर संकेत करते हैं। हिन्दी में ‘मेरा या उनका’ संक्षिप्त और स्पष्ट है।
theological_decisions:
- issue: भविष्यद्वाणी के वचन की पुष्टि
  choice: किसका वचन पूरा होकर रहेगा—मेरा या उनका
  alternative: किसका वचन स्थिर रहेगा—मेरा या उनका
  rationale: यह चयन प्रभु की घोषित बात और यहूदियों की विरोधी बात के बीच मूल तुलना को बनाए रखता है। ‘पूरा होकर रहेगा’ यָקוּם के प्रसंगगत फलितार्थ को व्यक्त करता है, जबकि पादटिप्पणी में अधिक रूपकात्मक विकल्प दिया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और भविष्यवाणी-साहित्य के अनुकूल रखी गई है। ‘परदेशी बनकर रहने’ से גור की अस्थायी/विदेशी निवास की सूक्ष्मता और ‘तलवार’ से मूल न्याय-बिंब सुरक्षित है।
