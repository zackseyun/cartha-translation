id: JER.44.10
reference: Jeremiah 44:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לֹ֣א דֻכְּא֔וּ עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה וְ/לֹ֣א יָרְא֗וּ וְ/לֹֽא הָלְכ֤וּ בְ/תֽוֹרָתִ/י֙ וּ/בְ/חֻקֹּתַ֔/י אֲשֶׁר נָתַ֥תִּי לִ/פְנֵי/כֶ֖ם וְ/לִ/פְנֵ֥י אֲבוֹתֵי/כֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/010.yaml
  text: They have not been humbled to this day[a], and they have not feared[b], and they have not walked in my law and in my statutes that I set before you and before your fathers.
translation:
  language: hi
  text: आज तक तुम न तो दीन हुए हो, न तुमने भय माना है, और न तुम मेरी व्यवस्था और मेरी विधियों पर चले हो, जिन्हें मैंने तुम्हारे और तुम्हारे पुरखों के सामने रखा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דֻכְּאוּ
  choice: दीन हुए हो
  rationale: निष्क्रिय रूप कुचले जाने, दबाए जाने या दीन होने का भाव दे सकता है। यहाँ न्याय के बाद भी न झुकने के नैतिक-आत्मिक अर्थ को व्यक्त करने के लिए ‘दीन हुए हो’ स्वाभाविक है, जबकि ‘मन फिराया’ मूल से अधिक व्याख्यात्मक होता।
- source_word: עַד הַיּוֹם הַזֶּה
  choice: आज के दिन तक
  rationale: यह निरंतरता दर्शाने वाला प्रचलित कालवाचक मुहावरा है और हिब्रू की संरचना को स्पष्ट हिन्दी में रखता है।
- source_word: יָרְאוּ
  choice: भय माना है
  rationale: यहाँ केवल आतंकित होने के बजाय परमेश्वर के प्रति श्रद्धायुक्त भय और जवाबदेही का भाव है। ‘भय माना’ उस व्यापक अर्थ को सहज हिन्दी में बनाए रखता है।
- source_word: הָלְכוּ
  choice: चले हो
  rationale: व्यवस्था और विधियों के साथ यह वाचा-संबंधी जीवन-चाल का रूपक है। ‘चले हो’ हिब्रू बिंब को सुरक्षित रखता है और हिन्दी में समझने योग्य है।
- source_word: בְתוֹרָתִי
  choice: मेरी व्यवस्था
  rationale: תורה का अर्थ शिक्षा भी हो सकता है, पर यहाँ ‘मेरी विधियों’ के समानांतर कानूनी-वाचा संदर्भ में ‘मेरी व्यवस्था’ उपयुक्त है।
- source_word: וּבְחֻקֹּתַי
  choice: और उन विधियों
  rationale: חֻקּוֹת निर्धारित नियमों या विधियों को दर्शाता है। ‘विधियों’ से कानूनी-वाचा संबंधी स्वर बना रहता है; ‘उन’ हिन्दी में पहले उल्लिखित परमेश्वर की विधियों को स्वाभाविक ढंग से जोड़ता है।
- source_word: אֲשֶׁר נָתַתִּי לִפְנֵיכֶם
  choice: जिन्हें मैंने तुम्हारे ... सामने रखा था
  rationale: נתן עם לפני का शाब्दिक अर्थ ‘सामने दिया’ है, पर मुहावरे का आशय किसी बात को पालन के लिए सामने रखना है। दूसरा पुरुष बहुवचन ‘तुम्हारे’ सुरक्षित रखा गया है।
- source_word: וְלִפְנֵי אֲבוֹתֵיכֶם
  choice: और तुम्हारे पुरखों के सामने
  rationale: אֲבוֹתֵיכֶם पूर्ववर्ती पितृ-पीढ़ियों को सूचित करता है। आधुनिक हिन्दी में ‘पुरखे’ पुरुषवाची स्रोत और पूर्वजों के व्यापक संदर्भ दोनों को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: क्या דֻכְּאוּ को स्पष्ट पश्चाताप की भाषा में अनूदित किया जाए
  choice: दीन हुए हो
  alternative: मन फिराया है / कुचले गए हो / मन से टूटे हो
  rationale: संदर्भ पश्चाताप न करने की ओर संकेत करता है, पर क्रिया स्वयं स्पष्ट रूप से ‘मन फिराना’ नहीं कहती। ‘दीन हुए’ स्रोत की अर्थ-सीमा और निहित धार्मिक तनाव दोनों को बनाए रखता है।
- issue: ירא के भय का स्वरूप
  choice: भय माना है
  alternative: डरे हो / श्रद्धा रखी है
  rationale: यह वाचा-संबंधी संदर्भ में केवल आतंक नहीं, परमेश्वर के प्रति श्रद्धायुक्त भय भी व्यक्त कर सकता है। चुनी हुई अभिव्यक्ति दोनों आयामों को पूरी तरह अलग किए बिना रखती है।
- issue: दूसरे पुरुष बहुवचन को बनाए रखना
  choice: तुम्हारे और तुम्हारे पुरखों
  alternative: उनके और उनके पुरखों
  rationale: לִפְנֵיכֶם और אֲבוֹתֵיכֶם के प्रत्यय स्पष्टतः दूसरे पुरुष बहुवचन हैं; इसलिए संदर्भगत कथन को तीसरे पुरुष में समतल नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप अपनाया गया है। हिब्रू का वाचा-संबंधी ‘चलना’ रूपक और स्पष्ट दूसरा पुरुष बहुवचन सुरक्षित रखे गए हैं। ‘दीन हुए’ के साथ वास्तविक शाब्दिक अस्पष्टता पादटिप्पणी में दी गई है।
