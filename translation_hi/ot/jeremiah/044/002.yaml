  register: आधुनिक मानक हिन्दी का गरिमापूर्ण भविष्यद्वक्ताई स्वर रखा गया है। वाक्यरचना सहज है, पर मूल के बलसूचक 'तुमने स्वयं' और ध्यानसूचक 'देखो' को सुरक्षित रखा गया है।
