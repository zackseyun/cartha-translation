  text: כֹּה אָמַ֞ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אַתֶּ֣ם רְאִיתֶ֗ם אֵ֤ת כָּל הָֽ/רָעָה֙ אֲשֶׁ֤ר הֵבֵ֨אתִי֙ עַל יְר֣וּשָׁלִַ֔ם וְ/עַ֖ל כָּל עָרֵ֣י יְהוּדָ֑ה וְ/הִנָּ֤/ם חָרְבָּה֙ הַ/יּ֣וֹם הַ/זֶּ֔ה וְ/אֵ֥ין בָּ/הֶ֖ם יוֹשֵֽׁב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/002.yaml
  text: 'Thus says Yahweh of hosts[a], the God of Israel: You yourselves have seen all the disaster that I brought on Jerusalem and on all the cities of Judah. And behold, they are a ruin this day[b], and there is no one living in them.'
translation:
  language: hi
  text: 'सेनाओं के याहवे[a], इस्राएल के परमेश्वर, यों कहते हैं: तुमने स्वयं उस सारी विपत्ति को देखा है जो मैं यरूशलेम और यहूदा के सभी नगरों पर लाई है। और देखो, वे आज के दिन खंडहर हैं[b], और उनमें कोई नहीं रहता।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सेनाओं के यहोवा”; इब्रानी में परमेश्वर का व्यक्तिगत नाम יהוה है।
    reason: divine_name_and_lexical_alternative
  - marker: b
    text: या “आज के दिन उजाड़ पड़े हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: यों कहते हैं
  rationale: मानक भविष्यद्वक्ताई संदेश-सूत्र को स्वाभाविक और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं के यहोवा
  rationale: ईश्वरीय व्यक्तिगत नाम को 'यहोवा' के रूप में रखता है और צְבָאוֹת के सैन्य तथा स्वर्गीय समूहों से जुड़े व्यापक भाव को 'सेनाओं' से व्यक्त करता है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर
  rationale: सम्बन्धवाचक हिब्रू पदबंध का सीधा और प्रचलित हिन्दी रूप।
- source_word: אַתֶּם רְאִיתֶם
  choice: तुमने स्वयं ... देखी है
  rationale: स्वतंत्र सर्वनाम אַתֶּם के बल को 'स्वयं' से सुरक्षित रखते हुए पूर्ण क्रिया की वर्तमान प्रासंगिकता व्यक्त की गई है।
- source_word: כָּל הָרָעָה
  choice: वह सारी विपत्ति
  rationale: यहाँ רָעָה नैतिक बुराई नहीं, विनाशकारी न्याय अथवा आपदा को दर्शाता है; 'विपत्ति' इस संदर्भ में स्पष्ट और स्वाभाविक है।
- source_word: הֵבֵאתִי עַל
  choice: मैं ... पर लाया
  rationale: हिफ़ील क्रिया और עַל का निकट, सहज हिन्दी रूप।
- source_word: עָרֵי יְהוּדָה
  choice: यहूदा के सभी नगरों
  rationale: עִיר के लिए संदर्भानुकूल प्रचलित शब्द 'नगर' चुना गया है।
- source_word: וְהִנָּם
  choice: और देखो, वे
  rationale: ध्यान आकर्षित करने वाले संकेतक הִנֵּה और उसके बहुवचन प्रत्यय दोनों को व्यक्त करता है।
- source_word: חָרְבָּה הַיּוֹם הַזֶּה
  choice: आज उजाड़ पड़े हैं
  rationale: חָרְבָּה की उजाड़ अथवा खंडहर अवस्था और הַיּוֹם הַזֶּה के वर्तमान समय-संदर्भ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְאֵין בָּהֶם יוֹשֵׁב
  choice: और उनमें कोई नहीं रहता
  rationale: अस्तित्व-निषेध और निवासी के भाव का सरल, सटीक हिन्दी रूप।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में प्रयुक्त चार-अक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में व्यापक रूप से पहचाने जाने वाले लिप्यंतरण 'यहोवा' से रखा गया है; 'याहवे' अधिक संभावित विद्वत्तापरक उच्चारण है, इसलिए विकल्प के रूप में स्वीकार्य है।
- issue: परमेश्वर द्वारा लाई गई רָעָה का अर्थ
  choice: विपत्ति
  alternative: आपदा
  rationale: पद में शब्द नैतिक बुराई करने का दावा नहीं करता, बल्कि यरूशलेम और यहूदा पर आए विनाशकारी न्याय को बताता है।
