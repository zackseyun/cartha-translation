base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/005.yaml
  text: But they did not listen or incline their ear to turn from their evil[a], so as not to make offerings to other gods.
translation:
  language: hi
  text: पर उन्होंने न तो सुना, न कान लगाया, ताकि वे अपनी बुराई से फिरें और दूसरे देवताओं के लिए धूप न जलाएँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁמְעוּ
  choice: सुना
  rationale: यहाँ क्रिया का अर्थ केवल ध्वनि सुनना नहीं, संदेश पर ध्यान देना और उसे मानना भी है। ‘सुना’ प्रसंग में इस व्यापक अर्थ को बनाए रखता है।
- source_word: הִטּוּ אֶת אָזְנָם
  choice: कान लगाया
  rationale: इब्रानी मुहावरे ‘अपना कान झुकाना’ का स्वाभाविक हिन्दी रूप है; इससे ध्यानपूर्वक ग्रहण करने का भाव और मूल रूपक दोनों बने रहते हैं।
- source_word: לָשׁוּב מֵרָעָתָם
  choice: अपनी बुराई से फिरें
  rationale: שׁוב का मूल भाव मुड़ने या फिरने का है। यह अनुवाद पश्चात्ताप का आशय व्यक्त करता है, पर पाठ में उससे अधिक विशिष्ट धर्मशास्त्रीय शब्द नहीं जोड़ता।
- source_word: לְבִלְתִּי קַטֵּר
  choice: धूप न जलाएँ
  rationale: इस उपासना-संबंधी प्रसंग में קטר का सामान्य और ठोस अर्थ धूप जलाना है। לבלתי उद्देश्य या अपेक्षित परिणाम के निषेध को व्यक्त करता है, इसलिए ‘न जलाएँ’ चुना गया है।
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: दूसरे देवताओं के लिए
  rationale: ל यहाँ उपासना के अर्पण या समर्पण का लक्ष्य बताता है; ‘के लिए’ आधुनिक हिन्दी में इसे स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: मूर्तिपूजक उपासना के प्रसंग में קטר का अर्थ
  choice: दूसरे देवताओं के लिए धूप न जलाएँ
  alternative: दूसरे देवताओं को भेंट न चढ़ाएँ
  rationale: कभी-कभी यह क्रिया व्यापक रूप से धुएँ वाली भेंट चढ़ाने के लिए प्रयुक्त हो सकती है, पर यहाँ मूल का अधिक सीधा अर्थ ‘धूप जलाना’ है। इसे मुख्य पाठ में रखने से निंदित उपासना-कर्म की ठोस प्रकृति सुरक्षित रहती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। ‘न तो सुना, न कान लगाया’ इब्रानी समानांतरता और भविष्यद्वक्ताई भर्त्सना के गंभीर स्वर को बनाए रखता है।
