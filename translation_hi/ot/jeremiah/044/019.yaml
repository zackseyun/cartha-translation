  text: וְ/כִֽי אֲנַ֤חְנוּ מְקַטְּרִים֙ לִ/מְלֶ֣כֶת הַ/שָּׁמַ֔יִם וּ/לְ/הַסֵּ֥ךְ לָ֖/הּ נְסָכִ֑ים הֲ/מִֽ/בַּלְעֲדֵ֣י אֲנָשֵׁ֗י/נוּ עָשִׂ֨ינוּ לָ֤/הּ כַּוָּנִים֙ לְ/הַ֣עֲצִבָ֔/ה וְ/הַסֵּ֥ךְ לָ֖/הּ נְסָכִֽים־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/019.yaml
  text: And when we burned incense to the Queen of Heaven and poured out drink offerings to her[a], was it apart from our husbands that we made cakes for her, to depict her, and poured out drink offerings to her?
translation:
  language: hi
  text: “और जब हम आकाश की रानी के लिए धूप जलाती थीं और उसके लिए पेय-भेंट उँडेलती थीं, तो क्या हमने अपने पतियों के बिना उसके लिए उसका रूप दर्शाने के लिए टिकियाँ बनाईं[a] और उसके लिए पेय-भेंट उँडेली?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे दर्शाने के लिए” अथवा “उसकी प्रतिमा/समानता बनाने के लिए।” इब्रानी शब्द सम्भवतः देवी की समानता में आकार दी गई टिकियों की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: और जब
  rationale: संदर्भ में यह स्त्रियों के पिछले कथन को आगे बढ़ाते हुए परिस्थिति बताता है, न कि वास्तविक शर्त रखता है।
- source_word: מְקַטְּרִים
  choice: धूप जलाती थीं
  rationale: पिएल रूप यहाँ उपासना-संबंधी धूप अथवा सुगंधित धूमबलि चढ़ाने का संकेत देता है; आधुनिक हिन्दी में ‘धूप जलाना’ सहज और विशिष्ट है।
- source_word: לִמְלֶכֶת הַשָּׁמַיִם
  choice: आकाश की रानी के लिए
  rationale: यह यिर्मयाह में प्रयुक्त एक मूर्तिपूजक देवी की उपाधि है। ‘आकाश की रानी’ उपाधि को बिना अतिरिक्त पहचान जोड़े स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: וּלְהַסֵּךְ לָהּ נְסָכִים
  choice: और उसके लिए अर्घ उँडेलती थीं
  rationale: נסכים पेय-भेंट अथवा अर्घ हैं और נסך उन्हें उँडेलने की अनुष्ठानिक क्रिया बताता है। ‘अर्घ’ संक्षिप्त और गरिमापूर्ण हिन्दी है।
- source_word: הֲמִבַּלְעֲדֵי אֲנָשֵׁינוּ
  choice: तो क्या हमने अपने पतियों की सहमति के बिना ही
  rationale: स्त्री वक्ताओं के संदर्भ में אֲנָשֵׁינוּ का आशय ‘हमारे पति’ है। מִבַּלְעֲדֵי स्वतंत्र रूप से या उनकी जानकारी/सहमति के बिना करने का भाव देता है; प्रश्न का आशय स्पष्ट करने के लिए ‘सहमति’ रखा गया है।
- source_word: עָשִׂינוּ לָהּ כַּוָּנִים
  choice: उसके लिए ... टिकियाँ बनाईं
  rationale: כַּוָּנִים देवी-पूजा में प्रयुक्त आकार दी हुई छोटी रोटियों या केकों को सूचित करता है। ‘टिकियाँ’ आकार और भेंट—दोनों संदर्भों में सामान्य हिन्दी पाठक के लिए सहज है।
- source_word: לְהַעֲצִבָהּ
  choice: उसकी आकृतिवाली
  rationale: शब्द का आशय देवी को चित्रित, निरूपित अथवा उसकी समानता में आकार देने से है। मुख्य पाठ सम्भावित आकृति-संबंध स्पष्ट करता है, जबकि पादटिप्पणी वास्तविक शाब्दिक अनिश्चितता सुरक्षित रखती है।
- source_word: וְהַסֵּךְ לָהּ נְסָכִים
  choice: और उसके लिए अर्घ उँडेले
  rationale: पद में दोहराई गई अनुष्ठानिक क्रिया को पहले प्रयोग के अनुरूप रखा गया है।
theological_decisions:
- issue: मूर्तिपूजक उपाधि מְלֶכֶת הַשָּׁמַיִם की पहचान और अनुवाद
  choice: आकाश की रानी
  alternative: आकाशों की रानी
  rationale: वक्ताओं की देवी-संबंधी उपाधि को ज्यों का त्यों प्रस्तुत किया गया है; न उसे वैध धार्मिक पद बनाया गया है, न किसी बाद की परम्परा से जोड़ा गया है।
- issue: पतियों की भूमिका का आशय
  choice: अपने पतियों की सहमति के बिना
  alternative: अपने पतियों के बिना / उनसे अलग होकर
  rationale: प्रश्न इस दावे पर बल देता है कि स्त्रियों ने यह उपासना पति से स्वतंत्र होकर नहीं की। ‘सहमति’ प्रसंग का सम्भावित आशय व्यक्त करती है, पर पूर्ण सहभागिता का अनावश्यक दावा नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी, स्त्री-वक्ता के अनुरूप स्त्रीलिंग बहुवचन, और उपासना-संबंधी गरिमापूर्ण शब्दावली अपनाई गई है। ‘अर्घ’ को ‘पेय-भेंट’ की अपेक्षा अधिक स्वाभाविक अनुष्ठानिक पद माना गया; पादटिप्पणी לְהַעֲצִבָהּ की वास्तविक अर्थगत अनिश्चितता सुरक्षित रखती है।
