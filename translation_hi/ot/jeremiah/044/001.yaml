  yaml_path: translation/ot/jeremiah/044/001.yaml
  text: The word that came to Jeremiah concerning all the Judeans living in the land of Egypt[a], those living in Migdol and in Tahpanhes and in Noph and in the land of Pathros, saying,
translation:
  language: hi
  text: 'मिस्र देश में रहने वाले यहूदा के सभी लोगों के विषय में यिर्मयाह के पास जो वचन आया—अर्थात् मिग्दोल, तहपनहेस, नोफ[a] और पत्रोस देश में रहने वालों के विषय में—वह यह कहते हुए आया:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: नोफ मिस्री नगर का इब्रानी नाम है, जिसे सामान्यतः मेम्फिस के नाम से जाना जाता है।
    reason: ऐतिहासिक स्थान-नाम की अधिक परिचित पहचान बताने के लिए।
lexical_decisions:
- source_word: הַדָּבָר
  choice: वह वचन
  rationale: भविष्यवाणी की भूमिका में यह पद परमेश्वर से प्राप्त वाणी को सूचित करता है; ‘वचन’ सूत्रात्मक और गरिमापूर्ण प्रयोग को बनाए रखता है।
- source_word: אֲשֶׁר הָיָה אֶל יִרְמְיָהוּ
  choice: जो यिर्मयाह के पास ... आया
  rationale: यह इब्रानी भविष्यसूचक मुहावरे का स्वाभाविक हिन्दी रूप है और वचन के प्राप्त होने का भाव सुरक्षित रखता है।
- source_word: אֶל כָּל הַיְּהוּדִים
  choice: सब यहूदावासियों के विषय में
  rationale: यहाँ दूसरा אֶל वचन के संबोधन अथवा विषय को सूचित कर सकता है। ‘के विषय में’ उपलब्ध अंग्रेज़ी परामर्श-पाठ के अनुरूप है, जबकि ‘यहूदावासी’ उस समय के यहूदा-सम्बन्धी जातीय-भौगोलिक अर्थ को स्पष्ट करता है।
- source_word: הַיֹּשְׁבִים בְּאֶרֶץ מִצְרָיִם
  choice: मिस्र देश में रहने वाले
  rationale: कृदन्त वहाँ निरन्तर निवास करने वालों को दर्शाता है; यह आधुनिक हिन्दी में सहज है।
- source_word: מִגְדֹּל / תַחְפַּנְחֵס / נֹף / פַּתְרוֹס
  choice: मिग्दोल / तहपनहेस / नोफ / पत्रोस
  rationale: स्थान-नामों को इब्रानी रूप के निकट देवनागरी लिप्यन्तरण में रखा गया है; नोफ की अधिक परिचित पहचान पाद-टिप्पणी में दी गई है।
- source_word: לֵאמֹר
  choice: 'यह था:'
  rationale: अगले पद में आरम्भ होने वाली वाणी की भूमिका को स्वाभाविक हिन्दी में व्यक्त करता है; शाब्दिक ‘यह कहते हुए’ की अपेक्षा यह अधिक सुबोध है।
theological_decisions:
- issue: אֶל כָּל הַיְּהוּדִים में אֶל का कार्य
  choice: सब यहूदावासियों के विषय में
  alternative: सब यहूदावासियों से
  rationale: व्याकरणतः संबोधन का अर्थ सम्भव है, पर वाक्य की संरचना में वचन का विषय/सम्बन्ध बताने वाला अर्थ भी स्वाभाविक है। मुख्य पाठ ने परामर्श-पाठ का निर्णय रखा है, बिना किसी सिद्धान्तगत अर्थ को जोड़ने के।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण भविष्यसूचक गद्य। स्थान-नाम इब्रानी रूपों के निकट रखे गए हैं। दोहराए गए הַיֹּשְׁבִים को ‘अर्थात् ... जो ... रहते थे’ द्वारा स्पष्ट किया गया है, और לֵאמֹר को अगले पद की प्रत्यक्ष वाणी के लिए स्वाभाविक कोलन-भूमिका में प्रस्तुत किया गया है।
