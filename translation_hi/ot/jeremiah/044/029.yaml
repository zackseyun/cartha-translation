source:
  edition: WLC
  text: וְ/זֹאת לָ/כֶ֤ם הָ/אוֹת֙ נְאֻם יְהוָ֔ה כִּֽי פֹקֵ֥ד אֲנִ֛י עֲלֵי/כֶ֖ם בַּ/מָּק֣וֹם הַ/זֶּ֑ה לְמַ֨עַן֙ תֵּֽדְע֔וּ כִּי֩ ק֨וֹם יָק֧וּמוּ דְבָרַ֛/י עֲלֵי/כֶ֖ם לְ/רָעָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/029.yaml
  text: And this will be the sign for you[a], declares Yahweh, that I am punishing you in this place, so that you may know that my words will surely stand against you for harm.
translation:
  language: hi
  text: और तुम्हारे लिए चिन्ह यह होगा—याहवे की यह घोषणा है—कि मैं इस स्थान में तुम्हें दण्ड दे रहा हूँ, ताकि तुम जान लो कि मेरे वचन तुम्हारे विरुद्ध विपत्ति के लिए निश्चय ही पूरे होंगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे वचन तुम्हारे विरुद्ध हानि के लिए निश्चय ही अटल रहेंगे।” इब्रानी में शाब्दिक रूप है, “मेरे वचन तुम्हारे विरुद्ध हानि के लिए निश्चय ही खड़े रहेंगे।”
    reason: קוֹם יָקוּמוּ के ‘दृढ़ता से स्थिर रहने’ के बिंब तथा לְרָעָה के हानि/विपत्ति संबंधी अर्थ का विकल्प देता है।
lexical_decisions:
- source_word: וְזֹאת לָכֶם הָאוֹת
  choice: और तुम्हारे लिए चिन्ह यह होगा
  rationale: संयोजक, संकेतवाचक और संज्ञा को स्वाभाविक हिन्दी में रखते हुए आगामी चिन्ह की घोषणा स्पष्ट की गई है; निहित क्रिया को ‘होगा’ से व्यक्त किया गया है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: मानक भविष्यद्वाणी-सूत्र को गरिमापूर्ण और सहज हिन्दी में रखा गया है तथा परमेश्वर का व्यक्तिवाचक नाम सुरक्षित है।
- source_word: כִּי פֹקֵד אֲנִי עֲלֵיכֶם
  choice: कि मैं ... तुम्हें दण्ड दे रहा हूँ
  rationale: פקד का अर्थ प्रसंग में प्रतिकूल दैवी कार्रवाई है; इसलिए अस्पष्ट ‘भेंट करने’ के बजाय न्याय-संदर्भ वाला ‘दण्ड दे रहा हूँ’ चुना गया।
- source_word: בַּמָּקוֹם הַזֶּה
  choice: इस स्थान में
  rationale: मूल के स्थानवाचक और संकेतवाचक अर्थ को सीधे बनाए रखता है।
- source_word: לְמַעַן תֵּדְעוּ
  choice: ताकि तुम जान लो
  rationale: לְמַעַן के प्रयोजनार्थक बल को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: כִּי קוֹם יָקוּמוּ
  choice: निश्चय ही अटल रहेंगे
  rationale: धातु קום के ‘खड़े/स्थिर रहने’ के बिंब और infinitive absolute की निश्चितता को हिन्दी मुहावरे में सुरक्षित रखता है।
- source_word: דְבָרַי עֲלֵיכֶם לְרָעָה
  choice: तुम्हारी हानि के लिए कहे गए मेरे वचन
  rationale: बहुवचन ‘मेरे वचन’, संबोधित लोगों के विरुद्ध दिशा, और רעה के विपत्तिमूलक परिणाम—तीनों को स्पष्ट करता है; ‘कहे गए’ हिन्दी में संबंध को सहज बनाता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में उपस्थित वाचा-संबंधी व्यक्तिवाचक नाम को उपाधि में बदलने के बजाय लिप्यंतरित किया गया है।
- issue: לְרָעָה में नैतिक बुराई या विपत्तिमूलक हानि
  choice: तुम्हारी हानि के लिए
  alternative: तुम पर विपत्ति लाने के लिए; तुम्हारे विरुद्ध बुराई के लिए
  rationale: यहाँ आशय दण्ड के प्रतिकूल परिणाम से है, परमेश्वर में नैतिक बुराई से नहीं; ‘हानि’ मूल की व्यापकता रखता है।
- issue: קוֹם יָקוּמוּ का रूपक
  choice: निश्चय ही अटल रहेंगे
  alternative: निश्चय ही पूरे होंगे
  rationale: ‘अटल रहेंगे’ मूल क्रिया ‘खड़ा होना/कायम रहना’ को बनाए रखता है, जबकि पादटिप्पणी अधिक परिणामपरक सम्भावना बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली गरिमापूर्ण पर सामान्य पाठक के लिए सहज है। भविष्यद्वाणी-सूत्र को डैश से अलग किया गया है। ‘दण्ड’, ‘चिन्ह’, ‘वचन’ और ‘अटल’ जैसे प्रचलित बाइबलीय शब्द रखे गए हैं, पर अत्यधिक संस्कृतनिष्ठ भाषा से बचा गया है।
