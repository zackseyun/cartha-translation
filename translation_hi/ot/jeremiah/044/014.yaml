  text: וְ/לֹ֨א יִהְיֶ֜ה פָּלִ֤יט וְ/שָׂרִיד֙ לִ/שְׁאֵרִ֣ית יְהוּדָ֔ה הַ/בָּאִ֥ים לָ/גֽוּר שָׁ֖ם בְּ/אֶ֣רֶץ מִצְרָ֑יִם וְ/לָ/שׁ֣וּב אֶ֣רֶץ יְהוּדָ֗ה אֲשֶׁר הֵ֜מָּה מְנַשְּׂאִ֤ים אֶת נַפְשָׁ/ם֙ לָ/שׁוּב֙ לָ/שֶׁ֣בֶת שָׁ֔ם כִּ֥י לֹֽא יָשׁ֖וּבוּ כִּ֥י אִם פְּלֵטִֽים־׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/014.yaml
  text: So there will be no fugitive or survivor for the remnant of Judah who are coming to sojourn there in the land of Egypt and then to return to the land of Judah[a], to which they are lifting up their soul to return and dwell there; for they will not return, except for fugitives.
translation:
  language: hi
  text: इसलिए यहूदा के बचे हुए लोगों में से, जो मिस्र देश में परदेशी होकर रहने और फिर यहूदा देश लौट जाने के लिए वहाँ आ रहे हैं, कोई भी बच निकलनेवाला या जीवित बचा हुआ न होगा। वे उस देश में लौटकर बसने के लिए अपना मन लगाए हुए हैं[a]; क्योंकि वे लौटेंगे नहीं, सिवाय बच निकलनेवालों के।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “वे अपना प्राण उठाए हुए हैं”—अर्थात वे लौटने की तीव्र इच्छा रखते हैं।
    reason: इब्रानी मुहावरे की मूल छवि और उसका अर्थ दोनों बताने के लिए।
lexical_decisions:
- source_word: פָּלִיט / פְּלֵטִים
  choice: बच निकलनेवाला / बच निकलनेवाले
  rationale: यह शब्द विपत्ति से निकल भागने या बच जाने वाले व्यक्ति को दर्शाता है। आरंभ और अपवाद-वाक्य में एक ही शब्दावली रखने से इब्रानी की पुनरावृत्ति बनी रहती है।
- source_word: שָׂרִיד
  choice: जीवित बचा हुआ
  rationale: यह न्याय या विपत्ति के बाद जीवित रह गए व्यक्ति को दर्शाता है और פָּלִיט से भेद भी बनाए रखता है।
- source_word: שְׁאֵרִית יְהוּדָה
  choice: यहूदा के बचे हुए लोग
  rationale: यहाँ वाक्यांश ऐतिहासिक रूप से बचे हुए यहूदियों का वर्णन करता है; इसमें उनकी निष्ठा या धार्मिक स्वीकृति का अतिरिक्त अर्थ नहीं जोड़ा गया।
- source_word: הַבָּאִים לָגוּר שָׁם
  choice: जो ... परदेशी होकर रहने ... के लिए वहाँ आ रहे हैं
  rationale: वर्तमान कृदंत की गतिशीलता और גור में निहित परदेशी अथवा अस्थायी निवासी होने का भाव सुरक्षित रखा गया है।
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: मिस्र देश में
  rationale: इब्रानी में אֶרֶץ स्पष्ट है; इसलिए औपचारिक भविष्यद्वाणी शैली में 'देश' रखा गया है।
- source_word: וְלָשׁוּב אֶרֶץ יְהוּדָה
  choice: और फिर यहूदा देश लौट जाने के लिए
  rationale: दूसरे उद्देश्य और अपेक्षित क्रम को स्वाभाविक हिन्दी में व्यक्त करने के लिए 'फिर' रखा गया है।
- source_word: מְנַשְּׂאִים אֶת נַפְשָׁם
  choice: अपना मन लगाए हुए हैं
  rationale: शाब्दिक चित्र 'अपना प्राण उठाना' आधुनिक हिन्दी में अस्पष्ट होता; यह स्वाभाविक मुहावरा आकांक्षा और अभिलाषा का अर्थ देता है। शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: לָשׁוּב לָשֶׁבֶת שָׁם
  choice: उस देश में लौटकर बसने के लिए
  rationale: दोनों क्रियाओं—लौटना और वहाँ निवास करना—को संक्षिप्त, स्वाभाविक हिन्दी में बनाए रखा गया है।
- source_word: כִּי לֹא יָשׁוּבוּ כִּי אִם פְּלֵטִים
  choice: पर वे लौट नहीं पाएँगे—केवल कुछ बच निकलनेवाले ही लौटेंगे
  rationale: अपवाद को स्पष्ट रखते हुए अंतिम क्रिया हिन्दी में पूरी की गई है। 'कुछ' बहुवचन अपवाद का स्वाभाविक संकेत है, किसी निश्चित संख्या का दावा नहीं।
theological_decisions:
- issue: '''यहूदा के बचे हुए लोग'' में सकारात्मक धार्मिक ''शेष'' का अर्थ'
  choice: इसे न्याय के अधीन मिस्र गए जीवित बचे यहूदियों के ऐतिहासिक वर्णन के रूप में रखा गया है।
  alternative: '''यहूदा के विश्वासयोग्य बचे हुए लोग'' जैसे धार्मिक रूप से सकारात्मक पद का प्रयोग'
  rationale: संदर्भ इस समूह को विश्वासयोग्य या परमेश्वर द्वारा अनुमोदित नहीं कहता; ऐसा विशेषण पाठ में अनावश्यक धर्मवैज्ञानिक अर्थ जोड़ देता।
- issue: पूर्ण विनाश के कथन और अंतिम अपवाद के बीच तनाव
  choice: पहले व्यापक निषेध और फिर 'केवल कुछ बच निकलनेवाले' के अपवाद—दोनों को स्पष्ट रखा गया है।
  alternative: अपवाद को पहले कथन में मिलाकर तनाव कम कर देना
  rationale: इब्रानी पाठ निर्णायक न्याय-वचन के बाद वास्तविक अपवाद देता है; अनुवाद को यह अलंकारिक और धर्मवैज्ञानिक तनाव नहीं मिटाना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी; गंभीर भविष्यद्वाणी शैली के साथ सामान्य पाठक के लिए सहज शब्दावली। 'परदेशी होकर रहना' גור का भाव रखता है, जबकि लंबे वाक्य को पठनीय बनाने के लिए दो वाक्यों में बाँटा गया है।
