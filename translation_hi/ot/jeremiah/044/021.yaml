reference: Jeremiah 44:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הֲ/ל֣וֹא אֶת הַ/קִּטֵּ֗ר אֲשֶׁ֨ר קִטַּרְתֶּ֜ם בְּ/עָרֵ֤י יְהוּדָה֙ וּ/בְ/חֻצ֣וֹת יְרוּשָׁלִַ֔ם אַתֶּ֧ם וַ/אֲבֽוֹתֵי/כֶ֛ם מַלְכֵי/כֶ֥ם וְ/שָׂרֵי/כֶ֖ם וְ/עַ֣ם הָ/אָ֑רֶץ אֹתָ/ם֙ זָכַ֣ר יְהוָ֔ה וַֽ/תַּעֲלֶ֖ה עַל לִבּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/021.yaml
  text: Was it not the incense that you burned in the cities of Judah and in the streets of Jerusalem—you and your fathers[a], your kings and your officials, and the people of the land—that Yahweh remembered, and it came up upon his heart?
translation:
  language: hi
  text: क्या याहवे ने उस धूप[a] को याद नहीं किया, जो तुमने यहूदा के नगरों और यरूशलेम की गलियों में जलाई थी—तुमने, तुम्हारे पूर्वजों ने, तुम्हारे राजाओं और अधिकारियों ने, और देश के लोगों ने—और वह उसके हृदय में आ गई[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में यहाँ “उन्हें” बहुवचन है। इसका संकेत धूप जलाने के उन कार्यों या अर्पणों की ओर है, जिन्हें मुख्य पाठ में सामूहिक रूप से “धूप” कहा गया है।
    reason: इब्रानी बहुवचन कर्म אֹתָם को स्पष्ट करता है, जबकि मुख्य पाठ में सामूहिक एकवचन ‘धूप’ स्वाभाविक हिंदी रखता है।
  - marker: b
    text: शब्दशः, “उसके हृदय पर चढ़ आई।” यह इब्रानी मुहावरा बताता है कि वह बात याहवे के स्मरण या ध्यान में आ गई।
    reason: मुख्य पाठ में मुहावरे का स्वाभाविक हिंदी अर्थ दिया गया है और पादटिप्पणी में उसका मानव-सदृश शाब्दिक बिंब सुरक्षित रखा गया है।
lexical_decisions:
- source_word: הֲלוֹא
  choice: क्या ... नहीं
  rationale: यह अलंकारिक प्रश्न सहमति की अपेक्षा करता है। हिंदी में ‘क्या ... नहीं’ उसके प्रश्नात्मक बल को स्वाभाविक रूप से बनाए रखता है।
- source_word: הַקִּטֵּר ... קִטַּרְתֶּם
  choice: उस धूप को ... जलाया था
  rationale: मूल शब्दावली बलि-संबंधी धूप जलाने को दर्शाती है। ‘धूप ... जलाया’ सामान्य पाठक के लिए स्पष्ट है और क्रिया को किसी साधारण आग जलाने तक सीमित नहीं करता।
- source_word: בְּעָרֵי יְהוּדָה וּבְחֻצוֹת יְרוּשָׁלִַם
  choice: यहूदा के नगरों और यरूशलेम की गलियों में
  rationale: यह सीधा स्थानवाचक अनुवाद है। חֻצוֹת गलियों या खुले चौकों को सूचित कर सकता है; प्रसंग में ‘गलियों’ स्वाभाविक है।
- source_word: אַתֶּם וַאֲבוֹתֵיכֶם מַלְכֵיכֶם וְשָׂרֵיכֶם וְעַם הָאָרֶץ
  choice: तुमने, तुम्हारे पुरखाओं ने, तुम्हारे राजाओं और अधिकारियों ने, और देश के लोगों ने
  rationale: पूरी सहभागी-सूची सुरक्षित रखी गई है। ‘पुरखा’ आधुनिक हिंदी में पूर्वजों के लिए सहज है; ‘अधिकारी’ שָׂרִים को राजपुत्रों तक सीमित नहीं करता; ‘देश के लोग’ עַם הָאָרֶץ की संभावित सामाजिक अस्पष्टता को बनाए रखता है।
- source_word: זָכַר
  choice: याद किया
  rationale: זכר का मूल अर्थ स्मरण करना है। ‘याद किया’ आधुनिक हिंदी में स्पष्ट और स्वाभाविक है, जबकि दिव्य संज्ञान के बारे में अतिरिक्त व्याख्या नहीं जोड़ता।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिंदी बाइबलीय परंपरा में परमेश्वर के व्यक्तिगत नाम का व्यापक रूप से पहचाना जाने वाला रूप है; यह मूल के व्यक्तिवाचक नाम को सामान्य उपाधि से नहीं बदलता।
- source_word: וַתַּעֲלֶה עַל לִבּוֹ
  choice: वह उसके हृदय पर ... चढ़ आई
  rationale: मूल का शाब्दिक बिंब ‘उसके हृदय पर चढ़ आई’ सुरक्षित रखा गया है। हिंदी में यह असामान्य किंतु समझने योग्य है और उसे केवल ‘उसके मन में आया’ कहकर रूपक तथा धर्मवैचारिक तनाव को समतल नहीं करता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ में व्यक्तिवाचक वाचा-नाम है। ‘यहोवा’ हिंदी पाठकों में पहचाना हुआ नाम है और इसे केवल ‘प्रभु’ जैसी उपाधि में विलीन नहीं करता।
- issue: परमेश्वर के ‘हृदय’ का मानव-सदृश बिंब
  choice: उसके हृदय पर चढ़ आई
  alternative: उसके मन में आ गई
  rationale: मूल के मानव-सदृश और रूपकात्मक कथन को बनाए रखा गया है; उसे शुद्ध मानसिक स्मरण की व्याख्या में सीमित नहीं किया गया।
- issue: זָכַר का कर्ता और स्मरण का विषय
  choice: यहोवा ने उस धूप को याद किया
  alternative: यहोवा ने उन्हें याद किया
  rationale: वाक्य का प्रमुख विषय धूप जलाना है और स्त्रीलिंग एकवचन וַתַּעֲלֶה उसी घटना/धूप की ओर लौटता प्रतीत होता है। फिर भी इब्रानी אֹתָם बहुवचन है; इस व्याकरणिक तनाव को पादटिप्पणी में खुला रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। सहभागी-सूची को डैश और दोहराए गए ‘ने’ से स्पष्ट किया गया है। मुख्य पाठ में मूल का अलंकारिक प्रश्न और ‘हृदय पर चढ़ आने’ का असामान्य बिंब सुरक्षित है; कठिन व्याकरणिक बहुवचन को चुपचाप मिटाने के बजाय पादटिप्पणी में बताया गया है।
