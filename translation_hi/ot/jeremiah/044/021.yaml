revisions:
- from: क्या यहोवा ने उस धूप को याद नहीं किया, जिसे तुमने यहूदा के नगरों और यरूशलेम की गलियों में जलाया था—तुमने, तुम्हारे पुरखाओं ने, तुम्हारे राजाओं और अधिकारियों ने, और देश के लोगों ने? और क्या वह उसके हृदय पर नहीं चढ़ आई?[a][b]
  to: क्या याहवे ने उस धूप[a] को याद नहीं किया, जो तुमने यहूदा के नगरों और यरूशलेम की गलियों में जलाई थी—तुमने, तुम्हारे पूर्वजों ने, तुम्हारे राजाओं और अधिकारियों ने, और देश के लोगों ने—और वह उसके हृदय में आ गई[b]?
  rationale: Revision retains the Hebrew rhetorical force and full participant list, corrects the coordination of the final clause, represents the plural object as referring to the incense-burning acts, and uses idiomatic modern Hindi for the heart idiom while preserving its literal form in a note. The divine name is aligned with the project’s Yahweh convention.
