source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה הִנְ/נִ֣י נֹ֠תֵן אֶת פַּרְעֹ֨ה חָפְרַ֤ע מֶֽלֶךְ מִצְרַ֨יִם֙ בְּ/יַ֣ד אֹֽיְבָ֔י/ו וּ/בְ/יַ֖ד מְבַקְשֵׁ֣י נַפְשׁ֑/וֹ כַּ/אֲשֶׁ֨ר נָתַ֜תִּי אֶת צִדְקִיָּ֣הוּ מֶֽלֶךְ יְהוּדָ֗ה בְּ/יַ֨ד נְבוּכַדְרֶאצַּ֧ר מֶֽלֶךְ בָּבֶ֛ל אֹיְב֖/וֹ וּ/מְבַקֵּ֥שׁ נַפְשֽׁ/וֹ׀־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/030.yaml
  text: 'Thus says Yahweh: Behold[a], I am giving Pharaoh Hophra king of Egypt into the hand of his enemies and into the hand of those seeking his life, just as I gave Zedekiah king of Judah into the hand of Nebuchadnezzar king of Babylon, his enemy and the one seeking his life.'
translation:
  language: hi
  text: 'याहवे यह कहते हैं: “देखो, मैं मिस्र के राजा फ़िरौन होप्रा को उसके शत्रुओं के हाथ में और उन लोगों के हाथ में सौंपने जा रहा हूँ जो उसकी जान के पीछे पड़े हैं। ठीक वैसे ही मैंने यहूदा के राजा सिदकिय्याह को बाबेल के राजा नबूकदरेस्सर[a] के हाथ में सौंप दिया था, जो उसका शत्रु था और उसकी जान के पीछे पड़ा था।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में यहाँ नाम का रूप ‘नबूकदरेस्सर’ है; इसे प्रायः ‘नबूकदनेस्सर’ भी लिखा जाता है।
    reason: नाम के मूल इब्रानी रूप और प्रचलित हिन्दी रूप के अंतर को दर्ज करना।
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: याहवे यों कहते हैं
  rationale: भविष्यद्वक्ताओं की मानक संदेशवाहक उद्घोषणा को गरिमापूर्ण और स्वाभाविक हिन्दी में रखा गया है; יְהוָה को परियोजना की नीति के अनुसार ‘याहवे’ लिखा गया है।
- source_word: הִנְנִי נֹתֵן
  choice: देखो, मैं ... सौंपने जा रहा हूँ
  rationale: הִנְנִי की ध्यान आकर्षित करने वाली गंभीरता और कृदंत की निकट भविष्य तथा निश्चितता—दोनों को व्यक्त करता है।
- source_word: פַּרְעֹה חָפְרַע
  choice: फ़िरौन होप्रा
  rationale: यूनानी ऐतिहासिक रूप ‘एप्रीज़’ के बजाय इब्रानी नाम-रूप को लिप्यंतरित किया गया है।
- source_word: בְּיַד
  choice: के हाथ में सौंपना
  rationale: नियंत्रण या अधिकार में दे देने के इब्रानी मुहावरे को हिन्दी के सहज समानार्थी मुहावरे में रखा गया है और पद की पुनरावृत्ति भी बची है।
- source_word: מְבַקְשֵׁי נַפְשׁוֹ
  choice: उसकी जान लेनेवाले
  rationale: शाब्दिक ‘उसके प्राण के खोजी’ आधुनिक हिन्दी में अस्वाभाविक और अस्पष्ट होता; यह चयन मुहावरे का अभिप्रेत अर्थ स्पष्ट करता है।
- source_word: נְבוּכַדְרֶאצַּר
  choice: नबूकदरेस्सर
  rationale: इसी पद में पाए जाने वाले इब्रानी नाम-रूप को निकटता से दर्शाता है; अधिक प्रचलित वैकल्पिक रूप पादटिप्पणी में दिया गया है।
- source_word: אֹיְבוֹ וּמְבַקֵּשׁ נַפְשׁוֹ
  choice: जो उसका शत्रु था और उसकी जान लेना चाहता था
  rationale: दोनों एकवचन पदों को नबूकदरेस्सर से संबंधित रखते हुए इब्रानी के संयुक्त बल को स्पष्ट और सहज हिन्दी में सुरक्षित किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ के व्यक्तिगत ईश्वरीय नाम को उपाधि में बदलने के बजाय परियोजना के निर्धारित रूप ‘याहवे’ में प्रस्तुत किया गया है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘के हाथ में सौंपना’ द्वारा मूल की समानांतर संरचना बचाई गई है, जबकि ‘जान लेना चाहता था’ इब्रानी मुहावरे का सामान्य पाठक के लिए स्वाभाविक अर्थ देता है।
