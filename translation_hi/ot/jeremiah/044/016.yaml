base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/016.yaml
  text: As for the word that you have spoken to us in the name of Yahweh[a], we will not listen to you.
translation:
  language: hi
  text: “तुमने याहवेह के नाम से हमसे जो वचन कहा है, हम तुम्हारी बात नहीं सुनेंगे[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हम तुम्हारी बात नहीं मानेंगे।” इब्रानी क्रिया का अर्थ ‘सुनना’ और ‘मानना’ दोनों हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּבָר
  choice: वचन
  rationale: यहाँ דָּבָר यिर्मयाह द्वारा सुनाए गए भविष्यद्वाणी-संदेश को दर्शाता है। ‘वचन’ मूल शब्द की सीधाई और प्रसंग की गंभीरता दोनों बनाए रखता है।
- source_word: דִּבַּרְתָּ אֵלֵינוּ
  choice: तुमने हमसे ... कहा है
  rationale: हिंदी में ‘हमसे कहा’ स्वाभाविक रूप से ‘हमें संबोधित करके कहा’ व्यक्त करता है। पूर्ण क्रिया के वर्तमान प्रभाव को ‘कहा है’ से रखा गया है।
- source_word: בְּשֵׁם יְהוָה
  choice: याहवेह के नाम से
  rationale: ‘के नाम से’ आधुनिक हिंदी में किसी के अधिकार और प्रतिनिधित्व में बोलने का स्वाभाविक मुहावरा है; याहवेह व्यक्तिगत ईश्वरीय नाम को लिप्यंतरित करता है।
- source_word: אֵינֶנּוּ שֹׁמְעִים אֵלֶיךָ
  choice: हम तुम्हारी नहीं सुनेंगे
  rationale: यह हिंदी मुहावरा दृढ़ अस्वीकार व्यक्त करता है और ‘सुनना’ तथा ‘मानना’—दोनों संभावित भावों को खुला रखता है। भविष्यकालीन रूप प्रसंग में निहित संकल्पपूर्ण इनकार को स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवेह
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में उपाधि नहीं, चार अक्षरों वाला व्यक्तिगत नाम है। लिप्यंतरण उस भेद को सुरक्षित रखता है।
- issue: שׁמע का अर्थ—सुनना या आज्ञा मानना
  choice: तुम्हारी नहीं सुनेंगे
  alternative: तुम्हारी आज्ञा नहीं मानेंगे
  rationale: हिंदी अभिव्यक्ति मूल के श्रवण-संबंधी अर्थ को बनाए रखते हुए प्रसंग में निहित न मानने के भाव को भी समेटती है; मुख्य पाठ किसी एक भाव को अनावश्यक रूप से सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक प्रत्युत्तर के अनुरूप दृढ़ रखी गई है। ‘उसके विषय में’ आरंभ में रखे गए इब्रानी पद ‘वचन’ को आगे के स्पष्ट इनकार से जोड़ता है।
