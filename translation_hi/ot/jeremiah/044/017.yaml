source:
  edition: WLC
  text: כִּ֩י עָשֹׂ֨ה נַעֲשֶׂ֜ה אֶֽת כָּל הַ/דָּבָ֣ר אֲשֶׁר יָצָ֣א מִ/פִּ֗י/נוּ לְ/קַטֵּ֞ר לִ/מְלֶ֣כֶת הַ/שָּׁמַיִם֮ וְ/הַסֵּֽיךְ לָ֣/הּ נְסָכִים֒ כַּ/אֲשֶׁ֨ר עָשִׂ֜ינוּ אֲנַ֤חְנוּ וַ/אֲבֹתֵ֨י/נוּ֙ מְלָכֵ֣י/נוּ וְ/שָׂרֵ֔י/נוּ בְּ/עָרֵ֣י יְהוּדָ֔ה וּ/בְ/חֻצ֖וֹת יְרוּשָׁלִָ֑ם וַ/נִּֽשְׂבַּֽע לֶ֨חֶם֙ וַ/נִּֽהְיֶ֣ה טוֹבִ֔ים וְ/רָעָ֖ה לֹ֥א רָאִֽינוּ־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/017.yaml
  text: 'But we will certainly do every word that has gone out from our mouth: to burn incense to the Queen of Heaven and to pour out drink offerings to her[a], just as we and our fathers, our kings and our officials, did in the cities of Judah and in the streets of Jerusalem; then we had plenty of bread, prospered[b], and saw no disaster.'
translation:
  language: hi
  text: 'लेकिन हम अपने मुँह से निकली हर बात को अवश्य करेंगे: हम आकाश की रानी के लिए धूप जलाएँगे और उसके लिए पेय-भेंटें उँडेलेंगे, ठीक वैसे ही जैसे हम, हमारे पुरखे, हमारे राजा और हमारे अधिकारी यहूदा के नगरों और यरूशलेम की गलियों में किया करते थे। तब हमें भरपूर रोटी मिलती थी[a], हम सुखी-संपन्न थे[b], और हमने कोई विपत्ति नहीं देखी।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘हम रोटी से तृप्त थे।’
    reason: lexical_alternative
  - marker: b
    text: अथवा, ‘हम अच्छे हाल में थे’ या ‘हमारा भला होता था।’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: लेकिन
  rationale: पिछले पद में दिए गए आदेश के प्रति वक्ताओं का हठपूर्ण विरोध यहाँ प्रमुख है; इसलिए प्रसंगानुसार विरोधसूचक ‘लेकिन’ स्वाभाविक है।
- source_word: עָשֹׂה נַעֲשֶׂה
  choice: अवश्य पूरा करेंगे
  rationale: धातु के अनंत रूप और सीमित क्रिया की पुनरुक्ति दृढ़ निश्चय पर बल देती है। ‘अवश्य’ उस बल को स्वाभाविक हिन्दी में व्यक्त करता है; ‘पूरा करेंगे’ मुँह से निकली प्रतिज्ञा को निभाने का भाव देता है।
- source_word: כָּל הַדָּבָר אֲשֶׁר יָצָא מִפִּינוּ
  choice: अपने मुँह से निकली हर बात
  rationale: यह प्रतिज्ञा अथवा घोषित संकल्प का संकेत है। अनुवाद मूल की ठोस ‘मुँह से निकली’ अभिव्यक्ति को बनाए रखता है।
- source_word: לְקַטֵּר
  choice: धूप जलाएँगे
  rationale: उपासना-संबंधी प्रसंग में क्रिया धूप का धुआँ चढ़ाने को सूचित करती है; आधुनिक हिन्दी में ‘धूप जलाना’ स्पष्ट और स्वाभाविक है।
- source_word: לִמְלֶכֶת הַשָּׁמַיִם
  choice: आकाश की रानी
  rationale: देवी की उपाधि को सीधे और बिना व्याख्यात्मक विस्तार के प्रस्तुत किया गया है।
- source_word: וְהַסֵּיךְ לָהּ נְסָכִים
  choice: उसके लिए पेय-भेंटें उँडेलेंगे
  rationale: यह बलि के रूप में तरल पदार्थ उँडेलने की धार्मिक क्रिया है। ‘पेय-भेंट’ सामान्य पाठक के लिए ‘अर्घ’ या ‘लिबेशन’ से अधिक पारदर्शी है।
- source_word: אֲנַחְנוּ וַאֲבֹתֵינוּ מְלָכֵינוּ וְשָׂרֵינוּ
  choice: हम, हमारे पुरखे, हमारे राजा और हमारे अधिकारी
  rationale: ‘पुरखे’ אבותינו के वंशगत भाव को स्वाभाविक हिन्दी में व्यक्त करता है; ‘अधिकारी’ שרים के शासकीय आशय को व्यापक रूप से रखता है।
- source_word: בְּעָרֵי יְהוּדָה וּבְחֻצוֹת יְרוּשָׁלִָם
  choice: यहूदा के नगरों और यरूशलेम की गलियों में
  rationale: חֻצוֹת खुले सार्वजनिक स्थानों या गलियों को सूचित कर सकता है; ‘गलियों’ यहाँ सहज और पर्याप्त व्यापक है।
- source_word: וַנִּשְׂבַּע לֶחֶם
  choice: हमें भरपूर रोटी मिलती थी
  rationale: शाब्दिक अर्थ ‘हम रोटी से तृप्त थे’ है। मुख्य पाठ में यह रूप भोजन की प्रचुरता को सहज हिन्दी में बताता है, जबकि पादटिप्पणी शाब्दिक विकल्प सुरक्षित रखती है।
- source_word: וַנִּהְיֶה טוֹבִים
  choice: हम सुखी-संपन्न थे
  rationale: शाब्दिक रूप से ‘हम भले/अच्छे हाल में थे।’ प्रसंग में भोजन की प्रचुरता और विपत्ति के अभाव के बीच यह समग्र कुशलता और समृद्धि का दावा है; संयुक्त पद अर्थ की चौड़ाई बनाए रखता है।
- source_word: וְרָעָה לֹא רָאִינוּ
  choice: हमने कोई विपत्ति नहीं देखी
  rationale: רָעָה यहाँ नैतिक बुराई नहीं, हानि या आपदा को सूचित करती है। ‘विपत्ति’ और ‘देखी’ दोनों मूल अर्थ और मुहावरे को बनाए रखते हैं।
theological_decisions:
- issue: मूर्तिपूजक देवी की उपाधि का अनुवाद
  choice: आकाश की रानी
  alternative: स्वर्ग की रानी
  rationale: यह उपाधि मूल पाठ के अनुसार उस देवी की पहचान बताती है जिसकी वक्ता उपासना करते थे; इसे सीधे रखना समर्थन नहीं दर्शाता। ‘आकाश’ שָּׁמַיִם के दृश्य-आकाश संबंधी और प्राचीन धार्मिक संदर्भ को बिना बाद की धार्मिक संगतियाँ जोड़े व्यक्त करता है।
- issue: वक्ताओं के समृद्धि-संबंधी दावे का स्वर
  choice: दावे को बिना संपादकीय सुधार के सीधे प्रस्तुत करना
  alternative: उनके दावे को भ्रामक बताने वाली व्याख्या जोड़ना
  rationale: पद वक्ताओं की अपनी कारणात्मक समझ प्रस्तुत करता है। अनुवाद उस तनाव को सुरक्षित रखता है और यहाँ उनकी बात का समर्थन या खंडन नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘पेय-भेंटें उँडेलेंगे’ धार्मिक क्रिया की सटीकता बनाए रखते हुए अत्यधिक तकनीकी शब्दावली से बचता है। वक्ताओं के हठ और उनके समृद्धि-दावे को मूल के अनुसार प्रत्यक्ष रखा गया है।
