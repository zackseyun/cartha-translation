source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יִרְמְיָ֨הוּ֙ אֶל כָּל הָ/עָ֔ם וְ/אֶ֖ל כָּל הַ/נָּשִׁ֑ים שִׁמְעוּ֙ דְּבַר יְהוָ֔ה כָּל יְהוּדָ֕ה אֲשֶׁ֖ר בְּ/אֶ֥רֶץ מִצְרָֽיִם־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/024.yaml
  text: Then Jeremiah said to all the people and to all the women[a], “Hear the word of Yahweh, all Judah who are in the land of Egypt.”
translation:
  language: hi
  text: तब यिर्मयाह ने सारी प्रजा और सभी स्त्रियों से कहा, “हे मिस्र देश में रहने वाले यहूदा के सभी लोगों, याहवे का वचन सुनो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में घटनाक्रम को स्पष्ट रखता है।
- source_word: יִרְמְיָהוּ
  choice: यिर्मयाह
  rationale: भविष्यद्वक्ता के नाम का हिन्दी बाइबलीय रूप।
- source_word: אֶל כָּל הָעָם
  choice: सारी प्रजा से
  rationale: עָם यहाँ सामूहिक रूप से लोगों को दर्शाता है; ‘प्रजा’ गरिमापूर्ण और प्रसंगानुकूल है।
- source_word: וְאֶל כָּל הַנָּשִׁים
  choice: और सभी स्त्रियों से
  rationale: נָשִׁים का यहाँ व्यापक अर्थ ‘स्त्रियाँ’ है; निकटवर्ती प्रसंग में स्त्रियों को विशेष रूप से संबोधित किया गया है।
- source_word: שִׁמְעוּ
  choice: सुनो
  rationale: बहुवचन आज्ञार्थक का सीधा और स्वाभाविक अनुवाद, जो भविष्यद्वाणी के आह्वान को बनाए रखता है।
- source_word: דְּבַר יְהוָה
  choice: याहवे का वचन
  rationale: मानक भविष्यद्वाणी-सूत्र को शाब्दिक और पहचानने योग्य रूप में सुरक्षित रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चतुरक्षरीय परमेश्वर-नाम को उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में प्रस्तुत करता है।
- source_word: כָּל יְהוּדָה
  choice: यहूदा के सभी लोगो
  rationale: यह वाक्यांश मिस्र में बसे यहूदी समुदाय को सामूहिक रूप से संबोधित करता है; यह रूप आधुनिक हिन्दी में स्वाभाविक है, जबकि मूल का सामूहिक ‘समस्त यहूदा’ पादटिप्पणी में सुरक्षित है।
- source_word: אֲשֶׁר בְּאֶרֶץ מִצְרָיִם
  choice: मिस्र देश में रहनेवाले
  rationale: संबंधवाचक उपवाक्य और אֶרֶץ (‘देश’) दोनों को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में निजी वाचा-नाम सीधे प्रयुक्त है; ‘याहवे’ उसे उपाधि में बदले बिना सुरक्षित रखता है।
- issue: כָּל יְהוּדָה की सामूहिक पहचान
  choice: यहूदा के सभी लोगो
  alternative: समस्त यहूदा; सभी यहूदावासियो
  rationale: यह संबोधन मिस्र में रहनेवाले यहूदा-समुदाय के लिए है। चुना हुआ रूप न तो भूभाग मात्र का अर्थ देता है, न सामूहिक संबोधन को अस्पष्ट करता है; अधिक औपचारिक सामूहिक रूप पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भविष्यद्वाणी के गरिमापूर्ण स्वर के लिए ‘वचन’ और ‘प्रजा’ रखे गए हैं। प्रत्यक्ष संबोधन को स्वाभाविक बनाने के लिए ‘हे’ और बहुवचन ‘लोगो’ का प्रयोग किया गया है।
