source:
  edition: WLC
  text: עַל הַ/יּ֗וֹם הַ/בָּא֙ לִ/שְׁד֣וֹד אֶת כָּל פְּלִשְׁתִּ֔ים לְ/הַכְרִ֤ית לְ/צֹר֙ וּ/לְ/צִיד֔וֹן כֹּ֖ל שָׂרִ֣יד עֹזֵ֑ר כִּֽי שֹׁדֵ֤ד יְהוָה֙ אֶת פְּלִשְׁתִּ֔ים שְׁאֵרִ֖ית אִ֥י כַפְתּֽוֹר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/047/004.yaml
  text: because of the day that is coming to devastate all the Philistines[a], to cut off from Tyre and Sidon every surviving helper. For Yahweh is devastating the Philistines, the remnant of the island of Caphtor.
translation:
  language: hi
  text: 'क्योंकि वह दिन आ रहा है, जब सारे फ़िलिस्तियों को उजाड़ दिया जाएगा और सोर और सीदोन से हर बचे हुए सहायक को काट डाला जाएगा। क्योंकि याहवे फ़िलिस्तियों को—कफ़्तोर के तटवर्ती प्रदेश[a] के बचे हुए लोगों को—उजाड़ रहा है।


    [a] या, “कफ़्तोर के द्वीप के बचे हुए लोग।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कफ़्तोर के द्वीप के बचे हुए लोग।”
    reason: इब्रानी אִי का अर्थ ‘तटवर्ती प्रदेश’ या ‘द्वीप’ हो सकता है; पादटिप्पणी केवल इसी वास्तविक भौगोलिक अस्पष्टता को दर्शाती है।
lexical_decisions:
- source_word: עַל הַיּוֹם הַבָּא
  choice: क्योंकि वह दिन आ रहा है
  rationale: עַל को संदर्भ में कारणसूचक माना गया है और הַבָּא के कृदन्तीय भाव को स्वाभाविक आधुनिक हिन्दी में ‘आ रहा है’ से व्यक्त किया गया है।
- source_word: לִשְׁדֹד / שֹׁדֵד
  choice: उजाड़ दिया जाएगा / उजाड़ रहा है
  rationale: שׁדד हिंसक लूट और विनाश से उत्पन्न उजाड़ को सूचित करता है। पहले प्रयोग में आनेवाले दिन के उद्देश्य और दूसरे में वर्तमान कृदन्त की सजीवता को अलग-अलग हिन्दी रूपों में रखा गया है।
- source_word: אֶת כָּל פְּלִשְׁתִּים
  choice: सारे फ़िलिस्तियों को
  rationale: बहुवचन रूप भूमि के बजाय लोगों को दर्शाता है; इसलिए जाति-समूह के रूप में सीधा अनुवाद किया गया है।
- source_word: לְהַכְרִית
  choice: मिटा दिया जाएगा
  rationale: הכרית का मूल भाव ‘काट डालना/समाप्त कर देना’ है। लोगों या सहायता के पूर्ण उन्मूलन के संदर्भ में ‘मिटा देना’ स्वाभाविक और पर्याप्त रूप से प्रबल है।
- source_word: לְצֹר וּלְצִידוֹן כֹּל שָׂרִיד עֹזֵר
  choice: सोर और सीदोन के हर बचे हुए सहायक को
  rationale: לְ को यहाँ उन नगरों के लिए उपलब्ध सहायता के संबंध के रूप में समझा गया है। यह निकटवर्ती शब्द-क्रम और ‘सहायक’ के भाव को बनाए रखता है, बिना यह तय किए कि सहायक व्यक्ति था या सहयोगी समुदाय।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को पदवी से बदलने के बजाय हिन्दी लिप्यंतरण में रखा गया है।
- source_word: שְׁאֵרִית אִי כַפְתּוֹר
  choice: कफ़्तोर के तटवर्ती प्रदेश के बचे हुए लोग
  rationale: שְׁאֵרִית को लोगों के संदर्भ में ‘बचे हुए लोग’ और אִי को व्यापक भौगोलिक अर्थ ‘तटवर्ती प्रदेश’ दिया गया है। ‘द्वीप’ की वास्तविक शाब्दिक संभावना पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है; ‘याहवे’ उसे किसी पदवी से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: אִי כַפְתּוֹר का भौगोलिक अर्थ
  choice: कफ़्तोर का तटवर्ती प्रदेश
  alternative: कफ़्तोर का द्वीप
  rationale: אִי का अर्थ द्वीप या तटवर्ती प्रदेश दोनों हो सकता है। मुख्य पाठ में संदर्भानुकूल व्यापक अर्थ रखा गया है और वास्तविक विकल्प को पादटिप्पणी में दिया गया है।
- issue: फ़िलिस्तियों और ‘कफ़्तोर के बचे हुए लोगों’ का संबंध
  choice: दूसरे पदबंध को फ़िलिस्तियों की पुनर्पहचान करने वाला समानाधिकरण माना गया
  alternative: इसे अलग लक्ष्य-समूह समझना
  rationale: इब्रानी शब्द-क्रम में שְׁאֵרִית אִי כַפְתּוֹר सीधे אֶת־פְּלִשְׁתִּים के बाद आता है और उसी समूह का वर्णन करना सबसे स्वाभाविक है; हिन्दी में डैश इस संबंध को स्पष्ट करते हैं, बिना उससे आगे कोई उत्पत्ति-सिद्धान्त जोड़ने के।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘फ़िलिस्ती’, ‘सोर’, ‘सीदोन’ और ‘कफ़्तोर’ प्रचलित हिन्दी बाइबलीय नाम-रूप हैं। वाक्य को पिछले पद से जुड़ी कारणसूचक संरचना के रूप में ‘क्योंकि’ से आरम्भ किया गया है।
