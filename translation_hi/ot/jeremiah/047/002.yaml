source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה הִנֵּה מַ֜יִם עֹלִ֤ים מִ/צָּפוֹן֙ וְ/הָיוּ֙ לְ/נַ֣חַל שׁוֹטֵ֔ף וְ/יִשְׁטְפוּ֙ אֶ֣רֶץ וּ/מְלוֹאָ֔/הּ עִ֖יר וְ/יֹ֣שְׁבֵי בָ֑/הּ וְ/זָֽעֲקוּ֙ הָֽ/אָדָ֔ם וְ/הֵילִ֕ל כֹּ֖ל יוֹשֵׁ֥ב הָ/אָֽרֶץ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/047/002.yaml
  text: 'Thus says the LORD: Behold, waters are rising from the north, and they will become an overflowing torrent; they will overflow the land and its fullness, the city and those who dwell in it. Then mankind will cry out, and every inhabitant of the land will wail.'
translation:
  language: hi
  text: 'यहोवा यों कहता है: “देखो, उत्तर से जल उमड़ रहे हैं; वे उफनती हुई धारा बन जाएँगे। वे देश और उसमें जो कुछ है, नगर और उसके निवासियों को जलमग्न कर देंगे। तब मनुष्य चिल्ला उठेंगे, और देश के सभी निवासी विलाप करेंगे।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिब्रू के विशिष्ट ईश्वरीय नाम को हिन्दी में प्रचलित लिप्यंतरण द्वारा व्यक्त किया गया है।
- source_word: מַיִם עֹלִים
  choice: जल उमड़ रहे हैं
  rationale: शाब्दिक अर्थ ‘जल चढ़ रहे हैं’ है; प्रसंग में उत्तर से बढ़ती आक्रमणकारी बाढ़ का सजीव और स्वाभाविक चित्र बनाए रखने के लिए ‘उमड़ रहे हैं’ चुना गया।
- source_word: נַחַל שׁוֹטֵף
  choice: उफनती हुई धारा
  rationale: यह पद तीव्रता से बहकर सब कुछ डुबो देने वाली धारा को दर्शाता है; यह हिन्दी अभिव्यक्ति उस वेग और बाढ़-सदृश प्रभाव को रखती है।
- source_word: אֶרֶץ וּמְלוֹאָהּ
  choice: देश और उसमें जो कुछ है
  rationale: ‘देश और उसकी परिपूर्णता’ के हिब्रू मुहावरे को सहज हिन्दी में व्यक्त करते हुए उसकी व्यापकता सुरक्षित रखी गई है।
- source_word: וְיִשְׁטְפוּ
  choice: बहा ले जाएँगे
  rationale: क्रिया का अर्थ बाढ़ की तरह ढकना या बहा ले जाना हो सकता है; यहाँ विनाशकारी धारा के रूपक में ‘बहा ले जाएँगे’ स्वाभाविक है।
- source_word: הָאָדָם
  choice: मनुष्य
  rationale: एकवचन सामूहिक संज्ञा समस्त प्रभावित मानव-समुदाय को दर्शाती है; ‘मनुष्य’ इस सामूहिक अर्थ और मूल की अनिश्चित व्यापकता को बनाए रखता है।
- source_word: הֵילִל
  choice: विलाप करेगा
  rationale: क्रिया ऊँचे स्वर से शोक करने को दर्शाती है; ‘विलाप’ dignified और अर्थ-सटीक हिन्दी है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में सामान्य उपाधि नहीं, वाचा-संबंधी विशिष्ट नाम है। हिन्दी पाठक के लिए परिचित रूप ‘यहोवा’ नाम और ‘प्रभु’ उपाधि के बीच भेद बनाए रखता है।
- issue: बाढ़ के बिंब का निहितार्थ
  choice: बाढ़ के चित्र को बिना व्याख्यात्मक विस्तार के रखा गया
  alternative: इसे सीधे शत्रु-सेना या बाबुल की सेना कहना
  rationale: पद स्वयं रूपक को स्पष्ट नहीं करता; इसलिए अनुवाद मूल की काव्यात्मकता और निहित अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण भविष्यद्वाणी शैली और सामान्य पाठक के लिए सहज वाक्य-विन्यास। ‘यों कहता है’, ‘उफनती हुई धारा’ और ‘विलाप करेगा’ जैसे पद मूल की गंभीरता तथा काव्यात्मक शक्ति बनाए रखते हैं।
