  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: מִ/קּ֗וֹל שַֽׁעֲטַת֙ פַּרְס֣וֹת אַבִּירָ֔י/ו מֵ/רַ֣עַשׁ לְ/רִכְבּ֔/וֹ הֲמ֖וֹן גַּלְגִּלָּ֑י/ו לֹֽא הִפְנ֤וּ אָבוֹת֙ אֶל בָּנִ֔ים מֵֽ/רִפְי֖וֹן יָדָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/047/003.yaml
  text: At the sound of the stamping of the hooves of his mighty horses[a], at the rumbling of his chariots, at the roar of his wheels, fathers do not turn to their sons because of the helplessness of their hands.
translation:
  language: hi
  text: उसके शक्तिशाली घोड़ों के खुरों की धमक सुनकर, उसके रथों की गड़गड़ाहट और उसके पहियों का घोर शोर सुनकर, पिता अपने बेटों की ओर नहीं मुड़ते, क्योंकि उनके हाथ ढीले पड़ गए हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप में, “हाथों की शिथिलता के कारण”; यह भय से शक्ति और साहस चुक जाने, अर्थात असहाय हो जाने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקּוֹל שַׁעֲטַת פַּרְסוֹת
  choice: खुरों की धमक सुनकर
  rationale: यह पदबंध खुरों की तीव्र, भारी आवाज़ को सामने रखता है। ‘धमक’ युद्ध-काव्य की श्रव्य और गतिशील छवि को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אַבִּירָיו
  choice: उसके शक्तिशाली घोड़ों
  rationale: शाब्दिक अर्थ ‘उसके शक्तिशाली जन/प्राणी’ हो सकता है, पर निकटवर्ती ‘खुरों’ के कारण यहाँ बलवान युद्ध-घोड़े अभिप्रेत हैं।
- source_word: מֵרַעַשׁ לְרִכְבּוֹ
  choice: उसके रथों की गड़गड़ाहट
  rationale: रַעַשׁ भारी कंपनयुक्त शोर को व्यक्त करता है और רֶכֶב यहाँ सामूहिक रूप से रथ-दल को सूचित करता है; ‘गड़गड़ाहट’ इस युद्ध-दृश्य के लिए सहज है।
- source_word: הֲמוֹן גַּלְגִּלָּיו
  choice: उसके पहियों का घोर शोर
  rationale: הֲמוֹן भीड़ का कोलाहल अथवा प्रचंड शोर व्यक्त कर सकता है। ‘घोर शोर’ पहियों की भयकारी ध्वनि को रखता है और अस्वाभाविक मानवीकरण से बचता है।
- source_word: לֹא הִפְנוּ אָבוֹת אֶל בָּנִים
  choice: पिता अपने बेटों की ओर नहीं मुड़ते
  rationale: हिब्रू में पिता और बेटे स्पष्टतः पुल्लिंग बहुवचन हैं। ‘की ओर नहीं मुड़ते’ क्रिया के मूल स्थानिक अर्थ और संकट में उपेक्षा की तीव्रता दोनों को बनाए रखता है।
- source_word: מֵרִפְיוֹן יָדָיִם
  choice: क्योंकि उनके हाथ ढीले पड़ गए हैं
  rationale: शाब्दिक शारीरिक बिंब को बनाए रखते हुए यह हिन्दी में भय अथवा हताशा से शक्ति और साहस चुक जाने का भाव स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: लिंग-विशिष्ट पारिवारिक शब्द
  choice: पिता ... बेटे
  alternative: माता-पिता ... बच्चे
  rationale: मूल पाठ में אָבוֹת और בָּנִים विशेष रूप से ‘पिता’ और ‘बेटे’ हैं; व्यापक लिंग-निरपेक्ष रूप मूल की विशिष्टता को बदल देता।
- issue: हाथ ढीले पड़ने के मुहावरे का आशय
  choice: शारीरिक बिंब सहित असहाय निर्बलता
  alternative: केवल ‘वे घबरा गए हैं’
  rationale: संदर्भ भय और घबराहट का संकेत देता है, किंतु मूल पाठ सीधे मानसिक अवस्था का नाम न लेकर हाथों की शिथिलता कहता है। इसलिए बिंब रखा गया और उसका अर्थ पादटिप्पणी में स्पष्ट किया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और श्रव्य युद्ध-बिंबों से युक्त हिन्दी। ‘धमक’, ‘गड़गड़ाहट’ और ‘घोर शोर’ मूल की क्रमिक ध्वनि-तीव्रता को व्यक्त करते हैं। पादटिप्पणी-चिह्न उसी मुहावरे के बाद रखा गया है जिसकी वह व्याख्या करता है।
