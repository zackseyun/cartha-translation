base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/047/001.yaml
  text: This is the word of Yahweh that came to Jeremiah the prophet concerning the Philistines[b][a], before Pharaoh struck Gaza.
translation:
  language: hi
  text: यह याहवे का वह वचन है, जो यिर्मयाह भविष्यद्वक्ता के पास फ़िलिस्तियों के विषय में[a][b] आया, इससे पहले कि फ़िरौन ने गाज़ा पर प्रहार किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो यिर्मयाह भविष्यद्वक्ता के पास फ़िलिस्तियों के विषय में आया।” इब्रानी पाठ सापेक्ष रचना से आरम्भ होता है, जो यहाँ शीर्षक का काम करती है।
    reason: lexical_alternative
  - marker: b
    text: या, “फ़िलिस्तियों के विरुद्ध।” यह पूर्वसर्ग किसी भविष्यद्वाणी का विषय बता सकता है और न्याय के संदर्भ में विरोधी अर्थ भी दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר הָיָה דְבַר יְהוָה
  choice: यह याहवे का वह वचन है, जो … आया
  rationale: इब्रानी का आरम्भ सापेक्ष उपवाक्य से बनी शीर्षक-सदृश रचना है। हिंदी में ‘यह … वह वचन है, जो’ उसके शीर्षकीय कार्य और मूल सापेक्षता दोनों को स्वाभाविक ढंग से बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिंदी लिप्यंतरण में प्रस्तुत किया गया है।
- source_word: אֶל יִרְמְיָהוּ הַנָּבִיא
  choice: यिर्मयाह भविष्यद्वक्ता के पास
  rationale: यहाँ אֶל प्रकाशनात्मक वचन के प्राप्तकर्ता को सूचित करता है; ‘के पास आया’ आधुनिक हिंदी में स्वाभाविक भविष्यद्वाणी-सूत्र है।
- source_word: אֶל פְּלִשְׁתִּים
  choice: फ़िलिस्तियों के विषय में
  rationale: भविष्यद्वाणी के शीर्षक में אֶל विषय अथवा लक्ष्य बता सकता है। ‘के विषय में’ व्यापक अर्थ सुरक्षित रखता है और विरोधी भाव को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: בְּטֶרֶם
  choice: इससे पहले कि
  rationale: यह आगामी ऐतिहासिक घटना के सापेक्ष वचन का समय बताने वाला स्पष्ट और स्वाभाविक हिंदी संयोजक है।
- source_word: יַכֶּה
  choice: प्रहार किया
  rationale: נכה के हिफ़ील रूप में मारने, आक्रमण करने या पराजित करने का अर्थ हो सकता है। ‘प्रहार किया’ मूल क्रिया की व्यापकता को ‘जीत लिया’ की अपेक्षा बेहतर बनाए रखता है।
- source_word: עַזָּה
  choice: गाज़ा
  rationale: स्थान-नाम का प्रचलित आधुनिक हिंदी रूप।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में व्यक्तिगत वाचा-नाम सीधे आया है; इसलिए उसे किसी उपाधि से प्रतिस्थापित न करके लिप्यंतरित किया गया है।
- issue: फ़िलिस्तियों के संबंध में אֶל का भाव
  choice: के विषय में
  alternative: के विरुद्ध
  rationale: व्यापक प्रसंग न्याय का है, फिर भी इस शीर्षक में पूर्वसर्ग विषय और प्रतिकूल लक्ष्य—दोनों की गुंजाइश रखता है। मुख्य पाठ तटस्थ व्यापक अर्थ देता है और वैकल्पिक विरोधी अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘वचन’, ‘भविष्यद्वक्ता’ और ‘याहवे’ मूल के भविष्यद्वाणी-संबंधी तथा धार्मिक भार को बनाए रखते हैं; वाक्य-विन्यास हिंदी की पठनीयता के अनुसार व्यवस्थित है।
