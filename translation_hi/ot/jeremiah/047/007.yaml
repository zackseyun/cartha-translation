source:
  edition: WLC
  text: אֵ֣יךְ תִּשְׁקֹ֔טִי וַֽ/יהוָ֖ה צִוָּה לָ֑/הּ אֶֽל אַשְׁקְל֛וֹן וְ/אֶל ח֥וֹף הַ/יָּ֖ם שָׁ֥ם יְעָדָֽ/הּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/047/007.yaml
  text: How can you be quiet when Yahweh has commanded it? Against Ashkelon and against the seacoast—there he has appointed it[a][b].
translation:
  language: hi
  text: तुम कैसे शांत रह सकती हो, जब याहवे ने उसे आज्ञा दी है?[a] अश्कलोन और समुद्र-तट के विरुद्ध—वहाँ उसने उसे नियुक्त किया है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में, ‘उसे आज्ञा दी है’; ‘उसे’ उस तलवार की ओर संकेत करता है जिसे पिछले पद में व्यक्तिवत् संबोधित किया गया है।
    reason: मूल के स्त्रीलिंग एकवचन प्रत्यय और उसके संदर्भ को स्पष्ट करना।
  - marker: b
    text: या, ‘अश्कलोन और समुद्र-तट की ओर’; इब्रानी पूर्वसर्ग मूलतः दिशा बताता है, पर यहाँ तलवार के दंडात्मक अभियान के कारण विरोध का भाव निहित है।
    reason: पूर्वसर्ग के अधिक शाब्दिक विकल्प और प्रसंगगत अर्थ को सुरक्षित रखना।
lexical_decisions:
- source_word: אֵיךְ תִּשְׁקֹטִי
  choice: तू कैसे शांत रह सकती है
  rationale: אֵיךְ यहाँ असंभवता दर्शाने वाला आलंकारिक प्रश्न आरम्भ करता है। שׁקט का अर्थ शांत या निष्क्रिय रहना है; स्त्रीलिंग एकवचन संबोधन पिछले पद की व्यक्तिरूप में संबोधित तलवार से जुड़ता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: צִוָּה לָהּ
  choice: उसने उसे आज्ञा दी है
  rationale: לָהּ तीसरे पुरुष स्त्रीलिंग एकवचन का प्रत्यय है, जिसका संकेत पिछले पद की तलवार की ओर है। हिन्दी में ‘उसे’ मूल के व्याकरणिक रूप को बनाए रखता है, यद्यपि उसी तलवार को पहले सीधे ‘तू’ कहकर संबोधित किया गया है।
- source_word: אֶל אַשְׁקְלוֹן וְאֶל חוֹף הַיָּם
  choice: अश्कलोन और समुद्र-तट के विरुद्ध
  rationale: אֶל का मूल दिशात्मक अर्थ ‘की ओर’ है, पर तलवार को सौंपे गए दंड के प्रसंग में यहाँ विरोधी लक्ष्य का भाव है। ‘के विरुद्ध’ उस प्रसंगगत बल को स्वाभाविक हिन्दी में व्यक्त करता है; अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: שָׁם יְעָדָהּ
  choice: वहीं उसने उसे नियुक्त किया है
  rationale: שָׁם पहले बताए गए स्थानों की ओर संकेत करता है। יעד का अर्थ नियुक्त या निर्धारित करना है, और स्त्रीलिंग प्रत्यय फिर तलवार की ओर संकेत करता है।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम है; उसका लिप्यंतरण नाम और उपाधि के बीच भेद बनाए रखता है।
- issue: स्त्रीलिंग एकवचन सर्वनामों का संदर्भ
  choice: इन्हें पिछले पद की व्यक्तिरूप में प्रस्तुत तलवार का संदर्भ माना गया है
  alternative: सभी रूपों को सीधे दूसरे पुरुष ‘तुझे’ के रूप में ढालना
  rationale: इब्रानी पहले तलवार को सीधे स्त्रीलिंग एकवचन में संबोधित करता है, फिर उसके लिए तीसरे पुरुष स्त्रीलिंग प्रत्ययों का प्रयोग करता है। हिन्दी पाठ और पादटिप्पणी इस असामान्य किंतु वास्तविक बदलाव को मिटाते नहीं हैं।
- issue: אֶל का दिशात्मक या विरोधात्मक अर्थ
  choice: के विरुद्ध
  alternative: की ओर
  rationale: तलवार और दंड के संदर्भ में विरोधात्मक लक्ष्य निहित है, फिर भी मूल पूर्वसर्ग का अधिक शाब्दिक दिशात्मक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, काव्यात्मक और सहज शैली रखी गई है। तलवार के लिए ‘तू’ का प्रयोग पिछले पद के प्रत्यक्ष संबोधन और स्त्रीलिंग रूप को बनाए रखता है; बाद का ‘उसे’ मूल पाठ के तीसरे पुरुष रूप को जानबूझकर सुरक्षित रखता है।
