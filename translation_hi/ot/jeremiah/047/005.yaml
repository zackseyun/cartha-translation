  edition: WLC
  text: בָּ֤אָה קָרְחָה֙ אֶל עַזָּ֔ה נִדְמְתָ֥ה אַשְׁקְל֖וֹן שְׁאֵרִ֣ית עִמְקָ֑/ם עַד מָתַ֖י תִּתְגּוֹדָֽדִי־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/047/005.yaml
  text: Baldness has come upon Gaza[a]; Ashkelon has been silenced, the remnant of their valley[c][b]. How long will you gash yourself?
translation:
  language: hi
  text: गाज़ा पर गंजापन आ पड़ा है[a]; अश्कलोन—उनकी तराई का बचा हुआ भाग—चुप करा दिया गया है[b][c]। तू कब तक अपने शरीर को चीरती रहेगी?[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: सिर मुंडाना या गंजापन प्राचीन निकट पूर्व में शोक और विपत्ति का प्रचलित चिह्न था।
    reason: cultural_note
  - marker: b
    text: इस इब्रानी क्रिया का अर्थ ‘मौन कर दिया गया,’ ‘काट दिया गया’ या ‘नष्ट कर दिया गया’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में ‘उनकी तराई का बचा हुआ भाग।’ कुछ प्राचीन अनुवादों या भिन्न पाठ-पद्धति के आधार पर इसे ‘अनाकियों का बचा हुआ भाग’ भी समझा गया है।
    reason: alternative_reading
  - marker: d
    text: शोक प्रकट करने के लिए अपने शरीर को चीरना प्राचीन निकट पूर्व की एक प्रथा थी।
    reason: cultural_note
lexical_decisions:
- source_word: קָרְחָה
  choice: गंजापन
  rationale: यह संज्ञा शोक के चिह्न के रूप में सिर के बाल मुंड जाने या मुंडाने की दशा को दर्शाती है। ‘गंजापन’ मूल बिंब को बिना उसे आदेश या क्रिया बनाए बनाए रखता है।
- source_word: בָּאָה ... אֶל עַזָּה
  choice: गाज़ा पर ... छा गया है
  rationale: בוא के साथ אֶל यहाँ किसी विपत्ति के गाज़ा पर आ पड़ने का भाव देता है। हिंदी में ‘पर ... छा गया है’ अशुभ आगमन और गंजेपन के व्यापक शोक-चिह्न दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: נִדְמְתָה
  choice: चुप करा दिया गया है
  rationale: दמה के निफ़अल रूप में मौन, निश्चल या नष्ट कर दिए जाने के अर्थ संभव हैं। यह चयन मौन कर दिए जाने का मूल बिंब रखता है और युद्ध-संदर्भ में विनाश की ध्वनि को खुला छोड़ता है।
- source_word: שְׁאֵרִית
  choice: बचा हुआ भाग
  rationale: यह न्याय या विनाश के बाद शेष बचे अंश को दर्शाता है। यहाँ निर्जीव/सामूहिक भौगोलिक पदबंध के साथ ‘बचा हुआ भाग’ सहज है और केवल जीवित बचे लोगों तक अर्थ को सीमित नहीं करता।
- source_word: עִמְקָם
  choice: उनकी तराई
  rationale: मसोरेटिक व्यंजन-पाठ को עֵמֶק (‘घाटी/तराई’) और तृतीय पुरुष बहुवचन प्रत्यय के रूप में प्रस्तुत किया गया है। पलिश्ती भूगोल के संदर्भ में ‘तराई’ स्वाभाविक हिंदी है; वैकल्पिक प्राचीन पाठ-परंपरा पादटिप्पणी में रखी गई है।
- source_word: תִּתְגּוֹדָדִי
  choice: तू ... अपने शरीर को चीरती रहेगी
  rationale: גדד का आत्मवाचक रूप शोक में स्वयं को काटने या चीरने की प्रथा बताता है। स्त्रीलिंग एकवचन रूप को ‘तू’ और स्त्रीलिंग क्रिया से सुरक्षित रखा गया है; ‘शरीर’ जोड़ने से आधुनिक हिंदी में आशय स्पष्ट होता है।
- source_word: עַד מָתַי
  choice: कब तक
  rationale: यह प्रश्नसूचक सूत्र का स्वाभाविक और सटीक हिंदी रूप है।
theological_decisions:
- issue: अंतिम प्रश्न में स्त्रीलिंग एकवचन संबोधन की पहचान
  choice: ‘तू ... चीरती रहेगी’ द्वारा व्याकरणिक स्त्रीलिंग और संबोधन की अस्पष्ट पहचान बनाए रखी गई
  alternative: स्पष्ट रूप से ‘हे अश्कलोन’ या ‘हे गाज़ा’ जोड़ना
  rationale: इब्रानी क्रिया स्त्रीलिंग एकवचन है, पर इस पंक्ति में संबोधित नगर का नाम स्पष्ट रूप से दोहराया नहीं गया। किसी एक नगर को निश्चित करना मूल की संभावित अस्पष्टता को अनावश्यक रूप से समाप्त कर देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। नगरों के प्रचलित हिंदी रूप ‘गाज़ा’ और ‘अश्कलोन’ अपनाए गए हैं। काव्यात्मक समानांतरता के लिए अर्धविराम और दीर्घ विराम का प्रयोग हुआ है। अंतिम संबोधन में इब्रानी का स्त्रीलिंग एकवचन सुरक्षित है, पर संबोधित नगर का नाम नहीं जोड़ा गया।
