source:
  edition: WLC
  text: ה֗וֹי חֶ֚רֶב לַֽ/יהוָ֔ה עַד אָ֖נָה לֹ֣א תִשְׁקֹ֑טִי הֵאָֽסְפִי֙ אַל תַּעְרֵ֔/ךְ הֵרָגְעִ֖י וָ/דֹֽמִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/047/006.yaml
  text: Ah, sword of the LORD, how long will you not be quiet? Return to your sheath; rest and be still.
translation:
  language: hi
  text: हाय, यहोवा की तलवार! तू कब तक शांत नहीं होगी? अपनी म्यान में लौट जा; विश्राम कर और चुप रह।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוֹי
  choice: हाय
  rationale: यह विस्मय और विलाप की पुकार है; ‘हाय’ आधुनिक हिन्दी में भाव और संक्षिप्तता दोनों बनाए रखता है।
- source_word: חֶרֶב לַיהוָה
  choice: यहोवा की तलवार
  rationale: लַיהוָה यहाँ संबंध/अधिकार व्यक्त करता है; परमेश्वर के व्यक्तिगत नाम יהוה को ‘यहोवा’ से स्पष्ट किया गया है।
- source_word: עַד־אָנָה לֹא תִשְׁקֹטִי
  choice: तू कब तक शांत न होगी?
  rationale: स्त्रीलिंग संबोधन तलवार के अनुरूप रखा गया है और मूल का नकारात्मक प्रश्न सुरक्षित है।
- source_word: הֵאָסְפִי אֶל־תַּעְרֵךְ
  choice: अपनी म्यान में लौट जा
  rationale: शाब्दिक भाव ‘अपने म्यान में समेटी/इकट्ठी हो जा’ है; हिन्दी में तलवार के लिए ‘म्यान में लौट जा’ स्वाभाविक और अर्थनिष्ठ है।
- source_word: הֵרָגְעִי וָדֹמִּי
  choice: विश्राम कर और चुप रह
  rationale: दोनों आज्ञाओं के अलग भाव—स्थिर/विश्राम करना और मौन होना—को अलग-अलग रखा गया है।
theological_decisions:
- issue: יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में सामान्य उपाधि नहीं, परमेश्वर का व्यक्तिगत नाम है; ‘यहोवा’ हिन्दी पाठक के लिए पहचाना जाने वाला प्रत्यक्ष रूप है।
- issue: तलवार का मानवीकरण
  choice: स्त्रीलिंग एकवचन में सीधे संबोधन और आज्ञाएँ
  alternative: अव्यक्त या वर्णनात्मक रूप
  rationale: इब्रानी पाठ तलवार को सीधे संबोधित करता है; इस काव्यात्मक और धर्मवैचारिक तनाव को बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; काव्यात्मक विलाप और प्रत्यक्ष संबोधन को संक्षिप्त, गरिमापूर्ण और सहज भाषा में रखा गया है।
