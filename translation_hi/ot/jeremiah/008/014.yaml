id: JER.8.14
reference: Jeremiah 8:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: עַל מָה֙ אֲנַ֣חְנוּ יֹֽשְׁבִ֔ים הֵֽאָסְפ֗וּ וְ/נָב֛וֹא אֶל עָרֵ֥י הַ/מִּבְצָ֖ר וְ/נִדְּמָה שָּׁ֑ם כִּי֩ יְהוָ֨ה אֱלֹהֵ֤י/נוּ הֲדִמָּ֨/נוּ֙ וַ/יַּשְׁקֵ֣/נוּ מֵי רֹ֔אשׁ כִּ֥י חָטָ֖אנוּ לַ/יהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/014.yaml
  text: Why are we sitting still? Gather yourselves[a], and let us enter the fortified cities and perish there, for Yahweh our God has doomed us and given us poisoned water to drink[b], because we have sinned against Yahweh.
translation:
  language: hi
  text: हम क्यों बैठे रहें? इकट्ठे हो जाओ; आओ, हम किलेबंद नगरों में चलें और वहीं नष्ट हो जाएँ[a], क्योंकि याहवे, हमारे परमेश्वर ने, हमें विनाश के लिए ठहरा दिया है और हमें विषैला पानी पिलाया है[b], क्योंकि हमने याहवे के विरुद्ध पाप किया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वहीं चुप हो जाएँ” अथवा “वहीं मिट जाएँ”; इब्रानी क्रिया में चुप या स्थिर हो जाने और विनष्ट होने—दोनों के अर्थ संभव हैं।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “विष का पानी” या “विषैले पौधे का पानी”।
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשְׁבִים
  choice: बैठे हुए हैं
  rationale: मूल अर्थ ‘बैठना/ठहरे रहना’ है। आलंकारिक प्रश्न में निष्क्रिय बने रहने का भाव संदर्भ से स्पष्ट होता है; यह अनुवाद मूल बिंब को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: הֵאָסְפוּ
  choice: इकट्ठे हो जाओ
  rationale: निफ़अल आज्ञार्थक रूप यहाँ लोगों को तत्काल एकत्र होने का आह्वान करता है। यह आधुनिक हिन्दी में स्वाभाविक और तत्परता से भरा है।
- source_word: עָרֵי הַמִּבְצָר
  choice: गढ़वाले नगर
  rationale: पदबंध सुरक्षा-प्राचीरों से दृढ़ किए गए नगरों को दर्शाता है। ‘गढ़वाले नगर’ साधारण पाठक के लिए स्पष्ट है और सैन्य-सुरक्षा का भाव रखता है।
- source_word: וְנִדְּמָה
  choice: और वहीं नष्ट हो जाएँ
  rationale: דמה का अर्थ चुप या स्थिर हो जाना और विनष्ट हो जाना—दोनों हो सकता है। आक्रमण, न्याय और अगले समजात क्रियारूप के संदर्भ में विनाश का अर्थ प्रमुख है; वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: הֲדִמָּנוּ
  choice: हमारा विनाश ठहरा दिया है
  rationale: हिफ़ईल रूप लोगों को चुप करा देने अथवा विनाश के लिए नियत कर देने का भाव दे सकता है। यहाँ न्याय के संदर्भ में ‘विनाश ठहरा दिया’ उपयुक्त है और पिछले דמה रूप के साथ शब्दगत संबंध भी बनाए रखता है।
- source_word: מֵי רֹאשׁ
  choice: विषैला पानी
  rationale: רֹאשׁ किसी विषैले या अत्यंत कड़वे पौधे अथवा पदार्थ को सूचित करता है। ‘विषैला पानी’ ठोस बिंब और घातकता को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: חָטָאנוּ לַיהוָה
  choice: हमने याहवे के विरुद्ध पाप किया है
  rationale: हिन्दी में अपराध के लक्ष्य को ‘के विरुद्ध’ से व्यक्त करना स्वाभाविक है और परमेश्वर के प्रति किए गए पाप का भाव स्पष्ट करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले व्यक्तिगत ईश्वरीय नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
theological_decisions:
- issue: דמה के दोनों रूपों में ईश्वरीय न्याय का आशय
  choice: लोग मानते हैं कि याहवे ने उनका विनाश ठहरा दिया है और वे गढ़वाले नगरों में भी नष्ट होंगे।
  alternative: वे नगरों में चुपचाप रहें और याहवे ने उन्हें चुप करा दिया है।
  rationale: मूल धातु में मौन, स्थिरता और विनाश के अर्थों का तनाव है। आक्रमण, विषैले पानी और पाप-स्वीकार के निकट संदर्भ में विनाश प्रमुख है, पर वास्तविक शाब्दिक अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। प्रत्यक्ष सामूहिक वाणी की तत्परता के लिए छोटे आज्ञार्थक और आह्वानात्मक वाक्यांश प्रयुक्त हुए हैं। ‘नष्ट हो जाएँ/विनाश ठहरा दिया’ से मूल में एक ही धातु की पुनरावृत्ति का कुछ प्रभाव सुरक्षित है।
