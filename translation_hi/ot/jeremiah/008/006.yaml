source:
  edition: WLC
  text: הִקְשַׁ֤בְתִּי וָֽ/אֶשְׁמָע֙ לוֹא כֵ֣ן יְדַבֵּ֔רוּ אֵ֣ין אִ֗ישׁ נִחָם֙ עַל רָ֣עָת֔/וֹ לֵ/אמֹ֖ר מֶ֣ה עָשִׂ֑יתִי כֻּלֹּ֗/ה שָׁ֚ב ב/מרצות/ם כְּ/ס֥וּס שׁוֹטֵ֖ף בַּ/מִּלְחָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/006.yaml
  text: 'I have paid attention and listened: they do not speak rightly[a]. No man repents of his evil, saying, ‘What have I done?’ Every one turns in his own course[c][b], like a horse rushing into battle.'
translation:
  language: hi
  text: 'मैंने ध्यान दिया और सुना: वे ठीक बात नहीं कहते[a]। कोई आदमी[b] अपनी बुराई पर पश्चात्ताप नहीं करता कि कहे, “मैंने यह क्या किया?” हर एक अपनी ही दौड़ में लौट पड़ता है[c], जैसे घोड़ा युद्ध में वेग से झपट पड़ता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे वह नहीं कहते जो ठीक है।” शाब्दिक अर्थ है, “वे ऐसा नहीं बोलते।”
    reason: lexical_alternative
  - marker: b
    text: “आदमी” के लिए इब्रानी में पुल्लिंग एकवचन शब्द है, जो यहाँ प्रतिनिधिक रूप से प्रयुक्त हुआ है।
    reason: lexical_alternative
  - marker: c
    text: या, “हर एक अपनी ही राह पर लौट पड़ता है।” इब्रानी में ‘दौड़’ की छवि अपने चुने हुए रास्ते पर उतावलेपन से बढ़ते जाने को दिखाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִקְשַׁבְתִּי וָאֶשְׁמָע
  choice: मैंने ध्यान दिया और सुना
  rationale: दोनों क्रियाओं को अलग रखते हुए पहली की सावधान एकाग्रता और दूसरी के सुनने के अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לוֹא כֵן יְדַבֵּרוּ
  choice: वे ठीक बात नहीं कहते
  rationale: शाब्दिक अर्थ ‘वे ऐसा नहीं बोलते’ है; प्रसंग में उनके कथन के ठीक या उचित न होने का भाव है।
- source_word: אֵין אִישׁ
  choice: कोई आदमी नहीं
  rationale: אִישׁ पुल्लिंग एकवचन है और यहाँ समुदाय के प्रत्येक व्यक्ति के लिए प्रतिनिधिक रूप में प्रयुक्त हुआ है।
- source_word: נִחָם עַל רָעָתוֹ
  choice: अपनी बुराई पर पश्चात्ताप करता
  rationale: नैतिक बुराई के विषय में खेद और मन-परिवर्तन के भाव को बनाए रखता है; केवल दुःखी होने तक अर्थ को सीमित नहीं करता।
- source_word: מֶה עָשִׂיתִי
  choice: मैंने यह क्या किया?
  rationale: मूल के आत्म-परीक्षण वाले सीधे प्रश्न को बिना ‘गलत’ शब्द जोड़े प्रस्तुत करता है।
- source_word: כֻּלֹּה שָׁב בִּמְרֻצוֹתָם
  choice: हर एक अपनी ही दौड़ में लौट जाता है
  rationale: כֻּלֹּה का वितरणात्मक भाव, שָׁב की लौटने की क्रिया और מרוצה की दौड़ या तीव्र मार्ग की छवि सुरक्षित रहती है। हिन्दी में ‘अपनी’ प्रतिनिधिक व्यक्ति और सामूहिक बहुवचन प्रत्यय दोनों के आशय को सहज रूप देती है।
- source_word: כְּסוּס שׁוֹטֵף בַּמִּלְחָמָה
  choice: जैसे घोड़ा युद्ध में वेग से झपटता है
  rationale: שׁוֹטֵף की प्रबल, अनियंत्रित आगे बढ़ने की छवि को युद्ध की ओर झपटते घोड़े के सजीव उपमान से व्यक्त करता है।
theological_decisions:
- issue: אִישׁ का प्रतिनिधिक पुल्लिंग एकवचन
  choice: कोई आदमी
  alternative: कोई भी व्यक्ति
  rationale: मूल के पुल्लिंग एकवचन रूप को बनाए रखा गया है, जबकि प्रसंग में उसका आशय लोगों में से प्रत्येक से है।
- issue: נִחָם का नैतिक अर्थ
  choice: पश्चात्ताप करता
  alternative: पछताता है
  rationale: यहाँ बुराई के विषय में केवल भावनात्मक खेद नहीं, उससे मन फेरने का अपेक्षित भाव भी उपस्थित है; फिर भी वाक्य यह दावा नहीं करता कि ऐसा परिवर्तन वास्तव में हुआ।
- issue: שָׁב का दिशात्मक भाव
  choice: अपनी ही दौड़ में लौट जाता है
  alternative: अपनी ही राह पर मुड़ जाता है
  rationale: שׁוב को सकारात्मक धार्मिक परिवर्तन के अर्थ में नहीं लिया गया; यहाँ व्यक्ति अपनी चुनी हुई, उतावली चाल में फिर जा पड़ता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है। शैली गरिमापूर्ण किंतु सहज रखी गई है। ‘दौड़’ और युद्ध में झपटते घोड़े की परस्पर जुड़ी काव्यात्मक छवियों को सुरक्षित रखा गया है; सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
