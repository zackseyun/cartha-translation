id: JER.8.1
reference: Jeremiah 8:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בָּ/עֵ֣ת הַ/הִ֣יא נְאֻם יְהוָ֡ה ו/יציאו אֶת עַצְמ֣וֹת מַלְכֵֽי יְהוּדָ֣ה וְ/אֶת עַצְמוֹת שָׂרָי/ו֩ וְ/אֶת עַצְמ֨וֹת הַ/כֹּהֲנִ֜ים וְ/אֵ֣ת עַצְמ֣וֹת הַ/נְּבִיאִ֗ים וְ/אֵ֛ת עַצְמ֥וֹת יוֹשְׁבֵֽי יְרוּשָׁלִָ֖ם מִ/קִּבְרֵי/הֶֽם־־־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/001.yaml
  text: At that time, declares Yahweh, they will bring out the bones of the kings of Judah, the bones of its officials, the bones of the priests, the bones of the prophets, and the bones of the inhabitants of Jerusalem from their graves.
translation:
  language: hi
  text: उस समय—याहवे की यह घोषणा है—वे यहूदा के राजाओं की हड्डियाँ, यहूदा के अधिकारियों की हड्डियाँ, याजकों की हड्डियाँ, भविष्यवक्ताओं की हड्डियाँ और यरूशलेम के निवासियों की हड्डियाँ उनकी कब्रों से निकालेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: उस समय
  rationale: यह मानक कालसूचक पदबंध है और इब्रानी के संकेतात्मक भाव को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: נְאֻם יְהוָה
  choice: याहवे की यह घोषणा है
  rationale: यह भविष्यवाणी में प्रयुक्त औपचारिक उद्घोषणा-सूत्र है; यह अनुवाद उसके गरिमापूर्ण और प्रामाणिक स्वर को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का विशिष्ट नाम है; उसे किसी उपाधि से बदलने के बजाय देवनागरी लिप्यंतरण में रखा गया है।
- source_word: וְיֹצִיאוּ
  choice: वे ... निकालेंगे
  rationale: हिफ़ील रूप कब्रों में से हड्डियों को बाहर निकाले जाने का अर्थ देता है। कर्ता मूल पाठ की तरह अनिर्दिष्ट बहुवचन रखा गया है।
- source_word: עַצְמוֹת
  choice: हड्डियाँ
  rationale: मूल का ठोस अर्थ और प्रत्येक समूह के साथ उसकी जानबूझकर की गई पुनरावृत्ति सुरक्षित रखी गई है।
- source_word: מַלְכֵי יְהוּדָה
  choice: यहूदा के राजाओं
  rationale: सम्बन्धसूचक इब्रानी पदबंध का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: שָׂרָיו
  choice: उसके अधिकारियों
  rationale: שׂרים यहाँ शासकीय पदाधिकारियों को सूचित करता है। 'उसके' प्रत्यय के सम्भावित सम्बन्ध को अनावश्यक रूप से अधिक स्पष्ट नहीं करता।
- source_word: הַכֹּהֲנִים
  choice: याजकों
  rationale: इस धार्मिक पद का स्थापित और सुबोध हिन्दी पर्याय।
- source_word: הַנְּבִיאִים
  choice: भविष्यवक्ताओं
  rationale: नबी के पद के लिए प्रचलित, अर्थपूर्ण हिन्दी शब्द।
- source_word: יוֹשְׁבֵי יְרוּשָׁלִָם
  choice: यरूशलेम के निवासियों
  rationale: संज्ञा की तरह प्रयुक्त कृदन्त का सामूहिक अर्थ सहज आधुनिक हिन्दी में व्यक्त होता है।
- source_word: מִקִּבְרֵיהֶם
  choice: उनकी कब्रों से
  rationale: קבר का सामान्य अर्थ 'कब्र' है और बहुवचन सम्बन्धसूचक प्रत्यय पूर्वोक्त मृत समूहों की ओर संकेत करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल में चतुरक्षरीय व्यक्तिगत नाम सीधे प्रयुक्त हुआ है। 'याहवे' उसे उपाधि से बदले बिना प्रचलित विद्वत्तापूर्ण उच्चारण के निकट प्रस्तुत करता है।
- issue: '''हड्डियाँ'' की आलंकारिक पुनरावृत्ति'
  choice: हर समूह के साथ 'हड्डियाँ' दोहराना
  alternative: '''हड्डियाँ'' केवल एक बार लिखकर समूहों की सूची देना'
  rationale: इब्रानी पाठ की पुनरावृत्ति आने वाले अपमान की व्यापकता और भयावहता को उभारती है; इसलिए उसे हिन्दी में सुरक्षित रखा गया है।
- issue: שָׂרָיו के प्रत्यय का सम्बन्ध
  choice: उसके अधिकारियों
  alternative: यहूदा के अधिकारियों / राजाओं के अधिकारियों
  rationale: पुल्लिंग एकवचन प्रत्यय का निकटतम सम्बन्ध सन्दर्भ से समझा जाता है, पर हिन्दी का 'उसके' मूल में उपस्थित सीमित अस्पष्टता को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। डैश के भीतर भविष्यवाणी-सूत्र रखने से मुख्य कथन का प्रवाह और मूल का बीच में आया उद्घोषणात्मक स्वर दोनों सुरक्षित रहते हैं।
