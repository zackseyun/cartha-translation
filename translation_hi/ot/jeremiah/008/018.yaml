  text: मेरे शोक में कोई राहत नहीं[a][b]; मेरा हृदय बीमार है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी पाठ कठिन है। इसका अनुवाद यह भी हो सकता है: “मैं शोक में अपने को सांत्वना देता हूँ; मेरा हृदय बीमार है,” अथवा, “मेरा शोक उपचार से परे है।”'
    reason: alternative_reading
  - marker: b
    text: आरम्भिक इब्रानी शब्द संभवतः सांत्वना, राहत, संभलने या उजास का भाव देता है, पर यहाँ उसका ठीक आशय अनिश्चित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַבְלִיגִיתִי
  choice: कोई राहत नहीं
  rationale: यह रूप कठिन और अर्थ की दृष्टि से अनिश्चित है। मूल धातु सांत्वना, राहत, संभलने या उजास का भाव दे सकती है। विलाप के प्रसंग में ‘कोई राहत नहीं’ वक्ता को शोक से उबारने वाली सांत्वना के अभाव को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि अनिश्चितता पादटिप्पणियों में सुरक्षित रखी गई है।
- source_word: עֲלֵי
  choice: में
  rationale: इसका सामान्य स्थानिक अर्थ ‘पर/ऊपर’ है, पर इस संक्षिप्त काव्य-पंक्ति में यह शोक की अवस्था या प्रसंग बताता है; इसलिए ‘में’ सहज हिन्दी है।
- source_word: יָגוֹן
  choice: शोक
  rationale: यह शब्द गहरे दुःख या मातम को दर्शाता है। ‘शोक’ इस विलाप की गरिमा और तीव्रता दोनों बनाए रखता है।
- source_word: לִבִּי
  choice: मेरा हृदय
  rationale: यह मनुष्य के भीतरी भावात्मक और इच्छात्मक व्यक्तित्व का सामान्य इब्रानी रूपक है; यहाँ ‘हृदय’ उपयुक्त और परिचित हिन्दी है।
- source_word: עָלַי
  choice: मेरे भीतर
  rationale: शाब्दिक अर्थ ‘मुझ पर’ है, किंतु हृदय की दशा के साथ यह वक्ता के भीतर अनुभव हो रही पीड़ा बताता है। ‘मेरे भीतर’ हिन्दी में उस अनुभूति को स्पष्ट रखता है।
- source_word: דַוָּי
  choice: रोगी है
  rationale: विशेषण बीमारी, निर्बलता या पीड़ित दशा दर्शाता है। ‘रोगी है’ मूल के शारीरिक रूपक को बनाए रखते हुए आंतरिक व्यथा व्यक्त करता है।
theological_decisions:
- issue: पहले खंड का कर्ता और व्याकरणिक संबंध
  choice: शोक के बीच राहत के अभाव के रूप में प्रस्तुत किया गया
  alternative: ‘मैं शोक में अपने को सांत्वना देता’ या ‘मेरा शोक उपचार से परे है’
  rationale: इब्रानी पाठ अत्यंत कठिन और संक्षिप्त है। मुख्य पाठ प्रसंगानुकूल अर्थ देता है, पर किसी एक व्याकरणिक पुनर्निर्माण को निर्णायक नहीं मानता; प्रमुख विकल्प पादटिप्पणी में रखे गए हैं।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी अपनाई गई है। ‘रोगी हृदय’ के मूल रूपक को बनाए रखा गया है। कठिन पहले खंड को अत्यधिक व्याख्यायित किए बिना मुख्य अर्थ दिया गया और वास्तविक पाठगत-शाब्दिक अनिश्चितता दो पादटिप्पणियों में स्पष्ट की गई है।
