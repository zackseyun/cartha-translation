source:
  edition: WLC
  text: וְ/נִבְחַ֥ר מָ֨וֶת֙ מֵֽ/חַיִּ֔ים לְ/כֹ֗ל הַ/שְּׁאֵרִית֙ הַ/נִּשְׁאָרִ֔ים מִן הַ/מִּשְׁפָּחָ֥ה הָֽ/רָעָ֖ה הַ/זֹּ֑את בְּ/כָל הַ/מְּקֹמ֤וֹת הַ/נִּשְׁאָרִים֙ אֲשֶׁ֣ר הִדַּחְתִּ֣י/ם שָׁ֔ם נְאֻ֖ם יְהוָ֥ה צְבָאֽוֹת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/003.yaml
  text: And death will be chosen rather than life by all the remnant who remain from this evil family[a], in all the places where the remnant remain, where I have driven them—declares Yahweh of hosts.
translation:
  language: hi
  text: और इस दुष्ट कुल के बचे हुए सभी लोगों द्वारा जीवन के बजाय मृत्यु को चुना जाएगा—उन सभी बचे हुए स्थानों में[a] जहाँ मैंने उन्हें खदेड़ दिया है। यह सेनाओं के याहवे की घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “सभी बचे हुए स्थानों में जहाँ मैंने उन्हें वहाँ खदेड़ दिया है।” ‘बचे हुए’ शब्द स्थानों के लिए है; यह निर्वासन के हर स्थान में बिखरे बचे हुए लोगों की स्थिति पर बल देता है।
    reason: मूल इब्रानी की कठिन और पुनरुक्त स्थान-संबंधी अभिव्यक्ति को दर्ज करना।
lexical_decisions:
- source_word: וְנִבְחַר
  choice: चुनी जाएगी
  rationale: בחר के निफ़अल रूप का निष्क्रिय अर्थ बनाए रखा गया है। न्याय के प्रसंग में इसे भविष्यकाल में प्रस्तुत किया गया है।
- source_word: מָוֶת מֵחַיִּים
  choice: जीवन के बजाय मृत्यु
  rationale: מִן यहाँ चुनाव में तुलना या प्राथमिकता व्यक्त करता है; यह पद की तीखी जीवन-मृत्यु विरोधी संरचना को सुरक्षित रखता है।
- source_word: לְכֹל הַשְּׁאֵרִית הַנִּשְׁאָרִים
  choice: बचे हुए सभी लोगों के द्वारा
  rationale: शेष बचे समुदाय को सामान्य आधुनिक हिन्दी में व्यक्त किया गया है। निष्क्रिय क्रिया के साथ לְ को कर्ता-सूचक ‘के द्वारा’ माना गया है; ‘बचे हुए’ की पुनरावृत्ति अगले वाक्य में भी रखी गई है।
- source_word: מִן הַמִּשְׁפָּחָה הָרָעָה הַזֹּאת
  choice: इस दुष्ट कुल के
  rationale: מִשְׁפָּחָה यहाँ केवल छोटे घरेलू परिवार के बजाय व्यापक वंश या समुदाय को सूचित कर सकता है, इसलिए ‘कुल’ चुना गया है। רָעָה का सीधा नैतिक अर्थ ‘दुष्ट’ रखा गया है।
- source_word: בְּכָל הַמְּקֹמוֹת הַנִּשְׁאָרִים
  choice: उन सभी स्थानों में ... जहाँ ये बचे हुए लोग रहेंगे
  rationale: शाब्दिक ‘बचे हुए स्थानों’ का अर्थ हिन्दी में अस्पष्ट होगा। मुख्य पाठ इस कठिन वाक्य-विन्यास को बिखरे हुए जीवित बचे लोगों के निवास-स्थानों के रूप में प्रस्तुत करता है, जबकि शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: אֲשֶׁר הִדַּחְתִּים שָׁם
  choice: जहाँ मैंने उन्हें खदेड़ दिया है
  rationale: הדח के हिफ़इल रूप में दूर कर देने या तितर-बितर कर देने की बलपूर्ण धारणा है। ‘खदेड़ दिया है’ निर्वासन को दैवी न्याय के कार्य के रूप में व्यक्त करता है।
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: यह सेनाओं के याहवे की घोषणा है
  rationale: נְאֻם की भविष्यद्वक्ताई घोषणा-शैली रखी गई है; יהוה को व्यक्तिगत नाम ‘याहवे’ और צְבָאוֹת को अर्थपूर्ण उपाधि ‘सेनाओं के’ के रूप में प्रस्तुत किया गया है।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का रूप
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसे उपाधि में बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: शेष बचे समुदाय की धारणा
  choice: बचे हुए लोग
  alternative: शेष लोग; अवशेष
  rationale: यहाँ बचे हुए लोगों के लिए आशा का अर्थ जोड़ना उचित नहीं है, क्योंकि वे अभी न्याय के अधीन हैं। सामान्य हिन्दी का यह रूप उस तनाव को बनाए रखता है।
- issue: मृत्यु के चुनाव में कर्तृत्व
  choice: मृत्यु चुनी जाएगी ... लोगों के द्वारा
  alternative: लोग मृत्यु को चुनेंगे
  rationale: मूल का निफ़अल निष्क्रिय रूप जानबूझकर बनाए रखा गया है; इससे यह तय नहीं किया गया कि अभिव्यक्ति केवल सक्रिय मानवीय पसंद को ही सूचित करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। मूल के निष्क्रिय वाक्य, ‘बचे हुए’ की पुनरावृत्ति और कठोर न्याय-स्वर को यथासंभव बनाए रखा गया है; लंबे इब्रानी वाक्य को स्पष्टता के लिए दो हिन्दी वाक्यों में बाँटा गया है।
