  text: हमने शांति की आशा की, पर कुछ भला न हुआ; चंगाई के समय की आशा की, पर देखो, दहशत!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קַוֵּה
  choice: हम ... की आशा लगाए थे
  rationale: रूप अपने आप में कुछ अस्पष्ट है, पर सन्दर्भ में यह सामूहिक विलाप के रूप में स्वाभाविक है। यह प्रयोग आशा, प्रतीक्षा और अपेक्षा के मिले-जुले भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: לְשָׁלוֹם
  choice: शान्ति
  rationale: שָׁלוֹם यहाँ शान्ति के साथ कुशलता और सम्पूर्ण भलाई का भी संकेत दे सकता है; मुख्य पाठ में ‘शान्ति’ स्वाभाविक है और व्यापक अर्थ को पादटिप्पणी में रखा गया है।
- source_word: וְאֵין טוֹב
  choice: पर कुछ भला न हुआ
  rationale: शाब्दिक ‘और कोई भलाई नहीं’ का विरोधात्मक आशय वर्तमान हिन्दी में स्पष्ट करता है और अपेक्षा के विफल होने को व्यक्त करता है।
- source_word: לְעֵת מַרְפֵּה
  choice: चंगाई के समय
  rationale: מַרְפֵּה चंगाई, उपचार या बहाली को सूचित करता है। ‘चंगाई’ शारीरिक तथा सामुदायिक/राष्ट्रीय पुनर्स्थापना—दोनों की रूपकात्मक व्यापकता बचाती है।
- source_word: וְהִנֵּה
  choice: पर देखो
  rationale: הִנֵּה अचानक सामने आई विपरीत स्थिति पर ध्यान खींचता है। ‘पर देखो’ आधुनिक और गरिमापूर्ण हिन्दी में उस नाटकीय उलटाव को बनाए रखता है।
- source_word: בְעָתָה
  choice: आतंक
  rationale: यह शब्द भय, घबराहट या दहशत का बोध कराता है। ‘आतंक’ अपेक्षित चंगाई के विपरीत आए तीव्र भय को संक्षेप और प्रभावी ढंग से व्यक्त करता है।
