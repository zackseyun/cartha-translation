  register: भाषा आधुनिक, गम्भीर और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘दण्डवत’ धार्मिक और शारीरिक दोनों भावों को स्वाभाविक रूप से व्यक्त करता है। वाक्य में दोहराई गई क्रियाओं को संक्षिप्त किए बिना प्रवाहपूर्ण हिन्दी क्रम दिया गया है।
