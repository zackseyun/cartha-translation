base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/002.yaml
  text: And they will spread them out before the sun and the moon and all the host of the heavens[a], which they loved and which they served and after which they walked and which they sought and to which they bowed down. They will not be gathered, and they will not be buried[c][b]; they will become dung on the surface of the ground.
translation:
  language: hi
  text: और वे उन्हें सूर्य, चन्द्रमा और आकाश की सारी सेना[a] के सामने फैला देंगे—जिनसे उन्होंने प्रेम किया, जिनकी सेवा की, जिनके पीछे चले, जिन्हें खोजा[b], और जिनके आगे दण्डवत किया। वे न तो इकट्ठे किए जाएँगे और न दफ़नाए जाएँगे; वे भूमि की सतह पर[c] मल बन जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “आकाश की सारी सेना” से आशय सूर्य, चन्द्रमा, तारों और अन्य आकाशीय पिंडों के समूह से है। इसे “आकाश का सारा तारागण” भी कहा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: “जिन्हें खोजा” का अर्थ यहाँ “जिनसे उन्होंने पूछा” या “जिनसे परामर्श लिया” भी हो सकता है—अर्थात धार्मिक मार्गदर्शन के लिए आकाशीय पिंडों की ओर मुड़ना।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “भूमि के मुख पर।”
    reason: literal_rendering
lexical_decisions:
- source_word: וּשְׁטָחוּם
  choice: वे उन्हें ... के सामने फैला देंगे
  rationale: क्रिया שׁטח यहाँ पिछले पद में उल्लिखित अवशेषों को निकालकर खुले में फैला देने का ठोस चित्र प्रस्तुत करती है। सर्वनाम ‘उन्हें’ मूल पाठ के पूर्वसंदर्भ को बिना अनावश्यक विस्तार के बनाए रखता है।
- source_word: לַשֶּׁמֶשׁ וְלַיָּרֵחַ
  choice: सूर्य, चन्द्रमा ... के सामने
  rationale: लामेद को इस प्रसंग में दिशा के बजाय उन खगोलीय पिंडों के सामने खुले में रखे जाने के अर्थ में स्वाभाविक हिन्दी ‘के सामने’ से व्यक्त किया गया है।
- source_word: וּלְכֹל צְבָא הַשָּׁמַיִם
  choice: आकाश की सारी सेना
  rationale: ‘सेना’ צבא के सामूहिक और व्यवस्थित समूह वाले बिंब को बचाती है। पादटिप्पणी स्पष्ट करती है कि यहाँ आशय आकाशीय पिंडों के समूह से है।
- source_word: אֲשֶׁר אֲהֵבוּם וַאֲשֶׁר עֲבָדוּם
  choice: जिनसे उन्होंने प्रेम किया, जिनकी सेवा की
  rationale: ‘प्रेम’ और ‘सेवा’ मूल की दो अलग क्रियाओं को अलग रखती हैं; ‘सेवा’ में इस प्रसंग का धार्मिक आशय उपस्थित है, पर इसे बाद के दण्डवत करने के कार्य में नहीं मिलाया गया।
- source_word: וַאֲשֶׁר הָלְכוּ אַחֲרֵיהֶם
  choice: जिनके पीछे चले
  rationale: यह मूल के ‘पीछे चलने’ वाले रूपक तथा निष्ठापूर्वक अनुसरण करने के भाव, दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וַאֲשֶׁר דְּרָשׁוּם
  choice: जिन्हें खोजा
  rationale: דרשׁ के व्यापक ‘खोजना/चाहना’ अर्थ को मुख्य पाठ में रखा गया है; धार्मिक परामर्श या शकुन पूछने की संभावित सूक्ष्मता पादटिप्पणी में दी गई है।
- source_word: וַאֲשֶׁר הִשְׁתַּחֲווּ לָהֶם
  choice: जिनके आगे दण्डवत किया
  rationale: यह उपासना में झुकने या भूमि पर गिरने की शारीरिक क्रिया को बचाता है और इसे पहले प्रयुक्त ‘सेवा’ से अलग रखता है।
- source_word: לֹא יֵאָסְפוּ וְלֹא יִקָּבֵרוּ
  choice: न तो इकट्ठे किए जाएँगे और न दफ़नाए जाएँगे
  rationale: दोनों निषेधों और उनके निष्क्रिय रूप को सुरक्षित रखा गया है; पहला अवशेषों को सम्मानपूर्वक समेटने और दूसरा विधिवत दफ़नाने की अनुपस्थिति बताता है।
- source_word: לְדֹמֶן
  choice: मल बन जाएँगे
  rationale: ‘मल’ अपमान और अशुद्धता के तीखे भविष्यद्वाणीपूर्ण बिंब को बनाए रखता है; ‘खाद’ इस कठोरता को अनावश्यक रूप से नरम कर देता।
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: भूमि की सतह पर
  rationale: यह इब्रानी मुहावरे ‘भूमि के मुख पर’ का स्पष्ट और स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: खगोलीय उपासना से संबंधित क्रियाओं की पुनरावृत्ति
  choice: प्रेम किया / सेवा की / पीछे चले / खोजा / दण्डवत किया—इन पाँचों को अलग रखा गया
  alternative: इन सबको ‘पूजा की’ या ‘उपासना की’ जैसे एक-दो सामान्य पदों में समेटना
  rationale: मूल पाठ का संचय लोगों की सर्वांगीण निष्ठा पर आरोप को तीव्र करता है। अलग-अलग क्रियाएँ रखने से कोई एक धार्मिक व्याख्या थोपे बिना मूल की अलंकारिक शक्ति बनी रहती है।
- issue: צְבָא הַשָּׁמַיִם का अर्थ
  choice: आकाश की सारी सेना
  alternative: आकाश के सारे तारागण / आकाशीय पिंडों का पूरा समूह
  rationale: मुख्य पाठ मूल के ‘सेना’ बिंब को सुरक्षित रखता है, जबकि पादटिप्पणी इसके खगोलीय अर्थ को स्पष्ट करती है; इससे इसे केवल तारों तक सीमित नहीं किया गया।
- issue: דרשׁ में धार्मिक पूछताछ का संभावित अर्थ
  choice: मुख्य पाठ में ‘खोजा’, पादटिप्पणी में ‘पूछा/परामर्श लिया’
  alternative: मुख्य पाठ में सीधे ‘जिनसे शकुन पूछा’
  rationale: इस प्रसंग में धार्मिक पूछताछ संभव है, पर क्रिया का अर्थ अधिक व्यापक भी हो सकता है। मुख्य पाठ व्यापकता रखता है और पादटिप्पणी संभावित विशिष्ट अर्थ बताती है।
