source:
  edition: WLC
  text: מַדּ֨וּעַ שׁוֹבְבָ֜ה הָ/עָ֥ם הַ/זֶּ֛ה יְרוּשָׁלִַ֖ם מְשֻׁבָ֣ה נִצַּ֑חַת הֶחֱזִ֨יקוּ֙ בַּ/תַּרְמִ֔ית מֵאֲנ֖וּ לָ/שֽׁוּב׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/005.yaml
  text: Why has this people turned away—Jerusalem—with a perpetual turning away? They hold fast to deceit[c][b][a]; they refuse to return.
translation:
  language: hi
  text: यह प्रजा—यरूशलेम—क्यों सदा के लिए मुड़कर दूर चली गई है?[a][b][c] वे छल को दृढ़ता से थामे हुए हैं; वे लौटने से इनकार करते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘सदा के लिए मुड़कर दूर चली गई है’ का अनुवाद ‘लगातार विमुख होती रही है’ या ‘स्थायी धर्मत्याग में पड़ी है’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में ‘मुड़ना/लौटना’ एक ही मूल शब्द के विभिन्न रूप हैं; लोगों के दूर मुड़ने और उनके लौटने से इनकार करने में जानबूझकर विरोध रखा गया है।
    reason: lexical_alternative
  - marker: c
    text: '‘यरूशलेम’ को सम्बोधन भी समझा जा सकता है: ‘हे यरूशलेम, यह प्रजा क्यों...?’'
    reason: alternative_reading
lexical_decisions:
- source_word: מַדּוּעַ
  choice: क्यों
  rationale: यह आलंकारिक प्रश्न आरम्भ करने वाला प्रश्नवाचक क्रियाविशेषण है; आधुनिक हिन्दी में ‘क्यों’ स्वाभाविक है।
- source_word: שׁוֹבְבָה
  choice: मुझसे फिर गए हैं
  rationale: यहाँ रूप विमुख होने या हट जाने को व्यक्त करता है। ‘फिर गए’ आगे के ‘लौटने’ के साथ मूल धातु שוב की पुनरावृत्ति को यथासंभव बनाए रखता है; ‘मुझसे’ प्रसंगगत भाव स्पष्ट करता है, यद्यपि हिब्रू में कर्म व्यक्त नहीं है।
- source_word: הָעָם הַזֶּה
  choice: यह लोग
  rationale: עם का अर्थ सामूहिक ‘लोग’ है। ‘यह लोग’ भविष्यद्वाणी की सम्बोधनात्मक-आरोपात्मक शैली को सहज हिन्दी में रखता है।
- source_word: יְרוּשָׁלִַם
  choice: यरूशलेम
  rationale: मानक हिन्दी लिप्यंतरण; मुख्य पाठ में इसे ‘यह लोग’ के समानाधिकरण के रूप में डैशों के बीच रखा गया है।
- source_word: מְשֻׁבָה נִצַּחַת
  choice: सदा के लिए ... फिर गए
  rationale: संज्ञा מְשֻׁבָה विमुखता को और נִצַּחַת उसके स्थायी अथवा निरन्तर स्वरूप को बताता है। हिन्दी में क्रियात्मक अभिव्यक्ति अधिक स्वाभाविक है।
- source_word: הֶחֱזִיקוּ בַּתַּרְמִית
  choice: वे छल को कसकर पकड़े हुए हैं
  rationale: חזק का हिफ़ील रूप दृढ़ता से थामे रहने को और תרמית छल/धोखे को व्यक्त करता है; यह अनुवाद जान-बूझकर चिपके रहने की तीव्रता बनाए रखता है।
- source_word: מֵאֲנוּ לָשׁוּב
  choice: वे लौटने से इनकार करते हैं
  rationale: מאן इच्छापूर्वक अस्वीकार करने और שוב वापस लौटने को व्यक्त करता है। ‘लौटने’ से पद का धातुगत शब्द-खेल भी आंशिक रूप से सुरक्षित रहता है।
theological_decisions:
- issue: שוב / מְשׁוּבָה की पुनरावृत्ति और शब्द-खेल
  choice: ‘फिर गए’ और ‘लौटने’ के द्वारा विमुख होने और वापस आने के विरोध को बनाए रखा गया।
  alternative: ‘धर्मत्याग’ और ‘पश्चात्ताप’ जैसे अधिक व्याख्यात्मक धार्मिक शब्द प्रयोग किए जा सकते थे।
  rationale: मूल पद दिशा बदलने के एक ही शब्द-परिवार से आरोप और अपेक्षित वापसी को आमने-सामने रखता है। अनुवाद को इस तनाव को स्पष्ट करना चाहिए, पर ‘पश्चात्ताप’ कहकर अर्थ का धर्मवैज्ञानिक विस्तार नहीं करना चाहिए।
- issue: יְרוּשָׁלִַם की वाक्यगत भूमिका
  choice: ‘यरूशलेम’ को ‘यह लोग’ का समानाधिकरण माना गया और डैशों के बीच रखा गया।
  alternative: 'इसे सम्बोधन माना जा सकता है: ‘हे यरूशलेम, यह लोग क्यों...?’'
  rationale: व्यंजन-पाठ दोनों सम्भावनाओं की अनुमति देता है, पर समानाधिकरण यहाँ अधिक सहज है। वैकल्पिक सम्बोधन को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: שׁוֹבְבָה के साथ निहित सम्बन्ध-वस्तु
  choice: स्वाभाविक हिन्दी और दिव्य वक्ता के प्रसंग को स्पष्ट करने के लिए ‘मुझसे’ जोड़ा गया।
  alternative: अधिक शाब्दिक रूप में केवल ‘क्यों फिर गए हैं?’ रखा जा सकता है।
  rationale: हिब्रू में ‘मुझसे’ स्पष्ट रूप से नहीं है, इसलिए इसे पादटिप्पणी में बताया गया है; फिर भी प्रसंग में विमुखता यहोवा से है और हिन्दी में सम्बन्ध-वस्तु के बिना वाक्य कुछ अधूरा सुनाई देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘धर्मत्याग’ और ‘पश्चात्ताप’ जैसे तकनीकी धार्मिक शब्द मुख्य पाठ में नहीं रखे गए, ताकि मूल के दिशा-परिवर्तन वाले शब्द-खेल और अर्थगत खुलापन सुरक्षित रहें।
