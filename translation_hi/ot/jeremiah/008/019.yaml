  verdict: revise
  source_fidelity: Draft largely reflects the Hebrew poetic structure, the metaphor ‘daughter of my people,’ the paired rhetorical questions, and the causative force of הִכְעִסוּנִי. However, ‘पराए देवताओं—इन व्यर्थ वस्तुओं—से’ makes the second phrase more explicitly identificatory than the Hebrew בְּהַבְלֵי נֵכָר (‘with foreign/alien vanities, worthless things’) and adds a parenthetical apposition not present in the source. The deictic הִנֵּה is better represented by ‘देखो’ than the auditory ‘सुनो,’ while the following clause itself supplies the hearing imagery.
  naturalness: The revision remains modern, dignified Hindi. ‘दुहाई सुनाई दे रही है’ is idiomatic, while the footnote preserves the literal ‘sound of the cry.’ ‘मुझे क्यों क्रोधित किया है’ naturally conveys the Hebrew causative without the less idiomatic ‘मुझे क्रोध दिलाया।’
  terminology: ‘यहोवा,’ ‘सिय्योन,’ and ‘राजा’ are retained. ‘तराशी हुई मूर्तियाँ’ reflects פסילים specifically. ‘विदेशी व्यर्थ वस्तुएँ’ preserves the polemical ambiguity of הבלי נכר; the footnote may explain its contextual reference to idols without forcing that interpretation into the main text.
  issues:
  - severity: medium
    issue: The rendering ‘पराए देवताओं—इन व्यर्थ वस्तुओं—से’ over-specifies and appositionally expands בְּהַבְלֵי נֵכָר.
    rationale: The Hebrew calls them ‘foreign/alien vanities’ or worthless things; in context these are idols, but it does not contain the explicit appositional wording ‘these worthless things.’ A more literal main text preserves the polemical term’s ambiguity, with explanation in a footnote.
  - severity: low
    issue: ‘सुनो!’ narrows the deixis of הִנֵּה.
    rationale: הִנֵּה is an attention-getting particle, best represented here by ‘देखो!’; the cry being heard is then expressed by ‘सुनाई दे रही है.’
  - severity: low
    issue: ‘मुझे क्रोध दिलाया’ is less natural than a causative Hindi verb.
    rationale: ‘मुझे क्यों क्रोधित किया है’ is idiomatic and retains the Hiphil sense, ‘caused me to be angry/provoked me.’
