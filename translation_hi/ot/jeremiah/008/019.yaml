source:
  edition: WLC
  text: הִנֵּה ק֞וֹל שַֽׁוְעַ֣ת בַּת עַמִּ֗/י מֵ/אֶ֨רֶץ֙ מַרְחַקִּ֔ים הַֽ/יהוָה֙ אֵ֣ין בְּ/צִיּ֔וֹן אִם מַלְכָּ֖/הּ אֵ֣ין בָּ֑/הּ מַדּ֗וּעַ הִכְעִס֛וּ/נִי בִּ/פְסִלֵי/הֶ֖ם בְּ/הַבְלֵ֥י נֵכָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/019.yaml
  text: 'Look—the cry of the daughter of my people from a distant land: “Is Yahweh not in Zion? Is her King not in her?” Why have they provoked me to anger with their carved images[c][b][a], with foreign idols?'
translation:
  language: hi
  text: 'देखो! दूर देश से मेरी प्रजा की बेटी की दुहाई सुनाई दे रही है[a][b]: “क्या यहोवा सिय्योन में नहीं है? क्या उसका राजा उसके भीतर नहीं है?” “उन्होंने अपनी तराशी हुई मूर्तियों और विदेशी व्यर्थ वस्तुओं से मुझे क्यों क्रोधित किया है?”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “मेरी प्रजा की बेटी की दुहाई की आवाज़।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में, “दूरियों के देश से,” अर्थात बहुत दूर से।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी पदबंध का अधिक शाब्दिक अर्थ “विदेशी व्यर्थ वस्तुओं से” हो सकता है; यह मूर्तियों को खोखला और निकम्मा बताने वाला उपहासपूर्ण प्रयोग है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: सुनो!
  rationale: यह विस्मयादिबोधक अचानक और तत्काल ध्यान खींचता है। यहाँ आगे ‘दुहाई सुनाई दे रही है’ होने के कारण श्रवण-संबंधी ‘सुनो’ स्वाभाविक है।
- source_word: קוֹל שַׁוְעַת
  choice: दुहाई सुनाई दे रही है
  rationale: शाब्दिक अर्थ ‘दुहाई की आवाज़’ है। हिंदी में यह रूप पीड़ा और सहायता की पुकार को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בַּת עַמִּי
  choice: मेरी प्रजा की बेटी
  rationale: भविष्यद्वक्ताओं में प्रयुक्त पारिवारिक और काव्यात्मक रूपक को समतल किए बिना बनाए रखता है।
- source_word: מֵאֶרֶץ מַרְחַקִּים
  choice: दूर देश से
  rationale: बहुवचन ‘दूरियों’ अत्यधिक दूरी का मुहावरेदार संकेत है; ‘दूर देश से’ आधुनिक हिंदी में सहज है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी विशिष्ट ईश्वरीय नाम को उपाधि में बदलने के बजाय हिंदी में प्रचलित नाम-रूप से प्रस्तुत किया गया है।
- source_word: אֵין בְּצִיּוֹן
  choice: क्या यहोवा सिय्योन में नहीं है?
  rationale: नकारात्मक अस्तित्ववाचक वाक्य को संदर्भानुसार प्रत्यक्ष आलंकारिक प्रश्न के रूप में रखा गया है।
- source_word: אִם מַלְכָּהּ אֵין בָּהּ
  choice: क्या उसका राजा उसके भीतर नहीं है?
  rationale: दूसरा समानांतर आलंकारिक प्रश्न है। स्त्रीलिंग सर्वनाम सिय्योन की ओर संकेत करता है; हिंदी में अनावश्यक व्याख्या नहीं जोड़ी गई।
- source_word: הִכְעִסוּנִי
  choice: मुझे क्रोध दिलाया
  rationale: 'हिफ़ील का कारणवाचक भाव स्पष्ट करता है: उन्होंने परमेश्वर को क्रोधित किया।'
- source_word: בִּפְסִילֵיהֶם
  choice: अपनी गढ़ी हुई मूर्तियों
  rationale: פֶּסֶל में बनाई/तराशी गई प्रतिमा का ठोस भाव है; ‘गढ़ी हुई मूर्तियाँ’ उसे बनाए रखता है।
- source_word: בְּהַבְלֵי נֵכָר
  choice: पराए देवताओं—इन व्यर्थ वस्तुओं—से
  rationale: נֵכָר के पराए/विदेशी संबंध और הֶבֶל के व्यर्थता तथा खोखलेपन, दोनों को व्यक्त करता है; संदर्भ से इनके देवता-मूर्ति होने की पहचान स्पष्ट होती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में विशिष्ट वाचा-नाम है। हिंदी पाठकों में पहचाने जाने वाले नाम-रूप ‘यहोवा’ से इसे उपाधि ‘प्रभु’ में विलीन नहीं किया गया।
- issue: ‘उसका राजा’ का संदर्भ
  choice: ‘राजा’ को सामान्य हिंदी वर्तनी में रखा, संदर्भ से यहोवा की ओर संकेत
  alternative: ‘राजा’ को विशेष आदरसूचक ढंग से चिह्नित करना या मानवीय राजा समझना
  rationale: दोनों प्रश्नों की समानांतरता राजा को यहोवा से जोड़ती है, पर मूल में अक्षर-बड़े करने जैसा कोई संकेत नहीं है। हिंदी में संदर्भ को बोलने देना अर्थगत तनाव और मूल की शैली को सुरक्षित रखता है।
- issue: अंतिम प्रश्न का वक्ता
  choice: अलग उद्धरण के रूप में यहोवा का उत्तर
  alternative: बिना उद्धरण-चिह्न के भविष्यद्वक्ता की सतत वाणी
  rationale: प्रथम पुरुष ‘मुझे’ स्वाभाविक रूप से यहोवा की वाणी है और पहले उद्धृत जन-पुकार का प्रत्युत्तर बनता है; वक्ता-परिवर्तन को विराम और उद्धरण से स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और श्रव्य हिंदी अपनाई गई है। ‘मेरी प्रजा की बेटी’ जैसे मूल काव्यात्मक रूपक को बनाए रखा गया है। प्रश्नों और वक्ता-परिवर्तन को उद्धरण-चिह्नों से स्पष्ट किया गया है, जबकि ‘उसका राजा’ की संदर्भगत पहचान को पाठ में अतिरिक्त व्याख्या से निश्चित नहीं किया गया।
