- from: कटनी का समय बीत गया[a], गरमी का मौसम समाप्त हो गया, फिर भी हमारा उद्धार नहीं हुआ।
  to: फसल कटने का समय बीत गया, ग्रीष्म समाप्त हो गया, और हम बचाए नहीं गए[a]।
  rationale: The revision keeps the Hebrew’s completed seasonal imagery, restores the straightforward coordination of the final clause, and renders the Niphal plural more transparently. The alternative “छुड़ाया” is retained in a correctly placed footnote, preserving the rescue-from-calamity nuance without narrowing or expanding the theology.
