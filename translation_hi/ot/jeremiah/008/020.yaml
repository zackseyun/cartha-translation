  edition: WLC
  text: עָבַ֥ר קָצִ֖יר כָּ֣לָה קָ֑יִץ וַ/אֲנַ֖חְנוּ ל֥וֹא נוֹשָֽׁעְנוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/020.yaml
  text: The harvest has passed[a], the summer has ended, and we have not been saved.
translation:
  language: hi
  text: फसल कटने का समय बीत गया, ग्रीष्म समाप्त हो गया, और हम बचाए नहीं गए[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमें छुड़ाया नहीं गया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: עָבַר קָצִיר
  choice: कटनी का समय बीत गया
  rationale: עָבַר पूर्ण हो चुकी घटना को बताता है और קָצִיר यहाँ फसल काटने के मौसमी समय को सूचित करता है। ‘कटनी का समय’ साधारण आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: כָּלָה קָיִץ
  choice: गरमी का मौसम समाप्त हो गया
  rationale: כָּלָה समाप्ति को व्यक्त करता है। קָיִץ का इस समानांतर काव्य-पंक्ति में सामान्य अर्थ गरमी का मौसम है; फल के मौसम का विशेष अर्थ यहाँ आवश्यक नहीं है।
- source_word: וַאֲנַחְנוּ
  choice: फिर भी हमारा
  rationale: वाव मूलतः समन्वयकारी ‘और’ है, पर पहले दो अवसरों के बीत जाने और उद्धार न मिलने के बीच का विरोध हिन्दी में ‘फिर भी’ से स्वाभाविक रूप में व्यक्त होता है।
- source_word: לֹא נוֹשָׁעְנוּ
  choice: हमारा उद्धार नहीं हुआ
  rationale: ישׁע का निफ़अल पूर्ण प्रथम पुरुष बहुवचन संकट से बचाए या छुड़ाए जाने का निष्पन्न भाव रखता है। ‘हमारा उद्धार नहीं हुआ’ निष्क्रिय अर्थ और व्यापक धार्मिक प्रतिध्वनि को बनाए रखता है, बिना इसे केवल अनन्त उद्धार तक सीमित किए।
theological_decisions:
- issue: राष्ट्रीय विलाप के प्रसंग में ישׁע का अनुवाद
  choice: उद्धार नहीं हुआ
  alternative: हमें छुड़ाया नहीं गया
  rationale: यहाँ लोग विपत्ति से बचाव न मिलने का विलाप करते हैं। ‘उद्धार’ मूल क्रिया की व्यापकता और धर्मवैचारिक तनाव को बनाए रखता है; प्रसंग इसे केवल आत्मिक या अनन्त उद्धार के अर्थ तक सीमित नहीं करता। ‘छुड़ाया’ भी सम्भव और अधिक स्पष्ट प्रसंगगत विकल्प है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। काव्यात्मक समानांतरता बनाए रखने के लिए दोनों मौसमी खंड समान पूर्णतासूचक रूप में हैं। ‘गरमी’ बोलचाल में सहज है, जबकि ‘मौसम’ जोड़ने से काव्य-पंक्ति में קָיִץ का मौसमी अर्थ स्पष्ट होता है।
