source:
  edition: WLC
  text: הַ/צֳרִי֙ אֵ֣ין בְּ/גִלְעָ֔ד אִם רֹפֵ֖א אֵ֣ין שָׁ֑ם כִּ֗י מַדּ֨וּעַ֙ לֹ֣א עָֽלְתָ֔ה אֲרֻכַ֖ת בַּת עַמִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/022.yaml
  text: Is there no balm in Gilead? Is there no physician there? Why then has the healing of the daughter of my people not come about?[a][b]
translation:
  language: hi
  text: क्या गिलाद में कोई मरहम नहीं है?[a] क्या वहाँ कोई चिकित्सक नहीं है? फिर मेरी प्रजा की बेटी की चंगाई क्यों नहीं हुई?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “औषधीय राल” अथवा “बाल्सम।” इब्रानी शब्द गिलाद से जुड़ी औषधीय गोंद या राल को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या “मेरी प्रजा की बेटी को स्वास्थ्य-लाभ क्यों नहीं हुआ?”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצֳרִי
  choice: मरहम
  rationale: यह शब्द गिलाद से जुड़ी औषधीय गोंद या सुगंधित राल को दर्शाता है। सामान्य हिन्दी में ‘मरहम’ चिकित्सा-रूपक और प्रश्न की प्रभावशीलता बनाए रखता है; पदार्थ की अधिक सटीक पहचान पादटिप्पणी में दी गई है।
- source_word: בְּגִלְעָד
  choice: गिलाद में
  rationale: स्थानवाचक प्रयोग को सीधे रखा गया है और स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण अपनाया गया है।
- source_word: אִם רֹפֵא אֵין שָׁם
  choice: क्या वहाँ कोई वैद्य नहीं है?
  rationale: אִם यहाँ पहली पंक्ति के समानांतर दूसरा आलंकारिक प्रश्न आरम्भ करता है। ‘वैद्य’ चिकित्सा-संदर्भ के अनुकूल, गरिमापूर्ण और आधुनिक हिन्दी में सुबोध है।
- source_word: כִּי מַדּוּעַ
  choice: फिर ... क्यों
  rationale: यह पिछले आलंकारिक प्रश्नों से निकलने वाले निष्कर्षात्मक आश्चर्य को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לֹא עָלְתָה אֲרֻכַת
  choice: चंगी क्यों नहीं हुई
  rationale: עלה और אֲרֻכָה का संयोग यहाँ स्वास्थ्य-लाभ या चंगाई के घटित होने को दर्शाता है। ‘चंगी नहीं हुई’ हिन्दी में स्वाभाविक रूप से परिणामसूचक अर्थ देता है, जबकि ‘स्वास्थ्य-लाभ’ विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: בַּת עַמִּי
  choice: मेरी प्रजा की बेटी
  rationale: हिब्रू के व्यक्तिकारी और विलापपूर्ण बिंब को समतल करके केवल ‘मेरी प्रजा’ नहीं किया गया है।
theological_decisions:
- issue: ‘मेरी प्रजा की बेटी’ के भविष्यद्वाणी-संबंधी व्यक्तिकरण को बनाए रखना या उसे केवल ‘मेरी प्रजा’ कहना
  choice: मेरी प्रजा की बेटी
  alternative: मेरी प्रजा / मेरी प्यारी प्रजा
  rationale: मूल वाक्यांश राष्ट्र को बेटी के रूप में व्यक्त करता है और विलाप की भावात्मक शक्ति रखता है। इसे बनाए रखने से कोई अतिरिक्त साम्प्रदायिक अर्थ नहीं जुड़ता और मूल का साहित्यिक तनाव सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सुबोध, गरिमापूर्ण और विलापात्मक स्वर रखा गया है। दोनों आरम्भिक उपवाक्यों को समानांतर आलंकारिक प्रश्न बनाया गया है। ‘मरहम’ सामान्य पाठक के लिए सहज है, और मूल पदार्थ की lexical specificity पादटिप्पणी में संरक्षित है।
