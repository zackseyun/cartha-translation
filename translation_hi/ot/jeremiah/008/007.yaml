source:
  edition: WLC
  text: גַּם חֲסִידָ֣ה בַ/שָּׁמַ֗יִם יָֽדְעָה֙ מֽוֹעֲדֶ֔י/הָ וְ/תֹ֤ר ו/סוס וְ/עָג֔וּר שָׁמְר֖וּ אֶת עֵ֣ת בֹּאָ֑/נָה וְ/עַמִּ֕/י לֹ֣א יָֽדְע֔וּ אֵ֖ת מִשְׁפַּ֥ט יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/007.yaml
  text: Even the stork in the heavens knows her appointed times, and the turtledove, the swift, and the crane keep the time of their coming; but my people do not know the judgment of the LORD.
translation:
  language: hi
  text: आकाश में लगलग भी अपने नियत समयों को जानता है; पंडुक, तेज़ उड़ने वाला पक्षी[a] और सारस अपने आने के समय का पालन करते हैं। पर मेरी प्रजा यहोवा का न्याय[b] नहीं जानती।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पक्षी-नाम की ठीक पहचान निश्चित नहीं है; इसे “अबाबील,” “स्विफ्ट,” या सामान्यतः तेज़ उड़ने वाला पक्षी समझा गया है।
    reason: סוּס की वास्तविक पक्षी-जाति पर अनिश्चितता को अनुवाद में और पादटिप्पणी में सुरक्षित रखना।
  - marker: b
    text: या, “विधान” अथवा “निर्णय।”
    reason: מִשְׁפָּט की व्यापक अर्थ-सीमा को सुरक्षित रखना।
lexical_decisions:
- source_word: חֲסִידָה
  choice: लगलग
  rationale: यह इब्रानी शब्द सामान्यतः stork को सूचित करता है; ‘लगलग’ आधुनिक हिन्दी में इस पक्षी का मान्य नाम है।
- source_word: מוֹעֲדֶיהָ
  choice: अपने नियत समयों
  rationale: बहुवचन रूप और पक्षी के ठहराए हुए मौसमी समय—विशेषतः प्रवास के समय—दोनों को सुरक्षित रखता है।
- source_word: תֹר
  choice: पंडुक
  rationale: यह turtledove का प्रचलित, संक्षिप्त हिन्दी नाम है।
- source_word: סוּס
  choice: अबाबील
  rationale: पक्षी-सूची में यह शब्द प्रायः swallow के रूप में समझा जाता है, यद्यपि इसकी सटीक पक्षी-जाति अनिश्चित है; हिन्दी में ‘अबाबील’ सहज और परिचित है।
- source_word: עָגוּר
  choice: सारस
  rationale: परंपरागत crane पहचान को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: שָׁמְרוּ אֶת־עֵת בֹּאָנָה
  choice: अपने आने का समय मानते हैं
  rationale: शाब्दिक ‘समय की रखवाली करते हैं’ के बजाय इब्रानी भाव—नियत आगमन-समय का पालन करना—स्वाभाविक हिन्दी में देता है।
- source_word: מִשְׁפַּט יְהוָה
  choice: यहोवा का विधान
  rationale: מִשְׁפָּט यहाँ केवल दंडात्मक ‘न्याय’ नहीं, बल्कि यहोवा द्वारा ठहराई हुई व्यवस्था/मांग को भी सूचित कर सकता है; प्रसंग में पक्षियों के नियत क्रम के विपरीत प्रजा की अवज्ञा है।
theological_decisions:
- issue: מִשְׁפַּט का अर्थ
  choice: विधान
  alternative: न्याय / निर्णय
  rationale: ‘विधान’ प्रसंग में परमेश्वर की ठहराई व्यवस्था और उसकी मांग को स्पष्ट करता है, जबकि पादटिप्पणी शब्द की न्याय-संबंधी अर्थ-सीमा को सुरक्षित रखती है।
- issue: दिव्य नाम יהוה
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ के व्यक्तिगत दिव्य नाम को सामान्य हिन्दी बाइबलीय रूप ‘यहोवा’ से प्रत्यक्ष रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। पक्षियों के सहज रूप से नियत समय मानने और प्रजा के यहोवा का विधान न जानने के बीच का तीखा विरोध सुरक्षित है।
