  text: וַ/יְרַפּ֞וּ אֶת שֶׁ֤בֶר בַּת עַמִּ/י֙ עַל נְקַלָּ֔ה לֵ/אמֹ֖ר שָׁל֣וֹם שָׁל֑וֹם וְ/אֵ֖ין שָׁלֽוֹם־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/011.yaml
  text: They have treated the wound of the daughter of my people lightly[a], saying, ‘Peace[b], peace,’ when there is no peace.
translation:
  language: hi
  text: उन्होंने मेरी प्रजा की बेटी के घाव का सतही ढंग से उपचार किया है[a], यह कहते हुए, “शांति[b], शांति,” जबकि शांति है ही नहीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हल्के में,” अथवा “मानो यह कोई मामूली बात हो।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी शब्द शालोम का अर्थ “कुशलता,” “पूर्णता,” या “सुरक्षा” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְרַפּוּ
  choice: उपचार किया है
  rationale: רפא का मूल अर्थ ‘चंगा करना’ है, पर यहाँ आरोप यह है कि उपचार वास्तविक या सफल नहीं, बल्कि सतही है। ‘उपचार किया है’ चिकित्सकीय रूपक और व्यंग्यात्मक प्रसंग दोनों को बनाए रखता है।
- source_word: שֶׁבֶר
  choice: घाव
  rationale: शब्द टूटन, भंग, विनाश या चोट को सूचित कर सकता है। רפא के साथ यहाँ शारीरिक चोट का रूपक प्रमुख है, इसलिए ‘घाव’ स्वाभाविक और स्पष्ट है।
- source_word: בַּת עַמִּי
  choice: मेरी प्रजा की बेटी
  rationale: यह भविष्यद्वक्ताओं की भाषा में प्रजा का बेटी के रूप में मानवीकरण है। इसे बनाए रखने से मूल का करुण भाव और काव्यात्मक चित्र सुरक्षित रहता है।
- source_word: עַל נְקַלָּה
  choice: बस ऊपरी तौर पर
  rationale: वाक्यांश गंभीर घाव के सतही उपचार या उसे मामूली मानने का भाव देता है। ‘बस ऊपरी तौर पर’ आधुनिक हिन्दी में आरोप की तीव्रता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לֵאמֹר
  choice: और कहते हैं
  rationale: यह उनके सतही उपचार को झूठे आश्वासन से जोड़ता है और हिन्दी में कथन की विषयवस्तु को सहज रूप से प्रस्तुत करता है।
- source_word: שָׁלוֹם שָׁלוֹם
  choice: शान्ति, शान्ति
  rationale: दोहराव को यथावत रखा गया है ताकि मूल की नारे-जैसी झूठी आश्वस्ति और आलंकारिक बल बने रहें।
- source_word: וְאֵין שָׁלוֹם
  choice: जबकि शान्ति है ही नहीं
  rationale: यह पहले किए गए दावे और वास्तविकता का तीखा विरोध प्रकट करता है। ‘है ही नहीं’ मूल निषेध के बल को स्वाभाविक हिन्दी में सामने लाता है।
theological_decisions:
- issue: प्रजा का बेटी के रूप में मानवीकरण
  choice: मुख्य पाठ में ‘मेरी प्रजा की बेटी’ बनाए रखा गया
  alternative: ‘मेरी प्रजा’ या ‘मेरे प्रिय लोग’
  rationale: मूल इब्रानी में यह जानबूझकर किया गया मानवीकरण है, जो करुणा और वाचा-संबंधी भाव लिए हुए है। इसे सरल करके हटा देना मूल की महत्त्वपूर्ण छवि को खो देता।
- issue: שָׁלוֹם का अनुवाद
  choice: मुख्य पाठ में ‘शान्ति’
  alternative: ‘कुशल’, ‘सब ठीक है’ या ‘सुरक्षा’
  rationale: ‘शान्ति’ मानक और व्यापक अनुवाद है तथा दोहराए गए झूठे नारे का रूप सुरक्षित रखता है। इब्रानी शब्द की विस्तृत अर्थ-सीमा पाद-टिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘मेरी प्रजा की बेटी’ मूल की भविष्यद्वक्ताई छवि को औपचारिकता सहित बनाए रखता है, जबकि ‘बस ऊपरी तौर पर उपचार’ सामान्य पाठक के लिए आरोप का अर्थ स्पष्ट करता है। उद्धरण में पुनरुक्ति जानबूझकर सुरक्षित रखी गई है।
