source:
  edition: WLC
  text: הֹבִ֕שׁוּ כִּ֥י תוֹעֵבָ֖ה עָשׂ֑וּ גַּם בּ֣וֹשׁ לֹֽא יֵבֹ֗שׁוּ וְ/הִכָּלֵם֙ לֹ֣א יָדָ֔עוּ לָ/כֵ֞ן יִפְּל֣וּ בַ/נֹּפְלִ֗ים בְּ/עֵ֧ת פְּקֻדָּתָ֛/ם יִכָּשְׁל֖וּ אָמַ֥ר יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/012.yaml
  text: Were they ashamed because they had done an abomination? No[a], they were not ashamed at all; they did not even know how to blush. Therefore they will fall among the fallen; at the time of their punishment they will stumble, says Yahweh.
translation:
  language: hi
  text: क्या वे इसलिए लज्जित हुए कि उन्होंने घिनौना काम किया था? नहीं, वे तनिक भी लज्जित नहीं हुए; वे लज्जित होना भी नहीं जानते थे। इसलिए वे गिरने वालों के बीच गिरेंगे; उनके दण्ड के समय[a] वे लड़खड़ा जाएँगे, याहवे कहते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनकी सुधि लेने या उनसे लेखा लेने के समय।” हिब्रू शब्द उस समय को सूचित कर सकता है जब परमेश्वर न्याय के लिए लोगों की सुधि लेते हैं, उनकी जाँच करते हैं, या उनसे लेखा लेते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֹבִשׁוּ
  choice: क्या वे ... लज्जित हुए?
  rationale: संदर्भ और इसके बाद आने वाला प्रबल निषेध इसे आलंकारिक प्रश्न के रूप में समझने का समर्थन करते हैं; ‘लज्जित’ בוש के मूल भाव को बनाए रखता है।
- source_word: כִּי תוֹעֵבָה עָשׂוּ
  choice: इसलिए ... कि उन्होंने घिनौना काम किया था
  rationale: כִּי को कारणसूचक रखा गया है। ‘घिनौना काम’ תוֹעֵבָה की प्रबल नैतिक-धार्मिक निन्दा को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: גַּם בּוֹשׁ לֹא יֵבֹשׁוּ
  choice: नहीं, वे तनिक भी लज्जित नहीं हुए
  rationale: इनफिनिटिव ऐब्सोल्यूट और सीमित क्रिया का मेल निषेध पर विशेष बल देता है; ‘तनिक भी नहीं’ उसी तीव्रता को व्यक्त करता है।
- source_word: וְהִכָּלֵם לֹא יָדָעוּ
  choice: वे लज्जा मानना तक नहीं जानते थे
  rationale: यह वाक्य उनकी नैतिक संवेदनहीनता बताता है। हिन्दी में ‘लज्जा मानना’ दृश्य रूप से लाल होने तक सीमित किए बिना अपमान/लज्जा के भाव को संप्रेषित करता है।
- source_word: יִפְּלוּ בַנֹּפְלִים
  choice: वे गिरने वालों के बीच गिरेंगे
  rationale: अनुवाद हिब्रू की पुनरुक्ति और न्याय के अधीन दूसरों के साथ समान भाग्य पाने के भाव को बनाए रखता है।
- source_word: בְּעֵת פְּקֻדָּתָם
  choice: उनके दण्ड के समय
  rationale: न्याय के संदर्भ में פְּקֻדָּה का आशय परमेश्वर द्वारा लेखा लेने अथवा दण्ड देने के समय से है; मुख्य पाठ में ‘दण्ड’ तत्काल बोधगम्य है, जबकि व्यापक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: יִכָּשְׁלוּ
  choice: वे लड़खड़ा जाएँगे
  rationale: यह चयन כשל के ठोकर खाने अथवा डगमगाने के रूपक को बनाए रखता है और पिछले ‘गिरेंगे’ से अनावश्यक एकरूपता से बचता है।
- source_word: אָמַר יְהוָה
  choice: याहवे कहते हैं
  rationale: भविष्यद्वाणी के सूत्र को स्वाभाविक वर्तमानकालीन हिन्दी में रखा गया है और יהוה को उसके व्यक्तिगत वाचा-नाम के लिप्यंतरण से व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चार-अक्षरीय व्यक्तिगत नाम स्पष्ट रूप से आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और नाम को सामान्य उपाधि में नहीं बदलता।
- issue: פְּקֻדָּה में दण्ड और ‘भेंट/लेखा लेने’ की अर्थ-व्याप्ति
  choice: मुख्य पाठ में ‘दण्ड’, पादटिप्पणी में ‘लेखा लेने का समय’
  alternative: भेंट करने का समय
  rationale: इस न्याय-संदर्भ में परिणाम दण्ड है, पर हिब्रू शब्द उस समय को भी सूचित कर सकता है जब परमेश्वर लोगों की सुधि लेने या उनसे लेखा लेने आते हैं; पादटिप्पणी इस वास्तविक अर्थ-व्याप्ति को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सरल किंतु गरिमापूर्ण रखी गई है। लज्जा से जुड़े हिब्रू शब्दों की पुनरावृत्ति को हिन्दी में स्वाभाविक बल के साथ रखा गया है। पादटिप्पणी-चिह्न [a] को उसी पदबंध के बाद लगाया गया है जिससे वह अर्थगत रूप से संबंधित है।
