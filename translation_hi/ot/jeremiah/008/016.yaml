source:
  edition: WLC
  text: מִ/דָּ֤ן נִשְׁמַע֙ נַחְרַ֣ת סוּסָ֗י/ו מִ/קּוֹל֙ מִצְהֲל֣וֹת אַבִּירָ֔י/ו רָעֲשָׁ֖ה כָּל הָ/אָ֑רֶץ וַ/יָּב֗וֹאוּ וַ/יֹּֽאכְלוּ֙ אֶ֣רֶץ וּ/מְלוֹאָ֔/הּ עִ֖יר וְ/יֹ֥שְׁבֵי בָֽ/הּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/016.yaml
  text: From Dan is heard the snorting of his horses[a]; at the sound of the neighing of his stallions the whole land quakes. They come and devour the land and its fullness[c][b], the city and those who dwell in it.
translation:
  language: hi
  text: दान से उसके घोड़ों की फुँफकार सुनाई देती है; उसके शक्तिशाली घोड़ों के हिनहिनाने की आवाज़ से सारा देश[a] काँप उठता है। वे आते हैं और देश तथा उसमें जो कुछ है[b], नगर और उसमें रहने वालों को निगल जाते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सारी धरती।” इब्रानी אֶרֶץ का अर्थ ‘देश’ या ‘धरती’ हो सकता है; यहाँ आक्रमण के संदर्भ में ‘देश’ लिया गया है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “देश और उसकी भरपूरी”; अर्थात उसमें भरी हुई सारी वस्तुएँ।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדָּן
  choice: दान से
  rationale: מִן स्रोत या दिशा को सूचित करता है; दान उत्तरी सीमा का स्थान है, जहाँ से आक्रमणकारी की आहट सुनाई देती है।
- source_word: נִשְׁמַע נַחְרַת סוּסָיו
  choice: उसके घोड़ों की फुँफकार सुनाई देती है
  rationale: निफ़ाल क्रिया का श्रव्य, कर्मवाच्य भाव रखा गया है; נַחְרַת घोड़ों की तेज साँस या फुँफकार को चित्रित करता है। पुल्लिंग एकवचन प्रत्यय को ‘उसके’ से सुरक्षित रखा गया है, बिना उसके संदर्भ को अनावश्यक रूप से निश्चित किए।
- source_word: מִצְהֲלוֹת אַבִּירָיו
  choice: उसके शक्तिशाली घोड़ों के हिनहिनाने
  rationale: אַבִּירָיו का मूल भाव ‘बलवान’ है और घोड़ों के संदर्भ में शक्तिशाली युद्ध-घोड़ों को दर्शाता है। ‘शक्तिशाली घोड़े’ ‘नर घोड़े’ की अपेक्षा स्रोत की अर्थगत व्यापकता बनाए रखता है।
- source_word: רָעֲשָׁה כָּל הָאָרֶץ
  choice: सारा देश काँप उठता है
  rationale: आक्रमण और उजाड़ के निकट संदर्भ में אֶרֶץ के लिए ‘देश’ स्वाभाविक है; רָעֲשָׁה के तीव्र कंपन को ‘काँप उठता है’ व्यक्त करता है।
- source_word: וַיָּבֹאוּ וַיֹּאכְלוּ
  choice: वे आकर … निगल जाते हैं
  rationale: भविष्यसूचक दृश्य की जीवंतता के लिए हिन्दी वर्तमान काल रखा गया है। ‘निगल जाते हैं’ खाने की मूल उपमा और विनाश की हिंसक तीव्रता दोनों को सुरक्षित रखता है।
- source_word: אֶרֶץ וּמְלוֹאָהּ
  choice: देश और उसमें जो कुछ है
  rationale: शाब्दिक ‘देश और उसकी परिपूर्णता’ आधुनिक हिन्दी में अस्पष्ट होता; यह रूप מְלוֹאָהּ का आशय—देश को भरनेवाली समस्त वस्तुएँ—स्वाभाविक ढंग से देता है।
- source_word: עִיר וְיֹשְׁבֵי בָהּ
  choice: नगर और उसमें रहनेवालों
  rationale: यह יֹשְׁבֵי के कृदन्तीय भाव को बनाए रखते हुए गरिमापूर्ण और सहज आधुनिक हिन्दी देता है।
theological_decisions:
- issue: אֶרֶץ का अर्थ-क्षेत्र
  choice: मुख्य पाठ में ‘देश’
  alternative: ‘धरती’
  rationale: तात्कालिक प्रसंग यहूदा के भूभाग पर आक्रमण का है, इसलिए ‘देश’ अधिक उपयुक्त है; व्यापक ‘धरती’ भी शब्दार्थ की दृष्टि से संभव है और उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में भविष्यसूचक, जीवंत और गरिमापूर्ण शैली रखी गई है। ‘फुँफकार’, ‘हिनहिनाने’ और ‘निगल जाते हैं’ मूल के श्रव्य और हिंnehmerात्मक बिंबों को स्पष्ट करते हैं। मुख्य पाठ का एकमात्र पादटिप्पणी-चिह्न [a] संबंधित वाक्यांश के तुरंत बाद दिया गया है।
