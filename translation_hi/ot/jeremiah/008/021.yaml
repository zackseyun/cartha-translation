- source_word: הָשְׁבָּרְתִּי
  choice: मैं टूट गया हूँ
  rationale: यह क्रिया שֶׁבֶר वाले ही मूल से बनी है; इसलिए ‘टूटने से मैं टूट गया हूँ’ मूल के जानबूझकर किए गए शब्दालंकार और वक्ता की वर्तमान शोकाकुल दशा दोनों को व्यक्त करता है।
- source_word: קָדַרְתִּי
  choice: मैं शोकमग्न हूँ
  rationale: क्रिया का मूल बिंब अँधेरा या काला पड़ना है, जो यहाँ दुःख और मातम सूचित करता है। मुख्य पाठ में सहज आधुनिक हिन्दी अर्थ दिया गया है और अँधेरे का बिंब पाद-टिप्पणी में रखा गया है।
- source_word: שַׁמָּה
  choice: दहशत
  rationale: संदर्भ में यह संज्ञा भयावह स्तब्धता, आतंक या सिहरन का भाव देती है। ‘दहशत’ आधुनिक हिन्दी में इसकी तीव्र भावात्मक शक्ति को संक्षेप में व्यक्त करती है।
- source_word: הֶחֱזִקַתְנִי
  choice: ने मुझे जकड़ लिया है
  rationale: हिफ़ील रूप किसी बात के बलपूर्वक पकड़ लेने या काबू पा लेने को दर्शाता है। ‘जकड़ लिया है’ उस तीव्र और प्रभावी पकड़ को स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: प्रथम पुरुष वक्ता की पहचान
  choice: ‘मैं’ को बिना किसी नाम या उपाधि के रखा गया है।
  alternative: वक्ता को स्पष्ट रूप से यिर्मयाह या यहोवा बताना।
  rationale: इस एक पद का हिब्रू पाठ वक्ता का नाम नहीं देता, और व्यापक अंश में भविष्यद्वक्ता तथा परमेश्वर की वाणी के बीच तनाव अनुभव किया जा सकता है। अनुवाद उस संभावित अस्पष्टता को अपने स्तर पर नहीं सुलझाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और विलाप के अनुरूप रखी गई है। ‘प्रजा की बेटी’ जैसे मूल भविष्यवाणी-रूपक तथा ‘टूटने…टूट गया’ शब्दालंकार को बनाए रखा गया है; कम परिचित अर्थ-छायाएँ पाद-टिप्पणियों में स्पष्ट की गई हैं।
