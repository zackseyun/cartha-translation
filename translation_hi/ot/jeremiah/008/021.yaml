  text: For the brokenness of the daughter of my people I am broken[a]; I mourn[c][b]; horror has seized me.
translation:
  language: hi
  text: मेरी प्रजा की बेटी[a] की टूटन पर मैं टूट गया हूँ[b]; मैं शोकमग्न हूँ[c]; दहशत ने मुझे जकड़ लिया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मेरी प्रजा की बेटी’ प्रजा को एक बेटी के रूप में प्रस्तुत करने वाली भविष्यवाणी-साहित्य की अभिव्यक्ति है। यहाँ यहूदा/इस्राएल की प्रजा अभिप्रेत है।
    reason: cultural_note
  - marker: b
    text: हिब्रू में ‘टूटन’ और ‘मैं टूट गया हूँ’ के लिए एक ही मूल शब्द प्रयुक्त हुआ है; इससे जानबूझकर शब्दालंकार बनता है। इसका अनुवाद ‘मेरी प्रजा की बेटी के विनाश के कारण मैं चकनाचूर हो गया हूँ’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘मैं अंधकारमय हो गया हूँ’ अथवा ‘मैं मातम में फिरता हूँ।’ हिब्रू क्रिया में शोक से जुड़े अँधेरे का बिंब है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל שֶׁבֶר
  choice: के टूटने से
  rationale: यह पदबंध उस विपत्ति को वक्ता की दशा का कारण बताता है। ‘टूटने से’ שֶׁבֶר के टूटन/विनाश के रूपक को बनाए रखता है और अगले समान-मूल क्रिया-पद के साथ स्वाभाविक हिन्दी शब्दालंकार बनाता है।
