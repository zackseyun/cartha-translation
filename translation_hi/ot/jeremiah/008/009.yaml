source:
  edition: WLC
  text: הֹבִ֣ישׁוּ חֲכָמִ֔ים חַ֖תּוּ וַ/יִּלָּכֵ֑דוּ הִנֵּ֤ה בִ/דְבַר יְהוָה֙ מָאָ֔סוּ וְ/חָכְמַֽת מֶ֖ה לָ/הֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/009.yaml
  text: The wise men are put to shame; they are dismayed and captured. Look[a], they have rejected the word of Yahweh, so what wisdom do they have?
translation:
  language: hi
  text: बुद्धिमान लज्जित किए गए; वे घबरा गए और पकड़े गए[a]। देखो, उन्होंने याहवे के वचन को ठुकरा दिया है; तो उनके पास कैसी बुद्धि है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘काबू में आ गए’ अथवा ‘फँस गए।’ इब्रानी क्रिया पकड़े जाने, काबू में आने या जाल में फँसने का अर्थ दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֹבִישׁוּ
  choice: लज्जित हुए
  rationale: यह रूप सार्वजनिक अपमान और पराजय की दशा व्यक्त करता है। ‘लज्जित हुए’ स्वाभाविक हिन्दी में बाहरी अपमान और उसके अनुभव—दोनों को खुला रखता है।
- source_word: חֲכָמִים
  choice: बुद्धिमान
  rationale: यहाँ संज्ञा के रूप में प्रयुक्त बहुवचन उन मान्य ज्ञानियों या बुद्धिमान अगुओं की ओर संकेत करता है। हिन्दी में ‘बुद्धिमान’ प्रसंगानुसार संज्ञात्मक और सहज है।
- source_word: חַתּוּ
  choice: हतप्रभ हो गए
  rationale: क्रिया साहस टूटने, घबरा जाने या स्तब्ध रह जाने का भाव देती है। ‘हतप्रभ हो गए’ भविष्यद्वक्ताई निंदा के इस क्रम में मानसिक टूटन और व्याकुलता को व्यक्त करता है।
- source_word: וַיִּלָּכֵדוּ
  choice: और पकड़े गए
  rationale: לכד पकड़े जाने, काबू में आने या फँसने का बिंब देता है। ‘पकड़े गए’ उसके मूल अर्थ को स्पष्ट रखता है; ‘फँस गए’ को पादटिप्पणी में विकल्प के रूप में दिया गया है।
- source_word: הִנֵּה
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला कथन-सूचक है। ‘देखो’ आधुनिक, स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: בִדְבַר יְהוָה
  choice: यहोवा के वचन को
  rationale: נְבַר भविष्यद्वक्ताई संदर्भ में परमेश्वर के प्रकट वचन या संदेश को दर्शाता है। ‘वचन’ इस धार्मिक-साहित्यिक अर्थ को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबल परंपरा में टेट्राग्रामटन का व्यापक और पहचानने योग्य नामरूप ‘यहोवा’ है; यह सामान्य उपाधि में बदलने के बजाय व्यक्तिगत वाचा-नाम को सुरक्षित रखता है।
- source_word: מָאָסוּ
  choice: ठुकरा दिया है
  rationale: מאס जानबूझकर अस्वीकार या तिरस्कार करने को दर्शाता है। ‘ठुकरा दिया है’ दोषपूर्ण और सक्रिय अस्वीकृति को सहज हिन्दी में व्यक्त करता है।
- source_word: וְחָכְמַת מֶה לָהֶם
  choice: फिर उनके पास कैसी बुद्धि है?
  rationale: यह आलंकारिक प्रश्न उनके सच्ची बुद्धि रखने के दावे को चुनौती देता है। ‘कैसी बुद्धि’ कथन की तीखी प्रश्नात्मकता बनाए रखता है, बिना उसे सीधे निषेधात्मक कथन में बदलने के।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ व्यक्तिगत ईश्वरीय नाम का प्रयोग करता है। ‘यहोवा’ आधुनिक हिन्दी बाइबल पाठकों में व्यापक रूप से पहचाना जाता है और नाम को ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं करता; ‘याहवे’ अधिक संभावित विद्वत्तापरक उच्चारण है।
- issue: वचन को ठुकराने और बुद्धि के संबंध की अभिव्यक्ति
  choice: 'आलंकारिक प्रश्न को बनाए रखा गया: ‘फिर उनके पास कैसी बुद्धि है?’'
  alternative: ‘इसलिए उनमें कोई बुद्धि नहीं है।’
  rationale: मूल इब्रानी स्पष्ट सैद्धांतिक निष्कर्ष के बजाय तीखा आलंकारिक प्रश्न रखता है। प्रश्नरूप मूल की धार्मिक चुनौती और तनाव को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, संक्षिप्त और भविष्यद्वक्ताई निंदा के अनुरूप गरिमापूर्ण रखी गई है। अर्धविराम मूल कथन की चरणबद्ध गति और अंतिम आलंकारिक प्रश्न के तर्क-संबंध को स्पष्ट करता है। पादटिप्पणी-चिह्न उसी शब्दसमूह पर रखा गया है जिससे उसका वास्तविक lexical विकल्प संबंधित है।
