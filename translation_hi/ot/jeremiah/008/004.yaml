base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/004.yaml
  text: 'You shall say to them[a], ‘Thus says Yahweh: Do people fall and not rise again? Does one turn away and not return?’'
translation:
  language: hi
  text: 'तुम उनसे कहना, “याहवे यों कहते हैं: क्या लोग गिरते हैं और फिर नहीं उठते? क्या कोई मुड़ जाता है और फिर लौटकर नहीं आता?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इसे इस प्रकार भी समझा जा सकता है: “क्या कोई लौटता है और फिर नहीं लौटता?” इब्रानी में आलंकारिक प्रभाव के लिए दोनों स्थानों पर एक ही क्रिया (‘मुड़ना/लौटना’) दोहराई गई है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: तुम उनसे कहना
  rationale: यह यिर्मयाह को दिया गया सीधा भविष्यसूचक निर्देश है। आरम्भिक संयोजक को स्वाभाविक हिन्दी में अलग से व्यक्त नहीं किया गया, जबकि निर्देश का बल ‘कहना’ से बना रहता है।
- source_word: כֹּה אָמַר יְהוָה
  choice: याहवे यों कहते हैं
  rationale: यह मानक भविष्यसूचक संदेश-सूत्र है; ‘यों कहते हैं’ गरिमापूर्ण और स्वाभाविक हिन्दी में उसके औपचारिक स्वर को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: הֲיִפְּלוּ וְלֹא יָקוּמוּ
  choice: क्या लोग गिरते हैं और फिर नहीं उठते?
  rationale: प्रश्नवाचक कण और बहुवचन क्रिया एक सामान्य, आलंकारिक प्रश्न बनाते हैं। ‘फिर’ गिरने के बाद दोबारा उठने का आशय स्पष्ट करता है।
- source_word: אִם יָשׁוּב וְלֹא יָשׁוּב
  choice: क्या कोई मुड़ जाता है और फिर लौटकर नहीं आता?
  rationale: אִם यहाँ पहले प्रश्न के समानांतर दूसरा आलंकारिक प्रश्न प्रस्तुत करता है। पहले שׁוב का अर्थ दिशा से मुड़ना और दूसरे का लौटना समझते हुए हिन्दी में स्वाभाविक विरोध व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा ‘प्रभु’
  rationale: पाठ में व्यक्तिगत वाचा-नाम सीधे उपस्थित है; ‘याहवे’ उसका लिप्यंतरण करते हुए नाम और उपाधि के भेद को सुरक्षित रखता है।
- issue: שׁוב की पुनरावृत्ति का अर्थ
  choice: पहली बार ‘मुड़ जाता है’, दूसरी बार ‘लौटकर नहीं आता’
  alternative: दोनों बार ‘लौटना’
  rationale: संदर्भ में पहली क्रिया के ‘मुड़ जाने’ और दूसरी के ‘वापस आने’ के अर्थ के बीच तनाव है। अनुवाद इसे स्वाभाविक हिन्दी में व्यक्त करता है और पादटिप्पणी मूल की शब्द-पुनरावृत्ति बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और मौखिक रूप से सहज भविष्यसूचक गद्य। दोनों आलंकारिक प्रश्नों की समानांतर संरचना और मूल की सामान्य मानवीय स्थिति बनाए रखी गई है।
