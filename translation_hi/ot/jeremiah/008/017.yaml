  text: כִּי֩ הִנְ/נִ֨י מְשַׁלֵּ֜חַ בָּ/כֶ֗ם נְחָשִׁים֙ צִפְעֹנִ֔ים אֲשֶׁ֥ר אֵין לָ/הֶ֖ם לָ֑חַשׁ וְ/נִשְּׁכ֥וּ אֶתְ/כֶ֖ם נְאֻם יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/017.yaml
  text: For behold[a], I am sending among you snakes, vipers that cannot be charmed, and they will bite you[b], declares Yahweh.
translation:
  language: hi
  text: क्योंकि देखो, मैं तुम्हारे बीच साँप—विषैले साँप[a]—भेज रहा हूँ, जिन्हें मंत्र से वश में नहीं किया जा सकता[b]। वे तुम्हें डसेंगे—यहोवा की यह घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘विषधर साँप’। इब्रानी शब्द किसी विषैले साँप को सूचित करता है; उसकी ठीक प्रजाति निश्चित नहीं है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप में, ‘जिनके लिए कोई मंत्र नहीं है’; आशय है कि उन्हें मंत्र से वश में नहीं किया जा सकता।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ उसके संयोजक बल को बनाए रखता है।
- source_word: הִנְנִי
  choice: देखो, मैं
  rationale: यह रचना ध्यान आकर्षित करते हुए वक्ता की आसन्न और निश्चित कार्रवाई पर बल देती है; आधुनिक हिन्दी में ‘देखो, मैं’ स्वाभाविक और प्रभावशाली है।
- source_word: מְשַׁלֵּחַ
  choice: भेज रहा हूँ
  rationale: हिन्नी के साथ कृदन्त आसन्न अथवा निश्चित कार्रवाई व्यक्त करता है; ‘भेज रहा हूँ’ इस भाव को सहज हिन्दी में रखता है।
- source_word: בָּכֶם
  choice: तुम्हारे बीच
  rationale: पूर्वसर्ग यहाँ लोगों के बीच साँप छोड़े जाने की छवि देता है; न्याय का विरोधी भाव प्रसंग से स्पष्ट रहता है।
- source_word: נְחָשִׁים
  choice: साँप
  rationale: यह सामान्य संज्ञा का सीधा, प्रचलित और आधुनिक हिन्दी रूप है।
- source_word: צִפְעֹנִים
  choice: विषैले नाग
  rationale: इब्रानी शब्द किसी विषधर साँप को सूचित करता है। ‘विषैले नाग’ सामान्य पाठक के लिए खतरे को स्पष्ट करता है, जबकि सटीक प्रजाति के विषय में अनावश्यक निश्चितता से बचता है।
- source_word: אֲשֶׁר אֵין לָהֶם לָחַשׁ
  choice: जिन पर कोई मंत्र नहीं चलता
  rationale: शाब्दिक रूप में इनके लिए कोई ‘मंत्र/फुसफुसाया हुआ जादू’ नहीं है। हिन्दी मुहावरा अर्थ को स्पष्ट रखते हुए मूल के जादुई मंत्र वाले बिंब को बनाए रखता है।
- source_word: וְנִשְּׁכוּ אֶתְכֶם
  choice: वे तुम्हें डसेंगे
  rationale: क्रिया विशेष रूप से साँप के काटने को दर्शाती है; हिन्दी में ‘डसना’ इसका सटीक और स्वाभाविक शब्द है।
- source_word: נְאֻם יְהוָה
  choice: यह यहोवा की घोषणा है
  rationale: यह भविष्यद्वाणी का औपचारिक सूत्र है; ‘घोषणा’ उसकी गंभीरता बनाए रखता है और יְהוָה को उसके व्यक्तिगत नाम ‘यहोवा’ के रूप में प्रस्तुत करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु / याहवे
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे प्रयुक्त है। हिन्दी में व्यापक रूप से पहचाना जाने वाला ‘यहोवा’ नाम को उपाधि में बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: साँपों पर मंत्र न चलने का आशय
  choice: मंत्र द्वारा उन्हें वश में न किया जा सकना
  alternative: उनके लिए कोई उपचार न होना
  rationale: לחש का मूल संबंध फुसफुसाए गए मंत्र अथवा सर्प-मोहन से है। पाठ को विष के उपचार के विषय में कहना मूल की अपेक्षा अधिक व्याख्यात्मक होता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘देखो’ चेतावनी की तात्कालिकता, ‘डसेंगे’ साँप के आक्रमण की सटीकता, और ‘घोषणा’ भविष्यद्वाणी-सूत्र की गंभीरता को बनाए रखते हैं। पादटिप्पणी-चिह्नों को उन शब्दों के साथ रखा गया है जिनकी वे वास्तव में व्याख्या करते हैं।
