base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/010.yaml
  text: Therefore I will give their wives to others[a], their fields to those who will possess them; for from the least even to the greatest, every one of them is greedy for unjust gain; from prophet even to priest[c][b], every one of them practices falsehood.
translation:
  language: hi
  text: इसलिए मैं उनकी पत्नियों को दूसरों को दे दूँगा और उनके खेत उन लोगों को, जो उन पर अधिकार करेंगे[a]; क्योंकि छोटे से लेकर बड़े तक, हर कोई अन्याय की कमाई का लोभी है[b]; भविष्यद्वक्ता से लेकर याजक तक, हर कोई छल करता है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके खेत उत्तराधिकारियों को।” इब्रानी क्रिया का अर्थ “विरासत में पाना” या “अधिकार में लेना” हो सकता है; यहाँ नए लोगों द्वारा खेतों पर अधिकार करने का भाव भी सम्मिलित है।
    reason: lexical_alternative
  - marker: b
    text: या, “कमाई का लोभी है।” इब्रानी अभिव्यक्ति सामान्य लाभ-लालसा भी बता सकती है, पर भविष्यद्वक्ताओं के ऐसे संदर्भों में प्रायः बेईमानी या अन्याय से मिलने वाले लाभ का संकेत देती है।
    reason: lexical_alternative
  - marker: c
    text: या, “झूठ का व्यवहार करता है” अथवा “कपट से काम करता है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह निष्कर्षसूचक शब्द पिछले अभियोग के परिणामस्वरूप आने वाले न्याय को स्पष्ट रूप से जोड़ता है।
- source_word: אֶתֵּן
  choice: मैं ... दे दूँगा
  rationale: भविष्यसूचक न्याय-वचन में प्रथम पुरुष अपूर्ण क्रिया घोषित भावी कार्य को व्यक्त करती है।
- source_word: נְשֵׁיהֶם
  choice: उनकी पत्नियों
  rationale: संबंधसूचक प्रत्यय और सामाजिक न्याय के संदर्भ में यहाँ ‘स्त्रियों’ की अपेक्षा ‘पत्नियों’ का अर्थ अधिक उपयुक्त है।
- source_word: לַאֲחֵרִים
  choice: दूसरों को
  rationale: यह मूल के सामान्य ‘अन्य लोगों’ के अर्थ को रखता है और अनावश्यक रूप से उनकी पहचान नहीं बताता।
- source_word: שְׂדוֹתֵיהֶם
  choice: उनके खेत
  rationale: मूल में ठोस कृषि-संपत्ति का उल्लेख है; ‘खेत’ इसका सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: לְיוֹרְשִׁים
  choice: उन लोगों को, जो उन पर अधिकार करेंगे
  rationale: ירשׁ का अर्थ विरासत पाना और अधिकार में लेना दोनों हो सकता है; इस न्याय-संदर्भ में नए लोगों द्वारा खेतों पर अधिकार करना प्रमुख है।
- source_word: כִּי מִקָּטֹן וְעַד גָּדוֹל
  choice: क्योंकि छोटे से लेकर बड़े तक
  rationale: यह सामाजिक स्तर के दोनों सिरों द्वारा पूरे समुदाय को समेटने वाली मूल अभिव्यक्ति को स्वाभाविक हिन्दी में रखता है।
- source_word: כֻּלֹּה
  choice: हर कोई
  rationale: एकवचन रूप यहाँ वितरणात्मक अर्थ देता है—बिना अपवाद प्रत्येक व्यक्ति।
- source_word: בֹּצֵעַ בָּצַע
  choice: अन्याय की कमाई का लोभी है
  rationale: एक ही मूल से बने क्रिया-विशेष्य का यह मेल अनुचित लाभ पाने की लालसा को तीव्रता से व्यक्त करता है।
- source_word: מִנָּבִיא וְעַד כֹּהֵן
  choice: भविष्यद्वक्ता से लेकर याजक तक
  rationale: यह धार्मिक नेतृत्व के पूरे दायरे को दिखाने वाली मूल समानांतर अभिव्यक्ति को सुरक्षित रखता है।
- source_word: עֹשֶׂה שָּׁקֶר
  choice: छल करता है
  rationale: यह केवल एक झूठ बोलने के बजाय लगातार कपटपूर्ण आचरण करने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: पत्नियों और खेतों के छिन जाने के रूप में घोषित न्याय का स्वरूप
  choice: प्रभु स्वयं परिवार और संपत्ति को दूसरों के हाथ सौंपने का न्याय घोषित करते हैं।
  alternative: इसे केवल युद्धकालीन हानि का वर्णन मानना, जिसमें वाचा-संबंधी दंड का संकेत न हो।
  rationale: प्रथम पुरुष ‘मैं ... दे दूँगा’ इस हानि को परमेश्वर के न्यायिक कार्य के रूप में प्रस्तुत करता है; अनुवाद इसकी कठोरता को बनाए रखता है, पर मूल से अधिक विवरण नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप अपनाया गया है। समानांतर संरचना—‘छोटे से लेकर बड़े तक’ और ‘भविष्यद्वक्ता से लेकर याजक तक’—को बनाए रखा गया है। ‘अधिकार करेंगे’ और ‘छल करता है’ जैसे पद सामान्य पाठक के लिए स्पष्ट हैं, जबकि वैकल्पिक अर्थ पादटिप्पणियों में सुरक्षित हैं।
