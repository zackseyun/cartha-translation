  text: מִֽי יִתֵּ֤ן רֹאשִׁ/י֙ מַ֔יִם וְ/עֵינִ֖/י מְק֣וֹר דִּמְעָ֑ה וְ/אֶבְכֶּה֙ יוֹמָ֣ם וָ/לַ֔יְלָה אֵ֖ת חַֽלְלֵ֥י בַת עַמִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/023.yaml
  text: Oh[a], that my head were water, and my eyes a fountain of tears, so that I might weep day and night for the slain of the daughter of my people.
translation:
  language: hi
  text: काश[a] मेरा सिर पानी होता और मेरी आँखें आँसुओं का सोता होतीं, और मैं अपनी प्रजा की बेटी के मारे हुओं के लिए दिन-रात रोता रहता!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से आरम्भिक हिब्रू मुहावरा है, “कौन देगा कि...?” इसका अर्थ तीव्र अभिलाषा है: “काश...।” हिब्रू में “आँख” एकवचन है, जिसे हिन्दी में स्वाभाविक रूप से “आँखें” कहा गया है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: काश
  rationale: यह हिब्रू मुहावरा शाब्दिक प्रश्न नहीं, बल्कि तीव्र इच्छा और विलाप व्यक्त करता है। ‘काश’ आधुनिक हिन्दी में इस भाव को स्वाभाविक और संक्षिप्त रूप से व्यक्त करता है।
- source_word: רֹאשִׁי מַיִם
  choice: मेरा सिर पानी होता
  rationale: मूल की सशक्त शारीरिक और काव्यात्मक छवि को बिना अमूर्त किए सुरक्षित रखा गया है।
- source_word: וְעֵינִי מְקוֹר דִּמְעָה
  choice: और मेरी आँखें आँसुओं का सोता होतीं
  rationale: हिब्रू में ‘आँख’ एकवचन है, पर हिन्दी में रोने के संदर्भ में बहुवचन ‘आँखें’ अधिक स्वाभाविक है। ‘सोता’ מְקוֹר के जल-स्रोत संबंधी बिंब को बनाए रखता है।
- source_word: וְאֶבְכֶּה
  choice: तब मैं ... रोता रहता
  rationale: इच्छासूचक प्रसंग में यह अपेक्षित परिणाम व्यक्त करता है; ‘रोता रहता’ निरंतर विलाप के भाव को अगले पदबंध ‘दिन-रात’ के साथ स्वाभाविक बनाता है।
- source_word: יוֹמָם וָלַיְלָה
  choice: दिन-रात
  rationale: यह निरंतरता व्यक्त करने वाला स्वाभाविक हिन्दी युग्म है।
- source_word: חַלְלֵי
  choice: मारे हुओं
  rationale: संदर्भ में यह घायल व्यक्तियों के बजाय हिंसा या युद्ध में मारे गए लोगों को दर्शाता है।
- source_word: בַת עַמִּי
  choice: मेरी प्रजा की बेटी
  rationale: भविष्यवाणी-साहित्य की सामुदायिक स्त्री-व्यक्तिकरण वाली मूल छवि को बनाए रखा गया है, यद्यपि हिन्दी में यह जानबूझकर काव्यात्मक सुनाई देती है।
theological_decisions:
- issue: בַת עַמִּי के सामुदायिक व्यक्तिकरण को सरल करके केवल ‘मेरी प्रजा’ कर देना
  choice: ‘मेरी प्रजा की बेटी’ के रूप में रूपक सुरक्षित रखा
  alternative: मेरी प्रजा; मेरी प्यारी प्रजा
  rationale: मूल पद समुदाय को बेटी के रूप में व्यक्त करता है। इसे समतल कर देने से यिर्मयाह के विलाप की साहित्यिक और भावात्मक बनावट घट जाती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘काश’, ‘आँसुओं का सोता’ और ‘दिन-रात’ साधारण पाठक के लिए बोधगम्य हैं, जबकि मूल विलाप की तीव्रता और शारीरिक बिंब सुरक्षित रहते हैं।
