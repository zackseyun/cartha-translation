  text: אֵיכָ֤ה תֹֽאמְרוּ֙ חֲכָמִ֣ים אֲנַ֔חְנוּ וְ/תוֹרַ֥ת יְהוָ֖ה אִתָּ֑/נוּ אָכֵן֙ הִנֵּ֣ה לַ/שֶּׁ֣קֶר עָשָׂ֔ה עֵ֖ט שֶׁ֥קֶר סֹפְרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/008.yaml
  text: How can you say[a], ‘We are wise, and the law of Yahweh is with us’? But look, the lying pen of the scribes has made it into a lie.
translation:
  language: hi
  text: तुम कैसे कहते हो, “हम बुद्धिमान हैं, और यहोवा की व्यवस्था हमारे पास है”? पर देखो, शास्त्रियों की झूठी लेखनी ने झूठ रचा है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “निश्चय, देखो, शास्त्रियों की लेखनी ने झूठ रचा है,” अथवा, “शास्त्रियों की झूठी लेखनी ने झूठा काम किया है।” इब्रानी वाक्य संक्षिप्त है और शास्त्रियों की लेखनी तथा उसके झूठ से संबंध को एक से अधिक ढंग से समझने की गुंजाइश देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיכָה תֹאמְרוּ
  choice: तुम कैसे कह सकते हो
  rationale: यह वाक्यांश रोष और अविश्वास से भरा आलंकारिक प्रश्न है; आधुनिक हिन्दी में यह प्रयोग उस बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: חֲכָמִים אֲנַחְנוּ
  choice: हम बुद्धिमान हैं
  rationale: दावा सामान्य रूप से बुद्धिमान होने का है; ‘ज्ञानी’ भी सम्भव है, पर ‘बुद्धिमान’ साधारण आधुनिक हिन्दी में अधिक सीधा है।
- source_word: תּוֹרַת יְהוָה
  choice: यहोवा की व्यवस्था
  rationale: תּוֹרָה का अर्थ शिक्षा या निर्देश भी हो सकता है, पर यहाँ वाचा से जुड़ी लिखित व्यवस्था प्रमुख है; ‘व्यवस्था’ उस अर्थ को बनाए रखती है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है, न कि उसे किसी उपाधि से बदला गया है।
- source_word: אִתָּנוּ
  choice: हमारे पास है
  rationale: शाब्दिक अर्थ ‘हमारे साथ है’ है, किंतु इस प्रसंग में व्यवस्था को अपने अधिकार या पास होने का दावा व्यक्त हो रहा है; ‘हमारे पास’ हिन्दी में स्वाभाविक है और दावे को अनावश्यक रूप से नहीं खोलता।
- source_word: אָכֵן הִנֵּה
  choice: पर देखो
  rationale: यह जोड़ा पिछले दावे का जोरदार खंडन करते हुए ध्यान खींचता है; ‘पर देखो’ आधुनिक और गरिमापूर्ण हिन्दी में दोनों कार्य करता है।
- source_word: עֵט שֶׁקֶר סֹפְרִים
  choice: शास्त्रियों की झूठी लेखनी
  rationale: संकुचित इब्रानी रचना में שֶׁקֶר को लेखन-साधन की विशेषता माना गया है। ‘लेखनी’ लिखने के साधन के साथ उसके लिखित कार्य को भी स्वाभाविक हिन्दी में संकेत करती है।
- source_word: לַשֶּׁקֶר עָשָׂה
  choice: उसे झूठ बना दिया है
  rationale: לַשֶּׁקֶר का परिणामसूचक बल और עָשָׂה का ‘बनाना’ अर्थ सुरक्षित रहता है; ‘उसे’ निकटवर्ती व्यवस्था की ओर संकेत करता है।
theological_decisions:
- issue: भविष्यद्वक्ता के विवाद में תּוֹרַת יְהוָה का अनुवाद
  choice: यहोवा की व्यवस्था
  alternative: यहोवा की शिक्षा
  rationale: पद उन लोगों की निंदा करता है जो यहोवा की तोरा अपने पास होने का दावा करते हुए उसे लेखकीय रीति से मिथ्या बनाते हैं। ‘व्यवस्था’ वाचागत और पाठगत अर्थ को रखती है, जबकि ‘शिक्षा’ वैध व्यापक विकल्प है।
- issue: शास्त्रियों की भूमिका और पाठ को ‘झूठ’ बनाने का आरोप
  choice: वाक्य को शास्त्रियों की लेखनी द्वारा व्यवस्था को झूठ बना देने के आरोप के रूप में रखा गया
  alternative: लेखनी ने झूठ का काम किया / शास्त्रियों की लेखनी स्वयं झूठी है
  rationale: इब्रानी वाक्य अत्यंत संक्षिप्त और कुछ हद तक अस्पष्ट है। मुख्य पाठ एक सम्भावित परिणामसूचक अर्थ देता है, जबकि पादटिप्पणी अन्य व्याकरणिक सम्भावनाओं को सुरक्षित रखती है; इससे आरोप की प्रकृति को किसी विशिष्ट ऐतिहासिक या सम्प्रदायगत सिद्धांत से नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है—सीधी, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य। ‘शास्त्री’ प्राचीन लिखित धार्मिक सामग्री से जुड़े סֹפְרִים के लिए स्थापित और प्रसंगानुकूल शब्द है। मुख्य पाठ की संक्षिप्तता मूल के तीखे आलंकारिक स्वर को बनाए रखती है।
