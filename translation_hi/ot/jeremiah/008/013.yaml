source:
  edition: WLC
  text: אָסֹ֥ף אֲסִיפֵ֖/ם נְאֻם יְהֹוָ֑ה אֵין֩ עֲנָבִ֨ים בַּ/גֶּ֜פֶן וְ/אֵ֧ין תְּאֵנִ֣ים בַּ/תְּאֵנָ֗ה וְ/הֶֽ/עָלֶה֙ נָבֵ֔ל וָ/אֶתֵּ֥ן לָ/הֶ֖ם יַעַבְרֽוּ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/013.yaml
  text: I will surely gather them[a], declares Yahweh. There are no grapes on the vine, and no figs on the fig tree; even the leaf has withered[b], and what I gave them will pass away from them.
translation:
  language: hi
  text: 'याहवे की यह घोषणा है: “मैं निश्चय ही उन्हें समेट लूँगा[a]। दाख की बेल पर अंगूर नहीं हैं, और अंजीर के पेड़ पर अंजीर नहीं हैं; यहाँ तक कि पत्ते भी मुरझा गए हैं, और जो कुछ मैंने उन्हें दिया था, वह उनसे चला जाएगा[b]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं उन्हें पूरी तरह हटा दूँगा,” अथवा “मैं उन्हें निश्चय ही नष्ट कर दूँगा।” इब्रानी में ‘इकट्ठा करने’ की क्रिया पर विशेष बल है; न्याय के इस प्रसंग में उसका आशय हटा देना या नष्ट कर देना भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: अंतिम इब्रानी उपवाक्य कठिन और संक्षिप्त है। इसका अर्थ यह भी हो सकता है, “जो कुछ मैंने उन्हें दिया था, वह उनसे छीन लिया जाएगा,” या इसी प्रकार का कोई कथन।
    reason: alternative_reading
lexical_decisions:
- source_word: אָסֹף אֲסִיפֵם
  choice: मैं निश्चय ही उन्हें समेट लूँगा
  rationale: एक ही धातु के क्रियार्थक संज्ञा और रूपांतरित क्रिया का साथ आना क्रिया पर बल देता है। ‘समेट लूँगा’ मूल अर्थ ‘इकट्ठा करना/हटा लेना’ को बनाए रखता है और न्याय के प्रसंग में विनाशकारी हटाए जाने का संकेत भी देता है, पर उसे अनावश्यक रूप से निश्चित नहीं करता।
- source_word: נְאֻם יְהוָה
  choice: याहवे की यह घोषणा है
  rationale: यह भविष्यद्वाणी में प्रयुक्त औपचारिक घोषणा-सूत्र है। परमेश्वर के व्यक्तिगत नाम יהוה को ‘याहवे’ रूप में रखा गया है।
- source_word: אֵין עֲנָבִים בַּגֶּפֶן
  choice: दाखलता पर अंगूर नहीं हैं
  rationale: अस्तित्व के अभाव को बताने वाली सीधी इब्रानी संरचना और कृषि-बिंब दोनों सुरक्षित रखे गए हैं।
- source_word: וְאֵין תְּאֵנִים בַּתְּאֵנָה
  choice: और अंजीर के पेड़ पर अंजीर नहीं हैं
  rationale: फल और उसके पेड़ की पुनरुक्ति को स्वाभाविक हिन्दी में स्पष्ट रूप से रखा गया है।
- source_word: וְהֶעָלֶה נָבֵל
  choice: यहाँ तक कि पत्ता भी मुरझा गया है
  rationale: एकवचन ‘पत्ता’ को प्रतिनिधिक/सामूहिक अर्थ में रखा गया है; ‘मुरझा गया है’ परिणामी दशा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וָאֶתֵּן לָהֶם
  choice: जो कुछ मैंने उन्हें दिया था
  rationale: נתן के व्यापक अर्थ ‘देना’ को रखा गया है और दी गई वस्तु को व्यवस्था, देश या आशीष के रूप में विशेष रूप से पहचानने से बचा गया है।
- source_word: יַעַבְרוּם
  choice: वह उनसे चला जाएगा
  rationale: यह रूप व्याकरण और अर्थ की दृष्टि से कठिन है। ‘चला जाएगा’ עבר की गति/गुज़रने की धारणा को बनाए रखते हुए हानि का भाव देता है, किंतु अधिक निश्चित ‘छीन लिया जाएगा’ को मुख्य पाठ में नहीं थोपता।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ में चार-अक्षरीय व्यक्तिगत नाम सीधे आया है; ‘याहवे’ उसके प्रचलित विद्वत्तापूर्ण उच्चारण को दर्शाता है और उसे सामान्य उपाधि में नहीं बदलता।
- issue: न्याय-संबंधी आरंभिक क्रिया की तीव्रता
  choice: समेट लूँगा
  alternative: पूरी तरह मिटा दूँगा
  rationale: न्याय का प्रसंग हटाए जाने या विनाश की ओर संकेत करता है, पर मूल धातु मुख्यतः इकट्ठा करने/हटा लेने की है। इसलिए मुख्य पाठ मूल बिंब को रखता और अधिक व्याख्यात्मक अर्थ को पादटिप्पणी में देता है।
- issue: अंतिम कठिन उपवाक्य की व्याख्या
  choice: जो कुछ मैंने उन्हें दिया था, वह उनसे चला जाएगा
  alternative: जो कुछ मैंने उन्हें दिया था, वह उनसे छीन लिया जाएगा
  rationale: इब्रानी वाक्य अत्यंत संक्षिप्त और विवादित है। चुना हुआ पाठ अर्थगम्य है, पर हटाए जाने की रीति को निश्चित करके वास्तविक अस्पष्टता समाप्त नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गंभीर किंतु सामान्य पाठक के लिए सुबोध रखी गई है। ‘दाखलता’, ‘अंजीर का पेड़’ और ‘पत्ता’ मूल कृषि-बिंब बनाए रखते हैं। कठिन आरंभिक और अंतिम अभिव्यक्तियों को मुख्य पाठ में अत्यधिक स्पष्ट करने के बजाय पादटिप्पणियों में वास्तविक विकल्प दिए गए हैं।
