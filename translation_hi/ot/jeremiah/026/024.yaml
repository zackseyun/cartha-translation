source:
  edition: WLC
  text: אַ֗ךְ יַ֚ד אֲחִיקָ֣ם בֶּן שָׁפָ֔ן הָיְתָ֖ה אֶֽת יִרְמְיָ֑הוּ לְ/בִלְתִּ֛י תֵּת אֹת֥/וֹ בְ/יַד הָ/עָ֖ם לַ/הֲמִיתֽ/וֹ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/024.yaml
  text: But the hand of Ahikam son of Shaphan was with Jeremiah[b][a], so that he was not given into the hand of the people to put him to death.
translation:
  language: hi
  text: परन्तु शापान के पुत्र अहीकाम का हाथ यिर्मयाह के साथ था[a], इसलिए उसे मार डालने के लिए लोगों के हाथ में[b] नहीं सौंपा गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में शाब्दिक रूप से, “अहीकाम का हाथ ... यिर्मयाह के साथ था।” इसका अर्थ है कि अहीकाम ने यिर्मयाह का समर्थन और संरक्षण किया।
    reason: lexical_alternative
  - marker: b
    text: मूल इब्रानी में शाब्दिक रूप से, “लोगों के हाथ में”; यह मुहावरा उनके अधिकार या वश में होने का अर्थ देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: परन्तु
  rationale: यह अव्यय पिछले प्रसंग के विपरीत स्थिति प्रकट करता है; ‘परन्तु’ आधुनिक हिन्दी में इस विरोध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יַד אֲחִיקָם ... הָיְתָה אֶת יִרְמְיָהוּ
  choice: अहीकाम का हाथ यिर्मयाह के साथ था
  rationale: मूल इब्रानी रूपक को बनाए रखा गया है। इसका आशय है कि अहीकाम ने सक्रिय रूप से यिर्मयाह का समर्थन और संरक्षण किया।
- source_word: אֲחִיקָם בֶּן שָׁפָן
  choice: शापान के पुत्र अहीकाम
  rationale: वंशसूचक संबंध को सहज हिन्दी क्रम में रखा गया और व्यक्तिनामों का मानक लिप्यंतरण किया गया है।
- source_word: לְבִלְתִּי תֵּת אֹתוֹ
  choice: उसे ... नहीं सौंपा गया
  rationale: मूल में कर्ता स्पष्ट नहीं है; हिन्दी का कर्मवाच्य अनावश्यक कर्ता जोड़े बिना निषेधात्मक परिणाम को व्यक्त करता है।
- source_word: בְיַד הָעָם
  choice: लोगों के हाथ में
  rationale: ‘हाथ में’ किसी के अधिकार या वश में दिए जाने का इब्रानी मुहावरा है। इसे रखने से अहीकाम के ‘हाथ’ और लोगों के ‘हाथ’ के बीच मूल पाठ का प्रभावशाली विरोध भी बना रहता है।
- source_word: לַהֲמִיתוֹ
  choice: मार डालने के लिए
  rationale: हिफ़ील रूप का अर्थ ‘मृत्यु का कारण बनना’ है। न्यायिक प्रसंग में यह गंभीर आशय स्पष्ट करता है, पर ‘मृत्युदंड देना’ कहकर औपचारिक प्रक्रिया को मूल से अधिक निश्चित नहीं बनाता।
