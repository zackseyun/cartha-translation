base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/011.yaml
  text: Then the priests and the prophets said to the officials and to all the people, saying, “A sentence of death is for this man, because he has prophesied against this city, just as you have heard with your own ears.”
translation:
  language: hi
  text: तब याजकों और भविष्यद्वक्ताओं ने अधिकारियों और सभी लोगों से कहा, “यह मनुष्य मृत्युदंड के योग्य है, क्योंकि इसने इस नगर के विरुद्ध भविष्यवाणी की है, जैसा तुमने अपने कानों से सुना है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁפַּט מָוֶת
  choice: मृत्युदंड के योग्य
  rationale: शाब्दिक अर्थ ‘मृत्यु का न्याय/दंड’ है; इस न्यायिक प्रसंग में यह स्वाभाविक हिन्दी में मृत्यु-दंड की पात्रता या निर्णय व्यक्त करता है।
- source_word: נִבָּא אֶל־הָעִיר הַזֹּאת
  choice: इस नगर के विरुद्ध भविष्यवाणी की है
  rationale: यहाँ אֶל संदर्भतः नगर को संबोधित प्रतिकूल भविष्यवाणी को दर्शाता है; ‘के विरुद्ध’ आरोप की प्रकृति को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כַּאֲשֶׁר שְׁמַעְתֶּם בְּאָזְנֵיכֶם
  choice: जैसा तुमने अपने कानों से सुना है
  rationale: मूल की प्रत्यक्ष-साक्ष्य संबंधी जोरदार अभिव्यक्ति को हिन्दी में सुरक्षित रखता है।
- source_word: הַשָּׂרִים
  choice: अधिकारियों
  rationale: इस प्रसंग में शासकीय/न्यायिक पदाधिकारियों के लिए आधुनिक और व्यापक हिन्दी शब्द।
theological_decisions:
- issue: क्या कथन को पहले से सुनाया गया औपचारिक मृत्युदंड माना जाए या मृत्यु-दंड की मांग/पात्रता?
  choice: यह मनुष्य मृत्युदंड के योग्य है
  alternative: इस मनुष्य के लिए मृत्यु का दंड है
  rationale: מִשְׁפַּט מָוֶת एक संक्षिप्त न्यायिक पदबंध है। ‘योग्य है’ आरोप लगाने वालों का निर्णय व्यक्त करता है, पर यह अनावश्यक रूप से नहीं कहता कि अधिकारियों ने अंतिम औपचारिक फैसला सुना दिया था।
translation_notes:
  register: आधुनिक मानक हिन्दी; न्यायिक प्रसंग के अनुरूप गरिमापूर्ण किंतु सहज भाषा। हिब्रू के לֵאמֹר को अलग से ‘यह कहते हुए’ जोड़ने के बजाय हिन्दी के प्रत्यक्ष कथन में स्वाभाविक रूप से समाहित किया गया है।
