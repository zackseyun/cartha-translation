  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בְּ/רֵאשִׁ֗ית מַמְלְכ֛וּת יְהוֹיָקִ֥ים בֶּן יֹאשִׁיָּ֖הוּ מֶ֣לֶךְ יְהוּדָ֑ה הָיָה֙ הַ/דָּבָ֣ר הַ/זֶּ֔ה מֵ/אֵ֥ת יְהוָ֖ה לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/001.yaml
  text: At the beginning of the reign of Jehoiakim son of Josiah[a], king of Judah, this word came from Yahweh, saying[c][b],
translation:
  language: hi
  text: 'यहूदा के राजा, योशिय्याह के पुत्र यहोयाकीम के शासनकाल के आरम्भ में[a], याहवे[c] की ओर से यह वचन आया[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहोयाकीम के शासन के प्रारम्भिक समय में।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में अक्षरशः, “यह वचन याहवे की ओर से हुआ/था”; “आया” भविष्यद्वाणी की भूमिका के सामान्य भाव को व्यक्त करता है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में परमेश्वर का नाम YHWH है; पारम्परिक रूप से इसका अनुवाद “प्रभु” और कभी-कभी लिप्यन्तरण “यहोवा” किया जाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: בְּרֵאשִׁית מַמְלְכוּת
  choice: शासनकाल के आरम्भ में
  rationale: בְּרֵאשִׁית आरम्भिक समय को और מַמְלְכוּת यहाँ किसी राजा के राज्य करने की अवधि को सूचित करता है। ‘शासनकाल के आरम्भ में’ आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: יְהוֹיָקִים בֶּן־יֹאשִׁיָּהוּ
  choice: योशिय्याह के पुत्र यहोयाकीम
  rationale: वंशसूचक सम्बन्ध को स्वाभाविक हिन्दी क्रम में रखा गया है और नामों का प्रचलित हिन्दी लिप्यन्तरण अपनाया गया है।
- source_word: מֶלֶךְ יְהוּדָה
  choice: यहूदा के राजा
  rationale: यह पदबंध यहोयाकीम की उपाधि और राज्य की पहचान देता है।
- source_word: הָיָה הַדָּבָר הַזֶּה
  choice: यह वचन आया
  rationale: इब्रानी में अक्षरशः ‘यह वचन हुआ/था’ है, पर भविष्यद्वाणी की भूमिका में यह परमेश्वर की ओर से सन्देश प्राप्त होने का रूढ़ प्रयोग है। ‘वचन आया’ हिन्दी में इस सूत्र को स्वाभाविक रूप से व्यक्त करता है।
- source_word: דָּבָר
  choice: वचन
  rationale: यहाँ דָּבָר दैवी कथन या सन्देश है। ‘वचन’ उसके भविष्यद्वाणीय और धर्मवैचारिक भार को बनाए रखता है।
- source_word: מֵאֵת יְהוָה
  choice: याहवे की ओर से
  rationale: מֵאֵת स्रोत या उद्गम बताता है; अतः वचन का स्रोत याहवे है।
- source_word: לֵאמֹר
  choice: ':'
  rationale: לֵאמֹר आगामी प्रत्यक्ष कथन का परिचय देता है। आधुनिक हिन्दी में अगले पद के कथन से पहले द्विबिन्दु इसका स्वाभाविक कार्यात्मक रूप है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में उपाधि नहीं बल्कि चार अक्षरों वाला निजी नाम YHWH है। ‘याहवे’ उसे नाम के रूप में लिप्यन्तरित करता है; पाठक के लिए पारम्परिक विकल्प पादटिप्पणी में दिया गया है।
- issue: הָיָה הַדָּבָר הַזֶּה की भविष्यद्वाणीय अभिव्यक्ति
  choice: यह वचन आया
  alternative: यह वचन हुआ/था
  rationale: ‘आया’ हिन्दी में दैवी प्रकाशन प्राप्त होने की सामान्य अभिव्यक्ति है, जबकि पादटिप्पणी मूल की अधिक अक्षरशः रचना सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। राजकीय पदबंध को स्पष्ट करने के लिए अल्पविराम लगाए गए हैं। अगले पद में आने वाले प्रत्यक्ष कथन के कारण לֵאמֹר को हिन्दी में द्विबिन्दु से व्यक्त किया गया है।
