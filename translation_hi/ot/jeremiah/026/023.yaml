  edition: WLC
  text: וַ/יּוֹצִ֨יאוּ אֶת אוּרִיָּ֜הוּ מִ/מִּצְרַ֗יִם וַ/יְבִאֻ֨/הוּ֙ אֶל הַ/מֶּ֣לֶךְ יְהוֹיָקִ֔ים וַ/יַּכֵּ֖/הוּ בֶּ/חָ֑רֶב וַ/יַּשְׁלֵךְ֙ אֶת נִבְלָת֔/וֹ אֶל קִבְרֵ֖י בְּנֵ֥י הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/023.yaml
  text: They brought Uriah out of Egypt and brought him to King Jehoiakim[a], and he struck him down with the sword and threw his corpse into the burial places of the common people.
translation:
  language: hi
  text: वे ऊरिय्याह को मिस्र से निकालकर राजा यहोयाकीम के सामने लाए; और उसने उसे तलवार से मार डाला और उसके शव को साधारण लोगों की कब्रों[a] में फेंक दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “लोगों की कब्रों।” इब्रानी पदबंध अधिक शाब्दिक रूप से साधारण लोगों से संबंधित दफ़नाने के स्थानों का उल्लेख कर सकता है, किसी सम्मानित दफ़न के विपरीत।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִיאוּ
  choice: निकालकर
  rationale: יצא के हिफ़ील रूप का कारणवाचक अर्थ ‘बाहर निकालना/ले आना’ है। मिस्र से किसी को बाहर लाने के लिए ‘मिस्र से निकालकर’ स्वाभाविक और स्रोत-संगत है।
- source_word: מִמִּצְרַיִם
  choice: मिस्र से
  rationale: स्थानवाचक מן का सीधा और स्वाभाविक हिन्दी रूप ‘से’ है।
- source_word: וַיְבִאֻהוּ
  choice: उसे ... के पास लाए
  rationale: בוא के हिफ़ील रूप और कर्म-प्रत्यय का अर्थ ‘उसे लाए’ है; राजा के समक्ष लाए जाने को हिन्दी में ‘राजा ... के पास लाए’ सहज रूप से व्यक्त करता है।
- source_word: הַמֶּלֶךְ יְהוֹיָקִים
  choice: राजा यहोयाकीम
  rationale: हिन्दी में राजकीय उपाधि नाम से पहले रखना स्वाभाविक है और इब्रानी पदबंध का संदर्भ सुरक्षित रहता है।
- source_word: וַיַּכֵּהוּ בֶּחָרֶב
  choice: उसे तलवार से मार डाला
  rationale: נכה का मूल अर्थ ‘मारना/प्रहार करना’ व्यापक है, पर ‘तलवार से’ और अगले वाक्यांश में शव का उल्लेख मृत्यु को स्पष्ट करते हैं। ‘मार डाला’ परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: נִבְלָתוֹ
  choice: उसके शव
  rationale: נְבֵלָה मृत देह को दर्शाता है। मनुष्य के लिए ‘शव’ वर्तमान, संक्षिप्त और गरिमापूर्ण हिन्दी है, जबकि घटना का अपमानजनक पक्ष संदर्भ से बना रहता है।
- source_word: קִבְרֵי
  choice: कब्रों
  rationale: קבר के बहुवचन रचनात्मक रूप का सीधा अर्थ ‘कब्रें/दफ़नाने के स्थान’ है। ‘कब्रों’ सामान्य आधुनिक हिन्दी में स्पष्ट है।
- source_word: בְּנֵי הָעָם
  choice: साधारण लोगों
  rationale: शाब्दिक ‘लोगों के पुत्र’ यहाँ सामाजिक वर्ग का मुहावरा है। ‘साधारण लोग’ सम्मानित या राजकीय दफ़न के विपरीत सामान्य जन का संकेत देता है, यद्यपि ‘लोगों’ का व्यापक अर्थ भी संभव है।
theological_decisions:
- issue: बहुवचन कर्ताओं से एकवचन कर्ता की ओर परिवर्तन
  choice: पकड़कर लाने वालों के लिए बहुवचन ‘वे ... लाए’ और वध तथा शव फेंकने के लिए एकवचन ‘उसने ... मार डाला और ... फेंक दिया’ रखा गया है।
  alternative: सभी क्रियाओं को उन्हीं बहुवचन कर्ताओं से जोड़ना, या एकवचन को सामूहिक अर्थ में समझना।
  rationale: इब्रानी में וַיּוֹצִיאוּ/וַיְבִאֻהוּ बहुवचन हैं, फिर וַיַּכֵּהוּ/וַיַּשְׁלֵךְ एकवचन हो जाते हैं। निकटतम एकवचन पूर्वपद राजा यहोयाकीम है; इसलिए कर्ता-परिवर्तन को समतल किए बिना रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज किंतु गरिमापूर्ण है। ‘ऊरिय्याह’ और ‘यहोयाकीम’ प्रचलित हिन्दी बाइबलीय नाम-रूप हैं। अर्धविराम बहुवचन से एकवचन कर्ता की कथा-संबंधी दिशा स्पष्ट करता है, पर स्रोत के कर्ता-परिवर्तन को मिटाता नहीं।
