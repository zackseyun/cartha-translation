review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the repeated-sending idiom and preserves it with a footnote. However, it turns the opening infinitive לִשְׁמֹעַ, which continues the conditional syntax of the preceding verse, into an independent imperative ('ध्यान दो') and adds an unwarranted initial 'और'. The final 'तुमने ध्यान नहीं दिया' is somewhat interpretive; 'नहीं सुना' more directly preserves the repetition and semantic breadth of שׁמע.
  naturalness: The wording is generally understandable, but 'मेरे सेवकों, नबियों' is awkward Hindi apposition. 'मेरे सेवक नबियों' is natural and clear. Retaining the dependent 'कि तुम ... सुनो' properly signals that this verse continues the preceding conditional sentence.
  terminology: '''सेवक नबी'' appropriately renders עֲבָדַי הַנְּבִאִים. ''वचन'' gives a suitably dignified scriptural register for דִּבְרֵי, while ''सुनो/नहीं सुना'' retains the source''s deliberate verbal repetition without prematurely narrowing it to obedience.'
  issues:
  - severity: high
    issue: The opening is rendered as an independent imperative with an added conjunction.
    rationale: לִשְׁמֹעַ is an infinitive construct dependent on the preceding verse's conditional clause, not an imperative. 'और ... ध्यान दो' changes the syntax and discourse relation. It should be rendered as a dependent clause, e.g. 'कि तुम ... सुनो'.
  - severity: medium
    issue: The apposition 'मेरे सेवकों, नबियों' is unnatural and potentially ambiguous.
    rationale: The Hebrew expression is the established title 'my servants the prophets.' Hindi 'मेरे सेवक नबियों' expresses this relationship naturally without punctuation that can suggest two separate groups.
  - severity: low
    issue: '''ध्यान दो/ध्यान नहीं दिया'' slightly narrows the repeated sense of שׁמע.'
    rationale: Although defensible, it introduces an interpretive emphasis. 'सुनो/नहीं सुना' more directly mirrors the Hebrew wording and leaves the hear/heed nuance open.
  revised_text: कि तुम मेरे सेवक नबियों के वचनों को सुनो, जिन्हें मैं तुम्हारे पास बार-बार भेजता रहा हूँ[a], पर तुमने नहीं सुना।
