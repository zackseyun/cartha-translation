source:
  edition: WLC
  text: לִ/שְׁמֹ֗עַ עַל דִּבְרֵ֨י עֲבָדַ֣/י הַ/נְּבִאִ֔ים אֲשֶׁ֥ר אָנֹכִ֖י שֹׁלֵ֣חַ אֲלֵי/כֶ֑ם וְ/הַשְׁכֵּ֥ם וְ/שָׁלֹ֖חַ וְ/לֹ֥א שְׁמַעְתֶּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/005.yaml
  text: to listen to the words of my servants the prophets[a], whom I am sending to you, rising early and sending, though you have not listened,
translation:
  language: hi
  text: कि तुम मेरे सेवक नबियों के वचनों को सुनो, जिन्हें मैं तुम्हारे पास बार-बार भेजता रहा हूँ[a], पर तुमने नहीं सुना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “जल्दी उठकर और भेजते हुए”; यह हिब्रू मुहावरा लगातार और बार-बार भेजने की कार्रवाई को व्यक्त करता है।
    reason: मुख्य पाठ में हिब्रू मुहावरे का स्वाभाविक अर्थ दिया गया है; पादटिप्पणी उसकी शाब्दिक छवि सुरक्षित रखती है।
lexical_decisions:
- source_word: לִשְׁמֹעַ עַל דִּבְרֵי
  choice: बातों पर ध्यान दो
  rationale: שׁמע के साथ עַל यहाँ कही हुई बातों को सुनने और उन पर ध्यान देने का भाव रखता है। ‘ध्यान दो’ आज की स्वाभाविक हिन्दी में केवल ध्वनि सुनने से आगे, संदेश को ग्रहण करने का भाव रखता है, पर सीधे ‘आज्ञा मानो’ कहकर अर्थ को अत्यधिक निश्चित नहीं करता।
- source_word: עֲבָדַי הַנְּבִאִים
  choice: मेरे सेवकों, नबियों
  rationale: עֲבָדַי का ‘सेवकों’ संदर्भानुकूल है, क्योंकि यह परमेश्वर द्वारा नियुक्त नबियों की भूमिका बताता है; ‘दासों’ से सामाजिक बंधन का अनावश्यक प्रमुख भाव आ सकता है। हिब्रू में ‘नबी’ सेवकों की पहचान बताता है, जिसे अल्पविराम से बनाए रखा गया है।
- source_word: אֲשֶׁר אָנֹכִי שֹׁלֵחַ אֲלֵיכֶם
  choice: जिन्हें मैं तुम्हारे पास ... भेजता रहा हूँ
  rationale: שֹׁלֵחַ का कृदन्त और आगे का पुनरावृत्तिपरक मुहावरा मिलकर लगातार अतीत से होती आई कार्रवाई दिखाते हैं। ‘भेजता रहा हूँ’ हिन्दी में उस जारी और बारंबार पहल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְהַשְׁכֵּם וְשָׁלֹחַ
  choice: बार-बार
  rationale: शाब्दिक रूप ‘जल्दी उठकर भेजना’ है, पर यह हिब्रू मुहावरा तत्पर और लगातार दोहराई गई कार्रवाई को व्यक्त करता है। मुख्य पाठ में ‘बार-बार’ उसका संप्रेषणीय अर्थ देता है और शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: וְלֹא שְׁמַעְתֶּם
  choice: फिर भी तुमने ध्यान नहीं दिया
  rationale: वाव यहाँ पूर्ववर्ती निरंतर भेजे जाने के विपरीत परिणाम को प्रस्तुत करता है। ‘फिर भी’ विरोध को स्पष्ट करता है; ‘ध्यान नहीं दिया’ आरम्भिक שׁמע के साथ शब्दगत संबंध बनाए रखता है।
theological_decisions:
- issue: וְהַשְׁכֵּם וְשָׁלֹחַ में परमेश्वर की कार्रवाई का मानवरूपी मुहावरा
  choice: बार-बार भेजता रहा हूँ
  alternative: जल्दी उठकर भेजता रहा हूँ
  rationale: मुहावरे का मुख्य आशय दिन के समय का शाब्दिक विवरण नहीं, बल्कि परमेश्वर की तत्पर, धैर्यपूर्ण और पुनरावृत्त पहल है। अर्थ को मुख्य पाठ में स्वाभाविक हिन्दी में दिया गया है और शाब्दिक छवि पादटिप्पणी में रखी गई है।
- issue: עֲבָדַי का पदनाम
  choice: मेरे सेवकों
  alternative: मेरे दासों
  rationale: यहाँ शब्द नबियों को परमेश्वर के नियुक्त प्रतिनिधियों के रूप में प्रस्तुत करता है। ‘सेवकों’ से वही संबंध व्यक्त होता है और बंधुआ स्थिति को अनावश्यक रूप से प्रमुख नहीं बनाया जाता।
- issue: שׁמע में सुनने और मानने के बीच अर्थ-तनाव
  choice: ध्यान दो / ध्यान नहीं दिया
  alternative: सुनो / नहीं सुना; आज्ञा मानो / आज्ञा नहीं मानी
  rationale: हिब्रू क्रिया में सुनने के साथ ग्रहण करने या मानने का भाव हो सकता है। ‘ध्यान देना’ इस व्यापकता को रखता है, जबकि ‘आज्ञा मानना’ अर्थ को अधिक निश्चित कर देता और केवल ‘सुनना’ नैतिक प्रत्युत्तर को कम व्यक्त कर सकता था।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और श्रव्य रूप। वाक्य पिछले पद की शर्त का आगे का अंश है, इसलिए आरम्भ में ‘और’ रखा गया है। ‘बातों’ सामान्य पाठक के लिए स्वाभाविक है; ‘वचनों’ की अपेक्षा कम धार्मिक-तकनीकी। मुख्य पाठ में मुहावरे का अर्थ दिया गया है और [a] से उसका शाब्दिक रूप दर्ज है।
