source:
  edition: WLC
  text: וַ/יִּשְׁמַ֣ע הַ/מֶּֽלֶךְ יְ֠הוֹיָקִים וְ/כָל גִּבּוֹרָ֤י/ו וְ/כָל הַ/שָּׂרִים֙ אֶת דְּבָרָ֔י/ו וַ/יְבַקֵּ֥שׁ הַ/מֶּ֖לֶךְ הֲמִית֑/וֹ וַ/יִּשְׁמַ֤ע אוּרִיָּ֨הוּ֙ וַ/יִּרָ֔א וַ/יִּבְרַ֖ח וַ/יָּבֹ֥א מִצְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/021.yaml
  text: When King Jehoiakim[a], and all his mighty men, and all the officials heard his words, the king sought to put him to death. But when Uriah heard[b], he was afraid and fled and went to Egypt.
translation:
  language: hi
  text: जब राजा यहोयाकीम, उसके सभी योद्धाओं[a] और सभी अधिकारियों ने ऊरिय्याह की बातें सुनीं, तो राजा ने उसे मार डालने का प्रयत्न किया। पर जब ऊरिय्याह ने यह सुना, तो वह डर गया और भागकर मिस्र चला गया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “उसके सभी वीर पुरुषों”'
    reason: גִּבּוֹרָיו का अधिक शब्दानुरूप विकल्प देता है; मुख्य पाठ में आधुनिक और स्पष्ट सैन्य अर्थ ‘योद्धाओं’ रखा गया है।
  - marker: b
    text: शब्दशः, “मिस्र आया।” यहाँ गंतव्य की ओर जाने के अर्थ में “मिस्र चला गया” किया गया है।
    reason: इब्रानी गति-क्रिया के शब्दानुरूप रूप और स्वाभाविक हिन्दी कथन के अंतर को दर्ज करता है।
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: सुनीं / यह सुना
  rationale: दोनों स्थानों पर שׁמע का सामान्य कथात्मक अर्थ ‘सुनना’ है। दूसरी बार ‘यह’ से प्रसंगतः राजा के घातक इरादे का समाचार सूचित होता है, बिना उसे अनावश्यक रूप से विस्तार दिए।
- source_word: גִּבּוֹרָיו
  choice: उसके सभी योद्धाओं
  rationale: גִּבּוֹרָיו यहाँ राजा से जुड़े वीर या युद्ध-कुशल पुरुषों को सूचित करता है। ‘योद्धा’ आधुनिक हिन्दी में स्पष्ट है और शब्द का सैन्य भाव बनाए रखता है।
- source_word: הַשָּׂרִים
  choice: सभी अधिकारियों
  rationale: राजदरबार के प्रसंग में שׂרים शासकीय या दरबारी पदाधिकारियों को सूचित करता है; ‘अधिकारी’ वंशानुगत राजकुमार होने का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: דְּבָרָיו
  choice: ऊरिय्याह की बातें
  rationale: मूल में सर्वनाम ‘उसकी’ है, जिसका संदर्भ ऊरिय्याह है। हिन्दी में आरंभिक कर्ताओं की बहुलता के कारण नाम दोहराना संदर्भ स्पष्ट करता है और अर्थ नहीं बदलता।
- source_word: וַיְבַקֵּשׁ הַמֶּלֶךְ הֲמִיתוֹ
  choice: राजा ने उसे मार डालने का प्रयत्न किया
  rationale: בקשׁ के साथ हिफ़ील infinitive lethal intent और प्रयास व्यक्त करता है। यह हिन्दी वाक्य मूल की गंभीरता और सक्रिय मंशा दोनों बनाए रखता है।
- source_word: וַיִּרָא
  choice: वह डर गया
  rationale: कथात्मक क्रम में यह स्वाभाविक आधुनिक हिन्दी है और ऊरिय्याह की भय-प्रतिक्रिया स्पष्ट करता है।
- source_word: וַיִּבְרַח
  choice: भागकर
  rationale: ברח की तात्कालिक पलायन-क्रिया को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וַיָּבֹא מִצְרָיִם
  choice: मिस्र चला गया
  rationale: क्रिया का मूल रूप ‘आया/पहुँचा’ है, पर वर्णित व्यक्ति की गति और गंतव्य के अनुसार आधुनिक हिन्दी में ‘मिस्र चला गया’ स्वाभाविक है।
- source_word: וַ
  choice: पर जब
  rationale: ऊरिय्याह की प्रतिक्रिया को राजा के हत्या-प्रयत्न के विपरीत अगली घटना के रूप में जोड़ता है; यह प्रसंग में निहित विरोध को स्वाभाविक हिन्दी में व्यक्त करता है।
