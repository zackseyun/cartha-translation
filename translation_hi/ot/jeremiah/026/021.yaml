  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज कथात्मक शैली रखी गई है। नामों के लिए प्रचलित बाइबलीय रूप ‘यहोयाकीम’ और ‘ऊरिय्याह’ अपनाए गए हैं। सर्वनाम-संदेह से बचने के लिए पहले वाक्य में ‘ऊरिय्याह’ स्पष्ट किया गया है; दूसरे वाक्य में ‘यह’ मूल के अनकहे समाचार-संदर्भ को खुला रखता है।
