translation_notes:
  register: आधुनिक, गरिमापूर्ण और सार्वजनिक न्यायिक सभा के प्रसंग के अनुरूप हिंदी। ‘पुरनिये’ बाइबलीय प्रशासनिक-सामुदायिक पद का परिचित रूप है; मुख्य पाठ में हिब्रू की संरचना को सहज हिंदी में ढाला गया है, और अधिक शाब्दिक रूप पादटिप्पणी में रखा गया है।
