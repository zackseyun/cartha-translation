  yaml_path: translation/ot/jeremiah/026/017.yaml
  text: Then some of the elders of the land stood up and said to all the assembly of the people[a], saying,
translation:
  language: hi
  text: तब देश के पुरनियों में से कुछ पुरुष उठे और लोगों की सारी सभा से बोले:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “तब देश के पुरनियों में से कुछ पुरुष उठे और लोगों की सारी सभा से बोले, यह कहते हुए—”'
    reason: लֵאמֹר की अधिक स्पष्ट, शाब्दिक अभिव्यक्ति दिखाने के लिए; मुख्य पाठ में इसका कार्य अगले पद के प्रत्यक्ष वचन से पहले द्विबिंदु द्वारा व्यक्त है।
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: उठे
  rationale: קום का कथात्मक रूप यहाँ बोलने या सार्वजनिक कार्रवाई के लिए उठ खड़े होने को दर्शाता है; हिंदी में ‘उठे’ स्वाभाविक और पर्याप्त स्पष्ट है।
- source_word: אֲנָשִׁים
  choice: कुछ पुरुष
  rationale: אֲנָשִׁים वयस्क पुरुषों को सूचित करता है। ‘कुछ’ מן-विन्यास के आंशिक अर्थ को सहज हिंदी में व्यक्त करता है, जबकि ‘पुरुष’ स्रोत में उपस्थित लिंग-सूचना बनाए रखता है।
- source_word: מִזִּקְנֵי הָאָרֶץ
  choice: देश के पुरनियों में से
  rationale: מן बताता है कि ये पुरुष देश के पुरनियों के समूह में से थे। ‘देश’ यहाँ הָאָרֶץ का स्वाभाविक संदर्भगत अनुवाद है और ‘पुरनिये’ सार्वजनिक नेतृत्व करने वाले बुज़ुर्गों का अर्थ देता है।
- source_word: וַיֹּאמְרוּ
  choice: कहने लगे
  rationale: אמר के लिए ‘कहना’ मानक है। अगले पद में भाषण जारी होने के कारण ‘कहने लगे’ हिंदी में स्वाभाविक रूप से भाषण का आरंभ दर्शाता है।
- source_word: אֶל כָּל קְהַל הָעָם
  choice: लोगों की सारी सभा से
  rationale: קהל औपचारिक रूप से एकत्र समुदाय या सभा को दर्शाता है; ‘सारी’ כָּל को व्यक्त करता है। हिंदी में किसी सभा को संबोधित करने के लिए ‘सभा से कहना’ सहज है।
- source_word: לֵאמֹר
  choice: कहने लगे
  rationale: לֵאמֹר अगले पद में आने वाले कथन का परिचय देता है। अलग से ‘यह कहते हुए’ जोड़ने के बजाय संयुक्त हिंदी अभिव्यक्ति ‘कहने लगे’ उसके वाक्यगत कार्य को स्वाभाविक ढंग से निभाती है।
