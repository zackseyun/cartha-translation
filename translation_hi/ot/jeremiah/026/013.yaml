  text: וְ/עַתָּ֗ה הֵיטִ֤יבוּ דַרְכֵי/כֶם֙ וּ/מַ֣עַלְלֵי/כֶ֔ם וְ/שִׁמְע֕וּ בְּ/ק֖וֹל יְהוָ֣ה אֱלֹהֵי/כֶ֑ם וְ/יִנָּחֵ֣ם יְהוָ֔ה אֶל הָ֣/רָעָ֔ה אֲשֶׁ֥ר דִּבֶּ֖ר עֲלֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/013.yaml
  text: So now[a], make your ways and your deeds good, and listen to the voice of Yahweh your God[c][b], and Yahweh will relent concerning the disaster that he has spoken against you.
translation:
  language: hi
  text: अब तुम अपने चालचलन और अपने कामों को सुधारो[a], और अपने परमेश्वर यहोवा की वाणी सुनो[b]; तब यहोवा उस विपत्ति के विषय में अपना इरादा बदल देगा[c], जिसकी उसने तुम्हारे विरुद्ध घोषणा की है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने चालचलन और अपने कामों को अच्छा बनाओ।” इब्रानी में शाब्दिक अर्थ यही है।
    reason: lexical_alternative
  - marker: b
    text: या, “अपने परमेश्वर यहोवा की आज्ञा मानो।” इब्रानी में “वाणी सुनना” प्रायः आज्ञापालन का भाव भी रखता है।
    reason: lexical_alternative
  - marker: c
    text: या, “यहोवा उस विपत्ति को लाने से रुक जाएगा,” अथवा अधिक शाब्दिक रूप से, “यहोवा उस विपत्ति के विषय में पछताएगा।” यहाँ इसका अर्थ किसी नैतिक भूल पर पश्चात्ताप करना नहीं, बल्कि घोषित विपत्ति को न लाने के लिए अपना रुख बदलना है।
    reason: theological_clarification
lexical_decisions:
- source_word: וְעַתָּה
  choice: इसलिए अब
  rationale: यह पद पिछले कथन से निष्कर्ष निकालते हुए तत्काल आग्रह करता है; ‘इसलिए अब’ दोनों भावों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הֵיטִיבוּ דַרְכֵיכֶם וּמַעַלְלֵיכֶם
  choice: अपने चालचलन और अपने कामों को सुधारो
  rationale: हिफ़ील आज्ञार्थक का आशय इन्हें अच्छा बनाना है। ‘सुधारो’ आधुनिक हिन्दी में सहज है, जबकि ‘चालचलन और काम’ नैतिक जीवन और ठोस कर्म—दोनों को बनाए रखता है।
- source_word: וְשִׁמְעוּ בְּקוֹל
  choice: वाणी सुनो
  rationale: मूल इब्रानी मुहावरे की श्रवण-संबंधी छवि को रखा गया है; प्रसंग में आज्ञापालन का भाव निहित है और पादटिप्पणी में स्पष्ट किया गया है।
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: अपने परमेश्वर यहोवा
  rationale: व्यक्तिगत दिव्य नाम को ‘यहोवा’ और संबंधसूचक पद को स्वाभाविक हिन्दी क्रम में प्रस्तुत किया गया है।
- source_word: וְיִנָּחֵם
  choice: पछताएगा
  rationale: נחם का निफ़अल यहाँ घोषित दण्ड से फिरने/उसे न लाने का भाव रखता है। ‘पछताएगा’ मूल की मानवीय भावभाषा और धर्मवैचारिक तनाव को छिपाता नहीं; संभावित गलत अर्थ से बचाने के लिए पादटिप्पणी दी गई है।
- source_word: אֶל הָרָעָה
  choice: उस विपत्ति के विषय में
  rationale: न्याय के इस प्रसंग में רָעָה नैतिक बुराई नहीं, आने वाली विपत्ति है; אֶל को נחם के साथ ‘के विषय में’ कहना निकट और स्पष्ट है।
- source_word: דִּבֶּר עֲלֵיכֶם
  choice: जिसे उसने तुम्हारे विरुद्ध कह सुनाया है
  rationale: यह लोगों के विरुद्ध घोषित न्यायवचन को दर्शाता है। ‘कह सुनाया’ औपचारिक घोषणा का भाव देता है और ‘विरुद्ध’ עַל की दिशा बनाए रखता है।
theological_decisions:
- issue: परमेश्वर का घोषित विपत्ति के विषय में पछताना
  choice: यहोवा ... पछताएगा
  alternative: यहोवा ... विपत्ति को टाल देगा / अपना मन बदल देगा
  rationale: मूल क्रिया की मानवीय भावभाषा को बनाए रखने से यह तनाव सुरक्षित रहता है कि परमेश्वर न्याय की घोषणा करता है और लोगों के लौटने पर उस विपत्ति को लाने से फिर सकता है। इसे न तो परमेश्वर की नैतिक भूल बताया गया है, न किसी सिद्धान्त के कारण मूल अभिव्यक्ति को सपाट बनाया गया है।
- issue: שמע בקול में सुनना और आज्ञापालन
  choice: वाणी सुनो
  alternative: आज्ञा मानो
  rationale: शाब्दिक श्रवण-छवि को मुख्य पाठ में रखा गया है, पर पादटिप्पणी बताती है कि इब्रानी मुहावरा आज्ञापालन को भी समेटता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। ‘चालचलन’, ‘वाणी’ और ‘विपत्ति’ बाइबलीय गरिमा रखते हुए आज भी बोधगम्य हैं। वाक्य में आग्रह, आज्ञापालन और सशर्त न्याय-निवृत्ति का क्रम सुरक्षित रखा गया है।
