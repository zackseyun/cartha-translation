base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/022.yaml
  text: 'Then King Jehoiakim sent men to Egypt: Elnathan son of Achbor[a], and men with him, to Egypt.'
translation:
  language: hi
  text: तब राजा यहोयाकीम ने पुरुषों को मिस्र भेजा—अकबोर के पुत्र एलनातान को और उसके साथ के पुरुषों को मिस्र भेजा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ के अंत में एलनातान और उसके साथ के पुरुषों के गंतव्य के रूप में “मिस्र” फिर से आया है; अनुवाद में यह पुनरुक्ति रखी गई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: तब ... भेजा
  rationale: क्रिया שׁלח का सामान्य अर्थ ‘भेजना’ है; आरंभिक וַ narrative क्रम को ‘तब’ से स्वाभाविक रूप में व्यक्त किया गया है।
- source_word: הַמֶּלֶךְ יְהוֹיָקִים
  choice: राजा यहोयाकीम
  rationale: उपाधि और नाम का यह क्रम आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: אֲנָשִׁים
  choice: कुछ पुरुषों
  rationale: यहाँ אֲנָשִׁים राजकीय काम पर भेजे गए पुरुष प्रतिनिधियों को सूचित करता है; हिन्दी वाक्य के प्रवाह के लिए अनिर्दिष्ट बहुवचन को ‘कुछ’ से व्यक्त किया गया है।
- source_word: מִצְרַיִם
  choice: मिस्र
  rationale: इस स्थान-नाम का मानक हिन्दी रूप ‘मिस्र’ है।
- source_word: אֵת
  choice: अर्थात्
  rationale: प्रत्यक्ष कर्म-चिह्न के बाद भेजे गए व्यक्तियों का विशेष उल्लेख आता है; ‘अर्थात्’ उस विनिर्देशन को स्पष्ट करता है, यद्यपि मूल में इसके लिए अलग शब्द नहीं है।
- source_word: אֶלְנָתָן בֶּן עַכְבּוֹר
  choice: अकबोर के पुत्र एलनातान
  rationale: पितृनाम-संबंध को हिन्दी के स्वाभाविक क्रम में रखा गया है और व्यक्तिनामों का निकट लिप्यंतरण किया गया है।
- source_word: וַאֲנָשִׁים אִתּוֹ
  choice: और उसके साथ कुछ पुरुषों को
  rationale: मूल का सीधा अर्थ ‘और उसके साथ पुरुष’ है; ‘अन्य’ नहीं जोड़ा गया क्योंकि वह निहित हो सकता है, पर स्पष्ट रूप से लिखा नहीं है।
- source_word: אֶל מִצְרָיִם
  choice: मिस्र भेजा
  rationale: अंत में आए गंतव्य को दोहराकर इब्रानी की पुनरुक्ति सुरक्षित रखी गई है; हिन्दी में क्रिया दोहराने से वाक्य अधिक स्पष्ट बनता है।
