base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/003.yaml
  text: Perhaps they will listen[a], and each man will turn from his evil way[c][b], and I will relent concerning the disaster that I am planning to bring on them because of the evil of their deeds.
translation:
  language: hi
  text: शायद वे सुनें[a], और हर एक अपने बुरे मार्ग से मुड़ जाए[b]; तब मैं उस विपत्ति के विषय में अपना मन बदलूँगा[c], जिसे मैं उनके बुरे कामों के कारण उन पर लाने की योजना बना रहा हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ध्यान देकर मानें”; इब्रानी क्रिया का अर्थ सुनना और ध्यान देकर मानना, दोनों हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “लौट आए”; इसका अर्थ अपने बुरे मार्ग से मन फिराना भी है।
    reason: lexical_alternative
  - marker: c
    text: या “उस विपत्ति को लाने से रुक जाऊँगा।” इब्रानी अभिव्यक्ति घोषित न्याय को रोकने के लिए मानवीय भाषा में परमेश्वर के ‘मन बदलने’ का वर्णन करती है।
    reason: lexical_and_theological_alternative
lexical_decisions:
- source_word: אוּלַי
  choice: शायद
  rationale: यह संभावना और आशा का स्वाभाविक भाव व्यक्त करता है और इब्रानी अव्यय के सीधे अर्थ को बनाए रखता है।
- source_word: יִשְׁמְעוּ
  choice: वे सुनें
  rationale: שׁמע में सुनने और बात मानने, दोनों का भाव हो सकता है। मुख्य पाठ में संक्षिप्त और स्वाभाविक ‘सुनें’ रखा गया है तथा दूसरा भाव पादटिप्पणी में दिया गया है।
- source_word: וְיָשֻׁבוּ
  choice: फिर जाए
  rationale: שׁוב का मूल रूपक मुड़ने या लौटने का है। ‘अपने बुरे मार्ग से फिर जाए’ आधुनिक हिन्दी में नैतिक दिशा बदलने का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: אִישׁ
  choice: हर एक
  rationale: यह אִישׁ के वितरणात्मक एकवचन को स्वाभाविक और समावेशी आधुनिक हिन्दी में व्यक्त करता है।
- source_word: מִדַּרְכּוֹ הָרָעָה
  choice: अपने बुरे मार्ग से
  rationale: ‘मार्ग’ जीवन-चाल के भविष्यद्वाणी-साहित्य के रूपक को बनाए रखता है, जबकि ‘बुरे’ नैतिक अर्थ को स्पष्ट करता है।
- source_word: וְנִחַמְתִּי
  choice: मैं ... अपना मन बदलूँगा
  rationale: निफ़ाल נחם यहाँ घोषित न्याय को रोकने या उससे फिरने का मानवीय भाषा में वर्णन करता है। यह हिन्दी में स्पष्ट है, जबकि वास्तविक सशर्तता और धर्मवैज्ञानिक तनाव को बनाए रखता है।
- source_word: אֶל הָרָעָה
  choice: उस विपत्ति के विषय में
  rationale: यहाँ רעה नैतिक बुराई नहीं, आने वाली विपत्ति है; אֶל को נחם के साथ ‘के विषय में’ के रूप में स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: חֹשֵׁב לַעֲשׂוֹת לָהֶם
  choice: जिसे मैं ... उन पर लाने की योजना बना रहा हूँ
  rationale: חשב + धातुरूप योजना या अभिप्राय दर्शाता है। ‘विपत्ति उन पर लाना’ हिन्दी में प्रसंगानुकूल मुहावरेदार अभिव्यक्ति है।
- source_word: מִפְּנֵי רֹעַ מַעַלְלֵיהֶם
  choice: उनके बुरे कामों के कारण
  rationale: यह कारणात्मक संबंध और מעללים के कर्मों/आचरण के अर्थ को साधारण आधुनिक हिन्दी में स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के लिए נחם का अनुवाद
  choice: मैं उस विपत्ति के विषय में अपना मन बदलूँगा
  alternative: मैं उस विपत्ति को लाने से रुक जाऊँगा / मैं उस विपत्ति के विषय में पछताऊँगा
  rationale: मूल पाठ मनुष्यों के फिरने के उत्तर में घोषित न्याय के संबंध में परमेश्वर के बदलने/रुकने की वास्तविक सशर्त भाषा का प्रयोग करता है। ‘अपना मन बदलूँगा’ उस तनाव को छिपाता नहीं; पादटिप्पणी स्पष्ट करती है कि अर्थ घोषित विपत्ति को रोकने का भी हो सकता है, बिना यह मान लेने के कि परमेश्वर ने कोई नैतिक भूल की थी।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण भविष्यद्वाणी-साहित्य की शैली। ‘हर एक’ वितरणात्मक अर्थ को स्वाभाविक रूप से रखता है; ‘मार्ग’ मूल रूपक को बनाए रखता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
