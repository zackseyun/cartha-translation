source:
  edition: WLC
  text: מיכיה הַ/מּ֣וֹרַשְׁתִּ֔י הָיָ֣ה נִבָּ֔א בִּ/ימֵ֖י חִזְקִיָּ֣הוּ מֶֽלֶךְ יְהוּדָ֑ה וַ/יֹּ֣אמֶר אֶל כָּל עַם֩ יְהוּדָ֨ה לֵ/אמֹ֜ר כֹּֽה אָמַ֣ר יְהוָ֣ה צְבָא֗וֹת צִיּ֞וֹן שָׂדֶ֤ה תֵֽחָרֵשׁ֙ וִ/ירוּשָׁלַ֨יִם֙ עִיִּ֣ים תִּֽהְיֶ֔ה וְ/הַ֥ר הַ/בַּ֖יִת לְ/בָמ֥וֹת יָֽעַר־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/018.yaml
  text: 'Micah the Morashtite was prophesying in the days of Hezekiah king of Judah[a], and he said to all the people of Judah, saying, “Thus says Yahweh of Armies: Zion will be plowed as a field, and Jerusalem will become ruins[c][b], and the mountain of the house will become wooded heights.”'
translation:
  language: hi
  text: 'मोरेशेतवासी मीका यहूदा के राजा हिजकिय्याह के दिनों में भविष्यवाणी करता था। उसने यहूदा के सब लोगों से कहा, “सेनाओं का याहवे यह कहता है: सिय्योन खेत के समान जोता जाएगा, यरूशलेम खंडहरों के ढेर हो जाएगा, और मंदिर का पर्वत जंगल से ढकी ऊँचाइयाँ हो जाएगा।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מיכיה הַמּוֹרַשְׁתִּי
  choice: मोरेशेतवासी मीका
  rationale: व्यक्ति के प्रचलित नाम ‘मीका’ और मोरेशेत से उसके संबंध को सूचित करने वाले जातिवाचक रूप—दोनों को संक्षिप्त, स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: הָיָה נִבָּא
  choice: भविष्यवाणी करता था
  rationale: היה के साथ कृदन्त का प्रयोग अतीत में चलती या बार-बार होने वाली क्रिया का भाव देता है; हिन्दी का अपूर्ण भूतकाल इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: בִּימֵי חִזְקִיָּהוּ מֶלֶךְ יְהוּדָה
  choice: यहूदा के राजा हिजकिय्याह के दिनों में
  rationale: हिब्रू काल-सूचक मुहावरे और राजकीय उपाधि का निकट तथा सुबोध अनुवाद।
- source_word: כֹּה אָמַר יְהוָה צְבָאוֹת
  choice: सेनाओं का याहवे यों कहता है
  rationale: याहवे नाम को नाम के रूप में रखता है और צְבָאוֹת के बहुवचन तथा सैन्य अर्थ को आधुनिक पाठक के लिए स्पष्ट करता है।
- source_word: צִיּוֹן שָׂדֶה תֵחָרֵשׁ
  choice: सिय्योन खेत के समान जोता जाएगा
  rationale: विनाश के बाद पवित्र नगर-स्थल के कृषि-भूमि बन जाने की तीखी उपमा को सुरक्षित रखता है।
- source_word: עִיִּים
  choice: खंडहरों का ढेर
  rationale: बहुवचन संज्ञा में निहित उजड़े हुए मलबे या खंडहरों के ढेर का ठोस चित्र केवल ‘खंडहर’ की अपेक्षा अधिक स्पष्टता से देता है।
- source_word: וְהַר הַבַּיִת
  choice: भवन का पर्वत
  rationale: शाब्दिक अभिव्यक्ति को मुख्य पाठ में बनाए रखता है; संदर्भगत अर्थ ‘मन्दिर का पर्वत’ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: לְבָמוֹת יָעַר
  choice: जंगल की ऊँची जगहों के समान
  rationale: במות के ‘ऊँचाइयाँ/ऊँची जगहें’ और יער के ‘जंगल’ दोनों अर्थों को रखता है तथा लְ के तुलनात्मक-पदवाची भाव को अनावश्यक रूप से निर्णीत नहीं करता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का विशिष्ट नाम है; उसे सामान्य उपाधि में बदलने के बजाय हिन्दी लिप्यन्तरण में नाम के रूप में रखा गया है।
- issue: ईश्वरीय उपाधि צְבָאוֹת
  choice: सेनाओं का
  alternative: गणों का; स्वर्गीय सेनाओं का
  rationale: मूल शब्द के बहुवचन और सैन्य अर्थ को खुला रखता है; ‘स्वर्गीय’ जोड़कर सेनाओं की पहचान को मूल से अधिक निश्चित नहीं करता।
- issue: במות का संभावित धार्मिक अर्थ
  choice: ऊँची जगहों
  alternative: पूजा के ऊँचे स्थानों
  rationale: यह शब्द कभी पूजा-स्थलों के लिए प्रयुक्त होता है, पर यहाँ उजड़े और वनाच्छादित भूभाग का चित्र भी सम्भव है; मुख्य पाठ किसी एक धार्मिक व्याख्या को आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, जनसुलभ रूप अपनाया गया है। ‘भविष्यवाणी करता था’ चलती हुई अतीतकालीन क्रिया को स्वाभाविक ढंग से व्यक्त करता है। विनाश-संबंधी काव्यात्मक समानान्तरता बनाए रखते हुए अत्यधिक संस्कृतनिष्ठ शब्दावली से बचा गया है।
