id: JER.26.2
reference: Jeremiah 26:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה עֲמֹד֮ בַּ/חֲצַ֣ר בֵּית יְהוָה֒ וְ/דִבַּרְתָּ֞ עַל כָּל עָרֵ֣י יְהוּדָ֗ה הַ/בָּאִים֙ לְ/הִשְׁתַּחֲוֺ֣ת בֵּית יְהוָ֔ה אֵ֚ת כָּל הַ/דְּבָרִ֔ים אֲשֶׁ֥ר צִוִּיתִ֖י/ךָ לְ/דַבֵּ֣ר אֲלֵי/הֶ֑ם אַל תִּגְרַ֖ע דָּבָֽר׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/002.yaml
  text: 'Thus says Yahweh: Stand in the court of the house of Yahweh[a], and speak to all the cities of Judah that come to worship at the house of Yahweh all the words that I have commanded you to speak to them[c][b]; do not hold back a word.'
translation:
  language: hi
  text: 'याहवे यह कहते हैं: “याहवे के भवन के आँगन[a] में खड़ा हो और यहूदा के सभी नगरों से याहवे के भवन में आराधना करने आनेवाले लोगों को[b] वे सब वचन सुना, जिन्हें सुनाने की आज्ञा मैंने तुझे दी है। एक भी वचन मत घटाना।[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “याहवे के भवन के प्रांगण में।” इब्रानी חָצֵר का अर्थ “आँगन” या “प्रांगण” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी को अधिक शाब्दिक रूप से “यहूदा के सभी नगरों को,” “के विषय में,” या “के विरुद्ध” भी समझा जा सकता है। यहाँ अगले पुल्लिंग बहुवचन पद के आधार पर उन नगरों से आराधना करने आनेवाले लोगों को संबोधन माना गया है।
    reason: lexical_and_syntactic_ambiguity
  - marker: c
    text: या “एक भी वचन मत छोड़ना” अथवा “एक भी वचन कम न करना।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: याहवे यह कहते हैं
  rationale: यह नबी के संदेश की मानक भूमिका है। यह रूप मूल की औपचारिकता बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: בַּחֲצַר בֵּית יְהוָה
  choice: याहवे के भवन के आँगन में
  rationale: חָצֵר का अर्थ आँगन या प्रांगण है। בֵּית को ‘भवन’ कहना मूल के ‘घर/भवन’ रूपक को बनाए रखता है और प्रसंग में मंदिर का बोध कराता है।
- source_word: עַל כָּל עָרֵי יְהוּדָה הַבָּאִים
  choice: यहूदा के सभी नगरों से ... आनेवाले लोगों को
  rationale: ‘नगर’ के बाद आया इब्रानी कृदंत पुल्लिंग बहुवचन है, इसलिए आशय उन नगरों के निवासी या उनसे आनेवाले लोग जान पड़ते हैं। हिन्दी में इसे स्पष्ट किया गया है, जबकि पूर्वसर्ग की वैकल्पिक समझ पादटिप्पणी में रखी गई है।
- source_word: לְהִשְׁתַּחֲוֺת
  choice: आराधना करने
  rationale: मूल क्रिया का शाब्दिक अर्थ झुकना या दण्डवत करना है, पर इस मंदिर-संदर्भ में वह उपासना को व्यक्त करती है; ‘आराधना करना’ इसका स्वाभाविक हिन्दी रूप है।
- source_word: אֵת כָּל הַדְּבָרִים
  choice: वे सब वचन
  rationale: ‘सब वचन’ संदेश की पूर्णता पर मूल के बल को बनाए रखता है और अंतिम निषेध से स्पष्ट संबंध बनाता है।
- source_word: אַל תִּגְרַע דָּבָר
  choice: एक भी वचन मत घटाना
  rationale: גרע का मूल भाव घटाना, कम करना या निकाल देना है। यह अनुवाद मूल की शब्दावली और संदेश में कुछ न छोड़ने की आज्ञा, दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में उपाधि नहीं, चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और नाम को किसी उपाधि से नहीं बदलता।
- issue: עַל כָּל עָרֵי יְהוּדָה का संबोधन
  choice: यहूदा के नगरों से आनेवाले लोगों को संबोधित आदेश
  alternative: यहूदा के सभी नगरों के विरुद्ध या उनके विषय में बोलना
  rationale: अगला पुल्लिंग बहुवचन कृदंत आराधना करने आनेवाले व्यक्तियों की ओर संकेत करता है। फिर भी עַל की अर्थ-सीमा के कारण वैकल्पिक प्रतिकूल या विषय-संबंधी अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। आज्ञार्थक एकवचन ‘खड़ा हो’ और ‘सुना’ यिर्मयाह से सीधे संबोधन को बनाए रखते हैं। ‘भवन’ मूल בֵּית को दर्शाता है, जबकि प्रसंग से मंदिर स्पष्ट है।
