base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/008.yaml
  text: And it happened[a], when Yirmeyahu had finished speaking all that Yahweh had commanded him to speak to all the people, that the priests and the prophets and all the people seized him, saying, “You must surely die!”
translation:
  language: hi
  text: जब यिर्मयाहू वह सब कह चुका था, जिसे याहवे ने उसे सारी प्रजा को कहने की आज्ञा दी थी, तब याजकों, भविष्यद्वक्ताओं और सारी प्रजा ने उसे पकड़ लिया और कहा, “तुम निश्चय ही मरोगे!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हें अवश्य मरना होगा।” हिब्रू में जोर देने के लिए एक ही क्रिया का विशेष अनन्त रूप और समापिका क्रिया साथ प्रयुक्त हुए हैं।
    reason: हिब्रू की जोरदार व्याकरणिक रचना का वैकल्पिक मोडल अनुवाद और संक्षिप्त व्याख्या।
lexical_decisions:
- source_word: וַיְהִי כְּכַלּוֹת
  choice: जब ... कह चुका ... तब
  rationale: हिब्रू की कथात्मक और कालवाचक संरचना को स्वाभाविक आधुनिक हिन्दी में ‘जब…तब’ से व्यक्त किया गया है; अलग से ‘और ऐसा हुआ’ जोड़ना हिन्दी में अनावश्यक रूप से भारी होता।
- source_word: יִרְמְיָהוּ
  choice: यिर्मयाह
  rationale: हिब्रू नाम का प्रचलित और पहचानने योग्य हिन्दी लिप्यंतरण।
- source_word: אֵת כָּל אֲשֶׁר צִוָּה יְהוָה לְדַבֵּר
  choice: वह सब कह चुका, जिसे यहोवा ने उसे ... कहने की आज्ञा दी थी
  rationale: आज्ञा पहले दिए जाने और उसके बाद वचन पूरा कहे जाने का कालक्रम स्पष्ट रखते हुए כָּל की समग्रता बनाए रखी गई है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुराक्षरीय दिव्य नाम को हिन्दी में लंबे समय से प्रचलित व्यक्तिगत नाम ‘यहोवा’ से प्रस्तुत किया गया है, न कि उपाधि ‘प्रभु’ से।
- source_word: כָּל הָעָם
  choice: सारी प्रजा
  rationale: עם यहाँ सामूहिक जनसमुदाय को दर्शाता है; ‘प्रजा’ सार्वजनिक और धार्मिक प्रसंग में स्वाभाविक है तथा כָּל की व्यापकता को ‘सारी’ व्यक्त करता है।
- source_word: וַיִּתְפְּשׂוּ אֹתוֹ
  choice: उसे पकड़ लिया
  rationale: क्रिया का बलपूर्वक हाथ में लेने का अर्थ सुरक्षित है, पर औपचारिक ‘गिरफ्तार’ कहकर कानूनी प्रक्रिया नहीं जोड़ी गई।
- source_word: הַכֹּהֲנִים וְהַנְּבִאִים וְכָל הָעָם
  choice: याजकों, भविष्यद्वक्ताओं और सारी प्रजा
  rationale: विरोध करने वाले तीनों समूह स्पष्ट रखे गए हैं; हिन्दी की स्वाभाविक सूची-रचना अपनाई गई है।
- source_word: מוֹת תָּמוּת
  choice: तुम्हें निश्चय ही मरना होगा
  rationale: क्रिया के साथ प्रयुक्त infinitive absolute की तीव्र निश्चितता और धमकी/दंडादेश का स्वर आधुनिक हिन्दी में व्यक्त होता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में व्यक्तिगत दिव्य नाम है। हिन्दी पाठकों के लिए प्रतिष्ठित लिप्यंतरण ‘यहोवा’ उसे उपाधि में बदले बिना स्पष्ट रूप से प्रस्तुत करता है।
- issue: מוֹת תָּמוּת में दंडादेश और भविष्यवाणी के बीच स्वर
  choice: तुम्हें निश्चय ही मरना होगा
  alternative: तुम निश्चय मरोगे
  rationale: संदर्भ में भीड़ का कथन दंड की मांग या धमकी है, पर हिब्रू व्याकरण केवल अनिवार्यता तक सीमित नहीं है। मुख्य पाठ न्यायिक स्वर रखता है और पादटिप्पणी अधिक शाब्दिक विकल्प देती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक पाठ में सहज रखी गई है। ‘याजक’, ‘भविष्यद्वक्ता’ और ‘प्रजा’ जैसे परिचित बाइबलीय शब्द बनाए गए हैं। हिब्रू की पुनरुक्ति को जहाँ अर्थपूर्ण है वहाँ रखा गया, पर आरंभिक कथात्मक सूत्र को स्वाभाविक हिन्दी ‘जब…तब’ में ढाला गया है।
