  text: And the priests and the prophets and all the people heard Jeremiah speaking these words in the house of Yahweh[a].
translation:
  language: hi
  text: तब याजकों, भविष्यद्वक्ताओं और सब लोगों ने यिर्मयाह को ये बातें यहोवा के मंदिर[a] में कहते सुना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “यहोवा के घर में।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: तब ... सुना
  rationale: वाव-क्रमिक अपूर्ण भूतकालीन कथा को आगे बढ़ाता है; हिन्दी में “तब ... सुना” स्वाभाविक है और यहाँ שׁמע का साधारण श्रवणार्थ सुरक्षित रखता है।
- source_word: הַכֹּהֲנִים וְהַנְּבִאִים וְכָל הָעָם
  choice: याजकों, भविष्यद्वक्ताओं और सब लोगों ने
  rationale: तीनों समन्वित समूहों को स्पष्ट रखा गया है; हिन्दी में हर पद के बीच “और” दोहराने के बजाय सूची का स्वाभाविक विन्यास अपनाया गया है।
- source_word: אֶת יִרְמְיָהוּ מְדַבֵּר
  choice: यिर्मयाह को ... कहते
  rationale: कृदन्त מְדַבֵּר यिर्मयाह के बोलते रहने की समकालिक क्रिया दिखाता है; “को ... कहते सुना” हिन्दी में इसी संरचना का स्वाभाविक रूप है।
- source_word: אֶת הַדְּבָרִים הָאֵלֶּה
  choice: ये बातें
  rationale: भाषण के संदर्भ में דְּבָרִים का अर्थ “बातें/वचन” हो सकता है; साधारण आधुनिक हिन्दी में “ये बातें” स्पष्ट और स्वाभाविक है।
- source_word: בְּבֵית יְהוָה
  choice: यहोवा के भवन में
  rationale: בַּיִת का मूल रूपक “भवन/घर” सुरक्षित रखा गया है, जबकि सन्दर्भ मन्दिर का है; स्थानवाचक בְּ को “में” से व्यक्त किया गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय निजी नाम को हिन्दी में प्रचलित प्रतिलेखन “यहोवा” से प्रस्तुत किया गया है, न कि उपाधि “प्रभु” से।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में निजी वाचा-नाम है। “यहोवा” हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाता है और नाम को उपाधि में बदलने से बचाता है; “याहवे” अधिक पुनर्निर्मित उच्चारण है और “प्रभु” नाम को प्रतिस्थापित करता है।
- issue: בְּבֵית יְהוָה में ‘भवन’ या ‘मन्दिर’
  choice: यहोवा के भवन
  alternative: यहोवा के मन्दिर
  rationale: “भवन” इब्रानी के शाब्दिक रूप को बनाए रखता है, जबकि पादटिप्पणी प्रासंगिक अर्थ “मन्दिर” बताती है; इससे रूपक और संदर्भ दोनों उपलब्ध रहते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कथात्मक शैली। “याजक” और “भविष्यद्वक्ता” परिचित बाइबलीय पद हैं। मूल की समन्वित सूची को हिन्दी के स्वाभाविक विराम-विन्यास में रखा गया है।
