base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/019.yaml
  text: Did Hezekiah king of Judah and all Judah put him to death? Did he not fear Yahweh and seek the favor of Yahweh[c][b][a], and Yahweh relented concerning the disaster that he had spoken against them? But we are doing great evil against ourselves.
translation:
  language: hi
  text: क्या यहूदा के राजा हिजकिय्याह और सारे यहूदा ने उसे सचमुच मार डाला था? क्या हिजकिय्याह ने याहवे का भय नहीं माना और याहवे की कृपा के लिए विनती नहीं की थी?[a] और याहवे ने उस विपत्ति को टाल दिया[b] जिसे उसने उनके विरुद्ध कहा था। पर हम अपने ही विरुद्ध बड़ी बुराई कर रहे हैं।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “याहवे के मुख को शांत किया”; यह याहवे की कृपा पाने के लिए उससे विनती करने का इब्रानी मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: या, “याहवे उस विपत्ति के विषय में पछताया”; अथवा, “याहवे ने उस विपत्ति के विषय में अपना मन बदल लिया।”
    reason: alternative_reading
  - marker: c
    text: इस पद में एक ही इब्रानी शब्द רָעָה पहले “विपत्ति,” अर्थात दंडस्वरूप अनिष्ट, के लिए और यहाँ “बुराई,” अर्थात नैतिक बुराई, के लिए आया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶהָמֵת הֱמִתֻהוּ
  choice: उसे मार डाला था
  rationale: इन्फिनिटिव एब्सोल्यूट और हिफ़ील क्रिया का संयोजन मृत्यु-दंड दिए जाने पर बल देता है। हिंदी में यह अभिव्यक्ति स्वाभाविक है और अनावश्यक रूप से न्यायिक अर्थ नहीं जोड़ती।
- source_word: וְכָל יְהוּדָה
  choice: और सारे यहूदा
  rationale: सामूहिक राष्ट्रीय अभिव्यक्ति को बनाए रखता है; संदर्भ में इसका अर्थ यहूदा के समस्त लोगों से है।
- source_word: הֲלֹא יָרֵא אֶת־יְהוָה
  choice: क्या हिजकिय्याह ने याहवे का भय नहीं माना था
  rationale: यָרֵא परमेश्वर के प्रति श्रद्धापूर्ण भय को व्यक्त करता है। दो संभावित कर्ताओं के बाद अस्पष्टता से बचने के लिए सर्वनाम के स्थान पर नाम दोहराया गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम का हिंदी लिप्यंतरण किया गया है, उसे किसी उपाधि से नहीं बदला गया।
- source_word: וַיְחַל אֶת־פְּנֵי יְהוָה
  choice: उसकी कृपा माँगी
  rationale: शाब्दिक रूप से ‘याहवे का मुख कोमल करना’ वाला मुहावरा अनुग्रह पाने के लिए विनती करने का भाव देता है। यह हिंदी में संक्षिप्त और स्वाभाविक है।
- source_word: וַיִּנָּחֶם יְהוָה
  choice: याहवे ... पछताया
  rationale: נחם की मानवीय अनुभूति के रूप में कही गई भाषा और उसके धर्मवैचारिक तनाव को बनाए रखता है; इसे केवल विपत्ति टालने के निर्लिप्त वर्णन में नहीं बदला गया।
- source_word: אֶל־הָרָעָה
  choice: उस विपत्ति के विषय में
  rationale: यहाँ רָעָה नैतिक बुराई नहीं, घोषित अनिष्ट या न्यायजनित विपत्ति को दर्शाता है।
- source_word: אֲשֶׁר דִּבֶּר עֲלֵיהֶם
  choice: जिसकी चेतावनी उसने उन्हें दी थी
  rationale: भविष्यद्वाणी के संदर्भ में ‘उनके विरुद्ध कही थी’ का आशय उन पर आने वाली विपत्ति घोषित करना है; ‘चेतावनी दी’ हिंदी में इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַאֲנַחְנוּ עֹשִׂים רָעָה גְדוֹלָה עַל נַפְשׁוֹתֵינוּ
  choice: पर हम अपने ही विरुद्ध बड़ी बुराई कर रहे हैं
  rationale: רָעָה के नैतिक अर्थ और נֶפֶשׁ के ‘स्वयं/जीवन’ अर्थ को साथ रखता है। ‘पर’ पिछले उदाहरण और वर्तमान सभा के आचरण के बीच निहित विरोध स्पष्ट करता है।
theological_decisions:
- issue: मनुष्य के समान भावों वाली भाषा में परमेश्वर की प्रतिक्रिया
  choice: याहवे उस विपत्ति के विषय में पछताया
  alternative: याहवे उस विपत्ति को लाने से रुक गया / याहवे ने उस विपत्ति के विषय में अपना मन बदल लिया
  rationale: इब्रानी पाठ घोषित न्याय के प्रति याहवे की प्रतिक्रिया को वास्तविक और मानवीय अनुभूति वाली भाषा में कहता है। मुख्य पाठ इस तनाव को बनाए रखता है; पादटिप्पणी अर्थ की दूसरी वैध अभिव्यक्ति देती है, पर किसी दार्शनिक समाधान को पाठ पर आरोपित नहीं करती।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रूप अपनाया गया है। प्रश्नों की वक्तृता बनाए रखी गई है। ‘याहवे’ व्यक्तिगत दिव्य नाम का देवनागरी लिप्यंतरण है। मुख्य पाठ में मूल की धर्मवैचारिक असहजता सुरक्षित है और आवश्यक विकल्प पादटिप्पणियों में दिए गए हैं।
