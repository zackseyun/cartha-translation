source:
  edition: WLC
  text: וְ/גַם אִ֗ישׁ הָיָ֤ה מִתְנַבֵּא֙ בְּ/שֵׁ֣ם יְהוָ֔ה אֽוּרִיָּ֨הוּ֙ בֶּֽן שְׁמַעְיָ֔הוּ מִ/קִּרְיַ֖ת הַיְּעָרִ֑ים וַ/יִּנָּבֵ֞א עַל הָ/עִ֤יר הַ/זֹּאת֙ וְ/עַל הָ/אָ֣רֶץ הַ/זֹּ֔את כְּ/כֹ֖ל דִּבְרֵ֥י יִרְמְיָֽהוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/020.yaml
  text: And there was also a man prophesying in the name of Yahweh[a], Uriah son of Shemaiah from Kiriath-jearim[b], and he prophesied against this city and against this land according to all the words of Jeremiah.
translation:
  language: hi
  text: 'एक और व्यक्ति भी था, जो यहोवा के नाम से भविष्यवाणी करता था: शमायाह का पुत्र ऊरिय्याह, जो किर्यत-यारीम से था। उसने इस नगर और इस देश के विरुद्ध[a] यिर्मयाह के सभी वचनों के अनुरूप भविष्यवाणी की।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस नगर और इस देश के विषय में।” इब्रानी पूर्वसर्ग सामान्य रूप से भविष्यवाणी का विषय भी बता सकता है, यद्यपि यहाँ न्याय का संदर्भ “के विरुद्ध” अर्थ का समर्थन करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם אִישׁ הָיָה מִתְנַבֵּא
  choice: एक और व्यक्ति था, जो ... भविष्यवाणी करता था
  rationale: यह स्वाभाविक हिन्दी में एक अतिरिक्त समान प्रसंग और जारी अथवा वर्णनात्मक भविष्यवाणी की गतिविधि—दोनों को व्यक्त करता है।
- source_word: בְּשֵׁם יְהוָה
  choice: यहोवा के नाम से
  rationale: यह दैवी अधिकार के अधीन बोलने का प्रचलित हिन्दी मुहावरा है और יהוה को उसके व्यक्तिगत नाम के रूप में दर्शाता है।
- source_word: אוּרִיָּהוּ בֶּן שְׁמַעְיָהוּ
  choice: शमायाह का पुत्र ऊरिय्याह
  rationale: नामों और वंश-संबंध को स्रोत के अनुरूप स्पष्ट रूप से रखता है।
- source_word: מִקִּרְיַת הַיְּעָרִים
  choice: किर्यत-यारीम का रहनेवाला
  rationale: מִן के उद्गम-सूचक अर्थ को सहज हिन्दी में व्यक्त करते हुए स्थान-नाम का लिप्यंतरण रखता है।
- source_word: עַל הָעִיר הַזֹּאת וְעַל הָאָרֶץ הַזֹּאת
  choice: इस नगर और इस देश के विरुद्ध
  rationale: न्याय-संदेश के संदर्भ में עַל का विरोधात्मक अर्थ उपयुक्त है; फिर भी अधिक सामान्य विषय-सूचक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: כְּכֹל דִּבְרֵי יִרְמְיָהוּ
  choice: ठीक वैसी ही ... जैसी यिर्मयाह ने की थी
  rationale: यह ऊरिय्याह के संदेश और यिर्मयाह के वचनों के पूर्ण साम्य को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: पद में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है; हिन्दी बाइबल-पाठकों के बीच पहचाना जानेवाला ‘यहोवा’ उसे उपाधि ‘प्रभु’ से अलग बनाए रखता है।
- issue: भविष्यवाणी के साथ עַל का अर्थ
  choice: के विरुद्ध
  alternative: के विषय में
  rationale: यिर्मयाह की न्याय-संबंधी भविष्यवाणियों से समानता के कारण यहाँ विरोधात्मक अर्थ संदर्भानुकूल है, पर इब्रानी पूर्वसर्ग की व्यापक विषय-सूचक संभावना पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण और सामान्य पाठकों के लिए सहज। नामों का देवनागरी लिप्यंतरण किया गया है; वाक्य-विन्यास को हिन्दी की स्वाभाविक कथा-शैली के अनुसार रखा गया है।
