  text: וַ/יֹּאמְר֤וּ הַ/שָּׂרִים֙ וְ/כָל הָ/עָ֔ם אֶל הַ/כֹּהֲנִ֖ים וְ/אֶל הַ/נְּבִיאִ֑ים אֵין לָ/אִ֤ישׁ הַ/זֶּה֙ מִשְׁפַּט מָ֔וֶת כִּ֗י בְּ/שֵׁ֛ם יְהוָ֥ה אֱלֹהֵ֖י/נוּ דִּבֶּ֥ר אֵלֵֽי/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/016.yaml
  text: Then the officials and all the people said to the priests and the prophets[a], “This man does not deserve the sentence of death[b], for he has spoken to us in the name of Yahweh our God.”
translation:
  language: hi
  text: तब अधिकारियों और सब लोगों ने याजकों और भविष्यद्वक्ताओं से कहा, “यह मनुष्य मृत्युदंड के योग्य नहीं है[a], क्योंकि उसने हमारे परमेश्वर यहोवा के नाम से हमसे बात की है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “इस मनुष्य के लिए मृत्यु का दंडादेश नहीं है”; इसका अनुवाद “यह मनुष्य मृत्यु के योग्य नहीं है” भी हो सकता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׂרִים
  choice: अधिकारियों
  rationale: न्यायिक प्रसंग में यह शब्द शासकीय या दरबारी पदाधिकारियों को सूचित करता है; ‘अधिकारियों’ आधुनिक और स्वाभाविक है।
- source_word: וְכָל הָעָם
  choice: और सब लोगों
  rationale: सामूहिक जनभागीदारी को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הַכֹּהֲנִים ... הַנְּבִיאִים
  choice: याजकों और भविष्यद्वक्ताओं
  rationale: दोनों संबोधित समूहों के मानक और स्पष्ट हिन्दी रूप।
- source_word: אֵין לָאִישׁ הַזֶּה מִשְׁפַּט מָוֶת
  choice: यह मनुष्य मृत्युदंड के योग्य नहीं है
  rationale: इब्रानी वाक्यांश का न्यायिक आशय है कि इस व्यक्ति पर मृत्यु का दंड लागू नहीं होता। चुना हुआ रूप हिन्दी में स्वाभाविक रहते हुए वैधानिक निर्णय को बनाए रखता है।
- source_word: בְּשֵׁם יְהוָה אֱלֹהֵינוּ
  choice: हमारे परमेश्वर यहोवा के नाम से
  rationale: ‘नाम से’ दैवी अधिकार और प्रतिनिधित्व का भाव बनाए रखता है; יְהוָה को व्यक्तिगत नाम ‘यहोवा’ के रूप में प्रस्तुत किया गया है।
- source_word: דִּבֶּר אֵלֵינוּ
  choice: हमसे बात की है
  rationale: समाप्त कथन की वर्तमान न्यायिक प्रासंगिकता को स्वाभाविक हिन्दी पूर्ण काल में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ में चार-अक्षरीय व्यक्तिगत नाम प्रत्यक्ष रूप से है। हिन्दी के सामान्य बाइबलीय प्रयोग में ‘यहोवा’ पहचाना जाने वाला लिप्यंतरण है; इसे उपाधि ‘प्रभु’ से बदलने पर नाम और उपाधि का भेद मिट सकता है।
- issue: מִשְׁפַּט מָוֶת का न्यायिक बल
  choice: मृत्युदंड के योग्य नहीं
  alternative: इसके लिए मृत्यु का दंडादेश नहीं है / यह मृत्यु के योग्य नहीं
  rationale: प्रसंग विधिक सुनवाई का है। चुना हुआ रूप औपचारिक दंडनीयता को स्पष्ट करता है, पर वाक्य को अस्वाभाविक कानूनी हिन्दी में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी; न्यायिक प्रसंग के अनुरूप गरिमापूर्ण किंतु सामान्य पाठकों के लिए स्पष्ट भाषा। ‘याजक’ और ‘भविष्यद्वक्ता’ स्थापित बाइबलीय पद हैं।
