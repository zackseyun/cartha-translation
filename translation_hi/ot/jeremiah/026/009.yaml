id: JER.26.9
reference: Jeremiah 26:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: מַדּוּעַ֩ נִבֵּ֨יתָ בְ/שֵׁם יְהוָ֜ה לֵ/אמֹ֗ר כְּ/שִׁלוֹ֙ יִֽהְיֶה֙ הַ/בַּ֣יִת הַ/זֶּ֔ה וְ/הָ/עִ֥יר הַ/זֹּ֛את תֶּחֱרַ֖ב מֵ/אֵ֣ין יוֹשֵׁ֑ב וַ/יִּקָּהֵ֧ל כָּל הָ/עָ֛ם אֶֽל יִרְמְיָ֖הוּ בְּ/בֵ֥ית יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/009.yaml
  text: Why have you prophesied in the name of the LORD, saying, ‘This house will become like Shiloh, and this city will be laid waste, with no inhabitant’?” Then all the people gathered against Jeremiah in the house of the LORD.
translation:
  language: hi
  text: “तूने यहोवा के नाम से यह भविष्यवाणी क्यों की कि ‘यह भवन शीलो के समान हो जाएगा, और यह नगर ऐसा उजड़ जाएगा कि इसमें कोई निवासी न रहेगा’?” तब यहोवा के भवन में सब लोग यिर्मयाह के विरुद्ध इकट्ठे हो गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נִבֵּיתָ
  choice: तूने ... भविष्यवाणी की
  rationale: यह क्रिया नבא के निफ़अल रूप से है और यहाँ भविष्यद्वक्ता के रूप में संदेश सुनाने का अर्थ देती है। संबोधन एकवचन है, इसलिए प्रसंगानुकूल ‘तूने’ रखा गया।
- source_word: בְשֵׁם יְהוָה
  choice: यहोवा के नाम से
  rationale: בְשֵׁם अधिकार और प्रतिनिधित्व में बोलने का भाव रखता है। परमेश्वर के विशिष्ट इब्रानी नाम יהוה को हिन्दी में प्रचलित रूप ‘यहोवा’ से व्यक्त किया गया।
- source_word: כְשִׁלוֹ יִהְיֶה הַבַּיִת הַזֶּה
  choice: यह भवन शीलो के समान हो जाएगा
  rationale: כְ तुलना सूचित करता है और יִהְיֶה भावी अवस्था को; ‘हो जाएगा’ उस परिवर्तन को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: תֶּחֱרַב
  choice: उजड़ जाएगा
  rationale: חרב का अर्थ उजाड़ या निर्जन हो जाना है। नगर के संदर्भ में ‘उजड़ जाएगा’ विनाश और वीरानी दोनों भाव समेटता है।
- source_word: מֵאֵין יוֹשֵׁב
  choice: इसमें कोई निवासी न रहेगा
  rationale: शाब्दिक भाव ‘निवासी के न होने से/बिना निवासी’ है; हिन्दी में इसे परिणामस्वरूप निर्जनता के रूप में सहज ढंग से व्यक्त किया गया।
- source_word: וַיִּקָּהֵל כָּל הָעָם אֶל יִרְמְיָהוּ
  choice: तब ... सब लोग यिर्मयाह के विरुद्ध इकट्ठे हो गए
  rationale: קהל का अर्थ एकत्र होना है। אֶל सामान्यतः ‘की ओर/के पास’ है, पर इस टकरावपूर्ण प्रसंग में जमावड़ा यिर्मयाह के विरोध में है; ‘के विरुद्ध’ प्रसंगगत दिशा को व्यक्त करता है।
- source_word: בְּבֵית יְהוָה
  choice: यहोवा के भवन में
  rationale: स्थानवाचक בְ को ‘में’ और मंदिर के लिए בַּיִת को इस पद में पहले आए ‘भवन’ से संगत रखा गया।
theological_decisions:
- issue: יהוה के नाम का निरूपण
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में विशिष्ट वाचा-नाम יהוה है। ‘यहोवा’ नाम और सामान्य उपाधि ‘प्रभु’ के बीच का भेद बनाए रखता है और हिन्दी बाइबलीय भाषा में परिचित है।
- issue: शीलो से तुलना का आशय
  choice: तुलना को बिना विस्तार के बनाए रखा
  alternative: शीलो की तरह नष्ट हो जाएगा
  rationale: मूल केवल ‘शीलो के समान हो जाएगा’ कहता है। यद्यपि प्रसंग विनाश का संकेत देता है, अनुवाद ने अंतर्निहित ऐतिहासिक-धार्मिक आशय को अतिरिक्त शब्दों से स्पष्ट करके मूल की संक्षिप्तता नहीं मिटाई।
- issue: लोगों के एकत्र होने की दिशा
  choice: यिर्मयाह के विरुद्ध
  alternative: यिर्मयाह के पास
  rationale: אֶל दिशा को सूचित कर सकता है, पर प्रश्न की आरोपात्मक भाषा और निकटवर्ती प्रसंग विरोधी जमावड़े को दर्शाते हैं। ‘के विरुद्ध’ उस व्यावहारिक भाव को स्पष्ट करता है, यद्यपि ‘के पास’ अधिक रूपात्मक विकल्प है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सार्वजनिक पाठ के लिए सहज रखी गई है। ‘भवन’, ‘नगर’, ‘निवासी’ और ‘भविष्यवाणी’ जैसे परिचित बाइबलीय शब्द बनाए गए हैं; वाक्यरचना को अत्यधिक संस्कृतनिष्ठ नहीं बनाया गया।
