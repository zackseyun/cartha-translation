source:
  edition: WLC
  text: אַ֣ךְ יָדֹ֣עַ תֵּדְע֗וּ כִּ֣י אִם מְמִתִ֣ים אַתֶּם֮ אֹתִ/י֒ כִּי דָ֣ם נָקִ֗י אַתֶּם֙ נֹתְנִ֣ים עֲלֵי/כֶ֔ם וְ/אֶל הָ/עִ֥יר הַ/זֹּ֖את וְ/אֶל יֹשְׁבֶ֑י/הָ כִּ֣י בֶ/אֱמֶ֗ת שְׁלָחַ֤/נִי יְהוָה֙ עֲלֵי/כֶ֔ם לְ/דַבֵּר֙ בְּ/אָזְנֵי/כֶ֔ם אֵ֥ת כָּל הַ/דְּבָרִ֖ים הָ/אֵֽלֶּה׀־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/015.yaml
  text: Only know for certain that if you put me to death[a], you are bringing innocent blood on yourselves, on this city, and on its inhabitants[b]; for in truth Yahweh has sent me to you to speak all these words in your hearing.
translation:
  language: hi
  text: पर यह निश्चय जान लो कि यदि तुम मुझे मृत्युदंड देते हो[a], तो तुम अपने ऊपर, इस नगर पर और इसके निवासियों पर निर्दोष रक्त का दोष लाते हो; क्योंकि वास्तव में याहवे ने मुझे तुम्हारे पास भेजा है कि मैं तुम्हारे सुनने के लिए ये सारी बातें कहूँ[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मुझे मार डालते हो।” इब्रानी क्रिया कारक अर्थ रखती है—अर्थात् किसी को मरवाना या मृत्यु दिलाना—और यहाँ न्यायिक प्रसंग में मृत्युदंड का संकेत देती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “तुम्हारे कानों में।” यह इब्रानी मुहावरा किसी को सीधे सुनाने के लिए बोलने का अर्थ देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ יָדֹעַ תֵּדְעוּ
  choice: पर तुम यह निश्चित रूप से जान लो
  rationale: אַךְ चेतावनी पर बल देता है, और धातु के साथ infinitive absolute निश्चितता तथा तीव्रता प्रकट करता है। यह हिंदी वाक्यांश दोनों बातों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מְמִתִים אַתֶּם אֹתִי
  choice: तुम मुझे मृत्युदंड देते हो
  rationale: מות का हिफ़ील रूप कारक अर्थ रखता है—‘मृत्यु दिलाना।’ न्यायिक प्रसंग में ‘मृत्युदंड देना’ जानबूझकर किए जाने वाले आधिकारिक वध को स्पष्ट करता है।
- source_word: דָם נָקִי
  choice: निर्दोष के खून का दोष
  rationale: यह अनुचित रक्तपात और उससे उत्पन्न दोष का मानक इब्रानी भाव है। हिंदी में ‘निर्दोष के खून का दोष’ व्यक्ति की निर्दोषता और रक्त-दोष, दोनों को स्पष्ट रखता है।
- source_word: נֹתְנִים עֲלֵיכֶם
  choice: अपने ऊपर ... दोष लाते हो
  rationale: शाब्दिक रूप से ‘अपने ऊपर रखते/देते हो’; प्रसंग में इसका अर्थ रक्त-दोष मोल लेना है। चुना हुआ रूप मूल रूपक और परिणाम दोनों को सहज हिंदी में रखता है।
- source_word: בֶאֱמֶת
  choice: सचमुच
  rationale: यह यिर्मयाह के भेजे जाने की तथ्यात्मक निश्चितता पर बल देता है और हिंदी में गंभीर किंतु स्वाभाविक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल में परमेश्वर का व्यक्तिगत नाम चार-अक्षरीय नाम के रूप में आया है; ‘याहवे’ उसका प्रचलित हिंदी लिप्यंतरण है, न कि किसी उपाधि का प्रतिस्थापन।
- source_word: עֲלֵיכֶם
  choice: तुम्हारे पास
  rationale: भेजने की क्रिया के साथ यह लक्षित श्रोताओं की दिशा बताता है। ‘तुम्हारे पास’ हिंदी में इस भविष्यद्वक्ताई नियुक्ति को स्वाभाविक रूप से व्यक्त करता है और अनावश्यक रूप से ‘तुम्हारे विरुद्ध’ अर्थ नहीं थोपता।
- source_word: לְדַבֵּר בְּאָזְנֵיכֶם
  choice: तुम्हारे सुनते हुए ... कहूँ
  rationale: शाब्दिक मुहावरा ‘तुम्हारे कानों में बोलना’ है। चुना हुआ रूप प्रत्यक्ष रूप से उनके सुनने के लिए कही गई वाणी का भाव सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: पद में उपाधि नहीं, चार-अक्षरीय व्यक्तिगत नाम सीधे प्रयुक्त है। ‘याहवे’ मूल नाम को नाम के रूप में सुरक्षित रखता है; ‘प्रभु’ उसे उपाधि से बदल देता, जबकि ‘यहोवा’ एक वैकल्पिक पारंपरिक स्वरांकन है।
- issue: निर्दोष रक्त से उत्पन्न उत्तरदायित्व
  choice: निर्दोष के खून का दोष अपने ऊपर, नगर पर और निवासियों पर लाना
  alternative: केवल व्यक्तिगत हत्या का दोष
  rationale: मूल वाक्य दोष के प्रभाव को संबोधित व्यक्तियों के साथ नगर और उसके निवासियों तक स्पष्ट रूप से फैलाता है। अनुवाद इस सामूहिक आयाम को बनाए रखता है, बिना उसके तंत्र की अतिरिक्त व्याख्या किए।
translation_notes:
  register: आधुनिक मानक हिंदी का गंभीर, सार्वजनिक चेतावनी के अनुकूल रूप अपनाया गया है। वाक्य सहज रखा गया है, पर मूल की जोरदार चेतावनी, न्यायिक संदर्भ, सामूहिक रक्त-दोष और भविष्यद्वक्ताई नियुक्ति को सुरक्षित रखा गया है।
