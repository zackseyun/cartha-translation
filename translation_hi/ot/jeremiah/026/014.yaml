lexical_decisions:
- source_word: וַאֲנִי
  choice: परन्तु मैं तो
  rationale: स्वतंत्र सर्वनाम के साथ संयोजक पिछले प्रतिवाद से यिर्मयाह की अपनी स्थिति की ओर विरोधात्मक मोड़ दिखाता है; ‘परन्तु मैं तो’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הִנְנִי
  choice: मैं तो … हूँ
  rationale: यह प्रस्तुतिकरण-सूचक रूप वक्ता की तत्काल उपस्थिति और स्वयं को उपलब्ध कर देने का भाव रखता है। हिन्दी में ‘मैं तो … हूँ’ प्रसंग के भीतर इस बल को स्वाभाविक ढंग से व्यक्त करता है; अलग से ‘देखो’ जोड़ना अनावश्यक रूप से नाटकीय हो सकता है।
- source_word: בְיֶדְכֶם
  choice: आपके हाथ में
  rationale: मूल में ‘हाथ’ एकवचन है और यह किसी के अधिकार या नियंत्रण में होने का मुहावरा है। हिन्दी में यही बिंब और मुहावरा सहज तथा स्पष्ट है।
- source_word: עֲשׂוּ לִי
  choice: मेरे साथ कीजिए
  rationale: עשה के साथ ל यिर्मयाह की ओर निर्देशित व्यवहार को बताता है। शाब्दिक ‘मुझ पर कीजिए’ अस्वाभाविक है; ‘मेरे साथ कीजिए’ अर्थ को सीधे और वर्तमान हिन्दी में रखता है।
- source_word: כַּטּוֹב וְכַיָּשָׁר
  choice: जो कुछ … अच्छा और सही हो
  rationale: दोनों विशेषण कार्य के मानदंड को बताते हैं। ‘अच्छा और सही’ नैतिक तथा न्यायिक व्यापकता को बनाए रखता है; ‘न्यायसंगत’ अकेले अर्थ को अधिक संकीर्ण कर देता।
- source_word: בְּעֵינֵיכֶם
  choice: आपकी दृष्टि में
  rationale: यह व्यक्ति के निर्णय या मूल्यांकन का इब्रानी मुहावरा है। ‘आपकी दृष्टि में’ मूल बिंब को रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
