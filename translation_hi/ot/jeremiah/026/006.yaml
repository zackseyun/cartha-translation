reference: Jeremiah 26:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/נָתַתִּ֛י אֶת הַ/בַּ֥יִת הַ/זֶּ֖ה כְּ/שִׁלֹ֑ה וְ/אֶת הָ/עִ֤יר ה/זאתה אֶתֵּ֣ן לִ/קְלָלָ֔ה לְ/כֹ֖ל גּוֹיֵ֥י הָ/אָֽרֶץ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/006.yaml
  text: then I will make this house like Shiloh[b][a], and I will make this city a curse to all the nations of the earth.
translation:
  language: hi
  text: तब मैं इस भवन को शीलो के समान कर दूँगा[a], और इस नगर को पृथ्वी की सब जातियों के लिए शाप का विषय बना दूँगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शीलो वह पहले का पवित्र-स्थान था जिस पर न्याय आया था; यह तुलना उजाड़े जाने और त्याग दिए जाने की ओर संकेत करती है।
    reason: cultural_note
  - marker: b
    text: या, “इस नगर को पृथ्वी की सब जातियों के लिए शाप बना दूँगा”; अर्थात उसके नाम का उल्लेख शाप देते समय किया जाएगा।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: तब मैं ... कर दूँगा
  rationale: נתן का मूल अर्थ ‘देना/रखना’ है, पर इस न्याय-संदर्भ में यह किसी वस्तु को एक दशा में कर देने का भाव व्यक्त करता है। पूर्ववर्ती शर्त के परिणाम को दिखाने के लिए וְ का स्वाभाविक हिन्दी रूप ‘तब’ है।
- source_word: הַבַּיִת הַזֶּה
  choice: इस भवन को
  rationale: בַּיִת का शाब्दिक अर्थ ‘घर’ है और यहाँ संकेत यहोवा के मंदिर की ओर है। ‘भवन’ मूल के व्यापक रूपक को पूरी तरह ‘मंदिर’ में सीमित किए बिना हिन्दी में पवित्र भवन का गरिमापूर्ण और स्पष्ट बोध देता है।
- source_word: כְּשִׁלֹה
  choice: शीलो के समान
  rationale: उपसर्ग כְּ तुलना प्रकट करता है। स्थान-नाम को हिन्दी में प्रचलित बाइबलीय रूप ‘शीलो’ में लिप्यंतरित किया गया है।
- source_word: הָעִיר הַזֹּאת
  choice: इस नगर को
  rationale: संदर्भ में यह यरूशलेम के लिए प्रयुक्त सीधा संकेतवाचक पदबंध है।
- source_word: אֶתֵּן לִקְלָלָה
  choice: शाप का विषय बना दूँगा
  rationale: נתן + ל + קללה मुहावरे का अर्थ नगर को ऐसा उदाहरण या विषय बना देना है जिसका उल्लेख शाप देते समय हो। यह हिन्दी में ‘नगर को शाप’ कहने से अधिक स्वाभाविक है और अर्थ की अस्पष्टता को पादटिप्पणी में सुरक्षित रखता है।
- source_word: לְכֹל גּוֹיֵי הָאָרֶץ
  choice: पृथ्वी की सब जातियों के लिए
  rationale: यहाँ הָאָרֶץ का वैश्विक अर्थ ‘पृथ्वी’ स्वाभाविक है। לְ संबंध अथवा प्रभाव बताता है; ‘के लिए’ उस संबंध को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: मंदिर के उल्लेख का अनुवाद
  choice: इस भवन को
  alternative: इस घर को; इस मंदिर को
  rationale: मूल शब्द ‘घर/भवन’ है, यद्यपि संदर्भ में यरूशलेम का मंदिर अभिप्रेत है। ‘भवन’ मूल की व्यापकता और यहोवा के भवन की धार्मिक अनुगूँज को बनाए रखता है, जबकि ‘मंदिर’ अर्थ को अधिक स्पष्ट पर संकीर्ण कर देता।
- issue: नगर के विषय में न्याय-सूत्र का आशय
  choice: शाप का विषय बना दूँगा
  alternative: शाप बना दूँगा; ऐसा बना दूँगा कि उसके नाम से शाप दिया जाए
  rationale: हिब्रू मुहावरा नगर के स्वयं ‘शाप’ बनने अथवा शाप देने में उसके उदाहरण के रूप में प्रयुक्त होने—दोनों भावों की अनुमति देता है। मुख्य पाठ स्वाभाविक हिन्दी देता है और वैकल्पिक शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण भविष्यकालीन न्याय-वचन। ‘भवन’ और ‘नगर’ औपचारिक किंतु सामान्य पाठक के लिए सहज हैं। पादटिप्पणी-चिह्न संबंधित पदों के तुरंत बाद रखे गए हैं।
