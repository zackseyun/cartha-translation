source:
  edition: WLC
  text: וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֔ם כֹּ֖ה אָמַ֣ר יְהוָ֑ה אִם לֹ֤א תִשְׁמְעוּ֙ אֵלַ֔/י לָ/לֶ֨כֶת֙ בְּ/ת֣וֹרָתִ֔/י אֲשֶׁ֥ר נָתַ֖תִּי לִ/פְנֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/004.yaml
  text: 'And you shall say to them, ‘Thus says the LORD: If you do not listen to me, to walk in my law that I have set before you,’'
translation:
  language: hi
  text: 'और उनसे कहना, “यहोवा यह कहता है: यदि तुम मेरी बात न मानोगे और मेरी उस व्यवस्था के अनुसार न चलोगे, जो मैंने तुम्हारे सामने रखी है,”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: यहोवा यह कहता है
  rationale: सूत्रात्मक नबी-वाणी को स्वाभाविक आधुनिक हिन्दी में रखते हुए परमेश्वर के विशिष्ट नाम को ‘यहोवा’ के रूप में व्यक्त किया गया है।
- source_word: תִשְׁמְעוּ אֵלַי
  choice: मेरी नहीं सुनोगे
  rationale: שׁמע אל में केवल ध्वनि सुनना नहीं, बल्कि ध्यान देकर मानना भी निहित है; ‘मेरी सुनना’ हिन्दी में इस व्यापक अर्थ को स्वाभाविक रूप से सँभालता है।
- source_word: לָלֶכֶת בְּתוֹרָתִי
  choice: मेरी ... व्यवस्था पर नहीं चलोगे
  rationale: ‘चलना’ वाला मूल रूपक सुरक्षित रखा गया है; हिन्दी में ‘व्यवस्था पर चलना’ आज्ञापालन का सहज और स्पष्ट प्रयोग है।
- source_word: אֲשֶׁר נָתַתִּי לִפְנֵיכֶם
  choice: जिसे मैंने तुम्हारे सामने रखा है
  rationale: נתן לפני के ठोस बिंब को बनाए रखता है और बताता है कि व्यवस्था लोगों के मार्गदर्शन तथा चुनाव के लिए उनके सामने प्रस्तुत की गई है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में सामान्य उपाधि नहीं, वाचा का विशिष्ट नाम है; इसलिए नाम को प्रकट रूप में रखना स्रोत-भेद को सुरक्षित करता है।
- issue: ‘सुनना’ और ‘व्यवस्था पर चलना’ का संबंध
  choice: दो समन्वित नकारात्मक क्रियाएँ—‘मेरी नहीं सुनोगे और ... नहीं चलोगे’
  alternative: ‘मेरी बात सुनकर मेरी व्यवस्था पर चलना’ अथवा ‘मेरी नहीं सुनोगे, अर्थात् ...’
  rationale: इब्रानी रचना में infinitive ‘चलना’ सुनने की अपेक्षित दिशा/परिणाम बताता है, पर संबंध को केवल साधन या पूर्ण समानार्थकता मानना आवश्यक नहीं; हिन्दी में ‘और’ दोनों पहलुओं को स्पष्ट रखते हुए तनाव सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। बहुवचन ‘तुम’ संदर्भ के सामूहिक संबोधन को दर्शाता है। पद अगले वाक्यांश में जारी रहने के कारण अंत में अल्पविराम रखा गया है।
