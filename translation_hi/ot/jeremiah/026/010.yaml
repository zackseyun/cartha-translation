source:
  edition: WLC
  text: וַֽ/יִּשְׁמְע֣וּ שָׂרֵ֣י יְהוּדָ֗ה אֵ֚ת הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה וַ/יַּעֲל֥וּ מִ/בֵּית הַ/מֶּ֖לֶךְ בֵּ֣ית יְהוָ֑ה וַ/יֵּֽשְׁב֛וּ בְּ/פֶ֥תַח שַֽׁעַר יְהוָ֖ה הֶ/חָדָֽשׁ׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/010.yaml
  text: When the officials of Judah heard these words[c][b][a], they went up from the king’s house to the house of Yahweh and sat at the entrance of the New Gate of Yahweh.
translation:
  language: hi
  text: जब यहूदा के अधिकारियों[a] ने ये बातें सुनीं, तो वे राजमहल[b] से चढ़कर यहोवा के भवन में गए और यहोवा के भवन के नए फाटक[c] के प्रवेश-स्थान पर बैठ गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहूदा के प्रधान।” इब्रानी शब्द ऊँचे पद के शासकों या अधिकारियों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “राजा के भवन से।”
    reason: lexical_alternative
  - marker: c
    text: अर्थात मंदिर-परिसर का वह फाटक जो “नया फाटक” कहलाता था।
    reason: cultural_note
lexical_decisions:
- source_word: שָׂרֵי יְהוּדָה
  choice: यहूदा के अधिकारी
  rationale: שָׂרִים ऊँचे पद के शासकीय अधिकारियों या प्रधानों को दर्शाता है। आधुनिक हिन्दी में ‘अधिकारी’ स्पष्ट है और अनावश्यक रूप से वंशानुगत राजपद का संकेत नहीं देता।
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: ये बातें
  rationale: דְּבָרִים का अर्थ ‘वचन’, ‘बातें’ या ‘मामला’ हो सकता है। यहाँ यिर्मयाह के बोले हुए संदेश से जुड़ी बातों के लिए ‘ये बातें’ स्वाभाविक है और अर्थ की व्यापकता बनाए रखता है।
- source_word: וַיַּעֲלוּ
  choice: आए
  rationale: עלה का मूल भाव ऊपर जाने/आने का है। हिन्दी में राजमहल से मंदिर-परिसर की ओर गमन के लिए ‘आए’ सहज है; दिशा-सापेक्ष ‘चढ़कर’ जोड़ने से अनावश्यक भौगोलिक विशिष्टता उत्पन्न हो सकती है।
- source_word: מִבֵּית הַמֶּלֶךְ
  choice: राजमहल से
  rationale: शाब्दिक रूप ‘राजा के भवन से’ है, पर प्रसंग में राजा का आधिकारिक निवास अर्थात राजमहल अभिप्रेत है। ‘राजमहल’ आधुनिक हिन्दी में संक्षिप्त और स्पष्ट है; शाब्दिक रूप पादटिप्पणी में रखा गया है।
- source_word: בֵּית יְהוָה
  choice: यहोवा के भवन में
  rationale: ‘यहोवा का भवन’ मंदिर का औपचारिक पदनाम है और मूल के בית रूपक को ‘मंदिर’ की अपेक्षा अधिक सीधे सुरक्षित रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुरक्षरीय ईश-नाम को हिन्दी में परिचित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है, न कि ‘प्रभु’ जैसे पदनाम से, ताकि मूल में उपस्थित व्यक्तिगत नाम बना रहे।
- source_word: וַיֵּשְׁבוּ
  choice: बैठ गए
  rationale: ישׁב का सीधा अर्थ बैठना है। न्यायिक कार्य के लिए आसन ग्रहण करने का भाव प्रसंग से उभर सकता है, पर उसे मुख्य पाठ में स्पष्ट करके अर्थ को सीमित नहीं किया गया।
- source_word: בְּפֶתַח
  choice: प्रवेश-स्थान पर
  rationale: פֶּתַח किसी खुलने की जगह या प्रवेश को दर्शाता है। ‘प्रवेश-स्थान पर’ फाटक के संबंध में उनकी स्थिति को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: שַׁעַר יְהוָה הֶחָדָשׁ
  choice: यहोवा के भवन का नया फाटक
  rationale: इब्रानी विन्यास शाब्दिक रूप से ‘यहोवा का फाटक, नया वाला’ है। यहाँ संबंध मंदिर-परिसर से है; हिन्दी में ‘यहोवा के भवन का नया फाटक’ संभावित भ्रम से बचते हुए इस संबंध को स्पष्ट करता है।
theological_decisions:
- issue: ईश-नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। हिन्दी पाठकों के लिए स्थापित लिप्यंतरण ‘यहोवा’ उस नाम को पदनाम से बदले बिना सुरक्षित रखता है।
- issue: अधिकारियों के बैठने का न्यायिक आशय
  choice: बैठ गए
  alternative: न्याय करने के लिए बैठ गए / अपने आसनों पर बैठ गए
  rationale: संदर्भ न्यायिक सभा का संकेत दे सकता है, पर इस पद में उद्देश्य स्पष्ट रूप से नहीं कहा गया। इसलिए मूल की संक्षिप्तता और संभावित अर्थ-तनाव बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप अपनाया गया है। वाक्य की कथात्मक गति बनाए रखी गई है। ‘यहोवा के भवन’ मूल के औपचारिक मंदिर-पदनाम को सुरक्षित रखता है; ‘बैठ गए’ संभावित न्यायिक आशय को बिना अनावश्यक विस्तार के खुला रखता है।
