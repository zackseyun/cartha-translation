  text: וַ/יֹּ֤אמֶר יִרְמְיָ֨הוּ֙ אֶל כָּל הַ/שָּׂרִ֔ים וְ/אֶל כָּל הָ/עָ֖ם לֵ/אמֹ֑ר יְהוָ֣ה שְׁלָחַ֗/נִי לְ/הִנָּבֵ֞א אֶל הַ/בַּ֤יִת הַ/זֶּה֙ וְ/אֶל הָ/עִ֣יר הַ/זֹּ֔את אֵ֥ת כָּל הַ/דְּבָרִ֖ים אֲשֶׁ֥ר שְׁמַעְתֶּֽם־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/012.yaml
  text: Then Yirmeyahu said to all the officials and to all the people, saying, “The LORD sent me to prophesy against this house and against this city all the words that you have heard.”
translation:
  language: hi
  text: तब यिर्मयाह ने सभी अधिकारियों और सारी प्रजा से कहा, “यहोवा ने मुझे इस भवन और इस नगर के विरुद्ध वे सारी बातें भविष्यद्वाणी के रूप में कहने के लिए भेजा है, जिन्हें तुमने सुना है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשָּׂרִים
  choice: अधिकारियों
  rationale: यह पद यहाँ शासकीय अगुओं या पदाधिकारियों को सूचित करता है; आधुनिक हिन्दी में ‘अधिकारी’ स्पष्ट और स्वाभाविक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत नाम को उपाधि में बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण से रखा गया है।
- source_word: לְהִנָּבֵא אֶל
  choice: के विरुद्ध ... नबूवत के रूप में सुनाऊँ
  rationale: אֶל सामान्यतः ‘की ओर/से’ हो सकता है, पर इस न्याय-संदेश के संदर्भ में लक्ष्य के प्रति प्रतिकूल आशय है; ‘के विरुद्ध’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַבַּיִת הַזֶּה
  choice: इस भवन
  rationale: संदर्भ में यह यहोवा के मंदिर को सूचित करता है; मूल की संक्षिप्त अभिव्यक्ति बनाए रखने के लिए ‘भवन’ चुना गया है।
- source_word: כָּל הַדְּבָרִים
  choice: वे सभी वचन
  rationale: דברים यहाँ बोले गए संदेश या वचनों के अर्थ में है; ‘वचन’ भविष्यद्वाणी के संदर्भ में उपयुक्त है।
theological_decisions:
- issue: भविष्यद्वाणी के संदेश का स्रोत
  choice: “यहोवा ने मुझे भेजा है”
  alternative: “मुझे यहोवा ने भेजा है”
  rationale: दोनों सम्भव हैं; चुना हुआ क्रम प्राकृतिक हिन्दी है और यिर्मयाह के दैवी प्रेषण के दावे को स्पष्ट रखता है।
- issue: मंदिर और नगर की ओर/विरुद्ध नबूवत
  choice: “इस भवन और इस नगर के विरुद्ध”
  alternative: “इस भवन और इस नगर के विषय में”
  rationale: निकटवर्ती प्रसंग में संदेश न्याय और विनाश की चेतावनी है, इसलिए ‘विरुद्ध’ संदर्भगत बल को सुरक्षित रखता है, बिना संदेश की सामग्री बढ़ाए।
translation_notes:
  register: आधुनिक मानक हिन्दी; सार्वजनिक कथन के अनुरूप गरिमापूर्ण, स्पष्ट और सहज शैली। हिब्रू के לֵאמֹר को अलग से ‘यह कहते हुए’ दोहराने के बजाय हिन्दी के स्वाभाविक ‘से कहा’ में समाहित किया गया है।
