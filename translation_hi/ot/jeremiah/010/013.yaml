source:
  edition: WLC
  text: לְ/ק֨וֹל תִּתּ֜/וֹ הֲמ֥וֹן מַ֨יִם֙ בַּ/שָּׁמַ֔יִם וַ/יַּעֲלֶ֥ה נְשִׂאִ֖ים מִ/קְצֵ֣ה ארץ בְּרָקִ֤ים לַ/מָּטָר֙ עָשָׂ֔ה וַ/יּ֥וֹצֵא ר֖וּחַ מֵ/אֹצְרֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/013.yaml
  text: At the sound of his voice[a], there is a roar of waters in the heavens, and he makes clouds rise from the ends of the earth; he makes lightning for the rain[b], and brings out the wind from his storehouses.
translation:
  language: hi
  text: जब उसकी आवाज़ सुनाई देती है[a], तब आकाश में जलराशि का कोलाहल होता है; वह पृथ्वी के छोरों से बादलों[b] को उठाता है। वह वर्षा के लिए बिजली बनाता है और अपने भंडारों से हवा निकालता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसकी आवाज़ देने की ध्वनि पर”; इब्रानी पदबंध संक्षिप्त है।
    reason: lexical_alternative
  - marker: b
    text: या “वाष्प” अथवा “कुहरे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְקוֹל תִּתּוֹ
  choice: जब वह अपनी आवाज़ सुनाता है
  rationale: इब्रानी पदबंध शाब्दिक रूप से ‘उसके अपनी आवाज़ देने की ध्वनि पर’ जैसा संक्षिप्त है। हिन्दी में ‘अपनी आवाज़ सुनाता है’ उस दैवी वाणी और तूफ़ानी ध्वनि, दोनों की छवि को स्वाभाविक ढंग से बनाए रखता है।
- source_word: הֲמוֹן מַיִם
  choice: जलराशि गरज उठती है
  rationale: הֲמוֹן शोर, कोलाहल या बहुतायत व्यक्त कर सकता है। तूफ़ान के प्रसंग और קוֹל के श्रवण-बिंब के कारण ‘गरज उठती है’ प्रमुख अर्थ को स्पष्ट करता है, जबकि ‘जलराशि’ पानी की बहुतायत भी व्यक्त करती है।
- source_word: בַּשָּׁמַיִם
  choice: आकाश में
  rationale: यहाँ मौसम संबंधी दृश्य में שָׁמַיִם का स्वाभाविक हिन्दी अर्थ ‘आकाश’ है; इससे अनावश्यक रूप से परलोक का संकेत नहीं जुड़ता।
- source_word: נְשִׂאִים
  choice: बादलों
  rationale: मौसम संबंधी इस प्रसंग में यह शब्द बादलों अथवा उठती वाष्प के समूहों को सूचित करता है। आधुनिक हिन्दी में ‘बादल’ सबसे स्पष्ट और स्वाभाविक है।
- source_word: מִקְצֵה ארץ
  choice: पृथ्वी के छोर से
  rationale: यह दूरस्थ सीमा का इब्रानी मुहावरा है। ‘पृथ्वी के छोर’ इसकी विश्वव्यापी और काव्यात्मक व्यापकता बनाए रखता है।
- source_word: בְּרָקִים לַמָּטָר עָשָׂה
  choice: वर्षा के लिए बिजली उत्पन्न करता है
  rationale: अनुवाद ל संबंध को ‘के लिए’ से सुरक्षित रखता है और עשה को सहज हिन्दी ‘उत्पन्न करता है’ से व्यक्त करता है। ‘बिजली’ हिन्दी में स्वाभाविक सामूहिक संज्ञा है।
- source_word: וַיּוֹצֵא רוּחַ
  choice: हवा निकालता है
  rationale: इस मौसम संबंधी संदर्भ में רוּחַ का अर्थ ‘हवा’ है। ‘निकालता है’ भंडारों से बाहर लाने की मूल गति और परमेश्वर की सक्रिय भूमिका दोनों बनाए रखता है।
- source_word: מֵאֹצְרֹתָיו
  choice: अपने भंडारों से
  rationale: אֹצָר संग्रह-स्थान या भंडार है। प्राकृतिक शक्तियों को परमेश्वर के भंडारों में रखे होने का बाइबलीय चित्र ‘भंडारों’ से स्पष्ट रहता है।
theological_decisions:
- issue: तूफ़ान के वर्णन में परमेश्वर की व्यक्तिगत सक्रियता
  choice: ‘वह अपनी आवाज़ सुनाता है’, ‘उठाता है’, ‘उत्पन्न करता है’ और ‘निकालता है’ जैसे व्यक्तिगत कर्तृत्व को बनाए रखा गया है।
  alternative: वर्षा, बादल, बिजली और हवा को केवल निर्वैयक्तिक प्राकृतिक प्रक्रियाओं के रूप में वर्णित करना।
  rationale: इब्रानी पाठ मौसम की इन घटनाओं को सीधे परमेश्वर के शासन और कार्य से जोड़ता है। अनुवाद इस दावे को न तो कम करता है, न उससे आगे कोई संप्रदायगत व्याख्या जोड़ता है।
translation_notes:
  register: भाषा आधुनिक, सुबोध और गरिमापूर्ण रखी गई है। छोटे समानांतर वाक्य इब्रानी काव्यात्मक लय तथा परमेश्वर के लगातार सक्रिय कर्तृत्व को उभारते हैं। ‘आकाश’, ‘जलराशि’, ‘पृथ्वी के छोर’ और ‘भंडार’ सामान्य पाठक के लिए स्पष्ट रहते हुए भी पद की ऊँची शैली बनाए रखते हैं।
