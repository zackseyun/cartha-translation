id: JER.10.21
reference: Jeremiah 10:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֤י נִבְעֲרוּ֙ הָֽ/רֹעִ֔ים וְ/אֶת יְהוָ֖ה לֹ֣א דָרָ֑שׁוּ עַל כֵּן֙ לֹ֣א הִשְׂכִּ֔ילוּ וְ/כָל מַרְעִיתָ֖/ם נָפֽוֹצָה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/021.yaml
  text: For the shepherds have become stupid[a], and they have not sought Yahweh; therefore they have not acted wisely[c][b], and all their flock is scattered.
translation:
  language: hi
  text: क्योंकि चरवाहे[b] निर्बुद्धि हो गए हैं[a] और उन्होंने यहोवा की खोज नहीं की; इसलिए उन्होंने बुद्धिमानी से काम नहीं किया[c], और उनका सारा झुंड तितर-बितर हो गया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पशुवत् मूर्ख हो गए हैं’ अथवा ‘विवेकहीन हो गए हैं।’
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘चरवाहे’ संभवतः प्रजा के अगुओं या शासकों के लिए प्रयुक्त रूपक है।
    reason: cultural_note
  - marker: c
    text: या ‘सफल नहीं हुए।’ इब्रानी क्रिया में बुद्धिमानी से काम करने और उसके फलस्वरूप सफल होने, दोनों का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבְעֲרוּ
  choice: निर्बुद्धि हो गए हैं
  rationale: בער के निफ़अल रूप में पशुवत् मूढ़ता या विवेकहीनता का कड़ा भाव है। ‘निर्बुद्धि’ भविष्यद्वक्ता की फटकार को स्पष्ट और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הָרֹעִים
  choice: चरवाहे
  rationale: मूल रूपक को बनाए रखा गया है। यिर्मयाह में यह शब्द प्रायः प्रजा के शासकों या अगुओं के लिए रूपक है; इसकी व्याख्या पादटिप्पणी में दी गई है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में वाचा का व्यक्तिगत ईश्वरीय नाम है; हिन्दी में परिचित लिप्यंतरण ‘यहोवा’ रखा गया है।
- source_word: דָרָשׁוּ
  choice: खोज नहीं की
  rationale: דרש यहाँ परमेश्वर से मार्गदर्शन चाहने, उसकी ओर मुड़ने और उससे पूछने—इन जुड़े हुए भावों को समेटता है; ‘खोज करना’ इन्हें व्यापक रूप से सुरक्षित रखता है।
- source_word: עַל־כֵּן
  choice: इसलिए
  rationale: यह कारण और उसके परिणाम के बीच स्पष्ट निष्कर्षसूचक संबंध व्यक्त करता है।
- source_word: הִשְׂכִּילוּ
  choice: बुद्धिमानी से काम नहीं किया
  rationale: שכל के हिफ़इल में समझ-बूझ से आचरण करने और फलस्वरूप सफल होने, दोनों का अर्थ-सामर्थ्य है। मुख्य पाठ में स्वाभाविक हिन्दी हेतु बुद्धिमत्तापूर्ण आचरण चुना गया है और सफलता का संभव भाव पादटिप्पणी में सुरक्षित है।
- source_word: מַרְעִיתָם
  choice: उनका सारा झुंड
  rationale: चरवाहों के संदर्भ में सामूहिक संज्ञा उनकी देखभाल में सौंपी गई भेड़ों या प्रजा को दर्शाती है; ‘झुंड’ चरवाही का रूपक बनाए रखता है।
- source_word: נָפוֹצָה
  choice: तितर-बितर हो गया है
  rationale: פוץ बिखर जाने या तितर-बितर होने को बताता है। एकवचन क्रिया सामूहिक ‘झुंड’ के अनुरूप है और पूर्ण हुई अवस्था के वर्तमान परिणाम को व्यक्त करती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: यह पद सामान्य उपाधि नहीं, चार अक्षरों वाला व्यक्तिगत वाचा-नाम प्रयोग करता है। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला रूप है और नाम को उपाधि में नहीं बदलता।
- issue: ‘चरवाहों’ की पहचान
  choice: रूपक को मुख्य पाठ में बनाए रखना
  alternative: अगुए; शासक
  rationale: संदर्भ में यह प्रजा के अगुओं की ओर संकेत करता है, पर मूल का चरवाही-रूपक उनके उत्तरदायित्व और झुंड के बिखरने के बीच संबंध बनाता है; इसलिए अर्थ को पादटिप्पणी में स्पष्ट किया गया है।
- issue: הִשְׂכִּילוּ में बुद्धि और सफलता का संबंध
  choice: मुख्य पाठ में ‘बुद्धिमानी से काम नहीं किया’
  alternative: सफल नहीं हुए
  rationale: इब्रानी क्रिया समझ-बूझ से आचरण और उससे मिलने वाली सफलता, दोनों को व्यक्त कर सकती है। किसी एक धर्मवैचारिक निष्कर्ष को थोपने के बजाय मुख्य अर्थ पाठ में और दूसरा संभव अर्थ पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है। वाक्य में भविष्यद्वक्ता की तीखी फटकार बनी रहती है, पर अनावश्यक रूप से बोलचाल या अपमानजनक शब्दावली से बचा गया है। ‘चरवाहे–झुंड’ रूपक और कारण-परिणाम की संरचना को स्पष्ट रखा गया है।
