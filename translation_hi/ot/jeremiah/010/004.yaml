  edition: WLC
  text: בְּ/כֶ֥סֶף וּ/בְ/זָהָ֖ב יְיַפֵּ֑/הוּ בְּ/מַסְמְר֧וֹת וּ/בְ/מַקָּב֛וֹת יְחַזְּק֖וּ/ם וְ/ל֥וֹא יָפִֽיק׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/004.yaml
  text: They decorate it with silver and with gold[b][a]; they fasten it with nails and with hammers so that it will not totter.
translation:
  language: hi
  text: वे उसे चाँदी और सोने से सजाते हैं; वे कीलों और हथौड़ों से उसे[a] मज़बूती से जड़ देते हैं, ताकि वह डगमगाए नहीं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'मसोराई इब्रानी पाठ में यहाँ कर्म-प्रत्यय बहुवचन है: “उन्हें मज़बूत करते हैं।” उसका ठीक संदर्भ स्पष्ट नहीं है; प्रसंग एकवचन मूर्ति की ओर संकेत करता है।'
    reason: textual_grammatical_ambiguity
  - marker: b
    text: या “ताकि वह हिले नहीं” अथवा “ताकि वह न डोले।”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכֶסֶף וּבְזָהָב
  choice: चाँदी और सोने से
  rationale: दोनों ב उपसर्ग यहाँ साधन अथवा सामग्री बताते हैं। यह रूप दोनों बहुमूल्य धातुओं के समानांतर उल्लेख को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יְיַפֵּהוּ
  choice: उसे ... सजाते हैं
  rationale: יפה के पिएल रूप का अर्थ सुंदर बनाना या अलंकृत करना है। ‘सजाते हैं’ आधुनिक हिन्दी में सहज है और एकवचन वस्तु-सर्वनाम को बनाए रखता है।
- source_word: בְּמַסְמְרוֹת וּבְמַקָּבוֹת
  choice: कीलों और हथौड़ों से
  rationale: ये शब्द बाँधने या स्थिर करने वाली कीलों और उन्हें ठोकने के हथौड़ों को सूचित करते हैं।
- source_word: יְחַזְּקוּם
  choice: उसे मज़बूती से जड़ देते हैं
  rationale: חזק का पिएल यहाँ किसी वस्तु को दृढ़ या स्थिर करने का भाव देता है। निकट प्रसंग में मूर्ति एकवचन है, इसलिए मुख्य पाठ में ‘उसे’ स्वाभाविक है; किंतु मसोराई पाठ का प्रत्यय बहुवचन है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וְלֹא יָפִיק
  choice: ताकि वह डगमगाए नहीं
  rationale: शाब्दिक संयोजन ‘और नहीं’ है, पर प्रसंग में यह जड़ने का उद्देश्य या परिणाम व्यक्त करता है। יפיק यहाँ अस्थिर होकर हिलने या डगमगाने का भाव देता है।
theological_decisions:
- issue: मानव-निर्मित मूर्ति पर व्यंग्य
  choice: मूर्ति को सजाई और भौतिक रूप से स्थिर की जाने वाली असहाय वस्तु के रूप में दिखाया गया है।
  alternative: मूर्ति-निर्माण की प्रक्रिया का अधिक तटस्थ वर्णन।
  rationale: यिर्मयाह 10:3-5 का प्रसंग मनुष्य द्वारा बनाई गई मूर्तियों की निर्जीवता और असमर्थता पर व्यंग्य करता है। अनुवाद इस प्रभाव को बनाए रखता है, पर पाठ से आगे कोई सिद्धान्त नहीं जोड़ता।
- issue: יְחַזְּקוּם के बहुवचन प्रत्यय का संदर्भ
  choice: प्रसंग के अनुसार मुख्य पाठ में एकवचन ‘उसे’, और मसोराई रूप का बहुवचन पादटिप्पणी में।
  alternative: मुख्य पाठ में ‘उन्हें मज़बूत करते हैं’, जिससे प्रत्यय का व्याकरणिक बहुवचन सीधे बना रहे।
  rationale: पूर्ववर्ती प्रत्यक्ष कर्म और बाद की क्रिया का कर्ता मूर्ति के लिए एकवचन है, जबकि इस क्रिया का प्रत्यय बहुवचन है। अर्थ को स्पष्ट रखते हुए वास्तविक पाठगत तनाव को पादटिप्पणी में खुला रखा गया है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘मज़बूती से जड़ देते हैं’ कारीगरी के दृश्य और व्यंग्य, दोनों को सहज हिन्दी में व्यक्त करता है।
