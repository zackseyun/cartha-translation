id: JER.10.18
reference: Jeremiah 10:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּֽי כֹה֙ אָמַ֣ר יְהוָ֔ה הִנְ/נִ֥י קוֹלֵ֛עַ אֶת יוֹשְׁבֵ֥י הָ/אָ֖רֶץ בַּ/פַּ֣עַם הַ/זֹּ֑את וַ/הֲצֵר֥וֹתִי לָ/הֶ֖ם לְמַ֥עַן יִמְצָֽאוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/018.yaml
  text: 'For thus says Yahweh: Behold[a], I am slinging out the inhabitants of the land at this time[c][b], and I will press them hard so that they may be found.'
translation:
  language: hi
  text: 'क्योंकि याहवे यह कहता है: “देखो, इस बार मैं गोफन से[a] इस देश[b] के निवासियों को बाहर फेंक रहा हूँ। मैं उन्हें संकट में डालूँगा, ताकि वे पाएँ।”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उछालकर फेंक रहा हूँ” अथवा “वेग से बाहर फेंक रहा हूँ”; इब्रानी क्रिया गोफन चलाने का चित्र प्रस्तुत करती है।
    reason: lexical_alternative
  - marker: b
    text: या “धरती”; यहाँ प्रयुक्त इब्रानी शब्द का अर्थ प्रसंग के अनुसार “देश” या अधिक व्यापक रूप में “धरती” हो सकता है।
    reason: alternative_reading
  - marker: c
    text: 'अंतिम उपवाक्य कठिन है। अन्य संभावित अर्थ हैं: “ताकि वे इसका अनुभव करें” या “ताकि वे अपने को फँसा हुआ पाएँ।”'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को सामान्य उपाधि से बदलने के बजाय उसका प्रचलित ध्वन्यात्मक रूप रखा गया है।
- source_word: הִנְנִי
  choice: देखो, ... मैं ... रहा हूँ
  rationale: यह रूप वक्ता की ओर ध्यान खींचते हुए आसन्न कार्य पर बल देता है; हिन्दी की वर्तमान प्रगतिशील रचना उस नबी-संबंधी तात्कालिकता को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: קוֹלֵעַ
  choice: गोफन से ... बाहर फेंक रहा हूँ
  rationale: क्रिया में गोफन चलाने और वेग से उछालकर फेंकने का सजीव बिंब है; केवल ‘निकालना’ इस बलपूर्ण चित्र को सपाट कर देता।
- source_word: יוֹשְׁבֵי הָאָרֶץ
  choice: इस देश के निवासी
  rationale: निकटवर्ती प्रसंग यहूदा के लोगों पर आने वाले न्याय से संबंधित है, इसलिए यहाँ הָאָרֶץ का संदर्भगत अर्थ ‘देश’ है; व्यापक अर्थ ‘धरती’ पादटिप्पणी में रखा गया है।
- source_word: בַּפַּעַם הַזֹּאת
  choice: इस बार
  rationale: यह न्याय के वर्तमान, निर्णायक अवसर को सूचित करता है और आधुनिक हिन्दी में संक्षिप्त तथा स्वाभाविक है।
- source_word: וַהֲצֵרוֹתִי לָהֶם
  choice: मैं उन्हें घोर संकट में डालूँगा
  rationale: हिफ़ील रूप किसी को संकुचित, दबावपूर्ण दशा या संकट में डालने का भाव देता है। यह चयन कठिनाई की तीव्रता बनाए रखता है, पर अनिवार्यतः सैनिक घेराबंदी नहीं जोड़ता।
- source_word: לְמַעַן יִמְצָאוּ
  choice: ताकि वे पाए जाएँ
  rationale: मूल उपवाक्य अत्यंत संक्षिप्त और कठिन है तथा कोई स्पष्ट कर्म नहीं देता। यह रूप ‘पाना/पाया जाना’ के मूल शब्दार्थ को बनाए रखते हुए अर्थ को ‘महसूस करना’ या ‘फँस जाना’ के रूप में चुपचाप निश्चित नहीं करता।
theological_decisions:
- issue: הָאָרֶץ का दायरा
  choice: देश
  alternative: धरती
  rationale: यिर्मयाह के निकटवर्ती प्रसंग में यहूदा के निवासियों पर न्याय प्रमुख है। ‘देश’ उस संदर्भ को दर्शाता है और पद को अनावश्यक रूप से विश्वव्यापी न्याय की घोषणा नहीं बनाता।
- issue: לְמַעַן יִמְצָאוּ की अस्पष्टता
  choice: ताकि वे पाए जाएँ
  alternative: ताकि वे इसे अनुभव करें; ताकि वे अपने को फँसा हुआ पाएँ
  rationale: इब्रानी में कर्म नहीं दिया गया और वाक्यांश का आशय विवादित है। मुख्य पाठ जानबूझकर इस तनाव को खुला रखता है, जबकि अधिक व्याख्यात्मक संभावनाएँ पादटिप्पणी में दी गई हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य रखी गई है। ‘गोफन’ मूल के सजीव रूपक को बचाता है; ‘घोर संकट में डालूँगा’ दबाव और पीड़ा दोनों का भाव देता है। अंतिम उपवाक्य की असामान्यता मूल इब्रानी की वास्तविक अस्पष्टता के कारण जानबूझकर बनाए रखी गई है और पादटिप्पणी उसे स्पष्ट करती है।
