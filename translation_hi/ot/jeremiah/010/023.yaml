base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/023.yaml
  text: I know[a], O Yahweh, that a man's way is not his own[b]; it is not for a man who walks to direct his steps.
translation:
  language: hi
  text: हे याहवे, मैं जानता हूँ कि मनुष्य का मार्ग उसके अपने वश में नहीं है[a]; न ही चलने वाले मनुष्य के वश में है कि वह अपने कदमों को दिशा दे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक शाब्दिक रूप में, “मनुष्य का मार्ग मनुष्य में नहीं है।”
    reason: lexical_alternative
  - marker: b
    text: या “अपने कदमों को स्थिर करे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדַעְתִּי
  choice: मैं जानता हूँ
  rationale: क़ाल पूर्ण 1 एकवचन यहाँ वक्ता की स्थिर पहचान या स्वीकारोक्ति व्यक्त करता है; हिन्दी वर्तमान काल इस भाव को स्वाभाविक रूप से रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण द्वारा रखा गया है।
- source_word: לָאָדָם
  choice: मनुष्य
  rationale: אָדָם यहाँ सामान्य रूप से मानव को दर्शाता है और समानांतर אִישׁ के अनुरूप है।
- source_word: דַּרְכּוֹ
  choice: मनुष्य का मार्ग
  rationale: דֶּרֶךְ जीवन की दिशा या जीवन-क्रम को सूचित करता है; ‘मार्ग’ इस रूपक को संक्षिप्त और गरिमापूर्ण ढंग से बनाए रखता है।
- source_word: לֹא לָאָדָם דַּרְכּוֹ
  choice: मनुष्य का मार्ग उसके अपने वश में नहीं है
  rationale: इब्रानी वाक्यांश संक्षिप्त और अंडाकार है, लगभग ‘मनुष्य के लिए उसका मार्ग नहीं’; ‘अपने वश में नहीं’ स्वतंत्र नियंत्रण के अभाव का अर्थ स्पष्ट करता है, पर पूर्ण नियतिवाद नहीं जोड़ता।
- source_word: לְאִישׁ הֹלֵךְ
  choice: चलते हुए मनुष्य
  rationale: यह रूप सहभागी הֹלֵךְ की गतिशीलता को बनाए रखता है और जीवन-यात्रा के रूपक से मेल खाता है।
- source_word: וְהָכִין
  choice: दिशा देना
  rationale: כון के हिफ़ील रूप का अर्थ स्थापित करना, स्थिर करना या निर्देशित करना हो सकता है; ‘कदमों’ के साथ ‘दिशा देना’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: אֶת צַעֲדוֹ
  choice: अपने कदमों को
  rationale: एकवचन सामूहिक संज्ञा צַעַד को हिन्दी में मुहावरेदार बहुवचन ‘कदमों’ से व्यक्त किया गया है।
theological_decisions:
- issue: मानवीय क्रियाशीलता और परमेश्वर की प्रभुता
  choice: पद कहता है कि मनुष्य को अपने जीवन-मार्ग पर अंतिम और स्वायत्त नियंत्रण प्राप्त नहीं है।
  alternative: इसे ऐसा पूर्ण नियतिवादी कथन समझा जा सकता है जिसमें मानवीय चुनाव की कोई भूमिका नहीं रहती।
  rationale: इब्रानी पाठ मनुष्य की सीमा और निर्भरता को स्पष्ट करता है, लेकिन यहाँ स्वयं यह नहीं बताता कि हर कदम किस प्रकार निर्धारित होता है; इसलिए अनिर्णीत धर्मवैज्ञानिक तनाव बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘हे यहोवा’ प्रार्थनात्मक संबोधन बनाए रखता है। समानांतर पंक्तियों में ‘मार्ग’ और ‘कदम’ का मूल रूपक सुरक्षित है।
