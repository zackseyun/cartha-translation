id: JER.10.11
reference: Jeremiah 10:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ/דְנָה֙ תֵּאמְר֣וּן לְ/ה֔וֹם אֱלָ֣הַיָּ֔/א דִּֽי שְׁמַיָּ֥/א וְ/אַרְקָ֖/א לָ֣א עֲבַ֑דוּ יֵאבַ֧דוּ מֵֽ/אַרְעָ֛/א וּ/מִן תְּח֥וֹת שְׁמַיָּ֖/א אֵֽלֶּה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/011.yaml
  text: 'Thus you shall say to them: “The gods that did not make the heavens and the earth will perish from the earth and from under these heavens.”[a][b]'
translation:
  language: hi
  text: 'तुम उनसे इस प्रकार कहना: “जिन देवताओं ने आकाश और पृथ्वी को नहीं बनाया, वे पृथ्वी पर से और इन आकाशों के नीचे से मिट जाएँगे।”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “नष्ट हो जाएँगे” अथवा “लुप्त हो जाएँगे।” अरामी क्रिया नाश होने या मिट जाने का भाव दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: “देवताओं” से मूर्तियाँ, कथित दैवी सत्ताएँ, या दोनों अभिप्रेत हो सकते हैं; मूल पाठ इस विवादात्मक संकेत को व्यापक रखता है।
    reason: alternative_reading
lexical_decisions:
- source_word: כִּדְנָה
  choice: इस प्रकार
  rationale: यह अरामी संकेतवाचक क्रियाविशेषण आगे कहे जाने वाले कथन का ढंग बताता है; ‘इस प्रकार’ स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: תֵּאמְרוּן
  choice: तुम ... कहना
  rationale: द्वितीय पुरुष बहुवचन अपूर्ण रूप यहाँ प्रत्यक्ष निर्देश देता है। हिन्दी में ‘तुम ... कहना’ इस आदेशात्मक भाव को सहज रूप से व्यक्त करता है।
- source_word: לְהוֹם
  choice: उनसे
  rationale: पूर्वसर्ग और तृतीय पुरुष बहुवचन सर्वनाम का स्वाभाविक हिन्दी रूप।
- source_word: אֱלָהַיָּא
  choice: देवताओं
  rationale: अरामी का निश्चित बहुवचन है। ‘देवता’ मूर्तियों, कथित दैवी सत्ताओं या दोनों के व्यापक विवादात्मक संकेत को खुला रखता है।
- source_word: שְׁמַיָּא וְאַרְקָא
  choice: आकाश और पृथ्वी
  rationale: यह सृष्टि की समग्रता बताने वाला प्रचलित युग्म है। हिन्दी में ‘आकाश’ रूपगत बहुवचन को यांत्रिक ढंग से दोहराए बिना अरामी शब्द का सामान्य अर्थ देता है।
- source_word: לָא עֲבַדוּ
  choice: नहीं बनाया
  rationale: नकारयुक्त सिद्ध रूप उन देवताओं के सृष्टिकर्ता न होने को सीधे व्यक्त करता है; ‘बनाया’ सामान्य और स्पष्ट है।
- source_word: יֵאבַדוּ
  choice: मिट जाएँगे
  rationale: אבד का यह रूप नष्ट होने, लुप्त होने या मिट जाने का अर्थ दे सकता है। ‘मिट जाएँगे’ अकर्मक भाव तथा उनके अस्तित्व समाप्त होने की विडंबना बनाए रखता है।
- source_word: מֵאַרְעָא
  choice: पृथ्वी पर से
  rationale: पहले आए सृष्टि-वाचक युग्म के कारण यहाँ ‘देश’ के बजाय ‘पृथ्वी’ उचित है; ‘पर से’ हट जाने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וּמִן תְּחוֹת שְׁמַיָּא אֵלֶּה
  choice: और इन आकाशों के नीचे से
  rationale: ‘नीचे से’ תְּחוֹת और מִן दोनों को व्यक्त करता है, जबकि ‘इन’ पाठ में उपस्थित संकेतवाचक אֵלֶּה को सुरक्षित रखता है। यहाँ ‘आकाशों’ बहुवचन रखने से मूल की ठोस, संकेतित अभिव्यक्ति बनी रहती है।
theological_decisions:
- issue: देवताओं पर न्याय का आशय
  choice: उन देवताओं के मिट जाने की घोषणा, जिन्होंने आकाश और पृथ्वी को नहीं बनाया
  alternative: इसे केवल भौतिक मूर्तियों के विनाश का लाक्षणिक कथन मानना
  rationale: अरामी पाठ ‘देवताओं’ कहकर उनके सृष्टिकर्ता न होने को उनके अंत से जोड़ता है। अनुवाद यह तय नहीं करता कि संकेत केवल मूर्तियों की ओर है, कथित दैवी सत्ताओं की ओर, या दोनों की ओर।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘इन आकाशों’ सामान्य हिन्दी में कुछ असामान्य है, पर मूल के बहुवचन और संकेतवाचक शब्द को जानबूझकर सुरक्षित रखता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
