source:
  edition: WLC
  text: שְׁפֹ֣ךְ חֲמָתְ/ךָ֗ עַל הַ/גּוֹיִם֙ אֲשֶׁ֣ר לֹֽא יְדָע֔וּ/ךָ וְ/עַל֙ מִשְׁפָּח֔וֹת אֲשֶׁ֥ר בְּ/שִׁמְ/ךָ֖ לֹ֣א קָרָ֑אוּ כִּֽי אָכְל֣וּ אֶֽת יַעֲקֹ֗ב וַ/אֲכָלֻ֨/הוּ֙ וַ/יְכַלֻּ֔/הוּ וְ/אֶת נָוֵ֖/הוּ הֵשַֽׁמּוּ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/025.yaml
  text: Pour out your wrath on the nations that do not know you[a], and on the clans that do not call on your name; for they have devoured Jacob, they have devoured him and consumed him, and they have laid waste his habitation.
translation:
  language: hi
  text: अपना प्रकोप उन राष्ट्रों पर उंडेल दे जो तुझे नहीं जानते, और उन कुलों पर जो तेरे नाम का आह्वान नहीं करते; क्योंकि उन्होंने याकूब को निगल लिया है, उसे निगल लिया है और समाप्त कर दिया है, और उसके निवास-स्थान[a] को उजाड़ दिया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “चरागाह।”
    reason: नָוֵהוּ का अर्थ ‘निवास-स्थान’ के साथ-साथ ‘चरागाह’ भी हो सकता है; प्रसंग में पहला अर्थ मुख्य पाठ में लिया गया है, पर वैध शब्दार्थ-विकल्प सुरक्षित रखा गया है।
lexical_decisions:
- source_word: שְׁפֹךְ חֲמָתְךָ
  choice: अपना प्रकोप ... उंडेल दे
  rationale: आज्ञार्थक प्रार्थना और उंडेलने के रूपक दोनों को स्वाभाविक, गरिमापूर्ण हिन्दी में सुरक्षित रखता है; ‘प्रकोप’ חֵמָה की तीव्रता व्यक्त करता है।
- source_word: הַגּוֹיִם
  choice: राष्ट्रों
  rationale: यहाँ विदेशी जन-राजनीतिक समूह अभिप्रेत हैं; ‘राष्ट्र’ बाद के तकनीकी धार्मिक अर्थ को आरोपित नहीं करता।
- source_word: אֲשֶׁר לֹא יְדָעוּךָ
  choice: जो तुझे नहीं जानते
  rationale: परमेश्वर के विषय में संबंधपरक ज्ञान अथवा स्वीकार—दोनों संभावनाओं को बिना अधिक व्याख्या किए बनाए रखता है।
- source_word: מִשְׁפָּחוֹת
  choice: कुलों
  rationale: राष्ट्रों के समानांतर वंश अथवा नातेदारी पर आधारित समूहों का बोध कराता है और घरेलू ‘परिवारों’ से अधिक उपयुक्त है।
- source_word: בְּשִׁמְךָ לֹא קָרָאוּ
  choice: जो तेरा नाम लेकर तुझे नहीं पुकारते
  rationale: קרא בשם के आराधनात्मक आह्वान को स्पष्ट हिन्दी में व्यक्त करता है; केवल नाम उच्चारित करने का अर्थ नहीं देता।
- source_word: אָכְלוּ אֶת יַעֲקֹב וַאֲכָלֻהוּ וַיְכַלֻּהוּ
  choice: उन्होंने याकूब को निगल लिया है; उन्होंने उसे निगलकर समाप्त कर दिया है
  rationale: शत्रुओं द्वारा हिंसक विनाश का रूपक, दोहराव और כלה से आने वाली पूर्ण समाप्ति की तीव्रता को सुरक्षित रखता है।
- source_word: נָוֵהוּ
  choice: उसके निवास-स्थान
  rationale: नָוֶה का अर्थ चरागाह, बसेरा या निवास हो सकता है; इस प्रसंग में याकूब के उजाड़े गए बसेरे/देश के लिए ‘निवास-स्थान’ सबसे सहज है, जबकि शब्द की चरागाह-संबंधी छवि निश्चित नहीं है।
- source_word: הֵשַׁמּוּ
  choice: उजाड़ दिया है
  rationale: हिफ़ील रूप के ‘निर्जन/वीरान कर देना’ अर्थ को संक्षिप्त और प्रचलित हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: विदेशी लोगों पर दैवी प्रकोप की प्रार्थना
  choice: प्रकोप उंडेलने की सीधी विनती को बिना नरम किए रखा गया
  alternative: इसे केवल न्याय की भविष्यवाणी या सामान्य अप्रसन्नता के रूप में कहना
  rationale: इब्रानी पाठ परमेश्वर से शत्रु राष्ट्रों और कुलों पर दंड लाने की स्पष्ट प्रार्थना करता है; इसकी नैतिक और धर्मवैचारिक गंभीरता को अनुवाद में बनाए रखना आवश्यक है।
- issue: ‘तुझे नहीं जानते’ का आशय
  choice: प्रत्यक्ष ‘नहीं जानते’ रखा गया
  alternative: ‘तुझे स्वीकार नहीं करते’ या ‘तेरी आराधना नहीं करते’
  rationale: יָדַע संबंधपरक पहचान और स्वीकार दोनों का संकेत दे सकता है; अधिक स्पष्ट व्याख्या मूल की अर्थ-व्याप्ति को अनावश्यक रूप से सीमित करती।
translation_notes:
  register: आधुनिक मानक हिन्दी, प्रार्थनात्मक और गरिमापूर्ण शैली। परमेश्वर को एकवचन आत्मीय संबोधन ‘तू’ के रूपों से संबोधित किया गया है। इब्रानी के हिंसक रूपक और दोहराव को यथासंभव रखा गया है, पर हिन्दी में कृत्रिम तीनहरा दोहराव टालने के लिए दूसरे और तीसरे क्रियापद को संयुक्त किया गया है। दिए गए अंग्रेज़ी पाठ में [a] का स्थान और उसकी पादटिप्पणी परस्पर असंगत हैं; मूल इब्रानी में इस पद पर कोई ऐसी पाठगत सूचना आवश्यक नहीं, इसलिए हिन्दी मुख्य पाठ में कोई पादटिप्पणी-चिह्न नहीं जोड़ा गया।
