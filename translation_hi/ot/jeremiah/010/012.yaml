  text: עֹשֵׂ֥ה אֶ֨רֶץ֙ בְּ/כֹח֔/וֹ מֵכִ֥ין תֵּבֵ֖ל בְּ/חָכְמָת֑/וֹ וּ/בִ/תְבוּנָת֖/וֹ נָטָ֥ה שָׁמָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/012.yaml
  text: He made the earth by his power[a]; he established the world by his wisdom[b], and by his understanding he stretched out the heavens.
translation:
  language: hi
  text: वही है जो अपनी सामर्थ्य से पृथ्वी बनाता है, अपनी बुद्धि से जगत को स्थिर करता है, और अपनी समझ से आकाश को तानता है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में आरंभ के दो क्रियापद कृदंत हैं, जिन्हें “पृथ्वी बनानेवाला” और “जगत को स्थिर करनेवाला” भी अनुवाद किया जा सकता है; अंतिम क्रियापद का शाब्दिक रूप भूतकालिक है, “आकाश को तान दिया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֵׂה
  choice: रचयिता है
  rationale: हिब्रू कृदंत का कर्तावाचक और वर्तमान-जैसा बल बनाए रखता है; आगे के पूर्ण क्रियापदों के कारण इसे केवल भूतकाल में बदलना आवश्यक नहीं है।
- source_word: אֶרֶץ
  choice: पृथ्वी
  rationale: आकाश के साथ विश्व-सृष्टि के संदर्भ में 'भूमि' की अपेक्षा 'पृथ्वी' उपयुक्त है।
- source_word: בְּכֹחוֹ
  choice: अपनी सामर्थ्य से
  rationale: בְּ का साधनवाचक अर्थ 'से' द्वारा स्वाभाविक रूप में व्यक्त होता है; सामर्थ्य सृजनकारी शक्ति को दर्शाता है।
- source_word: מֵכִין
  choice: स्थिर किया
  rationale: हिफ़ील रूप स्थापित करने या दृढ़ करने का भाव देता है; सृष्टि में व्यवस्था और स्थायित्व की छवि सुरक्षित रहती है।
- source_word: תֵּבֵל
  choice: जगत
  rationale: यह शब्द प्रायः व्यवस्थित अथवा आबाद संसार को सूचित करता है; हिन्दी काव्यात्मक गद्य में 'जगत' संक्षिप्त और स्वाभाविक है।
- source_word: בְּחָכְמָתוֹ
  choice: अपनी बुद्धि से
  rationale: साधनवाचक अर्थ और सृष्टि में दिव्य प्रज्ञा का भाव दोनों स्पष्ट रहते हैं।
- source_word: וּבִתְבוּנָתוֹ
  choice: और अपनी समझ से
  rationale: תְּבוּנָה को 'बुद्धि' से अलग रखते हुए बोध और सूझ का निकट, सहज हिन्दी अर्थ देता है।
- source_word: נָטָה
  choice: तान दिया
  rationale: आकाश को फैलाने की ठोस स्थानिक छवि को स्वाभाविक और संक्षिप्त हिन्दी में सुरक्षित रखता है।
- source_word: שָׁמַיִם
  choice: आकाश
  rationale: हिब्रू का रूप बहुवचन है, पर आधुनिक हिन्दी में विश्व-सृष्टि के संदर्भ में सामूहिक एकवचन 'आकाश' अधिक स्वाभाविक है और अर्थ को अनावश्यक रूप से सीमित नहीं करता।
theological_decisions:
- issue: इस पद में दिव्य कर्ता का नाम स्पष्ट रूप से नहीं दिया गया है
  choice: '''वही'' द्वारा पिछले संदर्भ के दिव्य कर्ता को जारी रखना'
  alternative: '''परमेश्वर'' या ''यहोवा'' जोड़ना'
  rationale: हिब्रू पद की शुरुआत बिना किसी व्यक्त संज्ञा के कृदंत से होती है। 'वही' संदर्भ-संबंध स्पष्ट करता है, पर ऐसा नाम या उपाधि नहीं जोड़ता जो इस उपवाक्य में नहीं है।
- issue: आरंभिक कृदंत का काल और रूप
  choice: कर्तावाचक वर्तमान-जैसा रूप 'रचयिता है'
  alternative: भूतकालिक क्रिया 'उसने पृथ्वी बनाई'
  rationale: עֹשֵׂה की वास्तविक कृदंतीय अस्पष्टता और परमेश्वर के सृष्टिकर्ता होने के वर्णनात्मक बल को सुरक्षित रखा गया है; पाद-टिप्पणी भूतकालिक विकल्प बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। समानांतर काव्यात्मक संरचना में 'सामर्थ्य—बुद्धि—समझ' और 'पृथ्वी—जगत—आकाश' की गति सुरक्षित है।
