lexical_decisions:
- source_word: אִסְפִּי
  choice: समेट ले
  rationale: स्त्रीलिंग एकवचन आज्ञार्थक रूप को स्वाभाविक हिन्दी में व्यक्त करता है और प्रस्थान से पहले सामान इकट्ठा करने का भाव बनाए रखता है।
- source_word: מֵאֶרֶץ
  choice: देश से
  rationale: אֶרֶץ का मूल अर्थ ‘देश/भूमि’ है। यहाँ ‘देश से’ निकटवर्ती निष्कासन के संदर्भ में स्वाभाविक है, यद्यपि ‘भूमि पर से’ भी संभव है।
- source_word: כִּנְעָתֵךְ
  choice: अपनी गठरी
  rationale: दुर्लभ संज्ञा सामान, माल या बँधी हुई सामग्री का बोध करा सकती है। ‘गठरी’ स्त्रीलिंग संबोधित व्यक्ति के उस सामान की सजीव छवि देती है जिसे प्रस्थान के लिए समेटना है।
- source_word: ישבתי
  choice: हे ... रहनेवाली
  rationale: व्यंजन-पाठ के कठिन रूप को संदर्भानुसार स्त्रीलिंग संबोधन, ‘निवासिनी/रहनेवाली’, के रूप में प्रस्तुत किया गया है; ‘रहनेवाली’ आधुनिक पाठक के लिए अधिक सहज है।
- source_word: בַּמָּצוֹר
  choice: घेराबंदी में
  rationale: מָצוֹר यहाँ सैन्य घेराबंदी या घिरी हुई दशा को सूचित करता है। यह अनुवाद उस स्थिति को स्पष्ट रखते हुए मूल के संक्षिप्त रूप के निकट है।
