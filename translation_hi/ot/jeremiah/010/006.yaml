source:
  edition: WLC
  text: מֵ/אֵ֥ין כָּמ֖וֹ/ךָ יְהוָ֑ה גָּד֥וֹל אַתָּ֛ה וְ/גָד֥וֹל שִׁמְ/ךָ֖ בִּ/גְבוּרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/006.yaml
  text: There is none like you[a], O Yahweh; you are great, and your name is great in might.
translation:
  language: hi
  text: हे याहवे[a], आपके समान कोई नहीं है। आप महान हैं, और आपका नाम सामर्थ्य में महान है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: YHWH, परमेश्वर का व्यक्तिगत नाम; इसे परंपरागत रूप से “यहोवा” या “प्रभु” भी लिखा गया है।'
    reason: ईश्वरीय नाम के मूल रूप और प्रचलित वैकल्पिक प्रस्तुतियों की जानकारी।
lexical_decisions:
- source_word: מֵאֵין כָּמוֹךָ
  choice: आपके समान कोई नहीं है
  rationale: यह इब्रानी तुलना-वाचक मुहावरे का स्वाभाविक हिन्दी रूप है और किसी भी तुलनीय सत्ता के न होने की बात स्पष्ट करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में प्रयुक्त परमेश्वर के व्यक्तिगत नाम YHWH को उपाधि से बदलने के बजाय हिन्दी में निकट ध्वन्यात्मक रूप से प्रस्तुत किया गया है।
- source_word: גָּדוֹל אַתָּה
  choice: आप महान हैं
  rationale: विधेय विशेषण के सीधे कथन को आधुनिक, सम्मानपूर्ण हिन्दी में रखा गया है।
- source_word: וְגָדוֹל שִׁמְךָ
  choice: और आपका नाम ... महान है
  rationale: मूल की समानांतर रचना और ‘नाम’ शब्द को बनाए रखा गया है; यहाँ नाम में यश और प्रतिष्ठा का भाव भी निहित हो सकता है।
- source_word: בִּגְבוּרָה
  choice: सामर्थ्य में
  rationale: यह रूप בְּ के क्षेत्र, गुण या अभिव्यक्ति-संबंधी अर्थ को खुला रखता है और मूल की संक्षिप्त काव्यात्मक अभिव्यक्ति को सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पद में चार-अक्षरीय ईश्वरीय नाम सीधे आया है। उसे व्यक्तिगत नाम के रूप में रखना मूल पाठ के अधिक निकट है; पादटिप्पणी पाठकों को पारंपरिक रूपों से परिचित कराती है।
- issue: ‘नाम’ और ‘सामर्थ्य’ का संबंध
  choice: आपका नाम सामर्थ्य में महान है
  alternative: आपके सामर्थ्य के कारण आपका नाम महान है; सामर्थी कार्यों से आपका नाम महान है
  rationale: इब्रानी בִּגְבוּרָה संबंध को संक्षेप में व्यक्त करता है। मुख्य पाठ कारण या साधन को निश्चित किए बिना मूल की अर्थगत व्यापकता बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सम्मानपूर्ण और गरिमामय संबोधन अपनाया गया है। वाक्य सरल रखा गया है, जबकि मूल की समानांतर काव्यात्मक संरचना और ‘सामर्थ्य में’ की अर्थगत खुली प्रकृति सुरक्षित है।
