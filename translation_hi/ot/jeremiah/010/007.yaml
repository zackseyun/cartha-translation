    issue: “जाति-जाति के राजा” for מֶלֶךְ הַגּוֹיִם
    rationale: The Hebrew means “King of the nations.” In modern standard Hindi, “जाति-जाति” is stylistically awkward and may shift the sense toward discrete ethnic/caste-like groups. “जातियों के राजा” is both natural and semantically direct.
  - severity: low
    issue: The referent of “यही आपके योग्य है” is underexpressed.
    rationale: The Hebrew idiom states that fearing God is fitting/due to him. Hindi can state this explicitly as “आपका भय मानना ही उचित है,” clarifying the implied subject while retaining the source sense.
  revised_text: हे जातियों के राजा, कौन आपसे न डरेगा?[a] क्योंकि आपका भय मानना ही उचित है; क्योंकि जातियों के सभी बुद्धिमानों में और उनके सभी राज्यों में आपके समान कोई नहीं है।
