source:
  edition: WLC
  text: מִ֣י לֹ֤א יִֽרָאֲ/ךָ֙ מֶ֣לֶךְ הַ/גּוֹיִ֔ם כִּ֥י לְ/ךָ֖ יָאָ֑תָה כִּ֣י בְ/כָל חַכְמֵ֧י הַ/גּוֹיִ֛ם וּ/בְ/כָל מַלְכוּתָ֖/ם מֵ/אֵ֥ין כָּמֽוֹ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/007.yaml
  text: Who would not fear you[a], O King of the nations? For this is your due; for among all the wise men of the nations and in all their kingdoms[b], there is none like you.
translation:
  language: hi
  text: हे जातियों के राजा, कौन आपसे न डरेगा?[a] क्योंकि आपका भय मानना ही उचित है; क्योंकि जातियों के सभी बुद्धिमानों में और उनके सभी राज्यों में आपके समान कोई नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कौन आपसे न डरे?” इब्रानी अलंकारिक प्रश्न यह व्यक्त कर सकता है कि कौन नहीं डरेगा अथवा किसे डरना उचित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרָאֲךָ
  choice: आपसे न डरेगा
  rationale: 'מִי לֹא के साथ अपूर्ण क्रिया यहाँ अलंकारिक प्रश्न बनाती है: ‘कौन न डरेगा?’ ‘डरना’ मूल क्रिया ירא की प्रबलता को बनाए रखता है और परमेश्वर के प्रति भय तथा श्रद्धामय विस्मय, दोनों की संभावना खुली रखता है।'
- source_word: מֶלֶךְ הַגּוֹיִם
  choice: जाति-जाति के राजा
  rationale: यह संबोधन परमेश्वर के सार्वभौमिक राजत्व को व्यक्त करता है। हिन्दी में ‘जाति-जाति’ גּוֹיִם की बहुवचन व्यापकता को सहज और बाइबिलीय ढंग से व्यक्त करता है।
- source_word: יָאָתָה
  choice: यही आपके योग्य है
  rationale: क्रिया का अर्थ उचित, शोभनीय या किसी का हक होना है। संदर्भ में ‘यही’ पूर्ववर्ती भय को इंगित करता है और हिन्दी में स्वाभाविक रूप से बताता है कि ऐसा भय परमेश्वर के लिए उचित है।
- source_word: חַכְמֵי הַגּוֹיִם
  choice: जातियों के सब बुद्धिमानों
  rationale: חַכְמֵי बुद्धिमान व्यक्तियों अथवा ज्ञानियों को दर्शाता है। ‘बुद्धिमानों’ अर्थ को स्पष्ट रखते हुए अनावश्यक पद-विस्तार से बचता है।
- source_word: מַלְכוּתָם
  choice: उनके सभी राज्यों
  rationale: מַלְכוּתָם का सामान्य अर्थ ‘उनके राज्य/राज्यसत्ताएँ’ है। बहुवचन संदर्भ में ‘उनके सभी राज्यों’ स्पष्ट और स्वाभाविक है।
- source_word: מֵאֵין כָּמוֹךָ
  choice: आपके समान कोई नहीं है
  rationale: यह अतुलनीयता का इब्रानी मुहावरा है; हिन्दी वाक्य मूल दावे को सीधे और स्वाभाविक रूप में सुरक्षित रखता है।
- source_word: כִּי ... כִּי
  choice: क्योंकि ... क्योंकि
  rationale: 'दोनों कारणसूचक उपवाक्यों को समान रूप से प्रस्तुत करने से तर्कक्रम बना रहता है: पहले परमेश्वर का भय उचित होने की बात, फिर उनकी अतुलनीयता उसका आधार है।'
theological_decisions:
- issue: जातियों पर परमेश्वर का राजत्व
  choice: जाति-जाति के राजा
  alternative: जातियों के ऊपर राजा
  rationale: मूल पाठ सीधे परमेश्वर को מֶלֶךְ הַגּוֹיִם कहकर संबोधित करता है। चुना हुआ पाठ सार्वभौमिक राजत्व को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
- issue: परमेश्वर से डरने का अर्थ
  choice: आपसे न डरेगा
  alternative: आपका भय न मानेगा / आपका आदर न करेगा
  rationale: ‘डरना’ ירא की मूल प्रबलता और भय तथा श्रद्धामय विस्मय के बीच निहित धार्मिक तनाव को बनाए रखता है; इसे केवल ‘आदर’ कहना अर्थ को संकुचित कर देता।
- issue: परमेश्वर के भय की उपयुक्तता
  choice: यही आपके योग्य है
  alternative: यह आपका अधिकार है
  rationale: יָאָתָה उपयुक्तता और देयता दोनों का भाव दे सकती है। ‘योग्य’ इस बहुअर्थता को पर्याप्त रूप से बनाए रखता है और भय को केवल कानूनी अधिकार के रूप में सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण प्रत्यक्ष संबोधन के लिए ‘हे’ और आदरसूचक ‘आप’ रखा गया है। ‘जाति-जाति’ सामान्य पाठक के लिए बोधगम्य रहते हुए גּוֹיִם की व्यापकता व्यक्त करता है। वाक्य-संरचना मूल के दो כִּי उपवाक्यों और अलंकारिक प्रश्न को सुरक्षित रखती है।
