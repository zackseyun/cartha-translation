  to: हे जातियों के राजा, कौन आपसे न डरेगा?[a] क्योंकि आपका भय मानना ही उचित है; क्योंकि जातियों के सभी बुद्धिमानों में और उनके सभी राज्यों में आपके समान कोई नहीं है।
