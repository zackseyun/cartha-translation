  terminology: ‘राष्ट्रों,’ ‘आकाश के चिन्हों,’ and ‘भयभीत’ are suitable source-near terms. The neutral ‘चिन्ह’ properly avoids deciding whether the referent is specifically omens. No footnote is required because the Hindi wording adequately preserves the source’s ambiguity.
