id: JER.10.2
reference: Jeremiah 10:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה אֶל דֶּ֤רֶךְ הַ/גּוֹיִם֙ אַל תִּלְמָ֔דוּ וּ/מֵ/אֹת֥וֹת הַ/שָּׁמַ֖יִם אַל תֵּחָ֑תּוּ כִּֽי יֵחַ֥תּוּ הַ/גּוֹיִ֖ם מֵ/הֵֽמָּה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/002.yaml
  text: 'Thus says Yahweh: Do not learn the way of the nations[a], and do not be dismayed at the signs of the heavens, because the nations are dismayed at them.'
translation:
  language: hi
  text: 'याहवे यों कहता है: “राष्ट्रों की रीति मत सीखो, और आकाश के चिन्हों से भयभीत मत हो, क्योंकि राष्ट्र उनसे भयभीत होते हैं।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के विशिष्ट वाचा-नाम को उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में सुरक्षित रखा गया है।
- source_word: כֹּה אָמַר
  choice: यों कहता है
  rationale: यह भविष्यद्वाणी का प्रचलित सूत्र है; हिन्दी में स्वाभाविक रहते हुए उसका औपचारिक स्वर बनाए रखता है।
- source_word: דֶּרֶךְ הַגּוֹיִם
  choice: राष्ट्रों की चाल
  rationale: דֶּרֶךְ यहाँ शाब्दिक मार्ग नहीं, बल्कि आचरण, रीति या जीवन-पद्धति को दर्शाता है; ‘चाल’ संक्षेप में इस अर्थ को व्यक्त करता है।
- source_word: אַל תִּלְמָדוּ
  choice: मत सीखो
  rationale: मूल क्रिया ‘सीखना’ है; प्रसंग में अपनाने या अनुकरण करने का भाव निहित है, पर उसे व्याख्यात्मक रूप से पाठ में नहीं जोड़ा गया।
- source_word: מֵאֹתוֹת הַשָּׁמַיִם
  choice: आकाश के चिन्हों से
  rationale: אוֹתוֹת को ‘चिन्हों’ और הַשָּׁמַיִם को इस संदर्भ में सहज हिन्दी ‘आकाश’ से व्यक्त किया गया; उपसर्ग מִן का कारणसूचक भाव ‘से’ में सुरक्षित है।
- source_word: תֵּחָתּוּ / יֵחַתּוּ
  choice: भयभीत मत हो / भयभीत होते हैं
  rationale: חתת भय से टूटने, घबराने या आतंकित होने का भाव रखता है; ‘भयभीत’ आधुनिक, dignified हिन्दी में दोनों क्रियारूपों की पुनरावृत्ति भी सुरक्षित रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह निषेध का कारण प्रस्तुत करता है और आधुनिक हिन्दी में स्पष्ट कारणसूचक संयोजक है।
- source_word: מֵהֵמָּה
  choice: उनसे
  rationale: सर्वनाम का संकेत आकाश के चिन्हों की ओर है; ‘उनसे’ कारणसूचक संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: גּוֹיִם का अनुवाद
  choice: राष्ट्रों
  alternative: गैर-यहूदियों / जातियों
  rationale: यहाँ शब्द इस्राएल से बाहर के लोगों और उनकी धार्मिक-सांस्कृतिक रीति को व्यापक रूप से दर्शाता है। ‘राष्ट्रों’ बाद की धार्मिक शब्दावली आरोपित किए बिना मूल के निकट है।
- issue: יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल में विशिष्ट ईश्वरीय नाम है; उसका लिप्यंतरण नाम और उपाधि के बीच का भेद बनाए रखता है।
- issue: आकाशीय चिन्हों की प्रकृति
  choice: आकाश के चिन्हों
  alternative: आकाश के अपशकुनों
  rationale: मूल אוֹתוֹת ‘चिन्ह’ अथवा प्रसंगानुसार ‘शकुन’ हो सकता है। मुख्य पाठ में तटस्थ ‘चिन्ह’ रखकर यह अनिश्चितता सुरक्षित रखी गई है और ज्योतिषीय अर्थ को अनावश्यक रूप से निश्चित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर भविष्यद्वाणी के सूत्र में गरिमापूर्ण बाइबिलीय स्वर रखा गया है। समान इब्रानी क्रिया की पुनरावृत्ति के अनुरूप ‘भयभीत’ दोनों खंडों में दोहराया गया है। कोई पाद-टिप्पणी आवश्यक नहीं मानी गई, इसलिए मुख्य पाठ में पाद-टिप्पणी चिह्न नहीं है।
