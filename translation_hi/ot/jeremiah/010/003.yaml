  text: כִּֽי חֻקּ֥וֹת הָֽ/עַמִּ֖ים הֶ֣בֶל ה֑וּא כִּֽי עֵץ֙ מִ/יַּ֣עַר כְּרָת֔/וֹ מַעֲשֵׂ֥ה יְדֵ֥י חָרָ֖שׁ בַּֽ/מַּעֲצָֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/003.yaml
  text: For the customs of the peoples are vanity[a], for a tree is cut from the forest, the work of the hands of a craftsman with an axe.
translation:
  language: hi
  text: क्योंकि जातियों की प्रथाएँ व्यर्थ हैं, क्योंकि जंगल से काटा हुआ पेड़ कुल्हाड़ी[a] से बनी कारीगर के हाथों की कारीगरी है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बसूले’; इब्रानी शब्द लकड़ी काटने या उसे आकार देने वाले औज़ार को दर्शाता है, पर ठीक कौन-सा औज़ार अभिप्रेत है, यह निश्चित नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חֻקּוֹת
  choice: रीति-रिवाज़
  rationale: इस मूर्तिपूजा-विरोधी प्रसंग में शब्द औपचारिक विधानों से अधिक प्रचलित धार्मिक रीतियों और व्यवहारों को सूचित करता है।
- source_word: הָעַמִּים
  choice: देश-देश के लोग
  rationale: यह बहुवचन जातीय समुदायों को व्यक्त करता है और आधुनिक राजनीतिक राष्ट्र-राज्य का अनावश्यक अर्थ नहीं लाता।
- source_word: הֶבֶל
  choice: व्यर्थ
  rationale: मूल शब्द श्वास या वाष्प से विकसित होकर खोखलेपन, निष्फलता और मूल्यहीनता का भाव देता है; यहाँ ‘व्यर्थ’ स्वाभाविक रूप से इस अर्थ-क्षेत्र को व्यक्त करता है।
- source_word: עֵץ מִיַּעַר
  choice: जंगल से एक पेड़
  rationale: मूल की ठोस छवि को बनाए रखते हुए पेड़ को मनुष्य द्वारा बनाई जाने वाली वस्तु की सामग्री के रूप में प्रस्तुत करता है।
- source_word: כְּרָתוֹ
  choice: काटा जाता है
  rationale: मूल में कर्ता अनिर्दिष्ट है; हिंदी का कर्मवाच्य ध्यान पेड़ और उसके मानव-निर्मित रूप पर रखता है।
- source_word: מַעֲשֵׂה יְדֵי חָרָשׁ
  choice: कारीगर अपने हाथों से ... उसे गढ़ता है
  rationale: हिब्रू की संज्ञात्मक संरचना को स्वाभाविक हिंदी क्रिया-वाक्य में व्यक्त किया गया है, जबकि मानवीय निर्माण पर उसका बल सुरक्षित है।
- source_word: בַּמַּעֲצָד
  choice: कुल्हाड़ी के द्वारा
  rationale: यह लकड़ी काटने या आकार देने के औज़ार का स्पष्ट और सामान्य हिंदी नाम है; सटीक औज़ार अनिश्चित होने के कारण विकल्प पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: मूर्तिपूजक रीतियों की निस्सारता को बाद की धर्मवैज्ञानिक शब्दावली जोड़े बिना व्यक्त करना
  choice: देश-देश के लोगों के रीति-रिवाज़ व्यर्थ हैं
  alternative: जातियों की विधियाँ मूल्यहीन हैं
  rationale: चुना हुआ पाठ मूल की मूर्तिपूजा-विरोधी आलोचना और मानव-निर्मित वस्तु पर बल को बनाए रखता है, पर औपचारिक विधान या अतिरिक्त सैद्धांतिक निष्कर्ष नहीं जोड़ता।
- issue: मूल के संज्ञात्मक वाक्यांश को हिंदी में समझने योग्य बनाना
  choice: और कारीगर अपने हाथों से ... उसे गढ़ता है
  alternative: वह ... कारीगर के हाथों की कारीगरी है
  rationale: ‘गढ़ता है’ प्रसंग में निहित निर्माण-कर्म को स्पष्ट करता है और मूर्ति के मानव-निर्मित होने का आशय रखता है; इसे स्वतंत्र सृष्टि-संबंधी दावा नहीं बनाया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘रीति-रिवाज़’ सामान्य पाठक के लिए बोधगम्य है, जबकि ‘कारीगर’ और ‘गढ़ता है’ मानव-निर्माण की मूल छवि को स्पष्ट रखते हैं। पादटिप्पणी-चिह्न उसी अनिश्चित औज़ार के पास रखा गया है जिससे वह संबंधित है।
