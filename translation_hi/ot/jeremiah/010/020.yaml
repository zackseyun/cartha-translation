source:
  edition: WLC
  text: אָהֳלִ֣/י שֻׁדָּ֔ד וְ/כָל מֵיתָרַ֖/י נִתָּ֑קוּ בָּנַ֤/י יְצָאֻ֨/נִי֙ וְ/אֵינָ֔/ם אֵין נֹטֶ֥ה עוֹד֙ אָהֳלִ֔/י וּ/מֵקִ֖ים יְרִיעוֹתָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/020.yaml
  text: My tent is destroyed[a], and all my ropes are torn away. My sons have gone from me, and they are no more[d][c][b]. There is no one left to stretch out my tent again and set up my curtains.
translation:
  language: hi
  text: मेरा तंबू उजाड़ दिया गया है[a], और मेरी सारी रस्सियाँ[b] टूट गई हैं। मेरे बेटे मुझे छोड़कर चले गए हैं[c], और अब वे नहीं हैं[d]। मेरा तंबू फिर से तानने और मेरे तंबू के परदे लगाने वाला अब कोई नहीं है[e]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘लूट लिया गया है’ अथवा ‘तहस-नहस कर दिया गया है।’ इब्रानी क्रिया लूट और हिंसक विनाश, दोनों का भाव दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात तंबू को बाँधने वाली डोरियाँ।
    reason: cultural_note
  - marker: c
    text: ‘मेरे बेटे’ का अर्थ शाब्दिक संतान हो सकता है; मानवीकृत नगर या देश के संदर्भ में यह उसके लोगों या निवासियों की ओर भी संकेत कर सकता है।
    reason: cultural_note
  - marker: d
    text: यह वाक्यांश उनके अनुपस्थित होने या जीवित न रहने—दोनों का भाव दे सकता है; मूल पाठ इनमें से किसी एक को स्पष्ट नहीं करता।
    reason: ambiguity_note
  - marker: e
    text: या ‘अब मेरा तंबू तानने और मेरे तंबू के परदे खड़े करने वाला कोई नहीं है।’
    reason: lexical_alternative
lexical_decisions:
- source_word: אָהֳלִי
  choice: मेरा तंबू
  rationale: शाब्दिक तंबू की छवि को बनाए रखता है और आगे आने वाली रस्सियों तथा परदों के साथ स्वाभाविक रूप से जुड़ता है।
- source_word: שֻׁדָּד
  choice: उजाड़ दिया गया है
  rationale: निष्क्रिय रूप हिंसक विनाश या लूट से हुई बरबादी का बोध देता है; ‘उजाड़ दिया गया’ परिणाम और हिंसा, दोनों को व्यक्त करता है।
- source_word: מֵיתָרַי
  choice: मेरी रस्सियाँ
  rationale: यह तंबू को बाँधने वाली डोरियों या रस्सियों को दर्शाता है; आधुनिक हिन्दी में ‘रस्सियाँ’ अधिक सहज है।
- source_word: נִתָּקוּ
  choice: टूट गई हैं
  rationale: क्रिया अलग कर दिए जाने, उखड़ने या टूटने का भाव रखती है; तंबू की रस्सियों के संदर्भ में यह संक्षिप्त और स्वाभाविक है।
- source_word: בָּנַי
  choice: मेरे बेटे
  rationale: इब्रानी शब्द पुल्लिंग बहुवचन है। रूपक-संभावना को पादटिप्पणी में रखते हुए मूल का लिंग-सूचक रूप बनाए रखा गया है।
- source_word: יְצָאֻנִי
  choice: मुझे छोड़कर चले गए हैं
  rationale: यह वक्ता से दूर चले जाने को व्यक्त करता है; हिन्दी में यह वियोग के भाव को स्वाभाविक ढंग से प्रकट करता है।
- source_word: וְאֵינָם
  choice: और अब वे नहीं हैं
  rationale: मूल कथन अनुपस्थिति या अस्तित्व में न रहने—दोनों की संभावना खुली रखता है; अनुवाद जानबूझकर यह तनाव बनाए रखता है।
- source_word: אֵין נֹטֶה עוֹד אָהֳלִי
  choice: मेरा तंबू फिर से तानने वाला अब कोई नहीं है
  rationale: तंबू ‘तानना’ हिन्दी का स्वाभाविक प्रयोग है। ‘अब’ और ‘फिर से’ עוֹד के संदर्भगत भाव को व्यक्त करते हैं।
- source_word: יְרִיעוֹתַי
  choice: मेरे परदे
  rationale: यह तंबू के कपड़े या परदों को दर्शाता है; निकटवर्ती तंबू-संदर्भ अर्थ स्पष्ट करता है।
- source_word: וּמֵקִים
  choice: खड़े करने वाला
  rationale: सहभागी रूप किसी ऐसे व्यक्ति को दर्शाता है जो परदों को उठाकर स्थापित करे; ‘खड़े करना’ तंबू लगाने के संदर्भ में समझने योग्य है।
theological_decisions:
- issue: ‘मेरे बेटे’ का अभिप्राय
  choice: मुख्य पाठ में शाब्दिक ‘मेरे बेटे’ रखा गया
  alternative: ‘मेरे लोग’ या ‘मेरे निवासी’
  rationale: वक्ता संभवतः यरूशलेम/यहूदा का मानवीकरण है और ‘बेटे’ उसके निवासियों को सूचित कर सकते हैं, पर मूल का पारिवारिक रूपक हटाना उचित नहीं होगा।
- issue: ‘अब वे नहीं हैं’ में अनुपस्थिति या मृत्यु
  choice: अस्पष्ट अभिव्यक्ति बनाए रखी गई
  alternative: ‘वे मर गए हैं’ या ‘वे यहाँ नहीं हैं’
  rationale: इब्रानी वाक्यांश मृत्यु को अनिवार्य रूप से नहीं बताता; वह निर्वासन, बिछोह या विनाश के कारण अनुपस्थिति भी व्यक्त कर सकता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी अपनाई गई है। तंबू, रस्सियों और परदों की विस्तृत रूपक-छवि सुरक्षित रखी गई है। ‘अब वे नहीं हैं’ को कुछ असामान्य होते हुए भी मूल की अर्थगत अस्पष्टता बचाने के लिए रखा गया है।
