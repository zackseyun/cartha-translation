id: JER.10.8
reference: Jeremiah 10:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/בְ/אַחַ֖ת יִבְעֲר֣וּ וְ/יִכְסָ֑לוּ מוּסַ֥ר הֲבָלִ֖ים עֵ֥ץ הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/008.yaml
  text: But together they are stupid and foolish[b][a]; the instruction of idols is wood.
translation:
  language: hi
  text: परन्तु वे सब एक समान मूर्ख और निर्बुद्धि हैं[a]; मूर्तियों[b] की शिक्षा तो लकड़ी ही है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और वे एक होकर मूर्ख और निर्बुद्धि हैं”; आरम्भिक इब्रानी वाक्यांश मुहावरेदार है और उसका अर्थ “सब मिलकर,” “सब एक समान,” या “एक बात में” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “व्यर्थ वस्तुओं”; इस प्रसंग में यह मूर्तियों के लिए प्रयुक्त भविष्यद्वक्ताओं का एक सामान्य तिरस्कारपूर्ण शब्द है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְאַחַת
  choice: परन्तु वे सब एक समान
  rationale: यह कठिन मुहावरा सामूहिक समानता—‘सब एक समान’—का भाव दे सकता है। पिछले पद से विरोध दिखाने के लिए ‘परन्तु’ स्वाभाविक है; अन्य सम्भव अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: יִבְעֲרוּ
  choice: मूर्ख
  rationale: यहाँ בער का अर्थ ‘जलना’ नहीं, बल्कि ‘विवेकहीन/पशुवत् मूर्ख होना’ है। ‘मूर्ख’ सामान्य आधुनिक हिन्दी में स्पष्ट और प्रसंगानुकूल है।
- source_word: וְיִכְסָלוּ
  choice: और निर्बुद्धि
  rationale: כסל का अर्थ मूर्ख या विवेकहीन होना है। ‘निर्बुद्धि’ पहले पद के समानांतर रहते हुए अर्थ की पुनरुक्ति और तीव्रता बनाए रखता है।
- source_word: מוּסַר
  choice: शिक्षा
  rationale: מוּסָר शिक्षा, अनुशासन या सुधार का बोध करा सकता है। इस संक्षिप्त कथन में ‘शिक्षा’ सबसे व्यापक और स्वाभाविक विकल्प है।
- source_word: הֲבָלִים
  choice: मूर्तियों
  rationale: शाब्दिक अर्थ ‘व्यर्थ वस्तुएँ/वाष्प’ है, किन्तु भविष्यद्वक्ताओं की मूर्तिपूजा-विरोधी भाषा में यह प्रायः मूर्तियों के लिए प्रयुक्त होता है। स्पष्ट पाठ में ‘मूर्तियों’ रखा गया है और शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: עֵץ הוּא
  choice: तो लकड़ी ही है
  rationale: यह संक्षिप्त नाममात्र वाक्य मूर्ति की वास्तविक सामग्री पर व्यंग्यपूर्वक बल देता है। ‘लकड़ी ही है’ उसकी तीखी, तिरस्कारपूर्ण शक्ति को स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: मूर्तिपूजा-विरोधी प्रसंग में अंतिम खंड का सम्बन्ध और बल
  choice: मूर्तियों से मिलने वाली कथित शिक्षा अंततः केवल लकड़ी है।
  alternative: लकड़ी की मूर्ति स्वयं शिक्षक है; अथवा उनकी शिक्षा निर्जीव, ‘लकड़ी जैसी’ है।
  rationale: इब्रानी कथन संक्षिप्त और व्याकरणतः तनावपूर्ण है। यिर्मयाह 10:1–9 के प्रसंग में गढ़ी हुई लकड़ी की मूर्तियों का उपहास हो रहा है। अनुवाद उस व्यंग्य को रखता है, पर अधिक विकसित व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और तीखा भविष्यद्वक्ताई स्वर रखा गया है। ‘मूर्ख और निर्बुद्धि’ सामान्य पाठक के लिए स्पष्ट है; ‘लकड़ी ही है’ मूल की संक्षिप्त व्यंग्यात्मक चोट बनाए रखता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
