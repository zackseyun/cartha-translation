- source_word: יֹאבֵדוּ
  choice: नष्ट हो जाएँगे
  rationale: क्रिया के सामान्य अर्थ ‘नाश होना/मिट जाना’ को स्वाभाविक हिन्दी में व्यक्त करता है।
