  alternative: जब उनका लेखा लिया जाएगा / उनके निरीक्षण के समय
  rationale: פְּקֻדָּה का मूल अर्थ ध्यान देने, लेखा लेने या भेंट करने से दण्डात्मक कार्रवाई तक जा सकता है। मूर्तियों के नष्ट होने के इस न्याय-संदर्भ में ‘दण्ड’ उपयुक्त है, जबकि पाद-टिप्पणी मूल शब्द की व्यापकता बनाए रखती है।
