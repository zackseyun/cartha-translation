source:
  edition: WLC
  text: שִׁמְע֣וּ אֶת הַ/דָּבָ֗ר אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה עֲלֵי/כֶ֖ם בֵּ֥ית יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/001.yaml
  text: Hear the word that Yahweh has spoken concerning you[a], O house of Israel.
translation:
  language: hi
  text: हे इस्राएल के घराने, उस वचन को सुनो जो यहोवा[a] ने तुम्हारे विषय में कहा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ईश्वरीय नाम YHWH है, जिसे परंपरागत अंग्रेज़ी अनुवादों में अक्सर “the LORD” लिखा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: सुनो
  rationale: बहुवचन आज्ञार्थक रूप है। ‘सुनो’ भविष्यद्वाणी की गंभीर पुकार और ध्यान देकर ग्रहण करने, दोनों भावों को स्वाभाविक हिन्दी में रखता है।
- source_word: הַדָּבָר
  choice: वह वचन
  rationale: דבר यहाँ परमेश्वर के कथन या संदेश को सूचित करता है। ‘वचन’ प्रचलित भविष्यद्वाणी-संबंधी पद है; ‘वह’ आगे आने वाले संबंधवाचक उपवाक्य से इसे स्वाभाविक रूप से जोड़ता है।
- source_word: אֲשֶׁר דִּבֶּר
  choice: जो ... ने ... कहा है
  rationale: इब्रानी पूर्ण क्रिया को यहाँ वर्तमान से प्रासंगिक पूर्ण कथन के रूप में ‘कहा है’ कहना स्वाभाविक है। ‘जो’ संबंधवाचक उपवाक्य को स्पष्ट रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम YHWH है। आधुनिक हिन्दी बाइबल-प्रयोग में पहचाना जाने वाला रूप ‘यहोवा’ नाम को किसी उपाधि से बदले बिना प्रस्तुत करता है।
- source_word: עֲלֵיכֶם
  choice: तुम्हारे विषय में
  rationale: על यहाँ संबोधित लोगों के विषय में कही गई बात को व्यक्त कर सकता है। ‘तुम्हारे विषय में’ मूल की व्यापकता बनाए रखता है और समय से पहले ‘तुम्हारे विरुद्ध’ का न्यायसूचक अर्थ निश्चित नहीं करता।
- source_word: בֵּית יִשְׂרָאֵל
  choice: हे इस्राएल के घराने
  rationale: यह भविष्यद्वक्ताओं में प्रयुक्त सामूहिक संबोधन है। ‘घराना’ वाचा-समुदाय की सामूहिक पहचान बनाए रखता है और ‘हे’ संबोधन को स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: पद में चार-अक्षरीय ईश्वरीय नाम सीधे आया है। ‘यहोवा’ हिन्दी पाठकों में स्थापित नाम-रूप है और मूल के व्यक्तिगत नाम को ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: עֲלֵיכֶם में संभावित अनुकूल या प्रतिकूल भाव
  choice: तुम्हारे विषय में
  alternative: तुम्हारे विरुद्ध; तुमसे
  rationale: इस आरंभिक आह्वान में पूर्वसर्ग अपने आप प्रतिकूल अर्थ को अनिवार्य नहीं करता। इसलिए तटस्थ ‘विषय में’ मूल की अर्थगत खुली स्थिति को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। वाक्य में संबोधन पहले रखने से हिन्दी प्रवाह स्पष्ट होता है, जबकि मूल के सभी प्रमुख अर्थ-घटक सुरक्षित हैं।
