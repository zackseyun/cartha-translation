id: JER.10.5
reference: Jeremiah 10:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כְּ/תֹ֨מֶר מִקְשָׁ֥ה הֵ֨מָּה֙ וְ/לֹ֣א יְדַבֵּ֔רוּ נָשׂ֥וֹא יִנָּשׂ֖וּא כִּ֣י לֹ֣א יִצְעָ֑דוּ אַל תִּֽירְא֤וּ מֵ/הֶם֙ כִּי לֹ֣א יָרֵ֔עוּ וְ/גַם הֵיטֵ֖יב אֵ֥ין אוֹתָֽ/ם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/005.yaml
  text: They are like a scarecrow in a cucumber field[a], and they cannot speak; they must be carried, because they cannot walk. Do not fear them, for they cannot do harm[b], nor can they do good.
translation:
  language: hi
  text: वे खीरे की बाड़ी में खड़े बिजूके जैसे हैं[a] और बोल नहीं सकते। उन्हें उठाकर ले जाना पड़ता है, क्योंकि वे चल नहीं सकते। उनसे मत डरो, क्योंकि वे न तो हानि पहुँचा सकते हैं[b], न भलाई कर सकते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “खीरे-खरबूजे की बाड़ी में खड़े खंभे जैसे।” इब्रानी चित्र का ठीक अर्थ अनिश्चित है; बहुत-से लोग इसे सब्ज़ियों की बाड़ी में खड़े बिजूके या सीधे खंभे के रूप में समझते हैं।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से इसका अर्थ “वे बुरा नहीं कर सकते” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּתֹמֶר מִקְשָׁה
  choice: खीरे की बाड़ी में खड़े बिजूके जैसे
  rationale: यह इब्रानी पदबंध कठिन और कुछ हद तक अस्पष्ट है। תֹמֶר यहाँ किसी सीधे खड़े आकार, खंभे या बिजूके का बोध करा सकता है, और מִקְשָׁה खीरे अथवा खरबूजे की बाड़ी है। मूर्तियों की निर्जीवता के संदर्भ में ‘बिजूका’ स्वाभाविक और प्रभावी है; वैकल्पिक अर्थ पाद-टिप्पणी में रखा गया है।
- source_word: וְלֹא יְדַבֵּרוּ
  choice: और बोल नहीं सकते
  rationale: संदर्भ केवल उनके न बोलने का नहीं, बल्कि बोलने में उनकी असमर्थता का है।
- source_word: נָשׂוֹא יִנָּשׂוּא
  choice: उन्हें उठाकर ले जाना पड़ता है
  rationale: इनफिनिटिव एब्सोल्यूट और निष्क्रिय क्रिया का मेल इस आवश्यकता पर बल देता है कि मूर्तियों को दूसरों द्वारा ढोया जाना पड़ता है।
- source_word: כִּי לֹא יִצְעָדוּ
  choice: क्योंकि वे चल नहीं सकते
  rationale: צעד का अर्थ कदम बढ़ाना या चलना है; यहाँ मूर्तियों की गतिहीनता और निर्भरता मुख्य बात है।
- source_word: אַל תִּירְאוּ מֵהֶם
  choice: उनसे मत डरो
  rationale: यह निषेधात्मक आज्ञा का सीधा, स्वाभाविक और गरिमापूर्ण हिन्दी रूप है।
- source_word: כִּי לֹא יָרֵעוּ
  choice: क्योंकि वे न तो हानि पहुँचा सकते हैं
  rationale: רעע का हिफ़ील रूप यहाँ हानि करने या बुरा करने का भाव देता है। मूर्तियों की अक्षमता के संदर्भ में ‘हानि पहुँचा सकते’ अर्थ स्पष्ट करता है।
- source_word: וְגַם הֵיטֵיב אֵין אוֹתָם
  choice: न भलाई कर सकते हैं
  rationale: इब्रानी वाक्यांश उनके भीतर भलाई करने की सामर्थ्य न होने को व्यक्त करता है। हिन्दी में यह संक्षिप्त रूप स्वाभाविक है और पूर्ववर्ती ‘हानि’ के साथ संतुलित समानांतरता रखता है।
theological_decisions:
- issue: मूर्तियों की पूर्ण असमर्थता
  choice: बोलने, चलने, हानि करने और भलाई करने की अक्षमता को ‘नहीं सकते’ द्वारा व्यक्त किया गया है।
  alternative: 'निषेधों को केवल सामान्य क्रियाओं की तरह अनूदित करना: ‘वे नहीं बोलते… नहीं चलते… हानि नहीं करते।’'
  rationale: आसपास का प्रसंग मनुष्य-निर्मित मूर्तियों की निर्जीवता का उपहास करता है। क्षमता-सूचक हिन्दी मूल आशय को स्पष्ट करती है, बिना कोई अतिरिक्त सांप्रदायिक निष्कर्ष जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और मौखिक रूप से सहज पाठ। ‘बाड़ी’, ‘बिजूका’ और ‘उठाकर ले जाना पड़ता है’ सामान्य पाठक के लिए ठोस दृश्य प्रस्तुत करते हैं। कठिन इब्रानी उपमा की वास्तविक अनिश्चितता पाद-टिप्पणी में सुरक्षित रखी गई है।
