source:
  edition: WLC
  text: כֶּ֣סֶף מְרֻקָּ֞ע מִ/תַּרְשִׁ֣ישׁ יוּבָ֗א וְ/זָהָב֙ מֵֽ/אוּפָ֔ז מַעֲשֵׂ֥ה חָרָ֖שׁ וִ/ידֵ֣י צוֹרֵ֑ף תְּכֵ֤לֶת וְ/אַרְגָּמָן֙ לְבוּשָׁ֔/ם מַעֲשֵׂ֥ה חֲכָמִ֖ים כֻּלָּֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/009.yaml
  text: Beaten silver is brought from Tarshish[a], and gold from Uphaz, the work of a craftsman and of the hands of a goldsmith. Blue and purple are their clothing; all of them are the work of skilled men.
translation:
  language: hi
  text: पीटी हुई चाँदी तर्शीश से लाई जाती है, और सोना ऊफाज[a] से; यह कारीगर का काम, सुनार के हाथों की कारीगरी है। नीला और बैंगनी कपड़ा उनका पहनावा है; ये सब निपुण कारीगरों की कारीगरी हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ में ‘ऊफाज’ है; कुछ लोग इसे ‘ओपीर’ नाम का एक रूप समझते हैं।
    reason: मसोरेटी पाठ के स्थान-नाम को मुख्य पाठ में सुरक्षित रखते हुए उसकी संभावित वैकल्पिक पहचान बताना।
lexical_decisions:
- source_word: כֶּסֶף מְרֻקָּע
  choice: पीटकर चपटी की गई चाँदी
  rationale: כֶּסֶף यहाँ धन नहीं, धातु के रूप में चाँदी है; מְרֻקָּע ऐसी धातु को बताता है जिसे पीटकर पतली चादर के रूप में फैलाया गया हो। यह हिंदी में केवल ‘पीटी हुई’ से अधिक स्पष्ट है।
- source_word: מִתַּרְשִׁישׁ יוּבָא
  choice: तर्शीश से लाई जाती है
  rationale: स्थान-नाम को लिप्यंतरित किया गया है और होफाल क्रिया יוּבָא का कर्मवाच्य अर्थ ‘लाई जाती है’ रखा गया है।
- source_word: וְזָהָב מֵאוּפָז
  choice: और सोना ऊफाज से
  rationale: मसोरेटी पाठ के स्थान-नाम אוּפָז को मुख्य पाठ में ऊफाज के रूप में रखा गया है; ओपीर से इसकी संभावित पहचान को पादटिप्पणी में दिया गया है।
- source_word: מַעֲשֵׂה חָרָשׁ וִידֵי צוֹרֵף
  choice: कारीगर की कारीगरी और सुनार के हाथों का काम
  rationale: מַעֲשֵׂה निर्मित कारीगरी को, חָרָשׁ कुशल कारीगर को और צוֹרֵף इस प्रसंग में बहुमूल्य धातु पर काम करने वाले सुनार को दर्शाता है। ‘हाथों का काम’ मानवीय निर्माण पर मूल पाठ का बल बनाए रखता है।
- source_word: תְּכֵלֶת וְאַרְגָּמָן לְבוּשָׁם
  choice: नीला और बैंगनी कपड़ा उनका पहनावा है
  rationale: दोनों शब्द बहुमूल्य रंगे हुए वस्त्रों अथवा उनके रंगों को सूचित करते हैं। ‘कपड़ा’ जोड़ने से हिंदी में यह स्पष्ट होता है कि रंग उनके पहनावे के वस्त्रों का वर्णन करते हैं।
- source_word: מַעֲשֵׂה חֲכָמִים כֻּלָּם
  choice: वे सभी निपुण कारीगरों की कारीगरी हैं
  rationale: חֲכָמִים का अर्थ यहाँ नैतिक रूप से ‘बुद्धिमान’ नहीं, बल्कि अपने शिल्प में निपुण लोग है। ‘कारीगरों’ से शिल्प-संदर्भ और इब्रानी का पुल्लिंग बहुवचन, दोनों स्वाभाविक हिंदी में बने रहते हैं।
theological_decisions:
- issue: חֲכָמִים का लिंग और अर्थ
  choice: निपुण कारीगरों
  alternative: निपुण लोगों / बुद्धिमान पुरुषों
  rationale: प्रसंग शिल्प-कौशल का है, इसलिए ‘बुद्धिमान’ भ्रामक हो सकता है। ‘कारीगरों’ हिंदी में पुल्लिंग बहुवचन रूप बनाए रखता है और अनावश्यक रूप से ‘पुरुष’ जोड़कर मूल से अधिक स्पष्ट दावा नहीं करता।
- issue: मूर्तियों के मानवीय निर्माण पर बल
  choice: ‘कारीगर की कारीगरी’, ‘सुनार के हाथों का काम’ और ‘निपुण कारीगरों की कारीगरी’ को स्पष्ट रूप से बनाए रखा गया
  alternative: संक्षेप में ‘कुशलता से बनाई गई हैं’
  rationale: मूल पद बार-बार इस बात पर बल देता है कि ये वस्तुएँ मनुष्यों द्वारा बनाई गई हैं; संक्षिप्त वैकल्पिक अनुवाद इस साहित्यिक और धर्मवैचारिक बल को घटा देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘पीटकर चपटी की गई’ धातुकर्म की क्रिया समझाता है; ‘पहनावा’ और ‘कारीगरी’ साहित्यिक गरिमा रखते हुए प्रचलित शब्द हैं। पादटिप्पणी-चिह्न सही संबंधित नाम ‘ऊफाज’ के बाद रखा गया है।
