id: JER.10.16
reference: Jeremiah 10:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לֹֽא כְ/אֵ֜לֶּה חֵ֣לֶק יַעֲקֹ֗ב כִּֽי יוֹצֵ֤ר הַ/כֹּל֙ ה֔וּא וְ/יִ֨שְׂרָאֵ֔ל שֵׁ֖בֶט נַֽחֲלָת֑/וֹ יְהוָ֥ה צְבָא֖וֹת שְׁמֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/016.yaml
  text: Not like these is the Portion of Jacob[a], for he is the Former of all things, and Israel is the tribe of his inheritance[b]; Yahweh of hosts is his name.
translation:
  language: hi
  text: याकूब का भाग इनके समान नहीं है[a], क्योंकि वही सब कुछ रचनेवाला है, और इस्राएल उसकी विरासत का गोत्र है[b]; उसका नाम सेनाओं का याहवे है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: भाव यह है कि याकूब का परमेश्वर अभी वर्णित वस्तुओं, अर्थात मूर्तियों, के समान नहीं है। हिब्रू पदबंध का शाब्दिक अर्थ ‘याकूब का भाग’ या ‘याकूब का हिस्सा’ है।
    reason: lexical_alternative
  - marker: b
    text: या, “इस्राएल उसकी विरासत का राजदंड/छड़ी है।” हिब्रू शब्द का अर्थ ‘गोत्र’, ‘छड़ी’ या ‘राजदंड’ हो सकता है; यहाँ ‘गोत्र’ इस्राएल को याहवे की अपनी प्रजा बताने वाले अर्थ में सबसे उपयुक्त है।
    reason: alternative_reading
lexical_decisions:
- source_word: חֵלֶק יַעֲקֹב
  choice: याकूब का भाग
  rationale: חֵלֶק का मूल अर्थ ‘भाग’ या ‘हिस्सा’ है। प्रसंग में यह याकूब/इस्राएल के परमेश्वर को मूर्तियों के विपरीत उसके अपने भाग के रूप में प्रस्तुत करता है; हिन्दी में ‘याकूब का भाग’ इस संबंध को बिना अतिरिक्त व्याख्या जोड़े बनाए रखता है।
- source_word: כְאֵלֶּה
  choice: इनके समान
  rationale: संकेतवाचक पद पिछले प्रसंग में वर्णित वस्तुओं, अर्थात मूर्तियों, की ओर लौटता है। ‘इनके समान’ मूल की अंतर्निहित संदर्भात्मकता को बनाए रखता है और मुख्य पाठ में ‘मूर्तियाँ’ जोड़कर अर्थ को स्पष्ट नहीं करता।
- source_word: יוֹצֵר הַכֹּל
  choice: सब कुछ रचनेवाला
  rationale: יוֹצֵר में आकार देने या गढ़ने का भाव है। ‘रचनेवाला’ आधुनिक हिन्दी में स्वाभाविक है, सृष्टिकर्ता के सक्रिय कार्य को व्यक्त करता है और הַכֹּל की व्यापकता को ‘सब कुछ’ द्वारा सुरक्षित रखता है।
- source_word: שֵׁבֶט נַחֲלָתוֹ
  choice: उसकी विरासत का गोत्र
  rationale: שֵׁבֶט का अर्थ ‘गोत्र’, ‘छड़ी’ या ‘राजदंड’ हो सकता है। यहाँ इस्राएल व्यक्ति-समुदाय के रूप में याहवे की विरासत है, इसलिए ‘गोत्र’ प्रसंग में सर्वाधिक संगत है; दूसरी संभावनाएँ पादटिप्पणी में रखी गई हैं।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले व्यक्तिगत ईश्वरीय नाम को उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: צְבָאוֹת
  choice: सेनाओं का
  rationale: स्थिर ईश्वरीय उपाधि में यह बहुवचन सेनाओं या समूहों को दर्शाता है। ‘सेनाओं का याहवे’ पद की व्यापकता और संक्षिप्तता दोनों बनाए रखता है।
- source_word: שְׁמוֹ
  choice: उसका नाम ... है
  rationale: यह नाम बतानेवाले हिब्रू नामवाचक वाक्य का स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: ‘याकूब का भाग’ किसे दर्शाता है
  choice: यह पद याहवे को याकूब/इस्राएल के भाग के रूप में मूर्तियों से अलग बताता है।
  alternative: इसे अधिक अमूर्त ढंग से केवल ‘याकूब का हिस्सा’ समझा जा सकता है।
  rationale: निकटवर्ती प्रसंग मनुष्य-निर्मित मूर्तियों और सब कुछ रचनेवाले जीवित परमेश्वर के बीच विरोध स्थापित करता है। ‘याकूब का भाग’ इस वाचाई संबंध को बनाए रखता है, पर मुख्य पाठ में व्याख्यात्मक संज्ञा नहीं जोड़ता।
- issue: שֵׁבֶט का अर्थ
  choice: गोत्र
  alternative: छड़ी या राजदंड
  rationale: इस्राएल को याहवे की विरासत बताने वाले समानांतर कथन में जनसमुदाय-सूचक ‘गोत्र’ अधिक सहज है, फिर भी हिब्रू शब्द की दूसरी वास्तविक अर्थ-संभावनाएँ पादटिप्पणी में दी गई हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। वाक्य की समानांतर हिब्रू संरचना को यथासंभव सुरक्षित रखा गया है। ‘याहवे’ व्यक्तिगत ईश्वरीय नाम का देवनागरी लिप्यंतरण है; ‘सेनाओं का याहवे’ पारंपरिक उपाधि की व्यापकता बनाए रखता है।
