id: JER.10.14
reference: Jeremiah 10:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: נִבְעַ֤ר כָּל אָדָם֙ מִ/דַּ֔עַת הֹבִ֥ישׁ כָּל צוֹרֵ֖ף מִ/פָּ֑סֶל כִּ֛י שֶׁ֥קֶר נִסְכּ֖/וֹ וְ/לֹא ר֥וּחַ בָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/014.yaml
  text: Every man is stupid[a], without knowledge; every metalworker is put to shame by his idol, for his cast image is a lie[c][b], and there is no breath in them.
translation:
  language: hi
  text: हर मनुष्य ज्ञान के बिना बुद्धिहीन है[a]; हर धातु-कारीगर अपनी मूर्ति के कारण लज्जित होता है, क्योंकि उसकी ढली हुई प्रतिमा झूठ है[b], और उनमें साँस नहीं है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ज्ञान के अभाव के कारण हर मनुष्य पशु-समान मूर्ख है।” इब्रानी शब्द तीखी बुद्धिहीनता का भाव देता है, और सम्बन्धसूचक अव्यय को कारणसूचक भी समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “उसकी ढली हुई प्रतिमा मिथ्या है।”
    reason: lexical_alternative
  - marker: c
    text: “साँस” का अनुवाद “आत्मा” भी हो सकता है; आशय यह है कि इन मूर्तियों में जीवन नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבְעַר
  choice: बुद्धिहीन है
  rationale: निफ़अल रूप यहाँ केवल जानकारी की कमी नहीं, बल्कि विवेकहीन या पशु-समान मूर्ख होने का तीखा भाव व्यक्त करता है। ‘बुद्धिहीन’ आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण रहते हुए इस निन्दात्मक बल को बनाए रखता है।
- source_word: כָּל אָדָם
  choice: हर मनुष्य
  rationale: אָדָם यहाँ सामान्य रूप से मानव जाति के प्रत्येक व्यक्ति को सूचित करता है। ‘हर मनुष्य’ वितरणात्मक बल बनाए रखता है और हिन्दी में स्वाभाविक है।
- source_word: מִדַּעַת
  choice: ज्ञान के बिना
  rationale: מִן यहाँ अभावसूचक अर्थ देता है; इसे कारणसूचक ‘ज्ञान के अभाव के कारण’ भी समझा जा सकता है। मुख्य पाठ में संक्षिप्त और स्वाभाविक अभावसूचक रूप रखा गया है।
- source_word: הֹבִישׁ
  choice: लज्जित होता है
  rationale: हिफ़ईल रूप का भाव लज्जा में पड़ने या अपमानित सिद्ध होने का है। प्रसंग में कारीगर अपनी बनाई मूर्ति के कारण लज्जित होता है।
- source_word: צוֹרֵף
  choice: धातु-कारीगर
  rationale: यह शब्द धातु गलाने, शुद्ध करने और उससे वस्तु बनाने वाले व्यक्ति को दर्शाता है। ‘धातु-कारीगर’ सुनार या शोधनकर्ता जैसे अधिक संकीर्ण विकल्पों की अपेक्षा प्रसंग को व्यापक और स्पष्ट रखता है।
- source_word: מִפָּסֶל
  choice: अपनी मूर्ति के कारण
  rationale: פֶּסֶל पूजा के लिए बनाई गई प्रतिमा या मूर्ति है। מִן को यहाँ कारणसूचक माना गया है; हिन्दी में ‘के कारण’ आशय को स्पष्ट करता है। ‘अपनी’ कारीगर और उसके उत्पाद के निहित सम्बन्ध को व्यक्त करता है।
- source_word: שֶׁקֶר
  choice: झूठ
  rationale: यह संज्ञा असत्य, मिथ्यापन या छल को दर्शाती है। प्रतिमा को ‘झूठ’ कहना भविष्यद्वक्ता की तीखी मूर्तिविरोधी भाषा को बनाए रखता है।
- source_word: נִסְכּוֹ
  choice: उसकी ढली हुई प्रतिमा
  rationale: यहाँ धातु को पिघलाकर साँचे में ढाली गई प्रतिमा अभिप्रेत है। ‘ढली हुई प्रतिमा’ आधुनिक हिन्दी में निर्माण-विधि को स्पष्ट रूप से व्यक्त करती है।
- source_word: וְלֹא רוּחַ בָּם
  choice: और उनमें साँस नहीं है
  rationale: רוּחַ का अर्थ साँस, आत्मा या वायु हो सकता है। मूर्तियों के निर्जीव होने पर बल होने के कारण ‘साँस’ उपयुक्त है, जबकि पादटिप्पणी मूल की व्यापक अर्थ-सम्भावना सुरक्षित रखती है। बहुवचन ‘उनमें’ मूर्तियों को सामूहिक रूप से इंगित करता है।
theological_decisions:
- issue: मनुष्य और मूर्तियों के विरुद्ध दोषारोपण का दायरा
  choice: 'कथन को निकटवर्ती मूर्तिपूजा-विरोधी प्रसंग में रखा गया है: मूर्ति बनाने वाले मनुष्य की बुद्धिहीनता और बनाई गई मूर्तियों की निर्जीव मिथ्यात्मकता उजागर होती है।'
  alternative: इसे प्रसंग से अलग करके प्रत्येक मनुष्य के हर क्षेत्र में पूर्ण अज्ञान के सार्वभौमिक दार्शनिक कथन के रूप में पढ़ा जा सकता है।
  rationale: पद की समानान्तर पंक्तियाँ मनुष्य, धातु-कारीगर और उसकी प्रतिमा को जोड़ती हैं। अतः अनुवाद मूल के व्यापक ‘हर मनुष्य’ को बनाए रखता है, पर उसमें ऐसा अतिरिक्त doctrinal अर्थ नहीं जोड़ता जो तत्काल प्रसंग से आगे जाए।
- issue: רוּחַ का अर्थ
  choice: मुख्य पाठ में ‘साँस’, जिससे मूर्तियों का निर्जीव होना सामने आता है।
  alternative: ‘आत्मा’ या ‘वायु’।
  rationale: मूल शब्द बहुअर्थी है। प्रसंग में जीवन के अभाव का संकेत प्रमुख है, फिर भी पादटिप्पणी ‘आत्मा’ की सम्भावना को सुरक्षित रखती है और अस्पष्टता को पूरी तरह समाप्त नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और भविष्यद्वक्तापरक लहजा रखा गया है। ‘बुद्धिहीन’, ‘धातु-कारीगर’ और ‘ढली हुई प्रतिमा’ सामान्य पाठक के लिए बोधगम्य हैं, जबकि पादटिप्पणियाँ इब्रानी की वैकल्पिक सूक्ष्मताओं को सुरक्षित रखती हैं।
