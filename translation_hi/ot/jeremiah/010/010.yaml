id: JER.10.10
reference: Jeremiah 10:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַֽ/יהוָ֤ה אֱלֹהִים֙ אֱמֶ֔ת הֽוּא אֱלֹהִ֥ים חַיִּ֖ים וּ/מֶ֣לֶךְ עוֹלָ֑ם מִ/קִּצְפּ/וֹ֙ תִּרְעַ֣שׁ הָ/אָ֔רֶץ וְ/לֹֽא יָכִ֥לוּ גוֹיִ֖ם זַעְמֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/010.yaml
  text: But Yahweh is the true God[a]; he is the living God and the everlasting King. At his wrath the earth quakes[c][b], and the nations cannot endure his indignation.
translation:
  language: hi
  text: परन्तु याहवे ही सच्चा परमेश्वर है; वह जीवित परमेश्वर और सदा का राजा है। उसके क्रोध से पृथ्वी काँप उठती है, और राष्ट्र उसके रोष को सह नहीं सकते।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיהוָה
  choice: परन्तु यहोवा
  rationale: आरम्भिक וְ सामान्यतः ‘और’ हो सकता है, पर आसपास की मूर्तियों के साथ स्पष्ट विरोध के कारण ‘परन्तु’ स्वाभाविक है। יהוה को उसके व्यक्तिगत वाचा-नाम ‘यहोवा’ से व्यक्त किया गया है।
- source_word: אֱלֹהִים אֱמֶת
  choice: सच्चा परमेश्वर
  rationale: यह पदबंध यहाँ झूठे देवताओं के विपरीत यहोवा को वास्तविक और सत्य परमेश्वर बताता है। ‘सत्य का परमेश्वर’ व्याकरणतः सम्भव है, पर संदर्भगत विरोध को कम स्पष्ट करता है।
- source_word: הוּא
  choice: ही / वही
  rationale: इब्रानी सर्वनाम का बल हिन्दी में ‘ही’ और अगले वाक्यांश में ‘वही’ द्वारा स्वाभाविक रूप से सुरक्षित रखा गया है।
- source_word: אֱלֹהִים חַיִּים
  choice: जीवित परमेश्वर
  rationale: यह निर्जीव मूर्तियों के विपरीत परमेश्वर के जीवित होने को सीधे और प्रचलित हिन्दी में व्यक्त करता है।
- source_word: וּמֶלֶךְ עוֹלָם
  choice: और सदा का राजा
  rationale: עוֹלָם यहाँ अनन्त अथवा चिरस्थायी राजत्व दर्शाता है; ‘सदा का राजा’ सहज, गरिमापूर्ण और अर्थ-सटीक है।
- source_word: מִקִּצְפּוֹ
  choice: उसके क्रोध से
  rationale: מִן यहाँ कारण अथवा स्रोत का भाव देता है। ‘से’ पृथ्वी के काँपने का कारण स्पष्ट और संक्षिप्त रूप में व्यक्त करता है।
- source_word: תִּרְעַשׁ הָאָרֶץ
  choice: पृथ्वी काँप उठती है
  rationale: רעש तीव्र हिलने या काँपने को दर्शाता है। सार्वभौमिक राजत्व के संदर्भ में הָאָרֶץ के लिए ‘पृथ्वी’ उपयुक्त है।
- source_word: וְלֹא יָכִלוּ גוֹיִם
  choice: और राष्ट्र ... सह नहीं सकते
  rationale: יכל निषेध के साथ असमर्थता बताता है; ‘सह नहीं सकते’ दैवी रोष के सामने टिक न पाने का स्वाभाविक हिन्दी रूप है।
- source_word: זַעְמוֹ
  choice: उसके रोष को
  rationale: זַעַם प्रबल, विशेषतः दैवी क्रोध को दर्शाता है। ‘रोष’ गरिमापूर्ण है और पहले प्रयुक्त ‘क्रोध’ से शब्दगत भेद भी बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में टेट्राग्राम יהוה प्रत्यक्ष है। हिन्दी बाइबल-परंपरा में परिचित व्यक्तिगत नाम ‘यहोवा’ पाठकों के लिए सहज है और इसे सामान्य उपाधि ‘प्रभु’ से अलग रखता है।
- issue: पद के आरम्भिक संयोजक וְ का भाव
  choice: परन्तु
  alternative: और
  rationale: व्याकरणतः दोनों सम्भव हैं, किन्तु पिछले प्रसंग के निर्जीव और झूठे देवताओं के साथ विरोध यहाँ ‘परन्तु’ को संदर्भानुकूल बनाता है।
- issue: אֱלֹהִים אֱמֶת की व्याख्या
  choice: सच्चा परमेश्वर
  alternative: सत्य का परमेश्वर
  rationale: दोनों व्याकरणतः सम्भव हैं; मूर्तियों के विरोध में यहोवा की वास्तविक दिव्यता पर बल होने के कारण गुणवाचक अर्थ चुना गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक पाठ के योग्य शैली रखी गई है। ‘सच्चा परमेश्वर’, ‘जीवित परमेश्वर’, ‘सदा का राजा’, ‘क्रोध’ और ‘रोष’ जैसे परिचित धार्मिक पदों का प्रयोग करते हुए वाक्य को सामान्य पाठक के लिए स्पष्ट रखा गया है।
