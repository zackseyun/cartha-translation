  text: हाय, मेरी टूटन के कारण![a] मेरा घाव गम्भीर है। फिर भी मैंने कहा, “निश्चय ही यह मेरा रोग है,[b] और मैं इसे सहूँगा।”[c]
  philosophy: optimal-equivalence
