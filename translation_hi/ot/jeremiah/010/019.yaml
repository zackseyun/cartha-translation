- source_word: וְאֶשָּׂאֶנּוּ
  choice: और मुझे इसे सहना ही होगा
  rationale: נשא का अर्थ उठाना, ढोना या सहना है। प्रसंग में अपूर्ण क्रिया विवश स्वीकृति अथवा संकल्प व्यक्त कर सकती है; मुख्य पाठ में स्वाभाविक हिन्दी के लिए विवशता का भाव रखा गया है, जबकि सरल भविष्य की सम्भावना पादटिप्पणी में दी गई है।
