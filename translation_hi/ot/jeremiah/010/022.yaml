- from: सुनो, एक समाचार आ रहा है! उत्तर देश से भारी कोलाहल उठ रहा है, ताकि यहूदा के नगर उजाड़ और सियारों का बसेरा बन जाएँ।
  to: समाचार की आवाज़—देखो, वह आ रही है!—उत्तर देश से भारी कोलाहल, यहूदा के नगरों को उजाड़, सियारों का बसेरा बनाने के लिए।
  rationale: The revision restores both the auditory noun phrase “समाचार की आवाज़” for קוֹל שְׁמוּעָה and the explicit attention marker “देखो” for הִנֵּה. The final infinitival phrase remains impersonal, preserving the Hebrew’s unstated agent. “सियारों” is retained as the contextually likely rendering of תַּנִּים without claiming unwarranted zoological precision.
