source:
  edition: WLC
  text: ק֤וֹל שְׁמוּעָה֙ הִנֵּ֣ה בָאָ֔ה וְ/רַ֥עַשׁ גָּד֖וֹל מֵ/אֶ֣רֶץ צָפ֑וֹן לָ/שׂ֞וּם אֶת עָרֵ֧י יְהוּדָ֛ה שְׁמָמָ֖ה מְע֥וֹן תַּנִּֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/022.yaml
  text: The sound of a report—look, it is coming!—a great commotion from the land of the north, to make the cities of Judah a desolation, a haunt of jackals.
translation:
  language: hi
  text: समाचार की आवाज़—देखो, वह आ रही है!—उत्तर देश से भारी कोलाहल, यहूदा के नगरों को उजाड़, सियारों का बसेरा बनाने के लिए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ק֤וֹל שְׁמוּעָה֙
  choice: सुनो, एक समाचार
  rationale: शाब्दिक रूप से ‘समाचार/खबर की आवाज़’; हिन्दी में ‘सुनो, एक समाचार’ ध्वनि और आने वाली खबर—दोनों भाव स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הִנֵּ֣ה בָאָ֔ה
  choice: आ रहा है!
  rationale: הִנֵּה की ध्यान आकर्षित करने वाली शक्ति को आरंभिक ‘सुनो’ में समाहित किया गया है; בָאָה का वर्तमानगत आगमन सुरक्षित है।
- source_word: רַ֥עַשׁ גָּד֖וֹל
  choice: भारी कोलाहल
  rationale: רעש यहाँ बड़ी अशांत ध्वनि या हलचल सूचित करता है; ‘भारी कोलाहल’ दोनों आयामों को खुला रखता है।
- source_word: מֵ/אֶ֣רֶץ צָפ֑וֹן
  choice: उत्तर देश से
  rationale: मूल के भौगोलिक और भविष्यवाणी-संबंधी संकेत को बिना अतिरिक्त पहचान जोड़े सीधे रखा गया है।
- source_word: שְׁמָמָ֖ה
  choice: उजाड़
  rationale: निर्जन और विनष्ट दशा के अर्थ को संक्षिप्त, प्रचलित बाइबलीय हिन्दी में व्यक्त करता है।
- source_word: מְע֥וֹן תַּנִּֽים
  choice: सियारों का बसेरा
  rationale: תַּנִּים का इस संदर्भ में संभावित अर्थ ‘सियार’; מְעוֹן को स्वाभाविक हिन्दी ‘बसेरा’ दिया गया है।
theological_decisions:
- issue: विनाश के कर्ता की अस्पष्टता
  choice: ‘ताकि ... बन जाएँ’ के द्वारा उद्देश्य/परिणाम रखा गया, पर कर्ता नहीं जोड़ा गया
  alternative: ‘वह यहूदा के नगरों को ... बना देगा’
  rationale: मूल infinitive לָשׂוּם में स्पष्ट कर्ता व्यक्त नहीं है; किसी सेना, राष्ट्र या स्वयं परमेश्वर को व्याकरण में जोड़ना मूल की अस्पष्टता को अनुचित रूप से सुलझाता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भविष्यवाणी की तात्कालिकता और भयावह श्रव्य बिंब को सरल, गरिमापूर्ण भाषा में रखा गया है। ‘सुनो’ के कारण अलग से ‘देखो’ जोड़कर हिब्रू विस्मय-सूचक को दोहराया नहीं गया।
