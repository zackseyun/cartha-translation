base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/024.yaml
  text: Discipline me[a], Yahweh, but with justice, not in your anger[c][b], lest you diminish me.
translation:
  language: hi
  text: हे यहोवा, मुझे अनुशासित कर[a], पर न्याय के अनुसार[b], अपने क्रोध में नहीं, कहीं ऐसा न हो कि तू मुझे घटा दे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मुझे सुधार,” अथवा “मुझे ताड़ना दे।”
    reason: lexical_alternative
  - marker: b
    text: या “न्याय के साथ,” अथवा “उचित माप से।” इब्रानी शब्द न्याय, न्यायिक निर्णय या उचित माप का अर्थ दे सकता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “तू मुझे कम या छोटा कर दे।” प्रसंग में यह बहुत अधिक घटा देने की आशंका व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יַסְּרֵנִי
  choice: मुझे अनुशासित कर
  rationale: पिएल रूप यहाँ सुधारने के उद्देश्य से दी जाने वाली ताड़ना या अनुशासन की विनती व्यक्त करता है। ‘अनुशासित कर’ आधुनिक हिन्दी में corrective chastening का भाव स्वाभाविक रूप से रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित नाम-रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: אַךְ
  choice: पर
  rationale: 'यह विनती को सीमित करता है: अनुशासन हो, पर केवल उचित रीति से। ‘पर’ विरोध और सीमा दोनों को सहज ढंग से व्यक्त करता है।'
- source_word: בְּמִשְׁפָּט
  choice: न्याय के अनुसार
  rationale: מִשְׁפָּט न्याय, न्यायिक निर्णय अथवा उचित माप का बोध करा सकता है। यहाँ क्रोध के विपरीत न्यायपूर्ण और नपी-तुली कार्यवाही की विनती है।
- source_word: בְּאַפְּךָ
  choice: अपने क्रोध में
  rationale: אַף इस प्रसंग में क्रोध को दर्शाता है। ‘क्रोध’ वर्तमान हिन्दी में स्पष्ट है और मूल की तीव्रता को अनावश्यक रूप से नहीं बढ़ाता।
- source_word: פֶּן
  choice: कहीं ऐसा न हो कि
  rationale: यह उस आशंकित परिणाम को प्रस्तुत करता है जिससे वक्ता बचना चाहता है। यह हिन्दी में स्वाभाविक निषेधात्मक आशंका है।
- source_word: תַּמְעִיטֵנִי
  choice: तू मुझे घटाकर तुच्छ कर दे
  rationale: מעט के हिफ़ील रूप का मूल भाव ‘छोटा/कम कर देना’ है। ‘घटाकर तुच्छ कर दे’ इस गंभीर न्यूनकरण को रखता है, पर ‘सर्वथा नष्ट कर दे’ जैसी व्याख्यात्मक अति से बचता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत वाचा-नाम है। हिन्दी के सामान्य बाइबलीय प्रयोग में पहचाने जाने वाले ‘यहोवा’ को रखा गया है; ‘प्रभु’ जैसी उपाधि से नाम को प्रतिस्थापित नहीं किया गया।
- issue: अनुशासन में מִשְׁפָּט का आशय
  choice: न्याय के अनुसार
  alternative: न्याय के साथ / उचित माप से
  rationale: वक्ता अनुशासन को अस्वीकार नहीं करता, बल्कि न्यायपूर्ण अनुशासन और क्रोधपूर्ण प्रहार के बीच तनाव बनाए रखता है।
- issue: תַּמְעִיטֵנִי की तीव्रता
  choice: घटाकर तुच्छ कर दे
  alternative: मुझे छोटा कर दे / मुझे नष्ट कर दे
  rationale: मूल का शब्दार्थ ‘कम या छोटा कर देना’ है। चुना हुआ पाठ गंभीर परिणाम का संकेत देता है, किंतु पूर्ण विनाश को निश्चित अर्थ बनाकर अस्पष्टता नहीं मिटाता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और प्रार्थनात्मक हिन्दी। प्रत्यक्ष संबोधन में पारंपरिक एकवचन ‘तू’ रखा गया है। वाक्य अनुशासन की स्वीकृति और क्रोधपूर्ण दंड के भय—दोनों को बिना समतल किए बनाए रखता है।
