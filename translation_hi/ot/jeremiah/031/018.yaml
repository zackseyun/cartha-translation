source:
  edition: WLC
  text: שָׁמ֣וֹעַ שָׁמַ֗עְתִּי אֶפְרַ֨יִם֙ מִתְנוֹדֵ֔ד יִסַּרְתַּ֨/נִי֙ וָֽ/אִוָּסֵ֔ר כְּ/עֵ֖גֶל לֹ֣א לֻמָּ֑ד הֲשִׁיבֵ֣/נִי וְ/אָשׁ֔וּבָה כִּ֥י אַתָּ֖ה יְהוָ֥ה אֱלֹהָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/018.yaml
  text: 'I have surely heard Ephraim grieving: ‘You disciplined me[a], and I was disciplined, like an untrained calf. Restore me, and I will return[b], for you are Yahweh my God.’'
translation:
  language: hi
  text: 'मैंने निश्चय ही एप्रैम को अपने ही लिए विलाप करते हुए सुना है[a]: “तूने मुझे अनुशासित किया, और मैं अनुशासित हुआ, एक अप्रशिक्षित बछड़े के समान। मुझे लौटा दे, और मैं लौट आऊँगा[b], क्योंकि तू याहवे, मेरा परमेश्वर है।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शोक से व्याकुल होते हुए।” इब्रानी कृदंत आत्म-विलाप, शोक में हिलने, या बेचैनी से इधर-उधर होने का भाव दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: अधिक शाब्दिक रूप से, “मुझे लौटा, और मैं लौटूँगा।” इब्रानी में दोनों खंडों में एक ही क्रिया ‘लौटना/फिरना’ दोहराई गई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמוֹעַ שָׁמַעְתִּי
  choice: मैंने निश्चय ही ... सुना है
  rationale: क्रिया के साथ infinitive absolute कथन पर बल देता है; हिंदी में ‘निश्चय ही’ इस बल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֶפְרַיִם
  choice: एप्रैम
  rationale: व्यक्तिवाचक नाम को लिप्यंतरित किया गया है। संदर्भ में यह उत्तरी प्रजा का प्रतिनिधित्व करता है, पर पद के एकवचन मानवीकरण को बनाए रखा गया है।
- source_word: מִתְנוֹדֵד
  choice: अपने ऊपर विलाप करते
  rationale: Hitpolel कृदंत में आत्म-विलाप, कराहने या बेचैनी से हिलने का भाव हो सकता है। पश्चात्ताप के संदर्भ में ‘अपने ऊपर विलाप करते’ प्रतिवर्ती और श्रव्य शोक दोनों को व्यक्त करता है, जबकि विकल्प पादटिप्पणी में रखा गया है।
- source_word: יִסַּרְתַּנִי ... וָאִוָּסֵר
  choice: तूने मुझे अनुशासित किया, और मैं अनुशासित हुआ
  rationale: יסר का सुधारात्मक अनुशासन-संबंधी अर्थ और दोनों खंडों की शब्दगत प्रतिध्वनि बनाए रखी गई है। दूसरे रूप को निष्क्रिय अर्थ में रखा गया है, पर उससे स्वीकृति का संभावित मध्यवाची भाव पूरी तरह निषिद्ध नहीं होता।
- source_word: כְּעֵגֶל לֹא לֻמָּד
  choice: एक अप्रशिक्षित बछड़े के समान
  rationale: यह उस बछड़े का कृषि-चित्र बनाए रखता है जिसे अभी काम या जुए के लिए प्रशिक्षित नहीं किया गया।
- source_word: הֲשִׁיבֵנִי ... וְאָשׁוּבָה
  choice: मुझे वापस ले आ, और मैं लौट आऊँगा
  rationale: पहले रूप की कारकता और दूसरे रूप के स्वयं लौटने के भाव को स्पष्ट रखा गया है। एक ही मूल שוב की पुनरावृत्ति हिंदी में ‘वापस’ और ‘लौट’ से निकट रूप में सुनाई देती है; अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: כִּי אַתָּה יְהוָה אֱלֹהָי
  choice: क्योंकि तू याहवे, मेरा परमेश्वर है
  rationale: כִּי कारण बताता है। יהוה को वाचा-संबंधी व्यक्तिगत नाम ‘याहवे’ के रूप में लिप्यंतरित किया गया है और प्रत्यक्ष अंगीकार का स्वर रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसका निकट आधुनिक लिप्यंतरण है और उसे उपाधि में नहीं बदलता।
- issue: मनुष्य की वापसी और परमेश्वर की कारक पहल के बीच संबंध
  choice: ‘मुझे वापस ले आ, और मैं लौट आऊँगा’
  alternative: ‘मुझे फेर, और मैं फिरूँगा’; ‘मुझे पुनःस्थापित कर, और मैं लौट आऊँगा’
  rationale: मूल में पहले שוב का Hiphil आदेश और फिर उसी धातु का Qal इच्छार्थक रूप है। अनुवाद परमेश्वर की वापस लाने की क्रिया और एप्रैम की वापसी दोनों को साथ रखता है, बिना उनके संबंध को किसी विशेष धर्मवैज्ञानिक व्यवस्था में सीमित किए।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी, सहज किंतु गरिमापूर्ण रखी गई है। परमेश्वर को संबोधन में एकवचन ‘तू’ बाइबिलीय निकटता और प्रत्यक्ष प्रार्थना व्यक्त करता है; कृत्रिम पुरातन रूपों से बचा गया है।
