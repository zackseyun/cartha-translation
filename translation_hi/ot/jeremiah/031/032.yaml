  yaml_path: translation/ot/jeremiah/031/032.yaml
  text: not like the covenant that I made with their fathers on the day I took them by the hand to bring them out of the land of Egypt[a], my covenant that they themselves broke, though I was their husband, declares Yahweh.
translation:
  language: hi
  text: वह वाचा उस वाचा के समान नहीं होगी, जो मैंने उनके पूर्वजों के साथ उस दिन बाँधी थी, जब मैंने उन्हें हाथ से पकड़कर मिस्र देश से बाहर निकाला था—मेरी वह वाचा जिसे उन्होंने स्वयं तोड़ दिया, यद्यपि मैं उनका पति था[a]—याहवे की यह घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यद्यपि मैं उनका प्रभु था,” अथवा “यद्यपि मैं उन पर शासन करता था।” इब्रानी क्रिया वैवाहिक संबंध और प्रभुत्व—दोनों का अर्थ दे सकती है; इब्रानियों 8:9 में उद्धृत यूनानी रूप दूसरे अर्थ को दर्शाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא כַבְּרִית
  choice: उस वाचा के समान नहीं
  rationale: כ तुलना प्रकट करता है; यह प्रयोग स्वाभाविक हिन्दी में ‘उस वाचा के समान नहीं’ के रूप में तुलनात्मक अर्थ बनाए रखता है।
- source_word: כָּרַתִּי
  choice: मैंने ... बाँधी थी
  rationale: ‘वाचा बाँधना’ हिन्दी का स्थापित और बोधगम्य वाचागत मुहावरा है; शाब्दिक ‘काटना’ अप्राकृतिक होता।
- source_word: אֶת אֲבוֹתָם
  choice: उनके पूर्वजों के साथ
  rationale: אבות यहाँ निर्गमन-पीढ़ी को सूचित करता है। आधुनिक हिन्दी में ‘पूर्वज’ व्यापक पाठकवर्ग के लिए ‘पितरों’ से अधिक सहज है।
- source_word: בְּיוֹם הֶחֱזִיקִי בְיָדָם
  choice: उस दिन ... जब मैंने उनका हाथ पकड़ा
  rationale: यह अनुवाद हाथ थामकर मार्ग दिखाने और निकाल ले जाने के मूल बिंब को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: לְהוֹצִיאָם מֵאֶרֶץ מִצְרָיִם
  choice: उन्हें मिस्र देश से बाहर निकाला
  rationale: יצא के हिफ़ील रूप का कारक अर्थ और निर्गमन का ऐतिहासिक संकेत दोनों स्पष्ट रहते हैं।
- source_word: אֲשֶׁר הֵמָּה הֵפֵרוּ אֶת בְּרִיתִי
  choice: मेरी वह वाचा जिसे उन्होंने स्वयं तोड़ दिया
  rationale: स्वतंत्र सर्वनाम הֵמָּה का बल ‘स्वयं’ से व्यक्त किया गया है; הפר के वाचा-संबंधी अर्थ के लिए ‘तोड़ना’ सीधा और स्वाभाविक है।
- source_word: וְאָנֹכִי
  choice: यद्यपि मैं
  rationale: वाव और बलयुक्त אָנֹכִי यहाँ उनके विश्वासघात और याहवे के संबंध के बीच विरोध प्रकट करते हैं; ‘यद्यपि’ उस तनाव को स्पष्ट करता है।
- source_word: בָּעַלְתִּי בָם
  choice: मैं उनका पति था
  rationale: बּעל का वैवाहिक अर्थ यिर्मयाह की वाचा-विषयक वैवाहिक छवि से मेल खाता है। प्रभुत्व-संबंधी सम्भव अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: नबी-संबंधी सूत्र נְאֻם को गरिमापूर्ण और स्पष्ट हिन्दी में व्यक्त किया गया है, और परमेश्वर का व्यक्तिगत नाम लिप्यंतरित किया गया है।
theological_decisions:
- issue: בָּעַלְתִּי בָם का वैवाहिक या प्रभुत्व-संबंधी अर्थ
  choice: यद्यपि मैं उनका पति था
  alternative: यद्यपि मैं उनका प्रभु था / उन पर शासन करता था
  rationale: मसोरेटिक इब्रानी वैवाहिक अर्थ को स्वाभाविक रूप से सहारा देती है और यिर्मयाह की वैवाहिक वाचा-छवि से संगत है। फिर भी क्रिया प्रभुत्व का अर्थ भी दे सकती है; इब्रानियों 8:9 में उद्धृत यूनानी रूप उसी दिशा को दर्शाता है, इसलिए विकल्प पादटिप्पणी में रखा गया है।
- issue: יהוה का निरूपण
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: व्यक्तिगत ईश्वरीय नाम को उपाधि से बदलने के बजाय आधुनिक हिन्दी लिप्यंतरण ‘याहवे’ द्वारा सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध है। ‘वाचा बाँधना’, ‘पूर्वज’ और ‘हाथ पकड़ना’ स्रोत की वाचागत तथा ऐतिहासिक छवियों को स्वाभाविक हिन्दी में रखते हैं। मुख्य पाठ में वैवाहिक अर्थ रखा गया है और वास्तविक अर्थगत अस्पष्टता पादटिप्पणी में दी गई है।
