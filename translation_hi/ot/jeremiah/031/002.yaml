source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה מָצָ֥א חֵן֙ בַּ/מִּדְבָּ֔ר עַ֖ם שְׂרִ֣ידֵי חָ֑רֶב הָל֥וֹךְ לְ/הַרְגִּיע֖/וֹ יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/002.yaml
  text: 'Thus says Yahweh: The people who survived the sword found favor in the wilderness; Israel[a], when it went to find rest for him.'
translation:
  language: hi
  text: 'याहवे यों कहते हैं:


    “तलवार से बचे हुए लोगों ने निर्जन प्रदेश में कृपा पाई—


    इस्राएल[a], जब वह उसे विश्राम देने चला।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी का अंतिम खंड कठिन है। इसका अनुवाद यह भी हो सकता है: “इस्राएल—जब मैं उसे विश्राम देने चला,” या “जब इस्राएल अपने लिए विश्राम पाने चला।” कर्ता, ‘उसे’ के संदर्भ, और ‘इस्राएल’ की वाक्यगत भूमिका अनिश्चित हैं।'
    reason: अंतिम इब्रानी खंड के वैकल्पिक वाक्य-विन्यास और सर्वनाम-संदर्भ को स्पष्ट करते हुए उसकी वास्तविक अस्पष्टता सुरक्षित रखना।
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के वाचा-संबंधी नाम को उपाधि से बदलने के बजाय आधुनिक हिन्दी में निकट लिप्यंतरण द्वारा सुरक्षित रखा गया है।
- source_word: מָצָא חֵן
  choice: कृपा पाई
  rationale: यह स्वाभाविक हिन्दी मुहावरा किसी की अनुकम्पा या पक्षपातपूर्ण स्वीकृति पाने का भाव व्यक्त करता है, बिना बाद की धर्मवैज्ञानिक अर्थछाया थोपे।
- source_word: בַּמִּדְבָּר
  choice: निर्जन प्रदेश में
  rationale: מִדְבָּר केवल रेतीला मरुस्थल नहीं, बल्कि वीरान या कम आबादी वाला वन्य प्रदेश भी हो सकता है; यह चुनाव उस व्यापक अर्थ और निर्गमन-संबंधी संकेत दोनों के अनुकूल है।
- source_word: עַם שְׂרִידֵי חָרֶב
  choice: तलवार से बचे हुए लोगों
  rationale: शाब्दिक चित्र ‘तलवार के बचे हुए जन’ युद्ध या न्याय से जीवित बचने को दर्शाता है; चुना हुआ रूप स्पष्ट और स्वाभाविक आधुनिक हिन्दी है।
- source_word: הָלוֹךְ
  choice: चला
  rationale: यहाँ infinitive absolute संक्षिप्त कठिन वाक्यांश में गमन का क्रियात्मक भाव देता है; ‘चला’ उस गति को बनाए रखता है।
- source_word: לְהַרְגִּיעוֹ
  choice: उसे विश्राम देने
  rationale: רגע के हिफ़ील रूप का अर्थ ‘विश्राम देना/शांत करना’ है और प्रत्यय पुल्लिंग एकवचन ‘उसे’ है। अस्पष्ट कर्म-संदर्भ को सर्वनाम द्वारा सुरक्षित रखा गया है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: राष्ट्रीय नाम का हिन्दी में प्रचलित बाइबलीय रूप; वाक्य में इसकी स्थिति ‘लोगों’ की पुनर्पहचान या अंतिम खंड के कर्ता/कर्म—दोनों प्रकार की व्याख्या की गुंजाइश छोड़ती है।
theological_decisions:
- issue: अंतिम खंड הָלוֹךְ לְהַרְגִּיעוֹ יִשְׂרָאֵל का कर्ता, कर्म और वाक्य-विन्यास
  choice: “इस्राएल, जब वह उसे विश्राम देने चला”
  alternative: “जब मैं इस्राएल को विश्राम देने चला” अथवा “जब इस्राएल अपने लिए विश्राम पाने चला”
  rationale: इब्रानी खंड में הָלוֹךְ, पुल्लिंग एकवचन प्रत्यय वाले לְהַרְגִּיעוֹ और अंत में रखे יִשְׂרָאֵל का परस्पर संबंध कठिन है। मुख्य पाठ सर्वनामों और शब्दक्रम के द्वारा इस कठिनता को पूरी तरह हल नहीं करता; पादटिप्पणी प्रमुख वैकल्पिक समझ को स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। काव्यात्मक पंक्ति-विन्यास तथा डैश ‘इस्राएल’ को पहले उल्लिखित लोगों से जोड़ते हैं, जबकि [a] मूल की वास्तविक वाक्यगत अस्पष्टता बताता है।
