id: JER.31.21
reference: Jeremiah 31:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הַצִּ֧יבִי לָ֣/ךְ צִיֻּנִ֗ים שִׂ֤מִי לָ/ךְ֙ תַּמְרוּרִ֔ים שִׁ֣תִי לִבֵּ֔/ךְ לַֽ/מְסִלָּ֖ה דֶּ֣רֶךְ הלכתי שׁ֚וּבִי בְּתוּלַ֣ת יִשְׂרָאֵ֔ל שֻׁ֖בִי אֶל עָרַ֥יִ/ךְ אֵֽלֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/021.yaml
  text: Set up road markers for yourself[a]; place guideposts for yourself. Set your heart toward the highway, the way you went. Return, virgin Israel[c][b]; return to these your cities.
translation:
  language: hi
  text: अपने लिए मार्ग-चिह्न खड़े कर[a]; अपने लिए दिशा-सूचक चिह्न लगा[b]। अपना मन उस राजमार्ग पर लगा, उस मार्ग पर जिस पर तू चली थी। लौट आ, हे कुँवारी इस्राएल[c]; अपने इन नगरों में लौट आ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “रास्ते के निशान।”
    reason: lexical_alternative
  - marker: b
    text: या “मार्गदर्शक चिह्न।” इसका इब्रानी शब्द दुर्लभ है; इस संदर्भ में सम्भवतः मार्ग पर लगाए गए दिशा-सूचक चिह्न अभिप्रेत हैं।
    reason: lexical_alternative
  - marker: c
    text: “लौट आ” का अर्थ निर्वासन से वापस आना और वाचा की निष्ठा की ओर फिरना—दोनों हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: הַצִּיבִי ... צִיֻּנִים
  choice: मार्ग-चिह्न खड़े कर
  rationale: क्रिया स्त्रीलिंग एकवचन आज्ञार्थक है और संज्ञा यात्रा-पथ पर लगाए जाने वाले दृश्य चिह्नों को बताती है। यह अनुवाद मार्ग-संदर्भ और आज्ञा, दोनों को स्पष्ट रखता है।
- source_word: שִׂמִי ... תַּמְרוּרִים
  choice: दिशा-सूचक चिह्न लगा
  rationale: दुर्लभ संज्ञा को समानांतर पद और वापसी-यात्रा के संदर्भ में रास्ता दिखाने वाले चिह्नों के रूप में समझा गया है; इसकी अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: שִׁתִי לִבֵּךְ
  choice: अपना मन ... पर लगा
  rationale: शाब्दिक अर्थ 'अपना हृदय लगा' है, जिसमें ध्यान, इच्छा और भीतरी अभिमुखता सम्मिलित हैं। आधुनिक हिन्दी में 'मन लगा' स्वाभाविक रहते हुए वही भाव देता है।
- source_word: לַמְסִלָּה
  choice: उस राजमार्ग पर
  rationale: מְסִלָּה निर्मित या ऊँचे किए गए मुख्य मार्ग को दर्शाता है। 'राजमार्ग' संक्षिप्त और वर्तमान हिन्दी में बोधगम्य है।
- source_word: דֶּרֶךְ הלכתי
  choice: उसी मार्ग पर जिससे तू गई थी
  rationale: यह पद पहले आए राजमार्ग को स्पष्ट करता है। स्त्रीलिंग एकवचन रूप राष्ट्र के स्त्री-रूपक के अनुरूप 'तू गई थी' में रखा गया है।
- source_word: שׁוּבִי
  choice: लौट आ
  rationale: यह अभिव्यक्ति निर्वासन से भौगोलिक वापसी को स्वाभाविक रूप से व्यक्त करती है, पर covenantal turning की अंतर्ध्वनि को नकारती नहीं है।
- source_word: בְּתוּלַת יִשְׂרָאֵל
  choice: हे कुँवारी इस्राएल
  rationale: राष्ट्र के लिए प्रयुक्त भविष्यद्वाणी-संबंधी स्त्री-रूपक को सीधे बनाए रखा गया है; संबोधन को हिन्दी में स्वाभाविक बनाने के लिए 'हे' जोड़ा गया है।
- source_word: אֶל עָרַיִךְ אֵלֶּה
  choice: अपने इन नगरों में
  rationale: संकेतवाचक 'इन' और संबंधवाचक 'अपने' दोनों को रखा गया है। गंतव्य के साथ आधुनिक हिन्दी में 'नगरों में लौट आ' अधिक स्वाभाविक है।
theological_decisions:
- issue: שוב में भौगोलिक वापसी और वाचा-संबंधी फिराव
  choice: '''लौट आ'' द्वारा दोनों संभावनाओं को खुला रखना'
  alternative: '''पश्चाताप कर'' अथवा केवल ''निर्वासन से वापस आ'''
  rationale: मार्ग, चिह्न और नगर भौगोलिक वापसी पर बल देते हैं, जबकि यिर्मयाह में लौटने की भाषा वाचा के प्रति फिरने का भाव भी रख सकती है। अनुवाद किसी एक अर्थ तक इसे सीमित नहीं करता।
- issue: בתולת ישראל का रूपक
  choice: कुँवारी इस्राएल
  alternative: इस्राएल की कन्या / युवती इस्राएल
  rationale: मूल का तीखा और परिचित भविष्यद्वाणी-संबंधी रूपक सुरक्षित रखा गया है, बिना इसे किसी विशिष्ट सिद्धान्त की ओर मोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय, किंतु सामान्य पाठक के लिए स्पष्ट शैली। इस्राएल को स्त्री के रूप में संबोधित करने के कारण एकवचन आत्मीय 'तू' और स्त्रीलिंग क्रियाएँ रखी गई हैं। तीनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
