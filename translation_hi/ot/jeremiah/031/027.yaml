  text: הִנֵּ֛ה יָמִ֥ים בָּאִ֖ים נְאֻם יְהוָ֑ה וְ/זָרַעְתִּ֗י אֶת בֵּ֤ית יִשְׂרָאֵל֙ וְ/אֶת בֵּ֣ית יְהוּדָ֔ה זֶ֥רַע אָדָ֖ם וְ/זֶ֥רַע בְּהֵמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/027.yaml
  text: Behold[a], days are coming, declares Yahweh, when I will sow the house of Israel and the house of Judah with the seed of man and the seed of beast.
translation:
  language: hi
  text: देखो, दिन आने वाले हैं—याहवे की यह वाणी है—जब मैं इस्राएल के घराने और यहूदा के घराने में मनुष्य का बीज[a] और पशु का बीज बोऊँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ ‘मनुष्य का बीज’ है, अर्थात् मानव-संतान या मनुष्यजाति। ‘पशु के बीज’ के साथ यह जोड़ी मनुष्यों और पशुओं—दोनों से फिर भरने का चित्र प्रस्तुत करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह भविष्यवाणी की ओर ध्यान खींचनेवाले संकेत को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: יָמִים בָּאִים
  choice: ऐसे दिन आनेवाले हैं
  rationale: यह भविष्यसूचक सूत्र का स्वाभाविक हिन्दी रूप है; ‘ऐसे’ आगामी समय की ओर संकेत को स्पष्ट करता है, बिना उसकी प्रकृति पहले से निर्धारित किए।
- source_word: נְאֻם יְהוָה
  choice: यह यहोवा की घोषणा है
  rationale: यह नबी के वचन को परमेश्वर की औपचारिक घोषणा के रूप में व्यक्त करता है और יהוה को उसके व्यक्तिगत वाचाई नाम ‘यहोवा’ से प्रस्तुत करता है।
- source_word: וְזָרַעְתִּי
  choice: मैं ... बोऊँगा
  rationale: זרע के मूल कृषि-बिंब को सुरक्षित रखता है; ‘बसाऊँगा’ अर्थ तो बताता, पर बोने के रूपक को मिटा देता।
- source_word: בֵּית יִשְׂרָאֵל ... בֵּית יְהוּדָה
  choice: इस्राएल के घराने और यहूदा के घराने में
  rationale: ‘घराना’ दोनों लोगों की सामूहिक और वाचाई पहचान को बनाए रखता है। हिन्दी में ‘में ... बीज बोऊँगा’ रूपक का स्वाभाविक व्याकरणिक रूप है।
- source_word: זֶרַע אָדָם
  choice: मनुष्य का बीज
  rationale: यह बोने के रूपक और पशु के बीज के साथ समानांतर रचना को सुरक्षित रखता है; यहाँ אדם समस्त मानवजाति के अर्थ में है, केवल पुरुष के अर्थ में नहीं।
- source_word: וְזֶרַע בְּהֵמָה
  choice: और पशु का बीज
  rationale: सामूहिक एकवचन और मनुष्यों तथा पशुओं—दोनों से पुनः भरने के समानांतर बिंब को बनाए रखता है।
theological_decisions:
- issue: पुनर्स्थापना के बोनेवाले रूपक का अनुवाद
  choice: ‘मैं ... मनुष्य का बीज और पशु का बीज बोऊँगा’ के रूप में मूल रूपक बनाए रखा गया।
  alternative: ‘मैं इस्राएल और यहूदा को मनुष्यों और पशुओं से फिर भर दूँगा।’
  rationale: गतिशील विकल्प आशय स्पष्ट करता, पर यिर्मयाह में बोने और रोपने की व्यापक चित्रावली तथा इस पद के जानबूझकर प्रयुक्त कृषि-बिंब को समतल कर देता।
- issue: אָדָם का व्यापक अर्थ
  choice: मुख्य पाठ में ‘मनुष्य’ रखा गया और पादटिप्पणी में उसके सामूहिक अर्थ को स्पष्ट किया गया।
  alternative: ‘मानवजाति’ अथवा ‘लोग’
  rationale: ‘मनुष्य का बीज’ मूल समानांतरता और रूपक को बचाता है, जबकि पादटिप्पणी यह भ्रम दूर करती है कि कथन केवल पुरुषों के विषय में है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। भविष्यवाणी की औपचारिक ध्वनि के लिए ‘घोषणा’ और मूल कृषि-बिंब के लिए ‘बीज बोऊँगा’ बनाए रखे गए हैं।
