source:
  edition: WLC
  text: כִּי כֹ֣ה אָמַ֣ר יְהוָ֗ה רָנּ֤וּ לְ/יַֽעֲקֹב֙ שִׂמְחָ֔ה וְ/צַהֲל֖וּ בְּ/רֹ֣אשׁ הַ/גּוֹיִ֑ם הַשְׁמִ֤יעוּ הַֽלְלוּ֙ וְ/אִמְר֔וּ הוֹשַׁ֤ע יְהוָה֙ אֶֽת עַמְּ/ךָ֔ אֵ֖ת שְׁאֵרִ֥ית יִשְׂרָאֵֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/007.yaml
  text: 'For thus says Yahweh: Sing aloud with gladness for Jacob[a], and shout at the head of the nations; proclaim, praise, and say, “Save, Yahweh, your people, the remnant of Israel.”'
translation:
  language: hi
  text: 'क्योंकि यहोवा यों कहता है:


    “याकूब के लिए आनन्द से गाओ,


    और जातियों के शीर्ष पर जयजयकार करो;[a]


    घोषणा करो, स्तुति करो और कहो,


    ‘हे यहोवा, अपनी प्रजा को,


    इस्राएल के बचे हुए लोगों को बचा।’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी वाक्यांश कठिन है; शाब्दिक अर्थ “जातियों के सिर/शीर्ष पर” है। इसे “जातियों में सबसे प्रमुख के विषय में” अथवा जातियों के बीच सार्वजनिक रूप से जयजयकार करने के अर्थ में भी समझा गया है। यह इस्राएल की प्रमुखता की ओर भी संकेत कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित रूप ‘यहोवा’ द्वारा चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदले बिना व्यक्त किया गया है।
- source_word: רָנּוּ ... שִׂמְחָה
  choice: आनन्द से गाओ
  rationale: आज्ञार्थक क्रिया के ऊँचे, उल्लासपूर्ण स्वर और संज्ञा के क्रियाविशेषणात्मक प्रयोग को स्वाभाविक हिन्दी में रखा गया है।
- source_word: לְיַעֲקֹב
  choice: याकूब के लिए
  rationale: לְ की सम्बन्धसूचक व्यापकता को बनाए रखता है और पुनर्स्थापित प्रजा के विषय में आनन्द मनाने का भाव देता है।
- source_word: וְצַהֲלוּ
  choice: और ... जयजयकार करो
  rationale: यह समानान्तर आज्ञा सार्वजनिक और उल्लासपूर्ण पुकार को तीव्र करती है।
- source_word: בְּרֹאשׁ הַגּוֹיִם
  choice: जातियों के शिरोभाग में
  rationale: कठिन इब्रानी वाक्यांश ‘जातियों के सिर/मुख्य स्थान में’ के रूपक और स्थानगत अस्पष्टता को निकटता से बचाता है; अधिक स्पष्ट सम्भावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: הַשְׁמִיעוּ
  choice: सुनाओ
  rationale: हिफ़ील आज्ञार्थक का मूल भाव ‘सुनने योग्य बनाओ’ है; ‘सुनाओ’ संक्षिप्त और सार्वजनिक घोषणा के लिए स्वाभाविक है।
- source_word: הַלְלוּ
  choice: स्तुति करो
  rationale: उपासना-सन्दर्भ में הלל का सीधा और प्रतिष्ठित हिन्दी समतुल्य है।
- source_word: הוֹשַׁע
  choice: बचा
  rationale: यहोवा को सम्बोधित प्रत्यक्ष आज्ञार्थक विनती को सरल और धर्मवैज्ञानिक रूप से पारदर्शी हिन्दी में व्यक्त करता है।
- source_word: עַמְּךָ
  choice: अपनी प्रजा को
  rationale: सम्बोधन के कारण हिन्दी का आत्मवाचक ‘अपनी’ परमेश्वर और उसकी प्रजा के वाचाई सम्बन्ध को स्पष्ट और स्वाभाविक बनाता है।
- source_word: שְׁאֵרִית יִשְׂרָאֵל
  choice: इस्राएल के बचे हुए लोगों को
  rationale: ‘शेष’ की पारिभाषिक सम्भावना के बजाय ऐसा सामान्य आधुनिक वाक्यांश चुना गया है जो सुरक्षित बचे समुदाय का अर्थ स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल में व्यक्तिगत वाचाई नाम है। हिन्दी पाठकों के लिए स्थापित लिप्यन्तरण ‘यहोवा’ नाम को उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं करता।
- issue: בְּרֹאשׁ הַגּוֹיִם की व्याख्या
  choice: जातियों के शिरोभाग में
  alternative: जातियों के मुखिया के कारण / जातियों के सामने सार्वजनिक रूप से
  rationale: वाक्यांश संक्षिप्त और कठिन है। मुख्य पाठ रूपक को बनाए रखता है और यह निर्णीत नहीं करता कि संकेत इस्राएल की प्रमुखता, सर्वोच्च जाति के विषय में उल्लास, या जातियों के बीच सार्वजनिक उद्घोषणा की ओर है; विकल्प पादटिप्पणी में सुरक्षित हैं।
- issue: שְׁאֵרִית का सामुदायिक अर्थ
  choice: बचे हुए लोग
  alternative: इस्राएल का शेष भाग / अवशेष
  rationale: यह जीवित या सुरक्षित बचे समुदाय को दर्शाता है; सामान्य हिन्दी चुनी गई है, पर भविष्यद्वाणी में ‘शेष’ की अवधारणा को नकारा नहीं गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, काव्यात्मक पंक्ति-विन्यास और गरिमापूर्ण किन्तु सर्वसुलभ शब्दावली अपनाई गई है। ‘यों कहता है,’ ‘जयजयकार,’ और ‘स्तुति’ भविष्यद्वाणी के सार्वजनिक उपासना-संबंधी स्वर को बनाए रखते हैं।
