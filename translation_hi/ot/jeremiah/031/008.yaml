  naturalness: Most of the Hindi is clear and suitable for public reading. ‘उत्तर के देश’ is more idiomatic than ‘उत्तर देश,’ ‘प्रसव कर रही स्त्रियाँ’ is clearer and less medically suggestive than ‘प्रसव-पीड़ा में पड़ी स्त्रियाँ,’ and ‘लौटेगा’ better represents the straightforward future than ‘लौट आएगा.’
