  text: הִנְ/נִי֩ מֵבִ֨יא אוֹתָ֜/ם מֵ/אֶ֣רֶץ צָפ֗וֹן וְ/קִבַּצְתִּי/ם֮ מִ/יַּרְכְּתֵי אָרֶץ֒ בָּ֚/ם עִוֵּ֣ר וּ/פִסֵּ֔חַ הָרָ֥ה וְ/יֹלֶ֖דֶת יַחְדָּ֑ו קָהָ֥ל גָּד֖וֹל יָשׁ֥וּבוּ הֵֽנָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/008.yaml
  text: Behold[a], I am bringing them from the land of the north, and I will gather them from the farthest parts of the earth. Among them are the blind and the lame, the pregnant woman and the woman in labor, together; a great assembly will return here.
translation:
  language: hi
  text: देखो, मैं उन्हें उत्तर के देश से ले आ रहा हूँ और पृथ्वी[a] के दूर-दूर के भागों से उन्हें इकट्ठा करूँगा। उनमें अंधे और लँगड़े, गर्भवती स्त्रियाँ और प्रसव कर रही स्त्रियाँ—सब साथ होंगे। एक बड़ा जनसमूह यहाँ लौटेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘देश के दूर-दूर के भागों से’; हिब्रू शब्द אֶרֶץ का अर्थ सन्दर्भ के अनुसार ‘पृथ्वी’ या ‘देश’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: देखो, मैं
  rationale: ‘देखो’ भविष्यद्वाणी में प्रयुक्त ध्यान आकर्षित करने वाले संकेत की गंभीरता बनाए रखता है और आधुनिक हिन्दी में सहज है। सर्वनाम-सहित रचना ‘देखो, मैं’ हिब्रू अभिव्यक्ति के व्यक्तिगत बल को व्यक्त करती है।
- source_word: מֵבִיא
  choice: ले आ रहा हूँ
  rationale: הִנְנִי के साथ वर्तमान कृदन्त निकट, सजीव और निश्चित कार्य का बोध देता है; ‘ले आ रहा हूँ’ इस गतिशीलता और गन्तव्य की ओर लाने के भाव को स्वाभाविक हिन्दी में रखता है।
- source_word: מֵאֶרֶץ צָפוֹן
  choice: उत्तर देश से
  rationale: यह भौगोलिक अभिव्यक्ति को संक्षिप्त रूप में सुरक्षित रखता है और इसे केवल बाबेल मानकर अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: וְקִבַּצְתִּים
  choice: उन्हें इकट्ठा करूँगा
  rationale: यह बिखरे हुए लोगों को परमेश्वर द्वारा फिर एकत्र करने के पुनर्स्थापना-संबंधी भाव को स्पष्ट और सामान्य हिन्दी में व्यक्त करता है।
- source_word: מִיַּרְכְּתֵי אָרֶץ
  choice: पृथ्वी के दूर-दूर के भागों से
  rationale: יַרְכְּתֵי दूरस्थ छोरों या भागों को सूचित करता है। यह अनुवाद मुहावरे को स्पष्ट रखता है; אֶרֶץ के वैकल्पिक अर्थ ‘देश’ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: בָּם
  choice: उनमें
  rationale: यह लौटने वाले समुदाय के भीतर आगे गिनाए गए लोगों के समावेश को सीधे व्यक्त करता है।
- source_word: עִוֵּר וּפִסֵּחַ
  choice: अंधे और लँगड़े
  rationale: हिब्रू की संक्षिप्त जोड़ी को स्वाभाविक हिन्दी में बनाए रखता है और लौटने वालों में असमर्थ तथा कमजोर समझे जाने वाले लोगों के वास्तविक समावेश को दिखाता है।
- source_word: הָרָה וְיֹלֶדֶת
  choice: गर्भवती स्त्रियाँ और प्रसव-पीड़ा में पड़ी स्त्रियाँ
  rationale: हिब्रू के स्त्रीलिंग रूपों को स्पष्ट करता है। हिन्दी में बहुवचन इन्हें प्रतिनिधि वर्गों के रूप में सहजता से व्यक्त करता है, जबकि प्रसव की वास्तविक अवस्था को नरम या अस्पष्ट नहीं करता।
- source_word: יַחְדָּו
  choice: सब साथ
  rationale: लौटने वाले विविध लोगों की सामूहिक उपस्थिति पर हिब्रू के बल को संक्षिप्त और स्वाभाविक रूप में बनाए रखता है।
- source_word: קָהָל גָּדוֹל
  choice: एक बड़ा जनसमूह
  rationale: ‘जनसमूह’ קָהָל के एकत्र समुदाय के अर्थ को आधुनिक हिन्दी में स्पष्ट करता है और ‘कलीसिया’ जैसे बाद के पारिभाषिक अर्थ को आरोपित नहीं करता।
- source_word: יָשׁוּבוּ הֵנָּה
  choice: यहाँ लौट आएगा
  rationale: הֵנָּה के ‘इस स्थान की ओर’ वाले दिशात्मक बल और שׁוב के वापसी-संबंधी अर्थ दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: पुनर्स्थापित समुदाय में दुर्बल समझे जाने वाले लोगों का समावेश
  choice: अंधे, लँगड़े, गर्भवती स्त्रियाँ और प्रसव-पीड़ा में पड़ी स्त्रियाँ लौटने वाले समुदाय के वास्तविक सदस्य हैं।
  alternative: इस सूची को केवल भीड़ की विशालता बताने वाली अलंकारिक भाषा मानना।
  rationale: हिब्रू पाठ इन समूहों को स्पष्ट रूप से लौटने वालों के बीच रखता है। अनुवाद इस समावेश और दैवी करुणा को सुरक्षित रखता है, पर इससे आगे कोई विशिष्ट सैद्धान्तिक निष्कर्ष नहीं जोड़ता।
- issue: מִיַּרְכְּתֵי אָרֶץ में אֶרֶץ का भौगोलिक विस्तार
  choice: मुख्य पाठ में ‘पृथ्वी के दूर-दूर के भागों से’।
  alternative: ‘देश के दूर-दूर के भागों से’।
  rationale: पुनर्स्थापना-वाणी का व्यापक भौगोलिक सन्दर्भ ‘पृथ्वी’ का समर्थन करता है, पर אֶרֶץ का अर्थ ‘देश’ भी हो सकता है; इसलिए वास्तविक शाब्दिक अस्पष्टता पादटिप्पणी में रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सार्वजनिक वाचन के योग्य स्तर रखा गया है। ‘देखो’ भविष्यद्वाणी की गंभीर पुकार को बनाए रखता है; ‘जनसमूह’ सामान्य पाठक के लिए स्पष्ट है। विरामचिह्न सूची और ‘सब साथ’ के सामूहिक बल को उभारते हैं।
