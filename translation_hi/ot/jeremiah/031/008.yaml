    rationale: The participle יֹלֶדֶת denotes a woman giving birth; ‘प्रसव कर रही स्त्रियाँ’ is direct, natural, and faithful.
  - severity: low
    issue: ‘लौट आएगा’ can carry a completed/future-perfect nuance.
    rationale: The Hebrew imperfect יָשׁוּבוּ is adequately and more directly conveyed by ‘लौटेगा’ in this collective-subject construction.
