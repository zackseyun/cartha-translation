source:
  edition: WLC
  text: כִּֽי פָדָ֥ה יְהוָ֖ה אֶֽת יַעֲקֹ֑ב וּ/גְאָל֕/וֹ מִ/יַּ֖ד חָזָ֥ק מִמֶּֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/011.yaml
  text: For Yahweh has redeemed Jacob and ransomed him from the hand of one stronger than he[a].
translation:
  language: hi
  text: क्योंकि याहवे ने याकूब को छुड़ाया है और उसे उससे अधिक शक्तिशाली के हाथ से मुक्त किया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह आसपास की प्रतिज्ञा का आधार बताता है; हिन्दी में ‘क्योंकि’ इस व्याख्यात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: פָדָה
  choice: छुड़ा लिया है
  rationale: यह क्रिया दासता, संकट या अधिकार से मूल्य देकर अथवा सामर्थ्यपूर्वक छुड़ाने का भाव रखती है। ‘छुड़ा लिया है’ पूर्ण हुई उद्धारकारी क्रिया को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत वाचा-नाम है। हिन्दी बाइबिल परंपरा में परिचित रूप ‘यहोवा’ नाम को किसी उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- source_word: יַעֲקֹב
  choice: याकूब
  rationale: मूल पाठ में स्पष्टतः याकूब नाम है; उसका सामूहिक/राष्ट्रीय संकेत संदर्भ में बना रहता है, पर मुख्य पाठ में उसे ‘इस्राएल’ से नहीं बदला गया।
- source_word: וּגְאָלוֹ
  choice: और उसे ... मुक्त कराया है
  rationale: גאל निकट संबंधी के नाते छुड़ाने, वापस पाने या संकट से मुक्त करने के अर्थ-क्षेत्र से जुड़ा है। अलग हिन्दी अभिव्यक्ति פדה के साथ काव्यात्मक समानांतरता और हल्का शब्दार्थिक अंतर बनाए रखती है।
- source_word: מִיַּד
  choice: के हाथ से
  rationale: ‘हाथ’ अधिकार या नियंत्रण का इब्रानी रूपक है और हिन्दी में भी स्पष्ट तथा स्वाभाविक है।
- source_word: חָזָק מִמֶּנּוּ
  choice: उससे अधिक शक्तिशाली
  rationale: एकवचन विशेषण और तुलनात्मक מִמֶּנּוּ मिलकर याकूब से अधिक शक्तिशाली किसी व्यक्ति या सत्ता का संकेत देते हैं; अनिश्चितता को किसी खास शत्रु का नाम देकर नहीं सुलझाया गया।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु / याहवे
  rationale: नाम को उपाधि ‘प्रभु’ से बदलने के बजाय हिन्दी में प्रचलित व्यक्तिगत नाम ‘यहोवा’ रखा गया है।
- issue: פדה और גאל के समानांतर छुटकारे के शब्द
  choice: ‘छुड़ा लिया’ और ‘मुक्त कराया’—दो संबंधित किंतु अलग अभिव्यक्तियाँ
  alternative: दोनों के लिए ‘छुड़ा लिया’
  rationale: इब्रानी पद दो निकटार्थी क्रियाओं का प्रयोग करता है। हिन्दी में दो संबंधित अभिव्यक्तियाँ रखने से काव्यात्मक बनावट बचती है, बिना इनके बीच कोई कठोर धर्मवैज्ञानिक भेद आरोपित किए।
- issue: חָזָק מִמֶּנּוּ का संदर्भ
  choice: ‘उससे अधिक शक्तिशाली’
  alternative: ‘उसके लिए अत्यंत शक्तिशाली’ / ‘बलवान के’
  rationale: מִמֶּנּוּ का सर्वाधिक स्वाभाविक अर्थ तुलनात्मक है—याकूब से अधिक शक्तिशाली। मुख्य पाठ इस शक्ति को किसी विशिष्ट ऐतिहासिक शत्रु से नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली। ‘के हाथ से’ जैसे मूल रूपक को बनाए रखा गया है। इस पद में कोई फुटनोट आवश्यक नहीं माना गया, क्योंकि גאל का अर्थ ‘मुक्त कराया’ मुख्य पाठ में पर्याप्त रूप से व्यक्त है।
