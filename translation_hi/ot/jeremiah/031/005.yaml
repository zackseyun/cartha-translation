base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/005.yaml
  text: Again you will plant vineyards on the mountains of Samaria[a]; planters will plant and enjoy them.
translation:
  language: hi
  text: तू फिर सामरिया के पहाड़ों पर अंगूर की बारियाँ लगाएगी; बारी लगाने वाले उन्हें लगाएंगे और उनकी उपज का आनंद लेंगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, “और उन्हें साधारण उपयोग में लाएँगे”; यह मुहावरा दाख की बारी की उपज का उपयोग या उपभोग करने को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹד
  choice: फिर
  rationale: पुनर्स्थापना के संदर्भ में यह पहले के बाद नए सिरे से होनेवाले कार्य को व्यक्त करता है।
- source_word: תִּטְּעִי
  choice: तू…लगाएगी
  rationale: काल का अपूर्ण रूप भविष्य की ओर संकेत करता है और द्वितीय पुरुष स्त्रीलिंग एकवचन को हिंदी में स्त्रीलिंग क्रिया द्वारा सुरक्षित रखा गया है।
- source_word: כְרָמִים
  choice: अंगूर की बारियाँ
  rationale: यह आधुनिक हिंदी में दाख की खेती के भूखंडों के लिए स्पष्ट और सहज अभिव्यक्ति है।
- source_word: בְּהָרֵי שֹׁמְרוֹן
  choice: सामरिया के पहाड़ों पर
  rationale: मूल के स्थानवाचक संबंध और הָרִים के मूल अर्थ ‘पहाड़’ को बनाए रखता है।
- source_word: נָטְעוּ נֹטְעִים
  choice: लगानेवाले उन्हें लगाएंगे
  rationale: एक ही धातु की पुनरावृत्ति को यथासंभव बनाए रखते हुए, पूर्ण क्रिया को पुनर्स्थापना की सुनिश्चित भावी घटना के रूप में समझा गया है।
- source_word: וְחִלֵּלוּ
  choice: और उनकी उपज का आनंद लेंगे
  rationale: कृषि-संदर्भ में पिएल रूप का अर्थ दाख की बारी को सामान्य उपयोग में लाना, अर्थात उसकी उपज का उपभोग करना है; ‘अपवित्र करेंगे’ यहाँ भ्रामक होगा।
theological_decisions:
- issue: स्त्रीलिंग एकवचन संबोधन
  choice: ‘तू…लगाएगी’ द्वारा स्त्रीलिंग एकवचन को स्पष्ट रखा गया है।
  alternative: पिछले पद के आधार पर संबोधित पात्र को यहाँ स्पष्ट रूप से ‘कुँवारी इस्राएल’ कहना।
  rationale: व्याकरण पिछले संदर्भ की स्त्रीरूप में मानवीकृत इस्राएल की ओर संकेत करता है, पर इस पद में उसका नाम जोड़ना मूल से अधिक स्पष्टता आरोपित करता।
- issue: וְחִלֵּלוּ का कृषि-संदर्भ में अर्थ
  choice: दाख की बारी की उपज का आनंद लेना या उसका सामान्य उपयोग करना।
  alternative: शाब्दिक, धार्मिक अर्थ वाला ‘उसे अपवित्र करना’।
  rationale: यहाँ विषय पुनर्स्थापित कृषि-जीवन है। क्रिया उस दाख की बारी को सामान्य उपयोग में लाने का संकेत देती है जिसकी उपज पहले उपयोग में नहीं लाई गई थी; अतः ‘अपवित्र करना’ अनुचित धार्मिक अर्थ उत्पन्न करेगा।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिंदी अपनाई गई है। ‘तू’ और स्त्रीलिंग ‘लगाएगी’ मूल के प्रत्यक्ष स्त्रीलिंग एकवचन संबोधन को सुरक्षित रखते हैं। ‘अंगूर की बारियाँ’ सामान्य पाठक के लिए ‘दाख की बारियाँ’ से अधिक तुरंत बोधगम्य है।
