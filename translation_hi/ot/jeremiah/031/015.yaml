    issue: Rendering of refusal of comfort can be more direct
    rationale: “सांत्वना स्वीकार नहीं करती” is understandable, but “सांत्वना पाने से इनकार करती है” directly represents מֵאֲנָה לְהִנָּחֵם, ‘refuses to be comforted.’
