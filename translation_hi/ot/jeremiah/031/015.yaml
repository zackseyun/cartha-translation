  source_fidelity: The draft accurately conveys the prophetic formula, the passive hearing of a voice in Ramah, Rachel's mourning for her children, her refusal of comfort, and the contextual plural sense of the final idiom. The alternative singular reading is appropriately preserved in a footnote.
  naturalness: The wording is generally fluent modern standard Hindi. However, “विलाप और फूट-फूटकर रोने की आवाज़” redundantly repeats “आवाज़,” since the initial clause already introduces the heard voice. A small revision produces a more direct poetic parallel while retaining the Hebrew’s threefold mourning expression.
  terminology: “याहवे,” “रामा,” and “राहेल” are consistent transliterations. “बच्चों” appropriately represents the collective sense of בָּנֶיהָ in context. “सांत्वना पाने से इनकार करती है” more directly and naturally renders refusal to be comforted than “सांत्वना स्वीकार नहीं करती.”
  issues:
  - severity: low
    issue: Redundant repetition of “आवाज़” in the mourning phrase
    rationale: The Hebrew has one “voice” followed by appositional descriptions—lamentation and bitter weeping. Repeating “आवाज़” after “रोने” is not required in Hindi and slightly weakens the poetic construction.
