id: JER.31.15
reference: Jeremiah 31:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה ק֣וֹל בְּ/רָמָ֤ה נִשְׁמָע֙ נְהִי֙ בְּכִ֣י תַמְרוּרִ֔ים רָחֵ֖ל מְבַכָּ֣ה עַל בָּנֶ֑י/הָ מֵאֲנָ֛ה לְ/הִנָּחֵ֥ם עַל בָּנֶ֖י/הָ כִּ֥י אֵינֶֽ/נּוּ׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/015.yaml
  text: 'Thus says Yahweh: “A voice is heard in Ramah[a], lamentation and bitter weeping—Rachel weeping for her children. She refuses to be comforted for her children[b], because they are no more.”'
translation:
  language: hi
  text: 'याहवे यों कहता है:


    “रामा में एक आवाज़ सुनाई देती है[a]—


    विलाप और कड़वा रोना।


    राहेल अपने बच्चों के लिए रो रही है;


    वह अपने बच्चों के लिए सांत्वना पाने से इनकार करती है,


    क्योंकि वे अब नहीं रहे[b]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: रामा बिन्यामीन के क्षेत्र से जुड़ा एक नगर था। यहाँ राहेल को काव्यात्मक रूप से अपने वंशजों का शोक मनाती हुई कुलमाता के रूप में दिखाया गया है।
    reason: cultural_note
  - marker: b
    text: या, “क्योंकि वह अब नहीं रहा।” इब्रानी में यहाँ एकवचन रूप है, यद्यपि संदर्भ में राहेल के बच्चों का सामूहिक रूप से उल्लेख है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के विशिष्ट इब्रानी नाम को अर्थगत उपाधि से बदलने के बजाय आधुनिक हिन्दी लिप्यंतरण में रखा गया है।
- source_word: כֹּה אָמַר
  choice: यों कहता है
  rationale: यह भविष्यद्वक्ताओं का मानक संदेशवाहक सूत्र है; यह हिन्दी में स्वाभाविक रहते हुए मूल की औपचारिक घोषणा को बनाए रखता है।
- source_word: קוֹל בְּרָמָה נִשְׁמָע
  choice: रामा में एक आवाज़ सुनाई देती है
  rationale: קוֹל की व्यापक ध्वनि/आवाज़ संबंधी अर्थ-सीमा और נִשְׁמָע के कर्मवाच्य भाव को सुरक्षित रखा गया है।
- source_word: נְהִי בְּכִי תַמְרוּרִים
  choice: विलाप और फूट-फूटकर रोने की आवाज़
  rationale: निरंतर और अत्यंत दुःखभरे रोने का भाव सरल आधुनिक हिन्दी में व्यक्त होता है; आरंभिक 'आवाज़' से इसका व्याकरणिक संबंध स्पष्ट किया गया है।
- source_word: רָחֵל מְבַכָּה עַל בָּנֶיהָ
  choice: राहेल अपने बच्चों के लिए रो रही है
  rationale: राहेल नाम का प्रचलित हिन्दी रूप रखा गया है और בָּנִים को इस सामूहिक वंश-संदर्भ में केवल 'पुत्रों' के बजाय 'बच्चों' के रूप में प्रस्तुत किया गया है।
- source_word: מֵאֲנָה לְהִנָּחֵם
  choice: वह ... सांत्वना स्वीकार नहीं करती
  rationale: इब्रानी में इनकार और सांत्वना पाने/स्वीकार करने का भाव है; यह हिन्दी में स्वाभाविक और अर्थतः स्पष्ट है।
- source_word: כִּי אֵינֶנּוּ
  choice: क्योंकि वे अब नहीं रहे
  rationale: एकवचन रूप के बावजूद निकट संदर्भ में 'उसके बच्चे' सामूहिक पूर्वपद है; मुख्य पाठ में प्रसंगानुकूल बहुवचन रखा और रूपगत अस्पष्टता पादटिप्पणी में बताई गई है।
theological_decisions:
- issue: כִּי אֵינֶנּוּ में एकवचन रूप और सामूहिक पूर्वपद בָּנֶיהָ का संबंध
  choice: मुख्य पाठ में “क्योंकि वे अब नहीं रहे”
  alternative: “क्योंकि वह अब नहीं रहा”
  rationale: इब्रानी रूप एकवचन है, पर कविता राहेल के बच्चों/वंशजों को सामूहिक रूप से देखती है। हिन्दी में बहुवचन प्रसंग को स्पष्ट करता है, जबकि पादटिप्पणी मूल के एकवचन रूप को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण भविष्यद्वक्ताई लय और सहज बोधगम्यता। काव्य-पंक्तियों से विलाप की गति उभारी गई है। उपलब्ध अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी चिह्नों और उनकी सामग्री का क्रम परस्पर उलटा प्रतीत होता है; हिन्दी पाठ में सांस्कृतिक टिप्पणी को 'रामा' पर [a] और व्याकरणिक विकल्प को अंतिम वाक्य पर [b] लगाया गया है।
