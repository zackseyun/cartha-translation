  text: וְ/הָיָ֞ה כַּ/אֲשֶׁ֧ר שָׁקַ֣דְתִּי עֲלֵי/הֶ֗ם לִ/נְת֧וֹשׁ וְ/לִ/נְת֛וֹץ וְ/לַ/הֲרֹ֖ס וּ/לְ/הַאֲבִ֣יד וּ/לְ/הָרֵ֑עַ כֵּ֣ן אֶשְׁקֹ֧ד עֲלֵי/הֶ֛ם לִ/בְנ֥וֹת וְ/לִ/נְט֖וֹעַ נְאֻם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/028.yaml
  text: And it shall be that[a], just as I watched over them to uproot and to tear down and to overthrow and to destroy and to bring harm, so I will watch over them to build and to plant, declares Yahweh.
translation:
  language: hi
  text: “और ऐसा होगा कि जैसे मैंने उन्हें उखाड़ने, ढा देने, ध्वस्त करने, नष्ट करने और उन पर विपत्ति लाने[a] के लिए उन पर नज़र रखी थी, वैसे ही मैं उनका निर्माण करने और उन्हें रोपने के लिए उन पर नज़र रखूँगा,” याहवे की यह घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्हें हानि पहुँचाने।” हिब्रू क्रिया न्याय के रूप में विपत्ति या हानि पहुँचाने का भाव दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: और ऐसा होगा कि
  rationale: भविष्यसूचक कथन के आगे बढ़ने का भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है, बिना अनावश्यक पुरातनता के।
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: जैसे ... वैसे ही
  rationale: बीते न्याय और भावी पुनर्स्थापना के बीच मूल पाठ की स्पष्ट तुलना और समानांतरता बनाए रखता है।
- source_word: שָׁקַדְתִּי / אֶשְׁקֹד
  choice: नज़र रखी थी / नज़र रखूँगा
  rationale: क्रिया में निहित सजग और उद्देश्यपूर्ण ध्यान को दोनों अर्धांशों में एक ही अभिव्यक्ति से सुरक्षित रखता है; इसे केवल संरक्षण के अर्थ तक सीमित नहीं करता।
- source_word: עֲלֵיהֶם
  choice: उन पर
  rationale: שׁקד के साथ मूल पूर्वसर्ग और दोनों अर्धांशों की समानांतर रचना को बनाए रखता है।
- source_word: לִנְתוֹשׁ
  choice: उखाड़ने
  rationale: यिर्मयाह में प्रचलित कृषि-रूपक को स्पष्ट और स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: וְלִנְתוֹץ
  choice: ढा देने
  rationale: विनाशकारी क्रियाओं की क्रमिक शृंखला में इमारत या संरचना गिराने का भाव देता है।
- source_word: וְלַהֲרֹס
  choice: ध्वस्त करने
  rationale: निकटवर्ती נתץ और אבד से यथासंभव अलग शब्द रखते हुए संचयी विनाश-चित्र को बनाए रखता है।
- source_word: וּלְהַאֲבִיד
  choice: नष्ट करने
  rationale: हिफ़ील रूप के कारण होने वाले विनाश का सीधा और प्रचलित हिन्दी रूप है।
- source_word: וּלְהָרֵעַ
  choice: उन पर विपत्ति लाने
  rationale: न्याय के प्रसंग में क्रिया के ‘बुराई/हानि/विपत्ति घटित कराना’ अर्थ को नैतिक बुराई करने के भ्रामक संकेत के बिना व्यक्त करता है; वास्तविक शाब्दिक विकल्प फुटनोट में रखा गया है।
- source_word: לִבְנוֹת
  choice: उनका निर्माण करने
  rationale: पुनर्स्थापना के निर्माण-रूपक को रखता है और हिन्दी में व्यक्तियों/समुदाय के संदर्भ में ‘उन्हें बनाने’ की अस्वाभाविकता से बचता है।
- source_word: וְלִנְטוֹעַ
  choice: उन्हें रोपने
  rationale: आरंभ के ‘उखाड़ने’ के विपरीत कृषि-रूपक और पुनर्स्थापना की छवि को बनाए रखता है।
- source_word: נְאֻם יְהוָה
  choice: याहवे की यह घोषणा है
  rationale: भविष्यद्वाणी के प्रामाणिक समापन-सूत्र को स्वाभाविक हिन्दी में देता है और יהוה को उसके व्यक्तिगत नाम के रूप में लिप्यंतरित करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है; ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: 'न्याय में परमेश्वर की सक्रियता: וּלְהָרֵעַ'
  choice: उन पर विपत्ति लाने
  alternative: उन्हें हानि पहुँचाने / उनके साथ बुरा करने
  rationale: कारक क्रिया और न्याय के प्रसंग को स्पष्ट रखता है, पर ‘बुरा करने’ से उत्पन्न नैतिक बुराई के अनावश्यक निष्कर्ष से बचता है; अर्थगत तनाव को फुटनोट में स्वीकार किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक पाठ के योग्य शैली अपनाई गई है। पाँच विनाशकारी क्रियाओं की संचयी लय तथा ‘जैसे ... वैसे ही’ की समानांतर संरचना सुरक्षित रखी गई है। ‘नज़र रखना’ दोनों ओर जानबूझकर समान है, ताकि मूल में न्याय और पुनर्स्थापना पर एक ही सजग ईश्वरीय ध्यान का तनाव बना रहे।
