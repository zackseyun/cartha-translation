lexical_decisions:
- source_word: וְיָשְׁבוּ בָהּ
  choice: उसमें बसेंगे
  rationale: יָשַׁב निवास करने या बसने का भाव देता है; स्त्रीलिंग एकवचन प्रत्यय को ‘उसमें’ से स्पष्ट रखा गया है और पुनर्स्थापना के प्रसंग में क्रिया को भविष्यकाल में प्रस्तुत किया गया है।
- source_word: יְהוּדָה וְכָל עָרָיו
  choice: यहूदा और उसके सब नगर
  rationale: यहूदा यहाँ भूभाग अथवा उसके निवासियों का सामूहिक नाम है। עָרָיו का पुल्लिंग एकवचन प्रत्यय ‘उसके’ से स्वाभाविक हिन्दी में सुरक्षित रहता है।
- source_word: יַחְדָּו
  choice: एक साथ
  rationale: यह साझा और संयुक्त निवास का अर्थ स्पष्ट तथा स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אִכָּרִים
  choice: किसान
  rationale: यह भूमि जोतने वाले कृषि-कर्मियों को दर्शाता है; ‘किसान’ आधुनिक हिन्दी का सहज और स्पष्ट शब्द है।
- source_word: וְנָסְעוּ בַּעֵדֶר
  choice: और वे भी जो झुंड के साथ कूच करते हैं
  rationale: נָסַע का मूल भाव पड़ाव उठाकर चलने या कूच करने का है। इब्रानी में ‘चरवाहे’ संज्ञा स्पष्ट रूप से नहीं है, इसलिए उसे मुख्य पाठ में जोड़ने के बजाय सापेक्ष उपवाक्य रखा गया है। עֵדֶר को व्यापक पशु-समूह के अर्थ में ‘झुंड’ कहा गया है।
