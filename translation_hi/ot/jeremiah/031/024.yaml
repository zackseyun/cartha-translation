  text: And Judah and all its cities will dwell there together[a], farmers and those who journey with the flock.
translation:
  language: hi
  text: और यहूदा और उसके सब नगर उसमें एक साथ बसेंगे—किसान और वे जो झुंड के साथ कूच करते हैं[a]।
  philosophy: optimal-equivalence
  footnotes:
