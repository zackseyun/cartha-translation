source:
  edition: WLC
  text: הִנֵּ֛ה יָמִ֥ים נְאֻם יְהוָ֑ה וְ/נִבְנְתָ֤ה הָ/עִיר֙ לַֽ/יהוָ֔ה מִ/מִּגְדַּ֥ל חֲנַנְאֵ֖ל שַׁ֥עַר הַ/פִּנָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/038.yaml
  text: Behold[a], days are coming, declares Yahweh, when the city will be rebuilt for Yahweh, from the Tower of Hananel to the Corner Gate.
translation:
  language: hi
  text: देखो, ऐसे दिन आ रहे हैं—यह याहवे की घोषणा है—जब यह नगर याहवे के लिए हननेल के गुम्मट से कोने के फाटक तक फिर से बनाया जाएगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बनाया जाएगा।” हिब्रू कर्मवाच्य क्रिया का अर्थ बनाना या फिर से बनाना, दोनों हो सकता है; यहाँ पुनर्स्थापना का प्रसंग “फिर से बनाया जाएगा” अर्थ का समर्थन करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह भविष्यवाणी की महत्त्वपूर्ण घोषणा की ओर ध्यान खींचता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: יָמִים
  choice: ऐसे दिन आ रहे हैं
  rationale: हिब्रू भविष्यसूचक मुहावरे को स्वाभाविक हिन्दी में व्यक्त करता है; ‘ऐसे’ आगे बताई जाने वाली घटना से दिनों को जोड़ता है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: औपचारिक और अधिकारपूर्ण भविष्यसूचक सूत्र की शक्ति को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम का लिप्यंतरण करता है, उसे किसी उपाधि से नहीं बदलता।
- source_word: וְנִבְנְתָה
  choice: फिर से बनाया जाएगा
  rationale: निफ़अल के कर्मवाच्य अर्थ को रखता है; पुनर्स्थापना का प्रसंग पुनर्निर्माण की ओर संकेत करता है, जबकि मूल क्रिया अकेले ‘बनाया जाएगा’ भी हो सकती है।
- source_word: הָעִיר
  choice: यह नगर
  rationale: हिब्रू में केवल ‘नगर’ है; हिन्दी में प्रसंगतः निर्दिष्ट नगर को ‘यह नगर’ कहना स्वाभाविक है, बिना ‘यरूशलेम’ नाम जोड़े।
- source_word: לַיהוָה
  choice: याहवे के लिए
  rationale: लामेद यहाँ समर्पण या संबंध का भाव देता है; नगर याहवे के लिए बनाया जाएगा।
- source_word: מִמִּגְדַּל חֲנַנְאֵל
  choice: हननेल के गुम्मट से
  rationale: מִן आरंभ-बिंदु बताता है; ‘गुम्मट’ नगर की किलेबंदी में स्थित मीनार के लिए उपयुक्त पारंपरिक हिन्दी शब्द है।
- source_word: שַׁעַר הַפִּנָּה
  choice: कोने के फाटक तक
  rationale: यह नगर के एक नामित फाटक को दर्शाता है; आरंभिक ‘से’ के अनुरूप हिन्दी में ‘तक’ स्पष्ट रूप से जोड़ा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे प्रयुक्त है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और नाम को उपाधि से प्रतिस्थापित नहीं करता।
- issue: नगर का बनना या फिर से बनाया जाना
  choice: फिर से बनाया जाएगा
  alternative: बनाया जाएगा
  rationale: व्याकरणिक रूप अपने आप में दोनों अर्थों की अनुमति देता है, पर यिर्मयाह 31 का पुनर्स्थापना-संदर्भ पुनर्निर्माण का समर्थन करता है; विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण भविष्यसूचक गद्य। ‘देखो’ ध्यानाकर्षक הִנֵּה को स्वाभाविक रूप देता है; डैश घोषणा-सूत्र को स्पष्ट रखते हैं। ‘नगर’, ‘गुम्मट’ और ‘फाटक’ बाइबिलीय नगर-विन्यास के लिए सुबोध, प्रतिष्ठित शब्द हैं।
