id: JER.31.19
reference: Jeremiah 31:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּֽי אַחֲרֵ֤י שׁוּבִ/י֙ נִחַ֔מְתִּי וְ/אַֽחֲרֵי֙ הִוָּ֣דְעִ֔/י סָפַ֖קְתִּי עַל יָרֵ֑ךְ בֹּ֚שְׁתִּי וְ/גַם נִכְלַ֔מְתִּי כִּ֥י נָשָׂ֖אתִי חֶרְפַּ֥ת נְעוּרָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/019.yaml
  text: For after I turned back[a], I repented; and after I was instructed, I struck my thigh. I was ashamed, and also humiliated[c][b], because I bore the disgrace of my youth.
translation:
  language: hi
  text: क्योंकि लौट आने के बाद मैंने पश्चाताप किया; और मुझे समझाए जाने के बाद मैंने अपनी जाँघ पर हाथ मारा।[a] मैं लज्जित हुआ और अपमानित भी हुआ, क्योंकि मैंने अपनी जवानी की बदनामी सही।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: जाँघ पर हाथ मारना शोक, सदमे या गहरे पछतावे का इब्रानी सांस्कृतिक संकेत था।
    reason: cultural_note
  - marker: b
    text: या ‘अपनी जवानी की निंदा’।
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוּבִי
  choice: लौट आने
  rationale: שׁוב का मूल भाव मुड़ना या लौटना है। इसे נחם से अलग रखा गया है, ताकि लौटने और उसके बाद पश्चाताप करने की क्रमिकता बनी रहे।
- source_word: נִחַמְתִּי
  choice: मैंने पश्चाताप किया
  rationale: इस अंगीकार के संदर्भ में נחם केवल खेद नहीं, बल्कि अपने पिछले आचरण पर नैतिक पछतावा व्यक्त करता है।
- source_word: הִוָּדְעִי
  choice: मुझे समझ दी गई
  rationale: ידע के निफ़अल रूप में किसी बात का बोध कराया जाना निहित हो सकता है। यह अनुवाद कर्मवाच्य भाव और सुधार लाने वाली समझ—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: סָפַקְתִּי עַל יָרֵךְ
  choice: मैंने अपनी जाँघ पर हाथ मारा
  rationale: यह शोक, सदमे या गहरे पछतावे का शारीरिक संकेत है। हिन्दी में ‘जाँघ पर हाथ मारा’ मूल बिंब को स्पष्ट और स्वाभाविक ढंग से बनाए रखता है।
- source_word: בֹּשְׁתִּי
  choice: मैं लज्जित हुआ
  rationale: בושׁ के लज्जा अनुभव करने के सीधे अर्थ को गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: נִכְלַמְתִּי
  choice: अपमानित भी
  rationale: כלם की गहरी लज्जा अथवा अपमान की अनुभूति को पहले क्रियापद בושׁ से अलग रखते हुए व्यक्त किया गया है।
- source_word: נָשָׂאתִי
  choice: मैंने ... सही
  rationale: נשא यहाँ बदनामी का बोझ उठाने या सहने के अर्थ में है; ‘सही’ आधुनिक हिन्दी में इस अनुभूत परिणाम को स्वाभाविक रूप से बताता है।
- source_word: חֶרְפַּת נְעוּרָי
  choice: अपनी जवानी की बदनामी
  rationale: חֶרְפָּה निंदा, बदनामी या तिरस्कार को सूचित करता है। ‘जवानी की बदनामी’ मूल संबंध की अस्पष्टता बनाए रखती है—यह जवानी के आचरण से उपजी बदनामी या उस समय झेली गई निंदा हो सकती है।
- source_word: כִּי
  choice: क्योंकि
  rationale: आरंभिक כִּי को पिछले संदर्भ की व्याख्या करने वाला संबंधबोधक माना गया है; अंतिम כִּי वक्ता की लज्जा का कारण बताता है।
theological_decisions:
- issue: एप्रैम के अंगीकार में लौटना और पश्चाताप करना
  choice: दो अलग चरणों के रूप में ‘लौट आने के बाद मैंने पश्चाताप किया’
  alternative: ‘पश्चाताप करने के बाद मुझे पछतावा हुआ’ अथवा दोनों क्रियाओं को लगभग समानार्थी बनाना
  rationale: इब्रानी में שׁוב और נחם दो अलग क्रियाएँ हैं। अनुवाद उनके संबंध को बनाए रखता है, पर उन्हें एक ही धार्मिक तकनीकी अर्थ में नहीं मिलाता।
- issue: הִוָּדְעִי में बोध या शिक्षा का कर्ता
  choice: कर्मवाच्य ‘मुझे समझ दी गई’
  alternative: ‘मैं समझ गया’ या ‘तूने मुझे शिक्षा दी’
  rationale: मूल रूप कर्मवाच्य है, पर इस पद में कर्ता स्पष्ट नहीं है। इसलिए ईश्वर को स्पष्ट कर्ता बनाकर मूल की वास्तविक अस्पष्टता को समाप्त नहीं किया गया।
- issue: ‘जवानी की बदनामी’ का आशय
  choice: मूल संबंध को खुला रखा गया
  alternative: इसे स्पष्ट रूप से ‘जवानी के पापों की लज्जा’ कहना
  rationale: पाठ חֶרְפַּת נְעוּרָי कहता है और पाप शब्द नहीं जोड़ता। संदर्भ भटकाव और पश्चाताप का है, फिर भी अनुवाद उससे आगे कोई विशिष्ट धर्मवैज्ञानिक व्याख्या आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और अंगीकारात्मक शैली अपनाई गई है। ‘लौटना’ और ‘पश्चाताप करना’ अलग रखे गए हैं; ‘लज्जित’ तथा ‘अपमानित’ निकटार्थी होते हुए भी मूल की दो अलग क्रियाओं को दर्शाते हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
