  to: क्योंकि लौट आने के बाद मैंने पश्चाताप किया; और मुझे समझाए जाने के बाद मैंने अपनी जाँघ पर हाथ मारा।[a] मैं लज्जित हुआ और अपमानित भी हुआ, क्योंकि मैंने अपनी जवानी की बदनामी सही।[b]
