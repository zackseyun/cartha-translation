review_pass:
  verdict: revise
  source_fidelity: 'Draft preserves the sequence of distinct Hebrew verbs היטב: turning/returning (שוב), then repentance/regret (נחם), followed by being instructed or brought to knowledge (הודע). The physical gesture and the concluding burden of youthful reproach are retained. However, ‘यहाँ तक कि’ introduces an escalatory sense not present in וגם (‘also’), and ‘मुझे समझ दी गई’ is less idiomatic and less clearly equivalent to the passive ‘after I was instructed.’'
  naturalness: The register is generally dignified modern Hindi. ‘मुझे समझाए जाने के बाद’ is more natural than ‘जब मुझे समझ दी गई,’ while retaining the unstated agent. Replacing ‘यहाँ तक कि’ with ‘और ... भी’ gives a direct, natural rendering of the coordinate Hebrew expression.
  terminology: ‘पश्चाताप,’ ‘लज्जित,’ and ‘अपमानित’ appropriately preserve the penitential and shame vocabulary without conflating the two Hebrew shame verbs. ‘जवानी की बदनामी’ is serviceable for חרפת נעורי; the alternative ‘निंदा’ remains appropriately footnoted.
  issues:
  - severity: medium
    issue: ‘यहाँ तक कि’ renders וְגַם too strongly.
    rationale: וְגַם means ‘and also/and moreover,’ not ‘even/to such an extent that.’ The Hindi wording should coordinate the two expressions of shame without adding escalation.
  - severity: low
    issue: ‘मुझे समझ दी गई’ is awkward Hindi for הִוָּדְעִי.
    rationale: The Hebrew passive infinitive means being made to know/instructed. ‘मुझे समझाए जाने के बाद’ is idiomatic, preserves the passive sense, and does not specify the agent.
  revised_text: क्योंकि लौट आने के बाद मैंने पश्चाताप किया; और मुझे समझाए जाने के बाद मैंने अपनी जाँघ पर हाथ मारा।[a] मैं लज्जित हुआ और अपमानित भी हुआ, क्योंकि मैंने अपनी जवानी की बदनामी सही।[b]
