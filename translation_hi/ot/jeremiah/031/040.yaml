  text: וְ/כָל הָ/עֵ֣מֶק הַ/פְּגָרִ֣ים וְ/הַ/דֶּ֡שֶׁן וְ/כָֽל ה/שרמות עַד נַ֨חַל קִדְר֜וֹן עַד פִּנַּ֨ת שַׁ֤עַר הַ/סּוּסִים֙ מִזְרָ֔חָ/ה קֹ֖דֶשׁ לַֽ/יהוָ֑ה לֹֽא יִנָּתֵ֧שׁ וְֽ/לֹא יֵהָרֵ֛ס ע֖וֹד לְ/עוֹלָֽם־׀־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/040.yaml
  text: And the whole valley of the corpses and the ashes[a], and all the terraces as far as the Kidron Valley, as far as the corner of the Horse Gate toward the east, shall be holy to Yahweh[c][b]. It shall not be uprooted or overthrown again forever.
translation:
  language: hi
  text: और लाशों और राख की सारी घाटी, और किद्रोन घाटी[b] तक के सभी सीढ़ीदार ढलान[a], पूर्व की ओर घोड़ा-फाटक के कोने तक—यह पूरा क्षेत्र यहोवा के लिए पवित्र होगा। यह फिर कभी न उखाड़ा जाएगा, न ढाया जाएगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस कठिन इब्रानी शब्द का अनुवाद ‘खेत’ या ‘ढलान’ भी हो सकता है; परंपरागत रूप से इसे यरूशलेम के आसपास की सीढ़ीनुमा भूमि समझा गया है।
    reason: lexical_alternative
  - marker: b
    text: ‘किद्रोन घाटी’ का अनुवाद ‘किद्रोन नाला’ भी हो सकता है, क्योंकि इब्रानी शब्द घाटी, वादी या मौसमी जलधारा को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: c
    text: 'शाब्दिक भाव: “यह फिर कभी उखाड़ा या ढाया नहीं जाएगा।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֵמֶק
  choice: घाटी
  rationale: भौगोलिक सीमा-वर्णन में עֵמֶק का स्वाभाविक आधुनिक हिन्दी रूप ‘घाटी’ है।
- source_word: הַפְּגָרִים
  choice: लाशों
  rationale: פֶּגֶר मृत शरीर को सूचित करता है; ‘लाशों’ से स्थान की पूर्व अशुद्धता का कठोर चित्र स्पष्ट रहता है।
- source_word: הַדֶּשֶׁן
  choice: राख
  rationale: इस प्रसंग में דֶּשֶׁן संभवतः बलि अथवा कूड़े के निपटान से जुड़ी राख के ढेरों को दर्शाता है।
- source_word: השרמות
  choice: सीढ़ीदार ढलान
  rationale: इब्रानी रूप कठिन है; यह सम्भवतः यरूशलेम के आसपास की सीढ़ीनुमा भूमि या ढलानों का संकेत है। ‘सीढ़ीदार ढलान’ स्थलाकृतिक अर्थ को रखता है, जबकि विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: נַחַל קִדְרוֹן
  choice: किद्रोन घाटी
  rationale: נַחַל घाटी, वादी अथवा मौसमी जलधारा को सूचित कर सकता है। सीमा-वर्णन में ‘किद्रोन घाटी’ सहज है; वैकल्पिक अर्थ पादटिप्पणी में है।
- source_word: פִּנַּת שַׁעַר הַסּוּסִים
  choice: घोड़ा फाटक के कोने
  rationale: פִּנָּה का अर्थ कोना है; नगर-सीमा के प्रसंग में यह सीधा और बोधगम्य अनुवाद है।
- source_word: מִזְרָחָה
  choice: पूर्व की ओर
  rationale: दिशासूचक प्रत्यय का स्वाभाविक हिन्दी रूप।
- source_word: קֹדֶשׁ לַיהוָה
  choice: यहोवा के लिए पवित्र
  rationale: समर्पण-सूचक सूत्र पवित्रता और यहोवा के लिए अलग किए जाने, दोनों अर्थों को व्यक्त करता है।
- source_word: לֹא יִנָּתֵשׁ
  choice: उखाड़ा नहीं जाएगा
  rationale: נתשׁ का निफ़अल रूप ‘उखाड़ा जाना’ है और यिर्मयाह की विनाश-पुनर्स्थापना संबंधी भाषा को बनाए रखता है।
- source_word: וְלֹא יֵהָרֵס
  choice: ढाया नहीं जाएगा
  rationale: הרס का निफ़अल रूप गिराए या ध्वस्त किए जाने को दर्शाता है; ‘ढाया’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: עוֹד לְעוֹלָם
  choice: फिर कभी ... नहीं
  rationale: עוֹד और לְעוֹלָם मिलकर निषेध की स्थायी और अंतिम प्रकृति बताते हैं; हिन्दी में ‘फिर कभी नहीं’ यही बल स्वाभाविक ढंग से देता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में वाचा का विशिष्ट नाम है। आधुनिक हिन्दी बाइबलीय पाठकों के लिए प्रचलित नामरूप ‘यहोवा’ रखा गया है, न कि सामान्य उपाधि ‘प्रभु’।
- issue: पवित्रीकरण का विस्तार
  choice: वर्णित पूरा क्षेत्र यहोवा के लिए पवित्र होगा
  alternative: केवल नगर का मुख्य भाग पवित्र होगा
  rationale: वाक्य-विन्यास में सूचीबद्ध संपूर्ण भूभाग विधेय קֹדֶשׁ לַיהוָה के अधीन आता है। ‘यह पूरा क्षेत्र’ इसे स्पष्ट करता है, बिना उस आश्चर्यजनक उलटाव को घटाए जिसमें पहले अशुद्ध माना गया भूभाग पवित्र होता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज सीमा-वर्णन। लंबे इब्रानी वाक्य को पठनीय बनाने के लिए डैश और फिर अलग अंतिम वाक्य रखा गया है। सभी पादटिप्पणी-चिह्न संबंधित पदों या वाक्यांशों के तुरंत बाद दिए गए हैं।
