  edition: WLC
  text: כִּ֥י הִרְוֵ֖יתִי נֶ֣פֶשׁ עֲיֵפָ֑ה וְ/כָל נֶ֥פֶשׁ דָּאֲבָ֖ה מִלֵּֽאתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/025.yaml
  text: For I have satisfied the weary soul[b][a], and every faint soul I have filled.
translation:
  language: hi
  text: क्योंकि मैंने थके-माँदे प्राण को तृप्त किया है[a], और हर व्याकुल प्राण को भर दिया है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “तृप्त किया है” का अनुवाद “तरोताज़ा किया है” भी हो सकता है; इब्रानी क्रिया का मूल भाव भरपूर पानी पिलाना है।
    reason: lexical_alternative
  - marker: b
    text: “व्याकुल प्राण” का अनुवाद “दुखी प्राण,” “शोकाकुल प्राण,” या “क्षीण प्राण” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह निकटवर्ती प्रतिज्ञा का आधार या कारण बताता है; ‘क्योंकि’ हिन्दी में इसके संयोजक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הִרְוֵיתִי
  choice: मैंने ... तृप्त किया है
  rationale: रוה के हिफ़ील रूप में किसी को भरपूर पिलाने और इस प्रकार तृप्त अथवा तरोताज़ा करने का भाव है। ‘तृप्त किया है’ रूपक और प्रचुरता—दोनों को सहज हिन्दी में रखता है।
- source_word: נֶפֶשׁ
  choice: प्राण
  rationale: यहाँ शब्द पूरे जीवित और आंतरिक व्यक्ति की ओर संकेत करता है। ‘प्राण’ काव्यात्मक गरिमा बनाए रखता है और ‘आत्मा’ से उत्पन्न हो सकने वाले अनावश्यक तकनीकी द्वैतवादी अर्थ को थोपता नहीं।
- source_word: עֲיֵפָה
  choice: थके-माँदे
  rationale: यह शारीरिक और भावनात्मक रूप से निढाल या क्लांत होने का व्यापक भाव सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וְכָל
  choice: और हर
  rationale: संयोजक तथा वितरणात्मक अर्थ को सरल और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: דָּאֲבָה
  choice: मुरझाए
  rationale: यह दुख, शोक या क्षीण होकर मुरझाने की दशा को व्यक्त कर सकता है। ‘मुरझाए’ समानांतर काव्यात्मक पुनर्स्थापन के बिंब को बनाए रखता है, जबकि विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: מִלֵּאתִי
  choice: मैंने ... भर दिया है
  rationale: מלא के पियेल रूप का ठोस अर्थ ‘भर देना’ है। यह पहले खंड की तृप्ति और प्रचुरता के समानांतर बिंब को सुरक्षित रखता है।
theological_decisions:
- issue: נֶפֶשׁ का मानवशास्त्रीय अर्थ
  choice: दोनों प्रसंगों में ‘प्राण’
  alternative: व्यक्ति; जीवन; मन; आत्मा
  rationale: पद पूरे जीवित और आंतरिक व्यक्ति की पुनर्बहाली की काव्यात्मक बात करता है। ‘प्राण’ साहित्यिक भार बनाए रखता है, पर किसी विशिष्ट आत्मा-शरीर सिद्धांत को अनिवार्य नहीं करता।
- issue: पूर्ण क्रियाओं का काल और पक्ष
  choice: हिन्दी पूर्ण वर्तमान—‘मैंने ... किया है’
  alternative: साधारण भूतकाल; प्रसंगानुसार आश्वस्त भविष्यकाल
  rationale: इब्रानी पूर्ण रूप संपन्न कार्य अथवा भविष्यद्वाणी में निश्चित माने गए ईश्वरीय कार्य को व्यक्त कर सकते हैं। पूर्ण वर्तमान मूल रूप के संपन्नता-भाव को रखता है और भविष्यकाल को चुपचाप निर्णीत नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली। ‘प्राण’ की पुनरावृत्ति इब्रानी समानांतरता को बनाए रखती है; ‘तृप्त’ और ‘भर दिया’ प्रचुर पुनर्बहाली के दो जुड़े हुए बिंबों को सुरक्षित रखते हैं।
