  text: ע֤וֹד אֶבְנֵ/ךְ֙ וְֽ/נִבְנֵ֔ית בְּתוּלַ֖ת יִשְׂרָאֵ֑ל ע֚וֹד תַּעְדִּ֣י תֻפַּ֔יִ/ךְ וְ/יָצָ֖את בִּ/מְח֥וֹל מְשַׂחֲקִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/004.yaml
  text: Again I will build you[a], and you will be built, O virgin Israel[c][b]; again you will adorn yourself with your tambourines and go out in the dance of those who celebrate.
translation:
  language: hi
  text: मैं तुझे फिर बनाऊँगा[a], और तू बनाई जाएगी, हे कुँवारी इस्राएल[b]! तू फिर अपनी डफें लेकर सजेगी और उत्सव मनानेवालों के साथ नाचती हुई निकलेगी[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या “मैं तुझे फिर से बनाऊँगा, और तू फिर से बनाई जाएगी।” इब्रानी में एक ही धातु दो बार आई है: “मैं तुझे बनाऊँगा, और तू बनाई जाएगी।”'
    reason: lexical_alternative
  - marker: b
    text: या “हे युवती इस्राएल।” यह इस्राएल को पुनर्स्थापित यौवन, पवित्रता और आनंद के रूप में संबोधित करनेवाला रूपक है।
    reason: lexical_alternative
  - marker: c
    text: या “उत्सव मनानेवालों के नृत्य में निकलेगी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹד
  choice: फिर
  rationale: यह न्याय के बाद नए सिरे से होनेवाली पुनर्स्थापना को व्यक्त करता है और दोनों खंडों में इसकी पुनरावृत्ति सुरक्षित रखता है।
- source_word: אֶבְנֵךְ ... וְנִבְנֵית
  choice: मैं तुझे ... बनाऊँगा, और तू बनाई जाएगी
  rationale: एक ही इब्रानी धातु בנה की कर्तृवाच्य और कर्मवाच्य पुनरावृत्ति को हिन्दी में भी यथासंभव बनाए रखता है; संदर्भ पुनर्निर्माण का भाव स्पष्ट करता है।
- source_word: בְּתוּלַת יִשְׂרָאֵל
  choice: हे कुँवारी इस्राएल
  rationale: रूपकात्मक संबोधन को व्याख्यात्मक विस्तार दिए बिना सीधे रखता है और हे से संबोधन स्पष्ट होता है।
- source_word: תַּעְדִּי תֻפַּיִךְ
  choice: अपनी डफें धारण करेगी
  rationale: עדה सजने या आभूषण की तरह धारण करने का भाव देता है; תֹּף उत्सवी नृत्य में बजाया जानेवाला हाथ का छोटा ढोल या डफ है।
- source_word: בִּמְחוֹל מְשַׂחֲקִים
  choice: उत्सव मनानेवालों के नृत्य में
  rationale: מָחוֹל के सामूहिक नृत्य और שׂחק के आनंदपूर्ण उत्सव—दोनों भावों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: पुनर्स्थापना की वाणी में ‘कुँवारी इस्राएल’ का रूपक
  choice: रूपक को सीधे ‘हे कुँवारी इस्राएल’ के रूप में रखा गया है।
  alternative: हे युवती इस्राएल
  rationale: मूल का रूपक इस्राएल की पुनर्स्थापित पहचान, नई पवित्रता और आनंद का काव्यात्मक तनाव बनाए रखता है; इसे शाब्दिक कौमार्य संबंधी सिद्धांत के रूप में नहीं खोला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण भविष्यद्वाणी-संबंधी स्वर; स्त्रीलिंग एकवचन संबोधन को पूरे पद में बनाए रखा गया है। ‘डफ’ सामान्य पाठक के लिए ‘तिम्ब्रेल’ जैसे अप्रचलित शब्द से अधिक स्पष्ट है।
