id: JER.31.10
reference: Jeremiah 31:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: שִׁמְע֤וּ דְבַר יְהוָה֙ גּוֹיִ֔ם וְ/הַגִּ֥ידוּ בָ/אִיִּ֖ים מִ/מֶּרְחָ֑ק וְ/אִמְר֗וּ מְזָרֵ֤ה יִשְׂרָאֵל֙ יְקַבְּצֶ֔/נּוּ וּ/שְׁמָר֖/וֹ כְּ/רֹעֶ֥ה עֶדְרֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/010.yaml
  text: Hear the word of the LORD, O nations, and declare it in the coastlands far away; say, “He who scattered Israel will gather him and will keep him as a shepherd keeps his flock.”
translation:
  language: hi
  text: हे जातियो, यहोवा का वचन सुनो, और दूर-दूर के द्वीपों में इसकी घोषणा करो। कहो, “जिसने इस्राएल को तितर-बितर किया, वही उसे इकट्ठा करेगा और उसकी रखवाली ऐसे करेगा, जैसे चरवाहा अपने झुंड की रखवाली करता है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גּוֹיִם
  choice: जातियो
  rationale: सम्बोधन रूप में ‘जातियो’ मूल के बहुवचन और भविष्यवाणी-संबंधी गरिमा को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אִיִּים
  choice: द्वीपों
  rationale: शाब्दिक अर्थ ‘द्वीप/समुद्रतटीय भूभाग’ है; यहाँ ‘द्वीपों’ को रखा गया है, जबकि दूरी का भाव מִמֶּרְחָק से स्पष्ट किया गया है।
- source_word: מְזָרֵה
  choice: जिसने ... तितर-बितर किया
  rationale: हिब्रू कृदन्त निरंतर या पहचाने जाने वाले कर्ता का भाव दे सकता है; हिन्दी में यह सापेक्ष रचना सहज है और उसी परमेश्वर को बिखेरने तथा इकट्ठा करने वाला बताती है।
- source_word: יִשְׂרָאֵל ... יְקַבְּצֶנּוּ
  choice: इस्राएल को ... उसे इकट्ठा करेगा
  rationale: एकवचन प्रत्यय इस्राएल को सामूहिक एकवचन के रूप में प्रस्तुत करता है; ‘उसे’ उसी व्याकरणिक रूप को बनाए रखता है।
- source_word: שְׁמָרוֹ
  choice: उसकी रखवाली ... करेगा
  rationale: क्रिया का अर्थ रक्षा करना, निगरानी रखना और सुरक्षित बनाए रखना है; ‘रखवाली करना’ चरवाहे के रूपक में स्वाभाविक है।
theological_decisions:
- issue: तितर-बितर करने वाले और इकट्ठा करने वाले की पहचान
  choice: “जिसने ... तितर-बितर किया, वही ... इकट्ठा करेगा”
  alternative: “इस्राएल को तितर-बितर करने वाला उसे इकट्ठा करेगा”
  rationale: ‘वही’ हिब्रू कृदन्त के कर्ता की निरंतरता स्पष्ट करता है, बिना बिखराव और पुनर्स्थापन के बीच के धर्मवैचारिक तनाव को कम किए।
- issue: इस्राएल का सामूहिक एकवचन
  choice: “उसे”
  alternative: “उन्हें”
  rationale: मूल पाठ का एकवचन कर्म-प्रत्यय सुरक्षित रखा गया है; इस्राएल यहाँ एक सामूहिक इकाई के रूप में है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सार्वजनिक पाठ के योग्य रूप। ‘यहोवा’ मूल के व्यक्तिगत नाम יהוה को दर्शाता है। समानान्तरता और चरवाहे के रूपक को स्पष्ट तथा स्वाभाविक रखा गया है।
