  edition: WLC
  text: אִם יָמֻ֜שׁוּ הַ/חֻקִּ֥ים הָ/אֵ֛לֶּה מִ/לְּ/פָנַ֖/י נְאֻם יְהוָ֑ה גַּם֩ זֶ֨רַע יִשְׂרָאֵ֜ל יִשְׁבְּת֗וּ מִֽ/הְי֥וֹת גּ֛וֹי לְ/פָנַ֖/י כָּל הַ/יָּמִֽים־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/036.yaml
  text: If these fixed ordinances depart from before me[a], declares Yahweh[c][b], then the offspring of Israel also will cease from being a nation before me forever.
translation:
  language: hi
  text: “यदि ये निश्चित नियम मेरे सामने से हट जाएँ[a],” याहवे की घोषणा है, “तो इस्राएल का वंश[b] भी मेरे सामने सदा के लिए[c] एक राष्ट्र होना बंद हो जाएगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘निश्चित नियम’ का अनुवाद ‘विधि-विधान’, ‘स्थिर नियम’ या ‘ठहराए हुए नियम’ भी हो सकता है। संदर्भ में यह सूर्य, चंद्रमा और समुद्र की सृष्टि में स्थापित नियमित व्यवस्था को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘इस्राएल का बीज’; यह सामूहिक अभिव्यक्ति इस्राएल की संतान या वंशजों को दर्शाती है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से ‘सारे दिनों तक’; यह निरंतर बने रहने के अर्थ में प्रयुक्त इब्रानी मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמֻשׁוּ
  choice: हट जाएँ
  rationale: मूश क्रिया यहाँ किसी निर्धारित स्थान या व्यवस्था से हट जाने का भाव देती है; ‘हट जाएँ’ सृष्टि की स्थिर व्यवस्था के संदर्भ में स्वाभाविक है और पूर्ण विनाश का अनावश्यक अर्थ नहीं जोड़ती।
- source_word: הַחֻקִּים הָאֵלֶּה
  choice: ये स्थिर विधियाँ
  rationale: पिछले पद में सूर्य, चंद्रमा, तारों और समुद्र की स्थापित व्यवस्था का वर्णन है। ‘स्थिर विधियाँ’ इस सृष्टिगत व्यवस्था को व्यक्त करता है, जबकि केवल ‘नियम’ मानवीय आज्ञाओं का भ्रम दे सकता है।
- source_word: מִלְּפָנַי / לְפָנַי
  choice: मेरे सामने से / मेरे सामने
  rationale: इससे पद में दोहराए गए स्थान-संबंधी इब्रानी मुहावरे और उसका समानांतर रूप सुरक्षित रहता है।
- source_word: נְאֻם יְהוָה
  choice: याहवे की यह घोषणा है
  rationale: यह नबूवतों में प्रयुक्त गंभीर और प्रामाणिक दैवी वचन-सूत्र का स्वाभाविक हिन्दी रूप है।
- source_word: זֶרַע יִשְׂרָאֵל
  choice: इस्राएल का वंश
  rationale: ‘वंश’ सामूहिक एकवचन זֶרַע का भाव स्वाभाविक हिन्दी में व्यक्त करता है और शाब्दिक ‘बीज’ की संभावित अस्पष्टता से बचता है।
- source_word: יִשְׁבְּתוּ מִהְיוֹת גּוֹי
  choice: एक राष्ट्र बना रहना छोड़ देगा
  rationale: यह שבת के ‘रुकना/समाप्त होना’ और היה के सतत अस्तित्व—‘राष्ट्र बने रहना’—दोनों भावों को सहज हिन्दी में रखता है।
- source_word: כָּל הַיָּמִים
  choice: सदा
  rationale: शाब्दिक अर्थ ‘सारे दिन’ है, पर इस संदर्भ में यह निरंतर और चिरस्थायी बने रहने का मुहावरा है; ‘सदा’ हिन्दी में इसका स्वाभाविक रूप है।
theological_decisions:
- issue: इस्राएल के वंश की स्थायी सामूहिक और राष्ट्रीय पहचान
  choice: ‘इस्राएल का वंश ... एक राष्ट्र बना रहना’ को स्पष्ट रूप से बनाए रखा गया है।
  alternative: इस प्रतिज्ञा को सामान्यीकृत करके केवल आध्यात्मिक समुदाय या अस्पष्ट जनसमूह की निरंतरता कहना।
  rationale: इब्रानी पाठ इस्राएल के वंश और उसके ‘राष्ट्र’ बने रहने की बात स्पष्टतः करता है। अनुवाद इस कथन को किसी बाद की धर्मवैज्ञानिक व्यवस्था के अनुसार न तो सीमित करता है, न उसका आध्यात्मिकीकरण करता है।
- issue: शर्त की अलंकारिक शक्ति
  choice: ‘यदि ... तो’ की वास्तविक व्याकरणिक संरचना रखी गई है।
  alternative: इसे सीधे ‘ऐसा कभी नहीं होगा’ कहकर पुनर्लिखना।
  rationale: संदर्भ में शर्त सृष्टि की अटल व्यवस्था के आधार पर प्रतिज्ञा को दृढ़ करती है, पर अनुवाद मूल पाठ की शर्तात्मक अभिव्यक्ति को स्वयं व्याख्यात्मक निष्कर्ष में नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गंभीर पर सामान्य पाठक के लिए सुबोध रखी गई है। उद्धरण-रचना से ‘याहवे की यह घोषणा है’ को बीच में आए नबूवतीय सूत्र के रूप में स्पष्ट किया गया है। ‘स्थिर विधियाँ’, ‘वंश’ और ‘राष्ट्र’ मूल के प्रमुख सामूहिक तथा सृष्टिगत भावों को सुरक्षित रखते हैं।
