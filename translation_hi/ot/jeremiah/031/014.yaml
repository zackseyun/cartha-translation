  text: וְ/רִוֵּיתִ֛י נֶ֥פֶשׁ הַ/כֹּהֲנִ֖ים דָּ֑שֶׁן וְ/עַמִּ֛/י אֶת טוּבִ֥/י יִשְׂבָּ֖עוּ נְאֻם יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/014.yaml
  text: I will satisfy the priests with abundance[a], and my people will be filled with my goodness[c][b], declares Yahweh.
translation:
  language: hi
  text: मैं याजकों को प्रचुरता से तृप्त करूँगा[a], और मेरी प्रजा मेरी भलाई से भर जाएगी[b]—यहोवा की यह घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “याजकों के प्राण/भूख को समृद्ध प्रबंध से तृप्त करूँगा।” यहाँ “प्राण” व्यक्ति की भूख या आंतरिक इच्छा के लिए एक मुहावरेदार प्रयोग है।
    reason: lexical_alternative
  - marker: b
    text: “मेरी भलाई” का अनुवाद “मेरी उदार देन” या “मेरी अच्छी वस्तुओं” से भी हो सकता है; “भर जाएगी” के स्थान पर “तृप्त हो जाएगी” भी सम्भव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרִוֵּיתִי
  choice: मैं ... तृप्त करूँगा
  rationale: पिएल रूप का अर्थ भरपूर पिलाकर पूर्णतः तृप्त करना है। यहाँ प्रचुर प्रबंध के संदर्भ में ‘तृप्त करूँगा’ स्वाभाविक है और मूल बिंब के आशय को सुरक्षित रखता है।
- source_word: נֶפֶשׁ הַכֹּהֲנִים
  choice: याजकों को
  rationale: נֶפֶשׁ यहाँ व्यक्ति की भूख, अभिलाषा या समूचे प्राण के लिए प्रयुक्त मुहावरा है। आधुनिक हिन्दी में कर्म के रूप में ‘याजकों को’ कहना सहज है; इसकी शाब्दिक बारीकी पादटिप्पणी में दी गई है।
- source_word: דָּשֶׁן
  choice: भरपूर समृद्धि से
  rationale: शब्द का मूल भाव चरबी अथवा पुष्टता है और लाक्षणिक अर्थ समृद्ध, भरपूर प्रबंध। ‘भरपूर समृद्धि’ आधुनिक हिन्दी में इस प्रचुरता को स्वाभाविक रूप से व्यक्त करती है।
- source_word: וְעַמִּי
  choice: और मेरी प्रजा
  rationale: वाचा-संबंधी अधिकारसूचक अभिव्यक्ति का सीधा और स्वाभाविक अनुवाद।
- source_word: אֶת־טוּבִי
  choice: मेरी भलाई से
  rationale: טוּבִי का अर्थ मेरी भलाई, मेरी उदार देन या मेरी अच्छी वस्तुएँ हो सकता है। ‘मेरी भलाई’ दैवी कृपा और उससे मिलने वाले अच्छे प्रबंध, दोनों की अर्थ-सम्भावना बनाए रखता है।
- source_word: יִשְׂבָּעוּ
  choice: भर जाएगी
  rationale: क्रिया का अर्थ पेट भरना, तृप्त होना या जी भर पाना है। ‘भर जाएगी’ पहले खंड के ‘तृप्त’ की अनावश्यक पुनरावृत्ति से बचते हुए परिपूर्ण तृप्ति व्यक्त करता है।
- source_word: נְאֻם יְהוָה
  choice: यह यहोवा की घोषणा है
  rationale: נְאֻם की नबूवत-संबंधी औपचारिकता को ‘घोषणा’ व्यक्त करती है और יְהוָה को परियोजना की परंपरा के अनुसार ‘यहोवा’ लिखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ को अपनाया गया है; यह चतुरक्षरीय ईश्वरीय नाम को सामान्य उपाधि ‘प्रभु’ में बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: טוּבִי में अमूर्त भलाई और ठोस वरदानों का संबंध
  choice: मेरी भलाई
  alternative: मेरी अच्छी वस्तुओं / मेरी उदार देन से
  rationale: मूल शब्द दैवी भलाई और उससे प्राप्त भरपूर अच्छी वस्तुओं, दोनों को सूचित कर सकता है। मुख्य पाठ में व्यापक अर्थ रखा गया है और ठोस अर्थ पादटिप्पणी में बताया गया है।
