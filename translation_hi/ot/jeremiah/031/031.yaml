base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/031.yaml
  text: Look[a], days are coming, declares Yahweh, when I will make a new covenant with the house of Israel and the house of Judah.
translation:
  language: hi
  text: देखो, ऐसे दिन आ रहे हैं—यह याहवेह की घोषणा है—जब मैं इस्राएल के घराने और यहूदा के घराने के साथ एक नई[a] वाचा बाँधूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘नवीनीकृत वाचा।’ इब्रानी विशेषण का सबसे स्वाभाविक अर्थ ‘नई’ है, पर कुछ व्याख्याकार वाचा की निरंतरता पर बल देते हुए इसे ‘नवीनीकृत’ समझते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह शब्द श्रोताओं का ध्यान एक महत्त्वपूर्ण घोषणा की ओर खींचता है। आधुनिक हिन्दी में ‘देखो’ स्वाभाविक है और मूल का संकेतात्मक बल बनाए रखता है।
- source_word: יָמִים בָּאִים
  choice: ऐसे दिन आ रहे हैं
  rationale: यह भविष्य के समय की घोषणा करने वाला प्रचलित भविष्यवाणीय मुहावरा है। यह अनुवाद मूल के कृदन्तीय भाव और आने वाले समय की निकटता को सहज हिन्दी में व्यक्त करता है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवेह की घोषणा है
  rationale: यह भविष्यवक्ताओं में प्रयुक्त गंभीर और अधिकारपूर्ण घोषणात्मक सूत्र है। ‘घोषणा’ נְאֻם के विशिष्ट भाव को सामान्य ‘कहता है’ से अधिक स्पष्टता से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवेह
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: וְכָרַתִּי
  choice: मैं ... वाचा बाँधूँगा
  rationale: इब्रानी में शाब्दिक मुहावरा ‘वाचा काटना’ है, पर हिन्दी में ‘वाचा बाँधना’ उसी कार्य को स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: בֵּית יִשְׂרָאֵל
  choice: इस्राएल का घराना
  rationale: ‘घराना’ मूल के सामूहिक और वाचागत पारिवारिक बिंब को केवल ‘लोग’ कहने की अपेक्षा बेहतर बनाए रखता है।
- source_word: בֵּית יְהוּדָה
  choice: यहूदा का घराना
  rationale: यह समानांतर पद ‘इस्राएल के घराने’ से मेल रखता है और मूल की सामूहिक पहचान को सुरक्षित रखता है।
- source_word: בְּרִית חֲדָשָׁה
  choice: एक नई वाचा
  rationale: בְּרִית के लिए ‘वाचा’ मानक और प्रसंगानुकूल शब्द है, और חֲדָשָׁה का सबसे सीधा अर्थ ‘नई’ है। ‘नवीनीकृत’ प्रसंग-आधारित व्याख्यात्मक विकल्प है, इसलिए उसे पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: חֲדָשָׁה को ‘नई’ कहा जाए या वाचा की निरंतरता पर बल देते हुए ‘नवीनीकृत’ समझा जाए
  choice: नई वाचा
  alternative: नवीनीकृत वाचा
  rationale: विशेषण חֲדָשָׁה का सबसे स्वाभाविक शब्दार्थ ‘नई’ है। ‘नवीनीकृत’ कुछ व्याख्याओं में वाचागत निरंतरता को उभारता है, पर वह इस पद के सीधे शब्दार्थ से आगे जाता है। मुख्य पाठ मूल का स्पष्ट अर्थ रखता है और विकल्प को पादटिप्पणी में दर्ज करता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, किंतु भविष्यवाणीय घोषणा की गरिमा बनाए रखती है। ‘घराना,’ ‘वाचा’ और ‘घोषणा’ जैसे शब्द मूल के सामूहिक, वाचागत और अधिकारपूर्ण स्वर को सुरक्षित रखते हैं। विराम-चिह्न घोषणात्मक सूत्र को स्पष्ट करते हैं, और पादटिप्पणी-चिह्न उसी शब्द पर रखा गया है जिससे विकल्प संबंधित है।
