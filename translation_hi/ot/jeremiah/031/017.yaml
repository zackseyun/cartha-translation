  - marker: b
    text: या अधिक शाब्दिक रूप से, “तुम्हारे पुत्र अपने क्षेत्र/सीमा में लौट आएँगे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵשׁ
  choice: है
  rationale: अस्तित्वसूचक आश्वासन को स्वाभाविक हिन्दी में व्यक्त करता है; आरम्भिक וְ को अलग से ‘और’ कहना आवश्यक नहीं है।
- source_word: תִּקְוָה
  choice: आशा
  rationale: पुनर्स्थापना की प्रतिज्ञा के संदर्भ में यह सबसे स्वाभाविक और सटीक अर्थ है।
- source_word: לְאַחֲרִיתֵךְ
  choice: तुम्हारे भविष्य के लिए
  rationale: אַחֲרִית ‘अन्त’, ‘परिणाम’ अथवा ‘भविष्य’ का बोध करा सकता है; यहाँ आगे आनेवाली पुनर्स्थापना के कारण ‘भविष्य’ स्पष्ट और स्वाभाविक है, जबकि विकल्प पादटिप्पणी में सुरक्षित हैं।
- source_word: נְאֻם יְהוָה
  choice: यहोवा की घोषणा है
  rationale: भविष्यद्वाणी के औपचारिक कथन-सूत्र का गरिमापूर्ण और स्वाभाविक हिन्दी रूप है।
- source_word: וְשָׁבוּ
  choice: लौट आएँगे
  rationale: भविष्यद्वाणी के प्रसंग में क्रिया भावी वापसी दर्शाती है; ‘लौट आएँगे’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: בָנִים
  choice: तुम्हारे बच्चे
  rationale: शाब्दिक रूप से ‘पुत्र’ संभव है, पर संदर्भ राहेल के निर्वासित वंशजों का सामूहिक उल्लेख करता है; ‘बच्चे’ अर्थगत व्यापकता को बनाए रखता है।
- source_word: לִגְבוּלָם
  choice: अपने प्रदेश में
  rationale: גְּבוּל सीमा, भूभाग या प्रदेश का अर्थ दे सकता है; वापसी के संदर्भ में ‘अपने प्रदेश में’ गन्तव्य और स्वामित्व दोनों को स्वाभाविक हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम प्रत्यक्ष है; हिन्दी के सामान्य बाइबलीय व्यवहार में ‘यहोवा’ पहचानने योग्य रूप है और इसे उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं किया गया।
- issue: בָנִים का संदर्भगत विस्तार
  choice: बच्चे
  alternative: पुत्र
  rationale: यहाँ प्रतिज्ञा केवल पुरुष सन्तान तक सीमित नहीं, बल्कि निर्वासन से लौटनेवाले वंशजों के लिए है; फिर भी मूल का शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
