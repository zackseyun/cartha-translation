  text: तुम्हारे भविष्य के लिए आशा है[a]—यहोवा की यह घोषणा है—और तुम्हारे बच्चे[b] अपने प्रदेश में लौट आएँगे।
  philosophy: optimal-equivalence
  footnotes:
