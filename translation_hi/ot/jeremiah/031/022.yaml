source:
  edition: WLC
  text: עַד מָתַי֙ תִּתְחַמָּקִ֔י/ן הַ/בַּ֖ת הַ/שּֽׁוֹבֵבָ֑ה כִּֽי בָרָ֨א יְהוָ֤ה חֲדָשָׁה֙ בָּ/אָ֔רֶץ נְקֵבָ֖ה תְּס֥וֹבֵֽב גָּֽבֶר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/022.yaml
  text: 'How long will you waver[c][b][a], faithless daughter? For Yahweh has created a new thing in the land: a woman will surround a man.'
translation:
  language: hi
  text: 'हे भटकी हुई बेटी[a], तू कब तक कतराती फिरेगी? क्योंकि याहवे ने देश में[b] एक नई बात रची है: एक स्त्री एक पुरुष को घेरेगी[c]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “विमुख बेटी” या “राह से भटकी बेटी” भी हो सकता है। हिब्रू शब्द वाचा के संबंध में भटक जाने का भाव रखता है।
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद “पृथ्वी पर” भी हो सकता है; संदर्भ में संभवतः इस्राएल का देश अभिप्रेत है।
    reason: lexical_alternative
  - marker: c
    text: अंतिम उपवाक्य कठिन और अत्यंत विवादित है; यहाँ उसका निकट-शाब्दिक अनुवाद दिया गया है। संभावित अर्थों में “स्त्री पुरुष से प्रणय करेगी,” “निर्बल बलवान पर प्रबल होगा,” या पुनर्स्थापित इस्राएल के याहवे के पास लौटने का आलंकारिक चित्र शामिल हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: תִּתְחַמָּקִין
  choice: मुँह मोड़ती रहेगी
  rationale: חמק में एक ओर हटने, खिसकने या बच निकलने का भाव है। इस वाचा-संबंधी संदर्भ में यह अभिव्यक्ति बेटी के लगातार विमुख होते रहने को स्वाभाविक हिन्दी में व्यक्त करती है, बिना किसी विशिष्ट शारीरिक गति को अनावश्यक रूप से तय किए।
- source_word: הַבַּת הַשּׁוֹבֵבָה
  choice: भटकी हुई बेटी
  rationale: यिर्मयाह में שׁוֹבֵבָה का अर्थ हठपूर्वक भटकने या पीछे हट जाने से जुड़ा है। यह अनुवाद स्त्रीलिंग एकवचन संबोधन और वाचा से भटकने के भाव—दोनों को बनाए रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ כִּי पिछले प्रश्न का आधार या कारण प्रस्तुत करता है।
- source_word: בָרָא
  choice: रची है
  rationale: हिब्रू क़ाताल रूप को पूर्ण कार्य के रूप में रखा गया है। 'रची है' आधुनिक हिन्दी में स्वाभाविक है और सृजनात्मक कार्य का भाव देता है।
- source_word: חֲדָשָׁה
  choice: एक नई बात
  rationale: विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है। यह चयन कथन को जानबूझकर खुला रखता है।
- source_word: בָּאָרֶץ
  choice: देश में
  rationale: אֶרֶץ का अर्थ 'देश/भूमि' या 'पृथ्वी' हो सकता है। निकटवर्ती राष्ट्रीय और वाचा-संबंधी संदर्भ में देश, अर्थात इस्राएल की भूमि, अधिक संभावित है।
- source_word: נְקֵבָה
  choice: एक स्त्री
  rationale: शाब्दिक अर्थ 'मादा/स्त्रीलिंग प्राणी' है, पर मानवीय संदर्भ में 'स्त्री' स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: תְּסוֹבֵב
  choice: चारों ओर से घेरेगी
  rationale: סבב का मूल भाव घूमने, चारों ओर जाने या घेरने का है। विवादित उपवाक्य में किसी विशेष व्याख्या को मुख्य पाठ में डालने के बजाय ठोस शाब्दिक अर्थ रखा गया है।
- source_word: גָּבֶר
  choice: एक पुरुष
  rationale: גֶּבֶר सामान्यतः पुरुष को दर्शाता है और कभी-कभी सामर्थ्य का संकेत देता है। यहाँ 'पुरुष' पारदर्शी है और 'वीर' जैसी अधिक व्याख्यात्मक धारणा नहीं जोड़ता।
- source_word: יְהוָה
  choice: याहवे
  rationale: हिब्रू व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
theological_decisions:
- issue: नְקֵבָה תְּסוֹבֵב גָּבֶר के रहस्यमय अंतिम उपवाक्य की व्याख्या
  choice: 'मुख्य पाठ में ठोस शाब्दिक चित्र रखा गया है: ''एक स्त्री एक पुरुष को चारों ओर से घेरेगी।'''
  alternative: '''स्त्री पुरुष से प्रणय-निवेदन करेगी''; ''निर्बल बलवान पर प्रबल होगा''; पुनर्स्थापित इस्राएल का याहवे के पास लौटना; या ''स्त्री पुरुष की रक्षा करेगी।'''
  rationale: प्रत्येक शब्द का मूल अर्थ अपेक्षाकृत स्पष्ट है, पर पूरे उपवाक्य का आशय अत्यंत विवादित है। इसलिए किसी एक धर्मवैचारिक व्याख्या को पाठ में स्थापित नहीं किया गया; विकल्प पाद-टिप्पणी में दिए गए हैं।
- issue: भविष्यसूचक संदर्भ में בָרָא का कालगत बल
  choice: '''रची है'' के रूप में पूर्ण क्रिया'
  alternative: '''रचेगा'' या ''रचता है'''
  rationale: हिब्रू रूप क़ाताल है। पूर्ण क्रिया स्रोत-रूप के निकट रहती है, यद्यपि भविष्यसूचक संदर्भ में यह निश्चित भविष्य की ओर भी संकेत कर सकती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल किंतु गरिमापूर्ण शैली अपनाई गई है। स्त्रीलिंग एकवचन संबोधन स्पष्ट रखा गया है। कठिन अंतिम चित्र को सहज बनाने के नाम पर उसकी वास्तविक अस्पष्टता दूर नहीं की गई।
