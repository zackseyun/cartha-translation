id: JER.31.6
reference: Jeremiah 31:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֣י יֶשׁ י֔וֹם קָרְא֥וּ נֹצְרִ֖ים בְּ/הַ֣ר אֶפְרָ֑יִם ק֚וּמוּ וְ/נַעֲלֶ֣ה צִיּ֔וֹן אֶל יְהוָ֖ה אֱלֹהֵֽי/נוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/006.yaml
  text: For there will be a day when watchmen will call out on the hill country of Ephraim[a], ‘Rise up, and let us go up to Zion[b], to Yahweh our God.’
translation:
  language: hi
  text: 'क्योंकि एक दिन आएगा जब एप्रैम के पहाड़ी प्रदेश में पहरेदार[a] पुकारेंगे,

    “उठो, हम सिय्योन को चढ़ चलें—अपने परमेश्वर याहवे[b] के पास।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द का अर्थ “पहरेदार” है; इसके अन्य सम्भव अर्थ “रखवाले” या “रक्षक” हैं।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में परमेश्वर का व्यक्तिगत नाम YHWH है, जिसका यहाँ लिप्यंतरण “याहवे” किया गया है; परम्परागत रूप से इसका अनुवाद “प्रभु” किया जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन के आधार या कारण को प्रस्तुत करता है और इब्रानी संयोजक का स्वाभाविक हिन्दी रूप है।
- source_word: יֶשׁ יוֹם
  choice: एक दिन आएगा
  rationale: शाब्दिक अस्तित्ववाचक रचना संदर्भ में भविष्य के निश्चित समय की ओर संकेत करती है; यह हिन्दी में स्वाभाविक और भविष्याभिमुख है।
- source_word: קָרְאוּ
  choice: पुकारेंगे
  rationale: भविष्यसूचक कथन में पूर्ण क्रिया भावी घटना की निश्चितता व्यक्त कर सकती है; सार्वजनिक आह्वान के लिए ‘पुकारेंगे’ उपयुक्त है।
- source_word: נֹצְרִים
  choice: पहरेदार
  rationale: नצר से बना यह कृदंत निगरानी या रक्षा करने वालों को दर्शाता है; प्रसंग में ऊँचे स्थान से पुकारने वाले पहरेदारों की ठोस छवि बनी रहती है।
- source_word: בְּהַר אֶפְרָיִם
  choice: एप्रैम के पहाड़ी प्रदेश में
  rationale: एकवचन ‘पर्वत’ यहाँ सामूहिक अर्थ में पहाड़ी भूभाग को सूचित कर सकता है; हिन्दी में यह किसी एक चोटी का भ्रामक संकेत दिए बिना क्षेत्र को स्पष्ट करता है।
- source_word: קוּמוּ
  choice: उठो
  rationale: यह बहुवचन आज्ञार्थक आह्वान है; ‘उठो’ वर्तमान हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: וְנַעֲלֶה
  choice: हम ... चढ़ चलें
  rationale: प्रथम पुरुष बहुवचन प्रेरणार्थक भाव में वक्ता श्रोताओं को अपने साथ चलने को कहता है; ‘चढ़’ सिय्योन की ओर भौगोलिक और तीर्थयात्रात्मक आरोहण दोनों को सुरक्षित रखता है।
- source_word: צִיּוֹן
  choice: सिय्योन
  rationale: स्थान-नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण है और उसके ऐतिहासिक-धार्मिक संकेत को बनाए रखता है।
- source_word: אֶל יְהוָה
  choice: याहवे के पास
  rationale: אֶל गमन की दिशा बताता है और יְהוָה को उसके व्यक्तिगत वाचा-नाम के लिप्यंतरण ‘याहवे’ से व्यक्त किया गया है।
- source_word: אֱלֹהֵינוּ
  choice: अपने परमेश्वर
  rationale: प्रथम पुरुष बहुवचन संबंध को हिन्दी में स्वाभाविक रूप से व्यक्त करता है और सामुदायिक अंगीकार को सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे प्रयुक्त है। ‘याहवे’ उसका विद्वताप्रचलित ध्वन्यात्मक रूप सुरक्षित रखता है; पादटिप्पणी पाठकों को पारंपरिक ‘प्रभु’ रूप से भी परिचित कराती है।
- issue: נֹצְרִים का प्रसंगगत अर्थ
  choice: पहरेदार
  alternative: रखवाले; रक्षक
  rationale: यह चयन सार्वजनिक पुकार करने वाले निगरानीकर्ताओं की ठोस छवि को बनाए रखता है और उत्तर-दक्षिण एकता जैसी धर्मवैज्ञानिक व्याख्या को मुख्य पाठ में आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण भविष्यसूचक शैली रखी गई है। ‘चढ़ चलें’ से सामूहिक आह्वान और सिय्योन की ओर आरोहण दोनों व्यक्त होते हैं। संवाद के लिए हिन्दी उद्धरण-चिह्न और अर्थगत ठहराव के लिए दीर्घ विराम प्रयुक्त है।
