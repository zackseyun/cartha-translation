source:
  edition: WLC
  text: כִּ֛י אִם אִ֥ישׁ בַּ/עֲוֺנ֖/וֹ יָמ֑וּת כָּל הָֽ/אָדָ֛ם הָ/אֹכֵ֥ל הַ/בֹּ֖סֶר תִּקְהֶ֥ינָה שִׁנָּֽי/ו־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/030.yaml
  text: But each man will die for his own iniquity; every person who eats the sour grapes[a], his teeth will be set on edge.
translation:
  language: hi
  text: बल्कि हर व्यक्ति अपने ही अधर्म के कारण मरेगा; जो कोई खट्टे अंगूर[a] खाएगा, उसी के दाँत खट्टे हो जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कच्चे अंगूर।” इब्रानी शब्द בֹּסֶר उन अंगूरों को सूचित करता है जो अभी पके नहीं हैं और इसलिए खट्टे हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: बल्कि
  rationale: पिछले पद की कहावत का खंडन करके उसके स्थान पर वास्तविक सिद्धांत प्रस्तुत किया गया है; ‘बल्कि’ इस सुधारात्मक-विरोधी बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אִישׁ
  choice: हर व्यक्ति
  rationale: संज्ञा यहाँ वितरणात्मक अर्थ में है। ‘हर व्यक्ति’ आधुनिक हिन्दी में स्वाभाविक है और व्यक्तिगत उत्तरदायित्व को स्पष्ट रखता है।
- source_word: בַּעֲוֺנוֹ
  choice: अपने ही अधर्म के कारण
  rationale: עָוֹן में अधर्म, दोष अथवा दोष-दंड की अर्थ-सीमा है। यहाँ मृत्यु का आधार व्यक्ति का अपना अपराधपूर्ण आचरण है; ‘अपने ही’ व्यक्तिगत प्रत्यय और बल को सुरक्षित रखता है।
- source_word: יָמוּת
  choice: मरेगा
  rationale: यह भविष्यसूचक घोषणा का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: כָּל הָאָדָם
  choice: जो कोई
  rationale: इब्रानी पदबंध वितरणात्मक सार्वभौमिकता व्यक्त करता है। आगे के संबंधवाचक वाक्य में ‘जो कोई’ हिन्दी में स्वाभाविक रूप से ‘हर वह व्यक्ति’ का अर्थ देता है।
- source_word: הָאֹכֵל
  choice: खाएगा
  rationale: कृदंत व्यक्ति का लक्षण बताने वाले संबंधवाचक प्रयोग में है; हिन्दी में ‘जो कोई ... खाएगा’ उसी कार्य को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הַבֹּסֶר
  choice: खट्टे अंगूर
  rationale: בֹּסֶר अधपके और इसलिए खट्टे अंगूरों को सूचित करता है। मुख्य पाठ में ‘खट्टे अंगूर’ कहावत की अनुभूति बनाए रखता है; ‘कच्चे अंगूर’ पादटिप्पणी में दिया गया है।
- source_word: תִּקְהֶינָה שִׁנָּיו
  choice: उसी के दाँत खट्टे हो जाएँगे
  rationale: यह खट्टे अंगूर खाने से दाँतों में होने वाली अप्रिय अनुभूति का मुहावरेदार वर्णन है। ‘उसी के’ परिणाम को उसी खाने वाले व्यक्ति तक सीमित रखने वाला बल स्पष्ट करता है।
theological_decisions:
- issue: व्यक्तिगत बनाम सामूहिक उत्तरदायित्व
  choice: हर व्यक्ति अपने ही अधर्म के कारण मरेगा और खट्टे अंगूर खाने का प्रभाव उसी पर होगा।
  alternative: इसे व्यक्तिगत उत्तरदायित्व पर विशेष बल दिए बिना केवल कहावत का पुनर्कथन मानना।
  rationale: वाक्य-विन्यास पिछले पद की पीढ़ीगत कहावत के विपरीत व्यक्तिगत परिणाम पर बल देता है। अनुवाद इस बल को सुरक्षित रखता है, पर इस पद से आगे कोई व्यापक सिद्धान्त नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘हर व्यक्ति’ और ‘जो कोई’ वितरणात्मक अर्थ देते हैं। ‘दाँत खट्टे हो जाना’ स्रोत की शारीरिक अनुभूति और हिन्दी के स्वाभाविक मुहावरे—दोनों को बनाए रखता है।
