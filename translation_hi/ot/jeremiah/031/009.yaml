id: JER.31.9
reference: Jeremiah 31:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בִּ/בְכִ֣י יָבֹ֗אוּ וּֽ/בְ/תַחֲנוּנִים֮ אֽוֹבִילֵ/ם֒ אֽוֹלִיכֵ/ם֙ אֶל נַ֣חֲלֵי מַ֔יִם בְּ/דֶ֣רֶךְ יָשָׁ֔ר לֹ֥א יִכָּשְׁל֖וּ בָּ֑/הּ כִּֽי הָיִ֤יתִי לְ/יִשְׂרָאֵל֙ לְ/אָ֔ב וְ/אֶפְרַ֖יִם בְּכֹ֥רִ/י הֽוּא־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/009.yaml
  text: They will come with weeping, and with pleas for mercy[a] I will lead them; I will guide them to streams of water, on a straight path where they will not stumble. For I am a father to Israel, and Ephraim is my firstborn.
translation:
  language: hi
  text: वे रोते हुए आएँगे, और दया की विनतियों के साथ[a] मैं उन्हें ले चलूँगा। मैं उन्हें जल की धाराओं के पास, ऐसे सीधे मार्ग पर ले जाऊँगा जहाँ वे ठोकर न खाएँगे। क्योंकि मैं इस्राएल का पिता हूँ, और एप्रैम मेरा पहलौठा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और विनतियों के साथ मैं उन्हें ले चलूँगा।”
    reason: תַּחֲנוּנִים का अधिक औपचारिक और अपेक्षाकृत शाब्दिक विकल्प।
lexical_decisions:
- source_word: בִּבְכִי
  choice: रोते हुए
  rationale: ב उपसर्ग यहाँ रीति या साथ होने का भाव देता है। यह अनुवाद आँसुओं का कारण—पश्चात्ताप, दुःख या आनन्द—निर्धारित किए बिना स्वाभाविक हिन्दी देता है।
- source_word: יָבֹאוּ
  choice: आएँगे
  rationale: בוא का सरल भविष्यकालीन अर्थ है; प्रसंग में सामान्य और स्वाभाविक हिन्दी।
- source_word: וּבְתַחֲנוּנִים
  choice: और दया की विनतियों के साथ
  rationale: תַּחֲנוּנִים दया या अनुग्रह माँगने वाली विनतियों को सूचित करता है। यह चयन अर्थ को सामान्य पाठक के लिए स्पष्ट करता है, जबकि अधिक औपचारिक ‘विनतियों के साथ’ विकल्प पादटिप्पणी में रखा गया है।
- source_word: אֹבִילֵם
  choice: मैं उन्हें ले चलूँगा
  rationale: יבל का हिफ़ील रूप अगुवाई करके साथ ले चलने का भाव देता है।
- source_word: אֹלִיכֵם
  choice: मैं उन्हें ... ले जाऊँगा
  rationale: הלך का हिफ़ील रूप चलाने या पहुँचाने का कारणवाचक भाव रखता है। हिन्दी में पहले क्रियापद से स्वाभाविक भिन्नता रखते हुए गमन का अर्थ सुरक्षित है।
- source_word: נַחֲלֵי מַיִם
  choice: जल की धाराओं
  rationale: निर्मित पदबंध पानी के बहते स्रोतों या जलधाराओं को दर्शाता है; ‘जल की धाराएँ’ गरिमापूर्ण और सहज हिन्दी है।
- source_word: בְּדֶרֶךְ יָשָׁר
  choice: सीधे मार्ग पर
  rationale: यह पद सीधा, समतल या बाधारहित मार्ग सूचित कर सकता है। ‘सीधा मार्ग’ मूल रूपक और वास्तविक अस्पष्टता को बनाए रखता है।
- source_word: לֹא יִכָּשְׁלוּ בָּהּ
  choice: जहाँ वे ठोकर न खाएँगे
  rationale: स्त्रीलिंग प्रत्यय मार्ग की ओर संकेत करता है। ‘जहाँ’ आधुनिक हिन्दी में इस संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כִּי הָיִיתִי לְיִשְׂרָאֵל לְאָב
  choice: क्योंकि मैं इस्राएल का पिता हूँ
  rationale: स्थितिवाचक क़ातल यहाँ स्थापित संबंध बताता है। वर्तमानकालीन हिन्दी उस स्थायी वास्तविकता को व्यक्त करती है और ‘बन गया हूँ’ जैसा अनावश्यक आरंभ-बोध नहीं जोड़ती।
- source_word: וְאֶפְרַיִם בְּכֹרִי הוּא
  choice: और एप्रैम मेरा पहलौठा है
  rationale: בכור जन्मक्रम के साथ पद और उत्तराधिकार का महत्व भी रखता है। ‘पहलौठा’ पारंपरिक, संक्षिप्त और व्यापक रूप से समझा जाने वाला हिन्दी समतुल्य है।
theological_decisions:
- issue: लोगों के रोने और विनती करने का स्वरूप
  choice: पाठ आँसुओं का कारण बताए बिना कहता है कि वे रोते हुए आएँगे।
  alternative: इसे केवल पश्चात्ताप का रोना या केवल पुनर्स्थापना के आनन्द के आँसू मानना।
  rationale: इब्रानी पाठ उनकी आने की रीति बताता है, पर भावनात्मक या धर्मवैज्ञानिक कारण स्पष्ट नहीं करता; इसलिए अनुवाद अस्पष्टता बनाए रखता है।
- issue: पितृत्व-वाक्य में הָיִיתִי का कालगत बल
  choice: ‘मैं इस्राएल का पिता हूँ’
  alternative: ‘मैं इस्राएल का पिता रहा हूँ’ या ‘मैं इस्राएल का पिता बन गया हूँ’
  rationale: स्थितिवाचक क़ातल इस भविष्यद्वाणी में स्थापित संबंध की पुष्टि करता है। ‘बन गया हूँ’ उस परिवर्तन को जोड़ देगा जो स्रोत में व्यक्त नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किन्तु गरिमापूर्ण शैली। ‘जल’, ‘मार्ग’ और ‘पहलौठा’ बाइबलीय संदर्भ में परिचित हैं, फिर भी सामान्य पाठक के लिए बोधगम्य हैं। वाक्य-विन्यास को हिन्दी की स्वाभाविक गति के अनुसार रखा गया है और मूल की भावात्मक तथा धर्मवैज्ञानिक अस्पष्टता नहीं सुलझाई गई।
