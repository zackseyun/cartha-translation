base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/013.yaml
  text: Then the virgin will rejoice in the dance[a], and young men and old men together; and I will turn their mourning into gladness[c][b], and I will comfort them and make them rejoice from their sorrow.
translation:
  language: hi
  text: तब कुँवारी नृत्य करते हुए आनन्दित होगी[a], और जवान और बूढ़े भी एक साथ आनन्दित होंगे[b]। मैं उनके शोक को हर्ष में बदल दूँगा[c]; मैं उन्हें सांत्वना दूँगा और उनका दुःख दूर करके उन्हें आनन्दित करूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘युवती’। हिब्रू में शब्द एकवचन है, पर सम्भवतः वह समुदाय की युवतियों का प्रतिनिधित्व करता है।
    reason: lexical_alternative
  - marker: b
    text: ‘बूढ़े’ के लिए प्रयुक्त हिब्रू शब्द का अर्थ ‘वृद्ध’ भी हो सकता है; किन्तु यहाँ ‘जवानों’ के साथ उसका विरोध आयु की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘आनन्द में’।
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: तब
  rationale: यह कालवाचक क्रियाविशेषण प्रसंग में पुनर्स्थापना के वादों के भावी परिणाम को दर्शाता है।
- source_word: תִּשְׂמַח
  choice: आनन्दित होगी
  rationale: स्त्रीलिंग एकवचन अपूर्ण क्रिया भविष्य के उत्सवपूर्ण आनन्द को व्यक्त करती है।
- source_word: בְּתוּלָה
  choice: कुँवारी
  rationale: यह हिब्रू संज्ञा सामान्यतः विवाह से पूर्व की युवती अथवा कुँवारी को दर्शाती है। एकवचन को स्रोत के अनुरूप रखा गया है, यद्यपि यहाँ वह समुदाय की युवतियों का प्रतिनिधित्व करती जान पड़ती है।
- source_word: בְּמָחוֹל
  choice: नृत्य करते हुए
  rationale: בְ के साथ מָחוֹל नृत्य में अथवा नृत्य के द्वारा आनन्द प्रकट करने का भाव देता है; यह हिंदी में स्वाभाविक और दृश्यात्मक है।
- source_word: וּבַחֻרִים וּזְקֵנִים יַחְדָּו
  choice: और जवान और बूढ़े भी एक साथ आनन्दित होंगे
  rationale: हिब्रू में दूसरे खंड की क्रिया पहले खंड से समझी जाती है। हिंदी में अर्थ स्पष्ट करने के लिए उसे दोहराया गया है। जवान और बूढ़े का युग्म आयु-आधारित विरोध को बनाए रखता है।
- source_word: וְהָפַכְתִּי אֶבְלָם לְשָׂשׂוֹן
  choice: मैं उनके शोक को हर्ष में बदल दूँगा
  rationale: הפך एक दशा को दूसरी में बदलने का भाव देता है; אֵבֶל शोक और שָׂשׂוֹן उल्लासपूर्ण हर्ष को दर्शाते हैं।
- source_word: וְנִחַמְתִּים
  choice: मैं उन्हें सांत्वना दूँगा
  rationale: निफ़अल नहीं, पिएल रूप यहाँ संकट या शोक के बाद सांत्वना देने का अर्थ रखता है।
- source_word: וְשִׂמַּחְתִּים מִיגוֹנָם
  choice: उनके दुःख के बदले उन्हें आनन्दित करूँगा
  rationale: שׂמח का पिएल रूप कारक भाव रखता है—उन्हें आनन्दित करना। מִן को यहाँ पूर्व अवस्था से परिवर्तन अथवा उसके बदले के अर्थ में स्वाभाविक हिंदी में व्यक्त किया गया है।
theological_decisions:
- issue: בְּתוּלָה का प्रतिनिधिक एकवचन
  choice: मुख्य पाठ में एकवचन ‘कुँवारी’ रखा गया है।
  alternative: ‘युवतियाँ’ या ‘कुमारी कन्याएँ’ के रूप में बहुवचन करना।
  rationale: हिब्रू स्पष्टतः एकवचन है, पर पुनर्स्थापित समुदाय के सामूहिक उत्सव में यह प्रतिनिधिक प्रयोग प्रतीत होता है। स्रोत का रूप बनाए रखते हुए पादटिप्पणी में यह संभावना स्पष्ट की गई है।
- issue: זְקֵנִים का अर्थ
  choice: ‘बूढ़े’
  alternative: ‘पुरनिये’ अथवा ‘अगुवे’
  rationale: ‘जवानों’ के साथ समानांतरता आयु के विरोध को प्रमुख बनाती है, न कि किसी संस्थागत पद को।
- issue: מִיגוֹנָם का संबंध
  choice: ‘उनके दुःख के बदले’
  alternative: ‘उनके दुःख से’
  rationale: हिब्रू מִן स्रोत अथवा पूर्व दशा से हटाकर आनन्दित करने का भाव दे सकता है। ‘के बदले’ शोक से आनन्द की ओर परिवर्तन को स्वाभाविक हिंदी में व्यक्त करता है, जबकि पादटिप्पणी निकटतर वैकल्पिक रूप सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप अपनाया गया है। ‘आनन्दित’ और ‘हर्ष’ उत्सव के भाव को रखते हैं; ‘शोक’ तथा ‘दुःख’ स्रोत में प्रयुक्त दो अलग संज्ञाओं के भेद को व्यक्त करते हैं। हिंदी वाक्य को पूर्ण और स्पष्ट बनाने के लिए पहले उपवाक्य की निहित क्रिया ‘आनन्दित होंगे’ जवानों और बूढ़ों के लिए दोहराई गई है।
