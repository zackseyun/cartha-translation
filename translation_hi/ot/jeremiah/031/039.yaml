  text: And the measuring line will go out farther[a], straight ahead to the hill of Gareb[b], and then it will turn toward Goah.
translation:
  language: hi
  text: और नापने की डोरी आगे[a] निकलेगी, उसके सामने[b] गारेब की पहाड़ी तक जाएगी, और फिर गोआ की ओर मुड़ेगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “फिर”; इब्रानी עוֹד का अर्थ “फिर” या “और आगे” हो सकता है। यहाँ सीमा के विस्तार के संदर्भ में स्थानगत अर्थ अधिक उपयुक्त लगता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “उसके सामने” या “उसके सम्मुख”; נֶגְדּוֹ में लगे “उसके” का ठीक संदर्भ आसपास दिए गए सीमा-वर्णन से अनुमानित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא
  choice: निकलकर ... जाएगी
  rationale: भविष्यसूचक संदर्भ में यह रूप भविष्य की क्रिया बताता है; ‘निकलकर जाएगी’ डोरी के आगे बढ़ने का ठोस चित्र बनाए रखता है।
- source_word: עוֹד
  choice: आगे
  rationale: नगर की सीमा के विस्तार के संदर्भ में इसका स्थानगत अर्थ स्वाभाविक है; वैकल्पिक अर्थ ‘फिर’ पादटिप्पणी में रखा गया है।
- source_word: קוה הַמִּדָּה
  choice: नापने की डोरी
  rationale: यह मापने या सीमांकन करने में प्रयुक्त डोरी को दर्शाता है और आधुनिक हिन्दी में स्पष्ट है।
- source_word: נֶגְדּוֹ
  choice: वहाँ से ... सीधे
  rationale: मूल पद का शाब्दिक भाव ‘उसके सामने/उसके सम्मुख’ है; सीमा-वर्णन में ‘वहाँ से सीधे’ दिशा को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि प्रत्यय का अनिश्चित संदर्भ पादटिप्पणी में सुरक्षित है।
- source_word: עַל
  choice: तक
  rationale: गति और स्थल-लक्ष्य के साथ ‘पहाड़ी तक’ हिन्दी में सहज है और रेखा के उस स्थल तक पहुँचने का भाव देता है।
- source_word: גִּבְעַת גָּרֵב
  choice: गारेब की पहाड़ी
  rationale: संबंधित रचना ‘गारेब की पहाड़ी’ के रूप में स्वाभाविक है; स्थान-नाम का लिप्यंतरण रखा गया है।
- source_word: וְנָסַב
  choice: फिर घूमकर ... जाएगी
  rationale: सीमा-वर्णन में क्रिया मोड़ लेने या घूमने को दर्शाती है; ‘फिर’ घटनाक्रम स्पष्ट करता है।
- source_word: גֹּעָתָה
  choice: गोआ की ओर
  rationale: स्थान-नाम के साथ लगा दिशासूचक प्रत्यय लक्ष्य की दिशा बताता है, इसलिए ‘की ओर’ चुना गया है।
