source:
  edition: WLC
  text: כֹּֽה אָמַ֞ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל ע֣וֹד יֹאמְר֞וּ אֶת הַ/דָּבָ֣ר הַ/זֶּ֗ה בְּ/אֶ֤רֶץ יְהוּדָה֙ וּ/בְ/עָרָ֔י/ו בְּ/שׁוּבִ֖/י אֶת שְׁבוּתָ֑/ם יְבָרֶכְ/ךָ֧ יְהוָ֛ה נְוֵה צֶ֖דֶק הַ֥ר הַ/קֹּֽדֶשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/023.yaml
  text: 'Thus says Yahweh of hosts[a], the God of Israel: They will yet say this word in the land of Judah and in its cities, when I restore their fortunes: “May Yahweh bless you, O habitation of righteousness[b], O holy mountain.”'
translation:
  language: hi
  text: 'सेनाओं का याहवे, इस्राएल का परमेश्वर, यह कहता है: “यहूदा देश और उसके नगरों में लोग फिर यह बात कहेंगे, जब मैं उनकी दशा बहाल करूँगा[a]: ‘हे धार्मिकता के निवास-स्थान[b], हे पवित्र पर्वत, याहवे तुझे आशीष दे!’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जब मैं उनके बंदियों को लौटा लाऊँगा” अथवा “जब मैं उन्हें बंधुआई से लौटा लाऊँगा।” इब्रानी मुहावरा विशेष रूप से निर्वासन से वापसी या अधिक व्यापक पुनर्बहाली—दोनों का संकेत दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “धार्मिकता का धाम” अथवा “धार्मिकता का चरागाह।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का याहवे
  rationale: व्यक्तिगत नाम יְהוָה को ‘याहवे’ के रूप में रखा गया है और צְבָאוֹת को ‘सेनाओं’ से व्यक्त किया गया है, ताकि उपाधि की व्यापक सैन्य तथा स्वर्गीय ध्वनि को अनावश्यक रूप से सीमित न किया जाए।
- source_word: עוֹד יֹאמְרוּ אֶת־הַדָּבָר הַזֶּה
  choice: लोग फिर यह बात कहेंगे
  rationale: עוֹד यहाँ पुनः सुनाई देने वाली उक्ति का संकेत देता है; हिन्दी में ‘फिर’ स्वाभाविक है। क्रिया के अनिर्दिष्ट बहुवचन कर्ता को ‘लोग’ से स्पष्ट किया गया है।
- source_word: בְּאֶרֶץ יְהוּדָה וּבְעָרָיו
  choice: यहूदा देश और उसके नगरों में
  rationale: पुल्लिंग एकवचन प्रत्यय प्रसंग में यहूदा को भौगोलिक क्षेत्र के रूप में संदर्भित करता है; ‘उसके नगरों’ से यह संबंध सहज हिन्दी में बना रहता है।
- source_word: בְּשׁוּבִי אֶת־שְׁבוּתָם
  choice: जब मैं उनकी दशा फिर से बहाल करूँगा
  rationale: यह इब्रानी मुहावरा निर्वासन से लौटाने के साथ-साथ व्यापक पुनर्बहाली भी व्यक्त कर सकता है। मुख्य पाठ व्यापक अर्थ रखता है और पादटिप्पणी निर्वासन-संबंधी विकल्प सुरक्षित करती है।
- source_word: יְבָרֶכְךָ
  choice: याहवे तुझे आशीष दे
  rationale: अपूर्ण क्रिया यहाँ आशीर्वादसूचक इच्छा व्यक्त करती है। एकवचन संबोधन के कारण ‘तुझे’ रखा गया है।
- source_word: נְוֵה צֶדֶק
  choice: धार्मिकता के निवास
  rationale: נְוֵה के निवास-स्थान और चरागाह दोनों अर्थ संभव हैं। पवित्र पर्वत के समानांतर सिय्योन के संबोधन में ‘निवास’ स्वाभाविक है, जबकि वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: הַר הַקֹּדֶשׁ
  choice: पवित्र पर्वत
  rationale: यह सिय्योन/यरूशलेम की पारंपरिक पवित्र-पर्वत छवि को सीधे और स्पष्ट रूप में सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे उपस्थित है। ‘याहवे’ उसका नामात्मक स्वरूप बनाए रखता है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: שׁוּב שְׁבוּת मुहावरे का आशय
  choice: उनकी दशा फिर से बहाल करना
  alternative: उनके बंदियों को लौटा लाना; उन्हें बंधुआई से लौटा लाना
  rationale: वचन की निर्वासन-पृष्ठभूमि वास्तविक है, पर मुहावरा व्यापक पुनर्बहाली भी सूचित कर सकता है। मुख्य पाठ उस व्यापकता को रखता है और संकीर्ण विकल्प को पादटिप्पणी में दर्ज करता है।
- issue: נְוֵה צֶדֶק में צֶדֶק का अर्थ
  choice: धार्मिकता
  alternative: न्याय
  rationale: यहाँ पदबंध पुनर्स्थापित सिय्योन के नैतिक और धार्मिक चरित्र को बताता है। ‘धार्मिकता’ इस व्यापकता को रखती है; ‘न्याय’ संभव है पर अपेक्षाकृत संकीर्ण।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक पाठ के योग्य शैली रखी गई है। भविष्यवाणी की पुनर्बहाली और उद्धृत आशीर्वचन के बीच अंतर स्पष्ट करने के लिए दोहरे और एकहरे उद्धरण-चिह्न प्रयुक्त हैं। ‘तुझे’ एकवचन संबोधन को सुरक्षित रखता है, क्योंकि आशीर्वचन सिय्योन/पवित्र पर्वत को संबोधित है।
