  source_fidelity: The draft accurately represents the prophetic formula, the two parallel prohibitions, the promised reward, Yahweh's affirmation, and the implicit plural return from the enemy's land. However, the Hindi expressions for restraining the voice and especially the eyes are overly literal and do not communicate naturally in modern Hindi.
  naturalness: ‘अपने स्वर को रोने से रोक रखो’ and ‘अपनी आँखों को आँसुओं से रोक रखो’ are grammatically intelligible but idiomatically strained. Recasting them as ‘अपने रोने के स्वर को रोक रखो’ and ‘अपनी आँखों से आँसू बहने न दो’ preserves the Hebrew imagery while yielding natural standard Hindi.
  terminology: ‘याहवे,’ ‘प्रतिफल,’ ‘घोषणा,’ and ‘शत्रु के देश’ are appropriate and retain the intended register. ‘कार्य’ is a broader, less interpretively narrowed equivalent for פְעֻלָּה than ‘परिश्रम.’
  issues:
  - severity: medium
    issue: The wording for the prohibitions is unnatural Hindi.
    rationale: Hindi does not normally say that one restrains one's eyes ‘from tears.’ The revision retains the concrete voice/eyes imagery but uses idiomatic verbal constructions.
  - severity: low
    issue: ‘परिश्रम’ somewhat narrows פְעֻלָּה.
    rationale: The Hebrew can denote work, deed, or labor. ‘कार्य’ better preserves this breadth without imposing a specific sense of strenuous labor.
