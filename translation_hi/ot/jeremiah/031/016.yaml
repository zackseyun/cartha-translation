source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה מִנְעִ֤י קוֹלֵ/ךְ֙ מִ/בֶּ֔כִי וְ/עֵינַ֖יִ/ךְ מִ/דִּמְעָ֑ה כִּי֩ יֵ֨שׁ שָׂכָ֤ר לִ/פְעֻלָּתֵ/ךְ֙ נְאֻם יְהוָ֔ה וְ/שָׁ֖בוּ מֵ/אֶ֥רֶץ אוֹיֵֽב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/016.yaml
  text: 'Thus says Yahweh: Restrain your voice from weeping and your eyes from tears[a], for there is a reward for your work, declares Yahweh[b], and they will return from the land of the enemy.'
translation:
  language: hi
  text: 'याहवे यों कहते हैं:


    “अपने रोने के स्वर को रोक रखो

    और अपनी आँखों से आँसू बहने न दो[a],

    क्योंकि तुम्हारे कार्य का प्रतिफल है,”

    याहवे की यह घोषणा है,

    “और वे शत्रु के देश से लौट आएँगे[b]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने रोने के स्वर को थाम लो।”
    reason: lexical_alternative
  - marker: b
    text: “वे” का संकेत प्रसंग में राहेल के बच्चों, अर्थात निर्वासित लोगों, की ओर है।
    reason: cross_reference
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: याहवे यों कहते हैं
  rationale: मानक नबूवत-संदेश सूत्र को स्वाभाविक और गरिमापूर्ण हिन्दी में रखा गया है; יְהוָה को उसके व्यक्तिगत नाम ‘याहवे’ के रूप में प्रस्तुत किया गया है।
- source_word: מִנְעִי קוֹלֵךְ מִבֶּכִי
  choice: अपने स्वर को रोने से रोक रखो
  rationale: स्त्रीलिंग एकवचन आज्ञा, जो मानवीकृत राहेल को संबोधित है, सुरक्षित रखी गई है। ‘स्वर’ हिब्रू की ठोस छवि को बनाए रखता है; केवल ‘रोना बंद करो’ कहने से वह छवि मिट जाती।
- source_word: וְעֵינַיִךְ מִדִּמְעָה
  choice: और अपनी आँखों को आँसुओं से रोक रखो
  rationale: पहले पदांश के समानांतर संक्षिप्त शारीरिक बिंब को बनाए रखा गया है। हिन्दी में क्रिया की पुनरावृत्ति न करके वह पिछले पदांश से स्वाभाविक रूप से समझी जाती है।
- source_word: כִּי יֵשׁ שָׂכָר לִפְעֻלָּתֵךְ
  choice: क्योंकि तुम्हारे परिश्रम का प्रतिफल है
  rationale: שָׂכָר के पुरस्कार, मजदूरी अथवा बदले के भाव को ‘प्रतिफल’ समेटता है, जबकि פְעֻלָּה के प्रयत्नपूर्ण काम के लिए ‘परिश्रम’ प्रसंगानुकूल है। यह कथन के खुले रूप को बनाए रखता है और प्रतिफल की प्रकृति को नहीं ठहराता।
- source_word: נְאֻם יְהוָה
  choice: याहवे की यह घोषणा है
  rationale: नबूवत की गंभीर पुष्टि को वर्तमान, सुबोध हिन्दी में व्यक्त किया गया है।
- source_word: וְשָׁבוּ
  choice: और वे ... लौट आएँगे
  rationale: हिब्रू में कर्ता निहित तृतीय पुरुष बहुवचन है। मुख्य पाठ में ‘वे’ रखकर उसकी संक्षिप्तता और प्रसंगगत अस्पष्टता बचाई गई है।
- source_word: מֵאֶרֶץ אוֹיֵב
  choice: शत्रु के देश से
  rationale: एकवचन אוֹיֵב की सामूहिक अथवा सामान्य शक्ति को बनाए रखते हुए हिब्रू संबंध-रचना का स्वाभाविक हिन्दी रूप दिया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और ‘प्रभु’ कहकर नाम को उपाधि में नहीं बदलता।
- issue: וְשָׁבוּ का निहित कर्ता
  choice: वे लौट आएँगे
  alternative: तुम्हारे बच्चे लौट आएँगे; निर्वासित लौट आएँगे
  rationale: हिब्रू क्रिया में बहुवचन कर्ता व्यक्त नहीं किया गया। ‘वे’ मूल की संक्षिप्तता बनाए रखता है; आसपास के प्रसंग से इसका संकेत राहेल के बच्चों, अर्थात निर्वासितों, की ओर है, जिसे पादटिप्पणी में स्पष्ट किया गया है।
- issue: ‘तुम्हारे परिश्रम’ और प्रतिफल का संबंध
  choice: संबंध को मूल की तरह खुला रखा गया
  alternative: तुम्हारे मातृ-विलाप का पुरस्कार; बच्चों को पालने के श्रम का प्रतिफल
  rationale: पद स्वयं פְעֻלָּה की सटीक पहचान नहीं करता। किसी विशेष धर्मवैचारिक व्याख्या को मुख्य पाठ में जोड़ना मूल की अर्थगत गुंजाइश को अनुचित रूप से सीमित करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण नबूवती काव्य-रजिस्टर अपनाया गया है। पंक्ति-विन्यास हिब्रू समानांतरता को उभारता है। ‘स्वर’, ‘परिश्रम’, ‘प्रतिफल’ और ‘घोषणा’ सामान्य पाठक के लिए समझने योग्य रहते हुए मूल की गंभीरता बनाए रखते हैं। दोनों पादटिप्पणी-चिह्न [a] और [b] मुख्य पाठ में उपस्थित हैं।
