source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה אִם יִמַּ֤דּוּ שָׁמַ֨יִם֙ מִ/לְ/מַ֔עְלָ/ה וְ/יֵחָקְר֥וּ מֽוֹסְדֵי אֶ֖רֶץ לְ/מָ֑טָּה גַּם אֲנִ֞י אֶמְאַ֨ס בְּ/כָל זֶ֧רַע יִשְׂרָאֵ֛ל עַֽל כָּל אֲשֶׁ֥ר עָשׂ֖וּ נְאֻם יְהוָֽה׀־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/037.yaml
  text: 'Thus says Yahweh: If the heavens above can be measured[a], and the foundations of the earth below can be searched out, then I also will reject all the offspring of Israel for all that they have done, declares Yahweh.'
translation:
  language: hi
  text: 'याहवे यों कहता है: “यदि ऊपर के आकाश को मापा जा सके और नीचे पृथ्वी की नींवों की खोज की जा सके, तभी मैं भी इस्राएल के समस्त वंश को उन सब कामों के कारण त्याग दूँगा[a], जो उन्होंने किए हैं,” याहवे की यह घोषणा है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अस्वीकार कर दूँगा।”
    reason: מָאַס के लिए ‘त्याग देना’ और ‘अस्वीकार करना’ दोनों अर्थ संभव हैं; पादटिप्पणी निकट शाब्दिक विकल्प सुरक्षित रखती है।
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के वाचागत नाम को उपाधि से बदलने के बजाय आधुनिक हिन्दी में निकट ध्वन्यात्मक रूप से प्रस्तुत किया गया है।
- source_word: כֹּה אָמַר
  choice: यों कहता है
  rationale: यह भविष्यद्वक्ताओं का मानक संदेश-सूत्र है; यह रूप संक्षिप्त, स्वाभाविक और गरिमापूर्ण है।
- source_word: אִם יִמַּדּוּ
  choice: यदि ... मापा जा सके
  rationale: इब्रानी की शर्त और निष्क्रिय क्रिया, दोनों को बनाए रखता है; प्रसंग में यह असंभवता की ओर संकेत करने वाली आलंकारिक शर्त है।
- source_word: שָׁמַיִם מִלְמַעְלָה
  choice: ऊपर के आकाश
  rationale: ब्रह्मांडीय संदर्भ और ऊपर-नीचे के स्थानिक समानांतर को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: וְיֵחָקְרוּ
  choice: पूरी थाह ली जा सके
  rationale: חקר के गहराई से खोजने और अंत तक जान लेने के भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: מוֹסְדֵי אֶרֶץ לְמָטָּה
  choice: नीचे पृथ्वी की नींवों
  rationale: मूल के ब्रह्मांडीय चित्र तथा बहुवचन 'नींवों' को बनाए रखता है और 'ऊपर' के साथ समानांतर बनाता है।
- source_word: גַּם אֲנִי
  choice: तभी मैं भी
  rationale: '''तभी'' शर्त के परिणाम को स्वाभाविक हिन्दी में स्पष्ट करता है और ''भी'' मूल के emphatic correspondence को सुरक्षित रखता है।'
- source_word: אֶמְאַס
  choice: त्याग दूँगा
  rationale: מאס का अर्थ अस्वीकार करना या त्याग देना हो सकता है। 'त्याग दूँगा' वाचागत संबंध के संदर्भ में स्वाभाविक है, जबकि वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: בְּכָל זֶרַע יִשְׂרָאֵל
  choice: इस्राएल के समस्त वंश को
  rationale: זֶרַע के सामूहिक अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: עַל כָּל אֲשֶׁר עָשׂוּ
  choice: उन सब कामों के कारण ... जो उन्होंने किए हैं
  rationale: עַל के कारण अथवा आधार के अर्थ को स्पष्ट करता है और पूर्ण क्रिया को वर्तमान से संबद्ध भूतकाल में रखता है।
- source_word: נְאֻם יְהוָה
  choice: याहवे की यह घोषणा है
  rationale: भविष्यद्वाणी के समापन-सूत्र को औपचारिक और स्पष्ट हिन्दी में प्रस्तुत करता है।
theological_decisions:
- issue: इस्राएल के त्यागे जाने के विषय में शर्त का बल
  choice: शर्त को उसके मूल रूप में रखते हुए 'तभी' द्वारा परिणाम से जोड़ा गया है; संदर्भ इसे वस्तुतः असंभव शर्त के रूप में सुनाता है।
  alternative: इस कथन को सीधे इस अर्थ में विस्तार देना कि परमेश्वर इस्राएल को कभी नहीं त्यागेगा।
  rationale: यिर्मयाह 31:35–37 में आकाश की माप और पृथ्वी की नींवों की खोज की असंभवता इस्राएल के स्थायी स्थान की गारंटी का आलंकारिक आधार है। फिर भी अनुवाद मूल की शर्त को स्पष्ट कथन में बदलकर उसकी साहित्यिक और धर्मवैचारिक कसावट को समाप्त नहीं करता।
- issue: זֶרַע יִשְׂרָאֵל का सामूहिक संदर्भ
  choice: इस्राएल के समस्त वंश
  alternative: इस्राएल के सारे वंशज
  rationale: '''वंश'' सामूहिक एकवचन के भाव को बनाए रखता है और यह तय नहीं करता कि कथन का आशय प्रत्येक व्यक्ति से है या इस्राएल की सामूहिक निरंतरता से।'
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण भविष्यद्वाणी-संबंधी गद्य अपनाया गया है। 'पूरी थाह ली जा सके' साधारण पाठक के लिए स्वाभाविक है और मूल के गहन अन्वेषण का भाव रखता है। उद्धरण और समापन-सूत्र को स्पष्ट रखा गया है।
