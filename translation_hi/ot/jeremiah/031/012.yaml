  text: וּ/בָאוּ֮ וְ/רִנְּנ֣וּ בִ/מְרוֹם צִיּוֹן֒ וְ/נָהֲר֞וּ אֶל ט֣וּב יְהוָ֗ה עַל דָּגָן֙ וְ/עַל תִּירֹ֣שׁ וְ/עַל יִצְהָ֔ר וְ/עַל בְּנֵי צֹ֖אן וּ/בָקָ֑ר וְ/הָיְתָ֤ה נַפְשָׁ/ם֙ כְּ/גַ֣ן רָוֶ֔ה וְ/לֹא יוֹסִ֥יפוּ לְ/דַאֲבָ֖ה עֽוֹד־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/012.yaml
  text: They will come and shout for joy on the height of Zion[a], and they will stream to the goodness of Yahweh, to the grain, the new wine, and the fresh oil, and to the young of the flock and the herd. Their life will be like a well-watered garden[d][c][b], and they will never again waste away.
translation:
  language: hi
  text: वे आएँगे और सिय्योन की ऊँचाई पर आनन्द से जयजयकार करेंगे। वे याहवे की भलाई[a] की ओर उमड़ेंगे[b]—अनाज, नई दाखमधु और ताज़े तेल की ओर, और भेड़-बकरियों तथा गाय-बैलों के बच्चों की ओर। उनका जीवन[c] अच्छी तरह सींचे हुए बगीचे के समान होगा, और वे शोक के कारण फिर कभी न मुरझाएँगे[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे की भरपूरी।” यहाँ “भलाई” में वे अच्छी वस्तुएँ भी शामिल हैं जो वह देता है, जैसा आगे की सूची से स्पष्ट है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक बिंब है, “वे याहवे की भलाई की ओर धारा की तरह बहेंगे।” यह क्रिया आशीषों की ओर प्रवाह-जैसी गति दर्शा सकती है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में “उनका नेफेश।” यहाँ इसका आशय उनका जीवन या उनका पूरा जीवित अस्तित्व है, केवल मनुष्य का अभौतिक अंश नहीं।
    reason: lexical_alternative
  - marker: d
    text: या, “वे फिर कभी शोक न करेंगे” अथवा “वे फिर कभी दुर्बल होकर न घुलेंगे।” इब्रानी शब्द शोक के कारण क्षीण होते जाने का भाव दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאוּ וְרִנְּנוּ
  choice: वे आएँगे और ... आनन्द से जयजयकार करेंगे
  rationale: भविष्यसूचक प्रसंग में क्रियाएँ भावी प्रतिज्ञा व्यक्त करती हैं; רנן उल्लासपूर्ण ऊँची आवाज़ में आनन्द प्रकट करने को दर्शाता है।
- source_word: בִמְרוֹם צִיּוֹן
  choice: सिय्योन के ऊँचे स्थान पर
  rationale: एकवचन מָרוֹם सिय्योन के ऊँचे स्थान को सूचित करता है; यह हिन्दी में निकट और स्वाभाविक अभिव्यक्ति है।
- source_word: וְנָהֲרוּ
  choice: उमड़ते हुए आएँगे
  rationale: क्रिया का प्रवाह की तरह किसी ओर बढ़ने का बिंब हिन्दी में ‘उमड़ते हुए आएँगे’ से स्वाभाविक रूप में व्यक्त होता है; ‘बहेंगे’ मनुष्यों के लिए अनावश्यक रूप से शाब्दिक होता।
- source_word: אֶל טוּב יְהוָה
  choice: याहवे की भलाई की ओर
  rationale: טוּב में याहवे की भलाई और उससे मिलने वाली भरपूरी दोनों समाहित हैं; आगे की उपज और पशुधन की सूची उसके ठोस अर्थ को स्पष्ट करती है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी परमेश्वर के व्यक्तिगत नाम का आधुनिक हिन्दी लिप्यंतरण किया गया है, किसी उपाधि से प्रतिस्थापित नहीं।
- source_word: דָּגָן ... תִּירֹשׁ ... יִצְהָר
  choice: अनाज, नई दाखमधु और ताज़ा तेल
  rationale: यह कृषि-उपज की पारंपरिक त्रयी है; תִּירֹשׁ नई दाखमधु और יִצְהָר ताज़े तेल को सूचित करता है।
- source_word: בְּנֵי צֹאן וּבָקָר
  choice: भेड़-बकरियों तथा गाय-बैलों के बच्चे
  rationale: בְּנֵי का अर्थ यहाँ पशुओं की संतान है, केवल सामान्य रूप से झुंड नहीं। हिन्दी में पशु-वर्गों को स्पष्ट करके अर्थ सहज रखा गया है।
- source_word: נַפְשָׁם
  choice: उनका जीवन
  rationale: נֶפֶשׁ यहाँ मनुष्य के समग्र जीवित अस्तित्व को दर्शाता है, केवल देह से अलग किसी अमूर्त ‘आत्मा’ को नहीं।
- source_word: כְּגַן רָוֶה
  choice: अच्छी तरह सींचे हुए बगीचे के समान
  rationale: רָוֶה भरपूर पानी पाए हुए, तृप्त या सिंचित होने का भाव देता है।
- source_word: וְלֹא יוֹסִיפוּ לְדַאֲבָה עוֹד
  choice: वे फिर कभी शोक से न मुरझाएँगे
  rationale: इब्रानी रचना ‘फिर ऐसा करते न रहेंगे’ का अर्थ देती है; דָּאַב में शोक के कारण घुलने, दुर्बल होने या मुरझाने का संयुक्त भाव है।
theological_decisions:
- issue: יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: मूल पाठ में वाचा-संबंधी व्यक्तिगत नाम उपस्थित है; लिप्यंतरण उसे उपाधि में बदलने से बचाता है।
- issue: נֶפֶשׁ का मानवशास्त्रीय अर्थ
  choice: जीवन
  alternative: प्राण / आत्मा / उनका पूरा अस्तित्व
  rationale: बगीचे के समान फलने-फूलने और शोक से मुरझाने के प्रसंग में शब्द पूरे जीवित व्यक्ति की दशा बताता है; ‘आत्मा’ अनचाहे रूप से केवल अभौतिक अंश का संकेत दे सकती है।
- issue: דָּאַב में शोक और क्षीणता का संबंध
  choice: शोक से न मुरझाएँगे
  alternative: फिर शोक न करेंगे / फिर दुर्बल न होंगे
  rationale: चयन भावनात्मक शोक और उससे उत्पन्न क्षीणता दोनों को खुला रखता है तथा सींचे हुए बगीचे के बिंब से स्वाभाविक संबंध बनाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप अपनाया गया है। कृषि-बिंब स्पष्ट रखे गए हैं, अत्यधिक संस्कृतनिष्ठ शब्दावली से बचा गया है, और जहाँ इब्रानी में अर्थ-तनाव है वहाँ पादटिप्पणियों में विकल्प सुरक्षित रखे गए हैं।
