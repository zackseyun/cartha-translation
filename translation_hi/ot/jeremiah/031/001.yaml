  register: आधुनिक मानक हिन्दी; वाक्य गरिमापूर्ण पर सहज रखा गया है। भविष्यद्वाणी की घोषणा को डैशों के बीच रखकर मूल वाक्य का प्रवाह बनाए रखा गया है। ‘प्रजा’ वाचा-संबंधी सामूहिक अर्थ को ‘लोग’ की अपेक्षा अधिक स्पष्ट करती है।
