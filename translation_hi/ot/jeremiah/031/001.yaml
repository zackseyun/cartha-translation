    reason: lexical_alternative
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: उस समय
  rationale: यह स्वाभाविक आधुनिक हिन्दी में भविष्य के उस भविष्यद्वाणी-संबंधी समय या काल का संकेत देता है, बिना उसकी अवधि को अनावश्यक रूप से निश्चित किए।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की वाणी है
  rationale: נְאֻם भविष्यद्वक्ताओं में प्रयुक्त प्रामाणिक घोषणा-सूत्र है। ‘वाणी’ उसकी गंभीरता बनाए रखती है, और याहवे व्यक्तिगत ईश्वरीय नाम को दर्शाता है।
- source_word: אֶהְיֶה לֵאלֹהִים
  choice: मैं ... का परमेश्वर होऊँगा
  rationale: हिन्दी में यह वाचा-संबंधी अपनत्व और ईश्वरीय प्रतिबद्धता को सहज रूप से व्यक्त करता है।
- source_word: לְכֹל מִשְׁפְּחוֹת יִשְׂרָאֵל
  choice: इस्राएल के सभी कुलों
  rationale: מִשְׁפָּחוֹת से विस्तृत पारिवारिक समूह या कुल अभिप्रेत हो सकते हैं। ‘कुलों’ प्राचीन इस्राएल की सामाजिक इकाइयों को आधुनिक ‘परिवार’ की अपेक्षा अधिक ठीक रूप से व्यक्त करता है; विकल्प पादटिप्पणी में दिया गया है।
- source_word: וְהֵמָּה יִהְיוּ לִי לְעָם
  choice: और वे मेरी प्रजा होंगे
  rationale: यह पारस्परिक वाचा-सूत्र को स्वाभाविक और गरिमापूर्ण हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: वाचा-सूत्र का अनुवाद
  choice: मैं इस्राएल के सभी कुलों का परमेश्वर होऊँगा, और वे मेरी प्रजा होंगे
  alternative: मैं इस्राएल के सभी कुलों के लिए परमेश्वर होऊँगा, और वे मेरे लिए एक प्रजा होंगे
  rationale: चुना हुआ रूप हिन्दी में वाचा के पारस्परिक संबंध और अपनत्व को स्पष्ट तथा स्वाभाविक ढंग से व्यक्त करता है, जबकि इब्रानी के अर्थ को किसी विशिष्ट साम्प्रदायिक व्याख्या से सीमित नहीं करता।
- issue: ईश्वरीय नाम יהוה
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में प्रयुक्त व्यक्तिगत नाम को शीर्षक से बदलने के बजाय लिप्यंतरित किया गया है।
