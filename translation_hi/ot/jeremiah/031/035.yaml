  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। काव्यात्मक समानांतरता तथा अंतिम ईश्वरीय उपाधि सुरक्षित हैं। 'उजियाला' सामान्य पाठकों के लिए सुबोध होते हुए बाइबिलीय गरिमा बनाए रखता है।
