base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/035.yaml
  text: 'Thus says Yahweh[a], who gives the sun for light by day, the fixed order of the moon and stars for light by night[b], who stirs up the sea so that its waves roar—Yahweh of hosts is his name:'
translation:
  language: hi
  text: याहवेह[a] यों कहता है—जो दिन के उजाले के लिए सूर्य देता है, और रात के उजाले के लिए चाँद और तारों की निश्चित व्यवस्था देता है; जो समुद्र को आंदोलित करता है, जिससे उसकी लहरें गरजती हैं—उसका नाम सेनाओं का याहवेह है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में परमेश्वर का व्यक्तिगत नाम יהוה (YHWH) है; यहाँ उसका लिप्यंतरण “याहवेह” किया गया है।
    reason: divine_name
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: याहवेह यों कहता है
  rationale: मानक भविष्यद्वक्तीय संदेश-सूत्र को स्वाभाविक और गरिमापूर्ण हिन्दी में रखा गया है; वर्तमानकालीन रूप हिब्रू सूत्र के प्रचलित अर्थ को व्यक्त करता है।
- source_word: נֹתֵן שֶׁמֶשׁ לְאוֹר יוֹמָם
  choice: जो दिन में उजियाला देने के लिए सूर्य ... ठहराता है
  rationale: नֹתֵן के निरंतर कर्तृत्वसूचक कृदन्त भाव तथा לְאוֹר के प्रयोजन/कार्य को स्पष्ट करता है। पूरे समानांतर वाक्य में 'ठहराता है' सूर्य और आकाशीय व्यवस्था दोनों पर स्वाभाविक रूप से लागू किया गया है।
- source_word: חֻקֹּת יָרֵחַ וְכוֹכָבִים
  choice: चाँद और तारों की निर्धारित व्यवस्था
  rationale: חֻקֹּת का ब्रह्मांडीय संदर्भ में आशय नियम-विधान की अपेक्षा स्थापित और नियमित क्रम से है; 'निर्धारित व्यवस्था' इस अर्थ को साधारण आधुनिक हिन्दी में व्यक्त करती है।
- source_word: לְאוֹר לָיְלָה
  choice: रात में उजियाला देने के लिए
  rationale: दिन वाले समानांतर पद की संरचना और प्रयोजनसूचक अर्थ बनाए रखता है।
- source_word: רֹגַע הַיָּם
  choice: जो समुद्र को उकसाता है
  rationale: यद्यपि क्रिया का अर्थ कुछ संदर्भों में शांत करना हो सकता है, अगले पद में लहरों के गरजने के कारण यहाँ समुद्र को आंदोलित या उकसाने का अर्थ अधिक उपयुक्त है।
- source_word: וַיֶּהֱמוּ גַלָּיו
  choice: जिससे उसकी लहरें गरज उठती हैं
  rationale: वाव् और अपूर्ण क्रिया को पूर्ववर्ती क्रिया के परिणाम के रूप में स्वाभाविक हिन्दी में व्यक्त किया गया है; 'गरज उठती हैं' ध्वनि और आंदोलन दोनों का बोध कराता है।
- source_word: יְהוָה צְבָאוֹת שְׁמוֹ
  choice: उसका नाम सेनाओं का याहवेह है
  rationale: צְבָאוֹת की व्यापक सैन्य/स्वर्गीय अर्थ-छाया को 'सेनाओं' द्वारा सुरक्षित रखा गया है और नामसूचक निर्बंध वाक्य को स्वाभाविक हिन्दी में प्रस्तुत किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवेह
  alternative: यहोवा; प्रभु
  rationale: हिब्रू पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। लिप्यंतरण इसे किसी उपाधि से बदलने के बजाय सुरक्षित रखता है; 'याहवेह' हिन्दी पाठक के लिए उच्चारण को भी स्पष्ट करता है।
- issue: समुद्र के संबंध में רֹגַע का अर्थ
  choice: समुद्र को उकसाता है
  alternative: समुद्र को शांत करता है
  rationale: क्रिया की शब्दार्थगत द्व्यर्थता स्वीकार की गई है, पर साथ लगे परिणाम—लहरों का गरजना—इस संदर्भ में समुद्र को आंदोलित करने वाले अर्थ का समर्थन करता है। वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- issue: צְבָאוֹת वाली ईश्वरीय उपाधि
  choice: सेनाओं का याहवेह
  alternative: सर्वशक्तिमान याहवेह
  rationale: '''सेनाओं'' मूल पद की मूर्त और व्यापक अर्थ-छाया को बनाए रखता है; ''सर्वशक्तिमान'' व्याख्यात्मक है और मूल बिंब को हटा देता है।'
