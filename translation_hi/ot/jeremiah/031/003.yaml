source:
  edition: WLC
  text: מֵ/רָח֕וֹק יְהוָ֖ה נִרְאָ֣ה לִ֑/י וְ/אַהֲבַ֤ת עוֹלָם֙ אֲהַבְתִּ֔י/ךְ עַל כֵּ֖ן מְשַׁכְתִּ֥י/ךְ חָֽסֶד־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/003.yaml
  text: 'From far away Yahweh appeared to me: “I have loved you with an everlasting love[b][a]; therefore I have drawn you with steadfast love.”'
translation:
  language: hi
  text: 'दूर से याहवे मुझे दिखाई दिया:[a]


    “मैंने तुझसे सदा का प्रेम किया है;


    इसीलिए मैंने अटल प्रेम से तुझे खींचा है।”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे उसे दूर से दिखाई दिया।” ‘दूर से’ का संबंध ‘दिखाई दिया’ से लिया जा सकता है; संदर्भ के आधार पर कुछ अनुवाद ‘मुझे’ के स्थान पर ‘उसे’ करते हैं।
    reason: alternative_reading
  - marker: b
    text: 'इब्रानी वाक्यांश का अनुवाद यह भी हो सकता है: “इसीलिए मैंने तुझ पर अटल प्रेम बनाए रखा है।” यहाँ חֶסֶד निष्ठावान, कृपालु प्रेम को दर्शाता है; इसके अन्य संभावित रूप ‘करुणामय निष्ठा’ और ‘वाचा की निष्ठा’ हैं।'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: מֵרָחוֹק
  choice: दूर से
  rationale: यह स्थानिक दूरी का सहज और संक्षिप्त हिन्दी रूप है। पद में इसका संबंध ‘दिखाई दिया’ से लिया गया है, जबकि संभावित वाक्य-संबंधी अस्पष्टता पादटिप्पणी में सुरक्षित है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम का देवनागरी लिप्यंतरण किया गया है; इसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: נִרְאָה לִי
  choice: मुझे दिखाई दिया
  rationale: נפעל रूप का स्वाभाविक हिन्दी अर्थ ‘दिखाई दिया/प्रकट हुआ’ है। ‘मुझे दिखाई दिया’ स्रोत की अनुभूति-संबंधी रचना के निकट और सामान्य हिन्दी में सहज है।
- source_word: וְאַהֲבַת עוֹלָם
  choice: सदा का प्रेम
  rationale: עוֹלָם यहाँ स्थायी, अनवरत अवधि व्यक्त करता है। ‘सदा का प्रेम’ सरल आधुनिक हिन्दी में उस निरंतरता को बनाए रखता है।
- source_word: אֲהַבְתִּיךְ
  choice: मैंने तुझसे ... प्रेम किया है
  rationale: हिन्दी पूर्ण वर्तमान भूतकालीन प्रेम और उसकी वर्तमान प्रासंगिकता दोनों व्यक्त करता है। स्त्रीलिंग एकवचन कर्म-सर्वनाम का लिंग हिन्दी ‘तुझसे’ में अप्रकट रहता है, जैसा स्वाभाविक हिन्दी में होता है।
- source_word: עַל כֵּן
  choice: इसीलिए
  rationale: यह पिछले कथन से परिणाम या आधार का संबंध स्पष्ट करता है और ‘इस कारण’ की तुलना में पद्यात्मक वाणी में अधिक सहज है।
- source_word: מְשַׁכְתִּיךְ
  choice: तुझे अपनी ओर खींचता रहा हूँ
  rationale: משך का मूल बिंब ‘खींचना’ सुरक्षित रखा गया है। ‘अपनी ओर’ हिन्दी में आशय स्पष्ट करता है, और ‘खींचता रहा हूँ’ पूर्व से जारी कार्य की शक्ति व्यक्त करता है।
- source_word: חָסֶד
  choice: अटल प्रेम
  rationale: חסד के निष्ठावान, कृपालु और संबंधपरक प्रेम को सामान्य पाठक के लिए सुबोध रूप में व्यक्त करता है, जबकि इसे साधारण אַהֲבָה से अलग भी रखता है।
theological_decisions:
- issue: אַהֲבָה और חֶסֶד के बीच संबंध
  choice: दोनों को क्रमशः ‘प्रेम’ और ‘अटल प्रेम’ के रूप में अलग किंतु संबंधित अभिव्यक्तियों से अनूदित किया गया।
  alternative: दोनों के लिए केवल ‘प्रेम’, अथवा חֶסֶד के लिए ‘वाचा की निष्ठा’।
  rationale: मूल पाठ दो संबंधित, पर समानार्थी न होने वाले शब्दों का प्रयोग करता है। अलग अभिव्यक्तियाँ इस बनावट को बचाती हैं और ‘वाचा’ शब्द जोड़कर अर्थ को अनावश्यक रूप से संकीर्ण नहीं करतीं।
- issue: पूर्ण क्रियाओं का काल-पक्ष
  choice: ‘प्रेम किया है’ और निरंतरता सूचित करने वाला ‘खींचता रहा हूँ’।
  alternative: 'साधारण भूतकाल: ‘प्रेम किया’ और ‘खींचा’।'
  rationale: ये रूप अतीत में आरंभ हुए परमेश्वर के कार्य और वर्तमान तक उनकी प्रासंगिकता को व्यक्त करते हैं। दूसरी क्रिया के हिन्दी रूप में संदर्भगत निरंतरता आती है, पर वैकल्पिक मुहावरेदार समझ पादटिप्पणी में दी गई है।
- issue: מְשַׁכְתִּיךְ חָסֶד का संबंध
  choice: חָסֶד को खींचने के साधन या ढंग के रूप में समझते हुए ‘अटल प्रेम से ... अपनी ओर खींचता रहा हूँ’।
  alternative: इसे मुहावरे के रूप में ‘मैं तुझ पर अटल प्रेम बनाए रखता रहा हूँ’ समझना।
  rationale: मुख्य पाठ משך के ठोस बिंब को बनाए रखता है, किंतु इब्रानी वाक्यांश की दूसरी स्वीकृत समझ को निर्णायक रूप से अस्वीकार नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, एकवचन आत्मीय संबोधन ‘तू/तुझ’ के साथ। शैली गरिमापूर्ण और काव्यात्मक है, पर ‘सनातन’ या ‘प्रेममय करुणा’ जैसे अपेक्षाकृत संस्कृतनिष्ठ रूपों से बचकर सामान्य पाठक के लिए सहज रखी गई है। पंक्ति-विन्यास मूल काव्यात्मक समानांतरता और प्रत्यक्ष वचन को स्पष्ट करता है।
