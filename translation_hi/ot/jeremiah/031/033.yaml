source:
  edition: WLC
  text: כִּ֣י זֹ֣את הַ/בְּרִ֡ית אֲשֶׁ֣ר אֶכְרֹת֩ אֶת בֵּ֨ית יִשְׂרָאֵ֜ל אַחֲרֵ֨י הַ/יָּמִ֤ים הָ/הֵם֙ נְאֻם יְהוָ֔ה נָתַ֤תִּי אֶת תּֽוֹרָתִ/י֙ בְּ/קִרְבָּ֔/ם וְ/עַל לִבָּ֖/ם אֶכְתֲּבֶ֑/נָּה וְ/הָיִ֤יתִי לָ/הֶם֙ לֵֽ/אלֹהִ֔ים וְ/הֵ֖מָּה יִֽהְיוּ לִ֥/י לְ/עָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/033.yaml
  text: 'For this is the covenant that I will make with the house of Israel after those days[a], declares Yahweh: I will put my law within them, and I will write it on their hearts. And I will be their God[c][b], and they shall be my people.'
translation:
  language: hi
  text: 'क्योंकि उन दिनों के बाद मैं इस्राएल के घराने के साथ यह वाचा बाँधूँगा[a]—यह यहोवा की घोषणा है: मैं अपनी व्यवस्था[b] उनके भीतर रखूँगा[c] और उसे उनके हृदयों पर लिखूँगा। मैं उनका परमेश्वर होऊँगा और वे मेरी प्रजा होंगे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शब्दशः, “वाचा काटूँगा”; इसका अर्थ वाचा बाँधना है।
    reason: lexical_alternative
  - marker: b
    text: या, “अपनी शिक्षा” अथवा “अपना निर्देश।” इब्रानी तोराह का अर्थ व्यवस्था के साथ-साथ शिक्षा या निर्देश भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: “रखूँगा” के लिए इब्रानी क्रिया का रूप पूर्णकालिक है, अर्थात शब्दशः “मैंने रखी है”; पर इस भावी प्रतिज्ञा के प्रसंग में उसका अर्थ भविष्य का समझा गया है।
    reason: textual_grammar
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण अथवा स्पष्टीकरण प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַבְּרִית ... אֶכְרֹת
  choice: वाचा बाँधूँगा
  rationale: ‘वाचा’ בְּרִית का स्थापित बाइबलीय प्रतिशब्द है। हिन्दी मुहावरा ‘वाचा बाँधना’ मूल इब्रानी ‘वाचा काटना’ के आशय को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בֵּית יִשְׂרָאֵל
  choice: इस्राएल का घराना
  rationale: मूल के सामूहिक और वाचागत पदबंध को केवल ‘इस्राएल’ कहकर समतल करने के बजाय सुरक्षित रखता है।
- source_word: אַחֲרֵי הַיָּמִים הָהֵם
  choice: उन दिनों के बाद
  rationale: कालवाचक पदबंध का निकट, स्पष्ट और बिना अतिरिक्त व्याख्या का अनुवाद।
- source_word: נְאֻם יְהוָה
  choice: यह यहोवा की घोषणा है
  rationale: भविष्यद्वाणी के औपचारिक कथन-सूत्र का गरिमापूर्ण और स्वाभाविक हिन्दी रूप; व्यक्तिगत दिव्य नाम को ‘यहोवा’ रखा गया है।
- source_word: נָתַתִּי ... תּוֹרָתִי בְּקִרְבָּם
  choice: मैं अपनी व्यवस्था उनके भीतर रखूँगा
  rationale: रूप की दृष्टि से क्रिया पूर्णकालिक है, पर चारों ओर के भावी प्रतिज्ञात्मक क्रियारूपों के साथ इसका आशय भविष्य का है। ‘भीतर’ आंतरिक स्थान को हृदयों के समानांतर स्पष्ट करता है।
- source_word: תּוֹרָתִי
  choice: अपनी व्यवस्था
  rationale: תּוֹרָה का अर्थ ‘शिक्षा’ भी हो सकता है, किंतु यहाँ वाचा के संदर्भ में ‘व्यवस्था’ उसके वाचागत और धर्मग्रंथीय संबंध को बेहतर बनाए रखती है; विकल्प पादटिप्पणी में दिया गया है।
- source_word: וְעַל לִבָּם אֶכְתֲּבֶנָּה
  choice: और उसे उनके हृदयों पर लिखूँगा
  rationale: स्त्रीलिंग प्रत्यय को ‘उसे’ के द्वारा व्यवस्था की ओर लौटाता है और आंतरिक की गई वाचागत अपेक्षा के रूपक को बनाए रखता है।
- source_word: וְהָיִתִי לָהֶם לֵאלֹהִים וְהֵמָּה יִהְיוּ לִי לְעָם
  choice: मैं उनका परमेश्वर होऊँगा और वे मेरी प्रजा होंगे
  rationale: परस्पर वाचा-संबंध के सूत्र को संक्षिप्त, सीधी और पारंपरिक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: נָתַתִּי का भविष्यसूचक पूर्णकाल
  choice: भविष्य अर्थ में ‘मैं ... रखूँगा’
  alternative: शाब्दिक रूप-आधारित ‘मैंने ... रखी है’
  rationale: पद का ढाँचा भावी वाचा और ‘लिखूँगा’, ‘होऊँगा’, ‘होंगे’ जैसी प्रतिज्ञाओं से बना है। भविष्य अर्थ प्रसंगगत क्रम को सुरक्षित रखता है, जबकि पादटिप्पणी रूपगत तनाव दर्ज करती है।
- issue: नई वाचा के संदर्भ में תּוֹרָה
  choice: मुख्य पाठ में ‘व्यवस्था’
  alternative: ‘शिक्षा’ अथवा ‘निर्देश’
  rationale: शब्द का अर्थ व्यापक रूप से शिक्षा हो सकता है, पर यहाँ परमेश्वर की वाचा-संबंधी इच्छा और मानक प्रमुख हैं। व्यापक अर्थ की वास्तविक संभावना पादटिप्पणी में सुरक्षित है।
- issue: दिव्य नाम יהוה
  choice: ‘यहोवा’
  alternative: ‘प्रभु’
  rationale: मूल में व्यक्तिगत वाचागत नाम उपस्थित है; उसे उपाधि में बदलने के बजाय नाम के रूप में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज है। ‘वाचा’, ‘व्यवस्था’, ‘हृदय’ और ‘प्रजा’ जैसे प्रमुख बाइबलीय शब्द बनाए गए हैं। वाक्यक्रम को हिन्दी की स्वाभाविकता के अनुसार रखा गया है, और इब्रानी की वास्तविक शाब्दिक तथा व्याकरणिक संभावनाएँ पादटिप्पणियों में दर्ज हैं।
