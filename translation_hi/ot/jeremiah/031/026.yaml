  text: עַל זֹ֖את הֱקִיצֹ֣תִי וָ/אֶרְאֶ֑ה וּ/שְׁנָתִ֖/י עָ֥רְבָה לִּֽ/י־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/026.yaml
  text: At this I awoke and looked[a], and my sleep was pleasant to me.
translation:
  language: hi
  text: इस पर मैं जाग उठा और मैंने देखा; मेरी नींद मुझे सुखद लगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל זֹאת
  choice: इस पर
  rationale: यह पदबंध उस अवसर या अनुभव की ओर संकेत करता है जिस पर वक्ता जागता है। ‘इस पर’ संकेतात्मक अर्थ को बनाए रखता है और कारण का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: הֱקִיצֹתִי
  choice: मैं जाग उठा
  rationale: प्रथम पुरुष एकवचन का सक्रिय रूप है। ‘जाग उठा’ आधुनिक हिन्दी में स्वाभाविक है और मूल में निहित न होने वाला कर्मवाच्य भाव नहीं जोड़ता।
- source_word: וָאֶרְאֶה
  choice: और मैंने देखा
  rationale: ראה का सामान्य अर्थ ‘देखना’ है। यहाँ जागने के बाद देखने या सचेत होने का भाव हो सकता है; ‘मैंने देखा’ मूल की अर्थगत व्यापकता को ‘नज़र डाली’ की अपेक्षा बेहतर सुरक्षित रखता है।
- source_word: וּשְׁנָתִי
  choice: मेरी नींद
  rationale: שֵׁנָה का सीधा और सामान्य आधुनिक हिन्दी रूप ‘नींद’ है।
- source_word: עָרְבָה לִּי
  choice: मुझे सुखद लगी
  rationale: ערב यहाँ मनोहर, मधुर या सुखद होने का भाव व्यक्त करता है। ‘मुझे सुखद लगी’ स्वाभाविक हिन्दी है और अनुभवकर्ता को व्यक्त करने वाले לִי को भी सुरक्षित रखता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज। वाक्य में अर्धविराम जागने और नींद के मूल्यांकन के बीच मूल पाठ की दो समन्वित धाराओं को स्पष्ट करता है। अंग्रेज़ी परामर्श-पाठ में दिया गया वैकल्पिक पादटिप्पणी-पाठ वास्तव में ‘देखा’ के बजाय ‘नींद मधुर थी’ से संबंधित प्रतीत होता है; इसलिए गलत संबद्धता वाला पादटिप्पणी-चिह्न नहीं जोड़ा गया।
