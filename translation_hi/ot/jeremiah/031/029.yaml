source:
  edition: WLC
  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם לֹא יֹאמְר֣וּ ע֔וֹד אָב֖וֹת אָ֣כְלוּ בֹ֑סֶר וְ/שִׁנֵּ֥י בָנִ֖ים תִּקְהֶֽינָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/029.yaml
  text: In those days they will no longer say[a], ‘The fathers have eaten sour grapes, and the sons’ teeth are set on edge.’
translation:
  language: hi
  text: उन दिनों लोग फिर यह नहीं कहेंगे, “पिताओं ने खट्टे अंगूर खाए, और बेटों के दाँत खट्टे हो जाते हैं।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “पिताओं ने कच्चे अंगूर खाए, और बेटों के दाँत कुंद हो जाते हैं।”'
    reason: בֹסֶר का अधिक शाब्दिक अर्थ ‘कच्चे/अधपके अंगूर’ है, और תִּקְהֶינָה दाँतों के कुंद या भोथरे हो जाने का अर्थ भी दे सकता है।
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: उन दिनों
  rationale: यह भविष्यसूचक कथन में प्रयुक्त इब्रानी कालवाचक मुहावरे का स्वाभाविक और प्रचलित हिन्दी रूप है।
- source_word: לֹא יֹאמְרוּ עוֹד
  choice: लोग फिर यह नहीं कहेंगे
  rationale: इब्रानी में कर्ता अनिश्चित बहुवचन है। हिन्दी में ‘लोग’ जोड़ने से सक्रिय बहुवचन और कथन का स्वाभाविक प्रवाह दोनों सुरक्षित रहते हैं; ‘फिर ... नहीं’ עוֹד के समाप्ति-बोध को व्यक्त करता है।
- source_word: אָבוֹת
  choice: पिताओं
  rationale: मूल शब्द विशेष रूप से ‘पिता’ का बहुवचन है। ‘पूर्वजों’ या ‘माता-पिता’ से अर्थ को व्यापक किए बिना मूल की पुरुषवाचक रिश्तेदारी सुरक्षित रखी गई है।
- source_word: אָכְלוּ
  choice: ने ... खाए
  rationale: इब्रानी पूर्ण क्रिया को हिन्दी का सामान्य पूर्ण भूतकाल स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בֹסֶר
  choice: खट्टे अंगूर
  rationale: शब्द कच्चे अथवा अधपके अंगूरों को दर्शाता है, जिनकी खटास कहावत में दाँतों पर प्रभाव डालती है। मुख्य पाठ में ‘खट्टे अंगूर’ साधारण पाठक के लिए प्रभाव को तुरंत स्पष्ट करता है।
- source_word: וְשִׁנֵּי בָנִים
  choice: और बेटों के दाँत
  rationale: ‘बेटों’ से इब्रानी בָנִים का पुरुषवाचक रूप और पीढ़ियों के बीच का संबंध सुरक्षित रहता है।
- source_word: תִּקְהֶינָה
  choice: खट्टे हो गए
  rationale: यह हिन्दी में खट्टे फल से दाँतों पर पड़ने वाले अप्रिय प्रभाव का परिचित कहावती रूप है। मूल क्रिया में दाँतों के कुंद या संवेदनाहीन होने का भाव भी है, जिसे पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: कहावत में पीढ़ियों के लिए प्रयुक्त रिश्तेदारी-सूचक शब्द
  choice: मुख्य पाठ में ‘पिताओं’ और ‘बेटों’ को बनाए रखा गया
  alternative: ‘माता-पिता’ और ‘बच्चे’, अथवा ‘पूर्वज’ और ‘वंशज’
  rationale: यह कहावत अंतरपीढ़ी परिणाम की बात करती है, पर इब्रानी पाठ में दोनों संज्ञाएँ पुरुषवाचक हैं। इसलिए अर्थ को लिंग-निरपेक्ष बनाकर विस्तृत नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘लोग’ अनिश्चित बहुवचन कर्ता को हिन्दी में स्पष्ट करता है। कहावत की संक्षिप्त समानांतर रचना और मूल के पुरुषवाचक रिश्तेदारी-सूचक शब्द सुरक्षित रखे गए हैं।
