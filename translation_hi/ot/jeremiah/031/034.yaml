  text: וְ/לֹ֧א יְלַמְּד֣וּ ע֗וֹד אִ֣ישׁ אֶת רֵעֵ֜/הוּ וְ/אִ֤ישׁ אֶת אָחִי/ו֙ לֵ/אמֹ֔ר דְּע֖וּ אֶת יְהוָ֑ה כִּֽי כוּלָּ/ם֩ יֵדְע֨וּ אוֹתִ֜/י לְ/מִ/קְטַנָּ֤/ם וְ/עַד גְּדוֹלָ/ם֙ נְאֻם יְהוָ֔ה כִּ֤י אֶסְלַח֙ לַֽ/עֲוֺנָ֔/ם וּ/לְ/חַטָּאתָ֖/ם לֹ֥א אֶזְכָּר עֽוֹד־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/034.yaml
  text: And they will no longer teach[a], each man his neighbor and each man his brother, saying, ‘Know Yahweh,’ for they will all know me, from the least of them to the greatest of them, declares Yahweh. For I will forgive their iniquity[c][b], and I will remember their sin no more.
translation:
  language: hi
  text: अब कोई भी अपने पड़ोसी को और अपने भाई को यह कहकर नहीं सिखाएगा, “याहवे को जानो,” क्योंकि वे सभी, उनमें छोटे से लेकर बड़े तक, मुझे जानेंगे—याहवे की घोषणा है। क्योंकि मैं उनका अधर्म क्षमा करूँगा और उनका पाप फिर कभी स्मरण नहीं करूँगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְלַמְּדוּ עוֹד
  choice: फिर ... शिक्षा नहीं देगा
  rationale: नकार के साथ עוֹד पूर्व प्रथा की समाप्ति बताता है; ‘फिर ... नहीं’ स्वाभाविक हिन्दी है। פיעל रूप יְלַמְּדוּ का अर्थ ‘शिक्षा देना/सिखाना’ है।
- source_word: אִישׁ אֶת־רֵעֵהוּ וְאִישׁ אֶת־אָחִיו
  choice: कोई अपने पड़ोसी को और कोई अपने भाई को
  rationale: दोहराया गया אִישׁ वितरणात्मक है। ‘कोई ... कोई’ हिन्दी में इस संरचना को सहजता से व्यक्त करता है, जबकि ‘पड़ोसी’ और ‘भाई’ सामुदायिक तथा पारिवारिक शब्दावली को बनाए रखते हैं।
- source_word: דְּעוּ אֶת־יְהוָה
  choice: याहवे को जानो
  rationale: ידע का सीधा अर्थ ‘जानना’ है और यहाँ उसका संबंधपरक-वाचाई विस्तार खुला रहता है। יְהוָה को व्यक्तिगत दिव्य नाम ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: כִּי כוּלָּם יֵדְעוּ אוֹתִי
  choice: क्योंकि ... वे सब मुझे जानेंगे
  rationale: व्यक्तिवाचक कर्म के साथ ידע संबंधपरक ज्ञान व्यक्त कर सकता है; ‘मुझे जानेंगे’ अर्थ को किसी संकीर्ण धर्मवैज्ञानिक सूत्र में नहीं बाँधता।
- source_word: לְמִקְטַנָּם וְעַד־גְּדוֹלָם
  choice: छोटे से लेकर बड़े तक
  rationale: यह समग्र समुदाय को समेटने वाला द्विध्रुवीय मुहावरा है। हिन्दी में ‘छोटे से लेकर बड़े तक’ स्वाभाविक और अर्थसंगत है।
- source_word: נְאֻם־יְהוָה
  choice: याहवे की यह घोषणा है
  rationale: मानक भविष्यद्वाणी-सूत्र की गंभीरता और वक्ता की पहचान दोनों सुरक्षित रहती हैं।
- source_word: אֶסְלַח לַעֲוֺנָם
  choice: मैं उनका अधर्म क्षमा करूँगा
  rationale: סלח दिव्य क्षमा का सामान्य क्रियापद है। עָוֹן के नैतिक अपराध-बोध वाले भार को ‘अधर्म’ व्यक्त करता है और इसे अगले חַטָּאת से अलग रखता है।
- source_word: וּלְחַטָּאתָם לֹא אֶזְכָּר עוֹד
  choice: उनका पाप फिर कभी स्मरण नहीं करूँगा
  rationale: ‘स्मरण नहीं करूँगा’ זכר की जानबूझकर स्मरण/ध्यान में लाने की भाषा को बनाए रखता है; ‘फिर कभी’ नकार सहित עוֹד का स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: वाचा के संदर्भ में ‘जानना’
  choice: ‘जानो/जानेंगे’ को संबंधपरक गहराई सहित अपरिभाषित रखा गया
  alternative: ‘स्वीकार करो’, ‘उद्धारकारी संबंध में रहो’
  rationale: मूल ידע संबंधपरक-वाचाई अर्थ रखता है, पर पद स्वयं इसे किसी अधिक संकीर्ण धर्मवैज्ञानिक पदावली में स्पष्ट नहीं करता।
- issue: वितरणात्मक पुल्लिंग אִישׁ
  choice: ‘कोई ... कोई’
  alternative: ‘हर पुरुष ... हर पुरुष’
  rationale: हिब्रू का पुल्लिंग एकवचन समुदाय के सदस्यों के लिए वितरणात्मक है। आधुनिक हिन्दी में ‘कोई ... कोई’ उसी वितरणात्मक बल को बिना अनावश्यक जैविक संकीर्णता के स्वाभाविक ढंग से देता है।
- issue: दिव्य नाम יְהוָה
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत चतुरक्षरीय नाम है; उसे उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में रखा गया है।
- issue: ‘पाप स्मरण न करना’
  choice: मूल स्मृति-भाषा को यथावत रखा गया
  alternative: ‘पाप का दंड नहीं दूँगा’
  rationale: दंड न देने का आशय संदर्भ में निहित हो सकता है, लेकिन अनुवाद उस व्याख्या को मूल के ‘स्मरण’ क्रियापद के स्थान पर नहीं रखता।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण पर सामान्य पाठक के लिए सुबोध। वाक्य-विन्यास को हिन्दी के अनुरूप बनाया गया है, जबकि पड़ोसी/भाई, जानना, अधर्म/पाप और स्मरण जैसी मूल की प्रमुख भिन्नताएँ सुरक्षित रखी गई हैं।
