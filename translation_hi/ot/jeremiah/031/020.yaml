source:
  edition: WLC
  text: הֲ/בֵן֩ יַקִּ֨יר לִ֜/י אֶפְרַ֗יִם אִ֚ם יֶ֣לֶד שַׁעֲשֻׁעִ֔ים כִּֽי מִ/דֵּ֤י דַבְּרִ/י֙ בּ֔/וֹ זָכֹ֥ר אֶזְכְּרֶ֖/נּוּ ע֑וֹד עַל כֵּ֗ן הָמ֤וּ מֵעַ/י֙ ל֔/וֹ רַחֵ֥ם אֲֽרַחֲמֶ֖/נּוּ נְאֻם יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/020.yaml
  text: Is Ephraim a precious son to me[a], a child of delight? For as often as I speak of him, I still surely remember him. Therefore my inward parts are stirred for him; I will surely have compassion on him[b], declares Yahweh.
translation:
  language: hi
  text: क्या एप्रैम मेरे लिए एक प्रिय पुत्र है? क्या वह मेरा दुलारा बच्चा है? जब-जब मैं उसके विषय में बोलता हूँ[a], तब भी मैं उसे अवश्य याद करता रहता हूँ। इसलिए मेरा हृदय उसके लिए व्याकुल हो उठता है[b]; मैं उस पर निश्चय ही दया करूँगा—यहोवा की यह घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “जब-जब मैं उसके विरुद्ध बोलता हूँ” भी हो सकता है। इब्रानी पदबंध सामान्य रूप से “उसके विषय में” कह सकता है, पर प्रसंग में दंड की वाणी का भाव संभव है।
    reason: alternative_reading
  - marker: b
    text: 'शाब्दिक भाव: “मेरे भीतर के अंग उसके लिए व्याकुल हो उठते हैं”; यह गहरी करुणा और स्नेह का इब्रानी मुहावरा है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲבֵן יַקִּיר לִי
  choice: क्या एप्रैम मेरा प्यारा बेटा है
  rationale: יַקִּיר में प्रियता और बहुमूल्यता का भाव है। आधुनिक हिन्दी में ‘प्यारा बेटा’ प्रश्न की आत्मीयता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אִם יֶלֶד שַׁעֲשֻׁעִים
  choice: मेरा दुलारा बच्चा
  rationale: शाब्दिक रूप से यह ‘आनंद/लाड़ का बच्चा’ है। ‘दुलारा बच्चा’ प्रेम और आनंद दोनों का भाव सहज हिन्दी में देता है।
- source_word: כִּי מִדֵּי דַבְּרִי בּוֹ
  choice: जब-जब मैं उसके विषय में बोलता हूँ
  rationale: בּוֹ यहाँ ‘उसके विषय में’ अथवा प्रसंगानुसार ‘उसके विरुद्ध’ समझा जा सकता है। मुख्य पाठ तटस्थ और निकटतर अर्थ रखता है; न्यायवचन वाला विकल्प पादटिप्पणी में है।
- source_word: זָכֹר אֶזְכְּרֶנּוּ עוֹד
  choice: तब भी मैं उसे अवश्य याद करता रहता हूँ
  rationale: क्रिया के साथ infinitive absolute का प्रयोग बल देता है; עוֹד निरंतरता बताता है। ‘अवश्य’ और ‘करता रहता हूँ’ दोनों पक्ष सुरक्षित रखते हैं।
- source_word: הָמוּ מֵעַי לוֹ
  choice: मेरा अंतरतम उसके लिए उमड़ता है
  rationale: מֵעַי शरीर के भीतर के अंगों का रूपक है और הָמוּ तीव्र आंतरिक हलचल बताता है। यह हिन्दी अभिव्यक्ति देहगत रूपक को मर्यादित और बोधगम्य रखती है।
- source_word: רַחֵם אֲרַחֲמֶנּוּ
  choice: मैं उस पर निश्चय ही दया करूँगा
  rationale: infinitive absolute दया करने की प्रतिज्ञा पर जोर देता है। ‘निश्चय ही’ उसी बल को व्यक्त करता है।
- source_word: נְאֻם יְהוָה
  choice: यह यहोवा की घोषणा है
  rationale: यह मानक नबूवतीय सूत्र है। स्रोत में उपस्थित व्यक्तिगत नाम יהוה को ‘यहोवा’ रूप में पारदर्शी ढंग से रखा गया है।
theological_decisions:
- issue: एप्रैम का संदर्भ और प्रश्नों का भाव
  choice: एप्रैम को उत्तरी इस्राएली समुदाय का प्रिय पुत्र के रूप में मानवीकरण करते हुए प्रश्नात्मक रूप बनाए रखा गया है।
  alternative: एप्रैम को केवल व्यक्तिगत गोत्र-पितामह मानना, या प्रश्नों को सीधे सकारात्मक कथनों में बदल देना।
  rationale: निकटवर्ती प्रसंग सामूहिक एप्रैम की ओर संकेत करता है। हिब्रू प्रश्न न्याय और स्थायी वात्सल्य के बीच तनाव रखता है, इसलिए उसे कथन बनाकर नहीं सुलझाया गया।
- issue: דברי בו में न्याय का निहितार्थ
  choice: मुख्य पाठ में ‘उसके विषय में बोलता हूँ’।
  alternative: ‘उसके विरुद्ध बोलता हूँ’।
  rationale: ב प्रायः ‘के विषय में’ हो सकता है, जबकि प्रसंग न्यायपूर्ण वाणी का संकेत दे सकता है। वास्तविक अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; आत्मीय किंतु गरिमापूर्ण नबूवतीय शैली। ‘प्यारा’, ‘दुलारा’ और ‘अंतरतम उमड़ता है’ सामान्य पाठक के लिए सहज हैं, जबकि प्रश्नात्मक संरचना, बलाघात और मूल रूपक सुरक्षित रखे गए हैं।
