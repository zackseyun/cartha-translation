source:
  edition: WLC
  text: אָמַ֣ר יְהוָ֔ה אִם לֹ֥א שרות/ך לְ/ט֑וֹב אִם ל֣וֹא הִפְגַּ֣עְתִּֽי בְ/ךָ֗ בְּ/עֵ֥ת רָעָ֛ה וּ/בְ/עֵ֥ת צָרָ֖ה אֶת הָ/אֹיֵֽב־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/011.yaml
  text: Yahweh said[a], “Surely I have set you free for good[b]; surely I have made the enemy plead with you in a time of disaster and in a time of distress.”
translation:
  language: hi
  text: याहवे ने कहा, “निश्चय ही मैंने तुम्हें तुम्हारी भलाई के लिए मुक्त किया है[a]; निश्चय ही विपत्ति के समय और संकट के समय मैंने शत्रु को तुमसे विनती करने पर विवश किया है[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'पहले खंड का इब्रानी पाठ अनिश्चित है। इसका अनुवाद यह भी हो सकता है: “निश्चय ही मैंने तुम्हें भलाई के लिए छुड़ाया है,” अथवा रूप को अलग ढंग से समझने पर: “निश्चय ही मैंने बचे हुओं को भलाई के लिए दृढ़ किया है।”'
    reason: textual_variant
  - marker: b
    text: या, “निश्चय ही विपत्ति के समय और संकट के समय मैंने शत्रु के सामने तुम्हारे लिए विनती की है।”
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: वाचा के परमेश्वर के विशिष्ट नाम को उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में सुरक्षित रखा गया है।
- source_word: אִם לֹא ... אִם ל֣וֹא
  choice: निश्चय ही ... निश्चय ही
  rationale: यहाँ यह पदबंध शर्त नहीं, बल्कि प्रबल आश्वासन व्यक्त करता है; दोहराव को भी सुरक्षित रखा गया है।
- source_word: שרותך
  choice: मैंने तुम्हें ... मुक्त किया है
  rationale: इब्रानी रूप अत्यंत कठिन और अनिश्चित है। प्रसंग में यिर्मयाह के हित के लिए छुटकारे या संरक्षण का अर्थ संभव है; अन्य प्रमुख समझ को पादटिप्पणी में रखा गया है।
- source_word: לְטוֹב
  choice: तुम्हारी भलाई के लिए
  rationale: लाभकारी उद्देश्य या परिणाम को सहज आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: הִפְגַּעְתִּי בְךָ ... אֶת הָאֹיֵב
  choice: मैंने शत्रु को तुम्हारे सामने विनती करने पर विवश किया है
  rationale: हिफ़ईल रूप को कारणवाचक मानते हुए शत्रु को यिर्मयाह से विनती कराने का अर्थ लिया गया है; क्रिया की वैकल्पिक समझ पादटिप्पणी में दी गई है।
- source_word: בְּעֵת רָעָה
  choice: विपत्ति के समय
  rationale: רָעָה यहाँ नैतिक बुराई नहीं, प्रतिकूल आपदा को सूचित करता है।
- source_word: וּבְעֵת צָרָה
  choice: और संकट के समय
  rationale: צָרָה के कष्ट और तंगी के भाव को व्यक्त करते हुए समानांतर संरचना बनाए रखता है।
theological_decisions:
- issue: यिर्मयाह को दिए गए कठिन और पाठगत रूप से विवादित आश्वासन की व्याख्या
  choice: परमेश्वर यिर्मयाह को उसकी भलाई के लिए मुक्त करने और विपत्ति में शत्रु से उसके सामने विनती कराने का आश्वासन देते हैं।
  alternative: पहले खंड का अर्थ ‘मैंने बचे हुओं को भलाई के लिए दृढ़ किया है’ हो सकता है; दूसरे खंड का अर्थ यह भी हो सकता है कि परमेश्वर ने शत्रु के सामने यिर्मयाह के लिए विनती की।
  rationale: चुना हुआ पाठ निकटवर्ती प्रसंग में यिर्मयाह की रक्षा और विरोधियों के सामने उसकी प्रतिष्ठा से मेल खाता है, पर इब्रानी की वास्तविक अनिश्चितता को पादटिप्पणियों में खुला रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और प्रत्यक्ष शैली अपनाई गई है। ‘याहवे’ के द्वारा विशिष्ट ईश्वरीय नाम सुरक्षित है। कठिन इब्रानी को मुख्य पाठ में संभावित अर्थ के साथ पठनीय बनाया गया है, जबकि वास्तविक पाठगत और अर्थगत अनिश्चितता पादटिप्पणियों में स्पष्ट रूप से रखी गई है।
