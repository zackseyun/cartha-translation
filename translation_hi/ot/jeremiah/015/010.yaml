source:
  edition: WLC
  text: אֽוֹי לִ֣/י אִמִּ֔/י כִּ֣י יְלִדְתִּ֗/נִי אִ֥ישׁ רִ֛יב וְ/אִ֥ישׁ מָד֖וֹן לְ/כָל הָ/אָ֑רֶץ לֹֽא נָשִׁ֥יתִי וְ/לֹא נָֽשׁוּ בִ֖/י כֻּלֹּ֥/ה מְקַלְלַֽו/נִי־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/010.yaml
  text: Woe to me[a], my mother, because you bore me, a man of strife and a man of contention to all the land. I have not lent, nor have they lent to me[b], yet every one of them curses me.
translation:
  language: hi
  text: हाय मुझ पर, हे मेरी माँ! तूने मुझे जन्म दिया—देश भर के लिए झगड़े और विवाद का मनुष्य।[a] न मैंने किसी को उधार दिया, न किसी ने मुझे उधार दिया,[b] फिर भी हर कोई मुझे शाप देता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सारी पृथ्वी के लिए।”
    reason: alternative_reading
  - marker: b
    text: हिब्रू में सम्भवतः ऋण देने और ऋण लेने की बात है। यिर्मयाह कहता है कि ऋण के लेन-देन जैसा वैमनस्य का कोई सामान्य सामाजिक कारण भी नहीं है।
    reason: cultural_note
lexical_decisions:
- source_word: אֽוֹי לִי
  choice: हाय मुझ पर
  rationale: यह तीव्र विलाप और संकट की पुकार है; हिन्दी में ‘हाय मुझ पर’ मूल की भावात्मक शक्ति और वक्ता पर आए दुःख दोनों को व्यक्त करता है।
- source_word: אִמִּי
  choice: मेरी माँ
  rationale: प्रत्यक्ष सम्बोधन को बनाए रखने से यिर्मयाह के विलाप की निजी और भावनात्मक तीव्रता सुरक्षित रहती है।
- source_word: כִּי יְלִדְתִּנִי
  choice: क्योंकि तूने मुझे जन्म दिया
  rationale: כִּי का कारणवाचक अर्थ प्रसंग में स्वाभाविक है; ‘जन्म दिया’ आधुनिक हिन्दी में स्पष्ट और मूल क्रिया ילד के निकट है।
- source_word: אִישׁ רִיב וְאִישׁ מָדוֹן
  choice: ऐसा मनुष्य जो ... झगड़े और विवाद का कारण है
  rationale: दो समानार्थी संज्ञाओं की गहनता को ‘झगड़े और विवाद’ से रखा गया है। सम्बन्धसूचक रूप हिन्दी में अधिक स्वाभाविक है और इसका अर्थ यह नहीं ठहराता कि यिर्मयाह स्वभाव से झगड़ालू था।
- source_word: לְכָל הָאָרֶץ
  choice: सारे देश के लिए
  rationale: यिर्मयाह के प्रसंग में הָאָרֶץ सम्भवतः यहूदा देश को सूचित करता है; ‘देश’ अनावश्यक वैश्विक अर्थ से बचता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: לֹא נָשִׁיתִי וְלֹא נָשׁוּ בִי
  choice: न मैंने किसी को उधार दिया, न किसी ने मुझे उधार दिया
  rationale: दोनों समानान्तर खंड ऋण देने और लेने के सम्बन्ध को व्यक्त करते हैं। हिन्दी में कर्मों को स्पष्ट करने के लिए ‘किसी को’ और ‘मुझे’ जोड़े गए हैं।
- source_word: כֻּלֹּה מְקַלְלַוּנִי
  choice: फिर भी वे सब मुझे शाप देते हैं
  rationale: भागवाचक रूप निरन्तर या सामान्य व्यवहार बताता है; ‘वे सब’ विरोध की व्यापकता और ‘शाप देते हैं’ मूल की प्रबलता व्यक्त करता है।
theological_decisions:
- issue: הָאָרֶץ का भौगोलिक विस्तार
  choice: देश
  alternative: पृथ्वी
  rationale: निकटवर्ती भविष्यद्वाणी के प्रसंग में यहूदा देश अधिक सम्भावित है, पर हिब्रू शब्द व्यापक अर्थ भी रख सकता है; इसलिए वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- issue: यिर्मयाह को ‘झगड़े और विवाद का मनुष्य’ कहने का आशय
  choice: झगड़े और विवाद का कारण
  alternative: झगड़ालू और विवादप्रिय मनुष्य
  rationale: मूल वाक्यांश यह खुला छोड़ता है कि संघर्ष उसके चरित्र के कारण है या उसके संदेश के प्रत्युत्तर में उत्पन्न होता है। चुना हुआ रूप उसे स्वभावतः कलहप्रिय ठहराए बिना उसके चारों ओर के संघर्ष को व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण पर सहज शैली रखी गई है। माँ को सम्बोधन में ‘तूने’ निकट और विलापपूर्ण स्वर देता है; शेष पद में स्पष्ट, साधारण शब्दावली प्रयुक्त है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
