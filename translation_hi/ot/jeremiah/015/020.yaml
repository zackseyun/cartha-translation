id: JER.15.20
reference: Jeremiah 15:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/נְתַתִּ֜י/ךָ לָ/עָ֣ם הַ/זֶּ֗ה לְ/חוֹמַ֤ת נְחֹ֨שֶׁת֙ בְּצוּרָ֔ה וְ/נִלְחֲמ֥וּ אֵלֶ֖י/ךָ וְ/לֹא י֣וּכְלוּ לָ֑/ךְ כִּֽי אִתְּ/ךָ֥ אֲנִ֛י לְ/הוֹשִֽׁיעֲ/ךָ֥ וּ/לְ/הַצִּילֶ֖/ךָ נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/020.yaml
  text: And I will make you to this people a fortified wall of bronze; they will fight against you[a], but they will not prevail over you, for I am with you to save you and to deliver you, declares Yahweh.
translation:
  language: hi
  text: “मैं तुम्हें इस प्रजा के सामने काँसे की किलेबंद दीवार[a] बना दूँगा। वे तुमसे लड़ेंगे, पर तुम पर प्रबल न हो सकेंगे; क्योंकि तुम्हें बचाने और छुड़ाने के लिए मैं तुम्हारे साथ हूँ,” याहवे की यह घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “काँसे की दृढ़ दीवार।”
    reason: בְּצוּרָה का अर्थ ‘किलेबंद’ के साथ-साथ ‘दृढ़/अभेद्य’ भी व्यक्त किया जा सकता है।
lexical_decisions:
- source_word: וּנְתַתִּיךָ
  choice: मैं तुम्हें ... बना दूँगा
  rationale: נתן का मूल अर्थ ‘देना/रखना’ है, पर לְ के साथ विधेय-संज्ञा वाली इस रचना में इसका भाव किसी को किसी रूप में ठहराना या बना देना है।
- source_word: לָעָם הַזֶּה
  choice: इस प्रजा के सामने
  rationale: לְ यहाँ यिर्मयाह और प्रजा के बीच संबंध बताता है। आगे प्रजा के उससे लड़ने के कारण ‘के सामने’ आधुनिक हिन्दी में उस आमने-सामने के संबंध को स्वाभाविक रूप से व्यक्त करता है, बिना इसे केवल प्रजा के हित में होने का अर्थ दिए।
- source_word: לְחוֹמַת נְחֹשֶׁת בְּצוּרָה
  choice: काँसे की किलेबंद दीवार
  rationale: חוֹמָה ‘दीवार’, נְחֹשֶׁת ‘काँसा/ताँबा’ और בְּצוּרָה ‘किलेबंद, दुर्गम, सुदृढ़’ है। यह रूपक शक्ति और अभेद्यता दोनों बनाए रखता है।
- source_word: וְנִלְחֲמוּ אֵלֶיךָ
  choice: वे तुमसे लड़ेंगे
  rationale: לחם के साथ אֶל का अर्थ यहाँ किसी के विरुद्ध लड़ना है; ‘तुमसे लड़ेंगे’ सहज और स्पष्ट हिन्दी है।
- source_word: וְלֹא יוּכְלוּ לָךְ
  choice: पर तुम पर प्रबल न हो सकेंगे
  rationale: יכל का शाब्दिक भाव ‘सक्षम होना’ है; לְ के साथ यहाँ आशय यिर्मयाह के विरुद्ध सफल या विजयी न हो पाना है।
- source_word: כִּי אִתְּךָ אֲנִי
  choice: क्योंकि ... मैं तुम्हारे साथ हूँ
  rationale: כִּי विरोधियों की असफलता का कारण देता है; हिन्दी में ‘क्योंकि’ इस संबंध को स्पष्ट रखता है।
- source_word: לְהוֹשִׁיעֲךָ וּלְהַצִּילֶךָ
  choice: तुम्हें बचाने और छुड़ाने के लिए
  rationale: ישע और נצל निकटार्थक पर अलग क्रियाएँ हैं। ‘बचाना’ और ‘छुड़ाना’ उनकी युगल अभिव्यक्ति तथा हल्का अर्थांतर बनाए रखते हैं।
- source_word: נְאֻם יְהוָה
  choice: याहवे की यह घोषणा है
  rationale: נְאֻם भविष्यद्वाणी की अधिकारपूर्ण घोषणा का सूत्र है, और יְהוָה को उसके व्यक्तिवाचक वाचा-नाम ‘याहवे’ के रूप में रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरीय व्यक्तिवाचक नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और नाम को सामान्य उपाधि में नहीं बदलता।
- issue: रक्षा की प्रतिज्ञा और संघर्ष का बने रहना
  choice: वे लड़ेंगे, पर प्रबल न होंगे
  alternative: परमेश्वर संघर्ष को रोक देगा
  rationale: पद विरोध का अंत नहीं कहता; वह विरोधियों की अंतिम सफलता को नकारता है। अनुवाद इस तनाव को यथावत रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘काँसा’, ‘किलेबंद’, ‘प्रबल’ और ‘घोषणा’ मूल रूपक तथा भविष्यद्वाणी के गंभीर स्वर को बनाए रखते हैं।
