  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֵלַ֔/י אִם יַעֲמֹ֨ד מֹשֶׁ֤ה וּ/שְׁמוּאֵל֙ לְ/פָנַ֔/י אֵ֥ין נַפְשִׁ֖/י אֶל הָ/עָ֣ם הַ/זֶּ֑ה שַׁלַּ֥ח מֵֽ/עַל פָּנַ֖/י וְ/יֵצֵֽאוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/001.yaml
  text: Then Yahweh said to me[a], “Even if Moses and Samuel were to stand before me, my soul would not be toward this people. Send them away from before me[b], and let them go out.”
translation:
  language: hi
  text: तब याहवे ने मुझसे कहा, “यदि मूसा और शमूएल मेरे सामने खड़े भी हों, तो भी मेरा मन इस प्रजा की ओर न होगा[a]। उन्हें मेरे सामने से दूर भेज दे[b], और वे निकल जाएँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मेरा प्राण इस प्रजा की ओर न होगा”; अर्थात, “मेरा मन इस प्रजा की ओर न होगा” या “मैं इस प्रजा का पक्ष न लूँगा।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में, “मेरे सामने से”; अर्थात, “मेरी उपस्थिति से बाहर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय उसके प्रचलित हिन्दी लिप्यंतरण में रखा गया है।
- source_word: וַיֹּאמֶר ... אֵלַי
  choice: तब ... ने मुझसे कहा
  rationale: वाव-क्रमवाचक कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में क्रम को व्यक्त करता है।
- source_word: אִם יַעֲמֹד
  choice: यदि ... खड़े भी हों, तो भी
  rationale: यहाँ אִם का बल रियायती और काल्पनिक है; ‘भी ... तो भी’ उस emphatic concessive अर्थ को स्पष्ट करता है।
- source_word: יַעֲמֹד ... לְפָנַי
  choice: मेरे सामने खड़े ... हों
  rationale: मूल बिंब को बनाए रखा गया है। प्रसंग में मध्यस्थता निहित हो सकती है, पर उसे मुख्य पाठ में स्पष्ट जोड़कर अर्थ सीमित नहीं किया गया।
- source_word: מֹשֶׁה וּשְׁמוּאֵל
  choice: मूसा और शमूएल
  rationale: दोनों व्यक्तिनामों के हिन्दी बाइबलीय रूप प्रयुक्त किए गए हैं।
- source_word: אֵין נַפְשִׁי אֶל־הָעָם הַזֶּה
  choice: मेरा मन इस प्रजा की ओर न होगा
  rationale: נֶפֶשׁ यहाँ व्यक्ति की आंतरिक प्रवृत्ति या अनुराग को व्यक्त करता है। ‘मन’ आधुनिक हिन्दी में स्वाभाविक है, जबकि ‘की ओर’ मूल की दिशात्मक अभिव्यक्ति और उसके तनाव को बनाए रखता है। शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: הָעָם הַזֶּה
  choice: इस प्रजा
  rationale: एकवचन सामूहिक संज्ञा और राष्ट्रीय/वाचाई संदर्भ को ‘प्रजा’ व्यक्त करता है।
- source_word: שַׁלַּח
  choice: भेज दे
  rationale: यह यिर्मयाह को संबोधित एकवचन आज्ञार्थक है। हिन्दी में संदर्भ से स्पष्ट कर्म ‘उन्हें’ जोड़ा गया है।
- source_word: מֵעַל פָּנַי
  choice: मेरे सामने से दूर
  rationale: मूलतः ‘मेरे मुख/उपस्थिति के सामने से’; मुख्य पाठ में बिंब को पठनीय हिन्दी में रखा गया है और अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: וְיֵצֵאוּ
  choice: और वे निकल जाएँ
  rationale: आज्ञा के बाद आने वाले जुस्सिव भाव और ‘निकलने’ की मूल क्रिया को बनाए रखा गया है, बिना यह निश्चित किए कि वे कहाँ से निकलें।
theological_decisions:
- issue: याहवे के लिए נַפְשִׁי (‘मेरा प्राण/मन’) का मानव-सदृश प्रयोग
  choice: मुख्य पाठ में ‘मेरा मन इस प्रजा की ओर न होगा’ और पादटिप्पणी में अधिक शाब्दिक ‘मेरा प्राण’ रखा गया है।
  alternative: ‘मैं इस प्रजा पर कृपादृष्टि न करूँगा’ या ‘मुझे इस प्रजा पर दया नहीं आएगी।’
  rationale: चुना हुआ रूप परमेश्वर की व्यक्तिगत प्रवृत्ति का मूल बिंब बचाता है, लेकिन उससे दया या कृपा जैसे किसी एक अधिक विशिष्ट भाव को अनावश्यक रूप से निश्चित नहीं करता।
- issue: मूसा और शमूएल के याहवे के सामने खड़े होने का मध्यस्थतापरक संकेत
  choice: ‘मेरे सामने खड़े ... हों’
  alternative: ‘मेरे सामने मध्यस्थता करें’ या ‘मुझसे विनती करें।’
  rationale: दोनों व्यक्ति प्रसिद्ध मध्यस्थ हैं, किंतु इब्रानी पाठ केवल ‘खड़े हों’ कहता है। इसलिए संभावित मध्यस्थतापरक संकेत को व्याख्यात्मक विस्तार द्वारा मुख्य पाठ में निश्चित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘खड़े भी हों, तो भी’ काल्पनिक रियायत का बल व्यक्त करता है। ‘प्रजा’ सामूहिक इस्राएली समुदाय के लिए प्रयुक्त है। मुख्य पाठ में [a] को संबंधित वाक्य के अंत में रखा गया है और [b] को ‘मेरे सामने से दूर भेज दे’ के तुरंत बाद।
