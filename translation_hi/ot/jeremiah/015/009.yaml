  text: אֻמְלְלָ֞ה יֹלֶ֣דֶת הַ/שִּׁבְעָ֗ה נָפְחָ֥ה נַפְשָׁ֛/הּ באה שִׁמְשָׁ֛/הּ בְּ/עֹ֥ד יוֹמָ֖ם בּ֣וֹשָׁה וְ/חָפֵ֑רָה וּ/שְׁאֵֽרִיתָ֗/ם לַ/חֶ֧רֶב אֶתֵּ֛ן לִ/פְנֵ֥י אֹיְבֵי/הֶ֖ם נְאֻם יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/009.yaml
  text: She who bore seven has withered away[a]; she has breathed out her life. Her sun has gone down while it was still day. She is ashamed and humiliated. And the remnant of them I will give to the sword before their enemies[c][b], declares Yahweh.
translation:
  language: hi
  text: जिसने सात बच्चों को जन्म दिया था, वह मुरझा गई है[a]; उसने प्राण त्याग दिए हैं[b]। दिन रहते ही उसका सूरज डूब गया[c]। वह लज्जित और अपमानित हुई है। और उनमें से जो बचे हैं, उन्हें मैं उनके शत्रुओं के सामने तलवार के हवाले कर दूँगा—यह याहवे की घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सात बच्चों की माँ।” यह इब्रानी अभिव्यक्ति ऐसी स्त्री की छवि प्रस्तुत करती है जिसे कभी अत्यंत फलवती और धन्य माना जाता था।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक अर्थ: “उसने अपना प्राण/जीवन बाहर फूँक दिया,” अर्थात उसकी साँस के साथ जीवन निकल गया।'
    reason: lexical_alternative
  - marker: c
    text: “दिन रहते ही उसका सूरज डूब गया” असमय अंत की काव्यात्मक छवि है।
    reason: cultural_note
lexical_decisions:
- source_word: אֻמְלְלָה
  choice: मुरझा गई है
  rationale: यह क्रिया दुर्बल होकर चुक जाने या निस्तेज पड़ने का भाव देती है। ‘मुरझा गई है’ काव्यात्मक पतन की सजीव छवि बनाए रखता है।
- source_word: יֹלֶדֶת הַשִּׁבְעָה
  choice: जिसने सात को जन्म दिया था
  rationale: यह इब्रानी के ‘सात को जन्म देनेवाली’ के निकट है और सात संतानों वाली, पूर्णतः फलवती मानी जाने वाली स्त्री की छवि को बिना अनावश्यक विस्तार के रखता है।
- source_word: נָפְחָה נַפְשָׁהּ
  choice: उसने अपने प्राण छोड़ दिए हैं
  rationale: शाब्दिक चित्र प्राण या जीवन के साँस के साथ निकल जाने का है। हिंदी का यह स्वाभाविक मुहावरा मृत्यु का अर्थ स्पष्ट रखता है; पादटिप्पणी मूल चित्र बताती है।
- source_word: באה שִׁמְשָׁהּ בְּעוֹד יוֹמָם
  choice: दिन रहते ही उसका सूरज डूब गया
  rationale: सूर्यास्त के मूल रूपक और असमय अंत के संकेत—दोनों को स्वाभाविक हिंदी में सुरक्षित रखता है।
- source_word: בּוֹשָׁה וְחָפֵרָה
  choice: वह लज्जित और अपमानित हुई है
  rationale: दोनों निकटार्थी क्रियाओं में अंतःलज्जा और सार्वजनिक निरादर का संयुक्त बल है।
- source_word: וּשְׁאֵרִיתָם
  choice: उनमें से जो बचे हैं
  rationale: यह बचे हुए लोगों या उत्तरजीवियों का सामूहिक अर्थ सामान्य आधुनिक हिंदी में स्पष्ट करता है।
- source_word: לַחֶרֶב אֶתֵּן
  choice: तलवार के हवाले कर दूँगा
  rationale: यह न्याय-सूत्र का अर्थ—हिंसक मृत्यु के लिए सौंपना—स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: לִפְנֵי אֹיְבֵיהֶם
  choice: उनके शत्रुओं के सामने
  rationale: לִפְנֵי का शाब्दिक ‘सामने/उपस्थिति में’ अर्थ बनाए रखता है और केवल ‘शत्रुओं को’ कहकर संबंध को सीमित नहीं करता।
- source_word: נְאֻם יְהוָה
  choice: यह यहोवा की घोषणा है
  rationale: विशिष्ट भविष्यद्वक्ताई सूत्र को औपचारिक किंतु सुबोध हिंदी में रखता है और व्यक्तिगत दिव्य नाम को लिप्यंतरित करता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल में चतुरक्षरी व्यक्तिगत नाम सीधे आया है। ‘यहोवा’ आधुनिक हिंदी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाता है और नाम को किसी उपाधि में बदलने के बजाय नाम के रूप में रखता है; ‘याहवे’ अधिक संभावित ऐतिहासिक उच्चारण का विकल्प है।
translation_notes:
  register: आधुनिक मानक हिंदी, काव्यात्मक और गरिमापूर्ण शैली। समानांतर वाक्य-विन्यास तथा सूर्यास्त का मूल रूपक सुरक्षित रखा गया है। ‘प्राण छोड़ दिए’ सामान्य पाठक के लिए स्वाभाविक है, जबकि पादटिप्पणी इब्रानी के साँस/जीवन वाले ठोस बिंब को दर्ज करती है।
