source:
  edition: WLC
  text: כִּ֠י מִֽי יַחְמֹ֤ל עָלַ֨יִ/ךְ֙ יְר֣וּשָׁלִַ֔ם וּ/מִ֖י יָנ֣וּד לָ֑/ךְ וּ/מִ֣י יָס֔וּר לִ/שְׁאֹ֥ל לְ/שָׁלֹ֖ם לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/005.yaml
  text: For who will have compassion on you[a], Jerusalem? And who will mourn for you? And who will turn aside to ask about your welfare?
translation:
  language: hi
  text: क्योंकि, हे यरूशलेम, कौन तुझ पर दया करेगा?[a] कौन तेरे लिए शोक जताएगा? कौन तेरा कुशल-मंगल पूछने के लिए मार्ग से हटेगा?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कौन तुझ पर तरस खाएगा? कौन तेरे प्रति सहानुभूति जताएगा? कौन रुककर तेरा कुशल-मंगल पूछेगा?”
    reason: חמל, נוד और שָׁלוֹם के निकटवर्ती अर्थ-विकल्पों तथा יָסוּר में निहित मार्ग से मुड़ने के चित्रात्मक भाव को दर्शाने के लिए।
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद पिछले न्याय-वचन का कारण या स्पष्टीकरण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से बनाए रखता है।
- source_word: מִי
  choice: कौन
  rationale: प्रश्नवाचक सर्वनाम तीन बार दोहराया गया है; उसी आलंकारिक प्रभाव के लिए ‘कौन’ को लगातार रखा गया है।
- source_word: יַחְמֹל עָלַיִךְ
  choice: तुझ पर दया करेगा
  rationale: חמל यहाँ दया या करुणा दिखाने के अर्थ में है; על के साथ ‘तुझ पर दया’ स्वाभाविक हिन्दी प्रयोग है।
- source_word: יְרוּשָׁלִַם
  choice: हे यरूशलेम
  rationale: स्त्रीलिंग एकवचन संबोधन को स्पष्ट करने और अगले सर्वनामों से जोड़ने के लिए मानक हिन्दी नाम के साथ ‘हे’ रखा गया है।
- source_word: יָנוּד לָךְ
  choice: तेरे लिए शोक जताएगा
  rationale: נוד सहानुभूतिपूर्ण विलाप या शोक प्रकट करने का भाव रखता है; ‘शोक जताएगा’ उस भाव को आधुनिक हिन्दी में स्पष्ट करता है, जबकि शाब्दिक संकेत-भंगिमा अस्पष्ट हो सकती है।
- source_word: יָסוּר
  choice: राह से हटकर तेरे पास आएगा
  rationale: סור किसी व्यक्ति के अपने मार्ग से मुड़ने या हटने का चित्र देता है। हिन्दी में यह विस्तृत अभिव्यक्ति उस प्रयोजनपूर्ण मुड़ने को स्वाभाविक बनाती है।
- source_word: לִשְׁאֹל לְשָׁלֹם לָךְ
  choice: तेरा हाल-चाल पूछने के लिए
  rationale: किसी के शालोम के विषय में पूछना उसके कुशल-मंगल या हाल-चाल की पूछताछ का मुहावरा है; ‘हाल-चाल पूछना’ साधारण आधुनिक हिन्दी में सहज है।
theological_decisions: []
