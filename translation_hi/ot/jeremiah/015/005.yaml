  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। यरूशलेम को स्त्रीलिंग एकवचन में संबोधित करते हुए ‘तू’ के रूपों का प्रयोग मूल की सीधी और तीखी संबोधन-शैली बनाए रखता है। तीनों आलंकारिक प्रश्न अलग रखे गए हैं।
