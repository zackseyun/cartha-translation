base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/007.yaml
  text: I winnowed them with a winnowing fork at the gates of the land[a]; I bereaved, I destroyed my people[b]; they did not turn back from their ways.
translation:
  language: hi
  text: मैंने उन्हें देश के फाटकों पर फटकने के सूप से फटका[a]; मैंने उन्हें संतानहीन किया, अपनी प्रजा का नाश किया; वे अपने मार्गों से नहीं फिरे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पृथ्वी के फाटकों पर।’ हिब्रू शब्द का अर्थ ‘देश’ या ‘पृथ्वी’ दोनों हो सकता है; यहाँ यहूदा पर न्याय के निकट संदर्भ में ‘देश’ अधिक उपयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: या ‘वे अपने मार्गों से नहीं लौटे।’ हिब्रू में ‘लौटना/फिरना’ है, जो भविष्यद्वक्ताओं के प्रसंगों में पश्चात्ताप का भाव भी रख सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶזְרֵם
  choice: मैंने उन्हें ... फटका
  rationale: זרה के अनाज फटकने वाले कृषि-बिंब को बनाए रखता है; केवल ‘बिखेरा’ कहना ठोस बिंब को खो देता।
- source_word: בְּמִזְרֶה
  choice: फटकने के सूप से
  rationale: מִזְרֶה अनाज फटकने का उपकरण है। ‘सूप’ आधुनिक हिन्दी में पहचाना जाने वाला पारंपरिक उपकरण है, और ‘फटकने का’ उसके अर्थ को स्पष्ट करता है।
- source_word: בְּשַׁעֲרֵי הָאָרֶץ
  choice: देश के फाटकों पर
  rationale: הָאָרֶץ का अर्थ ‘देश’ या ‘पृथ्वी’ हो सकता है; यहूदा पर न्याय के निकट संदर्भ में ‘देश’ अधिक उपयुक्त है, जबकि विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: שִׁכַּלְתִּי
  choice: मैंने उन्हें संतानहीन किया
  rationale: क्रिया किसी को संतान से वंचित करने या शोकग्रस्त करने का भाव रखती है। ‘संतानहीन किया’ उसकी कठोरता और कारणात्मक अर्थ को सीधे व्यक्त करता है।
- source_word: אִבַּדְתִּי אֶת־עַמִּי
  choice: अपनी प्रजा का नाश किया
  rationale: אבד के कारणात्मक विनाशकारी अर्थ और עַמִּי के वाचा-संबंधी ‘मेरी प्रजा’ भाव को स्वाभाविक हिन्दी में रखता है।
- source_word: מִדַּרְכֵיהֶם
  choice: अपने मार्गों से
  rationale: ‘मार्ग’ जीवन-चाल या आचरण के हिब्रू रूपक को बिना सपाट व्याख्या में बदले बनाए रखता है।
- source_word: לֹא שָׁבוּ
  choice: नहीं फिरे
  rationale: שׁוּב के लौटने/मुड़ने के मूल बिंब को सुरक्षित रखता है और पश्चात्ताप के निहितार्थ को स्पष्ट doctrinal शब्द में सीमित नहीं करता।
theological_decisions:
- issue: שׁוּב को स्पष्ट रूप से पश्चात्ताप कहना या मुड़ने का व्यापक बिंब बनाए रखना
  choice: वे अपने मार्गों से नहीं फिरे
  alternative: उन्होंने अपने मार्गों से पश्चात्ताप नहीं किया
  rationale: हिब्रू क्रिया भविष्यद्वक्ताओं में पश्चात्ताप का भाव धारण कर सकती है, पर उसका शाब्दिक और व्यापक अर्थ लौटना/फिरना है। मुख्य पाठ में वही तनाव रखा गया है और स्पष्ट अर्थ-विकल्प पादटिप्पणी में दिया गया है।
- issue: הָאָרֶץ का भौगोलिक विस्तार
  choice: देश
  alternative: पृथ्वी
  rationale: तत्काल संदर्भ यहूदा और उसकी प्रजा पर न्याय का है, इसलिए ‘देश’ मुख्य पाठ में अधिक संभावित है; मूल की वास्तविक बहुअर्थकता पादटिप्पणी में रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘फटकने के सूप’ से कृषि-बिंब ठोस रहता है; ‘मार्गों से नहीं फिरे’ मूल की नैतिक और धार्मिक अर्थ-व्याप्ति को खुला रखता है। अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्नों का क्रम विषयों से मेल नहीं खाता था; हिन्दी मसौदे में देश/पृथ्वी वाला चिह्न [a] और फिरने/पश्चात्ताप वाला चिह्न [b] संबंधित पदों पर सही लगाया गया है।
