  text: 'And I will appoint over them four kinds[a], declares Yahweh: the sword to kill, the dogs to drag away[b], and the birds of the heavens and the beasts of the earth to devour and destroy.'
translation:
  language: hi
  text: “मैं उनके विरुद्ध चार प्रकार के साधन[a] नियुक्त करूँगा”—यह याहवे की घोषणा है—“मार डालने के लिए तलवार को, घसीट ले जाने के लिए कुत्तों को, और खा जाने तथा नष्ट कर देने के लिए आकाश के पक्षियों और धरती के पशुओं को।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “चार परिवार” या “चार कुल”; यहाँ यह शब्द न्याय के चार प्रकार के साधनों के लिए रूपक के रूप में प्रयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָקַדְתִּי עֲלֵיהֶם
  choice: मैं उन पर ... नियुक्त करूँगा
  rationale: פקד के साथ עַל यहाँ विपत्ति लाने वाले साधनों को किसी के ऊपर नियुक्त करने या तैनात करने का भाव देता है। ‘नियुक्त करूँगा’ इस शासकीय भाव को बनाए रखता है, जबकि आगे की सूची उसके दंडात्मक आशय को स्पष्ट करती है।
- source_word: אַרְבַּע מִשְׁפָּחוֹת
  choice: चार प्रकार के विनाशक
  rationale: מִשְׁפָּחוֹת का सामान्य अर्थ ‘परिवार/कुल’ है, पर यहाँ तलवार, कुत्तों, पक्षियों और पशुओं—न्याय के चार प्रकार के साधनों—के लिए रूपक रूप में प्रयुक्त है। स्वाभाविक हिन्दी के लिए ‘चार प्रकार’ और संदर्भ से स्पष्ट किया गया ‘विनाशक’ चुना गया है; शाब्दिक रूप पादटिप्पणी में रखा गया है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: यह गंभीर भविष्यद्वक्तात्मक सूत्र है। ‘घोषणा’ उसकी औपचारिकता बनाए रखता है और יהוה को उसके व्यक्तिगत नाम ‘याहवे’ से प्रस्तुत करता है।
- source_word: אֶת הַחֶרֶב לַהֲרֹג
  choice: मार डालने के लिए तलवार को
  rationale: उद्देश्यसूचक infinitive को स्पष्ट और समानांतर हिन्दी रचना में रखा गया है।
- source_word: וְאֶת הַכְּלָבִים לִסְחֹב
  choice: घसीट ले जाने के लिए कुत्तों को
  rationale: סחב का मूल भाव खींचने या घसीटकर ले जाने का है। पाठ कर्म—संभवतः शवों—को स्पष्ट नहीं करता, इसलिए हिन्दी में भी उसे नहीं जोड़ा गया है।
- source_word: ע֧וֹף הַשָּׁמַיִם
  choice: आकाश के पक्षियों
  rationale: बहुवचन שׁמים के लिए ‘आकाश’ आधुनिक हिन्दी में स्वाभाविक सामूहिक अभिव्यक्ति है और न्याय के प्रसंग में शवभक्षी पक्षियों की ओर संकेत को बिना अनावश्यक विशिष्टता के बनाए रखती है।
- source_word: בֶּהֱמַת הָאָרֶץ
  choice: धरती के पशुओं
  rationale: यह पद व्यापक है; ‘पशु’ मूल की व्यापकता को बनाए रखता है और ‘जंगली’ जैसा अनुल्लिखित विशेषण नहीं जोड़ता।
- source_word: לֶאֱכֹל וּלְהַשְׁחִית
  choice: खा जाने तथा नष्ट कर देने के लिए
  rationale: दोनों उद्देश्यसूचक क्रियाओं को स्पष्ट रूप से सुरक्षित रखा गया है। ‘खा जाना’ इस संदर्भ में भक्षण की तीव्रता व्यक्त करता है और ‘नष्ट कर देना’ השחית के परिणामकारी बल को दर्शाता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम יהוה है। उसे किसी उपाधि से बदलने के बजाय ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- issue: चार מִשְׁפָּחוֹת की पहचान
  choice: न्याय के चार प्रकार के विनाशक
  alternative: चार परिवार / चार कुल
  rationale: तलवार, कुत्ते, पक्षी और पशु शाब्दिक वंश-समूह नहीं हैं। फिर भी मूल रूपक को पूरी तरह छिपाया नहीं गया; उसका शाब्दिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गंभीर और भविष्यद्वक्तात्मक रखी गई है। वाक्य में दोहरे डैश से नְאֻם־יְהוָה की बीच में आई घोषणा को स्पष्ट किया गया है। सूची के प्रत्येक पद के साथ ‘को’ लगाकर हिन्दी व्याकरण स्वाभाविक रखा गया है, और अंतिम दो infinitives—खा जाना तथा नष्ट कर देना—दोनों सुरक्षित हैं।
