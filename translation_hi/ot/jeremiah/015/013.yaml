base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/013.yaml
  text: Your wealth and your treasures I will give as plunder[a], without price, because of all your sins[b], throughout all your territory.
translation:
  language: hi
  text: तेरी धन-संपत्ति और तेरे खज़ाने मैं लूट के लिए दे दूँगा—बिना किसी कीमत के[a]—तेरे सब पापों के कारण, तेरे पूरे प्रदेश में[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “किसी कीमत पर नहीं”—अर्थात् इसके बदले कोई भुगतान या मुआवज़ा नहीं मिलेगा।
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में अधिक शाब्दिक रूप से, “तेरे सब पापों में/साथ और तेरी सब सीमाओं में”; यहाँ प्रसंग के अनुसार पहले पद को कारणसूचक और दूसरे को पूरे क्षेत्र के विस्तार के रूप में व्यक्त किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵילְךָ
  choice: तेरी धन-संपत्ति
  rationale: חַיִל/חֵיל का अर्थ सामर्थ्य, सेना या धन-संसाधन हो सकता है। ‘खज़ाने’ के समानांतर और लूट के प्रसंग में आर्थिक अर्थ सबसे उपयुक्त है।
- source_word: וְאוֹצְרוֹתֶיךָ
  choice: और तेरे खज़ाने
  rationale: यह शब्द संचित बहुमूल्य वस्तुओं अथवा कोषों को दर्शाता है; ‘खज़ाने’ सहज और प्रसंगानुकूल है।
- source_word: לָבַז
  choice: लूट का माल होने के लिए
  rationale: נתן के साथ यह पद किसी वस्तु को लूट के रूप में सौंप देने का अर्थ देता है। हिंदी में यह अभिव्यक्ति अर्थ को स्पष्ट रखती है।
- source_word: אֶתֵּן
  choice: मैं ... दे दूँगा
  rationale: נתן का प्रथम पुरुष एकवचन अपूर्ण रूप यहाँ भविष्यसूचक घोषणा है; ‘दे दूँगा’ सौंप दिए जाने की पूर्णता और स्वाभाविक हिंदी दोनों व्यक्त करता है।
- source_word: לֹא בִמְחִיר
  choice: बिना किसी कीमत के
  rationale: शाब्दिक अर्थ ‘कीमत पर नहीं’ है। आशय है कि इसके बदले कोई भुगतान या मुआवज़ा नहीं मिलेगा।
- source_word: וּבְכָל חַטֹּאותֶיךָ
  choice: तेरे सब पापों के कारण
  rationale: न्याय के इस प्रसंग में ב का कारणसूचक अर्थ स्वाभाविक है, यद्यपि उसका अधिक शाब्दिक रूप ‘तेरे सब पापों में/साथ’ हो सकता है।
- source_word: וּבְכָל גְּבוּלֶיךָ
  choice: तेरे पूरे प्रदेश में
  rationale: גְּבוּל सीमा, सीमाक्षेत्र या प्रदेश को सूचित कर सकता है। यहाँ पूरे भूभाग में न्याय के विस्तार का अर्थ उपयुक्त है।
theological_decisions:
- issue: न्याय-वचन की अंतिम पूर्वसर्गीय पदावलियों का कारणसूचक और क्षेत्रसूचक संबंध
  choice: धन की हानि को सब पापों के कारण होने वाला और पूरे प्रदेश में घटित होने वाला न्याय बताया गया है।
  alternative: इसे अधिक शाब्दिक रूप से ‘तेरे सब पापों में/साथ और तेरी सब सीमाओं में’ कहा जा सकता है।
  rationale: व्यापक प्रसंग यहूदा पर परमेश्वर के न्याय का है। कारण और क्षेत्र को स्पष्ट करना प्रसंगगत अर्थ को स्वाभाविक हिंदी में व्यक्त करता है, पर पादटिप्पणी में हिब्रू की संरचनात्मक अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिंदी; एकवचन संबोधन के लिए मूल के अनुरूप ‘तेरी/तेरे’ रखा गया है। भाषा सहज किंतु गरिमापूर्ण है। ‘धन-संपत्ति’ חֵיל के आर्थिक अर्थ को और ‘खज़ाने’ समानांतर पद को स्पष्ट करता है।
