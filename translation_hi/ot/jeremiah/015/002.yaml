  text: וְ/הָיָ֛ה כִּֽי יֹאמְר֥וּ אֵלֶ֖י/ךָ אָ֣נָה נֵצֵ֑א וְ/אָמַרְתָּ֨ אֲלֵי/הֶ֜ם כֹּֽה אָמַ֣ר יְהוָ֗ה אֲשֶׁ֨ר לַ/מָּ֤וֶת לַ/מָּ֨וֶת֙ וַ/אֲשֶׁ֤ר לַ/חֶ֨רֶב֙ לַ/חֶ֔רֶב וַ/אֲשֶׁ֤ר לָֽ/רָעָב֙ לָֽ/רָעָ֔ב וַ/אֲשֶׁ֥ר לַ/שְּׁבִ֖י לַ/שֶּֽׁבִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/002.yaml
  text: 'And it shall be[a], when they say to you, ‘Where shall we go?’ then you shall say to them, ‘Thus says Yahweh: Those for death, to death; and those for the sword, to the sword; and those for famine, to famine; and those for captivity[b], to captivity.’'
translation:
  language: hi
  text: 'और ऐसा होगा कि जब वे तुमसे कहें, “हम कहाँ जाएँ?” तब तुम उनसे कहना, “याहवे यह कहता है: जो मृत्यु के लिए हैं, वे मृत्यु के लिए; जो तलवार के लिए हैं, वे तलवार के लिए; जो अकाल के लिए हैं, वे अकाल के लिए; और जो बँधुआई[a] के लिए हैं, वे बँधुआई के लिए।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “निर्वासन।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: और जब
  rationale: यह संयोजन आने वाली अपेक्षित परिस्थिति प्रस्तुत करता है। आधुनिक हिन्दी में ‘और जब’ स्वाभाविक है और इसे अनिश्चित शर्त नहीं बनाता।
- source_word: אָנָה נֵצֵא
  choice: हम कहाँ जाएँ?
  rationale: שָׁם नहीं बल्कि गन्तव्य पूछने वाला אָנָה है; יצא का मूल भाव ‘निकलना’ है, पर इस प्रसंग में ‘हम कहाँ जाएँ?’ अधिक स्वाभाविक हिन्दी है और प्रश्न का आशय सुरक्षित रखता है।
- source_word: כֹּה אָמַר יְהוָה
  choice: याहवे ऐसा कहता है
  rationale: यह भविष्यद्वक्ता का मानक सन्देश-सूत्र है। ‘ऐसा कहता है’ गरिमापूर्ण और वर्तमान हिन्दी में स्पष्ट है; יְהוָה को व्यक्तिगत नाम ‘याहवे’ के रूप में रखा गया है।
- source_word: אֲשֶׁר לַמָּוֶת לַמָּוֶת
  choice: जो मृत्यु के लिए है, वह मृत्यु को
  rationale: मूल की संक्षिप्त, दोहरावपूर्ण और कठोर न्याय-सूची को बनाए रखता है; ‘ठहराया गया’ जैसी व्याख्यात्मक सामग्री नहीं जोड़ता।
- source_word: חֶרֶב
  choice: तलवार
  rationale: युद्ध अथवा हिंसक मृत्यु के मूर्त प्रतीक को अमूर्त ‘युद्ध’ में बदलने के बजाय मूल संज्ञा सुरक्षित रखी गई है।
- source_word: רָעָב
  choice: अकाल
  rationale: यह केवल व्यक्तिगत भूख नहीं, व्यापक अकाल को सूचित करता है और यिर्मयाह के न्याय-सन्दर्भ के अनुकूल है।
- source_word: שְׁבִי / שֶּׁבִי
  choice: बँधुआई
  rationale: यह बन्दी बनाकर ले जाए जाने की दशा या नियति व्यक्त करता है और समानान्तर वाक्य-विन्यास को बनाए रखता है; प्रसंग में ‘निर्वासन’ भी सम्भव है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है; उसे उपाधि से बदलने के बजाय हिन्दी लिप्यन्तरण में रखा गया है।
- issue: न्याय की पुनरुक्त और अनिर्दिष्ट श्रेणियाँ
  choice: जो मृत्यु के लिए है, वह मृत्यु को; जो तलवार के लिए है, वह तलवार को...
  alternative: जो मृत्यु के लिए ठहराया गया है, वह मृत्यु की ओर जाए...
  rationale: मूल पाठ यह स्पष्ट नहीं करता कि इन श्रेणियों में किसे किस प्रकार नियुक्त किया गया है। इसलिए ‘ठहराया गया’ या ‘जाए’ जोड़कर अस्पष्टता और कठोर संक्षिप्तता को नहीं सुलझाया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक रूप से सुबोध रखी गई है। न्याय-सूची में जानबूझकर मूल की असामान्य संक्षिप्तता और पुनरावृत्ति बचाई गई है। मुख्य पाठ का [a] चिह्न ‘बँधुआई’ के बाद रखा गया है।
