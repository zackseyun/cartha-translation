theological_decisions:
- issue: यिर्मयाह के ‘लौटने’ और पुनःस्थापित किए जाने का अर्थ
  choice: पाठ यिर्मयाह को लौटने के लिए बुलाता है और याहवे उसके संबंध तथा भविष्यद्वक्ता की सेवा को पुनःस्थापित करने की प्रतिज्ञा करते हैं।
  alternative: इसे मुख्यतः यिर्मयाह का पश्चाताप या केवल उसकी भविष्यद्वक्ता की सेवकाई का नवीनीकरण समझा जा सकता है।
  rationale: שׁוב की पुनरावृत्ति, याहवे के सामने खड़े होने और उनके मुख के समान होने की भाषा पश्चाताप और पुनर्नियुक्ति—दोनों की संभावना रखती है। अनुवाद इनमें से किसी एक को निर्णायक नहीं बनाता।
- issue: ‘निकम्मे में से अनमोल को निकालने’ का आशय
  choice: मुख्य पाठ मूल्यवान और मूल्यहीन को अलग करने का रूपक बनाए रखता है; संदर्भ के अनुसार यह संभवतः यिर्मयाह की वाणी से संबंधित है।
  alternative: इसे सीधे ‘यदि तुम निकम्मी बातों के बजाय योग्य बातें कहो’ या लोगों में धर्मी और अधर्मी को अलग करने के रूप में व्यक्त किया जा सकता है।
  rationale: अगला वाक्य ‘मेरे मुख के समान’ वाणी-संबंधी अर्थ का समर्थन करता है, फिर भी इब्रानी बिंब उससे व्यापक है; इसलिए व्याख्या पादटिप्पणी में रखी गई है।
- issue: ‘मेरे मुख के समान’ का अर्थ
  choice: परमेश्वर की ओर से अधिकारपूर्वक बोलने का रूपक मुख्य पाठ में सुरक्षित रखा गया है।
  alternative: ‘तुम मेरे प्रवक्ता होगे।’
  rationale: स्पष्ट विकल्प अर्थ को ठीक तरह बताता है, पर मूल की सजीव और कुछ हद तक खुली हुई भाषा को समतल कर देता है।
