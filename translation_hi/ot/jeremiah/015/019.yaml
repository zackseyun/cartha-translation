  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और भविष्यद्वाणी के काव्यात्मक स्वर के अनुरूप रखी गई है। ‘याहवे’ को व्यक्तिगत दिव्य नाम के रूप में रखा गया है। ‘लौटना/फिरना,’ ‘सामने खड़े होना,’ ‘निकम्मे में से अनमोल निकालना’ और ‘मुख के समान होना’ जैसे मूल इब्रानी बिंब यथासंभव सुरक्षित हैं; जहाँ उनका आशय सामान्य पाठक के लिए अस्पष्ट हो सकता है, वहाँ संक्षिप्त पादटिप्पणियाँ दी गई हैं।
