base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/019.yaml
  text: 'Therefore[a], this is what Yahweh says: If you return, I will restore you, and you will stand before me. If you bring out the precious from the worthless, you will be as my mouth. They will turn to you[c][b], but you must not turn to them.'
translation:
  language: hi
  text: 'इसलिए[a] याहवे यह कहते हैं:


    “यदि तुम लौट आओ, तो मैं तुम्हें पुनःस्थापित करूँगा,


    और तुम मेरे सामने खड़े रहोगे।


    यदि तुम मूल्यहीन में से अनमोल को निकालो[b],


    तो तुम मेरे मुख के समान बनोगे[c]।


    वे तुम्हारी ओर लौटेंगे,


    पर तुम उनकी ओर मत फिरना।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यदि तुम मन फिराओ, तो मैं तुम्हें फिर लौटा लाऊँगा।” इब्रानी में यिर्मयाह के लौटने और याहवे द्वारा उसे फिर स्थापित करने—दोनों के लिए एक ही मूल क्रिया का प्रयोग हुआ है।
    reason: lexical_alternative
  - marker: b
    text: “मूल्यहीन में से अनमोल को निकालना” संभवतः मूल्यहीन बातों से योग्य बातों को अलग करके बोलने की ओर संकेत करता है; इसकी तुलना अगले वाक्य, “तुम मेरे मुख के समान बनोगे,” से करें।
    reason: lexical_alternative
  - marker: c
    text: अर्थात्, “तुम मेरे प्रवक्ता बनोगे।” शाब्दिक रूप से, “तुम मेरे मुख के समान बनोगे।”
    reason: lexical_alternative
