  edition: WLC
  text: וְ/הַֽעֲבַרְתִּי֙ אֶת אֹ֣יְבֶ֔י/ךָ בְּ/אֶ֖רֶץ לֹ֣א יָדָ֑עְתָּ כִּֽי אֵ֛שׁ קָדְחָ֥ה בְ/אַפִּ֖/י עֲלֵי/כֶ֥ם תּוּקָֽד־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/014.yaml
  text: And I will make your enemies pass into a land you have not known[a], for a fire has been kindled in my anger; it will burn against you.
translation:
  language: hi
  text: और मैं तेरे शत्रुओं को ऐसे देश में पहुँचा दूँगा, जिसे तू नहीं जानता[a], क्योंकि मेरे क्रोध में आग भड़क उठी है; वह तुम सबके विरुद्ध जलेगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, कुछ प्राचीन संस्करणों और यिर्मयाह 17:4 के समानांतर पाठ के अनुसार, “और मैं तुझसे ऐसे देश में, जिसे तू नहीं जानता, तेरे शत्रुओं की सेवा करवाऊँगा।” यहाँ इब्रानी व्यंजन-पाठ में “तेरे शत्रु” लिखा है, पर वैकल्पिक पाठ किसी भिन्न स्वरांकन या भिन्न मूल-पाठ पर आधारित हो सकता है।
    reason: textual_variant
lexical_decisions:
- source_word: וְהַעֲבַרְתִּי
  choice: मैं ... पहुँचा दूँगा
  rationale: עבר के हिफ़ील रूप का कारक भाव सुरक्षित रखते हुए यह स्वाभाविक हिन्दी में ‘पार कराना/किसी स्थान तक ले जाना’ व्यक्त करता है। संदर्भ में गंतव्य देश है, इसलिए ‘पहुँचा दूँगा’ स्पष्ट और सहज है।
- source_word: אֶת אֹיְבֶיךָ
  choice: तेरे शत्रुओं को
  rationale: प्रत्यक्ष कर्मचिह्न के साथ बहुवचन संज्ञा और द्वितीय पुरुष एकवचन प्रत्यय का सीधा अनुवाद है।
- source_word: בְּאֶרֶץ לֹא יָדָעְתָּ
  choice: ऐसे देश में, जिसे तू नहीं जानता
  rationale: गति-सूचक क्रिया के साथ ב गंतव्य ‘में’ का अर्थ देता है। हिन्दी में वर्तमान ‘नहीं जानता’ किसी देश से अपरिचित होने का स्वाभाविक कथन है और इब्रानी पूर्ण रूप के अनुभवात्मक आशय को व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह आनेवाले न्याय का कारण प्रस्तुत करता है।
- source_word: אֵשׁ קָדְחָה בְאַפִּי
  choice: मेरे क्रोध में आग भड़क उठी है
  rationale: आग के मूल बिंब, क्रोध के मुहावरेदार अर्थ और पूर्ण क्रिया से सूचित आरम्भ हो चुकी अवस्था—तीनों को बनाए रखता है।
- source_word: עֲלֵיכֶם תּוּקָד
  choice: वह तुम सबके विरुद्ध जलती रहेगी
  rationale: ‘तुम सबके’ बहुवचन प्रत्यय को स्पष्ट करता है। ‘जलती रहेगी’ पहले से भड़क चुकी आग की आगे जारी रहनेवाली क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: पहले खंड के एकवचन संबोधन से अंतिम खंड के बहुवचन संबोधन की ओर परिवर्तन
  choice: ‘तेरे/तू’ के बाद ‘तुम सबके’ रखकर संख्या-परिवर्तन को स्पष्ट रूप से सुरक्षित रखा गया है।
  alternative: सभी सर्वनामों को एकवचन या सभी को बहुवचन कर देना।
  rationale: इब्रानी पाठ पहले एक व्यक्ति को एकवचन में और अंत में समुदाय को बहुवचन में संबोधित करता है। इसे समरूप करना पाठ की वास्तविक व्याकरणिक और व्याख्यात्मक तनाव को मिटा देता।
- issue: पहले खंड का पाठगत रूप
  choice: मसोरेटिक व्यंजन-पाठ के अनुसार ‘तेरे शत्रुओं को ... पहुँचा दूँगा’ मुख्य पाठ में रखा गया है।
  alternative: कुछ प्राचीन अनुवादों और यिर्मयाह 17:4 के समानांतर के अनुसार ‘मैं तुझसे तेरे शत्रुओं की सेवा करवाऊँगा।’
  rationale: उपलब्ध इब्रानी पाठ में कर्म ‘तेरे शत्रु’ है; वैकल्पिक प्राचीन साक्ष्य महत्त्वपूर्ण है, इसलिए उसे पाद-टिप्पणी में दिया गया है, मुख्य पाठ में प्रतिस्थापित नहीं किया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘तू/तेरे’ का प्रयोग मूल के स्पष्ट एकवचन संबोधन को बनाए रखने के लिए है; अंतिम ‘तुम सबके’ मूल के बहुवचन को जानबूझकर स्पष्ट करता है। आग और क्रोध का भविष्यद्वाणी-संबंधी बिंब अक्षुण्ण रखा गया है।
