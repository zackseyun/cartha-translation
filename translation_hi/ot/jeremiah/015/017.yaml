reference: Jeremiah 15:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לֹֽא יָשַׁ֥בְתִּי בְ/סוֹד מְשַׂחֲקִ֖ים וָֽ/אֶעְלֹ֑ז מִ/פְּנֵ֤י יָֽדְ/ךָ֙ בָּדָ֣ד יָשַׁ֔בְתִּי כִּֽי זַ֖עַם מִלֵּאתָֽ/נִי־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/017.yaml
  text: I did not sit in the company of those who laugh[a], nor did I rejoice; because of your hand I sat alone[c][b], for you filled me with indignation.
translation:
  language: hi
  text: मैं न हँसी-मज़ाक करने वालों की संगति में बैठा[a], न आनन्दित हुआ। तेरे हाथ के कारण[b] मैं अकेला बैठा रहा, क्योंकि तूने मुझे रोष से भर दिया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आमोद करने वालों की मंडली में बैठा।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “तेरे हाथ के सामने से”; भाव संभवतः “तेरे हाथ के कारण” या “तेरे हाथ के दबाव में” है।
    reason: lexical_alternative
  - marker: c
    text: या, “कोप,” “क्रोध” अथवा “आक्रोश।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשַׁבְתִּי
  choice: बैठा / बैठा रहा
  rationale: मूल क्रिया का ठोस अर्थ ‘बैठना’ दोनों समानांतर वाक्यांशों में सुरक्षित है; दूसरे प्रयोग में ‘रहा’ एकाकी स्थिति की निरंतरता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּסוֹד
  choice: संगति में
  rationale: סוֹד यहाँ किसी घनिष्ठ मंडली या साथ-संगति को सूचित करता है; औपचारिक ‘सभा’ या ‘परिषद’ की अपेक्षा ‘संगति’ सामाजिक संबंध का आशय अधिक स्वाभाविक ढंग से देता है।
- source_word: מְשַׂחֲקִים
  choice: हँसी-मज़ाक करनेवाले
  rationale: कृदन्त हँसने, खेलने या आमोद करने का अर्थ दे सकता है। ‘हँसी-मज़ाक करनेवाले’ सामान्य उल्लास को व्यक्त करता है और अनावश्यक रूप से ‘ठट्ठा करनेवाले’ जैसा नकारात्मक अर्थ नहीं जोड़ता।
- source_word: וָאֶעְלֹז
  choice: न आनन्द मनाया
  rationale: עלז का अर्थ उल्लसित या आनन्दित होना है। पहले खंड का निषेध यहाँ भी लागू है; ‘न आनन्द मनाया’ हिन्दी में समानांतरता और स्पष्टता बनाए रखता है।
- source_word: מִפְּנֵי יָדְךָ
  choice: तेरे हाथ के कारण
  rationale: शाब्दिक रूप से ‘तेरे हाथ के सामने/कारण’ जैसी अभिव्यक्ति है। यह अनुवाद कारणात्मक संबंध स्पष्ट करता है, पर परमेश्वर के ‘हाथ’ की मूल रूपकात्मक छवि को बनाए रखता है।
- source_word: בָּדָד
  choice: अकेला
  rationale: शब्द अलगाव और एकांत की स्थिति बताता है; ‘अकेला’ संक्षिप्त, सहज और भावपूर्ण है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह यिर्मयाह के अकेले बैठने का कारण प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ संबंध को स्पष्ट रूप से व्यक्त करता है।
- source_word: זַעַם
  choice: रोष
  rationale: זַעַם क्रोध, कोप या आक्रोश सूचित कर सकता है। ‘रोष’ इसकी गंभीरता बनाए रखता है और यह पूरी तरह निश्चित नहीं करता कि यहाँ भावात्मक क्रोध, न्यायिक कोप या भविष्यद्वक्ता में भरा गया न्याय-संदेश प्रमुख है।
- source_word: מִלֵּאתָנִי
  choice: तूने मुझे भर दिया
  rationale: מלא का सीधा अर्थ ‘भरना’ है; यह रूप परमेश्वर की क्रिया और यिर्मयाह पर उसके प्रभाव को स्पष्ट तथा मूल के निकट रखता है।
theological_decisions:
- issue: परमेश्वर के ‘हाथ’ और यिर्मयाह के एकांत का संबंध
  choice: ‘तेरे हाथ के कारण’ कहकर परमेश्वर के हाथ की छवि और कारणात्मक संबंध दोनों सुरक्षित रखे गए हैं।
  alternative: इसे ‘तेरे दबाव में’ अथवा परमेश्वर की सुरक्षा या उपस्थिति के रूप में स्पष्ट करना।
  rationale: संदर्भ परमेश्वर की सामर्थ्य या बाध्यकारी भविष्यद्वक्ताई प्रभाव की ओर संकेत कर सकता है, पर मूल केवल ‘तेरे हाथ’ कहता है। इसलिए रूपक को किसी एक धर्मवैज्ञानिक व्याख्या में सीमित नहीं किया गया।
- issue: זַעַם का आशय
  choice: मुख्य पाठ में ‘रोष’।
  alternative: ‘कोप’, ‘क्रोध’ या ‘आक्रोश’।
  rationale: परमेश्वर यिर्मयाह को זַעַם से भरता है; ‘रोष’ इस तनाव को खुला रखता है कि यह परमेश्वर का न्यायपूर्ण कोप, यिर्मयाह का आक्रोश, अथवा उसके भीतर धारण किया गया न्याय-संदेश है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। परमेश्वर के लिए एकवचन निकट संबोधन ‘तू/तेरे’ रखा गया है, जो मूल के द्वितीय पुरुष एकवचन को दर्शाता है और हिन्दी बाइबलीय काव्य-भाषा में स्वाभाविक है। ‘हँसी-मज़ाक’ सामान्य पाठक के लिए स्पष्ट है, जबकि पादटिप्पणी मंडली/आमोद की वैकल्पिक छटा सुरक्षित रखती है।
