source:
  edition: WLC
  text: אַתָּ֧ה יָדַ֣עְתָּ יְהוָ֗ה זָכְרֵ֤/נִי וּ/פָקְדֵ֨/נִי֙ וְ/הִנָּ֤קֶם לִ/י֙ מֵ/רֹ֣דְפַ֔/י אַל לְ/אֶ֥רֶךְ אַפְּ/ךָ֖ תִּקָּחֵ֑/נִי דַּ֕ע שְׂאֵתִ֥/י עָלֶ֖י/ךָ חֶרְפָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/015.yaml
  text: You know[a], O Yahweh; remember me and attend to me, and take vengeance for me on my persecutors. In your patience do not take me away[d][c][b]; know that for your sake I bear reproach.
translation:
  language: hi
  text: हे यहोवा, तू जानता है; मुझे याद कर, मेरी सुधि ले[a], और मेरे सताने वालों से मेरा बदला ले। अपने धीरज में मुझे उठा न ले[b]। जान ले कि तेरे कारण मैं निंदा सहता हूँ[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मुझ पर ध्यान दे,” “मेरी देखभाल कर,” अथवा “मेरे लिए हस्तक्षेप कर।”
    reason: פקד के विस्तृत अर्थ-क्षेत्र को दिखाने के लिए।
  - marker: b
    text: 'शाब्दिक रूप के निकट: “अपने क्रोध की दीर्घता में मुझे न ले।” भाव सम्भवतः यह है कि परमेश्वर के धीरज या दण्ड देने में विलम्ब के बीच यिर्मयाह उठा लिया या नष्ट न हो जाए।'
    reason: कठिन इब्रानी मुहावरे और उसकी वास्तविक अस्पष्टता को सुरक्षित रखने के लिए।
  - marker: c
    text: या “जान ले कि तेरे निमित्त मैं निंदा सहता हूँ।”
    reason: עָלֶיךָ के कारणात्मक और सम्बन्धात्मक दोनों सम्भव भावों को दर्ज करने के लिए।
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिवाचक नाम को हिन्दी में प्रचलित और गरिमापूर्ण रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: זָכְרֵנִי
  choice: मुझे याद कर
  rationale: मूल आज्ञार्थक निवेदन की सीधाई बनाए रखता है; प्रसंग में स्मरण के साथ पक्ष में कार्य करने का भाव निहित है।
- source_word: וּפָקְדֵנִי
  choice: मेरी सुधि ले
  rationale: פקד के ध्यान देने, देखभाल करने और हस्तक्षेप करने के व्यापक भाव को स्वाभाविक हिन्दी में रखता है, बिना किसी एक अर्थ तक सीमित किए।
- source_word: וְהִנָּקֶם לִי מֵרֹדְפַי
  choice: मेरे सतानेवालों से मेरा बदला ले
  rationale: נקם की ईश्वरीय प्रतिशोध/न्याय की शक्ति और לִי के ‘मेरी ओर से’ भाव को बनाए रखता है।
- source_word: מֵרֹדְפַי
  choice: मेरे सतानेवाले
  rationale: רדף का शाब्दिक अर्थ पीछा करना है, पर विलाप के प्रसंग में इसका आशय शत्रुतापूर्ण उत्पीड़न है।
- source_word: אַל לְאֶרֶךְ אַפְּךָ תִּקָּחֵנִי
  choice: अपने धीरज के कारण मुझे उठा न ले
  rationale: אֶרֶךְ אַף के ‘क्रोध करने में धीमा/धीरजवान’ भाव और לקח के सम्भावित ‘उठा ले जाना’ अर्थ को रखते हुए मूल की कठिनता को पूरी तरह समतल नहीं करता।
- source_word: דַּע
  choice: जान ले
  rationale: आरम्भ के ‘तू जानता है’ के साथ शब्दगत और आलंकारिक सम्बन्ध बनाए रखता है।
- source_word: שְׂאֵתִי
  choice: मैं ... सहता हूँ
  rationale: נשׂא का यहाँ निन्दा को उठाने, ढोने या सहने का भाव है; ‘सहता हूँ’ सहज आधुनिक हिन्दी है।
- source_word: עָלֶיךָ חֶרְפָּה
  choice: तेरे कारण मैं निन्दा सहता हूँ
  rationale: עָלֶיךָ के कारणात्मक/सम्बन्धात्मक भाव को ‘तेरे कारण’ से व्यक्त करता है और भविष्यद्वक्ता की निन्दा का यहोवा से सम्बन्ध बनाए रखता है।
theological_decisions:
- issue: यिर्मयाह की ईश्वरीय प्रतिशोध की प्रार्थना
  choice: ‘मेरा बदला ले’ के रूप में स्पष्ट रखा गया
  alternative: ‘मेरा न्याय कर’ या ‘मुझे निर्दोष सिद्ध कर’
  rationale: נקם प्रतिशोध और न्यायिक प्रतिकार का स्पष्ट भाव रखता है। पाठ के तनाव को न तो नरम किया गया है, न इसे निजी मानवीय बदले की शिक्षा के रूप में बढ़ाया गया है।
- issue: परमेश्वर के धीरज और यिर्मयाह के उठा लिए जाने का सम्बन्ध
  choice: ‘अपने धीरज के कारण मुझे उठा न ले’
  alternative: ‘अपने धीरज में मुझे न उठा ले’ अथवा ‘अपने क्रोध की दीर्घता में मुझे न ले’
  rationale: मूल वाक्यांश संक्षिप्त और अर्थ की दृष्टि से कठिन है। अनुवाद परमेश्वर की विलम्बित कार्रवाई और यिर्मयाह के नष्ट/उठा लिए जाने की आशंका के सम्बन्ध को रखता है, पर मृत्यु को स्पष्ट रूप से जोड़कर अस्पष्टता समाप्त नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का प्रार्थनात्मक, गरिमापूर्ण और सीधा रूप अपनाया गया है। ‘तू/तेरे’ बाइबिलीय प्रार्थना में निकटता और एकवचन को व्यक्त करते हैं। कठिन मध्य वाक्य को पठनीय बनाया गया है, पर उसकी अर्थगत अनिश्चितता पादटिप्पणी में सुरक्षित है।
