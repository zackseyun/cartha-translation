  choice: क्या … तोड़ सकता है
  rationale: प्रश्नवाचक הֲ और רעע से बना रूप यहाँ धातु को भौतिक रूप से तोड़ने का अर्थ देता है और आलंकारिक प्रश्न की शक्ति बनाए रखता है।
