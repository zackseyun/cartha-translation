    issue: “दया करके” is interpretive addition
    rationale: The Hebrew infinitive הִנָּחֵם denotes relenting/changing one’s course in this judgment context. Although mercy may be contextually associated with relenting, the word itself does not explicitly state that Yahweh acts ‘by showing compassion.’
  - severity: medium
    issue: Divine-name rendering differs from the stated POB rendering
    rationale: The audit trail explicitly adopts “Yahweh” for יְהוָה. In Hindi Devanagari, “याहवे” is the corresponding transliteration; “यहोवा” represents the distinct traditional form Jehovah.
  - severity: low
    issue: “पीछे ही हटती जाती है” narrows the movement metaphor
    rationale: אָחוֹר תֵּלֵכִי is literally ‘you go/walk backward.’ “पीछे जाती रहती है” retains the image without introducing the more specific sense of retreat.
