  to: “तूने मुझे त्याग दिया है,” याहवे की घोषणा है। “तू पीछे जाती रहती है। इसलिए मैंने तेरे विरुद्ध अपना हाथ बढ़ाया और तुझे नष्ट कर दिया; मैं दण्ड टालते-टालते थक गया हूँ।”[a]
