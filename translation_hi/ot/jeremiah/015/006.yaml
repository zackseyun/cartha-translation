id: JER.15.6
reference: Jeremiah 15:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אַ֣תְּ נָטַ֥שְׁתְּ אֹתִ֛/י נְאֻם יְהוָ֖ה אָח֣וֹר תֵּלֵ֑כִי וָ/אַ֨ט אֶת יָדִ֤/י עָלַ֨יִ/ךְ֙ וָֽ/אַשְׁחִיתֵ֔/ךְ נִלְאֵ֖יתִי הִנָּחֵֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/006.yaml
  text: You have forsaken me[a], declares Yahweh; you keep going backward. So I have stretched out my hand against you and destroyed you[b]; I am weary of relenting.
translation:
  language: hi
  text: “तूने मुझे त्याग दिया है,” याहवे की घोषणा है। “तू पीछे जाती रहती है। इसलिए मैंने तेरे विरुद्ध अपना हाथ बढ़ाया और तुझे नष्ट कर दिया; मैं दण्ड टालते-टालते थक गया हूँ।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं अपना मन बदलते-बदलते थक गया हूँ।” यहाँ इब्रानी क्रिया का अर्थ घोषित दण्ड को टालने या उससे रुक जाने के अर्थ में है, नैतिक दोष के कारण पछताने के अर्थ में नहीं।
    reason: alternative_reading
lexical_decisions:
- source_word: נָטַשְׁתְּ
  choice: तूने मुझे त्याग दिया है
  rationale: ‘त्याग देना’ संबंध और वाचा से विमुख होने के आरोप की गंभीरता को स्वाभाविक हिन्दी में व्यक्त करता है। स्त्रीलिंग एकवचन ‘तू’ संबोधित यहूदा/यरूशलेम के व्याकरणिक रूप को बनाए रखता है।
- source_word: נְאֻם יְהוָה
  choice: यहोवा की यह घोषणा है
  rationale: נְאֻם भविष्यद्वाणी की औपचारिक दैवी-वाणी का सूत्र है; ‘घोषणा’ गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट है। יְהוָה को व्यक्तिगत नाम ‘यहोवा’ के रूप में रखा गया है।
- source_word: אָחוֹר תֵּלֵכִי
  choice: तू पीछे ही हटती जाती है
  rationale: मूल का शाब्दिक गति-बिंब ‘पीछे जाना’ सुरक्षित है और अपूर्ण क्रिया की लगातार या स्वभावगत क्रिया को ‘हटती जाती है’ व्यक्त करता है। ‘ही’ लगातार विपरीत दिशा पर बल देता है।
- source_word: וָאַט אֶת יָדִי עָלַיִךְ
  choice: इसलिए मैंने तेरे विरुद्ध अपना हाथ बढ़ाया
  rationale: हाथ बढ़ाने का मूल चित्र रखा गया है; עַל का ‘विरुद्ध’ न्यायपूर्ण शत्रुतापूर्ण कार्रवाई को स्पष्ट करता है। प्रसंग में וָ का परिणामसूचक संबंध ‘इसलिए’ से स्वाभाविक बनता है।
- source_word: וָאַשְׁחִיתֵךְ
  choice: और तुझे नष्ट कर दिया
  rationale: हिफ़ील रूप का तीव्र अर्थ ‘नष्ट करना/विनाश करना’ है; ‘नष्ट कर दिया’ न्याय की गंभीरता बनाए रखता है।
- source_word: נִלְאֵיתִי הִנָּחֵם
  choice: मैं दया करके दण्ड टालते-टालते थक गया हूँ
  rationale: נחם यहाँ घोषित न्याय से रुकने या उसे टालने के अर्थ में है। हिन्दी में केवल ‘मन बदलने’ की अपेक्षा यह पदबंध प्रसंगगत अर्थ स्पष्ट करता है, जबकि दैवी दया और न्याय का तनाव बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल में उपाधि नहीं, चतुरक्षरी व्यक्तिगत नाम है। हिन्दी के सामान्य बाइबलीय प्रयोग में परिचित ‘यहोवा’ उस नाम को उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- issue: परमेश्वर के लिए הִנָּחֵם का अर्थ
  choice: दया करके दण्ड टालना
  alternative: मन बदलना / पछताना / दया करना
  rationale: इस न्याय-संदर्भ में क्रिया घोषित दण्ड से रुकने या उसे टालने को दर्शाती है। चुना हुआ पाठ नैतिक भूल के लिए पश्चात्ताप का संकेत नहीं देता, पर यह तनाव बनाए रखता है कि परमेश्वर पहले दण्ड टालता रहा था और अब ऐसा करते-करते थक गया है।
- issue: पूर्ण विनाश जैसी भूतकालीन अभिव्यक्ति
  choice: तुझे नष्ट कर दिया
  alternative: तुझे नष्ट करूँगा / तुझे उजाड़ दिया
  rationale: वय्यिक्तोल रूप को पूर्ववर्ती न्यायकारी क्रिया के साथ भूतकाल में रखा गया है। भविष्यकाल बनाना मूल की क्रियात्मक प्रस्तुति को अनावश्यक रूप से बदल देता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण भविष्यद्वाणी-शैली अपनाई गई है। स्त्रीलिंग एकवचन संबोधन को ‘तू/तेरे/तुझे’ और ‘हटती जाती है’ से सुरक्षित रखा गया है। उद्धरण-विन्यास से दैवी वाणी स्पष्ट होती है। मुख्य पाठ में फुटनोट [a] अन्तिम कठिन पदबंध पर लगाया गया है।
