id: JER.15.16
reference: Jeremiah 15:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: נִמְצְא֤וּ דְבָרֶ֨י/ךָ֙ וָ/אֹ֣כְלֵ֔/ם וַ/יְהִ֤י דברי/ך לִ֔/י לְ/שָׂשׂ֖וֹן וּ/לְ/שִׂמְחַ֣ת לְבָבִ֑/י כִּֽי נִקְרָ֤א שִׁמְ/ךָ֙ עָלַ֔/י יְהוָ֖ה אֱלֹהֵ֥י צְבָאֽוֹת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/016.yaml
  text: Your words were found[a], and I ate them, and your words became for me a joy and the delight of my heart, for your name is called over me, O Yahweh, God of hosts.
translation:
  language: hi
  text: तेरे वचन मिले, और मैंने उन्हें खा लिया। तेरे वचन मेरे लिए उल्लास और मेरे हृदय का आनंद बन गए, क्योंकि तेरा नाम मुझ पर पुकारा गया है[a], हे याहवे, सेनाओं के परमेश्वर!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात्, “मैं तेरे नाम से कहलाता हूँ।”
    reason: इब्रानी मुहावरे का अधिक स्वाभाविक हिन्दी रूप, जो परमेश्वर से संबंध और उसके नाम से पहचाने जाने का भाव स्पष्ट करता है।
lexical_decisions:
- source_word: נִמְצְאוּ
  choice: मिले
  rationale: निफ़अल रूप के प्राप्त होने या मिल जाने के भाव को स्वाभाविक हिन्दी में रखता है; वाक्य में यिर्मयाह द्वारा सक्रिय रूप से खोजने की बात नहीं जोड़ी गई।
- source_word: דְבָרֶיךָ
  choice: तेरे वचन
  rationale: इब्रानी बहुवचन और परमेश्वर के कथनों के भाव को बनाए रखता है। हिन्दी में ‘वचन’ का बहुवचन रूप भी ‘वचन’ ही रहता है।
- source_word: וָאֹכְלֵם
  choice: मैंने उन्हें खा लिया
  rationale: परमेश्वर के वचनों को ग्रहण करने की सजीव मूल उपमा को बिना व्याख्यात्मक परिभाषा में बदले सुरक्षित रखता है।
- source_word: לְשָׂשׂוֹן
  choice: उल्लास
  rationale: שָׂשׂוֹן के प्रबल, उत्सवपूर्ण आनंद को व्यक्त करता है और अगले निकटार्थी पद से अनावश्यक शब्द-पुनरावृत्ति से बचाता है।
- source_word: וּלְשִׂמְחַת לְבָבִי
  choice: मेरे हृदय का आनंद
  rationale: भीतरी प्रसन्नता के रचनात्मक संबंध को सीधी, गरिमापूर्ण और सहज हिन्दी में व्यक्त करता है।
- source_word: נִקְרָא שִׁמְךָ עָלַי
  choice: तेरा नाम मुझ पर पुकारा गया है
  rationale: नाम के किसी व्यक्ति ‘पर’ पुकारे जाने की इब्रानी वाचा-संबंधी अभिव्यक्ति को बनाए रखता है; अधिक मुहावरेदार अर्थ पादटिप्पणी में दिया गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार-अक्षरीय व्यक्तिगत दिव्य नाम को हिन्दी में प्रचलित लिप्यंतरण द्वारा प्रस्तुत करता है, किसी उपाधि से प्रतिस्थापित नहीं करता।
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: सेनाओं के परमेश्वर
  rationale: צְבָאוֹת की बहुवचन व्यापकता और पारंपरिक धार्मिक अर्थ को समझने योग्य आधुनिक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ यहाँ परमेश्वर का व्यक्तिगत नाम सीधे प्रयोग करता है; इसलिए उसे उपाधि ‘प्रभु’ से बदलने के बजाय लिप्यंतरित किया गया है।
- issue: ‘तेरा नाम मुझ पर पुकारा गया है’ का वाचा-संबंधी मुहावरा
  choice: मुख्य पाठ में स्थानवाचक रूप को सुरक्षित रखा गया
  alternative: मैं तेरे नाम से कहलाता हूँ
  rationale: मूल अभिव्यक्ति परमेश्वर से संबंध, स्वामित्व और पहचान का संकेत देती है। मुख्य पाठ उसकी बनावट और धर्मवैज्ञानिक गहराई को रखता है, जबकि सहज हिन्दी अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिन्दी। परमेश्वर के लिए एकवचन निकट संबोधन ‘तेरे’ रखा गया है, जो मूल के 2ms रूप से मेल खाता है। ‘खा लिया’ की ठोस उपमा और नाम ‘मुझ पर’ पुकारे जाने की असामान्य पर अर्थपूर्ण अभिव्यक्ति को जानबूझकर सुरक्षित रखा गया है।
