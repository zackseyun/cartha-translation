source:
  edition: WLC
  text: לָ֣/מָּה הָיָ֤ה כְאֵבִ/י֙ נֶ֔צַח וּ/מַכָּתִ֖/י אֲנוּשָׁ֑ה֙ מֵֽאֲנָה֙ הֵֽרָפֵ֔א הָי֨וֹ תִֽהְיֶ֥ה לִ/י֙ כְּמ֣וֹ אַכְזָ֔ב מַ֖יִם לֹ֥א נֶאֱמָֽנוּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/018.yaml
  text: Why has my pain become perpetual[a], and my wound incurable, refusing to be healed? Will you indeed be to me like a deceptive brook, like waters that are not reliable?
translation:
  language: hi
  text: मेरा दर्द क्यों सदा बना रहता है, और मेरा घाव असाध्य है—वह भरने से इनकार करता है? क्या तू सचमुच मेरे लिए धोखा देने वाले नाले[a] के समान, ऐसे जल के समान होगा जिस पर भरोसा नहीं किया जा सकता?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सूख जाने वाले नाले’; इब्रानी में ऐसी जलधारा का बिंब है जो पानी मिलने की आशा जगाती है, पर भरोसेमंद सिद्ध नहीं होती।
    reason: lexical_alternative
lexical_decisions:
- source_word: כְאֵבִי
  choice: मेरा दर्द
  rationale: כאב शारीरिक या भावनात्मक पीड़ा दोनों को व्यक्त कर सकता है; ‘दर्द’ आधुनिक हिन्दी में इस विलाप के दोनों पहलुओं को स्वाभाविक रूप से समेटता है।
- source_word: נֶצַח
  choice: सदा का
  rationale: यहाँ शब्द निरंतर बने रहने की अवधि बताता है; ‘सदा का’ सरल और स्वाभाविक हिन्दी में उसी बल को रखता है।
- source_word: מַכָּתִי אֲנוּשָׁה
  choice: मेरा घाव ... असाध्य
  rationale: चंगाई के अगले उल्लेख के कारण מכה को ‘घाव’ और אֲנוּשָׁה को उपचार से परे गंभीर दशा के अर्थ में ‘असाध्य’ किया गया है।
- source_word: מֵאֲנָה הֵרָפֵא
  choice: जो भरने से इनकार करता है
  rationale: इब्रानी में घाव का मानवीकरण करके उसे चंगा होने से इनकार करते दिखाया गया है; हिन्दी में घाव के लिए ‘भरना’ स्वाभाविक है और मूल चित्र को बनाए रखता है।
- source_word: הָיוֹ תִהְיֶה לִי
  choice: क्या तू सचमुच मेरे लिए ... होगा
  rationale: इन्फिनिटिव ऐब्सोल्यूट और क्रिया का मेल प्रश्न में जोर और अविश्वास व्यक्त करता है; ‘सचमुच’ उस तीखे बल को संप्रेषित करता है।
- source_word: אַכְזָב
  choice: धोखा देनेवाला नाला
  rationale: शब्द ऐसी जलधारा का बिंब प्रस्तुत करता है जो पानी का भरोसा दिलाती है पर आवश्यकता के समय विफल हो जाती है; यह अनुवाद छल और विफलता दोनों की ओर संकेत करता है।
- source_word: מַיִם לֹא נֶאֱמָנוּ
  choice: ऐसा जल ... जिस पर भरोसा नहीं किया जा सकता
  rationale: 'यह वाक्यांश नाले के बिंब को स्पष्ट करता है: उसका पानी भरोसेमंद नहीं है। यह हिन्दी सहज है और אמן के विश्वसनीयता-संबंधी अर्थ को बचाती है।'
theological_decisions:
- issue: विलाप में परमेश्वर से सीधा और आरोपपूर्ण प्रश्न
  choice: यरमियाह का प्रश्न परमेश्वर को सीधे संबोधित करते हुए, उसके तीखेपन को बिना नरम किए रखा गया है।
  alternative: शिकायत को इस प्रकार नरम करना कि परमेश्वर की अविश्वसनीयता का संकेत न मिले।
  rationale: इब्रानी पाठ साहसपूर्ण संबंधपरक विलाप में परमेश्वर को अविश्वसनीय जलधारा के समान होने की संभावना के साथ संबोधित करता है। पाठ में उपस्थित धर्मवैचारिक तनाव को अनुवाद में बनाए रखना उचित है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी अपनाई गई है। परमेश्वर के लिए एकवचन ‘तू’ मूल के प्रत्यक्ष संबोधन और विलाप की निकटता तथा तीखेपन को बनाए रखता है। पाद-टिप्पणी का चिह्न उसी रूपक पर रखा गया है जिसकी वैकल्पिक व्याख्या दी गई है।
