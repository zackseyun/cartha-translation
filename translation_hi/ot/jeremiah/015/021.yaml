source:
  edition: WLC
  text: וְ/הִצַּלְתִּ֖י/ךָ מִ/יַּ֣ד רָעִ֑ים וּ/פְדִתִ֖י/ךָ מִ/כַּ֥ף עָרִצִֽים׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/021.yaml
  text: And I will deliver you from the hand of evil men[c][b][a], and I will redeem you from the grasp of the ruthless.
translation:
  language: hi
  text: और मैं तुझे बुरे लोगों के हाथ से छुड़ाऊँगा[a], और क्रूर लोगों की पकड़ से तेरा उद्धार करूँगा[b][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बचाऊँगा’।
    reason: lexical_alternative
  - marker: b
    text: या ‘तुझे मोल देकर छुड़ाऊँगा’।
    reason: lexical_alternative
  - marker: c
    text: या ‘हिंसक लोगों’।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִצַּלְתִּיךָ
  choice: और मैं तुझे ... छुड़ाऊँगा
  rationale: नצל के हिफ़ील रूप का अर्थ संकट या अधिकार से छुड़ाना/बचाना है। ‘छुड़ाऊँगा’ यहाँ स्वाभाविक है और अगले उद्धार-सूचक क्रियापद से संबंध बनाए रखता है।
- source_word: מִיַּד
  choice: के हाथ से
  rationale: יָד का शाब्दिक अर्थ ‘हाथ’ है और यहाँ अधिकार या वश का बिंब देता है; हिन्दी में ‘के हाथ से’ स्वाभाविक और चित्रात्मक है।
- source_word: רָעִים
  choice: बुरे लोगों
  rationale: यह विशेषण यहाँ संज्ञा के रूप में मनुष्य-विरोधियों के लिए प्रयुक्त है। ‘बुरे लोगों’ नैतिक अर्थ को स्पष्ट रखता है, जबकि हिन्दी में अनावश्यक रूप से केवल पुरुषों तक अर्थ सीमित नहीं करता।
- source_word: וּפְדִתִיךָ
  choice: और ... तेरा छुटकारा करूँगा
  rationale: פדה का अर्थ छुड़ाना, मूल्य देकर मुक्त करना या उद्धार करना हो सकता है। इस तत्काल प्रसंग में ‘छुटकारा करूँगा’ संकटकारी नियंत्रण से मुक्त करने का भाव स्वाभाविक ढंग से व्यक्त करता है, जबकि ‘मोल देकर छुड़ाऊँगा’ की संभावित बारीकी पादटिप्पणी में रखी गई है।
- source_word: מִכַּף
  choice: की पकड़ से
  rationale: כַּף मूलतः हथेली/हाथ है, पर इस मुहावरे में शत्रुतापूर्ण नियंत्रण का अर्थ है। ‘पकड़ से’ हिन्दी में उस ठोस बिंब और आशय दोनों को व्यक्त करता है।
- source_word: עָרִצִים
  choice: निर्दयी लोगों
  rationale: עָרִיץ हिंसक, कठोर या आतंककारी उत्पीड़क को सूचित करता है। ‘निर्दयी लोगों’ उनके दमनकारी चरित्र को व्यक्त करता है, बिना उन्हें विशेष रूप से राजनीतिक ‘तानाशाह’ ठहराए।
theological_decisions:
- issue: רָעִים के पुल्लिंग बहुवचन का हिन्दी रूप
  choice: बुरे लोगों
  alternative: बुरे पुरुषों / दुष्ट जनों
  rationale: हिब्रू रूप व्याकरणतः पुल्लिंग बहुवचन है और मानव विरोधियों को दर्शाता है; किन्तु आधुनिक हिन्दी में ‘लोगों’ मिश्रित या सामान्य मानव-समूह के लिए स्वाभाविक है और मूल पाठ से अधिक संकीर्ण जैविक अर्थ आरोपित नहीं करता।
- issue: פדה में मूल्य देकर छुड़ाने की संभावित धारणा
  choice: तेरा छुटकारा करूँगा
  alternative: तुझे मोल देकर छुड़ाऊँगा / तेरा उद्धार करूँगा
  rationale: पद का तत्काल समानांतर संकट और उत्पीड़कों की पकड़ से मुक्ति पर केंद्रित है; मूल क्रिया में फिरौती/मूल्य देकर मुक्त करने का अर्थ संभव है, पर यहाँ किसी मूल्य का स्पष्ट उल्लेख नहीं है। अतः मुख्य पाठ इसे अनिर्णीत रखता है और विकल्प पादटिप्पणी में देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण भविष्यद्वाणी शैली। परमेश्वर द्वारा यिर्मयाह को सीधे संबोधन के अनुरूप एकवचन ‘तुझे/तेरा’ रखा गया है। दोनों अर्धपंक्तियों की समानांतर संरचना और ‘हाथ/पकड़’ का शारीरिक बिंब सुरक्षित रखा गया है।
