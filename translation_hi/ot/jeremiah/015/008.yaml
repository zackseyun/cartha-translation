id: JER.15.8
reference: Jeremiah 15:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: עָֽצְמוּ לִ֤/י אַלְמְנֹתָ/ו֙ מֵ/ח֣וֹל יַמִּ֔ים הֵבֵ֨אתִי לָ/הֶ֥ם עַל אֵ֛ם בָּח֖וּר שֹׁדֵ֣ד בַּֽ/צָּהֳרָ֑יִם הִפַּ֤לְתִּי עָלֶ֨י/הָ֙ פִּתְאֹ֔ם עִ֖יר וּ/בֶהָלֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/008.yaml
  text: Their widows have become more numerous to me than the sand of the seas. I have brought against them, against the mother of a young man, a destroyer at noon; I have suddenly made city and terrors fall upon her.
translation:
  language: hi
  text: उनकी विधवाएँ मेरी दृष्टि में समुद्रों की रेत से भी अधिक हो गई हैं। मैंने उनके विरुद्ध—जवान की माँ के विरुद्ध—दोपहर में एक विनाशक ले आया हूँ। मैंने अचानक उसके ऊपर नगर और आतंक गिरा दिए हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “नगर और आतंक” इब्रानी मसोरेटिक पाठ का शाब्दिक अर्थ है; यह वाक्य कठिन है। कुछ प्राचीन पाठ-साक्ष्यों और प्रस्तावित पाठ-संशोधनों के आधार पर अन्य अनुवाद “पीड़ा और आतंक” या मिलते-जुलते शब्द देते हैं।
    reason: עִיר (“नगर”) प्रसंग में असामान्य है, इसलिए पाठगत और अर्थगत कठिनाई पाठक के सामने रखना आवश्यक है।
lexical_decisions:
- source_word: עָצְמוּ
  choice: अधिक हो गई हैं
  rationale: क्रिया का अर्थ संख्या या परिमाण में बहुत बढ़ जाना है; विधवाओं के बहुवचन के अनुरूप स्वाभाविक हिन्दी।
- source_word: אַלְמְנֹתָיו
  choice: उनकी विधवाएँ
  rationale: पुंलिंग एकवचन प्रत्यय को सामूहिक पूर्वसंदर्भ से जोड़ते हुए मूल की संरचना बनाए रखी गई है।
- source_word: שֹׁדֵד
  choice: विनाशक
  rationale: यह लूटने या उजाड़ने वाले आक्रमणकारी को सूचित करता है; 'विनाशक' काव्यात्मक और व्यापक अर्थ सुरक्षित रखता है।
- source_word: עִיר
  choice: नगर
  rationale: मसोरेटिक व्यंजन और स्वरांकन का प्रत्यक्ष अर्थ 'नगर' है, यद्यपि इस प्रसंग में पाठ कठिन है।
- source_word: בֶהָלוֹת
  choice: आतंक
  rationale: अचानक पड़ने वाली घबराहटों या दहशतों का भाव; हिन्दी में सामूहिक 'आतंक' अधिक स्वाभाविक है।
theological_decisions:
- issue: विनाशकारी न्याय का कर्ता
  choice: 'प्रथम पुरुष वाक्यों को स्पष्ट रखा गया: ‘मैंने ... भेजा है’ और ‘मैंने ... ला दिए हैं’'
  alternative: निष्क्रिय रूप में घटना का वर्णन
  rationale: इब्रानी पाठ न्याय की इन घटनाओं को सीधे परमेश्वर की क्रिया बताता है; इस तनाव को नरम नहीं किया गया।
- issue: ‘जवान की माँ’ का संबंध
  choice: ‘उनके विरुद्ध—जवान की माँ के विरुद्ध—’
  alternative: विनाशक को जवान की माँ के ऊपर/पास लाना
  rationale: עַל की पुनरावृत्ति और वाक्य की कठिन संरचना सुरक्षित रखते हुए माँ को आक्रमण झेलने वाले समुदाय का केंद्रित उदाहरण माना गया; मूल की संभावित अस्पष्टता बनी रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सीधी और काव्यात्मक शैली रखी गई है। लंबे इब्रानी वाक्य को पठनीयता के लिए तीन वाक्यों में बाँटा गया है; डैश मूल की असामान्य पुनरावृत्ति और केंद्रित बल को दर्शाते हैं।
