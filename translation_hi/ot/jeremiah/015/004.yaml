base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/004.yaml
  text: And I will make them a horror to all the kingdoms of the earth[a], because of Manasseh son of Hezekiah, king of Judah, because of what he did in Jerusalem.
translation:
  language: hi
  text: और मैं उन्हें पृथ्वी के सभी राज्यों के लिए दहशत का कारण[a] बना दूँगा—यहूदा के राजा हिजकिय्याह के पुत्र मनश्शे के कारण, उस काम के कारण जो उसने यरूशलेम में किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “भय की वस्तु” अथवा “आतंक।” इब्रानी संज्ञा ऐसी वस्तु या दशा का भाव देती है जो सिहरन, भय या दहशत उत्पन्न करे।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתַתִּים
  choice: और मैं उन्हें ... बना दूँगा
  rationale: यहाँ נתן के साथ विधेय-संज्ञा और ל परिणामस्वरूप किसी दशा में कर देने का भाव देते हैं; इसलिए केवल ‘दे दूँगा’ के बजाय ‘बना दूँगा’ स्वाभाविक और सटीक है।
- source_word: לְזַוֲעָה
  choice: दहशत का कारण
  rationale: संज्ञा उस वस्तु या दशा को सूचित करती है जो सिहरन, भय या आतंक उत्पन्न करे। ‘दहशत का कारण’ आधुनिक हिन्दी में स्वाभाविक है और लोगों के दूसरों के लिए भयावह उदाहरण बन जाने का भाव रखता है।
- source_word: לְכֹל מַמְלְכוֹת הָאָרֶץ
  choice: पृथ्वी के सभी राज्यों के लिए
  rationale: ל यहाँ उन राज्यों के प्रति संबंध दर्शाता है जिनकी दृष्टि में वे दहशत का कारण बनेंगे।
- source_word: בִּגְלַל
  choice: के कारण
  rationale: यह स्पष्ट कारणसूचक प्रयोग है और आनेवाले न्याय को मनश्शे से जोड़ता है।
- source_word: מְנַשֶּׁה בֶן יְחִזְקִיָּהוּ
  choice: हिजकिय्याह के पुत्र मनश्शे
  rationale: व्यक्तिनामों के प्रचलित हिन्दी बाइबलीय रूप रखते हुए पुत्र-संबंध को स्वाभाविक हिन्दी क्रम में व्यक्त किया गया है।
- source_word: מֶלֶךְ יְהוּדָה
  choice: यहूदा के राजा
  rationale: राजकीय पदवी का सीधा और प्रचलित हिन्दी रूप।
- source_word: עַל אֲשֶׁר עָשָׂה
  choice: क्योंकि उसने जो किया था
  rationale: यह वाक्यांश पहले कारण को अधिक विशिष्ट बनाता है। ‘क्योंकि’ कारणात्मक संबंध को स्पष्ट रखता है और ‘किया था’ मनश्शे के पूर्व कार्य की ओर संकेत करता है।
- source_word: בִּירוּשָׁלִָם
  choice: यरूशलेम में
  rationale: सरल स्थानवाचक प्रयोग और स्थाननाम का प्रचलित हिन्दी रूप।
theological_decisions:
- issue: मनश्शे के पापों से जुड़ा यहूदा का सामूहिक न्याय
  choice: पाठ में दिए गए प्रत्यक्ष कारणात्मक संबंध को बिना नरम किए बनाए रखा गया है।
  alternative: इसे प्रत्यक्ष कारण के बजाय केवल ऐतिहासिक पृष्ठभूमि के रूप में प्रस्तुत करना।
  rationale: इब्रानी पाठ न्याय को स्पष्टतः मनश्शे और यरूशलेम में उसके किए कार्य से जोड़ता है। अनुवाद सामूहिक न्याय और राजा के पाप के बीच मौजूद धर्मवैचारिक तनाव को समझाकर समाप्त नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज वाक्यरचना अपनाई गई है। ‘दहशत का कारण’ मूल संज्ञा के कारणकारी भयभाव को सामान्य पाठक के लिए स्पष्ट करता है; पादटिप्पणी उसकी वैकल्पिक अर्थ-छटाएँ सुरक्षित रखती है।
