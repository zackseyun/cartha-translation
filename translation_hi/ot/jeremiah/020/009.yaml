reference: Jeremiah 20:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אָמַרְתִּ֣י לֹֽא אֶזְכְּרֶ֗/נּוּ וְ/לֹֽא אֲדַבֵּ֥ר עוֹד֙ בִּ/שְׁמ֔/וֹ וְ/הָיָ֤ה בְ/לִבִּ/י֙ כְּ/אֵ֣שׁ בֹּעֶ֔רֶת עָצֻ֖ר בְּ/עַצְמֹתָ֑/י וְ/נִלְאֵ֥יתִי כַּֽלְכֵ֖ל וְ/לֹ֥א אוּכָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/009.yaml
  text: If I say[a], “I will not mention him, or speak any longer in his name,” then in my heart it is like a burning fire, shut up in my bones; I grow weary of holding it in[c][b], and I cannot.
translation:
  language: hi
  text: यदि मैं कहूँ, “मैं उसका उल्लेख नहीं करूँगा[a] और न फिर उसके नाम से बोलूँगा,”[b] तो वह मेरे हृदय में धधकती आग के समान हो जाता है, जो मेरी हड्डियों में बंद है। उसे भीतर रोके रखते-रखते मैं थक जाता हूँ,[c] और मुझसे यह नहीं हो पाता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मैं उसे स्मरण नहीं करूँगा।” इब्रानी क्रिया का अर्थ ‘स्मरण करना’ या ‘उल्लेख करना’ दोनों हो सकता है; यहाँ बोलने से समानान्तरता के कारण ‘उल्लेख’ अधिक उपयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात उसके प्रतिनिधि के रूप में या उसके अधिकार से बोलना।
    reason: cultural_note
  - marker: c
    text: इब्रानी में रोकी जाने वाली वस्तु स्पष्ट नहीं कही गई है; सम्भवतः यहोवा का सन्देश या उसे बोलने की भीतर की बाध्यता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְאָמַרְתִּי
  choice: यदि मैं कहूँ
  rationale: रूप की दृष्टि से इसका अर्थ ‘और मैंने कहा’ हो सकता है, पर सन्दर्भ में यह बार-बार किए जाने वाले या काल्पनिक निश्चय को प्रकट करता है; इसलिए शर्तसूचक हिन्दी स्वाभाविक है।
- source_word: אֶזְכְּרֶנּוּ
  choice: मैं उसका उल्लेख नहीं करूँगा
  rationale: זכר का अर्थ ‘स्मरण करना’ और ‘उल्लेख करना’ दोनों हो सकता है। अगले समानान्तर वाक्यांश में बोलने की बात होने के कारण यहाँ ‘उल्लेख करना’ अधिक उपयुक्त है।
- source_word: אֲדַבֵּר עוֹד בִּשְׁמוֹ
  choice: न फिर उसके नाम से बोलूँगा
  rationale: ‘नाम से बोलना’ मूल इब्रानी मुहावरे को बनाए रखता है और किसी के अधिकार अथवा प्रतिनिधि के रूप में बोलने का भाव देता है।
- source_word: וְהָיָה בְלִבִּי
  choice: तो वह मेरे हृदय में ... हो जाता है
  rationale: मूल पाठ में पुल्लिंग एकवचन क्रिया है, पर उसका संज्ञात्मक कर्ता स्पष्ट नहीं किया गया। ‘वह’ इस अंतर्निहित सन्दर्भ को बिना ‘वचन’ या ‘सन्देश’ जोड़कर सुरक्षित रखता है।
- source_word: כְּאֵשׁ בֹּעֶרֶת
  choice: धधकती आग के समान
  rationale: यह अनुवाद आग की सजीव और तीव्र उपमा को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: עָצֻר בְּעַצְמֹתָי
  choice: जो मेरी हड्डियों में बन्द है
  rationale: עצר यहाँ रोके या बन्द किए जाने का भाव देता है; ‘हड्डियों में बन्द’ मूल की शारीरिक तीव्रता को सुरक्षित रखता है।
- source_word: וְנִלְאֵיתִי כַּלְכֵּל
  choice: उसे भीतर रोके रखते-रखते मैं थक जाता हूँ
  rationale: यह नबी के भीतर उस अनकही वस्तु को दबाए रखने के निरन्तर श्रम और थकावट को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְלֹא אוּכָל
  choice: और मुझसे यह नहीं हो पाता
  rationale: मूल में असमर्थता का कथन है और उसका कर्म अनकहा है। हिन्दी में यह रूप उसी अनकहे कर्म और असमर्थता दोनों को बनाए रखता है।
theological_decisions:
- issue: तीसरे पुरुष के सर्वनामों का संकेत
  choice: मुख्य पाठ में ‘उसका’ और ‘उसके’ रखा गया है।
  alternative: सर्वनामों के स्थान पर ‘यहोवा’ स्पष्ट रूप से लिखा जा सकता था।
  rationale: निकटवर्ती सन्दर्भ से संकेत स्पष्ट है, पर मूल इब्रानी में सर्वनाम ही हैं। उन्हें बनाए रखने से मूल की भावात्मक निकटता रहती है और कोई अतिरिक्त संज्ञा नहीं जोड़ी जाती।
- issue: हृदय में आग के समान होने वाली वस्तु
  choice: अस्पष्ट सर्वनाम ‘वह’ रखा गया है।
  alternative: ‘उसका वचन’ या ‘यहोवा का सन्देश’ स्पष्ट रूप से जोड़ा जा सकता था।
  rationale: सन्दर्भ से दिव्य सन्देश अथवा उसे बोलने की बाध्यता का संकेत मिलता है, लेकिन इस उपवाक्य में संज्ञा स्पष्ट नहीं है। इसलिए मुख्य पाठ उस अर्थगत तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज और वाचनीय रूप अपनाया गया है। ‘धधकती आग’ और ‘हड्डियों में बन्द’ जैसी ठोस छवियाँ मूल की भावनात्मक तथा शारीरिक तीव्रता बनाए रखती हैं। सर्वनामों और अनकहे कर्म को यथासम्भव अस्पष्ट ही रखा गया है।
