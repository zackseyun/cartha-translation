source:
  edition: WLC
  text: וְ/אַתָּ֣ה פַשְׁח֗וּר וְ/כֹל֙ יֹשְׁבֵ֣י בֵיתֶ֔/ךָ תֵּלְכ֖וּ בַּ/שֶּׁ֑בִי וּ/בָבֶ֣ל תָּב֗וֹא וְ/שָׁ֤ם תָּמוּת֙ וְ/שָׁ֣ם תִּקָּבֵ֔ר אַתָּה֙ וְ/כָל אֹ֣הֲבֶ֔י/ךָ אֲשֶׁר נִבֵּ֥אתָ לָ/הֶ֖ם בַּ/שָּֽׁקֶר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/006.yaml
  text: And you[a], Pashhur, and all who live in your house will go into captivity; and you will come to Babylon, and there you will die, and there you will be buried—you and all your loved ones, to whom you prophesied falsely.
translation:
  language: hi
  text: और तू, पशहूर, और तेरे घर में रहनेवाले सभी लोग बंदी होकर जाएँगे। तू बाबेल पहुँचेगा; वहीं तू मरेगा और वहीं तू और तेरे सभी प्रियजन दफनाए जाओगे—वे सभी, जिनसे तूने झूठी भविष्यवाणी की थी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिनसे तूने झूठ बोलते हुए भविष्यवाणी की थी।”
    reason: בַּשָּׁקֶר को क्रियाविशेषणात्मक रूप में ‘झूठी रीति से’ अथवा अधिक मूर्त रूप में ‘झूठ बोलते हुए’ समझा जा सकता है।
lexical_decisions:
- source_word: יֹשְׁבֵי בֵיתֶךָ
  choice: तेरे घर में रहनेवाले सभी लोग
  rationale: यह सहभागी रूप घर में निवास करनेवालों को दर्शाता है। यह चयन आधुनिक और सहज हिन्दी में पूरे घराने के दायरे को बनाए रखता है।
- source_word: תֵּלְכוּ בַּשֶּׁבִי
  choice: बंदी होकर जाएँगे
  rationale: इब्रानी मुहावरा बंदी बनाए जाकर ले जाए जाने पर बल देता है; यह केवल स्थानांतरण या निर्वासन से अधिक स्पष्ट रूप से बंदी दशा व्यक्त करता है।
- source_word: וּבָבֶל תָּבוֹא
  choice: तू बाबेल पहुँचेगा
  rationale: בוא का मूल भाव आना/प्रवेश करना है। हिन्दी में संदर्भगत दृष्टिकोण की असहजता से बचते हुए ‘पहुँचेगा’ गंतव्य तक लाए जाने का भाव स्वाभाविक रूप से देता है।
- source_word: וְשָׁם תָּמוּת וְשָׁם תִּקָּבֵר
  choice: वहीं तू मरेगा और वहीं तुझे दफनाया जाएगा
  rationale: ‘वहीं’ की पुनरावृत्ति मूल पाठ के स्थानगत बल और न्याय की निश्चितता को सुरक्षित रखती है।
- source_word: אֹהֲבֶיךָ
  choice: तेरे सभी प्रियजनों
  rationale: אהב का सहभागी रूप उन लोगों को दर्शाता है जो उससे प्रेम रखते हैं। ‘प्रियजन’ ‘मित्र’ से व्यापक है और ‘प्रेमी’ से उत्पन्न होनेवाले भ्रामक लैंगिक अर्थ से बचता है।
- source_word: נִבֵּאתָ לָהֶם בַּשָּׁקֶר
  choice: जिनके लिए तूने झूठी भविष्यवाणी की थी
  rationale: לָהֶם यहाँ उन लोगों को संबोधित या उनके हित में किए गए भविष्यवचन को सूचित कर सकता है। ‘झूठी भविष्यवाणी’ संदेश की असत्यता को व्यक्त करती है, बिना वक्ता की आंतरिक मंशा को अनावश्यक रूप से निश्चित किए।
theological_decisions:
- issue: पशहूर के भविष्यवचन के अपराध का स्वरूप
  choice: झूठी भविष्यवाणी की थी
  alternative: झूठ की भविष्यवाणी की थी
  rationale: यह रूप भविष्यवाणी को असत्य ठहराता है, पर यह आवश्यक नहीं मानता कि पाठ पशहूर की आत्मगत मंशा पर भी स्पष्ट निर्णय दे रहा है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। भविष्यवाणी के सीधे संबोधन को बनाए रखने के लिए एकवचन ‘तू/तेरे’ प्रयोग हुआ है। ‘बाबेल’ इब्रानी नाम בָּבֶל का पारंपरिक बाइबलीय लिप्यंतरण है।
