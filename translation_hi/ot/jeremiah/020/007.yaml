base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/007.yaml
  text: You persuaded me[a], Yahweh, and I was persuaded; you overpowered me and prevailed. I have become a laughingstock all day long; everyone mocks me.
translation:
  language: hi
  text: याहवे, तूने मुझे मनाया[a], और मैं मान गया; तूने मुझे अपने बल से वश में कर लिया और मुझ पर प्रबल हुआ। मैं दिन भर हँसी का पात्र बना रहता हूँ; हर कोई मेरा उपहास करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे, तूने मुझे धोखा दिया, और मैं धोखा खा गया।” इब्रानी क्रिया का अर्थ फुसलाना, मनाना या धोखा देना हो सकता है; यिर्मयाह के विलाप की भाषा जानबूझकर तीखी है।
    reason: alternative_reading
lexical_decisions:
- source_word: פִּתִּיתַנִי
  choice: तूने मुझे फुसलाया
  rationale: इब्रानी פתה का अर्थ प्रसंग के अनुसार फुसलाना, मनाना या धोखा देना हो सकता है। ‘फुसलाया’ भविष्यद्वक्ता के तीखे विलाप और क्रिया की अर्थगत व्यापकता को बनाए रखता है; अधिक स्पष्ट ‘धोखा दिया’ पाठांतर को पादटिप्पणी में रखा गया है।
- source_word: וָאֶפָּת
  choice: और मैं फुसल गया
  rationale: यह पहले खंड की क्रिया को निष्क्रिय/आत्मवाचक ढंग से दोहराता है और मूल की समानांतर रचना को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चतुरक्षरीय व्यक्तिगत ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: חֲזַקְתַּנִי
  choice: तूने मुझे अपने बल से वश में कर लिया
  rationale: यहाँ חזק यिर्मयाह पर बलपूर्वक अधिकार कर लेने का भाव देता है। यह हिन्दी अभिव्यक्ति उस व्यक्तिगत और शक्तिशाली क्रिया को स्पष्ट करती है।
- source_word: וַתּוּכָל
  choice: और प्रबल हुआ
  rationale: יכל यहाँ सफलतापूर्वक हावी होने या जीत जाने का अर्थ रखता है। ‘प्रबल हुआ’ पिछले खंड के बल-संबंधी भाव से मेल खाता है और गरिमापूर्ण है।
- source_word: הָיִיתִי לִשְׂחוֹק
  choice: मैं ... हँसी का पात्र बना रहा
  rationale: यह वाक्यांश दूसरों की सार्वजनिक हँसी और तिरस्कार का निशाना बनने को व्यक्त करता है।
- source_word: כָּל־הַיּוֹם כֻּלֹּה
  choice: दिन भर
  rationale: मूल की दोहरी काल-अभिव्यक्ति पूरे दिन की अवधि पर जोर देती है; ‘दिन भर’ इसका स्वाभाविक हिन्दी रूप है।
- source_word: לֹעֵג לִי
  choice: हर कोई मेरा उपहास करता है
  rationale: एकवचन कृदंत यहाँ वितरणात्मक अर्थ में है। ‘हर कोई’ उस व्यापक उपहास को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: क्या פתה को मुख्य पाठ में परमेश्वर पर सीधे छल का आरोप लगाते हुए अनुवाद किया जाए
  choice: मुख्य पाठ में ‘फुसलाया’ रखा गया और ‘धोखा दिया’ को पादटिप्पणी में सुरक्षित किया गया।
  alternative: ‘याहवे, तूने मुझे धोखा दिया, और मैं धोखा खा गया।’
  rationale: यह पद विलाप है और इसकी भाषा जानबूझकर चौंकाने वाली है। फिर भी इब्रानी क्रिया में फुसलाने, मनाने और धोखा देने की अर्थ-सीमा है। ‘फुसलाया’ आरोप की तीक्ष्णता और अर्थगत अस्पष्टता दोनों को कुछ हद तक बनाए रखता है, जबकि स्पष्टतर आरोप पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘फुसलाया’ सामान्य पाठक के लिए बोधगम्य है और मूल की असहज भावात्मक तीक्ष्णता को पूरी तरह समतल नहीं करता। ‘हँसी का पात्र’ और ‘उपहास’ सार्वजनिक अपमान के भाव को स्वाभाविक हिन्दी में व्यक्त करते हैं।
