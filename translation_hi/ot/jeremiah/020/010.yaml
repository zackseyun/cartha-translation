source:
  edition: WLC
  text: כִּ֣י שָׁמַ֜עְתִּי דִּבַּ֣ת רַבִּים֮ מָג֣וֹר מִ/סָּבִיב֒ הַגִּ֨ידוּ֙ וְ/נַגִּידֶ֔/נּוּ כֹּ֚ל אֱנ֣וֹשׁ שְׁלוֹמִ֔/י שֹׁמְרֵ֖י צַלְעִ֑/י אוּלַ֤י יְפֻתֶּה֙ וְ/נ֣וּכְלָה ל֔/וֹ וְ/נִקְחָ֥ה נִקְמָתֵ֖/נוּ מִמֶּֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/010.yaml
  text: 'For I have heard the whispering of many: “Terror on every side!” “Report[a], and let us report it!” All the men at peace with me are watching for my stumbling: “Perhaps he will be deceived, and we will prevail against him[b], and we will take our vengeance on him.”'
translation:
  language: hi
  text: 'क्योंकि मैंने बहुतों की कानाफूसी सुनी है: “चारों ओर आतंक है!” “खबर दो[a], और हम भी इसकी खबर देंगे!” मेरे सभी मित्र मेरे लड़खड़ाने की ताक में हैं[b]: “शायद वह बहकाया जाए, तब हम उस पर प्रबल होंगे और उससे अपना बदला लेंगे।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी निंदा करो, और हम भी उसकी निंदा करेंगे।” हिब्रू क्रिया का अर्थ “बताना, खबर देना, घोषित करना” है, पर इस शत्रुतापूर्ण प्रसंग में उसमें दोषारोपण या निंदा का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “मेरी लंगड़ाहट” या “मेरे पहलू” को ताक रहे हैं। यह अभिव्यक्ति संभवतः किसी कमजोरी, चूक या पतन की प्रतीक्षा करने का संकेत देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבַּת רַבִּים
  choice: बहुतों की कानाफूसी
  rationale: דִּבָּה दुर्भावनापूर्ण चर्चा, बदनामी या कानाफूसी का बोध करा सकता है। षड्यंत्रपूर्ण प्रसंग में ‘कानाफूसी’ गुप्त और शत्रुतापूर्ण बातचीत को स्वाभाविक हिन्दी में व्यक्त करती है, जबकि औपचारिक निंदा का अर्थ अनावश्यक रूप से निश्चित नहीं करती।
- source_word: מָגוֹר מִסָּבִיב
  choice: चारों ओर आतंक है
  rationale: यह यिर्मयाह में बार-बार आने वाला पद है और चारों ओर से घिरे भय का भाव व्यक्त करता है।
- source_word: הַגִּידוּ וְנַגִּידֶנּוּ
  choice: खबर दो, और हम इसकी खबर देंगे
  rationale: נגד के हिफ़ील रूप का मूल अर्थ बताना, घोषित करना या खबर देना है। पहले क्रियापद में कर्म व्यक्त नहीं है, जबकि दूसरे में प्रत्यय है; हिन्दी में ‘इसकी’ उस प्रत्यय को दर्शाता है और शत्रुतापूर्ण संदर्भ आरोप लगाने का भाव स्वतः देता है।
- source_word: כֹּל אֱנוֹשׁ שְׁלוֹמִי
  choice: मेरे सभी घनिष्ठ परिचित
  rationale: शाब्दिक रूप ‘मेरी शांति का प्रत्येक मनुष्य’ है, अर्थात वे लोग जिनसे मैत्रीपूर्ण या शांतिपूर्ण संबंध थे। ‘घनिष्ठ परिचित’ निकट संबंध और विश्वासघात दोनों को सहज हिन्दी में व्यक्त करता है, बिना उन्हें आवश्यक रूप से सच्चे मित्र घोषित किए।
- source_word: שֹׁמְרֵי צַלְעִי
  choice: मेरी ठोकर की ताक में हैं
  rationale: צלע का शाब्दिक बिंब पहलू, लंगड़ाहट या कमजोरी से जुड़ सकता है। प्रसंग में लोग किसी चूक या पतन की प्रतीक्षा कर रहे हैं; ‘ठोकर की ताक में’ उस शत्रुतापूर्ण निगरानी को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יְפֻתֶּה
  choice: वह बहकाया जाए
  rationale: פתה के निफ़ाल रूप में बहकाए, फुसलाए या धोखा दिए जाने का अर्थ संभव है। ‘बहकाया जाए’ षड्यंत्रकारियों द्वारा उसे जाल में फँसाने की आशा को व्यक्त करते हुए मूल की अर्थ-सीमा बनाए रखता है।
- source_word: וְנּוּכְלָה לוֹ
  choice: हम उस पर प्रबल हो जाएँ
  rationale: יכל עם ל का अर्थ विरोधी पर सामर्थ्य पाना या प्रबल होना है। यह चयन संघर्षात्मक भाव और अपेक्षाकृत औपचारिक गरिमा दोनों बनाए रखता है।
- source_word: וְנִקְחָה נִקְמָתֵנוּ מִמֶּנּוּ
  choice: उससे अपना बदला लें
  rationale: हिब्रू मुहावरे का शाब्दिक रूप ‘उससे अपना प्रतिशोध लेना’ है। आधुनिक हिन्दी में ‘उससे अपना बदला लें’ स्पष्ट, स्वाभाविक और उसी प्रतिकारात्मक भाव का वाहक है।
