id: JER.20.12
reference: Jeremiah 20:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יהוָ֤ה צְבָאוֹת֙ בֹּחֵ֣ן צַדִּ֔יק רֹאֶ֥ה כְלָי֖וֹת וָ/לֵ֑ב אֶרְאֶ֤ה נִקְמָֽתְ/ךָ֙ מֵ/הֶ֔ם כִּ֥י אֵלֶ֖י/ךָ גִּלִּ֥יתִי אֶת רִיבִֽ/י־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/012.yaml
  text: But you[a], O Yahweh of Armies, who test the righteous, who see the kidneys and the heart, let me see your vengeance on them[b], for to you I have revealed my case.
translation:
  language: hi
  text: 'पर हे सेनाओं के याहवे,

    धर्मी को परखनेवाले,

    गुर्दों और हृदय को देखनेवाले[a],

    मैं उन पर आपका प्रतिशोध देखूँ,

    क्योंकि मैंने अपना मुक़दमा[b] आपके पास प्रकट किया है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “गुर्दों और हृदय को”; इब्रानी में यह मनुष्य के सबसे गहरे विचारों, उद्देश्यों और भावनाओं का बिंब है।
    reason: cultural_note
  - marker: b
    text: या “अपना पक्ष” अथवा “अपना विवाद”।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה צְבָאוֹת
  choice: पर हे सेनाओं के याहवे
  rationale: וַ को प्रसंगानुसार विरोधसूचक ‘पर’ और צְבָאוֹת को उसके बहुवचन तथा सामरिक बिंब के अनुरूप ‘सेनाओं के’ कहा गया है; याहवे नाम को नाम के रूप में रखा गया है।
- source_word: בֹּחֵן צַדִּיק
  choice: धर्मी को परखनेवाले
  rationale: वर्तमान कृदन्त परमेश्वर के निरंतर कार्य को व्यक्त करता है; צַדִּיק यहाँ एक धर्मी व्यक्ति को सामान्य रूप से सूचित करता है।
- source_word: רֹאֶה כְלָיוֹת וָלֵב
  choice: गुर्दों और हृदय को देखनेवाले
  rationale: मूल के ठोस शारीरिक बिंब को बनाए रखा गया है; इसका आशय मनुष्य के गहरे विचारों, उद्देश्यों और भावनाओं से है, जिसे पाद-टिप्पणी स्पष्ट करती है।
- source_word: אֶרְאֶה
  choice: मैं ... देखूँ
  rationale: प्रथम पुरुष अपूर्ण क्रिया को ऐसे रूप में रखा गया है जो प्रसंग में इच्छा/विनती व्यक्त करता है, पर भविष्यसूचक संभावना को पूरी तरह समाप्त नहीं करता।
- source_word: נִקְמָתְךָ מֵהֶם
  choice: उन पर आपका प्रतिशोध
  rationale: נִקְמָה के न्यायिक और प्रत्युत्तरात्मक बल को नरम किए बिना ‘प्रतिशोध’ कहा गया है; מֵהֶם को इस पदबंध में स्वाभाविक हिन्दी ‘उन पर’ से व्यक्त किया गया है।
- source_word: גִּלִּיתִי אֶת רִיבִי
  choice: मैंने अपना मुक़दमा ... खोलकर रख दिया है
  rationale: גלה के ‘खोलना/प्रकट करना’ और ריב के न्यायिक ‘मामला/मुक़दमा’ दोनों भावों को स्वाभाविक हिन्दी में व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु; यहोवा
  rationale: मूल पाठ में वाचा-संबंधी विशिष्ट नाम है; उसे किसी उपाधि में बदलने के बजाय नाम के रूप में प्रस्तुत किया गया है।
- issue: כְלָיוֹת וָלֵב का मानव-अंतरात्मा संबंधी बिंब
  choice: गुर्दों और हृदय को देखनेवाले
  alternative: मन और हृदय को देखनेवाले; अंतरतम को देखनेवाले
  rationale: मूल का असामान्य किंतु अर्थपूर्ण शारीरिक बिंब बनाए रखने से इब्रानी मानव-अंतरात्मा की अभिव्यक्ति और उसका तनाव सुरक्षित रहता है; अर्थ पाद-टिप्पणी में स्पष्ट किया गया है।
- issue: אֶרְאֶה का इच्छासूचक अथवा भविष्यसूचक अर्थ
  choice: मैं ... देखूँ
  alternative: मुझे ... देखने दीजिए; मैं ... देखूँगा
  rationale: इब्रानी अपूर्ण रूप प्रसंग में इच्छा व्यक्त कर सकता है, किंतु केवल स्पष्ट आज्ञार्थक या केवल निश्चित भविष्य चुनने से मूल की संभावित अर्थ-व्याप्ति संकुचित हो जाती।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिन्दी अपनाई गई है। काव्यात्मक समानांतरता बनाए रखने के लिए संबोधन और दोनों कृदन्तीय पदों को अलग पंक्तियों में रखा गया है। ईश्वर के लिए आदरसूचक ‘आप’ का प्रयोग किया गया है।
