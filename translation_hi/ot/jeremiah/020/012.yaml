review_pass:
  verdict: revise
  source_fidelity: 'The translation closely follows the Hebrew: Yahweh is addressed as ''Yahweh of Armies''; the participles preserve the ongoing actions of testing and seeing; the concrete imagery of kidneys and heart is retained; and the final clause accurately conveys disclosure of the speaker''s legal case. However, ''आपके सामने'' shifts the explicit Hebrew direction ''to you'' slightly toward a courtroom-presence idiom. ''आपके पास'' preserves the direction while remaining natural in Hindi.'
  naturalness: The elevated, poetic lineation is effective and the vocative and participial phrases are understandable. 'मेरा मुक़दमा आपके पास प्रकट किया है' is more direct and idiomatic than 'अपना मुक़दमा आपके सामने खोलकर रख दिया है' while also avoiding the added compound imagery of 'opening and setting down.'
  terminology: '''याहवे,'' ''सेनाओं के,'' ''धर्मी,'' ''प्रतिशोध,'' and the literal ''गुर्दों और हृदय'' are suitable. The explanatory note appropriately identifies the Hebrew bodily imagery as figurative. The legal term ''मुक़दमा'' is a sound rendering of רִיב in context.'
  issues:
  - severity: low
    issue: The final disclosure clause adds 'before you' and an expanded idiom.
    rationale: אֵלֶיךָ means 'to you,' and גִּלִּיתִי means 'I have revealed/disclosed.' Recasting the clause as 'मैंने अपना मुक़दमा आपके पास प्रकट किया है' is closer to both elements without changing its legal sense.
