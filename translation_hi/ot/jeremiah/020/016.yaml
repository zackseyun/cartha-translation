source:
  edition: WLC
  text: וְ/הָיָה֙ הָ/אִ֣ישׁ הַ/ה֔וּא כֶּֽ/עָרִ֛ים אֲשֶׁר הָפַ֥ךְ יְהוָ֖ה וְ/לֹ֣א נִחָ֑ם וְ/שָׁמַ֤ע זְעָקָה֙ בַּ/בֹּ֔קֶר וּ/תְרוּעָ֖ה בְּ/עֵ֥ת צָהֳרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/016.yaml
  text: Let that man be like the cities that Yahweh overthrew without relenting[b][a], and let him hear a cry in the morning and a battle shout at the time of noon.
translation:
  language: hi
  text: वह मनुष्य उन नगरों के समान हो जाए जिन्हें याहवेह ने उलट दिया और जिन पर वह द्रवित न हुआ[b]; वह सुबह संकट की पुकार और दोपहर के समय युद्ध की ललकार[a] सुने।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘चेतावनी का नाद’ अथवा ‘तुरही की ध्वनि’; इब्रानी शब्द तेरूआ के ये अर्थ भी हो सकते हैं।
    reason: lexical_alternative
  - marker: b
    text: यह कथन संभवतः उन नगरों की ओर संकेत करता है जिन्हें याहवेह ने न्याय में उलट दिया था, जैसे सदोम और अमोरा।
    reason: cross_reference
lexical_decisions:
- source_word: וְהָיָה
  choice: हो जाए
  rationale: शाप अथवा अभिशाप की इच्छा व्यक्त करने वाले प्रयोग को स्वाभाविक हिन्दी में विधिलिंग से व्यक्त किया गया है।
- source_word: הָאִישׁ הַהוּא
  choice: वह मनुष्य
  rationale: निर्देशक सर्वनाम और पुल्लिंग एकवचन दोनों को बनाए रखता है।
- source_word: כֶּעָרִים
  choice: उन नगरों के समान
  rationale: כ की तुलनात्मक शक्ति और आगे आने वाले संबंधवाचक उपवाक्य से नगरों की विशिष्टता स्पष्ट होती है।
- source_word: אֲשֶׁר הָפַךְ יְהוָה
  choice: जिन्हें याहवेह ने उलट दिया
  rationale: הפך के विनाशकारी ‘उलट देने’ के चित्र और न्याय-संबंधी प्रतिध्वनि को बनाए रखता है; יְהוָה को उपाधि से बदलने के बजाय नाम के लिप्यंतरण से दिया गया है।
- source_word: וְלֹא נִחָם
  choice: और फिर न द्रवित हुआ
  rationale: נחם यहाँ घोषित दंड से करुणावश पीछे हटने अथवा द्रवित होने का भाव रखता है। यह चयन परमेश्वर के नैतिक पश्चात्ताप का भ्रामक अर्थ दिए बिना मूल की भावात्मक भाषा बचाता है।
- source_word: וְשָׁמַע
  choice: वह ... सुने
  rationale: आरंभिक अभिशाप की इच्छासूचक शक्ति को जारी रखने के लिए हिन्दी विधिलिंग प्रयुक्त है।
- source_word: זְעָקָה
  choice: सहायता की पुकार
  rationale: यह शब्द संकट में उठी पुकार को सूचित करता है; केवल ‘पुकार’ की अपेक्षा प्रसंग का संकट-बोध अधिक स्पष्ट करता है।
- source_word: בַּבֹּקֶר
  choice: सुबह
  rationale: स्वाभाविक आधुनिक हिन्दी में समय का सीधा संकेत।
- source_word: וּתְרוּעָה
  choice: युद्ध की ललकार
  rationale: תרועה युद्धघोष, चेतावनी अथवा तुरही-ध्वनि हो सकती है। हिंसक विनाश के प्रसंग में ‘युद्ध की ललकार’ उपयुक्त है, जबकि अन्य संभावनाएँ पादटिप्पणी में सुरक्षित हैं।
- source_word: בְּעֵת צָהֳרָיִם
  choice: दोपहर के समय
  rationale: मूल के अपेक्षाकृत पूरे काल-वाक्यांश ‘दोपहर के समय’ को सहज हिन्दी में बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय न्याय के साथ נחם का अर्थ
  choice: फिर न द्रवित हुआ
  alternative: न पछताया / अपने निर्णय से न फिरा
  rationale: ‘न पछताया’ आधुनिक हिन्दी में नैतिक भूल का पश्चात्ताप सुझा सकता है, जबकि ‘अपने निर्णय से न फिरा’ भावात्मक पहलू को घटा देता है। चयन दंड की अपरिवर्तित परिणति और दया से द्रवित न होने—दोनों को व्यक्त करता है।
- issue: ईश्वरीय नाम יְהוָה
  choice: याहवेह
  alternative: यहोवा / प्रभु
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम है; उसे उपाधि ‘प्रभु’ से बदलने के बजाय आधुनिक हिन्दी लिप्यंतरण में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। अभिशाप की काव्यात्मक तीव्रता, नगरों के उलट दिए जाने का चित्र और सुबह से दोपहर तक संकट सुनने की कालगत संरचना सुरक्षित है।
