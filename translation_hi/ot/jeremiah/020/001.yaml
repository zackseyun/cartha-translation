language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֤ע פַּשְׁחוּר֙ בֶּן אִמֵּ֣ר הַ/כֹּהֵ֔ן וְ/הֽוּא פָקִ֥יד נָגִ֖יד בְּ/בֵ֣ית יְהוָ֑ה אֶֽת יִרְמְיָ֔הוּ נִבָּ֖א אֶת הַ/דְּבָרִ֥ים הָ/אֵֽלֶּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/001.yaml
  text: Pashhur son of Immer the priest[a], who was chief officer in the house of Yahweh, heard Jeremiah prophesying these words.
translation:
  language: hi
  text: इम्मेर के पुत्र पशहूर याजक ने, जो याहवे के भवन[a] में प्रधान अधिकारी था, यिर्मयाह को इन वचनों की भविष्यवाणी करते हुए सुना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘याहवे के मंदिर में’; शाब्दिक अर्थ, ‘याहवे के भवन में’।
    reason: בְּבֵית יְהוָה का शाब्दिक रूप ‘याहवे के भवन में’ है, जबकि संदर्भगत आशय मंदिर है।
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: सुना
  rationale: שׁמע यहाँ कथानक की अगली घटना बताता है। ‘सुना’ सहज है और जानबूझकर ध्यान देने का अतिरिक्त भाव नहीं जोड़ता। आरंभिक וַ का प्रवाह हिंदी वाक्य-क्रम से स्पष्ट है, इसलिए अलग से ‘तब’ या ‘अब’ नहीं जोड़ा गया।
- source_word: פַּשְׁחוּר בֶּן אִמֵּר הַכֹּהֵן
  choice: इम्मेर के पुत्र पशहूर याजक
  rationale: नामों का लिप्यंतरण किया गया है, בֶּן को ‘पुत्र’ और निश्चित הַכֹּהֵן को पद-सूचक ‘याजक’ के रूप में रखा गया है।
- source_word: וְהוּא פָקִיד נָגִיד
  choice: जो ... प्रधान अधिकारी था
  rationale: פקיד नियुक्त अधिकारी या निरीक्षक और נגיד नेतृत्व अथवा उच्च पद का भाव देता है; दोनों का संयुक्त, स्वाभाविक हिंदी रूप ‘प्रधान अधिकारी’ है।
- source_word: בְּבֵית יְהוָה
  choice: याहवे के भवन में
  rationale: בַּיִת का मूल अर्थ ‘भवन/घर’ है और इस प्रसंग में वह मंदिर को सूचित करता है। ‘भवन’ स्रोत की उपमा बचाता है, जबकि पादटिप्पणी स्पष्ट विकल्प देती है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה को उपाधि से बदलने के बजाय हिंदी में ‘याहवे’ लिप्यंतरित किया गया है।
- source_word: נִבָּא
  choice: भविष्यवाणी के रूप में सुनाते हुए
  rationale: कृदंत यिर्मयाह की उस समय जारी भविष्यद्वाणी की क्रिया दिखाता है। यह रूप हिंदी में क्रिया की समकालिक और भविष्यद्वक्ताई प्रकृति स्पष्ट करता है।
- source_word: אֶת הַדְּבָרִים הָאֵלֶּה
  choice: ये वचन
  rationale: דברים यहाँ अभी कहे गए भविष्यद्वाणी-संबंधी कथनों को दर्शाता है; ‘ये वचन’ उस मौखिक और गंभीर संदर्भ को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में चार-अक्षरी व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और नाम को किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: הַכֹּהֵן का संबंध
  choice: पशहूर को याजक के रूप में प्रस्तुत किया गया
  alternative: इम्मेर को याजक मानना
  rationale: इब्रानी पदबंध में उपपद व्याकरणतः कुछ संबंधगत संक्षिप्तता रखता है, पर अगले एकवचन संबंधवाचक कथन में पशहूर का मंदिर-अधिकारी होना और सामान्य वाक्य-संरचना ‘याजक’ को पशहूर का पद मानने का समर्थन करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिंदी पाठक के लिए सहज रखी गई है। ‘याजक’, ‘वचन’ और ‘भविष्यवाणी’ बाइबलीय संदर्भ में परिचित शब्द हैं। पादटिप्पणी-चिह्न को उसी पदबंध पर रखा गया है जिससे उसका वास्तविक संबंध है।
