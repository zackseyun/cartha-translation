source:
  edition: WLC
  text: כִּֽי מִ/דֵּ֤י אֲדַבֵּר֙ אֶזְעָ֔ק חָמָ֥ס וָ/שֹׁ֖ד אֶקְרָ֑א כִּֽי הָיָ֨ה דְבַר יְהוָ֥ה לִ֛/י לְ/חֶרְפָּ֥ה וּ/לְ/קֶ֖לֶס כָּל הַ/יּֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/008.yaml
  text: For whenever I speak[a], I cry out; I proclaim, “Violence and destruction!” For the word of Yahweh has become to me a reproach and a derision all day long.
translation:
  language: hi
  text: क्योंकि जब-जब मैं बोलता हूँ[a], मैं चिल्लाता हूँ; मैं घोषणा करता हूँ, “हिंसा और विनाश!” क्योंकि याहवे का वचन दिन भर मेरे लिए निंदा और उपहास का विषय बन गया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हर बार जब मैं बोलता हूँ, मैं चिल्लाता हूँ; मैं घोषणा करता हूँ, ‘हिंसा और विनाश!’”
    reason: मूल का מִדֵּי + अपूर्ण क्रिया वाला वाक्यांश ‘जब-जब’ अथवा ‘हर बार जब’ के रूप में व्यक्त किया जा सकता है।
lexical_decisions:
- source_word: מִדֵּי
  choice: जब-जब
  rationale: מִדֵּי के साथ अपूर्ण क्रिया बार-बार होने वाली घटना व्यक्त करती है। ‘जब-जब’ आधुनिक हिन्दी में इस आवृत्तिमूलक अर्थ को स्वाभाविक रूप से बनाए रखता है।
- source_word: אֲדַבֵּר
  choice: मैं बोलता हूँ
  rationale: यहाँ पिएल अपूर्ण प्रथम पुरुष एकवचन, מִדֵּי के साथ, आदतन या बार-बार होने वाली क्रिया बताता है।
- source_word: אֶזְעָק
  choice: मैं चिल्ला उठता हूँ
  rationale: זעק तीव्र पुकार या दुहाई को व्यक्त करता है। ‘चिल्ला उठता हूँ’ उसकी तीव्रता और बार-बार होने वाले उद्गार दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: חָמָס
  choice: हिंसा
  rationale: חָמָס प्रायः हिंसा या हिंसक अन्याय को दर्शाता है; भविष्यद्वक्ताओं के सन्दर्भ में ‘हिंसा’ सीधा और स्थापित अर्थ है।
- source_word: שֹׁד
  choice: विनाश
  rationale: שֹׁד लूट के साथ-साथ उजाड़ या विनाश को भी सूचित कर सकता है। यहाँ חָמָס के साथ ‘विनाश’ व्यापक सन्दर्भ के अनुकूल है; ‘लूट’ सम्भव पर अधिक संकीर्ण है।
- source_word: אֶקְרָא
  choice: मैं पुकारकर कहता हूँ
  rationale: קרא यहाँ यिर्मयाह की सार्वजनिक पुकार की विषयवस्तु प्रस्तुत करता है। यह पदबंध पहले आए तीव्र उद्गार से सम्बन्ध बनाए रखते हुए उद्धरण को स्पष्टता से आरम्भ करता है।
- source_word: דְבַר יְהוָה
  choice: याहवे का वचन
  rationale: यह मानक भविष्यद्वक्तीय अभिव्यक्ति है। ‘वचन’ उसके धार्मिक और साहित्यिक अनुनाद को ‘सन्देश’ की अपेक्षा अधिक निकटता से सुरक्षित रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी पाठ में परमेश्वर का व्यक्तिगत नाम टेट्राग्रामटन सीधे आया है; हिन्दी में उसका ध्वन्यात्मक रूप ‘याहवे’ रखा गया है, न कि उसके स्थान पर कोई उपाधि।
- source_word: לְחֶרְפָּה
  choice: अपमान
  rationale: חֶרְפָּה अपमान, निंदा या तिरस्कार को सूचित करता है। ‘अपमान’ आधुनिक हिन्दी में व्यक्ति पर आने वाली लज्जा और अवमानना को स्पष्ट रूप से व्यक्त करता है।
- source_word: וּלְקֶלֶס
  choice: और उपहास
  rationale: קֶלֶס हँसी उड़ाए जाने या उपहास का भाव रखता है। ‘उपहास’ गरिमापूर्ण और सामान्यतः समझा जाने वाला रूप है।
- source_word: כָּל הַיּוֹם
  choice: दिन भर
  rationale: यह मुहावरा पूरे दिन जारी रहने वाली अवधि बताता है; ‘दिन भर’ स्वाभाविक आधुनिक हिन्दी है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम יְהוָה का प्रयोग करता है। ‘याहवे’ उस नाम को उपाधि से बदलने के बजाय उसका हिन्दी लिप्यंतरण करता है।
- issue: याहवे के वचन का ‘अपमान और उपहास’ बनना
  choice: ‘मेरे लिए ... का कारण बन गया है’
  alternative: ‘स्वयं अपमान और उपहास बन गया है’
  rationale: לִי को ‘मेरे लिए’ और לְחֶרְפָּה וּלְקֶלֶס को परिणाम के रूप में व्यक्त किया गया है। इससे यह अर्थ स्पष्ट रहता है कि वचन के कारण यिर्मयाह अपमान और उपहास झेलता है, जबकि मूल की सघन अभिव्यक्ति को किसी विस्तृत धर्मवैज्ञानिक व्याख्या से नहीं भरा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्वाभाविक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रूप अपनाया गया है। समानार्थी तीव्र क्रियाओं की पुनरावृत्ति को ‘चिल्ला उठता हूँ’ और ‘पुकारकर कहता हूँ’ से अलग रखा गया है। उद्धरण की संक्षिप्त भविष्यद्वक्तीय तीव्रता सुरक्षित है।
