lexical_decisions:
- source_word: אָרוּר
  choice: शापित हो
  rationale: यह ארר से बना विधेय विशेषण है और यहाँ अभिशाप की प्रबल कामना व्यक्त करता है। ‘शापित हो’ आधुनिक, स्वाभाविक और गरिमापूर्ण हिन्दी में इस बल को बनाए रखता है।
- source_word: הַיּוֹם אֲשֶׁר יֻלַּדְתִּי בּוֹ
  choice: वह दिन, जिस दिन मैं जन्मा था
  rationale: सम्बन्धवाचक रचना और בּוֹ के कालवाचक संकेत को हिन्दी के स्वाभाविक ‘जिस दिन’ में समाहित किया गया है; יֻלַּדְתִּי का सीधा अर्थ ‘मैं जन्मा था’ है।
- source_word: יוֹם אֲשֶׁר יְלָדַתְנִי אִמִּי
  choice: जिस दिन मेरी माँ ने मुझे जन्म दिया
  rationale: सक्रिय मातृ-केंद्रित वाक्य-विन्यास को स्पष्ट रूप से रखा गया है। यह मूल की ठोस अभिव्यक्ति को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אַל יְהִי
  choice: वह ... न हो
  rationale: निषेधात्मक जुस्सिव की इच्छावाचक शक्ति को हिन्दी की ‘न हो’ रचना से व्यक्त किया गया है।
- source_word: בָרוּךְ
  choice: आशीषित
  rationale: यह ‘शापित’ के साथ मूल पाठ का प्रत्यक्ष अलंकारिक विरोध बनाए रखता है और धार्मिक अर्थ-क्षेत्र को अनावश्यक रूप से सीमित नहीं करता।
