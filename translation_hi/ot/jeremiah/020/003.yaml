base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/003.yaml
  text: And it happened the next day[a], when Pashhur brought Jeremiah out of the stocks, that Jeremiah said to him, “Yahweh has not called your name Pashhur, but Terror on Every Side.”
translation:
  language: hi
  text: अगले दिन ऐसा हुआ कि जब पशहूर ने यिर्मयाह को काठ से निकाला, तब यिर्मयाह ने उससे कहा, “याहवे ने तुम्हारा नाम पशहूर नहीं रखा है, बल्कि ‘चारों ओर आतंक’[a] रखा है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: ‘मागोर-मिस्साबीब’; इसका अर्थ ‘चारों ओर आतंक’ या ‘हर ओर आतंक’ है। यह शब्द-क्रीड़ा के रूप में दिया गया नया नाम है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמָּחֳרָת
  choice: अगले दिन
  rationale: यह समय-सूचक पद पूर्ववर्ती घटना के बाद वाले दिन को दर्शाता है; ‘अगले दिन’ स्वाभाविक और स्पष्ट हिन्दी है।
- source_word: וַיֹּצֵא ... אֶת יִרְמְיָהוּ מִן הַמַּהְפָּכֶת
  choice: पशहूर ने यिर्मयाह को काठ से निकाला
  rationale: हिफ़ील क्रिया का कारणवाचक भाव ‘बाहर निकाला’ है। ‘काठ’ उस दंडात्मक बंधन-यंत्र के लिए हिन्दी बाइबलीय परंपरा में परिचित और संक्षिप्त शब्द है।
- source_word: הַמַּהְפָּכֶת
  choice: काठ
  rationale: यह कैदी को बाँधकर संभवतः असुविधाजनक मुद्रा में रखने वाला दंड-यंत्र था। ‘काठ’ आधुनिक पाठक के लिए पर्याप्त रूप से बोधगम्य है, यद्यपि यंत्र की ठीक बनावट निश्चित नहीं है।
- source_word: קָרָא ... שְׁמֶךָ
  choice: तुम्हारा नाम ... रखा है
  rationale: इब्रानी मुहावरा नाम देने या नामित करने का भाव रखता है। हिन्दी में ‘नाम रखा है’ स्वाभाविक है और ईश्वर द्वारा नए नाम की घोषणा को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम है; उसे किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: כִּי אִם
  choice: बल्कि
  rationale: नकार के बाद आने वाला यह पद तीखा विरोध व्यक्त करता है; ‘बल्कि’ हिन्दी में स्वाभाविक समतुल्य है।
- source_word: מָגוֹר מִסָּבִיב
  choice: चारों ओर आतंक
  rationale: यह पशहूर को दिया गया प्रतीकात्मक नया नाम है और साथ ही यिर्मयाह में बार-बार आने वाली अभिव्यक्ति भी। उद्धरण-चिह्न इसके नाम-सदृश प्रयोग को स्पष्ट करते हैं।
- source_word: פַשְׁחוּר
  choice: पशहूर
  rationale: व्यक्तिनाम को प्रचलित हिन्दी बाइबलीय रूप में लिप्यंतरित किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: यहाँ मूल पाठ स्पष्ट रूप से चतुरक्षरीय व्यक्तिगत नाम יהוה देता है। ‘याहवे’ उसे उपाधि में बदले बिना प्रस्तुत करता है।
- issue: מָגוֹר מִסָּבִיב को नए नाम के रूप में प्रस्तुत करना
  choice: ‘चारों ओर आतंक’
  alternative: चारों ओर भय; हर ओर आतंक
  rationale: वाक्य नामकरण की घोषणा है। अनूदित अर्थ को उद्धरण-चिह्नों में रखकर प्रतीकात्मक नाम और भविष्यसूचक शब्द-क्रीड़ा दोनों सुरक्षित रखे गए हैं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। आरंभ का ‘ऐसा हुआ कि’ इब्रानी कथात्मक संरचना का हल्का औपचारिक रंग बनाए रखता है। ‘काठ’ पारंपरिक बाइबलीय शब्द है, पर वाक्य-संदर्भ से उसका बंधन-यंत्र होना स्पष्ट रहता है।
