  text: אָר֣וּר הָ/אִ֗ישׁ אֲשֶׁ֨ר בִּשַּׂ֤ר אֶת אָבִ/י֙ לֵ/אמֹ֔ר יֻֽלַּד לְ/ךָ֖ בֵּ֣ן זָכָ֑ר שַׂמֵּ֖חַ שִׂמֳּחָֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/015.yaml
  text: Cursed be the man who brought my father the news[a], saying[b], “A son has been born to you,” making him very glad.
translation:
  language: hi
  text: शापित हो वह मनुष्य जिसने मेरे पिता को यह समाचार सुनाया[a], “तुम्हारे यहाँ एक पुत्र जन्मा है,” और मेरे पिता को बहुत आनन्दित किया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी क्रिया प्रायः शुभ या आनन्ददायक समाचार सुनाने के लिए प्रयुक्त होती है; यहाँ वह पुत्र-जन्म का समाचार है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में ‘आनन्दित करना’ क्रिया के पहले उसी धातु का एक infinitive absolute है, जो बल देता है; भाव है, “उसे बहुत/अत्यन्त आनन्दित किया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: शापित हो
  rationale: यह विधेय विशेषण यहाँ शाप की कामना व्यक्त करता है; ‘शापित हो’ उसकी तीव्रता और स्वाभाविक हिन्दी दोनों को बनाए रखता है।
- source_word: הָאִישׁ
  choice: वह मनुष्य
  rationale: निश्चित एकवचन संज्ञा उस विशेष संदेशवाहक की ओर संकेत करती है; हिन्दी में ‘वह मनुष्य’ संदर्भगत निश्चितता स्पष्ट करता है।
- source_word: בִּשַּׂר אֶת אָבִי
  choice: मेरे पिता को यह समाचार दिया
  rationale: क्रिया समाचार सुनाने या शुभ समाचार देने को व्यक्त करती है। जन्म-संदेश स्वयं आनन्ददायक है, इसलिए ‘यह समाचार दिया’ अर्थ को बिना अनावश्यक धार्मिक रंग दिए स्वाभाविक रूप से प्रस्तुत करता है।
- source_word: לֵאמֹר
  choice: —
  rationale: हिन्दी में प्रत्यक्ष कथन से पहले अल्पविराम और उद्धरण-चिह्न ही इब्रानी उद्धरणसूचक रूप का स्वाभाविक कार्य करते हैं; अलग से ‘यह कहते हुए’ जोड़ना आवश्यक नहीं।
- source_word: יֻלַּד לְךָ
  choice: तेरे यहाँ ... जन्मा है
  rationale: इब्रानी निष्क्रिय क्रिया और संबंधसूचक לְךָ को जन्म की सूचना देने वाली स्वाभाविक आधुनिक हिन्दी में व्यक्त किया गया है। एकवचन अनौपचारिक ‘तेरे’ मूल के द्वितीय पुरुष एकवचन को बनाए रखता है।
- source_word: בֵּן זָכָר
  choice: एक पुत्र
  rationale: शाब्दिक रूप ‘एक पुत्र, नर’ है। हिन्दी में ‘पुत्र’ से पुरुष लिंग पहले ही स्पष्ट है, इसलिए मुख्य पाठ में पुनरुक्ति से बचते हुए शाब्दिक विशेषता पादटिप्पणी में रखी गई है।
- source_word: שַׂמֵּחַ שִׂמֳּחָהוּ
  choice: उसे बहुत आनन्दित किया
  rationale: सजातीय धातु के साथ infinitive absolute क्रिया की तीव्रता बढ़ाता है; ‘बहुत आनन्दित किया’ इस बल को गरिमापूर्ण और सहज हिन्दी में व्यक्त करता है।
