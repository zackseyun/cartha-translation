  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, स्पष्ट और सामान्य पाठक के लिए सहज रूप। शाप-वचन की तीव्रता तथा जन्म-संदेश से उत्पन्न अत्यधिक आनन्द को सुरक्षित रखा गया है। मुख्य पाठ में [a] समाचार-सूचक क्रिया की शुभ-संदेश वाली छाया और [b] इब्रानी की बलवर्धक सजातीय रचना को स्पष्ट करता है।
