  text: כִּ֣י כֹ֣ה אָמַ֣ר יְהוָ֡ה הִנְ/נִי֩ נֹתֶנְ/ךָ֨ לְ/מָג֜וֹר לְ/ךָ֣ וּ/לְ/כָל אֹהֲבֶ֗י/ךָ וְ/נָֽפְל֛וּ בְּ/חֶ֥רֶב אֹיְבֵי/הֶ֖ם וְ/עֵינֶ֣י/ךָ רֹא֑וֹת וְ/אֶת כָּל יְהוּדָ֗ה אֶתֵּן֙ בְּ/יַ֣ד מֶֽלֶךְ בָּבֶ֔ל וְ/הִגְלָ֥/ם בָּבֶ֖לָ/ה וְ/הִכָּ֥/ם בֶּ/חָֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/004.yaml
  text: 'For thus says Yahweh: Behold[a], I am making you a terror to yourself and to all your loved ones, and they will fall by the sword of their enemies while your eyes look on. And I will give all Judah into the hand of the king of Babylon[c][b], and he will carry them away to Babylon and strike them with the sword.'
translation:
  language: hi
  text: 'क्योंकि याहवे ऐसा कहता है: “देख, मैं तुझे तेरे लिए और तेरे सभी चाहने वालों[b] के लिए आतंक[a] बना रहा हूँ। वे अपने शत्रुओं की तलवार से मारे जाएँगे और तू अपनी आँखों से यह देखेगा। मैं समूचे यहूदा को बाबेल के राजा के हाथ में कर दूँगा। वह उन्हें बंदी बनाकर बाबेल ले जाएगा[c] और तलवार से उन पर प्रहार करेगा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द मागोर का अर्थ ‘आतंक’ या ‘भय’ है। यह आस-पास के प्रसंग में पशहूर को दिए गए नाम की प्रतिध्वनि है, जिसका अर्थ प्रायः ‘चारों ओर आतंक’ किया जाता है।
    reason: cross_reference
  - marker: b
    text: ‘चाहने वालों’ का अनुवाद ‘मित्रों’ भी हो सकता है। इब्रानी शब्द उससे प्रेम रखने वालों को बताता है और इसमें निकट साथी या समर्थक शामिल हो सकते हैं।
    reason: lexical_alternative
  - marker: c
    text: या, “वह उन्हें निर्वासित करके बाबेल ले जाएगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: הִנְנִי
  choice: देख
  rationale: यह भविष्यद्वाणी की घोषणा में ध्यान खींचने वाला पद है; ‘देख’ आधुनिक हिन्दी में स्वाभाविक रहते हुए उसकी गंभीरता बनाए रखता है।
- source_word: נֹתֶנְךָ לְמָגוֹר
  choice: मैं तुझे ... आतंक बना रहा हूँ
  rationale: נתן का शाब्दिक अर्थ ‘देना’ है, पर इस रचना में ‘बनाना’ स्वाभाविक है। कृदन्त निकट और निश्चित कार्रवाई का भाव देता है।
- source_word: לְךָ
  choice: स्वयं तेरे लिए
  rationale: इससे यह स्पष्ट रहता है कि पशहूर दूसरों के साथ-साथ अपने लिए भी आतंक बनेगा; इब्रानी की आत्मवाचक शक्ति सुरक्षित है।
- source_word: אֹהֲבֶיךָ
  choice: तेरे सभी चाहने वालों
  rationale: यह शब्द शाब्दिक रूप से उससे प्रेम रखने वालों को बताता है और मित्रों, निकट साथियों या समर्थकों को समेट सकता है।
- source_word: וְנָפְלוּ בְּחֶרֶב אֹיְבֵיהֶם
  choice: वे अपने शत्रुओं की तलवार से मारे जाएँगे
  rationale: ‘तलवार से गिरना’ मृत्यु का इब्रानी मुहावरा है; हिन्दी में ‘मारे जाएँगे’ उसका अर्थ स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְעֵינֶיךָ רֹאוֹת
  choice: तू अपनी आँखों से यह देखेगा
  rationale: यह पशहूर के व्यक्तिगत रूप से इस विपत्ति का साक्षी होने पर बल देता है।
- source_word: אֶתֵּן בְּיַד
  choice: हाथ में कर दूँगा
  rationale: इब्रानी मुहावरे का अर्थ किसी दूसरे के अधिकार या वश में सौंपना है; हिन्दी में समान ‘हाथ में’ मुहावरा स्पष्ट है।
- source_word: וְהִגְלָם בָּבֶלָה
  choice: वह उन्हें बंदी बनाकर बाबेल ले जाएगा
  rationale: हिफ़ील रूप जबरन देश-निकाले को व्यक्त करता है; यह अनुवाद निर्वासन की वास्तविकता को सामान्य पाठक के लिए स्पष्ट करता है।
- source_word: וְהִכָּם בֶּחָרֶב
  choice: तलवार से मारेगा
  rationale: נכה का मूल भाव प्रहार करना है; तलवार के साथ यहाँ घातक हिंसा अभिप्रेत है। हिन्दी ‘मारेगा’ प्रहार और वध—दोनों की संभावित छाया रख सकता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम है। ‘याहवे’ उसका व्यापक रूप से स्वीकृत विद्वत्तापूर्ण लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
- issue: पशहूर के संबंध में לְמָגוֹר का बल
  choice: स्वयं तेरे लिए ... आतंक
  alternative: तेरे लिए भय का कारण; चारों ओर आतंक
  rationale: निकट संदर्भ में यह पद पशहूर को दिए गए ‘चारों ओर आतंक’ नाम की प्रतिध्वनि करता है, पर इस पद की वाक्य-रचना विशेष रूप से उसे स्वयं उसके और उसके चाहने वालों के लिए आतंक बताती है। इसलिए संदर्भगत शब्द-खेल पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथनात्मक रखी गई है। एकवचन संबोधन के लिए ‘तू’ मूल इब्रानी के सीधे और कठोर भविष्यद्वाणी-संबोधन को बनाए रखता है। ‘बाबेल’ इब्रानी नाम के निकट है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं; [b] को उसके संबंधित वाक्यांश के बाद रखा गया है।
