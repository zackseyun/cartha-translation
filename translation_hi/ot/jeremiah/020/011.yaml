source:
  edition: WLC
  text: וַֽ/יהוָ֤ה אוֹתִ/י֙ כְּ/גִבּ֣וֹר עָרִ֔יץ עַל כֵּ֛ן רֹדְפַ֥/י יִכָּשְׁל֖וּ וְ/לֹ֣א יֻכָ֑לוּ בֹּ֤שׁוּ מְאֹד֙ כִּֽי לֹ֣א הִשְׂכִּ֔ילוּ כְּלִמַּ֥ת עוֹלָ֖ם לֹ֥א תִשָּׁכֵֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/011.yaml
  text: But Yahweh is with me like a mighty warrior[a]; therefore my persecutors will stumble and will not prevail. They will be utterly ashamed, because they have not acted wisely[c][b]; their everlasting disgrace will not be forgotten.
translation:
  language: hi
  text: परन्तु यहवे मेरे साथ एक बलवान और प्रचण्ड योद्धा के समान हैं;[a] इसलिए मेरा पीछा करने वाले[b] ठोकर खाएँगे और मुझ पर प्रबल न होंगे। वे अत्यन्त लज्जित होंगे, क्योंकि उन्होंने समझ-बूझ से काम नहीं लिया;[c] उनका चिरस्थायी अपमान कभी भुलाया नहीं जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में: “एक बलवान, प्रचण्ड योद्धा के समान।”'
    reason: lexical_alternative
  - marker: b
    text: या “मेरे सतानेवाले।”
    reason: lexical_alternative
  - marker: c
    text: या “क्योंकि वे समझ नहीं पाए” अथवा “क्योंकि उन्होंने विवेक से काम नहीं लिया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  choice: परन्तु यहवे
  rationale: संदर्भ में ו संवाद का विरोधात्मक मोड़ दिखाता है; इसलिए ‘परन्तु’। יהוה को उसके व्यक्तिगत वाचा-नाम ‘यहवे’ के रूप में रखा गया है।
- source_word: אוֹתִי
  choice: मेरे साथ हैं
  rationale: शाब्दिक रूप से कर्मसूचक चिह्न और सर्वनाम है, पर इस क्रियारहित उपवाक्य में आशय यहवे की सहायक उपस्थिति है; हिन्दी में ‘मेरे साथ हैं’ स्वाभाविक है।
- source_word: כְגִבּוֹר עָרִיץ
  choice: एक प्रचण्ड योद्धा के समान
  rationale: גִבּוֹר बलवान योद्धा या वीर है और עָרִיץ यहाँ भय जगानेवाली, दुर्जेय शक्ति जोड़ता है। ‘प्रचण्ड योद्धा’ दोनों तत्वों को संक्षेप में व्यक्त करता है।
- source_word: עַל כֵּן
  choice: इसलिए
  rationale: यह कारण से निकलनेवाले परिणाम को प्रस्तुत करनेवाला स्वाभाविक हिन्दी संयोजक है।
- source_word: רֹדְפַי
  choice: मेरा पीछा करनेवाले
  rationale: רדף का मूल चित्र पीछा करने का है और संदर्भ में उत्पीड़न भी निहित है। मुख्य पाठ मूल रूपक को रखता है।
- source_word: יִכָּשְׁלוּ
  choice: ठोकर खाएँगे
  rationale: נפעל रूप लड़खड़ाने या ठोकर खाने का रूपक रखता है; अनुवाद पराजय की सीमा को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: וְלֹא יֻכָלוּ
  choice: और मुझ पर प्रबल न होंगे
  rationale: יכל का मूल अर्थ ‘सक्षम होना’ है; विरोधियों के प्रसंग में इसका आशय सफल या विजयी न हो पाना है। ‘मुझ पर’ हिन्दी में अपेक्षित संबंध स्पष्ट करता है।
- source_word: בֹּשׁוּ מְאֹד
  choice: वे अत्यन्त लज्जित होंगे
  rationale: בוש लज्जित होने या लज्जा उठाने और מְאֹד तीव्रता को व्यक्त करता है।
- source_word: כִּי לֹא הִשְׂכִּילוּ
  choice: क्योंकि उन्होंने समझ-बूझ से काम नहीं लिया
  rationale: שׂכל का हिफ़ील रूप समझने और विवेकपूर्ण ढंग से काम करने, दोनों अर्थ दे सकता है। यह वाक्यांश उस अर्थ-क्षेत्र को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: כְּלִמַּת עוֹלָם
  choice: उनका सदा का अपमान
  rationale: כְּלִמָּה अपमान या बदनामी है और עוֹלָם दीर्घस्थायी अथवा चिरस्थायी अवधि बताता है।
- source_word: לֹא תִשָּׁכֵחַ
  choice: कभी भुलाया नहीं जाएगा
  rationale: स्त्रीलिंग एकवचन क्रिया पिछले संज्ञा ‘अपमान’ से जुड़ती है। ‘कभी’ हिन्दी में नकार के स्थायी बल को सहज रूप से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चार-अक्षरीय व्यक्तिगत नाम प्रत्यक्ष है। ‘यहवे’ उसे उपाधि में बदले बिना आधुनिक हिन्दी लिप्यंतरण में सुरक्षित रखता है।
- issue: כִּי לֹא הִשְׂכִּילוּ में समझ और आचरण का संबंध
  choice: समझ-बूझ से काम नहीं लिया
  alternative: वे समझ नहीं पाए
  rationale: हिफ़ील रूप केवल बौद्धिक नासमझी नहीं, बल्कि अंतर्दृष्टि के साथ व्यवहार करने की विफलता भी बता सकता है। चुना हुआ पाठ दोनों पहलुओं के बीच की वास्तविक अर्थगत व्यापकता रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय, स्पष्ट और सामान्य पाठक के लिए सुबोध शैली। ‘परन्तु’, ‘अत्यन्त’ और ‘प्रबल’ जैसे साहित्यिक किन्तु प्रचलित शब्द भविष्यद्वाणी के गंभीर स्वर को बनाए रखते हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
