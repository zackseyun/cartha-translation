id: JER.20.17
reference: Jeremiah 20:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אֲשֶׁ֥ר לֹא מוֹתְתַ֖/נִי מֵ/רָ֑חֶם וַ/תְּהִי לִ֤/י אִמִּ/י֙ קִבְרִ֔/י וְ/רַחְמָ֖/הֿ הֲרַ֥ת עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/017.yaml
  text: because he did not kill me from the womb[a], so that my mother would have been my grave[c][b], and her womb forever pregnant.
translation:
  language: hi
  text: क्योंकि उसने मुझे गर्भ में ही मार नहीं डाला[a], ताकि मेरी माँ मेरी कब्र होती[b], और उसकी कोख सदा गर्भवती रहती[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “गर्भ से मुझे मार नहीं डाला।” प्रसंग में आशय गर्भ में ही मार डालने से है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में सघन रूप से “मेरी माँ—मेरी कब्र” है; आशय यह है कि यदि मैं गर्भ में मर जाता, तो मेरी माँ मानो मेरी कब्र होती।
    reason: cultural_note
  - marker: c
    text: या, “उसकी कोख सदा भरी रहती।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: क्योंकि
  rationale: यह संबंधवाचक अव्यय संदर्भ में उस मनुष्य को कोसने का कारण बताता है; इसलिए हिन्दी में कारणसूचक रूप स्वाभाविक है।
- source_word: מוֹתְתַנִי
  choice: मुझे ... मार नहीं डाला
  rationale: यह क्रिया यहाँ सकर्मक, कारक अर्थ में है। ‘मार नहीं डाला’ उसके सीधे और तीखे भाव को बनाए रखता है।
- source_word: מֵרָחֶם
  choice: गर्भ से ही
  rationale: מִן के ‘से’ अर्थ को सुरक्षित रखते हुए ‘ही’ हिन्दी में जन्म से पहले मर जाने की अभिप्रेत स्थिति को स्पष्ट और स्वाभाविक बनाता है।
- source_word: אִמִּי קִבְרִי
  choice: मेरी माँ ही मेरी कब्र होती
  rationale: मूल में ‘मेरी माँ’ और ‘मेरी कब्र’ का सघन रूपक है। हिन्दी में इसे सीधे रखकर उसकी चौंकाने वाली शक्ति सुरक्षित रहती है।
- source_word: וְרַחְמָהּ הֲרַת עוֹלָם
  choice: और उसकी कोख सदा भरी रहती
  rationale: ‘कोख’ शारीरिक और काव्यात्मक दोनों स्तरों पर उपयुक्त है। ‘सदा भरी रहती’ अनंत गर्भावस्था के अस्वाभाविक, विलापपूर्ण बिंब को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: प्रतितथ्यात्मक विलाप की वाक्यरचना
  choice: ‘जिससे मेरी माँ ही मेरी कब्र होती’—अपूरी रही इच्छा के रूप में
  alternative: ‘और मेरी माँ मेरी कब्र बन गई’—साधारण परिणाम या भूतकाल के रूप में
  rationale: आसपास के पद जन्म न लेने और गर्भ में मर जाने की कामना व्यक्त करते हैं। इसलिए प्रतितथ्यात्मक रूप प्रसंग के अनुकूल है, पर इसे किसी अतिरिक्त धर्मवैज्ञानिक निष्कर्ष में नहीं बदला गया है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘कोख’ सामान्य हिन्दी में समझ में आने वाला शब्द है और विलाप के काव्यात्मक स्वर के अनुकूल है; ‘कब्र’ मूल रूपक की कठोरता को सुरक्षित रखता है।
