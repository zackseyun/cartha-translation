base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/018.yaml
  text: Why did I come out from the womb to see trouble and sorrow[b][a], and for my days to end in shame?
translation:
  language: hi
  text: मैं गर्भ से निकला ही क्यों—कष्ट और शोक[a] देखने के लिए, और मेरे दिन लज्जा में बीतें?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कठिन परिश्रम और दुःख।”
    reason: lexical_alternative
  - marker: b
    text: या, “और मेरे दिन लज्जा में चुक जाएँ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה זֶּה
  choice: मैं ... निकला ही क्यों
  rationale: לָמָּה प्रश्न प्रस्तुत करता है और זֶּה उसमें बल जोड़ता है। हिन्दी में ‘ही क्यों’ उस तीखे आलंकारिक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מֵרֶחֶם
  choice: गर्भ से
  rationale: मूल पाठ में केवल ‘गर्भ से’ है, ‘माँ के गर्भ से’ स्पष्ट रूप से नहीं; संक्षिप्त रूप हिन्दी में भी सहज और स्रोत के निकट है।
- source_word: יָצָאתִי
  choice: निकला
  rationale: क्रिया का ठोस अर्थ ‘बाहर निकलना’ है। गर्भ के संदर्भ में जन्म निहित है, पर ‘निकला’ मूल बिंब को बनाए रखता है।
- source_word: לִרְאוֹת
  choice: देखने के लिए
  rationale: शाब्दिक अर्थ ‘देखना’ है और प्रसंग में अनुभव करना निहित हो सकता है। ‘देखना’ इस अर्थ-विस्तार को खुला रखता है।
- source_word: עָמָל
  choice: कष्ट
  rationale: यह शब्द कष्ट, कठिन परिश्रम या विपत्ति को सूचित कर सकता है। विलाप के प्रसंग में ‘कष्ट’ व्यापक और स्वाभाविक है; वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: יָגוֹן
  choice: शोक
  rationale: יָגוֹן दुःख या शोक को दर्शाता है। ‘शोक’ भावात्मक पीड़ा को स्पष्ट करता है और ‘कष्ट’ के साथ स्वाभाविक युग्म बनाता है।
- source_word: וַיִּכְלוּ
  choice: बीत जाएँ
  rationale: क्रिया का अर्थ समाप्त हो जाना, चुक जाना या खप जाना हो सकता है। ‘मेरे दिन ... बीत जाएँ’ हिन्दी में स्वाभाविक है, जबकि ‘लज्जा में चुक जाएँ’ वाला अधिक तीव्र विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: בְּבֹשֶׁת
  choice: लज्जा में
  rationale: בֹּשֶׁת का अर्थ लज्जा या अपमान है। ‘लज्जा में’ मूल पूर्वसर्गीय अभिव्यक्ति के निकट और काव्यात्मक है।
- source_word: יָמָי
  choice: मेरे दिन
  rationale: मूल में ‘मेरे दिन’ ही है, जो जीवनकाल का काव्यात्मक संकेत है। इसे ‘मेरा जीवन’ बनाकर स्पष्ट नहीं किया गया ताकि मूल बिंब बना रहे।
