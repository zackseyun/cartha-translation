  text: וַ/יַּכֶּ֣ה פַשְׁח֔וּר אֵ֖ת יִרְמְיָ֣הוּ הַ/נָּבִ֑יא וַ/יִּתֵּ֨ן אֹת֜/וֹ עַל הַ/מַּהְפֶּ֗כֶת אֲשֶׁ֨ר בְּ/שַׁ֤עַר בִּנְיָמִן֙ הָֽ/עֶלְי֔וֹן אֲשֶׁ֖ר בְּ/בֵ֥ית יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/002.yaml
  text: Then Pashhur struck Jeremiah the prophet and put him in the stocks that were at the upper Benjamin Gate[a], which was in the house of Yahweh.
translation:
  language: hi
  text: तब पशहूर ने यिर्मयाह नबी को मारा और उसे उस दंडात्मक बंधन-यंत्र[a] में डाल दिया, जो याहवे के भवन में ऊपरी बिन्यामीन फाटक के पास रखा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः “काठ,” अथवा शरीर को पीड़ादायक ढंग से जकड़ने या मोड़ने वाला कोई अन्य उपकरण; מַהְפֶּכֶת की ठीक बनावट निश्चित नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֶּה
  choice: मारा
  rationale: נכה का सामान्य अर्थ प्रहार करना या मारना है। ‘मारा’ आधुनिक हिन्दी में स्वाभाविक है और यह अनावश्यक रूप से तय नहीं करता कि एक ही प्रहार हुआ या पिटाई की गई।
- source_word: פַשְׁחוּר
  choice: पशहूर
  rationale: इब्रानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण।
- source_word: יִרְמְיָהוּ הַנָּבִיא
  choice: यिर्मयाह नबी
  rationale: नाम के साथ उपस्थित पदवी को स्पष्ट रूप से बनाए रखा गया है; यह उसके साथ किए गए दुर्व्यवहार की गंभीरता को भी उभारती है।
- source_word: וַיִּתֵּן אֹתוֹ עַל
  choice: उसे ... में डाल दिया
  rationale: शाब्दिक ‘उस पर रखा’ यहाँ दंडात्मक बंधन-यंत्र में बंद करने का मुहावरा है; हिन्दी में ‘में डाल दिया’ संदर्भानुकूल और स्वाभाविक है।
- source_word: הַמַּהְפֶּכֶת
  choice: यातना देनेवाला बंधन-यंत्र
  rationale: शब्द किसी ऐसे दंडात्मक उपकरण को सूचित करता है जिसमें शरीर को जकड़ा या अस्वाभाविक ढंग से मोड़ा जाता था, पर उसकी ठीक बनावट अनिश्चित है। इसलिए किसी एक ऐतिहासिक उपकरण का नाम देकर अर्थ को संकीर्ण नहीं किया गया।
- source_word: שַׁעַר בִּנְיָמִן הָעֶלְיוֹן
  choice: बिन्यामीन का ऊपरी फाटक
  rationale: स्थान-नाम और विशेषण दोनों को सीधे और स्वाभाविक हिन्दी में रखा गया है।
- source_word: בְּבֵית יְהוָה
  choice: यहोवा के भवन में
  rationale: בַּיִת का मूल रूपक ‘भवन/घर’ बनाए रखा गया है; यहाँ संदर्भ से यह मंदिर-परिसर को सूचित करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित प्रत्यक्ष नाम-रूप ‘यहोवा’ व्यक्तिगत ईश्वरीय नाम को शीर्षक ‘प्रभु’ से अलग बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चतुराक्षरी व्यक्तिगत नाम सीधे आया है। हिन्दी पाठकों के लिए व्यापक रूप से पहचाना जानेवाला ‘यहोवा’ चुना गया, जबकि इसे ‘प्रभु’ जैसे पदनाम से नहीं बदला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण और सामान्य पाठक के लिए स्पष्ट। अस्पष्ट दंड-उपकरण को अत्यधिक विशिष्ट नाम देने के बजाय मुख्य पाठ में वर्णनात्मक पद और पादटिप्पणी में विकल्प रखा गया है।
