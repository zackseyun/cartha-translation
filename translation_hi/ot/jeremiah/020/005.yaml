  edition: WLC
  text: וְ/נָתַתִּ֗י אֶת כָּל חֹ֨סֶן֙ הָ/עִ֣יר הַ/זֹּ֔את וְ/אֶת כָּל יְגִיעָ֖/הּ וְ/אֶת כָּל יְקָרָ֑/הּ וְ/אֵ֨ת כָּל אוֹצְר֜וֹת מַלְכֵ֣י יְהוּדָ֗ה אֶתֵּן֙ בְּ/יַ֣ד אֹֽיְבֵי/הֶ֔ם וּ/בְזָזוּ/ם֙ וּ/לְקָח֔וּ/ם וֶ/הֱבִיא֖וּ/ם בָּבֶֽלָ/ה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/005.yaml
  text: And I will give all the wealth of this city[a], all its gains, all its precious things, and all the treasures of the kings of Judah into the hand of their enemies. They will plunder them, take them[c][b], and bring them to Babylon.
translation:
  language: hi
  text: और मैं इस नगर की सारी धन-संपत्ति, उसकी सारी कमाई[a], उसकी सारी बहुमूल्य वस्तुएँ[b], और यहूदा के राजाओं के सारे खजाने उनके शत्रुओं के हाथ में सौंप दूँगा[c]। वे उन्हें लूटेंगे, ले लेंगे और बाबेल ले जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसकी सारी मेहनत” अथवा “उसकी सारी उपज।” इब्रानी शब्द मेहनत स्वयं या उससे प्राप्त फल, दोनों को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “उसकी सारी मूल्यवान संपत्ति।”
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से “उनके शत्रुओं के हाथ में दूँगा”; यह किसी के अधिकार या नियंत्रण में सौंपने का इब्रानी मुहावरा है।
    reason: cultural_note
lexical_decisions:
- source_word: חֹסֶן
  choice: धन-संपत्ति
  rationale: लूटे और बाबेल ले जाए जाने वाले भौतिक संसाधनों के संदर्भ में यह अर्थ स्वाभाविक है; यहाँ अमूर्त ‘सामर्थ्य’ अपेक्षित नहीं है।
- source_word: יְגִיעָהּ
  choice: उसकी मेहनत की सारी कमाई
  rationale: शब्द मेहनत और उससे प्राप्त उपज या कमाई दोनों का बोध करा सकता है। यह अनुवाद दोनों पक्षों को जोड़ते हुए लूटी जा सकने वाली संचित उपलब्धि को व्यक्त करता है।
- source_word: יְקָרָהּ
  choice: उसकी सारी बहुमूल्य वस्तुएँ
  rationale: संपत्ति और खजानों की सूची में ठोस, मूल्यवान वस्तुओं का अर्थ सबसे उपयुक्त है, जबकि ‘वैभव’ या ‘सम्मान’ यहाँ कम संभावित हैं।
- source_word: אוֹצְרוֹת מַלְכֵי יְהוּדָה
  choice: यहूदा के राजाओं के सारे खजाने
  rationale: संदर्भ में भंडारगृहों की अपेक्षा उनमें रखी लूटी जा सकने वाली संपदा प्रमुख है।
- source_word: בְּיַד
  choice: के हाथ में कर दूँगा
  rationale: हिब्रू मुहावरे को स्वाभाविक हिन्दी रूप में रखा गया है; इसका आशय किसी के अधिकार या नियंत्रण में सौंपना है।
- source_word: אֹיְבֵיהֶם
  choice: उनके शत्रुओं
  rationale: बहुवचन प्रत्यय को बनाए रखा गया है। निकटतम व्याकरणिक पूर्वपद ‘यहूदा के राजा’ हैं, यद्यपि ये शत्रु नगर के भी शत्रु हैं।
- source_word: וּבְזָזוּם
  choice: वे उन्हें लूटेंगे
  rationale: בזז युद्धकालीन लूट या माल छीन लेने को व्यक्त करता है; ‘लूटेंगे’ सरल और सटीक हिन्दी है।
- source_word: וּלְקָחוּם
  choice: अपने कब्जे में लेंगे
  rationale: ‘ले लेंगे’ की संभावित अस्पष्टता और अगले वाक्यांश ‘बाबेल ले जाएँगे’ के साथ पुनरुक्ति से बचते हुए, वस्तुओं को अधिकार में लेने का क्रम व्यक्त किया गया है।
- source_word: וֶהֱבִיאוּם בָּבֶלָה
  choice: बाबेल ले जाएँगे
  rationale: हिब्रू क्रिया और दिशासूचक रूप का स्वाभाविक हिन्दी अनुवाद है।
theological_decisions:
- issue: אֹיְבֵיהֶם में बहुवचन प्रत्यय का पूर्वपद
  choice: ‘उनके शत्रुओं’ कहकर सर्वनाम की अनिश्चितता बनाए रखी गई
  alternative: ‘इस नगर के शत्रुओं’ या ‘यहूदा के राजाओं के शत्रुओं’
  rationale: निकटतम पूर्वपद यहूदा के राजा हैं, पर संदर्भ में शत्रु नगर के भी हैं। मूल पाठ जितना स्पष्ट करता है उससे अधिक निश्चित करना उचित नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज शैली अपनाई गई है। ‘धन-संपत्ति’, ‘बहुमूल्य वस्तुएँ’ और ‘खजाने’ ठोस लूटी जा सकने वाली संपदा का क्रम बनाए रखते हैं। ‘बाबेल’ बाइबिलीय स्थान-नाम के प्रचलित हिन्दी रूप के अनुसार है।
