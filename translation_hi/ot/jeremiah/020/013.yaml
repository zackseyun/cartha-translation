reference: Jeremiah 20:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: שִׁ֚ירוּ לַֽ/יהוָ֔ה הַֽלְל֖וּ אֶת יְהוָ֑ה כִּ֥י הִצִּ֛יל אֶת נֶ֥פֶשׁ אֶבְי֖וֹן מִ/יַּ֥ד מְרֵעִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/013.yaml
  text: Sing to Yahweh[a]; praise Yahweh[c][b], for he has delivered the life of the poor from the hand of evildoers.
translation:
  language: hi
  text: याहवे[a] के लिए गाओ; याहवे की स्तुति करो, क्योंकि उसने बुराई करने वालों के हाथ[c] से निर्धन के प्राण[b] बचाए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में יהוה, परमेश्वर का व्यक्तिगत नाम; परंपरागत अनुवादों में प्रायः ‘यहोवा’ या ‘प्रभु’।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक रूप से ‘निर्धन का नेफेश’; यहाँ अर्थ उसके प्राण, जीवन या स्वयं उस व्यक्ति से है।
    reason: lexical_alternative
  - marker: c
    text: ‘हाथ से’ का अर्थ यहाँ ‘शक्ति या अधिकार से’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁירוּ
  choice: गाओ
  rationale: שׁיר का बहुवचन आज्ञार्थक रूप है। सरल ‘गाओ’ अगले समानांतर आदेश ‘स्तुति करो’ के साथ स्वाभाविक है और अनावश्यक दोहराव से बचता है।
- source_word: לַיהוָה
  choice: याहवे के लिए
  rationale: ל उपसर्ग गीत के लक्ष्य या संबोधन को दर्शाता है; आधुनिक हिन्दी में ‘के लिए गाओ’ इस दिशा को सहज रूप से व्यक्त करता है।
- source_word: הַלְלוּ
  choice: स्तुति करो
  rationale: उपासना-संदर्भ में הלל के पिएल बहुवचन आज्ञार्थक का स्वाभाविक और गरिमापूर्ण हिन्दी रूप।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह दोनों आज्ञाओं का कारण प्रस्तुत करता है; ‘क्योंकि’ कारण-संबंध को स्पष्ट रखता है।
- source_word: הִצִּיל
  choice: बचाए हैं
  rationale: נצל के हिफ़ील सिद्ध रूप में पूरी की गई बचाने की क्रिया है जिसका वर्तमान महत्व है। ‘प्राण बचाए हैं’ हिन्दी में स्वाभाविक है।
- source_word: נֶפֶשׁ
  choice: प्राण
  rationale: यहाँ शब्द संकट में पड़े व्यक्ति के जीवन या स्वयं व्यक्ति को सूचित करता है, किसी तकनीकी आत्मा-संबंधी परिभाषा को नहीं। ‘प्राण बचाना’ इस प्रसंग में स्वाभाविक हिन्दी मुहावरा है।
- source_word: אֶבְיוֹן
  choice: निर्धन
  rationale: गरीब या अभावग्रस्त व्यक्ति के लिए स्पष्ट, संक्षिप्त और वर्तमान मानक हिन्दी शब्द।
- source_word: מִיַּד
  choice: हाथ से
  rationale: मूल का सजीव रूपक बनाए रखता है; यहाँ ‘हाथ’ अधिकार या शक्ति को भी सूचित करता है।
- source_word: מְרֵעִים
  choice: बुराई करनेवालों
  rationale: רעע के कर्तृवाचक रूप का पारदर्शी अनुवाद, जो केवल पहचान नहीं बल्कि लगातार बुरा करने की क्रिया पर बल देता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ वाचा-संबंधी व्यक्तिगत नाम को सीधे दो बार रखता है। उसका लिप्यंतरण नाम को किसी उपाधि में बदले बिना सुरक्षित रखता है।
- issue: उद्धार के प्रसंग में נֶפֶשׁ का अर्थ
  choice: प्राण, अर्थात संकट में पड़ा जीवन
  alternative: आत्मा; व्यक्ति
  rationale: शत्रुओं के हाथ से बचाए जाने के प्रसंग में आशय व्यक्ति के जीवन या स्वयं व्यक्ति से है। ‘प्राण’ मूल की व्यापकता को कुछ हद तक बनाए रखते हुए हिन्दी में जीवन बचाने का स्वाभाविक बोध देता है; इससे शरीर से अलग आत्मा के बारे में कोई अनावश्यक सिद्धान्त नहीं जोड़ा जाता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। दो समानांतर बहुवचन आज्ञाओं की काव्यात्मक संक्षिप्तता बनाए रखी गई है। ‘हाथ’ का मूल रूपक सुरक्षित है, जबकि पादटिप्पणी उसका अभिप्राय स्पष्ट करती है।
