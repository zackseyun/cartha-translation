id: JER.5.9
reference: Jeremiah 5:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הַֽ/עַל אֵ֥לֶּה לוֹא אֶפְקֹ֖ד נְאֻם יְהֹוָ֑ה וְ/אִם֙ בְּ/ג֣וֹי אֲשֶׁר כָּ/זֶ֔ה לֹ֥א תִתְנַקֵּ֖ם נַפְשִֽׁ/י־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/009.yaml
  text: Shall I not punish for these things? declares Yahweh[a]. And on a nation such as this[b], shall I not avenge myself?
translation:
  language: hi
  text: “क्या मैं इन बातों के कारण दण्ड न दूँ?” यहोवा की यह वाणी है। “और क्या ऐसे राष्ट्र से मेरा प्राण बदला न ले?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप के निकट: “और यदि ऐसे राष्ट्र से मेरा प्राण बदला न ले?” यहाँ “और यदि” दूसरे आलंकारिक प्रश्न का परिचय देता है। “मेरा प्राण” यहोवा के अपने ही व्यक्तित्व को सजीव और अत्यन्त व्यक्तिगत ढंग से व्यक्त करने वाली इब्रानी शैली है।'
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: הַעַל אֵלֶּה
  choice: क्या ... इन बातों के कारण
  rationale: प्रश्नवाचक הֲ और עַל का मेल कारणसूचक आलंकारिक प्रश्न बनाता है; ‘इन बातों के कारण’ पूर्ववर्णित अपराधों की ओर स्पष्ट संकेत करता है।
- source_word: אֶפְקֹד
  choice: दण्ड दूँ
  rationale: न्याय-संदर्भ में פקד का अर्थ दण्डात्मक रीति से लेखा लेना है; ‘दण्ड दूँ’ आधुनिक हिन्दी में सीधा और स्पष्ट है।
- source_word: נְאֻם יְהוָה
  choice: यहोवा की यह वाणी है
  rationale: यह मानक भविष्यद्वाणी-सूत्र की गरिमा बनाए रखता है और יהוה को परियोजना के अनुसार व्यक्तिगत नाम ‘यहोवा’ से प्रस्तुत करता है।
- source_word: וְאִם
  choice: और क्या
  rationale: शाब्दिक ‘और यदि’ यहाँ वास्तविक शर्त के बजाय दूसरे पुष्टिकारक आलंकारिक प्रश्न का परिचय देता है; ‘और क्या’ हिन्दी में उसका प्रश्नात्मक बल स्वाभाविक रूप से रखता है।
- source_word: בְּגוֹי אֲשֶׁר כָּזֶה
  choice: ऐसे राष्ट्र से
  rationale: נקם के साथ ב उस पक्ष को चिह्नित करता है जिससे या जिस पर बदला लिया जाता है; ‘ऐसे राष्ट्र से’ हिन्दी की स्वाभाविक अभिव्यक्ति है और तुलनात्मक संकेत बचाए रखती है।
- source_word: תִתְנַקֵּם נַפְשִׁי
  choice: मेरा प्राण बदला न ले
  rationale: हित्पएल क्रिया का आत्मसंबंधी/मध्य भाव और נַפְשִׁי की सजीव आत्म-संदर्भात्मक छवि दोनों बनाए गए हैं; हिन्दी में ‘प्राण’ यहाँ सम्पूर्ण व्यक्तित्व का काव्यात्मक संकेत है।
theological_decisions:
- issue: नַפְשִׁי में परमेश्वर के लिए मानव-सदृश आत्म-संदर्भ
  choice: मुख्य पाठ में ‘मेरा प्राण’ बनाए रखना
  alternative: क्या मैं स्वयं बदला न लूँ?
  rationale: इब्रानी की तीव्र, व्यक्तिगत छवि और उससे जुड़ा धर्मवैचारिक तनाव व्याख्यात्मक रूप से समतल नहीं किया गया; पादटिप्पणी स्पष्ट करती है कि यह यहोवा के अपने व्यक्तित्व का संकेत है।
- issue: יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: व्यक्तिगत दिव्य नाम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘मेरा प्राण’ सामान्य गद्य से अधिक काव्यात्मक है, पर मूल इब्रानी की जानबूझकर प्रयुक्त सजीव छवि को सुरक्षित रखने के लिए रखा गया है।
