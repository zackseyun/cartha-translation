source:
  edition: WLC
  text: וְ/לֹֽא אָמְר֣וּ בִ/לְבָבָ֗/ם נִ֤ירָא נָא֙ אֶת יְהוָ֣ה אֱלֹהֵ֔י/נוּ הַ/נֹּתֵ֗ן גֶּ֛שֶׁם ו/ירה וּ/מַלְק֖וֹשׁ בְּ/עִתּ֑/וֹ שְׁבֻע֛וֹת חֻקּ֥וֹת קָצִ֖יר יִשְׁמָר לָֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/024.yaml
  text: They did not say in their heart[a], ‘Let us now fear Yahweh our God, who gives rain in its season, both the early rain and the latter rain, who keeps for us the appointed weeks of the harvest.’
translation:
  language: hi
  text: उन्होंने अपने मन में नहीं कहा, “अब हम याहवे, अपने परमेश्वर का भय मानें, जो ठीक समय पर वर्षा देता है—आरम्भ की और बाद की वर्षा[a]—और हमारे लिए कटनी के नियत सप्ताह सुरक्षित रखता है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् “शरद ऋतु की वर्षा और वसंत ऋतु की वर्षा।”
    reason: आरम्भ की और बाद की वर्षा प्राचीन इस्राएल के कृषि-चक्र की क्रमशः आरम्भिक और बाद की मौसमी वर्षाएँ हैं।
lexical_decisions:
- source_word: וְלֹא אָמְרוּ בִלְבָבָם
  choice: उन्होंने अपने मन में नहीं कहा
  rationale: बहुवचन कर्ता के साथ इब्रानी का एकवचन ‘हृदय’ सामूहिक अथवा प्रत्येक व्यक्ति पर लागू होने वाला प्रयोग है। ‘अपने मन में’ इस मुहावरे को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: נִירָא נָא
  choice: आओ, अब हम ... का भय मानें
  rationale: बहुवचन कोहोर्टेटिव और נָא मिलकर आग्रहपूर्ण आत्म-प्रेरणा व्यक्त करते हैं; ‘आओ, अब हम’ उसका स्वाभाविक हिन्दी रूप है।
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: अपने परमेश्वर याहवे
  rationale: व्यक्तिगत ईश्वरीय नाम को उपाधि में बदलने के बजाय ‘याहवे’ के रूप में रखा गया है; हिन्दी वाक्य-विन्यास के लिए संबंधसूचक ‘अपने’ जोड़ा गया है।
- source_word: הַנֹּתֵן גֶּשֶׁם ... בְּעִתּוֹ
  choice: जो ठीक समय पर वर्षा देता है
  rationale: कृदंत परमेश्वर की निरंतर क्रिया बताता है। בְּעִתּוֹ वर्षा के ऋतु-संगत या नियत समय को दर्शाता है; ‘ठीक समय पर’ स्पष्ट और सहज है।
- source_word: יוֹרֶה וּמַלְקוֹשׁ
  choice: पहली और पिछली वर्षा
  rationale: दोनों कृषि-ऋतु संबंधी पदों की परस्पर जोड़ी और सापेक्ष क्रम को संरक्षित किया गया है; उनके मौसमी अर्थ को पादटिप्पणी में दिया गया है।
- source_word: שְׁבֻעוֹת חֻקּוֹת קָצִיר
  choice: कटनी के नियत सप्ताहों
  rationale: חֻקּוֹת इन सप्ताहों के ठहराए या निश्चित होने का भाव देता है। ‘कटनी के नियत सप्ताह’ सरल हिन्दी में कृषि-चक्र की निर्धारित अवधि व्यक्त करता है।
- source_word: יִשְׁמָר לָנוּ
  choice: हमारे लिए सुरक्षित रखता है
  rationale: שמר यहाँ बनाए रखने या अक्षुण्ण रखने का भाव देता है। वर्तमानकालीन हिन्दी मूल के अपूर्ण क्रियारूप की वर्णनात्मक शक्ति को व्यक्त करती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उस नाम को नाम के रूप में बनाए रखता है, उसे उपाधि में नहीं बदलता।
- issue: ‘भय मानना’ का अर्थ
  choice: का भय मानें
  alternative: का आदर करें
  rationale: ירא में भय और श्रद्धापूर्ण अधीनता दोनों का तनाव है। केवल ‘आदर’ कहना भय के वास्तविक पक्ष को कम कर देता; इसलिए अधिक सीधा और पारंपरिक रूप रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य में मूल की आरोपात्मक लय, आत्म-संबोधन और कृषि-ऋतु की छवि सुरक्षित हैं।
