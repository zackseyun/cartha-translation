source:
  edition: WLC
  text: עַל כֵּן֩ הִכָּ֨/ם אַרְיֵ֜ה מִ/יַּ֗עַר זְאֵ֤ב עֲרָבוֹת֙ יְשָׁדְדֵ֔/ם נָמֵ֤ר שֹׁקֵד֙ עַל עָ֣רֵי/הֶ֔ם כָּל הַ/יּוֹצֵ֥א מֵ/הֵ֖נָּה יִטָּרֵ֑ף כִּ֤י רַבּוּ֙ פִּשְׁעֵי/הֶ֔ם עָצְמ֖וּ משבותי/הם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/006.yaml
  text: Therefore a lion from the forest strikes them down[a]; a wolf of the deserts devastates them; a leopard keeps watch over their cities. Everyone who goes out from them will be torn apart, because their transgressions are many[b]; their apostasies have grown strong.
translation:
  language: hi
  text: इस कारण वन का सिंह उन्हें मार गिराता है; निर्जन मैदानों का भेड़िया[a] उन्हें उजाड़ देता है; तेंदुआ उनके नगरों पर नज़र लगाए रहता है। उन नगरों से बाहर निकलने वाला हर व्यक्ति फाड़ डाला जाएगा, क्योंकि उनके अपराध बहुत हो गए हैं और उनके धर्मत्याग[b] प्रबल हो गए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “साँझ का भेड़िया।” इब्रानी पद को “निर्जन अथवा मरु-मैदानों का भेड़िया” और “साँझ का भेड़िया,” दोनों अर्थों में समझा गया है; यहाँ पहला अर्थ लिया गया है।
    reason: lexical_alternative
  - marker: b
    text: या, “उनका पीछे फिरना” अथवा “उनका भटक जाना।” इब्रानी शब्द बार-बार निष्ठा से विमुख होने का भाव रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכָּם
  choice: उन्हें मार गिराता है
  rationale: נכה के हिंसक प्रहार को व्यक्त करता है। वर्तमानकालीन रूप न्याय के सजीव भविष्यसूचक चित्र और साथ आने वाले क्रियारूपों के साथ स्वाभाविक है।
- source_word: אַרְיֵה מִיַּעַר
  choice: वन का सिंह
  rationale: पशु और उसके आने के स्थान, दोनों के ठोस बिंब को संक्षिप्त और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: זְאֵב עֲרָבוֹת
  choice: निर्जन मैदानों का भेड़िया
  rationale: עֲרָבוֹת को शुष्क खुले मैदानों अथवा मरु-मैदानों के अर्थ में लिया गया है। यह हिन्दी में केवल रेतीले मरुस्थल का अनावश्यक रूप से संकीर्ण बिंब नहीं बनाता; ‘साँझ का भेड़िया’ पाठ-सम्भावना पादटिप्पणी में रखी गई है।
- source_word: יְשָׁדְדֵם
  choice: उन्हें उजाड़ देता है
  rationale: שדד की हिंसक बरबादी और विध्वंस की शक्ति को सहज हिन्दी में व्यक्त करता है।
- source_word: נָמֵר
  choice: तेंदुआ
  rationale: इस पशु के लिए आधुनिक हिन्दी का सामान्य और स्पष्ट शब्द है।
- source_word: שֹׁקֵד עַל
  choice: पर नज़र लगाए रहता है
  rationale: शत्रुतापूर्ण प्रसंग में लगातार जागरूक निगरानी का भाव रखता है, पर ‘घात लगाना’ जोड़कर अर्थ को आवश्यकता से अधिक निश्चित नहीं करता।
- source_word: כָּל הַיּוֹצֵא מֵהֵנָּה
  choice: उनमें से जो कोई बाहर निकलेगा
  rationale: כָּל और कृदंत की सार्वत्रिकता तथा नगरों से बाहर निकलने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יִטָּרֵף
  choice: फाड़ डाला जाएगा
  rationale: טרף के पशु द्वारा शिकार को फाड़े जाने के सजीव बिंब को बनाए रखता है।
- source_word: פִּשְׁעֵיהֶם
  choice: उनके अपराध
  rationale: פשע में निहित उल्लंघन और विद्रोह, दोनों को सामान्य पाठक के लिए समझने योग्य शब्द में व्यक्त करता है; अगला पद धार्मिक-वाचा संबंधी विमुखता को स्पष्ट करता है।
- source_word: רַבּוּ
  choice: बहुत हो गए हैं
  rationale: बहुलता तक बढ़ जाने के परिणामसूचक भाव को सहज रूप से व्यक्त करता है।
- source_word: משבותיהם
  choice: उनके धर्मत्याग
  rationale: प्रसंग में बार-बार वाचा की निष्ठा से फिर जाने की गंभीरता व्यक्त करता है। सम्भावित अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: עָצְמוּ
  choice: प्रबल हो गए हैं
  rationale: עצם के बलवान या तीव्र हो जाने के अर्थ को बनाए रखता है, केवल संख्या में वृद्धि तक सीमित नहीं करता।
theological_decisions:
- issue: משבותיהם में वाचा से विमुखता का अनुवाद
  choice: उनके धर्मत्याग
  alternative: उनका पीछे हटना / उनका फिर जाना
  rationale: मुख्य पाठ गंभीर और बार-बार होने वाली धार्मिक तथा नैतिक विमुखता को व्यक्त करता है। पादटिप्पणी मूल शब्द के ‘फिरने/पीछे हटने’ वाले रूपक को सुरक्षित रखती है और किसी विशिष्ट सम्प्रदायगत व्याख्या को नहीं जोड़ती।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सजीव न्याय-वर्णन। पशु-बिंब स्पष्ट रखे गए हैं; दुर्लभ या अत्यधिक संस्कृतनिष्ठ शब्दावली से बचते हुए ‘धर्मत्याग’ द्वारा वाचा से गंभीर विमुखता व्यक्त की गई है।
