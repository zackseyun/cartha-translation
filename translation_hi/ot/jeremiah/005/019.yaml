  edition: WLC
  text: וְ/הָיָה֙ כִּ֣י תֹאמְר֔וּ תַּ֣חַת מֶ֗ה עָשָׂ֨ה יְהֹוָ֧ה אֱלֹהֵ֛י/נוּ לָ֖/נוּ אֶת כָּל אֵ֑לֶּה וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֗ם כַּ/אֲשֶׁ֨ר עֲזַבְתֶּ֤ם אוֹתִ/י֙ וַ/תַּעַבְד֞וּ אֱלֹהֵ֤י נֵכָר֙ בְּ/אַרְצְ/כֶ֔ם כֵּ֚ן תַּעַבְד֣וּ זָרִ֔ים בְּ/אֶ֖רֶץ לֹ֥א לָ/כֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/019.yaml
  text: And when you say[a], ‘Why has Yahweh our God done all these things to us?’ then you shall say to them, ‘Just as you have forsaken me and served foreign gods in your land, so you shall serve foreigners in a land not yours.’
translation:
  language: hi
  text: और जब तुम कहोगे, ‘याहवे, हमारे परमेश्वर ने हमारे साथ ये सब क्यों किया?’ तब तुम उनसे कहना, ‘जैसे तुमने मुझे छोड़ दिया और अपने देश में पराए देवताओं की सेवा की, वैसे ही तुम उस देश में विदेशियों[a] की सेवा करोगे जो तुम्हारा नहीं है।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पराए लोगों”; यहाँ इब्रानी זָרִים का अर्थ विदेशी मनुष्य हैं, जबकि इससे पहले “पराए देवताओं” का उल्लेख है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: और जब
  rationale: यह इब्रानी मुहावरा भविष्य की परिस्थिति का परिचय देता है; ‘और जब’ उसके कालगत भाव को स्वाभाविक हिन्दी में रखता है।
- source_word: תַּחַת מֶה
  choice: क्यों
  rationale: शाब्दिक रूप से ‘किस कारण से’ का भाव है; प्रश्न में ‘क्यों’ सबसे स्वाभाविक समतुल्य है।
- source_word: יְהֹוָה אֱלֹהֵינוּ
  choice: हमारे परमेश्वर याहवे
  rationale: व्यक्तिगत दिव्य नाम को ‘याहवे’ और אֱלֹהֵינוּ को संबंधसूचक ‘हमारे परमेश्वर’ के रूप में रखा गया है।
- source_word: עָשָׂה ... לָנוּ אֶת כָּל אֵלֶּה
  choice: हमारे साथ ये सब किया
  rationale: न्याय के अनेक कार्यों की ओर संकेत करने वाले बहुवचन को ‘ये सब’ से और प्रभावित समुदाय को ‘हमारे साथ’ से व्यक्त किया गया है।
- source_word: עֲזַבְתֶּם אוֹתִי
  choice: तुमने मुझे छोड़ दिया
  rationale: עזב यहाँ वाचा से विमुख होकर त्यागने का अर्थ देता है; ‘छोड़ दिया’ आधुनिक हिन्दी में स्पष्ट है और प्रसंग में उसकी गंभीरता बनी रहती है।
- source_word: וַתַּעַבְדוּ ... תַּעַבְדוּ
  choice: सेवा की ... सेवा करोगे
  rationale: दोनों स्थानों पर उसी धातु עבד का समान अनुवाद तुलना और विडंबना को सुरक्षित रखता है; पहले प्रयोग में देवताओं की उपासना-सहित सेवा और दूसरे में विदेशी लोगों के अधीन सेवा का भाव है।
- source_word: אֱלֹהֵי נֵכָר
  choice: पराए देवताओं
  rationale: यह पद अपने देश और वाचा के परमेश्वर से भिन्न, विदेशी देवताओं को दर्शाता है; ‘पराए देवता’ सहज और स्पष्ट है।
- source_word: זָרִים
  choice: विदेशियों
  rationale: यहाँ शब्द देवताओं के बजाय विदेशी लोगों को दर्शाता है और पहले आए ‘पराए देवताओं’ के साथ जानबूझकर शब्दगत समानता बनाता है।
- source_word: בְּאֶרֶץ לֹא לָכֶם
  choice: उस देश में ... जो तुम्हारा नहीं है
  rationale: इससे अपनी भूमि के विपरीत ऐसी विदेशी भूमि का भाव स्पष्ट रहता है जो इस समुदाय की नहीं होगी।
theological_decisions:
- issue: दिव्य नाम יְהוָה का रूप
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम सीधे आया है; ‘याहवे’ उसे उपाधि में बदले बिना आधुनिक हिन्दी लिप्यंतरण में प्रस्तुत करता है।
- issue: עבד की दोनों घटनाओं में अर्थ
  choice: दोनों बार ‘सेवा’
  alternative: पहली बार ‘उपासना’ और दूसरी बार ‘दासता’
  rationale: एक ही इब्रानी धातु की पुनरावृत्ति दंड की माप-समानता रचती है। ‘सेवा’ दोनों अर्थों को संभव रखकर इस साहित्यिक और धर्मवैचारिक तनाव को सुरक्षित रखती है।
- issue: एकवचन और बहुवचन संबोधन
  choice: ‘तुम कहोगे’ और ‘तू उनसे कहना’
  alternative: दोनों को बहुवचन या दोनों को एकवचन करना
  rationale: मूल में प्रश्न करने वाला समुदाय बहुवचन है, जबकि उत्तर देने की आज्ञा भविष्यद्वक्ता को पुल्लिंग एकवचन में है; हिन्दी में इस बदलाव को सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘जैसे ... वैसे ही’ से मूल की तुलना सुरक्षित है। समुदाय के लिए बहुवचन ‘तुम’ और भविष्यद्वक्ता के लिए एकवचन ‘तू’ जानबूझकर रखा गया है।
