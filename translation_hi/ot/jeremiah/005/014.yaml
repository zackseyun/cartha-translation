base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/014.yaml
  text: 'Therefore thus says Yahweh[a], the God of hosts: Because you speak this word, behold, I am making my words in your mouth fire, and this people wood[c][b], and it will consume them.'
translation:
  language: hi
  text: 'इसलिए सेनाओं का परमेश्वर याहवे यह कहता है:


    “तुम लोगों के यह वचन कहने के कारण,[a]


    देखो, मैं अपने वचनों को तेरे मुँह में आग, और इस प्रजा को लकड़ियाँ[c] बना रहा हूँ;[b]


    और वह आग उन्हें भस्म कर देगी।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पदबंध का अनुवाद “तुम लोगों ने यह वचन कहा है, इसलिए” भी हो सकता है। इब्रानी रूप वर्तमान या हाल में पूरी हुई क्रिया की ओर संकेत कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “मैं अपने वचन तेरे मुँह में आग के रूप में दे रहा हूँ।”
    reason: lexical_alternative
  - marker: c
    text: “लकड़ियाँ” का अर्थ यहाँ सामूहिक रूप से “लकड़ी” या “ईंधन की लकड़ी” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह निष्कर्षसूचक शब्द इस न्याय-वाणी को पिछले कथन से जोड़ता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: सेनाओं का परमेश्वर
  rationale: यह पृथ्वी की या स्वर्गीय सेनाओं में से किसी एक को अनावश्यक रूप से निश्चित किए बिना मूल पदबंध की व्यापक और सामरिक छवि बनाए रखता है।
- source_word: דַּבֶּרְכֶם אֶת־הַדָּבָר הַזֶּה
  choice: तुम लोगों के यह वचन कहने के कारण
  rationale: इब्रानी रचना को स्वाभाविक हिन्दी के क्रियावाचक पदबंध में व्यक्त किया गया है; ‘वचन’ आगे आने वाले ‘मेरे वचनों’ से शब्दगत संबंध बनाए रखता है।
- source_word: הִנְנִי
  choice: देख
  rationale: यह भविष्यद्वाणी की घोषणा में ध्यान खींचने वाली तात्कालिकता और गंभीरता को बनाए रखता है।
- source_word: נֹתֵן דְּבָרַי בְּפִיךָ לְאֵשׁ
  choice: मैं अपने वचनों को तेरे मुँह में आग बना रहा हूँ
  rationale: नֹתֵן का मूल अर्थ ‘देना/रखना’ है, पर इस विधेयात्मक रूपक में आशय वचनों को आग के समान प्रभावी बनाना है; ‘मुँह’ की ठोस छवि और ‘वचनों’ का बहुवचन सुरक्षित हैं।
- source_word: הָעָם הַזֶּה עֵצִים
  choice: इस प्रजा को लकड़ियाँ
  rationale: עֵצִים का बहुवचन और आग के लिए जलने वाली सामग्री का रूपक दोनों बनाए गए हैं।
- source_word: וַאֲכָלָתַם
  choice: वह आग उन्हें भस्म कर देगी
  rationale: इब्रानी स्त्रीलिंग क्रिया का कर्ता ‘आग’ है। हिन्दी में कर्ता को दोहराने से संदर्भ स्पष्ट होता है, और ‘भस्म करना’ विनाशकारी अग्नि का स्वाभाविक वर्णन है।
theological_decisions:
- issue: द्वितीय पुरुष के वचन में बहुवचन से एकवचन का परिवर्तन
  choice: ‘तुम लोगों के’ के बाद ‘तेरे मुँह में’
  alternative: दोनों स्थानों पर एक ही वचन का सर्वनाम रखना
  rationale: इब्रानी में पहले प्रत्यय बहुवचन है, पर ‘तेरे मुँह’ में प्रत्यय एकवचन है। अनुवाद इस वास्तविक परिवर्तन को बचाता है; एकवचन सम्भवतः यिर्मयाह को व्यक्तिगत रूप से संबोधित करता है, पर मुख्य पाठ उस पहचान को स्पष्ट रूप से जोड़कर निश्चय नहीं करता।
- issue: याहवे के वचनों और आग का संबंध
  choice: वचनों को मुँह में आग बनाना
  alternative: वचनों को आग के समान देना
  rationale: मुख्य पाठ रूपक की शक्ति और न्याय के साधन के रूप में भविष्यद्वाणी के वचनों की भूमिका को व्यक्त करता है, जबकि पादटिप्पणी मूल क्रिया के अधिक शाब्दिक रूप को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गंभीर और भविष्यद्वाणी की घोषणा के अनुकूल रखी गई है। ‘यह कहता है’, ‘देख’ और ‘भस्म’ जैसे पद गरिमा बनाए रखते हुए सामान्य हिन्दी पाठक के लिए बोधगम्य हैं। बहुवचन ‘तुम लोगों’ और एकवचन ‘तेरे’ का स्पष्ट अंतर मूल इब्रानी के अर्थपूर्ण सर्वनाम-परिवर्तन को दर्शाता है।
