  edition: WLC
  text: עֲל֤וּ בְ/שָׁרוֹתֶ֨י/הָ֙ וְ/שַׁחֵ֔תוּ וְ/כָלָ֖ה אַֽל תַּעֲשׂ֑וּ הָסִ֨ירוּ֙ נְטִ֣ישׁוֹתֶ֔י/הָ כִּ֛י ל֥וֹא לַ/יהוָ֖ה הֵֽמָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/010.yaml
  text: Go up through her vine-rows and destroy[a], but do not make a full end. Remove her branches[b], for they are not Yahweh’s.
translation:
  language: hi
  text: उसकी दाख की कतारों में जा चढ़ो और उन्हें उजाड़ दो[a], पर उसका पूर्णतः अंत न कर डालो। उसकी डालियाँ हटा दो[b], क्योंकि वे याहवे की नहीं हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी शहरपनाह पर चढ़ जाओ और उसे नष्ट करो।” “दाख की कतारों” के लिए प्रयुक्त इब्रानी शब्द कठिन है; कुछ लोग यहाँ दाखबारी के बजाय स्थापत्य का बिंब समझते हैं।
    reason: alternative_reading
  - marker: b
    text: या, “उसकी कोंपलें/लताएँ हटा दो।” इब्रानी शब्द दाखबारी के बिंब को आगे बढ़ा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲלוּ
  choice: चढ़ जाओ
  rationale: עלה के बहुवचन आज्ञार्थक रूप का सीधा अर्थ रखा गया है। प्रसंग हमलावरों को संबोधित करता है, पर ‘आक्रमण करो’ जोड़कर आशय को आवश्यकता से अधिक निश्चित नहीं किया गया।
- source_word: בְשָׁרוֹתֶיהָ
  choice: उसकी दाख की कतारों में
  rationale: यह इब्रानी पद कठिन और विवादित है। आगे ‘डालियाँ’ आने के कारण मुख्य पाठ में दाखबारी का बिंब रखा गया है; स्थापत्य-संबंधी समझ को पादटिप्पणी में दिया गया है।
- source_word: וְשַׁחֵתוּ
  choice: और नाश करो
  rationale: שׁחת की प्रबल विनाश-सूचक आज्ञा को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְכָלָה אַל תַּעֲשׂוּ
  choice: पर उसका पूरी तरह अंत न कर डालो
  rationale: עשה כלה का मुहावरा पूर्ण विनाश या समूल अंत करने का है। यह अनुवाद नाश की आज्ञा और पूर्ण अंत के निषेध के बीच तनाव बनाए रखता है।
- source_word: הָסִירוּ
  choice: हटा दो
  rationale: הסיר की आज्ञा को सरल आधुनिक हिन्दी में रखा गया है और यह कृषि तथा स्थापत्य—दोनों संभावित बिंबों के अनुकूल है।
- source_word: נְטִישׁוֹתֶיהָ
  choice: उसकी डालियाँ
  rationale: दाखबारी के संभावित बिंब में ‘डालियाँ’ सबसे सहज और व्यापक शब्द है। अधिक विशिष्ट ‘कोंपलें’ या ‘लताएँ’ पादटिप्पणी में सुरक्षित हैं।
- source_word: כִּי לֹא לַיהוָה הֵמָּה
  choice: क्योंकि वे याहवे की नहीं हैं
  rationale: ל संबंध या स्वामित्व व्यक्त करता है। बहुवचन ‘वे’ निकटतम बहुवचन संज्ञा ‘डालियाँ’ की ओर संकेत करता है; יהוה को उसके व्यक्तिगत वाचा-नाम ‘याहवे’ से प्रस्तुत किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसका आधुनिक हिन्दी लिप्यंतरण है और उसे उपाधि में नहीं बदलता।
- issue: नाश की आज्ञा और पूर्ण अंत का निषेध
  choice: दोनों कथनों को उनके तनाव सहित रखा गया
  alternative: इसे केवल सीमित दंड या अवशेष-सिद्धांत की व्याख्या के रूप में स्पष्ट करना
  rationale: पद पहले नाश की आज्ञा देता है और फिर पूर्ण अंत से रोकता है। अनुवाद इस तनाव को किसी विशिष्ट धर्मवैज्ञानिक व्याख्या द्वारा हल नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘दाख’ और ‘डालियाँ’ से कृषि-बिंब स्वाभाविक बनता है, जबकि कठिन इब्रानी पद की स्थापत्य-संबंधी वैकल्पिक व्याख्या पादटिप्पणी में सुरक्षित है।
