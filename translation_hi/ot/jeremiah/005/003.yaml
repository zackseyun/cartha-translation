  edition: WLC
  text: יְהֹוָ֗ה עֵינֶי/ךָ֮ הֲ/ל֣וֹא לֶ/אֱמוּנָה֒ הִכִּ֤יתָה אֹתָ/ם֙ וְֽ/לֹא חָ֔לוּ כִּלִּיתָ֕/ם מֵאֲנ֖וּ קַ֣חַת מוּסָ֑ר חִזְּק֤וּ פְנֵי/הֶם֙ מִ/סֶּ֔לַע מֵאֲנ֖וּ לָ/שֽׁוּב־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/003.yaml
  text: O Yahweh[a], are not your eyes on faithfulness? You struck them, but they did not feel pain; you consumed them, but they refused to accept discipline. They made their faces harder than rock[b]; they refused to return.
translation:
  language: hi
  text: हे याहवे, क्या आपकी आँखें निष्ठा पर नहीं हैं? आपने उन्हें मारा, पर उन्हें पीड़ा नहीं हुई[a]; आपने उन्हें नष्ट कर डाला, फिर भी उन्होंने अनुशासन स्वीकार करने से इनकार किया। उन्होंने अपने चेहरे चट्टान से भी कठोर कर लिए; उन्होंने लौटने से इनकार किया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘वे निर्बल नहीं हुए,’ ‘वे बीमार नहीं पड़े,’ अथवा ‘उन्होंने पीड़ा अनुभव नहीं की।’
    reason: lexical_alternative
  - marker: b
    text: या ‘उन्होंने पश्चात्ताप करने से इनकार किया।’ इब्रानी में शाब्दिक रूप से ‘लौटना’ है, जो भविष्यद्वक्ताओं के लेखन में परमेश्वर की ओर फिरने के लिए प्रचलित अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהֹוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में ध्वन्यात्मक रूप से प्रस्तुत किया गया है; सम्बोधन के लिए ‘हे’ रखा गया है।
- source_word: עֵינֶיךָ
  choice: आपकी आँखें
  rationale: इब्रानी का मूर्त मानवीकरण बनाए रखा गया है; आधुनिक हिन्दी में परमेश्वर के प्रति सम्मानसूचक सर्वनाम स्वाभाविक और गरिमापूर्ण है।
- source_word: הֲלוֹא לֶאֱמוּנָה
  choice: क्या आपकी आँखें विश्वासयोग्यता पर नहीं लगी रहतीं?
  rationale: אֱמוּנָה यहाँ दृढ़ता, सच्चाई या निष्ठा का बोध करा सकता है। ‘विश्वासयोग्यता’ नैतिक भरोसेमंदी का भाव रखता है, और ‘आँखें ... लगी रहतीं’ ईश्वरीय दृष्टि की मूल छवि बचाता है।
- source_word: הִכִּיתָה אֹתָם
  choice: आपने उन्हें मारा
  rationale: नכה के प्रहार और न्याय-संबंधी बल को सरल, वर्तमान हिन्दी में सीधे व्यक्त करता है।
- source_word: וְלֹא חָלוּ
  choice: पर उन्हें पीड़ा नहीं हुई
  rationale: חלה निर्बल, रोगी या पीड़ित होने को व्यक्त कर सकता है। प्रहार के इस संदर्भ में ‘पीड़ा नहीं हुई’ सहज है, जबकि अन्य संभावनाएँ पादटिप्पणी में सुरक्षित हैं।
- source_word: כִּלִּיתָם
  choice: आपने उन्हें नष्ट कर डाला
  rationale: Piel כלה के समाप्त कर देने या विनाश तक पहुँचा देने के तीखे न्याय-वाचक अर्थ को बनाए रखता है। अगले वाक्य के साथ उत्पन्न अलंकारिक तनाव को हल्का नहीं किया गया है।
- source_word: מֵאֲנוּ קַחַת מוּסָר
  choice: उन्होंने अनुशासन स्वीकार करने से इनकार किया
  rationale: מוּסָר में दंडात्मक सुधार और शिक्षाप्रद अनुशासन दोनों सम्मिलित हो सकते हैं; यह हिन्दी रूप दोनों पक्षों को खुला रखता है।
- source_word: חִזְּקוּ פְנֵיהֶם מִסֶּלַע
  choice: उन्होंने अपने चेहरे चट्टान से भी कठोर कर लिए
  rationale: हठ और निर्लज्ज प्रतिरोध व्यक्त करने वाली इब्रानी छवि तथा तुलनात्मक बल—चट्टान से भी—दोनों सुरक्षित हैं।
- source_word: מֵאֲנוּ לָשׁוּב
  choice: उन्होंने लौटने से इनकार किया
  rationale: שׁוּב का मूल ‘लौटना’ अर्थ रखा गया है; भविष्यद्वाणी-साहित्य में निहित पश्चात्ताप का भाव पादटिप्पणी में बताया गया है।
theological_decisions:
- issue: नैतिक-धार्मिक संदर्भ में שׁוּב का भविष्यद्वाणी-संबंधी अर्थ
  choice: लौटना
  alternative: पश्चात्ताप करना
  rationale: ‘लौटना’ परमेश्वर की ओर फिरने की वाचागत छवि और मूल क्रिया की अर्थगत व्यापकता को बचाता है; ‘पश्चात्ताप करना’ सही संदर्भगत व्याख्या है, पर उसे मुख्य पाठ में अनिवार्य नहीं बनाया गया।
- issue: כִּלִּיתָם और लोगों की जारी अवज्ञा के बीच तनाव
  choice: आपने उन्हें नष्ट कर डाला
  alternative: आपने उन्हें लगभग समाप्त कर दिया
  rationale: इब्रानी की पूर्ण क्रिया और तीखे न्याय-वचन को नरम नहीं किया गया। काव्यात्मक अतिशयोक्ति, प्रतिनिधिक समूह या विनाशकारी प्रहार जैसी संभावनाओं में से किसी एक को अनावश्यक रूप से निश्चित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट रखी गई है। परमेश्वर के लिए सम्मानसूचक ‘आप’ प्रयोग हुआ है। समानांतर उपवाक्यों, प्रत्यक्ष सम्बोधन और चट्टान की ठोस छवि को बनाए रखा गया है।
