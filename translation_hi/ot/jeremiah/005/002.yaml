id: JER.5.2
reference: Jeremiah 5:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אִ֥ם חַי יְהֹוָ֖ה יֹאמֵ֑רוּ לָ/כֵ֥ן לַ/שֶּׁ֖קֶר יִשָּׁבֵֽעוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/002.yaml
  text: And if they say, “As the LORD lives,” even so they swear falsely.
translation:
  language: hi
  text: और यदि वे कहें, “यहोवा के जीवन की शपथ,” तब भी वे झूठी शपथ खाते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַי יְהוָה
  choice: यहोवा के जीवन की शपथ
  rationale: यह इब्रानी शपथ-सूत्र का स्वाभाविक और स्पष्ट हिन्दी रूप है; इसमें יהוה का व्यक्तिगत नाम भी सुरक्षित रहता है।
- source_word: לָכֵן
  choice: तब भी
  rationale: इस प्रसंग में यह उनके धार्मिक दावे और उनके वास्तविक झूठ के बीच विरोध को व्यक्त करता है; अंग्रेज़ी परामर्श-पाठ के ‘even so’ से भी मेल खाता है।
- source_word: לַשֶּׁקֶר יִשָּׁבֵעוּ
  choice: वे झूठी शपथ खाते हैं
  rationale: यह हिन्दी में प्रचलित शपथ-संबंधी अभिव्यक्ति है और मूल के अर्थ—असत्य अथवा कपटपूर्ण शपथ लेना—को सीधे व्यक्त करती है।
theological_decisions:
- issue: יהוה के नाम का निरूपण
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में सामान्य उपाधि नहीं बल्कि परमेश्वर का व्यक्तिगत नाम יהוה है; ‘यहोवा’ हिन्दी पाठकों के लिए परिचित रूप में इस भेद को बनाए रखता है।
- issue: शपथ के कथन और उसके झूठे होने के बीच संबंध
  choice: ‘तब भी’ द्वारा विरोध बनाए रखा गया
  alternative: ‘इसलिए’ द्वारा परिणाम-संबंध
  rationale: 'लָכֵן का सामान्य अर्थ ‘इसलिए’ हो सकता है, पर यहाँ प्रसंग और वाक्य-संरचना में विडंबनापूर्ण विरोध अधिक स्वाभाविक है: वे यहोवा के नाम की शपथ बोलते हैं, फिर भी उनकी शपथ झूठी है।'
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘शपथ खाते हैं’ सामान्य हिन्दी मुहावरा है, जबकि उद्धृत सूत्र मूल इब्रानी की औपचारिक धार्मिक गंभीरता बनाए रखता है।
