  edition: WLC
  text: אֵ֤י לָ/זֹאת֙ אסלוח לָ֔/ךְ בָּנַ֣יִ/ךְ עֲזָב֔וּ/נִי וַ/יִּשָּׁבְע֖וּ בְּ/לֹ֣א אֱלֹהִ֑ים וָ/אַשְׂבִּ֤עַ אוֹתָ/ם֙ וַ/יִּנְאָ֔פוּ וּ/בֵ֥ית זוֹנָ֖ה יִתְגֹּדָֽדוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/007.yaml
  text: How can I forgive you for this? Your children have forsaken me and have sworn by those that are not gods[a]. When I had fed them to the full[b], they committed adultery and crowded into a prostitute’s house.
translation:
  language: hi
  text: '“मैं इसके लिए तुझे कैसे क्षमा करूँ?


    तेरे बच्चों ने मुझे त्याग दिया


    और उनके नाम की शपथ खाई जो देवता ही नहीं हैं।


    मैंने उन्हें भरपेट तृप्त किया था[a],


    फिर भी उन्होंने व्यभिचार किया


    और वेश्या के घर समूहों में इकट्ठे हुए[b]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैंने उन्हें पूरी तरह तृप्त किया।” समान व्यंजनों को अलग प्रकार से समझने पर “मैंने उनसे शपथ खिलाई” भी संभव माना गया है, पर मसोरेटिक स्वरांकन और प्रसंग ‘तृप्त किया’ का समर्थन करते हैं।
    reason: lexical_alternative
  - marker: b
    text: या, “वे वेश्या के घर भीड़ लगाते थे” अथवा “दल बाँधकर इकट्ठे होते थे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵי לָזֹאת אסלוח לָךְ
  choice: मैं इसके लिए तुझे कैसे क्षमा करूँ?
  rationale: प्रश्नवाचक אֵי यहाँ असमर्थता और आक्रोश से भरा आलंकारिक प्रश्न है। एकवचन ‘तुझे’ संबोधित समुदाय के स्त्रीलिंग एकवचन रूप को यथासंभव बनाए रखता है।
- source_word: בָּנַיִךְ עֲזָבוּנִי
  choice: तेरे बच्चों ने मुझे त्याग दिया
  rationale: בנים यहाँ संबोधित नगर या समुदाय के निवासियों के लिए सामूहिक अर्थ में है; ‘बच्चों’ से यह अर्थ बना रहता है। ‘त्याग दिया’ वाचा-संबंधी विश्वासघात की गंभीरता व्यक्त करता है।
- source_word: וַיִּשָּׁבְעוּ בְּלֹא אֱלֹהִים
  choice: उनके नाम की शपथ खाई जो देवता ही नहीं हैं
  rationale: हिब्रू वाक्यांश झूठे देवताओं के नाम पर शपथ लेने को दर्शाता है। ‘देवता ही नहीं हैं’ मूल की विवादात्मक धार को बनाए रखता है।
- source_word: וָאַשְׂבִּעַ אוֹתָם
  choice: मैंने उन्हें भरपेट तृप्त किया था
  rationale: मसोरेटिक स्वरांकन क्रिया को שבע, ‘तृप्त करना/भर देना’, से समझता है। ‘भरपेट तृप्त’ परमेश्वर के प्रचुर प्रबंध को सहज हिन्दी में व्यक्त करता है; पाठगत-शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: וַיִּנְאָפוּ
  choice: उन्होंने व्यभिचार किया
  rationale: सीधा अनुवाद शारीरिक अनैतिकता और वाचा-विरोधी मूर्तिपूजा, दोनों संभावित संकेतों को खुला रखता है।
- source_word: וּבֵית זוֹנָה יִתְגֹּדָדוּ
  choice: वेश्या के घर झुंड बनाकर उमड़ पड़े
  rationale: יִתְגֹּדָדוּ का भाव दल या भीड़ बनाकर इकट्ठा होने का है। ‘झुंड बनाकर उमड़ पड़े’ उस सामूहिक और उतावले व्यवहार को स्वाभाविक हिन्दी में सामने लाता है।
theological_decisions:
- issue: व्यभिचार का शाब्दिक या रूपक अर्थ
  choice: ‘व्यभिचार किया’ रखकर अर्थ को खुला छोड़ा गया है।
  alternative: इसे केवल यौन अनैतिकता या केवल मूर्तिपूजा के रूप में स्पष्ट करना।
  rationale: यिर्मयाह में यौन और वाचा-संबंधी विश्वासघात की छवियाँ परस्पर जुड़ी रहती हैं; अनुवाद को इस तनाव का निर्णय नहीं करना चाहिए।
- issue: संबोधित व्यक्ति और समुदाय
  choice: संबोधन के लिए एकवचन ‘तुझे/तेरे’ और उसके लोगों के लिए बहुवचन ‘बच्चों/उन्होंने’ रखा गया है।
  alternative: पाठ में ‘यरूशलेम’ या ‘यहूदा’ जोड़ देना।
  rationale: हिब्रू एक सामूहिक स्त्रीलिंग एकवचन को संबोधित करता है, पर इस पद में उसका नाम स्पष्ट रूप से नहीं देता; इसलिए नाम जोड़ना अनुचित होगा।
- issue: परमेश्वर के प्रबंध के बावजूद विश्वासघात
  choice: ‘फिर भी’ द्वारा निहित विरोध को स्पष्ट किया गया है।
  alternative: सिर्फ क्रमसूचक ‘और’ रखना।
  rationale: हिब्रू में प्रचुर तृप्ति के बाद व्यभिचार का तीखा विरोध प्रसंग से स्पष्ट है; ‘फिर भी’ उसे बिना नई धर्मवैज्ञानिक व्याख्या जोड़े स्वाभाविक हिन्दी में व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गंभीर और भविष्यवाणी-संगत काव्यात्मक गद्य। ‘तुझे’ निकट और प्रत्यक्ष संबोधन बनाए रखता है; ‘देवता ही नहीं हैं’ तथा ‘वेश्या के घर’ मूल की तीखी भाषा को नरम नहीं करते।
