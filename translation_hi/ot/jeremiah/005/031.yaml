source:
  edition: WLC
  text: הַ/נְּבִיאִ֞ים נִבְּא֣וּ בַ/שֶּׁ֗קֶר וְ/הַ/כֹּהֲנִים֙ יִרְדּ֣וּ עַל יְדֵי/הֶ֔ם וְ/עַמִּ֖/י אָ֣הֲבוּ כֵ֑ן וּ/מַֽה תַּעֲשׂ֖וּ לְ/אַחֲרִיתָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/031.yaml
  text: The prophets prophesy falsely[a], and the priests rule by their authority, and my people love it so[b]. But what will you do when its end comes?
translation:
  language: hi
  text: भविष्यद्वक्ता झूठी भविष्यवाणी करते हैं, और याजक उनके अधिकार से शासन करते हैं[a]। मेरी प्रजा को यही अच्छा लगता है। पर जब इसका अंत होगा[b], तब तुम क्या करोगे?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘याजक उनके निर्देशानुसार शासन करते हैं’ अथवा ‘याजक उनके हाथों से शासन करते हैं।’ इब्रानी वाक्यांश कठिन है।
    reason: alternative_reading
  - marker: b
    text: या ‘उसके अंत में तुम क्या करोगे?’ इब्रानी प्रत्यय स्त्रीलिंग है और उसका संकेत इस स्थिति, देश या नगर की ओर हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבְּאוּ בַשֶּׁקֶר
  choice: झूठी भविष्यवाणी करते हैं
  rationale: यह अभिव्यक्ति क्रिया ‘भविष्यवाणी करना’ के साथ ‘झूठ में/झूठ के द्वारा’ को जोड़ती है। चुना हुआ हिन्दी रूप स्वाभाविक है और भविष्यवक्ताओं की भविष्यवाणी को झूठा ठहराने वाले आरोप को स्पष्ट रखता है।
- source_word: יִרְדּוּ
  choice: शासन करते हैं
  rationale: רדה का सामान्य अर्थ शासन या प्रभुत्व करना है; यहाँ याजकों द्वारा अधिकार चलाने के संदर्भ में ‘शासन करते हैं’ उपयुक्त है।
- source_word: עַל יְדֵיהֶם
  choice: उनके अधिकार से
  rationale: इब्रानी वाक्यांश कठिन और कुछ हद तक अस्पष्ट है। संदर्भ में इसका सबसे संभावित अर्थ यह है कि याजक भविष्यवक्ताओं के अधिकार, प्रभाव या निर्देशन के सहारे शासन करते हैं। मुख्य पाठ स्वाभाविक हिन्दी देता है और अन्य संभावनाएँ पादटिप्पणी में रखता है।
- source_word: כֵן
  choice: यही
  rationale: यह पहले बताई गई भ्रष्ट व्यवस्था की ओर संकेत करता है। ‘मेरी प्रजा को यही अच्छा लगता है’ आधुनिक हिन्दी में उसके प्रति जनता की स्वीकृति को सहज रूप से व्यक्त करता है।
- source_word: לְאַחֲרִיתָהּ
  choice: जब इसका अंत होगा
  rationale: אַחֲרִית अंत, परिणाम या अंतिम दशा को सूचित करता है। स्त्रीलिंग एकवचन प्रत्यय का संदर्भ स्पष्ट नहीं है; ‘इसका’ उस अस्पष्टता को किसी एक स्त्रीलिंग संज्ञा से जबरन नहीं बाँधता और आने वाले परिणाम की चेतावनी बनाए रखता है।
- source_word: וּמַה תַּעֲשׂוּ
  choice: पर ... तब तुम क्या करोगे?
  rationale: संयोजक यहाँ वर्णन से तीखी चेतावनी की ओर मोड़ लाता है। ‘पर’ और ‘तब’ हिन्दी में इस विरोधात्मक तथा परिणामसूचक बल को स्वाभाविक ढंग से व्यक्त करते हैं।
theological_decisions:
- issue: לְאַחֲרִיתָהּ में स्त्रीलिंग प्रत्यय का संदर्भ
  choice: इसे किसी निश्चित स्त्रीलिंग पूर्वपद से न जोड़कर ‘जब इसका अंत होगा’ कहा गया है, जो अभी वर्णित भ्रष्ट स्थिति या व्यवस्था की ओर संकेत कर सकता है।
  alternative: इसे देश, नगर या किसी स्त्रीलिंग संदर्भ से जोड़कर ‘जब उसका अंत होगा’ समझा जा सकता है।
  rationale: मूल पाठ प्रत्यय का निश्चित संदर्भ नहीं बताता। अनिर्दिष्ट ‘इसका’ चेतावनी को बनाए रखते हुए स्थिति, देश और नगर में से किसी एक विकल्प को सिद्धांतगत रूप से निश्चित नहीं करता।
- issue: भविष्यवक्ताओं और याजकों के बीच अधिकार-संबंध
  choice: याजक भविष्यवक्ताओं के अधिकार से शासन करते हैं।
  alternative: याजक उनके निर्देशन पर शासन करते हैं; अथवा अधिक शब्दशः, उनके हाथों के द्वारा शासन करते हैं।
  rationale: עַל יְדֵיהֶם कठिन है और अधीनता, माध्यम या निर्देशन का भाव दे सकता है। मुख्य पाठ संभावित संबंध को पठनीय बनाता है, जबकि पादटिप्पणी वास्तविक भाषिक अनिश्चितता सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘भविष्यद्वक्ता’, ‘याजक’ और ‘शासन’ जैसे परिचित बाइबलीय शब्द मूल के औपचारिक तथा सार्वजनिक आरोप का स्वर बनाए रखते हैं; कठिन इब्रानी वाक्यांशों की अस्पष्टता पादटिप्पणियों में स्पष्ट की गई है।
