base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/025.yaml
  text: Your iniquities have turned these away[b][a], and your sins have withheld the good from you.
translation:
  language: hi
  text: तुम्हारे अधर्मों ने इन्हें[a] दूर कर दिया है, और तुम्हारे पापों ने भलाई[b] को तुमसे रोक रखी है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘इन बातों को’; संकेत पिछले प्रसंग में बताई गई आशीषों की ओर है।
    reason: lexical_alternative
  - marker: b
    text: या ‘अच्छी वस्तुओं को’।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲוֺנוֹתֵיכֶם
  choice: तुम्हारे अधर्मों
  rationale: ‘अधर्म’ दोषपूर्ण और नैतिक रूप से टेढ़े आचरण का भार व्यक्त करता है तथा अगले पदांश के ‘पापों’ से शब्दगत भेद बनाए रखता है।
- source_word: הִטּוּ
  choice: दूर कर दिया है
  rationale: נטה के हिफ़ील रूप का यहाँ अर्थ पहले बताई गई अच्छी बातों को मोड़कर दूर कर देना है; यह हिंदी में स्वाभाविक रहते हुए कारण और वंचना का भाव देता है।
- source_word: אֵלֶּה
  choice: इन्हें
  rationale: संकेतवाचक शब्द को बिना उसके संदर्भ को मुख्य पाठ में स्पष्ट किए रखा गया है, ताकि इब्रानी की संदर्भगत अनिश्चितता बनी रहे।
- source_word: וְחַטֹּאותֵיכֶם
  choice: और तुम्हारे पापों
  rationale: ‘पाप’ חַטָּאת का स्पष्ट और प्रचलित हिंदी समतुल्य है तथा पहले पदांश के ‘अधर्म’ से भेद रखता है।
- source_word: מָנְעוּ
  choice: रोक रखा है
  rationale: מנע का अर्थ रोकना या मिलने न देना है; पूर्ण क्रिया के परिणामस्वरूप जारी वंचना को ‘रोक रखा है’ स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הַטּוֹב
  choice: भलाई
  rationale: संज्ञीकृत एकवचन ‘अच्छाई/कल्याण’ के सामूहिक और अमूर्त दोनों अर्थों के लिए ‘भलाई’ उपयुक्त है; इसमें केवल भौतिक समृद्धि तक अर्थ सीमित नहीं होता।
- source_word: מִכֶּם
  choice: तुमसे
  rationale: מן यहाँ अलगाव अथवा वंचना दर्शाता है; ‘तुमसे रोक रखा है’ हिंदी में स्रोत की संरचना और अर्थ दोनों को निकटता से रखता है।
theological_decisions:
- issue: ‘इन्हें’ का संदर्भ पिछली आयत में वर्णित वर्षा और कटनी के नियत समय से है या सामान्य आशीषों से
  choice: मुख्य पाठ में केवल संकेतवाचक ‘इन्हें’ रखा गया है।
  alternative: ‘इन आशीषों को’ अथवा ‘वर्षा और कटनी को’ लिखना।
  rationale: אֵלֶּה स्वयं संदर्भ को नाम नहीं देता, बल्कि पिछले प्रसंग की ओर संकेत करता है। उसे स्पष्ट कर देना व्याख्या को मूल पाठ में मिला देता; इसलिए संभावित संदर्भ पादटिप्पणी में बताया गया है।
- issue: הַטּוֹב को अमूर्त भलाई समझा जाए या अनेक अच्छी वस्तुएँ
  choice: ‘भलाई’ रखा गया है।
  alternative: ‘अच्छी वस्तुएँ’ या ‘अच्छी बातें’।
  rationale: इब्रानी का निश्चित एकवचन अमूर्त या सामूहिक दोनों अर्थ दे सकता है। ‘भलाई’ इस व्यापकता को बनाए रखती है, जबकि वैकल्पिक सामूहिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गंभीर और सार्वजनिक पाठ के योग्य रूप अपनाया गया है। ‘अधर्म’ और ‘पाप’ स्रोत के दो निकट लेकिन अलग शब्दों का भेद रखते हैं। संकेतवाचक और ‘भलाई’ की व्यापकता को जानबूझकर खुला रखा गया है।
