source:
  edition: WLC
  text: הַֽ/עַל אֵ֥לֶּה לֹֽא אֶפְקֹ֖ד נְאֻם יְהֹוָ֑ה אִ֚ם בְּ/ג֣וֹי אֲשֶׁר כָּ/זֶ֔ה לֹ֥א תִתְנַקֵּ֖ם נַפְשִֽׁ/י־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/029.yaml
  text: Shall I not punish for these things? declares Yahweh[b][a]. Shall my soul not avenge itself on a nation such as this?
translation:
  language: hi
  text: “क्या मैं इन बातों के कारण दण्ड न दूँगा[a]?” याहवे की यह वाणी है। “क्या मेरा प्राण ऐसे राष्ट्र से बदला न लेगा[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या मैं इन बातों का लेखा न लूँगा?” इब्रानी क्रिया का अर्थ न्याय करने के लिए हस्तक्षेप करना और दण्ड देना भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से, “क्या मेरा प्राण बदला न लेगा?” यह याहवे के अपने दृढ़ और व्यक्तिगत संकल्प को व्यक्त करता है; भावानुसार इसका अनुवाद “क्या मैं स्वयं बदला न लूँगा?” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעַל אֵלֶּה לֹא אֶפְקֹד
  choice: क्या मैं इन बातों के कारण दण्ड न दूँगा
  rationale: प्रश्नवाचक הֲ और निषेध לֹא मिलकर प्रत्याशित सकारात्मक उत्तर वाला आलंकारिक प्रश्न बनाते हैं। פקד न्याय के प्रसंग में दण्ड देने अथवा लेखा लेने का भाव रखता है।
- source_word: נְאֻם יְהוָה
  choice: याहवे की यह वाणी है
  rationale: यह गम्भीर भविष्यद्वक्ताई उद्घोषणा-सूत्र है। परमेश्वर के विशिष्ट नाम יהוה को ‘याहवे’ लिखा गया है।
- source_word: אִם ... לֹא
  choice: क्या ... न लेगा
  rationale: यहाँ אִם साधारण शर्त नहीं, बल्कि शपथ-सदृश आलंकारिक प्रश्न का परिचायक है। हिंदी में ‘क्या ... न’ उसी बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּגוֹי אֲשֶׁר כָּזֶה
  choice: ऐसे राष्ट्र से
  rationale: נקם के साथ בְּ उस पक्ष को चिह्नित करता है जिससे या जिसके विरुद्ध बदला लिया जाता है; ‘ऐसे राष्ट्र से’ वर्तमान हिंदी में स्वाभाविक है।
- source_word: תִתְנַקֵּם נַפְשִׁי
  choice: मेरा प्राण ... बदला न लेगा
  rationale: Hitpael रूप में प्रतिशोध लेने का आत्म-संबद्ध भाव है। ‘मेरा प्राण’ נַפְשִׁי की शाब्दिक छवि और वक्ता के निजी, सम्पूर्ण संकल्प—दोनों को बनाए रखता है।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में चार-अक्षरीय वाचा-नाम सीधे उपस्थित है; उसका नामात्मक स्वरूप बनाए रखने के लिए ‘याहवे’ चुना गया है।
- issue: नַפְשִׁי में ईश्वरीय आत्म-सन्दर्भ
  choice: मेरा प्राण
  alternative: मैं स्वयं
  rationale: ‘मैं स्वयं’ अधिक मुहावरेदार है, पर वह मूल की ‘मेरे प्राण/मेरी आत्मा’ वाली सजीव अभिव्यक्ति को मिटा देता। मुख्य पाठ में मूल तनाव रखा गया और पादटिप्पणी में उसका आशय स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक, गम्भीर और भविष्यद्वक्ताई शैली के अनुरूप है। दोनों आलंकारिक प्रश्नों की समानांतर रचना सुरक्षित रखी गई है। ‘मेरा प्राण’ सामान्य गद्य से कुछ अधिक काव्यात्मक है, पर मूल इब्रानी की जानबूझकर रखी गई आत्म-सन्दर्भात्मक छवि के कारण उपयुक्त है।
