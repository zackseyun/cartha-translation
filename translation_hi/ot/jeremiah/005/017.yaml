base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/017.yaml
  text: And they will consume your harvest and your bread[a]; they will consume your sons and your daughters; they will consume your flock and your herd; they will consume your vine and your fig tree; they will destroy your fortified cities, in which you trust[b], with the sword.
translation:
  language: hi
  text: और वह तेरी फसल और तेरी रोटी खा जाएगा[a]; वे तेरे बेटे-बेटियों को खा जाएँगे; वह तेरी भेड़-बकरियों और गाय-बैलों को खा जाएगा; वह तेरी दाखलता और अंजीर के पेड़ को खा जाएगा; और जिन गढ़वाले नगरों पर तू भरोसा रखता है, उन्हें वह तलवार से उजाड़ देगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पूरे पद में बार-बार आई क्रिया का शाब्दिक अर्थ ‘खाना’ है; प्रसंग में इसका अर्थ ‘निगल जाना’ या ‘भस्म कर देना’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में आक्रमणकारी के लिए एकवचन और बहुवचन क्रियाएँ बारी-बारी से आती हैं; संभवतः शत्रु राष्ट्र को एक इकाई और उसकी सेनाओं—दोनों रूपों में देखा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְאָכַל / יֹאכְלוּ / יֹאכַל
  choice: खा जाएगा / खा जाएँगे
  rationale: मूल क्रिया אָכַל का सीधा अर्थ ‘खाना’ है। यहाँ यह फसल, मनुष्यों, पशुओं और पेड़ों के विनाश को चित्रात्मक ढंग से व्यक्त करती है; हिंदी में ‘खा जाना’ सभी उपवाक्यों में स्वाभाविक रहते हुए मूल की पुनरावृत्ति और तीव्रता बनाए रखता है।
- source_word: קְצִירְךָ
  choice: तेरी फसल
  rationale: कָצִיר यहाँ काटी या तैयार उपज को दर्शाता है; ‘फसल’ आधुनिक हिंदी में स्पष्ट और स्वाभाविक है।
- source_word: לַחְמֶךָ
  choice: तेरी रोटी
  rationale: לֶחֶם का ठोस अर्थ ‘रोटी’ है, यद्यपि यह व्यापक रूप से भोजन भी सूचित कर सकता है। मूल बिंब को बनाए रखने के लिए ‘रोटी’ रखा गया है।
- source_word: בָּנֶיךָ וּבְנוֹתֶיךָ
  choice: तेरे बेटे-बेटियों
  rationale: इब्रानी में पुत्रों और पुत्रियों दोनों का स्पष्ट उल्लेख है; संयुक्त हिंदी रूप दोनों को सहजता से बनाए रखता है।
- source_word: צֹאנְךָ וּבְקָרֶךָ
  choice: तेरी भेड़-बकरियों और गाय-बैलों
  rationale: צֹאן छोटे पालतू पशुओं, खासकर भेड़-बकरियों, और בָּקָר गोवंश को दर्शाता है। ये शब्द सामान्य पाठक के लिए ‘झुंड’ जैसे अधिक अमूर्त शब्दों से अधिक स्पष्ट हैं।
- source_word: גַּפְנְךָ וּתְאֵנָתֶךָ
  choice: तेरी दाखलता और अंजीर के पेड़
  rationale: दोनों एकवचन कृषि-संज्ञाओं और उनके प्रतिनिधिक बिंब को बनाए रखा गया है; ‘दाखलता’ अंगूर की बेल का गरिमापूर्ण और परिचित बाइबलीय पद है।
- source_word: יְרֹשֵׁשׁ
  choice: उजाड़ देगा
  rationale: यह दुर्लभ क्रिया नगरों को निर्बल, नष्ट या वीरान कर देने का भाव रखती है। सैन्य प्रसंग में ‘उजाड़ देगा’ विनाश और बरबादी दोनों को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: עָרֵי מִבְצָרֶיךָ
  choice: तेरे गढ़वाले नगरों
  rationale: यह पद किलेबंदी से सुरक्षित नगरों को दर्शाता है। ‘गढ़वाले नगर’ सामान्य आधुनिक हिंदी में समझने योग्य है और उनकी रक्षा-व्यवस्था को स्पष्ट करता है।
- source_word: אֲשֶׁר אַתָּה בּוֹטֵחַ בָּהֵנָּה
  choice: जिन पर तू भरोसा रखता है
  rationale: בָּטַח सुरक्षा के लिए भरोसा या निर्भरता रखने का भाव देता है। यह संबंधवाचक रचना नगरों पर यह भरोसा स्पष्ट करती है।
- source_word: בֶּחָרֶב
  choice: तलवार से
  rationale: בְּ यहाँ साधन बताता है; ‘तलवार से’ सैन्य विनाश का सीधा और स्वाभाविक अनुवाद है।
theological_decisions:
- issue: आक्रमणकारी के लिए एकवचन और बहुवचन क्रियाओं का परिवर्तन
  choice: मूल के अनुसार ‘वह’ और ‘वे’ का परिवर्तन बनाए रखा गया है।
  alternative: पूरे पद में केवल ‘वह’ अथवा केवल ‘वे’ रखकर आक्रमणकारी राष्ट्र को एक सामूहिक इकाई या उसकी सेनाओं के रूप में समान किया जा सकता था।
  rationale: इब्रानी पाठ में पहली, तीसरी, चौथी और अंतिम क्रियाएँ एकवचन हैं, जबकि बेटों-बेटियों वाला उपवाक्य बहुवचन है। यह परिवर्तन आक्रमणकारी राष्ट्र को कभी एक सामूहिक शक्ति और कभी उसके लोगों या सैनिकों के रूप में प्रस्तुत कर सकता है; इसे समतल करने के बजाय सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिंदी। यहूदा को संबोधित मूल के एकवचन दूसरे पुरुष को ‘तू/तेरी/तेरे’ से रखा गया है। ‘खा जाना’ की पुनरावृत्ति जानबूझकर सुरक्षित है, क्योंकि वही मूल पद की लय और विनाशकारी बिंब का प्रमुख अंग है।
