id: JER.5.11
reference: Jeremiah 5:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּי֩ בָג֨וֹד בָּגְד֜וּ בִּ֗/י בֵּ֧ית יִשְׂרָאֵ֛ל וּ/בֵ֥ית יְהוּדָ֖ה נְאֻם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/011.yaml
  text: For the house of Israel and the house of Judah have dealt very treacherously with me[a], declares Yahweh.
translation:
  language: hi
  text: क्योंकि इस्राएल के घराने और यहूदा के घराने ने मेरे साथ घोर विश्वासघात किया है[a]—यह याहवे की घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे विरुद्ध निश्चय ही विश्वासघात किया है” अथवा “मुझे पूरी तरह धोखा दिया है।” इब्रानी में क्रिया के साथ उसी धातु का infinitive absolute प्रयुक्त है, जो कथन पर विशेष बल देता है।
    reason: मूल की जोरदार व्याकरणिक रचना और בגד के वैकल्पिक अर्थों को स्पष्ट करना।
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन के लिए आधार या कारण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इसके व्याख्यात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בָגֹוד בָּגְדוּ
  choice: घोर विश्वासघात किया है
  rationale: एक ही धातु के infinitive absolute और finite verb का संयोग क्रिया पर तीव्र बल देता है। ‘घोर’ उस बल को व्यक्त करता है और ‘विश्वासघात’ בגד की बेवफाई तथा छलपूर्ण द्रोह की अर्थ-छाया बनाए रखता है।
- source_word: בִּי
  choice: मेरे साथ
  rationale: בגד के साथ यह अपराध के व्यक्तिगत लक्ष्य को दर्शाता है। ‘मेरे साथ विश्वासघात’ आधुनिक हिन्दी का स्वाभाविक प्रयोग है; ‘मेरे विरुद्ध’ भी संभव है।
- source_word: בֵּית יִשְׂרָאֵל
  choice: इस्राएल के घराने
  rationale: ‘घराने’ से सामूहिक वाचा-समुदाय की मूल अभिव्यक्ति सुरक्षित रहती है, इसे केवल ‘इस्राएल’ नहीं बनाया गया।
- source_word: וּבֵית יְהוּדָה
  choice: और यहूदा के घराने
  rationale: मूल की समानांतर रचना और दोनों समुदायों का भेद सुरक्षित रखा गया है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: भविष्यद्वाणी के गंभीर सूत्र को साफ और प्रतिष्ठित आधुनिक हिन्दी में व्यक्त करता है तथा יְהוָה को व्यक्तिगत नाम ‘याहवे’ के रूप में रखता है।
theological_decisions:
- issue: בגד में वाचा-संबंधी बेवफाई और सामान्य विश्वासघात की अर्थ-छाया
  choice: विश्वासघात
  alternative: बेवफाई / छलपूर्ण व्यवहार
  rationale: ‘विश्वासघात’ संबंध तोड़ने और द्रोह करने दोनों अर्थों को समेटता है, पर अनुवाद में किसी विशेष व्यवस्थित धार्मिक व्याख्या को अनावश्यक रूप से नहीं जोड़ता।
- issue: יְהוָה का निरूपण
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल में आए व्यक्तिगत ईश्वरीय नाम को उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘घराना’ मूल की सामूहिक अभिव्यक्ति को बनाए रखता है; ‘घोर विश्वासघात’ इब्रानी की emphatic construction को स्वाभाविक हिन्दी में प्रकट करता है।
