base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/027.yaml
  text: Like a cage full of birds[a], so their houses are full of deceit[b]; therefore they have become great and grown rich.
translation:
  language: hi
  text: जैसे पिंजरा पक्षियों से भरा होता है[a], वैसे ही उनके घर छल-कपट से भरे हैं[b]; इसी कारण वे बड़े और धनी हो गए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘टोकरी’ अथवा ‘दड़बा’; मूल शब्द पक्षियों को रखने वाले पात्र को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: ‘छल-कपट’ का अनुवाद ‘धोखा’, ‘विश्वासघात’ या ‘बेईमानी’ भी किया जा सकता है; इब्रानी शब्द व्यापक रूप से कपटपूर्ण और शोषणकारी आचरण को समेटता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כְלוּב
  choice: पिंजरा
  rationale: यह संज्ञा पक्षियों को रखने वाले पात्र को दर्शाती है। यहाँ ‘पिंजरा’ आधुनिक हिन्दी में स्वाभाविक है और पकड़े हुए पक्षियों की मूल उपमा को बनाए रखता है।
- source_word: מָלֵא עוֹף
  choice: पक्षियों से भरा होता है
  rationale: עוֹף उड़ने वाले जीवों या पक्षियों के लिए व्यापक शब्द है। ‘पक्षियों’ स्पष्ट और सहज हिन्दी है; ‘होता है’ उपमात्मक सामान्य कथन को स्वाभाविक बनाता है।
- source_word: כֵּן
  choice: वैसे ही
  rationale: यह पहले और दूसरे खंड के बीच तुलना को स्पष्ट रूप से व्यक्त करता है।
- source_word: בָּתֵּיהֶם
  choice: उनके घर
  rationale: मूल बहुवचन का सीधा और स्वाभाविक अनुवाद है तथा बेईमानी से समृद्ध हुए घरानों की ठोस छवि बनाए रखता है।
- source_word: מְלֵאִים מִרְמָה
  choice: छल-कपट से भरे हैं
  rationale: מִרְמָה धोखे, कपट, विश्वासघात या बेईमानी को व्यापक रूप से दर्शाता है। ‘छल-कपट’ हिन्दी में इस व्यापक अनैतिक और शोषणकारी व्यवहार को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עַל כֵּן
  choice: इसी कारण
  rationale: यह उनकी छलपूर्ण समृद्धि के परिणाम को स्पष्ट रूप से जोड़ता है।
- source_word: גָּדְלוּ
  choice: बड़े हो गए
  rationale: मूल क्रिया ‘बड़ा होना’ या ‘महान बनना’ है। यह अनुवाद सामाजिक प्रतिष्ठा या प्रभाव में वृद्धि की संभावित अर्थ-व्याप्ति को बिना संकीर्ण किए बनाए रखता है।
- source_word: וַיַּעֲשִׁירוּ
  choice: और धनी बन गए हैं
  rationale: मूल क्रिया का अर्थ ‘धनी होना’ है। यह अन्यायपूर्ण लाभ के संदर्भ को रहने देता है, पर ‘अपने आपको धनी बनाया’ जैसी अपेक्षाकृत अधिक व्याख्यात्मक भाषा नहीं जोड़ता।
