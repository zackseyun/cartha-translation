  yaml_path: translation/ot/jeremiah/005/023.yaml
  text: But this people has had a stubborn and rebellious heart; they have turned aside and gone away.
translation:
  language: hi
  text: पर इस प्रजा का हृदय हठीला और विद्रोही रहा है; वे हट गए और चले गए हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵב
  choice: हृदय
  rationale: यहाँ ‘हृदय’ मनुष्य की आंतरिक इच्छा, सोच और नैतिक प्रवृत्ति का केंद्र है; हिन्दी में यह अर्थ स्वाभाविक रूप से व्यक्त होता है।
- source_word: סוֹרֵר
  choice: हठीला
  rationale: शब्द जान-बूझकर अड़ने और मार्ग से हटने की प्रवृत्ति बताता है; ‘हठीला’ सामान्य आधुनिक हिन्दी में इसे स्पष्ट रखता है।
- source_word: מוֹרֶה
  choice: विद्रोही
  rationale: यह सत्ता या आदेश का प्रतिरोध करने का भाव देता है; ‘विद्रोही’ उसके नैतिक और संबंधपरक बल को बनाए रखता है।
- source_word: סָרוּ
  choice: भटककर
  rationale: क्रिया का मूल भाव सही मार्ग से मुड़ने या हटने का है; अगली क्रिया के साथ ‘भटककर’ सहज हिन्दी बनाता है।
- source_word: וַיֵּלֵכוּ
  choice: दूर चले गए हैं
  rationale: शाब्दिक रूप से ‘और वे चले गए’; प्रसंग में पहले मार्ग से हटना और फिर दूर चले जाना व्यक्त है। ‘दूर’ निहित अलगाव को स्पष्ट करता है, जैसा अंग्रेज़ी परामर्श-पाठ में भी है।
theological_decisions:
- issue: הָיָה के काल और दशा का अनुवाद
  choice: हो गया है
  alternative: था / रहा है
  rationale: हिब्रू पूर्ण क्रिया वर्तमान में स्थापित दशा या विकसित हो चुकी स्थिति बता सकती है। ‘हो गया है’ इस परिणामकारी दशा को व्यक्त करता है, बिना यह तय किए कि हृदय आरंभ से ऐसा था।
- issue: दो अंतिम क्रियाओं का संबंध
  choice: भटककर दूर चले गए हैं
  alternative: वे हट गए और चले गए
  rationale: 'दोनों क्रियाओं की क्रमिकता सुरक्षित रखते हुए स्वाभाविक हिन्दी दी गई है: पहले सही मार्ग से हटना, फिर दूर चले जाना।'
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘प्रजा’, ‘हृदय’ और ‘विद्रोही’ बाइबिलीय गंभीरता रखते हैं, जबकि वाक्य-विन्यास वर्तमान हिन्दी में स्वाभाविक है।
