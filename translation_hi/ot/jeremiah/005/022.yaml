reference: Jeremiah 5:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הַ/אוֹתִ֨/י לֹא תִירָ֜אוּ נְאֻם יְהֹוָ֗ה אִ֤ם מִ/פָּנַ/י֙ לֹ֣א תָחִ֔ילוּ אֲשֶׁר שַׂ֤מְתִּי חוֹל֙ גְּב֣וּל לַ/יָּ֔ם חָק עוֹלָ֖ם וְ/לֹ֣א יַעַבְרֶ֑/נְהוּ וַ/יִּֽתְגָּעֲשׁוּ֙ וְ/לֹ֣א יוּכָ֔לוּ וְ/הָמ֥וּ גַלָּ֖י/ו וְ/לֹ֥א יַעַבְרֻֽ/נְהוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/022.yaml
  text: Do you not fear me? declares Yahweh[a]. Do you not tremble before me, he who set the sand as a boundary for the sea, an everlasting decree that it cannot cross? Though its waves toss, they cannot prevail; though they roar[b], they cannot cross it.
translation:
  language: hi
  text: “क्या तुम मुझसे नहीं डरते?” याहवे की घोषणा है। “क्या तुम मेरे सामने नहीं काँपते—मैंने समुद्र के लिए रेत को सीमा ठहराया है, सदा की ऐसी मर्यादा जिसे वह लाँघ नहीं सकता? उसकी लहरें भले ही उमड़ें, वे सफल नहीं हो सकतीं; वे भले ही गरजें, फिर भी उसे लाँघ नहीं सकतीं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַאוֹתִי לֹא תִירָאוּ
  choice: क्या तुम मुझसे नहीं डरते?
  rationale: प्रश्नवाचक הֲ और निषेध के साथ यह फटकारपूर्ण आलंकारिक प्रश्न है। ‘डरते’ ירא में निहित भय और श्रद्धापूर्ण अधीनता, दोनों की संभावना को खुला रखता है।
- source_word: נְאֻם יְהוָה
  choice: याहवे की यह घोषणा है
  rationale: נְאֻם भविष्यद्वक्ताओं का गंभीर घोषणासूचक सूत्र है; याहवे व्यक्तिगत ईश्वरीय नाम का सीधा लिप्यंतरण है।
- source_word: אִם מִפָּנַי לֹא תָחִילוּ
  choice: क्या तुम मेरे सामने नहीं काँपते?
  rationale: חיל यहाँ भय से काँपने, थरथराने या व्याकुल होने का भाव दे सकता है। समानांतर ‘डरते’ के साथ ‘काँपते’ स्वाभाविक है और शारीरिक तथा श्रद्धामिश्रित भय दोनों को बनाए रखता है।
- source_word: אֲשֶׁר שַׂמְתִּי
  choice: मैंने ही
  rationale: שַׂמְתִּי स्पष्टतः प्रथम पुरुष एकवचन है। हिन्दी में नया वाक्य आरम्भ करके ‘मैंने ही’ कहना वक्ता और कर्ता की पहचान को सीधे तथा स्वाभाविक ढंग से व्यक्त करता है।
- source_word: חוֹל גְּבוּל לַיָּם
  choice: समुद्र के लिए रेत को सीमा ठहराया
  rationale: שׂים के साथ रेत वह वस्तु है जिसे समुद्र की सीमा बनाया गया है। ‘सीमा ठहराया’ नियुक्त और स्थिर किए जाने का भाव देता है।
- source_word: חָק עוֹלָם
  choice: सदा का एक नियम
  rationale: חֹק किसी निश्चित विधान, नियम या ठहराई हुई मर्यादा को और עוֹלָם उसकी स्थायी अवधि को व्यक्त करता है।
- source_word: וְלֹא יַעַבְרֶנְהוּ
  choice: जिसे वह लाँघ नहीं सकता
  rationale: एकवचन कर्ता समुद्र और प्रत्यय निर्धारित सीमा/नियम की ओर संकेत करता है। ‘लाँघना’ सीमा पार करने के चित्र को बनाए रखता है।
- source_word: וַיִּתְגָּעֲשׁוּ וְלֹא יוּכָלוּ
  choice: उसकी लहरें भले ही उमड़ें, वे प्रबल नहीं हो सकतीं
  rationale: געש उफनने, उमड़ने या उग्र होने का भाव देता है; יכל का शाब्दिक अर्थ ‘सक्षम होना’ है, और प्रसंग में सीमा पर विजय पाने में असमर्थता निहित है।
- source_word: וְהָמוּ גַלָּיו
  choice: वे भले ही गरजें
  rationale: המה लहरों के शोर या गर्जन को व्यक्त करता है। concessive ‘भले ही’ समानांतर विरोधी संरचना को स्वाभाविक हिन्दी में दर्शाता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में उपाधि नहीं, चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण हिन्दी लिप्यंतरण है और नाम को उपाधि से नहीं बदलता।
- issue: समुद्र की सीमा पर ईश्वरीय शासन
  choice: प्राकृतिक चित्र और ‘सदा के नियम’ की भाषा को यथावत रखा
  alternative: इसे केवल सृष्टि-विधान या केवल चमत्कारी नियंत्रण के रूप में स्पष्ट करना
  rationale: पद समुद्र पर परमेश्वर के नियंत्रण की घोषणा करता है, पर उसके कार्य-ढंग का दार्शनिक विवरण नहीं देता; इसलिए पाठ की काव्यात्मक और धर्मवैचारिक व्यापकता सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमामय और सार्वजनिक पाठ के अनुकूल रखी गई है। आलंकारिक प्रश्न, समुद्र-सीमा का काव्यात्मक चित्र और समानांतर ‘भले ही…’ संरचना सुरक्षित हैं। ‘याहवे’ को व्यक्तिगत नाम के रूप में रखा गया है; संप्रदायगत व्याख्या नहीं जोड़ी गई।
