source:
  edition: WLC
  text: וַ/אֲנִ֣י אָמַ֔רְתִּי אַךְ דַּלִּ֖ים הֵ֑ם נוֹאֲל֕וּ כִּ֣י לֹ֤א יָדְעוּ֙ דֶּ֣רֶךְ יְהוָ֔ה מִשְׁפַּ֖ט אֱלֹהֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/004.yaml
  text: But I said[a], “Surely these are only the poor; they are foolish, for they do not know the way of Yahweh, the justice of their God.”
translation:
  language: hi
  text: पर मैंने कहा, “निश्चय ही ये तो केवल गरीब लोग हैं; ये मूर्ख हैं, क्योंकि ये याहवे का मार्ग और अपने परमेश्वर का न्याय[a] नहीं जानते।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने परमेश्वर का न्यायिक निर्णय” या “अपने परमेश्वर का विधान।” इब्रानी शब्द का अर्थ न्याय, न्यायिक निर्णय या कोई विधिक अपेक्षा हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי אָמַרְתִּי
  choice: पर मैंने कहा
  rationale: वाक्य-संयोजक और स्पष्ट सर्वनाम पिछले प्रसंग से हटकर यिर्मयाह की अपनी प्रतिक्रिया सामने लाते हैं। ‘पर मैंने कहा’ इस हल्के विरोध और मूल क्रिया ‘कहना’—दोनों को बनाए रखता है।
- source_word: אַךְ דַּלִּים הֵם
  choice: निश्चय ही ये तो केवल गरीब लोग हैं
  rationale: אַךְ में निश्चय और सीमित करने—दोनों का भाव संभव है। ‘निश्चय ही’ और ‘तो केवल’ मिलकर वक्ता की धारणा तथा सीमित करने वाले बल को स्वाभाविक हिन्दी में व्यक्त करते हैं; דַּלִּים को सामाजिक-आर्थिक अर्थ में ‘गरीब लोग’ कहा गया है।
- source_word: נוֹאֲלוּ
  choice: ये मूर्ख हैं
  rationale: यह रूप मूर्ख होने या मूर्खतापूर्ण व्यवहार करने का अर्थ दे सकता है। कारण बताने वाले अगले उपवाक्य के साथ अवस्था-सूचक ‘मूर्ख हैं’ सहज और सटीक है।
- source_word: כִּי לֹא יָדְעוּ
  choice: क्योंकि ... नहीं जानते
  rationale: כִּי यहाँ उनके मूर्ख होने का कारण प्रस्तुत करता है; इसलिए ‘क्योंकि’ स्पष्ट और स्वाभाविक है।
- source_word: דֶּרֶךְ יְהוָה
  choice: याहवे का मार्ग
  rationale: ‘मार्ग’ मूल बाइबलीय रूपक को बनाए रखता है, जो याहवे की इच्छा, आचरण-पद्धति और उसके बताए जीवन-पथ की ओर संकेत कर सकता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय आधुनिक हिन्दी में ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: מִשְׁפַּט אֱלֹהֵיהֶם
  choice: अपने परमेश्वर का न्याय
  rationale: מִשְׁפָּט में न्याय, न्यायिक निर्णय या विधि/नियम के अर्थ संभव हैं। ‘न्याय’ इसके नैतिक-न्यायिक विस्तार को बनाए रखता है, जबकि अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे प्रयुक्त है। ‘याहवे’ उसका लिप्यंतरण करके नाम और उपाधि के भेद को सुरक्षित रखता है।
- issue: מִשְׁפַּט का अर्थ
  choice: न्याय
  alternative: न्यायिक निर्णय; विधान
  rationale: संदर्भ में यह परमेश्वर की न्यायपूर्ण व्यवस्था या अपेक्षा को सूचित कर सकता है। किसी एक कानूनी अर्थ को अनावश्यक रूप से निश्चित न करते हुए मुख्य पाठ में ‘न्याय’ रखा गया और वास्तविक अर्थ-विकल्प पादटिप्पणी में सुरक्षित किए गए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। अर्धविराम वक्ता की धारणा और उसके कारण के बीच स्पष्ट ठहराव देता है। मूल में दो निकटवर्ती पदबंधों को हिन्दी में स्वाभाविक बनाने के लिए ‘और’ जोड़ा गया है।
