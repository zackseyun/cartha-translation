id: JER.5.1
reference: Jeremiah 5:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: שׁוֹטְט֞וּ בְּ/חוּצ֣וֹת יְרוּשָׁלִַ֗ם וּ/רְאוּ נָ֤א וּ/דְעוּ֙ וּ/בַקְשׁ֣וּ בִ/רְחוֹבוֹתֶ֔י/הָ אִם תִּמְצְא֣וּ אִ֔ישׁ אִם יֵ֛שׁ עֹשֶׂ֥ה מִשְׁפָּ֖ט מְבַקֵּ֣שׁ אֱמוּנָ֑ה וְ/אֶסְלַ֖ח לָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/001.yaml
  text: Roam through the streets of Jerusalem[a], and please look and know, and search in her squares, whether you can find a man, whether there is one who does justice, who seeks faithfulness[b], and I will forgive her.
translation:
  language: hi
  text: “यरूशलेम की गलियों में इधर-उधर घूमो; ज़रा देखो, जानो, और उसके चौकों में खोजो कि क्या तुम्हें एक भी आदमी[a] मिलता है—क्या कोई ऐसा है जो न्याय करता और निष्ठा[b] की खोज करता हो; तब मैं यरूशलेम को क्षमा कर दूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में यहाँ एकवचन पुल्लिंग शब्द אִישׁ है, अर्थात् ‘एक आदमी’; आशय यह है कि ऐसा एक व्यक्ति भी मिल जाए तो पर्याप्त होगा।
    reason: lexical_alternative
  - marker: b
    text: या ‘सच्चाई’। इब्रानी אֱמוּנָה का अर्थ निष्ठा, विश्वसनीयता या सत्यता हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹטְטוּ
  choice: घूमो
  rationale: बहुवचन आज्ञार्थक क्रिया पूरे नगर में इधर-उधर घूमकर व्यापक खोज करने का भाव देती है।
- source_word: בְּחוּצוֹת
  choice: गलियों में
  rationale: नगर के बाहरी सार्वजनिक मार्गों के लिए ‘गलियाँ’ स्वाभाविक आधुनिक हिन्दी है और गति-सूचक क्रिया के साथ सहज बैठती है।
- source_word: וּרְאוּ נָא וּדְעוּ
  choice: ज़रा देखो, पता लगाओ
  rationale: נָא के विनम्र आग्रह को ‘ज़रा’ व्यक्त करता है; וּדְעוּ यहाँ केवल बौद्धिक ज्ञान नहीं, जाँचकर वास्तविक स्थिति जान लेने का भाव रखता है।
- source_word: בִּרְחוֹבוֹתֶיהָ
  choice: उसके चौकों में
  rationale: רְחֹבוֹת नगर के चौड़े सार्वजनिक स्थानों या चौकों को दर्शाता है; ‘उसके’ यरूशलेम के नगर-रूप संदर्भ को बनाए रखता है।
- source_word: אִם תִּמְצְאוּ אִישׁ אִם יֵשׁ
  choice: क्या तुम्हें एक भी आदमी मिलता है—कोई ऐसा
  rationale: दोहराई गई शर्त और एकवचन אִישׁ का बल इस बात पर है कि क्या ऐसा एक व्यक्ति भी मिल सकता है।
- source_word: עֹשֶׂה מִשְׁפָּט
  choice: जो न्याय करता
  rationale: यह पद आचरण में न्याय करने को बताता है; ‘न्याय करता’ संक्षिप्त और स्रोत के निकट है।
- source_word: מְבַקֵּשׁ אֱמוּנָה
  choice: निष्ठा खोजता
  rationale: אֱמוּנָה में विश्वसनीयता, निष्ठा और सत्यता के परस्पर जुड़े अर्थ हैं। ‘निष्ठा’ नैतिक और संबंधपरक स्थिरता को रखती है, जबकि वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: וְאֶסְלַח לָהּ
  choice: तब मैं उसे क्षमा कर दूँगा
  rationale: संदर्भ में וְ परिणामसूचक है। स्त्रीलिंग प्रत्यय का संदर्भ यरूशलेम नगरी से है; हिन्दी में उसके लिए स्वाभाविक सर्वनाम ‘उसे’ है।
theological_decisions:
- issue: एकवचन पुल्लिंग אִישׁ का प्रतिनिधिक अर्थ
  choice: एक भी आदमी
  alternative: एक भी व्यक्ति / कोई भी
  rationale: मुख्य पाठ स्रोत के एकवचन पुल्लिंग रूप को बनाए रखता है और ‘एक भी’ द्वारा इस खोज की तीव्रता व्यक्त करता है; इसका आशय केवल एक ऐसे व्यक्ति के मिलने की संभावना है।
- issue: नैतिक संदर्भ में אֱמוּנָה का अर्थ
  choice: निष्ठा
  alternative: सच्चाई / सत्यनिष्ठा / विश्वसनीयता
  rationale: यह शब्द निष्ठा, भरोसेमंदी और सत्यता के अर्थ-क्षेत्र को समेटता है। ‘निष्ठा’ संबंधपरक और नैतिक पहलू को बनाए रखती है, पर वास्तविक शाब्दिक अस्पष्टता पादटिप्पणी में सुरक्षित है।
- issue: क्षमा का लक्ष्य
  choice: उसे
  alternative: यरूशलेम को
  rationale: स्त्रीलिंग एकवचन प्रत्यय नगर यरूशलेम की ओर संकेत करता है। सर्वनाम स्रोत की नगर-व्यक्तिकरण शैली को स्पष्ट नाम दोहराए बिना बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में आज्ञाओं की तीव्रता और जाँच-पड़ताल की क्रमिक गति रखी गई है। भाषा सामान्य पाठक के लिए सहज किंतु गरिमापूर्ण है। ‘निष्ठा’ की वास्तविक अर्थगत व्यापकता को पादटिप्पणी में सुरक्षित रखा गया है।
