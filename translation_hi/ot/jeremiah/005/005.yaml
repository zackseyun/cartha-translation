base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/005.yaml
  text: I will go to the great men and speak to them[a], for they know the way of Yahweh, the justice of their God. But they too, together, have broken the yoke; they have torn off the bonds.
translation:
  language: hi
  text: मैं बड़े लोगों के पास जाऊँगा और उनसे बात करूँगा, क्योंकि वे याहवे का मार्ग और अपने परमेश्वर का न्याय[a] जानते हैं। परन्तु वे भी, सब मिलकर, जुआ तोड़ डाले हैं और बन्धन तोड़ डाले हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने परमेश्वर का निर्णय” अथवा “अपने परमेश्वर का विधि-विधान।” इब्रानी शब्द का अर्थ न्याय, निर्णय, विधि-विधान, या विधिक अपेक्षा हो सकता है।
    reason: lexical_alternative
