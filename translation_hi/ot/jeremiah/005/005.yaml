  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘बड़े लोगों’ से सामाजिक प्रतिष्ठा का भाव रखा गया है, और जुए तथा बन्धनों के समानान्तर रूपकों को व्याख्यात्मक विस्तार के बिना सुरक्षित रखा गया है।
