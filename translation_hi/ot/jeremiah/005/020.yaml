  text: הַגִּ֥ידוּ זֹ֖את בְּ/בֵ֣ית יַעֲקֹ֑ב וְ/הַשְׁמִיע֥וּ/הָ בִ/יהוּדָ֖ה לֵ/אמֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/020.yaml
  text: 'Declare this in the house of Jacob[a], and proclaim it in Judah, saying:'
translation:
  language: hi
  text: 'याकूब के घराने में यह घोषणा करो, और यहूदा में इसे सुनाओ[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “इसे सुनवाओ।”
    reason: कारणवाचक हिफ़ील रूप की शाब्दिक अभिव्यक्ति को सुरक्षित रखना।
lexical_decisions:
- source_word: הַגִּידוּ
  choice: घोषणा करो
  rationale: नגד के बहुवचन आज्ञार्थक रूप में सार्वजनिक रूप से संदेश बताने का भाव है; ‘घोषणा करो’ उसके औपचारिक और उद्घोषणात्मक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: זֹאת
  choice: यह
  rationale: स्त्रीलिंग एकवचन संकेतवाचक सर्वनाम आगे आने वाले संदेश की ओर संकेत करता है।
- source_word: בְּבֵית יַעֲקֹב
  choice: याकूब के घराने में
  rationale: ‘याकूब का घराना’ याकूब/इस्राएल के वंशजों के लिए सामूहिक पद है; ‘में’ उपसर्ग ב का सीधा अर्थ रखते हुए लोगों के बीच घोषणा किए जाने का भाव देता है।
- source_word: וְהַשְׁמִיעוּהָ
  choice: और ... इसे सुनाओ
  rationale: שמע का हिफ़ील बहुवचन आज्ञार्थक, स्त्रीलिंग एकवचन कर्म-प्रत्यय के साथ, शाब्दिक रूप से ‘इसे सुनवाओ/सुनाओ’ है। ‘इसे सुनाओ’ कारणवाचक अर्थ और स्पष्ट कर्म दोनों बनाए रखता है।
- source_word: בִיהוּדָה
  choice: यहूदा में
  rationale: ב का सामान्य स्थानवाचक अर्थ ‘में’ है; यहाँ संदेश को यहूदा के भीतर सार्वजनिक रूप से पहुँचाने की आज्ञा है।
- source_word: לֵאמֹר
  choice: ':'
  rationale: यह उद्धरणसूचक क्रियारूप अगले पद में आने वाली घोषणा का परिचय देता है। हिन्दी में द्विबिंदु यही कार्य अधिक स्वाभाविक ढंग से करता है।
