  text: שָׁמְנ֣וּ עָשְׁת֗וּ גַּ֚ם עָֽבְר֣וּ דִבְרֵי רָ֔ע דִּ֣ין לֹא דָ֔נוּ דִּ֥ין יָת֖וֹם וְ/יַצְלִ֑יחוּ וּ/מִשְׁפַּ֥ט אֶבְיוֹנִ֖ים לֹ֥א שָׁפָֽטוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/028.yaml
  text: They have grown fat[a]; they are sleek. They also have gone beyond evil words. They do not judge with justice the case of the fatherless, so that they might prosper[c][b], and they do not uphold the justice of the poor.
translation:
  language: hi
  text: वे मोटे हो गए हैं[a]; उनकी देह चिकनी हो गई है। उन्होंने बुराई की हदें भी पार कर दी हैं[b]। वे अनाथ[d] के मुकदमे में न्यायपूर्ण फैसला नहीं करते, और वे फलते-फूलते हैं[c]; वे निर्धनों को न्याय नहीं दिलाते।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मोटे हो गए हैं’ यहाँ उनकी समृद्धि और भोग-विलास का चित्र है।
    reason: metaphorical_sense
  - marker: b
    text: इब्रानी का शाब्दिक रूप है, ‘वे बुराई की बातों/मामलों से भी आगे निकल गए हैं’; इसका अर्थ ‘उन्होंने बुरे कामों की सारी हदें पार कर दी हैं’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: यह कठिन उपवाक्य ‘फिर भी वे फलते-फूलते हैं’ या ‘ताकि वे फलते-फूलते रहें’ भी समझा जा सकता है।
    reason: alternative_reading
  - marker: d
    text: ‘अनाथ’ के लिए इब्रानी शब्द का अधिक विशिष्ट अर्थ ‘पितृहीन’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְנוּ
  choice: वे मोटे हो गए हैं
  rationale: यह क्रिया समृद्धि और आत्म-भोग से उपजी मोटाई का ठोस भविष्यद्वक्तात्मक चित्र देती है; हिन्दी में मूल बिंब बनाए रखा गया है।
- source_word: עָשְׁתוּ
  choice: उनकी देह चिकनी हो गई है
  rationale: दुर्लभ क्रिया का आशय अच्छी तरह खाए-पिए व्यक्ति की चिकनी, चमकती देह से है। यह अनुवाद שָׁמְנוּ के समानांतर बाहरी समृद्धि का चित्र बनाए रखता है।
- source_word: גַּם עָבְרוּ דִבְרֵי רָע
  choice: उन्होंने बुराई की हदें भी पार कर दी हैं
  rationale: עבר सीमा लाँघने का बिंब देता है, जबकि דברי רע का अर्थ ‘बुरी बातें/मामले/काम’ हो सकता है। मुख्य पाठ में स्वाभाविक हिन्दी द्वारा असीम बुराई व्यक्त की गई है और शाब्दिक अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: דִּין לֹא דָנוּ דִּין יָתוֹם
  choice: वे अनाथ के मुकदमे में न्यायपूर्ण फैसला नहीं करते
  rationale: संज्ञा और उसी मूल की क्रिया वाली कानूनी अभिव्यक्ति को ‘मुकदमे’ और ‘न्यायपूर्ण फैसला’ से व्यक्त किया गया है। יָתוֹם पिता से वंचित बच्चे को सूचित करता है; आधुनिक हिन्दी में ‘अनाथ’ सहज और प्रतिष्ठित शब्द है।
- source_word: וְיַצְלִיחוּ
  choice: फिर भी फलते-फूलते हैं
  rationale: संक्षिप्त और कठिन वाक्य-विन्यास में क्रिया बहुवचन है और दुष्टों की निरंतर सफलता की ओर संकेत कर सकती है। ‘फिर भी’ संदर्भगत विरोध को स्पष्ट करता है, पर उद्देश्य/परिणाम वाले वैकल्पिक संबंध को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וּמִשְׁפַּט אֶבְיוֹנִים לֹא שָׁפָטוּ
  choice: वे निर्धनों को न्याय नहीं दिलाते
  rationale: מִשְׁפָּט यहाँ कानूनी अधिकार और न्याय दोनों को समेटता है। ‘न्याय नहीं दिलाते’ हिन्दी में असहाय निर्धनों के पक्ष में न्याय करने की जिम्मेदारी को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: יָתוֹם का अनुवाद
  choice: अनाथ
  alternative: पितृहीन
  rationale: मूल शब्द विशेष रूप से पिता से वंचित बच्चे को सूचित कर सकता है। ‘अनाथ’ सामान्य आधुनिक हिन्दी में स्पष्ट है, जबकि अधिक शाब्दिक ‘पितृहीन’ को पादटिप्पणी में रखा गया है।
- issue: וְיַצְלִיחוּ का पिछले उपवाक्य से संबंध
  choice: 'विरोधार्थक: ‘फिर भी फलते-फूलते हैं’'
  alternative: 'उद्देश्य/परिणामार्थक: ‘ताकि वे फलते-फूलते रहें’; अथवा ‘और वे फलते-फूलते हैं’'
  rationale: इब्रानी वाक्य-विन्यास संक्षिप्त और विवादित है। संदर्भ दुष्टों द्वारा न्याय दबाने के बावजूद उनकी सफलता का विरोधाभास समर्थित करता है, लेकिन अन्य सम्भव संबंध को पादटिप्पणी में स्पष्ट रूप से सुरक्षित रखा गया है।
