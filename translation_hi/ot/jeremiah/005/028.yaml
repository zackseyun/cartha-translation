  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। कानूनी संदर्भ के लिए ‘मुकदमा’, ‘न्यायपूर्ण फैसला’ और ‘न्याय दिलाना’ जैसे सामान्यतः समझे जाने वाले पद चुने गए हैं। भविष्यद्वक्तात्मक व्यंग्य और सामाजिक अन्याय का तीखापन बनाए रखा गया है।
