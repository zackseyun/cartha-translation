base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/013.yaml
  text: And the prophets will become wind[a], and the word is not in them; thus it will be done to them.
translation:
  language: hi
  text: और भविष्यद्वक्ता हवा के समान हो जाएँगे[a], और वचन उनमें नहीं है; उनके साथ ऐसा ही किया जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आत्मा” अथवा “श्वास।” इब्रानी शब्द רוּחַ के ये सभी अर्थ हो सकते हैं; यहाँ संभवतः भाव यह है कि भविष्यद्वक्ता खोखले या सारहीन हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנְּבִיאִים
  choice: और भविष्यद्वक्ता
  rationale: निश्चित बहुवचन संज्ञा को बिना अनावश्यक बल जोड़े स्वाभाविक और प्रतिष्ठित हिन्दी में रखा गया है।
- source_word: יִהְיוּ לְרוּחַ
  choice: हवा हो जाएँगे
  rationale: היה के साथ לְ यहाँ बनने या हो जाने का भाव देता है। רוּחַ का इस उपहासात्मक प्रसंग में मुख्य अर्थ ‘हवा’ उपयुक्त है, जबकि इसकी व्यापक अर्थ-सीमा पादटिप्पणी में सुरक्षित है।
- source_word: וְהַדִּבֵּר
  choice: और वचन
  rationale: यह रूप बोले गए वचन या संदेश की ओर संकेत करता है। ‘वचन’ मूल की संक्षिप्तता बनाए रखता है और अगले वाक्यांश के साथ स्वाभाविक है।
- source_word: אֵין בָּהֶם
  choice: उनमें नहीं है
  rationale: अस्तित्वसूचक निषेध और संबंधसूचक पद का सीधा अनुवाद है; इससे यह खुला रहता है कि उनमें सच्चा ईश्वरीय वचन नहीं है या कोई सारपूर्ण संदेश नहीं है।
- source_word: כֹּה יֵעָשֶׂה לָהֶם
  choice: उनके साथ ऐसा ही किया जाएगा
  rationale: निफ़अल का अवैयक्तिक कर्मवाच्य भाव सुरक्षित है और कर्ता को मूल पाठ की तरह अनिर्दिष्ट रखा गया है। ‘ऐसा ही’ כֹּה के परिणामसूचक बल को व्यक्त करता है।
theological_decisions:
- issue: भविष्यद्वक्ताओं की निंदा में רוּחַ का अर्थ
  choice: हवा
  alternative: आत्मा या साँस
  rationale: इस प्रसंग में भविष्यद्वक्ताओं को खोखला या सारहीन बताने के लिए ‘हवा’ सबसे स्वाभाविक है और इससे पवित्र आत्मा का अनावश्यक संकेत नहीं आता। फिर भी इब्रानी शब्द की वास्तविक बहुअर्थकता पादटिप्पणी में सुरक्षित रखी गई है।
- issue: वचन के अभाव का आशय
  choice: वचन उनमें नहीं है
  alternative: उनमें संदेश नहीं है
  rationale: शाब्दिक संरचना यह तनाव बनाए रखती है कि अभाव विशेष रूप से यहोवा के सच्चे वचन का है या व्यापक रूप से किसी सारपूर्ण संदेश का।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गंभीर और भविष्यद्वाणी-संबंधी गरिमा वाला रूप। ‘वचन’ बाइबलीय संदर्भ में परिचित है, जबकि वाक्य-विन्यास सामान्य पाठकों के लिए स्पष्ट रखा गया है।
