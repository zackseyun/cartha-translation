  yaml_path: translation/ot/jeremiah/005/016.yaml
  text: Their quiver is like an open grave[b][a]; all of them are mighty men.
translation:
  language: hi
  text: उसका तरकश[a] खुली कब्र के समान है; वे सभी पराक्रमी पुरुष[b] हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उनका तरकश’; इब्रानी में प्रत्यय एकवचन पुल्लिंग (‘उसका’) है, पर यहाँ वह आक्रमणकारी राष्ट्र के लिए सामूहिक रूप से प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘शूरवीर।’
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁפָּתוֹ
  choice: उसका तरकश
  rationale: אַשְׁפָּה का अर्थ ‘तरकश’ है और प्रत्यय व्याकरण की दृष्टि से तीसरे पुरुष एकवचन पुल्लिंग (‘उसका’) है। संदर्भ में यह आक्रमणकारी जाति को सामूहिक रूप से सूचित कर सकता है; इसलिए बहुवचन अर्थ को पादटिप्पणी में रखा गया है।
- source_word: כְּקֶבֶר פָּתוּחַ
  choice: खुली कब्र के समान
  rationale: כְּ तुलना व्यक्त करता है; קֶבֶר का सामान्य अर्थ ‘कब्र’ और פָּתוּחַ का अर्थ खुली अवस्था में होना है। यह पदबंध मूल उपमा की भयावहता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: כֻּלָּם
  choice: वे सब
  rationale: यह पूरे समूह की समग्रता पर बल देता है; ‘वे सब’ हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: גִּבּוֹרִים
  choice: वीर योद्धा
  rationale: यह शब्द यहाँ बलवान और युद्ध-कुशल पुरुषों को सूचित करता है। ‘वीर योद्धा’ संदर्भगत युद्धार्थ तथा पुल्लिंग बहुवचन दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: אַשְׁפָּתוֹ के एकवचन प्रत्यय और सामूहिक संदर्भ के बीच तनाव
  choice: मुख्य पाठ में ‘उसका तरकश’ रखकर रूपात्मक एकवचन को सुरक्षित रखा गया है।
  alternative: ‘उनके तरकश’—आक्रमणकारी जाति के सामूहिक संदर्भ के अनुसार।
  rationale: मूल इब्रानी का प्रत्यय एकवचन है, पर उसका संदर्भ सामूहिक हो सकता है। मुख्य पाठ और पादटिप्पणी दोनों संभावनाओं को बिना चुपचाप सुलझाए प्रस्तुत करते हैं।
- issue: גִּבּוֹרִים का पुल्लिंग और सैन्य अर्थ
  choice: वीर योद्धा
  alternative: शूरवीर
  rationale: संदर्भ आक्रमणकारी सेना के पुरुष लड़ाकों का है। चुना हुआ रूप शक्ति और युद्ध-संबंधी अर्थ दोनों को स्पष्ट रखता है, बिना किसी अतिरिक्त धर्मवैज्ञानिक अर्थ के।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘तरकश’ प्रचलित साहित्यिक शब्द है और युद्ध-संदर्भ में सामान्य पाठक के लिए बोधगम्य है। वाक्य की संक्षिप्तता और खुली कब्र की तीखी उपमा मूल के अनुरूप सुरक्षित हैं।
