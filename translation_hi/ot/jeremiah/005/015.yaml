source:
  edition: WLC
  text: הִנְ/נִ֣י מֵבִיא֩ עֲלֵי/כֶ֨ם גּ֧וֹי מִ/מֶּרְחָ֛ק בֵּ֥ית יִשְׂרָאֵ֖ל נְאֻם יְהֹוָ֑ה גּ֣וֹי אֵיתָ֣ן ה֗וּא גּ֤וֹי מֵ/עוֹלָם֙ ה֔וּא גּ֚וֹי לֹא תֵדַ֣ע לְשֹׁנ֔/וֹ וְ/לֹ֥א תִשְׁמַ֖ע מַה יְדַבֵּֽר־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/015.yaml
  text: Look[a], I am bringing against you a nation from far away, O house of Israel, declares Yahweh. It is a mighty nation; it is an ancient nation[b], a nation whose language you do not know[c], and whose speech you do not understand.
translation:
  language: hi
  text: “हे इस्राएल के घराने, देखो, मैं दूर से तुम्हारे विरुद्ध एक राष्ट्र ला रहा हूँ,” याहवे की घोषणा है। “वह एक शक्तिशाली राष्ट्र है, वह प्राचीन काल से चला आ रहा राष्ट्र है[a]—ऐसा राष्ट्र जिसकी भाषा तुम नहीं जानते और वह जो बोलता है, उसे तुम नहीं समझते[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “एक दृढ़” अथवा “एक स्थायी राष्ट्र”; “प्राचीन काल से चला आ रहा” का अर्थ “पुराने समय से अस्तित्व में रहा राष्ट्र” भी हो सकता है।
    reason: אֵיתָן के अर्थक्षेत्र में शक्ति, दृढ़ता और स्थायित्व शामिल हैं; מֵעוֹלָם राष्ट्र की प्राचीनता को सूचित करता है।
  - marker: b
    text: 'इब्रानी में शाब्दिक रूप से: “तुम उसकी जीभ [अर्थात भाषा] नहीं जानते, और वह जो बोलता है, उसे नहीं समझते।”'
    reason: לָשׁוֹן का शाब्दिक रूप ‘जीभ’ है, जो यहाँ भाषा के अर्थ में है; अंतिम खंड में बोलने की क्रिया स्पष्ट है।
lexical_decisions:
- source_word: הִנְנִי
  choice: देख, मैं
  rationale: यह पद एक गंभीर ईश्वरीय घोषणा आरम्भ करता है। ‘देख’ संकेतात्मक बल को आधुनिक और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: מֵבִיא עֲלֵיכֶם
  choice: तुम्हारे विरुद्ध ला रहा हूँ
  rationale: कृदन्त आसन्न क्रिया का भाव देता है और न्याय के प्रसंग में עַל का विरोधात्मक अर्थ है।
- source_word: גּוֹי
  choice: जाति
  rationale: यहाँ एक जातीय-राजनीतिक समुदाय अभिप्रेत है; मूल में इसकी पुनरावृत्ति को अलंकारिक बल के लिए बनाए रखा गया है।
- source_word: מִמֶּרְחָק
  choice: दूर देश से
  rationale: शाब्दिक अर्थ ‘दूर से’ है; हिन्दी में आक्रमणकारी जाति के आने के स्थानिक भाव को ‘दूर देश से’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: בֵּית יִשְׂרָאֵל
  choice: हे इस्राएल के घराने
  rationale: सम्बोधन का बल स्पष्ट रखते हुए पारम्परिक बाइबलीय सामुदायिक रूपक ‘घराना’ सुरक्षित रखा गया है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: नबी की वाणी में प्रयुक्त औपचारिक ईश्वरीय उद्घोषणा-सूत्र को गरिमापूर्ण और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: גּוֹי אֵיתָן
  choice: एक शक्तिशाली जाति
  rationale: אֵיתָן में शक्ति, दृढ़ता और स्थायित्व का अर्थक्षेत्र है; आक्रमण के प्रसंग में ‘शक्तिशाली’ प्रमुख भाव देता है।
- source_word: גּוֹי מֵעוֹלָם
  choice: प्राचीन काल से चली आ रही जाति
  rationale: מֵעוֹלָם यहाँ अनादिता नहीं, बहुत पुराने समय से अस्तित्व का संकेत देता है; यह रूप उस कालगत विस्तार को सुरक्षित रखता है।
- source_word: לֹא תֵדַע לְשֹׁנוֹ
  choice: जिसकी भाषा तुम नहीं जानते
  rationale: לָשׁוֹן का शाब्दिक अर्थ ‘जीभ’ है, पर यहाँ भाषा अभिप्रेत है; सापेक्ष उपवाक्य हिन्दी में स्वाभाविक है।
- source_word: וְלֹא תִשְׁמַע מַה יְדַבֵּר
  choice: जिसकी बातें तुम नहीं समझते
  rationale: שׁמע इस प्रसंग में केवल सुनने नहीं बल्कि अर्थ ग्रहण करने का भाव देता है; ‘बातें’ मूल के ‘वह जो बोले’ को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और किसी उपाधि से उसे प्रतिस्थापित नहीं करता।
- issue: מֵעוֹלָם का कालगत अर्थ
  choice: प्राचीन काल से चली आ रही
  alternative: अनादि; प्राचीन
  rationale: यहाँ राष्ट्र के बहुत पुराने अस्तित्व की बात है, उसके शाश्वत या अनादि होने की नहीं; अतः ऐसा रूप चुना गया है जो धर्मवैज्ञानिक अतिशयोक्ति से बचे।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण भविष्यवाणी-संबंधी शैली। मूल में ‘जाति’ की तीन बार पुनरावृत्ति और सीधे सम्बोधन को बनाए रखा गया है। सामान्य पाठक के लिए भाषा सहज रखी गई है, जबकि काव्यात्मक गम्भीरता और स्रोत की सम्भावित अर्थ-व्याप्ति पादटिप्पणियों में सुरक्षित है।
