reference: Jeremiah 5:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: שִׁמְעוּ נָ֣א זֹ֔את עַ֥ם סָכָ֖ל וְ/אֵ֣ין לֵ֑ב עֵינַ֤יִם לָ/הֶם֙ וְ/לֹ֣א יִרְא֔וּ אָזְנַ֥יִם לָ/הֶ֖ם וְ/לֹ֥א יִשְׁמָֽעוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/021.yaml
  text: Hear this now[a], foolish people without understanding, who have eyes but do not see, who have ears but do not hear.
translation:
  language: hi
  text: अब यह सुनो, हे मूर्ख और समझहीन[a] लोगो! तुम्हारी आँखें हैं, पर तुम देखते नहीं; तुम्हारे कान हैं, पर तुम सुनते नहीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मूर्ख लोग, जिनमें हृदय नहीं।” यहाँ “हृदय” समझ और विवेक की भीतरी क्षमता को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ נָא זֹאת
  choice: अब यह सुनो
  rationale: बहुवचन आज्ञार्थक שִׁמְעוּ भविष्यद्वक्ता की सीधी पुकार है। נָא यहाँ विनम्र ‘कृपया’ से अधिक आग्रह और तात्कालिकता प्रकट करता है, जिसे ‘अब’ स्वाभाविक रूप से व्यक्त करता है; זֹאת को अनावश्यक विस्तार किए बिना ‘यह’ रखा गया है।
- source_word: עַם סָכָל
  choice: हे मूर्ख ... लोगो
  rationale: עַם सामूहिक रूप से संबोधित लोगों को दर्शाता है। हिंदी में प्रत्यक्ष संबोधन के लिए ‘हे ... लोगो’ स्वाभाविक है। סָכָל केवल बौद्धिक कमी नहीं, बल्कि नैतिक और आत्मिक मूर्खता भी सूचित करता है, इसलिए ‘मूर्ख’ उपयुक्त है।
- source_word: וְאֵין לֵב
  choice: और समझहीन
  rationale: इब्रानी לֵב यहाँ शारीरिक हृदय या केवल भावना नहीं, बल्कि समझ और विवेक की भीतरी क्षमता को दर्शाता है। ‘समझहीन’ इस मुहावरे का अर्थ स्पष्ट रखता है, जबकि शाब्दिक रूप पाद-टिप्पणी में दिया गया है।
- source_word: עֵינַיִם לָהֶם וְלֹא יִרְאוּ
  choice: तुम्हारी आँखें हैं, पर तुम देखते नहीं
  rationale: यह अनुवाद शारीरिक इंद्रिय के होते हुए भी वास्तविक ग्रहणशीलता न होने का विरोधाभास बनाए रखता है और प्रत्यक्ष संबोधन को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: אָזְנַיִם לָהֶם וְלֹא יִשְׁמָעוּ
  choice: तुम्हारे कान हैं, पर तुम सुनते नहीं
  rationale: यह पिछले खंड की समानांतर रचना को बनाए रखता है। ‘सुनते’ आरंभ के ‘सुनो’ के साथ मूल पाठ की जानबूझकर रखी गई शब्द-प्रतिध्वनि भी सुरक्षित रखता है।
theological_decisions:
- issue: לֵב का मानवशास्त्रीय मुहावरा
  choice: समझहीन
  alternative: हृदयहीन / जिनमें हृदय नहीं
  rationale: इस संदर्भ में दोष भावनात्मक कठोरता तक सीमित नहीं, बल्कि आत्मिक और नैतिक समझ तथा विवेक का अभाव है। ‘समझहीन’ अर्थ स्पष्ट करता है, और शाब्दिक ‘हृदय’ को पाद-टिप्पणी में सुरक्षित रखा गया है।
- issue: सामूहिक एकवचन עַם
  choice: लोगो
  alternative: प्रजा / जाति
  rationale: संबोधन यहूदा के लोगों से सामूहिक रूप में है। ‘लोगो’ आधुनिक हिंदी में प्रत्यक्ष संबोधन के लिए सहज है और मूल में आवश्यक न होने वाला राजनीतिक या जातीय अर्थ नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिंदी में सीधा, गंभीर और भविष्यद्वक्ताई संबोधन रखा गया है। ‘आँखें...देखते नहीं’ और ‘कान...सुनते नहीं’ की समानांतरता तथा आरंभ और अंत में ‘सुनो/सुनते’ की विडंबनापूर्ण प्रतिध्वनि सुरक्षित है।
