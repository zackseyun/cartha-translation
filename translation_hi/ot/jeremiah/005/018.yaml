id: JER.5.18
reference: Jeremiah 5:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/גַ֛ם בַּ/יָּמִ֥ים הָ/הֵ֖מָּה נְאֻם יְהֹוָ֑ה לֹֽא אֶעֱשֶׂ֥ה אִתְּ/כֶ֖ם כָּלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/018.yaml
  text: Yet even in those days[a], declares Yahweh, I will not make a full end of you.
translation:
  language: hi
  text: फिर भी उन दिनों में—याहवे की यह घोषणा है—मैं तुम्हें पूरी तरह नष्ट नहीं करूँगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मैं तुम्हारा पूर्ण अन्त नहीं करूँगा।”
    reason: मूल इब्रानी मुहावरे की अधिक शब्दशः रचना बताने के लिए।
lexical_decisions:
- source_word: וְגַם
  choice: फिर भी
  rationale: संयोजक और बलवाचक कण यहाँ पहले घोषित कठोर न्याय के बावजूद शेष रहने की बात पर बल देते हैं; ‘फिर भी’ प्रसंग के विरोधात्मक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בַּיָּמִים הָהֵמָּה
  choice: उन दिनों में
  rationale: यह चर्चा में आए न्याय के समय की ओर संकेत करने वाली सामान्य कालवाचक अभिव्यक्ति है और भविष्यद्वाणी की शैली को बनाए रखती है।
- source_word: נְאֻם יְהוָה
  choice: याहवे की यह घोषणा है
  rationale: यह नबूवत का गंभीर और अधिकारपूर्ण सूत्र है; ‘घोषणा’ उसके औपचारिक स्वर को आधुनिक, सहज हिन्दी में बनाए रखती है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय देवनागरी में उसके प्रचलित लिप्यंतरण द्वारा प्रस्तुत किया गया है।
- source_word: לֹא אֶעֱשֶׂה אִתְּכֶם כָּלָה
  choice: मैं तुम्हें पूरी तरह नष्ट नहीं करूँगा
  rationale: עשה और כלה का संयुक्त मुहावरा पूर्ण विनाश या समूल अन्त करने को दर्शाता है। हिन्दी में ‘पूरी तरह नष्ट करना’ अर्थ को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है, जबकि शाब्दिक रचना पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: व्यक्तिगत नाम को नाम के रूप में ही रखा गया है; इससे किसी उपाधि द्वारा मूल नाम को प्रतिस्थापित नहीं किया जाता और कोई संप्रदायगत अर्थ भी आरोपित नहीं होता।
- issue: न्याय और संरक्षण के बीच तनाव
  choice: मैं तुम्हें पूरी तरह नष्ट नहीं करूँगा
  alternative: मैं तुम्हारा पूर्ण अन्त नहीं करूँगा
  rationale: वचन आने वाले कठोर न्याय को रद्द नहीं करता, पर लोगों के समूल विनाश का निषेध करता है। यह अनुवाद न्याय की वास्तविकता और ईश्वरीय संयम—दोनों को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गंभीर भविष्यद्वाणी-संबंधी स्वर के साथ रखी गई है। मुख्य वाक्य में स्वाभाविक हिन्दी मुहावरे का प्रयोग है, और मूल इब्रानी की शब्दशः अभिव्यक्ति पादटिप्पणी में दी गई है।
