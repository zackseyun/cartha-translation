source:
  edition: WLC
  text: כִּי נִמְצְא֥וּ בְ/עַמִּ֖/י רְשָׁעִ֑ים יָשׁוּר֙ כְּ/שַׁ֣ךְ יְקוּשִׁ֔ים הִצִּ֥יבוּ מַשְׁחִ֖ית אֲנָשִׁ֥ים יִלְכֹּֽדוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/026.yaml
  text: For wicked men are found among my people[a]; they lie in wait like fowlers. They set a trap[b]; they catch men.
translation:
  language: hi
  text: क्योंकि मेरी प्रजा में दुष्ट लोग पाए जाते हैं; वे चिड़ीमारों की तरह घात लगाए रहते हैं। वे विनाशकारी फंदा[a] लगाते हैं; वे मनुष्यों को पकड़ते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘विनाश का साधन।’ इब्रानी संज्ञा किसी विनाशकारी वस्तु को दर्शाती है; यहाँ चिड़ीमारों के रूपक में यह लोगों को पकड़ने के लिए लगाए गए फंदे की ओर संकेत करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले आरोप का कारण या स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ उस संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: נִמְצְאוּ בְעַמִּי רְשָׁעִים
  choice: मेरी प्रजा में दुष्ट लोग पाए गए हैं
  rationale: निफ़अल रूप की परिणामात्मक/निष्क्रिय धारणा और समुदाय के भीतर उनकी उपस्थिति, दोनों सुरक्षित रहते हैं।
- source_word: יָשׁוּר כְּשַׁךְ יְקוּשִׁים
  choice: वे चिड़ीमारों की तरह घात लगाए रहते हैं
  rationale: इब्रानी वाक्यांश कठिन है। यह अनुवाद छिपकर शिकार की प्रतीक्षा करने का भाव और चिड़ीमारों से की गई उपमा बनाए रखता है, बिना किसी अनिश्चित शारीरिक मुद्रा को मुख्य पाठ में जोड़ने के।
- source_word: הִצִּיבוּ מַשְׁחִית
  choice: वे विनाशकारी फंदा लगाते हैं
  rationale: הִצִּיבוּ के लिए ‘लगाते हैं’ फंदे के प्रसंग में स्वाभाविक है। מַשְׁחִית का विनाशकारी अर्थ भी बचाया गया है और शिकार-रूपक के अनुसार ‘फंदा’ स्पष्ट किया गया है।
- source_word: אֲנָשִׁים יִלְכֹּדוּ
  choice: वे मनुष्यों को पकड़ते हैं
  rationale: אֲנָשִׁים का मानवीय लक्ष्य और לכד का पकड़ने वाला शिकार-संबंधी अर्थ सीधे व्यक्त होते हैं।
theological_decisions:
- issue: परमेश्वर की वाचा-प्रजा के भीतर दुष्टों की उपस्थिति
  choice: ‘मेरी प्रजा में’ को यथावत रखा गया
  alternative: ‘मेरे लोगों के बीच’
  rationale: प्रथम पुरुष संबंध और समुदाय के भीतर के नैतिक विरोधाभास को बनाए रखना आवश्यक है; पाठ यह तनाव स्वयं प्रस्तुत करता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। ‘चिड़ीमार’ शिकार-रूपक को संक्षेप में व्यक्त करता है; ‘घात लगाए रहते हैं’ छिपकर प्रतीक्षा करने का भाव देता है। कठिन इब्रानी वाक्यांश की अनिश्चितता को निर्णयात्मक विस्तार से नहीं भरा गया है।
