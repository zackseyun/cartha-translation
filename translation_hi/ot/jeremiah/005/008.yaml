  yaml_path: translation/ot/jeremiah/005/008.yaml
  text: They were well-fed[a], lusty stallions; each one neighing after his neighbor’s wife.
translation:
  language: hi
  text: 'वे खूब खिलाए-पिलाए, कामातुर[a] घोड़े थे;

    हर एक अपने पड़ोसी की पत्नी के पीछे हिनहिनाता था।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस कठिन इब्रानी शब्द का अनुवाद संभवतः ‘जो सवेरे ही निकल पड़ते थे’ भी हो सकता है। पूरे पदबंध का अर्थ ‘खूब खिलाए-पिलाए घोड़े, जो सवेरे ही निकल पड़ते थे’ भी समझा गया है; ‘कामातुर’ प्रसंग में उनकी यौन-लालसा को व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: סוּסִים
  choice: घोड़े
  rationale: मूल संज्ञा का सामान्य अर्थ ‘घोड़े’ है। प्रसंग में नर घोड़ों की यौन-उत्तेजना स्पष्ट है, पर मूल से अधिक विशिष्ट ‘नर घोड़े’ जोड़ना आवश्यक नहीं।
- source_word: מְיֻזָּנִים
  choice: खाए-पिए
  rationale: यह कर्मवाच्य कृदंत अच्छी तरह खिलाए-पिलाए, पुष्ट पशुओं का चित्र देता है। ‘खाए-पिए’ सहज हिन्दी में उनकी तृप्त और हृष्ट-पुष्ट दशा व्यक्त करता है।
- source_word: מַשְׁכִּים
  choice: कामातुर
  rationale: यह कठिन रूप है और इसका संबंध ‘सवेरे उठने/निकलने’ से भी माना गया है। तत्काल यौन-संदर्भ में ‘कामातुर’ चित्र का आशय स्वाभाविक रूप से व्यक्त करता है, जबकि शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: אִישׁ
  choice: हर एक
  rationale: एकवचन का यहाँ वितरणात्मक प्रयोग है; ‘हर एक’ प्रत्येक पुरुष को अलग-अलग दोषी ठहराने का बल बनाए रखता है।
- source_word: אֶל אֵשֶׁת רֵעֵהוּ
  choice: अपने पड़ोसी की पत्नी के पीछे
  rationale: ‘के पीछे’ वासना से प्रेरित इच्छा और पीछा करने का भाव स्वाभाविक हिन्दी में देता है तथा व्यभिचार का संदर्भ स्पष्ट रखता है।
- source_word: יִצְהָלוּ
  choice: हिनहिनाता था
  rationale: क्रिया घोड़े की आवाज़ बताती है। वितरणात्मक ‘हर एक’ के साथ एकवचन ‘हिनहिनाता था’ हिन्दी में स्वाभाविक है और पशु-रूपक को सुरक्षित रखता है।
