source:
  edition: WLC
  text: כִּֽחֲשׁוּ֙ בַּ/יהוָ֔ה וַ/יֹּאמְר֖וּ לֹא ה֑וּא וְ/לֹא תָב֤וֹא עָלֵ֨י/נוּ֙ רָעָ֔ה וְ/חֶ֥רֶב וְ/רָעָ֖ב ל֥וֹא נִרְאֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/012.yaml
  text: They have denied Yahweh and said, “He is not there, and no disaster will come upon us; we will not see sword or famine.”
translation:
  language: hi
  text: उन्होंने यहोवा को नकार दिया और कहा, “वह नहीं है[a], और हम पर कोई विपत्ति नहीं आएगी; हम न तलवार देखेंगे, न अकाल।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह कुछ नहीं करेगा,” अथवा शाब्दिक रूप से, “यह वह नहीं है।” इब्रानी कथन बहुत संक्षिप्त है और उसका सटीक आशय अनिश्चित है।
    reason: alternative_reading
lexical_decisions:
- source_word: כִּחֲשׁוּ בַּיהוָה
  choice: यहोवा का इनकार किया
  rationale: ב के साथ כחשׁ यहाँ यहोवा को नकारने या उसके प्रति झूठा सिद्ध होने का भाव रखता है। आगे उसके न्यायकारी कार्य का निषेध होने के कारण ‘इनकार किया’ प्रसंग के अनुकूल है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के वाचिक नाम को हिन्दी में प्रचलित रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: לֹא הוּא
  choice: वह है ही नहीं
  rationale: मूल वाक्य अत्यंत संक्षिप्त और अर्थगर्भित है। यह रूप व्यक्ति-सूचक सर्वनाम और तीखे निषेध को बनाए रखता है, पर उसके अस्तित्व, उपस्थिति या कार्य में से किसी एक अर्थ को अंतिम रूप से निर्धारित नहीं करता।
- source_word: רָעָה
  choice: विपत्ति
  rationale: भविष्यद्वाणी के न्याय-संदर्भ में यह शब्द नैतिक बुराई के बजाय आनेवाली हानि या आपदा को दर्शाता है; ‘विपत्ति’ स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: חֶרֶב
  choice: तलवार
  rationale: ठोस न्याय-चित्र को बनाए रखने के लिए शाब्दिक रूप रखा गया है; प्रसंग में यह युद्ध और हिंसक विनाश का भी संकेत देता है।
- source_word: רָעָב
  choice: अकाल
  rationale: यहाँ आशय केवल व्यक्तिगत भूख नहीं, बल्कि व्यापक अभाव और न्यायस्वरूप अकाल से है।
- source_word: לֹא נִרְאֶה
  choice: हम न ... देखेंगे
  rationale: ראה के प्रथम पुरुष बहुवचन रूप का स्वाभाविक हिन्दी अनुवाद रखा गया है; यहाँ ‘देखना’ का अर्थ अनुभव करना भी है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: व्यक्तिगत वाचा-नाम को सामान्य उपाधि ‘प्रभु’ से नहीं बदला गया। आधुनिक हिन्दी बाइबलीय प्रयोग में ‘यहोवा’ व्यापक रूप से पहचाना जाता है।
- issue: संक्षिप्त कथन לֹא הוּא का अर्थ
  choice: वह है ही नहीं
  alternative: वह कुछ नहीं करेगा / यह उसका काम नहीं है
  rationale: इब्रानी कथन अस्तित्व, उपस्थिति अथवा प्रभावी कार्य के निषेध की अनुमति देता है। मुख्य पाठ उसकी संक्षिप्तता और धर्मवैचारिक तनाव को बचाता है, जबकि अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘है ही नहीं’ बोलचाल में बोधगम्य है, साथ ही मूल के तीखे और संक्षिप्त निषेध को व्यक्त करता है। समानांतर अंतिम पद को ‘न ... न ...’ से स्वाभाविक हिन्दी लय दी गई है।
