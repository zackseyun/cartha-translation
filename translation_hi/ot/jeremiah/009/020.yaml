translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। मृत्यु को घर में घुसने वाले व्यक्ति के रूप में दिखाने वाला मूल बिंब सुरक्षित है। पद की समानांतर संरचना—छोटे बच्चे/जवान और बाहर/चौक—स्पष्ट रखी गई है।
