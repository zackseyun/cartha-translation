id: JER.9.20
reference: Jeremiah 9:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּֽי עָ֤לָה מָ֨וֶת֙ בְּ/חַלּוֹנֵ֔י/נוּ בָּ֖א בְּ/אַרְמְנוֹתֵ֑י/נוּ לְ/הַכְרִ֤ית עוֹלָל֙ מִ/ח֔וּץ בַּחוּרִ֖ים מֵ/רְחֹבֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/020.yaml
  text: For death has climbed in through our windows[a]; it has entered our palaces, to cut off the child from outside[b], the young men from the streets.
translation:
  language: hi
  text: क्योंकि मृत्यु हमारी खिड़कियों से चढ़कर भीतर आ गई है; वह हमारे महलों में घुस आई है, ताकि बाहर से छोटे बच्चों को और चौकों से युवकों को मिटा डाले।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले संदर्भ में विलाप के आह्वान का कारण बताता है और इब्रानी के कारणसूचक/व्याख्यात्मक बल को स्वाभाविक हिन्दी में रखता है।
- source_word: עָלָה מָוֶת בְּחַלּוֹנֵינוּ
  choice: मृत्यु हमारी खिड़कियों से चढ़कर भीतर आ गई है
  rationale: עָלָה के चढ़ने वाले सजीव बिंब और खिड़कियों के रास्ते भीतर प्रवेश—दोनों को सुरक्षित रखता है; मृत्यु का मानवीकरण भी बना रहता है।
- source_word: בָּא בְּאַרְמְנוֹתֵינוּ
  choice: वह हमारे महलों में घुस आई है
  rationale: בָּא प्रवेश को व्यक्त करता है, जबकि אַרְמוֹנוֹת राजसी अथवा दृढ़ आवासों को सूचित करता है; 'घुस आई' अनधिकृत आक्रमण का प्रभाव स्वाभाविक ढंग से देता है।
- source_word: לְהַכְרִית
  choice: मिटा डाले
  rationale: हिफ़ील रूप का अर्थ यहाँ नाश करके किसी को उस स्थान से समाप्त कर देना है। हिन्दी में 'मिटा डाले' कठोर विनाशकारी बल को सहजता से व्यक्त करता है।
- source_word: עוֹלָל
  choice: छोटे बच्चों को
  rationale: यह शब्द बहुत छोटे बच्चे या शिशु को सूचित कर सकता है। रूप एकवचन है, पर समानांतर सामूहिक प्रयोग और हिन्दी की स्वाभाविकता के कारण बहुवचन 'छोटे बच्चों' से वर्गगत अर्थ व्यक्त किया गया है।
- source_word: מִחוּץ
  choice: बाहर से
  rationale: स्थानगत अर्थ को सीधे रखता है और अगले पदबंध के नगर के सार्वजनिक स्थानों से समानांतरता बनाए रखता है।
- source_word: בַּחוּרִים
  choice: जवानों को
  rationale: यह विवाह या युद्ध की आयु के युवा पुरुषों को सूचित करता है; 'जवान' आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है, बिना उन्हें अनिवार्य रूप से सैनिक ठहराए।
- source_word: מֵרְחֹבוֹת
  choice: चौकों से
  rationale: רְחֹבוֹת नगर के चौड़े सार्वजनिक स्थानों या चौकों को सूचित कर सकता है। 'चौकों' से खुले नागर सार्वजनिक स्थल का अर्थ स्पष्ट रहता है।
