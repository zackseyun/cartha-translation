base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/002.yaml
  text: They bend their tongue[a] like their bow for falsehood, and not for faithfulness have they grown strong in the land; for from evil to evil they go out, and they do not know me[b], declares Yahweh.
translation:
  language: hi
  text: वे अपनी जीभ को धनुष की तरह झूठ के लिए तानते हैं[a]। वे देश में निष्ठा के बल पर प्रबल नहीं हुए; क्योंकि वे बुराई से बुराई की ओर बढ़ते जाते हैं, और मुझे नहीं जानते[b]—यह याहवे की घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में ‘जीभ’ और ‘धनुष’ का संबंध अत्यंत संक्षिप्त ढंग से व्यक्त है; इसे ‘वे झूठ के लिए अपनी जीभ को अपने धनुष की भाँति तानते हैं’ भी समझा जा सकता है।
    reason: syntactic_ambiguity
  - marker: b
    text: “मुझे नहीं जानते” में याहवे को संबंध और वाचा के स्तर पर पहचानने तथा स्वीकार करने का भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּדְרְכוּ
  choice: तानते हैं
  rationale: דרך धनुष के प्रसंग में उसे चलाने के लिए तानने का अर्थ देता है। ‘तानते हैं’ आधुनिक हिन्दी में युद्ध-संबंधी रूपक को स्पष्ट और स्वाभाविक रखता है।
- source_word: לְשׁוֹנָם
  choice: अपनी जीभ
  rationale: हिब्रू में संज्ञा एकवचन और सामूहिक अर्थ में है। हिन्दी में ‘अपनी जीभ’ स्रोत की वचन-संरचना और वाणी को हथियार बताने वाले रूपक दोनों को बनाए रखता है।
- source_word: קַשְׁתָּם
  choice: धनुष की तरह
  rationale: संक्षिप्त हिब्रू विन्यास में ‘जीभ’ और ‘उनका धनुष’ पास-पास रखे गए हैं। हिन्दी में ‘धनुष की तरह’ निहित उपमा को स्पष्ट करता है, पर रूपक को व्याख्या में नहीं बदलता।
- source_word: שֶׁקֶר
  choice: झूठ के लिए
  rationale: שׁקר झूठ, मिथ्यापन और छल का व्यापक बोध देता है। अमूर्त ‘झूठ’ अगले खंड की ‘निष्ठा’ के साथ नैतिक विरोध को बनाए रखता है।
- source_word: לֶאֱמוּנָה
  choice: निष्ठा के द्वारा
  rationale: אֱמוּנָה यहाँ स्थिरता, विश्वसनीयता और निष्ठा का बोध देता है। ‘निष्ठा’ केवल बौद्धिक सत्य नहीं, बल्कि भरोसेमंद आचरण का नैतिक पक्ष भी व्यक्त करती है। संबंधसूचक ל को इस वाक्य में साधन/आधार के रूप में स्वाभाविक हिन्दी दी गई है।
- source_word: גָּבְרוּ
  choice: प्रबल नहीं हुए
  rationale: גבר का अर्थ बलवान या प्रबल होना है। यह अनुवाद उनकी सामाजिक शक्ति और इस विडंबना को बनाए रखता है कि वह निष्ठा पर आधारित नहीं थी।
- source_word: בָאָרֶץ
  choice: देश में
  rationale: यिर्मयाह के संदर्भ में ‘देश’ वाचा-समाज और उसकी भूमि को सूचित करता है; यहाँ पूरे पृथ्वी-जगत का अर्थ अपेक्षित नहीं है।
- source_word: מֵרָעָה אֶל רָעָה
  choice: बुराई से बुराई की ओर
  rationale: स्रोत की आवृत्तिमूलक संरचना को रखते हुए यह लगातार बढ़ती या आगे बढ़ती दुष्टता व्यक्त करता है।
- source_word: יָצָאוּ
  choice: बढ़ते जाते हैं
  rationale: יצא का मूल अर्थ निकलना है, पर इस मुहावरे में एक बुराई से अगली बुराई की ओर निरंतर गति अभिप्रेत है। शाब्दिक ‘निकलते हैं’ की अपेक्षा ‘बढ़ते जाते हैं’ आधुनिक हिन्दी में अर्थ को स्वाभाविक रूप से संप्रेषित करता है।
- source_word: יָדָעוּ
  choice: मुझे नहीं जानते
  rationale: ידע ज्ञान के साथ संबंधपरक पहचान और स्वीकार को भी समेट सकता है। मुख्य पाठ में व्यापक और निकटतर ‘जानते’ रखा गया है; वाचागत अर्थ-छाया टिप्पणी में बताई गई है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: नबी-संबंधी सूत्र की गंभीर और अधिकारपूर्ण शक्ति को आधुनिक, प्रतिष्ठित हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार-अक्षरीय दिव्य नाम को किसी उपाधि से बदलने के बजाय हिन्दी में उसके प्रचलित ध्वन्यात्मक लिप्यंतरण ‘याहवे’ से प्रस्तुत किया गया है।
theological_decisions:
- issue: ‘मुझे जानना’ का संबंधपरक और वाचागत अर्थ
  choice: मुझे नहीं जानते
  alternative: मुझे नहीं मानते / मुझे स्वीकार नहीं करते
  rationale: ידע को केवल बौद्धिक जानकारी या केवल औपचारिक स्वीकार तक सीमित करना उसके व्यापक अर्थ को संकरा कर देता। ‘जानते’ मूल की धार्मिक और संबंधपरक अर्थ-गहनता तथा तनाव को खुला रखता है।
- issue: אֱמוּנָה का नैतिक अर्थ
  choice: निष्ठा
  alternative: सत्य / ईमानदारी / विश्वासयोग्यता
  rationale: झूठ के विरोध में यहाँ भरोसेमंद और सच्चे आचरण का भाव है। ‘निष्ठा’ इस नैतिक-संबंधपरक आयाम को बनाए रखती है, बिना इसे किसी विशिष्ट सम्प्रदायगत ‘विश्वास’ की अवधारणा बना देने के।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है—गरिमापूर्ण, पर सामान्य पाठक के लिए सुबोध। धनुष और जीभ का युद्ध-संबंधी रूपक बनाए रखा गया है। हिब्रू की संक्षिप्त उपमा को मुख्य पाठ में हल्का स्पष्ट किया गया है और वैकल्पिक वाक्य-विन्यास पादटिप्पणी में सुरक्षित है।
