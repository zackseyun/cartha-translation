id: JER.9.6
reference: Jeremiah 9:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת הִנְ/נִ֥י צוֹרְפָ֖/ם וּ/בְחַנְתִּ֑י/ם כִּֽי אֵ֣יךְ אֶעֱשֶׂ֔ה מִ/פְּנֵ֖י בַּת עַמִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/006.yaml
  text: 'Therefore[a], thus says Yahweh of hosts: Behold, I am refining them and testing them[b], for how else can I act because of the daughter of my people?'
translation:
  language: hi
  text: 'इसलिए सेनाओं का यहोवा यों कहता है: “देखो, मैं उन्हें तपाकर शुद्ध कर रहा हूँ और उनकी परख कर रहा हूँ, क्योंकि मेरी प्रजा की बेटी[a] के कारण मैं और क्या करूँ?[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शाब्दिक रूप से “मेरी प्रजा की बेटी” है। यह भविष्यद्वक्ताओं की भाषा में स्नेह और वाचा के संबंध को दर्शाने वाली अभिव्यक्ति है; आशय “मेरी प्रजा” या “मेरी प्रिय प्रजा” भी समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: इसे “मैं उसके साथ और कैसे व्यवहार करूँ?” या “मैं इसके सिवा क्या करूँ?” भी अनूदित किया जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पूर्ववर्ती भ्रष्टाचार के परिणामस्वरूप आने वाली घोषणा को स्पष्ट रूप से जोड़ता है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम को लिप्यंतरित रखते हुए צְבָאוֹת की व्यापक सैन्य अर्थ-छवि को सुरक्षित करता है।
- source_word: הִנְנִי
  choice: देखो, मैं
  rationale: हिब्रू की संकेतात्मक और बलाघाती शक्ति को स्वाभाविक, गंभीर आधुनिक हिन्दी में व्यक्त करता है।
- source_word: צוֹרְפָם
  choice: उन्हें तपाकर शुद्ध कर रहा हूँ
  rationale: צרף के धातु-शोधन रूपक को बनाए रखता है; केवल ‘शुद्ध करना’ कहने से रूपक लुप्त हो जाता। הִנְנִי के साथ वर्तमान प्रगतिशील भाव रखा गया है।
- source_word: וּבְחַנְתִּים
  choice: और परख रहा हूँ
  rationale: בחן की जाँचने या कसौटी पर परखने की धारणा को स्पष्ट हिन्दी में व्यक्त करता है और धातु-शोधन की निकटवर्ती छवि से मेल खाता है।
- source_word: כִּי אֵיךְ אֶעֱשֶׂה
  choice: क्योंकि ... मैं और क्या कर सकता हूँ?
  rationale: अलंकारिक प्रश्न और विवश प्रतिक्रिया के भाव को स्वाभाविक हिन्दी में बनाए रखता है, बिना उसके धर्मवैज्ञानिक आशय को अतिरिक्त रूप से निर्धारित किए।
- source_word: מִפְּנֵי
  choice: के कारण
  rationale: इस प्रसंग में कारण या अवसर बताने वाला सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: בַּת עַמִּי
  choice: अपनी प्रजा की बेटी
  rationale: भविष्यद्वक्ताओं में प्रयुक्त पारिवारिक और वाचागत भाव वाले हिब्रू मुहावरे को समतल किए बिना सुरक्षित रखता है; अर्थ स्पष्ट करने के लिए पादटिप्पणी दी गई है।
theological_decisions:
- issue: בַּת עַמִּי का भविष्यद्वाणी-संबंधी पारिवारिक मुहावरा
  choice: अपनी प्रजा की बेटी
  alternative: अपनी प्रजा; अपनी प्रिय प्रजा
  rationale: शाब्दिक छवि पाठ के स्नेह, पीड़ा और वाचा-संबंधी तनाव को बनाए रखती है। अधिक सहज अर्थ पादटिप्पणी में दिया गया है।
- issue: כִּי אֵיךְ אֶעֱשֶׂה की अलंकारिक शक्ति
  choice: मैं और क्या कर सकता हूँ?
  alternative: मैं और कैसे व्यवहार करूँ?; मैं इसके सिवा क्या करूँ?
  rationale: यह अनुवाद न्यायपूर्ण प्रतिक्रिया की अनिवार्यता का अलंकारिक भाव रखता है, पर परमेश्वर की सामर्थ्य या विवशता के विषय में पाठ से आगे कोई सिद्धांत नहीं जोड़ता।
- issue: הִנְנִי צוֹרְפָם וּבְחַנְתִּים का काल-पक्ष
  choice: मैं ... शुद्ध कर रहा हूँ और परख रहा हूँ
  alternative: मैं ... शुद्ध करूँगा और परखूँगा
  rationale: הִנְנִי के साथ आए कृदन्त का आसन्न या आरंभ हो रही क्रिया वाला बल वर्तमान प्रगतिशील रूप से व्यक्त किया गया है; हिब्रू संयोजन के कारण भविष्याभिमुख पाठ भी संभव है।
translation_notes:
  register: भाषा आधुनिक, गंभीर और सार्वजनिक पाठ के योग्य रखी गई है। “यों कहता है” भविष्यद्वाणी की औपचारिक घोषणा को व्यक्त करता है; “तपाकर शुद्ध करना” धातु-शोधन की मूल छवि को सामान्य पाठक के लिए बोधगम्य बनाता है। पादटिप्पणी-चिह्न उन्हीं वाक्यांशों पर लगाए गए हैं जिनकी वे व्याख्या करते हैं।
