  to: 'इसलिए सेनाओं का यहोवा यों कहता है: “देखो, मैं उन्हें तपाकर शुद्ध कर रहा हूँ और उनकी परख कर रहा हूँ, क्योंकि मेरी प्रजा की बेटी[a] के कारण मैं और क्या करूँ?[b]”'
