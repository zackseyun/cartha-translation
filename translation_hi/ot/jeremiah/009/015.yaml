source:
  edition: WLC
  text: וַ/הֲפִֽצוֹתִי/ם֙ בַּ/גּוֹיִ֔ם אֲשֶׁר֙ לֹ֣א יָֽדְע֔וּ הֵ֖מָּה וַֽ/אֲבוֹתָ֑/ם וְ/שִׁלַּחְתִּ֤י אַֽחֲרֵי/הֶם֙ אֶת הַ/חֶ֔רֶב עַ֥ד כַּלּוֹתִ֖/י אוֹתָֽ/ם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/015.yaml
  text: And I will scatter them among the nations that neither they nor their fathers have known[c][b][a], and I will send the sword after them until I have consumed them.
translation:
  language: hi
  text: और मैं उन्हें उन जातियों के बीच तितर-बितर कर दूँगा, जिन्हें न वे जानते थे, न उनके पिता[a]; और मैं उनके पीछे तलवार[b] भेजूँगा, जब तक कि मैं उनका अंत न कर दूँ।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उनके पिता।” या, व्यापक अर्थ में, “उनके पुरखे।”
    reason: lexical_alternative
  - marker: b
    text: बाइबल में “तलवार” प्रायः युद्ध या घातक न्याय का चित्र है।
    reason: cultural_note
  - marker: c
    text: 'अन्य सम्भव अनुवाद: “जब तक कि मैं उन्हें नष्ट न कर दूँ” या “जब तक कि मैं उन्हें पूरी तरह समाप्त न कर दूँ।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲפִצוֹתִים
  choice: और मैं उन्हें ... तितर-बितर कर दूँगा
  rationale: हिफ़ील रूप का अर्थ ‘छितराना/तितर-बितर करना’ है। यह स्वाभाविक हिन्दी में जबरन बिखेर दिए जाने का न्याय-संदर्भ बनाए रखता है।
- source_word: בַּגּוֹיִם
  choice: जातियों के बीच
  rationale: גּוֹיִם का सामान्य अर्थ ‘जातियाँ/राष्ट्र’ है। ‘जातियों’ यहाँ विदेशी जनसमूहों को दर्शाता है; ‘ग़ैर-यहूदी’ जैसा बाद का धार्मिक भेद इसमें नहीं जोड़ा गया।
- source_word: אֲשֶׁר לֹא יָדְעוּ הֵמָּה וַאֲבוֹתָם
  choice: जिन्हें न वे जानते थे, न उनके पुरखे
  rationale: יָדַע यहाँ परिचित होने का भाव रखता है। हिन्दी की ‘न...न...’ रचना निषेध का दायरा स्पष्ट करती है, और ‘पुरखे’ אֲבוֹתָם की वंशगत भावना को सहज रूप में व्यक्त करता है।
- source_word: וְשִׁלַּחְתִּי אַחֲרֵיהֶם אֶת־הַחֶרֶב
  choice: और मैं उनके पीछे तलवार भेजूँगा
  rationale: ‘भेजना’, ‘पीछे’ और ‘तलवार’—तीनों मूल के ठोस चित्र को बनाए रखते हैं; युद्ध अथवा घातक न्याय का अर्थ मुख्य पाठ में खोलकर नहीं रखा गया।
- source_word: עַד כַּלּוֹתִי אוֹתָם
  choice: जब तक कि मैं उनका अंत न कर दूँ
  rationale: כלה का अर्थ पूरा करना, समाप्त करना अथवा अंत कर देना है। यह हिन्दी में कठोर न्याय का आशय स्पष्ट करता है, पर ‘भस्म करना’ जैसी ऐसी छवि नहीं जोड़ता जो मूल क्रिया में अनिवार्य नहीं है।
theological_decisions:
- issue: אֲבוֹתָם का संबंधसूचक अनुवाद
  choice: उनके पुरखे
  alternative: उनके पिता
  rationale: शाब्दिक रूप से शब्द ‘पिता’ है, किंतु बहुवचन वंशगत संदर्भ में ‘पुरखे’ आधुनिक हिन्दी में स्वाभाविक है। पादटिप्पणी शाब्दिक रूप सुरक्षित रखती है।
- issue: ‘तलवार’ का लाक्षणिक अर्थ
  choice: तलवार
  alternative: युद्ध / घातक न्याय
  rationale: मूल का ठोस बिंब सुरक्षित रखा गया है; इसे मुख्य पाठ में केवल युद्ध या दैवी न्याय कहकर उसकी काव्यात्मक और धर्मवैचारिक व्यापकता सीमित नहीं की गई।
- issue: כלה की परिणति
  choice: उनका अंत कर दूँ
  alternative: उन्हें नष्ट कर दूँ / उन्हें पूरी तरह समाप्त कर दूँ
  rationale: यह अभिव्यक्ति मूल की ‘समाप्ति तक पहुँचाने’ की कठोरता रखती है, जबकि क्रिया को किसी अधिक विशिष्ट विनाश-छवि में नहीं बाँधती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य में भविष्यकालीन दैवी घोषणा, पीछा करती ‘तलवार’ का बिंब और अंतिम विनाश की कठोरता सुरक्षित हैं। पादटिप्पणी-चिह्न मुख्य पाठ में क्रम से उपस्थित हैं।
