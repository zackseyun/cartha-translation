  text: חֵ֥ץ שוחט לְשׁוֹנָ֖/ם מִרְמָ֣ה דִבֵּ֑ר בְּ/פִ֗י/ו שָׁל֤וֹם אֶת רֵעֵ֨/הוּ֙ יְדַבֵּ֔ר וּ/בְ/קִרְבּ֖/וֹ יָשִׂ֥ים אָרְבּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/007.yaml
  text: Their tongue is a slaughtering arrow[a]; it speaks deceit. With his mouth each man speaks peace to his neighbor[c][b], but within himself he sets his ambush.
translation:
  language: hi
  text: उनकी जीभ मार डालनेवाला तीर है[a]; वह छल बोलती है। हर एक अपने मुँह से अपने पड़ोसी से शान्ति की बात करता है[b], पर अपने भीतर वह घात लगाता है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘जानलेवा तीर’ अथवा ‘वध करनेवाला तीर’। इब्रानी शब्द केवल तीर की धार नहीं, बल्कि उसके प्राणघातक उद्देश्य पर बल देता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से ‘अपने पड़ोसी से शान्ति बोलता है’; अर्थात वह मित्रतापूर्ण और शान्तिपूर्ण बातें करता है।
    reason: cultural_note
  - marker: c
    text: या ‘अपने भीतर वह अपनी घात लगाता है’। इब्रानी में यह स्पष्ट नहीं किया गया कि घात किसके लिए लगाई गई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵץ שוחט
  choice: घात करनेवाला तीर
  rationale: חֵץ का सीधा अर्थ ‘तीर’ है और שוחט वध या जान लेने के आशय को उभारता है। ‘घात करनेवाला’ हिंसक और प्राणघातक बिंब को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: לְשׁוֹנָם
  choice: उनकी जीभ
  rationale: इब्रानी में सामूहिक एकवचन है; हिन्दी में ‘उनकी जीभ’ सामूहिक आरोप को सहज रूप से व्यक्त करता है।
- source_word: מִרְמָה דִבֵּר
  choice: वह छल बोलती है
  rationale: מִרְמָה छल या कपट को सूचित करता है। क्रिया का कर्ता रूपक में ‘जीभ’ है, इसलिए हिन्दी में स्त्रीलिंग ‘वह ... बोलती है’ स्वाभाविक है।
- source_word: בְּפִיו
  choice: अपने मुँह से
  rationale: בְּ यहाँ साधन का बोध देता है। ‘अपने मुँह से’ बाहरी वाणी और भीतरी मंशा के विरोध को स्पष्ट रखता है।
- source_word: שָׁלוֹם אֶת רֵעֵהוּ יְדַבֵּר
  choice: अपने पड़ोसी से शान्ति की बात करता है
  rationale: שָׁלוֹם को ‘शान्ति’ और רֵעַ को ‘पड़ोसी’ दिया गया है। अपूर्ण क्रिया यहाँ आदतन व्यवहार बताती है, इसलिए सामान्य वर्तमान काल उपयुक्त है।
- source_word: וּבְקִרְבּוֹ
  choice: पर अपने भीतर
  rationale: यह बाहरी शान्तिपूर्ण वाणी के विपरीत आन्तरिक मंशा को दर्शाता है। ‘अपने भीतर’ इस विरोध को संक्षिप्त और स्वाभाविक ढंग से रखता है।
- source_word: יָשִׂים אָרְבּוֹ
  choice: वह घात लगाता है
  rationale: אָרְבּוֹ घात या छिपकर प्रतीक्षा करने की योजना को सूचित करता है। हिन्दी मुहावरा ‘घात लगाना’ अर्थ और चित्र दोनों को सहजता से व्यक्त करता है, जबकि लक्ष्य को अनकहा छोड़ता है।
