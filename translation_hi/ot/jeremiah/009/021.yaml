  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: דַּבֵּ֗ר כֹּ֚ה נְאֻם יְהוָ֔ה וְ/נָֽפְלָה֙ נִבְלַ֣ת הָֽ/אָדָ֔ם כְּ/דֹ֖מֶן עַל פְּנֵ֣י הַ/שָּׂדֶ֑ה וּ/כְ/עָמִ֛יר מֵ/אַחֲרֵ֥י הַ/קֹּצֵ֖ר וְ/אֵ֥ין מְאַסֵּֽף־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/021.yaml
  text: 'Speak: Thus says Yahweh[a], “The corpse of man will fall like dung on the face of the field, and like a sheaf behind the reaper, with no one to gather it.”'
translation:
  language: hi
  text: 'कह: याहवे[a] यों कहता है, “मनुष्य की लाश[b] खेत की सतह पर गोबर के समान गिर पड़ेगी, और कटाई करनेवाले के पीछे पड़ी पूली के समान होगी; उसे बटोरनेवाला कोई न होगा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'हिब्रू में परमेश्वर का निज नाम: याहवे (יהוה)।'
    reason: divine_name
  - marker: b
    text: या “मानवजाति की लाश।” हिब्रू में ‘मनुष्य’ एकवचन है, पर यहाँ वह सामान्य रूप से मानवता का प्रतिनिधित्व कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: बोल
  rationale: पुल्लिंग एकवचन आज्ञार्थक क्रिया की सीधी आज्ञा को संक्षिप्त और स्वाभाविक रूप में रखता है।
- source_word: נְאֻם יְהוָה
  choice: यहोवा यों कहता है
  rationale: भविष्यद्वाणी की संदेशवाहक-अभिव्यक्ति को आधुनिक, गरिमापूर्ण हिन्दी में प्रस्तुत करता है; परमेश्वर का निज नाम लिप्यंतरित है।
- source_word: וְנָפְלָה
  choice: गिर पड़ेगी
  rationale: भविष्यद्वाणी में पूर्ण क्रिया आनेवाले निश्चित न्याय की घोषणा करती है; ‘गिर पड़ेगी’ उसकी तीव्रता भी बनाए रखता है।
- source_word: נִבְלַת הָאָדָם
  choice: मनुष्य की लोथ
  rationale: निर्माण-संबंध और एकवचन आदम की प्रतिनिधिक व्यापकता को बनाए रखते हुए मृत्यु का कठोर दृश्य व्यक्त करता है।
- source_word: כְדֹמֶן
  choice: गोबर के समान
  rationale: कृषि-संबंधी और जानबूझकर अपमानजनक उपमा को नरम किए बिना स्पष्ट रखता है।
- source_word: עַל פְּנֵי הַשָּׂדֶה
  choice: मैदान की सतह पर
  rationale: हिब्रू मुहावरे का अर्थ स्वाभाविक हिन्दी में देता है और खुले में पड़े रहने का चित्र बचाता है।
- source_word: וּכְעָמִיר מֵאַחֲרֵי הַקֹּצֵר
  choice: काटनेवाले के पीछे पड़ी पूली के समान
  rationale: कटाई के चित्र में עָמִיר को बँधे या इकट्ठे कटे डंठलों की पूली के रूप में प्रस्तुत करता है; ‘पीछे पड़ी’ स्थानिक और परिणामी दोनों भावों को व्यक्त करता है।
- source_word: וְאֵין מְאַסֵּף
  choice: उसे बटोरनेवाला कोई न होगा
  rationale: हिब्रू अस्तित्व-वाक्य को स्वाभाविक हिन्दी में रखता है और शव के त्यक्त, बिना दफन पड़े रहने का निहित भाव बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में निज वाचा-नाम सीधे आया है। हिन्दी में व्यापक रूप से पहचाना जाने वाला ‘यहोवा’ उसका लिप्यंतरण है; पादटिप्पणी ‘याहवे’ उच्चारण भी बताती है।
- issue: הָאָדָם की प्रतिनिधिक एकवचनता
  choice: मनुष्य
  alternative: मानवजाति
  rationale: हिब्रू में एकवचन संज्ञा है जो यहाँ सामान्य या प्रतिनिधिक अर्थ रख सकती है। मुख्य पाठ स्रोत का एकवचन बनाए रखता है और पादटिप्पणी उसकी व्यापकता स्पष्ट करती है।
- issue: מְאַסֵּף में बटोरने का निहितार्थ
  choice: उसे बटोरनेवाला कोई न होगा
  alternative: उसे दफनानेवाला कोई न होगा
  rationale: मूल क्रिया ‘बटोरना/इकट्ठा करना’ है। केवल ‘दफनाना’ कहना संभावित संदर्भगत निहितार्थ को क्रिया का प्रत्यक्ष अर्थ बना देता; इसलिए तनाव और कृषि-रूपक दोनों सुरक्षित रखे गए हैं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर भविष्यद्वाणी की गंभीरता और कठोर न्याय-चित्र को बनाए रखा गया है। ‘लोथ’, ‘गोबर’ और ‘पूली’ जैसे ठोस शब्द मूल की ग्रामीण तथा अपमानजनक छवि को बिना नरम किए व्यक्त करते हैं।
