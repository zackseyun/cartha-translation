reference: Jeremiah 9:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/נָתַתִּ֧י אֶת יְרוּשָׁלִַ֛ם לְ/גַלִּ֖ים מְע֣וֹן תַּנִּ֑ים וְ/אֶת עָרֵ֧י יְהוּדָ֛ה אֶתֵּ֥ן שְׁמָמָ֖ה מִ/בְּלִ֖י יוֹשֵֽׁב־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/010.yaml
  text: And I will make Jerusalem a heap of ruins[a], a haunt of jackals; and I will make the cities of Judah a desolation[c][b], without inhabitant.
translation:
  language: hi
  text: “मैं यरूशलेम को मलबे के ढेर[a] और गीदड़ों का बसेरा[b] बना दूँगा; और यहूदा के नगरों को उजाड़ बना दूँगा, जहाँ कोई न बसेगा[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “खंडहरों के ढेर।”
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी: तन्नीम; परम्परागत रूप से इसका अनुवाद “अजगरों” के रूप में भी हुआ है, पर उजाड़ के इस संदर्भ में सम्भवतः “गीदड़” अभिप्रेत हैं।'
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “निवासी के बिना।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי / אֶתֵּן
  choice: बना दूँगा
  rationale: נתן का मूल अर्थ ‘देना/रखना’ है, पर यहाँ परिणाम बताने वाले पूरकों के साथ इसका भाव किसी स्थान को एक दशा में पहुँचा देना है। ‘बना दूँगा’ आधुनिक हिन्दी में इस परिणामकारी अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְרוּשָׁלִַם
  choice: यरूशलेम
  rationale: स्थान-नाम का हिन्दी में प्रचलित लिप्यंतरण।
- source_word: לְגַלִּים
  choice: मलबे के ढेर
  rationale: बहुवचन संज्ञा גלים यहाँ ध्वस्त नगर के पत्थर-मलबे के ढेरों की छवि प्रस्तुत करती है। यह हिन्दी में स्पष्ट और दृश्यात्मक है।
- source_word: מְעוֹן
  choice: बसेरा
  rationale: शब्द का अर्थ निवास-स्थान है। उजड़े नगर में जंगली पशुओं के रहने के संदर्भ में ‘बसेरा’ सहज और अर्थनिष्ठ है।
- source_word: תַּנִּים
  choice: गीदड़ों
  rationale: भविष्यद्वाणी के उजाड़-संदर्भों में यह बहुवचन प्रायः गीदड़ों को सूचित करता है; यह उजड़े स्थानों में रहने वाले जंगली पशुओं की छवि के अनुकूल है।
- source_word: עָרֵי יְהוּדָה
  choice: यहूदा के नगरों
  rationale: सम्बन्धसूचक इब्रानी संरचना का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: שְׁמָמָה
  choice: उजाड़
  rationale: यह संज्ञा वीरानी और विनाश की दशा बताती है। ‘ऐसा उजाड़ बना दूँगा’ हिन्दी में वाक्य-संरचना को स्वाभाविक रखते हुए उस दशा को व्यक्त करता है।
- source_word: מִבְּלִי יוֹשֵׁב
  choice: जहाँ कोई न बसेगा
  rationale: शाब्दिक भाव ‘बिना निवासी/बसने वाले के’ है। सम्बन्धवाचक हिन्दी वाक्यांश अर्थ को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: न्याय-वचन में दोहराए गए נתן से व्यक्त कर्तृत्व
  choice: ‘बना दूँगा’ द्वारा परमेश्वर की वह क्रिया व्यक्त की गई है जो नगरों को विनाश और उजाड़ की दशा में पहुँचा देती है।
  alternative: अधिक शब्दानुरूप ‘दे दूँगा’ या ‘रख दूँगा’।
  rationale: ‘दे दूँगा’ हिन्दी में यहाँ अस्पष्ट और अस्वाभाविक होता। ‘बना दूँगा’ इब्रानी के परिणामकारी भाव को व्यक्त करता है और पाठ से परे कोई अतिरिक्त धर्मवैज्ञानिक दावा नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मलबे के ढेर’ विनाश की ठोस छवि देता है, जबकि ‘बसेरा’ जंगली पशुओं द्वारा उजड़े नगर को अपना निवास बना लेने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
