  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: עַל הֶ֨/הָרִ֜ים אֶשָּׂ֧א בְכִ֣י וָ/נֶ֗הִי וְ/עַל נְא֤וֹת מִדְבָּר֙ קִינָ֔ה כִּ֤י נִצְּתוּ֙ מִ/בְּלִי אִ֣ישׁ עֹבֵ֔ר וְ/לֹ֥א שָׁמְע֖וּ ק֣וֹל מִקְנֶ֑ה מֵ/ע֤וֹף הַ/שָּׁמַ֨יִם֙ וְ/עַד בְּהֵמָ֔ה נָדְד֖וּ הָלָֽכוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/009.yaml
  text: Over the mountains I will lift up weeping and wailing[a], and over the pastures of the wilderness a lament, because they are laid waste so that no man passes through, and they do not hear the sound of livestock. From the birds of the heavens to the beasts, they have fled[c][b]; they are gone.
translation:
  language: hi
  text: पहाड़ों पर मैं रोना और विलाप उठाऊँगा, और मरुभूमि की चरागाहों पर शोक-विलाप करूँगा; क्योंकि वे जलकर ऐसी उजाड़ हो गई हैं कि कोई वहाँ से होकर नहीं गुजरता, और मवेशियों की आवाज़ सुनाई नहीं देती। आकाश के पक्षियों से लेकर पशुओं तक, सब भटककर चले गए हैं; वे जा चुके हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶשָּׂא
  choice: मैं ... उठाऊँगा
  rationale: נשׂא का मूल बिंब ‘उठाना’ है; रोने और विलाप के साथ यह विलाप आरम्भ करने या ऊँचा स्वर करने का मुहावरा है। हिंदी में ‘विलाप उठाऊँगा’ उस बिंब को बनाए रखता है।
- source_word: בְכִי וָנֶהִי
  choice: रोना और विलाप
  rationale: दोनों शोकसूचक संज्ञाओं का भेद रखते हुए सहज, गरिमापूर्ण हिंदी दी गई है।
- source_word: נְאוֹת מִדְבָּר
  choice: मरुभूमि की चरागाहें
  rationale: נְאוֹת यहाँ पशुओं के चरने के स्थान हैं; आगे मवेशियों के उल्लेख से यह अर्थ पुष्ट होता है।
- source_word: קִינָה
  choice: शोकगीत
  rationale: यह औपचारिक मातमी विलाप को दर्शाता है और पहले आए सामान्य ‘विलाप’ से कुछ भेद बनाए रखता है।
- source_word: נִצְּתוּ
  choice: उजाड़ पड़ी हैं
  rationale: निष्क्रिय क्रिया विनाश या झुलसकर वीरान होने को व्यक्त कर सकती है। मुख्य पाठ में व्यापक परिणाम रखा गया है; आग से जलने की संभावित ठोस छवि पादटिप्पणी में संरक्षित है।
- source_word: מִבְּלִי אִישׁ עֹבֵר
  choice: कोई वहाँ से होकर नहीं गुजरता
  rationale: אִישׁ यहाँ सामान्यतः किसी भी व्यक्ति के लिए है; यह हिंदी में स्वाभाविक ढंग से पूर्ण निर्जनता व्यक्त करता है।
- source_word: קוֹל מִקְנֶה
  choice: मवेशियों की आवाज़
  rationale: קוֹל ध्वनि या आवाज़ और מִקְנֶה पालतू पशुधन को सूचित करता है।
- source_word: מֵעוֹף הַשָּׁמַיִם וְעַד בְּהֵמָה
  choice: आकाश के पक्षियों से लेकर पशुओं तक
  rationale: ‘से लेकर ... तक’ मूल के विस्तारसूचक विन्यास को सुरक्षित रखता है; בְּהֵמָה यहाँ स्थलचर पशुओं के लिए व्यापक शब्द है।
- source_word: נָדְדוּ הָלָכוּ
  choice: दूर चले गए हैं; वे जा चुके हैं
  rationale: दोनों क्रियाओं को अलग रखकर मूल की तीव्र पुनरुक्ति और पूर्ण प्रस्थान का भाव सुरक्षित किया गया है।
