review_pass:
  verdict: revise
  source_fidelity: The draft conveys the overall devastation and the disappearance of animals, but it weakens the concrete passive force of נִצְּתוּ ('have been burned/scorched') in the main text. It also renders the second lament as 'शोकगीत गाऊँगा,' which introduces singing, not expressed by the Hebrew.
  naturalness: The Hindi is generally clear and appropriately elevated. However, 'पहाड़ों के लिए' and 'चरागाहों के लिए' are less apt for the Hebrew locative/concerning construction, and 'वे ऐसी उजाड़ पड़ी हैं' is awkward in this context. The revision is more idiomatic while retaining the poetic-prophetic register.
  terminology: '''मरुभूमि की चरागाहों,'' ''मवेशियों,'' and ''आकाश के पक्षियों'' are suitable modern-standard Hindi choices. ''शोक-विलाप'' accurately represents קִינָה without adding the notion of singing.'
  issues:
  - severity: medium
    issue: '''शोकगीत गाऊँगा'' adds an action absent from the source.'
    rationale: קִינָה means a lament/dirge; the Hebrew says the speaker will raise or make a lament, not specifically sing one.
  - severity: medium
    issue: The main text 'उजाड़ पड़ी हैं' does not represent the likely burning/scorching sense of נִצְּתוּ.
    rationale: The verb has a concrete destructive, likely fire-related force. A broad 'laid waste' reading is possible, but should be retained as the alternative rather than replacing the source’s more specific image in the main text.
  - severity: low
    issue: '''पहाड़ों के लिए'' and ''चरागाहों के लिए'' can imply benefaction rather than lamentation over/concerning those places.'
    rationale: Using 'पर' better reflects the Hebrew על and creates a natural Hindi poetic setting for the lament.
