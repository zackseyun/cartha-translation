base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/014.yaml
  text: 'Therefore thus says Yahweh of Armies[a], the God of Israel: Behold, I am feeding this people wormwood[b], and I will make them drink poisoned water.'
translation:
  language: hi
  text: 'इसलिए सेनाओं के याहवे, इस्राएल के परमेश्वर, यों कहते हैं: “देखो, मैं इस प्रजा को नागदौना[a] खिला रहा हूँ और उन्हें विषैला पानी[b] पिलाऊँगा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कड़वाहट”; इब्रानी शब्द एक बहुत कड़वे पौधे, नागदौना, का नाम है, जिसे प्रायः न्याय के बिंब के रूप में प्रयोग किया जाता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “विष का पानी”; पारंपरिक अनुवाद “पित्त का पानी” भी मिलता है।
    reason: lexical_alternative
