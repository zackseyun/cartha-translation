- issue: ईश्वरीय उपाधि יְהוָה צְבָאוֹת का अनुवाद
  choice: सेनाओं के याहवे
  alternative: सेनाओं के प्रभु
  rationale: मूल पाठ में वाचा का विशिष्ट नाम יְהוָה है; इसलिए उसे सामान्य उपाधि में बदलने के बजाय ‘याहवे’ के रूप में सुरक्षित रखा गया है। צְבָאוֹת को पारंपरिक किन्तु कम स्पष्ट ‘गणों’ के बजाय ‘सेनाओं’ से अनूदित किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और भविष्यद्वाणी की घोषणा के अनुरूप रखी गई है। ‘यों कहते हैं’ औपचारिक किन्तु सामान्यतः समझ में आने वाला सूत्र है। मुख्य पाठ में पौधे और विषैले पानी के ठोस बिंब सुरक्षित रखे गए हैं।
