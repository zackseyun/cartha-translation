id: JER.9.24
reference: Jeremiah 9:24
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הִנֵּ֛ה יָמִ֥ים בָּאִ֖ים נְאֻם יְהוָ֑ה וּ/פָ֣קַדְתִּ֔י עַל כָּל מ֖וּל בְּ/עָרְלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/024.yaml
  text: Look[a], days are coming, declares Yahweh[b], when I will punish everyone circumcised only in foreskin.
translation:
  language: hi
  text: “देखो, ऐसे दिन आ रहे हैं,” याहवे की यह घोषणा है, “जब मैं हर उस खतना किए हुए व्यक्ति को दंड दूँगा जो फिर भी खतनारहित है[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “हर खतना किए हुए को खतनारहित अवस्था में।” इसका अनुवाद “खतना किए हुओं को खतनारहितों के साथ” भी हो सकता है। यह असामान्य इब्रानी अभिव्यक्ति जानबूझकर एक विरोधाभास प्रस्तुत करती है।
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह शब्द आने वाली गंभीर घोषणा की ओर ध्यान खींचता है; ‘देखो’ आधुनिक और स्वाभाविक हिन्दी में उसका बल बनाए रखता है।
- source_word: יָמִים בָּאִים
  choice: ऐसे दिन आ रहे हैं
  rationale: यह भविष्य में होने वाली ईश्वरीय कार्रवाई की परिचित भविष्यद्वाणी-सूचक अभिव्यक्ति है। ‘ऐसे’ हिन्दी में आगे बताई जाने वाली घटना से इसे स्वाभाविक रूप से जोड़ता है।
- source_word: נְאֻם יְהוָה
  choice: याहवे की यह घोषणा है
  rationale: नְאֻם एक गंभीर, अधिकारपूर्ण ईश्वरीय कथन का सूत्र है। יְהוָה को उपाधि से बदलने के बजाय व्यक्तिगत नाम ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: וּפָקַדְתִּי עַל
  choice: मैं … को दंड दूँगा
  rationale: न्याय के इस प्रसंग में פקד על का अर्थ दंडात्मक रूप से लेखा लेना है; ‘दंड दूँगा’ इसे स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כָּל מוּל
  choice: हर उस खतना किए हुए व्यक्ति को
  rationale: מוּל यहाँ संज्ञा के समान प्रयुक्त है और खतना किए हुए लोगों को दर्शाता है। ‘हर’ עַל כָּל की व्यापकता बनाए रखता है।
- source_word: בְּעָרְלָה
  choice: जो फिर भी खतनारहित है
  rationale: यह जानबूझकर विरोधाभासी अभिव्यक्ति बाहरी खतने के बावजूद बनी हुई ‘खतनारहित’ दशा बताती है। ‘फिर भी’ विरोध को स्पष्ट करता है, पर उसे सीधे ‘हृदय का खतना न होना’ कहकर व्याख्यायित नहीं करता।
theological_decisions:
- issue: מוּל בְּעָרְלָה की विरोधाभासी न्याय-अभिव्यक्ति
  choice: खतना किए हुए व्यक्ति … जो फिर भी खतनारहित है
  alternative: खतना किए हुओं को खतनारहितों के साथ
  rationale: इब्रानी पदबंध संक्षिप्त और असामान्य है। मुख्य अनुवाद उसके विरोधाभास को बनाए रखता है और केवल बाहरी खतने की आलोचना का संकेत देता है, जबकि वैकल्पिक सामूहिक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। भविष्यद्वाणी की गंभीर घोषणा और मूल इब्रानी के तीखे विरोधाभास, दोनों को सुरक्षित रखा गया है।
