id: JER.9.16
reference: Jeremiah 9:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת הִתְבּֽוֹנְנ֛וּ וְ/קִרְא֥וּ לַ/מְקוֹנְנ֖וֹת וּ/תְבוֹאֶ֑ינָה וְ/אֶל הַ/חֲכָמ֥וֹת שִׁלְח֖וּ וְ/תָבֽוֹאנָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/016.yaml
  text: 'Thus says Yahweh of hosts: Consider[a], and call for the mourning women, that they may come; and send for the skillful women[b], that they may come.'
translation:
  language: hi
  text: 'सेनाओं का याहवे यों कहता है: “ध्यान दो, और विलाप करनेवाली स्त्रियों[a] को बुलाओ कि वे आएँ; निपुण स्त्रियों[b] को बुलावा भेजो कि वे आएँ।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “रोने-पीटनेवाली स्त्रियों”; संभवतः पेशेवर शोक-विलाप करनेवाली स्त्रियाँ।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “बुद्धिमान स्त्रियों”; यहाँ संभवतः शोक-विलाप का नेतृत्व करने में निपुण स्त्रियाँ।
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה
  choice: यों
  rationale: भविष्यद्वाणी की औपचारिक उद्घोषणा को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का याहवे
  rationale: व्यक्तिगत ईश्वरीय नाम को लिप्यंतरित रखता है और צְבָאוֹת की व्यापक सैन्य/स्वर्गीय धारणा को बिना अनावश्यक सीमित किए व्यक्त करता है।
- source_word: הִתְבּוֹנְנוּ
  choice: ध्यान दो
  rationale: बहुवचन आज्ञा में निहित सावधानी से विचार करने और स्थिति पर ध्यान लगाने की पुकार को सहज हिन्दी में व्यक्त करता है।
- source_word: לַמְקוֹנְנוֹת
  choice: विलाप करनेवाली स्त्रियों
  rationale: स्त्रीलिंग बहुवचन रूप उन स्त्रियों को सूचित करता है जो शोक-विलाप करती या उसका नेतृत्व करती थीं; मुख्य पाठ पेशेवर होने की बात को निश्चित नहीं बनाता।
- source_word: וּתְבוֹאֶינָה / וְתָבֹאנָה
  choice: कि वे आएँ
  rationale: आज्ञाओं के बाद आए अपूर्ण क्रियारूपों के इच्छार्थक/परिणामसूचक भाव को व्यक्त करता और इब्रानी समानांतरता बनाए रखता है।
- source_word: הַחֲכָמוֹת
  choice: निपुण स्त्रियों
  rationale: חכם का मूल अर्थ ‘बुद्धिमान’ हो सकता है, पर इस प्रसंग में विलाप कराने की दक्षता संभावित है; ‘निपुण’ इस संदर्भगत अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: שִׁלְחוּ
  choice: बुलावा भेजो
  rationale: संदर्भ में इन स्त्रियों को लाने के लिए किसी को भेजने का आशय है; यह हिन्दी मुहावरा उस अर्थ को स्पष्ट और स्वाभाविक रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ में आए चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यद्वाणी-शैली रखी गई है। दोनों आगमन-वाक्यांशों की पुनरावृत्ति से मूल की समानांतर रचना सुरक्षित है। परामर्शी अंग्रेज़ी पाठ में [a] का स्थान ‘Consider’ के बाद था, पर उसका विषय מְקוֹנְנוֹת है; इसलिए हिन्दी मुख्य पाठ में उसे संबंधित संज्ञा के बाद रखा गया है।
