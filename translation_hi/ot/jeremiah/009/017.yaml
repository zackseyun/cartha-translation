  text: וּ/תְמַהֵ֕רְנָה וְ/תִשֶּׂ֥נָה עָלֵ֖י/נוּ נֶ֑הִי וְ/תֵרַ֤דְנָה עֵינֵ֨י/נוּ֙ דִּמְעָ֔ה וְ/עַפְעַפֵּ֖י/נוּ יִזְּלוּ מָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/017.yaml
  text: Let them hurry and raise a lament over us[a], so that our eyes may run down with tears and our eyelids flow with water.
translation:
  language: hi
  text: वे जल्दी करें और हमारे ऊपर विलाप छेड़ें, ताकि हमारी आँखों से आँसू बह निकलें और हमारी पलकों से पानी[a] बहने लगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में “पानी” है; यह “आँसू” के समानांतर एक काव्यात्मक अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּתְמַהֵרְנָה
  choice: वे जल्दी करें
  rationale: स्त्रीलिंग बहुवचन इच्छार्थक रूप की तात्कालिकता और स्वाभाविक हिंदी—दोनों को बनाए रखता है; ‘आएँ’ मूल पाठ में स्पष्ट रूप से नहीं है।
- source_word: וְתִשֶּׂנָה עָלֵינוּ נֶהִי
  choice: और हमारे लिए विलाप छेड़ें
  rationale: נשא + נֶהִי विलाप उठाने या आरम्भ करने का मुहावरा है। ‘विलाप छेड़ें’ हिंदी में स्वाभाविक है और सामूहिक शोक-स्वर आरम्भ करने का बिंब रखता है।
- source_word: נֶהִי
  choice: विलाप
  rationale: यह शोकपूर्ण रोने अथवा विलाप को दर्शाता है; ‘विलाप’ गरिमापूर्ण, व्यापक और भविष्यद्वाणी के प्रसंग के अनुकूल है।
- source_word: וְתֵרַדְנָה עֵינֵינוּ דִּמְעָה
  choice: ताकि हमारी आँखों से आँसू बह निकलें
  rationale: शाब्दिक उतरने के बिंब को स्वाभाविक हिंदी में आँसुओं के नीचे की ओर बहने के रूप में व्यक्त करता है। एकवचन דִּמְעָה का यहाँ सामूहिक अर्थ है, इसलिए ‘आँसू’ उपयुक्त है।
- source_word: וְעַפְעַפֵּינוּ יִזְּלוּ מָיִם
  choice: और हमारी पलकों से पानी बहने लगे
  rationale: ‘पानी’ के मूल काव्यात्मक बिंब को सुरक्षित रखते हुए हिंदी में बहाव का स्वाभाविक वर्णन किया गया है; इसे मुख्य पाठ में सीधे ‘आँसू’ बनाकर काव्यात्मक समानांतरता को मिटाया नहीं गया।
- source_word: מָיִם
  choice: पानी
  rationale: इब्रानी में स्पष्ट रूप से ‘पानी’ है, जो ‘आँसू’ के समानांतर प्रयुक्त काव्यात्मक अभिव्यक्ति है।
