  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। स्त्रीलिंग क्रिया-रूप का हिंदी में अलग बाहरी रूप न होने के कारण ‘वे’ प्रसंग में पिछली आयत की विलाप करनेवाली स्त्रियों की ओर संकेत करता है। ‘विलाप छेड़ें’ शोक-गान आरम्भ करने के भाव को स्वाभाविक रूप से व्यक्त करता है।
