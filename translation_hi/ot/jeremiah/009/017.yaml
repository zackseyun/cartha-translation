  naturalness: The Hindi is modern, clear, and suitably dignified. 'विलाप छेड़ें' is a natural rendering for beginning or raising a lament. 'हमारे ऊपर विलाप छेड़ें' remains idiomatic enough in this mourning context and more closely reflects the Hebrew preposition.
  terminology: '''विलाप,'' ''आँसू,'' and ''पानी'' appropriately preserve the lament register and the Hebrew poetic distinction between tears and water. The footnote is accurate and well anchored.'
