base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/005.yaml
  text: Your dwelling is in the midst of deceit[a]; through deceit they refuse to know me[b], declares Yahweh.
translation:
  language: hi
  text: तेरा निवास छल के बीच है[a]; छल के द्वारा वे मुझे जानने से इनकार करते हैं[b]—यह याहवे की घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में पहले एकवचन है—‘तेरा निवास’—और फिर बहुवचन—‘वे … इनकार करते हैं।’ सम्भवतः पहले लोगों या नगर को एक सामूहिक इकाई मानकर संबोधित किया गया है और फिर उसके निवासियों की बात की गई है।
    reason: lexical_alternative
  - marker: b
    text: या, “छल के कारण उन्होंने मुझे जानने से इनकार किया है।”
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁבְתְּךָ
  choice: तेरा निवास
  rationale: यह יׁשב से बना 2 पुरुष एकवचन प्रत्यययुक्त रूप है और यहाँ रहने की जगह या बसेरे का भाव देता है। ‘तेरा निवास’ एकवचन सामूहिक संबोधन को बनाए रखते हुए स्वाभाविक हिन्दी है।
- source_word: בְּתוֹךְ
  choice: के बीच
  rationale: בְּתוֹךְ किसी वस्तु या दशा के मध्य होने का अर्थ देता है; ‘के बीच’ छल से घिरे होने का भाव बनाए रखता है।
- source_word: מִרְמָה
  choice: छल
  rationale: מִרְמָה धोखे, कपट या छल को दर्शाता है। ‘छल’ संक्षिप्त, प्रचलित और नैतिक भारयुक्त शब्द है।
- source_word: בְּמִרְמָה
  choice: छल के कारण
  rationale: उपसर्ग בְּ यहाँ साधन या कारण का भाव दे सकता है। ‘छल के कारण’ हिन्दी में स्वाभाविक है और यह अर्थ खुला रखता है कि उनका छल उन्हें याहवे को जानने से इनकार की ओर ले जाता है; साधनात्मक विकल्प पादटिप्पणी में दिया गया है।
- source_word: מֵאֲנוּ
  choice: वे … इनकार करते हैं
  rationale: מֵאֲנוּ का अर्थ ‘उन्होंने इनकार किया/वे इनकार करते हैं’ है। सिद्ध अवस्था यहाँ जमी हुई या सामान्य वर्तमान दशा को व्यक्त कर सकती है; बहुवचन को बनाए रखा गया है।
- source_word: דַעַת אֹתִי
  choice: मुझे जानने से
  rationale: ידע का क्रियार्थक रूप और प्रथम पुरुष कर्म मिलकर सीधे ‘मुझे जानना’ कहते हैं। ‘जानने से’ सम्बन्धपरक और वाचागत तनाव को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: यह नबूवत का औपचारिक उद्घोष-सूत्र है। ‘यह याहवे की घोषणा है’ उसकी गंभीरता बनाए रखता है और יהוה को उसके व्यक्तिगत वाचा-नाम ‘याहवे’ से प्रस्तुत करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम יהוה है। ‘याहवे’ उस प्रकट वाचा-नाम को उपाधि में बदले बिना प्रस्तुत करता है।
- issue: वचन के भीतर एकवचन से बहुवचन का परिवर्तन
  choice: ‘तेरा निवास’ के बाद ‘वे … इनकार करते हैं’
  alternative: सभी रूपों को एकवचन या सभी को बहुवचन कर देना
  rationale: इब्रानी पाठ पहले 2 पुरुष एकवचन संबोधन और फिर बहुवचन क्रिया का प्रयोग करता है। इसे बनाए रखने से संभवतः समुदाय/नगर को एक इकाई और फिर उसके लोगों को बहुवचन रूप में देखने वाला नबूवती तनाव सुरक्षित रहता है।
- issue: בְּמִרְמָה में בְּ का अर्थ
  choice: कारणात्मक—‘छल के कारण’
  alternative: साधनात्मक—‘छल के द्वारा’
  rationale: उपसर्ग कारण या साधन दोनों का भाव ग्रहण कर सकता है। मुख्य पाठ में स्वाभाविक कारणात्मक हिन्दी चुनी गई है, पर साधनात्मक सम्भावना को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण रखी गई है। ‘छल’ की पुनरावृत्ति मूल इब्रानी की जानबूझकर की गई पुनरावृत्ति को बनाए रखती है। एकवचन से बहुवचन का असामान्य परिवर्तन समतल नहीं किया गया है।
