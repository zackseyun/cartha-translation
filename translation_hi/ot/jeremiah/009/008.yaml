base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/008.yaml
  text: Shall I not punish them for these things? declares Yahweh[a]. Shall my soul not avenge itself on a nation such as this?
translation:
  language: hi
  text: “क्या मैं इन बातों के कारण उन्हें दंड न दूँगा?” याहवे की घोषणा है। “क्या मेरा प्राण[a] ऐसे राष्ट्र से बदला न लेगा?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “मेरा प्राण”; अर्थ “मैं स्वयं” या “मेरा समूचा अस्तित्व” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעַל אֵלֶּה
  choice: क्या ... इन बातों के कारण
  rationale: प्रश्नवाचक הַ और עַל का संयोग कारण बताते हुए आलंकारिक प्रश्न बनाता है; ‘इन बातों के कारण’ उसके न्यायिक आधार को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
- source_word: אֶפְקָד
  choice: दण्ड न दूँगा
  rationale: इस न्याय-संदर्भ में פקד का अर्थ केवल ‘भेंट करना’ नहीं, बल्कि अपराध का लेखा लेकर दण्ड देना है।
- source_word: נְאֻם יְהוָה
  choice: याहवे की यह घोषणा है
  rationale: यह गंभीर भविष्यद्वक्ताई घोषणा-सूत्र है। יְהוָה को उसके व्यक्तिगत नाम ‘याहवे’ से प्रस्तुत किया गया है।
- source_word: אִם ... לֹא
  choice: क्या ... न लेगा?
  rationale: यहाँ אִם शर्त नहीं, पहले प्रश्न के समानान्तर अपेक्षित सकारात्मक उत्तर वाला आलंकारिक प्रश्न आरम्भ करता है।
- source_word: בְּגוֹי אֲשֶׁר כָּזֶה
  choice: ऐसी जाति से
  rationale: यह पद न्याय के लक्ष्य को सूचित करता है और כָּזֶה के संकेतात्मक बल को बनाए रखता है। ‘जाति’ यहाँ एक जनसमुदाय/राष्ट्र के अर्थ में है।
- source_word: תִתְנַקֵּם
  choice: बदला न लेगा
  rationale: נקם का हित्वपेल रूप प्रतिशोध लेने की मध्यवाची/आत्मवाची धारणा रखता है; हिन्दी मुहावरे में ‘बदला लेना’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: נַפְשִׁי
  choice: मेरा प्राण
  rationale: נפש के सजीव दैवी आत्म-संदर्भ को अक्षुण्ण रखने के लिए ‘मैं स्वयं’ में समतल करने के बजाय ‘मेरा प्राण’ रखा गया है।
theological_decisions:
- issue: न्याय के प्रसंग में परमेश्वर का נַפְשִׁי द्वारा आत्म-संदर्भ
  choice: मेरा प्राण
  alternative: मैं स्वयं / मेरा समूचा अस्तित्व
  rationale: मूल पाठ परमेश्वर के विषय में मानवीय अनुभूति-जैसी सजीव भाषा का प्रयोग करता है। ‘मेरा प्राण’ उस भावात्मक और धर्मवैचारिक तनाव को बिना व्याख्यात्मक रूप से मिटाए सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक पठन के अनुकूल रखी गई है। दोनों आलंकारिक प्रश्नों की समानान्तरता और न्याय की गंभीरता सुरक्षित है। उद्धरण-चिह्नों से याहवे की प्रत्यक्ष वाणी स्पष्ट की गई है।
