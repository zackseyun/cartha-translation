  to: काश, निर्जन प्रदेश में यात्रियों के लिए कोई ठिकाना होता,[a] ताकि मैं अपने लोगों को छोड़ दूँ और उनसे दूर चला जाऊँ! क्योंकि वे सब व्यभिचारी[b] हैं—विश्वासघातियों की एक मंडली।[c]
