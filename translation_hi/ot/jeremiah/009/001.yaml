id: JER.9.1
reference: Jeremiah 9:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: מִֽי יִתְּנֵ֣/נִי בַ/מִּדְבָּ֗ר מְלוֹן֙ אֹֽרְחִ֔ים וְ/אֶֽעֶזְבָה֙ אֶת עַמִּ֔/י וְ/אֵלְכָ֖ה מֵֽ/אִתָּ֑/ם כִּ֤י כֻלָּ/ם֙ מְנָ֣אֲפִ֔ים עֲצֶ֖רֶת בֹּגְדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/001.yaml
  text: Oh[a], that I had a travelers' lodging place in the wilderness, so that I might leave my people and go away from them! For all of them are adulterers[d][c][b], an assembly of traitors.
translation:
  language: hi
  text: काश, निर्जन प्रदेश में यात्रियों के लिए कोई ठिकाना होता,[a] ताकि मैं अपने लोगों को छोड़ दूँ और उनसे दूर चला जाऊँ! क्योंकि वे सब व्यभिचारी[b] हैं—विश्वासघातियों की एक मंडली।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में शाब्दिक रूप से: “कौन मुझे निर्जन प्रदेश में यात्रियों के लिए कोई ठिकाना देगा?” यह तीव्र इच्छा व्यक्त करने वाला मुहावरा है।'
    reason: lexical_alternative
  - marker: b
    text: अर्थात व्यभिचार करने वाले; भविष्यद्वाणी के इस संदर्भ में यह वाचा के प्रति विश्वासघात की ओर भी संकेत कर सकता है।
    reason: alternative_reading
  - marker: c
    text: या “विश्वासघातियों का दल।”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יִתְּנֵנִי
  choice: काश, ... मेरे लिए ... होती
  rationale: शाब्दिक प्रश्न ‘कौन मुझे देगा?’ यहाँ प्रबल इच्छा और विलाप व्यक्त करने वाला मुहावरा है; ‘काश’ आधुनिक हिन्दी में उसके इच्छार्थक भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בַמִּדְבָּר
  choice: जंगल में
  rationale: מִדְבָּר निर्जन, असिंचित वन्य प्रदेश को दर्शाता है। ‘जंगल’ सामान्य हिन्दी पाठक के लिए स्वाभाविक है और केवल रेतीले ‘रेगिस्तान’ तक अर्थ को सीमित नहीं करता।
- source_word: מְלוֹן אֹרְחִים
  choice: मुसाफ़िरों की कोई सराय
  rationale: מְלוֹן रात बिताने के ठिकाने और אֹרְחִים यात्रियों को सूचित करता है। ‘मुसाफ़िरों की सराय’ अस्थायी मार्गीय आश्रय का स्पष्ट और सहज चित्र देता है।
- source_word: וְאֶעֶזְבָה
  choice: ताकि मैं ... छोड़कर
  rationale: कोहोर्टेटिव रूप पूर्ववर्ती इच्छा के अभिप्रेत परिणाम को व्यक्त करता है; ‘ताकि’ उस प्रयोजनात्मक इच्छार्थक संबंध को सुरक्षित रखता है।
- source_word: עַמִּי
  choice: अपने लोगों
  rationale: यह वक्ता के समुदाय से घनिष्ठ और वाचागत संबंध को बनाए रखता है।
- source_word: וְאֵלְכָה מֵאִתָּם
  choice: उनसे दूर चला जाता
  rationale: यह गति और अलगाव, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כִּי כֻלָּם
  choice: क्योंकि वे सब
  rationale: כִּי कारण प्रस्तुत करता है और כֻלָּם संपूर्णता पर बल देता है।
- source_word: מְנָאֲפִים
  choice: व्यभिचारी
  rationale: נאף का प्रत्यक्ष अर्थ व्यभिचार करने वाले लोग है। यह शब्द भविष्यद्वाणी के संदर्भ में वाचा-विमुखता की प्रतिध्वनि भी रख सकता है, जिसे मुख्य पाठ में ठोस शब्द बनाए रखकर खुला छोड़ा गया है।
- source_word: עֲצֶרֶת
  choice: मंडली
  rationale: यह एकत्र समुदाय का सामूहिक बोध बनाए रखता है और ऐसी संगति पर नबी के कटाक्ष को व्यक्त करता है।
- source_word: בֹּגְדִים
  choice: विश्वासघातियों
  rationale: בגד छलपूर्ण अविश्वास और विश्वासघात को दर्शाता है; ‘विश्वासघाती’ व्यक्तिगत तथा वाचागत दोनों प्रकार की दगाबाज़ी के लिए उपयुक्त है।
theological_decisions:
- issue: מְנָאֲפִים को केवल वास्तविक यौन व्यभिचार मानना या केवल वाचा-विमुखता का रूपक मानना
  choice: मुख्य पाठ में ‘व्यभिचारी’ रखा गया है
  alternative: ‘विश्वासहीन लोग’ अथवा ‘आत्मिक व्यभिचारी’
  rationale: ठोस नैतिक आरोप और भविष्यद्वाणी में संभव वाचागत रूपक—दोनों की तनावपूर्ण व्यापकता सुरक्षित रखी गई है; किसी एक अर्थ को अनावश्यक रूप से निर्णायक नहीं बनाया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। ‘काश’ विलाप की तीव्रता को, ‘मुसाफ़िरों की सराय’ अस्थायी निर्जन आश्रय को, और ‘विश्वासघातियों की मंडली’ मूल के सामूहिक तथा व्यंग्यात्मक आरोप को बनाए रखते हैं।
