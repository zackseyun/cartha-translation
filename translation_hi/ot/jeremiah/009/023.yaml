source:
  edition: WLC
  text: כִּ֣י אִם בְּ/זֹ֞את יִתְהַלֵּ֣ל הַ/מִּתְהַלֵּ֗ל הַשְׂכֵּל֮ וְ/יָדֹ֣עַ אוֹתִ/י֒ כִּ֚י אֲנִ֣י יְהוָ֔ה עֹ֥שֶׂה חֶ֛סֶד מִשְׁפָּ֥ט וּ/צְדָקָ֖ה בָּ/אָ֑רֶץ כִּֽי בְ/אֵ֥לֶּה חָפַ֖צְתִּי נְאֻם יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/023.yaml
  text: 'But let the one who boasts boast in this: that he understands and knows me[a], that I am Yahweh, who practices steadfast love, justice, and righteousness in the earth; for in these I delight[b], declares Yahweh.'
translation:
  language: hi
  text: परन्तु जो घमण्ड करे, वह इस बात पर घमण्ड करे कि वह समझता है और मुझे जानता है—कि मैं यहोवा हूँ, जो पृथ्वी पर[a] अटल प्रेम[b] दिखाता और न्याय व धार्मिकता करता हूँ; क्योंकि इन्हीं में मुझे प्रसन्नता है—यहोवा की वाणी है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “पृथ्वी पर” का अनुवाद “देश में” भी हो सकता है। हिब्रू אֶרֶץ का अर्थ पूरी पृथ्वी अथवा कोई विशेष देश—दोनों हो सकता है; यहाँ व्यापक अर्थ यहोवा के चरित्र के सामान्य कथन के अनुकूल है।
    reason: lexical_alternative
  - marker: b
    text: “अटल प्रेम” के लिए प्रयुक्त हिब्रू शब्द חֶסֶד प्रेम, करुणा और निष्ठा से समृद्ध वाचा-संबंधी शब्द है; प्रसंग के अनुसार इसका अनुवाद “करुणा” या “वाचा की निष्ठा” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: परन्तु
  rationale: पिछले पद में अनुचित घमण्ड के निषेध के विपरीत यह पद घमण्ड का उचित आधार बताता है; संक्षिप्त प्रतिकूल संयोजक इस बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּזֹאת
  choice: इस बात पर
  rationale: यह आगे आने वाले कथन की ओर संकेत करता है और हिन्दी में घमण्ड के आधार को सहज ढंग से व्यक्त करता है।
- source_word: יִתְהַלֵּל / הַמִּתְהַלֵּל
  choice: जो घमण्ड करे, वह ... घमण्ड करे
  rationale: हिब्रू मूल की जानबूझकर की गई पुनरुक्ति को बनाए रखता है।
- source_word: הַשְׂכֵּל
  choice: समझता है
  rationale: यहाँ ידע के साथ जुड़कर यहोवा को सही रीति से पहचानने और उसके चरित्र को समझने का भाव देता है।
- source_word: וְיָדֹעַ אוֹתִי
  choice: और मुझे जानता है
  rationale: प्रत्यक्ष अनुवाद संबंधपरक ज्ञान की गहराई को बनाए रखता है, उसे केवल जानकारी या स्वीकारोक्ति तक सीमित नहीं करता।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित रूप से परमेश्वर के व्यक्तिगत वाचा-नाम को व्यक्त करता है, किसी उपाधि से उसका प्रतिस्थापन नहीं करता।
- source_word: עֹשֶׂה
  choice: काम करता हूँ
  rationale: कृदन्त यहोवा की निरन्तर और विशिष्ट कार्यशीलता बताता है; बहुवचन गुणों के साथ यह हिन्दी में स्वाभाविक है।
- source_word: חֶסֶד
  choice: अटल प्रेम
  rationale: यह विकल्प प्रेम और स्थायी निष्ठा दोनों को संक्षेप में व्यक्त करता है, जबकि पदटीका इसकी वाचा-संबंधी अर्थसमृद्धि स्पष्ट करती है।
- source_word: מִשְׁפָּט
  choice: न्याय
  rationale: धार्मिकता के समानान्तर यह उचित शासन और न्यायपूर्ण व्यवस्था का स्पष्ट आधुनिक हिन्दी रूप है।
- source_word: וּצְדָקָה
  choice: धार्मिकता
  rationale: न्याय से संबंधित किन्तु अलग नैतिक धारणा को सुरक्षित रखता है।
- source_word: בָּאָרֶץ
  choice: पृथ्वी पर
  rationale: यह व्यापक भौगोलिक अर्थ को व्यक्त करता है, किन्तु पदटीका में ‘देश में’ की वास्तविक शाब्दिक सम्भावना सुरक्षित रखी गई है।
- source_word: כִּי בְאֵלֶּה חָפַצְתִּי
  choice: क्योंकि इन्हीं से मैं प्रसन्न होता हूँ
  rationale: חפץ के इच्छा, रुचि और आनन्द के भाव को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: נְאֻם יְהוָה
  choice: यह यहोवा की वाणी है
  rationale: भविष्यद्वाणी के प्रामाणिक दैवी घोषणा-सूत्र को गरिमापूर्ण और प्रचलित हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु / याहवे
  rationale: मूल पाठ में व्यक्तिगत चतुरक्षरीय नाम है। हिन्दी पाठकों के लिए स्थापित लिप्यन्तरण ‘यहोवा’ नाम को नाम के रूप में सुरक्षित रखता है, न कि उसे उपाधि से बदलता है।
- issue: בָּאָרֶץ का दायरा
  choice: पृथ्वी पर
  alternative: देश में
  rationale: कथन यहोवा के चरित्र और उसके कार्य की व्यापक घोषणा के रूप में पढ़ा जा सकता है; फिर भी हिब्रू אֶרֶץ की स्थानीय सम्भावना को पदटीका में बनाए रखा गया है।
- issue: חֶסֶד का अर्थ-क्षेत्र
  choice: अटल प्रेम
  alternative: करुणा / वाचा की निष्ठा
  rationale: एक ही हिन्दी पद में प्रेम और स्थिर निष्ठा दोनों का संकेत मिलता है, बिना अर्थ को केवल दया या केवल तकनीकी वाचा-शब्दावली तक सीमित किए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सुबोध रखी गई है। मूल की पुनरुक्ति, चरित्र-गुणों की त्रयी और समापन घोषणा-सूत्र सुरक्षित हैं। दोनों पदटीका-चिह्न मुख्य पाठ के अंत में सम्बद्ध कथन के बाद दिए गए हैं।
