  yaml_path: translation/ot/jeremiah/009/013.yaml
  text: They went after the stubbornness of their heart and after the Baals[a], which their fathers taught them.
translation:
  language: hi
  text: वे अपने मन के हठ के पीछे और बाल देवताओं के पीछे चले, जिनकी शिक्षा उनके पुरखों ने उन्हें दी थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלְכוּ אַחֲרֵי
  choice: के पीछे चले
  rationale: הלך के साथ אַחֲרֵי का मुहावरा किसी का अनुसरण करने या उसके प्रति निष्ठा रखने का भाव देता है। यह अनुवाद इब्रानी बिंब और दोनों वाक्यांशों की समानांतर रचना बनाए रखता है।
- source_word: שְׁרִרוּת
  choice: हठ
  rationale: यह संज्ञा आत्म-इच्छा से उपजी जिद और अड़ियलपन को व्यक्त करती है। ‘हठ’ आधुनिक हिन्दी में संक्षिप्त, स्वाभाविक और नैतिक संदर्भ के अनुकूल है।
- source_word: לִבָּם
  choice: अपने हृदय के
  rationale: इब्रानी में बहुवचन स्वामी के साथ एकवचन ‘हृदय’ सामूहिक रूप से प्रत्येक व्यक्ति की भीतरी इच्छा और प्रवृत्ति को दर्शाता है; हिन्दी में एकवचन बनाए रखा गया है।
- source_word: הַבְּעָלִים
  choice: बाल देवताओं
  rationale: बहुवचन रूप कनानी देवता बाल के विविध स्थानीय रूपों या प्रतिमाओं की ओर संकेत करता है। ‘बाल देवताओं’ से इसे सामान्य ‘स्वामियों’ के अर्थ में पढ़ने की संभावना नहीं रहती और बहुवचन भी स्पष्ट होता है।
- source_word: לִמְּדוּם
  choice: उन्हें शिक्षा दी थी
  rationale: पिएल रूप का अर्थ ‘सिखाना’ है और प्रत्यय उसका कर्म ‘उन्हें’ देता है। relative clause को स्वाभाविक हिन्दी में ‘जिनके विषय में ... शिक्षा दी’ के रूप में व्यक्त किया गया है, बिना यह जोड़े कि शिक्षा का ठीक स्वरूप क्या था।
- source_word: אֲבוֹתָם
  choice: उनके पुरखों
  rationale: ‘पुरखे’ पूर्व पीढ़ियों के पुरुष पूर्वजों को स्वाभाविक हिन्दी में व्यक्त करता है और मूल के पुल्लिंग बहुवचन को पूरी तरह लिंग-निरपेक्ष नहीं बनाता। शाब्दिक रूप फुटनोट में दिया गया है।
theological_decisions:
- issue: אֲבוֹתָם का अनुवाद
  choice: उनके पुरखों
  alternative: उनके पिताओं
  rationale: मूल शब्द शाब्दिक रूप से ‘पिता’ है, पर इस प्रसंग में पिछली पीढ़ियों को सूचित करता है। ‘पुरखों’ से पीढ़ीगत अर्थ और पुल्लिंग संकेत दोनों सुरक्षित रहते हैं, जबकि ‘पिताओं’ आधुनिक हिन्दी में अस्वाभाविक लग सकता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘के पीछे ... के पीछे’ की पुनरावृत्ति मूल इब्रानी की समानांतर अलंकारिक संरचना को सुरक्षित रखती है।
