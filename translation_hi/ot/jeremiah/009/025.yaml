source:
  edition: WLC
  text: עַל מִצְרַ֣יִם וְ/עַל יְהוּדָ֗ה וְ/עַל אֱד֞וֹם וְ/עַל בְּנֵ֤י עַמּוֹן֙ וְ/עַל מוֹאָ֔ב וְ/עַל֙ כָּל קְצוּצֵ֣י פֵאָ֔ה הַ/יֹּשְׁבִ֖ים בַּ/מִּדְבָּ֑ר כִּ֤י כָל הַ/גּוֹיִם֙ עֲרֵלִ֔ים וְ/כָל בֵּ֥ית יִשְׂרָאֵ֖ל עַרְלֵי לֵֽב־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/025.yaml
  text: against Egypt[a], and against Judah, and against Edom, and against the sons of Ammon, and against Moab, and against all those with the corners of their hair cut off, who dwell in the wilderness; for all the nations are uncircumcised, and all the house of Israel are uncircumcised in heart.
translation:
  language: hi
  text: मिस्र के विरुद्ध, यहूदा के विरुद्ध, एदोम के विरुद्ध, अम्मोन के वंशजों के विरुद्ध, मोआब के विरुद्ध, और उन सबके विरुद्ध जिनके बालों के किनारे कटे हुए हैं[a] और जो निर्जन प्रदेश में रहते हैं; क्योंकि सभी जातियाँ खतनारहित हैं, और इस्राएल का सारा घराना हृदय से खतनारहित है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ के निकट: “जिनके बालों के किनारे कटे हुए हैं”; इब्रानी वाक्यांश संभवतः मरुस्थलीय जातियों के एक विशिष्ट केश-विन्यास की ओर संकेत करता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  choice: के विरुद्ध
  rationale: पिछले पद में घोषित दंड के लक्ष्यों को प्रस्तुत करने के कारण यहाँ विरोधात्मक और न्यायिक अर्थ स्वाभाविक है; प्रत्येक नाम के साथ इसकी पुनरावृत्ति इब्रानी बलाघात को बनाए रखती है।
- source_word: בְּנֵי עַמּוֹן
  choice: अम्मोन के वंशज
  rationale: यह इब्रानी के ‘अम्मोन के पुत्र’ जातीय मुहावरे का अर्थ स्पष्ट और आधुनिक हिन्दी में स्वाभाविक ढंग से व्यक्त करता है, बिना इसे केवल पुरुषों तक सीमित किए।
- source_word: כָּל קְצוּצֵי פֵאָה
  choice: वे सब जो अपने बालों के किनारे कटवाते हैं
  rationale: शाब्दिक चित्र को सुरक्षित रखते हुए किसी अनिश्चित विशिष्ट केश-विन्यास—जैसे केवल कनपटियाँ मुँडाना—को निर्णायक नहीं बनाया गया है।
- source_word: הַיֹּשְׁבִים בַּמִּדְבָּר
  choice: जो निर्जन प्रदेश में रहते हैं
  rationale: מִדְבָּר का अर्थ केवल रेतीला मरुस्थल नहीं, बल्कि उजाड़ या कम आबादी वाला क्षेत्र भी हो सकता है; ‘निर्जन प्रदेश’ इस व्यापकता को बनाए रखता है।
- source_word: כָל הַגּוֹיִם
  choice: सभी जातियाँ
  rationale: संदर्भ आसपास के जातीय राष्ट्रों का है; ‘जातियाँ’ हिन्दी बाइबिलीय प्रयोग में स्पष्ट है और अनावश्यक रूप से ‘गैर-यहूदी’ अर्थ आरोपित नहीं करता।
- source_word: עֲרֵלִים
  choice: खतनारहित
  rationale: शारीरिक खतने से जुड़ा मूल वाचा-संबंधी और विवादात्मक रूपक सीधे बनाए रखा गया है।
- source_word: כָל בֵּית יִשְׂרָאֵל
  choice: इस्राएल का पूरा घराना
  rationale: सामूहिक इब्रानी मुहावरे को dignified और समझने योग्य हिन्दी में सुरक्षित रखता है।
- source_word: עַרְלֵי לֵב
  choice: हृदय से खतनारहित
  rationale: भीतरी आत्मिक दशा के लिए प्रयुक्त खतने के रूपक को व्याख्यात्मक भावार्थ में बदलने के बजाय ज्यों का त्यों रखा गया है।
theological_decisions:
- issue: इस्राएल की भीतरी दशा का रूपक
  choice: हृदय से खतनारहित
  alternative: कठोर हृदयवाले / आत्मिक रूप से खतनारहित
  rationale: मूल पाठ बाहरी वाचा-चिह्न और भीतरी अवज्ञा के बीच तनाव बनाए रखता है; प्रत्यक्ष रूपक उसका धर्मवैचारिक बल सुरक्षित रखता है।
- issue: בְּנֵי עַמּוֹן का जातीय आशय
  choice: अम्मोन के वंशज
  alternative: अम्मोन के पुत्र / अम्मोनी
  rationale: यह मूल की वंश-संबंधी अभिव्यक्ति को बनाए रखता है, पर जाति को केवल जैविक पुरुष संतानों तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, भविष्यद्वक्ताओं के प्रसंग के अनुरूप गंभीर और गरिमापूर्ण रखी गई है। नामों के साथ ‘के विरुद्ध’ की पुनरावृत्ति मूल की सूचीगत तीव्रता को बचाती है। ‘खतनारहित’ और ‘हृदय से खतनारहित’ जानबूझकर समान मूल-छवि रखते हैं।
