source:
  edition: WLC
  text: אִ֤ישׁ מֵ/רֵעֵ֨/הוּ֙ הִשָּׁמֵ֔רוּ וְ/עַל כָּל אָ֖ח אַל תִּבְטָ֑חוּ כִּ֤י כָל אָח֙ עָק֣וֹב יַעְקֹ֔ב וְ/כָל רֵ֖עַ רָכִ֥יל יַהֲלֹֽךְ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/003.yaml
  text: Each man[a], beware of his neighbor, and do not trust any brother; for every brother surely deceives[c][b], and every neighbor goes about as a slanderer.
translation:
  language: hi
  text: हर व्यक्ति अपने पड़ोसी से सावधान रहे, और किसी भाई पर भरोसा न करे; क्योंकि हर भाई छल पर छल करता है[a][b], और हर पड़ोसी निंदा करता फिरता है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हर भाई घोर छल करता है,” अथवा “हर भाई दूसरे का स्थान हथिया लेता है।” इब्रानी में עקב मूल की पुनरावृत्ति छलपूर्ण ढंग से आगे निकलने या दूसरे का स्थान लेने के भाव को तीव्र करती है।
    reason: lexical_alternative
  - marker: b
    text: “भाई” से सगा भाई अथवा व्यापक अर्थ में समुदाय का कोई सह-सदस्य अभिप्रेत हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या “चुगली करता फिरता है,” अथवा “बदनामी फैलाने वाला बनकर घूमता है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ מֵרֵעֵהוּ הִשָּׁמֵרוּ
  choice: हर व्यक्ति अपने पड़ोसी से सावधान रहे
  rationale: אִישׁ यहाँ वितरणात्मक अर्थ रखता है। हिब्रू बहुवचन आज्ञा को स्वाभाविक आधुनिक हिन्दी में प्रत्येक व्यक्ति पर लागू चेतावनी के रूप में व्यक्त किया गया है; מן उस व्यक्ति को बताता है जिससे सावधान रहना है।
- source_word: וְעַל כָּל אָח אַל תִּבְטָחוּ
  choice: और किसी भाई पर भरोसा न करे
  rationale: בטח का अर्थ भरोसा करना या निर्भर रहना है। निषेध के साथ כָּל का स्वाभाविक हिन्दी रूप ‘किसी ... पर ... न’ है। ‘भाई’ सगा भाई अथवा समुदाय का सह-सदस्य, दोनों हो सकता है।
- source_word: עָקוֹב יַעְקֹב
  choice: छल-ही-छल करता है
  rationale: एक ही मूल עקב से बने गहनकारी संयोजन को हिन्दी की स्वाभाविक पुनरुक्ति द्वारा व्यक्त किया गया है। यह लगातार या घोर छल का भाव रखता है, जबकि ‘एड़ी पकड़ना/स्थान लेना’ जैसी संभावित शब्द-क्रीड़ा मुख्य पाठ में आरोपित नहीं की गई।
- source_word: וְכָל רֵעַ רָכִיל יַהֲלֹךְ
  choice: और हर पड़ोसी निंदा करता फिरता है
  rationale: רכיל दुर्भावनापूर्ण चुगली या निंदा फैलाने वाले को सूचित करता है, और הלך यहाँ अभ्यस्त आचरण व्यक्त करता है। ‘करता फिरता है’ इस निरंतर सामाजिक व्यवहार को सहज हिन्दी में रखता है।
