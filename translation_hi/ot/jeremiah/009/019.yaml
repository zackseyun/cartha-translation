id: JER.9.19
reference: Jeremiah 9:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּֽי שְׁמַ֤עְנָה נָשִׁים֙ דְּבַר יְהוָ֔ה וְ/תִקַּ֥ח אָזְנְ/כֶ֖ם דְּבַר פִּ֑י/ו וְ/לַמֵּ֤דְנָה בְנֽוֹתֵי/כֶם֙ נֶ֔הִי וְ/אִשָּׁ֥ה רְעוּתָ֖/הּ קִינָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/019.yaml
  text: For hear the word of Yahweh[a], O women, and let your ear receive the word of his mouth; teach your daughters a lament[c][b], and each woman her neighbor a dirge.
translation:
  language: hi
  text: क्योंकि, हे स्त्रियो, याहवे का वचन सुनो, और अपने कानों से उसके मुख का वचन ग्रहण करो[a]। अपनी बेटियों को विलाप सिखाओ, और हर स्त्री अपनी संगिनी को शोकगीत सिखाए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “तुम्हारा कान उसके मुख का वचन ग्रहण करे”; यह ध्यान लगाकर सुनने का मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “विलाप” और “शोकगीत” के लिए दो अलग, किंतु निकट अर्थ वाले इब्रानी शब्द हैं; दोनों शोक की औपचारिक अभिव्यक्तियों को सूचित करते हैं।
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले संदर्भ से कारणात्मक संबंध जोड़ता है; हिन्दी में ‘क्योंकि’ इस संयोजक बल को स्वाभाविक रूप से बनाए रखता है।
- source_word: שְׁמַעְנָה נָשִׁים
  choice: हे स्त्रियो, ... सुनो
  rationale: क्रिया स्त्रीलिंग बहुवचन आज्ञार्थक है और संबोधन विशेष रूप से स्त्रियों से है। ‘हे स्त्रियो’ गरिमापूर्ण और स्पष्ट प्रत्यक्ष संबोधन है।
- source_word: דְּבַר יְהוָה
  choice: यहोवा का वचन
  rationale: नबूवत में प्रयुक्त स्थिर अभिव्यक्ति ‘वचन’ के औपचारिक अर्थ को रखती है, और परमेश्वर के निज नाम को ‘यहोवा’ के रूप में व्यक्त करती है।
- source_word: וְתִקַּח אָזְנְכֶם
  choice: तुम्हारे कान ... ग्रहण करें
  rationale: मूल के ठोस मुहावरे को बनाए रखते हुए ध्यानपूर्वक सुनने और स्वीकार करने का भाव व्यक्त किया गया है।
- source_word: דְּבַר פִּיו
  choice: उसके मुख से निकला वचन
  rationale: ‘उसके मुख का वचन’ के मूल बिंब को स्वाभाविक हिन्दी में रखा गया है और वाणी के परमेश्वर से सीधे आने का भाव सुरक्षित है।
- source_word: נֶהִי
  choice: विलाप
  rationale: यह रोने-विलाप करने अथवा विलाप की औपचारिक अभिव्यक्ति को सूचित करता है; ‘विलाप’ सामान्य पाठक के लिए स्पष्ट है।
- source_word: וְאִשָּׁה רְעוּתָהּ
  choice: हर स्त्री अपनी संगिनी को
  rationale: वितरणात्मक अर्थ और स्त्रीलिंग साथी दोनों सुरक्षित हैं। पिछले उपवाक्य से समझी जाने वाली क्रिया को हिन्दी की स्पष्टता के लिए दोहराया गया है।
- source_word: קִינָה
  choice: शोकगीत
  rationale: यह प्रायः औपचारिक मातमी गीत का द्योतक है; ‘शोकगीत’ इसे पहले प्रयुक्त ‘विलाप’ से संबंधित पर अलग बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के निज नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चार-अक्षरीय निज नाम सीधे आया है। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाता है और इसे किसी उपाधि से बदलता नहीं है।
- issue: स्त्री-विशिष्ट संबोधन
  choice: स्त्रियो / बेटियों / हर स्त्री / संगिनी
  alternative: लोगो / बच्चों / प्रत्येक व्यक्ति / साथी
  rationale: मूल में स्त्रीलिंग बहुवचन आज्ञाएँ और स्त्रियों तथा बेटियों के स्पष्ट उल्लेख हैं; इसलिए लिंग-विशिष्ट भाषा को सामान्यीकृत नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज हिन्दी रखी गई है। मूल के ‘कान ग्रहण करें’ और ‘मुख से निकला वचन’ जैसे ठोस बिंबों को यथासंभव सुरक्षित रखा गया है, जबकि अंतिम लुप्त क्रिया को हिन्दी में स्पष्टता के लिए ‘सिखाए’ के रूप में व्यक्त किया गया है।
