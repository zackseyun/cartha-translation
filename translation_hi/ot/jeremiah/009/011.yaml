source:
  edition: WLC
  text: מִֽי הָ/אִ֤ישׁ הֶֽ/חָכָם֙ וְ/יָבֵ֣ן אֶת זֹ֔את וַ/אֲשֶׁ֨ר דִּבֶּ֧ר פִּֽי יְהוָ֛ה אֵלָ֖י/ו וְ/יַגִּדָ֑/הּ עַל מָה֙ אָבְדָ֣ה הָ/אָ֔רֶץ נִצְּתָ֥ה כַ/מִּדְבָּ֖ר מִ/בְּלִ֖י עֹבֵֽר־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/011.yaml
  text: Who is the wise man who can understand this? To whom has the mouth of Yahweh spoken[a], that he may declare it? Why has the land perished, laid waste like the wilderness[c][b], with no one passing through?
translation:
  language: hi
  text: ऐसा बुद्धिमान पुरुष कौन है जो यह समझ सके? और वह कौन है जिससे याहवे के मुख ने बात की है[a], ताकि वह इसे बता सके? देश क्यों नष्ट हो गया[b] और मरुभूमि के समान उजाड़ हो गया है, जिससे होकर कोई नहीं गुजरता[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “याहवे का मुख”; यह याहवे के प्रत्यक्ष वचन के लिए एक भविष्यद्वक्तापूर्ण मुहावरा है।
    reason: cultural_note
  - marker: b
    text: या, “देश क्यों बरबाद हो गया।”
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “किसी गुजरने वाले के बिना।”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי הָאִישׁ הֶחָכָם
  choice: ऐसा बुद्धिमान पुरुष कौन है
  rationale: मूल पाठ के पुल्लिंग एकवचन ‘पुरुष’ और ‘बुद्धिमान’ को बनाए रखते हुए प्रश्न को स्वाभाविक आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: וְיָבֵן אֶת־זֹאת
  choice: जो इसे समझ सके
  rationale: अपूर्ण क्रिया के प्रसंगगत सामर्थ्य-सूचक भाव को ‘समझ सके’ से व्यक्त किया गया है; इससे केवल वास्तविक समझ नहीं, ऐसा करने की योग्यता पूछी जाती है।
- source_word: וַאֲשֶׁר דִּבֶּר פִּי יְהוָה אֵלָיו
  choice: याहवे के मुख ने किससे कहा है
  rationale: ‘याहवे का मुख’ वाली प्रत्यक्ष इब्रानी छवि को सुरक्षित रखा गया है, जबकि हिन्दी कारक-रचना को स्वाभाविक बनाया गया है।
- source_word: וְיַגִּדָהּ
  choice: कि वह इसे प्रकट करे
  rationale: हिफ़ील रूप का अर्थ किसी बात को ज्ञात कराना है; ‘प्रकट करे’ यहाँ सार्वजनिक और भविष्यद्वक्तापूर्ण घोषणा के भाव को व्यक्त करता है।
- source_word: עַל־מָה
  choice: क्यों
  rationale: कारण पूछने वाली इब्रानी अभिव्यक्ति का सबसे स्वाभाविक हिन्दी रूप ‘क्यों’ है।
- source_word: אָבְדָה הָאָרֶץ
  choice: देश क्यों नष्ट हो गया
  rationale: אבד विनाश या बरबादी की दशा बताता है। ‘नष्ट हो गया’ गंभीरता बनाए रखता है, पर अनिवार्य रूप से पूर्ण अस्तित्व-लोप का दावा नहीं करता।
- source_word: נִצְּתָה כַמִּדְבָּר
  choice: मरुभूमि के समान उजाड़ पड़ा है
  rationale: यह रूप देश की ध्वस्त और वीरान दशा पर बल देता है। ‘मरुभूमि’ מִדְבָּר को केवल रेतीले रेगिस्तान तक सीमित किए बिना निर्जन भूभाग का भाव देता है।
- source_word: מִבְּלִי עֹבֵר
  choice: और वहाँ से कोई नहीं गुजरता
  rationale: प्रतिभागी ‘गुजरने वाला’ को हिन्दी में स्वाभाविक वर्तमान वर्णन के रूप में रखा गया है, जो पूर्ण वीरानी दिखाता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार-अक्षरीय ईश्वरीय नाम को उपाधि से बदलने के बजाय हिन्दी लिपि में उसके प्रचलित लिप्यंतरण ‘याहवे’ से प्रस्तुत किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है; इसलिए उसे किसी उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- issue: ‘याहवे के मुख’ की मानवरूपी छवि
  choice: मुख वाली मूल छवि मुख्य पाठ में रखी गई
  alternative: याहवे ने किससे कहा है
  rationale: मूल इब्रानी स्पष्ट रूप से ‘याहवे के मुख’ कहता है। इसे बनाए रखने से प्रत्यक्ष दिव्य वचन और भविष्यद्वक्तापूर्ण अधिकार का बल सुरक्षित रहता है।
- issue: הָאִישׁ הֶחָכָם का लिंग
  choice: बुद्धिमान पुरुष
  alternative: बुद्धिमान व्यक्ति
  rationale: मूल पाठ व्याकरणतः पुल्लिंग एकवचन है; हिन्दी में इसे अस्पष्ट या लिंग-निरपेक्ष किए बिना उसी रूप में रखा गया है।
- issue: नाश और उजाड़ होने के बीच संबंध
  choice: दो समन्वित अवस्थाओं के रूप में प्रस्तुत
  alternative: ‘नष्ट होकर मरुभूमि के समान उजाड़ हो गया’
  rationale: इब्रानी में दोनों क्रियारूप देश की दशा बताते हैं। अल्पविराम से उनका निकट संबंध बना रहता है, पर एक को दूसरे का केवल परिणाम मानकर तनाव समाप्त नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर प्रश्नों की गंभीर और भविष्यद्वक्तापूर्ण गरिमा बनाए रखी गई है। ‘मुख’, ‘प्रकट करे’, ‘नष्ट’ और ‘मरुभूमि’ जैसे शब्द साधारण पाठकों के लिए बोधगम्य रहते हुए मूल की औपचारिक छवि और लय को सुरक्षित रखते हैं।
