base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/004.yaml
  text: And each man deceives his neighbor[a], and they do not speak truth; they have taught their tongue to speak falsehood[b]; they weary themselves committing iniquity.
translation:
  language: hi
  text: हर व्यक्ति अपने पड़ोसी को धोखा देता है[a], और वे सत्य नहीं बोलते। उन्होंने अपनी जीभ को झूठ बोलना सिखाया है; अधर्म करते-करते वे अपने को थका डालते हैं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने पड़ोसी का उपहास करता है,” अथवा “अपने पड़ोसी के साथ छल करता है।”
    reason: lexical_alternative
  - marker: b
    text: या, “बुराई करते-करते वे अपने को थका डालते हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: हर एक
  rationale: एकवचन संज्ञा यहाँ वितरणात्मक अर्थ रखती है। ‘हर एक’ हिन्दी में इस प्रतिनिधिक और सार्वत्रिक आरोप को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּרֵעֵהוּ
  choice: अपने पड़ोसी को
  rationale: רֵעַ का अर्थ मित्र, साथी या पड़ोसी हो सकता है। यहाँ व्यापक सामाजिक संबंध में छल का आरोप है, इसलिए ‘पड़ोसी’ उपयुक्त है।
- source_word: יְהָתֵלּוּ
  choice: धोखा देता है
  rationale: התל का हिफ़ील रूप यहाँ सत्य न बोलने के समानांतर छल देने या बहकाने का भाव रखता है।
- source_word: אֱמֶת
  choice: सच
  rationale: संदर्भ वाणी की सत्यता का है। ‘सच’ आधुनिक हिन्दी में स्वाभाविक है और अर्थ को स्पष्ट रखता है।
- source_word: לִמְּדוּ לְשׁוֹנָם
  choice: उन्होंने अपनी जीभ को ... सिखाया है
  rationale: यह चयन मूल के सजीव चित्र को बनाए रखता है, जिसमें जीभ को झूठ बोलने के लिए प्रशिक्षित किया गया है, और पूर्ण क्रिया से बनी हुई आदत का संकेत मिलता है।
- source_word: דַּבֶּר שֶׁקֶר
  choice: झूठ बोलना
  rationale: यह सहज हिन्दी में שֶׁקֶר के असत्य और छलपूर्ण वचन का अर्थ सीधे व्यक्त करता है।
- source_word: הַעֲוֵה
  choice: अधर्म करते-करते
  rationale: यह रूप गलत, विकृत या अधर्मपूर्ण आचरण करने का भाव देता है। ‘अधर्म’ भविष्यद्वाणी के नैतिक भार को बनाए रखता है।
- source_word: נִלְאוּ
  choice: वे अपने को थका डालते हैं
  rationale: 'निफ़अल को यहाँ आत्मवाचक या परिणामसूचक अर्थ में लिया गया है: वे लगातार अधर्म करते हुए स्वयं को थका देते हैं।'
