id: JER.9.12
reference: Jeremiah 9:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֔ה עַל עָזְבָ/ם֙ אֶת תּ֣וֹרָתִ֔/י אֲשֶׁ֥ר נָתַ֖תִּי לִ/פְנֵי/הֶ֑ם וְ/לֹא שָׁמְע֥וּ בְ/קוֹלִ֖/י וְ/לֹא הָ֥לְכוּ בָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/012.yaml
  text: And Yahweh said[a], "Because they have forsaken my law that I set before them[b], and have not obeyed my voice or walked in it,"
translation:
  language: hi
  text: और यहोवा ने कहा, “इसलिए कि उन्होंने मेरी व्यवस्था[a] को, जिसे मैंने उनके सामने रखा था, त्याग दिया; उन्होंने मेरी वाणी नहीं सुनी[b] और उसके अनुसार नहीं चले,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरी शिक्षा।” इब्रानी शब्द तोराह का अर्थ व्यापक रूप से शिक्षा हो सकता है, यद्यपि यहाँ उसमें वाचा-संबंधी व्यवस्था का बल है।
    reason: lexical_alternative
  - marker: b
    text: या “मेरी वाणी नहीं मानी।” इब्रानी मुहावरे “मेरी वाणी सुनना” में प्रायः आज्ञापालन का भाव भी शामिल होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: वाचा के परमेश्वर के व्यक्तिगत नाम को हिन्दी में प्रचलित और पहचाने जाने योग्य रूप में सुरक्षित रखता है।
- source_word: עַל עָזְבָם
  choice: इसलिए कि उन्होंने ... त्याग दिया
  rationale: עַל यहाँ कारण बताता है; ‘त्याग दिया’ עזב के गंभीर, वाचागत भाव को व्यक्त करता है।
- source_word: תּוֹרָתִי
  choice: मेरी व्यवस्था
  rationale: תּוֹרָה का अर्थ शिक्षा भी हो सकता है, पर यहाँ वाचा और आज्ञापालन के संदर्भ में ‘व्यवस्था’ उसका विधिक-वाचागत बल स्पष्ट करती है।
- source_word: אֲשֶׁר נָתַתִּי לִפְנֵיהֶם
  choice: जिसे मैंने उनके सामने रखा था
  rationale: शाब्दिक ‘उनके सामने दिया’ के आशय को स्वाभाविक हिन्दी में व्यक्त करता है—पालन के लिए उनके सम्मुख रखना।
- source_word: וְלֹא שָׁמְעוּ בְּקוֹלִי
  choice: उन्होंने मेरी वाणी नहीं सुनी
  rationale: इब्रानी मुहावरे की श्रवण-छवि को बनाए रखता है, जबकि संदर्भ में निहित आज्ञापालन का भाव पादटिप्पणी में बताया गया है।
- source_word: וְלֹא הָלְכוּ בָהּ
  choice: और उसके अनुसार नहीं चले
  rationale: הלך ב के आचरण-संबंधी रूपक को स्वाभाविक हिन्दी में रखता है और स्त्रीलिंग एकवचन संकेत को ‘व्यवस्था’ से जोड़ता है।
theological_decisions:
- issue: वाचा के संदर्भ में תּוֹרָה का अनुवाद
  choice: मेरी व्यवस्था
  alternative: मेरी शिक्षा
  rationale: यह प्रसंग परमेश्वर द्वारा सामने रखी गई वाचा-संबंधी मांग के त्याग पर बल देता है; ‘व्यवस्था’ उस बल को बनाए रखती है, जबकि व्यापक अर्थ ‘शिक्षा’ पादटिप्पणी में सुरक्षित है।
- issue: שׁמע בְּקוֹל को स्पष्टतः ‘आज्ञा मानना’ कहना या श्रवण-रूपक रखना
  choice: मेरी वाणी नहीं सुनी
  alternative: मेरी वाणी नहीं मानी
  rationale: मूल अभिव्यक्ति सुनने की है, जिसमें आज्ञापालन निहित है। मुख्य पाठ में मूल रूपक और अर्थगत तनाव रखा गया है; वैकल्पिक व्याख्या पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली। ‘वाणी सुनना’ और ‘उसके अनुसार चलना’ मूल इब्रानी बिंबों को पर्याप्त स्वाभाविकता के साथ सुरक्षित रखते हैं।
