source:
  edition: WLC
  text: כִּ֣י ק֥וֹל נְהִ֛י נִשְׁמַ֥ע מִ/צִּיּ֖וֹן אֵ֣יךְ שֻׁדָּ֑דְנוּ בֹּ֤שְׁנֽוּ מְאֹד֙ כִּֽי עָזַ֣בְנוּ אָ֔רֶץ כִּ֥י הִשְׁלִ֖יכוּ מִשְׁכְּנוֹתֵֽי/נוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/018.yaml
  text: 'For the sound of wailing is heard from Zion: “How we are devastated! We are utterly ashamed[a], because we have left the land[c][b], because they have cast down our dwellings.”'
translation:
  language: hi
  text: 'क्योंकि सिय्योन से विलाप की आवाज़ सुनाई दे रही है: “हम कैसे उजाड़ दिए गए हैं![a] हम अत्यन्त लज्जित हैं, क्योंकि हमने देश छोड़ दिया है,[b] क्योंकि उन्होंने हमारे निवास-स्थानों को ढा दिया है।”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हम कैसे लूट लिए गए हैं!” हिब्रू क्रिया सामान्य विनाश अथवा शत्रु द्वारा लूटे जाने—दोनों पर बल दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या “क्योंकि हमने देश त्याग दिया है।” हिब्रू में देश से चले जाने या उसे त्याग देने—दोनों का भाव हो सकता है; विलाप का संदर्भ दंड के अधीन प्रस्थान की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “उन्होंने हमारे निवास-स्थानों को फेंक दिया है”; आशय उन्हें गिराने या नष्ट करने का हो सकता है।
    reason: literal_rendering
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद पिछले संदर्भ में शोक मनाने के आह्वान का कारण बताता है; ‘क्योंकि’ उस संबंध को स्पष्ट और स्वाभाविक रखता है।
- source_word: קוֹל נְהִי
  choice: विलाप की आवाज़
  rationale: קוֹל का श्रव्य भाव और נְהִי का शोकपूर्ण विलाप—दोनों इस सहज हिन्दी पदबंध में बने रहते हैं।
- source_word: נִשְׁמַע
  choice: सुनाई दे रही है
  rationale: निफ़अल का कर्मवाच्य अर्थ रखा गया है और भविष्यद्वाणी की सजीव शैली के लिए वर्तमान प्रगतिशील रूप स्वाभाविक है।
- source_word: מִצִּיּוֹן
  choice: सिय्योन से
  rationale: स्थानवाचक संबंध सीधे रखा गया है और पारंपरिक हिन्दी बाइबलीय नाम ‘सिय्योन’ बनाए रखा गया है।
- source_word: אֵיךְ שֻׁדָּדְנוּ
  choice: हम कैसे उजाड़ दिए गए हैं!
  rationale: אֵיךְ के विस्मयपूर्ण विलाप और שׁדד के व्यापक विनाश के भाव को रखा गया है; क्रिया का कर्मवाच्य स्वरूप भी सुरक्षित है।
- source_word: בֹּשְׁנוּ מְאֹד
  choice: हम अत्यन्त लज्जित हैं
  rationale: בושׁ की लज्जा और מְאֹד की तीव्रता को dignified, सहज आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: כִּי עָזַבְנוּ אָרֶץ
  choice: क्योंकि हमने देश छोड़ दिया है
  rationale: עזב के ‘छोड़ना/त्यागना’ संबंधी खुले अर्थ को किसी बाध्य प्रस्थान की स्पष्ट व्याख्या जोड़े बिना रखा गया है; אָרֶץ यहाँ यहूदा की भूमि अथवा देश को सूचित करता है।
- source_word: כִּי הִשְׁלִיכוּ מִשְׁכְּנוֹתֵינוּ
  choice: क्योंकि उन्होंने हमारे निवास-स्थानों को ढा दिया है
  rationale: अनिर्दिष्ट तीसरे पुरुष बहुवचन ‘उन्होंने’ बनाए रखा गया है। השליך का मूल भाव ‘फेंक देना’ है, पर निवास-स्थानों के साथ ‘ढा देना’ हिंसक विनाश को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: देश छोड़ने का कारण
  choice: ‘हमने देश छोड़ दिया है’—कारण को अनिर्दिष्ट रखा गया
  alternative: ‘हमें देश छोड़ना पड़ा है’ या ‘हमने देश त्याग दिया है’
  rationale: संदर्भ दंड के अधीन बाध्य प्रस्थान की ओर संकेत कर सकता है, पर हिब्रू क्रिया स्वयं छोड़ने और त्यागने—दोनों अर्थों की अनुमति देती है; इसलिए मुख्य पाठ उस तनाव को निर्णायक रूप से हल नहीं करता।
- issue: विनाश करने वालों की पहचान
  choice: अनिर्दिष्ट ‘उन्होंने’
  alternative: ‘शत्रुओं ने’
  rationale: हिब्रू में कर्ता तीसरे पुरुष बहुवचन है, पर उसकी पहचान स्पष्ट नहीं की गई; इसलिए शत्रुओं को नाम देकर व्याख्या नहीं जोड़ी गई।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और विलाप की काव्यात्मक तीव्रता के अनुरूप रखी गई है। ‘अत्यन्त’ और ‘निवास-स्थान’ हल्की औपचारिकता देते हैं, पर सामान्य पाठक के लिए स्पष्ट हैं। उद्धरण-चिह्न सिय्योन से सुनाई देने वाले सामूहिक विलाप को अलग करते हैं।
