id: JER.9.22
reference: Jeremiah 9:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה אַל יִתְהַלֵּ֤ל חָכָם֙ בְּ/חָכְמָת֔/וֹ וְ/אַל יִתְהַלֵּ֥ל הַ/גִּבּ֖וֹר בִּ/גְבֽוּרָת֑/וֹ אַל יִתְהַלֵּ֥ל עָשִׁ֖יר בְּ/עָשְׁרֽ/וֹ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/022.yaml
  text: 'Thus says Yahweh: Let not the wise man boast in his wisdom[a], and let not the mighty man boast in his might; let not the rich man boast in his riches.'
translation:
  language: hi
  text: 'याहवे यों कहता है: बुद्धिमान अपनी बुद्धि पर घमण्ड न करे, और वीर अपनी वीरता पर घमण्ड न करे; धनवान अपने धन पर घमण्ड न करे।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में तीनों निषेध प्रतिनिधिक पुल्लिंग एकवचन में हैं: ‘बुद्धिमान’, ‘वीर’ और ‘धनवान’।'
    reason: मूल भाषा की व्याकरणिक संरचना स्पष्ट करना।
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: याहवे यों कहता है
  rationale: यह प्रचलित भविष्यद्वक्तीय संदेश-सूत्र है। ‘यों कहता है’ मूल की औपचारिकता और वर्तमान में प्रभावी अधिकारपूर्ण घोषणा—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אַל יִתְהַלֵּל
  choice: घमण्ड न करे
  rationale: הלל के हित्पएल रूप का अर्थ यहाँ अपने गुण या साधन पर इतराना है। ‘घमण्ड न करे’ निषेधात्मक भाव को स्पष्ट और सहज हिन्दी में रखता है।
- source_word: חָכָם
  choice: बुद्धिमान
  rationale: यह विशेषण संज्ञा के रूप में प्रयुक्त हुआ है। हिन्दी में ‘बुद्धिमान’ प्रतिनिधिक एकवचन को बिना अनावश्यक रूप से ‘पुरुष’ जोड़ने के स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְּחָכְמָתוֹ
  choice: अपनी बुद्धि पर
  rationale: ב यहाँ घमण्ड के आधार या विषय को दर्शाता है; हिन्दी में ‘पर’ इसका सबसे स्वाभाविक रूप है।
- source_word: הַגִּבּוֹר
  choice: वीर
  rationale: גִּבּוֹר सामर्थ्यवान या पराक्रमी व्यक्ति को दर्शा सकता है। ‘वीर’ संक्षिप्त, गरिमापूर्ण है और प्रसंग को केवल शारीरिक बल तक सीमित नहीं करता।
- source_word: בִּגְבוּרָתוֹ
  choice: अपनी वीरता पर
  rationale: यह גִּבּוֹר का सजातीय संज्ञा-रूप है; ‘वीर/वीरता’ मूल की शब्दगत पुनरुक्ति और काव्यात्मक समानांतरता को बनाए रखता है।
- source_word: עָשִׁיר
  choice: धनवान
  rationale: संज्ञार्थक विशेषण का स्वाभाविक प्रतिनिधिक एकवचन हिन्दी रूप।
- source_word: בְּעָשְׁרוֹ
  choice: अपने धन पर
  rationale: עֹשֶׁר का अर्थ धन या संपत्ति है। ‘धन’ आधुनिक हिन्दी में सहज है और ‘धनवान’ के साथ मूल की सजातीयता को यथासंभव बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: मानवीय उपलब्धियों पर घमण्ड का निषेध
  choice: हर खंड में ‘घमण्ड न करे’
  alternative: ‘अपनी प्रशंसा न करे’ या ‘गौरव न करे’
  rationale: हित्पएल रूप आत्मश्लाघा को व्यक्त करता है। ‘घमण्ड’ नैतिक चेतावनी को स्पष्ट करता है, जबकि पद इससे आगे यह नहीं बताता कि बुद्धि, वीरता या धन अपने आप में बुरे हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण भविष्यद्वक्तीय लय और तीन समानांतर निषेधों की संरचना रखी गई है। ‘बुद्धिमान’, ‘वीर’ और ‘धनवान’ सामान्य प्रतिनिधिक संज्ञार्थक विशेषणों के रूप में प्रयुक्त हैं।
