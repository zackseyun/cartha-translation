base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/015.yaml
  text: Young lions roar against him; they raise their voice. They make his land a desolation; his cities are burned[a], without inhabitant.
translation:
  language: hi
  text: 'युवा सिंह उसके विरुद्ध दहाड़ते हैं;

    वे अपनी आवाज़ ऊँची करते हैं।


    वे उसके देश को उजाड़ कर देते हैं;

    उसके नगर जला दिए जाते हैं[a],

    और उनमें कोई रहनेवाला नहीं रहता।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके नगर उजाड़ दिए जाते हैं।” इब्रानी रूप נצתה कठिन है; इसका अर्थ “जला दिए जाते हैं” या अधिक सामान्य रूप से “नष्ट/उजाड़ दिए जाते हैं” समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָיו
  choice: उसके विरुद्ध
  rationale: שׁאג के साथ עַל यहाँ शत्रुतापूर्ण दिशा या आक्रमण का भाव देता है। एकवचन सर्वनाम प्रसंग में इस्राएल/याकूब के सामूहिक मानवीकरण को बनाए रखता है।
- source_word: יִשְׁאֲגוּ
  choice: दहाड़ते हैं
  rationale: सिंह की प्रबल और धमकी-भरी आवाज़ के लिए यह स्वाभाविक हिन्दी क्रिया है और मूल बिंब को बनाए रखती है।
- source_word: כְפִרִים
  choice: जवान सिंह
  rationale: यह शब्द छोटे शावकों के बजाय शक्तिशाली युवा सिंहों को सूचित करता है; ‘जवान सिंह’ आधुनिक पाठक के लिए स्पष्ट है।
- source_word: נָתְנוּ קוֹלָם
  choice: वे अपनी आवाज़ बुलंद करते हैं
  rationale: शाब्दिक इब्रानी मुहावरा ‘उन्होंने अपनी आवाज़ दी’ है। यह हिन्दी रूप उसकी ऊँची, धमकी-भरी पुकार को स्वाभाविक ढंग से व्यक्त करता है। काव्यात्मक वर्णन में वर्तमान काल पहले उपवाक्य के साथ दृश्य की सजीवता बनाए रखता है।
- source_word: וַיָּשִׁיתוּ
  choice: उन्होंने ... बना दिया है
  rationale: שׁית यहाँ किसी वस्तु को एक दशा में पहुँचा देने का परिणामसूचक अर्थ देता है।
- source_word: אַרְצוֹ
  choice: उसके देश
  rationale: ‘देश’ राष्ट्रीय भूभाग के अर्थ को स्पष्ट करता है और एकवचन संबंधसूचक रूप इस्राएल के मानवीकरण को बनाए रखता है।
- source_word: לְשַׁמָּה
  choice: उजाड़
  rationale: यह संज्ञा विनाश और निर्जन दशा को दर्शाती है; ‘उजाड़ बना दिया’ हिन्दी में परिणाम को स्पष्ट रूप से व्यक्त करता है।
- source_word: עָרָיו
  choice: उसके नगर
  rationale: मूल के बहुवचन और तीसरे पुरुष एकवचन संबंधसूचक प्रत्यय का सीधा तथा स्वाभाविक अनुवाद है।
- source_word: נצתה
  choice: जला दिए गए हैं
  rationale: कठिन इब्रानी रूप का इस प्रसंग में संभावित अर्थ नगरों का आग से नष्ट होना है। पाठगत/शाब्दिक अनिश्चितता के कारण व्यापक अर्थ ‘उजाड़ दिए गए’ को पाद-टिप्पणी में रखा गया है।
- source_word: מִבְּלִי יֹשֵׁב
  choice: वहाँ कोई निवासी नहीं रहा
  rationale: यह निर्जनता और जनशून्यता को आधुनिक, सहज हिन्दी में व्यक्त करता है; एकवचन कृदंत का सामूहिक बल ‘कोई निवासी’ में सुरक्षित है।
