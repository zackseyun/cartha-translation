source:
  edition: WLC
  text: וְ/עַתָּ֗ה מַה לָּ/ךְ֙ לְ/דֶ֣רֶךְ מִצְרַ֔יִם לִ/שְׁתּ֖וֹת מֵ֣י שִׁח֑וֹר וּ/מַה לָּ/ךְ֙ לְ/דֶ֣רֶךְ אַשּׁ֔וּר לִ/שְׁתּ֖וֹת מֵ֥י נָהָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/018.yaml
  text: And now[a], what have you to do with the way to Egypt, to drink the waters of Shihor? And what have you to do with the way to Assyria[b], to drink the waters of the River?
translation:
  language: hi
  text: और अब, मिस्र जाने के मार्ग से तुम्हें क्या लेना-देना है कि तुम शीहोर का जल पीओ?[a] और अश्शूर जाने के मार्ग से तुम्हें क्या लेना-देना है कि तुम नदी का जल पीओ?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शीहोर संभवतः नील नदी अथवा उसकी पूर्वी शाखाओं में से किसी एक का नाम है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात् फरात नदी।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: और अब
  rationale: संयोजक ו और कालवाचक עַתָּה दोनों को रखते हुए वर्तमान चुनौती की ओर आलंकारिक संक्रमण व्यक्त करता है।
- source_word: מַה לָּךְ
  choice: तुम्हारा क्या लेना-देना है
  rationale: यह मुहावरा केवल सूचना नहीं माँगता, बल्कि संबंध या संलग्नता पर फटकार व्यक्त करता है; आधुनिक हिन्दी में यह उसका स्वाभाविक समतुल्य है।
- source_word: לְדֶרֶךְ מִצְרַיִם
  choice: मिस्र के मार्ग से
  rationale: דֶּרֶךְ के ठोस ‘मार्ग’ रूपक और मिस्र की ओर जाने या उससे संबंध रखने के भाव को बनाए रखता है।
- source_word: לִשְׁתּוֹת
  choice: कि तुम ... पियो
  rationale: उद्देश्यसूचक infinitive को हिन्दी में स्वाभाविक परिणाम/उद्देश्यवाचक उपवाक्य द्वारा व्यक्त किया गया है।
- source_word: מֵי שִׁחוֹר
  choice: शीहोर का जल
  rationale: शिहोर को सीधे ‘नील’ से प्रतिस्थापित करने के बजाय मूल का स्थाननाम सुरक्षित रखा गया है; पहचान पादटिप्पणी में दी गई है।
- source_word: אַשּׁוּר
  choice: अश्शूर
  rationale: हिब्रू राष्ट्रीय नाम का हिन्दी बाइबलीय रूप, जो मिस्र के समानांतर विदेशी शक्ति को सूचित करता है।
- source_word: מֵי נָהָר
  choice: महानद का जल
  rationale: इस भू-राजनीतिक संदर्भ में निश्चित ‘नदी’ फरात को सूचित करती है। ‘महानद’ हिन्दी में पारंपरिक, संक्षिप्त और नाम-जैसा रूप है, जबकि स्पष्ट पहचान पादटिप्पणी में रखी गई है।
theological_decisions:
- issue: विदेशी जल पीने के बिंब का अर्थ
  choice: मिस्र और अश्शूर के जल पीने का रूपक मुख्य पाठ में यथावत रखा गया है।
  alternative: इसे स्पष्ट करके ‘मिस्र और अश्शूर से सहायता लेने’ के रूप में अनुवाद करना।
  rationale: व्यापक संदर्भ विदेशी राजनीतिक सहारे की ओर संकेत करता है, पर पद स्वयं उस अर्थ को जल पीने के रूपक में कहता है। उसे खोलकर लिखना मूल की काव्यात्मकता और संभावित अर्थ-तनाव को घटा देता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिन्दी। समानांतर प्रश्न-विन्यास को दोहराकर हिब्रू की आलंकारिक फटकार सुरक्षित रखी गई है। सभी पादटिप्पणी-चिह्न संबंधित पदांश के बाद रखे गए हैं।
