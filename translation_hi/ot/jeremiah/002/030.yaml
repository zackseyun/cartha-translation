- source_word: הִכֵּיתִי
  choice: मैंने ... मारा
  rationale: हिफ़ील रूप का मूल अर्थ ‘मारना/प्रहार करना’ है। ‘मारा’ आधुनिक हिन्दी में स्पष्ट है और इसे अनावश्यक रूप से ‘मार डाला’ नहीं बनाता।
- source_word: בְּנֵיכֶם
  choice: तुम्हारे पुत्रों
  rationale: इब्रानी शब्द शाब्दिक रूप से पुल्लिंग बहुवचन ‘तुम्हारे पुत्र’ है; व्यापक ‘सन्तान’ की सम्भावना पादटिप्पणी में रखी गई है।
- source_word: מוּסָר
  choice: सुधार
  rationale: מוּסָר में अनुशासन, ताड़ना और शिक्षा के अर्थ सम्मिलित हो सकते हैं। दण्डात्मक प्रहार के इस प्रसंग में ‘सुधार’ उसके उपचारात्मक उद्देश्य को सहज हिन्दी में व्यक्त करता है।
- source_word: לֹא לָקָחוּ
  choice: स्वीकार नहीं किया
  rationale: מוּסָר के साथ לקח का अर्थ मुहावरेदार रूप से सुधार या अनुशासन को ग्रहण/स्वीकार करना है।
- source_word: אָכְלָה
  choice: निगल लिया
  rationale: तलवार के विषय में ‘खाना’ का रूपक विनाश का सजीव मानवीकरण करता है; हिन्दी में ‘निगल लिया’ वही तीव्र बिम्ब स्वाभाविक ढंग से रखता है।
- source_word: חַרְבְּכֶם
  choice: तुम्हारी तलवार
  rationale: प्रत्यक्ष सम्बन्धवाचक रूप सुरक्षित रखा गया है; यह लोगों द्वारा की गई हिंसा की ओर संकेत करता है।
- source_word: נְבִיאֵיכֶם
  choice: तुम्हारे भविष्यद्वक्ताओं
  rationale: मूल पाठ का सम्बन्धवाचक रूप रखा गया है, जिससे अपने ही भविष्यद्वक्ताओं के विनाश की विडम्बना उभरती है।
- source_word: כְּאַרְיֵה מַשְׁחִית
  choice: जैसे विनाश करने वाला सिंह
  rationale: यह अनुवाद מַשְׁחִית के कृदन्तीय बल को बनाए रखता है और ‘फाड़ खाने वाला’ जैसे अतिरिक्त व्याख्यात्मक रंग से बचता है।
