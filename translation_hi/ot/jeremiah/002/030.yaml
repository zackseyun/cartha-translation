  yaml_path: translation/ot/jeremiah/002/030.yaml
  text: In vain I struck your sons[a]; they accepted no correction[c][b]. Your sword devoured your prophets like a destroying lion.
translation:
  language: hi
  text: मैंने व्यर्थ ही तुम्हारे पुत्रों[a] को मारा; उन्होंने सुधार[b] स्वीकार नहीं किया। तुम्हारी तलवार ने तुम्हारे भविष्यद्वक्ताओं को विनाशकारी सिंह की तरह निगल लिया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तुम्हारी सन्तान’; इब्रानी में शाब्दिक रूप से पुल्लिंग बहुवचन ‘तुम्हारे पुत्र’ है।
    reason: lexical_alternative
  - marker: b
    text: या ‘अनुशासन’ अथवा ‘शिक्षा’; इब्रानी מוּסָר में सुधारात्मक अनुशासन और नैतिक शिक्षा—दोनों के भाव हो सकते हैं।
    reason: lexical_alternative
  - marker: c
    text: या ‘फाड़ खाने वाला सिंह’।
    reason: lexical_alternative
