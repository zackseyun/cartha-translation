source:
  edition: WLC
  text: גַּ֣ם מֵ/אֵ֥ת זֶה֙ תֵּֽצְאִ֔י וְ/יָדַ֖יִ/ךְ עַל רֹאשֵׁ֑/ךְ כִּֽי מָאַ֤ס יְהֹוָה֙ בְּ/מִבְטַחַ֔יִ/ךְ וְ/לֹ֥א תַצְלִ֖יחִי לָ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/037.yaml
  text: From this one too you will go out with your hands on your head[a], for Yahweh has rejected those in whom you trust[d][c][b], and you will not prosper through them.
translation:
  language: hi
  text: तुम इससे भी अपने दोनों हाथ सिर पर रखकर निकलोगी[a], क्योंकि याहवे ने उन्हें ठुकरा दिया है जिन पर तुम भरोसा करती हो[b], और उनके सहारे तुम्हें सफलता नहीं मिलेगी[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “इससे” का संकेत संभवतः अभी-अभी उल्लिखित विदेशी शक्ति, अर्थात मिस्र, की ओर है। दोनों हाथ सिर पर रखना शोक, लज्जा या पराजय की मुद्रा थी।
    reason: प्रासंगिक और सांस्कृतिक टिप्पणी
  - marker: b
    text: 'शाब्दिक अर्थ: “तुम्हारे भरोसे” या “तुम्हारे भरोसे के साधन।”'
    reason: शाब्दिक विकल्प
  - marker: c
    text: 'या: “और तुम उनके साथ सफल नहीं होगी।”'
    reason: अनुवाद विकल्प
lexical_decisions:
- source_word: גַּם מֵאֵת זֶה
  choice: इससे भी
  rationale: यह इब्रानी संकेतवाचक की अनिर्दिष्टता बनाए रखता है और पिछले प्रसंग के अनुसार एक और विदेशी शक्ति—संभवतः मिस्र—की ओर संकेत करता है।
- source_word: תֵּצְאִי
  choice: तुम ... निकलोगी
  rationale: स्त्रीलिंग एकवचन रूप संबोधित, मानवीकृत यहूदा/यरूशलेम से मेल खाता है और अपमानित होकर लौटने या विदा होने का भाव देता है।
- source_word: וְיָדַיִךְ עַל רֹאשֵׁךְ
  choice: अपने दोनों हाथ सिर पर रखे हुए
  rationale: इब्रानी के दृश्य बिंब और द्विवचन ‘दोनों हाथ’ को बनाए रखते हुए शोक, लज्जा या पराजय की मुद्रा व्यक्त करता है।
- source_word: מָאַס
  choice: ठुकरा दिया है
  rationale: यहाँ यहोवा द्वारा यहूदा के भरोसे के साधनों को अस्वीकार करने का अर्थ स्वाभाविक और सशक्त ढंग से व्यक्त होता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के विशिष्ट वाचा-नाम को उपाधि में बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: בְּמִבְטַחַיִךְ
  choice: उन्हें ... जिन पर तुम भरोसा करती हो
  rationale: शाब्दिक बहुवचन ‘तुम्हारे भरोसे/भरोसे की वस्तुएँ’ प्रसंग में उन विदेशी शक्तियों को मूर्त रूप से सूचित करता है जिन पर यहूदा निर्भर है।
- source_word: וְלֹא תַצְלִיחִי לָהֶם
  choice: उनके सहारे तुम्हें सफलता नहीं मिलेगी
  rationale: הצליח का सफलता पाने का अर्थ और संबद्ध पक्षों पर निर्भरता—दोनों को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुरक्षरीय विशिष्ट नाम सीधे आया है; ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: מִבְטַחַיִךְ के संदर्भ की पहचान
  choice: जिन पर तुम भरोसा करती हो
  alternative: तुम्हारे भरोसे; तुम्हारे भरोसे के साधन
  rationale: प्रसंग विदेशी राजनीतिक शक्तियों की ओर संकेत करता है, पर अनुवाद किसी एक राष्ट्र का नाम मुख्य पाठ में जोड़कर मूल की व्यापकता को सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। स्त्रीलिंग क्रियाएँ मानवीकृत यहूदा/यरूशलेम के इब्रानी संबोधन को सुरक्षित रखती हैं। दृश्य मुहावरे को मुख्य पाठ में बनाए रखकर उसका सांस्कृतिक अर्थ पादटिप्पणी में समझाया गया है।
