base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/006.yaml
  text: They did not say[a], ‘Where is Yahweh, who brought us up from the land of Egypt, who led us through the wilderness, through a land of desert plain and pit, through a land of drought and deep darkness, through a land where no man passed through and no human dwelt?’
translation:
  language: hi
  text: उन्होंने यह नहीं कहा, “याहवे कहाँ हैं, जो हमें मिस्र देश से ऊपर ले आए, जो हमें वीराने में से, मरुभूमि और गड्ढों की धरती में से, सूखेपन और घोर अन्धकार[a] की धरती में से ले चले—उस धरती में से जिसमें कोई मनुष्य नहीं गुज़रा और जहाँ कोई मानव नहीं बसा?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मृत्यु की छाया।”
    reason: צַלְמָוֶת के सम्भव पारम्परिक ‘मृत्यु की छाया’ अर्थ को, सन्दर्भानुकूल ‘घोर अन्धकार’ के साथ, सुरक्षित रखना।
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय आधुनिक हिन्दी में प्रचलित निकट लिप्यंतरण द्वारा सुरक्षित रखा गया है।
- source_word: הַמַּעֲלֶה אֹתָנוּ מֵאֶרֶץ מִצְרָיִם
  choice: जो हमें मिस्र देश से निकालकर ऊपर ले आए
  rationale: हिफ़ील क्रिया के ‘ऊपर ले आने’ के चित्र को रखा गया है; ‘निकालकर’ हिन्दी में मिस्र से निर्गमन की दिशा को स्वाभाविक और स्पष्ट बनाता है।
- source_word: הַמּוֹלִיךְ אֹתָנוּ
  choice: जो हमें ... ले चले
  rationale: हिफ़ील का अर्थ मार्ग दिखाते हुए ले जाना है; ‘ले चले’ स्मरण किए जा रहे निरन्तर मार्गदर्शन को सहज हिन्दी में व्यक्त करता है।
- source_word: בַּמִּדְבָּר
  choice: वीराने में से
  rationale: מִדְבָּר निर्जन वन्य प्रदेश है; ‘वीराना’ आगे आने वाले अधिक विशिष्ट शुष्क भू-दृश्य से भेद रखते हुए सामान्य पाठक के लिए स्वाभाविक है।
- source_word: עֲרָבָה וְשׁוּחָה
  choice: मरुभूमि और गड्ढों
  rationale: עֲרָבָה का शुष्क मैदान/मरुस्थल और שׁוּחָה का गड्ढा या धँसा स्थान वाला अर्थ सुरक्षित है।
- source_word: צִיָּה
  choice: सूखे
  rationale: यह शब्द अत्यन्त शुष्कता या सूखी भूमि दर्शाता है; विशेषणात्मक ‘सूखे की धरती’ की अपेक्षा ‘सूखे ... की धरती’ अधिक संक्षिप्त और स्वाभाविक है।
- source_word: צַלְמָוֶת
  choice: घोर अन्धकार
  rationale: प्रसंग में गहन अन्धकार और भयावहता का अर्थ उपयुक्त है; सम्भव पारम्परिक अर्थ फुटनोट में रखा गया है।
- source_word: אִישׁ ... אָדָם
  choice: कोई मनुष्य ... कोई मानव
  rationale: दो अलग इब्रानी शब्दों के बीच हल्का शब्दगत भेद रखा गया है, यद्यपि दोनों यहाँ सामान्य मानव-सन्दर्भ में हैं।
- source_word: עָבַר בָּהּ ... יָשַׁב
  choice: जहाँ से ... नहीं गुज़रा ... जहाँ ... नहीं बसा
  rationale: पहली क्रिया उस प्रदेश को पार करने और दूसरी स्थायी निवास करने का निषेध व्यक्त करती है।
theological_decisions:
- issue: צַלְמָוֶת का अर्थ
  choice: घोर अन्धकार
  alternative: मृत्यु की छाया
  rationale: निर्जन और संकटपूर्ण भूभाग के वर्णन में ‘घोर अन्धकार’ सुदृढ़ कोशगत अर्थ है, पर मृत्यु-संबन्धी पारम्परिक व्याख्या सम्भव है और इसलिए उसे फुटनोट में सुरक्षित रखा गया है।
