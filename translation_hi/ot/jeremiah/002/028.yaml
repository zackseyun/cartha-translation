id: JER.2.28
reference: Jeremiah 2:28
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אַיֵּ֤ה אֱלֹהֶ֨י/ךָ֙ אֲשֶׁ֣ר עָשִׂ֣יתָ לָּ֔/ךְ יָק֕וּמוּ אִם יוֹשִׁיע֖וּ/ךָ בְּ/עֵ֣ת רָעָתֶ֑/ךָ כִּ֚י מִסְפַּ֣ר עָרֶ֔י/ךָ הָי֥וּ אֱלֹהֶ֖י/ךָ יְהוּדָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/028.yaml
  text: But where are your gods that you made for yourself? Let them arise[a], if they can save you in the time of your trouble. For your gods, Judah[b], are as many as your cities.
translation:
  language: hi
  text: पर तुम्हारे वे देवता कहाँ हैं जिन्हें तुमने अपने लिए बनाया था? वे उठें, यदि वे तुम्हारी विपत्ति के समय तुम्हें बचा सकें। क्योंकि हे यहूदा, जितने तुम्हारे नगर हैं, उतने ही तुम्हारे देवता भी हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַיֵּה
  choice: पर ... कहाँ हैं
  rationale: प्रसंग में וְ प्रतिवादात्मक मोड़ देता है और אַיֵּה स्थानवाचक प्रश्न है; यह रूप भविष्यद्वक्ता की फटकार को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֱלֹהֶיךָ אֲשֶׁר עָשִׂיתָ לָּךְ
  choice: तुम्हारे वे देवता ... जिन्हें तुमने अपने लिए बनाया था
  rationale: बहुवचन 'देवता' मूर्तियों की ओर संकेत करता है; 'अपने लिए बनाया' उनके मानव-निर्मित होने और לָּךְ के आत्मवाचक भाव को बनाए रखता है।
- source_word: יָקוּמוּ
  choice: वे उठें
  rationale: यह चुनौतीपूर्ण आज्ञार्थक/जस्सिव भाव को संक्षिप्त और सजीव रूप में सुरक्षित रखता है।
- source_word: אִם יוֹשִׁיעוּךָ
  choice: यदि वे ... तुम्हें बचा सकें
  rationale: אִם यहाँ उनकी सामर्थ्य को परखने वाली व्यंग्यपूर्ण चुनौती प्रस्तुत करता है; 'बचा सकें' उस निहित संदेह को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּעֵת רָעָתֶךָ
  choice: तुम्हारी विपत्ति के समय
  rationale: इस प्रसंग में רָעָה नैतिक बुराई नहीं, बल्कि संकट या विनाशकारी विपत्ति है।
- source_word: כִּי מִסְפַּר עָרֶיךָ הָיוּ אֱלֹהֶיךָ
  choice: क्योंकि ... जितने तुम्हारे नगर हैं, उतने ही तुम्हारे देवता भी हैं
  rationale: כִּי कारण देता है और מִסְפַּר का मुहावरा दोनों की संख्या की समानता बताता है; हिन्दी का 'जितने...उतने' इसे स्पष्ट और सहज रखता है।
- source_word: יְהוּדָה
  choice: हे यहूदा
  rationale: यह प्रत्यक्ष संबोधन है; 'हे' से सम्बोधन का व्याकरणिक कार्य स्पष्ट होता है।
theological_decisions:
- issue: '''तुम्हारे देवता'' का संदर्भ'
  choice: यहूदा द्वारा बनाए गए अनेक देवताओं या मूर्तियों के लिए बहुवचन
  alternative: इस्राएल के परमेश्वर या किसी एक देवता का संदर्भ
  rationale: '''जिन्हें तुमने अपने लिए बनाया'' और नगरों के बराबर संख्या का उल्लेख स्पष्ट करता है कि यहाँ यहोवा नहीं, मानव-निर्मित झूठे देवता अभिप्रेत हैं।'
- issue: देवताओं की उद्धार-सामर्थ्य पर कथन
  choice: व्यंग्यपूर्ण, सशर्त चुनौती—'यदि वे ... बचा सकें'
  alternative: उनके वास्तव में बचाने की सम्भावना का तटस्थ कथन
  rationale: יָקוּמוּ के चुनौतीपूर्ण भाव और אִם के संयोजन में उनकी असमर्थता निहित है, पर अनुवाद मूल की शर्तात्मक अभिव्यक्ति को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सीधी, गरिमापूर्ण भविष्यद्वक्ताई फटकार। 'विपत्ति' से नैतिक बुराई के बजाय संकट का अर्थ स्पष्ट होता है। कोई पादटिप्पणी आवश्यक नहीं; दिए गए अंग्रेज़ी परामर्श-पाठ के पादटिप्पणी-चिह्न और उनकी सामग्री परस्पर असंगत प्रतीत होते हैं, इसलिए उन्हें मूल इब्रानी के आधार पर आयात नहीं किया गया।
