  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। बहुवचन आज्ञाओं को हिन्दी के सामान्य ‘देखो/भेजो/विचार करो’ रूप में रखा गया है। पश्चिम से पूर्व तक जाँच करने की भौगोलिक व्यापकता तथा अंतिम प्रश्न का विस्मयपूर्ण बल सुरक्षित है।
