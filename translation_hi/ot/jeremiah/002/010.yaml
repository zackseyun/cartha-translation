  text: כִּ֣י עִבְר֞וּ אִיֵּ֤י כִתִּיִּים֙ וּ/רְא֔וּ וְ/קֵדָ֛ר שִׁלְח֥וּ וְ/הִֽתְבּוֹנְנ֖וּ מְאֹ֑ד וּ/רְא֕וּ הֵ֥ן הָיְתָ֖ה כָּ/זֹֽאת׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/010.yaml
  text: For cross over to the coasts of Kittim and see[a]; send to Kedar and consider carefully[b]; see whether there has ever been anything like this.
translation:
  language: hi
  text: क्योंकि कित्तीम के तटीय प्रदेशों तक जाकर देखो[a]; केदार की ओर भेजो और बहुत ध्यान से विचार करो[b]; फिर देखो, क्या कभी ऐसा कुछ हुआ है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘कित्तीम के द्वीपों/समुद्रतटीय प्रदेशों तक।’ ‘कित्तीम’ सम्भवतः साइप्रस को, या अधिक व्यापक रूप से पश्चिम के समुद्री प्रदेशों को, सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: केदार अरब की जनजातियों या पूर्व-दक्षिणपूर्व में स्थित उनके क्षेत्र को सूचित करता है। इस प्रकार केदार और कित्तीम मिलकर पश्चिम से पूर्व तक की तुलना प्रस्तुत करते हैं।
    reason: cultural_note
lexical_decisions:
- source_word: עִבְרוּ
  choice: पार जाकर
  rationale: बहुवचन आज्ञार्थक क्रिया भौगोलिक रूप से दूसरी ओर जाने का ठोस भाव रखती है; ‘पार जाकर’ इसे स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אִיֵּי כִתִּיִּים
  choice: कित्तियों के समुद्री तटों
  rationale: אִיִּים का अर्थ द्वीप या समुद्रतटीय प्रदेश हो सकता है। मुख्य पाठ में ‘समुद्री तटों’ व्यापक भौगोलिक भाव देता है, जबकि टिप्पणी वास्तविक विकल्प सुरक्षित रखती है।
- source_word: וּרְאוּ
  choice: देखो
  rationale: मूल में यह सीधा बहुवचन आदेश है और पद में दोहराया गया है; ‘देखो’ उसकी संक्षिप्त आलंकारिक शक्ति बनाए रखता है।
- source_word: וְקֵדָר שִׁלְחוּ
  choice: केदार में दूत भेजो
  rationale: मूल में भेजी जाने वाली वस्तु या व्यक्ति व्यक्त नहीं है, पर सन्दर्भ में जाँच के लिए लोगों को भेजना निहित है। हिन्दी में केवल ‘केदार को भेजो’ अधूरा और भ्रामक होता, इसलिए ‘दूत’ का सीमित स्पष्टिकरण किया गया है।
- source_word: וְהִתְבּוֹנְנוּ מְאֹד
  choice: बहुत ध्यान से विचार करो
  rationale: हित्पोलेल क्रिया सावधानीपूर्वक देखने-परखने और मनन करने का भाव देती है; מְאֹד की तीव्रता ‘बहुत ध्यान से’ द्वारा व्यक्त है।
- source_word: הֵן הָיְתָה כָּזֹאת
  choice: क्या कभी ऐसा कुछ हुआ है?
  rationale: यह विस्मयपूर्ण आलंकारिक जाँच है। ‘कभी’ प्रसंगगत बल को स्वाभाविक हिन्दी में व्यक्त करता है, बिना उत्तर को पाठ में जोड़ने के।
