source:
  edition: WLC
  text: אֹמְרִ֨ים לָ/עֵ֜ץ אָ֣בִ/י אַ֗תָּה וְ/לָ/אֶ֨בֶן֙ אַ֣תְּ ילדת/ני כִּֽי פָנ֥וּ אֵלַ֛/י עֹ֖רֶף וְ/לֹ֣א פָנִ֑ים וּ/בְ/עֵ֤ת רָֽעָתָ/ם֙ יֹֽאמְר֔וּ ק֖וּמָ/ה וְ/הוֹשִׁיעֵֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/027.yaml
  text: They say to a tree[a], “You are my father,” and to a stone, “You gave birth to me.” For they have turned their back to me and not their face; but in the time of their trouble they say[c][b], “Rise up and save us!”
translation:
  language: hi
  text: वे पेड़ से कहते हैं, “तू मेरा पिता है,” और पत्थर से, “तूने मुझे जन्म दिया है।”[a] क्योंकि उन्होंने मेरी ओर अपना चेहरा नहीं, बल्कि पीठ फेरी है।[b] लेकिन अपनी विपत्ति[c] के समय वे कहते हैं, “उठ और हमें बचा!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तूने मुझे जना है।”
    reason: יַּלָד का मूल अर्थ जन्म देना है; यह निकटतर हिन्दी वैकल्पिक अभिव्यक्ति है।
  - marker: b
    text: हिब्रू में शाब्दिक रूप से, “उन्होंने मेरी ओर पीठ फेरी, चेहरा नहीं”; यह अस्वीकार करने का मुहावरा है।
    reason: अनुवाद में स्वाभाविक हिन्दी मुहावरे का प्रयोग हुआ है; टिप्पणी मूल पाठ की पीठ और चेहरे वाली संरचना दिखाती है।
  - marker: c
    text: या, “अपने संकट के समय।”
    reason: רָעָה का अर्थ प्रसंग के अनुसार विपत्ति, संकट, अनिष्ट या बुराई हो सकता है।
lexical_decisions:
- source_word: לָעֵץ
  choice: पेड़ से
  rationale: עֵץ का अर्थ ‘पेड़’ या ‘लकड़ी’ हो सकता है। यहाँ ‘पेड़’ मूल पाठ की ठोस और व्यंग्यपूर्ण छवि को बनाए रखता है, जिसमें सृजी हुई वस्तु को पिता कहा गया है।
- source_word: אָבִי אַתָּה
  choice: तू मेरा पिता है
  rationale: प्रत्यक्ष संबोधन और मूर्ति को पिता मानने का दावा सरल, स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: וְלָאֶבֶן אַתְּ יְלַדְתִּנִי
  choice: और पत्थर से, “तूने मुझे जन्म दिया है”
  rationale: יַלד का मूल भाव जन्म देना है। शाब्दिक पारिवारिक भाषा भविष्यद्वक्ता के मूर्तिपूजा-विरोधी आरोप की तीक्ष्णता बनाए रखती है।
- source_word: פָנוּ אֵלַי עֹרֶף וְלֹא פָנִים
  choice: उन्होंने मेरी ओर मुँह करने के बजाय अपनी पीठ फेर ली है
  rationale: हिब्रू में पीठ/गर्दन के पिछले भाग और चेहरे का स्पष्ट विरोध है। हिन्दी का मुहावरा ‘पीठ फेरना’ अस्वीकार का भाव स्वाभाविक रूप से व्यक्त करता है, जबकि ‘मुँह’ का उल्लेख मूल विरोध को बचाता है।
- source_word: וּבְעֵת רָעָתָם
  choice: लेकिन अपनी विपत्ति के समय
  rationale: רָעָה यहाँ नैतिक बुराई के बजाय संकट या अनिष्ट की दशा बताता है; ‘विपत्ति’ प्रार्थना में माँगे गए बचाव के प्रसंग के अनुकूल है।
- source_word: יֹאמְרוּ
  choice: वे कहते हैं
  rationale: अपूर्ण क्रिया यहाँ संकट के समय उनकी सामान्य अथवा सजीव रूप से चित्रित प्रतिक्रिया बता सकती है। वर्तमान काल का हिन्दी रूप उस खुलापन को स्वाभाविक ढंग से रखता है।
- source_word: קוּמָה וְהוֹשִׁיעֵנוּ
  choice: उठ और हमें बचा
  rationale: दोनों आज्ञार्थक रूप सीधे और तात्कालिक निवेदन को व्यक्त करते हैं; भाषा आधुनिक है और अनावश्यक पुरातनता से बचती है।
theological_decisions:
- issue: लकड़ी/पत्थर की वस्तुओं को जनक मानने वाली भाषा
  choice: लोगों को पेड़ को ‘पिता’ और पत्थर को जन्म देने वाला कहते हुए सीधे उद्धृत किया गया है।
  alternative: इसे सामान्यीकृत करके केवल यह कहना कि वे मूर्तियों की उपासना करते हैं।
  rationale: मूल हिब्रू मूर्तिपूजा को केवल नाम नहीं देता, बल्कि सृजी हुई वस्तुओं को अपने अस्तित्व का स्रोत मानने की विडंबना को पारिवारिक भाषा में उजागर करता है। इसे नरम करना भविष्यद्वक्ता के आरोप की शक्ति घटा देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। परमेश्वर और मूर्तियों से प्रत्यक्ष संबोधन में ‘तू’ मूल की एकवचन निकट संबोधन-शैली को दर्शाता है। वाक्य में आरोप, अस्वीकार और संकट के समय सहायता की पुकार के बीच का तीखा विरोध सुरक्षित रखा गया है।
