  terminology: ‘याहवे’ appropriately renders the divine name. ‘निष्ठावान प्रेम’ communicates חֶסֶד without collapsing it into mere emotion, and ‘वधू-काल का प्रेम’ retains the nuptial sense of כְּלוּלֹת without deciding between betrothal, wedding, or early bridal life.
