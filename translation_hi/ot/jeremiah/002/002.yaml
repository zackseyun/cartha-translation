    rationale: ‘यरूशलेम के सुनते हुए’ is grammatically and idiomatically unnatural. ‘यरूशलेम के कानों में’ preserves the Hebrew image and is established, understandable literary Hindi.
  - severity: medium
    issue: Awkward Hindi for זָכַרְתִּי לָךְ
    rationale: ‘मुझे तेरे लिए ... याद है’ is not natural Hindi. ‘मुझे ... स्मरण है’ faithfully conveys divine remembrance, while the possessive context identifies what is remembered.
  - severity: low
    issue: Nonstandard and unclear term ‘दुलहिनपन’
    rationale: For modern standard Hindi, ‘वधू-काल’ is clearer and more dignified. Its accompanying note preserves the lexical uncertainty of כְּלוּלֹת.
  - severity: low
    issue: The phrase ‘पुकारकर कह’ is redundant
    rationale: The Hebrew command can be represented naturally by ‘घोषणा कर’; this retains public proclamation without unnecessary verbal duplication.
