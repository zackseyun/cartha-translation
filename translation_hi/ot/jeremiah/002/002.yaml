base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/002.yaml
  text: 'Go and proclaim in the hearing of Jerusalem[a], saying, ‘Thus says Yahweh: I remember for you the faithful love of your youth, the love of your betrothal, when you went after me in the wilderness[b], in a land not sown.’'
translation:
  language: hi
  text: 'जा, और यरूशलेम के कानों में यह घोषणा कर: ‘याहवे यों कहता है: मुझे तेरी युवावस्था का निष्ठावान प्रेम, तेरे वधू-काल का प्रेम स्मरण है—जब तू मेरे पीछे निर्जन प्रदेश में, ऐसी भूमि में चली थी जो बोई नहीं गई थी।’[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘निष्ठावान प्रेम’ का अनुवाद ‘अटल प्रेम’ भी किया जा सकता है। ‘वधू-काल’ उस समय का संकेत करता है जब कोई वधू होती है; मूल शब्द को सगाई, विवाह, या आरंभिक वैवाहिक जीवन के संदर्भ में भी समझा जाता है।
    reason: lexical_alternative_and_alternative_reading
lexical_decisions:
- source_word: הָלֹךְ וְקָרָאתָ
  choice: जा और ... पुकारकर कह
  rationale: इनफिनिटिव एब्सोल्यूट और सीमित क्रिया से आज्ञा में बल और सार्वजनिक घोषणा का भाव आता है। हिंदी में यह अभिव्यक्ति गति और उद्घोषणा दोनों को स्वाभाविक रूप से रखती है।
- source_word: בְאָזְנֵי יְרוּשָׁלִַם
  choice: यरूशलेम के सुनते हुए
  rationale: शाब्दिक ‘यरूशलेम के कानों में’ का अर्थ बनाए रखते हुए नगर/लोगों के प्रति प्रत्यक्ष सार्वजनिक संबोधन को व्यक्त करता है।
- source_word: כֹּה אָמַר יְהוָה
  choice: याहवे यह कहता है
  rationale: मानक भविष्यद्वक्ताई संदेश-सूत्र को वर्तमान हिंदी में रखा गया है और יהוה को व्यक्तिगत नाम ‘याहवे’ के रूप में प्रस्तुत किया गया है।
- source_word: זָכַרְתִּי לָךְ
  choice: मुझे तेरे लिए ... याद है
  rationale: לָךְ के दत्तिव भाव को छोड़े बिना हिंदी में समझने योग्य रूप दिया गया है; यह स्मरण इस्राएल की ओर उन्मुख है।
- source_word: חֶסֶד נְעוּרַיִךְ
  choice: तेरी जवानी की निष्ठावान प्रीति
  rationale: חֶסֶד में प्रेम, विश्वस्तता और संबंधगत निष्ठा साथ हैं। ‘निष्ठावान प्रीति’ वैवाहिक काव्य-संदर्भ में इन पक्षों को संक्षेप में व्यक्त करती है।
- source_word: אַהֲבַת כְּלוּלֹתָיִךְ
  choice: तेरे दुलहिनपन का प्रेम
  rationale: כְּלוּלֹת के दुलहिन/विवाहारंभ संबंधी अर्थ को बनाए रखता है, पर इसे केवल सगाई या विवाह-दिवस तक सीमित नहीं करता।
- source_word: לֶכְתֵּךְ אַחֲרַי
  choice: जब तू ... मेरे पीछे चली थी
  rationale: स्त्रीलिंग संबोधन और पीछे चलने के मूल इब्रानी बिंब दोनों को सुरक्षित रखता है।
- source_word: בַּמִּדְבָּר
  choice: निर्जन प्रदेश में
  rationale: यह मरुभूमि से व्यापक, निर्जन और अकृषित क्षेत्र का अर्थ दे सकता है तथा अगले वाक्यांश से सहज जुड़ता है।
- source_word: בְּאֶרֶץ לֹא זְרוּעָה
  choice: ऐसी भूमि में जहाँ बीज नहीं बोया गया था
  rationale: अकृषित भूमि के कृषि-बिंब को स्पष्ट, स्वाभाविक आधुनिक हिंदी में बनाए रखता है।
theological_decisions:
- issue: इस्राएल के आरंभिक संबंध का वैवाहिक रूपक
  choice: ‘दुलहिनपन का प्रेम’ रखकर विवाह-संबंधी बिंब को बनाए रखा गया है।
  alternative: ‘सगाई के दिनों का प्रेम’ या ‘विवाह के दिनों का प्रेम’
  rationale: मूल शब्द दुलहिन की अवस्था/काल का संकेत देता है, पर सगाई, विवाह-दिवस या आरंभिक वैवाहिक जीवन में से किसी एक को निर्णायक रूप से निर्दिष्ट नहीं करता।
- issue: יהוה का निरूपण
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: व्यक्तिगत ईश्वरीय नाम को शीर्षक से प्रतिस्थापित किए बिना लिप्यंतरित किया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिंदी; यरूशलेम को स्त्रीलिंग एकवचन ‘तू’ से संबोधित करके मूल के निकट संबंधगत और भविष्यद्वक्ताई स्वर को रखा गया है। पदचिह्न [a] मुख्य पाठ में उपस्थित है।
