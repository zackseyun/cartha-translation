  source_fidelity: 'The draft broadly reflects the Hebrew: the emphatic command, public address to Jerusalem, Yahweh''s remembrance, the twofold nuptial imagery, Israel''s following in the wilderness, and the uncultivated land are retained. However, several Hindi expressions obscure rather than convey the source idiom naturally.'
