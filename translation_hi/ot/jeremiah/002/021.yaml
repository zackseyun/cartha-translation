source:
  edition: WLC
  text: וְ/אָֽנֹכִי֙ נְטַעְתִּ֣י/ךְ שֹׂרֵ֔ק כֻּלֹּ֖/ה זֶ֣רַע אֱמֶ֑ת וְ/אֵיךְ֙ נֶהְפַּ֣כְתְּ לִ֔/י סוּרֵ֖י הַ/גֶּ֥פֶן נָכְרִיָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/021.yaml
  text: Yet I planted you as a choice vine[a], wholly of true seed[c][b]. How then have you turned for me into the degenerate shoots of a foreign vine?
translation:
  language: hi
  text: फिर भी मैंने तुम्हें उत्तम दाखलता के रूप में लगाया था[a], जो पूरी की पूरी खरे बीज से उगी हुई थी[b]। फिर तुम कैसे मेरे लिए पराई दाखलता की बिगड़ी हुई डालियों[c] में बदल गईं?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘चुनी हुई दाखलता’; इब्रानी शब्द श्रेष्ठ या उत्तम किस्म की दाखलता को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘जो पूरी की पूरी असली पौध थी।’
    reason: lexical_alternative
  - marker: c
    text: ‘बिगड़ी हुई डालियों’ के पीछे का इब्रानी शब्द कठिन है; अन्य संभावनाएँ हैं ‘जंगली डालियाँ’ या ‘भ्रष्ट बढ़त’।
    reason: lexical_alternative
lexical_decisions:
- source_word: נְטַעְתִּיךְ
  choice: मैंने तुम्हें ... लगाया था
  rationale: काल पूर्ण किए गए अतीत के कार्य को व्यक्त करता है; स्त्रीलिंग एकवचन प्रत्यय के अनुसार इस्राएल/यहूदा को स्त्री के रूप में संबोधित किया गया है।
- source_word: שֹׂרֵק
  choice: उत्तम दाखलता
  rationale: यह शब्द किसी साधारण बेल के बजाय चुनी हुई या श्रेष्ठ किस्म की दाखलता का बोध कराता है।
- source_word: כֻּלֹּה זֶרַע אֱמֶת
  choice: पूरी-की-पूरी असली बीज से
  rationale: वाक्यांश रोपण-सामग्री की संपूर्ण शुद्धता और असलियत पर बल देता है; ‘असली बीज’ कृषि-रूपक को बनाए रखता है और אֱמֶת को अनावश्यक रूप से केवल नैतिक विश्वासयोग्यता नहीं बनाता।
- source_word: וְאֵיךְ
  choice: फिर ... कैसे
  rationale: यह पहले कथन के विपरीत स्थिति पर आश्चर्य और धिक्कार से भरा आलंकारिक प्रश्न प्रस्तुत करता है।
- source_word: נֶהְפַּכְתְּ לִי
  choice: मेरे लिए ... में बदल गईं
  rationale: निफ़ाल रूप परिवर्तन को व्यक्त करता है; לִי को ‘मेरे लिए’ कहकर परमेश्वर और संबोधित प्रजा के संबंधगत भाव को बनाए रखा गया है।
- source_word: סוּרֵי
  choice: बिगड़ी हुई डालियों
  rationale: रूप और सटीक अर्थ कठिन हैं; संदर्भ में यह मूल रोपण से हट चुकी, विकृत या जंगली बढ़त की ओर संकेत करता है। ‘डालियों’ से दाखलता का रूपक बना रहता है।
- source_word: הַגֶּפֶן נָכְרִיָּה
  choice: पराई दाखलता की
  rationale: נָכְרִיָּה का अर्थ पराई/विदेशी है। ‘पराई’ स्वाभाविक हिन्दी में भिन्नता और संबंध-विच्छेद दोनों का भाव बनाए रखता है।
theological_decisions:
- issue: परमेश्वर द्वारा लगाई गई दाखलता के रूप में इस्राएल/यहूदा का रूपक
  choice: कृषि और दाखलता के रूपक को सीधे बनाए रखा गया है।
  alternative: 'रूपक को खोलकर कहना: ‘मैंने तुम्हें शुद्ध प्रजा बनाया था, पर तुम भ्रष्ट हो गईं।’'
  rationale: मूल इब्रानी का विस्तृत दाखलता-रूपक भविष्यद्वाणी और वाचा-संबंधी प्रतिध्वनियाँ रखता है। इसे नैतिक व्याख्या में बदलना मूल की चित्रात्मकता और अंतर्पाठीय संबंधों को घटा देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। स्त्रीलिंग ‘बदल गईं’ मूल में प्रजा के स्त्रीरूप संबोधन को दर्शाता है। ‘दाखलता’ बाइबिलीय कृषि-रूपक को स्पष्ट और संक्षिप्त रूप में बनाए रखता है।
