  text: וָ/אָבִ֤יא אֶתְ/כֶם֙ אֶל אֶ֣רֶץ הַ/כַּרְמֶ֔ל לֶ/אֱכֹ֥ל פִּרְיָ֖/הּ וְ/טוּבָ֑/הּ וַ/תָּבֹ֨אוּ֙ וַ/תְּטַמְּא֣וּ אֶת אַרְצִ֔/י וְ/נַחֲלָתִ֥/י שַׂמְתֶּ֖ם לְ/תוֹעֵבָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/007.yaml
  text: I brought you into a fertile land to eat its fruit and its goodness[a], but when you came in[b], you defiled my land and made my inheritance an abomination.
translation:
  language: hi
  text: मैं तुम्हें एक उपजाऊ भूमि[a] में ले आया, ताकि तुम उसके फल और उसकी भरपूर उपज[b] को खाओ। पर तुमने वहाँ आकर मेरी भूमि को अशुद्ध कर दिया और मेरी विरासत को घृणित बना दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘करमेल की भूमि’; यहाँ ‘करमेल’ का अर्थ भरपूर फल देने वाली, अच्छी तरह खेती की गई भूमि भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘उसकी अच्छाई’; इसका अर्थ ‘उसकी अच्छी वस्तुएँ’ या ‘उसकी समृद्धि’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָבִיא
  choice: मैं ... ले आया
  rationale: בוא के हिफ़ील रूप में यहाँ परमेश्वर द्वारा लोगों को किसी स्थान में लाने का भाव है; ‘ले आया’ स्वाभाविक हिन्दी में इस कर्तृत्व को स्पष्ट रखता है।
- source_word: אֶרֶץ הַכַּרְמֶל
  choice: एक उपजाऊ भूमि
  rationale: इस प्रसंग में כַּרְמֶל संभवतः व्यक्तिवाचक स्थान-नाम नहीं, बल्कि फलवती और खेती योग्य भूमि का सूचक सामान्य संज्ञा है। आगे उसके फल और उपज का उल्लेख इसी अर्थ को पुष्ट करता है।
- source_word: לֶאֱכֹל פִּרְיָהּ וְטוּבָהּ
  choice: ताकि तुम उसके फल और उसकी भरपूर उपज को खाओ
  rationale: לֶאֱכֹל उद्देश्य व्यक्त करता है; פְּרִי का सीधा अर्थ ‘फल’ है और טוּב यहाँ भूमि से मिलने वाली अच्छी और भरपूर पैदावार को दर्शा सकता है। ‘भरपूर उपज’ आधुनिक हिन्दी में आशय को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: וַתָּבֹאוּ
  choice: पर तुमने वहाँ आकर
  rationale: क्रियाओं का क्रम लोगों के भूमि में आने और फिर उसे अशुद्ध करने को जोड़ता है। ‘पर’ पहले उपकार और बाद के विश्वासघात के बीच निहित विरोध को व्यक्त करता है; ‘वहाँ’ हिन्दी में गंतव्य को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: וַתְּטַמְּאוּ
  choice: अशुद्ध कर दिया
  rationale: पिएल रूप किसी वस्तु को अशुद्ध या अपवित्र करने का प्रबल धार्मिक और नैतिक भाव रखता है। ‘अशुद्ध कर दिया’ इस व्यापकता को बनाए रखता है।
- source_word: אַרְצִי
  choice: मेरी भूमि
  rationale: मूल पाठ का प्रथम पुरुष संबंधसूचक रूप भूमि पर परमेश्वर के स्वामित्व को उभारता है।
- source_word: נַחֲלָתִי
  choice: मेरी विरासत
  rationale: נַחֲלָה विरासत में मिले या विशेष रूप से दिए गए अधिकार और हिस्से को दर्शाता है। ‘विरासत’ वाचा-संबंधी और स्वामित्व—दोनों भावों को बनाए रखती है।
- source_word: שַׂמְתֶּם לְתוֹעֵבָה
  choice: घृणित बना दिया
  rationale: תוֹעֵבָה नैतिक और धार्मिक रूप से अत्यंत घिनौनी या त्याज्य वस्तु का प्रबल शब्द है। ‘घृणित बना दिया’ अर्थ की तीव्रता रखते हुए सहज आधुनिक हिन्दी देता है।
theological_decisions:
- issue: כַּרְמֶל का अर्थ
  choice: सामान्य संज्ञा के रूप में ‘उपजाऊ भूमि’
  alternative: व्यक्तिवाचक नाम के रूप में ‘करमेल की भूमि’
  rationale: फल और भूमि की अच्छी उपज का निकटवर्ती उल्लेख गुणवाचक अर्थ के अनुकूल है, यद्यपि स्वरूपतः ‘करमेल’ पढ़ना संभव है; इसलिए विकल्प पाद-टिप्पणी में रखा गया है।
- issue: טוּב का व्यापक अर्थ
  choice: भूमि की ‘भरपूर उपज’
  alternative: ‘अच्छी वस्तुएँ’ या ‘भलाई’
  rationale: संज्ञा व्यापक रूप से अच्छाई, समृद्धि या उत्तम वस्तुओं को सूचित कर सकती है। कृषि-संदर्भ में ‘भरपूर उपज’ स्वाभाविक है, पर व्यापक अर्थ को पाद-टिप्पणी में सुरक्षित रखा गया है।
- issue: भूमि को अशुद्ध करने का स्वरूप
  choice: ‘अशुद्ध कर दिया’—धार्मिक और नैतिक दोनों अर्थ खुले रखे गए
  alternative: केवल ‘अपवित्र कर दिया’ या ‘दूषित कर दिया’
  rationale: טמא का प्रयोग अनुष्ठानिक अशुद्धता के साथ नैतिक अपवित्रता भी व्यक्त कर सकता है। मुख्य पाठ किसी एक आयाम तक अर्थ को सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘भूमि’, ‘अशुद्ध’ और ‘विरासत’ जैसे शब्द मूल पाठ के स्वामित्व, धार्मिक भार और वाचा-संबंधी संकेतों को बनाए रखते हैं; कठिन शाब्दिकता से बचने के लिए טוּב को मुख्य पाठ में ‘भरपूर उपज’ कहा गया है और उसका व्यापक अर्थ पाद-टिप्पणी में दिया गया है।
