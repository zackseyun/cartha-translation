reference: Jeremiah 2:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: קֹ֤דֶשׁ יִשְׂרָאֵל֙ לַ/יהוָ֔ה רֵאשִׁ֖ית תְּבוּאָתֹ֑/ה כָּל אֹכְלָ֣י/ו יֶאְשָׁ֔מוּ רָעָ֛ה תָּבֹ֥א אֲלֵי/הֶ֖ם נְאֻם יְהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/003.yaml
  text: Israel was holy to Yahweh[a], the firstfruits of his harvest; all who devoured him became guilty; disaster came upon them[c][b], declares Yahweh.
translation:
  language: hi
  text: 'इस्राएल याहवे के लिए पवित्र था,

    उसकी फसल की पहली उपज[a] था।

    जितनों ने उसे निगल लिया[b], वे दोषी ठहरे[c];

    उन पर विपत्ति आ पड़ी—

    यह याहवे की घोषणा है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसकी उपज का पहला अंश।’ यह चित्र परमेश्वर को समर्पित पहली उपज का है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘उसे खा गए’; यह दूसरे राष्ट्रों द्वारा इस्राएल को नष्ट करने या लूटने का रूपक है।
    reason: cultural_note
  - marker: c
    text: या ‘दोषी हुए’ अथवा ‘दोष के भागी बने।’
    reason: lexical_alternative
lexical_decisions:
- source_word: קֹדֶשׁ
  choice: पवित्र
  rationale: यहाँ संज्ञा विधेय के रूप में इस्राएल के याहवे के लिए अलग और समर्पित होने का भाव व्यक्त करती है; ‘पवित्र’ आधुनिक हिन्दी में स्वाभाविक रहते हुए धार्मिक-सांस्कृतिक बल बनाए रखता है।
- source_word: לַיהוָה
  choice: याहवे के लिए
  rationale: लामेद समर्पण अथवा संबंध दर्शाता है। ‘के लिए’ इस्राएल के याहवे को समर्पित होने का संक्षिप्त और स्वाभाविक भाव देता है।
- source_word: רֵאשִׁית תְּבוּאָתוֹ
  choice: उसकी फसल की पहली उपज
  rationale: यह अभिव्यक्ति परमेश्वर को समर्पित पहले फल की कृषि और उपासना-संबंधी छवि बनाए रखती है; ‘फसल’ תְּבוּאָה के संदर्भ को स्पष्ट करती है।
- source_word: אֹכְלָיו
  choice: जितनों ने उसे निगल लिया
  rationale: शाब्दिक अर्थ ‘उसे खानेवाले’ है, पर यहाँ शत्रु राष्ट्रों द्वारा इस्राएल को नष्ट या लूटे जाने की रूपकात्मक हिंसा है। ‘निगल लिया’ उस रूपक को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יֶאְשָׁמוּ
  choice: दोषी ठहरे
  rationale: क्रिया दोषी होने अथवा दोष का दायित्व उठाने का भाव देती है। ‘दोषी ठहरे’ न्याय के परिणाम को व्यक्त करता है, पर किसी विस्तृत न्यायालयी दृश्य को आरोपित नहीं करता।
- source_word: רָעָה תָּבֹא אֲלֵיהֶם
  choice: उन पर विपत्ति आ पड़ी
  rationale: न्याय के इस प्रसंग में רָעָה नैतिक बुराई के बजाय अनिष्ट या विपत्ति को सूचित करता है। यह चयन दंडात्मक परिणाम को स्पष्ट रखता है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: यह भविष्यवाणी का प्रामाणिक सूत्र है। ‘घोषणा’ उसके भार और अधिकार को आधुनिक, गरिमापूर्ण हिन्दी में व्यक्त करती है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में वाचा का विशिष्ट नाम יהוה है। उसका लिप्यंतरण नाम की विशिष्टता बनाए रखता है और उसे सामान्य उपाधि में नहीं बदलता।
- issue: इस्राएल के लिए पवित्र पहली उपज का रूपक
  choice: उसकी फसल की पहली उपज
  alternative: उसकी उपज का पहला अंश
  rationale: यह पाठ इस्राएल को याहवे के लिए समर्पित पहली उपज के रूप में प्रस्तुत करता है। चुना हुआ रूप कृषि और पवित्रीकरण—दोनों पक्षों को सुरक्षित रखता है, बिना बाद की किसी विशिष्ट धर्मसैद्धांतिक व्याख्या को जोड़ने के।
- issue: יִאשָׁמוּ और תָּבוֹא के काल-पक्ष का प्रस्तुतीकरण
  choice: दोषी ठहरे; विपत्ति आ पड़ी
  alternative: दोषी ठहरते थे; विपत्ति आती थी / दोषी होंगे; विपत्ति आएगी
  rationale: हिब्रू अपूर्ण क्रियारूप प्रसंग में सामान्य या परिणामी घटना व्यक्त कर सकते हैं। पूर्व पद के भूतकालीन स्मरण और शत्रुओं पर आए न्याय के प्रवाह के कारण हिन्दी में पूर्ण भूतकाल चुना गया, जबकि पादटिप्पणी दोष संबंधी अर्थ-सीमा को खुला रखती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक पंक्ति-विन्यास वाली है। ‘याहवे’ को व्यक्तिवाचक वाचा-नाम के रूप में रखा गया है। रूपक को समझाने के बजाय मुख्य पाठ में सुरक्षित रखा गया है और आवश्यक स्पष्टीकरण पादटिप्पणियों में दिया गया है।
