language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה מַה מָּצְא֨וּ אֲבוֹתֵי/כֶ֥ם בִּ/י֙ עָ֔וֶל כִּ֥י רָחֲק֖וּ מֵ/עָלָ֑/י וַ/יֵּֽלְכ֛וּ אַחֲרֵ֥י הַ/הֶ֖בֶל וַ/יֶּהְבָּֽלוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/005.yaml
  text: 'Thus says Yahweh: What wrong did your fathers find in me[a], that they went far from me, and went after vanity[b], and became vain?'
translation:
  language: hi
  text: 'याहवे यों कहता है:


    “तुम्हारे पूर्वजों ने मुझमें कौन-सा अन्याय पाया[a]

    कि वे मुझसे दूर चले गए,

    व्यर्थता के पीछे चले,

    और स्वयं व्यर्थ हो गए?[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अन्याय’ का अनुवाद ‘बुराई’, ‘कुटिलता’ या ‘दोष’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘व्यर्थता’ और ‘व्यर्थ हो गए’ इब्रानी में एक ही मूल शब्द से बने हैं। भाव यह है कि खोखली और निकम्मी वस्तु के पीछे चलकर वे स्वयं भी वैसे ही हो गए।
    reason: wordplay
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: याहवे यह कहता है
  rationale: यह भविष्यद्वक्ताओं की मानक संदेशवाहक उद्घोषणा है। परमेश्वर के व्यक्तिगत वाचा-नाम יְהוָה को छिपाने के बजाय ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: מַה מָּצְאוּ אֲבוֹתֵיכֶם בִּי עָוֶל
  choice: तुम्हारे पुरखाओं ने मुझमें कौन-सा अन्याय पाया
  rationale: ‘पाया’ मूल इब्रानी मुहावरे और आलंकारिक प्रश्न को बनाए रखता है। עָוֶל नैतिक बुराई, अन्याय या कुटिलता का बोध करा सकता है; ‘अन्याय’ इस प्रसंग में स्पष्ट और स्वाभाविक है। אֲבוֹתֵיכֶם के लिए ‘पुरखाओं’ से पिछली वाचा-पीढ़ियों का संकेत मिलता है।
- source_word: כִּי רָחֲקוּ מֵעָלָי
  choice: कि वे मुझसे दूर चले गए
  rationale: यह दूरी की मूल छवि के साथ संबंध और वाचा से अलगाव का भाव भी बनाए रखता है। כִּי को यहाँ उस आचरण की व्याख्या के रूप में ‘कि’ किया गया है जिसने आरंभिक प्रश्न को जन्म दिया।
- source_word: וַיֵּלְכוּ אַחֲרֵי הַהֶבֶל
  choice: व्यर्थता के पीछे चले
  rationale: הלך אחרי का अनुसरण करने वाला चित्र बना रहता है। הֶבֶל मूलतः भाप या सांस जैसी क्षणभंगुरता और लाक्षणिक रूप से खोखलेपन अथवा निरर्थकता को दर्शाता है; प्रसंग में मूर्तियाँ संकेतित हो सकती हैं, पर उन्हें सीधे पाठ में जोड़ना मूल की व्यापकता को सीमित कर देता।
- source_word: וַיֶּהְבָּלוּ
  choice: और स्वयं व्यर्थ हो गए
  rationale: क्रिया और पिछले संज्ञा-रूप का एक ही इब्रानी मूल הבל है। ‘व्यर्थता...व्यर्थ’ इस जानबूझकर किए गए शब्दालंकार और उसके अर्थ—जिस खोखली वस्तु का उन्होंने अनुसरण किया, वैसे ही वे बन गए—को सुरक्षित रखता है।
theological_decisions:
- issue: יְהוָה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वतापूर्ण लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: הֶבֶל को मूर्तियों के रूप में स्पष्ट करना
  choice: व्यर्थता
  alternative: मूर्तियाँ; निकम्मी वस्तुएँ
  rationale: यहाँ मूर्तिपूजा का संकेत प्रबल है, पर मूल शब्द जानबूझकर ‘खोखलापन/व्यर्थता’ के व्यापक अर्थ और अगली क्रिया के साथ शब्दालंकार को बनाए रखता है। इसलिए व्याख्यात्मक ‘मूर्तियाँ’ को मुख्य पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज भविष्यद्वाणी शैली अपनाई गई है। काव्यात्मक पंक्ति-विन्यास मूल प्रश्न की गति और अंतिम शब्दालंकार को उभारता है। ‘पुरखाओं’ सामान्य पाठक के लिए स्वाभाविक है और पूर्वजों की ऐतिहासिक-वाचा संबंधी पीढ़ियों को व्यक्त करता है।
