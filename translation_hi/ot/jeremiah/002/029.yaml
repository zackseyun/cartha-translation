  text: לָ֥/מָּה תָרִ֖יבוּ אֵלָ֑/י כֻּלְּ/כֶ֛ם פְּשַׁעְתֶּ֥ם בִּ֖/י נְאֻם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/029.yaml
  text: Why do you contend with me? All of you have rebelled against me[b][a], declares Yahweh.
translation:
  language: hi
  text: “तुम मुझसे क्यों विवाद करते हो?[a] तुम सबने मेरे विरुद्ध विद्रोह किया है[b],” याहवे की यह वाणी है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम मुझसे क्यों झगड़ते हो?” इब्रानी क्रिया का अर्थ विवाद करना, झगड़ना, या मुकदमा करना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “तुम सबने मेरे विरुद्ध अपराध किया है।” इब्रानी क्रिया में प्रायः विद्रोह या बगावत का अधिक प्रबल भाव होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: क्यों
  rationale: यह लोगों के व्यवहार का कारण पूछने वाला आलंकारिक प्रश्न है; आधुनिक हिन्दी में ‘क्यों’ स्वाभाविक है।
- source_word: תָרִיבוּ אֵלָי
  choice: तुम मुझसे ... विवाद करते हो
  rationale: ריב में विवाद करने, झगड़ने या मुकदमा लड़ने का भाव हो सकता है। ‘मुझसे विवाद करते हो’ टकराव और संभावित न्यायिक छाया दोनों को सहज हिन्दी में रखता है।
- source_word: כֻּלְּכֶם
  choice: तुम सबने
  rationale: यह पूरे समुदाय को बलपूर्वक संबोधित करता है; ‘तुम सबने’ उस सामूहिक बल को स्पष्ट रखता है।
- source_word: פְּשַׁעְתֶּם בִּי
  choice: मेरे विरुद्ध विद्रोह किया है
  rationale: פשע केवल सामान्य अपराध नहीं, बल्कि निष्ठा तोड़ने और विद्रोह करने का प्रबल भाव रखता है; בִּי अपराध के लक्ष्य को ‘मेरे विरुद्ध’ के रूप में दिखाता है।
- source_word: נְאֻם יְהוָה
  choice: यहोवा की यह वाणी है
  rationale: यह मानक भविष्यद्वाणी-सूत्र है। ‘वाणी’ उसकी औपचारिक और अधिकारपूर्ण प्रकृति बनाए रखता है, और יְהוָה को व्यक्तिगत वाचा-नाम ‘यहोवा’ के रूप में प्रस्तुत किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। हिन्दी में व्यापक रूप से पहचाना जाने वाला रूप ‘यहोवा’ नाम की विशिष्टता को बनाए रखता है; इसे उपाधि ‘प्रभु’ से बदलना मूल की यह विशेषता छिपा देता।
- issue: פשע की वाचागत गंभीरता
  choice: विद्रोह किया है
  alternative: अपराध किया है; उल्लंघन किया है
  rationale: यह क्रिया प्रायः अधिकार और निष्ठा के विरुद्ध बगावत का अर्थ देती है। ‘विद्रोह’ आरोप की गंभीरता रखता है, पर पद में न कही गई अतिरिक्त धार्मिक व्याख्या नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। प्रश्न का सामना कराने वाला स्वर तथा दूसरे वाक्य का सामूहिक आरोप सुरक्षित है। विराम-चिह्न हिन्दी की स्वाभाविक प्रत्यक्ष-वाणी शैली के अनुसार हैं।
