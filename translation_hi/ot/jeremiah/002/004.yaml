source:
  edition: WLC
  text: שִׁמְע֥וּ דְבַר יְהוָ֖ה בֵּ֣ית יַעֲקֹ֑ב וְ/כָֽל מִשְׁפְּח֖וֹת בֵּ֥ית יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/004.yaml
  text: Hear the word of Yahweh[a], O house of Jacob, and all the clans of the house of Israel.
translation:
  language: hi
  text: याहवे का वचन सुनो, हे याकूब के घराने, और हे इस्राएल के घराने के सभी कुलों!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: सुनो
  rationale: बहुवचन आज्ञार्थक क्रिया है; यह केवल ध्वनि सुनने नहीं, बल्कि संदेश को ध्यान से ग्रहण करने और मानने के लिए भविष्यद्वाणी-संबंधी आह्वान व्यक्त करती है।
- source_word: דְבַר
  choice: वचन
  rationale: याहवे के साथ यह भविष्यद्वाणी का प्रचलित सूत्र है। ‘संदेश’ अर्थ की दृष्टि से संभव है, पर ‘वचन’ सूत्रात्मक और धर्मवैचारिक प्रतिध्वनि को अधिक अच्छी तरह बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: בֵּית יַעֲקֹב
  choice: हे याकूब के घराने
  rationale: यह वाचा-समुदाय को किया गया सीधा संबोधन है। ‘हे’ इब्रानी में अलग शब्द के रूप में नहीं है, पर हिन्दी में संबोधन को स्वाभाविक और स्पष्ट करता है।
- source_word: וְכָל
  choice: और ... सभी
  rationale: सरल संयोजक और समग्रता-सूचक शब्द को स्वाभाविक हिन्दी वाक्य-विन्यास में रखा गया है।
- source_word: מִשְׁפְּחוֹת
  choice: कुलो
  rationale: यह शब्द इस्राएल के भीतर रक्त-संबंध पर आधारित सामाजिक समूहों को दर्शाता है। ‘कुल’ घरेलू अर्थ वाले ‘परिवार’ से व्यापक और ‘गोत्र’ से कम विशिष्ट है। संबोधन के कारण रूप ‘कुलो’ है।
- source_word: בֵּית יִשְׂרָאֵל
  choice: इस्राएल के घराने
  rationale: ‘याकूब के घराने’ के साथ समानांतरता और सामूहिक वाचा-संबंधी भाव बनाए रखने के लिए ‘घराने’ को दोहराया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे प्रयुक्त है। ‘याहवे’ उसका प्रचलित विद्वतापूर्ण लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। मूल का आरंभिक आज्ञार्थक क्रम और ‘याकूब के घराने/इस्राएल के घराने’ की समानांतरता सुरक्षित है। विस्मयादिबोधक चिह्न आह्वान की शक्ति व्यक्त करता है।
