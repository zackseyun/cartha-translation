id: JER.2.26
reference: Jeremiah 2:26
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כְּ/בֹ֤שֶׁת גַּנָּב֙ כִּ֣י יִמָּצֵ֔א כֵּ֥ן הֹבִ֖ישׁוּ בֵּ֣ית יִשְׂרָאֵ֑ל הֵ֤מָּה מַלְכֵי/הֶם֙ שָֽׂרֵי/הֶ֔ם וְ/כֹהֲנֵי/הֶ֖ם וּ/נְבִיאֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/026.yaml
  text: As a thief is ashamed when he is found[a], so the house of Israel has been put to shame—they, their kings, their officials, their priests[b], and their prophets.
translation:
  language: hi
  text: जैसे चोर पकड़े जाने पर[a] लज्जित होता है, वैसे ही इस्राएल के घराने के लोग लज्जित हुए हैं—वे स्वयं, उनके राजा, उनके अधिकारी[b], उनके याजक और उनके भविष्यद्वक्ता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसका पता चलने पर।”
    reason: lexical_alternative
  - marker: b
    text: या, “उनके शासक।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּבֹשֶׁת
  choice: जैसे ... लज्जित होता है
  rationale: כ prefixed to the noun בֹּשֶׁת introduces a comparison. A verbal Hindi clause expresses the simile naturally while retaining the shame motif.
- source_word: גַּנָּב
  choice: चोर
  rationale: The singular is generic; Hindi naturally uses the bare singular noun in such a comparison.
- source_word: כִּי יִמָּצֵא
  choice: पकड़े जाने पर
  rationale: The Niphal form denotes being found or discovered. In relation to a thief, 'पकड़े जाने पर' is the natural Hindi expression, while the footnote preserves the broader lexical possibility of being discovered.
- source_word: כֵּן
  choice: वैसे ही
  rationale: This is the natural Hindi correlative to the opening 'जैसे' and clearly marks the comparison.
- source_word: הֹבִישׁוּ
  choice: लज्जित हुए हैं
  rationale: The context presents Israel as exposed in shame. This wording preserves the realized state without reducing it merely to private embarrassment or intensifying it to total ruin.
- source_word: בֵּית יִשְׂרָאֵל
  choice: इस्राएल के घराने के लोग
  rationale: This retains the covenantal household expression while making the following plural verb and representative list natural in Hindi.
- source_word: הֵמָּה
  choice: वे स्वयं
  rationale: The emphatic resumptive pronoun is represented explicitly before the appositional list.
- source_word: מַלְכֵיהֶם
  choice: उनके राजा
  rationale: Direct rendering of the plural noun with its pronominal suffix.
- source_word: שָׂרֵיהֶם
  choice: उनके अधिकारी
  rationale: שׂרים denotes civic or ruling leaders. 'अधिकारी' is current, broad Hindi that does not restrict the group to hereditary princes.
- source_word: כֹהֲנֵיהֶם
  choice: उनके याजक
  rationale: Standard dignified Hindi biblical term for priests.
- source_word: נְבִיאֵיהֶם
  choice: उनके भविष्यद्वक्ता
  rationale: Standard Hindi biblical term for prophets.
theological_decisions:
- issue: दोष के दायरे में पूरा समुदाय और उसके अगुवे
  choice: पूरे इस्राएली समुदाय को लज्जित बताया गया है, और फिर उसके प्रमुख नेतृत्व-वर्गों को स्पष्ट रूप से गिनाया गया है।
  alternative: वचन का दोषारोपण केवल अगुवों तक सीमित समझना।
  rationale: בֵּית יִשְׂרָאֵל सामूहिक विषय है; उसके बाद הֵמָּה और राजाओं, अधिकारियों, याजकों तथा भविष्यद्वक्ताओं की सूची आती है। अनुवाद सामूहिक दोष और अगुवों की विशेष पहचान, दोनों को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली अपनाई गई है। 'इस्राएल के घराने के लोग' मूल सामूहिक मुहावरे को रखते हुए हिन्दी में बहुवचन सूची से सहज संबंध बनाता है। 'लज्जित' सार्वजनिक अपमान और शर्म, दोनों की अर्थ-छाया बनाए रखता है।
