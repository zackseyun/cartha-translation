source:
  edition: WLC
  text: שֹׁ֥מּוּ שָׁמַ֖יִם עַל זֹ֑את וְ/שַׂעֲר֛וּ חָרְב֥וּ מְאֹ֖ד נְאֻם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/012.yaml
  text: Be appalled at this[a], O heavens; shudder, be utterly desolate, declares Yahweh.
translation:
  language: hi
  text: “हे आकाशो, इस पर स्तब्ध हो जाओ; थरथरा उठो, और पूरी तरह उजड़ जाओ,” याहवे की वाणी है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֹׁמּוּ
  choice: स्तब्ध हो जा
  rationale: यह बहुवचन आज्ञार्थक रूप भय और विस्मय से जड़ हो जाने का भाव देता है। हिन्दी में ‘स्तब्ध हो जा’ इस तीव्र प्रतिक्रिया को स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: שָׁמַיִם
  choice: हे आकाश
  rationale: यह प्रत्यक्ष संबोधन है। इब्रानी का रूप बहुवचन हो सकता है, पर आधुनिक हिन्दी में सृष्टि को संबोधित करते हुए सामूहिक ‘आकाश’ अधिक स्वाभाविक है; इसी के अनुसार आज्ञाएँ एकवचन में हैं।
- source_word: עַל זֹאת
  choice: यह देखकर
  rationale: पदबंध उस बात की ओर संकेत करता है जिसका अभी वर्णन हुआ है। ‘यह देखकर’ हिन्दी में कारण और सामने उपस्थित भयावह तथ्य—दोनों का संकेत देता है।
- source_word: וְשַׂעֲרוּ
  choice: काँप उठ
  rationale: क्रिया भय से काँपने या रोमांचित हो उठने की तीव्र शारीरिक प्रतिक्रिया दर्शाती है। ‘काँप उठ’ आधुनिक हिन्दी में इसकी आकस्मिकता और आतंक सुरक्षित रखता है।
- source_word: חָרְבוּ מְאֹד
  choice: पूरी तरह उजड़ जा
  rationale: חרב में सूख जाने और उजड़ जाने दोनों की अर्थ-छाया संभव है; מְאֹד तीव्रता बढ़ाता है। यहाँ काव्यात्मक विनाश के भाव को रखते हुए ‘पूरी तरह उजड़ जा’ चुना गया है।
- source_word: נְאֻם יְהוָה
  choice: यहोवा की यह वाणी है
  rationale: यह नबी-साहित्य का गंभीर दैवी घोष-वाक्य है। यह रूप वक्ता के अधिकार और औपचारिकता को सहज हिन्दी में बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: टेट्राग्राम को उपाधि से बदलने के बजाय प्रचलित हिन्दी लिप्यंतरण ‘यहोवा’ द्वारा व्यक्तिगत दैवी नाम के रूप में प्रस्तुत किया गया है।
theological_decisions:
- issue: दैवी नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल में व्यक्तिगत दैवी नाम सीधे आया है। हिन्दी पाठकों के लिए परिचित लिप्यंतरण ‘यहोवा’ नाम और उपाधि का भेद बनाए रखता है; ‘याहवे’ अधिक ध्वन्यात्मक विकल्प है और ‘प्रभु’ पारंपरिक प्रतिस्थापन।
- issue: חָרְבוּ का काव्यात्मक अर्थ
  choice: पूरी तरह उजड़ जा
  alternative: बहुत सूख जा
  rationale: जड़ में सूखने और उजड़ने दोनों की अर्थ-संभावना है। आसमान को संबोधित इस तीव्र भविष्यद्वाणीपरक अनुक्रम में ‘उजड़ जा’ व्यापक विनाश और वीरानी का भाव देता है, जबकि पादटिप्पणी वैकल्पिक अर्थ सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक और भविष्यद्वाणीपरक गरिमा रखी गई है। आकाश के मानवीकरण को स्पष्ट करने के लिए संबोधन और आज्ञार्थक क्रियाएँ प्रयुक्त हुई हैं; भाषा जानबूझकर तीव्र है, पर अनावश्यक रूप से पुरातन नहीं।
