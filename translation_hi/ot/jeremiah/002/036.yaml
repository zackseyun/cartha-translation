source:
  edition: WLC
  text: מַה תֵּזְלִ֥י מְאֹ֖ד לְ/שַׁנּ֣וֹת אֶת דַּרְכֵּ֑/ךְ גַּ֤ם מִ/מִּצְרַ֨יִם֙ תֵּב֔וֹשִׁי כַּ/אֲשֶׁר בֹּ֖שְׁתְּ מֵ/אַשּֽׁוּר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/036.yaml
  text: Why do you go about so much[a], changing your way? You will also be put to shame by Egypt[b], as you were put to shame by Assyria.
translation:
  language: hi
  text: तू अपना मार्ग बदलने के लिए इतना इधर-उधर क्यों भटकती है?[a] तू मिस्र के कारण भी लज्जित होगी,[b] जैसे अश्शूर के कारण लज्जित हुई थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तू अपना रास्ता बदलने के लिए इतना इधर-उधर क्यों फिरती है?” इब्रानी अभिव्यक्ति बदलते गठबंधनों की खोज में बेचैन आवाजाही पर बल दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “तू मिस्र से भी निराश होगी, जैसे अश्शूर से निराश हुई थी।” इब्रानी क्रिया लज्जा या विफल भरोसे से हुई निराशा, दोनों का भाव दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה תֵּזְלִי מְאֹד
  choice: तू ... इतना इधर-उधर क्यों भटकती है?
  rationale: रूपकात्मक प्रश्न में फटकार का भाव है। क्रिया यहाँ बदलते विदेशी सहारों की खोज में बेचैन आवाजाही का संकेत देती है; ‘इधर-उधर भटकती’ इस गति को स्वाभाविक हिन्दी में व्यक्त करती है, बिना उसमें अनावश्यक नैतिक अर्थ जोड़ने के।
- source_word: לְשַׁנּוֹת
  choice: बदलने के लिए
  rationale: यह उद्देश्यसूचक क्रियारूप है और भटकने तथा मार्ग बदलने के बीच का संबंध स्पष्ट रखता है।
- source_word: דַּרְכֵּךְ
  choice: अपना मार्ग
  rationale: ‘मार्ग’ आचरण और राजनीतिक नीति—दोनों अर्थ समेट सकता है, इसलिए मूल की व्यापकता बनी रहती है।
- source_word: גַּם
  choice: भी
  rationale: यह बताता है कि अश्शूर की तरह मिस्र भी लज्जा का कारण बनेगा।
- source_word: מִמִּצְרַיִם ... מֵאַשּׁוּר
  choice: मिस्र के कारण ... अश्शूर के कारण
  rationale: בושׁ के साथ מִן लज्जा अथवा निराशा के स्रोत/कारण को सूचित करता है। हिन्दी में ‘के कारण’ इस संबंध को स्पष्ट और समानांतर ढंग से व्यक्त करता है।
- source_word: תֵּבֹשִׁי ... בֹּשְׁתְּ
  choice: लज्जित होगी ... लज्जित हुई थी
  rationale: בושׁ लज्जित होने और जिस पर भरोसा था उससे निराश होने, दोनों का भाव दे सकता है। ‘लज्जित’ मुख्य अर्थ को रखता है और पद्य का कालगत समानांतर सुरक्षित करता है।
- source_word: כַּאֲשֶׁר
  choice: जैसे
  rationale: मिस्र से होने वाली भावी लज्जा की तुलना अश्शूर से हुई पिछली लज्जा से सहज रूप में करता है।
theological_decisions:
- issue: ‘तेरा मार्ग’ का आशय
  choice: व्यापक ‘अपना मार्ग’ रखा गया है।
  alternative: ‘अपनी राजनीतिक नीति’ या ‘अपना आचरण’
  rationale: निकट संदर्भ विदेशी गठबंधनों की ओर संकेत करता है, पर דֶּרֶךְ नैतिक-आध्यात्मिक आचरण को भी समेट सकता है। किसी एक अर्थ तक सीमित करने के बजाय मूल का तनाव सुरक्षित रखा गया है।
- issue: मिस्र और अश्शूर से लज्जा का स्वरूप
  choice: ‘के कारण लज्जित’
  alternative: ‘से निराश’ या ‘के द्वारा लज्जित की जाएगी’
  rationale: मूल क्रिया अपमान और विफल भरोसे से उपजी निराशा दोनों व्यक्त कर सकती है। मुख्य पाठ स्वाभाविक हिन्दी में लज्जा रखता है और पादटिप्पणी वैकल्पिक अर्थ बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्त्रीलिंग एकवचन संबोधन रखा गया है, क्योंकि मूल में यहूदा/यरूशलेम को स्त्री के रूप में संबोधित किया गया है। शैली भविष्यद्वाणी की फटकार के अनुरूप गरिमापूर्ण, सीधी और सामान्य पाठकों के लिए सुबोध है।
