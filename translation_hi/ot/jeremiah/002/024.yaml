  text: פֶּ֣רֶה לִמֻּ֣ד מִדְבָּ֗ר בְּ/אַוַּ֤ת נפש/ו שָׁאֲפָ֣ה ר֔וּחַ תַּאֲנָתָ֖/הּ מִ֣י יְשִׁיבֶ֑/נָּה כָּל מְבַקְשֶׁ֨י/הָ֙ לֹ֣א יִיעָ֔פוּ בְּ/חָדְשָׁ֖/הּ יִמְצָאֽוּ/נְהָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/024.yaml
  text: A wild donkey accustomed to the wilderness[a], in the craving of her appetite sniffs the wind; in her heat, who can turn her back? All who seek her will not weary themselves[c][b]; in her month they will find her.
translation:
  language: hi
  text: मरुभूमि की अभ्यस्त जंगली गदही अपनी प्रबल लालसा में हवा सूँघती है।[a] उसकी कामातुर अवस्था में कौन उसे वापस मोड़ सकता है?[b] उसे खोजने वालों को थकना नहीं पड़ेगा; उसके महीने में वे उसे पा लेंगे।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘हवा को हाँफते हुए भीतर खींचती है।’ इब्रानी मुहावरा बेचैन लालसा में हवा की गंध लेने या उसे उत्सुकता से भीतर खींचने का चित्र प्रस्तुत करता है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘उसके मदकाल में’ अथवा ‘उसकी तीव्र कामेच्छा में।’ इब्रानी शब्द पशु की यौन-उत्तेजना की अवस्था या समय को सूचित करता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक अर्थ, ‘उसके महीने में’ है; संभवतः आशय उसके मदकाल या मैथुन-चक्र के समय से है।
    reason: cultural_note
lexical_decisions:
- source_word: פֶּרֶה
  choice: जंगली गदही
  rationale: शब्द जंगली गधे या ओनेगर को सूचित करता है। आगे के स्त्रीलिंग क्रियारूपों और प्रत्ययों के कारण यहाँ ‘गदही’ रूपक को स्पष्ट और स्वाभाविक बनाता है।
- source_word: לִמֻּד מִדְבָּר
  choice: जंगल की अभ्यस्त
  rationale: यह पद मरुभूमि या निर्जन प्रदेश में रहने की अभ्यस्तता बताता है। ‘जंगल’ बाइबलीय संदर्भ में निर्जन वन-प्रदेश को सहज रूप से व्यक्त करता है।
- source_word: בְּאַוַּת נַפְשׁוֹ
  choice: अपनी प्रबल लालसा में
  rationale: נפשׁ यहाँ केवल ‘प्राण’ नहीं, बल्कि भूख, अभिलाषा या अंतःप्रेरित चाह का भाव देता है। ‘प्रबल लालसा’ उसकी बेचैन तीव्र इच्छा को बनाए रखती है।
- source_word: שָׁאֲפָה רוּחַ
  choice: हवा सूँघती फिरती है
  rationale: मुहावरा उत्सुकता से हवा भीतर खींचने या गंध लेने का चित्र प्रस्तुत करता है। ‘फिरती है’ प्रसंग की बेचैन खोज को स्वाभाविक हिन्दी में उभारता है।
- source_word: תַּאֲנָתָהּ
  choice: उसकी कामातुर अवस्था में
  rationale: संज्ञा पशु की यौन-उत्तेजना या मैथुनकालीन उत्कंठा की दशा को सूचित करती है। यह चयन रूपक को स्पष्ट करता है, पर उसे सामान्य मानवीय ‘वासना’ तक सीमित नहीं करता।
- source_word: מִי יְשִׁיבֶנָּה
  choice: कौन उसे लौटा सकता है?
  rationale: שׁוב का causative रूप लौटाने, फेरने या रोकने का अर्थ दे सकता है। ‘लौटा सकता है’ मूल की वापसी वाली छवि और अनियंत्रित गति दोनों बनाए रखता है।
- source_word: כָּל מְבַקְשֶׁיהָ לֹא יִיעָפוּ
  choice: उसके खोजियों को थकना नहीं पड़ेगा
  rationale: भाव यह है कि उसका पीछा करने वालों को स्वयं को थकाने की आवश्यकता नहीं होगी, क्योंकि उचित समय पर वह सहज मिल जाएगी।
- source_word: בְּחָדְשָׁהּ
  choice: उसके महीने में
  rationale: यह मूल का निकट, जानबूझकर कुछ अस्पष्ट अनुवाद है। प्रसंग में यह संभवतः उसके मदकाल या मैथुन-चक्र का महीना है; व्याख्या पादटिप्पणी में दी गई है।
- source_word: יִמְצָאוּנְהָ
  choice: वे उसे पा लेंगे
  rationale: प्रसंगानुसार साधारण भावी परिणाम को सहज आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: यहूदा के लिए प्रयुक्त पशु-रूपक में लिंग-सामंजस्य
  choice: पूरे रूपक में स्त्रीलिंग ‘गदही/उसे/उसकी’ रखा गया है।
  alternative: נַפְשׁוֹ में दिखने वाले पुल्लिंग प्रत्यय को एक स्थान पर अलग से प्रतिबिंबित करना।
  rationale: आसपास के क्रियारूप और प्रत्यय स्पष्ट रूप से स्त्रीलिंग हैं और रूपक यहूदा को मादा पशु के रूप में चित्रित करता है। एक असंगत पुल्लिंग रूप हिन्दी में अनावश्यक भ्रम पैदा करता।
- issue: בְּחָדְשָׁהּ की व्याख्यात्मक अस्पष्टता
  choice: मुख्य पाठ में शाब्दिक ‘उसके महीने में’ रखा और संभावित अर्थ पादटिप्पणी में समझाया।
  alternative: मुख्य पाठ में सीधे ‘उसके मदकाल में’ या ‘मैथुन के समय’ कहना।
  rationale: मूल पद शाब्दिक रूप से ‘उसके महीने में’ है, जबकि उसका सटीक जैविक या ऋतु-संबंधी संकेत व्याख्यायित है। मुख्य पाठ मूल की वास्तविक अस्पष्टता सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी अपनाई गई है। पशु-रूपक की तीक्ष्णता को नरम नहीं किया गया, किंतु अनावश्यक रूप से अशिष्ट शब्दावली से बचा गया है। ‘जंगल’ यहाँ आबाद वन मात्र नहीं, निर्जन या मरु-प्रदेश के व्यापक बाइबलीय अर्थ में है।
