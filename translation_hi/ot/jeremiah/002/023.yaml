id: JER.2.23
reference: Jeremiah 2:23
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אֵ֣יךְ תֹּאמְרִ֞י לֹ֣א נִטְמֵ֗אתִי אַחֲרֵ֤י הַ/בְּעָלִים֙ לֹ֣א הָלַ֔כְתִּי רְאִ֤י דַרְכֵּ/ךְ֙ בַּ/גַּ֔יְא דְּעִ֖י מֶ֣ה עָשִׂ֑ית בִּכְרָ֥ה קַלָּ֖ה מְשָׂרֶ֥כֶת דְּרָכֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/023.yaml
  text: How can you say[a], ‘I have not defiled myself; I have not gone after the Baals’? Look at your way in the valley; know what you have done— a swift young she-camel[c][b], twisting her ways.
translation:
  language: hi
  text: तुम कैसे कह सकती हो, “मैं अशुद्ध नहीं हुई[a]; मैं बाल देवताओं के पीछे नहीं चली[b]”? घाटी में अपने मार्ग को देखो; जानो कि तुमने क्या किया है—तुम एक फुर्तीली जवान ऊँटनी के समान हो, जो अपने रास्तों पर आड़ी-तिरछी फिरती है।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैंने अपने आपको अशुद्ध नहीं किया।”
    reason: lexical_alternative
  - marker: b
    text: या, “मैंने बाल देवताओं का अनुसरण नहीं किया।”
    reason: lexical_alternative
  - marker: c
    text: यहाँ प्रयुक्त इब्रानी क्रिया दुर्लभ है। चित्र शायद अपने रास्तों पर इधर-उधर, बल खाती या उलझी चाल से फिरती जवान ऊँटनी का है; इसका ठीक भाव अनिश्चित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נִטְמֵאתִי
  choice: मैं अशुद्ध नहीं हुई
  rationale: निफ़अल रूप का मूल भाव ‘अशुद्ध होना’ है। यह अनुवाद वक्ता के आत्म-पक्ष को स्वाभाविक हिन्दी में रखता है और धार्मिक तथा नैतिक अशुद्धता, दोनों की गुंजाइश बनाए रखता है।
- source_word: אַחֲרֵי הַבְּעָלִים ... הָלַכְתִּי
  choice: मैं बाल देवताओं के पीछे नहीं चली
  rationale: ‘पीछे चलना’ इब्रानी मुहावरे और मूर्तिपूजक निष्ठा के आरोप, दोनों को सुरक्षित रखता है। बहुवचन בְּעָלִים को स्पष्ट हिन्दी में ‘बाल देवताओं’ कहा गया है।
- source_word: רְאִי דַרְכֵּךְ
  choice: अपने मार्ग को देखो
  rationale: ‘मार्ग’ वास्तविक रास्ते और आचरण के रूपक, दोनों को बनाए रखता है; अगला पद ‘घाटी में’ ठोस स्थानीय चित्र को सुरक्षित रखता है।
- source_word: בַּגַּיְא
  choice: घाटी में
  rationale: גיא का सामान्य अर्थ घाटी या खड्ड है। ‘घाटी’ आधुनिक हिन्दी में स्वाभाविक है और संभावित उपासना-स्थल की ओर संकेत को बिना अतिरिक्त व्याख्या के रहने देता है।
- source_word: דְּעִי
  choice: जानो
  rationale: आज्ञार्थक ידע का सीधा अर्थ ‘जानो’ है; प्रसंग में इसका आशय अपने किए को पहचानना या स्वीकार करना भी हो सकता है।
- source_word: בִּכְרָה
  choice: जवान ऊँटनी
  rationale: यह संज्ञा कम उम्र की मादा ऊँट को दर्शाती है। स्त्रीलिंग बनाए रखना यहूदा को सम्बोधित स्त्रीलिंग भाषा और पशु-उपमा के लिए आवश्यक है।
- source_word: קַלָּה
  choice: तेज़
  rationale: विशेषण हल्केपन अथवा फुर्ती का भाव देता है; पशु की शीघ्र और बेचैन गति के लिए ‘तेज़’ सरल और सजीव हिन्दी है।
- source_word: מְשָׂרֶכֶת דְּרָכֶיהָ
  choice: अपने रास्तों पर आड़ी-तिरछी फिरती है
  rationale: दुर्लभ क्रिया का ठीक सूक्ष्मार्थ अनिश्चित है, पर प्रसंग उलझी, बल खाती या दिशाहीन गति का चित्र देता है। यह वाक्यांश उस चित्र को पठनीय हिन्दी में व्यक्त करता है और अनिश्चितता को पादटिप्पणी में स्पष्ट करता है।
theological_decisions:
- issue: בְּעָלִים का बहुवचन और मूर्तिपूजा की भाषा
  choice: बाल देवताओं
  alternative: बाल; स्वामियों
  rationale: मसोरेटिक पाठ बहुवचन है और प्रसंग बाल-उपासना के विभिन्न स्थानीय रूपों या प्रतिमाओं पर आरोप लगाता है। ‘बाल देवताओं’ से बहुवचन स्पष्ट रहता है और इसे सामान्य ‘स्वामियों’ के अर्थ में नहीं बदल दिया जाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। स्त्रीलिंग सम्बोधन और ऊँटनी की उपमा सुरक्षित हैं। ‘मार्ग’ तथा ‘घाटी’ के ठोस चित्र को बनाए रखते हुए उनमें निहित आचरण और मूर्तिपूजा के संकेत को अनावश्यक रूप से स्पष्ट नहीं किया गया है।
