source:
  edition: WLC
  text: גַּ֤ם בִּ/כְנָפַ֨יִ/ךְ֙ נִמְצְא֔וּ דַּ֛ם נַפְשׁ֥וֹת אֶבְיוֹנִ֖ים נְקִיִּ֑ים לֹֽא בַ/מַּחְתֶּ֥רֶת מְצָאתִ֖י/ם כִּ֥י עַל כָּל אֵֽלֶּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/034.yaml
  text: Even on your skirts is found the blood of the lives of innocent poor people[a]. I did not find them in a break-in[c][b], but on account of all these things.
translation:
  language: hi
  text: तेरे वस्त्र के किनारों[a] पर भी निर्दोष गरीबों के प्राणों का रक्त पाया गया है। मैंने उन्हें सेंध लगाते हुए[b] नहीं पाया, बल्कि ऐसा इन सब बातों के कारण है।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरे वस्त्र के छोरों पर”; शाब्दिक रूप से, “तेरे पंखों में/पर।”
    reason: lexical_alternative
  - marker: b
    text: “सेंध लगाते हुए” उस प्रकार की चोरी को दर्शाता है जिसमें दीवार खोदकर भीतर घुसा जाता था; इसकी कानूनी पृष्ठभूमि के लिए निर्गमन 22:2 देखें।
    reason: cross_reference
  - marker: c
    text: 'इब्रानी का अंतिम खंड अंडाकार और कठिन है। एक अन्य सम्भव समझ यह है: “मैंने उन्हें सेंध लगाते हुए नहीं पाया, बल्कि इन सब बातों में [पाया]।” कुछ व्याख्याएँ क्रिया को द्वितीय पुरुष मानती हैं: “तूने उन्हें सेंध लगाते हुए नहीं पाया।”'
    reason: alternative_reading
lexical_decisions:
- source_word: בִּכְנָפַיִךְ
  choice: तेरे वस्त्र के छोरों पर
  rationale: כָּנָף का मूल अर्थ ‘पंख’ अथवा कोई बाहरी छोर है; वस्त्र के संदर्भ में यह उसके किनारे, पल्ले या निचले छोर को दर्शाता है। ‘वस्त्र के छोरों पर’ रक्त के दाग की ठोस छवि को स्वाभाविक हिन्दी में रखता है।
- source_word: נִמְצְאוּ
  choice: पाया गया है
  rationale: इब्रानी क्रिया बहुवचन है, पर हिन्दी में ‘रक्त’ सामान्यतः एकवचन द्रव्यवाचक संज्ञा की तरह प्रयुक्त होता है। कर्मवाच्य रूप दोष के प्रत्यक्ष प्रमाण मिलने की न्यायिक छवि बनाए रखता है।
- source_word: דַּם נַפְשׁוֹת
  choice: प्राणों का रक्त
  rationale: נֶפֶשׁ यहाँ किसी पृथक दार्शनिक ‘आत्मा’ के बजाय व्यक्ति के जीवन या प्राण को सूचित करता है। असामान्य इब्रानी रचना का बल पूरी तरह समतल किए बिना ‘प्राणों का रक्त’ स्पष्ट और गरिमापूर्ण है।
- source_word: אֶבְיוֹנִים נְקִיִּים
  choice: निर्दोष दरिद्रों
  rationale: אֶבְיוֹנִים आर्थिक रूप से दरिद्र या जरूरतमंद लोगों को और נְקִיִּים उनकी निर्दोषता को बताता है। यह संक्षिप्त पदबंध कानूनी और नैतिक अर्थ दोनों रखता है।
- source_word: לֹא בַמַּחְתֶּרֶת
  choice: सेंध लगाते हुए नहीं
  rationale: מַחְתֶּרֶת दीवार खोदकर की गई सेंधमारी को दर्शाता है। प्रसंग उन लोगों को रंगे हाथों चोर पाकर मार डालने की कानूनी पृष्ठभूमि से जुड़ता है; ‘सेंध लगाते हुए’ प्राचीन विधि और क्रियात्मक अर्थ दोनों व्यक्त करता है।
- source_word: מְצָאתִים
  choice: मैंने उन्हें ... नहीं पाया
  rationale: मसोरेटिक रूप प्रथम पुरुष एकवचन क्रिया के साथ तृतीय पुरुष बहुवचन कर्म-प्रत्यय है। इसलिए बिना पाठ-संशोधन के वक्ता यहोवा और ‘उन्हें’ निर्दोष दरिद्र लोग समझे गए हैं।
- source_word: כִּי עַל כָּל אֵלֶּה
  choice: बल्कि इन सब बातों के कारण
  rationale: यह संक्षिप्त और कठिन उपवाक्य है। עַל को कारणसूचक और כִּי को यहाँ विरोधसूचक ढंग से समझते हुए अनुवाद किया गया है, लेकिन मूल की अपूर्णता को कोई अतिरिक्त स्पष्ट वस्तु या क्रिया जोड़कर समाप्त नहीं किया गया।
theological_decisions:
- issue: कठिन मध्यवर्ती उपवाक्य में वक्ता और कर्म की पहचान
  choice: मसोरेटिक पाठ के अनुसार यहोवा प्रथम पुरुष में कहते हैं, ‘मैंने उन्हें ... नहीं पाया’; ‘उन्हें’ निर्दोष दरिद्रों के लिए समझा गया है।
  alternative: 'क्रिया को पाठ-संशोधन या व्याख्यात्मक परिवर्तन से द्वितीय पुरुष मानना: ‘तूने उन्हें सेंध लगाते नहीं पाया।’'
  rationale: מְצָאתִים का लिखित और स्वरांकित रूप प्रथम पुरुष एकवचन तथा बहुवचन कर्म का समर्थन करता है। इसे बनाए रखने से आरोप यह है कि इन निर्दोष लोगों की हत्या सेंधमारी के समय वैध आत्मरक्षा में नहीं हुई थी।
- issue: अंतिम उपवाक्य का संबंध और अर्थ
  choice: 'कारणसूचक अर्थ: ‘बल्कि इन सब बातों के कारण।’'
  alternative: ‘फिर भी इन सबके बावजूद,’ अथवा ‘इन सब पर’ जैसे अधिक शाब्दिक किंतु अस्पष्ट पाठ।
  rationale: इब्रानी वाक्य अंडाकार और कठिन है। संदर्भ में विरोध और कारण की ध्वनि संभव है, पर अनुवाद में नई स्पष्ट क्रिया जोड़कर तनाव को निर्णायक रूप से हल नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में एकवचन स्त्रीलिंग संबोधन ‘तेरे’ से यरूशलेम/यहूदा का व्यक्तिकरण रखा गया है। शैली गरिमापूर्ण किंतु सामान्य पाठक के लिए सुलभ है। ‘रक्त’ और ‘प्राण’ बाइबिलीय गंभीरता रखते हैं, जबकि ‘आत्माओं का रक्त’ जैसी भ्रामक धार्मिक पारिभाषिकता से बचा गया है। अंतिम खंड की इब्रानी अपूर्णता जानबूझकर कुछ हद तक सुरक्षित रखी गई है।
