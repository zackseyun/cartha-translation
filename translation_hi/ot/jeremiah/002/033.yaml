  yaml_path: translation/ot/jeremiah/002/033.yaml
  text: How well you make your way to seek love! Therefore even evil women you have taught your ways.
translation:
  language: hi
  text: प्रेम की खोज में तू कितनी कुशलता से अपना मार्ग सँवारती है! इसलिए तूने दुष्ट स्त्रियों को भी अपने तौर-तरीके सिखाए हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “तूने बुरी बातों को भी अपने तौर-तरीके सिखाए हैं।” यहाँ इब्रानी स्त्रीलिंग बहुवचन को ‘दुष्ट स्त्रियाँ’ के बजाय अमूर्त अर्थ में भी समझा जा सकता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה תֵּיטִבִי דַּרְכֵּךְ
  choice: तू कितनी कुशलता से अपना मार्ग सँवारती है
  rationale: מַה यहाँ विस्मयात्मक और व्यंग्यपूर्ण मात्रा व्यक्त करता है; היטיב का हिफ़ील रूप मार्ग को प्रभावी या आकर्षक बनाने का भाव देता है। ‘मार्ग सँवारती है’ रूपक और कर्मकता दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: לְבַקֵּשׁ אַהֲבָה
  choice: प्रेम पाने के लिए
  rationale: शाब्दिक भाव ‘प्रेम खोजने के लिए’ है। हिन्दी में ‘प्रेम पाने के लिए’ उद्देश्य को सहजता से व्यक्त करता है और ‘प्रेमियों’ जैसा संदर्भगत विस्तार नहीं जोड़ता।
- source_word: לָכֵן גַּם
  choice: इसलिए ... भी
  rationale: לָכֵן परिणामसूचक है और גַּם यहाँ बल देता है; ‘इसलिए ... भी’ दोनों के संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: הָרָעוֹת
  choice: दुष्ट स्त्रियों
  rationale: सप्रत्यय स्त्रीलिंग बहुवचन को प्रसंग की व्यभिचारिणी स्त्री की छवि में व्यक्तिगत स्त्री-संदर्भ के रूप में लिया गया है। अमूर्त अर्थ की वास्तविक संभावना पादटिप्पणी में दी गई है।
- source_word: למדתי
  choice: तूने ... सिखा दिए हैं
  rationale: व्यंजनात्मक रूप अकेले में प्रथम पुरुष समझा जा सकता है, पर मासोरेटिक और प्रसंगगत वाचन द्वितीय स्त्रीलिंग एकवचन है, जो पूरे संबोधन से मेल खाता है।
- source_word: דְּרָכָיִךְ
  choice: अपने तौर-तरीके
  rationale: बहुवचन ‘मार्गों’ का आशय यहाँ व्यवहार और प्रथाओं से है। ‘तौर-तरीके’ हिन्दी में यही अर्थ स्पष्ट करता है, जबकि पहले खंड के मार्ग-रूपक को ज्यों का त्यों रखा गया है।
theological_decisions:
- issue: הָרָעוֹת का व्यक्तिगत या अमूर्त अर्थ
  choice: दुष्ट स्त्रियाँ
  alternative: बुरी बातें / बुराइयाँ
  rationale: आसपास का प्रसंग यहूदा को अवैध प्रेम खोजने वाली स्त्री के रूप में चित्रित करता है; इसलिए स्त्रीलिंग बहुवचन का व्यक्तिगत अर्थ प्रसंगानुकूल है। फिर भी अमूर्त वाचन व्याकरणतः संभव है और उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; स्त्रीलिंग एकवचन ‘तू’ मूल के प्रत्यक्ष, आरोपात्मक संबोधन को बनाए रखता है। भाषा गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज है; व्यंग्यात्मक विस्मय पहले वाक्य में सुरक्षित है।
