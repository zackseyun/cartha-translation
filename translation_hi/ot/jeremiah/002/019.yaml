base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/019.yaml
  text: Your evil will discipline you[a], and your apostasies will reprove you. So know and see that it is evil and bitter for you to forsake Yahweh your God, and that my fear is not in you[c][b], declares the Lord GOD of hosts.
translation:
  language: hi
  text: 'तेरी बुराई तुझे अनुशासित करेगी,

    और तेरा बार-बार विमुख होना तुझे फटकारेगा।[a]


    इसलिए जान और देख कि अपने परमेश्वर, याहवे को छोड़ना

    तेरे लिए बुरा और कड़वा है,

    और यह कि तुझमें मेरे प्रति भय नहीं है—

    यह सेनाओं के प्रभु याहवे की वाणी है।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरे भटकाव तुझे दोषी ठहराएँगे।”
    reason: מְשֻׁבוֹתַיִךְ का अर्थ ‘भटकाव’ या ‘फिर जाना’ भी हो सकता है, और תּוֹכִחֻךְ में दोष प्रकट करने अथवा दोषी ठहराने का भाव है।
  - marker: b
    text: “याहवे” इब्रानी दिव्य नाम YHWH का लिप्यंतरण है। “सेनाओं” में पृथ्वी की अथवा स्वर्गीय सेनाओं का संकेत हो सकता है।
    reason: दिव्य नाम और צְבָאוֹת उपाधि के सांस्कृतिक-भाषिक अर्थ को स्पष्ट करना।
lexical_decisions:
- source_word: תְּיַסְּרֵךְ
  choice: तुझे दंड देकर सुधारेगी
  rationale: पिएल रूप में सुधारात्मक अनुशासन और दंड—दोनों का भाव है। यह हिंदी पदबंध केवल दंड या केवल शिक्षा तक अर्थ को सीमित नहीं करता।
- source_word: רָעָתֵךְ
  choice: तेरी बुराई
  rationale: संदर्भ में नैतिक बुराई अभिप्रेत है; यहूदा का अपना दुष्कर्म ही उसके अनुशासन का साधन बनता है।
- source_word: מְשֻׁבוֹתַיִךְ
  choice: तेरा बार-बार विमुख होना
  rationale: शब्द याहवे से फिरने और वाचा-संबंधी विश्वासघात का संकेत देता है। बहुवचन का भाव 'बार-बार' से व्यक्त किया गया है, जबकि 'विमुख होना' आधुनिक हिंदी में सहज है।
- source_word: תּוֹכִחֻךְ
  choice: तुझे फटकारेगा
  rationale: यह क्रिया दोष प्रकट करने, उलाहना देने और सुधारने के लिए फटकारने का भाव रखती है।
- source_word: וּדְעִי וּרְאִי
  choice: इसलिए जान और देख
  rationale: दोनों स्त्रीलिंग एकवचन आज्ञार्थक क्रियाओं को बनाए रखा गया है; वे यहूदा को समझने और प्रत्यक्ष पहचानने की पुकार देती हैं।
- source_word: רַע וָמָר
  choice: कितना बुरा और कड़वा
  rationale: यह जोड़ी परमेश्वर को छोड़ने के नैतिक चरित्र और उसके पीड़ादायक परिणाम—दोनों को व्यक्त करती है। 'कितना' हिंदी में विधेय की तीव्रता स्वाभाविक रूप से सामने लाता है।
- source_word: עָזְבֵךְ אֶת־יְהוָה אֱלֹהָיִךְ
  choice: अपने परमेश्वर याहवे को छोड़ना
  rationale: क्रियार्थक संज्ञा-सदृश इब्रानी रचना को स्वाभाविक हिंदी में रखते हुए संबंधसूचक प्रत्यय का भाव 'अपने' से व्यक्त किया गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: व्यक्तिगत दिव्य नाम YHWH को उपाधि 'प्रभु' से बदलने के बजाय हिंदी लिप्यंतरण में रखा गया है।
- source_word: וְלֹא פַחְדָּתִי אֵלַיִךְ
  choice: और यह कि तुझमें मेरे प्रति भय नहीं है
  rationale: मूल का संज्ञात्मक प्रयोग 'मेरा भय' संरक्षित है, पर हिंदी में संबंध को स्पष्ट और सहज बनाने के लिए 'मेरे प्रति भय' कहा गया है।
- source_word: נְאֻם אֲדֹנָי יְהוִה צְבָאוֹת
  choice: यह प्रभु याहवे, सेनाओं के परमेश्वर की वाणी है
  rationale: נְאֻם को भविष्यद्वाणी-सूचक 'वाणी' से, אֲדֹנָי יְהוִה को 'प्रभु याहवे' से, और צְבָאוֹת को उसके सामरिक तथा स्वर्गीय विस्तार सहित परिचित हिंदी उपाधि 'सेनाओं के परमेश्वर' से व्यक्त किया गया है।
theological_decisions:
- issue: מְשֻׁבוֹתַיִךְ का वाचा-संबंधी अर्थ
  choice: तेरा बार-बार विमुख होना
  alternative: तेरे धर्मत्याग; तेरे भटकाव
  rationale: '''विमुख होना'' परमेश्वर से फिरने का संबंधपरक और वाचा-संबंधी भाव रखता है, लेकिन ऐसा तकनीकी धार्मिक शब्द नहीं चुनता जो मूल की अर्थ-सीमा को अनावश्यक रूप से संकरा कर दे।'
- issue: וְלֹא פַחְדָּתִי אֵלַיִךְ की संज्ञात्मक रचना
  choice: तुझमें मेरे प्रति भय नहीं है
  alternative: तू मुझसे नहीं डरता; तुझमें मेरा भय नहीं है
  rationale: मूल में 'भय' संज्ञा है। चुना हुआ रूप श्रद्धामिश्रित भय की अनुपस्थिति पर बल बनाए रखता है और इसे केवल डरने की क्रिया में नहीं बदलता।
- issue: अंतिम दिव्य उपाधि אֲדֹנָי יְהוִה צְבָאוֹת
  choice: प्रभु याहवे, सेनाओं के परमेश्वर
  alternative: प्रभु याहवे सेनाओं का; प्रभु परमेश्वर सेनाओं का
  rationale: याहवे नाम को स्पष्ट रखा गया है और צְבָאוֹת की सेनाओं संबंधी छवि को मिटाया नहीं गया।
