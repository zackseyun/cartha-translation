  register: आधुनिक मानक हिंदी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रूप अपनाया गया है। पद में यहूदा को स्त्रीलिंग एकवचन में संबोधन है; हिंदी क्रियारूप उसी व्याकरणिक संकेत को बनाए रखते हैं। काव्यात्मक पंक्ति-विन्यास समानांतरता और निष्कर्षात्मक प्रवाह को उभारता है।
