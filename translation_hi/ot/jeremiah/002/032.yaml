source:
  edition: WLC
  text: הֲ/תִשְׁכַּ֤ח בְּתוּלָה֙ עֶדְיָ֔/הּ כַּלָּ֖ה קִשֻּׁרֶ֑י/הָ וְ/עַמִּ֣/י שְׁכֵח֔וּ/נִי יָמִ֖ים אֵ֥ין מִסְפָּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/032.yaml
  text: Does a virgin forget her jewelry[b][a], or a bride her ornaments? Yet my people have forgotten me for days without number.
translation:
  language: hi
  text: क्या कोई कुँवारी अपने गहने[a], या कोई दुल्हन अपना साज-सिंगार[b] भूल सकती है? फिर भी मेरी प्रजा मुझे अनगिनत दिनों से भूल गई है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपना श्रृंगार।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी शब्द विशेष रूप से दुल्हन की पट्टियों, कमरबंदों या बाँधकर पहने जाने वाले अलंकारों का संकेत दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/תִשְׁכַּח
  choice: क्या ... भूल सकती है?
  rationale: प्रश्नवाचक הֲ एक अलंकारिक प्रश्न प्रस्तुत करता है। हिन्दी में सामान्यतः असंभव या अस्वाभाविक व्यवहार को व्यक्त करने के लिए ‘क्या ... सकती है?’ स्वाभाविक है।
- source_word: בְּתוּלָה
  choice: कोई कुँवारी
  rationale: यह संज्ञा सामान्यतः कुँवारी युवती को सूचित करती है। ‘कुँवारी’ मूल शब्द की विशेष अर्थ-छाया और ‘दुल्हन’ के साथ समानांतरता बनाए रखती है।
- source_word: עֶדְיָהּ
  choice: अपने गहने
  rationale: शब्द निजी आभूषण या सजावट को दर्शाता है। ‘गहने’ सरल, आधुनिक और विवाह-संबंधी चित्र के अनुकूल है।
- source_word: כַּלָּה
  choice: कोई दुल्हन
  rationale: संज्ञा का सीधा अर्थ ‘दुल्हन’ है; ‘कोई’ इसे सामान्य सत्य पर आधारित अलंकारिक प्रश्न के रूप में स्वाभाविक बनाता है।
- source_word: קִשֻּׁרֶיהָ
  choice: अपने बंधे हुए श्रृंगार
  rationale: दुर्लभ शब्द की जड़ बाँधने से संबंधित है और संभवतः पट्टियों, कमरबंदों या बाँधकर पहने जाने वाले दुल्हन के अलंकारों को दर्शाती है। यह अनुवाद उस विशेषता को बचाते हुए किसी एक वस्तु को निश्चित नहीं करता।
- source_word: וְ/עַמִּי
  choice: फिर भी मेरी प्रजा
  rationale: संयोजक यहाँ अपेक्षित मानवीय व्यवहार और प्रजा की वास्तविक बेवफाई के बीच विरोध दिखाता है; ‘फिर भी’ इस बल को स्पष्ट करता है।
- source_word: שְׁכֵחוּ/נִי
  choice: मुझे ... भूल गई है
  rationale: पूर्ण क्रिया को हिन्दी पूर्ण पक्ष में रखा गया है, जिससे लंबे समय से चली आ रही उपेक्षा और उसका वर्तमान परिणाम व्यक्त होता है। ‘प्रजा’ के साथ एकवचन स्त्रीलिंग क्रिया स्वाभाविक है।
- source_word: יָמִים אֵין מִסְפָּר
  choice: अनगिनत दिनों से
  rationale: इब्रानी मुहावरे का अर्थ ऐसे दिन हैं जिनकी गिनती नहीं। ‘अनगिनत दिनों से’ आधुनिक हिन्दी में स्वाभाविक रूप से अवधि बताता है।
theological_decisions:
- issue: ‘मेरी प्रजा’ द्वारा परमेश्वर को भूलने की वाचा-संबंधी शक्ति
  choice: ‘मेरी प्रजा मुझे ... भूल गई है’
  alternative: ‘मेरी प्रजा ने मुझे त्याग दिया है’
  rationale: मूल पाठ स्पष्टतः भूलने की बात करता है, यद्यपि संदर्भ में वाचा के प्रति बेवफाई निहित है। ‘त्याग दिया’ कहने से आरोप मूल से अधिक स्पष्ट और प्रबल हो जाता; इसलिए मूल रूपक तथा संबंधपरक तनाव बनाए रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘बंधे हुए श्रृंगार’ कुछ असामान्य सुनाई देता है, पर दुर्लभ इब्रानी शब्द में निहित बाँधने की अर्थ-छाया और उसकी वास्तविक अनिश्चितता दोनों को सुरक्षित रखता है।
