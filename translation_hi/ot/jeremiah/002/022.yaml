source:
  edition: WLC
  text: כִּ֤י אִם תְּכַבְּסִי֙ בַּ/נֶּ֔תֶר וְ/תַרְבִּי לָ֖/ךְ בֹּרִ֑ית נִכְתָּ֤ם עֲוֺנֵ/ךְ֙ לְ/פָנַ֔/י נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/022.yaml
  text: For though you wash with natron and use much lye[a], your guilt is stained before me[c][b], declares the Lord YHWH.
translation:
  language: hi
  text: चाहे तुम खारे सोडे से धोओ और अपने लिए बहुत-सा क्षार लगाओ[a], फिर भी तुम्हारा अधर्म मेरे सामने दाग़दार बना हुआ है[b]—प्रभु यहोवा की यह घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “खारा सोडा” एक प्राचीन खनिज सफ़ाई-पदार्थ था; “क्षार” भी धुलाई में प्रयुक्त पदार्थ था, संभवतः वनस्पति से बना हुआ—आधुनिक साबुन होना आवश्यक नहीं।
    reason: lexical_alternative
  - marker: b
    text: या, “तुम्हारा दोष मेरे सामने चिह्नित है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: क्योंकि चाहे ... फिर भी
  rationale: 'यहाँ पदबंध संबंधसूचक और रियायती भाव देता है: भरपूर धुलाई के बावजूद आगे कही बात बनी रहती है।'
- source_word: תְּכַבְּסִי
  choice: तुम ... धोओ
  rationale: क्रिया मूलतः वस्त्र धोने के लिए प्रयुक्त होती है और यहाँ नैतिक शुद्धि के प्रयास का ठोस रूपक बनाए रखती है। स्त्रीलिंग एकवचन संबोधन का लिंग हिंदी क्रिया में प्रकट नहीं होता।
- source_word: בַּנֶּתֶר
  choice: खारे सोडे से
  rationale: נֶתֶר प्राचीन खनिज क्षार, सामान्यतः नैट्रॉन अथवा प्राकृतिक सोडा, को दर्शाता है। 'खारा सोडा' सामान्य पाठक के लिए अपेक्षाकृत स्पष्ट है।
- source_word: וְתַרְבִּי לָךְ
  choice: अपने लिए बहुत-सा ... लगाओ
  rationale: רבה का हिफ़ील और לָךְ मिलकर किसी पदार्थ को भरपूर मात्रा में अपने काम में लगाने का भाव देते हैं; 'अपने लिए' मूल के आत्मसंबंधी तत्व को रखता है।
- source_word: בֹּרִית
  choice: क्षार
  rationale: यह संभवतः वनस्पति-जन्य धुलाई का क्षारीय पदार्थ था, आधुनिक साबुन अनिवार्यतः नहीं; इसलिए 'क्षार' अधिक सावधान और सटीक है।
- source_word: נִכְתָּם
  choice: दाग़ बना हुआ है
  rationale: दुर्लभ निष्पन्न रूप के 'चिह्नित/दाग़दार होना' भाव को धुलाई के रूपक के भीतर रखता है और दाग़ के बने रहने का संकेत देता है।
- source_word: עֲוֺנֵךְ
  choice: तुम्हारा अधर्म
  rationale: עָוֹן अपराधपूर्ण कुटिलता और उससे उत्पन्न दोष दोनों का अर्थ दे सकता है। 'अधर्म' इस वास्तविक अस्पष्टता को 'दोष' की तुलना में अधिक खुला रखता है।
- source_word: לְפָנַי
  choice: मेरे सामने
  rationale: यह परमेश्वर की उपस्थिति, दृष्टि और मूल्यांकन—तीनों के स्वाभाविक हिंदी भाव को व्यक्त करता है।
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा की यह घोषणा है
  rationale: נְאֻם को नबी-संबंधी घोषणा-सूत्र के रूप में और אֲדֹנָי तथा יהוה दोनों को अलग-अलग, बिना 'प्रभु प्रभु' की असहज पुनरावृत्ति के, प्रस्तुत किया गया है।
theological_decisions:
- issue: עָוֹן को कर्म, विकृति या दोष के रूप में प्रस्तुत करना
  choice: अधर्म
  alternative: दोष
  rationale: इब्रानी शब्द अपराध और उसके फलस्वरूप दोष दोनों को समेट सकता है। 'अधर्म' पाठ को केवल न्यायिक दोष तक सीमित नहीं करता, जबकि दाग़ का रूपक उसकी दोषपूर्ण दशा को व्यक्त करता है।
- issue: אֲדֹנָי יְהוִה में परमेश्वर के नाम का निरूपण
  choice: प्रभु यहोवा
  alternative: प्रभु याहवे
  rationale: दोनों पदों को सुरक्षित रखा गया है। आधुनिक मानक हिंदी बाइबलीय प्रयोग में 'यहोवा' परिचित रूप है; पादटिप्पणी में वैकल्पिक उच्चारण देकर नाम की पाठगत उपस्थिति स्पष्ट की गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। धुलाई और न मिटने वाले दाग़ का रूपक सुरक्षित है। संबोधित पात्र इब्रानी में स्त्रीलिंग एकवचन है—संदर्भतः यरूशलेम/इस्राएल—पर आधुनिक हिंदी के इस वाक्य में उसका लिंग स्वाभाविक रूप से स्पष्ट नहीं होता। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
