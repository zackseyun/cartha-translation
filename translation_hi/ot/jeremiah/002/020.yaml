source:
  edition: WLC
  text: כִּ֣י מֵ/עוֹלָ֞ם שָׁבַ֣רְתִּי עֻלֵּ֗/ךְ נִתַּ֨קְתִּי֙ מוֹסְרֹתַ֔יִ/ךְ וַ/תֹּאמְרִ֖י לֹ֣א אעבד כִּ֣י עַֽל כָּל גִּבְעָ֞ה גְּבֹהָ֗ה וְ/תַ֨חַת֙ כָּל עֵ֣ץ רַעֲנָ֔ן אַ֖תְּ צֹעָ֥ה זֹנָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/020.yaml
  text: For long ago I broke your yoke[a]; I tore off your bonds. But you said, “I will not serve.” Indeed, on every high hill and under every green tree[c][b], you sprawled out as a prostitute.
translation:
  language: hi
  text: क्योंकि बहुत पहले मैंने तुम्हारा जूआ तोड़ दिया था[a] और तुम्हारे बंधन तोड़ डाले थे। पर तुमने कहा, “मैं सेवा नहीं करूँगी।” निश्चय ही, हर ऊँची पहाड़ी पर और हर हरे-भरे पेड़ के नीचे[b] तुम वेश्या की तरह पसर जाती थीं[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “प्राचीन समय से।” इब्रानी पदबंध दूर अतीत को सूचित कर सकता है; यहाँ सम्भवतः इस्राएल को पहले मिली मुक्ति की ओर संकेत है।
    reason: lexical_alternative
  - marker: b
    text: “हर हरे-भरे पेड़ के नीचे” नबियों में प्रचलित अभिव्यक्ति है, जो मूर्तिपूजक आराधना से जुड़े स्थानों की ओर संकेत करती है।
    reason: cultural_note
  - marker: c
    text: “पसर जाती थीं” के लिए प्रयुक्त इब्रानी क्रिया दुर्लभ और अर्थ की दृष्टि से कठिन है; सम्भव अनुवादों में “झुक जाती थीं” जैसे भाव भी हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעוֹלָם
  choice: बहुत पहले
  rationale: यह पदबंध दूर अतीत की ओर संकेत करता है—यहाँ सम्भवतः इस्राएल को पहले मिली मुक्ति की ओर। हिंदी में यह स्वाभाविक है और अनन्तकाल का अर्थ आरोपित नहीं करता।
- source_word: שָׁבַרְתִּי עֻלֵּךְ
  choice: मैंने तुम्हारा जूआ तोड़ दिया था
  rationale: मूल पाठ में दासता से मुक्ति का ठोस रूपक है; ‘जूआ तोड़ना’ उस बिंब को स्पष्ट रूप से बनाए रखता है।
- source_word: נִתַּקְתִּי מוֹסְרֹתַיִךְ
  choice: तुम्हारे बन्धन खोल दिए थे
  rationale: क्रिया बन्धनों को अलग कर मुक्त करने का भाव देती है। यह सहज हिंदी में मुक्ति के समानान्तर बिंब को बनाए रखता है।
- source_word: לֹא אעבד
  choice: मैं सेवा नहीं करूँगी
  rationale: עבד में सेवा करने, दास होने और उपासना करने के अर्थ-क्षेत्र मिलते हैं। ‘सेवा’ जूए के निकटवर्ती बिंब और परमेश्वर के प्रति धार्मिक सेवा, दोनों की सम्भावना सुरक्षित रखती है।
- source_word: כִּי
  choice: निश्चय ही
  rationale: दूसरा כִּי आगे के आचरण को जोर देकर प्रमाण के रूप में प्रस्तुत करता है; ‘निश्चय ही’ इस बल को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: עַל כָּל גִּבְעָה גְּבֹהָה וְתַחַת כָּל עֵץ רַעֲנָן
  choice: हर ऊँची पहाड़ी पर और हर हरे-भरे पेड़ के नीचे
  rationale: शाब्दिक स्थान-बिंब बनाए रखा गया है; यह नबूवत के साहित्य में मूर्तिपूजक आराधना-स्थलों से जुड़ा प्रचलित कथन है।
- source_word: צֹעָה
  choice: पसर जाती थीं
  rationale: यह दुर्लभ और कठिन शब्द सम्भवतः यौन उपलब्धता की शारीरिक मुद्रा दर्शाता है। ‘पसर जाती थीं’ बिंब की तीक्ष्णता रखता है, जबकि अनिश्चितता पादटिप्पणी में बताई गई है।
- source_word: זֹנָה
  choice: वेश्या की तरह
  rationale: यह मूर्तिपूजा के द्वारा वाचा-विरोधी बेवफाई का स्पष्ट यौन रूपक है। आधुनिक, समझने योग्य हिंदी में इसकी प्रबलता बनाए रखी गई है।
theological_decisions:
- issue: मूर्तिपूजा के लिए यौन बेवफाई का रूपक
  choice: मुख्य पाठ में वेश्यावृत्ति का स्पष्ट रूपक बनाए रखना
  alternative: इसे केवल ‘बेवफा होना’ या ‘मूर्तिपूजा करना’ कहना
  rationale: यिर्मयाह जानबूझकर वाचा-भंग को यौन बेवफाई के रूप में चित्रित करता है। रूपक को नरम करने से नबूवत की तीक्ष्णता और अवैध उपासना तथा व्यभिचार के बीच का सम्बन्ध धुँधला पड़ जाएगा।
- issue: עבד का धार्मिक और सामाजिक अर्थ
  choice: ‘सेवा’ द्वारा दोनों अर्थ-छायाएँ खुली रखना
  alternative: केवल ‘दासता’ या केवल ‘उपासना’ के रूप में अनुवाद करना
  rationale: जूए और बन्धनों का प्रसंग दासता का भाव जगाता है, जबकि आगे का मूर्तिपूजा-सन्दर्भ परमेश्वर की उपासना का। ‘सेवा’ मूल की अर्थगत तनाव और व्यापकता को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण पर सीधी भाषा रखी गई है। स्त्रीलिंग रूपों से इस्राएल/यरूशलेम को सम्बोधित स्त्री-रूपक सुरक्षित है। ‘बन्धन’ और ‘सेवा’ सामान्य पाठक के लिए स्पष्ट हैं, जबकि मूल की वाचा, दासता और उपासना सम्बन्धी बहुअर्थकता बनी रहती है।
