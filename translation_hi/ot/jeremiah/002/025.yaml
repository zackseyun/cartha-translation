base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/025.yaml
  text: Keep your feet from going unshod and your throat from thirst. But you said[a], “It is hopeless! No, for I have loved strangers, and after them I will go.”
translation:
  language: hi
  text: अपने पाँवों को नंगे होने से और अपने गले को प्यास से बचा। पर तूने कहा, “व्यर्थ है! नहीं, क्योंकि मैंने परायों[a] से प्रेम किया है, और मैं उन्हीं के पीछे जाऊँगी।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “विदेशियों।” प्रसंग में यह शब्द रूपक के तौर पर विदेशी देवताओं, पराए प्रेमियों, या विदेशी राष्ट्रों अथवा सहयोगियों की ओर संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְעִי
  choice: मत होने दे / मत रहने दे
  rationale: स्त्रीलिंग एकवचन आदेश का निषेधात्मक बल स्वाभाविक हिन्दी में व्यक्त करता है और दोनों समानांतर वाक्यांशों में लागू होता है।
- source_word: רַגְלֵךְ מִיָּחֵף
  choice: अपने पाँव को नंगा मत होने दे
  rationale: एकवचन ‘पाँव’ को बनाए रखते हुए नंगे पाँव हो जाने की मूल छवि व्यक्त करता है; प्रसंग में यह थका देने वाले पीछा करने की ओर संकेत कर सकती है।
- source_word: וְגֹרֹנֵךְ מִצִּמְאָה
  choice: अपने गले को प्यासा मत रहने दे
  rationale: ‘गला’ और ‘प्यास’ की ठोस छवि को सहज आधुनिक हिन्दी में समानांतर ढंग से रखता है।
- source_word: נוֹאָשׁ
  choice: व्यर्थ है!
  rationale: यह रूप निराश होकर किसी बात को निष्फल मान लेने का भाव देता है; ‘व्यर्थ है’ संक्षिप्त है और अगले emphatic निषेध से तनाव बनाए रखता है।
- source_word: לֹא כִּי
  choice: नहीं, क्योंकि
  rationale: चेतावनी को ठुकराने वाला प्रबल ‘नहीं’ और उसके बाद दिए गए कारण—दोनों को अलग-अलग बनाए रखता है।
- source_word: זָרִים
  choice: परायों
  rationale: ‘पराए/विदेशी जन’ का व्यापक अर्थ बनाए रखता है और इसे केवल देवताओं, प्रेमियों या राजनीतिक सहयोगियों तक सीमित नहीं करता।
- source_word: וְאַחֲרֵיהֶם אֵלֵךְ
  choice: और मैं उन्हीं के पीछे जाऊँगी
  rationale: पीछे जाने की इब्रानी अभिव्यक्ति तथा संबोधित स्त्रीरूप नगर/यहूदा के अनुरूप भविष्यकालीन स्त्रीलिंग क्रिया को सुरक्षित रखता है।
theological_decisions:
- issue: व्यभिचार और मूर्तिपूजा के रूपक में זָרִים का संकेत
  choice: मुख्य पाठ में व्यापक शब्द ‘परायों’ रखा गया है।
  alternative: विदेशी देवता; पराए प्रेमी; विदेशी राष्ट्र या सहयोगी
  rationale: यिर्मयाह 2 में वैवाहिक बेवफाई, मूर्तिपूजा और विदेशी गठबंधनों की छवियाँ एक-दूसरे में गुंथी हैं। किसी एक संकेत को मुख्य पाठ में निश्चित कर देना मूल की बहुस्तरीयता को समय से पहले सुलझा देगा।
translation_notes:
  register: भाषा आधुनिक, सीधी और गरिमापूर्ण रखी गई है। ‘तू’ भविष्यवाणी में व्यक्तिरूप यहूदा से निकट, एकवचन संबोधन को दर्शाता है। ‘जाऊँगी’ मूल के स्त्रीलिंग संबोधन को स्पष्ट करता है।
