id: JER.2.35
reference: Jeremiah 2:35
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/תֹּֽאמְרִי֙ כִּ֣י נִקֵּ֔יתִי אַ֛ךְ שָׁ֥ב אַפּ֖/וֹ מִמֶּ֑/נִּי הִנְ/נִי֙ נִשְׁפָּ֣ט אוֹתָ֔/ךְ עַל אָמְרֵ֖/ךְ לֹ֥א חָטָֽאתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/035.yaml
  text: Yet you said[a], “I am innocent; surely his anger has turned away from me.” Behold, I am entering into judgment with you because you say, “I have not sinned.”
translation:
  language: hi
  text: फिर भी तूने कहा, “मैं निर्दोष हूँ; निश्चय ही उसका क्रोध मुझसे दूर हो गया है।” देख, मैं तेरे साथ न्याय-विवाद करने जा रहा हूँ, क्योंकि तू कहती है, “मैंने पाप नहीं किया।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמְרִי
  choice: फिर भी तूने कहा
  rationale: वाव कथन-क्रम को आगे बढ़ाता है, पर पिछले आरोपों के संदर्भ में विरोध भी प्रकट करता है। स्त्रीलिंग एकवचन संबोधन को ‘तूने’ से बनाए रखा गया है।
- source_word: נִקֵּיתִי
  choice: मैं निर्दोष हूँ
  rationale: निफ़अल रूप दोष से मुक्त होने का दावा व्यक्त करता है; न्यायिक और नैतिक संदर्भ में ‘निर्दोष’ स्वाभाविक है।
- source_word: אַךְ
  choice: निश्चय ही
  rationale: यहाँ शब्द वक्ता के आत्मविश्वासी दावे पर बल देता है, न कि केवल सीमाबोध पर।
- source_word: שָׁב אַפּוֹ מִמֶּנִּי
  choice: उसका क्रोध मुझसे दूर हो गया है
  rationale: शाब के साथ ‘क्रोध’ का मुहावरा क्रोध के हट जाने या फिर जाने को दर्शाता है।
- source_word: הִנְנִי
  choice: देख
  rationale: ईश्वरीय प्रत्युत्तर की ओर तत्काल ध्यान खींचने वाले संकेतक का सहज आधुनिक हिन्दी रूप।
- source_word: נִשְׁפָּט אֹתָךְ
  choice: मैं तेरे साथ न्याय-विवाद करने जा रहा हूँ
  rationale: निफ़अल कृदंत न्यायिक कार्यवाही या मुकदमे में आमने-सामने होने का भाव रखता है। ‘न्याय-विवाद’ अदालत-संबंधी अर्थ को बनाए रखता है और ‘तेरे साथ’ मूल की संबंधात्मक संरचना को दर्शाता है।
- source_word: עַל אָמְרֵךְ
  choice: क्योंकि तू कहती है
  rationale: עַל के साथ क्रियारूप न्यायिक कार्रवाई का कारण बताता है।
- source_word: לֹא חָטָאתִי
  choice: मैंने पाप नहीं किया
  rationale: पूर्ण क्रिया उद्धृत वक्ता द्वारा अपने अपराध का स्पष्ट निषेध व्यक्त करती है।
theological_decisions:
- issue: ईश्वरीय न्याय की न्यायालय-संबंधी छाया
  choice: मैं तेरे साथ न्याय-विवाद करने जा रहा हूँ
  alternative: मैं तेरा न्याय करने जा रहा हूँ
  rationale: मूल नִשְׁפָּט אֹתָךְ केवल निर्णय सुनाने से अधिक, न्यायिक विवाद या कार्यवाही में सामना करने का भाव दे सकता है। चुना हुआ रूप इस तनाव को किसी विशिष्ट धर्मसैद्धांतिक प्रणाली में सीमित किए बिना बनाए रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सीधा हिन्दी रूप। यरूशलेम/यहूदा को स्त्रीलिंग एकवचन संबोधन के कारण ‘तू/तेरे/कहती’ रखा गया है। ‘देख’ समकालीन है, जबकि ‘न्याय-विवाद’ मूल की न्यायालय-संबंधी गंभीरता को स्पष्ट करता है।
