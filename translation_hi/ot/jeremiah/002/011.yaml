base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/011.yaml
  text: Has a nation changed its gods—though they are not gods? Yet my people have changed their glory for what does not profit[a][b][c].
translation:
  language: hi
  text: क्या किसी राष्ट्र ने अपने देवताओं को बदल दिया है[a]—जबकि वे देवता हैं ही नहीं? लेकिन मेरी प्रजा ने अपने गौरव[b] को ऐसी चीज़ से बदल लिया है, जिससे कोई लाभ नहीं होता[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बदले में दूसरे देवता अपना लिए हैं।” इब्रानी क्रिया का अर्थ बदलना, अदला-बदली करना या किसी के स्थान पर दूसरी वस्तु रखना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “अपने गौरव” सम्भवतः यहोवा की ओर संकेत करता है, जो इस्राएल का सच्चा गौरव हैं; इब्रानी में उनका नाम सीधे लेने के बजाय यह लाक्षणिक अभिव्यक्ति प्रयुक्त हुई है। इसका अर्थ इस्राएल का अपना गौरव या सम्मान भी समझा जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: या “जो व्यर्थ है” अथवा “जो लाभ नहीं पहुँचाता।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵימִיר
  choice: बदल दिया / बदल लिया
  rationale: यह क्रिया बदलने, अदला-बदली करने या किसी के स्थान पर दूसरी वस्तु रखने का भाव व्यक्त करती है। दोनों खंडों में ‘बदलना’ स्वाभाविक है और मूल की पुनरावृत्ति बनाए रखता है।
- source_word: גּוֹי
  choice: राष्ट्र
  rationale: यहाँ शब्द एक राष्ट्रीय समुदाय को सूचित करता है; ‘राष्ट्र’ प्रश्न के व्यापक तुलनात्मक संदर्भ में स्पष्ट है।
- source_word: אֱלֹהִים
  choice: देवताओं
  rationale: संदर्भ अन्य राष्ट्रों के कथित देवताओं का है, इसलिए बहुवचन रूप रखा गया है।
- source_word: וְהֵמָּה לֹא אֱלֹהִים
  choice: जबकि वे देवता हैं ही नहीं
  rationale: यह कथन उन कथित देवताओं के वास्तविक देवता न होने पर बल देता है और मूल के विडंबनापूर्ण विरोध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְעַמִּי
  choice: लेकिन मेरी प्रजा
  rationale: 'संयोजक यहाँ विरोध दिखाता है: दूसरे राष्ट्र अपने झूठे देवताओं को नहीं बदलते, पर इस्राएल अपने सच्चे गौरव को बदल देता है।'
- source_word: כְּבוֹדוֹ
  choice: अपने गौरव
  rationale: पुल्लिंग एकवचन प्रत्यय ‘मेरी प्रजा’ की सामूहिक एकवचन संज्ञा की ओर लौटता है। ‘गौरव’ मूल रूपक को बनाए रखता है और यह तय करके नहीं कहता कि अर्थ सीधे तौर पर यहोवा है या प्रजा का गौरव।
- source_word: בְּלֹא יוֹעִיל
  choice: ऐसी चीज़ से … जिससे कोई लाभ नहीं होता
  rationale: यह वाक्यांश किसी ऐसी वस्तु को सूचित करता है जो सहायता, उपयोग या लाभ नहीं पहुँचाती। यह हिन्दी में स्वाभाविक रहते हुए मूल अर्थ के निकट है।
theological_decisions:
- issue: כְּבוֹדוֹ (‘उसका/अपने गौरव’) का अभिप्राय
  choice: मुख्य पाठ में ‘अपने गौरव’ रखकर मूल के रूपक और संभावित संदर्भ को खुला रखा गया है; पादटिप्पणी में बताया गया है कि यह सम्भवतः यहोवा की ओर संकेत करता है।
  alternative: ‘अपने परमेश्वर यहोवा’ कहकर संदर्भ को मुख्य पाठ में स्पष्ट कर देना; अथवा इसे केवल इस्राएल के मान-सम्मान के अर्थ में लेना।
  rationale: मूर्तिपूजा-विरोधी संदर्भ में यहोवा का अभिप्राय प्रबल है, पर मूल पाठ सीधे उनका नाम नहीं लेता। इसलिए हिन्दी अनुवाद रूपक और धर्मवैज्ञानिक तनाव दोनों को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गंभीर और भविष्यवाणी-साहित्य के अनुरूप शैली रखी गई है। प्रश्न की विडंबना, दोनों खंडों में ‘बदलना’ की पुनरावृत्ति और ‘गौरव’ की मूल अस्पष्टता सुरक्षित है।
