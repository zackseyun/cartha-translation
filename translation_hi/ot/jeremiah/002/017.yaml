base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/017.yaml
  text: Has not this brought it upon you[b][a], because you have forsaken Yahweh your God when he was leading you in the way?
translation:
  language: hi
  text: क्या यह[a] तुम्हारे साथ इस कारण नहीं हुआ कि तुमने अपने परमेश्वर याहवे को उस समय छोड़ दिया, जब वह तुम्हें मार्ग पर लेकर जा रहा था?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या इसी ने तुम्हारे साथ ऐसा नहीं किया?” इब्रानी का अधिक शाब्दिक अर्थ है, “क्या इसने तुम्हारे लिए/साथ यह नहीं किया?”
    reason: lexical_alternative
  - marker: b
    text: या, “जब वह मार्ग में तुम्हारी अगुवाई कर रहा था?”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא זֹאת תַּעֲשֶׂה לָּךְ
  choice: क्या यह विपत्ति तुमने अपने ही ऊपर नहीं बुलाई
  rationale: इब्रानी में अलंकारिक प्रश्न सकारात्मक उत्तर की अपेक्षा करता है। शाब्दिक रचना ‘क्या इसने तुम्हारे लिए/साथ यह नहीं किया?’ अस्पष्ट है; प्रसंग में ‘यह विपत्ति अपने ऊपर बुलाना’ स्वाभाविक हिन्दी में परिणाम के लिए इस्राएल की जिम्मेदारी व्यक्त करता है, जबकि पाद-टिप्पणी अधिक शाब्दिक विकल्प सुरक्षित रखती है।
- source_word: עָזְבֵךְ
  choice: क्योंकि तुमने ... छोड़ दिया
  rationale: प्रत्यययुक्त infinitive construct ‘तुम्हारा छोड़ना’ कारण बताता है; हिन्दी में कारणवाचक उपवाक्य स्पष्ट और स्वाभाविक है।
- source_word: יְהוָה אֱלֹהַיִךְ
  choice: अपने परमेश्वर याहवे को
  rationale: व्यक्तिगत दिव्य नाम को उपाधि से बदलने के बजाय देवनागरी में ‘याहवे’ लिखा गया है; possessive covenantal expression को ‘अपने परमेश्वर’ से व्यक्त किया गया है।
- source_word: בְּעֵת מוֹלִיכֵךְ
  choice: उस समय ... जब वह तुम्हें ... लिए जा रहा था
  rationale: בְּעֵת समय-संबंध बताता है और हिफ़ील participle चल रही अगुवाई का भाव रखता है; हिन्दी की अपूर्णकालिक रचना इस निरंतरता को बनाए रखती है।
- source_word: בַּדָּרֶךְ
  choice: मार्ग पर
  rationale: ‘मार्ग’ भौतिक यात्रा और नैतिक/वाचा-संबंधी मार्ग—दोनों संभावनाएँ खुली रखता है। ‘पर’ आधुनिक हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसका निकट देवनागरी लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
- issue: בַּדָּרֶךְ में ‘मार्ग’ का आशय
  choice: मार्ग पर
  alternative: सही मार्ग पर
  rationale: ‘सही’ जोड़ने से नैतिक अर्थ स्पष्ट हो जाता, पर वह इब्रानी में प्रत्यक्ष नहीं है। ‘मार्ग’ मूल की संभावित भौतिक और रूपकात्मक अस्पष्टता बनाए रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। अलंकारिक प्रश्न और भविष्यद्वक्ता की फटकार का स्वर बनाए रखा गया है। ‘विपत्ति’ प्रसंगगत स्पष्टता देता है, जबकि पाद-टिप्पणी मूल की संक्षिप्त और अस्पष्ट रचना सुरक्षित रखती है।
