source:
  edition: WLC
  text: הַ/דּ֗וֹר אַתֶּם֙ רְא֣וּ דְבַר יְהוָ֔ה הֲ/מִדְבָּ֤ר הָיִ֨יתִי֙ לְ/יִשְׂרָאֵ֔ל אִ֛ם אֶ֥רֶץ מַאְפֵּ֖לְיָ֑ה מַדּ֜וּעַ אָמְר֤וּ עַמִּ/י֙ רַ֔דְנוּ לֽוֹא נָב֥וֹא ע֖וֹד אֵלֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/031.yaml
  text: 'O generation[a], you yourselves, see the word of Yahweh: Have I been a wilderness to Israel, or a land of deep darkness? Why has my people said, ‘We are lords; we will come to you no more’?”'
translation:
  language: hi
  text: 'हे पीढ़ी के लोगो, तुम स्वयं यहोवा के वचन पर ध्यान दो: “क्या मैं इस्राएल के लिए मरुस्थल रहा हूँ, या घोर अंधकार की भूमि? फिर मेरी प्रजा ने क्यों कहा, ‘हम स्वतंत्र हैं[a]; अब हम फिर कभी तेरे पास नहीं आएँगे’?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी क्रिया का अर्थ कठिन है। इसके अनुवाद ‘हम घूमते-फिरते हैं,’ ‘हम शासन करते हैं,’ या ‘हम बंधन तोड़कर निकल गए हैं’ भी हो सकते हैं। प्रसंग में भाव यहोवा से स्वतंत्र होने के दावे का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדּוֹר
  choice: हे इस पीढ़ी के लोगो
  rationale: इब्रानी में यह प्रत्यक्ष संबोधन है। शाब्दिक ‘हे पीढ़ी’ आधुनिक हिन्दी में अस्वाभाविक है; ‘इस पीढ़ी के लोगो’ सामूहिक संबोधन को स्पष्ट और स्वाभाविक बनाता है।
- source_word: אַתֶּם
  choice: तुम स्वयं
  rationale: स्वतंत्र सर्वनाम के बल को हिन्दी में ‘स्वयं’ द्वारा व्यक्त किया गया है।
- source_word: רְאוּ דְבַר יְהוָה
  choice: यहोवा के वचन पर ध्यान दो
  rationale: ראה यहाँ केवल आँखों से देखने के बजाय ध्यान देकर विचार करने का आग्रह करता है। ‘वचन’ भविष्यद्वक्ताई और वाचागत शैली को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, न कि किसी उपाधि से।
- source_word: הֲמִדְבָּר הָיִיתִי לְיִשְׂרָאֵל
  choice: क्या मैं इस्राएल के लिए उजाड़ रहा हूँ
  rationale: ‘उजाड़’ निर्जन, अनुपजाऊ और प्रतिकूल स्थान के रूपक को संक्षिप्त और स्वाभाविक हिन्दी में रखता है।
- source_word: אֶרֶץ מַאְפֵּלְיָה
  choice: घोर अंधकार का देश
  rationale: מַאְפֵּלְיָה की तीव्रता को ‘घोर अंधकार’ व्यक्त करता है और स्थान-संबंधी रूपक को सुरक्षित रखता है।
- source_word: רַדְנוּ
  choice: हम स्वतंत्र हैं[a]
  rationale: क्रिया का पाठार्थ कठिन है और घूमने, शासन करने या बंधन से छूटने के भाव सुझा सकता है। प्रसंग में मूल बात यहोवा से स्वतंत्र होने का दावा है; मुख्य पाठ वही अर्थ देता है और पादटिप्पणी वास्तविक शब्दार्थगत अनिश्चितता सुरक्षित रखती है।
- source_word: לֹא נָבוֹא עוֹד אֵלֶיךָ
  choice: अब हम फिर कभी तेरे पास नहीं आएँगे
  rationale: עוֹד के साथ निषेध आगे से संबंध या वापसी समाप्त करने की दृढ़ घोषणा व्यक्त करता है। एकवचन ‘तेरे’ से यहोवा को किया गया सीधा संबोधन बना रहता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: व्यक्तिगत वाचागत नाम को उपाधि से बदलने के बजाय हिन्दी में परिचित लिप्यंतरण द्वारा सुरक्षित रखा गया है।
- issue: कठिन क्रिया רַדְנוּ का अर्थ
  choice: हम स्वतंत्र हैं
  alternative: हम घूमते फिरते हैं; हम शासन करते हैं; हम बंधन तोड़कर निकल गए हैं
  rationale: प्रसंग इस्राएल के यहोवा से स्वायत्तता के दावे पर बल देता है, पर इब्रानी क्रिया का सटीक अर्थ विवादित है। इसलिए मुख्य पाठ प्रसंगगत आशय देता है और पादटिप्पणी विकल्पों को खुला रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और भविष्यद्वक्ताई प्रत्यक्ष संबोधन के अनुकूल रखी गई है। ‘हे इस पीढ़ी के लोगो’ और ‘तुम स्वयं’ संबोधन तथा बल को स्वाभाविक हिन्दी में व्यक्त करते हैं; उद्धरणों के भीतर परमेश्वर और प्रजा की आवाजें स्पष्ट रखी गई हैं।
