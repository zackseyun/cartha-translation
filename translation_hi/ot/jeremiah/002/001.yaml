  text: וַ/יְהִ֥י דְבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/001.yaml
  text: And the word of Yahweh came to me[a], saying,
translation:
  language: hi
  text: 'और याहवे[a] का वचन मेरे पास आया:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में परमेश्वर का व्यक्तिगत नाम ‘याहवे’ है; हिन्दी बाइबलों में इसे प्रायः ‘यहोवा’ या ‘प्रभु’ लिखा गया है।
    reason: नाम के लिप्यंतरण और प्रचलित वैकल्पिक रूपों की जानकारी
lexical_decisions:
- source_word: וַיְהִי
  choice: और … आया
  rationale: यह रूप कथा या वचन-क्रम को आगे बढ़ाता है। हिन्दी में इसकी शक्ति ‘और’ तथा मुख्य क्रिया ‘आया’ से स्वाभाविक रूप में व्यक्त होती है; अलग से ‘ऐसा हुआ’ जोड़ना अनावश्यक और बोझिल होता।
- source_word: דְבַר
  choice: वचन
  rationale: भविष्यवाणी-संबंधी स्थायी पदबंध में ‘वचन’ ईश्वरीय कथन और प्रकाशन—दोनों भावों को संक्षेप में बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम का देवनागरी लिप्यंतरण किया गया है, ताकि उसे किसी उपाधि से न बदला जाए।
- source_word: אֵלַי
  choice: मेरे पास
  rationale: यह दिशा-सूचक पूर्वसर्ग और प्रथम पुरुष एकवचन प्रत्यय का स्वाभाविक हिन्दी रूप है; भविष्यद्वक्ता को वचन प्राप्त होने के प्रचलित भाव को स्पष्ट रखता है।
- source_word: לֵאמֹר
  choice: ':'
  rationale: यह रूप आगे आने वाले कथन का परिचय देता है। हिन्दी में पद के अंत का द्विबिंदु उसी कार्य को स्वाभाविक ढंग से पूरा करता है और अनावश्यक ‘यह कहते हुए’ से बचाता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम सीधे उपस्थित है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है; इससे नाम को ‘प्रभु’ जैसी उपाधि से बदलने या ‘यहोवा’ वाली बाद की स्वर-परंपरा अपनाने से बचा गया है।
translation_notes:
  register: भाषा सरल, आधुनिक और गरिमापूर्ण रखी गई है। भविष्यवाणी-साहित्य के पारंपरिक पदबंध ‘याहवे का वचन’ को सुरक्षित रखते हुए לֵאמֹר को हिन्दी विराम-चिह्न द्वारा स्वाभाविक रूप दिया गया है।
