  yaml_path: translation/ot/jeremiah/002/016.yaml
  text: Even the sons of Noph and Tahpanhes have grazed your crown.
translation:
  language: hi
  text: यहाँ तक कि नोफ़[b] और तहपनहेस के लोगों[a] ने तेरे सिर की चोटी[d] को खा गए हैं[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘नोफ़ और तहपनहेस के पुत्रों’; इब्रानी में ‘के पुत्र’ किसी स्थान के लोगों या निवासियों को भी सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: नोफ़ को सामान्यतः मिस्र के मेम्फिस नगर से पहचाना जाता है।
    reason: cultural_note
  - marker: c
    text: इब्रानी क्रिया का शाब्दिक अर्थ ‘चरना’ या ‘खा जाना’ है; कुछ अनुवाद संदर्भ के आधार पर इसे ‘तोड़ डाला’ या ‘कुचल डाला’ कहते हैं।
    reason: lexical_alternative
  - marker: d
    text: इसका अनुवाद ‘तेरे सिर का ऊपरी भाग’ या ‘तेरी खोपड़ी’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: यहाँ तक कि
  rationale: संदर्भ में यह शब्द जोर देता है कि मिस्र के इन नगरों के लोग भी यहूदा को हानि पहुँचा रहे हैं।
- source_word: בְּנֵי
  choice: के लोगों
  rationale: शाब्दिक अर्थ ‘के पुत्र’ है, पर किसी स्थान के साथ यह इब्रानी मुहावरा वहाँ के लोगों या निवासियों को सूचित करता है; आधुनिक हिन्दी में ‘के लोगों’ स्वाभाविक और अर्थ-सटीक है।
- source_word: נֹף
  choice: नोफ़
  rationale: इब्रानी स्थान-नाम का लिप्यंतरण रखा गया है; यह नगर सामान्यतः मिस्र के मेम्फिस से पहचाना जाता है।
- source_word: תחפנס
  choice: तहपनहेस
  rationale: इब्रानी स्थान-नाम को हिन्दी में लिप्यंतरित किया गया है।
- source_word: יִרְעוּךְ
  choice: तेरे ... को चर डाला है
  rationale: रעה का मूल अर्थ चरना, चराना या खा जाना है। ‘चर डाला है’ असामान्य किंतु जानबूझकर रखी गई हिंसक रूपक-छवि को बचाता है; ‘तोड़ दिया’ या ‘कुचल दिया’ अधिक व्याख्यात्मक होते।
- source_word: קָדְקֹד
  choice: सिर की चोटी
  rationale: यह सिर के सबसे ऊपरी भाग को सूचित करता है। ‘सिर की चोटी’ शरीर-संबंधी चित्र को बनाए रखती है, यद्यपि ‘खोपड़ी’ या ‘सिर का ऊपरी भाग’ भी संभव हैं।
