  rationale: The revision replaces the awkward Hindi collocation ‘चोटी को चर डाला है’ with ‘चोटी को खा गए हैं.’ This preserves the Hebrew verb’s basic feed-on/graze imagery and the force of the perfect, while reading naturally in modern Hindi. Footnote c is narrowed to genuine lexical/contextual alternatives rather than adding an unsupported ‘shave’ interpretation.
