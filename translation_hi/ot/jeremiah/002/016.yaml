    issue: The main verb ‘चर डाला है’ is unnatural with the human subject and body-part object in modern standard Hindi.
    rationale: The Hebrew image is unusual, but Hindi can preserve its feed-on sense more idiomatically with ‘खा गए हैं,’ without replacing it with the more interpretive ‘कुचल डाला’ or ‘तोड़ डाला।’
  - severity: low
    issue: Footnote c includes ‘मुँड दिया’ as an alternative.
    rationale: This is an interpretive contextual rendering rather than a lexical sense of רעה in the supplied source/audit trail. Removing it keeps the note source-focused and avoids over-specifying the image.
