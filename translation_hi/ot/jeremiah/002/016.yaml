  source_fidelity: 'The verse is represented accurately in its principal elements: emphatic גַּם, the inhabitants denoted by בְּנֵי, both Egyptian place names, and the bodily image of קָדְקֹד. The Hebrew verb יִרְעוּךְ has the basic pasture/feed-on sense reflected in the proposed revision. The supplied Hebrew permits a deliberately harsh feeding image; it need not be smoothed into ‘break’ or ‘crush.’'
  naturalness: ‘तेरे सिर की चोटी को चर डाला है’ is grammatically comprehensible but is markedly unnatural in modern Hindi, especially with human subjects. ‘खा गए हैं’ naturally conveys the metaphorical feeding-on image while retaining its violence and strangeness.
  terminology: नोफ़, तहपनहेस, और ‘सिर की चोटी’ are suitable modern-Hindi renderings. ‘के लोगों’ appropriately communicates the place-associated sense of ‘sons of.’ The lexical note should not introduce ‘मुँड दिया,’ which is not a direct lexical alternative presented by the Hebrew and unnecessarily directs readers toward a contextual interpretation.
  issues:
