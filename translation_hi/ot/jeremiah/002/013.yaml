id: JER.2.13
reference: Jeremiah 2:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּֽי שְׁתַּ֥יִם רָע֖וֹת עָשָׂ֣ה עַמִּ֑/י אֹתִ֨/י עָזְב֜וּ מְק֣וֹר מַ֣יִם חַיִּ֗ים לַ/חְצֹ֤ב לָ/הֶם֙ בֹּאר֔וֹת בֹּארֹת֙ נִשְׁבָּרִ֔ים אֲשֶׁ֥ר לֹא יָכִ֖לוּ הַ/מָּֽיִם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/013.yaml
  text: 'For my people have done two evils: they have forsaken me[a], the fountain of living waters, to dig for themselves cisterns—broken cisterns that cannot hold water.'
translation:
  language: hi
  text: 'क्योंकि मेरी प्रजा ने दो बुराइयाँ की हैं: उन्होंने मुझे, जीवित जल के सोते[a] को, छोड़ दिया और अपने लिए हौद खोद लिए—ऐसे टूटे हुए हौद, जिनमें पानी ठहर नहीं सकता।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बहते जल का सोता” अथवा “जीवन देने वाले जल का स्रोत।”
    reason: מְקוֹר מַיִם חַיִּים प्राकृतिक बहते/ताज़े जल के स्रोत को सूचित कर सकता है; साथ ही रूपक में जीवनदायी अर्थ-छाया भी बनी रहती है।
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन के कारण अथवा स्पष्टीकरण को प्रस्तुत करता है; ‘क्योंकि’ आधुनिक हिन्दी में इस संबंध को स्पष्ट और स्वाभाविक रखता है।
- source_word: שְׁתַּיִם רָעוֹת
  choice: दो बुराइयाँ
  rationale: यह अनुवाद संख्या और नैतिक गंभीरता दोनों को बनाए रखता है; ‘दो गलतियाँ’ मूल के नैतिक भार को हल्का कर देता।
- source_word: עָשָׂה עַמִּי
  choice: मेरी प्रजा ने ... की हैं
  rationale: सामान्य क्रिया עשה को सीधे और स्वाभाविक हिन्दी में व्यक्त किया गया है; पूर्ण क्रिया का वर्तमान प्रभाव ‘की हैं’ से बना रहता है।
- source_word: אֹתִי עָזְבוּ
  choice: उन्होंने मुझ ... को छोड़ दिया
  rationale: ‘छोड़ दिया’ संबंध-विच्छेद की गंभीरता व्यक्त करता है और साथ आने वाले रूपक को हिन्दी वाक्य में स्वाभाविक रूप से जोड़ता है।
- source_word: מְקוֹר מַיִם חַיִּים
  choice: जीवन-जल का सोता
  rationale: מְקוֹר के प्राकृतिक जलस्रोत का बिंब ‘सोता’ से सुरक्षित रहता है। ‘जीवन-जल’ मूल के जीवित/बहते, जीवनदायी जल के अर्थ और उसके धार्मिक प्रतिध्वनि को बिना व्याख्यात्मक विस्तार के बनाए रखता है।
- source_word: לַחְצֹב
  choice: खोद लिए
  rationale: क्रिया चट्टान काटकर या खोदकर हौद बनाने का संकेत देती है; ‘खोद लिए’ साधारण पाठक के लिए स्पष्ट है और प्रसंग में उचित क्रिया प्रस्तुत करती है।
- source_word: לָהֶם
  choice: अपने लिए
  rationale: लाभार्थक पद का आत्म-संबंधी भाव स्पष्ट करता है और परमेश्वर को छोड़कर स्वनिर्मित साधनों पर निर्भर होने का विरोध उभारता है।
- source_word: בֹּארוֹת
  choice: हौद
  rationale: यहाँ प्राकृतिक सोते के विपरीत मनुष्य द्वारा बनाया गया पानी जमा करने का स्थान अभिप्रेत है। ‘कुएँ’ कहने से प्राकृतिक अथवा भूजल-स्रोत का भ्रामक अर्थ निकल सकता है।
- source_word: בֹּארֹת נִשְׁבָּרִים
  choice: ऐसे टूटे हुए हौद
  rationale: मूल में ‘हौद’ की पुनरावृत्ति को हिन्दी में भी रखा गया है, जिससे भविष्यद्वाणी की जोरदार लय और उनकी दोषपूर्ण दशा उभरती है।
- source_word: אֲשֶׁר לֹא יָכִלוּ הַמָּיִם
  choice: जिनमें पानी ठहर नहीं सकता
  rationale: यह हौदों के पानी को रोककर रखने में असमर्थ होने का स्वाभाविक हिन्दी रूप है और व्यर्थता के शाब्दिक बिंब को बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के लिए जल-स्रोत का रूपक
  choice: ‘मुझ जीवन-जल के सोते को’ कहकर रूपक को प्रत्यक्ष रूप में बनाए रखा गया है।
  alternative: ‘मुझ जीवन और आशीष के स्रोत को’ जैसी व्याख्यात्मक अभिव्यक्ति।
  rationale: इब्रानी पाठ परमेश्वर को सोते के रूप में प्रस्तुत करता है, पर रूपक की व्याख्या नहीं करता। प्रत्यक्ष बिंब भविष्यद्वाणी की शक्ति और उसकी अर्थ-समृद्धि को सुरक्षित रखता है।
- issue: מַיִם חַיִּים का अर्थ
  choice: जीवन-जल
  alternative: बहता जल; ताज़ा जल; जीवित जल
  rationale: यह पद स्वाभाविक रूप से बहते या ताज़े जल को सूचित कर सकता है, साथ ही जीवनदायी धार्मिक प्रतिध्वनि रखता है। ‘जीवन-जल’ उस तनाव को पूरी तरह केवल भौतिक या केवल धर्मवैज्ञानिक अर्थ में सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज रूप अपनाया गया है। ‘प्रजा’, ‘सोता’ और ‘हौद’ सामान्य पाठक के लिए समझने योग्य रहते हुए भविष्यद्वाणी की काव्यात्मक छवि बनाए रखते हैं। डैश मूल की दोहरावपूर्ण तीव्रता को स्पष्ट करता है।
