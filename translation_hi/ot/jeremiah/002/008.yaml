source:
  edition: WLC
  text: הַ/כֹּהֲנִ֗ים לֹ֤א אָֽמְרוּ֙ אַיֵּ֣ה יְהוָ֔ה וְ/תֹפְשֵׂ֤י הַ/תּוֹרָה֙ לֹ֣א יְדָע֔וּ/נִי וְ/הָ/רֹעִ֖ים פָּ֣שְׁעוּ בִ֑/י וְ/הַ/נְּבִיאִים֙ נִבְּא֣וּ בַ/בַּ֔עַל וְ/אַחֲרֵ֥י לֹֽא יוֹעִ֖לוּ הָלָֽכוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/008.yaml
  text: The priests did not say[a], ‘Where is Yahweh?’ Those who handle the law did not know me; the shepherds rebelled against me[c][b]; the prophets prophesied by Baal and went after things that do not profit.
translation:
  language: hi
  text: याजकों ने यह नहीं कहा, “याहवे कहाँ हैं?” व्यवस्था को संभालने वालों[a] ने मुझे नहीं जाना। चरवाहों ने मेरे विरुद्ध विद्रोह किया; भविष्यद्वक्ताओं ने बाल के द्वारा भविष्यवाणी की[b] और ऐसी चीज़ों के पीछे चले जिनसे कोई लाभ नहीं होता।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “व्यवस्था को पकड़ने” या “थामने वाले”; इससे व्यवस्था को सिखाने या उसका व्यवहार करने वाले लोग अभिप्रेत हो सकते हैं।
    reason: lexical_alternative
  - marker: b
    text: या, “बाल के नाम से भविष्यवाणी की।”
    reason: alternative_reading
  - marker: c
    text: या, “जो निष्फल है उसके पीछे चले।” संदर्भ में मूर्तियाँ अभिप्रेत हो सकती हैं, पर मूल पाठ उन्हें यहाँ स्पष्ट रूप से नाम नहीं देता।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֲנִים
  choice: याजकों
  rationale: ठोस बहुवचन संज्ञा को सीधे और स्वाभाविक रूप में रखा गया है।
- source_word: אַיֵּה יְהוָה
  choice: याहवे कहाँ हैं?
  rationale: वाचा के परमेश्वर की उपेक्षा प्रकट करने वाला मूल आलंकारिक प्रश्न सुरक्षित है; יהוה को व्यक्तिगत नाम ‘याहवे’ से व्यक्त किया गया है।
- source_word: תֹפְשֵׂי הַתּוֹרָה
  choice: व्यवस्था को संभालने वालों
  rationale: תפשׂ के ‘पकड़ने/थामने’ के ठोस बिंब और व्यवस्था से अधिकारपूर्वक जुड़े लोगों की भूमिका, दोनों को सहज हिन्दी में व्यक्त करता है; ‘सिखाने वालों’ जैसा संकुचन नहीं किया गया।
- source_word: הַתּוֹרָה
  choice: व्यवस्था
  rationale: यहाँ यह परमेश्वर की दी हुई तोराह अथवा शिक्षा को दर्शाता है; ‘व्यवस्था’ हिन्दी बाइबलीय प्रयोग में परिचित है, जबकि ‘शिक्षा’ भी संभावित अर्थ है।
- source_word: לֹא יְדָעוּנִי
  choice: मुझे नहीं जाना
  rationale: व्यक्तिगत कर्म के साथ ידע का संबंधपरक और वाचागत बल बनाए रखता है, इसे केवल बौद्धिक जानकारी तक सीमित नहीं करता।
- source_word: הָרֹעִים
  choice: चरवाहों
  rationale: यह शासकों अथवा अगुओं के लिए रूपक है; मूल भविष्यद्वाणी का चरवाहे वाला बिंब सुरक्षित रखा गया है।
- source_word: פָּשְׁעוּ בִי
  choice: मेरे विरुद्ध विद्रोह किया
  rationale: פשע साधारण पाप से अधिक, बगावत और वाचा-भंग का भाव रखता है।
- source_word: הַנְּבִיאִים נִבְּאוּ בַבַּעַל
  choice: भविष्यद्वक्ताओं ने बाल के द्वारा भविष्यवाणी की
  rationale: ב की संभावित साधनवाचकता को बनाए रखता है और बाल के प्रति झूठी भविष्यद्वाणी की निष्ठा को स्पष्ट करता है, बिना मुख्य पाठ में इसे केवल ‘नाम से’ अर्थ तक सीमित किए।
- source_word: אַחֲרֵי לֹא יוֹעִלוּ הָלָכוּ
  choice: ऐसी चीज़ों के पीछे चले जिनसे कोई लाभ नहीं होता
  rationale: ‘पीछे चलने’ का इब्रानी मुहावरा और लाभहीनता दोनों सुरक्षित हैं; निहित कर्म को स्वाभाविक हिन्दी के लिए ‘चीज़ों’ से व्यक्त किया गया है, पर उसे स्पष्ट रूप से ‘मूर्तियाँ’ नहीं बनाया गया।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ व्यक्तिगत वाचागत नाम יהוה का प्रयोग करता है; ‘याहवे’ उसे उपाधि में बदले बिना प्रस्तुत करता है।
- issue: अंतिम वाक्य में निहित कर्म की पहचान
  choice: ऐसी चीज़ें जिनसे कोई लाभ नहीं होता
  alternative: निष्फल मूर्तियाँ
  rationale: संदर्भ में मूर्तियाँ अभिप्रेत हो सकती हैं, पर इब्रानी पाठ कर्म को स्पष्ट नाम नहीं देता; इसलिए उसकी खुली अभिव्यक्ति और धर्मवैचारिक तनाव बनाए रखा गया है।
- issue: בַבַּעַל में ב का अर्थ
  choice: बाल के द्वारा
  alternative: बाल के नाम से
  rationale: उपसर्ग साधन, माध्यम अथवा क्षेत्र का बोध करा सकता है। मुख्य पाठ में साधनवाचक रूप रखा गया और अधिक व्याख्यात्मक विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। नेतृत्व के लिए ‘चरवाहों’ का भविष्यद्वाणी-संबंधी रूपक और ‘पीछे चलने’ का मूल मुहावरा सुरक्षित है। विराम-चिह्न आरोपों की क्रमिक संरचना स्पष्ट करते हैं।
