id: JER.2.14
reference: Jeremiah 2:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הַ/עֶ֨בֶד֙ יִשְׂרָאֵ֔ל אִם יְלִ֥יד בַּ֖יִת ה֑וּא מַדּ֖וּעַ הָיָ֥ה לָ/בַֽז־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/014.yaml
  text: Is Israel a servant[b][a], or a homeborn servant? Why then has he become plunder?
translation:
  language: hi
  text: क्या इस्राएल दास है, या घराने में जन्मा दास है? फिर वह लूट का माल क्यों बन गया है?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘लूट का माल’ का अनुवाद ‘शिकार’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעֶבֶד
  choice: दास
  rationale: यहाँ עֶבֶד बंधुआ सामाजिक स्थिति को व्यक्त करता है; ‘दास’ आधुनिक हिन्दी में उस कठोर अर्थ को ‘सेवक’ से अधिक स्पष्टता से बनाए रखता है।
- source_word: אִם
  choice: या
  rationale: वैकल्पिक प्रश्न में אִם दो संभावित स्थितियों को जोड़ता है, इसलिए हिन्दी में ‘या’ स्वाभाविक है।
- source_word: יְלִיד בַּיִת
  choice: घर में जन्मा दास
  rationale: शाब्दिक अर्थ ‘घर में जन्मा’ है और प्रसंग स्वामी के घराने में जन्मे दास की ओर संकेत करता है; संक्षिप्त पदबंध मूल सामाजिक संदर्भ को बनाए रखता है।
- source_word: הוּא
  choice: वह
  rationale: पुल्लिंग एकवचन सर्वनाम मानवीकृत इस्राएल की ओर संकेत करता है; हिन्दी का ‘वह’ स्वाभाविक रूप से इसे व्यक्त करता है।
- source_word: מַדּוּעַ
  choice: फिर ... क्यों
  rationale: ‘क्यों’ मूल प्रश्नवाचक अर्थ देता है और ‘फिर’ पहले प्रश्न से निकलने वाले आश्चर्यपूर्ण निष्कर्ष को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הָיָה
  choice: बन गया है
  rationale: पूर्ण क्रिया यहाँ परिणामी वर्तमान अवस्था दर्शाती है; ‘बन गया है’ इस परिणाम को सहज हिन्दी में रखता है।
- source_word: לָבַז
  choice: लूट का माल
  rationale: בַּז युद्ध या हिंसा में दूसरों द्वारा हथियाए गए माल को दर्शाता है; ‘लूट का माल’ हिन्दी में स्पष्ट और प्रचलित है।
theological_decisions:
- issue: עֶבֶד के लिए सामाजिक-स्थिति संबंधी शब्दावली
  choice: पहले और दूसरे दोनों पदों में ‘दास’
  alternative: ‘सेवक’, अथवा दूसरे पद में केवल ‘घर में जन्मा व्यक्ति’
  rationale: प्रश्न का बल इस बात पर है कि क्या इस्राएल दास की स्थिति में है। ‘दास’ बंधन की सामाजिक वास्तविकता को बिना नरम किए सुरक्षित रखता है; दूसरे पद में भी यही शब्द निहित स्थिति को स्पष्ट करता है।
- issue: יִשְׂרָאֵל ... הוּא का मानवीकरण
  choice: इस्राएल के लिए ‘वह’
  alternative: निर्जीव या सामूहिक पुनर्व्याख्या
  rationale: मूल पाठ पुल्लिंग एकवचन सर्वनाम द्वारा इस्राएल का मानवीकरण करता है; हिन्दी में इसे यथावत रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; प्रश्नात्मक और गरिमापूर्ण शैली। ‘घर में जन्मा दास’ मूल के घरेलू-दासता संबंधी पदबंध को स्पष्ट रखते हुए सामान्य पाठक के लिए बोधगम्य है।
