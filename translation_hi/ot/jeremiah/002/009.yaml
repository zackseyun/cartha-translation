  text: इसलिए मैं अब भी तुमसे अपना मुक़दमा लड़ूँगा[a]—याहवे की यह घोषणा है—और तुम्हारे बच्चों के बच्चों से भी अपना मुक़दमा लड़ूँगा।
  philosophy: optimal-equivalence
  footnotes:
