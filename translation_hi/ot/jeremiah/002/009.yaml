    text: या, “मैं अब भी तुम्हारे विरुद्ध अपना मुक़दमा लड़ूँगा … और तुम्हारे बच्चों के बच्चों के विरुद्ध भी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले आरोपों से निकले निष्कर्ष को सूचित करता है और हिन्दी में स्वाभाविक रूप से तार्किक संबंध बनाए रखता है।
- source_word: עוֹד
  choice: अब भी
  rationale: यह जारी या फिर से होने वाली कार्रवाई का भाव देता है; यहाँ न्यायिक विवाद के जारी रहने का आशय उपयुक्त है।
- source_word: אָרִיב
  choice: मुक़दमा लड़ूँगा
  rationale: ריב के न्यायिक और विरोधात्मक दोनों भावों को सहज आधुनिक हिन्दी में व्यक्त करता है; दोनों बार इसकी पुनरावृत्ति भी रखी गई है।
- source_word: אִתְּכֶם
  choice: तुमसे
  rationale: ריב के साथ इब्रानी संबंधसूचक रचना का निकट और स्वाभाविक हिन्दी रूप है; प्रसंग में इसका अर्थ विरोधी पक्ष के विरुद्ध मुक़दमा करना है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: मानक नबूवत-सूत्र की अधिकारपूर्ण और गरिमामय अभिव्यक्ति है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी में आए परमेश्वर के विशिष्ट वाचा-नाम को लिप्यंतरित रूप में सुरक्षित रखता है।
- source_word: בְּנֵי בְנֵיכֶם
  choice: तुम्हारे बच्चों के बच्चे
  rationale: मूल की पीढ़ीगत अभिव्यक्ति और उसकी गंभीरता को बनाए रखता है; केवल 'पोते-पोतियाँ' कहने से संभावित व्यापक वंशगत अर्थ संकरा हो सकता है।
theological_decisions:
- issue: ריב के वाचा-संबंधी न्यायिक भाव को कैसे व्यक्त किया जाए
  choice: मुक़दमा लड़ूँगा
  alternative: विवाद करूँगा / आरोप लगाऊँगा
  rationale: चुना गया रूप न्यायिक अभियोग और विरोध, दोनों को व्यक्त करता है, पर किसी अत्यधिक विशिष्ट अदालती प्रक्रिया को आरोपित नहीं करता।
- issue: אִתְּכֶם में साथ/विरुद्ध का संबंध
  choice: तुमसे
  alternative: तुम्हारे विरुद्ध
  rationale: ‘तुमसे’ इब्रानी रचना के अधिक निकट है और विरोध का भाव क्रिया से मिलता है; स्पष्ट विरोधात्मक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: परमेश्वर के नाम יְהוָה का रूप
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ के विशिष्ट दिव्य नाम को नाम के रूप में प्रस्तुत करता है, उपाधि में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी; न्यायिक और नबूवतीय गरिमा बनाए रखने के लिए ‘मुक़दमा लड़ना’ और ‘घोषणा’ का प्रयोग किया गया है। संबोधन बहुवचन ‘तुम’ है।
