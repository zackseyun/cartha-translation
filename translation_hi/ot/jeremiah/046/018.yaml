  text: חַי אָ֨נִי֙ נְאֻם הַ/מֶּ֔לֶךְ יְהוָ֥ה צְבָא֖וֹת שְׁמ֑/וֹ כִּ֚י כְּ/תָב֣וֹר בֶּֽ/הָרִ֔ים וּ/כְ/כַרְמֶ֖ל בַּ/יָּ֥ם יָבֽוֹא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/018.yaml
  text: As I live[a], declares the King, whose name is Yahweh of Armies, surely as Tabor among the mountains and as Carmel by the sea[b], so he will come.
translation:
  language: hi
  text: “मेरे जीवन की शपथ,” राजा की यह घोषणा है—जिसका नाम सेनाओं का याहवे[a] है—“निश्चय ही, जैसे पहाड़ों में ताबोर और समुद्र के पास कर्मेल, वैसे ही वह[b] आएगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, परंपरागत रूप में, “सेनाओं का प्रभु।”
    reason: lexical_alternative
  - marker: b
    text: ‘आएगा’ का कर्ता इब्रानी पाठ में स्पष्ट रूप से नहीं बताया गया है; आसपास का प्रसंग आने वाले विजेता की ओर संकेत करता है।
    reason: source_ambiguity
lexical_decisions:
- source_word: חַי אָ֨נִי
  choice: मेरे जीवन की शपथ
  rationale: यह एक गंभीर दिव्य शपथ का मुहावरा है। शाब्दिक ‘मैं जीवित हूँ’ की अपेक्षा यह आधुनिक हिन्दी में शपथ का आशय स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: נְאֻם
  choice: यह घोषणा है
  rationale: भविष्यद्वाणी में प्रयुक्त इस मानक वाणी-सूचक पद का अर्थ अधिकारपूर्ण घोषणा है; यह रूप आधुनिक हिन्दी में सहज है।
- source_word: הַמֶּלֶךְ
  choice: उस राजा
  rationale: निश्चित पदवी के रूप में आया ‘राजा’ आगे के संबंधवाचक वाक्य से पहचाना जाता है और परमेश्वर की राजसत्ता को बनाए रखता है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का याहवे
  rationale: यְהוָה को उसके व्यक्तिगत वाचा-नाम ‘याहवे’ के रूप में और צְבָאוֹת को उसके स्पष्ट सैन्य अर्थ ‘सेनाओं’ के रूप में प्रस्तुत किया गया है।
- source_word: שְׁמוֹ
  choice: जिसका नाम ... है
  rationale: यह संबंधवाचक हिन्दी रचना मूल के पहचानसूचक भाव को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: כִּי
  choice: निश्चय ही
  rationale: यहाँ पद कारण नहीं बताता, बल्कि शपथ से जुड़ी बात की निश्चितता पर बल देता है।
- source_word: כְּתָבוֹר בֶּהָרִים
  choice: जैसे पहाड़ों के बीच ताबोर
  rationale: तुलनात्मक उपसर्ग और पर्वतीय परिदृश्य में ताबोर की प्रमुखता दोनों सुरक्षित रखे गए हैं।
- source_word: וּכְכַרְמֶל בַּיָּם
  choice: और समुद्र के पास कर्मेल
  rationale: यह कर्मेल पर्वत और निकटवर्ती समुद्र की भौगोलिक छवि को स्वाभाविक हिन्दी में रखता है।
- source_word: יָבֹוא
  choice: वह आएगा
  rationale: क्रिया पुल्लिंग एकवचन है, पर उसका कर्ता इस पद में व्यक्त नहीं है; हिन्दी में आवश्यक सर्वनाम रखा गया है और उसकी पहचान टिप्पणी में खुली छोड़ी गई है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में चार-अक्षरी व्यक्तिगत ईश्वरीय नाम सीधे आया है; ‘याहवे’ उसे उपाधि में बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: צְבָאוֹת का अर्थ
  choice: सेनाओं का
  alternative: गणों का; सर्वशक्तिमान
  rationale: ‘सेनाओं’ से मूल की राजकीय और सैन्य छवि स्पष्ट रहती है; ‘सर्वशक्तिमान’ अर्थ की व्याख्या कर देता और मूल रूपक को मिटा देता।
- issue: יָבֹוא के अव्यक्त कर्ता की पहचान
  choice: मुख्य पाठ में केवल ‘वह’
  alternative: विजेता; बाबेल का राजा
  rationale: आसपास का प्रसंग आने वाले विजेता की ओर संकेत करता है, किंतु इस पद में उसका नाम नहीं है; इसलिए पहचान को मुख्य पाठ में निश्चित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक पाठ के योग्य रखी गई है। दिव्य शपथ को हिन्दी के स्वाभाविक मुहावरे में व्यक्त किया गया है। ताबोर और कर्मेल वाली संक्षिप्त, कुछ हद तक काव्यात्मक तुलना को समझाकर सपाट नहीं किया गया, ताकि मूल की अलंकारिक तीव्रता और वास्तविक अस्पष्टता बनी रहे।
