  yaml_path: translation/ot/jeremiah/046/015.yaml
  text: Why has your mighty one been swept away? He did not stand[a], for Yahweh drove him away.
translation:
  language: hi
  text: तेरा बलवान क्यों बहा ले जाया गया? वह डटा न रह सका, क्योंकि यहोवा ने उसे धकेल दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַדּוּעַ
  choice: क्यों
  rationale: यह आलंकारिक प्रश्न आरम्भ करने वाला प्रश्नवाचक क्रियाविशेषण है; आधुनिक हिन्दी में ‘क्यों’ स्वाभाविक और सीधा है।
- source_word: נִסְחַף
  choice: बहा दिया गया
  rationale: निफ़अल रूप बहा ले जाए जाने या पराजय में हटा दिए जाने का कर्मवाच्य बोध देता है; ‘बहा दिया गया’ मूल की सजीव छवि बनाए रखता है।
- source_word: אַבִּירֶיךָ
  choice: तेरा पराक्रमी
  rationale: लिखित रूप को बहुवचन ‘तेरे पराक्रमी’ भी समझा जा सकता है, किंतु आगे के एकवचन क्रियारूप और कर्म-प्रत्यय के कारण मुख्य पाठ में एकवचन रखा गया है। शब्द बलवान व्यक्ति या साँड़ का बोध भी दे सकता है; वह संभावना पादटिप्पणी में सुरक्षित है।
- source_word: לֹא עָמַד
  choice: वह टिक न सका
  rationale: युद्ध-संदर्भ में עמד का अर्थ अपने स्थान पर डटे या टिके रहना है। हिन्दी में ‘टिक न सका’ पराजय का मुहावरेदार अर्थ देता है, यद्यपि मूल व्याकरण शाब्दिक रूप से ‘टिका नहीं’ है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पराजय का कारण प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ स्पष्ट और स्वाभाविक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ द्वारा प्रस्तुत किया गया है।
- source_word: הֲדָפוֹ
  choice: उसे धकेल दिया
  rationale: क्रिया धक्का देने, पीछे हटाने या खदेड़ने का अर्थ रखती है और प्रत्यय एकवचन कर्म को सूचित करता है। ‘धकेल दिया’ मूल क्रिया की ठोस छवि बचाता है।
theological_decisions:
- issue: मिस्र-विषयक वाणी में אַבִּירֶיךָ का अभिप्रेत संकेत
  choice: मुख्य पाठ में सामान्य एकवचन ‘तेरा पराक्रमी’
  alternative: ‘तेरे पराक्रमी’ अथवा ‘तेरा साँड़’, संभवतः मिस्र के पवित्र एपिस साँड़ का संकेत
  rationale: व्यंजनात्मक पाठ बहुवचन की अनुमति देता है, पर निकटवर्ती एकवचन क्रियाएँ और कर्म-प्रत्यय एकवचन का समर्थन करते हैं। पद स्वयं एपिस का नाम स्पष्ट नहीं करता, इसलिए उस ऐतिहासिक-धार्मिक संभावना को मुख्य पाठ में आरोपित करने के बजाय पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, एकवचन अनौपचारिक/काव्यात्मक संबोधन ‘तेरा’ के साथ, क्योंकि वाणी मिस्र को संबोधित है। भाषा गरिमापूर्ण किंतु सहज रखी गई है।
