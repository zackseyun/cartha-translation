translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यद्वाणी-संबंधी शैली रखी गई है। ‘सरसराहट’ उपमा के श्रव्य पक्ष को स्वाभाविक बनाती है, जबकि शाब्दिक संरचना पादटिप्पणी में सुरक्षित है। सभी पादटिप्पणी-चिह्न संबंधित पदांशों के तुरंत बाद रखे गए हैं।
