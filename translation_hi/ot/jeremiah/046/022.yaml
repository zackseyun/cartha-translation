  text: קוֹלָ֖/הּ כַּ/נָּחָ֣שׁ יֵלֵ֑ךְ כִּֽי בְ/חַ֣יִל יֵלֵ֔כוּ וּ/בְ/קַרְדֻּמּוֹת֙ בָּ֣אוּ לָ֔/הּ כְּ/חֹטְבֵ֖י עֵצִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/022.yaml
  text: Her sound goes like a serpent[a], for they go with an army and come against her with axes[c][b], like woodcutters.
translation:
  language: hi
  text: उसकी ध्वनि साँप की तरह सरकती जाती है[a], क्योंकि वे सेना के साथ जाते हैं[b] और कुल्हाड़ियाँ लेकर उसके विरुद्ध आते हैं[c], लकड़हारों की तरह।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसकी आवाज़ साँप की तरह जाती है”; यहाँ קוֹל का अर्थ “आवाज़,” “ध्वनि” या “शोर” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “वे बलपूर्वक जाते हैं”; חַיִל का अर्थ सैन्य बल, शक्ति या सेना हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “उसके पास आते हैं”; प्रसंग में यह शत्रुतापूर्वक उसके विरुद्ध आने को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹלָהּ
  choice: उसकी आवाज़
  rationale: קוֹל का अर्थ आवाज़, ध्वनि या शोर हो सकता है। मिस्र को स्त्री रूप में व्यक्त किया गया है; ‘आवाज़’ स्वाभाविक है और अर्थ की व्यापकता बनाए रखती है।
- source_word: כַּנָּחָשׁ יֵלֵךְ
  choice: साँप की सरसराहट-सी आगे बढ़ती है
  rationale: शाब्दिक संरचना ‘साँप के समान जाती है’ है। हिन्दी में आवाज़ के ‘जाने’ की अपेक्षा ‘आगे बढ़ने’ और साँप से जुड़ी ‘सरसराहट’ द्वारा श्रव्य उपमा अधिक स्पष्ट और स्वाभाविक होती है, जबकि पादटिप्पणी अधिक शाब्दिक संभावना सुरक्षित रखती है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह आगे आने वाले कथन को साँप-जैसी आवाज़ के कारण या व्याख्या के रूप में जोड़ता है।
- source_word: בְחַיִל יֵלֵכוּ
  choice: वे सेना के साथ बढ़ते हैं
  rationale: חַיִל यहाँ सैन्य प्रसंग में ‘सेना’ का बोध देता है; फिर भी ‘बलपूर्वक’ की संभावना पादटिप्पणी में रखी गई है। הלך के लिए ‘बढ़ते हैं’ आक्रमणकारी गति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וּבְקַרְדֻּמּוֹת
  choice: और कुल्हाड़ियाँ लेकर
  rationale: קַרְדֹּם कुल्हाड़ी को सूचित करता है। उपकरणसूचक בְ को स्वाभाविक हिन्दी में ‘लेकर’ कहा गया है।
- source_word: בָּאוּ לָהּ
  choice: उसके विरुद्ध आते हैं
  rationale: शाब्दिक अर्थ ‘उसके पास/उसकी ओर आते हैं’ है, पर सैन्य संदर्भ विरोधी आशय स्पष्ट करता है; यह बात पादटिप्पणी में भी दर्ज है।
- source_word: כְּחֹטְבֵי עֵצִים
  choice: मानो लकड़हारे हों
  rationale: यह ‘लकड़ी/पेड़ काटने वालों के समान’ का संक्षिप्त, आधुनिक और चित्रात्मक हिन्दी रूप है।
