id: JER.46.11
reference: Jeremiah 46:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: עֲלִ֤י גִלְעָד֙ וּ/קְחִ֣י צֳרִ֔י בְּתוּלַ֖ת בַּת מִצְרָ֑יִם לַ/שָּׁוְא֙ הרביתי רְפֻא֔וֹת תְּעָלָ֖ה אֵ֥ין לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/011.yaml
  text: Go up to Gilead and get balm[a], virgin daughter of Egypt. In vain you have multiplied remedies[b]; there is no healing for you.
translation:
  language: hi
  text: 'गिलाद को जा और मरहम ले,[a]

    हे मिस्र की कुँवारी बेटी!

    तूने व्यर्थ ही बहुत-से उपचार किए हैं;[b]

    तेरे लिए कोई चंगाई नहीं है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'गिलाद औषधि में प्रयुक्त अपने सुगंधित गोंद या बाल्सम के लिए प्रसिद्ध था। यह आज्ञा व्यंग्यपूर्ण है: सबसे प्रसिद्ध मरहम भी मिस्र को चंगा नहीं कर सकेगा।'
    reason: cultural_note
  - marker: b
    text: 'इसे इस प्रकार भी समझा जा सकता है: “तूने बहुत-सी औषधियाँ व्यर्थ ही काम में ली हैं।” इब्रानी व्यंजनात्मक पाठ में “तूने बहुत-से उपचार किए हैं” वाली क्रिया का रूप पाठगत और रूपात्मक दृष्टि से कठिन है, पर प्रसंग में यह स्पष्ट है कि मिस्र के अनेक उपचार निष्फल हैं।'
    reason: textual_variant
lexical_decisions:
- source_word: עֲלִי
  choice: चढ़ जा
  rationale: यह עלה का स्त्रीलिंग एकवचन आज्ञार्थक रूप है। “चढ़ जा” दिशा और आज्ञा—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: גִלְעָד
  choice: गिलाद
  rationale: स्थान-नाम को प्रचलित हिन्दी बाइबलीय लिप्यंतरण में रखा गया है; यह क्षेत्र अपने औषधीय सुगंधित गोंद के लिए प्रसिद्ध था।
- source_word: וּקְחִי
  choice: और मरहम ले आ
  rationale: לקח का स्त्रीलिंग एकवचन आज्ञार्थक रूप मूलतः “ले” है। प्रसंग में गिलाद से औषधि प्राप्त करके लाने का भाव होने के कारण “ले आ” स्वाभाविक है।
- source_word: צֳרִי
  choice: मरहम
  rationale: यह औषधि में प्रयुक्त सुगंधित गोंद या बलसान को दर्शाता है। “मरहम” सामान्य पाठक के लिए सहज है, जबकि पदार्थ की ऐतिहासिक प्रकृति पादटिप्पणी में स्पष्ट की गई है।
- source_word: בְּתוּלַת בַּת מִצְרָיִם
  choice: हे मिस्र की कुँवारी बेटी
  rationale: यह मिस्र का स्त्रीरूप में मानवीकरण करने वाला भविष्यद्वाणी-संबंधी संबोधन है। अनुवाद “कुँवारी” और “बेटी” दोनों बिंबों को बनाए रखता है।
- source_word: לַשָּׁוְא
  choice: व्यर्थ ही
  rationale: यह निष्फलता का भाव व्यक्त करता है। “व्यर्थ ही” संक्षिप्त, स्वाभाविक और भविष्यद्वाणी के स्वर के अनुकूल है।
- source_word: הרביתי רְפֻאוֹת
  choice: तूने बहुत-से उपचार किए हैं
  rationale: संदर्भ में अर्थ अनेक उपचार अपनाने या बढ़ाने का है। “बहुत-से उपचार किए हैं” आधुनिक हिन्दी में स्वाभाविक है; व्यंजनात्मक पाठ की रूपात्मक कठिनाई पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: תְּעָלָה אֵין לָךְ
  choice: तेरे लिए कोई चंगाई नहीं है
  rationale: अस्तित्ववाचक निषेध और स्त्रीलिंग संबोधन को निकटता से रखा गया है। “चंगाई” यहाँ घाव या विपत्ति से स्वस्थ होने का व्यापक भाव देता है।
