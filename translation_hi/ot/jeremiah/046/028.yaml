base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/028.yaml
  text: But you[a], do not fear, my servant Jacob, declares Yahweh, for I am with you. For I will make a full end of all the nations where I have driven you, but of you I will not make a full end. Yet I will discipline you with justice[b], and I will by no means leave you unpunished.
translation:
  language: hi
  text: परन्तु तू, मेरे सेवक याकूब, मत डर—याहवे की यह घोषणा है—क्योंकि मैं तेरे साथ हूँ। क्योंकि मैं उन सभी जातियों का पूर्ण विनाश कर दूँगा, जिनमें मैंने तुझे निर्वासित कर दिया है; परन्तु तेरा पूर्ण विनाश नहीं करूँगा।[a] फिर भी मैं न्याय के अनुसार तुझे अनुशासित करूँगा और तुझे दण्ड दिए बिना बिलकुल नहीं छोड़ूँगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं तुझे पूरी तरह नष्ट नहीं करूँगा।” इब्रानी में “पूर्ण विनाश करना” दोनों बार दोहराया गया है, जिससे जातियों और याकूब के बीच तीखा विरोध उभरता है।
    reason: lexical_alternative
  - marker: b
    text: या, “मैं तुझे किसी भी तरह निर्दोष नहीं ठहराऊँगा।” इब्रानी क्रिया का न्यायालयीय अर्थ ‘निर्दोष ठहराना’ भी हो सकता है; इस प्रसंग में इसका आशय यह भी है कि याकूब को उचित दण्ड दिए बिना नहीं छोड़ा जाएगा।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּירָא
  choice: मत डर
  rationale: सीधी निषेधात्मक आज्ञा को सहज, संक्षिप्त आधुनिक हिन्दी में व्यक्त करता है और आश्वासन का स्वर बनाए रखता है।
- source_word: עַבְדִּי יַעֲקֹב
  choice: हे मेरे सेवक याकूब
  rationale: सम्बोधन को स्पष्ट करते हुए वाचा-सूचक उपाधि ‘मेरे सेवक’ और मूल नाम ‘याकूब’ दोनों सुरक्षित रखता है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: गम्भीर भविष्यवाणी-सूत्र को स्वाभाविक हिन्दी में रखता है और व्यक्तिगत दिव्य नाम को ‘याहवे’ के रूप में प्रस्तुत करता है।
- source_word: כִּי אִתְּךָ אָנִי
  choice: क्योंकि मैं तेरे साथ हूँ
  rationale: कारण और परमेश्वर की उपस्थिति से मिलने वाला आश्वासन दोनों सीधे रूप में सुरक्षित रहते हैं।
- source_word: אֶעֱשֶׂה כָלָה
  choice: पूरी तरह अन्त कर दूँगा
  rationale: पूर्ण विनाश का भाव व्यक्त करता है और दोनों खण्डों में एक ही अभिव्यक्ति दोहराकर जातियों और याकूब के बीच मूल आलंकारिक विरोध बनाए रखता है।
- source_word: אֲשֶׁר הִדַּחְתִּיךָ שָׁמָּה
  choice: जहाँ मैंने तुझे खदेड़ दिया है
  rationale: हिफ़ील रूप में बलपूर्वक दूर भेजने या निर्वासित करने का भाव ‘खदेड़ दिया’ से स्पष्ट होता है, बिना इसे केवल बिखेरने तक सीमित किए।
- source_word: וְיִסַּרְתִּיךָ לַמִּשְׁפָּט
  choice: फिर भी मैं न्याय के अनुसार तुझे अनुशासित करूँगा
  rationale: יִסַּר का सुधारात्मक अनुशासन और מִשְׁפָּט का न्यायपूर्ण मानदण्ड दोनों व्यक्त होते हैं; दया और न्याय का तनाव बना रहता है।
- source_word: וְנַקֵּה לֹא אֲנַקֶּךָּ
  choice: तुझे दण्ड दिए बिना बिलकुल नहीं छोड़ूँगा
  rationale: क्रिया की तीव्र नकारात्मक रचना को ‘बिलकुल नहीं’ से व्यक्त करता है। मुख्य पाठ में प्रसंगानुकूल दण्ड का अर्थ स्पष्ट है, जबकि न्यायालयीय ‘निर्दोष ठहराना’ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: याकूब पर दिव्य न्याय और जातियों के विनाश के बीच सम्बन्ध
  choice: याहवे याकूब को पूर्ण विनाश से बचाने की प्रतिज्ञा करता है, फिर भी उसे न्यायपूर्ण अनुशासन से मुक्त नहीं करता।
  alternative: याकूब किसी भी प्रकार के दण्ड से पूर्णतः मुक्त रहेगा, अथवा उसका अनुशासन केवल विनाशकारी दण्ड होगा।
  rationale: मूल पाठ जातियों के ‘पूरी तरह अन्त’ और याकूब का वैसा अन्त न किए जाने में स्पष्ट विरोध रखता है, पर साथ ही याकूब के न्यायपूर्ण अनुशासन और दण्ड को भी दृढ़ता से कहता है। अनुवाद दया और न्याय दोनों को बिना मिलाए सुरक्षित रखता है।
- issue: נקה का दण्डात्मक और न्यायालयीय अर्थ
  choice: मुख्य पाठ में ‘दण्ड दिए बिना नहीं छोड़ूँगा’, और पादटिप्पणी में ‘निर्दोष नहीं ठहराऊँगा’।
  alternative: केवल न्यायालयीय अर्थ ‘निर्दोष नहीं ठहराऊँगा’।
  rationale: तात्कालिक सन्दर्भ अनुशासन और उसके परिणाम पर बल देता है, किन्तु इब्रानी क्रिया का दोषमुक्त या निर्दोष घोषित करने वाला न्यायालयीय अर्थ भी वास्तविक है; इसलिए उसे पादटिप्पणी में संरक्षित किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; एकवचन आत्मीय ‘तू/तेरा’ के रूपों से मूल इब्रानी के एकवचन राष्ट्रीय सम्बोधन को बनाए रखा गया है। शैली गरिमापूर्ण किन्तु सामान्य पाठक के लिए सुबोध है। ‘पूरी तरह अन्त’ की जानबूझकर की गई पुनरावृत्ति मूल की आलंकारिक समानता और विरोध को सुरक्षित रखती है।
