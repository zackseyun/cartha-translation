reference: Jeremiah 46:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: מַדּ֣וּעַ רָאִ֗יתִי הֵ֣מָּה חַתִּים֮ נְסֹגִ֣ים אָחוֹר֒ וְ/גִבּוֹרֵי/הֶ֣ם יֻכַּ֔תּוּ וּ/מָנ֥וֹס נָ֖סוּ וְ/לֹ֣א הִפְנ֑וּ מָג֥וֹר מִ/סָּבִ֖יב נְאֻם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/005.yaml
  text: Why have I seen this? They are terrified[a], turning back; their warriors are crushed, and they have fled hastily and have not turned back. Terror is on every side[b], declares Yahweh.
translation:
  language: hi
  text: मैंने यह क्यों देखा है? वे भय से टूटे हुए हैं[a], पीछे हट रहे हैं; उनके योद्धा कुचल दिए गए हैं। वे बेतहाशा भागे हैं[b] और मुड़े तक नहीं। चारों ओर आतंक है—याहवे की घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे भयभीत हैं” अथवा “वे हताश हैं।” इब्रानी शब्द भय के कारण मनोबल टूटने का भाव भी दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में एक ही मूल से बने शब्दों की पुनरुक्ति है, जिसका शाब्दिक रूप लगभग “भागते हुए भागे” है; इससे पूरी तरह और घबराहट में भागने पर जोर पड़ता है।
    reason: source_idiom
lexical_decisions:
- source_word: מַדּוּעַ רָאִיתִי
  choice: मैं यह क्यों देख रहा हूँ?
  rationale: इब्रानी का विस्मयपूर्ण प्रश्न भविष्यदर्शी दृश्य को सजीव वर्तमान की तरह प्रस्तुत करता है। हिन्दी में वर्तमान प्रगतिशील रूप इस तात्कालिकता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הֵמָּה חַתִּים
  choice: वे भय से टूट गए हैं
  rationale: חתת भय, हताशा और मनोबल टूटने की संयुक्त धारणा दे सकता है। यह चयन सैनिकों की भीतरी दशा को व्यक्त करता है और केवल शारीरिक विनाश का अर्थ नहीं लगाता।
- source_word: נְסֹגִים אָחוֹר
  choice: पीछे हट रहे हैं
  rationale: यह कृदन्तीय पद चल रही सैन्य वापसी का चित्र देता है; हिन्दी में यह संक्षिप्त और स्वाभाविक है।
- source_word: גִבּוֹרֵיהֶם
  choice: उनके योद्धा
  rationale: सैन्य प्रसंग में גִּבּוֹרִים बलवान लड़ाकों या वीर सैनिकों को सूचित करता है; ‘योद्धा’ आधुनिक पाठक के लिए स्पष्ट है।
- source_word: יֻכַּתּוּ
  choice: कुचल दिए गए हैं
  rationale: निष्क्रिय रूप प्रहार खाकर निर्णायक रूप से परास्त होने का भाव देता है। ‘कुचल दिए गए’ सैन्य पतन की तीव्रता बनाए रखता है।
- source_word: וּמָנוֹס נָסוּ
  choice: वे बेतहाशा भागे हैं
  rationale: एक ही धातु से बने संज्ञा और क्रिया का संयोजन पलायन पर जोर देता है। शब्दशः पुनरुक्ति हिन्दी में अस्वाभाविक होती, इसलिए ‘बेतहाशा’ जोरदार और अनियंत्रित पलायन व्यक्त करता है।
- source_word: וְלֹא הִפְנוּ
  choice: और मुड़े तक नहीं
  rationale: मूल क्रिया का अर्थ मुड़ना या मुख फेरना है। ‘तक’ जोड़कर यह भाव आता है कि भागते सैनिक शत्रु की ओर फिर से मुख करने के लिए भी नहीं रुके।
- source_word: מָגוֹר מִסָּבִיב
  choice: चारों ओर आतंक है
  rationale: यह यिर्मयाह में बार-बार आने वाला सूत्र है। ‘चारों ओर आतंक’ उसकी संक्षिप्तता और व्यापक भय दोनों को सुरक्षित रखता है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की वाणी है
  rationale: נְאֻם एक गंभीर भविष्यवाणी-सूत्र है। ‘वाणी’ साधारण ‘कहता है’ से अधिक सूत्रात्मक भार रखता है, और יְהוָה को व्यक्तिगत नाम ‘याहवे’ के रूप में रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे आया है। उसका लिप्यंतर नाम की विशिष्टता बनाए रखता है और उसे पदवी में नहीं बदलता।
- issue: חתים में भय और टूटन का संबंध
  choice: भय से टूट गए हैं
  alternative: भयभीत हैं; हताश हैं
  rationale: शब्द मानसिक आतंक और मनोबल टूटने, दोनों की ओर संकेत कर सकता है। मुख्य पाठ दोनों पहलुओं को साथ रखता है और पादटिप्पणी विकल्पों को स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। छोटे वाक्यों से युद्धभूमि की आकस्मिक घबराहट उभरती है। ‘बेतहाशा’ इब्रानी की जोरदार पुनरुक्ति को स्वाभाविक हिन्दी में व्यक्त करता है; ‘यह याहवे की वाणी है’ भविष्यवाणी-सूत्र का औपचारिक भार बनाए रखता है।
