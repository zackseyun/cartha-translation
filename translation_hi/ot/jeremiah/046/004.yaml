lexical_decisions:
- source_word: אִסְרוּ הַסּוּסִים
  choice: घोड़ों को जुताओ
  rationale: אסר का मूल भाव बाँधना है; युद्ध की तैयारी में घोड़ों के साथ यह उन्हें साज लगाकर तैयार करने को दर्शाता है। ‘जुताओ’ संक्षिप्त और स्वाभाविक सैन्य आदेश है।
- source_word: וַעֲלוּ הַפָּרָשִׁים
  choice: हे घुड़सवारो, चढ़ो!
  rationale: עלה का शाब्दिक अर्थ ‘ऊपर चढ़ना’ है; घुड़सवारों के संदर्भ में आशय घोड़ों पर सवार होना है। सम्बोधन को स्पष्ट रखा गया है।
- source_word: וְהִתְיַצְּבוּ
  choice: मोर्चा सँभालो
  rationale: יצב का हित्पएल रूप स्वयं को तैनात करने या दृढ़ होकर खड़े होने का सैन्य भाव देता है। ‘मोर्चा सँभालो’ आधुनिक हिन्दी में युद्ध-पंक्ति में स्थान लेने का स्वाभाविक आदेश है।
- source_word: בְּכֹובָעִים
  choice: टोप पहनकर
  rationale: כובע सैन्य सिर-कवच है। ‘टोप’ हिन्दी बाइबलीय-सैन्य भाषा में सहज और ‘हेलमेट’ से अधिक देशज है।
- source_word: מִרְקוּ הָרְמָחִים
  choice: भालों को चमकाओ
  rationale: מרק का अर्थ साफ़ या माँजकर चमकाना है, और רמח भाला है। यह अनुवाद तैयारी की क्रिया और हथियार दोनों को स्पष्ट रखता है।
- source_word: לִבְשׁוּ הַסִּרְיֹנֹת
  choice: कवच पहन लो
  rationale: לבשׁ वस्त्र या कवच धारण करने को कहता है। סריון शरीर की रक्षा करने वाला कवच है, पर उसका ठीक प्रकार अनिश्चित है; इसलिए व्यापक शब्द ‘कवच’ चुना गया है।
