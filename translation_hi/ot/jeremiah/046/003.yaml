- source_word: צִנָּה
  choice: बड़ी ढाल
  rationale: צִנָּה प्रायः शरीर के अधिक भाग को ढकने वाली बड़ी ढाल के लिए आता है। “बड़ी ढाल” מָגֵן के साथ उपस्थित आकारगत भेद को सहज हिन्दी में बनाए रखता है।
- source_word: וּגְשׁוּ
  choice: आगे बढ़ो
  rationale: נגשׁ का अर्थ निकट आना या आगे जाना है। युद्ध के प्रसंग में “आगे बढ़ो” सैनिकों के युद्ध की ओर बढ़ने का स्वाभाविक हिन्दी रूप है।
- source_word: לַמִּלְחָמָה
  choice: युद्ध के लिए
  rationale: यह पदबंध युद्ध की ओर बढ़ने अथवा उसमें सम्मिलित होने का लक्ष्य बताता है; “युद्ध के लिए” हिन्दी में संक्षिप्त और स्वाभाविक है।
