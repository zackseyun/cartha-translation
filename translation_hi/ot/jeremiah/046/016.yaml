source:
  edition: WLC
  text: הִרְבָּ֖ה כּוֹשֵׁ֑ל גַּם נָפַ֞ל אִ֣ישׁ אֶל רֵעֵ֗/הוּ וַ/יֹּֽאמְרוּ֙ ק֣וּמָ/ה וְ/נָשֻׁ֣בָה אֶל עַמֵּ֗/נוּ וְ/אֶל אֶ֨רֶץ֙ מֽוֹלַדְתֵּ֔/נוּ מִ/פְּנֵ֖י חֶ֥רֶב הַ/יּוֹנָֽה־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/016.yaml
  text: He has multiplied the stumbling; indeed[a], each man falls against his companion, and they say, “Come, and let us return to our people and to the land of our birth, away from the sword of the oppressor.”
translation:
  language: hi
  text: उसने बहुतों को ठोकर खिलाई; सचमुच, हर एक अपने साथी पर गिर पड़ा। और वे कहने लगे, “उठो, हम अपने लोगों के पास और अपनी जन्मभूमि लौट चलें—सतानेवाले की तलवार[a] से बचकर।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कबूतर की तलवार।” इब्रानी शब्द का शाब्दिक अर्थ इस प्रकार लिया जा सकता है, लेकिन इस संदर्भ में इसे सामान्यतः “सतानेवाला” या “हिंसक व्यक्ति” समझा जाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: הִרְבָּה כּוֹשֵׁל
  choice: उसने बहुतों को ठोकर खिलाई
  rationale: हिफ़ील הִרְבָּה और कृदंत כּוֹשֵׁל का इब्रानी संयोजन अत्यंत संक्षिप्त और कुछ असामान्य है। सन्दर्भ में निहित कर्ता के कारण बहुत-से लोगों के लड़खड़ाकर गिरने का भाव स्वाभाविक हिन्दी में व्यक्त किया गया है, बिना यह बताए कि वे जानबूझकर गिराए गए।
- source_word: גַּם
  choice: सचमुच
  rationale: यहाँ शब्द केवल ‘भी’ जोड़ने के बजाय अगले कथन पर बल देता है।
- source_word: נָפַל אִישׁ אֶל רֵעֵהוּ
  choice: वे एक-दूसरे पर गिर पड़े
  rationale: एकवचन אִישׁ का प्रयोग वितरणात्मक है; युद्ध की अव्यवस्था में एक व्यक्ति का दूसरे पर गिरना सहज बहुवचन हिन्दी में व्यक्त हुआ है।
- source_word: קוּמָה וְנָשֻׁבָה
  choice: उठो, हम ... लौट चलें
  rationale: आज्ञार्थक और सहमति/संकल्पसूचक रूपों का सामूहिक आह्वान हिन्दी में बनाए रखा गया है।
- source_word: עַמֵּנוּ
  choice: अपने लोगों के पास
  rationale: עַם यहाँ जातीय अथवा राष्ट्रीय समुदाय को सूचित करता है; ‘लोगों’ से घर लौटते विदेशी सैनिकों का आशय स्पष्ट रहता है।
- source_word: אֶרֶץ מוֹלַדְתֵּנוּ
  choice: अपनी जन्मभूमि
  rationale: यह संक्षिप्त, प्रतिष्ठित और आधुनिक हिन्दी में मूल के ‘हमारे जन्म की भूमि’ का स्वाभाविक समतुल्य है।
- source_word: מִפְּנֵי
  choice: से बचकर
  rationale: सन्दर्भ में यह किसी खतरे के सामने से भागने और उससे बच निकलने का भाव देता है।
- source_word: חֶרֶב הַיּוֹנָה
  choice: सतानेवाले की तलवार
  rationale: युद्ध और पलायन के सन्दर्भ में הַיּוֹנָה को ינה, ‘सताना/दबाना’, से सम्बद्ध समझना सुसंगत है; ठोस ‘तलवार’ का बिम्ब सुरक्षित रखा गया है।
theological_decisions:
- issue: הַיּוֹנָה का अर्थ
  choice: सतानेवाला
  alternative: कबूतर
  rationale: यह मुख्यतः पाठार्थ का प्रश्न है, कोई सांप्रदायिक सिद्धान्त नहीं। युद्ध के सन्दर्भ में ‘सतानेवाले की तलवार’ स्पष्ट अर्थ देता है, पर उसी इब्रानी रूप का शाब्दिक अर्थ ‘कबूतर’ भी हो सकता है; इसलिए वास्तविक भाषिक अस्पष्टता पाद-टिप्पणी में सुरक्षित है।
- issue: הִרְבָּה का निहित कर्ता
  choice: पुल्लिंग एकवचन ‘उसने’ को अनिर्दिष्ट रखा गया
  alternative: स्पष्ट रूप से ‘परमेश्वर ने’ या ‘तलवार ने’ कहना
  rationale: क्रिया का कर्ता इस पद में नाम से व्यक्त नहीं है। हिन्दी में सर्वनाम रखकर निकट सन्दर्भ से सम्बन्ध बना रहता है और अनावश्यक व्याख्यात्मक निर्धारण नहीं जोड़ा जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किन्तु गरिमापूर्ण स्तर रखा गया है। युद्ध की अफरा-तफरी और सैनिकों के सामूहिक पलायन को स्पष्ट करने के लिए वितरणात्मक एकवचन को स्वाभाविक बहुवचन में व्यक्त किया गया है। पाद-टिप्पणी का चिह्न उसी विवादित पदबंध के तुरन्त बाद रखा गया है।
