source:
  edition: WLC
  text: וְֽ/הַ/יּ֨וֹם הַ/ה֜וּא לַ/אדֹנָ֧/י יְהוִ֣ה צְבָא֗וֹת י֤וֹם נְקָמָה֙ לְ/הִנָּקֵ֣ם מִ/צָּרָ֔י/ו וְ/אָכְלָ֥ה חֶ֨רֶב֙ וְ/שָׂ֣בְעָ֔ה וְ/רָוְתָ֖ה מִ/דָּמָ֑/ם כִּ֣י זֶ֠בַח לַ/אדֹנָ֨/י יְהוִ֧ה צְבָא֛וֹת בְּ/אֶ֥רֶץ צָפ֖וֹן אֶל נְהַר פְּרָֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/010.yaml
  text: That day belongs to the Lord GOD of Armies[a], a day of vengeance, to avenge himself on his foes. The sword will devour and be satisfied and drink its fill of their blood, for the Lord GOD of Armies has a sacrifice in the land of the north[b], by the Euphrates River.
translation:
  language: hi
  text: वह दिन सेनाओं के स्वामी यहोवा का है—बदला लेने का दिन, जब वह अपने विरोधियों से बदला लेगा। तलवार उन्हें निगल जाएगी, तृप्त हो जाएगी और उनके लहू को भरपेट पीएगी; क्योंकि उत्तर देश में, फरात नदी के पास, सेनाओं के स्वामी यहोवा के लिए एक बलिदान है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इसे इस प्रकार भी समझा जा सकता है: “क्योंकि सेनाओं के स्वामी यहोवा का एक बलिदान है।” इब्रानी में यह संबंध ‘के लिए’ या अधिकार ‘का’—दोनों अर्थों में समझा जा सकता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיּוֹם הַהוּא לַאדֹנָי יְהוִה צְבָאוֹת
  choice: वह दिन सेनाओं के स्वामी यहोवा का दिन होगा
  rationale: לַאדֹנָי संबंध अथवा अधिकार प्रकट करता है। हिंदी में ‘का दिन’ स्वाभाविक रूप से बताता है कि वह दिन यहोवा के न्यायकारी कार्य के लिए नियत है।
- source_word: יוֹם נְקָמָה לְהִנָּקֵם מִצָּרָיו
  choice: बदला लेने का दिन, जब वह अपने विरोधियों से बदला लेगा
  rationale: נְקָמָה और נקם की पुनरावृत्ति को बनाए रखा गया है। ‘विरोधी’ צָרָיו के शत्रुतापूर्ण अर्थ को स्पष्ट करता है।
- source_word: וְאָכְלָה חֶרֶב וְשָׂבְעָה
  choice: तलवार उन्हें निगलकर तृप्त हो जाएगी
  rationale: तलवार के मानवीकरण और खाने से तृप्त होने की सजीव छवि को सुरक्षित रखा गया है; ‘उन्हें’ संदर्भ से निहित कर्म को हिंदी में स्पष्ट करता है।
- source_word: וְרָוְתָה מִדָּמָם
  choice: उनके लहू से छककर पिएगी
  rationale: רוה का अर्थ भरपूर पीना अथवा तर होना हो सकता है। यह चयन तलवार के पीने के मानवीकरण को जारी रखता है, जबकि ‘लहू’ गरिमापूर्ण बाइबलीय शैली बनाए रखता है।
- source_word: כִּי זֶבַח לַאדֹנָי יְהוִה צְבָאוֹת
  choice: क्योंकि ... सेनाओं के स्वामी यहोवा के लिए एक बलिदान है
  rationale: अस्तित्ववाचक रचना को निकटता से रखा गया है और זֶבַח की बलिदान-संबंधी हत्या की छवि को स्पष्ट रहने दिया गया है।
- source_word: בְּאֶרֶץ צָפוֹן אֶל נְהַר פְּרָת
  choice: उत्तर देश में, फरात नदी के पास
  rationale: בְּ स्थान बताता है और אֶל यहाँ नदी के निकट का स्थान सूचित करता है। ‘फरात’ आधुनिक हिंदी में प्रचलित नाम है।
theological_decisions:
- issue: संयुक्त ईश्वरीय उपाधि אֲדֹנָי יְהוִה צְבָאוֹת का अनुवाद
  choice: सेनाओं के स्वामी यहोवा
  alternative: प्रभु परमेश्वर, सेनाओं का परमेश्वर
  rationale: ‘यहोवा’ नाम को प्रत्यक्ष रखा गया है, אֲדֹנָי को ‘स्वामी’ और צְבָאוֹת को युद्ध-संदर्भ में पारदर्शी ‘सेनाओं’ से व्यक्त किया गया है। इससे किसी विशेष सांप्रदायिक व्याख्या को जोड़े बिना उपाधि का सैन्य आयाम बना रहता है।
- issue: זֶבַח को वास्तविक उपासना या न्याय के रूपक के रूप में समझना
  choice: बलिदान शब्द को रूपकात्मक तनाव सहित बनाए रखना
  alternative: संहार
  rationale: मूल पाठ युद्ध में होने वाली हत्या को बलिदान की छवि से प्रस्तुत करता है। इसे ‘संहार’ कहकर सपाट करने के बजाय पाठ की कठोर धर्मवैचारिक छवि सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘बदला’, ‘निगलकर’, ‘छककर’ और ‘बलिदान’ मूल की तीखी युद्ध तथा बलिदान-संबंधी छवियों को बनाए रखते हैं।
