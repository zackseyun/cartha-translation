lexical_decisions:
- source_word: קָרְאוּ
  choice: वे पुकारते हैं
  rationale: यह קרא का काल पूर्ण, तृतीय पुरुष बहुवचन रूप है। भविष्यवाणी की सजीव, ताना मारती घोषणा को व्यक्त करने के लिए हिन्दी में वर्तमानकाल स्वाभाविक है।
- source_word: שָׁם
