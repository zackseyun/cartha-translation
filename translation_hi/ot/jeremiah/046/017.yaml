- source_word: פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: मिस्र का राजा फ़िरौन
  rationale: व्यक्तिवाचक नाम और राजकीय उपाधि को आधुनिक हिन्दी के स्वाभाविक क्रम में रखा गया है।
- source_word: שָׁאוֹן
  choice: केवल शोर
  rationale: शब्द का अर्थ शोर, कोलाहल या हलचल हो सकता है। यहाँ व्यंग्यात्मक संदर्भ में ‘केवल शोर’ फ़िरौन की निष्फल डींग और प्रभावहीन कोलाहल को व्यक्त करता है, जबकि मूल बिंब बनाए रखता है।
- source_word: הֶעֱבִיר
  choice: निकल जाने दिया
  rationale: 'עבר के हिफ़ील रूप की कारकता को सुरक्षित रखता है: फ़िरौन ने निर्णायक समय को गुजर जाने दिया।'
- source_word: הַמּוֹעֵד
  choice: ठहराया हुआ समय
  rationale: מוֹעֵד किसी नियत या ठहराए हुए समय को दर्शाता है। सैनिक-राजनीतिक प्रसंग में यह पर्व के बजाय निर्णायक अवसर या नियत घड़ी का बोध देता है।
