  text: גַּם שְׂכִרֶ֤י/הָ בְ/קִרְבָּ/הּ֙ כְּ/עֶגְלֵ֣י מַרְבֵּ֔ק כִּֽי גַם הֵ֧מָּה הִפְנ֛וּ נָ֥סוּ יַחְדָּ֖יו לֹ֣א עָמָ֑דוּ כִּ֣י י֥וֹם אֵידָ֛/ם בָּ֥א עֲלֵי/הֶ֖ם עֵ֥ת פְּקֻדָּתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/021.yaml
  text: Even her hired soldiers in her midst are like fattened calves; for even they have turned and fled together; they did not stand[a], for the day of their disaster has come upon them, the time of their punishment.
translation:
  language: hi
  text: उसके भीतर के भाड़े के सैनिक भी बाड़े में पाले-पोसे बछड़ों जैसे हैं; क्योंकि वे भी मुड़े और एक साथ भाग गए; वे डटे नहीं रहे, क्योंकि उनकी विपत्ति का दिन उन पर आ पड़ा है—उनके दण्ड का समय।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनके निरीक्षण का समय” अथवा “उनसे हिसाब लेने का समय।”
    reason: פְּקֻדָּה दण्ड के अतिरिक्त निरीक्षण/भेंट करने या हिसाब लेने का अर्थ भी दे सकता है।
lexical_decisions:
- source_word: שְׂכִרֶיהָ
  choice: उसके बीच के भाड़े के सैनिक
  rationale: שָׂכִיר मूलतः भाड़े पर रखे गए व्यक्ति को दर्शाता है; मिस्र के विरुद्ध इस सैन्य भविष्यवाणी में आशय भाड़े के सैनिकों से है।
- source_word: בְקִרְבָּהּ
  choice: उसके बीच के
  rationale: यह मिस्र के भीतर तैनात सैनिकों की स्थिति बताता है; हिन्दी में इसे संज्ञा-वाक्यांश के साथ स्वाभाविक रूप से जोड़ा गया है।
- source_word: כְּעֶגְלֵי מַרְבֵּק
  choice: बाड़े में पाले गए बछड़ों के समान
  rationale: מַרְבֵּק ऐसे बाड़े या स्थान का बोध कराता है जहाँ पशुओं को रखकर पाला-पोसा अथवा मोटा किया जाता है। यह अनुवाद मूल चित्र को स्पष्ट रखता है, बिना केवल ‘मोटे’ होने पर बल दिए।
- source_word: הִפְנוּ נָסוּ יַחְדָּו
  choice: मुड़े और एक साथ भाग गए
  rationale: क्रियाओं का मूल क्रम—मुड़ना, फिर भागना—और יַחְדָּו का सामूहिक भाव सुरक्षित रखा गया है।
- source_word: לֹא עָמָדוּ
  choice: वे डटे नहीं रहे
  rationale: शाब्दिक अर्थ ‘वे खड़े नहीं रहे’ है; सैन्य प्रसंग में ‘डटे नहीं रहे’ उसी चित्र को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और ‘सकना’ जोड़कर असमर्थता का अतिरिक्त भाव नहीं लाता।
- source_word: יוֹם אֵידָם
  choice: उनकी विपत्ति का दिन
  rationale: אֵיד विनाशकारी विपत्ति या आपदा को दर्शाता है; ‘विपत्ति’ भविष्यवाणी के गम्भीर न्याय-संदर्भ के अनुकूल है।
- source_word: עֵת פְּקֻדָּתָם
  choice: उनके दण्ड का समय
  rationale: इस न्याय-वाणी में פְּקֻדָּה का दण्डात्मक अर्थ निकटवर्ती ‘विपत्ति के दिन’ के समानांतर प्रमुख है; अन्य सम्भव अर्थ पादटिप्पणी में रखे गए हैं।
theological_decisions:
- issue: न्याय-वाणी में פְּקֻדָּה का अर्थ
  choice: उनके दण्ड का समय
  alternative: उनकी सुधि लेने का समय; उनसे लेखा लेने का समय
  rationale: प्रसंग दण्डात्मक अर्थ का समर्थन करता है, पर शब्द में निरीक्षण, सुधि लेने या लेखा लेने की व्यापक अर्थ-छाया भी है; इसलिए मुख्य पाठ में न्याय का भाव और पादटिप्पणी में वास्तविक वैकल्पिक अर्थ सुरक्षित रखे गए हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘भाड़े के सैनिक’, ‘बाड़े में पाले गए बछड़े’ और ‘डटे नहीं रहे’ सैन्य प्रसंग तथा हिब्रू बिंब को स्पष्ट रखते हैं।
