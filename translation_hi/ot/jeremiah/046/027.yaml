source:
  edition: WLC
  text: וְ֠/אַתָּה אַל תִּירָ֞א עַבְדִּ֤/י יַֽעֲקֹב֙ וְ/אַל תֵּחַ֣ת יִשְׂרָאֵ֔ל כִּ֠י הִנְ/נִ֤י מוֹשִֽׁעֲ/ךָ֙ מֵֽ/רָח֔וֹק וְ/אֶֽת זַרְעֲ/ךָ֖ מֵ/אֶ֣רֶץ שִׁבְיָ֑/ם וְ/שָׁ֧ב יַעֲק֛וֹב וְ/שָׁקַ֥ט וְ/שַׁאֲנַ֖ן וְ/אֵ֥ין מַחֲרִֽיד־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/027.yaml
  text: But as for you[a], do not fear, my servant Jacob, and do not be dismayed, Israel; for behold, I will save you from far away, and your offspring from the land of their captivity. Jacob will return and be quiet and at ease[c][b], with no one to make him afraid.
translation:
  language: hi
  text: परन्तु, हे मेरे सेवक याकूब, तू मत डर; हे इस्राएल,[c] तू हताश मत हो। क्योंकि देख, मैं तुझे दूर से बचाऊँगा,[a] और तेरी सन्तान को उनकी बंधुआई के देश से बचाऊँगा।[b] याकूब लौट आएगा और शान्त और निश्चिन्त रहेगा; उसे डराने वाला कोई न होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मैं तुझे बचा रहा हूँ।’ इब्रानी में यहाँ कृदन्त रूप है, जो निकट या निश्चित कार्य पर बल दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उस देश से जहाँ वे बन्दी हैं।’
    reason: lexical_alternative
  - marker: c
    text: यहाँ ‘याकूब’ और ‘इस्राएल’ वाचा की प्रजा को एक व्यक्ति के रूप में प्रस्तुत करते हैं।
    reason: cultural_note
lexical_decisions:
- source_word: וְאַתָּה
  choice: परन्तु ... तू
  rationale: स्वतन्त्र सर्वनाम और संयोजक आसपास के न्याय-वचनों से एक बलयुक्त विरोधी मोड़ दिखाते हैं; हिन्दी में ‘परन्तु’ और प्रत्यक्ष सम्बोधन इसे स्वाभाविक रूप से व्यक्त करते हैं।
- source_word: אַל תִּירָא
  choice: तू मत डर
  rationale: निषेधात्मक आज्ञा का सीधा, सहज और वर्तमान हिन्दी रूप।
- source_word: עַבְדִּי יַעֲקֹב
  choice: हे मेरे सेवक याकूब
  rationale: वाचागत सम्बोधन और ‘मेरे सेवक’ की सम्बन्धपरक उपाधि दोनों सुरक्षित रहते हैं।
- source_word: וְאַל תֵּחַת
  choice: तू निराश मत हो
  rationale: निफ़अल रूप यहाँ भय से टूट जाने या हताश होने का भाव देता है; ‘निराश मत हो’ समानान्तर आश्वासन में स्वाभाविक है।
- source_word: כִּי הִנְנִי מוֹשִׁיעֲךָ
  choice: क्योंकि देख, मैं तुझे ... बचा रहा हूँ
  rationale: ‘क्योंकि’ आश्वासन का आधार बताता है, ‘देख’ हִנְנִי की बलयुक्त संकेतात्मकता रखता है, और वर्तमान कृदन्त निश्चित अथवा आसन्न उद्धार को खुला रखता है।
- source_word: מֵרָחוֹק
  choice: दूर देश से
  rationale: शाब्दिक अर्थ ‘दूर से’ है; निर्वासन और वापसी के प्रसंग में हिन्दी का ‘दूर देश से’ स्थानिक आशय स्पष्ट करता है, बिना किसी विशेष देश की पहचान जोड़े।
- source_word: וְאֶת זַרְעֲךָ
  choice: और तेरी सन्तान को
  rationale: זֶרַע का सामूहिक वंशज-अर्थ ‘सन्तान’ से स्वाभाविक और संक्षिप्त रूप में व्यक्त होता है।
- source_word: מֵאֶרֶץ שִׁבְיָם
  choice: उनकी बंधुआई के देश से
  rationale: मूल के ‘उनकी’ बहुवचन प्रत्यय और बंधक अवस्था दोनों को निकटता से सुरक्षित रखा गया है।
- source_word: וְשָׁב יַעֲקֹב
  choice: याकूब लौट आएगा
  rationale: שׁוּב यहाँ विस्थापन से वापसी को व्यक्त करता है; भविष्यकाल प्रतिज्ञा के प्रसंग के अनुकूल है।
- source_word: וְשָׁקַט וְשַׁאֲנַן
  choice: शान्त और निश्चिन्त रहेगा
  rationale: दोनों निकटार्थक क्रियाएँ अशान्ति के बाद स्थिर शान्ति और सुरक्षा व्यक्त करती हैं; हिन्दी में दो विशेषणों के साथ ‘रहेगा’ सहज है।
- source_word: וְאֵין מַחֲרִיד
  choice: उसे डराने वाला कोई न होगा
  rationale: मूल की अस्तित्व-निषेध रचना और भय उत्पन्न करने वाले किसी व्यक्ति या शक्ति के अभाव को स्पष्ट रखता है।
theological_decisions:
- issue: ‘याकूब’ और ‘इस्राएल’ का सन्दर्भ
  choice: वाचा की प्रजा का पुरुषरूप में सामूहिक व्यक्तिकरण
  alternative: कुलपिता याकूब स्वयं, प्रतीकात्मक व्यक्ति के रूप में
  rationale: निर्वासन से सन्तान की वापसी के इस भविष्यद्वाणी-सन्दर्भ में दोनों नाम समानान्तर रूप से पूरी प्रजा को सम्बोधित करते हैं। अनुवाद व्याख्यात्मक रूप से ‘इस्राएली’ नहीं करता, बल्कि मूल नामों और व्यक्तिकरण को बनाए रखता है।
- issue: מוֹשִׁיעֲךָ में समय और पक्ष
  choice: ‘मैं तुझे ... बचा रहा हूँ’
  alternative: ‘मैं तुझे ... बचाऊँगा’ अथवा ‘मैं तुझे बचाने वाला हूँ’
  rationale: הִנְנִי के साथ कृदन्त आसन्न या निश्चित दिव्य कार्य को वर्तमान रूप में प्रस्तुत करता है। मुख्य पाठ कृदन्तीय रूप रखता है और पादटिप्पणी भविष्यकालीन अर्थ की सम्भावना बताती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, प्रत्यक्ष भविष्यद्वाणी-संबोधन के अनुरूप गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘तू’ मूल के एकवचन सामूहिक सम्बोधन और याकूब/इस्राएल के व्यक्तिकरण को बनाए रखता है; इसका प्रयोग अनादर के लिए नहीं, बल्कि निकट और प्रत्यक्ष वाचागत सम्बोधन के लिए है।
