  yaml_path: translation/ot/jeremiah/046/020.yaml
  text: Egypt is a beautiful heifer; destruction from the north has come[a], it has come.
translation:
  language: hi
  text: 'मिस्र एक सुंदर बछिया है;

    उत्तर से डंक मारने वाली मक्खी आ गई है[a]—

    वह आ गई है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उत्तर से विनाश आ गया है”; यहाँ प्रयुक्त इब्रानी संज्ञा दुर्लभ है और उसका अर्थ अनिश्चित है।
    reason: alternative_reading
lexical_decisions:
- source_word: עֶגְלָה
  choice: बछिया
  rationale: यह शब्द कम उम्र की मादा गाय को दर्शाता है। ‘बछिया’ सहज आधुनिक हिन्दी में स्त्रीलिंग पशु-बिंब को बनाए रखता है।
- source_word: יְפֵה פִיָּה
  choice: सुंदर
  rationale: दोनों विशेषण मिलकर रूप-सौंदर्य पर बल देते हैं। हिन्दी में ‘सुंदर’ स्वाभाविक है और अनावश्यक शब्द-विस्तार के बिना अर्थ व्यक्त करता है।
- source_word: מִצְרָיִם
  choice: मिस्र
  rationale: स्थान और यहाँ स्त्रीरूप में चित्रित राष्ट्र का मानक हिन्दी नाम।
- source_word: קֶרֶץ
  choice: डंक मारने वाली मक्खी
  rationale: दुर्लभ और अनिश्चित संज्ञा का ठोस कीट-संबंधी अर्थ बछिया के बिंब से मेल खाता है। ‘डंक मारने वाली मक्खी’ सामान्य पाठक के लिए स्पष्ट है; ‘विनाश’ वाला व्यापक अर्थ पाद-टिप्पणी में रखा गया है।
- source_word: מִצָּפוֹן
  choice: उत्तर से
  rationale: दिशा-सूचक पद का सीधा और स्वाभाविक अनुवाद; यिर्मयाह में यह प्रायः आक्रमणकारी संकट की दिशा भी बताता है।
- source_word: בָּא בָא
  choice: आ गई है—वह आ गई है
  rationale: दोहराव मूल पाठ की तत्परता और निश्चितता को सुरक्षित रखता है। स्त्रीलिंग क्रिया हिन्दी में ‘मक्खी’ से मेल खाती है।
theological_decisions:
- issue: न्याय-संबंधी रूपक में קֶרֶץ का अर्थ
  choice: बछिया को सताने वाले डंक मारने वाले कीट का ठोस बिंब
  alternative: उत्तर से आने वाला ‘विनाश’ या ‘संकट’
  rationale: ठोस कीट-बिंब पद की काव्यात्मक एकता को बनाए रखता है, पर इब्रानी संज्ञा दुर्लभ और अर्थ की दृष्टि से अनिश्चित है; इसलिए व्यापक अमूर्त अर्थ को पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। पंक्ति-विन्यास काव्यात्मक समानांतरता तथा अंतिम क्रिया के जोरदार दोहराव को उभारता है।
