base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/001.yaml
  text: The word of Yahweh that came to Jeremiah the prophet concerning the nations:[a]
translation:
  language: hi
  text: राष्ट्रों के विषय में यहोवा का वह वचन जो यिर्मयाह नबी के पास आया:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “राष्ट्रों के विरुद्ध।” इब्रानी पूर्वसर्ग सामान्य रूप से विषय को सूचित कर सकता है अथवा इस प्रसंग में उनके विरुद्ध निर्देशित वाणियों का संकेत दे सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: אֲשֶׁר הָיָה
  choice: जो ... आया
  rationale: इब्रानी भविष्यद्वाणी-सूत्र ‘यहोवा का वचन ... के पास आया’ को स्वाभाविक हिन्दी में रखते हुए संबंधवाचक उपवाक्य भी सुरक्षित किया गया है।
- source_word: דְבַר יְהוָה
  choice: यहोवा का ... वचन
  rationale: ‘वचन’ मूल शब्द की औपचारिक और धर्मवैज्ञानिक गंभीरता बनाए रखता है; יהוה को उपाधि से बदलने के बजाय व्यक्तिगत नाम ‘यहोवा’ के रूप में प्रस्तुत किया गया है।
- source_word: אֶל יִרְמְיָהוּ
  choice: यिर्मयाह ... के पास
  rationale: אֶל यहाँ दिव्य वचन पाने वाले व्यक्ति को चिह्नित करता है; भविष्यद्वाणी-संबंधी हिन्दी प्रयोग में ‘के पास आया’ सहज है।
- source_word: הַנָּבִיא
  choice: नबी
  rationale: यिर्मयाह की पदवी को स्पष्ट रूप से रखा गया है। आधुनिक हिन्दी में ‘नबी’ संक्षिप्त, परिचित और स्वाभाविक है।
- source_word: עַל הַגּוֹיִם
  choice: राष्ट्रों के विषय में
  rationale: עַל शीर्षक में सामान्य विषय का परिचय दे सकता है, जबकि आगे के प्रसंग में विरोधात्मक न्यायवाणियाँ हैं। मुख्य पाठ में व्यापक अर्थ रखा गया और ‘विरुद्ध’ को पादटिप्पणी में सुरक्षित किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ के व्यक्तिगत वाचा-नाम को ‘प्रभु’ जैसी उपाधि से नहीं बदला गया। ‘यहोवा’ हिन्दी बाइबलीय परंपरा में व्यापक रूप से पहचाना जाने वाला नामरूप है।
- issue: עַל הַגּוֹיִם का आशय
  choice: राष्ट्रों के विषय में
  alternative: राष्ट्रों के विरुद्ध
  rationale: पूर्वसर्ग सामान्य विषय अथवा संदर्भानुसार विरोध, दोनों व्यक्त कर सकता है। शीर्षक की व्यापकता मुख्य पाठ में और न्यायवाणी का संभावित विरोधात्मक भाव पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। वाक्य को अगले खंड की औपचारिक शीर्षक-पंक्ति जैसा बनाए रखा गया है; अंतिम विराम के रूप में द्विबिंदु आगे आने वाली राष्ट्र-संबंधी वाणियों का संकेत देता है।
