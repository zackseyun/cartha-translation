  text: עֲל֤וּ הַ/סּוּסִים֙ וְ/הִתְהֹלְל֣וּ הָ/רֶ֔כֶב וְ/יֵצְא֖וּ הַ/גִּבּוֹרִ֑ים כּ֤וּשׁ וּ/פוּט֙ תֹּפְשֵׂ֣י מָגֵ֔ן וְ/לוּדִ֕ים תֹּפְשֵׂ֖י דֹּ֥רְכֵי קָֽשֶׁת׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/009.yaml
  text: Go up, O horses, and rage, O chariots; let the warriors go out—Cush and Put, who grasp the shield, and the Ludim, who grasp and bend the bow.
translation:
  language: hi
  text: हे घोड़ो, आगे बढ़ो! हे रथो, उन्मत्त होकर दौड़ो! वीर निकल पड़ें—ढाल थामे हुए कूश और पूत, और धनुष पकड़कर खींचने वाले लूदीम।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲלוּ הַסּוּסִים
  choice: हे घोड़ो, चढ़ दौड़ो
  rationale: עֲלוּ का मूल अर्थ ‘ऊपर चढ़ो/बढ़ो’ है; युद्ध के घोड़ों के संदर्भ में ‘चढ़ दौड़ो’ स्वाभाविक हिन्दी में आगे धावा बोलने की आज्ञा व्यक्त करता है, बिना केवल ‘जाओ’ कर देने के।
- source_word: וְהִתְהֹלְלוּ הָרֶכֶב
  choice: हे रथो, प्रचंड वेग से बढ़ो
  rationale: התהללו का यहाँ अर्थ उन्मत्त अथवा बेकाबू ढंग से दौड़ना है। ‘प्रचंड वेग से बढ़ो’ युद्धगत तीव्रता को स्पष्ट और dignified आधुनिक हिन्दी में रखता है।
- source_word: הַגִּבּוֹרִים
  choice: वीर योद्धा
  rationale: גִּבּוֹרִים युद्ध में पराक्रमी पुरुषों को दर्शाता है; ‘वीर योद्धा’ प्रसंगानुकूल और सहज है।
- source_word: כּוּשׁ וּפוּט
  choice: कूश और पूत के लोग
  rationale: ये जातीय-भौगोलिक नाम हैं। ‘के लोग’ जोड़ने से अगले बहुवचन कृदंत का संबंध हिन्दी पाठक के लिए स्पष्ट होता है।
- source_word: וְלוּדִים
  choice: लूदी लोग
  rationale: जातिनाम को लिप्यंतरित कर बहुवचन समुदाय के रूप में स्वाभाविक हिन्दी दी गई है।
- source_word: תֹּפְשֵׂי דֹּרְכֵי קָשֶׁת
  choice: जो धनुष थामकर चढ़ाते हैं
  rationale: दोनों कृदंत—‘थामने वाले’ और ‘खींचने/चढ़ाने वाले’—को बनाए रखा गया है। ‘धनुष चढ़ाना’ प्रत्यंचा खींचकर उसे चलाने को तैयार करने का स्वाभाविक हिन्दी प्रयोग है।
theological_decisions: []
translation_notes:
  register: युद्ध-आह्वान की ऊर्जस्वी, काव्यात्मक लय को छोटे आज्ञार्थक वाक्यों और विस्मयादिबोधक चिह्नों से रखा गया है। भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट है; जातिनामों का अनावश्यक आधुनिकीकरण नहीं किया गया।
