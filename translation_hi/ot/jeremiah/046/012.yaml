base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/012.yaml
  text: The nations have heard of your shame[a], and your cry has filled the earth; for warrior has stumbled against warrior; together both of them have fallen.
translation:
  language: hi
  text: जातियों ने तेरी लज्जा की खबर सुनी है, और तेरी पुकार ने पृथ्वी[a] भर दी है; क्योंकि योद्धा योद्धा से टकराकर लड़खड़ा गए; वे दोनों एक साथ गिर पड़े।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “देश।” हिब्रू शब्द אֶרֶץ का अर्थ “पृथ्वी” या “देश” दोनों हो सकता है। पिछले वाक्यांश में “जातियों” का उल्लेख होने के कारण यहाँ “पृथ्वी” को मुख्य पाठ में रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְעוּ גוֹיִם
  choice: जातियों ने ... खबर सुनी है
  rationale: שׁמע का पूर्ण रूप पूरी हो चुकी और वर्तमान में प्रासंगिक घटना बताता है। हिन्दी में ‘लज्जा की खबर सुनी है’ स्वाभाविक रूप से यह अर्थ देता है कि मिस्र के अपमान का समाचार जातियों तक पहुँच गया है।
- source_word: קְלוֹנֵךְ
  choice: तेरी लज्जा
  rationale: קָלוֹן सार्वजनिक अपमान, लज्जा या बदनामी को व्यक्त करता है। ‘लज्जा’ संक्षिप्त और गरिमापूर्ण है; स्त्रीलिंग एकवचन सम्बोधन मिस्र की ओर है।
- source_word: וְצִוְחָתֵךְ
  choice: और तेरी चिल्लाहट
  rationale: צְוָחָה संकट में उठी तीखी पुकार को दर्शाता है। ‘चिल्लाहट’ केवल सामान्य पुकार की अपेक्षा युद्ध में मची व्याकुल ध्वनि को अधिक स्पष्ट करता है।
- source_word: מָלְאָה הָאָרֶץ
  choice: से पृथ्वी भर गई है
  rationale: हिब्रू रचना का शाब्दिक भाव ‘पृथ्वी/देश भर गया’ है। हिन्दी में ‘तेरी चिल्लाहट से पृथ्वी भर गई है’ कारण या व्याप्ति को स्वाभाविक रूप से व्यक्त करता है। पहले आए ‘जातियों’ के कारण ‘पृथ्वी’ को मुख्य पाठ में रखा गया है, जबकि ‘देश’ की सम्भावना टिप्पणी में सुरक्षित है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पहले कथन का कारण प्रस्तुत करता है। आधुनिक हिन्दी में ‘क्योंकि’ स्पष्ट और स्वाभाविक संयोजक है।
- source_word: גִבּוֹר בְּגִבּוֹר כָּשָׁלוּ
  choice: योद्धा योद्धा से टकराकर लड़खड़ा गए
  rationale: גִבּוֹר सैन्य प्रसंग में ‘योद्धा’ है। בְּ यहाँ परस्पर टकराने का भाव दे सकता है और כּשל लड़खड़ाने या ठोकर खाने को दर्शाता है; अनुवाद अगले נפל, ‘गिरना,’ से इसका भेद बनाए रखता है। हिब्रू क्रिया बहुवचन है, इसलिए हिन्दी में ‘लड़खड़ा गए’ रखा गया है।
- source_word: יַחְדָּיו נָפְלוּ שְׁנֵיהֶם
  choice: वे दोनों एक साथ गिर पड़े
  rationale: יַחְדָּיו और שְׁנֵיהֶם मिलकर दोनों योद्धाओं के साथ-साथ गिरने पर बल देते हैं। ‘गिर पड़े’ निर्णायक पतन का स्वाभाविक हिन्दी रूप है।
