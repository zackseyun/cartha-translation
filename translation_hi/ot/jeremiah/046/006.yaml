- source_word: יִמָּלֵט
  choice: बच निकले
  rationale: निफ़अल रूप यहाँ युद्ध में विनाश से भागकर बचने का अर्थ देता है; ‘बच निकले’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: הַגִּבּוֹר
  choice: वीर योद्धा
  rationale: यह शब्द बलवान या पराक्रमी व्यक्ति, विशेषतः लड़ाके, को दर्शाता है। युद्ध-संदर्भ में ‘वीर योद्धा’ अर्थ को स्पष्ट करता है।
- source_word: צָפוֹנָה
  choice: उत्तर में
  rationale: दिशासूचक रूप उत्तर की ओर गति या उत्तर में स्थिति—दोनों का संकेत दे सकता है। फरात नदी के साथ भौगोलिक वर्णन होने के कारण मुख्य पाठ में स्थानवाचक अर्थ स्वाभाविक है, जबकि विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: עַל יַד
  choice: के किनारे
  rationale: शाब्दिक रूप से ‘के हाथ/बगल में’ यह भौगोलिक मुहावरा किसी स्थान के पास या साथ-साथ होने को बताता है; नदी के लिए ‘किनारे’ सहज हिन्दी है।
- source_word: נְהַר פְּרָת
  choice: फरात नदी
  rationale: हिन्दी में प्रचलित भौगोलिक नाम और स्वाभाविक शब्दक्रम अपनाया गया है।
- source_word: כָּשְׁלוּ וְנָפָלוּ
  choice: ठोकर खाकर गिर पड़े
  rationale: दोनों पूर्ण क्रियाओं की संक्षिप्त काव्यात्मक शृंखला और पराजय का पूर्ण परिणाम इस स्वाभाविक हिन्दी अभिव्यक्ति में बना रहता है।
