base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/006.yaml
  text: Let not the swift flee[a], and let not the mighty man escape; in the north, by the bank of the Euphrates River[c][b], they have stumbled and fallen.
translation:
  language: hi
  text: तेज़ दौड़नेवाला न भागे, और बलवान पुरुष[c] न बच निकले; उत्तर में[a], फरात नदी के किनारे[b], वे ठोकर खाकर गिर पड़े।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उत्तर की ओर’ अथवा ‘उत्तर को।’ इब्रानी रूप צָפוֹנָה दिशा और स्थान—दोनों अर्थों में समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ ‘फरात नदी के हाथ के पास’ है; यह इब्रानी मुहावरा नदी के पास या उसके किनारे को दर्शाता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘योद्धा।’ इब्रानी גִּבּוֹר बलवान या पराक्रमी पुरुष के लिए, और प्रायः योद्धा के लिए भी, प्रयुक्त होता है।
    reason: lexical_alternative
