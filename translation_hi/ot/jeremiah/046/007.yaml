lexical_decisions:
- source_word: מִי זֶה
  choice: यह कौन है
  rationale: प्रश्नवाचक מִי और संकेतवाचक זֶה मिलकर एक सजीव आलंकारिक प्रश्न बनाते हैं। ‘यह कौन है’ आधुनिक हिन्दी में स्वाभाविक है और उसकी नाटकीयता बनाए रखता है।
- source_word: כַּיְאֹר
  choice: नील नदी की तरह
  rationale: יְאֹר का सामान्य अर्थ ‘नदी’ हो सकता है, पर मिस्र-विषयक इस भविष्यवाणी में इसका स्वाभाविक संकेत नील नदी की ओर है।
- source_word: יַעֲלֶה
  choice: चढ़ता आता है
  rationale: עלה का अर्थ ऊपर आना या उठना है। ‘चढ़ता आता है’ बाढ़ के बढ़ते जल और आगे बढ़ती शक्ति—दोनों की काव्यात्मक छवि को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כַּנְּהָרוֹת
  choice: नदियों की तरह
  rationale: बहुवचन נְהָרוֹת को बहुवचन ‘नदियों’ के रूप में रखा गया है और तुलना को अनिर्दिष्ट रहने दिया गया है।
- source_word: יִתְגָּעֲשׁוּ
  choice: उमड़ता है
  rationale: געש का हित्पएल रूप अशांत, उफनती या उमड़ती गति दर्शाता है। ‘उमड़ता’ जल की तीव्र गति को स्पष्ट करता है, बिना केवल ध्वनि पर बल दिए।
- source_word: מֵימָיו
  choice: जिसका जल
  rationale: मूल में प्रत्यय एकवचन पुंल्लिंग है—शाब्दिक रूप से ‘उसका जल’। ‘जिसका जल’ इसे पहले पूछे गए व्यक्तित्व से जोड़ता है और हिन्दी में काव्यात्मक चित्र को सहज रखता है।
