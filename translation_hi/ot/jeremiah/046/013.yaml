reference: Jeremiah 46:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הַ/דָּבָר֙ אֲשֶׁ֣ר דִּבֶּ֣ר יְהוָ֔ה אֶֽל יִרְמְיָ֖הוּ הַ/נָּבִ֑יא לָ/ב֗וֹא נְבֽוּכַדְרֶאצַּר֙ מֶ֣לֶךְ בָּבֶ֔ל לְ/הַכּ֖וֹת אֶת אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/013.yaml
  text: The word that Yahweh spoke to Jeremiah the prophet about the coming of Nebuchadnezzar king of Babylon to strike the land of Egypt:[a]
translation:
  language: hi
  text: 'वह वचन जो याहवे ने यिर्मयाह भविष्यद्वक्ता से बाबेल के राजा नबूकदनेस्सर[a] के मिस्र देश पर आक्रमण करने के लिए आने के विषय में कहा:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ में नाम की वर्तनी “नबूकदरेस्सर” के अधिक निकट है; हिन्दी में इसे परंपरागत रूप से “नबूकदनेस्सर” कहा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּבָר
  choice: वह वचन
  rationale: भविष्यवाणी की भूमिका में דָּבָר के पारंपरिक और गरिमापूर्ण अर्थ को बनाए रखता है; यहाँ यह परमेश्वर से प्राप्त संदेश को सूचित करता है।
- source_word: דִּבֶּר
  choice: कहा
  rationale: יְהוָה कर्ता और यिर्मयाह संबोधित व्यक्ति हैं; आधुनिक हिन्दी में 'से ... कहा' स्वाभाविक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण से प्रस्तुत किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: הַנָּבִיא
  choice: भविष्यद्वक्ता
  rationale: यिर्मयाह के पद और कार्य की पहचान कराने वाला स्वाभाविक हिन्दी बाइबलीय पद है।
- source_word: לָבוֹא
  choice: के आने ... के विषय में
  rationale: लामेद सहित infinitive construct को वचन की विषयवस्तु के रूप में लिया गया है और उसकी भावी/प्रत्याशित दिशा बनाए रखी गई है।
- source_word: נְבוּכַדְרֶאצַּר
  choice: नबूकदनेस्सर
  rationale: आधुनिक हिन्दी पाठकों के लिए प्रचलित नाम-रूप चुना गया है; मूल इब्रानी वर्तनी के अधिक निकट रूप को पाद-टिप्पणी में सुरक्षित रखा गया है।
- source_word: מֶלֶךְ בָּבֶל
  choice: बाबेल का राजा
  rationale: इब्रानी construct chain का सीधा और स्वाभाविक हिन्दी अनुवाद।
- source_word: לְהַכּוֹת
  choice: आक्रमण करने
  rationale: נכה यहाँ पूरे मिस्र देश को कर्म बनाकर सैन्य प्रहार सूचित करता है; 'आक्रमण करना' आधुनिक हिन्दी में इस प्रसंग का स्वाभाविक अर्थ देता है, बिना अंतिम विजय को अनिवार्य रूप से व्यक्त किए।
- source_word: אֶרֶץ מִצְרָיִם
  choice: मिस्र देश
  rationale: אֶרֶץ को बनाए रखते हुए प्रादेशिक बल को स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम सीधे उपस्थित है। उसे 'प्रभु' जैसी उपाधि से बदलने के बजाय हिन्दी में व्यापक रूप से पहचाने जाने वाले नाम-रूप 'यहोवा' से प्रस्तुत किया गया है।
- issue: לָבוֹא और לְהַכּוֹת का संबंध
  choice: राजा के आने और मिस्र पर आक्रमण करने—दोनों को वचन की विषयवस्तु के रूप में व्यक्त किया
  alternative: राजा का मिस्र पर आक्रमण करने के लिए आना
  rationale: इब्रानी वाक्यरचना में दोनों infinitive constructions के बीच संबंध संक्षिप्त है। समन्वयी हिन्दी मूल की कुछ अस्पष्टता बनाए रखती है और उद्देश्य-संबंध को आवश्यकता से अधिक निश्चित नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यवाणी-भूमिका। 'वह वचन जो...' मूल की शीर्षकीय संरचना को बनाए रखता है; 'आक्रमण' सैन्य प्रसंग को सामान्य पाठक के लिए स्पष्ट करता है।
