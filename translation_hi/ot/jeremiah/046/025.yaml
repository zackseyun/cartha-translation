source:
  edition: WLC
  text: אָמַר֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל הִנְ/נִ֤י פוֹקֵד֙ אֶל אָמ֣וֹן מִ/נֹּ֔א וְ/עַל פַּרְעֹה֙ וְ/עַל מִצְרַ֔יִם וְ/עַל אֱלֹהֶ֖י/הָ וְ/עַל מְלָכֶ֑י/הָ וְ/עַ֨ל פַּרְעֹ֔ה וְ/עַ֥ל הַ/בֹּטְחִ֖ים בּֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/025.yaml
  text: 'Yahweh of hosts[a], the God of Israel, says: Behold, I am about to punish Amon of No, and Pharaoh, and Egypt, and her gods, and her kings, and Pharaoh[b], and those who trust in him.'
translation:
  language: hi
  text: 'सेनाओं का यहोवा, इस्राएल का परमेश्वर, यों कहता है: “देखो, मैं नो के आमोन, फ़िरौन, मिस्र, उसके देवताओं, उसके राजाओं, फ़िरौन और उस पर भरोसा करनेवालों को दण्ड देने जा रहा हूँ।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का यहोवा
  rationale: परमेश्वर के वाचा-सूचक नाम को ‘यहोवा’ के रूप में रखा गया है और צְבָאוֹת का अनुवाद ‘सेनाओं’ किया गया है, जिससे उसकी स्वर्गीय और पृथ्वी की समस्त शक्तियों पर प्रभुता का व्यापक भाव बना रहता है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल का परमेश्वर
  rationale: यह इब्रानी संबंधवाचक पदबंध का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: הִנְנִי פוֹקֵד
  choice: देखो, मैं ... दण्ड देने जा रहा हूँ
  rationale: ‘देखो’ भविष्यवाणी की गंभीरता और निकटता प्रकट करता है; इस न्याय-संदर्भ में פקד का अर्थ किसी को लेखा देने के लिए बुलाना अथवा दण्ड देना है।
- source_word: אָמֹון מִנֹּא
  choice: नो के आमोन
  rationale: यह पद मिस्री देवता आमोन को ‘नो’ नगर से संबद्ध करता है। मूल स्थान-नाम को मुख्य पाठ में रखा गया है और ‘थीब्स’ की पहचान टिप्पणी में दी गई है।
- source_word: וְעַל פַּרְעֹה וְעַל מִצְרַיִם
  choice: फ़िरौन, मिस्र
  rationale: פקד के बाद אֶל और עַל न्याय के पात्रों को प्रस्तुत करते हैं। हिन्दी में ‘दण्ड देना’ क्रिया के साथ प्रत्येक पद के बाद परसर्ग दोहराने की आवश्यकता नहीं है।
- source_word: אֱלֹהֶיהָ וְעַל מְלָכֶיהָ
  choice: उसके देवताओं और उसके राजाओं
  rationale: स्त्रीलिंग प्रत्यय मिस्र की ओर संकेत करते हैं। हिन्दी में ‘मिस्र’ के अनुसार स्वाभाविक सर्वनाम ‘उसके’ है; देवताओं और शासकों की बहुलता सुरक्षित रखी गई है।
- source_word: וְעַל פַּרְעֹה וְעַל הַבֹּטְחִים בּוֹ
  choice: हाँ, फ़िरौन और उस पर भरोसा रखनेवालों को
  rationale: फ़िरौन की पुनरावृत्ति मूल पाठ में बल पैदा करती है, इसलिए उसे हटाया नहीं गया। ‘हाँ’ और विराम-चिह्न हिन्दी में इस पुनरारंभ को स्पष्ट करते हैं।
theological_decisions:
- issue: בּוֹ (‘उस पर’) के सर्वनाम का संदर्भ
  choice: 'मुख्य पाठ में निकटतम पुल्लिंग एकवचन पूर्वपद फ़िरौन की ओर संकेत प्रमुख है: ‘फ़िरौन और उस पर भरोसा रखनेवालों को।’'
  alternative: 'यह सर्वनाम व्यापक संदर्भ में मिस्र की ओर भी संकेत कर सकता है: ‘मिस्र पर भरोसा रखनेवाले।’'
  rationale: मूल पाठ में इस पदबंध के ठीक पहले फ़िरौन दोहराया गया है, इसलिए वही अधिक निकट और व्याकरणतः सहज संदर्भ है। फिर भी मिस्र पूरे न्याय-वचन का प्रमुख विषय है, अतः दूसरा अर्थ सम्भव है और टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गंभीर, भविष्यवाणी-संगत और सामान्य पाठकों के लिए सुबोध रूप अपनाया गया है। सूची की संचयी गति तथा मूल में फ़िरौन की जानबूझकर की गई पुनरावृत्ति बनाए रखी गई है। ‘नो’ जैसे कम परिचित सांस्कृतिक नाम को बदलने के बजाय पाद-टिप्पणी में समझाया गया है।
