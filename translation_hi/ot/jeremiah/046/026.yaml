source:
  edition: WLC
  text: וּ/נְתַתִּ֗י/ם בְּ/יַד֙ מְבַקְשֵׁ֣י נַפְשָׁ֔/ם וּ/בְ/יַ֛ד נְבֽוּכַדְרֶאצַּ֥ר מֶֽלֶךְ בָּבֶ֖ל וּ/בְ/יַד עֲבָדָ֑י/ו וְ/אַחֲרֵי כֵ֛ן תִּשְׁכֹּ֥ן כִּֽ/ימֵי קֶ֖דֶם נְאֻם יְהוָֽה־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/026.yaml
  text: And I will give them into the hand of those who seek their life[a], and into the hand of Nebuchadnezzar king of Babylon, and into the hand of his servants. But afterward she will dwell as in days of old[b], declares Yahweh.
translation:
  language: hi
  text: मैं उन्हें उन लोगों के हाथ में सौंप दूँगा जो उनके प्राण लेना चाहते हैं[a], और बाबेल के राजा नबूकदनेस्सर[b] के हाथ में, और उसके सेवकों के हाथ में। परन्तु उसके बाद मिस्र पहले के दिनों की तरह फिर बसेगा—याहवे की यह घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “उनके प्राण के खोजी”; अर्थात् जो उन्हें मार डालना चाहते हैं।
    reason: lexical_alternative
  - marker: b
    text: इस पद की इब्रानी वर्तनी का अधिक निकट लिप्यंतरण “नबूकदरेस्सर” है; “नबूकदनेस्सर” परंपरागत नाम-रूप है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתַתִּים
  choice: मैं उन्हें ... के हाथ में कर दूँगा
  rationale: נתן और בְיַד का संयुक्त भाव किसी को दूसरे के अधिकार में सौंपना है। हिन्दी मुहावरा ‘हाथ में कर दूँगा’ मूल की हाथ-वाली छवि और शत्रुतापूर्ण संदर्भ दोनों को बनाए रखता है।
- source_word: מְבַקְשֵׁי נַפְשָׁם
  choice: उनके प्राण के खोजियों
  rationale: मूल इब्रानी का शाब्दिक मुहावरा ‘उनके प्राण को खोजने वाले’ है, जिसका संदर्भगत अर्थ उन्हें मार डालने की ताक में रहने वाले लोग है। मुख्य पाठ में मूल अभिव्यक्ति रखी गई है और अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: נְבוּכַדְרֶאצַּר
  choice: नबूकदनेस्सर
  rationale: आधुनिक हिन्दी बाइबल-पाठकों में परिचित परंपरागत नाम-रूप पठनीयता के लिए रखा गया है; इस पद की इब्रानी वर्तनी के अधिक निकट रूप को पादटिप्पणी में दिया गया है।
- source_word: עֲבָדָיו
  choice: उसके सेवकों
  rationale: राजकीय-सैनिक प्रसंग में עֶבֶד राजा के अधीन सेवकों, अधिकारियों या अनुचरों को व्यापक रूप से सूचित कर सकता है। ‘सेवक’ अनावश्यक रूप से दासत्व या विशिष्ट पद नहीं ठहराता।
- source_word: וְאַחֲרֵי כֵן
  choice: परन्तु उसके बाद
  rationale: यह पद न्याय के वर्णन से भविष्य की पुनर्बहाली की ओर मुड़ता है। ‘परन्तु’ प्रसंगगत विरोध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: תִּשְׁכֹּן
  choice: मिस्र ... फिर बस जाएगा
  rationale: स्त्रीलिंग एकवचन क्रिया का कर्ता मिस्र है। हिन्दी में ‘मिस्र’ सामान्यतः पुल्लिंग व्याकरणिक रूप लेता है; नाम को स्पष्ट करके ‘बस जाएगा’ कहना लक्ष्य-भाषा में स्वाभाविक है और अर्थ को निष्क्रिय ‘बसाया जाएगा’ में नहीं बदलता।
- source_word: כִּימֵי קֶדֶם
  choice: पुराने दिनों की तरह
  rationale: यह पहले जैसी दशा में लौटने को व्यक्त करता है। चुना हुआ रूप सहज आधुनिक हिन्दी में मूल कालगत तुलना बनाए रखता है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: נְאֻם יְהוָה भविष्यद्वक्ताओं का प्रामाणिक उद्घोष-सूत्र है। ‘घोषणा’ उसका भार बनाए रखता है और יְהוָה को व्यक्तिगत वाचा-नाम ‘याहवे’ के रूप में प्रस्तुत किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे आया है। उसका लिप्यंतरण वाचा-नाम को किसी उपाधि में बदले बिना सुरक्षित रखता है।
- issue: תִּשְׁכֹּן में मिस्र का स्त्रीलिंग निरूपण
  choice: मिस्र ... फिर बस जाएगा
  alternative: वह ... फिर बसेगी / मिस्र-भूमि ... फिर बसेगी
  rationale: इब्रानी में मिस्र को स्त्रीलिंग एकवचन से निरूपित किया गया है, पर हिन्दी में ‘मिस्र’ का स्वाभाविक व्याकरणिक लिंग पुल्लिंग है। कृत्रिम स्त्रीलिंग या मूल में न आए ‘भूमि’ को जोड़ने के बजाय संदर्भित नाम स्पष्ट किया गया है; पुनर्बहाली का आशय अक्षुण्ण है।
- issue: מְבַקְשֵׁי נַפְשָׁם में हिंसक आशय
  choice: उनके प्राण के खोजियों
  alternative: उन्हें मार डालने की ताक में रहने वालों
  rationale: इब्रानी मुहावरा जान लेने के इरादे की ओर संकेत करता है, पर मुख्य पाठ में उसकी ठोस ‘प्राण खोजने’ वाली भाषा रखी गई है। स्पष्ट अर्थ पादटिप्पणी में दिया गया है ताकि न तो अस्पष्टता मिटे, न पाठक भ्रमित हो।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। समानांतर ‘के हाथ में’ संरचना मूल की लय और अधिकार में सौंपे जाने की छवि बचाती है। ‘प्राण के खोजियों’ का कुछ असामान्य किंतु समझने योग्य रूप मूल मुहावरे को सुरक्षित रखता है और पादटिप्पणी उसका हिंसक संदर्भ स्पष्ट करती है।
