base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/024.yaml
  text: The daughter of Egypt is put to shame[a]; she is given into the hand of a people from the north.
translation:
  language: hi
  text: मिस्र की बेटी अपमानित की गई है; उसे उत्तर की एक जाति के हाथ में[a] दे दिया गया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “हाथ में”; यह किसी के अधिकार या वश में सौंपे जाने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֹבִישָׁה
  choice: लज्जित हुई है
  rationale: हिफ़ील रूप यहाँ मिस्र की मानवीकृत ‘बेटी’ के अपमानित और पराजित होने को व्यक्त करता है। ‘लज्जित हुई है’ न्याय के भाव को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: בַּת מִצְרָיִם
  choice: मिस्र की बेटी
  rationale: यह किसी राष्ट्र अथवा नगर का भविष्यद्वाणी-साहित्य में प्रयुक्त मानवीकरण है। रूपक को हटाकर केवल ‘मिस्र’ कहना मूल बिंब को खो देता।
- source_word: נִתְּנָה
  choice: दे दी गई है
  rationale: निफ़ाल का स्त्रीलिंग एकवचन निष्क्रिय रूप है और ‘बेटी’ से मेल खाता है। यह किसी दूसरे के अधिकार में सौंपे जाने का भाव व्यक्त करता है।
- source_word: בְּיַד
  choice: हाथ में
  rationale: मूल के ‘हाथ’ वाले मुहावरे को मुख्य पाठ में रखा गया है; यहाँ इसका आशय किसी के अधिकार या वश में दे दिए जाने से है।
- source_word: עַם צָפוֹן
  choice: उत्तर दिशा से आनेवाली एक जाति
  rationale: इब्रानी पद का अर्थ अनिश्चित रूप से उत्तर से आनेवाले एक जनसमूह से है। ‘एक जाति’ इस अनिश्चित सामूहिक अर्थ को रखता है और उसकी ऐतिहासिक पहचान को पाठ में नहीं जोड़ता।
theological_decisions:
- issue: उत्तर से आनेवाली जाति की ऐतिहासिक पहचान स्पष्ट करना
  choice: मूल पाठ की तरह इसे ‘उत्तर दिशा से आनेवाली एक जाति’ ही रखा गया है।
  alternative: मुख्य पाठ में उसकी पहचान बाबेल अथवा बाबेली सेना के रूप में करना।
  rationale: इब्रानी पाठ इस पद में केवल उत्तर से आनेवाली एक जाति कहता है। संभावित ऐतिहासिक पहचान को अनुवाद में जोड़ना मूल की अभिव्यक्ति को आवश्यकता से अधिक निश्चित कर देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज हिन्दी में रखी गई है। ‘मिस्र की बेटी’ का भविष्यद्वाणी-संबंधी मानवीकरण तथा ‘हाथ में’ का इब्रानी मुहावरा सुरक्षित रखा गया है; मुहावरे का अर्थ पाद-टिप्पणी में स्पष्ट किया गया है।
