id: JER.46.23
reference: Jeremiah 46:23
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כָּרְת֤וּ יַעְרָ/הּ֙ נְאֻם יְהוָ֔ה כִּ֖י לֹ֣א יֵֽחָקֵ֑ר כִּ֤י רַבּוּ֙ מֵֽ/אַרְבֶּ֔ה וְ/אֵ֥ין לָ/הֶ֖ם מִסְפָּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/023.yaml
  text: They have cut down her forest[a], declares Yahweh, though it cannot be searched out, because they are more numerous than locusts, and they are without number.
translation:
  language: hi
  text: उन्होंने उसका वन काट डाला है—याहवे की यह घोषणा है—हालाँकि उसकी थाह नहीं पाई जा सकती।[a] क्योंकि वे टिड्डियों से भी अधिक हैं, और उनकी कोई गिनती नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि उसकी थाह नहीं पाई जा सकती।” इब्रानी संयोजक का अर्थ कारणसूचक (“क्योंकि”) या रियायती (“हालाँकि”) हो सकता है; प्रसंग में मुख्य पाठ ने रियायती अर्थ अपनाया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּרְתוּ
  choice: उन्होंने…काट डाला है
  rationale: כרת के काल पक्ष और काट गिराने की पूर्ण क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है; प्रसंग में यह आक्रमणकारियों की निश्चित कार्रवाई को चित्रित करता है।
- source_word: יַעְרָהּ
  choice: उसका वन
  rationale: יַעַר का मूल अर्थ ‘वन’ है। स्त्रीलिंग प्रत्यय मिस्र की ओर संकेत करता है; हिन्दी में ‘उसका’ इस संदर्भ को स्वाभाविक रूप से बनाए रखता है।
- source_word: נְאֻם יְהוָה
  choice: याहवे की यह घोषणा है
  rationale: भविष्यद्वाणी के गंभीर और अधिकारपूर्ण सूत्र को स्पष्ट, आधुनिक हिन्दी में व्यक्त करता है और יְהוָה को व्यक्तिगत नाम ‘याहवे’ के रूप में रखता है।
- source_word: כִּי לֹא יֵחָקֵר
  choice: हालाँकि उसकी थाह नहीं पाई जा सकती
  rationale: חקר के निफ़अल रूप का आशय खोजकर सीमा या विस्तार जान पाने से है। ‘थाह नहीं पाई जा सकती’ वन के अगम अथवा अपरिमेय विस्तार को सहज हिन्दी में व्यक्त करता है।
- source_word: רַבּוּ מֵאַרְבֶּה
  choice: वे टिड्डियों से भी अधिक हैं
  rationale: רבה की बहुलता और מִן की तुलना को बनाए रखते हुए आक्रमणकारियों की संख्या को विनाशकारी टिड्डी-दल से तुलना करता है।
- source_word: וְאֵין לָהֶם מִסְפָּר
  choice: उनकी कोई गिनती नहीं है
  rationale: शाब्दिक भाव ‘उनके लिए कोई संख्या नहीं’ को स्वाभाविक हिन्दी मुहावरे में प्रस्तुत करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत वाचा-नाम सीधे आया है; ‘याहवे’ नाम को पदवी से बदले बिना लिप्यंतरित करता है।
- issue: पहले כִּי का संबंध
  choice: 'रियायती अर्थ: ‘हालाँकि’'
  alternative: 'कारणसूचक अर्थ: ‘क्योंकि/चूँकि’'
  rationale: 'प्रसंग में विरोधाभास प्रभावी है: वन की थाह नहीं पाई जा सकती, फिर भी आक्रमणकारी उसे काट डालते हैं। किंतु इब्रानी संयोजक कारणसूचक भी समझा जा सकता है, इसलिए विकल्प पादटिप्पणी में रखा गया है।'
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘वन’, ‘थाह’ और ‘टिड्डियाँ’ मूल रूपक तथा उसकी व्यापकता और विनाशकारी छवि को बनाए रखते हैं।
