  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। ऐतिहासिक नामों का लिप्यंतरण मूल हिब्रू के निकट है; वाक्य की शीर्षकीय संरचना और सेना से संबंधित संबंधवाचक उपवाक्य सुरक्षित रखे गए हैं।
