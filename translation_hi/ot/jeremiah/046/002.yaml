source:
  edition: WLC
  text: לְ/מִצְרַ֗יִם עַל חֵ֨יל פַּרְעֹ֤ה נְכוֹ֙ מֶ֣לֶךְ מִצְרַ֔יִם אֲשֶׁר הָיָ֥ה עַל נְהַר פְּרָ֖ת בְּ/כַרְכְּמִ֑שׁ אֲשֶׁ֣ר הִכָּ֗ה נְבֽוּכַדְרֶאצַּר֙ מֶ֣לֶךְ בָּבֶ֔ל בִּ/שְׁנַת֙ הָֽ/רְבִיעִ֔ית לִ/יהוֹיָקִ֥ים בֶּן יֹאשִׁיָּ֖הוּ מֶ֥לֶךְ יְהוּדָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/002.yaml
  text: 'Concerning Egypt: concerning the army of Pharaoh Neco king of Egypt[a], which was by the Euphrates River at Carchemish, which Nebuchadnezzar king of Babylon struck down in the fourth year of Jehoiakim son of Josiah[b], king of Judah.'
translation:
  language: hi
  text: 'मिस्र के विषय में[a]: मिस्र के राजा फ़िरौन नको की सेना के विषय में, जो करकमिश में फरात नदी के पास थी और जिसे बाबेल के राजा नबूकदरेस्सर[b] ने यहूदा के राजा योशियाह के पुत्र यहोयाकीम के चौथे वर्ष में पराजित किया था।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शीर्षक में प्रयुक्त हिब्रू पद का अनुवाद “मिस्र के विरुद्ध” भी हो सकता है। यहाँ “मिस्र के विषय में” रखा गया है, क्योंकि यह वचन भविष्यवाणी के विषय का परिचय देता है।
    reason: alternative_reading
  - marker: b
    text: यहाँ हिब्रू नामरूप “नबूकदरेस्सर” के निकट है; हिन्दी बाइबल परंपरा में “नबूकदनेस्सर” रूप भी प्रचलित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמִצְרַיִם
  choice: मिस्र के विषय में
  rationale: भविष्यवाणी के शीर्षक में לְ विषय का परिचय दे सकता है। यह चयन व्यापक शीर्षकीय अर्थ रखता है, जबकि विरोध का संभावित अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: עַל חֵיל
  choice: सेना के विषय में
  rationale: עַל यहाँ विषय का परिचय देता है और חֵיל सैन्य बल को दर्शाता है; आधुनिक हिन्दी में ‘सेना’ स्पष्ट और स्वाभाविक है।
- source_word: פַּרְעֹה נְכוֹ
  choice: फ़िरौन नको
  rationale: यह हिब्रू नाम के स्वरूप का निकट और हिन्दी में सुबोध लिप्यंतरण है।
- source_word: אֲשֶׁר הָיָה עַל נְהַר פְּרָת
  choice: जो ... फरात नदी के पास थी
  rationale: स्थानवाचक עַל को ‘पास’ कहना नदी के निकट सेना की स्थिति को स्वाभाविक हिन्दी में व्यक्त करता है, बिना उसे नदी के ऊपर बताने के।
- source_word: בְּכַרְכְּמִשׁ
  choice: करकमिश में
  rationale: בְּ स्थान सूचित करता है; हिन्दी में नगर अथवा युद्धस्थल के लिए ‘में’ सहज है।
- source_word: הִכָּה
  choice: पराजित किया
  rationale: נכה का सैन्य प्रसंग में अर्थ मारना अथवा परास्त करना हो सकता है। यहाँ सेना और ऐतिहासिक युद्ध के संदर्भ में ‘पराजित किया’ स्पष्ट है, पर क्रिया के परिणाम को अनावश्यक रूप से संहार तक नहीं बढ़ाता।
- source_word: נְבוּכַדְרֶאצַּר
  choice: नबूकदरेस्सर
  rationale: यह पाठ में उपस्थित हिब्रू नामरूप के अधिक निकट है; हिन्दी पाठकों में प्रचलित वैकल्पिक रूप पादटिप्पणी में दिया गया है।
- source_word: בִּשְׁנַת הָרְבִיעִית לִיהוֹיָקִים
  choice: यहोयाकीम के चौथे वर्ष में
  rationale: यह राजकीय तिथि-सूत्र का स्वाभाविक हिन्दी रूप है और हिब्रू में निहित संबंध को यथावत रखता है।
