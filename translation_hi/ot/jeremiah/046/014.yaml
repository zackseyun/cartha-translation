id: JER.46.14
reference: Jeremiah 46:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הַגִּ֤ידוּ בְ/מִצְרַ֨יִם֙ וְ/הַשְׁמִ֣יעוּ בְ/מִגְדּ֔וֹל וְ/הַשְׁמִ֥יעוּ בְ/נֹ֖ף וּ/בְ/תַחְפַּנְחֵ֑ס אִמְר֗וּ הִתְיַצֵּב֙ וְ/הָכֵ֣ן לָ֔/ךְ כִּֽי אָכְלָ֥ה חֶ֖רֶב סְבִיבֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/014.yaml
  text: Declare it in Egypt[a], and proclaim it in Migdol; proclaim it in Noph and in Tahpanhes. Say, ‘Take your stand and prepare yourself, for the sword has devoured those around you.’
translation:
  language: hi
  text: मिस्र में इसकी घोषणा करो और मिग्दोल में सुनाओ; नोफ[a] और तहपन्हेस में भी सुनाओ। कहो, ‘अपना मोर्चा सँभाल और अपने आपको तैयार कर, क्योंकि तलवार तेरे चारों ओर जो हैं, उन्हें निगल चुकी है।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: नोफ, मेम्फिस का इब्रानी नाम है।
    reason: पाठ में इब्रानी स्थान-नाम रखा गया है; पादटिप्पणी उसका अधिक परिचित ऐतिहासिक नाम बताती है।
lexical_decisions:
- source_word: הַגִּידוּ
  choice: घोषणा करो
  rationale: हिफ़ील बहुवचन आज्ञार्थक सार्वजनिक रूप से बात प्रकट करने का भाव देता है; ‘घोषणा करो’ वर्तमान, गरिमापूर्ण और उद्घोषणात्मक है।
- source_word: וְהַשְׁמִיעוּ
  choice: इसका प्रचार करो
  rationale: हिफ़ील आज्ञार्थक का अर्थ यहाँ संदेश को सार्वजनिक रूप से सुनाना है। दोनों आवृत्तियों में एक ही अनुवाद पुनरुक्ति को बनाए रखता है; ‘इसका’ हिन्दी में निहित संदेश को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְמִצְרַיִם
  choice: मिस्र में
  rationale: בְ यहाँ स्थानवाचक है; सीधा और स्वाभाविक अनुवाद।
- source_word: בְמִגְדּוֹל
  choice: मिग्दोल में
  rationale: स्थान-नाम को इब्रानी रूप के आधार पर लिप्यंतरित किया गया है।
- source_word: בְנֹף
  choice: नोफ
  rationale: मुख्य पाठ में इब्रानी स्थान-नाम सुरक्षित रखा गया है; अधिक परिचित ऐतिहासिक नाम ‘मेम्फिस’ पादटिप्पणी में दिया गया है।
- source_word: וּבְתַחְפַּנְחֵס
  choice: और तहपन्हेस में भी
  rationale: स्थान-नाम का इब्रानी से लिप्यंतरण किया गया है; ‘भी’ हिन्दी में समन्वित स्थान-सूची को सहज बनाता है।
- source_word: אִמְרוּ
  choice: कहो
  rationale: सरल बहुवचन आज्ञार्थक, जो आगे के उद्धृत आदेश का परिचय देता है।
- source_word: הִתְיַצֵּב
  choice: अपना मोर्चा सँभाल
  rationale: हित्पएल आज्ञार्थक स्वयं को स्थिति में खड़ा करने अथवा युद्ध के लिए स्थान लेने का भाव देता है। सैन्य प्रसंग में यह स्वाभाविक हिन्दी है और केवल ‘दृढ़ खड़ा रह’ से अधिक तत्परता व्यक्त करता है।
- source_word: וְהָכֵן לָךְ
  choice: अपने आपको तैयार कर
  rationale: לָךְ के आत्मवाचक भाव तथा एकवचन संबोधन को स्पष्ट रूप से बनाए रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: आदेश का कारण प्रस्तुत करता है।
- source_word: אָכְלָה חֶרֶב
  choice: तलवार ने ... निगल लिया है
  rationale: पूर्ण क्रिया और तलवार के सजीव रूपक को सुरक्षित रखता है; वर्तमान पूर्ण काल विनाश के घटित अथवा निश्चित रूप से आ पहुँचे होने का भाव देता है।
- source_word: סְבִיבֶיךָ
  choice: तेरे चारों ओर
  rationale: मसोरेटिक पाठ में कोई व्यक्त वस्तु स्पष्ट नहीं है; स्थानवाचक ‘तेरे चारों ओर’ मूल की खुली अभिव्यक्ति को सुरक्षित रखता है। हिन्दी वाक्य के लिए ‘सब कुछ’ की पूर्ति की गई है, जो आसपास के व्यापक विनाश को व्यक्त करती है।
theological_decisions:
- issue: उद्धृत आदेश में संबोधन के वचन का परिवर्तन
  choice: एकवचन ‘सँभाल’, ‘कर’ और ‘तेरे’ रखा गया है, जिससे मिस्र को सामूहिक/मानवीकृत एकवचन के रूप में संबोधन सुनाई देता है।
  alternative: पहले के बहुवचन आदेशों के अनुरूप उद्धरण को भी बहुवचन में कर देना, या इसे किसी एक नगर/सैन्य दल का संबोधन मानना।
  rationale: इब्रानी पाठ बहुवचन प्रचारकों से एकवचन संबोधित पात्र की ओर स्पष्ट रूप से मुड़ता है; इस तनाव को समतल नहीं किया गया।
- issue: אָכְלָה का काल-पक्ष
  choice: ‘निगल लिया है’
  alternative: ‘निगल लिया’ अथवा ‘निगल लेगी’
  rationale: भविष्यवाणी के प्रसंग में इब्रानी पूर्ण क्रिया पूर्ण घटना या निश्चित, आसन्न घटना दोनों का संकेत दे सकती है। हिन्दी वर्तमान पूर्ण विनाश के परिणाम को सामने रखते हुए इसे केवल भविष्य में सीमित नहीं करता।
- issue: סְבִיבֶיךָ के निहित कर्म का अनुवाद
  choice: ‘तेरे चारों ओर सब कुछ’
  alternative: ‘तेरे आस-पास के लोगों को’ अथवा केवल ‘तेरे चारों ओर’
  rationale: मूल में ‘लोग’ या ‘पड़ोसी’ व्यक्त नहीं है। ‘सब कुछ’ हिन्दी में क्रिया का कर्म पूरा करता है, पर किसी विशिष्ट समूह को अनावश्यक रूप से निर्धारित नहीं करता और व्यापक आसपास के विनाश को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण भविष्यवाणी-संबंधी स्वर रखा गया है। नगरों के नाम इब्रानी के निकट लिप्यंतरित हैं। सार्वजनिक उद्घोषणा की पुनरावृत्ति और उद्धरण में अचानक आए एकवचन संबोधन दोनों सुरक्षित रखे गए हैं।
