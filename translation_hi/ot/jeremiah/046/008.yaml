source:
  edition: WLC
  text: מִצְרַ֨יִם֙ כַּ/יְאֹ֣ר יַֽעֲלֶ֔ה וְ/כַ/נְּהָר֖וֹת יִתְגֹּ֣עֲשׁוּ מָ֑יִם וַ/יֹּ֗אמֶר אַֽעֲלֶה֙ אֲכַסֶּה אֶ֔רֶץ אֹבִ֥ידָה עִ֖יר וְ/יֹ֥שְׁבֵי בָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/008.yaml
  text: Egypt rises like the Nile[a], and its waters surge like rivers. It says, ‘I will rise, I will cover the earth; I will destroy the city and those who dwell in it.’
translation:
  language: hi
  text: मिस्र नील नदी के समान चढ़ता है, और उसका जल नदियों के समान उमड़ता है। वह कहता है, “मैं चढ़ूँगा, पृथ्वी को ढक लूँगा[a]; मैं नगर और उसमें रहने वालों को नष्ट कर दूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “देश को ढक लूँगा।” हिब्रू शब्द אֶרֶץ का अर्थ “पृथ्वी” या “देश” दोनों हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִצְרַיִם
  choice: मिस्र
  rationale: आधुनिक मानक हिन्दी में देश का प्रचलित नाम; सन्दर्भ में राष्ट्र को मानवीकृत किया गया है।
- source_word: כַּיְאֹר
  choice: नील नदी के समान
  rationale: मिस्र के सन्दर्भ में יְאֹר विशेष रूप से नील नदी को सूचित करता है; ‘नदी’ जोड़ने से सामान्य पाठक के लिए अर्थ तुरन्त स्पष्ट होता है।
- source_word: יַעֲלֶה / אַעֲלֶה
  choice: चढ़ता है / मैं चढ़ूँगा
  rationale: एक ही हिब्रू धातु की पुनरावृत्ति बनाए रखी गई है। ‘चढ़ना’ बाढ़ के उठने और सेना के आगे बढ़ने—दोनों बिम्बों के अनुकूल है।
- source_word: וְכַנְּהָרוֹת יִתְגֹּעֲשׁוּ מָיִם
  choice: और उसका जल नदियों के समान उमड़ता है
  rationale: ‘उमड़ता है’ जल की अशान्त, प्रबल गति व्यक्त करता है। एकवचन ‘जल’ मूल के מָיִם का स्वाभाविक हिन्दी रूप है, और ‘उसका’ मिस्र/नील के बिम्ब से सम्बन्ध स्पष्ट करता है।
- source_word: וַיֹּאמֶר
  choice: वह कहता है
  rationale: मिस्र को बोलने वाले व्यक्तित्व के रूप में प्रस्तुत किया गया है; वर्तमानकालीन रूप कविता की सजीवता बनाए रखता है।
- source_word: אֲכַסֶּה אֶרֶץ
  choice: पृथ्वी को ढक लूँगा
  rationale: אֶרֶץ के व्यापक अर्थ को मुख्य पाठ में रखा गया है, जिससे मिस्र के घमण्डपूर्ण और अतिशयोक्तिपूर्ण दावे की व्यापकता बनी रहती है; ‘देश’ सम्भव विकल्प है।
- source_word: אֹבִידָה
  choice: नष्ट कर दूँगा
  rationale: हिफ़ील रूप के कारणकारी और सैन्य धमकी वाले भाव का स्वाभाविक हिन्दी अनुवाद।
- source_word: עִיר וְיֹשְׁבֵי בָהּ
  choice: नगर और उसमें रहने वालों को
  rationale: मूल का एकवचन ‘नगर’ सुरक्षित रखा गया है; ‘उसमें रहने वाले’ स्पष्ट और वर्तमान हिन्दी में स्वाभाविक है।
