source:
  edition: WLC
  text: כִּי כֹ֣ה אָמַ֣ר יְהוָ֗ה עַל הַ/בָּנִים֙ וְ/עַל הַ/בָּנ֔וֹת הַ/יִּלּוֹדִ֖ים בַּ/מָּק֣וֹם הַ/זֶּ֑ה וְ/עַֽל אִמֹּתָ֞/ם הַ/יֹּלְד֣וֹת אוֹתָ֗/ם וְ/עַל אֲבוֹתָ֛/ם הַ/מּוֹלִדִ֥ים אוֹתָ֖/ם בָּ/אָ֥רֶץ הַ/זֹּֽאת־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/003.yaml
  text: 'For thus says Yahweh concerning the sons and the daughters born in this place[a], and concerning their mothers who bear them[c][b], and their fathers who father them in this land:'
translation:
  language: hi
  text: 'क्योंकि याहवे इस स्थान में जन्मे बेटों और बेटियों के विषय में, उन्हें जन्म देनेवाली उनकी माताओं के विषय में, और इस देश में उन्हें उत्पन्न करनेवाले उनके पिताओं के विषय में यों कहता है:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले पद में दिए गए निषेध का कारण बतानेवाली ईश्वरीय घोषणा आरम्भ करता है।
- source_word: כֹה אָמַר יְהוָה
  choice: याहवे ... यों कहता है
  rationale: भविष्यद्वक्ताओं की मानक संदेशवाहक शैली को स्वाभाविक और गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: הַבָּנִים וְהַבָּנוֹת
  choice: बेटों और बेटियों
  rationale: इब्रानी में स्त्री और पुरुष दोनों को स्पष्ट रूप से अलग-अलग नाम दिया गया है; सामान्य शब्द ‘बच्चों’ से इसे समेटा नहीं गया।
- source_word: הַיִּלּוֹדִים בַּמָּקוֹם הַזֶּה
  choice: इस स्थान में जन्मे
  rationale: कृदन्त के निष्क्रिय अर्थ और स्थान-सूचक वाक्यांश दोनों को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַיֹּלְדוֹת אוֹתָם
  choice: उन्हें जन्म देनेवाली
  rationale: माताओं के लिए प्रयुक्त ילד का अर्थ यहाँ प्रसव करना है।
- source_word: הַמּוֹלִדִים אוֹתָם
  choice: उन्हें उत्पन्न करनेवाले
  rationale: पिताओं के साथ ילד के हिफ़ील रूप का जनक बनने या जन्म का कारण होने का भाव बनाए रखता है।
- source_word: בָּאָרֶץ הַזֹּאת
  choice: इस देश में
  rationale: संदर्भ में אֶרֶץ उस भूभाग या देश को सूचित करता है जहाँ ये लोग रहते और संतान उत्पन्न करते हैं।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में आए परमेश्वर के विशिष्ट वाचा-नाम को उपाधि में बदलने के बजाय उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भविष्यद्वाणी की औपचारिक गरिमा बनाए रखते हुए वाक्य को सामान्य पाठक के लिए सुबोध रखा गया है। ‘बेटों और बेटियों’ की स्पष्ट जोड़ी तथा माता-पिता के लिए प्रयुक्त अलग-अलग जनन-संबंधी क्रियाएँ संरक्षित हैं।
