source:
  edition: WLC
  text: וְ/הֵטַלְתִּ֣י אֶתְ/כֶ֗ם מֵ/עַל֙ הָ/אָ֣רֶץ הַ/זֹּ֔את עַל הָ/אָ֕רֶץ אֲשֶׁר֙ לֹ֣א יְדַעְתֶּ֔ם אַתֶּ֖ם וַ/אֲבֽוֹתֵי/כֶ֑ם וַ/עֲבַדְתֶּם שָׁ֞ם אֶת אֱלֹהִ֤ים אֲחֵרִים֙ יוֹמָ֣ם וָ/לַ֔יְלָה אֲשֶׁ֛ר לֹֽא אֶתֵּ֥ן לָ/כֶ֖ם חֲנִינָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/013.yaml
  text: So I will cast you out from this land onto a land that neither you nor your fathers have known[a], and there you will serve other gods day and night[d][c][b], for I will show you no favor.
translation:
  language: hi
  text: इसलिए मैं तुम्हें इस देश से उठाकर एक ऐसे देश में फेंक दूँगा[a], जिसे न तुमने जाना है, न तुम्हारे पुरखों ने[b]। वहाँ तुम दिन-रात दूसरे देवताओं की सेवा[c] करोगे, क्योंकि मैं तुम पर कोई कृपा[d] नहीं करूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तुम्हें बलपूर्वक निकाल दूँगा।’ इब्रानी क्रिया जोर से फेंकने या निष्कासित करने का भाव रखती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘तुम्हारे पिता’; यहाँ आशय पिछली पितृ-पीढ़ियों से भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘उपासना करोगे।’ इब्रानी क्रिया का सामान्य अर्थ ‘सेवा करना’ है और देवताओं के संदर्भ में इसमें उपासना सम्मिलित हो सकती है।
    reason: lexical_alternative
  - marker: d
    text: या ‘अनुग्रह’ अथवा ‘दया।’ इब्रानी संज्ञा कृपादृष्टि या अनुग्रह का भाव व्यक्त करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵטַלְתִּי
  choice: उठाकर ... फेंक दूँगा
  rationale: हिफ़ील रूप बलपूर्वक फेंकने और देश से निष्कासित करने का भाव देता है। यह अभिव्यक्ति आधुनिक हिन्दी में स्वाभाविक रहते हुए उस कठोरता को बनाए रखती है।
- source_word: מֵעַל הָאָרֶץ הַזֹּאת עַל הָאָרֶץ
  choice: इस देश से ... एक ऐसे देश में
  rationale: यहाँ אֶרֶץ का अर्थ भूभाग या देश है। हिन्दी में ‘से ... में’ स्रोत के दिशात्मक विरोध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֲשֶׁר לֹא יְדַעְתֶּם אַתֶּם וַאֲבוֹתֵיכֶם
  choice: जिसे न तुम जानते थे, न तुम्हारे पुरखे
  rationale: ידע के सामान्य अर्थ ‘जानना’ को रखा गया है। ‘पुरखे’ हिन्दी में पूर्ववर्ती पितृ-पीढ़ियों के लिए सहज और गरिमापूर्ण शब्द है।
- source_word: וַעֲבַדְתֶּם שָׁם
  choice: वहाँ ... सेवा करोगे
  rationale: עבד का मूल अर्थ ‘सेवा करना’ है और देवताओं के संदर्भ में इसमें उपासना भी सम्मिलित हो सकती है। ‘सेवा’ इस व्यापकता और निर्वासन की विडंबना दोनों को सुरक्षित रखती है।
- source_word: אֶת אֱלֹהִים אֲחֵרִים
  choice: दूसरे देवताओं
  rationale: यह प्रचलित इब्रानी पदबंध का सीधा अनुवाद है; ‘विदेशी देवता’ कहना अनावश्यक व्याख्या जोड़ता।
- source_word: יוֹמָם וָלַיְלָה
  choice: दिन-रात
  rationale: मूल मुहावरे को हिन्दी के समान और स्वाभाविक मुहावरे से व्यक्त किया गया है, जो निरंतरता का संकेत देता है।
- source_word: אֲשֶׁר לֹא אֶתֵּן לָכֶם חֲנִינָה
  choice: क्योंकि मैं तुम पर कोई कृपा नहीं करूँगा
  rationale: חֲנִינָה कृपादृष्टि, अनुग्रह या दया का भाव रखता है। ‘कृपा करना’ आधुनिक हिन्दी में स्वाभाविक है और किसी बाद की तकनीकी धर्मवैज्ञानिक संज्ञा को आरोपित नहीं करता। अंतिम אֲשֶׁר को प्रसंगानुसार कारणसूचक माना गया है।
theological_decisions:
- issue: וַאֲבוֹתֵיכֶם का पारिवारिक और पीढ़ीगत आशय
  choice: तुम्हारे पुरखे
  alternative: तुम्हारे पिता / तुम्हारे पूर्वज
  rationale: मूल शब्द का शाब्दिक अर्थ ‘तुम्हारे पिता’ है, पर बहुवचन में यह पिछली पितृ-पीढ़ियों को भी सूचित करता है। ‘पुरखे’ उस ऐतिहासिक-वंशगत अर्थ को स्वाभाविक हिन्दी में बनाए रखता है; शाब्दिक रूप पाद-टिप्पणी में दिया गया है।
- issue: निर्वासन में अन्य देवताओं के प्रति עבד का अर्थ
  choice: दूसरे देवताओं की सेवा करोगे
  alternative: दूसरे देवताओं की उपासना करोगे
  rationale: ‘सेवा’ मूल क्रिया की व्यापकता को सुरक्षित रखती है और यह तय नहीं करती कि कथन स्वेच्छापूर्ण उपासना, बाध्य सांस्कृतिक अधीनता या दोनों की ओर संकेत करता है।
- issue: अंतिम אֲשֶׁר का संबंध
  choice: क्योंकि
  alternative: और वहाँ मैं / ऐसी स्थिति में मैं
  rationale: प्रसंग में इसे कारणसूचक समझना स्वाभाविक है, पर इब्रानी संबंधवाचक कण का संबंध कुछ हद तक खुला है; अनुवाद कथन के न्यायसूचक तर्क को स्पष्ट करता है बिना अतिरिक्त सिद्धांत जोड़े।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘उठाकर ... फेंक दूँगा’ न्याय की कठोरता को व्यक्त करता है; ‘दिन-रात’ मूल की संक्षिप्त लय बनाए रखता है।
