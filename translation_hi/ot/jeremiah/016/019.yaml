base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/019.yaml
  text: O Yahweh[a], my strength and my stronghold, my refuge in the day of distress, to you the nations will come from the ends of the earth and say, “Surely our fathers inherited only lies[b], worthless things in which there is no profit.”
translation:
  language: hi
  text: हे याहवे[a], मेरे बल, मेरे गढ़ और संकट के दिन मेरे शरणस्थान, पृथ्वी के छोरों से राष्ट्र तेरे पास आएँगे और कहेंगे, “निश्चय ही हमारे पूर्वजों ने विरासत में केवल झूठ पाया है—व्यर्थ वस्तुएँ, जिनसे कोई लाभ नहीं।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में परमेश्वर का व्यक्तिगत नाम יהוה (YHWH) है। इसे यहाँ ‘याहवे’ लिखा गया है।
    reason: नामरूप_स्पष्टीकरण
  - marker: b
    text: 'इस वाक्य का अनुवाद यह भी हो सकता है: “हमारे पूर्वजों ने विरासत में केवल झूठ, व्यर्थता और ऐसी वस्तुएँ पाईं जिनसे कोई लाभ नहीं।” ‘व्यर्थ वस्तुएँ’ के मूल इब्रानी शब्द का अर्थ ‘व्यर्थता’, ‘खोखलापन’ या संदर्भानुसार निष्फल मूर्तियाँ भी हो सकता है।'
    reason: शब्दार्थ_और_वाक्यरचना_विकल्प
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी परमेश्वर-नाम को हिन्दी में प्रचलित नामरूप ‘यहोवा’ से व्यक्त किया गया है, न कि उपाधि ‘प्रभु’ से।
- source_word: עֻזִּי
  choice: मेरे बल
  rationale: यह संज्ञा सामर्थ्य या शक्ति बताती है; ‘मेरे बल’ सीधा, स्वाभाविक और काव्यात्मक सम्बोधन है।
- source_word: מָעֻזִּי
  choice: मेरे गढ़
  rationale: यह सुरक्षित दृढ़ स्थान को सूचित करता है; ‘गढ़’ अगले ‘शरणस्थान’ से भेद बनाए रखता है।
- source_word: מְנוּסִי
  choice: मेरे शरणस्थान
  rationale: शब्द उस स्थान का बोध कराता है जहाँ सुरक्षा के लिए भागकर जाया जाता है; ‘शरणस्थान’ इस स्थानगत रूपक को बनाए रखता है।
- source_word: בְּיוֹם צָרָה
  choice: संकट के दिन
  rationale: शाब्दिक कालवाचक रूप को रखते हुए यह विपत्ति के समय का स्वाभाविक हिन्दी वर्णन है।
- source_word: גּוֹיִם
  choice: जातियाँ
  rationale: यहाँ अनेक राष्ट्रों या जनजातीय समुदायों का व्यापक संकेत है; ‘गैर-यहूदी’ अनावश्यक धार्मिक भेद को प्रमुख कर देता।
- source_word: מֵאַפְסֵי אָרֶץ
  choice: पृथ्वी के छोरों से
  rationale: दूरस्थतम प्रदेशों के लिए प्रयुक्त इब्रानी मुहावरे का परिचित हिन्दी समतुल्य।
- source_word: אַךְ
  choice: निश्चय ही
  rationale: यह स्वीकारोक्ति के बल और निश्चितता को व्यक्त करता है, केवल सीमाबोध को नहीं।
- source_word: שֶׁקֶר
  choice: झूठ
  rationale: एकवचन इब्रानी संज्ञा यहाँ सामूहिक भाव में पूर्वजों से मिली मिथ्या परम्परा का बोध कराती है।
- source_word: נָחֲלוּ
  choice: विरासत में ... मिला
  rationale: क्रिया पैतृक विरासत पाने को बताती है; हिन्दी में यह वाक्य-विन्यास स्वाभाविक है और विरासत की विडम्बना बचाता है।
- source_word: אֲבוֹתֵינוּ
  choice: हमारे पुरखों
  rationale: ‘पुरखे’ पैतृक पूर्वजों के लिए स्वाभाविक आधुनिक हिन्दी है और यहाँ बहुवचन पुरुषवाची रूप के अनुकूल है।
- source_word: הֶבֶל
  choice: व्यर्थ वस्तुएँ
  rationale: मूल शब्द शून्यता, निष्फलता या व्यर्थता बताता है; इसे सीधे ‘मूर्तियाँ’ कहना अर्थ को संदर्भानुसार अधिक संकीर्ण कर देता।
- source_word: וְאֵין בָּם מוֹעִיל
  choice: जिनसे कोई लाभ नहीं
  rationale: इब्रानी में इन वस्तुओं के भीतर लाभकारी सामर्थ्य न होने की बात है; यह सरल हिन्दी उसी निष्फलता को व्यक्त करती है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में व्यक्तिगत परमेश्वर-नाम है। हिन्दी बाइबलीय प्रयोग में पहचाना जाने वाला ‘यहोवा’ नाम को नाम के रूप में रखता है; ‘प्रभु’ उसे उपाधि में बदल देता।
- issue: הֶבֶל को मूर्तियों के रूप में स्पष्ट करना या व्यापक रखना
  choice: व्यर्थ वस्तुएँ
  alternative: मूर्तियाँ; व्यर्थता; खोखली वस्तुएँ
  rationale: संदर्भ में झूठी पैतृक उपासना और मूर्तियाँ निहित हो सकती हैं, पर शब्द स्वयं अधिक व्यापक रूप से व्यर्थता और निष्फलता बताता है। मुख्य पाठ इस अर्थगत विस्तार को सुरक्षित रखता है।
- issue: शֶׁקֶר, הֶבֶל और וְאֵין בָּם מוֹעִיל का वाक्यगत संबंध
  choice: ‘झूठ’ के बाद ‘व्यर्थ वस्तुएँ’ को व्याख्यात्मक विस्तार के रूप में रखा
  alternative: 'तीन समन्वित पद: ‘झूठ, व्यर्थता और लाभहीन वस्तुएँ’'
  rationale: इब्रानी की संक्षिप्त, असंधिबद्ध रचना दोनों प्रकार से समझी जा सकती है। मुख्य पाठ ‘व्यर्थ वस्तुएँ, जिनसे कोई लाभ नहीं’ को विरासत में मिले झूठ का विस्तार मानता है, जबकि पादटिप्पणी वैकल्पिक समन्वित पठन सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, प्रार्थनात्मक-काव्यात्मक शैली रखी गई है। ‘गढ़’, ‘शरणस्थान’, ‘संकट के दिन’ और ‘पृथ्वी के छोरों’ जैसे परिचित बाइबलीय रूपक सुरक्षित हैं; अत्यधिक संस्कृतनिष्ठ शब्दावली से बचा गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
