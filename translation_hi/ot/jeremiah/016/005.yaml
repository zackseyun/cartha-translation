source:
  edition: WLC
  text: כִּֽי כֹ֣ה אָמַ֣ר יְהוָ֗ה אַל תָּבוֹא֙ בֵּ֣ית מַרְזֵ֔חַ וְ/אַל תֵּלֵ֣ךְ לִ/סְפּ֔וֹד וְ/אַל תָּנֹ֖ד לָ/הֶ֑ם כִּֽי אָסַ֨פְתִּי אֶת שְׁלוֹמִ֜/י מֵ/אֵ֨ת הָ/עָ֤ם הַ/זֶּה֙ נְאֻם יְהוָ֔ה אֶת הַ/חֶ֖סֶד וְ/אֶת הָֽ/רַחֲמִֽים־׀־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/005.yaml
  text: 'For thus says Yahweh: Do not enter a house of mourning[a], and do not go to mourn or show sympathy for them, for I have taken away my peace from this people[c][b], declares Yahweh—steadfast love and compassion.'
translation:
  language: hi
  text: 'क्योंकि यहोवा यों कहता है: “शोक के घर[a] में प्रवेश मत करना; न विलाप करने के लिए जाना और न उनके प्रति संवेदना प्रकट करना। क्योंकि मैंने इस प्रजा से अपनी शांति[c], अटल प्रेम और करुणा[b] हटा ली है,” यहोवा की यह घोषणा है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “भोज के घर।” इब्रानी शब्द מַרְזֵחַ कुछ संदर्भों में भोज या दावत के स्थान को दर्शाता है, लेकिन यहाँ विलाप और संवेदना का उल्लेख “शोक के घर” के पक्ष में है।
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी वाक्य-विन्यास में अंतिम शब्दों को “अपनी शांति” की व्याख्या के रूप में भी समझा जा सकता है: “अपनी शांति—अटल प्रेम और करुणा।”'
    reason: syntactic_alternative
  - marker: c
    text: यहाँ “शांति” में केवल संघर्ष का न होना ही नहीं, बल्कि कुशलता, संपूर्णता और कल्याण भी सम्मिलित हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के व्यक्तिगत वाचा-नाम का प्रचलित और स्पष्ट लिप्यंतरण।
- source_word: בֵּית מַרְזֵחַ
  choice: शोक का घर
  rationale: מַרְזֵחַ कुछ संदर्भों में भोज-स्थल हो सकता है, पर यहाँ विलाप और संवेदना का निकट संदर्भ शोक-सभा को दर्शाता है।
- source_word: לִסְפּוֹד
  choice: विलाप करने
  rationale: यह मृतक के लिए किए जाने वाले शोक-विलाप को स्पष्ट रूप से व्यक्त करता है।
- source_word: תָּנֹד לָהֶם
  choice: उनके प्रति संवेदना प्रकट करना
  rationale: इस संदर्भ में נוד शोकग्रस्त लोगों के प्रति सांत्वना या सहानुभूति के सामाजिक भाव-प्रदर्शन को सूचित करता है।
- source_word: אָסַפְתִּי אֶת שְׁלוֹמִי
  choice: मैंने ... अपनी शान्ति ... हटा ली है
  rationale: אָסַף यहाँ वापस लेने या दूर कर देने के अर्थ में है; यह अभिव्यक्ति मूल मुहावरे का भाव स्वाभाविक हिन्दी में रखती है।
- source_word: שְׁלוֹמִי
  choice: अपनी शान्ति
  rationale: שָׁלוֹם का मूल अर्थ रखते हुए उसके व्यापक कल्याण और संपूर्णता के भाव को टिप्पणी में स्पष्ट किया गया है।
- source_word: נְאֻם יְהוָה
  choice: यहोवा की यह घोषणा है
  rationale: गंभीर भविष्यद्वक्ताई सूत्र को वर्तमान, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: הַחֶסֶד
  choice: अटल करुणा
  rationale: חֶסֶד में प्रेमपूर्ण निष्ठा और स्थिर कृपा दोनों निहित हैं; यह पदबंध उस संयुक्त भाव को संक्षेप में रखता है।
- source_word: הָרַחֲמִים
  choice: दया
  rationale: अमूर्त बहुवचन רַחֲמִים को सहज हिन्दी में दयाभाव के रूप में प्रस्तुत करता है।
theological_decisions:
- issue: अन्तिम पदबंध में परमेश्वर द्वारा हटाई गई वस्तुओं का सम्बन्ध
  choice: ‘अटल करुणा और दया’ को ‘अपनी शान्ति’ की व्याख्यात्मक समानाधिकरण अभिव्यक्ति माना गया है।
  alternative: 'इसे दोहराई हुई अन्तर्निहित क्रिया के साथ अलग कर्म माना जा सकता है: ‘मैंने ... अपनी अटल करुणा और दया हटा ली है।’'
  rationale: इब्रानी में प्रत्येक पद से पहले אֶת है, इसलिए दोनों संरचनाएँ सम्भव हैं। डैश मूल की संक्षिप्तता और सम्बन्ध की कुछ अस्पष्टता को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल किन्तु गरिमापूर्ण भविष्यद्वक्ताई शैली। आज्ञाओं को स्वाभाविक निषेधात्मक रूप में रखा गया है और मूल की अर्थगत अस्पष्टताओं को पादटिप्पणियों में सुरक्षित किया गया है।
