  edition: WLC
  text: כִּ֤י עֵינַ/י֙ עַל כָּל דַּרְכֵי/הֶ֔ם לֹ֥א נִסְתְּר֖וּ מִ/לְּ/פָנָ֑/י וְ/לֹֽא נִצְפַּ֥ן עֲוֺנָ֖/ם מִ/נֶּ֥גֶד עֵינָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/017.yaml
  text: For my eyes are on all their ways[a]; they are not hidden from me[c][b], and their iniquity is not concealed from before my eyes.
translation:
  language: hi
  text: क्योंकि मेरी आँखें उनके सभी मार्गों[a] पर लगी हैं; वे मुझसे छिपे नहीं हैं, और उनका अधर्म[b] मेरी आँखों से छिपा नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘मार्गों’ से आशय उनके आचरण या जीवन-ढंग से है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी शब्द का अर्थ ‘दोष’ भी हो सकता है; यह किए गए अधर्म और उससे जुड़े दोष—दोनों का बोध करा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद पिछले कथन का कारण बताता है; ‘क्योंकि’ उसके व्याख्यात्मक संबंध को स्वाभाविक हिन्दी में स्पष्ट रखता है।
- source_word: עֵינַי עַל
  choice: मेरी आँखें … पर लगी हैं
  rationale: यह चयन परमेश्वर की सजग दृष्टि का सजीव मानवीय बिंब बनाए रखता है और उसे केवल ‘मैं जानता हूँ’ में अमूर्त नहीं करता।
- source_word: כָּל דַּרְכֵיהֶם
  choice: उनके सभी मार्गों
  rationale: ‘मार्ग’ मूल इब्रानी रूपक को बनाए रखता है; प्रसंग में इसका संकेत उनके आचरण और जीवन-ढंग की ओर है।
- source_word: לֹא נִסְתְּרוּ מִלְּפָנָי
  choice: वे मुझसे छिपे नहीं हैं
  rationale: बहुवचन क्रिया ‘मार्गों’ से मेल खाती है। शाब्दिक ‘मेरे सामने से’ की अपेक्षा ‘मुझसे’ आधुनिक हिन्दी में स्वाभाविक है और अर्थ पूरा व्यक्त करता है।
- source_word: עֲוֺנָם
  choice: उनका अधर्म
  rationale: עָוֹן अपराधपूर्ण दुष्कर्म तथा उससे जुड़ा दोष—दोनों अर्थ दे सकता है। ‘अधर्म’ यहाँ नैतिक गंभीरता बनाए रखता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: וְלֹא נִצְפַּן … מִנֶּגֶד עֵינָי
  choice: मेरी आँखों से छिपा नहीं है
  rationale: यह एकवचन क्रिया ‘अधर्म’ से मेल खाती है और आँखों के सामने कुछ भी गुप्त न रहने का मूल बिंब स्वाभाविक हिन्दी में सुरक्षित रखती है।
theological_decisions:
- issue: परमेश्वर के ज्ञान के लिए मानवीय अंगों का बिंब
  choice: ‘मेरी आँखें … पर लगी हैं’ और ‘मेरी आँखों से छिपा नहीं’ को बनाए रखा गया।
  alternative: ‘मैं उनके सभी काम जानता हूँ’ या ‘कुछ भी मेरी नज़र से नहीं बचता।’
  rationale: मूल पाठ परमेश्वर की सर्वज्ञता और नैतिक जाँच को आँखों के ठोस बिंब से व्यक्त करता है; इसे बनाए रखना भविष्यवाणी की आलंकारिक शक्ति को सुरक्षित रखता है।
- issue: עָוֹן का अर्थ-क्षेत्र
  choice: अधर्म
  alternative: दोष या अपराध
  rationale: यह शब्द दुष्कर्म और उससे उत्पन्न दोष दोनों का बोध करा सकता है। मुख्य पाठ में ‘अधर्म’ नैतिक अपराध को प्रमुखता देता है, पर पादटिप्पणी दूसरे वास्तविक अर्थ को खुला रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली रखी गई है। ‘मार्ग’ और ‘आँखें’ जैसे मूल बिंब सुरक्षित हैं, जबकि ‘मुझसे छिपे नहीं’ जैसी रचना शाब्दिक किंतु अस्वाभाविक हिन्दी से बचती है।
