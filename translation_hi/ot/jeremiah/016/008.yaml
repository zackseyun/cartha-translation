lexical_decisions:
- source_word: וּבֵית מִשְׁתֶּה
  choice: और दावत के घर में
  rationale: מִשְׁתֶּה उत्सवी खाने-पीने की सभा या भोज को दर्शाता है। ‘दावत का घर’ इब्रानी की ठोस अभिव्यक्ति को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है; आरंभिक וּ को ‘और’ से व्यक्त किया गया है।
- source_word: לֹא תָבוֹא
  choice: प्रवेश न करना
  rationale: द्वितीय पुरुष एकवचन अपूर्ण क्रिया यहाँ निषेधात्मक भविष्यवाणी-संबंधी निर्देश है। यह रूप हिन्दी में गंभीर, प्रत्यक्ष मनाही व्यक्त करता है।
- source_word: לָשֶׁבֶת אוֹתָם
  choice: उनके साथ बैठकर
  rationale: ישׁב यहाँ भोज में स्थान ग्रहण करने को बताता है, और אוֹתָם इस प्रसंग में सहभागिता का अर्थ देता है। ‘उनके साथ बैठकर’ सामाजिक सहभागिता को स्पष्ट और सहज रूप में व्यक्त करता है।
- source_word: לֶאֱכֹל וְלִשְׁתּוֹת
  choice: खाने-पीने के लिए
  rationale: दोनों क्रियार्थक रूप दावत में सम्मिलित होने का उद्देश्य बताते हैं। हिन्दी का युग्म ‘खाने-पीने’ मूल की लय और संयुक्त क्रिया को स्वाभाविक ढंग से संप्रेषित करता है।
