id: JER.16.21
reference: Jeremiah 16:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לָ/כֵן֙ הִנְ/נִ֣י מֽוֹדִיעָ֔/ם בַּ/פַּ֣עַם הַ/זֹּ֔את אוֹדִיעֵ֥/ם אֶת יָדִ֖/י וְ/אֶת גְּבֽוּרָתִ֑/י וְ/יָדְע֖וּ כִּֽי שְׁמִ֥/י יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/021.yaml
  text: Therefore[a], behold, I am making them know—this time I will make them know my hand and my might[c][b], and they will know that my name is Yahweh.
translation:
  language: hi
  text: इसलिए, देखो, मैं उन्हें अवगत करा रहा हूँ—इस बार मैं उन्हें अपने हाथ और अपने पराक्रम से अवगत कराऊँगा; और वे जान लेंगे कि मेरा नाम याहवे[a] है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: YHWH; परंपरागत रूप से “प्रभु” लिखा जाता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: पिछले प्रसंग से निकलने वाले परिणाम को स्वाभाविक और स्पष्ट हिंदी में व्यक्त करता है।
- source_word: הִנְנִי
  choice: देखो, मैं
  rationale: जोरदार ईश्वरीय घोषणा की संकेतात्मक शक्ति को आधुनिक हिंदी में बनाए रखता है।
- source_word: מוֹדִיעָם / אוֹדִיעֵם
  choice: मैं ... उन्हें जानने दूँगा—मैं उन्हें ... का ज्ञान कराऊँगा
  rationale: हिफ़ील रूप की कारणवाचकता और मूल की पुनरुक्ति को बनाए रखते हुए हिंदी में अर्थ स्पष्ट करता है; पहले खंड का कृदंत आसन्न और निश्चित घोषणा के रूप में व्यक्त हुआ है।
- source_word: בַּפַּעַם הַזֹּאת
  choice: इस बार
  rationale: समय और अवसर पर दिए गए संकेतात्मक बल का संक्षिप्त, स्वाभाविक रूप।
- source_word: יָדִי
  choice: अपने हाथ
  rationale: सक्रिय सामर्थ्य के लिए प्रयुक्त इब्रानी रूपक को ज्यों का त्यों रखता है; साथ का 'पराक्रम' उसका आशय स्पष्ट करता है।
- source_word: גְּבוּרָתִי
  choice: अपने पराक्रम
  rationale: शक्ति और वीर्य के अर्थ को गरिमापूर्ण आधुनिक हिंदी में व्यक्त करता है और 'हाथ' से अलग शब्द बनाए रखता है।
- source_word: וְיָדְעוּ
  choice: और वे जान लेंगे
  rationale: इब्रानी समन्वय और परिणामी भाव दोनों को स्वाभाविक हिंदी भविष्यकाल में रखता है।
- source_word: שְׁמִי
  choice: मेरा नाम
  rationale: ईश्वर की आत्म-पहचान और वाचा-संबंधी महत्व को अक्षुण्ण रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिंदी बाइबलीय प्रयोग में प्रचलित देवनागरी रूप से परमेश्वर के व्यक्तिगत नाम को उपाधि से बदले बिना प्रस्तुत करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम है। हिंदी में परिचित नाम-रूप 'यहोवा' उसे उपाधि 'प्रभु' से बदले बिना स्पष्ट करता है; वैकल्पिक लिप्यंतरण पादटिप्पणी में दिया गया है।
- issue: '''मेरे हाथ'' को रूपक के रूप में रखना'
  choice: अपने हाथ
  alternative: अपनी सामर्थ्य
  rationale: मूल में 'हाथ' और 'पराक्रम' दो अलग पद हैं। रूपक को रखने से काव्यात्मक तनाव और सक्रिय शक्ति की छवि सुरक्षित रहती है।
- issue: מוֹדִיעָם के कर्म की संभावित अस्पष्टता
  choice: व्यक्तिगत कर्म—उन्हें जानने दूँगा
  alternative: अव्यक्तिगत कर्म—उन्हें यह जता दूँगा
  rationale: सर्वनाम-प्रत्यय को व्यक्तियों की ओर संकेत करने वाला मानकर पुनरुक्त कारणवाचक अर्थ रखा गया है, पर दूसरी व्याकरणसम्मत समझ को पादटिप्पणी में दर्ज किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। 'देखो' घोषणा का जोर बनाए रखता है; 'हाथ' का मूल रूपक सुरक्षित है। मुख्य पाठ में केवल [a] चिह्न प्रयुक्त है और उसकी पादटिप्पणी संलग्न है।
