id: JER.16.10
reference: Jeremiah 16:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הָיָ֗ה כִּ֤י תַגִּיד֙ לָ/עָ֣ם הַ/זֶּ֔ה אֵ֥ת כָּל הַ/דְּבָרִ֖ים הָ/אֵ֑לֶּה וְ/אָמְר֣וּ אֵלֶ֗י/ךָ עַל מֶה֩ דִבֶּ֨ר יְהוָ֤ה עָלֵ֨י/נוּ֙ אֵ֣ת כָּל הָ/רָעָ֤ה הַ/גְּדוֹלָה֙ הַ/זֹּ֔את וּ/מֶ֤ה עֲוֺנֵ֨/נוּ֙ וּ/מֶ֣ה חַטָּאתֵ֔/נוּ אֲשֶׁ֥ר חָטָ֖אנוּ לַֽ/יהוָ֥ה אֱלֹהֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/010.yaml
  text: And when you tell this people all these words[a], and they say to you, ‘Why has Yahweh spoken against us all this great disaster? And what is our iniquity, and what is our sin that we have sinned against Yahweh our God?’
translation:
  language: hi
  text: और जब तुम इस प्रजा को ये सब वचन सुनाओगे और वे तुमसे कहेंगे, “याहवे ने हमारे विरुद्ध इतनी बड़ी विपत्ति क्यों घोषित की है? हमारा अधर्म क्या है? और हमारा पाप क्या है, जो हमने अपने परमेश्वर याहवे के विरुद्ध किया है?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: और जब
  rationale: यह इब्रानी मुहावरा भविष्य की अपेक्षित परिस्थिति प्रस्तुत करता है; ‘और जब’ स्वाभाविक हिन्दी में उसके कालगत भाव को रखता है।
- source_word: תַגִּיד ... אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: ये सब वचन सुनाओगे
  rationale: הגיד का अर्थ यहाँ बताना या प्रकट करना है और דְּבָרִים भविष्यद्वक्तीय संदेश के कथित वचनों को सूचित करता है; ‘सुनाओगे’ दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: לָעָם הַזֶּה
  choice: इस प्रजा को
  rationale: עָם सामूहिक एकवचन है; ‘प्रजा’ भविष्यद्वक्तीय संदर्भ में स्वाभाविक है और सामूहिकता बनाए रखता है।
- source_word: דִבֶּר יְהוָה עָלֵינוּ
  choice: याहवे ने हमारे विरुद्ध ... बात ... कही है
  rationale: עַל न्याय की घोषणा के संदर्भ में विरोधात्मक अर्थ रखता है; हिन्दी में ‘हमारे विरुद्ध’ इसे स्पष्ट करता है।
- source_word: כָּל הָרָעָה הַגְּדוֹלָה הַזֹּאת
  choice: इतनी बड़ी विपत्ति
  rationale: רָעָה यहाँ नैतिक बुराई नहीं, आने वाली घोर आपदा या दंड को सूचित करता है; ‘विपत्ति’ हिन्दी में संदर्भानुकूल और स्वाभाविक है।
- source_word: עֲוֺנֵנוּ
  choice: हमारा अधर्म
  rationale: עָוֹן नैतिक टेढ़ेपन, अपराध या दोष का भार रखता है; ‘अधर्म’ अगले חַטָּאת से कुछ lexical भेद भी बनाए रखता है।
- source_word: חַטָּאתֵנוּ אֲשֶׁר חָטָאנוּ
  choice: हमारा वह पाप ... जो हमने ... किया है
  rationale: חַטָּאת और cognate क्रिया חטא की पुनरुक्ति को ‘पाप ... किया’ द्वारा यथासंभव बनाए रखा गया है।
- source_word: לַיהוָה אֱלֹהֵינוּ
  choice: अपने परमेश्वर याहवे के विरुद्ध
  rationale: חטא के साथ לְ सम्बन्धगत अपराध को सूचित करता है, जिसे हिन्दी में ‘के विरुद्ध पाप करना’ स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है; ‘याहवे’ उसका सीधा लिप्यंतरण है और उसे उपाधि से नहीं बदलता।
- issue: न्याय-संदर्भ में רָעָה का अर्थ
  choice: विपत्ति
  alternative: बुराई; आपदा
  rationale: यहाँ शब्द लोगों पर घोषित विनाशकारी न्याय को सूचित करता है, परमेश्वर में नैतिक बुराई को नहीं; ‘विपत्ति’ इस अर्थ को बिना अनावश्यक व्याख्या के रखता है।
- issue: עָוֹן और חַטָּאת के बीच भेद
  choice: अधर्म और पाप
  alternative: दोष और पाप; अपराध और पाप
  rationale: दोनों निकटार्थी नैतिक शब्दों को एक ही हिन्दी शब्द में मिलाने के बजाय ‘अधर्म’ और ‘पाप’ स्रोत की समानता तथा आंशिक भिन्नता दोनों बनाए रखते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज भविष्यद्वक्तीय गद्य। प्रश्नों की तीव्रता और लोगों की आत्म-पक्षसमर्थक मुद्रा को बिना अतिरिक्त व्याख्या के रखा गया है। कोई पादटिप्पणी आवश्यक नहीं मानी गई, इसलिए मुख्य पाठ में कोई पादटिप्पणी-चिह्न नहीं है।
