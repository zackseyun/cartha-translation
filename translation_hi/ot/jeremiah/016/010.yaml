revisions:
- from: और जब तुम इस प्रजा को ये सब वचन सुनाओगे और वे तुमसे कहेंगे, “याहवे ने हमारे विरुद्ध इतनी बड़ी विपत्ति की बात क्यों कही है? हमारा अधर्म क्या है? और हमारा वह पाप क्या है जो हमने अपने परमेश्वर याहवे के विरुद्ध किया है?”
  to: और जब तुम इस प्रजा को ये सब वचन सुनाओगे और वे तुमसे कहेंगे, “याहवे ने हमारे विरुद्ध इतनी बड़ी विपत्ति क्यों घोषित की है? हमारा अधर्म क्या है? और हमारा पाप क्या है, जो हमने अपने परमेश्वर याहवे के विरुद्ध किया है?”
  rationale: The revision keeps the draft’s sound lexical and theological choices while making the announced disaster the direct object of Yahweh’s prophetic pronouncement, rather than a topic of speech. No footnote is required because ‘विपत्ति’ is clear in this judgment context and no material ambiguity is concealed.
