id: JER.16.2
reference: Jeremiah 16:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לֹֽא תִקַּ֥ח לְ/ךָ֖ אִשָּׁ֑ה וְ/לֹֽא יִהְי֤וּ לְ/ךָ֙ בָּנִ֣ים וּ/בָנ֔וֹת בַּ/מָּק֖וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/002.yaml
  text: You shall not take a wife for yourself[a], nor shall you have sons or daughters in this place.
translation:
  language: hi
  text: तू अपने लिए पत्नी न लेना[a], और न इस स्थान में तेरे बेटे-बेटियाँ हों।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, अधिक भावानुसार: “तू विवाह न करना, और न इस स्थान में तेरे बेटे-बेटियाँ हों।”'
    reason: לקח אשה का शाब्दिक अर्थ ‘पत्नी लेना’ और भावानुसार अर्थ ‘विवाह करना’ है।
lexical_decisions:
- source_word: תִקַּח
  choice: लेना
  rationale: לקח का मूल अर्थ ‘लेना’ है। ‘पत्नी लेना’ विवाह करने का इब्रानी मुहावरा है; हिन्दी में यह समझने योग्य है और मूल की गंभीर, सीधी अभिव्यक्ति बनाए रखता है।
- source_word: לְךָ
  choice: अपने लिए
  rationale: सम्बोधन यिर्मयाह से सीधे है और לְךָ व्यक्तिगत संबंध को व्यक्त करता है। ‘अपने लिए’ इस भाव को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: אִשָּׁה
  choice: पत्नी
  rationale: ‘लेना’ के साथ इस वैवाहिक प्रयोग में אִשָּׁה का अर्थ केवल ‘स्त्री’ नहीं, बल्कि ‘पत्नी’ है।
- source_word: וְלֹא יִהְיוּ לְךָ
  choice: और न ... तेरे ... हों
  rationale: היה के साथ לְ स्वामित्व या किसी के लिए अस्तित्व को व्यक्त करता है। यह रचना ‘और तेरे ... न हों’ के रूप में मूल के निकट रहते हुए हिन्दी में निषेध का बल बनाए रखती है।
- source_word: בָּנִים וּבָנוֹת
  choice: बेटे-बेटियाँ
  rationale: मूल पाठ पुत्र और पुत्रियों—दोनों—का स्पष्ट उल्लेख करता है। ‘बेटे-बेटियाँ’ आधुनिक हिन्दी में स्वाभाविक और समावेशी युग्म है।
- source_word: בַּמָּקוֹם הַזֶּה
  choice: इस स्थान में
  rationale: מָקוֹם का सामान्य अर्थ ‘स्थान’ है। यह चयन ‘देश’ जैसा अधिक व्यापक अर्थ थोपे बिना संकेतवाचक बल को सुरक्षित रखता है।
theological_decisions:
- issue: यिर्मयाह को दिए गए निषेध का बल
  choice: यिर्मयाह को इस स्थान में विवाह न करने और संतान न होने का सीधा ईश्वरीय निषेध
  alternative: उसके अविवाहित और निःसंतान रहने की केवल भविष्यवाणी, अथवा पूरे देश पर लागू व्यापक निषेध
  rationale: द्वितीय पुरुष एकवचन रूप सीधे यिर्मयाह को संबोधित करते हैं और पहला खंड स्पष्ट निषेध है। ‘इस स्थान में’ को बनाए रखने से पाठ का स्थानीय और भविष्यसूचक तनाव सुरक्षित रहता है, बिना उसे पूरे देश तक व्याख्यात्मक रूप से फैलाए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर, सीधा ईश्वरीय सम्बोधन। ‘तू’ मूल के एकवचन निकट सम्बोधन को व्यक्त करता है। शाब्दिक इब्रानी वैवाहिक मुहावरे को मुख्य पाठ में रखा गया है और अधिक सहज विकल्प पाद-टिप्पणी में दिया गया है।
