  text: כִּי֩ כֹ֨ה אָמַ֜ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הִנְ/נִ֨י מַשְׁבִּ֜ית מִן הַ/מָּק֥וֹם הַ/זֶּ֛ה לְ/עֵינֵי/כֶ֖ם וּ/בִֽ/ימֵי/כֶ֑ם ק֤וֹל שָׂשׂוֹן֙ וְ/ק֣וֹל שִׂמְחָ֔ה ק֥וֹל חָתָ֖ן וְ/ק֥וֹל כַּלָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/009.yaml
  text: 'For thus says Yahweh of Armies[a], the God of Israel: Behold, I am about to put an end, from this place before your eyes and in your days, to the sound of joy and the sound of gladness, the voice of the bridegroom and the voice of the bride.'
translation:
  language: hi
  text: 'क्योंकि सेनाओं के याहवे, इस्राएल के परमेश्वर, ऐसा कहते हैं: देखो, मैं इस स्थान से तुम्हारी आँखों के सामने और तुम्हारे दिनों में हर्ष की ध्वनि और आनन्द की ध्वनि, दूल्हे की आवाज़ और दुल्हन की आवाज़ बन्द कर दूँगा।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं के यहोवा
  rationale: ईश्वरीय नाम को लिप्यंतरित रूप ‘यहोवा’ में रखा गया है और צְבָאוֹת का ठोस अर्थ ‘सेनाओं’ से व्यक्त किया गया है; इससे पदवी का अर्थ आधुनिक हिन्दी में स्पष्ट रहता है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर
  rationale: इब्रानी संबंधसूचक संरचना का सीधा और स्वाभाविक हिन्दी अनुवाद।
- source_word: הִנְנִי מַשְׁבִּית
  choice: देखो, मैं ... बन्द कर देनेवाला हूँ
  rationale: ‘देखो’ उद्घोषणा के ध्यानाकर्षक बल को और कृदन्तयुक्त हिफ़ील रूप आसन्न, कारक कार्रवाई को व्यक्त करता है।
- source_word: מִן הַמָּקוֹם הַזֶּה
  choice: इसी स्थान से
  rationale: מִן के स्रोत/क्षेत्र से हटाए जाने के भाव और הַזֶּה की निकटता पर बल को संक्षेप में सुरक्षित रखता है।
- source_word: לְעֵינֵיכֶם וּבִימֵיכֶם
  choice: तुम्हारी आँखों के सामने और तुम्हारे ही दिनों में
  rationale: आनेवाले न्याय के प्रत्यक्ष रूप से देखे जाने और उसी पीढ़ी के जीवनकाल में घटने—दोनों बातों को बनाए रखता है।
- source_word: קוֹל שָׂשׂוֹן וְקוֹל שִׂמְחָה
  choice: हर्ष और आनन्द की ध्वनि
  rationale: दो निकटार्थी किन्तु भिन्न उत्सवसूचक संज्ञाओं को अलग हिन्दी शब्दों में रखा गया है; अमूर्त उत्सवी वातावरण के लिए ‘ध्वनि’ उपयुक्त है।
- source_word: קוֹל חָתָן וְקוֹל כַּלָּה
  choice: दूल्हे और दुल्हन की आवाज़
  rationale: व्यक्तियों के लिए ‘आवाज़’ स्वाभाविक है और विवाहोत्सव के सामुदायिक उल्लास की छवि सुरक्षित रहती है।
theological_decisions:
- issue: יְהוָה צְבָאוֹת ईश्वरीय उपाधि का अनुवाद
  choice: सेनाओं के यहोवा
  alternative: सेनाओं के प्रभु / सेनाओं के याहवे
  rationale: मूल में वाचा का निजी नाम स्पष्ट रूप से उपस्थित है, इसलिए उसे सामान्य उपाधि ‘प्रभु’ से नहीं बदला गया। हिन्दी बाइबल परंपरा में पहचाने जाने योग्य ‘यहोवा’ रखा गया, जबकि צְבָאוֹת को अर्थपूर्ण ढंग से ‘सेनाओं’ कहा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘हर्ष और आनन्द’ काव्यात्मक समानांतरता बनाए रखते हैं, जबकि ‘दूल्हा-दुल्हन’ सामान्य पाठक के लिए सहज हैं।
