id: JER.16.18
reference: Jeremiah 16:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/שִׁלַּמְתִּ֣י רִֽאשׁוֹנָ֗ה מִשְׁנֵ֤ה עֲוֺנָ/ם֙ וְ/חַטָּאתָ֔/ם עַ֖ל חַלְּלָ֣/ם אֶת אַרְצִ֑/י בְּ/נִבְלַ֤ת שִׁקּֽוּצֵי/הֶם֙ וְ/תוֹעֲב֣וֹתֵי/הֶ֔ם מָלְא֖וּ אֶת נַחֲלָתִֽ/י־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/018.yaml
  text: And first I will repay double their iniquity and their sin[a], because they have defiled my land with the carcasses of their detestable idols and have filled my inheritance with their abominations.
translation:
  language: hi
  text: और पहले मैं उनके अधर्म और पाप का दुगुना बदला दूँगा, क्योंकि उन्होंने अपनी घिनौनी मूर्तियों के शवों से मेरी भूमि को अपवित्र किया है और अपनी घृणित वस्तुओं से मेरी विरासत को भर दिया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשִׁלַּמְתִּי
  choice: मैं ... बदला चुकाऊँगा
  rationale: पिएल रूप यहाँ न्यायिक प्रतिफल या किए का फल लौटाने का भाव देता है। ‘बदला चुकाऊँगा’ आधुनिक हिन्दी में स्वाभाविक है और दंडात्मक अर्थ को बनाए रखता है।
- source_word: רִאשׁוֹנָה
  choice: सबसे पहले
  rationale: यहाँ यह क्रिया की प्राथमिकता बताता है—आगे वर्णित पुनर्स्थापना से पहले दंड। ‘सबसे पहले’ इस क्रम को स्पष्ट करता है।
- source_word: מִשְׁנֵה
  choice: दुगुना
  rationale: यह संज्ञा दोहरी मात्रा का बोध कराती है। ‘दुगुना’ संक्षिप्त और स्वाभाविक हिन्दी है।
- source_word: עֲוֺנָם וְחַטָּאתָם
  choice: उनके अधर्म और पाप का
  rationale: दोनों इब्रानी शब्दों का नैतिक भेद और समानांतरता बनाए रखी गई है। חַטָּאתָם रूप में एकवचन होते हुए भी सामूहिक अर्थ रख सकता है, इसलिए ‘पाप’ रखा गया है।
- source_word: עַל
  choice: क्योंकि
  rationale: यहाँ यह दंड का आधार या कारण प्रस्तुत करता है; ‘क्योंकि’ उस कारणात्मक संबंध को सहज रूप से व्यक्त करता है।
- source_word: חַלְּלָם אֶת־אַרְצִי
  choice: उन्होंने ... मेरे देश को अशुद्ध किया
  rationale: חלל का पिएल रूप भूमि को धार्मिक और नैतिक रूप से दूषित करने का भाव देता है। ‘अशुद्ध किया’ इस प्रदूषण-चित्र को स्पष्ट रखता है।
- source_word: בְּנִבְלַת שִׁקּוּצֵיהֶם
  choice: अपनी घिनौनी मूर्तियों की लाशों से
  rationale: נִבְלָה शव या लाश को दर्शाता है, जबकि prophetic संदर्भ में שִׁקּוּצִים प्रायः मूर्तियों के लिए प्रयुक्त होता है। यह अनुवाद मूल के तीखे, अपमानसूचक चित्र को बनाए रखता है; व्यापक शाब्दिक विकल्प पाद-टिप्पणी में दिया गया है।
- source_word: וְתוֹעֲבוֹתֵיהֶם
  choice: अपनी घृणित वस्तुओं से
  rationale: यह शब्द घृणित धार्मिक वस्तुओं या आचरणों को सूचित कर सकता है। ‘घृणित वस्तुओं’ से मूल की व्यापकता बनी रहती है और इसे किसी एक प्रकार के पाप तक सीमित नहीं किया जाता।
- source_word: מָלְאוּ אֶת־נַחֲלָתִי
  choice: मेरी विरासत को भर दिया है
  rationale: נַחֲלָה यहाँ देश को परमेश्वर की अपनी विरासत या अधिकार-भूमि के रूप में प्रस्तुत करता है। ‘विरासत’ वाचा-संबंधी प्रतिध्वनि को सुरक्षित रखती है।
theological_decisions:
- issue: क्या שִׁקּוּצֵיהֶם को स्पष्ट रूप से मूर्तियाँ कहा जाए
  choice: मुख्य पाठ में ‘घिनौनी मूर्तियाँ’
  alternative: ‘घिनौनी वस्तुएँ’
  rationale: यिर्मयाह के भविष्यद्वाणी-संबंधी विवादात्मक संदर्भ में यह पद प्रायः मूर्तिपूजक वस्तुओं को सूचित करता है। ‘मूर्तियाँ’ आधुनिक पाठक के लिए संभावित संदर्भ स्पष्ट करती हैं, जबकि अधिक व्यापक शाब्दिक अर्थ पाद-टिप्पणी में सुरक्षित है।
- issue: ‘दुगुना’ दंड का अर्थ
  choice: मूल का ‘दुगुना’ कथन बिना व्याख्यात्मक नरमी के रखा गया
  alternative: ‘भरपूर दंड’ या ‘पूरा प्रतिफल’
  rationale: इब्रानी מִשְׁנֵה स्पष्ट रूप से दोहरी मात्रा कहता है। न्याय की समानुपातिकता संबंधी तनाव को अनुवाद में हल या नरम नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज किंतु गरिमापूर्ण रखी गई है। ‘लाशों’ का तीखा रूपक जानबूझकर बनाए रखा गया है, क्योंकि मूल पाठ मूर्तियों को मृत और दूषित वस्तुओं के रूप में चित्रित करता है।
