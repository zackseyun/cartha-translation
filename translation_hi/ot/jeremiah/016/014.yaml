source:
  edition: WLC
  text: לָ/כֵ֛ן הִנֵּֽה יָמִ֥ים בָּאִ֖ים נְאֻם יְהוָ֑ה וְ/לֹֽא יֵאָמֵ֥ר עוֹד֙ חַי יְהוָ֔ה אֲשֶׁ֧ר הֶעֱלָ֛ה אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל מֵ/אֶ֥רֶץ מִצְרָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/014.yaml
  text: Therefore[a], behold, days are coming, declares Yahweh, when it will no longer be said, ‘As Yahweh lives[b], who brought up the sons of Israel from the land of Egypt,’
translation:
  language: hi
  text: इसलिए देखो, वे दिन आ रहे हैं—यह याहवे की घोषणा है—जब फिर यह नहीं कहा जाएगा, ‘याहवे के जीवन की शपथ, जो इस्राएल के पुत्रों[a] को मिस्र देश से निकाल लाया[b],’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक मुहावरेदार रूप में “इस्राएली” या “इस्राएल के लोग।” इब्रानी में शाब्दिक रूप से “इस्राएल के पुत्र” है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी क्रिया का अधिक शाब्दिक अर्थ “ऊपर ले आया” है; यहाँ यह मिस्र से निर्गमन कराने के अर्थ में है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले संदर्भ से निष्कर्षात्मक संबंध व्यक्त करता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: הִנֵּה
  choice: देखो
  rationale: भविष्यवाणी में श्रोताओं का ध्यान खींचने वाले मूल संकेतक बल को बनाए रखता है।
- source_word: יָמִים בָּאִים
  choice: ऐसे दिन आ रहे हैं
  rationale: आगामी दैवी कार्य की घोषणा करने वाली इब्रानी भविष्यवाणी-संबंधी अभिव्यक्ति को सहज हिन्दी में व्यक्त करता है। ‘ऐसे’ आगे आने वाले कथन की ओर संकेत करता है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: भविष्यवाणी के औपचारिक सूत्र की गंभीरता और कथन के दैवी स्रोत को स्पष्ट रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चतुरक्षरीय दैवी नाम को उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- source_word: וְלֹא יֵאָמֵר עוֹד
  choice: फिर यह नहीं कहा जाएगा
  rationale: मूल के निर्वैयक्तिक कर्मवाच्य और עוֹד के ‘फिर/अब और’ भाव, दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: חַי יְהוָה
  choice: जीवित याहवे की शपथ
  rationale: यह एक निश्चित इब्रानी शपथ-सूत्र है; हिन्दी में इसका आशय स्पष्ट और गंभीर रूप में व्यक्त होता है।
- source_word: אֲשֶׁר הֶעֱלָה
  choice: जो ... निकाल लाया
  rationale: हिफ़ील रूप यहाँ मिस्र से निर्गमन कराने का संकेत देता है। ‘निकाल लाया’ आधुनिक हिन्दी में इस उद्धारकारी गति को स्वाभाविक ढंग से व्यक्त करता है; क्रिया के अधिक शाब्दिक रूप की सूचना पादटिप्पणी में दी गई है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: मूल की स्पष्ट पुत्र-संबंधी बहुवचन रचना को सुरक्षित रखता है, जबकि अधिक प्रचलित सामूहिक विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: मिस्र देश से
  rationale: מֵאֶרֶץ में उपस्थित ‘देश’ और स्रोत-सूचक संबंध को संक्षिप्त, स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: दैवी नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का दैवी नाम प्रत्यक्ष रूप से है। उसे ‘प्रभु’ जैसी उपाधि से बदलने के बजाय लिप्यंतरित किया गया है; ‘याहवे’ आधुनिक विद्वत्तापूर्ण उच्चारण को दर्शाता है।
- issue: בְּנֵי יִשְׂרָאֵל में लिंगयुक्त पारिवारिक अभिव्यक्ति
  choice: इस्राएल के पुत्रों
  alternative: इस्राएली; इस्राएल के लोग
  rationale: मुख्य पाठ मूल की ‘पुत्रों’ वाली रचना को बनाए रखता है और सामूहिक, अधिक मुहावरेदार अर्थों को पादटिप्पणी में स्वीकार करता है।
- issue: חַי יְהוָה का शपथ-सूत्र
  choice: जीवित याहवे की शपथ
  alternative: याहवे के जीवन की शपथ; याहवे जीवित है
  rationale: यह केवल परमेश्वर के जीवित होने का कथन नहीं, बल्कि शपथ का सूत्र है; चुना हुआ रूप उस व्यावहारिक अर्थ को स्पष्ट करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और भविष्यवाणी-संबंधी है। ‘देखो’ ध्यानाकर्षक बल बनाए रखता है, जबकि डैश भविष्यवाणी के घोषणा-सूत्र को स्पष्ट करते हैं। पद 15 में जारी रहने वाली शपथ के कारण अंत में उद्धरण और वाक्य को जानबूझकर अपूर्ण रखा गया है। पादटिप्पणी-चिह्न उन्हीं शब्दसमूहों के बाद रखे गए हैं जिनकी वे व्याख्या करते हैं।
