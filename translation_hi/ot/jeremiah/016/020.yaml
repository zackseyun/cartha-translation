  text: הֲ/יַעֲשֶׂה לּ֥/וֹ אָדָ֖ם אֱלֹהִ֑ים וְ/הֵ֖מָּה לֹ֥א אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/020.yaml
  text: Can a man make gods for himself? Yet they are not gods[a].
translation:
  language: hi
  text: क्या मनुष्य अपने लिए देवता बना सकता है? फिर भी वे देवता नहीं हैं[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या मनुष्य अपने लिए देवता बनाता है? पर वे देवता हैं ही नहीं।”
    reason: हिब्रू अपूर्ण क्रिया को सामान्य वर्तमान के रूप में भी समझा जा सकता है, और וְ को ‘पर’ से व्यक्त किया जा सकता है।
lexical_decisions:
- source_word: הֲ/יַעֲשֶׂה
  choice: क्या ... बना सकता है?
  rationale: प्रश्नवाचक הֲ और अपूर्ण क्रिया का मेल आलंकारिक तथा अविश्वासपूर्ण प्रश्न बनाता है। आधुनिक हिन्दी में ‘क्या ... बना सकता है?’ इस बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לּוֹ
  choice: अपने लिए
  rationale: संदर्भ में ל और तृतीय पुरुष एकवचन प्रत्यय का भाव आत्मवाचक है—मनुष्य अपने उपयोग या उपासना के लिए देवता बनाता है।
- source_word: אָדָם
  choice: मनुष्य
  rationale: यहाँ शब्द एकवचन में सामान्य मानव को सूचित करता है। ‘मनुष्य’ हिन्दी में स्वाभाविक, गरिमापूर्ण और लिंग-सटीक सामान्य पद है।
- source_word: אֱלֹהִים
  choice: देवता
  rationale: बहुवचन रूप मानव-निर्मित पूज्य सत्ताओं या मूर्तियों के लिए प्रयुक्त है। ‘देवता’ इस विवादात्मक संदर्भ में स्पष्ट और सहज है।
- source_word: וְ/הֵמָּה
  choice: फिर भी वे
  rationale: 'संयोजक और स्वतंत्र सर्वनाम मिलकर स्पष्ट विरोध प्रकट करते हैं: मनुष्य जिन्हें देवता बनाता है, वे वास्तव में देवता नहीं हैं।'
- source_word: לֹא אֱלֹהִים
  choice: देवता नहीं हैं
  rationale: यह वाक्यांश मानव-निर्मित देवताओं की वास्तविक दिव्य हैसियत का निषेध करता है और मूल के बहुवचन को बनाए रखता है।
theological_decisions:
- issue: मूर्तियों के विरुद्ध कथन का स्वरूप
  choice: पद मानव-निर्मित देवताओं के सचमुच देवता होने का निषेध करता है।
  alternative: पद केवल देवता बनाने की मानवीय क्रिया का उपहास करता है, कोई व्यापक तात्त्विक दावा नहीं करता।
  rationale: अंतिम पदबंध לֹא אֱלֹהִים सीधे कहता है कि वे ‘देवता नहीं’ हैं। अनुवाद इस प्रबल भविष्यद्वक्ताई निषेध को बनाए रखता है, पर मूल में अनुपस्थित दार्शनिक शब्दावली नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, संक्षिप्त और गरिमापूर्ण रखी गई है। ‘मनुष्य’ सामान्य मानव के लिए और ‘देवता’ मूल के बहुवचन के लिए चुना गया है।
