id: JER.16.6
reference: Jeremiah 16:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/מֵ֨תוּ גְדֹלִ֧ים וּ/קְטַנִּ֛ים בָּ/אָ֥רֶץ הַ/זֹּ֖את לֹ֣א יִקָּבֵ֑רוּ וְ/לֹֽא יִסְפְּד֣וּ לָ/הֶ֔ם וְ/לֹ֣א יִתְגֹּדַ֔ד וְ/לֹ֥א יִקָּרֵ֖חַ לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/006.yaml
  text: Both great and small will die in this land[a]. They will not be buried, and no one will mourn for them, or cut himself[b], or make himself bald for them.
translation:
  language: hi
  text: इस देश में बड़े और छोटे, दोनों मर जाएँगे।[a] उन्हें दफ़नाया नहीं जाएगा; न कोई उनके लिए विलाप करेगा, न अपने शरीर पर चीरे लगाएगा, और न उनके लिए अपना सिर मुँड़ाएगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “बड़े और छोटे” से हर स्तर और हर आयु के लोग अभिप्रेत हो सकते हैं।
    reason: lexical_ambiguity
  - marker: b
    text: शरीर पर चीरे लगाना और सिर मुँड़ाना मृतकों के लिए शोक प्रकट करने की प्राचीन रीतियाँ थीं।
    reason: cultural_note
lexical_decisions:
- source_word: וּמֵתוּ
  choice: मर जाएँगे
  rationale: भविष्यसूचक प्रसंग में संयोजक सहित पूर्ण क्रिया आने वाली घटना घोषित करती है; ‘मर जाएँगे’ מות का सहज और सीधा अर्थ है।
- source_word: גְדֹלִים וּקְטַנִּים
  choice: बड़े और छोटे, दोनों
  rationale: यह समावेशी युग्म सभी वर्गों अथवा आयु-समूहों को समेट सकता है; हिन्दी में यह स्वाभाविक है और मूल की व्यापकता बनाए रखता है।
- source_word: בָּאָרֶץ הַזֹּאת
  choice: इस देश में
  rationale: यहाँ אֶרֶץ यिर्मयाह के भौगोलिक संदर्भ में उस देश को सूचित करता है; ‘इस देश में’ सामान्य आधुनिक हिन्दी में स्पष्ट है।
- source_word: לֹא יִקָּבֵרוּ
  choice: उन्हें दफ़नाया नहीं जाएगा
  rationale: निफ़अल रूप का कर्मवाच्य अर्थ सीधे और स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: וְלֹא יִסְפְּדוּ לָהֶם
  choice: न कोई उनके लिए विलाप करेगा
  rationale: इब्रानी बहुवचन क्रिया का कर्ता अनिश्चित है; हिन्दी में ‘न कोई’ सार्वजनिक शोक के पूर्ण अभाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְלֹא יִתְגֹּדַד
  choice: न अपने शरीर पर चीरे लगाएगा
  rationale: हित्पोलेल/प्रतिबिंबात्मक रूप शोक में स्वयं को काटने की प्रथा बताता है; ‘अपने शरीर पर चीरे लगाना’ क्रिया की भौतिकता स्पष्ट रखता है।
- source_word: וְלֹא יִקָּרֵחַ לָהֶם
  choice: न उनके लिए अपना सिर मुँड़ाएगा
  rationale: קרח से बना रूप शोक के चिह्न के रूप में स्वयं को गंजा करने की ओर संकेत करता है; ‘सिर मुँड़ाना’ आधुनिक हिन्दी में इसका स्वाभाविक सांस्कृतिक समतुल्य है।
theological_decisions:
- issue: न्याय की घोषणा में उल्लिखित शोक-रीतियों की ठोस प्रकृति
  choice: शरीर पर चीरे लगाने और सिर मुँड़ाने की क्रियाएँ मुख्य पाठ में स्पष्ट रखी गईं
  alternative: केवल ‘शोक की रस्में निभाना’ कहना
  rationale: मूल पाठ सामान्य शोक ही नहीं, दो विशिष्ट शारीरिक रीतियाँ गिनाता है। उन्हें बनाए रखने से न्याय-वाणी की तीव्रता और सांस्कृतिक विशिष्टता सुरक्षित रहती है।
- issue: ‘बड़े और छोटे’ की सीमा
  choice: मूल का समावेशी युग्म ज्यों का त्यों रखा और उसकी संभावित व्यापकता पाद-टिप्पणी में बताई
  alternative: इसे केवल ‘ऊँचे और नीचे दर्जे के लोग’ या केवल ‘बूढ़े और बच्चे’ कहना
  rationale: इब्रानी पद सामाजिक स्थिति अथवा आयु—दोनों की ओर सुना जा सकता है; किसी एक अर्थ को मुख्य पाठ में सीमित करना उचित नहीं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। समानांतर ‘न... न... और न...’ संरचना इब्रानी निषेधों की क्रमिक तीव्रता बनाए रखती है; सांस्कृतिक क्रियाओं को अस्पष्ट सामान्यीकरण में नहीं बदला गया।
