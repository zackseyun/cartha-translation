source:
  edition: WLC
  text: וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֗ם עַל֩ אֲשֶׁר עָזְב֨וּ אֲבוֹתֵי/כֶ֤ם אוֹתִ/י֙ נְאֻם יְהוָ֔ה וַ/יֵּלְכ֗וּ אַֽחֲרֵי֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וַ/יַּעַבְד֖וּ/ם וַ/יִּשְׁתַּחֲו֣וּ לָ/הֶ֑ם וְ/אֹתִ֣/י עָזָ֔בוּ וְ/אֶת תּוֹרָתִ֖/י לֹ֥א שָׁמָֽרוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/011.yaml
  text: Then you shall say to them, ‘Because your fathers abandoned me,’ declares the LORD, ‘and went after other gods, and served them, and bowed down to them. But me they abandoned, and my law they did not keep.’
translation:
  language: hi
  text: तब तुम उनसे कहना, “क्योंकि तुम्हारे पुरखों ने मुझे छोड़ दिया,” यहोवा की यह घोषणा है, “और वे दूसरे देवताओं के पीछे चले गए, उनकी सेवा की और उनके आगे दण्डवत् किया। परन्तु मुझे उन्होंने छोड़ दिया और मेरी व्यवस्था का पालन नहीं किया।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲבוֹתֵיכֶם
  choice: तुम्हारे पुरखाओं
  rationale: यहाँ पूर्वजों की पीढ़ियों का बोध है; ‘पुरखाओं’ आधुनिक सामान्य हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: נְאֻם יְהוָה
  choice: यहोवा की यह घोषणा है
  rationale: נְאֻם को दैवी उद्घोषणा के रूप में और चार-अक्षरीय नाम को ‘यहोवा’ के रूप में स्पष्ट रखा गया है।
- source_word: וַיַּעַבְדוּם
  choice: उनकी सेवा की
  rationale: עבד का धार्मिक संदर्भ में अर्थ सेवा/उपासना है; अगले अलग क्रियापद ‘दण्डवत् किया’ के साथ भेद बनाए रखने के लिए ‘सेवा की’ चुना गया।
- source_word: וַיִּשְׁתַּחֲווּ לָהֶם
  choice: उनके आगे दण्डवत् किया
  rationale: क्रिया शारीरिक रूप से झुकने और धार्मिक आराधना दोनों का संकेत देती है; यह हिन्दी अभिव्यक्ति दोनों पहलुओं को सुरक्षित रखती है।
- source_word: תּוֹרָתִי
  choice: मेरी व्यवस्था
  rationale: תורה यहाँ परमेश्वर की दी हुई शिक्षा/विधि को दर्शाती है; यिर्मयाह के वाचा-संदर्भ में ‘व्यवस्था’ सुस्थापित और उपयुक्त है।
- source_word: לֹא שָׁמָרוּ
  choice: पालन नहीं किया
  rationale: שמר का मूल भाव रखना/सावधानी से मानना है; व्यवस्था के साथ हिन्दी में ‘पालन करना’ स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में व्यक्तिगत वाचा-नाम है; ‘यहोवा’ उसे सामान्य उपाधि से अलग और प्रत्यक्ष रखता है।
- issue: וְאֹתִי עָזָבוּ में कर्म पर बल
  choice: परन्तु मुझे उन्होंने छोड़ दिया
  alternative: परन्तु उन्होंने मुझे छोड़ दिया
  rationale: इब्रानी में ‘मुझे’ अग्रस्थ है, जिससे दूसरे देवताओं के प्रति व्यवहार और यहोवा के परित्याग के बीच तीखा विरोध उभरता है; हिन्दी में अस्वाभाविक हुए बिना यह बल सुरक्षित रखा गया है।
- issue: आरम्भिक עַל אֲשֶׁר का संबंध
  choice: यह इसलिए हुआ कि
  alternative: क्योंकि
  rationale: पूर्वपद के अपेक्षित प्रश्न/दण्ड के कारण की ओर संकेत को स्पष्ट करता है, जबकि कारणात्मक अर्थ बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। समानान्तर क्रियाओं—पीछे चलना, सेवा करना और दण्डवत् करना—को अलग रखा गया है। वाक्य-विन्यास में ‘मुझे’ का अग्रस्थान मूल के विरोधात्मक बल को व्यक्त करता है।
