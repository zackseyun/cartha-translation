source:
  edition: WLC
  text: הִנְ/נִ֨י שֹׁלֵ֜חַ ל/דוגים רַבִּ֛ים נְאֻם יְהוָ֖ה וְ/דִיג֑וּ/ם וְ/אַֽחֲרֵי כֵ֗ן אֶשְׁלַח֙ לְ/רַבִּ֣ים צַיָּדִ֔ים וְ/צָד֞וּ/ם מֵ/עַ֤ל כָּל הַר֙ וּ/מֵ/עַ֣ל כָּל גִּבְעָ֔ה וּ/מִ/נְּקִיקֵ֖י הַ/סְּלָעִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/016.yaml
  text: Look[a], I am sending for many fishermen, declares Yahweh, and they will catch them; and after that I will send for many hunters[b], and they will hunt them from every mountain and from every hill and from the clefts of the rocks.
translation:
  language: hi
  text: “देखो, मैं बहुत-से मछुआरों[a] को बुला रहा हूँ,” यहोवा की घोषणा है, “और वे उन्हें पकड़ेंगे। इसके बाद मैं बहुत-से शिकारियों[b] को बुलाऊँगा, और वे हर पहाड़ और हर पहाड़ी पर से तथा चट्टानों की दरारों में से उनका शिकार करेंगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मछली पकड़नेवालों।’
    reason: lexical_alternative
  - marker: b
    text: मछुआरों और शिकारियों का चित्र ऐसे लोगों को दर्शाता है जो दूसरों को हर छिपने की जगह से ढूँढ़कर पकड़ेंगे। यह पद यह स्पष्ट नहीं करता कि यहोवा के भेजे हुए ये एजेंट कौन हैं।
    reason: cultural_note
lexical_decisions:
- source_word: הִנְנִי
  choice: देखो, मैं
  rationale: यह पद एक गंभीर और सजीव ईश्वरीय घोषणा आरंभ करता है; ‘देखो’ संकेतात्मक बल को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: שֹׁלֵחַ לְדוגים רַבִּים
  choice: मैं बहुत-से मछुआरों को बुलवा रहा हूँ
  rationale: הִנְנִי के साथ कृदंत निकट या आरंभ होती कार्रवाई को प्रकट करता है। לְ के कारण यहाँ केवल भेजना नहीं, एजेंटों को बुलाना या बुलवा भेजना अभिप्रेत है।
- source_word: נְאֻם יְהוָה
  choice: यहोवा की घोषणा है
  rationale: भविष्यद्वाणी की गंभीर सूत्रात्मक अभिव्यक्ति को बनाए रखते हुए יהוה को उसके व्यक्तिगत वाचा-नाम ‘यहोवा’ से व्यक्त किया गया है।
- source_word: וְדִיגוּם
  choice: और वे उन्हें पकड़ेंगे
  rationale: דוג मछली पकड़ने की क्रिया को दर्शाता है, पर हिन्दी में ‘उन्हें मछली पकड़ेंगे’ अस्वाभाविक होगा। ‘पकड़ेंगे’ कर्म-प्रत्यय और रूपक का परिणाम दोनों सुरक्षित रखता है।
- source_word: וְאַחֲרֵי כֵן
  choice: इसके बाद
  rationale: मछुआरों और शिकारियों की कार्रवाइयों के बीच क्रम को स्पष्ट और संक्षिप्त आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אֶשְׁלַח לְרַבִּים צַיָּדִים
  choice: मैं बहुत-से शिकारियों को बुलवाऊँगा
  rationale: पहली पंक्ति के समान एजेंटों को मँगाने का भाव और भावी क्रिया दोनों बनाए रखे गए हैं।
- source_word: וְצָדוּם
  choice: और वे ... उनका शिकार करेंगे
  rationale: צוד के ठोस शिकार-संबंधी रूपक को ‘पकड़ लेंगे’ जैसे सामान्य अनुवाद से धुंधला किए बिना सुरक्षित रखा गया है।
- source_word: מֵעַל כָּל הַר וּמֵעַל כָּל גִּבְעָה
  choice: हर पहाड़ और हर पहाड़ी पर से
  rationale: מֵעַל का स्थानगत अर्थ तथा दोनों संज्ञाओं के साथ दोहराए गए כָּל का सर्वसमावेशी बल सुरक्षित है।
- source_word: וּמִנְּקִיקֵי הַסְּלָעִים
  choice: तथा चट्टानों की दरारों में से
  rationale: नְקִיקִים चट्टानों की दरारों या संकरी फाँकों को दर्शाता है; ‘दरारों में से’ छिपे स्थानों से निकाले जाने का स्वाभाविक हिन्दी बोध देता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में परमेश्वर का विशिष्ट वाचा-नाम है; उसे सामान्य उपाधि से बदलने के बजाय हिन्दी में प्रचलित व्यक्तिगत नाम ‘यहोवा’ रखा गया है।
- issue: मछुआरों और शिकारियों के रूपक का आशय
  choice: ठोस रूपक और अनिर्दिष्ट ‘उन्हें’ बनाए रखना
  alternative: उन्हें स्पष्ट रूप से शत्रु आक्रमणकारी या निर्वासितों को इकट्ठा करनेवाले एजेंट कहना
  rationale: पद एजेंटों या पकड़े जानेवालों की पहचान स्पष्ट नहीं करता। अनुवाद दंड और पुनर्स्थापन के बीच संभावित व्याख्यात्मक तनाव को स्वयं से नहीं सुलझाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। प्रत्यक्ष वचन का विन्यास ईश्वरीय घोषणा को स्पष्ट करता है; ‘बुलवा रहा हूँ/बुलवाऊँगा’ मूल के एजेंटों को मँगाने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
