id: JER.16.12
reference: Jeremiah 16:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אַתֶּ֛ם הֲרֵעֹתֶ֥ם לַ/עֲשׂ֖וֹת מֵ/אֲבֽוֹתֵי/כֶ֑ם וְ/הִנְּ/כֶ֣ם הֹלְכִ֗ים אִ֚ישׁ אַֽחֲרֵי֙ שְׁרִר֣וּת לִבּֽ/וֹ הָ/רָ֔ע לְ/בִלְתִּ֖י שְׁמֹ֥עַ אֵלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/012.yaml
  text: But you have done worse than your fathers[a], and look, each of you is walking after the stubbornness of his evil heart[c][b], refusing to listen to me.
translation:
  language: hi
  text: पर तुमने अपने पुरखाओं से भी अधिक बुराई की है[a]। और देखो, तुममें से हर एक अपने बुरे मन की हठ पर चल रहा है[b][c] और मेरी बात सुनने से इनकार कर रहा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुमने अपने पुरखाओं से भी अधिक दुष्टता से काम किया है।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “हर पुरुष”; यहाँ यह पूरे लोगों में से प्रत्येक व्यक्ति के लिए वितरणात्मक रूप से प्रयुक्त है।
    reason: lexical_alternative
  - marker: c
    text: या, “अपने बुरे मन की हठीली कल्पना के पीछे चल रहा है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲרֵעֹתֶם לַעֲשׂוֹת
  choice: तुमने ... अधिक बुराई की है
  rationale: מֵאֲבוֹתֵיכֶם के साथ यह प्रयोग तुलनात्मक है। यह रूप नैतिक अर्थ और तुलना—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: מֵאֲבוֹתֵיכֶם
  choice: अपने पुरखाओं से
  rationale: אָבוֹת यहाँ पिछली पीढ़ियों के पितृ-पूर्वजों को सूचित करता है। ‘पुरखाओं’ से पारिवारिक और पीढ़ीगत भाव आधुनिक हिन्दी में स्पष्ट रहता है।
- source_word: וְהִנְּכֶם
  choice: और देखो
  rationale: הנה श्रोताओं का ध्यान सामने उपस्थित प्रमाण की ओर खींचता है; ‘देखो’ आधुनिक, सुबोध और पर्याप्त रूप से गरिमापूर्ण है।
- source_word: הֹלְכִים
  choice: चल रहा है
  rationale: कृदन्त जारी या अभ्यस्त आचरण बताता है। हिन्दी का प्रगतिशील रूप इस निरन्तरता को व्यक्त करता है।
- source_word: אִישׁ
  choice: तुममें से हर एक
  rationale: एकवचन पुल्लिंग संज्ञा यहाँ पूरे समुदाय के लिए वितरणात्मक है; यह चयन प्रत्येक व्यक्ति पर बल रखता है, पर संबोधन को केवल पुरुषों तक सीमित नहीं करता।
- source_word: אַחֲרֵי שְׁרִרוּת לִבּוֹ הָרָע
  choice: अपने बुरे मन की हठ पर
  rationale: ‘चलना’ रूपक को बनाए रखते हुए אַחֲרֵי को हिन्दी में स्वाभाविक ‘पर चलना’ से व्यक्त किया गया है। שְׁרִרוּת के लिए ‘हठ’ दुराग्रही स्वेच्छाचार को संक्षेप और स्पष्टता से बताता है; לֵב के लिए ‘मन’ हिन्दी में विचार, इच्छा और नैतिक प्रवृत्ति के आन्तरिक केन्द्र को सहज रूप से व्यक्त करता है।
- source_word: לְבִלְתִּי שְׁמֹעַ אֵלָי
  choice: मेरी बात सुनने से इनकार कर रहा है
  rationale: निर्माण न सुनने के उद्देश्य या परिणाम को व्यक्त कर सकता है। प्रसंग में जानबूझकर की गई अवज्ञा प्रमुख है; ‘इनकार’ उस इच्छापूर्वक अस्वीकृति को स्वाभाविक हिन्दी में सामने लाता है।
theological_decisions:
- issue: אִישׁ का वितरणात्मक और व्याकरणतः पुल्लिंग प्रयोग
  choice: तुममें से हर एक
  alternative: हर पुरुष
  rationale: संबोधन पूरे लोगों से है। वितरणात्मक बल को बनाए रखना आवश्यक है, किन्तु अर्थ को केवल पुरुषों तक सीमित करना प्रसंग से उचित नहीं।
- issue: אָבוֹת का पीढ़ीगत अर्थ
  choice: पुरखाओं
  alternative: पिताओं
  rationale: यहाँ तुलना संबोधित लोगों के प्रत्यक्ष पिताओं तक सीमित न होकर पिछली पीढ़ियों से है। ‘पुरखाओं’ उस व्यापक पितृ-पूर्वज अर्थ को स्पष्ट रखता है।
- issue: לְבִלְתִּי की उद्देश्य/परिणामगत अस्पष्टता
  choice: सुनने से इनकार कर रहा है
  alternative: ताकि मेरी बात न सुने
  rationale: मुख्य पाठ प्रसंगगत इच्छापूर्वक अवज्ञा को व्यक्त करता है, जबकि पादटिप्पणी निकटतर उद्देश्यगत रूप देकर मूल की व्याकरणिक सम्भावना सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सुबोध, गरिमापूर्ण भविष्यद्वक्तात्मक लहजा रखा गया है। ‘देखो’ मूल ध्यानाकर्षक कण का जीवित रूप है; ‘चल रहा है’ जारी आचरण को दिखाता है। मुख्य पाठ में ‘मन’ सामान्य हिन्दी के अनुकूल है, जबकि पादटिप्पणी שְׁרִרוּת की वैकल्पिक ‘हठीली कल्पना’ परम्परा को सुरक्षित रखती है।
