  text: וְ/לֹֽא יִפְרְס֥וּ לָ/הֶ֛ם עַל אֵ֖בֶל לְ/נַחֲמ֣/וֹ עַל מֵ֑ת וְ/לֹֽא יַשְׁק֤וּ אוֹתָ/ם֙ כּ֣וֹס תַּנְחוּמִ֔ים עַל אָבִ֖י/ו וְ/עַל אִמּֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/007.yaml
  text: No one will break bread for them in mourning[a], to comfort him for the dead[b], and no one will give them the cup of consolation to drink for his father or for his mother.
translation:
  language: hi
  text: शोक के अवसर पर कोई उनके लिए रोटी नहीं तोड़ेगा[a], किसी मृतक के कारण उसे सांत्वना देने के लिए; और कोई उन्हें उसके पिता या उसकी माता के कारण सांत्वना का प्याला पीने को नहीं देगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शोक के अवसर पर कोई उनके साथ भोजन नहीं बाँटेगा।” इब्रानी क्रिया का शाब्दिक अर्थ “तोड़ना/बाँटना” है और संभवतः शोक के प्रथागत भोजन की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: “सांत्वना का प्याला” संभवतः मृत्यु के बाद शोकाकुलों को सांत्वना देने के लिए दिया जाने वाला प्रथागत पेय था। इब्रानी में “पीने को देना” का कर्म बहुवचन (“उन्हें”) है, जबकि “उसे,” “उसके पिता,” और “उसकी माता” के प्रत्यय एकवचन हैं; अनुवाद में यह वचन-तनाव बनाए रखा गया है।
    reason: cultural_and_grammatical_note
lexical_decisions:
- source_word: יִפְרְסוּ
  choice: रोटी नहीं तोड़ेगा
  rationale: פרס का मूल अर्थ ‘तोड़ना/बाँटना’ है। शोक के प्रसंग में बिना व्यक्त कर्म के यह प्रथा के अनुसार शोक मनाने वालों के साथ भोजन, विशेषतः रोटी, बाँटने की ओर संकेत करता है। हिंदी में ‘रोटी तोड़ना’ मूल ठोस बिंब को बनाए रखता है।
- source_word: עַל אֵבֶל
  choice: विलाप के समय
  rationale: यह पदबंध शोक की परिस्थिति या अवसर बताता है। ‘विलाप के समय’ अंत्येष्टि-संबंधी संदर्भ को स्वाभाविक आधुनिक हिंदी में व्यक्त करता है।
- source_word: לְנַחֲמוֹ
  choice: उसे सांत्वना देगा
  rationale: נחם के पिअेल रूप का अर्थ सांत्वना देना है। प्रत्यय तीसरे पुरुष पुल्लिंग एकवचन है, इसलिए ‘उसे’ रखा गया है, यद्यपि पहले आया ‘उनके’ बहुवचन है।
- source_word: עַל מֵת
  choice: किसी मृतक के कारण
  rationale: यह मृत्यु के कारण उत्पन्न शोक को दर्शाता है। ‘किसी मृतक के कारण’ मूल पदबंध और उसकी अनिश्चितता को बनाए रखता है।
- source_word: יַשְׁקוּ אוֹתָם
  choice: उसे ... पीने को देगा
  rationale: שקה के हिफ़ील का अर्थ किसी को पिलाना या पीने को देना है। मसोराई पाठ में कर्म-सर्वनाम बहुवचन है (‘उन्हें’), जबकि आगे के एकवचन प्रत्ययों के साथ वचन-विसंगति है; सहज हिंदी वाक्य के लिए निकटवर्ती एकवचन शोककर्ता के अनुसार ‘उसे’ रखा गया है और पाठगत तनाव टिप्पणी में बताया गया है।
- source_word: כּוֹס תַּנְחוּמִים
  choice: सांत्वना का प्याला
  rationale: यह संभवतः शोकाकुल व्यक्ति को दिया जाने वाला प्रथागत पेय था। शाब्दिक सांस्कृतिक अभिव्यक्ति को हिंदी में स्पष्ट और गरिमापूर्ण रूप से सुरक्षित रखा गया है।
- source_word: עַל אָבִיו וְעַל אִמּוֹ
  choice: उसके पिता या उसकी माता के लिए
  rationale: दोनों प्रत्यय स्पष्टतः तीसरे पुरुष पुल्लिंग एकवचन हैं। दोहराया गया עַל शोक का कारण बताता है; प्रसंग में ‘या’ प्रत्येक माता-पिता के निधन की अलग स्थिति को सहज रूप से व्यक्त करता है।
theological_decisions:
- issue: बहुवचन और एकवचन सर्वनामों का तनाव
  choice: मुख्य पाठ में आरंभिक बहुवचन ‘उनके’ और बाद के एकवचन ‘उसे/उसके’ को बनाए रखा गया; יַשְׁקוּ אוֹתָם को हिंदी प्रवाह के लिए ‘उसे’ किया गया और टिप्पणी में उसका शाब्दिक बहुवचन बताया गया।
  alternative: सभी सर्वनामों को बहुवचन करके ‘उन्हें/उनके’ करना, अथवा יַשְׁקוּ אוֹתָם को शाब्दिक रूप से ‘उन्हें’ रखना।
  rationale: लְנַחֲמוֹ, אָבִיו और אִמּוֹ के प्रत्यय निर्विवाद एकवचन हैं, जबकि לָהֶם और אוֹתָם बहुवचन हैं। मूल पाठ की वास्तविक व्याकरणिक असमानता को पूरी तरह समतल नहीं करना चाहिए; फिर भी लक्ष्य हिंदी में अस्पष्ट कर्ता-परिवर्तन से बचने के लिए पेय पाने वाले व्यक्ति को निकटवर्ती एकवचन शोककर्ता के रूप में व्यक्त किया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली। ‘विलाप,’ ‘सांत्वना’ और ‘प्याला’ बाइबलीय प्रसंग के अनुकूल हैं, पर अत्यधिक पुरातन नहीं। मूल इब्रानी के सर्वनाम-वचन संबंधी तनाव को मुख्य पाठ और टिप्पणी दोनों में यथासंभव सुरक्षित रखा गया है।
