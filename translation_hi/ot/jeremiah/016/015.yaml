base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/015.yaml
  text: but[a], ‘As Yahweh lives[b], who brought up the children of Israel from the land of the north and from all the lands where he had driven them.’ For I will bring them back to their own land that I gave to their fathers.
translation:
  language: hi
  text: बल्कि[a], ‘याहवे के जीवन की शपथ[b], जिसने इस्राएलियों को उत्तर के देश से और उन सब देशों से निकाल लाया जहाँ उसने उन्हें खदेड़ दिया था।’ और मैं उन्हें उनकी अपनी भूमि पर लौटा लाऊँगा, जिसे मैंने उनके पुरखाओं को दिया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘परन्तु इसके बजाय’; यह पद 14 के शपथ-वाक्य के विपरीत एक नए शपथ-वाक्य को रखता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘याहवे जीवित हैं।’ यह एक इब्रानी शपथ-सूत्र है; हिन्दी में इसका भावार्थ ‘याहवे के जीवन की शपथ’ है।
    reason: idiom_explanation
lexical_decisions:
- source_word: כִּי אִם
  choice: बल्कि
  rationale: यह पद 14 के पुराने शपथ-वाक्य के स्थान पर आने वाले नए शपथ-वाक्य का विरोध और प्रतिस्थापन व्यक्त करता है।
- source_word: חַי יְהוָה
  choice: याहवे के जीवन की शपथ
  rationale: यह प्रचलित इब्रानी शपथ-सूत्र का स्वाभाविक हिन्दी रूप है और उसके शपथात्मक बल को स्पष्ट रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में आए परमेश्वर के विशिष्ट वाचा-नाम को नाम के रूप में प्रस्तुत किया गया है।
- source_word: הֶעֱלָה
  choice: निकाल लाया
  rationale: संदर्भ में यह निर्वासन के देशों से इस्राएल को बाहर लाने की क्रिया है और निर्गमन की प्रतिध्वनि भी बनाए रखती है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: शाब्दिक ‘इस्राएल की संतान’ का आशय आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक ढंग से व्यक्त होता है।
- source_word: מֵאֶרֶץ צָפוֹן
  choice: उत्तर देश से
  rationale: भौगोलिक अभिव्यक्ति को किसी आधुनिक राष्ट्र से जोड़े बिना औपचारिक रूप से निकट रखा गया है।
- source_word: וּמִכֹּל הָאֲרָצוֹת
  choice: और उन सब देशों से
  rationale: बहुवचन ‘देशों/भूमियों’ को स्वाभाविक हिन्दी में व्यक्त करता है और आगे के संबंधवाचक उपवाक्य से जुड़ता है।
- source_word: הִדִּיחָם
  choice: उसने उन्हें खदेड़ दिया था
  rationale: क्रिया के बलपूर्वक निष्कासन के अर्थ और परमेश्वर की स्पष्ट कर्तृता को सुरक्षित रखता है।
- source_word: וַהֲשִׁבֹתִים
  choice: मैं उन्हें ... लौटा लाऊँगा
  rationale: हिफ़ील रूप के ‘वापस ले आना’ अर्थ को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עַל אַדְמָתָם
  choice: उनकी अपनी भूमि पर
  rationale: मूल के भूमि/मिट्टी तथा स्वामित्व दोनों भावों को बनाए रखता है।
- source_word: אֲשֶׁר נָתַתִּי לַאֲבוֹתָם
  choice: जिसे मैंने उनके पुरखाओं को दिया था
  rationale: पैतृक और वाचागत संदर्भ को बनाए रखते हुए ‘पुरखाओं’ से प्राकृतिक हिन्दी दी गई है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: यहाँ मूल में विशिष्ट वाचा-नाम है; उसका लिप्यंतरण नाम की विशिष्टता को सुरक्षित रखता है।
- issue: לַאֲבוֹתָם का लैंगिक और वाचागत अर्थ
  choice: उनके पुरखाओं
  alternative: उनके पूर्वजों / उनके पितरों
  rationale: ‘पुरखाओं’ मूल के पुरुषवाची पैतृक संदर्भ को बनाए रखता है, पर आधुनिक पाठक के लिए ‘पितरों’ से अधिक सहज है।
- issue: निर्वासन में परमेश्वर की कर्तृता
  choice: जहाँ उसने उन्हें खदेड़ दिया था
  alternative: जहाँ वे तितर-बितर हुए थे
  rationale: मूल क्रिया स्पष्ट रूप से परमेश्वर को कर्ता बनाती है; इसे निष्क्रिय या अस्पष्ट नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सार्वजनिक-पाठ के योग्य रूप अपनाया गया है। ‘इस्राएलियों’, ‘उत्तर देश’, ‘खदेड़ दिया’ और ‘पुरखाओं’ सामान्य पाठकों के लिए सहज हैं, जबकि मूल की वाचागत और न्याय-संबंधी गंभीरता बनी रहती है।
