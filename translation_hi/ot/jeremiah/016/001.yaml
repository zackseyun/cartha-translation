  choice: आया
  rationale: यह रूप यहाँ कथा के क्रम में भविष्यद्वाणी के सूत्र का आरम्भ करता है। हिन्दी में अगले पद के साथ ‘वचन ... आया’ स्वाभाविक है; अलग से ‘और ऐसा हुआ’ कहना अनावश्यक रूप से शब्दशः होगा।
- source_word: דְבַר
  choice: वचन
  rationale: भविष्यद्वाणी के सूत्र דְבַר יְהוָה के लिए ‘वचन’ प्रचलित, गरिमापूर्ण और स्रोत की औपचारिकता के निकट है; ‘संदेश’ अपेक्षाकृत अधिक व्याख्यात्मक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय देवनागरी में ध्वन्यंतरित किया गया है।
- source_word: אֵלַי
  choice: मेरे पास
  rationale: אֶל के प्रथम पुरुष एकवचन प्रत्यय का अर्थ ‘मेरी ओर/मेरे पास’ है। वचन के आने के हिन्दी मुहावरे में ‘मेरे पास’ स्वाभाविक है।
- source_word: לֵאמֹר
  choice: ':'
  rationale: यह infinitive आगामी प्रत्यक्ष वचन का परिचय देता है। आधुनिक हिन्दी में वाक्य के अंत का द्विबिंदु ‘यह कहते हुए’ की अपेक्षा अधिक स्वाभाविक ढंग से वही कार्य करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसे उपाधि ‘प्रभु’ से प्रतिस्थापित किए बिना सुरक्षित रखता है; पाठकों के लिए पारंपरिक विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
