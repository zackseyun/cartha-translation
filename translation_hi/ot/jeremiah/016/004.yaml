  text: מְמוֹתֵ֨י תַחֲלֻאִ֜ים יָמֻ֗תוּ לֹ֤א יִסָּֽפְדוּ֙ וְ/לֹ֣א יִקָּבֵ֔רוּ לְ/דֹ֛מֶן עַל פְּנֵ֥י הָ/אֲדָמָ֖ה יִֽהְי֑וּ וּ/בַ/חֶ֤רֶב וּ/בָֽ/רָעָב֙ יִכְל֔וּ וְ/הָיְתָ֤ה נִבְלָתָ/ם֙ לְ/מַאֲכָ֔ל לְ/ע֥וֹף הַ/שָּׁמַ֖יִם וּ/לְ/בֶהֱמַ֥ת הָ/אָֽרֶץ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/004.yaml
  text: They will die of deadly diseases[a]. They will not be mourned or buried. They will become dung on the surface of the ground. They will be consumed by the sword and by famine[c][b], and their carcasses will become food for the birds of the heavens and for the beasts of the earth.
translation:
  language: hi
  text: वे घातक रोगों से मरेंगे[a]। उनके लिए शोक नहीं मनाया जाएगा और उन्हें दफनाया नहीं जाएगा। वे भूमि की सतह पर मल हो जाएंगे[b]। वे तलवार और अकाल से नष्ट हो जाएंगे, और उनके शव[c] आकाश के पक्षियों और धरती के पशुओं का आहार बनेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी अभिव्यक्ति का शाब्दिक अर्थ ‘रोगों की मौतें’ है; आशय गंभीर रोगों से होने वाली मृत्यु है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘भूमि के मुख पर।’
    reason: lexical_alternative
  - marker: c
    text: इब्रानी शब्द का अनुवाद ‘लाशें’ या ‘मृत देह’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מְמוֹתֵי תַחֲלֻאִים יָמֻתוּ
  choice: वे घातक रोगों से मरेंगे
  rationale: शाब्दिक संरचना ‘रोगों की मौतें मरेंगे’ हिन्दी में अस्वाभाविक है। यह इब्रानी मुहावरा गंभीर अथवा प्राणघातक रोगों से होने वाली मृत्यु बताता है; ‘घातक रोगों से मरेंगे’ अर्थ और तीव्रता दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: לֹא יִסָּפְדוּ וְלֹא יִקָּבֵרוּ
  choice: उनके लिए न तो शोक मनाया जाएगा, न उन्हें दफनाया जाएगा
  rationale: ספד मृतक के लिए विलाप अथवा शोक-संस्कार को सूचित करता है। समानांतर निषेध को ‘न तो…न…’ से स्पष्ट और स्वाभाविक रखा गया है।
- source_word: לְדֹמֶן עַל פְּנֵי הָאֲדָמָה יִהְיוּ
  choice: वे भूमि की सतह पर मल बनकर पड़े रहेंगे
  rationale: דֹמֶן का कठोर और अपमानजनक चित्र ‘मल’ से सुरक्षित रहता है। ‘पड़े रहेंगे’ खुले में छोड़े गए, न दफनाए गए शवों की प्रसंगगत स्थिति व्यक्त करता है, जबकि ‘भूमि की सतह’ עַל־פְּנֵי הָאֲדָמָה के चित्र को बनाए रखता है।
- source_word: וּבַחֶרֶב וּבָרָעָב יִכְלוּ
  choice: वे तलवार और अकाल से नष्ट हो जाएंगे
  rationale: כלה यहाँ पूरी तरह समाप्त या नष्ट हो जाने का भाव देता है। ‘तलवार और अकाल’ न्याय के दोनों साधनों को समान रूप से रखता है।
- source_word: נִבְלָתָם
  choice: उनके शव
  rationale: נְבֵלָה निर्जीव देह या लाश को दर्शाता है, विशेषकर ऐसी देह जो पड़ी रह गई हो। ‘शव’ आधुनिक, dignified हिन्दी में स्पष्ट है; संदर्भ की भयावहता आगे पशु-पक्षियों का आहार बनने से बनी रहती है।
- source_word: לְמַאֲכָל לְעוֹף הַשָּׁמַיִם וּלְבֶהֱמַת הָאָרֶץ
  choice: आकाश के पक्षियों और धरती के पशुओं का आहार
  rationale: यह अनुवाद इब्रानी के दो समानांतर समूहों और ‘आहार’ के अर्थ को संक्षिप्त, गरिमापूर्ण हिन्दी में सुरक्षित रखता है।
