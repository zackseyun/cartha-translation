  edition: WLC
  text: וְ/אַתֶּ֖ם שִׁמְע֣וּ דְבַר יְהוָ֑ה כָּל הַ֨/גּוֹלָ֔ה אֲשֶׁר שִׁלַּ֥חְתִּי מִ/ירוּשָׁלִַ֖ם בָּבֶֽלָ/ה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/020.yaml
  text: But you, all the exiles whom I sent from Jerusalem to Babylon, hear the word of Yahweh.
translation:
  language: hi
  text: परन्तु हे उन सभी निर्वासितों, जिन्हें मैंने यरूशलेम से बाबेल भेजा है, तुम यहोवा का वचन सुनो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַתֶּם
  choice: परन्तु ... तुम
  rationale: स्वतंत्र सर्वनाम के साथ संयोजक पिछले कथन से संबोधित निर्वासितों की ओर विरोधसूचक मोड़ दिखाता है; हिन्दी में ‘परन्तु ... तुम’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: שִׁמְעוּ
  choice: सुनो
  rationale: आज्ञार्थक क्रिया का मूल अर्थ ‘सुनना/ध्यान से सुनना’ है। ‘सुनो’ भविष्यद्वाणी के प्रचलित सूत्र को बनाए रखता है और आज्ञापालन का निहित भाव स्पष्ट किए बिना सुरक्षित रखता है।
- source_word: דְבַר יְהוָה
  choice: यहोवा का वचन
  rationale: ‘वचन’ ईश्वरीय कथन के औपचारिक और धर्मवैचारिक भार को बनाए रखता है; יְהוָה को व्यक्तिगत नाम ‘यहोवा’ के रूप में लिप्यंतरित किया गया है।
- source_word: כָּל הַגּוֹלָה
  choice: उन सभी निर्वासितो
  rationale: एकवचन रूप वाला संज्ञापद यहाँ सामूहिक अर्थ में निर्वासित समुदाय को दर्शाता है। सम्बोधन में ‘सभी निर्वासितो’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: אֲשֶׁר שִׁלַּחְתִּי
  choice: जिन्हें मैंने ... भेजा है
  rationale: कर्ता स्वयं यहोवा है और שׁלח का सीधा अर्थ ‘भेजना’ है। पूर्ण वर्तमान निर्वासन के वर्तमान परिणाम को सहज हिन्दी में व्यक्त करता है, बिना ‘निकाल दिया’ जैसा अतिरिक्त बल जोड़े।
- source_word: מִירוּשָׁלִַם בָּבֶלָה
  choice: यरूशलेम से बाबेल
  rationale: מִן उद्गम और दिशासूचक ה गंतव्य बताता है; ‘से ... बाबेल’ हिन्दी में गति की दिशा स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में उपाधि नहीं, चार अक्षरों वाला व्यक्तिगत नाम है। हिन्दी बाइबलीय प्रयोग में परिचित ‘यहोवा’ नाम को नाम के रूप में सुरक्षित रखता है; स्वरांकन ऐतिहासिक रूप से विवादित होने के कारण ‘याहवे’ भी सम्भव लिप्यंतरण है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल है। ‘हे’ सम्बोधन को स्पष्ट करता है; वाक्यक्रम में पहले निर्वासित समुदाय और अंत में मुख्य आज्ञा रखी गई है, जो इब्रानी जोर को पर्याप्त रूप से बनाए रखता है।
