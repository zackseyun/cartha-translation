source:
  edition: WLC
  text: וַֽ/יְהִי֙ דְּבַר יְהוָ֔ה אֶֽל יִרְמְיָ֖הוּ לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/030.yaml
  text: Then the word of Yahweh came to Jeremiah[a], saying,
translation:
  language: hi
  text: 'तब याहवे[a] का वचन यिर्मयाह के पास पहुँचा:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: YHWH; परंपरागत रूप से “प्रभु” अनूदित।'
    reason: ईश्वरीय नाम के मूल रूप और पारंपरिक अनुवाद से पाठक को अवगत कराना।
lexical_decisions:
- source_word: וַיְהִי
  choice: तब … पहुँचा
  rationale: वाव-क्रमिक रूप कथा की अगली घटना प्रस्तुत करता है। आधुनिक हिन्दी में “तब” क्रम को स्वाभाविक रूप से व्यक्त करता है, जबकि “और ऐसा हुआ” यहाँ अनावश्यक रूप से शाब्दिक और भारी होता।
- source_word: דְּבַר
  choice: वचन
  rationale: נבूवतीय सूत्र דְּבַר יְהוָה के लिए “वचन” पारदर्शी और परिचित हिन्दी समतुल्य है तथा “संदेश” की अपेक्षा मूल अभिव्यक्ति के अधिक निकट है।
- source_word: יְהוָה
  choice: याहवे
  rationale: यह इब्रानी चतुरक्षरीय व्यक्तिगत नाम YHWH का आधुनिक हिन्दी लिप्यंतरण है; इसे केवल किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: אֶל
  choice: के पास
  rationale: वचन के किसी व्यक्ति तक आने के हिन्दी मुहावरे में दिशा बताने के लिए “के पास” स्वाभाविक है।
- source_word: יִרְמְיָהוּ
  choice: यिर्मयाह
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: לֵאמֹר
  choice: ':'
  rationale: यह रूप आगे आने वाले प्रत्यक्ष कथन का परिचय देता है। पद के अंत में द्विबिंदु आधुनिक हिन्दी में उसी कार्य को संक्षेप और स्वाभाविक ढंग से निभाता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में व्यक्तिगत नाम YHWH है। “याहवे” उसका लिप्यंतरण करता है और उसे उपाधि “प्रभु” से नहीं बदलता; “यहोवा” पारंपरिक वैकल्पिक उच्चारण है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। “याहवे का वचन” नबूवतीय सूत्र को सुरक्षित रखता है; “पहुँचा” हिन्दी में संदेश के किसी के पास आने का स्वाभाविक प्रयोग है।
