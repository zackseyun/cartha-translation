base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/018.yaml
  text: And I will pursue them with the sword[a], with famine, and with pestilence, and I will make them a horror to all the kingdoms of the earth, a curse, a desolation, an object of hissing[b], and a reproach among all the nations where I have driven them.
translation:
  language: hi
  text: और मैं तलवार, अकाल और महामारी से उनका पीछा करूँगा; और मैं उन्हें पृथ्वी के सभी राज्यों के लिए भय का कारण[a], शाप, उजाड़, तिरस्कार से सीटी बजाने का विषय[b], और उन सभी जातियों के बीच निन्दा बना दूँगा जहाँ मैंने उन्हें खदेड़ दिया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आतंक का कारण।” इब्रानी शब्द भय, आतंक या थरथराहट का भाव व्यक्त कर सकता है; यहाँ वे राज्यों के सामने भयावह उदाहरण बनेंगे।
    reason: lexical_alternative
  - marker: b
    text: या “उपहास की सीटी का पात्र।” इब्रानी शब्द तिरस्कारपूर्ण सीटी या फुफकार को सूचित करता है; अर्थात वे लोगों के उपहास का लक्ष्य होंगे।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָדַפְתִּי אַחֲרֵיהֶם
  choice: मैं ... उनका पीछा करूँगा
  rationale: רדף के साथ אַחֲרֵי का सामान्य अर्थ सक्रिय रूप से पीछा करना है। यह अनवरत दैवी न्याय का भाव रखता है, बिना ‘सताना’ के अधिक संकुचित अर्थ को आरोपित किए।
- source_word: בַּחֶרֶב בָּרָעָב וּבַדָּבֶר
  choice: तलवार, अकाल और महामारी से
  rationale: तीनों संज्ञाएँ यिर्मयाह में न्याय की परिचित त्रयी हैं। ‘से’ साधनवाचक ב को स्वाभाविक हिन्दी में व्यक्त करता है; ‘महामारी’ דֶּבֶר की व्यापक संक्रामक विपत्ति को दर्शाती है।
- source_word: וּנְתַתִּים לְזַוֲעָה
  choice: मैं उन्हें ... भय का कारण बना दूँगा
  rationale: זְוָעָה भय, आतंक या थरथराहट का बोध करा सकता है। सूची के संदर्भ में लोग दूसरे राज्यों के लिए भयावह उदाहरण बनते हैं; ‘भय का कारण’ आधुनिक हिन्दी में इस संबंध को स्पष्ट रखता है।
- source_word: לְכֹל מַמְלְכוֹת הָאָרֶץ
  choice: पृथ्वी के सभी राज्यों के लिए
  rationale: ל परिणाम अथवा संदर्भ का संबंध व्यक्त करता है। ‘के लिए’ हिन्दी में स्वाभाविक है और व्यापक वैश्विक दायरा बनाए रखता है।
- source_word: לְאָלָה
  choice: शाप
  rationale: אָלָה शाप, और कभी शपथ से जुड़े शाप, को सूचित करता है। यहाँ अपमानसूचक पदों की सूची में संक्षिप्त ‘शाप’ पर्याप्त और स्पष्ट है।
- source_word: וּלְשַׁמָּה
  choice: उजाड़
  rationale: שַׁמָּה उजाड़ अथवा भयावह दशा का द्योतक हो सकता है। पहले प्रयुक्त זְוָעָה से lexical distinction बनाए रखने के लिए ‘उजाड़’ चुना गया है।
- source_word: וְלִשְׁרֵקָה
  choice: उपहास की सीटी का पात्र
  rationale: שְׁרֵקָה दर्शकों की तिरस्कारपूर्ण सीटी या फुफकार को सूचित करती है। ‘का पात्र’ स्पष्ट करता है कि वे उस उपहास का लक्ष्य हैं।
- source_word: וּלְחֶרְפָּה
  choice: बदनामी का पात्र
  rationale: חֶרְפָּה सार्वजनिक निंदा, लज्जा और अपमान का अर्थ रखता है। ‘बदनामी का पात्र’ साधारण आधुनिक हिन्दी में लक्ष्यभाव को स्पष्ट करता है।
- source_word: בְּכָל הַגּוֹיִם
  choice: उन सभी जातियों के बीच
  rationale: ב यहाँ सामाजिक-स्थानवाचक है। ‘के बीच’ बिखरी हुई प्रजा की दशा के लिए स्वाभाविक हिन्दी है।
- source_word: אֲשֶׁר הִדַּחְתִּים שָׁם
  choice: जहाँ मैंने उन्हें खदेड़ दिया है
  rationale: हिफ़ील הִדִּיחַ यहाँ दूर भगा देने या तितर-बितर करने की सशक्त क्रिया है। ‘खदेड़ दिया है’ दैवी कर्तृत्व और पूर्ण क्रिया के वर्तमान परिणाम दोनों को बनाए रखता है।
theological_decisions:
- issue: न्याय और निर्वासन में परमेश्वर का प्रत्यक्ष कर्तृत्व
  choice: 'प्रथम पुरुष की स्पष्ट क्रियाएँ रखी गईं: ‘मैं ... पीछा करूँगा,’ ‘मैं ... बना दूँगा,’ और ‘मैंने ... खदेड़ दिया है।’'
  alternative: वाक्यों को कर्मवाच्य या निर्वैयक्तिक बनाकर दैवी कर्तृत्व को नरम करना।
  rationale: इब्रानी पाठ न्याय करने और तितर-बितर करने—दोनों का कर्ता परमेश्वर को स्पष्ट रूप से बताता है। अनुवाद इस धर्मवैचारिक तनाव को कम नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘तलवार, अकाल और महामारी’ भविष्यद्वाणी के औपचारिक स्वर को बनाए रखते हैं। अपमानसूचक श्रृंखला की संचयी लय बचाई गई है, जबकि ‘का पात्र’ जैसे प्रयोग आधुनिक पाठक के लिए आशय स्पष्ट करते हैं।
