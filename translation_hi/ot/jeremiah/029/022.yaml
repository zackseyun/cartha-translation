source:
  edition: WLC
  text: וְ/לֻקַּ֤ח מֵ/הֶם֙ קְלָלָ֔ה לְ/כֹל֙ גָּל֣וּת יְהוּדָ֔ה אֲשֶׁ֥ר בְּ/בָבֶ֖ל לֵ/אמֹ֑ר יְשִֽׂמְ/ךָ֤ יְהוָה֙ כְּ/צִדְקִיָּ֣הוּ וּ/כְ/אֶחָ֔ב אֲשֶׁר קָלָ֥/ם מֶֽלֶךְ בָּבֶ֖ל בָּ/אֵֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/022.yaml
  text: And from them a curse will be taken up by all the exiles of Judah who are in Babylon[a], saying, “May Yahweh make you like Zedekiah and like Ahab, whom the king of Babylon roasted in the fire.”
translation:
  language: hi
  text: 'और उनसे बाबेल में रहनेवाले यहूदा के सभी निर्वासितों में यह शाप-वचन चल पड़ेगा: “याहवे तुम्हारी दशा सिदकिय्याह और अहाब जैसी करे, जिन्हें बाबेल के राजा ने आग में भून डाला था।”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिन्हें बाबेल के राजा ने आग में जला डाला था।” इब्रानी क्रिया का सामान्य अर्थ “जलाना” भी हो सकता है, जबकि “भून डालना” उसकी तीखी छवि को बनाए रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֻקַּח מֵהֶם קְלָלָה
  choice: और उनसे ... यह शाप प्रचलित हो जाएगा
  rationale: לקח का निष्क्रिय रूप यहाँ किसी उदाहरण से शाप-वचन के प्रचलन में आने का मुहावरा है। हिंदी में ‘प्रचलित हो जाएगा’ स्वाभाविक रूप से इस अर्थ को व्यक्त करता है, जबकि ‘उनसे’ स्रोत/उदाहरण के भाव को बनाए रखता है।
- source_word: לְכֹל גָּלוּת יְהוּדָה אֲשֶׁר בְּבָבֶל
  choice: बाबेल में रहनेवाले यहूदा के सभी निर्वासितों के बीच
  rationale: यह वाक्यांश उस निर्वासित समुदाय को बताता है जिसमें यह शाप-वचन बोला जाएगा। ‘निर्वासितों के बीच’ हिंदी में לְ के सामुदायिक दायरे को सहजता से व्यक्त करता है।
- source_word: יְשִׂמְךָ יְהוָה
  choice: याहवे तुम्हारा हाल ... जैसा करे
  rationale: इच्छासूचक/शापसूचक प्रयोग को हिंदी के ‘करे’ से व्यक्त किया गया है। केवल ‘तुम्हें ... जैसा करे’ की अपेक्षा ‘तुम्हारा हाल ... जैसा करे’ अधिक स्वाभाविक और अर्थ-स्पष्ट है।
- source_word: כְּצִדְקִיָּהוּ וּכְאֶחָב
  choice: सिदकिय्याह और अहाब जैसा
  rationale: दोनों व्यक्तियों से तुलना सुरक्षित रखी गई है। हिंदी में एक साझा ‘जैसा’ अनावश्यक पुनरुक्ति से बचते हुए वही तुलना व्यक्त करता है।
- source_word: קָלָם ... בָּאֵשׁ
  choice: जिन्हें ... आग में भून डाला था
  rationale: קלה के पिएल रूप की तीखी और विशिष्ट छवि ‘भून डाला’ से बनी रहती है; ‘जला डाला’ अधिक सामान्य वैकल्पिक अर्थ है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम का लिप्यंतरण किया गया है, उसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम सीधे उपस्थित है। ‘याहवे’ उसका आधुनिक विद्वतापूर्ण लिप्यंतरण है और नाम तथा उपाधि के अंतर को बनाए रखता है।
- issue: शाप-वचन में ईश्वरीय कर्तृत्व
  choice: याहवे तुम्हारा हाल ... जैसा करे
  alternative: तुम्हारा हाल ... जैसा हो
  rationale: मूल में יְהוָה स्पष्ट कर्ता है; इसलिए शाप के कठोर धर्मवैज्ञानिक तनाव को नरम करके निष्क्रिय इच्छा में नहीं बदला गया।
translation_notes:
  register: आधुनिक मानक हिंदी, सहज किंतु गरिमापूर्ण शैली। ‘निर्वासित’, ‘शाप’ और ‘प्रचलित’ सामान्य पाठक के लिए स्पष्ट हैं; प्रत्यक्ष कथन की कठोरता और मूल की सजीव दंड-छवि सुरक्षित रखी गई है।
