  text: घर बनाओ और उनमें रहो[a]; बाग लगाओ और उनके फल खाओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उनमें निवास करो।’ इब्रानी क्रिया स्थायी रूप से बसकर रहने का भाव भी व्यक्त कर सकती है।
