lexical_decisions:
- source_word: בְּנ֥וּ
  choice: बनाओ
  rationale: בנה के काल सामान्य बहुवचन आज्ञार्थक रूप की सीधी आज्ञा है। ‘बनाओ’ स्वाभाविक आधुनिक हिन्दी में इसके बल को ठीक रखता है।
- source_word: בָתִּ֖ים
  choice: घर
  rationale: בית के बहुवचन का ठोस अर्थ निवास-भवन है। हिन्दी में ‘घर’ संख्या की दृष्टि से अचिह्नित रहकर ‘बनाओ’ और ‘उनमें’ के साथ स्वाभाविक रूप से बहुवचन अर्थ देता है।
- source_word: וְ/שֵׁ֑בוּ
  choice: और उनमें रहो
  rationale: ישב का अर्थ बैठना, रहना, निवास करना या टिके रहना हो सकता है। घरों के संदर्भ में ‘उनमें रहो’ सहज है और स्थायी निवास के भाव को अनावश्यक विस्तार के बिना व्यक्त करता है।
- source_word: וְ/נִטְע֣וּ
  choice: बाग लगाओ
  rationale: נטע रोपने या लगाने की सामान्य क्रिया है। हिन्दी में बाग के साथ ‘लगाना’ स्वाभाविक पदबंध है।
- source_word: גַנּ֔וֹת
  choice: बाग
  rationale: גן का सामान्य अर्थ बाग या उद्यान है। अगले वाक्यांश में फल खाने की बात होने पर भी इसे केवल ‘फलोद्यान’ बनाना मूल शब्द के व्यापक अर्थ को संकुचित कर देता।
- source_word: וְ/אִכְל֖וּ
  choice: और ... खाओ
  rationale: אכל की सामान्य बहुवचन आज्ञा का सीधा और स्वाभाविक हिन्दी समतुल्य ‘खाओ’ है।
- source_word: אֶת פִּרְיָֽ/ן
  choice: उनके फल
  rationale: פְּרִי का अर्थ फल या उपज है और स्त्रीलिंग बहुवचन प्रत्यय पीछे के ‘बागों’ की ओर संकेत करता है। ‘उनके फल’ कृषि-बिंब और व्याकरणिक संबंध दोनों बनाए रखता है।
