translation:
  language: hi
  text: तुम मुझे खोजोगे और मुझे पाओगे,[a] जब तुम अपने पूरे मन से मुझे ढूँढ़ोगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि तुम मुझे खोजोगे और पाओगे, यदि तुम अपने पूरे मन से मुझे ढूँढ़ोगे।” यहाँ इब्रानी संयोजक כִּי को कई परस्पर सम्बद्ध अर्थों में समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִקַּשְׁתֶּם
  choice: तुम मुझे खोजोगे
  rationale: पिएल रूप भावी प्रतिज्ञा के क्रम में जान-बूझकर खोजने को व्यक्त करता है; ‘खोजोगे’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: אֹתִי
  choice: मुझे
  rationale: यह प्रथम पुरुष एकवचन प्रत्यय सहित प्रत्यक्ष कर्म है।
- source_word: וּמְצָאתֶם
  choice: और मुझे पाओगे
  rationale: संयोजक सहित काल रूप भावी परिणाम को आगे बढ़ाता है; हिन्दी में स्पष्टता और व्यक्तिगत कर्म बनाए रखने के लिए ‘मुझे’ दोहराया गया है।
- source_word: כִּי
  choice: जब
  rationale: यहाँ כִּי उस परिस्थिति या शर्त का परिचय देता है जिसमें पाने की प्रतिज्ञा पूरी होती है। ‘जब’ मुख्य पाठ में स्वाभाविक है, जबकि ‘क्योंकि’ और ‘यदि’ भी सम्भव हैं।
- source_word: תִדְרְשֻׁנִי
  choice: मुझे ढूँढ़ोगे
  rationale: דרשׁ लगन से खोजने या किसी की ओर मुड़कर उसकी खोज करने का भाव रखता है। पहले क्रिया से हल्का शैलीगत भेद रखने के लिए ‘ढूँढ़ोगे’ चुना गया है, बिना अर्थ को बढ़ाए।
- source_word: בְּכָל
  choice: अपने पूरे
  rationale: בְּ के साथ כָּל सम्पूर्णता व्यक्त करता है; ‘अपने पूरे मन से’ स्वाभाविक हिन्दी मुहावरा है।
- source_word: לְבַבְכֶם
  choice: मन
  rationale: לֵבָב मनुष्य के भीतरी व्यक्तित्व—विचार, इच्छा और भाव—को दर्शाता है। आधुनिक हिन्दी में ‘मन’ इस व्यापक अर्थ को अधिक स्वाभाविक रूप से पहुँचाता है।
theological_decisions:
- issue: परमेश्वर को खोजने और पाने का सम्बन्ध
  choice: पद पूरे मन से खोजने के साथ पाने की वास्तविक प्रतिज्ञा रखता है, पर अनुग्रह, मानवीय सामर्थ्य या उद्धार की व्यापक प्रक्रिया को परिभाषित नहीं करता।
  alternative: इसे मुख्यतः मानवीय उत्तरदायित्व पर बल देने या व्यापक सन्दर्भ में परमेश्वर की सामर्थ्य देने वाली कृपा के रूप में पढ़ा जा सकता है।
  rationale: अनुवाद इब्रानी की प्रतिज्ञा और परिस्थिति/शर्त के निकट रहता है और किसी सम्प्रदायगत निष्कर्ष को आरोपित नहीं करता।
- issue: כִּי का तार्किक सम्बन्ध
  choice: मुख्य पाठ में ‘जब’
  alternative: ‘क्योंकि’ या ‘यदि’
  rationale: इब्रानी संयोजक यहाँ एक से अधिक सम्बद्ध अर्थ दे सकता है। मुख्य पाठ प्रवाहपूर्ण कालगत/परिस्थितिगत अर्थ देता है और पादटिप्पणी वास्तविक अस्पष्टता सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल पर गरिमापूर्ण शैली। ‘हृदय’ की अपेक्षा ‘मन’ सामान्य पाठक के लिए भीतरी व्यक्तित्व का स्वाभाविक बोध देता है। दोनों इब्रानी खोज-क्रियाओं के लिए ‘खोजना’ और ‘ढूँढ़ना’ रखकर पुनरुक्ति तथा सूक्ष्म भेद दोनों सुरक्षित किए गए हैं।
