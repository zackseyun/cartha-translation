base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/027.yaml
  text: And now[a], why have you not rebuked Jeremiah the Anathothite, who is prophesying to you?
translation:
  language: hi
  text: और अब, तुमने अनातोतवासी यिर्मयाह को क्यों नहीं डाँटा, जो तुम लोगों से भविष्यवाणी कर रहा है?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: और अब
  rationale: ו के संयोजक बल और עַתָּה के प्रसंग-सूचक कालगत बल, दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: לָמָּה לֹא גָעַרְתָּ
  choice: तुमने ... क्यों नहीं डाँटा
  rationale: यह प्रश्न किसी कारण की माँग करते हुए विफलता का आरोप लगाता है। גער का अर्थ कड़ी फटकार देना है; ‘डाँटा’ आधुनिक हिन्दी में स्वाभाविक और प्रसंगानुकूल है।
- source_word: בְּיִרְמְיָהוּ
  choice: यिर्मयाह को
  rationale: בְּ यहाँ גער के साथ उस व्यक्ति को चिह्नित करता है जिस पर फटकार लक्षित होनी थी; हिन्दी में कर्मकारक ‘को’ स्वाभाविक है। नाम का प्रचलित हिन्दी रूप ‘यिर्मयाह’ रखा गया है।
- source_word: הָעֲנְּתֹתִי
  choice: अनातोतवासी
  rationale: यह अनातोत से बना जातिवाचक/स्थानवाचक विशेषण है। ‘अनातोतवासी’ उसके हिब्रू रूप को संक्षेप में सुरक्षित रखते हुए सामान्य पाठक के लिए स्पष्ट है।
- source_word: הַמִּתְנַבֵּא
  choice: जो ... भविष्यवाणी सुना रहा है
  rationale: सवर्णित कृदन्त यिर्मयाह की उस समय जारी भविष्यवाणी की गतिविधि बताता है। ‘सुना रहा है’ हिन्दी में वचन के श्रोताओं की ओर निर्देशित होने को स्वाभाविक बनाता है।
- source_word: לָכֶם
  choice: तुम लोगों को
  rationale: לְ यहाँ बहुवचन श्रोताओं की ओर वाणी के निर्देशन को व्यक्त करता है। ‘तुम लोगों को’ उस बहुवचन और संबोधन-दिशा दोनों को स्पष्ट रखता है।
