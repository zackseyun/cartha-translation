lexical_decisions:
- source_word: וּ/קְרָאתֶם אֹתִי
  choice: तुम मुझे पुकारोगे
  rationale: קרא के साथ परमेश्वर को व्यक्तिगत कर्म के रूप में संबोधित किया गया है। ‘मुझे पुकारोगे’ आधुनिक हिन्दी में विनती के लिए परमेश्वर को पुकारने का स्वाभाविक और सीधा रूप है।
- source_word: וַהֲלַכְתֶּם
  choice: आकर
  rationale: הלך का मूल अर्थ ‘जाना/चलना’ है, पर यहाँ आगे आने वाली प्रार्थना के साथ यह परमेश्वर की ओर बढ़कर प्रार्थना करने का भाव देता है। वक्ता परमेश्वर होने के कारण ‘आकर’ हिन्दी में स्वाभाविक है; शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: וְהִתְפַּלַּלְתֶּם אֵלָי
  choice: मुझसे प्रार्थना करोगे
  rationale: פלל का हित्पएल रूप यहाँ परमेश्वर से प्रार्थना करने को दर्शाता है। हिन्दी में ‘मुझसे प्रार्थना करना’ दिशा और संबोधन दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְשָׁמַעְתִּי אֲלֵיכֶם
  choice: मैं तुम्हारी सुनूँगा
  rationale: שמע के साथ אֶל केवल ध्वनि सुनने से आगे ध्यान देकर सुनने या स्वीकार करने का भाव भी रख सकता है। ‘तुम्हारी सुनूँगा’ स्वाभाविक हिन्दी है और अनुकूल प्रत्युत्तर का संकेत देते हुए उसके स्वरूप को आवश्यकता से अधिक निश्चित नहीं करती।
theological_decisions:
- issue: प्रार्थना के प्रति परमेश्वर का प्रत्युत्तर
  choice: मैं तुम्हारी सुनूँगा
  alternative: मैं तुम्हारी प्रार्थना पर ध्यान दूँगा / मैं तुम्हारी विनती स्वीकार करूँगा
  rationale: इब्रानी שמע में सुनने, ध्यान देने और मानने के अर्थ-क्षेत्र परस्पर जुड़े हैं। ‘तुम्हारी सुनूँगा’ परमेश्वर की प्रत्युत्तरशीलता को व्यक्त करता है, पर यह नहीं जोड़ता कि हर माँगी हुई बात ठीक उसी रूप में पूरी होगी; इस प्रकार मूल पाठ का अर्थगत और धर्मवैज्ञानिक तनाव बना रहता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘तुम’ बहुवचन समुदाय को संबोधित करता है। वाक्य की क्रमिक लय बनाए रखने के लिए ‘और’ दोहराया गया है, जबकि ‘आकर’ ने इब्रानी गति-सूचक क्रिया और प्रार्थना को स्वाभाविक हिन्दी में जोड़ा है।
