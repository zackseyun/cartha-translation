base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/031.yaml
  text: 'Send to all the exiles[a], saying, ‘Thus says Yahweh concerning Shemaiah the Nehelamite: Because Shemaiah has prophesied to you, though I did not send him, and has made you trust in a lie,’'
translation:
  language: hi
  text: 'सब निर्वासितों को यह संदेश भेजकर कह, “याहवे शमायाह नहलामी[a] के विषय में यह कहता है: चूँकि शमायाह ने तुमसे भविष्यवाणी की, यद्यपि मैंने उसे नहीं भेजा, और उसने तुम्हें झूठ पर भरोसा करने के लिए प्रेरित किया है—”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: संभवतः “स्वप्न देखने वाला शमायाह।” ‘नहलामी’ किसी स्थान या कुल का नाम भी हो सकता है; इसकी व्युत्पत्ति निश्चित नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלַח עַל כָּל הַגּוֹלָה
  choice: सब निर्वासितों को यह संदेश भेज
  rationale: एकवचन आज्ञार्थक क्रिया को सीधे आदेश के रूप में रखा गया है। पत्र-संदर्भ में עַל को संदेश पाने वालों की दिशा बताने वाला मानकर निर्वासित समुदाय को संबोधित किया गया है।
- source_word: כֹּה אָמַר יְהוָה
  choice: याहवे ... यह कहता है
  rationale: भविष्यद्वाणी के प्रचलित संदेशवाहक-सूत्र को स्वाभाविक आधुनिक हिन्दी में रखा गया और יהוה को उसके व्यक्तिगत नाम ‘याहवे’ से व्यक्त किया गया है।
- source_word: אֶל שְׁמַעְיָה הַנֶּחֱלָמִי
  choice: नहेलामी शमायाह के विषय में
  rationale: यहाँ אֶל संदेश के प्राप्तकर्ता के बजाय कथन का विषय बताता है। अनिश्चित उपाधि/वंश-सूचक शब्द को अर्थ निर्धारित किए बिना लिप्यंतरित किया गया है।
- source_word: נִבָּא לָכֶם
  choice: तुम्हारे सामने भविष्यवाणी की
  rationale: לָכֶם का आशय उन लोगों को संबोधित करके भविष्यवाणी करना है; ‘तुम्हारे सामने’ आधुनिक हिन्दी में इसे सहज ढंग से व्यक्त करता है।
- source_word: וַאֲנִי לֹא שְׁלַחְתִּיו
  choice: जबकि मैंने उसे नहीं भेजा था
  rationale: 'संयोजक का विरोधात्मक भाव सुरक्षित है: शमायाह ने भविष्यवाणी की, पर उसे याहवे ने नहीं भेजा था।'
- source_word: וַיַּבְטַח אֶתְכֶם עַל שָׁקֶר
  choice: उसने तुम्हें झूठ पर भरोसा दिलाया है
  rationale: हिफ़ील रूप का कारणवाचक अर्थ रखा गया है—शमायाह ने लोगों को झूठी बात पर भरोसा करने के लिए प्रेरित किया।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु; यहोवा
  rationale: मूल पाठ में प्रयुक्त चार अक्षरों वाले व्यक्तिगत ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- issue: יַעַן אֲשֶׁר से आरम्भ होने वाले अधूरे न्याय-वाक्य की संरचना
  choice: ‘चूँकि ...—’ के रूप में अगले पद तक खुला रखा
  alternative: वाक्य को इसी पद में पूरा कर देना
  rationale: कारण का परिणाम अगले पद में आता है। डैश पाठक को अधूरी संरचना का संकेत देता है और मूल की वाक्यगत तथा धर्मवैचारिक प्रत्याशा को कृत्रिम रूप से पूरा नहीं करता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘निर्वासित’, ‘भविष्यवाणी’ और ‘भरोसा’ जैसे सामान्यतः समझे जाने वाले शब्द चुने गए हैं। मूल वाक्य अगले पद में पूरा होता है, इसलिए अंतिम डैश जानबूझकर रखा गया है।
