  rationale: סָרָה विद्रोह, विमुखता या धर्मत्याग का भाव रखता है; मुख्य पाठ व्यापक अर्थ को बनाए रखता है और विकल्प पादटिप्पणी में दिए गए हैं।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में वाचा का विशिष्ट नाम सीधे प्रयुक्त है। हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाने जाने वाले यहोवा रूप द्वारा इसे सामान्य उपाधि प्रभु में बदलने के बजाय नाम के रूप में सुरक्षित रखा गया है।
- issue: सָרָה की वाचागत तीव्रता
  choice: विद्रोह
  alternative: धर्मत्याग या बगावत
  rationale: शब्द में वाचा से विमुख होने और परमेश्वर के विरुद्ध उठने दोनों का तनाव है। विद्रोह इसे किसी विशिष्ट सम्प्रदायगत अर्थ तक सीमित किए बिना व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण भविष्यद्वाणीपरक स्तर रखा गया है। वाक्य सामान्य पाठक के लिए स्पष्ट है, किन्तु “देखो,” “भलाई देखना,” और घोषणा-सूत्र जैसे मूल बिम्ब तथा शैलीगत संकेत सुरक्षित हैं।
