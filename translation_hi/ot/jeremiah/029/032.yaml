base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/032.yaml
  text: 'Therefore thus says Yahweh: Behold[a], I am about to punish Shemaiah the Nehelamite and his offspring. He will not have a man dwelling among this people, nor will he see the good that I am doing for my people, declares Yahweh[b], because he has spoken rebellion against Yahweh.'
translation:
  language: hi
  text: 'इसलिए याहवे यों कहता है: देखो, मैं नेहलामी शमायाह[a] और उसके वंश को दण्ड देने वाला हूँ। उसके लिए इस प्रजा के बीच रहने वाला कोई पुरुष न होगा, और जो भलाई मैं अपनी प्रजा के लिए करने वाला हूँ, उसे वह नहीं देखेगा—याहवे की यह घोषणा है—क्योंकि उसने याहवे के विरुद्ध विद्रोह[b] की बातें कही हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “नेहलामी” सम्भवतः “स्वप्न देखने वाला” भी हो सकता है; इब्रानी उपाधि הַנֶּחֱלָמִי का ठीक अर्थ अनिश्चित है, इसलिए मुख्य पाठ में इसे नामसूचक पद के रूप में रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: “विद्रोह” के लिए प्रयुक्त इब्रानी शब्द का अर्थ “धर्मत्याग,” “विमुखता” या “बगावत” भी हो सकता है।
    reason: lexical_alternative
