base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/006.yaml
  text: Take wives and father sons and daughters[a]; and take wives for your sons, and give your daughters to men, so that they may bear sons and daughters; multiply there[c][b], and do not decrease.
translation:
  language: hi
  text: स्त्रियों से विवाह करो और बेटे-बेटियाँ पैदा करो[a]। अपने बेटों के लिए पत्नियाँ लाओ, और अपनी बेटियों का विवाह पुरुषों से कर दो[b], ताकि वे बेटे-बेटियाँ जनें। वहाँ संख्या में बढ़ो और संख्या में कम न हो जाओ[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक औपचारिक रूप में, “बेटे-बेटियाँ उत्पन्न करो।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप में, “अपनी बेटियों को पुरुषों को दो”; प्रसंग में इसका अर्थ उनका विवाह कराना है।
    reason: lexical_alternative
  - marker: c
    text: या, “थोड़े न हो जाओ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: קְחוּ נָשִׁים
  choice: स्त्रियों से विवाह करो
  rationale: इब्रानी मुहावरे का अर्थ स्त्रियों को सामान्य रूप से ‘लेना’ नहीं, बल्कि उनसे विवाह करना है। यह रूप आधुनिक हिन्दी में स्वाभाविक है और आज्ञार्थक भाव बनाए रखता है।
- source_word: וְהוֹלִידוּ
  choice: उत्पन्न करो
  rationale: हिफ़ील रूप पुरुष कर्ताओं के संबंध में संतान उत्पन्न करने का भाव देता है। ‘उत्पन्न करो’ इस कारणवाचक अर्थ को बनाए रखता है, जबकि अधिक सहज विकल्प पादटिप्पणी में दिया गया है।
- source_word: בָּנִים וּבָנוֹת
  choice: बेटे-बेटियाँ
  rationale: मूल पाठ दोनों को स्पष्ट रूप से नाम देता है; सामान्यीकृत ‘संतान’ की अपेक्षा यह अधिक सटीक है।
- source_word: וּקְחוּ לִבְנֵיכֶם נָשִׁים
  choice: अपने बेटों के लिए पत्नियाँ लाओ
  rationale: विवाह-संबंधी अर्थ को स्पष्ट रखते हुए यह इब्रानी संरचना के निकट और हिन्दी में बोधगम्य है।
- source_word: וְאֶת בְּנוֹתֵיכֶם תְּנוּ לַאֲנָשִׁים
  choice: अपनी बेटियों को पुरुषों के साथ ब्याह दो
  rationale: ‘पुरुषों को देना’ मूल का शाब्दिक रूप है, पर प्रसंग विवाह का है। चुना गया रूप दोनों बातों को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְתֵלַדְנָה
  choice: ताकि वे ... जनें
  rationale: पूर्ववर्ती आज्ञाओं के बाद यह क्रिया अपेक्षित परिणाम या उद्देश्य व्यक्त कर सकती है; ‘ताकि’ उस संबंध को स्वाभाविक हिन्दी में दिखाता है।
- source_word: וּרְבוּ שָׁם
  choice: वहाँ संख्या में बढ़ो
  rationale: רבה यहाँ जनसंख्या में वृद्धि को सूचित करता है और שָׁם निर्वासन के उसी स्थान की ओर संकेत करता है।
- source_word: וְאַל תִּמְעָטוּ
  choice: कम न हो जाओ
  rationale: यह संख्या में घटने या थोड़े हो जाने के निषेध को व्यक्त करता है और ‘संख्या में बढ़ो’ के साथ स्पष्ट विरोध बनाता है।
