source:
  edition: WLC
  text: תַּ֛חַת אֲשֶֽׁר לֹא שָׁמְע֥וּ אֶל דְּבָרַ֖/י נְאֻם יְהוָ֑ה אֲשֶׁר֩ שָׁלַ֨חְתִּי אֲלֵי/הֶ֜ם אֶת עֲבָדַ֤/י הַ/נְּבִאִים֙ הַשְׁכֵּ֣ם וְ/שָׁלֹ֔חַ וְ/לֹ֥א שְׁמַעְתֶּ֖ם נְאֻם יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/019.yaml
  text: because they did not listen to my words[a], declares Yahweh, which I sent to them by my servants the prophets, rising early and sending them, and you did not listen[b], declares Yahweh.
translation:
  language: hi
  text: क्योंकि उन्होंने मेरी बातों पर ध्यान नहीं दिया—याहवे की यह घोषणा है—जिन्हें मैंने अपने सेवक नबियों के द्वारा उनके पास बार-बार भेजा; पर तुमने ध्यान नहीं दिया—याहवे की यह घोषणा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַּחַת אֲשֶׁר
  choice: क्योंकि
  rationale: यह पद पिछले कथन में आए न्याय का कारण बताता है; ‘क्योंकि’ आधुनिक हिन्दी में इसके कारणवाचक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: שָׁמְעוּ / שְׁמַעְתֶּם
  choice: ध्यान नहीं दिया
  rationale: אֶל के साथ שׁמע का अर्थ केवल ध्वनि सुनना नहीं, बल्कि कही हुई बात को ग्रहण करना और उस पर ध्यान देना है। यह चयन ‘आज्ञा नहीं मानी’ की अपेक्षा मूल की श्रवण-संबंधी छवि को अधिक खुला रखता है।
- source_word: אֶל דְּבָרַי
  choice: मेरी बातों पर
  rationale: ‘बातों’ से मूल के बहुवचन דְּבָרַי को बनाए रखा गया है; ‘ध्यान देना’ के साथ हिन्दी में ‘पर’ स्वाभाविक परसर्ग है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: यह गंभीर नबूवत-सूचक सूत्र है। ‘घोषणा’ उसके औपचारिक और अधिकारपूर्ण स्वर को बनाए रखती है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: שָׁלַחְתִּי אֲלֵיהֶם אֶת עֲבָדַי הַנְּבִאִים
  choice: जिन्हें मैं अपने सेवकों, नबियों के द्वारा उनके पास … भेजता रहा
  rationale: ‘सेवकों, नबियों’ की समानाधिकरण रचना सुरक्षित है और ‘के द्वारा’ स्पष्ट करता है कि परमेश्वर की बातें नबियों के माध्यम से भेजी गईं।
- source_word: הַשְׁכֵּם וְשָׁלֹחַ
  choice: बार-बार भेजता रहा
  rationale: यह इब्रानी मुहावरा तत्पर और निरंतर दोहराए गए भेजने को व्यक्त करता है। मुख्य पाठ में स्वाभाविक हिन्दी अर्थ दिया गया है और शाब्दिक चित्र को पाद-टिप्पणी में सुरक्षित रखा गया है।
- source_word: וְלֹא שְׁמַעְתֶּם
  choice: पर तुमने ध्यान नहीं दिया
  rationale: ‘पर’ प्रसंग का विरोधात्मक बल स्वाभाविक हिन्दी में व्यक्त करता है। मूल में तीसरे पुरुष बहुवचन से दूसरे पुरुष बहुवचन की ओर हुआ तीखा परिवर्तन ज्यों का त्यों रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम है; ‘याहवे’ उसे उपाधि में बदले बिना प्रस्तुत करता है।
- issue: तीसरे पुरुष से दूसरे पुरुष की ओर परिवर्तन
  choice: ‘उन्होंने’ … ‘तुमने’ को बनाए रखना
  alternative: दोनों खंडों को एक ही पुरुष में कर देना
  rationale: मसोराई पाठ पहले ‘उन्होंने’ कहता है और फिर श्रोताओं को सीधे ‘तुमने’ कहकर संबोधित करता है। इस अलंकारिक तनाव को समतल नहीं किया गया।
- issue: הַשְׁכֵּם וְשָׁלֹחַ में परमेश्वर के भोर को उठने का चित्र
  choice: मुख्य पाठ में मुहावरे का अर्थ, पाद-टिप्पणी में शाब्दिक चित्र
  alternative: मुख्य पाठ में ‘सवेरे जल्दी उठकर भेजता रहा’
  rationale: शाब्दिक चित्र सार्थक है, पर आधुनिक हिन्दी में अकेला रखने पर समय-संबंधी कथन समझा जा सकता है। अर्थ और मूल रूप दोनों को साथ सुरक्षित रखने के लिए पाद-टिप्पणी दी गई है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी अपनाई गई है। वाक्य में नबूवत-सूचक घोषणा की गंभीरता रखी गई है; अत्यधिक संस्कृतनिष्ठ शब्दावली और अनावश्यक रूप से पुरातन बाइबिलीय शैली से बचा गया है।
