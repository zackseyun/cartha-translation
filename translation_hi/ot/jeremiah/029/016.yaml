base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/016.yaml
  text: For thus says Yahweh concerning the king who sits on the throne of David[a], and concerning all the people who dwell in this city—your brothers who did not go out with you into exile—
translation:
  language: hi
  text: 'क्योंकि यहोवा उस राजा के विषय में, जो दाऊद के सिंहासन पर बैठा है, और इस नगर में रहने वाले सब लोगों के विषय में—तुम्हारे वे भाइयों[a] जो तुम्हारे साथ निर्वासन में नहीं गए—यूं कहता है:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हारे स्वजनों।” इब्रानी में शाब्दिक रूप से “तुम्हारे भाई” है; यहाँ यह शब्द व्यापक अर्थ में साथी यहूदियों को भी सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण अथवा स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ उसके संबंधसूचक बल को बनाए रखता है।
- source_word: כֹה אָמַר
  choice: यह कहता है
  rationale: भविष्यद्वाणी के सूत्र का स्वाभाविक आधुनिक हिन्दी रूप; वाक्य-विन्यास में इसे अंत में रखने से लम्बे विषय-वाक्यांश के बावजूद कथन स्पष्ट रहता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत नाम יהוה को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से नहीं।
- source_word: אֶל
  choice: के विषय में
  rationale: यहाँ यह प्रत्यक्ष संबोधन नहीं, बल्कि आने वाली घोषणा के विषय को सूचित करता है।
- source_word: הַמֶּלֶךְ הַיּוֹשֵׁב אֶל כִּסֵּא דָוִד
  choice: उस राजा के विषय में, जो दाऊद के सिंहासन पर बैठा है
  rationale: राजा की निश्चितता, वर्तमान शासन और दाऊदी राजवंशीय संकेत को सुरक्षित रखता है।
- source_word: וְאֶל כָּל הָעָם הַיּוֹשֵׁב בָּעִיר הַזֹּאת
  choice: और इस नगर में रहने वाले सब लोगों के विषय में
  rationale: सामूहिक एकवचन कृदंत को हिन्दी में स्वाभाविक बहुवचन संबंधवाचक संरचना से व्यक्त किया गया है; כָּל का ‘सब’ भी सुरक्षित है।
- source_word: אֲחֵיכֶם
  choice: तुम्हारे भाइयों
  rationale: मूल का पुल्लिंग बहुवचन संबंधसूचक शब्द सीधे रखा गया है; संदर्भ में इसका व्यापक सामुदायिक अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: אֲשֶׁר לֹא יָצְאוּ אִתְּכֶם בַּגּוֹלָה
  choice: जो तुम्हारे साथ निर्वासन में नहीं गए
  rationale: सक्रिय क्रिया ‘गए’ और निर्वासन के प्रसंग दोनों को सहज हिन्दी में व्यक्त करता है, बिना यह जोड़ने के कि उन्हें किसने भेजा या ले गया।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में व्यक्तिगत चतुरक्षरीय नाम है; ‘यहोवा’ उसे उपाधि में बदलने के बजाय नाम के रूप में प्रस्तुत करता है और हिन्दी बाइबिलीय प्रयोग में सहज पहचाना जाता है।
- issue: אֲחֵיכֶם का लिंग और व्यापक संदर्भ
  choice: तुम्हारे भाइयों
  alternative: तुम्हारे जाति-भाइयों / तुम्हारे स्वजनों
  rationale: मुख्य पाठ मूल के पुल्लिंग बहुवचन ‘भाइयों’ को बनाए रखता है; संभावित व्यापक अर्थ—साथी यहूदी या स्वजन—पादटिप्पणी में दिया गया है।
- issue: पद 16 की वाक्यगत अपूर्णता
  choice: अंत में द्विबिंदु रखकर अगले पद से संबंध बनाए रखा
  alternative: पूर्ण विराम लगाकर स्वतंत्र वाक्य बनाना
  rationale: इब्रानी में यह पद आने वाली घोषणा की भूमिका है और उसका कथ्य अगले पद में जारी रहता है; द्विबिंदु इस वाक्यगत निर्भरता को स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। ‘दाऊद का सिंहासन,’ ‘निर्वासन’ और ‘यहोवा’ जैसे बाइबिलीय पद सुरक्षित रखे गए हैं। मुख्य पाठ में पादटिप्पणी-चिह्न [a] ठीक संबंधित शब्द के बाद दिया गया है।
