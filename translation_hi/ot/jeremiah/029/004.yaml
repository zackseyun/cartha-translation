source:
  edition: WLC
  text: כֹּ֥ה אָמַ֛ר יְהוָ֥ה צְבָא֖וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֑ל לְ/כָל הַ֨/גּוֹלָ֔ה אֲשֶׁר הִגְלֵ֥יתִי מִ/ירוּשָׁלִַ֖ם בָּבֶֽלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/004.yaml
  text: 'Thus says Yahweh of hosts[a], the God of Israel, to all the exiles whom I have sent into exile from Jerusalem to Babylon:'
translation:
  language: hi
  text: 'सेनाओं का याहवे, इस्राएल का परमेश्वर, उन सभी निर्वासितों से यह कहता है, जिन्हें मैंने यरूशलेम से बाबेल में निर्वासन में भेजा है[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, “जिन्हें मैंने यरूशलेम से बाबेल में निर्वासित किया है।” इब्रानी क्रिया कारणवाचक है: “निर्वासन में जाने का कारण बनाना/निर्वासित करना।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: यह कहता है
  rationale: यह इब्रानी भविष्यद्वाणी-संदेश का प्रचलित सूत्र है। हिन्दी में वर्तमान काल का यह रूप औपचारिक गरिमा और स्वाभाविकता दोनों बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम का लिप्यंतरण किया गया है; इसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: צְבָאוֹת
  choice: सेनाओं का
  rationale: यह बहुवचन संज्ञा का सीधा अर्थ सुरक्षित रखता है। ‘सर्वशक्तिमान’ अर्थपरक व्याख्या होती, जबकि ‘सेनाओं का’ मूल उपाधि की ठोस छवि बनाए रखता है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल का परमेश्वर
  rationale: संबंधवाचक इब्रानी पदबंध का सीधा और स्वाभाविक हिन्दी अनुवाद।
- source_word: הַגּוֹלָה
  choice: निर्वासितों
  rationale: इब्रानी में यह सामूहिक एकवचन है, पर इसका आशय निर्वासन में गए लोगों के समुदाय से है; हिन्दी बहुवचन अर्थ को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: הִגְלֵיתִי
  choice: मैंने ... निर्वासन के लिए भेजा है
  rationale: गला धातु के हिफ़ील रूप की कारणवाचक शक्ति—निर्वासन में जाने का कारण बनना अथवा निर्वासित करना—को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִירוּשָׁלִַם בָּבֶלָה
  choice: यरूशलेम से बाबेल में
  rationale: מִן प्रस्थान-बिंदु और दिशासूचक ה गति के गंतव्य को दर्शाते हैं; हिन्दी में ‘से ... में’ निर्वासन की अवस्था और गंतव्य दोनों को सहजता से व्यक्त करता है।
theological_decisions:
- issue: निर्वासन में परमेश्वर की सक्रिय भूमिका
  choice: ‘जिन्हें मैंने ... निर्वासन के लिए भेजा है’ कहकर प्रथम पुरुष में परमेश्वर की सक्रिय भूमिका बनाए रखी गई है।
  alternative: ‘जिन्हें मैंने निर्वासन में जाने दिया’ या ‘जिन्हें नबूकदनेस्सर निर्वासन में ले गया।’
  rationale: इब्रानी पाठ निर्वासन की अंतिम कारकता स्पष्ट रूप से याहवे को देता है। अनुवाद इसे केवल अनुमति के रूप में नरम नहीं करता और न सारी कारकता बाबेल के राजा को सौंपता है।
- issue: יהוה वाचा-नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में प्रयुक्त व्यक्तिगत ईश्वरीय नाम को उपाधि से बदलने के बजाय उसके प्रचलित विद्वत्तापूर्ण उच्चारण का देवनागरी लिप्यंतरण रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, किंतु भविष्यद्वाणी-संदेश की गरिमा बनाए रखती है। वाक्य-विन्यास हिन्दी में स्वाभाविक रखने के लिए वक्ता की उपाधियाँ पहले और ‘यह कहता है’ उसके बाद रखा गया है। ‘बाबेल’ मूल इब्रानी स्थान-नाम के निकट रूप में चुना गया है।
