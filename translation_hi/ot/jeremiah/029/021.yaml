source:
  edition: WLC
  text: כֹּֽה אָמַר֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל אֶל אַחְאָ֤ב בֶּן קֽוֹלָיָה֙ וְ/אֶל צִדְקִיָּ֣הוּ בֶן מַֽעֲשֵׂיָ֔ה הַֽ/נִּבְּאִ֥ים לָ/כֶ֛ם בִּ/שְׁמִ֖/י שָׁ֑קֶר הִנְ/נִ֣י נֹתֵ֣ן אֹתָ֗/ם בְּ/יַד֙ נְבֽוּכַדְרֶאצַּ֣ר מֶֽלֶךְ בָּבֶ֔ל וְ/הִכָּ֖/ם לְ/עֵינֵי/כֶֽם־־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/021.yaml
  text: 'Thus says Yahweh of hosts[a], the God of Israel, concerning Ahab son of Kolaiah and Zedekiah son of Maaseiah, who are prophesying a lie to you in my name: Behold, I am giving them into the hand of Nebuchadnezzar king of Babylon, and he will strike them down before your eyes.'
translation:
  language: hi
  text: 'सेनाओं का याहवे, इस्राएल का परमेश्वर, अहाब, कोलायाह के पुत्र, और सिदकिय्याह, मासेयाह के पुत्र, के विषय में यह कहता है, जो मेरे नाम से तुम लोगों को झूठी भविष्यवाणी सुनाते हैं: देखो, मैं उन्हें बाबेल के राजा नबूकदनेस्सर[a] के हाथ में सौंप रहा हूँ, और वह तुम्हारी आँखों के सामने उन पर प्रहार करेगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में इस नाम का रूप “नबूकदरेस्सर” है; “नबूकदनेस्सर” इसका प्रचलित हिंदी रूप है।
    reason: मूल इब्रानी वर्तनी और पाठक-परिचित नाम-रूप, दोनों को दर्ज करना।
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: यह कहता है
  rationale: यह नबी-संदेश का मानक सूत्र है। हिंदी वाक्यक्रम में दिव्य उपाधि के बाद ‘यह कहता है’ स्वाभाविक और गरिमापूर्ण है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का याहवे
  rationale: याहवे व्यक्तिगत दिव्य नाम को सुरक्षित रखता है; ‘सेनाओं का’ צְבָאוֹת की व्यापक सैन्य और सार्वभौम सत्ता की छवि को बिना अनावश्यक व्याख्या के व्यक्त करता है।
- source_word: אֶל
  choice: के विषय में
  rationale: यहाँ पूर्वसर्ग अहाब और सिदकिय्याह को प्रत्यक्ष संबोधन के बजाय कथन का विषय बनाता है।
- source_word: הַנִּבְּאִים לָכֶם בִּשְׁמִי שָׁקֶר
  choice: जो मेरे नाम से तुमसे झूठी भविष्यवाणी कर रहे हैं
  rationale: कृदंत जारी गतिविधि दिखाता है; ‘मेरे नाम से’ कथित दिव्य अधिकार और ‘झूठी भविष्यवाणी’ שָׁקֶר की वस्तुगत असत्यता व्यक्त करते हैं।
- source_word: הִנְנִי
  choice: देखो, मैं
  rationale: दिव्य घोषणा के बल और निकट आती कार्रवाई पर ध्यान बनाए रखता है, और आधुनिक हिंदी में स्वाभाविक है।
- source_word: נֹתֵן אֹתָם בְּיַד
  choice: उन्हें ... के हाथ में सौंपने वाला हूँ
  rationale: ‘हाथ में’ की इब्रानी छवि को बनाए रखते हुए किसी की सत्ता के अधीन कर देने का मुहावरेदार अर्थ स्पष्ट करता है।
- source_word: וְהִכָּם
  choice: और वह ... उन्हें मारेगा
  rationale: נכה के प्रहार/मारने के अर्थ को रखता है। हिंदी ‘मारेगा’ संदर्भ में घातक दंड का संकेत दे सकता है, पर क्रिया में अलग से ‘मार डालेगा’ जोड़कर परिणाम को अधिक स्पष्ट नहीं करता।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ के व्यक्तिगत दिव्य नाम को किसी उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- issue: וְהִכָּם में दंड की तीव्रता
  choice: उन्हें मारेगा
  alternative: उन्हें मार डालेगा / उन पर प्रहार करेगा
  rationale: संदर्भ कठोर और संभवतः घातक न्याय की ओर संकेत करता है, किंतु क्रिया को अनिवार्य रूप से स्पष्ट ‘हत्या’ में बदलने के बजाय हिंदी की स्वाभाविक अर्थ-विस्तार वाली क्रिया चुनी गई है।
translation_notes:
  register: आधुनिक मानक हिंदी; नबी-वचन की गंभीरता और औपचारिकता सुरक्षित रखते हुए वाक्यरचना को सामान्य पाठकों के लिए सहज रखा गया है। ‘बिन’ संक्षिप्त वंश-सूचक पहचान के रूप में नामों के साथ प्रयुक्त है।
