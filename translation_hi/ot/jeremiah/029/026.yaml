source:
  edition: WLC
  text: יְהוָ֞ה נְתָנְ/ךָ֣ כֹהֵ֗ן תַּ֚חַת יְהוֹיָדָ֣ע הַ/כֹּהֵ֔ן לִֽ/הְי֤וֹת פְּקִדִים֙ בֵּ֣ית יְהוָ֔ה לְ/כָל אִ֥ישׁ מְשֻׁגָּ֖ע וּ/מִתְנַבֵּ֑א וְ/נָתַתָּ֥ה אֹת֛/וֹ אֶל הַ/מַּהְפֶּ֖כֶת וְ/אֶל הַ/צִּינֹֽק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/026.yaml
  text: Yahweh has made you priest in place of Jehoiada the priest[a], to be overseers in the house of Yahweh over every man who is mad and acts as a prophet[c][b], and you should put him into the stocks and the neck iron.
translation:
  language: hi
  text: याहवे ने यहोयादा याजक के स्थान पर तुम्हें याजक नियुक्त किया है, ताकि तुम याहवे के भवन में हर उस आदमी के लिए निगरानी अधिकारी[a] बनो जो पागल हो और नबी की तरह आचरण करता हो[b]। तुम्हें उसे बेड़ियों के यंत्र और गले की लोहे की बेड़ी[c] में डाल देना चाहिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में यहाँ ‘अधिकारी/निरीक्षक’ बहुवचन में है, यद्यपि संबोधन एक व्यक्ति से है।
    reason: व्याकरणिक असंगति और सम्भव सामूहिक पदनाम को सुरक्षित रखना।
  - marker: b
    text: या, “भविष्यवाणी करता हो।” मुख्य पाठ की अभिव्यक्ति पत्र लिखनेवाले के शत्रुतापूर्ण लहजे को सामने लाती है।
    reason: कृदंत का अधिक तटस्थ वैकल्पिक अनुवाद बताना और वक्ता के दृष्टिकोण को स्पष्ट करना।
  - marker: c
    text: इन इब्रानी शब्दों में पहले का अर्थ सम्भवतः ‘स्टॉक्स’ जैसे निरोध-यंत्र से है। दूसरे का ठीक अर्थ अनिश्चित है; सम्भवतः वह लोहे का बंधन या गले का कड़ा था।
    reason: प्राचीन निरोध-उपकरणों के स्वरूप के बारे में शाब्दिक और सांस्कृतिक अनिश्चितता बताना।
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय उसका प्रचलित हिन्दी लिप्यंतरण रखा गया है।
- source_word: נְתָנְךָ כֹהֵן
  choice: तुम्हें याजक नियुक्त किया है
  rationale: भूमिका के साथ נתן का अर्थ यहाँ शाब्दिक ‘देना’ नहीं, बल्कि किसी पद पर नियुक्त करना है।
- source_word: תַּחַת יְהוֹיָדָע הַכֹּהֵן
  choice: यहोयादा याजक के स्थान पर
  rationale: תחת यहाँ अधीनता नहीं, पद में स्थान लेने या उत्तराधिकार का भाव देता है।
- source_word: לִהְיוֹת פְּקִדִים
  choice: निगरानी रखनेवाले अधिकारी रहो
  rationale: פקידים मंदिर में निरीक्षण और अनुशासन के दायित्ववाले अधिकारियों को दर्शाता है। हिन्दी पदबंध स्वाभाविक है और उसके पर्यवेक्षी कार्य को स्पष्ट करता है; इब्रानी के असामान्य बहुवचन की सूचना पादटिप्पणी में दी गई है।
- source_word: בֵּית יְהוָה
  choice: याहवे के भवन में
  rationale: ‘भवन’ मूल के ‘घर’ वाले रूपक को बनाए रखते हुए मंदिर के लिए प्रतिष्ठित और समझने योग्य हिन्दी अभिव्यक्ति है।
- source_word: לְכָל אִישׁ
  choice: हर उस आदमी पर
  rationale: यह पदबंध अधिकारी के अधिकार-क्षेत्र को बताता है और איש के पुल्लिंग एकवचन रूप को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: מְשֻׁגָּע
  choice: पागल हो
  rationale: यह वक्ता द्वारा लगाया गया तिरस्कारपूर्ण आरोप है; अनुवाद उसकी कठोरता को नरम नहीं करता।
- source_word: וּמִתְנַבֵּא
  choice: नबी की तरह आचरण करता हो
  rationale: इस आत्मवाचक कृदंत को ऐसे प्रस्तुत किया गया है कि शमायाह की शत्रुतापूर्ण दृष्टि सुनाई दे, पर अनुवाद स्वयं यह निर्णय न करे कि संबंधित व्यक्ति झूठा नबी है।
- source_word: הַמַּהְפֶּכֶת
  choice: काठ की बेड़ी
  rationale: यह दंड और निरोध के लिए प्रयुक्त ‘stocks’ जैसे उपकरण को दर्शाता है; ‘काठ की बेड़ी’ हिन्दी पाठक को उसका कार्य स्पष्ट करती है।
- source_word: הַצִּינֹק
  choice: लोहे की गर्दन-बेड़ी
  rationale: शब्द का ठीक स्वरूप अनिश्चित है, पर संदर्भ में यह संभवतः गर्दन को जकड़नेवाला लोहे का बंधन था; अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
theological_decisions:
- issue: नबी-संबंधी क्रिया में वक्ता की शत्रुतापूर्ण दृष्टि
  choice: नबी की तरह आचरण करता हो
  alternative: भविष्यवाणी करता हो
  rationale: संदर्भ में यह यिर्मयाह के विरुद्ध लिखा गया आरोप है। मुख्य पाठ वक्ता का तिरस्कार सुनने देता है, लेकिन यह धार्मिक निष्कर्ष नहीं निकालता कि यिर्मयाह वास्तव में नबी नहीं था।
- issue: אִישׁ का लिंग-संबंधी रूप
  choice: हर उस आदमी पर
  alternative: हर व्यक्ति पर
  rationale: इब्रानी में पुल्लिंग एकवचन איש है। ‘आदमी’ उस रूप को बनाए रखता है और इस संदर्भ में सामान्य अधिकार-क्षेत्र को स्वाभाविक हिन्दी में व्यक्त करता है।
- issue: दिव्य नाम का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: व्यक्तिगत दिव्य नाम को उपाधि से बदलने के बजाय लिप्यंतरित करने से मूल पाठ की नाम-संबंधी विशिष्टता बनी रहती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण पर सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘नियुक्त किया,’ ‘निगरानी रखनेवाले अधिकारी’ और ‘काठ की बेड़ी’ जैसे पद शाब्दिक संरचना तथा सहज अर्थ के बीच संतुलन रखते हैं। वक्ता के आरोपपूर्ण स्वर को बनाए रखा गया है, पर उसे अनुवादक का धर्मवैज्ञानिक निर्णय नहीं बनाया गया।
