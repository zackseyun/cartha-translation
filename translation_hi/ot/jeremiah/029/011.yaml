id: JER.29.11
reference: Jeremiah 29:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּי֩ אָנֹכִ֨י יָדַ֜עְתִּי אֶת הַ/מַּחֲשָׁבֹ֗ת אֲשֶׁ֧ר אָנֹכִ֛י חֹשֵׁ֥ב עֲלֵי/כֶ֖ם נְאֻם יְהוָ֑ה מַחְשְׁב֤וֹת שָׁלוֹם֙ וְ/לֹ֣א לְ/רָעָ֔ה לָ/תֵ֥ת לָ/כֶ֖ם אַחֲרִ֥ית וְ/תִקְוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/011.yaml
  text: For I know the plans that I have for you[a], declares Yahweh, plans for peace and not for harm[b], to give you a future and a hope.
translation:
  language: hi
  text: क्योंकि मैं जानता हूँ कि तुम्हारे लिए मेरी क्या योजनाएँ हैं[a]—यह याहवे की घोषणा है—शान्ति की योजनाएँ, हानि की नहीं[b], ताकि मैं तुम्हें एक भविष्य और एक आशा दूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हारे विषय में जो विचार मैं करता हूँ”; “योजनाएँ” उद्देश्यपूर्ण अभिप्राय को व्यक्त करता है। यहाँ “तुम्हारे” बहुवचन है और निर्वासित समुदाय को सम्बोधित करता है।
    reason: lexical_and_grammatical_alternative
  - marker: b
    text: “शान्ति” के लिए प्रयुक्त इब्रानी शब्द में कुशलता, सम्पूर्णता और फलना-फूलना भी सम्मिलित हो सकता है; “हानि” का अनुवाद “विपत्ति” या “दुर्दशा” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन के आधार या कारण को प्रस्तुत करता है और हिन्दी में स्वाभाविक संयोजक है।
- source_word: יָדַעְתִּי
  choice: मैं जानता हूँ
  rationale: इब्रानी पूर्ण रूप यहाँ स्थिर और निश्चित ज्ञान व्यक्त करता है; वर्तमानकालीन हिन्दी इसे स्वाभाविक रूप से व्यक्त करती है।
- source_word: הַמַּחֲשָׁבוֹת ... חֹשֵׁב
  choice: मेरी क्या योजनाएँ हैं
  rationale: מַחֲשָׁבוֹת और חֹשֵׁב में विचार, अभिप्राय या योजना का भाव है। सन्दर्भ में उद्देश्यपूर्ण ईश्वरीय इरादा है; यह हिन्दी मुहावरा अर्थ को स्वाभाविक ढंग से रखता है, यद्यपि मूल की शब्द-पुनरावृत्ति को नहीं दोहराता।
- source_word: עֲלֵיכֶם
  choice: तुम्हारे लिए
  rationale: पूर्वसर्ग यहाँ निर्वासित समुदाय की ओर उन्मुख अभिप्राय को दर्शाता है; 'तुम्हारे लिए' सहज और प्रसंगानुकूल है। बहुवचन सम्बोधन को 'तुम्हारे' से सुरक्षित रखा गया है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: मानक नबूवतीय सूत्र की औपचारिक शक्ति और परमेश्वर के व्यक्तिगत नाम, दोनों को बनाए रखता है।
- source_word: מַחְשְׁבוֹת שָׁלוֹם
  choice: शान्ति की योजनाएँ
  rationale: שָׁלוֹם का सीधा अर्थ शान्ति है, पर इसमें कुशलता, सम्पूर्णता और फलना-फूलना भी समाहित हो सकता है; व्यापकता पादटिप्पणी में दी गई है।
- source_word: וְלֹא לְרָעָה
  choice: हानि की नहीं
  rationale: רָעָה यहाँ नैतिक बुराई से अधिक विपत्ति या अहित को दर्शा सकता है। 'हानि' व्यापक और स्वाभाविक है; अन्य सम्भावनाएँ पादटिप्पणी में हैं।
- source_word: לָתֵת לָכֶם
  choice: ताकि मैं तुम्हें ... दूँ
  rationale: उद्देश्यसूचक infinitive को हिन्दी में स्पष्ट उद्देश्य-वाक्य द्वारा व्यक्त किया गया है।
- source_word: אַחֲרִית
  choice: एक भविष्य
  rationale: शब्द का अर्थ अन्त, परिणाम या आगे का भविष्य हो सकता है; प्रतिज्ञा के प्रसंग में 'भविष्य' सकारात्मक अग्रदृष्टि को स्वाभाविक रूप से व्यक्त करता है।
- source_word: תִקְוָה
  choice: एक आशा
  rationale: यह आशा या अपेक्षा को दर्शाता है; 'एक भविष्य और एक आशा' मूल के युग्म को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में चार-अक्षरीय व्यक्तिगत नाम सीधे प्रयुक्त है। 'याहवे' उसका प्रचलित विद्वत्तापूर्ण लिप्यन्तरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: שָׁלוֹם का अर्थ-क्षेत्र
  choice: शान्ति
  alternative: कुशलता; भलाई; समृद्ध कल्याण
  rationale: मुख्य पाठ में सीधा शब्दार्थ रखा गया है, जबकि इब्रानी शब्द की व्यापकता को पादटिप्पणी सुरक्षित रखती है।
- issue: प्रतिज्ञा के सम्बोधन का दायरा
  choice: बहुवचन 'तुम्हारे/तुम्हें'
  alternative: व्यक्तिवाचक एकवचन सम्बोधन
  rationale: इब्रानी प्रत्यय बहुवचन हैं और तत्काल सम्बोधन निर्वासित समुदाय से है। हिन्दी रूप बहुवचन को सुरक्षित रखता है, बिना इसके आगे के अनुप्रयोग को सिद्धान्ततः सीमित या विस्तृत किए।
- issue: אַחֲרִית का कालगत अर्थ
  choice: भविष्य
  alternative: अन्त; परिणाम
  rationale: सन्दर्भ सकारात्मक भावी परिणाम का है। 'भविष्य' स्वाभाविक है, किन्तु शब्द में अन्तिम परिणाम की छाया भी हो सकती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किन्तु सामान्य पाठक के लिए सहज। 'शान्ति' की पारम्परिक वर्तनी रखी गई है। मूल के सामुदायिक बहुवचन को स्पष्ट रखा गया है और नबूवतीय घोषणा-सूत्र को डैशों के बीच प्रस्तुत किया गया है।
