base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/014.yaml
  text: And I will let myself be found by you[a], declares Yahweh, and I will restore your fortunes and gather you from all the nations and from all the places where I have driven you, declares Yahweh, and I will bring you back to the place from which I sent you into exile.
translation:
  language: hi
  text: मैं तुम्हें मिल जाऊँगा—यहोवा की यह घोषणा है—और मैं तुम्हारी दशा बहाल करूँगा[a]। मैं तुम्हें उन सभी राष्ट्रों और उन सभी स्थानों से इकट्ठा करूँगा जहाँ मैंने तुम्हें खदेड़ दिया था—यहोवा की यह घोषणा है—और तुम्हें उस स्थान पर वापस ले आऊँगा जहाँ से मैंने तुम्हें निर्वासन में भेजा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “मैं तुम्हारी बंधुआई बहाल करूँगा” या “मैं तुम्हारे बंदियों को वापस लाऊँगा।” यह इब्रानी अभिव्यक्ति निर्वासन और विपत्ति की दशा को उलट देने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִמְצֵאתִי לָכֶם
  choice: मैं तुम्हें अपने को पाने दूँगा
  rationale: निफ़अल रूप का मूल अर्थ ‘तुम्हारे द्वारा पाया जाऊँगा’ है। यह स्वाभाविक हिन्दी में निष्क्रिय/आत्मवाचक भाव तथा परमेश्वर की पहल—दोनों को रखता है; ‘अपने को प्रकट करूँगा’ मूल से अधिक व्याख्यात्मक होता।
- source_word: נְאֻם יְהוָה
  choice: यह यहोवा की घोषणा है
  rationale: यह गम्भीर भविष्यद्वक्तात्मक सूत्र है। ‘घोषणा’ उसके औपचारिक बल को रखता है और יְהוָה को व्यक्तिगत नाम ‘यहोवा’ के रूप में प्रस्तुत करता है।
- source_word: וְשַׁבְתִּי אֶת שביתכם
  choice: मैं तुम्हारी दशा फिर से सुधार दूँगा
  rationale: שוב את־שבות/שבית निर्वासन और विपत्ति की स्थिति को उलट देने का मुहावरा है। ‘दशा फिर से सुधार दूँगा’ सामान्य आधुनिक हिन्दी में व्यापक पुनर्स्थापना व्यक्त करता है; अधिक शाब्दिक सम्भावनाएँ पादटिप्पणी में रखी गई हैं।
- source_word: וְקִבַּצְתִּי אֶתְכֶם
  choice: मैं तुम्हें ... इकट्ठा करूँगा
  rationale: קבץ यहाँ बिखरे हुए लोगों को फिर एकत्र करने का बोध देता है; ‘इकट्ठा करना’ स्पष्ट और स्वाभाविक है।
- source_word: מִכָּל הַגּוֹיִם וּמִכָּל הַמְּקוֹמוֹת
  choice: उन सभी राष्ट्रों और उन सभी स्थानों से
  rationale: यह राष्ट्रों तथा dispersion के हर स्थान—दोनों के समानान्तर और व्यापक दायरे को सुरक्षित रखता है।
- source_word: אֲשֶׁר הִדַּחְתִּי אֶתְכֶם שָׁם
  choice: जहाँ मैंने तुम्हें खदेड़ दिया था
  rationale: हिफ़ील נדח में दूर भगा देने या निर्वासित करने का प्रबल भाव है। ‘खदेड़ दिया’ न्याय की कठोरता को ‘तितर-बितर किया’ से अधिक स्पष्ट रखता है।
- source_word: וַהֲשִׁבֹתִי אֶתְכֶם
  choice: तुम्हें ... वापस ले आऊँगा
  rationale: हिफ़ील שוב का कारक भाव है—लोगों को लौटाना। ‘वापस ले आऊँगा’ इसका स्वाभाविक हिन्दी रूप है।
- source_word: אֲשֶׁר הִגְלֵיתִי אֶתְכֶם מִשָּׁם
  choice: जहाँ से मैंने तुम्हें निर्वासन में भेजा था
  rationale: हिफ़ील גלה निर्वासित करने का अर्थ देता है। यह अनुवाद निर्वासन के भाव और कर्ता के रूप में परमेश्वर—दोनों को स्पष्ट रखता है।
theological_decisions:
- issue: שׁוּב אֶת־שְׁבוּת/שְׁבִית पुनर्स्थापना-मुहावरे का अर्थ
  choice: मैं तुम्हारी दशा फिर से सुधार दूँगा
  alternative: मैं तुम्हारी बँधुआई लौटा दूँगा / मैं तुम्हारे बंदियों को वापस ले आऊँगा
  rationale: मुहावरा न्याय, निर्वासन और विपत्ति की दशा उलटने की व्यापक प्रतिज्ञा करता है। अगले वाक्यांश स्वयं लोगों के एकत्र होने और लौटने को स्पष्ट करते हैं, इसलिए मुख्य पाठ में व्यापक मुहावरेदार अर्थ रखा गया है और शाब्दिक अस्पष्टता पादटिप्पणी में सुरक्षित है।
- issue: וְנִמְצֵאתִי לָכֶם में दिव्य पहल और ‘पाए जाने’ का निष्क्रिय भाव
  choice: मैं तुम्हें अपने को पाने दूँगा
  alternative: मैं तुम्हें मिल जाऊँगा / तुम मुझे पा लोगे
  rationale: चुना हुआ रूप मनुष्य के पाने और परमेश्वर द्वारा अपने को पाने देने के बीच मूल पाठ के तनाव को बनाए रखता है; इसे केवल मानवीय खोज की उपलब्धि या केवल प्रकाशन में नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। एकवचन सामूहिक सम्बोधन के अनुरूप ‘तुम’ प्रयुक्त है। लम्बे इब्रानी वाक्य को विराम-चिह्नों से पठनीय बनाया गया है, जबकि दोहराया गया भविष्यद्वक्तात्मक सूत्र और समानान्तर संरचना सुरक्षित हैं।
