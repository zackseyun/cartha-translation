id: JER.29.8
reference: Jeremiah 29:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּי֩ כֹ֨ה אָמַ֜ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אַל יַשִּׁ֧יאוּ לָ/כֶ֛ם נְבִֽיאֵי/כֶ֥ם אֲשֶׁר בְּ/קִרְבְּ/כֶ֖ם וְ/קֹֽסְמֵי/כֶ֑ם וְ/אַֽל תִּשְׁמְעוּ֙ אֶל חֲלֹמֹ֣תֵי/כֶ֔ם אֲשֶׁ֥ר אַתֶּ֖ם מַחְלְמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/008.yaml
  text: 'For thus says Yahweh of hosts[a], the God of Israel: Do not let your prophets who are among you and your diviners deceive you, and do not listen to your dreams that you are causing to be dreamed.'
translation:
  language: hi
  text: 'क्योंकि सेनाओं का याहवे, इस्राएल का परमेश्वर, यह कहता है: तुम्हारे बीच में रहने वाले तुम्हारे भविष्यद्वक्ता और तुम्हारे भावी बताने वाले तुम्हें धोखा न दें; अपने आप को उनसे धोखा खाने मत दो। और अपने उन सपनों पर ध्यान मत दो, जिन्हें तुम दिखवाते हो[a]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो सपने तुम देखते हो।” यहाँ की इब्रानी अभिव्यक्ति कठिन है। इसका संकेत या तो उन सपनों की ओर हो सकता है जिन्हें लोग स्वयं देखते हैं, या उन सपनों की ओर जिन्हें वे किसी अर्थ में बढ़ावा देते हैं अथवा दिखवाते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का याहवे
  rationale: व्यक्तिगत ईश्वरीय नाम को ‘याहवे’ के रूप में रखा गया है और צְבָאוֹת का बहुवचन ‘सेनाओं’ से व्यक्त किया गया है; इससे उपाधि का व्यापक और गरिमापूर्ण आशय बना रहता है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल का परमेश्वर
  rationale: सम्बन्धवाचक इब्रानी संरचना का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: אַל יַשִּׁיאוּ לָכֶם
  choice: तुम्हें धोखा न देने पाएँ
  rationale: निषेधात्मक हिफ़ील का अर्थ किसी के बहकावे या छल का शिकार न होने देना है; यह हिन्दी में आदेश की शक्ति को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: נְבִיאֵיכֶם אֲשֶׁר בְּקִרְבְּכֶם
  choice: तुम्हारे बीच रहने वाले तुम्हारे भविष्यद्वक्ता
  rationale: समुदाय के भीतर उपस्थित भविष्यद्वक्ताओं का भाव स्पष्ट और आधुनिक हिन्दी में रखा गया है।
- source_word: קֹסְמֵיכֶם
  choice: तुम्हारे शकुन-विचार करने वाले
  rationale: קסם के द्वारा निषिद्ध भावी-ज्ञान या शकुन-विचार करने वालों का संकेत है; यह ‘ज्योतिषी’ जैसे अधिक संकीर्ण अर्थ से बचता है।
- source_word: וְאַל תִּשְׁמְעוּ אֶל
  choice: पर भी ध्यान मत दो
  rationale: שׁמע אֶל का आशय केवल सुनना नहीं, बल्कि मानना या उस पर ध्यान देना है; प्रसंग में यही स्वाभाविक हिन्दी है।
- source_word: חֲלֹמֹתֵיכֶם אֲשֶׁר אַתֶּם מַחְלְמִים
  choice: अपने उन सपनों ... जिन्हें तुम उत्पन्न करवा रहे हो
  rationale: מַחְלְמִים हिफ़ील रूप है और सामान्य ‘देख रहे हो’ की अपेक्षा कारणात्मक अर्थ दे सकता है। ‘उत्पन्न करवा रहे हो’ उस असामान्य बल को बनाए रखता है, जबकि कठिनाई और वैकल्पिक समझ फुटनोट में दी गई है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है। लिप्यंतरण ‘याहवे’ नाम को शीर्षक से बदलने के बजाय सुरक्षित रखता है।
- issue: अंतिम उपवाक्य में חלם के हिफ़ील रूप का अर्थ
  choice: कारणात्मक अर्थ—‘जिन्हें तुम उत्पन्न करवा रहे हो’
  alternative: ‘जो सपने तुम देखते हो’
  rationale: रूपात्मक कारणात्मकता को मुख्य पाठ में बनाए रखा गया है, पर कठिन इब्रानी अभिव्यक्ति के साधारण अकर्मक अर्थ को भी फुटनोट में स्वीकार किया गया है; इस प्रकार अस्पष्टता को सिद्धान्तगत रूप से हल नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, प्रत्यक्ष आदेशात्मक रूप अपनाया गया है। ‘शकुन-विचार करने वाले’ सामान्य पाठक के लिए अर्थ खोलता है, जबकि अंतिम वाक्यांश में मूल की असामान्य कारणात्मकता जानबूझकर कुछ तनाव सहित रखी गई है और फुटनोट से स्पष्ट की गई है।
