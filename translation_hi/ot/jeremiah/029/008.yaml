review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the divine name, the title 'of hosts,' Israel's God, the warning about prophets and diviners, and the difficult causative/intensive form in the final clause. The expression 'उत्पन्न करवा रहे हो,' however, is not a natural Hindi way to express causing dreams to be dreamed and can suggest material production rather than the Hebrew's disputed dream-related causation.
  naturalness: The register is generally clear and dignified. 'धोखा न देने पाएँ' is less direct than the Hebrew prohibition and may imply inability rather than the instruction not to allow deception. 'शकुन-विचार करने वाले' is understandable but somewhat cumbersome; 'भावी बताने वाले' is more idiomatic modern Hindi for diviners. The final wording needs to preserve the source difficulty without becoming misleading Hindi.
  terminology: '''याहवे,'' ''सेनाओं,'' ''परमेश्वर,'' and ''भविष्यद्वक्ता'' are appropriate. ''भावी बताने वाले'' accurately conveys קֹסְמִים without limiting it to astrology. The footnote properly preserves the viable simpler alternative and the ambiguity of the Hiphil form.'
  issues:
  - severity: medium
    issue: The prohibition is rendered as 'तुम्हें धोखा न देने पाएँ।'
    rationale: This can mean that the prophets and diviners should fail to deceive the people, rather than directing the people not to permit themselves to be deceived. 'अपने आप को ... धोखा खाने मत दो' directly represents אַל יַשִּׁיאוּ לָכֶם.
  - severity: medium
    issue: '''जिन्हें तुम उत्पन्न करवा रहे हो'' is misleadingly concrete in Hindi.'
    rationale: Dreams are not normally said to be 'produced' in Hindi. 'जिन्हें तुम दिखवाते हो' preserves a causative sense—having dreams seen/dreamed—while remaining intelligible; the footnote continues to signal that the Hebrew is difficult and may instead mean 'the dreams you dream.'
  - severity: low
    issue: '''शकुन-विचार करने वाले'' is awkward modern Hindi.'
    rationale: '''भावी बताने वाले'' is a familiar, broad expression for practitioners of divination and does not over-specify the method.'
