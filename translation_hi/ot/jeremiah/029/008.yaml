  to: 'क्योंकि सेनाओं का याहवे, इस्राएल का परमेश्वर, यह कहता है: तुम्हारे बीच में रहने वाले तुम्हारे भविष्यद्वक्ता और तुम्हारे भावी बताने वाले तुम्हें धोखा न दें; अपने आप को उनसे धोखा खाने मत दो। और अपने उन सपनों पर ध्यान मत दो, जिन्हें तुम दिखवाते हो[a]।'
