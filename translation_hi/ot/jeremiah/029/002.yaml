lexical_decisions:
- source_word: אַחֲרֵי צֵאת
  choice: जब ... चले गए थे
  rationale: यह पद अगले कथन की समय-भूमिका देता है। हिन्दी में पूर्ववर्ती घटना को स्वाभाविक ढंग से व्यक्त करने के लिए पूर्ण भूतकाल का प्रयोग किया गया है।
- source_word: יְכָנְיָה הַמֶּלֶךְ
  choice: राजा यकोन्याह
  rationale: हिब्रू नाम के इस रूप को बनाए रखते हुए उपाधि को हिन्दी की स्वाभाविक शब्द-व्यवस्था में रखा गया है।
- source_word: הַגְּבִירָה
  choice: राजमाता
  rationale: राजकीय संदर्भ में यह पद राजा की माता के आधिकारिक दरबारी स्थान को सूचित करता है; ‘राजमाता’ संक्षिप्त और स्वाभाविक हिन्दी है।
- source_word: הַסָּרִיסִים
  choice: राजदरबार के अधिकारी
  rationale: शब्द विशेष रूप से नपुंसक बनाए गए पुरुषों अथवा अधिक व्यापक अर्थ में राजकीय अधिकारियों को सूचित कर सकता है। मुख्य पाठ में संदर्भानुकूल व्यापक अर्थ रखा गया और संकीर्ण अर्थ पादटिप्पणी में दिया गया है।
- source_word: שָׂרֵי יְהוּדָה וִירוּשָׁלַם
  choice: यहूदा और यरूशलेम के अधिकारी
  rationale: שׂרים शासकीय प्रधानों या अधिकारियों को दर्शाता है। आधुनिक हिन्दी में ‘अधिकारी’ स्पष्ट है; ‘हाकिम’ को वैकल्पिक रूप में सुरक्षित रखा गया है।
- source_word: הֶחָרָשׁ
  choice: कारीगर
  rationale: यह शब्द व्यापक रूप से दक्ष शिल्पकार को सूचित कर सकता है; अगले व्यवसाय-सूचक शब्द से इसका भेद बनाए रखने के लिए व्यापक अनुवाद चुना गया है।
- source_word: הַמַּסְגֵּר
  choice: धातु-कर्मी
  rationale: इस दुर्लभ व्यवसाय-सूचक शब्द का आशय संभवतः लोहार या अन्य धातु का काम करने वाले कारीगर से है। व्यापक और बोधगम्य ‘धातु-कर्मी’ मुख्य पाठ में रखा गया है।
- source_word: מִירוּשָׁלָם
  choice: यरूशलेम से निर्वासन में
  rationale: מִן प्रस्थान-स्थान बताता है। व्यापक ऐतिहासिक और वाक्यगत संदर्भ में यह प्रस्थान बेबीलोनी निर्वासन था; हिन्दी में केवल ‘निकल गए’ से स्वैच्छिक प्रस्थान का भ्रम हो सकता था, इसलिए निर्वासन का भाव स्पष्ट किया गया है।
