id: JER.29.23
reference: Jeremiah 29:23
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יַ֡עַן אֲשֶׁר֩ עָשׂ֨וּ נְבָלָ֜ה בְּ/יִשְׂרָאֵ֗ל וַ/יְנַֽאֲפוּ֙ אֶת נְשֵׁ֣י רֵֽעֵי/הֶ֔ם וַ/יְדַבְּר֨וּ דָבָ֤ר בִּ/שְׁמִ/י֙ שֶׁ֔קֶר אֲשֶׁ֖ר ל֣וֹא צִוִּיתִ֑/ם וְ/אָנֹכִ֛י הו ידע וָ/עֵ֖ד נְאֻם יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/023.yaml
  text: because they have committed an outrageous act in Israel[a], and have committed adultery with their neighbors’ wives, and have spoken in my name a lie that I did not command them. And I am the one who knows and is a witness[c][b], declares Yahweh.
translation:
  language: hi
  text: क्योंकि उन्होंने इस्राएल में घोर निंदनीय काम किया है[a]—उन्होंने अपने पड़ोसियों की पत्नियों के साथ व्यभिचार किया और मेरे नाम से वह झूठी बात कही जिसकी आज्ञा मैंने उन्हें नहीं दी थी। मैं स्वयं जानता हूँ और साक्षी हूँ[b]—यह याहवे की घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्होंने इस्राएल में लज्जाजनक काम किया है” अथवा “उन्होंने इस्राएल में मूर्खतापूर्ण दुष्कर्म किया है।” इब्रानी शब्द נְבָלָה नैतिक रूप से घृणित और अपमानजनक काम को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या, “मैं ही वह हूँ जो जानता और साक्षी है।” इब्रानी में ‘मैं’ पर विशेष बल है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: क्योंकि
  rationale: यह पद पिछले पद में सुनाए गए न्याय का कारण बताता है; आधुनिक हिन्दी में ‘क्योंकि’ इसका स्वाभाविक कारणसूचक रूप है।
- source_word: עָשׂוּ נְבָלָה
  choice: घोर निंदनीय काम किया है
  rationale: נְבָלָה नैतिक रूप से घृणित, अपमानजनक और समुदाय को कलंकित करने वाले आचरण को दर्शाता है। ‘घोर निंदनीय काम’ इसके नैतिक आघात को स्पष्ट रखता है।
- source_word: בְּיִשְׂרָאֵל
  choice: इस्राएल में
  rationale: בְּ का सीधा स्थानवाचक अर्थ रखा गया है; यहाँ यह इस्राएली समुदाय के भीतर किए गए अपराध की ओर भी संकेत कर सकता है।
- source_word: וַיְנַאֲפוּ אֶת נְשֵׁי רֵעֵיהֶם
  choice: उन्होंने अपने पड़ोसियों की पत्नियों के साथ व्यभिचार किया
  rationale: נאף विशेष रूप से व्यभिचार को व्यक्त करता है। רֵעַ को केवल घनिष्ठ मित्र न मानकर साथी समुदाय-सदस्य के अर्थ में ‘पड़ोसी’ कहा गया है।
- source_word: וַיְדַבְּרוּ דָבָר בִּשְׁמִי שֶׁקֶר
  choice: मेरे नाम से वह झूठी बात कही
  rationale: यह परमेश्वर का अधिकार जताकर झूठ बोलने का आरोप है। ‘वह झूठी बात’ आगे आने वाले संबंधवाचक उपवाक्य से स्वाभाविक रूप से जुड़ती है।
- source_word: אֲשֶׁר לֹא צִוִּיתִם
  choice: जिसकी आज्ञा मैंने उन्हें नहीं दी थी
  rationale: यह स्पष्ट करता है कि कथित भविष्यवाणी को कोई दिव्य आदेश या प्राधिकार प्राप्त नहीं था।
- source_word: וְאָנֹכִי הוּא יֹדֵעַ וָעֵד
  choice: मैं स्वयं जानता हूँ और साक्षी हूँ
  rationale: אָנֹכִי הוּא का बल ‘मैं स्वयं’ से व्यक्त होता है। ‘जानता हूँ और साक्षी हूँ’ ज्ञान तथा न्यायिक साक्ष्य, दोनों पक्षों को बनाए रखता है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: नबी की गंभीर घोषणात्मक शैली को स्वाभाविक हिन्दी में रखा गया है और יְהוָה को उसके व्यक्तिगत वाचा-नाम ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुरक्षरी व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण हिन्दी लिप्यंतरण है और नाम को उपाधि में नहीं बदलता।
- issue: וְאָנֹכִי הוּא יֹדֵעַ וָעֵד में ज्ञान और साक्षी होने का संबंध
  choice: मैं स्वयं जानता हूँ और साक्षी हूँ
  alternative: मैं ही वह हूँ जो जानता और साक्षी है
  rationale: हिब्रू की आत्मबलाघाती अभिव्यक्ति और न्यायिक स्वर सुरक्षित रखे गए हैं, पर यह निर्धारित नहीं किया गया कि ‘साक्षी’ केवल देखने वाला है या न्याय में गवाही देने वाला भी।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गंभीर किंतु सामान्य पाठक के लिए सुबोध रखी गई है। समानार्थी क्रियाओं की अनावश्यक पुनरावृत्ति से बचते हुए मूल के नैतिक और न्यायिक बल को सुरक्षित रखा गया है।
