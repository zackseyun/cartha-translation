source:
  edition: WLC
  text: וְ/דִרְשׁ֞וּ אֶת שְׁל֣וֹם הָ/עִ֗יר אֲשֶׁ֨ר הִגְלֵ֤יתִי אֶתְ/כֶם֙ שָׁ֔מָּ/ה וְ/הִתְפַּֽלְל֥וּ בַעֲדָ֖/הּ אֶל יְהוָ֑ה כִּ֣י בִ/שְׁלוֹמָ֔/הּ יִהְיֶ֥ה לָ/כֶ֖ם שָׁלֽוֹם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/007.yaml
  text: Seek the welfare of the city where I have sent you into exile[a], and pray to Yahweh on its behalf, for in its welfare you will have welfare.
translation:
  language: hi
  text: और जिस नगर में मैंने तुम्हें निर्वासन में भेजा है, उसकी भलाई[a] चाहो और उसके लिए याहवे से प्रार्थना करो, क्योंकि उसकी भलाई में ही तुम्हारी भलाई होगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शांति” अथवा “कुशलता”; इस पद में हिब्रू शब्द ‘शालोम’ नगर के लिए और तुम्हारे लिए, तीन बार आया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: דִרְשׁוּ
  choice: भलाई चाहो
  rationale: यहाँ क्रिया का अर्थ केवल खोजने से अधिक, नगर की भलाई की कामना करने और उसके लिए प्रयत्नशील रहने का है। ‘चाहो’ स्वाभाविक हिन्दी में आज्ञार्थक बल और व्यापक अर्थ बनाए रखता है।
- source_word: שְׁלוֹם
  choice: भलाई
  rationale: शालोम यहाँ केवल संघर्ष के अभाव नहीं, बल्कि समग्र कुशलता, स्थिरता और कल्याण को दर्शाता है। ‘भलाई’ सरल आधुनिक हिन्दी है और पद में तीनों बार एक ही शब्द रखकर हिब्रू की पुनरावृत्ति सुरक्षित करती है।
- source_word: הָעִיר
  choice: नगर
  rationale: निश्चित संज्ञा निर्वासन के विशेष नगर को सूचित करती है; ‘नगर’ गरिमापूर्ण और सामान्य हिन्दी प्रयोग है।
- source_word: הִגְלֵיתִי אֶתְכֶם שָׁמָּה
  choice: जिस नगर में मैंने तुम्हें निर्वासित करके भेजा है
  rationale: हिफ़ील रूप परमेश्वर की कारक भूमिका व्यक्त करता है। यह हिन्दी वाक्यांश निर्वासन और भेजे जाने, दोनों भावों को स्वाभाविक ढंग से सुरक्षित रखता है।
- source_word: הִתְפַּלְלוּ
  choice: प्रार्थना करो
  rationale: हिब्रू आज्ञार्थक का सीधा और स्वाभाविक हिन्दी अनुवाद; ‘मध्यस्थता करो’ मूल से अधिक संकीर्ण होता।
- source_word: בַעֲדָהּ
  choice: उसके लिए
  rationale: नगर के पक्ष में अथवा उसकी ओर से प्रार्थना का अर्थ संक्षिप्त और सहज हिन्दी में व्यक्त होता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित व्यक्तिगत नाम-रूप ‘यहोवा’ चतुरक्षरीय ईश-नाम को किसी उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह शब्द पहले दिए गए आदेशों का कारण प्रस्तुत करता है।
- source_word: בִשְׁלוֹמָהּ יִהְיֶה לָכֶם שָׁלוֹם
  choice: उसकी भलाई में ही तुम्हारी भलाई होगी
  rationale: नगर और निर्वासितों के लिए एक ही शब्द ‘भलाई’ दोहराकर मूल का शब्द-संबंध और परस्पर जुड़ा हित स्पष्ट रहता है; ‘ही’ हिन्दी में इस संबंध को स्वाभाविक रूप से उभारता है, बिना उसे आर्थिक समृद्धि तक सीमित किए।
theological_decisions:
- issue: ईश-नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल के व्यक्तिगत ईश-नाम को ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया। आधुनिक मानक हिन्दी के व्यापक बाइबलीय परिचय को ध्यान में रखकर ‘यहोवा’ चुना गया; ‘याहवे’ अधिक निकट वैकल्पिक लिप्यंतरण है।
- issue: नगर की शालोम और निर्वासितों की शालोम का संबंध
  choice: एक ही शब्द ‘भलाई’ की पुनरावृत्ति
  alternative: नगर के लिए ‘कल्याण’ और निर्वासितों के लिए ‘शांति’
  rationale: मूल पाठ जानबूझकर שׁלום दोहराता है और दोनों की दशा को जोड़ता है। समान हिन्दी शब्द इस धर्मवैचारिक तनाव को बनाए रखता है कि निर्वासितों की भलाई उस विदेशी नगर की भलाई से जुड़ी है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘नगर’, ‘निर्वासित’ और ‘प्रार्थना’ बाइबलीय संदर्भ की गंभीरता रखते हैं, जबकि वाक्य-विन्यास समकालीन है।
