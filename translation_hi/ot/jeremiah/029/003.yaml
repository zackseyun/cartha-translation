- source_word: בָּבֶלָה
  choice: बाबेल
  rationale: दिशासूचक ה के कारण अर्थ ‘बाबेल को/बाबेल की ओर’ है। हिंदी में ‘के पास बाबेल भेजा’ गंतव्य को सहजता से व्यक्त करता है।
- source_word: לֵאמֹר
