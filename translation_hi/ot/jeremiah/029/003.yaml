  yaml_path: translation/ot/jeremiah/029/003.yaml
  text: 'by the hand of Elasah son of Shaphan and Gemariah son of Hilkiah[a], whom Zedekiah king of Judah sent to Nebuchadnezzar king of Babylon in Babylon[b], saying:'
translation:
  language: hi
  text: 'यह पत्र शापान के पुत्र एलासाह और हिल्कियाह के पुत्र गमर्याह के हाथ भेजा गया था[a]। यहूदा के राजा सिदकिय्याह ने उन्हें बाबेल में बाबेल के राजा नबूकदनेस्सर के पास भेजा था। उसमें लिखा था:'
  philosophy: optimal-equivalence
  footnotes:
