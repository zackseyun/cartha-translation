  text: כֹּֽה אָמַ֞ר יְהוָ֧ה צְבָא֛וֹת אֱלֹהֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר יַ֡עַן אֲשֶׁ֣ר אַתָּה֩ שָׁלַ֨חְתָּ בְ/שִׁמְ/כָ֜ה סְפָרִ֗ים אֶל כָּל הָ/עָם֙ אֲשֶׁ֣ר בִּ/ירוּשָׁלִַ֔ם וְ/אֶל צְפַנְיָ֤ה בֶן מַֽעֲשֵׂיָה֙ הַ/כֹּהֵ֔ן וְ/אֶ֥ל כָּל הַ/כֹּהֲנִ֖ים לֵ/אמֹֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/025.yaml
  text: 'Thus says Yahweh of hosts[a], the God of Israel: Because you have sent letters in your own name to all the people who are in Jerusalem, and to Zephaniah son of Maaseiah the priest, and to all the priests, saying,'
translation:
  language: hi
  text: 'सेनाओं का याहवे, इस्राएल का परमेश्वर, यह कहता है: “क्योंकि तुमने अपने नाम से[a] यरूशलेम में रहने वाले सभी लोगों को, याजक मासेयाह के पुत्र सपन्याह को, और सभी याजकों को पत्र भेजे हैं, जिनमें तुमने यह कहा है:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हारे नाम से।” सम्भवतः इसका आशय है कि शमायाह ने याहवे के अधिकार से नहीं, बल्कि अपने अधिकार से ये पत्र भेजे थे।
    reason: शाब्दिक विकल्प और पदबंध में निहित सम्भावित अधिकार-संबंधी संकेत को स्पष्ट करना।
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: यह कहता है
  rationale: यह मानक भविष्यद्वाणी-संदेश सूत्र को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और वक्ता की प्रत्यक्ष घोषणा बनाए रखता है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का याहवे
  rationale: व्यक्तिगत दिव्य नाम को ‘याहवे’ के रूप में रखा गया है; צְבָאוֹת की व्यापक सैन्य और स्वर्गीय संगति को ‘सेनाओं’ से व्यक्त किया गया है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल का परमेश्वर
  rationale: सम्बन्धवाचक पदबंध का सीधा और प्रचलित हिन्दी रूप।
- source_word: יַעַן אֲשֶׁר
  choice: तुमने ... भेजकर
  rationale: हिब्रू में यह कारण प्रस्तुत करता है, जिसका परिणाम आगे के पदों में आता है। हिन्दी में उद्धरण के भीतर ‘तुमने ... भेजकर’ अधूरे कारण-वाक्य की अपेक्षा अधिक स्वाभाविक रूप से अगले कथन की भूमिका बनाता है।
- source_word: בְשִׁמְךָ
  choice: अपने नाम से
  rationale: यह शाब्दिक अर्थ और इस सम्भावित संकेत—कि पत्र भेजने वाला अपने अधिकार से काम कर रहा था—दोनों को बनाए रखता है, बिना व्याख्या को मुख्य पाठ में निर्णायक बनाए।
- source_word: סְפָרִים
  choice: पत्र
  rationale: नामित प्राप्तकर्ताओं को भेजे गए लिखित संदेशों के सन्दर्भ में ‘पत्र’ सबसे स्वाभाविक अर्थ है।
- source_word: כָּל הָעָם אֲשֶׁר בִּירוּשָׁלִַם
  choice: यरूशलेम में रहने वाले सब लोगों
  rationale: हिब्रू सम्बन्धवाचक उपवाक्य का स्पष्ट और सहज हिन्दी रूप।
- source_word: צְפַנְיָה בֶן מַעֲשֵׂיָה הַכֹּהֵן
  choice: मासेयाह के पुत्र सपन्याह याजक
  rationale: नामों और वंश-सूचना के हिब्रू क्रम को हिन्दी में स्पष्ट रखते हुए הַכֹּהֵן को सपन्याह की पहचान के रूप में प्रस्तुत किया गया है।
- source_word: כָּל הַכֹּהֲנִים
  choice: सभी याजकों
  rationale: सम्पूर्ण समूह का सीधा आधुनिक हिन्दी अनुवाद।
- source_word: לֵאמֹר
  choice: 'यह कहा है:'
  rationale: यह अगले पद में आने वाली पत्र की विषयवस्तु का परिचय देता है; अन्त का द्विबिन्दु उस निरन्तरता को स्पष्ट करता है।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: हिब्रू पाठ में व्यक्तिगत वाचा-नाम सीधे उपस्थित है; लिप्यन्तरण उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: בְשִׁמְךָ में अधिकार का संकेत
  choice: अपने नाम से
  alternative: अपने ही अधिकार से
  rationale: मुख्य पाठ मूल पदबंध की भाषिक अस्पष्टता बनाए रखता है; ‘अपने ही अधिकार से’ सम्भावित आशय को आवश्यकता से अधिक निश्चित कर देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। एकवचन सम्बोधन के लिए सम्मानजनक ‘तुम’ का प्रयोग हुआ है। वाक्य अगले पद में जारी रहता है, इसलिए अन्त में द्विबिन्दु रखा गया है।
