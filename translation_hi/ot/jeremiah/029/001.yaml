  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אֵ֨לֶּה֙ דִּבְרֵ֣י הַ/סֵּ֔פֶר אֲשֶׁ֥ר שָׁלַ֛ח יִרְמְיָ֥ה הַ/נָּבִ֖יא מִ/ירוּשָׁלִָ֑ם אֶל יֶ֜תֶר זִקְנֵ֣י הַ/גּוֹלָ֗ה וְ/אֶל הַ/כֹּהֲנִ֤ים וְ/אֶל הַ/נְּבִיאִים֙ וְ/אֶל כָּל הָ/עָ֔ם אֲשֶׁ֨ר הֶגְלָ֧ה נְבֽוּכַדְנֶאצַּ֛ר מִ/ירוּשָׁלִַ֖ם בָּבֶֽלָ/ה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/001.yaml
  text: These are the words of the letter that Jeremiah the prophet sent from Jerusalem to the remaining elders of the exiles[a], and to the priests, the prophets[d][c][b], and all the people whom Nebuchadnezzar had carried away from Jerusalem to Babylon.
translation:
  language: hi
  text: ये उस पत्र के शब्द हैं, जिसे यिर्मयाह नबी ने यरूशलेम से निर्वासित समुदाय के शेष बुज़ुर्गों[a], याजकों, नबियों और उन सभी लोगों के पास भेजा था, जिन्हें नबूकदनेस्सर यरूशलेम से निर्वासित करके बाबेल ले गया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “निर्वासन के शेष बुज़ुर्गों।” इब्रानी अभिव्यक्ति निर्वासित समुदाय के शेष बुज़ुर्गों या निर्वासन से संबद्ध शेष बुज़ुर्गों की ओर संकेत कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: ये ... हैं
  rationale: यह अभिव्यक्ति पिछले प्रसंग से जुड़ते हुए नए खंड का परिचय देती है। हिन्दी में ‘ये ... हैं’ स्वाभाविक है; अलग से कालवाचक ‘अब’ जोड़ना आवश्यक नहीं।
- source_word: דִּבְרֵי הַסֵּפֶר
  choice: उस पत्र के शब्द
  rationale: סֵפֶר किसी लिखित दस्तावेज़, पुस्तक, पत्र या खर्रे को सूचित कर सकता है। निश्चित प्राप्तकर्ताओं के पास इसे भेजे जाने के कारण प्रसंग में ‘पत्र’ सर्वाधिक उपयुक्त है, जबकि ‘के शब्द’ इब्रानी रचना को बनाए रखता है।
- source_word: יִרְמְיָה הַנָּבִיא
  choice: यिर्मयाह नबी
  rationale: व्यक्तिनाम का प्रचलित हिन्दी रूप और उसकी भूमिका के लिए सहज, प्रतिष्ठित पदवी।
- source_word: יֶתֶר זִקְנֵי הַגּוֹלָה
  choice: निर्वासित समुदाय के बचे हुए पुरनियों
  rationale: יֶתֶר का ‘बचे हुए’ अर्थ सुरक्षित रखा गया है। הַגּוֹלָה निर्वासन की दशा या निर्वासित समुदाय दोनों को सूचित कर सकता है; यहाँ व्यक्ति प्राप्तकर्ता हैं, इसलिए ‘निर्वासित समुदाय’ स्पष्ट और स्वाभाविक है। ‘पुरनिये’ बाइबलीय पदवी के रूप में समुदाय के अगुवों को दर्शाता है।
- source_word: הַכֹּהֲנִים וְהַנְּבִיאִים
  choice: याजकों, नबियों
  rationale: दोनों सामुदायिक भूमिकाओं के मानक हिन्दी बाइबलीय पद।
- source_word: כָּל הָעָם
  choice: उन सभी लोगों
  rationale: नेताओं से आगे पूरे जनसमुदाय को समेटने वाली स्वाभाविक सामूहिक अभिव्यक्ति।
- source_word: אֲשֶׁר הֶגְלָה
  choice: जिन्हें ... निर्वासित करके ... ले गया था
  rationale: गला के हिफ़ील रूप में बलपूर्वक देश से निकालने का भाव है। ‘निर्वासित करके ... ले गया’ कारण और गंतव्य दोनों को स्पष्ट करता है तथा घटना के पत्र भेजे जाने से पहले होने को ‘था’ से व्यक्त करता है।
- source_word: נְבוּכַדְנֶאצַּר
  choice: नबूकदनेस्सर
  rationale: इस इब्रानी रूप के अनुरूप प्रचलित हिन्दी लिप्यंतरण।
- source_word: בָּבֶלָה
  choice: बाबेल ले गया
  rationale: स्थाननाम पर दिशासूचक प्रत्यय बाबेल की ओर गति बताता है; हिन्दी में ‘बाबेल ले गया’ इसे स्वाभाविक रूप से व्यक्त करता है।
