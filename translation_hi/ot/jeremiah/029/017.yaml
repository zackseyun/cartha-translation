source:
  edition: WLC
  text: כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת הִנְ/נִי֙ מְשַׁלֵּ֣חַ בָּ֔/ם אֶת הַ/חֶ֖רֶב אֶת הָ/רָעָ֣ב וְ/אֶת הַ/דָּ֑בֶר וְ/נָתַתִּ֣י אוֹתָ֗/ם כַּ/תְּאֵנִים֙ הַ/שֹּׁ֣עָרִ֔ים אֲשֶׁ֥ר לֹא תֵאָכַ֖לְנָה מֵ/רֹֽעַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/017.yaml
  text: 'Thus says Yahweh of hosts: Behold[a], I am sending against them the sword, the famine, and the pestilence, and I will make them like rotten figs that cannot be eaten because of their badness.'
translation:
  language: hi
  text: 'सेनाओं का याहवे यों कहता है: “देखो, मैं उनके विरुद्ध तलवार, अकाल और महामारी भेज रहा हूँ। मैं उन्हें खराब अंजीरों[a] के समान कर दूँगा, जो अपनी खराबी के कारण खाए नहीं जा सकते।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बहुत बुरे अंजीरों” अथवा “बिगड़े हुए अंजीरों”; इब्रानी विशेषण ऐसे अंजीरों की अत्यंत खराब दशा बताता है जो खाने योग्य नहीं हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को ‘याहवे’ के रूप में और צְבָאוֹת की व्यापक सैन्य/स्वर्गीय छवि को ‘सेनाओं’ के रूप में सुरक्षित रखा गया है।
- source_word: הִנְנִי
  choice: देखो
  rationale: यह आसन्न न्याय की ओर ध्यान खींचने वाला भविष्यद्वक्तापरक संकेत है; आधुनिक हिन्दी में ‘देखो’ स्वाभाविक और गंभीर है।
- source_word: מְשַׁלֵּחַ בָּם
  choice: मैं उनके विरुद्ध ... भेज रहा हूँ
  rationale: הִנְנִי के साथ कृदंत आसन्न अथवा सजीव वर्तमान भाव देता है; दंड के प्रसंग में בָּם को ‘उनके विरुद्ध’ समझना उचित है।
- source_word: הַחֶרֶב אֶת הָרָעָב וְאֶת הַדָּבֶר
  choice: तलवार, अकाल और महामारी
  rationale: न्याय की पारंपरिक त्रयी और तलवार की ठोस छवि बनाए रखी गई है; דֶּבֶר यहाँ व्यापक घातक महामारी को सूचित करता है।
- source_word: וְנָתַתִּי אוֹתָם
  choice: मैं उन्हें ... के समान कर दूँगा
  rationale: तुलनात्मक כַּ के साथ נתן का आशय उन्हें उस दशा के समान बना देना है; यह हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: הַשֹּׁעָרִים
  choice: सड़े-गले
  rationale: दुर्लभ विशेषण अत्यंत खराब, घृणित अथवा बिगड़ी दशा बताता है। अंजीरों के संदर्भ में ‘सड़े-गले’ खाद्य-वस्तु की ठोस छवि को सहज रूप से व्यक्त करता है।
- source_word: לֹא תֵאָכַלְנָה מֵרֹעַ
  choice: जो इतने खराब हैं कि खाए नहीं जा सकते
  rationale: निफ़अल रूप व्यावहारिक अखाद्यता बताता है और מֵרֹעַ उस अखाद्यता का कारण—उनकी अत्यंत खराब दशा—स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल इब्रानी के व्यक्तिगत वाचाई नाम को उपाधि में बदलने के बजाय हिन्दी लिप्यंतरण द्वारा सुरक्षित रखा गया है; इससे किसी विशेष संप्रदायगत व्याख्या को नहीं जोड़ा जाता।
- issue: יְהוָה צְבָאוֹת में צְבָאוֹת का दायरा
  choice: सेनाओं का
  alternative: सर्वशक्तिमान
  rationale: ‘सेनाओं’ मूल रूपक और उसकी संभावित स्वर्गीय तथा पार्थिव व्यापकता को बनाए रखता है, जबकि ‘सर्वशक्तिमान’ व्याख्यात्मक विस्तार होता।
translation_notes:
  register: भाषा आधुनिक, गंभीर और सार्वजनिक पाठ के योग्य रखी गई है। ‘यों कहता है’ भविष्यद्वक्तापरक सूत्र की गरिमा बनाए रखता है, जबकि ‘देखो’ और ‘भेज रहा हूँ’ आसन्नता को सहज आधुनिक हिन्दी में व्यक्त करते हैं।
