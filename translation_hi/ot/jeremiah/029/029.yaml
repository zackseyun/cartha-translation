lexical_decisions:
- source_word: וַיִּקְרָא
  choice: तब ... पढ़कर सुनाया
  rationale: यहाँ קרא का कर्म एक लिखित दस्तावेज़ है, इसलिए अर्थ ‘पढ़ना’ है। בְּאָזְנֵי के साथ ‘पढ़कर सुनाया’ स्वाभाविक हिन्दी में स्पष्ट करता है कि पाठ ऊँचे स्वर में पढ़ा गया। ‘तब’ कथानक में आगे की घटना दर्शाता है।
- source_word: צְפַנְיָה
  choice: सपन्याह
  rationale: इब्रानी व्यक्तिगत नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: הַכֹּהֵן
  choice: याजक
  rationale: निश्चित पदवी का सीधा और प्रचलित हिन्दी अनुवाद।
- source_word: הַסֵּפֶר הַזֶּה
  choice: यह पत्र
  rationale: סֵפֶר का अर्थ पुस्तक, चर्मपत्र/लपेटा हुआ लेख, लिखित दस्तावेज़ या पत्र हो सकता है। निकटवर्ती प्रसंग इसे शमायाह द्वारा भेजे गए पत्र के रूप में पहचानता है, इसलिए मुख्य पाठ में ‘पत्र’ स्वाभाविक है; व्यापक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: בְּאָזְנֵי
  choice: को पढ़कर सुनाया
  rationale: शाब्दिक अर्थ ‘कानों में’ है; इस मुहावरे का आशय किसी व्यक्ति के सुनने के लिए ऊँचे स्वर में पढ़ना है।
- source_word: יִרְמְיָהוּ
  choice: यिर्मयाह
  rationale: इब्रानी नाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: הַנָּבִיא
  choice: नबी
  rationale: यिर्मयाह की निश्चित पदवी को स्पष्ट रूप से बनाए रखा गया है।
