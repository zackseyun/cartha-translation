id: JER.29.15
reference: Jeremiah 29:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֖י אֲמַרְתֶּ֑ם הֵקִ֨ים לָ֧/נוּ יְהוָ֛ה נְבִאִ֖ים בָּבֶֽלָ/ה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/015.yaml
  text: Because you have said[b][a], “Yahweh has raised up prophets for us in Babylon,”
translation:
  language: hi
  text: क्योंकि तुमने कहा है[a], “याहवे ने बाबेल में हमारे लिए नबी खड़े किए हैं,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि तुमने कहा था।”
    reason: क्रिया אֲמַרְתֶּם को प्रसंग के अनुसार साधारण भूतकाल में भी व्यक्त किया जा सकता है।
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ כִּי आगे आने वाली ईश्वरीय प्रतिक्रिया का कारण प्रस्तुत करता है; ‘क्योंकि’ आधुनिक हिन्दी में इस कारण-संबंध को स्पष्ट रखता है।
- source_word: אֲמַרְתֶּם
  choice: तुमने कहा है
  rationale: द्वितीय पुरुष बहुवचन पूर्ण क्रिया श्रोताओं के पहले किए गए कथन को बताती है; हिन्दी का पूर्ण रूप वर्तमान प्रसंग से उसका संबंध बनाए रखता है।
- source_word: הֵקִים
  choice: खड़े किए हैं
  rationale: קום के हिफ़ील रूप का अर्थ यहाँ नबियों को उठाना या नियुक्त करना है। ‘खड़े किए हैं’ बाइबलीय अभिव्यक्ति को सुरक्षित रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: לָנוּ
  choice: हमारे लिए
  rationale: לָנוּ यहाँ हित या प्रबंध का भाव देता है, इसलिए ‘हमारे लिए’ उपयुक्त है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत नाम יהוה का शीर्षक से प्रतिस्थापन न करके हिन्दी लिप्यंतरण किया गया है।
- source_word: נְבִאִים
  choice: नबी
  rationale: यह נָבִיא का बहुवचन है; आधुनिक हिन्दी में ‘नबी’ परिचित और स्वाभाविक शब्द है तथा संख्या क्रिया से स्पष्ट होती है।
- source_word: בָּבֶלָה
  choice: बाबेल में
  rationale: स्थानवाचक रूप यहाँ बाबेल में होने का संकेत देता है; ‘बाबेल में’ मूल स्थान-नाम और अर्थ दोनों सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल में चार-अक्षरी व्यक्तिगत नाम सीधे प्रयुक्त है। ‘याहवे’ उसका निकट हिन्दी लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
- issue: हֵקִים में नियुक्ति और उठाए जाने का भाव
  choice: खड़े किए हैं
  alternative: नियुक्त किए हैं
  rationale: ‘खड़े किए हैं’ मूल रूपक और परमेश्वर द्वारा नबियों को उपलब्ध कराने/नियुक्त करने का व्यापक भाव बनाए रखता है; ‘नियुक्त किए हैं’ अर्थ को अधिक प्रशासनिक ढंग से सीमित कर सकता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘नबी खड़े किए’ मूल इब्रानी मुहावरे को हिन्दी में समझने योग्य रूप में बनाए रखता है। वाक्य का अंत अल्पविराम से है क्योंकि यह अगले पदों में जारी रहने वाली संरचना का आरंभ है।
