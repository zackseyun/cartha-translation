  text: For this reason he sent to us in Babylon[a], saying, ‘It will be a long time. Build houses and live in them[b], and plant gardens and eat their fruit.’
translation:
  language: hi
  text: 'इसी कारण उसने बाबेल में हमारे पास यह संदेश भेजा: “यह बहुत लंबे समय तक चलेगा।[a] घर बनाओ और उनमें रहो,[b] बाग लगाओ और उनके फल खाओ।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “वह लंबी है।” इब्रानी वाक्य अण्डाकार है; आशय यह है कि बाबेल में रहने या निर्वासन की अवधि लंबी होगी।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में, “और रहो”; घरों में रहना सन्दर्भ से निहित है।
    reason: lexical_alternative
