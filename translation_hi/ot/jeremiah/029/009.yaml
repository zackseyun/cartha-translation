  text: כִּ֣י בְ/שֶׁ֔קֶר הֵ֛ם נִבְּאִ֥ים לָ/כֶ֖ם בִּ/שְׁמִ֑/י לֹ֥א שְׁלַחְתִּ֖י/ם נְאֻם יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/009.yaml
  text: For they are prophesying falsely to you in my name[a]; I did not send them[c][b], declares Yahweh.
translation:
  language: hi
  text: क्योंकि वे मेरे नाम से तुम्हें झूठी भविष्यवाणी सुना रहे हैं[a]; मैंने उन्हें नहीं भेजा—यह याहवे[b] की घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: ‘झूठ में’ या ‘एक झूठ में।’'
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी: YHWH; परंपरागत रूप से ‘प्रभु’ और कभी-कभी ‘यहोवा’ भी लिखा जाता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले पद में दी गई चेतावनी का कारण बताता है; ‘क्योंकि’ इब्रानी के कारणसूचक संबंध को स्पष्ट और स्वाभाविक हिंदी में रखता है।
- source_word: בְשֶׁקֶר
  choice: झूठी
  rationale: शाब्दिक अर्थ ‘झूठ में/झूठ के साथ’ है। ‘झूठी भविष्यवाणी’ वर्तमान हिंदी में स्वाभाविक है और भविष्यवाणी के असत्य चरित्र को सुरक्षित रखती है।
- source_word: נִבְּאִים
  choice: भविष्यवाणी कर रहे हैं
  rationale: कृदंत रूप जारी या चरित्रगत गतिविधि दर्शाता है; अपूर्ण वर्तमान इसे हिंदी में स्पष्ट करता है।
- source_word: לָכֶם
  choice: तुमसे
  rationale: यह भविष्यवाणी सुनने वालों को सूचित करता है। ‘तुमसे भविष्यवाणी कर रहे हैं’ हिंदी में संबोधित श्रोताओं का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: בִּשְׁמִי
  choice: मेरे नाम से
  rationale: यह दावा किए गए दैवी अधिकार के अधीन बोलने का मुहावरा है। ‘मेरे नाम से’ उस दावे और उसके धार्मिक भार दोनों को बनाए रखता है।
- source_word: לֹא שְׁלַחְתִּים
  choice: मैंने उन्हें नहीं भेजा
  rationale: निषेध सहित पूर्ण क्रिया दैवी प्रेषण और अधिकार का स्पष्ट खंडन करती है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: यह गंभीर भविष्यसूचक सूत्र है। यह रूप आधुनिक हिंदी में स्पष्ट रहते हुए ‘घोषणा’ की औपचारिक शक्ति को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी पाठ में परमेश्वर का व्यक्तिगत नाम YHWH है; ‘याहवे’ उसका प्रचलित लिप्यंतरण है, न कि किसी उपाधि का प्रतिस्थापन।
theological_decisions:
- issue: भविष्यवाणी का दैवी अधिकार
  choice: भविष्यद्वक्ता याहवे के नाम का दावा करके झूठ बोल रहे हैं, पर याहवे कहता है कि उसने उन्हें नहीं भेजा।
  alternative: उनका संदेश केवल त्रुटिपूर्ण है, पर उनके दैवी प्रेषण के दावे पर निर्णय न दिया जाए।
  rationale: ‘मेरे नाम से’ और ‘मैंने उन्हें नहीं भेजा’ का सीधा विरोध उनके संदेश के झूठ और दैवी अधिकार के अभाव—दोनों को स्पष्ट करता है; अनुवाद इस तनाव को कम नहीं करता।
- issue: יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में उपाधि नहीं, चार अक्षरों वाला व्यक्तिगत दैवी नाम है। ‘याहवे’ उसे नाम के रूप में सुरक्षित रखता है; टिप्पणी पाठकों को पारंपरिक विकल्प से भी अवगत कराती है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘तुम’ बहुवचन समुदाय को संबोधित करता है और संदर्भ की सीधी चेतावनी को बनाए रखता है। वाक्य-विन्यास इब्रानी के कारणसूचक आरंभ, जारी क्रिया और अंत के गंभीर भविष्यसूचक सूत्र को स्वाभाविक हिंदी में प्रस्तुत करता है।
