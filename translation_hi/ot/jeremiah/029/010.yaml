base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/010.yaml
  text: 'For this is what Yahweh says: When seventy years for Babylon are completed[a], I will attend to you and fulfill my good word to you[c][b], to bring you back to this place.'
translation:
  language: hi
  text: 'क्योंकि याहवे यह कहता है: जब बाबेल के लिए सत्तर वर्ष पूरे हो जाएँगे,[a] तब मैं तुम्हारी सुधि लूँगा[b] और तुम्हारे विषय में अपना भला वचन पूरा करूँगा,[c] और तुम्हें इस स्थान पर वापस ले आऊँगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘जब बाबेल के लिए सत्तर वर्ष पूरे हों।’ यह बाबेल से संबंधित ठहराई गई अवधि को सूचित कर सकता है; वाक्य स्वयं यह नहीं बताता कि वह बाबेल के प्रभुत्व की अवधि है या निर्वासन की।
    reason: alternative_reading
  - marker: b
    text: या ‘मैं तुम्हारी ओर ध्यान दूँगा’ अथवा ‘मैं तुमसे भेंट करूँगा।’ इब्रानी क्रिया किसी की ओर न्याय या देखभाल के लिए ध्यान देने का अर्थ रख सकती है; यहाँ संदर्भ अनुकूल है।
    reason: lexical_alternative
  - marker: c
    text: या ‘तुम्हारे विषय में अपना भला वचन स्थापित करूँगा।’ आशय है कि याहवे अपने कहे हुए वचन को कार्यरूप देगा।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चार-अक्षरीय निजी नाम को उसके प्रचलित विद्वत्तापूर्ण उच्चारण के निकट देवनागरी में रखा गया है; इसे किसी उपाधि से नहीं बदला गया।
- source_word: כִּי כֹה אָמַר
  choice: क्योंकि ... यह कहता है
  rationale: यह ईश्वरीय घोषणा का सूत्र है। यह रूप इब्रानी के कारणसूचक כִּי और घोषणा-सूत्र כֹה אָמַר दोनों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: כִּי לְפִי מְלֹאת לְבָבֶל שִׁבְעִים שָׁנָה
  choice: जब बाबेल के लिए सत्तर वर्ष पूरे हो जाएँगे
  rationale: ‘बाबेल के लिए’ इब्रानी संबंध को जानबूझकर व्यापक रखता है और यह तय नहीं करता कि अवधि बाबेल के प्रभुत्व की है या निर्वासन में रहने की।
- source_word: אֶפְקֹד אֶתְכֶם
  choice: मैं तुम्हारी सुधि लूँगा
  rationale: פקד किसी की ओर ध्यान देने और उसके संबंध में हस्तक्षेप करने का भाव रखता है; इस संदर्भ में वह अनुकूल देखभाल है। ‘सुधि लूँगा’ उस भाव को संक्षिप्त और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: וַהֲקִמֹתִי עֲלֵיכֶם אֶת דְּבָרִי הַטּוֹב
  choice: तुम्हारे विषय में अपना भला वचन पूरा करूँगा
  rationale: הקים के साथ דבר का अर्थ कहे हुए वचन को प्रभावी करना या पूरा करना है। ‘भला वचन’ मूल शब्दावली को बचाता है, जबकि ‘पूरा करूँगा’ हिन्दी में उसके आशय को स्पष्ट करता है।
- source_word: לְהָשִׁיב אֶתְכֶם
  choice: तुम्हें ... वापस ले आऊँगा
  rationale: שׁוב का हिफ़ील रूप यहाँ कारणवाचक है—लोगों को लौटने के लिए प्रेरित करना या उन्हें वापस लाना।
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: इस स्थान पर
  rationale: מקום का सीधा अर्थ ‘स्थान’ है। अनुवाद इसे ‘देश’ या विशेष रूप से ‘यरूशलेम’ कहकर मूल से अधिक सीमित नहीं करता।
theological_decisions:
- issue: बाबेल से जुड़े सत्तर वर्षों का आशय
  choice: ‘बाबेल के लिए सत्तर वर्ष’
  alternative: ‘बाबेल में सत्तर वर्ष’ अथवा ‘बाबेल के प्रभुत्व के सत्तर वर्ष’
  rationale: इब्रानी रचना अवधि को बाबेल से जोड़ती है, पर यह स्पष्ट नहीं करती कि वह निर्वासन की अवधि है या बाबेल के प्रभुत्व की। मुख्य पाठ ऐतिहासिक कालक्रम की किसी एक व्याख्या को आरोपित नहीं करता।
- issue: פקד का अनुकूल या दंडात्मक भाव
  choice: ‘तुम्हारी सुधि लूँगा’—यहाँ अनुकूल देखभाल और हस्तक्षेप
  alternative: ‘तुम्हारा लेखा लूँगा’—दंडात्मक ध्यान
  rationale: क्रिया दोनों प्रकार का ध्यान व्यक्त कर सकती है, पर निकट संदर्भ में भले वचन की पूर्ति और स्वदेश-वापसी होने के कारण भाव अनुकूल है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। ‘सुधि लूँगा’ हल्का साहित्यिक है, पर सामान्य पाठक के लिए बोधगम्य और संदर्भानुकूल है। बाबेल के सत्तर वर्षों और ‘भले वचन’ की अभिव्यक्ति में मूल की अर्थगत व्यापकता सुरक्षित रखी गई है।
