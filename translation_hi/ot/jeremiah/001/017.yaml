  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אַתָּה֙ תֶּאְזֹ֣ר מָתְנֶ֔י/ךָ וְ/קַמְתָּ֙ וְ/דִבַּרְתָּ֣ אֲלֵי/הֶ֔ם אֵ֛ת כָּל אֲשֶׁ֥ר אָנֹכִ֖י אֲצַוֶּ֑/ךָּ אַל תֵּחַת֙ מִ/פְּנֵי/הֶ֔ם פֶּֽן אֲחִתְּ/ךָ֖ לִ/פְנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/017.yaml
  text: But you[a], gird up your loins, and arise and speak to them all that I command you. Do not be dismayed before them, lest I dismay you before them.
translation:
  language: hi
  text: परन्तु तुम अपनी कमर कस लो[a], उठो और जो कुछ मैं तुम्हें आज्ञा दूँ, वह सब उनसे कहो। उनके सामने भयभीत मत होना, नहीं तो मैं तुम्हें उनके सामने भयभीत कर दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी मुहावरा: शाब्दिक रूप से, वस्त्रों को कमर पर कसना, अर्थात् कार्य के लिए तैयार हो जाना।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: परन्तु तुम
  rationale: संयोजक और सर्वनाम पिछले आश्वासन से सीधे व्यक्तिगत आदेश की ओर बलपूर्ण परिवर्तन दिखाते हैं। ‘परन्तु तुम’ इस विरोध और बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: תֶּאְזֹר מָתְנֶיךָ
  choice: अपनी कमर कस लो
  rationale: यह कार्य के लिए वस्त्र कमर में बाँधने का सजीव इब्रानी मुहावरा है। हिन्दी का ‘कमर कसना’ उसी शारीरिक बिंब और तैयारी के भाव को स्वाभाविक रूप से बनाए रखता है।
- source_word: וְקַמְתָּ
  choice: उठो
  rationale: קום का आदेशात्मक आशय यहाँ भविष्यद्वक्ता को दिए जा रहे दायित्व का अगला चरण है। ‘उठो’ वर्तमान हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: וְדִבַּרְתָּ אֲלֵיהֶם
  choice: उनसे कहो
  rationale: דבר עם אל का सीधा आशय संबोधित लोगों से वचन कहना है। ‘उनसे कहो’ सहज हिन्दी है और मूल क्रिया में अनावश्यक रूप से ‘घोषणा’ का अधिक प्रबल भाव नहीं जोड़ता।
- source_word: אֵת כָּל אֲשֶׁר אָנֹכִי אֲצַוֶּךָּ
  choice: जो कुछ मैं तुम्हें आज्ञा दूँ, वह सब
  rationale: यह अनुवाद संदेश की पूर्णता और परमेश्वर के आदेश के प्रति संपूर्ण निष्ठा पर बल रखता है। ‘दूँ’ इब्रानी अपूर्ण क्रिया के वर्तमान-भावी निर्देशात्मक आशय को खुला रखता है।
- source_word: אַל תֵּחַת ... פֶּן אֲחִתְּךָ
  choice: भयभीत न होना, नहीं तो मैं तुम्हें ... भयभीत कर दूँगा
  rationale: חתת पहले निफ़अल और फिर हिफ़इल में आकर जानबूझकर शब्द-प्रतिध्वनि बनाता है। एक ही हिन्दी शब्द को दोहराने से निष्क्रिय अवस्था और कारक चेतावनी दोनों सुरक्षित रहते हैं।
- source_word: מִפְּנֵיהֶם ... לִפְנֵיהֶם
  choice: उनके सामने ... उनके सामने
  rationale: दोनों पदों में פנים की स्थानिक और सामना करने की छाया है। समान वाक्यांश की पुनरावृत्ति मूल की टकरावपूर्ण समरूपता बनाए रखती है।
theological_decisions:
- issue: भविष्यद्वक्ता की नियुक्ति में देहात्मक मुहावरे को बनाए रखना
  choice: मुख्य पाठ में ‘अपनी कमर कस लो’ रखा गया
  alternative: अपने आपको तैयार करो
  rationale: मूल का ठोस शारीरिक बिंब तैयारी, साहस और दायित्व की गंभीरता को एक साथ व्यक्त करता है। हिन्दी में समान मुहावरा उपलब्ध होने के कारण अर्थ और बिंब दोनों सुरक्षित रखे जा सकते हैं।
- issue: חתת की चेतावनी में शब्द-प्रतिध्वनि
  choice: दोनों खंडों में ‘भयभीत’ दोहराया गया
  alternative: पहले ‘मत डरना’ और बाद में ‘मैं तुम्हें आतंकित कर दूँगा’
  rationale: भिन्न शब्द अधिक सहज लग सकते हैं, पर वे मूल के निफ़अल–हिफ़इल संबंध और गंभीर प्रत्युत्तर की अलंकारिक शक्ति को छिपा देंगे। चुना हुआ रूप इस तनाव को बिना सिद्धान्तगत विस्तार के बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किन्तु गरिमापूर्ण शैली अपनाई गई है। एक व्यक्ति को संबोधित मूल के एकवचन को ‘तुम’ से व्यक्त किया गया है; इससे आधुनिक पाठक के लिए स्वाभाविकता रहती है और अनावश्यक तिरस्कारसूचक भाव नहीं आता। आदेशों में ‘कमर कस लो’, ‘उठो’ और ‘कहो’ का क्रम मूल की तत्परता बनाए रखता है।
