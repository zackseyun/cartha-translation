  edition: WLC
  text: וַ/יְהִ֥י דְבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/004.yaml
  text: The word of Yahweh came to me[a], saying,
translation:
  language: hi
  text: 'याहवे[a] का वचन मेरे पास पहुँचा:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: YHWH; पारंपरिक रूप से “प्रभु” अनूदित। हिन्दी में “यहोवा” भी प्रचलित है।'
    reason: ईश्वरीय नाम के मूल रूप तथा प्रचलित वैकल्पिक निरूपण स्पष्ट करना।
lexical_decisions:
- source_word: וַיְהִי
  choice: पहुँचा
  rationale: यह क्रियारूप कथा को आगे बढ़ाता है और यहाँ דְבַר के साथ मिलकर वचन के आने की घटना व्यक्त करता है। हिन्दी में अलग से “और ऐसा हुआ” जोड़ना अनावश्यक और बोझिल होता।
- source_word: דְבַר
  choice: वचन
  rationale: भविष्यवाणी के इस प्रचलित सूत्र में “वचन” दैवी प्रकाशन और कही गई बात—दोनों अर्थों को स्वाभाविक रूप से बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: यह इब्रानी चतुराक्षरीय व्यक्तिगत नाम YHWH का निकट हिन्दी लिप्यंतरण है; इसे किसी उपाधि से बदलने के बजाय नाम के रूप में रखा गया है।
- source_word: אֵלַי
  choice: मेरे पास
  rationale: אֶל के प्रथम पुरुष एकवचन रूप का प्रसंगानुकूल और स्वाभाविक हिन्दी रूप; भविष्यवाणी के वचन के किसी व्यक्ति तक आने के लिए “मेरे पास” सामान्य प्रयोग है।
- source_word: לֵאמֹר
  choice: ':'
  rationale: यह रूप आगे आने वाले प्रत्यक्ष कथन का परिचय देता है। हिन्दी में पद के अंत का द्विबिंदु इसी कार्य को संक्षिप्त और स्वाभाविक ढंग से पूरा करता है, बिना “यह कहते हुए” जैसी कृत्रिम रचना के।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु; यहोवा
  rationale: मूल पाठ में व्यक्तिगत नाम YHWH है। “याहवे” उसके प्रचलित विद्वत्तापूर्ण उच्चारण का निकट लिप्यंतरण है; पाद-टिप्पणी पारंपरिक उपाधि और वैकल्पिक हिन्दी रूप की जानकारी देती है।
- issue: דְבַר को “वचन” या “संदेश” कहना
  choice: वचन
  alternative: संदेश
  rationale: “वचन” मूल की औपचारिक अभिव्यक्ति और भविष्यवाणी-संबंधी धार्मिक अर्थ दोनों को सुरक्षित रखता है, जबकि “संदेश” अर्थ को कुछ अधिक व्याख्यायित कर देता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। भविष्यवाणी के सूत्र को संक्षिप्त रखा गया है; आरंभ में कोई ऐसा कालसूचक शब्द नहीं जोड़ा गया जो मूल में स्पष्ट रूप से नहीं है।
