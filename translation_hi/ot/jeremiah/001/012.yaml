base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/012.yaml
  text: Then Yahweh said to me[a], “You have seen well[c][b], for I am watching over my word to perform it.”
translation:
  language: hi
  text: तब याहवे ने मुझसे कहा, “तूने ठीक देखा है[a], क्योंकि मैं अपने वचन पर निगाह रखे हुए हूँ[b], ताकि उसे पूरा करूँ[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तूने सही देखा है” अथवा “तूने भली-भाँति देखा है।”
    reason: lexical_alternative
  - marker: b
    text: पिछले पद के इब्रानी शब्द ‘बादाम’ (שָׁקֵד, शाकेद) और यहाँ ‘निगाह रखे हुए’ (שֹׁקֵד, शोकेद) के बीच शब्द-क्रीड़ा है।
    reason: lexical_alternative
  - marker: c
    text: या, “कार्यान्वित करूँ” अथवा “कर दिखाऊँ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय परमेश्वर-नाम को उपाधि से बदलने के बजाय आधुनिक हिन्दी में लिप्यंतरित किया गया है।
- source_word: וַיֹּאמֶר ... אֵלַי
  choice: तब ... ने मुझसे कहा
  rationale: वाव-क्रमवाचक कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में क्रम स्पष्ट करता है।
- source_word: הֵיטַבְתָּ לִרְאוֹת
  choice: तूने ठीक देखा है
  rationale: मुहावरे का अर्थ है कि यिर्मयाह ने दर्शन को सही पहचाना; ‘ठीक’ सहज हिन्दी में ‘भली-भाँति/सही रीति से’ का भाव देता है।
- source_word: שֹׁקֵד
  choice: निगाह रखे हुए हूँ
  rationale: वर्तमान कृदन्त जागरूक और सतत चौकसी व्यक्त करता है। यह हिन्दी में स्वाभाविक है, यद्यपि पिछले पद के ‘बादाम’ के साथ इब्रानी शब्द-क्रीड़ा अनुवाद में नहीं बचती।
- source_word: דְּבָרִי
  choice: अपने वचन
  rationale: एकवचन ‘मेरे वचन’ का सीधा अर्थ सुरक्षित रहता है; इसे अधिक संकीर्ण ‘प्रतिज्ञा’ या ‘संदेश’ नहीं बनाया गया।
- source_word: לַעֲשֹׂתוֹ
  choice: पूरा करने के लिए
  rationale: उद्देश्यसूचक रचना बताती है कि याहवे अपने कहे हुए को कार्यरूप देंगे; ‘पूरा करना’ आधुनिक हिन्दी में स्वाभाविक और अर्थतः सटीक है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत नाम का प्रयोग करता है; उसे उपाधि ‘प्रभु’ से बदलने के बजाय नाम के रूप में रखा गया है।
- issue: भविष्यद्वाणी के प्रसंग में דָּבָר का अर्थ
  choice: वचन
  alternative: प्रतिज्ञा; संदेश
  rationale: इब्रानी शब्द को केवल प्रतिज्ञा या संदेश तक सीमित किए बिना उसकी व्यापकता और धर्मवैचारिक तनाव सुरक्षित रखा गया है।
- issue: שֹׁקֵד में चौकसी और तत्परता
  choice: उस पर निगाह रखे हुए हूँ
  alternative: उसके लिए जागता रहता हूँ; उसे पूरा करने में तत्पर हूँ
  rationale: चुना हुआ रूप सतत चौकसी को प्रमुख रखता है और केवल शीघ्रता का अर्थ आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। याहवे का संबोधन एकवचन ‘तू’ में है, जो इब्रानी द्वितीय पुरुष एकवचन और हिन्दी बाइबलीय संवाद-परंपरा के अनुरूप है।
