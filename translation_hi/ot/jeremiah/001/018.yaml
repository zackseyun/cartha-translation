base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/018.yaml
  text: And I—behold[a], I have made you today a fortified city, an iron pillar, and bronze walls against the whole land—against the kings of Judah, its officials, its priests[b], and the people of the land.
translation:
  language: hi
  text: और मैं—देख, आज मैंने तुझे सारे देश के विरुद्ध एक किलाबंद नगर, लोहे का खंभा और काँसे की दीवारें बना दिया है[a]—यहूदा के राजाओं, उसके अधिकारियों, उसके याजकों और देश के लोगों[b] के विरुद्ध।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आज मैंने तुझे एक किलाबंद नगर के रूप में स्थापित किया है।” हिब्रू क्रिया का मूल अर्थ “देना,” “रखना” या “ठहराना” है; यहाँ भाव यिर्मयाह को दृढ़ और अभेद्य बनाकर नियुक्त करने का है।
    reason: lexical_alternative
  - marker: b
    text: “देश के लोग” कुछ संदर्भों में शासकों से अलग सामान्य प्रजा को दर्शा सकता है; यहाँ यह अधिक व्यापक रूप से पूरे जनसमुदाय के लिए भी प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: और मैं
  rationale: संयोजक और स्वतंत्र सर्वनाम के बलाघात को बनाए रखता है, बिना इसे अनिवार्य रूप से विरोधसूचक बनाने के।
- source_word: הִנֵּה
  choice: देख
  rationale: ध्यान खींचने और कथन पर बल देने वाले हिब्रू अव्यय का स्वाभाविक आधुनिक हिन्दी रूप।
- source_word: נְתַתִּיךָ
  choice: मैंने तुझे ... बना दिया है
  rationale: क्रिया का मूल अर्थ ‘देना/रखना/ठहराना’ है, पर आगे के विधेयात्मक לְ-वाक्यांशों के साथ यहाँ नियुक्त या रूपकतः बना देने का भाव है।
- source_word: לְעִיר מִבְצָר
  choice: एक किलाबंद नगर
  rationale: यिर्मयाह को दृढ़ और अभेद्य उपस्थिति के रूप में स्थापित करने वाला रूपक स्पष्ट और स्वाभाविक ढंग से व्यक्त होता है।
- source_word: וּלְעַמּוּד בַּרְזֶל
  choice: लोहे का खंभा
  rationale: मूल रूपक का सीधा, सामान्य हिन्दी अनुवाद।
- source_word: וּלְחֹמוֹת נְחֹשֶׁת
  choice: काँसे की दीवारें
  rationale: נְחֹשֶׁת ताँबा या काँसा सूचित कर सकता है; दृढ़ धातु के इस बिंब में ‘काँसा’ उपयुक्त है और दीवारों का बहुवचन सुरक्षित है।
- source_word: עַל כָּל הָאָרֶץ
  choice: सारे देश के सामने
  rationale: संदर्भ में אֶרֶץ से यहूदा का देश अभिप्रेत है। עַל विरोध की दिशा बताता है; हिन्दी में ‘के सामने’ संघर्ष और सामना दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְשָׂרֶיהָ
  choice: उसके अधिकारियों
  rationale: שָׂרִים शासकीय पदाधिकारियों या प्रधानों को दर्शाता है; ‘अधिकारी’ आधुनिक और व्यापक रूप से समझ में आने वाला शब्द है।
- source_word: לְכֹהֲנֶיהָ
  choice: उसके याजकों
  rationale: כֹּהֲנִים का मानक हिन्दी बाइबलीय रूप।
- source_word: וּלְעַם הָאָרֶץ
  choice: देश के लोगों
  rationale: वाक्यांश को केवल निम्न वर्ग तक सीमित नहीं करता और पूरी जनसंख्या अथवा सामान्य प्रजा—दोनों संभावनाओं को खुला रखता है।
theological_decisions:
- issue: יְהוּדָה के संदर्भ में הָאָרֶץ का दायरा
  choice: ‘सारा देश’—अर्थात संदर्भानुसार यहूदा
  alternative: ‘सारी पृथ्वी’
  rationale: इसके तुरंत बाद यहूदा के राजा, अधिकारी, याजक और लोग गिनाए गए हैं; इसलिए स्थानीय-राष्ट्रीय अर्थ अधिक संभावित है, जबकि ‘सारा’ उस देश के भीतर समग्रता व्यक्त करता है।
- issue: यिर्मयाह को दृढ़ वस्तुओं के रूप में ‘देने’ का अर्थ
  choice: ‘बना दिया है’
  alternative: ‘ठहरा दिया है’ या ‘स्थापित किया है’
  rationale: यह चयन ईश्वरीय नियुक्ति और रूपकात्मक दृढ़ीकरण को स्वाभाविक हिन्दी में व्यक्त करता है; टिप्पणी मूल क्रिया के अधिक शाब्दिक विकल्प को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; स्वर गरिमापूर्ण और भविष्यद्वाणी-संगत है। ‘तुझे’ एकवचन संबोधन को स्पष्ट रखता है। ‘देख’ हिब्रू הִנֵּה का ध्यानाकर्षक बल बचाता है, और ‘के सामने’ विरोध की दिशा को स्वाभाविक हिन्दी में व्यक्त करता है।
