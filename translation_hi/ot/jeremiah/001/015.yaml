source:
  edition: WLC
  text: כִּ֣י הִנְ/נִ֣י קֹרֵ֗א לְ/כָֽל מִשְׁפְּח֛וֹת מַמְלְכ֥וֹת צָפ֖וֹנָ/ה נְאֻם יְהוָ֑ה וּ/בָ֡אוּ וְֽ/נָתְנוּ֩ אִ֨ישׁ כִּסְא֜/וֹ פֶּ֣תַח שַׁעֲרֵ֣י יְרוּשָׁלִַ֗ם וְ/עַ֤ל כָּל חוֹמֹתֶ֨י/הָ֙ סָבִ֔יב וְ/עַ֖ל כָּל עָרֵ֥י יְהוּדָֽה׀־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/015.yaml
  text: For behold[a], I am calling all the clans of the kingdoms of the north, declares Yahweh, and they will come, and each will set his throne at the entrance of the gates of Jerusalem, against all her walls all around[b], and against all the cities of Judah.
translation:
  language: hi
  text: क्योंकि देखो, मैं उत्तर के राज्यों के सभी कुलों[a] को बुला रहा हूँ—याहवे की यह घोषणा है। वे आएँगे, और उनमें से हर एक अपना सिंहासन यरूशलेम के फाटकों के मुहाने पर स्थापित करेगा, उसकी चारों ओर की सब दीवारों के विरुद्ध और यहूदा के सब नगरों के विरुद्ध।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द का अर्थ विस्तृत परिवार, कुल या इसी प्रकार का सामाजिक समूह हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי הִנְנִי
  choice: क्योंकि देखो, मैं
  rationale: כִּי पिछले कथन का कारण प्रस्तुत करता है, जबकि הִנְנִי ध्यान खींचते हुए आसन्न दैवी कार्रवाई पर बल देता है।
- source_word: קֹרֵא
  choice: बुला रहा हूँ
  rationale: वर्तमान कृदंत आसन्न अथवा जारी कार्रवाई व्यक्त करता है; प्रसंग में यह अधिकारपूर्वक बुलाने का भाव भी रखता है।
- source_word: לְכָל מִשְׁפְּחוֹת מַמְלְכוֹת צָפוֹנָה
  choice: उत्तर के राज्यों के सब कुलों
  rationale: מִשְׁפְּחוֹת विस्तृत पारिवारिक या कुलगत समूहों को सूचित करता है; 'कुल' घरेलू 'परिवारों' की अपेक्षा अधिक उपयुक्त है। מַמְלְכוֹת का बहुवचन बनाए रखा गया है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: गंभीर भविष्यद्वाणी-सूत्र को स्वाभाविक आधुनिक हिन्दी में रखा गया है और יהוה को उसके विशिष्ट नाम 'याहवे' से प्रस्तुत किया गया है।
- source_word: וְנָתְנוּ אִישׁ כִּסְאוֹ
  choice: उनमें से हर एक ... अपना सिंहासन लगाएगा
  rationale: אִישׁ यहाँ वितरणात्मक है। 'सिंहासन लगाएगा' आक्रमणकारी शासकों के अधिकार और न्याय की प्रतीकात्मक छवि सुरक्षित रखता है।
- source_word: פֶּתַח שַׁעֲרֵי יְרוּשָׁלִַם
  choice: यरूशलेम के फाटकों के प्रवेश पर
  rationale: פֶּתַח के 'प्रवेश/मुख' और שַׁעֲרֵי के बहुवचन, दोनों को बनाए रखा गया है।
- source_word: וְעַל כָּל חוֹמֹתֶיהָ סָבִיב
  choice: उसकी चारों ओर की सब शहरपनाहों के विरुद्ध
  rationale: सैनिक प्रसंग में עַל विरोधी दिशा, अर्थात 'के विरुद्ध', व्यक्त करता है; סָבִיב घेराव का भाव देता है। 'शहरपनाह' नगर की रक्षात्मक दीवार के अर्थ को स्पष्ट करती है।
- source_word: וְעַל כָּל עָרֵי יְהוּדָה
  choice: यहूदा के सब नगरों के विरुद्ध
  rationale: עַל को सैनिक प्रसंग के अनुसार 'के विरुद्ध' और עָרֵי के बहुवचन को 'नगरों' से व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में चतुरक्षरीय विशिष्ट नाम सीधे आया है; उसका लिप्यंतरण व्यक्तिगत वाचा-नाम को सामान्य उपाधि में बदलने से बचाता है।
- issue: אִישׁ ... כִּסְאוֹ का वितरणात्मक और पुल्लिंग रूप
  choice: उनमें से हर एक ... अपना सिंहासन लगाएगा
  alternative: हर पुरुष अपना सिंहासन लगाएगा / वे अपना-अपना सिंहासन लगाएंगे
  rationale: אִישׁ यहाँ प्रत्येक आक्रमणकारी शासक को अलग-अलग सूचित करता है, न कि पुरुषत्व पर विशेष बल देता है। एकवचन रचना मूल की वितरणात्मक छवि बनाए रखती है।
- issue: सिंहासन लगाने की छवि
  choice: शाब्दिक राजकीय-न्यायिक छवि बनाए रखी
  alternative: वे यरूशलेम को घेर लेंगे
  rationale: प्रसंग घेराव का संकेत देता है, पर मूल विशेष रूप से सिंहासनों और फाटकों की छवि रखता है; उसे केवल सैन्य व्याख्या में समेटना उचित नहीं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। 'फाटक', 'सिंहासन' और 'शहरपनाह' भविष्यद्वाणी के प्राचीन नगर तथा राजकीय परिवेश को स्पष्ट रखते हैं। मुख्य पाठ में दोनों पादटिप्पणी-चिह्न उपस्थित हैं।
