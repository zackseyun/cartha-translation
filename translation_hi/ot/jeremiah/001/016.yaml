source:
  edition: WLC
  text: וְ/דִבַּרְתִּ֤י מִשְׁפָּטַ/י֙ אוֹתָ֔/ם עַ֖ל כָּל רָעָתָ֑/ם אֲשֶׁ֣ר עֲזָב֗וּ/נִי וַֽ/יְקַטְּרוּ֙ לֵ/אלֹהִ֣ים אֲחֵרִ֔ים וַ/יִּֽשְׁתַּחֲו֖וּ לְ/מַעֲשֵׂ֥י יְדֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/016.yaml
  text: And I will pronounce my judgments against them for all their evil[a], because they have forsaken me, burned incense to other gods[b], and bowed down to the works of their own hands.
translation:
  language: hi
  text: और मैं उनकी सारी बुराई के कारण उनके विरुद्ध अपने न्यायिक निर्णय सुनाऊँगा[a], क्योंकि उन्होंने मुझे त्याग दिया, दूसरे देवताओं के लिए धूप जलाई और अपने ही हाथों की बनाई वस्तुओं के आगे दण्डवत किया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं उनकी सारी बुराई के विषय में उनके विरुद्ध अपने न्याय के वचन बोलूँगा।” इब्रानी क्रिया का शाब्दिक अर्थ “बोलना” है, पर यहाँ सम्भवतः औपचारिक रूप से न्यायिक निर्णय सुनाना अभिप्रेत है।
    reason: lexical_alternative
  - marker: b
    text: “अपने ही हाथों की बनाई वस्तुएँ” उन मूर्तियों की ओर संकेत करती हैं जिन्हें उन्होंने स्वयं बनाया था।
    reason: cultural_note
lexical_decisions:
- source_word: וְדִבַּרְתִּי מִשְׁפָּטַי אוֹתָם
  choice: मैं उनके विरुद्ध अपने न्याय के फैसले सुनाऊँगा
  rationale: דבר का मूल अर्थ ‘बोलना’ है, पर מִשְׁפָּטַי के साथ यहाँ न्यायिक घोषणा का भाव है। ‘फैसले सुनाऊँगा’ आधुनिक हिन्दी में औपचारिक न्याय-घोषणा को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עַל כָּל רָעָתָם
  choice: उनके सारे बुरे कामों के कारण
  rationale: עַל यहाँ न्याय का आधार बताता है। רָעָה के नैतिक अर्थ को बनाए रखते हुए ‘बुरे काम’ साधारण पाठक के लिए ‘बुराई’ से अधिक ठोस और प्रसंगानुकूल है।
- source_word: אֲשֶׁר עֲזָבוּנִי
  choice: क्योंकि उन्होंने मुझे त्याग दिया
  rationale: अभियोग के कारण को स्पष्ट करने के लिए אֲשֶׁר को यहाँ ‘क्योंकि’ से व्यक्त किया गया है। ‘त्याग दिया’ עזב का सम्बन्धपरक और वाचा-संबंधी भार बनाए रखता है।
- source_word: וַיְקַטְּרוּ לֵאלֹהִים אֲחֵרִים
  choice: दूसरे देवताओं के लिए धूप जलाई
  rationale: קטר का पिएल रूप मूर्तिपूजक प्रसंग में धूप या धूम-भेंट जलाने को सूचित करता है। ‘धूप जलाई’ स्पष्ट और प्रचलित हिन्दी है; ל की दिशा/समर्पण की भावना ‘के लिए’ से व्यक्त होती है।
- source_word: וַיִּשְׁתַּחֲווּ
  choice: दण्डवत किया
  rationale: यह शब्द झुकने या भूमि पर गिरकर प्रणाम करने की शारीरिक क्रिया बताता है। ‘दण्डवत किया’ उपासना-संबंधी प्रसंग में स्वाभाविक है और केवल सामान्यीकृत ‘पूजा की’ की अपेक्षा मूल चित्र को सुरक्षित रखता है।
- source_word: לְמַעֲשֵׂי יְדֵיהֶם
  choice: अपने ही हाथों की बनाई वस्तुओं के आगे
  rationale: शाब्दिक बिंब ‘उनके हाथों के काम’ का है और प्रसंग में वह स्वयं बनाई मूर्तियों की ओर संकेत करता है। यह अनुवाद उस भविष्यद्वक्तीय विडंबना को बनाए रखते हुए हिन्दी में अर्थ स्पष्ट करता है।
theological_decisions:
- issue: וְדִבַּרְתִּי מִשְׁפָּטַי में परमेश्वर की कार्रवाई का स्वरूप
  choice: परमेश्वर उनके विरुद्ध अपने न्यायिक फैसले औपचारिक रूप से सुनाएगा।
  alternative: परमेश्वर उनसे अपने नियमों के विषय में बोलेगा; अथवा केवल दण्ड कार्यान्वित करेगा और मौखिक घोषणा पर बल नहीं होगा।
  rationale: दבר और מִשְׁפָּט के इस भविष्यद्वक्तीय न्यायिक संयोजन में औपचारिक निर्णय सुनाने का अर्थ सबसे उपयुक्त है; फिर भी पादटिप्पणी क्रिया के शाब्दिक ‘बोलना’ को सुरक्षित रखती है।
- issue: मूर्तिपूजा के अभियोगों का निरूपण
  choice: यहोवा को त्यागना, दूसरे देवताओं के लिए धूप जलाना और हस्तनिर्मित वस्तुओं के आगे दण्डवत करना अलग-अलग ठोस अपराधों के रूप में रखा गया है।
  alternative: इन सबको संक्षेप में ‘उन्होंने मूर्तियों की पूजा की’ कहना।
  rationale: इब्रानी पाठ तीन विशिष्ट कार्रवाइयाँ गिनाता है। उन्हें अलग रखना मूल पाठ की वाचा-संबंधी और भविष्यद्वक्तीय अभियोग-शक्ति को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज रजिस्टर अपनाया गया है। ‘न्याय के फैसले सुनाऊँगा’ न्यायिक-भविष्यद्वक्तीय भाव देता है; ‘दण्डवत किया’ मूल की शारीरिक उपासना-क्रिया को बनाए रखता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
