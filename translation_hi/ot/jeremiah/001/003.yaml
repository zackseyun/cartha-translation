  text: וַ/יְהִ֗י בִּ/ימֵ֨י יְהוֹיָקִ֤ים בֶּן יֹאשִׁיָּ֨הוּ֙ מֶ֣לֶךְ יְהוּדָ֔ה עַד תֹּם֙ עַשְׁתֵּ֣י עֶשְׂרֵ֣ה שָׁנָ֔ה לְ/צִדְקִיָּ֥הוּ בֶן יֹאשִׁיָּ֖הוּ מֶ֣לֶךְ יְהוּדָ֑ה עַד גְּל֥וֹת יְרוּשָׁלִַ֖ם בַּ/חֹ֥דֶשׁ הַ/חֲמִישִֽׁי־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/003.yaml
  text: And it continued in the days of Jehoiakim son of Josiah[a], king of Judah, until the completion of the eleventh year of Zedekiah son of Josiah, king of Judah[b], until the exile of Jerusalem in the fifth month.
translation:
  language: hi
  text: और यह वचन यहूदा के राजा योशिय्याह के पुत्र यहोयाकीम के दिनों में होता रहा, और यहूदा के राजा योशिय्याह के पुत्र सिदकिय्याह के ग्यारहवें वर्ष के अंत तक—अर्थात पाँचवें महीने में यरूशलेम के निर्वासन तक[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात नगर के पतन के समय यरूशलेम के निवासियों को बंदी बनाकर देश से ले जाया जाना।
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי
  choice: और यह वचन ... आता रहा
  rationale: यह क्रिया पद 2 में आए ‘यहोवा का वचन’ को आगे बढ़ाती है और लंबे समय तक उसके आते रहने को दर्शाती है। हिंदी में स्पष्टता के लिए पिछले पद का विषय ‘यह वचन’ दोहराया गया है।
- source_word: בִּימֵי
  choice: के दिनों में
  rationale: यह इब्रानी काल-सूचक मुहावरे का स्वाभाविक और निकट हिंदी रूप है।
- source_word: עַד תֹּם עַשְׁתֵּי עֶשְׂרֵה שָׁנָה לְצִדְקִיָּהוּ
  choice: सिदकिय्याह के शासन के ग्यारहवें वर्ष के अंत तक
  rationale: राजकीय कालगणना के संदर्भ में לְצִדְקִיָּהוּ उसके शासन-वर्ष को सूचित करता है; ‘अंत तक’ תֹּם का स्वाभाविक हिंदी अनुवाद है।
- source_word: גְּלוֹת יְרוּשָׁלִַם
  choice: यरूशलेम के निर्वासन में ले जाए जाने तक
  rationale: גלה यहाँ निर्वासन अथवा देश से निकालकर ले जाए जाने की घटना बताता है। ‘यरूशलेम’ नगर के निवासियों के लिए लक्षणा के रूप में प्रयुक्त है; इसे पादटिप्पणी में स्पष्ट किया गया है।
- source_word: בַּחֹדֶשׁ הַחֲמִישִׁי
  choice: पाँचवें महीने में
  rationale: मूल के सीधे काल-सूचक वाक्यांश का सहज हिंदी रूप।
theological_decisions:
- issue: वाक्य के अव्यक्त विषय की पहचान
  choice: पद 2 के ‘वचन’ को ‘यह वचन’ के रूप में स्पष्ट करना
  alternative: सिर्फ ‘और यह ... होता रहा’ कहना
  rationale: इब्रानी वाक्य पिछले पद से विषय ग्रहण करता है। हिंदी में विषय को दोहराने से अर्थ स्पष्ट होता है और किसी अतिरिक्त धर्मवैज्ञानिक दावे का समावेश नहीं होता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। लंबे इब्रानी काल-विस्तार को हिंदी में स्पष्ट करने के लिए ‘आता रहा’ दोहराया गया है; नामों के प्रचलित हिंदी बाइबलीय रूप अपनाए गए हैं।
