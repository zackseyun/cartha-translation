  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/נִלְחֲמ֥וּ אֵלֶ֖י/ךָ וְ/לֹא י֣וּכְלוּ לָ֑/ךְ כִּֽי אִתְּ/ךָ֥ אֲנִ֛י נְאֻם יְהוָ֖ה לְ/הַצִּילֶֽ/ךָ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/019.yaml
  text: They will fight against you[a], but they will not prevail against you, for I am with you, declares Yahweh[c][b], to deliver you.
translation:
  language: hi
  text: वे तुमसे लड़ेंगे, पर तुम पर प्रबल न हो सकेंगे, क्योंकि मैं तुम्हें छुड़ाने के लिए तुम्हारे साथ हूँ—याहवे की यह घोषणा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנִלְחֲמוּ אֵלֶיךָ
  choice: वे तुमसे लड़ेंगे
  rationale: निफ़अल क्रिया לחם और אֶל का संयोग विरोधपूर्ण संघर्ष बताता है। आधुनिक हिन्दी में ‘तुमसे लड़ेंगे’ स्वाभाविक है और युद्ध के पैमाने को अनावश्यक रूप से नहीं बढ़ाता।
- source_word: וְלֹא יוּכְלוּ לָךְ
  choice: पर तुम पर प्रबल न हो सकेंगे
  rationale: יכל के साथ ל यहाँ विरोधी के विरुद्ध सफल न हो पाने का भाव देता है। ‘प्रबल न हो सकेंगे’ उनकी अंतिम असफलता व्यक्त करता है, यह नहीं कि यिर्मयाह को कोई कष्ट ही नहीं होगा।
- source_word: כִּי אִתְּךָ אֲנִי
  choice: क्योंकि मैं तुम्हारे साथ हूँ
  rationale: कारणसूचक כִּי और परमेश्वर की उपस्थिति के आश्वासन, दोनों को सीधे और स्वाभाविक रूप में रखा गया है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: यह भविष्यद्वाणी में ईश्वरीय वचन को चिह्नित करने वाला सूत्र है। हिन्दी में यह रूप गरिमापूर्ण और स्पष्ट है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ के व्यक्तिगत दिव्य नाम YHWH को उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: לְהַצִּילֶךָ
  choice: तुम्हें छुड़ाने के लिए
  rationale: हिफ़ील נצל संकट या शत्रु के हाथ से बचाकर निकालने का भाव रखता है। ‘छुड़ाने’ में यह सक्रिय उद्धार स्वाभाविक हिन्दी में व्यक्त होता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में चतुरक्षरी व्यक्तिगत नाम है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और नाम को किसी उपाधि में नहीं बदलता।
- issue: ईश्वरीय सुरक्षा की प्रतिज्ञा का बल
  choice: तुम पर प्रबल न हो सकेंगे
  alternative: तुम्हें पराजित न कर सकेंगे
  rationale: यह विरोधियों की अंतिम विफलता का आश्वासन देता है, पर यिर्मयाह के संघर्ष या दुःख की संभावना को मिटाता नहीं; इस प्रकार मूल का धार्मिक तनाव सुरक्षित रहता है।
- issue: לְהַצִּילֶךָ का प्रयोजनसूचक संबंध
  choice: तुम्हें छुड़ाने के लिए
  alternative: और मैं तुम्हें छुड़ाऊँगा
  rationale: मूल में infinitive construct है, इसलिए उसे अलग समन्वित प्रतिज्ञा बनाने के बजाय परमेश्वर की साथ रहने वाली उपस्थिति के उद्देश्य/परिणाम से जुड़ा रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्पष्ट, गरिमापूर्ण भविष्यद्वाणी-संबंधी गद्य। ‘प्रबल’ सामान्य पाठक के लिए बोधगम्य रहते हुए मूल के सफलता-असफलता वाले भाव को ‘हरा देना’ से अधिक ठीक रखता है। विराम-चिह्न घोषणा-सूत्र को पहचानने में सहायता देते हैं।
