source:
  edition: WLC
  text: רְאֵ֞ה הִפְקַדְתִּ֣י/ךָ הַ/יּ֣וֹם הַ/זֶּ֗ה עַל הַ/גּוֹיִם֙ וְ/עַל הַ/מַּמְלָכ֔וֹת לִ/נְת֥וֹשׁ וְ/לִ/נְת֖וֹץ וּ/לְ/הַאֲבִ֣יד וְ/לַ/הֲר֑וֹס לִ/בְנ֖וֹת וְ/לִ/נְטֽוֹעַ׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/010.yaml
  text: See[a], today I have appointed you over the nations and over the kingdoms, to uproot and to tear down, and to destroy and to demolish[c][b], to build and to plant.
translation:
  language: hi
  text: देख, आज[a] मैंने तुझे राष्ट्रों और राज्यों के ऊपर[c] नियुक्त किया है—उखाड़ने[b] और ढा देने, नष्ट करने और ध्वस्त करने, बनाने और रोपने के लिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “इस दिन।”
    reason: lexical_alternative
  - marker: b
    text: अथवा, “जड़ से निकालने।”
    reason: lexical_alternative
  - marker: c
    text: “राष्ट्रों और राज्यों के ऊपर” का अर्थ है कि यिर्मयाह को उनके विषय में परमेश्वर का भविष्यद्वक्ताई संदेश सुनाने का दायित्व दिया गया; इसका अर्थ प्रत्यक्ष राजनीतिक शासन नहीं है।
    reason: cultural_note
lexical_decisions:
- source_word: רְאֵה
  choice: देख
  rationale: ראה का एकवचन आज्ञार्थक रूप यहाँ ध्यान आकर्षित करता है। ‘देख’ आधुनिक, सीधा और स्वाभाविक है।
- source_word: הִפְקַדְתִּיךָ
  choice: मैंने तुझे नियुक्त किया है
  rationale: פקד का हिफ़ील रूप इस प्रसंग में किसी दायित्व या पद के लिए ठहराने/नियुक्त करने का अर्थ देता है; पूर्णकालिक रूप को वर्तमान परिणाम सहित व्यक्त किया गया है।
- source_word: הַיּוֹם הַזֶּה
  choice: आज
  rationale: शाब्दिक रूप ‘आज के इस दिन’ है; आधुनिक हिन्दी में ‘आज’ उसी तात्कालिकता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עַל הַגּוֹיִם וְעַל הַמַּמְלָכוֹת
  choice: राष्ट्रों और राज्यों के ऊपर
  rationale: פקד के साथ עַל नियुक्ति के कार्यक्षेत्र या अधिकार को सूचित करता है। ‘ऊपर’ मूल रूपक को बनाए रखता है; टिप्पणी स्पष्ट करती है कि यह भविष्यद्वक्ताई दायित्व है, प्रत्यक्ष राजनीतिक शासन नहीं।
- source_word: לִנְתוֹשׁ
  choice: उखाड़ने
  rationale: यह जड़ों समेत निकालने का कृषि-रूपक है और अंतिम ‘रोपने’ के साथ अर्थपूर्ण विरोध बनाता है।
- source_word: לִנְתוֹץ
  choice: ढा देने
  rationale: נתץ किसी संरचना को गिराने या तोड़ने का भाव देता है। ‘ढा देने’ को अगले विनाशकारी क्रिया-पद से अलग रखा गया है।
- source_word: וּלְהַאֲבִיד
  choice: नष्ट करने
  rationale: אבד का हिफ़ील रूप नाश कर देने का कारणवाचक अर्थ देता है; इस क्रिया-श्रृंखला में ‘नष्ट करने’ स्पष्ट और स्वाभाविक है।
- source_word: וְלַהֲרוֹס
  choice: ध्वस्त करने
  rationale: הרס ढहाने या पूरी तरह तोड़ देने का भाव रखता है। ‘ध्वस्त करने’ पूर्ववर्ती ‘ढा देने’ से पर्याप्त भिन्न रहते हुए संचयी बल बनाए रखता है।
- source_word: לִבְנוֹת
  choice: बनाने
  rationale: निर्माण और पुनर्स्थापना का रूपक सीधे बनाए रखा गया है।
- source_word: וְלִנְטוֹעַ
  choice: रोपने
  rationale: कृषि-रूपक को सीधे रखा गया है; यह ‘उखाड़ने’ का संतुलित प्रतिरूप है।
theological_decisions:
- issue: राष्ट्रों और राज्यों के ऊपर यिर्मयाह के अधिकार का स्वरूप
  choice: इसे राष्ट्रों और राज्यों के संबंध में दिया गया भविष्यद्वक्ताई अधिकार और दायित्व माना गया है।
  alternative: ‘राष्ट्रों और राज्यों के विरुद्ध’ अनुवाद करके न्याय के पक्ष को प्रमुख बनाना।
  rationale: नियुक्ति के इस प्रसंग में פקד के साथ עַל स्वाभाविक रूप से किसी कार्यक्षेत्र पर नियुक्त किए जाने का संकेत देता है। आगे के उद्देश्यवाचक क्रिया-पद बताते हैं कि यह अधिकार न्याय और पुनर्स्थापना के भविष्यद्वक्ताई वचन के द्वारा कार्य करता है, न कि नागरिक या राजनीतिक शासन के द्वारा।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सीधी किंतु गरिमापूर्ण रखी गई है। ‘तुझे’ एकवचन सम्बोधन को स्पष्ट करता है। चार न्यायसूचक क्रियाओं और दो पुनर्स्थापनासूचक क्रियाओं की लय तथा ‘उखाड़ने/रोपने’ के कृषि-रूपक को सुरक्षित रखा गया है।
