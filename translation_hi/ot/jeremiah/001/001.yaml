  text: The words of Yirmeyahu son of Hilqiyahu[a], one of the priests who were in Anathoth, in the land of Benjamin.
translation:
  language: hi
  text: बिन्यामीन के प्रदेश में अनातोत में रहने वाले याजकों में से एक, हिल्कियाहू के पुत्र यिर्मयाहू[a] के वचन।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: परंपरागत हिन्दी बाइबलों में इन नामों के रूप सामान्यतः “यिर्मयाह” और “हिल्किय्याह” मिलते हैं। यहाँ इब्रानी के पूर्ण रूपों के अधिक निकट “यिर्मयाहू” और “हिल्कियाहू” लिखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי
  choice: वचन
  rationale: यह דָּבָר का रचनात्मक बहुवचन है और पुस्तक के शीर्षक का आरम्भ करता है। ‘वचन’ भविष्यद्वक्ता के कथनों के लिए स्वाभाविक और गरिमापूर्ण है, जबकि मूल के व्यापक अर्थ को किसी एक प्रकार के संदेश तक सीमित नहीं करता।
- source_word: יִרְמְיָהוּ
  choice: यिर्मयाहू
  rationale: इब्रानी नाम के पूर्ण रूप को देवनागरी में निकटता से लिप्यंतरित किया गया है; अंतिम -याहू को बनाए रखा गया है।
- source_word: בֶּן
  choice: के पुत्र
  rationale: वंश-संबंध बताने वाले सामान्य इब्रानी प्रयोग का स्वाभाविक हिन्दी रूप।
- source_word: חִלְקִיָּהוּ
  choice: हिल्कियाहू
  rationale: इब्रानी नाम को परंपरागत संक्षिप्त रूप के बजाय उसके पूर्ण उच्चारण के निकट लिप्यंतरित किया गया है।
- source_word: מִן הַכֹּהֲנִים
  choice: याजकों में से एक
  rationale: מִן यहाँ समूह में सहभागिता बताने वाला अंशवाचक प्रयोग है; यह रूप स्पष्ट करता है कि यिर्मयाहू उस याजकीय समूह में से एक था।
- source_word: אֲשֶׁר בַּעֲנָתוֹת
  choice: अनातोत में रहने वाले
  rationale: इब्रानी में केवल स्थानगत संबंध व्यक्त है और क्रिया निहित है। आधुनिक हिन्दी में ‘रहने वाले’ उस संबंध को सहज रूप से व्यक्त करता है, बिना स्थायी निवास से अधिक कुछ जोड़े।
- source_word: בְּאֶרֶץ בִּנְיָמִן
  choice: बिन्यामीन प्रदेश के
  rationale: אֶרֶץ यहाँ पृथ्वी नहीं, बिन्यामीन का भूभाग है। ‘प्रदेश’ इस क्षेत्रीय अर्थ को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
