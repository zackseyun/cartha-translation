base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/014.yaml
  text: And Yahweh said to me[b][a], “From the north the disaster will break forth against all the inhabitants of the land.”
translation:
  language: hi
  text: तब याहवे ने मुझसे कहा, “उत्तर से विपत्ति[a] देश[b] के सभी निवासियों पर फूट निकलेगी।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मुसीबत”; अधिक शाब्दिक रूप से, “बुराई फूट निकलेगी।”
    reason: lexical_alternative
  - marker: b
    text: “देश” से यहाँ संभवतः यहूदा देश अभिप्रेत है; दूसरा सम्भव अर्थ “पृथ्वी” है।
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय उसका प्रचलित लिप्यंतरण रखा गया है।
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रम कथा को आगे बढ़ाता है; आधुनिक हिन्दी में ‘तब’ इस क्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֵלָי
  choice: मुझसे
  rationale: कहने की क्रिया के साथ आधुनिक मानक हिन्दी का स्वाभाविक प्रयोग।
- source_word: מִצָּפוֹן
  choice: उत्तर दिशा से
  rationale: आने वाली विपत्ति के भौगोलिक स्रोत को स्पष्ट और प्रत्यक्ष रूप से व्यक्त करता है।
- source_word: תִּפָּתַח
  choice: टूट पड़ेगी
  rationale: निफ़अल रूप का शाब्दिक अर्थ ‘खोली जाएगी’ है, पर विपत्ति के संदर्भ में यह उसके छूट पड़ने या प्रबल रूप से आ पड़ने का बोध देता है; ‘टूट पड़ेगी’ हिन्दी में उस सजीव और आसन्न भाव को स्वाभाविक रूप से रखता है।
- source_word: הָרָעָה
  choice: विपत्ति
  rationale: यहाँ शब्द नैतिक बुराई के बजाय दंडस्वरूप आने वाली हानि या आपदा को दर्शाता है। ‘विपत्ति’ आधुनिक, गरिमापूर्ण और संदर्भानुकूल है।
- source_word: עַל
  choice: पर
  rationale: ‘टूट पड़ना’ के साथ ‘पर’ हिन्दी में लक्ष्य के विरुद्ध आने वाली विपत्ति का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: כָּל יֹשְׁבֵי הָאָרֶץ
  choice: इस देश के सभी निवासी
  rationale: संदर्भ में אֶרֶץ का संकेत संभवतः यहूदा के देश की ओर है। ‘इस देश’ स्थानीय अर्थ को स्पष्ट करता है, जबकि व्यापक ‘पृथ्वी’ अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: הָרָעָה का अर्थ और ईश्वरीय न्याय से उसका संबंध
  choice: ‘विपत्ति’
  alternative: ‘बुराई’ या ‘मुसीबत’
  rationale: उत्तर से आने वाले न्याय के प्रसंग में यह नैतिक बुराई नहीं, बल्कि घटित होने वाली आपदा या विपत्ति है। इससे पाठ से परे यह दावा नहीं जुड़ता कि परमेश्वर नैतिक बुराई उत्पन्न करता है।
- issue: הָאָרֶץ का भौगोलिक विस्तार
  choice: ‘इस देश’—प्रसंगतः यहूदा
  alternative: ‘पृथ्वी’
  rationale: उत्तर से आने वाले आक्रमण और यिर्मयाह के निकट संदर्भ में स्थानीय अर्थ सबसे उपयुक्त है, फिर भी मूल शब्द के व्यापक अर्थ को पादटिप्पणी में बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण भविष्यवाणी-संबंधी शैली रखी गई है। ‘टूट पड़ेगी’ मूल के चित्रात्मक बल को बनाए रखता है, और पादटिप्पणियाँ उसकी शाब्दिक तथा अर्थगत अस्पष्टताओं को सुरक्षित रखती हैं।
