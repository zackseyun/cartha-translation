source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח יְהוָה֙ אֶת יָד֔/וֹ וַ/יַּגַּ֖ע עַל פִּ֑/י וַ/יֹּ֤אמֶר יְהוָה֙ אֵלַ֔/י הִנֵּ֛ה נָתַ֥תִּי דְבָרַ֖/י בְּ/פִֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/009.yaml
  text: Then the LORD stretched out his hand and touched my mouth, and the LORD said to me, “Look, I have put my words in your mouth.”
translation:
  language: hi
  text: तब यहोवा ने अपना हाथ बढ़ाकर मेरे मुँह को छुआ, और यहोवा ने मुझसे कहा, “देख, मैंने अपने वचन तेरे मुँह में रख दिए हैं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को हिन्दी में प्रचलित और स्पष्ट रूप में प्रस्तुत किया गया है।
- source_word: וַיִּגַּע עַל־פִּי
  choice: मेरे मुँह को छुआ
  rationale: हिब्रू में प्रयुक्त עַל के मुहावरेदार अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הִנֵּה
  choice: देख
  rationale: ध्यान आकर्षित करने वाले प्रत्यक्ष उद्गार को सरल और वर्तमान हिन्दी में बनाए रखता है।
- source_word: דְבָרַי
  choice: अपने वचन
  rationale: बहुवचन रूप का सम्मान करते हुए ‘वचन’ को सामूहिक अर्थ में रखा गया है; क्रिया का बहुवचन ‘डाल दिए हैं’ इस बहुलता को स्पष्ट करता है।
- source_word: נָתַתִּי ... בְּפִיךָ
  choice: मैंने ... तेरे मुँह में डाल दिए हैं
  rationale: शाब्दिक ‘दिया’ के बजाय प्रसंगानुकूल ‘डाल दिए’ भविष्यद्वक्ता को सौंपे गए दिव्य संदेश की सजीव छवि और लक्ष्यभाषा की स्वाभाविकता दोनों बनाए रखता है।
theological_decisions:
- issue: दिव्य नाम का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में टेट्राग्रामटन יהוה है; इसलिए उपाधि के बजाय व्यक्तिगत नाम को पारदर्शी रूप से रखा गया है।
- issue: ‘वचन’ का वचनगत संख्या-भाव
  choice: अपने वचन ... डाल दिए हैं
  alternative: अपनी बातें ... डाल दी हैं
  rationale: दिव्य संदेश के धार्मिक और भविष्यद्वाणी-संबंधी अर्थ को बनाए रखते हुए हिब्रू बहुवचन דְבָרַי का संकेत क्रिया में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण है। परमेश्वर की ओर से यिर्मयाह को एकवचन आत्मीय संबोधन के कारण ‘तेरे’ रखा गया है; वर्णन में वक्ता के लिए ‘मेरे’ स्वाभाविक रूप से प्रयुक्त है।
