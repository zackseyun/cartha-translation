base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/006.yaml
  text: Then I said[a], “Ah, Lord Yahweh! Look, I do not know how to speak[c][b], for I am a youth.”
translation:
  language: hi
  text: तब मैंने कहा, “हाय, प्रभु यहोवा! देखिए, मैं बोलना नहीं जानता, क्योंकि मैं युवा हूँ।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘युवा’ के लिए प्रयुक्त इब्रानी शब्द का अर्थ प्रसंग के अनुसार ‘बालक’, ‘किशोर’ या ‘युवा पुरुष’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: तब मैंने कहा
  rationale: वय्यिक्तोल रूप कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में क्रम व्यक्त करता है।
- source_word: אֲהָהּ
  choice: हाय
  rationale: यह व्यथा अथवा संकोचपूर्ण आपत्ति का उद्गार है; ‘हाय’ आधुनिक हिन्दी में इसकी भावात्मक शक्ति रखता है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: ‘प्रभु’ אֲדֹנָי को और ‘यहोवा’ चतुरक्षरीय दिव्य नाम को अलग-अलग स्पष्ट रूप से प्रस्तुत करता है।
- source_word: הִנֵּה
  choice: देखिए
  rationale: यह ध्यान खींचने वाला अव्यय है; परमेश्वर को संबोधित प्रसंग में आदरसूचक ‘देखिए’ स्वाभाविक है।
- source_word: לֹא יָדַעְתִּי דַּבֵּר
  choice: मैं बोलना नहीं जानता
  rationale: यह इब्रानी मुहावरे का सहज हिन्दी रूप है और अक्षमता अथवा अनुभवहीनता व्यक्त करता है, पूर्ण मूकता नहीं।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह यिर्मयाह की आपत्ति का कारण प्रस्तुत करता है।
- source_word: נַעַר
  choice: अभी युवा
  rationale: נַעַר की आयु-सीमा बालक से युवा पुरुष तक हो सकती है; ‘युवा’ उसका व्यापक अर्थ बचाता है और ‘अभी’ प्रसंगगत अपरिपक्वता पर बल देता है।
- source_word: אָנֹכִי
  choice: मैं ... हूँ
  rationale: स्वतंत्र सर्वनाम का बल हिन्दी की स्वाभाविक विधेय रचना में सुरक्षित है।
theological_decisions:
- issue: संयुक्त उपाधि אֲדֹנָי יְהוִה में दिव्य नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर
  rationale: मूल पाठ में सामान्य उपाधि के साथ व्यक्तिगत दिव्य नाम भी है; ‘प्रभु यहोवा’ दोनों तत्वों को बनाए रखता है और उन्हें एक सामान्य पदवी में नहीं मिलाता।
- issue: यिर्मयाह की बोलने संबंधी आपत्ति का स्वरूप
  choice: मैं बोलना नहीं जानता
  alternative: मैं बोलने में कुशल नहीं हूँ
  rationale: मूल पाठ सामान्य और कुछ हद तक अस्पष्ट है; अनुवाद इसे निश्चित रूप से वाक्पटुता की कमी या किसी शारीरिक अक्षमता में सीमित नहीं करता।
translation_notes:
  register: आधुनिक, आदरपूर्ण और सहज हिन्दी। संबोधन में ‘देखिए’ आदरसूचक है। ‘हाय’ तत्काल व्यथा और संकोचपूर्ण विरोध व्यक्त करता है। फुटनोट का चिह्न मुख्य पाठ में रखा गया है।
