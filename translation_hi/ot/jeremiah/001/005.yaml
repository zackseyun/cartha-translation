base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/005.yaml
  text: Before I formed you in the womb[a], I knew you, and before you came out from the womb, I set you apart[b]; I appointed you as a prophet to the nations.
translation:
  language: hi
  text: इससे पहले कि मैं तुझे गर्भ में रचता, मैं तुझे जानता था,[a] और इससे पहले कि तू कोख से बाहर आता, मैंने तुझे अलग ठहराया था;[b] मैंने तुझे राष्ट्रों के लिए नबी नियुक्त किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘जानता था’ में व्यक्तिगत लगाव या चुनाव का भाव भी हो सकता है; मूल इब्रानी में व्यापक क्रिया ‘जानना’ है।
    reason: lexical_alternative
  - marker: b
    text: या, “मैंने तुझे पवित्र उद्देश्य के लिए अलग कर दिया था”; अथवा, “मैंने तुझे पवित्र ठहराया था।”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּטֶרֶם
  choice: से पहले ही
  rationale: यह समय-सूचक पद किसी घटना से पूर्व का समय बताता है। ‘से पहले ही’ स्वाभाविक हिन्दी में पूर्वता को स्पष्ट करता है, बिना अर्थ में अनावश्यक वृद्धि किए।
- source_word: אצור/ך (אֶצָּרְךָ, lemma יצר)
  choice: तुझे रचने
  rationale: יצר का मूल भाव आकार देने या गढ़ने का है। ‘रचना’ गर्भ में परमेश्वर द्वारा आकार दिए जाने की ठोस छवि को सहज और गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: בַבֶּטֶן
  choice: गर्भ में
  rationale: בטן का अर्थ पेट या गर्भ हो सकता है; जन्मपूर्व संदर्भ में ‘गर्भ’ अभिप्रेत और स्वाभाविक है।
- source_word: יְדַעְתִּיךָ
  choice: मैं तुझे जानता था
  rationale: ידע का मूल अर्थ ‘जानना’ है और इसमें व्यक्तिगत संबंध, मान्यता या चुनाव की छाया हो सकती है। मुख्य पाठ व्यापक शब्दावली को बनाए रखता है और इसे केवल ‘चुना’ तक सीमित नहीं करता।
- source_word: תֵּצֵא מֵרֶחֶם
  choice: कोख से तेरे बाहर आने
  rationale: יצא का ठोस अर्थ ‘बाहर आना’ और רחם का अर्थ ‘कोख/गर्भ’ है। यह वाक्यांश जन्म की स्पष्ट छवि रखते हुए हिन्दी में स्वाभाविक है।
- source_word: הִקְדַּשְׁתִּיךָ
  choice: मैंने तुझे अलग ठहराया था
  rationale: קדש के हिफ़ील रूप का अर्थ किसी पवित्र उद्देश्य के लिए समर्पित या अलग करना है। ‘अलग ठहराया’ सामान्य पाठक के लिए सुबोध है और समर्पण का भाव बनाए रखता है।
- source_word: נָבִיא
  choice: नबी
  rationale: आधुनिक हिन्दी बाइबलीय प्रयोग में נביא का स्थापित और व्यापक रूप से समझा जाने वाला अनुवाद ‘नबी’ है।
- source_word: לַגּוֹיִם
  choice: राष्ट्रों के लिए
  rationale: גוים का अर्थ राष्ट्र या जातियाँ है। ‘राष्ट्रों के लिए’ यिर्मयाह की सेवकाई के व्यापक दायरे को व्यक्त करता है और बाद की किसी विशिष्ट पारिभाषिक धारणा को नहीं थोपता।
- source_word: נְתַתִּיךָ
  choice: मैंने तुझे नियुक्त किया था
  rationale: נתן का मूल अर्थ ‘देना’ है, पर किसी भूमिका में स्थापित करने के प्रसंग में इसका अर्थ नियुक्त करना हो सकता है। ‘नियुक्त किया’ नबी के रूप में दिए गए दायित्व को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: יְדַעְתִּיךָ में पूर्वज्ञान, व्यक्तिगत संबंध और चुनाव के बीच अर्थ-संबंध
  choice: मुख्य पाठ में ‘मैं तुझे जानता था’ रखा गया है।
  alternative: ‘मैंने तुझे चुन लिया था’ या ‘मैंने तुझे अपना माना था।’
  rationale: यहाँ प्रयुक्त क्रिया ידע व्यापक है और संबंधपरक जानकारी या चुनाव का संकेत दे सकती है, पर स्वयं शब्द केवल ‘चुनना’ नहीं है। इसलिए अनुवाद मूल की अर्थगत व्यापकता और धर्मवैचारिक तनाव को खुला रखता है।
- issue: הִקְדַּשְׁתִּיךָ का समर्पण-संबंधी अर्थ
  choice: ‘मैंने तुझे अलग ठहराया था।’
  alternative: ‘मैंने तुझे पवित्र ठहराया था’ या ‘मैंने तेरा अभिषेक किया था।’
  rationale: यह क्रिया पवित्र उद्देश्य के लिए अलग किए जाने को व्यक्त करती है। ‘अलग ठहराया’ सुलभ है; ‘पवित्र ठहराया’ संभव विकल्प है। ‘अभिषेक’ मूल क्रिया में निहित नहीं है, इसलिए उसे मुख्य पाठ में नहीं अपनाया गया।
- issue: לַגּוֹיִם में सेवकाई का लक्ष्य या संबंध
  choice: ‘राष्ट्रों के लिए नबी।’
  alternative: ‘राष्ट्रों का नबी’ या ‘राष्ट्रों के पास नबी।’
  rationale: लामेद संबंध, उद्देश्य या दिशा व्यक्त कर सकता है। ‘राष्ट्रों के लिए’ इस व्यापकता को बनाए रखता है और यह अनावश्यक रूप से निर्धारित नहीं करता कि यिर्मयाह केवल उनके पास भेजा गया था या उन पर संदेश सुनाने के लिए नियुक्त हुआ था।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘रचना,’ ‘गर्भ’ और ‘कोख से बाहर आना’ मूल की सजीव जन्म-संबंधी छवियों को सुरक्षित रखते हैं। ‘नबी’ हिन्दी बाइबलीय परंपरा का परिचित शब्द है। दोनों पादटिप्पणी-चिह्न उन्हीं पदबंधों के बाद रखे गए हैं जिनकी वे व्याख्या करते हैं।
