id: JER.1.11
reference: Jeremiah 1:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יְהִ֤י דְבַר יְהוָה֙ אֵלַ֣/י לֵ/אמֹ֔ר מָה אַתָּ֥ה רֹאֶ֖ה יִרְמְיָ֑הוּ וָ/אֹמַ֕ר מַקֵּ֥ל שָׁקֵ֖ד אֲנִ֥י רֹאֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/011.yaml
  text: And the word of Yahweh came to me[a], saying, “What do you see, Jeremiah?” And I said, “I see a branch of an almond tree.”
translation:
  language: hi
  text: 'फिर याहवे का वचन मेरे पास आया: “यिर्मयाह, तू क्या देखता है?” मैंने कहा, “मैं बादाम की एक डाली[a] देखता हूँ।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बादाम की लकड़ी की एक छड़ी।” इब्रानी מַקֵּל का अर्थ डाली के साथ-साथ छड़ी या डंडा भी हो सकता है। अगले पद में “बादाम” (शाकेद) और “जागता रहता हूँ” (शोकेद) के बीच शब्द-क्रीड़ा है।
    reason: मूल शब्द की वास्तविक अर्थगत अनिश्चितता और अगले पद की इब्रानी शब्द-क्रीड़ा को सुरक्षित रखना।
lexical_decisions:
- source_word: וַיְהִי דְבַר־יְהוָה אֵלַי
  choice: फिर याहवे का वचन मेरे पास आया
  rationale: यह प्रचलित भविष्यवाणी-सूत्र को स्वाभाविक आधुनिक हिन्दी में रखता है। ‘वचन’ मूल के דְבַר से औपचारिक संबंध बनाए रखता है, और ‘फिर’ कथा के अगले क्षण को व्यक्त करता है।
- source_word: לֵאמֹר
  choice: 'आया:'
  rationale: हिन्दी में प्रत्यक्ष कथन से पहले द्विबिंदु लगाना ‘यह कहते हुए’ की अपेक्षा अधिक स्वाभाविक है और वही परिचयात्मक कार्य करता है।
- source_word: מָה אַתָּה רֹאֶה
  choice: तू क्या देखता है?
  rationale: सहभागी कृदंत का स्वाभाविक हिन्दी रूप वर्तमानकालीन प्रश्न है। परमेश्वर द्वारा यिर्मयाह को एकवचन संबोधन के कारण ‘तू’ निकट और सीधा है।
- source_word: מַקֵּל
  choice: डाली
  rationale: शब्द का अर्थ छड़ी, डंडा या वृक्ष की डाली हो सकता है। इस दर्शन में बादाम के वृक्ष से जुड़ी वस्तु के लिए ‘डाली’ सहज है, जबकि वैकल्पिक अर्थ पाद-टिप्पणी में सुरक्षित रखा गया है।
- source_word: שָׁקֵד
  choice: बादाम
  rationale: यह बादाम के वृक्ष अथवा उसकी लकड़ी को सूचित करता है। ‘बादाम की एक डाली’ हिन्दी में स्पष्ट और स्वाभाविक है तथा अगले पद की शब्द-क्रीड़ा की पृष्ठभूमि बनाए रखता है।
- source_word: אֲנִי רֹאֶה
  choice: मैं ... देखता हूँ
  rationale: स्पष्ट सर्वनाम सहित यह उत्तर मूल की प्रत्यक्षता और हल्के बल को स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में उपाधि नहीं, चार-अक्षरीय व्यक्तिगत नाम है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और नाम को उपाधि से प्रतिस्थापित नहीं करता।
- issue: מַקֵּל की दृश्य-वस्तु
  choice: डाली
  alternative: छड़ी या डंडा
  rationale: संदर्भ बादाम के वृक्ष की वस्तु का दर्शन कराता है, इसलिए मुख्य पाठ में ‘डाली’ स्वाभाविक है; फिर भी मूल शब्द की व्यापक अर्थ-सीमा को पाद-टिप्पणी में बनाए रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। प्रत्यक्ष संवाद में ‘तू’ एकवचन संबोधन को स्पष्ट करता है और कृत्रिम औपचारिकता से बचता है। पाद-टिप्पणी का चिह्न उसी पदांश के बाद रखा गया है जिससे वह संबंधित है।
