source:
  edition: WLC
  text: וַ/יְהִ֨י דְבַר יְהוָ֤ה אֵלַ/י֙ שֵׁנִ֣ית לֵ/אמֹ֔ר מָ֥ה אַתָּ֖ה רֹאֶ֑ה וָ/אֹמַ֗ר סִ֤יר נָפ֨וּחַ֙ אֲנִ֣י רֹאֶ֔ה וּ/פָנָ֖י/ו מִ/פְּנֵ֥י צָפֽוֹנָ/ה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/013.yaml
  text: And the word of Yahweh came to me a second time[a], saying, “What do you see?” And I said, “I see a boiling pot[b], and its face is from the north.”
translation:
  language: hi
  text: याहवे का वचन दूसरी बार मेरे पास आया। उसने कहा, “तुम्हें क्या दिखाई दे रहा है?” मैंने कहा, “मुझे एक उबलती हुई हाँडी[a] दिखाई दे रही है, और उसका मुँह उत्तर की दिशा की ओर है[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसे “खौलती हुई” या ऐसी हाँडी भी समझा जा सकता है जिसे फूँक या हवा देकर आग भड़काने से उबाला जा रहा हो; हिब्रू कृदंत में यह भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उसका मुख उत्तर के मुख/सामने से है।” यह इब्रानी अभिव्यक्ति अस्पष्ट है; संभवतः हाँडी की खुली ओर या उसके झुकाव का उत्तर दिशा से संबंध बताया गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: דְבַר יְהוָה
  choice: याहवे का वचन
  rationale: यह भविष्यवाणी-साहित्य का प्रचलित सूत्र है। ‘वचन’ मूल के דָּבָר को बनाए रखता है और יְהוָה को उसके निजी नाम ‘याहवे’ के रूप में प्रस्तुत करता है।
- source_word: שֵׁנִית
  choice: दूसरी बार
  rationale: यह क्रम को स्पष्ट रूप से सूचित करता है; केवल ‘फिर’ की अपेक्षा मूल के अधिक निकट है।
- source_word: מָה אַתָּה רֹאֶה
  choice: तुम्हें क्या दिखाई दे रहा है?
  rationale: हिब्रू कृदंत की जारी दृश्य-क्रिया को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: סִיר נָפוּחַ
  choice: एक उबलती हुई हाँडी
  rationale: סִיר खाना पकाने का पात्र है और נָפוּחַ में फूँके अथवा धौंके जाने से खौलने का चित्र हो सकता है। ‘उबलती हुई हाँडी’ हिन्दी में दृश्य को सहज और सजीव रखती है।
- source_word: וּפָנָיו
  choice: और उसका मुँह
  rationale: פָּנִים का मूल अर्थ ‘मुख/चेहरा’ है; पात्र के संदर्भ में ‘मुँह’ उसकी खुली ओर को स्वाभाविक ढंग से व्यक्त करता है, पर सटीक अभिमुखता को पूरी तरह निर्धारित नहीं करता।
- source_word: מִפְּנֵי צָפוֹנָה
  choice: उत्तर की ओर से है
  rationale: मूल वाक्यांश कठिन और स्थानिक रूप से अस्पष्ट है। यह अनुवाद उत्तर के साथ दिशा-संबंध बनाए रखता है और हाँडी के झुकाव या खुली दिशा को आवश्यकता से अधिक निश्चित नहीं करता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ के निजी ईश्वरीय नाम को लिप्यंतरित किया गया है; इसे किसी उपाधि से बदलकर उसका भेद मिटाया नहीं गया।
- issue: हाँडी के मुँह की दिशा
  choice: उसका मुँह उत्तर की ओर से है
  alternative: उसका मुँह उत्तर की ओर है; वह उत्तर की ओर से झुकी हुई है
  rationale: हिब्रू अभिव्यक्ति की स्थानिक रचना अस्पष्ट है। चुना हुआ पाठ उत्तर से संबंध बनाए रखता है, किंतु दर्शन की वास्तविक ज्यामिति या अगले पद में आनेवाली विपत्ति की व्याख्या को समय से पहले निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। संवाद में स्वाभाविक हिन्दी का प्रयोग है, जबकि कठिन दिशात्मक वाक्यांश की मूल अस्पष्टता मुख्य पाठ और पादटिप्पणी में सुरक्षित रखी गई है।
