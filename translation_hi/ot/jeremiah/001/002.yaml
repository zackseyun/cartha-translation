source:
  edition: WLC
  text: אֲשֶׁ֨ר הָיָ֤ה דְבַר יְהוָה֙ אֵלָ֔י/ו בִּ/ימֵ֛י יֹאשִׁיָּ֥הוּ בֶן אָמ֖וֹן מֶ֣לֶךְ יְהוּדָ֑ה בִּ/שְׁלֹשׁ עֶשְׂרֵ֥ה שָׁנָ֖ה לְ/מָלְכֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/002.yaml
  text: to whom the word of Yahweh came in the days of Josiah son of Amon, king of Judah, in the thirteenth year of his reign.
translation:
  language: hi
  text: जिसके पास याहवे का वचन आमोन के पुत्र, यहूदा के राजा योशिय्याह के दिनों में, उसके राज्य के तेरहवें वर्ष पहुँचा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲשֶׁר ... אֵלָיו
  choice: जिसके पास
  rationale: सम्बन्धवाचक उपवाक्य पिछले पद के यिर्मयाह की ओर संकेत करता है। ‘जिसके पास’ हिन्दी में אֵלָיו की दिशात्मकता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הָיָה דְבַר־יְהוָה
  choice: याहवे का वचन ... आया
  rationale: यह मानक नबूवत-सूचक इब्रानी प्रयोग है। ‘वचन आया’ उसके मुहावरेदार अर्थ को बनाए रखता है, जबकि केवल ‘था’ हिन्दी में अस्पष्ट और अस्वाभाविक होता।
- source_word: דְבַר
  choice: वचन
  rationale: ‘वचन’ दैवी प्रकाशन के भार को बनाए रखता है और अधिक व्याख्यात्मक ‘संदेश’ की अपेक्षा स्रोत के निकट है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम का हिन्दी लिप्यंतरण किया गया है; इसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: בִּימֵי יֹאשִׁיָּהוּ
  choice: योशिय्याह के दिनों में
  rationale: काल-सूचक इब्रानी पदबंध का स्वाभाविक और पारंपरिक हिन्दी रूप।
- source_word: בֶן־אָמוֹן מֶלֶךְ יְהוּדָה
  choice: यहूदा के राजा, आमोन के पुत्र
  rationale: वंश और राजकीय पदवी दोनों सुरक्षित हैं; हिन्दी वाक्यक्रम में इन्हें योशिय्याह की पहचान के रूप में रखा गया है।
- source_word: בִּשְׁלֹשׁ עֶשְׂרֵה שָׁנָה לְמָלְכוֹ
  choice: उसके शासन के तेरहवें वर्ष में
  rationale: यह राजकीय वर्ष के अनुसार तिथि बताने वाला सूत्र है। ‘शासन के तेरहवें वर्ष’ आधुनिक हिन्दी में स्पष्ट है और לְמָלְכוֹ का आशय ठीक व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और नाम को उपाधि में बदलने से बचाता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। पद 1 से जुड़े सम्बन्धवाचक वाक्य-खंड का रूप बनाए रखा गया है; नामों के लिए हिन्दी बाइबलीय प्रचलन ‘योशिय्याह’, ‘आमोन’ और ‘यहूदा’ अपनाया गया है।
