id: JER.1.8
reference: Jeremiah 1:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אַל תִּירָ֖א מִ/פְּנֵי/הֶ֑ם כִּֽי אִתְּ/ךָ֥ אֲנִ֛י לְ/הַצִּלֶ֖/ךָ נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/008.yaml
  text: Do not be afraid of them[a], for I am with you to deliver you[b], declares Yahweh.
translation:
  language: hi
  text: “उनसे मत डर[a], क्योंकि मैं तुझे छुड़ाने[b] के लिए तेरे साथ हूँ,” यह याहवे की घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘उनके सामने से’ या ‘उनकी उपस्थिति से’; यहाँ मुहावरे का अर्थ ‘उनसे’ अथवा ‘उनके कारण’ है।
    reason: lexical_alternative
  - marker: b
    text: या ‘बचाने’।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּירָא
  choice: मत डर
  rationale: אַל के साथ अपूर्ण/आज्ञार्थक रूप निषेध व्यक्त करता है। एकवचन संबोधन को बनाए रखते हुए ‘मत डर’ स्वाभाविक और सीधा हिन्दी निषेध है।
- source_word: מִפְּנֵיהֶם
  choice: उनसे
  rationale: शाब्दिक अर्थ ‘उनके सामने से/उनकी उपस्थिति से’ है, पर ירא के साथ यह भय के कारण या लक्ष्य को बताने वाला मुहावरा है। हिन्दी में ‘उनसे मत डर’ इसका स्वाभाविक समतुल्य है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह डरने की मनाही का आधार प्रस्तुत करता है; ‘क्योंकि’ हिन्दी में इस कारण-संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: אִתְּךָ אֲנִי
  choice: मैं तुझे … तेरे साथ हूँ
  rationale: हिब्रू पदक्रम में ‘मैं’ पर बल है। हिन्दी वाक्य में प्रथम पुरुष और एकवचन निकट संबोधन को बनाए रखते हुए परमेश्वर की उपस्थितिजन्य आश्वस्ति स्पष्ट की गई है।
- source_word: לְהַצִּלְךָ
  choice: तुझे छुड़ाने के लिए
  rationale: נצל के हिफ़ील रूप का अर्थ किसी संकट या अधिकार से निकालना, बचाना या छुड़ाना है। ‘छुड़ाने’ में सक्रिय हस्तक्षेप का भाव रहता है और यह केवल आत्मिक उद्धार तक अर्थ को सीमित नहीं करता।
- source_word: נְאֻם
  choice: की घोषणा है
  rationale: यह गंभीर भविष्यद्वाणी-सूत्र है। ‘घोषणा’ साधारण ‘कहता है’ की अपेक्षा उसके औपचारिक और अधिकारपूर्ण स्वर को बेहतर बनाए रखती है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम टेट्राग्रामटन है; इसलिए किसी उपाधि से बदलने के बजाय हिन्दी में उसका लिप्यंतरण किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पाठ में व्यक्तिगत वाचा-नाम सीधे उपस्थित है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण उच्चारण-आधारित लिप्यंतरण है और उसे उपाधि में नहीं बदलता।
- issue: לְהַצִּלְךָ में छुटकारे का दायरा
  choice: तुझे छुड़ाने के लिए
  alternative: तुझे बचाने के लिए; तेरा उद्धार करने के लिए
  rationale: संदर्भ यिर्मयाह की भविष्यद्वाणी की सेवा में विरोधियों से परमेश्वर की रक्षात्मक हस्तक्षेप-प्रतिज्ञा का है। ‘छुड़ाने’ मूल के व्यापक बचाव-अर्थ को रखता है और अनावश्यक रूप से केवल आत्मिक उद्धार का अर्थ नहीं जोड़ता।
- issue: दूसरे पुरुष एकवचन का संबोधन
  choice: तू/तुझे/तेरे
  alternative: तुम/तुम्हें/तुम्हारे
  rationale: हिब्रू रूप स्पष्टतः पुल्लिंग एकवचन हैं और यिर्मयाह को व्यक्तिगत रूप से संबोधित करते हैं। परमेश्वर और बुलाए गए नबी के बीच सीधे संबोधन को ‘तुझे/तेरे’ से सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण भविष्यद्वाणी-शैली रखी गई है। यिर्मयाह के लिए मूल के एकवचन संबोधन को ‘तुझे/तेरे’ से सुरक्षित रखा गया है। ‘याहवे की घोषणा है’ नेְאֻם־יְהוָה के औपचारिक सूत्र को बनाए रखता है।
