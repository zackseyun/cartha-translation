source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֵלַ֔/י אַל תֹּאמַ֖ר נַ֣עַר אָנֹ֑כִי כִּ֠י עַֽל כָּל אֲשֶׁ֤ר אֶֽשְׁלָחֲ/ךָ֙ תֵּלֵ֔ךְ וְ/אֵ֛ת כָּל אֲשֶׁ֥ר אֲצַוְּ/ךָ֖ תְּדַבֵּֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/007.yaml
  text: But Yahweh said to me[a], “Do not say, ‘I am a youth,’ for to all to whom I send you, you shall go, and all that I command you[b], you shall speak.”
translation:
  language: hi
  text: परन्तु याहवे ने मुझसे कहा, “यह मत कह, ‘मैं युवक[a] हूँ।’ क्योंकि मैं तुझे जिन सबके पास भेजूँगा, तू उनके पास जाएगा;[b] और जो कुछ मैं तुझे आज्ञा दूँगा, वह सब तू कहेगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मैं लड़का हूँ,” अथवा “मैं अभी छोटा हूँ।” इब्रानी נַעַר आयु की युवावस्था के साथ-साथ अनुभव की कमी भी सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “जहाँ कहीं मैं तुझे भेजूँगा, वहाँ तू जाएगा।” इब्रानी अभिव्यक्ति उन सभी गंतव्यों या दायित्वों के अधिक सामान्य अर्थ में भी समझी जा सकती है जिनके लिए याहवे यिर्मयाह को भेजते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के विशिष्ट वाचा-नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: וַיֹּאמֶר
  choice: ने कहा
  rationale: कथात्मक संदर्भ में אָמַר का सहज और सटीक हिन्दी रूप है। आरम्भ का ‘परन्तु’ पिछले पद में यिर्मयाह की आपत्ति के प्रति उत्तर का विरोधात्मक संबंध प्रकट करता है।
- source_word: אַל תֹּאמַר
  choice: यह मत कह
  rationale: אַל और अपूर्ण क्रिया का निषेधात्मक बल आधुनिक हिन्दी में स्वाभाविक रूप से व्यक्त होता है।
- source_word: נַעַר
  choice: युवक
  rationale: यह शब्द लड़के से लेकर युवा पुरुष तक की आयु अथवा अनुभवहीनता सूचित कर सकता है; ‘युवक’ मुख्य पाठ में अर्थ को अनावश्यक रूप से संकीर्ण नहीं करता।
- source_word: עַל כָּל אֲשֶׁר אֶשְׁלָחֲךָ
  choice: जिन-जिनके पास मैं तुझे भेजूँगा, उन सबके पास
  rationale: व्यक्ति-केंद्रित संभावित अर्थ और כָּל की व्यापकता को बनाए रखता है; स्थान या हर प्रकार के दायित्व को सूचित करने वाला अधिक सामान्य अर्थ पादटिप्पणी में दिया गया है।
- source_word: תֵּלֵךְ
  choice: तू जाएगा
  rationale: यहाँ अपूर्ण क्रिया दिव्य नियुक्ति से उत्पन्न सुनिश्चित और आदेशात्मक भाव रखती है; भविष्यकालीन हिन्दी इसे स्वाभाविक रूप से व्यक्त करती है।
- source_word: וְאֵת כָּל אֲשֶׁר אֲצַוְּךָ
  choice: और जो कुछ मैं तुझे आज्ञा दूँगा, वह सब
  rationale: כָּל की समग्रता और צוה के अधिकारपूर्ण ‘आज्ञा देना’ भाव दोनों सुरक्षित रहते हैं।
- source_word: תְּדַבֵּר
  choice: तू कहेगा
  rationale: इस प्रत्यक्ष संदेश-सौंपने के प्रसंग में हिन्दी का ‘कहेगा’ स्वाभाविक है और यिर्मयाह को मिले निश्चित आदेश को व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में विशिष्ट चतुरक्षरीय नाम है। ‘याहवे’ उसे किसी सामान्य उपाधि से प्रतिस्थापित किए बिना पहचान योग्य रूप में प्रस्तुत करता है।
- issue: भेजे जाने की सीमा का अर्थ
  choice: जिन-जिनके पास मैं तुझे भेजूँगा, उन सबके पास
  alternative: जहाँ कहीं मैं तुझे भेजूँगा
  rationale: मुख्य पाठ व्यक्ति-संबंधी अर्थ को रखता है, किन्तु इब्रानी अभिव्यक्ति गंतव्य या नियुक्त कार्य का अधिक सामान्य बोध भी दे सकती है; इसलिए वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। दिव्य संबोधन में एकवचन ‘तू/तुझे’ मूल इब्रानी के एकवचन रूप और हिन्दी बाइबलीय गरिमा के अनुरूप है। समानांतर रचना ‘तू जाएगा … तू कहेगा’ को सुरक्षित रखा गया है; स्रोत में न होने के कारण ‘केवल’ या ‘ही’ नहीं जोड़ा गया।
