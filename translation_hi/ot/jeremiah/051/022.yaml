  text: וְ/נִפַּצְתִּ֤י בְ/ךָ֙ אִ֣ישׁ וְ/אִשָּׁ֔ה וְ/נִפַּצְתִּ֥י בְ/ךָ֖ זָקֵ֣ן וָ/נָ֑עַר וְ/נִפַּצְתִּ֣י בְ/ךָ֔ בָּח֖וּר וּ/בְתוּלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/022.yaml
  text: And with you I will shatter man and woman; and with you I will shatter old man and youth; and with you I will shatter young man and virgin.
translation:
  language: hi
  text: और तुझसे मैं पुरुष और स्त्री को चकनाचूर करूँगा; और तुझसे मैं बूढ़े और जवान को चकनाचूर करूँगा; और तुझसे मैं युवक और कुँवारी को चकनाचूर करूँगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנִפַּצְתִּי בְךָ
  choice: तुझसे मैं ... चकनाचूर करूँगा
  rationale: נפץ का अर्थ बलपूर्वक तोड़ना या चकनाचूर करना है; בְךָ यहाँ बाबेल को विनाश के साधन के रूप में दर्शाता है, इसलिए करणवाचक ‘तुझसे’ रखा गया।
- source_word: אִישׁ וְאִשָּׁה
  choice: पुरुष और स्त्री
  rationale: यह सामान्य वयस्क नर-नारी की सीधी और स्वाभाविक जोड़ी है।
- source_word: זָקֵן וָנָעַר
  choice: बूढ़े और जवान
  rationale: זָקֵן वृद्ध व्यक्ति और נַעַר अपेक्षाकृत युवा पुरुष/लड़के को सूचित करता है; समानांतर काव्य में स्वाभाविक आयु-विरोध बनाए रखने के लिए ‘बूढ़े और जवान’ चुना गया।
- source_word: בָּחוּר וּבְתוּלָה
  choice: युवक और युवती
  rationale: בָּחוּר विवाह-योग्य युवा पुरुष है और בְּתוּלָה युवा अविवाहित स्त्री/कुँवारी को सूचित कर सकती है। यहाँ समानांतर सामाजिक जोड़ी के रूप में सहज हिन्दी ‘युवक और युवती’ रखी गई।
theological_decisions:
- issue: बाबेल को दैवी न्याय के साधन के रूप में संबोधन
  choice: करणवाचक ‘तुझसे’
  alternative: ‘तुझमें’ या ‘तेरे द्वारा’
  rationale: पूर्ववर्ती संदर्भ के युद्ध-हथियार रूपक और בְךָ की पुनरावृत्ति के अनुसार बाबेल साधन है; ‘तुझसे’ इस अर्थ को संक्षेप और काव्यात्मक ढंग से सुरक्षित रखता है।
- issue: בְּתוּלָה में कौमार्य का स्पष्ट उल्लेख
  choice: युवती
  alternative: कुँवारी
  rationale: शब्द में अविवाहित युवती/कुँवारी का भाव हो सकता है, पर इस पद की जोड़ी और आयु-समूहों की श्रृंखला में प्राकृतिक हिन्दी ‘युवती’ है; अनावश्यक रूप से जैविक कौमार्य पर बल नहीं दिया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिन्दी। मूल की तीन समानांतर पंक्तियों, ‘तुझसे’ की पुनरावृत्ति और कठोर विनाशकारी क्रिया को बनाए रखा गया है।
