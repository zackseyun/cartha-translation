id: JER.51.28
reference: Jeremiah 51:28
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: קַדְּשׁ֨וּ עָלֶ֤י/הָ גוֹיִם֙ אֶת מַלְכֵ֣י מָדַ֔י אֶת פַּחוֹתֶ֖י/הָ וְ/אֶת כָּל סְגָנֶ֑י/הָ וְ/אֵ֖ת כָּל אֶ֥רֶץ מֶמְשַׁלְתּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/028.yaml
  text: Consecrate the nations against her—the kings of Media[a], her governors and all her prefects[c][b], and every land of his dominion.
translation:
  language: hi
  text: राष्ट्रों को उसके विरुद्ध युद्ध के लिए पवित्र ठहराओ[a]—मादै के राजाओं[b] को, उसके राज्यपालों और उसके सभी उच्च अधिकारियों को, और उसके[c] शासन के अधीन हर देश को।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “पवित्र ठहराओ” का अर्थ युद्ध के लिए अलग करना या पवित्र युद्ध के लिए तैयार करना है।
    reason: cultural_note
  - marker: b
    text: या “मादियों के राजाओं।”
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में “उसके राज्यपालों ... उसके उच्च अधिकारियों” के प्रत्यय स्त्रीलिंग हैं, पर “उसके शासन” का प्रत्यय पुल्लिंग एकवचन है। अंतिम प्रत्यय मादै के राजा को प्रतिनिधि शासक के रूप में सूचित कर सकता है; मूल पाठ इस संबंध को स्पष्ट नहीं करता।
    reason: alternative_reading
lexical_decisions:
- source_word: קַדְּשׁוּ
  choice: युद्ध के लिए पवित्र ठहराओ
  rationale: युद्ध-संदर्भ में क्रिया קדשׁ का अर्थ किसी को पवित्र युद्ध के लिए अलग करना या तैयार करना है। स्पष्टता के लिए ‘युद्ध के लिए’ जोड़ा गया है, जबकि ‘पवित्र ठहराओ’ धार्मिक-सैनिक भाव बनाए रखता है।
- source_word: עָלֶיהָ
  choice: उसके विरुद्ध
  rationale: इस सैनिक संदर्भ में על शत्रुतापूर्ण दिशा बताता है और स्त्रीलिंग प्रत्यय बाबेल की ओर संकेत करता है।
- source_word: גּוֹיִם
  choice: राष्ट्रों
  rationale: यह युद्ध के लिए बुलाए गए विदेशी राजनीतिक समुदायों का स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: מַלְכֵי מָדַי
  choice: मादै के राजाओं
  rationale: מָדַי का पारंपरिक और पहचाना जाने वाला हिन्दी बाइबलीय भौगोलिक नाम ‘मादै’ है; पदबंध को बहुवचन ‘राजाओं’ सहित यथावत रखा गया है।
- source_word: פַּחוֹתֶיהָ
  choice: उसके राज्यपालों
  rationale: פֶּחָה प्रांतीय शासक या गवर्नर को दर्शाता है। ‘राज्यपाल’ सुबोध है और स्त्रीलिंग एकवचन प्रत्यय का प्रतिनिधित्व ‘उसके’ से करता है।
- source_word: סְגָנֶיהָ
  choice: उसके सभी अधिपतियों
  rationale: סְגָן अधीनस्थ उच्च अधिकारी को दर्शाता है। ‘अधिपति’ इसे ‘राज्यपाल’ से अलग रखते हुए प्रशासनिक पद का व्यापक अर्थ देता है।
- source_word: כָּל אֶרֶץ מֶמְשַׁלְתּוֹ
  choice: उसके शासन के अधीन हर देश
  rationale: यह सहज हिन्दी में शासनाधीन समस्त भूभाग का वितरक भाव व्यक्त करता है। मूल का अंतिम प्रत्यय पुल्लिंग एकवचन है, पर हिन्दी ‘उसके’ में लिंग प्रत्यक्ष नहीं होता; इस बात को पादटिप्पणी में बताया गया है।
theological_decisions:
- issue: प्रत्ययों के संकेतक का परिवर्तन
  choice: मुख्य पाठ में तीनों स्थानों पर स्वाभाविक हिन्दी ‘उसके’ रखा गया और अंतिम मूल इब्रानी प्रत्यय के पुल्लिंग एकवचन होने की सूचना पादटिप्पणी में दी गई।
  alternative: प्रशासनिक पदों को ‘मादै के’ और अंतिम वाक्यांश को ‘उस राजा के शासन’ कहकर संभावित संकेतकों को स्पष्ट कर देना।
  rationale: इब्रानी में राज्यपालों और अधिपतियों के साथ स्त्रीलिंग प्रत्यय हैं, फिर ‘शासन’ के साथ पुल्लिंग एकवचन प्रत्यय आता है। हिन्दी संबंधवाचक ‘उसके’ इस लिंगांतर को स्वयं प्रकट नहीं करता। किसी अनिश्चित संकेतक को मुख्य पाठ में तय करने के बजाय पादटिप्पणी मूल की वास्तविक तनावपूर्ण रचना सुरक्षित रखती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘पवित्र ठहराओ’ के साथ ‘युद्ध के लिए’ अर्थ स्पष्ट करता है; प्रशासनिक पदों के लिए अलग शब्द रखे गए हैं। मुख्य पाठ की हर पादटिप्पणी का चिह्न [a], [b], [c] संबंधित स्थान पर उपस्थित है।
