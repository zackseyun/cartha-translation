  terminology: ‘मादै,’ ‘राज्यपाल,’ and ‘पवित्र ठहराओ’ are appropriate. ‘उच्च अधिकारियों’ better conveys subordinate senior officials/prefects than ‘अधिपतियों,’ while retaining a distinction from ‘राज्यपालों।’
