  yaml_path: translation/ot/jeremiah/051/023.yaml
  text: And with you I shattered the shepherd and his flock[a]; and with you I shattered the farmer and his team[c][b]; and with you I shattered governors and deputies.
translation:
  language: hi
  text: और तेरे द्वारा मैंने चरवाहे और उसके झुंड को चकनाचूर किया[a]; और तेरे द्वारा मैंने किसान और उसकी जोड़ी को चकनाचूर किया[b]; और तेरे द्वारा मैंने राज्यपालों और अधीनस्थ अधिकारियों को चकनाचूर किया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “टुकड़े-टुकड़े कर दिया”; यही क्रिया इस पद में तीन बार आई है।
    reason: lexical_alternative
  - marker: b
    text: या “उसका जुआ” अथवा “उसकी जोड़ी”; आशय खेती में साथ जोते जाने वाले पशुओं की जोड़ी से हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या “उप-अधिकारी” अथवा “शासकीय अधिकारी”।
    reason: lexical_alternative
lexical_decisions:
- source_word: נִפַּצְתִּי
  choice: मैंने ... चकनाचूर किया
  rationale: यह क्रिया हिंसक रूप से तोड़ने या टुकड़े-टुकड़े करने का भाव रखती है। ‘चकनाचूर किया’ आधुनिक हिन्दी में उसका प्रबल अर्थ व्यक्त करता है; इब्रानी की लय बनाए रखने के लिए इसे तीनों खंडों में दोहराया गया है।
- source_word: בְךָ
  choice: तेरे द्वारा
  rationale: 'यहाँ בְּ साधन का बोध कराता है: संबोधित सत्ता को विनाश के साधन के रूप में प्रस्तुत किया गया है। ‘तेरे द्वारा’ इस अर्थ को स्पष्ट और स्वाभाविक हिन्दी में रखता है।'
- source_word: רֹעֶה וְעֶדְרוֹ
  choice: चरवाहे और उसके झुंड
  rationale: ये शब्द एक सामान्य चरवाहे और उसके पशु-समूह की जोड़ी बनाते हैं। ‘चरवाहा’ बाद की कलीसियाई पदवी का अनावश्यक संकेत नहीं देता।
- source_word: אִכָּר
  choice: किसान
  rationale: यह भूमि जोतने या खेती करने वाले व्यक्ति को दर्शाता है। ‘किसान’ सामान्य आधुनिक हिन्दी में व्यापक और सहज शब्द है।
- source_word: צִמְדּוֹ
  choice: हल में जुती उसकी जोड़ी
  rationale: צֶמֶד कृषि में साथ जोते गए पशुओं की जोड़ी अथवा उनके जुए का बोध करा सकता है। मुख्य पाठ में जोड़ी का भाव रखा गया है और कृषि-संदर्भ को स्वाभाविक बनाने के लिए ‘हल में जुती’ कहा गया है।
- source_word: פַּחוֹת
  choice: राज्यपालों
  rationale: यह प्रांतीय शासकों या राज्यपालों के लिए प्रयुक्त प्रशासनिक पद है। ‘राज्यपाल’ संक्षिप्त और स्पष्ट समतुल्य है।
- source_word: סְגָנִים
  choice: उप-अधिकारियों
  rationale: यह अधीनस्थ शासकीय अधिकारियों को दर्शाता है। ‘उप-अधिकारी’ राज्यपालों की तुलना में उनके गौण पद को व्यक्त करता है, पर किसी अत्यधिक विशिष्ट प्राचीन पदनाम को आरोपित नहीं करता।
