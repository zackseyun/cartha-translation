id: JER.51.15
reference: Jeremiah 51:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: עֹשֵׂ֥ה אֶ֨רֶץ֙ בְּ/כֹח֔/וֹ מֵכִ֥ין תֵּבֵ֖ל בְּ/חָכְמָת֑/וֹ וּ/בִ/תְבוּנָת֖/וֹ נָטָ֥ה שָׁמָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/015.yaml
  text: He made the earth by his power[a], he established the world by his wisdom, and by his understanding he stretched out the heavens.
translation:
  language: hi
  text: उसने अपनी सामर्थ्य से पृथ्वी बनाई, अपनी बुद्धि से संसार[a] को स्थिर किया, और अपनी समझ से आकाश को तान दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बसे हुए संसार।”
    reason: תֵּבֵל में केवल ‘संसार’ ही नहीं, बल्कि व्यवस्थित या बसा हुआ संसार होने का भाव भी हो सकता है।
lexical_decisions:
- source_word: עֹשֵׂה
  choice: बनाई
  rationale: यह कृदन्त रूप है, जिसका अर्थ ‘बनाने वाला’ या ‘बनाता है’ भी हो सकता है; पर आगे के सृष्टि-वर्णन और काव्यात्मक समानांतरता के कारण हिन्दी में भूतकाल का क्रियापद स्वाभाविक और स्पष्ट है।
- source_word: אֶרֶץ
  choice: पृथ्वी
  rationale: आकाश के साथ ब्रह्माण्डीय समानांतरता के कारण यहाँ ‘देश’ या ‘भूमि’ के बजाय ‘पृथ्वी’ उपयुक्त है।
- source_word: בְּכֹחוֹ
  choice: अपनी सामर्थ्य से
  rationale: בְּ का साधनवाचक अर्थ ‘से’ द्वारा व्यक्त होता है; כֹּחַ के लिए ‘सामर्थ्य’ गरिमापूर्ण और सहज हिन्दी है।
- source_word: מֵכִין
  choice: स्थिर किया
  rationale: हिफ़ील रूप में כון स्थापित करने या दृढ़ करने का भाव देता है; ‘स्थिर किया’ इस अर्थ को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: תֵּבֵל
  choice: संसार
  rationale: תֵּבֵל प्रायः व्यवस्थित अथवा बसा हुआ संसार दर्शाता है। ‘संसार’ सामान्य हिन्दी में स्वाभाविक है, जबकि अधिक स्पष्ट विकल्प पादटिप्पणी में दिया गया है।
- source_word: בְּחָכְמָתוֹ
  choice: अपनी बुद्धि से
  rationale: חָכְמָה का सामान्य अर्थ ‘बुद्धि’ है और साधनवाचक בְּ को ‘से’ द्वारा व्यक्त किया गया है।
- source_word: וּבִתְבוּנָתוֹ
  choice: और अपनी समझ से
  rationale: תְּבוּנָה के लिए ‘समझ’ चुनने से पिछले पद की ‘बुद्धि’ से शब्दार्थ का सूक्ष्म भेद बना रहता है।
- source_word: נָטָה
  choice: तान दिया
  rationale: सृष्टि-सन्दर्भ में נטה आकाश को फैलाने या तानने का बिम्ब देता है; ‘तान दिया’ उस चित्रात्मकता को बनाए रखता है।
- source_word: שָׁמָיִם
  choice: आकाश
  rationale: हिब्रू का रूप बहुवचन है, पर आधुनिक हिन्दी में ब्रह्माण्डीय विस्तार के लिए एकवचन सामूहिक संज्ञा ‘आकाश’ अधिक स्वाभाविक है।
theological_decisions:
- issue: हिब्रू कृदन्तों और पूर्ण क्रिया के काल-पक्ष को हिन्दी में व्यक्त करना
  choice: 'तीनों सृष्टि-कार्यों को भूतकाल की पूर्ण क्रियाओं के रूप में प्रस्तुत किया गया है: ‘बनाई… स्थिर किया… तान दिया।’'
  alternative: 'आरम्भिक कृदन्तों को वर्तमान या कर्तृवाचक रूप में रखा जा सकता है: ‘बनाता है… स्थिर करता है…’, अथवा ‘पृथ्वी का बनाने वाला।’'
  rationale: हिब्रू के पहले दो रूप कृदन्त हैं और अन्तिम क्रिया पूर्ण रूप में है। पद सृष्टि के कार्यों की काव्यात्मक घोषणा करता है; समान भूतकालीन क्रियाएँ आधुनिक हिन्दी में प्रवाह और समानांतरता देती हैं, बिना कोई अतिरिक्त धर्मवैज्ञानिक निष्कर्ष जोड़े।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘सामर्थ्य’, ‘बुद्धि’ और ‘समझ’ स्रोत के तीन अलग भावों को बनाए रखते हैं; वाक्य की त्रिपदीय काव्यात्मक समानांतरता भी सुरक्षित है।
