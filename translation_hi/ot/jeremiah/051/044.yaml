source:
  edition: WLC
  text: וּ/פָקַדְתִּ֨י עַל בֵּ֜ל בְּ/בָבֶ֗ל וְ/הֹצֵאתִ֤י אֶת בִּלְע/וֹ֙ מִ/פִּ֔י/ו וְ/לֹֽא יִנְהֲר֥וּ אֵלָ֛י/ו ע֖וֹד גּוֹיִ֑ם גַּם חוֹמַ֥ת בָּבֶ֖ל נָפָֽלָה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/044.yaml
  text: And I will punish Bel in Babylon[a], and I will bring out of his mouth what he has swallowed; nations will no longer stream to him[b]. Even the wall of Babylon has fallen.
translation:
  language: hi
  text: मैं बाबेल में बेल को दण्ड दूँगा और उसने जो निगल लिया है, उसे उसके मुँह से बाहर निकालूँगा। फिर जातियाँ उसकी ओर धारा के समान नहीं उमड़ेंगी[a]। यहाँ तक कि बाबेल की शहरपनाह भी गिर चुकी है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “जातियाँ फिर उसकी ओर धारा की तरह नहीं बहेंगी।” इब्रानी क्रिया लोगों के जलधारा के समान आगे बढ़ने का चित्र प्रस्तुत करती है।
    reason: lexical_alternative
  - marker: b
    text: या, “बाबेल की शहरपनाह भी गिर जाएगी।” यहाँ इब्रानी पूर्ण रूप किसी भावी घटना को उसकी निश्चितता के कारण पहले से घटित बताता हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וּפָקַדְתִּי עַל
  choice: मैं ... को दण्ड दूँगा
  rationale: פָקַד עַל न्याय के प्रसंग में दण्ड देने या लेखा लेने का भाव रखता है; आधुनिक हिन्दी में ‘दण्ड दूँगा’ इसका न्यायिक बल स्पष्ट करता है।
- source_word: בֵּל
  choice: बेल
  rationale: यह बाबेली देवता का नाम अथवा उपाधि है, इसलिए इसका अनुवाद करने के बजाय देवनागरी में लिप्यंतरण किया गया है।
- source_word: בְּבָבֶל
  choice: बाबेल में
  rationale: स्थानीय בְ यहाँ बेल की उपासना और न्याय के स्थान को सूचित करता है।
- source_word: וְהֹצֵאתִי אֶת בִּלְעוֹ מִפִּיו
  choice: उसने जो निगल लिया है, उसे उसके मुँह से बाहर निकालूँगा
  rationale: कारक क्रिया और निगलने-मुँह की ठोस उपमा दोनों सुरक्षित रखी गई हैं; בִּלְעוֹ निगली हुई वस्तु को दर्शाता है।
- source_word: וְלֹא יִנְהֲרוּ אֵלָיו עוֹד גּוֹיִם
  choice: फिर जातियाँ उसकी ओर धारा के समान नहीं उमड़ेंगी
  rationale: נהר लोगों के जलधारा की तरह किसी की ओर आने का सजीव चित्र प्रस्तुत करता है। ‘धारा के समान ... उमड़ेंगी’ हिन्दी में चित्र को स्वाभाविक ढंग से बनाए रखता है।
- source_word: גַּם
  choice: यहाँ तक कि ... भी
  rationale: यह अगले न्याय-वचन को चरम और बलाघाती जोड़ के रूप में प्रस्तुत करता है।
- source_word: חוֹמַת בָּבֶל
  choice: बाबेल की शहरपनाह
  rationale: एकवचन חוֹמָה को बनाए रखते हुए ‘शहरपनाह’ नगर की रक्षात्मक दीवार का सटीक और गरिमापूर्ण हिन्दी शब्द है।
- source_word: נָפָלָה
  choice: गिर चुकी है
  rationale: 'हिब्रू पूर्ण पक्ष को भविष्यसूचक पूर्ण के रूप में रखा गया है: भावी घटना को उसकी निश्चितता के कारण पूरी हो चुकी घटना की तरह कहा गया है।'
theological_decisions:
- issue: निगलने और उसकी ओर उमड़ने वाले वाक्यांशों में सर्वनाम का संदर्भ
  choice: ‘उसने/उसके/उसकी’ को निकटतम पूर्वपद बेल से जोड़ा गया है।
  alternative: इन्हें व्यापक रूप से मानवीकृत बाबेल के संदर्भ में समझा जा सकता है।
  rationale: निकटतम व्याकरणिक पूर्वपद बेल है और मुँह से निगली हुई वस्तु निकालने का चित्र उसी पर किए जा रहे न्याय को आगे बढ़ाता है; साथ ही बाबेल के धार्मिक और साम्राज्यिक पतन का आशय भी निहित रहता है।
- issue: נָפָלָה का काल-पक्ष
  choice: ‘गिर चुकी है’—भविष्यसूचक पूर्ण
  alternative: ‘गिर जाएगी’
  rationale: मूल पाठ का पूर्ण रूप भावी न्याय को निश्चित और मानो घटित बताता है। हिन्दी में पूर्ण रूप रखने से यह भविष्यसूचक तनाव सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप अपनाया गया है। ‘शहरपनाह’ नगर की किलेबन्द दीवार को संक्षेप में व्यक्त करता है। काव्यात्मक जलधारा और निगलने की मूल उपमाएँ सुरक्षित रखी गई हैं; भविष्यसूचक पूर्ण को मुख्य पाठ में बनाए रखकर वैकल्पिक भविष्यकाल पादटिप्पणी में दिया गया है।
