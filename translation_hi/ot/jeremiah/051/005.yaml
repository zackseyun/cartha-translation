source:
  edition: WLC
  text: כִּ֠י לֹֽא אַלְמָ֨ן יִשְׂרָאֵ֤ל וִֽ/יהוּדָה֙ מֵֽ/אֱלֹהָ֔י/ו מֵֽ/יְהוָ֖ה צְבָא֑וֹת כִּ֤י אַרְצָ/ם֙ מָלְאָ֣ה אָשָׁ֔ם מִ/קְּד֖וֹשׁ יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/005.yaml
  text: For Israel and Judah are not widowed from their God[a], from Yahweh of Armies[b], though their land is full of guilt against the Holy One of Israel.
translation:
  language: hi
  text: क्योंकि इस्राएल और यहूदा अपने परमेश्वर, सेनाओं के यहोवा[b], से विधवा की-सी दशा में नहीं हैं, यद्यपि उनकी भूमि इस्राएल के पवित्र परमेश्वर के विरुद्ध दोष से भरी हुई है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस्राएल के पवित्र परमेश्वर के सामने।” यहाँ प्रयुक्त इब्रानी संबंधबोधक अव्यय को एक से अधिक प्रकार से समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'पारंपरिक अनुवाद: “सेनाओं का यहोवा।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלְמָן
  choice: विधवा की तरह वंचित
  rationale: मूल शब्द विधवा हो जाने का रूपक रखता है। केवल ‘त्यागे गए’ कहना वैवाहिक बिंब को मिटा देता, जबकि शाब्दिक ‘विधवा नहीं हैं’ आधुनिक हिन्दी में इस संयुक्त कर्ता के साथ अस्वाभाविक लगता; इसलिए रूपक और अर्थ दोनों स्पष्ट रखे गए हैं।
- source_word: מֵאֱלֹהָיו מֵיְהוָה צְבָאוֹת
  choice: अपने परमेश्वर, सेनाओं के यहोवा से
  rationale: दोहराया गया מִן अलगाव का भाव देता है—वे अपने परमेश्वर से वंचित नहीं हैं। एकवचन प्रत्यय सामूहिक इस्राएल-यहूदा को सूचित करता है, जिसके लिए हिन्दी में ‘अपने’ स्वाभाविक है। צְבָאוֹת को पारदर्शी रूप से ‘सेनाओं’ कहा गया है।
- source_word: כִּי (प्रारम्भिक)
  choice: क्योंकि
  rationale: यह संयोजक पिछले प्रसंग के कथन का आधार प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ उसका व्याख्यात्मक/कारणसूचक बल स्वाभाविक रूप से व्यक्त करता है।
- source_word: כִּי (दूसरा)
  choice: यद्यपि
  rationale: संदर्भ में यह परमेश्वर की निरंतर निष्ठा और देश के वास्तविक दोष के बीच विरोधसूचक संबंध व्यक्त करता है।
- source_word: אַרְצָם
  choice: उनकी भूमि
  rationale: אֶרֶץ के क्षेत्रीय और बाइबलीय अर्थ को ‘भूमि’ सहज तथा पर्याप्त रूप से व्यक्त करता है।
- source_word: מָלְאָה אָשָׁם
  choice: दोष से भरी हुई है
  rationale: यहाँ אָשָׁם नैतिक दोष अथवा अपराध-दायित्व को दर्शाता है, न कि दोषबलि; ‘दोष’ हिन्दी में इस अमूर्त अर्थ को संक्षेप में रखता है।
- source_word: מִקְּדֹשׁ יִשְׂרָאֵל
  choice: इस्राएल के पवित्र जन के विरुद्ध
  rationale: इस संदर्भ में מִן को अपराध के संबंध या लक्ष्य के रूप में समझकर ‘के विरुद्ध’ कहा गया है। ‘के सामने’ भी व्याकरणतः संभव है और उसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: इस्राएल का पवित्र जन
  rationale: यह परमेश्वर की एक स्थिर भविष्यद्वाणी-संबंधी उपाधि है; यह अनुवाद उसकी व्यक्तिवाचक उपाधि और पवित्रता दोनों को स्पष्ट रखता है।
theological_decisions:
- issue: दूसरे כִּי का विरोधसूचक अथवा कारणसूचक अर्थ
  choice: विरोधसूचक—‘यद्यपि उनकी भूमि…दोष से भरी हुई है’
  alternative: कारणसूचक—‘क्योंकि उनकी भूमि…दोष से भरी हुई है’
  rationale: कारणसूचक पाठ लोगों के दोष को उनके परमेश्वर से वंचित न होने का कारण बताता हुआ प्रतीत हो सकता है, जो संदर्भ में कठिन है। ‘यद्यपि’ परमेश्वर की अटल संबंधपरक निष्ठा और लोगों के अपराध—दोनों के बीच मूल तनाव को बनाए रखता है।
- issue: מִקְּדֹשׁ יִשְׂרָאֵל में מִן का संबंध
  choice: दोष ‘इस्राएल के पवित्र जन के विरुद्ध’ है
  alternative: दोष ‘इस्राएल के पवित्र जन के सामने’ है
  rationale: ‘के विरुद्ध’ अपराध की दिशा को स्पष्ट करता है, पर मूल संबंधबोधक अव्यय व्यापक हो सकता है; इसलिए वैकल्पिक अर्थ पादटिप्पणी में दिया गया है, ताकि वास्तविक अस्पष्टता बनी रहे।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी अपनाई गई है। ‘विधवा की तरह वंचित’ मूल वैवाहिक रूपक को बचाते हुए हिन्दी की व्याकरणिक असहजता से बचता है। परमेश्वर के नाम के लिए प्रचलित हिन्दी रूप ‘यहोवा’ रखा गया है; वाक्य में कोई संप्रदाय-विशेष शब्दावली नहीं जोड़ी गई।
