  text: לֹֽא כְ/אֵ֜לֶּה חֵ֣לֶק יַעֲק֗וֹב כִּֽי יוֹצֵ֤ר הַ/כֹּל֙ ה֔וּא וְ/שֵׁ֖בֶט נַחֲלָת֑/וֹ יְהוָ֥ה צְבָא֖וֹת שְׁמֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/019.yaml
  text: Not like these is the Portion of Jacob[a], for he is the one who formed everything, and Israel is the tribe of his inheritance[c][b]; Yahweh of Armies is his name.
translation:
  language: hi
  text: याकूब का भाग इन जैसा नहीं है[a], क्योंकि वही सबका रचयिता है, और याकूब उसकी विरासत का गोत्र है[b]; उसका नाम सेनाओं का याहवे है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पदबंध का अनुवाद ‘याकूब का भाग’ भी हो सकता है। सन्दर्भ में सम्भवतः अर्थ है कि याहवे याकूब को मिला हुआ भाग है; कम सम्भावना यह है कि यह याकूब के अधिकार वाले किसी भाग को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से केवल ‘और उसकी विरासत का गोत्र’ है। यहाँ ‘याकूब’ को पहले पदबंध से निहित कर्ता के रूप में दोहराया गया है। समानांतर यिर्मयाह 10:16 में ‘इस्राएल’ स्पष्ट रूप से आता है, पर इस वचन के मुख्य पाठ में वह नाम नहीं जोड़ा गया है।
    reason: alternative_reading
  - marker: c
    text: 'परम्परागत अनुवाद: ‘सेनाओं का यहोवा’ या ‘सेनाओं का प्रभु।’'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כְאֵלֶּה
  choice: इन जैसा नहीं है
  rationale: बहुवचन संकेतवाचक ‘इन’ आसपास वर्णित मूर्तियों की ओर सीधे संकेत करता है और इब्रानी तुलना को स्वाभाविक हिन्दी में रखता है।
- source_word: חֵלֶק יַעֲקֹב
  choice: याकूब का भाग
  rationale: सम्बन्धसूचक इब्रानी पदबंध की सहज हिन्दी है। सन्दर्भ में इसका प्रमुख अर्थ याहवे को याकूब के लिए ठहराया गया भाग मानना है, पर हिन्दी पदबंध मूल की सम्भावित द्व्यर्थता को बनाए रखता है।
- source_word: יוֹצֵר הַכֹּל
  choice: सबका रचयिता
  rationale: יוֹצֵר का अर्थ गढ़ने या रचने वाला है। ‘सबका रचयिता’ संक्षिप्त, वर्तमान और मूर्तियाँ बनाने वालों के साथ निहित विरोध को स्पष्ट रखने वाला है।
- source_word: וְשֵׁבֶט נַחֲלָתוֹ
  choice: और इस्राएल उसकी विरासत का गोत्र है
  rationale: שֵׁבֶט यहाँ राजदण्ड के बजाय परमेश्वर के अपने ठहराए हुए जन-समुदाय को सूचित करता है। वाक्य की हिन्दी स्पष्टता के लिए समानांतर यिर्मयाह 10:16 में व्यक्त ‘इस्राएल’ को मुख्य पाठ में दिया गया है, और पादटिप्पणी में मसोरी पाठ की संक्षिप्त शब्दावली स्पष्ट की गई है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का याहवे
  rationale: व्यक्तिगत दिव्य नाम को ‘याहवे’ के रूप में रखा गया है और צְבָאוֹת को आधुनिक पाठक के लिए पारदर्शी ‘सेनाओं’ से अनूदित किया गया है।
- source_word: שְׁמוֹ
  choice: उसका नाम ... है
  rationale: इब्रानी के क्रियारहित नाम-वाक्य को स्वाभाविक हिन्दी में पूरा करता है।
theological_decisions:
- issue: חֵלֶק יַעֲקֹב में सम्बन्ध की दिशा
  choice: ‘याकूब का भाग’ रखकर प्रमुख अर्थ याहवे को याकूब का ठहराया हुआ भाग मानना
  alternative: इसे याकूब के अधिकार में आया कोई अनिर्दिष्ट भाग समझना
  rationale: मूर्तियों के साथ विरोध और अगले सृष्टिकर्ता-वाक्य से संकेत मिलता है कि याहवे ही याकूब का भाग है; फिर भी मूल पदबंध की व्याकरणिक सम्भावना को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: וְשֵׁבֶט נַחֲלָתוֹ में इस्राएल को स्पष्ट करना
  choice: हिन्दी की स्पष्टता के लिए ‘इस्राएल’ देना और पादटिप्पणी में बताना कि उपलब्ध इब्रानी में नाम व्यक्त नहीं है
  alternative: केवल ‘और उसकी विरासत का गोत्र’ रखना
  rationale: सन्दर्भ में याकूब/इस्राएल ही आशय है और यिर्मयाह 10:16 का समानांतर इसे स्पष्ट करता है। पादटिप्पणी पाठ-साक्ष्य को पारदर्शी रखती है और चुपचाप सामंजस्य नहीं करती।
- issue: दिव्य नाम יְהוָה का रूप
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: इब्रानी में व्यक्तिगत वाचा-नाम सीधे उपस्थित है; लिप्यन्तरण उसे सामान्य उपाधि में बदलने से बचाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। ‘रचयिता’, ‘विरासत’ और ‘गोत्र’ बाइबिलीय सन्दर्भ के अनुकूल हैं, पर अत्यधिक संस्कृतनिष्ठ नहीं। मूल की अस्पष्टताओं और पाठ में स्पष्ट किए गए ‘इस्राएल’ को पादटिप्पणियों द्वारा पारदर्शी रखा गया है।
