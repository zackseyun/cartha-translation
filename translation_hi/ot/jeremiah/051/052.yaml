  text: Therefore[a], behold, days are coming, declares Yahweh, when I will punish her carved images, and throughout all her land the wounded will groan.
translation:
  language: hi
  text: इसलिए, देखो, दिन आ रहे हैं—याहवे की यह घोषणा है—जब मैं उसकी तराशी हुई प्रतिमाओं[a] को दण्ड दूँगा, और उसके सारे देश में मारे गए लोग[b] कराहेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी मूर्तियों।” इब्रानी शब्द विशेष रूप से तराशकर बनाई गई उपासना-प्रतिमाओं को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या, “बेधे हुए” या “घायल लोग।” इब्रानी शब्द सामान्यतः युद्ध में मारे गए लोगों के लिए प्रयुक्त होता है।
    reason: lexical_ambiguity
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
