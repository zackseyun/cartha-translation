  rationale: भविष्यवाणी की ओर ध्यान खींचने वाले संकेतक का बल बनाए रखता है और आधुनिक हिन्दी में सहज है।
- source_word: יָמִים בָּאִים
  choice: वे दिन आ रहे हैं
  rationale: आने वाली ईश्वरीय कार्रवाई की घोषणा करने वाले प्रचलित भविष्यद्वाणी-सूत्र का स्वाभाविक हिन्दी रूप।
- source_word: נְאֻם יְהוָה
  choice: याहवे की यह घोषणा है
  rationale: נְאֻם की अधिकारपूर्ण भविष्यद्वाणी-संबंधी वाणी और परमेश्वर के व्यक्तिगत नाम, दोनों को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: וּפָקַדְתִּי עַל
  choice: मैं ... को दण्ड दूँगा
  rationale: न्याय के प्रसंग में פקד על का अर्थ लेखा लेने अथवा दण्ड देने का है; यहाँ 'दण्ड दूँगा' सीधा और स्वाभाविक है।
- source_word: פְּסִילֶיהָ
  choice: उसकी खुदी हुई प्रतिमाओं
  rationale: यह चयन केवल सामान्य मूर्तियों के बजाय तराशकर बनाई गई उपासना-प्रतिमाओं के ठोस अर्थ को सुरक्षित रखता है।
- source_word: וּבְכָל אַרְצָהּ
  choice: उसके सारे देश में
  rationale: बाबुल के पूरे भूभाग में फैले न्याय का व्यापक दायरा सहज हिन्दी में व्यक्त करता है।
- source_word: יֶאֱנֹק
  choice: कराहेंगे
  rationale: पीड़ा में निकली कराह के लिए यह स्पष्ट और स्वाभाविक हिन्दी क्रिया है।
- source_word: חָלָל
  choice: घायल लोग
  rationale: חָלָל घायल, बेधा हुआ, अथवा युद्ध में मारा गया व्यक्ति दर्शा सकता है। यहाँ 'कराहेंगे' के साथ जीवित घायलों का अर्थ प्रसंगानुकूल है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है; लिप्यंतरण उसका नामात्मक स्वरूप बनाए रखता है।
- issue: חָלָל का घायल या मारा हुआ अर्थ
  choice: घायल लोग
  alternative: मारे गए लोग
  rationale: शब्द दोनों अर्थ-क्षेत्रों में प्रयुक्त हो सकता है। कराहने की क्रिया जीवित घायलों के अर्थ का समर्थन करती है, पर दूसरे अर्थ को पादटिप्पणी में खुला रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। भविष्यद्वाणी की गंभीरता को 'देखो' और डैश के बीच रखे घोषणा-सूत्र से बनाए रखा गया है; अनावश्यक रूप से पुरातन शब्दावली से बचा गया है।
