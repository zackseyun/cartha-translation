  text: וְ/שִׁלַּמְתִּ֨י לְ/בָבֶ֜ל וּ/לְ/כֹ֣ל יוֹשְׁבֵ֣י כַשְׂדִּ֗ים אֵ֧ת כָּל רָעָתָ֛/ם אֲשֶׁר עָשׂ֥וּ בְ/צִיּ֖וֹן לְ/עֵֽינֵי/כֶ֑ם נְאֻ֖ם יְהוָֽה׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/024.yaml
  text: And I will repay Babylon and all the inhabitants of Chaldea for all their evil that they have done in Zion before your eyes[a], declares Yahweh.
translation:
  language: hi
  text: और मैं बाबेल और कसदिया के सभी निवासियों से उनकी उस सारी बुराई का बदला लूँगा, जो उन्होंने सिय्योन में तुम्हारी आँखों के सामने की है[a]—यह याहवे की घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं बाबेल और कसदिया के सभी निवासियों से उस सारी हानि का बदला लूँगा, जो उन्होंने सिय्योन में तुम्हारी आँखों के सामने की है।” इब्रानी शब्द नैतिक बुराई या स्वयं हानि पहुँचाने वाले दुष्कर्म—दोनों पर बल दे सकता है।
    reason: רָעָה की अर्थ-सीमा को सुरक्षित रखता है और वैकल्पिक पाठ में पद्य के शेष अर्थपूर्ण वाक्यांशों को बनाए रखता है।
lexical_decisions:
- source_word: וְשִׁלַּמְתִּי
  choice: और मैं ... बदला दूँगा
  rationale: पिअल रूप यहाँ किए गए कर्मों के प्रतिफल या दंडस्वरूप प्रत्युत्तर को व्यक्त करता है। ‘बदला दूँगा’ न्यायात्मक अर्थ को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: לְבָבֶל
  choice: बाबेल
  rationale: यह इब्रानी स्थान-नाम בָּבֶל का हिन्दी बाइबलीय लिप्यंतरण है।
- source_word: וּלְכֹל יוֹשְׁבֵי כַשְׂדִּים
  choice: और कसदिया के सभी निवासियों को
  rationale: יוֹשְׁבֵי का अर्थ ‘निवासी’ है और כַשְׂדִּים यहाँ कसदियों के भूभाग अथवा देश को सूचित करता है; ‘कसदिया’ इस प्रादेशिक अर्थ को स्पष्ट रखता है।
- source_word: אֵת כָּל רָעָתָם
  choice: उनकी उस सारी बुराई का
  rationale: רָעָה में नैतिक बुराई और पहुँचाई गई हानि—दोनों अर्थ संभव हैं। मुख्य पाठ में ‘बुराई’ नैतिक आयाम को सुरक्षित रखता है, जबकि पादटिप्पणी हानि के अर्थ को दर्ज करती है।
- source_word: אֲשֶׁר עָשׂוּ בְצִיּוֹן
  choice: जो उन्होंने ... सिय्योन में की है
  rationale: בְ का सामान्य अर्थ ‘में’ है। यह अनुवाद सिय्योन के विरुद्ध किए गए कार्य का अर्थ आरोपित करने के बजाय वहाँ किए गए कर्मों की मूल अभिव्यक्ति बनाए रखता है।
- source_word: לְעֵינֵיכֶם
  choice: तुम्हारी आँखों के सामने
  rationale: यह इब्रानी मुहावरा प्रत्यक्ष रूप से देखी गई घटना को व्यक्त करता है; हिन्दी में यह सजीव और स्वाभाविक समतुल्य है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: נְאֻם יְהוָה एक गंभीर भविष्यद्वाणी-सूत्र है। ‘घोषणा’ उसके औपचारिक और अधिकारपूर्ण स्वर को बनाए रखती है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम चतुरक्षर YHWH को किसी उपाधि से बदलने के बजाय हिन्दी में ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम स्पष्ट रूप से आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और नाम को उपाधि में नहीं बदलता।
- issue: רָעָה में नैतिक बुराई और पहुँचाई गई हानि का संबंध
  choice: मुख्य पाठ में ‘बुराई’, पादटिप्पणी में ‘हानि’
  alternative: मुख्य पाठ में केवल ‘हानि’
  rationale: शब्द दोनों अर्थ-छायाएँ रख सकता है। न्याय के प्रसंग में ‘बुराई’ नैतिक दोष को व्यक्त करती है, पर पादटिप्पणी इस संभावना को सुरक्षित रखती है कि बल उनके विनाशकारी कृत्यों से हुई हानि पर हो।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज और भविष्यद्वाणी-सुलभ रूप अपनाया गया है। ‘बाबेल’, ‘कसदिया’ और ‘सिय्योन’ बाइबलीय नामों के परिचित हिन्दी रूप हैं। वाक्य-क्रम को हिन्दी में स्वाभाविक बनाया गया है, पर ‘सिय्योन में’ और ‘तुम्हारी आँखों के सामने’ जैसे मूल पाठ के अर्थपूर्ण तत्व सुरक्षित रखे गए हैं।
