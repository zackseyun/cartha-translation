base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/014.yaml
  text: 'Yahweh of hosts has sworn by himself: Surely I will fill you with men[a], like locusts[c][b], and they will raise over you a shout.'
translation:
  language: hi
  text: 'सेनाओं के याहवे ने अपने ही जीवन की शपथ खाई है[a]: “निश्चय ही मैं तुझे मनुष्यों से, टिड्डियों के समान, भर दूँगा[b], और वे तेरे विरुद्ध ऊँची पुकार लगाएंगे[c]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपने नेफ़ेश की [शपथ]।” इस शपथ-मुहावरे का अर्थ “अपने जीवन की” या “स्वयं अपनी” शपथ खाना है।
    reason: lexical_alternative
  - marker: b
    text: इस इब्रानी शब्द का अनुवाद “जवान टिड्डियों की तरह” या “टिड्डियों के झुंड की तरह” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: यह पुकार सम्भवतः बाबेल के विरुद्ध युद्ध की ललकार या विजय की पुकार है।
    reason: cultural_note
lexical_decisions:
- source_word: נִשְׁבַּע
  choice: शपथ खाई है
  rationale: निफ़अल रूप शपथ खाने का सामान्य इब्रानी प्रयोग है। हिन्दी का पूर्ण वर्तमान रूप पूरी हो चुकी शपथ और उसके वर्तमान प्रभाव, दोनों को व्यक्त करता है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं के याहवे
  rationale: व्यक्तिगत ईश्वरीय नाम को ‘याहवे’ के रूप में रखा गया है और צְבָאוֹת को ‘सेनाओं’ कहा गया है, जिससे उपाधि का सामरिक और व्यापक स्वर्गीय आशय खुला रहता है।
- source_word: בְּנַפְשׁוֹ
  choice: स्वयं अपनी
  rationale: शाब्दिक रूप से ‘अपने नेफ़ेश की’ है, पर शपथ के इस मुहावरे का अर्थ अपने ही अस्तित्व या जीवन को साक्षी करके शपथ खाना है। ‘स्वयं अपनी शपथ’ हिन्दी में इस आत्म-शपथ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כִּי אִם
  choice: निश्चय ही
  rationale: शपथ-सूत्र में यह शर्त नहीं, बल्कि शपथ की विषयवस्तु पर दृढ़ बल देने वाला प्रयोग है।
- source_word: מִלֵּאתִיךְ אָדָם
  choice: मैं तुझे मनुष्यों से ... भर दूँगा
  rationale: स्त्रीलिंग एकवचन कर्म-प्रत्यय नगर बाबेल को संबोधित करता है। אָדָם यहाँ सामूहिक अर्थ में आक्रमणकारी मनुष्यों को दर्शाता है।
- source_word: כַּיֶּלֶק
  choice: जैसे टिड्डियों के दल से
  rationale: יֶלֶק टिड्डी की किसी अवस्था या प्रकार तथा सामूहिक झुंड का संकेत दे सकता है। ‘टिड्डियों का दल’ तुलना में विशाल झुंड की छवि को सहज हिन्दी में सामने लाता है।
- source_word: וְעָנוּ עָלַיִךְ הֵידָד
  choice: वे तेरे विरुद्ध जयघोष करेंगे
  rationale: ענה यहाँ स्वर उठाने या पुकारने के अर्थ में है। הֵידָד ऊँची सामूहिक पुकार है; सैन्य प्रसंग में ‘जयघोष’ स्वाभाविक है, जबकि टिप्पणी में युद्ध-ललकार की सम्भावना भी सुरक्षित रखी गई है।
theological_decisions:
- issue: ईश्वरीय आत्म-शपथ का अनुवाद
  choice: सेनाओं के याहवे ने स्वयं अपनी शपथ खाई है
  alternative: सेनाओं के याहवे ने अपने जीवन की शपथ खाई है
  rationale: मूल पाठ ‘अपने नेफ़ेश की’ कहता है। मुख्य पाठ में मुहावरे का अर्थ स्पष्ट किया गया है, जबकि पादटिप्पणी शाब्दिक विकल्प को सुरक्षित रखती है; इससे आत्म-शपथ का बल बना रहता है और ‘प्राण’ या ‘आत्मा’ के बारे में अनावश्यक तात्त्विक निष्कर्ष नहीं जोड़ा जाता।
- issue: הֵידָד की सैन्य प्रकृति
  choice: जयघोष
  alternative: युद्ध की ललकार
  rationale: बाबेल के विरुद्ध आने वाले मनुष्यों के प्रसंग में विजय की पुकार सम्भावित है, पर शब्द स्वयं युद्ध या अन्य सामूहिक ऊँची पुकार के लिए भी आ सकता है। इसलिए वैकल्पिक समझ पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। बाबेल से एकवचन में सीधे संबोधन को ‘तुझे/तेरे’ से बनाए रखा गया है। समानांतरता और भविष्यसूचक शपथ का दृढ़ स्वर सुरक्षित है।
