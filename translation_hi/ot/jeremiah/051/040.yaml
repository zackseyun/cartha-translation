  text: I will bring them down like lambs to the slaughter[a], like rams with male goats.
translation:
  language: hi
  text: मैं उन्हें वध के लिए मेमनों की तरह नीचे ले जाऊँगा, जैसे मेढ़ों को बकरों के साथ ले जाया जाता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֽוֹרִידֵם
  choice: मैं उन्हें ... नीचे ले जाऊँगा
  rationale: ירד के हिफ़ील रूप का कारणवाचक अर्थ ‘नीचे ले जाना’ है। यह वध के लिए पशुओं को ले जाने की उपमा को बनाए रखता है और रीति के विषय में अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: כְּכָרִים
  choice: मेमनों के समान
  rationale: כָּרִים का अर्थ ‘मेमने’ या ‘युवा मेढ़े’ हो सकता है। मुख्य पाठ में स्वाभाविक और असहायता सूचित करने वाला ‘मेमने’ रखा गया है; दूसरा संभव अर्थ पादटिप्पणी में है।
- source_word: לִטְבֹחַ
  choice: वध के लिए
  rationale: טבח के क्रियार्थक संज्ञा-रूप का आशय वध करना है। ‘वध के लिए’ उद्देश्य को स्पष्ट और संक्षिप्त रूप से व्यक्त करता है।
- source_word: כְּאֵילִים
  choice: मेढ़ों के समान
  rationale: אֵילִים का सीधा अर्थ नर भेड़, अर्थात ‘मेढ़े’, है; पशु-चित्र को बिना अनावश्यक व्याख्या के सुरक्षित रखा गया है।
- source_word: עִם עַתּוּדִים
  choice: और बकरों के समान
  rationale: עַתּוּדִים नर बकरों को सूचित करता है। हिन्दी में ‘बकरे’ स्वयं नर का स्पष्ट बोध कराता है। עִם का साहचर्य यहाँ समानांतर उपमा में स्वाभाविक ‘और’ से व्यक्त हुआ है।
