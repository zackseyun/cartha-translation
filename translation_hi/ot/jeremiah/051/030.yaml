id: JER.51.30
reference: Jeremiah 51:30
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: חָדְלוּ֩ גִבּוֹרֵ֨י בָבֶ֜ל לְ/הִלָּחֵ֗ם יָֽשְׁבוּ֙ בַּ/מְּצָד֔וֹת נָשְׁתָ֥ה גְבוּרָתָ֖/ם הָי֣וּ לְ/נָשִׁ֑ים הִצִּ֥יתוּ מִשְׁכְּנֹתֶ֖י/הָ נִשְׁבְּר֥וּ בְרִיחֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/030.yaml
  text: The warriors of Babylon have stopped fighting; they sit in the strongholds[a]. Their strength has failed; they have become like women. Her dwellings are set on fire; her bars are broken.
translation:
  language: hi
  text: बाबेल के योद्धाओं ने लड़ना छोड़ दिया है; वे गढ़ों में बैठे हैं। उनका बल चुक गया है; वे स्त्रियों के समान हो गए हैं[a]। उसके निवास-स्थानों में आग लगा दी गई है; उसके फाटकों की अर्गलाएँ टूट गई हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में अधिक शाब्दिक रूप से, “वे स्त्रियाँ हो गए हैं।” यह युद्ध में साहस और शक्ति खो देने के लिए प्रयुक्त प्राचीन उपहास है।
    reason: शाब्दिक विकल्प और प्राचीन आलंकारिक प्रयोग स्पष्ट करना।
  - marker: b
    text: अर्थात् फाटकों को भीतर से बंद रखने वाली मोटी छड़ें।
    reason: प्राचीन नगर-द्वार से संबंधित वस्तु को आधुनिक पाठक के लिए स्पष्ट करना।
lexical_decisions:
- source_word: חָדְלוּ ... לְהִלָּחֵם
  choice: लड़ना छोड़ दिया है
  rationale: חדל के साथ ל लगा क्रियार्थक रूप किसी कार्य के रुक जाने को व्यक्त करता है। यह हिन्दी में स्वाभाविक रहते हुए पूर्ण हो चुकी क्रिया को बनाए रखता है।
- source_word: גִבּוֹרֵי בָבֶל
  choice: बाबेल के योद्धा
  rationale: सैन्य प्रसंग में גִבּוֹרֵי का आशय पराक्रमी लड़ाकों से है; ‘योद्धा’ आधुनिक और स्पष्ट है।
- source_word: יָשְׁבוּ בַּמְּצָדוֹת
  choice: वे गढ़ों में बैठे हैं
  rationale: יָשְׁבוּ बैठने या टिके रहने और מְצָדוֹת किलेबंद सुरक्षित स्थानों को दर्शाता है। यह वाक्य युद्ध से हटकर दुर्गों में निष्क्रिय बैठे रहने का चित्र बनाए रखता है।
- source_word: נָשְׁתָה גְבוּרָתָם
  choice: उनकी वीरता चुक गई है
  rationale: दुर्लभ क्रिया נָשְׁתָה के सूख जाने या समाप्त हो जाने के भाव को ‘चुक गई’ व्यक्त करता है; גְבוּרָה यहाँ शारीरिक बल के साथ युद्ध-साहस का अर्थ भी रखता है, इसलिए ‘वीरता’ चुना गया।
- source_word: הָיוּ לְנָשִׁים
  choice: वे स्त्रियों-जैसे हो गए हैं
  rationale: यह प्राचीन युद्ध-संबंधी उपहास है। तुलनात्मक हिन्दी मूल की आलंकारिक बात को स्पष्ट करती है और इसे शाब्दिक देह-परिवर्तन समझने से रोकती है।
- source_word: הִצִּיתוּ מִשְׁכְּנֹתֶיהָ
  choice: उसके निवास-स्थानों में आग लगा दी गई है
  rationale: इब्रानी में क्रिया सक्रिय बहुवचन है, पर आग लगाने वालों का स्पष्ट उल्लेख नहीं है। हिन्दी का भाववाच्य अनिर्दिष्ट कर्ता जोड़े बिना नगर की दुर्दशा सामने रखता है।
- source_word: נִשְׁבְּרוּ בְרִיחֶיהָ
  choice: उसके फाटकों की अर्गलाएँ टूट गई हैं
  rationale: בְּרִיחִים वे मोटी छड़ें या बेड़े हैं जिनसे फाटक बंद किए जाते थे। प्रसंग से निहित ‘फाटक’ स्पष्ट करने पर आधुनिक पाठक रक्षात्मक ढाँचे को ठीक समझता है।
theological_decisions:
- issue: הָיוּ לְנָשִׁים में प्राचीन लैंगिक युद्ध-उपहास
  choice: वे स्त्रियों-जैसे हो गए हैं
  alternative: वे स्त्रियाँ हो गए हैं
  rationale: मूल की तीखी, प्राचीन युद्ध-संबंधी छवि को हटाया नहीं गया, पर ‘जैसे’ से उसका तुलनात्मक और आलंकारिक आशय स्पष्ट किया गया है। पादटिप्पणी ऐतिहासिक भाषिक संदर्भ बताती है, बिना उस मूल्यांकन को आधुनिक सिद्धांत के रूप में समर्थन दिए।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सहज किंतु गरिमापूर्ण रखी गई है। ‘बाबेल’, ‘गढ़’, ‘योद्धा’ और ‘निवास-स्थान’ व्यापक पाठक-वर्ग के लिए स्पष्ट हैं। कम प्रचलित ‘अर्गलाएँ’ को सटीकता के कारण रखा गया है और पादटिप्पणी में समझाया गया है।
