id: JER.51.33
reference: Jeremiah 51:33
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּי֩ כֹ֨ה אָמַ֜ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל בַּת בָּבֶ֕ל כְּ/גֹ֖רֶן עֵ֣ת הִדְרִיכָ֑/הּ ע֣וֹד מְעַ֔ט וּ/בָ֥אָה עֵֽת הַ/קָּצִ֖יר לָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/033.yaml
  text: 'For thus says Yahweh of hosts[a], the God of Israel: The daughter of Babylon is like a threshing floor at the time it is trodden; yet a little while, and the time of harvest will come for her.'
translation:
  language: hi
  text: 'क्योंकि सेनाओं का यहोवा, इस्राएल का परमेश्वर, यों कहता है:


    “बाबेल की बेटी उस खलिहान के समान है

    जिसे रौंदा जाता है;

    बस थोड़ी ही देर और,

    फिर उसके लिए कटनी का समय आ जाएगा।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का यहोवा
  rationale: व्यक्तिगत वाचाई नाम को ‘यहोवा’ से और צְבָאוֹת को ‘सेनाओं’ से व्यक्त किया गया है; इससे उपाधि की सैन्य और स्वर्गीय व्यापकता को अनावश्यक रूप से सीमित किए बिना उसका बल बना रहता है।
- source_word: בַּת בָּבֶל
  choice: बाबेल की बेटी
  rationale: नगर और साम्राज्य के स्त्री-रूपक को सपाट रूप से केवल ‘बाबेल’ न बनाकर सुरक्षित रखा गया है।
- source_word: כְּגֹרֶן
  choice: उस खलिहान के समान
  rationale: כְּ के तुलनात्मक अर्थ और न्याय से जुड़ी ठोस कृषि-छवि दोनों को बनाए रखता है। ‘उस’ आगे आने वाले विशेषण उपवाक्य से स्वाभाविक रूप से जुड़ता है।
- source_word: עֵת הִדְרִיכָהּ
  choice: जिसे रौंदने का समय आ गया है
  rationale: דרך के हिफ़ील रूप में खलिहान को पैरों से रौंदने की कृषि-क्रिया निहित है। हिन्दी में यह रचना स्वाभाविक है, जबकि कर्ता को अनिर्दिष्ट रखती है और स्त्रीलिंग प्रत्यय को बाबेल/खलिहान की संयुक्त छवि से जोड़ती है।
- source_word: עוֹד מְעַט
  choice: बस थोड़ी ही देर और
  rationale: निकट भविष्य और आसन्नता को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וּבָאָה עֵת הַקָּצִיר לָהּ
  choice: फिर उसके लिए कटनी का समय आ जाएगा
  rationale: कटनी की मूल कृषि-छवि तथा לָהּ के ‘उसके लिए’ भाव को सुरक्षित रखता है; संदर्भगत न्याय को मुख्य पाठ में व्याख्यात्मक शब्द जोड़कर स्पष्ट नहीं किया गया।
theological_decisions:
- issue: खलिहान और कटनी के रूपक का आशय
  choice: न्याय की ओर संकेत करने वाली कृषि-छवि को बिना व्याख्यात्मक विस्तार के ज्यों का त्यों बनाए रखा गया है।
  alternative: इसे तटस्थ मौसमी कटनी या स्पष्ट रूप से ‘दण्ड’ कहकर प्रस्तुत करना।
  rationale: बाबेल के विरुद्ध भविष्यवाणी के संदर्भ में रौंदना और कटनी आसन्न न्याय सूचित करते हैं, पर मूल पाठ यह बात रूपक द्वारा कहता है; इसलिए अनुवाद भी उस तनाव और चित्रात्मकता को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। काव्यात्मक पंक्ति-विन्यास भविष्यवाणी की समानांतर संरचना और कृषि-रूपक को स्पष्ट करता है।
