source:
  edition: WLC
  text: נִבְעַ֤ר כָּל אָדָם֙ מִ/דַּ֔עַת הֹבִ֥ישׁ כָּל צֹרֵ֖ף מִ/פָּ֑סֶל כִּ֛י שֶׁ֥קֶר נִסְכּ֖/וֹ וְ/לֹא ר֥וּחַ בָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/017.yaml
  text: Every man is made brutish[a], without knowledge; every metalworker is put to shame by his idol, for his cast image is falsehood, and there is no breath in them.
translation:
  language: hi
  text: ज्ञान से रहित हर मनुष्य बुद्धिहीन है; हर धातु-कारीगर अपनी मूर्ति के कारण लज्जित होता है, क्योंकि उसकी ढली हुई प्रतिमा झूठ है, और उनमें साँस[a] नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आत्मा।” इब्रानी רוּחַ का अर्थ “साँस,” “वायु” या “आत्मा” हो सकता है; यहाँ “साँस” को प्राथमिकता दी गई है, क्योंकि प्रसंग मूर्तियों के निर्जीव होने पर बल देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבְעַר
  choice: पशु-समान हो गया है
  rationale: निफ़अल रूप मनुष्य के बुद्धिहीन या पशुवत हो जाने की तीखी भविष्यद्वक्तापूर्ण निंदा व्यक्त करता है। यह केवल ‘मूर्ख’ कहने से अधिक नैतिक तीव्रता बनाए रखता है।
- source_word: כָּל אָדָם
  choice: हर मनुष्य
  rationale: אָדָם यहाँ समस्त मानवजाति के प्रत्येक व्यक्ति के लिए सामान्य अर्थ में प्रयुक्त है। आधुनिक हिन्दी में ‘हर मनुष्य’ इसके एकवचन वितरणात्मक और सार्वभौमिक भाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מִדַּעַת
  choice: ज्ञान के बिना
  rationale: מִן यहाँ अभावसूचक है; वाक्यांश ज्ञान के न होने या उससे रहित होने का भाव देता है।
- source_word: הֹבִישׁ
  choice: लज्जित होता है
  rationale: בוש के हिफ़ईल रूप में लज्जा या अपमान में डाले जाने का भाव है। हिन्दी में इस प्रसंग में ‘लज्जित होता है’ परिणाम को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: צֹרֵף
  choice: धातु-कारीगर
  rationale: यह शब्द धातु गलाने, परिष्कृत करने या उससे वस्तु बनाने वाले कारीगर को सूचित कर सकता है। ‘धातु-कारीगर’ सोने तक अर्थ को सीमित नहीं करता और मूर्ति-निर्माण के प्रसंग में स्पष्ट है।
- source_word: מִפָּסֶל
  choice: अपनी मूर्ति के कारण
  rationale: פֶּסֶל किसी तराशी हुई प्रतिमा या उपासना की मूर्ति को दर्शाता है; מִן यहाँ उस मूर्ति को लज्जा का कारण बताता है। सम्बन्धवाचक ‘अपनी’ हिन्दी में कारीगर और उसकी बनाई मूर्ति का आशय स्पष्ट करता है।
- source_word: שֶׁקֶר
  choice: झूठ
  rationale: שֶׁקֶר का मूल अर्थ झूठ या मिथ्यात्व है। ‘झूठ’ सरल, तीखा और भविष्यद्वक्तापूर्ण निंदा के अनुकूल है।
- source_word: נִסְכּוֹ
  choice: उसकी ढली हुई प्रतिमा
  rationale: शब्द धातु को उँडेलकर साँचे में ढाली गई प्रतिमा की ओर संकेत करता है। ‘ढली हुई प्रतिमा’ निर्माण-विधि को स्पष्ट रखती है और पहले आए व्यापक ‘मूर्ति’ से उचित भेद करती है।
- source_word: וְלֹא רוּחַ בָּם
  choice: और उनमें साँस नहीं है
  rationale: רוּחַ का अर्थ साँस, वायु या आत्मा हो सकता है। यहाँ मूर्तियों के निर्जीव होने पर बल है, इसलिए ‘साँस’ प्रसंगानुकूल है; बहुवचन ‘उनमें’ सामूहिक रूप से मूर्तियों और प्रतिमाओं की ओर लौटता है।
theological_decisions:
- issue: सामान्य मानवता के लिए אָדָם का अनुवाद
  choice: हर मनुष्य
  alternative: हर आदमी; सभी मनुष्य
  rationale: इब्रानी एकवचन संज्ञा का प्रयोग प्रत्येक मानव के प्रतिनिधिक और सार्वभौमिक अर्थ में करता है। ‘हर मनुष्य’ आधुनिक मानक हिन्दी में इस व्यापक अर्थ को बनाए रखता है और इसे केवल पुरुषों तक सीमित नहीं करता।
- issue: मूर्ति-विरोधी कथन में רוּחַ का अर्थ
  choice: साँस
  alternative: आत्मा
  rationale: तर्क यह है कि मनुष्य की बनाई मूर्तियाँ जीवित नहीं हैं। ‘साँस’ उनके निर्जीव होने को सामने लाती है, जबकि मूल शब्द का व्यापक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गंभीर और भविष्यद्वक्तापूर्ण रखी गई है। ‘पशु-समान’ मूल की तीखी निंदा को, और ‘धातु-कारीगर’ मूर्ति बनाने वाले कारीगर के व्यापक अर्थ को सुरक्षित रखता है।
