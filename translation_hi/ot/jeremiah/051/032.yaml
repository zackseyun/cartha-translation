id: JER.51.32
reference: Jeremiah 51:32
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הַ/מַּעְבָּר֣וֹת נִתְפָּ֔שׂוּ וְ/אֶת הָ/אֲגַמִּ֖ים שָׂרְפ֣וּ בָ/אֵ֑שׁ וְ/אַנְשֵׁ֥י הַ/מִּלְחָמָ֖ה נִבְהָֽלוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/032.yaml
  text: The crossings have been seized[a], the marshes have been burned with fire[c][b], and the men of war are terrified.
translation:
  language: hi
  text: पार उतरने के स्थानों पर कब्ज़ा कर लिया गया है[a], दलदलों को आग लगा दी गई है[b], और योद्धा आतंकित हो गए हैं[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “घाटों पर कब्ज़ा कर लिया गया है।”
    reason: lexical_alternative
  - marker: b
    text: या, “तालाबों को”; इब्रानी शब्द दलदली जलाशयों या जलभरे क्षेत्रों को भी दर्शा सकता है।
    reason: lexical_alternative
  - marker: c
    text: या, “युद्ध करनेवाले पुरुष।” शाब्दिक रूप से, “युद्ध के पुरुष।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּעְבָּרוֹת
  choice: पार उतरने के स्थानों
  rationale: מַעְבָּרוֹת ऐसे स्थानों को दर्शाता है जहाँ से पार जाया जाता है; सैन्य संदर्भ में नदी के घाट या अन्य पारगमन-स्थल अभिप्रेत हो सकते हैं। यह अभिव्यक्ति अर्थ को स्वाभाविक हिन्दी में रखती है, जबकि ‘घाट’ की संकरी संभावना पादटिप्पणी में सुरक्षित है।
- source_word: נִתְפָּשׂוּ
  choice: कब्ज़ा कर लिया गया है
  rationale: תפש के निफ़अल रूप का निष्क्रिय और परिणामसूचक भाव है—ये रणनीतिक स्थान अब शत्रु के नियंत्रण में हैं।
- source_word: הָאֲגַמִּים
  choice: दलदलों
  rationale: אֲגַמִּים जलभरे, दलदली या सरकंडों वाले क्षेत्रों को सूचित कर सकता है। बाबेल के भौगोलिक संदर्भ और जलाए जाने की क्रिया में ‘दलदल’ सर्वाधिक उपयुक्त है, पर ‘तालाब’ की संभावना पादटिप्पणी में दी गई है।
- source_word: שָׂרְפוּ בָאֵשׁ
  choice: आग लगा दी गई है
  rationale: इब्रानी में क्रिया सक्रिय अनिश्चित बहुवचन है, अर्थात अज्ञात लोगों ने जलाया; हिन्दी का भाववाच्य कर्ता को अनिर्दिष्ट रखते हुए घटना के पूर्ण परिणाम को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: योद्धा
  rationale: शाब्दिक अर्थ ‘युद्ध के पुरुष’ है। ‘योद्धा’ आधुनिक हिन्दी में स्वाभाविक, सटीक और सैन्य संदर्भ के अनुकूल है; शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: נִבְהָלוּ
  choice: आतंकित हो गए हैं
  rationale: בהל का निफ़अल रूप अचानक घबरा उठने, व्याकुल होने या आतंकित होने की तीव्र अवस्था व्यक्त करता है।
