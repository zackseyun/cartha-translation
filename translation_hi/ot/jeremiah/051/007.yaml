source:
  edition: WLC
  text: כּוֹס זָהָ֤ב בָּבֶל֙ בְּ/יַד יְהוָ֔ה מְשַׁכֶּ֖רֶת כָּל הָ/אָ֑רֶץ מִ/יֵּינָ/הּ֙ שָׁת֣וּ גוֹיִ֔ם עַל כֵּ֖ן יִתְהֹלְל֥וּ גוֹיִֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/007.yaml
  text: Babylon was a golden cup in the hand of Yahweh[a], making all the earth drunk. Nations drank from her wine[b]; therefore the nations have gone mad.
translation:
  language: hi
  text: बाबेल याहवे[a] के हाथ में सोने का प्याला था, जो सारी पृथ्वी को मदहोश कर देता था। राष्ट्रों ने उसकी मदिरा में से पिया; इसलिए राष्ट्र पागल हो गए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में परमेश्वर का नाम YHWH है।
    reason: मूल पाठ में आए ईश्वरीय नाम की पहचान स्पष्ट करना।
  - marker: b
    text: या “पागलों जैसा व्यवहार करने लगे” अथवा “पागल कर दिए गए।” यहाँ इब्रानी क्रिया प्रसंग में उन्मत्तता या पागलपन का भाव देती है।
    reason: इब्रानी क्रिया की प्रसंगानुकूल वैकल्पिक बारीकियों को सुरक्षित रखना।
lexical_decisions:
- source_word: כּוֹס זָהָב
  choice: सोने का प्याला
  rationale: यह स्वाभाविक हिन्दी में सोने से बने प्याले का बिंब स्पष्ट रखता है और बाबेल को न्याय के साधन के रूप में प्रस्तुत करने वाले रूपक को बनाए रखता है।
- source_word: בָּבֶל
  choice: बाबेल
  rationale: स्थान-नाम का हिन्दी में प्रचलित बाइबलीय लिप्यंतरण।
- source_word: בְּיַד יְהוָה
  choice: याहवे के हाथ में
  rationale: यह इब्रानी मुहावरे को बनाए रखता है, जिसमें बाबेल याहवे के अधिकार में और उसके द्वारा प्रयुक्त साधन के रूप में दिखाई देता है।
- source_word: מְשַׁכֶּרֶת
  choice: मतवाला करता था
  rationale: שׁכר के कारक भाव और चलते हुए प्रभाव को सहज हिन्दी में व्यक्त करता है तथा मदिरा के रूपक को सुरक्षित रखता है।
- source_word: כָּל הָאָרֶץ
  choice: सारी पृथ्वी
  rationale: आगे राष्ट्रों के उल्लेख के कारण यहाँ व्यापक अंतरराष्ट्रीय क्षेत्र अभिप्रेत है; इसलिए 'देश' या 'भूमि' की अपेक्षा 'पृथ्वी' उपयुक्त है।
- source_word: מִיֵּינָהּ
  choice: उसकी मदिरा में से
  rationale: מִן का स्रोत-बोध 'में से' द्वारा व्यक्त होता है। स्त्रीलिंग प्रत्यय बाबेल के मानवीकरण की ओर संकेत करता है, जिसे 'उसकी' बनाए रखता है।
- source_word: שָׁתוּ גוֹיִם
  choice: राष्ट्रों ने ... पिया
  rationale: यह क्रिया और कर्ता को स्पष्ट, स्वाभाविक हिन्दी क्रम में रखता है और גוֹיִם को राजनीतिक-सामूहिक अर्थ में 'राष्ट्र' अनूदित करता है।
- source_word: עַל כֵּן
  choice: इसलिए
  rationale: कारण और परिणाम के संबंध को संक्षिप्त तथा स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יִתְהֹלְלוּ
  choice: पागल हो गए
  rationale: मदिरा और मतवालेपन के प्रसंग में Hitpolel रूप उन्मत्तता या पागलपन का परिणाम व्यक्त करता है; अनुवाद संभावित कर्मवाच्य कारण को अनावश्यक रूप से निश्चित नहीं करता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा 'प्रभु'
  rationale: मूल पाठ में उपाधि नहीं, चार-अक्षरीय व्यक्तिगत नाम YHWH है। 'याहवे' उसका सीधा और व्यापक रूप से स्वीकृत हिन्दी लिप्यंतरण है; पादटिप्पणी पाठकों को इब्रानी रूप बताती है।
- issue: बाबेल के मदिरा-प्याले का रूपक
  choice: बाबेल को याहवे के हाथ में ऐसा प्याला दिखाना जो पृथ्वी को मतवाला करता है
  alternative: बाबेल को केवल राजनीतिक शक्ति या अव्यवस्था का स्वतंत्र कारण बताना
  rationale: पाठ बाबेल की विनाशकारी भूमिका और याहवे के हाथ में उसके होने—दोनों को साथ रखता है। अनुवाद इस धार्मिक तनाव को बिना अतिरिक्त व्याख्या के बनाए रखता है।
- issue: יִתְהֹלְלוּ में कर्तृवाच्य और कर्मवाच्य परिणाम की संभावित अस्पष्टता
  choice: पागल हो गए
  alternative: पागलों जैसा व्यवहार करने लगे अथवा पागल कर दिए गए
  rationale: संदर्भ उन्मत्तता स्पष्ट करता है, पर क्रिया को ऐसा अनूदित नहीं किया गया कि बाहरी कर्ता व्याकरण में स्पष्ट रूप से जोड़ दिया जाए। वैकल्पिक सूक्ष्मताओं को पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। 'मदिरा', 'मतवाला' और 'प्याला' काव्यात्मक-भविष्यद्वाणी के बिंब को बनाए रखते हैं, जबकि वाक्य-विन्यास वर्तमान मानक हिन्दी के अनुरूप है।
