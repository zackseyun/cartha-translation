  edition: WLC
  text: כֹּֽה אָמַ֞ר יְהוָ֣ה צְבָא֗וֹת חֹ֠מוֹת בָּבֶ֤ל הָֽ/רְחָבָה֙ עַרְעֵ֣ר תִּתְעַרְעָ֔ר וּ/שְׁעָרֶ֥י/הָ הַ/גְּבֹהִ֖ים בָּ/אֵ֣שׁ יִצַּ֑תּוּ וְ/יִֽגְע֨וּ עַמִּ֧ים בְּ/דֵי רִ֛יק וּ/לְאֻמִּ֥ים בְּ/דֵי אֵ֖שׁ וְ/יָעֵֽפוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/058.yaml
  text: 'Thus says Yahweh of hosts: Babylon’s broad wall shall be utterly razed[a], and her high gates shall be burned with fire. Peoples labor for emptiness, and nations for the fire[b], and they grow weary.'
translation:
  language: hi
  text: 'सेनाओं का यहोवा यों कहता है: “बाबेल की चौड़ी शहरपनाह[a] पूरी तरह ढहा दी जाएगी, और उसके ऊँचे फाटक आग से जला दिए जाएँगे। लोग व्यर्थ परिश्रम करते हैं, और राष्ट्र आग के लिए; वे थक जाते हैं।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बाबेल की चौड़ी शहरपनाहें पूरी तरह ढहा दी जाएँगी।” हिब्रू में ‘शहरपनाह’ बहुवचन रूप में है, संभवतः नगर की पूरी किलेबंदी के लिए सामूहिक अर्थ में। ‘पूरी तरह ढहा दी जाएगी’ के स्थान पर ‘पूरी तरह उघाड़ दी जाएगी’ भी संभव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का यहोवा
  rationale: परमेश्वर के नाम को ‘यहोवा’ के रूप में रखा गया है और צְבָאוֹת का व्यापक सैन्य अर्थ ‘सेनाओं’ से व्यक्त किया गया है।
- source_word: חֹמוֹת בָּבֶל הָרְחָבָה
  choice: बाबेल की चौड़ी शहरपनाह
  rationale: חֹמוֹת रूप की दृष्टि से बहुवचन है, पर विशेषण एकवचन स्त्रीलिंग है और वाक्यांश सामूहिक रूप से बाबेल की किलेबंदी का संकेत दे सकता है; हिंदी में ‘शहरपनाह’ इसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עַרְעֵר תִּתְעַרְעָר
  choice: पूरी तरह ढहा दी जाएगी
  rationale: धातु दीवार को उघाड़ देने या धराशायी करने का भाव देती है; infinitive absolute और finite verb की पुनरुक्ति को ‘पूरी तरह’ द्वारा प्रकट किया गया है।
- source_word: שְׁעָרֶיהָ הַגְּבֹהִים
  choice: उसके ऊँचे फाटक
  rationale: स्त्रीलिंग एकवचन प्रत्यय बाबेल की ओर संकेत करता है; ‘ऊँचे फाटक’ सीधा और आधुनिक हिंदी रूप है।
- source_word: בָּאֵשׁ יִצַּתּוּ
  choice: आग से जला दिए जाएँगे
  rationale: हिब्रू में आग लगाए जाने अथवा जलाए जाने का भाव है; यह रूप कर्मवाच्य अर्थ और अग्नि के साधन दोनों को बनाए रखता है।
- source_word: וְיִגְעוּ עַמִּים בְּדֵי רִיק
  choice: लोग व्यर्थ के लिए परिश्रम करते हैं
  rationale: יִגְעוּ कठिन श्रम करने का भाव देता है और רִיק निष्फलता अथवा रिक्त परिणाम को; ‘व्यर्थ के लिए’ काव्यात्मक संक्षिप्तता बनाए रखता है।
- source_word: וּלְאֻמִּים בְּדֵי אֵשׁ
  choice: और राष्ट्र आग के लिए
  rationale: 'यह समानांतर, कुछ संक्षिप्त हिब्रू अभिव्यक्ति है: राष्ट्रों का श्रम अंततः आग का भाग बनता है। व्याख्यात्मक विस्तार न करके मूल रूपक बचाया गया है।'
- source_word: וְיָעֵפוּ
  choice: वे थक जाते हैं
  rationale: क्रिया थक जाने या श्रम से चूर होने का परिणाम बताती है; वर्तमान हिंदी में यह सरल और गरिमापूर्ण है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: हिब्रू व्यक्तिगत नाम को उपाधि ‘प्रभु’ से बदलने के बजाय नाम के रूप में रखा गया है; आधुनिक हिंदी बाइबल-परंपरा में ‘यहोवा’ व्यापक रूप से पहचाना जाता है।
- issue: בְּדֵי אֵשׁ में आग के रूपक की व्याख्या
  choice: आग के लिए
  alternative: आग का ईंधन बनने के लिए
  rationale: मूल पाठ संक्षिप्त और अर्थगर्भित है। स्पष्ट व्याख्या जोड़ने से संभावित अर्थ सीमित हो जाता, इसलिए वास्तविक काव्यात्मक अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण भविष्यवाणी-शैली रखी गई है। ‘शहरपनाह’ किलेबंद नगर की दीवार के लिए सटीक और परिचित शब्द है। अंतिम पंक्ति की हिब्रू समानांतरता तथा ‘आग के लिए’ की जानबूझकर संक्षिप्त छवि सुरक्षित रखी गई है।
