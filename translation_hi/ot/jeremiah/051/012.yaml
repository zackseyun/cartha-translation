id: JER.51.12
reference: Jeremiah 51:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אֶל חוֹמֹ֨ת בָּבֶ֜ל שְׂאוּ נֵ֗ס הַחֲזִ֨יקוּ֙ הַ/מִּשְׁמָ֔ר הָקִ֨ימוּ֙ שֹֽׁמְרִ֔ים הָכִ֖ינוּ הָ/אֹֽרְבִ֑ים כִּ֚י גַּם זָמַ֣ם יְהוָ֔ה גַּם עָשָׂ֕ה אֵ֥ת אֲשֶׁר דִּבֶּ֖ר אֶל יֹשְׁבֵ֥י בָבֶֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/012.yaml
  text: Against the walls of Babylon[a], lift up a signal; strengthen the watch; station watchmen; prepare the ambushes[c][b]. For Yahweh has both planned and done what he spoke against the inhabitants of Babylon.
translation:
  language: hi
  text: बाबेल की शहरपनाह की ओर युद्ध-संकेत[a] ऊँचा करो; पहरे को मज़बूत करो; पहरेदार तैनात करो; घात लगानेवालों[b] को तैयार करो। क्योंकि याहवे ने बाबेल के निवासियों से[c] जो कहा था, उसकी योजना भी बनाई है और उसे पूरा भी किया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “झंडा ऊँचा करो” अथवा “ध्वज ऊँचा करो।” इब्रानी शब्द נֵס ऊँचे किए गए दृश्यमान सैन्य संकेत को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या “घात की जगहें तैयार करो।” इब्रानी पद घात लगानेवाले लोगों या घात की व्यवस्था—दोनों की ओर संकेत कर सकता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से “बाबेल के निवासियों से जो कहा था”; इस न्याय के प्रसंग में आशय उनके विरुद्ध कहे गए वचन से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל חוֹמֹת בָּבֶל
  choice: बाबेल की शहरपनाह की ओर
  rationale: אֶל का सामान्य दिशात्मक अर्थ ‘की ओर’ है। सैन्य प्रसंग में ‘के विरुद्ध’ भी संभव है, पर मुख्य पाठ में दिशात्मक अर्थ रखने से मूल की अस्पष्टता सुरक्षित रहती है।
- source_word: שְׂאוּ נֵס
  choice: युद्ध-संकेत ऊँचा करो
  rationale: נֵס किसी ऊँचे किए गए दृश्यमान संकेत, झंडे या ध्वज को दर्शाता है। प्रसंग सैन्य है, इसलिए ‘युद्ध-संकेत’ स्पष्ट और स्वाभाविक है।
- source_word: הַחֲזִיקוּ הַמִּשְׁמָר
  choice: पहरे को मज़बूत करो
  rationale: חזק का हिफ़ील रूप यहाँ पहरे या सुरक्षा-व्यवस्था को सुदृढ़ करने का आदेश देता है।
- source_word: הָקִימוּ שֹׁמְרִים
  choice: पहरेदार तैनात करो
  rationale: קום के हिफ़ील और שֹׁמְרִים का संयोग पहरेदारों को उनके स्थान पर नियुक्त या तैनात करने का भाव देता है।
- source_word: הָכִינוּ הָאֹרְבִים
  choice: घात लगानेवालों को तैयार करो
  rationale: הָאֹרְבִים व्याकरणतः घात में बैठे व्यक्तियों को सूचित कर सकता है; यह घात की व्यवस्था या स्थानों के लिए भी समझा जा सकता है। मुख्य पाठ में व्यक्तियों वाला अर्थ रखा गया है।
- source_word: כִּי גַּם זָמַם יְהוָה גַּם עָשָׂה
  choice: क्योंकि याहवे ने … उसकी योजना भी बनाई है और उसे पूरा भी किया है
  rationale: गַּם ... גַּם की समानांतर रचना ‘भी ... भी’ से व्यक्त हुई है। עָשָׂה का प्रसंगानुकूल ‘पूरा किया’ योजना के कार्यान्वयन को स्वाभाविक हिन्दी में बताता है।
- source_word: אֵת אֲשֶׁר דִּבֶּר אֶל יֹשְׁבֵי בָבֶל
  choice: बाबेल के निवासियों से जो कहा था
  rationale: אֶל का मूल दिशात्मक अर्थ ‘से/को’ मुख्य पाठ में रखा गया है; न्याय के प्रसंग में यह कथन उनके विरुद्ध है, जिसे टिप्पणी स्पष्ट करती है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिगत नाम יהוה को उपाधि से बदलने के बजाय हिन्दी में ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत नाम सीधे प्रयुक्त है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और नाम को किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: बाबेल के निवासियों से कहे गए वचन का संबंध
  choice: मुख्य पाठ में ‘से’, टिप्पणी में न्याय-वचन का विरोधी आशय
  alternative: बाबेल के निवासियों के विरुद्ध जो कहा था
  rationale: אֶל सामान्यतः ‘की ओर/से/को’ है, जबकि प्रसंग स्पष्टतः न्याय का है। यह प्रस्तुति मूल व्याकरण और प्रसंगगत विरोध—दोनों को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, आदेशात्मक और गरिमापूर्ण सैन्य भाषा रखी गई है। ‘शहरपनाह’ सामान्य बाइबली हिन्दी में समझा जाने वाला शब्द है; क्रियाएँ वर्तमान पाठक के लिए सहज हैं।
