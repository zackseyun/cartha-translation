source:
  edition: WLC
  text: וְ/אָמַרְתָּ֗ כָּ֠כָה תִּשְׁקַ֨ע בָּבֶ֤ל וְ/לֹֽא תָקוּם֙ מִ/פְּנֵ֣י הָ/רָעָ֗ה אֲשֶׁ֧ר אָנֹכִ֛י מֵבִ֥יא עָלֶ֖י/הָ וְ/יָעֵ֑פוּ עַד הֵ֖נָּה דִּבְרֵ֥י יִרְמְיָֽהוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/064.yaml
  text: And you shall say[a], ‘Thus Babylon will sink and will not rise because of the disaster that I am bringing upon her, and they will grow weary.’ Up to this point are the words of Jeremiah.
translation:
  language: hi
  text: और कहना, “इस प्रकार बाबेल डूब जाएगा और नहीं उठेगा, उस विपत्ति के कारण जिसे मैं उस पर ला रहा हूँ; और वे थक जाएँगे।”[a] यहाँ तक यिर्मयाह के वचन हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “वे थक जाएँगे” का अनुवाद “वे निढाल हो जाएँगे” या “वे मूर्छित हो जाएँगे” भी हो सकता है। इब्रानी क्रिया थकान या शक्तिहीनता व्यक्त करती है; बहुवचन सम्भवतः बाबेल के लोगों की ओर संकेत करता है, न कि स्त्रीलिंग एकवचन नगर की ओर।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: और तुम कहना
  rationale: संयोजक के साथ पूर्ण क्रिया निर्देशों की शृंखला में आज्ञार्थक बल रखती है; आधुनिक हिन्दी में यह स्वाभाविक निर्देश है।
- source_word: כָּכָה
  choice: इसी प्रकार
  rationale: यह पिछले प्रतीकात्मक कार्य की व्याख्या आरम्भ करने वाला संकेतवाचक क्रियाविशेषण है।
- source_word: תִּשְׁקַע בָּבֶל
  choice: बाबेल डूब जाएगा
  rationale: שקע का मूल बिंब नीचे डूबना है और यह पिछले प्रसंग में फ़रात में डुबाए गए पुस्तक-लपेट से जुड़ा है।
- source_word: וְלֹא תָקוּם
  choice: और फिर नहीं उठेगा
  rationale: קום यहाँ डूबने के विपरीत फिर उठने को व्यक्त करता है; ‘फिर’ स्थायी पतन का प्रसंगगत आशय स्पष्ट करता है।
- source_word: מִפְּנֵי הָרָעָה
  choice: उस विपत्ति के कारण
  rationale: מִפְּנֵי कारणसूचक है और רָעָה यहाँ नैतिक बुराई नहीं, न्यायस्वरूप आने वाली विपत्ति है।
- source_word: אֲשֶׁר אָנֹכִי מֵבִיא עָלֶיהָ
  choice: जिसे मैं उस पर ला रहा हूँ
  rationale: कृदन्त מֵבִיא आसन्न या प्रगतिशील कार्य को व्यक्त करता है; हिन्दी वाक्य दिव्य न्याय की सक्रियता बनाए रखता है।
- source_word: וְיָעֵפוּ
  choice: और वे थककर चूर हो जाएँगे
  rationale: बहुवचन क्रिया का अनिर्दिष्ट कर्ता सम्भवतः बाबेल के लोग हैं; पद थकावट/शिथिलता दर्शाता है, पर कर्ता को पाठ से अधिक निश्चित नहीं किया गया।
- source_word: עַד הֵנָּה דִּבְרֵי יִרְמְיָהוּ
  choice: यहाँ तक यिर्मयाह के वचन हैं
  rationale: यह संग्रह के अंत को सूचित करने वाला उपसंहारात्मक कथन है; हिन्दी में संक्षिप्त और गरिमापूर्ण रूप रखा गया है।
theological_decisions:
- issue: दिव्य न्याय के प्रसंग में הָרָעָה का अर्थ
  choice: विपत्ति
  alternative: बुराई; अनर्थ
  rationale: यहाँ शब्द नैतिक बुराई के बजाय दंडस्वरूप आने वाली विपत्ति को दर्शाता है। यह चयन परमेश्वर द्वारा नैतिक बुराई लाने का अनावश्यक दावा किए बिना इब्रानी का प्रसंगगत अर्थ सुरक्षित रखता है।
- issue: וְיָעֵפוּ के बहुवचन कर्ता की पहचान
  choice: अनिर्दिष्ट ‘वे’ बनाए रखा
  alternative: बाबेल के लोग थक जाएँगे
  rationale: व्याकरण स्त्रीलिंग एकवचन ‘बाबेल’ से पुल्लिंग बहुवचन की ओर बदलता है, जिससे लोगों का संकेत सम्भव है; फिर भी मूल पाठ उन्हें स्पष्ट रूप से नाम नहीं देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यवाणी-शैली रखी गई है। ‘बाबेल’ इब्रानी नाम के निकट है। बिंबात्मक ‘डूबना/उठना’ और बहुवचन कर्ता की वास्तविक अस्पष्टता सुरक्षित रखी गई है।
