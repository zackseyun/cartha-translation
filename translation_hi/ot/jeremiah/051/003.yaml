source:
  edition: WLC
  text: אֶֽל יִדְרֹ֤ךְ ידרך הַ/דֹּרֵךְ֙ קַשְׁתּ֔/וֹ וְ/אֶל יִתְעַ֖ל בְּ/סִרְיֹנ֑/וֹ וְ/אַֽל תַּחְמְלוּ֙ אֶל בַּ֣חֻרֶ֔י/הָ הַחֲרִ֖ימוּ כָּל צְבָאָֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/003.yaml
  text: Let not the archer bend his bow[a], and let him not rise up in his armor. Do not spare her young men[c][b]; devote all her army to destruction.
translation:
  language: hi
  text: धनुर्धर अपना धनुष न चढ़ाए[a], और वह अपना कवच पहनकर न उठे[b]। उसके जवानों को न बख्शो; उसकी सारी सेना को विनाश के लिए समर्पित कर दो[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'आरंभिक इब्रानी वाक्य कठिन और पुनरुक्तिपूर्ण है। मसोराई स्वरांकन के अनुसार इसका अर्थ यह भी हो सकता है: “धनुष चढ़ानेवाले के विरुद्ध धनुर्धर अपना धनुष चढ़ाए।”'
    reason: alternative_reading
  - marker: b
    text: या “अपना जालीदार कवच पहनकर” अथवा “अपना वक्ष-कवच पहनकर।”
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में एक विशेष शब्द है जिसका अर्थ दैवी न्याय के अंतर्गत किसी व्यक्ति या वस्तु को विनाश के लिए अलग कर देना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל / וְאֶל / וְאַל
  choice: न … / न … / मत
  rationale: पहले दो रूपों का व्यंजन-पाठ निषेध के रूप में समझा जा सकता है, जबकि अंतिम וְאַל स्पष्ट निषेध है। मुख्य पाठ में सुसंगत निषेधात्मक अर्थ रखा गया है, पर मसोराई स्वरांकन से संभव वैकल्पिक अर्थ को पादटिप्पणी में सुरक्षित किया गया है।
- source_word: יִדְרֹךְ ... הַדֹּרֵךְ קַשְׁתּוֹ
  choice: धनुर्धर अपना धनुष न चढ़ाए
  rationale: דרך के साथ קשת धनुष को चलाने के लिए चढ़ाने या तानने का मुहावरा है। इब्रानी में कठिन पुनरावृत्ति है; सहज हिन्दी में युद्ध की तैयारी का चित्र बनाए रखा गया है।
- source_word: יִתְעַל
  choice: उठे
  rationale: यह रूप अपने को उठाने, खड़े होने या युद्ध के लिए आगे बढ़ने का भाव देता है। ‘उठे’ संक्षिप्त और संदर्भानुकूल है।
- source_word: בְּסִרְיֹנוֹ
  choice: अपना कवच पहनकर
  rationale: סִרְיוֹן शरीर की रक्षा करनेवाले कवच, संभवतः जालीदार या शल्क-कवच, को दर्शाता है। ‘कवच’ आधुनिक हिन्दी में स्पष्ट है और अनिश्चित विशिष्टता नहीं जोड़ता।
- source_word: תַּחְמְלוּ
  choice: मत छोड़ो
  rationale: חמל का अर्थ दया करके छोड़ देना या प्राण बचाना है। युद्ध-संबंधी आदेश में ‘मत छोड़ो’ इसका व्यावहारिक बल स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בַּחֻרֶיהָ
  choice: उसके जवानों
  rationale: בָּחוּר सामान्यतः युवावस्था के पुरुष, प्रायः युद्ध योग्य जवान, को दर्शाता है। ‘जवान’ उम्र और सैनिक संदर्भ दोनों को संक्षेप में व्यक्त करता है।
- source_word: הַחֲרִימוּ
  choice: विनाश के लिए अर्पित कर दो
  rationale: חרם का हिफ़ील रूप किसी व्यक्ति या वस्तु को दैवी न्याय के अंतर्गत विनाश के लिए समर्पित करने का भार रखता है। यह अनुवाद केवल ‘नष्ट कर दो’ की अपेक्षा उस विशेष अर्थ को अधिक सुरक्षित रखता है।
- source_word: כָּל צְבָאָהּ
  choice: उसकी सारी सेना
  rationale: צָבָא यहाँ सैन्य बल का सामूहिक बोध देता है। ‘सारी सेना’ आधुनिक हिन्दी में सीधा और स्पष्ट है।
theological_decisions:
- issue: न्याय की भविष्यवाणी में חרם का अनुवाद
  choice: उसकी सारी सेना को विनाश के लिए अर्पित कर दो
  alternative: उसकी सारी सेना का पूरी तरह नाश कर दो / उसकी सारी सेना को प्रतिबंध के अधीन कर दो
  rationale: चुना हुआ रूप दैवी न्याय में विनाश के लिए अलग किए जाने का विशिष्ट अर्थ बनाए रखता है, पर पाठ से आगे बढ़कर कोई अतिरिक्त धर्मसैद्धांतिक दावा नहीं करता।
- issue: आरंभिक אֶל का निषेधात्मक या संबंधबोधक अर्थ
  choice: 'मुख्य पाठ में निषेध: ‘धनुर्धर … न चढ़ाए’'
  alternative: 'मसोराई स्वरांकन के अनुसार: ‘धनुष चढ़ानेवाले के विरुद्ध धनुर्धर अपना धनुष चढ़ाए’'
  rationale: व्यंजन-पाठ और अनेक प्राचीन/आधुनिक व्याख्याएँ निषेध की अनुमति देती हैं, जबकि मसोराई स्वरांकन אֶל को ‘के विरुद्ध’ पढ़ता है। वाक्य की पुनरावृत्ति और कठिन वाक्य-विन्यास के कारण वैकल्पिक अर्थ पादटिप्पणी में स्पष्ट रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘धनुष चढ़ाना,’ ‘कवच पहनकर उठना,’ और ‘जवान’ युद्ध-संदर्भ को स्वाभाविक हिन्दी में व्यक्त करते हैं। कठिन आरंभिक इब्रानी को मुख्य पाठ में पठनीय बनाया गया है, और वास्तविक पाठगत अस्पष्टता पादटिप्पणी में सुरक्षित है।
