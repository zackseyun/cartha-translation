source:
  edition: WLC
  text: גַּם בָּבֶ֕ל לִ/נְפֹּ֖ל חַֽלְלֵ֣י יִשְׂרָאֵ֑ל גַּם לְ/בָבֶ֥ל נָפְל֖וּ חַֽלְלֵ֥י כָל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/049.yaml
  text: Babylon also must fall for the slain of Israel[a], just as the slain of all the earth have fallen for Babylon.
translation:
  language: hi
  text: इस्राएल के मारे गए लोगों के कारण बाबेल को भी गिरना होगा[a], जिस प्रकार सारी पृथ्वी के मारे गए लोग बाबेल के कारण गिरे हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बाबेल भी गिर पड़ा है, हे इस्राएल के मारे गए लोगो।” पहले खंड की इब्रानी वाक्य-रचना अत्यंत संक्षिप्त है और उसे एक से अधिक प्रकार से समझा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: גַּם
  choice: भी / जैसे
  rationale: दोनों खंडों के बीच अनुरूपता प्रकट करने के लिए पहले खंड में ‘भी’ और दूसरे में स्वाभाविक हिन्दी के अनुसार ‘जैसे’ रखा गया है।
- source_word: בָּבֶל
  choice: बाबेल
  rationale: हिन्दी बाइबलीय परंपरा में प्रचलित स्थान-नाम, जो मूल इब्रानी नाम के निकट है।
- source_word: לִנְפֹּל
  choice: गिरना होगा
  rationale: लाम सहित infinitive की संक्षिप्त और कठिन रचना को भावी/नियत न्याय के रूप में व्यक्त करता है, बिना वैकल्पिक व्याख्या को छिपाए।
- source_word: חַלְלֵי
  choice: मारे गए लोग
  rationale: युद्ध या न्याय में मारे गए व्यक्तियों के लिए आधुनिक, सहज और गरिमापूर्ण हिन्दी।
- source_word: לְבָבֶל
  choice: बाबेल के कारण
  rationale: यहाँ लाम को बाबेल द्वारा उत्पन्न या उससे जुड़ी मृत्यु के कारण/अवसर के रूप में लिया गया है; इससे हिन्दी में अर्थ स्पष्ट और दोनों खंडों का संबंध स्वाभाविक रहता है।
- source_word: נָפְלוּ
  choice: गिरे हैं
  rationale: पूर्ण क्रिया को ऐसी पूरी हो चुकी वास्तविकता के रूप में व्यक्त करता है जिसका वर्तमान कथन में महत्व बना हुआ है।
- source_word: כָל הָאָרֶץ
  choice: सारी पृथ्वी
  rationale: इस प्रसंग में बाबेल की साम्राज्यवादी हिंसा के व्यापक, विश्वव्यापी दायरे को व्यक्त करता है; ‘सारा देश’ भी शाब्दिक रूप से संभव है।
theological_decisions:
- issue: पहले खंड की संक्षिप्त इब्रानी वाक्य-रचना
  choice: इस्राएल के मारे गए लोगों के कारण बाबेल को भी गिरना होगा
  alternative: बाबेल भी गिर पड़ा है, हे इस्राएल के मारे गए लोगो
  rationale: मुख्य पाठ नियत प्रतिशोध और दोनों खंडों की समानांतरता को व्यक्त करता है, जबकि वास्तविक व्याकरणिक अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: אָרֶץ का दायरा
  choice: सारी पृथ्वी
  alternative: सारा देश
  rationale: बाबेल के विरुद्ध इस भविष्यवाणी में व्यापक साम्राज्यवादी हिंसा और विश्वव्यापी न्याय की अलंकारिक व्यापकता के कारण ‘पृथ्वी’ अधिक उपयुक्त है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गंभीर और भविष्यवाणी-साहित्य के अनुकूल भाषा रखी गई है। ‘बाबेल’ और ‘इस्राएल’ जैसे प्रचलित बाइबलीय नाम अपनाए गए हैं; मूल की काव्यात्मक समानांतरता तथा उसकी वास्तविक अस्पष्टता दोनों सुरक्षित हैं।
