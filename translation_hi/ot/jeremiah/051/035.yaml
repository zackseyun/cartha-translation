  text: חֲמָסִ֤/י וּ/שְׁאֵרִ/י֙ עַל בָּבֶ֔ל תֹּאמַ֖ר יֹשֶׁ֣בֶת צִיּ֑וֹן וְ/דָמִ/י֙ אֶל יֹשְׁבֵ֣י כַשְׂדִּ֔ים תֹּאמַ֖ר יְרוּשָׁלִָֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/035.yaml
  text: “My violence and my flesh be upon Babylon,” says the inhabitant of Zion[b][a]. “And my blood be upon the inhabitants of Chaldea,” says Jerusalem.
translation:
  language: hi
  text: “मेरे साथ हुई हिंसा और मेरी देह[a] बाबेल पर पड़े,” सिय्योन की निवासिनी कहेगी। “और मेरा खून कसदिया के निवासियों पर पड़े,” यरूशलेम कहेगी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप: “मेरी हिंसा और मेरी देह।” ‘देह’ के हिब्रू शब्द का अनुवाद ‘मांस’ भी हो सकता है; कुछ विद्वानों ने अन्य व्युत्पत्तियाँ भी प्रस्तावित की हैं।'
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में शाब्दिक रूप से “कसदिया के निवासियों की ओर” है; पहले अर्धपद के समानांतर यहाँ “पर पड़े” का शापोक्तिपरक भाव निहित समझा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמָסִי
  choice: मेरे साथ हुई हिंसा
  rationale: חָמָס हिंसा, अत्याचार या घोर अन्याय को सूचित करता है। इस विलाप और शापोक्ति में प्रथम पुरुष प्रत्यय का आशय सिय्योन द्वारा की गई हिंसा नहीं, बल्कि उसके साथ हुई हिंसा है।
- source_word: וּשְׁאֵרִי
  choice: और मेरी देह पर हुआ अत्याचार
  rationale: שְׁאֵר यहाँ परंपरागत रूप से ‘मांस/देह’ समझा जाता है और अगले वाक्यांश के ‘खून’ के समानांतर शारीरिक हानि को व्यक्त करता है। स्वाभाविक हिन्दी में हिंसा की धारणा को ‘देह’ पर भी लागू किया गया है, जबकि पादटिप्पणी अधिक शाब्दिक रूप बताती है।
- source_word: עַל בָּבֶל
  choice: बाबेल पर पड़े
  rationale: यह शापोक्तिपरक नाममात्र वाक्य है, जिसमें इच्छा है कि किए गए अत्याचार का दोष या परिणाम बाबेल पर आए। ‘पर पड़े’ हिन्दी में उस न्यायिक और शापोक्तिपरक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: תֹּאמַר
  choice: कहेगी
  rationale: अपूर्ण क्रिया भविष्यवाणी की शैली में कथन प्रस्तुत करती है। स्त्रीलिंग कर्ता के अनुरूप ‘कहेगी’ मूल के रूप को बनाए रखता है।
- source_word: יֹשֶׁבֶת צִיּוֹן
  choice: सिय्योन की निवासिनी
  rationale: स्त्रीलिंग एकवचन कृदंत सिय्योन को स्त्री के रूप में व्यक्तित्व देता है। ‘निवासिनी’ इस रूप को सीधे और संक्षेप में सुरक्षित रखता है।
- source_word: וְדָמִי
  choice: और मेरा खून
  rationale: דָּם यहाँ बहाए गए वास्तविक खून को सूचित करता है और पहले अर्धपद की शारीरिक हिंसा के समानांतर है। ‘खून’ आम आधुनिक हिन्दी में स्पष्ट और प्रभावी है।
- source_word: אֶל יֹשְׁבֵי כַשְׂדִּים
  choice: कसदिया के निवासियों पर पड़े
  rationale: यद्यपि אֶל का मूल अर्थ ‘की ओर/को’ है, समानांतर शापोक्तिपरक रचना में पहले अर्धपद का ‘पर पड़े’ भाव यहाँ निहित है। इसे पादटिप्पणी में स्पष्ट किया गया है।
- source_word: כַשְׂדִּים
  choice: कसदिया
  rationale: ‘निवासियों’ के साथ यह क्षेत्रवाचक अर्थ में है; इसलिए स्थाननाम ‘कसदिया’ स्वाभाविक हिन्दी देता है और ‘कसदियों के निवासियों’ जैसी असहज रचना से बचाता है।
- source_word: יְרוּשָׁלִָם
  choice: यरूशलेम
  rationale: मानक हिन्दी बाइबलीय रूप में स्थाननाम का लिप्यंतरण किया गया है।
theological_decisions:
- issue: सिय्योन की शापोक्ति का बल
  choice: ‘पर पड़े’ के द्वारा प्रतिफल या दंड की कामना को बनाए रखा गया
  alternative: केवल ‘पर/की ओर’ जैसा अस्पष्ट संबंध
  rationale: समानांतर रचना हिंसा और बहाए गए खून का परिणाम अपराधियों पर आने की मांग करती है; अनुवाद इसे न तो नरम करता है, न किसी विशिष्ट दंड-सिद्धांत में बदलता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘देह’, ‘निवासिनी’ और ‘पर पड़े’ काव्यात्मक-भविष्यवाणी शैली को बनाए रखते हैं, जबकि पादटिप्पणियाँ मूल की शाब्दिक असामान्यता और पूर्वसर्गीय भिन्नता को सुरक्षित करती हैं।
