source:
  edition: WLC
  text: בֹּ֚שְׁנוּ כִּֽי שָׁמַ֣עְנוּ חֶרְפָּ֔ה כִּסְּתָ֥ה כְלִמָּ֖ה פָּנֵ֑י/נוּ כִּ֚י בָּ֣אוּ זָרִ֔ים עַֽל מִקְדְּשֵׁ֖י בֵּ֥ית יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/051.yaml
  text: We are ashamed, for we have heard reproach; disgrace has covered our faces, for foreigners have come against the holy places of the house of the LORD.
translation:
  language: hi
  text: हम लज्जित हैं, क्योंकि हमने निन्दा सुनी है; अपमान ने हमारे चेहरों को ढक लिया है, क्योंकि परदेशी यहोवा के भवन के पवित्र स्थानों के विरुद्ध आ गए हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֹּשְׁנוּ
  choice: हम लज्जित हैं
  rationale: क्रिया यहाँ सामूहिक लज्जा की वर्तमान दशा व्यक्त करती है; यह सहज और अर्थ-सटीक हिन्दी है।
- source_word: חֶרְפָּה
  choice: निन्दा
  rationale: यह शब्द तिरस्कारपूर्ण निन्दा अथवा धिक्कार का बोध कराता है; निकटवर्ती כְלִמָּה से भेद बनाए रखने के लिए ‘निन्दा’ चुना गया।
- source_word: כְלִמָּה
  choice: अपमान
  rationale: लज्जाजनक बेइज्जती का भाव व्यक्त करता है और चेहरे ढकने की रूपकात्मक भाषा के साथ स्वाभाविक बैठता है।
- source_word: זָרִים
  choice: परदेशी
  rationale: सन्दर्भ में अपने समुदाय से बाहर के विदेशी आक्रमणकारी अभिप्रेत हैं; ‘परदेशी’ मूल की बाहरी पहचान को बनाए रखता है।
- source_word: עַל
  choice: पर चढ़ आए हैं
  rationale: पूर्वसर्ग का अर्थ ‘पर/विरुद्ध’ हो सकता है; आक्रमण के सन्दर्भ में यह प्रयोग उस दिशा और शत्रुतापूर्ण कार्रवाई को बनाए रखता है, बिना स्पष्ट रूप से ‘भीतर घुसने’ तक सीमित किए।
- source_word: מִקְדְּשֵׁי
  choice: पवित्र स्थानों
  rationale: बहुवचन रूप को ज्यों का त्यों रखा गया है; यह भवन के पवित्र क्षेत्रों अथवा पवित्र परिसर की ओर संकेत कर सकता है।
- source_word: בֵּית יְהוָה
  choice: यहोवा के भवन
  rationale: व्यक्तिगत ईश्वरीय नाम יהוה को प्रचलित हिन्दी रूप ‘यहोवा’ से और בֵּית को ‘भवन’ से व्यक्त किया गया है।
theological_decisions:
- issue: परदेशियों की कार्रवाई का स्वरूप
  choice: पवित्र स्थानों पर चढ़ आए हैं
  alternative: पवित्र स्थानों में घुस आए हैं
  rationale: עַל का मूल अर्थ यहाँ ‘पर/विरुद्ध’ है। ‘चढ़ आए’ आक्रमण को व्यक्त करता है, पर मूल पाठ से अधिक निश्चित होकर प्रवेश को घोषित नहीं करता।
- issue: מִקְדְּשֵׁי का बहुवचन
  choice: पवित्र स्थानों
  alternative: पवित्रस्थान
  rationale: मसोरेटिक पाठ के रूपात्मक बहुवचन को सुरक्षित रखा गया है और उसे एकवचन सामूहिक संज्ञा में नहीं बदला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और सामूहिक विलाप का स्वर रखा गया है। ‘निन्दा’ और ‘अपमान’ से समानार्थी हिब्रू पदों का सूक्ष्म भेद बचाया गया है; वाक्य की समानांतर काव्यात्मक संरचना भी बनाए रखी गई है।
