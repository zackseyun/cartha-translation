  text: הָי֤וּ עָרֶ֨י/הָ֙ לְ/שַׁמָּ֔ה אֶ֖רֶץ צִיָּ֣ה וַ/עֲרָבָ֑ה אֶ֗רֶץ לֹֽא יֵשֵׁ֤ב בָּ/הֵן֙ כָּל אִ֔ישׁ וְ/לֹֽא יַעֲבֹ֥ר בָּ/הֵ֖ן בֶּן אָדָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/043.yaml
  text: Her cities have become a desolation[a], a dry land and a desert, a land where no one lives[c][b], and through which no son of man passes.
translation:
  language: hi
  text: उसके नगर उजाड़ हो गए हैं—सूखी भूमि और मरुभूमि; ऐसा देश जिसमें कोई नहीं बसता[a] और जिसके नगरों से होकर कोई मनुष्य नहीं गुजरता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में “कोई पुरुष” और “मनुष्य का पुत्र” जैसी दो सामान्य अभिव्यक्तियाँ हैं; यहाँ दोनों का आशय किसी भी मनुष्य से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֶיהָ
  choice: उसके नगर
  rationale: स्त्रीलिंग एकवचन प्रत्यय संदर्भ में स्त्री के रूप में व्यक्त बाबेल की ओर संकेत करता है; हिन्दी का ‘उसके’ स्वाभाविक रहते हुए इस संदर्भ को बनाए रखता है।
- source_word: לְשַׁמָּה
  choice: उजाड़
  rationale: यह शब्द यहाँ विनाश के फलस्वरूप निर्जन और ध्वस्त दशा को व्यक्त करता है; ‘उजाड़’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: אֶרֶץ צִיָּה וַעֲרָבָה
  choice: सूखी भूमि और मरुभूमि
  rationale: צִיָּה की शुष्कता और עֲרָבָה के रेगिस्तानी अथवा शुष्क मैदान के अर्थ को दो अलग, सुबोध पदों से व्यक्त किया गया है।
- source_word: לֹא יֵשֵׁב בָּהֵן כָּל אִישׁ
  choice: जहाँ कोई नहीं बसता
  rationale: ‘बसना’ יָשַׁב के निवास-संबंधी अर्थ को ठीक व्यक्त करता है; ‘कोई’ אישׁ के सामान्य मानवीय अर्थ को स्वाभाविक हिन्दी में देता है।
- source_word: וְלֹא יַעֲבֹר בָּהֵן בֶּן אָדָם
  choice: जहाँ से होकर कोई मनुष्य नहीं गुजरता
  rationale: עבר ב का अर्थ ‘से होकर गुजरना’ है। בן אדם यहाँ सामान्य रूप से किसी मानव यात्री को सूचित करता है, इसलिए ‘कोई मनुष्य’ हिन्दी में अर्थ स्पष्ट रखता है और अनावश्यक मसीही उपाधि-संबंधी संकेत से बचता है।
theological_decisions:
- issue: בֶּן אָדָם का अनुवाद
  choice: कोई मनुष्य
  alternative: मनुष्य का पुत्र
  rationale: इस पद में यह सामान्य हिब्रू अभिव्यक्ति मानव जाति के किसी सदस्य के लिए प्रयुक्त है, न कि किसी विशिष्ट मसीही उपाधि के रूप में; इसलिए अर्थपरक सामान्य हिन्दी चुनी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। काव्यात्मक समानांतरता बनाए रखने के लिए ‘सूखी भूमि और मरुभूमि’ तथा निवास और आवागमन के निषेध को अलग-अलग रखा गया है।
