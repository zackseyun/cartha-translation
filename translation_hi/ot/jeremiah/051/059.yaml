  text: הַ/דָּבָ֞ר אֲשֶׁר צִוָּ֣ה יִרְמְיָ֣הוּ הַ/נָּבִ֗יא אֶת שְׂרָיָ֣ה בֶן נֵרִיָּה֮ בֶּן מַחְסֵיָה֒ בְּ/לֶכְתּ֞/וֹ אֶת צִדְקִיָּ֤הוּ מֶֽלֶךְ יְהוּדָה֙ בָּבֶ֔ל בִּ/שְׁנַ֥ת הָ/רְבִעִ֖ית לְ/מָלְכ֑/וֹ וּ/שְׂרָיָ֖ה שַׂ֥ר מְנוּחָֽה־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/059.yaml
  text: This is the word that Jeremiah the prophet commanded Seraiah son of Neriah[a], son of Mahseiah, when he went with Zedekiah king of Judah to Babylon, in the fourth year of his reign. Now Seraiah was the quartermaster.
translation:
  language: hi
  text: यह वह आदेश है जो यिर्मयाह भविष्यद्वक्ता ने सरायाह को दिया था, जो नेरियाह का पुत्र, महसयाह का पुत्र था, जब वह यहूदा के राजा सिदकियाह के साथ उसके राज्य के चौथे वर्ष में बेबीलोन गया। सरायाह पड़ाव की व्यवस्था का अधिकारी[a] था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह दुर्लभ इब्रानी पदवी (शाब्दिक रूप से ‘विश्राम/ठहराव का अधिकारी’) का ठीक अर्थ निश्चित नहीं है। इसका अर्थ विश्राम-स्थलों, ठहरने की जगहों, या यात्रा की व्यवस्था के लिए उत्तरदायी अधिकारी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּבָר אֲשֶׁר צִוָּה
  choice: यह वह आदेश है जो ... ने ... को दिया था
  rationale: דָּבָר का अर्थ ‘वचन, बात, संदेश’ हो सकता है, और צִוָּה स्पष्ट रूप से आज्ञा देने का भाव रखता है। इस प्रसंग में ‘आदेश’ दोनों को स्वाभाविक और सशक्त हिन्दी में व्यक्त करता है।
- source_word: יִרְמְיָהוּ הַנָּבִיא
  choice: यिर्मयाह भविष्यद्वक्ता
  rationale: नाम का प्रचलित हिन्दी लिप्यंतरण और נָבִיא का स्पष्ट, प्रतिष्ठित हिन्दी पर्याय रखा गया है।
- source_word: שְׂרָיָה בֶן נֵרִיָּה בֶּן מַחְסֵיָה
  choice: नेरियाह के पुत्र और महसयाह के पोते सरायाह
  rationale: दो पीढ़ियों के वंश-संबंध को आधुनिक हिन्दी में अस्पष्टता के बिना व्यक्त किया गया है; दूसरे בֶן का आशय यहाँ वंशज अर्थात पोता है।
- source_word: בְּלֶכְתּוֹ אֶת צִדְקִיָּהוּ מֶלֶךְ יְהוּדָה בָּבֶל
  choice: जब सरायाह यहूदा के राजा सिदकियाह के साथ ... बेबीलोन गया था
  rationale: בְּלֶכְתּוֹ कालसूचक है और אֶת यहाँ सहचरता प्रकट करता है। सर्वनाम की संभावित अस्पष्टता से बचने के लिए ‘सरायाह’ दोहराया गया है।
- source_word: בִּשְׁנַת הָרְבִעִית לְמָלְכוֹ
  choice: उसके शासन के चौथे वर्ष में
  rationale: यह राजकीय काल-निर्धारण का सामान्य सूत्र है; ‘शासन’ आधुनिक हिन्दी में स्वाभाविक है और प्रत्यय का संबंध निकटतम राजा सिदकियाह से बना रहता है।
- source_word: שַׂר מְנוּחָה
  choice: पड़ाव की व्यवस्था का अधिकारी
  rationale: यह दुर्लभ पदवी है। מְנוּחָה का संबंध विश्राम या ठहरने के स्थान से है; यात्रा के प्रसंग में यह अनुवाद संभावित प्रशासनिक दायित्व को सहज हिन्दी में व्यक्त करता है, पर अनिश्चितता को पाद-टिप्पणी में सुरक्षित रखता है।
