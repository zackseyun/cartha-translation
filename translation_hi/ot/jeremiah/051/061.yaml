translation:
  language: hi
  text: तब यिर्मयाह ने सरायाह से कहा, “जब तुम बाबेल पहुँचो, तो ध्यान रखना कि तुम ये सभी वचन पढ़ो।[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शब्दशः: “और तुम देखोगे और इन सभी वचनों को पढ़ोगे।” यहाँ “देखोगे” का भाव संभवतः “ध्यान रखना” या “सुनिश्चित करना” है।'
    reason: וְרָאִיתָ के शाब्दिक रूप और प्रसंगानुकूल निर्देशात्मक अर्थ, दोनों को सुरक्षित रखना।
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वय्यिक़्तोल कथा-क्रम में अगली घटना को आगे बढ़ाता है; आधुनिक हिन्दी में ‘तब ... ने कहा’ स्वाभाविक कथा-प्रवाह देता है।
- source_word: יִרְמְיָהוּ
  choice: यिर्मयाह
  rationale: हिन्दी बाइबलीय परंपरा में प्रचलित नाम-रूप।
- source_word: אֶל שְׂרָיָה
  choice: सरायाह से
  rationale: אֶל संबोधित व्यक्ति को चिह्नित करता है; नाम को स्रोत के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: כְּבֹאֲךָ בָבֶל
  choice: जब तुम बाबेल पहुँचो
  rationale: כְּ के साथ בוא का क्रियारूप कालवाचक अर्थ ‘जब तुम आओ/पहुँचो’ देता है। गंतव्य के संदर्भ में ‘पहुँचो’ सहज हिन्दी है।
- source_word: וְרָאִיתָ
  choice: तो ध्यान रखना कि
  rationale: शाब्दिक अर्थ ‘और तुम देखोगे’ है, पर अगली क्रिया के साथ यहाँ सावधानीपूर्वक काम पूरा करने का निर्देश जान पड़ता है। अर्थगत अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: וְקָרָאתָ
  choice: पढ़ो
  rationale: लिखित भविष्यवाणी के संदर्भ में קרא का अर्थ पढ़ना, संभवतः पढ़कर सुनाना, है। मूल पद केवल श्रोताओं या सार्वजनिकता को स्पष्ट नहीं करता, इसलिए ‘पढ़ो’ चुना गया है।
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: ये सारी बातें
  rationale: דְּבָרִים लिखित कथनों के लिए ‘बातें’ या ‘वचन’ हो सकता है। ‘बातें’ सामान्य आधुनिक हिन्दी में स्वाभाविक है और संदर्भ में लिखित सामग्री को दर्शाता है।
