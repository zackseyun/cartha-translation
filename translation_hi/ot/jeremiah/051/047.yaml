language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לָ/כֵן֙ הִנֵּ֣ה יָמִ֣ים בָּאִ֔ים וּ/פָקַדְתִּי֙ עַל פְּסִילֵ֣י בָבֶ֔ל וְ/כָל אַרְצָ֖/הּ תֵּב֑וֹשׁ וְ/כָל חֲלָלֶ֖י/הָ יִפְּל֥וּ בְ/תוֹכָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/047.yaml
  text: Therefore, look, days are coming when I will punish the carved images of Babylon, and all her land will be put to shame, and all her slain will fall in her midst.
translation:
  language: hi
  text: इसलिए देखो, ऐसे दिन आ रहे हैं जब मैं बाबेल की खुदी हुई मूर्तियों को दण्ड दूँगा। उसका सारा देश लज्जित होगा, और उसके सभी मारे गए लोग उसी के बीच गिर पड़ेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: पूर्ववर्ती न्याय-वाणी से इस घोषणा का निष्कर्षात्मक संबंध स्वाभाविक रूप से व्यक्त करता है।
- source_word: הִנֵּה
  choice: देखो
  rationale: आने वाली घटना की ओर ध्यान खींचने वाला स्पष्ट और साधारण आधुनिक हिन्दी रूप।
- source_word: וּפָקַדְתִּי עַל
  choice: मैं ... को दण्ड दूँगा
  rationale: इस न्याय-संदर्भ में פקד על का अर्थ जवाबदेही के लिए हस्तक्षेप करके दण्ड देना है।
- source_word: פְּסִילֵי בָבֶל
  choice: बाबेल की खुदी हुई मूर्तियों
  rationale: פְּסִילִים के निर्माण-भाव को बनाए रखता है और सामान्य 'मूर्तियों' से अधिक स्रोत-संगत है।
- source_word: תֵּבוֹשׁ
  choice: लज्जित होगा
  rationale: क्रिया के मूल लज्जा-अर्थ को बनाए रखता है; देश को सामूहिक/व्यक्तिवाचक रूप में प्रस्तुत करने वाली स्रोत की भाषा भी बनी रहती है।
- source_word: חֲלָלֶיהָ
  choice: उसके ... मारे गए लोग
  rationale: युद्ध या हिंसा में मारे गए व्यक्तियों का बोध देता है; केवल सामान्य मृतकों का नहीं।
- source_word: בְתוֹכָהּ
  choice: उसी के बीच
  rationale: स्त्रीलिंग प्रत्यय को बाबेल/उसके देश की ओर लौटाता है और आन्तरिक विनाश पर बल बनाए रखता है।
theological_decisions:
- issue: दण्ड का कर्ता और मूर्तियों पर न्याय
  choice: प्रथम पुरुष 'मैं' और मूर्तियों को दण्ड देने की भाषा स्पष्ट रखी गई।
  alternative: मूर्तिपूजकों या बाबेल को दण्ड का प्रत्यक्ष कर्म बनाना।
  rationale: इब्रानी पाठ में פְּסִילֵי בָבֶל ही עַל के बाद आते हैं; पाठ की सजीव न्याय-भाषा को व्याख्यात्मक रूप से बदलना उचित नहीं।
- issue: देश का लज्जित होना
  choice: मानवीकरण को यथावत रखा गया।
  alternative: देश के निवासियों को लज्जित बताना।
  rationale: मूल पाठ כָל־אַרְצָהּ को सीधे תֵּבוֹשׁ का कर्ता बनाता है; निहित निवासियों को पाठ में जोड़ना अनावश्यक समाधान होता।
translation_notes:
  register: भाषा आधुनिक, dignified और सहज रखी गई है। 'बाबेल' मूल नाम בבל के निकट है; 'खुदी हुई मूर्तियाँ' स्रोत की विशिष्ट शब्दावली बचाती है। छोटे वाक्यों में विभाजन हिन्दी पठनीयता के लिए है, अर्थ-संबंध अपरिवर्तित है।
