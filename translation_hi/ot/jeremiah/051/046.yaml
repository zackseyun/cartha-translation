base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/046.yaml
  text: And do not let your heart grow faint[a], and do not fear the report heard in the land; a report will come in one year, and after it in the next year another report, and violence in the land[c][b], ruler against ruler.
translation:
  language: hi
  text: और कहीं ऐसा न हो कि तुम्हारा हृदय साहस खो दे[a] और तुम उस समाचार से डर जाओ जो देश में सुनाई दे रहा है। एक वर्ष में एक समाचार आएगा, और उसके अगले वर्ष दूसरा समाचार आएगा; देश में हिंसा होगी, और एक शासक दूसरे शासक के विरुद्ध होगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “तुम्हारा हृदय कोमल पड़ जाए।” इसका आशय साहस खो देना या हिम्मत हार जाना है।'
    reason: lexical_alternative
  - marker: b
    text: या “शासक पर शासक।” यह वाक्यांश शासकों के आपसी संघर्ष या एक के बाद दूसरे शासक के आने, दोनों की ओर संकेत कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וּפֶן
  choice: और कहीं ऐसा न हो कि
  rationale: פן की निषेधात्मक चेतावनी को सीधे निषेध में बदलने के बजाय उसके मूल ‘कहीं ऐसा न हो’ वाले चेतावनी-भाव में रखा गया है।
- source_word: יֵרַךְ לְבַבְכֶם
  choice: तुम्हारा हृदय साहस खो दे
  rationale: रכך का मूल भाव ‘कोमल/निर्बल होना’ है; हृदय के साथ यह साहस टूटने या हिम्मत हारने का मुहावरा है। यह हिन्दी में अर्थ स्पष्ट रखते हुए हृदय की मूल छवि बचाता है।
- source_word: וְתִירְאוּ
  choice: और तुम ... डर जाओ
  rationale: आरम्भिक פן का निषेधात्मक चेतावनी-बल इस समन्वित क्रिया पर भी लागू होता है।
- source_word: בַּשְּׁמוּעָה הַנִּשְׁמַעַת בָּאָרֶץ
  choice: उस समाचार से ... जो देश में सुनाई देगा
  rationale: שְׁמוּעָה समाचार, खबर या अफ़वाह हो सकता है। ‘समाचार’ तटस्थ है और נִשְׁמַעַת की स्त्रीलिंग एकवचन रूप के अनुकूल भविष्यगत ‘सुनाई देगा’ चुना गया है।
- source_word: וּבָא בַשָּׁנָה הַשְּׁמוּעָה
  choice: एक वर्ष एक समाचार आएगा
  rationale: हिब्रू की संक्षिप्त काल-अभिव्यक्ति और आने वाले समाचार की पुनरावृत्ति को स्वाभाविक हिन्दी में रखा गया है।
- source_word: וְאַחֲרָיו בַּשָּׁנָה הַשְּׁמוּעָה
  choice: और उसके अगले वर्ष दूसरा समाचार
  rationale: אַחֲרָיו को पहले समाचार/घटना के बाद आने वाले वर्ष से जोड़ा गया है; ‘अगले’ और ‘दूसरा’ पुनरावृत्त क्रम स्पष्ट करते हैं।
- source_word: וְחָמָס בָּאָרֶץ
  choice: देश में हिंसा होगी
  rationale: חָמָס के हिंसा, अन्याय और अत्याचार के अर्थों में संदर्भानुकूल सीधा विकल्प ‘हिंसा’ है; हिन्दी वाक्य की पूर्णता के लिए ‘होगी’ जोड़ा गया है।
- source_word: וּמֹשֵׁל עַל מֹשֵׁל
  choice: शासक शासक के विरुद्ध होगा
  rationale: עַל मूलतः ‘पर/ऊपर’ भी हो सकता है, पर राजनीतिक अशांति के संदर्भ में विरोध का अर्थ स्वाभाविक है; वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
