source:
  edition: WLC
  text: כִּי֩ בָ֨א עָלֶ֤י/הָ עַל בָּבֶל֙ שׁוֹדֵ֔ד וְ/נִלְכְּדוּ֙ גִּבּוֹרֶ֔י/הָ חִתְּתָ֖ה קַשְּׁתוֹתָ֑/ם כִּ֣י אֵ֧ל גְּמֻל֛וֹת יְהוָ֖ה שַׁלֵּ֥ם יְשַׁלֵּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/056.yaml
  text: For a destroyer has come against her[a], against Babylon, and her warriors have been captured; their bows are shattered. For Yahweh is a God of recompense[c][b]; he will surely repay.
translation:
  language: hi
  text: क्योंकि उस पर—बाबेल पर—एक विनाशक[a] आ चढ़ा है; उसके योद्धा पकड़ लिए गए हैं, और उनके धनुष टूट गए हैं। क्योंकि याहवे प्रतिफल देनेवाला परमेश्वर है[b]; वह निश्चय ही प्रतिफल देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “लूटनेवाला” अथवा “उजाड़नेवाला।”
    reason: lexical_alternative
  - marker: b
    text: या “बदला लेनेवाला परमेश्वर।” इब्रानी पद न्याय के अनुसार प्रतिफल या बदला चुकाने पर बल देता है।
    reason: alternative_reading
lexical_decisions:
- source_word: שׁוֹדֵד
  choice: एक विनाश करनेवाला
  rationale: यह कृदंत ऐसे व्यक्ति को दर्शाता है जो उजाड़ता या लूटता है। युद्ध और न्याय के संदर्भ में यह चयन व्यापक अर्थ बनाए रखता है; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: בָא עָלֶיהָ עַל בָּבֶל
  choice: उस पर—बाबेल पर—... चढ़ आया है
  rationale: दो बार आए עַל के बल और ‘उस’ की बाबेल के रूप में व्याख्या को डैशयुक्त पुनरुक्ति द्वारा सुरक्षित रखा गया है।
- source_word: וְנִלְכְּדוּ
  choice: पकड़ लिए गए हैं
  rationale: निफ़अल रूप का कर्मवाच्य भाव और सैनिकों के बंदी बनाए जाने का युद्ध-संदर्भ स्पष्ट रहता है।
- source_word: גִּבּוֹרֶיהָ
  choice: उसके योद्धा
  rationale: शाब्दिक अर्थ ‘उसके पराक्रमी पुरुष’ है, पर यहाँ बाबेल के लड़ाकों का उल्लेख है; ‘योद्धा’ आधुनिक हिन्दी में सहज और संदर्भानुकूल है।
- source_word: חִתְּתָה קַשְּׁתוֹתָם
  choice: उनके धनुष तोड़ दिए गए हैं
  rationale: क्रिया धनुषों के टूटने या चकनाचूर होने को दर्शाती है। कर्मवाच्य हिन्दी सैन्य निरस्त्रीकरण की छवि को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: אֵל גְּמֻלוֹת
  choice: प्रतिफल देनेवाला परमेश्वर
  rationale: גְּמֻלוֹת उचित प्रत्युत्तर, प्रतिदान या दंडात्मक प्रतिफल का अर्थ रखता है। यह चयन न्यायपूर्ण चुकौती पर बल देता है और केवल भावनात्मक प्रतिशोध तक अर्थ को सीमित नहीं करता।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित प्रत्यक्ष नाम-रूप ‘यहोवा’ रखा गया है, ताकि मूल पाठ के व्यक्तिगत दिव्य नाम को किसी उपाधि से न बदला जाए।
- source_word: שַׁלֵּם יְשַׁלֵּם
  choice: वह निश्चय ही पूरा बदला चुकाएगा
  rationale: क्रिया के साथ infinitive absolute की तीव्रता ‘निश्चय ही’ और पूर्ण प्रत्यर्पण की धारणा ‘पूरा ... चुकाएगा’ से व्यक्त होती है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में चतुरक्षरीय व्यक्तिगत नाम सीधे प्रयुक्त हुआ है। आधुनिक हिन्दी बाइबलीय प्रयोग में पहचानने योग्य ‘यहोवा’ नाम को रखा गया है; इसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया।
- issue: אֵל גְּמֻלוֹת में ईश्वरीय न्याय का स्वर
  choice: प्रतिफल देनेवाला परमेश्वर
  alternative: बदला लेनेवाला परमेश्वर
  rationale: इब्रानी पद न्यायसंगत प्रतिदान या चुकौती को व्यक्त करता है। मुख्य पाठ व्यापक न्यायिक अर्थ रखता है, जबकि अगले वाक्य का ‘बदला चुकाएगा’ दंडात्मक संदर्भ को स्वाभाविक रूप से स्पष्ट करता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। काव्यात्मक बल के लिए ‘उस पर—बाबेल पर—’ की पुनरुक्ति सुरक्षित है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
