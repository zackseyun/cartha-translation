  text: Together they roar like young lions[a]; they growl like lion cubs.
translation:
  language: hi
  text: वे सब मिलकर जवान सिंहों के समान दहाड़ते हैं; सिंह के शावकों की तरह गुर्राते[a] हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कर्कश आवाज़ निकालते।” इब्रानी क्रिया किसी पशु की कठोर ध्वनि को सूचित कर सकती है; सिंहों की दहाड़ के साथ इस समानांतर चित्र में “गुर्राते” सबसे स्वाभाविक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְדָּו
  choice: सब मिलकर
  rationale: यह सामूहिक और एक साथ किए गए व्यवहार को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: כְּפִרִים
  choice: जवान सिंह
  rationale: यह शब्द ऐसे युवा सिंहों को सूचित करता है जो शावक अवस्था से आगे बढ़ चुके हैं और दहाड़ सकते हैं; इससे अगली पंक्ति के शावकों से काव्यात्मक भेद भी बना रहता है।
- source_word: יִשְׁאָגוּ
  choice: दहाड़ते हैं
  rationale: यह सिंह की गर्जना के लिए सामान्य और सीधा हिन्दी क्रियापद है; मूल से अतिरिक्त तीव्रता नहीं जोड़ी गई।
- source_word: נָעֲרוּ
  choice: गुर्राते हैं
  rationale: पशु-ध्वनि के इस संदर्भ में क्रिया कठोर आवाज़ निकालने का बोध देती है। ‘गुर्राना’ सिंह-शावकों के लिए स्वाभाविक है और समानांतर ‘दहाड़ना’ से अलग ध्वनि बनाए रखता है।
- source_word: גֹרֵי אֲרָיוֹת
  choice: सिंह के शावक
  rationale: यह सिंहों की संतानों के लिए स्पष्ट, प्रचलित और आधुनिक हिन्दी पद है तथा כְּפִרִים से आंशिक अर्थ-साम्य के साथ उसका भेद सुरक्षित रखता है।
