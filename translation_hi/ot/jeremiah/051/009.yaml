source:
  edition: WLC
  text: רפאנו אֶת בָּבֶל֙ וְ/לֹ֣א נִרְפָּ֔תָה עִזְב֕וּ/הָ וְ/נֵלֵ֖ךְ אִ֣ישׁ לְ/אַרְצ֑/וֹ כִּֽי נָגַ֤ע אֶל הַ/שָּׁמַ֨יִם֙ מִשְׁפָּטָ֔/הּ וְ/נִשָּׂ֖א עַד שְׁחָקִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/009.yaml
  text: We tried to heal Babylon[a], but she was not healed. Leave her, and let each one go to his own land[c][b], for her judgment has reached to heaven and has been lifted up to the skies.
translation:
  language: hi
  text: हमने बाबेल को चंगा करने की कोशिश की, पर वह चंगी न हुई। उसे छोड़ दो, और आओ, हम सब अपने-अपने देश चलें; क्योंकि उसका न्याय[a] आकाश तक पहुँच गया है और ऊँचे बादलों[b] तक उठ गया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘न्याय’ का अर्थ यहाँ ‘न्यायिक निर्णय’ या ‘दंड’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: मूल इब्रानी शब्द ऊँचे बादलों या आकाश की ऊँचाइयों को दर्शाता है।
    reason: cultural_note
lexical_decisions:
- source_word: רפאנו
  choice: हमने ... चंगा करने की कोशिश की
  rationale: यह क़ाल पूर्ण, प्रथम पुरुष बहुवचन है। अगले वाक्यांश ‘वह चंगी न हुई’ से स्पष्ट है कि चंगा करने का प्रयत्न सफल नहीं हुआ; इसलिए हिन्दी में प्रयत्न का भाव व्यक्त किया गया है।
- source_word: בָּבֶל
  choice: बाबेल
  rationale: पुराने नियम में इस स्थान-नाम का प्रचलित हिन्दी रूप ‘बाबेल’ है।
- source_word: נִרְפָּתָה
  choice: वह चंगी न हुई
  rationale: निफ़अल पूर्ण, स्त्रीलिंग एकवचन का निष्क्रिय भाव रखते हुए पहले खंड के ‘चंगा करने’ से शब्दगत समानता बनाए रखी गई है।
- source_word: עִזְבוּהָ
  choice: उसे छोड़ दो
  rationale: बहुवचन आज्ञार्थ और स्त्रीलिंग कर्म-प्रत्यय को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וְנֵלֵךְ
  choice: और आओ, हम ... लौट चलें
  rationale: प्रथम पुरुष बहुवचन कोहोर्टेटिव के आग्रहसूचक भाव को ‘आओ ... चलें’ से स्पष्ट किया गया है। संदर्भ में अपने-अपने देश जाने के कारण ‘लौट’ स्वाभाविक हिन्दी है।
- source_word: אִישׁ לְאַרְצוֹ
  choice: हममें से हर एक अपने देश
  rationale: शाब्दिक अर्थ ‘हर पुरुष अपने देश को’ है। ‘हर एक अपने देश’ इसके वितरणात्मक एकवचन भाव को बनाए रखता है और हिन्दी में स्वाभाविक है।
- source_word: מִשְׁפָּטָהּ
  choice: उसका न्याय
  rationale: מִשְׁפָּט न्याय, न्यायिक निर्णय या दंड का बोध करा सकता है। ‘न्याय’ मूल की व्यापक न्यायिक अर्थ-सीमा को खुला रखता है।
- source_word: נָגַע אֶל הַשָּׁמַיִם
  choice: आकाश तक पहुँच गया है
  rationale: נגע עם אֶל के पहुँचने या छूने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְנִשָּׂא עַד שְׁחָקִים
  choice: और ऊँचे बादलों तक उठ गया है
  rationale: निफ़अल पूर्ण का उठने/ऊँचा होने का भाव और שְׁחָקִים की बादलों अथवा ऊपरी आकाश की छवि दोनों सुरक्षित हैं।
theological_decisions:
- issue: बाबेल के ‘न्याय’ का आकाश तक पहुँचना
  choice: ‘उसका न्याय’ कहकर न्यायिक अर्थ और काव्यात्मक अस्पष्टता को बनाए रखा गया है।
  alternative: ‘उसका दंड’ या ‘उसके विरुद्ध न्याय-दंड’
  rationale: संदर्भ बाबेल के आसन्न विनाश का है, पर מִשְׁפָּט केवल दंड ही नहीं, न्यायिक निर्णय या न्याय भी व्यक्त कर सकता है। इसलिए अनुवाद किसी एक संकीर्ण व्याख्या को अनिवार्य नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। बाबेल को स्त्रीलिंग मानने वाली इब्रानी व्याकरणिक छवि ‘वह चंगी न हुई’ में सुरक्षित है। ‘आओ ... चलें’ कोहोर्टेटिव आग्रह को बनाए रखता है, और दोनों काव्यात्मक ऊर्ध्व छवियाँ—आकाश तक पहुँचना तथा ऊँचे बादलों तक उठना—अलग-अलग रखी गई हैं।
