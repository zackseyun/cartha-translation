  edition: WLC
  text: הוֹצִ֥יא יְהוָ֖ה אֶת צִדְקֹתֵ֑י/נוּ בֹּ֚אוּ וּ/נְסַפְּרָ֣ה בְ/צִיּ֔וֹן אֶֽת מַעֲשֵׂ֖ה יְהוָ֥ה אֱלֹהֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/010.yaml
  text: Yahweh has brought forth our vindication. Come[a], and let us recount in Zion the work of Yahweh our God.
translation:
  language: hi
  text: याहवे ने हमारे पक्ष का न्याय प्रकट किया है[a]। आओ, हम सिय्योन में याहवे, हमारे परमेश्वर, के कार्य का वर्णन करें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हमारी धार्मिकताएँ,” “धार्मिकता के हमारे काम,” अथवा “हमारा न्याय।” इब्रानी बहुवचन धार्मिकता या न्याय के कामों को, अथवा किसी पक्ष के सार्वजनिक न्याय-समर्थन को व्यक्त कर सकता है।
    reason: צִדְקֹתֵינוּ का बहुवचन धार्मिकता/न्याय के कार्यों तथा सार्वजनिक न्याय-समर्थन या न्याय-सिद्धि, दोनों अर्थों की संभावना रखता है।
lexical_decisions:
- source_word: הוֹצִיא
  choice: प्रकट किया है / सिद्ध किया है
  rationale: יצא के हिफ़ील रूप का मूल अर्थ ‘बाहर लाना’ है। यहाँ आशय यह है कि याहवे ने अपनी प्रजा के पक्ष की न्यायपूर्णता को सार्वजनिक रूप से सामने ला दिया; स्वाभाविक हिन्दी में ‘न्यायपूर्ण सिद्ध किया है’ यही भाव व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत इब्रानी नाम को किसी उपाधि से बदलने के बजाय देवनागरी लिप्यंतरण में रखा गया है।
- source_word: צִדְקֹתֵינוּ
  choice: हमारे पक्ष को न्यायपूर्ण
  rationale: צדקה का बहुवचन धार्मिक अथवा न्यायपूर्ण कामों, न्याय, या किसी पक्ष के सार्वजनिक समर्थन और दोषमुक्ति को दर्शा सकता है। बाबेल के न्याय और परमेश्वर की प्रजा के छुटकारे के संदर्भ में मुख्य पाठ सार्वजनिक रूप से पक्ष न्यायपूर्ण सिद्ध किए जाने का भाव रखता है; अन्य संभावनाएँ पाद-टिप्पणी में सुरक्षित हैं।
- source_word: בֹּאוּ
  choice: आओ
  rationale: बहुवचन आज्ञार्थक सामूहिक निमंत्रण देता है; ‘आओ’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: וּנְסַפְּרָה
  choice: हम ... वर्णन करें
  rationale: प्रथम पुरुष बहुवचन कोहोर्टेटिव इच्छा और आह्वान व्यक्त करता है; ‘हम ... वर्णन करें’ उस भाव को बनाए रखता है।
- source_word: בְצִיּוֹן
  choice: सिय्योन में
  rationale: ב यहाँ स्थानवाचक है; ‘में’ सीधा और स्वाभाविक अनुवाद है।
- source_word: מַעֲשֵׂה
  choice: किए हुए काम
  rationale: एकवचन מַעֲשֶׂה कार्य या किए गए काम को दर्शाता है। ‘किए हुए काम’ हिन्दी में कर्ता के साथ स्वाभाविक संबंध बनाता है और अर्थ की व्यापकता बनाए रखता है।
- source_word: אֱלֹהֵינוּ
  choice: अपने परमेश्वर
  rationale: प्रथम पुरुष बहुवचन संबंध को स्वाभाविक हिन्दी में ‘अपने परमेश्वर’ से व्यक्त किया गया है; साथ आया ‘याहवे’ बताता है कि यही हमारे परमेश्वर का नाम है।
theological_decisions:
- issue: צִדְקֹתֵינוּ का संदर्भगत अर्थ
  choice: हमारे पक्ष को न्यायपूर्ण सिद्ध किया है
  alternative: हमारे धार्मिक/न्यायपूर्ण कामों को प्रकट किया है; हमें न्याय दिलाया है
  rationale: संदर्भ याहवे द्वारा बाबेल का न्याय और अपनी प्रजा के पक्ष में सार्वजनिक कार्रवाई करने का है। मुख्य अनुवाद इस न्यायिक-संबंधपरक अर्थ को व्यक्त करता है और इस आशय से बचता है कि इस्राएल अपनी नैतिक उपलब्धियों का दावा कर रहा है। फिर भी इब्रानी बहुवचन की वास्तविक शब्दार्थगत संभावनाएँ पाद-टिप्पणी में दी गई हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामूहिक उद्घोषणा के अनुकूल रखी गई है। ‘याहवे’ नाम को सुरक्षित रखा गया है। हिन्दी वाक्य-विन्यास को स्वाभाविक बनाने के लिए ‘याहवे हमारे परमेश्वर’ को ‘अपने परमेश्वर याहवे’ के रूप में रखा गया है।
