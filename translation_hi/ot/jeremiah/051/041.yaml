base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/041.yaml
  text: How Sheshak has been captured[c][b][a], and the praise of the whole earth seized! How Babylon has become a desolation among the nations!
translation:
  language: hi
  text: कैसे शेशक[a] को पकड़ लिया गया, और सारी पृथ्वी की प्रशंसा[b] भी कैसे छीन ली गई! बाबेल राष्ट्रों के बीच कैसी उजाड़[c] बन गई है!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘शेशक’ को व्यापक रूप से बाबेल का सांकेतिक नाम माना जाता है।
    reason: alternative_reading
  - marker: b
    text: या ‘सारी पृथ्वी का गौरव’ अथवा ‘सारी पृथ्वी का घमंड’।
    reason: lexical_alternative
  - marker: c
    text: या ‘भय का कारण’; इब्रानी शब्द में उजाड़ होने और उस उजाड़ को देखकर उत्पन्न भय या स्तब्धता—दोनों भाव हो सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ
  choice: कैसे / कैसी
  rationale: यह ढंग पूछने वाला प्रश्न नहीं, बल्कि विस्मय और विलाप प्रकट करने वाला उद्गार है। हिन्दी में ‘कैसे/कैसी’ उसी आलंकारिक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: נִלְכְּדָה
  choice: पकड़ ली गई
  rationale: निफ़अल पूर्ण रूप किसी नगर के जीतकर कब्ज़े में लिए जाने को बताता है। स्त्रीलिंग क्रिया शेशक को नगरी के रूप में प्रस्तुत करने वाले इब्रानी रूप के अनुरूप है।
- source_word: שֵׁשַׁךְ
  choice: शेशक
  rationale: मूल पाठ के नाम को लिप्यंतरित रखा गया है; उसे मुख्य पाठ में सीधे ‘बाबेल’ से बदलने के बजाय उसकी व्यापक रूप से स्वीकृत पहचान पादटिप्पणी में दी गई है।
- source_word: וַתִּתָּפֵשׂ
  choice: अधिकार में कर ली गई
  rationale: תפשׂ का अर्थ पकड़ना, धर लेना या कब्ज़े में करना है। यह चयन पहले क्रियापद के समानांतर विजय और अधिग्रहण का भाव स्पष्ट करता है।
- source_word: תְּהִלַּת כָּל הָאָרֶץ
  choice: सारी पृथ्वी की प्रशंसा
  rationale: תהלה का सीधा अर्थ ‘प्रशंसा’ है और यहाँ उससे वह भी अभिप्रेत हो सकता है जिसकी सर्वत्र प्रशंसा होती है। मुख्य पाठ मूल रूपक को बनाए रखता है और संभावित अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: הָיְתָה לְשַׁמָּה
  choice: उजाड़ हो गई है
  rationale: שַׁמָּה विनाश और उससे उत्पन्न भय या विस्मय—दोनों भाव समेट सकता है। ‘उजाड़’ यहाँ नष्ट अवस्था को स्वाभाविक हिन्दी में सामने रखता है, जबकि दूसरा भाव पादटिप्पणी में सुरक्षित है।
- source_word: בַּגּוֹיִם
  choice: राष्ट्रों के बीच
  rationale: यहाँ גוים संसार के विभिन्न राष्ट्रों या लोगों को दर्शाता है; ‘राष्ट्रों के बीच’ किसी बाद की धार्मिक पारिभाषिकता को जोड़े बिना अर्थ देता है।
