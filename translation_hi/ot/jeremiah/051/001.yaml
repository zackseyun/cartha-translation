id: JER.51.1
reference: Jeremiah 51:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִי֙ מֵעִ֣יר עַל בָּבֶ֔ל וְ/אֶל יֹשְׁבֵ֖י לֵ֣ב קָמָ֑י ר֖וּחַ מַשְׁחִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/001.yaml
  text: 'Thus says Yahweh: Behold[a], I am stirring up against Babylon, and against the inhabitants of Leb-kamai[b], a destroying wind.'
translation:
  language: hi
  text: 'यहोवा यों कहता है:

    “देखो, मैं बाबेल और लेब-कमाई[a] के निवासियों के विरुद्ध एक विनाशकारी हवा[b] उठा रहा हूँ।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: लेब-कमाई संभवतः कसदिया या बाबेल के लिए प्रयुक्त एक कूट-नाम (अतबश कूट) है; इस पदबंध का अधिक शाब्दिक अर्थ “मेरे विरोधियों का हृदय” भी हो सकता है।
    reason: alternative_reading
  - marker: b
    text: या “विनाशकारी आत्मा”; इब्रानी शब्द का अर्थ “हवा,” “आत्मा” या “श्वास” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के विशिष्ट वाचा-नाम का प्रचलित लिप्यंतरण; इसे किसी उपाधि से बदलने के बजाय नाम के रूप में सुरक्षित रखा गया है।
- source_word: הִנְנִי
  choice: देखो, मैं
  rationale: यह ध्यान आकर्षित करने वाली भविष्यसूचक घोषणा है और निकट भविष्य में होने वाली परमेश्वर की कार्रवाई पर बल देती है।
- source_word: מֵעִיר
  choice: उठा रहा हूँ
  rationale: हिफ़ील कृदंत किसी शक्ति या साधन को सक्रिय करने अथवा उकसाने का भाव देता है; हवा के साथ ‘उठाना’ स्वाभाविक हिन्दी है।
- source_word: בָּבֶל
  choice: बाबेल
  rationale: इब्रानी स्थान-नाम का हिन्दी बाइबलीय लिप्यंतरण।
- source_word: יֹשְׁבֵי
  choice: निवासियों
  rationale: किसी स्थान में रहने वाले लोगों के सामूहिक अर्थ को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לֵב קָמָי
  choice: लेब-कमाई
  rationale: यह संभवतः कसदिया/बाबेल के लिए अतबश कूट-नाम है। मूल पाठ की कूटात्मक विशेषता बनाए रखने के लिए लिप्यंतरण किया गया है और शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: רוּחַ
  choice: हवा
  rationale: न्याय के इस प्रसंग में विनाश के लिए उठाई गई हवा का चित्र सबसे स्वाभाविक है; ‘आत्मा’ की वास्तविक शाब्दिक संभावना पादटिप्पणी में सुरक्षित है।
- source_word: מַשְׁחִית
  choice: विनाशकारी
  rationale: यह कृदंत हवा को उसके विनाश करने वाले प्रभाव से विशेषित करता है; ‘विनाशकारी’ हिन्दी में सक्रिय परिणाम को स्पष्ट और सहज रूप से व्यक्त करता है।
theological_decisions:
- issue: क्या רוּחַ को प्राकृतिक ‘हवा’ या अधिक व्यक्तिगत/आत्मिक ‘आत्मा’ के अर्थ में प्रस्तुत किया जाए
  choice: हवा
  alternative: आत्मा
  rationale: बाबेल के विरुद्ध न्याय का साधन उठाए जाने के तत्काल प्रसंग में हवा का बिंब अधिक स्वाभाविक है, पर इब्रानी शब्द की आत्मा/श्वास संबंधी अर्थ-सीमा को पादटिप्पणी में बनाए रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘यों कहता है’ भविष्यसूचक उद्घोषणा का औपचारिक स्वर बनाए रखता है। कूट-नाम को पाठ में सुरक्षित रखते हुए उसकी व्याख्या पादटिप्पणी में दी गई है।
