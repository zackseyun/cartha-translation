source:
  edition: WLC
  text: כִּֽי תַעֲלֶ֤ה בָבֶל֙ הַ/שָּׁמַ֔יִם וְ/כִ֥י תְבַצֵּ֖ר מְר֣וֹם עֻזָּ֑/הּ מֵ/אִתִּ֗/י יָבֹ֧אוּ שֹׁדְדִ֛ים לָ֖/הּ נְאֻם יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/053.yaml
  text: Though Babylon should ascend to the heavens[a], and though she should fortify her lofty stronghold, destroyers will come to her from me[b], declares Yahweh.
translation:
  language: hi
  text: चाहे बाबेल आकाश तक चढ़ जाए, और चाहे वह अपने बल की ऊँची जगह को किलेबंद कर ले[a], तौभी मेरी ओर से उसके विरुद्ध विनाशक[b] आएँगे—यह याहवे की घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘उसके बल की ऊँचाई।’
    reason: lexical_alternative
  - marker: b
    text: या ‘लुटेरे।’ इब्रानी शब्द लूटकर उजाड़ने वालों और विनाश करने वालों—दोनों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי ... וְכִי
  choice: चाहे ... और चाहे
  rationale: 'दोनों अव्ययों को प्रसंगानुसार रियायती अर्थ में लिया गया है: बाबेल कितनी भी ऊँचाई और सुरक्षा प्राप्त कर ले, न्याय से नहीं बचेगा।'
- source_word: תַעֲלֶה ... הַשָּׁמַיִם
  choice: आकाश तक चढ़ जाए
  rationale: यह बाबेल के अत्यधिक ऊँचा उठने की अतिशयोक्तिपूर्ण छवि को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: תְבַצֵּר
  choice: दृढ़ कर ले
  rationale: पिएल रूप किसी स्थान को किलेबंद, सुरक्षित या दुर्गम बनाने का भाव देता है; ‘दृढ़ कर ले’ सैन्य-सुरक्षा का अर्थ सहज ढंग से व्यक्त करता है।
- source_word: מְרוֹם עֻזָּהּ
  choice: अपने सामर्थ्य के ऊँचे गढ़
  rationale: शाब्दिक बनावट ‘उसके सामर्थ्य की ऊँचाई’ है। प्रसंग में इसे ऊँचे सुरक्षित गढ़ के रूप में व्यक्त किया गया है, जबकि पादटिप्पणी मूल रूपक को सुरक्षित रखती है।
- source_word: מֵאִתִּי
  choice: मेरी ओर से
  rationale: यह विनाशकों के स्रोत और याहवे द्वारा भेजे जाने—दोनों निहितार्थों को स्वाभाविक हिन्दी में खुला रखता है।
- source_word: שֹׁדְדִים
  choice: विनाशक
  rationale: यह सहभागी संज्ञा उजाड़ने या लूटने वालों को सूचित कर सकती है। मुख्य पाठ में व्यापक ‘विनाशक’ और पादटिप्पणी में ‘लुटेरे’ दिया गया है।
- source_word: לָהּ
  choice: उसके विरुद्ध
  rationale: शाब्दिक अर्थ ‘उसके पास/उसके लिए’ हो सकता है, पर विनाशकों के आने के इस प्रसंग में लक्ष्य के प्रति शत्रुतापूर्ण भाव हिन्दी में ‘उसके विरुद्ध’ से स्पष्ट होता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरीय वाचा-नाम सीधे प्रयुक्त है। ‘याहवे’ उसे उपाधि में बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक-भविष्यद्वाणी के अनुकूल रखी गई है। बाबेल के लिए मूल की स्त्रीलिंगी प्रतिमा हिन्दी में स्वाभाविक न होने के कारण सर्वनाम ‘वह/उसके’ प्रयुक्त हैं। ‘तौभी’ दोनों रियायती उपवाक्यों के विपरीत आने वाले निश्चित न्याय पर बल देता है।
