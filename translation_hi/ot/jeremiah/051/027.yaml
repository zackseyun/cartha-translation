base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/027.yaml
  text: Raise a banner in the land[a]; blow a trumpet among the nations. Consecrate nations against her; summon against her the kingdoms of Ararat, Minni, and Ashkenaz. Appoint a marshal against her[d][c][b]; bring up horses like bristling locusts.
translation:
  language: hi
  text: देश में झंडा खड़ा करो[a]; राष्ट्रों के बीच नरसिंगा फूँको। उसके विरुद्ध राष्ट्रों को पवित्र ठहराओ[b]; उसके विरुद्ध अरारात, मिन्नी और अश्कनाज़ के राज्यों को बुलाओ। उसके विरुद्ध एक सेनाधिकारी नियुक्त करो[c]; घोड़ों को रोएँदार टिड्डियों के समान आगे बढ़ाओ[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “देश में युद्ध-ध्वज ऊँचा करो।”
    reason: lexical_alternative
  - marker: b
    text: “पवित्र ठहराओ” यहाँ राष्ट्रों को युद्ध के लिए अलग करने और तैयार करने की भाषा है; इसमें पवित्र युद्ध का भाव हो सकता है।
    reason: cultural_note
  - marker: c
    text: “सेनाधिकारी” एक दुर्लभ इब्रानी पदनाम का अनुवाद है; इसके अर्थ में सेनापति, उच्च अधिकारी या सैनिकों की भरती करने वाला अधिकारी सम्मिलित हो सकता है।
    reason: lexical_alternative
  - marker: d
    text: या “झबरीली टिड्डियों के समान” अथवा “खुरदरी टिड्डियों के समान।” इब्रानी अभिव्यक्ति दुर्लभ और सजीव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ נֵס
  choice: झंडा खड़ा करो
  rationale: נֵס ऊँचा किया जाने वाला सार्वजनिक संकेत, ध्वज या युद्ध-मानक है। ‘झंडा खड़ा करो’ आधुनिक हिन्दी में स्वाभाविक है और सैन्य आह्वान का भाव बनाए रखता है।
- source_word: בָּאָרֶץ
  choice: देश में
  rationale: אֶרֶץ का अर्थ ‘धरती’ या ‘देश/भूमि’ हो सकता है; यहाँ सैन्य जुटान के संदर्भ में ‘देश में’ अधिक उपयुक्त है।
- source_word: תִּקְעוּ שׁוֹפָר
  choice: नरसिंगा फूँको
  rationale: שׁוֹפָר चेतावनी या सभा बुलाने के लिए फूँका जाने वाला सींग है। ‘नरसिंगा’ उसके वाद्य और संकेत—दोनों पक्षों को स्पष्ट करता है।
- source_word: בַּגּוֹיִם
  choice: राष्ट्रों के बीच
  rationale: גּוֹיִם यहाँ युद्ध के लिए जुटाए जा रहे विदेशी जनों या राज्यों को दर्शाता है।
- source_word: קַדְּשׁוּ עָלֶיהָ גּוֹיִם
  choice: उसके विरुद्ध राष्ट्रों को पवित्र ठहराओ
  rationale: קדשׁ का मूल भाव पवित्र करना या किसी उद्देश्य के लिए अलग करना है। युद्ध-संदर्भ में यह युद्ध के लिए धार्मिक रीति से तैयार करने का संकेत दे सकता है; अनुवाद उस धार्मिक तनाव को खुला रखता है।
- source_word: הַשְׁמִיעוּ עָלֶיהָ
  choice: उसके विरुद्ध ... को बुलाओ
  rationale: שמע का हिफ़ील रूप मूलतः ‘सुनवाना/घोषित करना’ है; यहाँ नामित राज्यों को सैन्य अभियान के लिए बुलाने की आज्ञा है।
- source_word: מַמְלְכוֹת אֲרָרַט מִנִּי וְאַשְׁכְּנָז
  choice: अरारात, मिन्नी और अश्कनज़ के राज्य
  rationale: ये प्राचीन क्षेत्रों के नाम हैं; उन्हें हिन्दी ध्वन्यंतरण में रखा गया है और संबंधसूचक रचना को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: פִּקְדוּ עָלֶיהָ טִפְסָר
  choice: उसके विरुद्ध एक सेनाधिकारी नियुक्त करो
  rationale: טִפְסָר एक दुर्लभ उधार लिया हुआ पदनाम है, जो किसी उच्च अधिकारी, विशेषतः सैन्य अधिकारी, को दर्शाता है। ‘सेनाधिकारी’ संदर्भ के अनुकूल रहते हुए पद की सटीक श्रेणी को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: הַעֲלוּ סוּס
  choice: घोड़ों को ... चढ़ा लाओ
  rationale: עלה के हिफ़ील रूप का अर्थ यहाँ सैन्य बल को आगे या ऊपर ले आना है। सामूहिक एकवचन סוּס को हिन्दी में स्वाभाविक बहुवचन ‘घोड़ों’ से व्यक्त किया गया है।
- source_word: כְּיֶלֶק סָמָר
  choice: रोएँदार टिड्डियों के समान
  rationale: יֶלֶק एक प्रकार की टिड्डी है और סָמָר का भाव रोएँदार, खुरदरा या खड़े रोओं वाला है। यह चयन दुर्लभ और सजीव उपमा को सरल ‘झुंड’ में नहीं बदलता।
theological_decisions:
- issue: युद्ध-संदर्भ में קדשׁ का धार्मिक अर्थ
  choice: राष्ट्रों को पवित्र ठहराओ
  alternative: राष्ट्रों को युद्ध के लिए तैयार करो
  rationale: ‘तैयार करो’ अर्थ को सहज बनाता, पर मूल के पवित्र करने/अलग ठहराने वाले धार्मिक आयाम को मिटा देता। मुख्य पाठ में धार्मिक भाषा रखकर पादटिप्पणी में युद्ध-संदर्भ स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और घोषणात्मक रखी गई है। छोटे आज्ञार्थक वाक्य मूल की सैन्य तात्कालिकता बनाए रखते हैं। ‘पवित्र ठहराओ’ और ‘रोएँदार टिड्डियाँ’ जैसी असामान्य अभिव्यक्तियाँ जानबूझकर सुरक्षित रखी गई हैं, क्योंकि वे मूल पाठ की धार्मिक तथा काव्यात्मक तीक्ष्णता का भाग हैं।
