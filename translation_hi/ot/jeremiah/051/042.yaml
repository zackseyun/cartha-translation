  text: עָלָ֥ה עַל בָּבֶ֖ל הַ/יָּ֑ם בַּ/הֲמ֥וֹן גַּלָּ֖י/ו נִכְסָֽתָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/042.yaml
  text: The sea has come up against Babylon[b][a]; she is covered with the multitude of its waves.
translation:
  language: hi
  text: समुद्र[a] बाबेल पर चढ़ आया है; वह उसकी असंख्य[b] लहरों से ढक गई है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “समुद्र” बाबेल पर उमड़ आने वाली प्रबल शक्ति की रूपकात्मक छवि है।
    reason: cultural_note
  - marker: b
    text: या “उसकी लहरों के कोलाहल से” अथवा “उसकी लहरों की गर्जना से।” हिब्रू शब्द बड़ी संख्या और भारी शोर—दोनों का अर्थ दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה
  choice: चढ़ आया है
  rationale: काल पूर्ण हो चुकी, पर वर्तमान में सजीव दिखाई गई गति को व्यक्त करता है; עלה के ‘ऊपर चढ़ना/आना’ भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: עַל
  choice: पर
  rationale: विरोधी और अभिभूत करने वाली गति के संदर्भ में ‘पर चढ़ आया’ आक्रमण का भाव स्वाभाविक रूप से देता है।
- source_word: בָּבֶל
  choice: बाबेल
  rationale: हिब्रू स्थान-नाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: הַיָּם
  choice: समुद्र
  rationale: निश्चित संज्ञा है और यहाँ प्रबल आक्रमणकारी शक्ति का रूपक है; मुख्य पाठ में मूल समुद्र-चित्र को सुरक्षित रखा गया है।
- source_word: בַּהֲמוֹן
  choice: भीड़ से
  rationale: הָמוֹן बहुलता, विशाल समूह, कोलाहल या गर्जना व्यक्त कर सकता है। ‘लहरों की भीड़’ इस प्रसंग में उमड़ती हुई प्रचुरता को दर्शाती और मूल अस्पष्टता के निकट रहती है।
- source_word: גַּלָּיו
  choice: उसकी लहरों
  rationale: पुल्लिंग एकवचन प्रत्यय समुद्र की ओर संकेत करता है; हिन्दी में ‘उसकी’ स्वाभाविक संबंधसूचक रूप है।
- source_word: נִכְסָתָה
  choice: वह ढक गई है
  rationale: निफ़अल पूर्ण स्त्रीलिंग एकवचन बाबेल से मेल खाता है और उसके पूरी तरह आच्छादित हो जाने का भाव देता है।
theological_decisions:
- issue: समुद्र की छवि की पहचान
  choice: मुख्य पाठ में ‘समुद्र’ रूपक को ज्यों का त्यों रखा गया
  alternative: इसे सीधे आक्रमणकारी सेना या राष्ट्रों के रूप में स्पष्ट करना
  rationale: हिब्रू पद स्वयं व्याख्या नहीं करता; रूपक को बदलने से काव्यात्मक अस्पष्टता और न्याय की प्रबल छवि अनावश्यक रूप से सीमित हो जाती।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और काव्यात्मक भाषा रखी गई है। ‘चढ़ आया’ आक्रमण की गति को, और ‘ढक गई’ बाबेल के स्त्रीलिंग नगर-रूप को स्वाभाविक ढंग से व्यक्त करता है।
