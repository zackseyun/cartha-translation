  text: בְּ/חֻמָּ֞/ם אָשִׁ֣ית אֶת מִשְׁתֵּי/הֶ֗ם וְ/הִשְׁכַּרְתִּי/ם֙ לְמַ֣עַן יַעֲלֹ֔זוּ וְ/יָשְׁנ֥וּ שְׁנַת עוֹלָ֖ם וְ/לֹ֣א יָקִ֑יצוּ נְאֻ֖ם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/039.yaml
  text: When they are heated, I will set out their drink and make them drunk, so that they may exult, then sleep an everlasting sleep and not wake up, declares Yahweh.
translation:
  language: hi
  text: जब वे जोश में हों, तब मैं उनके सामने उनका पेय[a] रखूँगा और उन्हें मतवाला कर दूँगा, ताकि वे उल्लसित हों और सदा की नींद[b] सो जाएँ और न जागें—यह याहवे की घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनकी दावत” अथवा “उनका मदिरा-भोज”; इब्रानी शब्द पेय के साथ-साथ मदिरापान वाली दावत भी दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: “सदा की नींद” न्याय के प्रसंग में अपरिवर्तनीय मृत्यु का इब्रानी रूपक है; शाब्दिक रूप में, “स्थायित्व की नींद।”
    reason: cultural_note
lexical_decisions:
- source_word: בְּחֻמָּם
  choice: जब वे उत्तेजित हों
  rationale: शाब्दिक अर्थ ‘उनकी गर्मी में’ है; प्रसंग में यह आवेश, उत्तेजना या मदिरापान से चढ़े जोश की ओर संकेत कर सकता है। ‘उत्तेजित’ इस संभावित अर्थ-व्याप्ति को अनावश्यक रूप से सीमित नहीं करता।
- source_word: אָשִׁית אֶת מִשְׁתֵּיהֶם
  choice: मैं उनके सामने उनका पेय रखूँगा
  rationale: שׂים का मूल भाव ‘रखना’ है, और מִשְׁתֶּה पेय अथवा मदिरापान वाली दावत को दर्शा सकता है। यह अनुवाद अगले खंड में मतवाला किए जाने से स्वाभाविक रूप से जुड़ता है और ‘मदिरा’ को मूल से अधिक स्पष्ट नहीं करता।
- source_word: וְהִשְׁכַּרְתִּים
  choice: और उन्हें मतवाला कर दूँगा
  rationale: हिफ़ील रूप का कारणवाचक अर्थ, अर्थात उन्हें नशे की दशा में पहुँचाना, स्पष्ट और गरिमापूर्ण हिन्दी में व्यक्त होता है।
- source_word: יַעֲלֹזוּ
  choice: वे उल्लसित हों
  rationale: क्रिया हर्षोल्लास या उमंग व्यक्त करती है। ‘उल्लसित’ न्याय के प्रसंग में निहित विडंबना बनाए रखता है, जबकि ‘मौज मनाएँ’ अपेक्षाकृत बोलचाल और अधिक व्याख्यात्मक होता।
- source_word: וְיָשְׁנוּ שְׁנַת עוֹלָם
  choice: फिर सदा की नींद सो जाएँ
  rationale: ‘सदा की नींद’ इब्रानी रूपक को बनाए रखता है। ‘फिर’ जुड़े हुए परिणामों की प्रगति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְלֹא יָקִיצוּ
  choice: और न जागें
  rationale: नींद के रूपक को सीधे बनाए रखता है; स्थायित्व पहले ही ‘सदा की’ से व्यक्त है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: मानक नबी-सूत्र का गंभीर स्वर रखते हुए יהוה को उसके व्यक्तिगत नाम ‘याहवे’ से प्रस्तुत किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम प्रत्यक्ष रूप से है; ‘याहवे’ उसे किसी उपाधि से बदलने के बजाय नाम के रूप में बनाए रखता है।
- issue: שְׁנַת עוֹלָם का न्याय-संबंधी आशय
  choice: सदा की नींद
  alternative: कभी न टूटने वाली नींद / मृत्यु
  rationale: पाठ के रूपक को ‘मृत्यु’ कहकर सपाट नहीं किया गया। अगला वाक्यांश ‘और न जागें’ उसके अपरिवर्तनीय परिणाम को स्पष्ट करता है, बिना परलोक-संबंधी अतिरिक्त सिद्धांत जोड़ने के।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है—सरल, गंभीर और नबी-साहित्य के अनुरूप। ‘उत्तेजित’, ‘मतवाला’ और ‘उल्लसित’ चुने गए हैं ताकि आवेश, मदिरापान और विडंबनापूर्ण हर्ष के संबंध को रखते हुए किसी एक संभावित अर्थ को आवश्यकता से अधिक निश्चित न किया जाए।
