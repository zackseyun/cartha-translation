source:
  edition: WLC
  text: כִּֽי שֹׁדֵ֤ד יְהוָה֙ אֶת בָּבֶ֔ל וְ/אִבַּ֥ד מִמֶּ֖/נָּה ק֣וֹל גָּד֑וֹל וְ/הָמ֤וּ גַלֵּי/הֶם֙ כְּ/מַ֣יִם רַבִּ֔ים נִתַּ֥ן שְׁא֖וֹן קוֹלָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/055.yaml
  text: For Yahweh is devastating Babylon and destroying from her the great sound[a]. Their waves roar like many waters[b]; the noise of their voice is given.
translation:
  language: hi
  text: क्योंकि याहवे बाबेल को उजाड़ रहे हैं और उसमें से उसका भारी कोलाहल मिटा रहे हैं। उनकी लहरें[a] प्रचुर जल के समान गरजती हैं; उनकी आवाज़ का शोर उठ रहा है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उनकी’ इब्रानी में पुल्लिंग बहुवचन है; इससे सम्भवतः बाबेल पर चढ़ आने वालों का संकेत मिलता है। क्रिया का अनुवाद ‘उनकी लहरें प्रचुर जल के समान उमड़ती हैं’ भी हो सकता है।
    reason: referential_and_lexical_ambiguity
  - marker: b
    text: शाब्दिक रूप से, ‘उनकी आवाज़ का शोर दिया जाता है’; यह ऊँची ध्वनि उत्पन्न होने या उठने का इब्रानी मुहावरा है।
    reason: idiomatic_alternative
lexical_decisions:
- source_word: שֹׁדֵד
  choice: उजाड़ रहे हैं
  rationale: इब्रानी कृदन्त चल रही या आसन्न विनाशकारी कार्रवाई दिखाता है। ‘उजाड़ रहे हैं’ नगर पर न्याय और क्रिया की निरंतरता, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चतुर्वर्णी व्यक्तिगत ईश्वरीय नाम को उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में रखा गया है।
- source_word: וְאִבַּד
  choice: और … मिटा रहे हैं
  rationale: पूर्ववर्ती कृदन्त के समानांतर इसे चल रही कार्रवाई के रूप में व्यक्त किया गया है; यहाँ बाबेल के कोलाहल का अंत कर देना आशय है।
- source_word: מִמֶּנָּה
  choice: उसमें से
  rationale: स्रोत में स्त्रीलिंग प्रत्यय बाबेल को सूचित करता है। हिन्दी में नगर के लिए ‘उसमें से’ स्वाभाविक है, जबकि ‘उस स्त्री में से’ जैसी कृत्रिम व्यक्तिकरण-भाषा से बचता है।
- source_word: קוֹל גָּדוֹל
  choice: उसका भारी कोलाहल
  rationale: קוֹל ध्वनि या आवाज़ और גָּדוֹל उसकी प्रबलता बताता है। प्रसंग में ‘भारी कोलाहल’ बाबेल की ऊँची सामूहिक ध्वनि को बिना उसे केवल वाणी मानने के व्यक्त करता है।
- source_word: וְהָמוּ
  choice: गरजती हैं
  rationale: क्रिया ऊँची, अशांत ध्वनि या गति व्यक्त करती है; लहरों के साथ ‘गरजती हैं’ स्वाभाविक और चित्रात्मक है।
- source_word: גַלֵּיהֶם
  choice: उनकी लहरें
  rationale: मसोरेटी पाठ में तृतीय पुरुष पुल्लिंग बहुवचन प्रत्यय है। ‘उनकी’ उस अस्पष्ट संदर्भ को बनाए रखता है, सम्भवतः आक्रमणकारियों की ओर संकेत करते हुए।
- source_word: כְּמַיִם רַבִּים
  choice: अथाह जल के समान
  rationale: शाब्दिक अर्थ ‘बहुत/विशाल जल के समान’ है। ‘अथाह जल’ आधुनिक हिन्दी में विशाल, प्रचंड जलराशि का बोध कराता है और उपमा की भारी ध्वनि बनाए रखता है।
- source_word: נִתַּן
  choice: उठ रहा है
  rationale: शाब्दिक निष्क्रिय रूप ‘दिया गया’ यहाँ ध्वनि उत्पन्न या ऊँची होने का मुहावरा है। ‘उठ रहा है’ अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שְׁאוֹן קוֹלָם
  choice: उनकी आवाज़ का शोर
  rationale: שְׁאוֹן कोलाहल, गूँज या शोर और קוֹלָם उनकी आवाज़/ध्वनि है। यह चयन स्रोत की श्रव्य पुनरुक्ति और बहुवचन संदर्भ दोनों बचाता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: पद में व्यक्तिगत ईश्वरीय नाम सीधे प्रयुक्त है। ‘याहवे’ उसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं करता और प्रचलित विद्वत्तापूर्ण उच्चारण का देवनागरी रूप देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और श्रव्य काव्यात्मकता वाली रखी गई है। ‘भारी कोलाहल’, ‘गरजती हैं’ और ‘शोर उठ रहा है’ मूल की ध्वनि-प्रधान छवि को सहज हिन्दी में बनाए रखते हैं।
