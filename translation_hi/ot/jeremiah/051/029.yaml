source:
  edition: WLC
  text: וַ/תִּרְעַ֥שׁ הָ/אָ֖רֶץ וַ/תָּחֹ֑ל כִּ֣י קָ֤מָה עַל בָּבֶל֙ מַחְשְׁב֣וֹת יְהוָ֔ה לָ/שׂ֞וּם אֶת אֶ֧רֶץ בָּבֶ֛ל לְ/שַׁמָּ֖ה מֵ/אֵ֥ין יוֹשֵֽׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/029.yaml
  text: And the earth quakes and writhes, for the plans of Yahweh have arisen against Babylon, to make the land of Babylon a desolation, without inhabitant.
translation:
  language: hi
  text: और धरती काँपती और तड़पती है, क्योंकि बाबेल के विरुद्ध यहोवा की योजनाएँ उठ खड़ी हुई हैं—बाबेल के देश को ऐसा उजाड़ बनाने के लिए कि उसमें कोई निवासी न हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּרְעַשׁ
  choice: काँपती है
  rationale: רעשׁ के तीव्र हिलने या भूकंप-सदृश काँपने के भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וַתָּחֹל
  choice: तड़पती है
  rationale: חול में प्रसव-वेदना जैसी ऐंठन और व्याकुलता का शारीरिक बिंब है; ‘तड़पती’ उसे केवल ‘थरथराने’ की अपेक्षा अधिक स्पष्ट रखता है।
- source_word: הָאָרֶץ
  choice: धरती
  rationale: काँपने और तड़पने की व्यापक काव्यात्मक छवि के कारण यहाँ स्थानीय ‘देश’ के बजाय ‘धरती’ उपयुक्त है।
- source_word: קָמָה ... מַחְשְׁבוֹת
  choice: योजनाएँ उठ खड़ी हुई हैं
  rationale: מַחְשְׁבוֹת को न्याय के प्रसंग में संकल्पित ‘योजनाएँ’ और קָמָה की उठने की छवि को ‘उठ खड़ी हुई हैं’ से सुरक्षित रखा गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित देवनागरी रूप द्वारा परमेश्वर के व्यक्तिगत नाम को उपाधि से प्रतिस्थापित किए बिना प्रस्तुत किया गया है।
- source_word: אֶרֶץ בָּבֶל
  choice: बाबेल देश
  rationale: यहाँ אֶרֶץ बाबेल के भूभाग को सूचित करता है, इसलिए आरंभ के ‘धरती’ से भेद रखते हुए ‘देश’ चुना गया है।
- source_word: לְשַׁמָּה
  choice: उजाड़
  rationale: שַׁמָּה की निर्जन और विनष्ट दशा को संक्षिप्त, स्वाभाविक तथा भविष्यद्वक्ताई गरिमा वाले शब्द में व्यक्त करता है।
- source_word: מֵאֵין יוֹשֵׁב
  choice: जहाँ कोई निवासी न रहे
  rationale: निवासियों के पूर्ण अभाव के इब्रानी मुहावरे को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में आए व्यक्तिगत नाम को ‘प्रभु’ जैसी उपाधि से नहीं बदला गया; ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला रूप है।
- issue: यहोवा की מַחְשְׁבוֹת की सक्रियता
  choice: योजनाएँ उठ खड़ी हुई हैं
  alternative: योजनाएँ पूरी होने लगी हैं
  rationale: मूल की ‘उठने’ वाली मानवीकृत छवि को बनाए रखा गया है और उसे चुपचाप ‘पूरी होने’ के अर्थ में सीमित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। भविष्यद्वक्ताई कविता की सजीवता के लिए वर्तमानकालीन ‘काँपती और तड़पती है’ तथा मूल की मानवीकृत छवि ‘योजनाएँ उठ खड़ी हुई हैं’ सुरक्षित रखी गई है।
