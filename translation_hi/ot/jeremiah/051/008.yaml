  text: פִּתְאֹ֛ם נָפְלָ֥ה בָבֶ֖ל וַ/תִּשָּׁבֵ֑ר הֵילִ֣ילוּ עָלֶ֗י/הָ קְח֤וּ צֳרִי֙ לְ/מַכְאוֹבָ֔/הּ אוּלַ֖י תֵּרָפֵֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/008.yaml
  text: Suddenly Babylon has fallen and been shattered[a]. Wail over her! Take balm for her pain; perhaps she may be healed.
translation:
  language: hi
  text: बाबेल अचानक गिर पड़ी और चकनाचूर हो गई। उसके लिए विलाप करो! उसकी पीड़ा के लिए मरहम[a] ले आओ; शायद वह चंगी हो जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बाल्सम’। इब्रानी शब्द उपचार में प्रयुक्त एक औषधीय राल को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּתְאֹם
  choice: अचानक
  rationale: यह क्रियाविशेषण घटना की आकस्मिकता और बाबेल के पतन से लगे धक्के को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: נָפְלָה
  choice: गिर पड़ी
  rationale: स्त्रीलिंग एकवचन रूप बाबेल को मानवीकृत नगर के रूप में प्रस्तुत करता है; ‘गिर पड़ी’ आकस्मिक और पूर्ण पतन का सजीव बोध देता है।
- source_word: בָבֶל
  choice: बाबेल
  rationale: इब्रानी स्थान-नाम का हिन्दी बाइबलीय परंपरा में प्रचलित लिप्यंतरण।
- source_word: וַתִּשָּׁבֵר
  choice: और चकनाचूर हो गई
  rationale: निफ़अल रूप टूट जाने या तोड़ दिए जाने की अवस्था बताता है। ‘चकनाचूर हो गई’ विनाश की तीव्रता बनाए रखता है, जबकि कर्ता को निर्दिष्ट नहीं करता।
- source_word: הֵילִילוּ
  choice: विलाप करो
  rationale: बहुवचन आज्ञार्थक रूप ऊँचे स्वर में शोक करने का आह्वान है। ‘विलाप करो’ गरिमापूर्ण, स्पष्ट और मनुष्यों के शोक के लिए स्वाभाविक है।
- source_word: עָלֶיהָ
  choice: उसके लिए
  rationale: विलाप के प्रसंग में עַל का अर्थ उसके विषय में या उसके ऊपर शोक करना है; हिन्दी में ‘उसके लिए विलाप करो’ स्वाभाविक है।
- source_word: קְחוּ
  choice: ले आओ
  rationale: बहुवचन आज्ञा का मूल अर्थ ‘लो’ है, पर उपचार के लिए मरहम उपलब्ध कराने के प्रसंग में ‘ले आओ’ अधिक स्वाभाविक हिन्दी है।
- source_word: צֳרִי
  choice: मरहम
  rationale: यह उपचार में प्रयुक्त औषधीय सुगंधित राल या बलसान को दर्शाता है। ‘मरहम’ सामान्य पाठक के लिए स्पष्ट है; पदार्थ की अधिक सटीक प्रकृति पादटिप्पणी में दी गई है।
- source_word: לְמַכְאוֹבָהּ
  choice: उसकी पीड़ा के लिए
  rationale: מַכְאוֹב का सीधा अर्थ पीड़ा, कष्ट या दुख है। ‘पीड़ा’ शारीरिक चोट तक अर्थ को सीमित किए बिना रूपक बनाए रखता है।
- source_word: אוּלַי
  choice: शायद
  rationale: यह संभावना और अनिश्चितता व्यक्त करता है; ‘शायद’ इसी खुले, अनिश्चित भाव को सुरक्षित रखता है।
- source_word: תֵּרָפֵא
  choice: वह चंगी हो जाए
  rationale: रפא के निफ़अल अपूर्ण रूप में स्वस्थ या बहाल होने की संभावना है। ‘शायद’ के साथ ‘चंगी हो जाए’ स्वाभाविक रूप से संभाव्य अर्थ देता है।
theological_decisions:
- issue: बाबेल का स्त्रीलिंग मानवीकरण
  choice: ‘गिर पड़ी’, ‘हो गई’, ‘उसके’ और ‘वह’ के द्वारा स्त्रीलिंग मानवीकरण बनाए रखा गया है।
  alternative: नगर या साम्राज्य को निर्जीव मानकर नपुंसक अथवा सामान्य रूप में व्यक्त करना।
  rationale: मूल इब्रानी में बाबेल के लिए लगातार स्त्रीलिंग एकवचन रूप हैं। इन्हें बनाए रखना नगर के मानवीकरण और उसके लिए विलाप तथा उपचार की विडंबनापूर्ण छवि को सुरक्षित रखता है।
- issue: बाबेल के चंगे होने की अनिश्चित संभावना
  choice: ‘शायद वह चंगी हो जाए’
  alternative: ‘वह चंगी हो जाएगी’ अथवा इसे निश्चित रूप से असंभव बताना।
  rationale: אוּלַי वास्तविक व्याकरणिक अनिश्चितता व्यक्त करता है। अनुवाद न तो उपचार की सफलता सुनिश्चित करता है, न प्रसंग के आधार पर संभावना को पहले से निरस्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण स्तर रखा गया है। छोटे, तीखे वाक्य मूल पद की नाटकीय तात्कालिकता बनाए रखते हैं। ‘मरहम’ सामान्य पाठक के लिए सुलभ है, जबकि पादटिप्पणी मूल पदार्थ की प्रकृति स्पष्ट करती है।
