  yaml_path: translation/ot/jeremiah/051/063.yaml
  text: And when you finish reading this scroll[a], tie a stone to it and throw it into the midst of the Euphrates[b],
translation:
  language: hi
  text: और जब तुम इस स्क्रॉल[a] को पढ़ना समाप्त कर लो, तो इसके साथ एक पत्थर बाँध देना और इसे फरात नदी के बीच में फेंक देना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस पुस्तक को।” इब्रानी शब्द סֵפֶר सामान्य रूप से किसी लिखित दस्तावेज़ के लिए प्रयुक्त हो सकता है, पर यहाँ संभवतः एक स्क्रॉल अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כְּכַלֹּתְךָ לִקְרֹא
  choice: और जब तुम ... पढ़ना समाप्त कर लो
  rationale: यह इब्रानी रचना आने वाली परिस्थिति का समय बताती है। आधुनिक हिन्दी में यह रूप स्वाभाविक है और भविष्य-संबंधी निर्देश का भाव बनाए रखता है।
- source_word: אֶת־הַסֵּפֶר הַזֶּה
  choice: इस पुस्तक
  rationale: סֵפֶר किसी लिखित दस्तावेज़ या पुस्तक को दर्शाता है; इस प्रसंग में वह संभवतः लपेटा हुआ लिखित पत्र था। मुख्य पाठ में सहज हिन्दी के लिए ‘पुस्तक’ रखा गया है और ऐतिहासिक रूप का संकेत पादटिप्पणी में दिया गया है।
- source_word: תִּקְשֹׁר עָלָיו אֶבֶן
  choice: इससे एक पत्थर बाँध देना
  rationale: קשר का अर्थ बाँधना है और עָלָיו यहाँ पत्थर को पुस्तक के साथ जोड़ने का भाव देता है। ‘इससे ... बाँध देना’ स्पष्ट करता है कि पत्थर पुस्तक से बाँधा जाना है।
- source_word: וְהִשְׁלַכְתּוֹ
  choice: और इसे ... फेंक देना
  rationale: שלך के हिफ़ील रूप का सीधा अर्थ फेंकना है; ‘फेंक देना’ आधुनिक हिन्दी में आज्ञा का स्वाभाविक रूप है।
- source_word: אֶל־תּוֹךְ פְּרָת
  choice: फरात नदी के बीच में
  rationale: תּוֹךְ नदी के भीतर या मध्य भाग का संकेत देता है, और פְּרָת फरात का नाम है। हिन्दी पाठक के लिए ‘नदी’ जोड़ने से नाम की पहचान स्पष्ट होती है।
