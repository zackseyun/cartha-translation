- source_word: בְּעֵת פְּקֻדָּתָם
  choice: उनके दण्ड के समय
  rationale: इस न्याय-संदर्भ में פְּקֻדָּה का अर्थ दण्ड देने वाली जाँच या न्याय का समय है; मुख्य पाठ में ‘दण्ड’ अर्थ स्पष्ट करता है, जबकि पाद-टिप्पणी मूल शब्द की व्यापकता बचाती है।
