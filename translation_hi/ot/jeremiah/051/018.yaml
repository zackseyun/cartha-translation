  rationale: प्रसंग मूर्तियों की खोखली और भ्रामक प्रकृति पर प्रहार करता है। अनुवाद इस तनाव को बनाए रखता है और उससे आगे कोई सम्प्रदायगत निष्कर्ष नहीं जोड़ता।
- issue: פְּקֻדָּה का न्यायार्थ
  choice: दण्ड
  alternative: जाँच, लेखा लेने या न्याय करने का समय
  rationale: इस भविष्यद्वाणी के संदर्भ में परिणाम विनाश है, इसलिए दण्ड मुख्य अर्थ है; फिर भी पाद-टिप्पणी शब्द की न्यायिक व्यापकता सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण भविष्यद्वाणीपरक शैली रखी गई है। ‘कारीगरी’ मूर्तियों के निर्मित होने का भाव बनाए रखती है, और सभी पाद-टिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
