  text: You are my war club[a], my weapon of battle; with you I shatter nations[b], and with you I destroy kingdoms.
translation:
  language: hi
  text: “तू मेरी युद्ध-गदा, युद्ध का मेरा हथियार है; तुझसे मैं राष्ट्रों को चकनाचूर करता हूँ[a], और तुझसे राज्यों का नाश करता हूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘तू/तुझसे’ एकवचन है। इस पद में सम्बोधित की पहचान नहीं दी गई है; आसपास के संदर्भ के आधार पर इसे बाबेल, साइरस/मादी-फारस, अथवा इस्राएल/याकूब माना गया है। ‘युद्ध-गदा’ के स्थान पर ‘युद्ध की कुल्हाड़ी’ या ‘हथौड़ा’ भी सम्भव हैं; इब्रानी शब्द चकनाचूर करने वाले हथियार को दर्शाता है।
    reason: alternative_reading; lexical_alternative
lexical_decisions:
- source_word: מַפֵּץ
  choice: युद्ध का गदा
  rationale: यह शब्द तोड़ने या चकनाचूर करने वाले हथियार को दर्शाता है। ‘गदा’ युद्ध-संदर्भ में स्वाभाविक है और कुल्हाड़ी जैसे अनिश्चित विशिष्ट आकार को आरोपित नहीं करता।
- source_word: לִי
  choice: मेरा
  rationale: शाब्दिक रूप से ‘मेरे लिए/मुझको’ है, पर यहाँ स्वामित्व और साधन होने का भाव हिन्दी में ‘मेरा’ से सहज रूप में व्यक्त होता है।
- source_word: כְּלֵי מִלְחָמָה
  choice: लड़ाई का हथियार
  rationale: शाब्दिक अर्थ ‘युद्ध का उपकरण/हथियार’ है। एकवचन सम्बोधन के अनुरूप हिन्दी में एकवचन रखना स्वाभाविक है।
- source_word: נִפַּצְתִּי
  choice: मैं ... चकनाचूर करता हूँ
  rationale: पिएल रूप बलपूर्वक तोड़ने का अर्थ देता है और מַפֵּץ की कुचलने वाली छवि से मेल खाता है। भविष्यवाणी की सजीव घोषणा के लिए वर्तमानकाल उपयुक्त है।
- source_word: בְּךָ
  choice: तुझसे
  rationale: पूर्वसर्ग यहाँ साधनवाचक है; ‘तुझसे’ हिन्दी में ‘तेरे द्वारा/तुझे साधन बनाकर’ का संक्षिप्त और स्वाभाविक रूप है।
- source_word: גּוֹיִם
  choice: जाति-जाति के लोग
  rationale: यह बहुवचन राजनीतिक-जातीय समुदायों को सूचित करता है। ‘जाति-जाति के लोग’ सामान्य पाठकों के लिए स्पष्ट है और इसे केवल आधुनिक राष्ट्र-राज्यों तक सीमित नहीं करता।
- source_word: הִשְׁחַתִּי
  choice: मैं ... नाश करता हूँ
  rationale: हिफ़ील रूप विनाश कराने या नष्ट करने का भाव देता है; ‘नाश करता हूँ’ समानांतर पंक्ति में सीधा और गरिमापूर्ण है।
- source_word: מַמְלָכוֹת
  choice: राज्यों
  rationale: यह राजसत्ताओं या राजकीय क्षेत्रों को दर्शाता है। ‘राज्यों’ आधुनिक मानक हिन्दी में स्पष्ट राजनीतिक पद है।
theological_decisions:
- issue: एकवचन सम्बोधित ‘तू’ की पहचान
  choice: अनुवाद में एकवचन द्वितीय पुरुष बनाए रखा गया है, पर उसकी पहचान नहीं जोड़ी गई।
  alternative: इसे बाबेल, कुस्रू/मादी-फारस, अथवा इस्राएल/याकूब के रूप में स्पष्ट करना।
  rationale: इस पद में इब्रानी पाठ सम्बोधित व्यक्ति या समूह का नाम नहीं बताता। संदर्भ के आधार पर विभिन्न पहचान प्रस्तावित हैं; किसी एक को मुख्य पाठ में रख देना मूल की वास्तविक अस्पष्टता को समाप्त कर देगा।
translation_notes:
  register: आधुनिक मानक हिन्दी में सीधा, गरिमापूर्ण और युद्ध-काव्य के अनुरूप सशक्त प्रयोग रखा गया है। ‘तू/तुझसे’ मूल के एकवचन और प्रत्यक्ष सम्बोधन को सुरक्षित रखता है; पादटिप्पणी मूल की अनिश्चित पहचान को स्पष्ट करती है।
