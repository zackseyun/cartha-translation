lexical_decisions:
- source_word: ק֥וֹל זְעָקָ֖ה
  choice: चीत्कार की आवाज़
  rationale: קוֹל के श्रव्य बिंब और זְעָקָה के संकटपूर्ण पुकार या चीत्कार—दोनों को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: מִ/בָּבֶ֑ל
  choice: बाबेल से ... आ रही है
  rationale: מִן स्रोत को दर्शाता है। इब्रानी वाक्य क्रियारहित है; हिन्दी में पूर्ण और स्वाभाविक वाक्य के लिए ‘आ रही है’ जोड़ा गया है।
- source_word: וְ/שֶׁ֥בֶר גָּד֖וֹל
  choice: और ... भारी विनाश की
  rationale: שֶׁבֶר यहाँ टूटने, ध्वंस या विपत्ति के व्यापक अर्थ में है; न्याय के प्रसंग में ‘विनाश’ उपयुक्त है और גָּדוֹל की तीव्रता ‘भारी’ व्यक्त करता है। समानांतर रचना में ‘आवाज़ आ रही है’ दूसरे खंड में अध्याहृत है।
- source_word: מֵ/אֶ֥רֶץ כַּשְׂדִּֽים
  choice: कसदियों के देश से
  rationale: मूल पाठ स्थाननाम के बजाय जातिसूचक बहुवचन ‘कसदियों’ का प्रयोग करता है; यह अनुवाद उस जाति-भौगोलिक अभिव्यक्ति को बनाए रखता है।
