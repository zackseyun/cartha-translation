source:
  edition: WLC
  text: לְ/ק֨וֹל תִּתּ֜/וֹ הֲמ֥וֹן מַ֨יִם֙ בַּ/שָּׁמַ֔יִם וַ/יַּ֥עַל נְשִׂאִ֖ים מִ/קְצֵה אָ֑רֶץ בְּרָקִ֤ים לַ/מָּטָר֙ עָשָׂ֔ה וַ/יֹּ֥צֵא ר֖וּחַ מֵ/אֹצְרֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/016.yaml
  text: At the sound of his voice, a multitude of waters is in the heavens; he makes clouds rise from the ends of the earth; he makes lightning for the rain, and brings out the wind from his storehouses.
translation:
  language: hi
  text: उसकी आवाज़ सुनाई देने पर आकाश में जलराशि का कोलाहल होता है। वह पृथ्वी के छोर से बादलों[a] को ऊपर उठाता है; वह वर्षा के लिए बिजलियाँ बनाता है और अपने भंडारों[b] से हवा निकालता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वाष्पों”।
    reason: lexical_alternative
  - marker: b
    text: या “खजानों”।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְקוֹל תִּתּוֹ
  choice: उसके बोलने की ध्वनि से
  rationale: शाब्दिक रूप से यह ‘उसके अपनी आवाज़ देने पर/की ध्वनि पर’ है। हिंदी में यह चयन उस मुहावरे का अर्थ स्वाभाविक ढंग से देता है और इसे केवल ‘गरज’ तक सीमित नहीं करता।
- source_word: הֲמוֹן מַיִם
  choice: जलराशि का कोलाहल
  rationale: הֲמוֹן में बहुतायत और हलचल/गूँज दोनों अर्थछायाएँ हैं। यह पदबंध पानी की विशाल मात्रा और उसकी प्रचंड ध्वनि दोनों को यथासंभव बनाए रखता है।
- source_word: בַּשָּׁמַיִם
  choice: आकाश में
  rationale: यहाँ बादल, वर्षा, बिजली और हवा का मौसम-संबंधी संदर्भ है, इसलिए आधुनिक हिंदी में ‘आकाश’ स्पष्ट और स्वाभाविक है।
- source_word: נְשִׂאִים
  choice: बादलों
  rationale: शब्द बादल, वाष्प या कुहरे के समूहों को सूचित कर सकता है। आँधी-वर्षा के संदर्भ में ‘बादल’ सर्वाधिक स्वाभाविक है; ‘वाष्प’ को पादटिप्पणी में रखा गया है।
- source_word: מִקְצֵה אָרֶץ
  choice: पृथ्वी के छोर से
  rationale: एकवचन रूप के निकट रहते हुए यह संसार की दूरस्थ सीमा की प्रचलित बाइबलीय छवि बनाए रखता है।
- source_word: בְּרָקִים לַמָּטָר
  choice: वर्षा के लिए बिजली
  rationale: यह अनुवाद ל संबंधसूचक अव्यय को खुला रखता है और बिजली को वर्षा से जोड़ता है, बिना संबंध को अधिक स्पष्ट करके मूल की संभावित व्यापकता घटाए।
- source_word: וַיֹּצֵא רוּחַ
  choice: हवा निकालता है
  rationale: मौसम के प्रसंग में רוּחַ का आशय ‘हवा’ है। ‘निकालता है’ भंडारों से बाहर लाने की ठोस काव्यात्मक छवि सुरक्षित रखता है।
- source_word: מֵאֹצְרֹתָיו
  choice: अपने भंडारों से
  rationale: यह मौसम की वस्तुओं के दिव्य भंडारण की ठोस रूपक-छवि को सहज आधुनिक हिंदी में व्यक्त करता है; ‘खजानों’ का विकल्प पादटिप्पणी में है।
theological_decisions:
- issue: मौसम और सृष्टि-संबंधी काव्यात्मक चित्रण
  choice: परमेश्वर की वाणी, आकाश के जल, ऊपर उठते बादल, वर्षा की बिजली और भंडारों से निकलती हवा की मूल छवियाँ सुरक्षित रखी गईं।
  alternative: पद को सामान्यीकृत करके केवल यह कहना कि परमेश्वर तूफ़ान को नियंत्रित करता है।
  rationale: इब्रानी पाठ सृष्टि पर परमेश्वर के अधिकार को ठोस, उदात्त काव्यात्मक बिंबों से व्यक्त करता है। अनुवाद न तो इन बिंबों को सपाट व्याख्या में बदलता है, न उन्हें किसी विशिष्ट आधुनिक ब्रह्मांड-विज्ञान के अनुसार पुनर्परिभाषित करता है।
- issue: הֲמוֹן में मात्रा और ध्वनि की अर्थछायाएँ
  choice: ‘जलराशि का कोलाहल’ द्वारा दोनों अर्थछायाएँ रखी गईं।
  alternative: केवल ‘बहुत जल’ या केवल ‘जल का गर्जन’।
  rationale: मूल शब्द बहुतायत, भीड़-जैसी हलचल और गूँज का संकेत दे सकता है। संयुक्त अभिव्यक्ति मूल की तनावपूर्ण बहुअर्थकता को बिना किसी एक अर्थ तक सीमित किए संप्रेषित करती है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, काव्यात्मक और सामान्य पाठक के लिए सुबोध शैली। ‘जलराशि’ और ‘कोलाहल’ मूल की उदात्तता तथा ध्वन्यात्मकता रखते हैं, जबकि वाक्य-रचना अनावश्यक रूप से पुरातन नहीं है।
