lexical_decisions:
- source_word: וְנָפְלוּ
  choice: और ... गिरेंगे
  rationale: संयोजक वाव के साथ क़ाल पूर्ण रूप यहाँ भविष्यसूचक न्याय के निश्चित परिणाम को व्यक्त करता है; इसलिए आधुनिक हिन्दी में भविष्यकाल स्वाभाविक है।
- source_word: חֲלָלִים
  choice: मारे गए लोग
  rationale: यह संज्ञा युद्ध में मारे गए या घातक रूप से घायल लोगों को सामूहिक रूप से दर्शाती है। यह हिन्दी में स्पष्ट और सहज है।
- source_word: בְּאֶרֶץ כַּשְׂדִּים
  choice: कसदियों के देश में
  rationale: मूल इब्रानी जातिनाम כַּשְׂדִּים को बनाए रखते हुए संबंधवाचक रचना का निकट अनुवाद किया गया है।
- source_word: וּמְדֻקָּרִים
  choice: और ... वे जो आर-पार बेधे गए हैं
  rationale: דקר का निष्क्रिय कृदंत हथियार से बेधे गए लोगों का सजीव चित्र प्रस्तुत करता है; केवल ‘घायल’ कहना अर्थ को अनावश्यक रूप से व्यापक और कम तीखा कर देता।
- source_word: בְּחוּצוֹתֶיהָ
  choice: उसकी गलियों में
  rationale: חוּצוֹת नगर की गलियों, चौकों या खुले सार्वजनिक स्थानों को दर्शा सकता है। प्रसंग में ‘गलियों’ स्वाभाविक है और स्त्रीलिंग प्रत्यय को ‘उसकी’ से सुरक्षित रखा गया है।
