source:
  edition: WLC
  text: וַ/יִּכְתֹּ֣ב יִרְמְיָ֗הוּ אֵ֧ת כָּל הָ/רָעָ֛ה אֲשֶׁר תָּב֥וֹא אֶל בָּבֶ֖ל אֶל סֵ֣פֶר אֶחָ֑ד אֵ֚ת כָּל הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה הַ/כְּתֻבִ֖ים אֶל בָּבֶֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/060.yaml
  text: And Jeremiah wrote in a single scroll all the disaster that would come upon Babylon—all these words written against Babylon[a].
translation:
  language: hi
  text: यिर्मयाह ने एक ही ग्रंथ-स्क्रॉल में वह सारी विपत्ति लिखी जो बाबुल पर आनेवाली थी—ये सभी वचन, जो बाबुल के विषय में लिखे हुए थे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बाबुल के विरुद्ध लिखे हुए थे।”
    reason: इब्रानी पूर्वसर्ग यहाँ बाबुल के विषय में अथवा उसके विरुद्ध निर्देशित भविष्यवाणी—दोनों भाव दे सकता है।
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: लिख दी
  rationale: כתב के सामान्य कथात्मक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है; ‘दी’ कार्य के पूरा किए जाने का भाव देता है।
- source_word: אֵת כָּל הָרָעָה
  choice: वह सारी विपत्ति
  rationale: न्याय-संबंधी भविष्यवाणी में רָעָה नैतिक बुराई के बजाय आनेवाली आपदा या विपत्ति को सूचित करता है।
- source_word: אֲשֶׁר תָּבוֹא אֶל בָּבֶל
  choice: जो बाबुल पर आनेवाली थी
  rationale: शाब्दिक ‘बाबुल की ओर आएगी’ की तुलना में ‘पर आनेवाली’ न्याय की प्रतिकूल घटना को आधुनिक हिन्दी में स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֶל סֵפֶר אֶחָד
  choice: एक ही पुस्तक में
  rationale: סֵפֶר लिखित दस्तावेज़ या पुस्तक को दर्शाता है; ‘एक ही’ אֶחָד के एकल संकलन पर बल को बनाए रखता है। ऐतिहासिक रूप से ‘लपेटा हुआ ग्रंथ’ सम्भव है, पर सामान्य पाठक के लिए ‘पुस्तक’ अधिक सहज है।
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: ये सभी वचन
  rationale: דְּבָרִים यहाँ पहले कही गई भविष्यवाणियों को सूचित करता है; ‘वचन’ पाठ और भविष्यवाणी दोनों के स्वर को बनाए रखता है।
- source_word: הַכְּתֻבִים
  choice: जो ... लिखे गए थे
  rationale: निष्क्रिय कृदन्त का स्पष्ट हिन्दी संबंधवाचक उपवाक्य के रूप में अनुवाद किया गया है।
- source_word: אֶל בָּבֶל
  choice: बाबुल के विषय में
  rationale: यहाँ אֶל भविष्यवाणी के संदर्भ या दिशा को व्यक्त कर सकता है। ‘के विषय में’ व्यापक और स्वाभाविक है तथा प्रसंग से शत्रुतापूर्ण न्याय का अर्थ स्वयं स्पष्ट होता है।
theological_decisions:
- issue: बाबुल से संबंधित भविष्यवाणियों की दिशा
  choice: बाबुल के विषय में
  alternative: बाबुल के विरुद्ध
  rationale: इब्रानी אֶל सामान्यतः ‘की ओर/को’ है, पर लिखे हुए वचनों के साथ यहाँ विषय या लक्ष्य सूचित करता है। न्याय के प्रसंग में ‘विरुद्ध’ सम्भव है, किंतु मूल पूर्वसर्ग की व्यापकता बनाए रखने के लिए मुख्य पाठ में ‘के विषय में’ रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सरल कथात्मक शैली रखी गई है। ‘विपत्ति’, ‘वचन’ और ‘बाबुल’ बाइबलीय प्रसंग के अनुकूल तथा सामान्य पाठकों के लिए बोधगम्य हैं।
