  text: And with you I shattered horse and rider[c][b][a]; and with you I shattered chariot and rider.
translation:
  language: hi
  text: मैंने तेरे द्वारा[a] घोड़े और उसके सवार को चकनाचूर[b] किया; और मैंने तेरे द्वारा रथ[c] और उसके सवार को चकनाचूर किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तुझे साधन बनाकर’; इब्रानी पूर्वसर्ग यहाँ माध्यम या साधन का बोध कराता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘टुकड़े-टुकड़े किया’; इब्रानी क्रिया बलपूर्वक तोड़ने का भाव देती है।
    reason: lexical_alternative
  - marker: c
    text: कुछ प्रसंगों में इसका अर्थ सामूहिक रूप से ‘रथ-सेना’ भी हो सकता है; यहाँ एकवचन संरचना ‘रथ’ के पक्ष में है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נִפַּצְתִּי
  choice: मैंने ... चकनाचूर किया
  rationale: पिएल रूप हिंसक ढंग से तोड़ने या टुकड़े-टुकड़े करने का भाव देता है। ‘चकनाचूर किया’ युद्ध-संबंधी तीव्रता को स्वाभाविक हिन्दी में बनाए रखता है और दोनों बार एक ही तरह अनूदित है।
- source_word: בְּךָ
  choice: तेरे द्वारा
  rationale: यहाँ בְּ साधन या माध्यम का बोध कराता है। ‘तेरे द्वारा’ परमेश्वर को क्रिया का कर्ता और संबोधित व्यक्ति/वस्तु को उसका माध्यम स्पष्ट रखता है।
- source_word: סוּס
  choice: घोड़ा
  rationale: मूल संज्ञा का सीधा अर्थ ‘घोड़ा’ है। युद्ध का संदर्भ होने पर भी मूल पाठ में अलग से ‘युद्ध-घोड़ा’ नहीं कहा गया।
- source_word: רֹכְבוֹ
  choice: उसका सवार
  rationale: רכב से बना यह रूप सवारी करने वाले व्यक्ति को दर्शाता है; प्रत्यय का संबंध ‘उसका’ से स्पष्ट किया गया है।
- source_word: רֶכֶב
  choice: रथ
  rationale: यद्यपि यह शब्द कुछ प्रसंगों में सामूहिक रूप से रथ-सेना का बोध करा सकता है, यहाँ एकवचन और ‘उसका सवार’ के साथ इसकी जोड़ी ‘रथ’ के पक्ष में है।
theological_decisions:
- issue: ईश्वरीय न्याय में संबोधित पात्र की साधनात्मक भूमिका
  choice: ‘मैंने तेरे द्वारा ... चकनाचूर किया’
  alternative: ‘मैंने तुझसे ... चकनाचूर किया’ / ‘तेरे माध्यम से मैंने ... चकनाचूर किया’
  rationale: प्रथम पुरुष क्रिया परमेश्वर को कर्ता बनाए रखती है, जबकि בְּךָ संबोधित पात्र को साधन बताता है। इससे इस पद के भीतर संबोधित पात्र की पहचान को अनावश्यक रूप से निश्चित किए बिना मूल की ईश्वरीय कर्तृत्व-संबंधी संरचना सुरक्षित रहती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सीधी रखी गई है। ‘तेरे’ का प्रयोग एकवचन संबोधन को सुरक्षित रखता है। दोनों खंडों की पुनरावृत्ति और समानांतर रचना मूल इब्रानी के अनुरूप जानबूझकर बनाए रखी गई है।
