- from: हे बहुत-से जलस्रोतों के पास बसनेवाली,[a] खज़ानों से भरपूर नगरी, तेरा अन्त आ गया है—तेरे अन्याय के लाभ की सीमा।[b]
  to: हे बहुत-से जलों के पास बसनेवाली, खज़ानों से भरपूर, तेरा अन्त आ गया है—तेरे अनुचित लाभ की सीमा।[a]
  rationale: The revision removes an unnecessary narrowing of “many waters,” makes the final Hindi phrase natural, and preserves the Hebrew’s disputed/elliptical measure metaphor in a single footnote. The city identification remains implicit, as in the verse’s feminine singular address and without adding an explicit noun absent from the Hebrew.
