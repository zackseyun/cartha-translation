lexical_decisions:
- source_word: שכנתי
  choice: हे ... बसनेवाली
  rationale: स्त्रीलिंग एकवचन कृदन्त बाबेल को स्त्रीरूप में प्रत्यक्ष सम्बोधित करता है। हिन्दी में सम्बोधन और निरन्तर निवास, दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עַל מַיִם רַבִּים
  choice: बहुत-से जलस्रोतों के पास
  rationale: עַל के ‘पर/पास’ अर्थों में यहाँ बाबेल की अनेक नदियों और नहरों के बीच की स्थिति के कारण ‘पास’ सहज है; ‘जलस्रोतों’ से बहुविध जलमार्गों का संकेत मिलता है।
- source_word: רַבַּת אֹצָרוֹת
  choice: खज़ानों से भरपूर
  rationale: रַבַּת प्रचुरता व्यक्त करता है। यह चयन आधुनिक हिन्दी में धन-सम्पदा की बहुतायत को स्पष्ट और स्वाभाविक ढंग से बताता है।
- source_word: בָּא קִצֵּךְ
  choice: तेरा अन्त आ गया है
  rationale: पूर्ण क्रिया न्याय के निश्चित होकर आ पहुँचने को व्यक्त करती है।
- source_word: אַמַּת
  choice: सीमा
  rationale: शाब्दिक अर्थ ‘हाथ/हाथ भर की माप’ है; प्रसंग में यह निश्चित माप या हद का बोध देता है। अस्पष्ट रूपक को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: בִּצְעֵךְ
  choice: तेरे अन्याय के लाभ
  rationale: בצע लोभ, हिंसा या अन्याय से प्राप्त लाभ का नकारात्मक भाव रख सकता है। ‘अन्याय का लाभ’ आर्थिक अर्थ और नैतिक बल दोनों बचाता है।
theological_decisions:
- issue: स्त्रीलिंग सम्बोधित पात्र
  choice: बाबेल को स्त्रीरूप नगरी मानकर प्रत्यक्ष सम्बोधन
  alternative: किसी सामान्य स्त्री निवासी या समस्त जनसमुदाय को सम्बोधन
  rationale: स्त्रीलिंग एकवचन रूप और व्यापक प्रसंग भविष्यवाणी में नगरी को स्त्रीरूप में सम्बोधित करने के अनुकूल हैं। स्पष्टता के लिए ‘नगरी’ जोड़ा गया है, बिना किसी अतिरिक्त सिद्धान्त के।
- issue: अन्तिम पदबंध का सम्बन्ध
  choice: ‘तेरे अन्याय के लाभ की सीमा’ को अन्त आ पहुँचने की समानान्तर व्याख्या के रूप में खुला रखा
  alternative: 'इसे पूर्ण वाक्य बनाना: ‘तेरे अन्याय के लाभ का माप पूरा हो गया है’'
  rationale: इब्रानी में क्रिया-विहीन संक्षिप्त पदबंध है। हिन्दी में उसी काव्यात्मक तनाव और अर्थगत अस्पष्टता को डैश के बाद रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। ‘बसनेवाली’ तथा ‘तेरा’ से मूल का स्त्रीलिंग एकवचन सम्बोधन सुरक्षित है। ‘हे’ और ‘नगरी’ लक्ष्य भाषा में सम्बोधन को स्पष्ट करते हैं; डैश मूल के संक्षिप्त, क्रिया-विहीन अन्तिम पदबंध को बनाए रखता है।
