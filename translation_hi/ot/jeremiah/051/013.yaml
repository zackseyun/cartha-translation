review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the feminine singular direct address, abundance of treasures, the completed arrival of the end, and the terse final measurement image. However, “जलस्रोतों” narrows the broad Hebrew “waters” to sources, and “अन्याय के लाभ” is not idiomatic Hindi for the morally charged but semantically flexible בִּצְעֵךְ.
  naturalness: The overall register is dignified and modern. Replacing “जलस्रोतों” with “जलों” and recasting the final phrase as “अनुचित लाभ” improves idiomatic clarity while retaining the prophetic compression after the dash.
  terminology: “खज़ानों से भरपूर” and “तेरा अन्त आ गया है” are apt. “अनुचित लाभ” conveys gain with its potentially wrongful/greedy sense without reducing the Hebrew term solely to internal greed. The footnote should retain the literal cubit/handbreadth-like measure image and distinguish it from the contextual rendering.
  issues:
  - severity: low
    issue: “जलस्रोतों” is more specific than the Hebrew plural “waters.”
    rationale: The source refers broadly to many waters; it need not specifically mean springs or water sources. “बहुत-से जलों के पास” is closer while remaining natural.
  - severity: medium
    issue: “तेरे अन्याय के लाभ” is awkward and over-specifies the construction.
    rationale: בִּצְעֵךְ can denote gain, especially unjust or greedy gain, but the Hebrew does not use a separate word meaning “injustice.” “तेरे अनुचित लाभ” is idiomatic and retains the negative connotation with appropriate semantic latitude.
  - severity: low
    issue: The literal footnote wording “हाथ-भर माप” is imprecise and its attribution of “अन्याय” to the literal phrase is too strong.
    rationale: אַמָּה is literally a cubit, a fixed linear measure. The note should give that literal image and then explain the contextual sense without presenting the interpretive adjective as explicit in every lexical component.
  revised_text: हे बहुत-से जलों के पास बसनेवाली, खज़ानों से भरपूर, तेरा अन्त आ गया है—तेरे अनुचित लाभ की सीमा।[a]
