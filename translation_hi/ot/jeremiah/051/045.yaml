  source_fidelity: 'The draft conveys all major Hebrew elements: departure from the personified city, the covenantal address “my people,” the distributive call for self-preservation, and Yahweh’s burning anger. The Hebrew imperative צְאוּ itself does not establish movement toward the speaker, so “निकल आओ” introduces a directional nuance not present in the source.'
  naturalness: The language is generally clear and suitably prophetic. “निकल जाओ” is more directionally neutral and idiomatic for an urgent command to depart. “भड़कते हुए क्रोध” is smoother and grammatically unambiguous in this postpositional phrase.
  terminology: “मेरी प्रजा,” “हर एक पुरुष,” “अपना प्राण,” and “याहवे” appropriately preserve the source’s covenantal, distributive masculine, life-preserving, and divine-name terminology. “प्राण” is elevated but natural in this solemn register.
  issues:
  - severity: low
    issue: “निकल आओ” adds speaker-oriented direction.
    rationale: צְאוּ means “go/come out” but does not specify whether the motion is toward or away from the speaker. A direction-neutral Hindi imperative better preserves the ambiguity.
  - severity: low
    issue: “भड़कते क्रोध” is less smooth than “भड़कते हुए क्रोध.”
    rationale: The revised participial phrase more clearly expresses the Hebrew image of heated or burning anger in modern standard Hindi.
