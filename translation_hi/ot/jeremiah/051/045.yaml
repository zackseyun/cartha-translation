id: JER.51.45
reference: Jeremiah 51:45
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: צְא֤וּ מִ/תּוֹכָ/הּ֙ עַמִּ֔/י וּ/מַלְּט֖וּ אִ֣ישׁ אֶת נַפְשׁ֑/וֹ מֵ/חֲר֖וֹן אַף יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/045.yaml
  text: Come out from her midst[a], my people, and let each man save his life from the burning anger of Yahweh.
translation:
  language: hi
  text: “उसके बीच से निकल जाओ[a], हे मेरी प्रजा! हर एक पुरुष याहवे के भड़कते हुए क्रोध से अपना प्राण बचाए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके बीच से निकल आओ।”
    reason: मूल हिब्रू क्रिया प्रस्थान का आदेश देती है, पर वक्ता के सापेक्ष दिशा स्पष्ट नहीं करती; इसलिए हिन्दी में ‘निकल जाओ’ और ‘निकल आओ’ दोनों संभव हैं।
lexical_decisions:
- source_word: צְאוּ
  choice: निकल आओ
  rationale: बहुवचन आज्ञार्थक रूप तत्काल प्रस्थान का आह्वान करता है। हिन्दी में ‘निकल आओ’ वक्ता की ओर आने का स्वाभाविक भाव देता है; मूल क्रिया स्वयं ‘आओ’ और ‘जाओ’ के बीच दिशा को पूरी तरह निर्धारित नहीं करती, इसलिए विकल्प पादटिप्पणी में रखा गया है।
- source_word: מִתּוֹכָהּ
  choice: उसके बीच से
  rationale: स्त्रीलिंग प्रत्यय संदर्भ में बाबेल नामक नगरी की ओर संकेत करता है। सर्वनाम बनाए रखने से नगरी का मानवीकरण सुरक्षित रहता है।
- source_word: עַמִּי
  choice: हे मेरी प्रजा
  rationale: सम्बोधन और परमेश्वर के साथ वाचा-संबंधी अपनत्व, दोनों को स्पष्ट रूप से व्यक्त करता है।
- source_word: וּמַלְּטוּ אִישׁ אֶת־נַפְשׁוֹ
  choice: हर एक पुरुष ... अपना प्राण बचाए
  rationale: אִישׁ का यहाँ वितरणात्मक अर्थ है और वह व्याकरणतः पुल्लिंग एकवचन है। נפש संकट से बचने के संदर्भ में अमूर्त ‘आत्मा’ नहीं, जीवन अथवा स्वयं व्यक्ति को दर्शाता है; ‘अपना प्राण बचाए’ स्वाभाविक हिन्दी है।
- source_word: מֵחֲרוֹן אַף
  choice: भड़कते क्रोध से
  rationale: यह हिब्रू मुहावरा क्रोध की उष्णता और तीव्रता दोनों व्यक्त करता है। ‘भड़कता क्रोध’ उस रूपक को बनाए रखते हुए आधुनिक हिन्दी में सहज है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल में प्रयुक्त परमेश्वर के व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय हिन्दी लिपि में लिप्यंतरित किया गया है।
theological_decisions:
- issue: יְהוָה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसका व्यापक रूप से स्वीकृत विद्वत्तापूर्ण उच्चारण-आधारित लिप्यंतरण है; ‘प्रभु’ करने से नाम उपाधि में बदल जाता।
- issue: אִישׁ का वितरणात्मक और लिंगसूचक रूप
  choice: हर एक पुरुष
  alternative: हर एक जन; हर व्यक्ति
  rationale: मूल का पुल्लिंग संज्ञा-रूप बनाए रखा गया है, साथ ही ‘हर एक’ से उसका वितरणात्मक बल व्यक्त होता है। यह वाक्य प्रत्येक सम्बोधित पुरुष को व्यक्तिगत रूप से अपना जीवन बचाने को कहता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और घोषणात्मक रखी गई है। ‘हे’ भविष्यद्वक्ताई सम्बोधन को स्पष्ट करता है; विस्मयादिबोधक चिह्न दोनों आज्ञाओं के बीच स्वाभाविक विराम देता है।
