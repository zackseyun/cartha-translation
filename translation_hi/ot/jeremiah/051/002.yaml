base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/002.yaml
  text: And I will send strangers against Babylon, and they will winnow her and empty her land, for they will be against her from every side in the day of disaster.
translation:
  language: hi
  text: और मैं बाबेल में परदेशियों[a] को भेजूँगा। वे उसे अनाज की तरह फटकेंगे[b] और उसके देश को खाली कर देंगे, क्योंकि विपत्ति के दिन वे चारों ओर से उसके विरुद्ध होंगे।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “विदेशियों।” इब्रानी शब्द बाबेल से बाहर के लोगों को दर्शाता है, जिन्हें उसके विरुद्ध भेजा जाएगा।
    reason: lexical_alternative
  - marker: b
    text: “फटकेंगे” का अर्थ अधिक सामान्य रूप से “तितर-बितर करेंगे” भी हो सकता है, लेकिन मूल में अनाज फटकने का कृषि-बिंब संभवतः जानबूझकर प्रयुक्त हुआ है।
    reason: lexical_alternative
  - marker: c
    text: “विपत्ति के दिन” से आशय उस समय से है जब बाबेल पर संकट आएगा, न कि नैतिक बुराई से चिह्नित किसी दिन से।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּחְתִּי
  choice: और मैं ... भेजूँगा
  rationale: भविष्यवाणी के न्याय-संदर्भ में संयोजक सहित पूर्ण क्रिया भावी और निश्चित कार्य को व्यक्त करती है।
- source_word: לְבָבֶל
  choice: बाबेल के विरुद्ध
  rationale: לְ गंतव्य सूचित कर सकता है, पर भेजे गए बाहरी लोगों की शत्रुतापूर्ण भूमिका के कारण यहाँ ‘के विरुद्ध’ प्रसंगानुकूल है।
- source_word: זָרִים
  choice: परदेशियों
  rationale: यह शब्द बाहरी अथवा विदेशी लोगों को दर्शाता है; ‘परदेशी’ आधुनिक हिन्दी में स्वाभाविक है और उनके बाबेल से बाहर के होने का भाव रखता है।
- source_word: וְזֵרוּהָ
  choice: उसे अनाज की तरह फटकेंगे
  rationale: זרה में अनाज को फटककर बिखेरने का कृषि-बिंब है। स्पष्ट उपमा हिन्दी पाठक के लिए मूल रूपक को बोधगम्य रखती है।
- source_word: וִיבֹקְקוּ
  choice: खाली कर देंगे
  rationale: בקק का ठोस भाव खाली कर देना है, जो विनाश के परिणाम को व्यक्त करता है और मूल बिंब बनाए रखता है।
- source_word: אֶת אַרְצָהּ
  choice: उसके देश को
  rationale: אֶרֶץ यहाँ बाबेल के भूभाग अथवा देश को सूचित करता है; ‘देश’ हिन्दी में इस राजनीतिक-भौगोलिक संदर्भ में स्वाभाविक है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह आने वाले उजाड़ का कारण बताने वाला उपवाक्य आरम्भ करता है।
- source_word: הָיוּ עָלֶיהָ
  choice: वे ... उसके विरुद्ध होंगे
  rationale: रूप पूर्ण है, किंतु भविष्यवाणी के संदर्भ में भावी आक्रमण की निश्चितता बताता है; हिन्दी भविष्यकाल प्रसंग की काल-संगति रखता है।
- source_word: מִסָּבִיב
  choice: चारों ओर से
  rationale: यह घेराबंदी और हर दिशा से पड़ने वाले सैन्य दबाव का स्वाभाविक हिन्दी मुहावरा है।
- source_word: בְּיוֹם רָעָה
  choice: विपत्ति के दिन
  rationale: רָעָה यहाँ नैतिक बुराई नहीं, बाबेल पर आने वाली आपदा या विपत्ति को दर्शाता है।
