source:
  edition: WLC
  text: הָבֵ֣רוּ הַ/חִצִּים֮ מִלְא֣וּ הַ/שְּׁלָטִים֒ הֵעִ֣יר יְהוָ֗ה אֶת ר֨וּחַ֙ מַלְכֵ֣י מָדַ֔י כִּֽי עַל בָּבֶ֥ל מְזִמָּת֖/וֹ לְ/הַשְׁחִיתָ֑/הּ כִּֽי נִקְמַ֤ת יְהוָה֙ הִ֔יא נִקְמַ֖ת הֵיכָלֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/011.yaml
  text: Sharpen the arrows[a]; fill the shields. Yahweh has stirred up the spirit of the kings of Media, because his plan is against Babylon, to destroy her; for it is the vengeance of Yahweh[b], vengeance for his temple.
translation:
  language: hi
  text: तीरों को पैना करो; तरकश भरो[a]। याहवे ने मादी राजाओं की आत्मा को उभारा है, क्योंकि बाबेल के विरुद्ध उसकी योजना उसे नष्ट करने की है। क्योंकि यह याहवे का प्रतिशोध है—उसके मंदिर के लिए प्रतिशोध।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ढालें भरो।” जिस इब्रानी शब्द का अनुवाद यहाँ “तरकश” किया गया है, वह “ढालें” भी दर्शा सकता है; लेकिन “भरो” और “तीरों” के साथ इस प्रसंग में “तरकश” अधिक स्वाभाविक जान पड़ता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבֵרוּ הַחִצִּים
  choice: तीरों को पैना करो
  rationale: हथियार तैयार करने के प्रसंग में क्रिया का भाव तीरों को चमकाने अथवा धारदार बनाने का है। ‘पैना करो’ युद्ध की तैयारी को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: מִלְאוּ הַשְּׁלָטִים
  choice: तरकश भर लो
  rationale: מִלְאוּ का मूल अर्थ ‘भरो’ है। अगली संज्ञा सामान्यतः ढालों के लिए प्रयुक्त होती है, पर तीरों के तत्काल प्रसंग और ‘भरने’ की क्रिया के साथ ‘तरकश’ अर्थ अधिक सुसंगत है; पाठगत कठिनाई को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: הֵעִיר ... אֶת רוּחַ
  choice: मन को उकसा दिया है
  rationale: यहाँ רוּחַ राजाओं की भीतरी प्रेरणा या प्रवृत्ति को दर्शाता है। शाब्दिक ‘आत्मा को जगाया’ की अपेक्षा यह हिन्दी में स्वाभाविक है और याहवे की सक्रिय प्रेरक भूमिका बनाए रखता है।
- source_word: מַלְכֵי מָדַי
  choice: मादै के राजाओं
  rationale: מָדַי प्राचीन मादी क्षेत्र अथवा लोगों का नाम है। ‘मादै’ बाइबलीय स्थान-नाम को संक्षिप्त और पहचानने योग्य रूप में रखता है।
- source_word: מְזִמָּתוֹ
  choice: उसकी योजना
  rationale: यह शब्द सोची-समझी मंशा या योजना बताता है। सर्वनाम का निकटतम कर्ता याहवे है।
- source_word: לְהַשְׁחִיתָהּ
  choice: उसे नष्ट करने की
  rationale: स्त्रीलिंग प्रत्यय बाबेल की ओर संकेत करता है। हिन्दी में ‘उसे’ लिंग-भेद आरोपित किए बिना उसी संदर्भ को स्पष्ट रखता है।
- source_word: נִקְמַת יְהוָה
  choice: याहवे का प्रतिशोध
  rationale: निर्मित पदबंध याहवे द्वारा किए जाने वाले अथवा उससे संबंधित न्यायपूर्ण बदले को व्यक्त करता है। ‘प्रतिशोध’ पद की गंभीरता बनाए रखता है।
- source_word: נִקְמַת הֵיכָלוֹ
  choice: उसके मन्दिर का प्रतिशोध
  rationale: यह बाबेल द्वारा याहवे के मन्दिर के साथ किए गए व्यवहार के कारण लिए जाने वाले प्रतिशोध को संक्षिप्त रूप में व्यक्त करता है और मूल की संरचनात्मक पुनरावृत्ति बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल में व्यक्तिगत चतुराक्षरीय नाम है; ‘याहवे’ उसे किसी उपाधि से बदले बिना लिप्यंतरित करता है।
- issue: मादी राजाओं को प्रेरित करने में याहवे की भूमिका
  choice: याहवे ने ... मन को उकसा दिया है
  alternative: याहवे ने उन्हें कार्य करने दिया
  rationale: हिफ़ील क्रिया याहवे की सक्रिय प्रेरक भूमिका बताती है, केवल अनुमति नहीं।
- issue: बाबेल के विनाश और मन्दिर के प्रतिशोध का संबंध
  choice: यह याहवे का प्रतिशोध है—उसके मन्दिर का प्रतिशोध
  alternative: यह याहवे के मन्दिर की ओर से लिया गया प्रतिशोध है
  rationale: मूल की दोहराई हुई संक्षिप्त रचना को बनाए रखा गया है, बिना प्रतिशोध की विधि या धर्मशास्त्रीय आशय को आवश्यकता से अधिक स्पष्ट किए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक पठन के योग्य रखी गई है। युद्ध-संबंधी आज्ञाएँ संक्षिप्त हैं; ‘मन्दिर’ और ‘प्रतिशोध’ मूल की गंभीरता तथा पुनरावृत्ति को बनाए रखते हैं।
