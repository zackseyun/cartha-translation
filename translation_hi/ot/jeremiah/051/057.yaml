base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/057.yaml
  text: And I will make her officials drunk—her wise men[a], her governors, her deputies, and her warriors—and they will sleep an everlasting sleep and not wake up, declares the King[b], whose name is Yahweh of Armies.
translation:
  language: hi
  text: “मैं उसके हाकिमों को—उसके बुद्धिमान लोगों, राज्यपालों[a], उप-शासकों और योद्धाओं को—मतवाला कर दूँगा। वे सदा की नींद सोएँगे और कभी नहीं जागेंगे,” राजा की यह घोषणा है, जिसका नाम सेनाओं का याहवे[b] है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘राज्यपालों’ के लिए ‘क्षत्रपों’ का अनुवाद भी सम्भव है; इब्रानी शब्द सामान्यतः प्रशासनिक राज्यपालों को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: पारंपरिक हिन्दी अनुवादों में दिव्य नाम प्रायः ‘यहोवा’ मिलता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁכַּרְתִּי
  choice: मतवाला कर दूँगा
  rationale: 'हिफ़ील रूप का कारणवाचक अर्थ सुरक्षित रहता है: वक्ता स्वयं उन्हें मतवाला करेगा। यह स्वाभाविक आधुनिक हिन्दी भी है।'
- source_word: שָׂרֶיהָ
  choice: उसके हाकिमों
  rationale: यहाँ शब्द बाबुल के शासकीय उच्चाधिकारियों के लिए है; ‘हाकिम’ राजपुत्रों तक अर्थ को सीमित किए बिना प्रशासनिक नेतृत्व व्यक्त करता है।
- source_word: חֲכָמֶיהָ
  choice: उसके बुद्धिमानों
  rationale: मूल शब्द उन लोगों को दर्शाता है जो बुद्धिमान या परामर्शदाता माने जाते थे; ‘बुद्धिमान’ अर्थ को अनावश्यक रूप से केवल दरबारी सलाहकारों तक सीमित नहीं करता।
- source_word: פַּחוֹתֶיהָ
  choice: राज्यपालों
  rationale: यह प्रशासनिक प्रदेशों के शासकों का पद है। ‘राज्यपाल’ आधुनिक हिन्दी में स्पष्ट है, जबकि ‘क्षत्रप’ अधिक विशिष्ट ऐतिहासिक पद का संकेत दे सकता है।
- source_word: סְגָנֶיהָ
  choice: उप-शासकों
  rationale: यह अधीनस्थ अथवा दूसरे स्तर के शासकीय अधिकारियों का बोध कराता है और आसपास के अन्य पदनामों से भेद बनाए रखता है।
- source_word: גִבּוֹרֶיהָ
  choice: योद्धाओं
  rationale: सैन्य सामर्थ्य रखने वाले वीर पुरुषों का भाव समकालीन और सहज हिन्दी में व्यक्त होता है।
- source_word: וְיָשְׁנוּ שְׁנַת עוֹלָם
  choice: वे सदा की नींद सो जाएँगे
  rationale: मृत्यु के लिए प्रयुक्त नींद का मूल रूपक और עוֹלָם की स्थायी-अवधि की शक्ति दोनों सुरक्षित रखे गए हैं।
- source_word: וְלֹא יָקִיצוּ
  choice: फिर नहीं जागेंगे
  rationale: नींद के रूपक को बनाए रखते हुए यह स्वाभाविक हिन्दी में उसके अपरिवर्तनीय परिणाम को व्यक्त करता है।
- source_word: נְאֻם
  choice: यह घोषणा है
  rationale: भविष्यद्वाणी के प्रामाणिक कथन-सूत्र को आधुनिक, गरिमापूर्ण हिन्दी में दर्शाता है।
- source_word: הַמֶּלֶךְ
  choice: उस राजा
  rationale: निश्चित पदवी के रूप में परमेश्वर को ‘राजा’ कहा गया है; हिन्दी वाक्य में ‘उस राजा की यह घोषणा है’ कथन-सूत्र को सहज बनाता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नाम-रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: צְבָאוֹת
  choice: सेनाओं का
  rationale: ‘सेनाओं’ से צְבָאוֹת का ठोस अर्थ आधुनिक पाठक के लिए स्पष्ट रहता है; ‘गणों’ जैसा पारंपरिक विकल्प कम स्पष्ट हो सकता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम सीधे आया है। हिन्दी में सुस्थापित लिप्यंतरण ‘यहोवा’ नाम को उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं करता; वैकल्पिक उच्चारण ‘याहवे’ पादटिप्पणी में दिया गया है।
- issue: ‘सदा की नींद’ का आशय
  choice: मृत्यु-रूपी नींद का रूपक यथावत रखना
  alternative: वे मर जाएँगे और फिर कभी नहीं उठेंगे
  rationale: मूल पाठ स्वयं ‘सोने’ और ‘न जागने’ की भाषा बोलता है। उसे सीधे किसी विशेष परलोक-सिद्धांत में बदलने के बजाय रूपक और उसकी धर्मवैचारिक गंभीरता सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। प्रशासनिक पदों की सूची में भेद बनाए रखा गया है। दीर्घ डैश से ‘हाकिमों’ के अंतर्गत आने वाली सूची स्पष्ट होती है, और प्रत्यक्ष कथन की विराम-रचना मूल भविष्यद्वाणी-सूत्र को स्वाभाविक हिन्दी में प्रस्तुत करती है।
