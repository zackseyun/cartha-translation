base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/036.yaml
  text: 'Therefore thus says Yahweh: Behold[a], I am about to plead your case and take vengeance for you[c][b]; I will dry up her sea and make her spring dry.'
translation:
  language: hi
  text: 'इसलिए याहवे यों कहता है:


    “देख, मैं तेरा मुक़दमा लड़ूँगा[a]

    और तेरी ओर से प्रतिशोध लूँगा;

    मैं उसके समुद्र को सुखा दूँगा[b]

    और उसके सोते[c] को सूखा कर दूँगा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तेरे पक्ष में विवाद करूँगा।” इब्रानी में कानूनी विवाद का मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में बाबेल को स्त्री के रूप में चित्रित करके “उसका समुद्र” कहा गया है।
    reason: personification
  - marker: c
    text: या “उसके जल-स्रोत” अथवा “उसके झरने”।
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले कथन से निकलने वाले निष्कर्ष को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: כֹּה אָמַר יְהוָה
  choice: याहवे यों कहता है
  rationale: यह नबूवत में प्रयुक्त संदेशवाहक-सूत्र को बनाए रखता है और יְהוָה को उसके व्यक्तिवाचक नाम के रूप में प्रस्तुत करता है।
- source_word: הִנְנִי
  choice: देख, मैं
  rationale: ‘देख’ दैवी आत्म-प्रस्तुति और आने वाली निर्णायक कार्रवाई की ओर ध्यान खींचता है; मूल में स्पष्ट रूप से न दिए गए कालगत पक्ष को अलग से नहीं जोड़ा गया।
- source_word: רָב אֶת רִיבֵךְ
  choice: तेरा मुक़दमा लड़ूँगा
  rationale: क्रिया और उसी मूल की संज्ञा से बना इब्रानी कानूनी-विवाद मुहावरा हिन्दी में स्पष्ट और स्वाभाविक ढंग से व्यक्त होता है।
- source_word: וְנִקַּמְתִּי אֶת נִקְמָתֵךְ
  choice: तेरी ओर से प्रतिशोध लूँगा
  rationale: सजातीय क्रिया-संज्ञा रचना के न्यायिक और प्रबल भाव को अनावश्यक शाब्दिक पुनरावृत्ति के बिना व्यक्त करता है।
- source_word: וְהַחֲרַבְתִּי אֶת יַמָּהּ
  choice: मैं उसके समुद्र को सुखा दूँगा
  rationale: जलराशि के संदर्भ में חרב का कारक अर्थ ‘सुखा देना’ उपयुक्त है; स्त्रीलिंग प्रत्यय का संबंध स्त्री के रूप में चित्रित बाबेल से है।
- source_word: וְהֹבַשְׁתִּי אֶת מְקוֹרָהּ
  choice: उसके सोते को सूखा कर दूँगा
  rationale: יבש के हिफ़ईल का कारक अर्थ और מָקוֹר की प्राकृतिक जल-स्रोत वाली छवि दोनों सुरक्षित रहते हैं।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु; यहोवा
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत वाचा-नाम आया है; ‘याहवे’ उसे उपाधि में बदले बिना आधुनिक हिन्दी लिप्यंतरण में प्रस्तुत करता है।
- issue: प्रतिशोध का कर्ता और लाभार्थी
  choice: याहवे संबोधित स्त्री-पात्र की ओर से प्रतिशोध लेता है
  alternative: संबोधित पात्र स्वयं प्रतिशोध लेता है
  rationale: प्रथम पुरुष क्रिया का कर्ता याहवे है और स्त्रीलिंग द्वितीय पुरुष प्रत्यय उस पक्ष को चिह्नित करता है जिसके लिए न्याय किया जा रहा है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। काव्यात्मक समानांतरता बनाए रखने के लिए अंतिम दो पंक्तियों में ‘सुखा दूँगा/सूखा कर दूँगा’ रखा गया है। संबोधित पात्र के स्त्रीलिंग को हिन्दी के ‘तेरा’ में व्यक्त नहीं किया जा सकता, पर बाबेल के स्त्री-व्यक्तिकरण को टिप्पणी में स्पष्ट किया गया है।
