source:
  edition: WLC
  text: וְ/לֹֽא יִקְח֤וּ מִמְּ/ךָ֙ אֶ֣בֶן לְ/פִנָּ֔ה וְ/אֶ֖בֶן לְ/מֽוֹסָד֑וֹת כִּֽי שִׁמְמ֥וֹת עוֹלָ֛ם תִּֽהְיֶ֖ה נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/026.yaml
  text: And they will not take from you a stone for a corner or a stone for foundations[a], for you will be everlasting desolations[b], declares Yahweh.
translation:
  language: hi
  text: और वे तुझसे न तो कोने के लिए कोई पत्थर लेंगे, न नींवों के लिए कोई पत्थर[a], क्योंकि तू सदा के लिए उजाड़ ही उजाड़ रहेगी[b]—याहवे की घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कोने का पत्थर” और “नींव का पत्थर।” इब्रानी में शाब्दिक रूप से, “कोने के लिए पत्थर” और “नींवों के लिए पत्थर।”
    reason: lexical_alternative
  - marker: b
    text: या, “स्थायी उजाड़ दशाएँ” या “सदा रहनेवाले उजाड़ स्थान।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקְחוּ
  choice: वे ... लेंगे
  rationale: לקח के क़ाल अपूर्ण, तृतीय पुरुष बहुवचन को निषेध के साथ भावी भविष्यवाणी के रूप में व्यक्त किया गया है।
- source_word: מִמְּךָ
  choice: तुझमें से
  rationale: द्वितीय पुरुष पुल्लिंग एकवचन प्रत्यय बाबेल को व्यक्तिरूप में सीधे संबोधित करता है; पत्थर उसके खंडहरों में से लिए जाने की छवि भी बनी रहती है।
- source_word: אֶבֶן לְפִנָּה
  choice: कोने के लिए कोई पत्थर
  rationale: शाब्दिक संरचना ‘कोने के लिए पत्थर’ को रखा गया है, क्योंकि यह तकनीकी ‘कोने का मुख्य पत्थर’ से कुछ व्यापक हो सकती है।
- source_word: וְאֶבֶן לְמוֹסָדוֹת
  choice: न नींवों के लिए कोई पत्थर
  rationale: מוֹסָדוֹת के बहुवचन ‘नींवों’ और पहले पदबंध के समानांतर निर्माण-बिंब को सुरक्षित रखा गया है; हिन्दी में निषेध की स्वाभाविक समानांतर रचना अपनाई गई है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण बताता है।
- source_word: שִׁמְמוֹת עוֹלָם
  choice: सदा के लिए उजाड़ ही उजाड़
  rationale: שִׁמְמוֹת का बहुवचन तीव्रता और עוֹלָם की स्थायित्व-भावना को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: תִּהְיֶה
  choice: हो जाएगी
  rationale: היה के भविष्यकालीन परिणामी भाव को संदर्भानुकूल रूप से व्यक्त करता है; स्त्रीलिंग बाबेल के निहित संदर्भ के अनुरूप है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: मानक भविष्यवाणी-सूत्र की गंभीरता और प्रत्यक्ष दिव्य नाम दोनों सुरक्षित रखे गए हैं।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे उपस्थित है; ‘याहवे’ उसका पारदर्शी लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
- issue: שִׁמְמוֹת के बहुवचन का अर्थ
  choice: उजाड़ ही उजाड़
  alternative: उजाड़ स्थान; उजाड़ दशाएँ
  rationale: यह हिन्दी में बहुवचन की तीव्रता को स्वाभाविक ढंग से रखता है, बिना यह तय किए कि संकेत अनेक स्थानों की ओर है या पूर्ण विनाश की दशा की ओर।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी; बाबेल को सीधे संबोधित करने के लिए ‘तू’ रखा गया है। ‘न तो...न’ समानांतर निषेध को स्वाभाविक बनाता है, और ‘उजाड़ ही उजाड़’ मूल बहुवचन की तीव्रता व्यक्त करता है।
