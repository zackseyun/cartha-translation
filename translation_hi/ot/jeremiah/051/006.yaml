source:
  edition: WLC
  text: נֻ֣סוּ מִ/תּ֣וֹךְ בָּבֶ֗ל וּ/מַלְּטוּ֙ אִ֣ישׁ נַפְשׁ֔/וֹ אַל תִּדַּ֖מּוּ בַּ/עֲוֺנָ֑/הּ כִּי֩ עֵ֨ת נְקָמָ֥ה הִיא֙ לַֽ/יהוָ֔ה גְּמ֕וּל ה֥וּא מְשַׁלֵּ֖ם לָֽ/הּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/006.yaml
  text: Flee from the midst of Babylon[a], and let each man save his life. Do not be cut off in her iniquity, for this is the time of Yahweh's vengeance; he is repaying her what she deserves.
translation:
  language: hi
  text: बाबेल के बीच से भाग निकलो, और हर एक अपने प्राण बचाए। उसके अधर्म में नष्ट न हो जाओ[a], क्योंकि यह याहवे के प्रतिशोध का समय है; वह उसे उसके कर्मों का बदला दे रहा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके दोष में मिट न जाओ,” अथवा “उसके अधर्म के कारण नष्ट न हो जाओ।” इब्रानी में बाबेल के पाप में सहभागी होने और उसके कारण आने वाले दण्ड में फँसने—दोनों का भाव हो सकता है।
    reason: इब्रानी בַּעֲוֺנָהּ में ‘अधर्म,’ ‘दोष’ और उस दोष के फलस्वरूप दण्ड की अर्थगत व्यापकता है।
lexical_decisions:
- source_word: נֻסוּ מִתּוֹךְ בָּבֶל
  choice: बाबेल के बीच से भाग निकलो
  rationale: बहुवचन आज्ञा נֻסוּ की तात्कालिकता और מִתּוֹךְ के ‘भीतर/बीच से’ भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וּמַלְּטוּ אִישׁ נַפְשׁוֹ
  choice: और हर एक अपने प्राण बचाए
  rationale: नפשׁ को बचाने का इब्रानी मुहावरा यहाँ जीवन बचाने को दर्शाता है; ‘हर एक’ אִישׁ के व्यक्तिवाचक बल को सहज रूप में रखता है।
- source_word: אַל תִּדַּמּוּ בַּעֲוֺנָהּ
  choice: उसके अधर्म में नष्ट न हो जाओ
  rationale: निफ़ाल रूप का निष्क्रिय विनाश-बोध रखा गया है, जबकि ב और עָוֹן की अर्थगत व्यापकता—उसके पाप में सम्मिलित होना अथवा उसके कारण आए दण्ड में मिटना—पादटिप्पणी में सुरक्षित है।
- source_word: עֵת נְקָמָה הִיא לַיהוָה
  choice: यह यहोवा के प्रतिशोध का समय है
  rationale: निर्धारित दैवी प्रतिदान के समय को व्यक्त करता है और יהוה को उसके व्यक्तिगत वाचा-नाम ‘यहोवा’ से प्रस्तुत करता है।
- source_word: גְּמוּל הוּא מְשַׁלֵּם לָהּ
  choice: वह उसे उसके किए का बदला चुका रहा है
  rationale: גְּמוּל और מְשַׁלֵּם के प्रतिदान-बोध को अनावश्यक शब्द-पुनरावृत्ति के बिना स्वाभाविक हिन्दी में व्यक्त करता है; कृदन्त का जारी/आसन्न क्रिया-भाव भी बना रहता है।
theological_decisions:
- issue: יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम है। आधुनिक हिन्दी बाइबलीय प्रयोग में ‘यहोवा’ व्यापक रूप से पहचाना जाता है, यद्यपि ‘याहवे’ सम्भावित उच्चारण के अधिक निकट माना जाता है।
- issue: בַּעֲוֺנָהּ में पाप और दण्ड का संबंध
  choice: उसके अधर्म में नष्ट न हो जाओ
  alternative: उसके अधर्म के कारण नष्ट न हो जाओ
  rationale: मुख्य पाठ ב के ‘में’ भाव और עָוֹן के ‘अधर्म’ अर्थ को रखता है तथा इस तनाव को खुला छोड़ता है कि चेतावनी बाबेल के पाप में सहभागी होने की है, उसके दण्ड में फँसने की है, या दोनों की।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सीधी रखी गई है। ‘भाग निकलो’ आदेश की तात्कालिकता, ‘अपने प्राण बचाए’ बाइबलीय गरिमा, और ‘उसके किए का बदला’ न्यायोचित प्रतिदान का सामान्य-बोध बनाए रखते हैं।
