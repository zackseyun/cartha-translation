base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/025.yaml
  text: Behold, I am against you, O destroying mountain, declares Yahweh, which destroys the whole earth. I will stretch out my hand against you, and roll you down from the crags, and make you a burned mountain.
translation:
  language: hi
  text: “देखो, हे विनाश करनेवाले पर्वत, जो सारी पृथ्वी[a] को नष्ट करता है, मैं तेरे विरुद्ध हूँ,” याहवे की घोषणा है। “मैं अपना हाथ तेरे विरुद्ध बढ़ाऊँगा, तुझे चट्टानों से नीचे लुढ़का दूँगा और तुझे जला हुआ पर्वत[b] बना दूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सारे देश’। हिब्रू शब्द אֶרֶץ का अर्थ संदर्भ के अनुसार ‘देश’ या ‘पृथ्वी’ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘जलता हुआ पर्वत’ अथवा ‘दहन का पर्वत’। हिब्रू वाक्यांश संक्षिप्त है और जलने की प्रक्रिया या जल जाने की परिणति, दोनों में से किसी पर बल दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי אֵלֶיךָ
  choice: देखो, मैं तेरे विरुद्ध हूँ
  rationale: הִנְנִי की ध्यान आकर्षित करनेवाली भविष्यवाणी-संबंधी शक्ति को ‘देखो’ से और אֵלֶיךָ के विरोधात्मक अर्थ को ‘तेरे विरुद्ध’ से स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: הַר הַמַּשְׁחִית
  choice: हे विनाश करनेवाले पर्वत
  rationale: ‘पर्वत’ के रूपक को व्याख्यात्मक रूप से ‘बाबुल’ में बदलने के बजाय सुरक्षित रखा गया है; कृदन्त הַמַּשְׁחִית का सक्रिय बल ‘विनाश करनेवाले’ में बना रहता है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: यह भविष्यवाणी की औपचारिक उद्घोषणा है। יְהוָה को उसके विशिष्ट नाम ‘याहवे’ के रूप में रखा गया है।
- source_word: הַמַּשְׁחִית אֶת כָּל הָאָרֶץ
  choice: तू जो सारी पृथ्वी का विनाश करता है
  rationale: दूसरा कृदन्त पर्वत को सीधे संबोधित करते हुए उसके कार्य का वर्णन करता है। व्यापक संदर्भ में ‘पृथ्वी’ उपयुक्त है, पर ‘देश’ की वास्तविक lexical संभावना पादटिप्पणी में रखी गई है।
- source_word: וְנָטִיתִי אֶת יָדִי עָלֶיךָ
  choice: मैं अपना हाथ तेरे विरुद्ध बढ़ाऊँगा
  rationale: न्याय के लिए परमेश्वर की सक्रियता दर्शानेवाले मूल शारीरिक रूपक को ज्यों का त्यों रखा गया है।
- source_word: וְגִלְגַּלְתִּיךָ מִן הַסְּלָעִים
  choice: तुझे चट्टानों से लुढ़का दूँगा
  rationale: גּלל की लुढ़काने की गति और סְלָעִים की पथरीली पर्वतीय छवि दोनों स्पष्ट रहती हैं; ‘दूँगा’ कारक क्रिया को स्वाभाविक हिन्दी देता है।
- source_word: וּנְתַתִּיךָ לְהַר שְׂרֵפָה
  choice: तुझे जला हुआ पर्वत बना दूँगा
  rationale: נָתַן לְ के परिणामी अर्थ को ‘बना दूँगा’ से व्यक्त किया गया है। संक्षिप्त और कठिन שְׂרֵפָה को परिणामात्मक ‘जला हुआ’ माना गया है, जबकि प्रक्रिया-केंद्रित विकल्प पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में विशिष्ट वाचा-नाम है; उसे सामान्य उपाधि में बदलने के बजाय लिप्यंतरित किया गया है।
- issue: הָאָרֶץ का विस्तार
  choice: सारी पृथ्वी
  alternative: सारा देश
  rationale: बाबुल की व्यापक विनाशकारी शक्ति के संदर्भ में सार्वभौमिक अलंकार ‘पृथ्वी’ से बेहतर प्रकट होता है, पर हिब्रू शब्द की स्थानीय ‘देश’ वाली संभावना निर्णायक रूप से हटाई नहीं गई।
- issue: ‘विनाश करनेवाला पर्वत’ की पहचान
  choice: रूपक को अनिर्दिष्ट रखते हुए ‘पर्वत’
  alternative: बाबुल
  rationale: संदर्भ इसका संकेत बाबुल की ओर करता है, फिर भी पद स्वयं रूपक का प्रयोग करता है; अनुवाद में उसकी काव्यात्मक और धर्मवैचारिक तनावशीलता बनाए रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर भविष्यवाणीपरक शैली रखी गई है। एकवचन ‘तू/तेरे’ मूल के प्रत्यक्ष, कठोर संबोधन और बाबुल के मानवीकरण को बनाए रखता है। ‘पर्वत’, ‘हाथ बढ़ाना’, ‘चट्टानें’ और ‘लुढ़काना’ जैसी मूल चित्रात्मकताओं को सरल व्याख्या से प्रतिस्थापित नहीं किया गया।
