reference: Jeremiah 51:48
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/רִנְּנ֤וּ עַל בָּבֶל֙ שָׁמַ֣יִם וָ/אָ֔רֶץ וְ/כֹ֖ל אֲשֶׁ֣ר בָּ/הֶ֑ם כִּ֧י מִ/צָּפ֛וֹן יָבוֹא לָ֥/הּ הַ/שּׁוֹדְדִ֖ים נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/048.yaml
  text: Then heaven and earth[a], and all that is in them, will shout for joy over Babylon, for from the north destroyers will come against her[c][b], declares Yahweh.
translation:
  language: hi
  text: तब आकाश और पृथ्वी और जो कुछ उनमें है, सब बाबेल पर आनन्द से जयजयकार करेंगे,[a] क्योंकि उत्तर दिशा से विनाश करनेवाले उस पर चढ़ आएँगे,[b] यह याहवे की वाणी है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘आनन्द से गीत गाएँगे।’
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक अर्थ ‘उसके पास आएँगे’ है; प्रसंग में यह शत्रुतापूर्ण आगमन है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרִנְּנוּ
  choice: तब ... आनन्द से जयजयकार करेंगे
  rationale: רנן ऊँचे स्वर में आनन्द प्रकट करने को सूचित करता है। ‘आनन्द से जयजयकार करेंगे’ इसकी मुखर और उत्सवपूर्ण शक्ति रखता है; आरम्भिक וְ को प्रसंगानुसार परिणामसूचक ‘तब’ से व्यक्त किया गया है।
- source_word: עַל בָּבֶל
  choice: बाबेल पर
  rationale: आनन्द मनाने के क्रियापद के साथ עַל उस व्यक्ति या घटना को सूचित कर सकता है जिसके कारण आनन्द है। ‘बाबेल पर’ उसके पतन पर सृष्टि के आनन्द को संक्षेप में व्यक्त करता है।
- source_word: שָׁמַיִם וָאָרֶץ וְכֹל אֲשֶׁר בָּהֶם
  choice: आकाश और पृथ्वी और जो कुछ उनमें है, सब
  rationale: यह समस्त सृष्टि को समेटने वाला युग्म है। अन्त का ‘सब’ हिन्दी में संयुक्त कर्ता को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ כִּי सृष्टि के आनन्द का कारण प्रस्तुत करता है।
- source_word: מִצָּפוֹן
  choice: उत्तर दिशा से
  rationale: दिशासूचक अर्थ को सीधे और स्वाभाविक आधुनिक हिन्दी में रखा गया है।
- source_word: יָבוֹא לָהּ
  choice: उस पर चढ़ आएँगे
  rationale: शाब्दिक अर्थ ‘उसके पास/लिए आएँगे’ है, पर विनाश करनेवालों के सन्दर्भ में आगमन स्पष्टतः आक्रमणकारी है। ‘उस पर चढ़ आएँगे’ उस शत्रुतापूर्ण गति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַשּׁוֹדְדִים
  choice: विनाश करनेवाले
  rationale: שׁדד से बना यह पद उजाड़ने, लूटने या विनाश करनेवालों को सूचित करता है। व्यापक न्याय-सन्दर्भ में ‘विनाश करनेवाले’ उपयुक्त है और केवल लूट तक अर्थ सीमित नहीं करता।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की वाणी है
  rationale: मानक भविष्यद्वाणी-सूत्र की गम्भीरता बनाए रखी गई है और יהוה को उसके निजी वाचा-नाम ‘याहवे’ से प्रस्तुत किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुरक्षरीय निजी नाम יהוה है। ‘याहवे’ उसे उपाधि में बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: बाबेल के पतन पर समस्त सृष्टि का आनन्द
  choice: कथन को मूल की तरह सीधे रखा गया है
  alternative: इसे केवल मनुष्यों अथवा काव्यात्मक प्रकृति-वर्णन तक सीमित करना
  rationale: ‘आकाश और पृथ्वी और जो कुछ उनमें है’ मूल में व्यापक ब्रह्माण्डीय भाषा है। अनुवाद उसकी सीमा या धर्मवैज्ञानिक आशय को चुपचाप संकुचित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक पाठ के अनुकूल शैली। ‘बाबेल’ मूल नाम בבל के निकट है। ‘जयजयकार’ मुखर आनन्द को और ‘चढ़ आएँगे’ आक्रमणकारी प्रसंग को स्वाभाविक हिन्दी में व्यक्त करते हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
