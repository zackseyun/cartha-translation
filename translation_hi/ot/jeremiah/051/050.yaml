base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/050.yaml
  text: You who have escaped the sword[a], go; do not stand still. Remember Yahweh from far away, and let Jerusalem come upon your heart.
translation:
  language: hi
  text: तुम जो तलवार से बच निकले हो, आगे बढ़ो; रुके मत रहो। दूर से याहवे को स्मरण करो, और यरूशलेम तुम्हारे हृदय में उभरे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “यरूशलेम तुम्हारे हृदय पर चढ़े”; अर्थात वह तुम्हारे मन में आए और तुम्हें उसकी चिंता रहे।
    reason: हिब्रू मुहावरे के शाब्दिक चित्र और उसके अर्थ-क्षेत्र को स्पष्ट करना।
lexical_decisions:
- source_word: פְּלֵטִים מֵחֶרֶב
  choice: तुम जो तलवार से बच निकले हो
  rationale: बहुवचन कर्मवाच्य कृदंत का संबोधनात्मक बल स्पष्ट करता है और מִן को ‘से’ द्वारा बनाए रखता है।
- source_word: הִלְכוּ אַל תַּעֲמֹדוּ
  choice: आगे बढ़ो; रुके मत रहो
  rationale: दोनों आदेशों का व्यावहारिक आशय संकट के स्थान पर न ठहरकर चलते रहने का है; यह आधुनिक हिन्दी में स्वाभाविक है।
- source_word: זִכְרוּ מֵרָחוֹק אֶת יְהוָה
  choice: दूर से याहवे को स्मरण करो
  rationale: मासोरेटिक शब्दक्रम के अनुसार ‘दूर से’ को स्मरण करने की क्रिया से जोड़ा गया है और वाचा-नाम को ‘याहवे’ रूप में रखा गया है।
- source_word: וִירוּשָׁלִַם תַּעֲלֶה עַל לְבַבְכֶם
  choice: और यरूशलेम तुम्हारे हृदय में उठे
  rationale: शाब्दिक रूपक ‘हृदय पर चढ़े’ को अत्यधिक अस्वाभाविक बनाए बिना उसके उठने/मन में आने के चित्र को सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है; लिप्यंतरण उसे सामान्य उपाधि में बदलने से बचाता है।
- issue: यरूशलेम का ‘हृदय में उठना’
  choice: रूपक को बनाए रखा
  alternative: यरूशलेम को याद करो / यरूशलेम तुम्हें याद आए
  rationale: हिब्रू अभिव्यक्ति स्मरण के साथ लगाव और चिंता का भाव भी रख सकती है; अधिक स्पष्ट अनुवाद उस व्यापकता को सीमित कर सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन सीधा, आदेश संक्षिप्त और गरिमापूर्ण हैं। ‘स्मरण करो’ वाचिक गरिमा तथा वाचा-संबंधी प्रतिध्वनि बनाए रखता है।
