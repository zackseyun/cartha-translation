source:
  edition: WLC
  text: אכל/נו הממ/נו נְבוּכַדְרֶאצַּר֮ מֶ֣לֶךְ בָּבֶל֒ הציג/נו כְּלִ֣י רִ֔יק בלע/נו כַּ/תַּנִּ֔ין מִלָּ֥א כְרֵשׂ֖/וֹ מֵֽ/עֲדָנָ֑/י הדיח/נו׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/034.yaml
  text: Nebuchadnezzar king of Babylon has devoured me[a]; he has crushed me. He has set me down like an empty vessel; he has swallowed me like a sea monster; he has filled his belly with my delicacies[c][b]; he has cast me out.
translation:
  language: hi
  text: बाबुल के राजा नबूकदनेस्सर ने मुझे खा लिया; उसने मुझे चूर-चूर कर दिया। उसने मुझे एक खाली बरतन की तरह रख दिया; उसने समुद्री दैत्य[a] की तरह मुझे निगल लिया। उसने मेरी स्वादिष्ट वस्तुओं[b][c] से अपना पेट भर लिया; उसने मुझे बाहर फेंक दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “विशाल सर्प,” “ड्रैगन,” अथवा “अजगर।” हिब्रू शब्द तन्नीन किसी बड़े सर्पाकार, दैत्याकार या समुद्री जीव के लिए आ सकता है; यहाँ निगलने की छवि के कारण “समुद्री दैत्य” रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: या “मेरी उत्तम वस्तुओं” अथवा “मेरी मनभावनी वस्तुओं।”
    reason: lexical_alternative
  - marker: c
    text: हिब्रू के व्यंजन-पाठ में इन क्रियाओं के साथ “हमें” पढ़ा जा सकता है, जबकि पारंपरिक पाठन (क़ेरे) “मुझे” है। संदर्भ में वक्ता व्यक्तिरूप सिय्योन/यरूशलेम है; इसलिए मुख्य पाठ में “मुझे” रखा गया है।
    reason: textual_ambiguity
lexical_decisions:
- source_word: אכלנו
  choice: हमें खा लिया
  rationale: אכל का मूल अर्थ ‘खाना’ है और यहाँ हिंसक भक्षण का रूपक है। ‘खा लिया’ आधुनिक हिन्दी में सीधा और सजीव है; प्रत्यय के बहुवचन भाव ‘हमें’ को भी सुरक्षित रखता है।
- source_word: הממנו
  choice: हमें चूर-चूर कर दिया
  rationale: המם यहाँ विनाश और तहस-नहस कर देने का भाव देता है। यह चयन पिछले भक्षण-रूपक के समानांतर विनाशकारी बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הציגנו כלי ריק
  choice: हमें खाली बरतन की तरह रख दिया
  rationale: הציג के ठोस ‘रख देना/स्थापित करना’ भाव और כלי ריק की उपमा दोनों को बनाए रखा गया है; ‘बना दिया’ कहने से मूल की ठोस क्रिया दब जाती।
- source_word: בלענו
  choice: हमें निगल लिया
  rationale: בלע का सीधा अर्थ ‘निगलना’ है; मूल की तीखी और शारीरिक छवि को बिना नरम किए रखा गया है।
- source_word: כתנין
  choice: समुद्री दैत्य
  rationale: תנין किसी विशाल सर्पाकार, दैत्याकार अथवा समुद्री जीव को सूचित कर सकता है। निगलने के संदर्भ में ‘समुद्री दैत्य’ उपयुक्त है, जबकि अन्य सम्भावना पादटिप्पणी में रखी गई है।
- source_word: מלא כרשו
  choice: अपना पेट भर लिया
  rationale: כרשׂ पेट/उदर को सूचित करता है। ‘पेट भर लिया’ स्वाभाविक हिन्दी है और विजेता के लूट पर भकोसने की विकराल छवि बनाए रखता है।
- source_word: מעדני
  choice: मेरी स्वादिष्ट वस्तुओं
  rationale: מעדנים स्वादिष्ट, मनभावनी या बहुमूल्य वस्तुओं को सूचित करता है। भोजन-संबंधी रूपक में ‘स्वादिष्ट वस्तुएँ’ मुख्य अर्थ को व्यक्त करती हैं, पर व्यापक विकल्प पादटिप्पणी में दिया गया है।
- source_word: הדיחנו
  choice: हमें बाहर फेंक दिया
  rationale: यह क्रिया यहाँ निकाल देने या फेंक देने का भाव देती है और सम्भवतः निगलने के रूपक को आगे बढ़ाती है। ‘बाहर फेंक दिया’ विशिष्ट शारीरिक अर्थ को अनावश्यक रूप से थोपे बिना हिंसक अस्वीकृति व्यक्त करता है।
theological_decisions:
- issue: वक्ता और सर्वनामों की संख्या
  choice: क्रियाओं के साथ ‘हमें’, पर מעדני के साथ ‘मेरी’
  alternative: पूरे पद में ‘मुझे/मेरी’
  rationale: हिब्रू क्रियात्मक प्रत्यय बहुवचन ‘हमें’ का रूप रखते हैं, जबकि מעדני स्पष्ट रूप से ‘मेरी स्वादिष्ट वस्तुएँ’ है। सिय्योन/यरूशलेम के सामूहिक और व्यक्तिरूप वक्ता के बीच यह काव्यात्मक परिवर्तन वास्तविक पाठगत तनाव है, इसलिए हिन्दी में उसे एकरूप करके मिटाया नहीं गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में dignified किन्तु सहज काव्यात्मक गद्य रखा गया है। ‘नबूकदनेस्सर’ और ‘बाबुल’ प्रचलित हिन्दी बाइबलीय नामरूप हैं। भक्षण, खाली बरतन और बाहर फेंकने की परस्पर जुड़ी ठोस छवियों को बनाए रखा गया है।
