  text: Runner runs to meet runner[a], and messenger to meet messenger[b], to tell the king of Babylon that his city has been captured from end to end.
translation:
  language: hi
  text: एक धावक दूसरे धावक से मिलने दौड़ेगा, और एक संदेशवाहक दूसरे संदेशवाहक से मिलने दौड़ेगा, बाबेल के राजा को यह बताने के लिए कि उसके नगर पर एक छोर से दूसरे छोर तक कब्ज़ा कर लिया गया है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक शब्दशः, “उसके नगर पर एक छोर से कब्ज़ा कर लिया गया है।” इब्रानी पदबंध का अर्थ यह भी हो सकता है कि नगर पर कब्ज़ा किसी एक सिरे से आरम्भ हुआ; प्रसंग में यह पूरे नगर के पतन का संकेत भी दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רָץ ... רָץ יָרוּץ
  choice: एक धावक दूसरे धावक से मिलने दौड़ेगा
  rationale: संज्ञा/कृदंत और उसी धातु की क्रिया की पुनरावृत्ति तीव्रता और लगातार पहुँचते धावकों का सजीव दृश्य बनाती है। हिन्दी में ‘धावक ... दौड़ेगा’ इस शैलीगत प्रभाव को स्वाभाविक रूप से बनाए रखता है।
- source_word: לִקְרַאת
  choice: से मिलने
  rationale: यह पद किसी की ओर बढ़कर उससे मिलने का भाव देता है; ‘से मिलने’ आधुनिक हिन्दी में स्पष्ट और सहज है।
- source_word: וּמַגִּיד לִקְרַאת מַגִּיד
  choice: और एक संदेशवाहक दूसरे संदेशवाहक से मिलने जाएगा
  rationale: מַגִּיד समाचार सुनाने या सूचना देने वाले व्यक्ति को दर्शाता है। ‘संदेशवाहक’ प्रसंगानुकूल है। हिन्दी में अधूरी क्रियात्मक रचना से बचने के लिए ‘जाएगा’ जोड़ा गया है, जो पूर्ववर्ती गति के भाव को आगे बढ़ाता है।
- source_word: לְהַגִּיד לְמֶלֶךְ בָּבֶל
  choice: ताकि बाबेल के राजा को बताए
  rationale: उद्देश्यसूचक रचना और समाचार के प्राप्तकर्ता—दोनों को सीधे और स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: נִלְכְּדָה עִירוֹ
  choice: उसके नगर पर ... कब्ज़ा कर लिया गया है
  rationale: निफ़अल रूप नगर के पकड़े जाने या अधिकार में ले लिए जाने की पूर्ण निष्क्रिय घटना बताता है। ‘उसके’ मूल के सर्वनाम-सूचक प्रत्यय को सुरक्षित रखता है।
- source_word: מִקָּצֶה
  choice: एक छोर से दूसरे छोर तक
  rationale: मूलतः ‘एक छोर से’ का अर्थ संभव है, पर इस प्रसंग में वाक्यांश नगर के व्यापक पतन को सूचित कर सकता है। मुख्य पाठ में स्वाभाविक प्रसंगगत अर्थ रखा गया है और अधिक औपचारिक विकल्प पादटिप्पणी में दिया गया है।
