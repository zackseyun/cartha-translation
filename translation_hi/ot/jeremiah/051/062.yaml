reference: Jeremiah 51:62
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אָמַרְתָּ֗ יְהוָה֙ אַתָּ֨ה דִבַּ֜רְתָּ אֶל הַ/מָּק֤וֹם הַ/זֶּה֙ לְ/הַכְרִית֔/וֹ לְ/בִלְתִּ֤י הֱיֽוֹת בּ/וֹ֙ יוֹשֵׁ֔ב לְ/מֵ/אָדָ֖ם וְ/עַד בְּהֵמָ֑ה כִּֽי שִׁמְמ֥וֹת עוֹלָ֖ם תִּֽהְיֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/062.yaml
  text: and say[a], ‘O Yahweh, you yourself have spoken concerning this place, to cut it off so that no inhabitant will be in it, from man to beast[c][b]; for it will become everlasting desolations.’
translation:
  language: hi
  text: और कहना, “हे याहवे, तूने स्वयं इस स्थान के विषय में कहा है कि तू इसे नष्ट कर देगा, ताकि इसमें कोई निवासी न रहे—मनुष्य से लेकर पशु तक[a]—क्योंकि यह सदा के लिए उजाड़ हो जाएगा[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “मनुष्य से लेकर पशु तक”; यह मनुष्यों और पशुओं—दोनों की पूर्ण अनुपस्थिति बताने वाला सूत्र है।
    reason: cultural_note
  - marker: b
    text: या “यह चिरस्थायी उजाड़ बन जाएगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: और कहना
  rationale: संयोजक वाव के साथ पूर्ण क्रिया यहाँ निर्देशों की शृंखला को आगे बढ़ाती है; हिन्दी में ‘और कहना’ स्वाभाविक आज्ञार्थक निरंतरता व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को उपाधि से प्रतिस्थापित न करके हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ रखा गया है।
- source_word: אַתָּה דִבַּרְתָּ
  choice: तूने स्वयं ... कहा है
  rationale: स्वतंत्र सर्वनाम אַתָּה क्रिया के कर्ता पर बल देता है; ‘स्वयं’ उस बल को सुरक्षित रखता है।
- source_word: דִבַּרְתָּ אֶל הַמָּקוֹם הַזֶּה
  choice: इस स्थान के विषय में कहा है
  rationale: אֶל का मूल अर्थ ‘की ओर/से’ है, पर निर्जीव स्थान और न्याय-संदर्भ में ‘के विषय में’ स्वाभाविक है तथा अनावश्यक रूप से ‘विरुद्ध’ नहीं जोड़ता।
- source_word: לְהַכְרִיתוֹ
  choice: इसे नष्ट कर देगा
  rationale: כרת के हिफ़ील रूप का यहाँ आशय किसी स्थान का निर्णायक उन्मूलन है। शाब्दिक ‘काट डालना’ हिन्दी में स्थान के संदर्भ में अस्वाभाविक होता; ‘नष्ट करना’ प्रसंगगत अर्थ स्पष्ट करता है।
- source_word: לְבִלְתִּי הֱיוֹת בּוֹ יוֹשֵׁב
  choice: ताकि इसमें कोई निवासी न रहे
  rationale: उद्देश्य/परिणाम की रचना और יוֹשֵׁב के निवासी-संबंधी भाव को संक्षिप्त, स्वाभाविक हिन्दी में रखा गया है।
- source_word: לְמֵאָדָם וְעַד בְּהֵמָה
  choice: मनुष्य से लेकर पशु तक
  rationale: यह समग्रता बताने वाला सूत्र है, जो मनुष्यों और पशुओं दोनों की पूर्ण अनुपस्थिति व्यक्त करता है; हिन्दी में स्रोत की ‘से...तक’ संरचना सुरक्षित है।
- source_word: שִׁמְמוֹת עוֹלָם תִּהְיֶה
  choice: यह सदा के लिए उजाड़ पड़ा रहेगा
  rationale: שִׁמְמוֹת का बहुवचन तीव्र/व्यापक उजाड़ अवस्था सूचित कर सकता है। हिन्दी में कृत्रिम ‘उजाड़ों’ के बजाय ‘उजाड़ पड़ा रहेगा’ परिणामस्वरूप स्थायी अवस्था को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत दिव्य नाम है, इसलिए ‘प्रभु’ जैसी उपाधि नहीं रखी गई। आधुनिक हिन्दी बाइबल-पाठकों के लिए ‘यहोवा’ अधिक पहचाना हुआ लिप्यंतरण है, यद्यपि ‘याहवे’ विद्वत् पुनर्निर्माण के अधिक निकट माना जाता है।
- issue: אָדָם का समष्टिगत अर्थ
  choice: मनुष्य
  alternative: लोग
  rationale: यहाँ אָדָם किसी एक पुरुष के बजाय मानव जाति को पशुओं के साथ समग्र निर्जनता के सूत्र में रखता है। ‘मनुष्य’ स्रोत का सामान्य मानवीय अर्थ बनाए रखता है।
- issue: עוֹלָם की कालगत शक्ति
  choice: सदा के लिए
  alternative: दीर्घकाल तक
  rationale: न्यायवाणी में यह स्थायी अथवा अनिश्चित रूप से दीर्घ उजाड़पन व्यक्त करता है। ‘सदा के लिए’ कथन की शक्ति बनाए रखता है, जबकि उसकी दार्शनिक प्रकृति के बारे में अतिरिक्त निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। ‘तू’ प्रत्यक्ष प्रार्थनात्मक संबोधन की निकटता और एकवचनता को दर्शाता है। स्रोत के अर्थ को स्पष्ट करने के लिए ‘नष्ट कर देगा’ चुना गया, जबकि अंतिम पदबंध को मुहावरेदार हिन्दी में प्रस्तुत किया गया है।
