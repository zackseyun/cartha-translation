  yaml_path: translation/ot/jeremiah/035/010.yaml
  text: So we have lived in tents[b][a], and we have obeyed and done all that Jonadab our father commanded us.
translation:
  language: hi
  text: इसलिए हम तंबुओं में रहते आए हैं, और हमने अपने पिता योनादाब की आज्ञा मानी है और वह सब किया है जिसकी उसने हमें आज्ञा दी थी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप में, “हमने सुना और वह सब किया जिसकी हमारे पिता योनादाब ने हमें आज्ञा दी थी।” इब्रानी में “सुनना” आज्ञा के संदर्भ में अक्सर उसे मानने का भाव भी रखता है। यहाँ “पिता” से समुदाय के कुलपुरुष योनादाब का संकेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנֵּשֶׁב בָּאֳהָלִים
  choice: हम तंबुओं में रहते आए हैं
  rationale: ישׁב यहाँ बैठने नहीं, निवास करने के अर्थ में है। ‘रहते आए हैं’ वक्ताओं की अब तक जारी जीवन-पद्धति को स्वाभाविक हिन्दी में व्यक्त करता है; अनिश्चित बहुवचन ‘तंबुओं में’ किसी खास तंबुओं की ओर संकेत नहीं करता।
- source_word: וַנִּשְׁמַע
  choice: हमने ... आज्ञा मानी
  rationale: שׁמע आज्ञा के संदर्भ में केवल सुनने के बजाय ध्यान देकर मानने का भाव रखता है। ‘आज्ञा मानी’ हिन्दी में इस आज्ञापालन को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: וַנַּעַשׂ כְּכֹל אֲשֶׁר
  choice: और वह सब किया है जिसकी
  rationale: עשה वास्तविक पालन को बताता है और כְּכֹל אֲשֶׁר पूर्ण अनुरूपता व्यक्त करता है। यह रूप इब्रानी के ‘सुनना/मानना और करना’ युग्म तथा समग्रता को बनाए रखता है।
- source_word: צִוָּנוּ
  choice: आज्ञा उसने हमें दी थी
  rationale: צוה अधिकारपूर्वक आदेश देने का सामान्य शब्द है। हिन्दी में ‘आज्ञा देना’ पारिवारिक अधिकार और निर्देश दोनों को गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: יוֹנָדָב
  choice: योनादाब
  rationale: नाम के इब्रानी रूप יוֹנָדָב का हिन्दी लिप्यंतरण ‘योनादाब’ है।
- source_word: אָבִינוּ
  choice: अपने पूर्वज
  rationale: शाब्दिक अर्थ ‘हमारा पिता’ है, पर इस प्रसंग में योनादाब बहुत पहले का कुलपुरुष है। आधुनिक हिन्दी में ‘पूर्वज’ आशय को स्पष्ट करता है और जैविक पिता की गलत समझ से बचाता है।
theological_decisions:
- issue: आज्ञा के संबंध में שׁמע का अर्थ
  choice: आज्ञा मानी
  alternative: सुना और किया
  rationale: प्रसंग आज्ञा के निष्ठापूर्ण पालन पर बल देता है, और इब्रानी में שׁמע आज्ञा के साथ प्रायः आज्ञापालन का अर्थ रखता है। फिर भी शाब्दिक ‘सुना’ की संरचना पाठ में निहित है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
- issue: אָבִינוּ का संबंधसूचक अर्थ
  choice: अपने पूर्वज
  alternative: हमारे पिता
  rationale: इब्रानी का शाब्दिक रूप ‘हमारा पिता’ है, लेकिन योनादाब यहाँ रेकाबी समुदाय का पुरखा है। ‘पूर्वज’ आधुनिक पाठक को ऐतिहासिक संबंध स्पष्ट करता है, जबकि शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण स्तर रखा गया है। ‘तंबुओं में रहते आए हैं’ निरंतर चली आ रही जीवन-पद्धति दर्शाता है। वाक्यक्रम हिन्दी की स्वाभाविकता के लिए बदला गया है, जबकि आज्ञा मानने और उसे व्यवहार में करने की इब्रानी समानांतरता सुरक्षित है।
