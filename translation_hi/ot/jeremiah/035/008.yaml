base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/008.yaml
  text: 'So we have obeyed the voice of Jehonadab son of Rechab[a], our father, in everything that he commanded us: not to drink wine all our days—we, our wives, our sons[b], and our daughters.'
translation:
  language: hi
  text: 'और हमने अपने पिता, रेकाब के पुत्र यहोनादाब, की बात मानी है[a] और उसने हमें जो कुछ आज्ञा दी थी उसका पालन किया है: कि हम—हम, हमारी पत्नियाँ, हमारे बेटे और हमारी बेटियाँ—जीवन भर दाखमधु न पीएँ।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “की आवाज़ सुनी” है; यह मुहावरा किसी की बात या आज्ञा मानने के अर्थ में प्रयुक्त होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּשְׁמַע בְּקוֹל
  choice: हमने ... की बात मानी है
  rationale: שׁמע בְּקוֹל एक मुहावरा है जिसका अर्थ केवल सुनना नहीं, बल्कि किसी की बात या आज्ञा मानना है। हिन्दी में ‘की बात मानी है’ स्वाभाविक ढंग से यही अर्थ व्यक्त करता है।
- source_word: יְהוֹנָדָב בֶּן־רֵכָב
  choice: रेकाब के पुत्र यहोनादाब
  rationale: नामों का मूल इब्रानी रूप के निकट देवनागरी लिप्यंतरण किया गया है; वंश-संबंध के लिए स्वाभाविक हिन्दी क्रम रखा गया है।
- source_word: אָבִינוּ
  choice: अपने पूर्वज
  rationale: शाब्दिक अर्थ ‘हमारा पिता’ है, पर प्रसंग में यहोनादाब कई पीढ़ियों पहले का कुलपुरुष है। ‘पूर्वज’ आधुनिक पाठक के लिए वास्तविक संबंध स्पष्ट करता है, जबकि पारिवारिक पहचान बनी रहती है।
- source_word: לְכֹל אֲשֶׁר צִוָּנוּ
  choice: उन सब बातों का पालन किया है जिनकी उसने हमें आज्ञा दी थी
  rationale: व्यापकता (‘सब’) और आज्ञापालन, दोनों को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: לְבִלְתִּי שְׁתוֹת יַיִן
  choice: दाखमधु न पिएँ
  rationale: यह आज्ञा की विषयवस्तु है। יַיִן के लिए पारंपरिक किन्तु समझने योग्य ‘दाखमधु’ चुना गया है, जो अंगूर से बने मद्य को सूचित करता है।
- source_word: כָּל־יָמֵינוּ
  choice: जीवन भर
  rationale: शाब्दिक ‘हमारे सब दिन’ का स्वाभाविक आधुनिक हिन्दी समतुल्य, जिसमें आजीवन अवधि का पूरा अर्थ सुरक्षित है।
- source_word: אֲנַחְנוּ נָשֵׁינוּ בָּנֵינוּ וּבְנֹתֵינוּ
  choice: न हम, न हमारी पत्नियाँ, न हमारे बेटे और न हमारी बेटियाँ
  rationale: मूल की प्रत्येक पारिवारिक श्रेणी स्पष्ट रखी गई है। निषेधात्मक पुनरावृत्ति हिन्दी में आज्ञा के सामूहिक विस्तार को सुबोध बनाती है।
