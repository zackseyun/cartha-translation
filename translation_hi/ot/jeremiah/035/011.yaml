  text: וַ/יְהִ֗י בַּ/עֲל֨וֹת נְבוּכַדְרֶאצַּ֥ר מֶֽלֶךְ בָּבֶל֮ אֶל הָ/אָרֶץ֒ וַ/נֹּ֗אמֶר בֹּ֚אוּ וְ/נָב֣וֹא יְרוּשָׁלִַ֔ם מִ/פְּנֵי֙ חֵ֣יל הַ/כַּשְׂדִּ֔ים וּ/מִ/פְּנֵ֖י חֵ֣יל אֲרָ֑ם וַ/נֵּ֖שֶׁב בִּ/ירוּשָׁלִָֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/011.yaml
  text: But when Nebuchadnezzar king of Babylon came up against the land[a], we said, ‘Come[b], and let us go to Jerusalem because of the army of the Chaldeans and because of the army of Aram.’ So we settled in Jerusalem.
translation:
  language: hi
  text: पर जब बाबेल का राजा नबूकदनेस्सर देश पर चढ़ आया, तब हमने कहा, ‘आओ, हम कसदियों की सेना और अराम की सेना के कारण यरूशलेम चलें।’ तब हम यरूशलेम में बस गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בַּעֲלוֹת
  choice: पर जब ... चढ़ आया
  rationale: कथात्मक वाव और कालसूचक infinitive construct को स्वाभाविक हिन्दी में हल्के विरोध तथा समय-संबंध के साथ व्यक्त करता है; सैनिक संदर्भ में ‘चढ़ आया’ आक्रमणकारी बढ़त का संकेत देता है।
- source_word: נְבוּכַדְרֶאצַּר מֶלֶךְ בָּבֶל
  choice: बाबेल का राजा नबूकदनेस्सर
  rationale: राजकीय उपाधि और नाम को स्रोत के अनुसार रखा गया है; ‘बाबेल’ आधुनिक हिन्दी बाइबलीय प्रयोग में परिचित स्थान-नाम है।
- source_word: אֶל הָאָרֶץ
  choice: इस देश पर
  rationale: संदर्भ में הארץ यहूदा के देश को सूचित करता है; हिन्दी में ‘इस देश’ संदर्भगत संकेत स्पष्ट करता है और ‘पर’ सैन्य चढ़ाई के साथ स्वाभाविक है।
- source_word: בֹּאוּ וְנָבוֹא יְרוּשָׁלַםִ
  choice: आओ, ... हम यरूशलेम चलें
  rationale: आज्ञार्थक और cohortative के सामूहिक आह्वान को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: מִפְּנֵי
  choice: के कारण
  rationale: शरण लेने के कारण को व्यापक रूप से व्यक्त करता है और स्रोत से अधिक स्पष्ट रूप से ‘डर’ नहीं जोड़ता।
- source_word: חֵיל הַכַּשְׂדִּים
  choice: कसदियों की सेना
  rationale: חיל का सैन्य अर्थ ‘सेना’ है; ‘कसदी’ मूल जातीय-राजनीतिक पद को बनाए रखता है।
- source_word: חֵיל אֲרָם
  choice: अराम की सेना
  rationale: मूल स्थान/जन-नाम ‘अराम’ को बाद के पारंपरिक नाम ‘सीरिया’ से प्रतिस्थापित नहीं किया गया।
- source_word: וַנֵּשֶׁב בִּירוּשָׁלָםִ
  choice: इसलिए हम यरूशलेम में आकर बस गए
  rationale: कथानक के परिणाम और ישב के निवास/बसने के अर्थ को सहज हिन्दी में व्यक्त करता है; ‘आकर’ पूर्ववर्ती यरूशलेम जाने के निर्णय से संबंध स्पष्ट करता है।
