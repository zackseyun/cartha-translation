  text: and not to build houses for us to live in[a]; and vineyard and field and seed have not been ours.
translation:
  language: hi
  text: और हमारे रहने के लिए घर न बनाना; और दाख की बारी, खेत और बीज हमारे न हों।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְבִלְתִּי בְּנוֹת
  choice: और ... न बनाना
  rationale: संयोजक और नकारात्मक infinitive construction को सूची की समानांतर आज्ञा के रूप में स्वाभाविक हिन्दी में रखा गया है।
- source_word: בָּתִּים
  choice: घर
  rationale: यह बहुवचन सामूहिक अर्थ में है; हिन्दी में ‘घर’ रूप संख्या की दृष्टि से स्वाभाविक रहते हुए ठोस अर्थ बनाए रखता है।
- source_word: לְשִׁבְתֵּנוּ
  choice: हमारे रहने के लिए
  rationale: ישׁב के infinitive और प्रथम पुरुष बहुवचन प्रत्यय का प्रयोजनार्थक भाव स्पष्ट और आधुनिक हिन्दी में व्यक्त होता है।
- source_word: וְכֶרֶם וְשָׂדֶה וָזֶרַע
  choice: और न दाख की बारी, न खेत, न बीज
  rationale: तीनों ठोस कृषि-संज्ञाओं को यथासंभव सीधे रखा गया है; हिन्दी की नकारात्मक सूची में ‘न’ की पुनरावृत्ति अर्थ स्पष्ट करती है।
- source_word: לֹא יִהְיֶה לָּנוּ
  choice: हमारा हो
  rationale: हिब्रू का अस्तित्व-सह-सम्पत्ति वाला प्रयोग शाब्दिक रूप से ‘हमारे लिए न हो’ है; ‘हमारा हो’ स्वामित्व का भाव संक्षेप और स्वाभाविक ढंग से देता है।
