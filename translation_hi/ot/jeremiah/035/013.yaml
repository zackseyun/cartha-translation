source:
  edition: WLC
  text: כֹּֽה אָמַ֞ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הָלֹ֤ךְ וְ/אָֽמַרְתָּ֙ לְ/אִ֣ישׁ יְהוּדָ֔ה וּ/לְ/יֽוֹשְׁבֵ֖י יְרֽוּשָׁלִָ֑ם הֲ/ל֨וֹא תִקְח֥וּ מוּסָ֛ר לִ/שְׁמֹ֥עַ אֶל דְּבָרַ֖/י נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/013.yaml
  text: 'Thus says the LORD of hosts, the God of Israel: Go and say to the men of Judah and to the inhabitants of Jerusalem, ‘Will you not receive instruction by listening to my words? declares the LORD.’'
translation:
  language: hi
  text: 'सेनाओं का यहोवा, इस्राएल का परमेश्वर, यों कहता है: “जा और यहूदा के लोगों और यरूशलेम के निवासियों से कह, ‘क्या तुम मेरी बातों को सुनकर शिक्षा ग्रहण नहीं करोगे?’ यहोवा की यही वाणी है।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम और צְבָאוֹת के सैन्य/स्वर्गीय समूहों से जुड़े व्यापक अर्थ को पारंपरिक, संक्षिप्त रूप में सुरक्षित रखता है।
- source_word: לְאִישׁ יְהוּדָה
  choice: यहूदा के लोगों
  rationale: אִישׁ यहाँ सामूहिक अर्थ में है; आधुनिक हिन्दी में ‘यहूदा के लोगों’ स्वाभाविक है और इसे केवल पुरुषों तक सीमित नहीं करता।
- source_word: מוּסָר
  choice: शिक्षा
  rationale: शब्द में अनुशासन, सुधार और सीख की छाया है; इस प्रसंग में ‘शिक्षा ग्रहण करना’ ताड़ना से मिलने वाली सीख को सहज रूप में व्यक्त करता है।
- source_word: לִשְׁמֹעַ אֶל דְּבָרַי
  choice: मेरी बातें सुनकर
  rationale: לִשְׁמֹעַ אֶל में ध्यान देकर सुनने और मानने का भाव है; इसे מוּסָר से साधनात्मक रूप में जोड़ते हुए मूल की प्रश्नात्मक चुनौती बनाए रखी गई है।
- source_word: נְאֻם יְהוָה
  choice: यहोवा की यही वाणी है
  rationale: प्रचलित नबी-सूत्र को गरिमापूर्ण और स्पष्ट हिन्दी में प्रस्तुत करता है।
theological_decisions:
- issue: दिव्य नाम יהוה का प्रतिरूपण
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम उपस्थित है; ‘यहोवा’ उसे सामान्य पदवी से अलग रखता है और हिन्दी बाइबिल परंपरा में सुबोध है।
- issue: प्रश्न में सुनने और शिक्षा ग्रहण करने का संबंध
  choice: ‘मेरी बातें सुनकर शिक्षा ग्रहण’
  alternative: ‘शिक्षा ग्रहण करके मेरी बातें सुनना’ अथवा दो स्वतंत्र क्रियाएँ
  rationale: हिब्रू לִשְׁמֹעַ को उद्देश्य या साधन दोनों रूपों में समझा जा सकता है; प्रसंग और अंग्रेज़ी परामर्श-पाठ के अनुरूप साधनात्मक संबंध चुना गया, बिना आज्ञाकारिता का अतिरिक्त धार्मिक निष्कर्ष जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण नबी-वाणी; ‘यों कहता है’, एकवचन आज्ञा ‘जा’, और सामूहिक ‘लोगों’ का प्रयोग। कोई पादटिप्पणी आवश्यक नहीं।
