base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/017.yaml
  text: 'Therefore[a], thus says Yahweh, the God of hosts, the God of Israel: Behold, I am bringing on Judah and on all the inhabitants of Jerusalem all the disaster that I have spoken against them, because I spoke to them and they did not listen, and I called to them and they did not answer.'
translation:
  language: hi
  text: 'इसलिए याहवे, सेनाओं का परमेश्वर, इस्राएल का परमेश्वर, यह कहता है: “देखो, मैं यहूदा और यरूशलेम के सभी निवासियों पर वह सारी विपत्ति[a] लाने वाला हूँ, जिसके बारे में मैंने उनके विरुद्ध कहा है; क्योंकि मैंने उनसे कहा, पर उन्होंने नहीं सुना, और मैंने उन्हें पुकारा, पर उन्होंने उत्तर नहीं दिया।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सारी आपदा।” इब्रानी शब्द दूसरे संदर्भों में “बुराई” भी दर्शा सकता है, पर यहाँ उसका अर्थ यहूदा और यरूशलेम पर आने वाला घोषित न्याय है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह रेकाबियों की आज्ञाकारिता और यहूदा की अनाज्ञाकारिता के बीच पिछले प्रसंग में दिए गए विरोध से निकलने वाला निष्कर्ष प्रकट करता है।
- source_word: כֹּה אָמַר
  choice: यह कहता है
  rationale: भविष्यद्वक्ताओं में प्रयुक्त संदेशवाहक सूत्र का स्वाभाविक और गरिमापूर्ण हिन्दी रूप।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिगत वाचा-नाम को सामान्य उपाधि में बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: सेनाओं का परमेश्वर
  rationale: यहाँ אֱלֹהֵי के साथ संबंधवाचक पद है; ‘सेनाओं’ से स्वर्गीय अथवा सांसारिक दलों की संभावित व्यापकता बनी रहती है।
- source_word: הִנְנִי מֵבִיא
  choice: देखो, मैं ... लाने वाला हूँ
  rationale: הִנְנִי घोषणा की गंभीरता और निकट/निश्चित कार्रवाई पर बल देता है; वर्तमान कृदंत को हिन्दी में आसन्न अभिप्राय से व्यक्त किया गया है।
- source_word: אֶל יְהוּדָה וְאֶל כָּל יֹשְׁבֵי יְרוּשָׁלִַם
  choice: यहूदा और यरूशलेम के सभी निवासियों पर
  rationale: न्याय के संदर्भ में אֶל का लक्ष्य हिन्दी में ‘पर’ से स्वाभाविक रूप से व्यक्त होता है।
- source_word: כָּל הָרָעָה
  choice: वह सारी विपत्ति
  rationale: इस न्याय-वाणी में רָעָה नैतिक बुराई के बजाय घोषित हानि या आपदा को सूचित करता है; ‘विपत्ति’ अर्थ और भविष्यद्वाणी की गंभीरता दोनों रखता है।
- source_word: אֲשֶׁר דִּבַּרְתִּי עֲלֵיהֶם
  choice: जिसके विषय में मैंने उनके विरुद्ध कहा था
  rationale: दण्ड की पूर्वघोषणा का आशय रखते हुए אֲשֶׁר का संबंध ‘विपत्ति’ से स्पष्ट किया गया है और עֲלֵיהֶם की विरोधी दिशा भी सुरक्षित रखी गई है।
- source_word: יַעַן דִּבַּרְתִּי אֲלֵיהֶם וְלֹא שָׁמֵעוּ
  choice: क्योंकि मैं उनसे बोलता रहा, पर उन्होंने नहीं सुना
  rationale: יַעַן कारण बताता है। हिन्दी का ‘बोलता रहा’ बार-बार दिए गए ईश्वरीय संबोधन के प्रसंगगत भाव को स्वाभाविक बनाता है, जबकि ‘नहीं सुना’ सुनकर न मानने की इब्रानी अभिव्यक्ति को खुला रखता है।
- source_word: וָאֶקְרָא לָהֶם וְלֹא עָנוּ
  choice: और मैं उन्हें पुकारता रहा, पर उन्होंने उत्तर नहीं दिया
  rationale: ‘पुकारना’ और ‘उत्तर देना’ की मूल समानांतरता को बनाए रखते हुए निरंतर उपेक्षा को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में सामान्य उपाधि नहीं, चार अक्षरों वाला विशिष्ट वाचा-नाम है; लिप्यंतरण उस भेद को बनाए रखता है।
- issue: הָרָעָה और ईश्वरीय न्याय
  choice: विपत्ति
  alternative: बुराई; आपदा
  rationale: यहाँ शब्द उस घोषित दण्डकारी घटना का बोध कराता है जो यहूदा और यरूशलेम पर आएगी। ‘विपत्ति’ संदर्भगत अर्थ रखता है, पर शब्द की हानिकारक गंभीरता को नरम नहीं करता।
- issue: שָׁמֵעוּ में सुनने और आज्ञा मानने का संबंध
  choice: उन्होंने नहीं सुना
  alternative: उन्होंने मेरी बात नहीं मानी
  rationale: ‘नहीं सुना’ मूल रूपक और उसकी अर्थगत व्यापकता को बनाए रखता है; प्रसंग में अनाज्ञाकारिता निहित है, पर उसे पाठ में केवल ‘मानना’ बनाकर सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यद्वाणी शैली रखी गई है। वाक्य को स्पष्ट और मौखिक पठन के योग्य बनाया गया है; ‘देखो’ घोषणा का बल रखता है, और दो समानांतर खंड—बोलना/न सुनना तथा पुकारना/उत्तर न देना—मूल की अलंकारिक संरचना सुरक्षित रखते हैं।
