source:
  edition: WLC
  text: הָלוֹךְ֮ אֶל בֵּ֣ית הָ/רֵכָבִים֒ וְ/דִבַּרְתָּ֣ אוֹתָ֔/ם וַ/הֲבִֽאוֹתָ/ם֙ בֵּ֣ית יְהוָ֔ה אֶל אַחַ֖ת הַ/לְּשָׁכ֑וֹת וְ/הִשְׁקִיתָ֥ אוֹתָ֖/ם יָֽיִן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/002.yaml
  text: Go to the house of the Rechabites[a], and speak to them, and bring them to the house of Yahweh, into one of the chambers, and give them wine to drink.
translation:
  language: hi
  text: “रेकाबियों के घराने के पास जा और उनसे बात कर। फिर उन्हें यहोवा के भवन[a] में, उसकी कोठरियों में से किसी एक में ले आ और उन्हें पीने के लिए दाखमधु दे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात्, ‘यहोवा का मंदिर।’ शाब्दिक रूप से, ‘यहोवा का भवन/घर।’
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלוֹךְ
  choice: जा
  rationale: यह הלך का आज्ञार्थक प्रयोग है; आधुनिक हिन्दी में सीधी आज्ञा के लिए ‘जा’ स्वाभाविक और संक्षिप्त है।
- source_word: בֵּית הָרֵכָבִים
  choice: रेकाबियों के घराने
  rationale: यहाँ בַּיִת केवल भवन नहीं, बल्कि वंश या सामाजिक समुदाय को सूचित करता है। ‘घराना’ इस अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְדִבַּרְתָּ אוֹתָם
  choice: उनसे बात कर
  rationale: דבר के साथ אֵת का अर्थ उनसे/उनको संबोधित करके बात करना है; ‘उनसे बात कर’ अर्थ की पारस्परिक संभावना को बनाए रखते हुए सहज हिन्दी है।
- source_word: וַהֲבִאוֹתָם
  choice: उन्हें ... ले आ
  rationale: בוא के हिफ़ील रूप का कारक अर्थ है कि उन्हें आने के लिए लाया जाए; गंतव्य के संदर्भ में ‘ले आ’ स्वाभाविक हिन्दी है।
- source_word: בֵּית יְהוָה
  choice: यहोवा के भवन
  rationale: मूल पदबंध का शाब्दिक अर्थ ‘यहोवा का घर/भवन’ है। ‘भवन’ मंदिर-संदर्भ के अनुकूल है और ‘मंदिर’ जैसी व्याख्यात्मक स्पष्टता को मुख्य पाठ में आरोपित नहीं करता।
- source_word: אַחַת הַלְּשָׁכוֹת
  choice: कोठरियों में से किसी एक में
  rationale: לִשְׁכָה मंदिर-परिसर की कोठरी या कक्ष को दर्शाता है। ‘कोठरी’ स्थापत्य-संदर्भ को बनाए रखती है; אַחַת का स्त्रीलिंग ‘एक’ इन कोठरियों में से एक को बताता है।
- source_word: וְהִשְׁקִיתָ אוֹתָם יָיִן
  choice: उन्हें पीने के लिए दाखमधु दे
  rationale: שקה के हिफ़ील का अर्थ पिलाना या पीने को देना है। यह अनुवाद कारणवाचक भाव रखता है, पर अनावश्यक जबरदस्ती का अर्थ नहीं जोड़ता।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में व्यक्तिगत वाचा-नाम सीधे आया है। ‘यहोवा’ उसे नाम के रूप में सुरक्षित रखता है, जबकि ‘प्रभु’ उसे उपाधि में बदल देता।
- issue: בֵּית יְהוָה की व्याख्या
  choice: यहोवा का भवन
  alternative: यहोवा का मंदिर
  rationale: संदर्भ मंदिर का है, फिर भी मूल में ‘घर/भवन’ है। मुख्य पाठ में ‘भवन’ रखने से मूल रूपक सुरक्षित रहता है और अर्थ को अनावश्यक रूप से संकीर्ण नहीं किया जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। एकवचन आज्ञार्थक शैली मूल के संबोधन को बनाए रखती है। ‘दाखमधु’ बाइबलीय संदर्भ में स्पष्ट और प्रतिष्ठित शब्द है; वाक्य-विन्यास को हिन्दी की स्वाभाविक प्रवाहशीलता के लिए दो वाक्यों में रखा गया है।
