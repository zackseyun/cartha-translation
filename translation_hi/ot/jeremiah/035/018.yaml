  text: וּ/לְ/בֵ֨ית הָ/רֵכָבִ֜ים אָמַ֣ר יִרְמְיָ֗הוּ כֹּֽה אָמַ֞ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל יַ֚עַן אֲשֶׁ֣ר שְׁמַעְתֶּ֔ם עַל מִצְוַ֖ת יְהוֹנָדָ֣ב אֲבִי/כֶ֑ם וַֽ/תִּשְׁמְרוּ֙ אֶת כָּל מִצְוֺתָ֔י/ו וַֽ/תַּעֲשׂ֔וּ כְּ/כֹ֥ל אֲשֶׁר צִוָּ֖ה אֶתְ/כֶֽם־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/018.yaml
  text: 'And to the house of the Rechabites Jeremiah said[a], “Thus says Yahweh of hosts, the God of Israel: Because you have obeyed the command of Jehonadab your father, and have kept all his commands, and have done according to all that he commanded you,”'
translation:
  language: hi
  text: 'और यिर्मयाह ने रेकाबियों के घराने को कहा, “सेनाओं का याहवे, इस्राएल का परमेश्वर, यह कहता है: क्योंकि तुमने अपने पिता यहोनादाब[a] की आज्ञा मानी है, उसकी सारी आज्ञाओं का पालन किया है, और जैसा कुछ उसने तुम्हें आज्ञा दी, उसके अनुसार किया है,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में नाम यहोनादाब है; अन्य स्थानों पर इसे प्रायः योनादाब भी लिखा जाता है।
    reason: नाम के इब्रानी रूप और प्रचलित वैकल्पिक रूप की जानकारी।
lexical_decisions:
- source_word: וּלְבֵית הָרֵכָבִים
  choice: और रेकाबियों के घराने से
  rationale: בֵּית यहाँ भवन नहीं, रेकाबियों के वंश या कुल को सूचित करता है। ‘घराना’ हिन्दी में इस सामूहिक पारिवारिक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אָמַר יִרְמְיָהוּ
  choice: यिर्मयाह ने कहा
  rationale: यह सीधा कथन-सूचक वाक्यांश है; ‘कहा’ आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: כֹּה אָמַר
  choice: यह कहता है
  rationale: यह नबूवत का प्रामाणिक संदेश-सूत्र है। ‘यह कहता है’ औपचारिकता बनाए रखते हुए आधुनिक पाठक के लिए सहज है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का याहवे
  rationale: याहवे व्यक्तिगत दिव्य नाम को लिप्यंतरित करता है; צְבָאוֹת का ‘सेनाओं’ अनुवाद इस उपाधि के सामर्थ्य और व्यापक सैन्य आशय को बनाए रखता है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल का परमेश्वर
  rationale: सम्बन्धवाचक इब्रानी पदबंध का सीधा और प्रचलित हिन्दी रूप।
- source_word: יַעַן אֲשֶׁר
  choice: तुमने …; इसलिए—
  rationale: यह कारण प्रस्तुत करता है, जिसका परिणाम अगले पद में आता है। हिन्दी में कारण-वाक्य के बाद ‘इसलिए’ रखकर अधूरे वाक्य-संबंध को स्पष्ट और सुरक्षित रखा गया है।
- source_word: שְׁמַעְתֶּם עַל מִצְוַת
  choice: आज्ञा मानी
  rationale: यहाँ שׁמע केवल सुनने नहीं, आज्ञापालन करने का अर्थ देता है। ‘आज्ञा मानी’ हिन्दी में यही व्यावहारिक अर्थ व्यक्त करता है।
- source_word: יְהוֹנָדָב אֲבִיכֶם
  choice: अपने पूर्वज यहोनादाब
  rationale: אָבִיכֶם का मूल अर्थ ‘तुम्हारा पिता’ है, पर रेकाबी वंश के अनेक पीढ़ियों बाद के सदस्यों के लिए यहाँ वंशगत पूर्वज अभिप्रेत है। ‘पूर्वज’ हिन्दी में संदर्भ को बिना वंशगत सम्बन्ध खोए स्पष्ट करता है।
- source_word: וַתִּשְׁמְרוּ אֶת כָּל מִצְוֺתָיו
  choice: उसकी सभी आज्ञाओं का पालन किया
  rationale: שׁמר आज्ञाओं के साथ उन्हें मानने और पालन करने को सूचित करता है। यह हिन्दी में स्पष्ट और वर्तमान प्रयोग के अनुरूप है।
- source_word: וַתַּעֲשׂוּ כְּכֹל אֲשֶׁר צִוָּה אֶתְכֶם
  choice: ठीक वैसा ही किया जैसा उसने तुम्हें आदेश दिया था
  rationale: כְּכֹל का ‘उस सबके अनुसार’ भाव ‘ठीक वैसा ही’ से स्वाभाविक हिन्दी में सुरक्षित रहता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत दिव्य नाम है। ‘याहवे’ उसका निकट लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: יְהוָה צְבָאוֹת में צְבָאוֹת का अर्थ
  choice: सेनाओं का याहवे
  alternative: स्वर्गीय सेनाओं का याहवे; सर्वशक्तिमान याहवे
  rationale: ‘सेनाओं’ मूल रूपक को खुला रखता है—यह स्वर्गीय या सांसारिक सेनाओं तक अर्थ को चुपचाप सीमित नहीं करता और ‘सर्वशक्तिमान’ जैसी व्याख्यात्मक उपाधि नहीं जोड़ता।
- issue: आज्ञापालन और अगले पद के प्रतिफल का वाक्य-संबंध
  choice: कारण को ‘इसलिए—’ के साथ अगले पद की ओर खुला रखा
  alternative: वाक्य को इसी पद में पूर्ण विराम देकर समाप्त करना
  rationale: יַעַן אֲשֶׁר कारण आरम्भ करता है और उसका मुख्य परिणाम 35:19 में आता है। डैश इस पाठगत तनाव और निरंतरता को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘घराना’ वंशगत समुदाय को, ‘पूर्वज’ ऐतिहासिक पीढ़ीगत सम्बन्ध को और ‘आज्ञा मानी/पालन किया’ इब्रानी की दो निकट लेकिन अलग क्रियाओं को सहज हिन्दी में व्यक्त करते हैं। पद का वाक्य अगले पद में पूरा होता है, इसलिए अंत में ‘इसलिए—’ रखा गया है।
