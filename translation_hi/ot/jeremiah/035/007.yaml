  text: וּ/בַ֣יִת לֹֽא תִבְנ֗וּ וְ/זֶ֤רַע לֹֽא תִזְרָ֨עוּ֙ וְ/כֶ֣רֶם לֹֽא תִטָּ֔עוּ וְ/לֹ֥א יִֽהְיֶ֖ה לָ/כֶ֑ם כִּ֠י בָּ/אֳהָלִ֤ים תֵּֽשְׁבוּ֙ כָּל יְמֵי/כֶ֔ם לְמַ֨עַן תִּֽחְי֜וּ יָמִ֤ים רַבִּים֙ עַל פְּנֵ֣י הָ/אֲדָמָ֔ה אֲשֶׁ֥ר אַתֶּ֖ם גָּרִ֥ים שָֽׁם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/007.yaml
  text: You must not build a house[a], and you must not sow seed, and you must not plant a vineyard, nor shall you have one; but you shall live in tents all your days, so that you may live many days on the face of the land where you are residing there.
translation:
  language: hi
  text: तुम घर न बनाओ, बीज न बोओ, और दाख की बारी न लगाओ; तुम्हारे पास कोई दाख की बारी न हो। बल्कि तुम जीवन भर तंबुओं में रहो, ताकि जिस भूमि पर तुम परदेशी होकर रहते हो, वहाँ बहुत दिनों तक जीवित रहो[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जहाँ तुम अस्थायी निवासियों के रूप में रहते हो।” इब्रानी क्रिया में किसी स्थान पर गैर-स्थायी निवासी या परदेशी के रूप में रहने का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַיִת לֹא תִבְנוּ
  choice: तुम न तो घर बनाना
  rationale: בַּיִת यहाँ तंबुओं के विपरीत स्थायी भौतिक घर को दर्शाता है। לֹא के साथ अपूर्ण क्रिया निर्देशात्मक निषेध है; हिंदी में ‘न ... बनाना’ उसका स्वाभाविक और स्पष्ट रूप है।
- source_word: וְזֶרַע לֹא תִזְרָעוּ
  choice: न बीज बोना
  rationale: ‘बीज बोना’ मूल संज्ञा और कृषि-क्रिया दोनों को ठोस रूप में सुरक्षित रखता है और किसी विशेष फसल का अनावश्यक निर्धारण नहीं करता।
- source_word: וְכֶרֶם לֹא תִטָּעוּ
  choice: न दाख की बारी लगाना
  rationale: כֶּרֶם के लिए ‘दाख की बारी’ आधुनिक हिंदी बाइबलीय संदर्भ में सहज और सटीक है; נטע के लिए ऐसी बारी के संदर्भ में ‘लगाना’ स्वाभाविक है।
- source_word: וְלֹא יִהְיֶה לָכֶם
  choice: कोई दाख की बारी तुम्हारी हो भी नहीं
  rationale: एकवचन क्रिया निकटतम एकवचन ‘दाख की बारी’ की ओर लौटती प्रतीत होती है। यह वाक्य केवल उसे लगाने पर नहीं, उसके स्वामित्व पर भी रोक को व्यक्त करता है।
- source_word: כִּי בָּאֳהָלִים תֵּשְׁבוּ
  choice: इसके बजाय, तुम ... तंबुओं में रहना
  rationale: כִּי यहाँ पिछले निषेधों के विपरीत सकारात्मक विकल्प प्रस्तुत करता है, इसलिए ‘इसके बजाय’ उपयुक्त है। ישב निवास के प्रसंग में ‘रहना’ है।
- source_word: כָּל יְמֵיכֶם
  choice: जीवन भर
  rationale: शाब्दिक ‘अपने सब दिनों में’ का स्वाभाविक आधुनिक हिंदी समतुल्य ‘जीवन भर’ है।
- source_word: לְמַעַן תִּחְיוּ יָמִים רַבִּים
  choice: ताकि ... बहुत दिनों तक जीवित रहो
  rationale: לְמַעַן उद्देश्य व्यक्त करता है। ‘बहुत दिनों तक जीवित रहो’ मूल के दीर्घ जीवन के आशय को बिना उसे केवल जीवित बचने तक सीमित किए व्यक्त करता है।
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: जिस भूमि पर
  rationale: यहाँ אֲדָמָה निवास की भूमि को सूचित करता है। हिंदी संबंधवाचक रचना अगले उपवाक्य को सहज रूप से जोड़ती है।
- source_word: אֲשֶׁר אַתֶּם גָּרִים שָׁם
  choice: जहाँ तुम परदेशी होकर रह रहे हो
  rationale: גור स्थायी स्वामित्व वाले नागरिक की अपेक्षा परदेशी अथवा अस्थायी निवासी के रूप में रहने का भाव रखता है। ‘जहाँ ... वहाँ’ की हिंदी रचना मूल के שָׁם को बिना असहज पुनरुक्ति के व्यक्त करती है।
theological_decisions:
- issue: भूमि में रेकाबी लोगों की स्थिति को दर्शाने वाले גָּרִים का अर्थ
  choice: परदेशी होकर रह रहे हो
  alternative: अस्थायी निवासियों के रूप में रह रहे हो / प्रवास कर रहे हो
  rationale: ‘परदेशी होकर रहना’ भूमि में निवास और गैर-स्थायी सामाजिक स्थिति दोनों को बनाए रखता है। यह पद उनके घुमंतू जीवन और भूमि से संबंध के तनाव को किसी विशिष्ट वाचा-सिद्धांत के अनुसार हल नहीं करता।
- issue: וְלֹא יִהְיֶה לָכֶם में एकवचन का संदर्भ
  choice: दाख की बारी के स्वामित्व का निषेध
  alternative: किसी स्थायी कृषि-संपत्ति का व्यापक निषेध
  rationale: निकटतम एकवचन पूर्वपद כֶרֶם है, इसलिए मुख्य पाठ में दाख की बारी को स्पष्ट किया गया है; फिर भी व्यापक जीवन-पद्धति का संदर्भ बना रहता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। लगातार निषेधों की लय को ‘न तो ... न ... और न ...’ से और सकारात्मक विकल्प को ‘इसके बजाय’ से स्पष्ट किया गया है।
