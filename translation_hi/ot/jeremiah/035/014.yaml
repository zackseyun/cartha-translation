id: JER.35.14
reference: Jeremiah 35:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הוּקַ֡ם אֶת דִּבְרֵ֣י יְהוֹנָדָ֣ב בֶּן רֵ֠כָב אֲשֶׁר צִוָּ֨ה אֶת בָּנָ֜י/ו לְ/בִלְתִּ֣י שְׁתֽוֹת יַ֗יִן וְ/לֹ֤א שָׁתוּ֙ עַד הַ/יּ֣וֹם הַ/זֶּ֔ה כִּ֣י שָֽׁמְע֔וּ אֵ֖ת מִצְוַ֣ת אֲבִי/הֶ֑ם וְ/אָ֨נֹכִ֜י דִּבַּ֤רְתִּי אֲלֵי/כֶם֙ הַשְׁכֵּ֣ם וְ/דַבֵּ֔ר וְ/לֹ֥א שְׁמַעְתֶּ֖ם אֵלָֽ/י־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/014.yaml
  text: The words of Jehonadab son of Rechab[a], which he commanded his sons—not to drink wine—have been upheld, and they have not drunk wine to this day, because they have obeyed the command of their father. But I have spoken to you, rising early and speaking[b], and you have not listened to me.
translation:
  language: hi
  text: रेकाब के पुत्र यहोनादाब[a] ने अपने पुत्रों को दाखमधु न पीने की जो आज्ञा दी थी, उसका पालन होता आया है। उन्होंने आज तक दाखमधु नहीं पिया, क्योंकि उन्होंने अपने पिता की आज्ञा मानी है। परन्तु मैं तड़के उठकर बार-बार तुमसे बोलता रहा[b], फिर भी तुमने मेरी नहीं सुनी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह नाम ‘योनादाब’ भी लिखा जाता है।
    reason: नाम के प्रचलित संक्षिप्त रूप की जानकारी।
  - marker: b
    text: ‘तड़के उठकर बोलना’ एक हिब्रू मुहावरा है, जिसका अर्थ है बार-बार, तत्परता और लगन से बोलना।
    reason: मूल मुहावरे की छवि और उसके अभिप्राय को स्पष्ट करना।
lexical_decisions:
- source_word: הוּקַם אֶת דִּבְרֵי
  choice: जो आज्ञा दी थी, उसका पालन होता आया है
  rationale: हिब्रू में यहोनादाब के ‘वचनों’ के कायम किए जाने का भाव है। हिन्दी में ‘आज्ञा का पालन होता आया है’ निष्क्रिय अर्थ और आज तक जारी अनुपालन—दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יְהוֹנָדָב בֶּן רֵכָב
  choice: रेकाब के पुत्र यहोनादाब
  rationale: नामों का हिब्रू रूप के निकट देवनागरी लिप्यंतरण किया गया है; ‘पुत्र’ वंश-संबंध को स्पष्ट रखता है।
- source_word: לְבִלְתִּי שְׁתוֹת יַיִן
  choice: दाखमधु न पीने
  rationale: निषेध को सीधे और सामान्य आधुनिक हिन्दी में रखा गया है। יַיִן के लिए ‘दाखमधु’ बाइबली संदर्भ में स्पष्ट है और मदिरा के अंगूरी स्वरूप को व्यक्त करता है।
- source_word: וְלֹא שָׁתוּ עַד הַיּוֹם הַזֶּה
  choice: उन्होंने आज तक दाखमधु नहीं पिया
  rationale: ‘आज तक’ जारी समयावधि को स्वाभाविक हिन्दी में व्यक्त करता है; स्पष्टता के लिए वस्तु ‘दाखमधु’ दोहराई गई है।
- source_word: שָׁמְעוּ אֵת מִצְוַת אֲבִיהֶם
  choice: उन्होंने अपने पिता की आज्ञा मानी है
  rationale: आज्ञा के साथ שׁמע केवल सुनने नहीं, उसका पालन करने का अर्थ देता है; ‘आज्ञा मानी’ हिन्दी का स्वाभाविक समतुल्य है।
- source_word: וְאָנֹכִי
  choice: परन्तु मैं
  rationale: संयोजक यहाँ रेकाबी लोगों की आज्ञाकारिता और संबोधित लोगों की अनसुनी के बीच स्पष्ट विरोध दिखाता है।
- source_word: הַשְׁכֵּם וְדַבֵּר
  choice: तड़के उठकर बार-बार तुमसे बोलता रहा
  rationale: अनवरत और तत्पर संबोधन के हिब्रू मुहावरे की भोर में उठने वाली मूल छवि को बनाए रखते हुए उसकी पुनरावृत्त क्रिया को हिन्दी में स्पष्ट किया गया है।
- source_word: וְלֹא שְׁמַעְתֶּם אֵלָי
  choice: फिर भी तुमने मेरी नहीं सुनी
  rationale: यहाँ सुनने से इनकार और न मानने दोनों का भाव संभव है। ‘मेरी नहीं सुनी’ इस अर्थ-व्याप्ति को बनाए रखता है और पहले आए ‘आज्ञा मानी’ से विरोध भी रचता है।
theological_decisions:
- issue: रेकाबियों की अपने पिता के प्रति आज्ञाकारिता और लोगों की परमेश्वर के प्रति अनसुनी का विरोध
  choice: पिता की ‘आज्ञा मानी’ के विपरीत परमेश्वर के लिए ‘मेरी नहीं सुनी’ रखा गया है।
  alternative: दोनों स्थानों पर ‘आज्ञा मानी/नहीं मानी’ कहना।
  rationale: हिब्रू में एक ही श्रवण-मूल आज्ञा के संदर्भ में आज्ञाकारिता और परमेश्वर के संबोधन के संदर्भ में अनसुनी को व्यक्त करता है। अलग किन्तु संबद्ध हिन्दी अभिव्यक्तियाँ इस विरोध को बनाए रखती हैं और अंतिम पदबंध को अनावश्यक रूप से केवल ‘अवज्ञा’ में सीमित नहीं करतीं।
- issue: परमेश्वर के ‘तड़के उठकर बोलने’ का मानव-सदृश मुहावरा
  choice: मूल छवि को मुख्य पाठ में रखा और पादटिप्पणी में उसके मुहावरेदार आशय को स्पष्ट किया गया है।
  alternative: ‘मैं लगातार और बड़े यत्न से तुमसे बोलता रहा।’
  rationale: मूल रूपक को हटाने के बजाय उसकी साहित्यिक और धर्मवैचारिक तीक्ष्णता सुरक्षित रखी गई है; पादटिप्पणी यह स्पष्ट करती है कि इसका बल परमेश्वर के निरन्तर और तत्पर संबोधन पर है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘परन्तु’ और ‘फिर भी’ विरोध को स्पष्ट करते हैं। ‘दाखमधु’ बाइबली गरिमा बनाए रखता है, जबकि वाक्य-विन्यास वर्तमान हिन्दी के अनुरूप है।
