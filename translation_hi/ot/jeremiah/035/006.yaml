base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/006.yaml
  text: But they said[a], “We will not drink wine, for Jonadab son of Rechab, our father, commanded us, saying, ‘You shall not drink wine, you or your sons[c][b], forever.’”
translation:
  language: hi
  text: 'पर उन्होंने कहा[a], “हम दाखमधु नहीं पिएँगे, क्योंकि हमारे पूर्वज[b], रेकाब के पुत्र योनादाब ने हमें यह आज्ञा दी थी: ‘तुम और तुम्हारे पुत्र[c] सदा के लिए दाखमधु न पिएँ।’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “और उन्होंने कहा।” हिब्रू कथात्मक संयोजक का अनुवाद दोनों प्रकार से हो सकता है; “पर” पिछले पद में दाखमधु पीने के निमंत्रण के साथ विरोध को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में शाब्दिक रूप से “हमारे पिता”; यहाँ इसका अर्थ कुलपुरुष या पूर्वज है।
    reason: cultural_note
  - marker: c
    text: हिब्रू में “तुम्हारे पुत्र” है, अर्थात पुरुष वंशज; अधिक सामान्य “संतान” नहीं।
    reason: lexical_alternative
