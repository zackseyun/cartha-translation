source:
  edition: WLC
  text: הַ/דָּבָ֛ר אֲשֶׁר הָיָ֥ה אֶֽל יִרְמְיָ֖הוּ מֵ/אֵ֣ת יְהוָ֑ה בִּ/ימֵ֨י יְהוֹיָקִ֧ים בֶּן יֹאשִׁיָּ֛הוּ מֶ֥לֶךְ יְהוּדָ֖ה לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/001.yaml
  text: The word that came to Jeremiah from Yahweh in the days of Jehoiakim son of Josiah[a], king of Judah, saying,
translation:
  language: hi
  text: 'योशिय्याह के पुत्र और यहूदा के राजा यहोयाकीम के दिनों में याहवे[a] की ओर से यिर्मयाह के पास वह वचन आया, कहते हुए:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहोवा।” इब्रानी में परमेश्वर का नाम YHWH है।
    reason: परमेश्वर के नाम के एक प्रचलित वैकल्पिक हिन्दी लिप्यंतरण को दर्शाना और यह स्पष्ट करना कि मूल पाठ में उपाधि नहीं, व्यक्तिगत नाम है।
lexical_decisions:
- source_word: הַדָּבָר
  choice: यह वचन
  rationale: भविष्यवाणी के परिचय में דָּבָר परमेश्वर से प्राप्त वचन या संदेश को दर्शाता है। “वचन” इस सूत्रात्मक भाषा को बनाए रखते हुए हिन्दी में स्वाभाविक है।
- source_word: אֲשֶׁר הָיָה אֶל
  choice: के पास ... आया
  rationale: यह इब्रानी भविष्यसूचक मुहावरा प्रकाशन के किसी व्यक्ति तक पहुँचने को व्यक्त करता है; “के पास आया” उसका सहज और पारदर्शी हिन्दी रूप है।
- source_word: מֵאֵת
  choice: की ओर से
  rationale: यहाँ מֵאֵת वचन के स्रोत को बताता है। “की ओर से” हिन्दी में स्रोत और प्रेषक—दोनों भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: यह उपाधि के स्थान पर इब्रानी परमेश्वर-नाम YHWH का हिन्दी में प्रचलित लिप्यंतरण है; वैकल्पिक उच्चारण “याहवे” को पादटिप्पणी में दिया गया है।
- source_word: בִּימֵי
  choice: के दिनों में
  rationale: यह मूल अभिव्यक्ति का निकट और स्वाभाविक रूप है तथा इसे केवल राजकाल तक सीमित करके अर्थ को अनावश्यक रूप से संकरा नहीं करता।
- source_word: יִרְמְיָהוּ
  choice: यिर्मयाह
  rationale: व्यक्तिनाम का हिन्दी बाइबलीय परंपरा में परिचित लिप्यंतरण।
- source_word: יְהוֹיָקִים
  choice: यहोयाकीम
  rationale: व्यक्तिनाम का हिन्दी में परिचित लिप्यंतरण।
- source_word: בֶּן יֹאשִׁיָּהוּ
  choice: योशिय्याह के पुत्र
  rationale: वंश-संबंध का सीधा और स्वाभाविक अनुवाद।
- source_word: מֶלֶךְ יְהוּדָה
  choice: यहूदा के राजा
  rationale: मूल की पद-सूचक संबंधवाचक रचना को स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: לֵאמֹר
  choice: ':'
  rationale: यह पद अगले वचन में आने वाली वाणी का परिचय देता है। हिन्दी में वाक्यांत का द्विबिंदु “इस प्रकार कहते हुए” जैसी अस्वाभाविक पुनरुक्ति के बिना वही संवादात्मक कार्य करता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में सामान्य उपाधि नहीं, चार अक्षरों वाला परमेश्वर-नाम YHWH है। मुख्य पाठ में हिन्दी पाठकों के लिए परिचित “यहोवा” रखा गया है और स्रोत की उच्चारण-संबंधी अनिश्चितता तथा प्रचलित वैकल्पिक लिप्यंतरण “याहवे” पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय, स्पष्ट भविष्यसूचक शैली। पदक्रम हिन्दी की स्वाभाविकता के अनुसार रखा गया है, जबकि “यह वचन ... आया” और “के दिनों में” जैसे मूल के सूत्रात्मक तत्व सुरक्षित हैं।
