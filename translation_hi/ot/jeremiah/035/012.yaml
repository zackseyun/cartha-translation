  text: וַֽ/יְהִי֙ דְּבַר יְהוָ֔ה אֶֽל יִרְמְיָ֖הוּ לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/012.yaml
  text: Then the word of Yahweh came to Yirmeyahu[a], saying[b],
translation:
  language: hi
  text: 'तब याहवे[a] का वचन यिर्मयाहू[b] के पास आया:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: याहवे; हिन्दी बाइबलों में परंपरागत रूप से प्रायः ‘यहोवा’ या ‘प्रभु’ लिखा जाता है।'
    reason: alternative_reading
  - marker: b
    text: इब्रानी नाम यिर्मयाहू का पारंपरिक हिन्दी रूप ‘यिर्मयाह’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: तब … आया
  rationale: यहाँ यह कथानक को आगे बढ़ाने वाला क्रमसूचक प्रयोग है। ‘तब … आया’ आधुनिक हिन्दी में स्वाभाविक है और पुराने ढंग के शाब्दिक अनुवाद ‘और ऐसा हुआ’ से बचते हुए प्रवाह बनाए रखता है।
- source_word: דְּבַר
  choice: वचन
  rationale: नबूवत के स्थायी पदबंध דְּבַר יְהוָה में ‘वचन’ परमेश्वर से मिले संप्रेषण को ठीक प्रकार व्यक्त करता है और मूल पदबंध की औपचारिक संगति बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में उसके प्रचलित विद्वत्तापूर्ण उच्चारण के अनुसार लिप्यंतरित किया गया है।
- source_word: אֶל
  choice: के पास
  rationale: वचन के प्राप्तकर्ता की ओर दिशा को हिन्दी की स्वाभाविक अभिव्यक्ति ‘के पास आया’ से व्यक्त किया गया है।
- source_word: יִרְמְיָהוּ
  choice: यिर्मयाहू
  rationale: नाम के इस इब्रानी रूप को पारंपरिक हिन्दी रूप ‘यिर्मयाह’ से बदलने के बजाय स्रोत-रूप के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: לֵאמֹר
  choice: ':'
  rationale: यह रूप आगे आने वाले कथन का परिचय देता है। आधुनिक हिन्दी में उद्धरण से पहले का द्विबिंदु वही कार्य स्वाभाविक ढंग से करता है; ‘यह कहते हुए’ यहाँ अनावश्यक और असहज होता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत नाम सीधे प्रयुक्त है। ‘याहवे’ उसे उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं करता और ‘यहोवा’ की अपेक्षा उसके संभावित इब्रानी उच्चारण के अधिक निकट है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। नबूवत के परिचित पदबंध के लिए ‘वचन’ रखा गया है; स्रोत-भाषा के व्यक्तिगत नाम लिप्यंतरित किए गए हैं।
