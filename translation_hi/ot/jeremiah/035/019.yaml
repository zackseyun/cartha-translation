source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֥ה אָמַ֛ר יְהוָ֥ה צְבָא֖וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֑ל לֹֽא יִכָּרֵ֨ת אִ֜ישׁ לְ/יוֹנָדָ֧ב בֶּן רֵכָ֛ב עֹמֵ֥ד לְ/פָנַ֖/י כָּל הַ/יָּמִֽים־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/019.yaml
  text: 'Therefore thus says Yahweh of hosts[b][a], the God of Israel: Jonadab the son of Rechab shall never lack a man standing before me all the days.'
translation:
  language: hi
  text: 'इसलिए सेनाओं का यहोवा, इस्राएल का परमेश्वर, यों कहता है: ‘रेकाब के पुत्र योनादाब के वंश में मेरे सामने खड़ा रहनेवाला कोई पुरुष सदा रहेगा।[a][b]’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शब्दशः: “योनादाब बिन रेकाब के लिए मेरे सामने खड़ा रहनेवाला पुरुष सब दिनों तक काटा नहीं जाएगा।”'
    reason: मूल इब्रानी मुहावरे, ‘काटे जाने’ के बिंब, और ‘सब दिनों तक’ की काल-सूचना को दिखाना।
  - marker: b
    text: “मेरे सामने खड़ा रहनेवाला” परमेश्वर की उपस्थिति में सेवा करने का संकेत दे सकता है; यहाँ किसी विशेष पद का उल्लेख नहीं है।
    reason: वाक्यांश की संभावित सेवाकार्य-संबंधी अर्थच्छाया को बिना किसी खास पद में सीमित किए स्पष्ट करना।
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले प्रसंग के आधार पर निकले ईश्वरीय निष्कर्ष को स्वाभाविक और स्पष्ट ढंग से व्यक्त करता है।
- source_word: כֹּה אָמַר
  choice: यों कहता है
  rationale: यह प्रचलित भविष्यद्वक्ताई संदेश-सूत्र की गरिमा और औपचारिक लय बनाए रखता है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का यहोवा
  rationale: व्यक्तिगत दिव्य नाम को लिप्यंतरित रखा गया है और צְבָאוֹת को इतना व्यापक रखा गया है कि वह केवल मानवीय सैन्य बलों तक सीमित न हो।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल का परमेश्वर
  rationale: इब्रानी संबंधवाचक पदबंध का सीधा और स्वाभाविक अनुवाद।
- source_word: לֹא יִכָּרֵת אִישׁ לְיוֹנָדָב בֶּן־רֵכָב
  choice: रेकाब के पुत्र योनादाब के वंश में ... पुरुष कभी न मिटेगा
  rationale: כרת का मूल बिंब ‘काट दिया जाना’ है, पर यहाँ वंश या प्रतिनिधि के समाप्त न होने का मुहावरा है। ‘वंश में’ निहित पारिवारिक संबंध को हिन्दी में स्पष्ट करता है, जबकि ‘मिटेगा’ मूल बिंब को कुछ हद तक सुरक्षित रखता है।
- source_word: עֹמֵד לְפָנַי
  choice: मेरे सामने खड़ा रहनेवाला
  rationale: वर्तमान कृदंत और ‘मेरे सामने’ की अभिव्यक्ति को निकटता से सुरक्षित रखता है; सेवा का संकेत संभव है, पर किसी विशेष पद को नहीं जोड़ा गया।
- source_word: כָּל הַיָּמִים
  choice: सदा
  rationale: इब्रानी ‘सब दिनों’ का स्वाभाविक हिन्दी मुहावरेदार अर्थ स्थायी निरंतरता है; शब्दशः रूप पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: ‘मेरे सामने खड़ा रहनेवाला’ प्रतिज्ञा का आशय
  choice: योनादाब के वंश का एक पुरुष परमेश्वर के सामने उपस्थित/सेवारत बना रहेगा, पर किसी खास संस्थागत पद को निर्दिष्ट नहीं किया गया।
  alternative: इसे रेकाबी वंश के स्थायी याजकीय या मंदिर-संबंधी पद की स्पष्ट प्रतिज्ञा मानना; अथवा केवल वंश के जैविक अस्तित्व की प्रतिज्ञा मानना।
  rationale: עֹמֵד לְפָנַי सेवा का अर्थ दे सकता है, किंतु इस पद में न याजकत्व और न मंदिर का स्पष्ट उल्लेख है। इसलिए अनुवाद मूल धर्मवैचारिक व्यापकता और तनाव बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण भविष्यद्वक्ताई शैली के साथ सामान्य पाठक के लिए सहज शब्दावली। ‘यहोवा’ द्वारा दिव्य नाम सुरक्षित रखा गया है। मुख्य पाठ में अर्थ स्पष्ट किया गया है और शब्दशः संरचना पादटिप्पणी में संरक्षित है।
