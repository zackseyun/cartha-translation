  text: וָ/אָבִ֤א אֹתָ/ם֙ בֵּ֣ית יְהוָ֔ה אֶל לִשְׁכַּ֗ת בְּנֵ֛י חָנָ֥ן בֶּן יִגְדַּלְיָ֖הוּ אִ֣ישׁ הָ/אֱלֹהִ֑ים אֲשֶׁר אֵ֨צֶל֙ לִשְׁכַּ֣ת הַ/שָּׂרִ֔ים אֲשֶׁ֣ר מִ/מַּ֗עַל לְ/לִשְׁכַּ֛ת מַעֲשֵׂיָ֥הוּ בֶן שַׁלֻּ֖ם שֹׁמֵ֥ר הַ/סַּֽף־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/004.yaml
  text: So I brought them into the house of Yahweh[a], into the chamber of the sons of Hanan son of Igdaliah, the man of God, which was beside the chamber of the officials, which was above the chamber of Maaseiah son of Shallum[c][b], the keeper of the threshold.
translation:
  language: hi
  text: तब मैं उन्हें यहोवा के भवन[a] में, परमेश्वर के जन, यिग्दल्याह के पुत्र हानान के पुत्रों[b] के कक्ष में ले गया। वह कक्ष अधिकारियों के कक्ष के पास था और देहरी के रक्षक[c] शल्लूम के पुत्र मासेयाह के कक्ष के ऊपर था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यहोवा के मंदिर में।” शाब्दिक अर्थ, “यहोवा के घर में।”
    reason: lexical_alternative
  - marker: b
    text: “हानान के पुत्रों” से आशय उसके वंशजों, परिवार या उससे जुड़े समूह से भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या “द्वारपाल।” शाब्दिक अर्थ, “देहरी का रक्षक।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָבִא
  choice: तब मैं ... ले गया
  rationale: प्रथम पुरुष एकवचन का यह क्रमसूचक क्रियारूप कथा की अगली घटना बताता है; ‘तब’ आधुनिक हिन्दी में उस क्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בֵּית יְהוָה
  choice: यहोवा का भवन
  rationale: यह इब्रानी पद का पारदर्शी रूप है और मंदिर के लिए प्रयुक्त ‘घर/भवन’ की मूल छवि को बनाए रखता है; अधिक प्रचलित अर्थ ‘यहोवा का मंदिर’ पादटिप्पणी में दिया गया है।
- source_word: לִשְׁכַּת
  choice: कोठरी
  rationale: לשכה मंदिर-परिसर के एक अलग कक्ष को दर्शाता है। ‘कोठरी’ स्थापत्य-संबंधी अर्थ को साधारण आधुनिक हिन्दी में व्यक्त करती है।
- source_word: בְּנֵי חָנָן
  choice: हानान के पुत्रों
  rationale: यह पद का शाब्दिक और जाँचने योग्य अनुवाद है; ‘पुत्र’ यहाँ वंशजों, परिवार या हानान से जुड़े समूह के लिए भी प्रयुक्त हो सकता है, इसलिए वह संभावना पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: אִישׁ הָאֱלֹהִים
  choice: परमेश्वर का जन
  rationale: यह मान्य सम्मानसूचक उपाधि है। वाक्य-विन्यास में इसे हानान से जोड़ा गया है, जो निकटतम उल्लिखित व्यक्ति और इस पद का स्वाभाविक संदर्भ है।
- source_word: אֵצֶל
  choice: के पास
  rationale: यह स्थानिक निकटता को स्पष्ट और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הַשָּׂרִים
  choice: अधिकारी
  rationale: इस मंदिर-प्रशासनिक संदर्भ में שׂרים के लिए ‘अधिकारी’ स्पष्ट है और अनावश्यक रूप से राजकुमार होने का अर्थ नहीं देता।
- source_word: מִמַּעַל לְ
  choice: के ऊपर
  rationale: यह कोठरियों की ऊर्ध्वाधर स्थापत्य स्थिति को सीधे व्यक्त करता है।
- source_word: שֹׁמֵר הַסַּף
  choice: देहरी का रक्षक
  rationale: यह शाब्दिक छवि और पदनाम दोनों को सुरक्षित रखता है; कार्यपरक विकल्प ‘द्वारपाल’ पादटिप्पणी में दिया गया है।
- source_word: חָנָן ... יִגְדַּלְיָהוּ ... מַעֲשֵׂיָהוּ ... שַׁלֻּם
  choice: हानान ... यिग्दल्याह ... मासेयाह ... शल्लूम
  rationale: व्यक्तिगत नामों को हिन्दी ध्वन्यात्मक रूप में लिप्यंतरित किया गया है, अनूदित नहीं।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ में चार-अक्षरीय व्यक्तिगत नाम सीधे आया है। ‘यहोवा’ हिन्दी बाइबलीय प्रयोग में पहचाना जाने वाला नामरूप है और इसे केवल पदवी ‘प्रभु’ से प्रतिस्थापित नहीं करता।
- issue: אִישׁ הָאֱלֹהִים का संबंध
  choice: परमेश्वर का जन हानान
  alternative: परमेश्वर का जन यिग्दल्याह
  rationale: उपाधि नाम-श्रृंखला के बाद आती है, पर निकटवर्ती पूर्ण नाम ‘यिग्दल्याह का पुत्र हानान’ का मुख्य व्यक्ति हानान है। हिन्दी में इसे हानान से जोड़कर अस्पष्ट व्याकरण से बचा गया है, बिना उपाधि का अर्थ बढ़ाए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। लंबे इब्रानी स्थान-वर्णन को दो वाक्यों में बाँटा गया है, पर सभी स्थानिक संबंध सुरक्षित हैं। ‘भवन’, ‘कोठरी’ और ‘देहरी का रक्षक’ मूल की स्थापत्य छवियों को बनाए रखते हैं; कठिन या वैकल्पिक अर्थ पादटिप्पणियों में दिए गए हैं।
