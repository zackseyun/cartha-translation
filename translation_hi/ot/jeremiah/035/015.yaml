  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रूप अपनाया गया है। ‘नबी’, ‘बुरी राह’, ‘दूसरे देवताओं के पीछे चलना’ और ‘कान लगाना’ जैसे बाइबलीय रूपक जहाँ हिन्दी में बोधगम्य हैं वहाँ सुरक्षित रखे गए हैं; कठिन इब्रानी मुहावरे का अर्थ मुख्य पाठ में और उसका शाब्दिक रूप पाद-टिप्पणी में दिया गया है।
