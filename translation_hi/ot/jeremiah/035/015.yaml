  to: मैंने अपने सभी सेवकों अर्थात् नबियों को तुम्हारे पास भेजा; मैं उन्हें लगातार भेजता रहा[a] और कहता रहा, ‘कृपया, तुम सब अपनी-अपनी बुरी राह से लौट आओ[b][c] और अपने कामों को सुधारो[d]। दूसरे देवताओं के पीछे उनकी सेवा करने के लिए मत चलो। तब उस भूमि में बसे रहो जो मैंने तुम्हें और तुम्हारे पूर्वजों को दी है।’ पर तुमने न तो मेरी बात पर कान लगाया, न मेरी सुनी।
