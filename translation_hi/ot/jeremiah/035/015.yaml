base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/015.yaml
  text: And I sent to you all my servants the prophets[a], rising early and sending them, saying, ‘Please turn back, each man from his evil way, and make your deeds good, and do not go after other gods to serve them[d][c][b]. Then dwell in the land that I gave to you and to your fathers.’ But you did not incline your ear or listen to me.
translation:
  language: hi
  text: मैंने अपने सभी सेवकों अर्थात् नबियों को तुम्हारे पास भेजा; मैं उन्हें लगातार भेजता रहा[a] और कहता रहा, ‘कृपया, तुम सब अपनी-अपनी बुरी राह से लौट आओ[b][c] और अपने कामों को सुधारो[d]। दूसरे देवताओं के पीछे उनकी सेवा करने के लिए मत चलो। तब उस भूमि में बसे रहो जो मैंने तुम्हें और तुम्हारे पूर्वजों को दी है।’ पर तुमने न तो मेरी बात पर कान लगाया, न मेरी सुनी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक इब्रानी मुहावरा है, “सवेरे उठकर भेजना”; इसका भाव तत्परता और लगातार, बार-बार भेजना है।
    reason: cultural_note
  - marker: b
    text: या “वापस आओ”; अधिक व्याख्यात्मक रूप में, “मन फिराओ” या “पश्चात्ताप करो।”
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में शाब्दिक रूप से, “हर पुरुष अपनी बुरी राह से”; यह वितरणात्मक अभिव्यक्ति प्रत्येक व्यक्ति को अलग-अलग संबोधित करती है।
    reason: lexical_alternative
  - marker: d
    text: शाब्दिक रूप से, “अपने कामों को अच्छा बनाओ”; या “अपने आचरण को सुधारो।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁלַח
  choice: मैंने ... भेजा
  rationale: वय्यिक्तोल रूप यहाँ बीते हुए कार्य का वर्णन करता है; सामान्य भूतकाल स्वाभाविक और संदर्भानुकूल है।
- source_word: עֲבָדַי הַנְּבִאִים
  choice: मेरे सभी सेवकों, नबियों
  rationale: ‘नबियों’ को ‘सेवकों’ के समानाधिकरण के रूप में रखकर मूल पदबंध और परमेश्वर के सेवकों के रूप में उनकी पहचान सुरक्षित रहती है।
- source_word: הַשְׁכֵּים וְשָׁלֹחַ
  choice: मैं उन्हें बार-बार बड़े यत्न से भेजता रहा
  rationale: शाब्दिक रूप से ‘सवेरे उठकर भेजना’ एक इब्रानी मुहावरा है, जो तत्पर और निरंतर भेजे जाने को व्यक्त करता है; मुख्य पाठ में उसका स्वाभाविक हिन्दी अर्थ दिया गया है और शाब्दिक रूप पाद-टिप्पणी में रखा गया है।
- source_word: שֻׁבוּ נָא
  choice: कृपया लौट आओ
  rationale: ‘लौट आओ’ बुरे मार्ग से मुड़ने के ठोस रूपक को बनाए रखता है; נָא की विनती का भाव ‘कृपया’ से व्यक्त होता है।
- source_word: אִישׁ מִדַּרְכּוֹ הָרָעָה
  choice: तुममें से हर एक अपनी बुरी राह से
  rationale: एकवचन אִישׁ का यहाँ वितरणात्मक अर्थ है। यह अनुवाद प्रत्येक व्यक्ति की व्यक्तिगत जिम्मेदारी और ‘बुरी राह’ के भविष्यद्वक्ताई रूपक दोनों को बनाए रखता है।
- source_word: וְהֵיטִיבוּ מַעַלְלֵיכֶם
  choice: अपने कामों को सुधारो
  rationale: हिफ़ील रूप का अर्थ कामों को अच्छा बनाना या सुधारना है। ‘सुधारो’ आधुनिक हिन्दी में सहज है और नैतिक आचरण के आशय को स्पष्ट रखता है।
- source_word: וְאַל תֵּלְכוּ אַחֲרֵי אֱלֹהִים אֲחֵרִים לְעָבְדָם
  choice: दूसरे देवताओं के पीछे उनकी सेवा करने के लिए मत चलो
  rationale: ‘पीछे ... चलो’ मूल के अनुसरण/धर्मत्याग संबंधी रूपक को, और ‘सेवा’ עבד की व्यापक अर्थ-सीमा को सुरक्षित रखती है।
- source_word: וּשְׁבוּ אֶל הָאֲדָמָה
  choice: तब उस देश में बसे रहो
  rationale: ישב का अर्थ बसना या बने रहना है और אֲדָמָה यहाँ परमेश्वर द्वारा दी गई भूमि को सूचित करता है। ‘तब’ आज्ञाओं के क्रम और परिणामगत संबंध को सहज बनाता है, बिना इसे स्पष्ट उद्देश्य-वाक्य में बदलने के।
- source_word: וְלֹא הִטִּיתֶם אֶת אָזְנְכֶם וְלֹא שְׁמַעְתֶּם אֵלָי
  choice: पर तुमने न तो मेरी बात पर कान लगाया, न मेरी सुनी
  rationale: ‘कान लगाना’ मूल के सजीव मुहावरे को स्वाभाविक हिन्दी में बनाए रखता है और अगले ‘मेरी सुनी’ के साथ उसकी समानांतरता सुरक्षित रहती है।
theological_decisions:
- issue: שׁוּב की भविष्यद्वक्ताई पुकार
  choice: लौट आओ
  alternative: मन फिराओ / पश्चात्ताप करो
  rationale: यह पद नैतिक बुराई से मुड़ने को कहता है। ‘लौट आओ’ मूल रूपक और उसकी धर्मवैज्ञानिक व्यापकता को सुरक्षित रखता है, जबकि ‘पश्चात्ताप करो’ अर्थ को अधिक व्यवस्थित धार्मिक शब्दावली में सीमित कर सकता है।
- issue: אִישׁ का वितरणात्मक प्रयोग
  choice: तुममें से हर एक
  alternative: हर पुरुष
  rationale: इस संदर्भ में व्याकरणिक पुल्लिंग एकवचन प्रत्येक संबोधित व्यक्ति को अलग-अलग उत्तरदायी ठहराता है। ‘हर एक’ उसी वितरणात्मक बल को स्वाभाविक हिन्दी में व्यक्त करता है और अनावश्यक रूप से केवल पुरुषों तक अर्थ सीमित नहीं करता।
- issue: अन्य देवताओं के संबंध में עבד
  choice: सेवा करना
  alternative: पूजा करना
  rationale: देवताओं के संदर्भ में सेवा में पूजा निहित हो सकती है, पर ‘सेवा’ मूल क्रिया की व्यापक अर्थ-सीमा और निष्ठा/अधीनता के भाव को बनाए रखती है।
- issue: भूमि में बसने की आज्ञा और परिणाम
  choice: तब उस देश में बसे रहो
  alternative: ताकि तुम उस देश में बसे रहो
  rationale: मूल में आज्ञार्थक क्रियाओं का क्रम है; परिणाम या उद्देश्य का संबंध संभव है, पर स्पष्ट उद्देश्यसूचक उपवाक्य मूल की अस्पष्टता को अधिक निश्चित कर देता।
