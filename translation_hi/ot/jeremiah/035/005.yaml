  text: וָ/אֶתֵּ֞ן לִ/פְנֵ֣י בְּנֵ֣י בֵית הָ/רֵכָבִ֗ים גְּבִעִ֛ים מְלֵאִ֥ים יַ֖יִן וְ/כֹס֑וֹת וָ/אֹמַ֥ר אֲלֵי/הֶ֖ם שְׁתוּ יָֽיִן׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/005.yaml
  text: Then I set before the sons of the house of the Rekabites bowls full of wine and cups[a], and I said to them, “Drink wine.”
translation:
  language: hi
  text: तब मैंने रेकाबी घराने के लोगों के सामने दाखमधु से भरे कटोरे और प्याले रखे और उनसे कहा, “दाखमधु पियो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֶתֵּן לִפְנֵי
  choice: सामने ... रखे
  rationale: נתן के साथ לִפְנֵי यहाँ पात्रों को किसी के सामने रखने का भाव देता है; यह हिन्दी में स्वाभाविक और स्रोत के निकट है।
- source_word: בְּנֵי בֵית הָרֵכָבִים
  choice: रेकाबी घराने के लोग
  rationale: शाब्दिक ‘रेकाबियों के घराने के पुत्र’ आधुनिक हिन्दी में अस्वाभाविक और केवल पुरुष संतान का भ्रामक बोध दे सकता है। ‘घराने के लोग’ मूल के पारिवारिक-सामुदायिक भाव को स्पष्ट रखता है।
- source_word: גְּבִעִים
  choice: कटोरे
  rationale: यह शब्द कटोरे या कुंड जैसे पात्रों को सूचित करता है। ‘कटोरे’ सामान्य हिन्दी में सहज है और अगले शब्द ‘प्याले’ से पात्रों का भेद बनाए रखता है।
- source_word: מְלֵאִים יַיִן
  choice: दाखमधु से भरे
  rationale: यह विशेषण और संज्ञा की सीधी अभिव्यक्ति है। ‘दाखमधु’ अंगूर से बनी मदिरा को सामान्य ‘मदिरा’ की अपेक्षा अधिक सटीक रूप से व्यक्त करता है।
- source_word: וְכֹסוֹת
  choice: और प्याले
  rationale: כּוֹס पीने के प्याले को दर्शाता है; दोनों प्रकार के पात्रों का मूल उल्लेख सुरक्षित रखा गया है।
- source_word: וָאֹמַר אֲלֵיהֶם
  choice: और उनसे कहा
  rationale: यह אמר אֲלֵיהֶם का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: שְׁתוּ יָיִן
  choice: दाखमधु पियो
  rationale: बहुवचन आज्ञार्थक क्रिया और उसके कर्म को संक्षिप्त तथा प्रत्यक्ष रूप में रखा गया है; ‘कुछ’ जैसा कोई व्याख्यात्मक शब्द नहीं जोड़ा गया।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘रेकाबी’ नाम का देवनागरी रूप हिब्रू רֵכָבִים के निकट है। वाक्य की संक्षिप्त कथात्मक गति और आदेश की तीक्ष्णता सुरक्षित रखी गई है।
