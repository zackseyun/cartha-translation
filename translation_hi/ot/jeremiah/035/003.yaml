  yaml_path: translation/ot/jeremiah/035/003.yaml
  text: So I took Jaazaniah son of Jeremiah[a], son of Habazziniah, and his brothers, and all his sons[b], and the whole house of the Rechabites.
translation:
  language: hi
  text: तब मैं हबत्स्सिन्याह के पुत्र यिर्मयाह के पुत्र याजन्याह को, उसके भाइयों को, उसके सभी पुत्रों को और रेकाबियों के पूरे घराने[a] को साथ ले आया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “घराने” का अर्थ रेकाबियों का परिवार या कुल है, कोई भवन नहीं।
    reason: cultural_note
lexical_decisions:
- source_word: וָאֶקַּח
  choice: तब मैंने ... साथ लिया
  rationale: לקח के क़ाल वय्यिक्तोल रूप से कथा में अगली क्रमिक क्रिया व्यक्त होती है। हिंदी में “तब” इस प्रवाह को स्वाभाविक ढंग से दिखाता है; “साथ लिया” व्यक्तियों को किसी स्थान पर ले जाने के आगामी संदर्भ में सहज है।
- source_word: יַאֲזַנְיָה
  choice: याजन्याह
  rationale: इब्रानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण, जिसमें अंतिम יה ध्वनि को “याह” से व्यक्त किया गया है।
- source_word: בֶן יִרְמְיָהוּ בֶן חֲבַצִּנְיָה
  choice: यिर्मयाह के पुत्र और हबस्सिन्याह के पोते
  rationale: लगातार दो בֶן से पिता और पितामह की वंशावली दी गई है। स्वाभाविक हिंदी में दूसरे संबंध को “पोते” कहना अर्थ को स्पष्ट रखता है।
- source_word: אֶחָיו
  choice: उसके भाइयों
  rationale: אָח का सामान्य और इस संदर्भ में उपयुक्त अर्थ “भाई” है; व्यापक “संबंधी” की आवश्यकता नहीं है।
- source_word: כָּל בָּנָיו
  choice: उसके सभी पुत्रों
  rationale: בָּנִים का पुल्लिंग और प्रत्यक्ष अर्थ बनाए रखा गया है; इसे सामान्यीकृत करके “संतान” नहीं किया गया।
- source_word: כָּל בֵּית הָרֵכָבִים
  choice: रेकाबियों के पूरे घराने
  rationale: בֵּית यहाँ भवन नहीं बल्कि परिवार/कुल का सामूहिक बोध देता है। आधुनिक हिंदी में “घराना” इस अर्थ को स्वाभाविक रूप से व्यक्त करता है।
