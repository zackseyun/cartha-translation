id: JER.35.16
reference: Jeremiah 35:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֣י הֵקִ֗ימוּ בְּנֵי֙ יְהוֹנָדָ֣ב בֶּן רֵכָ֔ב אֶת מִצְוַ֥ת אֲבִי/הֶ֖ם אֲשֶׁ֣ר צִוָּ֑/ם וְ/הָ/עָ֣ם הַ/זֶּ֔ה לֹ֥א שָׁמְע֖וּ אֵלָֽ/י־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/016.yaml
  text: For the sons of Jehonadab son of Rechab have kept the command of their father that he commanded them[b][a], but this people have not listened to me.
translation:
  language: hi
  text: क्योंकि रेकाब के पुत्र यहोनादाब के वंशजों ने अपने पिता[a] की उस आज्ञा का पालन किया है, जो उसने उन्हें दी थी; पर इस प्रजा ने मेरी बात नहीं सुनी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने पूर्वज”; इब्रानी में “अपने पिता।”
    reason: lexical_alternative
  - marker: b
    text: “मेरी बात नहीं सुनी” का अर्थ “मेरी आज्ञा नहीं मानी” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या आधार प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इस व्याख्यात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הֵקִימוּ
  choice: पालन किया है
  rationale: हिफ़ील रूप यहाँ מִצְוַת के साथ मुहावरेदार ढंग से आज्ञा को कायम रखने, अर्थात उसका पालन करने, का अर्थ देता है।
- source_word: בְּנֵי יְהוֹנָדָב בֶּן רֵכָב
  choice: रेकाब के पुत्र यहोनादाब के वंशजों
  rationale: בְּנֵי का अर्थ पुत्र या व्यापक अर्थ में वंशज हो सकता है। अध्याय के कुल-संबंधी संदर्भ में ‘वंशज’ साधारण हिन्दी में आशय को स्पष्ट करता है, जबकि ‘रेकाब के पुत्र’ मूल की वंशावली-सूचना बनाए रखता है।
- source_word: מִצְוַת
  choice: आज्ञा
  rationale: यह अधिकारपूर्वक दिए गए आदेश या निर्देश को दर्शाता है; ‘आज्ञा’ आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: אֲבִיהֶם
  choice: अपने पिता
  rationale: इब्रानी का सीधा अर्थ ‘उनके पिता’ है। ‘अपने पिता’ हिन्दी में स्वाभाविक है और मानव पूर्वज की आज्ञाकारिता तथा परमेश्वर के प्रति प्रजा की अनसुनी के बीच विरोध को बनाए रखता है।
- source_word: אֲשֶׁר צִוָּם
  choice: जो उसने उन्हें दी थी
  rationale: हिन्दी में आज्ञा के साथ ‘दी थी’ स्वाभाविक प्रयोग है और संबंधवाचक उपवाक्य के आशय को ठीक रखता है।
- source_word: וְהָעָם הַזֶּה
  choice: पर इस प्रजा
  rationale: वाव यहाँ रेकाबी वंशजों की आज्ञाकारिता और इस प्रजा की अवज्ञा के बीच स्पष्ट विरोध प्रकट करता है; ‘पर’ उस बल को दर्शाता है।
- source_word: לֹא שָׁמְעוּ אֵלָי
  choice: मेरी बात नहीं सुनी
  rationale: שׁמע אֶל का मूल बिंब किसी की बात सुनना है, जिसमें पालन करने का भाव भी निहित हो सकता है। यह अनुवाद दोनों स्तरों को खुला रखता है।
theological_decisions:
- issue: रेकाबी कुल के लिए पुत्र-संबंधी भाषा
  choice: यहोनादाब के वंशजों
  alternative: यहोनादाब के पुत्रों
  rationale: इब्रानी בְּנֵי दोनों अर्थ दे सकता है। यहाँ बहुत बाद की कुल-परंपरा का संदर्भ होने के कारण ‘वंशज’ कालगत अर्थ को स्पष्ट करता है और किसी विशिष्ट साम्प्रदायिक व्याख्या को नहीं जोड़ता।
- issue: אֲבִיהֶם में पिता अथवा पूर्वज
  choice: अपने पिता
  alternative: अपने पूर्वज
  rationale: मूल पाठ सीधी पारिवारिक भाषा का प्रयोग करता है। ‘पिता’ रखने से मानवीय पिता की आज्ञा मानने और परमेश्वर की बात न सुनने का धार्मिक तथा अलंकारिक तनाव सुरक्षित रहता है; संदर्भगत व्यापक अर्थ पादटिप्पणी में दिया गया है।
- issue: सुनने और आज्ञा मानने का संबंध
  choice: मेरी बात नहीं सुनी
  alternative: मेरी आज्ञा नहीं मानी
  rationale: मूल क्रिया सुनने और आज्ञापालन दोनों का संकेत दे सकती है। मुख्य पाठ में श्रवण-बिंब बनाए रखने और पादटिप्पणी में आज्ञापालन का निहित अर्थ बताने से मूल की अर्थ-व्याप्ति सुरक्षित रहती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सहज रखी गई है। ‘प्रजा’ दर्शाता है कि संबोधन सामूहिक और वाचा-संबंधी है; ‘इस’ मूल के संकेतात्मक और कुछ दूरी दर्शाने वाले स्वर को बनाए रखता है।
