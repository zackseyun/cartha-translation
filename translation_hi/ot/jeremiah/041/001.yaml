source:
  edition: WLC
  text: וַ/יְהִ֣י בַּ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֗י בָּ֣א יִשְׁמָעֵ֣אל בֶּן נְתַנְיָ֣ה בֶן אֱלִישָׁמָ֣ע מִ/זֶּ֣רַע הַ֠/מְּלוּכָה וְ/רַבֵּ֨י הַ/מֶּ֜לֶךְ וַ/עֲשָׂרָ֨ה אֲנָשִׁ֥ים אִתּ֛/וֹ אֶל גְּדַלְיָ֥הוּ בֶן אֲחִיקָ֖ם הַ/מִּצְפָּ֑תָ/ה וַ/יֹּ֨אכְלוּ שָׁ֥ם לֶ֛חֶם יַחְדָּ֖ו בַּ/מִּצְפָּֽה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/001.yaml
  text: In the seventh month[a], Ishmael son of Nethaniah, son of Elishama, of the royal line and one of the chief officers of the king, came with ten men to Gedaliah son of Ahikam at Mizpah[c][b], and they ate bread there together in Mizpah.
translation:
  language: hi
  text: सातवें महीने में, नतन्याह का पुत्र और एलीशामा का पोता इश्माएल, जो राजवंश से था[b] और राजा के प्रमुख अधिकारियों में से एक था[c], दस आदमियों को साथ लेकर मिस्पा में अहीकाम के पुत्र गदल्याह के पास आया। वहाँ, मिस्पा में, उन्होंने साथ मिलकर रोटी खाई[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “रोटी खाई” इब्रानी में साथ मिलकर भोजन करने का मुहावरा भी है।
    reason: lexical_alternative
  - marker: b
    text: या “राजकीय वंश से था”; शाब्दिक रूप से, “राजकीय बीज में से था।”
    reason: lexical_alternative
  - marker: c
    text: या “राजा के सामंतों में से एक था।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: अलग आरंभिक शब्द के बिना कथन का आरंभ
  rationale: यहाँ यह इब्रानी कथात्मक सूत्र दृश्य की शुरुआत करता है; आधुनिक हिन्दी में अलग से ‘और ऐसा हुआ’ कहना अनावश्यक और कृत्रिम होता।
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: सातवें महीने में
  rationale: यह स्पष्ट काल-सूचक पद है और कथा के कालक्रम को बनाए रखता है।
- source_word: מִזֶּרַע הַמְּלוּכָה
  choice: राजवंश से था
  rationale: זֶרַע यहाँ शाब्दिक ‘बीज’ नहीं, बल्कि वंश या राजकीय कुल से उत्पत्ति दर्शाता है।
- source_word: וְרַבֵּי הַמֶּלֶךְ
  choice: राजा के प्रमुख अधिकारियों में से एक था
  rationale: बहुवचन पद राजदरबार के उच्च पदस्थ लोगों के वर्ग को सूचित करता है; एकवचन इश्माएल के लिए हिन्दी में प्रतिनिधिक अभिव्यक्ति स्वाभाविक है।
- source_word: וַעֲשָׂרָה אֲנָשִׁים אִתּוֹ
  choice: दस आदमियों को साथ लेकर
  rationale: यह इश्माएल के साथ आए दल को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אֶל גְּדַלְיָהוּ ... הַמִּצְפָּתָה
  choice: मिस्पा में ... गदल्याह के पास आया
  rationale: मिस्पा के दिशासूचक रूप और गदल्याह की वहाँ उपस्थिति, दोनों को स्वाभाविक हिन्दी वाक्य-विन्यास में रखा गया है।
- source_word: וַיֹּאכְלוּ שָׁם לֶחֶם יַחְדָּו
  choice: वहाँ ... उन सबने मिलकर भोजन किया
  rationale: ‘रोटी खाना’ यहाँ साथ भोजन करने का मुहावरा है; अर्थ-स्पष्ट हिन्दी के लिए ‘भोजन किया’ चुना गया, जबकि पादटिप्पणी शाब्दिक रूप बताती है।
- source_word: בַּמִּצְפָּה
  choice: मिस्पा में
  rationale: स्रोत में स्थान-नाम की पुनरावृत्ति कथा को स्थानगत ढाँचा देती है, इसलिए हिन्दी में भी इसे बनाए रखा गया है।
theological_decisions:
- issue: इश्माएल का राजकीय संबंध
  choice: राजवंश से था
  alternative: राजकीय वंश का बीज था
  rationale: वंशगत संबंध को बनाए रखते हुए हिन्दी में भ्रामक शाब्दिकता से बचा गया है।
- issue: וְרַבֵּי הַמֶּלֶךְ की पद-संबंधी अस्पष्टता
  choice: राजा के प्रमुख अधिकारियों में से एक था
  alternative: राजा के सामंतों में से एक था
  rationale: इब्रानी पद उच्च राजकीय व्यक्ति, अधिकारी या कुलीन का संकेत दे सकता है; मुख्य पाठ में व्यापक अर्थ रखा और विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी में; शैली गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज है। लंबे इब्रानी वाक्य को पठनीयता के लिए दो हिन्दी वाक्यों में बाँटा गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में संबंधित पदों के तुरंत बाद रखे गए हैं।
