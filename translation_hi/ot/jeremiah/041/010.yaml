source:
  edition: WLC
  text: וַ/יִּ֣שְׁבְּ יִ֠שְׁמָעֵאל אֶת כָּל שְׁאֵרִ֨ית הָ/עָ֜ם אֲשֶׁ֣ר בַּ/מִּצְפָּ֗ה אֶת בְּנ֤וֹת הַ/מֶּ֨לֶךְ֙ וְ/אֶת כָּל הָ/עָם֙ הַ/נִּשְׁאָרִ֣ים בַּ/מִּצְפָּ֔ה אֲשֶׁ֣ר הִפְקִ֗יד נְבֽוּזַרְאֲדָן֙ רַב טַבָּחִ֔ים אֶת גְּדַלְיָ֖הוּ בֶּן אֲחִיקָ֑ם וַ/יִּשְׁבֵּ/ם֙ יִשְׁמָעֵ֣אל בֶּן נְתַנְיָ֔ה וַ/יֵּ֕לֶךְ לַ/עֲבֹ֖ר אֶל בְּנֵ֥י עַמּֽוֹן׀־־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/010.yaml
  text: Then Ishmael took captive all the remnant of the people who were in Mizpah—the king’s daughters and all the people who were left in Mizpah[a], whom Nebuzaradan the captain of the guard had entrusted to Gedaliah son of Ahikam[b]. Ishmael son of Nethaniah took them captive and went to cross over to the Ammonites.
translation:
  language: hi
  text: तब इश्माएल ने मिस्पा में बचे हुए सभी लोगों को—राजा की बेटियों और मिस्पा में बचे उन सभी लोगों को, जिन्हें अंगरक्षकों के प्रधान नबूज़रदान ने अहीकाम के पुत्र गदल्याह को सौंपा था—बंदी बना लिया[a]। नतन्याह के पुत्र इश्माएल ने उन्हें बंदी बना लिया और अम्मोनियों[b] के पास पार जाने के लिए चला गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बंदी करके ले गया।’ इब्रानी क्रिया बलपूर्वक बंदी बनाए जाने पर ज़ोर देती है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में ‘अम्मोन के पुत्र,’ अर्थात अम्मोनी लोग।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁבְּ / וַיִּשְׁבֵּם
  choice: बंदी बना लिया / उन्हें बंदी बनाकर
  rationale: שׁבה का क़ाल रूप लोगों को बलपूर्वक बंदी बनाने और ले जाने का अर्थ देता है। यह चयन हिंसक और अनैच्छिक बंधन को स्पष्ट रखता है तथा इब्रानी में क्रिया की पुनरावृत्ति को भी दर्शाता है।
- source_word: שְׁאֵרִית הָעָם
  choice: बचे हुए सभी लोग
  rationale: שְׁאֵרִית जीवित या शेष रह गए समुदाय को सूचित करता है। आधुनिक हिन्दी में यह पद स्वाभाविक है और यिर्मयाह में बचे हुए समूह की धारणा को बनाए रखता है।
- source_word: בַּמִּצְפָּה
  choice: मिस्पा में
  rationale: यहाँ ב स्थानसूचक है; स्थान-नाम को हिन्दी में प्रचलित लिप्यंतरण के साथ रखा गया है।
- source_word: בְּנוֹת הַמֶּלֶךְ
  choice: राजा की बेटियाँ
  rationale: यह इब्रानी पद का सीधा और स्वाभाविक अनुवाद है; ‘राजकुमारियाँ’ की अपेक्षा मूल संबंध को अधिक स्पष्ट रखता है।
- source_word: הַנִּשְׁאָרִים
  choice: बचे हुए
  rationale: שׁאר का कृदंत उन लोगों को दर्शाता है जो वहाँ शेष रह गए थे।
- source_word: הִפְקִיד
  choice: सौंपा था
  rationale: संदर्भ में नबूजरदान ने लोगों को गदल्याह की देखरेख में रखा था। ‘सौंपा था’ इस संबंध को सहज हिन्दी में व्यक्त करता है।
- source_word: רַב טַבָּחִים
  choice: अंगरक्षकों का प्रधान
  rationale: यह बाबिली राजकीय पदवी है। शब्द की मूल धातु वध से जुड़ी है, पर संदर्भ में राजकीय अंगरक्षक-दल के प्रधान अधिकारी का पद अभिप्रेत है।
- source_word: לַעֲבֹר אֶל
  choice: के पास जाने के लिए पार निकल पड़ा
  rationale: עבר के पार जाने या पार निकलने के गतिसूचक भाव और אֶל की गंतव्य-दिशा, दोनों को बिना किसी अनुल्लिखित नदी या सीमा को जोड़ने के बनाए रखा गया है।
- source_word: בְּנֵי עַמּוֹן
  choice: अम्मोनी
  rationale: शाब्दिक रूप ‘अम्मोन के पुत्र’ है, पर यहाँ यह जातिनाम है; ‘अम्मोनी’ आधुनिक हिन्दी में स्वाभाविक जातिसूचक रूप है।
