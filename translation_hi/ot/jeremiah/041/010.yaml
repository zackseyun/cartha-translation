  register: आधुनिक मानक हिन्दी की सहज किंतु गरिमापूर्ण शैली अपनाई गई है। मूल की लंबी संरचना को डैशों से स्पष्ट किया गया है, व्यक्तिनामों और स्थाननामों का परिचित हिन्दी लिप्यंतरण रखा गया है, और עבר में निहित ‘पार’ के भाव को किसी अनिर्दिष्ट भौगोलिक वस्तु को जोड़े बिना सुरक्षित रखा गया है।
