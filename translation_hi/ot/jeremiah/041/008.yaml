source:
  edition: WLC
  text: וַ/עֲשָׂרָ֨ה אֲנָשִׁ֜ים נִמְצְאוּ בָ֗/ם וַ/יֹּאמְר֤וּ אֶל יִשְׁמָעֵאל֙ אַל תְּמִתֵ֔/נוּ כִּֽי יֶשׁ לָ֤/נוּ מַטְמֹנִים֙ בַּ/שָּׂדֶ֔ה חִטִּ֥ים וּ/שְׂעֹרִ֖ים וְ/שֶׁ֣מֶן וּ/דְבָ֑שׁ וַ/יֶּחְדַּ֕ל וְ/לֹ֥א הֱמִיתָ֖/ם בְּ/ת֥וֹךְ אֲחֵי/הֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/008.yaml
  text: But ten men were found among them[a], and they said to Ishmael, “Do not put us to death, for we have hidden stores in the field—wheat and barley[b], oil and honey.” So he refrained and did not put them to death among their brothers.
translation:
  language: hi
  text: पर उनमें दस आदमी पाए गए[a], और उन्होंने इश्माएल से कहा, “हमें मत मारो, क्योंकि खेत में हमारे पास छिपे हुए भंडार हैं—गेहूँ, जौ, तेल और मधु।” तब वह रुक गया और उसने उन्हें उनके भाइयों के बीच नहीं मारा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “छिपे हुए भंडार” का अनुवाद “छिपी हुई चीज़ें” या “खज़ाने” भी हो सकता है; यहाँ सूची के कारण छिपी हुई खाद्य-सामग्री का अर्थ अधिक संभावित है।
    reason: lexical_alternative
  - marker: b
    text: “उनके भाइयों” से आशय संभवतः उनके साथ के वे लोग हैं जिन्हें मारा जा रहा था।
    reason: cultural_note
lexical_decisions:
- source_word: וַעֲשָׂרָה אֲנָשִׁים נִמְצְאוּ בָם
  choice: पर उनमें दस आदमी ऐसे निकले
  rationale: वाव यहाँ पिछले वध के बीच अपवाद प्रस्तुत करता है, इसलिए ‘पर’ स्वाभाविक है। निफ़अल נִמְצְאוּ को ‘ऐसे निकले’ आधुनिक हिन्दी में खोजे/पाए जाने और समूह में उपस्थित होने—दोनों का सहज भाव देता है।
- source_word: אַל תְּמִתֵנוּ
  choice: हमें मत मारो
  rationale: हिफ़इल रूप का शाब्दिक अर्थ ‘हमें मृत्यु मत दिलाओ’ है, पर इस प्रत्यक्ष हत्या-संदर्भ में ‘हमें मत मारो’ सबसे स्वाभाविक और अर्थ-सटीक हिन्दी है।
- source_word: כִּי יֵשׁ לָנוּ מַטְמֹנִים
  choice: क्योंकि ... हमारे छिपाए हुए भंडार हैं
  rationale: מַטְמֹנִים छिपाई हुई वस्तुओं अथवा भंडारों को दर्शाता है; सूची में अनाज, तेल और मधु होने के कारण यहाँ सामान्य ‘खज़ाने’ के बजाय खाद्य-सामग्री के छिपे भंडार अभिप्रेत हैं।
- source_word: בַּשָּׂדֶה
  choice: खेत में
  rationale: संज्ञा एकवचन और निश्चित है; कृषि-सामग्री के संदर्भ में सीधा अनुवाद ‘खेत में’ उपयुक्त है।
- source_word: חִטִּים וּשְׂעֹרִים וְשֶׁמֶן וּדְבָשׁ
  choice: गेहूँ, जौ, तेल और मधु
  rationale: चारों वस्तुओं को स्पष्ट आधुनिक सूची के रूप में रखा गया है। שֶׁמֶן संभवतः जैतून का तेल है, पर मूल केवल ‘तेल’ कहता है। דְבָשׁ के लिए dignified और व्यापक ‘मधु’ रखा गया है, जो शहद या फल-रस के गाढ़े शीरे की संभावित अर्थ-सीमा को अनावश्यक रूप से संकीर्ण नहीं करता।
- source_word: וַיֶּחְדַּל
  choice: तब वह रुक गया
  rationale: חדל का अर्थ किसी क्रिया से रुकना/बाज़ आना है। ‘रुक गया’ सामान्य पाठक के लिए सहज है और हत्या न करने के अगले कथन से इसका आशय स्पष्ट होता है।
- source_word: וְלֹא הֱמִיתָם
  choice: और उसने ... उन्हें नहीं मारा
  rationale: पहले अनुरोध के अनुरूप समान क्रिया रखी गई है; हिन्दी में यह हिफ़इल की हत्या-संबंधी शक्ति को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: בְּתוֹךְ אֲחֵיהֶם
  choice: उनके भाइयों के बीच
  rationale: ‘भाइयों’ से मूल אֲחֵיהֶם का सीधा संबंध-सूचक रूप बचता है। इसका आशय सगे भाई या साथ के लोग—दोनों हो सकता है; मुख्य पाठ इस अस्पष्टता को बनाए रखता है।
theological_decisions:
- issue: אֲחֵיהֶם में संबंध का दायरा
  choice: उनके भाइयों
  alternative: उनके साथियों / उनके जाति-भाइयों
  rationale: मूल का संबंध-सूचक शब्द जानबूझकर संकीर्ण नहीं किया गया। प्रसंग में यह मारे जा रहे उसी दल के दूसरे पुरुषों को सूचित कर सकता है, पर सगा या व्यापक जातीय संबंध भी शब्द की सीमा में रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कथात्मक शैली। ‘आदमी’ दृश्य के वयस्क पुरुषों को स्वाभाविक रूप से व्यक्त करता है; ‘मधु’ मूल शब्द की संभावित व्यापकता बनाए रखता है। सभी पाद-टिप्पणी चिह्न मुख्य पाठ में सम्मिलित हैं।
