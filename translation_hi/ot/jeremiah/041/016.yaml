- source_word: שְׁאֵרִית הָעָם
  choice: लोगों के उस सारे बचे हुए समूह
  rationale: ‘शेष’ के उत्तरजीवी भाव को बनाए रखते हुए यह सामान्य पाठक के लिए स्वाभाविक हिन्दी है।
- source_word: הֵשִׁיב
  choice: वापस ले आया था
  rationale: שוב के हिफ़ील रूप का मूल अर्थ वापस लाना या लौटा लाना है। इससे बचाव का प्रसंग स्पष्ट रहता है, पर क्रिया में ऐसा अर्थ नहीं जोड़ा जाता जो अनिवार्यतः निहित नहीं है।
