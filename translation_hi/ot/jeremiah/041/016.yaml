base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/016.yaml
  text: 'Then Yohanan son of Kareah[a], and all the commanders of the forces who were with him, took all the remnant of the people whom he had recovered from Ishmael son of Nethaniah, from Mizpah, after he had struck down Gedaliah son of Ahikam: the soldiers, the men of war, and the women, and the little children, and the court officials[b], whom he had brought back from Gibeon.'
translation:
  language: hi
  text: तब कारेह के पुत्र योहानान और उसके साथ के सैन्य दलों के सभी सेनापतियों ने लोगों में से बचे हुए सभी को अपने साथ लिया, जिन्हें योहानान नतन्याह के पुत्र इश्माएल से, मिस्पा से वापस ले आया था[a], उसके अहीकाम के पुत्र गदल्याह को मार डालने के बाद—पुरुषों को, अर्थात् योद्धाओं को, स्त्रियों को, छोटे बच्चों को और दरबारी अधिकारियों को[b]—जिन्हें वह गिबोन से वापस ले आया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जिन्हें योहानान ... से फिर ले आया था।” इब्रानी क्रिया הֵשִׁיב का अर्थ “वापस लाना” या “फिर ले आना” है; इस प्रसंग में इसमें छुड़ाकर वापस लाने का भाव भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “खोजे।” इब्रानी शब्द סָרִיסִים दरबारी अधिकारियों या शाब्दिक रूप से खोजों, दोनों को सूचित कर सकता है।
    reason: lexical_alternative
