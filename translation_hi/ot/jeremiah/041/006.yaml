base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/006.yaml
  text: Then Ishmael son of Nethaniah went out from Mizpah to meet them[a], going and weeping. When he met them, he said to them, “Come to Gedaliah son of Ahikam.”
translation:
  language: hi
  text: तब नतन्याह का पुत्र इश्माएल उनसे मिलने के लिए मिस्पा से निकला। वह चलते-चलते रोता जा रहा था।[a] जब वह उनसे मिला, तो उसने उनसे कहा, “अहीकाम के पुत्र गदल्याह के पास चलो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “जाते हुए, जाते हुए और रोते हुए”; यह निकट आते समय लगातार जारी रहने वाली क्रिया को व्यक्त करने वाला मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: तब ... निकला
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לִקְרָאתָם
  choice: उनसे मिलने के लिए
  rationale: यह पदबंध किसी की ओर जाकर उससे मिलने का सामान्य अर्थ देता है।
- source_word: מִן הַמִּצְפָּה
  choice: मिस्पा से
  rationale: מִן स्रोत या प्रस्थान-बिंदु बताता है; स्थान-नाम को हिन्दी में लिप्यंतरित किया गया है।
- source_word: הֹלֵךְ הָלֹךְ וּבֹכֶה
  choice: वह चलते-चलते रोता जा रहा था
  rationale: सहायक क्रिया-सदृश कृदंत के साथ infinitive absolute लगातार चल रही क्रिया पर बल देता है; यह हिन्दी प्रयोग गति और निरंतर रोने, दोनों को स्वाभाविक ढंग से रखता है।
- source_word: וַיְהִי כִּפְגֹשׁ אֹתָם
  choice: जब वह उनसे मिला
  rationale: सामान्य इब्रानी कालवाचक रचना को बिना अनावश्यक शाब्दिक बोझ के स्पष्ट आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: בֹּאוּ אֶל
  choice: के पास चलो
  rationale: संदर्भ में यह गदल्याह की ओर जाने का आमंत्रण या निर्देश है; ‘के पास चलो’ हिन्दी में स्वाभाविक है और वक्ता के छलपूर्ण आमंत्रण को बिना अतिरिक्त व्याख्या के रखता है।
- source_word: גְּדַלְיָהוּ בֶן אֲחִיקָם
  choice: अहीकाम के पुत्र गदल्याह
  rationale: इब्रानी संरक्षक-नाम को स्पष्ट, स्वाभाविक हिन्दी क्रम में रखा गया और व्यक्तिनामों का लिप्यंतरण किया गया है।
