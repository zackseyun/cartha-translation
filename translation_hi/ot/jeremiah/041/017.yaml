  yaml_path: translation/ot/jeremiah/041/017.yaml
  text: So they went and stayed at Geruth Chimham[a], which is beside Bethlehem[b], intending to go on into Egypt.
translation:
  language: hi
  text: वे गए और गेरूत[a] किमहाम[b] में ठहरे, जो बेतलेहेम के पास है, मिस्र जाने के इरादे से।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘किमहाम का ठहरने का स्थान।’ इब्रानी בְּגֵרוּת यहाँ सम्भवतः ‘गेरूत’ नामक स्थान को दर्शाता है, लेकिन इसका अर्थ किमहाम से जुड़ा कोई निवास या अस्थायी ठहराव का स्थान भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: दिए गए इब्रानी पाठ में इस नाम का लिखित रूप असामान्य है। प्रसंग ‘किमहाम’ नाम का समर्थन करता है; 2 शमूएल 19:37–40 में भी यही नाम मिलता है, और इससे जुड़ा स्थान बेतलेहेम के पास माना जाता है।
    reason: textual_variant
