- source_word: וַיֵּשְׁבוּ
  choice: में ठहरे
  rationale: यात्रा के इस प्रसंग में ישב का अर्थ बैठना नहीं, बल्कि कुछ समय किसी स्थान पर ठहरना है।
- source_word: בְּגֵרוּת
  choice: गेरूत
  rationale: यहाँ इसे सम्भावित स्थान-नाम के रूप में लिप्यंतरित किया गया है; फिर भी सामान्य संज्ञा के रूप में ‘ठहरने का स्थान’ अर्थ सम्भव है, इसलिए विकल्प पाद-टिप्पणी में रखा गया है।
- source_word: כמו/הם
  choice: किमहाम
  rationale: प्राप्त लिखित रूप असामान्य है, पर प्रसंग तथा प्राचीन पाठ-साक्ष्य उस व्यक्ति/स्थान से जुड़े नाम ‘किमहाम’ का समर्थन करते हैं; शाब्दिक ‘उनके समान’ यहाँ अर्थपूर्ण नहीं है।
- source_word: אֲשֶׁר אֵצֶל בֵּית לָחֶם
  choice: बेतलेहेम के पास स्थित
  rationale: אֵצֶל निकटता व्यक्त करता है; यह हिन्दी में स्थान-संबंध को स्पष्ट और स्वाभाविक रूप से बताता है।
- source_word: לָלֶכֶת לָבוֹא מִצְרָיִם
  choice: क्योंकि वे मिस्र में जाने का इरादा रखते थे
  rationale: दोनों ל-युक्त क्रियार्थक रूप उद्देश्य और गंतव्य की ओर गति व्यक्त करते हैं। हिन्दी में यह रूप उनके आगे मिस्र जाने के उद्देश्य को स्वाभाविक ढंग से प्रकट करता है, बिना यह कहे कि वे वहाँ पहुँच चुके थे।
- source_word: מִצְרָיִם
  choice: मिस्र
  rationale: इस स्थान-नाम का मानक हिन्दी रूप।
