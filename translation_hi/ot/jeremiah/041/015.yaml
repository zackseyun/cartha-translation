base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/015.yaml
  text: But Ishmael son of Nethaniah escaped from Johanan with eight men and went to the Ammonites[a][b][c].
translation:
  language: hi
  text: परन्तु नतन्याह का पुत्र इश्माएल आठ पुरुषों के साथ योहानान से बच निकला और अम्मोनियों के पास चला गया।[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘और इश्माएल’; संयोजक का अनुवाद ‘और’ भी हो सकता है, पर यहाँ ‘परन्तु’ पिछले वृत्तांत से विरोध को उभारता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘योहानान के सामने से’; यह उसकी उपस्थिति या पीछा करने से बच निकलने का मुहावरा है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में ‘अम्मोन के पुत्रों के पास’, अर्थात अम्मोनियों के पास।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יִשְׁמָעֵאל
  choice: परन्तु ... इश्माएल
  rationale: वाव का मूल अर्थ ‘और’ है, पर पिछले वृत्तांत के विपरीत परिणाम—योहानान के हस्तक्षेप के बावजूद इश्माएल का बच निकलना—को आधुनिक हिन्दी में ‘परन्तु’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: בֶּן נְתַנְיָה
  choice: नतन्याह का पुत्र
  rationale: इब्रानी पितृनाम-संरचना को स्पष्ट और स्वाभाविक हिन्दी में रखा गया है।
- source_word: נִמְלַט
  choice: बच निकला
  rationale: निफ़अल रूप यहाँ संकट या पीछा करने वाले से सफलतापूर्वक निकल जाने का भाव देता है; ‘बच निकला’ आधुनिक कथात्मक हिन्दी में सटीक है।
- source_word: בִּ/שְׁמֹנָה אֲנָשִׁים
  choice: आठ पुरुषों के साथ
  rationale: यहाँ ב संगति का बोध कराता है—इश्माएल के साथ आठ पुरुष थे।
- source_word: מִ/פְּנֵי יֽוֹחָנָן
  choice: योहानान से
  rationale: शाब्दिक ‘योहानान के सामने/उपस्थिति से’ एक इब्रानी मुहावरा है, जिसका प्रसंगगत अर्थ उसकी उपस्थिति या पीछा करने से बच निकलना है।
- source_word: וַ/יֵּלֶךְ
  choice: और ... चला गया
  rationale: वय्यिक्तोल कथा की अगली क्रमिक क्रिया बताता है; हिन्दी में ‘और ... चला गया’ क्रम को सहजता से बनाए रखता है।
- source_word: אֶל בְּנֵי עַמּוֹן
  choice: अम्मोनियों के पास
  rationale: ‘अम्मोन के पुत्र’ अम्मोन जाति के लोगों के लिए प्रचलित इब्रानी जातिवाचक अभिव्यक्ति है; ‘अम्मोनियों’ इसका स्वाभाविक हिन्दी रूप है।
