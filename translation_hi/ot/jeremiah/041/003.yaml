base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/003.yaml
  text: And Ishmael struck down all the Judeans who were with Gedaliah at Mizpah[c][b][a], and the Chaldeans who were found there—the men of war.
translation:
  language: hi
  text: और इश्माएल ने मिस्पा में गदल्याह के साथ थे उन यहूदा के सभी लोगों[a] को, और वहाँ पाए गए कसदियों[b]—यानी सैनिकों[c]—को मार डाला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सभी यहूदी।” यहाँ इब्रानी शब्द यहूदा या यहूदिया के लोगों को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “बेबीलोनी।” इब्रानी में “कसदी” है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से “युद्ध के पुरुष”; अर्थात युद्ध करनेवाले पुरुष या सैनिक।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיְּהוּדִים
  choice: यहूदा के लोग
  rationale: ऐतिहासिक संदर्भ में यह पद यहूदा प्रदेश के लोगों को सूचित करता है। यह अनुवाद आधुनिक हिन्दी में बाद के व्यापक धार्मिक-जातीय अर्थ को अनावश्यक रूप से आरोपित किए बिना भौगोलिक-राजनीतिक भाव बनाए रखता है।
- source_word: אִתּוֹ אֶת גְּדַלְיָהוּ
  choice: गदल्याह के साथ रहनेवाले
  rationale: सर्वनाम का संदर्भ अगले नाम ‘गदल्याह’ से स्पष्ट होता है; हिन्दी में दोनों को दोहराने के बजाय स्वाभाविक रूप से नाम के साथ संबंध व्यक्त किया गया है।
- source_word: בַּמִּצְפָּה
  choice: मिस्पा में
  rationale: नगर के भीतर घटित घटना के लिए ‘में’ स्वाभाविक हिन्दी है और स्थान-सूचक अर्थ को स्पष्ट रखता है।
- source_word: הַכַּשְׂדִּים
  choice: कसदी
  rationale: मूल पाठ के विशिष्ट ऐतिहासिक जाति-सूचक नाम को बनाए रखा गया है; संदर्भ में ये बेबीलोनी सेना के लोग हो सकते हैं, पर मूल शब्द को सामान्यीकृत नहीं किया गया।
- source_word: נִמְצְאוּ שָׁם
  choice: वहाँ पाए गए
  rationale: निफ़अल रूप के निष्क्रिय/परिणामी भाव को ‘वहाँ थे’ की अपेक्षा अधिक निकटता से सुरक्षित रखता है।
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: सैनिक
  rationale: शाब्दिक पद ‘युद्ध के पुरुष’ है; वर्तमान हिन्दी में ‘सैनिक’ उसी आशय को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הִכָּה
  choice: मार डाला
  rationale: इस हिंसक कथात्मक संदर्भ में क्रिया का आशय घातक प्रहार करके हत्या करना है; ‘मार डाला’ आधुनिक हिन्दी में परिणाम और क्रिया दोनों स्पष्ट करता है।
theological_decisions:
- issue: אַנְשֵׁי הַמִּלְחָמָה का संबंध
  choice: इसे निकटवर्ती ‘कसदियों’ की व्याख्या—‘यानी सैनिकों’—के रूप में प्रस्तुत किया गया है।
  alternative: इसे यहूदा के लोगों और कसदियों, दोनों के लिए सामूहिक विशेषण माना जा सकता है।
  rationale: हिब्रू में यह पद ‘कसदियों’ के तुरंत बाद समान कर्म-चिह्न के साथ आता है और स्वाभाविक रूप से उनकी व्याख्यात्मक पुनरुक्ति प्रतीत होता है; फिर भी वाक्य-विन्यास में कुछ संभावित व्यापकता है, इसलिए अनुवाद आवश्यकता से अधिक सिद्धांतगत निष्कर्ष नहीं निकालता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण रखी गई है। ‘यहूदा के लोग’ और ‘कसदी’ ऐतिहासिक संदर्भ बनाए रखते हैं; ‘मार डाला’ घातक हिंसा को बिना पुरातन या कृत्रिम शब्दावली के स्पष्ट करता है।
