  text: because of the Chaldeans[a], for they were afraid of them, because Ishmael son of Nethaniah had struck down Gedaliah son of Ahikam[c][b], whom the king of Babylon had appointed over the land.
translation:
  language: hi
  text: कसदियों[a] के कारण, क्योंकि वे उनसे डरते थे; क्योंकि नतन्याह के पुत्र इश्माएल ने अहीकाम के पुत्र गदल्याह को मार डाला था[b], जिसे बाबेल के राजा ने देश का अधिकारी नियुक्त किया था[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बाबेलवासी।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “प्रहार किया था”; यहाँ प्रसंग में वह प्रहार घातक था।
