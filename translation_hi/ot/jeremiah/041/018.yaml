lexical_decisions:
- source_word: מִפְּנֵי הַכַּשְׂדִּים
  choice: कसदियों के कारण
  rationale: מִפְּנֵי यहाँ स्थान नहीं, कारण व्यक्त करता है। הַכַּשְׂדִּים के जातीय नाम को ‘कसदी’ से रखा गया है; संदर्भ में इसका आशय बाबेल की साम्राज्यिक शक्ति से है।
- source_word: כִּי יָרְאוּ מִפְּנֵיהֶם
  choice: क्योंकि वे उनसे डरते थे
  rationale: पहला כִּי व्याख्यात्मक-कारणसूचक है और ירא भय को व्यक्त करता है। आधुनिक हिन्दी में ‘उनसे डरते थे’ स्वाभाविक है।
- source_word: הִכָּה
  choice: मार डाला था
  rationale: נכה का मूल अर्थ ‘मारना/प्रहार करना’ है, पर यहाँ पूर्ववर्ती कथा के अनुसार प्रहार घातक था। ‘मार डाला’ उस घातक संदर्भ को स्पष्ट करता है; शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: יִשְׁמָעֵאל בֶּן נְתַנְיָה
  choice: नतन्याह के पुत्र इश्माएल
  rationale: हिब्रू नामों का देवनागरी लिप्यंतरण किया गया है और construct संबंध को स्वाभाविक हिन्दी क्रम में रखा गया है।
- source_word: גְּדַלְיָהוּ בֶּן אֲחִיקָם
  choice: अहीकाम के पुत्र गदल्याह
  rationale: प्रत्यक्ष कर्म-चिह्न אֶת का अलग अनुवाद नहीं किया गया; वंश-संबंध को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: אֲשֶׁר הִפְקִיד מֶלֶךְ בָּבֶל בָּאָרֶץ
  choice: जिसे बाबेल के राजा ने देश पर अधिकारी ठहराया था
  rationale: Hiphil הִפְקִיד नियुक्त करने या उत्तरदायित्व सौंपने का अर्थ देता है। בָּאָרֶץ को प्रशासनिक अधिकार के अर्थ में ‘देश पर’ लिया गया है।
