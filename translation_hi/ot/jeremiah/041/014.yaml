  text: וַ/יָּסֹ֨בּוּ֙ כָּל הָ/עָ֔ם אֲשֶׁר שָׁבָ֥ה יִשְׁמָעֵ֖אל מִן הַ/מִּצְפָּ֑ה וַ/יָּשֻׁ֨בוּ֙ וַ/יֵּ֣לְכ֔וּ אֶל יֽוֹחָנָ֖ן בֶּן קָרֵֽחַ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/014.yaml
  text: Then all the people whom Ishmael had taken captive from Mizpah turned around and went back to Johanan son of Kareah[a].
translation:
  language: hi
  text: तब वे सब लोग, जिन्हें इश्माएल मिस्पा से बंदी बनाकर ले गया था[a], मुड़े और लौटकर कारेह के पुत्र योहानान के पास चले गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जिन्हें इश्माएल ने पकड़ लिया था”; अधिक शाब्दिक रूप में, “जिन्हें इश्माएल बंदी बनाकर ले गया था।”
    reason: שבה के लिए ‘पकड़ लेना’, ‘बंदी बनाना’ और ‘बंदी बनाकर ले जाना’ प्रसंगानुकूल निकट विकल्प हैं; टिप्पणी इस शब्द की अर्थ-सीमा दिखाती है।
lexical_decisions:
- source_word: וַיָּסֹבּוּ
  choice: मुड़े
  rationale: סבב का यह रूप दिशा बदलने की वास्तविक क्रिया बताता है। ‘मुड़े’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: כָּל הָעָם
  choice: वे सब लोग
  rationale: संदर्भ में सामूहिक संज्ञा הָעָם उस पूरे समूह को सूचित करती है जिसे इश्माएल ले गया था; हिन्दी में ‘वे सब लोग’ स्पष्ट और स्वाभाविक है।
- source_word: אֲשֶׁר שָׁבָה יִשְׁמָעֵאל
  choice: जिन्हें इश्माएल ... बंदी बनाकर ले गया था
  rationale: שבה का मूल अर्थ ‘बंदी बनाना/बंदी करके ले जाना’ है। ‘ले गया था’ पूर्व में घट चुकी क्रिया और मिस्पा से जबरन ले जाए जाने के प्रसंग, दोनों को व्यक्त करता है।
- source_word: מִן הַמִּצְפָּה
  choice: मिस्पा से
  rationale: מִן स्रोत या प्रस्थान-बिंदु बताता है; ‘से’ इसका सीधा और सहज हिन्दी रूप है।
- source_word: וַיָּשֻׁבוּ
  choice: लौटकर
  rationale: שוב को ‘लौटकर’ कहने से पिछले ‘मुड़े’ के साथ अनावश्यक बोझिलता घटती है, फिर भी मूल की वापसी की क्रिया बनी रहती है।
- source_word: וַיֵּלְכוּ אֶל
  choice: के पास चले गए
  rationale: הלך के साथ אֶל योहानान की ओर गति बताता है। ‘के पास चले गए’ सामान्य हिन्दी में गंतव्य को स्पष्ट करता है और पक्ष बदलने का अर्थ अनावश्यक रूप से नहीं जोड़ता।
- source_word: יוֹחָנָן בֶּן קָרֵחַ
  choice: कारेह के पुत्र योहानान
  rationale: इब्रानी नामों का देवनागरी लिप्यंतरण किया गया है और בֶּן का संबंध ‘के पुत्र’ से स्पष्ट रखा गया है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘मुड़े और लौटकर ... चले गए’ मूल के तीन क्रमिक क्रियापदों—दिशा बदलना, लौटना और योहानान के पास जाना—को स्वाभाविक हिन्दी में बनाए रखता है।
