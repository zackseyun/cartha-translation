source:
  edition: WLC
  text: וַ/יָּבֹ֣אוּ אֲ֠נָשִׁים מִ/שְּׁכֶ֞ם מִ/שִּׁל֤וֹ וּ/מִ/שֹּֽׁמְרוֹן֙ שְׁמֹנִ֣ים אִ֔ישׁ מְגֻלְּחֵ֥י זָקָ֛ן וּ/קְרֻעֵ֥י בְגָדִ֖ים וּ/מִתְגֹּֽדְדִ֑ים וּ/מִנְחָ֤ה וּ/לְבוֹנָה֙ בְּ/יָדָ֔/ם לְ/הָבִ֖יא בֵּ֥ית יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/005.yaml
  text: Then eighty men came from Shechem[a], from Shiloh, and from Samaria, with their beards shaved, their clothes torn, and gashing themselves[c][b], with grain offerings and frankincense in their hands to bring to the house of Yahweh.
translation:
  language: hi
  text: तब शकेम, शीलो और सामरिया से अस्सी पुरुष आए। उनकी दाढ़ियाँ मुंडी हुई थीं, उनके कपड़े फटे हुए थे और वे अपने शरीर पर चीरे लगा रहे थे[a]। उनके हाथों में अन्नबलि[b] और लोबान था, जिसे वे याहवे के भवन में चढ़ाने के लिए ले जा रहे थे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपने आपको काट रहे थे।’ यह शोक के समय अपने शरीर पर घाव करने की प्रथा को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘भेंट।’ हिब्रू शब्द मिन्हा उपासना-संबंधी प्रसंगों में प्रायः अन्नबलि को दर्शाता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से ‘याहवे का घर।’ यहाँ इसका संकेत मंदिर की साबुत इमारत के बजाय उसके पवित्र स्थल या परिसर की ओर भी हो सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: तब ... आए
  rationale: वाव-क्रमागत रूप कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में घटनाक्रम स्पष्ट करता है।
- source_word: אֲנָשִׁים / שְׁמֹנִים אִישׁ
  choice: अस्सी पुरुष
  rationale: संज्ञा यहाँ पुरुष व्यक्तियों को सूचित करती है; हिन्दी में संख्या के साथ ‘पुरुष’ स्वाभाविक है।
- source_word: מִשְּׁכֶם מִשִּׁלוֹ וּמִשֹּׁמְרוֹן
  choice: शकेम, शीलो और सामरिया से
  rationale: स्थान-नामों का प्रचलित हिन्दी लिप्यंतरण रखा गया है और स्रोत के संबंधसूचक מִן को ‘से’ द्वारा व्यक्त किया गया है।
- source_word: מְגֻלְּחֵי זָקָן
  choice: उनकी दाढ़ियाँ मुंडी हुई थीं
  rationale: निष्क्रिय कृदंत उनकी शोक-संबंधी अवस्था बताता है; यह रूप ठोस क्रिया और परिणाम दोनों बनाए रखता है।
- source_word: וּקְרֻעֵי בְגָדִים
  choice: उनके कपड़े फटे हुए थे
  rationale: यह शोक का परिचित बाहरी चिह्न है; ‘कपड़े’ साधारण आधुनिक हिन्दी में स्पष्ट है।
- source_word: וּמִתְגֹּדְדִים
  choice: वे अपने शरीर पर चीरे लगा रहे थे
  rationale: हिब्रू रूप स्वयं को काटने की जारी क्रिया दर्शाता है; ‘चीरे लगाना’ इसकी तीव्रता को केवल ‘काटना’ से अधिक स्पष्ट करता है।
- source_word: וּמִנְחָה
  choice: अन्नबलि
  rationale: उपासना-संबंधी प्रसंग और लोबान के साथ प्रयोग के कारण यहाँ अनाज से चढ़ाई जाने वाली भेंट अभिप्रेत होने की प्रबल संभावना है।
- source_word: וּלְבוֹנָה
  choice: लोबान
  rationale: यह शब्द सामान्य धूप नहीं, विशेष रूप से frankincense को दर्शाता है; ‘लोबान’ इसका प्रचलित हिन्दी नाम है।
- source_word: בְּיָדָם
  choice: उनके हाथों में
  rationale: मूल पाठ की ठोस शारीरिक अभिव्यक्ति सुरक्षित रखी गई है।
- source_word: לְהָבִיא
  choice: ले जा रहे थे
  rationale: उद्देश्यसूचक धातुरूप को हिन्दी वाक्य में जारी यात्रा और इच्छित गंतव्य के अनुरूप व्यक्त किया गया है।
- source_word: בֵּית יְהוָה
  choice: याहवे का भवन
  rationale: ‘भवन’ हिब्रू ‘घर’ के व्यापक अर्थ को बनाए रखता है और विनाश के बाद भी अनिवार्यतः अक्षुण्ण मंदिर-इमारत का दावा नहीं करता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पाठ में चार-अक्षरीय व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसका व्यापक रूप से स्वीकृत विद्वत्तापूर्ण हिन्दी लिप्यंतरण है और उसे उपाधि में नहीं बदलता।
- issue: בֵּית יְהוָה का आशय
  choice: याहवे का भवन
  alternative: याहवे का मंदिर
  rationale: मूल की व्यापक अभिव्यक्ति और यरूशलेम के विनाशोत्तर संदर्भ को सुरक्षित रखने के लिए ‘भवन’ चुना गया है; यह स्थल या पवित्र परिसर की संभावना को बंद नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। शोक के तीन बाहरी चिह्न समानांतर वाक्य-विन्यास में दिए गए हैं। अंतिम एकवचन संबंधवाचक ‘जिसे’ अन्नबलि और लोबान को सामूहिक चढ़ावे के रूप में ग्रहण करता है; इससे हिब्रू की सामूहिक संज्ञाओं का स्वाभाविक हिन्दी रूप मिलता है।
