  text: וַ/יְהִ֕י כְּ/בוֹאָ֖/ם אֶל תּ֣וֹךְ הָ/עִ֑יר וַ/יִּשְׁחָטֵ֞/ם יִשְׁמָעֵ֤אל בֶּן נְתַנְיָה֙ אֶל תּ֣וֹךְ הַ/בּ֔וֹר ה֖וּא וְ/הָ/אֲנָשִׁ֥ים אֲשֶׁר אִתּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/007.yaml
  text: And when they came into the midst of the city[a], Ishmael son of Nethaniah slaughtered them and threw them into the midst of the cistern, he and the men who were with him.
translation:
  language: hi
  text: जब वे नगर के बीच में आए, तब नतन्याह का पुत्र इश्माएल और उसके साथ के आदमियों ने उनका वध किया और उन्हें जलकुंड[a] के भीतर डाल दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘गड्ढे’। इब्रानी शब्द ‘बोर’ का अर्थ ‘गड्ढा’ या ‘जलकुंड’ दोनों हो सकता है; इस प्रसंग में ‘जलकुंड’ अधिक उपयुक्त जान पड़ता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּבוֹאָם
  choice: जब वे … पहुँचे, तब
  rationale: यह इब्रानी घटनाक्रम के बीच एक कालवाचक उपवाक्य आरम्भ करता है। हिन्दी में ‘जब … तब’ उसके समय-संबंध को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: אֶל תּוֹךְ הָעִיר
  choice: नगर के बीच में
  rationale: תּוֹךְ नगर के भीतरी भाग या मध्य को दर्शाता है; ‘नगर के बीच में’ इस स्थानिक बल को बनाए रखता है।
- source_word: וַיִּשְׁחָטֵם
  choice: उनका वध किया
  rationale: שׁחט साधारणतः गला काटकर मारने या निर्ममतापूर्वक वध करने का बोध देता है। ‘वध किया’ हिंसक आशय को गरिमापूर्ण, वर्तमान मानक हिन्दी में व्यक्त करता है।
- source_word: אֶל תּוֹךְ הַבּוֹר
  choice: उन्हें जलकुंड के भीतर डाल दिया
  rationale: मूल में गति या परिणाम का भाव है, यद्यपि ‘डालना’ क्रिया व्यक्त रूप से नहीं लिखी गई। हिन्दी में उसे स्पष्ट करना आवश्यक है। בּוֹר के लिए निकटवर्ती कथानक के आधार पर ‘जलकुंड’ चुना गया, जबकि ‘गड्ढा’ भी शाब्दिक रूप से संभव है।
- source_word: הוּא וְהָאֲנָשִׁים אֲשֶׁר אִתּוֹ
  choice: अपने साथ के आदमियों के साथ मिलकर
  rationale: यह पदबंध इश्माएल और उसके साथियों, दोनों को कृत्य का कर्ता बताता है। हिन्दी में ‘साथ मिलकर’ इस संयुक्त कर्तृत्व को स्वाभाविक ढंग से व्यक्त करता है।
