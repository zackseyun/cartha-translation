  text: וַ/יָּקָם֩ יִשְׁמָעֵ֨אל בֶּן נְתַנְיָ֜ה וַ/עֲשֶׂ֥רֶת הָ/אֲנָשִׁ֣ים אֲשֶׁר הָי֣וּ אִתּ֗/וֹ וַ֠/יַּכּוּ אֶת גְּדַלְיָ֨הוּ בֶן אֲחִיקָ֧ם בֶּן שָׁפָ֛ן בַּ/חֶ֖רֶב וַ/יָּ֣מֶת אֹת֑/וֹ אֲשֶׁר הִפְקִ֥יד מֶֽלֶךְ בָּבֶ֖ל בָּ/אָֽרֶץ־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/002.yaml
  text: Then Ishmael son of Nethaniah rose up with the ten men who were with him[a], and they struck down Gedaliah son of Ahikam, son of Shaphan, with the sword, and killed him—the one whom the king of Babylon had appointed over the land.
translation:
  language: hi
  text: तब नतन्याह का पुत्र इश्माएल और वे दस पुरुष जो उसके साथ थे, उठ खड़े हुए। उन्होंने शाफान के पोते, अहीकाम के पुत्र गदल्याह पर तलवार से वार किया और उसे मार डाला[a]। गदल्याह वही था जिसे बाबेल के राजा ने उस देश का प्रभारी नियुक्त किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्होंने गदल्याह को तलवार से मारा और उसे मार डाला।” इब्रानी में हमले और उसके घातक परिणाम के लिए क्रम से दो क्रियाएँ आई हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם ... וַעֲשֶׂרֶת הָאֲנָשִׁים
  choice: इश्माएल और ... वे दस पुरुष उठ खड़े हुए
  rationale: यह अभिव्यक्ति शत्रुतापूर्ण कार्रवाई आरम्भ करने के कथात्मक भाव को स्वाभाविक हिन्दी में व्यक्त करती है और ज्ञात दस पुरुषों की निश्चितता बनाए रखती है।
- source_word: אֲשֶׁר הָיוּ אִתּוֹ
  choice: उसके साथ के
  rationale: यह संक्षिप्त और स्वाभाविक हिन्दी में उन पुरुषों का इश्माएल के साथ होना दर्शाता है।
- source_word: וַיַּכּוּ ... בַּחֶרֶב
  choice: तलवार से वार किया
  rationale: नכה के प्रहार करने के मूल भाव और בּ के साधनवाचक प्रयोग को सुरक्षित रखता है; अगले क्रियापद से घातक परिणाम अलग व्यक्त होता है।
- source_word: וַיָּמֶת אֹתוֹ
  choice: उसे मार डाला
  rationale: מות के हिफ़इल रूप का कारणात्मक अर्थ स्वाभाविक आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: אֲשֶׁר הִפְקִיד
  choice: जिसे ... नियुक्त किया था
  rationale: प्रशासनिक संदर्भ में הפקיד किसी को पद और अधिकार सौंपने का अर्थ देता है; पूर्वकालिक ‘किया था’ कथानक के समय-संबंध को स्पष्ट रखता है।
- source_word: בָּאָרֶץ
  choice: उस देश पर
  rationale: नियुक्ति के संदर्भ में यह केवल स्थान नहीं, बल्कि गदल्याह के अधिकार-क्षेत्र को दर्शाता है।
- source_word: גְּדַלְיָהוּ בֶן אֲחִיקָם בֶּן שָׁפָן
  choice: शाफान के पोते, अहीकाम के पुत्र गदल्याह
  rationale: वंशावली की दोनों कड़ियाँ सुरक्षित रखते हुए हिन्दी में संबंधों को सहज और असंदिग्ध बनाता है।
- source_word: מֶלֶךְ בָּבֶל
  choice: बाबेल के राजा
  rationale: इब्रानी संबंधवाचक संरचना का मानक और स्वाभाविक हिन्दी रूप है।
