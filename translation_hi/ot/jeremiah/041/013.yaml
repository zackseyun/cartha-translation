  text: וַ/יְהִ֗י כִּ/רְא֤וֹת כָּל הָ/עָם֙ אֲשֶׁ֣ר אֶת יִשְׁמָעֵ֔אל אֶת יֽוֹחָנָן֙ בֶּן קָרֵ֔חַ וְ/אֵ֛ת כָּל שָׂרֵ֥י הַ/חֲיָלִ֖ים אֲשֶׁ֣ר אִתּ֑/וֹ וַ/יִּשְׂמָֽחוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/013.yaml
  text: And when all the people who were with Ishmael saw Johanan son of Kareah and all the commanders of the forces who were with him[a], they rejoiced.
translation:
  language: hi
  text: जब इश्माएल के साथ के सब लोगों ने कारेह के पुत्र योहानान और उसके साथ के सभी सेनापतियों को देखा, तो वे आनन्दित हुए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כִּרְאוֹת
  choice: जब ... ने ... देखा
  rationale: वाव-क्रम और כ सहित infinitive construct मिलकर कथा में समय-सूचक परिस्थिति प्रस्तुत करते हैं। आधुनिक हिन्दी में ‘जब ... देखा’ स्वाभाविक है और अनावश्यक रूप से ‘जैसे ही’ की तात्कालिकता नहीं जोड़ता।
- source_word: כָּל הָעָם אֲשֶׁר אֶת־יִשְׁמָעֵאל
  choice: इश्माएल के साथ के सब लोगों
  rationale: यहाँ אֵת सहचर्य का अर्थ देता है और सन्दर्भ में इश्माएल के साथ चल रहे लोगों की ओर संकेत करता है। ‘के साथ के’ सम्बन्धवाचक आशय को संक्षिप्त और स्पष्ट रखता है।
- source_word: יֽוֹחָנָן בֶּן־קָרֵחַ
  choice: कारेह के पुत्र योहानान
  rationale: हिब्रू नामों का देवनागरी लिप्यन्तरण किया गया है और patronymic संरचना को स्वाभाविक हिन्दी क्रम में रखा गया है।
- source_word: שָׂרֵי הַחֲיָלִים
  choice: सभी सेनापतियों
  rationale: שָׂרֵי नेतृत्व/अधिकारियों और הַחֲיָלִים सैन्य दलों को दर्शाता है। इस प्रसंग में ‘सेनापति’ संक्षिप्त, गरिमापूर्ण और सामान्य आधुनिक हिन्दी में स्पष्ट है।
- source_word: אֲשֶׁר אִתּוֹ
  choice: उसके साथ के
  rationale: एकवचन प्रत्यय का सबसे स्वाभाविक पूर्वपद योहानान है। हिन्दी में ‘उसके साथ के’ हिब्रू सर्वनाम को बनाए रखता है और सैनिक अधिकारियों से उसका सम्बन्ध स्पष्ट करता है।
- source_word: וַיִּשְׂמָחוּ
  choice: वे आनन्दित हुए
  rationale: שׂמח हर्षित या प्रसन्न होने का भाव व्यक्त करता है। ‘आनन्दित हुए’ क्रियात्मक परिवर्तन और भाव की तीव्रता को गरिमापूर्ण, सुबोध हिन्दी में व्यक्त करता है।
theological_decisions: []
