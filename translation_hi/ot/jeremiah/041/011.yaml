source:
  edition: WLC
  text: וַ/יִּשְׁמַע֙ יוֹחָנָ֣ן בֶּן קָרֵ֔חַ וְ/כָל שָׂרֵ֥י הַ/חֲיָלִ֖ים אֲשֶׁ֣ר אִתּ֑/וֹ אֵ֤ת כָּל הָֽ/רָעָה֙ אֲשֶׁ֣ר עָשָׂ֔ה יִשְׁמָעֵ֖אל בֶּן נְתַנְיָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/011.yaml
  text: When Johanan son of Kareah, and all the commanders of the forces who were with him, heard of all the evil that Ishmael son of Nethaniah had done,
translation:
  language: hi
  text: जब कारेह के पुत्र योहानान और उसके साथ के सभी सेनापतियों ने नतन्याह के पुत्र इश्माएल द्वारा किए गए सारे बुरे कामों के बारे में सुना,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: जब ... ने ... सुना
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है, पर पद 12 में मुख्य क्रिया आने के कारण यहाँ कालवाचक आश्रित वाक्य स्वाभाविक है।
- source_word: שָׂרֵי הַחֲיָלִים
  choice: सभी सेनापतियों
  rationale: שָׂרֵי नेतृत्व अथवा कमान और חֲיָלִים सैन्य दलों को सूचित करता है; संदर्भ में ‘सेनापति’ संक्षिप्त और स्वाभाविक आधुनिक हिन्दी है।
- source_word: אֲשֶׁר אִתּוֹ
  choice: उसके साथ के
  rationale: यह योहानान के साथ उपस्थित सेनापतियों की पहचान कराता है और हिन्दी में सहज संबंधवाचक अभिव्यक्ति है।
- source_word: אֵת כָּל הָרָעָה
  choice: सारे बुरे कामों के बारे में
  rationale: רָעָה यहाँ इश्माएल के नैतिक रूप से बुरे और हानिकारक कृत्यों को दर्शाता है; ‘बुरे काम’ नैतिक भार बनाए रखते हुए सुनने की विषयवस्तु स्पष्ट करता है।
- source_word: עָשָׂה
  choice: द्वारा किए गए
  rationale: मूल क्रिया का सामान्य अर्थ ‘करना’ है; यह रूप पूर्व में किए गए कृत्यों और उनके विषय में बाद में सुनने का संबंध स्वाभाविक रूप से व्यक्त करता है।
- source_word: יוֹחָנָן בֶּן קָרֵחַ
  choice: कारेह के पुत्र योहानान
  rationale: नामों का मानक हिन्दी लिप्यंतरण किया गया है और हिब्रू वंशसूचक संरचना को स्वाभाविक हिन्दी में रखा गया है।
- source_word: יִשְׁמָעֵאל בֶּן נְתַנְיָה
  choice: नतन्याह के पुत्र इश्माएल
  rationale: नामों का मानक हिन्दी लिप्यंतरण किया गया है और वंशसूचक संबंध स्पष्ट रखा गया है।
