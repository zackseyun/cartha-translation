    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: और ऐसा हुआ कि
  rationale: यह इब्रानी कथात्मक क्रम को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और अगले पद में जारी होने वाले वाक्य की भूमिका बनाए रखता है।
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: दूसरे दिन
  rationale: इब्रानी में दिन को स्पष्ट रूप से क्रमसूचक संख्या से बताया गया है; इसलिए इसे केवल ‘अगले दिन’ नहीं किया गया।
- source_word: לְהָמִית אֶת גְּדַלְיָהוּ
  choice: गदल्याह की हत्या के
  rationale: काल-संबंधी अर्थ ‘गदल्याह की हत्या के बाद दूसरे दिन’ है। संज्ञात्मक हिन्दी रचना स्वाभाविक है और इस पद में कर्ता के अनकहे रहने को बनाए रखती है।
- source_word: גְּדַלְיָהוּ
  choice: गदल्याह
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: וְאִישׁ לֹא יָדָע
  choice: जब किसी को भी इसका पता नहीं था
  rationale: शाब्दिक समन्वय ‘और कोई मनुष्य नहीं जानता था’ हिन्दी में अस्वाभाविक होगा। ‘जब’ परिस्थिति-सूचक संबंध को स्पष्ट करता है; ‘किसी को भी’ यहाँ सामान्य और समावेशी नकार को स्वाभाविक ढंग से व्यक्त करता है।
