source:
  edition: WLC
  text: וְ/הַ/בּ֗וֹר אֲשֶׁר֩ הִשְׁלִ֨יךְ שָׁ֤ם יִשְׁמָעֵאל֙ אֵ֣ת כָּל פִּגְרֵ֣י הָ/אֲנָשִׁ֗ים אֲשֶׁ֤ר הִכָּה֙ בְּ/יַד גְּדַלְיָ֔הוּ ה֗וּא אֲשֶׁ֤ר עָשָׂה֙ הַ/מֶּ֣לֶךְ אָסָ֔א מִ/פְּנֵ֖י בַּעְשָׁ֣א מֶֽלֶךְ יִשְׂרָאֵ֑ל אֹת֗/וֹ מִלֵּ֛א יִשְׁמָעֵ֥אל בֶּן נְתַנְיָ֖הוּ חֲלָלִֽים׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/009.yaml
  text: The cistern into which Ishmael had thrown all the corpses of the men whom he had struck down because of Gedaliah was the one that King Asa had made because of Baasha king of Israel[b][a]. Ishmael son of Nethaniah filled it with the slain.
translation:
  language: hi
  text: जिस हौद में इश्माएल ने उन सब पुरुषों की लाशें फेंक दी थीं, जिन्हें उसने गदल्याह के साथ मार डाला था,[a] वह वही हौद था जिसे राजा आसा ने इस्राएल के राजा बाशा के कारण बनवाया था।[b] नतन्याह के पुत्र इश्माएल ने उसे मारे गए लोगों से भर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जिन्हें उसने गदल्याह के कारण मार डाला था।” इब्रानी वाक्यांश का शाब्दिक अर्थ “गदल्याह के हाथ/पास” है और इस संदर्भ में उसका ठीक संबंध अनिश्चित है।
    reason: alternative_reading
  - marker: b
    text: या “इस्राएल के राजा बाशा के डर से।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבּוֹר
  choice: हौद
  rationale: בּוֹר गड्ढे या जल-संग्रह के लिए बने हौद को सूचित कर सकता है। आसा द्वारा इसे बनवाए जाने के ऐतिहासिक संदर्भ में ‘हौद’ मानव-निर्मित जलाशय का स्वाभाविक हिन्दी रूप है।
- source_word: הִשְׁלִיךְ שָׁם
  choice: में ... फेंक दी थीं
  rationale: क्रिया का अर्थ ‘फेंकना/डालना’ है; हिन्दी में गंतव्य को ‘में’ के साथ व्यक्त करना स्वाभाविक है और שָׁם का स्थानगत भाव इसी रचना में समाहित है।
- source_word: פִּגְרֵי
  choice: लाशें
  rationale: פֶּגֶר मृत देह को दर्शाता है। ‘लाशें’ सामान्य आधुनिक हिन्दी में स्पष्ट है और मूल की कठोरता बनाए रखता है।
- source_word: הָאֲנָשִׁים
  choice: पुरुषों
  rationale: यह संज्ञा यहाँ पुल्लिंग बहुवचन है; इसलिए सामान्य ‘लोगों’ के बजाय लिंग-सटीक ‘पुरुषों’ रखा गया है।
- source_word: הִכָּה
  choice: मार डाला था
  rationale: नכה का मूल भाव प्रहार करना है, पर मृत देहों के इस प्रसंग में इसका परिणाम हत्या है; ‘मार डाला’ स्पष्ट और स्वाभाविक है।
- source_word: בְּיַד גְּדַלְיָהוּ
  choice: गदल्याह के कारण
  rationale: शाब्दिक ‘गदल्याह के हाथ/पास’ इस वाक्य में कठिन और भ्रामक हो सकता है। ‘गदल्याह के कारण’ संबंध को खुला रखता है, जबकि अन्य संभव अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: הוּא אֲשֶׁר עָשָׂה
  choice: वह वही हौद था जिसे ... बनवाया था
  rationale: यह पुनरुक्त संकेतक रचना पहले बताए हौद की पहचान आसा द्वारा बनवाए हौद से कराती है। राजकीय निर्माण के लिए हिन्दी में ‘बनवाया’ स्वाभाविक है।
- source_word: מִפְּנֵי בַּעְשָׁא
  choice: बाशा के कारण
  rationale: מִפְּנֵי का अर्थ ‘के कारण’, ‘के सामने से’ अथवा ‘के डर से’ हो सकता है। मुख्य पाठ में व्यापक ‘के कारण’ रखा गया है और भय वाला अर्थ पादटिप्पणी में है।
- source_word: מִלֵּא
  choice: भर दिया
  rationale: पिएल रूप का सीधा अर्थ ‘भर देना’ है।
- source_word: חֲלָלִים
  choice: मारे गए लोगों
  rationale: חֲלָלִים हिंसा में मारे गए व्यक्तियों को सूचित करता है। ‘मारे गए लोगों’ अर्थ को स्पष्ट रखता है और हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: בְּיַד גְּדַלְיָהוּ का कठिन संबंध
  choice: गदल्याह के कारण
  alternative: गदल्याह के साथ / गदल्याह के पास
  rationale: इब्रानी वाक्यांश संदर्भ-निर्भर है और यह स्पष्ट नहीं करता कि पुरुष गदल्याह के कारण मारे गए या उसके साथ। मुख्य पाठ एक संभव अर्थ देता है, पर अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। ‘हौद’, ‘लाशें’ और ‘मार डाला’ सामान्य पाठक के लिए स्पष्ट हैं। कठिन इब्रानी संबंध और מִפְּנֵי की वैकल्पिक व्यंजना पादटिप्पणियों में सुरक्षित हैं; मुख्य पाठ में सभी पादटिप्पणी-चिह्न संबंधित वाक्यांशों के तुरंत बाद रखे गए हैं।
