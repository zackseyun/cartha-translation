  rationale: मूल पाठ में प्रयुक्त चतुरक्षरीय व्यक्तिगत नाम יהוה को किसी उपाधि से बदलने के बजाय हिंदी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है; वैकल्पिक उच्चारण पादटिप्पणी में दिया गया है।
- source_word: אֶל יִרְמְיָהוּ
  choice: यिर्मयाह के पास
  rationale: इस संदर्भ में אֶל संदेश के यिर्मयाह तक पहुँचने की दिशा बताता है; ‘के पास’ आधुनिक हिंदी में ‘वचन आया’ के साथ स्वाभाविक है।
- source_word: לֵאמֹר
  choice: ':'
  rationale: यह रूप आगे आने वाली प्रत्यक्ष वाणी का परिचय देता है। हिंदी में पद के अंत का द्विबिंदु वही कार्य स्वाभाविक ढंग से करता है और कृत्रिम ‘यह कहते हुए’ से बचाता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम है, इसलिए इसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया। इसके प्राचीन उच्चारण की अनिश्चितता को दबाए बिना मुख्य पाठ में हिंदी पाठकों के बीच व्यापक रूप ‘यहोवा’ रखा गया और ‘याहवे’ को पादटिप्पणी में बताया गया।
translation_notes:
