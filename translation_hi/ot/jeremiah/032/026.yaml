lexical_decisions:
- source_word: וַיְהִי
  choice: तब ... आया
  rationale: वाव-क्रमिक रूप कथा में अगली घटना प्रस्तुत करता है। हिंदी में ‘तब ... आया’ स्वाभाविक रूप से घटनाक्रम को आगे बढ़ाता है और अनावश्यक रूप से शाब्दिक ‘और ऐसा हुआ’ से बचता है।
- source_word: דְּבַר
