  text: וְ/עַתָּ֕ה לָ/כֵ֛ן כֹּֽה אָמַ֥ר יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל אֶל הָ/עִ֨יר הַ/זֹּ֜את אֲשֶׁ֣ר אַתֶּ֣ם אֹמְרִ֗ים נִתְּנָה֙ בְּ/יַ֣ד מֶֽלֶךְ בָּבֶ֔ל בַּ/חֶ֖רֶב וּ/בָ/רָעָ֥ב וּ/בַ/דָּֽבֶר־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/036.yaml
  text: 'Now therefore[a], thus says Yahweh, the God of Israel, concerning this city of which you say, ‘It has been given into the hand of the king of Babylon by the sword, by famine[b], and by pestilence’:'
translation:
  language: hi
  text: 'अब इसलिए, याहवे, इस्राएल का परमेश्वर, इस नगर के विषय में—जिसके बारे में तुम कहते हो, ‘यह तलवार, अकाल और महामारी[b] के द्वारा बाबेल के राजा के हाथ में सौंप दिया गया है[a]’—यों कहता है:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सौंपा जा रहा है।” इब्रानी पूर्ण रूप को यहाँ पूर्ण परिणाम अथवा निश्चित रूप से चल रही प्रक्रिया—दोनों अर्थों में समझा जा सकता है।
    reason: काल-पक्ष संबंधी वास्तविक इब्रानी अस्पष्टता को सुरक्षित रखना।
  - marker: b
    text: “महामारी” का अनुवाद “प्लेग” या “विनाशकारी रोग” भी किया जा सकता है।
    reason: דֶּבֶר के निकटवर्ती हिन्दी अर्थ-विकल्प बताना।
lexical_decisions:
- source_word: וְעַתָּה לָכֵן
  choice: अब इसलिए
  rationale: दोनों प्रवचन-सूचकों को बनाए रखते हुए पूर्व कथन से वर्तमान निष्कर्ष की ओर संक्रमण व्यक्त करता है।
- source_word: כֹּה אָמַר
  choice: यह कहता है
  rationale: हिन्दी में स्वाभाविक और गरिमापूर्ण रीति से भविष्यद्वक्ताई संदेश-सूत्र को व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय लिप्यंतरित करता है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल का परमेश्वर
  rationale: इब्रानी संबंधवाचक पदबंध का सीधा और स्वाभाविक अनुवाद।
- source_word: אֶל הָעִיר הַזֹּאת
  choice: इस नगर के विषय में
  rationale: यहाँ אֶל कथन के विषय को प्रस्तुत करता है; हिन्दी में ‘के विषय में’ अर्थ को स्पष्ट और स्वाभाविक रखता है।
- source_word: אֲשֶׁר אַתֶּם אֹמְרִים
  choice: जिसके बारे में तुम कहते हो
  rationale: नगर से जुड़े लोगों के कथन को वर्तमान कथन के रूप में बनाए रखता है।
- source_word: נִתְּנָה
  choice: सौंप दिया गया है
  rationale: निफ़अल पूर्ण रूप को परिणामकारी कर्मवाच्य के रूप में प्रस्तुत करता है; नगर के शत्रु के अधिकार में दिए जाने का भाव स्पष्ट करता है।
- source_word: בְּיַד מֶלֶךְ בָּבֶל
  choice: बाबेल के राजा के हाथ में
  rationale: अधिकार या नियंत्रण में सौंपे जाने वाली पारदर्शी इब्रानी उपमा को बनाए रखता है।
- source_word: בַּחֶרֶב וּבָרָעָב וּבַדָּבֶר
  choice: तलवार, अकाल और महामारी के द्वारा
  rationale: न्याय के तीन साधनों को ठोस शब्दावली और मूल क्रम में रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है; ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे उपाधि में नहीं बदलता।
- issue: נִתְּנָה का काल-पक्ष
  choice: सौंप दिया गया है
  alternative: सौंपा जा रहा है
  rationale: इब्रानी पूर्ण रूप पूर्ण या निश्चित रूप से घटित मानी गई क्रिया दर्शा सकता है। प्रसंग प्रगतिशील अर्थ की अनुमति दे सकता है, इसलिए विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप अपनाया गया है। ‘नगर’, ‘परमेश्वर’ और ‘के विषय में’ औपचारिक भविष्यद्वक्ताई शैली रखते हैं, जबकि वाक्य-विन्यास अनावश्यक रूप से पुरातन नहीं है। पादटिप्पणी-चिह्न ठीक उन्हीं पदों के बाद रखे गए हैं जिनकी वैकल्पिक व्याख्या दी गई है।
