source:
  edition: WLC
  text: כֹּֽה אָמַר֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל לָק֣וֹחַ אֶת הַ/סְּפָרִ֣ים הָ/אֵ֡לֶּה אֵ֣ת סֵפֶר֩ הַ/מִּקְנָ֨ה הַ/זֶּ֜ה וְ/אֵ֣ת הֶ/חָת֗וּם וְ/אֵ֨ת סֵ֤פֶר הַ/גָּלוּי֙ הַ/זֶּ֔ה וּ/נְתַתָּ֖/ם בִּ/כְלִי חָ֑רֶשׂ לְמַ֥עַן יַעַמְד֖וּ יָמִ֥ים רַבִּֽים־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/014.yaml
  text: 'Thus says Yahweh of hosts[a], the God of Israel: Take these documents, this deed of purchase, both the sealed copy and this open copy, and put them in an earthenware vessel[b], so that they may last for many days.'
translation:
  language: hi
  text: 'सेनाओं का याहवे, इस्राएल का परमेश्वर, यों कहता है: इन दस्तावेज़ों[a] को—खरीद का यह दस्तावेज़, यानी मुहरबंद दस्तावेज़ और यह खुला दस्तावेज़[b]—ले और मिट्टी के एक पात्र में रख दे, ताकि ये बहुत दिनों तक सुरक्षित रहें।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इन लिखित अभिलेखों को।” इब्रानी शब्द लिखित अभिलेखों या दस्तावेज़ों के लिए व्यापक रूप से प्रयुक्त हो सकता है; यहाँ प्रसंग कानूनी लेन-देन का है।
    reason: lexical_alternative
  - marker: b
    text: या, “यह बिना मुहर वाला दस्तावेज़।” इब्रानी पाठ खुले दस्तावेज़ को मुहरबंद दस्तावेज़ के विपरीत रखता है।
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का याहवे
  rationale: परमेश्वर के निज नाम को ‘याहवे’ के रूप में सुरक्षित रखा गया है और צְבָאוֹת का सीधा, स्वाभाविक अर्थ ‘सेनाओं का’ दिया गया है।
- source_word: הַסְּפָרִים הָאֵלֶּה
  choice: इन दस्तावेज़ों
  rationale: संदर्भ भूमि की कानूनी खरीद का है; इसलिए व्यापक अर्थ वाले סְפָרִים के लिए ‘दस्तावेज़’ स्पष्ट और आधुनिक विकल्प है।
- source_word: סֵפֶר הַמִּקְנָה
  choice: खरीद का यह दस्तावेज़
  rationale: यह पद भूमि के क्रय-विक्रय के कानूनी लेख को दर्शाता है; यह अनुवाद उसके दस्तावेज़ी और लेन-देन संबंधी दोनों पक्षों को व्यक्त करता है।
- source_word: הֶחָתוּם
  choice: मुहरबंद दस्तावेज़
  rationale: विशेषण के निहित संज्ञात्मक संदर्भ को हिंदी में स्पष्ट किया गया है, बिना इसे अनिवार्य रूप से ‘प्रतिलिपि’ मानने के।
- source_word: סֵפֶר הַגָּלוּי
  choice: यह खुला दस्तावेज़
  rationale: गָּלוּי मुहरबंद दस्तावेज़ के विपरीत खुले अथवा बिना मुहर वाले दस्तावेज़ को दर्शाता है; ‘खुला’ मूल रूपक को बनाए रखता है।
- source_word: בִּכְלִי חָרֶשׂ
  choice: मिट्टी के एक पात्र में
  rationale: मूल पद पकी मिट्टी से बने पात्र को दर्शाता है, पर उसका विशिष्ट आकार नहीं बताता; इसलिए ‘पात्र’ अनावश्यक विशिष्टीकरण से बचता है।
- source_word: לְמַעַן יַעַמְדוּ יָמִים רַבִּים
  choice: ताकि ये बहुत दिनों तक सुरक्षित रहें
  rationale: यहाँ ‘खड़े रहने’ का शाब्दिक भाव दस्तावेज़ों के लंबे समय तक बने और सुरक्षित रहने का मुहावरा है।
theological_decisions:
- issue: परमेश्वर के निज नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला निज नाम सीधे उपस्थित है। उसका लिप्यंतरण नाम की विशिष्टता को बनाए रखता है और किसी संप्रदायगत व्याख्या को नहीं जोड़ता।
- issue: יְהוָה צְבָאוֹת की उपाधि
  choice: सेनाओं का याहवे
  alternative: सर्वशक्तिमान याहवे
  rationale: ‘सेनाओं’ का अनुवाद मूल उपाधि के ठोस और कुछ हद तक खुले अर्थ को सुरक्षित रखता है; ‘सर्वशक्तिमान’ उसका व्याख्यात्मक विस्तार होता।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज कानूनी भाषा रखी गई है। आज्ञा को एकवचन ‘रख दे’ से व्यक्त किया गया है, क्योंकि संबोधन बारूक से है। डैश के भीतर का वाक्यांश ‘इन दस्तावेज़ों’ की पहचान स्पष्ट करता है।
