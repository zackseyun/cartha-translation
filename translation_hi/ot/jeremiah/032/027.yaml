source:
  edition: WLC
  text: הִנֵּה֙ אֲנִ֣י יְהוָ֔ה אֱלֹהֵ֖י כָּל בָּשָׂ֑ר הֲֽ/מִמֶּ֔/נִּי יִפָּלֵ֖א כָּל דָּבָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/027.yaml
  text: Behold[a], I am Yahweh, the God of all flesh. Is anything too difficult for me?
translation:
  language: hi
  text: देखो, मैं याहवे, सभी देहधारियों का परमेश्वर हूँ। क्या कोई बात मेरे लिए असाध्य होगी?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक शाब्दिक रूप में, “क्या कोई बात मेरे लिए अत्यन्त अद्भुत होगी?” इब्रानी क्रिया किसी बात के असाधारण होने या किसी की सामर्थ्य से परे होने—दोनों भाव व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला गंभीर उद्गार है। ‘देखो’ आधुनिक हिन्दी में स्वाभाविक रहते हुए इब्रानी की उद्घोषणात्मक शक्ति बनाए रखता है।
- source_word: אֲנִי יְהוָה
  choice: मैं याहवे ... हूँ
  rationale: इब्रानी के क्रियारहित आत्म-परिचय को हिन्दी में स्वाभाविक बनाने के लिए ‘हूँ’ जोड़ा गया है; याहवे व्यक्तिगत दिव्य नाम को लिप्यंतरित करता है।
- source_word: אֱלֹהֵי כָּל בָּשָׂר
  choice: सभी देहधारियों का परमेश्वर
  rationale: ‘देहधारी’ כָּל־בָּשָׂר के ‘समस्त प्राणी/मरणशील देह’ वाले व्यापक भाव को बनाए रखता है और इसे केवल मानवजाति तक सीमित नहीं करता।
- source_word: הֲמִמֶּנִּי יִפָּלֵא
  choice: क्या ... मेरे लिए असाध्य होगी?
  rationale: पלא का निफ़अल रूप यहाँ किसी बात के किसी की सामर्थ्य से परे होने का भाव देता है। ‘असाध्य’ संक्षिप्त, स्वाभाविक और प्रसंगानुकूल है; प्रश्न की आलंकारिक शक्ति भी बनी रहती है।
- source_word: כָּל דָּבָר
  choice: कोई बात
  rationale: नकारात्मक अपेक्षा वाले आलंकारिक प्रश्न में ‘कोई बात’ हिन्दी का स्वाभाविक रूप है और इब्रानी के सार्वभौमिक दायरे को सुरक्षित रखता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम स्पष्ट रूप से आया है। उसका लिप्यंतरण वाचा-संबंधी नाम को सामान्य उपाधि में बदलने से बचाता है।
- issue: כָּל בָּשָׂר का दायरा
  choice: सभी देहधारियों
  alternative: समस्त मानवजाति; सभी प्राणी
  rationale: यह चुनाव ‘समस्त देह’ की इब्रानी व्यापकता और मरणशीलता की छाया को रखता है तथा अर्थ को केवल मनुष्यों तक निर्णायक रूप से सीमित नहीं करता।
- issue: יִפָּלֵא में सामर्थ्य और अद्भुतता का संबंध
  choice: असाध्य
  alternative: अत्यन्त अद्भुत; सामर्थ्य से परे
  rationale: संदर्भ में प्रश्न परमेश्वर की सामर्थ्य पर केंद्रित है, इसलिए मुख्य पाठ में ‘असाध्य’ उपयुक्त है; फिर भी मूल क्रिया का ‘असाधारण/अद्भुत’ अर्थ-पक्ष पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘देखो’ उद्घोषणा की गंभीरता देता है; ‘देहधारी’ बाइबलीय मुहावरे की व्यापकता को अत्यधिक कृत्रिम हुए बिना बचाता है।
