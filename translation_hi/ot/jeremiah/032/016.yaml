source:
  edition: WLC
  text: וָ/אֶתְפַּלֵּ֖ל אֶל יְהוָ֑ה אַחֲרֵ֤י תִתִּ/י֙ אֶת סֵ֣פֶר הַ/מִּקְנָ֔ה אֶל בָּר֥וּךְ בֶּן נֵרִיָּ֖ה לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/016.yaml
  text: After I had given the deed of purchase to Baruch son of Neriah[a], I prayed to Yahweh, saying,
translation:
  language: hi
  text: 'नेरियाह के पुत्र बारूक को खरीद का दस्तावेज़ देने के बाद मैंने याहवे[a] से प्रार्थना की:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'हिब्रू: ‘YHWH।’ इसका अनुवाद ‘याहवे’ किया गया है; वैकल्पिक रूप ‘यहोवा’ है।'
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֶתְפַּלֵּל
  choice: मैंने प्रार्थना की
  rationale: התפלל का सामान्य अर्थ ‘प्रार्थना करना’ है; क्रिया में ऐसी अतिरिक्त तीव्रता नहीं है जिसे ‘गिड़गिड़ाकर’ जैसे शब्द से व्यक्त करना आवश्यक हो।
- source_word: אֶל יְהוָה
  choice: याहवे से
  rationale: אֶל यहाँ प्रार्थना के संबोधन को व्यक्त करता है, जिसके लिए स्वाभाविक हिन्दी में ‘से’ उपयुक्त है। परमेश्वर के व्यक्तिगत नाम יהוה को लिप्यंतरित किया गया है।
- source_word: אַחֲרֵי תִתִּי
  choice: देने के बाद
  rationale: 'यह रचना मुख्य क्रिया से पहले पूरी हुई घटना बताती है: पहले दस्तावेज़ दिया गया, फिर प्रार्थना की गई।'
- source_word: סֵפֶר הַמִּקְנָה
  choice: खरीद का दस्तावेज़
  rationale: סֵפֶר यहाँ पुस्तक नहीं, लिखित कानूनी दस्तावेज़ है; הַמִּקְנָה उसे खरीद से संबंधित बताता है। यह पदबंध सटीक और सामान्य आधुनिक हिन्दी में सुबोध है।
- source_word: אֶל בָּרוּךְ בֶּן נֵרִיָּה
  choice: नेरियाह के पुत्र बारूक को
  rationale: हिब्रू संबंध और नाम सुरक्षित रखते हुए हिन्दी की स्वाभाविक कारक-रचना अपनाई गई है।
- source_word: לֵאמֹר
  choice: ':'
  rationale: यह शब्द आगे आने वाली प्रार्थना के कथन का परिचय देता है। हिन्दी में वचन के अंत का द्विबिंदु उसी कार्य को अधिक स्वाभाविक ढंग से निभाता है।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में सामान्य उपाधि नहीं बल्कि चार अक्षरों वाला व्यक्तिगत नाम יהוה है। ‘याहवे’ उसका व्यापक रूप से स्वीकृत विद्वत्तापूर्ण लिप्यंतरण है; पाठक को प्रमुख वैकल्पिक परंपराओं से फुटनोट में अवगत कराया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। कानूनी संदर्भ के लिए ‘खरीद का दस्तावेज़’ चुना गया है। मूल के घटनाक्रम को स्पष्ट रखते हुए हिन्दी में स्वाभाविक क्रम अपनाया गया है।
