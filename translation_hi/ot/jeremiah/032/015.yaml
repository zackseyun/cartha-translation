id: JER.32.15
reference: Jeremiah 32:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֣י כֹ֥ה אָמַ֛ר יְהוָ֥ה צְבָא֖וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֑ל ע֣וֹד יִקָּנ֥וּ בָתִּ֛ים וְ/שָׂד֥וֹת וּ/כְרָמִ֖ים בָּ/אָ֥רֶץ הַ/זֹּֽאת׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/015.yaml
  text: 'For thus says Yahweh of hosts[a], the God of Israel: Houses and fields and vineyards will again be bought in this land.'
translation:
  language: hi
  text: 'क्योंकि याहवे, सेनाओं का परमेश्वर और इस्राएल का परमेश्वर, यों कहता है: इस देश में घर, खेत और दाख की बारियाँ फिर खरीदी जाएँगी[a]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “लोग इस देश में फिर घर, खेत और दाख की बारियाँ खरीदेंगे।” इब्रानी क्रिया निफ़अल रूप में है; इसे मध्यवाच्य अथवा निष्क्रिय-जैसे अर्थ में भी समझा जा सकता है, पर यहाँ “खरीदी जाएँगी” उसके रूप को बेहतर सुरक्षित रखता है।
    reason: क्रिया के वाच्य से संबंधित वास्तविक शाब्दिक विकल्प
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन में किए गए प्रतीकात्मक कार्य का कारण या स्पष्टीकरण प्रस्तुत करता है।
- source_word: כֹה אָמַר
  choice: यों कहता है
  rationale: यह भविष्यद्वक्ताओं का प्रचलित संदेशवाहक-सूत्र है; हिन्दी में वर्तमान काल इसे स्वाभाविक और प्रभावशाली ढंग से व्यक्त करता है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का याहवे
  rationale: व्यक्तिगत दिव्य नाम को लिप्यंतरित किया गया है और צְבָאוֹת की व्यापक सैन्य तथा स्वर्गीय छवि को ‘सेनाओं’ से सुरक्षित रखा गया है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल का परमेश्वर
  rationale: सम्बन्धवाचक इब्रानी पदबंध का सीधा और स्वाभाविक हिन्दी रूप, जो वाचा-संबंधी पहचान बनाए रखता है।
- source_word: עוֹד
  choice: फिर
  rationale: विनाश से बाधित सामान्य जीवन और संपत्ति-व्यवहार के भविष्य में दोबारा आरम्भ होने का भाव व्यक्त करता है।
- source_word: יִקָּנוּ
  choice: खरीदी जाएँगी
  rationale: निफ़अल रूप को निष्क्रिय वाच्य में रखते हुए सामान्य संपत्ति-लेनदेन की बहाली पर बल दिया गया है।
- source_word: בָתִּים וְשָׂדוֹת וּכְרָמִים
  choice: घर, खेत और दाख की बारियाँ
  rationale: तीनों प्रकार की संपत्ति को सरल, वर्तमान और सामान्य हिन्दी में अलग-अलग बनाए रखा गया है।
- source_word: בָּאָרֶץ הַזֹּאת
  choice: इस देश में
  rationale: यहाँ אֶרֶץ से आशय उस भूभाग से है जिसमें संपत्ति खरीदी जाएगी; ‘देश’ आधुनिक हिन्दी में स्वाभाविक है और संदर्भगत भूमि-बोध को बनाए रखता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ के व्यक्तिगत दिव्य नाम को किसी उपाधि से बदलने के बजाय हिन्दी में निकट लिप्यंतरण द्वारा सुरक्षित रखा गया है।
- issue: יִקָּנוּ के निफ़अल रूप का वाच्य
  choice: 'निष्क्रिय: ‘खरीदी जाएँगी’'
  alternative: 'मध्य/सक्रिय-जैसा: ‘लोग खरीदेंगे’'
  rationale: निष्क्रिय रूप इब्रानी क्रिया-रूप को सबसे स्पष्ट रूप से सुरक्षित रखता है और अनिर्दिष्ट खरीदारों के बजाय भूमि में सामान्य लेनदेन की पुनर्बहाली पर ध्यान रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर भविष्यद्वाणी के अनुरूप गरिमापूर्ण रखी गई है। ‘यों कहता है’ पारंपरिक संदेशवाहक-सूत्र को सहज रूप में व्यक्त करता है। ‘दाख की बारियाँ’ सामान्य पाठक के लिए बोधगम्य और कृषि-संपत्ति के संदर्भ में सटीक है।
