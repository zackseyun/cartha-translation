  verdict: revise
  source_fidelity: The draft accurately reflects the future restoration promise, the planting metaphor, and the explicit anthropomorphic idiom of God's whole heart and whole soul. The rendering of בֶּאֱמֶת as faithfulness is contextually sound, with viable alternatives retained in the note. ‘इस देश’ is possible, but ‘इस भूमि’ more directly represents הארץ and avoids a potentially narrower modern-political sense.
