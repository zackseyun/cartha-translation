source:
  edition: WLC
  text: וְ/שַׂשְׂתִּ֥י עֲלֵי/הֶ֖ם לְ/הֵטִ֣יב אוֹתָ֑/ם וּ/נְטַעְתִּ֞י/ם בָּ/אָ֤רֶץ הַ/זֹּאת֙ בֶּ/אֱמֶ֔ת בְּ/כָל לִבִּ֖/י וּ/בְ/כָל נַפְשִֽׁ/י־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/041.yaml
  text: I will rejoice over them to do them good[a], and I will plant them in this land in faithfulness, with all my heart and with all my soul.
translation:
  language: hi
  text: मैं उनका भला करने में आनन्दित होऊँगा, और उन्हें इस भूमि में निष्ठापूर्वक[a] रोपूँगा—अपने पूरे हृदय और अपने पूरे प्राण से।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “सच्चाई से” अथवा “सचमुच।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂשְׂתִּי עֲלֵיהֶם
  choice: मैं ... आनन्दित होऊँगा
  rationale: שׂושׂ का प्रबल भावात्मक अर्थ और עַל द्वारा चिह्नित आनन्द के विषय को स्वाभाविक हिन्दी में व्यक्त करता है। भविष्यकाल पुनर्स्थापना की भविष्यवाणी के अनुरूप है।
- source_word: לְהֵיטִיב אוֹתָם
  choice: उनका भला करने में
  rationale: हितकारी कार्य करने के उद्देश्य/परिणाम को सहज आधुनिक हिन्दी में रखता है और मूल मुहावरे का वाच्यार्थ बनाए रखता है।
- source_word: וּנְטַעְתִּים
  choice: उन्हें ... रोपूँगा
  rationale: נטע के कृषि-रूपक को बनाए रखता है; केवल ‘स्थापित करूँगा’ कहने से यिर्मयाह में प्रयुक्त रोपने का पुनर्स्थापना-चित्र मिट जाता।
- source_word: בָּאָרֶץ הַזֹּאת
  choice: इस देश में
  rationale: यहाँ אֶרֶץ प्रतिज्ञात भूभाग को सूचित करता है। आधुनिक हिन्दी में ‘इस देश में’ स्वाभाविक है और राजनीतिक अर्थ तक सीमित नहीं होता।
- source_word: בֶּאֱמֶת
  choice: सच्ची निष्ठा के साथ
  rationale: אֱמֶת की सत्यता, विश्वसनीयता और निष्ठा की अर्थ-सीमा में से इस प्रसंग में परमेश्वर की अटल और भरोसेमंद प्रतिबद्धता प्रमुख है।
- source_word: בְּכָל לִבִּי וּבְכָל נַפְשִׁי
  choice: अपने पूरे हृदय और अपने पूरे प्राण से
  rationale: सम्पूर्ण आन्तरिक और व्यक्तिगत समर्पण के इब्रानी मुहावरे को परिचित, गरिमापूर्ण हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: परमेश्वर के लिए हृदय और प्राण की मानव-सदृश भाषा
  choice: ‘अपने पूरे हृदय और अपने पूरे प्राण से’ को प्रत्यक्ष रूप में बनाए रखा गया।
  alternative: ‘अपने सम्पूर्ण अस्तित्व से’ अथवा ‘पूरी प्रतिबद्धता के साथ’
  rationale: मूल पाठ परमेश्वर की व्यक्तिगत और वाचा-संबंधी सम्पूर्ण प्रतिबद्धता को उसी सजीव मुहावरे में व्यक्त करता है जो मनुष्यों के लिए भी आता है; अमूर्त व्याख्या इस बल को घटा देती।
- issue: पुनर्स्थापना की प्रतिज्ञा में בֶּאֱמֶת का अर्थ
  choice: मुख्य पाठ में ‘सच्ची निष्ठा के साथ’।
  alternative: ‘सच्चाई से’ अथवा ‘सचमुच’
  rationale: संदर्भ परमेश्वर द्वारा अपनी प्रजा को भरोसेमंद ढंग से फिर रोपने की प्रतिबद्धता पर बल देता है। फिर भी ‘सच्चाई’ और ‘सचमुच’ मूल शब्द की वास्तविक सम्भावनाएँ हैं, इसलिए उन्हें पाद-टिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली सहज, गरिमापूर्ण और काव्यात्मक है। ‘रोपूँगा’ मूल पुनर्स्थापना-रूपक को और ‘हृदय’ तथा ‘प्राण’ मूल की सजीव मानव-सदृश भाषा को बनाए रखते हैं।
