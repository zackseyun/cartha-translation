base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/035.yaml
  text: They built the high places of Baal that are in the Valley of Ben-hinnom[a], to make their sons and their daughters pass through the fire to Molech—something I had not commanded them, nor had it entered my heart that they should do this abomination[c][b], causing Judah to sin.
translation:
  language: hi
  text: उन्होंने बेन-हिन्नोम की घाटी[a] में बाल के ऊँचे पूजा-स्थल बनाए, ताकि वे अपने पुत्रों और पुत्रियों को मोलेक के लिए आग में से पार कराएँ[b]—ऐसा करने की आज्ञा न मैंने उन्हें दी थी, न यह घृणित कार्य कभी मेरे हृदय में आया था[c]—ताकि वे यहूदा को पाप कराएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हिन्नोम के पुत्र की घाटी।”
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में, “अपने पुत्रों और अपनी पुत्रियों को मोलेक के लिए पार कराएँ।” यह मोलेक की उपासना से जुड़ी बाल-बलि की अभिव्यक्ति है; “आग में से” प्रसंग के आधार पर स्पष्ट किया गया है।
    reason: cultural_note
  - marker: c
    text: या, “न यह कभी मेरे मन में उठा।” हिब्रू में शाब्दिक रूप से, “न यह मेरे हृदय पर चढ़ा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּמוֹת הַבַּעַל
  choice: बाल के ऊँचे पूजा-स्थल
  rationale: ‘ऊँचे पूजा-स्थल’ प्राचीन कनानी-इस्राएली उपासना-स्थलों का अर्थ स्पष्ट करता है और केवल भौगोलिक ऊँचाई का भ्रम घटाता है; ‘बाल’ को यहाँ देवता के नाम के रूप में रखा गया है।
- source_word: בְּגֵיא בֶן־הִנֹּם
  choice: बेन-हिन्नोम की घाटी
  rationale: स्थान-नाम का लिप्यंतरण रखा गया है; ‘गेहन्ना’ इस पुराने नियम के संदर्भ में कालभ्रम उत्पन्न कर सकता है।
- source_word: לְהַעֲבִיר אֶת־בְּנֵיהֶם וְאֶת־בְּנוֹתֵיהֶם לַמֹּלֶךְ
  choice: अपने बेटे-बेटियों को मोलेक के लिए आग में से पार कराएँ
  rationale: ‘पार कराना’ हिब्रू क्रिया के रूपक को सुरक्षित रखता है; ‘आग में से’ इस मोलेक-संबंधी बलि-विधान का प्रसंगगत अर्थ स्पष्ट करता है, जबकि पादटिप्पणी बताती है कि ये शब्द मूल पद में प्रत्यक्ष नहीं हैं।
- source_word: וְלֹא עָלְתָה עַל־לִבִּי
  choice: न ... कभी मेरे हृदय में आया था
  rationale: हिब्रू के मानवरूपी और भावपूर्ण कथन को बनाए रखा गया है; इसे केवल ‘मेरे मन में विचार नहीं आया’ कहकर सपाट नहीं किया गया।
- source_word: הַתּוֹעֵבָה הַזֹּאת
  choice: यह घृणित काम
  rationale: आधुनिक हिन्दी में स्वाभाविक रहते हुए मूर्तिपूजा और बाल-बलि के प्रति मूल की तीव्र नैतिक घृणा व्यक्त करता है।
- source_word: לְמַעַן הַחֲטִיא אֶת־יְהוּדָה
  choice: और इस प्रकार यहूदा को पाप में डालें
  rationale: 'हिफ़ील रूप की कारणवाचक शक्ति को स्पष्ट करता है: उनके काम ने यहूदा को पाप की ओर लगाया।'
theological_decisions:
- issue: बाल-बलि वाले मुहावरे का स्वरूप
  choice: मूल मुहावरा ‘पार कराएँ’ रखा और प्रसंगगत ‘आग में से’ स्पष्ट किया।
  alternative: ‘मोलेक को बलि चढ़ाएँ’ या केवल ‘मोलेक के लिए पार कराएँ’।
  rationale: यह रूप पाठक को कृत्य की गंभीरता समझाता है, पर ‘बलि चढ़ाएँ’ जैसा पूर्ण व्याख्यात्मक प्रतिस्थापन नहीं करता; पादटिप्पणी मूल की संक्षिप्त अभिव्यक्ति को पारदर्शी बनाती है।
- issue: परमेश्वर के मानवरूपी कथन का अर्थ
  choice: ‘मेरे हृदय में आया’ को बनाए रखा।
  alternative: ‘मेरे मन में इसका विचार नहीं आया।’
  rationale: हिब्रू की धार्मिक और अलंकारिक तीव्रता को सुरक्षित रखा गया है तथा परमेश्वर के ज्ञान के विषय में कोई अतिरिक्त सिद्धान्त पाठ में आरोपित नहीं किया गया।
- issue: לְמַעַן का प्रयोजन अथवा परिणाम
  choice: ‘और इस प्रकार’ द्वारा परिणामसूचक अर्थ व्यक्त किया।
  alternative: ‘ताकि यहूदा को पाप कराएँ’ द्वारा स्पष्ट प्रयोजन।
  rationale: इस संदर्भ में वाक्य अपराध के परिणाम को रेखांकित कर सकता है; अनुवाद अनावश्यक रूप से यह दावा नहीं करता कि यहूदा को पाप में डालना उनका सचेत अंतिम उद्देश्य था।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘ऊँचे पूजा-स्थल’ सांस्कृतिक पद को समझने योग्य बनाता है; ‘मेरे हृदय में’ मूल की मानवरूपी भाषा और धार्मिक तनाव को सुरक्षित रखता है।
