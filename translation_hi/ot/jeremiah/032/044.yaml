base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/044.yaml
  text: Fields will be bought with silver[a], and deeds will be written in a scroll and sealed and witnessed by witnesses in the land of Benjamin, around Jerusalem, and in the cities of Judah, in the cities of the hill country, in the cities of the lowland, and in the cities of the Negeb; for I will restore their fortunes[c][b], declares Yahweh.
translation:
  language: hi
  text: लोग चाँदी देकर खेत खरीदेंगे, खरीद का दस्तावेज़ लिखेंगे, उस पर मुहर लगाएंगे और गवाहों से उसकी पुष्टि कराएँगे[a]। ऐसा बिन्यामीन के प्रदेश में, यरूशलेम के आस-पास, यहूदा के नगरों में, पहाड़ी प्रदेश के नगरों में, निचले प्रदेश[b] के नगरों में और नेगेव के नगरों में होगा; क्योंकि मैं उनकी दशा को फिर से बहाल करूँगा[c]—यह याहवे की घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “और गवाहों से गवाही दिलाएँगे”; यह गवाहों द्वारा औपचारिक पुष्टि किए जाने की कानूनी अभिव्यक्ति है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “शफ़ेला”; यह यहूदा का निचला भूभाग था।
    reason: cultural_note
  - marker: c
    text: इसका अनुवाद “मैं उनके निर्वासितों को लौटा लाऊँगा” या “मैं उनकी बँधुआई पलट दूँगा” भी हो सकता है। इब्रानी मुहावरा निर्वासन की समाप्ति और अधिक व्यापक पुनर्बहाली—दोनों को व्यक्त कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: שָׂדוֹת בַּכֶּסֶף יִקְנוּ
  choice: लोग चाँदी देकर खेत खरीदेंगे
  rationale: इब्रानी वाक्य सक्रिय बहुवचन में है—‘वे खेत खरीदेंगे।’ ‘लोग’ अनिर्दिष्ट कर्ता को स्वाभाविक हिन्दी में व्यक्त करता है, और ‘चाँदी देकर’ प्राचीन भुगतान-माध्यम की ठोस छवि बनाए रखता है।
- source_word: וְכָתוֹב בַּסֵּפֶר
  choice: खरीद का दस्तावेज़ लिखेंगे
  rationale: סֵפֶר यहाँ साहित्यिक पुस्तक नहीं, संपत्ति-लेनदेन का लिखित दस्तावेज़ है। ‘खरीद का’ प्रसंग में निहित अर्थ को स्पष्ट करता है।
- source_word: וְחָתוֹם
  choice: उस पर मुहर लगाएंगे
  rationale: यह संपत्ति के कानूनी दस्तावेज़ को मुहरबंद करने की क्रिया है; आधुनिक हिन्दी में यह स्वाभाविक कानूनी अभिव्यक्ति है।
- source_word: וְהָעֵד עֵדִים
  choice: गवाहों से उसकी पुष्टि कराएँगे
  rationale: हिफ़िल रूप औपचारिक रूप से गवाह ठहराने या गवाही द्वारा प्रमाणित कराने का भाव देता है। हिन्दी में अनावश्यक पुनरुक्ति से बचते हुए कानूनी अभिप्राय रखा गया है; शाब्दिक बनावट पादटिप्पणी में दी गई है।
- source_word: בְּאֶרֶץ בִּנְיָמִן
  choice: बिन्यामीन के प्रदेश में
  rationale: אֶרֶץ यहाँ गोत्रीय भूभाग है; ‘प्रदेश’ इस भौगोलिक अर्थ को स्पष्ट करता है।
- source_word: וּבִסְבִיבֵי יְרוּשָׁלִַם
  choice: यरूशलेम के आस-पास
  rationale: यह यरूशलेम के चारों ओर के क्षेत्र को साधारण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וּבְעָרֵי יְהוּדָה
  choice: यहूदा के नगरों में
  rationale: עָרִים के लिए ‘नगर’ गरिमापूर्ण और व्यापक हिन्दी शब्द है तथा दोहराई गई भौगोलिक सूची में उपयुक्त है।
- source_word: הָהָר
  choice: पहाड़ी प्रदेश
  rationale: यह किसी एक पहाड़ का नहीं, यहूदा के पहाड़ी भूभाग का भौगोलिक नाम है।
- source_word: הַשְּׁפֵלָה
  choice: निचला प्रदेश
  rationale: यह यहूदा के विशिष्ट निम्न भूभाग, शफ़ेला, को दर्शाता है। मुख्य पाठ में अर्थानुवाद पठनीय है और पारंपरिक नाम पादटिप्पणी में सुरक्षित है।
- source_word: הַנֶּגֶב
  choice: नेगेव
  rationale: सूची में यह दिशा मात्र नहीं बल्कि विशिष्ट दक्षिणी भौगोलिक क्षेत्र है, इसलिए स्थाननाम का लिप्यंतरण रखा गया है।
- source_word: אָשִׁיב אֶת שְׁבוּתָם
  choice: मैं उनकी स्थिति फिर बहाल करूँगा
  rationale: यह इब्रानी पुनर्स्थापना-सूत्र निर्वासन से वापसी तथा व्यापक दशा-परिवर्तन दोनों का संकेत दे सकता है। मुख्य पाठ व्यापक अर्थ रखता है और अधिक शाब्दिक विकल्प पादटिप्पणी में दिए गए हैं।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में चार-अक्षरीय वाचा-नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और नाम को सामान्य उपाधि में नहीं बदलता।
- issue: שְׁבוּתָם पुनर्स्थापना-सूत्र का दायरा
  choice: उनकी स्थिति फिर बहाल करूँगा
  alternative: उनके निर्वासितों को लौटा लाऊँगा / उनकी बँधुआई पलट दूँगा
  rationale: इब्रानी मुहावरा निर्वासित लोगों की वापसी पर केंद्रित हो सकता है, पर व्यापक पुनर्बहाली भी व्यक्त कर सकता है। मुख्य पाठ किसी एक अर्थ को अंतिम नहीं बनाता और विकल्प पादटिप्पणी में सुरक्षित हैं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। संपत्ति-लेनदेन की कानूनी क्रमबद्धता स्पष्ट की गई है, भौगोलिक सूची की पुनरावृत्त संरचना सुरक्षित रखी गई है, और पुनर्स्थापना-सूत्र की वास्तविक अर्थगत व्यापकता पादटिप्पणी में बनाए रखी गई है।
