source:
  edition: WLC
  text: לָ/כֵ֕ן כֹּ֖ה אָמַ֣ר יְהוָ֑ה הִנְ/נִ֣י נֹתֵן֩ אֶת הָ/עִ֨יר הַ/זֹּ֜את בְּ/יַ֣ד הַ/כַּשְׂדִּ֗ים וּ/בְ/יַ֛ד נְבֽוּכַדְרֶאצַּ֥ר מֶֽלֶךְ בָּבֶ֖ל וּ/לְכָדָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/028.yaml
  text: 'Therefore thus says Yahweh: Behold[a], I am giving this city into the hand of the Chaldeans and into the hand of Nebuchadnezzar king of Babylon, and he will capture it.'
translation:
  language: hi
  text: 'इसलिए याहवे यों कहता है: देखो, मैं इस नगर को कसदियों के हाथ में और बाबेल के राजा नबूकदरेस्सर[a] के हाथ में दे रहा हूँ, और वह इस पर अधिकार कर लेगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में नाम का रूप ‘नबूकदरेस्सर’ है; हिन्दी में इसे परंपरागत रूप से ‘नबूकदनेस्सर’ भी लिखा जाता है।
    reason: नाम के मूल-पाठीय और परंपरागत रूपों की जानकारी देना।
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले कथन से निकलने वाले परिणाम को स्पष्ट करता है और इब्रानी के निष्कर्षसूचक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: כֹּה אָמַר יְהוָה
  choice: यहोवा यों कहता है
  rationale: यह नबूवत का पारंपरिक संदेशवाहक सूत्र है; ‘यों कहता है’ उसकी गरिमा और प्रत्यक्षता को बनाए रखता है।
- source_word: הִנְנִי
  choice: देखो, मैं
  rationale: यह परमेश्वर की आगामी घोषणा पर जोर देता है; ‘देखो’ आधुनिक हिन्दी में ध्यान आकर्षित करने वाला स्वाभाविक और गंभीर शब्द है।
- source_word: נֹתֵן
  choice: देने जा रहा हूँ
  rationale: वर्तमान कृदंत यहाँ निकट और निश्चित भावी कार्य व्यक्त करता है। यह हिन्दी में ‘मैं दे रहा हूँ’ की संभावित भ्रामक तात्कालिकता से बचते हुए आसन्नता बनाए रखता है।
- source_word: בְּיַד
  choice: के हाथ में
  rationale: इब्रानी मुहावरे को हिन्दी में भी सहज रूप से समझा जा सकता है; यह किसी के नियंत्रण में सौंपे जाने का अर्थ देता है।
- source_word: הַכַּשְׂדִּים
  choice: कसदियों
  rationale: मूल जातिनाम का सीधा हिन्दी रूप है; इसी पद में बाबेल के राजा का उल्लेख ऐतिहासिक संदर्भ स्पष्ट करता है।
- source_word: נְבוּכַדְרֶאצַּר
  choice: नबूकदरेस्सर
  rationale: यह इस पद में प्रयुक्त इब्रानी रूप को निकटता से दर्शाता है; अधिक परिचित वैकल्पिक रूप पादटिप्पणी में दिया गया है।
- source_word: וּלְכָדָהּ
  choice: और वह इसे अपने अधिकार में कर लेगा
  rationale: क्रिया का अर्थ किसी नगर को जीतकर कब्जे में लेना है। निकटतम एकवचन कर्ता नबूकदरेस्सर है; ‘अपने अधिकार में कर लेगा’ इस सैन्य संदर्भ को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ के व्यक्तिगत वाचा-नाम को उपाधि ‘प्रभु’ से बदलने के बजाय नाम के रूप में रखा गया है। ‘यहोवा’ हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाता है।
- issue: וּלְכָדָהּ की एकवचन क्रिया का कर्ता
  choice: ‘वह’ से नबूकदरेस्सर का संकेत
  alternative: भाववाच्य ‘यह जीत लिया जाएगा’ या सामूहिक रूप से कसदी
  rationale: इब्रानी क्रिया पुल्लिंग एकवचन है और निकटतम स्पष्ट एकवचन पूर्वपद बाबेल का राजा नबूकदरेस्सर है। अनुवाद इस व्याकरणिक संकेत को बनाए रखता है, बिना यह नकारे कि विजय उसकी सेना के द्वारा होगी।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। नबूवत के औपचारिक सूत्र के लिए ‘यों कहता है’ और जोरदार उद्घोषणा के लिए ‘देखो’ रखा गया है। ‘के हाथ में’ मूल इब्रानी मुहावरे को सुरक्षित रखते हुए हिन्दी में सहज है।
