  yaml_path: translation/ot/jeremiah/032/034.yaml
  text: They put their detestable things in the house that is called by my name[b][a], to defile it.
translation:
  language: hi
  text: उन्होंने अपनी घृणित वस्तुएँ[a] उस भवन में[b] रखीं, जो मेरे नाम से कहलाता है, उसे अशुद्ध करने के लिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनकी घृणास्पद बातें।” इब्रानी शब्द प्रायः मूर्तिपूजा से जुड़ी घृणित वस्तुओं या प्रथाओं के लिए प्रयुक्त होता है।
    reason: lexical_alternative
  - marker: b
    text: या “उस मंदिर में।” इब्रानी में शाब्दिक रूप से “उस घर में” है; यहाँ संकेत उस मंदिर की ओर है जो परमेश्वर के नाम से कहलाता था।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: उन्होंने ... रख दीं
  rationale: שׂים का यह कथात्मक रूप भूतकाल की ठोस क्रिया बताता है। ‘रख दीं’ आधुनिक हिन्दी में स्वाभाविक है और वस्तुओं को भवन में स्थापित करने का भाव बनाए रखता है।
- source_word: שִׁקּוּצֵיהֶם
  choice: अपनी घृणित वस्तुएँ
  rationale: שִׁקּוּץ ऐसी वस्तु या आचरण को सूचित करता है जो धार्मिक और नैतिक रूप से घृणित हो, और प्रायः मूर्तिपूजा से जुड़ा होता है। ‘घृणित वस्तुएँ’ अर्थ को व्यापक रखता है और बिना आवश्यकता केवल ‘मूर्तियाँ’ निर्दिष्ट नहीं करता।
- source_word: בַּבַּיִת
  choice: उस भवन में
  rationale: בַּיִת का मूल अर्थ ‘घर/भवन’ है; यहाँ प्रसंग में यह मंदिर है। ‘भवन’ मूल शब्द की छवि बनाए रखते हुए पवित्र सार्वजनिक संरचना के लिए स्वाभाविक हिन्दी देता है।
- source_word: אֲשֶׁר נִקְרָא שְׁמִי עָלָיו
  choice: जो मेरे नाम से कहलाता है
  rationale: यह इब्रानी मुहावरा परमेश्वर के स्वामित्व, दावे और समर्पण का संकेत देता है। यह अनुवाद मुहावरे को दिखाई देता रखता है और आधुनिक हिन्दी में समझने योग्य है।
- source_word: לְטַמְּאוֹ
  choice: और इस प्रकार उसे अशुद्ध किया
  rationale: לְ उपसर्गयुक्त infinitive यहाँ उद्देश्य अथवा परिणाम व्यक्त कर सकता है। ‘इस प्रकार’ उस संबंध को स्वाभाविक हिन्दी में रखता है, जबकि ‘अशुद्ध किया’ पवित्रस्थान के धार्मिक और नैतिक अपवित्रीकरण का भाव देता है।
theological_decisions:
- issue: בַּבַּיִת को सामान्य ‘भवन’ कहना या प्रसंगानुसार ‘मंदिर’ कहना
  choice: भवन
  alternative: मंदिर
  rationale: मुख्य पाठ में मूल के ‘घर/भवन’ को बनाए रखना स्रोत के निकट है; प्रसंगगत पहचान ‘मंदिर’ को पादटिप्पणी में स्पष्ट किया गया है।
- issue: לְטַמְּאוֹ को उद्देश्य या परिणाम के रूप में व्यक्त करना
  choice: और इस प्रकार उसे अशुद्ध किया
  alternative: उसे अशुद्ध करने के लिए
  rationale: इब्रानी रचना उद्देश्य और परिणामी प्रभाव—दोनों की छाया रख सकती है। मुख्य पाठ में परिणाम-संबंध स्वाभाविक ढंग से दिया गया है, और पादटिप्पणी उद्देश्यवाचक विकल्प सुरक्षित रखती है।
