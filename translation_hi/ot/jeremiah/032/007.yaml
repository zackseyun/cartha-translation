  text: הִנֵּ֣ה חֲנַמְאֵ֗ל בֶּן שַׁלֻּם֙ דֹּֽדְ/ךָ֔ בָּ֥א אֵלֶ֖י/ךָ לֵ/אמֹ֑ר קְנֵ֣ה לְ/ךָ֗ אֶת שָׂדִ/י֙ אֲשֶׁ֣ר בַּ/עֲנָת֔וֹת כִּ֥י לְ/ךָ֛ מִשְׁפַּ֥ט הַ/גְּאֻלָּ֖ה לִ/קְנֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/007.yaml
  text: Look[a], Hanamel son of Shallum, your uncle, is coming to you, saying, ‘Buy my field that is in Anathoth, for the right of redemption to buy it belongs to you.’
translation:
  language: hi
  text: देख, तेरे चाचा शल्लूम का बेटा हनमेल तेरे पास आ रहा है और कहेगा, ‘अनातोत में मेरा जो खेत है, उसे अपने लिए खरीद ले, क्योंकि उसे छुड़ाकर खरीदने का अधिकार तेरा है।’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे वापस खरीदने का कानूनी अधिकार तेरा है।” इब्रानी पद परिवार की संपत्ति को निकट संबंधी द्वारा छुड़ाने या वापस खरीदने के अधिकार को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: देख
  rationale: यह आने वाली घटना को तत्क्षण और सजीव रूप से प्रस्तुत करता है; आधुनिक हिन्दी में ‘देख’ इसके संकेतात्मक बल को बनाए रखता है।
- source_word: חֲנַמְאֵל
  choice: हनमेल
  rationale: व्यक्तिनाम का मूल ध्वनियों के निकट देवनागरी लिप्यंतरण।
- source_word: דֹּדְךָ
  choice: तेरा चाचा
  rationale: इस पारिवारिक भूमि-विमोचन प्रसंग में शब्द निकट पुरुष संबंधी, विशेषतः चाचा, को सूचित करता है; ‘प्रिय’ अर्थ यहाँ उपयुक्त नहीं है।
- source_word: בָּא אֵלֶיךָ
  choice: तेरे पास आकर कहेगा
  rationale: हिब्रू कृदन्त आसन्न घटना को सजीव रूप में रखता है। हिन्दी में भविष्यसूचक प्रसंग के अनुसार ‘आकर कहेगा’ स्वाभाविक है और उसके शीघ्र आने का भाव देता है।
- source_word: קְנֵה לְךָ
  choice: अपने लिए मोल ले
  rationale: आज्ञार्थक क्रिया קנה खरीदने/अर्जित करने को कहती है; ‘मोल ले’ भूमि के लेन-देन के लिए स्पष्ट और गरिमापूर्ण है, जबकि לְךָ का भाव ‘अपने लिए’ से व्यक्त होता है।
- source_word: שָׂדִי
  choice: मेरा ... खेत
  rationale: שָׂדֶה का ठोस संपत्ति-संदर्भ ‘खेत’ से सीधे व्यक्त होता है।
- source_word: בַּעֲנָתוֹת
  choice: अनातोत में
  rationale: स्थाननाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: מִשְׁפַּט הַגְּאֻלָּה
  choice: छुड़ाकर मोल लेने का अधिकार
  rationale: यह पद परिवार की भूमि को निकट संबंधी द्वारा वापस खरीदने के मान्य अधिकार को दर्शाता है। यह अनुवाद कानूनी-पारिवारिक अर्थ स्पष्ट करता है और केवल आध्यात्मिक ‘छुटकारे’ का भ्रम घटाता है।
- source_word: כִּי לְךָ ... לִקְנוֹת
  choice: क्योंकि उसे छुड़ाकर मोल लेने का अधिकार तेरा है
  rationale: कारण, अधिकार और खरीद के लक्ष्य—तीनों को स्वाभाविक हिन्दी वाक्य में सुरक्षित रखा गया है; ‘उसे’ का संदर्भ खेत से है।
theological_decisions:
- issue: भूमि-कानून में גְּאֻלָּה का स्वरूप
  choice: इसे पारिवारिक संपत्ति को ‘छुड़ाकर मोल लेने’ के अधिकार के रूप में प्रस्तुत किया गया है।
  alternative: ‘छुड़ाने का अधिकार’ या ‘वापस खरीदने का अधिकार’
  rationale: प्रसंग पारिवारिक भूमि की खरीद और निकट संबंधी के अधिकार से संबंधित है। चुना हुआ रूप वाचा-संबंधी कानूनी धारणा को बनाए रखता है, पर इसे आध्यात्मिक उद्धार का अर्थ नहीं देता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। संबोधन में एकवचन आत्मीय रूप ‘तेरा/तेरे’ मूल के पुरुष एकवचन को दर्शाता है। मुख्य पाठ में कानूनी अवधारणा को समझने योग्य बनाने के लिए ‘छुड़ाकर मोल लेने’ का प्रयोग किया गया है।
