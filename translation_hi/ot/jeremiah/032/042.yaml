  text: כִּֽי כֹה֙ אָמַ֣ר יְהוָ֔ה כַּ/אֲשֶׁ֤ר הֵבֵ֨אתִי֙ אֶל הָ/עָ֣ם הַ/זֶּ֔ה אֵ֛ת כָּל הָ/רָעָ֥ה הַ/גְּדוֹלָ֖ה הַ/זֹּ֑את כֵּ֣ן אָנֹכִ֞י מֵבִ֤יא עֲלֵי/הֶם֙ אֶת כָּל הַ/טּוֹבָ֔ה אֲשֶׁ֥ר אָנֹכִ֖י דֹּבֵ֥ר עֲלֵי/הֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/042.yaml
  text: 'For thus says Yahweh: Just as I brought on this people all this great disaster[b][a], so I will bring on them all the good that I am speaking concerning them.'
translation:
  language: hi
  text: 'क्योंकि यहोवा यों कहता है: जैसे मैं इस प्रजा पर यह सारी बड़ी विपत्ति[a] ले आया, वैसे ही मैं उन पर सारी भलाई ले आऊँगा, जिसकी मैं उनके विषय में चर्चा कर रहा हूँ।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यह सारी बड़ी महाविपदा।” इब्रानी शब्द का शाब्दिक अर्थ “बुराई/विपत्ति” हो सकता है; यहाँ इसका आशय न्यायस्वरूप आई विपदा है, नैतिक बुराई नहीं।
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी में क्रिया कृदंत रूप में है: “मैं उन पर ... ला रहा हूँ”; इस भविष्यसूचक संदर्भ में यह निश्चित भावी कार्य को व्यक्त करती है। वाक्यांश का निकट अर्थ है, “जिसकी मैं उनके विषय में चर्चा कर रहा हूँ”; संदर्भ में इसे “जिसकी प्रतिज्ञा मैं उन्हें कर रहा हूँ” भी समझा जा सकता है।'
    reason: source_form_and_lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के वाचा-संबंधी व्यक्तिगत नाम को हिन्दी में प्रचलित रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: כִּי כֹה אָמַר
  choice: क्योंकि ... यों कहता है
  rationale: כִּי पूर्ववर्ती कथन का आधार प्रस्तुत करता है, और ‘यों कहता है’ भविष्यद्वक्ताओं के संदेशवाहक-सूत्र का स्वाभाविक तथा गरिमापूर्ण हिन्दी रूप है।
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: जैसे ... वैसे ही
  rationale: बीते न्याय और आने वाली भलाई के बीच इब्रानी की स्पष्ट तुलनात्मक संरचना सुरक्षित रखी गई है।
- source_word: הֵבֵאתִי אֶל הָעָם הַזֶּה
  choice: मैं इस प्रजा पर ... ले आया
  rationale: हिफ़ील क्रिया में परमेश्वर की सक्रिय भूमिका व्यक्त होती है; ‘पर ... ले आया’ हिन्दी में विपत्ति के आने का स्वाभाविक प्रयोग है।
- source_word: כָּל הָרָעָה הַגְּדוֹלָה הַזֹּאת
  choice: यह सारी बड़ी विपत्ति
  rationale: यहाँ רָעָה नैतिक बुराई नहीं, न्यायस्वरूप आई विनाशकारी विपदा को सूचित करता है; ‘विपत्ति’ अर्थ की गंभीरता और व्यापकता दोनों बनाए रखती है।
- source_word: מֵבִיא עֲלֵיהֶם
  choice: मैं उन पर ... ले आऊँगा
  rationale: वर्तमान कृदंत इस भविष्यसूचक संदर्भ में निश्चित भावी कार्य को व्यक्त करता है; हिन्दी का सामान्य भविष्यकाल इस आश्वासन को स्वाभाविक रूप से संप्रेषित करता है।
- source_word: כָּל הַטּוֹבָה
  choice: वह सारी भलाई
  rationale: טוֹבָה में कल्याण, आशीष और हितकारी दशा का व्यापक भाव है; ‘भलाई’ इस विस्तार को किसी एक प्रकार की समृद्धि तक सीमित नहीं करती।
- source_word: אֲשֶׁר אָנֹכִי דֹּבֵר עֲלֵיהֶם
  choice: जिसके विषय में मैं उनसे कह रहा हूँ
  rationale: דֹּבֵר का मूल अर्थ ‘कहना/बोलना’ रखा गया है। עֲלֵיהֶם को यहाँ संबोधित प्रजा के संदर्भ में ‘उनसे’ और विषयगत संबंध को ‘जिसके विषय में’ से व्यक्त किया गया है; ‘प्रतिज्ञा’ अर्थ संदर्भ में निहित है, पर मुख्य पाठ में जोड़ा नहीं गया।
theological_decisions:
- issue: परमेश्वर की क्रिया के संबंध में רָעָה का अर्थ
  choice: विपत्ति
  alternative: बुराई; महाविपदा
  rationale: पद अतीत के दंडात्मक न्याय की तुलना भावी भलाई से करता है। ‘विपत्ति’ न्यायजनित विनाश को व्यक्त करती है, बिना यह संकेत दिए कि परमेश्वर ने नैतिक बुराई की।
- issue: מֵבִיא कृदंत का कालगत बल
  choice: ले आऊँगा
  alternative: ला रहा हूँ; लाता हूँ
  rationale: रूप स्वयं कृदंत है और निश्चितता या आरंभशीलता की छाया रख सकता है, पर भविष्यसूचक प्रतिज्ञा के संदर्भ में हिन्दी भविष्यकाल सबसे स्वाभाविक है। पादटिप्पणी निकटतर रूप का संकेत देती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण भविष्यद्वक्तीय शैली। ‘प्रजा’, ‘विपत्ति’ और ‘भलाई’ जैसे व्यापक तथा सामान्यतः बोधगम्य शब्द रखे गए हैं। तुलना की ‘जैसे ... वैसे ही’ संरचना और परमेश्वर की प्रत्यक्ष वाणी सुरक्षित है।
