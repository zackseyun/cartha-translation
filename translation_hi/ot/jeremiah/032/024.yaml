  text: הִנֵּ֣ה הַ/סֹּלְל֗וֹת בָּ֣אוּ הָ/עִיר֮ לְ/לָכְדָ/הּ֒ וְ/הָ/עִ֣יר נִתְּנָ֗ה בְּ/יַ֤ד הַ/כַּשְׂדִּים֙ הַ/נִּלְחָמִ֣ים עָלֶ֔י/הָ מִ/פְּנֵ֛י הַ/חֶ֥רֶב וְ/הָ/רָעָ֖ב וְ/הַ/דָּ֑בֶר וַ/אֲשֶׁ֥ר דִּבַּ֛רְתָּ הָיָ֖ה וְ/הִנְּ/ךָ֥ רֹאֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/024.yaml
  text: Look[a], the siege ramps have come up against the city to capture it, and the city has been given into the hand of the Chaldeans who are fighting against it, because of the sword and the famine and the plague. What you spoke has happened, and look[c][b], you see it.
translation:
  language: hi
  text: देखिए, नगर को जीतने के लिए घेराबंदी के मिट्टी के रैंप[a] उसके पास आ पहुँचे हैं। नगर उन कसदियों[b] के हाथ में दे दिया गया है जो उसके विरुद्ध लड़ रहे हैं; तलवार, अकाल और महामारी[c] के कारण ऐसा हुआ है। जो कुछ आपने कहा था, वह हो गया है, और देखिए, आप इसे देख रहे हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “घेराबंदी के मोर्चे” अथवा “मिट्टी के टीले।” हिब्रू शब्द उन मिट्टी के ढाँचों के लिए है जिन्हें किसी नगर पर आक्रमण करने के लिए घेराबंदी के समय बनाया जाता था।
    reason: lexical_alternative
  - marker: b
    text: या “बेबीलोनियों।” हिब्रू में “कसदियों” है; यहाँ यह नाम नव-बेबीलोनी साम्राज्य के लोगों के लिए प्रयुक्त हुआ है।
    reason: lexical_alternative
  - marker: c
    text: या “घातक रोग।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה ... וְהִנְּךָ
  choice: देखिए ... और देखिए
  rationale: ध्यान खींचने वाले दोनों हिब्रू संकेतक शब्दों की जीवंतता और पुनरावृत्ति बनाए रखी गई है। परमेश्वर को संबोधन होने के कारण आदरसूचक रूप स्वाभाविक है।
- source_word: הַסֹּלְלוֹת
  choice: घेराबंदी के मिट्टी के चढ़ाव
  rationale: यह घेराबंदी में नगर की दीवारों तक चढ़ने या आक्रमण करने के लिए बनाए गए ऊँचे मिट्टी के ढाँचों को ठोस और समझने योग्य रूप में व्यक्त करता है।
- source_word: בָּאוּ הָעִיר לְלָכְדָהּ
  choice: नगर को जीतने के लिए ... उसके पास आ पहुँचे हैं
  rationale: हिब्रू में नगर तक पहुँचने और उसे अधिकार में लेने का प्रयोजन है; हिंदी वाक्य-क्रम में उद्देश्य पहले रखने से अर्थ स्पष्ट और स्वाभाविक रहता है।
- source_word: נִתְּנָה בְּיַד
  choice: के हाथ में दे दिया गया है
  rationale: हिब्रू के प्रचलित सत्ता-सूचक मुहावरे को हिंदी में समझने योग्य रहते हुए निकटता से सुरक्षित रखा गया है।
- source_word: הַכַּשְׂדִּים
  choice: कसदी
  rationale: मूल जातिनाम को मुख्य पाठ में रखा गया है; ऐतिहासिक संदर्भ में 'बेबीलोनी' विकल्प पादटिप्पणी में दिया गया है।
- source_word: מִפְּנֵי הַחֶרֶב וְהָרָעָב וְהַדָּבֶר
  choice: तलवार, अकाल और महामारी के कारण
  rationale: מִפְּנֵי यहाँ नगर के सौंपे जाने की परिस्थिति अथवा कारण बताता है। न्याय की पारंपरिक त्रयी को बिना व्याख्यात्मक विस्तार के सुरक्षित रखा गया है।
- source_word: וַאֲשֶׁר דִּבַּרְתָּ הָיָה
  choice: जो कुछ आपने कहा था, वह हो गया है
  rationale: यह परमेश्वर के पहले कहे वचन की वर्तमान पूर्ति को सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: וְהִנְּךָ רֹאֶה
  choice: और देखिए, आप स्वयं इसे देख रहे हैं
  rationale: प्रत्यक्ष अवलोकन पर हिब्रू के बल को 'स्वयं' से स्वाभाविक हिंदी में स्पष्ट किया गया है, बिना कोई अतिरिक्त धर्मवैज्ञानिक निष्कर्ष जोड़े।
theological_decisions:
- issue: परमेश्वर के कहे वचन की पूर्ति
  choice: जो कुछ आपने कहा था, वह हो गया है
  alternative: जो कुछ आपने कहा था, वह पूरा हुआ है
  rationale: '''हो गया है'' मूल के הָיָה के निकट है और घटना तथा पूर्वकथित वचन के संबंध को बनाए रखता है, पर ''पूरा'' जोड़कर पूर्ति की अवधारणा को अनावश्यक रूप से अधिक स्पष्ट नहीं करता।'
- issue: नगर के सौंपे जाने में दैवी कर्ता का अप्रकट रहना
  choice: नगर ... के हाथ में दे दिया गया है
  alternative: आपने नगर ... के हाथ में दे दिया है
  rationale: हिब्रू निष्क्रिय रूप में कर्ता व्यक्त नहीं करता। अनुवाद भी कर्ता को अप्रकट रखता है, ताकि निहित दैवी कार्य को पाठ से अधिक स्पष्ट करके धर्मवैज्ञानिक तनाव न सुलझाया जाए।
translation_notes:
  register: आधुनिक मानक हिंदी, आदरसूचक दैवी संबोधन और गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट शैली अपनाई गई है। 'नगर' और 'घेराबंदी' जैसे व्यापक रूप से समझे जाने वाले औपचारिक शब्द रखे गए हैं।
