  text: וַ/יָּבֹ֣א אֵ֠לַ/י חֲנַמְאֵ֨ל בֶּן דֹּדִ֜/י כִּ/דְבַ֣ר יְהוָה֮ אֶל חֲצַ֣ר הַ/מַּטָּרָה֒ וַ/יֹּ֣אמֶר אֵלַ֡/י קְנֵ֣ה נָ֠א אֶת שָׂדִ֨/י אֲשֶׁר בַּ/עֲנָת֜וֹת אֲשֶׁ֣ר בְּ/אֶ֣רֶץ בִּנְיָמִ֗ין כִּֽי לְ/ךָ֞ מִשְׁפַּ֧ט הַ/יְרֻשָּׁ֛ה וּ/לְ/ךָ֥ הַ/גְּאֻלָּ֖ה קְנֵה לָ֑/ךְ וָ/אֵדַ֕ע כִּ֥י דְבַר יְהוָ֖ה הֽוּא־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/008.yaml
  text: Then Hanamel the son of my uncle came to me in the court of the guard[a], according to the word of Yahweh, and he said to me, “Please buy my field that is at Anathoth, in the land of Benjamin, for the right of inheritance is yours and the redemption is yours. Buy it for yourself.” Then I knew that this was the word of Yahweh.
translation:
  language: hi
  text: तब याहवे के वचन के अनुसार मेरे चाचा का पुत्र हनमेल पहरेदारों के आँगन में मेरे पास आया और मुझसे कहा, “कृपया अनातोत में, बिन्यामीन के प्रदेश में स्थित मेरा खेत खरीद लो, क्योंकि विरासत का अधिकार तुम्हारा है और उसे छुड़ाने का अधिकार[a] भी तुम्हारा ही है। उसे अपने लिए खरीद लो।” तब मैं जान गया कि यह याहवे का वचन था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक स्पष्ट रूप में, “छुड़ाने का वैधानिक अधिकार तुम्हारा है।” इब्रानी में शाब्दिक रूप से, “छुड़ाना तुम्हारा है।” यह परिवार की संपत्ति को छुड़ाने के निकट संबंधी के कानूनी अधिकार या उत्तरदायित्व की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּדְבַר יְהוָה
  choice: यहोवा के वचन के अनुसार
  rationale: כְּ के साथ דָּבָר पहले कही गई बात के अनुरूप घटना घटने का भाव देता है; यह अनुवाद उस कथात्मक संबंध को बनाए रखता है।
- source_word: חֲצַר הַמַּטָּרָה
  choice: पहरेदारों का आँगन
  rationale: यह उस सुरक्षित आँगन को सूचित करता है जहाँ यिर्मयाह निगरानी में बंद था; ‘आँगन’ स्थान और ‘पहरेदारों’ निगरानी का भाव स्वाभाविक हिन्दी में देते हैं।
- source_word: קְנֵה נָא
  choice: कृपया … खरीद ले
  rationale: קנה भूमि के लेन-देन में ‘खरीदना’ है और נָא अनुरोध को नम्र बनाता है।
- source_word: שָׂדִי
  choice: मेरा खेत
  rationale: שָׂדֶה का सीधा और प्रसंगानुकूल अर्थ ‘खेत’ है।
- source_word: מִשְׁפַּט הַיְרֻשָּׁה
  choice: उसे विरासत में पाने का अधिकार
  rationale: מִשְׁפָּט यहाँ कानूनी अधिकार और יְרֻשָּׁה पैतृक संपत्ति अथवा उत्तराधिकार को दर्शाता है; क्रियात्मक हिन्दी अर्थ को स्पष्ट करती है।
- source_word: הַגְּאֻלָּה
  choice: उसे छुड़ाने का अधिकार
  rationale: यह निकट संबंधी द्वारा पारिवारिक भूमि वापस लेने के कानूनी अधिकार या दायित्व को दर्शाता है। केवल ‘छुटकारा’ कहने की अपेक्षा संपत्ति-संबंधी अर्थ यहाँ अधिक स्पष्ट है।
- source_word: קְנֵה לָךְ
  choice: उसे अपने लिए खरीद ले
  rationale: לָךְ हितार्थक भाव देता है; हिन्दी में व्यक्त कर्म जोड़ना स्वाभाविक और स्पष्ट है।
- source_word: וָאֵדַע כִּי דְבַר יְהוָה הוּא
  choice: तब मैं जान गया कि यह यहोवा का वचन था
  rationale: घटना से यिर्मयाह को पहले मिले दिव्य संदेश की पुष्टि हुई; ‘यह’ उसी घटना और संदेश की ओर संकेत करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित नामरूप ‘यहोवा’ से प्रस्तुत किया गया है, किसी उपाधि से नहीं।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत वाचा-नाम है। आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला ‘यहोवा’ नाम को उपाधि ‘प्रभु’ से बदलने के बजाय उसका नामरूप सुरक्षित रखता है।
- issue: הַגְּאֻלָּה में अधिकार और दायित्व का संबंध
  choice: छुड़ाने का अधिकार
  alternative: छुड़ाने का दायित्व
  rationale: प्रसंग में भूमि खरीदने का वैधानिक दावा प्रमुख है, पर इब्रानी गोएल-व्यवस्था में पारिवारिक उत्तरदायित्व का भाव भी निहित हो सकता है। मुख्य पाठ ‘अधिकार’ रखता है और इस कानूनी-पारिवारिक तनाव को किसी विशिष्ट सिद्धान्त से नहीं भरता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। प्रत्यक्ष कथन में संबंध और तत्कालता दिखाने के लिए ‘तेरा/ले’ रखा गया है। मूल की पुनरुक्ति और कानूनी भाषा को यथासंभव स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
