  yaml_path: translation/ot/jeremiah/032/022.yaml
  text: And you gave them this land[a], which you swore to their fathers to give them, a land flowing with milk and honey.
translation:
  language: hi
  text: और तूने उन्हें यह देश दिया, जिसे उनके पितरों[a] को देने की तूने शपथ खाई थी—दूध और मधु से बहने वाला देश।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनके पुरखाओं।” इब्रानी में शाब्दिक रूप से “उनके पिताओं” है; यहाँ संकेत इस्राएल के पितृ-पूर्वजों, अर्थात् कुलपिताओं, की ओर है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֵּן
  choice: और तूने ... दिया
  rationale: נתן का सामान्य अर्थ ‘देना’ है। यह चयन परमेश्वर को किए गए एकवचन प्रत्यक्ष संबोधन और इब्रानी के संयोजक क्रम, दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: הָאָרֶץ הַזֹּאת
  choice: यह देश
  rationale: वाचा और भूभाग के इस प्रसंग में אֶרֶץ प्रतिज्ञात भूभाग को दर्शाता है। आधुनिक हिन्दी में ‘यह देश’ स्वाभाविक और स्पष्ट है।
- source_word: אֲשֶׁר נִשְׁבַּעְתָּ
  choice: जिसे ... देने की तूने शपथ खाई थी
  rationale: נשבע साधारण प्रतिज्ञा नहीं, शपथ लेने का विशिष्ट शब्द है; इसलिए ‘शपथ खाई थी’ उसके वाचागत बल को सुरक्षित रखता है।
- source_word: לַאֲבוֹתָם
  choice: उनके पुरखाओं
  rationale: אָבוֹת का शाब्दिक अर्थ ‘पिता’ है और यहाँ इस्राएल के पहले पितरों की ओर संकेत है। ‘पुरखाओं’ आधुनिक पाठकों के लिए स्वाभाविक रहते हुए पुरुष पूर्वजों का भाव बनाए रखता है।
- source_word: לָתֵת לָהֶם
  choice: उन्हें ... देने
  rationale: यह रचना शपथ की विषय-वस्तु बताती है। ‘देने’ का प्रयोग मूल में נתן की पुनरावृत्ति को भी बनाए रखता है।
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: दूध और मधु की धाराएँ बहने वाला देश
  rationale: यह उपज और समृद्धि का प्रचलित इब्रानी मुहावरा है। ‘धाराएँ बहने वाला’ चित्रात्मक अतिशयोक्ति को स्वाभाविक हिन्दी में स्पष्ट करता है, बिना उसका अर्थ सपाट किए।
theological_decisions:
- issue: वाचा के सूत्र में पितृ-संबंधी भाषा
  choice: उनके पुरखाओं
  alternative: उनके पूर्वजों / उनके पितरों
  rationale: मूल में स्पष्टतः पुरुषवाची אָבוֹת है और संकेत इस्राएल के कुलपिताओं की ओर है। ‘पुरखाओं’ इस संदर्भ को बनाए रखता है; पादटिप्पणी शाब्दिक रूप और व्यापक हिन्दी विकल्प दोनों बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, प्रार्थनात्मक स्वर रखा गया है। परमेश्वर के लिए एकवचन ‘तू’ मूल के प्रत्यक्ष एकवचन संबोधन को दर्शाता है। ‘मधु’ ने बाइबिलीय काव्यात्मक गरिमा बनाए रखी है, जबकि वाक्य-रचना साधारण पाठकों के लिए सहज है।
