base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/037.yaml
  text: Behold[a], I am gathering them from all the lands where I drove them in my anger and in my wrath and in great indignation[b], and I will bring them back to this place and make them dwell in safety.
translation:
  language: hi
  text: देखो[a], मैं उन्हें उन सब देशों से इकट्ठा कर रहा हूँ, जहाँ मैंने अपने क्रोध, अपने प्रकोप और बड़े रोष[b] में उन्हें खदेड़ दिया था। मैं उन्हें इस स्थान पर वापस ले आऊँगा और सुरक्षित रूप से बसाऊँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “देखो, मैं उन्हें इकट्ठा करूँगा।” इब्रानी रचना निकट या निश्चित भविष्य की कार्रवाई भी व्यक्त कर सकती है।
    reason: lexical_alternative
  - marker: b
    text: “बड़ा रोष” ईश्वरीय क्रोध के लिए प्रयुक्त तीसरे इब्रानी शब्द का अनुवाद है; इस प्रकार मूल पाठ में न्याय-संबंधी शब्दों के संचय को बनाए रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: देखो
  rationale: यह भविष्यद्वाणी की घोषणा को बल और तात्कालिकता देता है। आधुनिक हिन्दी में ‘देखो’ स्वाभाविक और स्पष्ट है।
- source_word: מְקַבְּצָם
  choice: मैं उन्हें ... इकट्ठा कर रहा हूँ
  rationale: הִנְנִי के साथ कृदंत निकट या निश्चित भविष्य की कार्रवाई व्यक्त कर सकता है; वर्तमान-प्रगतिशील रूप मूल की पक्षगत अस्पष्टता को बनाए रखता है।
- source_word: מִכָּל הָאֲרָצוֹת
  choice: उन सब देशों से
  rationale: बहुवचन אֲרָצוֹת निर्वासन के विभिन्न देशों या भूभागों को सूचित करता है; ‘देशों’ सामान्य आधुनिक हिन्दी में सहज है।
- source_word: הִדַּחְתִּים
  choice: मैंने ... उन्हें खदेड़ दिया था
  rationale: यह क्रिया बलपूर्वक दूर किए जाने और परमेश्वर की सक्रिय भूमिका को व्यक्त करती है; ‘खदेड़ दिया’ इस कठोरता को स्पष्ट रखता है।
- source_word: בְּאַפִּי וּבַחֲמָתִי וּבְקֶצֶף גָּדוֹל
  choice: अपने क्रोध, अपने प्रकोप और बड़े रोष में
  rationale: तीन अलग लेकिन निकटार्थक शब्दों द्वारा न्याय की तीव्रता बढ़ाई गई है; हिन्दी में तीन पृथक शब्द रखकर उस संचयी प्रभाव को सुरक्षित रखा गया है।
- source_word: וַהֲשִׁבֹתִים
  choice: मैं उन्हें ... वापस ले आऊँगा
  rationale: שוב का हिफ़ील रूप स्थानिक वापसी कराने का अर्थ देता है; ‘वापस ले आऊँगा’ इस कारक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: इस स्थान पर
  rationale: मूल पाठ किसी विशिष्ट संदर्भित स्थान की ओर संकेत करता है; उसे सीधे ‘इस स्थान’ कहा गया है, बिना उसे व्याख्यात्मक रूप से यरूशलेम या यहूदा बनाने के।
- source_word: וְהֹשַׁבְתִּים לָבֶטַח
  choice: यहाँ निडर होकर बसाऊँगा
  rationale: ישׁב का हिफ़ील बसाने का कारक अर्थ रखता है और לָבֶטַח सुरक्षा तथा भयमुक्त निवास बताता है; यह वाक्यांश दोनों अर्थों को सहज हिन्दी में समेटता है।
theological_decisions:
- issue: ईश्वरीय अप्रसन्नता के तीन शब्दों का क्रम
  choice: क्रोध / प्रकोप / बड़ा रोष
  alternative: क्रोध / जलजलाहट / बड़ा कोप
  rationale: मूल इब्रानी जानबूझकर तीन निकटार्थक शब्द जोड़ता है। उन्हें एक ही हिन्दी शब्द में समेटने के बजाय अलग रखा गया है, पर उनके बीच कोई कृत्रिम धर्मवैज्ञानिक भेद नहीं बनाया गया।
- issue: הִנְנִי + कृदंत में प्रतिज्ञा का काल-पक्ष
  choice: देखो, मैं ... इकट्ठा कर रहा हूँ
  alternative: देखो, मैं ... इकट्ठा करूँगा
  rationale: यह रचना आरम्भ होती या निश्चित रूप से होने वाली कार्रवाई का बोध करा सकती है। वर्तमान-प्रगतिशील अनुवाद मूल रूप को दर्शाता है, जबकि पादटिप्पणी वैध भविष्यकालीन अर्थ को खुला रखती है।
- issue: לָבֶטַח में सुरक्षा का स्वरूप
  choice: निडर होकर
  alternative: सुरक्षित रूप से
  rationale: शब्द सुरक्षित और भयमुक्त निवास का बोध देता है। ‘निडर होकर’ प्रतिज्ञा के मानवीय अनुभव को स्वाभाविक हिन्दी में व्यक्त करता है, बिना सुरक्षा के साधन या राजनीतिक स्वरूप को निर्धारित किए।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, स्पष्ट और गरिमापूर्ण रखी गई है। ‘देखो’ भविष्यद्वाणी की उद्घोषणात्मक शक्ति देता है; ‘खदेड़ दिया’ निर्वासन की कठोरता और ‘निडर होकर बसाऊँगा’ पुनर्स्थापना तथा सुरक्षा को सामान्य पाठक के लिए सहज रूप में व्यक्त करते हैं।
