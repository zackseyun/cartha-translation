    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: और वे ... होंगे
  rationale: भविष्यसूचक प्रतिज्ञा के क्रम में यह रूप भविष्य का भाव देता है। ‘होंगे’ आधुनिक हिन्दी में היה के सरल अस्तित्व/संबंधसूचक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לִי לְעָם
  choice: मेरी प्रजा
  rationale: शाब्दिक रचना ‘मेरे लिए प्रजा’ है, पर वाचा-सूत्र में ל संबंध और पारस्परिक अपनापन व्यक्त करता है। हिन्दी में ‘मेरी प्रजा’ इसका स्वाभाविक और सटीक रूप है।
- source_word: וַאֲנִי
  choice: और मैं
  rationale: संयोजक दोनों पारस्परिक वाचा-वाक्यों को जोड़ता है; यहाँ विरोध का भाव नहीं है।
- source_word: אֶהְיֶה
  choice: होऊँगा
  rationale: היה का प्रथम पुरुष एकवचन अपूर्ण रूप भविष्य की वाचा-प्रतिबद्धता व्यक्त करता है और पहले खंड के ‘होंगे’ के साथ क्रियात्मक समानांतरता बनाए रखता है।
- source_word: לָהֶם לֵאלֹהִים
  choice: उनका परमेश्वर
  rationale: शाब्दिक रूप ‘उनके लिए परमेश्वर’ है। वाचा-सूत्र में इसका आशय संबंधपरक अधिकार और अपनापन है। ‘परमेश्वर’ हिन्दी बाइबलीय प्रयोग में אֱלֹהִים के लिए गरिमापूर्ण और सुबोध विकल्प है।
theological_decisions:
- issue: वाचा-सूत्र का अनुवाद
  choice: वे मेरी प्रजा होंगे, और मैं उनका परमेश्वर होऊँगा
  alternative: वे मेरे लिए एक प्रजा होंगे, और मैं उनके लिए परमेश्वर होऊँगा
  rationale: चुना गया रूप इब्रानी के पारस्परिक वाचा-संबंध को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि पाद-टिप्पणी मूल की अधिक शाब्दिक संरचना और उसमें निहित पारस्परिक संबंध को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सहज वाक्य। ‘प्रजा’ वाचा-संदर्भ में सामूहिक जन-समुदाय को दर्शाती है; ‘परमेश्वर’ सामान्य हिन्दी बाइबलीय पाठकों के लिए परिचित है।
