id: JER.32.43
reference: Jeremiah 32:43
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/נִקְנָ֥ה הַ/שָּׂדֶ֖ה בָּ/אָ֣רֶץ הַ/זֹּ֑את אֲשֶׁ֣ר אַתֶּ֣ם אֹמְרִ֗ים שְׁמָמָ֥ה הִיא֙ מֵ/אֵ֤ין אָדָם֙ וּ/בְהֵמָ֔ה נִתְּנָ֖ה בְּ/יַ֥ד הַ/כַּשְׂדִּֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/043.yaml
  text: Fields will be bought in this land of which you say[a], ‘It is a desolation, without man or beast[b]; it has been given into the hand of the Chaldeans.’
translation:
  language: hi
  text: इस देश में खेत खरीदे जाएँगे, जिसके विषय में तुम कहते हो, ‘यह उजाड़ पड़ा है; यहाँ न मनुष्य है, न पशु[a]। यह कसदियों[b] के हाथ में दे दिया गया है।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मनुष्य और पशु के बिना।”
    reason: lexical_alternative
  - marker: b
    text: अर्थात बाबुलियों। इब्रानी में “कसदियों।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִקְנָה
  choice: खरीदे जाएँगे
  rationale: कנה के निफ़अल रूप का निष्क्रिय, भविष्य-संदर्भित अर्थ है। ‘फिर से’ प्रसंग से संकेतित हो सकता है, पर इब्रानी में स्पष्ट रूप से नहीं है, इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
- source_word: הַשָּׂדֶה
  choice: खेत
  rationale: रूप की दृष्टि से यह निश्चित एकवचन है, पर यहाँ सामूहिक अर्थ में भूमि-संपत्तियों के लेन-देन को सूचित करता है; हिन्दी बहुवचन क्रिया के साथ ‘खेत’ यह अर्थ स्वाभाविक रूप से व्यक्त करता है।
- source_word: בָּאָרֶץ הַזֹּאת
  choice: इस देश में
  rationale: ‘देश’ यहाँ भौगोलिक भूमि-प्रदेश के अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אֲשֶׁר אַתֶּם אֹמְרִים
  choice: जिसके विषय में तुम कहते हो
  rationale: सम्बन्धवाचक उपवाक्य और लोगों के कथन को स्रोत के निकट रहते हुए स्पष्ट रूप से व्यक्त करता है।
- source_word: שְׁמָמָה
  choice: उजाड़ पड़ा है
  rationale: संज्ञात्मक ‘उजाड़’ को बनाए रखते हुए ‘पड़ा है’ हिन्दी में उस भूमि की वर्तमान विनष्ट दशा को स्वाभाविक बनाता है।
- source_word: מֵאֵין אָדָם וּבְהֵמָה
  choice: यहाँ न मनुष्य है, न पशु
  rationale: इब्रानी के प्रचलित अभाव-सूचक युग्म का अर्थ साफ़ और स्वाभाविक हिन्दी में रखा गया है; אָדָם यहाँ सामान्य रूप से मानव का बोध कराता है।
- source_word: נִתְּנָה
  choice: दे दिया गया है
  rationale: निष्क्रिय पूर्ण रूप ऐसी घटना बताता है जिसका परिणाम वर्तमान स्थिति में बना हुआ है।
- source_word: בְּיַד
  choice: के हाथ में
  rationale: सत्ता अथवा नियंत्रण में सौंपे जाने का इब्रानी मुहावरा हिन्दी में भी पारदर्शी और प्रचलित है।
- source_word: הַכַּשְׂדִּים
  choice: कसदियों
  rationale: ऐतिहासिक-जातीय नाम को स्रोत के अनुसार रखा गया है; ‘बाबुलियों’ अर्थ-स्पष्ट करने वाला वैकल्पिक नाम है।
theological_decisions:
- issue: अभाव-सूचक सूत्र में אָדָם का अर्थ
  choice: मनुष्य
  alternative: लोग / मानव
  rationale: यहाँ शब्द किसी पुरुष-विशेष के बजाय सामान्य मानव उपस्थिति को दर्शाता है। ‘मनुष्य’ हिन्दी में स्रोत-सन्निकट और सर्वमानवीय दोनों है।
- issue: पुनर्स्थापना के भाव के लिए ‘फिर से’ जोड़ना
  choice: ‘फिर से’ न जोड़ना
  alternative: खेत फिर से खरीदे जाएँगे
  rationale: आसपास का प्रसंग लेन-देन की बहाली दर्शाता है, पर इस पद के इब्रानी शब्दों में ‘फिर से’ स्पष्ट नहीं है; अतः निहित भाव को मुख्य पाठ में अनकहा रहने दिया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘कसदी’ जैसे ऐतिहासिक नाम को बनाए रखते हुए पादटिप्पणी में उसका अधिक परिचित पर्याय दिया गया है।
