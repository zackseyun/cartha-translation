  edition: WLC
  text: וְ/כָרַתִּ֤י לָ/הֶם֙ בְּרִ֣ית עוֹלָ֔ם אֲשֶׁ֤ר לֹֽא אָשׁוּב֙ מֵ/אַ֣חֲרֵי/הֶ֔ם לְ/הֵיטִיבִ֖/י אוֹתָ֑/ם וְ/אֶת יִרְאָתִ/י֙ אֶתֵּ֣ן בִּ/לְבָבָ֔/ם לְ/בִלְתִּ֖י ס֥וּר מֵ/עָלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/040.yaml
  text: I will make with them an everlasting covenant[a], that I will not turn away from them, to do them good. And I will put the fear of me in their hearts[b], so that they will not turn away from me.
translation:
  language: hi
  text: मैं उनके साथ एक सदा की वाचा[a] बाँधूँगा कि मैं उनसे मुँह न मोड़ूँगा और उनका भला करूँगा। और मैं उनके हृदयों में अपने प्रति भय डालूँगा[b], ताकि वे मुझसे दूर न जाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अनन्त वाचा’ अथवा ‘चिरस्थायी वाचा’।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में ‘मेरा भय’; अर्थात मेरे प्रति भय।
    reason: lexical_alternative
lexical_decisions:
- source_word: כָרַתִּי
  choice: वाचा बाँधूँगा
  rationale: इब्रानी मुहावरा शाब्दिक रूप से ‘वाचा काटना’ है; हिन्दी में ‘वाचा बाँधना’ स्वाभाविक, गरिमापूर्ण और निकट अर्थ वाला मुहावरा है।
- source_word: בְּרִית עוֹלָם
  choice: सदा की वाचा
  rationale: यह वाचा की स्थायी और निरंतर अवधि को सरल आधुनिक हिन्दी में व्यक्त करता है, बिना बाद की धर्मवैज्ञानिक व्यवस्था आरोपित किए।
- source_word: אֲשֶׁר לֹא אָשׁוּב מֵאַחֲרֵיהֶם לְהֵיטִיבִי אוֹתָם
  choice: कि मैं उनका भला करना कभी न छोड़ूँगा
  rationale: शाब्दिक संरचना ‘मैं उनके पीछे से न फिरूँगा, उनका भला करने के लिए’ का आशय है कि परमेश्वर उनसे पीछे नहीं हटेगा और उनका भला करता रहेगा। हिन्दी में यह संयुक्त रूप आशय को स्पष्ट और सहज रखता है।
- source_word: יִרְאָתִי
  choice: अपना भय
  rationale: प्रथम पुरुष प्रत्यय सहित संज्ञा का निकट रूप ‘मेरा/अपना भय’ है; सन्दर्भ में इसका अर्थ परमेश्वर की ओर लक्षित भय है। पादटिप्पणी इस सम्बन्ध को स्पष्ट करती है।
- source_word: בִּלְבָבָם
  choice: उनके हृदयों में
  rationale: ‘हृदय’ यहाँ इच्छा, विचार और भीतरी प्रवृत्ति के केन्द्र को दर्शाता है; प्रचलित हिन्दी रूप मूल बिंब को बनाए रखता है।
- source_word: לְבִלְתִּי סוּר מֵעָלָי
  choice: ताकि वे मुझसे दूर न जाएँ
  rationale: यह उद्देश्य अथवा अपेक्षित परिणाम को व्यक्त करता है। ‘दूर न जाएँ’ हिन्दी में सम्बन्ध-विच्छेद या परमेश्वर से हटने का भाव स्वाभाविक रूप से देता है।
theological_decisions:
- issue: वाचा की अवधि
  choice: सदा की वाचा
  alternative: अनन्त वाचा; चिरस्थायी वाचा
  rationale: ‘सदा की’ עוֹלָם की दीर्घस्थायी अथवा निरंतर शक्ति को बनाए रखता है और किसी विशिष्ट धर्मवैज्ञानिक काल-व्यवस्था का निर्णय नहीं करता।
- issue: परमेश्वर के भय का अर्थ
  choice: अपना भय उनके हृदयों में डालूँगा
  alternative: अपने प्रति भय; मेरा भय
  rationale: मूल का ‘मेरा भय’ परमेश्वर द्वारा अनुभव किए जाने वाले भय नहीं, बल्कि उसकी ओर लक्षित श्रद्धामय भय को बताता है। मुख्य पाठ मूल अभिव्यक्ति के निकट रहता है और पादटिप्पणी सम्भावित अस्पष्टता दूर करती है।
- issue: ईश्वरीय और मानवीय निष्ठा का सम्बन्ध
  choice: परमेश्वर उनका भला करना नहीं छोड़ेगा और उनके भीतर अपना भय देगा, ताकि वे दूर न जाएँ
  alternative: इसे किसी विशिष्ट मत के अनुसार अपरिवर्तनीय उद्धार की प्रतिज्ञा के रूप में स्पष्ट करना
  rationale: पद ईश्वरीय पहल और लोगों की निरंतर निष्ठा दोनों को साथ रखता है; अनुवाद इस तनाव को बनाए रखता है और किसी साम्प्रदायिक व्याख्या को नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण बाइबिलीय शैली। ‘वाचा बाँधना’ हिन्दी का स्वाभाविक covenant idiom है। ‘उनका भला करना कभी न छोड़ूँगा’ मूल खंड के आशय को सहज रूप में व्यक्त करता है, जबकि पादटिप्पणियाँ अवधि और ‘भय’ की इब्रानी अभिव्यक्ति को सुरक्षित रखती हैं।
