base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/009.yaml
  text: 'So I bought the field from Hanamel the son of my uncle[a], who was at Anathoth[b], and I weighed out the silver to him: seventeen shekels of silver.'
translation:
  language: hi
  text: तब मैंने अपने चाचा के बेटे हनमेल से वह खेत खरीदा, जो अनातोत में था,[a] और मैंने उसे चाँदी तौलकर दी—चाँदी के सत्रह शेकेल।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अनातोत में स्थित वह खेत।” इब्रानी संबंधवाचक वाक्यांश हनमेल अथवा खेत के स्थान को सूचित कर सकता है।
    reason: alternative_reading
  - marker: b
    text: इब्रानी में शाब्दिक क्रम है, “सात शेकेल और दस चाँदी”; सामान्यतः इसका अर्थ “चाँदी के सत्रह शेकेल” समझा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקְנֶה
  choice: तब मैंने ... खरीदा
  rationale: קנה का क़ाल रूप बीती हुई क्रमिक घटना बताता है। ‘तब’ इब्रानी वाव-क्रम की कथात्मक निरंतरता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַשָּׂדֶה
  choice: वह खेत
  rationale: שָׂדֶה यहाँ खरीदी गई कृषि-भूमि या भूखंड है; सामान्य पाठक के लिए ‘खेत’ स्वाभाविक और सटीक है।
- source_word: מֵאֵת חֲנַמְאֵל
  choice: हनमेल से
  rationale: מֵאֵת लेन-देन में विक्रेता या स्रोत को सूचित करता है; ‘से’ इसका सहज हिन्दी रूप है।
- source_word: בֶּן דֹּדִי
  choice: अपने चाचा के बेटे
  rationale: मूल पाठ के स्पष्ट संबंधसूचक शब्द ‘मेरे चाचा का बेटा’ को ‘चचेरा भाई’ में समेटने के बजाय संरक्षित किया गया है। हिन्दी वाक्य में कर्ता के अनुरूप ‘अपने’ रखा गया है।
- source_word: אֲשֶׁר בַּעֲנָתוֹת
  choice: जो अनातोत में था
  rationale: संबंधवाचक אֲשֶׁר व्याकरणतः हनमेल अथवा खेत की ओर लौट सकता है। मुख्य पाठ में निकटतम पुरुषवाचक पूर्वपद हनमेल के अनुसार अनुवाद है, और वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है।
- source_word: וָאֶשְׁקֲלָה לוֹ אֶת הַכֶּסֶף
  choice: उसके लिए चाँदी तौलकर उसे दी
  rationale: שקל प्राचीन व्यापार में भुगतान की चाँदी तौलने की ठोस क्रिया है। ‘तौलकर ... दी’ इसे केवल ‘दाम चुकाए’ कहने की अपेक्षा स्पष्ट रूप से बचाता है।
- source_word: שִׁבְעָה שְׁקָלִים וַעֲשָׂרָה הַכָּסֶף
  choice: चाँदी के सत्रह शेकेल
  rationale: शाब्दिक क्रम ‘सात शेकेल और दस’ का स्वाभाविक संख्यात्मक अर्थ सत्रह है। ‘शेकेल’ प्राचीन भार-मुद्रा शब्द को सुरक्षित रखता है और כֶּסֶף को ‘चाँदी’ कहा गया है।
theological_decisions:
- issue: אֲשֶׁר בַּעֲנָתוֹת में संबंधवाचक उपवाक्य किसे विशेषित करता है
  choice: 'मुख्य पाठ में हनमेल: ‘जो अनातोत में था’'
  alternative: ‘अनातोत में स्थित वह खेत’
  rationale: इब्रानी में रूपात्मक रूप से अस्पष्टता बनी हुई है। निकटतम पूर्वपद हनमेल है, पर प्रसंग खेत के स्थान का भी समर्थन करता है; इसलिए विकल्प पादटिप्पणी में दिया गया है, बिना किसी व्याख्यात्मक निष्कर्ष को अनिवार्य बनाए।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण कथात्मक शैली। ‘हनमेल’, ‘अनातोत’ और ‘शेकेल’ जैसे ऐतिहासिक नाम एवं माप लिप्यंतरित रखे गए हैं। मुख्य पाठ में मूल की ठोस व्यापारिक क्रिया और संबंधसूचक भाषा संरक्षित है; वास्तविक व्याकरणिक अस्पष्टता पादटिप्पणी में दी गई है।
