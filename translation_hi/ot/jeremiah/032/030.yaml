id: JER.32.30
reference: Jeremiah 32:30
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּֽי הָי֨וּ בְנֵֽי יִשְׂרָאֵ֜ל וּ/בְנֵ֣י יְהוּדָ֗ה אַ֣ךְ עֹשִׂ֥ים הָ/רַ֛ע בְּ/עֵינַ֖/י מִ/נְּעֻרֹֽתֵי/הֶ֑ם כִּ֣י בְנֵֽי יִשְׂרָאֵ֗ל אַ֣ךְ מַכְעִסִ֥ים אֹתִ֛/י בְּ/מַעֲשֵׂ֥ה יְדֵי/הֶ֖ם נְאֻם יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/030.yaml
  text: For the sons of Israel and the sons of Judah have done only what was evil in my eyes from their youth[a], for the sons of Israel have only provoked me by the work of their hands[b], declares Yahweh.
translation:
  language: hi
  text: क्योंकि इस्राएल की सन्तान और यहूदा की सन्तान अपनी जवानी से केवल वही करती रही हैं जो मेरी दृष्टि में बुरा है; क्योंकि इस्राएल की सन्तान अपने हाथों के कामों से मुझे क्रोध ही दिलाती रही है[a]—याहवे की यह घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अपने हाथों के कामों से’ का संकेत विशेष रूप से उनके द्वारा बनाई हुई मूर्तियों की ओर भी हो सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएल की सन्तान
  rationale: शाब्दिक सामूहिक पदनाम को बनाए रखता है और यहूदा की सन्तान के साथ समानान्तरता सुरक्षित करता है।
- source_word: וּבְנֵי יְהוּדָה
  choice: और यहूदा की सन्तान
  rationale: उत्तरी और दक्षिणी समुदायों का भेद तथा मूल की समानान्तर संरचना बनाए रखता है।
- source_word: אַךְ
  choice: वही / ही
  rationale: दोनों खंडों में निरन्तर बुराई और उकसावे की विशिष्टता तथा तीव्रता स्वाभाविक हिन्दी में व्यक्त होती है।
- source_word: עֹשִׂים הָרַע בְּעֵינַי
  choice: वही करती आई हैं जो मेरी दृष्टि में बुरा है
  rationale: निरन्तर आचरण व्यक्त करने वाले कृदन्त का भाव और परमेश्वर के नैतिक निर्णय का दृष्टि-संबंधी इब्रानी मुहावरा दोनों सुरक्षित हैं।
- source_word: מִנְּעֻרֹתֵיהֶם
  choice: अपनी जवानी से
  rationale: राष्ट्रों के आरम्भिक काल से चले आ रहे आचरण का संकेत देने वाला निकट और स्वाभाविक अनुवाद।
- source_word: מַכְעִסִים אֹתִי
  choice: मुझे क्रोधित ही करती आई है
  rationale: हिफ़ील रूप में परमेश्वर को क्रोध दिलाने वाले लगातार उकसावे का फल और आवृत्ति दोनों व्यक्त होते हैं।
- source_word: בְּמַעֲשֵׂה יְדֵיהֶם
  choice: अपने हाथों के कामों से
  rationale: मूल मुहावरे की व्यापकता बनाए रखता है; यह सामान्य कर्मों के साथ उनके बनाए हुए देवमूर्ति-सदृश पदार्थों की ओर भी संकेत कर सकता है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: भविष्यद्वाणी के गंभीर घोषणात्मक सूत्र और दिव्य नाम दोनों को स्पष्ट, प्रतिष्ठित हिन्दी में प्रस्तुत करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिगत दिव्य नाम का लिप्यंतरण है, किसी उपाधि से उसका प्रतिस्थापन नहीं।
theological_decisions:
- issue: दूसरे खंड में בְנֵי יִשְׂרָאֵל का दायरा
  choice: दूसरी बार भी ‘इस्राएल की सन्तान’ रखा गया है।
  alternative: इसे ‘वे’ अथवा ‘इस्राएल और यहूदा’ बनाना।
  rationale: इब्रानी पाठ विशिष्ट पदनाम दोहराता है। उसे बनाए रखने से सम्भावित प्रतिनिधिक प्रयोग या अर्थगत संकुचन को अनावश्यक रूप से सुलझाया नहीं जाता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिन्दी। ‘सन्तान’ को सामूहिक एकवचन मानकर स्त्रीलिंग क्रिया रखी गई है। ‘अपनी जवानी से’ राष्ट्रीय आरम्भ का रूपक सुरक्षित रखता है; इसके लिए अलग टिप्पणी आवश्यक नहीं समझी गई।
