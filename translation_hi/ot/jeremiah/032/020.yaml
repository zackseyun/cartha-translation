source:
  edition: WLC
  text: אֲשֶׁר שַׂ֠מְתָּ אֹת֨וֹת וּ/מֹפְתִ֤ים בְּ/אֶֽרֶץ מִצְרַ֨יִם֙ עַד הַ/יּ֣וֹם הַ/זֶּ֔ה וּ/בְ/יִשְׂרָאֵ֖ל וּ/בָֽ/אָדָ֑ם וַ/תַּעֲשֶׂה לְּ/ךָ֥ שֵׁ֖ם כַּ/יּ֥וֹם הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/020.yaml
  text: who set signs and wonders in the land of Egypt[a], and in Israel and among mankind to this day, and made a name for yourself, as it is this day.
translation:
  language: hi
  text: तूने मिस्र देश में चिन्ह और अद्भुत काम किए हैं, और आज तक इस्राएल में तथा समस्त मानवजाति में भी किए हैं; और तूने अपने लिए ऐसा नाम कमाया है, जैसा आज है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׂמְתָּ
  choice: किए
  rationale: שׂוּם का मूल अर्थ ‘रखना/स्थापित करना’ है, पर चिन्हों और अद्भुत कामों के साथ हिन्दी में ‘किए’ स्वाभाविक रूप से उनके घटित किए जाने को व्यक्त करता है; ‘स्थापित किए’ यहाँ असहज होता।
- source_word: אֹתוֹת וּמֹפְתִים
  choice: चिन्ह और अद्भुत काम
  rationale: ‘चिन्ह’ אוֹת के संकेतात्मक पक्ष को बनाए रखता है, और ‘अद्भुत काम’ מוֹפֵת के विस्मयकारी कार्यों को बिना उसे केवल ‘चमत्कार’ तक सीमित किए व्यक्त करता है।
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: मिस्र देश में
  rationale: אֶרֶץ को बनाए रखते हुए आधुनिक हिन्दी में भौगोलिक अभिव्यक्ति स्वाभाविक रखी गई है।
- source_word: עַד הַיּוֹם הַזֶּה
  choice: आज तक
  rationale: यह हिब्रू कालवाचक मुहावरे का संक्षिप्त और स्वाभाविक हिन्दी समतुल्य है।
- source_word: וּבְיִשְׂרָאֵל וּבָאָדָם
  choice: इस्राएल में और मनुष्यों के बीच भी
  rationale: ב के स्थानगत/संबंधगत भाव को क्रमशः ‘में’ और ‘के बीच’ से व्यक्त किया गया है। אָדָם यहाँ सामूहिक रूप से समस्त मनुष्यों को दर्शाता है।
- source_word: וַתַּעֲשֶׂה לְּךָ שֵׁם
  choice: तूने अपने लिए ऐसा नाम कमाया
  rationale: हिब्रू मुहावरा प्रतिष्ठा या यश अर्जित करने का अर्थ देता है। ‘नाम कमाया’ आधुनिक हिन्दी में स्वाभाविक है और לְךָ की आत्म-संबंधी शक्ति को ‘अपने लिए’ से बनाए रखता है।
- source_word: כַּיּוֹם הַזֶּה
  choice: जैसा आज है
  rationale: वर्तमान में प्रत्यक्ष प्रतिष्ठा की स्थिति को निकट और सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: אָדָם का सामूहिक अर्थ
  choice: मनुष्यों के बीच
  alternative: मानवजाति में
  rationale: यहाँ אָדָם किसी एक पुरुष का नहीं, सामूहिक मानव-समुदाय का बोध कराता है। ‘मनुष्यों के बीच’ अर्थ को स्पष्ट रखते हुए सामान्य हिन्दी में अधिक स्वाभाविक है।
- issue: עַד הַיּוֹם הַזֶּה का वाक्यगत संबंध
  choice: चिन्हों और अद्भुत कामों की आज तक जारी प्रकटता से जोड़ा
  alternative: केवल मिस्र देश से जोड़ना, अथवा इस्राएल और मनुष्यों के बीच तक विस्तार मानना
  rationale: हिब्रू शब्दक्रम में कालवाचक पद मिस्र के तुरंत बाद है, पर आगे इस्राएल और मानव-समुदाय का उल्लेख उसके व्यापक प्रभाव/प्रकटता की सम्भावना रखता है। हिन्दी पाठ अर्थपूर्ण प्रवाह देता है, जबकि पादटिप्पणी वास्तविक वाक्यगत अस्पष्टता सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; परमेश्वर के लिए एकवचन आत्मीय ‘तू’ प्रार्थना के निकट संबोधन और आसपास के हिब्रू द्वितीय पुरुष एकवचन के अनुरूप है। भाषा गरिमापूर्ण पर सामान्य पाठक के लिए सहज रखी गई है।
