source:
  edition: WLC
  text: עֹ֤שֶׂה חֶ֨סֶד֙ לַֽ/אֲלָפִ֔ים וּ/מְשַׁלֵּם֙ עֲוֺ֣ן אָב֔וֹת אֶל חֵ֥יק בְּנֵי/הֶ֖ם אַחֲרֵי/הֶ֑ם הָ/אֵ֤ל הַ/גָּדוֹל֙ הַ/גִּבּ֔וֹר יְהוָ֥ה צְבָא֖וֹת שְׁמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/018.yaml
  text: showing steadfast love to thousands[a], and repaying the iniquity of fathers into the lap of their children after them—the great, mighty God, Yahweh of Armies[b], is his name.
translation:
  language: hi
  text: जो हज़ारों के प्रति अटल प्रेम दिखाता है[a] और पिताओं के अधर्म का प्रतिफल उनके बाद उनकी संतानों की गोद में डालता है—वह महान और पराक्रमी परमेश्वर है; उसका नाम सेनाओं का यहोवा है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हज़ारों पीढ़ियों के प्रति”; समान वाचा-संबंधी भाषा के प्रकाश में यह अर्थ सम्भव है, पर यहाँ इब्रानी पाठ में केवल “हज़ारों” है।
    reason: lexical_alternative
  - marker: b
    text: या, “सेनाओं का प्रभु।”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֶׂה חֶסֶד
  choice: अटल प्रेम करता है
  rationale: कृदन्त परमेश्वर के निरंतर स्वभाव और कार्य का वर्णन करता है। ‘अटल प्रेम’ חֶסֶד में निहित करुणा और निष्ठा, दोनों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: לַאֲלָפִים
  choice: हज़ारों पर
  rationale: इब्रानी पाठ में केवल ‘हज़ारों’ है; ‘पीढ़ियाँ’ स्पष्ट रूप से नहीं है। इसलिए मुख्य पाठ उसकी संक्षिप्तता और संभावित अस्पष्टता बनाए रखता है।
- source_word: וּמְשַׁלֵּם עֲוֺן
  choice: अधर्म का बदला ... डालता है
  rationale: שׁלם का यहाँ अर्थ प्रतिफल या बदला चुकाना है, जबकि עָוֹן अधर्म, दोष या उसके दण्ड-परिणाम को सूचित कर सकता है। अनुवाद इस नैतिक और दण्डात्मक घनत्व को पूरी तरह एक अर्थ में सीमित नहीं करता।
- source_word: אָבוֹת
  choice: पिताओं
  rationale: इब्रानी शब्द पुरुषवाचक बहुवचन है; अतः उसे सामान्यीकृत करके ‘माता-पिता’ या केवल ‘पूर्वज’ नहीं किया गया।
- source_word: אֶל חֵיק
  choice: गोद में डालता है
  rationale: मूल रूपक किसी प्रतिफल को सीधे व्यक्ति की गोद में रखने का है। हिन्दी में ‘गोद में डालना’ इस सजीव बिंब को बनाए रखता है।
- source_word: בְּנֵיהֶם אַחֲרֵיהֶם
  choice: उनके बाद उनकी संतानों
  rationale: בנים प्रसंग में पुत्रों, बच्चों या वंशजों को सूचित कर सकता है। ‘संतानें’ पीढ़ीगत आशय को स्वाभाविक हिन्दी में व्यक्त करती हैं और ‘उनके बाद’ कालगत उत्तराधिकार को बनाए रखता है।
- source_word: הָאֵל הַגָּדוֹל הַגִּבּוֹר
  choice: महान और पराक्रमी परमेश्वर
  rationale: यह पदवीगत वर्णन है। ‘महान और पराक्रमी’ मूल की ऊँची, स्तुतिपरक शैली तथा शक्ति का भाव बनाए रखता है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का यहोवा
  rationale: ‘यहोवा’ व्यक्तिगत दिव्य नाम का प्रचलित हिन्दी लिप्यंतरण है; ‘सेनाओं का’ צְבָאוֹת की सार्वभौम और सैन्य-शक्ति संबंधी उपाधि को ‘गणों’ जैसे अपेक्षाकृत अपारदर्शी विकल्प से अधिक स्पष्ट करता है।
theological_decisions:
- issue: पीढ़ियों के बीच अधर्म के प्रतिफल की भाषा
  choice: पिताओं के अधर्म का बदला उनकी बाद की संतानों की गोद में डाले जाने का कथन यथावत रखा गया है।
  alternative: इसे केवल सामाजिक परिणाम मानना, अथवा निर्दोष संतानों को सीधे दण्ड देने की व्यवस्थित व्याख्या जोड़ना।
  rationale: पद स्वयं प्रतिफल के वास्तविक पीढ़ीगत आयाम को व्यक्त करता है। अनुवाद इसे नरम नहीं करता और न ही व्यक्तिगत उत्तरदायित्व पर बल देने वाले अन्य बाइबलीय अंशों के साथ इसके तनाव को चुपचाप सुलझाता है।
- issue: צְבָאוֹת की दिव्य उपाधि
  choice: सेनाओं का यहोवा
  alternative: सेनाओं का प्रभु; गणों का यहोवा
  rationale: यह चयन मूल दिव्य नाम और צְבָאוֹת की सामर्थ्यपूर्ण, सार्वभौम उपाधि दोनों को स्पष्ट आधुनिक हिन्दी में सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी की गरिमापूर्ण, सामान्य-पाठक-सुलभ शैली अपनाई गई है। ‘गोद में डालता है’ मूल रूपक को बचाता है; ‘अटल प्रेम’ वाचागत निष्ठा और करुणा दोनों को संप्रेषित करता है।
