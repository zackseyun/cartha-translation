  text: וְ/אַתָּ֞ה אָמַ֤רְתָּ אֵלַ/י֙ אֲדֹנָ֣/י יְהוִ֔ה קְנֵֽה לְ/ךָ֧ הַ/שָּׂדֶ֛ה בַּ/כֶּ֖סֶף וְ/הָעֵ֣ד עֵדִ֑ים וְ/הָ/עִ֥יר נִתְּנָ֖ה בְּ/יַ֥ד הַ/כַּשְׂדִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/025.yaml
  text: Yet you yourself said to me[a], Lord Yahweh[b], ‘Buy the field for yourself with silver and call witnesses,’ though the city has been given into the hand of the Chaldeans.
translation:
  language: hi
  text: फिर भी, हे प्रभु यहवे,[a] तूने मुझसे कहा, ‘अपने लिए वह खेत चाँदी देकर खरीद ले और गवाहों को बुला,’ जबकि यह नगर कसदियों के हाथ में दे दिया गया है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘यहवे’ परमेश्वर का व्यक्तिगत नाम है, जिसे इब्रानी में יהוה लिखा गया है।
    reason: divine_name_note
  - marker: b
    text: या, “और यह नगर कसदियों के हाथ में दे दिया गया है।” इब्रानी संयोजक का सीधा अर्थ “और” भी हो सकता है; “जबकि” यहाँ यिर्मयाह की बात में निहित विरोध को स्पष्ट करता है। कसदी बाबुली सत्ता से संबद्ध लोग थे।
    reason: alternative_reading_and_cultural_note
lexical_decisions:
- source_word: וְאַתָּה
  choice: फिर भी ... तूने
  rationale: स्वतंत्र सर्वनाम אַתָּה कर्ता पर बल देता है और प्रसंग में विरोधाभास उभारता है; हिंदी में ‘फिर भी’ तथा स्पष्ट ‘तूने’ इसे स्वाभाविक रूप से व्यक्त करते हैं।
- source_word: אֲדֹנָי יְהוִה
  choice: हे प्रभु यहवे
  rationale: אֲדֹנָי को ‘प्रभु’ और परमेश्वर के व्यक्तिगत नाम יהוה को ‘यहवे’ रखकर संयुक्त संबोधन की दोनों इकाइयाँ सुरक्षित रहती हैं।
- source_word: קְנֵה לְךָ הַשָּׂדֶה בַּכֶּסֶף
  choice: अपने लिए वह खेत चाँदी देकर खरीद ले
  rationale: ‘अपने लिए’ לְךָ को, ‘वह खेत’ निश्चित पद को, और ‘चाँदी देकर’ כֶּסֶף के ठोस तथा लेन-देन संबंधी अर्थ को व्यक्त करता है।
- source_word: וְהָעֵד עֵדִים
  choice: और गवाह बुला
  rationale: הָעֵד का हिफ़ईल आदेश कानूनी लेन-देन के लिए गवाह उपस्थित कराने का भाव देता है; ‘गवाह बुला’ सहज आधुनिक हिंदी है।
- source_word: וְהָעִיר נִתְּנָה
  choice: जबकि यह नगर ... दे दिया गया है
  rationale: संयोजक וְ को प्रसंगानुसार ‘जबकि’ रखा गया है, जिससे आज्ञा और नगर की वर्तमान दशा के बीच तनाव उभरता है; पूर्ण क्रिया का वर्तमान परिणाम भी बना रहता है।
- source_word: בְּיַד הַכַּשְׂדִּים
  choice: कसदियों के हाथ में
  rationale: ‘हाथ में’ इब्रानी सत्ता/नियंत्रण के मुहावरे और बाइबलीय शैली को बनाए रखता है; כַּשְׂדִּים का सीधा जातीय-राजनीतिक नाम ‘कसदी’ है।
theological_decisions:
- issue: संयुक्त उपाधि אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु यहवे
  alternative: प्रभु परमेश्वर / प्रभु यहोवा
  rationale: ‘यहवे’ चतुराक्षरीय व्यक्तिगत नाम को केवल पदवी में बदलने के बजाय नाम के रूप में रखता है, जबकि ‘प्रभु’ אֲדֹנָי को अलग से व्यक्त करता है।
- issue: अंतिम וְ का संबंध
  choice: जबकि
  alternative: और / यद्यपि
  rationale: इब्रानी संयोजक सामान्य ‘और’ भी हो सकता है, पर यिर्मयाह की शिकायत में खेत खरीदने की आज्ञा और नगर के सौंपे जाने के बीच विरोधी परिस्थिति निहित है। पाठ में ‘जबकि’ रखा और अधिक शाब्दिक संभावना पादटिप्पणी में सुरक्षित की गई है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिंदी। प्रार्थना में परमेश्वर को संबोधित करने के लिए एकवचन ‘तू’ रखा गया है, जो यहाँ निकटता और पारंपरिक धार्मिक गरिमा व्यक्त करता है, अनादर नहीं। ‘चाँदी देकर’ और ‘हाथ में’ मूल की ठोस बिंबात्मक भाषा बनाए रखते हैं।
