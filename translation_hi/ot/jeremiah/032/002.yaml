id: JER.32.2
reference: Jeremiah 32:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אָ֗ז חֵ֚יל מֶ֣לֶךְ בָּבֶ֔ל צָרִ֖ים עַל יְרוּשָׁלִָ֑ם וְ/יִרְמְיָ֣הוּ הַ/נָּבִ֗יא הָיָ֤ה כָלוּא֙ בַּ/חֲצַ֣ר הַ/מַּטָּרָ֔ה אֲשֶׁ֖ר בֵּֽית מֶ֥לֶךְ יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/002.yaml
  text: At that time the army of the king of Babylon was besieging Jerusalem[a], and Jeremiah the prophet was confined in the court of the guard[b], which was in the house of the king of Judah.
translation:
  language: hi
  text: उस समय बाबेल के राजा की सेना ने यरूशलेम को घेर रखा था[a], और यिर्मयाह नबी पहरे के आँगन में बन्द था, जो यहूदा के राजा के राजमहल में था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यरूशलेम की घेराबन्दी कर रही थी।”
    reason: lexical_alternative
  - marker: b
    text: यहाँ “यहूदा के राजा का राजमहल” पूरे शाही महल-परिसर को दर्शा सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: וְ/אָז
  choice: उस समय
  rationale: यह पद ऐतिहासिक परिस्थिति बताने वाला काल-सूचक पदबंध है; ‘उस समय’ आधुनिक हिन्दी में स्वाभाविक है और मूल का समय-संबंध बनाए रखता है।
- source_word: חֵיל מֶלֶךְ בָּבֶל
  choice: बाबेल के राजा की सेना
  rationale: חֵיל यहाँ सामूहिक सैन्य बल को दर्शाता है; ‘सेना’ इसका स्पष्ट और प्रचलित हिन्दी समतुल्य है। ‘बाबेल’ मूल नाम का पारंपरिक हिन्दी बाइबलीय रूप है।
- source_word: צָרִים עַל
  choice: ने ... को घेर रखा था
  rationale: इब्रानी कृदन्त उस समय जारी घेराबन्दी की दशा व्यक्त करता है। ‘घेर रखा था’ स्वाभाविक हिन्दी में निरन्तर सैन्य घेरे का अर्थ देता है।
- source_word: וְ/יִרְמְיָהוּ הַ/נָּבִיא
  choice: और यिर्मयाह नबी
  rationale: मूल के संयोजन और स्पष्ट पदवी दोनों को बनाए रखा गया है; ‘नबी’ आधुनिक हिन्दी में परिचित और संक्षिप्त है।
- source_word: הָיָה כָלוּא
  choice: बन्द था
  rationale: यह रूप रोके या सीमित करके रखे जाने की अवस्था बताता है। ‘बन्द था’ उस अर्थ को सुरक्षित रखता है और किसी सामान्य कारागार-कोठरी का अनावश्यक संकेत नहीं देता।
- source_word: בַּ/חֲצַר הַ/מַּטָּרָה
  choice: पहरे के आँगन में
  rationale: חָצֵר एक घिरा हुआ आँगन है और מַטָּרָה यहाँ पहरे अथवा हिरासत से जुड़ी जगह को दर्शाता है। यह अनुवाद स्थान और अभिरक्षा, दोनों भावों को बनाए रखता है।
- source_word: אֲשֶׁר בֵּית מֶלֶךְ יְהוּדָה
  choice: जो यहूदा के राजा के राजमहल में था
  rationale: सम्बन्धवाचक उपवाक्य आँगन को शाही भवन-परिसर में स्थित बताता है। इस प्रसंग में בֵּית का अभिप्राय राजा का महल है, इसलिए आधुनिक पाठक के लिए ‘राजमहल’ अधिक स्पष्ट है।
