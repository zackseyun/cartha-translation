  text: וַ/תֹּצֵ֛א אֶת עַמְּ/ךָ֥ אֶת יִשְׂרָאֵ֖ל מֵ/אֶ֣רֶץ מִצְרָ֑יִם בְּ/אֹת֣וֹת וּ/בְ/מוֹפְתִ֗ים וּ/בְ/יָ֤ד חֲזָקָה֙ וּ/בְ/אֶזְר֣וֹעַ נְטוּיָ֔ה וּ/בְ/מוֹרָ֖א גָּדֽוֹל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/021.yaml
  text: And you brought your people Israel out of the land of Egypt with signs and wonders[a], with a strong hand and an outstretched arm, and with great terror.
translation:
  language: hi
  text: और आपने अपनी प्रजा इस्राएल को मिस्र देश से चिन्हों और चमत्कारों के द्वारा, बलशाली हाथ और फैली हुई भुजा से, और बड़े भय के साथ[a] बाहर निकाला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बड़े आतंक के साथ” या “बड़े श्रद्धामिश्रित विस्मय के साथ।” इब्रानी शब्द भय, आतंक या श्रद्धामिश्रित विस्मय का बोध करा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּצֵא
  choice: बाहर निकाला
  rationale: יצא के हिफ़ील रूप का अर्थ किसी को बाहर निकालना है; यह निर्गमन के प्रसंग में प्रयुक्त कारणवाचक भाव को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עַמְּךָ אֶת יִשְׂרָאֵל
  choice: अपनी प्रजा इस्राएल को
  rationale: ‘इस्राएल’ यहाँ ‘अपनी प्रजा’ का समानाधिकरणीय स्पष्टीकरण है; दोनों को बनाए रखने से मूल का वाचाई और बलाघातपूर्ण कथन सुरक्षित रहता है।
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: मिस्र देश से बाहर
  rationale: ‘से बाहर’ को क्रिया ‘निकाला’ के साथ रखकर निर्गमन की दिशा स्पष्ट की गई है, जबकि אֶרֶץ का अनुवाद ‘देश’ किया गया है।
- source_word: בְּאֹתוֹת וּבְמוֹפְתִים
  choice: चिन्हों और अद्भुत कामों के द्वारा
  rationale: בְּ का साधनवाचक अर्थ ‘के द्वारा’ से व्यक्त होता है। ‘चिन्ह’ אותות के अनुरूप है और ‘अद्भुत काम’ מופתים को सामान्य आधुनिक हिन्दी में चमत्कारिक, विस्मयकारी कृत्यों के रूप में प्रकट करता है।
- source_word: וּבְיָד חֲזָקָה
  choice: बलवन्त हाथ
  rationale: यह मूल के ‘शक्तिशाली/दृढ़ हाथ’ वाले निर्गमन-प्रयोग को संक्षिप्त, गरिमापूर्ण और परिचित हिन्दी में बनाए रखता है।
- source_word: וּבְאֶזְרֹעַ נְטוּיָה
  choice: बढ़ाई हुई भुजा
  rationale: यह निर्गमन का स्थिर रूपक है और נְטוּיָה के ‘फैलाई/बढ़ाई हुई’ भाव को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: וּבְמוֹרָא גָּדוֹל
  choice: और बड़े आतंक के साथ
  rationale: מוֹרָא भय, आतंक अथवा श्रद्धामिश्रित विस्मय का बोध करा सकता है। मिस्र के विरुद्ध परमेश्वर के भय उत्पन्न करने वाले कार्यों के संदर्भ में ‘आतंक’ मुख्य पाठ में उपयुक्त है, जबकि व्यापक अर्थ-क्षेत्र पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: निर्गमन-सूत्र के अंतिम पद וּבְמוֹרָא גָּדוֹל का अर्थ
  choice: और बड़े आतंक के साथ
  alternative: और बड़े श्रद्धामिश्रित विस्मय के साथ
  rationale: मुख्य अनुवाद परमेश्वर के कार्यों के भयावह प्रभाव को व्यक्त करता है, पर इब्रानी शब्द केवल आतंक तक सीमित नहीं है। इसलिए श्रद्धा और विस्मय की सम्भावना को पादटिप्पणी में रखा गया है, ताकि मूल की अर्थगत और धर्मवैचारिक व्यापकता को अनावश्यक रूप से न सुलझाया जाए।
translation_notes:
  register: परमेश्वर के लिए आदरसूचक ‘आप’ का प्रयोग किया गया है, जो आधुनिक मानक हिन्दी में स्वाभाविक और गरिमापूर्ण है। वाक्य की समानांतर निर्गमन-शैली को बनाए रखते हुए भाषा को सामान्य पाठक के लिए स्पष्ट रखा गया है।
