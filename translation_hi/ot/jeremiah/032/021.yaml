review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the causative ‘brought out,’ the apposition ‘your people Israel,’ Egypt, and the three coordinated instrumental expressions. The final phrase is lexically possible, but its Hindi wording is less idiomatic and can imply that God himself acted in a state of terror rather than referring to fearsome deeds.
  naturalness: ‘बलवन्त’ is literary/dated for modern standard Hindi, and ‘बढ़ाई हुई भुजा’ is less natural than ‘फैली हुई भुजा.’ ‘बड़े आतंक के साथ’ is awkward in this construction. Reordering Egypt before the instrumental phrases also follows the Hebrew sequence and improves readability.
  terminology: ‘चिन्हों और अद्भुत कामों’ is understandable, but ‘चिन्हों और चमत्कारों’ is the established, natural modern Hindi equivalent for the biblical pair ‘signs and wonders.’ ‘बलशाली हाथ’ and ‘फैली हुई भुजा’ preserve the exodus idiom in current Hindi.
  issues:
  - severity: medium
    issue: The phrase ‘बड़े आतंक के साथ’ is unnatural and potentially misdirects the sense.
    rationale: In Hindi it can suggest that the actor performed the action while experiencing or carrying terror. ‘बड़े भय के साथ’ is idiomatic and retains the Hebrew term’s semantic breadth; the note specifies the possible nuance of terror or awe.
  - severity: low
    issue: Some wording is dated or less idiomatic for the requested modern-standard register.
