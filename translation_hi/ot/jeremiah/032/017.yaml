  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אֲהָהּ֮ אֲדֹנָ֣/י יְהוִה֒ הִנֵּ֣ה אַתָּ֣ה עָשִׂ֗יתָ אֶת הַ/שָּׁמַ֨יִם֙ וְ/אֶת הָ/אָ֔רֶץ בְּ/כֹֽחֲ/ךָ֙ הַ/גָּד֔וֹל וּ/בִֽ/זְרֹעֲ/ךָ֖ הַ/נְּטוּיָ֑ה לֹֽא יִפָּלֵ֥א מִמְּ/ךָ֖ כָּל דָּבָֽר׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/017.yaml
  text: Ah, Lord GOD! Look, you yourself made the heavens and the earth by your great power and by your outstretched arm. Nothing is too difficult for you.
translation:
  language: hi
  text: आह, प्रभु यहोवा! देख, तूने ही अपने महान सामर्थ्य और अपनी फैली हुई भुजा से आकाश और पृथ्वी को बनाया है। तेरे लिए कोई भी बात असंभव नहीं है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲהָהּ
  choice: हाय
  rationale: यह विस्मय, व्यथा या गंभीर भाव से निकला उद्गार है; संदर्भ में प्रार्थनापूर्ण विस्मय को खुला रखते हुए ‘हाय’ निकटतम संक्षिप्त हिन्दी रूप है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: אֲדֹנָי को ‘प्रभु’ और परमेश्वर के विशिष्ट नाम יהוה को ‘यहोवा’ देकर दोनों पदों का भेद बनाए रखा गया है।
- source_word: הִנֵּה
  choice: देख
  rationale: ध्यान आकृष्ट करने वाले प्रार्थनात्मक संबोधन को सीधे और स्वाभाविक रूप में व्यक्त करता है।
- source_word: בְכֹחֲךָ הַגָּדוֹל
  choice: अपने महान सामर्थ्य से
  rationale: בְ के साधनार्थक प्रयोग और כֹּחַ के शक्ति-सामर्थ्य भाव को स्पष्ट रखता है।
- source_word: וּבִזְרֹעֲךָ הַנְּטוּיָה
  choice: और अपनी बढ़ाई हुई भुजा से
  rationale: ईश्वरीय सामर्थ्य के मानवरूपी बिंब को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: לֹא יִפָּלֵא מִמְּךָ כָּל דָּבָר
  choice: तेरे लिए कोई भी बात असम्भव नहीं है
  rationale: शाब्दिक ‘कोई बात तुझसे अत्यन्त कठिन/अद्भुत नहीं है’ का स्वाभाविक हिन्दी अर्थ देता है और כָּל דָּבָר की व्यापकता बनाए रखता है।
theological_decisions:
- issue: יהוה का निरूपण
  choice: यहोवा
  alternative: याहवे / बड़े अक्षरों में ‘प्रभु’
  rationale: हिन्दी पाठक के लिए परिचित नामरूप का प्रयोग करते हुए אֲדֹנָי और יהוה के संयुक्त संबोधन का भेद बनाए रखा गया है।
- issue: बढ़ाई हुई भुजा का बिंब
  choice: रूपक को यथावत रखा
  alternative: ‘अपनी प्रबल शक्ति से’ जैसा अर्थ-विस्तार
  rationale: मूल के सजीव मानवरूपी चित्र और उससे जुड़ी निर्गमन-परंपरा की प्रतिध्वनि को मिटाया नहीं गया।
- issue: יִפָּלֵא का अर्थ
  choice: असम्भव
  alternative: अत्यन्त कठिन / अद्भुत
  rationale: इस संदर्भ में क्रिया सामर्थ्य से परे होने का भाव देती है; फिर भी इसे दार्शनिक सर्वशक्तिमत्ता की विस्तृत व्याख्या में नहीं बदला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में प्रार्थनात्मक, गंभीर और सहज शैली। परमेश्वर के प्रति एकवचन निकट संबोधन ‘तू/तेरे’ रखा गया है, जो मूल हिब्रू के एकवचन संबोधन और पारंपरिक भक्तिपरक हिन्दी दोनों के अनुरूप है।
