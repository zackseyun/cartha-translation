id: JER.32.6
reference: Jeremiah 32:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר יִרְמְיָ֑הוּ הָיָ֥ה דְּבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/006.yaml
  text: And Jeremiah said[a], "The word of Yahweh came to me, saying,"
translation:
  language: hi
  text: और यिर्मयाह ने कहा, “याहवे[a] का वचन मेरे पास आया:”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'हिब्रू: YHWH; परंपरागत रूप से इसका अनुवाद ‘प्रभु’ किया जाता है।'
    reason: दिव्य नाम के मूल हिब्रू रूप और पारंपरिक वैकल्पिक प्रस्तुति को बताना।
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: और ... ने कहा
  rationale: वाव-क्रमिक कथानक को आगे बढ़ाता है। ‘और ... ने कहा’ उसके संयोजक और अनुक्रमिक बल को बनाए रखता है, बिना उसे अधिक स्पष्ट कालबोधक ‘तब’ में बदलने के।
- source_word: יִרְמְיָהוּ
  choice: यिर्मयाह
  rationale: हिब्रू व्यक्ति-नाम का हिन्दी में प्रचलित और पहचानने योग्य लिप्यंतरण।
- source_word: הָיָה דְבַר יְהוָה אֵלַי
  choice: याहवे का वचन मेरे पास आया
  rationale: यह मानक भविष्यद्वाणी-सूत्र है। הָיָה का मूल अर्थ ‘हुआ/था’ है, पर इस रचनात्मक संदर्भ में ‘वचन ... मेरे पास आया’ स्वाभाविक हिन्दी में दिव्य संदेश प्राप्त होने का भाव व्यक्त करता है।
- source_word: דְבַר
  choice: वचन
  rationale: ‘वचन’ דבר के साथ निकट शाब्दिक संबंध और परिचित भविष्यद्वाणी-सूत्र दोनों को बनाए रखता है; ‘संदेश’ अधिक व्याख्यात्मक होता।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले दिव्य नाम YHWH को उपाधि ‘प्रभु’ से बदलने के बजाय हिन्दी में उसके प्रचलित विद्वतापूर्ण उच्चारण के अनुसार लिप्यंतरित किया गया है।
- source_word: אֵלַי
  choice: मेरे पास
  rationale: पूर्वसर्ग और प्रथम पुरुष एकवचन प्रत्यय का स्वाभाविक हिन्दी रूप।
- source_word: לֵאמֹר
  choice: आगे आने वाले कथन को आरम्भ करने वाला द्विबिंदु
  rationale: हिब्रू क्रियार्थक रूप अगले पद में आने वाली वाणी का परिचय देता है। हिन्दी में पद के अंत पर द्विबिंदु उसी कार्य को अधिक स्वाभाविक ढंग से करता है; ‘यह कहते हुए’ यहाँ कृत्रिम लगता और वचन को वक्ता के रूप में अधिक स्पष्ट कर देता।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु; यहोवा
  rationale: मूल पाठ में निजी दिव्य नाम YHWH है। ‘याहवे’ नाम को नाम के रूप में सुरक्षित रखता है; ‘प्रभु’ उसे उपाधि से बदल देता है और ‘यहोवा’ बाद की मिश्रित स्वर-पठन परंपरा को दर्शाता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। भविष्यद्वाणी-सूत्र की परिचित शैली बनाए रखते हुए לֵאמֹר को हिन्दी विराम-चिह्न से व्यक्त किया गया है।
