  text: So I wrote it in the deed[a], sealed it, called witnesses, and weighed out the silver on the scales.
translation:
  language: hi
  text: तब मैंने उस दस्तावेज़[a] में लिखा, उस पर मुहर लगाई, गवाहों को बुलाया और चाँदी को तराज़ू पर तौला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘लेखपत्र में’ अथवा ‘पुस्तक में’; इब्रानी शब्द סֵפֶר लिखित सामग्री या दस्तावेज़ के लिए एक सामान्य शब्द है। यहाँ यह सम्भवतः भूमि की खरीद के दस्तावेज़ को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶכְתֹּב
  choice: तब मैंने ... लिखा
  rationale: כתב के प्रथम पुरुष एकवचन कथात्मक रूप को क्रमिक भूतकालीन क्रिया के रूप में प्रस्तुत किया गया है; ‘तब’ हिन्दी में कथा-क्रम को स्वाभाविक बनाता है।
- source_word: בַּסֵּפֶר
  choice: उस दस्तावेज़ में
  rationale: סֵפֶר सामान्यतः किसी लिखित सामग्री, पुस्तक, पत्र या दस्तावेज़ को दर्शाता है। भूमि-खरीद के कानूनी प्रसंग में ‘दस्तावेज़’ स्वाभाविक है, जबकि व्यापक शाब्दिक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וָאֶחְתֹּם
  choice: उस पर मुहर लगाई
  rationale: חתם कानूनी प्रसंग में दस्तावेज़ को मुहरबंद करने का संकेत देता है। हिन्दी में ‘उस पर मुहर लगाई’ स्वाभाविक है और पूर्वोक्त दस्तावेज़ को इसका निहित कर्म मानता है।
- source_word: וָאָעֵד עֵדִים
  choice: गवाहों को बुलाया
  rationale: עוד के हिफ़ील रूप के साथ עֵדִים यहाँ गवाहों से कानूनी रूप से प्रमाणित कराने अथवा उन्हें साक्षी बनाने की क्रिया व्यक्त करता है। ‘गवाहों को बुलाया’ स्पष्ट और सहज है, बिना प्रक्रिया का अनावश्यक विस्तार किए।
- source_word: וָאֶשְׁקֹל
  choice: तौला
  rationale: שקל लेन-देन में धातु को भार के अनुसार नापने को दर्शाता है। अगले पदबंध ‘तराज़ू पर’ के साथ ‘तौला’ हिन्दी में पूर्ण और स्वाभाविक है।
- source_word: הַכֶּסֶף
  choice: चाँदी
  rationale: כֶּסֶף का मूल अर्थ ‘चाँदी’ है, यद्यपि यह धन के अर्थ में भी आता है। तौलने के उल्लेख के कारण ‘चाँदी’ प्राचीन भुगतान की ठोस ऐतिहासिक छवि बनाए रखता है।
- source_word: בְּמֹאזְנָיִם
  choice: तराज़ू पर
  rationale: מֹאזְנַיִם तौलने के तराज़ू या पलड़ों को दर्शाता है। ‘तराज़ू पर’ आधुनिक मानक हिन्दी में सहज और दृश्यात्मक है।
