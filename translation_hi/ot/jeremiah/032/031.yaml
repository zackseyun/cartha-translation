id: JER.32.31
reference: Jeremiah 32:31
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֧י עַל אַפִּ֣/י וְ/עַל חֲמָתִ֗/י הָ֤יְתָה לִּ/י֙ הָ/עִ֣יר הַ/זֹּ֔את לְ/מִן הַ/יּוֹם֙ אֲשֶׁ֣ר בָּנ֣וּ אוֹתָ֔/הּ וְ/עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה לַ/הֲסִירָ֖/הּ מֵ/עַ֥ל פָּנָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/031.yaml
  text: For this city has been to me a cause of my anger and my wrath from the day they built it even to this day[b][a], so that I should remove it from before my face.
translation:
  language: hi
  text: क्योंकि जिस दिन उन्होंने इस नगर को बनाया, उस दिन से लेकर आज तक यह मेरे क्रोध और कोप का कारण बना रहा है, ताकि मैं इसे अपने सामने से हटा दूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन में घोषित न्याय का कारण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इसका स्वाभाविक संयोजक है।
- source_word: עַל אַפִּי וְעַל חֲמָתִי
  choice: मेरे क्रोध और कोप का कारण
  rationale: ‘मेरे क्रोध पर और मेरे कोप पर’ शाब्दिक किंतु अस्वाभाविक होगा। यह इब्रानी मुहावरा नगर द्वारा परमेश्वर के क्रोध और कोप को भड़काने का भाव व्यक्त करता है।
- source_word: אַפִּי
  choice: मेरे क्रोध
  rationale: אַף का मूल अर्थ नाक या नथुना है, पर यहाँ वह प्रचलित लाक्षणिक अर्थ ‘क्रोध’ में प्रयुक्त है।
- source_word: חֲמָתִי
  choice: कोप
  rationale: חֵמָה तीव्र या धधकते क्रोध को व्यक्त करता है; ‘कोप’ गरिमापूर्ण और सुबोध है तथा ‘क्रोध’ के साथ स्रोत की दोहरी अभिव्यक्ति बनाए रखता है।
- source_word: הָיְתָה לִּי
  choice: बना रहा है
  rationale: पूर्ण क्रिया उस स्थिति को बताती है जो नगर के निर्माण से वर्तमान दिन तक जारी रही; हिन्दी का पूर्ण वर्तमान भाव इस निरंतरता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְמִן הַיּוֹם אֲשֶׁר בָּנוּ אוֹתָהּ וְעַד הַיּוֹם הַזֶּה
  choice: जिस दिन उन्होंने इस नगर को बनाया, उस दिन से लेकर आज तक
  rationale: आरंभ-बिंदु से वर्तमान दिन तक की अवधि को स्पष्ट रखता है और इब्रानी के अनिर्दिष्ट बहुवचन कर्ता ‘उन्होंने’ को सुरक्षित रखता है।
- source_word: לַהֲסִירָהּ
  choice: इसलिए मैं इसे ... हटा दूँगा
  rationale: לְ के साथ infinitive यहाँ परिणाम अथवा उद्देश्य का भाव दे सकता है। ‘इसलिए’ प्रसंगगत परिणाम को व्यक्त करता है, जबकि ‘हटा दूँगा’ न्याय की आगामी कार्रवाई को स्वाभाविक हिन्दी में रखता है।
- source_word: מֵעַל פָּנָי
  choice: अपने सामने से
  rationale: शाब्दिक भाव ‘मेरे मुख के सामने से’ है। ‘अपने सामने से’ स्रोत की देहात्मक उपस्थिति-छवि को काफी हद तक बनाए रखते हुए आधुनिक हिन्दी में सहज है।
theological_decisions:
- issue: परमेश्वर के क्रोध और उपस्थिति के लिए मानवरूपी भाषा
  choice: ‘मेरे क्रोध और कोप’ तथा ‘अपने सामने से’ द्वारा ठोस भाषा को बनाए रखा गया है।
  alternative: ‘मुझे क्रोधित करता रहा है’ तथा ‘अपनी उपस्थिति से’
  rationale: स्रोत परमेश्वर के क्रोध और ‘मुख’ की देहात्मक भाषा इस्तेमाल करता है। हिन्दी में अस्वाभाविक शाब्दिकता से बचते हुए उस चित्रात्मक और धर्मवैचारिक तनाव को अमूर्त भाषा में समतल नहीं किया गया।
- issue: לַהֲסִירָהּ में उद्देश्य अथवा परिणाम
  choice: ‘इसलिए मैं इसे ... हटा दूँगा’—परिणामात्मक संबंध
  alternative: ‘ताकि मैं इसे ... हटा दूँ’—उद्देश्यात्मक संबंध
  rationale: इब्रानी לְ + infinitive दोनों अर्थ दे सकता है। इस प्रसंग में नगर के लंबे समय से क्रोध का कारण बने रहने के फलस्वरूप उसे हटाना अधिक स्वाभाविक है; फिर भी मूल की संभावित उद्देश्यात्मक छाया को निर्णायक सिद्धांत में नहीं बदला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘क्रोध और कोप’ स्रोत के समानार्थी युग्म और उसकी तीव्रता को बनाए रखता है। ‘अपने सामने से’ को अत्यधिक शाब्दिक ‘अपने मुख के ऊपर से’ की जगह चुना गया है।
