source:
  edition: WLC
  text: וּ/בָ֣אוּ הַ/כַּשְׂדִּ֗ים הַ/נִּלְחָמִים֙ עַל הָ/עִ֣יר הַ/זֹּ֔את וְ/הִצִּ֜יתוּ אֶת הָ/עִ֥יר הַ/זֹּ֛את בָּ/אֵ֖שׁ וּ/שְׂרָפ֑וּ/הָ וְ/אֵ֣ת הַ/בָּתִּ֡ים אֲשֶׁר֩ קִטְּר֨וּ עַל גַּגּֽוֹתֵי/הֶ֜ם לַ/בַּ֗עַל וְ/הִסִּ֤כוּ נְסָכִים֙ לֵ/אלֹהִ֣ים אֲחֵרִ֔ים לְמַ֖עַן הַכְעִסֵֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/029.yaml
  text: And the Chaldeans who are fighting against this city will come and set this city on fire and burn it[a], along with the houses on whose rooftops they burned incense to Baal and poured out drink offerings to other gods, to provoke me to anger.
translation:
  language: hi
  text: और जो कसदी इस नगर के विरुद्ध लड़ रहे हैं, वे आकर इस नगर में आग लगा देंगे और इसे जला देंगे[a]—उन घरों समेत जिनकी छतों पर उन्होंने बाल के लिए धूप जलाई और दूसरे देवताओं के लिए पेय-बलियाँ उंडेली, ताकि मुझे क्रोधित करें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “बेबीलोनियों।” इब्रानी में “कसदी” है, जो प्रायः नव-बेबीलोनी सेना के लिए प्रयुक्त होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכַּשְׂדִּים
  choice: कसदी
  rationale: यह मूल जातीय नाम का सीधा रूप है और यहाँ नव-बेबीलोनी सेना को सूचित करता है; अधिक परिचित संदर्भगत विकल्प ‘बेबीलोनी’ को पादटिप्पणी में रखा गया है।
- source_word: הַנִּלְחָמִים עַל
  choice: इस नगर से लड़ रहे
  rationale: कृदंत चल रही शत्रुतापूर्ण सैन्य कार्रवाई व्यक्त करता है; यह रूप उसके अपूर्ण/जारी पक्ष को बनाए रखता है।
- source_word: וְהִצִּיתוּ ... בָּאֵשׁ וּשְׂרָפוּהָ
  choice: इस नगर में आग लगा देंगे और इसे जला देंगे
  rationale: हिफ़ील क्रिया का स्वाभाविक अर्थ ‘आग लगाना’ है, और अगली क्रिया आग से नगर के विनाश को स्पष्ट रूप से दोहराती है।
- source_word: וְאֵת הַבָּתִּים
  choice: वे उन घरों को भी जला देंगे
  rationale: दूसरे प्रत्यक्ष कर्म को नए वाक्य में स्पष्ट किया गया है; ‘भी’ नगर के साथ घरों के जलाए जाने का समन्वय बनाए रखता है।
- source_word: אֲשֶׁר קִטְּרוּ עַל גַּגּוֹתֵיהֶם
  choice: जिनकी छतों पर लोगों ने ... धूप जलाई
  rationale: संबंधवाचक उपवाक्य घरों को विशेषित करता है और छतों पर किए गए उपासना-कर्म को स्पष्ट रखता है। अनिर्दिष्ट बहुवचन कर्ता को स्वाभाविक हिन्दी में ‘लोगों’ से व्यक्त किया गया है।
- source_word: לַבַּעַל
  choice: बाल के लिए
  rationale: पूर्वसर्ग अर्पण के प्राप्तकर्ता देवता को दर्शाता है; ‘बाल’ नाम का प्रचलित हिन्दी लिप्यंतरण है।
- source_word: וְהִסִּכוּ נְסָכִים
  choice: अर्घ चढ़ाए
  rationale: यह द्रव अर्पण उंडेलने की बलिदानी क्रिया का संक्षिप्त और स्वाभाविक हिन्दी धार्मिक पद है।
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: दूसरे देवताओं के लिए
  rationale: ‘दूसरे’ मूल אחרים का सीधा अर्थ बनाए रखता है और ‘विदेशी’ जैसी व्याख्यात्मक वृद्धि से बचता है।
- source_word: לְמַעַן הַכְעִסֵנִי
  choice: ताकि मुझे क्रोध दिलाएँ
  rationale: यह उद्देश्य/परिणाम और כעס के कारक भाव—परमेश्वर को क्रोधित करना—दोनों को बनाए रखता है।
theological_decisions:
- issue: मूर्तिपूजा के प्रति परमेश्वर की प्रतिक्रिया
  choice: ताकि मुझे क्रोध दिलाएँ
  alternative: मुझे क्रोधित करने के लिए
  rationale: मूल पाठ इन उपासना-कर्मों को परमेश्वर के क्रोध का कारण और उद्देश्य/परिणाम बताता है। अनुवाद इस व्यक्तिगत और न्यायिक प्रतिक्रिया को न तो नरम करता है, न उसका विस्तार करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज स्तर रखा गया है। लंबी इब्रानी संरचना को दो वाक्यों में बाँटा गया है, पर घटनाक्रम और संबंध सुरक्षित हैं। ‘धूप जलाई’ सामान्य पाठक के लिए सुलभ है; ‘अर्घ चढ़ाए’ द्रव अर्पण के सांस्कृतिक-धार्मिक अर्थ को संक्षेप में व्यक्त करता है।
