source:
  edition: WLC
  text: וּ/בָבֶ֞ל יוֹלִ֤ךְ אֶת צִדְקִיָּ֨הוּ֙ וְ/שָׁ֣ם יִֽהְיֶ֔ה עַד פָּקְדִ֥/י אֹת֖/וֹ נְאֻם יְהוָ֑ה כִּ֧י תִֽלָּחֲמ֛וּ אֶת הַ/כַּשְׂדִּ֖ים לֹ֥א תַצְלִֽיחוּ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/005.yaml
  text: And he will take Zedekiah to Babylon, and there he will remain until I attend to him, declares the LORD. Though you fight against the Chaldeans, you will not succeed.
translation:
  language: hi
  text: बाबेल सिदकिय्याह को ले जाएगा, और वह वहीं रहेगा, जब तक मैं उसकी सुधि न लूँ[a]—यहोवा की यह वाणी है। चाहे तुम कसदियों से लड़ो, तुम सफल नहीं होगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब तक मैं उसके विषय में हस्तक्षेप न करूँ।” इब्रानी क्रिया का अर्थ किसी की सुधि लेना, उस पर ध्यान देना, या उसके साथ व्यवहार करना हो सकता है; यहाँ उस कार्रवाई का परिणाम स्पष्ट नहीं किया गया है।
    reason: פָּקַד की वास्तविक अर्थगत अस्पष्टता तथा उसके संभावित अनुग्रहपूर्ण या न्यायात्मक परिणाम को सुरक्षित रखना।
lexical_decisions:
- source_word: יוֹלִךְ
  choice: ले जाएगा
  rationale: हिफ़ील क्रिया का प्रेरणार्थक अर्थ ‘ले जाना/पहुँचाना’ है; कर्ता पूर्ववर्ती प्रसंग से समझा जाता है, इसलिए मूल की तरह यहाँ भी सर्वनाम रखा गया है।
- source_word: פָּקְדִי אֹתוֹ
  choice: मैं उस पर ध्यान न दूँ
  rationale: פקד का अर्थ प्रसंगानुसार किसी की सुधि लेना, उसकी ओर ध्यान देना या उसके विषय में हस्तक्षेप करना हो सकता है। मुख्य पाठ में अपेक्षाकृत खुला अनुवाद रखा गया है और अर्थ-सीमा पादटिप्पणी में बताई गई है।
- source_word: הַכַּשְׂדִּים
  choice: कसदियों
  rationale: यह प्राचीन जातीय-राजनीतिक नाम का हिन्दी में प्रचलित बाइबिलीय रूप है।
- source_word: לֹא תַצְלִיחוּ
  choice: तुम सफल नहीं होगे
  rationale: צלח यहाँ युद्ध में सफलता पाने का अर्थ देता है; बहुवचन संबोधन को ‘तुम’ से व्यक्त किया गया है।
theological_decisions:
- issue: פקד में निहित दैवी कार्रवाई की प्रकृति
  choice: ‘ध्यान न दूँ’ के द्वारा कार्रवाई को अनिर्धारित रखा गया
  alternative: ‘दण्ड न दूँ’, ‘छुड़ा न लूँ’ या ‘उसकी सुधि न लूँ’
  rationale: इब्रानी क्रिया अपने आप यह निश्चित नहीं करती कि परमेश्वर की आगामी कार्रवाई अनुग्रहपूर्ण होगी या न्यायात्मक; किसी एक दिशा को चुनना मूल की धार्मिक और कथात्मक अस्पष्टता को समाप्त कर देता।
- issue: כִּי का संबंध
  choice: ‘चाहे ...’
  alternative: ‘यदि ...’ या ‘जब ...’
  rationale: 'यहाँ खंड का आशय विरोधात्मक-स्वीकारात्मक है: युद्ध करने पर भी सफलता नहीं मिलेगी। ‘चाहे’ इस भाव को स्वाभाविक हिन्दी में व्यक्त करता है, बिना युद्ध की वास्तविकता या संभावना को अनावश्यक रूप से तय किए।'
- issue: יהוה का निरूपण
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में व्यक्तिगत दैवी नाम है; हिन्दी में उसके परिचित लिप्यंतरण से नाम और सामान्य उपाधि के बीच का भेद सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल किंतु गरिमापूर्ण शैली रखी गई है। ‘सिदकिय्याह’, ‘बाबेल’ और ‘कसदी’ जैसे परिचित बाइबिलीय नाम-रूप बनाए गए हैं। वाक्य-विन्यास मूल के क्रम और बल को यथासंभव सुरक्षित रखते हुए स्वाभाविक हिन्दी में ढाला गया है।
