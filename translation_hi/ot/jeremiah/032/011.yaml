  text: तब मैंने खरीद का दस्तावेज़ लिया—मुहरबंद प्रति[a], जिसमें नियम और शर्तें लिखी थीं, और खुली प्रति[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मुहरबंद दस्तावेज़, आज्ञा और विधियाँ।” इब्रानी के ये कानूनी शब्द संभवतः दस्तावेज़ के नियमों और प्रावधानों की ओर संकेत करते हैं।
    reason: lexical_alternative
  - marker: b
    text: अर्थात मुहरबंद प्रति के विपरीत वह प्रति जो खुली हुई थी और जिसे देखा जा सकता था।
    reason: cultural_note
lexical_decisions:
- source_word: וָאֶקַּח
  choice: तब मैंने … लिया
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; ‘तब’ हिन्दी में घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: סֵפֶר הַמִּקְנָה
  choice: खरीद का दस्तावेज़
  rationale: סֵפֶר यहाँ लिखित कानूनी दस्तावेज़ है और מִקְנָה खरीद अथवा अर्जन को दर्शाता है; यह पदबंध संपत्ति की खरीद से जुड़े औपचारिक लेखपत्र को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הֶחָתוּם
  choice: मुहरबंद प्रति
  rationale: חתם का कर्मवाच्य कृदंत ‘मुहरबंद’ का अर्थ देता है। הַגָּלוּי के साथ विरोध और दस्तावेज़ के समानाधिकरण को स्पष्ट करने के लिए ‘प्रति’ जोड़ा गया है।
- source_word: הַמִּצְוָה וְהַחֻקִּים
  choice: नियम और शर्तें
  rationale: इन शब्दों के सामान्य अर्थ ‘आज्ञा’ और ‘विधियाँ’ हैं, पर इस संपत्ति-संबंधी कानूनी प्रसंग में वे दस्तावेज़ की निर्धारित शर्तों और प्रावधानों की ओर संकेत करते हैं। ‘नियम और शर्तें’ आधुनिक हिन्दी में स्वाभाविक कानूनी अभिव्यक्ति है।
- source_word: הַגָּלוּי
  choice: खुली प्रति
  rationale: यह शब्द ‘खुला/अनावृत’ अर्थ देता है और मुहरबंद दस्तावेज़ के विपरीत ऐसी प्रति को दर्शाता है जो मुहरबंद नहीं थी और देखी जा सकती थी।
theological_decisions:
- issue: הַמִּצְוָה וְהַחֻקִּים का मुहरबंद दस्तावेज़ से वाक्यगत संबंध
  choice: इसे मुहरबंद प्रति में लिखे नियम और शर्तों के रूप में प्रस्तुत किया गया है।
  alternative: इन्हें अलग मदों के रूप में शाब्दिकतः ‘आज्ञा और विधियाँ’ पढ़ा जा सकता है।
  rationale: कानूनी प्रसंग और समानाधिकरण वाली इब्रानी रचना शर्तों/प्रावधानों वाली समझ का समर्थन करती है, पर इब्रानी का संक्षिप्त वाक्य-विन्यास दूसरी व्याख्या की संभावना पूरी तरह समाप्त नहीं करता; इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘खरीद का दस्तावेज़’ और ‘नियम और शर्तें’ सामान्य पाठक के लिए कानूनी प्रसंग स्पष्ट करते हैं, जबकि पादटिप्पणी इब्रानी की वास्तविक वाक्यगत और शब्दार्थगत अस्पष्टता को सुरक्षित रखती है।
