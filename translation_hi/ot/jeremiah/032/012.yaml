base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/012.yaml
  text: Then I gave the deed of purchase to Baruch son of Neriah[a], son of Mahseiah, in the sight of Hanamel my uncle, and in the sight of the witnesses who had written in the deed of purchase[e][d][c][b], in the sight of all the Judeans who were sitting in the court of the guard.
translation:
  language: hi
  text: तब मैंने खरीद का दस्तावेज़ नेरियाह के पुत्र और महसयाह के पोते बारूक को, अपने चाचा[a] हनमेल के सामने, खरीद के दस्तावेज़ में लिखने वाले गवाहों[b] के सामने, और पहरेदारों के आँगन[d] में बैठे यहूदा के सभी लोगों[c] के सामने सौंप दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में यहाँ शाब्दिक रूप से “मेरा चाचा” है; पर इस अध्याय के अन्य पदों में हनमेल को यिर्मयाह के चाचा का पुत्र बताया गया है।
    reason: cross_reference
  - marker: b
    text: या “जिन्होंने खरीद के दस्तावेज़ में लिखा था”; इब्रानी में शाब्दिक रूप से “दस्तावेज़ में लिखने वाले गवाह” है। संभवतः यह उनकी लिखित गवाही या हस्ताक्षर की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: c
    text: या “सभी यहूदियों”; “यहूदा के सभी लोग” उस समय के यहूदा राज्य के ऐतिहासिक संदर्भ को सामने रखता है।
    reason: lexical_alternative
  - marker: d
    text: या “पहरे का आँगन” अथवा संभवतः “बंदीगृह का आँगन।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתֵּן
  choice: तब मैंने ... सौंप दिया
  rationale: वय्यिक्तोल कथा को आगे बढ़ाता है; ‘तब’ क्रम को और ‘सौंप दिया’ किसी व्यक्ति को कानूनी दस्तावेज़ देने की क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: סֵפֶר הַמִּקְנָה
  choice: खरीद का दस्तावेज़
  rationale: कानूनी संदर्भ में यह खरीदी और संपत्ति-हस्तांतरण से संबंधित लिखित दस्तावेज़ है; यह पद सामान्य पाठक के लिए स्पष्ट है।
- source_word: בָּרוּךְ בֶּן נֵרִיָּה בֶּן מַחְסֵיָה
  choice: नेरियाह के पुत्र और महसयाह के पोते बारूक
  rationale: 'वंशावली की दो क्रमिक ‘पुत्र’ संरचनाओं का स्वाभाविक हिन्दी रूप है: बारूक नेरियाह का पुत्र और महसयाह का पोता है।'
- source_word: לְעֵינֵי
  choice: के सामने
  rationale: शाब्दिक अर्थ ‘की आँखों के सामने’ है; बार-बार आया ‘के सामने’ सार्वजनिक और साक्षीपूर्ण कानूनी कार्य को सहज हिन्दी में बनाए रखता है।
- source_word: חֲנַמְאֵל דֹּדִי
  choice: अपने चाचा हनमेल
  rationale: דּוֹד का सामान्य निकट अर्थ ‘चाचा’ है; अध्याय के दूसरे कथन से उत्पन्न रिश्ते की कठिनाई को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: הָעֵדִים הַכֹּתְבִים בְּסֵפֶר הַמִּקְנָה
  choice: खरीद के दस्तावेज़ में लिखने वाले गवाहों
  rationale: इब्रानी कृदंत ‘लिखने वाले’ को बनाए रखा गया है; केवल ‘हस्ताक्षर करने वाले’ कहकर उसकी कानूनी क्रिया को अनावश्यक रूप से निश्चित नहीं किया गया।
- source_word: כָּל הַיְּהוּדִים
  choice: सभी यहूदावासियों
  rationale: ऐतिहासिक संदर्भ में यह शब्द यहूदा से जुड़े लोगों को सूचित करता है; ‘यहूदावासी’ उस भौगोलिक-राजनीतिक अर्थ को आधुनिक धार्मिक पहचान तक सीमित नहीं करता।
- source_word: חֲצַר הַמַּטָּרָה
  choice: पहरे का आँगन
  rationale: חָצֵר के लिए ‘आँगन’ और מַטָּרָה के लिए ‘पहरा’ इस किलेबंद निगरानी/हिरासत-स्थल का संक्षिप्त और स्पष्ट रूप है।
theological_decisions:
- issue: हनमेल के रिश्ते की पहचान
  choice: मुख्य पाठ में ‘चाचा’
  alternative: ‘रिश्तेदार’ अथवा अध्याय के अन्य पदों के आधार पर ‘चचेरा भाई’
  rationale: इस पद का तत्काल इब्रानी शब्द דֹּדִי सामान्यतः ‘मेरा चाचा’ कहता है, जबकि अध्याय के अन्य पद हनमेल को यिर्मयाह के चाचा का पुत्र बताते हैं। मुख्य पाठ तत्काल शब्दावली का अनुसरण करता है और तनाव को पादटिप्पणी में खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में कानूनी प्रसंग के अनुरूप गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘के सामने’ की तीन बार पुनरावृत्ति मूल के सार्वजनिक-साक्षी सूत्र को सुरक्षित रखती है। नामों के प्रचलित हिन्दी बाइबलीय रूप अपनाए गए हैं।
