  register: आधुनिक मानक हिन्दी; भाषा सहज किंतु गरिमापूर्ण है। ‘पीठ फेर दी’ परिचित हिन्दी मुहावरा है, जबकि ‘बड़े यत्न से बार-बार’ मूल इब्रानी मुहावरे के आशय को सामान्य पाठक के लिए स्पष्ट करता है। सभी पादटिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
