reference: Jeremiah 32:33
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּפְנ֥וּ אֵלַ֛/י עֹ֖רֶף וְ/לֹ֣א פָנִ֑ים וְ/לַמֵּ֤ד אֹתָ/ם֙ הַשְׁכֵּ֣ם וְ/לַמֵּ֔ד וְ/אֵינָ֥/ם שֹׁמְעִ֖ים לָ/קַ֥חַת מוּסָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/033.yaml
  text: They turned their back to me and not their face[a]; though I taught them, rising early and teaching[b], they would not listen to receive correction.
translation:
  language: hi
  text: उन्होंने मेरी ओर अपना मुँह नहीं, बल्कि अपनी पीठ की। यद्यपि मैं भोर को उठकर उन्हें सिखाता रहा[a], फिर भी वे सुधार स्वीकार करने के लिए सुनने को तैयार नहीं थे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “भोर को उठकर सिखाना”; यह निरंतर, तत्पर और बार-बार सिखाने का इब्रानी मुहावरा है।
    reason: cultural_note
  - marker: b
    text: या “अनुशासन ग्रहण करने के लिए।” इब्रानी शब्द का अर्थ सुधार, अनुशासन या शिक्षाप्रद ताड़ना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְנוּ אֵלַי עֹרֶף וְלֹא פָנִים
  choice: उन्होंने मेरी ओर अपना मुँह नहीं, बल्कि अपनी पीठ फेर दी
  rationale: इब्रानी में ‘पीठ/गरदन’ और ‘मुँह’ का तीखा विरोध है, जो जानबूझकर परमेश्वर से विमुख होने को व्यक्त करता है। स्वाभाविक हिन्दी में ‘पीठ फेर दी’ इस भाव को स्पष्ट रखते हुए दोनों शारीरिक बिंबों को बचाता है।
- source_word: וְלַמֵּד אֹתָם הַשְׁכֵּם וְלַמֵּד
  choice: मैं उन्हें बड़े यत्न से बार-बार सिखाता रहा
  rationale: शाब्दिक रूप ‘भोर को उठकर सिखाना’ यिर्मयाह में तत्पर, निरंतर और बारंबार कार्य का मुहावरा है। मुख्य पाठ में उसका स्वाभाविक हिन्दी अर्थ दिया गया है और मूल बिंब पादटिप्पणी में सुरक्षित है।
- source_word: וְאֵינָם שֹׁמְעִים
  choice: फिर भी उन्होंने ... मेरी बात नहीं सुनी
  rationale: यह केवल सुनाई न देने की बात नहीं, बल्कि लगातार अनसुना करने अथवा मानने से इनकार का भाव रखता है। ‘मेरी बात नहीं सुनी’ आधुनिक हिन्दी में श्रवण और आज्ञापालन, दोनों का संबंध बनाए रखता है।
- source_word: לָקַחַת מוּסָר
  choice: अनुशासन ग्रहण करने के लिए
  rationale: מוּסָר में अनुशासन, सुधार और शिक्षाप्रद ताड़ना का अर्थ-क्षेत्र है। ‘अनुशासन ग्रहण करना’ इस व्यापक रचनात्मक-सुधारात्मक भाव को रखता है; ‘सुधार स्वीकार करना’ पादटिप्पणी में विकल्प के रूप में दिया गया है।
