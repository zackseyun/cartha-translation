revisions:
- from: उन्होंने मेरी ओर अपना मुँह नहीं, बल्कि अपनी पीठ फेर दी। मैं उन्हें बड़े यत्न से बार-बार सिखाता रहा[a], फिर भी उन्होंने अनुशासन ग्रहण करने के लिए मेरी बात नहीं सुनी[b]।
  to: उन्होंने मेरी ओर अपना मुँह नहीं, बल्कि अपनी पीठ की। यद्यपि मैं भोर को उठकर उन्हें सिखाता रहा[a], फिर भी वे सुधार स्वीकार करने के लिए सुनने को तैयार नहीं थे[b]।
  rationale: The revision keeps the Hebrew bodily contrast explicit, retains the source image of rising early while explaining its idiomatic force in a footnote, and renders the final clause as an ongoing, volitional refusal to receive correction. It does not introduce interpretive or denominational claims.
