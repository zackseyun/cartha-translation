  text: וְ/נָתַתִּ֨י לָ/הֶ֜ם לֵ֤ב אֶחָד֙ וְ/דֶ֣רֶךְ אֶחָ֔ד לְ/יִרְאָ֥ה אוֹתִ֖/י כָּל הַ/יָּמִ֑ים לְ/ט֣וֹב לָ/הֶ֔ם וְ/לִ/בְנֵי/הֶ֖ם אַחֲרֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/039.yaml
  text: And I will give them one heart and one way[a], so that they may fear me all their days[b], for their good and for the good of their children after them.
translation:
  language: hi
  text: और मैं उन्हें एक ही मन और एक ही मार्ग[a] दूँगा, ताकि वे जीवन भर[b] मेरा भय मानें—उनके और उनके बाद उनकी सन्तानों के भले के लिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “एक ही जीवन-मार्ग।” इब्रानी शब्द का शाब्दिक अर्थ “मार्ग” है और यह जीवन जीने के ढंग को भी दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “सब दिनों।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: और मैं ... दूँगा
  rationale: संयोजक के साथ प्रथम पुरुष एकवचन कालरूप यहाँ भविष्य की नबूवतपूर्ण प्रतिज्ञा व्यक्त करता है; 'दूँगा' נתן का सीधा और स्वाभाविक अर्थ है।
- source_word: לֵב אֶחָד
  choice: एक ही मन
  rationale: हिन्दी में 'मन' आन्तरिक प्रवृत्ति, इच्छा और निष्ठा के लिए स्वाभाविक है। 'एक ही' मूल के 'एक' रूपक को बनाए रखता है और सामुदायिक एकता तथा अखण्ड निष्ठा—दोनों सम्भावनाएँ खुली रखता है।
- source_word: וְדֶרֶךְ אֶחָד
  choice: और एक ही मार्ग
  rationale: דרך का शाब्दिक और रूपकात्मक अर्थ 'मार्ग' है; यहाँ यह जीवन-रीति का संकेत दे सकता है, पर मुख्य पाठ रूपक को बिना संकुचित किए सुरक्षित रखता है।
- source_word: לְיִרְאָה אוֹתִי
  choice: ताकि वे ... मेरा भय मानें
  rationale: לְ के साथ infinitive उद्देश्य बताता है। 'मेरा भय मानें' आधुनिक बाइबलीय हिन्दी में परमेश्वर के प्रति श्रद्धापूर्ण भय को व्यक्त करता है और मूल पद को केवल 'आदर' में हल्का नहीं करता।
- source_word: כָּל הַיָּמִים
  choice: जीवन भर
  rationale: शाब्दिक अर्थ 'सब दिनों' है; प्रसंग में निरन्तर जीवनकाल का भाव है। 'जीवन भर' सहज हिन्दी है, जबकि पादटिप्पणी अधिक शाब्दिक रूप देती है।
- source_word: לְטוֹב לָהֶם וְלִבְנֵיהֶם אַחֲרֵיהֶם
  choice: इससे उनका और उनके बाद उनकी सन्तानों का भला होगा
  rationale: לְטוֹב का लाभार्थक भाव सहज हिन्दी में 'भला होगा' से व्यक्त होता है। वही लाभ अगली पीढ़ी तक जाता है; 'सन्तानों' से בנים का पीढ़ीगत आशय स्पष्ट होता है।
theological_decisions:
- issue: '''एक ही मन और एक ही मार्ग'' का आशय'
  choice: शाब्दिक रूपकों को बनाए रखा गया है, जो एकीकृत आन्तरिक प्रवृत्ति और साझा जीवन-रीति दोनों को समेट सकते हैं।
  alternative: इसे केवल सामुदायिक एकता या केवल व्यक्ति की अखण्ड भक्ति के रूप में स्पष्ट करना।
  rationale: इब्रानी अभिव्यक्ति दोनों आयामों की सम्भावना रखती है; अनुवाद किसी एक व्याख्या को अनावश्यक रूप से निर्णायक नहीं बनाता।
- issue: '''मेरा भय मानें'' का भाव'
  choice: वाचा के सम्बन्ध में परमेश्वर के प्रति श्रद्धापूर्ण भय, जो आज्ञाकारिता से जुड़ा है।
  alternative: केवल आतंक या डर; अथवा केवल सम्मान।
  rationale: प्रसंग पुनर्स्थापना और स्थायी भलाई का है। फिर भी ירא की वास्तविक गम्भीरता बनाए रखने के लिए 'भय' को मुख्य पाठ में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। 'एक ही मन' और 'एक ही मार्ग' मूल की समानान्तर संरचना तथा अर्थगत खुलापन बचाते हैं। 'सन्तानों' की वर्तनी औपचारिक आधुनिक हिन्दी के अनुरूप है।
