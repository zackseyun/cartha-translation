id: JER.32.4
reference: Jeremiah 32:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/צִדְקִיָּ֨הוּ֙ מֶ֣לֶךְ יְהוּדָ֔ה לֹ֥א יִמָּלֵ֖ט מִ/יַּ֣ד הַ/כַּשְׂדִּ֑ים כִּ֣י הִנָּתֹ֤ן יִנָּתֵן֙ בְּ/יַ֣ד מֶֽלֶךְ בָּבֶ֔ל וְ/דִבֶּר פִּ֣י/ו עִם פִּ֔י/ו וְ/עֵינָ֖י/ו אֶת עינ/ו תִּרְאֶֽינָה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/004.yaml
  text: And Zedekiah king of Judah will not escape from the hand of the Chaldeans[a], for he will surely be given into the hand of the king of Babylon, and he will speak mouth to mouth with him[b], and his eyes will see his eyes.
translation:
  language: hi
  text: और यहूदा का राजा सिदकिय्याह कसदियों के हाथ से नहीं बचेगा, क्योंकि वह निश्चय ही बाबुल के राजा के हाथ में सौंप दिया जाएगा। वह उससे आमने-सामने बात करेगा,[a] और अपनी आँखों से उसे देखेगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसका मुँह उसके मुँह से बात करेगा”; अर्थात दोनों की सीधी व्यक्तिगत भेंट होगी।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उसकी आँखें उसकी आँखों को देखेंगी”; अर्थात वह उसे प्रत्यक्ष, आँखों-आँखों में देखेगा।
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמָּלֵט
  choice: नहीं बचेगा
  rationale: निफ़ाल रूप यहाँ शत्रु के अधिकार से बच निकलने का अर्थ देता है। ‘नहीं बचेगा’ आधुनिक हिन्दी में स्वाभाविक और प्रसंगानुकूल है।
- source_word: מִיַּד הַכַּשְׂדִּים
  choice: कसदियों के हाथ से
  rationale: ‘हाथ’ के इब्रानी बिंब को हिन्दी में रखा गया है, जहाँ यह अधिकार या पकड़ का अर्थ भी सहजता से देता है। ‘कसदी’ मूल पाठ की विशिष्ट जातीय-राजनीतिक संज्ञा को बनाए रखता है।
- source_word: הִנָּתֹן יִנָּתֵן
  choice: निश्चय ही ... सौंप दिया जाएगा
  rationale: क्रिया के साथ infinitive absolute कथन की निश्चितता पर बल देता है। ‘निश्चय ही’ उस बल को और ‘सौंप दिया जाएगा’ मूल के कर्मवाच्य तथा बंदी बनाए जाने के प्रसंग को व्यक्त करता है।
- source_word: בְּיַד מֶלֶךְ בָּבֶל
  choice: बाबुल के राजा के हाथ में
  rationale: मूल का ‘हाथ में’ वाला ठोस बिंब बनाए रखा गया है; यहाँ इसका आशय राजा के अधिकार में किया जाना है।
- source_word: וְדִבֶּר פִּיו עִם פִּיו
  choice: वह उससे आमने-सामने बात करेगा
  rationale: शाब्दिक रचना ‘उसका मुँह उसके मुँह से बात करेगा’ प्रत्यक्ष व्यक्तिगत भेंट का मुहावरा है। हिन्दी में ‘आमने-सामने’ अर्थ और गरिमा को स्वाभाविक रूप से व्यक्त करता है; अधिक शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: וְעֵינָיו אֶת־עֵינוֹ תִּרְאֶינָה
  choice: अपनी आँखों से उसे देखेगा
  rationale: मूल का शाब्दिक चित्र ‘उसकी आँखें उसकी आँखों को देखेंगी’ प्रत्यक्ष दर्शन पर बल देता है। मुख्य पाठ में स्वाभाविक हिन्दी रखी गई है और ठोस मूल अभिव्यक्ति पादटिप्पणी में सुरक्षित है।
- source_word: צִדְקִיָּהוּ
  choice: सिदकिय्याह
  rationale: हिन्दी बाइबल परंपरा में प्रचलित नाम-रूप अपनाया गया है।
- source_word: הַכַּשְׂדִּים
  choice: कसदी
  rationale: इब्रानी की विशिष्ट संज्ञा को ‘बाबुलवासी’ में समतल करने के बजाय बनाए रखा गया है।
