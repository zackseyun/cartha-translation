  text: וַ/יָּבֹ֜אוּ וַ/יִּֽרְשׁ֣וּ אֹתָ֗/הּ וְ/לֹֽא שָׁמְע֤וּ בְ/קוֹלֶ֨/ךָ֙ ו/ב/תרות/ך לֹא הָלָ֔כוּ אֵת֩ כָּל אֲשֶׁ֨ר צִוִּ֧יתָה לָ/הֶ֛ם לַ/עֲשׂ֖וֹת לֹ֣א עָשׂ֑וּ וַ/תַּקְרֵ֣א אֹתָ֔/ם אֵ֥ת כָּל הָ/רָעָ֖ה הַ/זֹּֽאת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/023.yaml
  text: They came in and took possession of it[a], but they did not listen to your voice, and they did not walk in your law. They did not do all that you commanded them to do[b], and you brought upon them all this disaster.
translation:
  language: hi
  text: वे उस देश में आए और उसे अपने अधिकार में ले लिया। फिर भी उन्होंने आपकी बात नहीं मानी और न आपकी व्यवस्था[a] के अनुसार चले। आपने उन्हें जो कुछ करने की आज्ञा दी थी, वह उन्होंने नहीं किया; और आपने उन पर यह सारी विपत्ति[b] ला दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आपकी शिक्षा।” इब्रानी शब्द ‘तोरा’ का अर्थ “व्यवस्था” या “शिक्षा” हो सकता है; यहाँ वह परमेश्वर की वाचागत शिक्षा को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “आपने उन पर यह सारी विपत्ति बुलाई।” यह इब्रानी मुहावरा उन पर न्यायस्वरूप विपत्ति लाने का भाव देता है।
    reason: idiom
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: वे उसमें आए
  rationale: בוא यहाँ प्रतिज्ञात देश में प्रवेश को बताता है। स्त्रीलिंग प्रत्यय का संबंध पूर्ववर्ती ‘देश’ से है, इसलिए ‘उसमें’ स्वाभाविक है।
- source_word: וַיִּרְשׁוּ אֹתָהּ
  choice: उस पर अधिकार कर लिया
  rationale: भूमि के संदर्भ में ירשׁ का अर्थ उसे अपने अधिकार में लेना या उसका अधिकारी होना है; यह केवल कानूनी विरासत का भाव नहीं देता।
- source_word: וְלֹא שָׁמְעוּ בְקוֹלֶךָ
  choice: उन्होंने आपकी बात नहीं मानी
  rationale: शाब्दिक रूप ‘आपकी आवाज़ नहीं सुनी’ है, पर इस इब्रानी मुहावरे में आशय आज्ञापालन न करने से है। आधुनिक हिन्दी में ‘बात नहीं मानी’ वही संबंधपरक और आज्ञात्मक अर्थ स्पष्ट करता है।
- source_word: וּבְתוֹרָתְךָ לֹא הָלָכוּ
  choice: आपकी व्यवस्था के अनुसार नहीं चले
  rationale: הלך और ב के साथ תורה जीवन-आचरण को परमेश्वर की शिक्षा के अनुरूप रखने का मुहावरा है। ‘के अनुसार चले’ चलने के रूपक को रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: תּוֹרָה
  choice: व्यवस्था
  rationale: वाचा के इस संदर्भ में תורה परमेश्वर द्वारा दी गई बाध्यकारी शिक्षा को दर्शाता है। ‘व्यवस्था’ स्थापित धार्मिक-कानूनी अर्थ देता है, जबकि ‘शिक्षा’ वैध वैकल्पिक अर्थ है और पादटिप्पणी में रखा गया है।
- source_word: אֵת כָּל אֲשֶׁר צִוִּיתָה לָהֶם לַעֲשׂוֹת לֹא עָשׂוּ
  choice: आपने उन्हें जो कुछ करने की आज्ञा दी थी, वह उन्होंने नहीं किया
  rationale: यह अनुवाद כָּל की व्यापकता और צוה/עשה के आज्ञा तथा पालन संबंध को सहज हिन्दी में बनाए रखता है।
- source_word: וַתַּקְרֵא אֹתָם אֵת כָּל הָרָעָה הַזֹּאת
  choice: इसलिए आपने उन पर यह सारी विपत्ति ला दी
  rationale: यहाँ קרא का दोहरे कर्म वाला प्रयोग किसी विपत्ति को लोगों पर बुलाने या ले आने का मुहावरा है। ‘ला दी’ परिणाम को स्पष्ट करता है; ‘इसलिए’ पूर्ववर्ती अवज्ञा और न्याय के संबंध को व्यक्त करता है।
- source_word: הָרָעָה
  choice: विपत्ति
  rationale: न्याय के इस संदर्भ में רעה नैतिक बुराई नहीं, बल्कि हानिकारक आपदा या संकट को दर्शाता है। ‘विपत्ति’ इस अर्थ को गरिमापूर्ण और स्पष्ट हिन्दी में देता है।
theological_decisions:
- issue: वाचा के संदर्भ में תּוֹרָה का अनुवाद
  choice: आपकी व्यवस्था
  alternative: आपकी शिक्षा
  rationale: यह पद देश में इस्राएल के वाचागत दायित्वों को याद करता है। ‘व्यवस्था’ उसके बाध्यकारी स्वरूप को व्यक्त करती है, पर תורה के व्यापक शिक्षात्मक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: ईश्वरीय न्याय के संदर्भ में הָרָעָה का अनुवाद
  choice: विपत्ति
  alternative: अनिष्ट / बुराई
  rationale: संदर्भ में शब्द का अर्थ लोगों पर आया विनाशकारी न्याय है, नैतिक बुराई नहीं। ‘विपत्ति’ इस भेद को बिना ईश्वरीय कारणता हटाए स्पष्ट रखती है।
- issue: विपत्ति लाने में परमेश्वर की सक्रियता
  choice: आपने उन पर ... ला दी
  alternative: उन पर ... आने दी
  rationale: इब्रानी वाक्य परमेश्वर को क्रिया का कर्ता बनाता है। ‘आने दी’ केवल अनुमति का अर्थ जोड़ सकती है, इसलिए सक्रिय रूप रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सम्मानसूचक ‘आप’ का प्रयोग किया गया है। भाषा प्रार्थनात्मक और गरिमापूर्ण है, पर अनावश्यक संस्कृतनिष्ठता से बचती है। ‘के अनुसार चले’ इब्रानी के चलने वाले रूपक को स्वाभाविक हिन्दी में बनाए रखता है।
