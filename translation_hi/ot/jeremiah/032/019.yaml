id: JER.32.19
reference: Jeremiah 32:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: גְּדֹל֙ הָֽ/עֵצָ֔ה וְ/רַ֖ב הָ/עֲלִֽילִיָּ֑ה אֲשֶׁר עֵינֶ֣י/ךָ פְקֻח֗וֹת עַל כָּל דַּרְכֵי֙ בְּנֵ֣י אָדָ֔ם לָ/תֵ֤ת לְ/אִישׁ֙ כִּ/דְרָכָ֔י/ו וְ/כִ/פְרִ֖י מַעֲלָלָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/019.yaml
  text: great in counsel and mighty in deed[a], whose eyes are open upon all the ways of the sons of man, to give to each man according to his ways and according to the fruit of his deeds.
translation:
  language: hi
  text: तू परामर्श में महान और कार्य में सामर्थी है[a]; तेरी आँखें मनुष्यों के सब मार्गों पर खुली हैं, ताकि तू हर एक को उसके मार्गों के अनुसार और उसके कामों के फल के अनुसार दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “योजना में महान और कार्य में प्रबल।”
    reason: עֵצָה का अर्थ ‘परामर्श’ के साथ ‘योजना’ या ‘उद्देश्य’ भी हो सकता है, और רַב הָעֲלִילִיָּה प्रभावशाली अथवा प्रबल कार्य को सूचित करता है।
lexical_decisions:
- source_word: גְּדֹל הָעֵצָה
  choice: परामर्श में महान
  rationale: עֵצָה में परामर्श, योजना और उद्देश्य के अर्थ समाए हैं। ‘परामर्श’ परमेश्वर की बुद्धिमत्ता और सोची-समझी मंशा दोनों को बनाए रखता है।
- source_word: רַב הָעֲלִילִיָּה
  choice: कार्य करने में सामर्थी
  rationale: यह पदबंध प्रभावशाली क्रिया या कार्य-सिद्धि को दर्शाता है। यह हिन्दी में स्वाभाविक है और केवल कार्यों की संख्या का अर्थ नहीं देता।
- source_word: עֵינֶיךָ פְקֻחוֹת
  choice: तेरी आँखें ... खुली रहती हैं
  rationale: मूल के सजीव मानवरूपी बिंब को अमूर्त ‘तू सब कुछ देखता है’ में बदले बिना सुरक्षित रखा गया है।
- source_word: עַל כָּל דַּרְכֵי בְּנֵי אָדָם
  choice: मनुष्यों के सभी मार्गों पर
  rationale: בְּנֵי אָדָם मानवजाति के लिए सामूहिक इब्रानी अभिव्यक्ति है। आधुनिक हिन्दी में ‘मनुष्यों’ उसका अर्थ स्वाभाविक और स्पष्ट रूप से देता है; ‘मार्ग’ जीवन-चर्या का रूपक बनाए रखता है।
- source_word: לָתֵת לְאִישׁ
  choice: हर एक को ... दे
  rationale: אִישׁ यहाँ वितरणात्मक एकवचन है। ‘हर एक’ किसी भी व्यक्ति को सूचित करता है और हिन्दी में व्याकरणिक लिंग को अनावश्यक रूप से सीमित नहीं करता।
- source_word: כִּדְרָכָיו
  choice: उसके चालचलन के अनुसार
  rationale: पहले आए व्यापक ‘मार्गों’ के रूपक को समझाते हुए यहाँ व्यक्ति की जीवन-पद्धति और नैतिक आचरण का भाव स्पष्ट किया गया है।
- source_word: וְכִפְרִי מַעֲלָלָיו
  choice: उसके कामों के फल के अनुसार
  rationale: ‘फल’ मूल का परिणाम-सूचक रूपक सुरक्षित रखता है, जबकि ‘काम’ מַעֲלָלִים के नैतिक अर्थ वाले कर्मों को सरल आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर की सर्वदृष्टि के लिए मानवरूपी भाषा
  choice: ‘तेरी आँखें ... खुली रहती हैं’ का मूर्त बिंब बनाए रखा
  alternative: ‘तू सबके मार्ग देखता है’
  rationale: मूल पाठ शारीरिक बिंब द्वारा परमेश्वर की पूर्ण जागरूकता व्यक्त करता है; इसे अमूर्त करना साहित्यिक शक्ति घटाता।
- issue: मानव समुदाय के लिए पुल्लिंग इब्रानी अभिव्यक्ति
  choice: בְּנֵי אָדָם का अर्थ ‘मनुष्यों’ और אִישׁ का वितरणात्मक अर्थ ‘हर एक’ किया
  alternative: ‘मनुष्य के पुत्रों’ और ‘हर पुरुष’
  rationale: ये पद संदर्भ में केवल पुरुषों को नहीं, समस्त मानव समुदाय और प्रत्येक व्यक्ति को सूचित करते हैं। हिन्दी में अक्षरशः पुल्लिंग रूप अर्थ को अनावश्यक रूप से संकुचित कर सकता था।
- issue: कर्मानुसार प्रतिफल
  choice: तटस्थ क्रिया ‘दे’ और ‘के अनुसार’ बनाए रखे
  alternative: ‘बदला दे’ या ‘प्रतिफल चुकाए’
  rationale: मूल לָתֵת व्यापक ‘देना’ है और यह पद स्वयं प्रतिफल के शुभ या दंडात्मक स्वरूप को निर्दिष्ट नहीं करता; इसलिए अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य-पाठक-सुलभ शैली। प्रार्थना के प्रत्यक्ष संबोधन के अनुरूप ‘तेरी/तू’ रखा गया है। अर्धविराम पद की वर्णनात्मक पहली पंक्ति को आगे के प्रत्यक्ष संबोधन से जोड़ता है।
