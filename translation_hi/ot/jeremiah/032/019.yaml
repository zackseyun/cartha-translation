revisions:
- from: जो परामर्श में महान और कार्य करने में सामर्थी है[a]; तेरी आँखें मनुष्यों के सभी मार्गों पर खुली रहती हैं, ताकि तू हर एक को उसके चालचलन और उसके कामों के फल के अनुसार दे।
  to: तू परामर्श में महान और कार्य में सामर्थी है[a]; तेरी आँखें मनुष्यों के सब मार्गों पर खुली हैं, ताकि तू हर एक को उसके मार्गों के अनुसार और उसके कामों के फल के अनुसार दे।
  rationale: The revision repairs the direct-address syntax required by the Hebrew and by the prayer context. It retains the anthropomorphic image of God’s open eyes and restores “मार्गों” for the repeated Hebrew term, preserving its plural form, metaphor, and lexical linkage. The wording remains nonsectarian and does not specify whether the giving is reward or punishment.
  reviewer_model: gpt-5.6-terra
