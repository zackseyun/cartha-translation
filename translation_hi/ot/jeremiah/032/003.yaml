id: JER.32.3
reference: Jeremiah 32:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אֲשֶׁ֣ר כְּלָא֔/וֹ צִדְקִיָּ֥הוּ מֶֽלֶךְ יְהוּדָ֖ה לֵ/אמֹ֑ר מַדּוּעַ֩ אַתָּ֨ה נִבָּ֜א לֵ/אמֹ֗ר כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִ֨י נֹתֵ֜ן אֶת הָ/עִ֥יר הַ/זֹּ֛את בְּ/יַ֥ד מֶֽלֶךְ בָּבֶ֖ל וּ/לְכָדָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/003.yaml
  text: 'because Zedekiah king of Judah had confined him[a], saying, “Why do you prophesy, saying, ‘Thus says Yahweh: Behold, I am giving this city into the hand of the king of Babylon, and he will capture it’?”'
translation:
  language: hi
  text: 'क्योंकि यहूदा के राजा सिदकिय्याह ने उसे बंदी बना रखा था[a] और कहा था, “तुम भविष्यवाणी क्यों करते हो: ‘याहवे यों कहता है—देखो, मैं इस नगर को बाबेल के राजा के हाथ में दे रहा हूँ, और वह इसे जीत लेगा’?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे कैद कर रखा था” अथवा “उसे बंद कर रखा था।”
    reason: כלא में बंद करने, रोककर रखने और कैद करने—इन निकट अर्थों की गुंजाइश है।
lexical_decisions:
- source_word: אֲשֶׁר
  choice: क्योंकि
  rationale: यहाँ यह संबंधवाचक अव्यय पिछले पद में बताई गई यिर्मयाह की बंदी अवस्था का कारण प्रस्तुत करता है; इसलिए हिन्दी में कारणसूचक ‘क्योंकि’ स्वाभाविक है।
- source_word: כְּלָאוֹ
  choice: उसे बंदी बना रखा था
  rationale: क्रिया का अर्थ रोककर रखना, बंद करना या कैद करना है। यह चयन हिरासत के भाव और पूर्व में आरम्भ हुई जारी अवस्था—दोनों को व्यक्त करता है।
- source_word: מַדּוּעַ אַתָּה נִבָּא
  choice: तुम यह भविष्यवाणी क्यों करते हो
  rationale: यह राजा का सीधा प्रश्न है। ‘भविष्यवाणी करते हो’ निफ़अल क्रिया נבא का स्पष्ट और प्रचलित हिन्दी रूप है।
- source_word: כֹּה אָמַר יְהוָה
  choice: याहवे यों कहता है
  rationale: ‘यों कहता है’ भविष्यद्वक्ता के संदेशवाहक-सूत्र को बनाए रखता है, और יְהוָה को उसके व्यक्तिगत नाम ‘याहवे’ के रूप में प्रस्तुत किया गया है।
- source_word: הִנְנִי נֹתֵן
  choice: देखो, मैं ... दे रहा हूँ
  rationale: ‘देखो’ कथन की गंभीर तात्कालिकता पर ध्यान खींचता है; वर्तमान कृदंत को ‘दे रहा हूँ’ कहना आसन्न और निश्चित दिव्य कार्य की सजीवता बनाए रखता है।
- source_word: בְּיַד
  choice: के हाथ में
  rationale: मूल इब्रानी बिंब को सुरक्षित रखते हुए यह किसी के अधिकार में सौंपे जाने का अर्थ सहज हिन्दी में व्यक्त करता है।
- source_word: וּלְכָדָהּ
  choice: और वह इसे जीत लेगा
  rationale: लכד किसी नगर को सैन्य बल से जीतने या अधिकार में लेने के लिए प्रयुक्त है। एकवचन पुल्लिंग कर्ता स्वाभाविक रूप से बाबेल का राजा है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत दिव्य नाम सीधे आया है। ‘याहवे’ उसका लिप्यंतरण करता है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: ‘मैं दे रहा हूँ’ में समय और निश्चितता
  choice: वर्तमान प्रगतिशील रूप
  alternative: मैं देने वाला हूँ; मैं दे दूँगा
  rationale: इब्रानी कृदंत आसन्न अथवा निश्चित कार्य को वर्तमान की सजीवता के साथ व्यक्त करता है। हिन्दी ‘दे रहा हूँ’ इस भविष्यसूचक तनाव को भविष्यकाल में समतल किए बिना बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। राजा के एकवचन संबोधन के लिए अत्यधिक कठोर ‘तू’ के बजाय तटस्थ आधुनिक ‘तुम’ चुना गया है। ‘बाबेल’ मूल स्थान-नाम के निकट है और ‘यों कहता है’ भविष्यद्वक्ताओं के औपचारिक संदेश-सूत्र की गंभीरता बनाए रखता है।
