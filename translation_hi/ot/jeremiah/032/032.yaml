source:
  edition: WLC
  text: עַל֩ כָּל רָעַ֨ת בְּנֵֽי יִשְׂרָאֵ֜ל וּ/בְנֵ֣י יְהוּדָ֗ה אֲשֶׁ֤ר עָשׂוּ֙ לְ/הַכְעִסֵ֔/נִי הֵ֤מָּה מַלְכֵי/הֶם֙ שָֽׂרֵי/הֶ֔ם כֹּהֲנֵי/הֶ֖ם וּ/נְבִֽיאֵי/הֶ֑ם וְ/אִ֣ישׁ יְהוּדָ֔ה וְ/יֹשְׁבֵ֖י יְרוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/032.yaml
  text: because of all the evil of the sons of Israel and the sons of Judah that they did to provoke me to anger—they[a], their kings, their officials, their priests, and their prophets[c][b], and the men of Judah and the inhabitants of Jerusalem.
translation:
  language: hi
  text: इस्राएल के पुत्रों और यहूदा के पुत्रों[a] की उस सारी बुराई के कारण, जो उन्होंने मुझे क्रोध दिलाने के लिए[b] की थी—अर्थात् वे स्वयं, उनके राजा, उनके अधिकारी, उनके याजक, उनके नबी, यहूदा के पुरुष[c] और यरूशलेम के निवासी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस्राएल के लोगों और यहूदा के लोगों।” हिब्रू में शाब्दिक रूप से “इस्राएल के पुत्रों और यहूदा के पुत्रों” है।
    reason: lexical_alternative
  - marker: b
    text: या “मुझे क्रोधित करने के लिए।”
    reason: lexical_alternative
  - marker: c
    text: या “यहूदा के प्रत्येक पुरुष।” हिब्रू में “पुरुष” एकवचन है, जिसका प्रयोग यहाँ सामूहिक रूप में हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כָּל רָעַת
  choice: उस सारी बुराई के कारण
  rationale: עַל यहाँ पिछले पद से चले आ रहे न्याय का कारण बताता है, और רָעָה इस प्रसंग में नैतिक बुराई को व्यक्त करता है।
- source_word: בְּנֵי יִשְׂרָאֵל וּבְנֵי יְהוּדָה
  choice: इस्राएल के पुत्रों और यहूदा के पुत्रों
  rationale: यह रूप हिब्रू के ‘पुत्रों’ वाले सामूहिक और प्रतिनिधिक पुरुषवाचक प्रयोग को पारदर्शी ढंग से सुरक्षित रखता है; अधिक स्वाभाविक विकल्प पादटिप्पणी में दिया गया है।
- source_word: אֲשֶׁר עָשׂוּ
  choice: जो उन्होंने ... की थी
  rationale: सरल संबंधवाचक उपवाक्य और עשה की सामान्य क्रिया को बनाए रखता है; हिन्दी में ‘बुराई’ के साथ स्त्रीलिंग क्रिया स्वाभाविक है।
- source_word: לְהַכְעִסֵנִי
  choice: मुझे क्रोध दिलाने के लिए
  rationale: כעס के हिफ़ील रूप की कारणवाचक शक्ति को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הֵמָּה
  choice: उन्होंने स्वयं
  rationale: स्वतंत्र सर्वनाम का बल बनाए रखता है और इसके बाद आने वाली उत्तरदायी श्रेणियों की सूची का परिचय देता है।
- source_word: מַלְכֵיהֶם שָׂרֵיהֶם כֹּהֲנֵיהֶם וּנְבִיאֵיהֶם
  choice: उनके राजाओं, उनके अधिकारियों, उनके याजकों और उनके नबियों ने
  rationale: सभी पदों और संबंधसूचक प्रत्ययों का सीधा अनुवाद है; שָׂרִים के लिए आधुनिक प्रशासनिक अर्थ वाला ‘अधिकारी’ चुना गया है।
- source_word: וְאִישׁ יְהוּדָה
  choice: और यहूदा के पुरुषों
  rationale: एकवचन אִישׁ के सामूहिक अथवा वितरणात्मक बल को पुरुषवाचक रूप में बनाए रखता है, बिना उसे केवल एक व्यक्ति तक सीमित किए।
- source_word: וְיֹשְׁבֵי יְרוּשָׁלִָם
  choice: तथा यरूशलेम के निवासियों
  rationale: निवास करने वालों को सूचित करने वाले कृदन्त पद का स्वाभाविक सामूहिक अनुवाद है।
theological_decisions:
- issue: בני और איש में पुरुषवाचक सामूहिक भाषा
  choice: ‘पुत्रों’ और ‘पुरुषों’ के द्वारा स्रोत की पुरुषवाचक सामूहिक अभिव्यक्ति को बनाए रखना
  alternative: ‘इस्राएल और यहूदा के लोग’ तथा ‘यहूदा के लोग’
  rationale: हिब्रू रूप प्रतिनिधिक सामूहिक अर्थ रखते हुए भी स्पष्ट रूप से पुरुषवाचक हैं। मुख्य पाठ स्रोत-रूप को सुरक्षित रखता है, जबकि सामान्य सामूहिक अर्थ पादटिप्पणियों में स्पष्ट किया गया है।
- issue: לְהַכְעִסֵנִי में कारणवाचकता और परमेश्वर का क्रोध
  choice: ‘मुझे क्रोध दिलाने के लिए’
  alternative: ‘मुझे क्रोधित करने के लिए’ अथवा ‘मुझे उकसाने के लिए’
  rationale: चुना गया रूप हिफ़ील की कारणवाचकता और क्रोध की स्पष्ट धारणा दोनों को बनाए रखता है; यह इस प्रश्न को नहीं सुलझाता कि अपराधियों का सचेत उद्देश्य था या उनके आचरण का परिणाम।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और स्रोत के निकट रखी गई है। पद पिछले वाक्य पर निर्भर कारणसूचक खंड है, इसलिए उसकी खंडात्मक संरचना सुरक्षित है। दीर्घ सूची को स्पष्ट करने के लिए दीर्घ विराम-चिह्न का प्रयोग किया गया है।
