  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הַ/דָּבָ֞ר אֲשֶׁר הָיָ֤ה אֶֽל יִרְמְיָ֨הוּ֙ מֵ/אֵ֣ת יְהוָ֔ה ב/שנת הָ/עֲשִׂרִ֔ית לְ/צִדְקִיָּ֖הוּ מֶ֣לֶךְ יְהוּדָ֑ה הִ֧יא הַ/שָּׁנָ֛ה שְׁמֹנֶֽה עֶשְׂרֵ֥ה שָׁנָ֖ה לִ/נְבֽוּכַדְרֶאצַּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/001.yaml
  text: The word that came to Jeremiah from Yahweh in the tenth year of Zedekiah king of Judah[a], which was the eighteenth year of Nebuchadnezzar.
translation:
  language: hi
  text: यह वह वचन है जो यहूदा के राजा सिदकिय्याह के राज्यकाल के दसवें वर्ष में याहवे[a] की ओर से यिर्मयाह के पास आया। वह नबूकदरेस्सर के राज्यकाल का अठारहवाँ वर्ष था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ईश्वरीय नाम का पारंपरिक हिंदी रूप “यहोवा” भी है; अनेक अनुवाद यहाँ “प्रभु” लिखते हैं।
    reason: ईश्वरीय नाम יְהוָה के वैकल्पिक पारंपरिक निरूपण बताने के लिए।
lexical_decisions:
- source_word: הַדָּבָר
  choice: वचन
  rationale: भविष्यवाणी के आरंभिक सूत्र में यह शब्द परमेश्वर से प्राप्त संदेश को दर्शाता है। ‘वचन’ इस पारंपरिक अर्थ को बनाए रखता है और अनावश्यक व्याख्या नहीं जोड़ता।
- source_word: אֲשֶׁר הָיָה אֶל
  choice: जो … के पास आया
  rationale: यह भविष्यवाणी-साहित्य का प्रचलित इब्रानी मुहावरा है; हिंदी में यह स्वाभाविक रूप से संदेश के भविष्यद्वक्ता को प्राप्त होने का भाव व्यक्त करता है।
- source_word: מֵאֵת יְהוָה
  choice: याहवे की ओर से
  rationale: מֵאֵת संदेश के स्रोत को सूचित करता है, और יְהוָה को व्यक्तिगत वाचा-नाम ‘याहवे’ के रूप में रखा गया है।
- source_word: בשנת הָעֲשִׂרִית לְצִדְקִיָּהוּ
  choice: सिदकिय्याह के राज्यकाल के दसवें वर्ष में
  rationale: राजकीय कालगणना को स्पष्ट और स्वाभाविक हिंदी में व्यक्त करने के लिए ‘राज्यकाल’ जोड़ा गया है; इससे इसे राजा की आयु समझने की संभावना नहीं रहती।
- source_word: מֶלֶךְ יְהוּדָה
  choice: यहूदा के राजा
  rationale: राजकीय उपाधि और क्षेत्र का सीधा, स्वाभाविक हिंदी रूप।
- source_word: הִיא הַשָּׁנָה שְׁמֹנֶה עֶשְׂרֵה שָׁנָה
  choice: वह … अठारहवाँ वर्ष था
  rationale: स्त्रीलिंग सर्वनाम पिछले ‘वर्ष’ की ओर संकेत करके दोनों राजकीय कालगणनाओं की समानता बताता है; अलग वाक्य हिंदी में स्पष्ट और सहज है।
- source_word: לִנְבוּכַדְרֶאצַּר
  choice: नबूकदरेस्सर के राज्यकाल का
  rationale: इस पाठ में नाम के נְבוּכַדְרֶאצַּר रूप को ‘नबूकदरेस्सर’ से दर्शाया गया है। कालगणना के संदर्भ में לְ को स्वाभाविक हिंदी में ‘के राज्यकाल का’ कहा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरीय व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वतापूर्ण लिप्यंतरण है और नाम को सामान्य उपाधि में बदलने से बचाता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। भविष्यवाणी-संबंधी पारंपरिक पद ‘वचन’ को बनाए रखते हुए राजकीय कालगणना को ‘राज्यकाल’ से स्पष्ट किया गया है।
