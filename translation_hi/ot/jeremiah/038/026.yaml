  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और कथात्मक है। ‘विनती रख रहा था’ इब्रानी मुहावरे का अर्थ देता है, जबकि भूतकाल निकट अतीत की राजकीय भेंट के प्रसंग से निर्धारित है।
