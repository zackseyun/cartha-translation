  text: וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֔ם מַפִּיל אֲנִ֥י תְחִנָּתִ֖/י לִ/פְנֵ֣י הַ/מֶּ֑לֶךְ לְ/בִלְתִּ֧י הֲשִׁיבֵ֛/נִי בֵּ֥ית יְהוֹנָתָ֖ן לָ/מ֥וּת שָֽׁם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/026.yaml
  text: Then you shall say to them[a], ‘I was presenting my plea before the king, that he should not send me back to the house of Jonathan to die there.’
translation:
  language: hi
  text: तब तुम उनसे कहना, “मैं राजा के सामने अपनी विनती रख रहा था कि वह मुझे योनातान के घर वापस न भेजे, कहीं ऐसा न हो कि मैं वहीं मर जाऊँ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: तब तुम उनसे कहना
  rationale: निर्देश के क्रम को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; וְ को प्रसंगानुसार ‘तब’ और क्रिया को आज्ञार्थक भाव में रखा गया है।
- source_word: מַפִּיל אֲנִי תְחִנָּתִי לִפְנֵי הַמֶּלֶךְ
  choice: मैं राजा के सामने अपनी विनती रख रहा था
  rationale: ‘विनती को किसी के सामने गिराना’ इब्रानी मुहावरा आग्रहपूर्वक निवेदन करने को दर्शाता है। ‘विनती रख रहा था’ अर्थ और अपूर्ण/प्रगतिशील पक्ष दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: תְחִנָּתִי
  choice: अपनी विनती
  rationale: यह दया या अनुग्रह पाने के लिए किए गए earnest request को सरल, गरिमापूर्ण और प्रचलित हिन्दी में व्यक्त करता है।
- source_word: לְבִלְתִּי הֲשִׁיבֵנִי
  choice: कि वह मुझे ... वापस न भेजे
  rationale: यह विनती की विषयवस्तु/उद्देश्य व्यक्त करता है। कर्ता ‘वह’ प्रसंग में राजा है; ‘वापस न भेजे’ हिन्दी में कारक क्रिया का स्वाभाविक रूप है।
- source_word: בֵּית יְהוֹנָתָן
  choice: योनातान के घर
  rationale: निर्माण-संबंध का सीधा और स्वाभाविक अनुवाद है तथा कथा में उल्लिखित स्थान को बनाए रखता है।
- source_word: לָמוּת שָׁם
  choice: कहीं ऐसा न हो कि मैं वहीं मर जाऊँ
  rationale: स्थान पर वापस भेजे जाने के आशंकित परिणाम को स्वाभाविक हिन्दी में स्पष्ट करता है। इब्रानी में शाब्दिक रूप ‘वहाँ मरने के लिए’ है, पर प्रसंग भयभीत परिणाम का है।
