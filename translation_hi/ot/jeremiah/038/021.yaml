base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/021.yaml
  text: 'But if you refuse to go out[a], this is the word that Yahweh has shown me:'
translation:
  language: hi
  text: 'लेकिन यदि तुम बाहर जाने से इनकार करते हो, तो यह वह बात[a] है जो याहवे ने मुझे दिखाई है:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यह वह वचन है जो याहवे ने मुझे दिखाया है।”
    reason: दָּבָר का अर्थ ‘बात,’ ‘विषय,’ या ‘वचन’ हो सकता है।
lexical_decisions:
- source_word: וְאִם
  choice: लेकिन यदि
  rationale: यह पद पिछले कथन के विपरीत स्थिति प्रस्तुत करता है; इसलिए केवल ‘और यदि’ की अपेक्षा ‘लेकिन यदि’ प्रसंग के विरोधात्मक भाव को अधिक स्वाभाविक रूप से व्यक्त करता है।
- source_word: מָאֵן
  choice: इनकार करते हो
  rationale: यह क्रिया असमर्थता नहीं, बल्कि जानबूझकर मना करने या अस्वीकार करने का भाव देती है।
- source_word: לָצֵאת
  choice: बाहर जाने
  rationale: मूल अर्थ ‘बाहर जाना’ है। प्रसंग में बाबुली अधिकारियों के पास जाने का संकेत है, पर इस पद में ‘आत्मसमर्पण’ स्पष्ट रूप से नहीं कहा गया; इसलिए मूल की अभिव्यक्ति बनाए रखी गई है।
- source_word: זֶה הַדָּבָר
  choice: यह वह वचन
  rationale: דָּבָר का अर्थ ‘वचन’, ‘बात’ या ‘विषय’ हो सकता है। यहाँ ईश्वरीय प्रकाशन का परिचय होने के कारण ‘वचन’ उपयुक्त है, जबकि वैकल्पिक अर्थ पाद-टिप्पणी में रखा गया है।
- source_word: אֲשֶׁר הִרְאַנִי
  choice: जो ... ने मुझे दिखाया है
  rationale: ראה के हिफ़ील रूप में ‘दिखाना’ या ‘देखने देना’ निहित है। ‘मुझे दिखाया है’ उसके दृश्य-प्रकाशन संबंधी भाव को सीधे बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल में परमेश्वर का व्यक्तिगत नाम יהוה है; उसे किसी उपाधि से बदलने के बजाय आधुनिक हिन्दी लिप्यंतरण ‘याहवे’ द्वारा प्रस्तुत किया गया है।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पाठ में चार-अक्षरीय व्यक्तिगत नाम सीधे प्रयुक्त हुआ है। ‘याहवे’ उसे उपाधि में बदले बिना प्रस्तुत करता है; ‘यहोवा’ पारंपरिक वैकल्पिक लिप्यंतरण है और ‘प्रभु’ नाम के स्थान पर उपाधि रखता।
- issue: לָצֵאת में निहित कार्य
  choice: बाहर जाने
  alternative: आत्मसमर्पण करने
  rationale: प्रसंग आत्मसमर्पण की ओर संकेत करता है, लेकिन इस पद की इब्रानी अभिव्यक्ति केवल ‘बाहर जाने’ को स्पष्ट करती है। अनुवाद में प्रसंगगत निष्कर्ष जोड़कर अस्पष्टता को समाप्त नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण हिन्दी है। ‘तुम’ एकवचन संबोधन को दर्शाता है। वाक्य के अंत का द्विबिंदु अगले पद में आने वाले प्रकाशन की भूमिका को सुरक्षित रखता है।
