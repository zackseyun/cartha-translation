source:
  edition: WLC
  text: וַ/יִּשָּׁבַ֞ע הַ/מֶּ֧לֶךְ צִדְקִיָּ֛הוּ אֶֽל יִרְמְיָ֖הוּ בַּ/סֵּ֣תֶר לֵ/אמֹ֑ר חַי יְהוָ֞ה את אֲשֶׁר֩ עָשָׂה לָ֨/נוּ אֶת הַ/נֶּ֤פֶשׁ הַ/זֹּאת֙ אִם אֲמִיתֶ֔/ךָ וְ/אִם אֶתֶּנְ/ךָ֗ בְּ/יַד֙ הָ/אֲנָשִׁ֣ים הָ/אֵ֔לֶּה אֲשֶׁ֥ר מְבַקְשִׁ֖ים אֶת נַפְשֶֽׁ/ךָ־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/016.yaml
  text: Then King Zedekiah swore secretly to Jeremiah[a], saying, “As Yahweh lives, who made this life for us, I will not put you to death, nor will I give you into the hand of these men who are seeking your life.”
translation:
  language: hi
  text: तब राजा सिदकिय्याह ने यिर्मयाह से गुप्त रूप से शपथ खाकर कहा, “जीवित याहवे की शपथ, जिसने हमारे लिए यह जीवन बनाया है[a], न तो मैं तुम्हें मार डालूँगा, न ही तुम्हें उन लोगों के हाथ में सौंपूँगा जो तुम्हारी जान लेने के पीछे पड़े हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिसने हमें यह जीवन दिया है।” हिब्रू का अधिक शाब्दिक अर्थ है, “जिसने हमारे लिए यह जीवन/प्राण बनाया है।”
    reason: मूल वाक्यांश में עָשָׂה (“बनाया”) और נֶפֶשׁ (“जीवन/प्राण”) का असामान्य मेल है; वैकल्पिक स्वाभाविक अर्थ और शाब्दिक रूप दोनों दर्ज किए गए हैं।
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: शपथ खाकर
  rationale: यह क्रिया विधिवत शपथ लेने को व्यक्त करती है; ‘शपथ खाकर कहा’ स्वाभाविक हिंदी में कथन से इसका संबंध स्पष्ट रखता है।
- source_word: בַּסֵּתֶר
  choice: गुप्त रूप से
  rationale: यह वाक्यांश बातचीत के छिपाकर या निजी तौर पर किए जाने को दर्शाता है।
- source_word: חַי יְהוָה
  choice: जीवित यहोवा की शपथ
  rationale: यह हिब्रू की प्रचलित शपथ-विधि का अर्थपूर्ण और स्वाभाविक हिंदी रूप है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में प्रयुक्त परमेश्वर के विशिष्ट नाम को सामान्य उपाधि में बदले बिना प्रचलित हिंदी रूप में रखा गया है।
- source_word: אֵת אֲשֶׁר עָשָׂה לָנוּ אֶת הַנֶּפֶשׁ הַזֹּאת
  choice: जिसने हमारे लिए यह जीवन बनाया है
  rationale: ‘बनाया’ עָשָׂה की सृजनात्मक भाषा और ‘जीवन’ נֶפֶשׁ का प्रसंगगत अर्थ सुरक्षित रखता है; असामान्य अभिव्यक्ति की वास्तविक अस्पष्टता पाद-टिप्पणी में दी गई है।
- source_word: אִם אֲמִיתֶךָ
  choice: न तो मैं तुम्हें मरवा डालूँगा
  rationale: शपथ के बाद אִם नकारात्मक प्रतिज्ञा व्यक्त करता है। हिफ़ील रूप का कारक भाव ‘मरवा डालूँगा’ में सुरक्षित है।
- source_word: וְאִם אֶתֶּנְךָ בְּיַד
  choice: और न तुम्हें ... के हाथ में सौंपूँगा
  rationale: शपथ में निहित नकार को स्पष्ट किया गया है और ‘हाथ में देना’ रूपक को स्वाभाविक हिंदी में बनाए रखा गया है।
- source_word: מְבַקְשִׁים אֶת נַפְשֶׁךָ
  choice: तुम्हारे प्राण के खोजी हैं
  rationale: यह जान लेने की चेष्टा का हिब्रू मुहावरा है; हिंदी का परिचित बाइबलीय मुहावरा मूल की छवि और गंभीरता दोनों रखता है।
theological_decisions:
- issue: शपथ-विधि में יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: व्यक्तिगत वाचा-नाम को ‘प्रभु’ जैसी उपाधि से नहीं बदला गया। ‘यहोवा’ आधुनिक हिंदी बाइबल पाठकों में अधिक पहचाना जाने वाला रूप है, जबकि ‘याहवे’ विद्वत्तापरक वैकल्पिक लिप्यंतरण है।
- issue: אִם वाले शपथ-वाक्यों का नकारात्मक अर्थ
  choice: न तो... और न...
  alternative: यदि मैं तुम्हें मार डालूँ... और यदि तुम्हें सौंप दूँ...
  rationale: हिब्रू शपथ-विधि में दंडसूचक परिणाम लुप्त है और אִם व्यवहारतः दृढ़ निषेध व्यक्त करता है; हिंदी में शाब्दिक ‘यदि’ अधूरा और भ्रामक होता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिंदी। राजकीय शपथ की गंभीरता बनाए रखने के लिए ‘शपथ’, ‘सौंपूँगा’ और ‘प्राण के खोजी’ चुने गए हैं; अत्यधिक संस्कृतनिष्ठ भाषा से बचा गया है।
