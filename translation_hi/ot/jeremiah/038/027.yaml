base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/027.yaml
  text: Then all the officials came to Jeremiah and questioned him[a], and he told them all these words that the king had commanded. So they were silent before him, for the matter had not been heard.
translation:
  language: hi
  text: तब सभी अधिकारी यिर्मयाह के पास आए और उससे पूछताछ की। उसने उन्हें वे सारी बातें बताईं जिनकी आज्ञा राजा ने दी थी। तब वे उससे और कुछ न बोले, क्योंकि वह बात सुनी नहीं गई थी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “क्योंकि वह बात सुनी नहीं गई थी।” इसका अर्थ यह भी हो सकता है कि राजा और यिर्मयाह की बातचीत किसी अन्य व्यक्ति ने नहीं सुनी थी।
    reason: ‘बात’ के व्यापक, निष्क्रिय इब्रानी प्रयोग को मुख्य पाठ में बनाए रखते हुए प्रसंगगत ‘बातचीत’ वाला अर्थ विकल्प के रूप में दिया गया है।
lexical_decisions:
- source_word: הַשָּׂרִים
  choice: अधिकारी
  rationale: राजकीय प्रशासन के अगुओं के लिए आधुनिक और प्रसंगानुकूल शब्द; ‘हाकिम’ की अपेक्षा अधिक सहज और ‘राजकुमार’ की अपेक्षा अधिक सटीक।
- source_word: וַיִּשְׁאֲלוּ אֹתוֹ
  choice: उससे पूछताछ की
  rationale: यह साधारण प्रश्न नहीं, राजा से हुई बातचीत के विषय में जाँचपूर्ण पूछना है।
- source_word: וַיַּגֵּד לָהֶם
  choice: उसने उन्हें ... बता दीं
  rationale: हिफ़ील क्रिया का अर्थ यहाँ बातों को प्रकट करना या बता देना है; हिंदी कथा-शैली में यह स्वाभाविक है।
- source_word: כְּכָל הַדְּבָרִים הָאֵלֶּה
  choice: वे सारी बातें
  rationale: כְּ उपसर्ग के अनुरूप यिर्मयाह ने राजा द्वारा निर्देशित बातों के अनुसार उत्तर दिया; हिंदी में ‘वे सारी बातें’ वाचिक विषय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֲשֶׁר צִוָּה הַמֶּלֶךְ
  choice: जिन्हें बताने की आज्ञा राजा ने उसे दी थी
  rationale: निकटवर्ती प्रसंग के आधार पर राजा की आज्ञा का आशय उन बातों को अधिकारियों से कहना था; ‘उसे’ अर्थ में निहित कर्म को स्पष्ट करता है।
- source_word: וַיַּחֲרִשׁוּ מִמֶּנּוּ
  choice: वे उससे और कुछ न बोले
  rationale: मुहावरे का प्रसंगगत अर्थ है कि अधिकारियों ने यिर्मयाह से आगे प्रश्न करना या बोलना बंद कर दिया।
- source_word: כִּי לֹא נִשְׁמַע הַדָּבָר
  choice: क्योंकि वह बातचीत किसी ने नहीं सुनी थी
  rationale: निफ़ाल रूप अनिश्चित सुनने वाले के साथ निष्क्रिय अर्थ देता है; प्रसंग में דָּבָר राजा और यिर्मयाह की बातचीत को सूचित करता है। शाब्दिक अस्पष्टता पादटिप्पणी में सुरक्षित है।
