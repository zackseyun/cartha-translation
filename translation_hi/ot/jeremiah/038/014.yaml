  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֞ח הַ/מֶּ֣לֶךְ צִדְקִיָּ֗הוּ וַ/יִּקַּ֞ח אֶֽת יִרְמְיָ֤הוּ הַ/נָּבִיא֙ אֵלָ֔י/ו אֶל מָבוֹא֙ הַ/שְּׁלִישִׁ֔י אֲשֶׁ֖ר בְּ/בֵ֣ית יְהוָ֑ה וַ/יֹּ֨אמֶר הַ/מֶּ֜לֶךְ אֶֽל יִרְמְיָ֗הוּ שֹׁאֵ֨ל אֲנִ֤י אֹֽתְ/ךָ֙ דָּבָ֔ר אַל תְּכַחֵ֥ד מִמֶּ֖/נִּי דָּבָֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/014.yaml
  text: Then King Zedekiah sent and took Jeremiah the prophet to himself[a], to the third entrance that is in the house of Yahweh, and the king said to Jeremiah, “I am asking you something[b]; do not hide anything from me.”
translation:
  language: hi
  text: तब राजा सिदकिय्याह ने भेजकर यिर्मयाह भविष्यद्वक्ता को अपने पास, याहवे के भवन में स्थित तीसरे प्रवेश-द्वार पर बुलवाया। राजा ने यिर्मयाह से कहा, “मैं तुमसे एक बात पूछ रहा हूँ; मुझसे कुछ भी मत छिपाना।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח ... וַיִּקַּח
  choice: बुलवा भेजा और ... बुलवाया
  rationale: दोनों क्रमिक क्रियाओं का बल रखते हुए हिन्दी में यह स्पष्ट किया गया है कि राजा ने लोगों को भेजकर यिर्मयाह को अपने पास मँगवाया; शाब्दिक ‘भेजा और लिया’ इस प्रसंग में अस्वाभाविक और अस्पष्ट होता।
- source_word: יִרְמְיָהוּ הַנָּבִיא
  choice: यिर्मयाह भविष्यद्वक्ता
  rationale: नाम और पदवी दोनों को सीधे तथा प्रचलित बाइबिलीय हिन्दी में रखा गया है।
- source_word: אֵלָיו
  choice: अपने पास
  rationale: प्रत्यय का संकेत राजा की ओर है; ‘अपने पास’ आधुनिक हिन्दी में उसकी व्यक्तिगत उपस्थिति को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מָבוֹא הַשְּׁלִישִׁי
  choice: तीसरे प्रवेश-द्वार
  rationale: מָבוֹא प्रवेश या आने-जाने के स्थान को दर्शाता है। ‘प्रवेश-द्वार’ भवन के प्रसंग में स्पष्ट है, जबकि ‘तीसरे’ की अनिश्चित स्थान-संबंधी पहचान को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: בְּבֵית יְהוָה
  choice: याहवे के भवन
  rationale: בֵּית का मूल अर्थ ‘घर/भवन’ है और यहाँ मंदिर-परिसर अभिप्रेत है। मुख्य पाठ में औपचारिक निकटता के लिए ‘भवन’ रखा गया है तथा प्रासंगिक विकल्प पाद-टिप्पणी में दिया गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय आधुनिक हिन्दी लिप्यंतरण में प्रस्तुत किया गया है।
- source_word: שֹׁאֵל אֲנִי אֹתְךָ דָּבָר
  choice: मैं तुमसे एक बात पूछ रहा हूँ
  rationale: कर्ता-सर्वनाम के साथ कृदन्त तत्काल चल रही मंशा को व्यक्त करता है; דָּבָר यहाँ स्वाभाविक हिन्दी में ‘एक बात’ है।
- source_word: אַל תְּכַחֵד מִמֶּנִּי דָּבָר
  choice: मुझसे कुछ भी मत छिपाना
  rationale: כחד का अर्थ छिपाना या गुप्त रखना है। ‘कुछ भी’ निषेध की समग्रता को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: मूल पाठ में व्यक्तिगत नाम יְהוָה है। उसका लिप्यंतरण नाम और उपाधि के बीच का भेद बनाए रखता है।
- issue: בֵית יְהוָה की अभिव्यक्ति
  choice: याहवे का भवन
  alternative: याहवे का मन्दिर
  rationale: ‘भवन’ मूल के ‘घर’ रूपक के अधिक निकट है, जबकि ‘मन्दिर’ प्रसंगगत अर्थ को स्पष्ट करता है; विकल्प को पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। राजा के सीधे संबोधन में ‘तुम’ प्रयोग किया गया है, जो न तो अत्यधिक अनौपचारिक है और न मूल में अनुपस्थित आदरसूचकता जोड़ता है।
