base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/010.yaml
  text: Then the king commanded Ebed-melech the Cushite[a], saying, “Take with you from here thirty men[b], and bring Jeremiah the prophet up from the cistern before he dies.”
translation:
  language: hi
  text: तब राजा ने कूशी एबेद-मेलेक[a] को आज्ञा दी, “यहाँ से अपने साथ तीस पुरुषों को ले जा और यिर्मयाह नबी को हौद[b] में से निकाल ला, इससे पहले कि वह मर जाए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इथियोपियाई।” इब्रानी में “कूशी” है, अर्थात कूश का रहनेवाला व्यक्ति।
    reason: lexical_alternative
  - marker: b
    text: या “गड्ढा।” इब्रानी शब्द בּוֹר का अर्थ गड्ढा या जल-संग्रह का हौद हो सकता है; यहाँ कथा के प्रसंग में “हौद” उपयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַוֶּה
  choice: आज्ञा दी
  rationale: क्रिया צוה यहाँ राजा के अधिकारपूर्ण सीधे आदेश को व्यक्त करती है; ‘आज्ञा दी’ स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: עֶבֶד מֶלֶךְ
  choice: एबेद-मेलेक
  rationale: संदर्भ में यह व्यक्तिगत नाम है, इसलिए इसका अर्थानुवाद ‘राजा का सेवक’ न करके लिप्यंतरण किया गया है।
- source_word: הַכּוּשִׁי
  choice: कूशी
  rationale: यह कूश से संबंधित व्यक्ति को सूचित करता है और इब्रानी जाति-भौगोलिक पद से सीधा संबंध बनाए रखता है।
- source_word: קַח בְּיָדְךָ מִזֶּה שְׁלֹשִׁים אֲנָשִׁים
  choice: यहाँ से अपने साथ तीस पुरुषों को ले जा
  rationale: शाब्दिक ‘अपने हाथ में’ इस प्रसंग में अपने निर्देशन में साथ ले जाने का मुहावरा है। ‘पुरुषों’ से इब्रानी के स्पष्ट पुल्लिंग बहुवचन को रखा गया है।
- source_word: וְהַעֲלִיתָ
  choice: निकाल ला
  rationale: हिफ़ील रूप किसी को ऊपर लाने का अर्थ देता है; हौद से बचाकर बाहर लाने के प्रसंग में ‘निकाल ला’ स्वाभाविक हिन्दी है और ऊपर निकालने की क्रिया को स्पष्ट करता है।
- source_word: יִרְמְיָהוּ הַנָּבִיא
  choice: यिर्मयाह नबी
  rationale: नाम का प्रचलित हिन्दी लिप्यंतरण और स्रोत में उपस्थित पदवी दोनों बनाए रखे गए हैं।
- source_word: מִן הַבּוֹר
  choice: हौद में से
  rationale: בּוֹר गड्ढे या जल-संग्रह के हौद को सूचित कर सकता है; कथा में कीचड़युक्त जल-संग्रह हौद होने के कारण ‘हौद’ प्रसंगानुकूल है।
- source_word: בְּטֶרֶם יָמוּת
  choice: इससे पहले कि वह मर जाए
  rationale: यह आसन्न मृत्यु से पहले कार्य पूरा करने की समय-सीमा को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
