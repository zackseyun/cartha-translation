source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יִרְמְיָ֖הוּ לֹ֣א יִתֵּ֑נוּ שְֽׁמַֽע נָ֣א בְּ/ק֣וֹל יְהוָ֗ה לַ/אֲשֶׁ֤ר אֲנִי֙ דֹּבֵ֣ר אֵלֶ֔י/ךָ וְ/יִ֥יטַב לְ/ךָ֖ וּ/תְחִ֥י נַפְשֶֽׁ/ךָ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/020.yaml
  text: Jeremiah said[a], “They will not hand you over. Please listen to the voice of Yahweh in what I am speaking to you, so that it may go well with you and your life may be spared.”
translation:
  language: hi
  text: यिर्मयाह ने कहा[a], “वे तुम्हें नहीं सौंपेंगे। कृपया, याहवे की वाणी पर ध्यान दो—जैसा मैं तुमसे कह रहा हूँ[b]—ताकि तुम्हारा भला हो और तुम्हारा जीवन बचा रहे[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में, “वे नहीं देंगे/सौंपेंगे।” किसके हाथ सौंपेंगे, यह निकट प्रसंग से समझा जाता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में, “याहवे की वाणी सुनो”; यह मुहावरा याहवे की कही बात पर ध्यान देने और उसे मानने का अर्थ रखता है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में, “तुम्हारा प्राण/जीवन जीवित रहे।” यहाँ आशय शारीरिक जीवन के बचने से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יִתֵּנוּ
  choice: वे तुम्हें उनके हाथ में नहीं सौंपेंगे
  rationale: क्रिया का कर्ता बहुवचन है और कर्म प्रसंग से स्पष्ट है; ‘हाथ में सौंपेंगे’ किसी दूसरे के अधिकार में कर देने का स्वाभाविक हिन्दी मुहावरा है। ‘उनके’ से कसदियों का प्रसंगगत संकेत मिलता है, बिना उन्हें मूल पाठ में नाम से जोड़ने के।
- source_word: שְׁמַע נָא
  choice: कृपया ... ध्यान दो
  rationale: नָא के विनम्र किंतु आग्रहपूर्ण भाव को ‘कृपया’ व्यक्त करता है; यहाँ שׁמע केवल सुनने नहीं, कही हुई बात को मानने का संकेत देता है।
- source_word: בְּקוֹל יְהוָה
  choice: याहवे की वाणी पर ध्यान दो
  rationale: ‘वाणी’ मूल के קוֹל को बनाए रखती है, जबकि ‘ध्यान दो’ सुनने और मानने दोनों का भाव स्वाभाविक हिन्दी में देता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: לַאֲשֶׁר אֲנִי דֹּבֵר אֵלֶיךָ
  choice: उस बात पर जो मैं तुमसे कह रहा हूँ
  rationale: यह वाक्यांश याहवे की वाणी और यिर्मयाह द्वारा सुनाए जा रहे संदेश के बीच संबंध बनाए रखता है तथा आधुनिक हिन्दी में स्पष्ट है।
- source_word: וְיִיטַב לְךָ
  choice: ताकि तुम्हारा भला हो
  rationale: यह प्रचलित इब्रानी अभिव्यक्ति अनुकूल परिणाम बताती है; ‘ताकि’ आज्ञा मानने के फल का संबंध स्पष्ट करता है।
- source_word: וּתְחִי נַפְשֶׁךָ
  choice: और तुम्हारा जीवन बचा रहे
  rationale: इस जीवन-मरण के प्रसंग में נֶפֶשׁ का अर्थ व्यक्ति का भौतिक जीवन है। ‘जीवन बचा रहे’ मूल के ‘जीवित रहे’ भाव को स्वाभाविक हिन्दी में व्यक्त करता है, बिना ‘आत्मा’ संबंधी अतिरिक्त धार्मिक अर्थ जोड़े।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है; ‘याहवे’ उसे उपाधि में बदले बिना प्रस्तुत करता है।
- issue: נֶפֶשׁ का जीवन-मरण के प्रसंग में अर्थ
  choice: तुम्हारा जीवन बचा रहे
  alternative: तुम्हारा प्राण जीवित रहे / तुम्हारी आत्मा जीवित रहे
  rationale: यहाँ आशय सिदकिय्याह के शारीरिक रूप से जीवित बचने का है। ‘आत्मा’ अनावश्यक मानवशास्त्रीय अर्थ ला सकती है, जबकि ‘जीवन’ मूल की प्रसंगगत व्यापकता बनाए रखता है।
- issue: आज्ञा और अनुकूल परिणाम का संबंध
  choice: ताकि तुम्हारा भला हो
  alternative: और तुम्हारा भला होगा
  rationale: וְ के बावजूद प्रसंग में आग्रह के बाद परिणाम/उद्देश्य का भाव संभव है। ‘ताकि’ इस संबंध को स्वाभाविक हिन्दी में दर्शाता है, पर इसे किसी व्यापक कर्म-सिद्धांत में नहीं बदलता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। प्रत्यक्ष संबोधन में ‘तुम’ रखा गया है। ‘वाणी’ मूल की ठोस छवि बचाती है, जबकि पूरा वाक्य अत्यधिक शब्दशः होने से बचाया गया है।
