  text: וַ/יִּמְשְׁכ֤וּ אֶֽת יִרְמְיָ֨הוּ֙ בַּֽ/חֲבָלִ֔ים וַ/יַּעֲל֥וּ אֹת֖/וֹ מִן הַ/בּ֑וֹר וַ/יֵּ֣שֶׁב יִרְמְיָ֔הוּ בַּ/חֲצַ֖ר הַ/מַּטָּרָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/013.yaml
  text: So they pulled Jeremiah up with the ropes and brought him up out of the cistern[b][a], and Jeremiah remained in the court of the guard.
translation:
  language: hi
  text: तब उन्होंने यिर्मयाह को रस्सियों से खींचा और हौद[a] में से ऊपर निकाल लिया। और यिर्मयाह पहरेदारों के आँगन[b] में रहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “गड्ढे में से।” इब्रानी शब्द का अर्थ गड्ढा, हौद या जलकुंड हो सकता है; यहाँ कथा के संदर्भ में “हौद” उपयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: या “पहरे वाले आँगन में” अथवा “बंदीगृह के आँगन में।” इब्रानी पदबंध पहरे में रखे जाने वाले सुरक्षित क्षेत्र को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְשְׁכוּ
  choice: खींचकर
  rationale: क्रिया משׁך का मूल अर्थ खींचना है; रस्सियों द्वारा यिर्मयाह को ऊपर निकालने की शारीरिक क्रिया को यह स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: בַּחֲבָלִים
  choice: रस्सियों से
  rationale: חֲבָלִים रस्सियों या डोरियों को दर्शाता है और उपसर्ग ב यहाँ साधन का भाव देता है।
- source_word: וַיַּעֲלוּ אֹתוֹ
  choice: बाहर निकाला
  rationale: हिफ़ील रूप का अर्थ उसे ऊपर लाना है। हिन्दी में 'खींचकर ... बाहर निकाला' क्रिया की दिशा और कारक भाव दोनों को सहजता से व्यक्त करता है।
- source_word: מִן הַבּוֹר
  choice: हौद से
  rationale: בּוֹר गड्ढे, जलकुंड या हौद को सूचित कर सकता है। कथा में यह पानी जमा करने वाला भूमिगत हौद है; इसलिए 'हौद' संदर्भानुकूल है, जबकि विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: וַיֵּשֶׁב
  choice: रहा
  rationale: ישׁב का अर्थ बैठना, निवास करना या बने रहना हो सकता है। यहाँ बचाए जाने के बाद यिर्मयाह के वहीं रहने का वर्णन है।
- source_word: בַּחֲצַר הַמַּטָּרָה
  choice: पहरे के आँगन में
  rationale: חָצֵר आँगन या प्रांगण है और מַטָּרָה पहरे में रखे जाने वाले सुरक्षित क्षेत्र को दर्शाता है। यह अनुवाद किसी विशेष भवन या औपचारिक कारागार का अनावश्यक अनुमान नहीं लगाता।
