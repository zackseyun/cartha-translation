  text: וַ/יִּשְׁמַ֡ע עֶֽבֶד מֶ֨לֶךְ הַ/כּוּשִׁ֜י אִ֣ישׁ סָרִ֗יס וְ/הוּא֙ בְּ/בֵ֣ית הַ/מֶּ֔לֶךְ כִּֽי נָתְנ֥וּ אֶֽת יִרְמְיָ֖הוּ אֶל הַ/בּ֑וֹר וְ/הַ/מֶּ֥לֶךְ יוֹשֵׁ֖ב בְּ/שַׁ֥עַר בִּנְיָמִֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/007.yaml
  text: Ebed-melech the Cushite[a], a court official who was in the king’s house, heard that they had put Jeremiah into the cistern[c][b], while the king was sitting at the Benjamin Gate.
translation:
  language: hi
  text: कूशी एबेद-मेलेक[a], एक राजकीय अधिकारी[b], जो राजमहल में था, ने सुना कि उन्होंने यिर्मयाह को हौद[c] में डाल दिया था। उस समय राजा बिन्यामीन फाटक पर बैठा हुआ था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कूशी अर्थात कूश देश का एक व्यक्ति; कुछ पारंपरिक अनुवादों में “इथियोपियाई” है।
    reason: cultural_note
  - marker: b
    text: या “एक खोजा।” इब्रानी शब्द का अर्थ शाब्दिक रूप से खोजा या अधिक व्यापक रूप से राजदरबार का अधिकारी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या “गड्ढे।” इब्रानी शब्द गड्ढे या पानी के हौद, दोनों के लिए प्रयुक्त हो सकता है; यहाँ निकटवर्ती प्रसंग के अनुसार “हौद” उपयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: ने सुना
  rationale: שׁמע का सामान्य कथात्मक अर्थ ‘सुनना’ है; यहाँ यह उस सूचना को सुनने का बोध देता है जो आगे כִּי-उपवाक्य में आती है।
- source_word: עֶבֶד מֶלֶךְ
  choice: एबेद-मेलेक
  rationale: संदर्भ में यह व्यक्ति का नाम है, इसलिए इसका अर्थानुवाद ‘राजा का सेवक’ न करके देवनागरी में लिप्यंतरण किया गया है।
- source_word: הַכּוּשִׁי
  choice: कूशी
  rationale: यह कूश देश/क्षेत्र के व्यक्ति का जातिवाचक-भौगोलिक परिचय है; ‘इथियोपियाई’ संभावित रूप से काल-विसंगत हो सकता है।
- source_word: אִישׁ סָרִיס
  choice: एक राजकीय अधिकारी
  rationale: סָרִיס का अर्थ शाब्दिक रूप से ‘खोजा’ अथवा व्यापक रूप से राजदरबार का अधिकारी हो सकता है। प्रसंग में पदगत अर्थ स्वाभाविक है, जबकि दूसरी संभावना पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: וְהוּא בְּבֵית הַמֶּלֶךְ
  choice: जो राजमहल में ... था
  rationale: शाब्दिक ‘राजा का घर’ यहाँ राजकीय महल को सूचित करता है; आधुनिक हिन्दी में ‘राजमहल’ स्पष्ट और स्वाभाविक है।
- source_word: נָתְנוּ אֶת יִרְמְיָהוּ אֶל הַבּוֹר
  choice: उन्होंने यिर्मयाह को हौद में डाल दिया है
  rationale: בּוֹר गड्ढे या पानी के हौद को सूचित कर सकता है। यिर्मयाह 38 के निकटवर्ती प्रसंग में जल-संग्रह का हौद अभिप्रेत है। हिन्दी में पूर्ण क्रिया उस घटना के सुनने से पहले घट चुकने का बोध सहज रूप से देती है।
- source_word: וְהַמֶּלֶךְ יוֹשֵׁב
  choice: उस समय राजा ... बैठा हुआ था
  rationale: यह समकालिक पृष्ठभूमि बताने वाला उपवाक्य है। अलग वाक्य में ‘उस समय’ हिन्दी में संबंध को स्पष्ट और स्वाभाविक रखता है।
- source_word: בְּשַׁעַר בִּנְיָמִן
  choice: बिन्यामीन फाटक पर
  rationale: यह नगर के एक विशिष्ट नामित फाटक का उल्लेख है; ‘पर’ स्थान को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: סָרִיס की अर्थगत अनिश्चितता
  choice: मुख्य पाठ में ‘राजकीय अधिकारी’
  alternative: ‘खोजा’
  rationale: मूल शब्द पद और शारीरिक अवस्था, दोनों अर्थों में प्रयुक्त हो सकता है। प्रसंग पदगत भूमिका का समर्थन करता है, पर शाब्दिक संभावना को पादटिप्पणी में बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। लंबे इब्रानी वाक्य को दो हिन्दी वाक्यों में बाँटकर समकालिक परिस्थिति स्पष्ट की गई है। नामों का प्रचलित बाइबलीय देवनागरी लिप्यंतरण रखा गया है और मूल की अर्थगत अनिश्चितताओं को पादटिप्पणियों में सुरक्षित किया गया है।
