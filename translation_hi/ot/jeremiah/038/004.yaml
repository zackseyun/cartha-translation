  text: וַ/יֹּאמְר֨וּ הַ/שָּׂרִ֜ים אֶל הַ/מֶּ֗לֶךְ י֣וּמַת נָא֮ אֶת הָ/אִ֣ישׁ הַ/זֶּה֒ כִּֽי עַל כֵּ֡ן הֽוּא מְרַפֵּ֡א אֶת יְדֵי֩ אַנְשֵׁ֨י הַ/מִּלְחָמָ֜ה הַֽ/נִּשְׁאָרִ֣ים בָּ/עִ֣יר הַ/זֹּ֗את וְ/אֵת֙ יְדֵ֣י כָל הָ/עָ֔ם לְ/דַבֵּ֣ר אֲלֵי/הֶ֔ם כַּ/דְּבָרִ֖ים הָ/אֵ֑לֶּה כִּ֣י הָ/אִ֣ישׁ הַ/זֶּ֗ה אֵינֶ֨/נּוּ דֹרֵ֧שׁ לְ/שָׁל֛וֹם לָ/עָ֥ם הַ/זֶּ֖ה כִּ֥י אִם לְ/רָעָֽה־־־־־־׀־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/004.yaml
  text: Then the officials said to the king[a], “Please let this man be put to death, for in this way he is weakening the hands of the men of war who remain in this city, and the hands of all the people, by speaking to them words like these. For this man is not seeking the welfare of this people[c][b], but their harm.”
translation:
  language: hi
  text: तब अधिकारियों ने राजा से कहा, “कृपया इस व्यक्ति को मार डाला जाए, क्योंकि वह उनसे ऐसी बातें कहकर इस नगर में बचे हुए योद्धाओं और समस्त प्रजा के हाथ ढीले कर रहा है।[a] यह व्यक्ति इस प्रजा की भलाई नहीं, बल्कि उसकी हानि चाहता है।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “योद्धाओं के हाथ और समस्त प्रजा के हाथ ढीले कर रहा है।” यह इब्रानी मुहावरा उनका साहस या मनोबल तोड़ने को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: “भलाई” के स्थान पर “शांति” या “कल्याण” भी सम्भव है; इब्रानी शालोम में शांति, कुशलता और समृद्धि के अर्थ शामिल हो सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׂרִים
  choice: अधिकारियों
  rationale: यह शब्द यहाँ शासन और राजदरबार से जुड़े उच्च पदाधिकारियों को दर्शाता है; ‘अधिकारी’ आधुनिक हिन्दी में स्वाभाविक है और पद को अनावश्यक रूप से ‘राजकुमार’ या सैन्य अधिकारी तक सीमित नहीं करता।
- source_word: יוּמַת נָא
  choice: कृपया इस व्यक्ति को मार डाला जाए
  rationale: होफ़ाल/युस्सिव रूप मृत्युदंड की माँग करता है और נָא उसे राजा के सामने निवेदन के रूप में प्रस्तुत करता है। निष्क्रिय प्रयोग न्यायिक रूप से प्राणदंड दिए जाने का भाव बनाए रखता है।
- source_word: מְרַפֵּא אֶת־יְדֵי
  choice: हाथ ढीले कर रहा है
  rationale: इब्रानी मुहावरे और उसकी सजीव छवि को रखते हुए यह हिन्दी में साहस या मनोबल तोड़ने का अर्थ संप्रेषित करता है।
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: योद्धाओं
  rationale: यह ‘युद्ध के पुरुषों’ का स्वाभाविक और संक्षिप्त हिन्दी रूप है, जो सैनिक भूमिका को स्पष्ट करता है।
- source_word: הַנִּשְׁאָרִים
  choice: बचे हुए
  rationale: घेराबंदी के संदर्भ में यह नगर में अब भी रह गए लोगों का भाव स्पष्ट रूप से व्यक्त करता है, बिना यह निश्चित किए कि वे सभी किसी पूर्व घटना के जीवित बचे लोग थे।
- source_word: לְדַבֵּר אֲלֵיהֶם כַּדְּבָרִים הָאֵלֶּה
  choice: ऐसी बातें कहकर
  rationale: यह साधनसूचक infinitive और तुलनात्मक כַ का स्वाभाविक हिन्दी रूप है; इससे शब्दशः उद्धरण का अनावश्यक संकेत नहीं मिलता।
- source_word: דֹרֵשׁ לְשָׁלוֹם
  choice: भलाई चाहता है
  rationale: דרשׁ का आशय किसी के हित की खोज या चाह से है और שׁלום यहाँ शांति से व्यापक कल्याण को समेट सकता है; ‘भलाई चाहता है’ आरोप का स्वाभाविक हिन्दी रूप है।
- source_word: כִּי אִם לְרָעָה
  choice: बल्कि उसकी हानि चाहता है
  rationale: यह शालोम और विपत्ति/हानि के तीखे विरोध को स्पष्ट करता है तथा हिन्दी में निहित क्रिया को दोहराकर वाक्य को सहज बनाता है।
theological_decisions:
- issue: שָׁלוֹם का अर्थ-क्षेत्र
  choice: मुख्य पाठ में ‘भलाई’
  alternative: ‘शांति’ या ‘कल्याण’
  rationale: संदर्भ में अधिकारी यिर्मयाह पर लोगों के हित के विरुद्ध काम करने का आरोप लगा रहे हैं। ‘भलाई’ शांति, कुशलता और कल्याण के व्यापक अर्थ को समेटती है; पादटिप्पणी मूल शब्द की बहुअर्थकता सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। इब्रानी ‘हाथ ढीले करना’ मुहावरा मुख्य पाठ में बनाए रखते हुए पादटिप्पणी में उसका अर्थ स्पष्ट किया गया है। संबोधन और सर्वनाम में अनावश्यक संस्कृतनिष्ठता से बचा गया है।
