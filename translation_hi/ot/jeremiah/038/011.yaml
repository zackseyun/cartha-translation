base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/011.yaml
  text: So Ebed-melech took the men with him and went into the king’s house[a], to a place below the storeroom, and from there took worn-out rags and worn-out garments[c][b], and sent them down by ropes to Jeremiah in the cistern.
translation:
  language: hi
  text: तब एबेद-मेलेक उन आदमियों को अपने साथ लेकर राजा के महल में भंडारघर[a] के नीचे की जगह पर गया। वहाँ से उसने घिसे-पिटे चिथड़े और घिसे-पिटे कपड़े[b] लिए और उन्हें रस्सियों के सहारे हौद[c] में यिर्मयाह के पास नीचे पहुँचाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘खजाने के नीचे।’ इब्रानी אוֹצָר का अर्थ ‘खजाना’ या ‘भंडारघर’ हो सकता है; यहाँ का प्रसंग भंडारण की जगह की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘कपड़े’ के लिए प्रयुक्त इब्रानी शब्द מְלָחִים दुर्लभ है और उसका ठीक अर्थ निश्चित नहीं है। प्रसंग से पुराने कपड़े की वस्तुएँ अभिप्रेत जान पड़ती हैं, जिनसे यिर्मयाह को रस्सियों की रगड़ से बचाया जा सके।
    reason: lexical_uncertainty
  - marker: c
    text: या ‘गड्ढे।’ इब्रानी בּוֹר का अर्थ गड्ढा या पानी का हौद हो सकता है; इस कथा में ‘हौद’ अधिक उपयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶבֶד מֶלֶךְ
  choice: एबेद-मेलेक
  rationale: इसे अर्थानुवाद करने के बजाय व्यक्ति के नाम के रूप में लिप्यंतरित किया गया है।
- source_word: הָאֲנָשִׁים בְּיָדוֹ
  choice: उन आदमियों को अपने साथ लेकर
  rationale: शाब्दिक अर्थ ‘उसके हाथ में’ है, पर यहाँ मुहावरे का आशय उसके साथ या उसके निर्देशन में गए आदमियों से है।
- source_word: בֵית הַמֶּלֶךְ
  choice: राजा का महल
  rationale: शाब्दिक ‘राजा का घर’ के लिए प्रसंगानुकूल और स्वाभाविक हिन्दी अभिव्यक्ति।
- source_word: אֶל תַּחַת הָאוֹצָר
  choice: भंडारघर के नीचे की जगह पर
  rationale: אוֹצָר का अर्थ खजाना या भंडारघर हो सकता है; पुराने कपड़े प्राप्त करने के इस प्रसंग में ‘भंडारघर’ अधिक उपयुक्त है, जबकि ‘नीचे की जगह’ תַּחַת को स्पष्ट रखता है।
- source_word: בְּלוֹיֵ הַסְּחָבוֹת
  choice: घिसे-पिटे चिथड़े
  rationale: दोनों शब्दों में निहित जीर्णता और कपड़े के टुकड़ों का भाव स्पष्ट रूप से व्यक्त होता है।
- source_word: וּבְלוֹיֵ מְלָחִים
  choice: घिसे-पिटे कपड़े
  rationale: מְלָחִים दुर्लभ और अनिश्चित शब्द है; समानांतर पद तथा अगले वचन में रस्सियों से बचाव के उपयोग के आधार पर पुराने कपड़े अभिप्रेत जान पड़ते हैं।
- source_word: וַיְשַׁלְּחֵם
  choice: उन्हें … नीचे पहुँचाया
  rationale: मूल क्रिया का सामान्य अर्थ ‘भेजा’ है, किंतु हौद में रस्सियों से भेजने की दिशा हिन्दी में स्वाभाविक रूप से स्पष्ट की गई है।
- source_word: אֶל הַבּוֹר
  choice: हौद में
  rationale: בּוֹר गड्ढा या जल-संग्रह का हौद हो सकता है; कथा के परिवेश में सूखा हौद अभिप्रेत है।
- source_word: בַּחֲבָלִים
  choice: रस्सियों के सहारे
  rationale: करणवाचक בְּ को सहज हिन्दी में साधन के रूप में व्यक्त किया गया है।
