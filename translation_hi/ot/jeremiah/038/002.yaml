source:
  edition: WLC
  text: כֹּה֮ אָמַ֣ר יְהוָה֒ הַ/יֹּשֵׁב֙ בָּ/עִ֣יר הַ/זֹּ֔את יָמ֕וּת בַּ/חֶ֖רֶב בָּ/רָעָ֣ב וּ/בַ/דָּ֑בֶר וְ/הַ/יֹּצֵ֤א אֶל הַ/כַּשְׂדִּים֙ יחיה וְ/הָיְתָה לּ֥/וֹ נַפְשׁ֛/וֹ לְ/שָׁלָ֖ל וָ/חָֽי־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/002.yaml
  text: 'Thus says Yahweh: He who remains in this city will die by the sword[a], by famine, and by pestilence; but he who goes out to the Chaldeans will live, and his life will be to him as spoil, and he will live.'
translation:
  language: hi
  text: 'याहवे यह कहते हैं: “जो कोई इस नगर में बना रहेगा, वह तलवार, अकाल और महामारी से मरेगा; पर जो कसदियों के पास निकल जाएगा, वह जीवित रहेगा। उसका जीवन उसके लिए लूट के माल के समान होगा[a], और वह जीवित रहेगा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “उसका जीवन उसके लिए लूट के माल के समान होगा।” यह एक इब्रानी मुहावरा है, जिसका अर्थ है कि वह अपना जीवन बचा लेगा।
    reason: मूल युद्ध-रूपक को सुरक्षित रखते हुए उसके मुहावरेदार अर्थ को स्पष्ट करना।
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के विशिष्ट वाचा-नाम को सामान्य उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: הַיֹּשֵׁב בָּעִיר הַזֹּאת
  choice: जो कोई इस नगर में बना रहेगा
  rationale: यहाँ ישׁב का अर्थ बैठना नहीं, बल्कि नगर में टिके या बने रहना है; ‘जो कोई’ एकवचन प्रतिनिधिक कथन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בַּחֶרֶב בָּרָעָב וּבַדָּבֶר
  choice: तलवार, अकाल और महामारी से
  rationale: यिर्मयाह में बार-बार आने वाली न्याय की त्रयी को संक्षिप्त और गंभीर आधुनिक हिन्दी में सुरक्षित रखा गया है।
- source_word: וְהַיֹּצֵא אֶל הַכַּשְׂדִּים
  choice: पर जो कसदियों के पास निकल जाएगा
  rationale: ‘निकल जाएगा’ मूल क्रिया को बनाए रखता है; ‘आत्मसमर्पण करेगा’ प्रसंगानुकूल अर्थ तो है, पर मूल से अधिक व्याख्यात्मक होता। विरोध को स्पष्ट करने के लिए וְ को ‘पर’ कहा गया है।
- source_word: יִחְיֶה / וָחָי
  choice: वह जीवित रहेगा … और वह जीवित रहेगा
  rationale: मूल में חיים धातु की पुनरावृत्ति बल देती है; इसलिए हिन्दी में भी दोनों कथनों को रखा गया है।
- source_word: נַפְשׁוֹ
  choice: उसका प्राण
  rationale: इस प्रसंग में נֶפֶשׁ व्यक्ति के भौतिक जीवन को दर्शाता है, न कि देह से पृथक आत्मा के विषय में कोई विशिष्ट दावा। ‘प्राण’ मुहावरे की गंभीरता और जीवन के अर्थ दोनों को व्यक्त करता है।
- source_word: לְשָׁלָל
  choice: लूट का माल
  rationale: युद्ध से जुड़ी मूल रूपक-छवि को सुरक्षित रखता है; उसका आशय केवल अपना जीवन बचाकर निकल पाना है, जिसे पादटिप्पणी में स्पष्ट किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पाठ में विशिष्ट ईश्वरीय नाम है। ‘याहवे’ उसका सीधा देवनागरी लिप्यंतरण है और उसे किसी सामान्य उपाधि में नहीं बदलता।
- issue: נֶפֶשׁ का अर्थ
  choice: प्राण
  alternative: जीवन; आत्मा
  rationale: घेराबंदी और मृत्यु से बचने के संदर्भ में शब्द का अर्थ व्यक्ति का जीवन है। ‘प्राण’ मूल मुहावरे के साथ स्वाभाविक बैठता है और अमूर्त आत्मा संबंधी अतिरिक्त धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
- issue: कसदियों के पास निकल जाने का आशय
  choice: निकल जाएगा
  alternative: आत्मसमर्पण करेगा
  rationale: प्रसंग में आत्मसमर्पण निहित है, पर मूल पाठ स्पष्टतः ‘निकलने’ की क्रिया कहता है; इसलिए अधिक व्याख्यात्मक विकल्प को मुख्य पाठ में नहीं रखा गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गंभीर किंतु सामान्य पाठक के लिए सहज रखी गई है। ‘नगर’, ‘अकाल’, ‘महामारी’ और ‘प्राण’ भविष्यद्वाणी के गरिमापूर्ण स्वर के अनुकूल हैं। मूल की विरोधात्मक संरचना और ‘जीवित रहेगा’ की जानबूझकर की गई पुनरावृत्ति सुरक्षित है।
