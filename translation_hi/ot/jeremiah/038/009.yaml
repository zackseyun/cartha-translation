base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/009.yaml
  text: My lord the king[a], these men have done evil in all that they did to Jeremiah the prophet, whom they threw into the cistern, and he will die there because of the famine, for there is no bread left in the city.
translation:
  language: hi
  text: “हे मेरे स्वामी महाराज, इन आदमियों ने यिर्मयाह नबी के साथ जो कुछ किया है, वह सब बुरा किया है। उन्होंने उसे उस हौद[a] में फेंक दिया है, और वह वहीं अकाल के कारण मर जाएगा, क्योंकि नगर में अब रोटी नहीं बची है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “गड्ढे।” इब्रानी शब्द बोर का अर्थ गड्ढा, बंदीगृह या पानी जमा करने का हौद हो सकता है; यहाँ निकटवर्ती प्रसंग के अनुसार “हौद” अधिक उपयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: हे मेरे स्वामी, राजा
