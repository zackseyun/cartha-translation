- source_word: הֵרֵעוּ
  choice: उन्होंने बुराई की है
  rationale: हिफ़ील रूप यहाँ नैतिक रूप से बुरा या दुष्ट आचरण करने का भाव देता है; यह ‘गलत किया’ की अपेक्षा मूल की नैतिक तीव्रता बेहतर रखता है।
- source_word: הָאֲנָשִׁים הָאֵלֶּה
  choice: इन लोगों ने
  rationale: संदर्भ में संकेतित पुरुषों के समूह के लिए आधुनिक हिन्दी में ‘इन लोगों’ स्वाभाविक है; इससे किसी व्यापक जनसमूह का संकेत नहीं लिया जाता।
- source_word: אֵת כָּל אֲשֶׁר עָשׂוּ לְיִרְמְיָהוּ
  choice: यिर्मयाह नबी के साथ जो कुछ किया है, उस सबमें
  rationale: यह उनके पूरे दुर्व्यवहार को समेटता है और ‘כל אשר’ की व्यापकता बनाए रखता है।
- source_word: הַנָּבִיא
  choice: नबी
  rationale: यिर्मयाह के पद को स्पष्ट रूप से बनाए रखने वाला प्रचलित और सहज बाइबलीय हिन्दी शब्द।
- source_word: הִשְׁלִיכוּ אֶל הַבּוֹר
  choice: उस हौद में फेंक दिया
  rationale: בּוֹר गड्ढा, कुंड या जल-संग्रह हौद हो सकता है; निकटवर्ती कथा में नीचे कीचड़ होने के कारण ‘हौद’ संदर्भानुकूल है, जबकि विकल्प पादटिप्पणी में रखा गया है।
- source_word: וַיָּמָת
  choice: वह ... मर जाएगा
  rationale: रूप कथात्मक भूतकाल जैसा है, पर इस प्रसंग में वक्ता आसन्न और निश्चित परिणाम की चेतावनी दे रहा है; हिन्दी भविष्यकाल उस व्यावहारिक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: תַּחְתָּיו
  choice: वहाँ
  rationale: शाब्दिक अर्थ ‘उसके/उसके नीचे’ है, पर यहाँ मुहावरेदार स्थानवाचक अर्थ है—जहाँ उसे डाला गया है।
- source_word: מִפְּנֵי הָרָעָב
  choice: भूख से
  rationale: यह अकाल से उत्पन्न भूख के कारण मृत्यु को बताता है; हिन्दी में ‘भूख से मर जाएगा’ सर्वाधिक स्वाभाविक है, और अगला वाक्य नगर की खाद्य-कमी स्पष्ट करता है।
- source_word: כִּי אֵין הַלֶּחֶם עוֹד בָּעִיר
  choice: क्योंकि नगर में अब रोटी नहीं बची है
  rationale: ‘रोटी’ मूल के ठोस לֶחֶם को बनाए रखती है, जबकि ‘अब ... नहीं बची’ עוֹד और समाप्त होती खाद्य-आपूर्ति का भाव देता है।
