translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज कथात्मक शैली रखी गई है। नामों के पितृ-परिचय को स्पष्ट समानांतर संरचना में प्रस्तुत किया गया है। उद्धरण अगले पद में आरम्भ होने के कारण वाक्य के अंत में द्विबिंदु रखा गया है।
