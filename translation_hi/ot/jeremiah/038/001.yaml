source:
  edition: WLC
  text: וַ/יִּשְׁמַ֞ע שְׁפַטְיָ֣ה בֶן מַתָּ֗ן וּ/גְדַלְיָ֨הוּ֙ בֶּן פַּשְׁח֔וּר וְ/יוּכַל֙ בֶּן שֶׁ֣לֶמְיָ֔הוּ וּ/פַשְׁח֖וּר בֶּן מַלְכִּיָּ֑ה אֶ֨ת הַ/דְּבָרִ֔ים אֲשֶׁ֧ר יִרְמְיָ֛הוּ מְדַבֵּ֥ר אֶל כָּל הָ/עָ֖ם לֵ/אמֹֽר־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/001.yaml
  text: Shephatiah son of Mattan[a], Gedaliah son of Pashhur, Jucal son of Shelemiah, and Pashhur son of Malchiah heard the words that Jeremiah was speaking to all the people, saying,
translation:
  language: hi
  text: 'मत्तान के पुत्र शपत्याह, पशहूर के पुत्र गदल्याह, शेलेम्याह के पुत्र यूकल[a] और मल्किय्याह के पुत्र पशहूर ने वे बातें सुनीं, जो यिर्मयाह सब लोगों से इस प्रकार कह रहा था:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ इब्रानी नाम יוּכַל का लिप्यंतरण ‘यूकल’ किया गया है; यही व्यक्ति यिर्मयाह 37:3 में नाम के विस्तृत रूप ‘यहूकल’ से मिलता है।
    reason: नाम के संक्षिप्त और विस्तृत इब्रानी रूपों के संबंध को स्पष्ट करना।
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: ने ... सुनीं
  rationale: שׁמע का सामान्य कथात्मक अर्थ ‘सुनना’ है। हिन्दी में कर्ताओं की संयुक्त सूची के बाद पूर्ण भूतकाल ‘ने ... सुनीं’ स्वाभाविक है।
- source_word: שְׁפַטְיָה ... גְדַלְיָהוּ ... יוּכַל ... פַשְׁחוּר
  choice: शपत्याह ... गदल्याह ... यूकल ... पशहूर
  rationale: व्यक्तिनामों का अनुवाद करने के बजाय उनके इब्रानी रूपों का देवनागरी लिप्यंतरण किया गया है। इस पद में יוּכַל के संक्षिप्त रूप के अनुरूप ‘यूकल’ रखा गया है।
- source_word: בֶּן
  choice: के पुत्र
  rationale: वंश अथवा पितृ-परिचय बताने वाले सामान्य इब्रानी पद का स्पष्ट और स्वाभाविक हिन्दी रूप।
- source_word: אֶת הַדְּבָרִים
  choice: वे बातें
  rationale: דְּבָרִים यहाँ यिर्मयाह द्वारा कही जा रही वाणी की विषयवस्तु को दर्शाता है। ‘वे बातें’ हिन्दी में ‘शब्दों’ की अपेक्षा अधिक स्वाभाविक है और बहुवचन को बनाए रखता है।
- source_word: אֲשֶׁר יִרְמְיָהוּ מְדַבֵּר
  choice: जो यिर्मयाह ... कह रहा था
  rationale: मְדַבֵּר कृदन्त चल रही क्रिया को प्रस्तुत करता है; ‘कह रहा था’ उसका अपूर्णतात्मक पक्ष सुरक्षित रखता है।
- source_word: אֶל כָּל הָעָם
  choice: सब लोगों से
  rationale: עָם यहाँ संबोधित जनसमुदाय है। हिन्दी में किसी से कुछ कहने के लिए ‘से’ स्वाभाविक परसर्ग है।
- source_word: לֵאמֹר
  choice: 'इस प्रकार ... :'
  rationale: यह उद्धरण-सूचक रूप अगले पद में आने वाली प्रत्यक्ष वाणी का परिचय देता है। ‘इस प्रकार’ और अंत का द्विबिंदु इस कार्य को स्वाभाविक हिन्दी में व्यक्त करते हैं।
