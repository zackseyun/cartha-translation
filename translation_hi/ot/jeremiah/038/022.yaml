  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। स्त्रियों के कथन को मूल की काव्यात्मक ताना-भरी लय दिखाने के लिए पंक्तियों में रखा गया है। इब्रानी सहभागी रूपों के जीवंत दृश्यात्मक वर्तमान को बनाए रखा गया है।
