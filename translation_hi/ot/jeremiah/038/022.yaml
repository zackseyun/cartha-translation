source:
  edition: WLC
  text: וְ/הִנֵּ֣ה כָל הַ/נָּשִׁ֗ים אֲשֶׁ֤ר נִשְׁאֲרוּ֙ בְּ/בֵ֣ית מֶֽלֶךְ יְהוּדָ֔ה מוּצָא֕וֹת אֶל שָׂרֵ֖י מֶ֣לֶךְ בָּבֶ֑ל וְ/הֵ֣נָּה אֹמְר֗וֹת הִסִּית֜וּ/ךָ וְ/יָכְל֤וּ לְ/ךָ֙ אַנְשֵׁ֣י שְׁלֹמֶ֔/ךָ הָטְבְּע֥וּ בַ/בֹּ֛ץ רַגְלֶ֖/ךָ נָסֹ֥גוּ אָחֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/022.yaml
  text: And behold[a], all the women who remain in the house of the king of Judah are being brought out to the officials of the king of Babylon, and they are saying, ‘The men at peace with you have misled you and overcome you; your feet have sunk into the mud[b]; they have turned back.’
translation:
  language: hi
  text: '“और देख, यहूदा के राजा के महल में बची हुई सभी स्त्रियाँ बाबेल के राजा के अधिकारियों के पास बाहर लाई जा रही हैं। वे कह रही हैं,


    ‘तुम्हारे मित्रों[a] ने तुम्हें बहकाया

    और तुम पर प्रबल हो गए।

    उन्होंने तुम्हारे पैर कीचड़[b] में धँसा दिए,

    और फिर वे पीछे हट गए।’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “तुम्हारी शान्ति के पुरुष”; अर्थात वे लोग जो तुम्हारे साथ मित्रता रखते थे—तुम्हारे निकट सहयोगी या साथी।
    reason: इब्रानी मुहावरे का शाब्दिक रूप और उसका आशय बताने के लिए।
  - marker: b
    text: या “दलदल।”
    reason: בֹּץ के लिए एक निकट हिन्दी विकल्प देने और मूल रूपक की सीमा दिखाने के लिए।
lexical_decisions:
- source_word: וְהִנֵּה
  choice: और देख
  rationale: यह ध्यान खींचने वाले इब्रानी कथन-सूचक की शक्ति और दृश्य की जीवंतता बनाए रखता है, पर आधुनिक हिन्दी में स्वाभाविक है।
- source_word: נִשְׁאֲרוּ בְּבֵית מֶלֶךְ יְהוּדָה
  choice: यहूदा के राजा के महल में बची हुई
  rationale: निफ़अल रूप उन स्त्रियों को सूचित करता है जो अब भी राजमहल में शेष हैं। यहाँ בֵּית का प्रसंगानुकूल अर्थ ‘महल’ है।
- source_word: מוּצָאוֹת
  choice: बाहर लाई जा रही हैं
  rationale: होफ़अल कृदंत का प्रेरणार्थक कर्मवाच्य भाव स्पष्ट करता है। वर्तमान प्रगतिशील रूप भविष्यसूचक दृश्य को इब्रानी की तरह जीवंत रखता है; इसे केवल सामान्य भविष्य में नहीं बदलता।
- source_word: שָׂרֵי מֶלֶךְ בָּבֶל
  choice: बाबेल के राजा के अधिकारी
  rationale: שָׂרִים के व्यापक प्रशासनिक अर्थ को व्यक्त करता है और अनावश्यक रूप से उन्हें राजकुमार या सैनिक अधिकारी नहीं ठहराता।
- source_word: הִסִּיתוּךָ
  choice: तुम्हें बहकाया
  rationale: हिफ़ील रूप में उकसाने, फुसलाने या गलत दिशा में ले जाने का भाव हो सकता है। ‘बहकाया’ इस विस्तृत अर्थ-क्षेत्र को हिन्दी में संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְיָכְלוּ לְךָ
  choice: और तुम पर प्रबल हो गए
  rationale: יכל के साथ לְ किसी पर हावी होने या उसके विरुद्ध प्रबल होने को दर्शाता है। यह अनुवाद उस प्रतिकूल भाव को बनाए रखता है।
- source_word: אַנְשֵׁי שְׁלֹמֶךָ
  choice: तुम्हारे मित्रों[a]
  rationale: शाब्दिक ‘तुम्हारी शान्ति के पुरुष’ एक मुहावरा है, जिसका आशय मित्रवत, निकट या भरोसेमंद सहयोगियों से है। मुख्य पाठ में सहज हिन्दी रखी गई है और शाब्दिक चित्र पादटिप्पणी में दिया गया है।
- source_word: הָטְבְּעוּ בַבֹּץ רַגְלֶךָ
  choice: उन्होंने तुम्हारे पैर कीचड़[b] में धँसा दिए
  rationale: हिफ़ील बहुवचन की प्रेरणार्थकता और उसके कर्ता—उन्हीं मित्रों—को स्पष्ट रूप से बनाए रखता है। फँस जाने और असहाय होने का काव्यात्मक चित्र भी सुरक्षित रहता है।
- source_word: נָסֹגוּ אָחוֹר
  choice: और फिर वे पीछे हट गए
  rationale: सहयोगियों के राजा को फँसाकर स्वयं हट जाने का दिशात्मक चित्र बनाए रखता है। ‘फिर’ घटनाक्रम को स्वाभाविक हिन्दी में स्पष्ट करता है।
