base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/012.yaml
  text: Then Ebed-melech the Cushite said to Jeremiah[a], “Please put these worn-out rags and torn clothes under your armpits[c][b], under the ropes.” And Jeremiah did so.
translation:
  language: hi
  text: तब कूशी एबेद-मेलेक ने यिर्मयाह से कहा[a], “कृपया इन घिसे-पिटे चिथड़ों और फटे कपड़ों[b] को अपनी बगलों के नीचे, रस्सियों के नीचे रख लो[c]।” यिर्मयाह ने वैसा ही किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात कूश देश का व्यक्ति; परंपरागत अनुवादों में कभी-कभी “इथियोपियाई” मिलता है।
    reason: lexical_alternative
  - marker: b
    text: ये दोनों इब्रानी शब्द दुर्लभ हैं और इनके अर्थ कुछ अनिश्चित हैं। संभवतः ये रस्सियों और यिर्मयाह के शरीर के बीच गद्दी के रूप में रखी जाने वाली जीर्ण कपड़े की वस्तुएँ थीं।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “अपने हाथों/बाँहों के जोड़ों के नीचे”; यहाँ आशय उस बगल वाले भाग से है जहाँ ऊपर खींचते समय रस्सियाँ दबाव डालतीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶבֶד מֶלֶךְ
  choice: एबेद-मेलेक
  rationale: इसे अर्थानुवाद ('राजा का सेवक') करने के बजाय व्यक्ति के नाम के रूप में लिप्यंतरित किया गया है।
- source_word: הַכּוּשִׁי
  choice: कूशी
  rationale: यह कूश देश के व्यक्ति को सूचित करता है और इब्रानी जाति-भौगोलिक पद से सीधा संबंध बनाए रखता है।
- source_word: שִׂים נָא
  choice: कृपया ... रख लो
  rationale: आज्ञार्थक क्रिया के साथ נָא के विनम्र अनुरोध का भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त होता है।
- source_word: בְּלוֹאֵי הַסְּחָבוֹת
  choice: घिसे-पिटे चिथड़े
  rationale: पदावली जीर्ण, अनुपयोगी कपड़े की वस्तुओं को दर्शाती है; यह चयन उनकी दशा और कपड़े के स्वरूप, दोनों को सहज रूप से बताता है।
- source_word: וְהַמְּלָחִים
  choice: और पुराने कपड़े
  rationale: दूसरा संज्ञा-पद दुर्लभ और अर्थ की दृष्टि से अनिश्चित है। प्रसंग में रस्सियों से बचाव के लिए प्रयुक्त मुलायम, पुराने कपड़े अभिप्रेत जान पड़ते हैं; अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: תַּחַת אַצִּלוֹת יָדֶיךָ
  choice: अपनी बगलों में
  rationale: शाब्दिक अभिव्यक्ति हाथों या बाँहों के जोड़ के नीचे के भाग की ओर संकेत करती है; ऊपर खींचते समय रस्सियों का दबाव बगलों पर पड़ना प्रसंगानुकूल है।
- source_word: מִתַּחַת לַחֲבָלִים
  choice: रस्सियों के नीचे
  rationale: इससे स्पष्ट होता है कि कपड़े शरीर और रस्सियों के बीच गद्दी के रूप में रखे जाने थे।
- source_word: וַיַּעַשׂ יִרְמְיָהוּ כֵּן
  choice: यिर्मयाह ने वैसा ही किया
  rationale: यह इब्रानी कथात्मक अनुपालन-वाक्य का स्वाभाविक और सटीक हिन्दी रूप है।
