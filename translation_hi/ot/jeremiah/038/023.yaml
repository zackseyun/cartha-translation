base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/023.yaml
  text: And all your wives and your sons will be brought out to the Chaldeans[a], and you yourself will not escape from their hand, for you will be seized by the hand of the king of Babylon[c][b], and this city will be burned with fire.
translation:
  language: hi
  text: और तुम्हारी सभी पत्नियों और तुम्हारे बेटों को कसदियों[a] के पास ले जाया जाएगा। तुम स्वयं उनके हाथ से नहीं बचोगे[b], क्योंकि तुम बाबेल के राजा के हाथ में पकड़ लिए जाओगे; और तुम इस नगर को आग से जला दोगे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘कसदियों’ के स्थान पर ‘बाबेलियों’ भी कहा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में ‘उनके हाथ से’ और ‘बाबेल के राजा के हाथ में’ अधिकार या नियंत्रण के मुहावरे हैं।
    reason: cultural_note
  - marker: c
    text: इब्रानी क्रिया पुल्लिंग एकवचन है और संबोधित व्यक्ति से मेल खाती है; ‘इस नगर’ क्रिया का कर्म है।
    reason: grammatical_note
lexical_decisions:
- source_word: נָשֶׁיךָ
  choice: तुम्हारी ... पत्नियों
  rationale: राजा के घराने के संदर्भ में यह बहुवचन रूप सामान्यतः उसकी पत्नियों को दर्शाता है; ‘स्त्रियों’ की अपेक्षा यह अधिक संदर्भ-संगत है।
- source_word: בָּנֶיךָ
  choice: तुम्हारे बेटों
  rationale: इब्रानी शब्द विशेष रूप से ‘बेटों’ का द्योतक है, सामान्य ‘बच्चों’ का नहीं।
- source_word: מוֹצִאִים
  choice: बाहर ले जाया जाएगा
  rationale: होफ़ाल कृदंत निष्क्रिय, कारक अर्थ रखता है और इस भविष्यसूचक चेतावनी में भविष्य का भाव देता है। संयुक्त कर्ता के साथ हिंदी में ‘जाएगा’ स्वाभाविक है क्योंकि निकटतम पद ‘बेटों’ है, यद्यपि पूरे समूह का आशय है।
- source_word: הַכַּשְׂדִּים
  choice: कसदियों
  rationale: मूल जातिनाम को बनाए रखा गया है; संदर्भ में यह बाबेली सेना के लिए प्रयुक्त हो सकता है।
- source_word: לֹא תִמָּלֵט מִיָּדָם
  choice: उनके हाथ से नहीं बचोगे
  rationale: ‘हाथ’ की मूल उपमा को रखते हुए अधिकार या नियंत्रण का मुहावरेदार अर्थ हिंदी में भी समझ में आता है।
- source_word: בְיַד מֶלֶךְ בָּבֶל
  choice: बाबेल के राजा के हाथ में
  rationale: यह वाक्यांश उसके अधिकार या कब्ज़े में आने का संकेत देता है; ‘हाथ में’ हिंदी में स्वाभाविक रहते हुए मूल बिंब को सुरक्षित रखता है।
- source_word: תִּתָּפֵשׂ
  choice: पकड़ लिए जाओगे
  rationale: निफ़ाल रूप पकड़े या बंदी बनाए जाने को व्यक्त करता है; संबोधित व्यक्ति पुल्लिंग एकवचन है।
- source_word: הָעִיר הַזֹּאת
  choice: यह नगर
  rationale: संकेतवाचक रचना का सीधा और स्वाभाविक हिंदी रूप।
- source_word: תִּשְׂרֹף
  choice: जला दिया जाएगा
  rationale: मसोरेटी स्वरांकन में क्रिया स्त्रीलिंग एकवचन है और ‘नगर’ से मेल खाती है। संदर्भ में नगर के जलाए जाने का निष्क्रिय अर्थ सर्वाधिक संभावित है, पर व्याकरणगत विशेषता पादटिप्पणी में दी गई है।
- source_word: בָּאֵשׁ
  choice: आग से
  rationale: विनाश के साधन को व्यक्त करने वाला स्वाभाविक हिंदी प्रयोग है और आग की ठोस छवि बनाए रखता है।
