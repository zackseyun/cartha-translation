base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/024.yaml
  text: Then Zedekiah said to Jeremiah[a], “Let no one know about these things[b], and you will not die.”
translation:
  language: hi
  text: तब सिदकिय्याह ने यिर्मयाह से कहा, “इन बातों के बारे में किसी को पता न चले, और तुम नहीं मरोगे।[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अंतिम वाक्यांश का अर्थ परिणाम या उद्देश्य भी हो सकता है: “ताकि तुम न मरो।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने ... कहा
  rationale: वाव-परिणामी कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में क्रमिकता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: צִדְקִיָּהוּ
  choice: सिदकिय्याह
  rationale: इब्रानी व्यक्तिगत नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: אֶל יִרְמְיָהוּ
  choice: यिर्मयाह से
  rationale: किसी को संबोधित करके कहने के लिए आधुनिक हिन्दी में ‘से कहा’ स्वाभाविक है; नाम का प्रचलित हिन्दी लिप्यंतरण रखा गया है।
- source_word: אִישׁ אַל יֵדַע
  choice: किसी को पता न चले
  rationale: אִישׁ यहाँ सामान्य अर्थ में ‘कोई व्यक्ति’ है और אַל के साथ क्रिया निषेध व्यक्त करती है। यह रूप स्वाभाविक हिन्दी में स्रोत के आशय और निषेधात्मक बल दोनों को बनाए रखता है।
- source_word: בַּדְּבָרִים הָאֵלֶּה
  choice: इन बातों के बारे में
  rationale: דְּבָרִים का अर्थ ‘बातें’, ‘विषय’ या ‘मामले’ हो सकता है। ‘इन बातों के बारे में’ संदर्भ के अनुकूल है और वार्तालाप को आवश्यकता से अधिक विशिष्ट नहीं बनाता।
- source_word: וְלֹא תָמוּת
  choice: और तुम नहीं मरोगे
  rationale: 'सरल समन्वयी रचना इब्रानी की अस्पष्टता बनाए रखती है: यह परिणाम, आश्वासन या निहित उद्देश्य की तरह समझी जा सकती है।'
theological_decisions:
- issue: וְלֹא תָמוּת में संबंध का स्वरूप
  choice: और तुम नहीं मरोगे
  alternative: ताकि तुम न मरो
  rationale: इब्रानी केवल וְ से उपवाक्य जोड़ता है और परिणाम तथा उद्देश्य के बीच संबंध को स्पष्ट नहीं करता; मुख्य पाठ में समन्वयी रूप उसी खुलापन को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। इब्रानी אִישׁ का यहाँ सामान्य अर्थ होने के कारण लिंग-निरपेक्ष ‘किसी’ चुना गया है।
