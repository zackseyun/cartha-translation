  yaml_path: translation/ot/jeremiah/038/006.yaml
  text: So they took Jeremiah and threw him into the cistern of Malkijah the king’s son[a], which was in the court of the guard, and they lowered Jeremiah with ropes. Now there was no water in the cistern, but only mud[c][b], and Jeremiah sank into the mud.
translation:
  language: hi
  text: तब उन्होंने यिर्मयाह को लिया और उसे राजा के पुत्र मल्किय्याह के हौज[a] में फेंक दिया। वह हौज पहरेदारों के आँगन[b] में था। उन्होंने यिर्मयाह को रस्सियों के सहारे नीचे उतारा। हौज में पानी नहीं था, केवल कीचड़[c] था, और यिर्मयाह कीचड़ में धँस गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “गड्ढा।” इब्रानी शब्द בּוֹר का अर्थ गड्ढा या जल-संग्रह का हौज हो सकता है; पानी और कीचड़ का प्रसंग यहाँ हौज की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: या “बंदीगृह के आँगन।” इब्रानी पद संभवतः पहरे में रखे जाने वाले बंदी-क्षेत्र को दर्शाता है।
    reason: lexical_alternative
  - marker: c
    text: या “गारा।” इब्रानी טִיט गीली मिट्टी, कीचड़ या गारे को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: उन्होंने यिर्मयाह को लिया
  rationale: לקח का सामान्य कथात्मक अर्थ ‘लेना’ है। प्रसंग में ‘पकड़ लिया’ संभव है, पर वह मूल क्रिया से अधिक बल जोड़ता है।
- source_word: וַיַּשְׁלִכוּ אֹתוֹ אֶל־הַבּוֹר
  choice: उसे ... हौज में फेंक दिया
  rationale: השליך बलपूर्वक डालने या फेंकने को व्यक्त करता है। בור का व्यापक अर्थ गड्ढा भी हो सकता है, पर पानी न होने और कीचड़ होने का उल्लेख जल-संग्रह के हौज की ओर संकेत करता है।
- source_word: מַלְכִּיָּהוּ בֶן־הַמֶּלֶךְ
  choice: राजा के पुत्र मल्किय्याह
  rationale: इब्रानी संबंध-वाक्यांश को सीधे रखा गया है; इससे मल्किय्याह की पहचान मिलती है, पर उत्तराधिकार या पद के विषय में कोई अतिरिक्त निष्कर्ष नहीं जोड़ा जाता।
- source_word: אֲשֶׁר בַּחֲצַר הַמַּטָּרָה
  choice: वह हौज पहरे के आँगन में था
  rationale: חצר के लिए ‘आँगन’ स्वाभाविक है। מטרה यिर्मयाह में पहरे वाली बंदी-जगह को सूचित करता है; ‘पहरे का आँगन’ सामान्य शब्द ‘कारागार’ से अधिक निकट है।
- source_word: וַיְשַׁלְּחוּ אֶת־יִרְמְיָהוּ בַּחֲבָלִים
  choice: उन्होंने यिर्मयाह को रस्सियों के सहारे नीचे उतारा
  rationale: שלח का सामान्य अर्थ ‘भेजना’ है, किंतु रस्सियों और हौज के प्रसंग में यहाँ उसका आशय नीचे उतारना है। ‘रस्सियों के सहारे’ साधन को स्पष्ट और स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: וּבַבּוֹר אֵין מַיִם כִּי אִם־טִיט
  choice: हौज में पानी नहीं था, केवल कीचड़ था
  rationale: אין अभाव और כי אם यहाँ ‘केवल’ का अर्थ देता है। यह वाक्य मूल के स्पष्ट विरोध को बनाए रखता है।
- source_word: טִיט
  choice: कीचड़
  rationale: טיט के लिए आधुनिक हिंदी का सबसे स्पष्ट और सामान्य शब्द ‘कीचड़’ है; ‘दलदल’ स्थान का बोध करा सकता है और ‘गारा’ निर्माण-सामग्री का।
- source_word: וַיִּטְבַּע יִרְמְיָהוּ בַּטִּיט
  choice: यिर्मयाह कीचड़ में धँस गया
  rationale: טבע नीचे धँसने या डूबने को व्यक्त करता है। ‘धँस गया’ गाढ़े कीचड़ में नीचे जाने की गति और संकट दोनों को स्वाभाविक रूप से दर्शाता है।
theological_decisions:
- issue: בֶן־הַמֶּלֶךְ में मल्किय्याह की राजकीय पहचान
  choice: राजा के पुत्र मल्किय्याह
  alternative: राजकुमार मल्किय्याह
  rationale: शाब्दिक संबंध ‘राजा का पुत्र’ सुरक्षित रखा गया है। ‘राजकुमार’ पद, उत्तराधिकार या औपचारिक उपाधि का अतिरिक्त संकेत दे सकता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। कथात्मक क्रियाओं को छोटे, स्पष्ट वाक्यों में व्यक्त किया गया है। ‘हौज’ सामान्य पाठक के लिए समझने योग्य है, जबकि फुटनोट में ‘गड्ढा’ की वास्तविक शाब्दिक संभावना सुरक्षित रखी गई है।
