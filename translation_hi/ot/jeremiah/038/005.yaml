base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/005.yaml
  text: Then King Zedekiah said[a], “Look, he is in your hands, for the king can do nothing against you.”
translation:
  language: hi
  text: तब राजा सिदकिय्याह ने कहा, “देखो, वह तुम्हारे हाथों में है, क्योंकि राजा तुम्हारे विरुद्ध कुछ नहीं कर सकता।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से: “राजा तुम्हारे संबंध में कुछ भी करने में समर्थ नहीं है।” प्रसंग में भाव यह है कि राजा उनका विरोध नहीं कर सकता या उनके निर्णय को पलट नहीं सकता।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक कथानक को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में क्रमिक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַמֶּלֶךְ צִדְקִיָּהוּ
  choice: राजा सिदकिय्याह
  rationale: उपाधि और नाम की यह रचना हिन्दी में स्वाभाविक है; नाम का प्रचलित हिन्दी बाइबलीय रूप रखा गया है।
- source_word: הִנֵּה
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला संकेतक अव्यय है; ‘देखो’ इसके बल को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: הוּא
  choice: वह
  rationale: स्वतंत्र सर्वनाम यिर्मयाह को सूचित करता है और क्रियारहित वाक्य में कर्ता है।
- source_word: בְּיֶדְכֶם
  choice: तुम्हारे हाथ में
  rationale: ‘हाथ’ अधिकार या नियंत्रण का रूपक है; हिन्दी में भी यह बिंब स्पष्ट और स्वाभाविक है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ כִּי राजा की स्वीकृति का कारण प्रस्तुत करता है।
- source_word: אֵין הַמֶּלֶךְ יוּכַל
  choice: राजा ... कुछ नहीं कर सकता
  rationale: यह असमर्थता व्यक्त करता है। मूल की तरह प्रथम पुरुष ‘मैं’ के बजाय तीसरे पुरुष ‘राजा’ को रखा गया है, जिससे संभावित राजकीय शैली या आलंकारिक दूरी सुरक्षित रहती है।
- source_word: אֶתְכֶם דָּבָר
  choice: तुम्हारे विरुद्ध कुछ
  rationale: इब्रानी रचना संक्षिप्त और मुहावरेदार है। प्रसंग में राजा कहता है कि वह उन्हें रोक या उनके निर्णय को पलट नहीं सकता; ‘तुम्हारे विरुद्ध कुछ’ मूल की संरचना और प्रसंगगत अर्थ दोनों को पर्याप्त रूप से रखता है।
