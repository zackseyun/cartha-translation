  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। राजकीय आत्म-संदर्भ ‘राजा’ और ‘हाथ में’ का इब्रानी बिंब सुरक्षित रखा गया है।
