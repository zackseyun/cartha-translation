base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/025.yaml
  text: But if the officials hear that I have spoken with you[a], and they come to you and say to you, ‘Please tell us what you said to the king; do not hide it from us, and we will not put you to death, and what the king said to you,’
translation:
  language: hi
  text: पर यदि अधिकारी[a] सुनें कि मैंने तुमसे बात की है, और वे तुम्हारे पास आकर तुमसे कहें, ‘कृपया हमें बताओ कि तुमने राजा से क्या कहा। हमसे कुछ मत छिपाना, और हम तुम्हें मार नहीं डालेंगे। और यह भी बताओ कि राजा ने तुमसे क्या कहा,’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘राजकुमार’; अर्थात राजदरबार या शासन के नेता, आवश्यक रूप से राजा के पुत्र नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: पर यदि
  rationale: यह पद पिछले निर्देश को आगे बढ़ाते हुए एक संभावित परिस्थिति प्रस्तुत करता है; ‘पर यदि’ संबद्धता और शर्त दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַשָּׂרִים
  choice: अधिकारी
  rationale: यहाँ शब्द यहूदा के राजकीय या शासकीय अगुओं के लिए है, आवश्यक रूप से राजपुत्रों के लिए नहीं। आधुनिक हिन्दी में ‘अधिकारी’ संदर्भ के अनुकूल और स्पष्ट है।
- source_word: דִבַּרְתִּי אִתָּךְ
  choice: मैंने तुमसे बात की है
  rationale: पूर्ण हो चुकी बातचीत की वर्तमान प्रासंगिकता को हिन्दी का पूर्ण काल स्वाभाविक रूप से व्यक्त करता है।
- source_word: וּבָאוּ אֵלֶיךָ
  choice: वे तुम्हारे पास आकर
  rationale: शर्त से जुड़ी संभावित आगामी क्रिया को हिन्दी में संयुक्त कृदन्त द्वारा सहज रूप से व्यक्त किया गया है।
- source_word: הַגִּידָה נָּא לָנוּ
  choice: कृपया हमें बताओ
  rationale: आज्ञार्थक रूप के साथ נָא विनम्र किंतु आग्रहपूर्ण निवेदन दर्शाता है; ‘कृपया’ इस भाव को स्पष्ट रखता है।
- source_word: מַה דִּבַּרְתָּ אֶל הַמֶּלֶךְ
  choice: तुमने राजा से क्या कहा
  rationale: ‘से क्या कहा’ आधुनिक हिन्दी में कथित विषय पूछने का स्वाभाविक रूप है।
- source_word: אַל תְּכַחֵד מִמֶּנּוּ
  choice: हमसे कुछ मत छिपाना
  rationale: כחד का अर्थ छिपाना या गुप्त रखना है। हिन्दी में ‘कुछ’ पूर्ववर्ती पूछताछ के निहित विषय को सहज रूप से ग्रहण करता है।
- source_word: וְלֹא נְמִיתֶךָ
  choice: तब हम तुम्हें मार नहीं डालेंगे
  rationale: हिफ़ील रूप मृत्यु का कारण बनने, अर्थात जान से मारने, को व्यक्त करता है। ‘मार नहीं डालेंगे’ सामान्य आधुनिक हिन्दी में धमकी की स्पष्टता बनाए रखता है; ‘तब’ कथन में निहित शर्तगत आश्वासन को स्पष्ट करता है।
- source_word: וּמַה דִּבֶּר אֵלֶיךָ הַמֶּלֶךְ
  choice: और यह भी बताओ कि राजा ने तुमसे क्या कहा
  rationale: मूल में यह पूर्ववर्ती माँग से जुड़ा एक और पूछताछ-विषय है। हिन्दी में क्रिया ‘बताओ’ दोहराने से अधूरेपन से बचते हुए उसका समन्वित आग्रह स्पष्ट होता है।
