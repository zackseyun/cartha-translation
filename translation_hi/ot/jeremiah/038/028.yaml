lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: रहा
  rationale: ישׁב यहाँ निरंतर ठहरे रहने को व्यक्त करता है। हिरासत के प्रसंग में ‘रहा’ स्वाभाविक है और स्वेच्छा से निवास करने का संकेत नहीं देता।
- source_word: בַּחֲצַר הַמַּטָּרָה
  choice: पहरेदारों के आँगन में
  rationale: חָצֵר का अर्थ आँगन है और מַטָּרָה यहाँ पहरे अथवा हिरासत से संबंधित स्थान को दर्शाता है। यह अनुवाद आधिकारिक हिरासत-स्थल के भाव को सहज हिन्दी में रखता है।
- source_word: עַד יוֹם אֲשֶׁר
  choice: उस दिन तक, जब
  rationale: यह पदबंध यिर्मयाह के वहाँ रहने की समय-सीमा का अंतिम बिंदु बताता है और हिब्रू की कालवाचक रचना को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: נִלְכְּדָה
  choice: पर अधिकार कर लिया गया
  rationale: לכד का निफ़ाल रूप किसी नगर के पकड़ लिए जाने या शत्रु के अधिकार में आ जाने को दर्शाता है। यह सैन्य प्रसंग में स्पष्ट और स्वाभाविक हिन्दी है; ‘पकड़ लिया गया’ भी संभव है।
- source_word: יְרוּשָׁלִַם
  choice: यरूशलेम
  rationale: स्थान-नाम का प्रचलित मानक हिन्दी रूप।
- source_word: וְהָיָה
  choice: और ... तब
  rationale: खंडित संक्रमणात्मक वाक्य को हिन्दी की कालवाचक रचना में व्यक्त किया गया है। इससे मूल का अधूरापन बना रहता है, पर अनावश्यक पुरातन शैली नहीं आती।
- source_word: כַּאֲשֶׁר
  choice: जब
  rationale: इस कालवाचक संदर्भ में ‘जब’ सबसे स्पष्ट और स्वाभाविक समतुल्य है।
