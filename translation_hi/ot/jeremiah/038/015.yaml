reference: Jeremiah 38:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יִרְמְיָ֨הוּ֙ אֶל צִדְקִיָּ֔הוּ כִּ֚י אַגִּ֣יד לְ/ךָ֔ הֲ/ל֖וֹא הָמֵ֣ת תְּמִיתֵ֑/נִי וְ/כִי֙ אִיעָ֣צְ/ךָ֔ לֹ֥א תִשְׁמַ֖ע אֵלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/015.yaml
  text: Jeremiah said to Zedekiah[a], “If I tell you, will you not surely put me to death? And if I advise you[b], you will not listen to me.”
translation:
  language: hi
  text: यिर्मयाह ने सिदकिय्याह से कहा, “यदि मैं आपको बता दूँ, तो क्या आप निश्चय ही मुझे मरवा नहीं डालेंगे?[a] और यदि मैं आपको सलाह दूँ, तो आप मेरी बात नहीं सुनेंगे।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में एक ही क्रिया के दो रूप साथ रखकर विशेष बल दिया गया है; अर्थ है, “आप मुझे अवश्य मरवा डालेंगे।”
    reason: lexical_alternative
  - marker: b
    text: “मेरी बात नहीं सुनेंगे” का अर्थ प्रसंग में “मेरी बात नहीं मानेंगे” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אַגִּיד לְךָ
  choice: यदि मैं आपको बता दूँ
  rationale: כִּי यहाँ शर्त का भाव आरम्भ करता है और נגד हिफ़ील का अर्थ बताना या प्रकट करना है। ‘बता दूँ’ स्वाभाविक हिन्दी में आशंकित शर्त को व्यक्त करता है।
- source_word: הֲלוֹא
  choice: तो क्या आप ... नहीं
  rationale: यह आलंकारिक प्रश्न है जिसका अपेक्षित उत्तर सकारात्मक है; प्रश्नात्मक रूप को हिन्दी में बनाए रखा गया है।
- source_word: הָמֵת תְּמִיתֵנִי
  choice: निश्चय ही मुझे मरवा नहीं डालेंगे
  rationale: इनफ़िनिटिव एब्सोल्यूट और सीमित क्रिया का मेल मृत्यु-दण्ड की निश्चितता पर बल देता है। हिफ़ील रूप के कारण ‘मरवा डालेंगे’ राजा द्वारा दण्ड दिलवाने के भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְכִי אִיעָצְךָ
  choice: और यदि मैं आपको सलाह दूँ
  rationale: दूसरी समानांतर शर्त को ‘और यदि’ से रखा गया है; יעץ का सामान्य अर्थ सलाह देना है।
- source_word: לֹא תִשְׁמַע אֵלַי
  choice: आप मेरी बात नहीं सुनेंगे
  rationale: שׁמע אֶל का अर्थ सुनना है, पर प्रसंग में मानने या ध्यान देने का भाव भी हो सकता है। मुख्य पाठ व्यापक अर्थ वाला स्वाभाविक हिन्दी रूप रखता है।
- source_word: יִרְמְיָהוּ / צִדְקִיָּהוּ
  choice: यिर्मयाह / सिदकिय्याह
  rationale: व्यक्तिनामों को प्रचलित हिन्दी बाइबलीय वर्तनी में लिप्यंतरित किया गया है।
theological_decisions:
- issue: ‘सुनना’ में आज्ञापालन या मानने का निहितार्थ
  choice: मेरी बात नहीं सुनेंगे
  alternative: मेरी बात नहीं मानेंगे
  rationale: इब्रानी क्रिया दोनों अर्थ-छायाएँ वहन कर सकती है। मुख्य पाठ में अस्पष्टता सुरक्षित रखी गई है और वैकल्पिक भाव पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और संवाद-सुलभ हिन्दी। राजा के लिए सम्मानसूचक ‘आप’ रखा गया है। दोनों शर्तों और पहले खंड के आलंकारिक प्रश्न को मूल संरचना के निकट रखते हुए स्वाभाविक बनाया गया है।
