  text: וַ/יֹּ֣אמֶר יִרְמְיָ֣הוּ אֶל צִדְקִיָּ֡הוּ כֹּֽה אָמַ֣ר יְהוָה֩ אֱלֹהֵ֨י צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל אִם יָצֹ֨א תֵצֵ֜א אֶל שָׂרֵ֤י מֶֽלֶךְ בָּבֶל֙ וְ/חָיְתָ֣ה נַפְשֶׁ֔/ךָ וְ/הָ/עִ֣יר הַ/זֹּ֔את לֹ֥א תִשָּׂרֵ֖ף בָּ/אֵ֑שׁ וְ/חָיִ֖תָה אַתָּ֥ה וּ/בֵיתֶֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/017.yaml
  text: 'Then Jeremiah said to Zedekiah[a], “Thus says Yahweh, the God of hosts, the God of Israel: If you indeed go out to the officials of the king of Babylon, your life will be spared, and this city will not be burned with fire[c][b]; and you and your household will live.”'
translation:
  language: hi
  text: 'तब यिर्मयाह ने सिदकिय्याह से कहा, “याहवे, सेनाओं के परमेश्वर, इस्राएल के परमेश्वर, यों कहते हैं: यदि तुम बाबेल के राजा के अधिकारियों के पास निश्चय ही निकल जाओ[a], तो तुम्हारी जान बच जाएगी[b], और यह नगर आग में नहीं जलाया जाएगा; तुम और तुम्हारा घराना जीवित रहोगे[c]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, “यदि तुम निकल ही जाओ।” इब्रानी में क्रिया के साथ उसी धातु का इन्फिनिटिव एब्सोल्यूट जोर देने के लिए आया है।
    reason: lexical_alternative
  - marker: b
    text: अधिक शाब्दिक रूप में, “तुम्हारा प्राण जीवित रहेगा।” यहाँ “प्राण” का आशय तुम्हारे जीवन या स्वयं तुमसे है—अर्थात तुम बच जाओगे।
    reason: lexical_alternative
  - marker: c
    text: अधिक शाब्दिक रूप में, “तुम और तुम्हारा घर जीवित रहोगे।” यहाँ “घर” से आशय परिवार और आश्रितों सहित घराना है, केवल भवन नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: सेनाओं के परमेश्वर
  rationale: यह इब्रानी संबंध-वाचक पदबंध को स्वाभाविक हिन्दी में सुरक्षित रखता है; צְבָאוֹת का मूल अर्थ सेनाएँ या समूह है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर
  rationale: सरल संबंध-वाचक पदबंध को औपचारिक और स्पष्ट रूप में रखा गया है।
- source_word: אִם יָצֹא תֵצֵא
  choice: यदि तुम ... निश्चय ही निकल जाओ
  rationale: क्रिया के साथ प्रयुक्त infinitive absolute के बल को ‘निश्चय ही’ द्वारा व्यक्त किया गया है।
- source_word: אֶל שָׂרֵי מֶלֶךְ בָּבֶל
  choice: बाबेल के राजा के अधिकारियों के पास
  rationale: שָׂרִים का अर्थ प्रसंग में शासकीय या सैन्य अधिकारी हो सकता है; ‘अधिकारियों’ से अनावश्यक रूप से केवल सैन्य अर्थ निर्धारित नहीं होता।
- source_word: וְחָיְתָה נַפְשֶׁךָ
  choice: तुम्हारी जान बच जाएगी
  rationale: यहाँ נֶפֶשׁ व्यक्ति के जीवन या स्वयं व्यक्ति की उत्तरजीविता को दर्शाता है, अमूर्त ‘आत्मा’ को नहीं।
- source_word: לֹא תִשָּׂרֵף בָּאֵשׁ
  choice: आग में नहीं जलाया जाएगा
  rationale: कर्मवाच्य क्रिया और आग के स्पष्ट उल्लेख, दोनों को स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: וְחָיִתָה אַתָּה וּבֵיתֶךָ
  choice: तुम और तुम्हारा घराना जीवित रहोगे
  rationale: בַּיִת यहाँ भवन मात्र नहीं, बल्कि परिवार और आश्रितों सहित घराने को दर्शाता है।
- source_word: וַיֹּאמֶר יִרְמְיָהוּ אֶל צִדְקִיָּהוּ
  choice: तब यिर्मयाह ने सिदकिय्याह से कहा
  rationale: आरम्भिक waw-consecutive कथा को आगे बढ़ाता है; ‘तब’ क्रम को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम आया है; ‘याहवे’ उसे उपाधि से बदले बिना प्रस्तुत करता है।
- issue: נֶפֶשׁ का जीवन-रक्षा संबंधी अर्थ
  choice: तुम्हारी जान बच जाएगी
  alternative: तुम्हारा प्राण जीवित रहेगा
  rationale: प्रसंग शारीरिक उत्तरजीविता का है। यह चयन नֶפֶשׁ को बाद की किसी विशिष्ट आत्मा-संबंधी धारणा से नहीं बाँधता।
- issue: शासकों के पद שָׂרִים का दायरा
  choice: अधिकारी
  alternative: हाकिम; सेनापति; राजकुमार
  rationale: पद में प्रशासनिक और सैन्य दोनों अर्थ संभव हैं; ‘अधिकारी’ मूल की व्यापकता को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली रखी गई है। राजा को संबोधित करने के लिए अत्यधिक अनौपचारिक ‘तू’ के बजाय ‘तुम’ चुना गया है। ‘यों कहते हैं’ भविष्यद्वाणी के पारंपरिक सूत्र की गंभीरता बनाए रखता है, जबकि शेष वाक्यरचना समकालीन पाठक के लिए स्पष्ट है।
