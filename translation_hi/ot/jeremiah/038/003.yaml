  text: כֹּ֖ה אָמַ֣ר יְהוָ֑ה הִנָּתֹ֨ן תִּנָּתֵ֜ן הָ/עִ֣יר הַ/זֹּ֗את בְּ/יַ֛ד חֵ֥יל מֶֽלֶךְ בָּבֶ֖ל וּ/לְכָדָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/003.yaml
  text: 'Thus says Yahweh: This city will surely be given into the hand of the army of the king of Babylon[a], and he will capture it.'
translation:
  language: hi
  text: 'याहवे यों कहता है: यह नगर निश्चय ही बाबेल के राजा की सेना के हाथ में दे दिया जाएगा[a], और वह इसे जीत लेगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बाबेल के राजा की सेना के अधिकार में।’ इब्रानी मुहावरे का शाब्दिक अर्थ ‘हाथ में’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: याहवे यों कहता है
  rationale: यह भविष्यद्वाणी-संदेश का प्रचलित परिचय-सूत्र है। वर्तमानकालीन ‘कहता है’ घोषणा की जीवित और प्रामाणिक प्रकृति को व्यक्त करता है, और יְהוָה को उसके नाम ‘याहवे’ से प्रस्तुत किया गया है।
- source_word: הִנָּתֹן תִּנָּתֵן
  choice: निश्चय ही ... दे दिया जाएगा
  rationale: क्रिया के साथ प्रयुक्त infinitive absolute निष्क्रिय क्रिया की निश्चितता पर बल देता है; ‘निश्चय ही’ उस जोर को स्वाभाविक आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: הָעִיר הַזֹּאת
  choice: यह नगर
  rationale: संकेतवाचक पदबंध का सीधा, स्वाभाविक और प्रसंगानुकूल अनुवाद।
- source_word: בְּיַד
  choice: के हाथ में
  rationale: इब्रानी मुहावरे का रूपक बनाए रखता है और हिन्दी में किसी के अधिकार या नियंत्रण में सौंपे जाने का अर्थ सहज रूप से देता है।
- source_word: חֵיל מֶלֶךְ בָּבֶל
  choice: बाबेल के राजा की सेना
  rationale: सैन्य प्रसंग में חֵיל का अर्थ सशस्त्र सेना है; संबंधवाचक पदबंध को स्वाभाविक हिन्दी क्रम में रखा गया है।
- source_word: וּלְכָדָהּ
  choice: और वह इसे जीत लेगा
  rationale: לכד किसी नगर पर अधिकार करने या उसे जीत लेने के लिए प्रयुक्त होता है। पुल्लिंग एकवचन ‘वह’ इब्रानी के व्याकरणिक परिवर्तन को बनाए रखते हुए निकटवर्ती ‘राजा’ की ओर संकेत करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुरक्षरीय वाचा-नाम सीधे उपस्थित है; ‘याहवे’ उसे किसी पदवी से बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: וּלְכָדָהּ में एकवचन कर्ता की पहचान
  choice: वह इसे जीत लेगा
  alternative: सेना इसे जीत लेगी
  rationale: इब्रानी क्रिया पुल्लिंग एकवचन है और व्याकरणतः ‘बाबेल के राजा’ की ओर संकेत कर सकती है, यद्यपि सेना उसका साधन है। अनुवाद इस हल्के व्याकरणिक तनाव को स्पष्ट किए बिना बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गंभीर और भविष्यद्वाणी-संबंधी घोषणा के अनुकूल रखी गई है। ‘नगर’, ‘निश्चय ही’ और ‘हाथ में’ गरिमापूर्ण होने के साथ सामान्य पाठक के लिए सहज हैं।
