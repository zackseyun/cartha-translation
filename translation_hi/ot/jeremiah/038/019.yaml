base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/019.yaml
  text: Then King Zedekiah said to Jeremiah[a], “I am afraid of the Judeans who have defected to the Chaldeans[e][d][c][b], lest they hand me over to them and they mistreat me.”
translation:
  language: hi
  text: तब राजा सिदकिय्याह ने यिर्मयाह से कहा, “मुझे यहूदा के उन लोगों[a] से डर लगता है जो कसदियों के पास चले गए हैं[b][c]। कहीं कसदी मुझे उनके हाथ में न सौंप दें[d], और वे मेरे साथ दुर्व्यवहार न करें[e]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यहूदियों।” इस ऐतिहासिक प्रसंग में इब्रानी शब्द विशेष रूप से यहूदा के लोगों को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या “कसदियों से जा मिले हैं” अथवा “कसदियों के सामने आत्मसमर्पण कर चुके हैं।”
    reason: lexical_alternative
  - marker: c
    text: अर्थात बेबीलोनियों के। इब्रानी में “कसदियों।”
    reason: lexical_alternative
  - marker: d
    text: 'शाब्दिक अर्थ: “मुझे उनके हाथ में दे दें।”'
    reason: lexical_alternative
  - marker: e
    text: या “मेरे साथ क्रूर व्यवहार न करें” अथवा “मुझे अपमानित न करें।”
    reason: lexical_alternative
lexical_decisions:
- source_word: דֹאֵג
  choice: डर लगता है
  rationale: इस प्रसंग में राजा संभावित परिणाम से भय व्यक्त करता है; यह आधुनिक हिन्दी में स्वाभाविक और अर्थ की दृष्टि से सटीक है।
- source_word: הַיְּהוּדִים
  choice: यहूदावासी
  rationale: यहाँ ऐतिहासिक संदर्भ में आशय विशेष रूप से यहूदा प्रदेश के लोगों से है; ‘यहूदावासी’ उस स्थानीय-राजनीतिक पहचान को स्पष्ट रखता है।
- source_word: נָפְלוּ אֶל
  choice: के पक्ष में चले गए हैं
  rationale: इस सैनिक-राजनीतिक मुहावरे का अर्थ विरोधी पक्ष में चले जाना या उसके सामने आत्मसमर्पण करना है; चुना हुआ रूप किसी एक प्रेरणा को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: הַכַּשְׂדִּים
  choice: कसदियों
  rationale: मूल पाठ का विशिष्ट जातीय-ऐतिहासिक पद बनाए रखा गया है; प्रसंग में ये बेबीलोन की सेनाएँ हैं।
- source_word: פֶּן
  choice: कहीं … न
  rationale: यह हिन्दी संरचना आशंका और भय से जुड़े संभावित परिणाम को स्वाभाविक रूप से व्यक्त करती है।
- source_word: יִתְּנוּ אֹתִי בְּיָדָם
  choice: वे मुझे उनके हाथ में न सौंप दें
  rationale: ‘हाथ में देना’ प्रभुत्व के अधीन सौंपने का मुहावरा है। ‘वे’ और ‘उनके’ को अलग रखकर मूल में उपस्थित दो बहुवचन समूहों के संदर्भ की संभावित अस्पष्टता सुरक्षित रखी गई है।
- source_word: וְהִתְעַלְּלוּ בִי
  choice: मेरे साथ क्रूर व्यवहार न करें
  rationale: क्रिया अपमानजनक, निर्दय या दुर्व्यवहारपूर्ण आचरण दर्शाती है; यह रूप अर्थ को पर्याप्त बल देता है, पर दुर्व्यवहार के किसी खास प्रकार को निश्चित नहीं करता।
theological_decisions:
- issue: ‘वे’ और ‘उनके’ के संदर्भ
  choice: सर्वनामों की मूल अस्पष्टता बनाए रखी गई
  alternative: स्पष्ट करना कि कसदी राजा को यहूदावासियों को सौंपेंगे, या यहूदावासी उसे कसदियों को सौंपेंगे
  rationale: इब्रानी वाक्य में दो बहुवचन समूह—यहूदावासी और कसदी—निकट हैं, इसलिए सर्वनाम-संदर्भ को अनुवाद में निश्चित कर देना मूल की वास्तविक व्याख्यात्मक अस्पष्टता को समाप्त कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण गद्य। ‘सिदकिय्याह,’ ‘यिर्मयाह’ और ‘कसदी’ जैसे पारंपरिक बाइबिलीय नाम रखे गए हैं। वाक्य-विन्यास बोलचाल की स्पष्टता देता है, जबकि मूल के सर्वनाम-संदर्भ की अस्पष्टता को जानबूझकर सुरक्षित रखा गया है।
