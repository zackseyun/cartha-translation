translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। ‘बाबेल’, ‘कसदी’ और ‘नगर’ बाइबलीय संदर्भ में प्रचलित तथा सामान्य पाठक के लिए बोधगम्य हैं। मूल की शर्त, कर्मवाच्य अभिव्यक्ति और ‘हाथ’ वाले समानांतर मुहावरे सुरक्षित रखे गए हैं।
