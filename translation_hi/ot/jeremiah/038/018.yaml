source:
  edition: WLC
  text: וְ/אִ֣ם לֹֽא תֵצֵ֗א אֶל שָׂרֵי֙ מֶ֣לֶךְ בָּבֶ֔ל וְ/נִתְּנָ֞ה הָ/עִ֤יר הַ/זֹּאת֙ בְּ/יַ֣ד הַ/כַּשְׂדִּ֔ים וּ/שְׂרָפ֖וּ/הָ בָּ/אֵ֑שׁ וְ/אַתָּ֖ה לֹֽא תִמָּלֵ֥ט מִ/יָּדָֽ/ם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/018.yaml
  text: But if you do not go out to the officials of the king of Babylon[a], then this city will be given into the hand of the Chaldeans, and they will burn it with fire[b], and you will not escape from their hand.
translation:
  language: hi
  text: लेकिन यदि तुम बाबेल के राजा के अधिकारियों[a] के पास बाहर नहीं जाओगे, तो यह नगर कसदियों के हाथ में दे दिया जाएगा; वे इसे आग से जला देंगे, और तुम उनके हाथ से नहीं बचोगे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बाबेल के राजा के प्रधानों के पास’ अथवा ‘बाबेल के राजा के सेनापतियों के पास।’ हिब्रू शब्द सामान्य रूप से उच्च पदस्थ अधिकारियों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘कसदियों के हाथ में’ और ‘उनके हाथ से’ हिब्रू मुहावरे हैं, जिनका आशय क्रमशः उनके अधिकार में दिया जाना और उनके अधिकार से न बच पाना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם לֹא תֵצֵא
  choice: लेकिन यदि तुम ... बाहर नहीं जाओगे
  rationale: संयोजक का प्रसंगगत विरोधी भाव ‘लेकिन’ से और शर्त ‘यदि’ से व्यक्त किया गया है। תֵצֵא का मूल अर्थ ‘बाहर जाना’ रखा गया है; समर्पण का आशय प्रसंग से स्पष्ट होता है।
- source_word: אֶל שָׂרֵי מֶלֶךְ בָּבֶל
  choice: बाबेल के राजा के अधिकारियों के पास
  rationale: שָׂרֵי उच्च पदस्थ अधिकारियों, प्रधानों या सेनापतियों को सूचित कर सकता है। ‘अधिकारियों’ व्यापक और स्वाभाविक है तथा अनावश्यक रूप से सैनिक पद निश्चित नहीं करता।
- source_word: וְנִתְּנָה הָעִיר הַזֹּאת
  choice: तो यह नगर ... दे दिया जाएगा
  rationale: हिब्रू के कर्मवाच्य रूप को बनाए रखा गया है और ‘तो’ शर्त के परिणाम को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: בְּיַד הַכַּשְׂדִּים
  choice: कसदियों के हाथ में
  rationale: ‘हाथ में’ अधिकार या वश में होने का पारदर्शी हिब्रू मुहावरा है। הַכַּשְׂדִּים के जातीय-राजनीतिक नाम को ‘कसदी’ से व्यक्त किया गया है।
- source_word: וּשְׂרָפוּהָ בָּאֵשׁ
  choice: वे इसे आग से जला देंगे
  rationale: मूल के स्पष्ट ‘आग से जलाना’ कथन को निकटता से रखा गया है; हिन्दी में कर्ता ‘वे’ कसदियों की ओर स्पष्ट संकेत करता है।
- source_word: וְאַתָּה לֹא תִמָּלֵט מִיָּדָם
  choice: और तुम उनके हाथ से नहीं बचोगे
  rationale: מלט के निफ़ाल रूप का अर्थ यहाँ ‘बचना/निकल भागना’ है। ‘उनके हाथ से’ मूल मुहावरे और पहले आए ‘हाथ में’ के समानांतर को सुरक्षित रखता है।
