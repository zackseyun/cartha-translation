id: JER.18.22
reference: Jeremiah 18:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: תִּשָּׁמַ֤ע זְעָקָה֙ מִ/בָּ֣תֵּי/הֶ֔ם כִּֽי תָבִ֧יא עֲלֵי/הֶ֛ם גְּד֖וּד פִּתְאֹ֑ם כִּֽי כָר֤וּ שיחה לְ/לָכְדֵ֔/נִי וּ/פַחִ֖ים טָמְנ֥וּ לְ/רַגְלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/022.yaml
  text: Let a cry be heard from their houses when you suddenly bring a raiding band upon them[b][a], for they have dug a pit to capture me and hidden traps for my feet.
translation:
  language: hi
  text: उनके घरों से चीख-पुकार सुनाई दे, जब तू अचानक उन पर एक लुटेरा दल[a] चढ़ा लाए; क्योंकि उन्होंने मुझे पकड़ने के लिए गड्ढा खोदा है और मेरे पैरों के लिए फंदे[b] छिपाए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘एक सैनिक टुकड़ी’ अथवा ‘लुटेरों का दल’।
    reason: גְּדוּד के सम्भव शाब्दिक विकल्पों को दर्ज करने के लिए।
  - marker: b
    text: या ‘जाल’।
    reason: פַחִים के वैकल्पिक अर्थ को दर्ज करने के लिए।
lexical_decisions:
- source_word: תִּשָּׁמַע
  choice: सुनाई दे
  rationale: निफ़अल अपूर्ण रूप यहाँ निष्क्रिय और प्रार्थनात्मक/कामनार्थक बल रखता है; ‘सुनाई दे’ इसे भविष्यवाणी बनाए बिना स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: זְעָקָה
  choice: चीख-पुकार
  rationale: यह संकट और पीड़ा में उठी पुकार को दर्शाता है; ‘चीख-पुकार’ भावात्मक बल बनाए रखते हुए आधुनिक हिन्दी में सहज है।
- source_word: מִבָּתֵּיהֶם
  choice: उनके घरों से
  rationale: मूल पाठ में पुकार के सुनाई देने का ठोस स्थानिक स्रोत उनके घर हैं।
- source_word: כִּי
  choice: जब
  rationale: पहला כִּי उस परिस्थिति या समय को प्रस्तुत करता है जिसमें पुकार सुनाई देगी; इस प्रसंग में ‘जब’ स्वाभाविक है।
- source_word: תָבִיא
  choice: तू ... चढ़ा लाए
  rationale: בוא का हिफ़ईल रूप किसी को ले आने का अर्थ देता है; शत्रु-दल के आक्रमण के संदर्भ में ‘चढ़ा लाए’ लक्ष्य भाषा में स्वाभाविक और सजीव है।
- source_word: גְּדוּד
  choice: एक लुटेरा दल
  rationale: यह सैनिक टुकड़ी, छापामार दल या लूटमार करने वाले जत्थे को सूचित कर सकता है; ‘लुटेरा दल’ सैन्य और विध्वंसकारी आशय को संक्षेप में रखता है।
- source_word: פִּתְאֹם
  choice: अचानक
  rationale: यह क्रिया-विशेषण आकस्मिकता को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: दूसरा כִּי यिर्मयाह की न्याय-विनती का कारण बताता है—उन्होंने पहले उसके विरुद्ध षड्यंत्र किया है।
- source_word: כָרוּ
  choice: खोदा है
  rationale: पूर्ण क्रिया उनके किए हुए कार्य और वर्तमान विनती के बीच संबंध बनाए रखने के लिए हिन्दी पूर्ण काल में दी गई है।
- source_word: שיחה
  choice: गड्ढा
  rationale: यह पकड़ने के उद्देश्य से खोदे गए गड्ढे को दर्शाता है; ‘गड्ढा’ रूपक को ठोस और स्पष्ट रखता है।
- source_word: לְלָכְדֵנִי
  choice: मुझे पकड़ने के लिए
  rationale: लामेद सहित धात्वर्थक रूप उद्देश्य बताता है; ‘पकड़ने के लिए’ जाल वाले बिंब और शत्रुतापूर्ण मंशा दोनों के अनुकूल है।
- source_word: וּפַחִים טָמְנוּ
  choice: और ... फंदे छिपाए हैं
  rationale: פַחִים जाल या फंदों को और טָמְנוּ उन्हें छिपाकर रखने को व्यक्त करता है; यह क्रम मूल बिंब को स्पष्ट हिन्दी में बनाए रखता है।
theological_decisions:
- issue: यिर्मयाह की न्याय-विनती का अभिशापात्मक बल
  choice: इसे न्याय के लिए सीधी प्रार्थना के रूप में ‘सुनाई दे’ से बनाए रखा गया है।
  alternative: इसे केवल भविष्यवाणी के रूप में ‘सुनाई देगी’ कहना।
  rationale: प्रसंग में हिब्रू अपूर्ण रूप कामनार्थक बल रखता है। इसे साधारण भविष्यवाणी बनाने से प्रार्थना की तीव्रता और पाठ का धर्मवैचारिक तनाव मंद पड़ जाता।
- issue: परमेश्वर के लिए निहित कर्ता और प्रत्यक्ष संबोधन
  choice: ‘तू ... चढ़ा लाए’ द्वारा एकवचन प्रत्यक्ष संबोधन रखा गया है।
  alternative: सम्मानसूचक बहुवचन ‘आप ... चढ़ा लाएँ’ या कर्ता को अस्पष्ट रखना।
  rationale: हिब्रू क्रिया स्पष्ट रूप से पुल्लिंग एकवचन द्वितीय पुरुष है। हिन्दी बाइबलीय प्रार्थना में ‘तू’ निकट और सीधा संबोधन है तथा व्याकरणिक संख्या भी सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘चीख-पुकार’, ‘लुटेरा दल’ और ‘फंदे’ सामान्य पाठक के लिए सहज हैं, जबकि प्रार्थना की कठोर न्याय-विनती को नरम नहीं किया गया। सभी पादटिप्पणी-चिह्न सम्बद्ध शब्दों के तुरंत बाद मुख्य पाठ में दिए गए हैं।
