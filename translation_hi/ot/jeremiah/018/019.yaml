source:
  edition: WLC
  text: הַקְשִׁ֥יבָ/ה יְהוָ֖ה אֵלָ֑/י וּ/שְׁמַ֖ע לְ/ק֥וֹל יְרִיבָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/019.yaml
  text: Pay attention to me[a], O Yahweh, and hear the voice of my adversaries.
translation:
  language: hi
  text: हे याहवे, मेरी ओर ध्यान दे और मेरे विरोधियों की आवाज़ सुन।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: “मेरे विरोधियों की आवाज़ सुन।” इसका अर्थ यिर्मयाह के विरुद्ध उनके आरोप सुनना या उनकी शत्रुतापूर्ण साज़िश पर ध्यान देना—दोनों में से कोई हो सकता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְשִׁיבָה
  choice: ध्यान दे
  rationale: קשׁב के हिफ़ील आज्ञार्थक का अर्थ केवल सुनना नहीं, बल्कि ध्यानपूर्वक ध्यान देना है; यह प्रयोग आधुनिक हिन्दी में स्वाभाविक और विनती की तात्कालिकता के अनुकूल है।
- source_word: יְהוָה
  choice: यहवे
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה को किसी उपाधि से बदलने के बजाय हिन्दी में उसके प्रचलित निकट लिप्यंतरण से व्यक्त किया गया है।
- source_word: אֵלָי
  choice: मेरी ओर
  rationale: अक्षरशः अर्थ ‘मेरी ओर/मेरे प्रति’ है; ‘ध्यान दे’ के साथ ‘मेरी ओर’ स्वाभाविक हिन्दी है।
- source_word: וּשְׁמַע
  choice: और ... सुन
  rationale: שׁמע के क़ाल आज्ञार्थक का सीधा अर्थ ‘सुन’ है; पहले क्रियापद से भिन्न रखते हुए इब्रानी समानांतरता बचती है।
- source_word: לְקוֹל
  choice: की आवाज़
  rationale: קוֹל का ठोस अर्थ ‘आवाज़’ है। इसे बनाए रखने से यह अस्पष्टता भी बनी रहती है कि आशय विरोधियों की कही बातों से है या उनकी शत्रुतापूर्ण गतिविधि पर ध्यान देने से।
- source_word: יְרִיבָי
  choice: मेरे विरोधियों
  rationale: ריב से बना यह पद उन लोगों को दर्शाता है जो यिर्मयाह से विवाद या संघर्ष करते हैं। ‘विरोधी’ अर्थ को व्यापक रखता है और इसे केवल कानूनी अभियोग तक सीमित नहीं करता।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। ‘यहवे’ नाम को एक उपाधि से प्रतिस्थापित किए बिना आधुनिक हिन्दी में प्रस्तुत करता है।
- issue: विरोधियों की ‘आवाज़ सुनने’ का आशय
  choice: ठोस अभिव्यक्ति को मुख्य पाठ में बनाए रखा
  alternative: उनके आरोप सुन; उनकी साज़िश पर ध्यान दे
  rationale: इब्रानी पदबंध आरोपों या शत्रुतापूर्ण षड्यंत्र—दोनों की ओर संकेत कर सकता है; मुख्य पाठ किसी एक अर्थ को निर्णायक नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और प्रार्थनापरक रखी गई है। सम्बोधन में आदरपूर्ण किन्तु बाइबिलीय एकवचन आज्ञार्थक शैली ‘दे/सुन’ अपनाई गई है; ‘विरोधी’ सामान्य पाठक के लिए स्पष्ट है और मूल की अर्थ-व्याप्ति बनाए रखता है।
