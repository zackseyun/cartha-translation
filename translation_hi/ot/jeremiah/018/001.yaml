  text: הַ/דָּבָר֙ אֲשֶׁ֣ר הָיָ֣ה אֶֽל יִרְמְיָ֔הוּ מֵ/אֵ֥ת יְהוָ֖ה לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/001.yaml
  text: The word that came to Yirmeyahu from Yahweh[a], saying,
translation:
  language: hi
  text: 'याहवे की ओर से यिर्मयाह[a] के पास यह वचन आया:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: यिरमयाहू; परंपरागत हिंदी रूप: यिर्मयाह।'
    reason: मूल इब्रानी नाम के अधिक सीधे लिप्यंतरण की जानकारी देना।
lexical_decisions:
- source_word: הַדָּבָר
  choice: यह वचन
  rationale: भविष्यवाणी के आरंभिक सूत्र में דָּבָר परमेश्वर से प्राप्त कथन या संदेश को दर्शाता है। ‘वचन’ इसके औपचारिक और धार्मिक-साहित्यिक संबंध को बनाए रखते हुए हिंदी में सहज है।
- source_word: הָיָה אֶל
  choice: के पास … आया
  rationale: यह इब्रानी मुहावरा भविष्यद्वक्ता को प्रकाशन प्राप्त होने को व्यक्त करता है; ‘के पास … आया’ हिंदी में स्वाभाविक है और मूल बिंब को बनाए रखता है।
- source_word: יִרְמְיָהוּ
  choice: यिर्मयाह
  rationale: यह नाम आधुनिक हिंदी में प्रचलित बाइबलीय रूप में दिया गया है; मूल इब्रानी उच्चारण का अधिक सीधा रूप पादटिप्पणी में बताया गया है।
- source_word: מֵאֵת
  choice: की ओर से
  rationale: यहाँ מֵאֵת स्रोत या उद्गम बताता है। ‘की ओर से’ स्पष्ट करता है कि वचन याहवे से आया।
- source_word: יְהוָה
  choice: याहवे
  rationale: चतुरक्षरीय निज नाम को किसी उपाधि से बदलने के बजाय उसके प्रचलित विद्वत्तापूर्ण लिप्यंतरण के निकट हिंदी रूप में रखा गया है।
- source_word: לֵאמֹר
  choice: ':'
  rationale: यह रूप अगले पद में आने वाली प्रत्यक्ष वाणी का परिचय देता है। हिंदी में वाक्य के अंत का द्विबिंदु उसी संवादात्मक कार्य को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में निज नाम स्पष्ट रूप से उपस्थित है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित नहीं करता और इब्रानी नाम के संभावित उच्चारण का निकट हिंदी रूप है।
translation_notes:
  register: भाषा संक्षिप्त, गरिमापूर्ण और आधुनिक मानक हिंदी की है। इब्रानी भविष्यवाणी-सूत्र की संरचना को यथासंभव सुरक्षित रखते हुए लֵאמֹר का कार्य द्विबिंदु से व्यक्त किया गया है।
