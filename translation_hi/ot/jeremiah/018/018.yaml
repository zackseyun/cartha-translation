source:
  edition: WLC
  text: וַ/יֹּאמְר֗וּ לְכ֨וּ וְ/נַחְשְׁבָ֣ה עַֽל יִרְמְיָהוּ֮ מַחֲשָׁבוֹת֒ כִּי֩ לֹא תֹאבַ֨ד תּוֹרָ֜ה מִ/כֹּהֵ֗ן וְ/עֵצָה֙ מֵֽ/חָכָ֔ם וְ/דָבָ֖ר מִ/נָּבִ֑יא לְכוּ֙ וְ/נַכֵּ֣/הוּ בַ/לָּשׁ֔וֹן וְ/אַל נַקְשִׁ֖יבָה אֶל כָּל דְּבָרָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/018.yaml
  text: Then they said[a], “Come, let us devise plans against Jeremiah, for instruction will not perish from the priest, nor counsel from the wise man, nor word from the prophet. Come, let us strike him with the tongue, and let us not pay attention to any of his words.”
translation:
  language: hi
  text: तब उन्होंने कहा, “आओ, हम यिर्मयाह के विरुद्ध योजनाएँ बनाएँ, क्योंकि न तो याजक से शिक्षा मिटेगी, न बुद्धिमान से परामर्श और न भविष्यद्वक्ता से वचन। आओ, हम अपनी जीभ से उस पर वार करें[a] और उसकी किसी भी बात पर ध्यान न दें।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “हम अपनी जीभ से उस पर आक्रमण करें,” अर्थात निंदा या आरोप लगाकर।
    reason: ‘जीभ से वार करना’ मूल इब्रानी रूपक है और वाणी के द्वारा आक्रमण का संकेत देता है।
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: तब उन्होंने कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में घटनाक्रम को स्पष्ट करता है।
- source_word: לְכוּ
  choice: आओ
  rationale: यह साथ मिलकर काम करने का आह्वान है; हिन्दी में ‘आओ’ इसका स्वाभाविक आग्रहसूचक रूप है।
- source_word: וְנַחְשְׁבָה ... מַחֲשָׁבוֹת
  choice: हम ... योजनाएँ बनाएँ
  rationale: क्रिया और उसी मूल की संज्ञा जान-बूझकर रची गई योजना पर बल देती हैं। शत्रुतापूर्ण संदर्भ को ‘विरुद्ध’ स्पष्ट करता है, जबकि अनावश्यक कृत्रिम पुनरुक्ति से बचा गया है।
- source_word: עַל יִרְמְיָהוּ
  choice: यिर्मयाह के विरुद्ध
  rationale: संदर्भ में योजनाएँ यिर्मयाह के बारे में मात्र नहीं, उसके विरोध में बनाई जा रही हैं।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह षड्यंत्रकारियों द्वारा अपनी योजना के समर्थन में दिया गया कारण प्रस्तुत करता है।
- source_word: לֹא תֹאבַד
  choice: न ... मिटेगी
  rationale: यहाँ अर्थ किसी वस्तु के लुप्त या समाप्त न होने का है। ‘मिटेगी’ सामान्य आधुनिक हिन्दी में इस निरंतरता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: תּוֹרָה
  choice: शिक्षा
  rationale: यहाँ तोराह का आशय याजकीय शिक्षा या निर्देश से है, केवल संहिताबद्ध व्यवस्था से नहीं।
- source_word: מִכֹּהֵן
  choice: याजक से
  rationale: एकवचन यहाँ प्रतिनिधिक है और याजक की सामाजिक-धार्मिक भूमिका को दर्शाता है।
- source_word: וְעֵצָה מֵחָכָם
  choice: न बुद्धिमान से परामर्श
  rationale: ‘परामर्श’ विवेकपूर्ण मार्गदर्शन का भाव रखता है; ‘बुद्धिमान’ का पुल्लिंग एकवचन मूल पाठ के प्रतिनिधिक रूप को बनाए रखता है।
- source_word: וְדָבָר מִנָּבִיא
  choice: न भविष्यद्वक्ता से वचन
  rationale: דָבָר भविष्यद्वक्ता के कथन या संदेश दोनों का अर्थ दे सकता है; ‘वचन’ इस व्यापकता और बाइबलीय स्वर को बनाए रखता है।
- source_word: וְנַכֵּהוּ בַלָּשׁוֹן
  choice: हम अपनी जीभ से उस पर वार करें
  rationale: मूल रूपक को मुख्य पाठ में सुरक्षित रखा गया है। इसका आशय वाणी द्वारा आक्रमण—जैसे निंदा या आरोप—हो सकता है, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: וְאַל נַקְשִׁיבָה אֶל כָּל דְּבָרָיו
  choice: उसकी किसी भी बात पर ध्यान न दें
  rationale: קשׁב केवल सुनने से बढ़कर ध्यान देने या मानने का भाव रखता है; हिन्दी वाक्य निषेध की व्यापकता को भी बनाए रखता है।
theological_decisions:
- issue: חָכָם में प्रतिनिधिक पुल्लिंग एकवचन
  choice: बुद्धिमान से
  alternative: बुद्धिमानों से / किसी बुद्धिमान व्यक्ति से
  rationale: मूल पाठ याजक, बुद्धिमान और भविष्यद्वक्ता को समानांतर प्रतिनिधिक एकवचन भूमिकाओं में रखता है। हिन्दी का ‘बुद्धिमान’ इस संरचना और पुल्लिंग रूप को बिना अनावश्यक विस्तार के सुरक्षित रखता है।
- issue: याजकीय शिक्षा, बुद्धिमान का परामर्श और भविष्यद्वक्ता का वचन जारी रहने का कथन
  choice: इसे षड्यंत्रकारियों के कथन के रूप में बिना व्याख्यात्मक संशोधन रखा गया
  alternative: इसे परमेश्वर की स्वीकृति या यिर्मयाह की अनावश्यकता के वस्तुनिष्ठ कथन की तरह स्पष्ट करना
  rationale: पाठ इन शब्दों को विरोधियों के तर्क के रूप में प्रस्तुत करता है। अनुवाद यह तय नहीं करता कि उनका दावा सत्य, व्यंग्यपूर्ण या आत्म-भ्रामक है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। ‘याजक,’ ‘परामर्श,’ ‘भविष्यद्वक्ता’ और ‘वचन’ पाठ की औपचारिक तथा धार्मिक भूमिका-संरचना को बनाए रखते हैं; वाक्य-विन्यास बोलने योग्य और सामान्य पाठकों के लिए स्पष्ट रखा गया है।
