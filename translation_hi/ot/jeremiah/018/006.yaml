source:
  edition: WLC
  text: הֲ/כַ/יּוֹצֵ֨ר הַ/זֶּ֜ה לֹא אוּכַ֨ל לַ/עֲשׂ֥וֹת לָ/כֶ֛ם בֵּ֥ית יִשְׂרָאֵ֖ל נְאֻם יְהוָ֑ה הִנֵּ֤ה כַ/חֹ֨מֶר֙ בְּ/יַ֣ד הַ/יּוֹצֵ֔ר כֵּן אַתֶּ֥ם בְּ/יָדִ֖/י בֵּ֥ית יִשְׂרָאֵֽל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/006.yaml
  text: Can I not do with you[a], house of Israel, as this potter does? declares Yahweh. Look, like clay in the hand of the potter, so are you in my hand, house of Israel.
translation:
  language: hi
  text: “हे इस्राएल के घराने, क्या मैं तुम्हारे साथ वैसा नहीं कर सकता जैसा यह कुम्हार करता है?[a]” यहोवा की यह घोषणा है। “देखो, जैसे मिट्टी कुम्हार के हाथ में है, वैसे ही हे इस्राएल के घराने, तुम मेरे हाथ में हो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या मैं तुम्हारे साथ इस कुम्हार के समान नहीं कर सकता?” इब्रानी तुलना संक्षिप्त है और इसका वाक्य-विन्यास एक से अधिक प्रकार से किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲכַיּוֹצֵר הַזֶּה ... לַעֲשׂוֹת לָכֶם
  choice: क्या मैं तुम्हारे साथ वैसा नहीं कर सकता जैसा यह कुम्हार करता है?
  rationale: प्रश्नवाचक הֲ और तुलनात्मक כַּ के साथ עשה לָכֶם सामर्थ्य और व्यवहार—दोनों का भाव देता है। ‘तुम्हारे साथ वैसा ... कर सकता’ हिन्दी में स्वाभाविक है और दंड अथवा कल्याण में से किसी एक अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: בֵּית יִשְׂרָאֵל
  choice: इस्राएल के घराने
  rationale: यह सामूहिक वाचक संबोधन है। ‘घराने’ से भविष्यद्वाणी का औपचारिक स्वर और इस्राएल-समुदाय का भाव बना रहता है।
- source_word: נְאֻם יְהוָה
  choice: यहोवा की यह घोषणा है
  rationale: נְאֻם भविष्यद्वाणी की गंभीर घोषणात्मक उक्ति है; ‘घोषणा’ उसके औपचारिक बल को आधुनिक हिन्दी में सुरक्षित रखती है। יְהוָה को व्यक्तिगत दिव्य नाम ‘यहोवा’ के रूप में रखा गया है।
- source_word: הִנֵּה
  choice: देखो
  rationale: यह श्रोता का ध्यान आगे आने वाले चित्र पर केंद्रित करता है और आधुनिक हिन्दी में सहज है।
- source_word: כַחֹמֶר בְּיַד הַיּוֹצֵר
  choice: जैसे मिट्टी कुम्हार के हाथ में है
  rationale: कुम्हार और मिट्टी का मूल रूपक सीधा रखा गया है। हिन्दी में जातिवाचक ‘मिट्टी’ बिना निश्चित उपपद के स्वाभाविक है।
- source_word: כֵּן אַתֶּם בְּיָדִי
  choice: वैसे ही ... तुम मेरे हाथ में हो
  rationale: כֵּן पहले उपमान और इस्राएल की स्थिति के बीच स्पष्ट अनुरूपता स्थापित करता है; ‘मेरे हाथ में’ अधिकार और नियंत्रण के रूपक को बनाए रखता है।
theological_decisions:
- issue: कुम्हार-मिट्टी के रूपक में परमेश्वर की प्रभुता
  choice: यहोवा के अधिकार को रूपक के सीधे कथन द्वारा बनाए रखा गया है।
  alternative: इसे पूर्ण नियतिवाद के कथन के रूप में विस्तार देना, अथवा केवल प्रेमपूर्ण देखभाल का रूपक बनाना।
  rationale: पद इस्राएल पर यहोवा के अधिकार को व्यक्त करता है, पर अपने आप में व्यापक नियतिवाद या केवल संरक्षण का सिद्धांत निर्धारित नहीं करता।
- issue: לַעֲשׂוֹת לָכֶם का व्यापक अर्थ
  choice: तुम्हारे साथ ... करना
  alternative: तुम्हें ऐसा बनाना; तुम्हारे साथ ऐसा व्यवहार करना; तुम्हारे प्रति ऐसा करना
  rationale: चुना गया रूप हितकारी और दंडात्मक कार्रवाई—दोनों संभावनाओं को खुला रखता है और निकटवर्ती संदर्भ में कुम्हार की क्रिया से संबंध बनाए रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और श्रवणयोग्य मानक हिन्दी अपनाई गई है। ‘हे ... घराने’ भविष्यद्वाणी के संबोधन का औपचारिक स्वर रखता है; ‘देखो’ पुरातन ‘निहारो’ की अपेक्षा सामान्य पाठक के लिए सहज है।
