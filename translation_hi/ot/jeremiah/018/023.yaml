  text: וְ/אַתָּ֣ה יְ֠הוָה יָדַ֜עְתָּ אֶֽת כָּל עֲצָתָ֤/ם עָלַ/י֙ לַ/מָּ֔וֶת אַל תְּכַפֵּר֙ עַל עֲוֺנָ֔/ם וְ/חַטָּאתָ֖/ם מִ/לְּ/פָנֶ֣י/ךָ אַל תֶּ֑מְחִי ו/היו מֻכְשָׁלִים֙ לְ/פָנֶ֔י/ךָ בְּ/עֵ֥ת אַפְּ/ךָ֖ עֲשֵׂ֥ה בָ/הֶֽם־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/023.yaml
  text: But you[a], O Yahweh, know all their counsel against me for death. Do not cover over their iniquity, and do not blot out their sin from before you. Let them be made to stumble before you; in the time of your anger[c][b], act against them.
translation:
  language: hi
  text: परन्तु हे यहोवा, तू मुझे मार डालने के लिए मेरे विरुद्ध उनकी सारी युक्तियाँ जानता है।[a] उनके अधर्म को मत ढाँप,[b] और उनके पाप को अपने सामने से मत मिटा। वे तेरे सामने ठोकर खिलाए जाएँ;[c] अपने क्रोध के समय उनके विरुद्ध कार्य कर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मेरे विरुद्ध मृत्यु के लिए”; अर्थ “मुझे मार डालने के लिए” या “मेरी मृत्यु के लिए” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “उनका अधर्म क्षमा मत कर।” इब्रानी क्रिया दोष को ढाँपने, उसका प्रायश्चित करने या उसे क्षमा किए जाने का भाव व्यक्त कर सकती है।
    reason: lexical_alternative
  - marker: c
    text: या, “वे तेरे सामने ठोकर खाकर गिरें।” इब्रानी रूप निष्क्रिय अथवा कारक भाव लिए हुए है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबल परंपरा में प्रचलित रूप रखते हुए परमेश्वर के व्यक्तिगत नाम को सामान्य उपाधि में नहीं बदला गया।
- source_word: עֲצָתָם
  choice: उनकी सारी योजना
  rationale: עֵצָה का अर्थ सलाह, योजना या युक्ति हो सकता है; यहाँ हत्या के षड्यंत्र के संदर्भ में ‘योजना’ स्वाभाविक और स्पष्ट है।
- source_word: עָלַי לַמָּוֶת
  choice: मुझे मार डालने की
  rationale: इब्रानी का संक्षिप्त शाब्दिक रूप ‘मेरे विरुद्ध मृत्यु के लिए’ है। मुख्य पाठ में उसके प्रयोजन को स्वाभाविक हिन्दी में व्यक्त किया गया और शाब्दिक बनावट पादटिप्पणी में सुरक्षित रखी गई।
- source_word: תְּכַפֵּר עַל עֲוֺנָם
  choice: उनके अधर्म को मत ढाँप
  rationale: כפר के ढाँपने, प्रायश्चित करने या दोष क्षमा किए जाने के अर्थक्षेत्र में से यहाँ ठोस रूपक रखा गया है; ‘क्षमा मत कर’ वैकल्पिक अर्थ है।
- source_word: עֲוֺנָם / חַטָּאתָם
  choice: उनके अधर्म / उनके पाप
  rationale: दो अलग इब्रानी संज्ञाओं के समानांतर प्रयोग को हिन्दी में भी अलग शब्दों से बनाए रखा गया है।
- source_word: תֶּמְחִי מִלְּפָנֶיךָ
  choice: अपने सामने से मत मिटा
  rationale: मिटाने के रूपक और परमेश्वर के सामने दोष के उपस्थित रहने की स्थानवाचक-न्यायिक छवि दोनों सुरक्षित हैं।
- source_word: וְהָיוּ מֻכְשָׁלִים לְפָנֶיךָ
  choice: वे तेरे सामने ठोकर खिलाए जाएँ
  rationale: होफल रूप की निष्क्रिय/कारक छाया और प्रार्थनात्मक-जस्सिव बल को बनाए रखने के लिए यह रूप चुना गया, यद्यपि हिन्दी में सरल विकल्प ‘वे तेरे सामने ठोकर खाकर गिरें’ अधिक सहज है।
- source_word: בְּעֵת אַפְּךָ
  choice: अपने क्रोध के समय
  rationale: אַף का शाब्दिक अर्थ ‘नाक’ है, पर यहाँ यह क्रोध का स्थापित मुहावरा है; समय-संबंधी वाक्यांश यथावत रखा गया।
- source_word: עֲשֵׂה בָהֶם
  choice: उनसे निपट
  rationale: इब्रानी संक्षिप्त रूप से ‘उनके साथ/उनमें कर’ कहता है। संदर्भ का प्रतिकूल न्यायिक बल रखते हुए हिन्दी में कोई विशिष्ट दंड नहीं जोड़ा गया।
theological_decisions:
- issue: शत्रुओं के विरुद्ध कठोर प्रार्थना
  choice: वक्ता की यह विनती सीधे और बिना नरम किए रखी गई है कि परमेश्वर उनका दोष न ढाँपे, उनका पाप न मिटाए और क्रोध में उनसे निपटे।
  alternative: इसे केवल वर्णन बनाना, या याचना की कठोरता को क्षमा-संबंधी कोमल भाषा से घटाना।
  rationale: इब्रानी में निषेधात्मक आज्ञाओं और प्रार्थनात्मक बल को स्पष्ट रूप से रखा गया है। धर्मवैज्ञानिक तनाव को अनुवाद में सुलझाने या कम करने के बजाय सुरक्षित रखना आवश्यक है।
- issue: כפר का धर्मवैज्ञानिक अर्थक्षेत्र
  choice: मुख्य पाठ में ‘ढाँप’ का रूपक रखा गया।
  alternative: ‘उनका अधर्म क्षमा मत कर’ या ‘उनके दोष का प्रायश्चित मत कर।’
  rationale: यह क्रिया ढाँपने, दोष दूर करने, प्रायश्चित और क्षमा से जुड़ा व्यापक अर्थक्षेत्र रखती है। ‘ढाँप’ मूल रूपक को बनाए रखता है, जबकि अधिक व्याख्यात्मक विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सीधी और प्रार्थनात्मक शैली रखी गई है। परमेश्वर के लिए एकवचन निकट संबोधन ‘तू/तेरे’ मूल इब्रानी के एकवचन संबोधन के अनुरूप है। ‘ठोकर खिलाए जाएँ’ कुछ औपचारिक है, पर मूल के निष्क्रिय-कारक रूप को सुरक्षित रखता है; अधिक सहज विकल्प पादटिप्पणी में है।
