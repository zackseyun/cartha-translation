lexical_decisions:
- source_word: וָאֵרֵד
  choice: तब मैं ... उतर गया
  rationale: यह क्रिया कथा में अगली घटना बताती है और नीचे जाने की दिशा भी व्यक्त करती है। ‘तब’ क्रम को स्वाभाविक हिन्दी में दर्शाता है।
- source_word: בֵּית הַיּוֹצֵר
  choice: कुम्हार के घर
  rationale: सम्बन्धवाचक इब्रानी रचना का सहज और सटीक हिन्दी रूप; प्रसंग में יֹצֵר मिट्टी को आकार देने वाला कुम्हार है।
- source_word: וְהִנֵּהוּ
  choice: वहाँ मैंने देखा कि वह
  rationale: הִנֵּה दृश्य पर जीवंत ढंग से ध्यान खींचता है और प्रत्यय कुम्हार की ओर संकेत करता है। यह रूप ‘देखो’ जैसे अस्वाभाविक उद्गार के बिना उस प्रत्यक्ष अनुभूति को व्यक्त करता है।
- source_word: עֹשֶׂה מְלָאכָה
  choice: काम कर रहा था
  rationale: कृदन्त और ‘काम’ संज्ञा, दोनों का आशय स्वाभाविक हिन्दी में रखता है और कुम्हार द्वारा बनाई जा रही वस्तु को अनावश्यक रूप से निर्दिष्ट नहीं करता।
- source_word: עַל הָאָבְנָיִם
  choice: चाक पर
  rationale: यह कुम्हार के चाक-यंत्र का प्रचलित और स्वाभाविक हिन्दी नाम है। इब्रानी शब्द का द्विवचन रूप पादटिप्पणी में स्पष्ट किया गया है।
