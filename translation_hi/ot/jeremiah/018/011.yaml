source:
  edition: WLC
  text: וְ/עַתָּ֡ה אֱמָר נָ֣א אֶל אִישׁ יְהוּדָה֩ וְ/עַל יוֹשְׁבֵ֨י יְרוּשָׁלִַ֜ם לֵ/אמֹ֗ר כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנֵּ֨ה אָנֹכִ֜י יוֹצֵ֤ר עֲלֵי/כֶם֙ רָעָ֔ה וְ/חֹשֵׁ֥ב עֲלֵי/כֶ֖ם מַֽחֲשָׁבָ֑ה שׁ֣וּבוּ נָ֗א אִ֚ישׁ מִ/דַּרְכּ֣/וֹ הָֽ/רָעָ֔ה וְ/הֵיטִ֥יבוּ דַרְכֵי/כֶ֖ם וּ/מַעַלְלֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/011.yaml
  text: 'Now therefore[a], say to the men of Judah and to the inhabitants of Jerusalem, saying, ‘Thus says Yahweh: Behold, I am shaping disaster against you and devising a plan against you. Turn back, please, each man from his evil way[c][b], and make your ways and your deeds good.’'
translation:
  language: hi
  text: 'इसलिए अब यहूदा के लोगों और यरूशलेम के निवासियों से कह, ‘याहवे ऐसा कहता है: देखो, मैं तुम्हारे विरुद्ध विपत्ति गढ़ रहा हूँ[a] और तुम्हारे विरुद्ध एक योजना बना रहा हूँ। तुममें से हर एक[c] अपने बुरे मार्ग से लौट आए[b], और अपने मार्गों और कामों को सुधारो।’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘विपत्ति गढ़ रहा हूँ’ का अनुवाद ‘अनिष्ट का रूप बना रहा हूँ’ भी हो सकता है। ‘गढ़ना’ आसपास के कुम्हार वाले चित्र की प्रतिध्वनि है।
    reason: lexical_alternative
  - marker: b
    text: ‘लौट आए’ का अनुवाद ‘लौट आओ’ या संदर्भानुसार ‘मन फिराओ’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में शाब्दिक रूप से ‘हर पुरुष अपने बुरे मार्ग से’ है; एकवचन का प्रयोग समुदाय के प्रत्येक सदस्य को अलग-अलग संबोधित करता है।
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: इसलिए अब
  rationale: यह पद कुम्हार के पिछले चित्र से निष्कर्ष और वर्तमान आह्वान—दोनों व्यक्त करता है।
- source_word: אֶל אִישׁ יְהוּדָה
  choice: यहूदा के लोगों से
  rationale: यहाँ एकवचन אִישׁ सामूहिक अर्थ में है; आधुनिक हिन्दी में यह अनावश्यक रूप से केवल पुरुषों तक अर्थ सीमित किए बिना समुदाय को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: ईश्वरीय व्यक्तिगत नाम के लिप्यंतरण को सुरक्षित रखा गया है।
- source_word: יוֹצֵר ... רָעָה
  choice: विपत्ति गढ़ रहा हूँ
  rationale: יוֹצֵר उसी धातु से है जो निकटवर्ती कुम्हार-चित्र में प्रयुक्त हुई है; ‘गढ़’ उस प्रतिध्वनि को बनाए रखता है। רָעָה यहाँ नैतिक बुराई नहीं, आने वाली दंडात्मक विपत्ति है।
- source_word: וְחֹשֵׁב ... מַחֲשָׁבָה
  choice: एक योजना बना रहा हूँ
  rationale: मूल के सजातीय क्रिया-संज्ञा प्रयोग का आशय जानबूझकर की जा रही योजना है; हिन्दी में यह स्वाभाविक अभिव्यक्ति है।
- source_word: שׁוּבוּ נָא
  choice: लौट आए
  rationale: שׁוב के दिशा-परिवर्तन वाले ठोस रूपक को बनाए रखता है; נָא की आग्रहपूर्ण शक्ति सन्दर्भ और आदेश की शैली में व्यक्त है।
- source_word: אִישׁ מִדַּרְכּוֹ הָרָעָה
  choice: तुममें से हर एक अपने बुरे मार्ग से
  rationale: 'एकवचन का वितरणात्मक बल सुरक्षित है: समुदाय के प्रत्येक सदस्य को व्यक्तिगत रूप से संबोधित किया गया है।'
- source_word: וְהֵיטִיבוּ דַרְכֵיכֶם וּמַעַלְלֵיכֶם
  choice: अपने मार्गों और कामों को सुधारो
  rationale: ‘मार्ग’ आचरण का भविष्यद्वक्तीय रूपक बनाए रखता है, जबकि ‘काम’ מַעֲלָלִים का स्पष्ट आधुनिक हिन्दी रूप है।
theological_decisions:
- issue: याहवे द्वारा लाई जाने वाली רָעָה का अर्थ
  choice: विपत्ति
  alternative: बुराई; अनिष्ट
  rationale: इस न्याय-सन्दर्भ में शब्द दंडस्वरूप आने वाली विपत्ति बताता है, न कि परमेश्वर की नैतिक बुराई।
- issue: ईश्वरीय न्याय और मनुष्य के लौटने के आह्वान का तनाव
  choice: घोषित विपत्ति और लौटने की आज्ञा दोनों को बिना समतल किए रखा गया
  alternative: विपत्ति को पूर्णतः अपरिवर्तनीय दंड या केवल काल्पनिक चेतावनी बनाना
  rationale: मूल पाठ एक ओर याहवे की सक्रिय योजना घोषित करता है और दूसरी ओर प्रत्येक व्यक्ति को लौटने के लिए बुलाता है; अनुवाद दोनों को साथ रखता है।
- issue: אִישׁ का सामूहिक और वितरणात्मक प्रयोग
  choice: पहले ‘लोगों’, फिर ‘हर एक’
  alternative: ‘यहूदा के पुरुषों’ और ‘हर पुरुष’
  rationale: पहला प्रयोग सामूहिक है, जबकि दूसरा स्पष्टतः वितरणात्मक। यह भेद हिन्दी में मूल के कार्य को अधिक ठीक ढंग से संप्रेषित करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘गढ़ना’ कुम्हार-सन्दर्भ को जीवित रखता है; ‘याहवे’ नाम को लिप्यंतरित किया गया है। आदेश में पहले एकवचन ‘कह’ यिर्मयाह को और बाद के बहुवचन समुदाय को संबोधित करते हैं।
