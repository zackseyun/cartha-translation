  yaml_path: translation/ot/jeremiah/018/009.yaml
  text: And at another moment I may speak concerning a nation and concerning a kingdom[a], to build and to plant.
translation:
  language: hi
  text: और किसी दूसरे क्षण मैं किसी राष्ट्र और किसी राज्य के विषय में कहूँ[a] कि उसे बनाऊँ और रोपूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और एक क्षण में मैं किसी राष्ट्र और किसी राज्य के विषय में कहता हूँ कि उसे बनाऊँ और रोपूँ।” इब्रानी मुहावरा पद 7–10 में परमेश्वर की घोषणाओं को ‘क्षण’ की भाषा में प्रस्तुत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרֶגַע
  choice: और किसी दूसरे क्षण
  rationale: רֶגַע का अर्थ ‘क्षण’ है। पद 7 के समानांतर और उससे विपरीत परिस्थिति को स्वाभाविक हिन्दी में दिखाने के लिए ‘किसी दूसरे क्षण’ चुना गया है।
- source_word: אֲדַבֵּר
  choice: मैं ... कह सकता हूँ
  rationale: अपूर्ण क्रिया यहाँ पद 7–10 की परिस्थितिजन्य रूपरेखा में संभावित/सशर्त घोषणा व्यक्त करती है; यह रूप उस भाव को रखते हुए मूल ‘बोलना/कहना’ के निकट है।
- source_word: עַל
  choice: के विषय में
  rationale: דבר על में इसका अर्थ किसी के विषय में बोलना है; सकारात्मक संदर्भ में ‘के विरुद्ध’ अनुचित शत्रुता जोड़ देता।
- source_word: גּוֹי
  choice: जाति
  rationale: यहाँ גּוֹי एक सामूहिक जन-राजनीतिक इकाई को दर्शाता है; ‘राज्य’ के साथ ‘जाति’ स्पष्ट और प्रचलित बाइबलीय हिन्दी है।
- source_word: מַמְלָכָה
  choice: राज्य
  rationale: מַמְלָכָה का सीधा और स्वाभाविक हिन्दी समतुल्य ‘राज्य’ है।
- source_word: לִבְנֹת
  choice: कि उसे बनाऊँ
  rationale: בנה के निर्माण-बिंब को बनाए रखा गया है। हिन्दी वाक्य में आशय स्पष्ट करने के लिए निहित कर्म ‘उसे’ जोड़ा गया है।
- source_word: וְלִנְטֹעַ
  choice: और रोपूँ
  rationale: נטע के कृषि-बिंब को शाब्दिक और स्वाभाविक हिन्दी ‘रोपना’ से सुरक्षित रखा गया है; संयुक्त उपवाक्य में ‘उसे’ दोनों क्रियाओं पर लागू होता है।
theological_decisions:
- issue: भविष्यवाणी में परमेश्वर की परिस्थितिजन्य प्रतिक्रिया
  choice: ‘मैं ... कह सकता हूँ’ द्वारा परिस्थितिजन्य/संभाव्य घोषणा को बनाए रखना
  alternative: ‘मैं ... कहता हूँ’ अथवा ‘मैं ... कहूँगा’
  rationale: यिर्मयाह 18:7–10 में घोषणाएँ जाति की प्रतिक्रिया से जुड़ी सिद्धान्तात्मक परिस्थितियों के रूप में आती हैं। चयनित रूप परमेश्वर में अनिश्चितता आरोपित किए बिना पाठ की वास्तविक सशर्तता को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘बनाऊँ और रोपूँ’ मूल के निर्माण तथा कृषि-बिंबों को सुरक्षित रखते हैं।
