  language: hi
  text: उठ, कुम्हार के घर नीचे जा; वहाँ मैं तुझे अपने वचन सुनाऊँगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ק֥וּם
  choice: उठ
  rationale: आज्ञार्थक रूप को स्वाभाविक और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וְ/יָרַדְתָּ֖
  choice: और उतर जा
  rationale: यरूशलेम से नीचे जाने की सम्भावित स्थलाकृतिक दिशा सहित ירד के ‘नीचे जाना/उतरना’ अर्थ को बनाए रखता है।
- source_word: בֵּ֣ית הַ/יּוֹצֵ֑ר
  choice: कुम्हार के घर
  rationale: इब्रानी संबंध-वाक्यांश ‘कुम्हार का घर’ को स्वाभाविक हिन्दी में रखता है; अगले प्रसंग में मिट्टी पर काम करने वाला कारीगर होने के कारण ‘कुम्हार’ सटीक है।
- source_word: וְ/שָׁ֖מָּ/ה
  choice: वहाँ
  rationale: स्थान पर बल और घटनाक्रम को संक्षिप्त, स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: אַשְׁמִֽיעֲ/ךָ֥
  choice: मैं तुझे ... सुनाऊँगा
  rationale: שמע के हिफ़ील रूप का कारक भाव हिन्दी की स्वाभाविक क्रिया ‘सुनाना’ में स्पष्ट रूप से व्यक्त होता है।
- source_word: אֶת דְּבָרָֽ/י
  choice: अपने वचन
  rationale: इब्रानी बहुवचन को बनाए रखता है और उसे व्याख्यात्मक एकवचन ‘संदेश’ में नहीं बदलता।
