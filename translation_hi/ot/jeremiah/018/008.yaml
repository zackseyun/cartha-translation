source:
  edition: WLC
  text: וְ/שָׁב֙ הַ/גּ֣וֹי הַ/ה֔וּא מֵ/רָ֣עָת֔/וֹ אֲשֶׁ֥ר דִּבַּ֖רְתִּי עָלָ֑י/ו וְ/נִֽחַמְתִּי֙ עַל הָ֣/רָעָ֔ה אֲשֶׁ֥ר חָשַׁ֖בְתִּי לַ/עֲשׂ֥וֹת לֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/008.yaml
  text: And if that nation turns from its evil[a], against which I spoke[c][b], then I will relent concerning the disaster that I planned to do to it.
translation:
  language: hi
  text: और यदि वह राष्ट्र अपनी बुराई[a] से फिर जाए, जिसके विरुद्ध मैंने कहा था, तो मैं उस विपत्ति[b] को लाने से पीछे हट जाऊँगा[c], जिसे मैंने उस पर लाने की योजना बनाई थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपनी बुराई से लौट आए” अथवा “मन फिराए।” इब्रानी क्रिया का मूल अर्थ “मुड़ना/लौटना” है।
    reason: lexical_alternative
  - marker: b
    text: राष्ट्र की “बुराई” और परमेश्वर द्वारा ठहराई गई “विपत्ति” के लिए इब्रानी में एक ही शब्द-परिवार आया है; पहले स्थान पर अर्थ नैतिक बुराई और दूसरे पर अनिष्ट या विपत्ति है।
    reason: lexical_alternative
  - marker: c
    text: या “मैं अपना मन बदल दूँगा।” इब्रानी अभिव्यक्ति घोषित न्याय को मानवीय परिवर्तन के प्रत्युत्तर में वापस लेने का भाव प्रकट करती है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְשָׁב
  choice: और यदि ... फिर जाए
  rationale: שׁוּב का मूल अर्थ ‘मुड़ना/लौटना’ है। पिछले पद से जुड़े इस शर्तसूचक प्रसंग में हिन्दी में ‘यदि’ स्पष्ट करना स्वाभाविक है; ‘फिर जाए’ नैतिक दिशा-परिवर्तन के रूपक को बनाए रखता है।
- source_word: הַגּוֹי הַהוּא
  choice: वह राष्ट्र
  rationale: גּוֹי का सामान्य अर्थ ‘राष्ट्र’ है और संकेतवाचक पदबंध का सहज हिन्दी रूप ‘वह राष्ट्र’ है।
- source_word: מֵרָעָתוֹ
  choice: अपनी बुराई से
  rationale: यहाँ רָעָה नैतिक बुराई को दर्शाता है। ‘बुराई’ बाद में आए उसी इब्रानी शब्द के विपत्ति-सूचक अर्थ के साथ शब्दगत संबंध भी बनाए रखता है।
- source_word: אֲשֶׁר דִּבַּרְתִּי עָלָיו
  choice: जिसके कारण मैंने उसके विरुद्ध कहा था
  rationale: דִּבֵּר עַל में ‘के विषय में/विरुद्ध कहना’ दोनों भाव संभव हैं। न्याय की घोषणा के प्रसंग में ‘उसके विरुद्ध कहा’ विरोधी बल रखता है; ‘जिसके कारण’ सम्बन्धवाचक उपवाक्य को स्वाभाविक हिन्दी देता है और बुराई को घोषणा का आधार बताता है।
- source_word: וְנִחַמְתִּי
  choice: तो मैं ... लाने से रुक जाऊँगा
  rationale: נחם यहाँ घोषित दण्ड को वापस लेने या उससे विरत होने को दर्शाता है। यह हिन्दी में स्वाभाविक है, परमेश्वर में नैतिक दोष का संकेत नहीं देता, और मानवीय परिवर्तन के प्रति उसकी उत्तरदायी प्रतिक्रिया को बनाए रखता है।
- source_word: עַל הָרָעָה
  choice: उस विपत्ति को
  rationale: यहाँ רָעָה का अर्थ नैतिक बुराई नहीं, बल्कि दण्डस्वरूप विपत्ति है। ‘विपत्ति’ हिन्दी में स्पष्ट है और पहले प्रयोग से अर्थगत भेद दिखाता है।
- source_word: אֲשֶׁר חָשַׁבְתִּי
  choice: जिसे मैंने ... लाने की योजना बनाई थी
  rationale: חָשַׁב यहाँ सोचने से बढ़कर योजना या अभिप्राय का भाव रखता है। ‘योजना बनाई थी’ विचारपूर्वक ठहराए गए कार्य को स्पष्ट करता है।
- source_word: לַעֲשׂוֹת לוֹ
  choice: उस पर लाने की
  rationale: शाब्दिक अर्थ ‘उसके साथ/उसके प्रति करने’ का है, पर विपत्ति के साथ ‘उस पर लाना’ वर्तमान हिन्दी में अधिक स्वाभाविक और अर्थतः सटीक है।
theological_decisions:
- issue: परमेश्वर के लिए נִחַם का अनुवाद
  choice: तो मैं उस विपत्ति को लाने से रुक जाऊँगा
  alternative: तो मैं अपना मन बदल दूँगा / तो मैं पछताऊँगा
  rationale: पद घोषित न्याय से परमेश्वर के उत्तरदायी रूप से विरत होने की बात करता है। चुना हुआ रूप इस वास्तविक शर्त और तनाव को बनाए रखता है, पर ‘पछताना’ से उत्पन्न नैतिक भूल का अनपेक्षित संकेत नहीं देता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। ‘राष्ट्र’, ‘बुराई’ और ‘विपत्ति’ सामान्य पाठक के लिए स्पष्ट हैं। मुख्य वाक्य में इब्रानी की शर्तसूचक संरचना और बुराई/विपत्ति का अर्थगत तनाव सुरक्षित रखा गया है।
