  yaml_path: translation/ot/jeremiah/018/015.yaml
  text: For my people have forgotten me[a]; they burn incense to emptiness. They have stumbled in their ways, in the ancient paths, to walk on side roads[d][c][b], on a road not built up.
translation:
  language: hi
  text: क्योंकि मेरी प्रजा मुझे भूल गई है; वे व्यर्थता के लिए धूप जलाते हैं।[a] उन्हें अपने मार्गों में, प्राचीन पथों में, ठोकर खिलाई गई है,[b] ताकि वे उपपथों पर चलें—ऐसे मार्ग पर जो बनाया नहीं गया है।[d][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मिथ्या के लिए,” “खोखली वस्तु के लिए,” अथवा “मूर्तियों के लिए।” हिब्रू शब्द का अर्थ व्यर्थता या झूठ हो सकता है और वह प्रायः निकम्मी उपासना के लिए प्रयुक्त होता है।
    reason: lexical_alternative
  - marker: b
    text: या “उन्होंने उन्हें अपने मार्गों में, प्राचीन पथों में, ठोकर खिलाई।” हिब्रू में कारक अर्थ है, पर कर्ता स्पष्ट नहीं है।
    reason: alternative_reading
  - marker: c
    text: “प्राचीन पथ” परमेश्वर द्वारा अपनी प्रजा के सामने रखे गए पुराने, स्थापित मार्ग के यिर्मयाह-संबंधी बिंब की प्रतिध्वनि है; यिर्मयाह 6:16 देखें।
    reason: cross_reference
  - marker: d
    text: या “पगडंडियों पर,” “बगल की पगडंडियों पर,” अथवा “अलग पगडंडियों पर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁכֵחֻנִי
  choice: मुझे भूल गई है
  rationale: क्रिया का सीधा अर्थ ‘भूलना’ है। यह परमेश्वर को स्मरण न रखने और उससे विमुख होने की वाचा-संबंधी गंभीरता को बिना अनावश्यक विस्तार के बनाए रखता है।
- source_word: לַשָּׁוְא
  choice: उसके लिए ... जो व्यर्थ है
  rationale: שָׁוְא में व्यर्थता, खोखलापन और मिथ्यापन का अर्थ हो सकता है। यह अभिव्यक्ति मूर्तिपूजक संदर्भ का संकेत देती है, पर मूल पाठ से अधिक स्पष्ट रूप से ‘मूर्तियाँ’ या ‘झूठे देवता’ नहीं जोड़ती।
- source_word: יְקַטֵּרוּ
  choice: धूप जलाते हैं
  rationale: קטר का पिएल रूप इस उपासना-संदर्भ में सामान्यतः धूप जलाने या भेंट को धुआँ करने के लिए आता है; ‘धूप जलाते हैं’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: וַיַּכְשִׁלוּם
  choice: ठोकर खा गए हैं
  rationale: हिब्रू रूप व्याकरणतः कारक अर्थ दे सकता है, पर कर्ता स्पष्ट नहीं है। मुख्य पाठ में परिणामी दशा को स्वाभाविक हिन्दी में रखा गया है और कारक पाठ को पादटिप्पणी में सुरक्षित किया गया है।
- source_word: בְּדַרְכֵיהֶם
  choice: अपने मार्गों में
  rationale: בְּ को मार्ग अथवा आचरण के क्षेत्र के रूप में व्यक्त किया गया है; ‘अपने’ हिन्दी में प्रजा की ओर संकेत को स्पष्ट करता है।
- source_word: שְׁבִילֵי עוֹלָם
  choice: प्राचीन पथों
  rationale: यह लंबे समय से स्थापित मार्गों का बिंब है। ‘प्राचीन पथ’ यिर्मयाह की मार्ग-संबंधी भाषा और यिर्मयाह 6:16 की प्रतिध्वनि बनाए रखता है।
- source_word: נְתִיבוֹת
  choice: बगल की पगडंडियों
  rationale: נתיבות पथ या पगडंडियाँ हो सकती हैं। प्राचीन, स्थापित पथों से विरोध को व्यक्त करने के लिए ‘बगल की पगडंडियाँ’ चुना गया है।
- source_word: דֶּרֶךְ לֹא סְלוּלָה
  choice: ऐसे मार्ग पर जिसे बनाया नहीं गया
  rationale: סלל सड़क को तैयार करने, ऊँचा बाँधने या बनाने का बिंब देता है। यह अनुवाद भौतिक चित्र को सहज आधुनिक हिन्दी में रखता है।
theological_decisions:
- issue: לַשָּׁוְא में उपासना का लक्ष्य
  choice: ‘उसके लिए जो व्यर्थ है’ कहकर व्यापक अर्थ बनाए रखा गया है।
  alternative: ‘मूर्तियों के लिए,’ ‘झूठे देवताओं के लिए,’ या ‘मिथ्या के लिए।’
  rationale: संदर्भ मूर्तिपूजा की ओर संकेत करता है, लेकिन हिब्रू शब्द स्वयं ‘व्यर्थता/मिथ्यापन’ का व्यापक अर्थ रखता है। स्पष्ट ‘मूर्ति’ जोड़ने से पाठ की अर्थ-सीमा अनावश्यक रूप से संकीर्ण हो जाती।
- issue: וַיַּכְשִׁלוּם में कर्ता और कारकता
  choice: मुख्य पाठ में ‘वे ... ठोकर खा गए हैं’ द्वारा परिणाम व्यक्त किया गया है।
  alternative: ‘उन्होंने उन्हें ... ठोकर खिलाई’ अथवा ‘उन्हें ... ठोकर खिलाई गई।’
  rationale: हिब्रू रूप कारक पाठ की अनुमति देता है, पर तत्काल कर्ता अस्पष्ट है। मुख्य पाठ अनिर्दिष्ट कर्ता को आरोपित नहीं करता; पादटिप्पणी रूपगत विकल्प को स्पष्ट रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘धूप जलाते हैं,’ ‘प्राचीन पथ,’ और ‘बगल की पगडंडियाँ’ उपासना तथा मार्ग के मूल बिंबों को बनाए रखते हैं। मुख्य पाठ की विराम-रचना पतन और स्थापित मार्ग छोड़कर असिद्ध पगडंडियों पर चलने के बीच संबंध स्पष्ट करती है।
