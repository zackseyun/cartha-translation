source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֚ה אָמַ֣ר יְהוָ֔ה שַֽׁאֲלוּ נָא֙ בַּ/גּוֹיִ֔ם מִ֥י שָׁמַ֖ע כָּ/אֵ֑לֶּה שַֽׁעֲרֻרִת֙ עָשְׂתָ֣ה מְאֹ֔ד בְּתוּלַ֖ת יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/013.yaml
  text: 'Therefore thus says Yahweh: Ask now among the nations[b][a], who has heard such things? Virgin Israel has done a very horrible thing.'
translation:
  language: hi
  text: 'इसलिए यहोवा यों कहता है: “राष्ट्रों में ज़रा पूछो कि किसने ऐसी बातें सुनी हैं? कुँवारी इस्राएल ने अत्यन्त घोर घिनौना काम किया है।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पद पिछले प्रसंग के आधार पर निकले निष्कर्ष को प्रस्तुत करता है; ‘इसलिए’ स्वाभाविक और स्पष्ट है।
- source_word: כֹּה אָמַר יְהוָה
  choice: यहोवा यों कहता है
  rationale: यह पारंपरिक नबी-संदेश सूत्र को संक्षिप्त और गरिमापूर्ण हिन्दी में रखता है तथा יְהוָה को उसके व्यक्तिगत नाम ‘यहोवा’ से व्यक्त करता है।
- source_word: שַׁאֲלוּ נָא בַּגּוֹיִם
  choice: राष्ट्रों में पूछो
  rationale: बहुवचन आज्ञार्थक क्रिया सार्वजनिक जाँच-पड़ताल का आह्वान करती है। נָא के आग्रह को हिन्दी आज्ञार्थक वाक्य के प्रसंगगत बल में स्वाभाविक रूप से समाहित किया गया है।
- source_word: מִי שָׁמַע כָּאֵלֶּה
  choice: किसने ऐसी बात सुनी है?
  rationale: यह अभूतपूर्व और चौंकाने वाले आचरण पर बल देने वाला आलंकारिक प्रश्न है; ‘ऐसी बात’ तुलनात्मक כָּאֵלֶּה को सहज हिन्दी में व्यक्त करता है।
- source_word: שַׁעֲרֻרִת עָשְׂתָה מְאֹד
  choice: अत्यन्त घिनौना काम किया है
  rationale: दुर्लभ संज्ञा किसी भयावह, घोर अनुचित या विकर्षक कृत्य को सूचित करती है; מְאֹד की तीव्रता ‘अत्यन्त’ से बनी रहती है।
- source_word: בְּתוּלַת יִשְׂרָאֵל
  choice: कुँवारी इस्राएल
  rationale: यह इस्राएल राष्ट्र का स्त्रीरूप मानवीकरण है। मूल में ‘बेटी’ नहीं है, इसलिए उसे नहीं जोड़ा गया।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे आया है; ‘यहोवा’ हिन्दी पाठकों के लिए पहचाना हुआ नामरूप है और नाम को सामान्य उपाधि में नहीं बदलता।
- issue: בְּתוּלַת יִשְׂרָאֵל का मानवीकरण
  choice: कुँवारी इस्राएल
  alternative: इस्राएल की कुँवारी बेटी
  rationale: ‘बेटी’ मूल में अनुपस्थित है। संक्षिप्त रूप राष्ट्रीय मानवीकरण और उसकी साहित्यिक असहजता—दोनों को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; नबी-वाणी के लिए गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज शैली। दुर्लभ हिब्रू अभिव्यक्ति की तीव्रता बचाते हुए अत्यधिक पुरातन शब्दावली से परहेज़ किया गया है।
