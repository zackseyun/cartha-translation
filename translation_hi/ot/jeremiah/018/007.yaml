  text: רֶ֣גַע אֲדַבֵּ֔ר עַל גּ֖וֹי וְ/עַל מַמְלָכָ֑ה לִ/נְת֥וֹשׁ וְ/לִ/נְת֖וֹץ וּֽ/לְ/הַאֲבִֽיד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/007.yaml
  text: At one moment I may speak concerning a nation and concerning a kingdom[a], to uproot and to tear down and to destroy.
translation:
  language: hi
  text: किसी क्षण मैं किसी राष्ट्र और किसी राज्य के विषय में[a] कह सकता हूँ कि उन्हें उखाड़ दूँ, ढा दूँ और नष्ट कर दूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “किसी राष्ट्र और किसी राज्य के विरुद्ध।” आगे आने वाली न्याय-सूचक क्रियाओं के कारण इस पूर्वसर्ग का अर्थ अधिक विरोधात्मक भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רֶגַע
  choice: किसी समय
  rationale: यह क्षण या समय-बिंदु को सूचित करता है और अगले पद में दोहराई गई सामान्य, परिस्थितिनिष्ठ संरचना के अनुकूल है। हिंदी में ‘किसी समय’ यहाँ स्वाभाविक है।
- source_word: אֲדַבֵּר
  choice: मैं ... कह सकता हूँ
  rationale: पिएल अपूर्ण प्रथम पुरुष एकवचन यहाँ पद 7–10 की सामान्य और परिस्थितिनिष्ठ कथन-रचना में है। ‘कह सकता हूँ’ संभाव्य बल को बनाए रखता है, बिना इसे केवल वर्तमान या भूतकाल की एक घटना बनाने के।
- source_word: עַל
  choice: के विषय में
  rationale: דבר के साथ यह ईश्वरीय कथन के विषय को प्रस्तुत कर सकता है। आगे आने वाली विनाश-सूचक क्रियाएँ विरोधी आशय स्पष्ट करती हैं; इसलिए मूल पूर्वसर्ग की व्यापकता बनाए रखी गई है।
- source_word: גּוֹי
  choice: जाति
  rationale: यहाँ शब्द एक राजनीतिक-सामुदायिक इकाई को दर्शाता है; आधुनिक बाइबलीय हिंदी में ‘जाति’ इसका संक्षिप्त और परिचित समतुल्य है।
- source_word: מַמְלָכָה
  choice: राज्य
  rationale: यह राज्य या राजकीय क्षेत्र को दर्शाता है और ‘जाति’ के साथ स्वाभाविक राजनीतिक युग्म बनाता है।
- source_word: לִנְתוֹשׁ
  choice: उखाड़ दूँ
  rationale: क्रिया पौधे को जड़ से निकालने का रूपक रखती है। ‘उखाड़ना’ यिर्मयाह की सजीव छवि को सहज आधुनिक हिंदी में बनाए रखता है।
- source_word: לִנְתוֹץ
  choice: ढा दूँ
  rationale: यह किसी निर्मित वस्तु को गिराने या ध्वस्त करने का अर्थ देता है। ‘ढा देना’ संक्षिप्त, स्वाभाविक और विनाशकारी चित्र के अनुकूल है।
- source_word: וּלְהַאֲבִיד
  choice: नष्ट कर दूँ
  rationale: אבד का हिफ़ील यहाँ किसी को विनाश में डालने का अर्थ देता है। ‘नष्ट करना’ स्पष्ट और व्यापक हिंदी समतुल्य है।
theological_decisions:
- issue: सशर्त/न्याय-संदर्भ में ईश्वरीय कथन के अपूर्ण रूप का बल
  choice: ‘मैं ... कह सकता हूँ’ द्वारा सामान्य और परिस्थितिनिष्ठ संभावना व्यक्त की गई
  alternative: ‘मैं कहता हूँ’ या ‘मैं घोषणा करता हूँ’
  rationale: यह पद राष्ट्रों के प्रति परमेश्वर के घोषित व्यवहार का सामान्य सिद्धांत आरंभ करता है, केवल अतीत के किसी एक कथन का वर्णन नहीं। संभाव्य अभिव्यक्ति हिब्रू के खुले, प्रसंगाधीन बल को बनाए रखती है, पर उससे अधिक निश्चित धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ती।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिंदी। क्रियाओं की त्रयी—‘उखाड़ दूँ, ढा दूँ और नष्ट कर दूँ’—मूल की क्रमिक विनाशकारी छवि और लय को सुरक्षित रखती है।
