  text: לָ/כֵן֩ תֵּ֨ן אֶת בְּנֵי/הֶ֜ם לָ/רָעָ֗ב וְ/הַגִּרֵ/ם֮ עַל יְדֵי חֶרֶב֒ וְ/תִֽהְיֶ֨נָה נְשֵׁי/הֶ֤ם שַׁכֻּלוֹת֙ וְ/אַלְמָנ֔וֹת וְ/אַ֨נְשֵׁי/הֶ֔ם יִֽהְי֖וּ הֲרֻ֣גֵי מָ֑וֶת בַּח֣וּרֵי/הֶ֔ם מֻכֵּי חֶ֖רֶב בַּ/מִּלְחָמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/021.yaml
  text: Therefore give their children over to famine[a], and hand them over to the power of the sword. Let their wives become bereaved and widowed, and let their men be slain by death[c][b], their young men struck down by the sword in battle.
translation:
  language: hi
  text: इसलिए उनके बच्चों[a] को अकाल के हवाले कर दे और उन्हें तलवार के हाथों सौंप दे[b]। उनकी पत्नियाँ अपनी संतान खो बैठें और विधवा हो जाएँ। उनके पुरुष मौत के मारे जाएँ[c], और उनके जवान युद्ध में तलवार से मार गिराए जाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उनके बेटों’। हिब्रू शब्द का अर्थ विशेष रूप से ‘बेटे’ भी हो सकता है, यद्यपि वह सामूहिक रूप से संतान को भी दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘तलवार के हाथों’। यह हिब्रू मुहावरा तलवार की शक्ति के अधीन सौंप दिए जाने को दर्शाता है।
    reason: idiom
  - marker: c
    text: हिब्रू पदबंध शाब्दिक रूप से लगभग ‘मृत्यु के मारे हुए’ है; यह एक कठिन अभिव्यक्ति है जो निश्चित और घातक विनाश का भाव देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पूर्ववर्ती विनती से इस न्याय-विनती का स्पष्ट निष्कर्षात्मक संबंध बनाए रखता है।
- source_word: תֵּן ... לָרָעָב
  choice: अकाल के हवाले कर दे
  rationale: נתן के साथ ל किसी व्यक्ति को किसी विपत्ति या शक्ति के अधीन सौंपने का भाव देता है; यह हिन्दी में स्वाभाविक और प्रबल है।
- source_word: בְּנֵיהֶם
  choice: उनके बच्चों
  rationale: בנים का अर्थ संकीर्ण रूप से ‘बेटे’ हो सकता है, पर यह सामूहिक रूप से संतान के लिए भी प्रयुक्त होता है; मुख्य पाठ में व्यापक अर्थ रखा गया है और विकल्प पादटिप्पणी में दिया गया है।
- source_word: וְהַגִּרֵם עַל יְדֵי חֶרֶב
  choice: उन्हें तलवार के हाथों सौंप दे
  rationale: यह कठिन हिब्रू क्रिया और ‘तलवार के हाथों’ वाली सजीव उपमा—दोनों को बनाए रखते हुए हिंसक विनाश के हवाले किए जाने का भाव व्यक्त करता है।
- source_word: שַׁכֻּלוֹת וְאַלְמָנוֹת
  choice: अपनी संतान खो बैठें और विधवा हो जाएँ
  rationale: שַׁכֻּלוֹת केवल सामान्य शोक नहीं, विशेष रूप से संतान-वियोग को दर्शाता है; हिन्दी में यह अर्थ स्पष्ट और स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: הֲרֻגֵי מָוֶת
  choice: मौत के मारे जाएँ
  rationale: कठिन पदबंध में הרג का ‘मारा जाना’ और מות का ‘मौत’ दोनों सुरक्षित रहते हैं; अभिव्यक्ति की असामान्यता पादटिप्पणी में स्पष्ट की गई है।
- source_word: בַּחוּרֵיהֶם מֻכֵּי חֶרֶב בַּמִּלְחָמָה
  choice: उनके जवान युद्ध में तलवार से मार गिराए जाएँ
  rationale: בחור युद्ध-योग्य आयु के जवान पुरुषों को दर्शाता है और מֻכֵּי חֶרֶב हिंसक रूप से तलवार द्वारा गिराए जाने का भाव रखता है।
theological_decisions:
- issue: परमेश्वर से की गई प्रत्यक्ष दंड-विनती
  choice: आज्ञार्थक और कामनार्थक बल को बिना नरम किए बनाए रखना
  alternative: इसे भविष्यवाणी के कथन में बदल देना या हिंसा को शिष्टोक्ति से हल्का करना
  rationale: हिब्रू में प्रत्यक्ष विनती और कामनार्थक रूप हैं। अनुवाद को भविष्यवक्ता की प्रार्थना का नैतिक और धर्मवैज्ञानिक तनाव सुरक्षित रखना चाहिए, न कि उसे चुपचाप सुलझाना चाहिए।
- issue: הֲרֻגֵי מָוֶת का कठिन अर्थ
  choice: ‘मौत के मारे जाएँ’ के रूप में मूल पदबंध की असामान्यता बनाए रखना
  alternative: ‘मार डाले जाएँ’ या ‘घातक रूप से घायल हों’
  rationale: मूल का शाब्दिक रूप लगभग ‘मृत्यु के मारे हुए’ है। चुना हुआ पाठ fatal destruction को व्यक्त करता है, पर साधन या व्याकरणिक संबंध को आवश्यकता से अधिक निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गंभीर, काव्यात्मक और प्रत्यक्ष प्रार्थना-रजिस्टर अपनाया गया है। ‘कर दे’ और ‘सौंप दे’ मूल के एकवचन प्रत्यक्ष आदेश को दर्शाते हैं। हिंसक भाषा को न तो बढ़ाया गया है, न नरम किया गया है।
