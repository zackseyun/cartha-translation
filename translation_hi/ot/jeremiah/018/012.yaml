  text: וְ/אָמְר֖וּ נוֹאָ֑שׁ כִּֽי אַחֲרֵ֤י מַחְשְׁבוֹתֵ֨י/נוּ֙ נֵלֵ֔ךְ וְ/אִ֛ישׁ שְׁרִר֥וּת לִבּֽ/וֹ הָ/רָ֖ע נַעֲשֶֽׂה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/012.yaml
  text: But they will say[a], ‘It is hopeless, for we will follow our own plans, and each of us will act according to the stubbornness of his evil heart.’
translation:
  language: hi
  text: परन्तु वे कहेंगे,[a] “कोई आशा नहीं! क्योंकि हम अपनी ही योजनाओं के अनुसार चलेंगे, और हममें से हर एक अपने बुरे हृदय के हठ के अनुसार करेगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यह व्यर्थ है” अथवा “कोई उम्मीद नहीं।” इब्रानी अभिव्यक्ति निराशा या भविष्यद्वक्ता की पुकार को निष्फल बताकर ठुकराने—दोनों का भाव दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נוֹאָשׁ
  choice: कोई आशा नहीं
  rationale: यह अभिव्यक्ति निराशा या भविष्यद्वक्ता की पुकार को व्यर्थ बताकर ठुकराने—दोनों का भाव दे सकती है। मुख्य पाठ में संक्षिप्त और स्वाभाविक हिन्दी रखी गई है तथा दूसरा सम्भव भाव पादटिप्पणी में सुरक्षित है।
- source_word: אַחֲרֵי מַחְשְׁבוֹתֵינוּ נֵלֵךְ
  choice: हम अपनी ही योजनाओं पर चलेंगे
  rationale: ‘पीछे चलना’ यहाँ अनुसरण करने या अपने चुने मार्ग पर चलने का मुहावरा है; מַחְשְׁבוֹתֵינוּ का अर्थ यहाँ ‘हमारी योजनाएँ’ स्वाभाविक रूप से व्यक्त होता है।
- source_word: וְאִישׁ
  choice: हममें से हर एक
  rationale: एकवचन का प्रयोग वितरणात्मक है और पूरे समूह के प्रत्येक व्यक्ति को दर्शाता है।
- source_word: שְׁרִרוּת
  choice: हठ
  rationale: यह शब्द अड़ियल स्वेच्छाचारिता और नैतिक रूप से प्रतिरोधी मनोवृत्ति को व्यक्त करता है; ‘हठ’ आधुनिक हिन्दी में संक्षिप्त और स्पष्ट है।
- source_word: לִבּוֹ הָרָע
  choice: अपने बुरे हृदय
  rationale: ‘हृदय’ इब्रानी में विचार, इच्छा और नैतिक अभिप्रेरणा के भीतरी केंद्र को दर्शाता है; ‘बुरा’ मूल पाठ के नैतिक मूल्यांकन को सीधे बनाए रखता है।
- source_word: נַעֲשֶׂה
  choice: काम करेगा
  rationale: עשה का व्यापक अर्थ ‘करना’ है; इस प्रसंग में ‘काम करेगा’ उस आचरण को स्वाभाविक हिन्दी में व्यक्त करता है जो बुरे हृदय की हठ के अनुसार होता है।
theological_decisions:
- issue: लोगों के उत्तर को निराशा मानना या भविष्यद्वक्ता की पुकार को व्यर्थ बताकर ठुकराना
  choice: कोई आशा नहीं
  alternative: यह व्यर्थ है
  rationale: इब्रानी נוֹאָשׁ में निराशा और अपील को निष्फल बताने, दोनों की छाया सम्भव है। मुख्य पाठ निराशापूर्ण अस्वीकार का भाव रखता है, जबकि पादटिप्पणी दूसरे अर्थ को सुरक्षित रखती है; इस प्रकार लोगों की उत्तरदायित्वपूर्ण अवज्ञा को हल्का नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और सामान्य पाठक के लिए सहज शैली। ‘परन्तु’, ‘हृदय’ और ‘के अनुसार’ बाइबलीय गरिमा बनाए रखते हैं, जबकि वाक्य-विन्यास स्वाभाविक हिन्दी का है।
