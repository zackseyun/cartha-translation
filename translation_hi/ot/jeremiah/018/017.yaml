id: JER.18.17
reference: Jeremiah 18:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כְּ/רֽוּחַ קָדִ֥ים אֲפִיצֵ֖/ם לִ/פְנֵ֣י אוֹיֵ֑ב עֹ֧רֶף וְ/לֹֽא פָנִ֛ים אֶרְאֵ֖/ם בְּ/י֥וֹם אֵידָֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/017.yaml
  text: Like an east wind I will scatter them before the enemy[a]; I will show them the back and not the face in the day of their disaster.
translation:
  language: hi
  text: मैं उन्हें पुरवाई की तरह शत्रु के सामने तितर-बितर कर दूँगा; उनकी विपत्ति के दिन मैं उन्हें पीठ दिखाऊँगा, मुख नहीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּרוּחַ קָדִים
  choice: पुरवाई की तरह
  rationale: כְּ उपमा को सूचित करता है और רוּחַ קָדִים पूर्व से आने वाली विनाशकारी हवा है। ‘पुरवाई’ आधुनिक हिंदी में पूर्वी हवा के ठोस बिंब को स्वाभाविक और संक्षिप्त रूप से रखता है।
- source_word: אֲפִיצֵם
  choice: मैं उन्हें तितर-बितर कर दूँगा
  rationale: פוץ का हिफ़ील रूप किसी को बिखेरने या छितरा देने का कारक अर्थ देता है; यह पद न्याय के प्रसंग और हवा के बिंब दोनों के अनुकूल है।
- source_word: לִפְנֵי אוֹיֵב
  choice: शत्रु के सामने
  rationale: इस पदबंध का शाब्दिक अर्थ ‘शत्रु के सामने’ है और प्रसंग में शत्रु के आगे असहाय होकर बिखरने का भाव है।
- source_word: עֹרֶף וְלֹא פָנִים
  choice: पीठ ... मुख नहीं
  rationale: עֹרֶף मूलतः गर्दन का पिछला भाग और विस्तार से पीठ किए होने का बिंब है; פָנִים के साथ इसका विरोध दिव्य अनुग्रहपूर्ण उपस्थिति के हटने को ठोस रूप में व्यक्त करता है। हिंदी में निहित प्रथम पुरुष संबंध क्रिया ‘दिखाऊँगा’ से स्पष्ट हो जाता है।
- source_word: אֶרְאֵם
  choice: मैं उन्हें ... दिखाऊँगा
  rationale: ראה का यह रूप वस्तु और विधेय के साथ ‘दिखाना’ या ‘देखने देना’ अर्थ दे सकता है। यहाँ ‘पीठ दिखाऊँगा, मुख नहीं’ समानांतर बिंब को सहजता से सुरक्षित रखता है।
- source_word: בְּיוֹם אֵידָם
  choice: उनकी विपत्ति के दिन
  rationale: אֵיד विपत्ति, संकट या विनाश को सूचित करता है। यह चयन मूल की समय-सूचक और गंभीर भविष्यद्वाणी शैली को बनाए रखता है।
theological_decisions:
- issue: दिव्य अस्वीकृति के लिए मानवरूपी भाषा
  choice: 'ठोस बिंब बनाए रखा गया: ‘मैं उन्हें पीठ दिखाऊँगा, मुख नहीं।’'
  alternative: ‘मैं उनसे मुँह फेर लूँगा’ या ‘मैं उन पर अनुग्रह नहीं करूँगा।’
  rationale: इब्रानी पाठ न्याय के समय परमेश्वर की कृपापूर्ण उपस्थिति हटने को शारीरिक बिंब से व्यक्त करता है। अमूर्त व्याख्या करने के बजाय मूल तनाव और चित्रात्मकता को रखा गया है।
- issue: עֹרֶף और פָנִים के साथ निहित संबंध
  choice: हिंदी में अलग से ‘अपनी’ जोड़े बिना ‘पीठ ... मुख’ रखा गया।
  alternative: ‘अपनी पीठ ... अपना मुख’
  rationale: इब्रानी संज्ञाओं पर स्पष्ट प्रथम-पुरुष संबंधसूचक प्रत्यय नहीं हैं, यद्यपि वक्ता और ‘दिखाऊँगा’ से संबंध स्पष्ट है। वर्तमान हिंदी कथन स्वाभाविक रहते हुए इस औपचारिक विशेषता को अनावश्यक रूप से स्पष्ट नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘पुरवाई’ काव्यात्मक होते हुए भी प्रचलित है; ‘विपत्ति के दिन’ भविष्यद्वाणी की गंभीरता बनाए रखता है। किसी पाद-टिप्पणी की आवश्यकता नहीं पड़ी।
