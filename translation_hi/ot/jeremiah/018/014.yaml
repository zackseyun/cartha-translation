  text: הֲ/יַעֲזֹ֥ב מִ/צּ֛וּר שָׂדַ֖י שֶׁ֣לֶג לְבָנ֑וֹן אִם יִנָּתְשׁ֗וּ מַ֛יִם זָרִ֥ים קָרִ֖ים נוֹזְלִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/014.yaml
  text: Does the snow of Lebanon leave the rock of the open country? Or are cold[b][a], flowing foreign waters ever uprooted?
translation:
  language: hi
  text: क्या लबानोन की बर्फ खुले देश की चट्टान से हट जाती है?[a] या क्या विदेशी[b], ठंडे, बहते जल कभी उखाड़ दिए जाते हैं?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मैदान की चट्टान,” “खुले प्रदेश की शैल,” या ऐसा ही कोई रूप; इब्रानी पदबंध कठिन है और संभवतः लबानोन की बर्फ से जुड़ी चट्टानी ऊँचाइयों अथवा खुले प्रदेश की छवि जगाता है।
    reason: lexical_alternative
  - marker: b
    text: या “पराए” अथवा “अपरिचित जल।” यह पदबंध संभवतः किसी दूरस्थ स्रोत से आनेवाले जल का संकेत देता है, न कि नैतिक अर्थ में “विदेशी” होने का।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיַעֲזֹב
  choice: क्या ... छोड़ देती है?
  rationale: प्रश्नवाचक कण के साथ क्रिया एक आलंकारिक प्रश्न बनाती है। प्राकृतिक दृश्य में ‘छोड़ देती है’ सहज है और ‘त्याग देती है’ की अपेक्षा कम मानवीकरण करता है।
- source_word: מִצּוּר שָׂדַי
  choice: खुले देश की चट्टान को
  rationale: צוּר का अर्थ ‘चट्टान/शैल’ और שָׂדַי का संबंध ‘मैदान/खुले देश’ से है। कठिन इब्रानी पदबंध की ठोस छवि को बिना अत्यधिक व्याख्या के रखा गया है।
- source_word: שֶׁלֶג לְבָנוֹן
  choice: लबानोन की बर्फ
  rationale: यह सीधा संबंधसूचक पदबंध है; हिन्दी में यह रूप स्वाभाविक और भौगोलिक छवि के अनुरूप है।
- source_word: אִם
  choice: या
  rationale: काव्यात्मक समानांतरता में यह शर्त नहीं, दूसरा आलंकारिक प्रश्न आरम्भ करता है।
- source_word: יִנָּתְשׁוּ
  choice: क्या ... कभी उखाड़ दिया जाता है?
  rationale: נטש के निफ़अल रूप का सामान्य भाव ‘उखाड़ा जाना’ है। जल के लिए यह असामान्य रूपक जानबूझकर बनाए रखा गया है; इसे ‘सूख जाता है’ कहने से मूल से अधिक अर्थ जुड़ता।
- source_word: מַיִם זָרִים
  choice: दूर देश से आनेवाला ... जल
  rationale: זָרִים का मूल भाव ‘पराया/विदेशी’ है, पर यहाँ संभवतः दूरस्थ स्रोत से आनेवाले जल का संकेत है। मुख्य पाठ में अर्थ को स्वाभाविक हिन्दी में व्यक्त किया गया और शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: קָרִים נוֹזְלִים
  choice: ठंडा, बहता जल
  rationale: दोनों विशेषताओं—तापमान और प्रवाह—को स्पष्ट, प्राकृतिक हिन्दी में सुरक्षित रखा गया है।
