- source_word: לֵאמֹר
  choice: इसके बाद आने वाले प्रत्यक्ष कथन को आरम्भ करने वाला विसर्ग-चिह्न
  rationale: इब्रानी का यह infinitive अगले पद में आने वाली वाणी का परिचय देता है। हिन्दी में ‘यह कहते हुए’ जोड़ना अस्वाभाविक होगा; विसर्ग-चिह्न वही संक्रमण संक्षेप और सहजता से व्यक्त करता है।
