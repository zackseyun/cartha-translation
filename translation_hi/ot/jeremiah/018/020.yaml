  text: הַ/יְשֻׁלַּ֤ם תַּֽחַת טוֹבָה֙ רָעָ֔ה כִּֽי כָר֥וּ שׁוּחָ֖ה לְ/נַפְשִׁ֑/י זְכֹ֣ר עָמְדִ֣/י לְ/פָנֶ֗י/ךָ לְ/דַבֵּ֤ר עֲלֵי/הֶם֙ טוֹבָ֔ה לְ/הָשִׁ֥יב אֶת חֲמָתְ/ךָ֖ מֵ/הֶֽם־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/020.yaml
  text: Should evil be repaid for good? For they have dug a pit for my life[a]. Remember that I stood before you to speak good on their behalf[b], to turn your wrath away from them.
translation:
  language: hi
  text: क्या भलाई का बदला बुराई से दिया जाए? क्योंकि उन्होंने मेरे प्राण लेने के लिए गड्ढा खोदा है[a]। याद कर कि मैं तेरे सामने खड़ा हुआ था, उनके पक्ष में भलाई की बात करने के लिए, ताकि तेरा प्रकोप उनसे दूर कर दूँ[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मेरे प्राण के लिए।” यहाँ इब्रानी शब्द मृत्यु के संकट में पड़े व्यक्ति के जीवन या स्वयं व्यक्ति को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद “उनकी भलाई के लिए बोलने के लिए” या “उनके विषय में भली बात कहने के लिए” भी हो सकता है। आशय है कि यिर्मयाह परमेश्वर के सामने उनके पक्ष में विनती कर रहा था।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיְשֻׁלַּם תַּחַת טוֹבָה רָעָה
  choice: क्या भलाई का बदला बुराई से दिया जाए?
  rationale: प्रश्नवाचक הַ और पुअल रूप की कर्मवाच्य रीति को बनाए रखते हुए हिन्दी के स्वाभाविक मुहावरे ‘भलाई का बदला बुराई से’ का प्रयोग किया गया है।
- source_word: כָרוּ שׁוּחָה לְנַפְשִׁי
  choice: उन्होंने मेरे प्राण लेने के लिए गड्ढा खोदा है
  rationale: שׁוּחָה को वास्तविक अथवा फँसाने वाले गड्ढे की छवि सहित रखा गया है। נֶפֶשׁ यहाँ मृत्यु के संकट में पड़े जीवन को सूचित करता है; हिन्दी में ‘मेरे प्राण लेने के लिए’ आशय को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: זְכֹר עָמְדִי לְפָנֶיךָ
  choice: याद कर कि मैं तेरे सामने खड़ा होकर
  rationale: आज्ञार्थक זְכֹר को प्रत्यक्ष प्रार्थना के रूप में ‘याद कर’ और परमेश्वर के सम्मुख मध्यस्थ की मुद्रा को ‘तेरे सामने खड़ा होकर’ से व्यक्त किया गया है।
- source_word: לְדַבֵּר עֲלֵיהֶם טוֹבָה
  choice: उनके पक्ष में भलाई की बात करता था
  rationale: वाक्यांश की कुछ अस्पष्टता बनाए रखते हुए ‘उनके पक्ष में’ मध्यस्थता और ‘भलाई की बात’ उनके हित की वाणी, दोनों को व्यक्त करता है।
- source_word: לְהָשִׁיב אֶת חֲמָתְךָ מֵהֶם
  choice: ताकि तेरा प्रकोप उन पर से फेर दूँ
  rationale: हिफ़ील रूप के कारण-वाचक अर्थ को ‘फेर दूँ’ से और חֵמָה की न्याय-संबंधी तीव्रता को गरिमापूर्ण ‘प्रकोप’ से व्यक्त किया गया है।
theological_decisions:
- issue: נֶפֶשׁ का अर्थ
  choice: मेरे प्राण लेने के लिए
  alternative: मेरे प्राण के लिए / मेरे जीवन के लिए
  rationale: संदर्भ यिर्मयाह की जान के विरुद्ध षड्यंत्र का है, इसलिए इसे देह से अलग अमूर्त ‘आत्मा’ न मानकर संकटग्रस्त जीवन के अर्थ में प्रस्तुत किया गया है।
- issue: ईश्वरीय חֲמָה का अनुवाद
  choice: प्रकोप
  alternative: क्रोध / कोप
  rationale: ‘प्रकोप’ न्यायकारी ईश्वरीय रोष की तीव्रता रखता है, पर पद में उपस्थित अर्थ से आगे कोई विशिष्ट धर्मसैद्धांतिक धारणा नहीं जोड़ता।
- issue: לְדַבֵּר עֲלֵיהֶם טוֹבָה में मध्यस्थता
  choice: उनके पक्ष में भलाई की बात करता था
  alternative: उनकी भलाई के लिए बोलता था / उनके विषय में भली बात कहता था
  rationale: हिब्रू पदबंध उनके हित में अथवा उनके विषय में भली बात कहने—दोनों की छाया रख सकता है; मुख्य पाठ मध्यस्थता का संदर्भ स्पष्ट करता है और पाद-टिप्पणी विकल्प सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण प्रार्थना-प्रधान स्वर रखा गया है। परमेश्वर के लिए एकवचन निकट संबोधन ‘तेरे’ मूल इब्रानी के एकवचन को दर्शाता है। वाक्य सरल है, पर ‘गड्ढा’, ‘सामने खड़ा होना’ और ‘प्रकोप फेरना’ जैसी मूल काव्यात्मक एवं मध्यस्थतापरक छवियाँ सुरक्षित हैं।
