  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। पद के पिछले वाक्य से जुड़े होने को ‘इस तरह’ द्वारा दर्शाया गया है। ‘उपहास की सीटी’ मूल ध्वनि-चित्र को बनाए रखती है, जबकि पादटिप्पणी उस संकेत की व्यापक भाव-सीमा स्पष्ट करती है।
