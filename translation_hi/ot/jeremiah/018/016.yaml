translation:
  language: hi
  text: इस प्रकार उनकी भूमि उजाड़ हो जाएगी और सदा तक उपहास की सीटी का निशाना बनी रहेगी[a]। वहाँ से होकर जाने वाला हर व्यक्ति यह देखकर स्तब्ध रह जाएगा और अपना सिर हिलाएगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल भाषा में उजड़ी हुई भूमि को देखकर उपहास या विस्मय प्रकट करने वाली सीटी अथवा फुफकार का चित्र है।
    reason: lexical_alternative
  - marker: b
    text: सिर हिलाना तिरस्कार, अचरज या विनाश देखकर हुई व्यथा व्यक्त करने वाली भाव-भंगिमा हो सकती है।
    reason: cultural_note
lexical_decisions:
- source_word: לָשׂוּם
  choice: इस तरह … हो जाएगी
  rationale: לְ के साथ infinitive construct पिछले कथन के परिणाम या उद्देश्य को आगे बढ़ाता है। हिन्दी में यह प्रयोग परिणाम को स्वाभाविक ढंग से व्यक्त करता है, पर उद्देश्य की संभावना को पूरी तरह सिद्धांतगत रूप से निर्धारित नहीं करता।
- source_word: אַרְצָם לְשַׁמָּה
  choice: उनकी भूमि उजाड़ हो जाएगी
  rationale: אֶרֶץ का सीधा अर्थ ‘भूमि’ है और שַׁמָּה यहाँ विनाश से उत्पन्न उजाड़ दशा को दर्शाता है।
- source_word: שרוקת עוֹלָם
  choice: सदा उपहास की सीटी का विषय बनी रहेगी
  rationale: שרוקת का संबंध सीटी या सनसनाहट जैसी ध्वनि से है, जो उजड़ी भूमि को देखकर उपहास, अचरज या भय प्रकट कर सकती है। ‘सदा’ עוֹלָם की दीर्घकालिकता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כֹּל עוֹבֵר עָלֶיהָ
  choice: वहाँ से होकर जाने वाला हर व्यक्ति
  rationale: यह पद भूमि के पास से गुजरने वाले प्रत्येक राहगीर को सूचित करता है; हिन्दी में ‘वहाँ से होकर’ अधिक स्वाभाविक है।
- source_word: יִשֹּׁם
  choice: यह देखकर स्तब्ध रह जाएगा
  rationale: שׁמם का यह रूप विनाश को देखकर भय, अचरज या गहरे आघात से स्तब्ध होने की प्रतिक्रिया व्यक्त करता है।
- source_word: וְיָנִיד בְּרֹאשׁוֹ
  choice: और अपना सिर हिलाएगा
  rationale: यह इब्रानी भाव-भंगिमा तिरस्कार, अचरज या व्यथा प्रकट कर सकती है। शाब्दिक चित्र बनाए रखते हुए हिन्दी में ‘सिर हिलाना’ स्वाभाविक है।
