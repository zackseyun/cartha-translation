  text: וְ/עָשָׂ֤ה ה/רעה בְּ/עֵינַ֔/י לְ/בִלְתִּ֖י שְׁמֹ֣עַ בְּ/קוֹלִ֑/י וְ/נִֽחַמְתִּי֙ עַל הַ/טּוֹבָ֔ה אֲשֶׁ֥ר אָמַ֖רְתִּי לְ/הֵיטִ֥יב אוֹתֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/010.yaml
  text: but if it does what is evil in my sight[a], not listening to my voice[b], then I will relent concerning the good that I said I would do to it.
translation:
  language: hi
  text: पर यदि वह मेरी दृष्टि में बुरा काम करे और मेरी बात न माने, तो जिस भलाई की मैंने उससे प्रतिज्ञा की थी कि मैं उसका भला करूँगा, उसे करने से मैं पीछे हट जाऊँगा[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस भलाई के विषय में मैं अपना मन बदल दूँगा।” इब्रानी क्रिया घोषित कार्यवाही से पीछे हटने या मन बदलने का भाव व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה הָרָעָה
  choice: पर यदि वह ... बुरा काम करे
  rationale: वाक्य पिछले पद की शर्त को आगे बढ़ाता है; इसलिए हिन्दी में ‘यदि’ स्पष्ट किया गया है। एकवचन क्रिया का कर्ता पिछले संदर्भ का सामूहिक राष्ट्र या राज्य है, जिसे ‘वह’ से व्यक्त किया गया है।
- source_word: בְּעֵינַי
  choice: मेरी दृष्टि में
  rationale: यह परमेश्वर के मूल्यांकन को व्यक्त करने वाला इब्रानी मुहावरा है; ‘मेरी दृष्टि में’ उसका स्वाभाविक और प्रतिष्ठित हिन्दी रूप है।
- source_word: לְבִלְתִּי שְׁמֹעַ בְּקוֹלִי
  choice: और मेरी बात न माने
  rationale: इब्रानी में शाब्दिक अर्थ ‘मेरी आवाज़ न सुने’ है, पर इस संदर्भ में सुनने का आशय आज्ञा मानना है। ‘मेरी बात न माने’ आधुनिक हिन्दी में यही भाव स्पष्ट करता है।
- source_word: וְנִחַמְתִּי
  choice: मैं पीछे हट जाऊँगा
  rationale: यहाँ נחם घोषित कार्यवाही से पलटने या उसे न करने का निर्णय बताता है। यह रूप परमेश्वर में नैतिक दोष का संकेत दिए बिना प्रतिज्ञात भलाई की वास्तविक शर्तबद्धता बनाए रखता है।
- source_word: עַל הַטּוֹבָה
  choice: जिस भलाई के विषय में
  rationale: עַל यहाँ विचाराधीन विषय को चिह्नित करता है; ‘के विषय में’ घोषित भलाई पर ध्यान बनाए रखता है।
- source_word: לְהֵיטִיב אֹתוֹ
  choice: मैं उसका भला करूँगा
  rationale: יטב के हिफ़ील रूप का अर्थ ‘भलाई करना, लाभ पहुँचाना’ है। ‘उसका भला करूँगा’ अर्थ और सामूहिक एकवचन संदर्भ दोनों को स्वाभाविक हिन्दी में रखता है।
theological_decisions:
- issue: परमेश्वर के लिए נחם का अनुवाद
  choice: उसे करने से मैं पीछे हट जाऊँगा
  alternative: मैं अपना मन बदल दूँगा
  rationale: पद राष्ट्र के आचरण के आधार पर घोषित भलाई को शर्तबद्ध बताता है। मुख्य पाठ घोषित कार्य से पीछे हटने का भाव देता है, जबकि पादटिप्पणी ‘अपना मन बदल दूँगा’ की अधिक सीधी और धर्मवैचारिक रूप से तनावपूर्ण सम्भावना को खुला रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मेरी बात न माने’ शाब्दिक ‘मेरी आवाज़ न सुने’ का अर्थ-संगत हिन्दी मुहावरा है। ‘भलाई’ और ‘भला करूँगा’ की पुनरावृत्ति मूल इब्रानी के शब्द-संबंध को जानबूझकर सुरक्षित रखती है।
