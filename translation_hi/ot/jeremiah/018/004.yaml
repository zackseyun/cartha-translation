  yaml_path: translation/ot/jeremiah/018/004.yaml
  text: And the vessel that he was making from the clay was spoiled in the potter’s hand[a], and he turned and made it into another vessel[b], as seemed right in the potter’s eyes to make.
translation:
  language: hi
  text: और जो बर्तन वह मिट्टी से बना रहा था, वह कुम्हार के हाथ में बिगड़ गया[a]। और उसने उसे फिर दूसरा बर्तन बना दिया—जिसे बनाना कुम्हार को उचित लगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “खराब हो गया,” “नष्ट हो गया,” या “दोषपूर्ण हो गया।” इब्रानी क्रिया बताती है कि बनाते समय बर्तन बिगड़ या दोषपूर्ण हो गया।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “जैसा बनाना कुम्हार की आँखों में ठीक था”; यह मुहावरा उस चीज़ को व्यक्त करता है जिसे कुम्हार ने अपने निर्णय में बनाना उचित समझा।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשְׁחַת
  choice: बिगड़ गया
  rationale: निफ़अल रूप काम करते समय बर्तन के खराब या दोषपूर्ण हो जाने को व्यक्त करता है। ‘बिगड़ गया’ स्वाभाविक हिन्दी है और कारण को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: הַכְּלִי
  choice: बर्तन
  rationale: कुम्हार और मिट्टी के प्रसंग में כְּלִי के लिए ‘बर्तन’ साधारण पाठक के लिए स्वाभाविक और ठोस शब्द है।
- source_word: אֲשֶׁר הוּא עֹשֶׂה בַּחֹמֶר
  choice: जो बर्तन वह मिट्टी से बना रहा था
  rationale: सहभागी रूप עֹשֶׂה जारी प्रक्रिया दिखाता है; ‘बना रहा था’ इस अपूर्ण क्रिया को सुरक्षित रखता है। ‘मिट्टी से’ सामग्री का स्वाभाविक हिन्दी संकेत है।
- source_word: בְּיַד הַיּוֹצֵר
  choice: कुम्हार के हाथ में
  rationale: यह ठोस इब्रानी चित्र को बनाए रखता है और हिन्दी में भी सहज है।
- source_word: וְשָׁב וַיַּעֲשֵׂהוּ
  choice: तब उसने उसी से फिर ... बनाया
  rationale: שׁוּב यहाँ लौटकर या दोबारा काम करने का भाव देता है। ‘उसी से’ कर्म-प्रत्यय का आशय स्पष्ट करता है कि कुम्हार ने उसी बिगड़ी हुई सामग्री को नया रूप दिया, बिना किसी अतिरिक्त वस्तु की कल्पना किए।
- source_word: כְּלִי אַחֵר
  choice: एक दूसरा बर्तन
  rationale: यह नए या भिन्न रूप के बर्तन का सीधा और स्वाभाविक अनुवाद है।
- source_word: כַּאֲשֶׁר יָשַׁר בְּעֵינֵי הַיּוֹצֵר לַעֲשׂוֹת
  choice: जैसा बनाना कुम्हार को उचित लगा
  rationale: ‘आँखों में ठीक’ वाले इब्रानी मुहावरे का स्वाभाविक हिन्दी अर्थ देता है, साथ ही ‘उचित’ मूल के मूल्यांकनात्मक भाव को बनाए रखता है।
theological_decisions:
- issue: कुम्हार के चित्र और आगे आने वाले ईश्वरीय अनुप्रयोग का संबंध
  choice: पद में केवल प्रत्यक्ष कार्यशाला-दृश्य रखा गया है
  alternative: इसे परमेश्वर के लोगों या राष्ट्रों को नया रूप देने के अधिकार की स्पष्ट व्याख्या बनाना
  rationale: इस पद में दृश्य स्वयं ठोस और कथात्मक है; उसका धर्मवैचारिक अनुप्रयोग आगे के प्रसंग में आता है। अनुवाद उस व्याख्या को समय से पहले पद में नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और ठोस कारीगरी-संबंधी भाषा रखी गई है। ‘पात्र’ की अपेक्षा ‘बर्तन’ सामान्य पाठक के लिए अधिक सहज है। विराम और दीर्घ वाक्य-विन्यास को इस तरह रखा गया है कि बिगड़ने और पुनः बनाए जाने की क्रमिकता स्पष्ट रहे।
