id: JER.7.16
reference: Jeremiah 7:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אַתָּ֞ה אַל תִּתְפַּלֵּ֣ל בְּעַד הָ/עָ֣ם הַ/זֶּ֗ה וְ/אַל תִּשָּׂ֧א בַעֲדָ֛/ם רִנָּ֥ה וּ/תְפִלָּ֖ה וְ/אַל תִּפְגַּע בִּ֑/י כִּי אֵינֶ֥/נִּי שֹׁמֵ֖עַ אֹתָֽ/ךְ־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/016.yaml
  text: But as for you[a], do not pray for this people, and do not lift up a cry or prayer on their behalf, and do not intercede with me[b], for I am not listening to you.
translation:
  language: hi
  text: परन्तु तुम इस प्रजा के लिए प्रार्थना मत करो; न उनकी ओर से पुकार या प्रार्थना उठाओ, और न मुझसे विनती करो[a], क्योंकि मैं तुम्हारी नहीं सुन रहा हूँ[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मुझसे आग्रह मत करो” अथवा “मेरे सामने मध्यस्थता मत करो”; इब्रानी क्रिया में आग्रहपूर्वक विनती या मध्यस्थता करने का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “क्योंकि मैं तुम्हारी नहीं सुनूँगा।” इब्रानी कृदन्त वर्तमान में न सुनने का भाव दे सकता है, जबकि सन्दर्भ में इसका भावी परिणाम भी व्यक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: परन्तु तुम
  rationale: संयोजक और स्वतंत्र सर्वनाम यिर्मयाह को विरोधात्मक ढंग से सीधे संबोधित करते हैं; ‘परन्तु तुम’ इस बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אַל תִּתְפַּלֵּל
  choice: प्रार्थना मत करो
  rationale: אַל के साथ अपूर्ण क्रिया स्पष्ट निषेध व्यक्त करती है; यह उसका सहज आधुनिक हिन्दी रूप है।
- source_word: בְּעַד הָעָם הַזֶּה
  choice: इस प्रजा के लिए
  rationale: בְּעַד यहाँ किसी के पक्ष या हित में प्रार्थना करने का अर्थ देता है; ‘के लिए’ संक्षिप्त और स्वाभाविक है।
- source_word: וְאַל תִּשָּׂא ... רִנָּה וּתְפִלָּה
  choice: न ... पुकार या प्रार्थना उठाओ
  rationale: נשא के ‘उठाने’ वाले बिंब को बनाए रखा गया है। רִנָּה की मुखर, याचक पुकार और תְפִלָּה की प्रार्थना—दोनों को अलग रखते हुए निषेधात्मक क्रम में ‘या’ स्वाभाविक है।
- source_word: בַעֲדָם
  choice: उनकी ओर से
  rationale: सर्वनामयुक्त בְּעַד मध्यस्थता या प्रतिनिधि प्रार्थना का भाव स्पष्ट करता है।
- source_word: וְאַל תִּפְגַּע בִּי
  choice: और न मुझसे विनती करो
  rationale: इस प्रार्थना-संदर्भ में פגע का हिफ़ईल रूप आग्रहपूर्वक विनती या मध्यस्थता करने का अर्थ रखता है। ‘विनती करो’ सहज है और क्रिया की संभावित आग्रहपूर्ण तीव्रता को पादटिप्पणी में खुला रखता है।
- source_word: כִּי אֵינֶנִּי שֹׁמֵעַ אֹתָךְ
  choice: क्योंकि मैं तुम्हारी नहीं सुन रहा हूँ
  rationale: निषेध के साथ कृदन्त שֹׁמֵעַ जारी या वर्तमान अस्वीकार को व्यक्त कर सकता है। हिन्दी मुहावरा ‘तुम्हारी सुनना’ याचना स्वीकार करने के भाव को स्वाभाविक रूप से देता है।
theological_decisions:
- issue: यिर्मयाह को मध्यस्थ प्रार्थना करने से रोकने का स्वरूप
  choice: न्याय के इस प्रसंग में प्रजा के लिए मध्यस्थता करने पर परमेश्वर का सीधा और प्रबल निषेध
  alternative: इसे पूर्ण निषेध के बजाय केवल अतिशयोक्तिपूर्ण चेतावनी समझना
  rationale: तीन बार आए निषेध और अन्तिम कारण-वाक्य वास्तविक तथा बलपूर्ण रोक दर्शाते हैं। अनुवाद इसकी कठोरता को बनाए रखता है, पर इससे आगे कोई सम्प्रदायगत निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गम्भीर और प्रत्यक्ष शैली रखी गई है। एकवचन सम्बोधन को प्राकृतिक हिन्दी ‘तुम’ से व्यक्त किया गया है। ‘पुकार या प्रार्थना उठाओ’ मूल इब्रानी बिंब को सुरक्षित रखते हुए समझने योग्य है।
