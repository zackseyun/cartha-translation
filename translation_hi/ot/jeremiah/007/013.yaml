base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/013.yaml
  text: And now[a], because you have done all these deeds, declares Yahweh, and I spoke to you, rising early and speaking, but you did not listen, and I called to you, but you did not answer[b],
translation:
  language: hi
  text: और अब, क्योंकि तुमने ये सब काम किए हैं—यह याहवे की घोषणा है—और मैं सवेरे-सवेरे उठकर तुमसे बोलता रहा[a], पर तुमने नहीं सुना; और मैंने तुम्हें पुकारा, पर तुमने उत्तर नहीं दिया[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू मुहावरे का शाब्दिक भाव है, “सवेरे उठकर बोलना”; इससे तत्परता और बार-बार, लगातार बोलना व्यक्त होता है।
    reason: cultural_note
  - marker: b
    text: इस वाक्य का निष्कर्ष अगले पद में आता है।
    reason: discourse_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: और अब
  rationale: संयोजक וְ और प्रसंग को आगे बढ़ाने वाले עַתָּה, दोनों का बल बनाए रखता है।
- source_word: יַעַן עֲשׂוֹתְכֶם אֶת כָּל הַמַּעֲשִׂים הָאֵלֶּה
  choice: क्योंकि तुमने ये सब काम किए हैं
  rationale: יַעַן के कारणसूचक अर्थ और प्रत्यययुक्त infinitive construct के कार्य को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: נְאֻם יְהוָה
  choice: यह यहोवा की घोषणा है
  rationale: भविष्यद्वाणी के गंभीर उद्घोषणा-सूत्र को व्यक्त करते हुए दिव्य नाम को उपाधि से नहीं बदलता।
- source_word: וָאֲדַבֵּר אֲלֵיכֶם
  choice: मैं तुमसे ... बोलता रहा
  rationale: अगले मुहावरे से व्यक्त बार-बार और लगातार संबोधन को हिन्दी में स्वाभाविक रूप से जोड़ता है।
- source_word: הַשְׁכֵּם וְדַבֵּר
  choice: भोर को उठ-उठकर बोलता रहा
  rationale: मूल हिब्रू बिंब को बनाए रखते हुए क्रिया की पुनरावृत्ति और तत्परता का संकेत देता है।
- source_word: וְלֹא שְׁמַעְתֶּם
  choice: पर तुमने नहीं सुना
  rationale: श्रवण का रूपक बचाता है और आज्ञा न मानने के निहितार्थ को पाठक के लिए खुला रखता है।
- source_word: וָאֶקְרָא אֶתְכֶם
  choice: मैंने तुम्हें पुकारा
  rationale: प्रत्यक्ष दिव्य पुकार अथवा आह्वान को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְלֹא עֲנִיתֶם
  choice: पर तुमने उत्तर नहीं दिया
  rationale: पुकार और उत्तर की संवादात्मक छवि को बनाए रखता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल में व्यक्तिगत दिव्य नाम है; हिन्दी में प्रचलित नाम-रूप ‘यहोवा’ उसे उपाधि से बदले बिना सामान्य पाठकों के लिए पहचानने योग्य रखता है।
- issue: הַשְׁכֵּם וְדַבֵּר मुहावरे का रूप
  choice: मुख्य पाठ में ‘भोर को उठ-उठकर बोलता रहा’
  alternative: बार-बार बोलता रहा / लगातार समझाता रहा
  rationale: मूल बिंब और उसकी सांस्कृतिक बनावट को सुरक्षित रखा गया है; उसके आशय को पादटिप्पणी में स्पष्ट किया गया है।
- issue: שׁמע में सुनने और मानने का संबंध
  choice: सुना
  alternative: माना / ध्यान दिया
  rationale: मूल श्रवण-रूपक और उसमें निहित आज्ञापालन के तनाव को किसी एक व्याख्या में सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण भविष्यद्वाणी-शैली। ‘तुम’ बहुवचन समुदाय को संबोधित करता है। मूल पद की अपूर्ण कारण-वाक्य संरचना और अगले पद से उसका संबंध बनाए रखने के लिए अंत में अल्पविराम रखा गया है।
