id: JER.7.24
reference: Jeremiah 7:24
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/לֹ֤א שָֽׁמְעוּ֙ וְ/לֹֽא הִטּ֣וּ אֶת אָזְנָ֔/ם וַ/יֵּֽלְכוּ֙ בְּ/מֹ֣עֵצ֔וֹת בִּ/שְׁרִר֖וּת לִבָּ֣/ם הָ/רָ֑ע וַ/יִּהְי֥וּ לְ/אָח֖וֹר וְ/לֹ֥א לְ/פָנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/024.yaml
  text: But they did not listen[a], and they did not incline their ear, but walked in their own counsels, in the stubbornness of their evil heart[c][b], and they went backward and not forward.
translation:
  language: hi
  text: पर उन्होंने न सुना[a], न कान लगाया; बल्कि वे अपनी ही युक्तियों[b] और अपने बुरे हृदय की हठ[c] के अनुसार चलते रहे, और आगे नहीं, पीछे की ओर गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उन्होंने ध्यान न दिया”; यहाँ सुनने का अर्थ ऐसी सावधानी से सुनना है जिससे बात मानी जाए।
    reason: lexical_alternative
  - marker: b
    text: या “अपनी ही योजनाओं” अथवा “अपनी ही चालों” के अनुसार।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में “अपने बुरे हृदय की हठ में।” यहाँ “हृदय” केवल भावनाओं को नहीं, बल्कि भीतर की इच्छा और सोच को भी व्यक्त करता है।
    reason: cultural_note
lexical_decisions:
- source_word: שָׁמְעוּ
  choice: न सुना
  rationale: שׁמע यहाँ केवल ध्वनि सुनने के बजाय ध्यान देकर मानने की ओर संकेत करता है। ‘न सुना’ मूल की व्यापकता बनाए रखता है; पादटिप्पणी प्रसंगगत अर्थ स्पष्ट करती है।
- source_word: הִטּוּ אֶת אָזְנָם
  choice: न कान लगाया
  rationale: यह स्वाभाविक हिन्दी मुहावरा ध्यानपूर्वक सुनने के इब्रानी रूपक को बनाए रखता है।
- source_word: וַיֵּלְכוּ
  choice: चलते रहे
  rationale: הלך यहाँ जीवन-व्यवहार या आचरण को दर्शाता है। ‘चलते रहे’ इस रूपक और कथन की निरंतरता दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: בְּמֹעֵצוֹת
  choice: अपनी ही युक्तियों के अनुसार
  rationale: מוֹעֵצוֹת सोच-विचार से बनी सलाहों, योजनाओं या युक्तियों को दर्शाता है। ‘अपनी ही’ लोगों के स्वेच्छाचारी आत्मनिर्देशन को स्पष्ट करता है।
- source_word: בִּשְׁרִרוּת
  choice: हठ के अनुसार
  rationale: यिर्मयाह में שְׁרִרוּת प्रायः अड़ियल स्वेच्छाचारिता को व्यक्त करता है; आधुनिक हिन्दी में ‘हठ’ संक्षिप्त और स्पष्ट है।
- source_word: לִבָּם הָרָע
  choice: अपने बुरे हृदय की
  rationale: ‘हृदय’ मूल रूपक को बनाए रखता है और यहाँ भावना मात्र नहीं, बल्कि भीतर की इच्छा और विचार को भी समेटता है। इब्रानी का सामूहिक एकवचन हिन्दी में भी रखा गया है।
- source_word: וַיִּהְיוּ לְאָחוֹר וְלֹא לְפָנִים
  choice: आगे नहीं, पीछे की ओर गए
  rationale: यह आगे बढ़ने के विपरीत पीछे हटने की दिशात्मक तुलना को स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: ‘बुरे हृदय’ में नैतिक मानव-वर्णन
  choice: पद में दिए गए नैतिक निर्णय को ‘अपने बुरे हृदय’ के रूप में यथावत रखना
  alternative: इसे ‘पापी स्वभाव’ कहना या संपूर्ण मानव-स्वभाव के विषय में व्यापक सिद्धान्त जोड़ना
  rationale: मूल पाठ इन लोगों के हृदय को बुरा और हठी बताता है, पर इससे आगे कोई व्यवस्थित धर्मसैद्धान्तिक दावा नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘कान लगाया’ और ‘चलते रहे’ मूल के रूपकों को स्वाभाविक हिन्दी में बनाए रखते हैं। वाक्य की संयोजक गति और ‘आगे नहीं, पीछे’ का विरोध इब्रानी क्रम के निकट रखा गया है।
