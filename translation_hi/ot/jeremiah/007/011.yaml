  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הַ/מְעָרַ֣ת פָּרִצִ֗ים הָיָ֨ה הַ/בַּ֧יִת הַ/זֶּ֛ה אֲשֶׁר נִקְרָֽא שְׁמִ֥/י עָלָ֖י/ו בְּ/עֵינֵי/כֶ֑ם גַּ֧ם אָנֹכִ֛י הִנֵּ֥ה רָאִ֖יתִי נְאֻם יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/011.yaml
  text: Has this house[a], which is called by my name, become a den of robbers in your eyes? Even I myself, look, I have seen it, declares Yahweh.
translation:
  language: hi
  text: क्या यह भवन, जिस पर मेरा नाम रखा गया है, तुम्हारी दृष्टि में लुटेरों की मांद[a] बन गया है? पर मैं ने भी—देखो—इसे देखा है, याहवे की घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘हिंसक लोगों की गुफा’ अथवा ‘डाकुओं की मांद।’ इब्रानी पदबंध केवल चोरी करने वालों ही नहीं, बल्कि हिंसक और व्यवस्था-विरोधी लोगों पर भी बल दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעָרַת
  choice: मांद
  rationale: यह शब्द गुफानुमा आश्रय या छिपने की जगह को दर्शाता है। ‘मांद’ अपराधियों के सुरक्षित अड्डे की रूपकात्मक छवि को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: פָּרִצִים
  choice: लुटेरों
  rationale: शब्द हिंसक और व्यवस्था-विरोधी लोगों, विशेषकर डाकुओं या लुटेरों, को सूचित कर सकता है। ‘लुटेरों’ मुख्य अर्थ को स्पष्ट करता है, जबकि व्यापक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: הַבַּיִת הַזֶּה
  choice: यह भवन
  rationale: इब्रानी में शाब्दिक अर्थ ‘यह घर/भवन’ है और संदर्भ मंदिर का है। ‘भवन’ मूल रूपक को रखते हुए धार्मिक संरचना के लिए गरिमापूर्ण और सहज है।
- source_word: הָיָה
  choice: बन गया है
  rationale: 'पूर्ण क्रिया यहाँ परिणामी अर्थ दे सकती है: लोगों ने इस भवन को अपराधियों के आश्रय जैसा बना दिया है। यह अर्थ केवल ‘है’ की अपेक्षा प्रसंग में अधिक प्रभावी है।'
- source_word: נִקְרָא שְׁמִי עָלָיו
  choice: जो मेरे नाम से कहलाता है
  rationale: यह परमेश्वर के नाम, स्वामित्व और संबंध का पारंपरिक इब्रानी मुहावरा है। हिन्दी में यह रूप स्पष्ट है और मूल अभिव्यक्ति को निकटता से रखता है।
- source_word: בְּעֵינֵיכֶם
  choice: तुम्हारी दृष्टि में
  rationale: यह मूल्यांकन-सूचक मुहावरे का स्वाभाविक हिन्दी रूप है और लोगों के अपने आकलन पर प्रश्न का बल बनाए रखता है।
- source_word: גַּם אָנֹכִי הִנֵּה רָאִיתִי
  choice: देखो, मैंने स्वयं भी यह देखा है
  rationale: ‘देखो’ ध्यान आकर्षित करता है; ‘स्वयं भी’ אָנֹכִי और גַּם का संयुक्त बल व्यक्त करता है; ‘यह’ संदर्भ में निहित कर्म को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: נְאֻם יְהוָה
  choice: याहवे की घोषणा है
  rationale: यह मानक भविष्यद्वक्तीय सूत्र है। ‘घोषणा’ उसकी अधिकारपूर्ण गंभीरता बनाए रखता है और יְהוָה को उसके व्यक्तिगत नाम के रूप में लिप्यंतरित किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम है। ‘याहवे’ उसका निकट लिप्यंतरण है; इसे किसी उपाधि से नहीं बदला गया।
- issue: मंदिर-संबंधी आरोप में הָיָה का अर्थ
  choice: बन गया है
  alternative: है
  rationale: इब्रानी पूर्ण क्रिया यहाँ स्थिति या उस स्थिति में आ जाने—दोनों की संभावना रखती है। प्रसंग में ‘बन गया है’ मंदिर के अपराधियों के आश्रय के रूप में उपयोग होने का परिणामी भाव व्यक्त करता है, पर आरोप को अतिरिक्त सिद्धांत से नहीं भरता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘भवन’ मूल ‘घर’ की छवि को बचाता है और संदर्भ में मंदिर को स्पष्ट रूप से सूचित करता है। प्रश्न की तीखी भविष्यद्वक्तीय शैली तथा ‘देखो’ और ‘स्वयं भी’ का बल सुरक्षित रखा गया है।
