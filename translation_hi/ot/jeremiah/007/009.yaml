base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/009.yaml
  text: Will you steal[a], murder, commit adultery, swear falsely, burn incense to Baal[b], and go after other gods that you have not known—
translation:
  language: hi
  text: क्या तुम चोरी करोगे, हत्या करोगे, व्यभिचार करोगे, झूठी शपथ खाओगे, बाल के लिए धूप जलाओगे और दूसरे देवताओं के पीछे चलोगे[a], जिन्हें तुम नहीं जानते थे[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दूसरे देवताओं का अनुसरण करोगे।”
    reason: הלך אחרי के शाब्दिक ‘पीछे चलना’ और उसके निष्ठा-सूचक अर्थ—‘अनुसरण करना’—दोनों संभव हैं।
  - marker: b
    text: “नहीं जानते थे” का अर्थ “जिनसे तुम परिचित नहीं थे” या, अर्थ की दृष्टि से, “जिन्हें तुमने स्वीकार नहीं किया था” भी हो सकता है।
    reason: ידע ज्ञान, परिचय, संबंध या मान्यता के भाव रख सकता है; मुख्य पाठ इस बहुअर्थकता को संकरा नहीं करता।
lexical_decisions:
- source_word: הֲ/גָנֹב רָצֹחַ
  choice: क्या तुम चोरी और हत्या करोगे
  rationale: प्रश्नवाचक הֲ और क्रियात्मक infinitive-श्रृंखला यहाँ आलंकारिक प्रश्न आरम्भ करती है। רצח सामान्यतः अनुचित या अपराधपूर्ण ढंग से प्राण लेने को दर्शाता है, इसलिए ‘हत्या’ उपयुक्त है।
- source_word: וְ/נָאֹף
  choice: व्यभिचार करोगे
  rationale: נאף वैवाहिक बेवफाई के विशिष्ट अर्थ में ‘व्यभिचार करना’ है; यह आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: וְ/הִשָּׁבֵעַ לַ/שֶּׁקֶר
  choice: झूठी शपथ खाओगे
  rationale: यह पदबंध झूठी बात की शपथ लेने या झूठी गवाही को शपथ से पुष्ट करने का भाव रखता है। ‘झूठी शपथ खाना’ कानूनी और नैतिक दोनों अर्थों को बनाए रखता है।
- source_word: וְ/קַטֵּר לַ/בָּעַל
  choice: बाल के लिए धूप जलाओगे
  rationale: उपासना-संबंधी प्रसंग में קטר धूप अथवा धूम-भेंट जलाने को दर्शाता है। לַבָּעַל में बाल इस देवता का प्रचलित नाम है।
- source_word: וְ/הָלֹךְ אַחֲרֵי אֱלֹהִים אֲחֵרִים
  choice: दूसरे देवताओं के पीछे चलोगे
  rationale: הלך אחרי का शाब्दिक रूप ‘पीछे चलना’ है और यहाँ धार्मिक निष्ठा या अनुसरण का भाव भी रखता है। हिन्दी अभिव्यक्ति दोनों स्तरों को सुरक्षित रखती है।
- source_word: אֲשֶׁר לֹא יְדַעְתֶּם
  choice: जिन्हें तुम नहीं जानते थे
  rationale: ידע का मूल अर्थ ‘जानना’ है, पर इस प्रसंग में पहचान, स्वीकार या अनुभवगत संबंध का संकेत भी संभव है। मुख्य पाठ व्यापक और अधिक प्रत्यक्ष अर्थ को रखता है।
theological_decisions:
- issue: दूसरे देवताओं को ‘जानने’ का स्वरूप
  choice: जिन्हें तुम नहीं जानते थे
  alternative: जिन्हें तुमने नहीं माना था / जिनसे तुम परिचित नहीं थे
  rationale: ידע को केवल मानसिक जानकारी या केवल उपासना में स्वीकार करने तक सीमित करने से अर्थ अनावश्यक रूप से संकरा हो जाएगा। ‘जानते थे’ मूल की संबंधपरक और व्यंग्यात्मक संभावनाओं को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। मूल की आलंकारिक प्रश्न-श्रृंखला तथा अगले पद तक बढ़ते वाक्य को दिखाने के लिए अंत में दीर्घ डैश रखा गया है। अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्नों की स्थिति विषयवस्तु से मेल नहीं खाती थी; हिन्दी में उन्हें संबंधित पदबंधों के साथ रखा गया है।
