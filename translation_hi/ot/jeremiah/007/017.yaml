  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। परमेश्वर द्वारा यिर्मयाह को किए गए एकवचन संबोधन के लिए ‘तू’ रखा गया है; यह मूल के निकट है और प्रश्न की प्रत्यक्षता बनाए रखता है।
