base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/017.yaml
  text: Do you not see what they are doing in the cities of Judah and in the streets of Jerusalem?[a]
translation:
  language: hi
  text: क्या तू नहीं देखता कि वे यहूदा के नगरों में और यरूशलेम की सड़कों[a] पर क्या कर रहे हैं?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘चौकों’ अथवा ‘खुले स्थानों’ में।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֵינְךָ רֹאֶה
  choice: क्या तू नहीं देखता
  rationale: नकारात्मक प्रश्न के आलंकारिक बल और यिर्मयाह को किए गए सीधे एकवचन संबोधन को सुरक्षित रखता है। ‘देखता’ दृश्य रूप से देखने और समझने, दोनों की संभावना खुली रखता है।
- source_word: מָה הֵמָּה עֹשִׂים
  choice: वे ... क्या कर रहे हैं
  rationale: स्वतंत्र सर्वनाम הֵמָּה को ‘वे’ और वर्तमान कृदंत עֹשִׂים को जारी वर्तमान क्रिया ‘कर रहे हैं’ से स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: בְּעָרֵי יְהוּדָה
  choice: यहूदा के नगरों
  rationale: सम्बन्धवाचक संरचना और स्थान-सूचक अर्थ को सीधे तथा गरिमापूर्ण आधुनिक हिन्दी में प्रस्तुत करता है। परसर्ग ‘में’ संयुक्त पदों ‘नगरों और ... सड़कों’ पर अंत में लागू है।
- source_word: וּבְחֻצוֹת יְרוּשָׁלִָם
  choice: और यरूशलेम की सड़कों[a] पर
  rationale: חֻצוֹת के सामान्य नगरीय अर्थ के लिए ‘सड़कों’ स्वाभाविक है; ‘चौकों’ अथवा ‘खुले स्थानों’ की शाब्दिक संभावना पादटिप्पणी में सुरक्षित रखी गई है।
