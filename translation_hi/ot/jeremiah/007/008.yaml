lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह शब्द श्रोताओं का ध्यान जोर देकर खींचता है; ‘देखो’ आधुनिक हिन्दी में स्वाभाविक और प्रभावपूर्ण है।
- source_word: בֹּטְחִים
  choice: भरोसा कर रहे हो
  rationale: इब्रानी कृदन्त जारी या सामान्य व्यवहार का संकेत देता है; यह रूप उस निरन्तर भरोसे को स्पष्ट करता है।
- source_word: לָכֶם
  choice: अलग से अनूदित नहीं
  rationale: यह सर्वनाम यहाँ भरोसा करने की क्रिया के साथ मुहावरेदार ढंग से जुड़ा है; हिन्दी में इसे अलग से ‘अपने लिए’ कहना अनावश्यक और अस्वाभाविक होगा।
- source_word: עַל
  choice: पर
  rationale: ‘भरोसा करना’ के साथ ‘पर’ स्वाभाविक हिन्दी प्रयोग है और निर्भरता का भाव बनाए रखता है।
- source_word: דִּבְרֵי הַשָּׁקֶר
  choice: झूठी बातें
  rationale: यह पद उन कथनों को दर्शाता है जिनका चरित्र झूठ या छल है; ‘झूठी बातें’ साधारण आधुनिक हिन्दी में स्पष्ट है और मूल की नैतिक तीव्रता बनाए रखता है।
- source_word: לְבִלְתִּי הוֹעִיל
  choice: पर इससे कोई लाभ नहीं होता
  rationale: यह नकारात्मक उपयोगिता या निष्फल परिणाम व्यक्त करता है। स्वतंत्र उपवाक्य हिन्दी में स्वाभाविक रहते हुए बातों को कृत्रिम ढंग से ‘लाभ पहुँचाने’ वाली कर्ता नहीं बनाता।
