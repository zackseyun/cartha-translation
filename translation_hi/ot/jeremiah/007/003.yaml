source:
  edition: WLC
  text: כֹּֽה אָמַ֞ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הֵיטִ֥יבוּ דַרְכֵי/כֶ֖ם וּ/מַֽעַלְלֵי/כֶ֑ם וַ/אֲשַׁכְּנָ֣ה אֶתְ/כֶ֔ם בַּ/מָּק֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/003.yaml
  text: 'Thus says Yahweh of hosts[a], the God of Israel: Make your ways and your deeds good[b], and I will let you dwell in this place.'
translation:
  language: hi
  text: 'सेनाओं का यहोवा, इस्राएल का परमेश्वर, यों कहता है: अपने चालचलन और अपने कामों को सुधारो[a], और मैं तुम्हें इस स्थान में रहने दूँगा[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपने चालचलन और अपने कामों को अच्छा करो।”
    reason: lexical_alternative
  - marker: b
    text: या, “मैं तुम्हें इस स्थान में बसाऊँगा”; अथवा, “मैं तुम्हें इस स्थान में बने रहने दूँगा।”
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: यों कहता है
  rationale: यह नबी-संदेश का प्रचलित सूत्र है; हिन्दी में स्वाभाविक रहते हुए मूल की औपचारिक घोषणा-शैली को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण द्वारा प्रस्तुत किया गया है।
- source_word: צְבָאוֹת
  choice: सेनाओं का
  rationale: दैवी उपाधि में यह बहुवचन सैन्य दलों और स्वर्गीय सेनाओं की व्यापक धारणा को बनाए रखता है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल का परमेश्वर
  rationale: मूल समास का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: הֵיטִיבוּ דַרְכֵיכֶם וּמַעַלְלֵיכֶם
  choice: अपने चालचलन और अपने कामों को सुधारो
  rationale: हिफ़ील आज्ञार्थक का सक्रिय नैतिक सुधार का भाव व्यक्त करता है। ‘चालचलन’ जीवन-पद्धति के रूपक और ‘काम’ ठोस कर्मों के भेद को सहज हिन्दी में रखता है।
- source_word: וַאֲשַׁכְּנָה אֶתְכֶם
  choice: तब मैं तुम्हें ... रहने दूँगा
  rationale: שכן के हिफ़ील में ‘बसाना’ अथवा ‘रहने देना’ दोनों संभव हैं। प्रसंग में पश्चाताप की शर्त पर उसी स्थान में बने रहने की अनुमति का भाव अधिक उपयुक्त है, जबकि विकल्प पादटिप्पणी में सुरक्षित हैं।
- source_word: בַּמָּקוֹם הַזֶּה
  choice: इस स्थान में
  rationale: ‘स्थान’ मूल की जानबूझकर व्यापकता को बनाए रखता है; इसे केवल मंदिर, यरूशलेम या देश तक सीमित नहीं करता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: हिन्दी बाइबलीय प्रयोग में पहचाना जाने वाला व्यक्तिगत नाम रखा गया है; ‘प्रभु’ जैसी उपाधि से नाम को प्रतिस्थापित नहीं किया गया।
- issue: וַאֲשַׁכְּנָה אֶתְכֶם का वाचा-संबंधी अर्थ
  choice: मैं तुम्हें इस स्थान में रहने दूँगा
  alternative: मैं तुम्हें इस स्थान में बसाऊँगा / बने रहने दूँगा
  rationale: यह रूप परमेश्वर की निर्णायक भूमिका और लोगों के उसी स्थान में निरंतर निवास—दोनों के बीच मूल तनाव को खुला रखता है; संभावित कारक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘यों कहता है’ भविष्यद्वक्ताओं की औपचारिक घोषणा-ध्वनि को बनाए रखता है। ‘चालचलन’ नैतिक जीवन-पद्धति के अर्थ में प्रयुक्त है और ‘कामों’ के साथ मूल की समानांतर संरचना को सुरक्षित रखता है।
