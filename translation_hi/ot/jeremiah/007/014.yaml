  text: וְ/עָשִׂ֜יתִי לַ/בַּ֣יִת אֲשֶׁ֧ר נִֽקְרָא שְׁמִ֣/י עָלָ֗י/ו אֲשֶׁ֤ר אַתֶּם֙ בֹּטְחִ֣ים בּ֔/וֹ וְ/לַ֨/מָּק֔וֹם אֲשֶׁר נָתַ֥תִּי לָ/כֶ֖ם וְ/לַ/אֲבֽוֹתֵי/כֶ֑ם כַּ/אֲשֶׁ֥ר עָשִׂ֖יתִי לְ/שִׁלֽוֹ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/014.yaml
  text: So I will do to the house that is called by my name[a], in which you trust, and to the place that I gave to you and to your fathers[b], just as I did to Shiloh.
translation:
  language: hi
  text: इसलिए मैं उस भवन के साथ भी वैसा ही करूँगा, जिस पर मेरा नाम रखा गया है[a] और जिस पर तुम भरोसा रखते हो, और उस स्थान के साथ भी जो मैंने तुम्हें और तुम्हारे पुरखाओं को दिया है, जैसा मैंने शीलो[b] के साथ किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “जिस पर मेरा नाम पुकारा जाता है।” यह हिब्रू मुहावरा बताता है कि वह भवन यहोवा का है और उसके नाम से पहचाना जाता है।
    reason: lexical_alternative
  - marker: b
    text: शीलो पहले का पवित्रस्थान था; उसका विनाश चेतावनी का उदाहरण था। 1 शमूएल 4 और यिर्मयाह 7:12 देखें।
    reason: cross_reference
lexical_decisions:
- source_word: וְעָשִׂיתִי
  choice: इसलिए ... मैं वैसा ही करूँगा
  rationale: वाव इस वचन को पिछले न्याय-संदेश से जोड़ता है; ‘इसलिए’ प्रसंग का परिणामसूचक बल स्वाभाविक हिन्दी में व्यक्त करता है। ‘करूँगा’ का आशय आगे आए शीलो-वाले न्याय से पूरा होता है।
- source_word: לַבַּיִת
  choice: जिस भवन पर
  rationale: בַּיִת का मूल अर्थ ‘घर/भवन’ है। यहाँ मंदिर का भवन अभिप्रेत है; ‘भवन’ हिन्दी में गरिमापूर्ण है और ‘स्थान’ से उसका शाब्दिक भेद बनाए रखता है।
- source_word: אֲשֶׁר נִקְרָא שְׁמִי עָלָיו
  choice: जिस भवन पर मेरा नाम पुकारा जाता है
  rationale: हिब्रू की कर्मवाच्य अभिव्यक्ति और עָלָיו (‘उस पर’) को निकटता से सुरक्षित रखा गया है। यह मुहावरा भवन का यहोवा से संबंध और उसके अधिकार में होना सूचित करता है; अर्थ को मुख्य पाठ में अधिक स्पष्ट करके तनाव मिटाया नहीं गया।
- source_word: אֲשֶׁר אַתֶּם בֹּטְחִים בּוֹ
  choice: जिस पर तुम भरोसा रखते हो
  rationale: בֹּטְחִים कृदंत निरंतर भरोसे की अवस्था दिखाता है। ‘भरोसा रखते हो’ वर्तमान और जारी निर्भरता को सहज हिन्दी में व्यक्त करता है।
- source_word: וְלַמָּקוֹם
  choice: और जिस स्थान को
  rationale: ‘स्थान’ मंदिर-भवन से अलग व्यापक स्थल को दर्शाता है और मूल पाठ में ‘भवन’ तथा ‘स्थान’ के भेद को बनाए रखता है।
- source_word: אֲשֶׁר נָתַתִּי לָכֶם וְלַאֲבוֹתֵיכֶם
  choice: जिस स्थान को मैंने तुम्हें और तुम्हारे पुरखाओं को दिया था
  rationale: ‘पुरखाओं’ से covenantal पूर्वजों का भाव आधुनिक, सामान्य हिन्दी में स्पष्ट होता है। पूर्ण क्रिया ‘दिया था’ वर्तमान न्याय से पहले दिए जाने को स्वाभाविक रूप से दर्शाती है।
- source_word: כַּאֲשֶׁר עָשִׂיתִי לְשִׁלֹה
  choice: वैसा ही करूँगा जैसा मैंने शीलो के साथ किया था
  rationale: तुलनात्मक संरचना को हिन्दी में पूर्ण और स्वाभाविक बनाया गया है। ‘शीलो’ स्थाननाम का प्रचलित देवनागरी लिप्यंतरण है; उसके साथ हुए कार्य को मूल की तरह स्पष्ट नहीं किया गया।
theological_decisions:
- issue: वाचा-संबंधी पवित्रस्थान की भाषा
  choice: ‘भवन’ और ‘स्थान’ को अलग शब्दों के रूप में बनाए रखना
  alternative: दोनों को ‘मंदिर’ या ‘पवित्रस्थान’ कहना
  rationale: मूल पाठ मंदिर के भवन और व्यापक स्थान में भेद करता है। यह भेद न्याय की व्यापकता बनाए रखता है और पाठ में अतिरिक्त धर्मवैज्ञानिक विशिष्टता नहीं जोड़ता।
- issue: ‘मेरा नाम पुकारा जाता है’ मुहावरे का अनुवाद
  choice: मुख्य पाठ में अपेक्षाकृत शाब्दिक रूप, अर्थ की व्याख्या पादटिप्पणी में
  alternative: ‘जो मेरे नाम से कहलाता है’
  rationale: शाब्दिक रूप हिब्रू की वास्तविक संरचना और स्वामित्व/पहचान के मुहावरे को सुरक्षित रखता है; पादटिप्पणी साधारण पाठक को अर्थ स्पष्ट करती है।
- issue: אֲבוֹתֵיכֶם का संबोधन
  choice: तुम्हारे पुरखाओं
  alternative: तुम्हारे पितरों / तुम्हारे पूर्वजों
  rationale: ‘पुरखाओं’ में स्रोत का पुरुष-वाचक ऐतिहासिक रंग बना रहता है, पर आधुनिक हिन्दी में ‘पितरों’ से जुड़े अनुष्ठानिक अर्थ से बचते हुए सामान्य पाठक के लिए सहज रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। वाक्य में भविष्य के न्याय को अंत में ‘शीलो’ की तुलना से स्पष्ट किया गया है। सभी पादटिप्पणी चिह्न मुख्य पाठ में सम्मिलित हैं।
