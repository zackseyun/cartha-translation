  text: כִּ֣י לְכוּ נָ֗א אֶל מְקוֹמִ/י֙ אֲשֶׁ֣ר בְּ/שִׁיל֔וֹ אֲשֶׁ֨ר שִׁכַּ֧נְתִּֽי שְׁמִ֛/י שָׁ֖ם בָּ/רִֽאשׁוֹנָ֑ה וּ/רְאוּ֙ אֵ֣ת אֲשֶׁר עָשִׂ֣יתִי ל֔/וֹ מִ/פְּנֵ֕י רָעַ֖ת עַמִּ֥/י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/012.yaml
  text: For go now to my place that was in Shiloh[a], where I made my name dwell at first, and see what I did to it because of the evil of my people Israel.
translation:
  language: hi
  text: क्योंकि अब तुम मेरे उस स्थान पर जाओ जो शीलो में था, जहाँ मैंने आरम्भ में अपने नाम को वहाँ निवास कराया था[a], और देखो कि अपनी प्रजा इस्राएल की बुराई के कारण मैंने उसका क्या किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जहाँ मैंने अपने नाम को वहाँ बसाया था”; अधिक पारम्परिक रूप में, “जहाँ मैंने अपना नाम स्थापित किया था।” इब्रानी में परमेश्वर के नाम के वहाँ वास करने की छवि है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले प्रसंग में दी गई चेतावनी का आधार प्रस्तुत करता है; ‘क्योंकि’ इसके कारणसूचक बल को स्वाभाविक हिन्दी में रखता है।
- source_word: לְכוּ נָא
  choice: अब तुम ... जाओ
  rationale: बहुवचन आज्ञार्थक के साथ נָא यहाँ विनम्र अनुरोध से अधिक तात्कालिक आग्रह व्यक्त करता है; ‘अब’ उस बल को स्पष्ट करता है।
- source_word: מְקוֹמִי אֲשֶׁר בְּשִׁלוֹ
  choice: शीलो में मेरे उस स्थान
  rationale: ‘मेरा स्थान’ परमेश्वर से सम्बद्ध उपासना-स्थल को सीधे व्यक्त करता है; ‘उस’ ऐतिहासिक स्थान की पहचान को सहज बनाता है, जबकि हिन्दी में अलग से भूतकाल जोड़ना आवश्यक नहीं।
- source_word: שִׁכַּנְתִּי שְׁמִי שָׁם
  choice: जहाँ ... मैंने अपने नाम को वास कराया था
  rationale: यह שכן के सकर्मक रूप और ‘मेरे नाम’ की मूल निवास-छवि को सुरक्षित रखता है, बिना इसे केवल ‘नाम रखा’ कहकर सपाट बनाए।
- source_word: בָּרִאשׁוֹנָה
  choice: आरम्भ में
  rationale: शीलो को पहले के पवित्रस्थान के रूप में दिखाने वाले कालगत अर्थ को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וּרְאוּ
  choice: और देखो
  rationale: आगे आने वाली बहुवचन आज्ञा को सीधे रखता है और ऐतिहासिक परिणाम पर विचार करने का आह्वान व्यक्त करता है।
- source_word: אֵת אֲשֶׁר עָשִׂיתִי לוֹ
  choice: मैंने उसका क्या किया
  rationale: सर्वनाम का निकटतम और सबसे स्वाभाविक संकेत ‘मेरे स्थान’ की ओर है; ‘उसका’ हिन्दी में उस स्थान और वहाँ के पवित्रस्थान दोनों को समेट सकता है।
- source_word: מִפְּנֵי רָעַת עַמִּי יִשְׂרָאֵל
  choice: अपनी प्रजा इस्राएल की बुराई के कारण
  rationale: מִפְּנֵי का कारणसूचक अर्थ और רָעָה का यहाँ नैतिक बुराई वाला अर्थ स्पष्ट रहता है।
theological_decisions:
- issue: שִׁכַּנְתִּי שְׁמִי שָׁם में परमेश्वर की उपस्थिति की भाषा
  choice: मैंने अपने नाम को वास कराया था
  alternative: मैंने अपना नाम स्थापित किया था
  rationale: चुना गया अनुवाद परमेश्वर के नाम के ‘वास’ की इब्रानी छवि और वाचा-संबंधी उपस्थिति को बनाए रखता है, पर परमेश्वर के सम्पूर्ण अस्तित्व को किसी स्थान तक सीमित नहीं बताता।
- issue: शीलो वाले उपवाक्य का कालगत आशय
  choice: शीलो में मेरे उस स्थान पर
  alternative: मेरे उस स्थान पर, जो शीलो में था
  rationale: सन्दर्भ शीलो के पूर्व पवित्रस्थान और उसके न्याय का उदाहरण देता है। हिन्दी में ‘उस स्थान’ और ‘आरम्भ में ... था’ से ऐतिहासिक आशय स्पष्ट है; अलग भूतकाल-सापेक्ष उपवाक्य जोड़ने से वाक्य अनावश्यक रूप से भारी होता।
translation_notes:
  register: आधुनिक मानक हिन्दी; आदरपूर्ण, सहज और सार्वजनिक पाठ के योग्य शैली। परमेश्वर के संबोधन में मूल बहुवचन आज्ञा को ‘तुम’ से व्यक्त किया गया है। ‘शीलो’ प्रचलित हिन्दी बाइबलीय नामरूप है।
