id: JER.7.34
reference: Jeremiah 7:34
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הִשְׁבַּתִּ֣י מֵ/עָרֵ֣י יְהוּדָ֗ה וּ/מֵֽ/חֻצוֹת֙ יְר֣וּשָׁלִַ֔ם ק֤וֹל שָׂשׂוֹן֙ וְ/ק֣וֹל שִׂמְחָ֔ה ק֥וֹל חָתָ֖ן וְ/ק֣וֹל כַּלָּ֑ה כִּ֥י לְ/חָרְבָּ֖ה תִּהְיֶ֥ה הָ/אָֽרֶץ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/034.yaml
  text: And I will put an end[a], from the cities of Judah and from the streets of Jerusalem, to the sound of joy and the sound of gladness, the voice of the bridegroom and the voice of the bride[c][b], for the land will become a ruin.
translation:
  language: hi
  text: और मैं यहूदा के नगरों और यरूशलेम की सड़कों[a] से हर्ष की ध्वनि और आनंद की ध्वनि[b], दूल्हे की आवाज़ और दुल्हन की आवाज़ बंद कर दूँगा, क्योंकि यह देश उजाड़[c] हो जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यरूशलेम के चौकों”; इब्रानी शब्द सड़कों या खुले सार्वजनिक स्थानों, दोनों को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “उल्लास की ध्वनि और प्रसन्नता की ध्वनि।”
    reason: lexical_alternative
  - marker: c
    text: या, “खंडहर बन जाएगा” अथवा “वीरान हो जाएगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁבַּתִּי
  choice: और मैं ... बंद कर दूँगा
  rationale: שׁבת के हिफ़ील रूप में कर्ता द्वारा किसी चीज़ को रुकवा देने का भाव है। यह अनुवाद परमेश्वर की प्रत्यक्ष कर्तृता और ध्वनियों के समाप्त किए जाने—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מֵעָרֵי יְהוּדָה
  choice: यहूदा के नगरों ... से
  rationale: מִן यहाँ स्रोत अथवा उस स्थान से हटाए जाने का संकेत देता है; ‘से’ इसका सीधा और सहज हिन्दी रूप है।
- source_word: וּמֵחֻצוֹת יְרוּשָׁלִַם
  choice: और यरूशलेम की सड़कों से
  rationale: חֻצוֹת सड़कों के साथ नगर के खुले सार्वजनिक स्थानों को भी सूचित कर सकता है। मुख्य पाठ में ‘सड़कें’ स्पष्ट है और व्यापक अर्थ को पादटिप्पणी में रखा गया है।
- source_word: קוֹל שָׂשׂוֹן וְקוֹל שִׂמְחָה
  choice: हर्ष की ध्वनि और आनंद की ध्वनि
  rationale: קוֹל का अर्थ ‘ध्वनि’ या ‘आवाज़’ हो सकता है। अमूर्त उत्सवसूचक संज्ञाओं के साथ ‘ध्वनि’ स्वाभाविक है; ‘हर्ष’ और ‘आनंद’ समानार्थी होते हुए भी इब्रानी युग्म के दो पदों को अलग रखते हैं।
- source_word: קוֹל חָתָן וְקוֹל כַּלָּה
  choice: दूल्हे की आवाज़ और दुल्हन की आवाज़
  rationale: यहाँ मनुष्यों की आवाज़ें अभिप्रेत हैं। ‘आवाज़’ तथा उसकी पुनरावृत्ति विवाह-उत्सव के इब्रानी सूत्र और समानांतरता को बनाए रखती है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पहले कथन का कारण प्रस्तुत करता है और आधुनिक हिन्दी में स्पष्ट कारण-संबंध बनाता है।
- source_word: לְחָרְבָּה תִּהְיֶה
  choice: उजाड़ हो जाएगा
  rationale: היה के साथ לְ और संज्ञा परिवर्तन की अवस्था व्यक्त करते हैं। ‘उजाड़ हो जाएगा’ विनाश और वीरानी दोनों का भाव सहज हिन्दी में देता है।
- source_word: הָאָרֶץ
  choice: यह देश
  rationale: संदर्भ में यह केवल मिट्टी नहीं, न्याय के अधीन यहूदा के भूभाग को सूचित करता है। ‘यह देश’ उस प्रादेशिक अर्थ को सामान्य पाठक के लिए स्पष्ट करता है।
theological_decisions:
- issue: न्याय में परमेश्वर की प्रत्यक्ष कर्तृता
  choice: ‘मैं ... बंद कर दूँगा’ के द्वारा प्रथम पुरुष में परमेश्वर की प्रत्यक्ष कार्रवाई बनाए रखी गई है।
  alternative: ‘हर्ष और आनंद की ध्वनि बंद हो जाएगी’ जैसा निर्वैयक्तिक अनुवाद।
  rationale: इब्रानी प्रथम पुरुष हिफ़ील क्रिया स्पष्ट रूप से परमेश्वर को वह कर्ता बताती है जो इन ध्वनियों को रुकवाता है; इसे निर्वैयक्तिक बनाना मूल पाठ के धर्मवैचारिक बल को कम कर देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘ध्वनि’ अमूर्त उत्सवसूचक पदों के साथ और ‘आवाज़’ दूल्हे-दुल्हन के साथ प्रयुक्त करके इब्रानी के अर्थभेद तथा काव्यात्मक समानांतरता को सुरक्षित रखा गया है। पादटिप्पणी-चिह्न अर्थ-संबंधित शब्दों के तुरंत बाद रखे गए हैं।
