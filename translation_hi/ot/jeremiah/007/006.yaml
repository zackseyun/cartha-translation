base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/006.yaml
  text: Do not oppress the foreigner[a], the fatherless, and the widow; do not shed innocent blood in this place[c][b]; and do not go after other gods to your own harm.
translation:
  language: hi
  text: परदेशी[a], अनाथ[b] और विधवा पर अत्याचार मत करो; इस स्थान में निर्दोष का खून मत बहाओ; और अपने ही अहित के लिए दूसरे देवताओं के पीछे मत चलो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘परदेश में रहने वाला’; अर्थात समुदाय के बीच रहने वाला गैर-स्थानीय व्यक्ति।
    reason: lexical_alternative
  - marker: b
    text: हिब्रू शब्द का अधिक शाब्दिक अर्थ ‘पिता से वंचित’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: גֵּר
  choice: परदेशी
  rationale: यह ऐसे गैर-इस्राएली निवासी को दर्शाता है जो समुदाय के बीच रहता था और सामाजिक रूप से असुरक्षित था। ‘परदेशी’ आधुनिक हिन्दी में स्वाभाविक है; वैकल्पिक अर्थ फुटनोट में दिया गया है।
- source_word: יָתוֹם
  choice: अनाथ
  rationale: हिब्रू शब्द विशेषतः पिता से वंचित व्यक्ति को सूचित कर सकता है, पर आधुनिक हिन्दी में ‘अनाथ’ इस सामाजिक श्रेणी का सबसे सहज और प्रचलित पद है।
- source_word: אַלְמָנָה
  choice: विधवा
  rationale: मूल में उल्लिखित असुरक्षित सामाजिक वर्ग का सटीक और मानक हिन्दी रूप।
- source_word: תַעֲשֹׁקוּ
  choice: अत्याचार मत करो
  rationale: עָשַׁק में दबाने, शोषण करने और अन्याय करने का भाव है; ‘अत्याचार करना’ इस संदर्भ में व्यापक नैतिक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: דָם נָקִי
  choice: निर्दोष का खून
  rationale: यह अन्यायपूर्ण हत्या का स्थिर हिब्रू पदबंध है। हिन्दी में यह अर्थ स्पष्ट करता है कि खून निर्दोष व्यक्ति का है।
- source_word: תִּשְׁפְּכוּ
  choice: खून मत बहाओ
  rationale: खून के साथ प्रयुक्त क्रिया का मुहावरेदार अर्थ ‘खून बहाना’ अर्थात हत्या करना है।
- source_word: בַּמָּקוֹם הַזֶּה
  choice: इस स्थान में
  rationale: मंदिर-उपदेश के प्रत्यक्ष स्थान-संदर्भ को बिना ‘यहाँ’ में संक्षिप्त किए सुरक्षित रखता है।
- source_word: אַחֲרֵי ... לֹא תֵלְכוּ
  choice: पीछे चलकर
  rationale: हिब्रू के ‘पीछे चलना’ रूपक को बनाए रखता है, जो अनुसरण और निष्ठा दोनों का संकेत देता है।
- source_word: אֱלֹהִים אֲחֵרִים
  choice: दूसरे देवताओं
  rationale: यह सामान्य हिब्रू पदबंध का सीधा रूप है और ‘विदेशी’ जैसी अतिरिक्त जातीय छाया नहीं जोड़ता।
- source_word: לְרַע לָכֶם
  choice: अपने ही ऊपर विपत्ति मत लाओ
  rationale: हिब्रू वाक्यांश का आशय श्रोताओं को होने वाली हानि है। यह हिन्दी रूप उस परिणाम को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है, जबकि कारणात्मक संबंध संदर्भ से निकलता है।
theological_decisions:
- issue: असुरक्षित सामाजिक समूहों की त्रयी
  choice: परदेशी, अनाथ और विधवा
  alternative: प्रवासी निवासी, पितृहीन और विधवा
  rationale: विशिष्ट वाचाई-सामाजिक श्रेणियों को सामान्यीकृत करके केवल ‘असहाय लोग’ नहीं बनाया गया; आधुनिक पाठक के लिए समझ में आने वाले पद चुने गए और आवश्यक सूक्ष्मताएँ फुटनोट में रखी गईं।
- issue: दूसरे देवताओं के पीछे चलने और हानि का संबंध
  choice: पीछे चलकर अपने ही ऊपर विपत्ति मत लाओ
  alternative: अपने अहित के लिए दूसरे देवताओं के पीछे मत चलो
  rationale: לְרַע לָכֶם के परिणामसूचक अर्थ को स्वाभाविक हिन्दी में व्यक्त किया गया है। यह नहीं तय करता कि हानि देवताओं से स्वतः आती है या दिव्य न्याय से; मूल का धर्मवैचारिक तनाव बना रहता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। समानांतर निषेधात्मक वाक्यरचना सुरक्षित है। ‘खून’ सामान्य आधुनिक हिन्दी के लिए चुना गया; ‘रक्त’ अपेक्षाकृत अधिक संस्कृतनिष्ठ होता।
