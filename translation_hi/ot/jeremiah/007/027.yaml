- source_word: וְלֹא יִשְׁמְעוּ אֵלֶיךָ
  choice: पर वे तेरी नहीं सुनेंगे
  rationale: שׁמע के साथ אֶל का अर्थ किसी की सुनना है और इसमें ध्यान देने या मानने का भाव भी हो सकता है। ‘तेरी नहीं सुनेंगे’ हिन्दी में सुनने और बात मानने—दोनों संभावनाओं को खुला रखता है; ‘पर’ प्रसंग का विरोधसूचक संबंध स्वाभाविक बनाता है।
- source_word: וְקָרָאתָ אֲלֵיהֶם
  choice: तू उन्हें पुकारना
  rationale: קרא यहाँ किसी को पुकारने या आवाज़ देने का अर्थ रखता है। ‘पुकारना’ मूल क्रिया का सीधा अर्थ देता है, बिना औपचारिक घोषणा या आवाज़ की तीव्रता जोड़े।
- source_word: וְלֹא יַעֲנוּכָה
  choice: पर वे तुझे उत्तर नहीं देंगे
  rationale: क़ाल में ענה सामान्यतः ‘उत्तर देना’ है। हिन्दी वाक्य स्पष्ट रूप से कर्मसूचक प्रत्यय ‘तुझे’ को भी सुरक्षित रखता है।
