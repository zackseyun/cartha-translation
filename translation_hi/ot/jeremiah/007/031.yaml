  text: וּ/בָנ֞וּ בָּמ֣וֹת הַ/תֹּ֗פֶת אֲשֶׁר֙ בְּ/גֵ֣יא בֶן הִנֹּ֔ם לִ/שְׂרֹ֛ף אֶת בְּנֵי/הֶ֥ם וְ/אֶת בְּנֹתֵי/הֶ֖ם בָּ/אֵ֑שׁ אֲשֶׁר֙ לֹ֣א צִוִּ֔יתִי וְ/לֹ֥א עָלְתָ֖ה עַל לִבִּֽ/י־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/031.yaml
  text: They have built the high places of Topheth[a], which is in the Valley of Ben-hinnom, to burn their sons and their daughters in the fire—something I did not command, nor did it come up in my heart.
translation:
  language: hi
  text: उन्होंने तोपेत के ऊँचे पूजा-स्थल बनाए हैं, जो बेन-हिन्नोम की घाटी में है, ताकि वे अपने बेटे-बेटियों को आग में जलाएँ—इसकी आज्ञा मैंने नहीं दी, और न यह बात मेरे हृदय में उठी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक भावार्थपरक अनुवाद: “और न यह बात मेरे मन में आई।” हिब्रू में शाब्दिक रूप से “और न यह मेरे हृदय पर चढ़ी” कहा गया है; यह एक मुहावरा है।'
    reason: मूल हिब्रू मुहावरे के अधिक स्वाभाविक हिन्दी विकल्प और उसके शाब्दिक रूप को बताने के लिए।
lexical_decisions:
- source_word: וּבָנוּ
  choice: उन्होंने ... बनाए हैं
  rationale: काल पूर्ण किए गए कार्य और उसके वर्तमान परिणाम को व्यक्त करता है; ‘बनाए हैं’ इस संदर्भ में स्वाभाविक है। आरंभिक ו को अलग से ‘और’ कहना हिन्दी में आवश्यक नहीं।
- source_word: בָּמוֹת הַתֹּפֶת
  choice: तोपेत के ऊँचे पूजा-स्थल
  rationale: בָּמוֹת उपासना से जुड़े ऊँचे स्थलों को दर्शाता है। ‘ऊँचे पूजा-स्थल’ भौतिक और धार्मिक दोनों अर्थों को स्पष्ट रखता है; תֹּפֶת को स्थान-नाम के रूप में लिप्यंतरित किया गया है।
- source_word: בְּגֵיא בֶן־הִנֹּם
  choice: बेन-हिन्नोम की घाटी में
  rationale: גֵיא का अनुवाद ‘घाटी’ किया गया है और भौगोलिक नाम בֶן־הִנֹּם को ‘बेन-हिन्नोम’ के रूप में लिप्यंतरित किया गया है।
- source_word: לִשְׂרֹף
  choice: ताकि वे ... आग में जलाएँ
  rationale: ל के साथ infinitive उद्देश्य व्यक्त करता है; ‘ताकि’ हिन्दी में इस प्रयोजन को स्पष्ट और स्वाभाविक बनाता है।
- source_word: אֶת־בְּנֵיהֶם וְאֶת־בְּנֹתֵיהֶם
  choice: अपने बेटे-बेटियों को
  rationale: मूल पाठ बेटे और बेटियों दोनों का अलग उल्लेख करता है; इसलिए सामान्य ‘बच्चों’ के बजाय यह विशिष्टता सुरक्षित रखी गई है।
- source_word: בָּאֵשׁ
  choice: आग में
  rationale: यहाँ ב को स्थान/साधन के अर्थ में ‘आग में’ कहना प्रसंगानुकूल और स्वाभाविक है।
- source_word: אֲשֶׁר לֹא צִוִּיתִי
  choice: इसकी आज्ञा मैंने नहीं दी थी
  rationale: सम्बन्धवाचक खंड ठीक पहले वर्णित बच्चों को जलाने की प्रथा की ओर संकेत करता है; ‘इसकी’ उस संबंध को स्पष्ट करता है।
- source_word: וְלֹא עָלְתָה עַל־לִבִּי
  choice: और न यह बात मेरे हृदय में उठी थी
  rationale: यह अनुवाद हिब्रू के ‘हृदय पर/में उठने’ वाले रूपक को यथासंभव सुरक्षित रखते हुए हिन्दी में बोधगम्य रहता है।
theological_decisions:
- issue: बाल-बलि का परमेश्वर द्वारा स्पष्ट निषेध
  choice: मूल हिब्रू रूपक को रखते हुए कहा गया है कि इस बात की आज्ञा परमेश्वर ने नहीं दी और यह उसके हृदय में नहीं उठी।
  alternative: ‘और न यह बात कभी मेरे मन में आई थी’ अधिक भावार्थपरक विकल्प है।
  rationale: पद इस कर्म का प्रबल खंडन करता है। ‘मेरे हृदय में उठी’ मूल मानव-सदृश रूपक और उसकी धार्मिक तनावपूर्ण भाषा को सुरक्षित रखता है, बिना परमेश्वर के ज्ञान या पूर्वज्ञान के विषय में पाठ से आगे कोई निष्कर्ष जोड़े।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘ऊँचे पूजा-स्थल’ धार्मिक संदर्भ को स्पष्ट करता है, जबकि ‘हृदय में उठी’ मूल रूपक और उसकी अस्पष्टता को बनाए रखता है।
