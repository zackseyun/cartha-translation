  terminology: ‘न्याय’ appropriately renders מִשְׁפָּט. ‘एक मनुष्य और उसके पड़ोसी’ retains the source’s singular masculine representative expression without introducing a doctrinal interpretation. The footnote’s English grammatical labels should be rendered in accessible Hindi.
