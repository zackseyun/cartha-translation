source:
  edition: WLC
  text: כִּ֤י אִם הֵיטֵיב֙ תֵּיטִ֔יבוּ אֶת דַּרְכֵי/כֶ֖ם וְ/אֶת מַֽעַלְלֵי/כֶ֑ם אִם עָשׂ֤וֹ תַֽעֲשׂוּ֙ מִשְׁפָּ֔ט בֵּ֥ין אִ֖ישׁ וּ/בֵ֥ין רֵעֵֽ/הוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/005.yaml
  text: For if you truly make your ways and your deeds good[a], if you truly do justice between a man and his neighbor[b],
translation:
  language: hi
  text: क्योंकि यदि तुम सचमुच अपने चालचलन और अपने कामों को सुधारोगे[a], यदि तुम एक मनुष्य और उसके पड़ोसी के बीच सचमुच न्याय करोगे[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यदि तुम अपने मार्गों और अपने कामों को पूरी तरह अच्छा बनाओगे।” इब्रानी में दोनों शर्तों में बल देने के लिए बलवाचक अनन्त रूप के साथ रूपित क्रिया का प्रयोग हुआ है।
    reason: lexical_alternative
  - marker: b
    text: या, “यदि तुम एक मनुष्य और दूसरे के बीच सचमुच न्याय करोगे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: क्योंकि यदि
  rationale: כִּי के संयोजक अर्थ और אִם की शर्त—दोनों को बनाए रखता है; पिछले पद की झूठी निर्भरता के बाद वास्तविक शर्त प्रस्तुत होती है।
- source_word: הֵיטֵיב תֵּיטִיבוּ
  choice: सचमुच ... सुधारो
  rationale: क्रिया के साथ प्रयुक्त infinitive absolute कार्य पर बल देता है। ‘सचमुच’ उस बल को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि ‘सुधारो’ चालचलन और कामों को अच्छा बनाने का आशय स्पष्ट करता है।
- source_word: דַּרְכֵיכֶם
  choice: अपने चालचलन
  rationale: शाब्दिक अर्थ ‘अपने मार्ग’ है, पर यहाँ यह जीवन-व्यवहार का रूपक है। ‘चालचलन’ आधुनिक हिन्दी में नैतिक जीवन-रीति को सहज और स्पष्ट रूप से व्यक्त करता है।
- source_word: מַעַלְלֵיכֶם
  choice: अपने कामों
  rationale: यह संज्ञा किए गए कार्यों या कर्मों को दर्शाती है। ‘कामों’ सामान्य पाठक के लिए स्वाभाविक है और नैतिक संदर्भ में स्पष्ट रहता है।
- source_word: אִם עָשׂוֹ תַעֲשׂוּ
  choice: यदि तुम ... सचमुच ... करो
  rationale: यहाँ भी infinitive absolute और finite verb का मेल क्रिया को प्रबल करता है; ‘सचमुच’ इस बल को बनाए रखता है।
- source_word: מִשְׁפָּט
  choice: न्याय
  rationale: इस प्रसंग में अर्थ केवल न्यायिक निर्णय नहीं, बल्कि लोगों के बीच न्यायपूर्ण व्यवहार और निर्णय करना है।
- source_word: בֵּין אִישׁ וּבֵין רֵעֵהוּ
  choice: एक मनुष्य और उसके पड़ोसी के बीच
  rationale: यह सामुदायिक संबंधों में निष्पक्ष न्याय का सूत्रवत वर्णन है। ‘मनुष्य’ मूल के पुल्लिंग एकवचन אִישׁ को और ‘पड़ोसी’ רֵעַ के सामाजिक-संबंधी अर्थ को सुरक्षित रखता है।
theological_decisions:
- issue: אִישׁ में प्रतिनिधिक पुल्लिंग भाषा
  choice: एक मनुष्य
  alternative: एक व्यक्ति / किसी एक और दूसरे के बीच
  rationale: मूल पाठ पुल्लिंग एकवचन אִישׁ को प्रतिनिधिक कानूनी-सामाजिक अभिव्यक्ति में प्रयोग करता है। ‘एक मनुष्य’ उस रूप को बनाए रखता है, बिना उसके प्रयोग को केवल पुरुषों तक सीमित बताने के।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘चालचलन’ ने इब्रानी ‘मार्गों’ के जीवन-व्यवहार संबंधी रूपक को स्वाभाविक हिन्दी में व्यक्त किया है। दोनों इब्रानी बलवाचक रचनाओं के लिए ‘सचमुच’ रखा गया है। पद अगले वाक्यांश में जारी रहता है, इसलिए अंत में अल्पविराम है।
