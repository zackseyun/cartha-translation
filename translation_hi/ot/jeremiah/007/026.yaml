source:
  edition: WLC
  text: וְ/ל֤וֹא שָׁמְעוּ֙ אֵלַ֔/י וְ/לֹ֥א הִטּ֖וּ אֶת אָזְנָ֑/ם וַ/יַּקְשׁוּ֙ אֶת עָרְפָּ֔/ם הֵרֵ֖עוּ מֵ/אֲבוֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/026.yaml
  text: Yet they did not listen to me[a], and they did not incline their ear, but they stiffened their neck[b]; they acted more wickedly than their fathers.
translation:
  language: hi
  text: फिर भी उन्होंने मेरी नहीं सुनी और न मेरी ओर कान लगाया[a], बल्कि अपनी गर्दन अकड़ा ली; उन्होंने अपने पुरखाओं[b] से भी बढ़कर बुराई की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में इसका शाब्दिक चित्र है, “अपना कान नहीं झुकाया”; अर्थात उन्होंने ध्यान देकर नहीं सुना।
    reason: cultural_note
  - marker: b
    text: या “पिताओं।” इब्रानी शब्द का अर्थ पिता या पूर्वज, दोनों हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְעוּ אֵלַי
  choice: मेरी नहीं सुनी
  rationale: שׁמע के साथ אֶל यहाँ केवल ध्वनि सुनने के बजाय किसी की बात ध्यान से सुनने और मानने की ओर संकेत करता है। ‘मेरी नहीं सुनी’ इस आशय को स्वाभाविक हिन्दी में रखता है, पर मुख्य पाठ में इसे स्पष्ट रूप से ‘आज्ञा नहीं मानी’ बनाकर अर्थ को आवश्यकता से अधिक सीमित नहीं करता।
- source_word: הִטּוּ אֶת אָזְנָם
  choice: मेरी ओर कान लगाया
  rationale: मूल इब्रानी चित्र कान को झुकाकर ध्यान देने का है। ‘कान लगाया’ हिन्दी में ध्यानपूर्वक सुनने का परिचित मुहावरा है और पिछले उपवाक्य के साथ समानांतरता बनाए रखता है।
- source_word: וַיַּקְשׁוּ אֶת עָרְפָּם
  choice: अपनी गर्दन अकड़ा ली
  rationale: यह हठ और अनमनीयता का इब्रानी मुहावरा है। ‘गर्दन अकड़ा ली’ रूपक को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: הֵרֵעוּ
  choice: से भी बढ़कर बुराई की
  rationale: רעע का हिफ़ील रूप यहाँ बुराई करने का अर्थ देता है, और उसके बाद आया מִן तुलना प्रकट करता है। इसलिए अनुवाद पिछली पीढ़ियों से अधिक बुरा आचरण करने की बात स्पष्ट करता है।
- source_word: מֵאֲבוֹתָם
  choice: अपने पुरखाओं से
  rationale: אָבוֹת का शाब्दिक अर्थ ‘पिता’ हो सकता है, पर बहुवचन में यह पहले की पीढ़ियों या पूर्वजों के लिए भी प्रयुक्त होता है। इस प्रसंग में ‘पुरखाओं’ से पीढ़ीगत तुलना स्पष्ट और स्वाभाविक रहती है।
- source_word: וְלֹא ... וְלֹא ... וַ
  choice: फिर भी ... और न ... बल्कि ...
  rationale: संयोजक प्रसंग में पिछले कथन के बावजूद जारी अवज्ञा और फिर उसके तीखे परिणाम को दिखाते हैं। हिन्दी संयोजक इस विरोधात्मक प्रवाह को स्पष्ट करते हैं।
theological_decisions:
- issue: שׁמע में सुनने और आज्ञा मानने का संबंध
  choice: मेरी नहीं सुनी
  alternative: मेरी आज्ञा नहीं मानी
  rationale: यहाँ परमेश्वर के संदेश पर ध्यान न देने में अवज्ञा निहित है, फिर भी मूल क्रिया के सुनने वाले रूपक को बनाए रखने से पाठ उस निहितार्थ को स्वयं व्यक्त करने देता है।
- issue: אָבוֹת का दायरा
  choice: पुरखाओं
  alternative: पिताओं
  rationale: यह शब्द वास्तविक पिताओं या व्यापक अर्थ में पूर्वजों को सूचित कर सकता है। प्रसंग पीढ़ियों की तुलना करता है, इसलिए ‘पुरखाओं’ को मुख्य पाठ में रखा गया और अधिक शाब्दिक विकल्प टिप्पणी में दिया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘कान लगाया’ और ‘गर्दन अकड़ा ली’ इब्रानी के समानांतर शारीरिक रूपकों को स्वाभाविक हिन्दी मुहावरों में सुरक्षित रखते हैं; अर्धविराम अंतिम तुलनात्मक निष्कर्ष को स्पष्ट करता है।
