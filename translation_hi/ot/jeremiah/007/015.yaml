source:
  edition: WLC
  text: וְ/הִשְׁלַכְתִּ֥י אֶתְ/כֶ֖ם מֵ/עַ֣ל פָּנָ֑/י כַּ/אֲשֶׁ֤ר הִשְׁלַ֨כְתִּי֙ אֶת כָּל אֲחֵי/כֶ֔ם אֵ֖ת כָּל זֶ֥רַע אֶפְרָֽיִם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/015.yaml
  text: And I will cast you out from before me[a], just as I cast out all your brothers[c][b], all the offspring of Ephraim.
translation:
  language: hi
  text: और मैं तुम्हें अपने सामने से निकाल फेंकूँगा[a], जैसे मैंने तुम्हारे सब भाइयों[b] को—एप्रैम के सारे वंशजों को[c]—निकाल फेंका था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मेरे मुख के ऊपर से।” इसका अनुवाद “अपनी उपस्थिति से दूर” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “भाइयों” से यहूदा के साथी इस्राएली, विशेषकर उत्तरी राज्य के लोग, अभिप्रेत हैं।
    reason: cultural_note
  - marker: c
    text: यहाँ एप्रैम उत्तरी राज्य इस्राएल और उसके लोगों का प्रतिनिधि नाम है।
    reason: cross_reference
lexical_decisions:
- source_word: וְהִשְׁלַכְתִּי
  choice: और मैं ... निकाल फेंकूँगा
  rationale: हिफ़ील रूप यहाँ बलपूर्वक निष्कासन और अस्वीकार किए जाने का भाव देता है। ‘निकाल फेंकूँगा’ इस कठोर न्यायिक रूपक को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: אֶתְכֶם
  choice: तुम्हें
  rationale: यह द्वितीय पुरुष पुल्लिंग बहुवचन का प्रत्यक्ष कर्म है; प्रसंग में यह यहूदा के लोगों को सामूहिक रूप से सम्बोधित करता है।
- source_word: מֵעַל פָּנָי
  choice: अपने सामने से
  rationale: शाब्दिक अर्थ ‘मेरे मुख के ऊपर से’ है। ‘अपने सामने से’ मूल बिंब और परमेश्वर के सम्मुख से हटाए जाने के न्यायिक भाव को बनाए रखता है।
- source_word: כַּאֲשֶׁר
  choice: जैसे
  rationale: यह यहूदा पर आने वाले न्याय की तुलना एप्रैम पर पहले आए न्याय से करता है।
- source_word: הִשְׁלַכְתִּי
  choice: निकाल फेंका था
  rationale: पहले प्रयुक्त क्रिया की पुनरावृत्ति को बनाए रखते हुए पूर्ण हुई पिछली घटना स्पष्ट करता है।
- source_word: כָּל אֲחֵיכֶם
  choice: तुम्हारे सब भाइयों
  rationale: ‘भाइयों’ मूल पारिवारिक रूपक को सुरक्षित रखता है; यहाँ इसका संकेत यहूदा के सहजात इस्राएलियों, विशेषकर उत्तरी राज्य के लोगों, की ओर है।
- source_word: אֵת כָּל זֶרַע אֶפְרָיִם
  choice: अर्थात् एप्रैम के सारे वंश को
  rationale: אֵת के साथ यह पद पूर्ववर्ती ‘तुम्हारे सब भाइयों’ का पुनर्निर्देशन या स्पष्टीकरण करता है। זֶרַע का सामूहिक अर्थ ‘वंश’ है; ‘एप्रैम’ मूल नाम और उसकी प्रतिनिधिक भूमिका दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: מֵעַל פָּנָי में परमेश्वर द्वारा अस्वीकार किए जाने का भाव
  choice: अपने सामने से
  alternative: अपनी उपस्थिति से दूर / अपनी दृष्टि से बाहर
  rationale: चयन मूल ‘मुख/सम्मुख’ मुहावरे के निकट है और निर्वासन या सर्वव्यापकता से जुड़ी अतिरिक्त धर्मवैज्ञानिक व्याख्या आरोपित नहीं करता।
- issue: אֲחֵיכֶם का संबंध-सूचक अर्थ
  choice: भाइयों
  alternative: बंधु-बांधवों / सजातियों
  rationale: मूल का पुल्लिंग बहुवचन और पारिवारिक वाचा-संबंधी रूपक रखा गया है; पादटिप्पणी व्यापक सामूहिक संदर्भ स्पष्ट करती है।
- issue: एप्रैम का प्रतिनिधिक प्रयोग
  choice: एप्रैम नाम को मुख्य पाठ में बनाए रखा
  alternative: उत्तरी राज्य इस्राएल
  rationale: मूल पाठ सीधे ‘एप्रैम’ कहता है। उसका उत्तरी राज्य के लिए प्रतिनिधिक प्रयोग पादटिप्पणी में समझाया गया है, मुख्य पाठ में प्रतिस्थापित नहीं।
- issue: כָּל אֲחֵיכֶם और כָּל זֶרַע אֶפְרָיִם का पारस्परिक संबंध
  choice: स्पष्टीकरण के रूप में ‘अर्थात्’ और दीर्घ विराम
  alternative: दो समानान्तर कर्मों की तरह बिना स्पष्टीकरण-सूचक शब्द के
  rationale: दूसरा पद पहले की पहचान स्पष्ट करता प्रतीत होता है। ‘अर्थात्’ हिन्दी में यह अपोज़िशन स्वाभाविक बनाता है, जबकि पादटिप्पणियाँ एप्रैम के ऐतिहासिक संकेत को खोलती हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘निकाल फेंकना’ मूल क्रिया की कठोरता बनाए रखता है; ‘अपने सामने से’ मूल इब्रानी मुहावरे के निकट है। मुख्य पाठ में सभी पादटिप्पणी-चिह्न [a], [b], [c] उपस्थित हैं।
