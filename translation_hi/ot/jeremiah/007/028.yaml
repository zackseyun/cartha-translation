source:
  edition: WLC
  text: וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֗ם זֶ֤ה הַ/גּוֹי֙ אֲשֶׁ֣ר לֽוֹא שָׁמְע֗וּ בְּ/קוֹל֙ יְהוָ֣ה אֱלֹהָ֔י/ו וְ/לֹ֥א לָקְח֖וּ מוּסָ֑ר אָֽבְדָה֙ הָֽ/אֱמוּנָ֔ה וְ/נִכְרְתָ֖ה מִ/פִּי/הֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/028.yaml
  text: Then you shall say to them[a], ‘This is the nation that did not listen to the voice of Yahweh its God and did not accept correction. Faithfulness has perished; it has been cut off from their mouth.’
translation:
  language: hi
  text: तब तुम उनसे कहना, “यह वह राष्ट्र है जिसने अपने परमेश्वर याहवे की वाणी नहीं सुनी और सुधार स्वीकार नहीं किया। विश्वासयोग्यता[a] मिट गई है और उनके मुँह से काट दी गई है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सत्य।” इब्रानी शब्द אֱמוּנָה का अर्थ “विश्वासयोग्यता,” “विश्वसनीयता” या “सत्य” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: तब तुम उनसे कहना
  rationale: भविष्यद्वाणी के क्रम में वाव + पूर्ण क्रिया अगले निर्देश को व्यक्त करती है; ‘तब’ क्रम को और ‘कहना’ स्वाभाविक हिंदी आदेश को दर्शाता है।
- source_word: זֶה הַגּוֹי
  choice: यह वही जाति है
  rationale: גּוֹי एक सामूहिक एकवचन ‘जाति/राष्ट्र’ है। यहाँ ‘जाति’ सामान्य हिंदी बाइबलीय-भविष्यद्वाणी संदर्भ में स्वाभाविक है, और ‘वही’ संकेतवाचक पहचान के बल को प्रकट करता है।
- source_word: לֹא שָׁמְעוּ בְּקוֹל
  choice: वाणी नहीं सुनी
  rationale: इस इब्रानी मुहावरे में सुनने के साथ आज्ञा मानने का भाव निहित है। ‘वाणी नहीं सुनी’ श्रवण-रूपक और उसकी जानबूझकर अवज्ञा—दोनों को खुला रखता है।
- source_word: יְהוָה
  choice: यहवे
  rationale: चार अक्षरों वाले दिव्य नाम को उपाधि से बदलने के बजाय हिंदी में उसके व्यक्तिगत नाम का लिप्यंतरण किया गया है।
- source_word: אֱלֹהָיו
  choice: अपने परमेश्वर
  rationale: तीसरे पुरुष एकवचन प्रत्यय सामूहिक एकवचन גּוֹי से मेल खाता है। हिंदी में ‘अपने परमेश्वर’ संबंध को स्वाभाविक ढंग से व्यक्त करता है और असहज ‘उसके परमेश्वर’ से बचता है।
- source_word: לֹא לָקְחוּ מוּסָר
  choice: सुधार स्वीकार नहीं किया
  rationale: מוּסָר में अनुशासन, शिक्षा और सुधार के अर्थ हैं। इस फटकार के प्रसंग में ‘सुधार स्वीकार करना’ स्वाभाविक और अर्थपूर्ण है।
- source_word: אָבְדָה הָאֱמוּנָה
  choice: विश्वासयोग्यता मिट गई है
  rationale: אֱמוּנָה विश्वासयोग्यता, भरोसेमंदी अथवा सत्य को सूचित कर सकता है। ‘विश्वासयोग्यता’ वाचा-संबंधी और नैतिक पक्ष को बनाए रखती है; ‘सत्य’ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וְנִכְרְתָה מִפִּיהֶם
  choice: उनके मुँह से काट दी गई है
  rationale: निफ़अल रूप का निष्क्रिय अर्थ और כרת का सजीव ‘काट देना’ रूपक सुरक्षित रखा गया है; ‘मुँह’ פֶּה का सीधा अनुवाद है।
theological_decisions:
- issue: वाचा-संबंधी फटकार में אֱמוּנָה का अर्थ
  choice: विश्वासयोग्यता
  alternative: सत्य
  rationale: यह शब्द सत्य/भरोसेमंदी भी दर्शा सकता है, पर इस पद में लोगों की अपने परमेश्वर के प्रति प्रतिक्रिया का अभियोग है। इसलिए ‘विश्वासयोग्यता’ संबंधपरक और नैतिक तनाव को बेहतर बनाए रखती है, जबकि समान रूप से संभव ‘सत्य’ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, स्पष्ट और सामान्य पाठक के लिए सुबोध शैली। ‘वाणी नहीं सुनी’ और ‘मुँह से काट दी गई’ जैसे मूल रूपकों को अर्थ की वास्तविक अस्पष्टता सहित बनाए रखा गया है।
