base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/018.yaml
  text: The children gather wood[a], the fathers kindle the fire, and the women knead dough to make cakes for the Queen of Heaven and to pour out drink offerings to other gods, so as to provoke me to anger.
translation:
  language: hi
  text: बच्चे लकड़ी बटोरते हैं, पिता आग जलाते हैं, और स्त्रियाँ आटा गूँधती हैं, ताकि आकाश की रानी[a] के लिए टिकियाँ बनाएँ और दूसरे देवताओं के लिए पेय-बलियाँ उंडेलें—मुझे क्रोधित करने के लिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पदबंध מְלֶכֶת הַשָּׁמַיִם को परंपरागत रूप से “आकाश की रानी” समझा जाता है—संभवतः यह यहूदा में पूजी जाने वाली किसी देवी की उपाधि थी। कुछ विद्वानों ने “आकाश का काम” अर्थ प्रस्तावित किया है, पर यहाँ चढ़ावे पाने वाले व्यक्तिगत देवता का प्रसंग “आकाश की रानी” के पक्ष में है।
    reason: alternative_reading
lexical_decisions:
- source_word: מְלַקְּטִים עֵצִים
  choice: लकड़ी बटोरते हैं
  rationale: क्रिया लगातार किए जा रहे इकट्ठा करने के काम को बताती है। עֵצִים का सामान्य अर्थ यहाँ 'लकड़ी' है; 'ईंधन' या 'टहनियाँ' कहना अनावश्यक रूप से अर्थ को सीमित करता।
- source_word: מְבַעֲרִים אֶת הָאֵשׁ
  choice: आग जलाते हैं
  rationale: यह मुहावरेदार आधुनिक हिन्दी में आग सुलगाने या प्रज्वलित करने की क्रिया को स्पष्ट रूप से व्यक्त करता है।
- source_word: לָשׁוֹת בָּצֵק
  choice: आटा गूँधती हैं
  rationale: लָשׁוֹת विशेष रूप से गूँधने की क्रिया है। हिन्दी में तैयार गूँधे जाने वाले मिश्रण के लिए 'आटा' स्वाभाविक है।
- source_word: כַּוָּנִים
  choice: टिकियाँ
  rationale: यह पूजा के लिए बनाई गई आकारयुक्त खाद्य वस्तुओं को सूचित करता है। 'टिकियाँ' उनके आकार को सहज हिन्दी में व्यक्त करता है, जबकि प्रसंग उनका चढ़ावे के रूप में उपयोग स्पष्ट करता है।
- source_word: מְלֶכֶת הַשָּׁמַיִם
  choice: आकाश की रानी
  rationale: व्याकरण और मूर्तिपूजक चढ़ावों का प्रसंग इसे एक देवी की उपाधि के रूप में समझने का समर्थन करते हैं। 'आकाश' הַשָּׁמַיִם का सीधा और इस उपाधि में स्वाभाविक हिन्दी रूप है।
- source_word: וְהַסֵּךְ נְסָכִים
  choice: पेय-बलियाँ उंडेलें
  rationale: यह पूजा में तरल चढ़ावा उंडेलने की क्रिया है। 'पेय-बलि' अर्थ को 'अर्घ' की अपेक्षा अधिक प्रत्यक्ष और सर्वसुलभ रखता है।
- source_word: אֱלֹהִים אֲחֵרִים
  choice: दूसरे देवताओं
  rationale: अֲחֵרִים का सीधा अर्थ 'दूसरे' है; 'विदेशी' मूल पाठ से अधिक व्याख्यात्मक होता।
- source_word: לְמַעַן הַכְעִסֵנִי
  choice: इस प्रकार वे मुझे क्रोध दिलाते हैं
  rationale: यह causative भाव और परमेश्वर के प्रति किए गए व्यक्तिगत अपमान को सुरक्षित रखता है। לְמַעַן में उद्देश्य या परिणाम दोनों की छाया हो सकती है; 'इस प्रकार' हिन्दी में इस तनाव को कठोरता से केवल घोषित उद्देश्य नहीं बनाता।
theological_decisions:
- issue: מְלֶכֶת הַשָּׁמַיִם की पहचान
  choice: आकाश की रानी
  alternative: आकाश का काम
  rationale: घर-परिवार द्वारा एक उपास्य सत्ता के लिए टिकियाँ बनाने और अन्य देवताओं को पेय-बलि चढ़ाने का निकट प्रसंग व्यक्तिगत देवी की उपाधि के पक्ष में है। वैकल्पिक शब्द-विश्लेषण को पाद-टिप्पणी में रखा गया है, और इस उपाधि को बाद की किसी धार्मिक हस्ती से नहीं जोड़ा गया।
- issue: לְמַעַן הַכְעִסֵנִי में उद्देश्य और परिणाम
  choice: इस प्रकार वे मुझे क्रोध दिलाते हैं
  alternative: मुझे क्रोध दिलाने के लिए
  rationale: לְמַעַן प्रायः उद्देश्य व्यक्त करता है, पर यहाँ जानबूझकर परमेश्वर को क्रोधित करना या इन कर्मों का परिणाम—दोनों समझे जा सकते हैं। चुना हुआ रूप causative अर्थ को रखते हुए इस अस्पष्टता को अनावश्यक रूप से नहीं सुलझाता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। घरेलू कार्यों की ठोस क्रमिकता बनाए रखने के लिए 'लकड़ी बटोरते', 'आग जलाते' और 'आटा गूँधती' जैसे सामान्य शब्द लिए गए हैं। 'आकाश की रानी' को एक उपाधि की तरह प्रस्तुत किया गया है, बिना किसी बाद की सांप्रदायिक पहचान को आरोपित किए।
