- from: तब मैं तुम्हें इस स्थान में, उस देश में जिसे मैंने तुम्हारे पुरखों[a] को दिया था, अति प्राचीन काल से सदा तक[b] बसाए रखूँगा।
  to: तब मैं तुम्हें इस स्थान में, उस देश में जिसे मैंने तुम्हारे पूर्वजों[a] को बहुत पहले से सदा के लिए[b] दिया था, बसाए रखूँगा।
