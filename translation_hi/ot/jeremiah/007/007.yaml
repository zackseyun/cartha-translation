id: JER.7.7
reference: Jeremiah 7:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/שִׁכַּנְתִּ֤י אֶתְ/כֶם֙ בַּ/מָּק֣וֹם הַ/זֶּ֔ה בָּ/אָ֕רֶץ אֲשֶׁ֥ר נָתַ֖תִּי לַ/אֲבֽוֹתֵי/כֶ֑ם לְ/מִן עוֹלָ֖ם וְ/עַד עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/007.yaml
  text: then I will let you dwell in this place[b][a], in the land that I gave to your fathers from of old and forever.
translation:
  language: hi
  text: तब मैं तुम्हें इस स्थान में, उस देश में जिसे मैंने तुम्हारे पूर्वजों[a] को बहुत पहले से सदा के लिए[b] दिया था, बसाए रखूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “पिताओं”; अर्थात पूर्वजों।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “दूरस्थ अतीत से अनिश्चित भविष्य तक।” इब्रानी अभिव्यक्ति अतीत की प्राचीनता और आगे के स्थायित्व, दोनों का भाव देती है।
    reason: temporal_ambiguity
lexical_decisions:
- source_word: וְשִׁכַּנְתִּי
  choice: तब मैं तुम्हें … बसाए रखूँगा
  rationale: שׁכן का हिफ़ील रूप यहाँ कारणवाचक है—किसी को बसाना अथवा बसे रहने देना। संदर्भ में आज्ञाकारिता की शर्त पर देश में उनका निवास जारी रखने का भाव है; इसलिए ‘बसाए रखूँगा’ स्वाभाविक हिन्दी में कारणवाचकता और निरंतर निवास दोनों व्यक्त करता है।
- source_word: בַּמָּקוֹם הַזֶּה
  choice: इस स्थान में
  rationale: मूल पाठ के सामान्य शब्द ‘स्थान’ और निकटवाची संकेत ‘इस’ को बनाए रखा गया है; अनुवाद में इसे यरूशलेम, मन्दिर या यहूदा कहकर अधिक विशिष्ट नहीं बनाया गया।
- source_word: בָּאָרֶץ
  choice: उस देश में
  rationale: यहाँ אֶרֶץ पूर्वजों को दिए गए भौगोलिक देश को सूचित करता है, पूरी पृथ्वी को नहीं। ‘उस’ हिन्दी में आगे आने वाले संबंधवाचक उपवाक्य ‘जिसे…’ के साथ स्वाभाविक है।
- source_word: אֲשֶׁר נָתַתִּי
  choice: जिसे मैंने … दिया था
  rationale: पूर्वजों को पहले दिए जा चुके देश के लिए हिन्दी का पूर्ण भूतकाल स्वाभाविक और स्पष्ट है।
- source_word: לַאֲבוֹתֵיכֶם
  choice: तुम्हारे पुरखों
  rationale: אָבוֹת का मूल अर्थ ‘पिता’ है, पर इस प्रसंग में वह पिछली पीढ़ियों अर्थात पूर्वजों को दर्शाता है। ‘पुरखे’ साधारण आधुनिक हिन्दी में सहज है; अधिक शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: לְמִן עוֹלָם וְעַד עוֹלָם
  choice: अति प्राचीन काल से सदा तक
  rationale: पहला עוֹלָם दूरस्थ अतीत और दूसरा अनिश्चित भविष्य की ओर संकेत कर सकता है। यह रूप उस अतीत-से-भविष्य तक के विस्तार को बनाए रखता है और ‘अनादि से अनन्त तक’ जैसी अधिक दार्शनिक भाषा से बचता है।
theological_decisions:
- issue: क्या प्रतिज्ञा देश पर बिना शर्त स्थायी अधिकार बताती है
  choice: इसे पिछले पदों की शर्तों से जुड़ी, देश में बसे रहने की प्रतिज्ञा के रूप में रखा गया है।
  alternative: इसे आज्ञाकारिता से निरपेक्ष, देश के पूर्ण और स्थायी अधिकार की घोषणा मानना।
  rationale: पद 7 पिछले पदों के शर्तसूचक कथनों का परिणाम है। ‘तब’ और ‘बसाए रखूँगा’ उस प्रवचनात्मक संबंध को बनाए रखते हैं, पर व्यापक वाचा-संबंधी प्रश्नों का निर्णय अनुवाद में नहीं थोपते।
- issue: अंतिम कालवाचक वाक्यांश का संबंध
  choice: वाक्य में उसे निवास/देश-दान की समूची प्रतिज्ञा के काल-विस्तार के रूप में खुला रखा गया है।
  alternative: उसे केवल ‘दिया था’ अथवा केवल ‘बसाए रखूँगा’ से कठोरता से जोड़ना।
  rationale: इब्रानी में वाक्यांश अंत में है और उसके संबंध में कुछ वाक्यगत अस्पष्टता बनी रहती है; हिन्दी क्रम उसी तनाव को अनावश्यक रूप से हल नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘बसाए रखूँगा’ कारणवाचक हिफ़ील और निरंतर निवास के प्रसंग दोनों को व्यक्त करता है। ‘पुरखे’ बोलचाल और औपचारिकता के बीच संतुलित है; शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
