  edition: WLC
  text: וְֽ/הָ֨יְתָ֜ה נִבְלַ֨ת הָ/עָ֤ם הַ/זֶּה֙ לְ/מַֽאֲכָ֔ל לְ/ע֥וֹף הַ/שָּׁמַ֖יִם וּ/לְ/בֶהֱמַ֣ת הָ/אָ֑רֶץ וְ/אֵ֖ין מַחֲרִֽיד׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/033.yaml
  text: The corpses of this people will become food for the birds of the heavens and for the beasts of the earth[a], with no one to frighten them away.
translation:
  language: hi
  text: इस प्रजा के शव आकाश के पक्षियों और धरती के पशुओं का आहार बन जाएँगे, और उन्हें भगानेवाला कोई न होगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस प्रजा का शव ... और उन्हें डरानेवाला कोई न होगा।” इब्रानी में “शव” एकवचन है, पर वह सामूहिक अर्थ में प्रयुक्त हो सकता है; अंतिम वाक्यांश में कर्म निहित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: बन जाएँगे
  rationale: भविष्यसूचक परिणाम को व्यक्त करता है और לְמַאֲכָל के साथ स्वाभाविक हिन्दी बनाता है। बहुवचन क्रिया सामूहिक संज्ञा को हिन्दी में स्पष्ट करती है।
- source_word: נִבְלַת
  choice: शव
  rationale: इब्रानी एकवचन रूप यहाँ सामूहिक अर्थ रख सकता है। हिन्दी में बहुवचन ‘शव’ इस जनसमूह के मरे हुओं को स्वाभाविक और गंभीर ढंग से व्यक्त करता है।
- source_word: הָעָם הַזֶּה
  choice: इस जाति के
  rationale: עַם यहाँ यहूदा के लोगों के सामूहिक समुदाय को सूचित करता है। ‘जाति’ आधुनिक बाइबलीय हिन्दी में राजनीतिक ‘राष्ट्र’ की अपेक्षा इस सामूहिक अर्थ को अधिक उपयुक्त ढंग से रखती है।
- source_word: לְמַאֲכָל
  choice: आहार
  rationale: ‘आहार’ मूल के भोजन-संबंधी अर्थ को संक्षिप्त, गंभीर और स्वाभाविक हिन्दी में रखता है।
- source_word: לְעוֹף הַשָּׁמַיִם
  choice: आकाश के पक्षियों
  rationale: עוֹף सामूहिक रूप से उड़नेवाले पक्षियों को दर्शाता है; ‘आकाश के पक्षी’ प्रचलित और स्पष्ट हिन्दी अभिव्यक्ति है।
- source_word: וּלְבֶהֱמַת הָאָרֶץ
  choice: और धरती के पशुओं
  rationale: בְּהֵמָה यहाँ स्थल के पशुओं के लिए सामूहिक है। यह चयन आकाश और धरती के समानांतर बिंब को बनाए रखता है।
- source_word: וְאֵין מַחֲרִיד
  choice: और उन्हें भगानेवाला कोई न होगा
  rationale: कारणवाचक भाव पक्षियों और पशुओं को डराकर दूर करने का है। मूल में कर्म निहित है; हिन्दी में ‘उन्हें’ जोड़ना संदर्भ को स्वाभाविक रूप से स्पष्ट करता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गंभीर और भविष्यसूचक न्याय के तीखे बिंब के अनुरूप रखी गई है। ‘शव’ की सामूहिकता को मुख्य पाठ में बहुवचन से स्पष्ट किया गया है, जबकि इब्रानी एकवचन और अंतिम खंड की व्याकरणिक अस्पष्टता पाद-टिप्पणी में सुरक्षित है।
