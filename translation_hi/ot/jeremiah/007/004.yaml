id: JER.7.4
reference: Jeremiah 7:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אַל תִּבְטְח֣וּ לָ/כֶ֔ם אֶל דִּבְרֵ֥י הַ/שֶּׁ֖קֶר לֵ/אמֹ֑ר הֵיכַ֤ל יְהוָה֙ הֵיכַ֣ל יְהוָ֔ה הֵיכַ֥ל יְהוָ֖ה הֵֽמָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/004.yaml
  text: Do not trust in deceptive words[a], saying, “The temple of Yahweh, the temple of Yahweh[b], the temple of Yahweh are these.”
translation:
  language: hi
  text: 'झूठी बातों[a] पर भरोसा मत रखो: “याहवे का मंदिर, याहवे का मंदिर, याहवे का मंदिर—ये हैं।”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “छलपूर्ण बातों।” हिब्रू शब्द बातों के झूठे होने या उनके बहकाने वाले प्रभाव—दोनों पर बल दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में यह वाक्यांश तीन बार दोहराने के बाद बहुवचन “ये हैं” आता है। पुनरावृत्ति मंदिर पर रखे गए गलत भरोसे को आलंकारिक ढंग से व्यक्त करती है।
    reason: cultural_note
lexical_decisions:
- source_word: אַל תִּבְטְחוּ לָכֶם
  choice: भरोसा मत रखो
  rationale: אַל के साथ अपूर्ण क्रिया निषेध व्यक्त करती है। בטח का अर्थ भरोसा करना या सहारा मानना है। לָכֶם का आत्मवाचक/हितसूचक भाव हिन्दी में अलग से व्यक्त करना अप्राकृतिक होता, इसलिए वह मुहावरेदार क्रिया में निहित है।
- source_word: אֶל דִּבְרֵי הַשֶּׁקֶר
  choice: झूठी बातों पर
  rationale: בטח के बाद אֶל भरोसे के आधार को बताता है। שׁקר असत्य और छल दोनों का बोध करा सकता है; मुख्य पाठ में सहज 'झूठी बातें' रखा गया और छलपूर्ण प्रभाव को पादटिप्पणी में सुरक्षित किया गया।
- source_word: לֵאמֹר
  choice: जो कहती हैं
  rationale: यह आगे आने वाले कथन का परिचय देता है। हिन्दी में इसे 'झूठी बातों' से जोड़कर कहना स्वाभाविक है।
- source_word: הֵיכַל יְהוָה
  choice: याहवे का मन्दिर
  rationale: הֵיכַל यहाँ यरूशलेम के पवित्र भवन को दर्शाता है। יְהוָה को व्यक्तिगत ईश्वरीय नाम 'याहवे' के रूप में लिप्यंतरित किया गया है।
- source_word: הֵמָּה
  choice: यह ... है
  rationale: बहुवचन सूचक הֵמָּה का सन्दर्भ सम्भवतः सामने विद्यमान मन्दिर-परिसर या उससे जुड़ी वस्तुओं की ओर है। शब्दशः 'ये हैं' हिन्दी में तीन समान पदों के बाद अत्यन्त अस्वाभाविक और अस्पष्ट होता; आरम्भिक 'यह' से संकेतात्मक बल और नारे का आशय सुरक्षित रहता है।
theological_decisions:
- issue: मन्दिर-वाक्यांश की तीन बार पुनरावृत्ति
  choice: तीनों बार 'याहवे का मन्दिर है' रखा गया
  alternative: इसे एक बार कहकर 'यही याहवे का मन्दिर है' करना
  rationale: हिब्रू की त्रिविध पुनरावृत्ति आलंकारिक बल देती है और मन्दिर पर रखे गए मिथ्या भरोसे को उजागर करती है; इसे संक्षिप्त करना भविष्यद्वक्ता की आलोचना को कमज़ोर करता।
- issue: הֵמָּה की वाक्यगत भूमिका
  choice: संकेत को वाक्य के आरम्भ में एकवचन 'यह' से व्यक्त किया
  alternative: शब्दशः 'याहवे का मन्दिर... ये हैं'
  rationale: हिब्रू का अन्तिम सर्वनाम व्याकरणतः बहुवचन है और उसका सटीक संकेत कुछ अस्पष्ट है। हिन्दी मुख्य पाठ में मन्दिर-स्थान की ओर संकेत करने वाला स्वाभाविक रूप चुना गया, जबकि पादटिप्पणी मूल रूप को स्पष्ट करती है।
- issue: ईश्वरीय नाम יְהוָה
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में चतुरक्षरी व्यक्तिगत नाम है। उसका लिप्यंतरण नाम और उपाधि के भेद को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण निषेध रखा गया है। 'मन्दिर' सामान्य पाठक के लिए परिचित है; 'याहवे' मूल व्यक्तिगत नाम को सुरक्षित रखता है। हिब्रू की असामान्य अन्तिम बहुवचन रचना को मुख्य पाठ में स्वाभाविक संकेतात्मक हिन्दी और पादटिप्पणी के संयोजन से प्रस्तुत किया गया है।
