base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/002.yaml
  text: Stand in the gate of the house of Yahweh[a], and proclaim there this word, and say, “Hear the word of Yahweh, all Judah, who enter through these gates to worship Yahweh.”
translation:
  language: hi
  text: याहवे के भवन के फाटक पर खड़ा हो और वहाँ यह वचन पुकारकर सुना, और कह, “हे समस्त यहूदा, तुम जो याहवे की उपासना[a] करने के लिए इन फाटकों से प्रवेश करते हो, याहवे का वचन सुनो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे को दंडवत करने।” इब्रानी क्रिया विशेषकर उपासना में शरीर को झुकाने या दंडवत करने को भी दर्शा सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲמֹד
  choice: खड़े हो जाओ
  rationale: आज्ञार्थक क्रिया यिर्मयाह को एक निश्चित स्थान पर जाकर खड़ा होने को कहती है; यह आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: בְּשַׁעַר בֵּית יְהוָה
  choice: याहवे के भवन के फाटक पर
  rationale: शाब्दिक अर्थ ‘याहवे के भवन के फाटक में/पर’ है। हिन्दी में प्रवेश-स्थान पर खड़े होने के भाव के लिए ‘फाटक पर’ स्वाभाविक है, और ‘भवन’ मूल के ‘घर’ रूपक को बनाए रखता है।
- source_word: וְקָרָאתָ שָּׁם
  choice: वहाँ यह वचन पुकारकर सुनाओ
  rationale: इस भविष्यवाणी-संबंधी प्रसंग में קרא सार्वजनिक रूप से ऊँची आवाज़ में घोषणा करने को दर्शाता है; ‘पुकारकर सुनाओ’ सामान्य पाठक के लिए जीवंत और स्पष्ट है।
- source_word: אֶת־הַדָּבָר הַזֶּה
  choice: यह वचन
  rationale: דבר एकवचन है और भविष्यवाणी की प्रचलित अभिव्यक्ति ‘वचन’ को यहाँ बनाए रखना उचित है।
- source_word: שִׁמְעוּ דְבַר יְהוָה
  choice: याहवे का वचन सुनो
  rationale: यह भविष्यद्वक्ताओं में प्रयुक्त औपचारिक आह्वान है; ‘सुनो’ आज्ञार्थक बल को सुरक्षित रखता है।
- source_word: כָּל יְהוּדָה
  choice: हे समस्त यहूदा
  rationale: मूल में यहूदा को सामूहिक रूप से सीधे संबोधित किया गया है। ‘हे’ हिन्दी में संबोधन को स्पष्ट करता है, जबकि ‘समस्त यहूदा’ सामूहिक रूप को बनाए रखता है।
- source_word: הַבָּאִים בַּשְּׁעָרִים הָאֵלֶּה
  choice: तुम जो इन फाटकों से प्रवेश करते हो
  rationale: कृदंत संबोधित समुदाय की पहचान करता है। ‘तुम जो’ प्रत्यक्ष संबोधन को स्पष्ट करता है और बहुवचन ‘इन फाटकों’ को सुरक्षित रखता है।
- source_word: לְהִשְׁתַּחֲוֺת
  choice: उपासना करने के लिए
  rationale: प्रसंग में क्रिया धार्मिक आराधना के लिए झुकने को दर्शाती है। मुख्य पाठ में ‘उपासना’ स्वाभाविक है; शारीरिक रूप से झुकने का अर्थ पादटिप्पणी में रखा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुराक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में प्रस्तुत किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे प्रयुक्त है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे किसी उपाधि में नहीं बदलता।
- issue: השתחוה में उपासना और शारीरिक दंडवत का संबंध
  choice: मुख्य पाठ में ‘उपासना’, पादटिप्पणी में ‘दंडवत करने’ का विकल्प
  alternative: मुख्य पाठ में ‘दंडवत करने’
  rationale: मंदिर-प्रसंग में उद्देश्य उपासना है, पर इब्रानी क्रिया के शारीरिक रूप से झुकने के ठोस अर्थ को मिटाना नहीं चाहिए; इसलिए वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक भविष्यवाणी की घोषणा के अनुकूल रखी गई है। ‘भवन’, ‘वचन’ और ‘हे समस्त यहूदा’ मूल की औपचारिकता बनाए रखते हैं, जबकि वाक्य-विन्यास सामान्य हिन्दी पाठक के लिए स्पष्ट है।
