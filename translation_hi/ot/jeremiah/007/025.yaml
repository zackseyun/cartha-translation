  text: לְ/מִן הַ/יּ֗וֹם אֲשֶׁ֨ר יָצְא֤וּ אֲבֽוֹתֵי/כֶם֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה וָ/אֶשְׁלַ֤ח אֲלֵי/כֶם֙ אֶת כָּל עֲבָדַ֣/י הַ/נְּבִיאִ֔ים י֖וֹם הַשְׁכֵּ֥ם וְ/שָׁלֹֽחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/025.yaml
  text: From the day your fathers came out of the land of Egypt until this day[a], I have sent to you all my servants the prophets, day after day[b], rising early and sending them.
translation:
  language: hi
  text: जिस दिन तुम्हारे पितर मिस्र की भूमि से निकले थे, उस दिन से आज तक मैं तुम्हारे पास अपने सभी सेवकों, अर्थात् नबियों, को हर दिन सवेरे उठकर भेजता आया हूँ।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: इब्रानी में, “सवेरे उठना और भेजना।” यह मुहावरा नबियों को लगातार, बार-बार और तत्परता से भेजने पर बल देता है।
    reason: cultural_note
lexical_decisions:
- source_word: לְמִן הַיּוֹם אֲשֶׁר ... עַד הַיּוֹם הַזֶּה
  choice: जिस दिन ... उस दिन से लेकर आज तक
  rationale: यह अभिव्यक्ति समयावधि के आरंभ और वर्तमान संदर्भ-बिंदु तक उसकी निरंतरता को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: אֲבוֹתֵיכֶם
  choice: तुम्हारे पुरखे
  rationale: संदर्भ में यह इस्राएल की पिछली पीढ़ियों अथवा पूर्वजों को दर्शाता है; ‘पुरखे’ आधुनिक हिन्दी में इस ऐतिहासिक अर्थ को स्पष्ट रखता है।
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: मिस्र देश से
  rationale: ‘देश’ को बनाए रखने से इब्रानी की पूर्ण वाचा-इतिहास संबंधी अभिव्यक्ति सुरक्षित रहती है।
- source_word: וָאֶשְׁלַח אֲלֵיכֶם
  choice: मैं ... तुम्हारे पास भेजता रहा हूँ
  rationale: इब्रानी भूतकालीन क्रिया यहाँ निर्गमन से ‘आज तक’ बार-बार किए गए कार्य को बताती है; हिन्दी का ‘भेजता रहा हूँ’ उस निरंतर पुनरावृत्ति को व्यक्त करता है।
- source_word: אֶת כָּל עֲבָדַי הַנְּבִיאִים
  choice: अपने सभी सेवकों—नबियों—को
  rationale: समानाधिकरण नबियों की पहचान परमेश्वर के सेवकों के रूप में करता है; दीर्घ विराम-चिह्न इस संबंध को स्पष्ट करता है।
- source_word: יוֹם הַשְׁכֵּם וְשָׁלֹחַ
  choice: दिन-प्रतिदिन बड़े सवेरे उठकर उन्हें भेजता रहा हूँ
  rationale: शाब्दिक बिंब और पुनरावृत्ति दोनों को रखा गया है; पादटिप्पणी बताती है कि यह इब्रानी मुहावरा तत्पर और लगातार भेजने पर बल देता है।
theological_decisions:
- issue: नबियों के लिए עֲבָדַי का अनुवाद
  choice: सेवकों
  alternative: दासों
  rationale: यहाँ मुख्य बल परमेश्वर द्वारा सौंपे गए नबूवत के कार्य और प्रतिनिधित्व पर है, न कि उनकी बंधुआ सामाजिक स्थिति पर; इसलिए ‘सेवकों’ संदर्भ के अधिक अनुकूल है।
- issue: הַשְׁכֵּם וְשָׁלֹחַ में परमेश्वर के ‘सवेरे उठने’ का बिंब
  choice: बड़े सवेरे उठकर उन्हें भेजता रहा हूँ
  alternative: तत्परता से बार-बार उन्हें भेजता रहा हूँ
  rationale: मूल का मानवरूपी मुहावरा मुख्य पाठ में सुरक्षित रखा गया है और उसके व्यावहारिक आशय को पादटिप्पणी में स्पष्ट किया गया है, ताकि बिंब को चुपचाप समाप्त न किया जाए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘पुरखे’ ऐतिहासिक-सामुदायिक संदर्भ को सहज रूप से व्यक्त करता है, जबकि ‘सेवकों—नबियों—’ मूल के समानाधिकरण को स्पष्ट रखता है।
