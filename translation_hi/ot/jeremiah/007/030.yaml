source:
  edition: WLC
  text: כִּֽי עָשׂ֨וּ בְנֵי יְהוּדָ֥ה הָ/רַ֛ע בְּ/עֵינַ֖/י נְאֻום יְהוָ֑ה שָׂ֣מוּ שִׁקּֽוּצֵי/הֶ֗ם בַּ/בַּ֛יִת אֲשֶׁר נִקְרָא שְׁמִ֥/י עָלָ֖י/ו לְ/טַמְּאֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/030.yaml
  text: For the sons of Judah have done what is evil in my sight[a], declares Yahweh. They have put their abominations in the house that is called by my name[c][b], to defile it.
translation:
  language: hi
  text: क्योंकि यहूदा के लोगों ने वह किया है जो मेरी दृष्टि में बुरा है, यहोवा की यह वाणी है। उन्होंने अपनी घृणित वस्तुएँ[c] उस भवन में रखी हैं जो मेरे नाम से कहलाता है[a][b], उसे अपवित्र करने के लिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “वह भवन जिस पर मेरा नाम पुकारा जाता है।” अर्थात वह भवन यहोवा के नाम से पहचाना जाता है और उसी का है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात यरूशलेम का मन्दिर।
    reason: cultural_note
  - marker: c
    text: इस शब्द से ऐसी वस्तुएँ अभिप्रेत हैं जिन्हें यहोवा घृणित मानता है—यहाँ सम्भवतः मूर्तियों सहित घृणित उपासना-वस्तुएँ।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह शब्द पिछले कथन के न्याय का कारण बताता है; हिन्दी में ‘क्योंकि’ उसके संयोजक और व्याख्यात्मक बल को स्वाभाविक रूप से बनाए रखता है।
- source_word: בְנֵי יְהוּדָה
  choice: यहूदा के लोग
  rationale: शाब्दिक रूप ‘यहूदा के पुत्र’ है, पर यहाँ पूरे समुदाय का बोध है; ‘यहूदा के लोग’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: הָרַע בְּעֵינַי
  choice: वह किया है जो मेरी दृष्टि में बुरा है
  rationale: ‘मेरी आँखों में’ के हिब्रू मुहावरे को ‘मेरी दृष्टि में’ से व्यक्त किया गया है, जिससे परमेश्वर के नैतिक मूल्यांकन का भाव बना रहता है।
- source_word: נְאֻם יְהוָה
  choice: यहोवा की यह वाणी है
  rationale: यह भविष्यद्वक्ताओं में प्रयुक्त औपचारिक उद्घोषणा है; यह रूप उसकी गंभीरता बनाए रखते हुए आधुनिक हिन्दी में सहज है।
- source_word: שִׁקּוּצֵיהֶם
  choice: अपनी घृणित वस्तुएँ
  rationale: यह शब्द विशेषतः घृणित उपासना-वस्तुओं को सूचित कर सकता है। ‘वस्तुएँ’ अर्थ को केवल मूर्तियों तक सीमित नहीं करती, जबकि ‘घृणित’ उसके प्रबल नकारात्मक और धार्मिक भाव को रखता है।
- source_word: בַּבַּיִת
  choice: उस भवन में
  rationale: मूल में ‘घर/भवन’ है और प्रसंग यरूशलेम के मन्दिर की ओर संकेत करता है। मुख्य पाठ में स्रोत की सामान्य संज्ञा रखी गई है और पादटिप्पणी में संदर्भ स्पष्ट किया गया है।
- source_word: אֲשֶׁר נִקְרָא שְׁמִי עָלָיו
  choice: जो मेरे नाम से कहलाता है
  rationale: यह निकट, पठनीय रूप है; शाब्दिक वाक्य-विन्यास और स्वामित्व/पहचान का भाव पादटिप्पणी में दिया गया है।
- source_word: לְטַמְּאוֹ
  choice: रखकर उसे अशुद्ध किया है
  rationale: स्रोत का उद्देश्य अथवा परिणाम दोनों सम्भव हैं। हिन्दी की यह रचना वस्तुएँ रखने और भवन के अशुद्ध होने के बीच स्पष्ट सम्बन्ध दिखाती है, बिना केवल अनुष्ठानिक या केवल नैतिक अर्थ चुनने के।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: व्यक्तिगत वाचा-नाम को ‘प्रभु’ जैसी उपाधि से नहीं बदला गया। आधुनिक हिन्दी बाइबल-पाठकों में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ रूप को चुना गया है; ‘याहवे’ निकटतर विद्वत् लिप्यन्तरण है।
- issue: שִׁקּוּצֵיהֶם की धार्मिक विशिष्टता
  choice: घृणित वस्तुएँ
  alternative: मूर्तियाँ
  rationale: प्रसंग में मूर्तियाँ सम्भावित हैं, पर मूल शब्द का अर्थ उनसे व्यापक हो सकता है। इसलिए पाठ ने व्यापक अर्थ सुरक्षित रखा और पादटिप्पणी में उपासना-वस्तुओं की सम्भावना बताई।
- issue: לְטַמְּאוֹ में उद्देश्य या परिणाम
  choice: रखकर उसे अशुद्ध किया है
  alternative: उसे अशुद्ध करने के लिए रखी हैं
  rationale: हिब्रू infinitive उद्देश्य या परिणाम व्यक्त कर सकता है। चुना हुआ हिन्दी रूप क्रिया और उसके परिणाम का सम्बन्ध रखता है, पर जानबूझकर किए गए उद्देश्य को अनिवार्य नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए स्पष्ट रखी गई है। ‘यहूदा के पुत्रों’ के स्थान पर सामुदायिक अर्थ वाला ‘यहूदा के लोग’ लिया गया है। ‘भवन’ मूल के ‘घर’ को औपचारिक धार्मिक संदर्भ में स्वाभाविक ढंग से व्यक्त करता है; मन्दिर की पहचान पादटिप्पणी में है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
