id: JER.7.32
reference: Jeremiah 7:32
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לָ/כֵ֞ן הִנֵּֽה יָמִ֤ים בָּאִים֙ נְאֻם יְהוָ֔ה וְ/לֹא יֵאָמֵ֨ר ע֤וֹד הַ/תֹּ֨פֶת֙ וְ/גֵ֣יא בֶן הִנֹּ֔ם כִּ֖י אִם גֵּ֣יא הַ/הֲרֵגָ֑ה וְ/קָבְר֥וּ בְ/תֹ֖פֶת מֵ/אֵ֥ין מָקֽוֹם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/032.yaml
  text: Therefore, look, days are coming, declares the LORD, when it will no longer be called Topheth and the Valley of Ben-hinnom, but the Valley of Slaughter; and they will bury in Topheth because there is no place left.
translation:
  language: hi
  text: इसलिए, देखो, दिन आ रहे हैं—यह यहोवा की घोषणा है—जब उसे फिर न तो तोपेत और न ही बेन-हिन्नोम की घाटी कहा जाएगा, बल्कि वध की घाटी कहा जाएगा; और वे तोपेत में दफ़न करेंगे, क्योंकि जगह नहीं होगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: पूर्ववर्ती न्याय-वचन से निष्कर्ष का स्पष्ट संबंध बनाए रखता है।
- source_word: הִנֵּה
  choice: देखो
  rationale: आने वाली घोषणा की ओर ध्यान खींचने वाले हिब्रू संकेतक का स्वाभाविक और प्रत्यक्ष रूप।
- source_word: נְאֻם יְהוָה
  choice: यह यहोवा की घोषणा है
  rationale: भविष्यद्वाणी के प्रामाणिक सूत्र को बनाए रखते हुए दिव्य नाम יהוה को ‘यहोवा’ से व्यक्त करता है।
- source_word: הַתֹּפֶת
  choice: तोपेत
  rationale: स्थान-नाम का लिप्यंतरण किया गया है; अर्थ लगाकर अनुवाद नहीं किया गया।
- source_word: גֵיא בֶן הִנֹּם
  choice: बेन-हिन्नोम की घाटी
  rationale: हिब्रू स्थान-नाम की संरचना और पहचान सुरक्षित रखी गई है।
- source_word: גֵיא הַהֲרֵגָה
  choice: वध की घाटी
  rationale: הֲרֵגָה के हिंसक संहार/वध के अर्थ को संक्षिप्त और गंभीर हिंदी में व्यक्त करता है।
- source_word: וְקָבְרוּ
  choice: और लोग ... दफ़नाएँगे
  rationale: हिब्रू के अनिर्दिष्ट बहुवचन कर्ता को हिंदी में स्वाभाविक बनाने के लिए ‘लोग’ जोड़ा गया; दफ़नाई जाने वाली वस्तु प्रसंगतः मृतक हैं।
- source_word: מֵאֵין מָקוֹם
  choice: क्योंकि कहीं और जगह नहीं बचेगी
  rationale: स्थान की अनुपलब्धता को सहज हिंदी में व्यक्त करता है; ‘और’ प्रसंगगत रूप से सामान्य दफ़न-स्थानों के भर जाने का संकेत देता है।
theological_decisions:
- issue: वाव के द्वारा जुड़े दो पुराने स्थान-नामों का संबंध
  choice: न तो तोपेत ... न बेन-हिन्नोम की घाटी
  alternative: तोपेत और बेन-हिन्नोम की घाटी
  rationale: नकारात्मक ‘फिर नहीं कहा जाएगा’ के अधीन दोनों नाम आते हैं। हिंदी की ‘न तो...न’ रचना बिना यह तय किए दोनों पुराने पदनामों को सुरक्षित रखती है कि वे पूर्णतः समानार्थी हैं या निकट संबद्ध।
- issue: दिव्य नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में उपस्थित विशिष्ट दिव्य नाम को सामान्य उपाधि में बदलने के बजाय प्रचलित हिंदी रूप से दर्शाया गया है।
- issue: कब्रों के न्याय-चित्र की तीव्रता
  choice: लोग तोपेत में मुर्दों को दफ़नाएँगे
  alternative: वे तोपेत में दफ़नाएँगे
  rationale: हिब्रू में कर्म व्यक्त नहीं है, पर प्रसंग मृतकों को दफ़नाने का है। ‘मुर्दों’ से हिंदी वाक्य स्पष्ट होता है, बिना मृतकों की पहचान या न्याय की सीमा के बारे में अतिरिक्त दावा किए।
translation_notes:
  register: भाषा आधुनिक, गंभीर और सार्वजनिक पाठ के योग्य रखी गई है। ‘ऐसे दिन आ रहे हैं’ भविष्यवाणी-सूत्र को स्वाभाविक हिंदी देता है; डैश घोषणा-सूत्र को स्पष्ट करते हैं। स्थान-नाम लिप्यंतरित हैं और न्याय की कठोर छवि को नरम नहीं किया गया।
