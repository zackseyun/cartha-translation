id: JER.7.22
reference: Jeremiah 7:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֠י לֹֽא דִבַּ֤רְתִּי אֶת אֲבֽוֹתֵי/כֶם֙ וְ/לֹ֣א צִוִּיתִ֔י/ם בְּ/י֛וֹם הוציא אוֹתָ֖/ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם עַל דִּבְרֵ֥י עוֹלָ֖ה וָ/זָֽבַח־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/022.yaml
  text: For I did not speak to your fathers or command them on the day I brought them out of the land of Egypt concerning burnt offering and sacrifice[a][b][c].
translation:
  language: hi
  text: क्योंकि जिस दिन मैं तुम्हारे पुरखाओं को मिस्र देश से निकाल लाया, उस दिन मैंने होमबलि और बलिदान के विषय में न तो उनसे कुछ कहा, न उन्हें कोई आज्ञा दी।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘होमबलि और बलिदान के विषय में’ का अनुवाद ‘होमबलियों और बलिदानों के बारे में’ भी हो सकता है। अगले पद की तुलना करें, जहाँ आज्ञा मानने पर बल दिया गया है।
    reason: lexical_alternative
  - marker: b
    text: यह कथन बलिदान-संबंधी हर आज्ञा के दिए जाने का अनिवार्यतः निषेध नहीं करता; इस भविष्यद्वक्ताई प्रसंग में यह अनुष्ठान की अपेक्षा आज्ञाकारिता पर प्रबल बल देने वाला विरोध हो सकता है। मुख्य पाठ मूल भाषा के तीखे निषेध को बिना नरम किए रखता है।
    reason: theological_tension
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इसके कारणसूचक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לֹא דִבַּרְתִּי אֶת אֲבוֹתֵיכֶם
  choice: मैंने तुम्हारे पुरखाओं से कुछ नहीं कहा
  rationale: דבר का सामान्य अर्थ ‘कहना/बोलना’ है। ‘पुरखाओं’ से इस्राएल की पूर्व पीढ़ियों का ऐतिहासिक संकेत स्वाभाविक हिन्दी में बना रहता है।
- source_word: וְלֹא צִוִּיתִים
  choice: न उन्हें कोई आज्ञा दी
  rationale: צוה का सीधा अर्थ ‘आज्ञा देना’ है; ‘न...न’ संरचना समानांतर निषेध को स्पष्ट और सहज बनाती है।
- source_word: בְּיוֹם הוציא אוֹתָם מֵאֶרֶץ מִצְרָיִם
  choice: जिस दिन मैं उन्हें मिस्र देश से निकाल लाया, उस दिन
  rationale: ביום के ‘दिन’ वाले रूप को बनाए रखते हुए हिन्दी की सहसंबंधी ‘जिस दिन...उस दिन’ रचना काल-संबंध को स्पष्ट और स्वाभाविक बनाती है।
- source_word: עַל דִּבְרֵי
  choice: के विषय में
  rationale: यह चर्चा या आज्ञा के विषय को सूचित करता है; ‘के विषय में’ सटीक और सामान्य आधुनिक हिन्दी है।
- source_word: עוֹלָה
  choice: होमबलि
  rationale: यह वेदी पर पूर्णतः जलाए जाने वाले बलिदान का पारंपरिक और संक्षिप्त हिन्दी बाइबलीय पद है।
- source_word: וָזָבַח
  choice: और बलिदान
  rationale: זבח यहाँ עולה के साथ बलिदान की सामूहिक श्रेणी के रूप में है; एकवचन भाववाचक ‘बलिदान’ उस श्रेणीगत अर्थ को बनाए रखता है।
theological_decisions:
- issue: क्या पद का अनुवाद इस प्रकार नरम किया जाए कि परमेश्वर ने बलिदान संबंधी आज्ञाएँ कभी दी ही नहीं थीं—ऐसा प्रत्यक्ष अर्थ न निकले?
  choice: 'मूल इब्रानी के स्पष्ट निषेध को मुख्य पाठ में यथावत रखना: ‘न तो...कुछ कहा, न...कोई आज्ञा दी।’'
  alternative: मुख्य पाठ में ‘मुख्यतः’, ‘पहली बात के रूप में’ या ‘केवल’ जोड़कर इसे प्राथमिकता का कथन बनाना।
  rationale: इब्रानी पाठ निषेध को तीखे ढंग से रखता है। अगले पद के संदर्भ में यह आज्ञाकारिता और अनुष्ठान के बीच भविष्यद्वक्ताई बलाघात हो सकता है, पर अनुवाद में व्याख्यात्मक शब्द जोड़कर उस तनाव को समाप्त नहीं करना चाहिए।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य हिन्दी। ‘पुरखाओं’ को ‘पितरों’ की अपेक्षा अधिक सहज ऐतिहासिक पद के रूप में चुना गया है। ‘होमबलि’ स्थापित बाइबलीय पारिभाषिक शब्द है। वाक्य को हिन्दी के स्वाभाविक ‘जिस दिन...उस दिन’ क्रम में रखा गया है, जबकि मूल का काल-संबंध और स्पष्ट निषेध सुरक्षित है।
