id: JER.7.21
reference: Jeremiah 7:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כֹּ֥ה אָמַ֛ר יְהוָ֥ה צְבָא֖וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֑ל עֹלוֹתֵי/כֶ֛ם סְפ֥וּ עַל זִבְחֵי/כֶ֖ם וְ/אִכְל֥וּ בָשָֽׂר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/021.yaml
  text: 'Thus says Yahweh of hosts[a], the God of Israel: Add your burnt offerings to your sacrifices, and eat the flesh.'
translation:
  language: hi
  text: 'सेनाओं का याहवे, इस्राएल का परमेश्वर, यों कहता है: “अपनी होमबलियों को अपने बलिदानों[a] में जोड़ दो और मांस खाओ।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपनी मेलबलियों में”; इब्रानी शब्द विशेष रूप से उन बलियों को भी दर्शा सकता है जिनमें से उपासक मांस खाते थे।
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: यों कहता है
  rationale: यह भविष्यद्वक्ताओं की मानक संदेश-प्रस्तावना है। हिन्दी में वर्तमानकाल और ‘यों’ इसकी औपचारिक, घोषणात्मक शक्ति को स्वाभाविक रूप से व्यक्त करते हैं।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का याहवे
  rationale: याहवे व्यक्तिगत ईश्वरीय नाम को लिप्यंतरित करता है; ‘सेनाओं का’ צְבָאוֹת की व्यापक और पारंपरिक उपाधि को बनाए रखता है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल का परमेश्वर
  rationale: यह संबंधवाचक पदबंध का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: עֹלוֹתֵיכֶם
  choice: अपने होमबलियों
  rationale: עֹלָה उस बलि को दर्शाता है जो वेदी पर पूरी तरह जलाई जाती थी; ‘होमबलि’ हिन्दी बाइबलीय प्रयोग में इसका संक्षिप्त और परिचित पद है।
- source_word: סְפוּ עַל
  choice: में जोड़ दो
  rationale: आज्ञार्थक क्रिया का अर्थ किसी वस्तु को दूसरी में जोड़ना है। यह अभिव्यक्ति कथन के तीखे व्यंग्य को बनाए रखते हुए हिन्दी में स्वाभाविक है।
- source_word: זִבְחֵיכֶם
  choice: अपने बलिदानों
  rationale: זֶבַח सामान्यतः बलिदान को दर्शा सकता है, यद्यपि इस उपासना-संदर्भ में उससे ऐसी बलियां भी अभिप्रेत हो सकती हैं जिनका मांस उपासक खाते थे। मुख्य पाठ व्यापक अर्थ रखता है और अधिक विशिष्ट संभावना पादटिप्पणी में देता है।
- source_word: וְאִכְלוּ בָשָׂר
  choice: और मांस खाओ
  rationale: बलि के पशु के खाने योग्य शरीर के लिए आधुनिक हिन्दी में ‘मांस’ स्वाभाविक है और आज्ञार्थक क्रम को स्पष्ट रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम है। ‘याहवे’ उसका लिप्यंतरण करके नाम को किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: होमबलियों के विपरीत זִבְחֵיכֶם की विशिष्टता
  choice: बलिदानों
  alternative: मेलबलियों
  rationale: इब्रानी पद सामान्य ‘बलिदान’ अथवा इस संदर्भ में उपासक द्वारा खाई जाने वाली अधिक विशिष्ट बलि का संकेत दे सकता है। मुख्य पाठ व्यापक अर्थ रखता है और पादटिप्पणी संकीर्ण संभावना को सुरक्षित रखती है।
- issue: आज्ञा का व्यंग्यात्मक बल
  choice: सीधी आज्ञा के रूप में रखा गया
  alternative: अर्थ खोलकर ‘तुम चाहो तो...’ या ‘खा ही लो’ कहना
  rationale: संदर्भ में वचन व्यंग्यात्मक हो सकता है, पर मूल पाठ व्यंग्य को स्पष्ट करने वाले अतिरिक्त शब्द नहीं देता। अतः अनुवाद उसकी व्याख्या किए बिना तनाव को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। भविष्यद्वक्ताओं की औपचारिक संदेश-शैली के लिए ‘यों कहता है’ रखा गया है। पादटिप्पणी-चिह्न उसी शब्द के बाद रखा गया है जिससे वैकल्पिक पाठ संबंधित है।
