  text: הַ/אֹתִ֛/י הֵ֥ם מַכְעִסִ֖ים נְאֻם יְהוָ֑ה הֲ/ל֣וֹא אֹתָ֔/ם לְמַ֖עַן בֹּ֥שֶׁת פְּנֵי/הֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/019.yaml
  text: Is it I whom they are provoking? declares Yahweh. Is it not themselves[a], to the shame of their own faces?
translation:
  language: hi
  text: “क्या वे मुझे ही क्रोधित कर रहे हैं?” याहवे की यह वाणी है। “क्या वे अपने ही चेहरों की लज्जा के लिए स्वयं को ही क्रोधित नहीं कर रहे[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में दूसरे प्रश्न की क्रिया व्यक्त नहीं है; वह पहले प्रश्न से समझी जाती है: “क्या वे स्वयं को नहीं, अपने चेहरों की लज्जा के लिए?” इसका मुहावरेदार आशय यह भी हो सकता है: “क्या वे अपनी ही लज्जा नहीं ला रहे हैं?”'
    reason: लुप्त क्रिया और वाक्यांश के सम्भावित मुहावरेदार अर्थ को सुरक्षित रखते हुए मुख्य पाठ को स्रोत के निकट रखना।
lexical_decisions:
- source_word: הַאֹתִי
  choice: क्या वे मुझे ही
  rationale: प्रश्नवाचक कण, कर्म-सूचक चिह्न और प्रथम पुरुष सर्वनाम के अग्रस्थान का बल ‘मुझे ही’ से व्यक्त होता है।
- source_word: מַכְעִסִים
  choice: क्रोध दिला रहे हैं
  rationale: כעס के हिफ़ईल रूप का अर्थ ‘क्रोध भड़काना/क्रोधित करना’ है; यह चयन क्रिया के कारणवाचक और जारी भाव को सहज हिन्दी में रखता है।
- source_word: נְאֻם יְהוָה
  choice: याहवे की यह वाणी है
  rationale: यह भविष्यवाणी का प्रामाणिक उद्घोष-सूत्र है; ‘वाणी’ उसकी गंभीरता बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: הֲלוֹא אֹתָם
  choice: क्या वे अपने आपको ही ... नहीं
  rationale: הֲלוֹא अपेक्षित सकारात्मक उत्तर वाला आलंकारिक प्रश्न है। אֹתָם का शाब्दिक रूप ‘उन्हें’ है, पर पहले पुरुष ‘मुझे’ के साथ विरोध को हिन्दी में प्रतिवर्ती ‘अपने आपको’ स्पष्ट करता है।
- source_word: לְמַעַן בֹּשֶׁת פְּנֵיהֶם
  choice: जिससे उनके अपने मुँह लज्जित हों
  rationale: לְמַעַן के परिणामसूचक भाव और ‘उनके चेहरों की लज्जा’ की सजीव देहगत छवि को स्वाभाविक हिन्दी में व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत वाचा-नाम है; ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: दूसरे आलंकारिक प्रश्न में लुप्त क्रिया
  choice: हानि पहुँचा रहे
  alternative: ‘क्रोध दिला रहे’ को दोहराना; क्रिया को अधूरा छोड़ना
  rationale: इब्रानी में दूसरे प्रश्न की क्रिया पहले खंड से समझी जाती है, किंतु आशय यह है कि उनके कर्म का लज्जाजनक परिणाम उन्हीं पर पड़ता है। सहज हिन्दी के लिए ‘हानि पहुँचा रहे’ जोड़ा गया है, और पादटिप्पणी में अधिक रूप-सन्निकट विकल्प सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और बोलचाल में बोधगम्य रखी गई है। ‘मुँह लज्जित हों’ मूल की ठोस ‘चेहरों की लज्जा’ वाली छवि को बचाता है; मुख्य पाठ में लुप्त क्रिया को अर्थानुसार पूरा किया गया है और उसकी वास्तविक अस्पष्टता पादटिप्पणी में दी गई है।
