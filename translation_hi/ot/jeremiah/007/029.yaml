source:
  edition: WLC
  text: גָּזִּ֤י נִזְרֵ/ךְ֙ וְֽ/הַשְׁלִ֔יכִי וּ/שְׂאִ֥י עַל שְׁפָיִ֖ם קִינָ֑ה כִּ֚י מָאַ֣ס יְהוָ֔ה וַ/יִּטֹּ֖שׁ אֶת דּ֥וֹר עֶבְרָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/029.yaml
  text: Cut off your hair and throw it away[a], and raise a lament on the bare heights[b], for Yahweh has rejected and abandoned the generation of his wrath.
translation:
  language: hi
  text: अपने बाल[a] काटकर फेंक दे, और उजाड़ पहाड़ियों पर विलाप कर; क्योंकि याहवे ने उसके प्रकोप की पीढ़ी[b] को ठुकराया और त्याग दिया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपना मुकुट’ अथवा ‘अपने समर्पित बाल।’ हिब्रू शब्द समर्पण, मुकुट और समर्पण के चिह्न के रूप में रखे गए बालों से जुड़ा हो सकता है; यहाँ ‘काटकर फेंक दे’ के कारण ‘बाल’ अधिक उपयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘उसके प्रकोप की पीढ़ी।’ इसका अर्थ ‘वह पीढ़ी जो उसके प्रकोप के अधीन है’ भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: גָּזִּי
  choice: काटकर
  rationale: यह גזז का स्त्रीलिंग एकवचन आज्ञार्थक रूप है, जिसका अर्थ बाल काटना या मूँड़ना है। संबोधन मानवीकृत यरूशलेम से है; हिंदी में संयुक्त आज्ञा ‘काटकर फेंक दे’ स्वाभाविक है।
- source_word: נִזְרֵךְ
  choice: अपने बाल
  rationale: נזר समर्पण, मुकुट अथवा समर्पण से जुड़े बालों का संकेत दे सकता है। ‘काट’ और ‘फेंक दे’ के साथ यहाँ बाल का अर्थ सबसे उपयुक्त है; वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: וְהַשְׁלִיכִי
  choice: फेंक दे
  rationale: שלך जानबूझकर दूर फेंकने या त्याग देने को व्यक्त करता है। यह आधुनिक हिंदी में स्पष्ट और स्वाभाविक है।
- source_word: וּשְׂאִי ... קִינָה
  choice: विलाप कर
  rationale: शाब्दिक भाव ‘विलाप उठा’ है, अर्थात ऊँचे स्वर में शोकगीत आरंभ करना। ‘विलाप कर’ सामान्य पाठक के लिए स्वाभाविक रहते हुए मूल आशय रखता है।
- source_word: עַל שְׁפָיִם
  choice: सूनी पहाड़ियों पर
  rationale: שְׁפָיִם वृक्षहीन, उजाड़ या खुली ऊँचाइयों को दर्शाता है। ‘सूनी पहाड़ियाँ’ शोक के वातावरण को सहज हिंदी में व्यक्त करती हैं और इसे अनावश्यक रूप से उपासना-स्थलों का तकनीकी नाम नहीं बनातीं।
- source_word: כִּי מָאַס יְהוָה
  choice: क्योंकि याहवे ने ... ठुकरा दिया है
  rationale: מאס अस्वीकार या तिरस्कार कर देने का भाव रखता है। ‘ठुकरा दिया’ भविष्यद्वाणी की तीव्रता को स्पष्ट आधुनिक हिंदी में व्यक्त करता है।
- source_word: וַיִּטֹּשׁ
  choice: छोड़ दिया है
  rationale: נטש त्यागने या बेसहारा छोड़ देने को दर्शाता है। ‘ठुकराकर छोड़ दिया’ दोनों हिब्रू क्रियाओं का क्रम और संयुक्त बल बनाए रखता है।
- source_word: דּוֹר עֶבְרָתוֹ
  choice: अपने प्रकोप की पीढ़ी
  rationale: यह हिब्रू की संक्षिप्त संबंध-रचना का निकट अनुवाद है। עֶבְרָה प्रचंड क्रोध या प्रकोप है; संबंध की वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: याहवे
  alternative: यहोवा अथवा ‘प्रभु’
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसका हिंदी लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: נִזְרֵךְ की प्रतीकात्मक छवि
  choice: अपने बाल
  alternative: अपना मुकुट; अपने समर्पित बाल
  rationale: काटने और फेंकने की आज्ञाएँ बाल की ओर प्रबल संकेत करती हैं, पर शब्द में मुकुट और समर्पण का अर्थ-संबंध भी है। मुख्य पाठ में सहज दृश्य रखा गया है और व्यापक अर्थ पादटिप्पणी में दिया गया है; किसी तकनीकी नाज़ीर-व्रत को आरोपित नहीं किया गया।
- issue: דּוֹר עֶבְרָתוֹ का संबंध
  choice: अपने प्रकोप की पीढ़ी
  alternative: वह पीढ़ी जो उसके प्रकोप के अधीन है
  rationale: शाब्दिक संबंध-रचना कठोर और अर्थगत रूप से खुली है—यह ऐसी पीढ़ी हो सकती है जिस पर प्रकोप है या जो उसके प्रकोप से चिह्नित है। मुख्य पाठ इस तनाव को अनावश्यक व्याख्या से नहीं सुलझाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। स्त्रीलिंग एकवचन आज्ञाएँ मानवीकृत यरूशलेम/यहूदा को संबोधन दर्शाती हैं। भविष्यद्वाणी की काव्यात्मक कठोरता को ‘ठुकराकर छोड़ दिया’ और अपेक्षाकृत शाब्दिक ‘प्रकोप की पीढ़ी’ में सुरक्षित रखा गया है।
