id: JER.7.10
reference: Jeremiah 7:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/בָאתֶ֞ם וַ/עֲמַדְתֶּ֣ם לְ/פָנַ֗/י בַּ/בַּ֤יִת הַ/זֶּה֙ אֲשֶׁ֣ר נִקְרָא שְׁמִ֣/י עָלָ֔י/ו וַ/אֲמַרְתֶּ֖ם נִצַּ֑לְנוּ לְמַ֣עַן עֲשׂ֔וֹת אֵ֥ת כָּל הַ/תּוֹעֵב֖וֹת הָ/אֵֽלֶּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/010.yaml
  text: Then you come and stand before me in this house[a], which is called by my name, and say[b], ‘We are delivered!’—so that you may do all these abominations.
translation:
  language: hi
  text: फिर तुम आकर इस भवन[a] में मेरे सामने खड़े होते हो, जिस पर मेरा नाम रखा गया है, और कहते हो, “हम बच गए हैं!”[b]—ताकि तुम ये सब घिनौने काम कर सको।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अर्थात मंदिर। हिब्रू: “यह घर।”'
    reason: lexical_alternative
  - marker: b
    text: या, “हमारा छुटकारा हो गया है!” अथवा “हम सुरक्षित हैं!”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאתֶם
  choice: फिर तुम आकर
  rationale: वाव से जुड़ी भविष्यद्वाणीपरक आरोप-शृंखला का क्रमिक बल ‘फिर’ से और בוא का सामान्य अर्थ ‘आकर’ से व्यक्त होता है।
- source_word: וַעֲמַדְתֶּם לְפָנַי
  choice: मेरे सामने खड़े होते हो
  rationale: עמד + לפני का सीधा अर्थ किसी की उपस्थिति में खड़ा होना है; वर्तमानकालीन रूप आरोप को सजीव रखता है।
- source_word: בַּבַּיִת הַזֶּה
  choice: इस भवन में
  rationale: בַּיִת का मूल अर्थ ‘घर/भवन’ है। यहाँ संदर्भ मंदिर का है, पर ‘भवन’ स्रोत के ‘house’ रूपक और पवित्र स्थल दोनों को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: אֲשֶׁר נִקְרָא שְׁמִי עָלָיו
  choice: जिस पर मेरा नाम पुकारा गया है
  rationale: हिब्रू निष्क्रिय मुहावरे और עָלָיו ‘जिस पर’ को यथासंभव सुरक्षित रखा गया है; इसका भाव परमेश्वर के नाम से पहचाने जाने और उसके अधिकार में होने का है।
- source_word: נִצַּלְנוּ
  choice: हम बच गए हैं!
  rationale: נצל के निफ़अल पूर्ण रूप में बचाए जाने अथवा संकट से निकल आने का भाव है। ‘बच गए हैं’ सामान्य हिंदी में उस दावे को व्यक्त करता है और केवल भावी सुरक्षा तक अर्थ को सीमित नहीं करता।
- source_word: לְמַעַן עֲשׂוֹת
  choice: ताकि तुम ... कर सको
  rationale: לְמַעַן उद्देश्य अथवा परिणाम का तीखा, व्यंग्यात्मक संबंध बनाता है। ‘ताकि’ इसे बनाए रखता है; स्रोत में निरंतरता का स्पष्ट पक्ष न होने के कारण ‘करते रहो’ नहीं जोड़ा गया।
- source_word: כָּל הַתּוֹעֵבוֹת הָאֵלֶּה
  choice: ये सब घिनौने काम
  rationale: תועבות नैतिक और धार्मिक रूप से अत्यंत घृणित कर्मों का प्रबल वाचा-संबंधी शब्द है; ‘घिनौने काम’ आधुनिक पाठक के लिए स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: मंदिर के लिए בַּיִת का अनुवाद
  choice: भवन
  alternative: मंदिर / घर
  rationale: संदर्भ यरूशलेम के मंदिर का है, किंतु हिब्रू में ‘घर’ का शब्द है। ‘भवन’ मूल शब्द की छवि को रखता है, जबकि पादटिप्पणी तत्काल संदर्भ स्पष्ट करती है।
- issue: נִצַּלְנוּ के दावे का बल
  choice: हम बच गए हैं!
  alternative: हमारा उद्धार हो गया है! / हम सुरक्षित हैं!
  rationale: वक्ता मंदिर में आने को अपने बच निकलने या बचाए जाने का प्रमाण मानते हैं। ‘बच गए हैं’ उद्धारशास्त्रीय अर्थ को अनावश्यक रूप से संकीर्ण किए बिना पूर्ण क्रिया और दावे की धृष्टता दोनों रखता है।
- issue: לְמַעַן का उद्देश्य अथवा परिणाम
  choice: ताकि
  alternative: जिससे
  rationale: पद में जानबूझकर पाप करने की अनुमति मान लेने पर व्यंग्यपूर्ण आरोप है। ‘ताकि’ उद्देश्य/परिणाम की वास्तविक अस्पष्टता को पर्याप्त रूप से खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक पाठ के योग्य रखी गई है। ‘जिस पर मेरा नाम पुकारा गया है’ कुछ बाइबलीय मुहावरेदारपन जानबूझकर सुरक्षित रखता है; मुख्य वाक्य में सरल क्रियाएँ और सामान्य शब्दावली प्रयुक्त हैं।
