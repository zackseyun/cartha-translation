base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/020.yaml
  text: 'Therefore thus says the Lord GOD: Behold[a], my anger and my wrath are being poured out on this place, on man and on beast, on the trees of the field and on the fruit of the ground; it will burn and will not be quenched.'
translation:
  language: hi
  text: 'इसलिए प्रभु यहोवा यों कहते हैं: देखो, मेरा क्रोध और मेरा प्रकोप इस स्थान पर—मनुष्य[a] और पशु पर, खेत के पेड़ों और भूमि की उपज पर—उंडेला जा रहा है। वह भड़केगा और बुझाया न जाएगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मानवजाति”; इब्रानी शब्द אָדָם यहाँ एकवचन में है, पर उसका अर्थ सामान्य रूप से समस्त मनुष्यों से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले अभियोग से निकलने वाले दंडात्मक निष्कर्ष को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: כֹּה אָמַר
  choice: यों कहते हैं
  rationale: भविष्यद्वक्ताओं की मानक संदेशवाहक शैली को गरिमापूर्ण और सहज हिन्दी में बनाए रखता है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: उपाधि אֲדֹנָי और परमेश्वर के विशिष्ट नाम יהוה, दोनों को अलग और स्पष्ट रखता है।
- source_word: הִנֵּה
  choice: देखो
  rationale: गंभीर ईश्वरीय घोषणा की ओर ध्यान खींचता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: אַפִּי וַחֲמָתִי
  choice: मेरा क्रोध और मेरा प्रकोप
  rationale: दो निकटार्थक इब्रानी शब्दों का भेद रखते हुए दूसरे पद की तीव्रता व्यक्त करता है।
- source_word: נִתֶּכֶת
  choice: उंडेला जा रहा है
  rationale: स्त्रीलिंग एकवचन कृदंत संयुक्त भाव को सामूहिक रूप से ग्रहण करता है; हिन्दी का यह रूप जारी अथवा आसन्न उंडेले जाने की सजीव छवि बनाए रखता है।
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: इस स्थान पर
  rationale: दंड के लक्ष्य को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: הָאָדָם
  choice: मनुष्य
  rationale: एकवचन रूप तथा मानवजाति-सूचक सामान्य अर्थ दोनों को हिन्दी में स्वाभाविक ढंग से रखता है।
- source_word: הַבְּהֵמָה
  choice: पशु
  rationale: यह व्यापक प्राणी-वर्ग को दर्शाता है और इसे केवल घरेलू मवेशियों तक सीमित नहीं करता।
- source_word: עֵץ הַשָּׂדֶה
  choice: मैदान के पेड़
  rationale: इब्रानी के सामूहिक एकवचन को हिन्दी में स्वाभाविक बहुवचन के रूप में व्यक्त करता है।
- source_word: פְּרִי הָאֲדָמָה
  choice: भूमि की उपज
  rationale: कृषि-संदर्भ में 'फल' से अधिक व्यापक अर्थ देता है और भूमि से उत्पन्न फसल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וּבָעֲרָה וְלֹא תִכְבֶּה
  choice: वह धधकेगा और बुझाया न जाएगा
  rationale: आग की निहित छवि और दंड की अनिवार्यता दोनों को बनाए रखता है; स्त्रीलिंग क्रिया का निहित कर्ता उंडेली गई ज्वाला/प्रकोप है।
theological_decisions:
- issue: संयुक्त ईश्वरीय संबोधन אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर
  rationale: मूल पाठ में उपाधि और वाचा-संबंधी विशिष्ट नाम दोनों उपस्थित हैं; 'प्रभु यहोवा' उस भेद को मिटाए बिना हिन्दी में स्पष्ट रखता है।
- issue: הָאָדָם का सामान्य मानव-सूचक अर्थ
  choice: मनुष्य
  alternative: मानवजाति
  rationale: इब्रानी का व्याकरणिक एकवचन सुरक्षित रहता है, जबकि सन्दर्भ में उसका समावेशी, सामान्य मानव-सूचक बल समझ में आता है।
- issue: अंतिम स्त्रीलिंग क्रिया का कर्ता
  choice: वह धधकेगा
  alternative: यह आग जलती रहेगी
  rationale: मूल में आग का संज्ञा-रूप स्पष्टतः नहीं है; इसलिए निहित अग्नि-रूपक को बनाए रखते हुए अतिरिक्त संज्ञा जोड़ने से बचा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और भविष्यद्वाणी की न्याय-घोषणा के अनुरूप रखी गई है। 'देखो' ध्यानाकर्षक הִנֵּה को सहज हिन्दी में व्यक्त करता है; डैश दंड के लक्ष्य-सूचक क्रम को स्पष्ट करते हैं।
