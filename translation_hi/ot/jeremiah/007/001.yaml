  text: הַ/דָּבָר֙ אֲשֶׁ֣ר הָיָ֣ה אֶֽל יִרְמְיָ֔הוּ מֵ/אֵ֥ת יְהוָ֖ה לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/001.yaml
  text: 'The word that came to Yirmeyahu from the LORD, saying:'
translation:
  language: hi
  text: 'वह वचन जो यहोवा की ओर से यिर्मयाह के पास पहुँचा:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַדָּבָר
  choice: वह वचन
  rationale: भविष्यवाणी के संदर्भ में דָּבָר केवल सामान्य ‘बात’ नहीं, बल्कि परमेश्वर से प्राप्त संदेश को सूचित करता है; ‘वचन’ हिन्दी बाइबलीय प्रयोग में स्वाभाविक और गरिमापूर्ण है।
- source_word: הָיָה אֶל
  choice: के पास पहुँचा
  rationale: यह इब्रानी भविष्यवाणी-सूत्र है। शाब्दिक ‘हुआ’ की अपेक्षा ‘पहुँचा’ आधुनिक हिन्दी में संदेश के प्राप्त होने का भाव स्पष्ट करता है।
- source_word: מֵאֵת יְהוָה
  choice: यहोवा की ओर से
  rationale: מֵאֵת स्रोत या प्रेषक दर्शाता है। चतुरक्षरीय दिव्य नाम को प्रचलित हिन्दी रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: לֵאמֹר
  choice: ':'
  rationale: यह रूप आगे आने वाले प्रत्यक्ष संदेश का परिचय देता है; हिन्दी में द्विबिंदु उसी कार्य को स्वाभाविक ढंग से पूरा करता है और अनावश्यक ‘यह कहते हुए’ से बचाता है।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम है, उपाधि אֲדֹנָי नहीं। ‘यहोवा’ हिन्दी पाठकों के लिए पहचाना हुआ नाम है और मूल का नाम/उपाधि भेद सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त भविष्यवाणी-प्रस्तावना को गरिमापूर्ण और सहज रखा गया है। ‘कहते हुए’ को यांत्रिक रूप से न रखकर द्विबिंदु दिया गया है, क्योंकि अगली आयत संदेश आरम्भ करती है।
