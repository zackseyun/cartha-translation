  text: כִּ֣י אִֽם אֶת הַ/דָּבָ֣ר הַ֠/זֶּה צִוִּ֨יתִי אוֹתָ֤/ם לֵ/אמֹר֙ שִׁמְע֣וּ בְ/קוֹלִ֔/י וְ/הָיִ֤יתִי לָ/כֶם֙ לֵֽ/אלֹהִ֔ים וְ/אַתֶּ֖ם תִּֽהְיוּ לִ֣/י לְ/עָ֑ם וַ/הֲלַכְתֶּ֗ם בְּ/כָל הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר אֲצַוֶּ֣ה אֶתְ/כֶ֔ם לְמַ֖עַן יִיטַ֥ב לָ/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/023.yaml
  text: 'But this command I gave them: ‘Listen to my voice[a], and I will be your God, and you shall be my people; and walk in all the way that I command you, so that it may go well with you.’'
translation:
  language: hi
  text: 'पर मैंने उन्हें यह आज्ञा दी: “मेरी आवाज़ सुनो[a], और मैं तुम्हारा परमेश्वर होऊँगा और तुम मेरी प्रजा होगे। जिस पूरे मार्ग पर चलने की मैं तुम्हें आज्ञा दूँ, उस पर चलो, ताकि तुम्हारा भला हो।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरी आज्ञा मानो।” इब्रानी मुहावरे “मेरी आवाज़ सुनो” में प्रायः आज्ञापालन का भाव भी शामिल होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: पर
  rationale: पद 22 के कथन के बाद यह पद विरोधात्मक सुधार प्रस्तुत करता है—‘नहीं, बल्कि’। हिंदी में ‘पर’ इस विरोध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַדָּבָר הַזֶּה
  choice: यह आज्ञा
  rationale: דָּבָר का अर्थ ‘वचन/बात/विषय’ हो सकता है, पर צִוִּיתִי के साथ यहाँ आशय दी गई आज्ञा की विषयवस्तु से है।
- source_word: צִוִּיתִי אוֹתָם לֵאמֹר
  choice: मैंने उन्हें यह आज्ञा दी
  rationale: यह सहज हिंदी में आज्ञा देने की क्रिया और उसके बाद उद्धृत विषयवस्तु दोनों को स्पष्ट रखता है, बिना ‘आज्ञा दी, यह कहते हुए’ जैसी पुनरुक्ति के।
- source_word: שִׁמְעוּ בְקוֹלִי
  choice: मेरी आवाज़ सुनो
  rationale: यह इब्रानी मुहावरे के ‘सुनने’ वाले रूप को बनाए रखता है; वाचा के संदर्भ में निहित आज्ञापालन का भाव पादटिप्पणी में बताया गया है।
- source_word: וְהָיִיתִי לָכֶם לֵאלֹהִים
  choice: मैं तुम्हारा परमेश्वर होऊँगा
  rationale: यह वाचा-संबंधी सूत्र का स्वाभाविक और संबंधपरक हिंदी रूप है।
- source_word: וְאַתֶּם תִּהְיוּ לִי לְעָם
  choice: तुम मेरी प्रजा होगे
  rationale: यह पारस्परिक वाचा-सूत्र को स्पष्ट रखता है और ‘लोग’ की अपेक्षा सामूहिक संबंध के लिए ‘प्रजा’ अधिक सटीक है।
- source_word: וַהֲלַכְתֶּם בְּכָל הַדֶּרֶךְ
  choice: जिस पूरे मार्ग पर ... उसी पर चलो
  rationale: ‘चलना’ नैतिक जीवन के मूल रूपक को बनाए रखता है, जबकि ‘पूरा मार्ग’ स्रोत के एकवचन הַדֶּרֶךְ और व्यापक כָּל दोनों को दर्शाता है।
- source_word: אֲשֶׁר אֲצַוֶּה אֶתְכֶם
  choice: जिस ... पर चलने की आज्ञा मैं तुम्हें दूँ
  rationale: इब्रानी अपूर्ण क्रिया के भावी/सामान्य निर्देशात्मक बल को हिंदी के ‘दूँ’ से स्वाभाविक रूप मिलता है।
- source_word: לְמַעַן יִיטַב לָכֶם
  choice: ताकि तुम्हारा भला हो
  rationale: यह उद्देश्यसूचक לְמַעַן और कल्याणसूचक मुहावरे יִיטַב לָכֶם को संक्षिप्त, सहज हिंदी में व्यक्त करता है।
theological_decisions:
- issue: वाचा-सूत्र का अनुवाद
  choice: “मैं तुम्हारा परमेश्वर होऊँगा और तुम मेरी प्रजा होगे”
  alternative: “मैं तुम्हारे लिए परमेश्वर होऊँगा और तुम मेरे लिए एक प्रजा होगे”
  rationale: चुना हुआ रूप इब्रानी के पारस्परिक, संबंधपरक वाचा-सूत्र को स्वाभाविक हिंदी में रखता है और पाठ से आगे कोई धर्मसैद्धांतिक विस्तार नहीं जोड़ता।
- issue: שִׁמְעוּ בְקוֹלִי में आज्ञापालन का भाव
  choice: मुख्य पाठ में “मेरी आवाज़ सुनो”
  alternative: “मेरी आज्ञा मानो”
  rationale: मूल अभिव्यक्ति सुनने की है, यद्यपि संदर्भ में आज्ञापालन सम्मिलित है। मुख्य पाठ मूल रूपक को सुरक्षित रखता है और पादटिप्पणी निहित अर्थ स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल। ‘आवाज़ सुनो’ तथा ‘मार्ग पर चलो’ जैसे स्रोत-रूपकों को बनाए रखते हुए वाक्य-विन्यास को स्वाभाविक हिंदी बनाया गया है।
