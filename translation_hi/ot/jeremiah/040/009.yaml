  text: וַ/יִּשָּׁבַ֨ע לָ/הֶ֜ם גְּדַלְיָ֨הוּ בֶן אֲחִיקָ֤ם בֶּן שָׁפָן֙ וּ/לְ/אַנְשֵׁי/הֶ֣ם לֵ/אמֹ֔ר אַל תִּֽירְא֖וּ מֵ/עֲב֣וֹד הַ/כַּשְׂדִּ֑ים שְׁב֣וּ בָ/אָ֗רֶץ וְ/עִבְד֛וּ אֶת מֶ֥לֶךְ בָּבֶ֖ל וְ/יִיטַ֥ב לָ/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/009.yaml
  text: Gedaliah son of Ahikam[a], son of Shaphan, swore to them and to their men, saying, “Do not be afraid to serve the Chaldeans. Live in the land and serve the king of Babylon, and it will go well for you.”
translation:
  language: hi
  text: तब शापान के पोते और अहीकाम के पुत्र गदल्याह ने उनसे और उनके आदमियों से शपथ खाकर कहा, “कसदियों[a] की सेवा करने से मत डरो। देश में रहो और बाबेल के राजा की सेवा करो; तब तुम्हारा भला होगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बाबेल के लोग।” इब्रानी में “कसदियों” है—यह शब्द प्रायः बाबेली शासक सत्ता के लिए प्रयुक्त होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: शपथ खाकर कहा
  rationale: निफ़अल रूप औपचारिक रूप से शपथ खाने का अर्थ देता है। हिन्दी में ‘शपथ खाकर कहा’ स्वाभाविक है और לֵאמֹר के साथ कथन का परिचय भी स्पष्ट करता है।
- source_word: לָהֶם ... וּלְאַנְשֵׁיהֶם
  choice: उनसे और उनके आदमियों से
  rationale: אַנְשֵׁי व्यापक रूप से उनसे जुड़े पुरुषों, अनुचरों या सैनिकों को सूचित कर सकता है। ‘आदमियों’ मूल की व्यापकता बनाए रखता है और उन्हें निश्चित रूप से सैनिक नहीं ठहराता।
- source_word: מֵעֲבוֹד הַכַּשְׂדִּים
  choice: कसदियों की सेवा करने से
  rationale: भय-सूचक क्रिया के साथ מִן को हिन्दी में ‘से’ द्वारा स्वाभाविक रूप से व्यक्त किया गया है। עבד यहाँ राजनीतिक अधीनता में सेवा करने को सूचित करता है।
- source_word: הַכַּשְׂדִּים
  choice: कसदियों
  rationale: मूल इब्रानी जातीय-राजनीतिक पद ‘कसदी’ को मुख्य पाठ में बनाए रखा गया है; उस समय यह प्रायः बाबेली शासक सत्ता के लिए प्रयुक्त होता था।
- source_word: שְׁבוּ בָאָרֶץ
  choice: देश में रहो
  rationale: ישׁב का अर्थ बैठना, बसना या रहना हो सकता है। इस प्रसंग में ‘देश में रहो’ आधुनिक हिन्दी में स्वाभाविक है और वहाँ बने रहने का आशय व्यक्त करता है।
- source_word: וְעִבְדוּ אֶת מֶלֶךְ בָּבֶל
  choice: और बाबेल के राजा की सेवा करो
  rationale: राजनीतिक प्रसंग में עבד किसी शासक के अधीन रहकर उसकी सेवा करने का अर्थ देता है।
- source_word: וְיִיטַב לָכֶם
  choice: तब तुम्हारा भला होगा
  rationale: यह इब्रानी मुहावरा अनुकूल परिणाम और कुशलता व्यक्त करता है। ‘तुम्हारा भला होगा’ संक्षिप्त और स्वाभाविक हिन्दी है; ‘तब’ परिणाम-संबंध को स्पष्ट करता है।
