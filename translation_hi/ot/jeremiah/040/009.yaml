translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। वंशावली को स्वाभाविक हिन्दी क्रम (‘शापान के पोते और अहीकाम के पुत्र’) में रखा गया है। ‘कसदियों’ को मूल के अनुरूप मुख्य पाठ में रखकर अधिक परिचित विकल्प पादटिप्पणी में दिया गया है।
