  yaml_path: translation/ot/jeremiah/040/016.yaml
  text: But Gedaliah son of Ahikam said to Johanan son of Kareah, “Do not do this thing, for you are speaking a lie about Ishmael.”
translation:
  language: hi
  text: पर अहीकाम के पुत्र गदल्याह ने कारेह के पुत्र योहानान से कहा, “यह काम मत करो, क्योंकि तुम इश्माएल के बारे में झूठ बोल रहे हो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל תעש אֶת־הַדָּבָר הַזֶּה
  choice: यह काम मत करो
  rationale: निषेध और ‘इस बात/काम’ के आशय को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; प्रसंग में प्रस्तावित हत्या की कार्रवाई अभिप्रेत है।
- source_word: כִּי שֶׁקֶר אַתָּה דֹבֵר
  choice: क्योंकि तुम ... झूठ बोल रहे हो
  rationale: שֶׁקֶר के स्पष्ट अर्थ ‘झूठ’ को बनाए रखता है और अंग्रेज़ी परामर्श-पाठ की अपेक्षा इब्रानी वाक्य-विन्यास के निकट है।
- source_word: אֶל־יִשְׁמָעֵאל
  choice: इश्माएल के बारे में
  rationale: यहाँ אֶל कथन के विषय/संदर्भ को सूचित करता है; ‘इश्माएल से’ कहना अर्थ को गलत दिशा देगा।
