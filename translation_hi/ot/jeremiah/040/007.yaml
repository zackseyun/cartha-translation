base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/007.yaml
  text: When all the commanders of the forces who were in the open country[a], they and their men, heard that the king of Babylon had appointed Gedaliah son of Ahikam over the land, and that he had entrusted to him men, women, children, and some of the poorest of the land, from those who had not been exiled to Babylon[c][b],
translation:
  language: hi
  text: जब खुले देहात[a] में मौजूद सेना के सभी सेनापतियों और उनके सैनिकों ने सुना कि बाबेल के राजा ने अहीकाम के पुत्र गदल्याह को देश का प्रभारी नियुक्त किया था और पुरुषों, स्त्रियों, बच्चों तथा देश के कुछ निर्धन लोगों[b] को—जिन्हें बाबेल ले जाकर निर्वासित नहीं किया गया था[c]—उसके सुपुर्द किया था,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मैदान में।”
    reason: lexical_alternative
  - marker: b
    text: या “देश के दीन-दरिद्र लोगों को।”
    reason: lexical_alternative
  - marker: c
    text: या “जिन्हें निर्वासित करके बाबेल नहीं भेजा गया था।”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי הַחֲיָלִים
  choice: सेना के सभी सेनापतियों
  rationale: שָׂרֵי नेतृत्वकारी सैन्य अधिकारियों और הַחֲיָלִים सैन्य दलों को सूचित करता है; यह हिंदी में स्वाभाविक और पद के विषय में अनावश्यक रूप से विशिष्ट नहीं है।
- source_word: בַּשָּׂדֶה
  choice: खुले देहात में
  rationale: शाब्दिक अर्थ ‘मैदान में’ है, पर प्रसंग में नगरों से बाहर के ग्रामीण खुले क्षेत्र का बोध होता है।
- source_word: וְאַנְשֵׁיהֶם
  choice: और उनके सैनिकों
  rationale: शाब्दिक रूप से ‘उनके पुरुष’; सैन्य प्रसंग में ‘उनके सैनिक’ आशय को स्पष्ट और स्वाभाविक बनाता है।
- source_word: הִפְקִיד ... בָּאָרֶץ
  choice: देश का अधिकारी नियुक्त किया
  rationale: पहला प्रयोग प्रशासनिक अधिकार सौंपकर नियुक्त करने का है; यह अधिकार-क्षेत्र को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: הִפְקִיד אִתּוֹ
  choice: उसके अधिकार में सौंपा
  rationale: दूसरा प्रयोग लोगों को गदल्याह की देखरेख अथवा अधिकार में रखने का भाव देता है।
- source_word: אֲנָשִׁים וְנָשִׁים וָטָף
  choice: पुरुषों, स्त्रियों, बच्चों
  rationale: טָף के लिए ‘बच्चों’ का प्रयोग आधुनिक पाठक के लिए स्पष्ट है और ‘छोटे जनों’ की अस्पष्टता से बचता है।
- source_word: מִדַּלַּת הָאָרֶץ
  choice: देश के कुछ निर्धन लोगों
  rationale: מִן का अंशवाचक बल ‘कुछ’ से और דַּלַּת का आर्थिक-सामाजिक निम्नता का भाव ‘निर्धन’ से व्यक्त होता है।
- source_word: מֵאֲשֶׁר לֹא הָגְלוּ בָּבֶלָה
  choice: जिन्हें बंदी बनाकर बाबेल नहीं ले जाया गया था
  rationale: हिब्रू में बहुवचन कर्ता अनिर्दिष्ट है; हिंदी का कर्मवाच्य अर्थ को सुरक्षित रखते हुए निर्वासन की जबरन प्रकृति व्यक्त करता है।
- source_word: וַיִּשְׁמְעוּ
  choice: जब ... ने सुना
  rationale: वाव-क्रम कथा को आगे बढ़ाता है और यह वाक्य अगले पद में पूर्ण होता है; ‘जब’ उस आश्रित संरचना को बनाए रखता है।
