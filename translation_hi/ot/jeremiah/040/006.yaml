source:
  edition: WLC
  text: וַ/יָּבֹ֧א יִרְמְיָ֛הוּ אֶל גְּדַלְיָ֥ה בֶן אֲחִיקָ֖ם הַ/מִּצְפָּ֑תָ/ה וַ/יֵּ֤שֶׁב אִתּ/וֹ֙ בְּ/ת֣וֹךְ הָ/עָ֔ם הַ/נִּשְׁאָרִ֖ים בָּ/אָֽרֶץ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/006.yaml
  text: So Jeremiah went to Gedaliah son of Ahikam at Mizpah[a], and he lived with him among the people who were left in the land.
translation:
  language: hi
  text: तब यिर्मयाह मिस्पा में अहीकाम के पुत्र गदल्याह के पास गया और उसके साथ देश में बचे हुए[a] लोगों के बीच रहने लगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “रह गए”; शाब्दिक, “देश में बचे/रह गए लोग।”
    reason: הַנִּשְׁאָרִים के वर्णनात्मक कृदन्त के लिए अंग्रेज़ी audit-trail में दिए गए ‘who remained’ विकल्प को सुरक्षित रखता है।
lexical_decisions:
- source_word: וַיָּבֹא
  choice: गया
  rationale: कथात्मक संदर्भ में בוא यिर्मयाह के गदल्याह के पास जाने को व्यक्त करता है; आधुनिक हिन्दी में ‘गया’ स्वाभाविक है।
- source_word: גְּדַלְיָה בֶן אֲחִיקָם
  choice: अहीकाम के पुत्र गदल्याह
  rationale: इब्रानी कुलनाम-सूचक संरचना को स्पष्ट और स्वाभाविक हिन्दी क्रम में रखा गया है।
- source_word: הַמִּצְפָּתָה
  choice: मिस्पा में
  rationale: स्थाननाम के दिशासूचक रूप को पूरे वाक्य के साथ पढ़ने पर गदल्याह का स्थान बताने वाला ‘मिस्पा में’ सहज है और ‘के पास’ के साथ अनावश्यक दोहरी दिशात्मक अभिव्यक्ति से बचता है।
- source_word: וַיֵּשֶׁב
  choice: रहने लगा
  rationale: ישב यहाँ बैठने के बजाय निवास करने का अर्थ देता है; क्रमवाची क्रिया के संदर्भ में ‘रहने लगा’ आरम्भ और जारी निवास को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אִתּוֹ
  choice: उसके साथ
  rationale: यह सहवाचक पद गदल्याह के साथ रहने को सीधे व्यक्त करता है।
- source_word: בְּתוֹךְ הָעָם
  choice: लोगों के बीच
  rationale: सामाजिक समूह के मध्य होने के अर्थ के लिए यह आधुनिक और सहज हिन्दी है।
- source_word: הַנִּשְׁאָרִים
  choice: बचे हुए
  rationale: निफ़अल कृदन्त का वर्णनात्मक अर्थ सुरक्षित रखा गया है; इसे धर्मवैज्ञानिक तकनीकी संज्ञा ‘बचा हुआ समुदाय’ या ‘शेष’ में नहीं बदला गया।
- source_word: בָּאָרֶץ
  choice: देश में
  rationale: यहाँ אֶרֶץ उस भू-राजनीतिक क्षेत्र को सूचित करता है जहाँ लोग रह गए थे; ‘देश में’ सामान्य हिन्दी में स्वाभाविक है और पद से स्पष्ट न किए गए ‘यहूदा’ को नहीं जोड़ता।
theological_decisions:
- issue: הַנִּשְׁאָרִים को धर्मवैज्ञानिक ‘शेष’ के रूप में पढ़ने की सम्भावना
  choice: देश में बचे हुए लोग
  alternative: शेष लोग / शेष बचे समुदाय
  rationale: मूल पाठ संज्ञात्मक तकनीकी पद के बजाय कृदन्तीय वर्णन प्रयोग करता है। वर्णनात्मक अनुवाद संभावित व्यापक ‘शेष’ विषय को न नकारता है, न उसे इस पद पर आरोपित करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण कथात्मक शैली। नामों को हिन्दी बाइबलीय प्रचलन के अनुरूप ‘यिर्मयाह’, ‘अहीकाम’, ‘गदल्याह’ और ‘मिस्पा’ लिखा गया है।
