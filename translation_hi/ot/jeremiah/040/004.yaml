base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/004.yaml
  text: And now, look, today I have freed you from the chains on your hands. If you want to come with me to Babylon, come, and I will look after you[a]. But if you do not want to come with me to Babylon, do not. Look, the whole land is before you; go wherever seems good and right to you[b][c].
translation:
  language: hi
  text: और अब देखो, आज मैंने तुम्हें तुम्हारे हाथों की बेड़ियों से मुक्त कर दिया है। यदि तुम मेरे साथ बाबेल आना चाहो, तो आओ; मैं तुम्हारी देखभाल करूँगा[a]। लेकिन यदि तुम मेरे साथ बाबेल न आना चाहो, तो मत आओ। देखो, सारा देश तुम्हारे सामने है; जहाँ जाना तुम्हें अच्छा और उचित लगे, वहाँ चले जाओ[b][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मैं अपनी आँख तुम पर रखूँगा”; यहाँ यह अनुकूल देखभाल या संरक्षण का मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “यदि यह तुम्हारी आँखों में अच्छा/बुरा हो” और “जो तुम्हारी आँखों में अच्छा और उचित हो”; ये अभिव्यक्तियाँ इच्छा, पसंद या व्यक्तिगत निर्णय बताती हैं।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी पाठ का अंत शाब्दिक रूप से, “वहाँ जाने के लिए, जाओ” से होता है; यह जोर देकर दी गई अनुमति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: פִתַּחְתִּיךָ
  choice: मैंने ... तुम्हें मुक्त कर दिया है
  rationale: פתח का मूल अर्थ ‘खोलना’ है, पर व्यक्ति को बेड़ियों से खोलने के इस प्रसंग में इसका स्वाभाविक अर्थ बंधन से मुक्त करना है।
- source_word: הָאזִקִּים אֲשֶׁר עַל־יָדֶךָ
  choice: तुम्हारे हाथों में पड़ी बेड़ियों
  rationale: אזקים कैदी को बाँधने वाली बेड़ियाँ हैं। यद्यपि יד एकवचन में है, यहाँ उसका सामूहिक अर्थ है; स्वाभाविक हिन्दी में ‘हाथों’ उपयुक्त है और शरीर के किसी अधिक विशिष्ट अंग को अनावश्यक रूप से निर्धारित नहीं करता।
- source_word: אִם־טוֹב בְּעֵינֶיךָ ... וְאִם־רַע בְּעֵינֶיךָ
  choice: यदि तुम ... आना चाहो ... यदि तुम ... नहीं आना चाहते
  rationale: ‘तुम्हारी आँखों में अच्छा/बुरा’ इच्छा अथवा पसंद व्यक्त करने वाला इब्रानी मुहावरा है। आधुनिक हिन्दी में सकारात्मक और नकारात्मक इच्छा के रूप में इसे व्यक्त करना स्पष्ट और स्वाभाविक है।
- source_word: וְאָשִׂים אֶת־עֵינִי עָלֶיךָ
  choice: मैं तुम्हारी देखभाल करूँगा
  rationale: शाब्दिक चित्र ‘मैं अपनी आँख तुम पर रखूँगा’ है। इस प्रसंग में यह प्रतिकूल निगरानी नहीं, बल्कि अनुकूल ध्यान, देखरेख और संरक्षण बताता है।
- source_word: חֲדָל
  choice: मत आओ
  rationale: आज्ञार्थक क्रिया प्रस्तावित कार्य से रुकने को कहती है। हिन्दी में संदर्भ से प्राप्त क्रिया ‘आना’ को दोहराने से आशय स्पष्ट रहता है।
- source_word: כָּל־הָאָרֶץ לְפָנֶיךָ
  choice: सारा देश तुम्हारे सामने है
  rationale: यह निकट-शाब्दिक अभिव्यक्ति यिर्मयाह के लिए खुले क्षेत्र और चुनाव की स्वतंत्रता दोनों को व्यक्त करती है।
- source_word: אֶל־טוֹב וְאֶל־הַיָּשָׁר בְּעֵינֶיךָ
  choice: जहाँ जाना तुम्हें अच्छा और उचित लगे
  rationale: अनुवाद गंतव्य-बोध तथा טוֹב और יָשָׁר के दोहरे मूल्यांकन—‘अच्छा’ और ‘उचित’—दोनों को बनाए रखता है।
- source_word: לָלֶכֶת שָׁמָּה לֵךְ
  choice: वहाँ चले जाओ
  rationale: इब्रानी में क्रिया की पुनरुक्ति प्रबल अनुमति देती है। हिन्दी का आज्ञार्थक ‘चले जाओ’ इसी स्वतंत्र अनुमति को स्वाभाविक ढंग से व्यक्त करता है; स्रोत-रूप पादटिप्पणी में दिया गया है।
