  edition: WLC
  text: וְ/גַ֣ם כָּֽל הַ/יְּהוּדִ֡ים אֲשֶׁר בְּ/מוֹאָ֣ב וּ/בִ/בְנֵֽי עַמּ֨וֹן וּ/בֶ/אֱד֜וֹם וַ/אֲשֶׁ֤ר בְּ/כָל הָֽ/אֲרָצוֹת֙ שָֽׁמְע֔וּ כִּֽי נָתַ֧ן מֶֽלֶךְ בָּבֶ֛ל שְׁאֵרִ֖ית לִֽ/יהוּדָ֑ה וְ/כִי֙ הִפְקִ֣יד עֲלֵי/הֶ֔ם אֶת גְּדַלְיָ֖הוּ בֶּן אֲחִיקָ֥ם בֶּן שָׁפָֽן־־׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/011.yaml
  text: Also[a], all the Judeans who were in Moab, among the Ammonites, in Edom, and in all the other lands heard that the king of Babylon had left a remnant for Judah and had appointed Gedaliah son of Ahikam, son of Shaphan, over them.
translation:
  language: hi
  text: मोआब में, अम्मोनियों के बीच, एदोम में और सभी देशों में रहने वाले सभी यहूदियों ने भी सुना कि बाबेल के राजा ने यहूदा के लिए एक शेष समुदाय को छोड़ रखा था और उनके ऊपर शाफान के पुत्र अहीकाम के पुत्र गदल्याह को नियुक्त किया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְגַם
  choice: ने भी
  rationale: संयोजक और योगात्मक भाव को स्वाभाविक हिन्दी वाक्य-विन्यास में ‘ने भी’ से व्यक्त किया गया है।
- source_word: כָּל הַיְּהוּדִים
  choice: सभी यहूदियों
  rationale: यह शब्द यहाँ यहूदा से संबद्ध लोगों को सूचित करता है। प्रचलित हिन्दी ‘यहूदी’ सहज है, जबकि प्रसंग उनके ऐतिहासिक-भौगोलिक संबंध को स्पष्ट करता है।
- source_word: אֲשֶׁר בְּמוֹאָב וּבִבְנֵי עַמּוֹן וּבֶאֱדוֹם וַאֲשֶׁר בְּכָל הָאֲרָצוֹת
  choice: मोआब में, अम्मोनियों के बीच, एदोम में और अन्य सभी देशों में रहने वाले
  rationale: स्थान-सूचक पदों को स्वाभाविक रूप से रखा गया है; ‘अम्मोनियों के बीच’ בני עמון के जाति-समूह वाले अर्थ को व्यक्त करता है और ‘अन्य’ नामित क्षेत्रों से आगे विस्तार को स्पष्ट करता है।
- source_word: שָׁמְעוּ
  choice: सुना
  rationale: समाचार प्राप्त होने की साधारण कथात्मक क्रिया का सीधा और स्वाभाविक अनुवाद है।
- source_word: כִּי נָתַן מֶלֶךְ בָּבֶל שְׁאֵרִית לִיהוּדָה
  choice: कि बाबेल के राजा ने यहूदा के लिए कुछ बचे हुए लोगों को जीवित छोड़ दिया है
  rationale: נתן को इस विनाशोत्तर प्रसंग में ‘जीवित छोड़ दिया’ समझना स्वाभाविक है। שארית का सामान्य ऐतिहासिक अर्थ ‘बचे हुए लोग’ रखा गया है, बिना किसी अतिरिक्त धर्मवैज्ञानिक अर्थ को आरोपित किए।
- source_word: וְכִי הִפְקִיד עֲלֵיהֶם
  choice: और उन पर ... को अधिकारी नियुक्त किया है
  rationale: हिफ़इल रूप यहाँ किसी को शासन या प्रशासन का दायित्व सौंपने का अर्थ देता है; ‘अधिकारी नियुक्त किया’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: אֶת גְּדַלְיָהוּ בֶּן אֲחִיקָם בֶּן שָׁפָן
  choice: शाफान के पोते और अहीकाम के पुत्र गदल्याह
  rationale: वंशावली के दोनों संबंध सुरक्षित रखते हुए हिन्दी के स्वाभाविक क्रम में नाम प्रस्तुत किए गए हैं।
theological_decisions:
- issue: שְׁאֵרִית का अनुवाद
  choice: बचे हुए लोग
  alternative: शेष जन / बचा हुआ समुदाय
  rationale: इब्रानी शब्द आपदा के बाद जीवित बचे लोगों को सूचित कर सकता है और भविष्यद्वक्ताओं में व्यापक धर्मवैज्ञानिक प्रतिध्वनि भी रखता है। मुख्य पाठ में सहज ऐतिहासिक अर्थ रखा गया है; पादटिप्पणी प्रमुख शब्दावली ‘शेष जन’ की संभावना दिखाती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। स्थानों और व्यक्तिनामों के प्रचलित हिन्दी बाइबलीय रूप अपनाए गए हैं; लंबी इब्रानी संरचना को हिन्दी में एक स्पष्ट वाक्य के रूप में रखा गया है।
