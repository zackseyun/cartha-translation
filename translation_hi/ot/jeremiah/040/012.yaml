- source_word: וַיָּבֹאוּ אֶרֶץ יְהוּדָה
  choice: वे यहूदा देश में ... आए
  rationale: בוא के साथ क्षेत्र में प्रवेश की गति है; हिन्दी में ‘देश में आए’ इसे सहज रूप से व्यक्त करता है।
- source_word: אֶל גְּדַלְיָהוּ הַמִּצְפָּתָה
  choice: मिस्पा में गदल्याह के पास
  rationale: दिशासूचक ה स्थानीय संदर्भ में मिस्पा को गदल्याह का स्थान बताता है; हिन्दी वाक्य-विन्यास में यह क्रम स्पष्ट है।
- source_word: וַיַּאַסְפוּ
  choice: इकट्ठा किए
