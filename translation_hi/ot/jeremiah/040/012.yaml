base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/012.yaml
  text: Then all the Judeans returned from all the places where they had been driven[a], and they came to the land of Judah, to Gedaliah at Mizpah[c][b], and gathered a very great abundance of wine and summer fruit.
translation:
  language: hi
  text: तब सभी यहूदावासी[a] उन सब स्थानों से लौट आए, जहाँ उन्हें दूर कर दिया गया था[b]। वे यहूदा देश में मिस्पा के गदल्याह के पास आए और उन्होंने बहुत बड़ी मात्रा में दाखरस और गर्मियों के फल[c] इकट्ठा किए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सभी यहूदी।’ इब्रानी शब्द यहूदा के लोगों को और, विस्तृत अर्थ में, यहूदियों को सूचित कर सकता है; यहाँ ‘यहूदावासी’ उस समय के यहूदा देश से उनके ऐतिहासिक संबंध को उभारता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘जहाँ उन्हें निर्वासित कर दिया गया था’ अथवा ‘जहाँ उन्हें तितर-बितर कर दिया गया था।’
    reason: lexical_alternative
  - marker: c
    text: ‘गर्मियों के फल’ से आशय गरमी के अंतिम दिनों या कटनी के समय इकट्ठी की जाने वाली मौसमी उपज से है।
    reason: cultural_note
