- source_word: יַיִן
  choice: दाखमधु
  rationale: यह יין का प्रचलित, गरिमापूर्ण और सुस्पष्ट हिन्दी बाइबलीय प्रतिशब्द है।
- source_word: וָקַיִץ
  choice: ग्रीष्मकालीन फल
  rationale: קיץ गरमी के मौसम में पकने या बटोरे जाने वाले फल अथवा मौसमी उपज को सूचित करता है; सीधा अर्थ पाठ में रखा गया है और विस्तार पादटिप्पणी में दिया गया है।
- source_word: הַרְבֵּה מְאֹד
  choice: बहुत बड़ी मात्रा में
  rationale: यह पदबंध अत्यधिक मात्रा पर बल देता है; चुना हुआ रूप हिन्दी में स्वाभाविक ढंग से उस तीव्रता को बनाए रखता है।
