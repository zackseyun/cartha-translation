  yaml_path: translation/ot/jeremiah/040/014.yaml
  text: And they said to him[b][a], “Do you really know that Baalis king of the Ammonites has sent Ishmael son of Nethaniah to strike you down?” But Gedaliah son of Ahikam did not believe them.
translation:
  language: hi
  text: उन्होंने उससे कहा, “क्या तुम सचमुच जानते हो[a] कि अम्मोनियों के राजा बालिस ने नतन्याह के पुत्र इश्माएल को तुम्हारी जान लेने के लिए भेजा है?” लेकिन अहीकाम के पुत्र गदल्याह ने उनकी बात पर विश्वास नहीं किया।
  philosophy: optimal-equivalence
  footnotes:
