base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/005.yaml
  text: But since he still had not gone back[a], he said, “Go back to Gedaliah son of Ahikam, son of Shaphan, whom the king of Babylon has appointed over the cities of Judah, and live with him among the people[c][b]; or go wherever it seems right in your eyes to go.” Then the captain of the guard gave him provisions and a gift and sent him away.
translation:
  language: hi
  text: परन्तु वह अब तक लौटा नहीं था[a], इसलिए उसने कहा, “अहीकाम के पुत्र और शापान के पोते गदल्याह के पास लौट जा, जिसे बाबेल के राजा ने यहूदा के नगरों का अधिकारी नियुक्त किया है। उसके साथ लोगों के बीच रह; या जहाँ जाना तुझे अपनी दृष्टि में ठीक लगे, वहाँ चला जा।” तब अंगरक्षक-दल के प्रधान ने उसे भोजन-सामग्री[b] और एक भेंट[c] दी और उसे विदा कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'पद के आरम्भ का इब्रानी पाठ कठिन है। इसका अनुवाद यह भी हो सकता है: “जब वह अभी तक लौटा नहीं था, तब [उसने कहा], ‘गदल्याह के पास लौट जा…।’”'
    reason: alternative_reading
  - marker: b
    text: या “राशन।”
    reason: lexical_alternative
  - marker: c
    text: या “उपहार,” “भत्ता” अथवा “हिस्सा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעוֹדֶנּוּ לֹא יָשׁוּב
  choice: परन्तु जब वह अब तक नहीं लौटा था
  rationale: आरम्भिक इब्रानी वाक्यांश व्याकरण की दृष्टि से कठिन और कुछ लुप्तांशयुक्त है। यह अनुवाद लौटना अभी तक न होने का भाव देता है, पर वैकल्पिक संरचना को पाद-टिप्पणी में सुरक्षित रखता है।
- source_word: וְשֻׁבָה
  choice: लौट जा
  rationale: שוב के आज्ञार्थक रूप को स्वाभाविक और सीधी आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: אֶל גְּדַלְיָה בֶן אֲחִיקָם בֶּן שָׁפָן
  choice: अहीकाम के पुत्र और शापान के पोते गदल्याह के पास
  rationale: इब्रानी वंश-सूत्र को हिन्दी में स्वाभाविक रूप से पुत्र और पोते के संबंध द्वारा स्पष्ट किया गया है।
- source_word: אֲשֶׁר הִפְקִיד מֶלֶךְ בָּבֶל בְּעָרֵי יְהוּדָה
  choice: जिसे बाबेल के राजा ने यहूदा के नगरों पर अधिकारी ठहराया है
  rationale: हिफ़ील क्रिया הִפְקִיד यहाँ प्रशासनिक अधिकार सौंपने का अर्थ देती है; ‘नगरों पर’ अधिकार-क्षेत्र को प्रकट करता है।
- source_word: וְשֵׁב אִתּוֹ בְּתוֹךְ הָעָם
  choice: उसके साथ लोगों के बीच रह
  rationale: ישב का प्रसंगानुकूल अर्थ स्थायी या निरंतर निवास है; ‘रह’ सहज आधुनिक हिन्दी है।
- source_word: אוֹ אֶל כָּל הַיָּשָׁר בְּעֵינֶיךָ לָלֶכֶת לֵךְ
  choice: या जहाँ जाना तुझे अपनी दृष्टि में ठीक लगे, वहाँ चला जा
  rationale: ‘अपनी दृष्टि में ठीक’ मूल इब्रानी मुहावरे को बनाए रखता है और वाक्य को हिन्दी में बोधगम्य भी बनाता है।
- source_word: רַב טַבָּחִים
  choice: अंगरक्षक-दल का प्रधान
  rationale: यह नबूजरदान का राजकीय पद है। मूल पदवी में वध अथवा दण्ड देने वाले शाही रक्षकों का भाव हो सकता है; यहाँ कार्यगत पदनाम को बिना अनावश्यक कठोरता के व्यक्त किया गया है।
- source_word: אֲרֻחָה
  choice: भोजन-सामग्री
  rationale: संज्ञा यात्रा या निर्वाह के लिए दिए गए भोजन अथवा राशन को सूचित करती है।
- source_word: וּמַשְׂאֵת
  choice: एक भेंट
  rationale: शब्द का अर्थ उठाकर दी गई वस्तु, हिस्सा, अनुदान या उपहार हो सकता है; भोजन-सामग्री के साथ यहाँ ‘भेंट’ उपयुक्त है, जबकि व्यापक अर्थ-सीमा पाद-टिप्पणी में दी गई है।
- source_word: וַיְשַׁלְּחֵהוּ
  choice: उसे विदा कर दिया
  rationale: क्रिया भेज देने अथवा जाने देने दोनों का भाव रखती है; ‘विदा कर दिया’ प्रसंग में स्वाभाविक है और विधिक अर्थ नहीं थोपता।
