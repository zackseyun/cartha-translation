  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक रखी गई है। इब्रानी मुहावरे ‘अपनी दृष्टि में ठीक’ को अर्थपूर्ण रूप में बनाए रखा गया है। आरम्भिक कठिन पाठ को मुख्य अनुवाद में सहज बनाया गया है, पर उसकी वास्तविक अनिश्चितता पाद-टिप्पणी में स्पष्ट की गई है।
