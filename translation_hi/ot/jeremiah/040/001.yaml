- source_word: אַחַר שַׁלַּח אֹתוֹ ... מִן הָרָמָה
  choice: जब ... ने उसे रामा से विदा कर दिया था
  rationale: שׁלח का मूल भाव भेजना या जाने देना है। ‘विदा कर दिया’ रामा से जाने देने का अर्थ रखता है, पर ‘रिहा’ कहकर हिरासत की स्थिति को अनावश्यक रूप से निर्णीत नहीं करता।
- source_word: רַב טַבָּחִים
  choice: अंगरक्षकों के प्रधान
  rationale: यह राजकीय पद शाब्दिक रूप से वध करने वालों के प्रधान का संकेत देता है, पर बाबेली प्रशासन में राजकीय अंगरक्षक दल और दंड-कार्यों से जुड़े उच्च अधिकारी के लिए प्रयुक्त था। शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: בְּקַחְתּוֹ אֹתוֹ
  choice: उसने यिर्मयाह को ... अपने अधिकार में लिया था
  rationale: לקח का सामान्य अर्थ ‘लेना’ है; प्रसंग में अधिकारी द्वारा यिर्मयाह को पकड़ने या अभिरक्षा में लेने का भाव है। हिन्दी में सर्वनाम-संदेह दूर करने के लिए नाम दोहराया गया और ‘अपने अधिकार में लिया’ चुना गया।
- source_word: וְהוּא אָסוּר בָּאזִקִּים
  choice: वह बेड़ियों में जकड़ा हुआ
  rationale: אָסוּר और אֲזִקִּים उसकी बंधी हुई दशा बताते हैं; ‘बेड़ियों में जकड़ा’ आधुनिक और स्पष्ट हिन्दी है।
- source_word: בְּתוֹךְ כָּל גָּלוּת יְרוּשָׁלִַם וִיהוּדָה
  choice: यरूशलेम और यहूदा के उन सभी निर्वासितों के बीच
  rationale: גָּלוּת यहाँ सामूहिक रूप से निर्वासित जनसमुदाय को दर्शाता है; इसलिए ‘निर्वासितों’ चुना गया।
- source_word: הַמֻּגְלִים בָּבֶלָה
  choice: जिन्हें बंदी बनाकर बाबेल ले जाया जा रहा था
  rationale: होफाल कृदंत निर्वासन हेतु ले जाए जाने की जारी निष्क्रिय प्रक्रिया व्यक्त करता है। ‘बंदी बनाकर ... ले जाया जा रहा था’ गंतव्य और बाध्य निर्वासन दोनों स्पष्ट करता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है। हिन्दी पाठकों के बीच पहचाने जाने वाले लिप्यंतरण ‘यहोवा’ से नाम का स्वरूप सुरक्षित रहता है; इसे केवल ‘प्रभु’ जैसी उपाधि में नहीं बदला गया।
- issue: שַׁלַּח का अर्थ—भेजना या रिहा करना
  choice: विदा कर दिया
  alternative: रिहा कर दिया; जाने दिया
  rationale: यह पद आगे की कथा से जुड़ता है, पर अकेले इस क्रिया से औपचारिक रिहाई की पूरी प्रक्रिया निश्चित नहीं होती। ‘विदा कर दिया’ मूल की व्यापकता बनाए रखता है।
translation_notes:
  register: 'आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट। लम्बे इब्रानी वाक्य को दो हिन्दी वाक्यों में बाँटा गया है, जबकि अंत का द्विबिंदु अगले पद से इसके कथात्मक संबंध को बनाए रखता है। नामरूप: यिर्मयाह, नबूजरदान, रामा, यरूशलेम, यहूदा, बाबेल।'
