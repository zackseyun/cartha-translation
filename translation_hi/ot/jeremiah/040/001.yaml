base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/001.yaml
  text: 'The word that came to Jeremiah from Yahweh after Nebuzaradan[a], the captain of the guard, had sent him away from Ramah, when he had taken him while he was bound in chains among all the exiles of Jerusalem and Judah who were being exiled to Babylon:'
translation:
  language: hi
  text: 'यिर्मयाह के पास यहोवा की ओर से यह वचन आया, जब अंगरक्षकों के प्रधान नबूजरदान[a] ने उसे रामा से विदा कर दिया था—उसके यिर्मयाह को लेने के बाद, जब वह बेड़ियों में बँधा हुआ यरूशलेम और यहूदा के उन सभी निर्वासितों के बीच था जिन्हें बाबेल को निर्वासन के लिए ले जाया जा रहा था:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पदवी का अनुवाद ‘जल्लादों का प्रधान’ भी हो सकता है। इब्रानी में इसका शाब्दिक संबंध वध करने वालों के प्रधान से है; संभवतः यह राजकीय अंगरक्षक दल का ऐसा उच्च अधिकारी था जिसके दायित्वों में मृत्युदंड देना भी शामिल था।
    reason: רַב טַבָּחִים की शाब्दिक और प्रशासनिक अर्थ-सीमा स्पष्ट करना।
