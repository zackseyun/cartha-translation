translation_notes:
  register: भाषा आधुनिक मानक हिंदी की, सम्मानसूचक संवाद-शैली में और सामान्य पाठक के लिए सहज रखी गई है। नामों का लिप्यंतरण ‘योहानान, कारेह, गदल्याह, मिस्पा, नतन्याह, इश्माएल’ किया गया है। मूल की कारण-परिणाम संरचना को दो स्वाभाविक हिंदी वाक्यों में व्यक्त किया गया है, बिना किसी सांप्रदायिक व्याख्या को जोड़े।
