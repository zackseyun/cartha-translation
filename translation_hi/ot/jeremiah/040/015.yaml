source:
  edition: WLC
  text: וְ/יוֹחָנָ֣ן בֶּן קָרֵ֡חַ אָמַ֣ר אֶל גְּדַלְיָהוּ֩ בַ/סֵּ֨תֶר בַּ/מִּצְפָּ֜ה לֵ/אמֹ֗ר אֵ֤לְכָה נָּא֙ וְ/אַכֶּה֙ אֶת יִשְׁמָעֵ֣אל בֶּן נְתַנְיָ֔ה וְ/אִ֖ישׁ לֹ֣א יֵדָ֑ע לָ֧/מָּה יַכֶּ֣/כָּה נֶּ֗פֶשׁ וְ/נָפֹ֨צוּ֙ כָּל יְהוּדָ֔ה הַ/נִּקְבָּצִ֣ים אֵלֶ֔י/ךָ וְ/אָבְדָ֖ה שְׁאֵרִ֥ית יְהוּדָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/015.yaml
  text: Then Johanan son of Kareah said privately to Gedaliah at Mizpah[a], saying, “Please let me go and strike down Ishmael son of Nethaniah, and no one will know. Why should he take your life, so that all the Judahites who are gathered to you would be scattered[c][b], and the remnant of Judah would perish?”
translation:
  language: hi
  text: तब कारेह के पुत्र योहानान ने मिस्पा में गदल्याह से अकेले में कहा, “कृपया मुझे जाने दीजिए; मैं नतन्याह के पुत्र इश्माएल को मार डालूँ, और किसी को इसका पता नहीं चलेगा। वह आपका प्राण क्यों ले, जिससे आपके पास इकट्ठा हुए यहूदा के सभी लोग तितर-बितर हो जाएँ और यहूदा के बचे हुए लोग नष्ट हो जाएँ?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַסֵּתֶר
  choice: अकेले में
  rationale: शब्द का मूल भाव गुप्त या छिपे हुए ढंग से है। इस संवाद के संदर्भ में ‘अकेले में’ स्वाभाविक हिंदी में बताता है कि योहानान ने यह बात निजी तौर पर कही।
- source_word: בַמִּצְפָּה
  choice: मिस्पा में
  rationale: स्थान-नाम का प्रचलित हिंदी लिप्यंतरण रखा गया है; ‘में’ वार्तालाप के स्थान को सहज रूप से व्यक्त करता है।
- source_word: אֵלְכָה נָּא
  choice: कृपया मुझे जाने दीजिए
  rationale: सहप्रेरणार्थक रूप और נָא मिलकर विनम्र किंतु आग्रहपूर्ण प्रस्ताव व्यक्त करते हैं।
- source_word: וְאַכֶּה
  choice: कि मैं ... मार डालूँ
  rationale: נכה का मूल अर्थ प्रहार करना है, पर यहाँ प्रस्तावित गुप्त कार्रवाई का स्पष्ट उद्देश्य हत्या है; ‘मार डालूँ’ वर्तमान प्रसंग में स्वाभाविक और सटीक है।
- source_word: וְאִישׁ לֹא יֵדָע
  choice: और किसी को इसका पता नहीं चलेगा
  rationale: אִישׁ यहाँ सामान्य अर्थ में ‘कोई व्यक्ति’ है। ‘किसी को ... पता नहीं चलेगा’ आधुनिक हिंदी में सहज है और आशय ठीक रखता है।
- source_word: לָמָּה יַכֶּכָּה נֶּפֶשׁ
  choice: वह क्यों आपका प्राण ले?
  rationale: इब्रानी वाक्यांश संक्षिप्त और मुहावरेदार है; נֶפֶשׁ यहाँ जीवन या प्राण को सूचित करता है। यह अनुवाद हत्या के खतरे को स्पष्ट करते हुए मूल अभिव्यक्ति के निकट रहता है।
- source_word: וְנָפֹצוּ
  choice: तितर-बितर हो जाएँगे
  rationale: क्रिया लोगों के बिखर जाने को दर्शाती है। हिंदी में ‘तितर-बितर’ सामुदायिक विखराव के लिए स्वाभाविक है।
- source_word: כָּל יְהוּדָה
  choice: यहूदा के सभी लोग
  rationale: यहाँ यहूदा भूभाग से अधिक उसके लोगों को सूचित करता है। यह रूप जातीय-राजनीतिक समुदाय का अर्थ स्पष्ट करता है और ‘यहूदी’ से उत्पन्न संभावित कालगत भ्रम से बचता है।
- source_word: הַנִּקְבָּצִים אֵלֶיךָ
  choice: आपके पास इकट्ठा हुए
  rationale: कृदंत वर्तमान में गदल्याह के पास एकत्र समुदाय को और אֵלֶיךָ उसकी ओर की दिशा को दर्शाता है।
- source_word: שְׁאֵרִית יְהוּדָה
  choice: यहूदा के बचे हुए लोग
  rationale: שְׁאֵרִית विपत्ति के बाद बचे समुदाय को दर्शाता है। साधारण पाठक के लिए यह ‘शेष’ की तुलना में अधिक स्पष्ट और स्वाभाविक है।
- source_word: וְאָבְדָה
  choice: नष्ट हो जाएँगे
  rationale: אבד यहाँ बचे हुए समुदाय के विनाश या मिट जाने का भाव देता है; बहुवचन हिंदी में ‘लोग’ के अनुरूप है।
