source:
  edition: WLC
  text: וַ/יָּבֹ֥אוּ אֶל גְּדַלְיָ֖ה הַ/מִּצְפָּ֑תָ/ה וְ/יִשְׁמָעֵ֣אל בֶּן נְתַנְיָ֡הוּ וְ/יוֹחָנָ֣ן וְ/יוֹנָתָ֣ן בְּנֵֽי קָ֠רֵחַ וּ/שְׂרָיָ֨ה בֶן תַּנְחֻ֜מֶת וּ/בְנֵ֣י עופי הַ/נְּטֹפָתִ֗י וִֽ/יזַנְיָ֨הוּ֙ בֶּן הַ/מַּ֣עֲכָתִ֔י הֵ֖מָּה וְ/אַנְשֵׁי/הֶֽם־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/008.yaml
  text: Then Ishmael son of Nethaniah[a], and Johanan and Jonathan the sons of Kareah, and Seraiah son of Tanhumeth, and the sons of Ephai the Netophathite[b], and Jezaniah son of the Maacathite—they and their men—came to Gedaliah at Mizpah.
translation:
  language: hi
  text: तब नतन्याह का पुत्र इश्माएल, कारेह के पुत्र योहानान और योनातान, तन्हूमेत का पुत्र सरायाह, नतोपावासी एपै[a] के पुत्र, और माकाती के पुत्र यिज़न्याहू[b]—ये सभी अपने आदमियों समेत—मिस्पा में गदल्याह के पास आए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस नाम का लिप्यंतरण ‘ओफी’ भी किया जा सकता है; इब्रानी नाम का रूप पाठगत और लिप्यंतरण की दृष्टि से अनिश्चित है।
    reason: lexical_alternative
  - marker: b
    text: इस नाम को ‘यिज़न्याह’ भी लिखा जा सकता है; कुछ विद्वान इसे अन्य स्थानों पर मिलने वाले ‘याजन्याह’ नाम के रूपों से संबंधित मानते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: आए
  rationale: בוא का वय्यिक्तोल रूप कथा को साधारण भूतकालीन घटना के रूप में आगे बढ़ाता है; दृष्टिकोण गदल्याह की ओर है, इसलिए ‘आए’ स्वाभाविक है।
- source_word: הַמִּצְפָּתָה
  choice: मिस्पा में
  rationale: 'दिशासूचक הָ स्थान की ओर गति बताता है, पर वाक्य में यह गदल्याह के मिस्पा में होने से स्वाभाविक रूप से जुड़ता है: ‘मिस्पा में गदल्याह के पास आए।’'
- source_word: בְּנֵי קָרֵחַ
  choice: कारेह के पुत्र
  rationale: बहुवचन संबंधसूचक पद पहले आए दोनों नामों—योहानान और योनातान—पर लागू होता है।
- source_word: בְנֵי עופי הַנְּטֹפָתִי
  choice: नतोपावासी एपै के पुत्र
  rationale: הַנְּטֹפָתִי भौगोलिक पहचान है और व्याकरणतः एकवचन एपै से जुड़ी है; इसलिए ‘नतोपावासी एपै’ रखा गया है। नाम עופי का लिप्यंतरण पाठगत/प्रतिनिधिक रूप से अनिश्चित है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וִיזַנְיָהוּ
  choice: यिज़न्याहू
  rationale: मसोरेटिक पाठ के व्यंजन और प्रत्यय को निकटता से दर्शाने वाला देवनागरी लिप्यंतरण चुना गया है; प्रचलित वैकल्पिक रूप पादटिप्पणी में दिया गया है।
- source_word: בֶּן הַמַּעֲכָתִי
  choice: माकाती के पुत्र
  rationale: मूल में पिता का निजी नाम नहीं, बल्कि ‘माकाती’ भौगोलिक/जातीय विशेषण है। असामान्य किंतु स्पष्ट संबंध को बिना अनुमान से पूरा किए सुरक्षित रखा गया है।
- source_word: הֵמָּה וְאַנְשֵׁיהֶם
  choice: ये सभी अपने आदमियों समेत
  rationale: जोरदार सर्वनाम הֵמָּה और साथ आए उनके लोगों को स्वाभाविक हिन्दी में व्यक्त करता है; डैश मूल की सूची के बाद आए बलाघात को बनाए रखते हैं।
