translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज कथात्मक शैली अपनाई गई है। वंशसूचक संबंधों को स्पष्ट रखने के लिए ‘का/के पुत्र’ संरचना रखी गई है। व्यक्तिनामों और स्थाननामों को इब्रानी रूपों के निकट देवनागरी में लिखा गया है; जहाँ वास्तविक पाठगत या लिप्यंतरणगत अनिश्चितता है, उसे पादटिप्पणी में रखा गया है।
