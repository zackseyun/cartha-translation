base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/002.yaml
  text: Then the captain of the guard took Jeremiah and said to him[b][a], “Yahweh your God spoke this disaster against this place.”
translation:
  language: hi
  text: तब अंगरक्षकों के प्रधान[b] ने यिर्मयाह को लेकर उससे कहा, “तुम्हारे परमेश्वर यहोवा ने इस स्थान के विरुद्ध इस विपत्ति[a] की घोषणा की थी।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस अनिष्ट”; इब्रानी शब्द का अर्थ प्रसंग के अनुसार बुराई, हानि या विपत्ति हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शब्दशः “वध करने वालों के प्रधान”; यह पदवी सामान्यतः राजा के अंगरक्षकों के प्रधान अधिकारी के लिए प्रयुक्त होती थी।
    reason: cultural_note
lexical_decisions:
- source_word: רַב טַבָּחִים
  choice: अंगरक्षकों के प्रधान
  rationale: यह बाबिलोनी राजकीय/सैनिक पदवी है। शब्दशः अर्थ वध करने वालों या जल्लादों के प्रधान से जुड़ा है, पर प्रसंग में यह राजा के अंगरक्षक-दल के प्रधान अधिकारी को दर्शाता है।
- source_word: וַיִּקַּח
  choice: अपने पास बुलाया
  rationale: לקח का मूल अर्थ ‘लेना’ है। यहाँ अधिकारी यिर्मयाह को बातचीत के लिए अपने सामने लाता है; हिन्दी में ‘अपने पास बुलाया’ स्वाभाविक है और अनावश्यक रूप से बलपूर्वक पकड़ने का भाव नहीं जोड़ता।
- source_word: לְיִרְמְיָהוּ
  choice: यिर्मयाह
  rationale: व्यक्तिगत नाम का प्रचलित मानक हिन्दी लिप्यंतरण।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी परमेश्वर के व्यक्तिगत नाम को हिन्दी बाइबल परंपरा में व्यापक रूप से पहचाने जाने वाले लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, न कि किसी उपाधि से।
- source_word: אֱלֹהֶיךָ
  choice: तुम्हारे परमेश्वर
  rationale: द्वितीय पुरुष एकवचन प्रत्यय यिर्मयाह को सीधे संबोधित करता है; ‘तुम्हारे परमेश्वर’ इस व्यक्तिगत संबोधन को बनाए रखता है।
- source_word: דִּבֶּר
  choice: घोषणा की थी
  rationale: דבר का अर्थ ‘बोलना’ है, पर न्याय-वचन के इस प्रसंग में ‘घोषणा की थी’ अधिक स्वाभाविक हिन्दी है और पूर्व में कहे गए वचन का भाव स्पष्ट करती है।
- source_word: הָרָעָה הַזֹּאת
  choice: इस विपत्ति
  rationale: רָעָה नैतिक बुराई, हानि या विपत्ति का अर्थ दे सकता है। यहाँ यरूशलेम पर घोषित दंडात्मक संकट अभिप्रेत है; ‘विपत्ति’ प्रसंगानुकूल है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: इस स्थान के विरुद्ध
  rationale: न्याय-वचन के साथ אֶל उसकी दिशा बताता है। ‘के विरुद्ध’ घोषित न्याय का भाव स्वाभाविक रूप से व्यक्त करता है; प्रसंग में यह स्थान यरूशलेम है।
theological_decisions:
- issue: यहोवा के न्याय से संबंधित רָעָה का अर्थ
  choice: इस विपत्ति
  alternative: इस अनिष्ट / इस बुराई
  rationale: प्रसंग में शब्द नगर पर आने वाले विनाशकारी न्याय को दर्शाता है, नैतिक दुष्टता को नहीं। ‘विपत्ति’ इसी प्रासंगिक अर्थ को व्यक्त करती है, और शब्द की व्यापक अर्थ-सीमा पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली। ‘अपने पास बुलाया’ प्रसंगानुकूल मुहावरेदार अभिव्यक्ति है; ‘विपत्ति’ न्याय की गंभीरता रखते हुए नैतिक बुराई का अनपेक्षित संकेत टालती है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
