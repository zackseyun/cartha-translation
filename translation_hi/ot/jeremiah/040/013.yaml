base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/013.yaml
  text: And Johanan son of Kareah[a], and all the commanders of the forces who were in the open country, came to Gedaliah at Mizpah.
translation:
  language: hi
  text: और कारेह का पुत्र योहानान और सैन्य दलों के वे सभी सेनापति जो खुले देहात में थे, मिस्पा में गदल्याह के पास आए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जो मैदान में थे।” हिब्रू अभिव्यक्ति का अधिक शाब्दिक अर्थ खेत या मैदान हो सकता है, और व्यापक अर्थ खुला देहात भी।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יֽוֹחָנָן
  choice: तब ... योहानान
  rationale: वाव को कथा के प्रवाह में स्वाभाविक आधुनिक हिन्दी के लिए ‘तब’ से व्यक्त किया गया है; इससे केवल क्रम सूचित होता है, कोई अधिक विशिष्ट संबंध नहीं थोपा जाता।
- source_word: בֶּן קָרֵחַ
  choice: कारेह का पुत्र
  rationale: हिब्रू वंशसूचक रचना का स्पष्ट और स्वाभाविक हिन्दी रूप।
- source_word: וְ/כָל שָׂרֵי הַ/חֲיָלִים
  choice: और ... सेना के सभी सेनापति
  rationale: שָׂרֵי सैन्य अगुओं/सेनापतियों को और חֲיָלִים इस प्रसंग में सैन्य बल को दर्शाता है; यह चयन आधुनिक, सुबोध और प्रसंगानुकूल है।
- source_word: אֲשֶׁר בַּ/שָּׂדֶה
  choice: खुले देहात में मौजूद
  rationale: שָּׂדֶה का मूल अर्थ खेत/मैदान है, पर यहाँ नगर से बाहर के खुले ग्रामीण क्षेत्र का व्यापक भौगोलिक भाव संभव है। मुख्य पाठ में स्वाभाविक व्यापक अर्थ रखा गया और अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: בָּ֥אוּ אֶל גְּדַלְיָהוּ
  choice: गदल्याह के पास आए
  rationale: בוא को गंतव्य की ओर आने के अर्थ में और אֶל को व्यक्ति के पास पहुँचने के अर्थ में स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: הַ/מִּצְפָּתָ/ה
  choice: मिस्पा में
  rationale: स्थाननाम के साथ दिशासूचक ה गति को मिस्पा की ओर बताता है; हिन्दी में ‘मिस्पा में गदल्याह के पास आए’ गंतव्य और गदल्याह के वहाँ स्थित होने—दोनों को बिना असहज पुनरुक्ति के व्यक्त करता है।
