base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/010.yaml
  text: As for me[a], behold, I am staying at Mizpah to stand before the Chaldeans who come to us. But you, gather wine, summer fruit, and oil, put them in your containers[b], and dwell in your cities that you have taken.
translation:
  language: hi
  text: “जहाँ तक मेरी बात है, देखो, मैं मिस्पा में रहूँगा, ताकि उन कसदियों[a] के सामने खड़ा रहूँ[b] जो हमारे पास आएँगे। पर तुम दाखमधु, गर्मियों के फल और तेल इकट्ठा करो, उन्हें अपने पात्रों में रखो, और उन नगरों में रहो जिन पर तुमने अधिकार कर लिया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् बाबुल के लोग।
    reason: lexical_alternative
  - marker: b
    text: “के सामने खड़ा रहूँ” का अर्थ उनके सामने आधिकारिक रूप से उपस्थित रहना या उनका प्रतिनिधित्व करना भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: देखो, मैं
  rationale: הִנְנִי की संकेतात्मक और ध्यान आकर्षित करने वाली शक्ति को स्वाभाविक, गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: יֹשֵׁב
  choice: रहूँगा
  rationale: यहाँ ישב का अर्थ बैठना नहीं, बल्कि मिस्पा में बने रहना या निवास करना है; प्रसंग में अपेक्षित प्रशासनिक भूमिका के कारण भविष्यकाल हिन्दी में स्वाभाविक है।
- source_word: לַעֲמֹד לִפְנֵי
  choice: के सामने खड़ा रहूँ
  rationale: इब्रानी मुहावरे का दृश्य रूप सुरक्षित रहता है, जबकि उसकी सम्भावित आधिकारिक सेवा या प्रतिनिधित्व की छाया को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: הַכַּשְׂדִּים
  choice: कसदियों
  rationale: मूल जातिनाम का सीधा लिप्यंतरण है; इस प्रसंग में बाबुलियों के लिए प्रयुक्त होने की जानकारी पादटिप्पणी में दी गई है।
- source_word: יָבֹאוּ אֵלֵינוּ
  choice: जो हमारे पास आएँगे
  rationale: अपूर्ण क्रिया का यहाँ अपेक्षित भाव स्वाभाविक भविष्यकाल से व्यक्त होता है।
- source_word: אִסְפוּ
  choice: इकट्ठा करो
  rationale: सूचीबद्ध उपज को एकत्र करने की व्यापक आज्ञा को बिना कृषि-प्रक्रिया अधिक निश्चित किए व्यक्त करता है।
- source_word: קַיִץ
  choice: गर्मियों के फल
  rationale: शब्द की ऋतु-संबंधी विशेषता बनाए रखता है और उसे केवल अंजीरों तक सीमित नहीं करता।
- source_word: שִׂימוּ בִּכְלֵיכֶם
  choice: उन्हें अपने पात्रों में रखो
  rationale: כְּלִי के व्यापक अर्थ को सुरक्षित रखता है और बर्तन की किसी खास सामग्री या आकृति का अनुमान नहीं लगाता।
- source_word: וּשְׁבוּ
  choice: रहो
  rationale: यहाँ क्रिया का अर्थ नगरों में निवास करना है, न कि शाब्दिक रूप से बैठना।
- source_word: תְּפַשְׂתֶּם
  choice: जिन पर तुमने अधिकार कर लिया है
  rationale: नगरों को अपने नियंत्रण में लेने का भाव व्यक्त करता है, बिना अनिवार्य रूप से हिंसक विजय का अर्थ थोपे।
theological_decisions:
- issue: कसदियों के सामने खड़े रहने की भूमिका
  choice: मुख्य पाठ में शाब्दिक मुहावरा “के सामने खड़ा रहूँ” रखा गया है।
  alternative: “उनके सामने तुम्हारा प्रतिनिधित्व करूँ” या “उनकी सेवा में उपस्थित रहूँ”।
  rationale: मूल वाक्यांश आधिकारिक उपस्थिति, सेवा या प्रतिनिधित्व का संकेत दे सकता है, पर किसी एक अर्थ को निश्चित नहीं करता; इसलिए अस्पष्टता मुख्य पाठ और पादटिप्पणी के माध्यम से सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली अपनाई गई है। “दाखमधु,” “पात्रों” और “नगरों” जैसे शब्द बाइबिलीय प्रसंग के अनुकूल हैं, जबकि वाक्य-संरचना सामान्य पाठक के लिए स्पष्ट रखी गई है। अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्न अपने विषयों से उलटे जुड़े दिखाई देते हैं; हिन्दी मुख्य पाठ में [a] को “कसदियों” और [b] को “सामने खड़ा रहूँ” के साथ सही स्थान पर रखा गया है।
