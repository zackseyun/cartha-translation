id: JER.40.3
reference: Jeremiah 40:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יָּבֵ֥א וַ/יַּ֛עַשׂ יְהוָ֖ה כַּ/אֲשֶׁ֣ר דִּבֵּ֑ר כִּֽי חֲטָאתֶ֤ם לַֽ/יהוָה֙ וְ/לֹֽא שְׁמַעְתֶּ֣ם בְּ/קוֹל֔/וֹ וְ/הָיָ֥ה לָ/כֶ֖ם דבר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/003.yaml
  text: And Yahweh has brought it about and has done just as he said[a], because you sinned against Yahweh and did not listen to his voice[b]; therefore this thing has happened to you.
translation:
  language: hi
  text: और याहवे ने इसे घटित किया और जैसा उसने कहा था, वैसा ही किया, क्योंकि तुमने याहवे के विरुद्ध पाप किया और उसकी आवाज़ नहीं सुनी[a]; इसलिए यह बात[b] तुम्हारे साथ हुई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी आज्ञा नहीं मानी।” इब्रानी मुहावरा “उसकी आवाज़ सुनना” प्रायः आज्ञा मानने का भाव भी रखता है।
    reason: lexical_alternative
  - marker: b
    text: या, “यह विपत्ति।” यहाँ इब्रानी “यह बात” संदर्भ में अभी वर्णित विपत्ति को अधिक विशेष रूप से सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  choice: इसे घटित किया
  rationale: בוא का हिफ़ील रूप यहाँ पहले बताई गई विपत्ति या घटना को ले आने अथवा घटित कराने का भाव रखता है। हिन्दी में संदर्भ से निहित कर्म के लिए ‘इसे’ और कारक अर्थ के लिए ‘घटित किया’ स्वाभाविक हैं।
- source_word: וַיַּעַשׂ
  choice: किया
  rationale: עשה का सामान्य और सीधा अर्थ ‘करना’ है। ‘जैसा उसने कहा था, वैसा ही किया’ घोषित न्याय के पूरा होने का भाव बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: כַּאֲשֶׁר דִּבֵּר
  choice: जैसा उसने कहा था
  rationale: यह अनुवाद याहवे के पहले कहे हुए वचन और उसके पूरा होने के संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: חֲטָאתֶם לַיהוָה
  choice: तुमने याहवे के विरुद्ध पाप किया
  rationale: לַיהוָה यहाँ उस व्यक्ति को दर्शाता है जिसके विरुद्ध अपराध हुआ; हिन्दी में ‘के विरुद्ध पाप किया’ इसका स्पष्ट और स्वाभाविक रूप है।
- source_word: וְלֹא שְׁמַעְתֶּם בְּקוֹלוֹ
  choice: और उसकी आवाज़ नहीं सुनी
  rationale: שׁמע בקול में आज्ञा मानने का भाव निहित है, पर मुख्य पाठ में ‘आवाज़ नहीं सुनी’ रखकर इब्रानी बिंब और उसकी अर्थगत व्यापकता सुरक्षित रखी गई है।
- source_word: וְהָיָה לָכֶם דבר הַזֶּה
  choice: इसलिए यह बात तुम्हारे साथ हुई
  rationale: परिणामसूचक संबंध को ‘इसलिए’ से स्पष्ट किया गया है, जबकि דבר הזה के व्यापक ‘यह बात/यह घटना’ भाव को किसी अधिक विशिष्ट व्याख्या तक सीमित नहीं किया गया।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ व्यक्तिगत दिव्य नाम का प्रयोग करता है; ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: שׁמע בקולו में सुनने और आज्ञा मानने का संबंध
  choice: उसकी आवाज़ नहीं सुनी
  alternative: उसकी आज्ञा नहीं मानी
  rationale: यह इब्रानी मुहावरा आज्ञापालन का अर्थ दे सकता है, लेकिन शाब्दिक श्रवण-बिंब को बनाए रखने से मूल की अर्थगत परत और तनाव सुरक्षित रहते हैं; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- issue: דבר הזה का विपत्ति के रूप में विशिष्टीकरण
  choice: यह बात
  alternative: यह विपत्ति
  rationale: संदर्भ न्याय और विनाश की ओर संकेत करता है, पर דבר स्वयं व्यापक शब्द है। मुख्य पाठ उसकी व्यापकता रखता है और संदर्भगत विशिष्ट अर्थ पादटिप्पणी में बताता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली अपनाई गई है। वाक्य की कारण-परिणाम संरचना स्पष्ट रखी गई है, जबकि ‘आवाज़ सुनना’ और ‘यह बात’ जैसे मूल के व्यापक पदों को पादटिप्पणियों सहित सुरक्षित रखा गया है।
