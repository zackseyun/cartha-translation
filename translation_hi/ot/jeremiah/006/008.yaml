source:
  edition: WLC
  text: הִוָּסְרִי֙ יְר֣וּשָׁלִַ֔ם פֶּן תֵּקַ֥ע נַפְשִׁ֖/י מִמֵּ֑/ךְ פֶּן אֲשִׂימֵ֣/ךְ שְׁמָמָ֔ה אֶ֖רֶץ ל֥וֹא נוֹשָֽׁבָה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/008.yaml
  text: Be warned[a], O Jerusalem, lest my soul turn away from you, lest I make you a desolation[b], a land not inhabited.
translation:
  language: hi
  text: हे यरूशलेम, सुधार स्वीकार कर[a], कहीं ऐसा न हो कि मेरा प्राण तुझसे विमुख हो जाए[b], कहीं ऐसा न हो कि मैं तुझे उजाड़, एक निर्जन भूमि, बना दूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शिक्षा ग्रहण कर” अथवा “ताड़ना स्वीकार कर।” इब्रानी क्रिया का अर्थ केवल चेतावनी पाना नहीं, बल्कि अनुशासन या सुधार ग्रहण करना भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “मेरा प्राण तुझसे अलग हो जाए”; अधिक शाब्दिक रूप से, “तुझसे उखड़ जाए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִוָּסְרִי
  choice: सुधार स्वीकार कर
  rationale: यह יסר का निफ़अल आज्ञार्थक स्त्रीलिंग एकवचन रूप है और यरूशलेम को संबोधित करता है। इसमें केवल चेतावनी सुनने के बजाय अनुशासन या सुधार ग्रहण करने का भाव है; इसलिए यह अनुवाद सुधारात्मक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְרוּשָׁלִַם
  choice: हे यरूशलेम
  rationale: प्रत्यक्ष संबोधन को स्पष्ट करने के लिए मानक हिन्दी नाम के साथ संबोधनसूचक ‘हे’ रखा गया है।
- source_word: פֶּן
  choice: कहीं ऐसा न हो कि
  rationale: यह चेतावनी में आशंकित नकारात्मक परिणाम प्रस्तुत करता है। यह हिन्दी में स्वाभाविक और गंभीर भविष्यवाणीपरक अभिव्यक्ति है।
- source_word: תֵּקַע
  choice: विमुख हो जाए
  rationale: इस दुर्लभ क्रिया में अलग हो जाने, उखड़ जाने या विरक्त होने का भाव है। ‘विमुख हो जाए’ यरूशलेम से संबंध-विच्छेद का भाव स्पष्ट करता है, जबकि वैकल्पिक शाब्दिक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: נַפְשִׁי
  choice: मेरा प्राण
  rationale: נפש के स्पष्ट रूपक को बनाए रखते हुए यह परमेश्वर के भीतरी व्यक्तित्व और गहरे संबंधात्मक विराग को व्यक्त करता है; इसे केवल ‘मैं’ बनाकर समतल नहीं किया गया।
- source_word: מִמֵּךְ
  choice: तुझसे
  rationale: स्त्रीलिंग एकवचन प्रत्यय यरूशलेम की ओर संकेत करता है; प्रत्यक्ष संबोधन की निकटता बनाए रखने के लिए एकवचन ‘तू’ रूप रखा गया है।
- source_word: אֲשִׂימֵךְ
  choice: मैं तुझे ... बना दूँ
  rationale: שׂים यहाँ यरूशलेम को उजाड़ दशा में कर देने का अर्थ देता है। ‘बना दूँ’ परिणामकारी न्याय को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שְׁמָמָה
  choice: उजाड़
  rationale: यह संज्ञा विनाश और निर्जनता की दशा बताती है। हिन्दी में ‘तुझे उजाड़ बना दूँ’ निकट और सहज है।
- source_word: אֶרֶץ לֹא נוֹשָׁבָה
  choice: एक निर्जन देश
  rationale: यह पूर्ववर्ती ‘उजाड़’ की व्याख्या और तीव्रता बढ़ाने वाला समानाधिकरण वाक्यांश है। ‘निर्जन देश’ का अर्थ है ऐसा देश जिसमें लोग न बसते हों।
theological_decisions:
- issue: परमेश्वर के נַפְשִׁי का मानवीय-भावात्मक चित्रण
  choice: मेरा प्राण तुझसे विमुख हो जाए
  alternative: मैं तुझसे विमुख हो जाऊँ
  rationale: मूल पाठ स्पष्ट रूप से ‘मेरा प्राण’ कहता है। इसे बनाए रखने से परमेश्वर के व्यक्तिगत विराग और संबंध-विच्छेद की साहित्यिक तथा धर्मवैचारिक तीव्रता सुरक्षित रहती है।
- issue: תֵּקַע की संबंधात्मक और भौतिक छवियों के बीच अस्पष्टता
  choice: विमुख हो जाए
  alternative: तुझसे अलग हो जाए / तुझसे उखड़ जाए
  rationale: संदर्भ संबंधात्मक अलगाव को इंगित करता है, पर क्रिया में बलपूर्वक अलग या उखड़ जाने की छाया भी संभव है। मुख्य पाठ में स्वाभाविक संबंधात्मक अर्थ रखा गया और वैकल्पिक छवि पादटिप्पणी में दी गई।
translation_notes:
  register: भाषा आधुनिक, गरिमामय और भविष्यवाणीपरक है। यरूशलेम के प्रत्यक्ष संबोधन में एकवचन ‘तू’ रूप मूल के स्त्रीलिंग एकवचन को दर्शाता है। दीर्घ वाक्य की चेतावनी-लय बनाए रखी गई है और समानाधिकरण को डैश से स्पष्ट किया गया है।
