  terminology: ‘यरूशलेम,’ ‘मेरा प्राण,’ and ‘विमुख हो जाए’ appropriately retain the elevated prophetic register and the Hebrew anthropopathic imagery. ‘सुधार स्वीकार कर’ is a defensible idiomatic rendering of the corrective imperative; its footnote correctly supplies more explicit disciplinary alternatives.
  issues:
  - severity: low
    issue: ‘देश’ can imply a political nation-state and the dash-bound apposition is awkward.
    rationale: אֶרֶץ denotes land/territory here, intensifying the image of a place left without inhabitants. ‘भूमि’ more directly conveys this sense and yields smoother Hindi syntax.
