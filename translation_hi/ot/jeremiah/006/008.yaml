  source_fidelity: 'The draft accurately represents the Hebrew imperatives and warnings: Jerusalem is addressed as feminine singular; the first warning preserves the relational withdrawal expressed by נפשי ... ממך; and the second retains the result of desolation and non-inhabitation. A minor wording adjustment better reflects the final appositional phrase as ‘land’ rather than the modern political sense often suggested by ‘देश.’'
