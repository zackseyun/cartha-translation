source:
  edition: WLC
  text: וַ/הֲקִמֹתִ֤י עֲלֵי/כֶם֙ צֹפִ֔ים הַקְשִׁ֖יבוּ לְ/ק֣וֹל שׁוֹפָ֑ר וַ/יֹּאמְר֖וּ לֹ֥א נַקְשִֽׁיב׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/017.yaml
  text: 'I set watchmen over you: ‘Listen to the sound of the trumpet!’ But they said[b][a], ‘We will not listen.’'
translation:
  language: hi
  text: 'मैंने तुम्हारे ऊपर पहरेदार तैनात किए: “नरसिंगे[a] की ध्वनि ध्यान से सुनो!” लेकिन उन्होंने कहा, “हम नहीं सुनेंगे।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी शोफ़ार: चेतावनी या बुलावे के लिए बजाया जाने वाला सींग-वाद्य; परंपरागत रूप से ‘तुरही’।'
    reason: cultural_note
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: मैंने ... ठहराए
  rationale: קום के हिफ़िल रूप में यहाँ किसी को एक कार्यस्थल या पद पर खड़ा करने/नियुक्त करने का भाव है। ‘ठहराए’ पहरेदारों को लोगों के ऊपर तैनात करने की ठोस छवि और नियुक्ति—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עֲלֵיכֶם
  choice: तुम्हारे ऊपर
  rationale: עַל यहाँ लोगों के संबंध में पहरेदारों की निगरानीकारी स्थिति बताता है। ‘ऊपर’ मूल स्थानिक रूपक को बनाए रखता है और अनावश्यक विरोध का अर्थ नहीं जोड़ता।
- source_word: צֹפִים
  choice: पहरेदार
  rationale: צפה से बना यह कृदन्त निगरानी करने और चेतावनी देने वालों को दर्शाता है। ‘पहरेदार’ आधुनिक हिन्दी में स्पष्ट है और उनकी पहचान को केवल भविष्यद्वक्ताओं या सैनिक संतरी तक सीमित नहीं करता।
- source_word: הַקְשִׁיבוּ
  choice: ध्यान दो
  rationale: קשב केवल ध्वनि सुनने के बजाय ध्यानपूर्वक सुनने और चेतावनी मानने का आग्रह करता है। ‘ध्यान दो’ इस सक्रिय अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְקוֹל
  choice: की आवाज़ पर
  rationale: קוֹל का अर्थ यहाँ नरसिंगे से निकलने वाली ध्वनि है। ‘आवाज़ पर ध्यान दो’ हिन्दी का स्वाभाविक प्रयोग है और ‘धमाका’ जैसे अधिक संकीर्ण अर्थ से बचता है।
- source_word: שׁוֹפָר
  choice: नरसिंगा
  rationale: שׁוֹפָר चेतावनी या बुलावे के लिए बजाया जाने वाला सींग-वाद्य है। ‘नरसिंगा’ हिन्दी बाइबलीय और सांस्कृतिक संदर्भ में सींग से बने ऐसे चेतावनी-वाद्य को ‘तुरही’ की अपेक्षा अधिक विशिष्ट रूप से दर्शाता है।
- source_word: וַיֹּאמְרוּ
  choice: पर उन्होंने कहा
  rationale: वाव-क्रम कथा को आगे बढ़ाता है; यहाँ उत्तर चेतावनी के प्रतिकूल है, इसलिए ‘पर’ निहित विरोध को स्पष्ट और स्वाभाविक बनाता है।
- source_word: לֹא נַקְשִׁיב
  choice: हम ध्यान नहीं देंगे
  rationale: प्रथम पुरुष बहुवचन अपूर्ण रूप לֹא के साथ जानबूझकर इनकार व्यक्त करता है। यह पहले आए ‘ध्यान दो’ को प्रतिध्वनित करता है और ‘हम नहीं सुनेंगे’ की तरह केवल श्रवण तक सीमित नहीं रहता।
theological_decisions:
- issue: पहरेदारों की पहचान और कार्य
  choice: उन्हें परमेश्वर द्वारा लोगों के ऊपर ठहराए गए चेतावनी देने वाले ‘पहरेदार’ ही रखा गया है, बिना उनकी पहचान को और संकीर्ण किए।
  alternative: उन्हें विशेष रूप से भविष्यद्वक्ता, सैनिक संतरी, या अगुवे कहना।
  rationale: इब्रानी रूपक चेतावनी देने वाले मानवीय या भविष्यद्वक्ताई कार्य की अनुमति देता है, पर इस पद में सटीक पहचान नहीं बताता। ‘पहरेदार’ मूल अस्पष्टता और धर्मवैज्ञानिक तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और बोलचाल में समझ आने वाली हिन्दी। समान मूल קשב के आदेश और इनकार को ‘ध्यान दो/ध्यान नहीं देंगे’ के द्वारा जानबूझकर समानांतर रखा गया है। पद में पाठगत या सांस्कृतिक स्पष्टीकरण अनिवार्य न होने के कारण कोई पादटिप्पणी नहीं जोड़ी गई।
