  - severity: low
    issue: “त्यागी हुई/त्याग दिया” can suggest abandonment rather than rejection after testing.
    rationale: “अस्वीकृत/अस्वीकार” better expresses the refining-judgment metaphor and preserves the lexical repetition of מאס.
