  text: They call them rejected silver[a], because Yahweh has rejected them.
translation:
  language: hi
  text: लोग उन्हें “अस्वीकृत चाँदी”[a] कहते हैं, क्योंकि याहवे ने उन्हें अस्वीकार कर दिया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “निकम्मी चाँदी” अथवा “तिरस्कृत चाँदी।” इब्रानी वाक्यांश में धातु-शोधन का रूपक है—ऐसी धातु जो परखने के बाद बेकार ठहराई गई हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: כֶּסֶף
  choice: चाँदी
  rationale: यहाँ धातु को परखने और शुद्ध करने का रूपक है, इसलिए मुद्रा के बजाय ‘चाँदी’ उपयुक्त है।
- source_word: נִמְאָס
  choice: त्यागी हुई
  rationale: यह מאס का कर्मवाच्य कृदंत है। ‘त्यागी हुई’ आधुनिक हिन्दी में स्वाभाविक है और अगले खंड में उसी धातु से बने क्रिया-रूप की पुनरावृत्ति बनाए रखता है।
- source_word: קָרְאוּ לָהֶם
  choice: वे उन्हें … कहते हैं
  rationale: इब्रानी में तृतीय पुरुष बहुवचन की सक्रिय क्रिया और अप्रत्यक्ष कर्म है; हिन्दी में सक्रिय अनिश्चित कर्ता ‘वे’ मूल संरचना को निकटता से व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह नाम दिए जाने का कारण बताता है।
- source_word: מָאַס
  choice: त्याग दिया है
  rationale: पहले आए נִמְאָס के समान मूल מאס को ‘त्याग’ से व्यक्त करके जानबूझकर की गई शब्द-पुनरावृत्ति सुरक्षित रखी गई है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के विशिष्ट वाचा-नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है।
- source_word: בָּהֶם
  choice: उन्हें
  rationale: מאס के साथ בְּ अस्वीकृति के कर्म को चिह्नित करता है; हिन्दी में इसे सीधे ‘उन्हें त्याग दिया’ कहना स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में सामान्य उपाधि नहीं, चार अक्षरों वाला विशिष्ट ईश्वरीय नाम है। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाता है और नाम को उपाधि से नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। उद्धरण-चिह्न नामकरण को स्पष्ट करते हैं; ‘त्यागी हुई/त्याग दिया’ की पुनरावृत्ति मूल इब्रानी शब्दालंकार को सुरक्षित रखती है।
