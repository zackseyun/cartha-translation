  - marker: b
    text: इब्रानी में शाब्दिक अर्थ “लाभ का लोभी है”; प्रसंग में संभवतः बेईमानी या अन्याय से मिलने वाली कमाई का भाव है।
    reason: lexical_alternative
  - marker: c
    text: या, “झूठा व्यवहार करता है” अथवा “कपट करता है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन के आधार या कारण को प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ इस व्याख्यात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִקְּטַנָּם וְעַד גְּדוֹלָם
  choice: उनमें छोटे से लेकर बड़े तक
  rationale: यह पूरे सामाजिक दायरे को समेटने वाला युग्म है और प्रत्यय ‘उनमें’ द्वारा सुरक्षित रहता है।
- source_word: כֻּלּוֹ
  choice: हर कोई
  rationale: एकवचन रूप यहाँ सामूहिक-वितरणात्मक अर्थ रखता है; ‘हर कोई’ प्रत्येक व्यक्ति पर आरोप की व्यापकता स्पष्ट करता है।
- source_word: בּוֹצֵעַ בָּצַע
  choice: बेईमानी की कमाई का लोभी है
  rationale: सजातीय क्रिया-संज्ञा प्रयोग लाभ की तीव्र लालसा बताता है, जिसमें अनुचित या बेईमान लाभ का नैतिक संकेत निहित है।
- source_word: וּמִנָּבִיא וְעַד כֹּהֵן
  choice: और नबी से लेकर याजक तक
  rationale: यह धार्मिक नेतृत्व के दोनों उल्लेखित पदों में व्याप्त भ्रष्टता का दायरा बनाए रखता है।
- source_word: עֹשֶׂה שָּׁקֶר
  choice: छल करता है
  rationale: यह केवल एक झूठ बोलने के बजाय छलपूर्ण आचरण करने का भाव देता है; हिन्दी में यह संक्षिप्त और स्वाभाविक है।
