base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/013.yaml
  text: For from their least to their greatest[a], every one of them is greedy for unjust gain; and from prophet to priest[c][b], every one of them practices falsehood.
translation:
  language: hi
  text: क्योंकि उनमें सबसे छोटे से लेकर सबसे बड़े तक[a], हर कोई बेईमानी की कमाई का लोभी है[b]; और नबी से लेकर याजक तक, हर कोई छल करता है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनमें सबसे छोटे से लेकर सबसे बड़े तक।”
