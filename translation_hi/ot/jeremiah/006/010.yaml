  text: עַל מִ֨י אֲדַבְּרָ֤ה וְ/אָעִ֨ידָה֙ וְ/יִשְׁמָ֔עוּ הִנֵּה֙ עֲרֵלָ֣ה אָזְנָ֔/ם וְ/לֹ֥א יוּכְל֖וּ לְ/הַקְשִׁ֑יב הִנֵּ֣ה דְבַר יְהוָ֗ה הָיָ֥ה לָ/הֶ֛ם לְ/חֶרְפָּ֖ה לֹ֥א יַחְפְּצוּ בֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/010.yaml
  text: To whom shall I speak and give warning[a], that they may hear? Look, their ear is uncircumcised, and they are not able to listen. Look, the word of Yahweh has become a reproach to them[b]; they take no delight in it.
translation:
  language: hi
  text: मैं किससे बोलूँ और किसे चेतावनी दूँ[a] कि वे सुनें? देखो, उनका कान खतनारहित है[b], इसलिए वे ध्यान नहीं दे सकते। देखो, याहवे का वचन उनके लिए तिरस्कार का विषय हो गया है; वे उसमें आनंद नहीं लेते।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘और गवाही दूँ’ अथवा ‘और उनके विरुद्ध साक्षी दूँ’।
    reason: lexical_alternative
  - marker: b
    text: ‘कान खतनारहित है’ एक रूपक है, जिसका अर्थ है कि वे आत्मिक रूप से असंवेदनशील हैं या सुनकर मानने को तैयार नहीं हैं।
    reason: cultural_note
lexical_decisions:
- source_word: אֲדַבְּרָה
  choice: मैं किससे बोलूँ
  rationale: प्रथम पुरुष का रूप आलंकारिक और विचारात्मक प्रश्न व्यक्त करता है; ‘बोलूँ’ इस भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וְאָעִידָה
  choice: और किसे चेतावनी दूँ
  rationale: עוד के हिफ़ील रूप में यहाँ गंभीरता से चेताने या विरुद्ध गवाही देने, दोनों का भाव संभव है। भविष्यद्वक्ताई प्रसंग में ‘चेतावनी दूँ’ व्यावहारिक बल स्पष्ट करता है; ‘गवाही दूँ’ को पादटिप्पणी में रखा गया है।
- source_word: וְיִשְׁמָעוּ
  choice: कि वे सुनें
  rationale: 'संयोजक और अपूर्ण क्रिया को प्रयोजनसूचक रूप में समझा गया है: बोलने और चेताने का उद्देश्य उनका सुनना है।'
- source_word: עֲרֵלָה אָזְנָם
  choice: उनका कान खतनारहित है
  rationale: इब्रानी की एकवचन सामूहिक अभिव्यक्ति और उसकी वाचा-संबंधी देहात्मक उपमा को व्याख्यात्मक परिभाषा से बदलने के बजाय सुरक्षित रखा गया है।
- source_word: לְהַקְשִׁיב
  choice: ध्यान नहीं दे सकते
  rationale: यह क्रिया केवल ध्वनि सुनने के बजाय ध्यानपूर्वक सुनने का भाव रखती है; ‘ध्यान देना’ हिन्दी में ‘सुनें’ के साथ अनावश्यक पुनरुक्ति से भी बचाता है।
- source_word: דְבַר יְהוָה
  choice: यहोवा का वचन
  rationale: मानक भविष्यद्वक्ताई पदबंध को वर्तमान, गरिमापूर्ण हिन्दी में प्रस्तुत किया गया है और ईश्वरीय नाम को लिप्यंतरित किया गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुरक्षरीय ईश्वरीय नाम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: הָיָה לָהֶם לְחֶרְפָּה
  choice: उनके लिए निंदा का विषय हो गया है
  rationale: यह शब्दसमूह बताता है कि यहोवा का वचन उनके लिए तिरस्कार या अपमान से जुड़ी वस्तु बन गया है। ‘निंदा का विषय’ संबंध की कुछ मूल अस्पष्टता बनाए रखता है।
- source_word: לֹא יַחְפְּצוּ בוֹ
  choice: वे उसमें आनंद नहीं लेते
  rationale: חפץ चाहने, प्रसन्न होने और आनंद लेने का भाव दे सकता है; यह चयन भावात्मक अरुचि और इच्छापूर्वक अस्वीकार, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में वाचा का विशिष्ट नाम सीधे आया है; उसे सामान्य उपाधि में बदलने के बजाय हिन्दी में पहचाने जाने योग्य नाम के रूप में रखा गया है।
- issue: ‘खतनारहित कान’ की उपमा
  choice: उपमा को मुख्य पाठ में ‘उनका कान खतनारहित है’ के रूप में बनाए रखना
  alternative: उनके कान बंद हैं / वे आत्मिक रूप से बहरे हैं
  rationale: मूल की देहात्मक और वाचा-संबंधी छवि भविष्यद्वक्ताई कथन का महत्वपूर्ण धर्मवैचारिक तनाव रखती है। उसका अर्थ पादटिप्पणी में समझाया गया है, पर मुख्य पाठ में उसे सपाट नहीं किया गया।
- issue: ‘निंदा का विषय’ में संबंध की दिशा
  choice: उनके लिए निंदा का विषय
  alternative: उनके उपहास का विषय / उन्हें अपमानित करने वाला
  rationale: इब्रानी संबंध यह संकेत दे सकता है कि वे वचन को तुच्छ समझते हैं, जबकि अभिव्यक्ति उनके लिए उसके अपमानजनक या निंदात्मक प्रभाव की छाया भी रख सकती है। मुख्य पाठ अधिक निर्णायक व्याख्या थोपने से बचता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और भविष्यद्वक्ताई तीव्रता के अनुरूप रखी गई है। ‘खतनारहित कान’ जैसी मूल सांस्कृतिक उपमा जानबूझकर सुरक्षित है, जबकि उसका आशय पादटिप्पणी में स्पष्ट किया गया है।
