id: JER.6.20
reference: Jeremiah 6:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לָ/מָּה זֶּ֨ה לִ֤/י לְבוֹנָה֙ מִ/שְּׁבָ֣א תָב֔וֹא וְ/קָנֶ֥ה הַ/טּ֖וֹב מֵ/אֶ֣רֶץ מֶרְחָ֑ק עֹלֽוֹתֵי/כֶם֙ לֹ֣א לְ/רָצ֔וֹן וְ/זִבְחֵי/כֶ֖ם לֹא עָ֥רְבוּ לִֽ/י־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/020.yaml
  text: 'Why is this to me: frankincense comes from Sheba[a], and sweet cane from a distant land? Your burnt offerings are not acceptable[b], and your sacrifices do not please me.'
translation:
  language: hi
  text: शबा से आनेवाली लोबान और दूर देश से आनेवाला उत्तम सुगन्धित सरकंडा[b] मेरे किस काम के हैं?[a] तुम्हारी होमबलियाँ मुझे स्वीकार्य नहीं हैं, और तुम्हारे बलिदान मुझे नहीं भाते।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से: “यह मेरे लिए क्यों है कि शबा से लोबान और दूर देश से उत्तम सरकंडा आता है?”'
    reason: हिब्रू आरम्भिक वाक्यांश לָמָּה זֶּה לִי की संरचना और उसकी सम्भव अधिक शाब्दिक व्याख्या को सुरक्षित रखना।
  - marker: b
    text: “सुगन्धित सरकंडा” का अनुवाद “सुगन्धित नरकट” या “कैलमस” भी हो सकता है।
    reason: קָנֶה הַטּוֹב के वनस्पति-संबंधी अर्थ और वैकल्पिक नामों को बताना।
lexical_decisions:
- source_word: לָמָּה זֶּה לִי
  choice: मेरे किस काम के हैं?
  rationale: यह स्वाभाविक हिन्दी में आलंकारिक प्रश्न और ‘मेरे लिए’ के भाव को बनाए रखता है। हिब्रू की अधिक शाब्दिक, किंतु हिन्दी में असहज, संरचना को पाद-टिप्पणी में रखा गया है।
- source_word: לְבוֹנָה
  choice: लोबान
  rationale: यह सामान्य धूप के बजाय विशेष रूप से frankincense को दर्शाने वाला प्रचलित हिन्दी शब्द है।
- source_word: מִשְּׁבָא
  choice: शबा से
  rationale: स्थान-नाम को हिन्दी की प्रचलित बाइबलीय वर्तनी में लिप्यंतरित किया गया है।
- source_word: תָבוֹא
  choice: आनेवाली
  rationale: अपूर्ण क्रिया को यहाँ व्यापार से आने वाली वस्तु के सामान्य वर्तमान गुण के रूप में व्यक्त किया गया है।
- source_word: קָנֶה הַטּוֹב
  choice: उत्तम सुगन्धित सरकंडा
  rationale: कָנֶה का मूल अर्थ सरकंडा/नरकट है; विशेषण के साथ यहाँ मूल्यवान सुगन्धित वनस्पति अभिप्रेत है। ‘उत्तम’ मूल विशेषण को भी स्पष्ट रखता है।
- source_word: מֵאֶרֶץ מֶרְחָק
  choice: दूर देश से
  rationale: यह भौगोलिक दूरी के मूल भाव को संक्षिप्त और स्वाभाविक हिन्दी में रखता है।
- source_word: עֹלוֹתֵיכֶם
  choice: तुम्हारी होमबलियाँ
  rationale: ‘होमबलि’ पूर्णतः जलाई जाने वाली बलि के इस विशिष्ट धार्मिक पद का स्थापित हिन्दी रूप है।
- source_word: לֹא לְרָצוֹן
  choice: मुझे स्वीकार्य नहीं हैं
  rationale: यह परमेश्वर के सम्मुख इन बलियों को स्वीकृति या अनुग्रह न मिलने का भाव स्पष्ट करता है।
- source_word: זִבְחֵיכֶם
  choice: तुम्हारे बलिदान
  rationale: यह सामान्य बलि-संबंधी पद का स्पष्ट और प्रचलित हिन्दी अनुवाद है।
- source_word: לֹא עָרְבוּ לִי
  choice: मुझे नहीं भाते
  rationale: यह ‘मेरे लिए सुखद/मनभावने नहीं’ के अर्थ को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: अस्वीकृत उपासना के विषय में परमेश्वर का कथन
  choice: महँगी आयातित सुगन्धित वस्तुओं और बलियों को परमेश्वर के लिए अनुपयोगी तथा अस्वीकार्य बताने वाला आलंकारिक प्रश्न और सीधा निषेध
  alternative: वस्तुओं के आयात पर केवल एक तटस्थ प्रश्न, जिसमें उपासना की आलोचना का भाव कम स्पष्ट हो
  rationale: हिब्रू पाठ स्वयं ‘मेरे किस काम’ और ‘स्वीकार्य नहीं’ कहकर धार्मिक चढ़ावों को स्पष्ट रूप से ठुकराता है; अनुवाद इसी तनाव को रखता है, पर आसपास के प्रसंग से कोई अतिरिक्त धार्मिक व्याख्या नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘लोबान’, ‘होमबलि’ और ‘बलिदान’ जैसे आवश्यक धार्मिक/सांस्कृतिक पद सुरक्षित हैं; वाक्य-विन्यास स्वाभाविक हिन्दी के अनुसार है।
