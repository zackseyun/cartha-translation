  text: שָׁמַ֥עְנוּ אֶת שָׁמְע֖/וֹ רָפ֣וּ יָדֵ֑י/נוּ צָרָה֙ הֶחֱזִיקַ֔תְ/נוּ חִ֖יל כַּ/יּוֹלֵדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/024.yaml
  text: We have heard the report of it[a]; our hands hang limp. Distress has seized us[c][b], pain like a woman giving birth.
translation:
  language: hi
  text: हमने उसके बारे में समाचार सुना है[a]; हमारे हाथ ढीले पड़ गए हैं[b]। संकट ने हमें जकड़ लिया है—हम प्रसव करती स्त्री जैसी पीड़ा से तड़प रहे हैं[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसका समाचार’; इब्रानी पद का अर्थ उसके विषय में समाचार या उससे आया समाचार, दोनों हो सकता है। प्रसंग में पहले अर्थ की सम्भावना अधिक है।
    reason: lexical_alternative
  - marker: b
    text: यह बल या साहस खो देने के लिए प्रयुक्त इब्रानी मुहावरा है।
    reason: idiom_explanation
  - marker: c
    text: इब्रानी शब्द का अर्थ ‘तड़प’ या ‘व्याकुलता’ भी हो सकता है; यहाँ प्रसव की उपमा उसके पीड़ा-संबंधी अर्थ को उभारती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְנוּ
  choice: हमने … सुना है
  rationale: 'क़ाल पूर्णकाल प्रथम पुरुष बहुवचन को वर्तमान परिणाम सहित व्यक्त किया गया है: समाचार सुन लिया गया है और उसका प्रभाव आगे के वाक्यों में बना हुआ है।'
- source_word: אֶת שָׁמְעוֹ
  choice: उसके बारे में समाचार
  rationale: שֵׁמַע/שֶׁמַע का अर्थ समाचार या खबर है। तृतीय पुरुष एकवचन प्रत्यय को प्रसंगानुसार आनेवाले शत्रु के विषय में समाचार समझा गया है; मूल की सम्भव वैकल्पिक समझ पादटिप्पणी में रखी गई है।
- source_word: רָפוּ יָדֵינוּ
  choice: हमारे हाथ ढीले पड़ गए हैं
  rationale: हाथों के ढीले पड़ने की शारीरिक छवि बचाते हुए बल और साहस खोने का इब्रानी मुहावरा स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: צָרָה
  choice: संकट
  rationale: צָרָה कठिन परिस्थिति, घोर परेशानी या व्याकुलता को दर्शाता है; यहाँ ‘संकट’ बाहरी भय और भीतरी घबराहट दोनों के अनुकूल है।
- source_word: הֶחֱזִיקַתְנוּ
  choice: हमें जकड़ लिया है
  rationale: חזק के हिफ़ईल रूप का यहाँ अर्थ पकड़ लेना या अपने वश में कर लेना है; ‘जकड़ लिया’ सजीव और स्वाभाविक है।
- source_word: חִיל
  choice: पीड़ा
  rationale: חִיל तड़प, व्याकुलता अथवा प्रसव-वेदना बता सकता है। निकटवर्ती प्रसव-उपमा के कारण ‘पीड़ा’ स्पष्ट है, पर शब्द की व्यापकता पादटिप्पणी में सुरक्षित है।
- source_word: כַּיּוֹלֵדָה
  choice: जन्म देनेवाली स्त्री जैसी
  rationale: כ prefixed participle ילד प्रसव की प्रक्रिया में लगी स्त्री से तुलना करता है; यह हिन्दी में स्पष्ट और गरिमापूर्ण है।
