reference: Jeremiah 6:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֡ה עִמְדוּ֩ עַל דְּרָכִ֨ים וּ/רְא֜וּ וְ/שַׁאֲל֣וּ לִ/נְתִב֣וֹת עוֹלָ֗ם אֵי זֶ֨ה דֶ֤רֶךְ הַ/טּוֹב֙ וּ/לְכוּ בָ֔/הּ וּ/מִצְא֥וּ מַרְגּ֖וֹעַ לְ/נַפְשְׁ/כֶ֑ם וַ/יֹּאמְר֖וּ לֹ֥א נֵלֵֽךְ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/016.yaml
  text: 'Thus says Yahweh: “Stand by the roads and look[a], and ask for the ancient paths, where the good way is; then walk in it, and find rest for your souls. But they said[b], ‘We will not walk in it.’”'
translation:
  language: hi
  text: 'याहवे यह कहता है:


    “मार्गों पर खड़े होकर देखो;


    प्राचीन मार्गों[a] के बारे में पूछो कि


    ‘भला मार्ग कौन-सा है?’


    फिर उसी पर चलो,


    और अपने लिए विश्राम पाओ[b]।”


    पर उन्होंने कहा,


    “हम उस पर नहीं चलेंगे।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पुराने समय के मार्ग” अथवा “सदा से चले आ रहे मार्ग।”
    reason: עֹולָם यहाँ प्राचीन काल, दीर्घ अवधि, या स्थायित्व का बोध करा सकता है।
  - marker: b
    text: “अपने लिए” के पीछे इब्रानी शब्द का अर्थ संदर्भ के अनुसार “अपने प्राणों के लिए” या “अपने जीवन के लिए” भी हो सकता है।
    reason: נֶפֶשׁ की व्यापक अर्थ-सीमा को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में उसके प्रचलित निकट लिप्यंतरण से व्यक्त किया गया है।
- source_word: עִמְדוּ עַל דְּרָכִים
  choice: मार्गों पर खड़े होकर
  rationale: बहुवचन ‘मार्गों’ और रुककर दिशा परखने के दृश्य को बनाए रखता है; ‘चौराहे पर’ कहना संदर्भानुकूल होता, पर मूल से अधिक विशिष्ट होता।
- source_word: וּרְאוּ
  choice: देखो
  rationale: यह शारीरिक रूप से देखने और विचारपूर्वक परखने, दोनों अर्थों के लिए स्वाभाविक है।
- source_word: לִנְתִבוֹת עוֹלָם
  choice: प्राचीन पगडंडियों
  rationale: נְתִיבוֹת छोटे मार्गों या पगडंडियों को और עוֹלָם यहाँ प्राचीनता अथवा बहुत पुराने समय को सूचित करता है।
- source_word: אֵי זֶה דֶרֶךְ הַטּוֹב
  choice: भला मार्ग कौन-सा है?
  rationale: इब्रानी प्रश्न मार्ग की पहचान पूछता है। हिन्दी में ‘कौन-सा’ सहज है और ‘कहाँ है’ की तुलना में पहचान का भाव स्पष्ट रखता है।
- source_word: וּלְכוּ בָהּ
  choice: फिर उसी पर चलो
  rationale: मार्ग पर चलने के प्रत्यक्ष बिंब और जीवन-आचरण के रूपक, दोनों को बनाए रखता है। ‘फिर’ आदेशों की स्वाभाविक प्रगति व्यक्त करता है।
- source_word: וּמִצְאוּ מַרְגּוֹעַ
  choice: विश्राम पाओ
  rationale: מַרְגּוֹעַ राहत, चैन या विश्राम को सूचित करता है; आज्ञार्थक रचना को हिन्दी में यथावत रखा गया है।
- source_word: לְנַפְשְׁכֶם
  choice: अपने प्राणों के लिए
  rationale: נֶפֶשׁ का अर्थ प्राण, स्वयं या जीवन हो सकता है। ‘प्राणों’ मूल की व्यापक मानवीय और आंतरिक गहराई रखता है, बिना किसी तकनीकी द्वैतवादी अर्थ को अनिवार्य किए।
- source_word: וַיֹּאמְרוּ
  choice: पर उन्होंने कहा
  rationale: वाव कथन को आगे बढ़ाता है, जबकि संदर्भ में उत्तर स्पष्ट विरोधी है; ‘पर’ इस विरोध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לֹא נֵלֵךְ
  choice: हम उस पर नहीं चलेंगे
  rationale: मूल में केवल ‘हम नहीं चलेंगे’ है; ‘उस पर’ निकटवर्ती भले मार्ग को स्पष्ट करने वाला निहित कर्म है।
theological_decisions:
- issue: נֶפֶשׁ को प्रतिज्ञात विश्राम के संदर्भ में व्यक्त करना
  choice: अपने प्राणों के लिए
  alternative: अपने लिए / अपने जीवन के लिए
  rationale: ‘प्राणों’ से पूरे व्यक्ति और उसके भीतर के गहरे विश्राम का भाव बना रहता है, पर पाठ पर आत्मा-संबंधी कोई विशिष्ट दार्शनिक या सांप्रदायिक सिद्धांत नहीं थोपा जाता।
- issue: ‘प्राचीन पगडंडियों’ का आशय
  choice: प्राचीन पगडंडियों
  alternative: सनातन पगडंडियों / पुराने समय की पगडंडियों
  rationale: संदर्भ पुराने, स्थापित मार्गों की ओर लौटने का आह्वान करता है। ‘सनातन’ अनावश्यक रूप से दार्शनिक या धार्मिक अर्थ ग्रहण कर सकता है; इसलिए कालगत प्राचीनता को प्राथमिकता दी गई है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। काव्यात्मक पंक्ति-विन्यास आदेशों, प्रश्न, प्रतिज्ञा और लोगों के विरोधी उत्तर को स्पष्ट करता है। ‘मार्ग’ और ‘पगडंडी’ जीवन-आचरण के मूल रूपक को बनाए रखते हैं।
