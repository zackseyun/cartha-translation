source:
  edition: WLC
  text: כֹּ֤ה אָמַר֙ יְהֹוָ֣ה צְבָא֔וֹת עוֹלֵ֛ל יְעוֹלְל֥וּ כַ/גֶּ֖פֶן שְׁאֵרִ֣ית יִשְׂרָאֵ֑ל הָשֵׁב֙ יָדְ/ךָ֔ כְּ/בוֹצֵ֖ר עַל סַלְסִלּֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/009.yaml
  text: 'Thus says Yahweh of hosts: They will thoroughly glean the remnant of Israel as a vine[a]; pass your hand over the branches again like a grape-gatherer.'
translation:
  language: hi
  text: 'सेनाओं का याहवे यों कहता है:


    “वे इस्राएल के बचे हुओं को

    दाखलता के समान पूरी तरह बीन लेंगे।

    अंगूर बटोरनेवाले की तरह

    डालियों[a] पर अपना हाथ फिर डाल।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या सम्भवतः “लता की लतरों”; यहाँ प्रयुक्त इब्रानी शब्द दुर्लभ है और उसका ठीक आशय विवादित है। कुछ लोग इसका अर्थ “टोकरियों” भी मानते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהֹוָה
  choice: याहवे
  rationale: वाचा के व्यक्तिगत ईश्वरीय नाम को उपाधि में बदलने के बजाय हिन्दी लिप्यंतरण से सुरक्षित रखा गया है।
- source_word: צְבָאוֹת
  choice: सेनाओं का
  rationale: यह पदवी स्वर्गीय और पार्थिव सैन्य-दलों पर याहवे की प्रभुता का बोध कराती है और हिन्दी में समझने योग्य है।
- source_word: עוֹלֵל יְעוֹלְלוּ
  choice: पूरी तरह बीन लेंगे
  rationale: एक ही धातु के क्रियार्थक रूप और अपूर्ण क्रिया का मेल क्रिया को तीव्र करता है; ‘पूरी तरह’ उस बल को और ‘बीन लेंगे’ कटाई के रूपक को व्यक्त करता है।
- source_word: כַגֶּפֶן
  choice: दाखलता के समान
  rationale: तुलनात्मक उपसर्ग को सीधे रूपकात्मक तुलना के रूप में रखा गया है।
- source_word: שְׁאֵרִית יִשְׂרָאֵל
  choice: इस्राएल के बचे हुओं को
  rationale: यह स्वाभाविक आधुनिक हिन्दी में उन लोगों को दर्शाता है जो पहले के विनाश के बाद शेष रह गए हैं।
- source_word: הָשֵׁב יָדְךָ
  choice: अपना हाथ फिर से फेर
  rationale: एकवचन पुल्लिंग आज्ञार्थक रूप और कटाई की क्रिया दोहराने का भाव सुरक्षित है।
- source_word: כְּבוֹצֵר
  choice: अंगूर बटोरनेवाले के समान
  rationale: यह अंगूर की फसल इकट्ठी करने वाले व्यक्ति को स्पष्ट रूप से व्यक्त करता है।
- source_word: עַל סַלְסִלּוֹת
  choice: डालियों पर
  rationale: दाख की खेती के प्रसंग में दुर्लभ संज्ञा को सम्भवतः लता की डालियों के अर्थ में लिया गया है; अनिश्चितता पादटिप्पणी में रखी गई है।
theological_decisions:
- issue: वाचा के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: व्यक्तिगत ईश्वरीय नाम को हिन्दी में स्पष्ट रूप से प्रस्तुत करता है, उसे सामान्य उपाधि से प्रतिस्थापित नहीं करता।
- issue: שְׁאֵרִית का आशय
  choice: बचे हुए लोग
  alternative: शेष भाग
  rationale: व्याकरणतः सामूहिक अर्थ सम्भव है और न्याय के प्रसंग में इस्राएल के जीवित बचे लोगों का बोध स्वाभाविक है; किसी विशिष्ट उत्तरकालीन धर्मवैज्ञानिक अर्थ को आरोपित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। काव्य-पंक्तियाँ मूल वचन की समानांतर गति को उभारती हैं। ‘बीनना’ दाखलता पर बचे अंगूरों को दोबारा चुन लेने और इस्राएल के बचे हुओं पर आने वाले पूर्ण न्याय—दोनों को बनाए रखता है। अंतिम आज्ञा का एकवचन रूप मूल इब्रानी के अनुसार सुरक्षित है, यद्यपि पहले खंड का कर्ता बहुवचन है।
