lexical_decisions:
- source_word: ק֚וּמוּ
  choice: उठो
  rationale: पुल्लिंग बहुवचन आज्ञार्थक रूप है। ‘उठो’ कार्रवाई के लिए सीधे और तात्कालिक आह्वान को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וְ/נַעֲלֶ֣ה
  choice: हम ... चढ़ चलें
  rationale: प्रथम पुरुष बहुवचन कोहोर्टेटिव का आग्रहपूर्ण भाव सुरक्षित रखा गया है। ‘चढ़ चलें’ घेराबंदी के संदर्भ में ऊपर या आगे बढ़ने की इब्रानी अभिव्यक्ति को केवल ‘आक्रमण करें’ कहकर सीमित नहीं करता।
- source_word: בַ/לָּ֔יְלָה
  choice: रात में
  rationale: यह समय बताने वाला पदबंध है; ‘रात में’ सहज और स्पष्ट आधुनिक हिन्दी है।
- source_word: וְ/נַשְׁחִ֖יתָה
  choice: और ... नष्ट कर दें
  rationale: हिफ़ील प्रथम पुरुष बहुवचन कोहोर्टेटिव जानबूझकर विनाश करने का सामूहिक संकल्प व्यक्त करता है; ‘नष्ट कर दें’ उसके आग्रह और पूर्ण विनाश के भाव को स्वाभाविक रूप से रखता है।
- source_word: אַרְמְנוֹתֶֽי/הָ
  choice: उसके महलों
  rationale: स्त्रीलिंग एकवचन प्रत्यय नगर की ओर संकेत करता है। אַרְמוֹן भव्य राजकीय भवन के साथ सुदृढ़ गढ़नुमा संरचना भी सूचित कर सकता है; मुख्य पाठ में प्रचलित अर्थ ‘महलों’ रखा गया है और व्यापक अर्थ पादटिप्पणी में दिया गया है।
