source:
  edition: WLC
  text: הָעִ֣זוּ בְּנֵ֣י בִניָמִ֗ן מִ/קֶּ֨רֶב֙ יְר֣וּשָׁלִַ֔ם וּ/בִ/תְק֨וֹעַ֙ תִּקְע֣וּ שׁוֹפָ֔ר וְ/עַל בֵּ֥ית הַכֶּ֖רֶם שְׂא֣וּ מַשְׂאֵ֑ת כִּ֥י רָעָ֛ה נִשְׁקְפָ֥ה מִ/צָּפ֖וֹן וְ/שֶׁ֥בֶר גָּדֽוֹל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/001.yaml
  text: Take cover[a], sons of Benjamin, from the midst of Jerusalem! Blow the trumpet in Tekoa, and raise a signal over Beth-haccherem, for disaster is looking down from the north[d][c][b], and great destruction.
translation:
  language: hi
  text: हे बिन्यामीन के वंशजो, यरूशलेम के बीच से निकलकर सुरक्षित स्थान की ओर भागो![a] तकोआ में नरसिंगा फूँको, और बेत-हक्केरेम[b] पर चेतावनी का संकेत उठाओ![c] क्योंकि उत्तर दिशा से विपत्ति झाँक रही है,[d] और भारी विनाश।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस हिब्रू आज्ञा का अर्थ कठिन है। इसका अनुवाद ‘बचने के लिए भागो’, ‘शरण लो’ या ‘भागने के लिए इकट्ठे हो जाओ’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: बेत-हक्केरेम एक स्थान का नाम है। संभवतः यह यरूशलेम और तकोआ के बीच चेतावनी के संकेत देने के काम आने वाला कोई ऊँचा स्थान था।
    reason: cultural_note
  - marker: c
    text: इसका अनुवाद ‘अग्नि-संकेत जलाओ’ या ‘ऊँचा संकेत खड़ा करो’ भी हो सकता है।
    reason: lexical_alternative
  - marker: d
    text: हिब्रू में शाब्दिक रूप से ‘विपत्ति ने उत्तर दिशा से नीचे झाँका है’ कहा गया है; आने वाली विपत्ति को मानो एक जीवित व्यक्ति के रूप में चित्रित किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעִזוּ
  choice: सुरक्षित स्थान की ओर भागो
  rationale: इस कठिन हिफ़ील आज्ञार्थक का संदर्भ आसन्न आक्रमण और चेतावनी के संकेतों का है। इसलिए इसे केवल ‘बलवान बनो’ के बजाय तत्काल सुरक्षा के लिए निकल भागने की पुकार के रूप में व्यक्त किया गया है; पाठ की अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: בְּנֵי בִנְיָמִן
  choice: हे बिन्यामीन के वंशजो
  rationale: शाब्दिक ‘बिन्यामीन के पुत्रो’ हिंदी में केवल पुरुषों तक सीमित समझा जा सकता है। ‘वंशजो’ हिब्रू के कुल-संबंधी संबोधन और सामूहिक गोत्रीय अर्थ, दोनों को स्वाभाविक ढंग से रखता है।
- source_word: מִקֶּרֶב יְרוּשָׁלִַם
  choice: यरूशलेम के बीच से निकलकर
  rationale: קֶרֶב नगर के भीतर या मध्य भाग को सूचित करता है। ‘निकलकर’ आज्ञा में निहित बाहर की ओर गति को स्पष्ट करता है।
- source_word: וּבִתְקוֹעַ תִּקְעוּ שׁוֹפָר
  choice: तकोआ में नरसिंगा फूँको
  rationale: שׁוֹפָר चेतावनी के लिए फूँका जाने वाला सींग है। ‘नरसिंगा’ आधुनिक हिंदी बाइबलीय शैली में सींग से बने फूँक-वाद्य और सार्वजनिक चेतावनी, दोनों को व्यक्त करता है।
- source_word: שְׂאוּ מַשְׂאֵת
  choice: चेतावनी का संकेत उठाओ
  rationale: מַשְׂאֵת किसी उठाई गई संकेत-वस्तु, संभवतः अग्नि-संकेत, को सूचित कर सकता है। मुख्य पाठ इसे अनावश्यक रूप से ‘आग’ तक सीमित नहीं करता।
- source_word: רָעָה נִשְׁקְפָה מִצָּפוֹן
  choice: उत्तर दिशा से विपत्ति झाँक रही है
  rationale: רָעָה यहाँ नैतिक बुराई के बजाय आने वाली विपत्ति है। נִשְׁקְפָה ऊँचाई से देखने या झाँकने का बिंब देता है; ‘झाँक रही है’ उस मानवीकरण को बचाता है।
- source_word: וְשֶׁבֶר גָּדוֹל
  choice: और भारी विनाश भी
  rationale: שֶׁבֶר का मूल भाव टूटना है, पर यहाँ उसका परिणाम व्यापक विनाश है। ‘भी’ हिब्रू की संक्षिप्त, क्रियारहित अंतिम अभिव्यक्ति को हिंदी में बनाए रखता है।
theological_decisions:
- issue: गोत्रीय संबोधन में लिंग
  choice: बिन्यामीन के वंशजो
  alternative: बिन्यामीन के पुत्रो
  rationale: यह संबोधन पूरे बिन्यामीन गोत्र को सामूहिक रूप से पुकारता है। ‘वंशजो’ स्रोत के वंश-संबंध को रखता है और हिंदी में अनावश्यक रूप से केवल पुरुषों का अर्थ नहीं देता।
- issue: आने वाले न्याय की भाषा
  choice: विपत्ति ... भारी विनाश
  alternative: बुराई ... बड़ा टूटना
  rationale: इस प्रसंग में शब्द आसन्न राष्ट्रीय विपदा का वर्णन करते हैं; मुख्य पाठ नैतिक बुराई या किसी अतिरिक्त धर्मवैज्ञानिक निष्कर्ष को आरोपित नहीं करता।
- issue: विपत्ति का मानवीकरण
  choice: विपत्ति झाँक रही है
  alternative: विपत्ति दिखाई दे रही है
  rationale: स्रोत में ऊँचाई से देखने का सजीव बिंब है। इसे सपाट ‘दिखाई दे रही है’ में बदलने के बजाय मानवीकरण को सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज किंतु गरिमापूर्ण चेतावनी-शैली अपनाई गई है। स्थान-नामों का प्रचलित हिंदी लिप्यंतरण रखा गया है। छोटे, तीखे आज्ञार्थक वाक्य आसन्न सैन्य संकट की तात्कालिकता व्यक्त करते हैं; कठिन हिब्रू बिंब और शब्दार्थगत विकल्प पादटिप्पणियों में सुरक्षित हैं।
