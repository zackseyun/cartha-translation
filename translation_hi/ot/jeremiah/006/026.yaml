base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/026.yaml
  text: Daughter of my people[a], put on sackcloth and roll in ashes; make mourning as for an only son, a most bitter lamentation[c][b], for suddenly the destroyer will come upon us.
translation:
  language: hi
  text: हे मेरी प्रजा की बेटी, टाट बाँध ले और राख में लोट जा; इकलौते बेटे के शोक के समान अत्यन्त कड़वा विलाप कर, क्योंकि विनाश करने वाला अचानक हम पर आ पड़ेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּת עַמִּי
  choice: मेरी प्रजा की बेटी
  rationale: इब्रानी के प्रत्यक्ष स्त्रीलिंग संबोधन और प्रजा के बेटी के रूप में व्यक्तिकरण को बनाए रखता है।
- source_word: חִגְרִי שָׂק
  choice: टाट बाँध ले
  rationale: חגר के ‘कमर में बाँधने/धारण करने’ के भाव को शोक के वस्त्र टाट के साथ संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְהִתְפַּלְּשִׁי בָאֵפֶר
  choice: राख में लोट
  rationale: हित्पएल रूप राख में अपने को पटकने या लोटने की तीव्र शोक-क्रिया दर्शाता है; इसे केवल राख लगाने तक सीमित नहीं किया गया।
- source_word: אֵבֶל יָחִיד
  choice: इकलौते बेटे के शोक जैसा शोक
  rationale: शोक-संदर्भ में יָחִיד इकलौते बेटे के लिए किए जाने वाले अत्यन्त गहरे शोक का रूढ़ चित्र प्रस्तुत करता है।
- source_word: עֲשִׂי לָךְ
  choice: अपने लिए ... शोक मना
  rationale: לָךְ के आत्मसंबंधी भाव को छोड़े बिना हिन्दी की स्वाभाविक पद-रचना अपनाई गई है।
- source_word: מִסְפַּד תַּמְרוּרִים
  choice: अत्यन्त कटु विलाप
  rationale: מִסְפַּד मृत्यु-संबंधी विलाप है और תַּמְרוּרִים उसकी कटुता/तीव्रता को प्रबल करता है।
- source_word: הַשֹּׁדֵד
  choice: विनाश करनेवाला
  rationale: सहभागी रूप उस व्यक्ति या शक्ति को दर्शाता है जो उजाड़ता और लूटता है; यह चयन व्यापक विनाशकारी भाव रखता है।
- source_word: עָלֵינוּ
  choice: हम पर
  rationale: मसोरेटिक पाठ के प्रथम पुरुष बहुवचन को सुरक्षित रखता है और नबी की अपनी प्रजा के साथ एकजुटता व्यक्त करता है।
theological_decisions:
- issue: द्वितीय पुरुष स्त्रीलिंग संबोधन से प्रथम पुरुष बहुवचन निष्कर्ष की ओर परिवर्तन
  choice: ‘मेरी प्रजा की बेटी ... हम पर’ के रूप में परिवर्तन बनाए रखा
  alternative: शैलीगत एकरूपता के लिए ‘तुम पर’ करना
  rationale: इब्रानी पाठ का सर्वनाम-परिवर्तन नबी को आनेवाली विपत्ति में प्रजा के साथ सम्मिलित करता है; उसे समतल करना पाठ की अर्थपूर्ण तनावशीलता मिटा देता।
- issue: יָחִיד का लिंग-संबंधी अर्थ
  choice: इकलौता बेटा
  alternative: इकलौती संतान / इकलौता जन
  rationale: इस शोक-वाक्यांश का पारंपरिक इब्रानी प्रयोग प्रायः इकलौते बेटे के शोक को सूचित करता है; फिर भी यह किसी विशिष्ट धर्मसिद्धान्त का संकेत नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण पर सामान्य पाठक के लिए स्पष्ट। स्त्रीलिंग एकवचन आज्ञाएँ संबोधित व्यक्तिकृत ‘बेटी’ के अनुरूप हैं। ‘टाट’ बाइबिलीय शोक-वस्त्र के लिए प्रचलित और संक्षिप्त शब्द है।
