source:
  edition: WLC
  text: בָּח֛וֹן נְתַתִּ֥י/ךָ בְ/עַמִּ֖/י מִבְצָ֑ר וְ/תֵדַ֕ע וּ/בָחַנְתָּ֖ אֶת דַּרְכָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/027.yaml
  text: I have made you a tester among my people[a], a fortress[b], so that you may know and test their way.
translation:
  language: hi
  text: मैंने तुझे अपनी प्रजा के बीच धातु परखनेवाला[a], एक गढ़ बनाया है, ताकि तू उनके चाल-चलन[b] को जाने और परखे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपनी प्रजा के बीच परखनेवाला, एक गढ़।” इब्रानी वाक्य संक्षिप्त और कुछ कठिन है। “धातु परखनेवाला” आसपास के पदों में धातु की शुद्धता जाँचने की छवि को प्रकट करता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ “उनका मार्ग”; इसका आशय उनका आचरण या जीवन-रीति भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּחוֹן
  choice: धातु परखनेवाला
  rationale: यह शब्द בחן धातु से बना है और यहाँ अगले पदों की धातु-जाँच की छवि के अनुरूप परखनेवाले, विशेषतः धातु की शुद्धता जाँचनेवाले, को सूचित करता है। केवल ‘परखनेवाला’ अधिक सामान्य होता; ‘धातु परखनेवाला’ संदर्भगत रूपक स्पष्ट रखता है।
- source_word: נְתַתִּיךָ
  choice: मैंने तुझे ... बनाया है
  rationale: נתן का मूल अर्थ ‘देना/ठहराना’ है, पर पदसूचक संज्ञाओं के साथ यह किसी भूमिका में नियुक्त करने का भाव देता है; आधुनिक हिन्दी में ‘बनाया है’ स्वाभाविक है।
- source_word: בְעַמִּי
  choice: अपनी प्रजा के बीच
  rationale: ב यहाँ यिर्मयाह की प्रजा के मध्य नियुक्ति बताता है; ‘के बीच’ सहज हिन्दी है।
- source_word: מִבְצָר
  choice: एक गढ़
  rationale: मसोरेटिक पाठ में संज्ञा का सामान्य अर्थ ‘गढ़/किलाबंद स्थान’ है। कठिन और संक्षिप्त वाक्य होते हुए भी ठोस रूपक को बनाए रखा गया है।
- source_word: וְתֵדַע
  choice: ताकि तू ... जाने
  rationale: संयोजक सहित अपूर्ण क्रिया को यहाँ नियुक्ति का उद्देश्य बतानेवाला समझना संदर्भानुकूल है, यद्यपि क्रमसूचक ‘और तू जानेगा’ भी व्याकरणतः संभव है।
- source_word: וּבָחַנְתָּ
  choice: और परखे
  rationale: यह क्रिया בחן उसी मूल को दोहराती है जिससे आरंभिक संज्ञा बनी है; ‘परखे’ उस शाब्दिक संबंध और जाँच के भाव को बनाए रखता है।
- source_word: דַּרְכָּם
  choice: उनके चाल-चलन
  rationale: דרך का शाब्दिक अर्थ ‘मार्ग’ है, पर रूपकतः आचरण या जीवन-रीति। वर्तमान नैतिक संदर्भ में ‘चाल-चलन’ सामान्य पाठक के लिए स्पष्ट है, जबकि पादटिप्पणी शाब्दिक विकल्प सुरक्षित रखती है।
