  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सुबोध शैली रखी गई है। परमेश्वर द्वारा भविष्यद्वक्ता को सीधे संबोधन के कारण ‘तुझे/तू’ प्रयुक्त है। ‘गढ़’ और धातु-जाँच की छवि को मूल पाठ की कठिनता तथा रूपकात्मक तनाव सहित बनाए रखा गया है।
