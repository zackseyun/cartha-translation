source:
  edition: WLC
  text: נָחַ֣ר מַפֻּ֔חַ מ/אשת/ם עֹפָ֑רֶת לַ/שָּׁוְא֙ צָרַ֣ף צָר֔וֹף וְ/רָעִ֖ים לֹ֥א נִתָּֽקוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/029.yaml
  text: The bellows blow fiercely[a]; the lead is consumed by the fire. In vain the refiner keeps refining[b], but the wicked are not separated out.
translation:
  language: hi
  text: धौंकनी ज़ोर से फूँकती है[a]; आग से सीसा जलकर नष्ट हो जाता है। शोधक व्यर्थ ही शोधन करता रहता है[b], पर दुष्ट अलग नहीं किए जाते।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “धौंकनी झुलस गई है; उसकी आग से सीसा जलकर नष्ट हो गया है।” इस उपवाक्य का इब्रानी पाठ कठिन है; आग और सीसे के परस्पर संबंध को लेकर अनुवाद भिन्न हैं।
    reason: textual_variant
  - marker: b
    text: “दुष्ट अलग नहीं किए जाते” का अनुवाद “बुरे लोग हटाए नहीं जाते” अथवा धातु-शोधन के अधिक शाब्दिक अर्थ में “अशुद्धियाँ निकालकर अलग नहीं की जातीं” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נָחַר
  choice: ज़ोर-ज़ोर से फूँकती है
  rationale: क्रिया मूलतः ज़ोर से साँस लेने, हाँफने या फुँफकारने का भाव देती है। धौंकनी के साथ यह तीव्रता से हवा फूँकने का स्वाभाविक चित्र प्रस्तुत करती है; पुनरुक्ति उस तीव्रता को सहज हिन्दी में व्यक्त करती है।
- source_word: מַפֻּחַ
  choice: धौंकनी
  rationale: यह धातु गलाने की आग तेज़ करने वाले उपकरण का सामान्य और स्पष्ट हिन्दी नाम है।
- source_word: מֵאִשְׁתָּם
  choice: आग में
  rationale: इब्रानी रूप कठिन है और आग के साथ संबंध की ठीक प्रकृति अनिश्चित है। मुख्य पाठ में 'आग में' प्रसंग का अर्थ सहज रूप से देता है, जबकि वैकल्पिक समझ को पादटिप्पणी में रखा गया है।
- source_word: עֹפָרֶת
  choice: सीसा
  rationale: शब्द उस सीसे को दर्शाता है जिसका उपयोग धातु-शोधन की प्रक्रिया में होता था।
- source_word: לַשָּׁוְא
  choice: व्यर्थ ही
  rationale: यह शोधन के प्रयत्न की निष्फलता बताता है और भविष्यद्वाणी के गंभीर स्वर को बनाए रखता है।
- source_word: צָרַף ... צָרוֹף
  choice: शोधक ... बार-बार शोधन करता है
  rationale: एक ही मूल की पुनरावृत्ति क्रिया की तीव्रता अथवा निरंतरता दिखाती है। 'बार-बार' यह बल स्पष्ट करता है; कर्ता 'शोधक' धातु-शोधन के प्रसंग से स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: וְרָעִים
  choice: दुष्ट
  rationale: विशेषण सामान्यतः बुरे या दुष्ट लोगों के लिए प्रयुक्त होता है। इससे धातु-शोधन का रूपक और लोगों के नैतिक भ्रष्टाचार पर उसका संकेत, दोनों बने रहते हैं।
- source_word: נִתָּקוּ
  choice: अलग नहीं किए जाते
  rationale: यहाँ अपेक्षित परिणाम बुरे तत्वों अथवा दुष्ट लोगों को निकालकर अलग करना है। यह अनुवाद रूपक और उसके मानवीय संदर्भ दोनों के अनुकूल है।
theological_decisions:
- issue: असफल शोधन के रूपक का अर्थ
  choice: शाब्दिक धातु-शोधन का चित्र बनाए रखते हुए 'दुष्ट' शब्द द्वारा यह दिखाया गया है कि शुद्ध करने के निरंतर प्रयत्न के बाद भी दुष्ट लोग अलग नहीं होते।
  alternative: पद को केवल धातु गलाने की असफल प्रक्रिया के रूप में पढ़ना, जिसमें 'बुरे तत्व' अशुद्धियाँ हों।
  rationale: निकटवर्ती संदर्भ में यिर्मयाह लोगों को जाँचने और शुद्ध करने के लिए धातु-शोधन की भाषा प्रयोग करता है। फिर भी अनुवाद रूपक को खोलकर व्याख्या नहीं बनाता, बल्कि शाब्दिक चित्र और नैतिक संकेत दोनों को साथ रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप रखा गया है। 'धौंकनी', 'सीसा', 'शोधक' और 'शोधन' धातुकर्म के चित्र को स्पष्ट रखते हैं; 'व्यर्थ ही' और 'दुष्ट' भविष्यद्वाणी के नैतिक और गंभीर स्वर को बनाए रखते हैं।
