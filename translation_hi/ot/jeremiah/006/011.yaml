id: JER.6.11
reference: Jeremiah 6:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אֵת֩ חֲמַ֨ת יְהוָ֤ה מָלֵ֨אתִי֙ נִלְאֵ֣יתִי הָכִ֔יל שְׁפֹ֤ךְ עַל עוֹלָל֙ בַּ/ח֔וּץ וְ/עַ֛ל ס֥וֹד בַּחוּרִ֖ים יַחְדָּ֑ו כִּֽי גַם אִ֤ישׁ עִם אִשָּׁה֙ יִלָּכֵ֔דוּ זָקֵ֖ן עִם מְלֵ֥א יָמִֽים׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/011.yaml
  text: But I am full of the wrath of Yahweh[a]; I am weary of holding it in. Pour it out on the child in the street, and on the company of young men together; for both man and woman will be taken[b], the old man along with the very aged.
translation:
  language: hi
  text: परन्तु मैं याहवे के कोप से भर गया हूँ[a]; उसे रोके रखते-रखते मैं थक गया हूँ। उसे सड़क पर बच्चे पर और युवकों की इकट्ठी टोली पर उंडेल दे; क्योंकि पुरुष और स्त्री दोनों पकड़े जाएँगे, वृद्ध के साथ अति वृद्ध[b] भी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे के प्रचंड क्रोध से।”
    reason: חֵמָה के तीव्र क्रोध या प्रकोप वाले अर्थ का वैकल्पिक रूप।
  - marker: b
    text: शाब्दिक अर्थ, “दिनों से भरा हुआ”; यह बहुत अधिक आयु वाले व्यक्ति के लिए इब्रानी मुहावरा है।
    reason: मूल मुहावरे का शाब्दिक रूप और अर्थ स्पष्ट करना।
lexical_decisions:
- source_word: חֲמַת יְהוָה
  choice: याहवे का कोप
  rationale: חֵמָה तीव्र, दहकते क्रोध को व्यक्त करता है; ‘कोप’ भविष्यद्वाणी के न्याय-संदर्भ में इसकी गंभीरता और तीव्रता बनाए रखता है। परमेश्वर के निज नाम יְהוָה को ‘याहवे’ लिखा गया है।
- source_word: מָלֵאתִי
  choice: मैं ... से भर गया हूँ
  rationale: पूर्ण क्रिया वक्ता की वर्तमान परिणामी दशा बताती है; यह हिन्दी में स्वाभाविक रूप से उस पर छाए दिव्य कोप को व्यक्त करता है।
- source_word: נִלְאֵיתִי הָכִיל
  choice: उसे रोके रखते-रखते मैं थक गया हूँ
  rationale: यह संयोजन उस कोप को और अधिक समेटे या रोके रखने से हुई थकान व्यक्त करता है। पुनरुक्त क्रिया-रचना आधुनिक हिन्दी में निरंतर प्रयास और थकावट दोनों को सहज रूप देती है।
- source_word: שְׁפֹךְ
  choice: उसे ... उंडेल दे
  rationale: आज्ञार्थक रूप को बनाए रखा गया है और प्रसंग से समझे जाने वाले कर्म—याहवे के कोप—को सर्वनाम ‘उसे’ से स्पष्ट किया गया है।
- source_word: עוֹלָל בַּחוּץ
  choice: गली में बच्चे पर
  rationale: עוֹלָל छोटे बच्चे को और חוּץ सार्वजनिक बाहरी स्थान या गली को दर्शाता है।
- source_word: סוֹד בַּחוּרִים יַחְדָּו
  choice: इकट्ठे हुए जवानों के समूह पर
  rationale: סוֹד यहाँ औपचारिक परिषद के बजाय साथ जमा हुए लोगों का घेरा या समूह है; יַחְדָּו का सामूहिक भाव ‘इकट्ठे हुए’ में सुरक्षित है।
- source_word: יִלָּכֵדוּ
  choice: पकड़े जाएँगे
  rationale: לכד का निफ़अल रूप पकड़े या अधिकार में लिए जाने का अर्थ देता है। ‘पकड़े जाएँगे’ व्यापक न्याय-संदर्भ को बनाए रखता है और इसे केवल सैनिक बंदीकरण तक सीमित नहीं करता।
- source_word: אִישׁ עִם אִשָּׁה
  choice: पुरुष और स्त्री दोनों
  rationale: यह सामान्य जोड़ी दोनों लिंगों को सम्मिलित करती है और अनावश्यक रूप से पति-पत्नी का संबंध नहीं मानती।
- source_word: זָקֵן עִם מְלֵא יָמִים
  choice: वृद्ध के साथ अति वृद्ध भी
  rationale: זָקֵן आयु में वृद्ध व्यक्ति है, जबकि ‘दिनों से भरा’ उससे भी अधिक आयु वाले व्यक्ति के लिए मुहावरा है; हिन्दी पदबंध दोनों के बीच का क्रम बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का निज नाम सीधे आया है; उसका लिप्यंतरण इसे किसी उपाधि से बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: वक्ता और ‘उंडेल दे’ का आशय
  choice: वक्ता स्वयं को याहवे के कोप से भरा बताता है और फिर उसे उंडेलने की आज्ञार्थक पुकार करता है
  alternative: इसे याहवे की सीधी आज्ञा या भविष्यद्वक्ता के अपने निश्चय के रूप में पढ़ना
  rationale: इब्रानी वाक्य-क्रम संक्षिप्त है और वक्ता-परिवर्तन को खुलकर नहीं बताता। आज्ञार्थक ‘उंडेल दे’ को बनाए रखने से मूल का तनाव और अस्पष्टता सुरक्षित रहती है, बिना कर्ता को अतिरिक्त रूप से निश्चित किए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘कोप’ भविष्यद्वाणी के न्याय का गंभीर स्वर देता है, जबकि ‘रोके रखते-रखते’ और ‘इकट्ठे हुए जवानों के समूह’ जैसे पद अर्थ को स्वाभाविक हिन्दी में स्पष्ट करते हैं। सभी पाद-टिप्पणी चिह्न संबंधित मुख्य-पाठ पदों के साथ दिए गए हैं।
