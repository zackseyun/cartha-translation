id: JER.6.28
reference: Jeremiah 6:28
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כֻּלָּ/ם֙ סָרֵ֣י סֽוֹרְרִ֔ים הֹלְכֵ֥י רָכִ֖יל נְחֹ֣שֶׁת וּ/בַרְזֶ֑ל כֻּלָּ֥/ם מַשְׁחִיתִ֖ים הֵֽמָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/028.yaml
  text: All of them are the most stubborn rebels[a], going about as slanderers; they are bronze and iron[d][c][b]; all of them are corrupters.
translation:
  language: hi
  text: वे सब-के-सब घोर हठी विद्रोही हैं[a], चुगली करते फिरते हैं[b]। वे काँसा और लोहा हैं[c]; वे सब भ्रष्ट करनेवाले हैं[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “विद्रोहियों में सबसे बढ़कर”; इब्रानी पदबंध तीव्रतावाचक है और अधिक शाब्दिक रूप में “विद्रोहियों के विद्रोही” कहा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “बदनामी की बातें फैलाते फिरते हैं” अथवा “कानाफूसी करते फिरते हैं।”
    reason: lexical_alternative
  - marker: c
    text: “काँसा और लोहा” संभवतः रूपक है, जो उनके कठोर, अशुद्ध या निकृष्ट चरित्र को दर्शाता है।
    reason: cultural_note
  - marker: d
    text: या “नाश करनेवाले।” इब्रानी शब्द बरबाद करने या भ्रष्ट करनेवालों को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלָּם
  choice: वे सब-के-सब
  rationale: पद के आरम्भ में आए व्यापक और बलाघाती भाव को स्वाभाविक आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: סָרֵי סוֹרְרִים
  choice: घोर हठी विद्रोही
  rationale: इब्रानी पदबंध की तीव्रतावाचक शक्ति को व्यक्त करता है; शाब्दिक ‘विद्रोहियों के विद्रोही’ हिन्दी में अस्वाभाविक होता।
- source_word: הֹלְכֵי רָכִיל
  choice: चुगली करते फिरते हैं
  rationale: कृदन्तीय पदबंध आदतन घूम-घूमकर निंदात्मक बातें फैलाने को दर्शाता है; यह चयन सामान्य पाठक के लिए सहज है और अर्थ की सीमा को अनावश्यक रूप से संकीर्ण नहीं करता।
- source_word: נְחֹשֶׁת וּבַרְזֶל
  choice: काँसा और लोहा
  rationale: धातुओं के पारंपरिक अर्थ को बनाए रखता है और प्रसंग में निहित कठोरता अथवा निकृष्टता की रूपकात्मक संभावना को पाठ में खुला छोड़ता है।
- source_word: מַשְׁחִיתִים
  choice: भ्रष्ट करनेवाले
  rationale: हिफ़ील कृदन्त की सक्रिय, कारणवाचक शक्ति तथा नैतिक भ्रष्टता के प्रसंग को व्यक्त करता है; ‘नाश करनेवाले’ भी संभव है।
- source_word: הֵמָּה
  choice: वे ... हैं
  rationale: समापन में आए स्पष्ट और कुछ बलाघाती सर्वनाम को हिन्दी के स्वतंत्र वाक्य में बनाए रखता है।
