  text: הַ/נָּוָה֙ וְ/הַ/מְּעֻנָּגָ֔ה דָּמִ֖יתִי בַּת צִיּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/002.yaml
  text: I have likened daughter Zion to a lovely and delicate woman[a].
translation:
  language: hi
  text: मैंने बेटी सिय्योन की तुलना एक सुन्दर और सुकुमार स्त्री से की है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या सम्भवतः, “मैं बेटी सिय्योन को—उस सुन्दर और सुकुमार को—नष्ट कर दूँगा।” यहाँ प्रयुक्त इब्रानी क्रिया कठिन है; कुछ लोग इसे “तुलना की है” के बजाय विनाश के अर्थ में लेते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: הַנָּוָה
  choice: सुन्दर
  rationale: स्त्रीलिंग विशेषण यहाँ מְעֻנָּגָה के साथ मिलकर रूप-सौन्दर्य का वर्णन करता है। ‘सुन्दर’ सहज, आधुनिक और काव्यात्मक हिन्दी है।
- source_word: וְהַמְּעֻנָּגָה
  choice: और सुकुमार
  rationale: यह शब्द कोमलता, नज़ाकत या सुख-सुविधा में पले होने का भाव दे सकता है। ‘सुकुमार’ काव्यात्मक गरिमा और कोमलता को रखता है, पर ‘लाड़-पली’ जैसा नकारात्मक भाव अनिवार्य नहीं बनाता।
- source_word: דָּמִיתִי
  choice: मैंने ... के समान माना है
  rationale: דמה के सामान्य अर्थ ‘समान होना/ठहराना’ के आधार पर प्रथम पुरुष रूप को स्वाभाविक हिन्दी तुलना के रूप में व्यक्त किया गया है। क्रिया कठिन है; विनाश-संबंधी वैकल्पिक समझ पादटिप्पणी में सुरक्षित है।
- source_word: בַּת צִיּוֹן
  choice: सिय्योन की बेटी
  rationale: यह सिय्योन/यरूशलेम का स्त्री-रूप में प्रचलित भविष्यद्वाणीपरक मानवीकरण है। यह रूप हिन्दी में स्पष्ट रहते हुए मूल रचना को निकटता से दर्शाता है।
- source_word: implicit feminine referent
  choice: स्त्री
  rationale: दोनों विशेषण स्त्रीलिंग एकवचन हैं। स्वाभाविक हिन्दी तुलना के लिए ‘स्त्री’ जोड़ा गया है; इससे ‘कन्या’ की तरह आयु का अतिरिक्त संकेत नहीं आता।
theological_decisions:
- issue: पद के केंद्रीय बिंब और דָּמִיתִי का अर्थ
  choice: सिय्योन की बेटी की तुलना एक सुन्दर और सुकुमार स्त्री से की गई है।
  alternative: ‘मैं सिय्योन की बेटी को—उस सुन्दर और सुकुमार को—नष्ट कर दूँगा।’
  rationale: דמה का सामान्य अर्थ और स्त्रीलिंग वर्णनात्मक विशेषण तुलना वाले अर्थ का समर्थन करते हैं। फिर भी इब्रानी क्रिया की कठिनाई और उसके विनाश/मौन कराने संबंधी संभावित अर्थ को छिपाने के बजाय पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण काव्यात्मक शैली। ‘सुकुमार’ मूल की कोमलता और परिष्कृत नज़ाकत को रखता है। मुख्य पाठ तुलना को अपनाता है और वास्तविक पाठगत अस्पष्टता पादटिप्पणी में स्पष्ट करता है।
