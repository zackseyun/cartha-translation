source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִ֥י נֹתֵ֛ן אֶל הָ/עָ֥ם הַ/זֶּ֖ה מִכְשֹׁלִ֑ים וְ/כָ֣שְׁלוּ בָ֠/ם אָב֨וֹת וּ/בָנִ֥ים יַחְדָּ֛ו שָׁכֵ֥ן וְ/רֵע֖/וֹ יאבדו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/021.yaml
  text: 'Therefore[a], thus says Yahweh: Behold, I am setting stumbling blocks before this people, and they will stumble over them—fathers and sons together[b]; neighbor and his friend will perish.'
translation:
  language: hi
  text: 'इसलिए यहोवा यों कहता है: “देखो, मैं इस प्रजा के मार्ग में ठोकर खाने की बाधाएँ रख रहा हूँ[a], और वे उन पर ठोकर खाएँगे—पिता और पुत्र एक साथ[b]; पड़ोसी और उसका मित्र नाश हो जाएँगे।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं इस प्रजा के मार्ग में बाधाएँ रख रहा हूँ।”
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी में: “पिता और पुत्र एक साथ; पड़ोसी और उसका मित्र।” यह पारिवारिक और सामाजिक संबंधों के सभी स्तरों पर आने वाले न्याय पर बल देता है।'
    reason: cultural_note
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पूर्ववर्ती दोषारोपण से निकलने वाले परिणाम को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: כֹּה אָמַר יְהוָה
  choice: यहोवा यों कहता है
  rationale: भविष्यद्वक्ताओं का पारंपरिक संदेशवाहक-सूत्र सुरक्षित रहता है और יהוה को व्यक्तिगत नाम के रूप में प्रस्तुत किया गया है।
- source_word: הִנְנִי
  choice: देखो
  rationale: आने वाली दैवी कार्रवाई पर गंभीरतापूर्वक ध्यान खींचता है और आधुनिक हिन्दी में सहज है।
- source_word: נֹתֵן אֶל הָעָם הַזֶּה מִכְשֹׁלִים
  choice: मैं इस प्रजा के मार्ग में ठोकर के कारण रख रहा हूँ
  rationale: नֹתֵן की जारी अथवा आसन्न क्रिया और मार्ग में रखी बाधाओं की मूर्त छवि दोनों व्यक्त होती हैं; אֶל की स्थानगत दिशा को प्रसंगानुकूल रूप दिया गया है।
- source_word: וְכָשְׁלוּ בָם
  choice: वे उनसे ठोकर खाएँगे
  rationale: מִכְשֹׁלִים और כשל के बीच का शब्द-संबंध हिन्दी में भी बनाए रखता है।
- source_word: אָבוֹת וּבָנִים יַחְדָּו
  choice: पिता और पुत्र एक साथ
  rationale: इब्रानी के स्पष्ट पुल्लिंग पारिवारिक युग्म और सामूहिक न्याय के बलाघात को सुरक्षित रखता है।
- source_word: שָׁכֵן וְרֵעוֹ
  choice: पड़ोसी और उसका मित्र
  rationale: निकट रहने वाले व्यक्ति और उसके सामाजिक साथी के दो संबंधित किंतु अलग शब्दों का भेद बनाए रखता है।
- source_word: יֹאבֵדוּ
  choice: नाश हो जाएँगे
  rationale: दैवी न्याय के गंभीर परिणाम को व्यक्त करता है, पर नाश के किसी विशेष साधन को अनावश्यक रूप से निर्धारित नहीं करता।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में उपाधि नहीं बल्कि चतुरक्षरीय व्यक्तिगत नाम है। हिन्दी के सामान्य बाइबलीय प्रयोग में पहचाने जाने योग्य रूप ‘यहोवा’ नाम की व्यक्तिगत प्रकृति को बनाए रखता है।
- issue: ठोकर के कारणों का कर्ता
  choice: यहोवा स्वयं उन्हें रख रहा है
  alternative: लोगों के मार्ग में केवल सामान्य बाधाएँ आती हैं
  rationale: הִנְנִי נֹתֵן में प्रथम पुरुष दैवी कर्ता स्पष्ट है; न्याय में परमेश्वर की सक्रिय भूमिका को नरम नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर भविष्यद्वाणीपरक शैली रखी गई है। ‘यों कहता है’ संदेशवाहक-सूत्र की गरिमा बनाए रखता है, जबकि ‘देखो’ और शेष वाक्य सामान्य पाठक के लिए स्पष्ट हैं।
