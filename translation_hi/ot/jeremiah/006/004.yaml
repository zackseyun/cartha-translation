  choice: युद्ध को पवित्र ठहराओ
  alternative: उसके विरुद्ध युद्ध की तैयारी करो
  rationale: स्पष्ट पवित्रीकरण-भाषा मूल पाठ के धार्मिक युद्ध-बिंब को बचाती है, पर यह अपने आप यह दावा नहीं करती कि परमेश्वर उस युद्ध को अनुमोदित करता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और वाचिक रूप से प्रभावशाली हिन्दी। आक्रमणकारियों की तत्पर पुकार को विस्मयादिबोधक वाक्यों से रखा गया है; ‘चढ़ाई करें’ सैन्य प्रसंग में स्वाभाविक है और עלה के दिशात्मक बिंब को भी बनाए रखता है।
