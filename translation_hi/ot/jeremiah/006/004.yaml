base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/004.yaml
  text: Consecrate war against her; rise up[a], and let us go up at noon. Woe to us, for the day is turning away, for the shadows of evening are stretching out.
translation:
  language: hi
  text: “उसके विरुद्ध युद्ध को पवित्र ठहराओ![a] उठो, और हम दोपहर में चढ़ाई करें! हाय, हम पर विपत्ति है! दिन तो ढल रहा है, और साँझ की छायाएँ फैलती जा रही हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके विरुद्ध युद्ध की तैयारी करो!” इब्रानी में युद्ध के लिए पवित्र ठहराने की भाषा प्रयुक्त हुई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: קַדְּשׁוּ
  choice: पवित्र ठहराओ
  rationale: पिएल आज्ञार्थक का मूल पवित्रीकरण-संबंधी बिंब बनाए रखता है; युद्ध के प्रसंग में इसका आशय युद्ध की धार्मिक रीति से तैयारी करना भी हो सकता है।
- source_word: עָלֶיהָ
  choice: उसके विरुद्ध
  rationale: מִלְחָמָה के साथ עַל शत्रुतापूर्ण दिशा बताता है; स्त्रीलिंग प्रत्यय प्रसंग में नगर को सूचित करता है।
- source_word: מִלְחָמָה
  choice: युद्ध
  rationale: यह व्यापक सैन्य अर्थ को व्यक्त करता है और पवित्र ठहराने की भाषा के साथ मूल पदबंध को सुरक्षित रखता है।
- source_word: קוּמוּ
  choice: उठो
  rationale: तत्काल सैन्य कार्रवाई के लिए दिया गया बलपूर्ण बहुवचन आदेश।
- source_word: וְנַעֲלֶה
  choice: हम ... चढ़ाई करें
  rationale: עלה के ‘ऊपर जाना’ बिंब और नगर के विरुद्ध सैन्य प्रस्थान—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בַצָּהֳרָיִם
  choice: दोपहर में
  rationale: צָהֳרַיִם का सीधा और सहज आधुनिक हिन्दी रूप।
- source_word: אוֹי לָנוּ
  choice: हाय हम पर
  rationale: विपत्ति और निराशा की गंभीर पुकार को भविष्यद्वाणी-संगत भाषा में रखता है।
- source_word: כִּי פָנָה הַיּוֹם
  choice: दिन तो ढल रहा है
  rationale: פנה के दिन के मुड़कर बीतने के रूपक को हिन्दी की स्वाभाविक ‘ढलना’ अभिव्यक्ति से व्यक्त करता है।
- source_word: יִנָּטוּ
  choice: फैलती जा रही हैं
  rationale: निफ़ाल रूप यहाँ साँझ की छायाओं के बढ़कर दूर तक फैलने का चित्र देता है।
- source_word: צִלְלֵי עָרֶב
  choice: साँझ की छायाएँ
  rationale: सम्बन्धवाचक इब्रानी पदबंध का संक्षिप्त, काव्यात्मक और स्वाभाविक हिन्दी रूप।
theological_decisions:
