base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/015.yaml
  text: Were they ashamed because they had done an abomination? No[a], they were not ashamed at all; they did not even know how to blush. Therefore they will fall among the fallen; at the time I punish them, they will stumble, says Yahweh.
translation:
  language: hi
  text: क्या वे घृणित काम करने के कारण लज्जित हुए? नहीं, वे तनिक भी लज्जित नहीं हुए; वे तो लज्जा से लाल होना भी नहीं जानते थे। इसलिए वे गिरने वालों के बीच गिरेंगे; जिस समय मैं उन्हें दण्ड दूँगा[a], उस समय वे ठोकर खाएँगे—याहवे कहते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जिस समय मैं उनकी सुधि लूँगा” या “उनकी ओर ध्यान दूँगा।” इब्रानी क्रिया का अर्थ किसी की सुधि लेना, उसकी ओर ध्यान देना, या उससे भेंट करना हो सकता है; यहाँ प्रसंग में इसका भाव दण्ड देने के लिए उन पर ध्यान देने का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֹבִישׁוּ
  choice: क्या वे ... लज्जित हुए?
  rationale: संदर्भ में इसे आलंकारिक प्रश्न के रूप में लेना सबसे स्वाभाविक है; अगला निषेध उसका उत्तर देता है।
- source_word: תוֹעֵבָה עָשׂוּ
  choice: घिनौना काम करने
  rationale: תוֹעֵבָה की प्रबल नैतिक और वाचा-संबंधी घृणा को आधुनिक, सहज हिन्दी में व्यक्त करता है।
- source_word: גַּם בּוֹשׁ לֹא יֵבֹשׁוּ
  choice: वे तनिक भी लज्जित नहीं हुए
  rationale: क्रिया की पुनरुक्ति से आए प्रबल निषेध को ‘तनिक भी’ द्वारा स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: גַּם הַכְלִים לֹא יָדָעוּ
  choice: वे तो लज्जा से लाल होना भी नहीं जानते थे
  rationale: समानांतर पंक्ति में लज्जा की अनुभूति अथवा उसके बाहरी चिह्न का बोध है; हिन्दी मुहावरा इस तीव्रता को स्पष्ट रखता है।
- source_word: יִפְּלוּ בַנֹּפְלִים
  choice: वे गिरनेवालों के बीच गिरेंगे
  rationale: ‘गिरना’ की इब्रानी शब्दावृत्ति और न्याय के अधीन अन्य लोगों में जा मिलने की छवि दोनों सुरक्षित हैं।
- source_word: בְּעֵת פְּקַדְתִּים
  choice: जिस समय मैं उनका दण्ड-विधान करूँगा
  rationale: פקד के व्यापक ‘ध्यान देने/भेंट करने’ अर्थ में यहाँ प्रसंगानुसार दण्डात्मक निरीक्षण निहित है; ‘दण्ड-विधान’ न्यायिक भाव को व्यक्त करता है।
- source_word: יִכָּשְׁלוּ
  choice: वे ठोकर खाकर गिर पड़ेंगे
  rationale: मूल ‘ठोकर खाना/लड़खड़ाना’ को रखा गया है और हिन्दी में उसके पतनकारी परिणाम को स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: אָמַר יְהוָה
  choice: यह याहवे की वाणी है
  rationale: भविष्यद्वक्ताओं में प्रचलित दैवी उद्घोषणा-सूत्र को गरिमापूर्ण और स्वाभाविक हिन्दी में प्रस्तुत करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल के व्यक्तिगत ईश्वरीय नाम को उपाधि में बदले बिना निकट देवनागरी लिप्यंतरण में सुरक्षित रखा गया है।
- issue: न्याय के प्रसंग में פקד का अर्थ
  choice: दण्ड-विधान करना
  alternative: भेंट करना / सुधि लेना
  rationale: आसपास की पंक्तियाँ गिरने और ठोकर खाने के न्याय की बात करती हैं, इसलिए दण्डात्मक भाव मुख्य पाठ में स्पष्ट किया गया है; व्यापक शाब्दिक संभावना पादटिप्पणी में रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण भविष्यद्वक्ताई लहजा रखा गया है। आलंकारिक प्रश्न, लज्जा की तीव्र पुनरुक्ति और ‘गिरने’ की काव्यात्मक शब्दावृत्ति को यथासंभव सुरक्षित रखा गया है।
