source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנֵּ֛ה עַ֥ם בָּ֖א מֵ/אֶ֣רֶץ צָפ֑וֹן וְ/ג֣וֹי גָּד֔וֹל יֵע֖וֹר מִ/יַּרְכְּתֵי אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/022.yaml
  text: 'Thus says Yahweh: Behold[a], a people is coming from the land of the north, and a great nation is stirred up from the farthest parts of the earth.'
translation:
  language: hi
  text: 'याहवे यों कहते हैं:


    “देखो, उत्तर के देश से एक लोग आ रहा है,


    और पृथ्वी के सुदूर छोरों से[a]


    एक बड़ा राष्ट्र उठ खड़ा किया जा रहा है।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “पृथ्वी के अंतिम छोरों से” या “देश के दूरस्थ भागों से” भी हो सकता है। हिब्रू अभिव्यक्ति दूर के सीमांत भागों को दर्शाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: याहवे यह कहते हैं
  rationale: यह भविष्यद्वाणी के संदेशवाहक-सूत्र को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है तथा יְהוָה को उपाधि से बदलने के बजाय उसके नाम ‘याहवे’ के रूप में रखता है।
- source_word: הִנֵּה
  choice: देखो
  rationale: यह श्रोता का ध्यान खींचने और आसन्न घटना को सजीव बनाने वाली हिब्रू अभिव्यक्ति का सहज आधुनिक हिन्दी रूप है।
- source_word: עַם
  choice: एक जन
  rationale: ‘जन’ किसी जनसमूह को सूचित करता है और अगले समानांतर पद में גּוֹי के लिए प्रयुक्त ‘राष्ट्र’ से शब्दगत भेद बनाए रखता है; ‘जाति’ से आधुनिक हिन्दी में अनचाहा जाति-व्यवस्था संबंध उत्पन्न हो सकता है।
- source_word: בָּא
  choice: आ रहा है
  rationale: हिब्रू कृदंत का वर्तमान और आसन्न भाव हिन्दी के अपूर्ण वर्तमान में स्वाभाविक रूप से व्यक्त होता है।
- source_word: מֵאֶרֶץ צָפוֹן
  choice: उत्तर देश से
  rationale: यह दिशा के साथ उस उत्तरी भूभाग का भाव भी सुरक्षित रखता है जहाँ से आक्रमणकारी आता है।
- source_word: וְגוֹי גָּדוֹל
  choice: और एक विशाल राष्ट्र
  rationale: ‘राष्ट्र’ גּוֹי के राजनीतिक-सामूहिक भाव को व्यक्त करता और עַם के अनुवाद ‘जन’ से भेद बनाए रखता है; ‘विशाल’ आकार और सामर्थ्य की व्यापकता को अनावश्यक रूप से केवल सैन्य शक्ति तक सीमित नहीं करता।
- source_word: יֵעוֹר
  choice: उठ खड़ा हो रहा है
  rationale: निफ़ाल रूप यहाँ सक्रिय होने या कार्रवाई के लिए जाग उठने का भाव देता है। यह हिन्दी में स्वाभाविक है और किसी अनिर्दिष्ट बाहरी कर्ता को जोड़ने से बचता है।
- source_word: מִיַּרְכְּתֵי אָרֶץ
  choice: पृथ्वी के सुदूर छोरों से
  rationale: यह अभिव्यक्ति दूरस्थ सीमांत भागों या अंतिम छोरों का बिंब बनाए रखती है; אֶרֶץ का ‘देश/भूमि’ अर्थ भी संदर्भतः संभव है, इसलिए विकल्प पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: יֵעוֹר में कर्तृवाच्य अथवा कर्मवाच्य/आत्मवाच्य भाव
  choice: उठ खड़ा हो रहा है
  alternative: उकसाया जा रहा है; जगाया जाएगा
  rationale: निफ़ाल रूप जागृत या सक्रिय किए जाने का भाव दे सकता है, पर कर्ता नहीं बताया गया। चुना हुआ रूप राष्ट्र के सक्रिय होने को व्यक्त करता है और बाहरी प्रेरक की पहचान तय नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और मौखिक पाठ के अनुकूल हिन्दी अपनाई गई है। काव्यात्मक समानांतरता के लिए पंक्ति-विन्यास रखा गया है। ‘जन’ कुछ साहित्यिक है, पर עַם और גּוֹי के बीच का भेद बनाए रखते हुए ‘जाति’ के आधुनिक सामाजिक अर्थ से बचाता है।
