source:
  edition: WLC
  text: וַֽ/יְרַפְּא֞וּ אֶת שֶׁ֤בֶר עַמִּ/י֙ עַל נְקַלָּ֔ה לֵ/אמֹ֖ר שָׁל֣וֹם שָׁל֑וֹם וְ/אֵ֖ין שָׁלֽוֹם־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/014.yaml
  text: They have healed the wound of my people lightly[a], saying, ‘Peace, peace,’ when there is no peace.
translation:
  language: hi
  text: उन्होंने मेरी प्रजा के घाव का ऊपरी उपचार किया है[a], यह कहते हुए, “शान्ति है, शान्ति है,” जबकि शान्ति है ही नहीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्होंने मेरी प्रजा की टूटन को मामूली समझकर उसका उपचार किया है।”
    reason: עַל נְקַלָּה में सतही उपचार और गंभीर दशा को तुच्छ समझने—दोनों का भाव संभव है; שֶׁבֶר का अर्थ ‘टूटन’ भी हो सकता है।
lexical_decisions:
- source_word: וַיְרַפְּאוּ
  choice: उपचार किया है
  rationale: 'רפא का मूल अर्थ चंगा करना है, पर यहाँ आरोप विडंबनापूर्ण है: वास्तविक चंगाई नहीं हुई। ‘उपचार किया है’ चिकित्सकीय रूपक बनाए रखते हुए कथित उपाय को व्यक्त करता है।'
- source_word: שֶׁבֶר
  choice: घाव
  rationale: यह शब्द टूटन, चोट या गंभीर क्षति को दर्शा सकता है। ‘घाव’ उपचार के रूपक के साथ स्वाभाविक है और प्रजा की गंभीर दशा बताता है।
- source_word: עַמִּי
  choice: मेरी प्रजा
  rationale: सीधा संबंधसूचक अनुवाद; परमेश्वर द्वारा इस्राएल को अपनी प्रजा कहने की वाचागत और भविष्यद्वक्तात्मक शक्ति सुरक्षित रहती है।
- source_word: עַל נְקַלָּה
  choice: ऊपरी
  rationale: यह पद गंभीर समस्या को हल्का मानने या सतही ढंग से निपटाने का भाव देता है। ‘ऊपरी उपचार’ आधुनिक हिन्दी में अधूरे और सतही इलाज का स्पष्ट बोध कराता है; वैकल्पिक अधिक शाब्दिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: לֵאמֹר
  choice: कहते हैं
  rationale: उद्धृत वचन का स्वाभाविक हिन्दी परिचय। हिब्रू के कालगत संदर्भ में आरोपित लोगों की लगातार घोषणा का भाव व्यक्त होता है।
- source_word: שָׁלוֹם שָׁלוֹם
  choice: शान्ति है, शान्ति है
  rationale: दोहराव सुरक्षित रखा गया है, क्योंकि वह झूठे आश्वासन की दृढ़ता दर्शाता है। ‘शान्ति’ सुरक्षा, कुशलता और समग्र कल्याण के व्यापक भाव को खुला रखती है।
- source_word: וְאֵין שָׁלוֹם
  choice: जबकि शान्ति है ही नहीं
  rationale: यह झूठी घोषणा और वास्तविक स्थिति के तीखे विरोध को स्वाभाविक हिन्दी में व्यक्त करता है। ‘ही नहीं’ मूल निषेध पर उचित बल देता है।
theological_decisions:
- issue: झूठे आश्वासन के विरुद्ध भविष्यद्वक्तात्मक आरोप
  choice: अगुवे या भविष्यद्वक्ता प्रजा की गंभीर दशा का केवल ऊपरी उपचार करके ऐसी शान्ति घोषित करते हैं जो वास्तव में नहीं है।
  alternative: ‘उन्होंने हल्के में मेरी प्रजा का घाव चंगा किया’ जैसा अधिक शाब्दिक अनुवाद वास्तविक चंगाई हो जाने का भ्रम दे सकता है।
  rationale: अनुवाद भविष्यद्वक्तात्मक विडंबना और नैतिक अभियोग को सुरक्षित रखता है, बिना यह तय किए कि दोषी व्यक्तियों का कथित उपाय किस विशिष्ट धार्मिक या राजनीतिक कार्यक्रम को दर्शाता था।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। ‘प्रजा’ भविष्यद्वक्तात्मक और वाचागत संदर्भ के अनुकूल है। ‘शान्ति है’ कथित आश्वासन को स्पष्ट करता है, और मूल का दोहराव ज्यों का त्यों रखा गया है।
