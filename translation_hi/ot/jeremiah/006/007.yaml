source:
  edition: WLC
  text: כְּ/הָקִ֥יר בור מֵימֶ֔י/הָ כֵּ֖ן הֵקֵ֣רָה רָעָתָ֑/הּ חָמָ֣ס וָ֠/שֹׁד יִשָּׁ֨מַע בָּ֧/הּ עַל פָּנַ֛/י תָּמִ֖יד חֳלִ֥י וּ/מַכָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/007.yaml
  text: As a well keeps its waters fresh[a], so she keeps her evil fresh. Violence and destruction are heard in her[c][b]; before me continually are sickness and wounds.
translation:
  language: hi
  text: जैसे कुआँ अपने पानी को ताज़ा रखता है, वैसे ही वह अपनी बुराई को ताज़ा रखती है।[a] उसमें हिंसा और विनाश सुनाई देते हैं;[b] मेरे सामने निरन्तर बीमारी और घाव हैं।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जैसे जलकुंड अपने पानी को ठंडा रखता है, वैसे ही वह अपनी दुष्टता को ठंडा/ताज़ा रखती है।” यहाँ प्रयुक्त हिब्रू क्रिया कठिन है; कुछ लोग इस चित्र को कुएँ या जलकुंड द्वारा लगातार पानी निकालने या सँभालकर रखने के अर्थ में समझते हैं।
    reason: lexical_alternative
  - marker: b
    text: “हिंसा और विनाश” का अनुवाद “हिंसा और तबाही” या “हिंसा और लूट-पाट” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “मेरे मुख के सामने निरन्तर बीमारी और घाव हैं।” यह नगर की वास्तविक दशा या उसकी नैतिक और सामाजिक हालत का रूपक हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּהָקִיר ... הֵקֵרָה
  choice: ताज़ा बनाए रखता है ... ताज़ा बनाए रखती है
  rationale: दोनों कठिन हिब्रू क्रिया-रूपों को एक ही हिन्दी अभिव्यक्ति से अनूदित करके मूल उपमा और समानान्तरता को सुरक्षित रखा गया है। ‘ताज़ा बनाए रखना’ पानी की निरन्तर उपलब्धता और यरूशलेम में बुराई के लगातार बने रहने—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है; ‘ठंडा करना’ अधिक शाब्दिक सम्भावना है, पर यहाँ अस्पष्ट लगेगा।
- source_word: בּוֹר
  choice: कुआँ
  rationale: शब्द का अर्थ गड्ढा, हौज या जलकुंड भी हो सकता है, पर पानी के साथ इस उपमा में ‘कुआँ’ साधारण हिन्दी पाठक के लिए सबसे सहज चित्र प्रस्तुत करता है।
- source_word: מֵימֶיהָ
  choice: अपने पानी को
  rationale: हिब्रू में रूप व्याकरणतः बहुवचन है, किन्तु हिन्दी में ‘पानी’ द्रव्यवाचक एकवचन के रूप में अधिक स्वाभाविक है। स्त्रीलिंग प्रत्यय का सम्बन्ध कुएँ/जलकुंड से है और हिन्दी में आत्मवाचक ‘अपने’ से व्यक्त हुआ है।
- source_word: רָעָתָהּ
  choice: अपनी बुराई को
  rationale: सन्दर्भ में नैतिक दुष्टता अभिप्रेत है, जिसे आगे की हिंसा और विनाश स्पष्ट करते हैं। ‘बुराई’ व्यापक अर्थ बनाए रखता है।
- source_word: חָמָס וָשֹׁד
  choice: हिंसा और विनाश
  rationale: חָמָס सामाजिक क्रूरता और अत्याचार को तथा שֹׁד विनाश, तबाही या लूट को सूचित कर सकता है। मुख्य पाठ में व्यापक अर्थ वाले ‘हिंसा और विनाश’ रखे गए हैं।
- source_word: יִשָּׁמַע בָּהּ
  choice: उसके भीतर ... का शोर सुनाई देता है
  rationale: निष्क्रिय क्रिया शहर के भीतर निरन्तर सुनाई देने वाली बात बताती है। हिन्दी में अमूर्त संज्ञाओं ‘हिंसा और विनाश’ के साथ ‘का शोर’ जोड़ना श्रव्य बिम्ब को स्वाभाविक बनाता है।
- source_word: עַל־פָּנַי תָּמִיד
  choice: मेरे सामने निरन्तर
  rationale: ‘मेरे मुख के सामने’ का मुहावरेदार हिन्दी रूप ‘मेरे सामने’ है; ‘निरन्तर’ תָּמִיד की लगातार बने रहने वाली स्थिति को व्यक्त करता है।
- source_word: חֳלִי וּמַכָּה
  choice: बीमारी और घाव
  rationale: ठोस शारीरिक बिम्ब को बनाए रखा गया है और यह तय नहीं किया गया कि वह केवल वास्तविक दशा है या नगर की नैतिक-सामाजिक हालत का रूपक।
theological_decisions:
- issue: यरूशलेम का स्त्री के रूप में मानवीकरण
  choice: ‘वह’ और स्त्रीलिंग क्रिया ‘रखती है’ द्वारा मानवीकरण बनाए रखा गया
  alternative: नगर को निर्जीव मानकर ‘यह/वह ... रखता है’ कहना
  rationale: हिब्रू के स्त्रीलिंग प्रत्यय नगर को स्त्री के रूप में प्रस्तुत करते हैं। इसे बनाए रखने से नबी की व्यक्तिगत और वाचा-संबन्धी भाषा सुरक्षित रहती है, बिना कोई अतिरिक्त सिद्धान्त जोड़े।
- issue: ‘बीमारी और घाव’ का स्वरूप
  choice: ठोस शारीरिक शब्द रखते हुए रूपक की सम्भावना खुली रखी गई
  alternative: ‘कष्ट और मार’ जैसे अधिक अमूर्त शब्द
  rationale: मूल पाठ यह स्पष्ट नहीं करता कि ये पूरी तरह शाब्दिक हैं या नगर की भ्रष्ट दशा के रूपक। अनुवाद उस तनाव को हल नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और भविष्यद्वाणी-संगत स्वर रखा गया है। मूल की स्त्रीलिंग नगर-छवि, दोहराई गई क्रिया और बीमारी-घाव के ठोस बिम्ब को सुरक्षित रखा गया है। कठिन आरम्भिक क्रिया तथा שֹׁד के वैकल्पिक अर्थ पादटिप्पणियों में दिए गए हैं।
