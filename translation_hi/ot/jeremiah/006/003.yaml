  register: आधुनिक, गरिमापूर्ण और सहज मानक हिंदी। ‘चरवाहे—झुंड—चराएगा’ की रूपक-शृंखला सुरक्षित रखी गई है। अंतिम कठिन इब्रानी वाक्यांश को अत्यधिक स्पष्ट करके उसकी वास्तविक अस्पष्टता मिटाने के बजाय निकट रूप में रखा गया और पाद-टिप्पणी में संभावित अर्थ समझाया गया है।
