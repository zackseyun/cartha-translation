base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/003.yaml
  text: To her shepherds will come with their flocks[a]; they will pitch tents against her all around; each will pasture his own place.
translation:
  language: hi
  text: चरवाहे अपने झुंडों के साथ उसकी ओर आएँगे; वे उसके विरुद्ध चारों ओर तंबू गाड़ेंगे; हर एक अपने हिस्से को चराएगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “हर एक अपने हाथ को चराएगा।” यह कठिन मुहावरेदार अभिव्यक्ति संभवतः उस हिस्से या क्षेत्र को सूचित करती है जो हर एक को मिला है; संदर्भ में उसमें चराने अथवा उजाड़ने का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶיהָ
  choice: उसके पास
  rationale: אֶל का मूल दिशात्मक अर्थ ‘की ओर/के पास’ है। शत्रुतापूर्ण भाव को आगे עָלֶיהָ के अनुवाद ‘उसके विरुद्ध’ में स्पष्ट किया गया है।
- source_word: רֹעִים
  choice: चरवाहे
  rationale: यहाँ आक्रमणकारी शासकों या सेनानायकों का रूपक है; ‘झुंडों’ और ‘चराने’ के साथ चलने वाले चरवाही-बिंब को बनाए रखा गया है।
- source_word: וְעֶדְרֵיהֶם
  choice: अपने-अपने झुंडों के साथ
  rationale: וְ यहाँ स्वाभाविक रूप से साथ होने का भाव देता है। ‘अपने-अपने’ बहुवचन चरवाहों और उनके संबंधित झुंडों का वितरक संबंध स्पष्ट करता है।
- source_word: תָּקְעוּ ... אֹהָלִים
  choice: तंबू गाड़ेंगे
  rationale: तंबुओं के साथ תקע का प्रचलित अर्थ तंबू खड़ा करना या गाड़ना है; हिंदी में ‘तंबू गाड़ना’ स्वाभाविक और चित्रात्मक है।
- source_word: עָלֶיהָ ... סָבִיב
  choice: उसके विरुद्ध चारों ओर
  rationale: सैन्य घेराबंदी के संदर्भ में עַל का विरोधात्मक अर्थ है, जबकि סָבִיב नगर को चारों ओर से घेरने का भाव देता है।
- source_word: רָעוּ
  choice: चराएगा
  rationale: रूप चरवाही के बिंब को जारी रखता है। एकवचन हिंदी क्रिया वितरक אִישׁ ‘हर एक’ के अनुरूप है।
- source_word: אִישׁ אֶת־יָדוֹ
  choice: हर एक अपने हाथ की ओर
  rationale: असामान्य इब्रानी अभिव्यक्ति का ठोस बिंब और उसकी वास्तविक अस्पष्टता मुख्य पाठ में सुरक्षित रखी गई है; संभावित मुहावरेदार अर्थ पाद-टिप्पणी में दिया गया है।
