source:
  edition: WLC
  text: כִּ֣י כֹ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת כִּרְת֣וּ עֵצָ֔ה וְ/שִׁפְכ֥וּ עַל יְרוּשָׁלִַ֖ם סֹלְלָ֑ה הִ֚יא הָ/עִ֣יר הָפְקַ֔ד כֻּלָּ֖/הּ עֹ֥שֶׁק בְּ/קִרְבָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/006.yaml
  text: 'For thus says Yahweh of hosts: “Cut down trees[a], and heap up a siege ramp against Jerusalem. This is the city that must be punished[b]; there is nothing but oppression within her.”'
translation:
  language: hi
  text: 'क्योंकि सेनाओं का यहोवा यों कहता है:


    “पेड़ काटो


    और यरूशलेम के विरुद्ध घेराबंदी का ढालू बाँध बनाओ।[a]


    यही वह नगर है जिसे दंड दिया जाना है;[b]


    उसके भीतर केवल अत्याचार है।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शाब्दिक रूप से “घेराबंदी का बाँध उंडेलो” है—अर्थात मिट्टी आदि डालकर घेराबंदी का ढालू बाँध बनाओ।
    reason: lexical_alternative
  - marker: b
    text: या “यही वह नगर है जिसका लेखा लिया जाना है”; यहाँ लेखा लेने का अर्थ न्याय करके दंड देना है।
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का यहोवा
  rationale: परमेश्वर के वाचा-संबंधी नाम को ‘यहोवा’ के रूप में सुरक्षित रखता है और צְבָאוֹת के व्यापक सैन्य बिंब को स्वाभाविक, प्रचलित हिन्दी में व्यक्त करता है।
- source_word: כִּרְתוּ עֵצָה
  choice: पेड़ काटो
  rationale: यहाँ एकवचन संज्ञा सामूहिक अर्थ में है और घेराबंदी के लिए लकड़ी जुटाने का संकेत देती है; ‘पेड़ काटो’ सामान्य पाठक के लिए स्पष्ट है।
- source_word: וְשִׁפְכוּ ... סֹלְלָה
  choice: घेराबंदी का ढालू बाँध खड़ा करो
  rationale: शाब्दिक क्रिया ‘उंडेलो’ है, पर सैन्य प्रसंग में मिट्टी आदि डालकर नगर की दीवार तक पहुँचने वाला घेराबंदी-बाँध बनाने का भाव है।
- source_word: עַל יְרוּשָׁלִַם
  choice: यरूशलेम के विरुद्ध
  rationale: यहाँ עַל स्थान मात्र नहीं, बल्कि शत्रुतापूर्ण घेराबंदी की दिशा और लक्ष्य बताता है।
- source_word: הִיא הָעִיר
  choice: यही वह नगर है
  rationale: हिब्रू सर्वनाम के बलाघात को सहज हिन्दी में सामने लाता है।
- source_word: הָפְקַד
  choice: जिसे दंड दिया जाना है
  rationale: इस न्याय-संदर्भ में פקד का भाव दंडात्मक निरीक्षण अथवा लेखा लेने का है; मुख्य पाठ में न्यायिक परिणाम स्पष्ट किया गया है और मूल रूपक को पादटिप्पणी में रखा गया है।
- source_word: כֻּלָּהּ עֹשֶׁק בְּקִרְבָּהּ
  choice: उसके भीतर केवल अत्याचार है
  rationale: नगर के भीतर अत्याचार की सर्वव्यापकता को स्वाभाविक और बलपूर्ण हिन्दी में व्यक्त करता है तथा नगर के स्त्रीलिंग व्यक्तित्व को बनाए रखता है।
theological_decisions:
- issue: הָפְקַד में ईश्वरीय न्याय का स्वरूप
  choice: दंड दिया जाना है
  alternative: जिसका लेखा लिया जाना है / जिसका निरीक्षण किया जाना है
  rationale: भविष्यद्वाणी और घेराबंदी के प्रसंग में यह तटस्थ भेंट या निरीक्षण नहीं, न्याय के लिए उत्तरदायी ठहराया जाना है। फिर भी ‘लेखा लेने’ की मूल अर्थ-छाया पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए स्पष्ट रखी गई है। काव्यात्मक पंक्ति-विन्यास से आदेशों और नगर पर सुनाए गए न्याय का बल बना रहता है।
