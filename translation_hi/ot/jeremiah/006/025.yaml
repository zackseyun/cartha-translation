  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। हिब्रू का स्त्रीलिंग एकवचन संबोधन हिंदी के इस निषेधात्मक क्रियारूप में प्रत्यक्ष रूप से व्यक्त नहीं होता; अनावश्यक व्याख्यात्मक शब्द जोड़ने के बजाय संदर्भगत अस्पष्टता सुरक्षित रखी गई है। अर्धविराम मूल की दो संक्षिप्त खतरे-सूचक अभिव्यक्तियों को अलग रखता है।
