  verdict: revise
  source_fidelity: 'The draft accurately conveys the two prohibitions and the twofold danger: the enemy''s sword and terror all around. However, “मैदान में बाहर मत निकलना” is not idiomatic Hindi because “बाहर” and “में” create an awkward spatial combination. “खुले मैदान में मत जाना” naturally expresses the warning against entering the open field/countryside. The Hebrew feminine-singular forms are not overtly reproducible in this concise Hindi imperative without adding interpretation; leaving gender unmarked is appropriate.'
  naturalness: Apart from the opening phrase, the Hindi is clear, modern, and suitably grave. “रास्ते पर मत चलना,” “शत्रु की तलवार,” and “चारों ओर आतंक है” are natural and preserve the prophetic register.
  terminology: “शत्रु,” “तलवार,” and “आतंक” are accurate, nonsectarian renderings. “खुला मैदान” appropriately reflects שָׂדֶה in its exposed-field/open-country sense in this military setting.
  issues:
  - severity: medium
    issue: 'Awkward opening expression: “मैदान में बाहर मत निकलना।”'
    rationale: Hindi normally does not combine “बाहर निकलना” directly with “में” in this way. The wording can momentarily suggest coming out from within the field rather than avoiding travel into it.
  revised_text: खुले मैदान में मत जाना, और रास्ते पर मत चलना, क्योंकि शत्रु की तलवार है; चारों ओर आतंक है।
