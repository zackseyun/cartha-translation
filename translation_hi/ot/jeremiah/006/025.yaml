base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/025.yaml
  text: Do not go out into the field[a], and do not walk on the road[b], for the sword of the enemy and terror are on every side.
translation:
  language: hi
  text: खुले मैदान में मत जाना, और रास्ते पर मत चलना, क्योंकि शत्रु की तलवार है; चारों ओर आतंक है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל תצאי
  choice: बाहर मत निकलना
  rationale: निषेध के साथ स्त्रीलिंग एकवचन क्रिया है। हिंदी में ‘मत निकलना’ चेतावनी का स्वाभाविक रूप है और यरूशलेम/सिय्योन की पुत्री को संबोधन की व्याकरणिक विशेषता अलग लिंग-चिह्न लगाए बिना रहने देता है।
- source_word: הַשָּׂדֶה
  choice: मैदान
  rationale: שׂדה खेत, मैदान या खुला देहात सूचित कर सकता है। युद्ध के खतरे के संदर्भ में ‘मैदान’ खुली जगह का व्यापक और स्वाभाविक अर्थ देता है।
- source_word: וּבַדֶּרֶךְ אַל תלכי
  choice: और रास्ते पर मत चलना
  rationale: דרך के लिए ‘रास्ता’ और הלך के लिए ‘चलना’ मूल की क्रियात्मक विविधता तथा यात्रा-संदर्भ दोनों बनाए रखते हैं।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पहले दिए निषेधों का कारण प्रस्तुत करता है।
- source_word: חֶרֶב לְאֹיֵב
  choice: शत्रु की तलवार है
  rationale: לְאֹיֵב को संबंध/अधिकार के रूप में लेकर हिब्रू के संक्षिप्त नाममात्र वाक्य को निकटता से रखा गया है; इससे इसे ‘शत्रु के पास तलवार है’ या अगले पदबंध के साथ संयुक्त करने का अनावश्यक निर्णय नहीं थोपा जाता।
- source_word: מָגוֹר מִסָּבִיב
  choice: चारों ओर आतंक है
  rationale: मूल का यिर्मयाह में बार-बार आने वाला प्रभावशाली पदबंध स्वाभाविक आधुनिक हिंदी में सुरक्षित है।
theological_decisions: []
