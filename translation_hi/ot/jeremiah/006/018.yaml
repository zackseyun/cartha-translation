  text: לָ/כֵ֖ן שִׁמְע֣וּ הַ/גּוֹיִ֑ם וּ/דְעִ֥י עֵדָ֖ה אֶת אֲשֶׁר בָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/018.yaml
  text: Therefore hear[a], O nations, and know, O congregation[b], what is among them.
translation:
  language: hi
  text: इसलिए, हे जातियों, सुनो; और हे सभा[a], जान ले कि उनके बीच क्या है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘समुदाय’ अथवा ‘मंडली’। इब्रानी शब्द עֵדָה एक सामूहिक संज्ञा है और यहाँ उसका सटीक संदर्भ विवादित है।
    reason: lexical_alternative
  - marker: b
    text: या ‘कि उनमें क्या है’। इब्रानी अभिव्यक्ति संक्षिप्त है और उसका अर्थ उनके भीतर या उनके बीच पाई जाने वाली बात हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले अभियोग और आनेवाले न्याय से निकलने वाले परिणाम का संकेत देने वाला स्वाभाविक हिन्दी संयोजक है।
- source_word: שִׁמְעוּ
  choice: सुनो
  rationale: बहुवचन आज्ञार्थक रूप को बनाए रखता है और भविष्यद्वक्ताओं की ध्यानपूर्वक सुनने की पुकार व्यक्त करता है।
- source_word: הַגּוֹיִם
  choice: जातियो
  rationale: यहाँ संबोधित जनसमूहों या राष्ट्रों के लिए प्रचलित बाइबलीय हिन्दी है; ‘गैर-यहूदी’ कहना मूल से अधिक विशिष्ट होता।
- source_word: וּדְעִי
  choice: और ... जान ले
  rationale: इब्रानी का स्त्रीलिंग एकवचन आज्ञार्थक रूप अगले सामूहिक संज्ञा-संबोधन से मेल खाता है; एकवचन ‘जान ले’ उस व्याकरणिक रूप को सुरक्षित रखता है।
- source_word: עֵדָה
  choice: सभा
  rationale: यह सामूहिक संज्ञा है जिसका अर्थ सभा, समुदाय या मंडली हो सकता है। ‘सभा’ आधुनिक, स्वाभाविक और अपेक्षाकृत तटस्थ है।
- source_word: אֶת אֲשֶׁר בָּם
  choice: कि उनके बीच क्या है
  rationale: संक्षिप्त इब्रानी अभिव्यक्ति को बिना उसका आशय अधिक निश्चित किए स्वाभाविक हिन्दी में प्रस्तुत करता है; ‘उनमें क्या है’ भी संभव है।
theological_decisions:
- issue: עֵדָה का संदर्भ और वाक्य में उसका कार्य
  choice: इसे राष्ट्रों के साथ संबोधित एकवचन सामूहिक संज्ञा—‘हे सभा’—माना गया है।
  alternative: इसे ‘राष्ट्रों की सभा’ के रूप में राष्ट्रों का समानाधिकरण माना जा सकता है, या कठिन पाठ के कारण किसी संशोधित पाठ का अनुसरण किया जा सकता है।
  rationale: मसोरेटिक स्वरांकन में स्त्रीलिंग एकवचन आज्ञार्थक क्रिया के बाद एकवचन सामूहिक संज्ञा आती है। सीधे संबोधन का अनुवाद मूल रूप और उसकी आलंकारिक शक्ति को बनाए रखता है, बिना किसी अनुमानित पाठ-संशोधन के।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण भविष्यद्वक्ताई संबोधन। ‘हे जातियो’ और ‘हे सभा’ मूल के दो संबोधनों तथा बहुवचन/एकवचन भेद को बनाए रखते हैं। विरामचिह्न दोनों आज्ञाओं को स्पष्ट करते हैं।
