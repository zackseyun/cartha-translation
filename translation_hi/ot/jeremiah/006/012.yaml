source:
  edition: WLC
  text: וְ/נָסַ֤בּוּ בָֽתֵּי/הֶם֙ לַ/אֲחֵרִ֔ים שָׂד֥וֹת וְ/נָשִׁ֖ים יַחְדָּ֑ו כִּֽי אַטֶּ֧ה אֶת יָדִ֛/י עַל יֹשְׁבֵ֥י הָ/אָ֖רֶץ נְאֻם יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/012.yaml
  text: Their houses will be turned over to others[a], together with their fields and wives; for I will stretch out my hand against the inhabitants of the land[b], declares Yahweh.
translation:
  language: hi
  text: उनके घर, खेत और पत्नियाँ[c] सब एक साथ दूसरों के हो जाएँगे[a]; क्योंकि मैं इस देश के निवासियों के विरुद्ध अपना हाथ बढ़ाऊँगा[b]—याहवे की यह घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दूसरों के अधिकार में चले जाएँगे।”
    reason: इब्रानी क्रिया संपत्ति के दूसरे हाथों में चले जाने का निष्क्रिय, परिणामसूचक भाव व्यक्त करती है।
  - marker: b
    text: “देश” के स्थान पर “पृथ्वी” भी संभव है; इब्रानी הָאָרֶץ के दोनों अर्थ हो सकते हैं, पर यहाँ स्थानीय संदर्भ अधिक संभावित है।
    reason: मूल शब्द की वास्तविक भौगोलिक अस्पष्टता को सुरक्षित रखना।
  - marker: c
    text: या, “स्त्रियाँ।” इब्रानी נָשִׁים का अर्थ “पत्नियाँ” या “स्त्रियाँ” हो सकता है; घरों और खेतों के साथ हानि की इस सूची में “पत्नियाँ” अधिक संभावित है।
    reason: नָשִׁים की lexical ambiguity को सुरक्षित रखना।
lexical_decisions:
- source_word: וְנָסַבּוּ
  choice: सौंप दिए जाएँगे
  rationale: निफ़अल रूप यहाँ संपत्ति के दूसरे हाथों में चले जाने का परिणामसूचक निष्क्रिय भाव देता है; यह हिंदी में बेदखली का अर्थ स्वाभाविक रूप से व्यक्त करता है।
- source_word: בָתֵּיהֶם לַאֲחֵרִים
  choice: उनके घर दूसरों को
  rationale: शब्दशः अर्थ और संपत्ति छिनने का संदर्भ सुरक्षित रहता है; 'अजनबियों' से अनावश्यक अतिरिक्त अर्थ जुड़ता।
- source_word: שָׂדוֹת וְנָשִׁים יַחְדָּו
  choice: और उनके खेत और पत्नियाँ भी
  rationale: יַחְדָּו सूची में बताई गई सभी हानियों को एक साथ जोड़ता है। घरेलू और संपत्ति-संबंधी संदर्भ में נָשִׁים का संभावित अर्थ 'पत्नियाँ' चुना गया है।
- source_word: אַטֶּה אֶת־יָדִי עַל
  choice: के विरुद्ध अपना हाथ बढ़ाऊँगा
  rationale: यह न्यायपूर्ण और प्रतिकूल दैवी कार्रवाई का पारदर्शी इब्रानी मुहावरा है, जिसे हिंदी में भी बनाए रखा गया है।
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: इस देश के निवासियों
  rationale: यिर्मयाह के निकट संदर्भ में הָאָרֶץ का स्थानीय अर्थ, अर्थात यहूदा का देश, अधिक संभावित है; 'इस' से संदर्भगत स्थानीयता स्वाभाविक बनती है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: मानक भविष्यद्वाणी सूत्र की गंभीरता रखते हुए יהוה को उसके व्यक्तिगत वाचा-नाम 'याहवे' से प्रस्तुत किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है; 'याहवे' उसे किसी उपाधि से बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: הָאָרֶץ का भौगोलिक विस्तार
  choice: इस देश
  alternative: पृथ्वी
  rationale: तत्काल प्रसंग यहूदा और उसके निवासियों पर आने वाले न्याय का है, यद्यपि इब्रानी शब्द व्यापक अर्थ में 'पृथ्वी' भी हो सकता है।
- issue: נָשִׁים का संदर्भगत अर्थ
  choice: पत्नियाँ
  alternative: स्त्रियाँ
  rationale: घरों और खेतों के साथ घरेलू हानि की सूची में 'पत्नियाँ' अधिक संभावित है, पर मूल शब्द की व्यापक अर्थ-संभावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिंदी में गंभीर भविष्यद्वाणी-शैली रखी गई है। वाक्य सामान्य पाठकों के लिए सुबोध है, जबकि 'अपना हाथ बढ़ाऊँगा' जैसे मूल बिंब और 'याहवे की घोषणा' जैसा सूत्र सुरक्षित हैं।
