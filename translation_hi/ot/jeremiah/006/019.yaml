id: JER.6.19
reference: Jeremiah 6:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: שִׁמְעִ֣י הָ/אָ֔רֶץ הִנֵּ֨ה אָנֹכִ֜י מֵבִ֥יא רָעָ֛ה אֶל הָ/עָ֥ם הַ/זֶּ֖ה פְּרִ֣י מַחְשְׁבוֹתָ֑/ם כִּ֤י עַל דְּבָרַ/י֙ לֹ֣א הִקְשִׁ֔יבוּ וְ/תוֹרָתִ֖/י וַ/יִּמְאֲסוּ בָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/019.yaml
  text: 'Hear[a], O earth: behold, I am bringing disaster on this people, the fruit of their thoughts, because they have not listened to my words[b], and they have rejected my law.'
translation:
  language: hi
  text: हे पृथ्वी, सुन! देख, मैं इस प्रजा पर विपत्ति ला रहा हूँ—उनके विचारों का फल[a]—क्योंकि उन्होंने मेरे वचनों पर ध्यान नहीं दिया और मेरी व्यवस्था[b] को ठुकरा दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उनकी युक्तियों का फल’ अथवा ‘उनकी योजनाओं का परिणाम’।
    reason: lexical_alternative
  - marker: b
    text: या ‘मेरी शिक्षा’। इब्रानी तोराह का अर्थ ‘व्यवस्था’ या ‘शिक्षा’ हो सकता है; यहाँ वाचा से जुड़े आरोप का बल बनाए रखने के लिए ‘व्यवस्था’ चुना गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעִי הָאָרֶץ
  choice: हे पृथ्वी, सुन!
  rationale: स्त्रीलिंग एकवचन आज्ञार्थक क्रिया पृथ्वी को मानवीकृत साक्षी के रूप में संबोधित करती है। यह रूप भविष्यद्वाणी की गंभीर पुकार को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: הִנֵּה
  choice: देख
  rationale: यह गंभीर ईश्वरीय घोषणा की ओर ध्यान खींचता है। आधुनिक हिन्दी में ‘देख’ संक्षिप्त, स्पष्ट और प्रभावपूर्ण है।
- source_word: מֵבִיא רָעָה
  choice: विपत्ति ला रहा हूँ
  rationale: यहाँ רָעָה नैतिक बुराई नहीं, दण्डस्वरूप आने वाली विपत्ति है। ‘ला रहा हूँ’ इब्रानी कृदन्त की प्रगतिशीलता व्यक्त करता है।
- source_word: הָעָם הַזֶּה
  choice: इस प्रजा
  rationale: एकवचन सामूहिक संज्ञा और संकेतवाचक का स्वाभाविक हिन्दी रूप है; ‘प्रजा’ भविष्यद्वाणी के सामूहिक और औपचारिक स्वर के अनुकूल है।
- source_word: פְּרִי מַחְשְׁבוֹתָם
  choice: उनके विचारों का फल
  rationale: ‘फल’ कारण और परिणाम के मूल रूपक को सुरक्षित रखता है। ‘विचार’ योजनाओं या कुचक्रों से अधिक व्यापक और कम व्याख्यात्मक है।
- source_word: עַל דְּבָרַי לֹא הִקְשִׁיבוּ
  choice: उन्होंने मेरे वचनों पर ध्यान नहीं दिया
  rationale: הקשיב על ध्यानपूर्वक सुनने या ध्यान देने का भाव रखता है। यह अनुवाद अवज्ञा को निहित रहने देता है, पर उसे सीधे क्रिया में नहीं जोड़ता।
- source_word: וְתוֹרָתִי
  choice: मेरी व्यवस्था
  rationale: भविष्यद्वाणी के वाचागत संदर्भ में ‘व्यवस्था’ परमेश्वर की बाध्यकारी प्रकट शिक्षा का न्यायिक और वाचागत भार बनाए रखती है।
- source_word: וַיִּמְאֲסוּ בָהּ
  choice: को ठुकरा दिया
  rationale: क्रिया מאס तिरस्कारपूर्ण अस्वीकार को व्यक्त करती है। ‘ठुकरा दिया’ स्पष्ट, प्रबल और आधुनिक हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: वाचागत भविष्यद्वाणी के संदर्भ में תּוֹרָה का अनुवाद
  choice: मेरी व्यवस्था
  alternative: मेरी शिक्षा
  rationale: यह पद लोगों पर यह आरोप लगाता है कि उन्होंने यहोवा के प्रकट और बाध्यकारी मानक को अस्वीकार किया। ‘व्यवस्था’ आरोप का न्यायिक और वाचागत बल बनाए रखती है, जबकि ‘शिक्षा’ वैध व्यापक अर्थ के रूप में पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक पाठ में स्पष्ट है। ‘हे पृथ्वी, सुन!’ भविष्यद्वाणी की साक्षी-पुकार को बनाए रखता है; ‘विचारों का फल’ मूल रूपक को जानबूझकर सुरक्षित रखता है। पादटिप्पणी-चिह्न उन्हीं शब्दसमूहों पर लगाए गए हैं जिनसे उनके विकल्प संबंधित हैं।
