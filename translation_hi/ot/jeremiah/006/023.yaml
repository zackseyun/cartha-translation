  text: קֶ֣שֶׁת וְ/כִיד֞וֹן יַחֲזִ֗יקוּ אַכְזָרִ֥י הוּא֙ וְ/לֹ֣א יְרַחֵ֔מוּ קוֹלָ/ם֙ כַּ/יָּ֣ם יֶהֱמֶ֔ה וְ/עַל סוּסִ֖ים יִרְכָּ֑בוּ עָר֗וּךְ כְּ/אִישׁ֙ לַ/מִּלְחָמָ֔ה עָלַ֖יִ/ךְ בַּת צִיּֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/023.yaml
  text: They seize bow and javelin; they are cruel and show no mercy. Their sound roars like the sea[a], and they ride on horses, arrayed like a man for battle against you, daughter Zion.
translation:
  language: hi
  text: वे धनुष और बरछा थामते हैं; वे क्रूर हैं और दया नहीं करते। उनकी ध्वनि समुद्र के समान गरजती है। वे घोड़ों पर सवार होते हैं; हे सिय्योन की बेटी, वे तेरे विरुद्ध युद्ध के लिए एक पुरुष की तरह[a] पंक्तिबद्ध हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “युद्ध के लिए एक मन होकर पंक्तिबद्ध।” इब्रानी के एकवचन כְאִישׁ का अर्थ किसी पुरुष की तरह युद्ध के लिए तैयार होना, या एकजुट होकर—मानो एक ही व्यक्ति हों—पंक्तिबद्ध होना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: קֶשֶׁת
  choice: धनुष
  rationale: सैनिक वर्णन में यह एकवचन सामूहिक अथवा शस्त्रवाचक प्रयोग है; ‘धनुष’ हिन्दी में स्वाभाविक और सटीक है।
- source_word: כִידוֹן
  choice: बरछा
  rationale: यह भोंकने या फेंकने वाले शस्त्र को दर्शाता है। ‘बरछा’ इसके विशिष्ट सैनिक अर्थ को बनाए रखता है और सामान्य ‘भाला’ में नहीं मिलाता।
- source_word: יַחֲזִיקוּ
  choice: थामते हैं
  rationale: यहाँ हिफ़ील रूप शस्त्र हाथ में लेने या पकड़े रहने का भाव देता है। ‘थामते हैं’ मूल के निकट रहते हुए स्वाभाविक हिन्दी है।
- source_word: אַכְזָרִי הוּא
  choice: वे क्रूर हैं
  rationale: विशेषण और सर्वनाम व्याकरणतः एकवचन हैं, पर संदर्भ उस आक्रमणकारी जाति का सामूहिक रूप से वर्णन करता है जिसके लिए बहुवचन क्रियाएँ आई हैं; हिन्दी में ‘वे’ इस सामूहिक संदर्भ को स्पष्ट रखता है।
- source_word: וְלֹא יְרַחֵמוּ
  choice: और दया नहीं करते
  rationale: רחם का पिएल रूप दया या करुणा दिखाने का अर्थ देता है; यह युद्ध-संदर्भ में सीधा और प्रभावशाली अनुवाद है।
- source_word: קוֹלָם
  choice: उनकी आवाज़
  rationale: קוֹל का अर्थ आवाज़, ध्वनि या शोर हो सकता है। समुद्र की गर्जना से तुलना के कारण ‘आवाज़’ सेना के सामूहिक नाद को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: כַיָּם יֶהֱמֶה
  choice: समुद्र के समान गरजती है
  rationale: המה गूँजने, गरजने या प्रचंड ध्वनि करने का भाव देता है; समुद्र की उपमा के साथ ‘गरजती है’ सजीव और अर्थनिष्ठ है।
- source_word: וְעַל סוּסִים יִרְכָּבוּ
  choice: वे घोड़ों पर सवार होते हैं
  rationale: यह मूल पूर्वसर्गीय वाक्यांश और क्रिया का सीधा, आधुनिक हिन्दी रूप है।
- source_word: עָרוּךְ
  choice: पंक्तिबद्ध हैं
  rationale: सैनिक संदर्भ में ערוך युद्ध के लिए व्यवस्थित या मोर्चाबंद होने का भाव देता है; ‘पंक्तिबद्ध’ युद्ध-व्यवस्था की बारीकी बनाए रखता है।
- source_word: כְאִישׁ
  choice: एक पुरुष के समान
  rationale: मुख्य पाठ इब्रानी के एकवचन ‘पुरुष के समान’ को औपचारिक रूप से सुरक्षित रखता है। संदर्भ में इसका अर्थ एकजुट सेना की तरह होना भी संभव है, जिसे पादटिप्पणी में रखा गया है।
- source_word: לַמִּלְחָמָה
  choice: युद्ध के लिए
  rationale: यह तत्काल सैनिक संदर्भ में स्वाभाविक हिन्दी है और उद्देश्य का भाव स्पष्ट करता है।
- source_word: עָלַיִךְ בַּת צִיּוֹן
  choice: हे सिय्योन की बेटी, ... तेरे विरुद्ध
  rationale: यह प्रत्यक्ष संबोधन तथा नगर के स्त्रीरूप मानवीकरण को बनाए रखता है। हिन्दी वाक्य-प्रवाह के लिए संबोधन को खंड के आरंभ में रखा गया है।
theological_decisions:
- issue: בַּת צִיּוֹן में नगर का मानवीकरण
  choice: सिय्योन की बेटी
  alternative: बेटी सिय्योन
  rationale: यह सिय्योन/यरूशलेम का काव्यात्मक मानवीकरण है, कोई विशिष्ट सिद्धान्तगत उपाधि नहीं। ‘सिय्योन की बेटी’ आधुनिक हिन्दी में अधिक स्वाभाविक होते हुए प्रत्यक्ष संबोधन और भविष्यद्वाणी की छवि को सुरक्षित रखता है।
- issue: כְאִישׁ के एकवचन का आशय
  choice: एक पुरुष के समान
  alternative: एक मन होकर
  rationale: मूल पद सचमुच एकवचन है और किसी पुरुष अथवा योद्धा से तुलना कर सकता है, पर यह सेना की एकीकृत युद्ध-रचना पर भी बल दे सकता है। मुख्य पाठ औपचारिक रूप रखता है और वैकल्पिक सामूहिक अर्थ पादटिप्पणी में देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। सैन्य चित्रण के लिए ‘बरछा’ और ‘पंक्तिबद्ध’ जैसे सटीक शब्द चुने गए हैं। प्रत्यक्ष संबोधन में ‘हे’ और ‘तेरे’ काव्यात्मक भविष्यद्वाणी की गंभीरता बनाए रखते हैं।
