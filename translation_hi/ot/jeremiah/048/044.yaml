  text: ה/ניס מִ/פְּנֵ֤י הַ/פַּ֨חַד֙ יִפֹּ֣ל אֶל הַ/פַּ֔חַת וְ/הָֽ/עֹלֶה֙ מִן הַ/פַּ֔חַת יִלָּכֵ֖ד בַּ/פָּ֑ח כִּֽי אָבִ֨יא אֵלֶ֧י/הָ אֶל מוֹאָ֛ב שְׁנַ֥ת פְּקֻדָּתָ֖/ם נְאֻם יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/044.yaml
  text: He who flees from the terror will fall into the pit[a], and he who comes up from the pit will be caught in the snare; for I will bring upon her, upon Moab, the year of their punishment, declares Yahweh.
translation:
  language: hi
  text: जो दहशत से भागेगा, वह गड्ढे में गिरेगा; और जो गड्ढे से निकल आएगा, वह फंदे में फँस जाएगा। क्योंकि मैं उस पर—मोआब पर—उनके दण्ड का वर्ष[a] लाऊँगा—याहवे की यह घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनसे हिसाब लेने का वर्ष”; अथवा, “उनकी जांच का वर्ष।”
    reason: פְּקֻדָּה का अर्थ दण्ड के अतिरिक्त न्यायिक जांच, हिसाब लेना, अथवा व्यापक रूप से ‘भेंट/निरीक्षण’ हो सकता है। इस प्रसंग में दण्डात्मक अर्थ मुख्य है।
lexical_decisions:
- source_word: הניס
  choice: जो ... भागेगा
  rationale: कृदन्त यहाँ जातिवाचक संज्ञा की तरह प्रयुक्त है। यह रूप किसी भी भागने वाले व्यक्ति को सूचित करता है और नीतिवचन-जैसी शैली बनाए रखता है।
- source_word: הפחד
  choice: आतंक
  rationale: פַּחַד साधारण भय से अधिक प्रबल दहशत या आतंक व्यक्त करता है और आने वाले अनिवार्य न्याय के प्रसंग के अनुकूल है।
- source_word: הפחת
  choice: गड्ढा
  rationale: פַּחַת गड्ढे अथवा फँसाने वाले गड्ढे को दर्शाता है। संक्षिप्त 'गड्ढा' स्वाभाविक है और अगले 'फंदे' से भेद बनाए रखता है।
- source_word: והעלה מן הפחת
  choice: और जो गड्ढे से ऊपर निकलेगा
  rationale: עלה का मूल ऊपर आने/निकलने का भाव सुरक्षित रहता है; अनुवाद बच निकलने की ऐसी सफलता नहीं जोड़ता जिसे अगली पंक्ति तुरंत नकारती है।
- source_word: ילכד בפח
  choice: फंदे में फँस जाएगा
  rationale: פַּח किसी फंदे या जाल को दर्शाता है। 'फंदा' पहले के गड्ढे से अलग प्रकार के जाल को स्पष्ट करता है।
- source_word: כי אביא אליה אל מואב
  choice: क्योंकि मैं उस पर—मोआब पर—... लाऊँगा
  rationale: स्त्रीलिंग प्रत्यय को 'उस पर' से रखा गया है और 'मोआब पर' उसे व्याख्यात्मक समानाधिकरण के रूप में स्पष्ट करता है। न्याय लाने का मुहावरा हिन्दी में स्वाभाविक रखा गया है।
- source_word: שנת פקדתם
  choice: उनके दण्ड का वर्ष
  rationale: न्याय के संदर्भ में פְּקֻדָּה का दण्डात्मक अर्थ प्रमुख है। 'वर्ष' नियत समय को और बहुवचन प्रत्यय 'उनके' मूल रूप को सुरक्षित रखता है; व्यापक अर्थ फुटनोट में दिया गया है।
- source_word: נאם יהוה
  choice: यह याहवे की घोषणा है
  rationale: यह गम्भीर भविष्यद्वक्तीय सूत्र है। יְהוָה को उसके व्यक्तिगत वाचा-नाम 'याहवे' के रूप में लिप्यंतरित किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। 'याहवे' उसे उपाधि में बदले बिना व्यक्त करता है।
- issue: न्याय-वचन में פְּקֻדָּה का अर्थ
  choice: दण्ड
  alternative: लेखा लेने / सुधि लेने का समय
  rationale: मोआब पर आने वाली अपरिहार्य विपत्ति दण्डात्मक अर्थ को प्रमुख बनाती है, पर शब्द में निरीक्षण, सुधि लेने या लेखा लेने की व्यापकता हो सकती है; इसलिए वैकल्पिक अर्थ फुटनोट में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी की गरिमामय, सहज भविष्यद्वक्तीय शैली अपनाई गई है। आतंक–गड्ढा–फंदा की क्रमिक छवि, स्त्रीलिंग संदर्भ और मूल की समानाधिकरणात्मक पुनरुक्ति सुरक्षित रखी गई है।
