lexical_decisions:
- source_word: וּמִשְׁפָּט
  choice: और न्याय-दण्ड
  rationale: यहाँ מִשְׁפָּט केवल अमूर्त ‘न्याय’ नहीं, बल्कि मोआब पर लागू होने वाला न्यायिक दण्ड है। ‘न्याय-दण्ड’ कानूनी अर्थ और विनाश की घोषणा—दोनों को बनाए रखता है।
- source_word: בָּא
  choice: आ पहुँचा है
  rationale: पूर्ण क्रिया भविष्यद्वाणी में निश्चित रूप से घटने वाली बात को घटित मानकर प्रस्तुत कर सकती है। ‘आ पहुँचा है’ उसकी सजीव निश्चितता को बनाए रखता है।
- source_word: אֶל אֶרֶץ הַמִּישֹׁר
  choice: पठारी प्रदेश पर
  rationale: מִישֹׁר समतल ऊँचे भूभाग या पठार को दर्शाता है। ‘पठारी प्रदेश’ आधुनिक हिन्दी में स्वाभाविक है और मोआब की भौगोलिक स्थिति के अनुकूल भी। इस प्रसंग में אֶל को ‘पर’ कहना आने वाले दण्ड का लक्ष्य स्पष्ट करता है।
- source_word: חֹלֹון
  choice: होलोन
  rationale: यह स्थान-नाम है, इसलिए इसका अनुवाद न करके इब्रानी रूप के निकट लिप्यंतरण किया गया है।
- source_word: יַהְצָה
  choice: यहसा
  rationale: इस पद में आए इब्रानी रूप को निकटता से दर्शाने के लिए ‘यहसा’ रखा गया है; संक्षिप्त पारंपरिक रूप ‘यहस’ भी मिलता है।
- source_word: מופעת
  choice: मेपात
  rationale: यह मोआब के एक नगर का स्थान-नाम है; हिन्दी में सुबोध और प्रचलित बाइबलीय लिप्यंतरण ‘मेपात’ रखा गया है।
- source_word: וְעַל
  choice: और ... पर
  rationale: नगरों की सूची में עַל दण्ड के लक्ष्य को दर्शाता है। ‘पर’ की पुनरावृत्ति मूल की लय और क्रम को बनाए रखती है।
