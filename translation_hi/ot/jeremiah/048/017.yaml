id: JER.48.17
reference: Jeremiah 48:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: נֻ֤דוּ ל/וֹ֙ כָּל סְבִיבָ֔י/ו וְ/כֹ֖ל יֹדְעֵ֣י שְׁמ֑/וֹ אִמְר֗וּ אֵיכָ֤ה נִשְׁבַּר֙ מַטֵּה עֹ֔ז מַקֵּ֖ל תִּפְאָרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/017.yaml
  text: 'Mourn for him[a], all you around him, and all who know his name, say: “How the mighty scepter is broken[c][b], the staff of splendor!”'
translation:
  language: hi
  text: उसके लिए विलाप करो[a], तुम सब जो उसके चारों ओर हो; और तुम सब जो उसका नाम जानते हो[b], कहो, “कैसे टूट गया है वह सामर्थ्यशाली राजदंड, वह वैभवशाली छड़ी![c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उस पर शोक प्रकट करो” अथवा “उसके लिए सिर हिलाओ”; हिब्रू क्रिया शोक को, कभी किसी शारीरिक संकेत के साथ, व्यक्त कर सकती है।
    reason: lexical_alternative
  - marker: b
    text: “उसका नाम जानते हो” का अर्थ उसकी ख्याति या प्रतिष्ठा से परिचित होना भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: यहाँ अनूदित हिब्रू शब्दों के अर्थ “राजदंड,” “छड़ी” या “डंडा” हो सकते हैं; यह चित्र सम्भवतः मोआब की अब टूट चुकी शक्ति और प्रतिष्ठा को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נֻדוּ לּוֹ
  choice: उसके लिए विलाप करो
  rationale: नוד का यह आज्ञार्थक रूप सहानुभूतिपूर्ण शोक या विलाप को व्यक्त कर सकता है, कभी किसी शारीरिक संकेत के साथ। ‘विलाप करो’ प्रसंग की शोकगीतात्मक शैली को स्वाभाविक हिन्दी में व्यक्त करता है; पुल्लिंग ‘उसके’ से मोआब का मानवीकरण बना रहता है।
- source_word: כָּל סְבִיבָיו
  choice: तुम सब जो उसके चारों ओर हो
  rationale: यह आसपास रहने वाले लोगों या पड़ोसी जातियों को किया गया सीधा संबोधन है। यह अनुवाद सम्बोधन और स्थानगत अर्थ दोनों को सुरक्षित रखता है।
- source_word: וְכֹל יֹדְעֵי שְׁמוֹ
  choice: और तुम सब जो उसका नाम जानते हो
  rationale: शाब्दिक ‘उसका नाम जानते हो’ रखा गया है, क्योंकि שֵׁם नाम के साथ ख्याति या प्रतिष्ठा का संकेत भी दे सकता है; इस बहुअर्थकता को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: אֵיכָה נִשְׁבַּר
  choice: कैसे टूट गया है
  rationale: אֵיכָה शोकपूर्ण विस्मय प्रकट करता है और निफ़अल पूर्ण क्रिया टूटने की परिणामी दशा बताती है। ‘कैसे टूट गया है’ हिन्दी में उस विलापपूर्ण उद्गार को बनाए रखता है।
- source_word: מַטֵּה עֹז
  choice: सामर्थ्यशाली राजदंड
  rationale: מַטֶּה का अर्थ छड़ी, डंडा या राजदंड हो सकता है। मोआब की राष्ट्रीय शक्ति और शासन के पतन के प्रसंग में ‘राजदंड’ प्रतीकात्मक अर्थ को व्यक्त करता है, जबकि ‘सामर्थ्यशाली’ עֹז को स्वाभाविक विशेषण के रूप में प्रस्तुत करता है।
- source_word: מַקֵּל תִּפְאָרָה
  choice: वैभवशाली छड़ी
  rationale: מַקֵּל छड़ी या डंडा है और תִּפְאָרָה वैभव, शोभा या महिमा। ‘वैभवशाली छड़ी’ पहले पद के समानांतर रहते हुए दोनों हिब्रू शब्दों को पूरी तरह एक ही हिन्दी शब्द में नहीं मिलाता।
theological_decisions:
- issue: मोआब का व्याकरणिक और काव्यात्मक मानवीकरण
  choice: पुल्लिंग एकवचन ‘उसके/उसका’
  alternative: निर्जीव या स्थानवाचक ‘उसके लिए/उसका’ को अस्पष्ट करना अथवा ‘मोआब के लिए’ जोड़ना
  rationale: हिब्रू में पुल्लिंग एकवचन सर्वनाम मोआब को मानवीकृत करता है। अनुवाद उस काव्यात्मक रूप को बनाए रखता है और ऐसा कोई नाम नहीं जोड़ता जो इस पद में स्पष्टतः दोहराया नहीं गया।
- issue: राजदंड और छड़ी की प्रतीकात्मकता
  choice: शक्ति और वैभव की काव्यात्मक छवि को यथावत रखना
  alternative: इसे सीधे ‘मोआब की सत्ता और महिमा’ के रूप में व्याख्यायित करना
  rationale: मूल पाठ ठोस काव्यात्मक प्रतीकों का उपयोग करता है। उनका अर्थ सम्भवतः मोआब की शक्ति और प्रतिष्ठा है, पर मुख्य पाठ में प्रतीक को व्याख्यात्मक गद्य में बदलना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, शोकगीतात्मक काव्य-लय रखी गई है। ‘कैसे टूट गया है’ विलापपूर्ण विस्मय को व्यक्त करता है। ‘राजदंड’ और ‘छड़ी’ के द्वारा समानांतर बिंब तथा दोनों हिब्रू संज्ञाओं का हल्का भेद सुरक्षित है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
