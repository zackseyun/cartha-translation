  text: שַׁאֲנַ֨ן מוֹאָ֜ב מִ/נְּעוּרָ֗י/ו וְ/שֹׁקֵ֥ט הוּא֙ אֶל שְׁמָרָ֔י/ו וְ/לֹֽא הוּרַ֤ק מִ/כְּלִי֙ אֶל כֶּ֔לִי וּ/בַ/גּוֹלָ֖ה לֹ֣א הָלָ֑ךְ עַל כֵּ֗ן עָמַ֤ד טַעְמ/וֹ֙ בּ֔/וֹ וְ/רֵיח֖/וֹ לֹ֥א נָמָֽר־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/011.yaml
  text: Moab has been at ease from his youth[a], and he has been undisturbed on his dregs; he has not been poured from vessel to vessel, and he has not gone into exile. Therefore his taste has remained in him, and his scent has not changed.
translation:
  language: hi
  text: मोआब अपनी जवानी से ही निश्चिंत रहा है; वह अपनी तलछट पर शांत पड़ा है[a]। उसे एक पात्र से दूसरे पात्र में नहीं उंडेला गया, और वह निर्वासन में नहीं गया। इसलिए उसका स्वाद उसमें बना रहा, और उसकी गंध नहीं बदली।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यह दाखरस बनाने की छवि है: दाखरस को उसकी तलछट पर पड़ा रहने दिया गया है; उसे दूसरे पात्र में नहीं उंडेला गया।'
    reason: सांस्कृतिक रूपक को स्पष्ट करना
lexical_decisions:
- source_word: שַׁאֲנַן
  choice: निश्चिंत रहा है
  rationale: यह मोआब की लंबे समय से चली आ रही सुरक्षित और आरामदेह दशा को व्यक्त करता है, केवल मन की शांति को नहीं।
- source_word: מִנְּעוּרָיו
  choice: अपनी जवानी से
  rationale: हिब्रू के कालवाचक मुहावरे और मोआब के पुरुषवाचक एकवचन मानवीकरण को बनाए रखता है।
- source_word: שֹׁקֵט הוּא אֶל שְׁמָרָיו
  choice: वह अपनी तलछट पर बिना हिले पड़ा रहा है
  rationale: शांत और अबाध अवस्था को दाखरस की उस छवि से जोड़ता है जिसमें दाखरस तलछट पर पड़ा रहता है और दूसरे पात्र में नहीं उंडेला जाता।
- source_word: הוּרַק מִכְּלִי אֶל כֶּלִי
  choice: एक पात्र से दूसरे पात्र में नहीं उंडेला गया
  rationale: दाखरस को एक पात्र से दूसरे में डालने की ठोस छवि को स्वाभाविक आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: וּבַגּוֹלָה לֹא הָלָךְ
  choice: वह निर्वासन में नहीं गया
  rationale: निर्वासन या देश-निकाले का ऐतिहासिक अर्थ स्पष्ट करता है और हिब्रू के एकवचन मानवीकरण को बनाए रखता है।
- source_word: טַעְמוֹ
  choice: उसका स्वाद
  rationale: दाखरस के रूपक की स्वाद-संबंधी भाषा को सीधे बनाए रखता है।
- source_word: עָמַד ... בּוֹ
  choice: उसमें बना रहा
  rationale: इस मुहावरे का आशय किसी गुण का कायम रहना है; हिन्दी में यह सहज और स्पष्ट है।
- source_word: רֵיחוֹ
  choice: उसकी गंध
  rationale: दाखरस की गंध के लिए तटस्थ शब्द चुना गया है; ‘सुगंध’ अनावश्यक सकारात्मक भाव जोड़ सकता था।
- source_word: נָמָר
  choice: नहीं बदली
  rationale: क्रिया के बदलने या परिवर्तित होने के मूल अर्थ को सीधे व्यक्त करता है।
theological_decisions:
- issue: मोआब का पुरुषवाचक एकवचन मानवीकरण
  choice: ‘अपनी जवानी,’ ‘वह,’ ‘उसका स्वाद’ और ‘उसकी गंध’ के द्वारा पुरुषवाचक एकवचन बनाए रखा गया है।
  alternative: राष्ट्र के लिए निर्जीव एकवचन या बहुवचन भाषा का प्रयोग करना।
  rationale: हिब्रू पाठ मोआब को लगातार पुरुषवाचक एकवचन के रूप में प्रस्तुत करता है; इसे बनाए रखने से साहित्यिक मानवीकरण सुरक्षित रहता है और कोई अतिरिक्त व्याख्या नहीं जोड़ी जाती।
- issue: दाखरस और निर्वासन की संयुक्त छवि
  choice: दाखरस की तलछट और पात्रों का रूपक तथा निर्वासन का स्पष्ट कथन दोनों साथ बनाए रखे गए हैं।
  alternative: पूरे पद को केवल राजनीतिक निश्चिंतता के अर्थ में रूपांतरित कर रूपक को हटा देना।
  rationale: मूल पाठ मोआब की अबाध ऐतिहासिक दशा को दाखरस के रूपक से व्यक्त करता है; दोनों स्तरों को सुरक्षित रखना उसकी भविष्यद्वाणी की धार और अर्थगत तनाव बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। ‘पात्र,’ ‘निर्वासन’ और ‘तलछट’ जैसे शब्द भविष्यद्वाणी की शैली तथा दाखरस के रूपक को स्पष्ट रखते हैं; वाक्यरचना सामान्य पाठक के लिए सरल रखी गई है।
