- source_word: לְשַׁמָּה תִהְיֶינָה
  choice: उजाड़ हो जाएंगे
  rationale: परिणामस्वरूप विनाश और निर्जनता व्यक्त होती है। ‘उजाड़ हो जाएंगे’ साधारण पाठक के लिए स्वाभाविक है और भविष्यवाणी के न्याय-स्वर को बनाए रखता है।
- source_word: מֵאֵין יוֹשֵׁב בָּהֵן
