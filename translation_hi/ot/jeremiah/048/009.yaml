  yaml_path: translation/ot/jeremiah/048/009.yaml
  text: Give a wing to Moab[a], for she will surely flee away; and her cities will become a desolation[b], with no inhabitant in them.
translation:
  language: hi
  text: मोआब को पंख दे दो[a], क्योंकि वह निश्चय ही उड़ जाएगा[b]; उसके नगर उजाड़ हो जाएंगे, और उनमें कोई निवासी न रहेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मोआब को फूल/कलगी दे दो।” इब्रानी शब्द צִיץ का सामान्य अर्थ फूल या सजावटी वस्तु है; पर अगली पंक्ति में मोआब के चले जाने की बात होने के कारण यहाँ “पंख” संदर्भानुकूल प्रतीत होता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “वह निकलकर निकल जाएगा”; इब्रानी में यह बलयुक्त रचना है, जिसका अर्थ “वह निश्चय ही चला जाएगा” है। पंख की पिछली छवि के कारण मुख्य पाठ में “उड़ जाएगा” रखा गया है।
    reason: lexical_alternative
