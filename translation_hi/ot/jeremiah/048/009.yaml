- source_word: נָצֹא תֵּצֵא
  choice: वह निश्चय ही उड़ जाएगा
  rationale: क्रियार्थक संज्ञा और सीमित क्रिया की पुनरुक्ति क्रिया पर बल देती है। मूल क्रिया का सामान्य अर्थ ‘निकलना/चले जाना’ है, पर पूर्ववर्ती पंख की छवि के कारण ‘उड़ जाएगा’ काव्यात्मक संबंध बनाए रखता है। हिन्दी में ‘मोआब’ के अनुसार पुल्लिंग क्रिया रखी गई है।
- source_word: וְעָרֶיהָ
  choice: उसके नगर
