base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/041.yaml
  text: Kerioth has been captured[a], and the strongholds have been seized; and the heart of Moab’s warriors will be on that day like the heart of a woman in labor.
translation:
  language: hi
  text: करियोत[a] पर कब्ज़ा कर लिया गया है, और गढ़ भी जीत लिए गए हैं; उस दिन मोआब के वीर योद्धाओं का हृदय प्रसव-पीड़ा सहती स्त्री के हृदय के समान हो जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः, “नगरों पर कब्ज़ा कर लिया गया है,” यदि הַקְּרִיּוֹת को स्थान-नाम करियोत के बजाय जातिवाचक संज्ञा माना जाए।
    reason: alternative_reading
lexical_decisions:
- source_word: הַקְּרִיּוֹת
  choice: करिय्योत
  rationale: यिर्मयाह 48 में मोआब के विशिष्ट नगरों की सूची के संदर्भ में इसे मोआबी स्थान-नाम मानना अधिक उपयुक्त है; फिर भी जातिवाचक अर्थ की वास्तविक संभावना को पाद-टिप्पणी में रखा गया है।
- source_word: נִלְכְּדָה
  choice: पर कब्ज़ा कर लिया गया है
  rationale: לכד के निफ़अल रूप का निष्क्रिय सैन्य अर्थ व्यक्त करता है। पूर्ण हो चुकी विजय की भविष्यद्वाणी-संबंधी घोषणा को आधुनिक हिन्दी में स्वाभाविक ढंग से प्रस्तुत करता है।
- source_word: הַמְּצָדוֹת
  choice: गढ़ों
  rationale: यह शब्द किलेबंद और सुरक्षित स्थानों को दर्शाता है। ‘गढ़’ संक्षिप्त, वर्तमान और सैन्य संदर्भ में स्पष्ट है।
- source_word: נִתְפָּשָׂה
  choice: अपने वश में कर लिया गया है
  rationale: תפשׂ के निष्क्रिय रूप में पकड़ लेने अथवा अधिकार में लेने का भाव है। यह पहले क्रियापद से हल्का शब्दगत भेद रखते हुए समानांतर विजय-चित्र बनाए रखता है।
- source_word: לֵב
  choice: हृदय
  rationale: इब्रानी में यह आंतरिक अवस्था, साहस और मनोबल को सूचित कर सकता है। ‘हृदय’ मूल बिंब को सुरक्षित रखता है और उपमा उसका भाव स्पष्ट करती है।
- source_word: גִּבּוֹרֵי מוֹאָב
  choice: मोआब के वीर योद्धाओं
  rationale: सैन्य संदर्भ में גִּבּוֹרֵי शक्तिशाली लड़ाकों को दर्शाता है। ‘वीर योद्धा’ आधुनिक हिन्दी में स्पष्ट है और युद्ध-संबंधी अर्थ बनाए रखता है।
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: भविष्यद्वाणी साहित्य के मानक काल-सूचक पदबंध का स्वाभाविक हिन्दी रूप है।
- source_word: כְּלֵב אִשָּׁה מְצֵרָה
  choice: प्रसव-पीड़ा में पड़ी स्त्री के हृदय के समान
  rationale: यह प्रसव में पड़ी स्त्री की घोर व्याकुलता का बिंब है। अनुवाद भय और संकट को व्याख्यात्मक भावार्थ में बदलने के बजाय मूल उपमा को बनाए रखता है।
