source:
  edition: WLC
  text: וְ/נֶאֶסְפָ֨ה שִׂמְחָ֥ה וָ/גִ֛יל מִ/כַּרְמֶ֖ל וּ/מֵ/אֶ֣רֶץ מוֹאָ֑ב וְ/יַ֨יִן֙ מִ/יקָבִ֣ים הִשְׁבַּ֔תִּי לֹֽא יִדְרֹ֣ךְ הֵידָ֔ד הֵידָ֖ד לֹ֥א הֵידָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/033.yaml
  text: Joy and gladness have been gathered from the orchard land and from the land of Moab[a]; I have made wine cease from the winepresses. No one will tread with a shout[c][b]; the shout is no shout.
translation:
  language: hi
  text: उपजाऊ भूमि और मोआब देश से आनन्द और उल्लास समेट लिए गए हैं[a]; मैंने हौदों से दाखरस निकलना बन्द कर दिया है। कोई पुकार के साथ अंगूर नहीं रौंदेगा[b]; पुकार—वह पुकार नहीं है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “फलवन्त खेत।” यहाँ इब्रानी कर्मेल किसी स्थान का नाम नहीं, बल्कि उपजाऊ, खेती की गई भूमि को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: यह पुकार अंगूर रौंदते या फसल काटते समय लगाई जाने वाली उत्सव की पुकार है।
    reason: cultural_note
  - marker: c
    text: अन्तिम वाक्य इब्रानी में संक्षिप्त और अण्डाकार है; शाब्दिक रूप से, “पुकार, पुकार नहीं।” आशय यह है कि दाख की फसल के समय सुनाई देने वाली अपेक्षित आनन्दपूर्ण पुकार अब नहीं रही।
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶאֶסְפָה
  choice: समेट लिए गए हैं
  rationale: निफ़अल रूप में ‘इकट्ठा किए जाने’ और ‘हटा लिए जाने’ दोनों का भाव सम्भव है। ‘समेट लिए गए’ मूल रूपक को बनाए रखते हुए प्रसंग में आनन्द के लुप्त हो जाने का अर्थ देता है।
- source_word: שִׂמְחָה וָגִיל
  choice: आनन्द और उल्लास
  rationale: दो निकटार्थी उत्सवसूचक संज्ञाओं को अलग किंतु स्वाभाविक हिन्दी शब्दों से व्यक्त किया गया है।
- source_word: כַּרְמֶל
  choice: उपजाऊ भूमि
  rationale: यहाँ यह कर्मेल नामक स्थान नहीं, बल्कि उपजाऊ और जोती-बोई भूमि के लिए प्रयुक्त सामान्य संज्ञा है। ‘उपजाऊ भूमि’ अर्थ को स्पष्ट रखती है और केवल बगीचे तक सीमित नहीं करती।
- source_word: אֶרֶץ מוֹאָב
  choice: मोआब देश
  rationale: मूल में ‘देश/भूमि’ स्पष्ट रूप से है; इसे बनाए रखने से न्याय के भौगोलिक विस्तार का संकेत सुरक्षित रहता है।
- source_word: יַיִן מִיקָבִים הִשְׁבַּתִּי
  choice: मैंने कुण्डों से दाखरस निकलना बन्द कर दिया है
  rationale: हिफ़ईल रूप का कारणात्मक अर्थ ‘बन्द कर दिया’ से व्यक्त हुआ है। हिन्दी में ‘निकलना’ जोड़ने से कुण्डों से दाखरस के बन्द होने का आशय स्वाभाविक और स्पष्ट बनता है।
- source_word: יִדְרֹךְ
  choice: अंगूर नहीं रौंदेगा
  rationale: क्रिया का कर्म मूल में निहित है, पर दाखरस-कुण्ड के प्रसंग में अंगूर रौंदना अभिप्रेत है; हिन्दी में कर्म जोड़ने से बिना अर्थ बदले वाक्य स्पष्ट होता है।
- source_word: הֵידָד
  choice: जयकारा
  rationale: यह अंगूर रौंदने या कटनी के समय की ऊँची उत्सवी पुकार हो सकती है। ‘जयकारा’ उसके सामूहिक और उल्लासपूर्ण स्वर को संक्षेप में व्यक्त करता है।
- source_word: הֵידָד הֵידָד לֹא הֵידָד
  choice: जयकारा—वह जयकारा नहीं है
  rationale: यह संक्षिप्त, अलंकारिक और कुछ अस्पष्ट इब्रानी कथन है। हिन्दी रूप उसके विरोधाभासी तनाव को बनाए रखता है और उसे किसी एक विस्तृत व्याख्या में नहीं बदलता।
theological_decisions:
- issue: הִשְׁבַּתִּי में प्रथम पुरुष एकवचन वक्ता
  choice: ‘मैंने’ को बनाए रखा गया; प्रसंग में यह यहोवा की वाणी है।
  alternative: इसे किसी अनिर्दिष्ट कथावाचक या नबी की प्रथम-पुरुष वाणी मानना।
  rationale: आसपास का न्याय-संदेश इसे परमेश्वर की प्रत्यक्ष वाणी के रूप में प्रस्तुत करता है। फिर भी मुख्य पाठ केवल मूल का ‘मैंने’ रखता है और अतिरिक्त धर्मवैज्ञानिक पहचान नहीं जोड़ता।
- issue: अन्तिम ‘जयकारा नहीं’ का आशय
  choice: मूल की विरोधाभासी और अण्डाकार अभिव्यक्ति को बनाए रखा गया।
  alternative: स्पष्ट कर देना कि सुनाई देने वाली पुकार उत्सव की नहीं बल्कि युद्ध या विपत्ति की पुकार है।
  rationale: इब्रानी पाठ अपेक्षित आनन्दपूर्ण पुकार के मिटने का संकेत देता है, पर दूसरी पुकार का स्वरूप स्पष्ट नहीं करता; इसलिए मुख्य पाठ में उसे निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण भविष्यवाणी-संबंधी गद्य अपनाया गया है। कृषि-सांस्कृतिक शब्दों को सामान्य पाठक के लिए स्पष्ट रखा गया है, जबकि अन्तिम पंक्ति की मूल अलंकारिक अस्पष्टता को व्याख्या द्वारा समाप्त नहीं किया गया।
