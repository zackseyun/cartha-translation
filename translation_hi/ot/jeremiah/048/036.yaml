source:
  edition: WLC
  text: עַל כֵּ֞ן לִבִּ֤/י לְ/מוֹאָב֙ כַּ/חֲלִלִ֣ים יֶהֱמֶ֔ה וְ/לִבִּ/י֙ אֶל אַנְשֵׁ֣י קִֽיר חֶ֔רֶשׂ כַּ/חֲלִילִ֖ים יֶהֱמֶ֑ה עַל כֵּ֛ן יִתְרַ֥ת עָשָׂ֖ה אָבָֽדוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/036.yaml
  text: Therefore my heart moans for Moab like flutes, and my heart moans like flutes for the men of Kir-heres, because the abundance he made has perished.
translation:
  language: hi
  text: इसलिए मेरा हृदय मोआब के लिए बाँसुरियों के समान कराहता है; मेरा हृदय कीर-हेरेस के लोगों के लिए बाँसुरियों के समान कराहता है, क्योंकि उसने जो धन-दौलत बनाई थी, वह नष्ट हो गई है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֶהֱמֶה
  choice: कराहता है
  rationale: यह क्रिया गूँजने, विलाप करने या कराहने का भाव देती है; शोक के प्रसंग में ‘कराहता है’ स्वाभाविक और अर्थसंगत है।
- source_word: כַחֲלִלִים / כַחֲלִילִים
  choice: बाँसुरियों के समान
  rationale: חָלִיל बहुवचन में बाँसुरी अथवा शोक में बजाए जाने वाले वाद्यों को सूचित करता है; उपमा को ज्यों का त्यों रखा गया है।
- source_word: אַנְשֵׁי קִיר חֶרֶשׂ
  choice: कीर-हेरेस के लोग
  rationale: स्थान-नाम का लिप्यंतरण किया गया है और אַנְשֵׁי का समावेशी, सहज हिन्दी रूप ‘लोग’ चुना गया है।
- source_word: יִתְרַת עָשָׂה
  choice: उसने जो धन अर्जित किया था
  rationale: יִתְרָה शेष, अधिशेष या संचित संपत्ति का बोध करा सकता है; עָשָׂה का शाब्दिक अर्थ ‘उसने बनाया/किया’ है, पर धन के साथ हिन्दी में ‘अर्जित किया’ स्वाभाविक है। एकवचन क्रिया का संकेत ‘उसने’ में सुरक्षित रखा गया है।
- source_word: אָבָדוּ
  choice: नष्ट हो गया है
  rationale: हिब्रू में क्रिया बहुवचन है, जो संचित वस्तुओं/संपत्ति की सामूहिक बहुलता से मेल खाती है; हिन्दी में सामूहिक संज्ञा ‘धन’ के साथ एकवचन अभिव्यक्ति स्वाभाविक है।
theological_decisions:
- issue: वक्ता के ‘मेरे हृदय’ की पहचान
  choice: पहचान स्पष्ट किए बिना प्रथम पुरुष को बनाए रखा गया
  alternative: इसे स्पष्ट रूप से यिर्मयाह या यहोवा का हृदय कहना
  rationale: प्रसंग में वक्ता की पहचान पर व्याख्यात्मक संभावना है; मूल पाठ केवल ‘मेरा हृदय’ कहता है, इसलिए अनुवाद ने तनाव को नहीं सुलझाया।
- issue: עָשָׂה के एकवचन कर्ता का संदर्भ
  choice: ‘उसने’ रखा गया
  alternative: ‘उन्होंने’ अथवा ‘लोगों ने’
  rationale: मसोरेटी पाठ में क्रिया पुल्लिंग एकवचन है। इसका संदर्भ मोआब, कीर-हेरेस या सामूहिक व्यक्तिीकरण हो सकता है; अनुवाद मूल की व्याकरणिक अस्पष्टता को यथासंभव बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण पर सहज शैली। समानांतर काव्य-विन्यास और बाँसुरियों की दोहराई गई उपमा सुरक्षित रखी गई है।
