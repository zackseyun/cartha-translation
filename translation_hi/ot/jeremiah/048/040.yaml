source:
  edition: WLC
  text: כִּי כֹה֙ אָמַ֣ר יְהוָ֔ה הִנֵּ֥ה כַ/נֶּ֖שֶׁר יִדְאֶ֑ה וּ/פָרַ֥שׂ כְּנָפָ֖י/ו אֶל מוֹאָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/040.yaml
  text: 'For thus says the LORD: Look, like an eagle he swoops down and spreads his wings over Moab.'
translation:
  language: hi
  text: 'क्योंकि यहोवा यों कहता है:

    “देखो, वह उकाब के समान झपटेगा

    और मोआब के ऊपर अपने पंख फैलाएगा।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत दिव्य नाम को हिन्दी में प्रचलित और स्पष्ट रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: הִנֵּה
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला उद्गार है; ‘देखो’ आधुनिक और स्वाभाविक हिन्दी में इसकी शक्ति बनाए रखता है।
- source_word: כַנֶּשֶׁר
  choice: उकाब के समान
  rationale: נֶשֶׁר बड़े शिकारी पक्षी को सूचित करता है; ‘उकाब’ पारंपरिक हिन्दी बाइबलीय शब्दावली में उपयुक्त है, जबकि पक्षी की प्रजाति की संभावित व्यापकता को अनावश्यक रूप से नहीं खोला गया।
- source_word: יִדְאֶה
  choice: झपटेगा
  rationale: क्रिया उड़ते हुए तेजी से आने या झपटने का चित्र देती है; न्याय के संदर्भ में ‘झपटेगा’ स्वाभाविक और सजीव है।
- source_word: וּפָרַשׂ כְּנָפָיו אֶל־מוֹאָב
  choice: और मोआब के ऊपर अपने पंख फैलाएगा
  rationale: ‘के ऊपर’ आक्रमणकारी पक्षी द्वारा मोआब पर छा जाने के दृश्य को स्पष्ट करता है और स्रोत के אֶל संबंध को प्रसंगानुकूल व्यक्त करता है।
theological_decisions:
- issue: उकाब के रूपक में कर्ता की पहचान
  choice: पुरुषवाचक एकवचन ‘वह’ को अनिर्दिष्ट रखा गया
  alternative: इसे सीधे यहोवा या किसी नामित आक्रमणकारी के रूप में स्पष्ट करना
  rationale: इब्रानी पाठ कर्ता का नाम नहीं देता। इसलिए अनुवाद रूपक की वास्तविक अस्पष्टता बनाए रखता है और किसी विशेष ऐतिहासिक या धर्मवैज्ञानिक पहचान को नहीं थोपता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक पाठ के लिए सहज है। काव्यात्मक भविष्यवाणी को पंक्तिबद्ध रखा गया है; ‘यों कहता है’ भविष्यद्वाणी-सूत्र की औपचारिकता बनाए रखता है।
