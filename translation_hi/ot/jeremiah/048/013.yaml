base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/013.yaml
  text: And Moab will be put to shame because of Chemosh[a], just as the house of Israel was put to shame because of Bethel[b], their confidence.
translation:
  language: hi
  text: और मोआब कमोश के कारण लज्जित होगा[a], जैसे इस्राएल का घराना बेतेल के कारण लज्जित हुआ था, जिस पर उनका भरोसा था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कमोश से लज्जित होगा।” हिब्रू को अधिक शाब्दिक रूप में “कमोश से/के विषय में लज्जित” कहा जा सकता है; आशय यह है कि कमोश पर मोआब का भरोसा अंततः उसके अपमान का कारण बनेगा।
    reason: lexical_alternative
  - marker: b
    text: बेतेल उत्तरी इस्राएल का वह उपासना-केंद्र था जो बछड़े की पूजा से जुड़ा था। अधिक शाब्दिक अनुवाद है, “बेतेल से, जो उनका भरोसा था।”
    reason: cultural_note
lexical_decisions:
- source_word: וּבֹשׁ
  choice: लज्जित होगा
  rationale: בוש यहाँ भविष्य के न्याय के फलस्वरूप होने वाली लज्जा और सार्वजनिक अपमान को व्यक्त करता है; ‘लज्जित होगा’ स्वाभाविक हिन्दी में इस अर्थ को बनाए रखता है।
- source_word: מוֹאָב
  choice: मोआब
  rationale: राष्ट्र के नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: מִכְּמוֹשׁ
  choice: कमोश के कारण
  rationale: בוש के साथ מן उस व्यक्ति या वस्तु को सूचित कर सकता है जिसके कारण अथवा संबंध में लज्जा होती है। संदर्भ में कमोश पर मोआब का भरोसा अंततः उसके अपमान का कारण बनता है।
- source_word: כַּאֲשֶׁר
  choice: जैसे
  rationale: मोआब की भावी लज्जा की तुलना इस्राएल की पूर्व लज्जा से करता है।
- source_word: בֹּשׁוּ
  choice: लज्जित हुआ था
  rationale: पहले क्रियापद के समान अर्थ-क्षेत्र रखते हुए इस्राएल के घर को सामूहिक एकक मानकर स्वाभाविक हिन्दी रूप दिया गया है।
- source_word: בֵּית יִשְׂרָאֵל
  choice: इस्राएल का घर
  rationale: हिब्रू की सामूहिक राष्ट्रीय और वाचा-संबंधी अभिव्यक्ति को औपचारिक रूप से सुरक्षित रखा गया है।
- source_word: מִבֵּית אֵל
  choice: बेतेल के कारण
  rationale: यहाँ בֵּית־אֵל सामान्य पद ‘परमेश्वर का घर’ नहीं, उत्तरी इस्राएल के उपासना-केंद्र का स्थाननाम है; उसके कारण इस्राएल को लज्जा हुई।
- source_word: מִבְטָחָם
  choice: जिस पर उसे भरोसा था
  rationale: यह संज्ञा भरोसे के आधार या पात्र को बताती है। संबंधवाचक उपवाक्य हिन्दी में स्पष्ट करता है कि बेतेल इस्राएल के भरोसे का आधार था, बिना मूल आशय को बढ़ाए।
theological_decisions:
- issue: बेतेल का अभिप्राय
  choice: बेतेल को उस उत्तरी उपासना-केंद्र के स्थाननाम के रूप में रखा गया है जिस पर इस्राएल ने भरोसा किया था।
  alternative: इसे सामान्य संज्ञा ‘परमेश्वर का घर’ के रूप में अनूदित करना।
  rationale: समानांतरता मोआब के कमोश पर भरोसे और इस्राएल के बेतेल पर भरोसे के बीच है। ‘परमेश्वर का घर’ कहने से ऐतिहासिक और विवादात्मक संकेत धुँधला पड़ सकता है तथा सच्चे परमेश्वर पर भरोसे का भ्रामक अर्थ निकल सकता है।
- issue: מן के साथ בוש की अर्थगत अस्पष्टता
  choice: मुख्य पाठ में ‘के कारण लज्जित’ रखा गया है।
  alternative: ‘से लज्जित’ अथवा ‘के विषय में लज्जित’ कहना।
  rationale: हिब्रू रचना वस्तु/स्रोत और कारण के बीच कुछ अर्थगत खुलापन रखती है। मुख्य पाठ भरोसे की विफलता से उत्पन्न अपमान को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि वैकल्पिक अधिक शाब्दिक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और सामान्य पाठक के लिए बोधगम्य शैली अपनाई गई है। ‘लज्जित’ भविष्यवाणी के न्याय और सार्वजनिक अपमान दोनों के लिए उपयुक्त है। ‘इस्राएल का घर’ मूल की सामूहिक अभिव्यक्ति बनाए रखता है; ‘जिस पर उसे भरोसा था’ हिन्दी में मִבְטָחָם का स्वाभाविक स्पष्टीकरण है।
