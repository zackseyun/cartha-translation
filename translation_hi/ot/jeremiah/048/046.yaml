id: JER.48.46
reference: Jeremiah 48:46
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אוֹי לְ/ךָ֣ מוֹאָ֔ב אָבַ֖ד עַם כְּמ֑וֹשׁ כִּֽי לֻקְּח֤וּ בָנֶ֨י/ךָ֙ בַּ/שֶּׁ֔בִי וּ/בְנֹתֶ֖י/ךָ בַּ/שִּׁבְיָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/046.yaml
  text: Woe to you[a], Moab! The people of Chemosh have perished, for your sons have been taken captive, and your daughters into captivity.
translation:
  language: hi
  text: मोआब, तुझ पर हाय! कमोश की प्रजा नष्ट हो गई, क्योंकि तेरे बेटे बंदी बनाकर ले जाए गए और तेरी बेटियाँ बंदी बनाकर ले जाई गईं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אוֹי לְךָ
  choice: हाय तुझ पर
  rationale: यह पदबंध शोक और न्याय की भविष्यवाणी-संबंधी पुकार है। ‘हाय तुझ पर’ उसके गंभीर स्वर और मोआब को सीधे एकवचन संबोधन को बनाए रखता है।
- source_word: מוֹאָב
  choice: मोआब
  rationale: इस स्थान और जाति के नाम का प्रचलित हिन्दी रूप।
- source_word: אָבַד
  choice: नष्ट हो गई
  rationale: क्रिया पूर्ण विनाश अथवा मिट जाने को व्यक्त करती है; स्त्रीलिंग एकवचन ‘प्रजा’ के साथ यह स्वाभाविक हिन्दी है।
- source_word: עַם כְּמוֹשׁ
  choice: कमोश की प्रजा
  rationale: इब्रानी संबंध-संरचना मोआब की प्रजा को उसके राष्ट्रीय देवता कमोश से जोड़ती है; हिन्दी में यह संबंध स्पष्ट और संक्षिप्त रहता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह अगले कथन को पहले विलाप का कारण अथवा आधार बताता है।
- source_word: לֻקְּחוּ בָנֶיךָ בַּשֶּׁבִי
  choice: तेरे बेटे बंदी बनाकर ले जाए गए
  rationale: यह अनुवाद לקח के कर्मवाच्य ‘ले जाए गए’ और שׁבי की बंदी-अवस्था, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וּבְנֹתֶיךָ בַּשִּׁבְיָה
  choice: और तेरी बेटियाँ कैद में चली गईं
  rationale: दूसरी समानांतर पंक्ति में निहित गति को हिन्दी में पूरा किया गया है और निकटार्थी संज्ञा को ‘कैद’ से व्यक्त किया गया है।
theological_decisions:
- issue: कमोश के साथ मोआब की प्रजा का संबंध
  choice: कमोश की प्रजा
  alternative: कमोश के लोग
  rationale: मूल का संबंधवाचक पदबंध ज्यों का त्यों रखा गया है। इससे कमोश के अस्तित्व या सामर्थ्य के विषय में कोई अतिरिक्त धार्मिक निष्कर्ष नहीं जोड़ा जाता।
- issue: दो निकटार्थी बंदी-संबंधी शब्दों का काव्यात्मक समानांतर
  choice: बंदी बनाकर ले जाए गए ... कैद में चली गईं
  alternative: दोनों स्थानों पर ‘बंदी बनाकर ले जाए गए’
  rationale: שׁבי और שׁביה निकटार्थी हैं। हल्की हिन्दी विविधता समानांतरता को बनाए रखते हुए दोनों का समान मूल भाव—जबरन बंदी बनाकर ले जाना—व्यक्त करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गंभीर, काव्यात्मक और भविष्यवाणी-संबंधी स्वर। मोआब को मूल के अनुसार अनौपचारिक एकवचन ‘तू’ से संबोधित किया गया है। वाक्य सहज बोधगम्य रखा गया है, पर मूल की संक्षिप्तता और समानांतरता सुरक्षित हैं।
