revisions:
- from: हाय तुझ पर, मोआब! कमोश की प्रजा नष्ट हो गई, क्योंकि तेरे बेटे बंदी बनाकर ले जाए गए और तेरी बेटियाँ कैद में चली गईं।
  to: मोआब, तुझ पर हाय! कमोश की प्रजा नष्ट हो गई, क्योंकि तेरे बेटे बंदी बनाकर ले जाए गए और तेरी बेटियाँ बंदी बनाकर ले जाई गईं।
  rationale: The revision retains all lexical and theological content of the draft while restoring the implied passive force in the daughters’ clause and preserving the Hebrew poetic parallel between the two captivity expressions. No footnote is necessary in Hindi, since the two Hebrew captivity terms are near-synonymous and the translation does not introduce a meaning-changing distinction.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T10:45:22Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the lament, Moab, Chemosh’s people, their destruction, and the sons/daughters parallel. However, the final clause, “तेरी बेटियाँ कैद में चली गईं,” changes the implied passive deportation/captivity into an active-sounding movement (‘went’). The Hebrew parallel requires that the daughters, like the sons, be represented as taken away into captivity.
  naturalness: “हाय तुझ पर, मोआब!” is understandable but less natural in modern Hindi than a vocative arrangement. “मोआब, तुझ पर हाय!” retains the prophetic register and direct address. The corrected passive wording is also more natural and precise.
  terminology: “मोआब,” “कमोश,” “प्रजा,” and “बंदी” are suitable. “कमोश की प्रजा” faithfully conveys the construct relationship without adding theological interpretation. Using “बंदी बनाकर ले जाई गईं” in the second colon preserves the closely parallel captivity terminology.
  issues:
  - severity: medium
    issue: The daughters are said to have ‘gone into prison/captivity’ rather than to have been taken captive.
    rationale: וּבְנֹתֶיךָ בַּשִּׁבְיָה is a parallel nominal continuation of the preceding passive ‘have been taken’; it implies that the daughters were taken into captivity. “चली गईं” can suggest voluntary movement and omits the coercive passive sense.
  - severity: low
    issue: Opening word order is somewhat awkward for modern Hindi.
    rationale: “हाय तुझ पर, मोआब!” is intelligible, but “मोआब, तुझ पर हाय!” more naturally carries the direct prophetic lament while retaining the Hebrew addressee.
  revised_text: मोआब, तुझ पर हाय! कमोश की प्रजा नष्ट हो गई, क्योंकि तेरे बेटे बंदी बनाकर ले जाए गए और तेरी बेटियाँ बंदी बनाकर ले जाई गईं।
  revised_footnotes: []
  revision_rationale: The revision retains all lexical and theological content of the draft while restoring the implied passive force in the daughters’ clause and preserving the Hebrew poetic parallel between the two captivity expressions. No footnote is necessary in Hindi, since the two Hebrew captivity terms are near-synonymous and the translation does not introduce a meaning-changing distinction.
