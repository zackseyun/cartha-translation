  text: אֵ֥יךְ חַ֨תָּה֙ הֵילִ֔ילוּ אֵ֛יךְ הִפְנָה עֹ֥רֶף מוֹאָ֖ב בּ֑וֹשׁ וְ/הָיָ֥ה מוֹאָ֛ב לִ/שְׂחֹ֥ק וְ/לִ/מְחִתָּ֖ה לְ/כָל סְבִיבָֽי/ו־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/039.yaml
  text: How shattered she is! Wail! How Moab has turned her back in shame! So Moab has become a laughingstock and a horror to all around her[a][b].
translation:
  language: hi
  text: मोआब कैसे टूट गया है! विलाप करो! मोआब ने लज्जित होकर कैसे पीठ फेर ली है![b] इस प्रकार मोआब अपने आस-पास के सब लोगों के लिए उपहास का पात्र और भय का कारण बन गया है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘भय का कारण’ के लिए प्रयुक्त इब्रानी शब्द का अर्थ ‘आतंक’, ‘भयावहता’ या ‘विस्मयकारी विनाश’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: मूल इब्रानी में शाब्दिक अर्थ ‘गर्दन/पीठ फेर ली’ है; यह मुहावरा लज्जा में पीछे हटने या लौट जाने को व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ
  choice: कैसा / कैसे
  rationale: दोनों occurrences को विस्मय और विलाप की तीव्र पुकार के रूप में रखा गया है, न कि साधारण प्रश्न के रूप में।
- source_word: חַתָּה
  choice: टूट गया है
  rationale: חתת यहाँ मोआब के पराजित, ध्वस्त और हतोत्साहित हो जाने को व्यक्त करता है। ‘टूट गया’ राष्ट्रीय पतन और भीतरी निराशा—दोनों की गुंजाइश बनाए रखता है।
- source_word: הֵילִילוּ
  choice: विलाप करो
  rationale: बहुवचन आज्ञार्थक पुकार की तीव्रता को आधुनिक, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: הִפְנָה עֹרֶף
  choice: पीठ फेर ली है
  rationale: इब्रानी मुहावरे के शारीरिक बिंब को बनाए रखते हुए पीछे हटने या अपमान में लौटने का भाव सहज हिन्दी में व्यक्त किया गया है।
- source_word: בּוֹשׁ
  choice: लज्जित होकर
  rationale: मोआब के पीठ फेरने को अपमान और लज्जा की अवस्था से जोड़ता है, जैसा इब्रानी वाक्य-संयोजन संकेत करता है।
- source_word: לִשְׂחֹק
  choice: उपहास का पात्र
  rationale: संज्ञा का आशय दूसरों की हँसी और तिरस्कार का निशाना बनना है; यह हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: לִמְחִתָּה
  choice: भय का कारण
  rationale: यह शब्द आतंक, भयावहता अथवा विस्मयकारी विनाश का द्योतक हो सकता है। मुख्य पाठ में सहज अभिव्यक्ति चुनी गई और अर्थ-सीमा पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: לְכָל סְבִיבָיו
  choice: अपने आस-पास के सब लोगों के लिए
  rationale: इब्रानी के व्यापक ‘उसके चारों ओर के सब’ को ‘पड़ोसी जातियों’ तक अनावश्यक रूप से सीमित किए बिना स्वाभाविक हिन्दी में व्यक्त करता है।
