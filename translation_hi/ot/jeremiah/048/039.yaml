translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक विलाप और दोहरे विस्मय को बनाए रखा गया है। मोआब के लिए हिन्दी के स्वाभाविक पुल्लिंग व्याकरण का प्रयोग किया गया है। भाषा गरिमापूर्ण है, पर ‘हाय-हाय’ जैसे संभावित रूप से पुरातन या संदर्भ-निर्भर पदों से बचते हुए सामान्य पाठकों के लिए स्पष्ट रखी गई है।
