  text: אֵ֣ין עוֹד֮ תְּהִלַּ֣ת מוֹאָב֒ בְּ/חֶשְׁבּ֗וֹן חָשְׁב֤וּ עָלֶ֨י/הָ֙ רָעָ֔ה לְכ֖וּ וְ/נַכְרִיתֶ֣/נָּה מִ/גּ֑וֹי גַּם מַדְמֵ֣ן תִּדֹּ֔מִּי אַחֲרַ֖יִ/ךְ תֵּ֥לֶךְ חָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/002.yaml
  text: 'There is no more praise for Moab[a]. In Heshbon they have devised evil against her: ‘Come, let us cut her off from being a nation.’ You too, Madmen, will be silenced[b]; the sword will go after you.'
translation:
  language: hi
  text: 'मोआब की प्रशंसा अब नहीं रही[a]। हेशबोन में उन्होंने उसके विरुद्ध अनिष्ट की योजना बनाई है: “आओ, हम उसे मिटा दें, ताकि वह एक राष्ट्र न रहे।” हे मदमेन, तू भी मौन हो जाएगी[b]; तलवार तेरे पीछे आएगी।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में “हेशबोन” और “योजना बनाई” एक ही धातु से जुड़े हुए सुनाई देते हैं; इस प्रकार नगर के नाम और योजना बनाने की क्रिया के बीच शब्द-क्रीड़ा है।
    reason: lexical_alternative
  - marker: b
    text: “मदमेन” सम्भवतः किसी स्थान का नाम है। इब्रानी में इसकी ध्वनि “चुप रहना” या “मौन हो जाना” से भी मिलती है, जिससे न्याय की घोषणा में शब्द-क्रीड़ा बनती है।
    reason: cultural_note
lexical_decisions:
- source_word: אֵין עוֹד תְּהִלַּת מוֹאָב
  choice: मोआब की प्रशंसा अब नहीं होती
  rationale: यह अनुवाद प्रशंसा या यश के समाप्त होने का भाव रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: בְּחֶשְׁבּוֹן חָשְׁבוּ
  choice: हेशबोन में उन्होंने ... योजना बनाई है
  rationale: ב को स्थानवाचक मानकर षड्यंत्र का स्थान हेशबोन रखा गया है। नगर के नाम और חשׁב क्रिया का इब्रानी शब्द-साम्य पादटिप्पणी में बताया गया है।
- source_word: רָעָה
  choice: बुराई
  rationale: यह शत्रुतापूर्ण और विनाशकारी योजना को व्यक्त करता है तथा व्यापक इब्रानी अर्थ को समय से पहले केवल ‘विपत्ति’ तक सीमित नहीं करता।
- source_word: לְכוּ וְנַכְרִיתֶנָּה מִגּוֹי
  choice: आओ, हम उसे मिटा दें, ताकि वह एक राष्ट्र न रहे
  rationale: आज्ञार्थक और संकल्पसूचक कथन को उद्धृत शत्रु-वाणी के रूप में रखा गया है। सहज हिन्दी में राष्ट्रीय अस्तित्व मिटाने का आशय स्पष्ट किया गया है।
- source_word: מַדְמֵן תִּדֹּמִּי
  choice: हे मदमेन, तू भी चुप करा दिया जाएगा
  rationale: मदमेन को स्थान-नाम माना गया है और דמם के मौन कर दिए जाने वाले भाव को सुरक्षित रखा गया है; ध्वनि-साम्य पादटिप्पणी में है।
- source_word: אַחֲרַיִךְ תֵּלֶךְ חָרֶב
  choice: तलवार तेरे पीछे आएगी
  rationale: मूल के सजीव मानवीकरण और निकट वाक्य-विन्यास को बनाए रखते हुए सैन्य विनाश का चित्र सुरक्षित रखा गया है।
