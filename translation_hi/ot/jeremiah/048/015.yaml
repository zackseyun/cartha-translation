  yaml_path: translation/ot/jeremiah/048/015.yaml
  text: Moab is devastated[a], and her cities have gone up; the choicest of her young men have gone down to the slaughter, declares the King[b], whose name is Yahweh of Armies.
translation:
  language: hi
  text: 'मोआब उजाड़ दिया गया है,

    और उसके नगर ऊपर चढ़ गए हैं[a];


    उसके चुने हुए जवान

    वध की ओर नीचे उतर गए हैं—


    राजा की यह घोषणा है,

    जिसका नाम सेनाओं का याहवे है[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके नगरों पर कोई चढ़ आया है।” इब्रानी वाक्यांश अत्यंत संक्षिप्त और कठिन है; इसका संकेत मोआब के नगरों पर चढ़ आनेवाली आक्रमणकारी सेना की ओर भी हो सकता है।
    reason: alternative_reading
  - marker: b
    text: 'पारंपरिक हिंदी अनुवाद: “सेनाओं का यहोवा।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֻׁדַּד
  choice: उजाड़ दिया गया है
  rationale: पुअल रूप हिंसक लूट और विनाश से उत्पन्न उजड़ जाने की निष्क्रिय अवस्था व्यक्त करता है; यह चयन अर्थ को केवल लूट तक सीमित नहीं करता।
- source_word: וְעָרֶיהָ עָלָה
  choice: और उसके नगरों पर कोई चढ़ आया है
  rationale: इब्रानी वाक्यांश अत्यंत संक्षिप्त है और עָלָה का कर्ता स्पष्ट नहीं है। हिंदी में यह अनिर्दिष्ट आक्रमणकारी के नगरों पर चढ़ आने का संभावित सैनिक अर्थ स्वाभाविक रूप से व्यक्त करता है, जबकि दूसरे संभव पाठ को पादटिप्पणी में रखा गया है।
- source_word: מִבְחַר בַּחוּרָיו
  choice: उसके चुने हुए जवान
  rationale: מִבְחַר चयनित अथवा सर्वोत्तम लोगों को सूचित करता है; सरल हिंदी में “चुने हुए जवान” इस भाव को स्पष्ट रखता है। प्रत्यय को मोआब से संबंधित “उसके” के रूप में रखा गया है।
- source_word: יָרְדוּ לַטָּבַח
  choice: वध के लिए नीचे उतर गए हैं
  rationale: יָרְדוּ की नीचे उतरने की सजीव गति को बनाए रखा गया है और לַטָּבַח को उनके निश्चित वध की ओर जाने के रूप में व्यक्त किया गया है।
- source_word: נְאֻם
  choice: घोषणा
  rationale: यह मानक नबूवत-सूत्र है; “यह ... की घोषणा है” आधुनिक, स्पष्ट और गरिमापूर्ण हिंदी है।
- source_word: הַמֶּלֶךְ
  choice: राजा
  rationale: निश्चित पद यहाँ परमेश्वर की राजकीय उपाधि है; संदर्भ इसे सामान्य मानवीय राजा से अलग स्पष्ट करता है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का याहवे
  rationale: יְהוָה को उपाधि से बदलने के बजाय व्यक्तिगत नाम “याहवे” से लिप्यंतरित किया गया है, और צְבָאוֹת का सैनिक तथा व्यापक सामर्थ्य-सूचक भाव “सेनाओं” से पारदर्शी रहता है।
- source_word: שְׁמוֹ
  choice: जिसका नाम ... है
  rationale: इब्रानी नामवाचक उपवाक्य को स्वाभाविक हिंदी संबंधवाचक रचना में व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה और उपाधि צְבָאוֹת का अनुवाद
  choice: सेनाओं का याहवे
  alternative: सेनाओं का यहोवा / सेनाओं का प्रभु
  rationale: मूल पाठ व्यक्तिगत ईश्वरीय नाम יְהוָה का प्रयोग करता है। “याहवे” उस नाम को उपाधि में बदलने के बजाय सामने रखता है; “सेनाओं” से צְבָאוֹת का अर्थ आधुनिक पाठक के लिए स्पष्ट रहता है। पारंपरिक हिंदी रूप पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, सरल किंतु नबूवतीय गरिमा के साथ रखी गई है। पद की काव्यात्मक पंक्ति-विन्यास और “नीचे उतर गए” की गति-छवि सुरक्षित है। कठिन इब्रानी वाक्यांश וְעָרֶיהָ עָלָה को मुख्य पाठ में संभावित सैनिक अर्थ के साथ और वैकल्पिक अधिक शाब्दिक अर्थ को पादटिप्पणी में प्रस्तुत किया गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
