base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/042.yaml
  text: And Moab will be destroyed as a people[a], because he magnified himself against Yahweh.
translation:
  language: hi
  text: मोआब एक राष्ट्र के रूप में नष्ट हो जाएगा, क्योंकि उसने याहवे के विरुद्ध अपने आप को महान ठहराया है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उसने याहवे के विरुद्ध घमंड किया है।’ शाब्दिक रूप से, उसने अपने आप को बड़ा ठहराया है।
    reason: हिब्रानी हिफ़ील क्रिया के आत्म-महिमामंडन के रूपक को स्पष्ट करता है और बिना कोई अतिरिक्त अर्थ जोड़े स्वाभाविक वैकल्पिक अनुवाद देता है।
lexical_decisions:
- source_word: וְנִשְׁמַד
  choice: नष्ट हो जाएगा
  rationale: निफ़अल रूप की कर्मवाच्य शक्ति और भविष्यसूचक प्रसंग के भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; यह पूर्ण विनाश से अधिक कुछ नहीं जोड़ता।
- source_word: מוֹאָב
  choice: मोआब
  rationale: इस देश और जनसमूह के नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: מֵעָם
  choice: एक जाति के रूप में
  rationale: यहाँ מִן किसी जनसमूह के रूप में मोआब की स्थिति से हटा दिए जाने का भाव देता है। यह अनुवाद अलग राष्ट्रीय-सामुदायिक अस्तित्व के अंत को व्यक्त करता है; एकवचन עַם के कारण ‘जातियों में से’ कम सम्भावित है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह न्याय का कारण प्रस्तुत करता है और आधुनिक हिन्दी में कारण-संबंध स्पष्ट रखता है।
- source_word: עַל
  choice: के विरुद्ध
  rationale: הִגְדִּיל के साथ इस विरोधी प्रसंग में यह परमेश्वर के विरुद्ध अहंकारी आत्म-उन्नति का संकेत देता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय निजी नाम का हिन्दी लिप्यंतरण, किसी उपाधि से उसका प्रतिस्थापन नहीं।
- source_word: הִגְדִּיל
  choice: अपने आपको बड़ा किया है
  rationale: हिफ़ील की इब्रानी शब्द-छवि को बनाए रखता है और प्रसंग से निहित आत्म-प्रशंसा तथा अहंकार को पाठक तक पहुँचाता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में निजी वाचा-नाम सीधे आया है; इसलिए उसे उपाधि ‘प्रभु’ से बदलने के बजाय लिप्यंतरित किया गया है। ‘याहवे’ उपलब्ध इब्रानी साक्ष्य पर आधारित प्रचलित विद्वत्तापूर्ण रूप है।
- issue: הִגְדִּיל में आत्म-उन्नति और अहंकार
  choice: अपने आपको बड़ा किया है
  alternative: घमंड किया है; अपने आपको ऊँचा उठाया है
  rationale: शाब्दिक रूपक और उसके अहंकारी आशय, दोनों को बनाए रखा गया है; मुख्य पाठ में केवल ‘घमंड किया’ कहने से मूल की ‘बड़ा करने’ वाली छवि मिट जाती।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘जाति’ यहाँ किसी जाति-व्यवस्था की श्रेणी नहीं, बल्कि विशिष्ट जनसमुदाय या राष्ट्र के अर्थ में है। इब्रानी मुहावरे की धार्मिक और नैतिक तीक्ष्णता को सरल व्याख्या से समतल नहीं किया गया।
