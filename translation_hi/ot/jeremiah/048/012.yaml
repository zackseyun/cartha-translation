source:
  edition: WLC
  text: לָ/כֵ֞ן הִנֵּ֖ה יָמִ֤ים בָּאִים֙ נְאֻם יְהוָ֔ה וְ/שִׁלַּחְתִּי ל֥/וֹ צֹעִ֖ים וְ/צֵעֻ֑/הוּ וְ/כֵלָ֣י/ו יָרִ֔יקוּ וְ/נִבְלֵי/הֶ֖ם יְנַפֵּֽצוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/012.yaml
  text: Therefore behold[a], days are coming, declares Yahweh, when I will send to him pourers, and they will pour him out[c][b]; they will empty his vessels and shatter their jars.
translation:
  language: hi
  text: इसलिए देखो, दिन आ रहे हैं—यह याहवे की घोषणा है—जब मैं उसके पास उँडेलने वाले[a] भेजूँगा। वे उसे उँडेल देंगे[b], उसके पात्र खाली कर देंगे और उनके घड़े[c] चकनाचूर कर देंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “झुकाने वाले” अथवा “एक पात्र से दूसरे में उँडेलने वाले।” इब्रानी शब्द दुर्लभ है; उँडेलने, पात्र खाली करने और घड़े तोड़ने का संदर्भ यहाँ दाखमधु उँडेलने वालों के अर्थ का समर्थन करता है।
    reason: lexical_alternative
  - marker: b
    text: या “वे उसे भटका देंगे।” इब्रानी क्रिया को इस दूसरे अर्थ में भी समझा जा सकता है, पर आसपास की दाखमधु और पात्रों वाली छवि “उँडेल देंगे” के पक्ष में है।
    reason: alternative_reading
  - marker: c
    text: इब्रानी में “उनके घड़े” है। अर्थ के आधार पर कुछ व्याख्याकार मोआब के लिए “उसके घड़े” की अपेक्षा करते हैं, पर प्राप्त पाठ में बहुवचन “उनके” है।
    reason: textual_variant
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह निष्कर्षसूचक अव्यय पिछले पद में मोआब की निश्चिंत अवस्था को आने वाले न्याय से जोड़ता है।
- source_word: הִנֵּה
  choice: देखो
  rationale: भविष्यद्वाणी के ध्यान आकर्षित करने वाले संकेत को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: יָמִים בָּאִים
  choice: ऐसे दिन आ रहे हैं
  rationale: आने वाली ईश्वरीय कार्रवाई की सामान्य भविष्यद्वाणी-सूचना को हिन्दी में सहज ढंग से व्यक्त करता है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: भविष्यद्वाणी के गंभीर वचन-सूत्र को स्पष्ट और गरिमापूर्ण हिन्दी में रखता है।
- source_word: וְשִׁלַּחְתִּי לוֹ
  choice: मैं उसके पास ... भेजूँगा
  rationale: लामेद द्वारा व्यक्त मोआब की ओर दिशा को सुरक्षित रखता है; कार्रवाई का शत्रुतापूर्ण परिणाम आगे के वाक्य में स्पष्ट होता है।
- source_word: צֹעִים
  choice: उँडेलने वाले
  rationale: शब्द दुर्लभ है, पर पिछले पद की दाखमधु और तलछट की छवि तथा इसी पद में उँडेलने, पात्र खाली करने और घड़े तोड़ने का संदर्भ इस अर्थ का समर्थन करता है।
- source_word: וְצֵעֻהוּ
  choice: वे उसे उँडेल देंगे
  rationale: मोआब को पात्र में पड़े दाखमधु के रूप में दिखाने वाली रूपक-श्रृंखला को बनाए रखता है, यद्यपि क्रिया का दूसरा सम्भव अर्थ भटकाना है।
- source_word: וְכֵלָיו יָרִיקוּ
  choice: उसके पात्र खाली कर देंगे
  rationale: हिफ़ील क्रिया ריק के कारक अर्थ ‘खाली करना’ और पात्रों की रूपक-छवि दोनों को सीधे व्यक्त करता है।
- source_word: וְנִבְלֵיהֶם יְנַפֵּצוּ
  choice: उनके घड़े चकनाचूर कर देंगे
  rationale: प्राप्त इब्रानी पाठ के बहुवचन ‘उनके’ को बिना सामंजस्य बैठाए सुरक्षित रखता है; נבל को संदर्भानुसार भंडारण-पात्र अर्थात घड़ा समझा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ के व्यक्तिगत ईश्वरीय नाम को उपाधि में बदलने के बजाय हिन्दी लिप्यंतरण में प्रत्यक्ष रखा गया है।
