  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण भविष्यद्वाणी-रजिस्टर अपनाया गया है। दाखमधु-पात्र की विस्तृत रूपक-छवि और मूल पाठ की सर्वनाम-संबंधी अस्पष्टता सुरक्षित रखी गई है; दुर्लभ शब्द और वैकल्पिक क्रियार्थ पादटिप्पणियों में दिए गए हैं।
