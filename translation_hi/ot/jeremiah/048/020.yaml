  text: मोआब को लज्जित किया गया है[a], क्योंकि वह चूर-चूर हो गया है[b]। विलाप करो और चिल्लाओ! अर्नोन के पास[c] घोषणा करो कि मोआब उजाड़ दिया गया है[d]।
