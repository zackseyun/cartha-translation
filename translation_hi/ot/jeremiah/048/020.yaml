lexical_decisions:
- source_word: הֹבִישׁ
  choice: को लज्जित किया गया है
  rationale: हिफ़ील रूप के कारण बने हुए अपमान और उसके वर्तमान परिणाम—दोनों को व्यक्त करता है; केवल ‘लज्जित है’ कहने से कारक भाव कम स्पष्ट होता।
- source_word: מוֹאָב
  choice: मोआब
  rationale: राष्ट्र और स्थान के नाम का हिन्दी बाइबल परंपरा में प्रचलित लिप्यंतरण।
- source_word: כִּי
  choice: क्योंकि
  rationale: मोआब के लज्जित किए जाने का कारण प्रस्तुत करता है और आधुनिक हिन्दी में स्पष्ट तथा स्वाभाविक है।
- source_word: חַתָּה
  choice: टूट चुका है
  rationale: חתת के टूट जाने, परास्त होने और भय से हतप्रभ होने के अर्थ-क्षेत्र को इस विनाश-संदर्भ में संक्षेप में व्यक्त करता है; पूर्ण परिणाम का भाव भी बनाए रखता है।
- source_word: הילילי
  choice: हाय-हाय करो
  rationale: शोक में ऊँचे स्वर से विलाप करने की स्त्रीलिंग एकवचन आज्ञा का स्वाभाविक और गरिमापूर्ण हिन्दी रूप।
- source_word: ו/זעקי
  choice: और पुकार उठो
  rationale: संकट में ऊँचे स्वर से चिल्लाने या दुहाई देने का भाव व्यक्त करता है और ‘हाय-हाय करो’ के साथ स्वाभाविक युग्म बनाता है।
- source_word: הַגִּידוּ
  choice: घोषणा करो
  rationale: बहुवचन आज्ञा और सार्वजनिक रूप से समाचार सुनाने के भाव को बनाए रखता है; निहित कर्म आगे के ‘कि’ उपवाक्य से स्पष्ट होता है।
- source_word: בְ/אַרְנֹון
  choice: अर्नोन के पास
  rationale: अर्नोन नदी अथवा घाटी के भौगोलिक संदर्भ में בְ का स्थानवाचक अर्थ स्वाभाविक रूप से व्यक्त करता है, जबकि मूल की स्थानगत लचक को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: שֻׁדַּד
  choice: उजाड़ दिया गया है
  rationale: שדד के पुअल रूप में बाहरी आक्रमण से हुई तबाही का कर्मवाच्य परिणाम व्यक्त होता है; यह केवल लूटे जाने तक अर्थ को सीमित नहीं करता।
