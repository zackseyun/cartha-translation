base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/018.yaml
  text: Come down from your glory and sit in thirst[a], O inhabitant, daughter of Dibon, for the destroyer of Moab has come up against you[b]; he has destroyed your fortresses.
translation:
  language: hi
  text: अपने वैभव से उतर और प्यास में बैठ जा[a], हे दीबोन की निवासिनी, दीबोन की बेटी[b], क्योंकि मोआब का विनाश करनेवाला तुझ पर चढ़ आया है; उसने तेरे गढ़ों को नष्ट कर दिया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘सूखी या प्यासी जगह पर बैठ जा’ अथवा ‘प्यासी भूमि में बस जा’ भी हो सकता है। इब्रानी पदबंध प्यास की दशा अथवा उस शुष्क स्थान—दोनों को सूचित कर सकता है जहाँ दीबोन को रहना पड़ेगा।
    reason: lexical_alternative
  - marker: b
    text: ‘दीबोन की बेटी’ भविष्यद्वक्ताओं की भाषा में नगर और उसके निवासियों को एक स्त्री के रूप में प्रस्तुत करने का सामान्य ढंग है।
    reason: cultural_note
lexical_decisions:
- source_word: רְדִי מִכָּבוֹד
  choice: अपने वैभव से उतर
  rationale: स्त्रीलिंग एकवचन आज्ञा शहर को स्त्री के रूप में संबोधित करती है। ‘वैभव’ כָּבוֹד के गौरव, प्रतिष्ठा और समृद्ध दशा के अर्थ को इस प्रसंग में स्वाभाविक रूप से व्यक्त करता है।
- source_word: ישבי בַצָּמָא
  choice: प्यास में बैठ जा
  rationale: यह अनुवाद ‘बैठने’ की आज्ञा और צָמָא की प्यास/शुष्कता की छवि को बिना किसी एक अर्थ तक सीमित किए सुरक्षित रखता है; संभावित स्थानवाचक अर्थ पादटिप्पणी में दिया गया है।
- source_word: יֹשֶׁבֶת בַּת דִּיבוֹן
  choice: हे दीबोन की निवासी, दीबोन की बेटी
  rationale: ‘निवासी’ स्त्रीलिंग कृदंत को और ‘दीबोन की बेटी’ नगर तथा उसकी जनता के स्त्रीरूप मानवीकरण को दर्शाता है। स्रोत की पुनरुक्त संबोधन-रचना को बनाए रखा गया है।
- source_word: שֹׁדֵד מוֹאָב
  choice: मोआब का विनाशक
  rationale: שֹׁדֵד लूटने, उजाड़ने या नष्ट करनेवाले आक्रमणकारी को दर्शाता है; ‘विनाशक’ सैन्य और न्याय-संबंधी प्रसंग दोनों के अनुकूल है।
- source_word: עָלָה בָךְ
  choice: तुझ पर चढ़ आया है
  rationale: यह עלה की ऊपर आने/चढ़ाई करने की दिशात्मक सैन्य छवि को बनाए रखता है और आक्रमण का अर्थ स्वाभाविक हिंदी में देता है।
- source_word: שִׁחֵת מִבְצָרָיִךְ
  choice: उसने तेरे गढ़ों को नष्ट कर दिया है
  rationale: שִׁחֵת निर्णायक विनाश को और מִבְצָר fortified strongholds को व्यक्त करता है; ‘गढ़’ संक्षिप्त, स्पष्ट और सैन्य प्रसंग के अनुरूप है।
