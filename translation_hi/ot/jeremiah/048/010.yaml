source:
  edition: WLC
  text: אָר֗וּר עֹשֶׂ֛ה מְלֶ֥אכֶת יְהוָ֖ה רְמִיָּ֑ה וְ/אָר֕וּר מֹנֵ֥עַ חַרְבּ֖/וֹ מִ/דָּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/010.yaml
  text: Cursed is the one who does the work of Yahweh negligently[a], and cursed is the one who holds back his sword from blood.
translation:
  language: hi
  text: शापित है वह जो याहवे का काम लापरवाही से[a] करता है; और शापित है वह जो अपनी तलवार को रक्त बहाने से रोकता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘कपट से।’ इब्रानी शब्द רְמִיָּה छल या विश्वासघात का अर्थ दे सकता है, पर इस प्रसंग में सम्भवतः ढिलाई या लापरवाही से काम करने का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: शापित है
  rationale: यह न्याय अथवा अभिशाप की घोषणा है। ‘शापित है’ आधुनिक हिन्दी में स्वाभाविक है और मूल की प्रबलता बनाए रखता है।
- source_word: עֹשֶׂה
  choice: जो ... करता है
  rationale: कृदन्त यहाँ सामान्य व्यक्ति को सूचित करता है; ‘जो ... करता है’ हिन्दी में इस अर्थ को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: מְלֶאכֶת יְהוָה
  choice: यहोवा का काम
  rationale: מְלָאכָה का मूल अर्थ काम अथवा सौंपा गया कार्य है। इस प्रसंग में मोआब पर न्याय करना यहोवा द्वारा सौंपे गए काम के रूप में प्रस्तुत है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के व्यक्तिगत नाम की प्रचलित लिप्यन्तरण-परम्परा ‘यहोवा’ है; इससे मूल पाठ में आए नाम को किसी उपाधि से नहीं बदला जाता।
- source_word: רְמִיָּה
  choice: लापरवाही से
  rationale: शब्द छल या विश्वासघात भी सूचित कर सकता है, पर इस प्रसंग में सौंपे गए काम को ढिलाई अथवा असावधानी से करना अधिक सम्भावित है। वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: מֹנֵעַ
  choice: रोकता है
  rationale: यह क्रिया किसी वस्तु को पीछे रखने या उसका प्रयोग न करने का भाव देती है। ‘अपनी तलवार को ... से रोकता है’ मूल बिंब के निकट है।
- source_word: חַרְבּוֹ
  choice: अपनी तलवार
  rationale: तृतीय पुरुष एकवचन प्रत्यय को हिन्दी में कर्ता-सापेक्ष स्वाभाविक रूप ‘अपनी’ से व्यक्त किया गया है।
- source_word: מִדָּם
  choice: खून बहाने से
  rationale: शाब्दिक रूप ‘खून से’ है, पर हिन्दी में तलवार को ‘खून से रोकना’ अस्वाभाविक और अस्पष्ट होगा। ‘खून बहाने से’ युद्ध में तलवार द्वारा रक्तपात के निहित भाव को स्पष्ट करता है और कठोर बिंब को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम है। हिन्दी में परिचित नामरूप ‘यहोवा’ रखने से उसे उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं किया जाता।
- issue: न्याय की हिंसक छवि को नरम करना या बनाए रखना
  choice: ‘अपनी तलवार को खून बहाने से रोकता है’ के स्पष्ट बिंब को बनाए रखना
  alternative: ‘अपना कर्तव्य पूरा करने से पीछे हटता है’
  rationale: मूल पाठ तलवार और रक्त की ठोस, कठोर भाषा प्रयोग करता है। अमूर्त परिभाषा इस न्याय-वचन की तीव्रता घटा देती, इसलिए हिंसक छवि को बिना अतिरिक्त औचित्य जोड़े सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्पष्ट, गरिमापूर्ण और सामान्य पाठक के लिए सहज रूप अपनाया गया है। समानान्तर दोनों अभिशाप-वाक्यों में ‘वह शापित है’ दोहराकर मूल की अलंकारिक संरचना बनाए रखी गई है; हिंसक न्याय-भाषा को नरम नहीं किया गया।
