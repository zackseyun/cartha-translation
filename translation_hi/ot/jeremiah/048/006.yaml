base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/006.yaml
  text: Flee! Escape with your lives[b][a], and be like a juniper in the wilderness.
translation:
  language: hi
  text: भागो! अपने प्राण बचाओ, और मरुभूमि में एक झाड़ी[a][b] के समान हो जाओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या सम्भवतः, “और मरुभूमि में अरोएर के समान हो जाओ।” इब्रानी עֲרוֹעֵר को स्थान-नाम “अरोएर” या किसी मरुस्थलीय झाड़ी का नाम समझा जा सकता है; “मरुभूमि में” के साथ उपमा पौधे वाले अर्थ के अनुकूल है।
    reason: alternative_reading
  - marker: b
    text: यहाँ प्रयुक्त इब्रानी शब्द से सूचित पौधे की ठीक-ठीक पहचान निश्चित नहीं है; सम्भावित अर्थों में जुनिपर, झाऊ, या सामान्य रूप से कोई मरुस्थलीय झाड़ी शामिल हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: נֻסוּ
  choice: भागो!
  rationale: बहुवचन आज्ञार्थक क्रिया की तात्कालिकता और सीधे आदेश को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: מַלְּטוּ נַפְשְׁכֶם
  choice: अपने प्राण बचाओ
  rationale: इस प्रसंग में נֶפֶשׁ का अर्थ ‘जीवन/प्राण’ है; संयुक्त पद पलायन करके जीवन बचाने का आदेश देता है, न कि अमूर्त ‘आत्मा’ को छुड़ाने का।
- source_word: וְתִהְיֶינָה
  choice: और ... हो जाओ
  rationale: पूर्ववर्ती आज्ञाओं के क्रम में यह क्रिया आदेशात्मक भाव रखती है। ‘हो जाओ’ हिन्दी में उस भाव को सहजता से व्यक्त करता है।
- source_word: כַּעֲרוֹעֵר
  choice: मरुभूमि की झाड़ी के समान
  rationale: עֲרוֹעֵר की सटीक वनस्पति पहचान अनिश्चित है। सामान्य ‘झाड़ी’ अनावश्यक प्रजाति-विशेष से बचती है, जबकि ‘मरुभूमि की’ अगले पद के साथ मिलकर बिंब को स्पष्ट करती है। स्थान-नाम ‘अरोएर’ की सम्भावना पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: בַּמִּדְבָּר
  choice: मरुभूमि
  rationale: מִדְבָּר के निर्जन, शुष्क प्रदेश के अर्थ को संक्षिप्त, गरिमापूर्ण और प्रचलित हिन्दी में व्यक्त करता है।
