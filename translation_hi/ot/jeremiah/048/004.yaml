  text: 'मोआब चकनाचूर हो गया है;

    उसके नन्हे बच्चों ने एक पुकार सुनाई है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נִשְׁבְּרָה
  choice: चकनाचूर हो गया है
  rationale: मूल क्रिया का अर्थ टूट जाने या नष्ट होकर बिखर जाने का है। यह पद मोआब की विनाशकारी पराजय को व्यक्त करता है; हिन्दी में यह प्रयोग स्वाभाविक और प्रभावशाली है।
- source_word: הִשְׁמִיעוּ
  choice: सुना दी है
  rationale: हिफ़ील रूप का कारक भाव—पुकार को सुनाई देना नहीं, बल्कि उसे सुनाना—सुरक्षित रखा गया है।
- source_word: זְּעָקָה
  choice: पुकार
  rationale: यह संकट और पीड़ा में उठी ऊँची पुकार है। 'पुकार' मूल की व्यापकता बनाए रखती है और अनावश्यक रूप से इसे केवल रोने या चीखने तक सीमित नहीं करती।
- source_word: צעורי/ה
  choice: उसके नन्हे बच्चों
  rationale: पारंपरिक पठित रूप को मोआब के 'छोटों' या 'नन्हे बच्चों' के अर्थ में लिया गया है। 'नन्हे बच्चे' सामान्य आधुनिक हिन्दी में स्पष्ट है।
