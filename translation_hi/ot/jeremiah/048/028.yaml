  yaml_path: translation/ot/jeremiah/048/028.yaml
  text: Leave the cities and dwell in the rock[a], inhabitants of Moab, and be like a dove that nests on the sides of the mouth of a pit.
translation:
  language: hi
  text: 'नगरों को छोड़ो और चट्टान में बसो,


    हे मोआब के निवासियो!


    कबूतरी के समान हो जाओ,


    जो गड्ढे[a] के मुँह के किनारों पर घोंसला बनाती है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘फँसाने वाला गड्ढा’; इब्रानी शब्द ऐसे गड्ढे का भी बोध करा सकता है जो जाल के रूप में इस्तेमाल होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עִזְבוּ עָרִים
  choice: नगरों को छोड़कर
  rationale: बहुवचन आज्ञार्थक क्रिया और उसके कर्म को स्वाभाविक हिन्दी वाक्य-प्रवाह में रखा गया है; ‘छोड़कर’ अगली आज्ञा से इसका निकट संबंध भी व्यक्त करता है।
- source_word: וְשִׁכְנוּ בַּסֶּלַע
  choice: चट्टान में जा बसो
  rationale: שׁכן के निवास करने या शरण लेकर बसने के भाव को ‘जा बसो’ सहज रूप से व्यक्त करता है। בַּסֶּלַע के एकवचन और चट्टानी आश्रय की छवि को ‘चट्टान में’ से सुरक्षित रखा गया है।
- source_word: יֹשְׁבֵי מוֹאָב
  choice: हे मोआब के निवासियो
  rationale: यह संबोधन है; ‘हे’ और संबोधन-बहुवचन ‘निवासियो’ से हिन्दी में उसका व्याकरणिक कार्य स्पष्ट होता है।
- source_word: וִהְיוּ כְיוֹנָה
  choice: उस कबूतरी के समान हो जाओ
  rationale: יוֹנָה व्याकरणतः स्त्रीलिंग है और अगली स्त्रीलिंग क्रिया उसी से मेल खाती है; ‘कबूतरी’ इसे स्पष्ट रखते हुए उपमा को स्वाभाविक बनाती है। ‘हो जाओ’ आज्ञार्थक बल को बनाए रखता है।
- source_word: תְּקַנֵּן
  choice: घोंसला बनाती है
  rationale: स्त्रीलिंग एकवचन क्रिया कबूतरी की सामान्य क्रिया का वर्णन करती है; हिन्दी संबंधवाचक उपवाक्य में वर्तमान काल चित्र को स्पष्ट और स्वाभाविक रखता है।
- source_word: בְּעֶבְרֵי פִי
  choice: मुँह के किनारों पर
  rationale: פִּי का सजीव रूपक ‘मुँह’ से रखा गया है, जबकि עֶבְרֵי का बहुवचन स्थानगत भाव ‘किनारों’ से व्यक्त होता है।
- source_word: פָחַת
  choice: गड्ढे
  rationale: मूल शब्द गड्ढे के साथ फँसाने के लिए बने गड्ढे का अर्थ भी दे सकता है। मुख्य पाठ में संक्षिप्त और व्यापक ‘गड्ढा’ रखा गया है तथा संभावित जाल-संबंधी अर्थ पादटिप्पणी में दिया गया है।
