  edition: WLC
  text: וְ/אִ֣ם ל֣וֹא הַ/שְּׂחֹ֗ק הָיָ֤ה לְ/ךָ֙ יִשְׂרָאֵ֔ל אִם בְּ/גַנָּבִ֖ים נמצאה כִּֽי מִ/דֵּ֧י דְבָרֶ֥י/ךָ בּ֖/וֹ תִּתְנוֹדָֽד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/027.yaml
  text: Was Israel not a laughingstock to you? Was he found among thieves[a], that whenever you spoke of him, you shook your head?
translation:
  language: hi
  text: क्या इस्राएल तुम्हारे लिए हँसी का पात्र न था? क्या वह चोरों के बीच पाया गया था, कि जब-जब तुम उसके विषय में बोलते थे, तो उपहास में सिर हिलाते थे[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने को झटकते थे।” हिब्रू क्रिया अपने को हिलाने-डुलाने या झटकने का अर्थ दे सकती है; यहाँ संभवतः यह उपहास के संकेत को बताती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׂחֹק
  choice: हँसी का पात्र
  rationale: यह संज्ञा उपहास और ठट्ठे का लक्ष्य होने का भाव देती है। ‘हँसी का पात्र’ आधुनिक हिन्दी में स्वाभाविक है और केवल सामान्य हँसी का अर्थ नहीं देता।
- source_word: הָיָה לְךָ
  choice: तुम्हारे लिए ... था
  rationale: यह प्रयोग बताता है कि मोआब की दृष्टि में इस्राएल क्या था; हिन्दी में ‘तुम्हारे लिए’ संबंधसूचक לְ का भाव बनाए रखता है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी बाइबलीय रूप रखा गया है।
- source_word: אִם בְּגַנָּבִים נִמְצָאָה
  choice: क्या वह चोरों के बीच पाया गया था
  rationale: अलंकारिक प्रश्न को मूल के निकट रखा गया है। ‘पाया गया’ נִמְצָאָה का सीधा अर्थ देता है और ‘पकड़ा गया’ जोड़कर अपराध सिद्ध होने का भाव नहीं लाता।
- source_word: כִּי מִדֵּי
  choice: कि जब-जब
  rationale: यह संयोजन बार-बार होने वाली क्रिया को सूचित करता है; ‘जब-जब’ हिन्दी में उस आवृत्तिमूलक अर्थ को स्पष्ट करता है।
- source_word: דְבָרֶיךָ בּוֹ
  choice: तुम उसके विषय में बोलते थे
  rationale: हिब्रू मुहावरे का आधारभूत अर्थ किसी के विषय में बोलना है। संदर्भ में वाणी तिरस्कारपूर्ण है, पर अनुवाद में ‘विरुद्ध’ जोड़कर अस्पष्टता को अनावश्यक रूप से सीमित नहीं किया गया।
- source_word: תִּתְנוֹדָד
  choice: उपहास से सिर हिलाते थे
  rationale: क्रिया हिलने-डुलने या तिरस्कारपूर्ण ढंग से हिलाने का संकेत दे सकती है। संदर्भ में सिर हिलाने का इशारा स्वाभाविक है; ‘उपहास से’ उसके प्रसंगगत भाव को स्पष्ट करता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। दोनों अलंकारिक प्रश्न सुरक्षित हैं। राष्ट्र इस्राएल के लिए हिन्दी में स्वाभाविक एकवचन ‘वह’ प्रयुक्त हुआ है। पादटिप्पणी-चिह्न को उसी क्रिया-वाक्यांश पर रखा गया है जिससे उसका संबंध है।
