  text: קָר֥וֹב אֵיד מוֹאָ֖ב לָ/ב֑וֹא וְ/רָ֣עָת֔/וֹ מִהֲרָ֖ה מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/016.yaml
  text: The disaster of Moab is near to come[b][a], and his calamity is hurrying very quickly.
translation:
  language: hi
  text: 'मोआब पर विपत्ति आने ही वाली है,

    और उसका संकट बहुत तेज़ी से आ रहा है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָרוֹב
  choice: आने ही वाली है
  rationale: विधेय विशेषण आसन्नता व्यक्त करता है। हिन्दी में לָבוֹא के साथ संयुक्त रूप से यह स्वाभाविक और स्पष्ट है।
- source_word: אֵיד
  choice: विपत्ति
  rationale: यह विनाशकारी दुर्भाग्य या बरबादी को सूचित करता है; आधुनिक हिन्दी के भविष्यद्वाणी-संबंधी प्रसंग में ‘विपत्ति’ स्पष्ट और गरिमापूर्ण है।
- source_word: מוֹאָב
  choice: मोआब
  rationale: स्थान और राष्ट्र के नाम का हिन्दी बाइबलीय लिप्यंतरण।
- source_word: לָבוֹא
  choice: आने
  rationale: ל उपसर्गयुक्त infinitive construct उस घटना को व्यक्त करता है जिसका घटित होना निकट है; ‘आने ही वाली है’ पूरी संरचना का स्वाभाविक हिन्दी रूप है।
- source_word: רָעָתוֹ
  choice: उसका संकट
  rationale: यहाँ רָעָה नैतिक बुराई नहीं, हानिकारक दशा या संकट है। ‘उसका’ पुल्लिंग एकवचन प्रत्यय को मोआब राष्ट्र के मानवीकरण के रूप में स्वाभाविक ढंग से बनाए रखता है।
- source_word: מִהֲרָה
  choice: तेज़ी से बढ़ा चला आ रहा है
  rationale: क्रिया शीघ्रता और निकट आते जाने की गतिशीलता व्यक्त करती है; यह रूप आधुनिक हिन्दी में उस क्रियात्मक बल को बनाए रखता है।
- source_word: מְאֹד
  choice: बहुत
  rationale: यह מִהֲרָה की तीव्रता बढ़ाने वाला अव्यय है; ‘बहुत तेज़ी से’ उसका जोर स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: मोआब का व्याकरणिक मानवीकरण
  choice: ‘उसका’ द्वारा मोआब को पुल्लिंग एकवचन राष्ट्र के रूप में संदर्भित किया गया है।
  alternative: ‘मोआब का संकट’ या निर्जीव संदर्भसूचक रूप
  rationale: इब्रानी का 3ms प्रत्यय राष्ट्र के मानवीकरण को बनाए रखता है; हिन्दी में ‘उसका’ स्वाभाविक है और अनावश्यक व्याख्यात्मक निर्णय नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; काव्यात्मक समानांतरता बनाए रखते हुए सहज, गरिमापूर्ण और सार्वजनिक पाठ के योग्य भाषा। ‘विपत्ति’ और ‘संकट’ स्रोत में प्रयुक्त दो निकटार्थी संज्ञाओं के भेद को आंशिक रूप से बनाए रखते हैं।
