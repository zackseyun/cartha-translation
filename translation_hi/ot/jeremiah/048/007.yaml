  text: כִּ֠י יַ֣עַן בִּטְחֵ֤/ךְ בְּ/מַעֲשַׂ֨יִ/ךְ֙ וּ/בְ/א֣וֹצְרוֹתַ֔יִ/ךְ גַּם אַ֖תְּ תִּלָּכֵ֑דִי וְ/יָצָ֤א כמיש בַּ/גּוֹלָ֔ה כֹּהֲנָ֥י/ו וְ/שָׂרָ֖י/ו יחד־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/007.yaml
  text: Because you trusted in your works and in your treasures[a], you also will be captured; and Chemosh will go out into exile[e][d][c][b], his priests and his officials together.
translation:
  language: hi
  text: क्योंकि तूने अपने कामों[a] और अपने खज़ानों[b] पर भरोसा किया, इसलिए तू भी पकड़ी जाएगी; और कमोश[c] निर्वासन में चला जाएगा[d]—उसके याजक और उसके अधिकारी[e], सब एक साथ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने कार्यों पर” अथवा “अपनी बनाई हुई वस्तुओं पर।” इब्रानी शब्द काम, कार्य, कर्म या बनाई हुई वस्तु के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “अपने धन पर” अथवा “अपने भंडारों पर।”
    reason: lexical_alternative
  - marker: c
    text: कमोश मोआब का राष्ट्रीय देवता था।
    reason: cultural_note
  - marker: d
    text: या, “बंधुआई में चला जाएगा” अथवा “बंदी बनाकर ले जाया जाएगा।”
    reason: lexical_alternative
  - marker: e
    text: या, “उसके हाकिम” अथवा “उसके प्रधान।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יַעַן
  choice: क्योंकि … इसलिए
  rationale: यह संयुक्त अभिव्यक्ति कारण पर बल देती है। हिन्दी में ‘क्योंकि … इसलिए’ कारण और परिणाम का संबंध स्वाभाविक तथा स्पष्ट रूप से व्यक्त करता है।
- source_word: בִּטְחֵךְ
  choice: तूने … भरोसा किया
  rationale: द्वितीय पुरुष स्त्रीलिंग एकवचन रूप मोआब को संबोधित करता है; पूर्ण क्रिया न्याय का कारण बनी हुई पिछली निर्भरता बताती है।
- source_word: בְּמַעֲשַׂיִךְ
  choice: अपने कामों
  rationale: מַעֲשֶׂה काम, कार्य, कर्म या बनाई हुई वस्तु को सूचित कर सकता है। ‘कामों’ इस व्यापकता को बनाए रखता है।
- source_word: וּבְאֹצְרוֹתַיִךְ
  choice: और अपने खज़ानों
  rationale: אֹצָר खज़ाने, संचित धन अथवा भंडार को सूचित कर सकता है। यहाँ भरोसे की वस्तु के रूप में ‘खज़ानों’ सबसे सीधा अर्थ देता है।
- source_word: גַּם אַתְּ
  choice: तू भी
  rationale: यह मोआब को आने वाले न्याय में बलपूर्वक सम्मिलित करता है।
- source_word: תִּלָּכֵדִי
  choice: पकड़ ली जाएगी
  rationale: निफ़अल रूप निष्क्रिय अर्थ रखता है और सैन्य संदर्भ में पकड़े जाने को व्यक्त करता है। स्त्रीलिंग संबोधन को हिन्दी में सुरक्षित रखा गया है।
- source_word: וְיָצָא כמיש בַּגּוֹלָה
  choice: और कमोश बंधुआई में चला जाएगा
  rationale: भविष्यसूचक क्रम में וְיָצָא भावी परिणाम बताता है। גּוֹלָה निर्वासन अथवा बंदी बनाकर ले जाए जाने को दर्शाता है; ‘बंधुआई में’ इस अपमानजनक निष्कासन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כֹּהֲנָיו וְשָׂרָיו יַחַד
  choice: उसके याजक और उसके अधिकारी, सब एक साथ
  rationale: पुल्लिंग प्रत्यय कमोश की ओर संकेत करते हैं। שַׂר का व्यापक प्रशासनिक अर्थ ‘अधिकारी’ से सुरक्षित रहता है, और יַחַד संयुक्त निर्वासन पर बल देता है।
theological_decisions:
- issue: कमोश का संदर्भ और प्रस्तुतीकरण
  choice: कमोश को मोआब के नामित देवता के रूप में रखा गया है, जिसे उसके याजकों और अधिकारियों के साथ बंधुआई में जाते हुए चित्रित किया गया है।
  alternative: कमोश को स्थान-नाम या राजवंशीय उपाधि मानना।
  rationale: संदर्भ में स्वाभाविक अर्थ मोआब का देवता है। पाठ की व्यंग्यात्मक और विवादात्मक शक्ति बनाए रखने के लिए उसके निर्वासन के मानवीकरण को बिना अतिरिक्त धर्मवैज्ञानिक व्याख्या के ज्यों का त्यों रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यसूचक शैली रखी गई है। मोआब के लिए मूल के स्त्रीलिंग एकवचन संबोधन के अनुरूप ‘तू’ और ‘पकड़ ली जाएगी’ प्रयुक्त हैं। ‘याजक’, ‘कमोश’ और ‘बंधुआई’ बाइबलीय संदर्भ में परिचित हैं, जबकि वाक्य-विन्यास सामान्य पाठक के लिए स्पष्ट रखा गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में क्रम से उपस्थित हैं।
