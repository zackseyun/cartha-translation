  text: כִּ֤י כָל רֹאשׁ֙ קָרְחָ֔ה וְ/כָל זָקָ֖ן גְּרֻעָ֑ה עַ֤ל כָּל יָדַ֨יִם֙ גְּדֻדֹ֔ת וְ/עַל מָתְנַ֖יִם שָֽׂק־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/037.yaml
  text: For every head is bald[a], and every beard is cut off; on all the hands are gashes[b], and on the waist is sackcloth.
translation:
  language: hi
  text: क्योंकि हर सिर मुंडा हुआ है और हर दाढ़ी कटी हुई है; सब हाथों पर चीरे हैं, और कमर पर टाट का वस्त्र है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले विलाप का कारण अथवा स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ उसके कारणसूचक अर्थ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: כָל רֹאשׁ קָרְחָה
  choice: हर सिर गंजा है
  rationale: קָרְחָה गंजेपन या सिर के बाल हटाए जाने को दर्शाता है। यह शोक की निशानी है, पर हिन्दी पाठ किसी विशेष कर्ता या विधि को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: וְכָל זָקָן גְּרֻעָה
  choice: हर दाढ़ी काट दी गई है
  rationale: גְּרֻעָה दाढ़ी के घटाए, छाँटे या हटाए जाने का भाव देता है। ‘काट दी गई है’ शोक की क्रिया को स्पष्ट और सहज ढंग से व्यक्त करता है, बिना यह तय किए कि दाढ़ी पूरी तरह मुंडाई गई थी।
- source_word: עַל כָּל יָדַיִם גְּדֻדֹת
  choice: सब हाथों पर चीरे हैं
  rationale: גְּדֻדֹת शोक में लगाए गए कटों या चीरों को सूचित करता है। ‘चीरे’ आधुनिक हिन्दी में स्पष्ट है; ‘हाथों’ मूल शब्द का निकट अनुवाद है, यद्यपि अभिव्यक्ति बाँहों तक को समेट सकती है।
- source_word: וְעַל מָתְנַיִם שָׂק
  choice: कमर में टाट बँधा है
  rationale: מָתְנַיִם कमर-कूल्हे के मध्यभाग को दर्शाता है। हिन्दी में ‘कमर में टाट बँधा है’ शोक-वस्त्र पहने होने की छवि को स्वाभाविक रूप से व्यक्त करता है।
