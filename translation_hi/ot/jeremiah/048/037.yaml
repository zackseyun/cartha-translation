  verdict: revise
  source_fidelity: 'The draft accurately conveys all four Hebrew mourning signs: shaven/bald heads, cut beards, mourning cuts on the hands, and sackcloth at the loins. The causal force of כִּי is retained. The revision makes the first and final images more idiomatic in Hindi without adding interpretive detail.'
  naturalness: ‘हर सिर गंजा है’ is understandable but less idiomatic for the context than ‘हर सिर मुंडा हुआ है.’ Likewise, ‘कमर में टाट बँधा है’ is somewhat awkward and unnecessarily specifies fastening; ‘कमर पर टाट का वस्त्र है’ is natural and retains the Hebrew image.
  terminology: ‘मुंडा हुआ,’ ‘कटी हुई,’ ‘चीरे,’ and ‘टाट का वस्त्र’ are clear modern-Hindi renderings of the mourning terminology. ‘कमर’ appropriately renders the accessible sense of מָתְנַיִם while the note records the more literal ‘कटि/कमर का भाग.’
  issues:
  - severity: low
    issue: ‘हर सिर गंजा है’ is stylistically stiff in this mourning context.
    rationale: Hindi normally describes the visible mourning sign as a shaven head; ‘हर सिर मुंडा हुआ है’ preserves the resultative Hebrew wording naturally.
  - severity: low
    issue: ‘कमर में टाट बँधा है’ adds a specific action and is less natural than the image of a sackcloth garment at the waist.
    rationale: The Hebrew states that sackcloth is on the loins/waist, without specifying that it is tied. ‘कमर पर टाट का वस्त्र है’ is both idiomatic and more closely aligned.
  revised_text: क्योंकि हर सिर मुंडा हुआ है और हर दाढ़ी कटी हुई है; सब हाथों पर चीरे हैं, और कमर पर टाट का वस्त्र है।
