base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/034.yaml
  text: From the cry of Heshbon to Elealeh[a], as far as Jahaz, they raise their voice; from Zoar to Horonaim, to Eglath-shelishiyah. For even the waters of Nimrim will become desolations.
translation:
  language: hi
  text: हेशबोन की पुकार से लेकर एलाले तक, और यहस तक, वे अपनी आवाज़ बुलंद करते हैं; सोअर से होरोनैम तक, एग्लत-शलीशियाह तक। क्योंकि निम्रीम का जल भी उजाड़ हो जाएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִזַּעֲקַת חֶשְׁבּוֹן
  choice: हेशबोन की चीख
  rationale: זַעֲקָה संकट और दुःख की तीखी पुकार या चीख को दर्शाता है। भौगोलिक विस्तार को अगले पदबंध ‘...तक सुनाई देती है’ में स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: עַד אֶלְעָלֵה עַד יַהַץ
  choice: एलाले और यहस तक
  rationale: दोहराया गया עַד पुकार के पहुँचने की सीमा बताता है; हिन्दी में संयुक्त स्थान-सूची के साथ ‘तक’ अर्थ को स्पष्ट और सहज रखता है।
- source_word: נָתְנוּ קוֹלָם
  choice: वे ऊँचे स्वर से पुकारते हैं
  rationale: शाब्दिक मुहावरा ‘अपनी आवाज़ देना’ है, जिसका आशय ज़ोर से आवाज़ लगाना या विलाप करना है। चुना हुआ रूप सक्रिय अर्थ को स्वाभाविक आधुनिक हिन्दी में रखता है।
- source_word: מִצֹּעַר עַד חֹרֹנַיִם
  choice: सोअर से होरोनैम ... तक
  rationale: מִן और עַד दूसरे भौगोलिक विस्तार के आरम्भ और अन्त को चिह्नित करते हैं।
- source_word: עֶגְלַת שְׁלִשִׁיָּה
  choice: एग्लत-शलीशियाह
  rationale: स्थान-नामों की श्रृंखला और यशायाह 15:5 के समानांतर प्रयोग के कारण इसे मुख्य पाठ में स्थान-नाम के रूप में लिप्यंतरित किया गया है; वर्णनात्मक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: כִּי גַּם
  choice: क्योंकि ... भी
  rationale: כִּי कारण या व्याख्या प्रस्तुत करता है और גַּם अतिरिक्त बल देता है; ‘क्योंकि ... भी’ दोनों भूमिकाएँ व्यक्त करता है।
- source_word: מֵי נִמְרִים
  choice: निम्रीम के जल-स्रोत
  rationale: शाब्दिक अर्थ ‘निम्रीम के जल’ है। प्रसंग में किसी स्थान के जल को दर्शाने के लिए ‘जल-स्रोत’ अधिक स्वाभाविक हिन्दी है, बिना किसी निश्चित नदी या झरने का दावा किए।
- source_word: לִמְשַׁמּוֹת יִהְיוּ
  choice: उजाड़ हो जाएँगे
  rationale: לְ के साथ היה परिणामस्वरूप अवस्था में आने का भाव देता है। हिन्दी बहुवचन क्रिया जल-स्रोतों के अनुरूप है और विनाश की परिणति को स्पष्ट करती है।
