  text: אֲנִ֤י יָדַ֨עְתִּי֙ נְאֻם יְהוָ֔ה עֶבְרָת֖/וֹ וְ/לֹא כֵ֑ן בַּדָּ֖י/ו לֹא כֵ֥ן עָשֽׂוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/030.yaml
  text: I know his wrath[a], declares Yahweh, and it is not so; his boasts have accomplished nothing.
translation:
  language: hi
  text: “मैं उसके क्रोध को जानता हूँ—यह याहवे की घोषणा है—पर बात वैसी नहीं है; उसकी डींगों से कुछ भी नहीं हुआ।[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी झूठी बातें सच नहीं हैं; उन्होंने वैसा नहीं किया,” अथवा, “उसकी खोखली बातें निष्फल रही हैं।” अंतिम उपवाक्य का इब्रानी पाठ कठिन और अत्यंत संक्षिप्त है।
    reason: वैकल्पिक पाठ
lexical_decisions:
- source_word: יָדַעְתִּי
  choice: मैं … जानता हूँ
  rationale: कालसूचक पूर्ण रूप यहाँ याहवे के स्थिर और वर्तमान ज्ञान को व्यक्त करता है, इसलिए स्वाभाविक हिन्दी वर्तमान काल उपयुक्त है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: यह गंभीर भविष्यद्वक्तापरक सूत्र है; ‘घोषणा’ उसके औपचारिक बल को बनाए रखता है और יְהוָה को परियोजना की रीति के अनुसार ‘याहवे’ लिखा गया है।
- source_word: עֶבְרָתוֹ
  choice: उसके क्रोध
  rationale: עֶבְרָה का मूल अर्थ उमड़ता हुआ रोष या क्रोध है। प्रसंग में मोआब का घमंड भी उपस्थित है, पर ‘क्रोध’ शब्द के मुख्य अर्थ को सुरक्षित रखता है।
- source_word: וְלֹא כֵן
  choice: पर बात वैसी नहीं है
  rationale: शाब्दिक ‘और ऐसा नहीं’ को सहज हिन्दी में व्यक्त करते हुए मूल के संक्षिप्त खंडन को बनाए रखा गया है।
- source_word: בַּדָּיו
  choice: उसकी डींगों
  rationale: בדים झूठी, खोखली या डींगभरी बातों को सूचित कर सकता है। पिछले पदों में मोआब के घमंड के कारण ‘डींगों’ प्रसंगानुकूल है।
- source_word: לֹא כֵן עָשׂוּ
  choice: से कुछ भी नहीं हुआ
  rationale: शाब्दिक रूप ‘उन्होंने वैसा नहीं किया’ अत्यंत संक्षिप्त और अस्पष्ट है। यह हिन्दी वाक्य उन डींगों की निष्फलता बताता है, जबकि वैकल्पिक पाठ फुटनोट में सुरक्षित हैं।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: याहवे
  alternative: यहोवा
  rationale: ‘याहवे’ चतुराक्षरी ईश्वरीय नाम का व्यापक रूप से स्वीकृत आधुनिक लिप्यंतरण है और वाचा-संबंधी व्यक्तिगत नाम को छिपाता नहीं है।
- issue: कठिन पदबंध בַּדָּיו לֹא כֵן עָשׂוּ का अर्थ
  choice: उसकी डींगों से कुछ भी नहीं हुआ
  alternative: उसकी झूठी बातें सच नहीं हैं; उन्होंने वैसा नहीं किया
  rationale: इब्रानी वाक्य संकुचित और अस्पष्ट है। चुना हुआ पाठ निकटवर्ती संदर्भ में मोआब की घमंडभरी बातों की निष्फलता व्यक्त करता है; दूसरी सम्भावना फुटनोट में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रूप अपनाया गया है। मूल की तीखी, संक्षिप्त भविष्यद्वक्तापरक शैली को डैश और अर्धविराम से बनाए रखा गया है; कठिन अंतिम खंड की वास्तविक अस्पष्टता फुटनोट में सुरक्षित है।
