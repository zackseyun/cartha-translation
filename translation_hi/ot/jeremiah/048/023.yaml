base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/023.yaml
  text: and against Kiriathaim[a], and against Beth-gamul, and against Beth-meon—
translation:
  language: hi
  text: और किर्यातैम[a] के विरुद्ध, और बेत-गामूल के विरुद्ध, और बेत-मोन के विरुद्ध—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में प्रत्येक नगर के नाम से पहले “और ... के विरुद्ध” दोहराया गया है; इससे न्याय-घोषणा की लय बनी रहती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: और ... के विरुद्ध
  rationale: यह पद पिछले संदर्भ में चल रही न्याय-घोषणा की नगर-सूची को आगे बढ़ाता है। ‘के विरुद्ध’ शत्रुतापूर्ण न्याय की दिशा को स्वाभाविक हिन्दी में व्यक्त करता है; हर नगर से पहले इसकी पुनरावृत्ति इब्रानी लय को सुरक्षित रखती है।
- source_word: קִרְיָתַיִם
  choice: किर्यातैम
  rationale: यह एक स्थान-नाम है, इसलिए इसका अर्थानुवाद न करके इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है। रूप द्विवचन-जैसा दिखता है, पर यहाँ रूढ़ स्थान-नाम के रूप में प्रयुक्त है।
- source_word: בֵּית גָּמוּל
  choice: बेत-गामूल
  rationale: ‘बेत’ से आरम्भ होने वाला यह संयुक्त स्थान-नाम है। अर्थानुवाद ‘गामूल का घर’ करने के बजाय पहचान बनाए रखने के लिए लिप्यंतरण और योजक-चिह्न अपनाया गया है।
- source_word: בֵּית מְעוֹן
  choice: बेत-मोन
  rationale: यह भी संयुक्त स्थान-नाम है; अतः अर्थानुवाद के बजाय इब्रानी के निकट लिप्यंतरण किया गया है। योजक-चिह्न नाम के दोनों घटकों को स्पष्ट करता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण भविष्यद्वाणी-संबंधी स्वर रखा गया है। नगरों के नाम देवनागरी में लिप्यंतरित हैं और मूल की पुनरावृत्त संरचना जानबूझकर सुरक्षित रखी गई है। अंतिम दीर्घ विराम-चिह्न से सूची के आगे जारी रहने का भाव प्रकट होता है।
