source:
  edition: WLC
  text: וְ/שַׁבְתִּ֧י שְׁבוּת מוֹאָ֛ב בְּ/אַחֲרִ֥ית הַ/יָּמִ֖ים נְאֻם יְהוָ֑ה עַד הֵ֖נָּה מִשְׁפַּ֥ט מוֹאָֽב־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/047.yaml
  text: Yet I will restore the fortunes of Moab in the latter days[a], declares Yahweh. Thus far is the judgment of Moab.
translation:
  language: hi
  text: फिर भी, अंत के दिनों में मैं मोआब की दशा को पुनःस्थापित करूँगा[a], याहवे की यह घोषणा है। मोआब के विषय में न्याय-वचन यहीं तक है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मोआब की बन्धुआई को लौटा लाऊँगा”; इब्रानी मुहावरा बन्धुआई से पुनर्स्थापना या अधिक व्यापक रूप से दशा की बहाली को व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁבְתִּי שְׁבוּת
  choice: फिर भी ... भाग्य को फेर दूँगा
  rationale: שוב שׁבות एक मुहावरा है जिसका अर्थ बन्धुआई से लौटाना या व्यापक रूप से दशा/भाग्य को फिर से बहाल करना हो सकता है। पिछले न्याय-वचनों के बाद וְ का विरोधसूचक बल दिखाने के लिए ‘फिर भी’ रखा गया है।
- source_word: מוֹאָב
  choice: मोआब
  rationale: राष्ट्र के नाम का मानक हिन्दी लिप्यंतरण।
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: अन्त के दिनों में
  rationale: यह वक्ता के दृष्टिकोण से भावी समय को सूचित करता है और इसकी सम्भावित युगान्तकारी गूँज को समतल किए बिना बनाए रखता है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: गम्भीर भविष्यद्वाणी-सूत्र को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और ईश्वरीय नाम को याहवे रूप में रखता है।
- source_word: עַד הֵנָּה
  choice: यहाँ तक
  rationale: यह पदबंध मोआब-विषयक भविष्यद्वाणी के समापन को चिह्नित करता है।
- source_word: מִשְׁפַּט
  choice: न्याय-वचन
  rationale: यहाँ अर्थ केवल अमूर्त न्याय नहीं, बल्कि मोआब के विरुद्ध सुनाया गया न्यायिक कथन या दण्डादेश है; ‘न्याय-वचन’ इस प्रसंगगत अर्थ को स्पष्ट रखता है।
theological_decisions:
- issue: मोआब के लिए प्रतिज्ञात पुनर्स्थापना का दायरा
  choice: पद को वास्तविक भावी पुनर्स्थापना की प्रतिज्ञा के रूप में अनूदित किया गया है, पर उसकी रीति या व्यापक धर्मवैज्ञानिक अर्थ को निर्धारित नहीं किया गया।
  alternative: इसे केवल राजनीतिक पुनरुत्थान या अन्यजातियों के युगान्तकारी समावेश के रूप में स्पष्ट करना।
  rationale: इब्रानी पाठ भावी उलटफेर की प्रतिज्ञा करता है, लेकिन यह नहीं बताता कि वह निकट-ऐतिहासिक, युगान्तकारी या प्रतिरूपात्मक है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘अन्त के दिनों’ में बाइबलीय कालगत गूँज और ‘न्याय-वचन’ में समापन-सूत्र का न्यायिक अर्थ सुरक्षित है।
