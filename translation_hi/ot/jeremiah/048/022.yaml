  text: וְ/עַל דִּיב֣וֹן וְ/עַל נְב֔וֹ וְ/עַל בֵּ֖ית דִּבְלָתָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/022.yaml
  text: and against Dibon[a], and against Nebo, and against Beth-diblathaim—
translation:
  language: hi
  text: और दीबोन पर, और नबो पर, और बेत-दिब्लातैम पर—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/עַל
  choice: और … पर
  rationale: दोहराया गया וְעַל पिछले पद से न्याय के अधीन स्थानों की सूची को आगे बढ़ाता है। हिन्दी में ‘और … पर’ मूल की पुनरावृत्ति तथा ‘पर विपत्ति/न्याय आने’ के निहित भाव को बनाए रखता है।
- source_word: דִּיבוֹן
  choice: दीबोन
  rationale: यह स्थानवाचक नाम है; आधुनिक हिन्दी बाइबलीय नाम-रूप के अनुरूप लिप्यंतरित किया गया है।
- source_word: נְבוֹ
  choice: नबो
  rationale: यहाँ यह किसी देवता की व्याख्या नहीं, बल्कि स्थानवाचक नाम है; इसलिए इसका लिप्यंतरण किया गया है।
- source_word: בֵּית דִּבְלָתָיִם
  choice: बेत-दिब्लातैम
  rationale: संयुक्त स्थानवाचक नाम होने के कारण בֵּית का ‘घर’ के रूप में अनुवाद न करके पूरे नाम को लिप्यंतरित किया गया है; योजक-चिह्न उसकी संयुक्त संरचना स्पष्ट करता है।
theological_decisions:
- issue: עַל में न्याय-विरोध का निहित अर्थ
  choice: ‘पर’ रखकर संदर्भ से न्याय का भाव ग्रहण होने देना
  alternative: ‘के विरुद्ध’
  rationale: हिब्रू पद केवल पुनरावृत्त עַל देता है और क्रिया पिछले संदर्भ से समझी जाती है। ‘पर’ इस संक्षिप्त सूची-रचना और उसकी वास्तविक अस्पष्टता को अधिक निकटता से बनाए रखता है।
translation_notes:
  register: संक्षिप्त, गरिमापूर्ण आधुनिक मानक हिन्दी। स्थान-नामों को देवनागरी में लिप्यंतरित किया गया है और मूल की त्रिस्तरीय पुनरावृत्ति बनाए रखी गई है। अंतिम दीर्घ विराम अगले पद तक चलने वाली सूची को सूचित करता है।
