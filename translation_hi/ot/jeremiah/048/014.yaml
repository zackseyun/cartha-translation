translation:
  language: hi
  text: तुम कैसे कह सकते हो, “हम वीर योद्धा और युद्ध के लिए पराक्रमी पुरुष हैं”?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵיךְ תֹּאמְרוּ
  choice: तुम कैसे कह सकते हो
  rationale: यह अविश्वास और फटकार व्यक्त करने वाला आलंकारिक प्रश्न है। बहुवचन संबोधन को ‘तुम’ और उसकी चुनौतीपूर्ण शक्ति को ‘कैसे कह सकते हो’ से व्यक्त किया गया है।
- source_word: גִּבּוֹרִים
  choice: वीर योद्धा
  rationale: सैन्य प्रसंग में यह शक्तिशाली या वीर लड़ाकों को सूचित करता है। ‘वीर योद्धा’ आधुनिक हिन्दी में स्वाभाविक है और अगले युद्ध-संबंधी पदबंध से मेल खाता है।
- source_word: אֲנָחְנוּ
  choice: हम ... हैं
  rationale: स्वतंत्र सर्वनाम आत्मविश्वास से किए गए दावे पर बल देता है; हिन्दी में ‘हम ... हैं’ उस स्पष्ट आत्म-दावे को बनाए रखता है।
- source_word: וְאַנְשֵׁי חַיִל
  choice: पराक्रमी पुरुष
  rationale: निर्मित पदबंध का अर्थ सामर्थ्य, शौर्य या सैन्य क्षमता वाले पुरुष है। ‘पराक्रमी पुरुष’ इसकी गरिमापूर्ण और युद्ध-संबंधी ध्वनि बनाए रखता है।
- source_word: לַמִּלְחָמָה
  choice: युद्ध के लिए
  rationale: उपसर्ग ל यहाँ संबंध या प्रयोजन दर्शाता है; ‘युद्ध के लिए’ इसे सीधे और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions: []
