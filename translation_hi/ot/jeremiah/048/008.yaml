base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/008.yaml
  text: And the destroyer will come against every city[a], and no city will escape; the valley will perish, and the plain will be destroyed, as Yahweh has said.
translation:
  language: hi
  text: और विनाश करनेवाला हर नगर पर चढ़ आएगा, और कोई नगर बच नहीं पाएगा; घाटी उजड़ जाएगी, और समतल ऊँचा प्रदेश[a] नष्ट हो जाएगा—जैसा यहोवा ने कहा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मैदान” अथवा “पठार।” इब्रानी शब्द समतल भूमि को दर्शाता है और मोआब में ऊँचे पठारी क्षेत्र का नाम हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁדֵד
  choice: विनाश करनेवाला
  rationale: यह कृदंत संज्ञा लूटने और उजाड़नेवाले व्यक्ति को सूचित करती है। प्रसंग में ‘विनाश करनेवाला’ स्वाभाविक है और व्यापक विध्वंस का भाव रखता है।
- source_word: וְיָבֹא אֶל כָּל עִיר
  choice: हर नगर पर चढ़ आएगा
  rationale: אֶל का मूल भाव ‘की ओर’ है, पर आक्रमणकारी के साथ यहाँ शत्रुतापूर्ण आगमन अभिप्रेत है; ‘पर चढ़ आएगा’ इसे स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְעִיר לֹא תִמָּלֵט
  choice: और कोई नगर बच नहीं पाएगा
  rationale: एकवचन ‘नगर’ का प्रयोग वितरणात्मक है; हिन्दी में ‘कोई नगर...नहीं’ पूर्णता के इसी भाव को सहज रूप से व्यक्त करता है।
- source_word: הָעֵמֶק
  choice: घाटी
  rationale: עֵמֶק सामान्यतः घाटी या निम्न घाटी-प्रदेश को दर्शाता है; सप्रसंग निश्चित पद होने पर भी हिन्दी में ‘घाटी’ पर्याप्त है।
- source_word: וְאָבַד
  choice: उजड़ जाएगी
  rationale: स्थान के विषय में אבד विनाश या बरबादी का भाव देता है। ‘उजड़ जाएगी’ हिन्दी में किसी भू-प्रदेश की बरबादी के लिए स्वाभाविक है और अगले क्रियापद की अनावश्यक पुनरावृत्ति से बचाता है।
- source_word: הַמִּישֹׁר
  choice: समतल ऊँचा प्रदेश
  rationale: מִישׁוֹר का अर्थ समतल भूमि है और मोआब के भूगोल में यह ऊँचे पठारी क्षेत्र को सूचित कर सकता है। यह अनुवाद मूल का समतलता-वाला भाव और क्षेत्रीय भौगोलिक संकेत दोनों रखता है।
- source_word: וְנִשְׁמַד
  choice: नष्ट हो जाएगा
  rationale: שׁמד का निफ़अल रूप नष्ट किए जाने या पूर्ण विनाश को दर्शाता है; ‘नष्ट हो जाएगा’ सटीक और संयत है।
- source_word: אֲשֶׁר אָמַר יְהוָה
  choice: जैसा यहोवा ने कहा है
  rationale: यह वाक्य भविष्यवाणी को परमेश्वर की घोषणा पर आधारित करता है। ‘जैसा...कहा है’ सम्बन्धवाचक संरचना का स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में चार-अक्षरीय व्यक्तिगत नाम सीधे आया है। हिन्दी के साधारण बाइबलीय पाठकों में परिचित ‘यहोवा’ उस नाम को उपाधि ‘प्रभु’ से अलग रखते हुए व्यक्त करता है; ‘याहवे’ संभावित उच्चारण का अधिक निकट लिप्यंतरण है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप रखा गया है। आक्रमण के भाव के लिए ‘पर चढ़ आएगा’ और मोआब की भौगोलिक विशेषता के लिए ‘समतल ऊँचा प्रदेश’ चुना गया है।
