source:
  edition: WLC
  text: פַּ֥חַד וָ/פַ֖חַת וָ/פָ֑ח עָלֶ֛י/ךָ יוֹשֵׁ֥ב מוֹאָ֖ב נְאֻם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/043.yaml
  text: Terror and the pit and the snare are upon you[a], inhabitant of Moab[b], declares Yahweh.
translation:
  language: hi
  text: “हे मोआब के निवासी[b], आतंक, गड्ढा और फंदा तुझ पर हैं[a],” याहवे की घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भय, गड्ढा और फंदा तुझ पर हैं।”
    reason: lexical_alternative
  - marker: b
    text: यह त्रिपदी यशायाह 24:17 की अभिव्यक्ति “आतंक, गड्ढा और फंदा” की प्रतिध्वनि है। यहाँ एकवचन “निवासी” मोआब के निवासियों को सामूहिक रूप से सम्बोधित करता है।
    reason: cross_reference
lexical_decisions:
- source_word: פַּחַד
  choice: आतंक
  rationale: यह संज्ञा भय या दहशत की तीव्र अवस्था बताती है। न्याय की भविष्यवाणी के प्रसंग में ‘आतंक’ इसकी प्रबलता और त्रिपदी की लय बनाए रखता है।
- source_word: פַחַת
  choice: गड्ढा
  rationale: यह ऐसा गड्ढा है जिसमें कोई गिरकर फँस जाता है। ‘गड्ढा’ सरल, स्वाभाविक है और यशायाह 24:17 की समान अभिव्यक्ति के अनुरूप है।
- source_word: פָח
  choice: फंदा
  rationale: यह पकड़ने के लिए लगाए गए जाल या फंदे को दर्शाता है। ‘फंदा’ इसे ‘गड्ढा’ से स्पष्ट रूप से अलग रखते हुए चित्रात्मकता बचाता है।
- source_word: עָלֶיךָ
  choice: तुझ पर आ पड़े हैं
  rationale: עַל और द्वितीय पुरुष एकवचन प्रत्यय का मूल अर्थ ‘तुझ पर’ है। हिन्दी में ‘आ पड़े हैं’ आसन्न अथवा घटित न्याय की गति को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יוֹשֵׁב מוֹאָב
  choice: हे मोआब के निवासी
  rationale: एकवचन कृदंत सम्बोधन के रूप में मोआब की निवासी-जनता का प्रतिनिधित्व करता है। हिन्दी में एकवचन बनाए रखने के लिए ‘हे मोआब के निवासी’ चुना गया है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: यह गंभीर भविष्यद्वाणी-सूत्र है। यह रूप נְאֻם की ‘घोषणा/वाणी’ की संज्ञात्मक प्रकृति और वक्ता के अधिकार को स्पष्ट रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत नाम चतुराक्षर को उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण ‘याहवे’ से प्रस्तुत किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुराक्षर व्यक्तिगत नाम के रूप में है। ‘याहवे’ उसका व्यापक रूप से स्वीकृत विद्वत्तापूर्ण लिप्यंतरण है और नाम को उपाधि में नहीं बदलता।
- issue: एकवचन सम्बोधन का प्रतिनिधिक अर्थ
  choice: हे मोआब के निवासी
  alternative: हे मोआब के निवासियो
  rationale: मूल יוֹשֵׁב व्याकरणतः पुल्लिंग एकवचन है, पर सामूहिक जनसंख्या का प्रतिनिधित्व कर सकता है। अनुवाद वास्तविक एकवचन बनाए रखता है और उसके सामूहिक संकेत को टिप्पणी में स्पष्ट करता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘आतंक, गड्ढा और फंदा’ में मूल की ध्वन्यात्मक शब्द-क्रीड़ा पूरी तरह हिन्दी में दोहराई नहीं जा सकती, फिर भी संक्षिप्त त्रिपदी और स्पष्ट आपदा-चित्र बनाए गए हैं। सम्बोधन में ‘तुझ/निवासी’ मूल के एकवचन रूप को सुरक्षित रखता है।
