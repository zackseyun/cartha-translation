- source_word: מִבֵּין סִיחוֹן
  choice: सीहोन के बीच से
  rationale: מִבֵּין के ‘बीच से’ अर्थ को सुरक्षित रखता है और सीहोन को उसके नगर अथवा राज्य के लिए लक्षणा मानने की संभावना खुली छोड़ता है।
- source_word: פְּאַת מוֹאָב
  choice: मोआब के कोने
  rationale: פֵּאָה के मूल काव्यात्मक बिंब ‘कोना’ को सुरक्षित रखता है; इसका आशय छोर या सीमा भी हो सकता है।
- source_word: וְקָדְקֹד בְּנֵי שָׁאוֹן
  choice: कोलाहल मचानेवालों के सिर की चोटी
  rationale: קָדְקֹד को सिर की चोटी और בְּנֵי שָׁאוֹן को शाब्दिक मुहावरे के आशय के अनुसार कोलाहल करनेवाले लोग समझकर प्रस्तुत करता है।
