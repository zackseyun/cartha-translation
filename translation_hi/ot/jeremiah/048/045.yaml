base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/045.yaml
  text: In the shadow of Heshbon the fugitives stand without strength[a], for a fire has gone out from Heshbon, and a flame from the midst of Sihon[d][c][b]; it has consumed the corner of Moab and the crown of the head of the sons of tumult.
translation:
  language: hi
  text: हेशबोन की छाया में भागनेवाले शक्ति के अभाव में खड़े हैं[a], क्योंकि हेशबोन से आग निकली है और सीहोन के बीच से ज्वाला निकली है[b]; उसने मोआब के कोने[c] और कोलाहल के पुत्रों के सिर की चोटी[d] को भस्म कर दिया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भागनेवाले शक्ति के अभाव में खड़े हो गए”; इब्रानी पूर्ण क्रिया का अनुवाद भूतकाल में भी किया जा सकता है, और מִכֹּחַ का अर्थ “शक्ति के अभाव में” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “सीहोन के बीचों-बीच से।” यहाँ “सीहोन” उसके नगर या राज्य का द्योतक हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या, “मोआब के छोर को।” इब्रानी शब्द “कोना” किसी सिरे या सीमा का काव्यात्मक बिंब हो सकता है।
    reason: lexical_alternative
  - marker: d
    text: या, “कोलाहल करनेवालों के सिर की चोटी” अथवा “उपद्रव के पुत्रों के सिर की चोटी।”
    reason: lexical_alternative
