source:
  edition: WLC
  text: לְ/מוֹאָ֡ב כֹּֽה אָמַר֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל ה֤וֹי אֶל נְבוֹ֙ כִּ֣י שֻׁדָּ֔דָה הֹבִ֥ישָׁה נִלְכְּדָ֖ה קִרְיָתָ֑יִם הֹבִ֥ישָׁה הַ/מִּשְׂגָּ֖ב וָ/חָֽתָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/001.yaml
  text: 'Concerning Moab: Thus says Yahweh of hosts[a], the God of Israel: Woe to Nebo, for it is devastated. Kiriathaim is put to shame; it is captured[b]. The stronghold is put to shame and shattered.'
translation:
  language: hi
  text: 'मोआब के विषय में[a]:


    सेनाओं का यहोवा, इस्राएल का परमेश्वर, यों कहता है:


    “नबो पर हाय! क्योंकि वह उजाड़ दिया गया है।


    किर्यातैम को लज्जित किया गया है; वह पकड़ लिया गया है।


    गढ़ को लज्जित किया गया है और वह चूर-चूर हो गया है।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मोआब के विरुद्ध।”
    reason: शीर्षक में לְ न्याय के संदर्भ में विरोधसूचक भी समझा जा सकता है।
lexical_decisions:
- source_word: לְמוֹאָב
  choice: मोआब के विषय में
  rationale: भविष्यवाणी के शीर्षक में לְ का अर्थ व्यापक है। ‘के विषय में’ न्याय के संदर्भ को व्यक्त होने देता है, पर स्वयं संबंधबोधक को अनावश्यक रूप से विरोधसूचक नहीं बनाता।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम को ‘यहोवा’ के रूप में रखा गया है और צְבָאוֹת को स्वर्गीय तथा सांसारिक सेनाओं पर प्रभुता दर्शाने वाले परिचित शीर्षक ‘सेनाओं का’ से व्यक्त किया गया है।
- source_word: הוֹי אֶל נְבוֹ
  choice: नबो पर हाय!
  rationale: הוֹי में विलाप और न्याय की घोषणा दोनों का बल है; ‘पर हाय’ आधुनिक हिन्दी में इस भविष्यसूचक उद्घोष को संक्षेप में व्यक्त करता है।
- source_word: כִּי שֻׁדָּדָה
  choice: क्योंकि वह उजाड़ दिया गया है
  rationale: שׁדד का कर्मवाच्य रूप लूट-पाट से हुई तबाही या उजाड़ को दर्शाता है। यह अनुवाद केवल लूटे जाने या पूर्णतः नष्ट होने तक अर्थ को सीमित नहीं करता।
- source_word: הֹבִישָׁה
  choice: लज्जित हुआ
  rationale: हिफ़ील रूप यहाँ अपमानित या लज्जित दशा में ला दिए जाने का भाव देता है। हिन्दी में संदर्भ के भीतर ‘लज्जित हुआ’ सहज है और केवल भीतरी भावना तक सीमित नहीं रहता।
- source_word: נִלְכְּדָה
  choice: पकड़ लिया गया है
  rationale: सैनिक संदर्भ में לכד का निफ़ाल रूप किसी नगर के अधिकार में ले लिए जाने को बताता है।
- source_word: הַמִּשְׂגָּב
  choice: गढ़
  rationale: संज्ञा का सामान्य अर्थ ऊँचा सुरक्षित स्थान या गढ़ है, और निश्चित उपपद इसे सामान्य संज्ञा मानने का समर्थन करता है। स्थाननाम ‘मिसगाब’ की संभावना पादटिप्पणी में रखी गई है।
- source_word: וָחָתָּה
  choice: और चूर-चूर हो गया है
  rationale: חתת टूटने, चकनाचूर होने अथवा भयभीत होने का भाव दे सकता है। नगरों के उजड़ने और पकड़े जाने के समानांतर यहाँ ठोस विनाशसूचक अर्थ उपयुक्त है, जबकि मूल की तीव्रता बनी रहती है।
theological_decisions:
- issue: न्याय की भविष्यवाणी के शीर्षक में לְ का अर्थ
  choice: मोआब के विषय में
  alternative: मोआब के विरुद्ध
  rationale: अध्याय का विषय न्याय है, पर לְ स्वयं स्पष्ट रूप से केवल विरोधसूचक नहीं है। मुख्य पाठ व्यापक अर्थ रखता है और वैकल्पिक विरोधसूचक अर्थ पादटिप्पणी में दिया गया है।
- issue: הַמִּשְׂגָּב को सामान्य संज्ञा या स्थाननाम मानना
  choice: 'सामान्य संज्ञा: ‘गढ़’'
  alternative: 'स्थाननाम: ‘मिसगाब’'
  rationale: निश्चित उपपद और सामान्य शब्दार्थ ‘गढ़’ का समर्थन करते हैं। फिर भी स्थाननाम की प्राचीन और अनुवादगत संभावना को दबाया नहीं गया है।
- issue: ईश्वरीय नाम יהוה का प्रस्तुतीकरण
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में प्रयुक्त व्यक्तिगत ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण द्वारा सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण भविष्यसूचक शैली रखी गई है। नगरों के लिए पुल्लिंग क्रियाओं का प्रयोग सामान्य हिन्दी व्यवहार के अनुसार है। काव्यात्मक पंक्ति-विन्यास से मूल की समानांतर न्याय-घोषणाएँ स्पष्ट होती हैं।
