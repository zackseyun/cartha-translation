  text: מִ/בְּכִ֨י יַעְזֵ֤ר אֶבְכֶּה לָּ/ךְ֙ הַ/גֶּ֣פֶן שִׂבְמָ֔ה נְטִֽישֹׁתַ֨יִ/ךְ֙ עָ֣בְרוּ יָ֔ם עַ֛ד יָ֥ם יַעְזֵ֖ר נָגָ֑עוּ עַל קֵיצֵ֥/ךְ וְ/עַל בְּצִירֵ֖/ךְ שֹׁדֵ֥ד נָפָֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/032.yaml
  text: With the weeping of Jazer I weep for you[a], vine of Sibmah; your branches crossed the sea; they reached as far as Jazer[c][b]. Upon your summer fruit and upon your grape harvest the destroyer has fallen.
translation:
  language: hi
  text: याज़ेर के विलाप के साथ मैं तेरे लिए रोऊँगा[a], हे सिबमा की दाखलता! तेरी डालियाँ[b] समुद्र पार कर गईं; वे याज़ेर के समुद्र तक पहुँच गईं[c]। तेरे ग्रीष्म के फलों और अंगूर की कटनी पर विनाशक आ पड़ा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याज़ेर के विलाप से भी अधिक मैं तेरे लिए रोऊँगा”; आरंभिक उपसर्ग में तुलनात्मक भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “तेरे प्ररोह” या “तेरी फैलती डालियाँ।”
    reason: lexical_alternative
  - marker: c
    text: इब्रानी पाठ का शाब्दिक अर्थ “वे याज़ेर के समुद्र तक पहुँच गईं” है। याज़ेर अंतर्देशीय था; इसलिए कुछ लोग इसे काव्यात्मक अतिशयोक्ति मानते हैं, जबकि अन्य “वे याज़ेर तक पहुँच गईं” जैसे पाठ-संशोधन का प्रस्ताव करते हैं।
    reason: textual_variant
lexical_decisions:
- source_word: מִבְּכִי
  choice: के रोने के साथ
  rationale: आरंभिक מִ־ का संबंध यहाँ कठिन है; यह संगति या तुलना सूचित कर सकता है। मुख्य पाठ में काव्यात्मक संगति रखी गई है और तुलनात्मक अर्थ पादटिप्पणी में दिया गया है।
- source_word: אֶבְכֶּה לָּךְ
  choice: मैं तेरे लिए रोऊँगा
  rationale: प्रथम पुरुष एकवचन अपूर्ण क्रिया का भविष्यात्मक रूप हिन्दी में स्वाभाविक है; לְ शोक के विषय को ‘तेरे लिए’ के रूप में व्यक्त करता है।
- source_word: הַגֶּפֶן שִׂבְמָה
  choice: हे सिबमा की दाखलता
  rationale: पदबंध संबोधन है और सिबमा को दाखलता के रूपक में प्रस्तुत करता है। ‘दाखलता’ बाइबलीय गरिमा और कृषि-चित्र दोनों बनाए रखता है।
- source_word: נְטִישֹׁתַיִךְ
  choice: तेरी लताएँ
  rationale: शब्द दाखलता की फैलती शाखाओं, कोपलों या प्ररोहों को सूचित करता है। ‘लताएँ’ प्रसंग में सहज है, जबकि विकल्प पादटिप्पणी में सुरक्षित हैं।
- source_word: עָבְרוּ יָם
  choice: समुद्र पार कर गईं
  rationale: עבר और ים के सीधे तथा सजीव स्थानिक चित्र को सुरक्षित रखा गया है।
- source_word: עַד יָם יַעְזֵר נָגָעוּ
  choice: वे याज़ेर के समुद्र तक पहुँच गईं
  rationale: व्यंजनात्मक मसोराई पाठ में ים को बनाए रखते हुए कठिन भौगोलिक चित्र को बिना संशोधन मुख्य पाठ में रखा गया है।
- source_word: קֵיצֵךְ
  choice: तेरे गरमी के फलों
  rationale: קֵיץ यहाँ ऋतु में पकने वाले फलों को दर्शाता है; ‘गरमी के फल’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: בְּצִירֵךְ
  choice: अंगूर की कटनी
  rationale: दाखबारी प्रसंग में यह विशेषतः अंगूर बटोरने की फसल या कटनी है।
- source_word: שֹׁדֵד
  choice: विनाशक
  rationale: कर्तृवाचक कृदंत लूटने और उजाड़ने वाले को दर्शाता है; ‘विनाशक’ व्यापक तबाही को संक्षेप में व्यक्त करता है।
- source_word: נָפָל
  choice: आ पड़ा है
  rationale: עַל के साथ यह अचानक विपत्ति के किसी वस्तु पर टूट पड़ने का चित्र देता है; हिन्दी मुहावरा उसी प्रभाव को रखता है।
theological_decisions:
- issue: ‘समुद्र’ और ‘याज़ेर’ वाले कठिन पदबंध को संशोधित करना या ज्यों का त्यों रखना
  choice: मुख्य पाठ में मसोराई रूप ‘याज़ेर के समुद्र तक’ रखा गया है।
  alternative: ‘वे याज़ेर तक पहुँच गईं’ अथवा ‘वे याज़ेर तक फैल गईं।’
  rationale: याज़ेर अंतर्देशीय था, इसलिए वाक्य भौगोलिक रूप से कठिन है; फिर भी अनुमानित पाठ-संशोधन को मुख्य पाठ में डालने के बजाय प्राप्त इब्रानी पाठ और उसकी काव्यात्मक अस्पष्टता सुरक्षित रखना उचित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक और गरिमापूर्ण संबोधन रखा गया है। ‘तेरे’ का प्रयोग एकवचन नगर/दाखलता के प्रत्यक्ष संबोधन के कारण है। कठिन मसोराई भूगोल को मुख्य पाठ में सुरक्षित रखकर विकल्प पादटिप्पणी में स्पष्ट किए गए हैं।
