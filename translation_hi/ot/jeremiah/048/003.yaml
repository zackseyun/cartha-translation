translation:
  language: hi
  text: 'होरोनैम से पुकार की आवाज़ आ रही है: उजाड़ और भारी विनाश!'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קוֹל צְעָקָה
  choice: पुकार की आवाज़
  rationale: इब्रानी पदबंध में ‘आवाज़’ और संकट में उठी ‘पुकार’ दोनों तत्व हैं; हिन्दी में इन्हें स्वाभाविक और अर्थपूर्ण ढंग से बनाए रखा गया है।
- source_word: מֵחֹרוֹנָיִם
  choice: होरोनैम से
  rationale: स्थाननाम का लिप्यंतरण किया गया और מִן उपसर्ग का स्रोत-सूचक अर्थ ‘से’ रखा गया।
- source_word: שֹׁד
  choice: उजाड़
  rationale: यहाँ शब्द हिंसक तबाही अथवा ध्वंस की दशा बताता है; ‘उजाड़’ अगले समानार्थी शब्द से कुछ भेद भी बनाए रखता है।
- source_word: שֶׁבֶר גָּדוֹל
  choice: भारी विनाश
  rationale: שֶׁבֶר का मूल बिंब टूटने या चकनाचूर होने का है और प्रसंग में व्यापक विनाश सूचित करता है; גָּדוֹל की तीव्रता के लिए स्वाभाविक हिन्दी ‘भारी’ चुना गया।
