source:
  edition: WLC
  text: כִּ֚י מַעֲלֵ֣ה ה/לחות בִּ/בְכִ֖י יַֽעֲלֶה בֶּ֑כִי כִּ֚י בְּ/מוֹרַ֣ד חוֹרֹנַ֔יִם צָרֵ֥י צַֽעֲקַת שֶׁ֖בֶר שָׁמֵֽעוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/005.yaml
  text: For on the ascent of Luhith they go up with weeping[b][a]; for on the descent of Horonaim they have heard the distressing cry of destruction.
translation:
  language: hi
  text: क्योंकि लूहीत की चढ़ाई पर वे रोते हुए चढ़ते हैं—रोते हुए ही;[a] क्योंकि होरोनैम की उतराई पर उन्होंने विनाश की पीड़ाभरी पुकार सुनी है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में यहाँ ‘रोना/विलाप’ का शब्द बल देने के लिए दोहराया गया है; शब्दशः भाव है, “रोते हुए वह/कोई चढ़ता है—रोते हुए।”
    reason: lexical_alternative
  - marker: b
    text: इस पंक्ति का इब्रानी पाठ कठिन है। कुछ लोग इसका अधिक शब्दशः अर्थ, “शत्रुओं ने विनाश की पुकार सुनी है,” मानते हैं; अन्य इसे “विनाश की पीड़ाभरी पुकार” समझते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: מַעֲלֵה
  choice: चढ़ाई
  rationale: यह शब्द ऊपर जाने वाले मार्ग या ढलान को दर्शाता है और आगे आने वाली ‘उतराई’ के साथ स्थलाकृतिक विरोध बनाए रखता है।
- source_word: הַלֻּחוֹת
  choice: लूहीत
  rationale: संदर्भ में यह स्थान का नाम है; इसलिए इसका अनुवाद करने के बजाय देवनागरी में लिप्यंतरण किया गया है।
- source_word: בִּבְכִי ... בֶּכִי
  choice: रोते हुए ... हाँ, रोते हुए
  rationale: इब्रानी में ‘रोना’ संज्ञा की पुनरावृत्ति विलाप की तीव्रता पर बल देती है। हिंदी में स्वाभाविकता रखते हुए पुनरावृत्ति भी सुरक्षित रखी गई है।
- source_word: יַעֲלֶה
  choice: वे ... चढ़ते हैं
  rationale: रूप व्याकरणतः एकवचन पुल्लिंग है, पर संदर्भ में यह मोआब से भाग रहे लोगों के लिए सामूहिक अथवा अनिश्चित प्रयोग है; हिंदी में बहुवचन उसका आशय स्पष्ट करता है।
- source_word: בְּמוֹרַד
  choice: उतराई पर
  rationale: यह नीचे की ओर जाने वाले मार्ग या ढलान को व्यक्त करता है और ‘चढ़ाई’ के साथ मूल पाठ का विरोध बनाए रखता है।
- source_word: חוֹרֹנַיִם
  choice: होरोनैम
  rationale: यह स्थान का नाम है, इसलिए उसका देवनागरी लिप्यंतरण किया गया है।
- source_word: צָרֵי
  choice: पीड़ाभरी
  rationale: यह कठिन रूप है। प्रसंग और यशायाह 15:5 के समानांतर कथन के आधार पर इसे पुकार की व्यथा या संकट बताने वाला विशेषण माना गया है; वैकल्पिक व्याख्या पादटिप्पणी में रखी गई है।
- source_word: צַעֲקַת
  choice: पुकार
  rationale: यह ऊँची, संकटपूर्ण पुकार या चीत्कार को दर्शाता है; ‘पुकार’ सामान्य आधुनिक हिंदी में स्पष्ट और गरिमापूर्ण है।
- source_word: שֶׁבֶר
  choice: विनाश
  rationale: न्याय की इस भविष्यवाणी में यह टूटने, विध्वंस या सर्वनाश की विपत्ति को दर्शाता है; ‘विनाश’ अर्थ को स्पष्ट रूप से संप्रेषित करता है।
- source_word: שָׁמֵעוּ
  choice: उन्होंने ... सुनी है
  rationale: इब्रानी पूर्णकाल बहुवचन को जीवंत वृत्तांत के अनुरूप हिंदी वर्तमान पूर्ण में रखा गया है; कर्ता मूल पाठ की तरह संदर्भ से समझा जाता है।
theological_decisions:
- issue: צָרֵי की व्याकरणिक और अर्थगत अस्पष्टता
  choice: इसे पुकार का गुण बताकर ‘पीड़ाभरी पुकार’ अनूदित किया गया है।
  alternative: इसे बहुवचन संज्ञा मानकर ‘शत्रुओं ने विनाश की पुकार सुनी है’ पढ़ा जा सकता है।
  rationale: पाठ का रूप कठिन है। संदर्भ और समानांतर भविष्यवाणी व्यथा से भरी पुकार का समर्थन करते हैं, पर शत्रुओं को कर्ता मानने की वास्तविक भाषिक संभावना को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप अपनाया गया है। ‘चढ़ाई/उतराई’ से मूल की स्थलाकृतिक समानता और विरोध सुरक्षित हैं। स्थान-नामों का अनुवाद न करके प्रचलित ध्वनि के निकट देवनागरी लिप्यंतरण किया गया है।
