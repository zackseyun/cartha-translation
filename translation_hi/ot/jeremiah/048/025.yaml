  edition: WLC
  text: נִגְדְּעָה֙ קֶ֣רֶן מוֹאָ֔ב וּ/זְרֹע֖/וֹ נִשְׁבָּ֑רָה נְאֻ֖ם יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/025.yaml
  text: The horn of Moab is cut off[a], and his arm is broken, declares Yahweh.
translation:
  language: hi
  text: मोआब का सींग काट दिया गया है[a], और उसकी बाँह तोड़ दी गई है—यह याहवे की घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘सींग’ और ‘बाँह’ सामर्थ्य और शक्ति के रूपक हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: נִגְדְּעָה
  choice: काट दिया गया है
  rationale: גדע के निफ़अल रूप का अर्थ काट दिया जाना या काट गिराया जाना है। यहाँ सींग के रूपक के साथ ‘काट दिया गया है’ स्वाभाविक है और सामर्थ्य छीन लिए जाने का चित्र बनाए रखता है।
- source_word: קֶרֶן
  choice: सींग
  rationale: शाब्दिक अर्थ ‘सींग’ है, जो भविष्यवाणी-काव्य में सामर्थ्य और पराक्रम का रूपक है। व्याख्यात्मक ‘शक्ति’ रखने के बजाय मूल बिंब सुरक्षित रखा गया है।
- source_word: מוֹאָב
  choice: मोआब
  rationale: राष्ट्र और भूभाग के नाम का प्रचलित हिन्दी रूप।
- source_word: וּזְרֹעוֹ
  choice: और उसकी बाँह
  rationale: זְרוֹעַ का शाब्दिक अर्थ ‘बाँह’ है और यह सामर्थ्य या सैन्य शक्ति का रूपक भी है। पुल्लिंग एकवचन प्रत्यय को मानवीकृत मोआब के संदर्भ में ‘उसकी’ कहा गया है।
- source_word: נִשְׁבָּרָה
  choice: तोड़ दी गई है
  rationale: שבר के निफ़अल रूप में टूटने या तोड़े जाने का भाव है। हिन्दी में ‘बाँह तोड़ दी गई है’ समानांतर निष्क्रिय संरचना तथा काव्यात्मक बिंब दोनों को स्पष्ट रखता है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: נְאֻם का गंभीर भविष्यवाणी-सूत्र ‘घोषणा’ से व्यक्त होता है और יְהוָה को उसके व्यक्तिगत वाचा-नाम ‘याहवे’ के रूप में रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुरक्षरी व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसे उपाधि में बदले बिना और किसी सांप्रदायिक व्याख्या को आरोपित किए बिना प्रस्तुत करता है।
- issue: मोआब के सींग और बाँह का आशय
  choice: दोनों रूपकों को मुख्य पाठ में बनाए रखना
  alternative: मोआब की शक्ति और सामर्थ्य नष्ट कर दिए गए हैं
  rationale: मूल की समानांतर काव्यात्मक छवियाँ शक्ति के विनाश को व्यक्त करती हैं। अर्थ को मुख्य पाठ में सपाट करने के बजाय पादटिप्पणी में समझाया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी। मूल की दो समानांतर देहात्मक छवियाँ तथा भविष्यवाणी की गंभीर घोषणा सुरक्षित रखी गई हैं।
