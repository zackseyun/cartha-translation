source:
  edition: WLC
  text: עַ֣ל כָּל גַּגּ֥וֹת מוֹאָ֛ב וּ/בִ/רְחֹבֹתֶ֖י/הָ כֻּלֹּ֣/ה מִסְפֵּ֑ד כִּֽי שָׁבַ֣רְתִּי אֶת מוֹאָ֗ב כִּ/כְלִ֛י אֵֽין חֵ֥פֶץ בּ֖/וֹ נְאֻם יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/038.yaml
  text: On all the rooftops of Moab and in her squares[a], everywhere there is mourning; for I have broken Moab like a vessel in which there is no delight, declares Yahweh.
translation:
  language: hi
  text: मोआब की सभी छतों पर और उसके चौकों में हर जगह विलाप है; क्योंकि मैंने मोआब को ऐसे पात्र की तरह तोड़ दिया है, जिसमें किसी की रुचि नहीं है—याहवे की यह घोषणा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גַּגּוֹת
  choice: छतों
  rationale: यह बहुवचन प्राचीन निकट-पूर्व के घरों की सपाट छतों को दर्शाता है; ‘छतों’ सहज और ठोस हिन्दी है।
- source_word: רְחֹבֹתֶיהָ
  choice: उसके चौकों
  rationale: רְחוֹב प्रायः नगर के खुले सार्वजनिक स्थान या चौक को सूचित करता है, केवल संकरी सड़क को नहीं।
- source_word: כֻּלֹּה מִסְפֵּד
  choice: हर जगह विलाप हो रहा है
  rationale: यह पूरे सार्वजनिक क्षेत्र में छाए शोक और उसके मुखर प्रदर्शन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שָׁבַרְתִּי
  choice: मैंने ... तोड़ डाला है
  rationale: इब्रानी पूर्ण क्रिया कार्य को संपन्न रूप में प्रस्तुत करती है; ‘तोड़ डाला है’ विनाश की तीव्रता भी बनाए रखता है।
- source_word: כִּכְלִי
  choice: उस पात्र के समान
  rationale: כְּלִי पात्र, बरतन या उपकरण के लिए व्यापक शब्द है; ‘पात्र’ अगली उपवाक्य-रचना के साथ उपयुक्त रहता है।
- source_word: אֵין חֵפֶץ בּוֹ
  choice: जिससे किसी को प्रसन्नता नहीं
  rationale: यह इब्रानी की ‘जिसमें/जिससे कोई प्रसन्नता नहीं’ संरचना और अनचाहे या अनुपयोगी पात्र के निहित अर्थ—दोनों को बचाता है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: यह भविष्यद्वाणी के गंभीर सूत्र को स्पष्ट, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में आए ईश्वरीय व्यक्तिगत नाम YHWH का लिप्यंतरण किया गया है, उसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल में चतुरक्षरीय व्यक्तिगत नाम है; ‘याहवे’ उसका व्यापक रूप से स्वीकृत विद्वत्तापूर्ण लिप्यंतरण है।
- issue: אֵין חֵפֶץ בּוֹ में प्रसन्नता और इच्छा/मूल्य का संबंध
  choice: जिससे किसी को प्रसन्नता नहीं
  alternative: जिसे कोई नहीं चाहता
  rationale: मुख्य पाठ חֵפֶץ के ‘प्रसन्नता/रुचि’ अर्थ को बनाए रखता है और व्यक्ति-सूचक ‘किसी को’ से हिन्दी को स्वाभाविक बनाता है; अधिक मुहावरेदार निहितार्थ फुटनोट में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सार्वजनिक पाठ के योग्य गरिमापूर्ण किंतु सहज शैली। ‘विलाप’ भविष्यद्वाणी के शोक-संदर्भ को बनाए रखता है, और वाक्य में मोआब के सर्वत्र सार्वजनिक शोक से याहवे द्वारा किए गए विनाश की ओर स्पष्ट गति रखी गई है।
