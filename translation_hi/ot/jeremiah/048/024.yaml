base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/024.yaml
  text: and against Kerioth[a], and against Bozrah, and against all the cities of the land of Moab, far and near.
translation:
  language: hi
  text: और केरिय्योत के विरुद्ध, और बोस्रा के विरुद्ध, और मोआब देश के सभी नगरों के विरुद्ध—दूर के भी और पास के भी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “दूर के और पास के”; अर्थात मोआब का कोई नगर इससे बाहर नहीं है।
    reason: इब्रानी के विशेषणात्मक पदबंध और उसमें निहित समग्रता को स्पष्ट करना।
lexical_decisions:
- source_word: וְעַל
  choice: और ... के विरुद्ध
  rationale: व्यापक भविष्यवाणी के संदर्भ में बार-बार आया עַל दण्ड की शत्रुतापूर्ण दिशा बताता है; ‘के विरुद्ध’ आधुनिक हिन्दी में इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: קְרִיּוֹת
  choice: करिय्योत
  rationale: यहाँ यह बहुवचन-सदृश रूप वाला स्थाननाम है, इसलिए इसका अर्थ ‘नगर’ न करके लिप्यंतरण किया गया है।
- source_word: בָּצְרָה
  choice: बोस्रा
  rationale: यह मोआब के एक नगर का स्थाननाम है; इसलिए इसे सामान्य संज्ञा की तरह अनूदित न करके लिप्यंतरित किया गया है।
- source_word: כָּל עָרֵי אֶרֶץ מוֹאָב
  choice: मोआब देश के सभी नगरों
  rationale: यह चयन इब्रानी संबंधसूचक पदबंध को स्पष्ट और सहज हिन्दी में बनाए रखता है।
- source_word: הָרְחֹקוֹת וְהַקְּרֹבוֹת
  choice: दूर के भी और पास के भी
  rationale: दोनों स्त्रीलिंग बहुवचन विशेषण ‘नगरों’ को विशेषित करते हैं। ‘भी ... भी’ दूर और पास के नगरों को समेटने वाली समग्रता को सहज हिन्दी में व्यक्त करता है।
