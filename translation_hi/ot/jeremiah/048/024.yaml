  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक पठन के अनुकूल रखी गई है। ‘के विरुद्ध’ की पुनरावृत्ति मूल पाठ की लय और न्याय-सूची की संरचना को सुरक्षित रखती है।
