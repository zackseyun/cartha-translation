language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הִשְׁבַּתִּ֥י לְ/מוֹאָ֖ב נְאֻם יְהוָ֑ה מַעֲלֶ֣ה בָמָ֔ה וּ/מַקְטִ֖יר לֵ/אלֹהָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/035.yaml
  text: And I will put an end in Moab—oracle of Yahweh—to the one who goes up to the high place and burns incense to his god[a].
translation:
  language: hi
  text: और मैं मोआब में—यह याहवे की वाणी है—ऊँचे स्थान पर चढ़नेवाले और अपने देवता के लिए धूप जलानेवाले का अन्त कर दूँगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और मैं मोआब में ऊँचे स्थानों की उपासना बन्द करा दूँगा …।” इब्रानी में ‘चढ़नेवाला’ और ‘धूप जलानेवाला’ एकवचन कृदन्त हैं; वे सामान्य रूप से सभी उपासकों का प्रतिनिधित्व कर सकते हैं। ‘धूप जलाना’ का अनुवाद “बलि का धुआँ चढ़ाना” भी हो सकता है।
    reason: प्रतिनिधिक एकवचन और कर्मकाण्डीय क्रिया के अर्थ-क्षेत्र की वास्तविक अस्पष्टता बताने के लिए।
lexical_decisions:
- source_word: וְהִשְׁבַּתִּי
  choice: मैं … का अन्त कर दूँगा
  rationale: שׁבת के हिफ़ईल रूप का कारक अर्थ है—किसी व्यक्ति या गतिविधि को बन्द करा देना। यहाँ ‘अन्त कर दूँगा’ स्वाभाविक हिन्दी में उसके प्रबल भाव को बनाए रखता है।
- source_word: לְמוֹאָב
  choice: मोआब में
  rationale: यहाँ לְ स्थान अथवा कार्यक्षेत्र सूचित करता है; न्याय के फलस्वरूप यह उपासना मोआब के भीतर समाप्त होगी।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की वाणी है
  rationale: נְאֻם एक गम्भीर भविष्यद्वाणी-सूत्र है। ‘वाणी’ इसके संज्ञात्मक स्वरूप को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय लिप्यन्तरित किया गया है।
- source_word: מַעֲלֶה בָמָה
  choice: ऊँचे स्थान पर चढ़नेवाले
  rationale: עלה के कृदन्त का मूल बिम्ब ‘चढ़ना’ है और בָמָה उपासना के लिए प्रयुक्त ऊँचा स्थान है। अनुवाद उस बिम्ब और प्रतिनिधिक एकवचन दोनों को रखता है।
- source_word: וּמַקְטִיר
  choice: और … धूप जलानेवाले
  rationale: कर्मकाण्डीय सन्दर्भ में קטר का हिफ़ईल सामान्यतः धूप अथवा बलि का धुआँ उठाने को बताता है। ‘धूप जलाना’ यहाँ संक्षिप्त और सुबोध है, जबकि सम्भव व्यापक अर्थ को टिप्पणी में स्वीकार किया गया है।
- source_word: לֵאלֹהָיו
  choice: अपने देवता के लिए
  rationale: प्रत्यय पुल्लिंग एकवचन है और सन्दर्भ में אֱלֹהִים किसी एक उपास्य देवता को सूचित करता है। हिन्दी में ‘अपने’ कर्ता से सम्बन्ध स्पष्ट करता है।
theological_decisions:
- issue: यְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम है; लिप्यन्तरण उस नाम को उपाधि में बदलने से बचाता है।
- issue: मोआब में किसका अन्त किया जाएगा
  choice: ऊँचे स्थान पर चढ़नेवाले और धूप जलानेवाले उपासक का
  alternative: ऊँचे स्थान की उपासना का सामान्यतः अन्त
  rationale: मूल में दोनों कृदन्त पुल्लिंग एकवचन हैं और स्वाभाविक रूप से प्रतिनिधिक उपासक को चित्रित करते हैं। फिर भी वे पूरी उपासना-प्रथा का सामूहिक संकेत हो सकते हैं; इस वास्तविक अस्पष्टता को पाद-टिप्पणी में रखा गया है।
- issue: קטר का कर्मकाण्डीय अर्थ
  choice: धूप जलाना
  alternative: बलि का धुआँ चढ़ाना
  rationale: ‘धूप जलाना’ इस क्रिया का सामान्य कर्मकाण्डीय अर्थ है, पर इब्रानी शब्द अन्य धूमित चढ़ावों को भी समेट सकता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। ‘चढ़नेवाले … जलानेवाले’ की समान रचना मूल के दो समन्वित कृदन्तों को दर्शाती है। वाक्य के बीच भविष्यद्वाणी-सूत्र को विराम-चिह्नों से अलग किया गया है, और सभी पाद-टिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
