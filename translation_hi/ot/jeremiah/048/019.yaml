source:
  edition: WLC
  text: אֶל דֶּ֛רֶךְ עִמְדִ֥י וְ/צַפִּ֖י יוֹשֶׁ֣בֶת עֲרוֹעֵ֑ר שַׁאֲלִי נָ֣ס וְ/נִמְלָ֔טָה אִמְרִ֖י מַה נִּֽהְיָֽתָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/019.yaml
  text: Stand by the road and watch, inhabitant of Aroer; ask the man who flees and the woman who escapes, “What has happened?”
translation:
  language: hi
  text: हे अरोएर की रहनेवाली, सड़क के किनारे खड़ी होकर देखती रह; भागनेवाले पुरुष और बच निकलनेवाली स्त्री से पूछ, “क्या हुआ है?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶל־דֶּרֶךְ
  choice: सड़क के किनारे
  rationale: शाब्दिक रूप से ‘मार्ग की ओर/मार्ग के पास’; प्रसंग में भागते लोगों से पूछने के लिए सड़क के पास खड़े होने का स्वाभाविक हिंदी रूप।
- source_word: וְצַפִּי
  choice: देखती रह
  rationale: צפה का अर्थ निगाह रखना या चौकसी से देखना है; स्त्रीलिंग एकवचन आज्ञा को लक्ष्य पदबंध के अनुरूप रखा गया है।
- source_word: יוֹשֶׁבֶת עֲרוֹעֵר
  choice: हे अरोएर की रहनेवाली
  rationale: स्त्रीलिंग संबोधन नगर को सामूहिक/व्यक्तिवाचक रूप में संबोधित करता है; हिंदी में संबोधन स्पष्ट और स्वाभाविक है।
- source_word: נָס
  choice: भागनेवाले पुरुष
  rationale: पुल्लिंग एकवचन कृदंत को स्पष्ट किया गया है, जिससे अगले स्त्रीलिंग कृदंत के साथ मूल का लिंग-विरोध बना रहता है।
- source_word: נִמְלָטָה
  choice: बच निकलनेवाली स्त्री
  rationale: स्त्रीलिंग एकवचन रूप को स्पष्ट रूप से व्यक्त किया गया है; अर्थ केवल भागना नहीं, संकट से बच निकलना है।
- source_word: מַה נִּהְיָתָה
  choice: क्या हुआ है?
  rationale: घटित घटना के विषय में प्रश्न का सीधा और प्रचलित हिंदी रूप।
theological_decisions: []
