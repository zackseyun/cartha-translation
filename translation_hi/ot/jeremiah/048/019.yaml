  register: आधुनिक मानक हिंदी; नगर को स्त्रीलिंग एकवचन में दिए गए सीधे संबोधन और आज्ञार्थक क्रियाओं को सुरक्षित रखा गया है। भाषा गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज है।
