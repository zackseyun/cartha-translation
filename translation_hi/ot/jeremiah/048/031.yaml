base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/031.yaml
  text: Therefore I will wail over Moab[a], and I will cry out for all Moab[b]; for the men of Kir-heres one moans.
translation:
  language: hi
  text: इसलिए मैं मोआब के लिए विलाप करूँगा, और पूरे मोआब के लिए पुकारूँगा; कीर-हेरेस[a] के पुरुषों के लिए कोई कराहता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कीर-हरेसेत।” समानांतर प्रसंगों में इस स्थान-नाम का एक संबंधित, अधिक विस्तृत रूप मिलता है।
    reason: alternative_reading
  - marker: b
    text: अंतिम खंड कठिन है। इसका अनुवाद “कीर-हेरेस के पुरुषों के लिए मैं कराहता हूँ” या “कीर-हेरेस के पुरुषों के लिए वह कराहता है” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲיֵלִיל
  choice: विलाप करूँगा
  rationale: हिफ़ील रूप ऊँचे स्वर में शोक प्रकट करने का भाव देता है। ‘विलाप करूँगा’ आधुनिक, स्वाभाविक और गरिमापूर्ण हिन्दी में इसकी तीव्रता को व्यक्त करता है।
- source_word: אֶזְעָק
  choice: पुकारूँगा
  rationale: זעק संकट या शोक में ऊँची पुकार को दर्शाता है। ‘पुकारूँगा’ पहले क्रियापद से भेद बनाए रखते हुए शोकपूर्ण संदर्भ के अनुकूल है।
- source_word: כֻּלֹּה
  choice: पूरे
  rationale: לְמוֹאָב כֻּלֹּה का अर्थ समूचे मोआब से है; ‘पूरे मोआब’ स्वाभाविक हिन्दी में सामूहिक व्यापकता बनाए रखता है।
- source_word: אֶל
  choice: के लिए
  rationale: यद्यपि אֶל का सामान्य अर्थ ‘की ओर’ है, यहाँ कराहने के प्रसंग में यह शोक के विषय या लक्ष्य को सूचित कर सकता है।
- source_word: אַנְשֵׁי קִיר חֶרֶשׂ
  choice: कीर-हेरेस के पुरुषों
  rationale: אַנְשֵׁי का शाब्दिक अर्थ ‘पुरुष’ है, इसलिए इसे लिंग-निरपेक्ष ‘लोगों’ में नहीं बदला गया। स्थान-नाम को प्रस्तुत इब्रानी रूप के अनुसार ‘कीर-हेरेस’ लिप्यंतरित किया गया है।
- source_word: יֶהְגֶּה
  choice: वह कराहता है
  rationale: הגה धीमी ध्वनि, बुदबुदाहट या कराह को व्यक्त कर सकता है; इस शोकगीत में ‘कराहता है’ उपयुक्त है। इब्रानी में कर्ता अस्पष्ट है, इसलिए उस अस्पष्टता को पादटिप्पणी में रखा गया है।
