  edition: WLC
  text: הַשְׁכִּירֻ֕/הוּ כִּ֥י עַל יְהוָ֖ה הִגְדִּ֑יל וְ/סָפַ֤ק מוֹאָב֙ בְּ/קִיא֔/וֹ וְ/הָיָ֥ה לִ/שְׂחֹ֖ק גַּם הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/026.yaml
  text: Make him drunk[a], because he has magnified himself against Yahweh; and Moab shall wallow in his vomit, and he too shall become a laughingstock.
translation:
  language: hi
  text: उसे नशे में धुत्त कर दो, क्योंकि उसने याहवे के विरुद्ध अपने आप को बड़ा बनाया है। मोआब अपनी उलटी में लोटेगा[a], और वह भी हँसी का पात्र बनेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मोआब अपनी उलटी में हाथ मारेगा।” इब्रानी क्रिया का अधिक शाब्दिक अर्थ “ताली बजाना” या “हाथ मारना” हो सकता है; इस संदर्भ में “लोटेगा” नशे से हुई अपमानजनक दशा के चित्र से बेहतर मेल खाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְׁכִּירֻהוּ
  choice: उसे मतवाला कर दो
  rationale: बहुवचन आज्ञार्थक और एकवचन पुल्लिंग कर्म को रखते हुए שׁכר के कारक अर्थ को स्वाभाविक, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: आज्ञा का कारण स्पष्ट करने वाले कारणवाचक संबंध को सीधे व्यक्त करता है।
- source_word: עַל יְהוָה
  choice: यहोवा के विरुद्ध
  rationale: הגדיל के साथ עַל यहाँ विरोध की दिशा बताता है; ईश्वरीय नाम को व्यक्तिनाम के रूप में रखा गया है।
- source_word: הִגְדִּיל
  choice: अपने आपको बड़ा ठहराया है
  rationale: हिफ़ील रूप के आत्मोन्नयन और घमंडी विरोध के भाव को रखते हुए केवल सामान्य 'घमंड किया' की तुलना में स्रोत की आकृति के अधिक निकट है।
- source_word: וְסָפַק
  choice: लोटेगा
  rationale: उलटी के संदर्भ में नशे से उत्पन्न अपमानजनक दशा का सुसंगत चित्र देता है; क्रिया का अधिक शाब्दिक अर्थ ताली बजाना या हाथ मारना भी संभव है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: בְּקִיאוֹ
  choice: अपनी ही उलटी में
  rationale: בְ और एकवचन संबंधसूचक प्रत्यय को ठोस तथा स्वाभाविक हिन्दी में व्यक्त करता है; 'ही' अपमान की आत्म-संबद्धता को उभारता है।
- source_word: וְהָיָה לִשְׂחֹק
  choice: हँसी का पात्र बनेगा
  rationale: उपहास की परिणामी अवस्था को आधुनिक और सहज हिन्दी में व्यक्त करता है।
- source_word: גַּם הוּא
  choice: वह भी
  rationale: मोआब पर भी वही उपहास आने के जोर को संक्षेप में बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में चतुरक्षरीय व्यक्तिनाम सीधे आया है। हिन्दी के सामान्य बाइबलीय पाठकों के लिए परिचित व्यक्तिनाम 'यहोवा' चुना गया है, न कि उपाधि 'प्रभु'; 'याहवे' अधिक निकट लिप्यंतरण का संभव विकल्प है।
- issue: הִגְדִּיל में निहित आत्मोन्नयन
  choice: अपने आपको बड़ा ठहराया है
  alternative: घमंड किया है
  rationale: यह चयन मोआब के यहोवा के विरुद्ध स्वयं को महान बनाने की क्रियात्मक छवि बचाता है और पाठ में निहित विरोध को केवल मनोभाव तक सीमित नहीं करता।
- issue: וְסָפַק की संदर्भगत व्याख्या
  choice: अपनी उलटी में लोटेगा
  alternative: अपनी उलटी में हाथ मारेगा/ताली बजाएगा
  rationale: शराबी न्याय और अपमान के संदर्भ में 'लोटेगा' चित्र को सुसंगत बनाता है, पर इब्रानी क्रिया का अधिक शाब्दिक विकल्प वास्तविक रूप से संभव होने के कारण पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। मोआब के लिए मूल के पुल्लिंग एकवचन संकेत के अनुरूप ‘उसे/उसने/वह’ रखा गया है। वाक्य की कठोर न्याय-छवि और सार्वजनिक अपमान का स्वर नरम नहीं किया गया।
