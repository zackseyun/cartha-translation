id: JER.33.1
reference: Jeremiah 33:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יְהִ֧י דְבַר יְהוָ֛ה אֶֽל יִרְמְיָ֖הוּ שֵׁנִ֑ית וְ/הוּא֙ עוֹדֶ֣/נּוּ עָצ֔וּר בַּ/חֲצַ֥ר הַ/מַּטָּרָ֖ה לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/001.yaml
  text: And the word of Yahweh came to Jeremiah a second time while he was still confined in the court of the guard[a], saying,
translation:
  language: hi
  text: 'जब यिर्मयाह को अभी भी पहरे के आँगन[a] में बंद रखा गया था, तब याहवे का वचन दूसरी बार उसके पास आया:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बंदीगृह के आँगन।” इब्रानी पद संभवतः पहरे में रखे गए बंदियों के लिए सुरक्षित आँगन अथवा पहरेदारों के घेरे को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי דְבַר יְהוָה
  choice: तब याहवे का वचन ... आया
  rationale: यह भविष्यसूचक प्रकाशन का प्रचलित सूत्र है। ‘वचन’ मूल की औपचारिक और धर्मवैचारिक शक्ति बनाए रखता है, जबकि ‘तब ... आया’ हिन्दी में कथानक की स्वाभाविक प्रगति व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम टेट्राग्रामटन है; इसलिए किसी उपाधि से बदलने के बजाय उसका प्रचलित हिन्दी लिप्यंतरण रखा गया है।
- source_word: אֶל יִרְמְיָהוּ שֵׁנִית
  choice: दूसरी बार उसके पास
  rationale: שֵׁנִית स्पष्ट रूप से क्रम में दूसरी घटना बताता है; ‘दूसरी बार’ केवल ‘फिर’ की अपेक्षा अधिक सटीक है। पहले उपवाक्य में यिर्मयाह का नाम होने के कारण यहाँ ‘उसके’ स्वाभाविक है।
- source_word: וְהוּא עוֹדֶנּוּ עָצוּר
  choice: जब यिर्मयाह को अभी भी ... बंद रखा गया था
  rationale: यह रचना मुख्य घटना की समकालीन परिस्थिति बताती है। निष्क्रिय ‘बंद रखा गया था’ עָצוּר में निहित रोके या निरुद्ध रखे जाने का भाव देता है, पर उसकी कानूनी स्थिति को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: בַּחֲצַר הַמַּטָּרָה
  choice: पहरे के आँगन में
  rationale: חָצֵר का अर्थ आँगन है और מַטָּרָה यहाँ पहरे अथवा हिरासत से जुड़े सुरक्षित घेरे को सूचित करता है। यह अनुवाद संस्थागत परिवेश बनाए रखते हुए उसे आधुनिक औपचारिक जेल मान लेने से बचता है।
- source_word: לֵאמֹר
  choice: ':'
  rationale: यह पद अगले वचन का परिचय देता है। हिन्दी में वाक्य के अंत का द्विबिंदु ‘यह कहते हुए’ जैसे अस्वाभाविक अधूरे प्रयोग की अपेक्षा आगामी प्रत्यक्ष कथन को अधिक सहज ढंग से प्रस्तुत करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: इब्रानी पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। ‘याहवे’ उसे उपाधि में बदले बिना प्रस्तुत करता है; स्वरांकन का प्राचीन उच्चारण पूर्णतः निश्चित न होने पर भी यह व्यापक विद्वत् लिप्यंतरण है।
- issue: ‘याहवे का वचन’ को ‘संदेश’ न बनाना
  choice: वचन
  alternative: संदेश
  rationale: ‘वचन’ मूल भविष्यसूचक सूत्र और उसकी धर्मवैचारिक गूँज को सुरक्षित रखता है, जबकि ‘संदेश’ अर्थ को कुछ अधिक व्याख्यायित कर देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। समयसूचक आश्रित उपवाक्य को पहले रखकर हिन्दी वाक्य-प्रवाह स्वाभाविक बनाया गया है। ‘बंद रखा गया था’ हिरासत का भाव देता है, पर आधुनिक कारावास की विशिष्ट कानूनी धारणा नहीं थोपता।
