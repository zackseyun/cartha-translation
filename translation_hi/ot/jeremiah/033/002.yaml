base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/002.yaml
  text: 'Thus says Yahweh[a], who made it[c][b], Yahweh who formed it to establish it—Yahweh is his name:'
translation:
  language: hi
  text: याहवे[a] यों कहता है—जो उसे[b] बनाता है, याहवे जो उसे रूप देता है ताकि उसे स्थापित करे—याहवे उसका नाम है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में परमेश्वर का व्यक्तिगत नाम YHWH यहाँ तीन बार आया है; इसे ‘याहवे’ लिखा गया है। कुछ अनुवाद इसकी जगह ‘प्रभु’ लिखते हैं।
    reason: alternative_reading
  - marker: b
    text: ‘बनाता है ... रूप देता है ... स्थापित करे’ में ‘उसे’ के लिए इब्रानी प्रत्यय स्त्रीलिंग हैं, पर इस पद में उनका संदर्भ स्पष्ट नहीं किया गया है। इन कृदन्तों का अनुवाद ‘जिसने उसे बनाया ... रूप दिया ताकि उसे स्थापित करे’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: यों कहता है
  rationale: यह भविष्यवाणी की उद्घोषणा का प्रचलित सूत्र है। वर्तमान काल इस वचन की प्रत्यक्ष और प्रभावी घोषणा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में प्रयुक्त परमेश्वर के व्यक्तिगत नाम YHWH को उपाधि से बदलने के बजाय लिप्यंतरित किया गया है; तीनों occurrences में इसे समान रूप से रखा गया है।
- source_word: עֹשָׂהּ
  choice: जो उसे बनाता है
  rationale: यह कृदन्त वर्तमान अथवा निरंतर क्रिया का बोध करा सकता है। स्त्रीलिंग एकवचन प्रत्यय का संदर्भ अस्पष्ट है, इसलिए किसी संज्ञा को जोड़े बिना हिन्दी का संदर्भ-निरपेक्ष ‘उसे’ रखा गया है।
- source_word: יוֹצֵר אוֹתָהּ
  choice: जो उसे आकार देता है
  rationale: יָצַר में उद्देश्यपूर्ण ढंग से गढ़ने या रूप देने का भाव है। ‘आकार देता है’ आधुनिक हिन्दी में स्वाभाविक है और ‘बनाता है’ से अर्थगत भेद भी बनाए रखता है।
- source_word: לַהֲכִינָהּ
  choice: ताकि उसे स्थिर करे
  rationale: כּוּן के हिफ़ील रूप में स्थापित, दृढ़ या स्थिर करने का अर्थ है। उद्देश्यसूचक ל को ‘ताकि’ से व्यक्त किया गया है।
- source_word: שְׁמוֹ
  choice: उसका नाम है
  rationale: यह याहवे के नाम की गंभीर पहचान कराने वाली विधेयात्मक उपवाक्य-रचना को बनाए रखता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पद में वाचा का व्यक्तिगत नाम सीधे तीन बार आया है। ‘याहवे’ मूल नाम का आधुनिक हिन्दी लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: स्त्रीलिंग प्रत्ययों का संदर्भ
  choice: संदर्भ को अनिर्दिष्ट रखते हुए ‘उसे’
  alternative: ‘उस नगरी को’, ‘पृथ्वी को’, अथवा स्त्रीवाचक ‘उसे’ की स्पष्ट व्याख्या
  rationale: इस पद में प्रत्यय स्त्रीलिंग एकवचन हैं, पर उनका पूर्वपद स्पष्ट रूप से नहीं दिया गया। किसी विशिष्ट वस्तु या नगरी को जोड़ना व्याख्यात्मक निर्णय होता; हिन्दी ‘उसे’ इस अस्पष्टता को स्वाभाविक रूप से बनाए रखता है।
- issue: कृदन्तों का कालगत अर्थ
  choice: वर्तमान/निरंतर भाव—‘बनाता है ... आकार देता है’
  alternative: पूर्ण क्रिया—‘जिसने उसे बनाया ... आकार दिया’
  rationale: दोनों इब्रानी कृदन्त वर्तमान, निरंतर या चरित्रगत कार्य व्यक्त कर सकते हैं। वर्तमान हिन्दी रूप मूल की इस संभावना को प्रमुख रखता है, जबकि वैकल्पिक पूर्णतासूचक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘यों कहता है’ भविष्यवाणी-सूत्र की ऊँची शैली बनाए रखता है। मूल की संदर्भगत अस्पष्टता को किसी अनुमानित संज्ञा से नहीं भरा गया; डैश समानाधिकरण और घोषणा की गंभीर लय स्पष्ट करते हैं।
