  text: Call to me[a], and I will answer you, and I will tell you great and hidden things that you have not known.
translation:
  language: hi
  text: मुझे पुकार, और मैं तुझे उत्तर दूँगा। मैं तुझे बड़ी और अगम बातें[a] बताऊँगा, जिन्हें तू अब तक नहीं जानता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दुर्गम बातें” अथवा “गढ़बंद बातें”; इब्रानी शब्द ऐसी बातों का संकेत देता है जो साधारण पहुँच से परे हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: קְרָא אֵלַי
  choice: मुझे पुकार
  rationale: קרא का पुल्लिंग एकवचन आज्ञार्थक रूप परमेश्वर को सीधे संबोधित करने की आज्ञा देता है। ‘मुझे पुकार’ आधुनिक हिन्दी में स्वाभाविक है और मूल में निहित न होने वाली अतिरिक्त तीव्रता नहीं जोड़ता।
- source_word: וְאֶעֱנֶךָ
  choice: और मैं तुझे उत्तर दूँगा
  rationale: ענה यहाँ उत्तर देने के अर्थ में है। ‘उत्तर दूँगा’ प्रतिज्ञा की सीधी और व्यक्तिगत प्रकृति बनाए रखता है।
- source_word: וְאַגִּידָה לְּךָ
  choice: मैं तुझे … बताऊँगा
  rationale: नגד का हिफ़ील रूप बताने, घोषित करने या ज्ञात कराने का अर्थ रखता है। ‘बताऊँगा’ सहज हिन्दी है और वाक्य का व्यक्तिगत स्वर सुरक्षित रखता है।
- source_word: גְּדֹלוֹת
  choice: बड़ी … बातें
  rationale: स्त्रीलिंग बहुवचन विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है। ‘बड़ी बातें’ इसके व्यापक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וּבְצֻרוֹת
  choice: अगम बातें
  rationale: בצר से बना यह रूप गढ़बंद, पहुँच से बाहर या साधारण पहुँच से परे वस्तुओं का बोध करा सकता है। ‘अगम’ उस मूल बिंब को पूरी तरह मिटाए बिना ऐसी बातों को दर्शाता है जो मनुष्य की अपनी पहुँच या समझ से परे हैं।
- source_word: לֹא יְדַעְתָּם
  choice: जिन्हें तू अब तक नहीं जानता
  rationale: पूर्ण रूप संबोधित व्यक्ति की पूर्व और वर्तमान अज्ञानता की ओर संकेत करता है। ‘अब तक नहीं जानता’ हिन्दी में उस वर्तमान-संबद्ध भाव को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय प्रकाशन के संदर्भ में וּבְצֻרוֹת का अर्थ
  choice: मुख्य पाठ में ‘अगम बातें’
  alternative: ‘छिपी बातें’, ‘दुर्गम बातें’ या ‘गढ़बंद बातें’
  rationale: यह शब्द केवल रहस्य का नहीं, बल्कि गढ़बंद या सामान्य पहुँच से परे होने का बिंब भी रखता है। ‘अगम’ प्रकाशन की आवश्यकता और पहुँच से परे होने—दोनों को संक्षेप में बनाए रखता है; अन्य सम्भावनाएँ पाद-टिप्पणी में दी गई हैं।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। एकवचन सम्बोधन के लिए ‘तू/तुझे’ मूल के 2ms रूपों को दर्शाता है और हिन्दी बाइबलीय शैली में परमेश्वर द्वारा किसी व्यक्ति को सीधे संबोधित करने के लिए स्वाभाविक है। अर्धविराम के बजाय दो वाक्य रखे गए हैं ताकि साधारण पाठक के लिए प्रवाह स्पष्ट रहे।
