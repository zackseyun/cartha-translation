base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/006.yaml
  text: Behold[a], I am bringing her healing and cure, and I will heal them, and I will reveal to them an abundance of peace and truth.
translation:
  language: hi
  text: देखो, मैं उसके लिए आरोग्य और उपचार ला रहा हूँ; मैं उन्हें चंगा करूँगा और उनके सामने शांति और सत्य[a] की बहुतायत प्रकट करूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘विश्वासयोग्यता’; इब्रानी शब्द सत्यता, विश्वसनीयता या विश्वासयोग्यता को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: देखो, मैं
  rationale: यह पद गंभीर दैवी घोषणा का संकेत देता है। ‘देखो’ आधुनिक हिन्दी में स्वाभाविक रहते हुए भविष्यवाणी की उद्घोषणात्मक शक्ति बनाए रखता है।
- source_word: מַעֲלֶה
  choice: ला रहा हूँ
  rationale: हिफ़ील कृदन्त आसन्न और सक्रिय दैवी कार्य को व्यक्त करता है; ‘ला रहा हूँ’ इसके कारक और प्रगतिशील भाव को सहज हिन्दी में रखता है।
- source_word: לָּהּ
  choice: उसके लिए
  rationale: स्त्रीलिंग एकवचन प्रत्यय व्यक्तिरूप में चित्रित नगरी/समुदाय की ओर संकेत करता है। ‘उसके लिए’ दत्तिव संबंध को स्पष्ट रखता है।
- source_word: אֲרֻכָה
  choice: आरोग्य
  rationale: यह घाव भरने अथवा स्वास्थ्य की पुनर्स्थापना को सूचित करता है। ‘आरोग्य’ साथ आने वाले चिकित्सकीय रूपक को संक्षेप और गरिमा से व्यक्त करता है।
- source_word: מַרְפֵּא
  choice: उपचार
  rationale: यह चंगाई या उपचार का साधन सूचित करता है। ‘उपचार’ निकटार्थी אֲרֻכָה से हल्का भेद बनाए रखता है और अनावश्यक पुनरुक्ति से बचाता है।
- source_word: וּרְפָאתִים
  choice: मैं उन्हें चंगा करूँगा
  rationale: भविष्याभिमुख क्रिया और बहुवचन कर्म-प्रत्यय दोनों सुरक्षित हैं। इससे स्त्रीलिंग एकवचन नगरी से उसके बहुवचन लोगों की ओर मूल पाठ का बदलाव बना रहता है।
- source_word: וְגִלֵּיתִי
  choice: प्रकट करूँगा
  rationale: अमूर्त वस्तु के साथ ‘प्रकट करना’ मूल के खोलने/प्रकाशित करने के अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: עֲתֶרֶת
  choice: बहुतायत
  rationale: संज्ञा प्रचुरता या भरपूरी बताती है। ‘बहुतायत’ इसे किसी भिन्न समान-वर्तनी शब्द से जुड़े ‘मुकुट’ अर्थ से अलग और स्पष्ट रखता है।
- source_word: שָׁלוֹם
  choice: शांति
  rationale: यह व्यापक रूप से कुशलता और संपूर्णता भी सूचित कर सकता है, पर इस भविष्यवाणी-संबंधी प्रतिज्ञा में ‘शांति’ स्पष्ट और स्वाभाविक है।
- source_word: וֶאֱמֶת
  choice: सत्य
  rationale: אֱמֶת सत्य, विश्वसनीयता या विश्वासयोग्यता सूचित कर सकता है। मुख्य पाठ में सामान्य अर्थ ‘सत्य’ रखा गया है और वैकल्पिक सूक्ष्मता पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: स्त्रीलिंग एकवचन से बहुवचन सर्वनाम की ओर बदलाव
  choice: पहले व्यक्तिरूप में चित्रित नगरी के लिए ‘उसके’, फिर उसके लोगों के लिए ‘उन्हें/उन पर’
  alternative: दोनों सर्वनामों को केवल नगरी के लिए एकसमान करके अनुवाद करना
  rationale: इब्रानी पाठ का व्याकरणिक बदलाव सामूहिक नगरी और उसके लोगों के बीच संबंध को उभारता है; उसे बनाए रखने से मूल की कॉर्पोरेट और व्यक्तिगत छवि सपाट नहीं होती।
- issue: אֱמֶת का अर्थ-क्षेत्र
  choice: मुख्य पाठ में ‘सत्य’
  alternative: ‘विश्वासयोग्यता’ या ‘विश्वसनीयता’
  rationale: मूल शब्द एक से अधिक अर्थ-सूक्ष्मताएँ स्वीकार करता है। मुख्य पाठ सामान्य अर्थ रखता है और पादटिप्पणी वास्तविक वैकल्पिक अर्थ को बिना सिद्धान्तगत रूप से तय किए सुरक्षित करती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सरल किंतु गरिमापूर्ण भविष्यवाणी-शैली में रखी गई है। ‘आरोग्य और उपचार’ चिकित्सकीय निकटार्थी युग्म को बनाए रखते हैं। ‘उसके’ से ‘उन्हें/उन पर’ का बदलाव जानबूझकर सुरक्षित है। पादटिप्पणी-चिह्न को उसी शब्द ‘सत्य’ पर रखा गया है जिससे वह संबंधित है।
