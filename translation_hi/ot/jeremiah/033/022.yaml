source:
  edition: WLC
  text: אֲשֶׁ֤ר לֹֽא יִסָּפֵר֙ צְבָ֣א הַ/שָּׁמַ֔יִם וְ/לֹ֥א יִמַּ֖ד ח֣וֹל הַ/יָּ֑ם כֵּ֣ן אַרְבֶּ֗ה אֶת זֶ֨רַע֙ דָּוִ֣ד עַבְדִּ֔/י וְ/אֶת הַ/לְוִיִּ֖ם מְשָׁרְתֵ֥י אֹתִֽ/י־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/022.yaml
  text: As the host of heaven cannot be counted and the sand of the sea cannot be measured[d][c][b][a], so I will multiply the offspring of David my servant and the Levites who minister to me.
translation:
  language: hi
  text: जैसे आकाश की सेना[a] गिनी नहीं जा सकती[b] और समुद्र की रेत नापी नहीं जा सकती, वैसे ही मैं अपने सेवक दाऊद की संतान[c] और मेरी सेवा करने वाले[d] लेवियों को बहुत बढ़ाऊँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘आकाश की सेना’ इब्रानी मुहावरा है, जो आकाशीय समूह को दर्शाता है और प्रायः तारों को भी सम्मिलित करता है।
    reason: cultural_note
  - marker: b
    text: या ‘जिसकी संख्या नहीं ठहराई जा सकती।’
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से ‘दाऊद का बीज’; इसका अर्थ ‘दाऊद के वंशज’ भी हो सकता है।
    reason: lexical_alternative
  - marker: d
    text: या ‘जो मेरी सेवा करते हैं’; इब्रानी शब्द यहाँ निरंतर उपासना अथवा मंदिर-संबंधी सेवा को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: צְבָא הַשָּׁמַיִם
  choice: आकाश की सेना
  rationale: यह इब्रानी मुहावरे को बनाए रखता है और आकाशीय समुदाय को केवल तारों तक सीमित नहीं करता; सन्दर्भ में तारे सम्भवतः सम्मिलित हैं।
- source_word: יִסָּפֵר
  choice: गिनी नहीं जा सकती
  rationale: ספר के निफ़अल रूप का निष्क्रिय अर्थ ‘गिना जाना’ है; यह आधुनिक हिन्दी में स्वाभाविक और समान्तर चित्र के अनुकूल है।
- source_word: חוֹל הַיָּם
  choice: समुद्र की रेत
  rationale: यह इब्रानी की सीधी और हिन्दी में परिचित अभिव्यक्ति है, जो असंख्य मात्रा का चित्र प्रस्तुत करती है।
- source_word: יִמַּד
  choice: नापी नहीं जा सकती
  rationale: מדד के निफ़अल का अर्थ ‘नापा जाना’ है; ‘नापी’ रेत की अपरिमेय बहुतायत और पहले खण्ड के समान्तर भाव को स्पष्ट रखता है।
- source_word: כֵּן אַרְבֶּה
  choice: वैसे ही ... बहुत बढ़ाऊँगा
  rationale: כֵּן उपमा के दोनों भागों को जोड़ता है और רבה का हिफ़ईल रूप बहुतायत से बढ़ाने का अर्थ देता है।
- source_word: זֶרַע דָּוִד
  choice: दाऊद की सन्तान
  rationale: זֶרַע सामूहिक रूप से बीज, सन्तान या वंशजों को सूचित कर सकता है। ‘सन्तान’ आधुनिक हिन्दी में स्वाभाविक है और सामूहिक अर्थ को खुला रखता है।
- source_word: עַבְדִּי
  choice: अपने सेवक
  rationale: दाऊद के राजकीय-वाचाई सन्दर्भ में ‘सेवक’ नियुक्त सेवा और अधीनता को व्यक्त करता है; ‘दास’ यहाँ अनावश्यक रूप से बन्धुआपन पर बल दे सकता है।
- source_word: הַלְוִיִּם
  choice: लेवियों
  rationale: यह लेवी गोत्र के सदस्यों के लिए प्रचलित हिन्दी रूप है।
- source_word: מְשָׁרְתֵי אֹתִי
  choice: मेरी सेवा करनेवाले
  rationale: कृदन्त निरन्तर सेवा को दर्शाता है। मुख्य पाठ में सहज हिन्दी रखी गई है, जबकि पादटिप्पणी इसके उपासना-सम्बन्धी विशेष अर्थ को स्पष्ट करती है।
theological_decisions:
- issue: प्रतिज्ञा में दाऊद की सन्तान और लेवियों का सम्बन्ध
  choice: पद को दाऊद की सन्तान और यहोवा की सेवा करनेवाले लेवियों—दोनों—को बहुत बढ़ाने की प्रतिज्ञा के रूप में प्रस्तुत किया गया है।
  alternative: लेवियों को यिर्मयाह के ऐतिहासिक समय के मन्दिर-सेवकों तक अधिक संकीर्ण रूप से समझा जा सकता है; इस प्रतिज्ञा को बाद की मसीही पूर्ति से भी जोड़ा जा सकता है।
  rationale: इब्रानी में ‘मैं बढ़ाऊँगा’ के बाद दो समन्वित कर्म हैं। अनुवाद इस समान्तर प्रतिज्ञा को बनाए रखता है और इस पद में स्पष्ट न किए गए किसी बाद के धर्मसैद्धान्तिक ढाँचे को आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किन्तु सहज शैली अपनाई गई है। ‘आकाश की सेना’ जैसा स्रोत-भाषा का अर्थपूर्ण मुहावरा पादटिप्पणी सहित रखा गया है; शेष वाक्य में सरल क्रियाएँ और स्पष्ट समान्तर रचना प्रयुक्त हुई है।
