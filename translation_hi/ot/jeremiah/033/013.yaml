  text: בְּ/עָרֵ֨י הָ/הָ֜ר בְּ/עָרֵ֤י הַ/שְּׁפֵלָה֙ וּ/בְ/עָרֵ֣י הַ/נֶּ֔גֶב וּ/בְ/אֶ֧רֶץ בִּנְיָמִ֛ן וּ/בִ/סְבִיבֵ֥י יְרוּשָׁלִַ֖ם וּ/בְ/עָרֵ֣י יְהוּדָ֑ה עֹ֣ד תַּעֲבֹ֧רְנָה הַ/צֹּ֛אן עַל יְדֵ֥י מוֹנֶ֖ה אָמַ֥ר יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/013.yaml
  text: In the cities of the hill country[a], in the cities of the lowland, and in the cities of the Negeb, and in the land of Benjamin, and around Jerusalem, and in the cities of Judah, the flocks will again pass under the hands of the one who counts them[c][b], says Yahweh.
translation:
  language: hi
  text: “पहाड़ी प्रदेश के नगरों में, निचले प्रदेश[a] के नगरों में, नेगेव[b] के नगरों में, बिन्यामीन के प्रदेश में, यरूशलेम के आस-पास के क्षेत्रों में, और यहूदा के नगरों में भेड़-बकरियों के झुंड फिर से गिनने वाले के हाथों के नीचे से गुजरेंगे[c],” याहवे कहता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शफेला”; यह यहूदा का निम्न पहाड़ी अथवा तलहटी वाला क्षेत्र था।
    reason: lexical_alternative
  - marker: b
    text: या “दक्षिणी प्रदेश”; इब्रानी में “नेगेव,” जो यहूदा के दक्षिण का एक क्षेत्र था।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में शाब्दिक रूप से “गिनने वाले के हाथों के नीचे से।” यह गिनती के लिए पास से गुजरते पशुओं का चरवाही-चित्र है।
    reason: cultural_note
lexical_decisions:
- source_word: בְּעָרֵי הָהָר
  choice: पहाड़ी प्रदेश के नगरों में
  rationale: הָהָר यहाँ किसी एक पहाड़ के बजाय यहूदा के पहाड़ी भूभाग को दर्शाता है; 'पहाड़ी प्रदेश' आधुनिक हिन्दी में स्पष्ट है।
- source_word: הַשְּׁפֵלָה
  choice: निचला प्रदेश
  rationale: यह यहूदा के शफेला नामक निम्न पहाड़ी/तराई भूभाग का भौगोलिक पद है; मुख्य पाठ में अर्थ-सुगम रूप रखा गया है और पादटिप्पणी में नाम दिया गया है।
- source_word: הַנֶּגֶב
  choice: नेगेव
  rationale: यह सामान्यतः केवल 'दक्षिण' नहीं, यहूदा के दक्षिणी भौगोलिक क्षेत्र का नाम है; इसलिए स्थान-नाम सुरक्षित रखा गया है।
- source_word: אֶרֶץ בִּנְיָמִן
  choice: बिन्यामीन का प्रदेश
  rationale: אֶרֶץ यहाँ बिन्यामीन से संबद्ध भूभाग या क्षेत्र को सूचित करता है; 'प्रदेश' हिन्दी में इस भौगोलिक आशय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: סְבִיבֵי יְרוּשָׁלִַם
  choice: यरूशलेम के आस-पास
  rationale: यह यरूशलेम के चारों ओर के इलाकों को सहज और सटीक हिन्दी में व्यक्त करता है।
- source_word: עֹד
  choice: फिर से
  rationale: पुनर्स्थापना के प्रसंग में यह पहले बाधित हो चुकी सामान्य गतिविधि के दोबारा होने को दर्शाता है।
- source_word: תַּעֲבֹרְנָה הַצֹּאן
  choice: भेड़-बकरियों के झुंड गुजरेंगे
  rationale: צֹאן छोटे पालतू पशुओं—मुख्यतः भेड़ और बकरियों—का सामूहिक पद है; स्त्रीलिंग बहुवचन क्रिया के अनुरूप 'झुंड' का बहुवचन रखा गया है।
- source_word: עַל יְדֵי מוֹנֶה
  choice: गिननेवाले के हाथों के नीचे से
  rationale: 'शाब्दिक चरवाही-चित्र सुरक्षित रखा गया है: पशु गिनती या जाँच के समय चरवाहे के हाथ के नीचे से गुजरते हैं।'
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में प्रस्तुत किया गया है।
theological_decisions:
- issue: पुनर्स्थापना को झुंडों की गिनती के चरवाही-चित्र द्वारा व्यक्त करना
  choice: झुंडों के गिननेवाले के हाथों के नीचे से गुजरने का ठोस चित्र बनाए रखा गया है।
  alternative: इसे व्याख्यात्मक रूप से 'झुंड फिर सावधानी से सँभाले जाएँगे' कहना।
  rationale: मूल पाठ सामान्य पशुपालन-जीवन की बहाली का दृश्य देता है। ठोस बिंब बनाए रखने से पाठ में निहित पुनर्स्थापना का अर्थ खुला रहता है और अतिरिक्त धर्मवैज्ञानिक व्याख्या आरोपित नहीं होती।
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: याहवे
  alternative: प्रभु या यहोवा
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम है; 'याहवे' उसका सीधा हिन्दी लिप्यंतरण है और उपाधि से प्रतिस्थापन से बचता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सुबोध रखी गई है। दो विशिष्ट भू-नामों में शफेला का अर्थ मुख्य पाठ में और नाम पादटिप्पणी में दिया गया है, जबकि अधिक परिचित स्थान-नाम 'नेगेव' मुख्य पाठ में रखा गया है। मूल की पुनरावृत्त भौगोलिक संरचना और चरवाही-बिंब को यथासंभव बनाए रखा गया है।
