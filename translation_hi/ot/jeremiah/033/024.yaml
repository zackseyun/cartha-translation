  text: הֲ/ל֣וֹא רָאִ֗יתָ מָֽה הָ/עָ֤ם הַ/זֶּה֙ דִּבְּר֣וּ לֵ/אמֹ֔ר שְׁתֵּ֣י הַ/מִּשְׁפָּח֗וֹת אֲשֶׁ֨ר בָּחַ֧ר יְהוָ֛ה בָּ/הֶ֖ם וַ/יִּמְאָסֵ֑/ם וְ/אֶת עַמִּ/י֙ יִנְאָצ֔וּ/ן מִֽ/הְי֥וֹת ע֖וֹד גּ֥וֹי לִ/פְנֵי/הֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/024.yaml
  text: Have you not seen what this people have spoken[a], saying, ‘The two families that Yahweh chose—he has rejected them’? Thus they despise my people[c][b], so that they should no longer be a nation before them.
translation:
  language: hi
  text: क्या तुमने देखा नहीं कि इन लोगों ने क्या कहा है? वे कहते हैं, “जिन दो कुलों को यहोवा ने चुना था, उसने उन्हें त्याग दिया है।” इस प्रकार वे मेरी प्रजा को तुच्छ समझते हैं और अपनी दृष्टि में उन्हें अब भी एक राष्ट्र नहीं मानते।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘दो कुल’ किन्हें कहते हैं, यह इस पद में स्पष्ट नहीं है। इसका अनुवाद ‘दो परिवार’ या ‘दो वंश-समूह’ भी हो सकता है। अन्तिम शब्दों का अधिक शाब्दिक रूप है: ‘उनके सामने अब भी एक राष्ट्र होने से।’'
    reason: शब्दार्थ और सन्दर्भ की वास्तविक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: הֲלוֹא רָאִיתָ
  choice: क्या तुमने ध्यान नहीं दिया
  rationale: अलंकारिक प्रश्न को बनाए रखते हुए ראה के यहाँ देखने से आगे ध्यान देने या गौर करने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הָעָם הַזֶּה
  choice: ये लोग
  rationale: शाब्दिक ‘यह प्रजा’ सम्भव है, पर यहाँ विरोधपूर्ण बातें करने वाले समूह के लिए ‘ये लोग’ अधिक सहज आधुनिक हिन्दी है और दूरी का भाव भी रखता है।
- source_word: דִּבְּרוּ לֵאמֹר
  choice: क्या कहते हैं? वे कहते हैं
  rationale: हिब्रू के ‘बोले, यह कहते हुए’ को बोझिल बनाए बिना कथन की भूमिका और प्रत्यक्ष उद्धरण स्पष्ट करता है।
- source_word: שְׁתֵּי הַמִּשְׁפָּחוֹת
  choice: दो कुलों
  rationale: מִשְׁפָּחוֹת के परिवार, कुल या वंश-समूह अर्थों में ‘कुल’ इस प्रसंग में उपयुक्त है और किन दो समूहों का संकेत है, यह अनिर्धारित रहने देता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: ईश्वर के व्यक्तिवाचक नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: וַיִּמְאָסֵם
  choice: उसने उन्हें त्याग दिया है
  rationale: מָאַס के अस्वीकार या ठुकराने के अर्थ को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है; उद्धृत वक्ताओं का दावा बना रहता है।
- source_word: וְאֶת עַמִּי יִנְאָצוּן
  choice: इस प्रकार वे मेरी प्रजा को तुच्छ समझते हैं
  rationale: נָאַץ के अवमानना और तिरस्कार के भाव को व्यक्त करता है; ‘इस प्रकार’ पूर्व कथन और इस दृष्टिकोण के सम्बन्ध को स्पष्ट करता है।
- source_word: מִהְיוֹת עוֹד גּוֹי לִפְנֵיהֶם
  choice: उन्हें अपनी दृष्टि में फिर एक जाति नहीं मानते
  rationale: शाब्दिक ‘उनके सामने फिर जाति होने से’ के आशय को वक्ताओं की दृष्टि या मान्यता के रूप में स्वाभाविक हिन्दी में देता है, बिना यह घोषित किए कि प्रजा वस्तुतः जाति रह ही नहीं गई।
theological_decisions:
- issue: ‘दो कुलों’ का संकेत
  choice: किसी विशिष्ट जोड़ी की पहचान किए बिना ‘दो कुलों’ रखा गया
  alternative: इस्राएल और यहूदा; अथवा दाऊद और लेवी के वंश
  rationale: पद स्वयं इन दोनों की स्पष्ट पहचान नहीं करता। निकटवर्ती प्रसंग सम्भावनाएँ देता है, पर अनुवाद में किसी विवादित पहचान को आरोपित नहीं करना चाहिए।
- issue: अन्तिम वाक्यांश का अभिप्राय
  choice: विरोधियों की दृष्टि में प्रजा को जाति न मानना
  alternative: प्रजा का वस्तुगत रूप से जाति रहना समाप्त हो जाना
  rationale: לִפְנֵיהֶם का अर्थ यहाँ ‘उनकी दृष्टि में’ हो सकता है। यह प्रस्तुति अवमाननापूर्ण मूल्यांकन को सामने रखती है और मूल से अधिक प्रबल अस्तित्वगत दावा नहीं करती।
- issue: ‘त्याग दिया’ कथन का स्वर
  choice: इसे विरोधियों के उद्धृत दावे के रूप में रखा गया
  alternative: इसे कथावाचक की ओर से परमेश्वर के निर्णय की पुष्टि मानना
  rationale: वाक्य-रचना स्पष्ट करती है कि ये ‘लोग’ ऐसा कह रहे हैं; अनुवाद को उनके दावे और परमेश्वर की अपनी घोषणा के बीच भेद बनाए रखना चाहिए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘जाति’ का प्रयोग यहाँ आधुनिक सामाजिक जाति-व्यवस्था के अर्थ में नहीं, बल्कि राष्ट्र या जनसमुदाय के बाइबिलीय अर्थ में है।
