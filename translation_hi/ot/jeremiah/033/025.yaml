id: JER.33.25
reference: Jeremiah 33:25
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה אִם לֹ֥א בְרִיתִ֖/י יוֹמָ֣ם וָ/לָ֑יְלָה חֻקּ֛וֹת שָׁמַ֥יִם וָ/אָ֖רֶץ לֹא שָֽׂמְתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/025.yaml
  text: 'Thus says Yahweh: If I have not established my covenant with day and night[a], the fixed order of heaven and earth—'
translation:
  language: hi
  text: याहवे यह कहता है, “यदि मैंने दिन और रात के साथ अपनी वाचा और आकाश तथा पृथ्वी के निश्चित नियम[a] स्थापित नहीं किए होते—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आकाश और पृथ्वी के विधि-विधान।”
    reason: हिब्रू חֻקּוֹת का अर्थ ‘निश्चित नियम’ के अतिरिक्त ‘विधियाँ’ या ‘विधि-विधान’ भी हो सकता है।
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: याहवे यों कहता है
  rationale: यह नबी का प्रचलित संदेशवाहक-सूत्र है। יְהוָה को उसके वाचा-संबंधी निज नाम ‘याहवे’ के रूप में रखा गया है।
- source_word: אִם לֹא
  choice: यदि ... न किए होते
  rationale: यह नकारात्मक शर्त आरंभ करता है और अगले पद में आने वाले निष्कर्ष के लिए वाक्य को खुला छोड़ता है। हिंदी में अपूर्ण शर्त का यह रूप स्वाभाविक है।
- source_word: בְרִיתִי
  choice: अपनी वाचा
  rationale: בְּרִית का सामान्य और संदर्भगत अर्थ ‘वाचा’ है। सृष्टि की व्यवस्था अभिप्रेत होने पर भी वाचा-शब्दावली बनाए रखना आसपास के अनुच्छेद के लिए आवश्यक है।
- source_word: יוֹמָם וָלָיְלָה
  choice: दिन और रात के साथ
  rationale: यह वाचा के संबंध या क्षेत्र को व्यक्त करता है। ‘के साथ’ मूल की संबंधपरक भाषा को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: חֻקּוֹת
  choice: निश्चित नियम
  rationale: חֻקּוֹת विधियों या ठहराई हुई व्यवस्थाओं को सूचित कर सकता है। ब्रह्मांडीय संदर्भ में ‘निश्चित नियम’ नियमित, ईश्वर-स्थापित व्यवस्था का अर्थ स्पष्ट करता है, जबकि वैधानिक अर्थ की छाया भी बची रहती है।
- source_word: שָׁמַיִם וָאָרֶץ
  choice: आकाश तथा पृथ्वी के
  rationale: यह समूची सृष्टि को सूचित करने वाला प्रचलित युग्म है। हिंदी में ‘आकाश तथा पृथ्वी’ स्वाभाविक और गरिमापूर्ण है।
- source_word: לֹא שָׂמְתִּי
  choice: स्थापित न किए होते
  rationale: שׂים का मूल अर्थ रखना या ठहराना है; यहाँ वाचा और सृष्टि-व्यवस्था को कायम करने के अर्थ में ‘स्थापित करना’ स्पष्ट और उपयुक्त है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरीय वाचा-नाम सीधे प्रयुक्त है। उसका लिप्यंतरण नाम की विशिष्टता बनाए रखता है और उसे सामान्य उपाधि में नहीं बदलता।
- issue: בְרִיתִי और חֻקּוֹת का वाक्यगत संबंध
  choice: उन्हें ‘स्थापित’ क्रिया के दो संबद्ध कर्मों के रूप में प्रस्तुत करना
  alternative: ‘आकाश और पृथ्वी के निश्चित नियम’ को ‘दिन और रात के साथ मेरी वाचा’ की व्याख्या या समानार्थक पुनर्कथन मानना
  rationale: संक्षिप्त हिब्रू वाक्यरचना दोनों संबंधों की संभावना देती है। मुख्य पाठ दोनों को एक ही क्रिया के अधीन रखता है और [a] में व्याख्यात्मक संबंध की वास्तविक संभावना बताता है।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। पद अगले पद में पूर्ण होने वाली शर्त है, इसलिए अंत में दीर्घ डैश रखा गया है।
