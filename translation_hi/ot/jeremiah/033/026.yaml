base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/026.yaml
  text: then I would also reject the offspring of Jacob and of David my servant[a], not taking from his offspring rulers over the offspring of Abraham, Isaac, and Jacob[b]. For I will restore their fortunes and have compassion on them.
translation:
  language: hi
  text: तो मैं याकूब के वंश[a] और अपने दास दाऊद के वंश को भी त्याग देता, कि उसके वंश में से अब्राहम, इसहाक और याकूब के वंश पर शासन करनेवालों को न चुनता। क्योंकि मैं उनकी दशा फिर बहाल करूँगा[b] और उन पर दया करूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द का शाब्दिक अर्थ ‘बीज’ भी हो सकता है; इस पूरे पद में ‘वंश’ के स्थान पर ‘बीज’ पढ़ा जा सकता है। इब्रानी זֶרַע सामूहिक एकवचन है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘मैं उन्हें बँधुआई से लौटा लाऊँगा’ अथवा ‘मैं उनके निर्वासित लोगों को वापस लाऊँगा।’ इब्रानी मुहावरा विशेष रूप से निर्वासन से वापसी या अधिक व्यापक रूप से बिगड़ी दशा की बहाली को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: तो ... भी
  rationale: यह पद पिछले पद की शर्त का परिणाम आगे बढ़ाता है; इसलिए ‘तो ... भी’ केवल जोड़ नहीं, बल्कि शर्त-परिणाम का संबंध भी स्पष्ट करता है।
- source_word: זֶרַע יַעֲקוֹב וְדָוִד עַבְדִּי
  choice: याकूब के वंश और अपने दास दाऊद के वंश
  rationale: ‘वंश’ सामूहिक एकवचन זֶרַע का स्वाभाविक हिन्दी रूप है। दाऊद के साथ ‘वंश’ दोहराने से आशय स्पष्ट होता है, जबकि ‘अपने दास’ की वाचागत गरिमा बनी रहती है।
- source_word: אֶמְאַס
  choice: त्याग देता
  rationale: पिछले पद से चली आ रही असंभाव्य शर्त के परिणाम को हिन्दी में ‘तो ... त्याग देता’ स्वाभाविक रूप से व्यक्त करता है; ‘तुच्छ समझता’ यहाँ वाचा-संबंधी अस्वीकार के भाव को कम सटीकता से व्यक्त करता।
- source_word: מִקַּחַת מִזַּרְעוֹ מֹשְׁלִים
  choice: उसके वंश में से ... शासन करनेवालों को न चुनता
  rationale: לקח यहाँ किसी को पद के लिए लेने या चुनने का भाव रखता है। ‘उसके’ निकटतम एकवचन पूर्वपद दाऊद की ओर संकेत करता है, और מֹשְׁלִים व्यक्तियों के रूप में शासन करनेवालों को दर्शाता है।
- source_word: אֶל זֶרַע אַבְרָהָם יִשְׂחָק וְיַעֲקֹב
  choice: अब्राहम, इसहाक और याकूब के वंश पर
  rationale: משל के साथ אֶל शासन के क्षेत्र या उसके अधीन लोगों को दर्शाता है; हिन्दी में ‘वंश पर शासन करना’ इसका स्वाभाविक रूप है।
- source_word: אשוב אֶת שְׁבוּתָם
  choice: मैं उनकी दशा फिर बहाल करूँगा
  rationale: यह इब्रानी मुहावरा निर्वासन से लौटाने को विशेष रूप से और विपत्ति की दशा पलटने को व्यापक रूप से व्यक्त कर सकता है। ‘दशा फिर बहाल करना’ व्यापक अर्थ को मुख्य पाठ में सुरक्षित रखता है।
- source_word: וְרִחַמְתִּים
  choice: और उन पर दया करूँगा
  rationale: רחם करुणामय दया को व्यक्त करता है; ‘उन पर दया करूँगा’ आधुनिक हिन्दी में सहज और गरिमापूर्ण है।
theological_decisions:
- issue: पिछले पद से चली आ रही शर्त का बल
  choice: मुख्य क्रियाओं को ‘तो मैं ... त्याग देता ... न चुनता’ के रूप में संभाव्य परिणाम बनाया गया है।
  alternative: साधारण भविष्य के रूप में ‘मैं त्याग दूँगा ... नहीं चुनूँगा।’
  rationale: पद 26, पद 25 में आरम्भ हुई असंभाव्य शर्त का परिणाम है। साधारण भविष्य अनजाने में ऐसा अर्थ दे सकता है कि परमेश्वर वास्तव में याकूब और दाऊद के वंश को त्यागने की घोषणा कर रहा है।
- issue: ‘उसके वंश’ में सर्वनाम का संदर्भ
  choice: इसे दाऊद के वंश के संदर्भ में रखा गया है।
  alternative: इसे याकूब अथवा सामूहिक इस्राएल के संदर्भ में समझना।
  rationale: दाऊद निकटतम एकवचन पूर्वपद है, और उसके वंश से पितरों के वंश पर शासन करनेवालों का आना प्रसंग में दाऊदी प्रतिज्ञा के अनुकूल है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सार्वजनिक पाठ के योग्य शैली अपनाई गई है। ‘वंश’, ‘शासन करनेवाले’, ‘दशा फिर बहाल करना’ और ‘दया करना’ सामान्य पाठक के लिए स्पष्ट हैं; शाब्दिक तथा निर्वासन-संबंधी विकल्प पादटिप्पणियों में सुरक्षित रखे गए हैं।
