base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/010.yaml
  text: 'Thus says the LORD: Yet in this place, of which you say, ‘It is a waste, without man or beast,’ in the cities of Judah and in the streets of Jerusalem that are desolate, without man or inhabitant or beast, there shall again be heard'
translation:
  language: hi
  text: 'यहोवा यह कहता है: “इस स्थान में—जिसके विषय में तुम कहते हो, ‘यह उजाड़ है; यहाँ न मनुष्य है, न पशु’—यहूदा के नगरों और यरूशलेम की उन सड़कों में, जो उजाड़ हैं और जहाँ न मनुष्य, न कोई निवासी और न पशु है, फिर से सुनाई देगा—'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को सामान्य और प्रतिष्ठित हिन्दी रूप में सुरक्षित रखा गया है।
- source_word: חָרֵב
  choice: उजाड़
  rationale: यह शब्द वीरानी और विनाश से खाली पड़े होने का भाव देता है; ‘उजाड़’ इस संदर्भ में स्वाभाविक और सटीक है।
- source_word: חֻצוֹת
  choice: सड़कें
  rationale: बहुवचन रूप नगर के सार्वजनिक मार्गों या खुले स्थानों को सूचित कर सकता है; आधुनिक हिन्दी में ‘सड़कें’ संदर्भानुकूल और सहज है।
- source_word: יִשָּׁמַע
  choice: सुनाई देगा
  rationale: हिब्रू का कर्मवाच्य अर्थ सुरक्षित है; सुनाई देने वाली वस्तु अगले पद में आती है।
- source_word: יוֹשֵׁב
  choice: निवासी
  rationale: यहाँ किसी बसे हुए व्यक्ति का अर्थ है; ‘निवासी’ ‘मनुष्य’ के साथ मौजूद स्रोत-पाठ की पुनरुक्ति और भेद दोनों बनाए रखता है।
theological_decisions:
- issue: दिव्य नाम का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में चतुरक्षरी व्यक्तिगत नाम है; उसे उपाधि में बदलने के बजाय हिन्दी में परिचित लिप्यंतरण द्वारा व्यक्त किया गया है।
- issue: पद के अंत में अधूरा वाक्य
  choice: ‘फिर से सुनाई देगा—’ के साथ वाक्य को अगले पद की ओर खुला रखा
  alternative: अगले पद की सामग्री जोड़कर वाक्य पूरा करना
  rationale: मूल पद 10 का व्याकरणिक वाक्य पद 11 में पूरा होता है; पद-सीमा और प्रत्याशा दोनों सुरक्षित रखी गई हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। उद्धरण के भीतर उद्धरण स्पष्ट किए गए हैं, और दीर्घ विराम-चिह्न पद 11 में पूरी होने वाली बात का संकेत देता है।
