source:
  edition: WLC
  text: וְ/לַ/כֹּהֲנִים֙ הַ/לְוִיִּ֔ם לֹֽא יִכָּרֵ֥ת אִ֖ישׁ מִ/לְּ/פָנָ֑/י מַעֲלֶ֨ה עוֹלָ֜ה וּ/מַקְטִ֥יר מִנְחָ֛ה וְ/עֹ֥שֶׂה זֶּ֖בַח כָּל הַ/יָּמִֽים־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/018.yaml
  text: And the Levitical priests will never lack a man before me to offer burnt offerings, burn grain offerings, and make sacrifices continually[a].
translation:
  language: hi
  text: और लेवीय याजकों में मेरे सामने होमबलि चढ़ाने, अन्नबलि जलाने और बलिदान करने वाले किसी व्यक्ति की कभी कमी न होगी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यिर्मयाह 33:14–26 प्राचीन यूनानी यिर्मयाह में नहीं मिलता।
    reason: textual_variant
lexical_decisions:
- source_word: וְלַכֹּהֲנִים הַלְוִיִּם
  choice: और लेवीय याजकों में
  rationale: לַ־ यहाँ उस याजकीय समुदाय को चिह्नित करता है जिसके विषय में प्रतिज्ञा है। हिंदी में ‘याजकों में ... कमी न होगी’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לֹא יִכָּרֵת אִישׁ
  choice: किसी पुरुष की कभी कमी न होगी
  rationale: इस मुहावरे का आशय किसी एक व्यक्ति के अमर रहने से नहीं, बल्कि याजकीय समुदाय में सेवा करने वाले प्रतिनिधि का अभाव कभी न होने से है। ‘कभी’ निषेध की स्थायी शक्ति स्पष्ट करता है।
- source_word: מִלְּפָנַי
  choice: मेरे सामने
  rationale: यह परमेश्वर की उपस्थिति में की जाने वाली याजकीय सेवा को दर्शाता है; ‘मेरे सामने’ हिंदी में सीधा और स्वाभाविक है।
- source_word: מַעֲלֶה עוֹלָה
  choice: होमबलि चढ़ाने
  rationale: מעלה का आशय वेदी पर होमबलि चढ़ाना है। हिंदी वाक्य में क्रियार्थक रूप उस सेवा करने वाले व्यक्ति की भूमिका को स्वाभाविक ढंग से बताता है।
- source_word: וּמַקְטִיר מִנְחָה
  choice: अन्नबलि जलाने
  rationale: הקטיר बलि को वेदी पर जलाकर धुआँ उठाने का विशिष्ट भाव रखता है; इसलिए केवल ‘चढ़ाने’ के बजाय ‘जलाने’ से स्रोत का भेद सुरक्षित रहता है।
- source_word: וְעֹשֶׂה זֶּבַח
  choice: और ... बलिदान चढ़ाने
  rationale: शाब्दिक ‘बलिदान करने’ की अपेक्षा आधुनिक हिंदी में ‘बलिदान चढ़ाना’ धार्मिक क्रिया को अधिक स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: כָּל הַיָּמִים
  choice: निरन्तर
  rationale: शाब्दिक ‘सभी दिनों’ का आशय लगातार जारी रहने वाली सेवा है; ‘निरन्तर’ उसके कालगत बल को संक्षेप में सुरक्षित रखता है।
theological_decisions:
- issue: לֹא יִכָּרֵת אִישׁ को शाब्दिक ‘कोई पुरुष काटा न जाएगा’ कहा जाए या याजकीय उत्तराधिकार के मुहावरे के रूप में समझा जाए
  choice: किसी पुरुष की कभी कमी न होगी
  alternative: कोई पुरुष मेरे सामने से कभी काटा न जाएगा
  rationale: संदर्भ दाऊद और लेवीय याजकों की वंशगत निरन्तरता का है। मुहावरेदार अनुवाद एक व्यक्ति की अविनश्वरता का भ्रामक अर्थ टालते हुए समुदाय में सेवारत प्रतिनिधि की सतत उपलब्धता व्यक्त करता है।
- issue: הַכֹּהֲנִים הַלְוִיִּם की पहचान
  choice: लेवीय याजक
  alternative: याजक अर्थात् लेवी
  rationale: ‘लेवीय याजक’ दोनों पदों के संबंध को सुरक्षित रखता है और किसी संप्रदायगत या अत्यधिक संकीर्ण ऐतिहासिक व्याख्या को नहीं जोड़ता।
- issue: हिब्रू कृदन्तों को हिंदी में कैसे व्यक्त किया जाए
  choice: चढ़ाने, जलाने और चढ़ाने के लिए
  alternative: जो ... चढ़ाता, जलाता और बलिदान करता है
  rationale: कृदन्त सेवा करने वाले प्रतिनिधि के कार्य बताते हैं। मुख्य मुहावरे ‘कमी न होगी’ के साथ हिंदी में क्रियार्थक श्रृंखला अधिक सहज है और कार्यों की निरन्तर भूमिका को बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण किंतु सामान्य-पाठक-सुलभ रूप अपनाया गया है। ‘होमबलि’ और ‘अन्नबलि’ बाइबलीय बलिदान-शब्दावली को स्पष्ट रखते हैं; ‘निरन्तर’ כָּל הַיָּמִים का स्वाभाविक हिंदी रूप है।
