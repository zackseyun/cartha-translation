id: JER.33.21
reference: Jeremiah 33:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: גַּם בְּרִיתִ֤/י תֻפַר֙ אֶת דָּוִ֣ד עַבְדִּ֔/י מִ/הְיֽוֹת ל֥/וֹ בֵ֖ן מֹלֵ֣ךְ עַל כִּסְא֑/וֹ וְ/אֶת הַ/לְוִיִּ֥ם הַ/כֹּהֲנִ֖ים מְשָׁרְתָֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/021.yaml
  text: then my covenant with David my servant may also be broken[a], so that he would not have a son reigning on his throne, and with the Levitical priests, my ministers.
translation:
  language: hi
  text: तब मेरे दास दाऊद के साथ की गई मेरी वाचा भी टूट सकती है, ताकि उसके सिंहासन पर राज्य करनेवाला उसका कोई पुत्र न हो; और मेरी वाचा मेरी सेवा करनेवाले लेवीय याजकों के साथ भी टूट सकती है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “और लेवियों, याजकों, जो मेरी सेवा करते हैं, के साथ भी।”'
    reason: इब्रानी में ‘लेवियों’ और ‘याजकों’ का समानाधिकरण तथा दूसरे खंड में पहले से निहित ‘मेरी वाचा ... टूट सकती है’ का लुप्त कथन सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: גַּם
  choice: भी
  rationale: 'यह पिछले पद की शर्त के साथ समानांतर संबंध जोड़ता है: यदि सृष्टि की ठहराई हुई व्यवस्था टूट सकती है, तो यह वाचा भी टूट सकती है।'
- source_word: בְּרִיתִי ... אֶת דָּוִד עַבְדִּי
  choice: मेरे दास दाऊद के साथ बाँधी गई मेरी वाचा
  rationale: ‘वाचा’ בְּרִית का धार्मिक और विधिक भार बनाए रखती है; ‘के साथ बाँधी गई’ संबंधसूचक אֶת को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: תֻפַר
  choice: टूट सकती है
  rationale: פרר के होफ़ाल रूप का निष्क्रिय अर्थ ‘तोड़ी/निष्फल की जा सकती है’ है। सशर्त प्रसंग में ‘टूट सकती है’ स्वाभाविक है और वाचा की शब्दावली बनाए रखता है।
- source_word: מִהְיוֹת לוֹ בֵן מֹלֵךְ עַל כִּסְאוֹ
  choice: जिससे उसके सिंहासन पर राज्य करने के लिए उसका कोई पुत्र न रहे
  rationale: מִן सहित क्रियार्थक संज्ञा परिणाम को व्यक्त करती है। ‘पुत्र’ स्रोत की ठोस वंशगत भाषा को रखता है और מֹלֵךְ के निरंतर राजकीय कार्य को ‘राज्य करने’ से व्यक्त किया गया है।
- source_word: וְאֶת הַלְוִיִּם הַכֹּהֲנִים
  choice: और यही ... लेवीय याजकों के साथ बाँधी गई मेरी वाचा के विषय में भी होगा
  rationale: दूसरे אֶת को पहले वाचागत संबंध के समानांतर समझकर हिन्दी में छूटी हुई क्रिया और संज्ञा स्पष्ट की गई है। ‘लेवीय याजक’ पठनीय है; इब्रानी की अधिक शाब्दिक समानाधिकरणीय रचना पादटिप्पणी में दी गई है।
- source_word: מְשָׁרְתָי
  choice: मेरी सेवा करनेवाले
  rationale: שרת यहाँ परमेश्वर के सामने विशेषतः उपासना-संबंधी सेवा करनेवालों को दर्शाता है। यह आधुनिक हिन्दी में ‘मेरे सेवक’ से अधिक विशिष्ट और ‘मेरे परिचारक’ से अधिक सहज है।
theological_decisions:
- issue: दाऊद से की गई वंशगत प्रतिज्ञा
  choice: ‘उसके सिंहासन पर राज्य करने के लिए उसका कोई पुत्र न रहे’—ठोस पुत्र और सिंहासन की भाषा रखी गई।
  alternative: ‘उसका कोई वंशज/उत्तराधिकारी राज्य न करे।’
  rationale: इब्रानी בֵן स्पष्टतः ‘पुत्र’ कहता है। इसे सामान्य ‘वंशज’ बनाना राजवंशीय अर्थ तो देता, पर मूल की पुत्रगत भाषा और उससे जुड़ा धर्मवैज्ञानिक तनाव घटा देता।
- issue: याजकीय समूह की पहचान
  choice: मुख्य पाठ में ‘लेवीय याजक’, और अधिक शाब्दिक समानाधिकरण पादटिप्पणी में।
  alternative: ‘लेवियों, अर्थात् याजकों’ या ‘लेवियों—याजकों’।
  rationale: הַלְוִיִּם הַכֹּהֲנִים को समानाधिकरण में पढ़ा जा सकता है। मुख्य पाठ स्वाभाविक हिन्दी देता है, जबकि पादटिप्पणी व्याकरणिक रूप की वास्तविक अस्पष्टता सुरक्षित रखती है।
- issue: दूसरी वाचा का लोपित कथन
  choice: हिन्दी में ‘यही ... वाचा के विषय में भी होगा’ जोड़कर दाऊद की वाचा के समानांतर अर्थ स्पष्ट किया गया।
  alternative: 'शाब्दिक खंड: ‘और मेरी सेवा करनेवाले लेवियों, याजकों के साथ भी।’'
  rationale: इब्रानी समन्वय में पहले खंड की ‘मेरी वाचा टूट सकती है’ धारणा दूसरे खंड में लुप्त रूप से लागू होती है। स्पष्ट विस्तार अर्थ नहीं बदलता और हिन्दी में अधूरा वाक्य बनने से बचाता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘वाचा’, ‘सिंहासन’, ‘याजक’ जैसे स्थापित बाइबलीय पद धर्मवैज्ञानिक सटीकता के लिए रखे गए हैं। मुख्य पाठ में इब्रानी समानांतरता को स्वाभाविक बनाने हेतु सीमित स्पष्टता जोड़ी गई है; पादटिप्पणी अधिक शाब्दिक रूप दर्ज करती है।
