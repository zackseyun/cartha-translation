source:
  edition: WLC
  text: כִּי כֹ֖ה אָמַ֣ר יְהוָ֑ה לֹֽא יִכָּרֵ֣ת לְ/דָוִ֔ד אִ֕ישׁ יֹשֵׁ֖ב עַל כִּסֵּ֥א בֵֽית יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/017.yaml
  text: 'For thus says Yahweh: David shall never lack a man to sit on the throne of the house of Israel[a][b].'
translation:
  language: hi
  text: 'क्योंकि यहोवा यों कहता है: दाऊद को इस्राएल के घराने के सिंहासन पर बैठनेवाले पुरुष की कभी कमी न होगी[a][b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “दाऊद के लिए इस्राएल के घराने के सिंहासन पर बैठनेवाला एक पुरुष काटा नहीं जाएगा।”'
    reason: lexical_alternative
  - marker: b
    text: इसे संक्षेप में “इस्राएल के सिंहासन पर” भी कहा जा सकता है। इब्रानी में “इस्राएल का घराना” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह संयोजक पिछले वचन में दी गई प्रतिज्ञा का आधार बताता है; हिन्दी में ‘क्योंकि’ इस सम्बन्ध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כֹה אָמַר יְהוָה
  choice: यहोवा यों कहता है
  rationale: यह मानक भविष्यद्वक्ताई सन्देश-सूत्र है; ‘यों कहता है’ मूल की औपचारिकता और गरिमा बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत वाचा-नाम को हिन्दी में प्रचलित रूप ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: לֹא יִכָּרֵת לְדָוִד
  choice: दाऊद के लिए ... का कभी अन्त न होगा
  rationale: मूलतः ‘दाऊद के लिए काटा न जाएगा’ एक वंशगत निरन्तरता का मुहावरा है। चुना हुआ रूप उसी भाव को स्पष्ट हिन्दी में रखता है और ‘पुरुष’ से उसका व्याकरणिक सम्बन्ध बनाए रखता है।
- source_word: אִישׁ
  choice: पुरुष
  rationale: इब्रानी शब्द एकवचन पुल्लिंग है। ‘वंशज’ कहना सन्दर्भतः सम्भव, पर मूल से अधिक व्याख्यात्मक होता।
- source_word: יֹשֵׁב
  choice: बैठनेवाले
  rationale: सक्रिय कृदन्त उस पुरुष के निरन्तर राजकीय कार्य का वर्णन करता है; हिन्दी कृदन्त मूल संरचना को स्वाभाविक ढंग से दर्शाता है।
- source_word: עַל כִּסֵּא
  choice: सिंहासन पर
  rationale: यह राजकीय आसन और शासनाधिकार को व्यक्त करता है; हिन्दी में निश्चितता सन्दर्भ से स्पष्ट है।
- source_word: בֵית יִשְׂרָאֵל
  choice: इस्राएल के घराने के
  rationale: ‘घराना’ मूल के वाच्यार्थ और उसके वाचागत-राष्ट्रीय अर्थ को बचाता है; केवल ‘इस्राएल’ कहना अधिक संक्षिप्त किन्तु कम औपचारिक होगा।
theological_decisions:
- issue: दाऊद से की गई स्थायी राजवंशीय प्रतिज्ञा
  choice: पद को दाऊद के लिए सिंहासनारूढ़ पुरुष की निरन्तर उपलब्धता की प्रतिज्ञा के रूप में रखा गया है, पर उसकी ऐतिहासिक अथवा मसीही पूर्ति की रीति निर्दिष्ट नहीं की गई।
  alternative: इसे केवल तत्कालीन ऐतिहासिक उत्तराधिकार या केवल एक अन्तिम मसीही राजा की स्पष्ट भविष्यवाणी के रूप में अनूदित करना।
  rationale: इब्रानी पाठ राजवंशीय प्रतिज्ञा करता है, पर इसी पद में उसकी पूर्ति का तन्त्र नहीं बताता। इसलिए अनुवाद दोनों सम्भावनाओं के बीच की धर्मवैज्ञानिक तनातनी को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण भविष्यद्वक्ताई रजिस्टर अपनाया गया है। ‘बैठनेवाले’ को संयुक्त रूप में रखा गया है और ‘अन्त’ में मानक वर्तनी प्रयुक्त है। मुख्य पाठ सहज है, जबकि शाब्दिक ‘काटा न जाएगा’ को टिप्पणी में सुरक्षित रखा गया है।
