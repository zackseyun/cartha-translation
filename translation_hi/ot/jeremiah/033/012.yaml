source:
  edition: WLC
  text: כֹּֽה אָמַר֮ יְהוָ֣ה צְבָאוֹת֒ ע֞וֹד יִֽהְיֶ֣ה בַּ/מָּק֣וֹם הַ/זֶּ֗ה הֶ/חָרֵ֛ב מֵֽ/אֵין אָדָ֥ם וְ/עַד בְּהֵמָ֖ה וּ/בְ/כָל עָרָ֑י/ו נְוֵ֣ה רֹעִ֔ים מַרְבִּצִ֖ים צֹֽאן־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/012.yaml
  text: 'Thus says Yahweh of hosts: Yet again there will be in this place[a], which is desolate, without man or beast, and in all its cities, a pasture of shepherds[c][b], where they make flocks lie down.'
translation:
  language: hi
  text: सेनाओं का यहोवा यों कहता है, “इस स्थान में[a], जो उजाड़ है और जहाँ न मनुष्य है न पशु, और इसके सभी नगरों में फिर चरवाहों के लिए चरागाह[c] होगी, जहाँ चरवाहे भेड़-बकरियों के झुंडों को विश्राम के लिए लिटाएँगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस स्थान में एक बार फिर।” “फिर” को अगले कथन के साथ भी जोड़ा जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: या “चरवाहों का निवास-स्थान” अथवा “चरवाहों का बाड़ा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के विशिष्ट वाचा-नाम को उपाधि में बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण द्वारा सुरक्षित रखा गया है।
- source_word: צְבָאוֹת
  choice: सेनाओं का
  rationale: यह बहुवचन की व्यापकता बनाए रखता है और स्वर्गीय अथवा सांसारिक सेनाओं में से किसी एक अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: עוֹד
  choice: फिर
  rationale: प्रसंग में वर्तमान उजाड़ दशा के बाद पुनर्स्थापना और दोबारा होने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בַּמָּקוֹם הַזֶּה
  choice: इस स्थान में
  rationale: स्थानवाचक वाक्यांश और संकेतवाचक बल दोनों को सीधे बनाए रखता है।
- source_word: הֶחָרֵב
  choice: जो उजाड़ है
  rationale: स्थान की वर्तमान निर्जन और विनष्ट दशा बताने वाला स्वाभाविक संबंधवाचक प्रयोग है।
- source_word: מֵאֵין אָדָם וְעַד בְּהֵמָה
  choice: जहाँ न मनुष्य है न पशु
  rationale: पूर्ण जनशून्यता बताने वाली इब्रानी युग्म-अभिव्यक्ति को स्पष्ट और वर्तमान हिन्दी में सुरक्षित रखता है।
- source_word: וּבְכָל עָרָיו
  choice: और इसके सभी नगरों में
  rationale: पुल्लिंग एकवचन प्रत्यय को सामूहिक भूभाग/स्थान की ओर संकेत करता मानते हुए हिन्दी में स्वाभाविक निर्जीव संबंधसूचक रूप लिया गया है।
- source_word: נְוֵה רֹעִים
  choice: चरवाहों की चरागाह
  rationale: निर्माण-संबंध को निकटता से रखता है; pastoral संदर्भ में נְוֵה के निवास, बाड़े अथवा चराई-स्थल के अर्थक्षेत्र में 'चरागाह' सर्वाधिक सहज है।
- source_word: מַרְבִּצִים צֹאן
  choice: वे भेड़-बकरियों के झुंडों को बैठाएँगे
  rationale: 'हिफ़ील कृदंत का कारक भाव सुरक्षित है: चरवाहे झुंडों को विश्राम के लिए बैठाते हैं। हिन्दी में צֹאן के व्यापक छोटे पालतू पशुओं के अर्थ के लिए ''भेड़-बकरियों के झुंड'' स्पष्ट है।'
theological_decisions:
- issue: उजाड़पन के सूत्र में אָדָם का अनुवाद
  choice: मनुष्य
  alternative: लोग / मानव
  rationale: यहाँ אָדָם किसी विशेष पुरुष के बजाय मानव-उपस्थिति को पशु-उपस्थिति के साथ जोड़कर पूर्ण निर्जनता बताता है; 'मनुष्य' मूल युग्म को संक्षेप और गरिमा के साथ बनाए रखता है।
- issue: יְהוָה צְבָאוֹת में צְבָאוֹת की व्याप्ति
  choice: सेनाओं का यहोवा
  alternative: सर्वशक्तिमान यहोवा / स्वर्गीय सेनाओं का यहोवा
  rationale: '''सेनाओं'' मूल रूपक और बहुवचन को बनाए रखता है तथा पद को शक्ति-संबंधी व्याख्यात्मक उपाधि या केवल स्वर्गीय सेनाओं तक सीमित नहीं करता।'
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, मौखिक रूप से सहज भविष्यवाणी-वचन। 'यों कहता है' पारंपरिक बाइबलीय सूत्र को समझने योग्य रूप में रखता है। मुख्य वाक्य में कारक क्रिया और pastoral दृश्य स्पष्ट किए गए हैं; मूल की संभावित संरचनात्मक अस्पष्टता तथा נְוֵה का अर्थक्षेत्र पादटिप्पणियों में सुरक्षित है।
