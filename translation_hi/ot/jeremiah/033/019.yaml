  text: וַֽ/יְהִי֙ דְּבַר יְהוָ֔ה אֶֽל יִרְמְיָ֖הוּ לֵ/אמֽוֹר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/019.yaml
  text: And the word of Yahweh came to Jeremiah, saying,
translation:
  language: hi
  text: 'फिर याहवे का वचन यिर्मयाह के पास आया:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: फिर ... आया
  rationale: यहाँ वाव-क्रमिक कथन को आगे बढ़ाने वाला सूत्र है। हिंदी में ‘फिर’ और मुख्य क्रिया ‘आया’ मिलकर इसका स्वाभाविक अर्थ व्यक्त करते हैं; ‘और ऐसा हुआ’ अनावश्यक रूप से शब्दशः और बोझिल होता।
- source_word: דְּבַר
  choice: वचन
  rationale: नबूवत के स्थायी सूत्र דְּבַר יְהוָה में ‘वचन’ ईश्वरीय प्रकाशन का पारदर्शी और परिचित हिंदी रूप है; ‘संदेश’ संभव है, पर सूत्रात्मकता को कम कर देता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय आधुनिक हिंदी लिप्यंतरण में रखा गया है।
- source_word: אֶל
  choice: के पास
  rationale: यह पूर्वसर्ग यहाँ ईश्वरीय वचन के प्राप्तकर्ता को चिह्नित करता है। ‘यिर्मयाह के पास आया’ स्वाभाविक हिंदी प्रकाशन-सूत्र है।
- source_word: יִרְמְיָהוּ
  choice: यिर्मयाह
  rationale: यह इस नबी के नाम का हिंदी में प्रचलित बाइबलीय रूप है।
- source_word: לֵאמֹר
  choice: ':'
  rationale: यह रूप आगे आने वाले प्रत्यक्ष कथन का परिचय देता है। हिंदी में उद्धरण से पहले का द्विबिंदु ‘यह कहते हुए’ की तुलना में अधिक स्वाभाविक ढंग से वही कार्य करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का स्पष्ट प्रयोग करता है। ‘याहवे’ उस नाम को सुरक्षित रखता है, जबकि ‘प्रभु’ उसे एक उपाधि से बदल देता है; ‘यहोवा’ एक पारंपरिक किंतु कम स्रोत-समीप लिप्यंतरण है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। पद के प्रकाशन-सूत्र को हिंदी में स्वाभाविक बनाने के लिए לֵאמֹר को अलग शब्दों के बजाय द्विबिंदु से व्यक्त किया गया है।
