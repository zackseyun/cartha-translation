base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/008.yaml
  text: And I will cleanse them from all their guilt by which they have sinned against me[b][a], and I will forgive all their guilty deeds by which they have sinned against me and by which they have rebelled against me.
translation:
  language: hi
  text: मैं उन्हें उनके समस्त दोष[a] से शुद्ध करूँगा, जिसके द्वारा उन्होंने मेरे विरुद्ध पाप किया है; और मैं उनके वे सारे अपराध[b] क्षमा करूँगा, जिनके द्वारा उन्होंने मेरे विरुद्ध पाप किया है और जिनके द्वारा उन्होंने मेरे विरुद्ध विद्रोह किया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनके सारे अधर्म से।” हिब्रू शब्द עָוֹן गलत काम और उससे उत्पन्न दोष—दोनों को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “उनके सारे अधर्म।” यहाँ वही हिब्रू शब्द עָוֹן बहुवचन में है और उनके अनेक दोषयुक्त अपराधों पर बल देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְטִהַרְתִּים
  choice: मैं उन्हें ... शुद्ध करूँगा
  rationale: पिएल रूप טהר यहाँ परमेश्वर द्वारा नैतिक और वाचागत शुद्धि किए जाने को व्यक्त करता है। ‘शुद्ध करूँगा’ वर्तमान मानक हिन्दी में स्वाभाविक है और क्रिया की सक्रियता बनाए रखता है।
- source_word: מִכָּל עֲוֺנָם
  choice: उनके सारे दोष से
  rationale: עָוֹן गलत काम और उससे उत्पन्न दोष या दोषिता—दोनों को सूचित कर सकता है। ‘दोष’ इस द्विअर्थी क्षेत्र को अपेक्षाकृत सहज हिन्दी में बनाए रखता है और ‘शुद्ध’ के साथ दोषिता का भाव भी व्यक्त करता है।
- source_word: אֲשֶׁר חָטְאוּ לִי
  choice: जिसके द्वारा उन्होंने मेरे विरुद्ध पाप किया है
  rationale: לִי के साथ חטא पाप का परमेश्वर के विरुद्ध होना दिखाता है। ‘जिसके द्वारा’ संबंधवाचक संरचना को बनाए रखता है, यद्यपि हिन्दी में यह कुछ औपचारिक है।
- source_word: וְסָלַחְתִּי
  choice: मैं ... क्षमा करूँगा
  rationale: סלח के लिए ‘क्षमा करना’ स्पष्ट, सामान्य और ईश्वरीय क्षमा के प्रसंग में स्वाभाविक हिन्दी है।
- source_word: לְכָל עֲוֺנוֹתֵיהֶם
  choice: उनके वे सारे अपराध
  rationale: यहाँ עָוֹן बहुवचन में है और अनेक दोषयुक्त कृत्यों की ओर संकेत करता है। ‘अपराध’ बहुवचन कृत्यों को स्वाभाविक हिन्दी में सामने लाता है, जबकि पादटिप्पणी उसी हिब्रू शब्द के दोषिता-संबंधी अर्थ को स्पष्ट करती है।
- source_word: וַאֲשֶׁר פָּשְׁעוּ בִי
  choice: और मुझसे विद्रोह किया है
  rationale: פשע केवल सामान्य भूल नहीं, बल्कि अधिकार के विरुद्ध विद्रोह या संबंधगत अविश्वास व्यक्त कर सकता है। ‘मुझसे विद्रोह’ इसकी तीव्रता और परमेश्वर की ओर निर्देशित भाव को सुरक्षित रखता है।
theological_decisions:
- issue: עון, חטא और פשע की परस्पर संबंधित पाप-वाचक शब्दावली
  choice: ‘दोष’, ‘पाप’ और ‘विद्रोह’ के अलग-अलग शब्द रखे गए हैं; बहुवचन עֲוֺנוֹת के लिए ‘अपराध’ चुना गया है।
  alternative: सभी शब्दों को केवल ‘पाप’ से अनूदित करना, अथवा עון के दोनों रूपों के लिए समान रूप से ‘अधर्म’ रखना।
  rationale: हिब्रू पद दोष/दोषिता, पाप करने और परमेश्वर के विरुद्ध विद्रोह के भावों को एक साथ रखता है। अलग शब्द इस नैतिक और संबंधगत परत को बनाए रखते हैं, बिना किसी विशिष्ट सांप्रदायिक व्याख्या को थोपे।
- issue: עָוֹן में कृत्य और उससे उत्पन्न दोषिता की वास्तविक अर्थगत अस्पष्टता
  choice: मुख्य पाठ में पहले प्रयोग के लिए ‘दोष’ और दूसरे, बहुवचन प्रयोग के लिए ‘अपराध’ रखा गया है तथा दोनों स्थानों पर विकल्प पादटिप्पणी में दिए गए हैं।
  alternative: दोनों स्थानों पर केवल ‘अधर्म’ या केवल ‘दोष’ रखकर संख्या और प्रसंगगत बल के अंतर को समतल कर देना।
  rationale: इससे पहले प्रयोग में शुद्ध किए जाने योग्य दोषिता और दूसरे में क्षमा किए जाने वाले अनेक दोषयुक्त कृत्य उभरते हैं, पर पादटिप्पणियाँ बताती हैं कि मूल शब्द दोनों अर्थों को समेट सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। स्रोत की दो समानांतर संबंधवाचक संरचनाओं को यथासंभव बचाने के कारण ‘जिसके/जिनके द्वारा’ का हल्का औपचारिकपन जानबूझकर रखा गया है।
