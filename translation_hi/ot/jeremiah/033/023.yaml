lexical_decisions:
- source_word: וַיְהִי
  choice: फिर ... आया
  rationale: यह रूप कथा के क्रम को आगे बढ़ाता है। हिन्दी में क्रिया को ‘वचन ... आया’ के साथ जोड़ना स्वाभाविक है और ‘ऐसा हुआ’ जैसे अनावश्यक शाब्दिकपन से बचाता है।
- source_word: דְּבַר
  choice: वचन
  rationale: भविष्यवाणी के सूत्र דְּבַר יְהוָה में ‘वचन’ परमेश्वर से प्राप्त प्रकाशन और संदेश—दोनों का भार बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: यह चार अक्षरों वाला परमेश्वर का निज नाम YHWH है। ‘याहवे’ उसका व्यापक रूप से स्वीकृत आधुनिक लिप्यंतरण है; इसे किसी उपाधि से नहीं बदला गया।
- source_word: אֶל יִרְמְיָהוּ
  choice: यिर्मयाह के पास
  rationale: इस प्रसंग में אֶל वचन के प्राप्तकर्ता को सूचित करता है; ‘के पास’ स्वाभाविक हिन्दी अभिव्यक्ति है।
- source_word: לֵאמֹר
  choice: ':'
  rationale: यह पद अगले वचन में आने वाली प्रत्यक्ष वाणी का परिचय देता है। हिन्दी में विसर्ग-सदृश विराम-चिह्न के बजाय कोलन इस कार्य को स्वाभाविक और संक्षिप्त रूप से व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में उपाधि नहीं, परमेश्वर का निज नाम YHWH है। ‘याहवे’ नाम को नाम के रूप में सुरक्षित रखता है; पाठकों की परिचित वैकल्पिक वर्तनी पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। भविष्यवाणी के पारंपरिक सूत्र को स्वाभाविक हिन्दी में व्यक्त किया गया है, और अगले पद की प्रत्यक्ष वाणी के लिए अंत में कोलन रखा गया है।
