id: JER.33.14
reference: Jeremiah 33:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הִנֵּ֛ה יָמִ֥ים בָּאִ֖ים נְאֻם יְהוָ֑ה וַ/הֲקִֽמֹתִי֙ אֶת הַ/דָּבָ֣ר הַ/טּ֔וֹב אֲשֶׁ֥ר דִּבַּ֛רְתִּי אֶל בֵּ֥ית יִשְׂרָאֵ֖ל וְ/עַל בֵּ֥ית יְהוּדָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/014.yaml
  text: Look[a], days are coming, declares Yahweh, when I will fulfill the good word that I spoke to the house of Israel and the house of Judah.
translation:
  language: hi
  text: देखो, वे दिन आ रहे हैं—यह याहवे की घोषणा है—जब मैं उस भले वचन को पूरा करूँगा[a], जो मैंने इस्राएल के घराने और यहूदा के घराने के विषय में कहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस भली प्रतिज्ञा को पूरा करूँगा।” इब्रानी में शाब्दिक रूप से “उस भले वचन को स्थापित करूँगा।”
    reason: ‘वचन’ और ‘स्थापित करना’ मूल शब्दावली को निकटता से रखते हैं, जबकि संदर्भ में इसका अर्थ कही हुई प्रतिज्ञा को पूरा करना है।
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह आने वाली घोषणा की ओर ध्यान खींचता है; ‘देखो’ आधुनिक और स्वाभाविक हिंदी में इसका संकेतात्मक बल बनाए रखता है।
- source_word: יָמִים בָּאִים
  choice: वे दिन आ रहे हैं
  rationale: यह भविष्य के समय की घोषणा करने वाला प्रचलित भविष्यद्वाणी-सूत्र है; हिंदी में ‘वे दिन आ रहे हैं’ स्वाभाविक है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: भविष्यद्वाणी के औपचारिक घोषणात्मक सूत्र का गरिमापूर्ण और स्पष्ट हिंदी रूप।
- source_word: וַהֲקִמֹתִי
  choice: मैं ... पूरा करूँगा
  rationale: हिफ़ील रूप यहाँ कहे हुए वचन को स्थिर करने अथवा घटित करने का भाव देता है; ‘पूरा करूँगा’ संदर्भानुकूल है।
- source_word: הַדָּבָר הַטּוֹב
  choice: उस भले वचन
  rationale: ‘वचन’ דָּבָר के शाब्दिक अर्थ और आगे आए ‘कहा था’ से उसके शब्द-संबंध को सुरक्षित रखता है; ‘प्रतिज्ञा’ संदर्भगत किंतु अधिक व्याख्यात्मक है।
- source_word: אֲשֶׁר דִּבַּרְתִּי
  choice: जो मैंने ... कहा था
  rationale: मूल क्रिया का सामान्य अर्थ ‘बोलना/कहना’ है; ‘प्रतिज्ञा की थी’ कहने से व्याख्या मुख्य पाठ में आ जाती।
- source_word: אֶל בֵּית יִשְׂרָאֵל וְעַל בֵּית יְהוּדָה
  choice: इस्राएल के घराने और यहूदा के घराने के विषय में
  rationale: मूल में भिन्न संबंधबोधक अव्यय אֶל और עַל हैं। संयुक्त हिंदी रूप ‘के विषय में’ दोनों घरानों से संबंधित ईश्वरीय वचन को स्वाभाविक ढंग से व्यक्त करता है और अनावश्यक असमानता नहीं थोपता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है; ‘याहवे’ उसे उपाधि में बदले बिना सुरक्षित रखता है।
- issue: הַדָּבָר הַטּוֹב को ‘वचन’ या ‘प्रतिज्ञा’ कहना
  choice: भला वचन
  alternative: भली प्रतिज्ञा
  rationale: ‘वचन’ मूल की व्यापकता और ‘कहा था’ के साथ उसका lexical संबंध बनाए रखता है; प्रतिज्ञात्मक अर्थ को पादटिप्पणी में बताया गया है।
- issue: אֶל और עַל के भेद का हिंदी रूप
  choice: दोनों घरानों के विषय में
  alternative: इस्राएल के घराने से और यहूदा के घराने के विषय में
  rationale: शाब्दिक रूप संभावित भेद दिखाता है, पर हिंदी में असहज और संभवतः भ्रामक होगा। संदर्भ में वचन दोनों समुदायों से संबंधित है; अतः सहज सामूहिक रूप चुना गया।
translation_notes:
  register: आधुनिक मानक हिंदी; गरिमापूर्ण भविष्यद्वाणी-शैली। ‘घराना’ covenantal-national ‘house’ को बनाए रखता है। वाक्य के घोषणात्मक सूत्र को डैश से अलग किया गया है ताकि पाठ स्पष्ट और मौखिक पठन में सहज रहे।
