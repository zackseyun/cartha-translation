  text: ק֣וֹל שָׂשׂ֞וֹן וְ/ק֣וֹל שִׂמְחָ֗ה ק֣וֹל חָתָן֮ וְ/ק֣וֹל כַּלָּה֒ ק֣וֹל אֹמְרִ֡ים הוֹדוּ֩ אֶת יְהוָ֨ה צְבָא֜וֹת כִּֽי ט֤וֹב יְהוָה֙ כִּֽי לְ/עוֹלָ֣ם חַסְדּ֔/וֹ מְבִאִ֥ים תּוֹדָ֖ה בֵּ֣ית יְהוָ֑ה כִּֽי אָשִׁ֧יב אֶת שְׁבוּת הָ/אָ֛רֶץ כְּ/בָ/רִאשֹׁנָ֖ה אָמַ֥ר יְהוָֽה־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/011.yaml
  text: the sound of joy and the sound of gladness[a], the sound of the bridegroom and the sound of the bride, the sound of those saying, ‘Give thanks to Yahweh of hosts, for Yahweh is good, for his steadfast love endures forever,’ and of those bringing a thank offering into the house of Yahweh. For I will restore the fortunes of the land as at first[b], says Yahweh.
translation:
  language: hi
  text: हर्ष की ध्वनि और आनंद की ध्वनि, दूल्हे की ध्वनि और दुल्हन की ध्वनि, और उन लोगों की ध्वनि जो कहते हैं, “सेनाओं के याहवे का धन्यवाद करो, क्योंकि याहवे भला है, क्योंकि उसका अटल प्रेम सदा बना रहता है[a],” और उन लोगों की ध्वनि जो याहवे के भवन में धन्यवाद-बलि लाते हैं। क्योंकि मैं इस देश की दशा फिर वैसी कर दूँगा जैसी वह पहले थी[b], याहवे कहता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसकी दया सदा बनी रहती है” अथवा “वाचा के प्रति उसकी निष्ठा सदा बनी रहती है।”
    reason: lexical_alternative
  - marker: b
    text: या “मैं इस देश के बंदियों को वापस ले आऊँगा”; इब्रानी मुहावरा बंदियों की वापसी या अधिक व्यापक रूप से देश की दशा की बहाली, दोनों का बोध करा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: קוֹל
  choice: ध्वनि
  rationale: यह शब्द आवाज़, ध्वनि या कोलाहल का बोध करा सकता है। यहाँ उत्सव, विवाह और आराधना में सुनाई देने वाली ध्वनियों की काव्यात्मक पुनरावृत्ति है; इसलिए ‘ध्वनि’ व्यापक और गरिमापूर्ण है।
- source_word: שָׂשׂוֹן וְשִׂמְחָה
  choice: हर्ष और आनंद
  rationale: दोनों निकटार्थी शब्दों का भेद बनाए रखते हुए यह युग्म आधुनिक हिन्दी में स्वाभाविक और काव्यात्मक है।
- source_word: חָתָן וְכַלָּה
  choice: दूल्हा और दुल्हन
  rationale: विवाह के इस पारंपरिक युग्म के ये सामान्य और स्पष्ट हिन्दी समतुल्य हैं।
- source_word: הוֹדוּ
  choice: धन्यवाद करो
  rationale: इस आराधनात्मक सूत्र में क्रिया धन्यवाद देने और स्तुति करने का अर्थ रखती है; आगे आने वाली धन्यवाद-बलि से इसका शाब्दिक संबंध भी बना रहता है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं के याहवे
  rationale: ‘याहवे’ वाचा के नाम को प्रत्यक्ष रूप में रखता है और ‘सेनाओं के’ उपाधि के मूल बिंब को सुरक्षित रखता है।
- source_word: לְעוֹלָם חַסְדּוֹ
  choice: उसका अटल प्रेम सदा बना रहता है
  rationale: חֶסֶד में प्रेम, दया और निष्ठा के परस्पर जुड़े भाव हैं। ‘अटल प्रेम’ प्रमुख भाव को सहज हिन्दी में व्यक्त करता है, जबकि पादटिप्पणी अन्य वैध अर्थों को सुरक्षित रखती है।
- source_word: תּוֹדָה
  choice: धन्यवाद-बलि
  rationale: इसे याहवे के भवन में लाया जा रहा है, इसलिए यहाँ केवल मौखिक धन्यवाद नहीं बल्कि बलिदानी भेंट का अर्थ उपयुक्त है।
- source_word: אָשִׁיב אֶת שְׁבוּת הָאָרֶץ
  choice: मैं इस देश की दशा फिर पहले जैसी कर दूँगा
  rationale: यह पुनर्स्थापना-सूचक मुहावरा बंदियों की वापसी अथवा देश की व्यापक बहाली, दोनों का संकेत दे सकता है। मुख्य पाठ व्यापक संदर्भ को व्यक्त करता है और पादटिप्पणी संकुचित शाब्दिक संभावना बताती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में वाचा का विशिष्ट नाम है; उसका लिप्यंतरण सामान्य उपाधि से भेद बनाए रखता है।
- issue: חֶסֶד का अर्थ
  choice: अटल प्रेम
  alternative: दया / वाचा के प्रति निष्ठा
  rationale: शब्द की अर्थ-व्याप्ति को किसी एक संकीर्ण धर्मवैज्ञानिक व्याख्या में सीमित न करते हुए मुख्य पाठ में स्वाभाविक समतुल्य और पादटिप्पणी में वास्तविक विकल्प दिए गए हैं।
- issue: שְׁבוּת वाले पुनर्स्थापना-मुहावरे का अर्थ
  choice: देश की दशा फिर पहले जैसी करना
  alternative: देश के बंदियों को वापस लाना / देश की बंधुआई पलटना
  rationale: आसपास का संदर्भ जनजीवन, विवाह, धन्यवाद और मंदिर की आराधना सहित व्यापक बहाली का चित्र देता है, पर मूल मुहावरे में बंदियों की वापसी का अर्थ भी संभव है; इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सार्वजनिक पाठ के योग्य रूप अपनाया गया है। मूल की आवृत्तिपूर्ण काव्य-रचना को ‘ध्वनि’ दोहराकर सुरक्षित रखा गया है। ‘धन्यवाद-बलि’ उपासना-संबंधी अर्थ स्पष्ट करता है, और वास्तविक शाब्दिक तथा धर्मवैज्ञानिक अस्पष्टताओं को पादटिप्पणियों में बनाए रखा गया है।
