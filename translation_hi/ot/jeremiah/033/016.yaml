id: JER.33.16
reference: Jeremiah 33:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בַּ/יָּמִ֤ים הָ/הֵם֙ תִּוָּשַׁ֣ע יְהוּדָ֔ה וִ/ירוּשָׁלִַ֖ם תִּשְׁכּ֣וֹן לָ/בֶ֑טַח וְ/זֶ֥ה אֲשֶׁר יִקְרָא לָ֖/הּ יְהוָ֥ה צִדְקֵֽ/נוּ־־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/016.yaml
  text: 'In those days Judah will be saved[a], and Jerusalem will dwell securely[b]; and this is what she will be called: ‘Yahweh is our righteousness.’'
translation:
  language: hi
  text: 'उन दिनों यहूदा का उद्धार होगा, और यरूशलेम सुरक्षित बसी रहेगी; और वह इस नाम से पुकारी जाएगी[a]: “याहवे हमारी धार्मिकता है।”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'हिब्रू में अधिक शब्दशः: “और यह वह है जो उसके लिए पुकारा जाएगा।” यह नाम दिए जाने का एक हिब्रू मुहावरा है।'
    reason: हिब्रू नामकरण-संरचना के अधिक निकट विकल्प को स्पष्ट करना।
  - marker: b
    text: यिर्मयाह 23:6 में इससे बहुत मिलती-जुलती उपाधि, “याहवे हमारी धार्मिकता है,” आने वाले दाऊदी राजा के लिए प्रयुक्त हुई है; यहाँ व्याकरण इसे यरूशलेम पर लागू करता है और संभवतः उस पहले की प्रतिज्ञा की प्रतिध्वनि करता है।
    reason: संबंधित पद और व्याकरण से सुरक्षित रहने वाली धर्मवैज्ञानिक अंतर्ध्वनि।
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: उन दिनों
  rationale: भविष्य में प्रतिज्ञात पुनर्स्थापना के समय को बताने वाला स्वाभाविक और प्रचलित हिन्दी रूप।
- source_word: תִּוָּשַׁע
  choice: उद्धार होगा
  rationale: निफ़अल रूप के कर्मवाच्य अर्थ—बचाए या छुड़ाए जाने—को बनाए रखता है और दैवी उद्धार की व्यापक अर्थछाया भी व्यक्त करता है।
- source_word: תִּשְׁכּוֹן לָבֶטַח
  choice: सुरक्षित बसी रहेगी
  rationale: שׁכן के स्थायी निवास के भाव और לבטח की सुरक्षा—दोनों को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וְזֶה אֲשֶׁר יִקְרָא לָהּ
  choice: और वह इस नाम से पुकारी जाएगी
  rationale: हिब्रू की नामकरण-संरचना को स्पष्ट हिन्दी में व्यक्त करता है; स्त्रीलिंग रूप का संबंध यरूशलेम से बना रहता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार-अक्षरीय ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय उसके प्रचलित हिन्दी लिप्यंतरण से प्रस्तुत करता है।
- source_word: צִדְקֵנוּ
  choice: हमारी धार्मिकता है
  rationale: प्रत्यय सहित संज्ञा का अर्थ ‘हमारी धार्मिकता’ है; नामकरण-वाक्य में हिन्दी की स्वाभाविकता और विधेयार्थ स्पष्ट करने के लिए ‘है’ जोड़ा गया है।
theological_decisions:
- issue: नामकरण-वाक्य में יְהוָה का निरूपण
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है; लिप्यंतरण उसे उपाधि में बदलने से बचाता है।
- issue: नाम का संबंध यरूशलेम से है या दाऊदी राजा से
  choice: मुख्य पाठ में नाम यरूशलेम पर लागू है
  alternative: यिर्मयाह 23:6 के आधार पर इसे आने वाले दाऊदी राजा की उपाधि समझना
  rationale: לָהּ का स्त्रीलिंग प्रत्यय इस पद में व्याकरणतः यरूशलेम की ओर संकेत करता है। यिर्मयाह 23:6 की निकट समानता महत्त्वपूर्ण है, पर उसे मुख्य पाठ की व्याकरणिक दिशा पर आरोपित न करके टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज रूप। ‘बसी रहेगी’ नगर के लिए स्वाभाविक है। मुख्य पाठ में नामकरण-सूचक वाक्यांश रखा गया है, इसलिए [a] में दिया अधिक शब्दशः विकल्प मुख्य पाठ से अनावश्यक रूप से दोहराता है; फिर भी उपलब्ध परामर्श-सामग्री के टिप्पणी-आशय को सुरक्षित रखने हेतु सम्मिलित किया गया है।
