  text: וְ/הָ֣יְתָה לִּ֗/י לְ/שֵׁ֤ם שָׂשׂוֹן֙ לִ/תְהִלָּ֣ה וּ/לְ/תִפְאֶ֔רֶת לְ/כֹ֖ל גּוֹיֵ֣י הָ/אָ֑רֶץ אֲשֶׁ֨ר יִשְׁמְע֜וּ אֶת כָּל הַ/טּוֹבָ֗ה אֲשֶׁ֤ר אָֽנֹכִי֙ עֹשֶׂ֣ה אֹתָ֔/ם וּ/פָחֲד֣וּ וְ/רָֽגְז֗וּ עַ֤ל כָּל הַ/טּוֹבָה֙ וְ/עַ֣ל כָּל הַ/שָּׁל֔וֹם אֲשֶׁ֥ר אָֽנֹכִ֖י עֹ֥שֶׂה לָּֽ/הּ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/009.yaml
  text: And she will be to me a name of joy[a], a praise and a glory before all the nations of the earth, who will hear of all the good that I am doing for them. And they will fear and tremble because of all the good and because of all the peace that I am bringing to her.
translation:
  language: hi
  text: वह मेरे लिए आनंद का नाम, प्रशंसा और गौरव बनेगी—पृथ्वी की सभी जातियों के सामने। वे उस सारी भलाई के बारे में सुनेंगी जो मैं उनके लिए कर रहा हूँ। तब वे उस सारी भलाई और उस सारी शांति[a] के कारण डरेंगी और काँप उठेंगी, जो मैं उसके लिए ला रहा हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सारा कल्याण’ अथवा ‘सारी समृद्धि’; इब्रानी शब्द शालोम में शांति, कुशलता, कल्याण और समग्र भलाई के भाव शामिल हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה לִּי
  choice: वह मेरे लिए ... बनेगी
  rationale: क्रिया स्त्रीलिंग एकवचन है और पद के अंत का לָּהּ भी स्त्रीलिंग संदर्भ की पुष्टि करता है; संदर्भ में यरूशलेम/नगर का मानवीकरण है।
- source_word: לְשֵׁם שָׂשׂוֹן
  choice: आनंद का नाम
  rationale: शाब्दिक बिंब को बनाए रखता है; שֵׁם यहाँ नाम के साथ-साथ ख्याति या प्रतिष्ठा का भाव भी रख सकता है।
- source_word: לִתְהִלָּה וּלְתִפְאֶרֶת
  choice: प्रशंसा और गौरव
  rationale: תְהִלָּה सार्वजनिक प्रशंसा और תִפְאֶרֶת शोभा, महिमा या गौरव को व्यक्त करता है; यह जोड़ी भविष्यसूचक गरिमा बनाए रखती है।
- source_word: לְכֹל גּוֹיֵי הָאָרֶץ
  choice: पृथ्वी की सभी जातियों के सामने
  rationale: पूर्वसर्ग ל यहाँ राष्ट्रों की दृष्टि में सार्वजनिक ख्याति या प्रतिष्ठा का संबंध व्यक्त करता है।
- source_word: אֲשֶׁר יִשְׁמְעוּ
  choice: वे ... के बारे में सुनेंगी
  rationale: संबंधवाचक उपवाक्य पृथ्वी की जातियों को सूचित करता है; हिन्दी में अलग वाक्य अधिक स्वाभाविक है और स्त्रीलिंग बहुवचन 'जातियों' के अनुसार क्रिया रखी गई है।
- source_word: אֶת כָּל הַטּוֹבָה אֲשֶׁר אָנֹכִי עֹשֶׂה אֹתָם
  choice: उस सारी भलाई ... जो मैं उनके लिए कर रहा हूँ
  rationale: यहाँ עשה के साथ सर्वनाम का अर्थ लाभ पहुँचाना है; 'भलाई' ठोस उपकारों और कल्याण दोनों को समेटती है।
- source_word: וּפָחֲדוּ וְרָגְזוּ
  choice: डरेंगी और काँप उठेंगी
  rationale: दोनों क्रियाओं में भय और कंपकंपी का बल है; अनुवाद विस्मयपूर्ण भय और वास्तविक आतंक के बीच की मूल अस्पष्टता को खुला रखता है।
- source_word: עַל כָּל הַטּוֹבָה
  choice: उस सारी भलाई ... के कारण
  rationale: עַל यहाँ प्रतिक्रिया का कारण बताता है।
- source_word: וְעַל כָּל הַשָּׁלוֹם
  choice: उस सारी शांति[a] के कारण
  rationale: שָׁלוֹם का सामान्य अनुवाद 'शांति' है, पर इसमें कुशल, कल्याण और समृद्धि भी समाहित हो सकते हैं; व्यापकता पादटिप्पणी में दी गई है।
- source_word: אֲשֶׁר אָנֹכִי עֹשֶׂה לָּהּ
  choice: जो मैं उसके लिए ला रहा हूँ
  rationale: शाब्दिक अर्थ 'उसके लिए कर रहा हूँ' है, पर 'शांति ला रहा हूँ' स्वाभाविक हिन्दी है और स्त्रीलिंग नगर-संदर्भ को सुरक्षित रखता है।
theological_decisions:
- issue: परमेश्वर की पुनर्स्थापना पर जातियों की प्रतिक्रिया का स्वरूप
  choice: भलाई और शांति के कारण भय और कंपकंपी
  alternative: केवल श्रद्धापूर्ण विस्मय अथवा केवल शत्रुतापूर्ण आतंक
  rationale: मूल क्रियाएँ भय, थरथराहट और व्याकुलता व्यक्त कर सकती हैं। संदर्भ में कारण परमेश्वर की दी हुई भलाई और शांति है, फिर भी पाठ प्रतिक्रिया को केवल सकारात्मक श्रद्धा तक सीमित नहीं करता; इसलिए तनाव को अनसुलझा रखा गया है।
