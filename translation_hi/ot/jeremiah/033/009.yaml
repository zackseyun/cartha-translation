  register: आधुनिक मानक हिन्दी का गरिमापूर्ण पर सहज रूप अपनाया गया है। यरूशलेम/नगर के स्त्रीलिंग मानवीकरण को ‘वह/उसके’ से बनाए रखा गया है। लंबे इब्रानी वाक्य को स्पष्टता के लिए तीन वाक्यों में बाँटा गया है, बिना उसके तार्किक संबंधों को बदले।
