  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה אִם תָּפֵ֨רוּ֙ אֶת בְּרִיתִ֣/י הַ/יּ֔וֹם וְ/אֶת בְּרִיתִ֖/י הַ/לָּ֑יְלָה וּ/לְ/בִלְתִּ֛י הֱי֥וֹת יֽוֹמָם וָ/לַ֖יְלָה בְּ/עִתָּֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/020.yaml
  text: 'Thus says Yahweh: If you can break my covenant with the day and my covenant with the night[a], so that day and night will not be at their appointed time[b],'
translation:
  language: hi
  text: 'याहवे यों कहता है: “यदि तुम दिन के साथ मेरी वाचा और रात के साथ मेरी वाचा को तोड़ सको[a], जिससे दिन और रात अपने नियत समय पर न हों[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यदि तुम दिन के साथ मेरी वाचा और रात के साथ मेरी वाचा को तोड़ दो।” इब्रानी शर्त का अधिक औपचारिक अनुवाद ‘सको’ के बिना किया जा सकता है; मुख्य पाठ संदर्भ में निहित असंभवता के आलंकारिक भाव को सामने लाता है।
    reason: lexical_alternative
  - marker: b
    text: या, “जिससे अपने नियत समय पर दिन और रात न हों।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: याहवे यों कहता है
  rationale: यह भविष्यद्वाणी के संदेशवाहक-सूत्र का स्वाभाविक और गरिमापूर्ण हिन्दी रूप है; यְהוָה को उसके व्यक्तिगत वाचा-नाम ‘याहवे’ के रूप में रखा गया है।
- source_word: אִם תָּפֵרוּ
  choice: यदि तुम ... तोड़ सको
  rationale: हिफ़ील क्रिया הפר का अर्थ वाचा को ‘तोड़ना’ या ‘निष्फल करना’ है। ‘सको’ निकटवर्ती संदर्भ में निहित असंभव चुनौती के आलंकारिक बल को हिन्दी में स्पष्ट करता है।
- source_word: בְּרִיתִי הַיּוֹם ... בְּרִיתִי הַלָּיְלָה
  choice: दिन के साथ मेरी वाचा ... रात के साथ मेरी वाचा
  rationale: दोनों समानांतर पदों को बनाए रखते हुए दिन और रात के साथ स्थापित वाचा का चित्र सुरक्षित रखा गया है।
- source_word: וּלְבִלְתִּי הֱיוֹת
  choice: जिससे ... न हों
  rationale: यह परिणाम बताने वाली रचना है और הֱיוֹת के मूल अर्थ ‘होना’ को बिना गति अथवा आगमन की धारणा जोड़े व्यक्त करती है।
- source_word: יוֹמָם וָלַיְלָה בְּעִתָּם
  choice: दिन और रात अपने नियत समय पर
  rationale: यहाँ दिन-रात की नियमित, ईश्वर-निर्धारित व्यवस्था अभिप्रेत है; ‘नियत समय’ עֵת के निर्धारित अथवा उचित समय के भाव को व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे आया है। ‘याहवे’ वाचा-संबंधी नाम को अनुवाद में स्पष्ट रूप से सुरक्षित रखता है।
- issue: אִם תָּפֵרוּ की शर्त का आलंकारिक बल
  choice: यदि तुम ... तोड़ सको
  alternative: यदि तुम ... तोड़ दो
  rationale: व्यापक संदर्भ में यह असंभव शर्त परमेश्वर की प्रतिज्ञा की निश्चितता रेखांकित करती है। ‘सको’ उस आलंकारिक बल को व्यक्त करता है, जबकि अधिक औपचारिक विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण भविष्यद्वाणी-शैली रखी गई है। समानांतर वाक्य-विन्यास और वाचा-संबंधी शब्दावली को बनाए रखा गया है। पद अगले वाक्यांश में जारी रहता है, इसलिए अंत में अल्पविराम रखा गया है।
