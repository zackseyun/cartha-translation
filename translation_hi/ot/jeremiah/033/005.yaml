  text: בָּאִ֗ים לְ/הִלָּחֵם֙ אֶת הַ/כַּשְׂדִּ֔ים וּ/לְ/מַלְאָ/ם֙ אֶת פִּגְרֵ֣י הָ/אָדָ֔ם אֲשֶׁר הִכֵּ֥יתִי בְ/אַפִּ֖/י וּ/בַ/חֲמָתִ֑/י וַ/אֲשֶׁ֨ר הִסְתַּ֤רְתִּי פָנַ/י֙ מֵ/הָ/עִ֣יר הַ/זֹּ֔את עַ֖ל כָּל רָעָתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/005.yaml
  text: They are coming to fight against the Chaldeans but only to fill them with the corpses of the men whom I struck down in my anger and in my wrath[c][b][a], and from this city I have hidden my face because of all their evil.
translation:
  language: hi
  text: वे कसदियों[a] से लड़ने और उन जगहों[b] को उन मनुष्यों के शवों[c] से भरने आ रहे हैं, जिन्हें मैंने अपने क्रोध और प्रकोप में मार गिराया है; और उनकी सारी बुराई के कारण मैंने इस नगर से अपना मुख छिपा लिया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बाबुलवासियों।’ इब्रानी में ‘कसदियों’ है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से ‘उन्हें भरने’ है; संभवतः संकेत पिछले पद में बताए गए घरों या मोर्चेबंदियों की ओर है।
    reason: cross_reference
  - marker: c
    text: या ‘मानव शवों।’ इब्रानी शब्द אָדָם संदर्भ के अनुसार मनुष्य या मानवजाति को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּאִים
  choice: वे ... आ रहे हैं
  rationale: पुल्लिंग बहुवचन कृदंत यहाँ जारी या निकटवर्ती क्रिया व्यक्त करता है; हिंदी का प्रगतिशील रूप स्वाभाविक है।
- source_word: לְהִלָּחֵם אֶת הַכַּשְׂדִּים
  choice: कसदियों से लड़ने
  rationale: לְהִלָּחֵם के साथ אֶת यहाँ कसदियों के विरुद्ध युद्ध करने का भाव देता है; हिंदी में ‘से लड़ना’ स्वाभाविक है।
- source_word: הַכַּשְׂדִּים
  choice: कसदी
  rationale: मूल जातिवाचक नाम को मुख्य पाठ में रखा गया है; अधिक परिचित ऐतिहासिक विकल्प ‘बाबुलवासी’ पाद-टिप्पणी में दिया गया है।
- source_word: וּלְמַלְאָם
  choice: पर इससे वे केवल उन जगहों को ... भर देंगे
  rationale: शाब्दिक अर्थ ‘और उन्हें भरने’ है। संदर्भ में युद्ध का प्रयास भीषण परिणाम तक पहुँचता है; ‘उन जगहों’ से बहुवचन प्रत्यय स्पष्ट होता है, जिसका संभावित पूर्वपद पिछले पद के घर या मोर्चेबंदियाँ हैं।
- source_word: פִּגְרֵי הָאָדָם
  choice: मनुष्यों के शव
  rationale: פגר हिंसक मृत्यु के बाद पड़े शव का कठोर चित्र बनाए रखता है; אָדָם यहाँ सामूहिक रूप से मनुष्यों को सूचित करता है और लिंग-विशेष को अनावश्यक रूप से सीमित नहीं किया गया।
- source_word: אֲשֶׁר הִכֵּיתִי
  choice: जिन्हें मैंने ... मार गिराया है
  rationale: נכה का मूल भाव प्रहार करना है, किंतु शवों के संदर्भ में घातक परिणाम स्पष्ट है; ‘मार गिराया’ दोनों पक्षों को व्यक्त करता है।
- source_word: בְאַפִּי וּבַחֲמָתִי
  choice: अपने क्रोध और प्रकोप में
  rationale: दो निकटार्थक न्याय-सूचक शब्दों को अलग-अलग रखकर मूल की तीव्रता सुरक्षित की गई है।
- source_word: וַאֲשֶׁר הִסְתַּרְתִּי פָנַי מֵהָעִיר הַזֹּאת
  choice: मैंने इस नगर से अपना मुख छिपा लिया है
  rationale: परमेश्वर की कृपा और उपस्थिति के हटने का बाइबलीय रूपक ज्यों का त्यों रखा गया है।
- source_word: עַל כָּל רָעָתָם
  choice: उनके सारे बुरे कामों के कारण
  rationale: עַל कारणसूचक है; רָעָה को यहाँ लोगों की समस्त दुष्टता अथवा बुरे आचरण के ठोस अर्थ में स्वाभाविक हिंदी दी गई है।
theological_decisions:
- issue: ईश्वरीय न्याय और ‘मुख छिपाने’ का मानवरूपी मुहावरा
  choice: ‘मैंने ... मार गिराया,’ ‘अपने क्रोध और प्रकोप में,’ और ‘अपना मुख छिपा लिया’ को प्रत्यक्ष ईश्वरीय कथन के रूप में रखा गया।
  alternative: इन्हें केवल निर्वैयक्तिक विपत्ति या कृपा हटने की व्याख्यात्मक भाषा में नरम करना।
  rationale: मूल पाठ विनाश का कर्ता सीधे परमेश्वर को बताता है और मुख छिपाने के वाचाई मुहावरे का प्रयोग करता है; अनुवाद उस धार्मिक तनाव को कम नहीं करता।
- issue: אָדָם का सामूहिक अर्थ
  choice: मनुष्यों
  alternative: पुरुषों / मानवजाति
  rationale: यहाँ संकेत युद्ध में मारे गए वास्तविक मानव शवों की ओर है; ‘मनुष्यों’ सामूहिक अर्थ को रखता है, जबकि ‘मानवजाति’ अत्यधिक व्यापक और ‘पुरुषों’ अनावश्यक रूप से सीमित हो सकता है।
- issue: וּלְמַלְאָם का संबंध और परिणामसूचक बल
  choice: ‘पर इससे वे केवल ... भर देंगे’ द्वारा असफल प्रतिरोध के भीषण परिणाम को व्यक्त किया गया।
  alternative: ‘और उन्हें भरने’—दोनों infinitives को केवल समानांतर उद्देश्य मानना।
  rationale: हिब्रू संयोजन अपने आप में सामान्य ‘और’ है, पर संदर्भ लड़ाई के घोषित उद्देश्य और शवों से भर जाने के वास्तविक परिणाम के बीच विडंबना पैदा करता है। मुख्य पाठ में परिणामसूचक पठन रखा गया है और शाब्दिक संरचना पाद-टिप्पणी में बताई गई है।
