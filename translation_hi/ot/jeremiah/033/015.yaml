source:
  edition: WLC
  text: בַּ/יָּמִ֤ים הָ/הֵם֙ וּ/בָ/עֵ֣ת הַ/הִ֔יא אַצְמִ֥יחַ לְ/דָוִ֖ד צֶ֣מַח צְדָקָ֑ה וְ/עָשָׂ֛ה מִשְׁפָּ֥ט וּ/צְדָקָ֖ה בָּ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/015.yaml
  text: In those days and at that time I will cause a righteous Branch to sprout for David[b][a], and he will execute justice and righteousness in the land.
translation:
  language: hi
  text: उन दिनों और उस समय मैं दाऊद के लिए एक धर्मी अंकुर[b][a] उगाऊँगा, और वह देश में न्याय और धार्मिकता करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, “धार्मिकता का अंकुर”; यह भी संभव है: “न्यायी अंकुर।”'
    reason: lexical_alternative
  - marker: b
    text: “अंकुर” संभवतः यिर्मयाह 23:5 में प्रतिज्ञा किए गए दाऊदी शासक की प्रतिध्वनि है।
    reason: cross_reference
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: उन दिनों
  rationale: इब्रानी कालसूचक सूत्र का स्वाभाविक और सीधा हिन्दी रूप।
- source_word: וּבָעֵת הַהִיא
  choice: और उस समय
  rationale: पहले कालसूचक वाक्यांश के साथ इसकी समानांतरता बनाए रखता है।
- source_word: אַצְמִיחַ
  choice: उगाऊँगा
  rationale: हिफ़िल की कारणवाचकता और पौधे के उगने का रूपक दोनों संक्षेप और स्वाभाविक ढंग से व्यक्त होते हैं।
- source_word: לְדָוִד
  choice: दाऊद के लिए
  rationale: לְ के संबंध अथवा हित के भाव को रखता है और मूल में न आए ‘घराने’ को नहीं जोड़ता।
- source_word: צֶמַח
  choice: अंकुर
  rationale: पौधे के रूपक को स्पष्ट रखता है और यिर्मयाह 23:5 के दाऊदी शासक की प्रतिध्वनि के लिए उपयुक्त है। हिन्दी में बड़े अक्षर से पदवी सूचित करना संभव नहीं, इसलिए व्याख्यात्मक टिप्पणी दी गई है।
- source_word: צְדָקָה
  choice: धर्मी
  rationale: צֶמַח צְדָקָה का स्वाभाविक विशेषणात्मक रूप; ‘धार्मिकता का अंकुर’ और ‘न्यायी अंकुर’ भी व्याकरणतः संभव हैं।
- source_word: וְעָשָׂה
  choice: और वह ... करेगा
  rationale: भविष्यवाणी के प्रसंग में यह पहले भविष्यकालीन क्रिया को आगे बढ़ाता है; हिन्दी भविष्यकाल इसी अर्थ को स्पष्ट करता है।
- source_word: מִשְׁפָּט
  choice: न्याय
  rationale: राजकीय शासन के प्रसंग में उचित और न्यायपूर्ण निर्णय तथा व्यवस्था का भाव देता है।
- source_word: וּצְדָקָה
  choice: और धार्मिकता
  rationale: מִשְׁפָּט से भेद बनाए रखते हुए पारंपरिक बाइबिलीय युग्म ‘न्याय और धार्मिकता’ को सुरक्षित रखता है।
- source_word: בָּאָרֶץ
  choice: देश में
  rationale: यिर्मयाह के राष्ट्रीय-वाचायी प्रसंग में הארץ से यहूदा/इस्राएल का देश अभिप्रेत होने की संभावना है; ‘पृथ्वी’ अनावश्यक रूप से विश्वव्यापी अर्थ दे सकता है।
theological_decisions:
- issue: צֶמַח का मसीही/राजकीय संकेत
  choice: मुख्य पाठ में पौध-रूपक ‘अंकुर’ रखा और टिप्पणी में प्रतिज्ञात दाऊदी शासक की संभावित प्रतिध्वनि बताई।
  alternative: इसे स्पष्ट पदवी बनाकर ‘अंकुर’ के साथ अतिरिक्त राजकीय या मसीही शब्द जोड़ना।
  rationale: यिर्मयाह 23:5 का निकट समानांतर दाऊदी राजकीय व्यक्ति की ओर संकेत करता है, पर हिन्दी में अंग्रेज़ी जैसे capitalization से पदवी नहीं दिखाई जा सकती; मुख्य पाठ में अतिरिक्त व्याख्या जोड़ना मूल से आगे जाता।
- issue: וְעָשָׂה का काल
  choice: 'भविष्यकाल: ‘वह ... करेगा।’'
  alternative: रूपगत पूर्णकाल के आधार पर ‘उसने किया।’
  rationale: भविष्यवाणी में यह क्रिया ‘मैं उगाऊँगा’ की भावी प्रतिज्ञा को आगे बढ़ाती है; भूतकाल हिन्दी पाठक को भ्रमित करेगा।
- issue: צֶמַח צְדָקָה की व्याख्या
  choice: ‘धर्मी अंकुर’
  alternative: ‘धार्मिकता का अंकुर’ अथवा ‘न्यायी अंकुर’
  rationale: विशेषणात्मक हिन्दी सबसे स्वाभाविक है, किंतु इब्रानी संबंध-विन्यास की वास्तविक अस्पष्टता टिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण भविष्यवाणी-संबंधी गद्य। ‘दाऊद’, ‘धर्मी’, ‘न्याय’ और ‘धार्मिकता’ परिचित बाइबिलीय शब्दावली हैं। टिप्पणी-चिह्न अंग्रेज़ी परामर्श-पाठ के क्रम [b][a] में रखे गए हैं ताकि प्रत्येक उपलब्ध टिप्पणी मुख्य पाठ से स्पष्टतः जुड़ी रहे।
