source:
  edition: WLC
  text: וַ/הֲשִֽׁבֹתִי֙ אֶת שְׁב֣וּת יְהוּדָ֔ה וְ/אֵ֖ת שְׁב֣וּת יִשְׂרָאֵ֑ל וּ/בְנִתִ֖י/ם כְּ/בָ/רִֽאשֹׁנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/007.yaml
  text: And I will restore the fortunes of Judah and the fortunes of Israel[a], and I will rebuild them as at the first.
translation:
  language: hi
  text: मैं यहूदा की समृद्धि और इस्राएल की समृद्धि को पुनः स्थापित करूँगा[a], और उन्हें पहले की तरह पुनः निर्मित करूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक शाब्दिक रूप में, “यहूदा और इस्राएल की बंधुआई को लौटाऊँगा”; अर्थात् उनकी बंधुआई की दशा को पलट दूँगा। संभवतः, “यहूदा और इस्राएल के बंदियों को वापस ले आऊँगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲשִׁבֹתִי
  choice: मैं ... फिर लौटा दूँगा
  rationale: שוב के हिफ़ील रूप में यहाँ किसी दशा को पलटकर पुनः स्थापित करने का कारक अर्थ है। ‘फिर लौटा दूँगा’ शְׁבוּת के साथ बनी पूरी अभिव्यक्ति में पुनर्बहाली का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שְׁבוּת
  choice: समृद्धि
  rationale: הֵשִׁיב שְׁבוּת मुहावरा केवल निर्वासन से वापसी नहीं, बल्कि खोई हुई अच्छी दशा की व्यापक पुनर्बहाली भी दर्शा सकता है। ‘समृद्धि’ इस व्यापक अर्थ को संक्षेप में रखती है; बंधुआई और बंदियों की वापसी से जुड़े अधिक शाब्दिक विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: יְהוּדָה
  choice: यहूदा
  rationale: इस जनसमुदाय और राज्य के नाम का प्रचलित हिन्दी रूप।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: राष्ट्रीय नाम का प्रचलित हिन्दी रूप; यहूदा के साथ इसका प्रयोग समूचे वाचा-समुदाय की बहाली की ओर संकेत करता है।
- source_word: וּבְנִתִים
  choice: और उन्हें ... फिर से बसाऊँगा
  rationale: בנה का मूल अर्थ ‘बनाना/निर्माण करना’ है, पर लोगों या समुदायों के विषय में यह उन्हें स्थापित अथवा पुनः बसाने का अर्थ ले सकता है। विनाश के बाद बहाली के प्रसंग में ‘फिर से बसाऊँगा’ स्वाभाविक है और बहुवचन कर्म-प्रत्यय को ‘उन्हें’ से सुरक्षित रखता है।
- source_word: כְּבָרִאשֹׁנָה
  choice: पहले के समान
  rationale: यह पदबंध पूर्व दशा से तुलना करता है। ‘पहले के समान’ आधुनिक, स्पष्ट और गरिमापूर्ण हिन्दी में उसका तुलनात्मक बल बनाए रखता है।
theological_decisions:
- issue: बहाली की भविष्यवाणी में שְׁבוּת का दायरा
  choice: समृद्धि फिर लौटा दूँगा
  alternative: बंधुआई की दशा पलट दूँगा / बंदियों को वापस ले आऊँगा
  rationale: इब्रानी मुहावरा राष्ट्रीय दशा की व्यापक बहाली और निर्वासन से वापसी—दोनों को समेट सकता है। मुख्य पाठ में व्यापक पुनर्बहाली व्यक्त की गई है, जबकि पादटिप्पणी अधिक शाब्दिक निर्वासन-संबंधी संभावनाएँ सुरक्षित रखती है।
- issue: וּבְנִתִים में निर्माण अथवा सामुदायिक पुनर्स्थापना
  choice: उन्हें फिर से बसाऊँगा
  alternative: उनका फिर से निर्माण करूँगा / उन्हें फिर से बनाऊँगा
  rationale: बहुवचन प्रत्यय यहूदा और इस्राएल के लोगों अथवा समुदायों की ओर संकेत करता है। हिन्दी में व्यक्तियों का ‘निर्माण’ अस्वाभाविक लग सकता है; ‘बसाऊँगा’ पुनर्स्थापना का भाव देता है, पर निर्माण की सम्भावना को पूरी तरह नकारता नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण भविष्यवाणी-वचन। ‘समृद्धि’ व्यापक पुनर्बहाली को व्यक्त करती है और [a] निर्वासन-संबंधी शाब्दिक अस्पष्टता को सुरक्षित रखती है।
