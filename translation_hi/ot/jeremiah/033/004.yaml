  rationale: The revision directly attaches the participial relative clause to the two groups of houses and clarifies the contextual purpose/adversative relation of the Hebrew preposition without adding a specific tactical explanation. It preserves the military imagery, the repeated ‘houses,’ the present prophetic formula, the colon that introduces the continuation in the next verse, and all footnote anchors.
