source:
  edition: WLC
  text: כִּי֩ כֹ֨ה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל עַל בָּתֵּי֙ הָ/עִ֣יר הַ/זֹּ֔את וְ/עַל בָּתֵּ֖י מַלְכֵ֣י יְהוּדָ֑ה הַ/נְּתֻצִ֕ים אֶל הַ/סֹּלְל֖וֹת וְ/אֶל הֶ/חָֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/004.yaml
  text: 'For thus says Yahweh, the God of Israel, concerning the houses of this city and the houses of the kings of Judah that are being torn down for the siege ramps and for the sword:'
translation:
  language: hi
  text: 'क्योंकि याहवे, इस्राएल का परमेश्वर, इस नगर के घरों और यहूदा के राजाओं के घरों[a] के विषय में यों कहता है, जो घेराबंदी के टीलों[b] और तलवार[c] का सामना करने के लिए ढाए जा रहे हैं:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहूदा के राजाओं के महलों।”
    reason: lexical_alternative
  - marker: b
    text: या, “घेराबंदी के बाँध” अथवा “घेराबंदी के मोर्चों।”
    reason: lexical_alternative
  - marker: c
    text: “तलवार” इब्रानी में युद्ध या संहार के लिए प्रयुक्त एक लाक्षणिक अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण अथवा स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ इस संबंध को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: כֹה אָמַר
  choice: यह कहता है
  rationale: यह नबूवत का प्रचलित संदेशवाहक-सूत्र है; वर्तमानकालीन रूप उसके सूत्रात्मक बल को सुरक्षित रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के विशिष्ट वाचा-नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल का परमेश्वर
  rationale: इब्रानी संबंधवाचक पदबंध का स्पष्ट और स्वाभाविक हिंदी रूप।
- source_word: בָּתֵּי הָעִיר הַזֹּאת
  choice: इस नगर के घरों
  rationale: मूल पदबंध के निकट रहते हुए नगर की इमारतों का संकेत देता है; संदर्भ में यह नगर यरूशलेम है।
- source_word: בָּתֵּי מַלְכֵי יְהוּדָה
  choice: यहूदा के राजाओं के घरों
  rationale: בָּתֵּי की पुनरावृत्ति को ‘घरों’ द्वारा सुरक्षित रखा गया है; राजकीय संदर्भ में ‘महलों’ की संभावना पाद-टिप्पणी में दी गई है।
- source_word: הַנְּתֻצִים
  choice: ढाए जा रहे हैं
  rationale: निष्क्रिय कृदंत तत्काल चल रही या वर्णित युद्धकालीन कार्रवाई को व्यक्त कर सकता है; यह रूप उसकी प्रक्रियात्मक छाया को बनाए रखता है।
- source_word: הַסֹּלְלוֹת
  choice: घेराबंदी के टीलों
  rationale: यह घेराबंदी के समय बनाए गए मिट्टी के टीले या चढ़ाई के बाँध को दर्शाता है; ‘टीले’ सामान्य पाठक के लिए ठोस और सुबोध है।
- source_word: הֶחָרֶב
  choice: तलवार
  rationale: मूल सैन्य रूपक को बनाए रखा गया है; यह युद्ध या संहार का लक्षणात्मक संकेत हो सकता है।
- source_word: אֶל
  choice: के लिए
  rationale: शाब्दिक दिशा-बोधक संबंध यहाँ प्रयोजन अथवा सामना करने के भाव में समझा जा सकता है। ‘के लिए’ मूल की संक्षिप्तता और कुछ अर्थगत खुलापन बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा प्रभु
  rationale: मूल में चतुरक्षरीय विशिष्ट नाम प्रत्यक्ष रूप से है; ‘याहवे’ उसे सामान्य उपाधि में बदले बिना प्रस्तुत करता है।
- issue: घरों को ढाने का प्रयोजन और אֶל का संबंध
  choice: घेराबंदी के टीलों और तलवार के लिए
  alternative: घेराबंदी के टीलों और तलवार का सामना करने के लिए
  rationale: इब्रानी वाक्य अत्यंत संक्षिप्त है और प्रयोजन, दिशा या विरोध का संबंध व्यक्त कर सकता है। मुख्य पाठ में विस्तार जोड़कर अस्पष्टता को पूरी तरह समाप्त नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, किंतु सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। नबूवत के सूत्र को स्वाभाविक हिंदी क्रम में रखा गया है। घरों की पुनरावृत्ति, निष्क्रिय कार्रवाई और सैन्य रूपक को यथासंभव सुरक्षित रखा गया है।
