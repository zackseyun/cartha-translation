  text: וְ/נָתַתִּ֣י אֶת הָ/אֲנָשִׁ֗ים הָ/עֹֽבְרִים֙ אֶת בְּרִתִ֔/י אֲשֶׁ֤ר לֹֽא הֵקִ֨ימוּ֙ אֶת דִּבְרֵ֣י הַ/בְּרִ֔ית אֲשֶׁ֥ר כָּרְת֖וּ לְ/פָנָ֑/י הָ/עֵ֨גֶל֙ אֲשֶׁ֣ר כָּרְת֣וּ לִ/שְׁנַ֔יִם וַ/יַּעַבְר֖וּ בֵּ֥ין בְּתָרָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/018.yaml
  text: And I will hand over the men who transgressed my covenant[a], who did not uphold the words of the covenant that they made before me[c][b], the calf that they cut in two and passed between its pieces.
translation:
  language: hi
  text: और मैं उन पुरुषों को सौंप दूँगा जिन्होंने मेरी वाचा का उल्लंघन किया[a] और उस वाचा की बातों का पालन नहीं किया[b], जो उन्होंने मेरे सामने बाँधी थी[c]—उस बछड़े के समान जिसे उन्होंने दो टुकड़ों में काटा और जिसके टुकड़ों के बीच से होकर वे गुज़रे थे[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उल्लंघन किया’ के लिए प्रयुक्त हिब्रू क्रिया का मूल अर्थ ‘पार जाना’ भी है; आगे यही क्रिया बछड़े के टुकड़ों के ‘बीच से होकर गुज़रने’ के लिए आती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘वाचा की बातें’; अर्थात वाचा की शर्तें या विधान।
    reason: lexical_alternative
  - marker: c
    text: हिब्रू में ‘वाचा बाँधना’ का शाब्दिक मुहावरा ‘वाचा काटना’ है; यहाँ वाचा के लिए ‘बाँधी’ और बछड़े के लिए ‘काटा’ प्रयोग किया गया है।
    reason: lexical_alternative
  - marker: d
    text: पशु को काटकर उसके टुकड़ों के बीच से गुज़रना वाचा बाँधने की एक विधि थी। इससे वाचा तोड़ने वाले पर उसी प्रकार के न्याय का आह्वान होता था; उत्पत्ति 15:9–17 से तुलना करें। हिब्रू का अंतिम खंड अत्यंत संक्षिप्त है; हिन्दी में ‘के समान’ संबंध स्पष्ट करने के लिए जोड़ा गया है, जबकि दण्ड का परिणाम अगले पद में आगे स्पष्ट होता है।
    reason: cultural_note
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: और मैं ... सौंप दूँगा
  rationale: נתן का मूल अर्थ ‘देना’ है, पर न्याय के इस प्रसंग में इसका आशय किसी को दूसरे के अधिकार में सौंप देना है।
- source_word: הָאֲנָשִׁים
  choice: उन पुरुषों को
  rationale: אישׁ का पुल्लिंग बहुवचन यहाँ वाचा बाँधने वाले विशिष्ट पुरुषों को सूचित करता है; इसलिए सामान्य ‘लोगों’ के बजाय लिंग-सटीक अनुवाद रखा गया है।
- source_word: הָעֹבְרִים אֶת־בְּרִיתִי
  choice: जिन्होंने मेरी वाचा का उल्लंघन किया
  rationale: वाचा के साथ עבר एक मुहावरा है जिसका अर्थ वाचा तोड़ना या उसका उल्लंघन करना है। पादटिप्पणी में उसी क्रिया की आगे आने वाली शाब्दिक गति ‘बीच से होकर गुज़रे’ के साथ शब्द-संबंध बताया गया है।
- source_word: הֵקִימוּ אֶת דִּבְרֵי הַבְּרִית
  choice: उस वाचा की बातों का पालन नहीं किया
  rationale: הקים यहाँ वाचा की शर्तों को कायम रखने अथवा पूरा करने के अर्थ में है। ‘बातों का पालन’ हिब्रू की ‘वाचा की बातें’ अभिव्यक्ति को रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: כָּרְתוּ לְפָנַי
  choice: जो उन्होंने मेरे सामने बाँधी थी
  rationale: כרת ברית का अर्थ ‘वाचा बाँधना/करना’ है। ‘बाँधी’ हिन्दी का स्वाभाविक वाचा-मुहावरा है और आगे पशु को सचमुच काटने की क्रिया से भेद बनाए रखता है।
- source_word: הָעֵגֶל
  choice: उस बछड़े को
  rationale: עגל युवा गोवंश को दर्शाता है; ‘बछड़ा’ इसका सीधा और प्रचलित हिन्दी रूप है।
- source_word: כָּרְתוּ לִשְׁנַיִם
  choice: दो टुकड़ों में काटा
  rationale: यह बलि-पशु को दो भागों में काटने की ठोस क्रिया है; यह रूप संक्षिप्त और चित्रात्मक है।
- source_word: וַיַּעַבְרוּ בֵּין בְּתָרָיו
  choice: जिसके टुकड़ों के बीच से होकर वे गुज़रे थे
  rationale: यह वाचा-विधि में की गई वास्तविक गति है। ‘टुकड़ों’ पशु के कटे हुए भागों के लिए स्वाभाविक हिन्दी है।
theological_decisions:
- issue: अंतिम ‘बछड़े’ वाले खंड का दण्ड पाए पुरुषों से संबंध
  choice: हिब्रू की संक्षिप्त, व्याकरणिक रूप से अकस्मात संरचना को डैश के साथ बनाए रखा गया है; ‘जैसे बछड़े को’ अथवा पूरा दण्ड-वाक्य नहीं जोड़ा गया।
  alternative: 'स्पष्ट तुलना जोड़ना: ‘उस बछड़े के समान’; अथवा परिणाम खोलकर कहना कि उनका हाल बछड़े जैसा होगा।'
  rationale: मसोरेटी पाठ में तुलना-सूचक शब्द नहीं है और ‘उस बछड़े को’ सीधे, किंतु संकुचित ढंग से आता है। अगला पद दण्ड का आशय स्पष्ट करता है; इस पद में उसे विस्तार से जोड़ना मूल की अस्पष्टता को समय से पहले सुलझा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप। ‘वाचा’, ‘उल्लंघन’, ‘पालन’ और ‘सौंप दूँगा’ जैसे स्थापित किन्तु सहज शब्द रखे गए हैं। मूल की संकुचित अंतिम संरचना को अधिक व्याख्यात्मक बनाने के बजाय डैश और पादटिप्पणी से संकेतित किया गया है।
