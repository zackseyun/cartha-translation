  text: וְ/אַתָּ֗ה לֹ֚א תִמָּלֵט֙ מִ/יָּד֔/וֹ כִּ֚י תָּפֹ֣שׂ תִּתָּפֵ֔שׂ וּ/בְ/יָד֖/וֹ תִּנָּתֵ֑ן וְֽ֠/עֵינֶי/ךָ אֶת עֵינֵ֨י מֶֽלֶךְ בָּבֶ֜ל תִּרְאֶ֗ינָה וּ/פִ֛י/הוּ אֶת פִּ֥י/ךָ יְדַבֵּ֖ר וּ/בָבֶ֥ל תָּבֽוֹא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/003.yaml
  text: And you will not escape from his hand[a], for you will surely be captured and given into his hand. Your eyes will see the eyes of the king of Babylon, and his mouth will speak to your mouth, and you will go to Babylon.
translation:
  language: hi
  text: और तुम उसके हाथ से नहीं बचोगे, क्योंकि तुम निश्चय ही पकड़े जाओगे और उसके हाथ में सौंप दिए जाओगे। तुम्हारी आँखें बाबेल के राजा की आँखों को देखेंगी, और वह तुमसे सीधे बात करेगा[a], और तुम बाबेल जाओगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से है, ‘उसका मुँह तुम्हारे मुँह से बात करेगा।’ अर्थात, वह तुमसे सीधे, आमने-सामने बात करेगा।
    reason: मूल के असामान्य ठोस मुहावरे को पादटिप्पणी में सुरक्षित रखते हुए मुख्य पाठ में उसका स्पष्ट और स्वाभाविक हिन्दी अर्थ दिया गया है।
lexical_decisions:
- source_word: תִמָּלֵט מִיָּדוֹ
  choice: उसके हाथ से नहीं बचोगे
  rationale: ‘हाथ से बचना’ दूसरे की शक्ति या नियंत्रण से निकलने का इब्रानी मुहावरा है। हिन्दी में यह स्वाभाविक है और मूल का ‘हाथ’ वाला चित्र भी बनाए रखता है।
- source_word: כִּי תָפֹשׂ תִּתָּפֵשׂ
  choice: क्योंकि तुम निश्चय ही पकड़े जाओगे
  rationale: क्रिया की गहन रचना पकड़े जाने की निश्चितता पर बल देती है; ‘निश्चय ही’ उस बल को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וּבְיָדוֹ תִּנָּתֵן
  choice: और उसके हाथ में सौंप दिए जाओगे
  rationale: निफ़अल रूप और ‘उसके हाथ में’ मिलकर किसी के अधिकार में सौंपे जाने का भाव देते हैं। अनुवाद मूल बिंब और नियंत्रण के अर्थ दोनों को सुरक्षित रखता है।
- source_word: וְעֵינֶיךָ אֶת־עֵינֵי מֶלֶךְ בָּבֶל תִּרְאֶינָה
  choice: तुम्हारी आँखें बाबेल के राजा की आँखों को देखेंगी
  rationale: मूल में आँखों से आँखें देखने का सजीव और असामान्य प्रयोग है, जो राजा से प्रत्यक्ष सामना दर्शाता है। इसे अधिक सामान्य ‘आमने-सामने’ में बदलने के बजाय संरक्षित किया गया है।
- source_word: וּפִיהוּ אֶת־פִּיךָ יְדַבֵּר
  choice: और उसका मुँह तुम्हारे मुँह से बात करेगा
  rationale: यह मूल के ‘उसका मुँह तुम्हारे मुँह से बोलेगा’ जैसे ठोस बिंब को निकटता से रखता है। हिन्दी में अर्थ समझ में आता है, जबकि अधिक मुहावरेदार अर्थ पादटिप्पणी में दिया गया है।
- source_word: וּבָבֶל תָּבוֹא
  choice: और तुम बाबेल जाओगे
  rationale: בוא का अर्थ दृष्टिकोण के अनुसार ‘आना’ या ‘जाना’ हो सकता है। सम्बोधित व्यक्ति के वर्तमान स्थान से बाबेल की ओर गति के लिए हिन्दी में ‘जाओगे’ स्वाभाविक है।
