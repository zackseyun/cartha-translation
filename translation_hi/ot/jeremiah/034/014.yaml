base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/014.yaml
  text: At the end of seven years[a], each of you shall send away his Hebrew brother who has been sold to you and has served you six years; you shall send him away free from you[c][b]. But your fathers did not listen to me or incline their ear.
translation:
  language: hi
  text: “सात वर्ष पूरे होने पर[a] तुम में से हर एक अपने उस इब्री भाई[b] को जाने दे, जो तुम्हें बेचा गया हो[c] और जिसने छह वर्ष तुम्हारी सेवा की हो; उसे अपने पास से स्वतंत्र करके भेज दे। परन्तु तुम्हारे पूर्वजों ने मेरी नहीं सुनी और न अपना कान मेरी ओर झुकाया।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सात वर्ष के बाद।” इब्री पदबंध को सात वर्षों की अवधि पूरी होने के संकेत के रूप में समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “अपने साथी इब्री” अथवा “अपने इब्री बंधु।”
    reason: lexical_alternative
  - marker: c
    text: या, “जिसने अपने आपको तुम्हें बेच दिया हो।” इस कानूनी प्रसंग में इब्री क्रियारूप का अर्थ निष्क्रिय या आत्मवाचक हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקֵּץ שֶׁבַע שָׁנִים
  choice: सात वर्ष पूरे होने पर
  rationale: यह पदबंध सात वर्षों की अवधि के अंत या पूर्ण होने को सूचित करता है। यह हिन्दी में स्वाभाविक है और सटीक पंचांग-संबंधी व्यवस्था को अनावश्यक रूप से निर्धारित नहीं करता।
- source_word: תְּשַׁלְּחוּ אִישׁ
  choice: तुममें से हर एक ... छोड़ दे
  rationale: बहुवचन क्रिया के साथ אִישׁ का प्रयोग वितरणात्मक है। ‘तुममें से हर एक’ इस भाव को स्वाभाविक हिन्दी में व्यक्त करता है; ‘छोड़ दे’ यहाँ कानूनी मुक्ति का अर्थ देता है।
- source_word: אָחִיו הָעִבְרִי
  choice: अपने उस इब्री भाई को
  rationale: ‘भाई’ मूल के पारिवारिक और वाचा-समुदाय संबंधी स्वर को बनाए रखता है; यहाँ इसका अर्थ सहजातीय इब्री भी हो सकता है।
- source_word: אֲשֶׁר יִמָּכֵר לְךָ
  choice: जो तुम्हारे हाथ बिक गया हो
  rationale: निफ़अल रूप को सीधे निष्क्रिय अर्थ में रखा गया है। कानूनी प्रसंग में आत्म-विक्रय का अर्थ संभव है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וַעֲבָדְךָ שֵׁשׁ שָׁנִים
  choice: और जिसने छः वर्ष तुम्हारी सेवा की हो
  rationale: यह मुक्ति से पहले पूरी हुई सेवा-अवधि बताता है। ‘सेवा की हो’ עבד के प्रसंगानुकूल अर्थ को स्पष्ट और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: וְשִׁלַּחְתּוֹ חָפְשִׁי מֵעִמָּךְ
  choice: तुम उसे अपने यहाँ से स्वतंत्र करके भेज देना
  rationale: שלח की पुनरावृत्ति को ‘भेज देना’ से रखा गया है और חָפְשִׁי को ‘स्वतंत्र’ से व्यक्त किया गया है। ‘अपने यहाँ से’ מֵעִמָּךְ का स्वाभाविक हिन्दी रूप है।
- source_word: וְלֹא שָׁמְעוּ אֲבוֹתֵיכֶם אֵלַי
  choice: पर तुम्हारे पूर्वजों ने न तो मेरी सुनी
  rationale: ‘मेरी सुनी’ श्रवण के रूपक और आज्ञापालन के निहित भाव दोनों को हिन्दी में बनाए रखता है। ‘पूर्वज’ आधुनिक हिन्दी में पितरों/बाप-दादों का व्यापक और गरिमापूर्ण रूप है।
- source_word: וְלֹא הִטּוּ אֶת אָזְנָם
  choice: और न मेरी ओर कान लगाया
  rationale: यह मूल इब्री मुहावरे की श्रवण-छवि को बनाए रखते हुए हिन्दी में ध्यान देने और मानने का अर्थ देता है।
theological_decisions:
- issue: वाचा-समुदाय की पुरुषवाची संबंध-संज्ञा
  choice: इब्री भाई
  alternative: साथी इब्री; इब्री बंधु
  rationale: मूल में पुरुष एकवचन और पारिवारिक संबंध की भाषा है। ‘भाई’ उसके कानूनी तथा वाचागत आत्मीय स्वर को बिना लिंग-निरपेक्ष किए सुरक्षित रखता है।
- issue: बंधुआ सेवा में प्रवेश का स्वरूप
  choice: तुम्हारे हाथ बिक गया हो
  alternative: जिसने अपने आपको तुम्हारे हाथ बेच दिया हो
  rationale: मूल निफ़अल रूप निष्क्रिय या प्रसंगतः आत्मवाचक समझा जा सकता है। मुख्य पाठ में सीधा निष्क्रिय अर्थ रखा गया है और वास्तविक वैकल्पिक अर्थ पादटिप्पणी में दिया गया है, जिससे ऋण-सेवा के स्वरूप को अनावश्यक रूप से निश्चित न किया जाए।
- issue: मुक्ति की कानूनी परिणति
  choice: स्वतंत्र करके भेज देना
  alternative: आजाद करके जाने देना
  rationale: यह חָפְשִׁי के स्वतंत्र व्यक्ति होने के कानूनी भाव और שלח की क्रियात्मक छवि, दोनों को गरिमापूर्ण आधुनिक हिन्दी में रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रूप अपनाया गया है। कानूनी आदेश की गंभीरता के लिए ‘छोड़ दे’ और ‘स्वतंत्र करके भेज देना’ रखा गया है। ‘मेरी ओर कान लगाया’ मूल की श्रवण-छवि को सुरक्षित रखता है। सभी पादटिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
