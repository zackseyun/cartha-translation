source:
  edition: WLC
  text: לְ֠/שַׁלַּח אִ֣ישׁ אֶת עַבְדּ֞/וֹ וְ/אִ֧ישׁ אֶת שִׁפְחָת֛/וֹ הָ/עִבְרִ֥י וְ/הָ/עִבְרִיָּ֖ה חָפְשִׁ֑ים לְ/בִלְתִּ֧י עֲבָד בָּ֛/ם בִּ/יהוּדִ֥י אָחִ֖י/הוּ אִֽישׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/009.yaml
  text: that each man should set free his male servant and each man his female servant[a], the Hebrew man and the Hebrew woman, so that no one should enslave a Jew, his brother, among them.
translation:
  language: hi
  text: कि हर पुरुष अपने दास को और हर पुरुष अपनी दासी को स्वतंत्र कर दे—अर्थात इब्री पुरुष और इब्री स्त्री को—ताकि उनमें कोई भी व्यक्ति अपने यहूदी भाई को दास न बनाए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘यहूदी’ के स्थान पर ‘यहूदावासी’ भी संभव है। इब्रानी शब्द जातीय-धार्मिक अर्थ में ‘यहूदी’ अथवा इस ऐतिहासिक संदर्भ में अधिक विशेष रूप से ‘यहूदावासी’ को सूचित कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: לְשַׁלַּח ... חָפְשִׁים
  choice: स्वतंत्र कर दे
  rationale: क्रिया और विधेय विशेषण मिलकर केवल विदा करने नहीं, बल्कि दासता से मुक्त करने का कानूनी अर्थ व्यक्त करते हैं।
- source_word: עַבְדּוֹ
  choice: अपने इब्री दास
  rationale: इस प्रसंग में बंधुआ स्थिति मुख्य है; इसलिए ‘सेवक’ की अपेक्षा ‘दास’ अधिक स्पष्ट है। इब्री विशेषण को संबंधित संज्ञा के साथ रखना हिन्दी में स्वाभाविक है।
- source_word: שִׁפְחָתוֹ
  choice: अपनी इब्री दासी
  rationale: यह स्त्रीलिंग दासता-सूचक पद है; ‘दासी’ लिंगभेद और सामाजिक-कानूनी स्थिति दोनों बनाए रखता है।
- source_word: הָעִבְרִי וְהָעִבְרִיָּה
  choice: इब्री दास ... इब्री दासी
  rationale: मूल के पुल्लिंग और स्त्रीलिंग इब्री पदों को स्पष्ट रखा गया है, पर हिन्दी में अस्वाभाविक ‘इब्री पुरुष और इब्री स्त्री’ से बचते हुए उन्हें दास-दासी के विशेषण के रूप में जोड़ा गया है।
- source_word: לְבִלְתִּי עֲבָד בָּם
  choice: दास का काम न कराए
  rationale: यहाँ आशय दूसरे से दास के रूप में सेवा कराना या उसे बंधन में रखना है। ‘दास का काम कराना’ हिन्दी में कारक अर्थ को स्पष्ट करता है।
- source_word: בִּיהוּדִי אָחִיהוּ אִישׁ
  choice: अपने यहूदी भाई से
  rationale: ‘यहूदी’ आधुनिक पाठक के लिए परिचित है और ‘भाई’ मूल की सामुदायिक-संबंध भाषा को बनाए रखता है। ‘यहूदी’ और ऐतिहासिक रूप से अधिक विशिष्ट ‘यहूदावासी’ की संभावना पाद-टिप्पणी में सुरक्षित है।
- source_word: אִישׁ ... וְאִישׁ ... אִישׁ
  choice: हर पुरुष ... हर पुरुष ... कोई भी
  rationale: आरंभ में घर के पुरुष स्वामियों से संबंधित वितरणात्मक पुनरावृत्ति रखी गई है; अंतिम निषेध में ‘कोई भी’ स्वाभाविक हिन्दी है।
theological_decisions:
- issue: दासता-सूचक शब्दों का अनुवाद
  choice: ‘दास’ और ‘दासी’
  alternative: ‘सेवक’ और ‘सेविका’
  rationale: वाचा का विषय वास्तविक बंधुआ-दासता से मुक्ति है; नरम ‘सेवक’ शब्द उस कानूनी और सामाजिक स्थिति को धुंधला कर सकता है।
- issue: יהודי की पहचान
  choice: मुख्य पाठ में ‘यहूदी’
  alternative: ‘यहूदावासी’
  rationale: दोनों अर्थ संभव हैं। ‘यहूदी’ अधिक परिचित है, जबकि देर-राजतंत्रीय ऐतिहासिक संदर्भ में ‘यहूदावासी’ अधिक भौगोलिक-राजनीतिक हो सकता है; इस वास्तविक अस्पष्टता को पाद-टिप्पणी में रखा गया है।
- issue: लिंग-स्पष्टता
  choice: ‘हर पुरुष’, ‘दास’ और ‘दासी’ द्वारा लिंगभेद बनाए रखना
  alternative: लिंग-निरपेक्ष ‘हर व्यक्ति’ अथवा सामूहिक पद
  rationale: मूल पाठ स्वामियों के लिए पुल्लिंग एकवचन और दासों के लिए पुल्लिंग-स्त्रीलिंग दोनों रूप स्पष्ट रूप से देता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। ‘स्वतंत्र कर दे’ कानूनी मुक्ति को स्पष्ट करता है। अंतिम वाक्यांश को हिन्दी की स्वाभाविक कारक रचना में रखा गया है, जबकि मूल का ‘भाई’ संबंध-सूचक पद सुरक्षित है।
