base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/019.yaml
  text: the officials of Judah and the officials of Jerusalem[a], the court officials and the priests, and all the people of the land who passed between the pieces of the calf—
translation:
  language: hi
  text: यहूदा के अधिकारी, यरूशलेम के अधिकारी, राजदरबार के अधिकारी[a], याजक और देश के सभी लोग, जो बछड़े के टुकड़ों के बीच से होकर गुज़रे थे—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “नपुंसक।” इब्रानी शब्द का अर्थ वास्तविक रूप से नपुंसक व्यक्ति या राजदरबार का अधिकारी, दोनों हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי
  choice: हाकिम
  rationale: यह शब्द शासकीय नेतृत्व या उच्च अधिकारियों को सूचित करता है। ‘हाकिम’ आधुनिक हिन्दी में स्वाभाविक है और यहाँ यहूदा तथा यरूशलेम के नेतृत्व-वर्ग के लिए उपयुक्त है।
- source_word: יְהוּדָה
  choice: यहूदा
  rationale: इस स्थान और जनसमूह के नाम का प्रचलित हिन्दी रूप।
- source_word: יְרוּשָׁלִַם
  choice: यरूशलेम
  rationale: नगर के नाम का प्रचलित हिन्दी रूप।
- source_word: הַסָּרִסִים
  choice: राजदरबार के अधिकारी
  rationale: स्रोत शब्द शाब्दिक रूप से ‘नपुंसकों’ अथवा पद के अर्थ में राजदरबार के अधिकारियों को सूचित कर सकता है। सामाजिक वर्गों की इस सूची में पदगत अर्थ संभावित है, जबकि दूसरा अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: הַכֹּהֲנִים
  choice: याजक
  rationale: כֹּהֲנִים का मानक और प्रतिष्ठित हिन्दी अनुवाद।
- source_word: כֹל עַם הָאָרֶץ
  choice: देश के वे सभी लोग
  rationale: मूल के सामूहिक विस्तार को बनाए रखता है और हिन्दी वाक्य में संबंधवाचक उपवाक्य से स्वाभाविक रूप से जुड़ता है; किसी विशेष सामाजिक वर्ग का अर्थ अतिरिक्त रूप से नहीं जोड़ता।
- source_word: הָעֹבְרִים
  choice: जो ... होकर गुज़रे थे
  rationale: यह सहभागी रूप उन लोगों को बताता है जिन्होंने वाचा की रस्म पहले पूरी की थी। ‘गुज़रे थे’ प्रसंग के पूर्वकालिक संदर्भ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בֵּין
  choice: के बीच से होकर
  rationale: यह वाचा की रस्म में दो टुकड़ों के मध्य से गुज़रने की गति को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בִּתְרֵי
  choice: टुकड़ों
  rationale: यह शब्द काटकर किए गए भागों को सूचित करता है; पिछले पद में बछड़े को दो भागों में काटने का प्रसंग इसे स्पष्ट करता है।
- source_word: הָעֵגֶל
  choice: बछड़े
  rationale: עֵגֶל का सामान्य अर्थ ‘बछड़ा’ है और यह निकटवर्ती प्रसंग के अनुरूप है।
theological_decisions:
- issue: सामाजिक सूची में סָרִיסִים का अर्थ
  choice: मुख्य पाठ में ‘राजदरबार के अधिकारी’
  alternative: ‘नपुंसक’
  rationale: इब्रानी शब्द शारीरिक स्थिति और राजकीय पद, दोनों को सूचित कर सकता है। यहाँ प्रशासनिक वर्ग का अर्थ संभावित है, पर वास्तविक शाब्दिक अस्पष्टता को पादटिप्पणी में बनाए रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। पद पिछले वाक्य की सूची को जारी रखता है, इसलिए अंत में दीर्घ डैश रखा गया है। ‘राजदरबार’ पदगत अर्थ को स्पष्ट करता है और पादटिप्पणी मूल की अस्पष्टता सुरक्षित रखती है।
