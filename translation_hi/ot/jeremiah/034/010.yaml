  text: וַ/יִּשְׁמְעוּ֩ כָל הַ/שָּׂרִ֨ים וְ/כָל הָ/עָ֜ם אֲשֶׁר בָּ֣אוּ בַ/בְּרִ֗ית לְ֠/שַׁלַּח אִ֣ישׁ אֶת עַבְדּ֞/וֹ וְ/אִ֤ישׁ אֶת שִׁפְחָת/וֹ֙ חָפְשִׁ֔ים לְ/בִלְתִּ֥י עֲבָד בָּ֖/ם ע֑וֹד וַֽ/יִּשְׁמְע֖וּ וַ/יְשַׁלֵּֽחוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/010.yaml
  text: So all the officials and all the people who had entered into the covenant to send away[a], each man his male servant and each man his female servant, free, so as not to make them serve any longer[b], obeyed and sent them away.
translation:
  language: hi
  text: तब सभी अधिकारियों और सभी लोगों ने, जो इस वाचा में शामिल हुए थे कि हर व्यक्ति अपने दास और अपनी दासी को स्वतंत्र छोड़ दे, ताकि फिर उन्हें दास न बनाए, इसे स्वीकार किया; उन्होंने बात मानी और उन्हें छोड़ दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ ... וַיִּשְׁמְעוּ
  choice: बात मानी
  rationale: שׁמע का मूल अर्थ ‘सुनना’ है, पर वाचा के इस प्रसंग में उसके बाद की कार्रवाई आज्ञापालन या सहमति के अनुसार काम करने का भाव स्पष्ट करती है। हिंदी में ‘बात मानी’ इस मुहावरेदार अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַשָּׂרִים
  choice: अधिकारियों
  rationale: यहाँ שׂרים नागरिक और शासकीय नेतृत्व रखने वाले पदाधिकारियों को दर्शाता है; ‘अधिकारी’ आधुनिक हिंदी में स्पष्ट और प्रसंगानुकूल है।
- source_word: בָּאוּ בַבְּרִית
  choice: वाचा बाँधी थी
  rationale: शाब्दिक रूप से ‘वाचा में आए’ का आशय वाचा में सम्मिलित होकर उसके प्रति प्रतिबद्ध होना है। ‘वाचा बाँधी’ स्वाभाविक हिंदी है और पारस्परिक औपचारिक प्रतिबद्धता बनाए रखता है।
- source_word: לְשַׁלַּח ... וַיְשַׁלֵּחוּ
  choice: स्वतंत्र करके छोड़ दे ... उन्हें छोड़ दिया
  rationale: שׁלח यहाँ केवल भेजने नहीं, दासता से मुक्त करके जाने देने को सूचित करता है। पहले प्रयोग में חָפְשִׁים के साथ ‘स्वतंत्र करके छोड़ दे’ और अंतिम कार्रवाई में ‘उन्हें छोड़ दिया’ अर्थ को स्पष्ट तथा प्रवाहपूर्ण रखते हैं।
- source_word: אִישׁ אֶת עַבְדּוֹ וְאִישׁ אֶת שִׁפְחָתוֹ
  choice: हर व्यक्ति अपने दास और अपनी दासी को
  rationale: दोहराया हुआ אִישׁ वितरणात्मक है। हिंदी में ‘हर व्यक्ति अपने दास और अपनी दासी’ उसी व्यापक दायित्व को स्वाभाविक ढंग से व्यक्त करता है, जबकि עבד और שפחה का पुरुष/स्त्री भेद ‘दास/दासी’ में बना रहता है।
- source_word: חָפְשִׁים
  choice: स्वतंत्र करके
  rationale: यह छोड़े जाने पर प्राप्त स्वतंत्र दशा को बताता है। हिंदी वाक्य में क्रियाविशेषणात्मक ‘स्वतंत्र करके’ इस परिणाम को स्पष्ट करता है।
- source_word: לְבִלְתִּי עֲבָד בָּם עוֹד
  choice: फिर उनसे दास का काम न कराए
  rationale: निर्माण का आशय है कि आगे उनसे दासों की तरह सेवा न कराई जाए। ‘दास का काम’ बंधुआ स्थिति को स्पष्ट रखता है और केवल सामान्य सेवा का भ्रम नहीं होने देता।
theological_decisions:
- issue: दासता-संबंधी शब्दावली
  choice: ‘दास’ और ‘दासी’
  alternative: ‘सेवक’ और ‘सेविका’
  rationale: यह प्रसंग कानूनी मुक्ति और बाध्य श्रम से संबंधित है। इसलिए ‘दास/दासी’ सामाजिक स्थिति और नैतिक गंभीरता को ‘सेवक/सेविका’ से अधिक ठीक दर्शाता है।
- issue: אִישׁ ... וְאִישׁ का वितरणात्मक रूप
  choice: ‘हर व्यक्ति अपने दास और अपनी दासी’
  alternative: ‘हर पुरुष अपने दास और हर पुरुष अपनी दासी’
  rationale: यहाँ אִישׁ का काम प्रत्येक वाचा-भागी पर दायित्व लागू करना है। हिंदी में शाब्दिक दोहराव अस्वाभाविक और संभावित रूप से भ्रामक होगा; ‘हर व्यक्ति’ वितरणात्मक अर्थ रखता है और दास/दासी का स्रोतगत लिंग-भेद भी सुरक्षित है।
- issue: שׁמע में सुनने और मानने का अर्थ-संबंध
  choice: मुख्य पाठ में ‘बात मानी’, पादटिप्पणी में ‘सुना’
  alternative: मुख्य पाठ में ‘सुना’
  rationale: अगली क्रिया बताती है कि उन्होंने केवल शब्द नहीं सुने, बल्कि वाचा का पालन किया। फिर भी इब्रानी क्रिया का मूल श्रवणार्थ पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिंदी। ‘वाचा’ बाइबलीय औपचारिकता बनाए रखता है; ‘दास/दासी’ कानूनी-मुक्ति के प्रसंग को बिना नरम किए व्यक्त करता है।
