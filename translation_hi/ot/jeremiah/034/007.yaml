translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। इब्रानी की दोहराई हुई ‘के विरुद्ध’ संरचना मुख्य पाठ में सुरक्षित है, जबकि लाकीश और अजेका को पहले पदबंध का स्पष्टीकरण मानने वाला संभावित अर्थ पादटिप्पणी में दिया गया है।
