  text: וְ/חֵ֣יל מֶֽלֶךְ בָּבֶ֗ל נִלְחָמִים֙ עַל יְר֣וּשָׁלִַ֔ם וְ/עַ֛ל כָּל עָרֵ֥י יְהוּדָ֖ה הַ/נּֽוֹתָר֑וֹת אֶל לָכִישׁ֙ וְ/אֶל עֲזֵקָ֔ה כִּ֣י הֵ֗נָּה נִשְׁאֲר֛וּ בְּ/עָרֵ֥י יְהוּדָ֖ה עָרֵ֥י מִבְצָֽר־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/007.yaml
  text: while the army of the king of Babylon was fighting against Jerusalem and against all the remaining cities of Judah[a], against Lachish and against Azekah, for these alone remained among the cities of Judah as fortified cities.
translation:
  language: hi
  text: उस समय बाबेल के राजा की सेना यरूशलेम के विरुद्ध और यहूदा के बाकी बचे सभी नगरों के विरुद्ध[a]—लाकीश और अजेका के विरुद्ध—लड़ रही थी, क्योंकि यहूदा के नगरों में केवल यही किलाबंद नगर बचे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अर्थात् लाकीश और अजेका।” इब्रानी वाक्य को इस अर्थ में भी समझा जा सकता है कि ये ही यहूदा के वे बचे हुए नगर थे जिनकी घेराबंदी हो रही थी।
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵיל
  choice: सेना
  rationale: सैन्य प्रसंग में यह शब्द धन या सामान्य सामर्थ्य नहीं, बल्कि संगठित सशस्त्र बल को सूचित करता है।
- source_word: נִלְחָמִים
  choice: लड़ रही थी
  rationale: कृदंत जारी सैन्य कार्रवाई व्यक्त करता है; हिन्दी में सामूहिक संज्ञा ‘सेना’ के साथ स्त्रीलिंग एकवचन क्रिया स्वाभाविक है।
- source_word: הַנּוֹתָרוֹת
  choice: बाकी बचे
  rationale: यह उन नगरों को बताता है जो उस समय तक पतित या अधिकृत नहीं हुए थे; यह आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: אֶל לָכִישׁ וְאֶל עֲזֵקָה
  choice: —लाकीश और अजेका के विरुद्ध—
  rationale: इब्रानी में אֶל की पुनरावृत्ति को रखते हुए दोनों नगरों को अलग सैन्य लक्ष्यों की तरह प्रस्तुत किया गया है। साथ ही, अगले उपवाक्य के कारण इनके द्वारा पहले बताए गए बचे नगरों की पहचान किए जाने की संभावना बनी रहती है।
- source_word: כִּי הֵנָּה
  choice: क्योंकि ... केवल यही
  rationale: स्त्रीलिंग सर्वनाम दोनों नगरों की ओर संकेत करता है; संदर्भ में निहित सीमित करने वाले भाव को ‘केवल’ स्पष्ट करता है।
- source_word: נִשְׁאֲרוּ
  choice: बचे थे
  rationale: यह अन्य नगरों के पतन के विपरीत इन नगरों के अब तक बने रहने को व्यक्त करता है।
- source_word: עָרֵי מִבְצָר
  choice: किलाबंद नगर
  rationale: यह रक्षात्मक दुर्गबंदी वाले नगरों के लिए वर्तमान हिन्दी का स्पष्ट और सटीक पद है।
- source_word: בְּעָרֵי יְהוּדָה
  choice: यहूदा के नगरों में
  rationale: हिन्दी में यह रचना समूह के भीतर शेष बचे नगरों का अंशात्मक भाव स्वाभाविक रूप से व्यक्त करती है।
