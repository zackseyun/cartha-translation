source:
  edition: WLC
  text: וְ/אֶת צִדְקִיָּ֨הוּ מֶֽלֶךְ יְהוּדָ֜ה וְ/אֶת שָׂרָ֗י/ו אֶתֵּן֙ בְּ/יַ֣ד אֹֽיְבֵי/הֶ֔ם וּ/בְ/יַ֖ד מְבַקְשֵׁ֣י נַפְשָׁ֑/ם וּ/בְ/יַד חֵ֚יל מֶ֣לֶךְ בָּבֶ֔ל הָ/עֹלִ֖ים מֵ/עֲלֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/021.yaml
  text: And I will give Zedekiah king of Judah and his officials into the hand of their enemies[a], into the hand of those who seek their life, and into the hand of the army of the king of Babylon, which has withdrawn from you.
translation:
  language: hi
  text: और मैं यहूदा के राजा सिदकिय्याह और उसके अधिकारियों को उनके शत्रुओं के हाथ में, उनकी जान लेना चाहने वालों के हाथ में, और बाबेल के राजा की उस सेना के हाथ में सौंप दूँगा, जो तुम्हारे पास से हट गई है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो तुम्हारे पास से हट रही है।” इब्रानी में शाब्दिक भाव “जो तुम्हारे ऊपर से हटकर जा रही है” है—यह नगर की घेराबंदी छोड़कर सेना के हटने का मुहावरा है।
    reason: इब्रानी कृदंत का कालगत भाव वर्तमान प्रक्रिया अथवा पूर्ण हो चुकी स्थिति, दोनों रूपों में समझा जा सकता है; साथ ही शाब्दिक गति-सूचक वाक्यांश का प्रसंगगत अर्थ स्पष्ट करना आवश्यक है।
lexical_decisions:
- source_word: צִדְקִיָּהוּ
  choice: सिदकिय्याह
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: שָׂרָיו
  choice: उसके अधिकारी
  rationale: राजकीय संदर्भ में שַׂר पदाधिकारी, शासक या प्रधान को सूचित कर सकता है; ‘अधिकारी’ सैन्य पद को अनावश्यक रूप से निश्चित किए बिना व्यापक अर्थ बनाए रखता है।
- source_word: אֶתֵּן בְּיַד
  choice: के हाथ में सौंप दूँगा
  rationale: यह इब्रानी मुहावरा किसी को दूसरे के अधिकार में कर देने का अर्थ देता है। ‘हाथ में’ को तीनों बार बनाए रखने से मूल की पुनरावृत्ति और बल सुरक्षित रहते हैं।
- source_word: אֹיְבֵיהֶם
  choice: उनके शत्रु
  rationale: बहुवचन संज्ञा और तृतीय पुरुष बहुवचन प्रत्यय का सीधा, स्वाभाविक अनुवाद।
- source_word: מְבַקְשֵׁי נַפְשָׁם
  choice: उनकी जान लेना चाहने वाले
  rationale: शाब्दिक रूप से ‘उनके प्राण को खोजने वाले’; संदर्भ में यह उन्हें मार डालने की इच्छा का मुहावरा है। चुना हुआ रूप आधुनिक हिन्दी में स्पष्ट है और प्राणघातक आशय बनाए रखता है।
- source_word: חֵיל מֶלֶךְ בָּבֶל
  choice: बाबेल के राजा की सेना
  rationale: यहाँ חַיִל धन या सामर्थ्य नहीं, सैन्य बल को सूचित करता है।
- source_word: הָעֹלִים מֵעֲלֵיכֶם
  choice: जो तुम्हारे पास से हट गई है
  rationale: शाब्दिक चित्र ‘तुम्हारे ऊपर से चढ़कर/उठकर जाने वाली’ सेना का है; घेराबंदी के संदर्भ में इसका आशय सेना के हट जाने से है। हिन्दी में पूर्ण क्रिया तत्काल संदर्भ में उसके अस्थायी रूप से हट चुकने को स्वाभाविक ढंग से व्यक्त करती है, जबकि कालगत विकल्प पादटिप्पणी में दिया गया है।
