id: JER.34.16
reference: Jeremiah 34:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/תָּשֻׁ֨בוּ֙ וַ/תְּחַלְּל֣וּ אֶת שְׁמִ֔/י וַ/תָּשִׁ֗בוּ אִ֤ישׁ אֶת עַבְדּ/וֹ֙ וְ/אִ֣ישׁ אֶת שִׁפְחָת֔/וֹ אֲשֶׁר שִׁלַּחְתֶּ֥ם חָפְשִׁ֖ים לְ/נַפְשָׁ֑/ם וַ/תִּכְבְּשׁ֣וּ אֹתָ֔/ם לִֽ/הְי֣וֹת לָ/כֶ֔ם לַ/עֲבָדִ֖ים וְ/לִ/שְׁפָחֽוֹת־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/016.yaml
  text: 'But you turned back and profaned my name: each of you made his male servant and his female servant return, though you had set them free to go where they wished; then you subjugated them to be your male and female servants.'
translation:
  language: hi
  text: 'परन्तु तुम पलट गए और मेरे नाम को अपवित्र किया: तुममें से हर एक ने अपने दास और अपनी दासी को, जिन्हें तुमने उनकी इच्छा के अनुसार स्वतंत्र कर दिया था, लौट आने को विवश किया; फिर तुमने उन्हें बलपूर्वक अपने अधीन करके अपने दास और दासियाँ बना लिया।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתָּשֻׁבוּ
  choice: तुम फिर गए
  rationale: यहाँ שׁוּב पहले किए गए कार्य से पलट जाने को दर्शाता है; ‘फिर गए’ इस उलटाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַתְּחַלְּלוּ אֶת־שְׁמִי
  choice: मेरे नाम को अपवित्र किया
  rationale: पिएल रूप חלל, विशेषकर ‘नाम’ के साथ, पवित्र को अपवित्र ठहराने या उसके साथ अपवित्र व्यवहार करने का अर्थ देता है।
- source_word: וַתָּשִׁבוּ
  choice: लौटने पर विवश किया
  rationale: 'हिफ़ील रूप कारणवाचक है: पूर्व स्वामियों ने स्वतंत्र किए गए लोगों को लौटाया; हिन्दी में ‘विवश किया’ प्रसंग में निहित बाध्यता स्पष्ट करता है।'
- source_word: אִישׁ ... וְאִישׁ
  choice: तुममें से हर एक
  rationale: दोहराया गया אִישׁ वितरणात्मक है और प्रत्येक दास-स्वामी को व्यक्तिगत रूप से संबोधित करता है।
- source_word: עַבְדּוֹ ... שִׁפְחָתוֹ
  choice: अपने दास और अपनी दासी
  rationale: स्वामित्व, मुक्ति और पुनः अधीन किए जाने के प्रसंग में ‘दास/दासी’ बंधुआ स्थिति को ‘सेवक/सेविका’ से अधिक स्पष्ट और सटीक रूप में व्यक्त करता है।
- source_word: שִׁלַּחְתֶּם חָפְשִׁים
  choice: स्वतंत्र कर दिया था
  rationale: वाक्यांश केवल विदा करने का नहीं, दासता से मुक्त करने का संकेत देता है।
- source_word: לְנַפְשָׁם
  choice: उनकी इच्छा के अनुसार
  rationale: शाब्दिक रूप से ‘अपने लिए/अपने प्राण के लिए’ यहाँ मुक्त व्यक्तियों के अपने निर्णय से जीने की स्वतंत्रता बताता है; हिन्दी में यह अर्थ स्वाभाविक रूप से व्यक्त होता है।
- source_word: וַתִּכְבְּשׁוּ אֹתָם
  choice: उन्हें अपने अधीन कर लिया
  rationale: כבש का अर्थ बलपूर्वक नियंत्रण या अधीनता में लाना है; यह चयन उसी कठोरता को स्पष्ट, आधुनिक हिन्दी में रखता है।
- source_word: לִהְיוֹת לָכֶם לַעֲבָדִים וְלִשְׁפָחוֹת
  choice: कि वे तुम्हारे दास और दासियाँ बनें
  rationale: यह परिणामस्वरूप फिर से प्राप्त दास-स्थिति और पुरुष तथा स्त्री दोनों वर्गों को व्यक्त करता है।
theological_decisions:
- issue: कानूनी मुक्ति और पुनः दास बनाए जाने के प्रसंग में עבד/שפחה का अनुवाद
  choice: दास / दासी
  alternative: सेवक / सेविका
  rationale: इस पद का केंद्र वास्तविक बंधन से मुक्ति और फिर बलपूर्वक अधीन किया जाना है; इसलिए ‘दास/दासी’ संस्था की कठोर वास्तविकता को बिना नरम किए व्यक्त करता है।
- issue: ‘मेरे नाम को अपवित्र किया’ का धार्मिक आशय
  choice: स्रोत की सीधी अभिव्यक्ति बनाए रखी
  alternative: मेरा अपमान किया
  rationale: ‘नाम’ और ‘अपवित्र करना’ वाचा से जुड़ी गंभीर धार्मिक भाषा है; इसे सामान्य ‘अपमान’ में बदलने से स्रोत का धार्मिक भार घट जाता।
- issue: לְנַפְשָׁם में स्वतंत्रता की सीमा
  choice: उनकी इच्छा के अनुसार
  alternative: जहाँ वे चाहें वहाँ जाने के लिए
  rationale: हिब्रू स्वतंत्र व्यक्तियों की आत्मनिर्णय की स्थिति बताता है, केवल स्थान-परिवर्तन को आवश्यक रूप से निर्दिष्ट नहीं करता; चुना हुआ रूप इस व्यापकता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, स्पष्ट गद्य। ‘परन्तु’ विरोध को, और द्विबिंदु व अर्धविराम आरोप की क्रमिक संरचना को स्पष्ट करते हैं। दासता-संबंधी शब्दावली को जानबूझकर नरम नहीं किया गया है।
