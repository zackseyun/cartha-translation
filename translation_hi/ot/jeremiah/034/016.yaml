  source_fidelity: The draft correctly preserves the reversal, profanation of God's name, distributive responsibility, manumission, compelled return, and renewed enslaved status. However, “तुम फिर गए” normally means “you went again,” not “you turned back/relapsed,” and “अपने अधीन कर लिया” understates the coercive force of כבש.
  naturalness: The Hindi is generally clear and appropriately formal. Replacing the opening idiom and recasting the final clause produces more idiomatic modern Hindi while retaining the force of the accusation.
  terminology: “दास/दासी,” “स्वतंत्र,” and “मेरे नाम को अपवित्र किया” are suitable, accurate choices in this legal and covenantal context. No footnotes are required.
  issues:
  - severity: medium
    issue: “तुम फिर गए” for וַתָּשֻׁבוּ
    rationale: In modern Hindi this ordinarily denotes going again, whereas the Hebrew denotes turning back from the prior commitment. “तुम पलट गए” clearly conveys reversal/reneging.
  - severity: medium
    issue: The rendering of וַתִּכְבְּשׁוּ is too weak
    rationale: “अपने अधीन कर लिया” can express ordinary control; כבש conveys forcible subjugation. “बलपूर्वक अपने अधीन करके” retains the coercive sense.
