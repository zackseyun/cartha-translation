base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/011.yaml
  text: But afterward they turned back and brought back the male servants and the female servants whom they had set free[a], and they forced them into slavery as male and female servants.
translation:
  language: hi
  text: परन्तु इसके बाद वे पलट गए और जिन दासों और दासियों को उन्होंने स्वतंत्र कर दिया था, उन्हें लौटा लाए और उन्हें बलपूर्वक दास-दासियाँ बना लिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्हें वश में करके दास-दासियाँ बना लिया।” इब्रानी क्रिया का अर्थ किसी को दबाकर अपने अधीन करना भी हो सकता है; यहाँ संदर्भ में उसका परिणाम दासता में डालना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשׁוּבוּ
  choice: वे पलट गए
  rationale: שׁוב की अकर्मक क्रिया पहले किए गए मुक्ति-कार्य से पीछे हटने को दर्शाती है। ‘पलट गए’ लौटने और निर्णय बदलने—दोनों भावों को अनावश्यक रूप से सीमित किए बिना व्यक्त करता है।
- source_word: אַחֲרֵי כֵן
  choice: इसके बाद
  rationale: यह स्वाभाविक आधुनिक हिन्दी में बाद की घटना का स्पष्ट काल-संकेत देता है।
- source_word: וַיָּשִׁבוּ
  choice: उन्हें लौटा लाए
  rationale: 'यह שׁוב के हिफ़ील अर्थात् प्रेरणार्थक रूप को बनाए रखता है: उन्होंने उन लोगों को वापस लौटने पर विवश किया या वापस ले आए।'
- source_word: הָעֲבָדִים וְהַשְּׁפָחוֹת
  choice: दासों और दासियों
  rationale: संदर्भ बंधुआ अवस्था, मुक्ति और पुनः दास बनाए जाने का है; इसलिए ‘सेवक-सेविकाएँ’ की अपेक्षा ‘दास-दासियाँ’ अधिक सटीक है और इब्रानी का स्त्री-पुरुष भेद भी सुरक्षित रहता है।
- source_word: שִׁלְּחוּ חָפְשִׁים
  choice: स्वतंत्र कर दिया था
  rationale: यह इब्रानी मुहावरे का स्वाभाविक हिन्दी रूप है और पहले पूर्ण हो चुके मुक्ति-कार्य को स्पष्ट करता है।
- source_word: וַיִּכְבְּשׁוּם
  choice: उन्हें बलपूर्वक ... बना लिया
  rationale: כּבש में वश में करने और अधीन करने का भाव है। इस संदर्भ में परिणाम पुनः दासता है; ‘बलपूर्वक’ उसकी दमनकारी शक्ति को स्पष्ट करता है।
- source_word: לַעֲבָדִים וְלִשְׁפָחוֹת
  choice: दोबारा दास-दासी बना लिया
  rationale: लामेद यहाँ परिणामी स्थिति बताता है। ‘दोबारा’ निकट संदर्भ में पहले मुक्त किए जाने के बाद उसी दास-अवस्था में लौटाने को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: पहली क्रिया שׁוב में लौटने और अपने पूर्व निर्णय से फिरने के बीच अर्थ-संबंध
  choice: ‘पलट गए’ द्वारा दोनों भावों को खुला रखा गया
  alternative: ‘उन्होंने अपना मन बदल लिया’
  rationale: अधिक व्याख्यात्मक विकल्प केवल मानसिक निर्णय पर बल देता, जबकि इब्रानी क्रिया का मूल लौटने/पलटने का भाव भी है।
- issue: כּבש की दमनकारी शक्ति और दासता का परिणामी अर्थ
  choice: मुख्य पाठ में ‘बलपूर्वक दोबारा दास-दासी बना लिया’
  alternative: ‘उन्हें वश में करके दास-दासी बना लिया’
  rationale: संदर्भ पुनः दास बनाए जाने की वास्तविक जबरदस्ती को स्पष्ट करता है, पर पादटिप्पणी अधिक रूप-समीपी विकल्प को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘दास-दासियाँ’ बंधुआ स्थिति और इब्रानी के लैंगिक युग्म को व्यक्त करता है। अर्धविराम क्रमिक लेकिन निकट से जुड़े कार्यों—वापस लाने और पुनः दास बनाने—को स्पष्ट करता है।
