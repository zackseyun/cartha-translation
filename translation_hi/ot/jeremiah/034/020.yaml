source:
  edition: WLC
  text: וְ/נָתַתִּ֤י אוֹתָ/ם֙ בְּ/יַ֣ד אֹֽיְבֵי/הֶ֔ם וּ/בְ/יַ֖ד מְבַקְשֵׁ֣י נַפְשָׁ֑/ם וְ/הָיְתָ֤ה נִבְלָתָ/ם֙ לְ/מַֽאֲכָ֔ל לְ/ע֥וֹף הַ/שָּׁמַ֖יִם וּ/לְ/בֶהֱמַ֥ת הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/020.yaml
  text: And I will give them into the hand of their enemies and into the hand of those who seek their life[c][b][a], and their dead bodies will become food for the birds of the sky and for the beasts of the earth.
translation:
  language: hi
  text: मैं उन्हें उनके शत्रुओं के हाथ में और उन लोगों के हाथ में सौंप दूँगा जो उनके प्राण लेना चाहते हैं[a]। उनकी लाशें[b] आकाश के पक्षियों[c] और धरती के पशुओं का आहार बनेंगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “जो उनके प्राण खोजते हैं”; अर्थात, जो उन्हें मार डालना चाहते हैं।
    reason: lexical_alternative
  - marker: b
    text: या “उनके शव” अथवा “उनके मृत शरीर”।
    reason: lexical_alternative
  - marker: c
    text: हिब्रू में, “आकाश के पक्षी”; कुछ अनुवादों में “आकाश के उड़नेवाले पक्षी”।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי ... בְּיַד
  choice: हाथ में सौंप दूँगा
  rationale: נתן בְּיַד का अर्थ किसी को दूसरे के अधिकार में दे देना है। ‘हाथ में सौंप दूँगा’ हिब्रू बिंब और उसके आशय दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: אֹיְבֵיהֶם
  choice: उनके शत्रुओं
  rationale: यह אויב का सीधा और प्रसंगानुकूल हिन्दी रूप है।
- source_word: מְבַקְשֵׁי נַפְשָׁם
  choice: जो उनके प्राण लेना चाहते हैं
  rationale: हिब्रू मुहावरे का आशय उन्हें मार डालने की चेष्टा करनेवालों से है। मुख्य पाठ में अर्थ स्पष्ट किया गया है और शाब्दिक रूप पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וְהָיְתָה
  choice: बनेंगी
  rationale: यहाँ היה भावी परिणामी अवस्था व्यक्त करता है; इसलिए ‘बनेंगी’ साधारण ‘होंगी’ से अधिक स्पष्ट है।
- source_word: נִבְלָתָם
  choice: उनकी लाशें
  rationale: נבלה मृत शरीर को दर्शाता है। मनुष्यों के संदर्भ में ‘लाशें’ स्पष्ट, वर्तमान और प्रसंग की अपमानजनक मृत्यु-छवि के अनुरूप है।
- source_word: לְמַאֲכָל
  choice: आहार
  rationale: निर्माण का अर्थ खाने की वस्तु बनना है। ‘आहार बनेंगी’ हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: לְעוֹף הַשָּׁמַיִם
  choice: आकाश के पक्षियों
  rationale: यह हिब्रू पदबंध का निकट और स्वाभाविक अनुवाद है; עוֹף यहाँ सामूहिक रूप से उड़नेवाले पक्षियों को दर्शाता है।
- source_word: וּלְבֶהֱמַת הָאָרֶץ
  choice: और धरती के पशुओं
  rationale: בהמה स्थलीय पशुओं को दर्शाता है। ‘धरती के पशु’ समानांतर वाक्य-विन्यास और न्याय की गंभीर छवि बनाए रखता है।
theological_decisions:
- issue: बिना दफन पड़ी लाशों को पक्षियों और पशुओं द्वारा खाया जाना न्याय की छवि है
  choice: इस ठोस और कठोर छवि को बिना नरम किए बनाए रखा गया है
  alternative: इसे केवल शत्रुओं के हाथों मृत्यु या पराजय के सामान्य कथन के रूप में कहना
  rationale: पद में मृत्यु के साथ मृत शरीरों का अपमानजनक रूप से खुला पड़ा रहना भी ईश्वरीय न्याय का भाग है; सामान्यीकृत कथन इस अर्थ को घटा देता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, किंतु न्याय-वचन की गंभीरता के लिए ‘प्राण’, ‘आहार’ और समानांतर ‘हाथ में’ संरचना रखी गई है। वाक्य सहज समझ के लिए दो वाक्यों में विभाजित है।
