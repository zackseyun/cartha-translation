base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/017.yaml
  text: 'Therefore thus says Yahweh: You have not listened to me[a], to proclaim liberty, each man to his brother and each man to his neighbor. Behold, I am proclaiming liberty for you, declares Yahweh—to the sword, to the pestilence[c][b], and to the famine—and I will make you a horror to all the kingdoms of the earth.'
translation:
  language: hi
  text: 'इसलिए यहोवा यों कहता है: तुमने मेरी बात नहीं सुनी कि हर एक अपने भाई और हर एक अपने पड़ोसी के लिए स्वतंत्रता की घोषणा करे। देखो, मैं तुम्हारे लिए स्वतंत्रता की घोषणा करता हूँ[a]—तलवार के लिए, महामारी के लिए और अकाल के लिए—यहोवा की यह घोषणा है; और मैं तुम्हें पृथ्वी के सब राज्यों के लिए आतंक का कारण बना दूँगा[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘स्वतंत्रता’ का अनुवाद ‘मुक्ति’ या ‘छुटकारा’ भी हो सकता है। मूल इब्रानी में दोनों स्थानों पर एक ही शब्द है; उसका दोहराव जानबूझकर विडंबना उत्पन्न करता है। यहाँ आशय है कि यहोवा उन्हें तलवार, महामारी और अकाल के अधीन छोड़ देता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘भय की वस्तु’ अथवा ‘दहशत का कारण’।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित रूप ‘यहोवा’ के द्वारा परमेश्वर के व्यक्तिगत नाम को उपाधि से प्रतिस्थापित किए बिना प्रस्तुत किया गया है।
- source_word: שְׁמַעְתֶּם אֵלַי
  choice: तुमने मेरी नहीं सुनी
  rationale: यह सुनने के इब्रानी मुहावरे को बनाए रखता है और उसमें निहित आज्ञा न मानने के भाव को अनावश्यक रूप से स्पष्ट नहीं करता।
- source_word: לִקְרֹא דְּרוֹר / דְּרוֹר
  choice: स्वतंत्रता की घोषणा करना / स्वतंत्रता
  rationale: यह दासों की विधिवत मुक्ति के संदर्भ और दोनों प्रयोगों में जानबूझकर दोहराए गए शब्द की व्यंग्यात्मक उलटबाँसी को सुरक्षित रखता है।
- source_word: אִישׁ לְאָחִיו וְאִישׁ לְרֵעֵהוּ
  choice: अपने-अपने भाई और अपने-अपने पड़ोसी के लिए
  rationale: ‘अपने-अपने’ इब्रानी के वितरणात्मक दोहराव को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि ‘भाई’ और ‘पड़ोसी’ दोनों अलग संज्ञाओं को बनाए रखते हैं।
- source_word: הִנְנִי
  choice: देखो
  rationale: यह गंभीर भविष्यद्वाणी-सूचक ध्यानाकर्षण को वर्तमान और सहज हिन्दी में व्यक्त करता है।
- source_word: אֶל הַחֶרֶב אֶל הַדֶּבֶר וְאֶל הָרָעָב
  choice: तलवार, महामारी और अकाल के हवाले होने की
  rationale: शाब्दिक संबंध की असामान्यता को समझने योग्य हिन्दी में व्यक्त करते हुए यह स्पष्ट करता है कि यहाँ ‘स्वतंत्रता’ विनाशकारी न्याय के अधीन छोड़ दिए जाने की विडंबना है।
- source_word: לְזַוֲעָה
  choice: आतंक का कारण
  rationale: संज्ञा का आशय ऐसी वस्तु या दशा है जो दूसरे राज्यों में भय और सिहरन उत्पन्न करे; यह हिन्दी में स्वाभाविक है।
- source_word: מַמְלְכוֹת הָאָרֶץ
  choice: पृथ्वी के सभी राज्य
  rationale: वाक्यांश के व्यापक अंतरराष्ट्रीय दायरे को बनाए रखता है, न कि केवल यहूदा की स्थानीय भूमि को।
theological_decisions:
- issue: दिव्य ‘स्वतंत्रता’ की व्यंग्यात्मक उलटबाँसी
  choice: दोनों खंडों में ‘स्वतंत्रता’ दोहराई गई
  alternative: दूसरे खंड में ‘छोड़ देना’ या ‘मुक्त कर देना’
  rationale: 'इब्रानी דְּרוֹר को दोनों बार दोहराता है: लोगों ने दूसरों को स्वतंत्र नहीं किया, इसलिए यहोवा उन्हें तलवार, महामारी और अकाल के लिए ‘स्वतंत्र’ करता है। समान शब्द रखने से न्याय की विडंबना बनी रहती है।'
- issue: אֶל के साथ न्याय के साधनों का संबंध
  choice: ‘तलवार, महामारी और अकाल के हवाले होने की’
  alternative: ‘तलवार, महामारी और अकाल के लिए’
  rationale: मूल की व्याकरणिक तीक्ष्णता और अर्थगत तनाव को बनाए रखते हुए हिन्दी पाठक को यह समझने में सहायता मिलती है कि स्वतंत्रता उनसे बचने की नहीं, उनके अधीन छोड़े जाने की है।
- issue: वितरणात्मक पुरुषवाची भाषा
  choice: ‘अपने-अपने भाई और अपने-अपने पड़ोसी’
  alternative: ‘हर एक अपने संगी और अपने पड़ोसी’
  rationale: कानूनी-सामाजिक प्रसंग में पुरुष दासों से संबंधित मूल की भाषा और दो अलग संबंध-संज्ञाओं को सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर भविष्यद्वाणी की गरिमा बनाए रखती है। ‘यों कहता है’, ‘यह यहोवा की घोषणा है’ और ‘देखो’ औपचारिक भविष्यद्वाणी-शैली देते हैं; ‘के हवाले होने की’ कठिन इब्रानी विडंबना को सामान्य पाठक के लिए स्पष्ट करता है।
