    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: तब ... पहुँचा
  rationale: वाव-क्रमिक रूप कथा में अगली घटना प्रस्तुत करता है। हिंदी में ‘तब’ क्रम को स्वाभाविक ढंग से व्यक्त करता है, और क्रिया को प्रचलित नबूवतीय सूत्र ‘वचन ... पहुँचा’ में समाहित किया गया है।
- source_word: דְבַר יְהוָה
  choice: यहोवा का वचन
  rationale: ‘वचन’ नबूवतीय प्रकाशन के मानक सूत्र और मूल शब्द के औपचारिक संबंध को बनाए रखता है; ‘संदेश’ अपेक्षाकृत अधिक व्याख्यात्मक होता।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल में आए परमेश्वर के व्यक्तिगत नाम YHWH को हिंदी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है।
- source_word: אֶל יִרְמְיָהוּ
  choice: यिर्मयाह के पास
  rationale: प्रकाशित वचन के प्राप्तकर्ता को आधुनिक हिंदी में स्वाभाविक रूप से व्यक्त करता है।
- source_word: מֵאֵת יְהוָה
  choice: यहोवा की ओर से
  rationale: מֵאֵת स्रोत अथवा उद्गम बताता है। ‘की ओर से’ हिंदी में इस अर्थ को स्पष्ट और स्वाभाविक रखता है तथा पद में नाम की पुनरावृत्ति भी सुरक्षित रहती है।
- source_word: לֵאמֹר
  choice: ':'
  rationale: यह रूप अगले पद में आने वाले प्रत्यक्ष कथन का परिचय देता है। हिंदी में उद्धरण आरंभ कराने वाला कोलन ‘यह कहते हुए’ की अपेक्षा अधिक सहज है, जबकि उसका कार्य सुरक्षित रहता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में उपाधि नहीं, चतुरक्षरीय व्यक्तिगत नाम YHWH है। ‘यहोवा’ आधुनिक हिंदी बाइबल-पाठकों में पहचाना जाने वाला लिप्यंतरण है और नाम को उपाधि से नहीं बदलता। पादटिप्पणी मूल हिब्रू रूप और पारंपरिक विकल्प स्पष्ट करती है।
- issue: एक ही वाक्य में יְהוָה की पुनरावृत्ति
  choice: दोनों बार ‘यहोवा’ बनाए रखा
  alternative: दूसरी बार नाम हटाकर केवल ‘की ओर से’
  rationale: हिब्रू में ‘यहोवा का वचन ... यहोवा की ओर से’ स्पष्ट रूप से दोहराया गया है। शैलीगत असहजता दूर करने के लिए इसे हटाना मूल की विशिष्ट अभिव्यक्ति और जोर को मिटा देता।
translation_notes:
  register: आधुनिक, स्पष्ट और गरिमापूर्ण हिंदी। नबूवतीय सूत्र के लिए ‘वचन ... पहुँचा’ रखा गया है। मूल की असामान्य किंतु अर्थपूर्ण ‘यहोवा ... यहोवा’ पुनरावृत्ति सुरक्षित है; [a] चिह्न मुख्य पाठ में मौजूद है।
