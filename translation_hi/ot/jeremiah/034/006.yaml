  text: Then Jeremiah the prophet spoke all these words to Zedekiah king of Judah in Jerusalem.
translation:
  language: hi
  text: तब यिर्मयाह नबी ने यहूदा के राजा सिदकिय्याह से ये सारी बातें यरूशलेम में कहीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: तब ... कहीं
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है, इसलिए आधुनिक हिन्दी में “तब” स्वाभाविक है। דִּבֵּר के लिए सन्देश कहने के प्रसंग में “कहीं” सहज और अर्थसंगत है।
- source_word: יִרְמְיָהוּ הַנָּבִיא
  choice: यिर्मयाह नबी
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण रखा गया है और स्पष्ट पदवी הַנָּבִיא को “नबी” के रूप में सुरक्षित रखा गया है।
- source_word: אֶל צִדְקִיָּהוּ מֶלֶךְ יְהוּדָה
  choice: यहूदा के राजा सिदकिय्याह से
  rationale: אֶל को बोलने के क्रिया-प्रयोग के अनुरूप “से” और संबंध-श्रृंखला को स्वाभाविक हिन्दी में “यहूदा के राजा” किया गया है; नाम का प्रचलित हिन्दी रूप रखा गया है।
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: ये सारी बातें
  rationale: דְּבָרִים यहाँ पहले दिए गए पूरे सन्देश को सूचित करता है। हिन्दी में “बातें” कथित वचनों/विषयों दोनों की स्वाभाविक व्यंजना देता है, जबकि כָּל और הָאֵלֶּה क्रमशः “सारी” और “ये” में सुरक्षित हैं।
- source_word: בִּירוּשָׁלִָם
  choice: यरूशलेम में
  rationale: स्थानवाचक בְּ का सीधा अनुवाद “में” है और नगर के नाम का प्रचलित हिन्दी रूप अपनाया गया है।
