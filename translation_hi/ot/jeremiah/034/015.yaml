base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/015.yaml
  text: And you yourselves had turned back today and had done what was right in my eyes[a], by proclaiming liberty, each man to his neighbor[b]; and you had cut a covenant before me in the house that is called by my name.
translation:
  language: hi
  text: तुम स्वयं आज लौट आए थे और तुमने मेरी दृष्टि में जो सही था, वह किया था—अपने-अपने पड़ोसी के लिए स्वतंत्रता की घोषणा करके। तुमने मेरे सामने उस भवन में, जो मेरे नाम से कहलाता है,[a] वाचा बाँधी थी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात यरूशलेम का मंदिर।
    reason: cultural_note
  - marker: b
    text: इब्रानी में शाब्दिक रूप से, “वाचा काटी थी”; यह वाचा स्थापित करने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּשֻׁבוּ
  choice: तुम स्वयं लौटे थे
  rationale: שׁוּב का मूल अर्थ ‘लौटना/फिरना’ है। यहाँ यह पहले के आचरण से पलटकर वाचा के अनुरूप काम करने को दर्शाता है; ‘मन फिराया’ कहने से आंतरिक पश्चात्ताप का अर्थ अनावश्यक रूप से निश्चित हो जाता। ‘थे’ अगले पद में वर्णित बाद की उलटबाँसी की पृष्ठभूमि स्पष्ट करता है।
- source_word: הַיּוֹם
  choice: आज
  rationale: साधारण कालवाचक अर्थ और मूल की तात्कालिकता सुरक्षित रहती है।
- source_word: הַיָּשָׁר בְּעֵינַי
  choice: मेरी दृष्टि में सही काम
  rationale: यह परमेश्वर के नैतिक मूल्यांकन का इब्रानी मुहावरा है। ‘मेरी दृष्टि में’ मूल के नेत्र-संबंधी बिंब को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: לִקְרֹא דְרוֹר
  choice: स्वतंत्रता की घोषणा
  rationale: דְּרוֹר यहाँ दासों की विधिवत मुक्ति को सूचित करता है और קרא सार्वजनिक घोषणा को। यह पदबंध कानूनी-सामाजिक अर्थ को स्पष्ट रखते हुए मूल की औपचारिकता बनाए रखता है।
- source_word: אִישׁ לְרֵעֵהוּ
  choice: तुममें से हर एक ने अपने पड़ोसी के लिए
  rationale: इब्रानी पदबंध वितरणात्मक है। ‘हर एक’ प्रत्येक व्यक्ति की जिम्मेदारी बताता है, जबकि ‘पड़ोसी’ רֵעַ का स्वाभाविक और प्रसंगानुकूल अनुवाद है।
- source_word: וַתִּכְרְתוּ בְרִית
  choice: वाचा बाँधी थी
  rationale: כרת ברית का शाब्दिक रूप ‘वाचा काटना’ है, पर हिन्दी में ‘वाचा बाँधना’ अधिक स्वाभाविक और गरिमापूर्ण है तथा औपचारिक, गंभीर वाचा-स्थापन का भाव रखता है। शाब्दिक इब्रानी मुहावरा पादटिप्पणी में दिया गया है।
- source_word: לְפָנַי
  choice: मेरे सामने
  rationale: यह परमेश्वर की उपस्थिति में किए गए वाचा-कर्म को सीधे व्यक्त करता है।
- source_word: בַּבַּיִת אֲשֶׁר נִקְרָא שְׁמִי עָלָיו
  choice: उस भवन में जो मेरे नाम से कहलाता है
  rationale: ‘भवन’ בַּיִת को बनाए रखता है और ‘मेरे नाम से कहलाता है’ स्वामित्व तथा परमेश्वर से सार्वजनिक पहचान—दोनों निहितार्थों को खुला रखता है। प्रसंगगत मंदिर-संदर्भ पादटिप्पणी में स्पष्ट किया गया है।
theological_decisions:
- issue: כרת ברית के वाचा-संबंधी मुहावरे का अनुवाद
  choice: वाचा बाँधी थी
  alternative: वाचा काटी थी; वाचा की थी
  rationale: शाब्दिक ‘काटना’ निकटवर्ती वाचा-अनुष्ठान से जुड़ा हो सकता है, किंतु आधुनिक हिन्दी में मुख्य पाठ को अस्वाभाविक बनाता है। ‘वाचा बाँधना’ वाचा की औपचारिकता और गंभीरता को सुरक्षित रखता है; शाब्दिक रूप पादटिप्पणी में पारदर्शी ढंग से दर्ज है।
- issue: וַתָּשֻׁבוּ में बाहरी लौटने और आंतरिक पश्चात्ताप के बीच अर्थ
  choice: लौटे थे
  alternative: मन फिराया था; पश्चात्ताप किया था
  rationale: स्रोत शब्द आचरण के पलटने को स्पष्ट करता है, पर स्थायी आंतरिक पश्चात्ताप को अनिवार्य नहीं करता। इसलिए अनुवाद मूल की धर्मवैचारिक तनातनी को अनिर्णीत रखता है।
- issue: אִישׁ לְרֵעֵהוּ का वितरणात्मक और लिंग-संबंधी रूप
  choice: तुममें से हर एक ने अपने पड़ोसी के लिए
  alternative: हर पुरुष ने अपने पड़ोसी के लिए
  rationale: ‘हर एक’ वितरणात्मक बल को ठीक रखता है और हिन्दी में समूह को संबोधित करते समय स्वाभाविक है। ‘हर पुरुष’ यहाँ अनावश्यक रूप से केवल पुरुष स्वामियों तक अर्थ सीमित कर सकता है, जबकि निकट प्रसंग में पुरुष और स्त्री दोनों दासों की मुक्ति का उल्लेख है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण स्तर रखा गया है। ‘स्वतंत्रता की घोषणा’ सार्वजनिक और विधिक मुक्ति को व्यक्त करती है; ‘वाचा’ प्रमुख बाइबलीय शब्दावली बनाए रखता है। अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्नों का स्थान उनकी सामग्री से मेल नहीं खाता था, इसलिए हिन्दी मुख्य पाठ में मंदिर-संबंधी टिप्पणी [a] को ‘भवन’ के बाद और वाचा-मुहावरे की टिप्पणी [b] को ‘वाचा बाँधी थी’ के बाद लगाया गया है।
