  choice: देखो
  rationale: भविष्यद्वाणी में ध्यान खींचने वाले हिब्रू पद को सहज किंतु गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: מְצַוֶּה
  choice: मैं आज्ञा दे रहा हूँ
  rationale: 'वर्तमान कृदन्त के तात्कालिक और प्रगतिशील भाव को बनाए रखता है: याहवेह अभी निर्णायक आदेश दे रहे हैं।'
- source_word: נְאֻם יְהוָה
  choice: याहवेह की यह घोषणा है
  rationale: गंभीर भविष्यद्वाणी-सूत्र को स्वाभाविक हिन्दी में रखते हुए परमेश्वर के व्यक्तिगत नाम को सुरक्षित रखता है।
- source_word: וַהֲשִׁבֹתִים
  choice: मैं उन्हें इस नगर में फिर लौटा लाऊँगा
  rationale: שוב के हिफ़ील रूप का कारणवाचक अर्थ व्यक्त करता है; प्रसंग में याहवेह पीछे हट चुकी शत्रु-सेना को यरूशलेम में वापस लाते हैं।
- source_word: וְנִלְחֲמוּ עָלֶיהָ
  choice: वे उसके विरुद्ध युद्ध करेंगे
  rationale: नगर के विरुद्ध सैन्य कार्रवाई का सीधा और औपचारिक अर्थ देता है।
- source_word: וּלְכָדוּהָ
  choice: उस पर अधिकार कर लेंगे
  rationale: घेराबंदी के प्रसंग में לכד का अर्थ नगर को जीतकर अपने नियंत्रण में लेना है।
- source_word: וּשְׂרָפֻהָ בָאֵשׁ
  choice: उसे आग से जला देंगे
  rationale: हिब्रू की स्पष्ट अग्नि-संबंधी अभिव्यक्ति और न्याय की तीव्रता दोनों को बनाए रखता है।
- source_word: אֶת־עָרֵי יְהוּדָה אֶתֵּן שְׁמָמָה
  choice: मैं यहूदा के नगरों को उजाड़ कर दूँगा
  rationale: נתן और שְׁמָמָה के परिणामसूचक मुहावरे को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מֵאֵין יֹשֵׁב
  choice: वहाँ कोई रहनेवाला न होगा
  rationale: पूर्ण निर्जनता और जनशून्यता बताने वाले हिब्रू मुहावरे का स्पष्ट हिन्दी रूप है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवेह
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में उपाधि नहीं बल्कि चतुरक्षरी व्यक्तिगत नाम है; इसलिए उसे हिन्दी लिपि में लिप्यंतरित किया गया है।
- issue: शत्रु-सेना की वापसी में परमेश्वर की भूमिका
  choice: मैं उन्हें…फिर लौटा लाऊँगा
  alternative: वे…फिर लौट आएँगे
  rationale: हिफ़ील रूप ईश्वरीय कारणता को स्पष्ट करता है; न्याय के साधन के रूप में सेना की वापसी याहवेह की आज्ञा से होती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गंभीर भविष्यद्वाणी-संबंधी स्वर रखा गया है। लंबे हिब्रू वाक्य को पठनीय हिन्दी वाक्यों में बाँटा गया है, पर घटनाओं का क्रम और ईश्वरीय कर्तृत्व सुरक्षित है।
