base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/022.yaml
  text: Behold[a], I am commanding, declares Yahweh, and I will bring them back to this city, and they will fight against it and capture it and burn it with fire. And I will make the cities of Judah a desolation[b], without inhabitant.
translation:
  language: hi
  text: “देखो, मैं आज्ञा दे रहा हूँ—याहवेह की यह घोषणा है—और मैं उन्हें इस नगर में फिर लौटा लाऊँगा[a]। वे उसके विरुद्ध युद्ध करेंगे, उस पर अधिकार कर लेंगे और उसे आग से जला देंगे। मैं यहूदा के नगरों को उजाड़ कर दूँगा[b], और वहाँ कोई रहनेवाला न होगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मैं उन्हें इस नगर में फिर लौटाऊँगा।” हिब्रू क्रिया कारणवाचक है। प्रसंग में “उन्हें” से आशय उस शत्रु-सेना से है जो यरूशलेम से पीछे हट गई थी।
    reason: lexical_alternative
  - marker: b
    text: अर्थात ऐसा निर्जन कि वहाँ कोई भी निवास न करे। हिब्रू मुहावरा पूर्ण उजाड़ और जनशून्यता पर बल देता है।
    reason: lexical_alternative
lexical_decisions:
