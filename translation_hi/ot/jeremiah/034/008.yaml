source:
  edition: WLC
  text: הַ/דָּבָ֛ר אֲשֶׁר הָיָ֥ה אֶֽל יִרְמְיָ֖הוּ מֵ/אֵ֣ת יְהוָ֑ה אַחֲרֵ֡י כְּרֹת֩ הַ/מֶּ֨לֶךְ צִדְקִיָּ֜הוּ בְּרִ֗ית אֶת כָּל הָ/עָם֙ אֲשֶׁ֣ר בִּ/ירֽוּשָׁלִַ֔ם לִ/קְרֹ֥א לָ/הֶ֖ם דְּרֽוֹר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/008.yaml
  text: 'The word that came to Jeremiah from Yahweh after King Zedekiah had made a covenant with all the people who were in Jerusalem[b][a], to proclaim liberty to them:'
translation:
  language: hi
  text: 'याहवे की ओर से यिर्मयाह के पास यह वचन उस समय आया, जब राजा सिदकिय्याह ने यरूशलेम में रहनेवाले सभी लोगों के साथ उन्हें स्वतंत्रता[b] की घोषणा करने के लिए वाचा बाँधी थी[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “वाचा काटी थी।”
    reason: lexical_alternative
  - marker: b
    text: या “रिहाई” अथवा “मुक्ति।” इब्रानी शब्द यहाँ दासता से औपचारिक रूप से स्वतंत्र किए जाने का बोध देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּבָר אֲשֶׁר הָיָה אֶל יִרְמְיָהוּ
  choice: यिर्मयाह के पास यह वचन ... आया
  rationale: भविष्यद्वाणी के परिचय में यह स्थापित इब्रानी अभिव्यक्ति है। ‘वचन’ मूल के ठोस शब्द और आवर्ती भविष्यद्वाणी-सूत्र को बनाए रखता है; हिंदी में स्वाभाविकता के लिए वाक्य-क्रम बदला गया है।
- source_word: מֵאֵת יְהוָה
  choice: याहवे की ओर से
  rationale: מֵאֵת स्रोत को व्यक्त करता है, और יְהוָה को उसके व्यक्तिगत वाचा-नाम के लिप्यंतरण ‘याहवे’ से प्रस्तुत किया गया है।
- source_word: אַחֲרֵי כְּרֹת ... בְּרִית
  choice: जब ... वाचा बाँधी थी
  rationale: כרת ברית का शाब्दिक अर्थ ‘वाचा काटना’ है, पर हिंदी में ‘वाचा बाँधना’ उसी औपचारिक कार्य को स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करता है। ‘थी’ पूर्वकालिक संबंध को स्पष्ट करता है।
- source_word: אֶת כָּל הָעָם אֲשֶׁר בִּירוּשָׁלִַם
  choice: यरूशलेम में रहनेवाले सभी लोगों के साथ
  rationale: ‘सभी’ כָּל की व्यापकता और ‘रहनेवाले’ संबंधवाचक उपवाक्य को स्पष्ट रूप से बनाए रखते हैं।
- source_word: לִקְרֹא לָהֶם דְּרוֹר
  choice: ताकि उनके लिए स्वतंत्रता की घोषणा की जाए
  rationale: קרא यहाँ औपचारिक सार्वजनिक घोषणा का बोध देता है। דְּרוֹר कानूनी दास-मुक्ति या रिहाई को सूचित करता है; ‘स्वतंत्रता’ मूल की व्यापकता बनाए रखती है, जबकि पादटिप्पणी उसका औपचारिक अर्थ स्पष्ट करती है।
- source_word: צִדְקִיָּהוּ
  choice: सिदकिय्याह
  rationale: हिंदी बाइबलीय नाम-परंपरा के अनुरूप इब्रानी व्यक्तिगत नाम का लिप्यंतरण।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसके वाचा-संबंधी व्यक्तिगत नाम को उपाधि में बदले बिना प्रस्तुत करता है।
- issue: דְּרוֹר का कानूनी और सामाजिक आशय
  choice: स्वतंत्रता
  alternative: रिहाई; मुक्ति
  rationale: यहाँ शब्द दासों की औपचारिक मुक्ति के संदर्भ में है। मुख्य पाठ में ‘स्वतंत्रता’ अर्थ की व्यापकता और गरिमा रखती है; पादटिप्पणी कानूनी दास-मुक्ति का आशय बताती है, जिससे इसे केवल आध्यात्मिक मुक्ति न समझा जाए।
translation_notes:
  register: आधुनिक मानक हिंदी में स्वाभाविक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य शैली अपनाई गई है। भविष्यद्वाणी-सूत्र के अर्थ को रखते हुए हिंदी वाक्य-क्रम प्रयोग किया गया है। ‘वाचा’ और ‘घोषणा’ जैसे स्थापित शब्द कानूनी तथा धर्मग्रंथीय गंभीरता बनाए रखते हैं।
