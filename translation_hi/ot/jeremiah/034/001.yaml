id: JER.34.1
reference: Jeremiah 34:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הַ/דָּבָ֛ר אֲשֶׁר הָיָ֥ה אֶֽל יִרְמְיָ֖הוּ מֵ/אֵ֣ת יְהוָ֑ה וּ/נְבוּכַדְרֶאצַּ֣ר מֶֽלֶךְ בָּבֶ֣ל וְ/כָל חֵיל֡/וֹ וְ/כָל מַמְלְכ֣וֹת אֶרֶץ֩ מֶמְשֶׁ֨לֶת יָד֜/וֹ וְ/כָל הָ/עַמִּ֗ים נִלְחָמִ֧ים עַל יְרוּשָׁלִַ֛ם וְ/עַל כָּל עָרֶ֖י/הָ לֵ/אמֹֽר־־־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/001.yaml
  text: The word that came to Jeremiah from Yahweh[a], when Nebuchadnezzar king of Babylon and all his army, and all the kingdoms of the earth under the dominion of his hand, and all the peoples, were fighting against Jerusalem and against all its cities, saying[b],
translation:
  language: hi
  text: 'वह वचन जो याहवे की ओर से यिर्मयाह के पास उस समय आया, जब बाबेल का राजा नबूकदनेस्सर[a], उसकी सारी सेना, उसके हाथ के अधीन पृथ्वी के सभी राज्य[b] और सभी जनसमूह यरूशलेम और उसके सभी नगरों के विरुद्ध युद्ध कर रहे थे। वचन यह था:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में नाम का रूप ‘नबूकदरेस्सर’ है; ‘नबूकदनेस्सर’ उसका अधिक परिचित हिन्दी रूप है।
    reason: lexical_alternative
  - marker: b
    text: या, “उसके हाथ के अधीन देश के सभी राज्य।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּבָר אֲשֶׁר הָיָה אֶל
  choice: वह वचन जो ... के पास ... आया
  rationale: यह भविष्यद्वाणी की प्रचलित आरंभिक अभिव्यक्ति है। ‘वचन’ दैवी संदेश के पारंपरिक अर्थ को बनाए रखता है और ‘के पास आया’ हिब्रू मुहावरे को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מֵאֵת יְהוָה
  choice: याहवे की ओर से
  rationale: מֵאֵת स्रोत को सूचित करता है; ‘की ओर से’ आधुनिक हिन्दी में स्वाभाविक है। परमेश्वर के विशिष्ट नाम को उपाधि में बदलने के बजाय ‘याहवे’ रूप में रखा गया है।
- source_word: נְבוּכַדְרֶאצַּר
  choice: नबूकदनेस्सर
  rationale: यह हिन्दी बाइबल-पाठकों में अधिक परिचित नामरूप है; मूल इब्रानी वर्तनी से निकटतर रूप को पादटिप्पणी में बताया गया है।
- source_word: חֵילוֹ
  choice: उसकी सारी सेना
  rationale: घेराबंदी के प्रसंग में חַיִל का स्पष्ट अर्थ सैन्य बल है; ‘सेना’ सहज और सटीक है।
- source_word: מַמְלְכוֹת אֶרֶץ
  choice: पृथ्वी के सभी राज्य
  rationale: אֶרֶץ का अर्थ ‘पृथ्वी’ या ‘देश’ हो सकता है। मुख्य पाठ व्यापक साम्राज्यिक दायरे को रखता है, जबकि वैकल्पिक संबंध को पादटिप्पणी में सुरक्षित किया गया है।
- source_word: מֶמְשֶׁלֶת יָדוֹ
  choice: उसके हाथ के अधीन
  rationale: यह अनुवाद शासन और शक्ति दोनों का अर्थ देता है तथा मूल के ‘हाथ’ वाले ठोस बिंब को बनाए रखता है।
- source_word: וְכָל הָעַמִּים
  choice: और सभी जनसमूह
  rationale: बहुवचन עַמִּים अलग-अलग जातीय-राजनीतिक लोगों को दर्शाता है। ‘जनसमूह’ हिन्दी में इस बहुवचन भेद को स्पष्ट रखता है।
- source_word: נִלְחָמִים עַל
  choice: के विरुद्ध युद्ध कर रहे थे
  rationale: कृदन्त जारी कार्रवाई को दर्शाता है; यह हिन्दी रूप घेराबंदी के समय चल रहे युद्ध को स्पष्ट करता है।
- source_word: וְעַל כָּל עָרֶיהָ
  choice: और उसके सभी नगरों के विरुद्ध
  rationale: स्त्रीलिंग प्रत्यय को निकटवर्ती यरूशलेम से संबद्ध रखते हुए मूल की संरचना और उसके अधीन क्षेत्र के नगरों का भाव सुरक्षित किया गया है।
- source_word: לֵאמֹר
  choice: 'वचन यह था:'
  rationale: यह अगले पद में आने वाले सीधे कथन का परिचय देता है। शाब्दिक ‘यह कहते हुए’ की अपेक्षा यह हिन्दी में अधिक स्वाभाविक है और पदांत पर अधूरा वाक्य छोड़ने से बचाता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में विशिष्ट वाचा-नाम है। ‘याहवे’ उसका सीधा लिप्यंतरण करता है और उसे किसी उपाधि से नहीं बदलता।
- issue: मַמְלְכוֹת אֶרֶץ और מֶמְשֶׁלֶת יָדוֹ का संबंध
  choice: उसके हाथ के अधीन पृथ्वी के सभी राज्य
  alternative: उसके हाथ के अधीन देश के सभी राज्य
  rationale: हिब्रानी में אֶרֶץ का अर्थ ‘पृथ्वी’ या ‘देश’ दोनों हो सकता है। मुख्य पाठ व्यापक अर्थ चुनता है, पर कम व्यापक भौगोलिक अर्थ को पादटिप्पणी में रखा गया है ताकि कथन के दायरे को अनावश्यक रूप से निश्चित न किया जाए।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सहज रखी गई है। लंबे हिब्रानी वाक्य की सूचीबद्ध संरचना सुरक्षित है, पर अगले पद के सीधे कथन को स्वाभाविक रूप से खोलने के लिए अंत में ‘वचन यह था:’ रखा गया है।
