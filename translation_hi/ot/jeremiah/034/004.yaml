id: JER.34.4
reference: Jeremiah 34:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אַ֚ךְ שְׁמַ֣ע דְּבַר יְהוָ֔ה צִדְקִיָּ֖הוּ מֶ֣לֶךְ יְהוּדָ֑ה כֹּֽה אָמַ֤ר יְהוָה֙ עָלֶ֔י/ךָ לֹ֥א תָמ֖וּת בֶּ/חָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/004.yaml
  text: 'Yet hear the word of Yahweh, Zedekiah king of Judah: Thus says Yahweh concerning you, You shall not die by the sword.'
translation:
  language: hi
  text: 'फिर भी, हे यहूदा के राजा सिदकिय्याह, याहवे का वचन सुन! याहवे तेरे विषय में यह कहता है: तू तलवार से नहीं मरेगा।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ
  choice: फिर भी
  rationale: यहाँ यह शब्द पिछले न्याय-वचन के बाद एक सांत्वनापूर्ण विरोध या अपवाद प्रस्तुत करता है; ‘फिर भी’ इस संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שְׁמַע
  choice: सुन
  rationale: एकवचन आज्ञार्थक रूप को सीधे और गंभीर भविष्यद्वक्तीय संबोधन के रूप में रखा गया है।
- source_word: דְּבַר יְהוָה
  choice: यहोवा का वचन
  rationale: ‘वचन’ प्रचलित भविष्यद्वक्तीय सूत्र की गरिमा और मूल के निकट अर्थ को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के व्यक्तिगत नाम की स्थापित बाइबलीय लिप्यंतरण-परंपरा का अनुसरण करते हुए इसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: צִדְקִיָּהוּ
  choice: सिदकिय्याह
  rationale: व्यक्तिनाम को हिन्दी बाइबल में प्रचलित रूप में लिप्यंतरित किया गया है।
- source_word: מֶלֶךְ יְהוּדָה
  choice: यहूदा के राजा
  rationale: सम्बन्धवाचक पदबंध का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: כֹּה אָמַר יְהוָה
  choice: यहोवा ... यह कहता है
  rationale: स्थिर भविष्यद्वक्तीय संदेश-सूत्र को हिन्दी की स्वाभाविक शब्द-व्यवस्था में रखते हुए उसकी औपचारिक गंभीरता बनाए रखी गई है।
- source_word: עָלֶיךָ
  choice: तेरे विषय में
  rationale: वाणी के साथ עַל यहाँ सिदकिय्याह के भाग्य के संबंध में घोषणा दर्शाता है, न कि अनिवार्यतः उसके विरुद्ध शत्रुता।
- source_word: לֹא תָמוּת
  choice: तू ... नहीं मरेगा
  rationale: निषेध सहित अपूर्ण क्रिया भावी परिणाम बताती है; हिन्दी का सामान्य भविष्यकाल इसे स्पष्ट रूप से व्यक्त करता है।
- source_word: בֶּחָרֶב
  choice: तलवार से
  rationale: हिंसक मृत्यु की मूल इब्रानी छवि सुरक्षित रखी गई है और इसे अधिक विशिष्ट रूप से ‘युद्ध में’ नहीं समझाया गया।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत वाचा-नाम है। हिन्दी पाठकों के लिए स्थापित और पहचाना जाने वाला ‘यहोवा’ रूप चुना गया है; इसे ‘प्रभु’ जैसी उपाधि से नहीं बदला गया।
- issue: עָלֶיךָ का आशय
  choice: तेरे विषय में
  alternative: तेरे विरुद्ध
  rationale: आगामी कथन सिदकिय्याह की मृत्यु के ढंग के विषय में है और सांत्वनापूर्ण है, इसलिए तटस्थ संबंधवाचक अर्थ प्रसंगानुकूल है; शत्रुतापूर्ण अर्थ आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यद्वक्तीय शैली रखी गई है। प्रत्यक्ष संबोधन में ‘हे’ और एकवचन ‘तू/तेरे’ मूल की निकटता तथा राजकीय संबोधन की गंभीरता बनाए रखते हैं। कोई पादटिप्पणी आवश्यक नहीं समझी गई।
