source:
  edition: WLC
  text: כֹּֽה אָמַ֥ר יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל אָנֹכִ֗י כָּרַ֤תִּֽי בְרִית֙ אֶת אֲב֣וֹתֵי/כֶ֔ם בְּ/י֨וֹם הוֹצִאִ֤/י אוֹתָ/ם֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם מִ/בֵּ֥ית עֲבָדִ֖ים לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/013.yaml
  text: 'Thus says Yahweh, the God of Israel: I myself made a covenant with your fathers on the day I brought them out from the land of Egypt, from the house of servants, saying,'
translation:
  language: hi
  text: 'इस्राएल का परमेश्वर यहोवा यों कहता है: जिस दिन मैं तुम्हारे पुरखाओं को मिस्र देश से, दासत्व के घर से निकाल लाया, उस दिन मैंने स्वयं उनके साथ वाचा बाँधी[a] और कहा,[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ है, “वाचा काटी।”
    reason: lexical_alternative
  - marker: b
    text: यह कथन अगले पद में आगे चलता है। 'दासत्व का घर' के लिए इब्रानी में शाब्दिक रूप से “दासों का घर” है।
    reason: discourse_clarity
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: यों कहता है
  rationale: यह भविष्यद्वक्ताओं के संदेश का मानक सूत्र है; हिंदी में गरिमापूर्ण और स्वाभाविक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिंदी बाइबल-परंपरा में प्रचलित रूप के द्वारा परमेश्वर के व्यक्तिगत वाचाई नाम को शीर्षक से अलग रखा गया है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल का परमेश्वर
  rationale: इब्रानी संबंधवाचक पदबंध का सीधा और स्वाभाविक अनुवाद।
- source_word: אָנֹכִי
  choice: मैंने स्वयं
  rationale: स्वतंत्र सर्वनाम से संभावित बलाघात को सहज हिंदी में व्यक्त करता है, उसे अत्यधिक उभारे बिना।
- source_word: כָּרַתִּי בְרִית
  choice: वाचा बाँधी
  rationale: यह हिंदी में प्रचलित और स्वाभाविक वाचाई अभिव्यक्ति है; इब्रानी मुहावरे का शाब्दिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: אֶת אֲבֹתֵיכֶם
  choice: तुम्हारे पुरखाओं के साथ
  rationale: संदर्भगत पितृ-पूर्वजों को आधुनिक, सामान्य हिंदी में ठीक प्रकार व्यक्त करता है।
- source_word: בְּיוֹם
  choice: जिस दिन ... उस दिन
  rationale: इब्रानी कालवाचक संरचना को स्पष्ट और सहज हिंदी वाक्य-विन्यास में सुरक्षित रखता है।
- source_word: הוֹצִיאִי אוֹתָם
  choice: मैं ... निकाल लाया
  rationale: निर्गमन-संदर्भ में हिफ़ील क्रिया का कारणवाचक अर्थ और प्रचलित बाइबिलीय प्रतिध्वनि बनाए रखता है।
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: मिस्र देश से
  rationale: मूल के पूर्ण भौगोलिक पदबंध को संक्षिप्त किए बिना स्वाभाविक हिंदी में देता है।
- source_word: מִבֵּית עֲבָדִים
  choice: दासों के घर से
  rationale: इब्रानी का ठोस शाब्दिक बिंब और वास्तविक दासता दोनों सुरक्षित रखता है।
- source_word: לֵאמֹר
  choice: और कहा,
  rationale: अगले पद में आने वाले प्रत्यक्ष कथन का स्वाभाविक हिंदी परिचय; अल्पविराम वाक्य की निरंतरता दिखाता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: व्यक्तिगत वाचाई नाम को केवल उपाधि में बदलने के बजाय नाम के रूप में सुरक्षित रखा गया है; हिंदी पाठकों के लिए प्रचलित लिप्यंतरण चुना गया है।
- issue: עֲבָדִים में दासता की तीव्रता
  choice: दासों
  alternative: सेवकों; बंधुआई
  rationale: मिस्र में वास्तविक दासता को नरम नहीं किया गया; साथ ही 'घर' का मूल रूपक बनाए रखा गया है।
- issue: אָנֹכִי का बलाघात
  choice: मैंने स्वयं
  alternative: मैंने
  rationale: स्वतंत्र सर्वनाम में संभव बल को व्यक्त किया गया है, यद्यपि संदर्भ में इसे केवल सामान्य कर्ता-सर्वनाम मानना भी संभव है।
translation_notes:
  register: आधुनिक मानक हिंदी; गरिमापूर्ण भविष्यद्वक्तीय शैली। 'यों कहता है', 'वाचा' और 'पुरखाओं' जैसे परिचित बाइबिलीय पद रखे गए हैं, जबकि वाक्य-विन्यास सामान्य पाठक के लिए सहज बनाया गया है।
