  text: בְּ/שָׁל֣וֹם תָּמ֗וּת וּֽ/כְ/מִשְׂרְפ֣וֹת אֲ֠בוֹתֶי/ךָ הַ/מְּלָכִ֨ים הָ/רִֽאשֹׁנִ֜ים אֲשֶׁר הָי֣וּ לְ/פָנֶ֗י/ךָ כֵּ֚ן יִשְׂרְפוּ לָ֔/ךְ וְ/ה֥וֹי אָד֖וֹן יִסְפְּדוּ לָ֑/ךְ כִּֽי דָבָ֥ר אֲנִֽי דִבַּ֖רְתִּי נְאֻם יְהוָֽה־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/005.yaml
  text: You will die in peace[a]. And as spices were burned for your fathers, the former kings who were before you, so they will burn spices for you, and they will lament for you, saying, “Alas, lord!” For I have spoken the word[b], declares Yahweh.
translation:
  language: hi
  text: तुम शान्ति से मरोगे।[a] जैसे तुम्हारे पुरखों—अर्थात उन पहले राजाओं—के लिए, जो तुमसे पहले थे, सुगन्धित पदार्थ जलाए गए थे, वैसे ही तुम्हारे लिए भी जलाए जाएँगे। वे तुम्हारे लिए विलाप करेंगे और कहेंगे, “हाय, स्वामी!”[b] क्योंकि मैंने यह वचन कहा है, याहवे की यह घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘शान्ति से’ का आशय हिंसक मृत्यु के विपरीत शान्तिपूर्ण या स्वाभाविक मृत्यु हो सकता है।
    reason: semantic_clarification
  - marker: b
    text: इब्रानी में यह किसी शासक की मृत्यु पर की जाने वाली औपचारिक शोक-पुकार है; इसका अनुवाद ‘आह, स्वामी!’ भी हो सकता है। ‘सुगन्धित पदार्थ जलाए गए’ राजकीय सम्मान में किए जाने वाले औपचारिक दहन को व्यक्त करता है; इब्रानी शब्द स्वयं जलाई गई वस्तु को स्पष्ट नहीं करता और इसका अर्थ राजा के शरीर का दाह नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשָׁלוֹם
  choice: शान्ति से
  rationale: यह मृत्यु की रीति अथवा परिस्थिति बताता है। ‘शान्ति से’ इब्रानी मुहावरे को रखते हुए हिंसक मृत्यु न होने का संकेत देता है, पर मनःस्थिति का अर्थ अनावश्यक रूप से नहीं जोड़ता।
- source_word: תָּמוּת
  choice: तू ... मरेगा
  rationale: द्वितीय पुरुष एकवचन का सीधा, स्वाभाविक आधुनिक हिन्दी रूप।
- source_word: וּכְמִשְׂרְפוֹת ... כֵּן יִשְׂרְפוּ לָךְ
  choice: जैसे ... सुगन्धित पदार्थ जलाए गए थे, वैसे ही तेरे लिए भी जलाए जाएँगे
  rationale: राजकीय अन्त्येष्टि के प्रसंग में यह मृत राजा के सम्मान में किए जाने वाले औपचारिक दहन को दर्शाता है, सम्भवतः सुगन्धित पदार्थों का; शवदाह का भ्रामक संकेत टाला गया है।
- source_word: אֲבוֹתֶיךָ
  choice: तेरे पुरखों
  rationale: शाब्दिक अर्थ ‘तेरे पिता’ है, किन्तु अगला पद इन्हें पहले के राजाओं के रूप में पहचानता है; ‘पुरखे’ आधुनिक हिन्दी में वंशगत पूर्वजों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הַמְּלָכִים הָרִאשֹׁנִים אֲשֶׁר הָיוּ לְפָנֶיךָ
  choice: उन पहले राजाओं के लिए जो तुझसे पहले थे
  rationale: यह पद ‘पुरखों’ की व्याख्या करता और राजकीय पूर्ववर्तियों पर इब्रानी बल को बनाए रखता है।
- source_word: וְהוֹי אָדוֹן
  choice: हाय, स्वामी!
  rationale: הוֹי शोक की पुकार है और אָדוֹן मृत राजा के लिए आदरसूचक सम्बोधन; ‘स्वामी’ इसे परमेश्वर के विशेष पद के रूप में प्रस्तुत नहीं करता।
- source_word: יִסְפְּדוּ לָךְ
  choice: वे तेरे लिए विलाप करके कहेंगे
  rationale: क्रिया औपचारिक शोक-विलाप बताती है; ‘कहेंगे’ उद्धृत शोक-पुकार को हिन्दी में स्पष्ट रूप से जोड़ता है।
- source_word: כִּי דָבָר אֲנִי דִבַּרְתִּי
  choice: क्योंकि यह वचन मैंने ही कहा है
  rationale: संज्ञा और क्रिया में דבר मूल की पुनरावृत्ति को ‘वचन’ और ‘कहा’ से रखा गया है; ‘ही’ वक्ता पर इब्रानी बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: मानक नबूवत-सूत्र को गरिमापूर्ण हिन्दी में प्रस्तुत किया गया है और יהוה को व्यक्तिगत वाचा-नाम ‘याहवे’ के रूप में रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है; ‘याहवे’ उसे उपाधि से बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: राजकीय מִשְׂרְפוֹת का स्वरूप
  choice: मृत राजा के सम्मान में सुगन्धित पदार्थों का औपचारिक दहन
  alternative: सामान्य अन्त्येष्टि की आग; शवदाह
  rationale: राजकीय दफ़न-सम्मान का प्रसंग सुगन्धित या सुगन्धद्रव्य दहन के अनुकूल है। मूल शब्द स्वयं जलाई गई वस्तु नहीं बताता, इसलिए सम्भावना को पादटिप्पणी में स्पष्ट किया गया है और शवदाह का निष्कर्ष नहीं निकाला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किन्तु सामान्य पाठक के लिए सुबोध। राजा से प्रत्यक्ष एकवचन सम्बोधन के कारण ‘तू/तेरे’ रखा गया है। मुख्य पाठ में सांस्कृतिक अर्थ स्पष्ट किया गया है, जबकि मूल की अनिश्चितता को निर्णय-टिप्पणी में स्वीकार किया गया है।
