base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/002.yaml
  text: 'Thus says Yahweh[a], the God of Israel: Go and speak to Zedekiah king of Judah, and say to him, ‘Thus says Yahweh: Behold, I am giving this city into the hand of the king of Babylon, and he will burn it with fire.’'
translation:
  language: hi
  text: 'इस्राएल का परमेश्वर याहवे[a] यों कहता है: “जा, यहूदा के राजा सिदकिय्याह से बात कर और उससे कह, ‘याहवे यों कहता है: देख, मैं इस नगर को बाबेल के राजा के हाथ में देने वाला हूँ[b], और वह इसे आग से जला देगा।’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहोवा।”
    reason: divine_name_transliteration
  - marker: b
    text: अर्थात्, बाबेल के राजा के अधिकार में सौंपने वाला हूँ।
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: यों कहता है
  rationale: यह भविष्यद्वक्ताओं का मानक संदेशवाहक-सूत्र है; ‘यों कहता है’ मूल की औपचारिक और गंभीर लय को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबलीय परंपरा में परमेश्वर के व्यक्तिगत नाम के रूप में व्यापक और पहचाना हुआ लिप्यंतरण; इसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल का परमेश्वर
  rationale: सम्बन्धसूचक हिब्रू पदबंध का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: הָלֹךְ
  choice: जा
  rationale: क्रियार्थक संज्ञा यहाँ आज्ञार्थक बल रखती है; एकवचन आज्ञा ‘जा’ उसे संक्षेप में व्यक्त करती है।
- source_word: וְאָמַרְתָּ ... וְאָמַרְתָּ אֵלָיו
  choice: से बात कर और उससे कह
  rationale: मूल में आए दोनों वाणी-संबंधी क्रियापदों को बिना अनावश्यक दोहराव के अलग-अलग बनाए रखा गया है।
- source_word: צִדְקִיָּהוּ
  choice: सिदकिय्याह
  rationale: हिब्रू नाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: מֶלֶךְ יְהוּדָה
  choice: यहूदा के राजा
  rationale: नाम के साथ आए राजकीय पद का स्वाभाविक हिन्दी सम्बन्धसूचक रूप।
- source_word: הִנְנִי
  choice: देख, मैं
  rationale: ‘देख’ घोषणा की तात्कालिकता, गंभीरता और दैवी निश्चय को आधुनिक, समझने योग्य हिन्दी में व्यक्त करता है।
- source_word: נֹתֵן
  choice: देने वाला हूँ
  rationale: वर्तमान कृदंत के आसन्न भविष्य और निश्चित घोषणा के बल को हिन्दी में स्वाभाविक रूप से व्यक्त करता है।
- source_word: הָעִיר הַזֹּאת
  choice: इस नगर को
  rationale: निश्चित संज्ञा और संकेतवाचक का सीधा, स्वाभाविक हिन्दी रूप।
- source_word: בְּיַד
  choice: के हाथ में
  rationale: मूल रूपक को बनाए रखता है; यहाँ इसका आशय किसी की सत्ता या अधिकार में सौंपना है, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: מֶלֶךְ בָּבֶל
  choice: बाबेल के राजा
  rationale: राजकीय पद और स्थान-नाम का सीधा हिन्दी रूप।
- source_word: וּשְׂרָפָהּ בָּאֵשׁ
  choice: और वह इसे आग से जला देगा
  rationale: प्रत्यय के कर्ता-संदर्भ को बाबेल के राजा से जोड़ते हुए मूल के स्पष्ट भविष्यसूचक कथन और ‘आग से’ की अभिव्यक्ति को बनाए रखा गया है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चार-अक्षरीय व्यक्तिगत नाम प्रत्यक्ष रूप से है। मुख्य पाठ में उपाधि ‘प्रभु’ के बदले हिन्दी पाठकों में व्यापक रूप से पहचाना जाने वाला नाम-रूप ‘यहोवा’ रखा गया है; ‘याहवे’ को वास्तविक उच्चारण-विकल्प के रूप में पादटिप्पणी में दिया गया है।
- issue: भविष्यसूचक कृदंत נֹתֵן का कालगत बल
  choice: देने वाला हूँ
  alternative: दे रहा हूँ
  rationale: हिब्रू कृदंत वर्तमान में घोषित, निकट और निश्चित भावी कार्य को व्यक्त कर सकता है। ‘देने वाला हूँ’ आसन्न भविष्य को स्वाभाविक हिन्दी में रखता है, जबकि ‘दे रहा हूँ’ आरम्भ हो चुकी प्रक्रिया का अधिक प्रबल संकेत दे सकता है।
- issue: בְּיַד के भविष्यसूचक रूपक का संरक्षण
  choice: के हाथ में
  alternative: के अधिकार में
  rationale: मुख्य पाठ स्रोत की मूर्त रूपकात्मक भाषा को सुरक्षित रखता है; अर्थगत विकल्प पादटिप्पणी में दिया गया है ताकि सत्ता में सौंपे जाने का भाव स्पष्ट रहे।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर भविष्यसूचक घोषणा की गरिमा बनाए रखने के लिए ‘यों कहता है’ और ‘देख’ जैसे संक्षिप्त बाइबलीय पद रखे गए हैं। प्रत्यक्ष कथन के भीतर प्रत्यक्ष दैवी संदेश को स्पष्ट उद्धरण-चिह्नों से अलग किया गया है।
