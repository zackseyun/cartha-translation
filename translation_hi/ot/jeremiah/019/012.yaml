source:
  edition: WLC
  text: כֵּֽן אֶעֱשֶׂ֞ה לַ/מָּק֥וֹם הַ/זֶּ֛ה נְאֻם יְהוָ֖ה וּ/לְ/יֽוֹשְׁבָ֑י/ו וְ/לָ/תֵ֛ת אֶת הָ/עִ֥יר הַ/זֹּ֖את כְּ/תֹֽפֶת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/012.yaml
  text: So I will do to this place[a], declares Yahweh, and to its inhabitants, making this city like Topheth.
translation:
  language: hi
  text: “मैं इस स्थान और इसके निवासियों के साथ ऐसा ही करूँगा—यह याहवे की घोषणा है—और इस नगर को तोपेत[a] के समान बना दूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: तोपेत बेन-हिन्नोम की घाटी में वह स्थान था जो बच्चों की बलि से जुड़ा था और बाद में अशुद्धता तथा न्याय से संबद्ध हुआ। यहाँ तुलना संकेत करती है कि यरूशलेम भी भय और अशुद्धता का स्थान बन जाएगा।
    reason: cultural_note
lexical_decisions:
- source_word: כֵּן אֶעֱשֶׂה
  choice: मैं ... ऐसा ही करूँगा
  rationale: כֵּן preceding sign-act की ओर संकेत करते हुए ‘ऐसा ही/इसी प्रकार’ का भाव देता है; אֶעֱשֶׂה भविष्यकालीन प्रथम पुरुष क्रिया है।
- source_word: לַמָּקוֹם הַזֶּה ... וּלְיֽוֹשְׁבָיו
  choice: इस स्थान और इसके निवासियों के साथ
  rationale: यहाँ ל उन लोगों और स्थान को चिह्नित करता है जिन पर घोषित कार्य होगा। हिन्दी में ‘के साथ’ स्वाभाविक है और प्रसंग से उसके न्यायात्मक स्वर का बोध होता है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: मानक भविष्यद्वक्तीय सूत्र की गंभीरता बनाए रखते हुए नְאֻם को ‘घोषणा’ और परमेश्वर के व्यक्तिगत नाम को ‘याहवे’ कहा गया है।
- source_word: וְלָתֵת אֶת הָעִיר הַזֹּאת
  choice: और इस नगर को ... बना दूँगा
  rationale: לָתֵת का मूल अर्थ ‘देना/ठहराना’ है, पर इस परिणामसूचक रचना में ‘बना देना’ लक्ष्य-भाषा में अर्थ को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: כְּתֹפֶת
  choice: तोपेत के समान
  rationale: उपसर्ग כְּ तुलना व्यक्त करता है; स्थान-नाम תֹפֶת का लिप्यंतरण ‘तोपेत’ रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चतुरक्षरी व्यक्तिगत नाम सीधे उपस्थित है; ‘याहवे’ उसे उपाधि में बदले बिना व्यक्त करता है।
- issue: यरूशलेम को तोपेत के समान बनाने का आशय
  choice: तुलना को मुख्य पाठ में बिना विस्तार के बनाए रखा गया
  alternative: मुख्य पाठ में ही ‘अशुद्धता और विनाश का स्थान’ जोड़ना
  rationale: मूल पद केवल तुलना करता है। उसके सांस्कृतिक और न्याय-संबंधी संकेत को टिप्पणी में समझाना उचित है, ताकि मुख्य पाठ में व्याख्यात्मक शब्द न जोड़े जाएँ।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। भविष्यद्वक्तीय सूत्र को डैश के बीच रखकर वाक्य का प्रवाह और उसकी गंभीरता दोनों सुरक्षित किए गए हैं।
