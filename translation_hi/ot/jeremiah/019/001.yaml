  choice: याहवे यों कहता है
  rationale: यह स्वाभाविक और गरिमापूर्ण हिन्दी में भविष्यद्वक्ताओं का पारंपरिक संदेश-सूत्र व्यक्त करता है तथा दिव्य नाम को नाम के रूप में बनाए रखता है।
- source_word: הָלוֹךְ וְקָנִיתָ
  choice: जा और ... मोल ले
  rationale: आज्ञार्थक बल और क्रमिक क्रिया को स्पष्ट रखता है; ‘मोल ले’ आधुनिक पाठकों के लिए सहज है।
- source_word: בַקְבֻּק יוֹצֵר חָרֶשׂ
  choice: कुम्हार की बनाई हुई मिट्टी की एक सुराही
  rationale: בַקְבֻּק संभवतः सँकरे मुँह वाला आकार दिया हुआ पात्र है; ‘सुराही’ उसके संभावित आकार को सामान्य हिन्दी में व्यक्त करती है, जबकि शेष पदबंध कुम्हार और मिट्टी दोनों का उल्लेख सुरक्षित रखता है।
- source_word: וּמִזִּקְנֵי הָעָם
  choice: लोगों के पुरनियों में से कुछ को
  rationale: מִן के अंशवाचक अर्थ को ‘में से कुछ’ द्वारा स्पष्ट करता है और זְקֵנִים को नेतृत्वकारी बुज़ुर्गों के पारंपरिक अर्थ में ‘पुरनिये’ कहता है।
- source_word: וּמִזִּקְנֵי הַכֹּהֲנִים
  choice: याजकों के पुरनियों में से कुछ को
  rationale: मूल के समानांतर और कुछ असामान्य पदबंध को व्याख्यात्मक रूप से ‘याजकीय पुरनिये’ में बदले बिना सुरक्षित रखता है।
- source_word: ' implied verb with מִן phrases'
  choice: अपने साथ ले जा
  rationale: इब्रानी में चयन-सूचक पदबंधों के साथ क्रिया निहित है; हिन्दी में वाक्य पूरा और स्वाभाविक बनाने के लिए उसे स्पष्ट किया गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: इब्रानी व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय लिप्यंतरित करता है; ‘याहवे’ प्रचलित विद्वत्तापूर्ण उच्चारण के निकट है।
- issue: זִקְנֵי הַכֹּהֲנִים की पहचान
  choice: याजकों के पुरनिये
  alternative: पुरनिये याजक; याजकीय अगुवे
  rationale: मूल संबंधवाचक रचना की अस्पष्टता बनाए रखी गई है और यह निश्चित नहीं किया गया कि वे केवल अधिक आयु वाले याजक थे या कोई विशिष्ट पदाधिकारी वर्ग।
