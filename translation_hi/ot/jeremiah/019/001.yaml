base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/001.yaml
  text: 'Thus says Yahweh: Go and buy a potter’s earthenware flask[a], and take some of the elders of the people and some of the elders of the priests[b],'
translation:
  language: hi
  text: 'याहवे यों कहता है: “जा और कुम्हार की बनाई हुई मिट्टी की एक सुराही[a] मोल ले, और लोगों के बुज़ुर्गों में से कुछ को तथा याजकों के बुज़ुर्गों में से कुछ को अपने साथ ले जा[b]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कुम्हार का मिट्टी का घड़ा” अथवा “मिट्टी की बोतल।” इब्रानी शब्द בַקְבֻּק आकार दिए हुए, संभवतः सँकरे मुँह वाले पात्र को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “लोगों के बुज़ुर्गों में से और याजकों के बुज़ुर्गों में से।” आशय है कि दोनों समूहों में से कुछ प्रतिनिधियों को साथ लिया जाए।
    reason: lexical_alternative
lexical_decisions:
