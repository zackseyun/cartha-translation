  text: וְ/הָי֞וּ בָּתֵּ֣י יְרוּשָׁלִַ֗ם וּ/בָתֵּי֙ מַלְכֵ֣י יְהוּדָ֔ה כִּ/מְק֥וֹם הַ/תֹּ֖פֶת הַ/טְּמֵאִ֑ים לְ/כֹ֣ל הַ/בָּתִּ֗ים אֲשֶׁ֨ר קִטְּר֜וּ עַל גַּגֹּֽתֵי/הֶם֙ לְ/כֹל֙ צְבָ֣א הַ/שָּׁמַ֔יִם וְ/הַסֵּ֥ךְ נְסָכִ֖ים לֵ/אלֹהִ֥ים אֲחֵרִֽים־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/013.yaml
  text: The houses of Jerusalem and the houses of the kings of Judah will become like the unclean place of Topheth—all the houses on whose rooftops they burned incense to all the host of heaven and poured out drink offerings to other gods[a][b].
translation:
  language: hi
  text: यरूशलेम के घर और यहूदा के राजाओं के घर—वे सब घर, जिनकी छतों पर उन्होंने आकाश की सारी सेना[b] के लिए धूप जलाई और दूसरे देवताओं के लिए पेय-बलियाँ उँडेली—तोपेत के स्थान के समान अशुद्ध[a] हो जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘दूषित’।
    reason: lexical_alternative
  - marker: b
    text: ‘आकाश की सेना’ से यहाँ सूर्य, चंद्रमा, तारों आदि खगोलीय पिंडों का आशय है, जिनकी उपासना की जाती थी।
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיוּ
  choice: हो जाएँगे
  rationale: היה के साथ तुलनात्मक כ यहाँ न्याय के फलस्वरूप एक नई दशा में पहुँचने का भाव देता है; इसलिए केवल ‘होंगे’ के बजाय ‘हो जाएँगे’ स्वाभाविक और सटीक है।
- source_word: בָּתֵּי יְרוּשָׁלִַם וּבָתֵּי מַלְכֵי יְהוּדָה
  choice: यरूशलेम के घर और यहूदा के राजाओं के घर
  rationale: दोनों संबंधवाचक पदबंधों की समानांतर संरचना रखी गई है। ‘महल’ अर्थ की दृष्टि से संभव है, पर मूल में सामान्य शब्द ‘घर’ है।
- source_word: כִּמְקוֹם הַתֹּפֶת
  choice: तोपेत के स्थान के समान
  rationale: מָקוֹם को छोड़ा नहीं गया और תֹּפֶת को स्थान-नाम के रूप में लिप्यंतरित किया गया है।
- source_word: הַטְּמֵאִים
  choice: अशुद्ध
  rationale: मूल का बहुवचन विशेषण वाक्य के बहुवचन कर्ता ‘घरों’ से मेल खाता है। ‘अशुद्ध’ धार्मिक और नैतिक अपवित्रता का दायरा बनाए रखता है।
- source_word: לְכֹל הַבָּתִּים אֲשֶׁר
  choice: वे सब घर, जिनकी
  rationale: לְ को यहाँ घरों के विनिर्देशन/समानाधिकरण के रूप में समझा गया है; डैश के भीतर का पदबंध बताता है कि किन घरों की बात हो रही है।
- source_word: קִטְּרוּ עַל גַּגֹּתֵיהֶם
  choice: जिनकी छतों पर उन्होंने ... धूप जलाई
  rationale: קטר का आराधना-संबंधी अर्थ ‘धूप जलाना’ है और עַל גַּגֹּתֵיהֶם छतों पर किए गए अनुष्ठान का स्थान स्पष्ट करता है।
- source_word: לְכֹל צְבָא הַשָּׁמַיִם
  choice: आकाश की सारी सेना के लिए
  rationale: स्थिर इब्रानी रूपक को हिन्दी में बनाए रखा गया है; पाठक की सहायता के लिए पादटिप्पणी में इसके खगोलीय संदर्भ को स्पष्ट किया गया है।
- source_word: וְהַסֵּךְ נְסָכִים
  choice: और ... अर्घ चढ़ाए
  rationale: यह तरल भेंट उँडेलने की आराधना-विधि है। आधुनिक धार्मिक हिन्दी में ‘अर्घ चढ़ाना’ संक्षिप्त और बोधगम्य है।
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: दूसरे देवताओं के लिए
  rationale: वाक्यांश का सीधा अनुवाद रखा गया है, बिना देवताओं की पहचान या स्वरूप के विषय में अतिरिक्त व्याख्या जोड़े।
theological_decisions:
- issue: הַטְּמֵאִים का व्याकरणिक संबंध और अशुद्धता का स्वरूप
  choice: ‘अशुद्ध’ को बहुवचन ‘घरों’ का विधेय माना गया
  alternative: ‘तोपेत का अशुद्ध स्थान’
  rationale: WLC में विशेषण पुल्लिंग बहुवचन है, जो ‘घरों’ से मेल खाता है, जबकि מְקוֹם एकवचन है। अतः घर तोपेत के स्थान के समान अशुद्ध हो जाएँगे। पादटिप्पणी ‘दूषित’ विकल्प को भी सुरक्षित रखती है।
- issue: ‘यहूदा के राजाओं के घर’ का अभिप्राय
  choice: मूल का ‘घर’ यथावत रखा
  alternative: यहूदा के राजाओं के महल
  rationale: राजकीय निवास अभिप्रेत हो सकते हैं, पर ‘महल’ कहना मूल से अधिक विशिष्ट होगा।
- issue: צְבָא הַשָּׁמַיִם का प्रस्तुतीकरण
  choice: ‘आकाश की सारी सेना’ रूपक बनाए रखा
  alternative: सभी खगोलीय पिंड
  rationale: मूल की सजीव और धर्मवैचारिक अभिव्यक्ति मुख्य पाठ में सुरक्षित है; सांस्कृतिक आशय पादटिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। मूल इब्रानी के बहुवचन विशेषण को ध्यान में रखते हुए वाक्य को पुनर्गठित किया गया है, और लंबे विनिर्देशक अंश को डैश के भीतर रखा गया है। ‘अर्घ’ धार्मिक तरल भेंट के लिए प्रचलित शब्द है; पंथ-विशेष की शब्दावली या व्याख्या नहीं जोड़ी गई।
