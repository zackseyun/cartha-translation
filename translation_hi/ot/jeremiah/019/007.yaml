base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/007.yaml
  text: And I will frustrate the plan of Judah and Jerusalem in this place[a], and I will make them fall by the sword before their enemies and by the hand of those who seek their life[c][b], and I will give their corpses as food to the birds of the heavens and to the beasts of the earth.
translation:
  language: hi
  text: “मैं इस स्थान पर यहूदा और यरूशलेम की योजना को निष्फल कर दूँगा[a]। मैं उन्हें उनके शत्रुओं के सामने तलवार से और उनके प्राण के पीछे पड़े लोगों के हाथों गिरा दूँगा[b]। मैं उनकी लाशों को आकाश के पक्षियों[c] और धरती के पशुओं का आहार बना दूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यहूदा और यरूशलेम के परामर्श को निष्फल कर दूँगा।”
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक अर्थ: “उनके प्राण को खोजनेवालों के हाथों”; अर्थात् जो उन्हें मार डालना चाहते हैं।'
    reason: lexical_alternative
  - marker: c
    text: या “आसमान के पक्षियों।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַקֹּתִי
  choice: निष्फल कर दूँगा
  rationale: בקק के कारक अर्थ में किसी योजना या परामर्श को खाली अथवा प्रभावहीन कर देना व्यक्त होता है। ‘निष्फल कर दूँगा’ आधुनिक हिन्दी में इस भाव को स्वाभाविक और सटीक ढंग से प्रकट करता है।
- source_word: עֲצַת
  choice: योजना
  rationale: עֵצָה का अर्थ ‘परामर्श’, ‘योजना’ या ‘रणनीति’ हो सकता है। प्रसंग में ‘योजना’ स्पष्ट और स्वाभाविक है; ‘परामर्श’ को पादटिप्पणी में रखा गया है।
- source_word: יְהוּדָה וִירוּשָׁלִַם
  choice: यहूदा और यरूशलेम
  rationale: राज्य और उसकी राजधानी के पारंपरिक हिन्दी नामों को बनाए रखा गया है।
- source_word: בַּמָּקוֹם הַזֶּה
  choice: इस स्थान पर
  rationale: यह संकेतवाचक स्थान-सूचक पदबंध का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: וְהִפַּלְתִּים
  choice: उन्हें ... गिरा दूँगा
  rationale: נפל के हिफ़ील रूप की कारक शक्ति को बनाए रखता है। प्रसंग में यह तलवार से मारे जाने को सूचित करता है, पर मुख्य पाठ में मूल बिंब ‘गिरा दूँगा’ सुरक्षित रखा गया है।
- source_word: בַּחֶרֶב
  choice: तलवार से
  rationale: युद्ध अथवा वध के साधन को व्यक्त करने वाला सीधा हिन्दी प्रयोग है।
- source_word: לִפְנֵי אֹיְבֵיהֶם
  choice: उनके शत्रुओं के सामने
  rationale: לִפְנֵי के स्थानिक-संबंधपरक अर्थ को निकटता से व्यक्त करता है।
- source_word: וּבְיַד מְבַקְשֵׁי נַפְשָׁם
  choice: उनके प्राण के पीछे पड़े लोगों के हाथों
  rationale: ‘प्राण खोजना’ वाले इब्रानी मुहावरे को शब्दशः अस्वाभाविक बनाए बिना उसका भाव और ‘हाथ’ द्वारा व्यक्त कर्तृत्व दोनों सुरक्षित रखे गए हैं।
- source_word: נִבְלָתָם
  choice: उनकी लाशों
  rationale: मानव मृत शरीरों के लिए नְבֵלָה का स्वाभाविक, स्पष्ट और प्रसंगानुकूल हिन्दी रूप है।
- source_word: לְמַאֲכָל
  choice: आहार
  rationale: पक्षियों और पशुओं के भोजन बनने के गंभीर, काव्यात्मक भाव को संक्षेप और गरिमा से व्यक्त करता है।
- source_word: לְעוֹף הַשָּׁמַיִם
  choice: आकाश के पक्षियों
  rationale: हिब्रू שָׁמַיִם यहाँ ऊपर के आकाश को दर्शाता है; ‘आकाश के पक्षी’ हिन्दी में स्वाभाविक बाइबलीय अभिव्यक्ति है।
- source_word: וּלְבֶהֱמַת הָאָרֶץ
  choice: और धरती के पशुओं
  rationale: स्थलीय जंगली अथवा अन्य पशुओं के व्यापक वर्ग को व्यक्त करने वाला निकट और सहज अनुवाद है।
theological_decisions:
- issue: न्याय में परमेश्वर की प्रत्यक्ष कर्तृता
  choice: प्रथम पुरुष के प्रत्यक्ष क्रियाक्रम—‘मैं ... निष्फल कर दूँगा’, ‘मैं ... गिरा दूँगा’, ‘मैं ... आहार बना दूँगा’—को बनाए रखा गया है।
  alternative: कर्तृता को नरम करके ‘मैं उन्हें गिरने दूँगा’ जैसे अनुमति-सूचक रूप में अनुवाद करना।
  rationale: इब्रानी क्रियाएँ परमेश्वर की प्रत्यक्ष प्रथम-पुरुष कार्रवाई बताती हैं। अनुवाद इस न्यायिक कर्तृता को न तो नरम करता है, न उससे आगे कोई व्याख्या जोड़ता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गंभीर भविष्यद्वाणी-संबंधी लहजे के साथ रखी गई है। वाक्य स्वाभाविक पठनीयता के लिए तीन खंडों में विभाजित है, जबकि मूल की प्रथम-पुरुष न्याय-श्रृंखला और ‘गिरा दूँगा’ का युद्ध-संबंधी बिंब सुरक्षित है। सभी पादटिप्पणी चिह्न मुख्य पाठ में संबंधित पद के तुरंत बाद दिए गए हैं।
