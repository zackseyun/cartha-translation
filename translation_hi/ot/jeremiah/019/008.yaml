base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/008.yaml
  text: And I will make this city a horror and an object of hissing[b][a]; everyone who passes by it will be appalled and will hiss because of all its wounds.
translation:
  language: hi
  text: और मैं इस नगर को उजाड़ और उपहास का विषय बना दूँगा[a]। जो कोई इसके पास से गुज़रेगा, वह इसकी सारी चोटों के कारण स्तब्ध रह जाएगा और तिरस्कार से सीटी बजाएगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भयावह उजाड़ और सीटी बजाने का विषय।” इब्रानी संज्ञाएँ नगर की उजड़ी दशा और उसे देखकर प्रकट किए जाने वाले तिरस्कार—दोनों पर बल दे सकती हैं।
    reason: lexical_alternative
  - marker: b
    text: या, “चकित रह जाएगा और फुफकारेगा।” इब्रानी में सीटी बजाना या फुफकारना न्याय से आए विनाश पर स्तब्धता अथवा तिरस्कार प्रकट करने का पारंपरिक बिंब है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: और मैं ... बना दूँगा
  rationale: שׂים के साथ לְ और परिणामसूचक संज्ञाएँ नगर की परिणामी दशा बताती हैं; हिन्दी में ‘बना दूँगा’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: הָעִיר הַזֹּאת
  choice: इस नगर को
  rationale: यह सीधा संकेतवाचक पदबंध है; ‘इस नगर’ से הַזֹּאת का निकट संकेत सुरक्षित रहता है।
- source_word: לְשַׁמָּה
  choice: उजाड़
  rationale: שַׁמָּה विनाशकारी उजाड़ और उससे उपजने वाले विस्मय/भय दोनों की ओर संकेत कर सकता है। मुख्य पाठ में ‘उजाड़’ नगर की वास्तविक दशा को स्पष्ट रखता है, जबकि पादटिप्पणी प्रतिक्रिया-संबंधी अर्थ बताती है।
- source_word: וְלִשְׁרֵקָה
  choice: उपहास का पात्र
  rationale: שְׁרֵקָה सीटी या फुफकार द्वारा व्यक्त तिरस्कार का बिंब है। ‘उपहास का पात्र’ हिन्दी में परिणाम को स्वाभाविक ढंग से कहता है; अगले वाक्य और पादटिप्पणी में मूल श्रव्य बिंब सुरक्षित है।
- source_word: כֹּל עֹבֵר עָלֶיהָ
  choice: जो कोई इसके पास से गुज़रेगा
  rationale: सहभागी रूप सामान्य और सार्वत्रिक अर्थ रखता है। नगर के संदर्भ में ‘इसके पास से गुज़रेगा’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: יִשֹּׁם
  choice: स्तब्ध रह जाएगा
  rationale: שׁמם यहाँ विनाश देखकर चकित, भयभीत या स्तब्ध होने की प्रतिक्रिया बताता है। ‘स्तब्ध रह जाएगा’ इस प्रबल प्रतिक्रिया को बिना अनावश्यक व्याख्या के व्यक्त करता है।
- source_word: וְיִשְׁרֹק
  choice: तिरस्कार से सीटी बजाएगा
  rationale: שרק का अर्थ सीटी बजाना या फुफकारना हो सकता है; भविष्यद्वाणी के न्याय-संदर्भ में यह स्तब्धता और उपहास का पारंपरिक संकेत है। ‘तिरस्कार से’ प्रसंगगत आशय स्पष्ट करता है और ‘सीटी’ मूल बिंब बनाए रखती है।
- source_word: עַל כָּל מַכֹּתֶיהָ
  choice: इसकी सारी चोटों के कारण
  rationale: מַכָּה का अर्थ प्रहार, चोट, विपत्ति या महामारी हो सकता है। नगर को पहुँची दंडात्मक क्षति के लिए ‘चोटों’ से रूपक और बहुवचन दोनों सुरक्षित रहते हैं।
