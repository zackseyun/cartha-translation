source:
  edition: WLC
  text: וְ/אָֽמַרְתָּ֙ שִׁמְע֣וּ דְבַר יְהוָ֔ה מַלְכֵ֣י יְהוּדָ֔ה וְ/יֹשְׁבֵ֖י יְרֽוּשָׁלִָ֑ם כֹּֽה אָמַר֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל הִנְ/נִ֨י מֵבִ֤יא רָעָה֙ עַל הַ/מָּק֣וֹם הַ/זֶּ֔ה אֲשֶׁ֥ר כָּל שֹׁמְעָ֖/הּ תִּצַּ֥לְנָה אָזְנָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/003.yaml
  text: 'And say, ‘Hear the word of the LORD, O kings of Judah and inhabitants of Jerusalem. Thus says the LORD of hosts, the God of Israel: Behold, I am bringing disaster on this place, at which everyone who hears of it—his ears will tingle.’'
translation:
  language: hi
  text: 'और कहना, “हे यहूदा के राजाओ और यरूशलेम के निवासियो, यहोवा का वचन सुनो। सेनाओं का यहोवा, इस्राएल का परमेश्वर, यों कहता है: देखो, मैं इस स्थान पर ऐसी विपत्ति लाने वाला हूँ कि जो कोई उसके विषय में सुनेगा, उसके कान झनझना उठेंगे।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के विशिष्ट नाम को सामान्य उपाधि से अलग रखते हुए हिन्दी में प्रचलित बाइबलीय रूप अपनाया गया है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का यहोवा
  rationale: हिब्रू पदबंध की सैन्य और सार्वभौम प्रभुता-संबंधी छवि को बनाए रखने वाला स्वाभाविक हिन्दी रूप।
- source_word: רָעָה
  choice: विपत्ति
  rationale: इस प्रसंग में शब्द नैतिक बुराई नहीं, आने वाले विनाशकारी संकट को दर्शाता है; ‘विपत्ति’ वही अर्थ स्पष्ट करता है।
- source_word: תִּצַּלְנָה אָזְנָיו
  choice: उसके कान झनझना उठेंगे
  rationale: तीव्र, स्तब्ध कर देने वाली खबर के लिए प्रयुक्त हिब्रू मुहावरे की शारीरिक छवि हिन्दी में सुरक्षित रखी गई है।
theological_decisions:
- issue: ईश्वरीय विपत्ति का कर्ता
  choice: मैं इस स्थान पर ऐसी विपत्ति लाने वाला हूँ
  alternative: इस स्थान पर विपत्ति आने वाली है
  rationale: הִנְנִי מֵבִיא में परमेश्वर स्वयं क्रियाशील कर्ता हैं; निष्क्रिय अनुवाद इस धर्मवैचारिक तनाव को कम कर देता।
- issue: יְהוָה का निरूपण
  choice: यहोवा
  alternative: प्रभु
  rationale: विशिष्ट वाचा-नाम को स्पष्ट रखा गया है और उसे केवल एक उपाधि में नहीं बदला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक भविष्यवाणी-संबंधी शैली रखी गई है। सम्बोधन के बहुवचन रूप ‘राजाओ’ और ‘निवासियो’ स्वाभाविक हिन्दी पुकार को व्यक्त करते हैं। ‘ऐसी...कि’ संरचना हिब्रू परिणाम-वाक्य को स्पष्ट रूप से संप्रेषित करती है।
