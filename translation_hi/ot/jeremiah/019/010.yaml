  text: וְ/שָׁבַרְתָּ֖ הַ/בַּקְבֻּ֑ק לְ/עֵינֵי֙ הָֽ/אֲנָשִׁ֔ים הַ/הֹלְכִ֖ים אוֹתָֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/010.yaml
  text: Then you shall break the flask before the eyes of the men who are going with you[a].
translation:
  language: hi
  text: तब तुम उस कुप्पी को अपने साथ जानेवाले पुरुषों की आँखों के सामने तोड़ देना।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने साथ जानेवाले पुरुषों के देखते-देखते।”
    reason: लְעֵינֵי के वैकल्पिक स्वाभाविक मुहावरे को दर्शाता है।
lexical_decisions:
- source_word: וְשָׁבַרְתָּ
  choice: तब तुम ... तोड़ देना
  rationale: संयोजक वाव के साथ क़ाल पूर्ण रूप यहाँ निर्देशों के क्रम में अगली आज्ञा व्यक्त करता है; ‘तब’ क्रम को और ‘तोड़ देना’ स्वाभाविक हिन्दी निर्देश को व्यक्त करता है।
- source_word: הַבַּקְבֻּק
  choice: उस कुप्पी को
  rationale: यह संकरी गर्दन वाले मिट्टी के पात्र को सूचित करता है, जिसका इस प्रतीकात्मक कार्य में पहले उल्लेख है; ‘कुप्पी’ पात्र के विशिष्ट आकार को सामान्य ‘घड़े’ से अधिक ठीक रखती है।
- source_word: לְעֵינֵי
  choice: की आँखों के सामने
  rationale: यह दृश्य साक्षियों की उपस्थिति का इब्रानी मुहावरा है; शाब्दिक चित्र और स्वाभाविक हिन्दी दोनों सुरक्षित रहते हैं।
- source_word: הָאֲנָשִׁים
  choice: पुरुषों
  rationale: संज्ञा पुल्लिंग ‘पुरुषों’ को निर्दिष्ट करती है; प्रसंग इसे सामान्य ‘लोगों’ तक व्यापक करने की माँग नहीं करता।
- source_word: הַהֹלְכִים אוֹתָךְ
  choice: अपने साथ जानेवाले
  rationale: कृदन्त यिर्मयाह के साथ उस समय जा रहे पुरुषों का जारी साथ दर्शाता है; यह हिन्दी में संक्षिप्त और स्पष्ट है।
theological_decisions: []
