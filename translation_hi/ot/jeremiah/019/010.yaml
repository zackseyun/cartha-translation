  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘कुप्पी’ संकेतात्मक पात्र की ठोस छवि बनाए रखती है और ‘आँखों के सामने’ मूल इब्रानी की दृश्यात्मकता को सुरक्षित रखता है।
