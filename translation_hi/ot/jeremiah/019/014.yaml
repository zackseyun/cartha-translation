base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/014.yaml
  text: Then Jeremiah came from Topheth[a], where Yahweh had sent him to prophesy, and he stood in the court of the house of Yahweh and said to all the people,
translation:
  language: hi
  text: तब यिर्मयाह तोपेत[a] से आया, जहाँ याहवे ने उसे भविष्यवाणी करने के लिए भेजा था; वह याहवे के भवन के आँगन में खड़ा हुआ और उसने सब लोगों से कहा,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: तोपेत वह स्थान था जो इस अध्याय में यिर्मयाह के पहले के भविष्यसूचक चिन्ह और सन्देश से जुड़ा था।
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּבֹא
  choice: आया
  rationale: בוא का कथात्मक रूप सन्दर्भ के अनुसार ‘आया/गया’ हो सकता है; तोपेत से मन्दिर-प्रांगण की ओर लौटने के दृष्टिकोण से ‘आया’ स्वाभाविक है।
- source_word: מֵהַתֹּפֶת
  choice: तोपेत से
  rationale: תֹּפֶת स्थान-नाम है, इसलिए इसका लिप्यंतरण किया गया है; हिब्रू के निश्चयवाचक उपसर्ग को हिन्दी स्थान-नाम में अलग नहीं दर्शाया गया।
- source_word: אֲשֶׁר שְׁלָחוֹ יְהוָה שָׁם
  choice: जहाँ यहोवा ने उसे ... भेजा था
  rationale: सम्बन्धवाचक वाक्यांश तोपेत को उस स्थान के रूप में बताता है जहाँ यिर्मयाह भेजा गया था। ‘भेजा था’ उसके वहाँ से आने से पहले की क्रिया स्पष्ट करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार अक्षरों वाले परमेश्वर के व्यक्तिगत नाम को हिन्दी में प्रचलित बाइबलीय लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से नहीं।
- source_word: לְהִנָּבֵא
  choice: भविष्यवाणी करने के लिए
  rationale: נבא के निफ़अल क्रियारूप का मानक और सहज हिन्दी अर्थ ‘भविष्यवाणी करना’ है।
- source_word: וַיַּעֲמֹד
  choice: खड़ा हुआ
  rationale: עמד का सीधा कथात्मक अर्थ रखा गया है; ‘डटकर खड़ा हुआ’ जैसा अतिरिक्त बल नहीं जोड़ा गया।
- source_word: בַּחֲצַר בֵּית יְהוָה
  choice: यहोवा के भवन के आँगन में
  rationale: חצר के लिए ‘आँगन’ आधुनिक हिन्दी में स्वाभाविक है, और हिब्रू सम्बन्ध-रचना को स्पष्ट रूप में रखा गया है।
- source_word: וַיֹּאמֶר אֶל כָּל הָעָם
  choice: उसने सब लोगों से कहा
  rationale: אמר का सामान्य अर्थ ‘कहा’ है और כל העם को बिना संकुचित किए ‘सब लोगों’ के रूप में रखा गया है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ व्यक्तिगत ईश्वरीय नाम का प्रयोग करता है। हिन्दी पाठकों में पहचाने जाने वाले पारंपरिक लिप्यंतरण ‘यहोवा’ को अपनाया गया है; इसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथात्मक शैली रखी गई है। पद अगले कथन की भूमिका है, इसलिए अन्त में अल्पविराम रखा गया है।
