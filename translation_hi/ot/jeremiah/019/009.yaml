language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הַֽאֲכַלְתִּ֞י/ם אֶת בְּשַׂ֣ר בְּנֵי/הֶ֗ם וְ/אֵת֙ בְּשַׂ֣ר בְּנֹתֵי/הֶ֔ם וְ/אִ֥ישׁ בְּשַׂר רֵעֵ֖/הוּ יֹאכֵ֑לוּ בְּ/מָצוֹר֙ וּ/בְ/מָצ֔וֹק אֲשֶׁ֨ר יָצִ֧יקוּ לָ/הֶ֛ם אֹיְבֵי/הֶ֖ם וּ/מְבַקְשֵׁ֥י נַפְשָֽׁ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/009.yaml
  text: And I will make them eat the flesh of their sons and the flesh of their daughters[b][a], and each will eat the flesh of his neighbor in the siege and in the distress with which their enemies and those who seek their life will afflict them.
translation:
  language: hi
  text: और मैं उन्हें उनके बेटों का मांस और उनकी बेटियों का मांस खिलाऊँगा, और हर एक अपने पड़ोसी का मांस उस घेराबंदी और संकट में खाएगा, जिनसे उनके शत्रु और जो उनके प्राण लेना चाहते हैं[a], उन्हें पीड़ित करेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक: ‘उनके प्राण के खोजी’; यह इब्रानी मुहावरा उन लोगों के लिए है जो उन्हें मार डालना चाहते हैं।'
    reason: इब्रानी मुहावरे का शाब्दिक रूप और उसका आशय स्पष्ट करना।
lexical_decisions:
- source_word: וְהַאֲכַלְתִּים
  choice: मैं उन्हें ... खिलाऊँगा
  rationale: אכל का हिफ़ील रूप स्पष्टतः कारणवाचक है। ‘खिलाऊँगा’ स्वाभाविक हिन्दी में परमेश्वर की प्रत्यक्ष न्यायकारी भूमिका बनाए रखता है।
- source_word: בְּשַׂר בְּנֵיהֶם וְאֵת בְּשַׂר בְּנֹתֵיהֶם
  choice: उनके बेटों का मांस और उनकी बेटियों का मांस
  rationale: ‘बेटों’ और ‘बेटियों’ को अलग-अलग रखकर इब्रानी की जानबूझकर की गई समानांतरता और कथन की भयावहता सुरक्षित रहती है।
- source_word: וְאִישׁ בְּשַׂר רֵעֵהוּ יֹאכֵלוּ
  choice: हर एक अपने पड़ोसी का मांस खाएगा
  rationale: אִישׁ यहाँ वितरणात्मक अर्थ में है; ‘हर एक’ आधुनिक हिन्दी में स्वाभाविक है। רֵעַ के लिए ‘पड़ोसी’ सामुदायिक निकटता को व्यक्त करता है, बिना ‘मित्र’ जैसा भावात्मक अर्थ जोड़े।
- source_word: בְּמָצוֹר וּבְמָצוֹק
  choice: घेराबंदी और ... संकट के समय
  rationale: מָצוֹר सैन्य घेराबंदी और מָצוֹק तीव्र दबाव या संकट को दर्शाते हैं। ‘के समय’ दोनों अवस्थाओं को स्वाभाविक हिन्दी में जोड़ता है।
- source_word: אֲשֶׁר יָצִיקוּ לָהֶם
  choice: जिससे ... उन्हें दबाएँगे
  rationale: यह संबंधवाचक उपवाक्य शत्रुओं द्वारा उत्पन्न कठोर दबाव को बताता है। ‘दबाएँगे’ मूल धातु की संकुचित और पीड़ित करने वाली शक्ति को संक्षेप में व्यक्त करता है।
- source_word: וּמְבַקְשֵׁי נַפְשָׁם
  choice: उनके प्राण के खोजी
  rationale: नֶפֶשׁ यहाँ जीवन के अर्थ में है। यह चयन मूल इब्रानी मुहावरे को बनाए रखता है; पादटिप्पणी उसका आशय स्पष्ट करती है।
theological_decisions:
- issue: न्याय में परमेश्वर की भूमिका
  choice: 'प्रत्यक्ष कारणवाचक कथन: ‘मैं उन्हें ... खिलाऊँगा’'
  alternative: ‘मैं उन्हें ... खाने दूँगा’
  rationale: हिफ़ील क्रिया केवल अनुमति नहीं, बल्कि कारणता व्यक्त करती है। अनुवाद भविष्यवाणी के कठोर न्याय को धर्मवैज्ञानिक रूप से नरम नहीं करता।
- issue: נֶפֶשׁ का मानवशास्त्रीय मुहावरा
  choice: ‘प्राण के खोजी’
  alternative: ‘उन्हें मार डालने की ताक में रहनेवाले’
  rationale: ‘प्राण’ यहाँ जीवन को सूचित करता है, किसी पृथक अमूर्त आत्मा के सिद्धान्त को नहीं। मूल मुहावरा मुख्य पाठ में रखा गया और उसका व्यावहारिक अर्थ पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘मांस’ और प्रत्यक्ष कारणवाचक क्रिया मूल कथन की भयावहता को बिना नरम किए सुरक्षित रखते हैं।
