- from: और मैं उन्हें उनके बेटों का मांस और उनकी बेटियों का मांस खिलाऊँगा। घेराबंदी और उस संकट के समय, जिससे उनके शत्रु और उनके प्राण के खोजी उन्हें दबाएँगे, हर एक अपने पड़ोसी का मांस खाएगा।[a]
  to: और मैं उन्हें उनके बेटों का मांस और उनकी बेटियों का मांस खिलाऊँगा, और हर एक अपने पड़ोसी का मांस उस घेराबंदी और संकट में खाएगा, जिनसे उनके शत्रु और जो उनके प्राण लेना चाहते हैं[a], उन्हें पीड़ित करेंगे।
