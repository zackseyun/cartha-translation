base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/004.yaml
  text: Because they have forsaken me and made this place unrecognizable[a], and have burned incense in it to other gods whom neither they nor their fathers nor the kings of Judah had known, and they have filled this place with the blood of innocents[b],
translation:
  language: hi
  text: क्योंकि उन्होंने मुझे त्याग दिया, इस स्थान को पराया कर दिया[a] और इस स्थान में दूसरे देवताओं के लिए धूप जलाई, जिन्हें न तो वे, न उनके पुरखे और न यहूदा के राजा जानते थे; और उन्होंने इस स्थान को निर्दोषों के खून से भर दिया[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस स्थान को अपवित्र कर दिया” अथवा “इस स्थान को पराया समझा।” इब्रानी क्रिया में किसी वस्तु को अजनबी या पराया कर देने का भाव है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “निर्दोषों का खून”; इसका अर्थ निर्दोष लोगों का बहाया हुआ खून है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: क्योंकि
  rationale: यह पद आनेवाले न्याय का कारण बताता है। ‘क्योंकि’ आधुनिक हिन्दी में स्वाभाविक है और इब्रानी पदबंध की कारणवाचक शक्ति बनाए रखता है।
- source_word: עֲזָבֻנִי
  choice: उन्होंने मुझे त्याग दिया
  rationale: עזב का अर्थ छोड़ना या त्यागना है। ‘त्याग दिया’ भविष्यद्वाणी के वाचा-संबंधी और relational भार को संक्षेप में व्यक्त करता है।
- source_word: וַיְנַכְּרוּ אֶת־הַמָּקוֹם הַזֶּה
  choice: इस स्थान को पराया बना दिया
  rationale: नכר के पिएल रूप में किसी वस्तु को पराया या अपरिचित बना देने का भाव है। यह अनुवाद ‘अपवित्र किया’ जैसी व्याख्यात्मक स्पष्टता थोपे बिना मूल बिंब को सुरक्षित रखता है।
- source_word: וַיְקַטְּרוּ בוֹ
  choice: यहाँ ... धूप जलाई
  rationale: קטר इस प्रयोग में धूप अथवा धुआँ उत्पन्न करनेवाली भेंट जलाने को सूचित करता है। ‘धूप जलाई’ यिर्मयाह के मूर्तिपूजक उपासना-संदर्भ में स्पष्ट और स्वाभाविक है।
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: दूसरे देवताओं के लिए
  rationale: אֲחֵרִים का सीधा अर्थ ‘दूसरे’ है। हिन्दी में धूप जलाने के साथ ‘के लिए’ लक्ष्य-देवताओं को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֲשֶׁר לֹא יְדָעוּם
  choice: जिन्हें ... जानते थे
  rationale: ידע यहाँ ऐतिहासिक परिचय और उपासना में मान्यता का संकेत देता है। ‘जानते थे’ मूल की व्यापकता और संभावित धार्मिक अर्थच्छाया दोनों को बनाए रखता है।
- source_word: הֵמָּה וַאֲבוֹתֵיהֶם וּמַלְכֵי יְהוּדָה
  choice: न तो वे, न उनके पुरखे और न यहूदा के राजा
  rationale: दोहराया गया ‘न’ यह स्पष्ट करता है कि निषेध तीनों समूहों पर लागू है। ‘पुरखे’ आधुनिक हिन्दी में सहज है और वंशगत पूर्वजों का अर्थ देता है।
- source_word: וּמָלְאוּ אֶת־הַמָּקוֹם הַזֶּה
  choice: उन्होंने इस स्थान को ... से भर दिया
  rationale: यह पूर्ण किए गए दोषारोपित कार्य को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: דַּם נְקִיִּם
  choice: निर्दोषों के खून
  rationale: यह इब्रानी के शाब्दिक बहुवचन, ‘निर्दोषों का खून,’ में पीड़ित व्यक्तियों की उपस्थिति बनाए रखता है; केवल ‘निर्दोष खून’ कहने से यह कुछ कम स्पष्ट हो सकती थी।
theological_decisions:
- issue: ‘इस स्थान’ के संबंध में נכר का अर्थ
  choice: इस स्थान को पराया बना दिया
  alternative: इस स्थान को अपवित्र कर दिया / इस स्थान को पराया समझा
  rationale: क्रिया का केंद्रीय बिंब पराया या बिराना बना देने का है। ‘अपवित्र किया’ संदर्भगत अर्थ हो सकता है, पर वह मूल क्रिया की विदेशीपन और अलगाव की छवि को व्याख्यात्मक रूप से सीमित कर देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। पद मूल वाक्य के कारणवाचक आश्रित अंश के रूप में अल्पविराम पर समाप्त होता है। ‘पराया बना दिया’ जानबूझकर मूल की अर्थगत खिंचाव को सुरक्षित रखता है; पादटिप्पणी अधिक व्याख्यात्मक विकल्प देती है।
