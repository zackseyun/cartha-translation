source:
  edition: WLC
  text: וְ/יָצָ֨אתָ֙ אֶל גֵּ֣יא בֶן הִנֹּ֔ם אֲשֶׁ֕ר פֶּ֖תַח שַׁ֣עַר ה/חרסות וְ/קָרָ֣אתָ שָּׁ֔ם אֶת הַ/דְּבָרִ֖ים אֲשֶׁר אֲדַבֵּ֥ר אֵלֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/002.yaml
  text: and go out to the Valley of Ben Hinnom[a], which is at the entrance of the Potsherd Gate, and proclaim there the words that I will speak to you.
translation:
  language: hi
  text: और निकलकर बेन-हिन्नोम की घाटी में जा, जो ठीकरों के फाटक[a] के प्रवेश-द्वार पर है, और वहाँ उन वचनों की घोषणा कर जो मैं तुझसे कहूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: फाटक के इस हिब्रू नाम का अर्थ कुछ अनिश्चित है। इसका अनुवाद ‘ठीकरों का फाटक’ भी किया जा सकता है; कुछ इसे अधिक औपचारिक रूप से ‘हर्सीत फाटक’ लिखते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: וְיָצָאתָ
  choice: और ... जा
  rationale: निर्देशों की क्रमिक शृंखला में वाव-सहित पूर्ण क्रिया का आदेशात्मक भाव है; ‘जा’ आधुनिक हिन्दी में इसे स्वाभाविक रूप से व्यक्त करता है और יצא की बाहर जाने की दिशा प्रसंग से निहित रहती है।
- source_word: גֵּיא בֶן הִנֹּם
  choice: बेन-हिन्नोम की घाटी
  rationale: यह स्थान-नाम है; ‘बेन-हिन्नोम’ का लिप्यंतरण बाद की ‘गेहन्ना’ संबंधी धारणाएँ आरोपित नहीं करता और हिन्दी में नाम की पहचान बनाए रखता है।
- source_word: אֲשֶׁר פֶּתַח שַׁעַר הַחַרְסוּת
  choice: जो ठीकरेवाले फाटक के प्रवेश पर है
  rationale: פֶּתַח שַׁעַר को ‘फाटक के प्रवेश पर’ और הַחַרְסוּת को मिट्टी के टूटे बर्तन/ठीकरों से संबंधित पारंपरिक अर्थ में लिया गया है। फाटक के नाम की पाठगत या व्युत्पत्तिगत अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: וְקָרָאתָ שָּׁם
  choice: और वहाँ ... पुकारकर सुना
  rationale: भविष्यद्वक्ताई संदर्भ में קרא सार्वजनिक रूप से ऊँची आवाज़ में घोषित करने का अर्थ देता है; ‘पुकारकर सुना’ साधारण पाठक के लिए स्पष्ट और स्वाभाविक है।
- source_word: אֶת־הַדְּבָרִים
  choice: वे वचन
  rationale: דְּבָרִים का औपचारिक अर्थ ‘वचन/बातें’ है; ‘वचन’ परमेश्वर के आगामी कथन से संबंध बनाए रखता है।
- source_word: אֲשֶׁר אֲדַבֵּר אֵלֶיךָ
  choice: जो मैं तुझसे कहूँगा
  rationale: भविष्य में यिर्मयाह को दिए जाने वाले दिव्य कथन का सीधा और स्वाभाविक हिन्दी रूप; एकवचन संबोधन बनाए रखने के लिए ‘तुझसे’ चुना गया है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक घोषणा के अनुकूल रखी गई है। यिर्मयाह के लिए एकवचन आदेशात्मक ‘जा’ और संबोधन ‘तुझसे’ मूल की व्याकरणिक संख्या को सुरक्षित रखते हैं। पादटिप्पणी का चिह्न संबंधित अनिश्चित फाटक-नाम के तुरंत बाद लगाने के बजाय वचन के अंत में रखा गया है, और उसका आशय स्पष्ट रूप से उसी नाम से जोड़ा गया है।
