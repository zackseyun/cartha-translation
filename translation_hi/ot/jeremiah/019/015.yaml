  text: כֹּֽה אָמַ֞ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הִנְ/נִ֨י מבי אֶל הָ/עִ֤יר הַ/זֹּאת֙ וְ/עַל כָּל עָרֶ֔י/הָ אֵ֚ת כָּל הָ֣/רָעָ֔ה אֲשֶׁ֥ר דִּבַּ֖רְתִּי עָלֶ֑י/הָ כִּ֤י הִקְשׁוּ֙ אֶת עָרְפָּ֔/ם לְ/בִלְתִּ֖י שְׁמ֥וֹעַ אֶת דְּבָרָֽ/י־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/015.yaml
  text: 'Thus says Yahweh of hosts[a], the God of Israel: Behold, I am bringing on this city and on all its towns all the disaster that I have spoken against it[c][b], because they have stiffened their neck so as not to hear my words.'
translation:
  language: hi
  text: 'सेनाओं का याहवे[a], इस्राएल का परमेश्वर, यह कहता है: “देखो, मैं इस नगर और उसके सब नगरों[b] पर वह सारी विपत्ति[c] ले आ रहा हूँ, जिसकी घोषणा मैंने इसके विरुद्ध की थी; क्योंकि उन्होंने अपनी गर्दन अकड़ा ली है[d], ताकि वे मेरे वचन न सुनें।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘सेनाओं’ स्वर्गीय और सांसारिक दलों की ओर संकेत कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उसकी सभी बस्तियों’; इब्रानी शब्द छोटे-बड़े नगरों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘सारी विपदा’; यहाँ इब्रानी רָעָה का अर्थ नैतिक बुराई नहीं, बल्कि न्याय में आने वाली विपत्ति है।
    reason: lexical_alternative
  - marker: d
    text: इब्रानी मुहावरा; अर्थ है कि उन्होंने हठपूर्वक सुनने से इनकार किया।
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का याहवे
  rationale: व्यक्तिगत ईश्वरीय नाम को ‘याहवे’ के रूप में रखा गया है और צְבָאוֹת की व्यापक सैन्य तथा स्वर्गीय संगति को ‘सेनाओं’ से व्यक्त किया गया है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल का परमेश्वर
  rationale: सम्बन्धवाचक रचना और इस्राएल के साथ वाचागत पहचान को सीधे और स्वाभाविक हिन्दी में रखा गया है।
- source_word: הִנְנִי מבי
  choice: देखो, मैं ... लाने वाला हूँ
  rationale: הִנְנִי की गंभीर तत्क्षणता तथा causative בוא से व्यक्त आसन्न कार्य—विपत्ति को आने देना/लाना—दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: כָּל עָרֶיהָ
  choice: उसके सभी नगरों
  rationale: עָרִים छोटे-बड़े नगरों अथवा अधीन बस्तियों को सूचित कर सकता है; मुख्य पाठ व्यापक अर्थ रखता है और पादटिप्पणी वैकल्पिक अर्थ बताती है।
- source_word: כָּל הָרָעָה
  choice: वह सारी विपत्ति
  rationale: इस न्याय-संदर्भ में רָעָה नैतिक बुराई नहीं, बल्कि दंडस्वरूप आने वाली विपत्ति है।
- source_word: דִּבַּרְתִּי עָלֶיהָ
  choice: जिसकी घोषणा मैंने इसके विरुद्ध की थी
  rationale: ‘घोषणा’ भविष्यद्वाणी में पहले कहे गए न्याय को स्वाभाविक हिन्दी में व्यक्त करती है; स्त्रीलिंग एकवचन प्रत्यय का संदर्भ ‘इस नगर’ से है।
- source_word: הִקְשׁוּ אֶת עָרְפָּם
  choice: उन्होंने अपनी गर्दन अकड़ा ली है
  rationale: मूल शारीरिक रूपक को सुरक्षित रखते हुए हठीले प्रतिरोध का अर्थ हिन्दी में समझने योग्य रहता है।
- source_word: לְבִלְתִּי שְׁמוֹעַ אֶת דְּבָרָי
  choice: ताकि वे मेरे वचन न सुनें
  rationale: उद्देश्य/परिणाम की रचना को बनाए रखता है; ‘सुनना’ यहाँ ध्यान देने और आज्ञा मानने की अर्थछाया भी रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल में उपाधि नहीं बल्कि चतुरक्षरीय व्यक्तिगत नाम है; उसका लिप्यंतरण स्रोत की विशिष्टता को सुरक्षित रखता है।
- issue: יְהוָה צְבָאוֹת में צְבָאוֹת का दायरा
  choice: सेनाओं का याहवे
  alternative: सर्वशक्तिमान याहवे
  rationale: ‘सर्वशक्तिमान’ एक व्याख्यात्मक धार्मिक उपाधि बन जाती है, जबकि ‘सेनाओं’ मूल रूपक और उसके स्वर्गीय अथवा सांसारिक व्यापक दायरे को खुला रखता है।
- issue: רָעָה का नैतिक या न्यायिक अर्थ
  choice: विपत्ति
  alternative: बुराई
  rationale: यहाँ याहवे उस न्याय को नगर पर ला रहा है जिसकी पहले घोषणा हुई थी; अतः शब्द का प्रसंगगत अर्थ आपदा/विपत्ति है, नैतिक दुष्टता नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी का गंभीर भविष्यद्वाणी-संबंधी लहजा रखा गया है। वाक्य सामान्य पाठक के लिए सहज है, पर ‘गर्दन अकड़ा ली’ जैसे मूल रूपक को पादटिप्पणी सहित सुरक्षित रखा गया है। ‘मेरे वचन’ में ‘सुनना’ केवल ध्वनि ग्रहण करना नहीं, ध्यान देना और मानना भी सूचित करता है।
