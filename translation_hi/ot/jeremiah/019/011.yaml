  text: וְ/אָמַרְתָּ֨ אֲלֵי/הֶ֜ם כֹּה אָמַ֣ר יְהוָ֣ה צְבָא֗וֹת כָּ֣כָה אֶשְׁבֹּ֞ר אֶת הָ/עָ֤ם הַ/זֶּה֙ וְ/אֶת הָ/עִ֣יר הַ/זֹּ֔את כַּ/אֲשֶׁ֤ר יִשְׁבֹּר֙ אֶת כְּלִ֣י הַ/יּוֹצֵ֔ר אֲשֶׁ֛ר לֹֽא יוּכַ֥ל לְ/הֵרָפֵ֖ה ע֑וֹד וּ/בְ/תֹ֣פֶת יִקְבְּר֔וּ מֵ/אֵ֥ין מָק֖וֹם לִ/קְבּֽוֹר־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/011.yaml
  text: 'And you shall say to them[a], ‘Thus says Yahweh of hosts: In this way I will break this people and this city, as one breaks a potter’s vessel, which cannot be repaired again[b]; and in Topheth they will bury because there is no place else to bury.’'
translation:
  language: hi
  text: 'तुम उनसे कहना, ‘सेनाओं का याहवे यह कहता है: मैं इस प्रजा और इस नगर को इसी प्रकार तोड़ दूँगा, जैसे कोई कुम्हार के पात्र[a] को तोड़ देता है, जिसे फिर सुधारा नहीं जा सकता[b]। और वे तोपेत में दफ़न करेंगे, क्योंकि दफ़नाने के लिए और कहीं जगह नहीं होगी।’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कुम्हार के घड़े को।” हिब्रू में “कुम्हार का पात्र” है, जो “घड़े” से अधिक व्यापक शब्द है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ, “जिसे फिर चंगा नहीं किया जा सकता”; टूटे हुए मिट्टी के पात्र के संदर्भ में भाव है कि उसे फिर सुधारा नहीं जा सकता।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का याहवे
  rationale: व्यक्तिगत दिव्य नाम को ‘याहवे’ के रूप में रखा गया है; צְבָאוֹת को ‘सेनाओं’ कहना उसके सामूहिक सैन्य/स्वर्गीय बलों के व्यापक भाव को बनाए रखता है।
- source_word: כָּכָה
  choice: इसी प्रकार
  rationale: यह पहले आए כֹּה (‘यह कहता है’) से अलग है और पात्र तोड़ने के प्रतीकात्मक कार्य की ओर संकेत करता है।
- source_word: אֶשְׁבֹּר ... יִשְׁבֹּר
  choice: तोड़ दूँगा ... तोड़ देता है
  rationale: दोनों स्थानों पर एक ही मूल क्रिया का संबंध बनाए रखा गया है।
- source_word: הָעָם הַזֶּה
  choice: इस प्रजा
  rationale: ‘प्रजा’ संबोधित सामुदायिक समूह के लिए स्वाभाविक और गरिमापूर्ण हिन्दी है; इसे राजनीतिक अर्थ वाले ‘राष्ट्र’ तक सीमित नहीं किया गया।
- source_word: כְּלִי הַיּוֹצֵר
  choice: कुम्हार का पात्र
  rationale: כְּלִי व्यापक शब्द है; ‘पात्र’ उस व्यापकता को बचाता है, जबकि ‘घड़ा’ अनावश्यक रूप से विशिष्ट होता।
- source_word: לֹא יוּכַל לְהֵרָפֵה עוֹד
  choice: जिसे फिर सुधारा नहीं जा सकता
  rationale: רפא का शाब्दिक भाव ‘चंगा होना’ है, पर टूटे मिट्टी के पात्र के संदर्भ में ‘सुधारा’ स्वाभाविक हिन्दी है; עוֹד को ‘फिर’ से व्यक्त किया गया।
- source_word: וּבְתֹפֶת
  choice: और ... तोपेत में
  rationale: स्थान-नाम का लिप्यंतरण किया गया और ב को दफ़नाने के स्थान के रूप में ‘में’ से व्यक्त किया गया।
- source_word: יִקְבְּרוּ
  choice: वे ... शवों को दफ़नाएँगे
  rationale: हिब्रू की सक्रिय बहुवचन क्रिया सुरक्षित रखी गई है; हिन्दी में अर्थ स्पष्ट और स्वाभाविक बनाने के लिए निहित कर्म ‘शवों को’ जोड़ा गया है।
- source_word: מֵאֵין מָקוֹם לִקְבּוֹר
  choice: क्योंकि दफ़नाने के लिए और कहीं जगह नहीं होगी
  rationale: अभाव के कारण को स्पष्ट करता है और प्रसंगानुसार तोपेत के अतिरिक्त दफ़नाने की जगह न होने का भाव स्वाभाविक हिन्दी में देता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में उपाधि नहीं, चार-अक्षरी व्यक्तिगत नाम है; इसलिए उसे उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- issue: पात्र के फिर से ठीक न हो सकने का रूपक
  choice: जिसे फिर सुधारा नहीं जा सकता
  alternative: जो फिर चंगा नहीं किया जा सकता
  rationale: मूल की ‘चंगा होने’ वाली रूपकात्मक क्रिया को पादटिप्पणी में सुरक्षित रखते हुए मुख्य पाठ में मिट्टी के टूटे पात्र के लिए स्वाभाविक अभिव्यक्ति चुनी गई है; इससे लोगों और नगर के विनाश की कठोरता कम नहीं होती।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। भविष्यद्वाणी के औपचारिक सूत्र के लिए ‘सेनाओं का याहवे यह कहता है’ और प्रतीकात्मक समानता के लिए ‘इसी प्रकार’ रखा गया है। पादटिप्पणी [a] को उसके वास्तविक संबद्ध पद ‘पात्र’ पर लगाया गया है।
