id: JER.19.6
reference: Jeremiah 19:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לָ/כֵ֞ן הִנֵּֽה יָמִ֤ים בָּאִים֙ נְאֻם יְהוָ֔ה וְ/לֹא יִקָּרֵא֩ לַ/מָּק֨וֹם הַ/זֶּ֥ה ע֛וֹד הַ/תֹּ֖פֶת וְ/גֵ֣יא בֶן הִנֹּ֑ם כִּ֖י אִם גֵּ֥יא הַ/הֲרֵגָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/006.yaml
  text: Therefore, look, days are coming, declares the LORD, when this place will no longer be called Topheth and the Valley of Ben-hinnom, but the Valley of Slaughter.
translation:
  language: hi
  text: इसलिए देखो, ऐसे दिन आ रहे हैं—यह यहोवा की घोषणा है—जब इस स्थान को फिर न तो तोपेत कहा जाएगा, न बेन-हिन्नोम की घाटी, बल्कि वध की घाटी कहा जाएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: पूर्ववर्ती न्याय-वचन के परिणाम को स्पष्ट रूप से व्यक्त करता है।
- source_word: הִנֵּה
  choice: देखो
  rationale: आगामी घोषणा की ओर श्रोता का ध्यान खींचने वाले हिब्रू उद्गार को बनाए रखता है।
- source_word: נְאֻם יְהוָה
  choice: यह यहोवा की घोषणा है
  rationale: नबी-वाणी के प्रामाणिक सूत्र को स्वाभाविक और औपचारिक हिन्दी में प्रस्तुत करता है तथा दिव्य नाम को नाम के रूप में रखता है।
- source_word: הַתֹּפֶת
  choice: तोपेत
  rationale: स्थान-नाम का लिप्यंतरण किया गया है।
- source_word: גֵיא בֶן הִנֹּם
  choice: बेन-हिन्नोम की घाटी
  rationale: स्थान-नाम की संरचना और पहचान को सुरक्षित रखने वाला लिप्यंतरण है।
- source_word: גֵיא הַהֲרֵגָה
  choice: वध की घाटी
  rationale: הֲרֵגָה सामूहिक मार-काट अथवा वध को दर्शाता है; संक्षिप्त स्थान-नाम के रूप में 'वध' उपयुक्त है।
theological_decisions:
- issue: יהוה का प्रतिपादन
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में विशिष्ट दिव्य नाम है; 'यहोवा' उसे सामान्य उपाधि में बदलने के बजाय नाम के रूप में व्यक्त करता है।
- issue: दो पुराने नामों के बीच संबंध
  choice: न तो तोपेत... न बेन-हिन्नोम की घाटी
  alternative: तोपेत और बेन-हिन्नोम की घाटी नहीं
  rationale: हिब्रू וְלֹא के साथ जुड़े दोनों नाम उसी स्थान के वैकल्पिक नाम हैं; हिन्दी में 'न तो... न...' निषेध की व्याप्ति को स्पष्ट और स्वाभाविक बनाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भविष्यद्वाणी की गंभीरता और घोषणात्मक लय बनाए रखते हुए वाक्य को सामान्य पाठकों के लिए स्पष्ट रखा गया है।
