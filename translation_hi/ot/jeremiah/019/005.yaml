reference: Jeremiah 19:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/בָנ֞וּ אֶת בָּמ֣וֹת הַ/בַּ֗עַל לִ/שְׂרֹ֧ף אֶת בְּנֵי/הֶ֛ם בָּ/אֵ֖שׁ עֹל֣וֹת לַ/בָּ֑עַל אֲשֶׁ֤ר לֹֽא צִוִּ֨יתִי֙ וְ/לֹ֣א דִבַּ֔רְתִּי וְ/לֹ֥א עָלְתָ֖ה עַל לִבִּֽ/י־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/005.yaml
  text: They have built the high places of Baal to burn their sons in the fire as burnt offerings to Baal—something I did not command or speak[a], nor did it arise in my heart.
translation:
  language: hi
  text: उन्होंने बाल के ऊँचे पूजा-स्थल बनाए हैं, ताकि वे अपने पुत्रों को बाल के लिए होमबलियों के रूप में आग में जलाएँ—ऐसा करने की आज्ञा मैंने नहीं दी, न इसके विषय में कहा[a], और न यह बात मेरे हृदय में उठी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “न मैंने ऐसा कहा।” इब्रानी में क्रिया का सामान्य अर्थ “बोलना/कहना” है; प्रसंग के कारण “इसके विषय में” अर्थ निहित समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָנוּ
  choice: उन्होंने ... बनाए हैं
  rationale: कालगत पूर्णता और वर्तमान अभियोग, दोनों को व्यक्त करने के लिए पूर्ण वर्तमान का प्रयोग किया गया है।
- source_word: בָּמוֹת
  choice: पूजा-स्थल
  rationale: यहाँ शब्द बाल की उपासना से जुड़े ऊँचे धार्मिक स्थलों को दर्शाता है; सामान्य पाठक के लिए स्वाभाविक हिन्दी में इसका सांप्रदायिक अर्थ स्पष्ट किया गया है।
- source_word: הַבַּעַל / לַבָּעַל
  choice: बाल / बाल के लिए
  rationale: इब्रानी में यह कनानी देवता का नाम है; हिन्दी में प्रचलित लिप्यंतरण रखा गया है।
- source_word: לִשְׂרֹף
  choice: आग में जलाकर
  rationale: उद्देश्यसूचक infinitive और अग्नि में जलाने की क्रिया को स्वाभाविक हिन्दी में संयुक्त रूप से व्यक्त करता है।
- source_word: בְּנֵיהֶם
  choice: अपने पुत्रों
  rationale: मूल शब्द विशेष रूप से 'पुत्रों' को दर्शाता है, इसलिए व्यापक 'बच्चों' का प्रयोग नहीं किया गया।
- source_word: עֹלוֹת
  choice: होमबलि
  rationale: यह पूर्णतः जलाई जाने वाली बलि के लिए तकनीकी बलिदानी शब्द है; 'होमबलि' हिन्दी बाइबलीय प्रयोग में सटीक और संक्षिप्त है।
- source_word: אֲשֶׁר לֹא צִוִּיתִי
  choice: ऐसा करने की आज्ञा मैंने नहीं दी
  rationale: सम्बन्धवाचक वाक्यांश को पूरी वर्णित प्रथा से जोड़ते हुए हिन्दी में स्पष्ट किया गया है।
- source_word: וְלֹא דִבַּרְתִּי
  choice: न इसके विषय में कहा
  rationale: मूल का सामान्य 'कहा/बोला' अर्थ सुरक्षित रखते हुए यह स्पष्ट करता है कि इसी कृत्य के विषय में बात है; इसे 'आज्ञा दी' में विलीन नहीं किया गया।
- source_word: וְלֹא עָלְתָה עַל לִבִּי
  choice: और न यह बात मेरे हृदय में उठी
  rationale: इब्रानी के 'हृदय पर चढ़ना/उठना' रूपक को स्वाभाविक हिन्दी में रखते हुए 'हृदय' की भावात्मक और मानवाकार भाषा सुरक्षित रखी गई है।
theological_decisions:
- issue: परमेश्वर के भीतरी भाव के लिए मानवाकार अभिव्यक्ति
  choice: न यह बात मेरे हृदय में उठी
  alternative: न यह बात मेरे मन में आई
  rationale: '''हृदय'' को ''मन'' बनाकर इसे केवल ज्ञान या विचार का कथन नहीं बनाया गया; मूल की भावात्मक तथा धर्मवैचारिक तन्यता सुरक्षित रखी गई है।'
- issue: आज्ञा देने और बोलने के बीच समानांतर निषेध
  choice: आज्ञा मैंने नहीं दी, न इसके विषय में कहा
  alternative: न मैंने इसकी आज्ञा दी, न इसका उल्लेख किया
  rationale: दोनों इब्रानी क्रियाओं का भेद रखा गया है और 'उल्लेख' जैसी अधिक विशिष्ट व्याख्या से बचा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-अनुकूल रूप। 'पूजा-स्थल' से बामोत का धार्मिक आशय स्पष्ट होता है; 'होमबलि' तकनीकी बलिदानी अर्थ बनाए रखता है। वाक्य की तीव्र निन्दात्मक लय और तीन क्रमिक निषेध सुरक्षित रखे गए हैं।
