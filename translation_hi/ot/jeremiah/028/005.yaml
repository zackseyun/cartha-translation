source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ יִרְמְיָ֣ה הַ/נָּבִ֔יא אֶל חֲנַנְיָ֖ה הַ/נָּבִ֑יא לְ/עֵינֵ֤י הַ/כֹּֽהֲנִים֙ וּ/לְ/עֵינֵ֣י כָל הָ/עָ֔ם הָ/עֹמְדִ֖ים בְּ/בֵ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/005.yaml
  text: Then Jeremiah the prophet said to Hananiah the prophet in the sight of the priests and in the sight of all the people who were standing in the house of Yahweh:[a][b]
translation:
  language: hi
  text: तब यिर्मयाह भविष्यद्वक्ता ने हनन्याह भविष्यद्वक्ता से याजकों के सामने और सभी लोगों के सामने, जो याहवे के भवन में खड़े थे, कहा:[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘याजकों के देखते हुए और सभी लोगों के देखते हुए।’
    reason: ‘के सामने’ वाला इब्रानी मुहावरा शाब्दिक रूप से ‘की आँखों के सामने’ है और सार्वजनिक रूप से देखे जाने का भाव रखता है।
  - marker: b
    text: ‘याहवे का भवन’ अर्थात् मन्दिर।
    reason: प्राचीन इस्राएली प्रयोग में यह पद यरूशलेम के मन्दिर को सूचित करता है।
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में घटनाक्रम का क्रम स्पष्ट करता है।
- source_word: יִרְמְיָה הַנָּבִיא
  choice: यिर्मयाह भविष्यद्वक्ता
  rationale: व्यक्तिनाम का प्रचलित हिन्दी रूप और נָבִיא के पदनाम को स्पष्ट रूप से रखा गया है।
- source_word: חֲנַנְיָה הַנָּבִיא
  choice: हनन्याह भविष्यद्वक्ता
  rationale: इब्रानी नाम का निकट लिप्यंतरण किया गया है और मूल की तरह उसके साथ भी ‘भविष्यद्वक्ता’ दोहराया गया है।
- source_word: לְעֵינֵי ... וּלְעֵינֵי
  choice: '... के सामने और ... के सामने'
  rationale: मुहावरे का अर्थ सार्वजनिक उपस्थिति में है; मूल में वाक्यांश की पुनरावृत्ति को हिन्दी में भी बनाए रखा गया है।
- source_word: הַכֹּהֲנִים
  choice: याजकों
  rationale: निश्चित बहुवचन का सहज और प्रचलित हिन्दी समतुल्य।
- source_word: כָל הָעָם
  choice: उन सभी लोगों
  rationale: यहाँ עָם उपस्थित समुदाय के लोगों को सूचित करता है; ‘सभी लोगों’ उसका स्वाभाविक हिन्दी रूप है।
- source_word: הָעֹמְדִים
  choice: जो ... खड़े थे
  rationale: कृदंत उस समय वहाँ खड़े लोगों का वर्णन करता है; हिन्दी में संबंधवाचक उपवाक्य स्वाभाविक है।
- source_word: בְּבֵית יְהוָה
  choice: याहवे के भवन में
  rationale: בַּיִת का मूल बिंब ‘भवन/घर’ सुरक्षित रखा गया है, जबकि संदर्भ में यह मन्दिर है; יְהוָה को व्यक्तिगत दिव्य नाम के रूप में लिप्यंतरित किया गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत दिव्य नाम है। ‘याहवे’ उसका व्यापक रूप से स्वीकार किया गया ध्वन्यात्मक लिप्यंतरण है और उसे केवल उपाधि ‘प्रभु’ में नहीं बदलता।
- issue: हनन्याह के लिए הַנָּבִיא पदनाम
  choice: हनन्याह भविष्यद्वक्ता
  alternative: हनन्याह, जो भविष्यद्वक्ता कहलाता था
  rationale: पद में यिर्मयाह और हनन्याह दोनों को समान व्याकरणिक पदनाम दिया गया है। पाठ यहाँ हनन्याह के दावे पर व्याख्यात्मक निर्णय नहीं सुनाता, इसलिए मूल की तनावपूर्ण समानता सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। दोनों व्यक्तियों के साथ ‘भविष्यद्वक्ता’ तथा ‘के सामने’ की पुनरावृत्ति मूल की अलंकारिक समानता और सार्वजनिक प्रसंग को सुरक्षित रखती है।
