id: JER.28.15
reference: Jeremiah 28:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יִרְמְיָ֧ה הַ/נָּבִ֛יא אֶל חֲנַנְיָ֥ה הַ/נָּבִ֖יא שְׁמַֽע נָ֣א חֲנַנְיָ֑ה לֹֽא שְׁלָחֲ/ךָ֣ יְהוָ֔ה וְ/אַתָּ֗ה הִבְטַ֛חְתָּ אֶת הָ/עָ֥ם הַ/זֶּ֖ה עַל שָֽׁקֶר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/015.yaml
  text: 'Then Jeremiah the prophet said to Hananiah the prophet[a], “Listen, please, Hananiah: Yahweh has not sent you[b], and you have made this people trust in a lie.”'
translation:
  language: hi
  text: तब यिर्मयाह नबी ने हनन्याह नबी से कहा, “हनन्याह, कृपया सुनो! याहवे ने तुम्हें नहीं भेजा है[a], और तुमने इस प्रजा को झूठ पर भरोसा कराया है[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे ने तुम्हें नहीं भेजा।”
    reason: हिब्रू पूर्ण क्रिया को हिन्दी में सामान्य भूतकाल या वर्तमान-परिणाम वाले रूप, दोनों से व्यक्त किया जा सकता है।
  - marker: b
    text: अर्थात, “तुमने इस प्रजा से झूठ पर भरोसा करवाया है।”
    reason: मूल क्रिया कारणवाचक है; यह वैकल्पिक शब्दावली उस कारणवाचक बल को अधिक स्पष्ट करती है।
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने ... कहा
  rationale: वाव-क्रमसूचक रूप कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הַנָּבִיא
  choice: नबी
  rationale: यिर्मयाह और हनन्याह दोनों के साथ उपाधि रखी गई है, जिससे मूल पाठ की समानांतर पहचान और हनन्याह के नबी होने के दावे से उत्पन्न तनाव बना रहता है।
- source_word: שְׁמַע נָא
  choice: कृपया सुनो
  rationale: आज्ञार्थक क्रिया के साथ נָא आग्रह को कुछ नरम बनाता है; ‘कृपया सुनो’ आदेश और विनम्र आग्रह दोनों को सहज हिन्दी में रखता है।
- source_word: לֹא שְׁלָחֲךָ יְהוָה
  choice: याहवे ने तुम्हें नहीं भेजा है
  rationale: हिब्रू पूर्ण क्रिया को वर्तमान आरोप से जुड़े परिणाम के साथ व्यक्त किया गया है; साधारण भूतकाल भी सम्भव है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ के विशिष्ट ईश्वरीय नाम को पदवी से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: הִבְטַחְתָּ
  choice: तुमने ... भरोसा कराया है
  rationale: בטח का हिफ़ील रूप कारणवाचक है; यह अनुवाद इस बात को रखता है कि हनन्याह ने प्रजा को भरोसा करने की ओर लगाया, केवल उसे ढाढ़स नहीं बँधाया।
- source_word: הָעָם הַזֶּה
  choice: इस प्रजा
  rationale: एकवचन सामूहिक संज्ञा और संकेतवाचक का भाव रखा गया है; ‘प्रजा’ भविष्यद्वक्ताओं की वाणी के अनुरूप और आधुनिक हिन्दी में बोधगम्य है।
- source_word: עַל שָׁקֶר
  choice: झूठ पर
  rationale: עַל भरोसे के आधार या विषय को दर्शाता है और שָׁקֶר का ठोस एकवचन अर्थ ‘झूठ’ बना रहता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पद में चार अक्षरों वाला विशिष्ट नाम सीधे आया है। ‘याहवे’ उसे नाम के रूप में सुरक्षित रखता है और उसे किसी पदवी या भिन्न पारंपरिक उच्चारण में नहीं बदलता।
- issue: हनन्याह के लिए ‘नबी’ पदवी
  choice: उपाधि को बिना व्याख्यात्मक विशेषण के रखा गया
  alternative: ‘झूठा नबी’
  rationale: इस पद में मूल पाठ हनन्याह को הַנָּבִיא कहता है, जबकि यिर्मयाह उसके भेजे जाने का खंडन करता है। ‘झूठा’ जोड़ने से मूल पाठ का तनाव समय से पहले सुलझ जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक ढंग अपनाया गया है। ‘नबी’, ‘प्रजा’ और ‘याहवे’ बाइबलीय संदर्भ के परिचित शब्द हैं; वाक्यरचना बोलचाल योग्य रखते हुए मूल के आरोपात्मक बल और धार्मिक तनाव को सुरक्षित रखती है।
