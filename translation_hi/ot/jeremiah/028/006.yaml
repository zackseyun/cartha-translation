source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ יִרְמְיָ֣ה הַ/נָּבִ֔יא אָמֵ֕ן כֵּ֖ן יַעֲשֶׂ֣ה יְהוָ֑ה יָקֵ֤ם יְהוָה֙ אֶת דְּבָרֶ֔י/ךָ אֲשֶׁ֣ר נִבֵּ֗אתָ לְ/הָשִׁ֞יב כְּלֵ֤י בֵית יְהוָה֙ וְ/כָל הַ/גּוֹלָ֔ה מִ/בָּבֶ֖ל אֶל הַ/מָּק֥וֹם הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/006.yaml
  text: Then Jeremiah the prophet said[a], “Amen! May Yahweh do so; may Yahweh fulfill your words that you have prophesied, to bring back the vessels of the house of Yahweh and all the exiles from Babylon to this place.”
translation:
  language: hi
  text: तब यिर्मयाह नबी ने कहा, “आमीन! याहवे ऐसा ही करे। याहवे तुम्हारे उन वचनों को पूरा करे[a] जिनकी तुमने भविष्यवाणी की है कि वह याहवे के भवन के पात्रों और सभी निर्वासितों को बाबेल से इस स्थान पर वापस ले आए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारे वचनों को दृढ़ करे” अथवा “स्थापित करे।” इब्रानी क्रिया का अर्थ वचनों को स्थिर करना, अर्थात उन्हें घटित करना, भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמֵן
  choice: आमीन
  rationale: हिन्दी में परिचित बाइबलीय और प्रार्थनात्मक उद्गार; यहाँ सहमति के साथ इच्छा की भावना भी बनाए रखता है।
- source_word: כֵּן יַעֲשֶׂה
  choice: ऐसा ही करे
  rationale: अपूर्ण क्रिया का यहाँ इच्छार्थक बल है; यह भविष्य की निश्चित घोषणा नहीं, बल्कि हनन्याह की बात पूरी होने की कामना है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत वाचा-नाम को लिप्यंतरित किया गया है।
- source_word: יָקֵם
  choice: पूरा करे
  rationale: हिफ़िल रूप का भाव वचनों को ‘स्थिर करना,’ अर्थात उन्हें घटित या सिद्ध करना है; ‘पूरा करे’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: דְּבָרֶיךָ
  choice: तुम्हारे उन वचनों
  rationale: बहुवचन और संबोधित पुरुष को बनाए रखता है; ‘उन’ आगे आने वाले संबंधवाचक उपवाक्य से स्वाभाविक रूप से जोड़ता है।
- source_word: נִבֵּאתָ
  choice: भविष्यवाणी तुमने ... की है
  rationale: हनन्याह द्वारा अभी पहले कही गई भविष्यवाणी को वर्तमान संवाद से जुड़े पूर्ण कार्य के रूप में व्यक्त करता है।
- source_word: לְהָשִׁיב
  choice: वापस लाने
  rationale: कारक रूप मंदिर के पात्रों और निर्वासित लोगों—दोनों को लौटाकर लाने का अर्थ स्पष्ट करता है।
- source_word: כְּלֵי בֵית יְהוָה
  choice: याहवे के भवन के पात्रों
  rationale: ‘भवन’ मंदिर के लिए प्रयुक्त मूल इब्रानी पद को बनाए रखता है और ‘पात्र’ पवित्र उपयोग की वस्तुओं के लिए सटीक है।
- source_word: כָל הַגּוֹלָה
  choice: सभी निर्वासितों
  rationale: इब्रानी सामूहिक एकवचन को स्वाभाविक हिन्दी बहुवचन में व्यक्त करता है।
- source_word: מִבָּבֶל אֶל הַמָּקוֹם הַזֶּה
  choice: बाबेल से इस स्थान पर
  rationale: भौगोलिक गति और वक्ता के स्थान-सूचक संकेत को बिना अनावश्यक रूप से ‘यरूशलेम’ जोड़ने के सुरक्षित रखता है।
theological_decisions:
- issue: यिर्मयाह के उत्तर का बल
  choice: 'सच्ची इच्छा या प्रार्थना: ‘ऐसा ही करे ... पूरा करे’'
  alternative: 'निश्चित भविष्यवाणी: ‘ऐसा ही करेगा ... पूरा करेगा’'
  rationale: ‘आमीन’ के बाद प्रयुक्त अपूर्ण क्रियारूप इच्छार्थक समझे जा सकते हैं। यह अनुकूल भविष्यवाणी के सच होने की यिर्मयाह की इच्छा को व्यक्त करता है, पर उसे सत्य घोषित नहीं करता; इस प्रकार कथानक का तनाव बना रहता है।
- issue: יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में वाचा-नाम सीधे प्रयुक्त हुआ है; उसका लिप्यंतरण स्रोत की विशिष्टता को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘नबी,’ ‘आमीन,’ ‘याहवे,’ और ‘निर्वासित’ जैसे परिचित बाइबलीय शब्द बनाए गए हैं। लंबी इब्रानी रचना को हिन्दी में संबंधवाचक उपवाक्य के रूप में व्यवस्थित किया गया है, पर उसका अर्थ और कथात्मक तनाव सुरक्षित है।
