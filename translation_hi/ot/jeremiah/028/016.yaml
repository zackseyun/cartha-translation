  text: לָ/כֵ֗ן כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִי֙ מְשַֽׁלֵּֽחֲ/ךָ֔ מֵ/עַ֖ל פְּנֵ֣י הָ/אֲדָמָ֑ה הַ/שָּׁנָה֙ אַתָּ֣ה מֵ֔ת כִּֽי סָרָ֥ה דִבַּ֖רְתָּ אֶל יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/016.yaml
  text: 'Therefore[a], this is what Yahweh says: Look, I am sending you away from the face of the earth. This year you will die[b], because you have spoken rebellion against Yahweh.'
translation:
  language: hi
  text: 'इसलिए याहवे यह कहता है: ‘देख, मैं तुझे धरती के ऊपर से हटा रहा हूँ।[a] इसी वर्ष तू मर जाएगा, क्योंकि तूने याहवे के विरुद्ध विद्रोह की बात कही है[b]।’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, “धरती के मुख के ऊपर से दूर भेज रहा हूँ।” यह हिब्रू मुहावरा जीवितों के बीच से हटा दिए जाने को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद “क्योंकि तूने याहवे के विरुद्ध धर्मत्याग/अवज्ञा की बात कही है” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय उसका प्रचलित हिन्दी लिप्यंतरण रखा गया है।
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले कथन से निकलने वाले दंडात्मक निष्कर्ष को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: כֹּה אָמַר
  choice: यह कहता है
  rationale: भविष्यद्वक्ता के संदेश-सूत्र का वर्तमानकालिक और सहज हिन्दी रूप है।
- source_word: הִנְנִי
  choice: देख
  rationale: यह आगामी ईश्वरीय कार्रवाई पर ध्यान खींचने वाला बलाघात सुरक्षित रखता है।
- source_word: מְשַׁלֵּחֲךָ
  choice: मैं तुझे ... हटा देने वाला हूँ
  rationale: संदर्भ में क्रिया दंडस्वरूप जीवितों के बीच से हटाए जाने को व्यक्त करती है; यह अनुवाद आगामी मृत्यु को अनावश्यक रूप से पहले ही सीधे नहीं कहता।
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: धरती पर से
  rationale: हिब्रू मुहावरे की स्थानिक छवि को स्वाभाविक हिन्दी में बनाए रखता है; अगला वाक्य स्पष्ट करता है कि आशय मृत्यु है, केवल देश-निकाला नहीं।
- source_word: הַשָּׁנָה אַתָּה מֵת
  choice: इसी वर्ष तू मर जाएगा
  rationale: इसी वर्ष निकटता और निश्चितता पर बल देता है; सन्दर्भ में मֵת भावी मृत्यु की भविष्यवाणी करता है।
- source_word: סָרָה דִבַּרְתָּ אֶל יְהוָה
  choice: तूने याहवे के विरुद्ध विद्रोह की बात कही है
  rationale: यह असामान्य हिब्रू अभिव्यक्ति को अत्यधिक व्याख्यायित किए बिना उसके कथन और विरोध—दोनों पक्षों को सुरक्षित रखता है।
theological_decisions:
- issue: धरती पर से हटाए जाने का आशय
  choice: मृत्युदंड, जिसकी व्याख्या अगला वाक्य ‘इसी वर्ष तू मर जाएगा’ करता है
  alternative: देश या भूमि से निर्वासन
  rationale: निकटवर्ती स्पष्ट मृत्यु-घोषणा बताती है कि यह जीवितों के बीच से हटाए जाने का मुहावरा है; फिर भी मुख्य पाठ मूल स्थानिक छवि बनाए रखता है।
- issue: סָרָה का अर्थ
  choice: विद्रोह
  alternative: धर्मत्याग अथवा अवज्ञा
  rationale: ‘विद्रोह’ ईश्वरीय अधिकार के विरुद्ध बोलने का अर्थ व्यक्त करता है, पर बाद की किसी तकनीकी धर्मवैज्ञानिक धारणा को आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; गंभीर और भविष्यद्वाणी-संगत शैली। संबोधन में एकवचन ‘तू/तुझे’ मूल के प्रत्यक्ष, कठोर दंड-वचन को बनाए रखता है। मुख्य पाठ स्वाभाविक है, जबकि पादटिप्पणियाँ हिब्रू की अधिक शाब्दिक छवि और סָרָה की अर्थ-सीमा देती हैं।
