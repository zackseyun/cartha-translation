reference: Jeremiah 28:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הַ/נָּבִ֕יא אֲשֶׁ֥ר יִנָּבֵ֖א לְ/שָׁל֑וֹם בְּ/בֹא֙ דְּבַ֣ר הַ/נָּבִ֗יא יִוָּדַע֙ הַ/נָּבִ֔יא אֲשֶׁר שְׁלָח֥/וֹ יְהוָ֖ה בֶּ/אֱמֶֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/009.yaml
  text: As for the prophet who prophesies peace[a], when the word of that prophet comes to pass[c][b], then that prophet will be known as one whom Yahweh has truly sent.
translation:
  language: hi
  text: जो भविष्यद्वक्ता शांति[a] की भविष्यवाणी करता है, उस भविष्यद्वक्ता का वचन जब पूरा होगा[b], तब यह जाना जाएगा कि यहोवा ने उस भविष्यद्वक्ता को सचमुच भेजा है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कुशलता” अथवा “समृद्धि।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उस भविष्यद्वक्ता का वचन जब आएगा”; आशय है कि उसका संदेश घटित होगा।
    reason: lexical_alternative
  - marker: c
    text: या, “जिसे यहोवा ने सत्य में भेजा है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנָּבִיא
  choice: भविष्यद्वक्ता / उस भविष्यद्वक्ता
  rationale: निश्चित उपपद को ध्यान में रखते हुए पहले सामान्य कथन में ‘जो भविष्यद्वक्ता’ और बाद में उसी व्यक्ति के लिए ‘उस भविष्यद्वक्ता’ स्वाभाविक हिन्दी है।
- source_word: יִנָּבֵא
  choice: भविष्यवाणी करता है
  rationale: यह नबा धातु का मानक भविष्यद्वाणी-संबंधी प्रयोग है; ‘भविष्यवाणी करना’ आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: לְשָׁלוֹם
  choice: शान्ति
  rationale: שָׁלוֹם का अर्थ शान्ति के साथ कुशलता और समृद्धि भी हो सकता है; मुख्य पाठ में पारंपरिक और प्रसंगानुकूल ‘शान्ति’ रखा गया है तथा व्यापक अर्थ पादटिप्पणी में दिया गया है।
- source_word: בְּבֹא דְּבַר הַנָּבִיא
  choice: उस भविष्यद्वक्ता का वचन जब पूरा होगा
  rationale: शाब्दिक अर्थ ‘वचन के आने पर’ है, पर प्रसंग में आने का आशय भविष्यवाणी का घटित या पूरा होना है।
- source_word: יִוָּדַע
  choice: यह जाना जाएगा
  rationale: निफ़अल का निष्क्रिय अर्थ सुरक्षित रहता है और भविष्यद्वक्ता की प्रामाणिकता के प्रकट होने को व्यक्त करता है।
- source_word: שְׁלָחוֹ יְהוָה
  choice: यहोवा ने उस भविष्यद्वक्ता को भेजा है
  rationale: इब्रानी संबंधवाचक संरचना को स्वाभाविक हिन्दी में स्पष्ट किया गया है और יהוה को उसके प्रचलित हिन्दी नाम-रूप ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: בֶּאֱמֶת
  choice: सचमुच
  rationale: यहाँ यह शब्द भेजे जाने की वास्तविकता या प्रामाणिकता बताता है; ‘सचमुच’ आधुनिक हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: सच्चे भविष्यद्वक्ता की पहचान का मानदण्ड
  choice: शान्ति की भविष्यवाणी पूरी होने पर ही यह जाना जाएगा कि उसे सचमुच यहोवा ने भेजा है।
  alternative: 'अधिक शब्दशः: ‘वचन के आने पर वह भविष्यद्वक्ता जाना जाएगा, जिसे यहोवा ने सत्य में भेजा।’'
  rationale: इब्रानी वाक्य भविष्यद्वाणी के पूरा होने और भविष्यद्वक्ता की प्रामाणिकता पहचाने जाने के बीच प्रमाणात्मक संबंध रखता है। ‘तभी’ इस संबंध को स्पष्ट करता है, पर पाठ से आगे कोई अतिरिक्त सिद्धान्त नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध। ‘भविष्यद्वक्ता’ और ‘वचन’ बाइबलीय प्रसंग के परिचित शब्द हैं। मुख्य पाठ में दोनों पादटिप्पणी-चिह्न [a] और [b] सम्मिलित हैं।
