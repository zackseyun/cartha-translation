base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/013.yaml
  text: 'Go and say to Hananiah, saying, ‘Thus says the LORD: You have broken wooden yoke-bars, but you have made iron yoke-bars in their place.’'
translation:
  language: hi
  text: 'जा और हनन्याह से कह: “यहोवा[a] यों कहता है: तूने लकड़ी के जुए की छड़ें तोड़ दी हैं, और उनकी जगह लोहे के जुए की छड़ें बना दी हैं।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में यहाँ परमेश्वर का व्यक्तिगत नाम יהוה (YHWH) है।
    reason: मुख्य पाठ में प्रयुक्त ‘यहोवा’ के मूल-भाषायी आधार को स्पष्ट करना।
lexical_decisions:
- source_word: הָלוֹךְ וְאָמַרְתָּ ... לֵאמֹר
  choice: जाकर ... यह कह
  rationale: इब्रानी आज्ञार्थक अभिव्यक्ति और לֵאמֹר का आशय स्वाभाविक आधुनिक हिन्दी में रखा गया है, बिना अनावश्यक रूप से ‘कहते हुए’ दोहराए।
- source_word: מוֹטֹת עֵץ
  choice: लकड़ी के जुए
  rationale: מוֹטֹת यहाँ जुए की पट्टियों/डंडों को सूचित करता है। हिन्दी में ‘लकड़ी के जुए’ प्रसंग की छवि स्पष्ट और सहज रखता है।
- source_word: מֹטוֹת בַּרְזֶל
  choice: लोहे के जुए
  rationale: पहले पदबंध के समानांतरता और लकड़ी से लोहे की ओर बढ़ी कठोरता को स्पष्ट रखा गया है।
- source_word: וְעָשִׂיתָ
  choice: बना दिए हैं
  rationale: द्वितीय पुरुष एकवचन क्रिया को सीधे हनन्याह के कार्य/परिणाम के रूप में व्यक्त करता है; कारणता से आगे कोई अतिरिक्त व्याख्या नहीं जोड़ी गई।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ के व्यक्तिगत ईश्वरीय नाम को मुख्य पाठ में स्पष्ट रखा गया है; फुटनोट पाठक को मूल नाम से अवगत कराता है।
- issue: लकड़ी के जुओं के स्थान पर लोहे के जुए बनाने में कर्ता
  choice: तूने ... बना दिए हैं
  alternative: उनकी जगह लोहे के जुए बनेंगे
  rationale: इब्रानी व्याकरण हनन्याह को ही संबोधित करके द्वितीय पुरुष क्रिया प्रयोग करता है। भविष्यसूचक निहितार्थ को निष्क्रिय या भविष्यकालीन बनाकर नहीं बदला गया।
translation_notes:
  register: भाषा आधुनिक, सीधी और भविष्यद्वक्तापरक गरिमा वाली है। हनन्याह के लिए ‘तू’ मूल के द्वितीय पुरुष एकवचन और कठोर प्रत्यक्ष संबोधन को बनाए रखता है।
