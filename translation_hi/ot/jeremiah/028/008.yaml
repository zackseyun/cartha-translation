base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/008.yaml
  text: The prophets who were before me and before you from ancient times prophesied against many lands and against great kingdoms[b][a], of war and disaster and plague.
translation:
  language: hi
  text: जो भविष्यद्वक्ता मुझसे और तुमसे पहले, प्राचीन काल से, हुए थे[a], उन्होंने बहुत से देशों और बड़े राज्यों के विरुद्ध[c] युद्ध, विपत्ति और महामारी[b] की भविष्यवाणी की थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बहुत पुराने समय से।” यहाँ इब्रानी पद का अर्थ सुदूर अतीत है, अनिवार्यतः अनन्त काल नहीं।
    reason: lexical_alternative
  - marker: b
    text: या, “मारी।”
    reason: lexical_alternative
  - marker: c
    text: या, “बहुत से देशों और बड़े राज्यों के विषय में।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּבִיאִים
  choice: भविष्यद्वक्ता
  rationale: निश्चित बहुवचन संज्ञा का मानक और स्वाभाविक हिन्दी रूप।
- source_word: אֲשֶׁר הָיוּ לְפָנַי וּלְפָנֶיךָ
  choice: जो ... मुझसे और तुमसे पहले हुए थे
  rationale: यहाँ לְפָנַי और לְפָנֶיךָ स्थान नहीं, समय में पूर्वता व्यक्त करते हैं।
- source_word: מִן הָעוֹלָם
  choice: प्राचीन काल से
  rationale: इस प्रसंग में עוֹלָם बहुत पुराने बीते समय को सूचित करता है, अनिवार्यतः अनन्तता को नहीं।
- source_word: וַיִּנָּבְאוּ
  choice: भविष्यवाणी की थी
  rationale: नבא का भविष्यद्वक्ताई प्रसंग में स्वाभाविक हिन्दी अनुवाद; भूतकाल की पूर्ववर्ती कार्रवाई भी स्पष्ट होती है।
- source_word: אֶל אֲרָצוֹת רַבּוֹת וְעַל מַמְלָכוֹת גְּדֹלוֹת
  choice: बहुत-से देशों और बड़े-बड़े राज्यों के विरुद्ध
  rationale: आगे आने वाले युद्ध, विपत्ति और महामारी के न्याय-संदेश के कारण विरोधात्मक अर्थ प्रसंगानुकूल है; फिर भी पूर्वसर्गों की व्यापक अर्थ-सम्भावना पादटिप्पणी में रखी गई है।
- source_word: לְמִלְחָמָה
  choice: युद्ध
  rationale: לְ यहाँ भविष्यवाणी की विषयवस्तु बताता है; हिन्दी वाक्य में बिना अतिरिक्त परसर्ग के यह स्वाभाविक है।
- source_word: וּלְרָעָה
  choice: विपत्ति
  rationale: न्याय के इस प्रसंग में רָעָה नैतिक बुराई के बजाय अनिष्ट या विपत्ति को दर्शाता है।
- source_word: וּלְדָבֶר
  choice: महामारी
  rationale: דֶּבֶר घातक संक्रामक रोग या मरी को सूचित करता है; आधुनिक सामान्य हिन्दी में ‘महामारी’ स्पष्ट है।
theological_decisions:
- issue: न्याय-सन्देश में भविष्यवाणी के लक्ष्य को बताने वाले पूर्वसर्ग
  choice: देशों और राज्यों ‘के विरुद्ध’ भविष्यवाणी
  alternative: देशों और राज्यों ‘के विषय में’ भविष्यवाणी
  rationale: युद्ध, विपत्ति और महामारी की त्रयी तथा हनन्याह के आशावादी सन्देश से विरोध का प्रसंग न्यायसूचक अर्थ का समर्थन करता है, पर भाषिक विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। ‘बड़े-बड़े राज्यों’ से गहन बहुवचन का स्वाभाविक हिन्दी भाव आता है; ‘विपत्ति’ और ‘महामारी’ सामान्य पाठक के लिए स्पष्ट हैं।
