base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/003.yaml
  text: Within two years[a], I will bring back to this place all the vessels of the house of Yahweh[d][c][b], which Nebuchadnezzar king of Babylon took from this place and brought to Babylon.
translation:
  language: hi
  text: “दो वर्ष के भीतर[a] मैं याहवे के भवन के वे सभी पात्र[b] इस स्थान पर वापस ले आऊँगा जिन्हें बाबेल का राजा नबूकदनेस्सर[d] इस स्थान से ले गया था और बाबेल पहुँचा दिया था[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “अभी दो वर्ष (दिन)”; यह मुहावरा “दो वर्ष के भीतर” के अर्थ में है।
    reason: lexical_alternative
  - marker: b
    text: अथवा “याहवे के भवन की सभी वस्तुएँ/सभी उपकरण।”
    reason: lexical_alternative
  - marker: c
    text: 'इब्रानी में कर्म-सर्वनाम स्पष्ट रूप से आया है: “और उन्हें बाबेल पहुँचाया था।”'
    reason: lexical_alternative
  - marker: d
    text: यिर्मयाह की पुस्तक में इस नाम का एक अन्य रूप “नबूकदरेस्सर” भी मिलता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעוֹד שְׁנָתַיִם יָמִים
  choice: दो वर्ष के भीतर
  rationale: यह इब्रानी मुहावरा शेष रह गई दो वर्ष की निश्चित अवधि बताता है। ‘दो वर्ष के दिनों में’ का शब्दशः अनुवाद अस्वाभाविक होता; ‘दो वर्ष के भीतर’ भविष्यवाणी की समय-सीमा को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: מֵשִׁיב
  choice: वापस ले आऊँगा
  rationale: שוב का हिफ़ईल रूप यहाँ प्रथम पुरुष के साथ भविष्यसूचक बल रखता है और वस्तुओं को किसी स्थान पर लौटाने की ठोस क्रिया बताता है।
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: इस स्थान पर
  rationale: यह निकट-संकेतक पद संदर्भ में यरूशलेम अथवा मंदिर-स्थल की ओर संकेत करता है; अनुवाद मूल की सामान्य अभिव्यक्ति को बनाए रखता है।
- source_word: כָּל כְּלֵי בֵּית יְהוָה
  choice: याहवे के भवन के सभी पात्रों
  rationale: כְּלֵי मंदिर में प्रयुक्त वस्तुओं या पात्रों के लिए व्यापक शब्द है। ‘पात्र’ इस लूटे गए पवित्र सामान के संदर्भ में ठोस और परंपरागत है। בֵּית का रूपक मिटाए बिना ‘भवन’ मूल अभिव्यक्ति को सुरक्षित रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय आधुनिक हिन्दी लिप्यंतरण ‘याहवे’ के रूप में दिया गया है।
- source_word: אֲשֶׁר לָקַח
  choice: ले गया था
  rationale: לקח का सामान्य अर्थ यहाँ ‘लेना’ है। बाबेल ले जाने की दिशा और पूर्वकालिक संबंध के कारण हिन्दी में ‘ले गया था’ स्वाभाविक है और ‘लूट लिया’ जैसी अतिरिक्त तीव्रता नहीं जोड़ता।
- source_word: נְבוּכַדנֶאצַּר
  choice: नबूकदनेस्सर
  rationale: यह नाम का हिन्दी में व्यापक रूप से पहचाना जाने वाला लिप्यंतरण है और इस पद के व्यंजनात्मक रूप के अनुरूप है।
- source_word: מֶלֶךְ בָּבֶל
  choice: बाबेल का राजा
  rationale: संबंधवाचक संरचना का सीधा और स्वाभाविक हिन्दी अनुवाद है।
- source_word: מִן הַמָּקוֹם הַזֶּה
  choice: इस स्थान से
  rationale: पहले आए ‘इस स्थान पर’ के समानांतर स्थान-संबंध को स्पष्ट रखता है।
- source_word: וַיְבִיאֵם בָּבֶל
  choice: और उन्हें बाबेल पहुँचा दिया था
  rationale: हिफ़ईल בוא का अर्थ ‘ले आना/पहुँचाना’ है। हिन्दी में ‘पहुँचा दिया’ गंतव्य तक ले जाने की क्रिया को स्वाभाविक रूप से व्यक्त करता है और स्पष्ट कर्मवाचक सर्वनाम ‘उन्हें’ को भी बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसे किसी उपाधि में बदले बिना प्रस्तुत करता है; ‘यहोवा’ प्रचलित वैकल्पिक लिप्यंतरण है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। भविष्यवाणी को उद्धरण-चिह्नों में रखा गया है। मूल का लंबा संबंधवाचक वाक्य हिन्दी की स्पष्टता के लिए दो वाक्यों में बाँटा गया है, पर उसके सभी अर्थ-संबंध सुरक्षित हैं।
