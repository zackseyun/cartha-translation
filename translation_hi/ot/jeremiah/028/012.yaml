source:
  edition: WLC
  text: וַ/יְהִ֥י דְבַר יְהוָ֖ה אֶֽל יִרְמְיָ֑ה אַ֠חֲרֵי שְׁב֞וֹר חֲנַנְיָ֤ה הַ/נָּבִיא֙ אֶת הַ/מּוֹטָ֔ה מֵ/עַ֗ל צַוַּ֛אר יִרְמְיָ֥ה הַ/נָּבִ֖יא לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/012.yaml
  text: Then the word of Yahweh came to Jeremiah[a], after Hananiah the prophet had broken the yoke from off the neck of Jeremiah the prophet, saying,
translation:
  language: hi
  text: 'तब हनन्याह भविष्यद्वक्ता ने यिर्मयाह भविष्यद्वक्ता की गर्दन पर से जूआ[a] तोड़ दिया था; उसके बाद यहोवा का वचन यिर्मयाह के पास पहुँचा:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द अधिक विशेष रूप से जूए के डंडे या उसकी लकड़ी की आड़ी पट्टी को भी दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: पहुँचा
  rationale: यह कथात्मक क्रम में अगली घटना का परिचय देता है। ‘पहुँचा’ आधुनिक हिन्दी में ‘वचन ... के पास आया’ की अपेक्षा अधिक सहज है और घटना की क्रमिकता संदर्भ से स्पष्ट रहती है।
- source_word: דְבַר יְהוָה
  choice: यहोवा का वचन
  rationale: यह मानक भविष्यसूचक अभिव्यक्ति है। ‘वचन’ ईश्वरीय प्रकाशन की औपचारिक और धर्मवैचारिक प्रतिध्वनि बनाए रखता है, जबकि ‘संदेश’ अधिक व्याख्यात्मक होता।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में परमेश्वर का व्यक्तिवाचक वाचा-नाम है; इसलिए उसे किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ रखा गया है।
- source_word: אַחֲרֵי שְׁבוֹר
  choice: तोड़ देने के बाद
  rationale: यह रचना पहले पूरी हो चुकी क्रिया और उसके बाद आए ईश्वरीय वचन का समय-क्रम स्पष्ट करती है।
- source_word: חֲנַנְיָה הַנָּבִיא
  choice: हनन्याह भविष्यद्वक्ता
  rationale: उपाधि को नाम के साथ रखा गया है; इससे मूल की पहचानसूचक शैली और दो भविष्यद्वक्ताओं के बीच का प्रसंग बना रहता है।
- source_word: הַמּוֹטָה
  choice: जूआ
  rationale: संदर्भ में यह यिर्मयाह द्वारा पहने गए लकड़ी के जूए को दर्शाता है। ‘जूआ’ सहज और स्पष्ट है; शब्द के अधिक विशिष्ट अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: מֵעַל צַוַּאר
  choice: गर्दन पर से
  rationale: यह स्वाभाविक हिन्दी में गर्दन के ऊपर रखी वस्तु को वहाँ से हटाने का अर्थ व्यक्त करता है और संयुक्त इब्रानी संबंधबोधकों की शक्ति बनाए रखता है।
- source_word: יִרְמְיָה הַנָּבִיא
  choice: यिर्मयाह भविष्यद्वक्ता
  rationale: मूल पाठ की दोहराई हुई उपाधि को बनाए रखा गया है, जो हनन्याह और यिर्मयाह दोनों की भविष्यद्वक्ता के रूप में प्रस्तुति को रेखांकित करती है।
- source_word: לֵאמֹר
  choice: ':'
  rationale: यह पद अगले पद में आने वाले सीधे कथन का परिचय देता है। हिन्दी में पूर्णविराम के स्थान पर द्विबिंदु इस कार्य को स्वाभाविक ढंग से निभाता है और असहज ‘यह कहते हुए’ से बचाता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: यहाँ मूल पाठ में उपाधि नहीं, चार अक्षरों वाला व्यक्तिवाचक वाचा-नाम है। ‘यहोवा’ उसे नाम के रूप में सुरक्षित रखता है और ‘प्रभु’ द्वारा प्रतिस्थापित नहीं करता।
- issue: हनन्याह और यिर्मयाह—दोनों के लिए ‘भविष्यद्वक्ता’
  choice: दोनों उपाधियाँ बनाए रखी गईं
  alternative: हनन्याह की उपाधि को संदर्भानुसार कमजोर करना या हटाना
  rationale: वर्णन इस पद में दोनों को ‘भविष्यद्वक्ता’ कहता है। हनन्याह के दावे की सत्यता पर आगे का धर्मवैचारिक निर्णय इस पद में चुपचाप आरोपित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, औपचारिक और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘भविष्यद्वक्ता’ मूल की उपाधि को स्पष्ट करता है; वाक्य के अंत का द्विबिंदु अगले पद में आने वाले ईश्वरीय कथन से इसे जोड़ता है।
