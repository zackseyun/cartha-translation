id: JER.28.17
reference: Jeremiah 28:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יָּ֛מָת חֲנַנְיָ֥ה הַ/נָּבִ֖יא בַּ/שָּׁנָ֣ה הַ/הִ֑יא בַּ/חֹ֖דֶשׁ הַ/שְּׁבִיעִֽי׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/017.yaml
  text: And Hananiah the prophet died in that year[a], in the seventh month.
translation:
  language: hi
  text: और हनन्याह नबी उसी वर्ष[a], सातवें महीने में मर गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस वर्ष।”
    reason: בַּשָּׁנָה הַהִיא का अधिक शाब्दिक विकल्प; मुख्य पाठ का ‘उसी’ प्रसंगगत संकेत को स्पष्ट करता है।
lexical_decisions:
- source_word: וַיָּמָת
  choice: मर गया
  rationale: मूल क्रिया का सीधा कथात्मक अर्थ ‘मर गया’ है; आरंभिक וַ का क्रमिक/संयोजक भाव हिन्दी में ‘और’ से स्वाभाविक रूप में व्यक्त किया गया है।
- source_word: חֲנַנְיָה
  choice: हनन्याह
  rationale: व्यक्तिनाम को प्रचलित हिन्दी बाइबलीय लिप्यंतरण के अनुरूप रखा गया है।
- source_word: הַנָּבִיא
  choice: नबी
  rationale: मूल में सामान्य उपाधि ‘नबी’ ही है। प्रसंग हनन्याह के कथन को झूठा ठहराता है, पर इस पद में ‘झूठा’ विशेषण जोड़ना स्रोत से आगे जाना होगा।
- source_word: בַּשָּׁנָה הַהִיא
  choice: उसी वर्ष
  rationale: शाब्दिक अर्थ ‘उस वर्ष’ है; ‘उसी वर्ष’ निकटवर्ती प्रसंग की ओर संकेत करने वाले הַהִיא के अनाफोरिक बल को सहज हिन्दी में स्पष्ट करता है। पादटिप्पणी अधिक शाब्दिक विकल्प देती है।
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: सातवें महीने में
  rationale: इब्रानी पूर्वसर्ग और क्रमवाचक विशेषण का सीधा तथा स्वाभाविक हिन्दी रूप।
theological_decisions:
- issue: क्या हनन्याह को अनुवाद में स्पष्टतः ‘झूठा नबी’ कहा जाए
  choice: ‘नबी’ बनाए रखा गया
  alternative: ‘झूठा नबी’
  rationale: व्यापक प्रसंग हनन्याह की निंदा करता है, किंतु इस पद के इब्रानी पाठ में केवल הַנָּבִיא (‘नबी’) है। इसलिए व्याख्यात्मक विशेषण नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और कथात्मक शैली। ‘नबी’ सामान्य पाठकों में प्रचलित और स्रोत के पदनाम के अनुरूप है।
