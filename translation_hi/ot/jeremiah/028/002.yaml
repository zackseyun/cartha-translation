base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/002.yaml
  text: 'Thus says Yahweh of hosts[a], the God of Israel: I have broken the yoke of the king of Babylon.'
translation:
  language: hi
  text: '“सेनाओं का याहवे[a], इस्राएल का परमेश्वर, यों कहता है: ‘मैंने बाबुल के राजा का जूआ तोड़ दिया है।’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी उपाधि ‘सेनाओं का याहवे’ परमेश्वर के अधीन सेनाओं और समस्त शक्तियों की ओर संकेत करती है।
    reason: lexical_explanation
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: यों कहता है
  rationale: यह स्थिर भविष्यद्वाणी-संदेश सूत्र है। ‘यों कहता है’ उसके औपचारिक और अधिकारपूर्ण स्वर को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, न कि किसी उपाधि से प्रतिस्थापित किया गया।
- source_word: צְבָאוֹת
  choice: सेनाओं का
  rationale: इस ईश्वरीय उपाधि में यह परमेश्वर के अधीन समस्त शक्तियों और सेनाओं की ओर संकेत करता है; ‘सेनाओं का’ अर्थ को आधुनिक हिन्दी में स्पष्ट रखता है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल का परमेश्वर
  rationale: सम्बन्धवाचक रचना का सीधा और स्वाभाविक हिन्दी अनुवाद।
- source_word: לֵאמֹר
  choice: ':'
  rationale: यह आगामी प्रत्यक्ष कथन का परिचय देता है; हिन्दी में द्विबिंदु इस कार्य को स्वाभाविक रूप से निभाता है।
- source_word: שָׁבַרְתִּי
  choice: मैंने ... तोड़ दिया है
  rationale: इब्रानी पूर्ण क्रिया कथित कार्य को सम्पन्न बताती है। पूर्ण वर्तमान हिन्दी में उसकी सम्पन्नता और वर्तमान प्रासंगिकता दोनों व्यक्त करता है।
- source_word: עֹל
  choice: जूआ
  rationale: शाब्दिक कृषि-उपकरण यहाँ अधीनता और राजनीतिक प्रभुत्व का रूपक है; स्थापित रूपक को बनाए रखा गया है।
- source_word: מֶלֶךְ בָּבֶל
  choice: बाबुल के राजा
  rationale: इब्रानी संबंध-रचना का स्पष्ट और स्वाभाविक हिन्दी रूप।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ को चुना गया है; इसे ‘प्रभु’ जैसी उपाधि से नहीं बदला गया।
- issue: हनन्याह के कथन में पूर्ण क्रिया का बल
  choice: मैंने ... तोड़ दिया है
  alternative: मैं ... तोड़ दूँगा
  rationale: मूल में पूर्ण क्रिया है और हनन्याह इस कार्य को सम्पन्न घोषित करता है। भविष्यकाल करने से उसके दावे का स्वर बदल जाता, इसलिए कथन की अपनी तनावपूर्ण दावेदारी सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। भविष्यद्वाणी-सूत्र के औपचारिक स्वर के लिए ‘यों कहता है’ और अधीनता के मूल रूपक के लिए ‘जूआ’ सुरक्षित रखा गया है।
