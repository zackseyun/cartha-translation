source:
  edition: WLC
  text: וְ/אֶת יְכָנְיָ֣ה בֶן יְהוֹיָקִ֣ים מֶֽלֶךְ יְ֠הוּדָה וְ/אֶת כָּל גָּל֨וּת יְהוּדָ֜ה הַ/בָּאִ֣ים בָּבֶ֗לָ/ה אֲנִ֥י מֵשִׁ֛יב אֶל הַ/מָּק֥וֹם הַ/זֶּ֖ה נְאֻם יְהוָ֑ה כִּ֣י אֶשְׁבֹּ֔ר אֶת עֹ֖ל מֶ֥לֶךְ בָּבֶֽל־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/004.yaml
  text: And I will bring back to this place Jeconiah son of Jehoiakim[a], king of Judah, and all the exiles of Judah who came to Babylon, declares Yahweh, for I will break the yoke of the king of Babylon.
translation:
  language: hi
  text: और यहोयाकीम के पुत्र, यहूदा के राजा यकन्याह को, और यहूदा के उन सभी निर्वासितों को जो बाबेल आए थे[a], मैं इस स्थान पर वापस ले आऊँगा—यह याहवे की घोषणा है—क्योंकि मैं बाबेल के राजा के जुए को तोड़ दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो बाबेल गए थे।” इब्रानी कृदंत का शाब्दिक अर्थ “जो बाबेल आ रहे थे” है; यहूदा के दृष्टिकोण से हिन्दी में “गए थे” भी स्वाभाविक हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְכָנְיָה
  choice: यकन्याह
  rationale: इब्रानी व्यक्तिगत नाम का निकट और प्रचलित हिन्दी लिप्यंतरण; यहाँ पूर्ण नाम को बनाए रखा गया है।
- source_word: גָּלוּת
  choice: निर्वासितों
  rationale: यह संज्ञा निर्वासन की दशा या निर्वासित समुदाय दोनों को सूचित कर सकती है; इसके बाद आने वाला बहुवचन कृदंत यहाँ लोगों की ओर संकेत करता है।
- source_word: הַבָּאִים בָּבֶלָה
  choice: जो बाबेल आए थे[a]
  rationale: בוא का कृदंत शाब्दिक रूप से ‘आनेवाले’ कहता है। भूतकालीन प्रसंग के अनुसार ‘आए थे’ स्वाभाविक है; यहूदा के दृष्टिकोण से ‘गए थे’ भी सम्भव है, इसलिए विकल्प पादटिप्पणी में रखा गया है।
- source_word: מֵשִׁיב
  choice: वापस ले आऊँगा
  rationale: שוב के हिफ़ील रूप में किसी व्यक्ति को लौटाकर लाने का सकर्मक भाव है; व्यक्तियों और ‘इस स्थान पर’ के साथ यह अनुवाद गति और पुनर्स्थापना दोनों को व्यक्त करता है।
- source_word: הַמָּקוֹם הַזֶּה
  choice: इस स्थान पर
  rationale: निर्देशक पदबंध का सीधा और स्वाभाविक हिन्दी रूप, जो प्रसंग में यरूशलेम/यहूदा की ओर संकेत करता है, पर मुख्य पाठ में उसे स्पष्ट करके सीमित नहीं करता।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: भविष्यद्वाणी के औपचारिक सूत्र की गंभीरता को आधुनिक, सुबोध हिन्दी में बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले इब्रानी ईश्वरीय नाम का हिन्दी लिप्यंतरण, किसी उपाधि से उसका स्थानापन्न नहीं किया गया।
- source_word: עֹל
  choice: जुए
  rationale: राजनीतिक अधीनता का मूल भविष्यद्वाणी-संबंधी रूपक सुरक्षित रखा गया है।
- source_word: אֶשְׁבֹּר אֶת עֹל מֶלֶךְ בָּבֶל
  choice: मैं बाबेल के राजा के जुए को तोड़ दूँगा
  rationale: इब्रानी संरचना और दमनकारी शासन के ‘जुए’ के रूपक दोनों को स्पष्ट, स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम सीधे प्रयुक्त है; ‘याहवे’ उसका लिप्यंतरण करता है और उसे किसी उपाधि में नहीं बदलता।
- issue: बाबेल आने/जाने की दृष्टि
  choice: जो बाबेल आए थे
  alternative: जो बाबेल गए थे
  rationale: इब्रानी בוא का रूप ‘आने’ की दिशा व्यक्त करता है, यद्यपि यहूदा में बोले गए वचन की दृष्टि से हिन्दी में ‘गए थे’ अधिक सहज लग सकता है। मूल की दिशा को मुख्य पाठ में और सम्भव दृष्टिकोण को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गंभीर पर सुबोध भविष्यद्वाणी-संबंधी स्वर रखा गया है। वाक्यक्रम को हिन्दी के अनुकूल बनाया गया है, जबकि ‘जुआ’, ‘इस स्थान’ और ईश्वरीय नाम जैसे मूल बिंब और संकेत सुरक्षित हैं।
