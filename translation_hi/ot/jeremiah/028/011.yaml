base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/011.yaml
  text: 'And Hananiah said in the sight of all the people[a], saying[b], “Thus says Yahweh: In this way I will break the yoke of Nebuchadnezzar king of Babylon from upon the neck of all the nations within two years.” Then Jeremiah the prophet went on his way.'
translation:
  language: hi
  text: 'तब हनन्याह ने सब लोगों के सामने[a] कहा, “याहवे यों कहता है: इसी प्रकार[b] मैं दो वर्ष के भीतर बाबेल के राजा नबूकदनेस्सर का जुआ सब राष्ट्रों की गर्दन पर से तोड़ दूँगा।” तब यिर्मयाह नबी अपने रास्ते चला गया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “सब लोगों की आँखों के सामने”; अर्थात सबके देखते हुए।
    reason: lexical_alternative
  - marker: b
    text: “इसी प्रकार” सम्भवतः हनन्याह द्वारा जुए को तोड़ने की प्रतीकात्मक क्रिया की ओर संकेत करता है।
    reason: cultural_note
lexical_decisions:
- source_word: לְעֵינֵי
  choice: सब लोगों के सामने
  rationale: यह इब्रानी मुहावरा सार्वजनिक उपस्थिति और सबके देखते हुए बोलने का भाव देता है। सहज हिन्दी में ‘सामने’ अर्थ को स्पष्ट रखता है; मूल की ‘आँखों’ वाली छवि पादटिप्पणी में दी गई है।
- source_word: כֹּה ... כָּכָה
  choice: यह कहता है ... इसी प्रकार
  rationale: पहला पदबंध नबी-संदेश का प्रचलित सूत्र है, जबकि दूसरा संकेतवाचक है और सम्भवतः हनन्याह द्वारा जुआ तोड़ने की प्रतीकात्मक क्रिया की ओर संकेत करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में आए परमेश्वर के विशिष्ट नाम को उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत किया गया है।
- source_word: אֶשְׁבֹּר
  choice: मैं ... तोड़ दूँगा
  rationale: यहाँ अपूर्ण क्रिया-रूप भविष्य की भविष्यवाणी व्यक्त करता है; ‘तोड़ दूँगा’ जुए को बलपूर्वक तोड़ने की ठोस छवि बनाए रखता है।
- source_word: עֹל
  choice: जुआ
  rationale: यह पशुओं के जुए की ठोस छवि और राजनीतिक अधीनता के रूपक—दोनों को हिन्दी में स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּעוֹד שְׁנָתַיִם יָמִים
  choice: दो वर्ष के भीतर
  rationale: इस कालवाचक इब्रानी पदबंध का आशय दो वर्षों की सीमा के अंदर है; ‘दिन’ का शब्दशः जोड़ हिन्दी में भ्रामक और अस्वाभाविक होता।
- source_word: מֵעַל צַוַּאר כָּל הַגּוֹיִם
  choice: सब राष्ट्रों की गर्दन पर से
  rationale: यह अनुवाद गर्दन पर रखे जुए की सजीव शारीरिक छवि को बनाए रखते हुए राष्ट्रों की बाबेली अधीनता का भाव व्यक्त करता है।
- source_word: וַיֵּלֶךְ ... לְדַרְכּוֹ
  choice: अपने रास्ते चला गया
  rationale: इब्रानी मुहावरा बताता है कि यिर्मयाह वहाँ से चला गया; यह हिन्दी में सहज है और कथा की गति बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा प्रभु
  rationale: यह पद सीधे चतुरक्षरीय विशिष्ट नाम का प्रयोग करता है। ‘याहवे’ उसे एक नाम के रूप में सुरक्षित रखता है और उसे किसी सामान्य उपाधि में नहीं बदलता।
- issue: हनन्याह के कथन को ईश्वरीय घोषणा के रूप में प्रस्तुत करना
  choice: दावे को उसी प्रत्यक्ष भविष्यवाणी-सूत्र में रखा गया है जिसमें हनन्याह ने कहा
  alternative: कथन को सत्यापित ईश्वरीय वचन की तरह व्याख्यात्मक रूप से पुष्ट करना
  rationale: पद हनन्याह के शब्दों को उद्धृत करता है, पर व्यापक प्रसंग में उसके दावे पर विवाद है। अनुवाद वक्ता का दावा सुरक्षित रखता है, उसकी सत्यता का अतिरिक्त निर्णय नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। भविष्यवाणी-सूत्र को स्पष्ट रखा गया है, अनावश्यक रूप से शब्दशः ‘कहते हुए’ नहीं दोहराया गया, और जुए तथा गर्दन की मूल रूपकात्मक छवि सुरक्षित रखी गई है।
