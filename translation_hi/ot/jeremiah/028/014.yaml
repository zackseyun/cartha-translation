source:
  edition: WLC
  text: כִּ֣י כֹֽה אָמַר֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל עֹ֣ל בַּרְזֶ֡ל נָתַ֜תִּי עַל צַוַּ֣אר כָּל הַ/גּוֹיִ֣ם הָ/אֵ֗לֶּה לַ/עֲבֹ֛ד אֶת נְבֻכַדְנֶאצַּ֥ר מֶֽלֶךְ בָּבֶ֖ל וַ/עֲבָדֻ֑/הוּ וְ/גַ֛ם אֶת חַיַּ֥ת הַ/שָּׂדֶ֖ה נָתַ֥תִּי לֽ/וֹ־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/014.yaml
  text: 'For thus says Yahweh of hosts[a], the God of Israel: I have put an iron yoke on the necks of all these nations, to serve Nebuchadnezzar king of Babylon, and they shall serve him[b]. I have also given him the beasts of the field.'
translation:
  language: hi
  text: 'क्योंकि सेनाओं के यहोवा, इस्राएल के परमेश्वर, का यह कहना है: मैंने इन सभी जातियों की गर्दनों पर लोहे का जुआ रख दिया है, कि वे बेबीलोन के राजा नबूकदनेस्सर की सेवा करें, और वे उसकी सेवा करेंगी। मैंने मैदान के जंगली पशु भी उसे दे दिए हैं।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं के यहोवा
  rationale: व्यक्तिगत दिव्य नाम को ‘यहोवा’ के रूप में रखते हुए צְבָאוֹת का सीधा और समझने योग्य अर्थ ‘सेनाओं के’ दिया गया है।
- source_word: עֹל בַּרְזֶל
  choice: लोहे का जुआ
  rationale: यह स्वाभाविक हिन्दी पदबंध है और पहले के लकड़ी के जुए की तुलना में कठोर अधीनता का बिंब बनाए रखता है।
- source_word: נָתַתִּי עַל צַוַּאר
  choice: गर्दनों पर ... रख दिया है
  rationale: נתן का प्रसंगानुकूल अर्थ ‘रखना’ है; हिन्दी में अनेक जातियों के साथ बहुवचन ‘गर्दनों’ से सामूहिक बिंब स्पष्ट और स्वाभाविक बनता है। पूर्ण क्रिया का वर्तमान में जारी परिणाम भी बना रहता है।
- source_word: כָּל הַגּוֹיִם הָאֵלֶּה
  choice: इन सभी जातियों
  rationale: גּוֹיִם यहाँ बेबीलोन के अधीन आने वाले राष्ट्रीय समुदायों को सूचित करता है; ‘जातियाँ’ प्रतिष्ठित बाइबलीय हिन्दी में इस अर्थ को संक्षेप में व्यक्त करता है।
- source_word: לַעֲבֹד ... וַעֲבָדֻהוּ
  choice: सेवा करें; और वे उसकी सेवा करेंगी
  rationale: עבד की पुनरावृत्ति को हिन्दी में भी रखा गया है। पहला रूप उद्देश्य और दूसरा निश्चित भावी परिणाम व्यक्त करता है।
- source_word: נְבֻכַדְנֶאצַּר
  choice: नबूकदनेस्सर
  rationale: यह हिन्दी बाइबल परंपरा में व्यापक रूप से पहचाना जाने वाला नामरूप है और इस पद की हिब्रू वर्तनी का पर्याप्त निकट लिप्यंतरण है।
- source_word: חַיַּת הַשָּׂדֶה
  choice: मैदान के जंगली पशु
  rationale: यह पदबंध हिब्रू मुहावरे के ‘मैदान’ संबंध को बचाते हुए आधुनिक पाठक के लिए पशुओं के जंगली होने का आशय स्पष्ट करता है।
- source_word: נָתַתִּי לוֹ
  choice: उसे दे दिए हैं
  rationale: यहाँ נתן का मूल अर्थ ‘देना’ उपयुक्त है और पूर्ण दैवी कार्य के वर्तमान प्रभाव को व्यक्त करता है।
theological_decisions:
- issue: अन्यजातीय राष्ट्रों और सृष्टि पर परमेश्वर की प्रभुता
  choice: पद स्पष्ट रूप से कहता है कि यहोवा ने जातियों पर जुआ रखा और जंगली पशु भी नबूकदनेस्सर को दे दिए।
  alternative: इसे केवल बेबीलोन की राजनीतिक सफलता बताकर दैवी नियुक्ति को मंद करना।
  rationale: हिब्रू में प्रथम पुरुष נָתַתִּי दो बार आया है; इसलिए अनुवाद दैवी कर्तृत्व को बिना अतिरिक्त व्याख्या के स्पष्ट रखता है।
- issue: क्रियाओं का कालगत बल
  choice: ‘रख दिया है ... सेवा करेंगी ... दे दिए हैं’ द्वारा पूर्ण दैवी कार्य और उसके निश्चित भावी परिणाम को व्यक्त किया गया है।
  alternative: सभी क्रियाओं को साधारण भूतकाल में देना।
  rationale: प्रसंग में וַעֲבָדֻהוּ भावी/परिणामसूचक है, जबकि נָתַתִּי के कार्य वर्तमान व्यवस्था में प्रभावी हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सार्वजनिक पाठ के योग्य रूप। वाक्य-विन्यास मूल के घोषणात्मक बल और ‘सेवा’ की पुनरावृत्ति को बनाए रखता है। स्रोत में दिए अंग्रेज़ी फुटनोटों के चिह्न और विषय परस्पर उलटे प्रतीत होते हैं; चूँकि हिन्दी पाठ में न नाम का वास्तविक वैकल्पिक रूप आवश्यक है, न ‘लोहे का जुआ/लोहे के जुए’ का अर्थगत अंतर, इसलिए कृत्रिम फुटनोट नहीं जोड़े गए।
