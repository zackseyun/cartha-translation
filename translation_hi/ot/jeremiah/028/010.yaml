    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: उतार लिया
  rationale: לקח का मूल अर्थ ‘लेना’ है; מֵעַל צַוַּאר के साथ यहाँ गर्दन पर रखी वस्तु को हटाकर ले लेने का स्वाभाविक हिन्दी भाव ‘उतार लिया’ है। इसमें ‘छीनने’ जैसा अतिरिक्त बल नहीं जोड़ा गया।
- source_word: חֲנַנְיָה
  choice: हनन्याह
  rationale: इब्रानी व्यक्ति-नाम का निकट देवनागरी लिप्यंतरण।
- source_word: הַנָּבִיא
  choice: नबी
  rationale: נָבִיא के लिए आधुनिक हिन्दी में प्रचलित और सहज शब्द। हनन्याह और यिर्मयाह—दोनों के साथ इसकी पुनरावृत्ति मूल पाठ के बलाघात के अनुसार रखी गई है।
- source_word: הַמּוֹטָה
  choice: जूआ
  rationale: מוֹטָה का अर्थ डंडा या जूए का डंडा भी हो सकता है; आसपास के प्रतीकात्मक कार्य में यिर्मयाह द्वारा पहने गए जूए के कारण मुख्य पाठ में ‘जूआ’ संदर्भ को सबसे स्पष्ट रूप से व्यक्त करता है। शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: מֵעַל צַוַּאר
  choice: गर्दन पर से
  rationale: מֵעַל का ‘ऊपर से/पर से’ स्थानिक भाव सुरक्षित रखते हुए यह स्वाभाविक हिन्दी है।
- source_word: יִרְמְיָה
  choice: यिर्मयाह
  rationale: इब्रानी नाम का हिन्दी बाइबलीय परंपरा के अनुरूप लिप्यंतरण।
- source_word: וַיִּשְׁבְּרֵהוּ
  choice: और उसे तोड़ दिया
  rationale: שׁבר का सामान्य अर्थ ‘तोड़ना’ है; ‘चकनाचूर करना’ मूल क्रिया से अधिक तीव्र होता। ‘उसे’ का संकेत जूए की ओर है।
