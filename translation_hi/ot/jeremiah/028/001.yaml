base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/001.yaml
  text: And it happened in that year[a], at the beginning of the reign of Zedekiah king of Judah, in the fourth year, in the fifth month, that Hananiah son of Azzur, the prophet from Gibeon, spoke to me in the house of Yahweh, in the sight of the priests and all the people, saying[b],
translation:
  language: hi
  text: 'और ऐसा हुआ कि उसी वर्ष, यहूदा के राजा सिदकिय्याह के शासन के आरम्भ में[a], उसके शासन के चौथे वर्ष के पाँचवें महीने में, गिबोन के अज्जूर के पुत्र हनन्याह नबी ने याहवे के भवन में याजकों और सब लोगों के सामने[b] मुझसे कहा:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ में ‘सिदकिय्याह के शासन के आरम्भ में’ और ‘चौथे वर्ष’—दोनों अभिव्यक्तियाँ हैं। अनुवाद दोनों को बिना सामंजस्य बैठाए रखता है।
    reason: textual_tension
  - marker: b
    text: इब्रानी में शाब्दिक रूप से ‘याजकों और सब लोगों की आँखों के सामने’; अर्थात उनकी उपस्थिति में या सार्वजनिक रूप से।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּשָּׁנָה הַהִיא
  choice: उसी वर्ष
  rationale: यह इब्रानी कथा के नए प्रसंग को आरम्भ करने वाला स्वाभाविक काल-सूचक वाक्यांश है; हिन्दी में अलग से ‘और ऐसा हुआ’ जोड़ना आवश्यक नहीं।
- source_word: בְּרֵאשִׁית מַמְלֶכֶת
  choice: के शासन के आरम्भ में
  rationale: מַמְלֶכֶת यहाँ राज्य-क्षेत्र के बजाय राजा के शासनकाल को सूचित करता है।
- source_word: בַּשָּׁנָה הָרְבִעִית בַּחֹדֶשׁ הַחֲמִישִׁי
  choice: उसके शासन के चौथे वर्ष के पाँचवें महीने में
  rationale: दोनों क्रमवाचक काल-सूचनाएँ स्पष्ट रखी गई हैं; आधुनिक महीने का नाम लगाकर प्राचीन पंचांग का अनुमान नहीं किया गया।
- source_word: חֲנַנְיָה בֶן עַזּוּר הַנָּבִיא אֲשֶׁר מִגִּבְעוֹן
  choice: गिबोन के रहने वाले अज्जूर के पुत्र हनन्याह नबी
  rationale: वंश, स्थान और नबी की पहचान—तीनों को मूल क्रम के निकट रहते हुए स्वाभाविक हिन्दी में रखा गया है।
- source_word: בְּבֵית יְהוָה
  choice: याहवे के भवन में
  rationale: בַּיִת का मूल बिम्ब ‘भवन/घर’ है और יְהוָה को उसके व्यक्तिगत वाचा-नाम के लिप्यंतरण ‘याहवे’ से व्यक्त किया गया है।
- source_word: לְעֵינֵי הַכֹּהֲנִים וְכָל־הָעָם
  choice: याजकों और सब लोगों के सामने
  rationale: शाब्दिक ‘आँखों के सामने’ का आशय उनकी उपस्थिति में, सार्वजनिक रूप से बोलना है; हिन्दी मुहावरा ‘के सामने’ यही अर्थ सहजता से देता है।
- source_word: אָמַר אֵלַי ... לֵאמֹר
  choice: 'मुझसे यह कहा:'
  rationale: इब्रानी कथन-सूत्र को अनावश्यक पुनरुक्ति के बिना स्वाभाविक हिन्दी में रखा गया है और आगे आने वाले सीधे कथन के लिए द्विबिंदु लगाया गया है।
theological_decisions:
- issue: ‘शासन के आरम्भ में’ और ‘चौथे वर्ष’ के बीच दिखाई देने वाला कालक्रमिक तनाव
  choice: दोनों अभिव्यक्तियों को पाठ में बनाए रखना
  alternative: ‘आरम्भ’ को हटाकर या ढीला अर्थ देकर तनाव मिटा देना
  rationale: मसोराई इब्रानी पाठ में दोनों काल-सूचनाएँ उपस्थित हैं। अनुवाद उन्हें समन्वित करने के लिए किसी एक को बदलता नहीं; ‘अर्थात्’ हिन्दी में उसी वर्ष-निर्देश की व्याकरणिक कड़ी स्पष्ट करता है, विरोध को मिटाता नहीं।
- issue: हनन्याह के लिए הַנָּבִיא का प्रयोग
  choice: हनन्याह नबी
  alternative: ‘कथित नबी’ या ‘झूठा नबी’
  rationale: इस पद में निश्चित पदवी ‘नबी’ है। आगे की कथा के आधार पर यहाँ मूल्यांकनात्मक शब्द जोड़ना मूल से अधिक कहना होता।
- issue: ईश्वरीय नाम יְהוָה
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: व्यक्तिगत ईश्वरीय नाम को उपाधि से बदलने के बजाय हिन्दी में उसके निकट प्रचलित लिप्यंतरण से रखा गया है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। काल-सूचनाओं को डैश के बीच रखने से लम्बा इब्रानी वाक्य हिन्दी में सुबोध रहता है। ‘याजक’, ‘नबी’ और ‘भवन’ सामान्य बाइबलीय हिन्दी के परिचित शब्द हैं; किसी सम्प्रदाय-विशेष की व्याख्या नहीं जोड़ी गई।
