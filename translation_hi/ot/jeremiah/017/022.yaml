  text: וְ/לֹא תוֹצִ֨יאוּ מַשָּׂ֤א מִ/בָּֽתֵּי/כֶם֙ בְּ/י֣וֹם הַ/שַּׁבָּ֔ת וְ/כָל מְלָאכָ֖ה לֹ֣א תַֽעֲשׂ֑וּ וְ/קִדַּשְׁתֶּם֙ אֶת י֣וֹם הַ/שַּׁבָּ֔ת כַּ/אֲשֶׁ֥ר צִוִּ֖יתִי אֶת אֲבוֹתֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/022.yaml
  text: Do not carry a load out of your houses on the Sabbath day[a], and do not do any work, but sanctify the Sabbath day[b], just as I commanded your fathers.
translation:
  language: hi
  text: विश्राम-दिन को अपने घरों से कोई बोझ बाहर मत ले जाना[a] और कोई काम मत करना, बल्कि विश्राम-दिन को पवित्र ठहराओ, जैसा मैंने तुम्हारे पुरखाओं[b] को आज्ञा दी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपने घरों से कोई भार बाहर मत निकालना।’
    reason: lexical_alternative
  - marker: b
    text: ‘पुरखाओं’ से आशय इस्राएल की उन पिछली पीढ़ियों से है जिन्हें परमेश्वर ने यह आज्ञा दी थी।
    reason: cultural_note
lexical_decisions:
- source_word: תוֹצִיאוּ
  choice: बाहर मत ले जाना
  rationale: यह יצא के हिफ़ील रूप का स्वाभाविक हिन्दी अनुवाद है और किसी वस्तु को घरों से बाहर ले जाने की क्रिया स्पष्ट करता है।
- source_word: מַשָּׂא
  choice: कोई बोझ
  rationale: संज्ञा का अर्थ उठाई या ढोई जाने वाली वस्तु है; इस प्रसंग में ‘बोझ’ ठोस भार को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִבָּתֵּיכֶם
  choice: अपने घरों से
  rationale: מן स्रोत या आरम्भ-बिंदु बताता है; बहुवचन ‘घरों’ और सम्बोधित समुदाय के ‘अपने’ को बनाए रखा गया है।
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: विश्राम-दिन को
  rationale: यह समय-सूचक पद है। ‘विश्राम-दिन’ शब्बात के अर्थ और मूल में उपस्थित ‘दिन’ दोनों को स्पष्ट रखता है।
- source_word: מְלָאכָה
  choice: काम
  rationale: विश्राम-दिन के विधान में यह निषिद्ध काम या श्रम का सामान्य और सहज बोध कराता है।
- source_word: וְקִדַּשְׁתֶּם
  choice: पवित्र ठहराना
  rationale: קדש के पिएल रूप में दिन को पवित्र मानकर अलग रखने का भाव है; ‘पवित्र ठहराना’ मूल की सक्रिय आज्ञा को सीधे बनाए रखता है।
- source_word: כַּאֲשֶׁר
  choice: जैसा
  rationale: यह पहले दी गई ईश्वरीय आज्ञा के साथ तुलना या अनुरूपता व्यक्त करता है।
- source_word: צִוִּיתִי
  choice: मैंने ... आज्ञा दी थी
  rationale: प्रथम पुरुष एकवचन और पूर्व में दी गई आज्ञा, दोनों को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: אֲבוֹתֵיכֶם
  choice: तुम्हारे पुरखाओं
  rationale: यह पुरुषवाचक पूर्वज-संज्ञा है; ‘पुरखाओं’ से मूल का पारिवारिक और पीढ़ीगत भाव सुरक्षित रहता है।
theological_decisions:
- issue: विश्राम-दिन को पवित्र करने की भाषा
  choice: विश्राम-दिन को पवित्र ठहराना
  alternative: विश्राम-दिन को पवित्र मानना / पवित्र रखना
  rationale: ‘पवित्र ठहराना’ मूल क्रिया की सक्रियता और दिन को परमेश्वर के लिए अलग रखने का भाव बनाए रखता है, बिना यह तय किए कि इसका आशय केवल मनोभाव है या केवल बाहरी पालन।
- issue: पूर्वजों के लिए पुरुषवाचक पद
  choice: तुम्हारे पुरखाओं
  alternative: तुम्हारे पूर्वजों
  rationale: मूल में पुरुषवाचक kinship term है। ‘पुरखाओं’ उसका लिंग और पीढ़ीगत स्वर बनाए रखता है, जबकि टिप्पणी उसके सामूहिक ऐतिहासिक सन्दर्भ को स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। सामूहिक सम्बोधन के लिए ‘तुम्हारे/अपने’ और निषेधात्मक आज्ञाओं के लिए ‘मत’ का प्रयोग हुआ है। ‘शब्बात’ के स्थान पर अर्थ-स्पष्ट ‘विश्राम-दिन’ चुना गया है; ‘पवित्र ठहराना’ धार्मिक गम्भीरता बनाए रखते हुए सामान्य पाठक के लिए बोधगम्य है।
