  source_fidelity: 'A safe correction is needed. The draft''s use of “बल्कि” is somewhat interpretive and creates an unnecessary contrast; the Hebrew presents coordinated failures to heed the command: not sanctifying the Sabbath day and carrying a load into Jerusalem on that day. “बुझाई न जा सकेगी” can imply inability to extinguish, whereas the Hebrew states directly that the fire will not be quenched. The second footnote also does not preserve the English audit trail''s note concerning the feminine suffix in “its/her gates.”'
  naturalness: The register is generally clear, dignified, and natural modern Hindi. The revised conditional sequence is more direct and avoids the long dash construction while keeping the warning’s force.
  terminology: “सब्त के दिन,” “बोझ,” “फाटक,” and “महल” are suitable. “फाटकों में आग भड़का दूँगा” naturally conveys the Hiphil of יצת, and “बुझाई नहीं जाएगी” closely represents the final Hebrew clause without expanding its sense.
  issues:
  - severity: medium
    issue: “बल्कि” introduces a contrast not explicitly marked in the Hebrew.
    rationale: The Hebrew coordinates the failures under the conditional warning rather than explicitly contrasting Sabbath observance with load-bearing. A simple coordinated Hindi construction is more source-near.
  - severity: medium
    issue: The final clause “बुझाई न जा सकेगी” adds a possible nuance of incapacity.
    rationale: וְלֹא תִכְבֶּה directly says that the fire will not be quenched/go out. “बुझाई नहीं जाएगी” preserves this assertion more closely.
  - severity: medium
    issue: Footnote b is attached to “महलों” and gives a lexical alternative, rather than documenting the Hebrew feminine suffix in “उसके फाटकों,” as in the English audit trail.
    rationale: The source phrase בִּשְׁעָרֶיהָ means literally “in her gates,” with Jerusalem grammatically feminine. The Hindi text can idiomatically use “उसके,” but the audit note should be retained at that point.
