source:
  edition: WLC
  text: וְ/אִם לֹ֨א תִשְׁמְע֜וּ אֵלַ֗/י לְ/קַדֵּשׁ֙ אֶת י֣וֹם הַ/שַּׁבָּ֔ת וּ/לְ/בִלְתִּ֣י שְׂאֵ֣ת מַשָּׂ֗א וּ/בֹ֛א בְּ/שַׁעֲרֵ֥י יְרוּשָׁלִַ֖ם בְּ/י֣וֹם הַ/שַּׁבָּ֑ת וְ/הִצַּ֧תִּי אֵ֣שׁ בִּ/שְׁעָרֶ֗י/הָ וְ/אָֽכְלָ֛ה אַרְמְנ֥וֹת יְרוּשָׁלִַ֖ם וְ/לֹ֥א תִכְבֶּֽה־־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/027.yaml
  text: But if you do not listen to me[a], to keep the Sabbath day holy, and not to carry a load and bring it in through the gates of Jerusalem on the Sabbath day, then I will kindle a fire in its gates, and it will consume the palaces of Jerusalem[b], and it will not be quenched.
translation:
  language: hi
  text: पर यदि तुम मेरी बात नहीं सुनोगे, सब्त के दिन को पवित्र नहीं रखोगे, और सब्त के दिन बोझ[a] उठाकर उसे यरूशलेम के फाटकों से भीतर लाओगे, तो मैं उसके[b] फाटकों में आग भड़का दूँगा। वह यरूशलेम के महलों को भस्म कर देगी और बुझाई नहीं जाएगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “लादा हुआ सामान।” इब्रानी अभिव्यक्ति का शाब्दिक अर्थ उठाया या ढोया जाने वाला बोझ है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में, “उसके फाटकों में” के स्थान पर शाब्दिक रूप से “उसके [स्त्रीलिंग] फाटकों में”; यरूशलेम इब्रानी व्याकरण में स्त्रीलिंग है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשְׁמְעוּ אֵלַי
  choice: मेरी बात नहीं सुनोगे
  rationale: שׁמע के साथ אֶל का अर्थ सुनना और ध्यान देकर मानना है। हिन्दी में ‘मेरी बात सुनना’ श्रवण के बिंब और आज्ञापालन के निहित अर्थ, दोनों को स्वाभाविक रूप से बनाए रखता है।
- source_word: לְקַדֵּשׁ אֶת יוֹם הַשַּׁבָּת
  choice: सब्त के दिन को पवित्र नहीं रखोगे
  rationale: पिएल קדשׁ का भाव किसी वस्तु या समय को पवित्र मानकर अलग रखना है। ‘पवित्र रखना’ आधुनिक हिन्दी में सहज है और मूल पाठ में आए ‘दिन’ को भी स्पष्ट रखता है।
- source_word: וּלְבִלְתִּי שְׂאֵת מַשָּׂא
  choice: कोई बोझ उठाकर
  rationale: שׂאת מַשָּׂא का शाब्दिक भाव बोझ उठाने या ढोने का है। ‘बोझ’ अर्थ की व्यापकता बनाए रखता है; प्रसंग में यह ढोया जाने वाला सामान भी हो सकता है।
- source_word: וּבֹא בְּשַׁעֲרֵי יְרוּשָׁלִַם
  choice: यरूशलेम के फाटकों से भीतर लाओगे
  rationale: בוא यहाँ पहले उल्लिखित बोझ के साथ नगर में आने या उसे भीतर लाने को व्यक्त करता है। हिन्दी में ‘भीतर लाओगे’ निहित कर्म को स्वाभाविक ढंग से स्पष्ट करता है।
- source_word: וְהִצַּתִּי אֵשׁ בִּשְׁעָרֶיהָ
  choice: तो मैं उसके फाटकों में आग लगा दूँगा
  rationale: हिफ़ील יצת आग प्रज्वलित करने या लगा देने को दर्शाता है। ‘तो’ शर्त के परिणाम को स्पष्ट करता है, और ‘उसके’ का संकेत यरूशलेम की ओर है।
- source_word: וְאָכְלָה אַרְמְנוֹת יְרוּשָׁלִַם
  choice: वह यरूशलेम के महलों को भस्म कर देगी
  rationale: क्रिया का कर्ता आग है और אכל यहाँ आग द्वारा निगलने/भस्म करने के अर्थ में है। אַרְמְנוֹת प्रासादों या दुर्गनुमा भव्य भवनों को सूचित कर सकता है; मुख्य पाठ में ‘महलों’ सर्वाधिक सीधा है।
- source_word: וְלֹא תִכְבֶּה
  choice: और बुझाई न जा सकेगी
  rationale: כבה का अर्थ आग का बुझना या बुझाया जाना है। यह रूप न्याय की आग के न बुझने की गंभीर भविष्यवाणी को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: सब्त संबंधी पदावली
  choice: सब्त के दिन
  alternative: सब्त
  rationale: मूल इब्रानी में יוֹם, ‘दिन’, स्पष्ट रूप से उपस्थित है; इसलिए उसे बनाए रखना स्रोत के अधिक निकट है और कोई अतिरिक्त सांप्रदायिक अर्थ नहीं जोड़ता।
- issue: शर्त और उसके परिणाम का संबंध
  choice: पर यदि…तो मैं
  alternative: पर यदि…और मैं
  rationale: इब्रानी की शर्तात्मक रचना में आग लगाने का कथन शर्त का परिणाम है। हिन्दी में ‘तो’ इस संबंध को स्पष्ट करता है, बिना न्याय की प्रकृति पर कोई अतिरिक्त व्याख्या जोड़े।
- issue: न बुझने वाली आग का कथन
  choice: बुझाई न जा सकेगी
  alternative: न बुझेगी
  rationale: दोनों अर्थ संभव हैं। चुना हुआ रूप आग को बुझाने के मानवीय प्रयास की निष्फलता का स्वाभाविक हिन्दी संकेत देता है, जबकि मूल भविष्यवाणी की अनिवार्यता बनी रहती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘फाटक’, ‘पवित्र रखना’ और ‘भस्म करना’ जैसे परिचित बाइबलीय शब्दों का प्रयोग किया गया है, पर वाक्य-विन्यास वर्तमान मानक हिन्दी का है। डैश मूल वाक्य में आज्ञा के आशय को स्पष्ट करता है और ‘बल्कि’ निषिद्ध आचरण को सहज रूप से सामने लाता है।
