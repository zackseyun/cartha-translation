  text: וּ/בָ֣אוּ בְ/שַׁעֲרֵ֣י הָ/עִ֣יר הַ/זֹּ֡את מְלָכִ֣ים וְ/שָׂרִ֡ים יֹשְׁבִים֩ עַל כִּסֵּ֨א דָוִ֜ד רֹכְבִ֣ים בָּ/רֶ֣כֶב וּ/בַ/סּוּסִ֗ים הֵ֚מָּה וְ/שָׂ֣רֵי/הֶ֔ם אִ֥ישׁ יְהוּדָ֖ה וְ/יֹשְׁבֵ֣י יְרוּשָׁלִָ֑ם וְ/יָשְׁבָ֥ה הָֽ/עִיר הַ/זֹּ֖את לְ/עוֹלָֽם׀־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/025.yaml
  text: then kings and officials will enter through the gates of this city[a], sitting on the throne of David, riding in chariots and on horses—they and their officials, the men of Judah and the inhabitants of Jerusalem—and this city will be inhabited forever.
translation:
  language: hi
  text: तब इस नगर के फाटकों से राजा और अधिकारी प्रवेश करेंगे, जो दाऊद के सिंहासन पर बैठते हैं और रथों में तथा घोड़ों पर सवार होते हैं—वे, उनके अधिकारी, यहूदा के पुरुष[a] और यरूशलेम के निवासी—और यह नगर सदा बसा रहेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यहूदा के लोग।” इब्रानी में शाब्दिक रूप से “यहूदा का पुरुष” है, जिसका प्रयोग यहाँ सामूहिक अर्थ में हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאוּ בְשַׁעֲרֵי הָעִיר הַזֹּאת
  choice: तब इस नगर के फाटकों से ... प्रवेश करेंगे
  rationale: וּבָאוּ पिछले पद की शर्त का परिणाम आगे बढ़ाता है, इसलिए हिंदी में ‘तब’ स्वाभाविक है। בוא के साथ בְּ और ‘फाटक’ गति को फाटकों से होकर नगर में प्रवेश करने के अर्थ में रखते हैं।
- source_word: מְלָכִים וְשָׂרִים
  choice: राजा और अधिकारी
  rationale: שָׂרִים शासकीय नेताओं या राजकीय पदाधिकारियों के लिए व्यापक शब्द है; ‘अधिकारी’ आधुनिक हिंदी में स्पष्ट है और अनावश्यक रूप से वंशानुगत ‘राजकुमारों’ का अर्थ नहीं जोड़ता।
- source_word: יֹשְׁבִים עַל כִּסֵּא דָוִד
  choice: जो दाऊद के सिंहासन पर बैठते हैं
  rationale: यह अनुवाद मूल के कृदंत और दाऊदी राजसत्ता की स्पष्ट छवि को बनाए रखता है। बहुवचन को किसी एक समय के अनेक समकालीन राजाओं के रूप में समझाने के बजाय मूल की वंशगत अभिव्यक्ति खुली रखी गई है।
- source_word: רֹכְבִים בָּרֶכֶב וּבַסּוּסִים
  choice: रथों में तथा घोड़ों पर सवार होते हैं
  rationale: हिंदी में रथ के लिए ‘में’ और घोड़े के लिए ‘पर’ स्वाभाविक हैं। सामूहिक एकवचन רֶכֶב को प्रसंगानुसार बहुवचन ‘रथों’ से व्यक्त किया गया है।
- source_word: הֵמָּה וְשָׂרֵיהֶם
  choice: वे, उनके अधिकारी
  rationale: बलाघाती सर्वनाम और उसके बाद राजकीय दल के विस्तार को बनाए रखा गया है; שָׂרִים के लिए ‘अधिकारी’ का एकसमान प्रयोग किया गया है।
- source_word: אִישׁ יְהוּדָה
  choice: यहूदा के पुरुष
  rationale: אִישׁ व्याकरणतः पुल्लिंग एकवचन है, पर यहाँ सामूहिक अर्थ रखता है। ‘पुरुष’ मूल के लैंगिक रूप को बनाए रखता है, जबकि पादटिप्पणी सामूहिक विकल्प स्पष्ट करती है।
- source_word: וְיֹשְׁבֵי יְרוּשָׁלָ͏ִם
  choice: और यरूशलेम के निवासी
  rationale: यह नगर में रहनेवाली जनसंख्या के लिए स्वाभाविक और गरिमापूर्ण आधुनिक हिंदी अभिव्यक्ति है।
- source_word: וְיָשְׁבָה הָעִיר הַזֹּאת לְעוֹלָם
  choice: और यह नगर सदा बसा रहेगा
  rationale: नगर को कर्ता बनाकर ישׁב का अर्थ यहाँ ‘आबाद रहना’ है। ‘बसा रहेगा’ स्थायी आबादी और निरंतरता, दोनों को सहज हिंदी में व्यक्त करता है; לְעוֹלָם के लिए ‘सदा’ प्रयुक्त है।
theological_decisions:
- issue: दाऊद के सिंहासन का वंशगत और वाचागत संकेत
  choice: ‘दाऊद के सिंहासन’ को स्पष्ट रूप से ज्यों का त्यों रखा गया है।
  alternative: इसे सामान्यीकृत करके ‘वैध राजसत्ता’ या विस्तार देकर कोई मसीही अर्थ प्रस्तुत करना।
  rationale: मूल पाठ दाऊदी राजपद का स्पष्ट उल्लेख करता है। अनुवाद उस अर्थ को न घटाता है, न पाठ से आगे जाकर उसका धर्मवैज्ञानिक विस्तार करता है।
- issue: אִישׁ יְהוּדָה का लैंगिक और सामूहिक अर्थ
  choice: मुख्य पाठ में ‘यहूदा के पुरुष’, और पादटिप्पणी में सामूहिक विकल्प।
  alternative: मुख्य पाठ में ‘यहूदा के लोग’।
  rationale: इससे मूल का व्याकरणिक पुल्लिंग सुरक्षित रहता है, जबकि पाठक को यह भी बताया जाता है कि पदबंध सामूहिक रूप में प्रयुक्त है।
- issue: राजाओं और अधिकारियों के साथ कृदंतों का संबंध
  choice: मूल शब्दक्रम के अनुसार ‘राजा और अधिकारी ... जो ... बैठते हैं और ... सवार होते हैं’।
  alternative: ‘सिंहासन पर बैठने’ को केवल राजाओं और ‘सवार होने’ को पूरे दल से स्पष्ट रूप से जोड़ना।
  rationale: हिब्रू की व्याकरणिक रचना में संबंध कुछ तनावपूर्ण है; अनुवाद ने ऐसा विराम या पुनर्गठन नहीं किया जो संभावित संबंध को निश्चित रूप से सुलझा दे।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘फाटक’, ‘सिंहासन’ और ‘रथ’ बाइबलीय राजकीय दृश्य को स्पष्ट रखते हैं; वाक्य की सूची-सदृश संरचना मूल हिब्रू की संचयी शैली को यथासंभव बनाए रखती है।
