source:
  edition: WLC
  text: וּ/בָ֣אוּ מֵ/עָרֵֽי יְ֠הוּדָה וּ/מִ/סְּבִיב֨וֹת יְרוּשָׁלִַ֜ם וּ/מֵ/אֶ֣רֶץ בִּנְיָמִ֗ן וּ/מִן הַ/שְּׁפֵלָ֤ה וּ/מִן הָ/הָר֙ וּ/מִן הַ/נֶּ֔גֶב מְבִאִ֛ים עוֹלָ֥ה וְ/זֶ֖בַח וּ/מִנְחָ֣ה וּ/לְבוֹנָ֑ה וּ/מְבִאֵ֥י תוֹדָ֖ה בֵּ֥ית יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/026.yaml
  text: And they will come from the cities of Judah and from the areas around Jerusalem[a], and from the land of Benjamin, and from the lowland, and from the hill country, and from the Negeb, bringing burnt offerings and sacrifices, grain offerings and frankincense[c][b], and bringing thank offerings to the house of Yahweh.
translation:
  language: hi
  text: और यहूदा के नगरों से, यरूशलेम के आस-पास के क्षेत्रों से, बिन्यामीन के प्रदेश से, निचले भूभाग[a] से, पहाड़ी प्रदेश से और नेगेव[b] से लोग आएँगे; वे होमबलियाँ, बलिदान, अन्नबलियाँ, लोबान और धन्यवाद-बलियाँ याहवे के भवन[c] में लाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसे ‘शेफेला’ भी कहा जाता है; यह यहूदा का निम्नवर्ती क्षेत्र था।
    reason: lexical_alternative
  - marker: b
    text: या ‘दक्षिण’; ‘नेगेव’ यहूदा के दक्षिणी क्षेत्र का नाम है।
    reason: lexical_alternative
  - marker: c
    text: ‘याहवे का भवन’ अर्थात मंदिर।
    reason: cultural_note
lexical_decisions:
- source_word: וּבָאוּ
  choice: लोग आएँगे
  rationale: भविष्यसूचक और शर्त-संबंधी संदर्भ में संयोजक सहित पूर्ण क्रिया को स्वाभाविक हिन्दी भविष्यकाल में व्यक्त किया गया है; बहुवचन कर्ता को स्पष्ट करने के लिए ‘लोग’ जोड़ा गया है।
- source_word: מֵעָרֵי יְהוּדָה
  choice: यहूदा के नगरों से
  rationale: עָרִים नगरों या कस्बों को सूचित करता है; ‘नगर’ आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: וּמִסְּבִיבוֹת יְרוּשָׁלַם
  choice: यरूशलेम के आस-पास के क्षेत्रों से
  rationale: סְבִיבוֹת यरूशलेम को घेरे हुए आसपास के भूभागों का बोध कराता है।
- source_word: וּמֵאֶרֶץ בִּנְיָמִן
  choice: बिन्यामीन के प्रदेश से
  rationale: אֶרֶץ यहाँ बिन्यामीन से संबद्ध भूक्षेत्र है; ‘प्रदेश’ इस भौगोलिक अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הַשְּׁפֵלָה
  choice: निचला मैदानी क्षेत्र
  rationale: यह शब्द यहूदा के विशिष्ट निम्नवर्ती पहाड़ी-पाद क्षेत्र, शेफेला, का नाम है; मुख्य पाठ में अर्थ स्पष्ट किया गया और नाम को पादटिप्पणी में रखा गया है।
- source_word: הָהָר
  choice: पहाड़ी प्रदेश
  rationale: क्षेत्रीय सूची में यह किसी एक पहाड़ के बजाय यहूदा के पहाड़ी भूभाग को दर्शाता है।
- source_word: הַנֶּגֶב
  choice: नेगेव
  rationale: यह दक्षिणी यहूदा के विशिष्ट भौगोलिक क्षेत्र का नाम है; केवल ‘दक्षिण’ कहने से उसका स्थाननाम-संबंधी बल खो सकता है।
- source_word: מְבִאִים
  choice: लाएँगे
  rationale: सहभागी कृदंत आने वाले लोगों द्वारा साथ लाए जा रहे चढ़ावों की क्रिया बताता है; हिन्दी में मुख्य भविष्यकालीन क्रिया के रूप में इसे सहज बनाया गया है।
- source_word: עוֹלָה
  choice: होमबलियाँ
  rationale: यह पूर्णतः वेदी पर जलाए जाने वाले चढ़ावे की तकनीकी बलिदानी संज्ञा है; एकवचन यहाँ सामूहिक है, इसलिए बहुवचन उपयुक्त है।
- source_word: זֶבַח
  choice: बलिदान
  rationale: यह वध किए जाने वाले बलिदानों की श्रेणी को दर्शाता है; निकटवर्ती होमबलि से इसे अलग रखा गया है।
- source_word: מִנְחָה
  choice: अन्नबलियाँ
  rationale: मंदिर-उपासना की सूची में מִנְחָה सामान्यतः अनाज से तैयार चढ़ावे को सूचित करता है।
- source_word: לְבוֹנָה
  choice: लोबान
  rationale: यह सामान्य धूप नहीं, विशेष रूप से frankincense नामक सुगंधित गोंद है; ‘लोबान’ इसका प्रचलित हिन्दी नाम है।
- source_word: תּוֹדָה
  choice: धन्यवाद-बलियाँ
  rationale: बलिदानी संदर्भ में यह केवल मौखिक धन्यवाद नहीं, धन्यवाद या कृतज्ञता की बलि को दर्शाता है।
- source_word: בֵּית יְהוָה
  choice: याहवे का भवन
  rationale: בַּיִת का मूल रूपक ‘भवन/घर’ बनाए रखते हुए मंदिर का संदर्भ पादटिप्पणी में स्पष्ट किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु; यहोवा
  rationale: मूल पाठ में चार-अक्षरीय व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसका पारदर्शी लिप्यंतरण है और उसे उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और उपासना-संदर्भ के अनुकूल गरिमापूर्ण रखी गई है। भौगोलिक सूची की समानांतर संरचना बनाए रखी गई है। अंग्रेज़ी परामर्श पाठ में पादटिप्पणी-चिह्न अपने संबंधित पदों से विस्थापित प्रतीत होते हैं; हिन्दी मुख्य पाठ में [a] शेफेला, [b] नेगेव और [c] याहवे के भवन के साथ सही स्थान पर लगाए गए हैं।
