source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה אָר֤וּר הַ/גֶּ֨בֶר֙ אֲשֶׁ֣ר יִבְטַ֣ח בָּֽ/אָדָ֔ם וְ/שָׂ֥ם בָּשָׂ֖ר זְרֹע֑/וֹ וּ/מִן יְהוָ֖ה יָס֥וּר לִבּֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/005.yaml
  text: 'Thus says Yahweh: Cursed is the man who trusts in man and makes flesh his strength[b][a], whose heart turns away from Yahweh.'
translation:
  language: hi
  text: 'याहवे यों कहता है:


    “शापित है वह पुरुष जो मनुष्य पर भरोसा रखता है[a],


    और शरीर को अपना बल बनाता है[b],


    और जिसका हृदय याहवे से दूर हो जाता है।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘पुरुष’ और ‘मनुष्य’ के लिए इब्रानी में पुल्लिंग एकवचन शब्द हैं, पर यहाँ उनका प्रयोग प्रतिनिधिक अर्थ में सभी लोगों के लिए हुआ है।
    reason: cultural_note
  - marker: b
    text: इब्रानी में शाब्दिक रूप से, “शरीर को अपनी भुजा बनाता है।” यहाँ “भुजा” बल या सामर्थ्य का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: याहवे यह कहता है
  rationale: यह भविष्यवाणी की मानक संदेशवाहक उद्घोषणा है। वर्तमान काल का ‘कहता है’ सूत्र की जीवंतता बनाए रखता है, और יְהוָה को व्यक्तिगत नाम ‘याहवे’ के रूप में प्रस्तुत करता है।
- source_word: אָרוּר
  choice: शापित
  rationale: यह वाचा-संबंधी और न्यायिक गंभीरता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הַגֶּבֶר
  choice: वह पुरुष
  rationale: גֶּבֶר व्याकरण की दृष्टि से पुल्लिंग एकवचन है और यहाँ प्रतिनिधिक अर्थ में प्रयुक्त है। ‘पुरुष’ स्रोत-रूप को बनाए रखता है; पादटिप्पणी इसके व्यापक अनुप्रयोग को स्पष्ट करती है।
- source_word: יִבְטַח בָּאָדָם
  choice: मनुष्य पर भरोसा रखता है
  rationale: यह मनुष्य पर निर्भरता और याहवे पर निर्भरता के बीच के विरोध को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְשָׂם בָּשָׂר זְרֹעוֹ
  choice: और शरीर को अपना बल बनाता है
  rationale: ‘शरीर’ नश्वर मानवीय दुर्बलता की मूल छवि को बनाए रखता है, जबकि ‘बल’ זְרוֹעַ (‘भुजा’) के प्रसंगगत मुहावरेदार अर्थ को संप्रेषित करता है।
- source_word: וּמִן יְהוָה יָסוּר לִבּוֹ
  choice: और जिसका हृदय याहवे से दूर हो जाता है
  rationale: ‘हृदय’ इच्छा, निष्ठा और भीतरी व्यक्ति की बाइबलीय धारणा को बनाए रखता है। सम्बन्धवाचक रचना हिन्दी में इस पूरे वर्णन को ‘उस पुरुष’ से सहज रूप से जोड़ती है।
theological_decisions:
- issue: प्रतिनिधिक पुल्लिंग भाषा
  choice: वह पुरुष जो मनुष्य पर भरोसा रखता है
  alternative: वह व्यक्ति जो इंसानों पर भरोसा रखता है
  rationale: मूल पाठ גֶּבֶר और אָדָם के पुल्लिंग एकवचन रूपों का प्रतिनिधिक अर्थ में प्रयोग करता है। अनुवाद स्रोत का रूप बनाए रखता है और पादटिप्पणी स्पष्ट करती है कि चेतावनी केवल पुरुषों तक सीमित नहीं है।
- issue: זְרֹעוֹ की शाब्दिक छवि और मुहावरेदार अर्थ
  choice: अपना बल
  alternative: अपनी भुजा
  rationale: ‘भुजा’ मूल शब्द का शाब्दिक अर्थ है, पर यहाँ वह शक्ति या सहारे का मुहावरा है। मुख्य पाठ में ‘बल’ अर्थ को स्पष्ट रखता है और पादटिप्पणी मूल छवि को सुरक्षित करती है।
- issue: בָּשָׂר का आशय
  choice: शरीर
  alternative: नश्वर मनुष्य
  rationale: यहाँ ‘शरीर’ पापी स्वभाव की तकनीकी धारणा नहीं, बल्कि नश्वर मानवीय सामर्थ्य को सूचित करता है। मूल छवि को बनाए रखने से मनुष्य और याहवे पर भरोसे का विरोध खुला रहता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी अपनाई गई है। भविष्यवाणी की काव्यात्मक लय के लिए पंक्ति-विभाजन रखा गया है। ‘याहवे’, ‘शापित’, ‘हृदय’ और ‘शरीर’ जैसे प्रमुख बाइबलीय शब्द सुरक्षित रखे गए हैं, जबकि कठिन इब्रानी मुहावरे को मुख्य पाठ में अर्थ-स्पष्ट रूप दिया गया है।
