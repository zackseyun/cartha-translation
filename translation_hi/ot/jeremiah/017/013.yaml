id: JER.17.13
reference: Jeremiah 17:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: מִקְוֵ֤ה יִשְׂרָאֵל֙ יְהוָ֔ה כָּל עֹזְבֶ֖י/ךָ יֵבֹ֑שׁוּ יסור/י בָּ/אָ֣רֶץ יִכָּתֵ֔בוּ כִּ֥י עָזְב֛וּ מְק֥וֹר מַֽיִם חַיִּ֖ים אֶת יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/013.yaml
  text: O Yahweh[a], the hope of Israel, all who forsake you will be put to shame; those who turn away from you will be written in the earth, because they have forsaken Yahweh[c][b], the fountain of living waters.
translation:
  language: hi
  text: 'हे याहवे, इस्राएल की आशा,


    जितने तुझे त्यागते हैं, वे लज्जित होंगे;


    जो मुझसे विमुख होते हैं[a],


    वे धरती पर लिखे जाएँगे[b],


    क्योंकि उन्होंने जीवन-जल के सोते,


    याहवे को त्याग दिया है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो तुझसे विमुख होते हैं।” यहाँ इब्रानी पाठ कठिन है; मुख्य पाठ मसोरी परंपरा के प्रथम-पुरुष पाठ “मुझसे” को रखता है।
    reason: textual_variant
  - marker: b
    text: या, “देश में लिखे जाएँगे।” यह अभिव्यक्ति मिट्टी पर बने क्षणभंगुर लेख की ओर संकेत कर सकती है, जो स्थायी स्मरण के विपरीत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְוֵה
  choice: आशा
  rationale: यहाँ संज्ञा याहवे के लिए उपाधि के रूप में प्रयुक्त है; इसलिए इसके ठोस अर्थ ‘जलाशय’ के बजाय आलंकारिक अर्थ ‘आशा’ उपयुक्त है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: עֹזְבֶיךָ
  choice: जो कोई तुझे त्यागते हैं
  rationale: कृदन्त निरंतर या चरित्रगत त्याग को व्यक्त करता है; यह हिंदी में स्वाभाविक रहते हुए वाचा-संबंधी विश्वासघात की गंभीरता बनाए रखता है।
- source_word: יֵבֹשׁוּ
  choice: लज्जित होंगे
  rationale: क्रिया अपमानित या निराश सिद्ध होने का भाव रखती है। ‘लज्जित होंगे’ मूल की सक्रिय अस्पष्टता को अनावश्यक कर्मवाच्य बनाए बिना सुरक्षित रखता है।
- source_word: יסורי
  choice: जो मुझसे विमुख होते हैं
  rationale: कठिन मसोरी पाठ के प्रथम-पुरुष अर्थ को मुख्य पाठ में रखा गया है। ‘विमुख होना’ दिशा बदलने और निष्ठा छोड़ने, दोनों भावों को सहज हिंदी में व्यक्त करता है।
- source_word: בארץ יכתבו
  choice: उनके नाम धरती पर लिखे जाएँगे
  rationale: निफ़अल क्रिया का कर्मवाच्य रूप रखा गया है। हिंदी में ‘उनके नाम’ जोड़ना लिखे जाने वाले व्यक्तियों का स्वाभाविक अर्थ स्पष्ट करता है, और ‘धरती’ क्षणभंगुर लेख की छवि बनाए रखती है।
- source_word: מְקוֹר מַיִם חַיִּים
  choice: जीवन-जल का सोता
  rationale: ‘सोता’ भूमिगत स्रोत से निकलते ताजे, बहते जल की ठोस छवि देता है। ‘जीवन-जल’ मूल के ‘जीवित जल’ रूपक और उसके धर्मवैचारिक अनुनाद को स्वाभाविक हिंदी में बनाए रखता है।
theological_decisions:
- issue: विमुख होने वालों के संबंध में प्रथम या द्वितीय पुरुष
  choice: मुख्य पाठ में ‘मुझसे’
  alternative: ‘तुझसे’
  rationale: मसोरी परंपरा से समर्थित कठिन प्रथम-पुरुष पाठ को पूर्ववर्ती द्वितीय-पुरुष संबोधन के अनुरूप बनाकर समतल नहीं किया गया। इससे वक्ता-संबंधी वास्तविक पाठगत तनाव सुरक्षित रहता है।
- issue: याहवे और जीवन-जल के सोते का संबंध
  choice: ‘जीवन-जल के सोते, याहवे’ को समानाधिकरण के रूप में रखना
  alternative: ‘याहवे को, जो जीवन-जल का सोता है’
  rationale: मूल की काव्यात्मक पहचान को सीधे रखा गया है और व्याख्यात्मक संबंधवाचक उपवाक्य जोड़ने से बचा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में काव्य-पंक्तियों का विन्यास रखा गया है। संबोधन में श्रद्धापूर्ण किंतु मूल के एकवचन के अनुरूप ‘तू/तुझे’ रूप अपनाया गया है। भाषा सरल और गरिमापूर्ण है; कठिन प्रथम-पुरुष पाठ तथा ‘धरती/देश’ की अर्थ-संभावना को टिप्पणियों में सुरक्षित रखा गया है।
