    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּהְיֵה
  choice: न बन
  rationale: निषेधवाचक אַל के साथ imperfect रूप यहाँ प्रार्थनापूर्ण निषेध व्यक्त करता है। हिंदी में ‘न बन’ संक्षिप्त, स्वाभाविक और भाव के अनुरूप है।
- source_word: לִי
  choice: मेरे लिए
  rationale: לִי संबंध अथवा वक्ता पर पड़ने वाले प्रभाव को दर्शाता है; ‘मेरे लिए’ आधुनिक हिंदी में स्पष्ट है।
- source_word: לִמְחִתָּה
  choice: आतंक का कारण
  rationale: מְחִתָּה में आतंक, घबराहट और विनाशकारी टूटन के अर्थ समाहित हो सकते हैं। ‘आतंक का कारण’ इस प्रार्थना में यह भाव स्वाभाविक रूप से व्यक्त करता है कि परमेश्वर स्वयं यिर्मयाह के लिए भय का स्रोत न बने।
- source_word: מַחֲסִי
  choice: मेरा शरणस्थान
  rationale: מַחֲסֶה आश्रय या शरण की जगह को दर्शाता है। ‘शरणस्थान’ dignified, स्पष्ट और संज्ञा के स्थानगत भाव को सुरक्षित रखता है।
- source_word: אַתָּה
  choice: तू ही ... है
  rationale: स्वतंत्र सर्वनाम אַתָּה पर बल है। ‘तू ही’ उस बल को हिंदी में व्यक्त करता है; ‘तू’ प्रार्थना और पारंपरिक बाइबलीय संबोधन में निकटता तथा गंभीरता रखता है।
- source_word: בְּיוֹם רָעָה
  choice: विपत्ति के दिन
  rationale: यह पदबंध संकट या अनिष्ट के समय को दर्शाता है। ‘विपत्ति के दिन’ आधुनिक हिंदी में सहज है और רָעָה को नैतिक बुराई समझने से बचाता है।
theological_decisions:
- issue: רָעָה को नैतिक ‘बुराई’ माना जाए या संकट/विपत्ति
  choice: विपत्ति
  alternative: बुराई; संकट; अनर्थ
  rationale: संदर्भ में यह शब्द प्रतिकूल परिस्थिति और न्यायजनित संकट का सूचक है, नैतिक दुष्टता का नहीं। ‘विपत्ति’ उस अर्थ को स्पष्ट रखते हुए धार्मिक निष्कर्ष नहीं थोपता।
- issue: מְחִתָּה के आतंक और विनाश के अर्थों के बीच चयन
  choice: आतंक का कारण
  alternative: भय; घबराहट का कारण; विनाश
  rationale: प्रार्थना का प्रत्यक्ष भाव परमेश्वर के यिर्मयाह के लिए भय या घबराहट का स्रोत न बनने का है। फिर भी शब्द में संभावित ‘विनाश’ का अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में प्रार्थनापूर्ण, गरिमामय और सामान्य पाठक के लिए सुबोध शैली। परमेश्वर के लिए ‘तू’ का प्रयोग निकट, प्रत्यक्ष संबोधन तथा אַתָּה के बल को व्यक्त करता है।
