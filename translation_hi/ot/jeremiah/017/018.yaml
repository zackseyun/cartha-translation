id: JER.17.18
reference: Jeremiah 17:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יֵבֹ֤שׁוּ רֹדְפַ/י֙ וְ/אַל אֵבֹ֣שָׁה אָ֔נִי יֵחַ֣תּוּ הֵ֔מָּה וְ/אַל אֵחַ֖תָּה אָ֑נִי הָבִ֤יא עֲלֵי/הֶם֙ י֣וֹם רָעָ֔ה וּ/מִשְׁנֶ֥ה שִׁבָּר֖וֹן שָׁבְרֵֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/018.yaml
  text: Let my pursuers be put to shame[a], but let me not be put to shame; let them be dismayed, but let me not be dismayed. Bring upon them a day of disaster[c][b], and shatter them with double destruction.
translation:
  language: hi
  text: मेरे पीछा करनेवाले लज्जित हों[a], पर मैं लज्जित न होऊँ; वे भयभीत हों, पर मैं भयभीत न होऊँ। उन पर विपत्ति का दिन[b] ले आ, और दुगुने विनाश से उन्हें चकनाचूर कर दे।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मुझे सतानेवाले।’ इब्रानी का शाब्दिक अर्थ है ‘मेरा पीछा करनेवाले।’
    reason: lexical_alternative
  - marker: b
    text: या ‘संकट का दिन।’ यहाँ आशय नैतिक बुराई से नहीं, न्याय और विनाश लानेवाली विपत्ति से है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, ‘दुगुने टूटने से उन्हें तोड़ दे।’
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ / אֵבֹשָׁה
  choice: लज्जित हों / लज्जित न होऊँ
  rationale: בושׁ अपमानित, निराश या लज्जित होने का भाव दे सकता है। समानांतर विनती को बनाए रखते हुए ‘लज्जित’ बाहरी अपमान और पराजय, दोनों को समेटता है।
- source_word: רֹדְפַי
  choice: मेरे पीछा करनेवाले
  rationale: רדף का मूल चित्र किसी का पीछा करने का है। यह अनुवाद उस ठोस क्रिया-चित्र को बनाए रखता है; संदर्भ में ये सतानेवाले भी हैं।
- source_word: יֵחַתּוּ / אֵחַתָּה
  choice: भयभीत हों / भयभीत न होऊँ
  rationale: נפעל रूप में חתת टूट जाने, घबरा जाने या भयभीत होने का भाव देता है। यहाँ ‘भयभीत’ भावनात्मक विघटन को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הָבִיא עֲלֵיהֶם
  choice: उन पर ... ले आ
  rationale: בוא के हिफ़ील आज्ञार्थक और עַל का संयोजन किसी घटना को उन पर लाने की सीधी प्रार्थना है।
- source_word: יוֹם רָעָה
  choice: विपत्ति का दिन
  rationale: यहाँ רָעָה नैतिक बुराई नहीं, बल्कि संकट, न्याय और विनाशकारी विपत्ति को सूचित करता है।
- source_word: מִשְׁנֶה
  choice: दुगुने
  rationale: מִשְׁנֶה दुगुनेपन या दोहरे परिमाण को दर्शाता है; ‘दुगुने’ मूल की तीव्रता को संक्षेप में बनाए रखता है।
- source_word: שִׁבָּרוֹן
  choice: विनाश
  rationale: यह संज्ञा टूटने, चूर होने या बरबादी का भाव देती है। न्याय के इस संदर्भ में ‘विनाश’ परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שָׁבְרֵם
  choice: उन्हें चकनाचूर कर दे
  rationale: שׁבר का अर्थ ‘तोड़ना’ है। ‘चकनाचूर कर दे’ बलपूर्ण रूपक को बनाए रखता है और सजातीय संज्ञा שִׁבָּרוֹן से उसके संबंध को भी सुनाई देता है।
theological_decisions:
- issue: शत्रुओं पर न्याय की अभिशापात्मक प्रार्थना
  choice: यिर्मयाह की ओर से परमेश्वर को संबोधित न्याय की सीधी और कठोर प्रार्थना के रूप में प्रस्तुत किया गया है।
  alternative: इसे केवल सामान्य न्याय-स्थापन या व्यक्तिगत निर्दोषता की नरम इच्छा बना देना।
  rationale: इब्रानी में इच्छार्थक क्रियाएँ और सीधा आज्ञार्थक रूप हैं। इसलिए भविष्यद्वक्ता की व्यक्तिगत निर्दोषता की पुकार और शत्रुओं पर ईश्वरीय न्याय की माँग के बीच का धर्मवैज्ञानिक तनाव नरम नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, प्रार्थनात्मक और तीखा भविष्यद्वक्तापरक स्वर रखा गया है। समानांतर वाक्य-विन्यास और मूल के टूटने/चकनाचूर होने के बलपूर्ण बिंब को यथासंभव सुरक्षित रखा गया है।
