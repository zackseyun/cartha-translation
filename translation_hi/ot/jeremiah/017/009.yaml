id: JER.17.9
reference: Jeremiah 17:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: עָקֹ֥ב הַ/לֵּ֛ב מִ/כֹּ֖ל וְ/אָנֻ֣שׁ ה֑וּא מִ֖י יֵדָעֶֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/009.yaml
  text: The heart is more deceitful than anything else[c][b][a], and desperately sick—who can know it?
translation:
  language: hi
  text: हृदय हर चीज़ से बढ़कर छलपूर्ण है[a][b] और असाध्य रोग से ग्रस्त है—उसे कौन जान सकता है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘हृदय’ विचार, इच्छा और अभिलाषा सहित मनुष्य के भीतरी व्यक्तित्व को दर्शाता है, केवल भावनाओं को नहीं।
    reason: cultural_note
  - marker: b
    text: या, “गंभीर रूप से रोगग्रस्त है।” इब्रानी शब्द किसी घोर बीमारी अथवा ऐसी दशा का संकेत दे सकता है जिसका उपचार सम्भव न हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: עָקֹב
  choice: छलपूर्ण
  rationale: यह शब्द नैतिक टेढ़ेपन और धोखा देने की प्रवृत्ति व्यक्त करता है; ‘छलपूर्ण’ आधुनिक हिन्दी में स्वाभाविक रहते हुए मूल अर्थ को बनाए रखता है।
- source_word: הַלֵּב
  choice: हृदय
  rationale: इब्रानी प्रयोग में यह केवल भावनाओं को नहीं, बल्कि विचार, इच्छा और अभिलाषा सहित भीतरी मनुष्य को सूचित करता है। ‘हृदय’ बाइबिलीय रूपक को सुरक्षित रखता है।
- source_word: מִכֹּל
  choice: हर चीज़ से बढ़कर
  rationale: मिन् के तुलनात्मक प्रयोग और कोल की व्यापकता को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है; इससे अतिशयोक्तिपूर्ण तुलनात्मक बल बना रहता है।
- source_word: וְאָנֻשׁ
  choice: और असाध्य रोग से ग्रस्त
  rationale: אָנֻשׁ गंभीर रूप से रोगग्रस्त अथवा उपचार से परे होने का अर्थ दे सकता है। यह अनुवाद रोग के मूल रूपक और ‘असाध्य’ की सम्भावना दोनों को बनाए रखता है, बिना इसे सीधे ‘दुष्ट’ कहे।
- source_word: הוּא
  choice: है
  rationale: हिन्दी वाक्य में ‘हृदय’ के साथ विधेय को स्वाभाविक रूप से जोड़ते हुए सर्वनाम का कार्य सुरक्षित है; अलग से ‘वह’ कहना अनावश्यक होगा।
- source_word: מִי יֵדָעֶנּוּ
  choice: उसे कौन जान सकता है?
  rationale: मूल के ‘कौन’ और ‘जानना’ को निकटता से रखता है तथा हृदय की वास्तविक दशा को पूरी तरह पहचान पाने पर उठे आलंकारिक प्रश्न का बल बनाए रखता है।
theological_decisions:
- issue: ‘हृदय’ का मानवशास्त्रीय आशय
  choice: ‘हृदय’ को बनाए रखना और पादटिप्पणी में उसके व्यापक भीतरी-मनुष्य संबंधी अर्थ को स्पष्ट करना।
  alternative: ‘मन’ या ‘अंतरात्मा’ कहना।
  rationale: मूल शब्द विचार, इच्छा और अभिलाषा सहित व्यक्ति के भीतरी केंद्र को दर्शाता है। ‘हृदय’ बाइबिलीय शब्दचित्र को सुरक्षित रखता है, जबकि टिप्पणी आधुनिक पाठक को इसे केवल भावनाओं तक सीमित करने से रोकती है।
- issue: אָנֻשׁ का अर्थ
  choice: ‘असाध्य रोग से ग्रस्त’ के रूप में गंभीर और उपचारातीत बीमारी का रूपक बनाए रखना।
  alternative: ‘अत्यन्त दुष्ट’ अथवा केवल ‘बहुत बीमार’।
  rationale: मूल शब्द रोग और असाध्यता का अर्थ देता है। इसे ‘दुष्ट’ कहना नैतिक निष्कर्ष को शब्द के सीधे अर्थ में मिला देता, जबकि ‘बहुत बीमार’ उपचारातीत होने की सम्भावना को कमजोर कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली। ‘हृदय’ से बाइबिलीय रूपक रखा गया है; ‘छलपूर्ण’ सामान्य पाठक के लिए स्पष्ट है। ‘असाध्य रोग से ग्रस्त’ मूल की रोग-संबंधी छवि और उसकी तीव्रता को सुरक्षित रखता है।
