  text: וְ/הָיָה֙ כְּ/עַרְעָ֣ר בָּֽ/עֲרָבָ֔ה וְ/לֹ֥א יִרְאֶ֖ה כִּי יָב֣וֹא ט֑וֹב וְ/שָׁכַ֤ן חֲרֵרִים֙ בַּ/מִּדְבָּ֔ר אֶ֥רֶץ מְלֵחָ֖ה וְ/לֹ֥א תֵשֵֽׁב־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/006.yaml
  text: He will be like a shrub in the desert[a], and he will not see when good comes. He will dwell in parched places in the wilderness[c][b], in a salt land that is not inhabited.
translation:
  language: hi
  text: वह मरुभूमि[c] में झाड़ी[a] के समान होगा, और जब भलाई आएगी, तब वह उसे नहीं देखेगा[b]। वह निर्जन प्रदेश के तपे हुए स्थानों में, ऐसी खारी भूमि में बसेगा जहाँ कोई नहीं रहता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘जुनिपर,’ ‘झाऊ,’ अथवा ‘बंजर झाड़ी’; इब्रानी में बताए गए पौधे की ठीक पहचान अनिश्चित है।
    reason: lexical_alternative
  - marker: b
    text: या ‘जब सुख-समृद्धि आएगी, तब वह उसे पहचान नहीं पाएगा।’ इब्रानी का शाब्दिक अर्थ है, ‘जब भलाई आएगी, तब वह उसे नहीं देखेगा।’
    reason: lexical_alternative
  - marker: c
    text: या ‘अरावा में,’ यदि इसे सामान्य मरुभूमि के बजाय विशिष्ट भौगोलिक क्षेत्र का नाम माना जाए।
    reason: alternative_reading
lexical_decisions:
- source_word: כְּעַרְעָר
  choice: एक झाड़ी के समान
  rationale: यह इब्रानी शब्द मरुस्थलीय पौधे या झाड़ी को सूचित करता है, पर उसकी ठीक प्रजाति अनिश्चित है। ‘झाड़ी’ चित्र को बनाए रखता है और किसी विवादित वनस्पति-पहचान को निश्चित नहीं करता।
- source_word: בָּעֲרָבָה
  choice: मरुभूमि में
  rationale: עֲרָבָה किसी विशिष्ट भौगोलिक क्षेत्र ‘अरावा’ या सामान्यतः शुष्क मरुस्थलीय भूभाग को सूचित कर सकता है। यहाँ काव्यात्मक उपमा में सामान्य अर्थ स्वाभाविक है; विशिष्ट भौगोलिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: וְלֹא יִרְאֶה כִּי יָבוֹא טוֹב
  choice: और जब भलाई आएगी, तब वह उसे नहीं देखेगा
  rationale: ‘देखना’ और ‘भलाई’ को बनाए रखने से मूल का चित्र और उसकी व्यापकता सुरक्षित रहती है; संदर्भ में इसका भाव आने वाली समृद्धि को न पहचानना या उसका लाभ न पाना भी हो सकता है।
- source_word: וְשָׁכַן
  choice: बसेगा
  rationale: שׁכן का अर्थ बसना या निवास करना है। ‘बसेगा’ भावी क्रिया और स्थान-संबंधी काव्यात्मक चित्र दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: חֲרֵרִים
  choice: झुलसे स्थानों में
  rationale: यह शब्द सूखे, तपे या उजाड़ स्थानों का बोध कराता है। ‘झुलसे स्थान’ गर्मी और निर्जनता का सजीव चित्र देता है, बिना भूभाग की प्रकृति को अनावश्यक रूप से निश्चित किए।
- source_word: בַּמִּדְבָּר
  choice: निर्जन प्रदेश के
  rationale: מִדְבָּר निर्जन या मरुस्थलीय प्रदेश को सूचित करता है। पहले प्रयुक्त ‘मरुभूमि’ की अनावश्यक पुनरावृत्ति से बचते हुए ‘निर्जन प्रदेश’ मूल अर्थ को बनाए रखता है।
- source_word: אֶרֶץ מְלֵחָה
  choice: खारी भूमि
  rationale: यह पद लवणयुक्त और इस कारण अनुपजाऊ भूमि का चित्र प्रस्तुत करता है। ‘खारी भूमि’ आधुनिक हिन्दी में संक्षिप्त और स्पष्ट है।
- source_word: וְלֹא תֵשֵׁב
  choice: जहाँ कोई नहीं रहता
  rationale: स्त्रीलिंग एकवचन क्रिया ‘भूमि’ से संबंधित है और उसके आबाद न होने का अर्थ देती है। सम्बन्धवाचक उपवाक्य हिन्दी में स्वाभाविक रूप से यही भाव व्यक्त करता है।
theological_decisions:
- issue: आने वाली ‘भलाई’ का आशय
  choice: ‘भलाई’ को व्यापक अर्थ में रखा गया है
  alternative: ‘समृद्धि’ या ‘सुख-समृद्धि’
  rationale: טוֹב का अर्थ संदर्भ में समृद्धि हो सकता है, पर मूल शब्द अधिक व्यापक है। अनुवाद उस व्यापकता और व्यक्ति के उसे न देखने की काव्यात्मक विडंबना को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। मूल के मरुस्थलीय काव्य-चित्र, ‘देखने’ के रूपक और ‘भलाई’ की अर्थगत व्यापकता को बनाए रखा गया है; विवादित वनस्पति तथा ‘अरावा’ की भौगोलिक संभावना पादटिप्पणियों में दी गई है।
