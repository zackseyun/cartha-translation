base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/004.yaml
  text: And you[a] yourself will let go of your inheritance that I gave you, and I will make you serve your enemies in a land that you have not known; for you have kindled a fire in my anger[d][c][b]—it will burn forever.
translation:
  language: hi
  text: और तुम स्वयं उस विरासत को छोड़ दोगे[a] जो मैंने तुम्हें दी थी, और मैं तुमसे तुम्हारे शत्रुओं की सेवा ऐसे देश में करवाऊँगा जिसे तुम नहीं जानते; क्योंकि तुम सबने मेरे क्रोध की आग भड़का दी है[b][c]—वह सदा जलती रहेगी[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपनी विरासत को हाथ से जाने दोगे/त्याग दोगे।” हिब्रू क्रिया में छोड़ देने या पकड़ ढीली कर देने का चित्र है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ हिब्रू एकवचन “तुम” से बहुवचन “तुम सबने” पर आ जाता है; संभवतः पहले यहूदा को एक व्यक्ति के रूप में और फिर उसके लोगों को सामूहिक रूप से संबोधित किया गया है।
    reason: alternative_reading
  - marker: c
    text: या, “मेरे प्रकोप में।” हिब्रू में शाब्दिक शब्द “मेरी नाक/नथुने में” है, जो क्रोध का मुहावरा है।
    reason: lexical_alternative
  - marker: d
    text: या, “एक युग तक” अथवा “निरंतर।” हिब्रू עוֹלָם संदर्भ के अनुसार स्थायी, दीर्घ या अनिश्चित अवधि को दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַטְתָּה וּבְךָ
  choice: तुम स्वयं ... छोड़ दोगे
  rationale: שׁמט में छोड़ देने, हाथ से जाने देने या त्यागने का ठोस भाव है। कठिन वाक्यांश וּבְךָ को यहाँ संबोधित व्यक्ति पर बल देने वाले ‘तुम स्वयं’ के रूप में रखा गया है, न कि अनावश्यक रूप से साधनवाचक बनाया गया है।
- source_word: מִנַּחֲלָתְךָ
  choice: उस विरासत को
  rationale: נחלה पैतृक अथवा परमेश्वर से मिली हुई संपत्ति, विशेषकर भूमि, को दर्शाता है। ‘विरासत’ इसके भूमि-संबंधी और वाचा-संबंधी दोनों आयाम बनाए रखती है। हिंदी में ‘छोड़ना’ के साथ स्वाभाविक कर्म-रचना अपनाई गई है।
- source_word: אֲשֶׁר נָתַתִּי לָךְ
  choice: जो मैंने तुम्हें दी थी
  rationale: נתן का सीधा अर्थ ‘देना’ है। स्त्रीलिंग ‘दी’ का संबंध ‘विरासत’ से है; ‘थी’ उस पहले दिए जाने को आगामी दंड से अलग और स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: וְהַעֲבַדְתִּיךָ אֶת אֹיְבֶיךָ
  choice: मैं तुमसे तुम्हारे शत्रुओं की सेवा ... करवाऊँगा
  rationale: עבד का हिफ़ईल रूप कारणवाचक है—‘सेवा करवाना’। यह निर्वासन और शत्रुओं के अधीन होने के दंड को स्पष्ट रूप से व्यक्त करता है।
- source_word: בָּאָרֶץ אֲשֶׁר לֹא יָדָעְתָּ
  choice: ऐसे देश में जिसे तुम नहीं जानते
  rationale: ידע यहाँ परिचय अथवा अनुभवजन्य जानकारी का भाव देता है। ‘जिसे तुम नहीं जानते’ अनजाने विदेशी देश का स्वाभाविक आधुनिक हिंदी रूप है।
- source_word: אֵשׁ קְדַחְתֶּם
  choice: तुम सबने ... आग भड़का दी है
  rationale: קדח आग जलाने या भड़काने को व्यक्त करता है। ‘तुम सबने’ हिब्रू के बहुवचन को स्पष्ट रखता है और पहले आए एकवचन ‘तुम’ से हुए परिवर्तन को मिटाता नहीं।
- source_word: בְּאַפִּי
  choice: मेरे क्रोध में
  rationale: אַף का शाब्दिक अर्थ नाक/नथुना है, पर यह हिब्रू मुहावरे में क्रोध को दर्शाता है। ‘मेरे क्रोध में’ अर्थनिष्ठ और गरिमापूर्ण हिंदी है।
- source_word: עַד עוֹלָם תּוּקָד
  choice: वह सदा तक जलती रहेगी
  rationale: עוֹלָם यहाँ दीर्घ, अनिश्चित अथवा स्थायी अवधि व्यक्त करता है; תּוּקָד आग के जारी रहने की ओर संकेत करता है। ‘सदा तक जलती रहेगी’ उस निरंतर परिणाम को स्वाभाविक हिंदी में रखता है।
theological_decisions:
- issue: संबोधन में दूसरे पुरुष एकवचन से बहुवचन का परिवर्तन
  choice: पहले भाग में एकवचन ‘तुम’ और आरोप में स्पष्ट बहुवचन ‘तुम सबने’ रखा गया है।
  alternative: पूरे पद में केवल एकवचन ‘तुम’ कर देना।
  rationale: हिब्रू पाठ पहले यहूदा को मानो एक व्यक्ति के रूप में संबोधित करता है, फिर קְדַחְתֶּם में लोगों को सामूहिक रूप से बहुवचन में दोषी ठहराता है। इस तनाव को समतल नहीं किया गया।
- issue: עַד עוֹלָם की अवधि
  choice: मुख्य पाठ में ‘सदा तक’ रखा गया है।
  alternative: ‘एक युग तक’ या ‘लगातार’।
  rationale: न्याय की इस भविष्यवाणी में वाक्यांश खुली और दीर्घ अवधि का प्रबल भाव देता है। शब्द की संदर्भगत लोच को पादटिप्पणी में बताया गया है, मुख्य पाठ में कमजोर नहीं किया गया।
- issue: क्रोध की आग का संबंध
  choice: लोगों ने परमेश्वर के क्रोध में आग भड़काई, और वही आग जलती रहेगी।
  alternative: वाक्य को इस प्रकार व्याख्यायित करना कि लोग केवल स्वयं क्रोधित हुए थे।
  rationale: בְּאַפִּי में प्रथम पुरुष प्रत्यय इसे परमेश्वर के क्रोध से जोड़ता है। रूपक को बिना किसी संप्रदायगत विस्तार के बनाए रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘विरासत’, ‘शत्रु’, ‘सेवा’ और ‘क्रोध’ जैसे परिचित बाइबलीय शब्द मूल के अर्थ-संबंधों को बनाए रखते हैं। एकवचन से बहुवचन का बदलाव ‘तुम सबने’ द्वारा सुनाई देता है; पादटिप्पणी चिह्न [a]–[d] सभी मुख्य पाठ में उपस्थित हैं।
