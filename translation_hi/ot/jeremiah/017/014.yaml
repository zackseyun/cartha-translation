id: JER.17.14
reference: Jeremiah 17:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: רְפָאֵ֤/נִי יְהוָה֙ וְ/אֵ֣רָפֵ֔א הוֹשִׁיעֵ֖/נִי וְ/אִוָּשֵׁ֑עָה כִּ֥י תְהִלָּתִ֖/י אָֽתָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/014.yaml
  text: Heal me[a], O Yahweh, and I will be healed; save me, and I will be saved[b], for you are my praise.
translation:
  language: hi
  text: हे याहवे, मुझे चंगा कर, और मैं चंगा हो जाऊँगा; मुझे बचा[a], और मैं बच जाऊँगा, क्योंकि तू ही मेरी स्तुति है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मुझे छुड़ा … और मैं छुड़ाया जाऊँगा।” इब्रानी क्रिया का अर्थ व्यापक रूप से बचाना या छुड़ाना भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “क्योंकि मैं तेरी ही स्तुति करता हूँ।” इब्रानी में शाब्दिक रूप से “क्योंकि तू मेरी स्तुति है” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רְפָאֵנִי
  choice: मुझे चंगा कर
  rationale: यह רפא का आज्ञार्थक रूप है, जिसके साथ प्रथम पुरुष एकवचन प्रत्यय है। ‘चंगा कर’ शारीरिक और रूपकात्मक—दोनों अर्थों की संभावना बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित रूप ‘यहोवा’ परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- source_word: וְאֵרָפֵא
  choice: और मैं चंगा हो जाऊँगा
  rationale: निफ़अल अपूर्ण रूप पहली विनती के परिणाम को व्यक्त करता है; यह अनुवाद कर्तृवाच्य बनाए बिना उस परिणाम को स्वाभाविक हिन्दी में रखता है।
- source_word: הוֹשִׁיעֵנִי
  choice: मुझे बचा
  rationale: ישׁע का हिफ़ील आज्ञार्थक रूप बचाने या छुड़ाने का व्यापक भाव रखता है। ‘बचा’ इस व्यापकता को संक्षिप्त और स्वाभाविक रूप में सुरक्षित रखता है।
- source_word: וְאִוָּשֵׁעָה
  choice: और मैं बच जाऊँगा
  rationale: यह निफ़अल रूप पूर्ववर्ती आज्ञा के परिणाम को व्यक्त करता और ‘चंगा कर ... चंगा हो जाऊँगा’ के समानांतर विन्यास को बनाए रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ כִּי विनती का आधार बताता है; ‘क्योंकि’ आधुनिक हिन्दी में इस संबंध को स्पष्ट और सहज बनाता है।
- source_word: תְהִלָּתִי
  choice: मेरी स्तुति
  rationale: शाब्दिक संज्ञात्मक अभिव्यक्ति ‘मेरी स्तुति’ मूल की संक्षिप्तता और संभावित अर्थ-तनाव को बनाए रखती है; अधिक व्याख्यात्मक अर्थ पादटिप्पणी में दिया गया है।
- source_word: אַתָּה
  choice: तू ही ... है
  rationale: स्वतंत्र सर्वनाम का बल हिन्दी में ‘ही’ से स्वाभाविक रूप से व्यक्त होता है। प्रार्थना के निकट और काव्यात्मक संबोधन में ‘तू’ उपयुक्त है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम है। हिन्दी पाठक-वर्ग में पहचाने जाने वाले ‘यहोवा’ से नाम को उपाधि ‘प्रभु’ में बदलने से बचा गया है।
- issue: הוֹשִׁיעֵנִי में उद्धार का दायरा
  choice: मुझे बचा
  alternative: मुझे छुड़ा
  rationale: ‘बचा’ तात्कालिक संकट से छुटकारे और व्यापक उद्धार—दोनों की संभावना खुली रखता है; ‘छुड़ा’ प्रसंग को केवल बाहरी संकट तक सीमित कर सकता है।
- issue: תְהִלָּתִי की संज्ञात्मक अभिव्यक्ति
  choice: तू ही मेरी स्तुति है
  alternative: मैं तेरी ही स्तुति करता हूँ
  rationale: मुख्य पाठ में मूल का शाब्दिक और धर्मवैचारिक रूप से सघन कथन रखा गया है। वैकल्पिक क्रियात्मक अर्थ को पादटिप्पणी में बताया गया है, ताकि अस्पष्टता चुपचाप समाप्त न हो।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और प्रार्थनात्मक हिन्दी। समानांतर काव्य-विन्यास को बनाए रखने के लिए ‘मुझे चंगा कर ... मुझे बचा’ तथा ‘मैं ... हो जाऊँगा’ का संतुलन रखा गया है। ईश्वर को संबोधन में निकटता और काव्यपरंपरा के अनुरूप ‘तू’ प्रयुक्त है।
