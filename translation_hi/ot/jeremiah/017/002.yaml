base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/002.yaml
  text: As their children remember their altars and their Asherim beside every green tree[a], on the high hills,
translation:
  language: hi
  text: जब उनके बच्चे उनकी वेदियों और उनके अशेरीम[a] को याद करते हैं, जो हर हरे-भरे वृक्ष के पास और ऊँची पहाड़ियों पर हैं,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अशेरा-खंभे’ अथवा ‘पवित्र खंभे।’ इब्रानी शब्द अशेरा से जुड़ी उपासना-वस्तुओं को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּזְכֹּר
  choice: जब ... याद करते हैं
  rationale: כְּ के साथ זכר का infinitive construct यहाँ समय अथवा साथ-साथ चल रही परिस्थिति व्यक्त करता है। हिन्दी में ‘जब ... याद करते हैं’ स्वाभाविक है और पिछले पद से जुड़े इस अधूरे वाक्य-संबंध को बनाए रखता है।
- source_word: בְּנֵיהֶם
  choice: उनके बच्चे
  rationale: בנים का अर्थ ‘पुत्र’ भी हो सकता है, पर यहाँ अगली पीढ़ी अथवा संतान का व्यापक अर्थ उपयुक्त है।
- source_word: מִזְבְּחוֹתָם
  choice: उनकी वेदियों
  rationale: מזבחות उपासना के लिए बनी वेदियों को दर्शाता है; सम्बन्धसूचक प्रत्यय को ‘उनकी’ से सुरक्षित रखा गया है।
- source_word: וַאֲשֵׁרֵיהֶם
  choice: और उनके अशेरा-चिह्नों
  rationale: यह बहुवचन अशेरा से जुड़ी उपासना-वस्तुओं को दर्शाता है। ‘चिह्न’ उनकी ठीक भौतिक बनावट तय किए बिना धार्मिक-सांस्कृतिक आशय बताता है; विकल्प पाद-टिप्पणी में दिए गए हैं।
- source_word: עַל עֵץ רַעֲנָן
  choice: हरे-भरे वृक्षों के पास
  rationale: इस उपासना-स्थल संबंधी प्रसंग में עַל निकटता सूचित कर सकता है। सामूहिक अर्थ वाले एकवचन עֵץ को सहज हिन्दी बहुवचन में और רַעֲנָן को ‘हरे-भरे’ से व्यक्त किया गया है।
- source_word: עַל גְּבָעוֹת הַגְּבֹהוֹת
  choice: ऊँची पहाड़ियों पर
  rationale: यह ऊँचे स्थानों पर स्थित उपासना-स्थलों का सीधा भौगोलिक वर्णन है।
theological_decisions:
- issue: אֲשֵׁרִים का मूर्तिपूजक उपासना के प्रसंग में अनुवाद
  choice: अशेरा-चिह्न
  alternative: अशेरा-खंभे; पूजा के पवित्र खंभे
  rationale: शब्द अशेरा से संबद्ध उपासना-वस्तुओं के लिए प्रयुक्त होता है, पर उनकी सटीक आकृति केवल इस पद से निश्चित नहीं होती। इसलिए मुख्य पाठ में लिप्यंतरित नाम के साथ व्यापक ‘चिह्न’ रखा गया है और अधिक विशिष्ट विकल्प पाद-टिप्पणी में दिए गए हैं।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। पद मूल में अगले कथन से जुड़ा हुआ वाक्यांश है, इसलिए अन्त में अल्पविराम रखा गया है। ‘जब’ कालगत संबंध को व्यक्त करता है और ‘अशेरा-चिह्न’ मूल शब्द की सांस्कृतिक विशिष्टता तथा वस्तु की अनिश्चित बनावट—दोनों को सुरक्षित रखता है।
