base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/019.yaml
  text: 'Thus Yahweh said to me: Go and stand in the gate of the people[a], by which the kings of Judah enter and by which they go out, and in all the gates of Jerusalem.'
translation:
  language: hi
  text: 'याहवे ने मुझसे यह कहा: “जा और लोगों के फाटक[a] में खड़ा हो, जिससे होकर यहूदा के राजा प्रवेश करते और निकलते हैं; और यरूशलेम के सभी फाटकों में भी खड़ा हो।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “लोगों के पुत्रों का फाटक”; संभवतः यह किसी विशेष फाटक का नाम है, जिसे अक्सर “लोगों का फाटक” समझा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה אֵלַי
  choice: याहवे ने मुझसे यह कहा
  rationale: यह भविष्यवाणी-संबंधी वचन का मानक आरंभ है। ‘याहवे’ मूल में आए परमेश्वर के निज नाम को प्रत्यक्ष रखता है।
- source_word: הָלֹךְ וְעָמַדְתָּ
  choice: जाकर ... खड़ा हो जा
  rationale: इन संयुक्त क्रियारूपों का आदेशात्मक बल है; हिंदी में यह क्रम स्वाभाविक और स्पष्ट है।
- source_word: בְּשַׁעַר בְּנֵי עָם
  choice: जन-द्वार
  rationale: शाब्दिक इब्रानी ‘लोगों के पुत्रों का फाटक’ कठिन और संभवतः किसी विशिष्ट द्वार का नाम है। ‘जन-द्वार’ संक्षिप्त नाम-सदृश रूप देता है, जबकि पाद-टिप्पणी मूल की अनिश्चितता सुरक्षित रखती है।
- source_word: אֲשֶׁר יָבֹאוּ בוֹ ... וַאֲשֶׁר יֵצְאוּ בוֹ
  choice: जिससे होकर ... भीतर आते और बाहर जाते हैं
  rationale: दोनों सापेक्ष उपवाक्यों में द्वार से होकर आने-जाने का मार्गगत अर्थ स्वाभाविक हिंदी में व्यक्त होता है।
- source_word: מַלְכֵי יְהוּדָה
  choice: यहूदा के राजा
  rationale: संबंधसूचक इब्रानी पदबंध का सीधा और प्रचलित हिंदी रूप।
- source_word: וּבְכֹל שַׁעֲרֵי יְרוּשָׁלִָם
  choice: और यरूशलेम के सभी फाटकों में भी
  rationale: וּבְ का संबंध पहले आदेश ‘खड़ा हो जा’ से है; ‘भी’ उस आदेश के नगर के अन्य सभी फाटकों तक विस्तार को स्पष्ट करता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला निज नाम प्रत्यक्ष है। ‘याहवे’ उसे उपाधि में बदले बिना और किसी विशिष्ट सांप्रदायिक व्याख्या को जोड़े बिना प्रस्तुत करता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिंदी। द्वार-संबंधी कठिन इब्रानी पदबंध को मुख्य पाठ में नाम-सदृश ‘जन-द्वार’ रखा गया है और उसकी शाब्दिक बनावट तथा अनिश्चितता पाद-टिप्पणी में दी गई है। अंतिम खंड में क्रिया मूल में दुहराई नहीं गई, पर हिंदी में अर्थ स्पष्ट रखने के लिए ‘खड़ा हो जा’ दोहराया गया है।
