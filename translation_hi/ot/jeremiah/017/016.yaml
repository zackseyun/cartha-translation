source:
  edition: WLC
  text: וַ/אֲנִ֞י לֹא אַ֣צְתִּי מֵ/רֹעֶ֣ה אַחֲרֶ֗י/ךָ וְ/י֥וֹם אָנ֛וּשׁ לֹ֥א הִתְאַוֵּ֖יתִי אַתָּ֣ה יָדָ֑עְתָּ מוֹצָ֣א שְׂפָתַ֔/י נֹ֥כַח פָּנֶ֖י/ךָ הָיָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/016.yaml
  text: But as for me[a], I did not hurry away from being a shepherd after you, and I did not desire the day of disaster; you know. What came from my lips was before your face.
translation:
  language: hi
  text: पर जहाँ तक मेरी बात है, मैं आपके पीछे चलकर चरवाही करने से जल्दी नहीं हटा, और मैंने विपत्ति के दिन[a] की लालसा नहीं की; आप यह जानते हैं। मेरे होंठों से निकली बात आपके सामने थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘घोर संकट का दिन’ अथवा ‘दुःख का दिन’। इब्रानी पद का शाब्दिक भाव किसी असाध्य, अत्यन्त पीड़ादायक या रोगग्रस्त दिन का है; यहाँ संभवतः विपत्ति अथवा न्याय का दिन अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַצְתִּי
  choice: पीछे नहीं हटा
  rationale: אוץ का मूल भाव जल्दी करने या दबाव में आगे बढ़ने का है। מִן के साथ इस संदर्भ में यह नियुक्त चरवाही से जल्द हटने या उससे बच निकलने का भाव देता है। स्वाभाविक हिन्दी में ‘पीछे नहीं हटा’ इस आशय को व्यक्त करता है, यद्यपि क्रिया में निहित ‘जल्दी’ का सूक्ष्म भाव प्रत्यक्ष नहीं रहता।
- source_word: מֵרֹעֶה אַחֲרֶיךָ
  choice: आपके पीछे चलकर चरवाही करने से
  rationale: רֹעֶה की चरवाहे वाली उपमा को ‘भविष्यद्वक्ता’ जैसे व्याख्यात्मक पद से नहीं बदला गया। אַחֲרֶיךָ का ‘आपके पीछे’ वाला अनुसरण का भाव भी रखा गया है।
- source_word: יוֹם אָנושׁ
  choice: विपत्ति का दिन
  rationale: אָנושׁ का मूल अर्थ घोर, असाध्य या अत्यन्त पीड़ादायक हो सकता है; यहाँ यह आनेवाले विनाशकारी न्याय के दिन का संकेत देता है। ‘विपत्ति का दिन’ हिन्दी में संदर्भगत अर्थ स्पष्ट करता है, जबकि शाब्दिक चित्र और विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: הִתְאַוֵּיתִי
  choice: लालसा नहीं की
  rationale: हित्पएल रूप तीव्र इच्छा या लालसा व्यक्त करता है। ‘लालसा नहीं की’ साधारण ‘चाहा नहीं’ की तुलना में इस बल को बेहतर बनाए रखता है।
- source_word: מוֹצָא שְׂפָתַי
  choice: मेरे होंठों से निकली हर बात
  rationale: मुहावरे का शाब्दिक चित्र ‘होंठों से निकलना’ बनाए रखते हुए उसका आशय—कहे गए वचन—स्वाभाविक हिन्दी में व्यक्त किया गया है। ‘हर’ निहित समष्टिगत अर्थ को स्पष्ट करता है।
- source_word: נֹכַח פָּנֶיךָ
  choice: आपके सामने
  rationale: इसका शाब्दिक अर्थ ‘आपके मुख के सामने’ है, पर आधुनिक हिन्दी में ‘आपके सामने’ अधिक स्वाभाविक है और परमेश्वर की प्रत्यक्ष जानकारी तथा उपस्थिति का भाव बनाए रखता है।
- source_word: אַתָּה יָדָעְתָּ
  choice: यह आप जानते हैं
  rationale: पूर्ण क्रिया यहाँ वर्तमान में कायम ज्ञान की पुष्टि करती है। ‘यह आप जानते हैं’ प्रत्यक्ष संबोधन और सर्वनाम के बल दोनों को स्वाभाविक हिन्दी में रखता है।
theological_decisions:
- issue: रֹעֶה में यिर्मयाह की चरवाहे वाली आत्म-छवि
  choice: चरवाही की उपमा को बनाए रखा गया है
  alternative: ‘भविष्यद्वक्ता का काम करने’ या केवल ‘आपके पीछे चलने’ के रूप में अर्थ खोलना
  rationale: मूल पाठ स्पष्ट रूप से चरवाहे की भाषा इस्तेमाल करता है। इसे बनाए रखने से यिर्मयाह की परमेश्वर के अधीन लोगों की देखभाल और अगुवाई की भूमिका व्यक्त होती है, बिना किसी बाद की कलीसियाई पदवी को पाठ में जोड़े।
- issue: יוֹם אָנושׁ का न्याय-संबंधी आशय
  choice: मुख्य पाठ में ‘विपत्ति का दिन’
  alternative: ‘रोग का दिन’, ‘घोर दिन’ या ‘दुःख का दिन’
  rationale: संदर्भ में यिर्मयाह इस बात से इनकार करता है कि उसने आनेवाली दैवी विपत्ति की लालसा की थी। ‘विपत्ति’ संदर्भगत आशय देता है, जबकि पादटिप्पणी मूल विशेषण की व्यापकता सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सम्मानपूर्ण और सुबोध रूप अपनाया गया है। परमेश्वर के लिए ‘आप’ का प्रयोग किया गया है। वाक्य में इब्रानी की चरवाहे और होंठों से निकलने वाली बात की मूर्त भाषा बचाई गई है, जबकि अस्वाभाविक शाब्दिकता से परहेज़ किया गया है।
