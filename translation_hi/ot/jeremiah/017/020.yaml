  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक उद्घोषणा के अनुकूल है। वाक्यक्रम को हिन्दी में स्वाभाविक बनाने के लिए सभी सम्बोधित समूहों को पहले और मुख्य आज्ञा ‘यहोवा का वचन सुनो’ को अंत में रखा गया है।
