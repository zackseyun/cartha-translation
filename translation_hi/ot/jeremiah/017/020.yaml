  choice: यहोवा का वचन
  rationale: स्थापित भविष्यद्वाणी-सूत्र में דָּבָר का औपचारिक और धर्मवैज्ञानिक भार बनाए रखता है; יהוה को व्यक्तिगत नाम के रूप में लिप्यंतरित किया गया है।
- source_word: מַלְכֵי יְהוּדָה
  choice: यहूदा के राजाओं
  rationale: सम्बोधन कारक का स्पष्ट और स्वाभाविक हिन्दी बहुवचन।
- source_word: וְכָל יְהוּדָה
  choice: समस्त यहूदा
  rationale: मूल की संक्षिप्तता और क्षेत्र/जनसमुदाय के अर्थगत विस्तार को बिना 'लोग' जोड़े सुरक्षित रखता है।
- source_word: וְכֹל יֹשְׁבֵי יְרוּשָׁלִָם
  choice: यरूशलेम के सभी निवासियो
  rationale: निवास करने वालों के लिए स्वाभाविक हिन्दी और प्रत्यक्ष सम्बोधन को स्पष्ट करता है।
- source_word: הַבָּאִים בַּשְּׁעָרִים הָאֵלֶּה
  choice: जो इन फाटकों से प्रवेश करते हो
  rationale: कृदन्त का सम्बोधन से सम्बन्ध और फाटकों के माध्यम से भीतर आने की गति स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु / याहवे
  rationale: मूल में प्रयुक्त चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में व्यापक रूप से पहचाने जाने वाले लिप्यंतरण द्वारा प्रस्तुत किया गया है; पादटिप्पणी मूल अक्षरों को स्पष्ट करती है।
