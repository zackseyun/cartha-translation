  yaml_path: translation/ot/jeremiah/017/020.yaml
  text: And say to them[a], “Hear the word of Yahweh, you kings of Judah, and all Judah, and all the inhabitants of Jerusalem who enter through these gates.”
translation:
  language: hi
  text: और उनसे कहना, “यहूदा के राजाओं, समस्त यहूदा और यरूशलेम के सभी निवासियो, जो इन फाटकों से प्रवेश करते हो, याहवे[a] का वचन सुनो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: YHWH (יהוה); परंपरागत रूप से “प्रभु” अनूदित।'
    reason: ईश्वरीय नाम के मूल रूप और पारंपरिक वैकल्पिक अनुवाद को बताना।
lexical_decisions:
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: और उनसे कहना
  rationale: पूर्ववर्ती निर्देश से जुड़ी क्रमिक आज्ञा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שִׁמְעוּ
