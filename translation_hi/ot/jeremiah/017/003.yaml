base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/003.yaml
  text: My mountain in the field—your wealth[a], all your treasures[c][b], and your high places because of sin throughout all your territory—I will give as plunder.
translation:
  language: hi
  text: मैदान में मेरा पर्वत[a]—तेरी धन-संपत्ति[b], तेरे सारे खज़ाने, और तेरे सारे प्रदेश में हुए पाप के कारण तेरे ऊँचे पूजा-स्थल[c]—मैं लूट के लिए सौंप दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हे मैदान में मेरे पर्वत!” इब्रानी वाक्यांश कठिन है और संभवतः यहोवा के पर्वत, अर्थात् सिय्योन/यरूशलेम, की ओर संकेत करता है।
    reason: alternative_reading
  - marker: b
    text: “धन-संपत्ति” के लिए प्रयुक्त इब्रानी शब्द का अर्थ “सामर्थ्य” या, इस संदर्भ में कम संभव रूप से, “सेना” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: “पाप के कारण” का अनुवाद “पाप के लिए” या “पाप में” भी हो सकता है। इब्रानी में इस पद का वाक्यगत संबंध कुछ अस्पष्ट है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲרָרִי בַּשָּׂדֶה
  choice: मैदान में स्थित मेरे पर्वत
  rationale: शाब्दिक बिंब और कठिन वाक्य-विन्यास को बनाए रखता है। 'मेरे पर्वत' संभवतः सिय्योन/यरूशलेम का संकेत है, पर मुख्य पाठ में इसकी व्याख्या थोपना उचित नहीं।
- source_word: חֵילְךָ
  choice: तेरी धन-संपत्ति
  rationale: इस शब्द का अर्थ सामर्थ्य, सेना या संपत्ति हो सकता है; 'खज़ाने' और 'लूट का माल' के समानांतर आर्थिक अर्थ यहाँ सबसे उपयुक्त है।
- source_word: כָל אוֹצְרוֹתֶיךָ
  choice: तेरे सारे खज़ाने
  rationale: संदर्भ उन बहुमूल्य वस्तुओं का है जिन्हें लूट के लिए सौंपा जाएगा; इसलिए 'खज़ाने' सहज और सटीक है।
- source_word: לָבַז אֶתֵּן
  choice: मैं लूट का माल बना दूँगा
  rationale: हिन्दी में यह भाव स्वाभाविक रूप से व्यक्त करता है कि इन वस्तुओं और स्थलों को शत्रु की लूट के लिए सौंप दिया जाएगा।
- source_word: בָּמֹתֶיךָ
  choice: तेरे पूजा-स्थल
  rationale: במות ऊँचे स्थानों पर बने धार्मिक स्थलों को दर्शाता है। केवल 'ऊँचे स्थान' हिन्दी पाठक के लिए धार्मिक आशय स्पष्ट नहीं करता; 'पूजा-स्थल' इसे सहज रूप से व्यक्त करता है।
- source_word: בְּחַטָּאת בְּכָל גְּבוּלֶיךָ
  choice: तेरे सारे प्रदेश में किए गए पाप के कारण
  rationale: בְּחַטָּאת में कारणसूचक अर्थ संभव है और अगला पद पाप के पूरे प्रदेश में व्याप्त होने का संकेत देता है। अनिश्चितता को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: '''मेरे पर्वत'' का संदर्भ'
  choice: मुख्य पाठ में शाब्दिक और अनिर्णीत रखा गया; संभवतः यह यहोवा के पर्वत, सिय्योन/यरूशलेम, को दर्शाता है।
  alternative: इसे सम्बोधन—'हे मैदान में स्थित मेरे पर्वत'—या पहाड़ी प्रदेश के व्यापक उल्लेख के रूप में समझना।
  rationale: इब्रानी पद कठिन है। अधिकारसूचक प्रत्यय और यिर्मयाह की सिय्योन-संबंधी भाषा यरूशलेम की ओर संकेत करती है, लेकिन अनुवाद में विवादित संदर्भ को निश्चित नहीं किया गया।
- issue: בְּחַטָּאת का संबंध
  choice: पूरे प्रदेश में किए गए पाप को न्याय का कारण माना गया।
  alternative: '''तेरे सारे प्रदेश में पाप के लिए'' अथवा ''पाप में''।'
  rationale: कारणसूचक अर्थ संदर्भ में स्वाभाविक है, फिर भी इब्रानी पूर्वसर्ग कई संबंध व्यक्त कर सकता है; इसलिए विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और भविष्यद्वाणी-संगत शैली रखी गई है। एकवचन सम्बोधन के अनुरूप 'तेरी/तेरे' प्रयुक्त हुआ है। कठिन आरम्भिक पद और कारणसूचक वाक्यांश की वास्तविक अस्पष्टता पादटिप्पणियों में सुरक्षित है।
