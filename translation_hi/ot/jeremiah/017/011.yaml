source:
  edition: WLC
  text: קֹרֵ֤א דָגַר֙ וְ/לֹ֣א יָלָ֔ד עֹ֥שֶׂה עֹ֖שֶׁר וְ/לֹ֣א בְ/מִשְׁפָּ֑ט בַּ/חֲצִ֤י ימ/ו יַעַזְבֶ֔/נּוּ וּ/בְ/אַחֲרִית֖/וֹ יִהְיֶ֥ה נָבָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/011.yaml
  text: 'Like a partridge that gathers a brood it did not hatch[a], so is one who makes wealth unjustly: in the middle of his days it will leave him, and in his end he will be a fool.'
translation:
  language: hi
  text: जैसे तीतर उन बच्चों को इकट्ठा करता है जिन्हें उसने जन्म नहीं दिया[a], वैसे ही वह मनुष्य है जो अन्याय से धन कमाता है; उसकी आधी आयु में वह धन उसे छोड़ जाएगा, और अपने अंत में वह मूर्ख ठहरेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जैसे तीतर उन अंडों पर बैठता है जिन्हें उसने नहीं दिया।” इस कहावत के पीछे पक्षी का ठीक कौन-सा व्यवहार है, यह निश्चित नहीं है; पर आशय यह है कि जो वस्तु उचित रीति से अपनी नहीं है, वह टिकी नहीं रहती।
    reason: lexical_alternative
lexical_decisions:
- source_word: קֹרֵא
  choice: तीतर
  rationale: घोंसले और सेने के संदर्भ में यह शब्द सामान्यतः पक्षी-नाम ‘तीतर’ को दर्शाता है; हिन्दी में यही पारंपरिक और सहज समतुल्य है।
- source_word: דָגַר
  choice: बच्चों को बटोरता है
  rationale: क्रिया पक्षी के सेने या बच्चों को अपने पास इकट्ठा करने का भाव दे सकती है। मुख्य पाठ में ‘बटोरता है’ रखा गया है ताकि अनिश्चित पक्षी-व्यवहार को जरूरत से अधिक निश्चित न किया जाए।
- source_word: וְלֹא יָלָד
  choice: जिन्हें उसने नहीं सेया
  rationale: शाब्दिक भाव ‘जन्म नहीं दिया’ है, पर पक्षी के संदर्भ में ‘नहीं सेया’ स्वाभाविक हिन्दी है और बच्चों के उसके अपने न होने का आशय बनाए रखता है।
- source_word: עֹשֶׂה עֹשֶׁר
  choice: धन कमाता है
  rationale: इब्रानी का शाब्दिक भाव ‘धन बनाता/अर्जित करता है’ है। ‘धन कमाता है’ वर्तमान हिन्दी में स्वाभाविक और सक्रिय अर्थ वाला प्रयोग है।
- source_word: וְלֹא בְמִשְׁפָּט
  choice: अन्याय से
  rationale: यहाँ מִשְׁפָּט न्यायसंगत या उचित रीति का द्योतक है; ‘अन्याय से’ नैतिक और न्यायिक दोनों अर्थों को संक्षेप में व्यक्त करता है।
- source_word: בַּחֲצִי יָמָיו
  choice: उसकी आधी आयु में
  rationale: यह पूर्ण जीवनकाल से पहले, जीवन के मध्य का संकेत देता है और इब्रानी रूपक ‘उसके दिनों के आधे में’ को सहज हिन्दी में रखता है।
- source_word: יַעַזְבֶנּוּ
  choice: वह धन उसे छोड़ जाएगा
  rationale: एकवचन क्रिया और प्रत्यय के अनुसार निकटतम स्वाभाविक कर्ता ‘धन’ है। संज्ञा दोहराने से हिन्दी में सर्वनाम का संदर्भ स्पष्ट रहता है।
- source_word: וּבְאַחֲרִיתוֹ
  choice: अपने अंत में
  rationale: व्यक्तिवाचक प्रत्यय ‘उसका अंत’ दर्शाता है; ‘अपने अंत में’ उस व्यक्तिगत परिणति को बनाए रखता है।
- source_word: נָבָל
  choice: मूर्ख ठहरेगा
  rationale: נָבָל केवल बुद्धिहीनता नहीं, बल्कि नैतिक और आत्मिक मूर्खता का संकेत देता है। ‘मूर्ख ठहरेगा’ अंतिम मूल्यांकन का भाव व्यक्त करता है।
theological_decisions:
- issue: कहावत में पक्षी के व्यवहार की व्याख्या
  choice: मुख्य पाठ पक्षी को ऐसे बच्चों को बटोरते दिखाता है जिन्हें उसने स्वयं नहीं सेया, जिससे अनुचित रूप से पाया धन टिकाऊ न होने का भाव उभरता है।
  alternative: पक्षी उन अंडों पर बैठता है जिन्हें उसने नहीं दिया; या वह दूसरे पक्षी के बच्चों को इकट्ठा करता है।
  rationale: सटीक प्राणी-व्यवहार अनिश्चित है, इसलिए मुख्य पाठ कहावत का चित्र बनाए रखता है और पादटिप्पणी वैकल्पिक समझ देती है, बिना किसी विवादित प्राकृतिक विवरण को निश्चित ठहराए।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘तीतर’, ‘अन्याय से धन कमाता है’ और ‘आधी आयु’ परिचित शब्दावली रखते हैं; ‘वह धन’ जोड़कर इब्रानी सर्वनाम का आशय स्पष्ट किया गया है।
