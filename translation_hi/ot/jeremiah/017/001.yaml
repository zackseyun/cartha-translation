  text: חַטַּ֣את יְהוּדָ֗ה כְּתוּבָ֛ה בְּ/עֵ֥ט בַּרְזֶ֖ל בְּ/צִפֹּ֣רֶן שָׁמִ֑יר חֲרוּשָׁה֙ עַל ל֣וּחַ לִבָּ֔/ם וּ/לְ/קַרְנ֖וֹת מִזְבְּחוֹתֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/001.yaml
  text: The sin of Judah is written with an iron stylus[a]; with a diamond point it is engraved on the tablet of their heart and on the horns of your altars.
translation:
  language: hi
  text: यहूदा का पाप लोहे की लेखनी से लिखा हुआ है; हीरे की नोक[a] से वह उनके हृदय की पटिया पर और तुम्हारी वेदियों के सींगों पर खुदा हुआ है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अत्यंत कठोर पत्थर की नोक”; שָׁמִיר की सटीक पहचान अनिश्चित है। यह उत्कीर्णन में प्रयुक्त किसी बहुत कठोर पदार्थ को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חַטַּאת
  choice: पाप
  rationale: भविष्यवाणी के इस दोषारोपण में यह शब्द नैतिक पाप को दर्शाता है, न कि पापबलि को।
- source_word: כְּתוּבָה
  choice: लिखा हुआ है
  rationale: निष्क्रिय कृदंत लिखे होने की वर्तमान, परिणामी अवस्था व्यक्त करता है।
- source_word: עֵט בַּרְזֶל
  choice: लोहे की लेखनी
  rationale: यह सामान्य कलम नहीं, कठोर सतह पर अंकित करने का औज़ार है; ‘लेखनी’ चित्रात्मकता को स्वाभाविक हिन्दी में बनाए रखती है।
- source_word: צִפֹּרֶן שָׁמִיר
  choice: हीरे की नोक
  rationale: צִפֹּרֶן यहाँ नाखून के बजाय अंकन-औज़ार की नोक है; שָׁמִיר किसी अत्यंत कठोर पदार्थ को सूचित करता है, जिसकी सटीक पहचान अनिश्चित है।
- source_word: חֲרוּשָׁה
  choice: खुदा हुआ है
  rationale: यह साधारण लेखन से अधिक गहरे अंकन का चित्र प्रस्तुत करता है।
- source_word: לוּחַ לִבָּם
  choice: उनके हृदय की पटिया
  rationale: ‘पटिया’ लेख-अंकन के रूपक को सुरक्षित रखती है और एकवचन ‘हृदय’ के सामूहिक प्रयोग को भी बनाए रखती है।
- source_word: קַרְנוֹת מִזְבְּחוֹתֵיכֶם
  choice: तुम्हारी वेदियों के सींगों
  rationale: वेदियों के ‘सींग’ इस्राएली उपासना-संरचना का विशिष्ट अंग हैं; द्वितीय पुरुष बहुवचन को स्पष्ट रूप से रखा गया है।
theological_decisions:
- issue: तीसरे पुरुष से दूसरे पुरुष की ओर सर्वनामिक परिवर्तन
  choice: ‘उनके हृदय’ ... ‘तुम्हारी वेदियों’
  alternative: ‘उनकी वेदियों’ कहकर सर्वनामों को एकरूप करना
  rationale: मसोरेटिक पाठ यहूदा के विषय में कथन से श्रोताओं को सीधे संबोधित करने की ओर बदलता है। इस परिवर्तन को बनाए रखने से भविष्यवाणी की सीधी दोषारोपणात्मक शक्ति सुरक्षित रहती है।
