  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִשָּׁמְר֖וּ בְּ/נַפְשֽׁוֹתֵי/כֶ֑ם וְ/אַל תִּשְׂא֤וּ מַשָּׂא֙ בְּ/י֣וֹם הַ/שַּׁבָּ֔ת וַ/הֲבֵאתֶ֖ם בְּ/שַׁעֲרֵ֥י יְרוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/021.yaml
  text: 'Thus says Yahweh: Take care for yourselves[b][a], and do not carry a load on the Sabbath day or bring it in through the gates of Jerusalem.'
translation:
  language: hi
  text: 'याहवे यह कहता है: अपने विषय में सावधान रहो,[a] और सब्त के दिन कोई बोझ[b] न उठाओ और न उसे यरूशलेम के फाटकों से भीतर लाओ।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप के निकट: “अपने प्राणों के विषय में सावधान रहो।” यह इब्रानी मुहावरा अपने ऊपर बहुत ध्यान रखने का भाव व्यक्त करता है।'
    reason: lexical_alternative
  - marker: b
    text: या “भार।” यहाँ आशय संभवतः सब्त के दिन ढोई जाने वाली किसी वस्तु या माल से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: यह कहता है
  rationale: यह भविष्यद्वक्ताओं की मानक संदेशवाहक उक्ति है; आधुनिक हिन्दी में स्वाभाविक रहते हुए इसकी औपचारिक घोषणा बनी रहती है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: הִשָּׁמְרוּ בְּנַפְשׁוֹתֵיכֶם
  choice: अपने विषय में सावधान रहो
  rationale: निफ़अल आज्ञार्थक और בְּנַפְשׁוֹתֵיכֶם का मुहावरा अपने ऊपर पूरी सावधानी रखने का भाव देता है; यह अनुवाद उसी आत्मवाची बल को स्वाभाविक हिन्दी में रखता है।
- source_word: וְאַל תִּשְׂאוּ מַשָּׂא
  choice: कोई बोझ न उठाओ
  rationale: नשא और מַשָּׂא का मेल यहाँ सब्त के दिन किसी वस्तु या माल को ढोने का ठोस अर्थ देता है।
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: सब्त के दिन
  rationale: यह समय-सूचक पद का स्पष्ट और प्रचलित हिन्दी रूप है।
- source_word: וַהֲבֵאתֶם בְּשַׁעֲרֵי יְרוּשָׁלִָם
  choice: और न उसे यरूशलेम के फाटकों से भीतर लाओ
  rationale: निषेध के अधीन समन्वित दूसरी क्रिया को हिन्दी में 'और न' से व्यक्त किया गया है; सर्वनाम का संकेत पिछले 'बोझ' की ओर है और 'फाटकों से भीतर' नगर में प्रवेश की दिशा स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है; उसे उपाधि में बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
