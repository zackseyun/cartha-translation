  yaml_path: translation/ot/jeremiah/017/015.yaml
  text: Look[a], they are saying to me, “Where is the word of Yahweh? Let it come now!”
translation:
  language: hi
  text: देखो, वे मुझसे कहते हैं, “याहवे का वचन[a] कहाँ है? वह अब आ जाए!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे का संदेश।” यह इब्रानी पदबंध परमेश्वर की ओर से आए वचन, संदेश या नबूवतीय घोषणा के लिए प्रचलित अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: देखिए
  rationale: यह ध्यान खींचने वाला उद्गार है। आधुनिक, गरिमापूर्ण हिन्दी में ‘देखिए’ इसका स्वाभाविक बल व्यक्त करता है।
- source_word: הֵמָּה
  choice: वे
  rationale: स्वतंत्र बहुवचन सर्वनाम कर्ता पर हल्का बल देता है; हिन्दी में ‘वे’ इसे सहज रूप से व्यक्त करता है।
- source_word: אֹמְרִים
  choice: कह रहे हैं
  rationale: कालवाचक कृदन्त वर्तमान में चल रही या बार-बार हो रही क्रिया का संकेत दे सकता है। ‘कह रहे हैं’ मूल की अस्पष्टता को बिना अनावश्यक रूप से पुनरावृत्ति निश्चित किए बनाए रखता है।
- source_word: אֵלַי
  choice: मुझसे
  rationale: इस प्रसंग में वाणी यिर्मयाह की ओर निर्देशित है। हिन्दी में ‘मुझसे कह रहे हैं’ स्वाभाविक है; ‘मेरे विरुद्ध’ कहना शत्रुतापूर्ण भाव को मूल संबंधबोधक से अधिक स्पष्ट कर देता।
- source_word: אַיֵּה
  choice: कहाँ है
  rationale: यह स्थान या प्रत्यक्ष अस्तित्व पूछने वाला सामान्य प्रश्नवाचक है और यहाँ व्यंग्यपूर्ण चुनौती का रूप लेता है।
- source_word: דְבַר יְהוָה
  choice: याहवे का वचन
  rationale: यह नबूवत में परमेश्वर की ओर से आए कथन या संदेश की मानक अभिव्यक्ति है। ‘वचन’ उस स्थापित अर्थ को बनाए रखता है, जबकि वैकल्पिक अर्थ फुटनोट में दिया गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: יָבוֹא
  choice: वह आए
  rationale: 'यहाँ अपूर्ण क्रिया का प्रयोग इच्छार्थक चुनौती के रूप में है: बोलने वाले उस वचन के आने की माँग करते हुए उपहास कर रहे हैं।'
- source_word: נָא
  choice: अब
  rationale: यह कण यहाँ विनम्र ‘कृपया’ के बजाय अधीर, व्यंग्यपूर्ण चुनौती को तीखा करता है; ‘अब’ उसी बल को व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: पद में व्यक्तिगत वाचा-नाम सीधे उपस्थित है। ‘याहवे’ नाम को सुरक्षित रखता है और उसे किसी उपाधि से नहीं बदलता।
- issue: דְבַר יְהוָה का आशय
  choice: याहवे का वचन
  alternative: याहवे का संदेश
  rationale: ‘वचन’ मूल पदबंध और उसकी नबूवतीय गूँज को बनाए रखता है, पर इब्रानी דָּבָר यहाँ कथित संदेश या ईश्वरीय घोषणा भी दर्शा सकता है; इसलिए विकल्प फुटनोट में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज और गरिमापूर्ण रूप अपनाया गया है। प्रत्यक्ष कथन का व्यंग्यपूर्ण, चुनौतीभरा स्वर ‘कहाँ है?’ और ‘अब आए!’ से सुरक्षित रखा गया है; उसे विनम्र अनुरोध या साधारण भविष्यवाणी नहीं बनाया गया।
