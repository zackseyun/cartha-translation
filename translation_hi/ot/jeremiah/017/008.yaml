  choice: उस पेड़ के समान जो जल के पास लगाया गया हो
  rationale: उपमा, निष्क्रिय कृदंत और जल-स्रोत से निकटता—तीनों को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
