- source_word: לֹא יָמִישׁ מֵעֲשׂוֹת פֶּרִי
  choice: वह फल देना नहीं छोड़ता
  rationale: किसी कार्य से न हटने या न रुकने के अर्थ को सरल और सटीक हिन्दी में व्यक्त करता है।
