base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/008.yaml
  text: He will be like a tree planted by water[a], that sends out its roots by a stream; it does not fear when heat comes, and its leaf remains green. In a year of drought it is not anxious[b], and it does not cease from bearing fruit.
translation:
  language: hi
  text: वह एक पेड़ के समान होगा, जो जल के पास लगाया गया है और जलधारा के किनारे अपनी जड़ें फैलाता है। गर्मी आने पर वह नहीं डरता[b], और उसके पत्ते हरे-भरे रहते हैं। सूखे के वर्ष में भी उसे चिंता नहीं होती, और वह फल देना नहीं छोड़ता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: इब्रानी लिखित पाठ को “गर्मी आने पर भी उसे इसका पता नहीं चलता” भी समझा जा सकता है।
    reason: textual_ambiguity
