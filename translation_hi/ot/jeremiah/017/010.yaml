base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/010.yaml
  text: I[a], Yahweh, search the heart[b], testing the kidneys, to give to each man according to his way, according to the fruit of his deeds.
translation:
  language: hi
  text: मैं, यहोवा, हृदय की खोज करता हूँ और गुर्दों[a] को परखता हूँ, ताकि हर मनुष्य[b] को उसके मार्ग के अनुसार, उसके कामों के फल के अनुसार दूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘गुर्दे’; प्राचीन इब्रानी में यह मनुष्य के अंतरतम विचारों और भावनाओं का मुहावरा है।
    reason: cultural_note
  - marker: b
    text: अर्थात हर व्यक्ति; इब्रानी में ‘मनुष्य’ पुल्लिंग एकवचन रूप में प्रतिनिधिक अर्थ रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण से रखा गया है।
- source_word: חֹקֵר לֵב
  choice: हृदय को खोजता
  rationale: मूल के ठोस बिंब और मनुष्य के भीतरी विचार, इच्छा और संकल्प की जाँच के भाव को बनाए रखता है।
- source_word: בֹּחֵן כְּלָיוֹת
  choice: गुर्दों को परखता
  rationale: शाब्दिक शरीर-अंग संबंधी प्राचीन इब्रानी मुहावरे को मुख्य पाठ में सुरक्षित रखते हुए उसका अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: וְלָתֵת
  choice: ताकि ... दूँ
  rationale: क्रिया के उद्देश्य अथवा परिणाम-संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְאִישׁ
  choice: हर मनुष्य
  rationale: इब्रानी पुल्लिंग एकवचन का प्रतिनिधिक और वितरणात्मक बल बनाए रखता है; इसका समावेशी संदर्भ पादटिप्पणी में बताया गया है।
- source_word: כדרכו
  choice: उसकी चाल के अनुसार
  rationale: ‘मार्ग/चाल’ के जीवन-पद्धति वाले रूपक को सुरक्षित रखता है और हिन्दी बाइबलीय प्रयोग में स्वाभाविक है।
- source_word: כפרי מעלליו
  choice: उसके कामों के फल के अनुसार
  rationale: कर्मों को जीवन के फल के रूप में दिखाने वाला मूल रूपक और नैतिक मूल्यांकन दोनों सुरक्षित रहते हैं।
theological_decisions:
- issue: ईश्वरीय न्याय में मानव के अंतरतम का इब्रानी शरीर-अंग संबंधी चित्रण
  choice: ‘हृदय’ और ‘गुर्दों’ दोनों ठोस शब्द बनाए रखे गए।
  alternative: ‘मन’ और ‘अंतरतम भावनाएँ’ जैसे अमूर्त अर्थानुवाद।
  rationale: यह परमेश्वर द्वारा मनुष्य के संपूर्ण आंतरिक जीवन की गहरी जाँच को चित्रित करता है; मूल बिंब बनाए रखने से आधुनिक मनोवैज्ञानिक श्रेणियाँ पाठ पर नहीं थोपी जातीं।
- issue: לְאִישׁ का प्रतिनिधिक पुल्लिंग
  choice: ‘हर मनुष्य’
  alternative: ‘हर व्यक्ति’ अथवा ‘हरेक’
  rationale: मूल के पुल्लिंग एकवचन रूप को हिन्दी में बनाए रखते हुए पादटिप्पणी स्पष्ट करती है कि संदर्भ प्रत्येक व्यक्ति को समेटता है।
- issue: ‘चाल’ और ‘कामों के फल’ के बीच प्रतिफल का संबंध
  choice: दोनों ‘के अनुसार’ वाक्यांश बनाए रखे गए।
  alternative: एक ही सामान्य वाक्यांश ‘उसके आचरण के अनुसार’ में समेट देना।
  rationale: मूल की समानांतरता और कर्मों के फल का रूपक न्याय के मापदंड को विशेष बल देते हैं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिन्दी। मूल की काव्यात्मक समानांतरता, ‘हृदय’, ‘गुर्दे’, ‘चाल’ और ‘फल’ के बिंब सुरक्षित रखे गए हैं; असामान्य प्राचीन मुहावरे को पादटिप्पणी से समझाया गया है।
