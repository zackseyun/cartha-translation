source:
  edition: WLC
  text: וְ/לֹ֣א שָֽׁמְע֔וּ וְ/לֹ֥א הִטּ֖וּ אֶת אָזְנָ֑/ם וַ/יַּקְשׁוּ֙ אֶת עָרְפָּ֔/ם לְ/בִלְתִּ֣י שומע וּ/לְ/בִלְתִּ֖י קַ֥חַת מוּסָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/023.yaml
  text: But they did not listen[a], and they did not incline their ear[c][b], but stiffened their neck so as not to hear and not to accept discipline.
translation:
  language: hi
  text: परन्तु उन्होंने न सुना[a] और न अपना कान लगाया; बल्कि उन्होंने अपनी गर्दन अकड़ा ली[b], ताकि वे न सुनें और न अनुशासन स्वीकार करें[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘ध्यान न दिया’ अथवा ‘आज्ञा न मानी।’ हिब्रू क्रिया का अर्थ प्रसंग के अनुसार सुनना, ध्यान देना या आज्ञा मानना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘अपनी गर्दन अकड़ा ली’—यह हठपूर्वक विरोध करने का हिब्रू मुहावरा है।
    reason: cultural_note
  - marker: c
    text: या ‘शिक्षा ग्रहण करें’ अथवा ‘ताड़ना स्वीकार करें।’ हिब्रू शब्द में शिक्षा और सुधारात्मक अनुशासन दोनों के भाव हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְעוּ
  choice: न सुना
  rationale: שׁמע का अर्थ प्रसंग के अनुसार सुनना, ध्यान देना या आज्ञा मानना हो सकता है। यहाँ कान लगाने और अनुशासन स्वीकार करने से इनकार के समानांतर होने के कारण ‘न सुना’ श्रवण के साथ निहित प्रत्युत्तरहीनता को भी बनाए रखता है, पर सीधे ‘आज्ञा न मानी’ कहकर अर्थ को अधिक स्पष्ट नहीं करता।
- source_word: הִטּוּ אֶת אָזְנָם
  choice: अपना कान न लगाया
  rationale: हिब्रू मुहावरे का शाब्दिक चित्र सुनने के लिए कान झुकाने या मोड़ने का है। हिन्दी में ‘कान लगाना’ उसी ध्यानपूर्वक सुनने के भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיַּקְשׁוּ אֶת עָרְפָּם
  choice: अपनी गर्दन कड़ी कर ली
  rationale: यह हठपूर्ण प्रतिरोध का हिब्रू शारीरिक रूपक है। हिन्दी में यह चित्र समझ में आता है और भविष्यद्वक्ताओं की भाषा की प्रतिध्वनि बनाए रखता है।
- source_word: לְבִלְתִּי שֹׁמֵעַ
  choice: ताकि वे न सुनें
  rationale: לְבִלְתִּי यहाँ उद्देश्य अथवा परिणामी अभिप्राय व्यक्त करता है। ‘ताकि’ इस संबंध को संक्षेप में बनाए रखता है; שׁמע को फिर ‘सुनें’ कहना मूल की पुनरावृत्ति भी सुरक्षित रखता है।
- source_word: וּלְבִלְתִּי קַחַת מוּסָר
  choice: और न अनुशासन स्वीकार करें
  rationale: קחת का मूल भाव लेना या ग्रहण करना है और מוּסָר में शिक्षा, सुधार तथा अनुशासन के मिले-जुले भाव हैं। ‘अनुशासन स्वीकार करें’ सुधारात्मक-शिक्षाप्रद बल को संक्षेप में व्यक्त करता है।
- source_word: מוּסָר
  choice: अनुशासन
  rationale: यह शब्द केवल सूचना देने वाली शिक्षा नहीं, बल्कि चरित्र-सुधार करने वाली शिक्षा या ताड़ना भी सूचित करता है; ‘अनुशासन’ इस व्यापक नैतिक-सुधारात्मक भार को बनाए रखता है।
theological_decisions:
- issue: हठ के शारीरिक मुहावरे का अनुवाद
  choice: ‘अपनी गर्दन कड़ी कर ली’ रूपक को बनाए रखा गया।
  alternative: ‘वे हठी हो गए’ या ‘उन्होंने हठ किया।’
  rationale: मूल रूपक समझने योग्य है और वाचा के प्रति विद्रोही प्रतिरोध की भविष्यद्वक्तीय छवि को सुरक्षित रखता है; केवल अर्थ खोल देने से यह अंतर्पाठीय चित्र खो जाता।
- issue: भविष्यद्वक्तीय फटकार में שׁמע का बल
  choice: दोनों स्थानों पर ‘सुनना’ रखा गया, जिसमें प्रसंग से ध्यान देने और प्रत्युत्तर देने का भाव निहित है।
  alternative: पहले या दोनों स्थानों पर ‘आज्ञा मानना।’
  rationale: ‘आज्ञा मानना’ सम्भव अर्थ है, पर यहाँ निकटवर्ती कान लगाने और अनुशासन स्वीकार करने की भाषा सुनने से जानबूझकर इनकार पर बल देती है। ‘सुनना’ मूल की अर्थगत व्यापकता और तनाव को अनावश्यक रूप से सीमित नहीं करता।
- issue: מוּסָר का सुधारात्मक और शिक्षाप्रद आयाम
  choice: मुख्य पाठ में ‘अनुशासन’ रखा गया।
  alternative: ‘शिक्षा’ या ‘सुधार।’
  rationale: ‘अनुशासन’ सुधार और प्रशिक्षण दोनों को समेटता है। पादटिप्पणी अन्य वैध अर्थ बताती है, जिससे किसी एक संकीर्ण धार्मिक व्याख्या को निर्णायक नहीं बनाया जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण भविष्यद्वक्तीय शैली अपनाई गई है। ‘कान लगाया’ हिन्दी का स्वाभाविक मुहावरा है, जबकि ‘गर्दन कड़ी कर ली’ मूल हिब्रू रूपक और उसकी धर्मवैचारिक प्रतिध्वनि को सुरक्षित रखता है। वाक्य-संरचना मूल के क्रम और विरोध को निकटता से अनुसरती है, पर हिन्दी प्रवाह के लिए संयोजकों और विराम-चिह्नों को स्वाभाविक बनाया गया है।
