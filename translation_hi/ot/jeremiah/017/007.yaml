base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/007.yaml
  text: Blessed is the man who trusts in Yahweh[b][a], and whose trust is Yahweh.
translation:
  language: hi
  text: धन्य है वह पुरुष जो याहवे पर भरोसा रखता है, और जिसका भरोसा याहवे है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अर्थ यह भी हो सकता है: “और याहवे उसके भरोसे का आधार है।” इब्रानी संज्ञा उस व्यक्ति या वस्तु को सूचित कर सकती है जिसमें भरोसा रखा जाता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: धन्य
  rationale: यह रूप आशीष-प्राप्त अवस्था बताता है। ‘धन्य’ इसके धार्मिक और वाचा-संबंधी भार को ‘सुखी’ से अधिक अच्छी तरह बनाए रखता है।
- source_word: הַגֶּבֶר
  choice: वह पुरुष
  rationale: इब्रानी शब्द व्याकरण की दृष्टि से पुल्लिंग एकवचन है और यहाँ नीतिवचन-सदृश प्रतिनिधिक अर्थ में प्रयुक्त है।
- source_word: יִבְטַח בַּיהוָה
  choice: याहवे पर भरोसा रखता है
  rationale: בטח का अर्थ किसी पर विश्वास या भरोसा रखना है; हिंदी में ‘पर भरोसा रखना’ स्वाभाविक और सीधा प्रयोग है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के विशिष्ट वाचा-नाम को उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: מִבְטַחוֹ
  choice: उसका भरोसा
  rationale: यह संज्ञा בטח धातु से बनी है और उस व्यक्ति या वस्तु को भी सूचित कर सकती है जिसमें भरोसा रखा जाता है। ‘भरोसा’ पहले खंड के शब्द-संबंध को बनाए रखता है और मूल की संक्षिप्त, अर्थगर्भित अभिव्यक्ति को अनावश्यक रूप से नहीं खोलता।
- source_word: וְהָיָה
  choice: और ... है
  rationale: संदर्भ में यह धन्य-वचन की वर्तमान या सामान्य अवस्था व्यक्त करता है। हिंदी में ‘और ... है’ स्वाभाविक है, जबकि भविष्यकाल अर्थ को जरूरत से अधिक सीमित कर सकता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में विशिष्ट ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसका पारदर्शी लिप्यंतरण है और नाम तथा उपाधि के बीच भेद बनाए रखता है।
- issue: הַגֶּבֶר का प्रतिनिधिक पुल्लिंग
  choice: वह पुरुष
  alternative: वह व्यक्ति / वह जन
  rationale: मूल का पुल्लिंग एकवचन रूप बनाए रखा गया है, साथ ही वाक्य का सामान्य, नीतिवचन-सदृश आशय संदर्भ से स्पष्ट रहता है।
- issue: याहवे को ‘उसका भरोसा’ कहना
  choice: मूल की संक्षिप्त और अर्थगर्भित रचना बनाए रखना
  alternative: याहवे ही उसके भरोसे का आधार है
  rationale: מִבְטָח भरोसे की अवस्था अथवा भरोसे के आधार/विषय—दोनों का बोध करा सकता है। मुख्य पाठ में ‘भरोसा’ रखने से मूल की शब्द-क्रीड़ा और वास्तविक अर्थगत विस्तार सुरक्षित रहता है; अधिक स्पष्ट विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिंदी। ‘धन्य’ बाइबलीय धार्मिक भार बनाए रखता है; ‘भरोसा रखता है / उसका भरोसा’ मूल के בטח–מבטח शब्द-संबंध को सुनाई देने योग्य बनाता है।
