  text: וְ֠/הָיָה אִם שָׁמֹ֨עַ תִּשְׁמְע֤וּ/ן אֵלַ/י֙ נְאֻם יְהוָ֔ה לְ/בִלְתִּ֣י הָבִ֣יא מַשָּׂ֗א בְּ/שַׁעֲרֵ֛י הָ/עִ֥יר הַ/זֹּ֖את בְּ/י֣וֹם הַ/שַּׁבָּ֑ת וּ/לְ/קַדֵּשׁ֙ אֶת י֣וֹם הַ/שַּׁבָּ֔ת לְ/בִלְתִּ֥י עֲשֽׂוֹת ב/ה כָּל מְלָאכָֽה־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/024.yaml
  text: And it shall be[a], if you truly listen to me, declares Yahweh, by not bringing a load through the gates of this city on the Sabbath day, and by keeping the Sabbath day holy, by not doing any work on it[b],
translation:
  language: hi
  text: और ऐसा होगा कि यदि तुम सचमुच मेरी सुनोगे[a]—यह याहवे की घोषणा है—और सब्त के दिन इस नगर के फाटकों से होकर कोई बोझ[b] नहीं लाओगे, और सब्त के दिन को पवित्र रखोगे और उस दिन कोई काम नहीं करोगे,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘सुनने में तुम सुनोगे।’ हिब्रू की यह पुनरुक्ति विशेष बल देती है और इसका अर्थ ध्यान से सुनकर आज्ञा मानना भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘भार।’ यहाँ आशय सब्त के दिन नगर के फाटकों से होकर ढोई जाने वाली वस्तु से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: और ऐसा होगा कि
  rationale: यह आगे आने वाले सशर्त परिणाम की भूमिका बाँधता है। पद 24 का वाक्य अगले पद में पूरा होता है, इसलिए अंत में अपूर्णता बनाए रखी गई है।
- source_word: אִם שָׁמֹעַ תִּשְׁמְעוּן אֵלַי
  choice: यदि तुम सचमुच मेरी सुनोगे
  rationale: इन्फिनिटिव एब्सोल्यूट और अपूर्ण क्रिया की पुनरुक्ति बल प्रकट करती है। ‘मेरी सुनोगे’ श्रवण और आज्ञापालन, दोनों की संभावित छाया बनाए रखता है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: मानक भविष्यद्वाणी-सूत्र को गरिमापूर्ण और स्वाभाविक हिन्दी में व्यक्त करता है तथा दिव्य नाम को नाम के रूप में रखता है।
- source_word: לְבִלְתִּי הָבִיא מַשָּׂא
  choice: कोई बोझ नहीं लाओगे
  rationale: מַשָּׂא यहाँ उठाकर या ढोकर लाई जाने वाली वस्तु है। ‘बोझ’ मूल अर्थ को रखता है; संदर्भ इसे नगर में लाए जाने वाले भार के रूप में स्पष्ट करता है।
- source_word: בְּשַׁעֲרֵי הָעִיר הַזֹּאת
  choice: इस नगर के फाटकों से होकर
  rationale: पूर्वसर्ग और संदर्भ नगर के फाटकों के रास्ते भार ले जाने की गति सूचित करते हैं।
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: सब्त के दिन
  rationale: हिब्रू में उपस्थित ‘दिन’ को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक अभिव्यक्ति।
- source_word: וּלְקַדֵּשׁ אֶת יוֹם הַשַּׁבָּת
  choice: बल्कि सब्त के दिन को पवित्र मानोगे
  rationale: यहाँ קדשׁ का आशय उस दिन को पवित्र ठहराकर उसी के अनुरूप बरतना है। ‘पवित्र मानोगे’ धार्मिक पारिभाषिक बोझ के बिना अर्थ देता है; ‘बल्कि’ निषिद्ध और अपेक्षित आचरण का स्वाभाविक विरोध दिखाता है।
- source_word: לְבִלְתִּי עֲשׂוֹת בָהּ כָּל מְלָאכָה
  choice: उस दिन कोई काम नहीं करोगे
  rationale: स्त्रीलिंग सर्वनाम का संकेत ‘सब्त के दिन’ की ओर है। स्पष्ट हिन्दी के लिए सर्वनाम को ‘उस दिन’ के रूप में खोला गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में वाचा का विशिष्ट नाम है; उसे सामान्य उपाधि में बदलने के बजाय लिप्यंतरित किया गया है।
- issue: שׁמע में सुनने और आज्ञा मानने का संबंध
  choice: मेरी सुनोगे
  alternative: मेरी आज्ञा मानोगे
  rationale: वाचा-संदर्भ में आज्ञापालन निहित है, फिर भी मूल क्रिया का श्रवण-संबंधी रूप बनाए रखने से वास्तविक अर्थ-तनाव सुरक्षित रहता है; आगे की क्रियाएँ अपेक्षित आज्ञापालन को स्पष्ट करती हैं।
- issue: सब्त के दिन को पवित्र करने का आशय
  choice: पवित्र मानोगे
  alternative: पवित्र ठहराओगे / पवित्र रखोगे
  rationale: यह अनुवाद दिन को परमेश्वर के लिए अलग मानने और उसी अनुरूप व्यवहार करने का अर्थ देता है, बिना किसी विशिष्ट सांप्रदायिक व्याख्या को जोड़े।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। भविष्यद्वाणी-सूत्र को डैश के बीच रखा गया है ताकि लंबी शर्त स्पष्ट रहे। पद मूलतः अगले पद में जारी रहता है, इसलिए अंतिम अल्पविराम जानबूझकर रखा गया है।
