source:
  edition: WLC
  text: כִּסֵּ֣א כָב֔וֹד מָר֖וֹם מֵֽ/רִאשׁ֑וֹן מְק֖וֹם מִקְדָּשֵֽׁ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/012.yaml
  text: A glorious throne[a], exalted from the beginning, is the place of our sanctuary.
translation:
  language: hi
  text: महिमा का सिंहासन[a], जो आरम्भ से ऊँचा है, हमारे पवित्रस्थान का स्थल है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आरम्भ से ऊँचाई पर स्थित महिमा का सिंहासन हमारे पवित्रस्थान का स्थल है”; अथवा सम्भवतः, “हे महिमा के सिंहासन, जो आरम्भ से ऊँचा है, हमारे पवित्रस्थान का स्थल!” इब्रानी वाक्य अत्यन्त संक्षिप्त है और उसकी रचना को एक से अधिक ढंग से समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: כִּסֵּא
  choice: सिंहासन
  rationale: यह संज्ञा राजकीय आसन और शासन के स्थान को दर्शाती है; ‘सिंहासन’ उसके राजसी और धर्मवैचारिक बल को बनाए रखता है।
- source_word: כָבוֹד
  choice: महिमा का
  rationale: इब्रानी संज्ञा-संरचना כִּסֵּא כָבוֹד को सीधे रूप में रखते हुए ‘महिमा का सिंहासन’ चुना गया है; इससे इसे केवल विशेषण में बदलने के बजाय मूल की गरिमा बनी रहती है।
- source_word: מָרוֹם
  choice: ऊँचा
  rationale: शब्द ऊँचाई अथवा ऊँचे स्थान का बोध देता है। यहाँ ‘ऊँचा’ सिंहासन की स्थिति और उसकी महानता—दोनों का संकेत सहज रूप से देता है।
- source_word: מֵרִאשׁוֹן
  choice: आरम्भ से
  rationale: यह वाक्यांश प्रारम्भिक काल अथवा प्राचीनता का बोध देता है; ‘आरम्भ से’ उसके कालगत अर्थ को संक्षेप और स्वाभाविक ढंग से रखता है।
- source_word: מְקוֹם
  choice: स्थान
  rationale: मूल शब्द का सामान्य अर्थ ‘स्थान’ है; ‘निवासस्थान’ जैसे अधिक व्याख्यात्मक विकल्प से बचते हुए सीधा अर्थ रखा गया है।
- source_word: מִקְדָּשֵׁנוּ
  choice: हमारे पवित्रस्थान
  rationale: यह प्रत्यय सहित संज्ञा ‘हमारा पवित्र स्थान/पवित्रस्थान’ दर्शाती है। ‘हमारे पवित्रस्थान’ उपासना-संबंधी अर्थ और प्रथम पुरुष बहुवचन—दोनों को व्यक्त करता है।
theological_decisions:
- issue: क्रियारहित पदों का वाक्यगत सम्बन्ध
  choice: मुख्य पाठ महिमा के, आरम्भ से ऊँचे सिंहासन को हमारे पवित्रस्थान के स्थान के रूप में पहचानने वाला संज्ञात्मक कथन प्रस्तुत करता है।
  alternative: इसे ‘आरम्भ से ऊँचाई पर स्थित महिमा का सिंहासन हमारे पवित्रस्थान का स्थान है’ अथवा सम्बोधन के रूप में ‘हे महिमा के सिंहासन, जो आरम्भ से ऊँचा है, हमारे पवित्रस्थान के स्थान!’ भी समझा जा सकता है।
  rationale: इब्रानी अत्यन्त संक्षिप्त और क्रियारहित है, इसलिए एक से अधिक वाक्यगत संयोजन सम्भव हैं। मुख्य पाठ एक सामान्य सम्भावित विन्यास अपनाता है, जबकि पादटिप्पणी वास्तविक अस्पष्टता को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, संक्षिप्त और सामान्य पाठक के लिए बोधगम्य शैली अपनाई गई है। मूल की असामान्य संज्ञात्मक बनावट और वाक्यगत अस्पष्टता को पूरी तरह सहज बनाने के बजाय पादटिप्पणी में सुरक्षित रखा गया है।
