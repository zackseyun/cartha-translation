source:
  edition: WLC
  text: כַּבְּסִ֨י מֵ/רָעָ֤ה לִבֵּ/ךְ֙ יְר֣וּשָׁלִַ֔ם לְמַ֖עַן תִּוָּשֵׁ֑עִי עַד מָתַ֛י תָּלִ֥ין בְּ/קִרְבֵּ֖/ךְ מַחְשְׁב֥וֹת אוֹנֵֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/014.yaml
  text: Wash your heart from evil[a], Jerusalem, so that you may be saved. How long will wicked thoughts lodge within you?
translation:
  language: hi
  text: हे यरूशलेम, अपने हृदय को बुराई से धो, ताकि तू बच सके। तेरे भीतर दुष्ट विचार कब तक डेरा डाले रहेंगे?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरे भीतर तेरी अनर्थकारी योजनाएँ कब तक बनी रहेंगी?”
    reason: मַחְשְׁבוֹת का अर्थ ‘विचार’ के साथ ‘योजनाएँ’ भी हो सकता है, און दुष्टता या अनर्थ का भाव दे सकता है, और תָּלִין को ‘डेरा डाले रहेंगे’ के बजाय अधिक सामान्य रूप में ‘बनी रहेंगी’ कहा जा सकता है।
lexical_decisions:
- source_word: כַּבְּסִי
  choice: धो डाल
  rationale: मूल क्रिया कपड़े धोने की ठोस छवि रखती है। ‘धो डाल’ हृदय की आंतरिक शुद्धि के रूपक को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: מֵרָעָה
  choice: बुराई से
  rationale: इस संदर्भ में नैतिक बुराई अभिप्रेत है; ‘से’ अलग किए जाने या शुद्ध किए जाने का भाव व्यक्त करता है।
- source_word: לִבֵּךְ
  choice: अपने हृदय को
  rationale: ‘हृदय’ मूल भाषा की उस धारणा को सुरक्षित रखता है जिसमें विचार, इच्छा और भीतरी व्यक्ति सम्मिलित हैं।
- source_word: יְרוּשָׁלִַם
  choice: हे यरूशलेम
  rationale: नगर को स्त्रीलिंग एकवचन में सीधे संबोधित किया गया है; ‘हे’ हिन्दी में संबोधन को स्पष्ट और गरिमापूर्ण बनाता है।
- source_word: לְמַעַן
  choice: ताकि
  rationale: उद्देश्य का भाव आधुनिक हिन्दी में संक्षेप और स्पष्टता से व्यक्त होता है।
- source_word: תִּוָּשֵׁעִי
  choice: तू बचाई जाए
  rationale: स्त्रीलिंग एकवचन संबोधन को बनाए रखते हुए यह अनुवाद ‘बचाए जाने’ के व्यापक अर्थ को सुरक्षित रखता है, बिना उसे केवल तत्काल राजनीतिक छुटकारे या किसी संकीर्ण धर्मवैज्ञानिक अर्थ तक सीमित किए।
- source_word: עַד מָתַי
  choice: कब तक
  rationale: यह मूल के कालगत प्रश्न का स्वाभाविक हिन्दी समतुल्य है।
- source_word: תָּלִין
  choice: डेरा डाले रहेंगे
  rationale: क्रिया के रात बिताने या टिके रहने के जीवंत रूपक को ‘डेरा डाले रहना’ सहज हिन्दी में व्यक्त करता है।
- source_word: בְּקִרְבֵּךְ
  choice: तेरे भीतर
  rationale: व्यक्तिरूप में संबोधित यरूशलेम के आंतरिक जीवन को स्पष्ट करता है।
- source_word: מַחְשְׁבוֹת אוֹנֵךְ
  choice: दुष्ट विचार
  rationale: מַחְשְׁבוֹת विचारों, योजनाओं या युक्तियों को और און दुष्टता या अनर्थ को सूचित कर सकता है। मुख्य पाठ में ‘दुष्ट विचार’ हृदय के संदर्भ से स्वाभाविक रूप से जुड़ता है; वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: नबी के संदर्भ में תִּוָּשֵׁעִי का दायरा
  choice: तू बचाई जाए
  alternative: तुझे छुड़ाया जाए
  rationale: संदर्भ में आने वाले न्याय से छुटकारा भी है, पर मूल क्रिया का अर्थ उससे अधिक व्यापक हो सकता है। ‘बचाई जाए’ इस तनाव को बिना संकीर्ण किए बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। स्त्रीलिंग एकवचन ‘तू/बचाई जाए’ से व्यक्तिरूप में संबोधित यरूशलेम का व्याकरणिक स्वरूप सुरक्षित है। ‘डेरा डाले रहेंगे’ मूल के ठहरने या रात बिताने वाले रूपक को जीवंत रखता है।
