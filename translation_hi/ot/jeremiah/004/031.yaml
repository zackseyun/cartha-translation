reference: Jeremiah 4:31
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּי֩ ק֨וֹל כְּ/חוֹלָ֜ה שָׁמַ֗עְתִּי צָרָה֙ כְּ/מַבְכִּירָ֔ה ק֧וֹל בַּת צִיּ֛וֹן תִּתְיַפֵּ֖חַ תְּפָרֵ֣שׂ כַּפֶּ֑י/הָ אֽוֹי נָ֣א לִ֔/י כִּֽי עָיְפָ֥ה נַפְשִׁ֖/י לְ/הֹרְגִֽים־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/031.yaml
  text: 'For I have heard a sound like a woman in labor[a], distress like one giving birth to her first child— the sound of Daughter Zion gasping for breath, spreading out her hands: “Woe is me[c][b], for my life is faint before killers.”'
translation:
  language: hi
  text: 'क्योंकि मैंने प्रसव-वेदना से तड़पती स्त्री जैसी आवाज़[a], पहली बार बच्चे को जन्म देनेवाली की-सी व्यथा[b] सुनी है—सिय्योन की बेटी की आवाज़। वह हाँफती हुई अपने हाथ फैला रही है: “हाय मुझ पर! मेरे प्राण[c] मार डालनेवालों के सामने[d] निढाल हो गए हैं।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी קוֹל का अर्थ “आवाज़,” “पुकार” या “ध्वनि” हो सकता है; इसी शब्द का आगे फिर प्रयोग हुआ है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक भाव: “पहली बार जन्म देनेवाली की-सी”; यह विशेष रूप से तीव्र प्रसव-पीड़ा का बिंब है।'
    reason: cultural_note
  - marker: c
    text: इब्रानी נֶפֶשׁ का अर्थ प्रसंग के अनुसार “प्राण,” “जीवन,” “स्वयं” या “आत्मा” हो सकता है।
    reason: lexical_alternative
  - marker: d
    text: इसका अनुवाद “मार डालनेवालों के कारण” भी किया जा सकता है।
    reason: textual_ambiguity
lexical_decisions:
- source_word: קוֹל
  choice: आवाज़
  rationale: यह शब्द आवाज़, पुकार या ध्वनि का बोध करा सकता है। यहाँ पहले सुनाई देनेवाली ध्वनि का परिचय और फिर सिय्योन की मानवीकृत बेटी की पहचान होती है; ‘आवाज़’ दोनों प्रयोगों में स्वाभाविक है।
- source_word: כְּחוֹלָה
  choice: प्रसव-पीड़ा में पड़ी स्त्री की-सी
  rationale: यह रूप भविष्यद्वाणी के प्रसव-संबंधी बिंब में पीड़ा से तड़पती स्त्री को सूचित करता है; अगली समानांतर पंक्ति भी प्रसव की पुष्टि करती है।
- source_word: צָרָה
  choice: व्याकुलता
  rationale: यहाँ शब्द शारीरिक पीड़ा और मानसिक संकट दोनों को समेटता है। ‘व्याकुलता’ प्रसव-बिंब के भीतर उसकी तीव्रता को सहज हिन्दी में व्यक्त करती है।
- source_word: כְּמַבְכִּירָה
  choice: पहली बार बच्चे को जन्म देनेवाली की-सी
  rationale: यह रूप प्रथम प्रसव अथवा पहलौठे को जन्म देने का संकेत करता है। स्पष्ट हिन्दी वाक्यांश तुलना और विशेष रूप से तीव्र प्रसव-वेदना, दोनों को बनाए रखता है।
- source_word: בַּת צִיּוֹן
  choice: सिय्योन की बेटी
  rationale: यह यरूशलेम/सिय्योन का काव्यात्मक मानवीकरण है। प्रचलित हिन्दी पदबंध मूल की निकटता और काव्यात्मक पहचान दोनों सुरक्षित रखता है।
- source_word: תִּתְיַפֵּחַ
  choice: हाँफ रही है
  rationale: क्रिया कठिनाई से साँस लेने अथवा हाँफने का भाव देती है। यह चयन शारीरिक संकट को संक्षिप्त और स्पष्ट रूप में व्यक्त करता है।
- source_word: תְּפָרֵשׂ כַּפֶּיהָ
  choice: अपने हाथ फैला रही है
  rationale: मूल में हथेलियाँ फैलाने का हावभाव है, जो विवशता, विनती या निराशा दिखा सकता है। अनुवाद हावभाव को रखता है, पर उसका आशय अनावश्यक रूप से निश्चित नहीं करता।
- source_word: אוֹי נָא לִי
  choice: हाय मुझ पर!
  rationale: यह दुःख और तात्कालिक संकट की पुकार है। ‘हाय मुझ पर!’ गंभीरता और संक्षिप्तता बनाए रखता है; विस्मयादिबोधक चिह्न נָא की तीव्रता को व्यक्त करने में सहायक है।
- source_word: עָיְפָה נַפְשִׁי
  choice: मेरे प्राण निढाल हो गए हैं
  rationale: נפש व्यक्ति, जीवन अथवा प्राण का बोध करा सकता है और עיף थकने या शिथिल पड़ने को। मृत्यु के आसन्न खतरे में ‘प्राण’ मूल की व्यापकता को ‘आत्मा’ से अधिक स्वाभाविक ढंग से रखता है और ‘निढाल’ अत्यधिक क्षीणता दिखाता है।
- source_word: לְהֹרְגִים
  choice: हत्यारों के सामने
  rationale: संज्ञीकृत कृदंत ‘मारनेवालों/हत्यारों’ को सूचित करता है और לְ यहाँ उनके सम्मुख अथवा उनके कारण होने का संबंध व्यक्त कर सकता है। मुख्य पाठ में ‘सामने’ दृश्य की तात्कालिकता रखता है; विकल्प पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: सिय्योन का स्त्री के रूप में मानवीकरण
  choice: ‘सिय्योन की बेटी’ को विलाप करती हुई काव्यात्मक स्त्री के रूप में बनाए रखा गया है।
  alternative: इसे केवल ‘यरूशलेम’ कहकर मानवीकरण हटा देना।
  rationale: मूल पाठ नगर/समुदाय को प्रसव-पीड़ा में पड़ी स्त्री के रूप में बोलते दिखाता है। इसे बनाए रखने से काव्यात्मक और धार्मिक तनाव सुरक्षित रहता है, बिना अतिरिक्त रूपकवाद जोड़े।
- issue: נפש का अनुवाद
  choice: प्राण
  alternative: आत्मा; जीवन; स्वयं
  rationale: यहाँ हत्या के आसन्न खतरे में समूचा जीवित व्यक्ति संकट में है। ‘प्राण’ किसी बाद की देह-आत्मा संबंधी विशिष्ट धारणा थोपे बिना जीवन और अंत:स्व दोनों की हिन्दीगत गुंजाइश बनाए रखता है।
- issue: לְהֹרְגִים में संबंध
  choice: हत्यारों के सामने
  alternative: हत्यारों के कारण; हत्यारों के हाथों
  rationale: इब्रानी पूर्वसर्ग संबंध, सामना या कारण की छाया दे सकता है। मुख्य पाठ तात्कालिक सामना व्यक्त करता है और पादटिप्पणी वैकल्पिक कारणात्मक अर्थ सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर, काव्यात्मक और सहज शैली रखी गई है। ‘सिय्योन की बेटी,’ ‘हाय मुझ पर’ और प्रसव-बिंब मूल की भविष्यद्वाणी-संबंधी गरिमा बनाए रखते हैं; शेष वाक्य-विन्यास सामान्य पाठक के लिए स्पष्ट रखा गया है।
