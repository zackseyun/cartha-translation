  - severity: low
    issue: “हत्यारों” is narrower than the Hebrew participle.
    rationale: הֹרְגִים means ‘those who kill’ and need not specifically designate murderers. “मार डालनेवालों” preserves the broader sense without adding a legal or moral classification.
