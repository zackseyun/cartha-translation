  text: הִנֵּ֣ה כַּ/עֲנָנִ֣ים יַעֲלֶ֗ה וְ/כַ/סּוּפָה֙ מַרְכְּבוֹתָ֔י/ו קַלּ֥וּ מִ/נְּשָׁרִ֖ים סוּסָ֑י/ו א֥וֹי לָ֖/נוּ כִּ֥י שֻׁדָּֽדְנוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/013.yaml
  text: Look[a], he comes up like clouds, and his chariots are like the whirlwind; his horses are swifter than eagles. Woe to us, for we are ruined!
translation:
  language: hi
  text: देखो, वह बादलों के समान चढ़ता आ रहा है; उसके रथ बवंडर के समान हैं। उसके घोड़े उकाबों[a] से भी तेज़ हैं। हाय, हमारा सर्वनाश हो गया!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘गिद्धों’; इब्रानी נְשָׁרִים बड़े शिकारी या मृतभक्षी पक्षियों के लिए प्रयुक्त हो सकता है। यहाँ ‘उकाबों’ पारंपरिक अनुवाद है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह शब्द आसन्न संकट की ओर तत्काल ध्यान खींचता है; आधुनिक हिन्दी में ‘देखो’ उसकी तात्कालिकता और उद्गारात्मक बल बनाए रखता है।
- source_word: כַּעֲנָנִים
  choice: बादलों के समान
  rationale: उपसर्ग כְּ की उपमा और बहुवचन ‘बादलों’ को बनाए रखा गया है, जिससे उमड़ते हुए व्यापक खतरे का चित्र उभरता है।
- source_word: יַעֲלֶה
  choice: चढ़ता आ रहा है
  rationale: עלה में ऊपर आने/चढ़ने की दिशात्मकता है; प्रसंग में यह आक्रमणकारी के निकट आते आगे बढ़ने को व्यक्त करता है।
- source_word: וְכַסּוּפָה
  choice: बवंडर के समान
  rationale: סוּפָה प्रचंड तूफ़ान या बवंडर का द्योतक है; ‘बवंडर’ सैन्य आक्रमण की तीव्र और विनाशकारी उपमा को सजीव रखता है।
- source_word: מַרְכְּבוֹתָיו
  choice: उसके रथ
  rationale: सीधा स्वामित्व-संबंध रखा गया है; प्रसंग से इनका युद्ध-रथ होना स्पष्ट है, इसलिए अतिरिक्त शब्द आवश्यक नहीं।
- source_word: קַלּוּ
  choice: तेज़ हैं
  rationale: קלל यहाँ हलकेपन से उत्पन्न तीव्र गति को दर्शाता है; מן के साथ ‘से भी तेज़’ स्वाभाविक हिन्दी में तुलनात्मक अर्थ प्रकट करता है।
- source_word: מִנְּשָׁרִים
  choice: उकाबों से भी
  rationale: נשר बड़े शिकारी अथवा मृतभक्षी पक्षी को सूचित कर सकता है। ‘उकाब’ पारंपरिक और गति की इस उपमा के अनुकूल है; वैकल्पिक पहचान पाद-टिप्पणी में दी गई है।
- source_word: סוּסָיו
  choice: उसके घोड़े
  rationale: मूल के साधारण संज्ञा और पुरुषवाचक स्वामित्व को सीधे रखा गया है।
- source_word: אוֹי לָנוּ
  choice: हाय हम पर
  rationale: यह अनिष्ट और विपत्ति की तीव्र सामूहिक पुकार है; यह रूप भविष्यवाणी-संबंधी गरिमा और भावनात्मक बल दोनों को बनाए रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ כִּי विलाप का कारण प्रस्तुत करता है; ‘क्योंकि’ उस संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: שֻׁדָּדְנוּ
  choice: हम उजाड़ दिए गए हैं
  rationale: שׁדד का निष्क्रिय रूप हिंसक लूट और तबाही को व्यक्त करता है। ‘उजाड़ दिए गए हैं’ परिणाम और बाहरी आक्रमण—दोनों को रखता है, बिना पूर्ण विनाश का अनावश्यक दावा किए।
theological_decisions:
- issue: आक्रमणकारी की पहचान
  choice: सर्वनाम ‘वह/उसके’ को मूल के अनुसार अनिर्दिष्ट रखा गया है।
  alternative: पद में ‘शत्रु’, ‘राजा’ या किसी विशिष्ट राष्ट्र का नाम जोड़ना।
  rationale: इस पद में कर्ता का नाम स्पष्ट रूप से नहीं दिया गया; प्रसंग उसकी पहचान समझा सकता है, पर अनुवाद में उसे जोड़ना मूल की अस्पष्टता को समाप्त कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सजीव, तात्कालिक और गरिमापूर्ण भविष्यवाणी-वाणी रखी गई है। ‘चढ़ता आ रहा है’ दिशात्मक गति को, ‘बवंडर’ हिंसक वेग को, और ‘उजाड़ दिए गए हैं’ निष्क्रिय, परिणामसूचक विनाश को व्यक्त करता है। पाद-टिप्पणी चिह्न [a] मुख्य पाठ में संबंधित शब्द के तुरंत बाद रखा गया है।
