id: JER.4.30
reference: Jeremiah 4:30
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: ו/אתי שָׁד֜וּד מַֽה תַּעֲשִׂ֗י כִּֽי תִלְבְּשִׁ֨י שָׁנִ֜י כִּי תַעְדִּ֣י עֲדִי זָהָ֗ב כִּֽי תִקְרְעִ֤י בַ/פּוּךְ֙ עֵינַ֔יִ/ךְ לַ/שָּׁ֖וְא תִּתְיַפִּ֑י מָאֲסוּ בָ֥/ךְ עֹגְבִ֖ים נַפְשֵׁ֥/ךְ יְבַקֵּֽשׁוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/030.yaml
  text: And you[a], devastated one, what will you do? Though you dress in scarlet, though you adorn yourself with ornaments of gold, though you enlarge your eyes with paint, you beautify yourself in vain. Your lovers despise you[b]; they seek your life.
translation:
  language: hi
  text: और तू, उजड़ी हुई स्त्री[a], क्या करेगी? चाहे तू लाल रंग के वस्त्र पहने, चाहे सोने के गहनों से अपने को सजाए, चाहे सुरमे से अपनी आँखें बड़ी दिखाए[b], फिर भी तेरा सँवरना व्यर्थ है। तेरे प्रेमी तुझे ठुकरा चुके हैं; वे तेरे प्राण के पीछे पड़े हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उजड़ी हुई स्त्री’ का अनुवाद ‘लूटी हुई स्त्री’ या ‘नष्ट हुई स्त्री’ भी हो सकता है। इब्रानी में संबोधन स्त्रीलिंग एकवचन है; संभवतः यरूशलेम या सिय्योन को स्त्री के रूप में संबोधित किया गया है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ है, “तू सुरमे से अपनी आँखें फाड़े।” यह गहरे नेत्र-प्रसाधन से आँखों को बड़ा या अधिक उभरा दिखाने का मुहावरा है।
    reason: cultural_note
lexical_decisions:
- source_word: שָׁדוּד
  choice: उजड़ी हुई स्त्री
  rationale: यह שׁדד से बना स्त्रीलिंग एकवचन निष्क्रिय रूप है और उजाड़े जाने की अवस्था बताता है। ‘उजड़ी हुई स्त्री’ स्त्रीलिंग संबोधन को स्पष्ट रखते हुए लूट और विनाश, दोनों के व्यापक भाव को समेटता है।
- source_word: מַה תַּעֲשִׂי
  choice: क्या करेगी?
  rationale: द्वितीय पुरुष स्त्रीलिंग एकवचन अपूर्ण रूप इस आलंकारिक प्रश्न में भावी या संभाव्य अर्थ देता है।
- source_word: שָׁנִי
  choice: लाल रंग के वस्त्र
  rationale: यह गहरे चटकीले लाल रंग की रंगी हुई सामग्री को दर्शाता है। साधारण पाठक के लिए ‘लाल रंग के वस्त्र’ स्वाभाविक है; केवल ‘लाल’ कहने की अपेक्षा वस्त्र का निहित भाव स्पष्ट करता है।
- source_word: תַעְדִּי עֲדִי זָהָב
  choice: सोने के गहनों से अपने को सजाए
  rationale: क्रिया का आत्मवाचक सजने का भाव और עֲדִי का आभूषणार्थ दोनों सहज हिन्दी में सुरक्षित हैं।
- source_word: תִקְרְעִי בַפּוּךְ עֵינַיִךְ
  choice: सुरमे से अपनी आँखें बड़ी दिखाए
  rationale: शाब्दिक रूप से आँखों को ‘फाड़ने’ का मुहावरा गहरे नेत्र-प्रसाधन से उन्हें चौड़ा या उभरा हुआ दिखाने को सूचित करता है; शाब्दिक अनुवाद हिन्दी में भ्रमित करेगा।
- source_word: פּוּךְ
  choice: सुरमा
  rationale: यह आँखों के चारों ओर लगाया जाने वाला गहरा प्रसाधन है। ‘सुरमा’ आधुनिक हिन्दी पाठक के लिए ‘कोहल’ या ‘एण्टिमनी’ से अधिक सहज सांस्कृतिक समतुल्य है।
- source_word: לַשָּׁוְא תִּתְיַפִּי
  choice: तेरा सँवरना व्यर्थ है
  rationale: यह निष्फल आत्म-सौंदर्यीकरण का अर्थ स्वाभाविक और संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: מָאֲסוּ בָךְ עֹגְבִים
  choice: तेरे प्रेमी तुझे ठुकरा चुके हैं
  rationale: עֹגְבִים भविष्यद्वक्ताओं की रूपक-भाषा में अनुचित प्रेमियों या राजनीतिक सहयोगियों को दर्शाता है। ‘प्रेमी’ रूपक को बनाए रखता है और מָאֲסוּ की पूर्ण क्रिया को ‘ठुकरा चुके हैं’ व्यक्त करता है।
- source_word: נַפְשֵׁךְ יְבַקֵּשׁוּ
  choice: वे तेरे प्राण के पीछे पड़े हैं
  rationale: यह हिन्दी मुहावरा किसी की जान लेने के प्रयत्न को स्पष्ट करता है और נֶפֶשׁ के ‘जीवन/प्राण’ अर्थ को बनाए रखता है।
theological_decisions:
- issue: यरूशलेम/सिय्योन का स्त्री के रूप में भविष्यद्वाणीपरक मानवीकरण
  choice: स्त्रीलिंग एकवचन संबोधन को ‘तू’ और ‘उजड़ी हुई स्त्री’ से बनाए रखा गया, पर मुख्य पाठ में यरूशलेम या सिय्योन नाम नहीं जोड़ा गया।
  alternative: मुख्य पाठ में ‘हे यरूशलेम’ या ‘सिय्योन की बेटी’ जोड़ना, अथवा संबोधन को लिंग-निरपेक्ष करना।
  rationale: इब्रानी व्याकरण स्त्रीलिंग एकवचन आकृति को स्पष्ट करता है, पर इस पद में उसका नाम नहीं लेता। चुना हुआ रूप मानवीकरण बचाता है और पहचान को आवश्यकता से अधिक निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज और प्रत्यक्ष भविष्यद्वाणीपरक स्वर रखा गया है। स्त्रीलिंग संबोधन के कारण ‘तू/तेरा’ प्रयोग हुआ है। ‘सँवरना’ और ‘प्राण के पीछे पड़े हैं’ जैसे स्वाभाविक मुहावरों से अर्थ स्पष्ट किया गया है, जबकि शाब्दिक चित्र footnote में सुरक्षित है।
