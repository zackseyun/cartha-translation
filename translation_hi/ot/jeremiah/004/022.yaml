id: JER.4.22
reference: Jeremiah 4:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֣י אֱוִ֣יל עַמִּ֗/י אוֹתִ/י֙ לֹ֣א יָדָ֔עוּ בָּנִ֤ים סְכָלִים֙ הֵ֔מָּה וְ/לֹ֥א נְבוֹנִ֖ים הֵ֑מָּה חֲכָמִ֥ים הֵ֨מָּה֙ לְ/הָרַ֔ע וּ/לְ/הֵיטִ֖יב לֹ֥א יָדָֽעוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/022.yaml
  text: For my people are foolish; they do not know me. They are foolish children[a], and they have no understanding. They are wise to do evil, but they do not know how to do good.
translation:
  language: hi
  text: क्योंकि मेरी प्रजा मूर्ख है; वे मुझे नहीं जानते। वे नासमझ संतान[a] हैं, और उनमें समझ नहीं है। वे बुराई करने में बुद्धिमान हैं, पर भलाई करना नहीं जानते।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘नासमझ पुत्र’; यहाँ ‘पुत्र’ पूरी प्रजा के लिए सामूहिक रूप में प्रयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले न्याय-दर्शन का कारण या स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ उस संबंध को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: אֱוִיל
  choice: मूर्ख
  rationale: यह केवल बुद्धि की कमी नहीं, बल्कि नैतिक और आत्मिक मूर्खता व्यक्त करता है।
- source_word: עַמִּי
  choice: मेरी प्रजा
  rationale: वाचा-संबंधी अधिकार और उससे उत्पन्न विडंबना को बनाए रखता है।
- source_word: אוֹתִי לֹא יָדָעוּ
  choice: वे मुझे नहीं जानते
  rationale: सरल क्रिया को बनाए रखते हुए परमेश्वर के साथ संबंधपरक और वाचा-संबंधी पहचान का भाव खुला रखता है।
- source_word: בָּנִים סְכָלִים
  choice: नासमझ संतान
  rationale: בָּנִים सामूहिक रूप से पूरी प्रजा को दर्शाता है और סְכָלִים तीखी मूढ़ता बताता है; ‘नासमझ संतान’ आधुनिक हिन्दी में स्वाभाविक तथा गरिमापूर्ण है।
- source_word: וְלֹא נְבוֹנִים הֵמָּה
  choice: और उनमें समझ नहीं है
  rationale: נבון की विवेक और सूझ-बूझ संबंधी कमी को सहज हिन्दी में व्यक्त करता है।
- source_word: חֲכָמִים הֵמָּה לְהָרַע
  choice: वे बुराई करने में बुद्धिमान हैं
  rationale: 'मूल की विडंबना को बनाए रखता है: उनकी व्यावहारिक कुशलता बुराई की दिशा में लगी है।'
- source_word: וּלְהֵיטִיב לֹא יָדָעוּ
  choice: पर भलाई करना नहीं जानते
  rationale: यָדַע यहाँ व्यावहारिक और नैतिक क्षमता का संकेत देता है; हिन्दी वाक्य उस अर्थ को संक्षेप में संप्रेषित करता है।
theological_decisions:
- issue: परमेश्वर को ‘जानने’ का स्वरूप
  choice: संबंधपरक और वाचा-संबंधी अर्थ को सरल ‘मुझे नहीं जानते’ में बनाए रखा गया।
  alternative: केवल बौद्धिक जानकारी या ‘मुझे स्वीकार नहीं करते’।
  rationale: भविष्यद्वाणी के संदर्भ में परमेश्वर को जानना नैतिक और वाचा-संबंधी पहचान भी समेटता है; फिर भी पाठ में सरल क्रिया रखना मूल की अर्थ-व्याप्ति को सीमित नहीं करता।
- issue: בָּנִים का सामूहिक और लिंग-संबंधी अर्थ
  choice: संतान
  alternative: पुत्र / बच्चे
  rationale: यहाँ पुल्लिंग बहुवचन केवल पुरुषों तक सीमित नहीं, बल्कि पूरी प्रजा के लिए सामूहिक संबोधन है। ‘संतान’ मूल रूपक और सामूहिकता दोनों को सुरक्षित रखता है।
- issue: बुराई में ‘बुद्धिमान’ होने की विडंबना
  choice: ‘बुराई करने में बुद्धिमान’ के रूप में विडंबनापूर्ण भाषा बनाए रखी गई।
  alternative: बुराई करने में कुशल
  rationale: ‘कुशल’ अर्थ स्पष्ट कर सकता है, पर חכם के ‘बुद्धिमान’ शब्द और आगे की नैतिक उलटबाँसी को कम कर देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सीधा भविष्यद्वाणी-संबंधी स्वर रखा गया है। ‘मूर्ख’, ‘नासमझ’ और ‘बुद्धिमान’ के क्रम से मूल की नैतिक तीक्ष्णता और विडंबना सुरक्षित रहती है।
