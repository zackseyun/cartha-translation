- source_word: הַשְׁמִיעוּ עַל יְרוּשָׁלִַם
  choice: यरूशलेम के विषय में यह सुनाओ
  rationale: שמע के हिफ़ील का अर्थ ‘सुनाना/घोषित करना’ है; עַל को यहाँ घोषणा के विषय के रूप में लिया गया है।
- source_word: נֹצְרִים
  choice: घेरा डालनेवाले
  rationale: शब्द का मूल भाव निगरानी या पहरा देनेवालों का है, पर 4:17 और सैन्य प्रसंग में नगर को चारों ओर से घेरे शत्रु अभिप्रेत हैं। हिन्दी में शाब्दिक ‘पहरेदार’ मित्रवत रक्षकों का भ्रम दे सकता है; संदर्भगत अर्थ मुख्य पाठ में रखा गया है और शाब्दिक संभावना पादटिप्पणी में संरक्षित है।
- source_word: בָּאִים
  choice: आ रहे हैं
  rationale: कृदंत निकट आती हुई और जारी गतिविधि व्यक्त करता है; हिन्दी का अपूर्ण वर्तमान इसे स्वाभाविक रूप से दर्शाता है।
- source_word: מֵאֶרֶץ הַמֶּרְחָק
  choice: दूर देश से
  rationale: भौगोलिक दूरी का संक्षिप्त और स्वाभाविक हिन्दी रूप, एकवचन सामूहिक अर्थ को बनाए रखते हुए।
- source_word: וַיִּתְּנוּ ... קוֹלָם
  choice: वे ... अपनी आवाज़ उठा रहे हैं
  rationale: ‘अपनी आवाज़ देना’ इब्रानी मुहावरा ऊँचे स्वर से पुकारने के अर्थ में है; ‘आवाज़ उठाना’ चित्रात्मकता और तीव्रता दोनों रखता है।
- source_word: עַל עָרֵי יְהוּדָה
  choice: यहूदा के नगरों के विरुद्ध
  rationale: सैन्य धमकी के प्रसंग में עַל का विरोधात्मक अर्थ है; ‘के विरुद्ध’ शत्रुतापूर्ण दिशा को स्पष्ट करता है।
