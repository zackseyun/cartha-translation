base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/016.yaml
  text: 'Declare it to the nations: ‘Look[a], proclaim it concerning Jerusalem: Watchers are coming from a distant land, and they raise their voice against the cities of Judah.’'
translation:
  language: hi
  text: 'जातियों को इसकी घोषणा करो: “देखो, यरूशलेम के विषय में घोषणा करो: दूर देश से निगरानी रखने वाले[a] आ रहे हैं, और वे यहूदा के नगरों के विरुद्ध अपनी आवाज़ उठा रहे हैं।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “घेरा डालने वाले।” इब्रानी शब्द का शाब्दिक अर्थ निगरानी या पहरा रखने वाले लोग है; पर इस सैन्य प्रसंग में यह नगरों को घेरने वाली शत्रु सेनाओं के लिए भी प्रयुक्त हो सकता है।
    reason: lexical_alternative
