  yaml_path: translation/ot/jeremiah/004/001.yaml
  text: If you return[a], O Israel, declares Yahweh, to me you should return; if you remove your detestable things from before me and do not wander about[c][b],
translation:
  language: hi
  text: “यदि तू लौटे, हे इस्राएल,” यहोवा की घोषणा है, “तो मेरे पास लौट आ। यदि तू अपनी घृणित वस्तुएँ[a] मेरे सामने से हटा दे और भटकता न फिरे[b],”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपनी घृणास्पद वस्तुएँ।” यह शब्द विशेषकर घृणित मूर्तिपूजक वस्तुओं के लिए प्रयुक्त हो सकता है; “अपनी मूर्तियाँ” संदर्भानुकूल, पर अधिक व्याख्यात्मक अनुवाद है।
    reason: lexical_alternative
  - marker: b
    text: या, “डगमगाता न रहे” या “भटके नहीं।” इब्रानी क्रिया भटकने, अस्थिर होने, या डोलने का भाव दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם תָּשׁוּב
  choice: यदि तू लौटे
  rationale: शर्तसूचक אִם और שוב के लौटने/फिरने के मूल अर्थ को बनाए रखता है; ‘मन फिराना’ कहकर अर्थ को केवल आंतरिक पश्चात्ताप तक सीमित नहीं करता।
- source_word: יִשְׂרָאֵל
  choice: हे इस्राएल
  rationale: प्रत्यक्ष संबोधन को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: נְאֻם יְהוָה
  choice: यहोवा की यह घोषणा है
  rationale: स्थिर नबूवत-सूत्र की गंभीरता बनाए रखते हुए יְהוָה को व्यक्तिगत वाचा-नाम ‘यहोवा’ के रूप में प्रस्तुत करता है।
- source_word: אֵלַי תָּשׁוּב
  choice: तो मेरे ही पास लौट
  rationale: दूसरे שוב को स्पष्ट रूप से बनाए रखता है और אֵלַי पर निहित बल को ‘ही’ से स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְאִם תָּסִיר
  choice: और यदि तू ... हटा दे
  rationale: दूसरी शर्त को बनाए रखता है और हिफ़ील क्रिया का कारक अर्थ ‘हटा देना’ से व्यक्त करता है।
- source_word: שִׁקּוּצֶיךָ
  choice: अपनी घृणित वस्तुओं
  rationale: शब्द की तीव्र घृणा और वस्तुगत बहुवचन को सुरक्षित रखता है; सन्दर्भ में मूर्तियाँ सम्भावित हैं, पर मुख्य पाठ को अनावश्यक रूप से संकीर्ण नहीं करता।
- source_word: מִפָּנַי
  choice: मेरे सामने से
  rationale: ‘मेरे मुख/उपस्थिति के सामने से’ की स्थानिक और सम्बन्धपरक छवि को सहज हिन्दी में बनाए रखता है।
- source_word: וְלֹא תָנוּד
  choice: और भटकता न फिरे
  rationale: נוד में निहित भटकने, इधर-उधर फिरने और अस्थिर होने की अर्थ-सीमा को सन्दर्भानुकूल रूप से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में वाचा का व्यक्तिगत नाम है। हिन्दी बाइबिलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला ‘यहोवा’ नाम को सामान्य उपाधि में बदलने से बचाता है।
- issue: दोहराए गए שוב का बल
  choice: “यदि तू लौटे ... तो मेरे ही पास लौट”
  alternative: “यदि तू लौटे ... तो मेरे पास लौट आएगा”
  rationale: दोनों क्रियाओं को बनाए रखते हुए दूसरे पद को आह्वान के रूप में पढ़ता है; ‘ही’ लौटने के सही लक्ष्य—यहोवा—पर बल देता है।
- issue: וְלֹא תָנוּד का व्याकरणिक/अर्थगत बल
  choice: 'आदेशात्मक परिणाम: “और भटकता न फिरे”'
  alternative: 'परिणामसूचक: “तो तू भटकता न फिरेगा/उखाड़ा न जाएगा”'
  rationale: रूप अपूर्ण क्रिया है और सन्दर्भ में निषेधात्मक आह्वान स्वाभाविक है, किन्तु परिणाम या स्थिरता का पाठ भी सम्भव है; इसलिए वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; एकवचन ‘तू’ मूल के एकवचन सम्बोधन और भविष्यद्वक्ताई निकटता को दर्शाता है। शैली गरिमापूर्ण है, पर अत्यधिक संस्कृतनिष्ठ नहीं। उद्धरण का अन्त अल्पविराम पर रखा गया है क्योंकि पद 2 में वाक्य आगे चलता है।
