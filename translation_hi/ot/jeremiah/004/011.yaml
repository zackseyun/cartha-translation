id: JER.4.11
reference: Jeremiah 4:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בָּ/עֵ֣ת הַ/הִ֗יא יֵאָמֵ֤ר לָֽ/עָם הַ/זֶּה֙ וְ/לִ/יר֣וּשָׁלִַ֔ם ר֣וּחַ צַ֤ח שְׁפָיִים֙ בַּ/מִּדְבָּ֔ר דֶּ֖רֶךְ בַּת עַמִּ֑/י ל֥וֹא לִ/זְר֖וֹת וְ/ל֥וֹא לְ/הָבַֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/011.yaml
  text: 'At that time it will be said to this people and to Jerusalem: “A scorching wind from the bare heights in the wilderness comes toward the daughter of my people—not for winnowing and not for cleansing.”'
translation:
  language: hi
  text: उस समय इस प्रजा और यरूशलेम से कहा जाएगा, “मेरी प्रजा की बेटी की ओर मरुभूमि की उजाड़ पहाड़ियों से झुलसाने वाली हवा आ रही है—न तो अनाज फटकने के लिए और न उसे साफ़ करने के लिए।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רוּחַ צַח
  choice: झुलसाने वाली हवा
  rationale: צַח यहाँ शुष्क, तीखी अथवा प्रचंड हवा का बोध कराता है; न्याय के प्रसंग में ‘झुलसाने वाली’ स्वाभाविक हिंदी में उसकी विनाशकारी तीव्रता व्यक्त करता है।
- source_word: שְׁפָיִים
  choice: उजाड़ पहाड़ियाँ
  rationale: यह शब्द वृक्षहीन या खुले ऊँचे स्थानों को सूचित करता है; ‘उजाड़ पहाड़ियाँ’ मरुभूमि के खुले ऊँचे भूभाग का सहज चित्र देती हैं।
- source_word: דֶּרֶךְ בַּת עַמִּי
  choice: मेरी प्रजा की बेटी की ओर
  rationale: דֶּרֶךְ को दिशासूचक अर्थ में लिया गया है। ‘मेरी प्रजा की बेटी’ मूल रूपक को बनाए रखता है और उसे केवल ‘मेरी प्रजा’ में समतल नहीं करता।
- source_word: לִזְרוֹת
  choice: अनाज फटकने
  rationale: कृषि-संबंधी क्रिया का आशय भूसी अलग करने के लिए अनाज को हवा में फटकना है; संज्ञेय वस्तु ‘अनाज’ जोड़ने से हिंदी में क्रिया स्पष्ट होती है।
- source_word: לְהָבַר
  choice: उसे साफ़ करने
  rationale: यहाँ क्रिया अनाज को छाँटकर या साफ़ करके शुद्ध करने की प्रक्रिया दर्शाती है; ‘उसे’ का संकेत अनाज की ओर है।
theological_decisions:
- issue: हवा की भूमिका
  choice: इसे साधारण फटकाई या सफ़ाई की हवा नहीं, बल्कि आने वाले दंड की अत्यधिक प्रचंड हवा के रूप में व्यक्त किया गया है।
  alternative: इसे शुद्धिकरण की रूपकात्मक प्रक्रिया मानना।
  rationale: ‘न तो…और न…’ दोनों सामान्य कृषि-उद्देश्यों का स्पष्ट निषेध करता है; पद का तनाव यह है कि हवा सुधारात्मक से बढ़कर विनाशकारी न्याय का संकेत देती है।
- issue: ‘मेरी प्रजा की बेटी’ का रूपक
  choice: मूल संबंधपरक रूपक सुरक्षित रखा गया है।
  alternative: ‘मेरी प्रजा’ या ‘मेरे लोगों’ के रूप में सरल करना।
  rationale: हिब्रू की विशिष्ट काव्यात्मक अभिव्यक्ति को बनाए रखने से सामुदायिक और करुणापूर्ण संबोधन का तनाव सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमामय, स्पष्ट और काव्यात्मक शैली। कृषि-बिंब को सामान्य पाठक के लिए समझने योग्य बनाया गया है, जबकि हिब्रू का ‘मेरी प्रजा की बेटी’ रूपक जानबूझकर सुरक्षित रखा गया है।
