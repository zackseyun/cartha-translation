base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/012.yaml
  text: A wind too full for these will come for me[b][a]; now I myself will also speak judgments against them.
translation:
  language: hi
  text: इनसे भी अधिक प्रचंड हवा मेरे लिए आएगी[a]; अब मैं स्वयं भी उनके विरुद्ध न्यायिक निर्णय सुनाऊँगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इनसे भरी हुई हवा मेरे पास आएगी।” हिब्रू वाक्यांश बहुत संक्षिप्त है और उसमें तुलना, स्रोत या प्रयोजन का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “अब मैं भी उनके विरुद्ध न्याय-वचन बोलूँगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּחַ
  choice: हवा
  rationale: आस-पास के प्रसंग में उजाड़ ऊँचाइयों से आने वाली हवा का मौसम-संबंधी रूपक चल रहा है; इसलिए यहाँ ‘आत्मा’ या ‘श्वास’ के बजाय ‘हवा’ उपयुक्त है।
- source_word: מָלֵא מֵאֵלֶּה
  choice: इनसे भी अधिक प्रचंड
  rationale: מָלֵא का मूल अर्थ ‘भरा हुआ/पूरा’ है, पर पिछले पद में ओसाने और साफ़ करने के लिए आने वाली हवा से तुलना के कारण यहाँ अत्यधिक तीव्रता का भाव है। ‘अधिक प्रचंड’ स्वाभाविक हिन्दी में इस निहित तुलना को व्यक्त करता है; हिब्रू की संक्षिप्तता और वैकल्पिक समझ को पादटिप्पणी में रखा गया है।
- source_word: יָבוֹא לִי
  choice: मेरे लिए आएगी
  rationale: शाब्दिक अर्थ ‘मेरे पास/मेरे लिए आएगी’ है। यह अनुवाद इस संभावना को खुला रखता है कि हवा परमेश्वर के प्रयोजन से या उसके अधिकार में आती है, बिना इसे अत्यधिक स्पष्ट करके मूल की संक्षिप्तता मिटाए।
- source_word: עַתָּה
  choice: अब
  rationale: यह सामान्य कालवाचक क्रियाविशेषण का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: גַּם אֲנִי
  choice: मैं स्वयं भी
  rationale: ‘भी’ additive particle का और ‘स्वयं’ स्वतंत्र सर्वनाम से आने वाले बल का संकेत देता है।
- source_word: אֲדַבֵּר מִשְׁפָּטִים
  choice: न्याय के निर्णय सुनाऊँगा
  rationale: אֲדַבֵּר मूलतः ‘बोलूँगा’ है, जबकि מִשְׁפָּטִים यहाँ न्यायिक घोषणाओं को दर्शाता है। हिन्दी में ‘निर्णय सुनाना’ न्यायिक प्रसंग को स्वाभाविक रूप से व्यक्त करता है; अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: אוֹתָם
  choice: उनके विरुद्ध
  rationale: व्याकरणतः यह कर्म-सूचक रूप है, पर न्यायिक घोषणाओं के संदर्भ में हिन्दी वाक्य-विन्यास के लिए ‘उनके विरुद्ध’ आशय स्पष्ट और स्वाभाविक बनाता है।
theological_decisions:
- issue: ‘मेरे लिए’ और ‘मैं स्वयं भी’ में वक्ता की पहचान
  choice: वक्ता यहोवा है, जो विनाशकारी हवा के आने और लोगों के विरुद्ध अपने न्यायिक निर्णयों की घोषणा करता है।
  alternative: पद के किसी भाग में भविष्यद्वक्ता प्रथम पुरुष में बोल रहा हो; अथवा ‘मेरे लिए’ केवल दिशासूचक ‘मेरे पास’ हो, जिसमें अभिकर्तृत्व का विशेष भाव न हो।
  rationale: व्यापक प्रसंग में परमेश्वर की न्याय-वाणी चल रही है और प्रथम पुरुष के रूप उसी वाणी को स्वाभाविक रूप से आगे बढ़ाते हैं। फिर भी अनुवाद में ‘यहोवा कहता है’ जोड़कर मूल से अधिक स्पष्टता नहीं थोपी गई।
- issue: מִשְׁפָּטִים का न्यायिक स्वर
  choice: इसे लोगों के विरुद्ध सुनाए जाने वाले ‘न्याय के निर्णय’ माना गया है।
  alternative: इसे सामान्य ‘न्याय’ या अधिक शाब्दिक ‘न्याय-वचन’ समझा जा सकता है।
  rationale: बहुवचन और ‘उनके विरुद्ध’ का प्रसंग अमूर्त न्याय की अपेक्षा दंडात्मक न्याय-घोषणाओं की ओर संकेत करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर भविष्यद्वाणी-संबंधी शैली रखी गई है। ‘प्रचंड हवा’ सामान्य पाठक के लिए स्पष्ट है, जबकि ‘न्याय के निर्णय सुनाऊँगा’ न्यायिक बल को स्वाभाविक हिन्दी में व्यक्त करता है। मूल हिब्रू की वास्तविक अस्पष्टता को [a] में सुरक्षित रखा गया है।
