base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/025.yaml
  text: I looked[a], and behold, there was no man, and all the birds of the heavens had fled.
translation:
  language: hi
  text: मैंने देखा[a], और देखो, वहाँ कोई मनुष्य नहीं था, और आकाश के सारे पक्षी उड़ चले गए थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कोई मानव नहीं था” अथवा “मानवजाति नहीं थी।” यहाँ इब्रानी का एकवचन “मनुष्य” जातिवाचक और प्रतिनिधिक अर्थ में है।
    reason: alternative_reading
lexical_decisions:
- source_word: רָאִיתִי
  choice: मैंने देखा
  rationale: यह क़ाल पूर्ण, प्रथम पुरुष एकवचन है। आसपास बार-बार आने वाले दर्शन-वर्णन में यह नबी द्वारा दृश्य को देखने का संकेत देता है; स्वाभाविक हिन्दी में “मैंने देखा” उपयुक्त है।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: הִנֵּה पाठक का ध्यान अचानक सामने आए दृश्य की ओर खींचता है। “और देखो” उसकी सजीवता और भविष्यद्वाणी-संबंधी गरिमा बनाए रखता है।
- source_word: אֵין
  choice: वहाँ कोई … नहीं था
  rationale: यह अस्तित्व का निषेध है। पिछले दर्शनात्मक क्रम के अनुरूप हिन्दी में भूतकाल “नहीं था” स्वाभाविक है; “वहाँ” दृश्यगत अस्तित्व को स्पष्ट करता है।
- source_word: הָאָדָם
  choice: कोई मनुष्य
  rationale: सप्रत्यय एकवचन אָדָם यहाँ जातिवाचक और प्रतिनिधिक अर्थ में है, किसी एक पुरुष-मात्र के लिए नहीं। “कोई मनुष्य” मूल के एकवचन रूप को रखते हुए हिन्दी में सम्पूर्ण मानवीय अनुपस्थिति व्यक्त करता है।
- source_word: וְכָל
  choice: और … सारे
  rationale: सामूहिक संज्ञा के साथ כָּל सम्पूर्णता बताता है; हिन्दी में “सारे पक्षी” सहज और स्पष्ट है।
- source_word: עוֹף הַשָּׁמַיִם
  choice: आकाश के … पक्षी
  rationale: इस पदबंध में עוֹף उड़ने वाले प्राणियों, विशेषतः पक्षियों, को और שָׁמַיִם दृश्य आकाश को दर्शाता है। “आकाश के पक्षी” आधुनिक हिन्दी में स्पष्ट रहते हुए इब्रानी पदबंध को निकटता से व्यक्त करता है।
- source_word: נָדָדוּ
  choice: उड़ गए थे
  rationale: נדד दूर चले जाने, भटक जाने या भाग जाने का भाव रखता है। पक्षियों के संदर्भ में “उड़ गए थे” स्वाभाविक है और बताता है कि नबी के देखने से पहले वे उस उजड़े दृश्य से जा चुके थे।
theological_decisions:
- issue: הָאָדָם का जातिवाचक एकवचन अर्थ
  choice: कोई मनुष्य
  alternative: कोई मानव / मानवजाति नहीं थी
  rationale: इब्रानी में शब्द व्याकरणतः एकवचन है, पर अर्थ किसी पुरुष-विशेष तक सीमित नहीं, बल्कि मानव उपस्थिति का पूर्ण अभाव है। मुख्य पाठ में “मनुष्य” मूल के रूप और प्रतिनिधिक भाव दोनों को रखता है; समावेशी सामूहिक अर्थ पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। “और देखो” मूल के दर्शनात्मक विस्मय को बनाए रखता है; “आकाश के पक्षी” सामान्य पाठक के लिए स्पष्ट है।
