  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הִמֹּ֣לוּ לַ/יהֹוָ֗ה וְ/הָסִ֨רוּ֙ עָרְל֣וֹת לְבַבְ/כֶ֔ם אִ֥ישׁ יְהוּדָ֖ה וְ/יֹשְׁבֵ֣י יְרוּשָׁלִָ֑ם פֶּן תֵּצֵ֨א כָ/אֵ֜שׁ חֲמָתִ֗/י וּ/בָעֲרָה֙ וְ/אֵ֣ין מְכַבֶּ֔ה מִ/פְּנֵ֖י רֹ֥עַ מַעַלְלֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/004.yaml
  text: Circumcise yourselves to Yahweh[a], and remove the foreskins of your hearts, men of Judah and inhabitants of Jerusalem, lest my wrath go out like fire and burn, with no one to quench it[b], because of the evil of your deeds.
translation:
  language: hi
  text: याहवे के लिए अपना खतना करो और अपने हृदयों की खलड़ियाँ दूर करो[a], हे यहूदा के पुरुषों और यरूशलेम के निवासियो! ऐसा न हो कि मेरा क्रोध आग की तरह निकल पड़े[b] और जल उठे, और उसे बुझानेवाला कोई न हो, तुम्हारे बुरे कामों के कारण।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “अपने हृदयों की खलड़ियाँ दूर करो।” यह भीतरी वाचा-निष्ठा और पश्चात्ताप का रूपक है।
    reason: cultural_note
  - marker: b
    text: या, “मेरा प्रकोप आग की तरह भड़क उठे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִמֹּלוּ
  choice: अपना खतना करो
  rationale: निफ़अल बहुवचन आज्ञार्थक का आत्मवाचक भाव है। यह अनुवाद वाचा से जुड़े खतने के ठोस रूपक को बनाए रखता है; ‘अपने आपको पवित्र करो’ अर्थ की अनावश्यक व्याख्या होती।
- source_word: לַיהוָה
  choice: याहवे के लिए
  rationale: לְ यहाँ दिशा या समर्पण का भाव देता है। ‘के लिए’ स्वाभाविक हिन्दी में याहवे के प्रति वाचागत समर्पण व्यक्त करता है।
- source_word: וְהָסִרוּ עָרְלוֹת לְבַבְכֶם
  choice: और अपने हृदयों की खलड़ियाँ दूर करो
  rationale: मूल पाठ के ठोस शारीरिक रूपक को सुरक्षित रखा गया है। ‘अपने हृदय शुद्ध करो’ अधिक व्याख्यात्मक होता और खतने से जुड़े वाचागत संकेत को मिटा देता।
- source_word: אִישׁ יְהוּדָה
  choice: हे यहूदा के पुरुषो
  rationale: एकवचन रूप यहाँ सामूहिक या वितरणात्मक अर्थ में अगले बहुवचन संबोधन के साथ प्रयुक्त है। पुल्लिंग संबोधन को अस्पष्ट किए बिना स्वाभाविक बहुवचन दिया गया है।
- source_word: וְיֹשְׁבֵי יְרוּשָׁלִָם
  choice: और यरूशलेम के निवासियो
  rationale: संज्ञा के रूप में प्रयुक्त कृदंत नगर में रहनेवालों को सूचित करता है; ‘निवासी’ आधुनिक और गरिमापूर्ण हिन्दी है।
- source_word: פֶּן
  choice: ऐसा न हो कि
  rationale: यह चेतावनी में संभावित अनिष्ट परिणाम प्रस्तुत करता है और हिन्दी में स्वाभाविक रूप से ‘ऐसा न हो कि’ कहा जाता है।
- source_word: תֵּצֵא כָאֵשׁ חֲמָתִי
  choice: मेरा क्रोध आग की तरह निकल पड़े
  rationale: יצא के बाहर निकलने या फूट पड़ने के भाव और חֵמָה के न्यायकारी क्रोध—दोनों को रखा गया है। ‘निकल पड़े’ आग के रूपक के साथ सहज है और उसे केवल ‘भड़कने’ में समेटता नहीं।
- source_word: וּבָעֲרָה וְאֵין מְכַבֶּה
  choice: और जल उठे, और उसे बुझानेवाला कोई न हो
  rationale: आग के लगातार रूपक को बनाए रखते हुए बुझानेवाले के पूर्ण अभाव को स्पष्ट किया गया है।
- source_word: מִפְּנֵי רֹעַ מַעַלְלֵיכֶם
  choice: तुम्हारे बुरे कामों के कारण
  rationale: מִפְּנֵי यहाँ कारण बताता है; רֹעַ और מַעַלְלִים को हिन्दी में स्वाभाविक रूप से विशेषण-संज्ञा ‘बुरे काम’ के रूप में व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु; यहोवा
  rationale: मूल पाठ में वाचा का विशिष्ट नाम יהוה है। उसका लिप्यंतरण नाम की विशिष्टता को बनाए रखता है और उसे उपाधि में नहीं बदलता।
- issue: हृदय के खतने का रूपक
  choice: मुख्य पाठ में ठोस खतना-रूपक बनाए रखना
  alternative: अपने हृदय शुद्ध करो; हृदय की कठोरता दूर करो
  rationale: नबी बाहरी वाचा-चिह्न को भीतरी जीवन पर लागू करता है। व्याख्यात्मक विकल्प पश्चात्ताप का आशय तो बताते, पर मूल रूपक और उसकी धर्मवैचारिक गूँज को कम कर देते।
- issue: אִישׁ יְהוּדָה का लिंगयुक्त संबोधन
  choice: यहूदा के पुरुषो
  alternative: यहूदा के लोगो
  rationale: हिब्रू रूप व्याकरणतः पुल्लिंग है और यहाँ सामूहिक संबोधन में है। ‘पुरुषो’ स्रोत के लिंग-संकेत को बनाए रखता है, जबकि ‘लोगो’ उसे समतल कर देता।
- issue: ईश्वरीय क्रोध और मानवीय कर्मों का कारण-संबंध
  choice: तुम्हारे बुरे कामों के कारण
  alternative: तुम्हारे काम बुरे हैं, इसलिए
  rationale: मूल का संक्षिप्त कारणवाचक संबंध सुरक्षित रखा गया है; पाठ के न्याय-संबंधी तनाव को न तो नरम किया गया है, न उससे आगे व्यवस्थित किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण नबूवत-संबंधी संबोधन रखा गया है। ‘खलड़ियाँ’ जानबूझकर ठोस और असहज शारीरिक बिंब को बचाता है; फुटनोट उसका रूपकात्मक आशय स्पष्ट करता है। वाक्य-विन्यास चेतावनी की तीव्रता और आग के क्रमिक बिंब—निकलना, जलना, न बुझना—को बनाए रखता है।
