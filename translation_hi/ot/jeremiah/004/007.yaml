base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/007.yaml
  text: A lion has come up from his thicket[a], and a destroyer of nations has set out; he has gone out from his place to make your land a desolation. Your cities will be laid waste[b], without inhabitant.
translation:
  language: hi
  text: सिंह अपनी घनी झाड़ी[a] से निकल आया है, और राष्ट्रों का विनाशक चल पड़ा है। वह अपने स्थान से निकल चुका है, ताकि तुम्हारे देश को उजाड़ दे। तुम्हारे नगर उजाड़ दिए जाएँगे[b]; उनमें कोई निवासी न रहेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने झुरमुट से।” मूल इब्रानी शब्द उस घने, उलझे हुए वनस्पति-आवरण को दर्शाता है जहाँ से सिंह निकलता है।
    reason: lexical_alternative
  - marker: b
    text: या, “तुम्हारे नगर उजड़ जाएँगे और उनमें कोई न बसेगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה
  choice: निकल आया है
  rationale: मूल क्रिया का अर्थ ‘ऊपर आना/आगे आना’ है। सिंह के घने आवरण से सामने आने के प्रसंग में ‘निकल आया है’ आधुनिक हिन्दी में स्वाभाविक है और आक्रमणकारी की ओर बढ़ती गति को व्यक्त करता है।
- source_word: אַרְיֵה
  choice: सिंह
  rationale: मूल रूपक को सीधे बनाए रखा गया है; इसे ‘शत्रु’ कहकर स्पष्ट करने से भविष्यवाणी का सजीव चित्र कमजोर हो जाता।
- source_word: מִסֻּבְּכוֹ
  choice: अपनी घनी झाड़ी से
  rationale: यह शब्द उलझी हुई घनी वनस्पति या झुरमुट को सूचित करता है, जहाँ से सिंह निकलता है। ‘घनी झाड़ी’ सामान्य पाठक के लिए स्पष्ट और चित्रात्मक है।
- source_word: מַשְׁחִית גּוֹיִם
  choice: राष्ट्रों का विनाशक
  rationale: यह कृदन्त पद सिंह के रूपक में वर्णित आक्रमणकारी की पहचान बताता है। ‘विनाशक’ भविष्यवाणी की गंभीर शैली और वर्णनात्मक बल दोनों बनाए रखता है।
- source_word: נָסַע
  choice: चल पड़ा है
  rationale: क्रिया प्रायः पड़ाव उखाड़कर यात्रा आरम्भ करने को दर्शाती है। सैन्य प्रस्थान के संदर्भ में ‘चल पड़ा है’ इसका स्वाभाविक हिन्दी रूप है।
- source_word: יָצָא מִמְּקֹמוֹ
  choice: वह अपने स्थान से निकल चुका है
  rationale: यह विनाशक के अपने ठिकाने से प्रस्थान को दोहराकर उसकी बढ़ती हुई गति पर बल देता है।
- source_word: לָשׂוּם אַרְצֵךְ לְשַׁמָּה
  choice: ताकि तुम्हारे देश को उजाड़ दे
  rationale: मूल वाक्य उद्देश्य अथवा परिणाम व्यक्त करता है। ‘उजाड़ दे’ שַׁמָּה की वीरानी और तबाही को स्पष्ट, संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: עָרַיִךְ תִּצֶּינָה
  choice: तुम्हारे नगर उजाड़ दिए जाएँगे
  rationale: क्रिया नगरों के उजड़ जाने और निर्जन हो जाने को दर्शाती है। कर्मवाच्य हिन्दी विनाश के परिणाम को स्वाभाविक ढंग से सामने रखता है।
- source_word: מֵאֵין יוֹשֵׁב
  choice: उनमें कोई निवासी न रहेगा
  rationale: मूल मुहावरा किसी बसने वाले के न बचे रहने को बताता है। यह रूप सामूहिक एकवचन ‘निवासी’ का भाव रखते हुए आधुनिक हिन्दी में स्पष्ट है।
