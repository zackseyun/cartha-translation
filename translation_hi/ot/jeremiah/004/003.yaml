source:
  edition: WLC
  text: כִּי כֹ֣ה אָמַ֣ר יְהֹוָ֗ה לְ/אִ֤ישׁ יְהוּדָה֙ וְ/לִ/יר֣וּשָׁלִַ֔ם נִ֥ירוּ לָ/כֶ֖ם נִ֑יר וְ/אַֽל תִּזְרְע֖וּ אֶל קוֹצִֽים־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/003.yaml
  text: 'For thus says Yahweh to the men of Judah and to Jerusalem: Break up for yourselves unplowed ground[a], and do not sow among thorns.'
translation:
  language: hi
  text: 'क्योंकि यहोवा यहूदा के लोगों और यरूशलेम से यों कहता है: “अपने लिए अनजुती भूमि[a] को जोतो, और काँटों के बीच बीज मत बोओ।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “परती भूमि।” इब्रानी शब्द ऐसी भूमि को दर्शाता है जिसे बीज बोने से पहले जोतकर तैयार करना आवश्यक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהֹוָה
  choice: यहोवा
  rationale: परमेश्वर के विशिष्ट नाम को नाम के रूप में स्पष्ट रूप से प्रस्तुत करता है और मूल इब्रानी की विशिष्टता बनाए रखता है।
- source_word: לְאִישׁ יְהוּדָה
  choice: यहूदा के लोगों से
  rationale: एकवचन रूप אִישׁ यहाँ सामूहिक अर्थ में प्रयुक्त है। आधुनिक हिन्दी में ‘यहूदा के लोगों’ स्वाभाविक है और पूरे समुदाय को संबोधन स्पष्ट करता है।
- source_word: וְלִירוּשָׁלִַם
  choice: और यरूशलेम से
  rationale: नगर का नाम सीधे रखा गया है; उसके निवासियों का लाक्षणिक अर्थ पाठक संदर्भ से समझ सकता है।
- source_word: נִירוּ לָכֶם נִיר
  choice: अपने लिए अनजुती भूमि को जोतो
  rationale: क्रिया में भूमि तैयार करने या जोतने का भाव है और לָכֶם का आत्मवाचक बल ‘अपने लिए’ से सुरक्षित रहता है। ‘अनजुती भूमि’ ऐसी भूमि बताती है जिसे बोने से पहले जोतना आवश्यक है।
- source_word: וְאַל תִּזְרְעוּ
  choice: और ... बीज मत बोओ
  rationale: זָרַע का विशिष्ट कृषि-अर्थ बीज बोना है; निषेधात्मक आज्ञा को सहज हिन्दी में रखा गया है।
- source_word: אֶל קוֹצִים
  choice: काँटों के बीच
  rationale: बोने के संदर्भ में אֶל का स्वाभाविक अर्थ काँटों के बीच या उनमें बीज डालना है।
theological_decisions:
- issue: कृषि-संबंधी आज्ञाओं का रूपकात्मक अर्थ
  choice: मुख्य पाठ में कृषि-बिंब को सीधे बनाए रखा गया है।
  alternative: पश्चाताप या हृदय की तैयारी को स्पष्ट करते हुए भावानुवाद करना।
  rationale: इब्रानी पाठ स्वयं रूपक देता है, उसकी आध्यात्मिक व्याख्या स्पष्ट नहीं करता। इसलिए अनावश्यक धर्मवैचारिक विस्तार से बचते हुए मूल तनाव और बिंब सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। कृषि-बिंब को स्पष्ट रखने के लिए ‘अनजुती भूमि को जोतो’ और ‘बीज मत बोओ’ का प्रयोग किया गया है।
