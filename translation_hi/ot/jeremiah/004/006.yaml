  yaml_path: translation/ot/jeremiah/004/006.yaml
  text: Raise a signal toward Zion[a]. Take refuge; do not stand still, for I am bringing disaster from the north[c][b], and great destruction.
translation:
  language: hi
  text: सिय्योन की ओर संकेत-ध्वज उठाओ[a]। सुरक्षित स्थान की ओर भागो; रुको मत, क्योंकि मैं उत्तर से विपत्ति[b] और बड़ा विनाश ला रहा हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सिय्योन की ओर झंडा खड़ा करो।’
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘विपत्ति’ का अर्थ नैतिक बुराई नहीं, बल्कि संकट या आपदा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ נֵס
  choice: झंडा खड़ा करो
  rationale: मुहावरे का अर्थ लोगों को चेताने या एकत्र करने के लिए संकेत-ध्वज उठाना है। ‘झंडा खड़ा करो’ आधुनिक हिन्दी में स्वाभाविक है और संकेत देने का दृश्य बनाए रखता है।
- source_word: צִיּוֹנָה
  choice: सिय्योन की ओर
  rationale: अंत का दिशासूचक ה सिय्योन की दिशा में संकेत करता है; ‘की ओर’ इस भाव को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: הָעִיזוּ
  choice: सुरक्षित स्थान की ओर भागो
  rationale: हिफ़ील आज्ञार्थक का अर्थ यहाँ सुरक्षा या शरण लेने के लिए शीघ्र जाना है। यह अनिश्चित व्युत्पत्तिगत सूक्ष्मता को संदर्भ की तात्कालिकता के साथ व्यक्त करता है।
- source_word: אַל תַּעֲמֹדוּ
  choice: रुके मत
  rationale: निषेध का व्यावहारिक आशय ठहरे रहने या देर करने से रोकना है; ‘रुके मत’ संक्षिप्त और तात्कालिक है।
- source_word: רָעָה
  choice: विपत्ति
  rationale: भविष्यद्वाणी के इस न्याय-संदर्भ में शब्द नैतिक बुराई के बजाय अनिष्ट, संकट या विपत्ति को दर्शाता है।
- source_word: מֵבִיא
  choice: ला रहा हूँ
  rationale: אָנֹכִי के साथ कृदंत आसन्न और सजीव क्रिया तथा परमेश्वर की प्रत्यक्ष कर्तृता व्यक्त करता है।
- source_word: מִצָּפוֹן
  choice: उत्तर दिशा से
  rationale: यह न्याय के आने की भौगोलिक दिशा बताने वाला सामान्य पद है।
- source_word: שֶׁבֶר גָּדוֹל
  choice: भारी विनाश
  rationale: यह पद बड़ी टूटन, बरबादी या विनाश को दर्शाता है; ‘भारी विनाश’ स्वाभाविक हिन्दी में उसकी तीव्रता बनाए रखता है।
theological_decisions:
- issue: परमेश्वर की क्रिया के संदर्भ में רָעָה का अनुवाद
  choice: विपत्ति
  alternative: बुराई; अनिष्ट
  rationale: यहाँ परमेश्वर उत्तर दिशा से न्याय लाने की घोषणा करता है। ‘विपत्ति’ उसकी न्यायकारी कर्तृता को बनाए रखती है, पर यह अर्थ नहीं देती कि वह नैतिक बुराई ला रहा है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और तात्कालिक चेतावनी के अनुरूप रखी गई है। छोटे आज्ञार्थक वाक्य मूल की तीव्रता व्यक्त करते हैं; ‘सिय्योन’ प्रचलित बाइबलीय नामरूप है।
