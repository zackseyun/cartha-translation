source:
  edition: WLC
  text: כִּי כֹה֙ אָמַ֣ר יְהוָ֔ה שְׁמָמָ֥ה תִהְיֶ֖ה כָּל הָ/אָ֑רֶץ וְ/כָלָ֖ה לֹ֥א אֶעֱשֶֽׂה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/027.yaml
  text: 'For thus says Yahweh: The whole land will be a desolation[b][a], yet I will not make a full end.'
translation:
  language: hi
  text: 'क्योंकि याहवे यों कहता है: “सारा देश[a] उजाड़ हो जाएगा, फिर भी मैं उसका पूरा अंत नहीं करूँगा[b]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सारी पृथ्वी।” इब्रानी אֶרֶץ का अर्थ “देश” या “पृथ्वी” हो सकता है। यहाँ प्रसंग यहूदा के न्याय पर केंद्रित है, यद्यपि आसपास की छवियाँ अधिक व्यापक, सृष्टि-व्यापी विनाश का आभास देती हैं।
    reason: alternative_reading
  - marker: b
    text: या “फिर भी मैं उसे पूरी तरह नष्ट नहीं करूँगा।” इब्रानी कथन विनाशकारी न्याय और पूर्ण उन्मूलन न करने के याहवे के निर्णय—दोनों के बीच के तनाव को बनाए रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह शब्द पिछले दर्शन के कारण या स्पष्टीकरण के रूप में इस ईश्वरीय घोषणा को प्रस्तुत करता है।
- source_word: כֹה אָמַר
  choice: यों कहता है
  rationale: भविष्यद्वक्ताओं की मानक संदेशवाहक अभिव्यक्ति को संक्षिप्त, गरिमापूर्ण और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यंजनाक्षरों से सूचित परमेश्वर के व्यक्तिगत नाम का प्रचलित विद्वत्तापूर्ण लिप्यंतरण है; इसे किसी उपाधि से नहीं बदला गया।
- source_word: שְׁמָמָה תִהְיֶה
  choice: उजाड़ हो जाएगा
  rationale: विध्वंस के बाद की निर्जन और बरबाद दशा को स्वाभाविक हिन्दी में व्यक्त करता है; भविष्यकालीन परिवर्तन भी स्पष्ट रहता है।
- source_word: כָּל הָאָרֶץ
  choice: सारा देश
  rationale: निकटवर्ती प्रसंग यहूदा और उसके भूभाग पर आने वाले न्याय से संबंधित है; फिर भी אֶרֶץ के व्यापक अर्थ ‘पृथ्वी’ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וְכָלָה לֹא אֶעֱשֶׂה
  choice: फिर भी मैं उसका पूरी तरह अंत नहीं करूँगा
  rationale: וְ को विरोधसूचक ‘फिर भी’ के रूप में और כָלָה को पूर्ण अंत के अर्थ में प्रस्तुत करता है। ‘उसका’ हिन्दी में सकर्मक अभिव्यक्ति को स्वाभाविक बनाता है और उसका संदर्भ देश से है।
theological_decisions:
- issue: הָאָרֶץ का भौगोलिक विस्तार
  choice: देश
  alternative: पृथ्वी
  rationale: तात्कालिक प्रसंग यहूदा के न्याय पर केंद्रित है, इसलिए ‘देश’ अधिक संभावित है; आसपास की सृष्टि-संबंधी व्यापक छवियों के कारण ‘पृथ्वी’ की संभावना पादटिप्पणी में रखी गई है।
- issue: וְכָלָה לֹא אֶעֱשֶׂה में न्याय और संयम का तनाव
  choice: फिर भी मैं उसका पूरी तरह अंत नहीं करूँगा
  alternative: फिर भी मैं उसे पूरी तरह नष्ट नहीं करूँगा
  rationale: मुख्य पाठ इब्रानी ‘अंत करना’ वाली अभिव्यक्ति को बनाए रखता है और इस तनाव को सुरक्षित रखता है कि विनाश अत्यंत व्यापक होगा, पर पूर्ण उन्मूलन नहीं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में है, पर भविष्यद्वक्ताओं की घोषणा के अनुरूप गरिमापूर्ण शैली रखी गई है। ‘यों कहता है’ औपचारिक संदेशवाहक सूत्र को बनाए रखता है; ‘उजाड़ हो जाएगा’ और ‘पूरी तरह अंत नहीं करूँगा’ सामान्य पाठक के लिए बोधगम्य हैं।
