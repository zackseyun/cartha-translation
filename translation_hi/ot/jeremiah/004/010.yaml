source:
  edition: WLC
  text: וָ/אֹמַ֞ר אֲהָ֣הּ אֲדֹנָ֣/י יְהוִ֗ה אָכֵן֩ הַשֵּׁ֨א הִשֵּׁ֜אתָ לָ/עָ֤ם הַ/זֶּה֙ וְ/לִ/ירוּשָׁלִַ֣ם לֵ/אמֹ֔ר שָׁל֖וֹם יִהְיֶ֣ה לָ/כֶ֑ם וְ/נָגְעָ֥ה חֶ֖רֶב עַד הַ/נָּֽפֶשׁ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/010.yaml
  text: Then I said[a], “Ah, Lord Yahweh, surely you have greatly deceived this people and Jerusalem, saying[b], ‘You will have peace,’ while the sword has reached to the soul.”
translation:
  language: hi
  text: तब मैंने कहा, “हाय, प्रभु यहोवा! निश्चय ही आपने इस प्रजा और यरूशलेम को यह कहकर बुरी तरह धोखा दिया है[a], ‘तुम्हें शान्ति मिलेगी,’ जबकि तलवार प्राण तक आ पहुँची है[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पूरी तरह धोखा दिया है” अथवा “बहुत बुरी तरह भटका दिया है।” हिब्रू में मुख्य क्रिया के साथ उसी धातु का बलसूचक अनन्तरूप प्रयुक्त हुआ है, जो कथन पर विशेष बल देता है।
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में “नफ़ेश तक”; इसका अर्थ “प्राण तक,” “जीवन तक,” या सम्भवतः “गले तक” हो सकता है। यहाँ भाव यह है कि तलवार मृत्यु की सीमा तक पहुँच गई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲהָהּ
  choice: हाय
  rationale: यह विस्मयादिबोधक शब्द विलाप और व्याकुलता व्यक्त करता है; आधुनिक हिन्दी में ‘हाय’ स्वाभाविक और गरिमापूर्ण है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: संयुक्त ईश्वरीय उपाधि के दोनों अंगों को स्पष्ट रखते हुए אֲדֹנָי को ‘प्रभु’ और יהוה को ‘यहोवा’ किया गया है।
- source_word: הַשֵּׁא הִשֵּׁאתָ
  choice: बुरी तरह धोखा दिया है
  rationale: נשׁא के क्रियार्थक संज्ञारूप और समापिका क्रिया का साथ आना कथन पर बल देता है। ‘बुरी तरह’ इस तीव्रता को स्वाभाविक हिन्दी में व्यक्त करता है और ‘धोखा दिया’ आरोप की प्रत्यक्षता बनाए रखता है।
- source_word: לָעָם הַזֶּה וְלִירוּשָׁלִַם
  choice: इस प्रजा और यरूशलेम को
  rationale: ל दोनों कर्मों पर लागू है; यरूशलेम को प्रजा के साथ मानवीकृत संबोधन के रूप में रखा गया है।
- source_word: לֵאמֹר
  choice: यह कहकर
  rationale: यह रूप कथित छल की विषयवस्तु प्रस्तुत करता है और हिन्दी वाक्य में कारण अथवा माध्यम का संबंध सहज बनाता है।
- source_word: שָׁלוֹם יִהְיֶה לָכֶם
  choice: तुम्हें शान्ति मिलेगी
  rationale: שָׁלוֹם यहाँ सुरक्षा और कुशल-मंगल सहित शान्ति को दर्शाता है; यह अनुवाद सरल और सीधा है।
- source_word: וְנָגְעָה חֶרֶב
  choice: जबकि तलवार ... आ पहुँची है
  rationale: נגע का अर्थ छूना या पहुँच जाना हो सकता है। ‘आ पहुँची है’ आसन्न घातक संकट को स्वाभाविक हिन्दी में व्यक्त करता है; ‘जबकि’ शान्ति के कथन से तीखा विरोध दिखाता है।
- source_word: עַד הַנָּפֶשׁ
  choice: प्राण तक
  rationale: נֶפֶשׁ के जीवन, प्राण, स्वयं अथवा गले तक के अर्थ हो सकते हैं। इस प्रसंग में ‘प्राण तक’ मृत्यु की सीमा तक तलवार पहुँचने का भाव स्पष्ट करता है और मूल रूपक बचाए रखता है।
theological_decisions:
- issue: क्या परमेश्वर द्वारा प्रजा को ‘धोखा देने’ के आरोप को नरम किया जाए
  choice: प्रत्यक्ष आरोप ‘आपने ... धोखा दिया है’ बनाए रखा गया
  alternative: ‘आपने इस प्रजा को धोखे में पड़ने दिया है’ अथवा ‘आपने इसे भटका दिया है’
  rationale: हिब्रू נשׁא यहाँ स्वाभाविक रूप से छल या धोखा देने का अर्थ देता है। यह यिर्मयाह का व्याकुल कथन है; अनुवाद को धार्मिक तनाव बनाए रखना चाहिए, उसे व्याख्यात्मक ढंग से हल नहीं करना चाहिए।
- issue: עַד הַנָּפֶשׁ का आशय
  choice: प्राण तक
  alternative: आत्मा तक; गले तक
  rationale: प्रसंग में वाक्यांश का प्रमुख आशय जीवन के घातक संकट तक पहुँचना है। ‘प्राण’ हिन्दी में जीवन और व्यक्ति के भीतरी अस्तित्व दोनों का भाव रखता है, जबकि पादटिप्पणी वास्तविक शब्दार्थ-विकल्प सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और प्रत्यक्ष रजिस्टर रखा गया है। ‘प्रजा’, ‘प्रभु यहोवा’ और ‘प्राण’ बाइबलीय संदर्भ के अनुरूप हैं, पर अत्यधिक पुरातन नहीं। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में संबंधित पदों के ठीक बाद दिए गए हैं।
