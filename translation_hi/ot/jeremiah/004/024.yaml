  footnotes:
  - marker: क
    text: या, “मैंने पहाड़ों की ओर देखा, और देखो, वे थरथरा रहे थे, और सारी पहाड़ियाँ डगमगा रही थीं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאִיתִי
  choice: मैंने ... की ओर देखा
  rationale: ראה का काल रूप प्रत्यक्ष दर्शन बताता है; इस दर्शनीय क्रम में ‘की ओर देखा’ स्वाभाविक हिन्दी है और बार-बार किए गए अवलोकन की जीवंतता बनाए रखता है।
- source_word: הֶהָרִים
  choice: पहाड़ों
  rationale: הָרִים के सामान्य अर्थ ‘पहाड़’ को रखा गया है, ताकि आगे आने वाली גבעות ‘पहाड़ियाँ’ से भेद बना रहे।
- source_word: וְהִנֵּה
  choice: —वे
  rationale: הִנֵּה दृश्य की ओर अचानक ध्यान खींचता है। हिन्दी में विराम-चिह्न और सीधे ‘वे’ से आरम्भ होने वाला वाक्यांश उसी आकस्मिक दृश्यात्मक बल को अधिक स्वाभाविक ढंग से व्यक्त करता है; ‘देखो’ जोड़ना यहाँ वक्ता के स्वयं देखने के साथ असहज होता।
- source_word: רֹעֲשִׁים
  choice: थरथरा रहे थे
  rationale: רעשׁ का कृदन्त तीव्र, भूकम्प-जैसी गति सूचित करता है। ‘थरथरा रहे थे’ जारी कंपन को स्पष्ट और सजीव बनाता है।
- source_word: וְכָל
  choice: और सारी
  rationale: बहुवचन संज्ञा के साथ כָּל का सामूहिक अर्थ है; स्त्रीलिंग ‘पहाड़ियाँ’ के अनुरूप ‘सारी’ स्वाभाविक है।
- source_word: הַגְּבָעוֹת
  choice: पहाड़ियाँ
  rationale: גבעות को ‘पहाड़ियाँ’ कहने से הָרִים ‘पहाड़ों’ के साथ काव्यात्मक समानांतरता और स्थलाकृतिक भेद दोनों सुरक्षित रहते हैं।
- source_word: הִתְקַלְקָלוּ
  choice: डगमगा रही थीं
  rationale: यह रूप अस्थिर होने, झकझोरे जाने या इधर-उधर हिलने का भाव दे सकता है। ‘डगमगा रही थीं’ केवल सामान्य कंपन की पुनरावृत्ति से बचते हुए तीव्र अस्थिरता व्यक्त करता है।
