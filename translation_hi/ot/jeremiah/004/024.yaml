- from: मैंने पहाड़ों की ओर देखा—वे थरथरा रहे थे; और सारी पहाड़ियाँ डगमगा रही थीं।
  to: मैंने पहाड़ों को देखा[क], और देखो, वे काँप रहे थे, और सारी पहाड़ियाँ डगमगा रही थीं।
