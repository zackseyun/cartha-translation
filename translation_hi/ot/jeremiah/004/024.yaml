review_pass:
  verdict: revise
  source_fidelity: The draft correctly distinguishes הָרִים (“mountains”) from גְּבָעוֹת (“hills”) and conveys the continuing seismic disturbance in both clauses. However, וְהִנֵּה, the attention-directing prophetic discourse marker, is not adequately represented by the dash alone. The wording “की ओर देखा” can also imply merely looking in the direction of the mountains rather than perceiving them.
  naturalness: The phrasing is otherwise natural, concise, and suitable for modern literary Hindi. “और देखो” is an idiomatic and appropriately vivid biblical-register rendering of וְהִנֵּה without introducing interpretive content.
  terminology: “पहाड़” and “पहाड़ियाँ” preserve the source’s topographical contrast. “काँप रहे थे” naturally expresses רֹעֲשִׁים, while “डगमगा रही थीं” suitably conveys the instability expressed by הִתְקַלְקָלוּ.
  issues:
  - severity: medium
    issue: The discourse marker וְהִנֵּה is omitted.
    rationale: A dash signals a pause but does not explicitly direct attention to the startling vision, which is a meaningful function of וְהִנֵּה in this poetic-prophetic sequence.
  - severity: low
    issue: “पहाड़ों की ओर देखा” is less direct than the source verb.
    rationale: ראיתי denotes seeing/perceiving. “पहाड़ों को देखा” gives this direct sense more clearly while remaining natural Hindi.
  revised_text: मैंने पहाड़ों को देखा[क], और देखो, वे काँप रहे थे, और सारी पहाड़ियाँ डगमगा रही थीं।
