  text: וְ/נִשְׁבַּ֨עְתָּ֙ חַי יְהוָ֔ה בֶּ/אֱמֶ֖ת בְּ/מִשְׁפָּ֣ט וּ/בִ/צְדָקָ֑ה וְ/הִתְבָּ֥רְכוּ ב֛/וֹ גּוֹיִ֖ם וּ/ב֥/וֹ יִתְהַלָּֽלוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/002.yaml
  text: and if you swear[a], ‘As Yahweh lives,’ in truth, in justice, and in righteousness, then nations will bless themselves in him[c][b], and in him they will boast.
translation:
  language: hi
  text: और यदि तुम सच्चाई, न्याय और धार्मिकता के साथ इस प्रकार शपथ खाओ, ‘याहवे के जीवन की शपथ,’[c] तो जातियाँ उसमें अपने को आशीष देंगी[a][b], और उसी में गौरव करेंगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसमें आशीष पाएँगी।” इब्रानी क्रिया का अर्थ आत्मवाचक, “अपने को आशीष देना,” हो सकता है; यहाँ निष्क्रिय-सदृश अर्थ भी संभव है, यद्यपि कम संभावित है।
    reason: lexical_alternative
  - marker: b
    text: “उसमें” का सर्वनाम प्रसंग में अस्पष्ट है। यह पुनर्स्थापित इस्राएल/यहूदा की ओर संकेत कर सकता है; कुछ लोग इसे याहवे की ओर संकेत मानते हैं।
    reason: alternative_reading
  - marker: c
    text: “याहवे के जीवन की शपथ” इब्रानी में शपथ खाने की प्रचलित विधि है।
    reason: cultural_note
lexical_decisions:
- source_word: וְנִשְׁבַּעְתָּ
  choice: और यदि तुम ... शपथ खाओगे
  rationale: वाव सहित निफ़ाल पूर्ण 2ms पिछले पद की शर्तात्मक पुकार को आगे बढ़ाता है; इसलिए हिन्दी में ‘यदि’ द्वारा प्रसंगगत शर्त स्पष्ट की गई है।
- source_word: חַי יְהוָה
  choice: ‘याहवे जीवित हैं’
  rationale: यह इब्रानी की प्रचलित शपथ-विधि है। प्रत्यक्ष कथन का रूप मूल अभिव्यक्ति को बनाए रखता है और आधुनिक हिन्दी में समझने योग्य है।
- source_word: בֶּאֱמֶת בְּמִשְׁפָּט וּבִצְדָקָה
  choice: सच्चाई, न्याय और धार्मिकता के साथ
  rationale: तीनों समानांतर नैतिक संज्ञाओं का भेद और लय सुरक्षित रखी गई है; हिन्दी में ‘के साथ’ शपथ खाने के ढंग को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְהִתְבָּרְכוּ
  choice: अपने को आशीष देंगी
  rationale: हित्पाएल के संभावित आत्मवाचक अर्थ को मुख्य पाठ में रखा गया है, यद्यपि निष्क्रिय-सदृश अर्थ भी संभव है और पादटिप्पणी में दिया गया है।
- source_word: בּוֹ
  choice: उसमें / उसी पर
  rationale: पुल्लिंग एकवचन सर्वनाम को किसी स्पष्ट संज्ञा से बदलकर उसका संदर्भ निर्धारित नहीं किया गया। हिन्दी मुहावरे के अनुसार आशीष के साथ ‘उसमें’ और गर्व के साथ ‘उसी पर’ प्रयुक्त है।
- source_word: גּוֹיִם
  choice: जातियाँ
  rationale: भविष्यवाणी के प्रसंग में यह शब्द व्यापक रूप से अन्य जातियों या राष्ट्रों को सूचित करता है; ‘जातियाँ’ सामान्य हिन्दी बाइबलीय प्रयोग है।
- source_word: יִתְהַלָּלוּ
  choice: गर्व करेंगी
  rationale: हित्पाएल रूप यहाँ किसी में गर्व या गौरव करने का भाव देता है; ‘गर्व करेंगी’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: ‘उसमें/उसी पर’ सर्वनाम का संदर्भ
  choice: मुख्य पाठ में केवल पुल्लिंग एकवचन सर्वनाम रखा गया है।
  alternative: इसे स्पष्ट रूप से ‘याहवे में’ अथवा ‘पुनर्स्थापित इस्राएल/यहूदा में’ कहना।
  rationale: इब्रानी पद में सर्वनाम का निकट स्पष्ट पूर्वपद नहीं है। प्रसंग पुनर्स्थापित इस्राएल/यहूदा की ओर संकेत कर सकता है, जबकि इसे याहवे से संबंधित समझना भी संभव है; अनुवाद इस तनाव का निर्णय नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सम्मानपूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘याहवे’ द्वारा व्यक्तिगत दिव्य नाम सुरक्षित है। त्रिपदी ‘सच्चाई, न्याय और धार्मिकता’ की औपचारिक लय बनाए रखी गई है, और सर्वनाम की वास्तविक अस्पष्टता को मुख्य पाठ तथा पादटिप्पणी दोनों में संरक्षित किया गया है।
