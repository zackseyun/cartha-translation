source:
  edition: WLC
  text: דַּרְכֵּ/ךְ֙ וּ/מַ֣עֲלָלַ֔יִ/ךְ עָשׂ֥וֹ אֵ֖לֶּה לָ֑/ךְ זֹ֤את רָעָתֵ/ךְ֙ כִּ֣י מָ֔ר כִּ֥י נָגַ֖ע עַד לִבֵּֽ/ךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/018.yaml
  text: Your way and your deeds have brought these things upon you. This is your evil[a]—how bitter it is! For it has reached your heart.
translation:
  language: hi
  text: तेरे तौर-तरीकों और तेरे कर्मों ने ये विपत्तियाँ तुझ पर लाई हैं। यही तेरी बुराई[a] है—यह कितनी कड़वी है! यह तेरे हृदय तक पहुँच गई है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यही तेरी विपत्ति है” अथवा “यही तेरी आपदा है।” इब्रानी शब्द नैतिक बुराई या उससे उत्पन्न विपत्ति—दोनों को दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּרְכֵּךְ
  choice: तेरे चालचलन
  rationale: דֶּרֶךְ यहाँ शाब्दिक मार्ग नहीं, यहूदा की जीवन-पद्धति और आचरण को दर्शाता है। ‘चालचलन’ इस रूपक का आशय स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וּמַעֲלָלַיִךְ
  choice: और तेरे कामों
  rationale: מַעֲלָלִים नैतिक अर्थ लिए हुए कर्मों या कार्यों को दर्शाता है। ‘कामों’ सामान्य पाठक के लिए सहज है और आरोपात्मक भाव बनाए रखता है।
- source_word: עָשׂוֹ אֵלֶּה לָךְ
  choice: ने ही ये विपत्तियाँ तुझ पर लाई हैं
  rationale: शाब्दिक अर्थ ‘इन्होंने तेरे लिए/साथ ये किया’ है; न्याय के इस प्रसंग में हिन्दी का कारण-परिणाम सूचक मुहावरा ‘तुझ पर लाई हैं’ स्वाभाविक है। ‘विपत्तियाँ’ निहित घटनाओं का संदर्भ स्पष्ट करता है।
- source_word: זֹאת רָעָתֵךְ
  choice: यही तेरी बुराई है
  rationale: רָעָה नैतिक बुराई और उससे उपजी विपत्ति, दोनों का अर्थ दे सकता है। मुख्य पाठ में ‘बुराई’ यहूदा के दोष पर बल बनाए रखती है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: כִּי מָר
  choice: यह कितनी कड़वी है!
  rationale: כִּי के व्याख्यात्मक या बलात्मक प्रयोग और מָר की तीव्रता को हिन्दी में विस्मयात्मक वाक्य स्वाभाविक रूप से व्यक्त करता है।
- source_word: כִּי נָגַע עַד לִבֵּךְ
  choice: यह तेरे हृदय तक पहुँच गई है
  rationale: נגע और עַד का मेल भीतर तक पहुँचने का बिंब देता है। पूर्ण क्रिया रूप उस दशा को व्यक्त करता है जो अब हृदय तक पहुँच चुकी है।
theological_decisions:
- issue: זֹאת רָעָתֵךְ में רָעָה का अर्थ
  choice: मुख्य पाठ में ‘तेरी बुराई’
  alternative: ‘तेरी विपत्ति’ या ‘तेरा विनाश’
  rationale: पद पहले यहूदा के अपने चालचलन और कामों को वर्तमान दशा का कारण बताता है। ‘बुराई’ नैतिक दोष को बनाए रखती है; फिर भी इब्रानी शब्द परिणामस्वरूप आई विपत्ति को भी दर्शा सकता है, इसलिए उस वास्तविक अस्पष्टता को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; यहूदा को स्त्रीलिंग एकवचन में संबोधित करने वाले इब्रानी रूप के अनुरूप निकट और आरोपात्मक ‘तू’ शैली रखी गई है। भाषा गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज है।
