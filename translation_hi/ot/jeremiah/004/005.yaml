  edition: WLC
  text: הַגִּ֣ידוּ בִֽ/יהוּדָ֗ה וּ/בִ/ירוּשָׁלִַ֨ם֙ הַשְׁמִ֔יעוּ וְ/אִמְר֕וּ ו/תקעו שׁוֹפָ֖ר בָּ/אָ֑רֶץ קִרְא֤וּ מַלְאוּ֙ וְ/אִמְר֔וּ הֵאָסְפ֥וּ וְ/נָב֖וֹאָה אֶל עָרֵ֥י הַ/מִּבְצָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/005.yaml
  text: 'Declare it in Judah[a], and proclaim it in Jerusalem, and say: Blow the trumpet in the land. Cry aloud, fill the air, and say: Gather yourselves[d][c][b], and let us go into the fortified cities.'
translation:
  language: hi
  text: 'यहूदा में इसकी घोषणा करो,

    यरूशलेम में इसे सुनाओ और कहो:


    “देश में सींग का बिगुल[a] फूँको!

    पुकारो, और देश को पुकार से भर दो[b], और कहो:


    ‘इकट्ठे हो जाओ;

    आओ, हम किलाबंद नगरों में[c] चलें।’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द ‘शोफ़ार’ पशु के सींग से बना फूँक-वाद्य था, जिसका उपयोग चेतावनी या संकेत देने के लिए किया जाता था; ‘तुरही’ अनुवाद भी संभव है।
    reason: cultural_note
  - marker: b
    text: इब्रानी में शाब्दिक रूप से ‘पुकारो, भरो’ है। दूसरा आदेश कर्मरहित और संक्षिप्त है; इसका भाव ‘भरपूर पुकार उठाओ’ या ‘देश को चेतावनी की पुकार से भर दो’ हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या, ‘किलाबंद नगरों की ओर चलें।’ इब्रानी संबंधबोधक शब्द गंतव्य की ओर जाने और संदर्भानुसार उसके भीतर प्रवेश करने—दोनों को व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּידוּ
  choice: इसकी घोषणा करो
  rationale: नגד के हिफ़ील बहुवचन आज्ञार्थक का अर्थ सार्वजनिक रूप से घोषित करना है। इब्रानी में कर्म निहित है; स्वाभाविक हिन्दी के लिए ‘इसकी’ जोड़ा गया है।
- source_word: הַשְׁמִיעוּ
  choice: इसे सुनाओ
  rationale: שׁמע के हिफ़ील का शाब्दिक भाव ‘सुनवाना’ है। चेतावनी की सार्वजनिक घोषणा के संदर्भ में ‘इसे सुनाओ’ causative अर्थ को स्पष्ट और स्वाभाविक ढंग से रखता है।
- source_word: וְתִקְעוּ שׁוֹפָר
  choice: नरसिंगा फूँको
  rationale: שׁוֹפָר पशु के सींग से बना संकेत-वाद्य था, जिसे विशेषतः चेतावनी देने के लिए फूँका जाता था। ‘नरसिंगा’ आधुनिक हिन्दी में सींगनुमा फूँक-वाद्य को ‘तुरही’ से अधिक विशिष्ट रूप में व्यक्त करता है।
- source_word: בָּאָרֶץ
  choice: देश में
  rationale: यहाँ אֶרֶץ से यहूदा का देश अथवा भूभाग अभिप्रेत है। ‘देश में’ संक्षिप्त, स्वाभाविक और स्रोत के स्थानवाचक प्रयोग के निकट है।
- source_word: קִרְאוּ מַלְאוּ
  choice: ज़ोर से पुकारो
  rationale: קרא सार्वजनिक पुकार की आज्ञा देता है, जबकि इसके बाद का מַלְאוּ (‘भरो’) कर्मरहित और अत्यंत संक्षिप्त है। हिन्दी मुख्य पाठ में दोनों को चेतावनी की भरपूर, ऊँची पुकार के रूप में प्रस्तुत किया गया है; अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: הֵאָסְפוּ
  choice: इकट्ठे हो जाओ
  rationale: אסף का निफ़ाल आज्ञार्थक लोगों को स्वयं एकत्र होने का आह्वान करता है। ‘इकट्ठे हो जाओ’ आधुनिक और स्पष्ट हिन्दी है।
- source_word: וְנָבוֹאָה
  choice: आओ, हम … चलें
  rationale: בוא का प्रथम-पुरुष बहुवचन cohortative सामूहिक आग्रह व्यक्त करता है। ‘आओ, हम … चलें’ उसके प्रोत्साहनात्मक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֶל עָרֵי הַמִּבְצָר
  choice: किलाबंद नगरों में
  rationale: עָרֵי הַמִּבְצָר ऐसे नगर हैं जिन्हें सुरक्षा-प्राचीर से दृढ़ किया गया है। संदर्भ शरण लेने के लिए उनके भीतर जाने का है, इसलिए ‘किलाबंद नगरों में’ चुना गया है।
