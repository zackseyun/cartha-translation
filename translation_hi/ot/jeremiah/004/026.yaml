  text: רָאִ֕יתִי וְ/הִנֵּ֥ה הַ/כַּרְמֶ֖ל הַ/מִּדְבָּ֑ר וְ/כָל עָרָ֗י/ו נִתְּצוּ֙ מִ/פְּנֵ֣י יְהוָ֔ה מִ/פְּנֵ֖י חֲר֥וֹן אַפּֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/026.yaml
  text: I looked[a], and behold, the fruitful land was a wilderness, and all its cities were torn down before Yahweh[b], before his fierce anger.
translation:
  language: hi
  text: मैंने देखा, और देखो, उपजाऊ भूमि[a] एक उजाड़ प्रदेश थी, और उसके सारे नगर याहवे के सामने—उसके भड़के हुए क्रोध के सामने[b]—ढहा दिए गए थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में ‘कर्मेल’। यहाँ संभवतः किसी विशेष कर्मेल क्षेत्र के बजाय उपजाऊ या खेती की हुई भूमि अभिप्रेत है।
    reason: lexical_alternative
  - marker: b
    text: या, “याहवे के कारण—उसके भड़कते क्रोध के कारण।” हिब्रू में दोनों बार एक ऐसा पदबंध है जिसका शाब्दिक भाव “के मुख/उपस्थिति के सामने से” है।
    reason: alternative_reading
lexical_decisions:
- source_word: רָאִיתִי
  choice: मैंने देखा
  rationale: ראה के सामान्य अर्थ ‘देखना’ को रखा गया है; यह भविष्यदर्शी दृश्य में प्रथम-पुरुष अवलोकन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: הִנֵּה दृश्य की आकस्मिकता और सजीवता की ओर ध्यान खींचता है; ‘और देखो’ आधुनिक हिन्दी में इसे स्पष्ट रखता है।
- source_word: הַכַּרְמֶל
  choice: उपजाऊ भूमि
  rationale: כַּרְמֶל किसी विशेष कर्मेल क्षेत्र का नाम भी हो सकता है और उपजाऊ/कृषित भूमि का द्योतक भी। ‘उजाड़’ के साथ विरोध को देखते हुए यहाँ सामान्य अर्थ अधिक संभावित है, जबकि पादटिप्पणी वास्तविक अस्पष्टता सुरक्षित रखती है।
- source_word: הַמִּדְבָּר
  choice: उजाड़
  rationale: מִדְבָּר निर्जन अथवा बंजर प्रदेश का बोध कराता है, अनिवार्यतः रेतीले मरुस्थल का नहीं; ‘उजाड़’ प्रसंग के विनाशकारी दृश्य को सहज रूप से व्यक्त करता है।
- source_word: וְכָל עָרָיו
  choice: और उसके सारे नगर
  rationale: एकवचन पुल्लिंग प्रत्यय निकटवर्ती भूभाग की ओर संकेत करता है; हिन्दी में ‘उसके’ भूमि/प्रदेश के नगरों को स्वाभाविक ढंग से जोड़ता है।
- source_word: נִתְּצוּ
  choice: ढहा दिए गए थे
  rationale: נתץ का निफ़अल रूप संरचनाओं के तोड़े या गिराए जाने को दर्शाता है; ‘ढहा दिए गए थे’ नगरों के विध्वंस को स्पष्ट करता है।
- source_word: מִפְּנֵי יְהוָה
  choice: याहवे के सामने
  rationale: מִפְּנֵי का मुख/उपस्थिति-संबंधी रूपक सुरक्षित रखा गया है; यह कारणसूचक अर्थ की संभावना को पादटिप्पणी में खुला छोड़ता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार-अक्षरीय ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय उसके प्रचलित विद्वत् लिप्यंतरण के निकट हिन्दी रूप में रखा गया है।
- source_word: מִפְּנֵי חֲרוֹן אַפּוֹ
  choice: उसके भड़के हुए क्रोध के सामने
  rationale: חֲרוֹן אַף का शाब्दिक चित्र जलते/भड़कते क्रोध का है। ‘भड़का हुआ क्रोध’ तीव्रता को स्वाभाविक हिन्दी में रखता है और מִפְּנֵי की पुनरावृत्ति भी बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। ‘याहवे’ उसे उपाधि में बदले बिना प्रस्तुत करता है और किसी विशेष सम्प्रदायगत व्याख्या को नहीं जोड़ता।
- issue: מִפְּנֵי की उपस्थिति-सूचक अथवा कारण-सूचक व्याख्या
  choice: के सामने
  alternative: के कारण
  rationale: हिब्रू पदबंध का अधिक रूपात्मक ‘के सामने’ मुख्य पाठ में रखा गया है; न्याय के इस प्रसंग में संभव कारणसूचक अर्थ पादटिप्पणी में दिया गया है, ताकि अर्थगत तनाव न मिटे।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और दृश्यात्मक रखी गई है। ‘और देखो’ भविष्यदर्शी वर्णन की आकस्मिकता बनाए रखता है। डैश समानांतर पदबंध की पुनरावृत्ति और तीव्रता को स्पष्ट करते हैं।
