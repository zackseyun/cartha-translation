language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: מִ/קּ֨וֹל פָּרָ֜שׁ וְ/רֹ֣מֵה קֶ֗שֶׁת בֹּרַ֨חַת֙ כָּל הָ/עִ֔יר בָּ֚אוּ בֶּ/עָבִ֔ים וּ/בַ/כֵּפִ֖ים עָל֑וּ כָּל הָ/עִ֣יר עֲזוּבָ֔ה וְ/אֵין יוֹשֵׁ֥ב בָּ/הֵ֖ן אִֽישׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/029.yaml
  text: At the sound of the horseman and the archer[a], every city flees; they go into the thickets and climb up among the rocks. Every city is abandoned[d][c][b], and no man dwells in them.
translation:
  language: hi
  text: घुड़सवार और धनुर्धर की आवाज़ सुनते ही[a] हर नगर भाग जाता है[b]; लोग घनी झाड़ियों[c] में चले जाते हैं और चट्टानों पर चढ़ जाते हैं। हर नगर उजाड़ पड़ा है, और उनमें एक भी मनुष्य नहीं रहता[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “घुड़सवार और धनुर्धर की आवाज़ के कारण।” इब्रानी संबंधबोधक शब्द अवसर या कारण—दोनों का भाव दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी का अर्थ “पूरा नगर भाग जाता है” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: यहाँ प्रयुक्त इब्रानी शब्द का अर्थ अनिश्चित है। कुछ इसे “बादल” मानते हैं, पर छिपने के स्थानों का संदर्भ घनी झाड़ियों के अर्थ का समर्थन करता है।
    reason: lexical_alternative
  - marker: d
    text: इब्रानी में शाब्दिक रूप से, “उनमें कोई मनुष्य नहीं रहता।” इसका भाव “उनमें कोई नहीं रहता” भी व्यक्त किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקּוֹל
  choice: की आवाज़ सुनते ही
  rationale: מִן के साथ קוֹל अवसर या कारण दोनों व्यक्त कर सकता है। यह चयन आक्रमण की आवाज़ पर तत्काल मची भगदड़ को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि पादटिप्पणी कारणवाचक अर्थ सुरक्षित रखती है।
- source_word: פָּרָשׁ וְרֹמֵה קֶשֶׁת
  choice: घुड़सवार और धनुर्धर
  rationale: פָּרָשׁ सैन्य घुड़सवार को और participial वाक्यांश רֹמֵה קֶשֶׁת धनुष चलाने वाले योद्धा को दर्शाता है; ये दोनों आधुनिक हिन्दी के संक्षिप्त और स्पष्ट सैन्य पद हैं।
- source_word: בֹּרַחַת כָּל הָעִיר
  choice: हर नगर भाग जाता है
  rationale: כָּל के साथ एकवचन עִיר को यहाँ वितरणात्मक रूप से समझना उपयुक्त है। आगे बहुवचन सर्वनाम भी अनेक नगरों के सामूहिक संदर्भ का समर्थन करता है।
- source_word: בָּאוּ בֶּעָבִים
  choice: लोग घनी झाड़ियों में चले जाते हैं
  rationale: क्रिया का मूल अर्थ ‘आए/प्रवेश किए’ है, पर पलायन के संदर्भ में हिन्दी में ‘चले जाते हैं’ स्वाभाविक है। עָבִים का अर्थ अनिश्चित है; समानांतर चट्टानी शरणस्थलों के कारण यहाँ घनी वनस्पति लिया गया है। कर्ता ‘लोग’ नगरवासियों को स्पष्ट करता है।
- source_word: וּבַכֵּפִים עָלוּ
  choice: और चट्टानों पर चढ़ जाते हैं
  rationale: כֵּפִים चट्टानों या दुर्गम शिलास्थलों को दर्शाता है और עָלוּ ऊपर चढ़ने की क्रिया को। चयन शरण के लिए ऊँचे पथरीले स्थानों पर जाने का दृश्य बनाए रखता है।
- source_word: כָּל הָעִיר עֲזוּבָה
  choice: हर नगर उजाड़ पड़ा है
  rationale: עֲזוּבָה छोड़े हुए अथवा निर्जन हो जाने की परिणामी दशा बताता है। ‘उजाड़ पड़ा है’ युद्धकालीन जनशून्यता को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וְאֵין יוֹשֵׁב בָּהֵן אִישׁ
  choice: और उनमें एक भी मनुष्य नहीं रहता
  rationale: אִישׁ का स्पष्ट प्रतिनिधित्व ‘मनुष्य’ से होता है, जबकि ‘एक भी’ पूर्ण जनशून्यता पर इब्रानी के बल को बनाए रखता है। स्त्रीलिंग बहुवचन בָּהֵן का संबंध नगरों से है।
