  text: मैंने पृथ्वी को देखा—और देखो, वह बेडौल और सुनसान[a] थी; और आकाश की ओर देखा—उसमें कोई प्रकाश न था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में तोहू वावोहू; इसका अनुवाद “निराकार और खाली” या “उजाड़ और रिक्त” भी किया जाता है। यही पदबंध उत्पत्ति 1:2 में भी आता है।
    reason: शब्दार्थ के विकल्प और उत्पत्ति 1:2 की अंतरपाठीय प्रतिध्वनि स्पष्ट करना।
lexical_decisions:
- source_word: רָאִיתִי
  choice: मैंने ... देखा
  rationale: रָאָה के प्रथम पुरुष एकवचन रूप का सीधा अर्थ रखा गया है। दर्शनात्मक प्रसंग में “देखा” स्वाभाविक है और भविष्यद्वक्ता के प्रत्यक्ष अवलोकन को बनाए रखता है।
- source_word: הָאָרֶץ
  choice: पृथ्वी
  rationale: אֶרֶץ का अर्थ “देश/भूमि” भी हो सकता है, पर यहाँ आकाश के साथ उसका युग्म और उत्पत्ति 1:2 की प्रतिध्वनि विश्वव्यापी अर्थ “पृथ्वी” का समर्थन करती है।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: यह הִנֵּה की दृश्यात्मक तत्क्षणता और भविष्यद्वाणी की सजीवता को सहज, गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: תֹהוּ וָבֹהוּ
  choice: उजाड़ और सूनी
  rationale: यह युग्म अव्यवस्था, निर्जनता और रिक्तता का भाव व्यक्त करता है तथा उत्पत्ति 1:2 की प्रतिध्वनि बनाए रखता है। “निराकार और खाली” जैसी अधिक शाब्दिक और पारंपरिक सम्भावना पादटिप्पणी में दी गई है।
- source_word: הַשָּׁמַיִם
  choice: आकाश
  rationale: हिन्दी में “आकाश” इस इब्रानी बहुवचन संज्ञा का स्वाभाविक सामूहिक रूप है और “पृथ्वी” के साथ सृष्टि-संबंधी समानांतरता बनाए रखता है।
- source_word: וְאֵין אוֹרָם
  choice: उसमें कोई प्रकाश न था
  rationale: प्रकाश के पूर्ण अभाव को स्पष्ट रूप से व्यक्त किया गया है। हिन्दी के एकवचन “आकाश” के अनुसार सर्वनाम एकवचन रखा गया है, बिना यह जोड़े कि प्रकाश हटाया गया था या केवल अनुपस्थित था।
theological_decisions:
- issue: न्याय-वाणी में उत्पत्ति 1:2 की अंतरपाठीय प्रतिध्वनि
  choice: “पृथ्वी ... उजाड़ और सूनी” तथा प्रकाशहीन आकाश के द्वारा सृष्टि के उलट जाने जैसी विश्वव्यापी छवि को बनाए रखना
  alternative: इसे केवल यहूदा देश की स्थानीय तबाही के रूप में प्रस्तुत करना
  rationale: תֹהוּ וָבֹהוּ और पृथ्वी-आकाश का युग्म उत्पत्ति 1:2 को प्रबल रूप से स्मरण कराता है। अनुवाद इस सृष्टि-विलोम छवि को बनाए रखता है, पर ऐतिहासिक रूप से यहूदा पर आने वाले न्याय से उसके संबंध को नकारता नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण भविष्यद्वाणी-शैली वाला रूप। “और देखो” मूल की दृश्यात्मक तत्क्षणता रखता है; डैश दृश्य के क्रमिक खुलने को स्पष्ट करते हैं।
