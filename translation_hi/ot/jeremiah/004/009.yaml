source:
  edition: WLC
  text: וְ/הָיָ֤ה בַ/יּוֹם הַ/הוּא֙ נְאֻם יְהוָ֔ה יֹאבַ֥ד לֵב הַ/מֶּ֖לֶךְ וְ/לֵ֣ב הַ/שָּׂרִ֑ים וְ/נָשַׁ֨מּוּ֙ הַ/כֹּ֣הֲנִ֔ים וְ/הַ/נְּבִיאִ֖ים יִתְמָֽהוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/009.yaml
  text: And it will happen on that day[a], declares Yahweh, that the heart of the king and the heart of the officials will perish, and the priests will be appalled, and the prophets will be astonished.
translation:
  language: hi
  text: “उस दिन ऐसा होगा,” याहवे की यह घोषणा है, “कि राजा और अधिकारियों का साहस चुक जाएगा[a]; याजक स्तब्ध रह जाएँगे और भविष्यद्वक्ता चकित रह जाएँगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “राजा का हृदय और अधिकारियों का हृदय नष्ट हो जाएगा।” यहाँ “हृदय” से साहस, धैर्य या संकल्प का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַיּוֹם הַהוּא
  choice: उस दिन ऐसा होगा
  rationale: भविष्य में होने वाली घटना का परिचय देने वाले इब्रानी सूत्र को स्वाभाविक और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: נְאֻם יְהוָה
  choice: यहोवा की यह घोषणा है
  rationale: नְאֻם की गंभीर भविष्यसूचक उद्घोषणा तथा יהוה के व्यक्तिगत नाम—दोनों को स्पष्ट रूप से बनाए रखता है।
- source_word: יֹאבַד לֵב הַמֶּלֶךְ וְלֵב הַשָּׂרִים
  choice: राजा और हाकिमों का साहस जाता रहेगा
  rationale: לֵב यहाँ अंतःकरण, धैर्य या साहस का सूचक है और אבד उसके नष्ट अथवा विफल होने को बताता है। हिन्दी में शाब्दिक ‘हृदय नष्ट होगा’ संभावित अर्थ को धुँधला करता; इसलिए मुख्य पाठ में प्रसंगगत अर्थ रखा गया और शाब्दिक रूप पादटिप्पणी में दिया गया।
- source_word: הַשָּׂרִים
  choice: हाकिमों
  rationale: शासकीय अधिकार रखने वाले प्रधान अधिकारियों के लिए सहज, संक्षिप्त हिन्दी शब्द; यह अनिवार्यतः वंशानुगत ‘राजकुमारों’ का अर्थ नहीं थोपता।
- source_word: וְנָשַׁמּוּ הַכֹּהֲנִים
  choice: याजक स्तब्ध रह जाएँगे
  rationale: निफ़ाल שמם के भयावह आघात, सन्न रह जाने या उजड़ने जैसे भावों में से इस प्रसंग में मानसिक स्तब्धता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְהַנְּבִיאִים יִתְמָהוּ
  choice: और भविष्यद्वक्ता चकित रह जाएँगे
  rationale: תמה की विस्मय और संभ्रम की प्रतिक्रिया को व्यक्त करता है तथा याजकों की स्तब्धता के समानांतर रहता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में प्रयुक्त चतुरक्षरी व्यक्तिगत नाम को उपाधि ‘प्रभु’ से प्रतिस्थापित न करके हिन्दी में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ रूप में रखा गया है। उच्चारण का ‘याहवे’ पुनर्निर्माण एक मान्य विकल्प है।
- issue: राजा और हाकिमों के ‘हृदय’ के नष्ट होने का आशय
  choice: मुख्य पाठ में ‘साहस जाता रहेगा’
  alternative: ‘राजा का हृदय और हाकिमों का हृदय नष्ट हो जाएगा’
  rationale: यहाँ לֵב केवल शारीरिक अंग नहीं, आंतरिक धैर्य या संकल्प भी दर्शाता है। प्रसंगगत अर्थ को पठनीय बनाया गया है, जबकि मूल रूपक और उसकी वास्तविक अर्थ-सीमा पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण भविष्यसूचक लहजा रखा गया है। ‘याजक’ और ‘भविष्यद्वक्ता’ बाइबलीय भूमिकाओं के परिचित हिन्दी पद हैं। मुख्य पाठ में अर्थ-स्पष्टता को प्राथमिकता दी गई है, किंतु इब्रानी रूपक को पादटिप्पणी में संरक्षित किया गया है।
