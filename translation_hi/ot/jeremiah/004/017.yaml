  text: כְּ/שֹׁמְרֵ֣י שָׂדַ֔י הָי֥וּ עָלֶ֖י/הָ מִ/סָּבִ֑יב כִּי אֹתִ֥/י מָרָ֖תָה נְאֻם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/017.yaml
  text: Like watchmen of a field[a], they are against her all around, because she has rebelled against me, declares Yahweh.
translation:
  language: hi
  text: खेत के रखवालों के समान[a] वे उसे चारों ओर से घेरे हुए हैं, क्योंकि उसने मेरे विरुद्ध विद्रोह किया है—यहोवा की यह घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘खुले मैदान के पहरेदारों के समान’ अथवा ‘खेत की रखवाली करने वालों के समान।’ बिंब ऐसे लोगों का है जो किसी खेत के चारों ओर रहकर उसकी निगरानी करते हैं; यहाँ यह उस पर चारों ओर से घेरा डालने वाले शत्रुओं पर लागू होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּשֹׁמְרֵי
  choice: रखवालों के समान
  rationale: उपसर्ग כְּ तुलना व्यक्त करता है, और שׁמר का बहुवचन कृदन्त पहरा देने या रक्षा करने वालों को सूचित करता है। ‘रखवाले’ खेत की निगरानी और घेराबंदी—दोनों बिंबों में स्वाभाविक है।
- source_word: שָׂדַי
  choice: खेत के
  rationale: שׂדה का सामान्य अर्थ ‘खेत’ है। हिब्रू के एकवचन रूप को बनाए रखा गया है; संदर्भ में खेत को चारों ओर से देखने वाले रखवालों का बिंब शत्रुओं की घेराबंदी पर लागू होता है।
- source_word: הָיוּ
  choice: वे ... हैं
  rationale: रूप पूर्णकालिक है, पर भविष्यवाणी की सजीव वाणी में यह वर्तमान या आसन्न स्थिति को निश्चित रूप से चित्रित कर सकता है। आधुनिक हिन्दी में ‘हैं’ तत्काल घेराव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עָלֶיהָ
  choice: उसके विरुद्ध
  rationale: सैन्य और शत्रुतापूर्ण संदर्भ में עַל विरोध का भाव रखता है। स्त्रीलिंग एकवचन सर्वनाम को ‘उसके’ के रूप में अनिर्दिष्ट रखा गया है।
- source_word: מִסָּבִיב
  choice: चारों ओर
  rationale: यह चारों तरफ से घेरे जाने का भाव देता है और आधुनिक हिन्दी में घेराबंदी के बिंब को स्पष्ट तथा संक्षिप्त रूप से व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह न्याय का कारण प्रस्तुत करता है; ‘क्योंकि’ आधुनिक हिन्दी में स्पष्ट कारणसूचक संयोजक है।
- source_word: אֹתִי מָרָתָה
  choice: उसने मेरे विरुद्ध विद्रोह किया है
  rationale: מרה किसी के अधिकार की अवज्ञा या उसके विरुद्ध विद्रोह को दर्शाता है। हिन्दी में ‘मेरे विरुद्ध’ क्रिया के संबंध को स्वाभाविक और स्पष्ट बनाता है।
- source_word: נְאֻם יְהוָה
  choice: यह यहोवा की घोषणा है
  rationale: यह गम्भीर भविष्यवाणी-सूत्र है। ‘घोषणा’ इसकी औपचारिकता बनाए रखती है, और יְהוָה को उसके व्यक्तिगत नाम ‘यहोवा’ से प्रस्तुत किया गया है।
theological_decisions:
- issue: स्त्रीलिंग एकवचन सर्वनाम का संदर्भ
  choice: मुख्य पाठ में ‘उसके’ रखा गया, किसी नाम से उसकी पहचान नहीं की गई
  alternative: यरूशलेम, सिय्योन की बेटी, अथवा यहूदा/देश को स्पष्ट रूप से नाम देना
  rationale: हिब्रू में इस पद के भीतर पूर्वपद निहित है। स्त्रीलिंग समुदाय या नगर के मानवीकरण को बनाए रखते हुए किसी एक पहचान को अनावश्यक रूप से निश्चित नहीं किया गया।
- issue: הָיוּ का कालगत बल
  choice: वर्तमान ‘हैं’
  alternative: ‘हो गए हैं’ या ‘थे’
  rationale: भविष्यवाणी के वर्णन में पूर्ण क्रिया घेराव की निश्चित और सजीव स्थिति बता सकती है। वर्तमान हिन्दी तत्काल संकट को व्यक्त करती है, जबकि बीते समय तक सीमित नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण भविष्यवाणी-संबंधी रजिस्टर अपनाया गया है। ‘चारों ओर उसके विरुद्ध’ मूल की संरचना और घेराबंदी का बल बनाए रखता है। दैवी नाम יְהוָה के लिए ‘यहोवा’ प्रयुक्त है।
