base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/008.yaml
  text: Because of this[a], put on sackcloth; mourn and wail[b], for the burning anger of Yahweh has not turned away from us.
translation:
  language: hi
  text: इस कारण टाट से कमर कस लो[a]; शोक मनाओ और ज़ोर से विलाप करो, क्योंकि याहवे का धधकता क्रोध[b] हम पर से नहीं हटा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “टाट पहन लो।”
    reason: lexical_alternative
  - marker: b
    text: या, “प्रचंड क्रोध।”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל זֹאת
  choice: इस कारण
  rationale: यह पदबंध आगे दी गई आज्ञाओं का कारण या अवसर बताता है; ‘इस कारण’ आधुनिक हिन्दी में उसके कारणार्थक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: חִגְרוּ שַׂקִּים
  choice: अपने शरीर पर टाट बाँध लो
  rationale: חגר का मूल भाव कमर कसने या बाँधने का है और שַׂקִּים शोक में पहने जाने वाले टाट को दर्शाता है। यह अनुवाद क्रिया के ठोस बिंब और शोक की प्रथा, दोनों को बनाए रखता है।
- source_word: סִפְדוּ
  choice: शोक मनाओ
  rationale: ספד विशेषतः मृत्यु या विपत्ति के अवसर पर शोक और मातम करने को दर्शाता है।
- source_word: וְהֵילִילוּ
  choice: और ज़ोर से विलाप करो
  rationale: ילל दुःख या संकट में ऊँचे स्वर से रोने-विलाप करने का बोध देता है; ‘ज़ोर से’ उसकी श्रव्य तीव्रता स्पष्ट करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह अव्यय पहले की आज्ञाओं का आधार प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इस संबंध को स्पष्ट और स्वाभाविक बनाता है।
- source_word: לֹא שָׁב
  choice: नहीं हटा है
  rationale: שׁוב का मूल बिंब लौटने या फिरने का है। क्रोध के ‘हम पर से हटने’ की हिन्दी अभिव्यक्ति उसी भाव को सहज रूप में देती है और पूर्ण क्रिया का वर्तमान परिणाम भी बनाए रखती है।
- source_word: חֲרוֹן אַף
  choice: धधकता क्रोध
  rationale: यह इब्रानी मुहावरा क्रोध की जलती हुई तीव्रता व्यक्त करता है। ‘धधकता क्रोध’ ताप के रूपक को सुरक्षित रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिवाचक दिव्य नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ के रूप में रखा गया है।
- source_word: מִמֶּנּוּ
  choice: हम पर से
  rationale: प्रत्यय प्रथम पुरुष बहुवचन है। ‘हम पर से’ हिन्दी में उस क्रोध को व्यक्त करता है जो समुदाय पर बना हुआ है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिवाचक नाम है। हिन्दी पाठकों के लिए परिचित ‘यहोवा’ नाम को उपाधि ‘प्रभु’ से बदलने के बजाय रखा गया है; ‘याहवे’ संभावित वैकल्पिक लिप्यंतरण है।
- issue: क्रोध का समुदाय पर बना रहना
  choice: हम पर से नहीं हटा है
  alternative: हमसे नहीं फिरा है
  rationale: मूल का प्रथम पुरुष बहुवचन सुरक्षित रखा गया है, जिससे वक्ता स्वयं को न्याय के अधीन समुदाय में सम्मिलित करता है। ‘नहीं हटा है’ स्वाभाविक हिन्दी है, जबकि विकल्प שׁוב के ‘फिरने’ वाले बिंब को अधिक अक्षरशः रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और जनसुलभ रखी गई है। ‘टाट बाँध लो’ प्राचीन शोक-रीति का ठोस बिंब बनाए रखता है; ‘ज़ोर से विलाप’ दोनों निकटवर्ती शोक-क्रियाओं के अर्थभेद को स्पष्ट करता है।
