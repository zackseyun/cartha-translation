    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद आसपास की चेतावनी का कारण या स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ इसके संयोजक बल को बनाए रखता है।
- source_word: קוֹל
  choice: एक आवाज़
  rationale: शब्द का मूल अर्थ ‘आवाज़/ध्वनि’ है। यहाँ घोषणा करने वाली आवाज़ का सजीव चित्र बनाए रखने के लिए ‘एक आवाज़’ उपयुक्त है।
- source_word: מַגִּיד
  choice: घोषणा कर रही है
  rationale: हिब्रू कृदंत घोषणा की चलती हुई, सजीव तात्कालिकता व्यक्त करता है; स्त्रीलिंग क्रिया ‘आवाज़’ के साथ स्वाभाविक मेल रखती है।
- source_word: מִדָּן
  choice: दान से
  rationale: दान स्थान का नाम है और उत्तर दिशा से आगे बढ़ते समाचार के आरंभिक बिंदु को दर्शाता है।
- source_word: וּמַשְׁמִיעַ
  choice: और … समाचार सुना रही है
  rationale: हिफ़ील रूप का भाव ‘सुनाना/सुनने योग्य बनाना’ है। ‘समाचार सुना रही है’ सार्वजनिक सूचना के अर्थ को स्वाभाविक हिन्दी में व्यक्त करता और पहले कृदंत के समान जारी क्रिया का भाव रखता है।
- source_word: אָוֶן
  choice: विपत्ति
  rationale: इस शब्द के अर्थ-क्षेत्र में अनर्थ, संकट और दुष्टता शामिल हैं। निकट आती सैन्य तबाही के संदर्भ में ‘विपत्ति’ उपयुक्त है, जबकि पादटिप्पणी वास्तविक वैकल्पिक अर्थों को सुरक्षित रखती है।
- source_word: מֵהַר אֶפְרָיִם
  choice: एप्रैम के पहाड़ी प्रदेश से
  rationale: यह भौगोलिक पदबंध एप्रैम के पर्वतीय क्षेत्र को दर्शाता है; ‘पहाड़ी प्रदेश’ आधुनिक हिन्दी में स्वाभाविक है और इसे किसी एक पर्वत तक सीमित नहीं करता।
