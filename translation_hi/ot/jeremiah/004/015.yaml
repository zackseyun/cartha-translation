  yaml_path: translation/ot/jeremiah/004/015.yaml
  text: For a voice is declaring from Dan[b][a], and proclaiming disaster from the hill country of Ephraim.
translation:
  language: hi
  text: क्योंकि दान से एक आवाज़ सुनाई देती है, और एप्रैम के पहाड़ी प्रदेश[b] से विपत्ति[a] की सूचना देती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘संकट’ अथवा ‘अनर्थ’; दूसरे संदर्भों में इस हिब्रू शब्द का अर्थ ‘दुष्टता’ भी हो सकता है।
