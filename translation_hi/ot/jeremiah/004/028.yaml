reference: Jeremiah 4:28
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: עַל זֹאת֙ תֶּאֱבַ֣ל הָ/אָ֔רֶץ וְ/קָדְר֥וּ הַ/שָּׁמַ֖יִם מִ/מָּ֑עַל עַ֤ל כִּי דִבַּ֨רְתִּי֙ זַמֹּ֔תִי וְ/לֹ֥א נִחַ֖מְתִּי וְ/לֹא אָשׁ֥וּב מִמֶּֽ/נָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/028.yaml
  text: Because of this the earth will mourn[a], and the heavens above will grow dark, because I have spoken, I have purposed, and I have not relented[c][b], nor will I turn back from it.
translation:
  language: hi
  text: इस कारण पृथ्वी शोक मनाएगी[a], और ऊपर आकाश अँधेरा हो जाएगा; क्योंकि मैंने कहा है, मैंने ठान लिया है[b], और मैंने अपना मन नहीं बदला है[c], न ही मैं उससे पीछे हटूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “देश शोक मनाएगा।” इब्रानी אֶרֶץ का अर्थ “पृथ्वी,” “देश” या “भूमि” हो सकता है; यहाँ “ऊपर आकाश” के समानांतर होने के कारण मुख्य पाठ में व्यापक अर्थ लिया गया है।
    reason: lexical_alternative
  - marker: b
    text: या, “मैंने योजना बना ली है” अथवा “मैंने निश्चय कर लिया है।”
    reason: lexical_alternative
  - marker: c
    text: या, “मैं नहीं पसीजा हूँ” अथवा “मैंने न्याय करने से विराम नहीं लिया है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל זֹאת
  choice: इस कारण
  rationale: यह पदबंध पहले बताए गए न्याय को पृथ्वी और आकाश की प्रतिक्रिया का कारण बताता है; ‘इस कारण’ स्वाभाविक हिंदी में इसका कारणात्मक बल व्यक्त करता है।
- source_word: תֶּאֱבַל
  choice: शोक मनाएगी
  rationale: क्रिया אבל शोक या विलाप को दर्शाती है; स्त्रीलिंग ‘पृथ्वी’ के मानवीकरण के साथ ‘शोक मनाएगी’ स्पष्ट और स्वाभाविक है।
- source_word: הָאָרֶץ
  choice: पृथ्वी
  rationale: אֶרֶץ का अर्थ ‘देश/भूमि’ भी हो सकता है, पर ‘ऊपर आकाश’ के समानांतर यहाँ व्यापक सृष्टिगत चित्र उभरता है; वैकल्पिक स्थानीय अर्थ फुटनोट में रखा गया है।
- source_word: וְקָדְרוּ
  choice: अँधेरा हो जाएगा
  rationale: קדר यहाँ अंधकारमय या मलिन हो जाने को व्यक्त करता है; यह चयन परिवर्तन की गति और काव्यात्मक दृश्य दोनों को सहज हिंदी में रखता है।
- source_word: הַשָּׁמַיִם מִמָּעַל
  choice: ऊपर आकाश
  rationale: यह स्वाभाविक हिंदी क्रम में ‘ऊपर के आकाश’ का भाव देता है और पृथ्वी के साथ काव्यात्मक समानांतर बनाए रखता है।
- source_word: דִבַּרְתִּי
  choice: मैंने कहा है
  rationale: דבר के पूर्ण रूप को यहाँ वर्तमान परिणाम वाले दिव्य कथन के रूप में ‘कहा है’ व्यक्त करता है; भाषा गंभीर किंतु सामान्य पाठक के लिए सहज है।
- source_word: זַמֹּתִי
  choice: मैंने ठान लिया है
  rationale: זמם यहाँ विचारपूर्वक किए गए दृढ़ निश्चय को दर्शाता है; ‘ठान लिया’ योजना और संकल्प दोनों का बल स्वाभाविक हिंदी में देता है।
- source_word: וְלֹא נִחַמְתִּי
  choice: मैं नहीं पसीजा हूँ
  rationale: נחם इस प्रसंग में घोषित न्याय से नरम पड़ने या उसे रोक देने का भाव रखता है; ‘नहीं पसीजा’ नैतिक पश्चात्ताप का भ्रामक संकेत दिए बिना इस अर्थ को व्यक्त करता है।
- source_word: וְלֹא אָשׁוּב מִמֶּנָּה
  choice: न ही मैं उससे पीछे हटूँगा
  rationale: שׁוב מן घोषित निश्चय या कार्यवाही से वापस होने को दर्शाता है; स्त्रीलिंग प्रत्यय का संदर्भ पूरी घोषित योजना/बात से है, जिसे हिंदी में ‘उससे’ जानबूझकर कुछ खुला रखता है।
theological_decisions:
- issue: परमेश्वर के लिए נחם का अनुवाद
  choice: मैं नहीं पसीजा हूँ
  alternative: मैंने अपना मन नहीं बदला है / मैं पछताया नहीं हूँ
  rationale: प्रसंग घोषित न्याय से न हटने पर केंद्रित है। ‘पछताया नहीं’ नैतिक दोष का अनुचित संकेत दे सकता है, जबकि ‘नहीं पसीजा’ न्याय को रोकने के लिए नरम न पड़ने का प्रसंगगत अर्थ रखता है।
- issue: הָאָרֶץ का दायरा
  choice: पृथ्वी
  alternative: देश / भूमि
  rationale: न्याय का ऐतिहासिक केंद्र यहूदा है, फिर भी ‘ऊपर आकाश’ के समानांतर पृथ्वी का व्यापक अर्थ प्रमुख होता है। मुख्य पाठ व्यापक काव्यात्मक चित्र रखता है और स्थानीय अर्थ को फुटनोट में सुरक्षित करता है।
- issue: מִמֶּנָּה के पूर्वसंदर्भ की अस्पष्टता
  choice: उससे
  alternative: अपने निश्चय से / इस बात से
  rationale: इब्रानी स्त्रीलिंग प्रत्यय घोषित बात, योजना या न्याय की ओर संकेत कर सकता है। ‘उससे’ किसी एक व्याख्या को अनावश्यक रूप से निश्चित किए बिना मूल की संदर्भगत खुलावट बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गंभीर भविष्यद्वाणी-संबंधी शैली रखी गई है। वाक्य सहज है, पर पृथ्वी और आकाश के मानवीकृत, विश्वव्यापी शोक का काव्यात्मक तनाव तथा परमेश्वर के घोषित निश्चय की दृढ़ता सुरक्षित है।
