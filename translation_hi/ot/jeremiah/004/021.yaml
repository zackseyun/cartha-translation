- source_word: אֶשְׁמְעָה
  choice: और ... सुनना
  rationale: पहली क्रिया के साथ जुड़कर यह उसी जारी विवशता में भाग लेती है; हिन्दी में ‘पड़ेगा’ दोनों क्रियाओं पर स्वाभाविक रूप से लागू होता है।
- source_word: קוֹל
