source:
  edition: WLC
  text: שֶׁ֤בֶר עַל שֶׁ֨בֶר֙ נִקְרָ֔א כִּ֥י שֻׁדְּדָ֖ה כָּל הָ/אָ֑רֶץ פִּתְאֹם֙ שֻׁדְּד֣וּ אֹהָלַ֔/י רֶ֖גַע יְרִיעֹתָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/020.yaml
  text: Disaster upon disaster is proclaimed[a], for the whole land is devastated. Suddenly my tents are devastated[b], my curtains in a moment.
translation:
  language: hi
  text: विपत्ति पर विपत्ति की घोषणा की जा रही है, क्योंकि सारा देश[a] उजाड़ दिया गया है। अचानक मेरे तंबू उजाड़ दिए गए; पल भर में मेरे परदे[b] [उजाड़ दिए गए]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सारी पृथ्वी।’ इब्रानी אֶרֶץ का अर्थ ‘देश/भूमि’ या ‘पृथ्वी’ हो सकता है; यहाँ संदर्भ न्याय के अधीन देश की ओर संकेत करता है।
    reason: alternative_reading
  - marker: b
    text: ‘मेरे परदे’ से तात्पर्य तंबू के परदों या उसे ढकने वाले कपड़ों से है; यह पंक्ति किसी निवास के अचानक नष्ट हो जाने का चित्र प्रस्तुत करती है।
    reason: cultural_note
lexical_decisions:
- source_word: שֶׁבֶר עַל שֶׁבֶר
  choice: विपत्ति पर विपत्ति
  rationale: दोहराव क्रमशः टूट पड़ती विपत्तियों को व्यक्त करता है; यह शाब्दिक ‘टूटना’ नहीं, बल्कि विनाशकारी संकट का मुहावरा है।
- source_word: נִקְרָא
  choice: की पुकार सुनाई दे रही है
  rationale: निफ़अल रूप यहाँ विपत्ति के पुकारे या घोषित किए जाने का भाव देता है। यह अनुवाद सार्वजनिक पुकार की जीवंतता को स्वाभाविक हिन्दी में रखता है।
- source_word: שֻׁדְּדָה / שֻׁדְּדוּ
  choice: उजाड़ दिया गया / उजाड़ दिए गए
  rationale: क्रिया हिंसक लूट और विध्वंस दोनों का बोध करा सकती है। देश और तंबुओं के संदर्भ में ‘उजाड़ना’ व्यापक विनाश को व्यक्त करता है और दोनों प्रयोगों में संगति रखता है।
- source_word: כָּל הָאָרֶץ
  choice: सारा देश
  rationale: यिर्मयाह 4 के संदर्भ में संकेत मुख्यतः न्याय के अधीन यहूदा की भूमि की ओर है; आधुनिक हिन्दी में ‘देश’ इस स्थानीय-राष्ट्रीय अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: פִּתְאֹם
  choice: अचानक
  rationale: यह विनाश के अप्रत्याशित और आकस्मिक रूप से आ पड़ने पर बल देता है।
- source_word: אֹהָלַי
  choice: मेरे तंबू
  rationale: मूल ठोस आवास-चित्र को बनाए रखने वाला सीधा और वर्तमान हिन्दी का अनुवाद।
- source_word: רֶגַע
  choice: पल भर में
  rationale: समय की अत्यल्प अवधि और घटना की तीव्रता दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְרִיעֹתַי
  choice: मेरे परदे
  rationale: शब्द तंबू के कपड़े या परदों को दर्शाता है। मुख्य पाठ में संक्षिप्त रूप रखा गया है और सांस्कृतिक अर्थ पादटिप्पणी में स्पष्ट किया गया है।
theological_decisions:
- issue: הָאָרֶץ का दायरा
  choice: सारा देश
  alternative: सारी पृथ्वी
  rationale: संज्ञा का अर्थ ‘देश/भूमि’ या ‘पृथ्वी’ दोनों हो सकता है। निकट संदर्भ यहूदा और यरूशलेम पर न्याय का है, इसलिए मुख्य पाठ में ‘देश’ अधिक संभावित है; व्यापक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। काव्यात्मक दोहराव ‘विपत्ति पर विपत्ति’ तथा अचानक विनाश की गति सुरक्षित है। अंतिम खंड में इब्रानी की लुप्त क्रिया को हिन्दी की स्पष्टता के लिए दोहराया गया है और ‘भी’ से समानांतरता दिखाई गई है।
