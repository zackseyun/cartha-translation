  text: מֵעַ֣/י מֵעַ֨/י אחולה קִיר֥וֹת לִבִּ֛/י הֹֽמֶה לִּ֥/י לִבִּ֖/י לֹ֣א אַחֲרִ֑ישׁ כִּ֣י ק֤וֹל שׁוֹפָר֙ שמעתי נַפְשִׁ֔/י תְּרוּעַ֖ת מִלְחָמָֽה׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/019.yaml
  text: My inward parts[a], my inward parts! I writhe in pain! O walls of my heart! My heart pounds within me; I cannot keep silent, for you, my soul, have heard the sound of the trumpet[c][b], the battle cry.
translation:
  language: hi
  text: मेरे भीतर के अंग[a], मेरे भीतर के अंग! मैं पीड़ा से तड़प रहा हूँ! हे मेरे हृदय की दीवारो[b]! मेरा हृदय मेरे भीतर ज़ोरों से धड़क रहा है; मैं चुप नहीं रह सकता, क्योंकि हे मेरे प्राण[c], तूने नरसिंगे की ध्वनि और युद्ध की चेतावनी[d] सुन ली है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से शरीर के ‘भीतरी अंग’; यह गहरी आंतरिक व्यथा का सजीव बिंब है।
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में शाब्दिक रूप से ‘मेरे हृदय की दीवारें’; इसका अर्थ ‘मेरे हृदय के भीतर के कक्ष’ भी समझा जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: या, ‘क्योंकि मेरे प्राण ने नरसिंगे की ध्वनि और युद्ध की चेतावनी सुन ली है।’ हिब्रू को आत्म-संबोधन या बलाघाती कर्ता—दोनों रूपों में समझा जा सकता है।
    reason: ambiguity
  - marker: d
    text: या, ‘युद्धघोष’ अथवा ‘युद्ध का बिगुल-संकेत।’
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעַי
  choice: मेरे भीतर के अंग
  rationale: यह शब्द मूलतः शरीर के भीतरी अंगों को दर्शाता है और यहाँ गहरी आंतरिक व्यथा व्यक्त करता है। यह अनुवाद हिब्रू के शारीरिक बिंब को बनाए रखता है; इसकी पुनरावृत्ति भावनात्मक तीव्रता के लिए सुरक्षित रखी गई है।
- source_word: אחולה
  choice: मैं पीड़ा से तड़प रहा हूँ
  rationale: חול/חיל से संबंधित यह रूप प्रसव-जैसी ऐंठन, तड़प या तीव्र व्यथा का भाव देता है। 'तड़प रहा हूँ' शारीरिक और मानसिक दोनों पीड़ा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: קִירוֹת לִבִּי
  choice: हे मेरे हृदय की दीवारो
  rationale: קִירוֹת का शाब्दिक अर्थ 'दीवारें' है। असामान्य किंतु सजीव शारीरिक रूपक और विस्मयपूर्ण संबोधन को समतल किए बिना रखा गया है।
- source_word: הֹמֶה לִּי לִבִּי
  choice: मेरा हृदय मेरे भीतर ज़ोरों से धड़क रहा है
  rationale: המה हलचल, गूँज, गर्जना या व्याकुल आंदोलन बता सकता है। प्रसंग में 'ज़ोरों से धड़क रहा है' भय से उत्पन्न हृदय की उथल-पुथल को सहज हिन्दी में प्रकट करता है।
- source_word: לֹא אַחֲרִישׁ
  choice: मैं चुप नहीं रह सकता
  rationale: यहाँ חרש मौन रहने का अर्थ देता है। कारण बताने वाले अगले वाक्यांश और भावावेश के कारण असमर्थता का भाव 'नहीं रह सकता' में स्वाभाविक रूप से आता है।
- source_word: קוֹל שׁוֹפָר
  choice: नरसिंगे की ध्वनि
  rationale: שׁוֹפָר मेढ़े के सींग से बना फूँकने वाला वाद्य है। हिन्दी बाइबलीय प्रयोग में 'नरसिंगा' उसके युद्ध-संकेतकारी स्वरूप को सामान्य 'तुरही' से अधिक स्पष्ट रखता है।
- source_word: שמעתי נַפְשִׁי
  choice: हे मेरे प्राण, तूने ... सुन ली है
  rationale: क्रिया के बाद आए נַפְשִׁי को भावपूर्ण आत्म-संबोधन के रूप में समझना संभव है। 'हे मेरे प्राण' उस अचानक आत्म-संबोधन को रखता है, जबकि वैकल्पिक कर्तृवाचक पाठ पादटिप्पणी में दिया गया है।
- source_word: תְּרוּעַת מִלְחָמָה
  choice: युद्ध की चेतावनी
  rationale: תְּרוּעָה ऊँची पुकार, बिगुल-संकेत या संकट की चेतावनी हो सकती है। नरसिंगे के संदर्भ में 'युद्ध की चेतावनी' संकेत/अलार्म का भाव रखती है; 'युद्धघोष' भी संभव है।
theological_decisions:
- issue: נַפְשִׁי का व्याकरणिक संबंध
  choice: इसे आत्म-संबोधन मानकर 'हे मेरे प्राण, तूने ... सुन ली है' किया गया है।
  alternative: इसे वाक्य के बलाघाती कर्ता के रूप में लेकर 'मेरे प्राण ने ... सुन ली है' कहा जा सकता है।
  rationale: हिब्रू शब्द-क्रम दोनों समझों की अनुमति देता है। मुख्य पाठ भावपूर्ण आत्म-संबोधन को रखता है और दूसरी संभावना को पादटिप्पणी में सुरक्षित करता है; इससे किसी विशिष्ट आत्मा-संबंधी सिद्धांत का निष्कर्ष नहीं निकाला गया।
translation_notes:
  register: भाषा आधुनिक, काव्यात्मक और गरिमापूर्ण रखी गई है। मूल के असामान्य शारीरिक बिंबों को अत्यधिक अमूर्त किए बिना सुरक्षित रखा गया है। 'ज़ोरों से' बोलचाल की स्पष्टता देता है, जबकि 'नरसिंगा' और संबोधनात्मक 'हे मेरे प्राण' पद्य की ऊँची शैली बनाए रखते हैं।
