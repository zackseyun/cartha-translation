  source_fidelity: ‘क्योंकि यदि’ accurately preserves the explanatory conditional force of כִּי אִם. ‘जाने देने से इनकार करते हो’ conveys deliberate refusal, and ‘अब भी उन्हें रोके रखते हो’ naturally communicates the continuing restraint expressed by וְעוֹדְךָ מַחֲזִיק בָּם. The intentionally unfinished conditional clause appropriately leads into the next verse.
  naturalness: The Hindi is clear, modern, and suitably direct for God’s address to Pharaoh. ‘उन्हें रोके रखते हो’ is more idiomatic in this context than a strictly physical sense of holding them.
  terminology: The rendering maintains the Exodus-context sense of permitting the Israelites to depart without importing doctrinal interpretation. The footnote supplies a defensible more literal alternative while the main text retains contextual clarity.
