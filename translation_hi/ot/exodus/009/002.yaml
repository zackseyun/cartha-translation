translation_notes:
  register: आधुनिक मानक हिन्दी में सम्मानपूर्ण पर सीधा संबोधन रखा गया है। एकवचन ‘तुम’ मूल के द्वितीय पुरुष पुल्लिंग एकवचन को स्वाभाविक आधुनिक हिन्दी में दर्शाता है। वाक्य जानबूझकर अपूर्ण रखा गया है, क्योंकि यह अगले पद में आने वाले सशर्त परिणाम की भूमिका है।
