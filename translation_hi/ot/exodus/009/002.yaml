  text: כִּ֛י אִם מָאֵ֥ן אַתָּ֖ה לְ/שַׁלֵּ֑חַ וְ/עוֹדְ/ךָ֖ מַחֲזִ֥יק בָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/002.yaml
  text: For if you refuse to let them go and still hold on to them,[a]
translation:
  language: hi
  text: क्योंकि यदि तुम उन्हें जाने देने से इनकार करते हो और अब भी उन्हें रोके रखते हो,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “और अब भी उन्हें पकड़े रखते हो।”
    reason: מַחֲזִיק בָּם के अधिक शब्दशः अर्थ ‘उन्हें पकड़े/थामे रखना’ को सुरक्षित रखने वाला वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: כִּי אִם
  choice: क्योंकि यदि
  rationale: यह पद पिछले कथन से जुड़ा हुआ कारणसूचक सशर्त वाक्य आरम्भ करता है; यह चयन כִּי की व्याख्यात्मक और אִם की सशर्त शक्ति दोनों को बनाए रखता है।
- source_word: מָאֵן
  choice: इनकार करते हो
  rationale: क्रिया असमर्थता नहीं, बल्कि जान-बूझकर मना करने या इनकार करने को व्यक्त करती है।
- source_word: לְשַׁלֵּחַ
  choice: जाने देने
  rationale: निर्गमन के प्रसंग में यह फिरौन द्वारा इस्राएलियों को प्रस्थान की अनुमति देने का स्वाभाविक और सटीक हिन्दी रूप है।
- source_word: וְעוֹדְךָ
  choice: और अब भी
  rationale: यह संबोधित व्यक्ति की जारी अवस्था या क्रिया को व्यक्त करता है और फिरौन की लगातार हठधर्मिता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: מַחֲזִיק בָּם
  choice: उन्हें रोके रखते हो
  rationale: सहभागी रूप लगातार थामे रखने, अपने अधिकार में बनाए रखने या जाने से रोकने का भाव देता है; प्रसंग में ‘रोके रखते हो’ स्पष्ट और स्वाभाविक है, जबकि फुटनोट अधिक शब्दशः विकल्प सुरक्षित रखता है।
