  text: But the wheat and the spelt were not struck down[b][a], because they were late-ripening.
translation:
  language: hi
  text: परन्तु गेहूँ और कठिया गेहूँ[a] ओलों से नष्ट नहीं हुईं, क्योंकि वे देर से पकने वाली थीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह इब्रानी शब्द स्पेल्ट, एमर या उनसे मिलते-जुलते किसी प्राचीन अनाज के लिए हो सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: וְהַחִטָּה
  choice: परन्तु गेहूँ
  rationale: חִטָּה का अर्थ गेहूँ है। आरम्भिक וְ को पिछले पद में नष्ट हुई फसलों के साथ विरोध दिखाने के लिए स्वाभाविक हिन्दी में ‘परन्तु’ किया गया है।
- source_word: וְהַכֻּסֶּמֶת
  choice: और कठिया गेहूँ
  rationale: כֻּסֶּמֶת प्राचीन गेहूँ-सम्बन्धी अनाज, सम्भवतः स्पेल्ट या एमर, को दर्शाता है। ‘कठिया गेहूँ’ सामान्य पाठक के लिए अपेक्षाकृत सुबोध है; अनिश्चित पहचान पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: לֹא נֻכּוּ
  choice: नष्ट नहीं हुए
  rationale: नכה का निष्क्रिय रूप यहाँ ओलों से फसलों पर पड़े प्रहार और उसके विनाशकारी प्रभाव को बताता है। ‘नष्ट नहीं हुए’ प्रसंग में स्वाभाविक है, यद्यपि अधिक शाब्दिक अर्थ ‘मारे नहीं गए’ है।
- source_word: כִּי
  choice: क्योंकि
  rationale: כִּי यहाँ इन फसलों के बचने का कारण प्रस्तुत करता है।
- source_word: אֲפִילֹת הֵנָּה
  choice: वे देर से पकते हैं
  rationale: यह स्त्रीलिंग बहुवचन विधेय सम्भवतः फसलों के विकास में पिछड़े या देर से पकने की दशा बताता है, जिसके कारण ओलों के समय वे नष्ट नहीं हुईं।
