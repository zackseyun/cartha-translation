  yaml_path: translation/ot/exodus/009/030.yaml
  text: But as for you and your servants[b][a], I know that you do not yet fear Yahweh God.
translation:
  language: hi
  text: परन्तु मैं जानता हूँ कि तुम और तुम्हारे सेवक अभी तक यहोवा परमेश्वर से नहीं डरते।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम अब भी नहीं डरते,” अथवा, “इससे पहले कि तुम और तुम्हारे सेवक यहोवा परमेश्वर से डरो।” इब्रानी शब्द का अर्थ संदर्भ में “अभी तक नहीं” या कालगत “इससे पहले” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה וַעֲבָדֶיךָ
  choice: परन्तु तुम्हारे और तुम्हारे सेवकों के विषय में
  rationale: स्वतंत्र सर्वनाम और संयोजक पिछले कथन के विपरीत फ़िरौन तथा उसके अधीनस्थों को विषय बनाते हैं। दरबारी संदर्भ में עֲבָדֶיךָ के लिए ‘तुम्हारे सेवकों’ स्वाभाविक है।
- source_word: יָדַעְתִּי כִּי
  choice: मैं जानता हूँ कि
  rationale: पूर्ण क्रिया यहाँ मूसा के वर्तमान, दृढ़ आकलन को व्यक्त करती है और כִּי ज्ञात बात की विषय-वस्तु आरम्भ करता है।
- source_word: טֶרֶם
  choice: अभी तक नहीं
  rationale: अपूर्ण क्रिया के साथ यह संदर्भ में उस अवस्था को बताता है जो अब तक उत्पन्न नहीं हुई; साथ ही वैकल्पिक कालगत अर्थ को पादटिप्पणी में रखा गया है।
- source_word: תִּירְאוּן מִפְּנֵי
  choice: से नहीं डरते
  rationale: יִרְאָה का भय और श्रद्धा के बीच का अर्थगत तनाव ‘डरते’ में बना रहता है; हिंदी में ‘से डरना’ इस प्रयोग का स्वाभाविक रूप है।
- source_word: יְהוָה אֱלֹהִים
  choice: यहोवा परमेश्वर
  rationale: व्यक्तिगत ईश्वरीय नाम और उसके साथ आए אֱלֹהִים, दोनों को स्पष्ट रूप से सुरक्षित रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में उपाधि नहीं, चार अक्षरों वाला व्यक्तिगत नाम है। आधुनिक हिंदी बाइबल-पाठकों के लिए सुपरिचित लिप्यंतरण ‘यहोवा’ नाम को उपाधि से बदले बिना सुरक्षित रखता है।
- issue: परमेश्वर के प्रति ירא का भाव
  choice: डरते
  alternative: भय मानते; श्रद्धा रखते
  rationale: संदर्भ में दंड का भय और परमेश्वर के प्रति उचित आदर दोनों निहित हो सकते हैं; ‘डरते’ इस तनाव को किसी एक अर्थ तक सीमित नहीं करता।
- issue: טֶרֶם का कालगत अर्थ
  choice: अभी तक ... नहीं
  alternative: इससे पहले कि ... डरो
  rationale: संदर्भ में यह फ़िरौन और उसके सेवकों की अब तक बनी हुई निर्भयता का सबसे स्वाभाविक कथन है, पर मूल की संभावित ‘पहले’ वाली रचना पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रूप। बहुवचन ‘तुम लोग’ से फ़िरौन और उसके सेवकों, दोनों को संबोधन में स्पष्ट किया गया है; ‘परन्तु’ कथन का विरोधात्मक बल बनाए रखता है।
