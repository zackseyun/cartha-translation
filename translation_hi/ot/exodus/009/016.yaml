source:
  edition: WLC
  text: וְ/אוּלָ֗ם בַּ/עֲב֥וּר זֹאת֙ הֶעֱמַדְתִּ֔י/ךָ בַּ/עֲב֖וּר הַרְאֹתְ/ךָ֣ אֶת כֹּחִ֑/י וּ/לְמַ֛עַן סַפֵּ֥ר שְׁמִ֖/י בְּ/כָל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/016.yaml
  text: 'But for this purpose I have let you stand: to show you my power[a], and so that my name may be proclaimed in all the earth.'
translation:
  language: hi
  text: 'परन्तु मैंने तुझे इसी उद्देश्य से खड़ा रहने दिया है[a]: कि मैं तुझे अपनी सामर्थ्य दिखाऊँ, और मेरा नाम सारी पृथ्वी पर घोषित किया जाए।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैंने तुझे इसी उद्देश्य से उठाया है।” इब्रानी पद का अर्थ फ़िरौन को खड़ा करना या खड़ा रहने देना हो सकता है। इस प्रसंग में सम्भवतः आशय यह है कि परमेश्वर ने उसे तुरन्त नष्ट करने के बजाय अब तक जीवित रहने दिया।
    reason: alternative_reading
lexical_decisions:
- source_word: וְאוּלָם
  choice: परन्तु
  rationale: यह पिछले कथन के साथ प्रबल विरोध दर्शाता है; ‘परन्तु’ स्वाभाविक और गरिमापूर्ण हिन्दी में उस विरोध को बनाए रखता है।
- source_word: בַּעֲבוּר זֹאת
  choice: इसी उद्देश्य से
  rationale: यह केवल कारण नहीं, बल्कि आगे आने वाले प्रयोजन-वाक्यों का परिचय देता है।
- source_word: הֶעֱמַדְתִּיךָ
  choice: मैंने तुझे ... खड़ा रहने दिया है
  rationale: עמד के हिफ़ील रूप में किसी को खड़ा रखना या बने रहने देना निहित है। निकटवर्ती संदर्भ में अर्थ है कि परमेश्वर ने फ़िरौन को तत्काल नष्ट करने के बजाय अब तक बने रहने दिया।
- source_word: בַּעֲבוּר הַרְאֹתְךָ
  choice: कि मैं तुझे ... दिखाऊँ
  rationale: हिन्दी में उद्देश्य को सहज रूप से व्यक्त करता है और फ़िरौन को प्रत्यक्ष कर्म बनाए रखता है।
- source_word: כֹּחִי
  choice: अपनी सामर्थ्य
  rationale: כח यहाँ विपत्तियों में प्रकट होने वाली परमेश्वर की शक्ति को दर्शाता है; ‘सामर्थ्य’ गरिमापूर्ण और सामान्य बाइबलीय हिन्दी है।
- source_word: וּלְמַעַן
  choice: और ... जाए
  rationale: यह पहले उद्देश्य के साथ समन्वित दूसरा उद्देश्य प्रस्तुत करता है।
- source_word: סַפֵּר
  choice: घोषित किया जाए
  rationale: पिएल रूप सुनाने, वर्णन करने या घोषित करने का भाव देता है। भाववाच्य अनिर्दिष्ट कर्ता को सुरक्षित रखता है।
- source_word: שְׁמִי
  choice: मेरा नाम
  rationale: मूल रूपक को बनाए रखता है; यहाँ नाम में परमेश्वर की ख्याति और प्रकट पहचान भी निहित है।
- source_word: בְּכָל הָאָרֶץ
  choice: सारी पृथ्वी पर
  rationale: इस प्रसंग में הָאָרֶץ का व्यापक, विश्वव्यापी आशय अधिक उपयुक्त है, केवल किसी स्थानीय देश का नहीं।
theological_decisions:
- issue: फ़िरौन के संबंध में הֶעֱמַדְתִּיךָ का अर्थ
  choice: परमेश्वर ने फ़िरौन को अपने उद्देश्य के लिए अब तक खड़ा रहने या जीवित बने रहने दिया।
  alternative: परमेश्वर ने फ़िरौन को इसी उद्देश्य से उठाया या राजपद पर स्थापित किया।
  rationale: पिछली आयतों में परमेश्वर कहता है कि वह फ़िरौन को मिटा सकता था; उसके अब भी खड़े रहने का उल्लेख संरक्षण या जारी अस्तित्व की ओर संकेत करता है। मुख्य पाठ इस संदर्भगत अर्थ को देता है, जबकि पाद-टिप्पणी मूल अभिव्यक्ति की दूसरी सम्भव समझ को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट शैली रखी गई है। परमेश्वर द्वारा फ़िरौन को सम्बोधन होने के कारण एकवचन ‘तुझे’ प्रयोग किया गया है। ‘खड़ा रहने दिया’ मूल इब्रानी बिंब और संदर्भगत संरक्षण—दोनों को यथासम्भव बनाए रखता है।
