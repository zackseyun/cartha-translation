base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/013.yaml
  text: 'Then Yahweh said to Moses[a], “Rise early in the morning and present yourself before Pharaoh, and say to him, ‘Thus says Yahweh, the God of the Hebrews: Let my people go, so that they may serve me.’”'
translation:
  language: hi
  text: 'तब याहवे ने मूसा से कहा, “सुबह जल्दी उठकर फ़िरौन के सामने उपस्थित हो और उससे कह, ‘इब्रानियों का परमेश्वर याहवे यों कहता है: मेरी प्रजा को जाने दे, ताकि वे मेरी सेवा करें[a]।’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ताकि वे मेरी आराधना करें।” इब्रानी क्रिया परमेश्वर की सेवा को दर्शा सकती है, जिसमें आराधना भी सम्मिलित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित रूप ‘यहोवा’ के द्वारा परमेश्वर के व्यक्तिगत वाचा-नाम को शीर्षक से बदलने के बजाय नाम के रूप में रखा गया है।
- source_word: הַשְׁכֵּם בַּבֹּקֶר
  choice: भोर को जल्दी उठकर
  rationale: हिफ़ील आज्ञार्थक का ‘जल्दी उठना’ और בַּבֹּקֶר का प्रातःकालीन समय—दोनों स्वाभाविक हिन्दी में व्यक्त होते हैं।
- source_word: וְהִתְיַצֵּב לִפְנֵי
  choice: के सामने उपस्थित हो
  rationale: यह रूप अपने को किसी के सामने खड़ा करने या उपस्थित होने का भाव देता है; राजदरबार के प्रसंग में ‘उपस्थित हो’ स्वाभाविक और गरिमापूर्ण है।
- source_word: כֹּה אָמַר
  choice: यों कहता है
  rationale: यह दूत-संदेश की औपचारिक घोषणा का स्वाभाविक हिन्दी रूप है।
- source_word: אֱלֹהֵי הָעִבְרִים
  choice: इब्रानियों का परमेश्वर
  rationale: सम्बन्धवाचक इब्रानी पदबंध का सीधा और स्पष्ट अनुवाद।
- source_word: שַׁלַּח אֶת־עַמִּי
  choice: मेरी प्रजा को जाने दे
  rationale: निर्गमन के प्रसंग में שׁלח की आज्ञा मुक्ति देकर जाने देने की माँग व्यक्त करती है; עַמִּי के लिए ‘मेरी प्रजा’ सामूहिक और वाचागत भाव रखता है।
- source_word: וְיַעַבְדֻנִי
  choice: ताकि वे मेरी सेवा करें
  rationale: संयोजक सहित अपूर्ण क्रिया यहाँ उद्देश्य बताती है। ‘सेवा करें’ עבד के व्यापक अर्थ को सुरक्षित रखता है, जिसमें आराधना भी सम्मिलित हो सकती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में आए चार-अक्षरी व्यक्तिगत नाम को ‘प्रभु’ जैसे शीर्षक से नहीं बदला गया। हिन्दी बाइबलीय प्रयोग में अधिक पहचाने जाने वाले नामरूप ‘यहोवा’ को चुना गया।
- issue: וְיַעַבְדֻנִי का अर्थ
  choice: ताकि वे मेरी सेवा करें
  alternative: ताकि वे मेरी आराधना करें
  rationale: עבד परमेश्वर की सेवा को दर्शाता है और उसमें आराधना समाहित हो सकती है, पर उसका अर्थ केवल उपासना-विधि तक सीमित नहीं है। इसलिए व्यापक अर्थ मुख्य पाठ में और संकरा सम्भावित अर्थ पादटिप्पणी में रखा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और वचन-संगत शैली रखी गई है। फ़िरौन से प्रत्यक्ष आज्ञा के लिए एकवचन ‘तू’ के बजाय हिन्दी बाइबलीय संदेश-शैली का संक्षिप्त क्रियारूप ‘कह/जाने दे’ रखा गया है।
