source:
  edition: WLC
  text: הִנְ/נִ֤י מַמְטִיר֙ כָּ/עֵ֣ת מָחָ֔ר בָּרָ֖ד כָּבֵ֣ד מְאֹ֑ד אֲשֶׁ֨ר לֹא הָיָ֤ה כָמֹ֨/הוּ֙ בְּ/מִצְרַ֔יִם לְ/מִן הַ/יּ֥וֹם הִוָּסְדָ֖/ה וְ/עַד עָֽתָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/018.yaml
  text: Behold[a], about this time tomorrow I will rain down very heavy hail[b], such as has never been in Egypt from the day it was founded until now.
translation:
  language: hi
  text: देखो, कल लगभग इसी समय[a] मैं बहुत भारी ओले बरसाऊँगा, जो मिस्र में उसकी स्थापना के दिन से लेकर अब तक कभी नहीं पड़े।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कल इसी समय।”
    reason: כָּעֵת में प्रयुक्त כְּ को अनुमानसूचक अथवा समय-साम्यसूचक समझा जा सकता है।
lexical_decisions:
- source_word: הִנְנִי
  choice: देखो
  rationale: यह पद एक गंभीर और ध्यान आकर्षित करने वाली ईश्वरीय घोषणा आरंभ करता है। ‘देखो’ मूल के संकेतात्मक बल को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: מַמְטִיר
  choice: मैं ... बरसाऊँगा
  rationale: 'हिफ़ील रूप प्रत्यक्ष कारक क्रिया व्यक्त करता है: परमेश्वर स्वयं ओले बरसाने की घोषणा करता है।'
- source_word: כָּעֵת מָחָר
  choice: कल लगभग इसी समय
  rationale: כְּ उपसर्ग यहाँ समय की निकटता या अनुमान का भाव दे सकता है। यह अनुवाद उस सूक्ष्मता को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בָּרָד כָּבֵד מְאֹד
  choice: बहुत भारी ओले
  rationale: בָּרָד का सामान्य अर्थ ‘ओले’ है और כָּבֵד מְאֹד उनकी असाधारण भारीपन या प्रचंडता बताता है। ‘बहुत भारी’ मूल बिंब को बनाए रखता है।
- source_word: אֲשֶׁר לֹא הָיָה כָמֹהוּ
  choice: ऐसे ओले ... कभी नहीं पड़े
  rationale: हिन्दी में ओलों की पूर्व घटनाओं से तुलना व्यक्त करने का यह स्वाभाविक ढंग है और मूल के अद्वितीय होने के दावे को सुरक्षित रखता है।
- source_word: לְמִן הַיּוֹם הִוָּסְדָה
  choice: उसके बसाए जाने के दिन से
  rationale: निफ़अल रूप मिस्र के बसाए या स्थापित किए जाने को दर्शाता है। स्त्रीलिंगी क्रियारूप का संबंध मिस्र से है; हिन्दी में ‘उसके’ स्वाभाविक रूप से उसी की ओर संकेत करता है।
- source_word: וְעַד עָתָּה
  choice: लेकर अब तक
  rationale: यह स्थापना के समय से वर्तमान क्षण तक की पूरी अवधि व्यक्त करता है।
theological_decisions:
- issue: विपत्ति में परमेश्वर की प्रत्यक्ष भूमिका
  choice: ‘मैं ... ओले बरसाऊँगा’
  alternative: ‘ओले पड़ेंगे’
  rationale: प्रथम पुरुष में प्रयुक्त कारक क्रिया आने वाली विपत्ति को स्पष्ट रूप से परमेश्वर की क्रिया ठहराती है; निष्क्रिय या निर्वैयक्तिक अनुवाद इस बल को घटा देगा।
- issue: मिस्र की स्थापना का संदर्भ
  choice: ‘उसके बसाए जाने के दिन से’
  alternative: ‘उसके स्थापित किए जाने के दिन से’
  rationale: मूल पाठ मिस्र के अस्तित्व के आरंभ को निष्क्रिय रूप में व्यक्त करता है, पर यह नहीं बताता कि उसे किसने बसाया या स्थापित किया। अनुवाद भी उस कर्ता को अनिर्दिष्ट रखता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘देखो’ गंभीर घोषणा का बल बनाए रखता है; डैश आने वाले ओलों की अभूतपूर्व प्रकृति पर स्वाभाविक जोर देता है।
