  text: כִּ֣י בַּ/פַּ֣עַם הַ/זֹּ֗את אֲנִ֨י שֹׁלֵ֜חַ אֶת כָּל מַגֵּפֹתַ/י֙ אֶֽל לִבְּ/ךָ֔ וּ/בַ/עֲבָדֶ֖י/ךָ וּ/בְ/עַמֶּ֑/ךָ בַּ/עֲב֣וּר תֵּדַ֔ע כִּ֛י אֵ֥ין כָּמֹ֖/נִי בְּ/כָל הָ/אָֽרֶץ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/014.yaml
  text: For this time I am sending all my plagues against your heart[a], and against your servants and your people[b], so that you may know that there is none like me in all the earth.
translation:
  language: hi
  text: क्योंकि इस बार मैं अपनी सारी विपत्तियाँ तेरे हृदय पर[a], तेरे सेवकों पर और तेरी प्रजा पर भेज रहा हूँ, ताकि तू जान ले कि सारी पृथ्वी पर[b] मेरे समान कोई नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरे हृदय की ओर।” हिब्रू अभिव्यक्ति का आशय यह हो सकता है कि ये विपत्तियाँ स्वयं फिरौन पर, उसके अस्तित्व के केंद्र पर, लक्षित हैं।
    reason: lexical_alternative
  - marker: b
    text: या, “सारे देश में।” हिब्रू शब्द का अर्थ स्थानीय रूप से “देश” भी हो सकता है; यहाँ परमेश्वर की अतुलनीयता के व्यापक कथन के कारण “पृथ्वी” अनुवादित किया गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण और आगे की चेतावनी का आधार प्रस्तुत करता है।
- source_word: בַּפַּעַם הַזֹּאת
  choice: इस बार
  rationale: वर्तमान अवसर या दंड के इस चरण को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: שֹׁלֵחַ
  choice: भेजने वाला हूँ
  rationale: हिब्रू कृदंत यहाँ निकट भविष्य की आसन्न कार्रवाई व्यक्त करता है; हिन्दी में यह रूप उस भाव को स्पष्ट और स्वाभाविक रखता है।
- source_word: כָּל מַגֵּפֹתַי
  choice: अपनी सारी महामारियाँ
  rationale: מַגֵּפָה प्रहार, विपत्ति या महामारी-सदृश दैवी दंड का बोध कराता है; निर्गमन के प्रसंग में ‘महामारियाँ’ उपयुक्त है।
- source_word: אֶל לִבְּךָ
  choice: तेरे हृदय पर
  rationale: शाब्दिक ‘तेरे हृदय की ओर/पर’ रूपक को बनाए रखता है और फिरौन के भीतरी व्यक्तित्व पर लक्षित दंड का संकेत देता है।
- source_word: וּבַעֲבָדֶיךָ
  choice: तेरे सेवकों पर
  rationale: यहाँ עֲבָדִים से फिरौन के अधिकारी या अधीनस्थ अभिप्रेत हैं, इसलिए ‘सेवक’ उपयुक्त है।
- source_word: וּבְעַמֶּךָ
  choice: तेरी प्रजा पर
  rationale: यह फिरौन के अधीन मिस्रियों को सूचित करता है; राजकीय संदर्भ में ‘प्रजा’ स्वाभाविक है।
- source_word: בַּעֲבוּר תֵּדַע
  choice: ताकि तू जान ले
  rationale: उद्देश्यसूचक रचना को स्पष्ट रखता है और इच्छित परिणाम व्यक्त करता है।
- source_word: אֵין כָּמֹנִי
  choice: मेरे समान कोई नहीं है
  rationale: परमेश्वर की अतुलनीयता के हिब्रू कथन को सीधे और गरिमापूर्ण ढंग से प्रस्तुत करता है।
- source_word: בְּכָל הָאָרֶץ
  choice: सारी पृथ्वी पर
  rationale: אֶרֶץ का अर्थ ‘देश’ भी हो सकता है, पर यहाँ अतुलनीयता का कथन विश्वव्यापी आशय रखता है।
theological_decisions:
- issue: परमेश्वर की अतुलनीयता का क्षेत्र
  choice: सारी पृथ्वी पर
  alternative: सारे देश में
  rationale: प्रसंग यहोवा की अद्वितीयता को केवल मिस्र तक सीमित नहीं करता; फिर भी मूल शब्द की स्थानीय सम्भावना पादटिप्पणी में सुरक्षित है।
- issue: ‘तेरे हृदय पर’ का अर्थ
  choice: हृदय का रूपक बनाए रखा गया
  alternative: व्याख्यात्मक रूप से ‘स्वयं तुझ पर’
  rationale: मूल पाठ स्पष्टतः ‘हृदय’ कहता है। इसे बनाए रखने से फिरौन के कठोर हृदय और उसके भीतरी अस्तित्व पर पड़ने वाले दंड के बीच का कथात्मक तनाव सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली। फिरौन को संबोधन मूल के एकवचन और कथात्मक तीखेपन के अनुरूप ‘तू/तेरे’ में रखा गया है। ‘हृदय’ का रूपक जानबूझकर सुरक्षित रखा गया है।
