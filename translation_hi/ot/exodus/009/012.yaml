base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/012.yaml
  text: But Yahweh hardened Pharaoh's heart[a], and he did not listen to them, just as Yahweh had spoken to Moses.
translation:
  language: hi
  text: परन्तु याहवे ने फ़िरौन का हृदय कठोर कर दिया[a], और उसने उनकी बात नहीं सुनी, जैसा कि याहवे ने मूसा से कहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “फ़िरौन के हृदय को दृढ़ कर दिया” अथवा “फ़िरौन के हृदय को बलवान कर दिया।” इब्रानी क्रिया का अधिक शाब्दिक अर्थ “बलवान या दृढ़ करना” है, पर इस प्रसंग में यह फ़िरौन के हठपूर्ण प्रतिरोध को व्यक्त करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַזֵּק
  choice: कठोर कर दिया
  rationale: חזק का मूल अर्थ बलवान या दृढ़ करना है; पर निर्गमन में ‘हृदय’ के साथ यह हठपूर्ण प्रतिरोध को व्यक्त करता है। ‘कठोर कर दिया’ आधुनिक हिन्दी में इस प्रसंग का स्वाभाविक रूप है, जबकि अधिक शाब्दिक विकल्प पाद-टिप्पणी में दिए गए हैं।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: לֵב פַּרְעֹה
  choice: फ़िरौन का हृदय
  rationale: इब्रानी संबंध-वाचक रचना का सहज हिन्दी रूप रखा गया है। ‘हृदय’ यहाँ इच्छा और मनोवृत्ति के केंद्र को सूचित करता है, पर मुख्य पाठ में इसकी व्याख्या नहीं जोड़ी गई।
- source_word: שָׁמַע אֲלֵהֶם
  choice: उनकी बात नहीं सुनी
  rationale: שׁמע אֶל का अर्थ किसी की सुनना या उसकी बात मानना हो सकता है। यह रूप सहज हिन्दी में संबंधपरक अर्थ बनाए रखता है और ‘आज्ञा नहीं मानी’ जैसी अधिक विशिष्ट व्याख्या से बचता है।
- source_word: אֲלֵהֶם
  choice: उनकी
  rationale: संदर्भ में सर्वनाम मूसा और हारून की ओर संकेत करता है, किंतु मूल पाठ की तरह मुख्य पाठ में उनके नाम स्पष्ट रूप से नहीं जोड़े गए।
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה אֶל מֹשֶׁה
  choice: ठीक जैसा याहवे ने मूसा से कहा था
  rationale: ‘ठीक जैसा’ पूर्ववर्ती दिव्य वचन की पूर्ति का भाव व्यक्त करता है, और ‘कहा था’ कथा के वर्तमान क्षण से पहले कही गई बात को स्वाभाविक हिन्दी में दर्शाता है।
theological_decisions:
- issue: फ़िरौन के हृदय को कठोर करने में परमेश्वर की सक्रिय भूमिका
  choice: याहवे ने फ़िरौन का हृदय कठोर कर दिया
  alternative: याहवे ने फ़िरौन का हृदय दृढ़ कर दिया / बलवान कर दिया
  rationale: इब्रानी वाक्य में याहवे स्पष्टतः कर्ता और फ़िरौन का हृदय कर्म है। इसलिए दिव्य भूमिका को अनुमति-मात्र या निष्क्रियता के रूप में नहीं बदला गया। साथ ही, חזק के अधिक शाब्दिक अर्थों को पाद-टिप्पणी में सुरक्षित रखा गया है, जिससे मूल की अर्थगत और धर्मवैज्ञानिक जटिलता बनी रहे।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘याहवे’ द्वारा दिव्य नाम सुरक्षित है; ‘फ़िरौन का हृदय’ मूल रूपक को बनाए रखता है।
