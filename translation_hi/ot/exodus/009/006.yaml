source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ יְהוָ֜ה אֶת הַ/דָּבָ֤ר הַ/זֶּה֙ מִֽ/מָּחֳרָ֔ת וַ/יָּ֕מָת כֹּ֖ל מִקְנֵ֣ה מִצְרָ֑יִם וּ/מִ/מִּקְנֵ֥ה בְנֵֽי יִשְׂרָאֵ֖ל לֹא מֵ֥ת אֶחָֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/006.yaml
  text: And Yahweh did this thing the next day[a], and all the livestock of Egypt died; but from the livestock of the sons of Israel, not one died.
translation:
  language: hi
  text: 'अगले दिन याहवे ने यह किया: मिस्र का सारा पशुधन मर गया, पर इस्राएलियों[a] के पशुधन में से एक भी नहीं मरा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “इस्राएल के पुत्रों।”
    reason: मूल इब्रानी अभिव्यक्ति की शाब्दिक बनावट बताने के लिए।
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय देवनागरी में उसके प्रचलित निकट लिप्यंतरण के रूप में रखा गया है।
- source_word: וַיַּעַשׂ ... אֶת־הַדָּבָר הַזֶּה
  choice: ऐसा ही किया
  rationale: यह हिन्दी में स्वाभाविक रूप से पूर्वघोषित कार्य के पूरा होने को व्यक्त करता है और इब्रानी मुहावरे का अनावश्यक शब्दशःपन टालता है।
- source_word: מִמָּחֳרָת
  choice: अगले दिन
  rationale: यह समय-सूचक पद अगले या उसके बाद वाले दिन को दर्शाता है; हिन्दी में ‘अगले दिन’ इसका सीधा और स्वाभाविक रूप है।
- source_word: כֹּל מִקְנֵה מִצְרַיִם
  choice: मिस्र के सभी पालतू पशु
  rationale: מִקְנֶה केवल गाय-बैलों तक सीमित नहीं, बल्कि रखे जाने वाले पशुधन के लिए व्यापक शब्द है। ‘पालतू पशु’ सामान्य पाठक के लिए स्पष्ट और व्यापक है।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: यह जातिनाम-सदृश सामूहिक अभिव्यक्ति है। मुख्य पाठ में ‘इस्राएलियों’ सहज आधुनिक हिन्दी है; शाब्दिक रूप पाद-टिप्पणी में सुरक्षित है।
- source_word: לֹא מֵת אֶחָד
  choice: एक भी नहीं मरा
  rationale: निषेध और संख्या के बल को संक्षिप्त, स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसे किसी उपाधि से प्रतिस्थापित किए बिना सुरक्षित रखता है।
- issue: בְנֵי יִשְׂרָאֵל का सामूहिक अर्थ
  choice: इस्राएलियों
  alternative: इस्राएल के पुत्रों
  rationale: संदर्भ में यह पूरे जातीय समुदाय का नाम है, केवल पुरुष संतानों पर बल नहीं। सहज सामूहिक रूप मुख्य पाठ में है, जबकि मूल की शाब्दिक बनावट पाद-टिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। दो समन्वित खंडों को हिन्दी की सहज वाक्य-लय के लिए अलग वाक्यों में रखा गया है; ‘लेकिन’ मूल के विरोधसूचक संबंध को स्पष्ट करता है।
