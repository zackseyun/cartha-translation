source:
  edition: WLC
  text: הַעְתִּ֨ירוּ֙ אֶל יְהוָ֔ה וְ/רַ֕ב מִֽ/הְיֹ֛ת קֹלֹ֥ת אֱלֹהִ֖ים וּ/בָרָ֑ד וַ/אֲשַׁלְּחָ֣ה אֶתְ/כֶ֔ם וְ/לֹ֥א תֹסִפ֖וּ/ן לַ/עֲמֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/028.yaml
  text: Pray to Yahweh[a], for there has been enough of God's thunder and hail. Then I will let you go, and you will stay no longer.
translation:
  language: hi
  text: याहवे से विनती करो कि परमेश्वर की गरज[a] और ओले बहुत हो चुके हैं। तब मैं तुम्हें जाने दूँगा, और तुम अब और नहीं ठहरोगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “परमेश्वर की आवाज़ें और ओले।” यहाँ “आवाज़ें” तूफ़ान की गरज को दर्शाती हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעְתִּירוּ
  choice: विनती करो
  rationale: हिफ़िल आज्ञार्थक बहुवचन यहाँ किसी से आग्रहपूर्वक प्रार्थना करने का भाव रखता है। ‘विनती करो’ आधुनिक हिंदी में प्रार्थना की गंभीरता और आग्रह दोनों व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: וְרַב מִהְיֹת
  choice: अब बहुत हो चुके
  rationale: यह इब्रानी मुहावरा पर्याप्तता अथवा अति का भाव व्यक्त करता है; संदर्भ में फ़िरौन विपत्ति समाप्त करने की गुहार लगा रहा है।
- source_word: קֹלֹת אֱלֹהִים
  choice: परमेश्वर की गरज
  rationale: קֹלֹת का शाब्दिक अर्थ ‘आवाज़ें’ है, पर ओलों वाले तूफ़ान के संदर्भ में इसका आशय गरज से है। संबंधसूचक रचना इसे परमेश्वर से जुड़ी अथवा उनकी ओर से आई गरज बताती है।
- source_word: וּבָרָד
  choice: और ओले
  rationale: בָּרָד का सामान्य अर्थ ‘ओले’ है; बहुवचन हिंदी में स्वाभाविक है।
- source_word: וַאֲשַׁלְּחָה אֶתְכֶם
  choice: तब मैं तुम लोगों को जाने दूँगा
  rationale: निर्गमन के इस संदर्भ में שלח का अर्थ लोगों को मुक्त करके जाने देना है। ‘तब’ विनती पूरी होने के परिणाम को स्वाभाविक हिंदी में स्पष्ट करता है।
- source_word: וְלֹא תֹסִפוּן לַעֲמֹד
  choice: और तुम यहाँ फिर नहीं ठहरोगे
  rationale: शाब्दिक ‘खड़े रहने को और न बढ़ाओगे’ का मुहावरेदार अर्थ आगे न रुकना या न ठहरना है। ‘यहाँ’ मिस्र में वर्तमान ठहराव को संदर्भ से स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का निरूपण
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: व्यक्तिगत ईश्वरीय नाम को उपाधि से प्रतिस्थापित न करके उसके प्रचलित विद्वत्तापूर्ण उच्चारण के निकट देवनागरी लिप्यंतरण रखा गया है।
- issue: קֹלֹת אֱלֹהִים का अर्थ
  choice: परमेश्वर की गरज
  alternative: परमेश्वर की आवाज़ें; भयंकर गरज
  rationale: तूफ़ान और ओलों का तात्कालिक संदर्भ ‘आवाज़ों’ को गरज के रूप में पहचानता है। ‘परमेश्वर की’ मूल संबंधसूचक अभिव्यक्ति और संभावित ईश्वरीय अभिकरण को बनाए रखता है; इसे केवल तीव्रता-सूचक ‘भयंकर’ नहीं बनाया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। फ़िरौन की आग्रहपूर्ण वाणी के लिए ‘विनती करो’ और समूह को संबोधित करने के लिए ‘तुम लोगों’ का प्रयोग किया गया है।
