  to: याहवे से विनती करो कि परमेश्वर की गरज[a] और ओले बहुत हो चुके हैं। तब मैं तुम्हें जाने दूँगा, और तुम अब और नहीं ठहरोगे।
  rationale: The revision removes the unintended iterative meaning of ‘फिर’ and renders the Hebrew ‘not continue to remain’ with ‘अब और नहीं ठहरोगे.’ It also makes the object of ‘जाने दूँगा’ more natural while retaining the plural address and all source-level meanings.
