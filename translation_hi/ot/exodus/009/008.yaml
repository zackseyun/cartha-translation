  text: וַ/יֹּ֣אמֶר יְהוָה֮ אֶל מֹשֶׁ֣ה וְ/אֶֽל אַהֲרֹן֒ קְח֤וּ לָ/כֶם֙ מְלֹ֣א חָפְנֵי/כֶ֔ם פִּ֖יחַ כִּבְשָׁ֑ן וּ/זְרָק֥/וֹ מֹשֶׁ֛ה הַ/שָּׁמַ֖יְמָ/ה לְ/עֵינֵ֥י פַרְעֹֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/008.yaml
  text: Then Yahweh said to Moses and to Aaron[a], “Take for yourselves handfuls of soot from a furnace[c][b], and let Moses throw it toward the sky before Pharaoh’s eyes.”
translation:
  language: hi
  text: तब याहवे ने मूसा और हारून से कहा, “तुम दोनों भट्ठे की कालिख[b] से अपनी-अपनी मुट्ठियाँ भर लो[a], और मूसा उसे फ़िरौन की आँखों के सामने आकाश[c] की ओर उछाले।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपने हाथों की भराई ले लो”; इसका अनुवाद “पूरी-पूरी मुट्ठियाँ ले लो” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “कालिख” का अनुवाद “बारीक कालिख” या अधिक सामान्य रूप में “राख” भी किया जा सकता है; यहाँ इब्रानी शब्द विशेष रूप से भट्ठे से निकले महीन अवशेष की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: c
    text: या “स्वर्ग की ओर।” इब्रानी शब्द का अर्थ प्रसंग के अनुसार “आकाश” या “स्वर्ग” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित रूप ‘यहोवा’ परमेश्वर के व्यक्तिगत नाम को शीर्षक से बदलने के बजाय नाम के रूप में बनाए रखता है।
- source_word: קְחוּ לָכֶם
  choice: तुम दोनों ... भर लो
  rationale: बहुवचन आज्ञा और לָכֶם के आत्मसंबंधी भाव को स्वाभाविक हिन्दी में व्यक्त करता है; संबोधन मूसा और हारून दोनों से है।
- source_word: מְלֹא חָפְנֵיכֶם
  choice: अपनी-अपनी मुट्ठियाँ भर लो
  rationale: शाब्दिक अर्थ हाथों/अंजलियों की भराई है। यह रूप मात्रा और दोनों संबोधित व्यक्तियों की भागीदारी को सहज हिन्दी में स्पष्ट करता है।
- source_word: פִּיחַ
  choice: कालिख
  rationale: यह शब्द भट्ठे से निकले बारीक काले चूर्ण या कालिख को सूचित करता है; सामान्य राख की अपेक्षा ‘कालिख’ अधिक सटीक है।
- source_word: כִּבְשָׁן
  choice: भट्ठा
  rationale: यह भट्ठे, भट्ठी या kiln को सूचित कर सकता है। ‘भट्ठा’ व्यापक और प्रसंगानुकूल आधुनिक हिन्दी है।
- source_word: וּזְרָקוֹ מֹשֶׁה
  choice: और मूसा उसे ... उछाल दे
  rationale: पहली आज्ञा बहुवचन है, पर यहाँ क्रिया का कर्ता विशेष रूप से मूसा है। हिन्दी वाक्य इस बदलाव को बनाए रखता है।
- source_word: הַשָּׁמַיְמָה
  choice: आकाश की ओर
  rationale: दिशासूचक रूप ऊपर की ओर गति बताता है। इस भौतिक क्रिया के लिए ‘आकाश की ओर’ स्वाभाविक है।
- source_word: לְעֵינֵי פַרְעֹה
  choice: फ़िरौन की आँखों के सामने
  rationale: मूल की सजीव अभिव्यक्ति को बनाए रखते हुए यह स्पष्ट करता है कि कार्य फ़िरौन को दिखाई देते हुए किया जाना था।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है। हिन्दी पाठ में परिचित नामरूप ‘यहोवा’ रखा गया है, न कि उसे ‘प्रभु’ जैसे पदनाम से बदला गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘तुम दोनों’ और ‘अपनी-अपनी’ बहुवचन संबोधन को स्पष्ट करते हैं, जबकि अगली आज्ञा में केवल मूसा को कर्ता बनाए रखा गया है।
