  terminology: “मनुष्य” appropriately conveys generic אָדָם in the human-and-animal pairing. “पशु,” “खेत,” “घर के भीतर,” and “ओले” are accurate, accessible equivalents. The footnote is limited to the urgency nuance and does not make the source specify a type of shelter beyond what the verse states.
  issues:
  - severity: medium
    issue: “लोगों को भेजकर” specifies an unstated object/agent of the imperative.
    rationale: The Hebrew issues an urgent command but does not explicitly say “send people.” This can be inferred pragmatically, but should not be added to the translation’s main text.
  - severity: medium
    issue: “मैदान” is used for בַּשָּׂדֶה.
    rationale: In contemporary Hindi, “मैदान” commonly evokes a playing ground or open expanse. “खेत” better represents the agricultural field/open-country setting in this plague warning.
  - severity: low
    issue: The existing footnote explains “सुरक्षित स्थान” as specifically a house or shelter.
    rationale: Although the subsequent clause names a house, the first command itself does not explicitly name the destination. The note should instead document the Hebrew command’s urgency.
