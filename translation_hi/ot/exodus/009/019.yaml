  edition: WLC
  text: וְ/עַתָּ֗ה שְׁלַ֤ח הָעֵז֙ אֶֽת מִקְנְ/ךָ֔ וְ/אֵ֛ת כָּל אֲשֶׁ֥ר לְ/ךָ֖ בַּ/שָּׂדֶ֑ה כָּל הָ/אָדָ֨ם וְ/הַ/בְּהֵמָ֜ה אֲשֶֽׁר יִמָּצֵ֣א בַ/שָּׂדֶ֗ה וְ/לֹ֤א יֵֽאָסֵף֙ הַ/בַּ֔יְתָ/ה וְ/יָרַ֧ד עֲלֵ/הֶ֛ם הַ/בָּרָ֖ד וָ/מֵֽתוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/019.yaml
  text: So now[a], send word and bring your livestock and everything you have in the field to safety. Every man and beast that is found in the field and is not gathered into the house—the hail will come down on them[b], and they will die.
translation:
  language: hi
  text: इसलिए अब तुरंत व्यवस्था करो कि अपने पशुओं और खेत में जो कुछ तुम्हारा है, उसे सुरक्षित स्थान पर ले आया जाए।[a] खेत में जो भी मनुष्य या पशु पाया जाए और घर के भीतर न लाया जाए, उस पर ओले पड़ेंगे और वह मर जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू आज्ञा में तात्कालिकता का भाव है; इसका अनुवाद “जल्दी से” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: इसलिए अब
  rationale: संयोजक וְ और कालवाचक עַתָּה यहाँ पिछली चेतावनी के परिणामस्वरूप तत्काल निर्देश प्रस्तुत करते हैं; ‘इसलिए अब’ इस संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שְׁלַח הָעֵז
  choice: लोगों को भेजकर … सुरक्षित स्थान पर ले आओ
  rationale: שְׁלַח भेजने की आज्ञा देता है और הָעֵז का आशय बाहर मौजूद वस्तुओं को सुरक्षा या आश्रय में पहुँचाना है। हिन्दी में दोनों क्रियाओं का संबंध स्पष्ट करने के लिए ‘लोगों को भेजकर’ कहा गया है।
- source_word: מִקְנְךָ
  choice: अपने पशुओं
  rationale: מִקְנֶה स्वामित्व में रखे घरेलू पशुधन को दर्शाता है; ‘पशुओं’ सामान्य पाठक के लिए सहज और प्रसंगानुकूल है।
- source_word: וְאֵת כָּל אֲשֶׁר לְךָ בַּשָּׂדֶה
  choice: और मैदान में जो कुछ तुम्हारा है
  rationale: यह व्यापक पदबंध मैदान में स्थित सभी संबंधित संपत्ति को समेटता है; हिन्दी अनुवाद इसकी व्यापकता बनाए रखता है।
- source_word: כָּל הָאָדָם וְהַבְּהֵמָה
  choice: जो भी मनुष्य या पशु
  rationale: אָדָם यहाँ सामान्य रूप से किसी भी मानव को और בְּהֵמָה पशु को दर्शाता है। हिन्दी में ‘मनुष्य’ प्रतिनिधिक अर्थ को स्वाभाविक ढंग से बनाए रखता है; वितरणात्मक चेतावनी के कारण ‘जो भी … या’ उपयुक्त है।
- source_word: אֲשֶׁר יִמָּצֵא בַשָּׂדֶה
  choice: मैदान में … मिलेगा
  rationale: מצא का निफ़ाल रूप ‘पाया जाएगा/मिलेगा’ का भाव देता है; ‘मिलेगा’ सहज हिन्दी में उसी स्थिति को व्यक्त करता है।
- source_word: וְלֹא יֵאָסֵף הַבַּיְתָה
  choice: और घर के भीतर नहीं लाया जाएगा
  rationale: אָסף का निफ़ाल निष्क्रिय भाव रखता है और दिशासूचक הַבַּיְתָה घर के भीतर की ओर गति दिखाता है। ‘लाया जाएगा’ मनुष्यों और पशुओं दोनों के लिए स्वाभाविक है।
- source_word: וְיָרַד עֲלֵהֶם הַבָּרָד
  choice: उस पर ओले पड़ेंगे
  rationale: हिब्रू में ओलों के नीचे आने का भाव है। हिन्दी का बहुवचन ‘ओले पड़ेंगे’ स्वाभाविक है, जबकि ‘उस पर’ प्रत्येक मनुष्य या पशु पर अलग-अलग लागू होने वाली चेतावनी को रखता है।
- source_word: וָמֵתוּ
  choice: और वह मर जाएगा
  rationale: यह चेतावनी का निश्चित परिणाम बताता है। एकवचन ‘वह’ हिन्दी में ‘जो भी मनुष्य या पशु’ के वितरणात्मक ढाँचे से मेल खाता है।
theological_decisions:
- issue: प्रतिनिधिक אָדָם का अनुवाद
  choice: मनुष्य
  alternative: व्यक्ति / आदमी
  rationale: אָדָם यहाँ किसी एक पुरुष तक सीमित नहीं, बल्कि सामान्य रूप से मानव को पशु के समांतर रखता है। ‘मनुष्य’ हिन्दी में स्रोत की मानव-पशु जोड़ी और व्यापक अर्थ दोनों को बिना अनावश्यक व्याख्या के बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्पष्ट, गरिमापूर्ण और सामान्य पाठक के लिए सहज रूप अपनाया गया है। ‘घर के भीतर’ स्रोत की दिशात्मक अभिव्यक्ति को रखता है, जबकि ‘सुरक्षित स्थान’ הָעֵז के सुरक्षा-भाव को स्पष्ट करता है।
