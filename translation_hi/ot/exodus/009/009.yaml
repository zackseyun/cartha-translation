language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הָיָ֣ה לְ/אָבָ֔ק עַ֖ל כָּל אֶ֣רֶץ מִצְרָ֑יִם וְ/הָיָ֨ה עַל הָ/אָדָ֜ם וְ/עַל הַ/בְּהֵמָ֗ה לִ/שְׁחִ֥ין פֹּרֵ֛חַ אֲבַעְבֻּעֹ֖ת בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/009.yaml
  text: And it will become fine dust over all the land of Egypt[b][a], and it will become boils breaking out with blisters on man and on beast throughout all the land of Egypt.
translation:
  language: hi
  text: और वह मिस्र की सारी भूमि पर बारीक धूल बन जाएगी, और मिस्र की सारी भूमि में मनुष्यों और पशुओं पर फफोलों सहित निकलने वाले फोड़े बन जाएगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה
  choice: बन जाएगी
  rationale: यहाँ היה अवस्था में परिवर्तन और परिणाम को व्यक्त करता है; इसलिए केवल ‘होगी’ की अपेक्षा ‘बन जाएगी’ अधिक सटीक है। स्त्रीलिंग रूप पिछले पद की ‘राख’ के संदर्भ के अनुरूप है।
- source_word: לְאָבָק
  choice: बारीक धूल
  rationale: אָבָק धूल या चूर्ण जैसे सूक्ष्म कणों को दर्शाता है; हवा में बिखेरी गई राख के प्रसंग में ‘बारीक धूल’ स्वाभाविक और स्पष्ट है।
- source_word: עַל כָּל אֶרֶץ מִצְרָיִם
  choice: पूरे मिस्र देश पर
  rationale: पहले खंड में עַל पूरे भूभाग के ऊपर धूल के फैलाव का स्थानिक भाव देता है।
- source_word: עַל הָאָדָם
  choice: मनुष्यों पर
  rationale: אָדָם यहाँ पशुओं के विपरीत सामूहिक रूप से मानवजाति के सदस्यों को दर्शाता है। आधुनिक हिन्दी में ‘मनुष्यों’ इस सामान्य और सामूहिक अर्थ को स्पष्ट रखता है।
- source_word: וְעַל הַבְּהֵמָה
  choice: और पशुओं पर
  rationale: בְּהֵמָה यहाँ सामूहिक अर्थ में है और मनुष्यों के साथ उसका विरोध रखा गया है; ‘पशु’ इसे ‘मवेशी’ की अपेक्षा अनावश्यक रूप से सीमित नहीं करता।
- source_word: לִשְׁחִין
  choice: फोड़े
  rationale: שְׁחִין त्वचा पर निकलने वाले सूजनयुक्त रोग या फोड़ों को दर्शाता है; हिन्दी में बहुवचन प्रसंगानुकूल और स्वाभाविक है।
- source_word: פֹּרֵחַ
  choice: फूट निकलने वाले
  rationale: इस कृदंत का मूल चित्र उगने या खिलने का है, जो यहाँ त्वचा-रोग के उभर आने के लिए रूपक रूप में प्रयुक्त है। ‘फूट निकलने वाले’ उस सक्रिय उद्भेदन को सुरक्षित रखता है।
- source_word: אֲבַעְבֻּעֹת
  choice: फफोलों के साथ
  rationale: यह शब्द फोड़ों से जुड़ी सूजी हुई फफोलेदार उभारों को बताता है। ‘फफोले’ आधुनिक हिन्दी में स्पष्ट है और इसे छोड़कर केवल ‘पकते हुए फोड़े’ कहना स्रोत के एक अलग पद को मिटा देता।
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: पूरे मिस्र देश में
  rationale: दोहराया गया भौगोलिक वाक्यांश विपत्ति के समूचे मिस्र में फैलने पर बल देता है।
theological_decisions:
- issue: אָדָם का सामान्य मानव-संदर्भ
  choice: मनुष्यों
  alternative: मनुष्य / मानवजाति
  rationale: यहाँ शब्द किसी एक पुरुष को नहीं, बल्कि पशुओं के विपरीत सभी मानव प्राणियों को सामूहिक रूप से दर्शाता है। ‘मनुष्यों’ आधुनिक हिन्दी में इस आशय को स्वाभाविक ढंग से व्यक्त करता है और मूल मानव-पशु विरोध को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। मूल के दोहरे ‘बन जाना’, दोनों व्यापक भौगोलिक वाक्यांशों, तथा שְׁחִין + פֹּרֵחַ + אֲבַעְבֻּעֹת के तीनों अर्थ-घटकों को यथासंभव सुरक्षित रखा गया है।
