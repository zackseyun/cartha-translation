lexical_decisions:
- source_word: הַפִּשְׁתָּה
  choice: सन
  rationale: यह शब्द उस पौधे को दर्शाता है जिससे लिनन बनाया जाता है; आधुनिक हिन्दी में इस फसल का सीधा और प्रचलित नाम “सन” है।
- source_word: הַשְּׂעֹרָה
  choice: जौ
  rationale: यह जौ की फसल के लिए सामान्य इब्रानी शब्द है और हिन्दी में इसका स्वाभाविक समतुल्य “जौ” है।
- source_word: נֻכָּתָה
  choice: नष्ट कर दिए गए थे
  rationale: निष्क्रिय क्रिया फसलों पर पड़े घातक प्रहार और उसके परिणाम को व्यक्त करती है। संयुक्त कर्ता के अनुसार हिन्दी में बहुवचन रखा गया है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ यह फसलों के नष्ट होने का कारण बताता है; “क्योंकि” आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: אָבִיב
  choice: बालें निकल आई थीं
  rationale: यह जौ के उस विकास-चरण को दर्शाता है जब बाल बन चुकी थी और दाना पकने की ओर था। यह अनुवाद ठोस कृषि-बिंब को बनाए रखता है।
- source_word: גִּבְעֹל
  choice: कलियाँ लग गई थीं
  rationale: यह सन की बढ़ी हुई अवस्था को सूचित करता है, संभवतः कली, फूल या फलियाँ बनने की अवस्था; “कलियाँ लग गई थीं” अनावश्यक अति-सटीकता से बचते हुए मुख्य अर्थ देता है।
