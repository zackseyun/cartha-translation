  text: And the flax and the barley were struck down[b][a], because the barley was in the ear and the flax was in bud.
translation:
  language: hi
  text: अलसी और जौ नष्ट हो गए थे, क्योंकि जौ की बालें निकल आई थीं[a] और अलसी में कलियाँ लग गई थीं[b]।
  philosophy: optimal-equivalence
