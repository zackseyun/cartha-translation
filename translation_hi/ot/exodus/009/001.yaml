review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the divine speech, Pharaoh, the God of the Hebrews, and the imperative to release God's people. However, וְיַעַבְדֻנִי means broadly “that they may serve me”; limiting it to “worship me” narrows the source's meaning.
  naturalness: The Hindi is clear, modern, and suitably dignified. “फ़िरौन के पास जा” and the nested direct speech are natural in this register.
  terminology: “यहोवा” consistently represents יהוה and distinguishes the proper name from “परमेश्वर.” “इब्रानियों” is appropriate. “सेवा करें” is the preferable rendering for עבד here because it retains both religious devotion and belonging/service without reducing the sense to a particular act of worship.
  issues:
  - severity: medium
    issue: “उपासना करें” narrows वְיַעַבְדֻנִי.
    rationale: The Hebrew verb עבד denotes serving God and can include worship, but the immediate contrast is with Israel's service under Pharaoh. “मेरी सेवा करें” preserves the broader intended ambiguity and the Exodus theme.
  revised_text: 'तब यहोवा ने मूसा से कहा, “फ़िरौन के पास जा और उससे कह, ‘इब्रानियों का परमेश्वर यहोवा यों कहता है: मेरी प्रजा को जाने दे, ताकि वे मेरी सेवा करें।’”'
