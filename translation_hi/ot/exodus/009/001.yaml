source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה בֹּ֖א אֶל פַּרְעֹ֑ה וְ/דִבַּרְתָּ֣ אֵלָ֗י/ו כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י הָֽ/עִבְרִ֔ים שַׁלַּ֥ח אֶת עַמִּ֖/י וְ/יַֽעַבְדֻֽ/נִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/001.yaml
  text: 'Then the LORD said to Moses, "Go in to Pharaoh and say to him, ''Thus says the LORD, the God of the Hebrews: Let my people go, so that they may serve me.''"'
translation:
  language: hi
  text: 'तब यहोवा ने मूसा से कहा, “फ़िरौन के पास जा और उससे कह, ‘इब्रानियों का परमेश्वर यहोवा यों कहता है: मेरी प्रजा को जाने दे, ताकि वे मेरी सेवा करें।’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के विशिष्ट नाम को सामान्य उपाधि से अलग रखते हुए हिंदी में प्रचलित रूप दिया गया है।
- source_word: בֹּא אֶל־פַּרְעֹה
  choice: फ़िरौन के पास जा
  rationale: शाब्दिक ‘फ़िरौन के भीतर/यहाँ आ’ हिंदी में अस्वाभाविक है; इस मुहावरे का स्वाभाविक अर्थ उसके पास जाना है।
- source_word: וְדִבַּרְתָּ אֵלָיו
  choice: और उससे कह
  rationale: स्रोत के वचन-सूचक क्रियापद को संक्षिप्त और स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: עִבְרִים
  choice: इब्रानियों
  rationale: इस जातीय नाम का आधुनिक मानक हिंदी रूप।
- source_word: שַׁלַּח אֶת־עַמִּי
  choice: मेरी प्रजा को जाने दे
  rationale: आज्ञार्थक रूप और अधिकारपूर्ण माँग दोनों सुरक्षित हैं।
- source_word: וְיַעַבְדֻנִי
  choice: ताकि वे मेरी उपासना करें
  rationale: עבד यहाँ परमेश्वर के प्रति धार्मिक सेवा/आराधना को सूचित करता है; ‘उपासना करें’ प्रसंग में इसका स्वाभाविक हिंदी रूप है।
theological_decisions:
- issue: ईश्वरीय नाम का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: हिब्रू पाठ में सामान्य उपाधि אֲדֹנָי नहीं, विशिष्ट नाम יהוה है; इसलिए नाम को स्पष्ट रखा गया है।
- issue: עבד का धार्मिक आशय
  choice: उपासना करें
  alternative: सेवा करें
  rationale: ‘सेवा करें’ मूल की व्यापकता को अधिक प्रत्यक्ष रखता, पर फ़िरौन से इस माँग के प्रसंग में धार्मिक उपासना अभिप्रेत है; चयन किसी विशेष अनुष्ठान या संप्रदायगत अर्थ को नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। प्रत्यक्ष कथन के भीतर उद्धरण को स्पष्ट रखा गया है; कोई पादटिप्पणी आवश्यक नहीं है।
