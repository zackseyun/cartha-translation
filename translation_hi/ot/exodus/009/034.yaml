  text: וַ/יַּ֣רְא פַּרְעֹ֗ה כִּֽי חָדַ֨ל הַ/מָּטָ֧ר וְ/הַ/בָּרָ֛ד וְ/הַ/קֹּלֹ֖ת וַ/יֹּ֣סֶף לַ/חֲטֹ֑א וַ/יַּכְבֵּ֥ד לִבּ֖/וֹ ה֥וּא וַ/עֲבָדָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/034.yaml
  text: But when Pharaoh saw that the rain and the hail and the thunder had ceased[a], he continued to sin and hardened his heart, he and his servants.
translation:
  language: hi
  text: पर जब फ़िरौन ने देखा कि वर्षा, ओले और गर्जन रुक गए थे[a], तो उसने फिर पाप किया और अपना हृदय कठोर कर लिया; उसके सेवकों ने भी ऐसा किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ ‘आवाज़ें’ है; इस तूफ़ान के प्रसंग में इसका संकेत बादलों के गर्जन से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: देखा
  rationale: कथात्मक प्रयोग में ראה का सामान्य अर्थ ‘देखना’ है; यहाँ यह परिस्थिति को प्रत्यक्ष देखकर समझ लेने को स्वाभाविक रूप से समेटता है।
- source_word: כִּי חָדַל
  choice: कि ... रुक गए हैं
  rationale: כִּי देखी गई बात की विषय-वस्तु प्रस्तुत करता है और חדל का अर्थ ‘रुकना/समाप्त होना’ है। हिंदी में ‘देखा कि ... रुक गए हैं’ पूर्व क्रिया के परिणाम की उस समय विद्यमान स्थिति को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַמָּטָר וְהַבָּרָד וְהַקֹּלֹת
  choice: वर्षा, ओले और गर्जन
  rationale: מטר और ברד के सीधे अर्थ क्रमशः ‘वर्षा’ और ‘ओले’ हैं। קֹלוֹת का मूल अर्थ ‘आवाज़ें’ है, पर तूफ़ान के इस प्रसंग में यह गर्जन को सूचित करता है।
- source_word: וַיֹּסֶף לַחֲטֹא
  choice: उसने फिर पाप किया
  rationale: יסף + धातुरूप किसी काम को फिर करने या जारी रखने का भाव देता है। प्रसंग में राहत मिलने के बाद अपराध की पुनरावृत्ति प्रमुख है; ‘फिर पाप किया’ इसे संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וַיַּכְבֵּד לִבּוֹ
  choice: अपना हृदय कठोर कर लिया
  rationale: כבד का मूल संबंध भारीपन से है, किंतु निर्गमन के इस आवर्ती मुहावरे में इसका आशय हृदय को हठी या असंवेदनशील बनाना है। ‘हृदय कठोर कर लिया’ विषयगत संबंध बनाए रखता है।
- source_word: הוּא וַעֲבָדָיו
  choice: उसने और उसके सेवकों ने भी
  rationale: עֲבָדָיו राजकीय प्रसंग में फ़िरौन के सेवकों या दरबारियों को दर्शा सकता है। ‘सेवकों’ स्रोत की व्यापकता बनाए रखता है; ‘भी’ अंतिम समन्वित पद के बल को हिंदी में स्पष्ट करता है।
- source_word: וַ
  choice: पर
  rationale: आरंभिक वाव कथा को आगे बढ़ाता है, जबकि निकटवर्ती प्रसंग में फ़िरौन के पिछले पश्चात्ताप और अब के व्यवहार के बीच विरोध भी है; ‘पर’ दोनों को स्वाभाविक रूप से जोड़ता है।
theological_decisions:
- issue: हृदय कठोर करने की कर्तृता और अंतिम बहुवचन पद का विस्तार
  choice: फ़िरौन को अपने हृदय को कठोर करने वाला बताया गया है, और अंतिम पद उसके सेवकों को भी पाप तथा कठोरता की प्रतिक्रिया में सम्मिलित रखता है।
  alternative: ‘उसने और उसके सेवकों ने भी’ को केवल निकटतम ‘कठोर करने’ की क्रिया से जोड़ा जा सकता है, जबकि ‘उसका हृदय’ केवल फ़िरौन का ही है।
  rationale: इब्रानी पहले एकवचन में फ़िरौन के फिर पाप करने और अपना हृदय कठोर करने की बात कहती है, फिर ‘वह और उसके सेवक’ जोड़ती है। हिंदी में डैश सहित अंतिम पद मूल की कुछ संक्षिप्तता और संभावित व्याप्ति बनाए रखता है, बिना इस पद से परे ईश्वरीय और मानवीय कर्तृता के प्रश्न को सुलझाए।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण किंतु सहज कथात्मक रूप। ‘फ़िरौन’, ‘वर्षा’, ‘गर्जन’, ‘पाप’ और ‘हृदय कठोर’ जैसे परिचित बाइबलीय शब्द रखे गए हैं। अंतिम डैश इब्रानी के संक्षिप्त ‘वह और उसके सेवक’ को उभारता है और उसकी व्याकरणिक व्याप्ति को आवश्यकता से अधिक निश्चित नहीं करता।
