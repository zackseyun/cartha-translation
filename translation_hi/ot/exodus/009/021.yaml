  text: But whoever did not pay attention to the word of Yahweh left his servants and his livestock in the field[a].
translation:
  language: hi
  text: परन्तु जिसने याहवे के वचन पर ध्यान नहीं दिया, उसने अपने सेवकों और पशुधन को खेत में छोड़ दिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “याहवे के वचन की ओर अपना मन नहीं लगाया,” अर्थात् उसे गंभीरता से नहीं लिया।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲשֶׁר
  choice: परन्तु जिसने
  rationale: पूर्व पद में चेतावनी मानने वालों के विपरीत समूह को दर्शाता है और अनिश्चित सम्बन्धवाचक अर्थ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: לֹא שָׂם לִבּוֹ אֶל
  choice: पर ध्यान नहीं दिया
  rationale: शाब्दिक मुहावरा ‘अपना हृदय ... की ओर न लगाया’ है; प्रसंग में इसका अर्थ चेतावनी को गंभीरता से न लेना या उस पर ध्यान न देना है।
- source_word: דְּבַר יְהוָה
  choice: यहोवा के वचन
  rationale: דָּבָר यहाँ यहोवा द्वारा कही गई चेतावनी को सूचित करता है; ‘वचन’ मानक बाइबलीय अभिव्यक्ति है और ‘संदेश’ की अपेक्षा मूल शब्द के रूप को अधिक निकटता से रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय ईश-नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नाम-रूप ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: וַיַּעֲזֹב
  choice: छोड़ दिया
  rationale: यहाँ क्रिया सेवकों और पशुओं को आने वाले ओलों के सामने मैदान में रहने देने की ठोस क्रिया बताती है।
- source_word: עֲבָדָיו
  choice: अपने सेवकों
  rationale: עֶבֶד दास या सेवक दोनों को सूचित कर सकता है; इस प्रसंग में सामाजिक दर्जे के बजाय घराने के अधीन काम करने वालों को बाहर छोड़े जाने पर बल है।
- source_word: מִקְנֵהוּ
  choice: पशुओं
  rationale: यह सामूहिक संज्ञा पाले हुए पशुधन को सूचित करती है; सहज हिन्दी में ‘पशुओं’ स्पष्ट और व्यापक है।
- source_word: בַּשָּׂדֶה
  choice: मैदान में ही
  rationale: स्थानवाचक अर्थ को सीधा रखा गया है; ‘ही’ पिछले पद में उन्हें सुरक्षित स्थान पर ले जाने के विपरीत, वहीं छोड़ दिए जाने पर स्वाभाविक बल देता है।
theological_decisions:
- issue: ईश-नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत ईश-नाम है, इसलिए ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया। आधुनिक हिन्दी बाइबल-पाठकों में पहचाने जाने वाले नाम-रूप ‘यहोवा’ को चुना गया; ‘याहवे’ अधिक निकट लिप्यन्तरण है।
- issue: ‘हृदय लगाने’ वाले इब्रानी मुहावरे का अर्थ
  choice: पर ध्यान नहीं दिया
  alternative: उस वचन को मन में नहीं लगाया
  rationale: मुख्य पाठ में व्यवहारगत अर्थ को स्पष्ट और स्वाभाविक रखा गया, जबकि मुहावरे की शाब्दिक छवि और गंभीरता से न लेने का भाव पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘परन्तु’ कथात्मक विरोध को स्पष्ट करता है। ‘वचन’ बाइबलीय पदावली को बनाए रखता है, और पादटिप्पणी इब्रानी हृदय-मुहावरे की मूल छवि सुरक्षित करती है।
