  text: וְ/לֹֽא יָכְל֣וּ הַֽ/חַרְטֻמִּ֗ים לַ/עֲמֹ֛ד לִ/פְנֵ֥י מֹשֶׁ֖ה מִ/פְּנֵ֣י הַ/שְּׁחִ֑ין כִּֽי הָיָ֣ה הַ/שְּׁחִ֔ין בַּֽ/חֲרְטֻמִּ֖ם וּ/בְ/כָל מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/011.yaml
  text: And the magicians were not able to stand before Moses because of the boils[a], for the boils were on the magicians and on all the Egyptians.
translation:
  language: hi
  text: और फोड़ों के कारण जादूगर मूसा के सामने खड़े न हो सके, क्योंकि फोड़े जादूगरों और मिस्र के सभी लोगों पर निकले थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַחַרְטֻמִּים
  choice: जादूगर
  rationale: निर्गमन के प्रसंग में यह शब्द फ़िरौन के उन अनुष्ठानिक विशेषज्ञों के लिए है जो मूसा और हारून का विरोध या उनकी नकल करते हैं। आधुनिक हिन्दी में ‘जादूगर’ इसका सबसे स्पष्ट और प्रचलित समतुल्य है।
- source_word: לַעֲמֹד לִפְנֵי מֹשֶׁה
  choice: मूसा के सामने खड़े न रह सके
  rationale: यह मूल इब्रानी मुहावरे के निकट है और प्रसंग में उनके मूसा के सामने उपस्थित होकर टिक न सकने का स्वाभाविक अर्थ देता है।
- source_word: מִפְּנֵי הַשְּׁחִין
  choice: फोड़ों के कारण
  rationale: מִפְּנֵי यहाँ कारण बताता है। एकवचन सामूहिक שְׁחִין को हिन्दी में इस त्वचा-व्याधि के लिए स्वाभाविक बहुवचन ‘फोड़े’ से व्यक्त किया गया है।
- source_word: הַשְּׁחִין
  choice: फोड़े
  rationale: यह सूजनयुक्त त्वचा-विस्फोट को दर्शाता है; अनेक व्यक्तियों पर निकले घावों के सामूहिक अर्थ को हिन्दी बहुवचन स्पष्ट और सहज ढंग से व्यक्त करता है।
- source_word: בַּחֲרְטֻמִּם
  choice: जादूगरों पर निकले हुए थे
  rationale: בְּ को शारीरिक पीड़ा के प्रसंग में ‘पर’ के रूप में लिया गया है; ‘निकले हुए थे’ हिन्दी में फोड़ों के शरीर पर होने की स्वाभाविक अभिव्यक्ति है।
- source_word: וּבְכָל מִצְרַיִם
  choice: और पूरे मिस्र के लोगों पर
  rationale: मूल पाठ अक्षरशः ‘और पूरे मिस्र में’ कहता है, पर जादूगरों के साथ समानांतर रचना और शारीरिक रोग का प्रसंग लोगों को निहित संदर्भ बनाते हैं। हिन्दी में इसे स्पष्ट करने से आशय स्वाभाविक रहता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘खड़े न रह सके’ मूल की संरचना और उनकी शारीरिक असमर्थता दोनों को बनाए रखता है। अंतिम वाक्यांश में अक्षरशः भौगोलिक अभिव्यक्ति के निहित मानवीय संदर्भ को मुख्य पाठ में स्पष्ट किया गया है; इसलिए अलग पाद-टिप्पणी आवश्यक नहीं मानी गई।
