  text: Whoever among Pharaoh’s servants feared the word of Yahweh hurried his servants and his livestock into the houses[a][b].
translation:
  language: hi
  text: फ़िरौन के सेवकों में से जो याहवे के वचन से डरता था, उसने अपने सेवकों और पशुधन को शीघ्र घरों में पहुँचा दिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ ‘भागने को विवश किया’ है; अर्थात उसने उन्हें शीघ्र आश्रय में पहुँचा दिया।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיָּרֵא
  choice: जो कोई ... डरता था
  rationale: संज्ञात्मक कृदंत उस वर्ग के प्रत्येक व्यक्ति की ओर संकेत करता है जिसने भय माना; आधुनिक हिन्दी में ‘जो कोई’ इस भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: דְּבַר יְהוָה
  choice: यहोवा के वचन
  rationale: ‘वचन’ דָּבָר के सामान्य अर्थ और प्रचलित बाइबलीय पदबंध को बनाए रखता है; ‘चेतावनी’ प्रसंगानुकूल होते हुए भी मूल से अधिक संकीर्ण है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल में प्रयुक्त परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण द्वारा रखा गया है।
- source_word: מֵעַבְדֵי פַרְעֹה
  choice: फ़िरौन के सेवकों में से
  rationale: מִן यहाँ समूह में से एक अंश को सूचित करता है; ‘में से’ इस अंशवाचक अर्थ को स्पष्ट रखता है।
- source_word: הֵנִיס
  choice: झटपट ... पहुँचा दिया
  rationale: נוּס के हिफ़ील रूप का शाब्दिक भाव ‘भगा दिया/पलायन कराया’ है। इस प्रसंग में आश्रय के लिए तत्काल भीतर ले जाने का भाव स्वाभाविक हिन्दी में व्यक्त किया गया है, और शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: עֲבָדָיו
  choice: अपने सेवकों
  rationale: עֶבֶד सेवक या दास दोनों अर्थ दे सकता है; यहाँ फ़िरौन के अधिकारियों के अधीन घरेलू कर्मियों पर ध्यान है, इसलिए ‘सेवक’ प्रसंगानुकूल और पर्याप्त व्यापक है।
- source_word: מִקְנֵהוּ
  choice: पशुधन
  rationale: מִקְנֶה पाले हुए संपत्ति-पशुओं के व्यापक वर्ग को दर्शाता है; ‘मवेशी’ कभी-कभी अपेक्षाकृत संकीर्ण समझा जाता है।
- source_word: אֶל הַבָּתִּים
  choice: घरों के भीतर
  rationale: पूर्वसर्ग गति की दिशा और बहुवचन संज्ञा अनेक आश्रय-भवनों को दर्शाती है; ‘घरों के भीतर’ दोनों बातों को स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: नाम को ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया। आधुनिक हिन्दी बाइबल-पाठकों के लिए परिचित ‘यहोवा’ व्यक्तिगत नाम को स्पष्ट रखता है, यद्यपि ‘याहवे’ भी विद्वत्तापूर्ण लिप्यंतरण है।
- issue: ‘यहोवा के वचन से डरना’ का अर्थ
  choice: डरता था
  alternative: आदर करता था / मानता था
  rationale: मूल ירא के भय-संबंधी अर्थ और कथानक की गंभीरता को बनाए रखा गया है; इसे केवल श्रद्धा या आज्ञापालन बनाकर धार्मिक तनाव को हल नहीं किया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘जो कोई’ वर्ग-सूचक कृदंत को व्यक्त करता है; ‘झटपट’ मूल क्रिया की तात्कालिकता रखता है। मुख्य पाठ में प्रत्येक पादटिप्पणी-चिह्न उपस्थित है।
