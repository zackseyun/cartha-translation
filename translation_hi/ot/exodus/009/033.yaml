source:
  edition: WLC
  text: וַ/יֵּצֵ֨א מֹשֶׁ֜ה מֵ/עִ֤ם פַּרְעֹה֙ אֶת הָ/עִ֔יר וַ/יִּפְרֹ֥שׂ כַּפָּ֖י/ו אֶל יְהוָ֑ה וַֽ/יַּחְדְּל֤וּ הַ/קֹּלוֹת֙ וְ/הַ/בָּרָ֔ד וּ/מָטָ֖ר לֹא נִתַּ֥ךְ אָֽרְצָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/033.yaml
  text: So Moses went out from Pharaoh[a], out of the city, and spread out his hands to Yahweh; and the thunder and the hail ceased[b], and rain was no longer poured down on the earth.
translation:
  language: hi
  text: तब मूसा फ़िरौन के पास से निकलकर नगर से बाहर गया और उसने याहवे की ओर अपने हाथ फैलाए। तब गरज[a] और ओले थम गए, और वर्षा धरती पर नहीं उंडेली गई।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “आवाज़ें”; इस तूफ़ान के प्रसंग में इसका अर्थ बादल की गरज है।
    reason: lexical_alternative
  - marker: b
    text: या, “वर्षा भूमि पर नहीं बरसी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא מֹשֶׁה מֵעִם פַּרְעֹה אֶת הָעִיר
  choice: मूसा फ़िरौन के पास से निकलकर नगर से बाहर गया
  rationale: מֵעִם फ़िरौन की उपस्थिति से अलग होने को व्यक्त करता है, और אֶת הָעִיר यहाँ गति के संदर्भ में नगर से बाहर जाने का भाव देता है। हिंदी वाक्य में दोनों चरण स्वाभाविक और स्पष्ट रखे गए हैं।
- source_word: וַיִּפְרֹשׂ כַּפָּיו
  choice: उसने ... अपने हाथ फैलाए
  rationale: शाब्दिक चित्र हथेलियाँ/हाथ फैलाने का है और यह प्रार्थना की मुद्रा सूचित करता है; अनुवाद क्रिया को स्पष्ट किए बिना शारीरिक बिंब बनाए रखता है।
- source_word: אֶל יְהוָה
  choice: याहवे की ओर
  rationale: אֶל दिशा का बोध कराता है, और याहवे स्रोत-पाठ में आए परमेश्वर के निज नाम का सीधा लिप्यंतरण है।
- source_word: הַקֹּלוֹת
  choice: गरज
  rationale: इस तूफ़ानी प्रसंग में बहुवचन शब्द का शाब्दिक अर्थ 'आवाज़ें' है, पर उसका मौसम-संबंधी आशय बादल की गरज है।
- source_word: וַיַּחְדְּלוּ הַקֹּלוֹת וְהַבָּרָד
  choice: गरज और ओले थम गए
  rationale: חדל रुकने या समाप्त होने को बताता है। 'थम गए' मौसम की घटनाओं के लिए स्वाभाविक, गरिमापूर्ण हिंदी है।
- source_word: וּמָטָר לֹא נִתַּךְ אָרְצָה
  choice: वर्षा फिर धरती पर नहीं उंडेली गई
  rationale: נתך का निफ़अल रूप वर्षा के उंडेले जाने का निष्क्रिय बिंब रखता है; 'फिर ... नहीं' पूर्व में जारी वर्षा के रुक जाने का प्रसंगगत भाव व्यक्त करता है, जबकि אָרְצָה की नीचे/भूमि की ओर दिशा 'धरती पर' से आती है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: इब्रानी पाठ में वाचा-संबंधी निज नाम सीधे आया है। 'याहवे' उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है; 'प्रभु' नाम को उपाधि में बदल देता, जबकि 'यहोवा' एक बाद की मिश्रित उच्चारण-परंपरा को दर्शाता है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, कथात्मक और गरिमापूर्ण रखी गई है। 'फ़िरौन', 'नगर', 'वर्षा' और 'धरती' सामान्य पाठक के लिए स्पष्ट हैं। प्रार्थना की मुद्रा और वर्षा के उंडेले जाने का मूल बिंब यथासंभव सुरक्षित रखा गया है।
