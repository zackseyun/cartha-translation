  yaml_path: translation/ot/exodus/009/007.yaml
  text: Pharaoh sent[a], and behold, not even one of Israel’s livestock had died. But Pharaoh’s heart was heavy[b], and he did not let the people go.
translation:
  language: hi
  text: फ़िरौन ने जाँच करने के लिए लोगों को भेजा[a], और पता चला कि इस्राएल के पशुधन में से एक भी नहीं मरा था। फिर भी फ़िरौन का मन कठोर हो गया[b], और उसने लोगों को जाने नहीं दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में केवल “भेजा” है; प्रसंग से आशय जाँच कराने के लिए लोगों को भेजना है।
    reason: implicit_object
  - marker: b
    text: हिब्रू में शाब्दिक अर्थ “फ़िरौन का हृदय भारी हो गया” है—यह अड़ियल या कठोर हो जाने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: पता लगाने के लिए लोगों को भेजा
  rationale: שׁלח का मूल अर्थ ‘भेजना’ है; प्रसंग में फ़िरौन जाँच कराने के लिए लोगों को भेजता है। हिन्दी में कर्म और प्रयोजन स्पष्ट करना स्वाभाविक है, जबकि पादटिप्पणी हिब्रू की संक्षिप्तता बताती है।
- source_word: וְהִנֵּה
  choice: और देखा कि
  rationale: הִנֵּה खोजे गए तथ्य की ओर ध्यान खींचता है। ‘देखा कि’ आधुनिक हिन्दी में कथात्मक सजीवता और परिणाम-बोध देता है।
- source_word: לֹא מֵת מִמִּקְנֵה יִשְׂרָאֵל עַד אֶחָד
  choice: इस्राएल के पशुओं में से एक भी नहीं मरा था
  rationale: עַד אֶחָד का बल ‘एक भी नहीं’ से व्यक्त होता है; पूर्व जाँच के परिणाम के कारण ‘मरा था’ उपयुक्त है।
- source_word: מִקְנֶה
  choice: पशु
  rationale: यह व्यापक रूप से पालतू पशुधन को सूचित करता है; ‘पशु’ सामान्य पाठक के लिए सहज है और इसे केवल गाय-बैल तक सीमित नहीं करता।
- source_word: וַיִּכְבַּד לֵב פַּרְעֹה
  choice: फ़िरौन का मन अड़ा रहा
  rationale: शाब्दिक रूप से ‘फ़िरौन का हृदय भारी हो गया।’ इस प्रसंग में मुहावरे का आशय हठ या कठोरता है। ‘मन अड़ा रहा’ स्वाभाविक हिन्दी में उसकी अडिग हठधर्मिता व्यक्त करता है, बिना किसी बाहरी कर्ता को जोड़ने के।
- source_word: וְלֹא שִׁלַּח אֶת הָעָם
  choice: और उसने लोगों को जाने नहीं दिया
  rationale: निर्गमन के इस प्रसंग में שׁלח का अर्थ लोगों को मुक्त करके जाने देना है; यह हिन्दी में स्थापित और स्पष्ट अभिव्यक्ति है।
theological_decisions:
- issue: फ़िरौन के मन के कठोर होने में कर्तृत्व
  choice: फ़िरौन का मन अड़ा रहा
  alternative: फ़िरौन का मन कठोर कर दिया गया / फ़िरौन ने अपना मन कठोर किया
  rationale: हिब्रू में फ़िरौन का मन व्याकरणिक कर्ता है और किसी बाहरी कर्ता का उल्लेख नहीं है। चुना हुआ पाठ उसके हठ की अवस्था बताता है, पर यह निर्धारित नहीं करता कि उसे किसने कठोर किया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य हिन्दी। ‘फ़िरौन’ और ‘इस्राएल’ प्रचलित बाइबलीय नामरूप हैं। ‘हृदय भारी’ का हिन्दी में प्रायः दुःख का अर्थ निकलता, इसलिए मुख्य पाठ में प्रसंगानुकूल ‘मन अड़ा रहा’ रखा गया और शाब्दिक रूप पादटिप्पणी में दिया गया।
