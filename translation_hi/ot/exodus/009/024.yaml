  text: וַ/יְהִ֣י בָרָ֔ד וְ/אֵ֕שׁ מִתְלַקַּ֖חַת בְּ/ת֣וֹךְ הַ/בָּרָ֑ד כָּבֵ֣ד מְאֹ֔ד אֲ֠שֶׁר לֹֽא הָיָ֤ה כָמֹ֨/הוּ֙ בְּ/כָל אֶ֣רֶץ מִצְרַ֔יִם מֵ/אָ֖ז הָיְתָ֥ה לְ/גֽוֹי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/024.yaml
  text: There was hail[a], and fire flashing within the hail, very severe—such as had never been in all the land of Egypt since it became a nation.
translation:
  language: hi
  text: तब ओले पड़े[a], और ओलों के बीच आग कौंध रही थी। वह ओलावृष्टि बहुत भयंकर थी—जब से मिस्र एक राष्ट्र बना था, तब से पूरे मिस्र देश में ऐसी ओलावृष्टि कभी नहीं हुई थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और आग ओलों के बीच लपक रही थी”; इब्रानी में शाब्दिक शब्द “आग” है, जो संभवतः तूफ़ान के भीतर बिजली जैसी कौंध का वर्णन करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בָרָד
  choice: तब ओले पड़े
  rationale: कथात्मक וַיְהִי घटना को आगे बढ़ाता है; हिंदी में ‘तब ओले पड़े’ अस्तित्वगत कथन को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְאֵשׁ
  choice: और ... आग
  rationale: मूल शब्द का सीधा अर्थ ‘आग’ है। मुख्य पाठ में इसी सजीव बिंब को रखा गया है, यद्यपि प्रसंग में यह बिजली जैसी कौंध का वर्णन कर सकता है।
- source_word: מִתְלַקַּחַת בְּתוֹךְ הַבָּרָד
  choice: ओलों के बीच आग कौंध रही थी
  rationale: हित्पअेल कृदंत आग की गतिशील, बार-बार चमकती क्रिया दिखाता है; ‘कौंध रही थी’ इसे सहज आधुनिक हिंदी में व्यक्त करता है और בְּתוֹךְ का ‘बीच’ सुरक्षित रखता है।
- source_word: כָּבֵד מְאֹד
  choice: इतनी भयंकर
  rationale: शाब्दिक ‘बहुत भारी’ तूफ़ान के संदर्भ में तीव्रता का मुहावरा है; ‘भयंकर’ प्राकृतिक हिंदी में उसकी अत्यधिक प्रचंडता बताता है। स्त्रीलिंग संकेत पूरी घटना/मार की ओर समझा जाता है।
- source_word: אֲשֶׁר לֹא הָיָה כָמֹהוּ
  choice: ऐसी कभी नहीं हुई थी
  rationale: तुलनात्मक कथन उस घटना की अभूतपूर्व तीव्रता व्यक्त करता है; हिंदी में यह संरचना उसी अर्थ को स्पष्ट और संक्षिप्त रखती है।
- source_word: בְּכָל אֶרֶץ מִצְרַיִם
  choice: पूरे मिस्र देश में
  rationale: यह पूरे भौगोलिक क्षेत्र को सूचित करता है; ‘पूरे मिस्र देश में’ आधुनिक हिंदी में स्वाभाविक है।
- source_word: מֵאָז הָיְתָה לְגוֹי
  choice: जब से मिस्र एक राष्ट्र बना था
  rationale: स्त्रीलिंग क्रिया का संदर्भ भूमि/देश से है और לְגוֹי राष्ट्र के रूप में अस्तित्व में आने का ऐतिहासिक बिंदु बताता है। स्पष्टता के लिए सर्वनाम के स्थान पर ‘मिस्र’ दोहराया गया है।
