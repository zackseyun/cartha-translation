- source_word: לְבִלְתִּי
  choice: और ... नहीं
  rationale: नकारात्मक infinitival खंड बताता है कि फ़िरौन का घमंडी विरोध उन्हें न छोड़ने में प्रकट होता है। हिन्दी में समन्वित रचना स्वाभाविक और स्पष्ट है।
- source_word: שַׁלְּחָם
  choice: उन्हें जाने दे रहा
