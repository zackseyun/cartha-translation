source:
  edition: WLC
  text: וַ/יֵּ֨ט מֹשֶׁ֣ה אֶת מַטֵּ/הוּ֮ עַל הַ/שָּׁמַיִם֒ וַֽ/יהוָ֗ה נָתַ֤ן קֹלֹת֙ וּ/בָרָ֔ד וַ/תִּ֥הֲלַךְ אֵ֖שׁ אָ֑רְצָ/ה וַ/יַּמְטֵ֧ר יְהוָ֛ה בָּרָ֖ד עַל אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/023.yaml
  text: So Moses stretched out his staff toward the sky[a], and Yahweh sent thunder and hail, and fire came down to the earth. And Yahweh rained hail on the land of Egypt.
translation:
  language: hi
  text: तब मूसा ने अपनी लाठी आकाश की ओर बढ़ाई, और याहवे ने गर्जन और ओले भेजे; और आग धरती की ओर गई[a]। और याहवे ने मिस्र की भूमि पर ओले बरसाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: तूफ़ान के प्रसंग में “आग” संभवतः बिजली का संकेत है; मूल पाठ में “आग” है।
    reason: मूल की शाब्दिक छवि को मुख्य पाठ में बनाए रखते हुए तूफ़ानी संदर्भ में संभावित अर्थ स्पष्ट करना।
lexical_decisions:
- source_word: וַיֵּט
  choice: बढ़ाई
  rationale: נטה यहाँ लाठी को किसी दिशा में फैलाने या बढ़ाने की क्रिया बताता है; हिंदी में “आकाश की ओर बढ़ाई” स्वाभाविक और प्रसंगानुकूल है।
- source_word: מַטֵּהוּ
  choice: अपनी लाठी
  rationale: מַטֶּה के लिए “लाठी” आधुनिक हिंदी में स्पष्ट है और मूसा के हाथ में प्रयुक्त साधन के अर्थ को ठीक से व्यक्त करता है।
- source_word: עַל הַשָּׁמַיִם
  choice: आकाश की ओर
  rationale: इस प्रसंग में עַל दिशात्मक अर्थ देता है; “आकाश की ओर” ऊपर की दिशा में लाठी बढ़ाने की क्रिया को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिंदी में प्रचलित नामरूप “यहोवा” रखा गया है।
- source_word: נָתַן קֹלֹת וּבָרָד
  choice: गरज और ओले भेजे
  rationale: נתן का शाब्दिक अर्थ “दिया” है, पर मौसम के इस प्रसंग में “भेजे” स्वाभाविक है; קֹלֹת तूफ़ानी संदर्भ में गर्जन को सूचित करता है।
- source_word: קֹלֹת
  choice: गरज
  rationale: शाब्दिक “आवाज़ें” के बजाय तूफ़ान के संदर्भ में “गरज” अभिप्रेत मौसम-संबंधी अर्थ स्पष्ट करती है।
- source_word: וַתִּהֲלַךְ אֵשׁ אָרְצָה
  choice: आग धरती की ओर चली
  rationale: यह अनुवाद “आग” की मूल छवि और אָרְצָה की दिशात्मकता दोनों बचाता है, जबकि संभवतः बिजली का संकेत होने पर भी उसे मुख्य पाठ में व्याख्यात्मक रूप से प्रतिस्थापित नहीं करता।
- source_word: וַיַּמְטֵר
  choice: बरसाए
  rationale: מטר के हिफ़ील रूप का अर्थ बरसाना या बरसने देना है; ओलों के साथ “ओले बरसाए” सहज हिंदी है।
- source_word: אֶרֶץ מִצְרָיִם
  choice: मिस्र देश
  rationale: इब्रानी में “मिस्र का देश/भूमि” स्पष्ट है; “मिस्र देश” भौगोलिक विस्तार को बनाए रखते हुए संक्षिप्त और स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है, इसलिए उसे “प्रभु” जैसी उपाधि से नहीं बदला गया। आधुनिक हिंदी पाठकों के लिए सुविदित नामरूप “यहोवा” चुना गया; “याहवे” अधिक प्रत्यक्ष विद्वत्तापरक लिप्यंतरण है।
- issue: אֵשׁ को मौसम-संबंधी घटना के रूप में समझना
  choice: आग
  alternative: बिजली
  rationale: तूफ़ान के प्रसंग में इसका संकेत संभवतः बिजली की ओर है, फिर भी मूल शब्द स्पष्टतः “आग” है। इसलिए मूल रूपक मुख्य पाठ में रखा गया और संभावित संदर्भार्थ पादटिप्पणी में बताया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्य-विन्यास इब्रानी घटनाक्रम को बनाए रखता है, पर हिंदी की पठनीयता के लिए एक लंबे समन्वित वाक्य को दो वाक्यों में बाँटा गया है।
