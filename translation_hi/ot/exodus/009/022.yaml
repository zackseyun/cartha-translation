id: EXO.9.22
reference: Exodus 9:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁה נְטֵ֤ה אֶת יָֽדְ/ךָ֙ עַל הַ/שָּׁמַ֔יִם וִ/יהִ֥י בָרָ֖ד בְּ/כָל אֶ֣רֶץ מִצְרָ֑יִם עַל הָ/אָדָ֣ם וְ/עַל הַ/בְּהֵמָ֗ה וְ/עַ֛ל כָּל עֵ֥שֶׂב הַ/שָּׂדֶ֖ה בְּ/אֶ֥רֶץ מִצְרָֽיִם־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/022.yaml
  text: Then Yahweh said to Moses[a], “Stretch out your hand toward the sky[b], so that hail may come over all the land of Egypt—on man and on beast and on every plant of the field in the land of Egypt.”
translation:
  language: hi
  text: तब याहवे ने मूसा से कहा, “अपना हाथ आकाश[a] की ओर बढ़ा, ताकि मिस्र के सारे देश में ओले पड़ें—मनुष्यों[b] पर, पशुओं पर और मिस्र देश में खेत के हर पौधे पर।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “स्वर्ग की ओर।” इब्रानी शब्द का अर्थ “आकाश” या “स्वर्ग” हो सकता है; यहाँ प्रसंग उस दिखाई देने वाले आकाश का है जहाँ से ओले आते हैं।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शब्द एकवचन है, पर यहाँ उसका अर्थ सामान्य रूप से सभी मनुष्य हैं, जिन्हें पशुओं से अलग बताया गया है।
    reason: lexical_clarification
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय हिन्दी में उसके प्रचलित निकट लिप्यंतरण से व्यक्त किया गया है।
- source_word: נְטֵה אֶת יָדְךָ
  choice: अपना हाथ ... बढ़ा
  rationale: आज्ञार्थक क्रिया נטה का स्वाभाविक हिन्दी अर्थ ‘बढ़ाना/फैलाना’ है; इस संकेतात्मक क्रिया के लिए ‘हाथ बढ़ा’ स्पष्ट और सहज है।
- source_word: עַל הַשָּׁמַיִם
  choice: आकाश की ओर
  rationale: עַל यहाँ दिशा बताता है और שָׁמַיִם ओले आने वाले दिखाई देने वाले आकाश को सूचित करता है।
- source_word: וִיהִי בָרָד
  choice: ताकि ... ओले पड़ें
  rationale: आज्ञा के बाद आया यह रूप अपेक्षित परिणाम व्यक्त करता है। हिन्दी में मौसम-संबंधी स्वाभाविक अभिव्यक्ति ‘ओले पड़ें’ है।
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: मिस्र के सारे देश में
  rationale: בְּכָל की व्यापकता और אֶרֶץ की भौगोलिक भूमि/देश की धारणा दोनों सुरक्षित रहती हैं।
- source_word: הָאָדָם
  choice: मनुष्यों
  rationale: एकवचन सामूहिक संज्ञा यहाँ पशुओं के विपरीत मानव-जाति के लोगों को सामान्य रूप से दर्शाती है; हिन्दी बहुवचन अर्थ को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: הַבְּהֵמָה
  choice: पशुओं
  rationale: यह व्यापक शब्द इस प्रसंग में घरेलू पशुओं को समेटता है; ‘पशु’ हिन्दी में संक्षिप्त और पर्याप्त व्यापक है।
- source_word: כָּל עֵשֶׂב הַשָּׂדֶה
  choice: खेत के हर पौधे
  rationale: עֵשֶׂב घास, जड़ी-बूटी या अन्य वनस्पति के लिए प्रयुक्त हो सकता है। ‘हर पौधा’ इस व्यापकता को साधारण आधुनिक हिन्दी में रखता है।
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: मिस्र देश में
  rationale: मूल पाठ में स्थान का दोहराव जोर और दायरा स्पष्ट करता है, इसलिए इसे अनावश्यक समझकर हटाया नहीं गया।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में प्रयुक्त व्यक्तिगत नाम को सुरक्षित रखने के लिए निकट लिप्यंतरण चुना गया है; उसे किसी उपाधि से नहीं बदला गया।
- issue: הָאָדָם का सामूहिक अर्थ
  choice: मनुष्यों
  alternative: मनुष्य; मानवजाति
  rationale: शब्द रूपतः एकवचन है, पर यहाँ पशुओं के साथ तुलना में सभी मानव प्राणियों का प्रतिनिधिक-सामूहिक अर्थ रखता है। ‘मनुष्यों’ से आधुनिक हिन्दी में यह आशय बिना लिंगगत भ्रम के स्पष्ट होता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। मूल के आदेश-परिणाम संबंध, तीन बार आए ‘पर’ के प्रभाव और ‘मिस्र देश’ की पुनरावृत्ति को सुरक्षित रखा गया है। फुटनोट-चिह्न संबंधित शब्दों के बाद लगाए गए हैं।
