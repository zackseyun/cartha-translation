base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/035.yaml
  text: So Pharaoh’s heart was hardened[a], and he did not let the sons of Israel go[c][b], just as Yahweh had spoken through Moses.
translation:
  language: hi
  text: इस प्रकार फ़िरौन का मन कठोर हो गया[a], और उसने इस्राएलियों को जाने नहीं दिया, ठीक वैसे ही जैसे यहोवा ने मूसा के द्वारा कहा था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “फ़िरौन का मन दृढ़ हो गया।” हिब्रू क्रिया का मूल भाव “मजबूत/दृढ़ हो जाना” है; यहाँ यह हठपूर्वक कठोर होने के अर्थ में है।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक रूप से “मूसा के हाथ से”; यह हिब्रू मुहावरा “मूसा के द्वारा” के अर्थ में है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱזַק
  choice: कठोर हो गया
  rationale: חזק का मूल भाव मजबूत या दृढ़ होना है; विपत्तियों के इस प्रसंग में यह फ़िरौन के हठी प्रतिरोध को व्यक्त करता है। 'कठोर हो गया' स्वाभाविक हिन्दी में इस भाव को रखता है और यह स्पष्ट नहीं करता कि उसे किसने कठोर किया।
- source_word: לֵב פַּרְעֹה
  choice: फ़िरौन का मन
  rationale: हिब्रू में 'हृदय' इच्छा, विचार और निश्चय के भीतरी केंद्र को सूचित करता है। आधुनिक हिन्दी में इस प्रसंग में 'मन' अधिक स्वाभाविक है और फ़िरौन की भीतरी प्रवृत्ति तथा संकल्प को व्यक्त करता है।
- source_word: שִׁלַּח
  choice: जाने नहीं दिया
  rationale: निर्गमन के प्रसंग में यह क्रिया इस्राएल को प्रस्थान की अनुमति देने के अर्थ में आती है; 'जाने दिया' स्पष्ट और प्रचलित हिन्दी है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: शाब्दिक रूप 'इस्राएल के पुत्र' है, पर यहाँ पूरी जाति सामूहिक रूप से अभिप्रेत है। 'इस्राएलियों' में स्त्री और पुरुष दोनों स्वाभाविक रूप से सम्मिलित हैं और आधुनिक पाठक के लिए स्पष्ट है।
- source_word: כַּאֲשֶׁר
  choice: ठीक वैसे ही जैसे
  rationale: यह पहले कहे गए दिव्य वचन और घटना के बीच सटीक अनुरूपता दिखाता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम को हिन्दी में प्रचलित लिप्यंतरण 'यहोवा' से रखा गया है, न कि किसी उपाधि से बदला गया है।
- source_word: בְּיַד מֹשֶׁה
  choice: मूसा के द्वारा
  rationale: शाब्दिक अर्थ 'मूसा के हाथ से' है; यह माध्यम या अभिकरण का हिब्रू मुहावरा है। 'मूसा के द्वारा' आधुनिक हिन्दी में उसका आशय स्पष्ट करता है।
theological_decisions:
- issue: फ़िरौन के मन के कठोर होने में कर्तृत्व
  choice: फ़िरौन का मन कठोर हो गया
  alternative: फ़िरौन ने अपना मन कठोर कर लिया / फ़िरौन का मन कठोर किया गया
  rationale: इस पद की हिब्रू क्रिया मन के मजबूत या कठोर हो जाने को बताती है, पर यहाँ न तो फ़िरौन को स्पष्ट रूप से स्वयं कर्ता बताती है, न परमेश्वर को प्रत्यक्ष कर्ता। चुना हुआ रूप इस कारणगत अस्पष्टता और व्यापक कथा के धर्मवैज्ञानिक तनाव को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज हिन्दी रखी गई है। 'मन कठोर हो गया' कारण का अनावश्यक निर्धारण किए बिना हिब्रू की अस्पष्टता बनाए रखता है; 'इस्राएलियों' सामूहिक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
