  text: הִנֵּ֨ה יַד יְהוָ֜ה הוֹיָ֗ה בְּ/מִקְנְ/ךָ֙ אֲשֶׁ֣ר בַּ/שָּׂדֶ֔ה בַּ/סּוּסִ֤ים בַּֽ/חֲמֹרִים֙ בַּ/גְּמַלִּ֔ים בַּ/בָּקָ֖ר וּ/בַ/צֹּ֑אן דֶּ֖בֶר כָּבֵ֥ד מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/003.yaml
  text: Look[a], the hand of Yahweh will come upon your livestock that are in the field—upon the horses, the donkeys, the camels, the herds, and the flocks—with a very severe plague.
translation:
  language: hi
  text: देखो, यहोवा का हाथ तुम्हारे उन पशुओं पर पड़ेगा जो खेत में हैं—घोड़ों, गधों, ऊँटों, गाय-बैलों और भेड़-बकरियों पर—और उन पर अत्यन्त भयंकर महामारी आएगी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पशु-मरी’; इब्रानी शब्द पशुओं को प्रभावित करने वाली घातक महामारी को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: सुनो
  rationale: यह ध्यान खींचने वाला उद्घोष है। प्रसंग में आने वाली घोषणा पर तत्काल ध्यान दिलाने के लिए आधुनिक हिन्दी में ‘सुनो’ स्वाभाविक है।
- source_word: יַד יְהוָה
  choice: यहोवा का हाथ
  rationale: दैवी सामर्थ्य और दण्ड के इब्रानी मुहावरे को सपाट किए बिना बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के विशिष्ट नाम को हिन्दी में प्रचलित रूप ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: הוֹיָה
  choice: पड़ेगा
  rationale: आसन्न, भविष्यसूचक कार्रवाई को स्वाभाविक हिन्दी में व्यक्त करता है; ‘हाथ ... पर पड़ना’ हिन्दी में भी दण्डात्मक हस्तक्षेप का बोध देता है।
- source_word: בְּמִקְנְךָ אֲשֶׁר בַּשָּׂדֶה
  choice: तुम्हारे उन पशुओं पर ... जो मैदान में हैं
  rationale: מִקְנֶה के व्यापक अर्थ और मैदान में मौजूद पशुओं के निर्दिष्ट समूह, दोनों को स्पष्ट रखता है।
- source_word: בַּסּוּסִים בַּחֲמֹרִים בַּגְּמַלִּים בַּבָּקָר וּבַצֹּאן
  choice: घोड़ों, गधों, ऊँटों, गाय-बैलों और भेड़-बकरियों पर
  rationale: प्रजातियों की पूरी सूची को आधुनिक सामान्य हिन्दी में रखता है; सामूहिक בָּקָר और צֹאן के लिए प्रचलित युग्म प्रयुक्त हैं।
- source_word: דֶּבֶר כָּבֵד מְאֹד
  choice: अत्यन्त भयंकर महामारी
  rationale: पशुओं को मारने वाली घातक महामारी और उसकी तीव्रता को सहज, गंभीर हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: नाम को उपाधि ‘प्रभु’ से प्रतिस्थापित न करके उसका विशिष्ट वाचक स्वरूप सुरक्षित रखा गया है; ‘यहोवा’ हिन्दी बाइबल-पाठकों में अधिक पहचाना जाने वाला रूप है।
- issue: ‘यहोवा का हाथ’ मुहावरे का संरक्षण
  choice: मुहावरे को ज्यों का त्यों रखना
  alternative: यहोवा तुम्हारे पशुओं को मारेगा
  rationale: मूल की दैवी सामर्थ्य और न्याय की सजीव छवि को बनाए रखता है तथा कार्रवाई की विधि को मूल से अधिक स्पष्ट नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठकों के लिए सहज। मूल की चेतावनी, ‘यहोवा का हाथ’ वाला मुहावरा और पशुओं की क्रमबद्ध सूची सुरक्षित रखी गई है।
