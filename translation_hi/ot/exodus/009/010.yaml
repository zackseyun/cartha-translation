source:
  edition: WLC
  text: וַ/יִּקְח֞וּ אֶת פִּ֣יחַ הַ/כִּבְשָׁ֗ן וַ/יַּֽעַמְדוּ֙ לִ/פְנֵ֣י פַרְעֹ֔ה וַ/יִּזְרֹ֥ק אֹת֛/וֹ מֹשֶׁ֖ה הַ/שָּׁמָ֑יְמָ/ה וַ/יְהִ֗י שְׁחִין֙ אֲבַעְבֻּעֹ֔ת פֹּרֵ֕חַ בָּ/אָדָ֖ם וּ/בַ/בְּהֵמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/010.yaml
  text: So they took soot from the kiln and stood before Pharaoh[a], and Moses threw it toward the sky[b], and it became boils with blisters breaking out on man and on beast.
translation:
  language: hi
  text: तब उन्होंने भट्ठे की कालिख ली और फ़िरौन के सामने खड़े हुए। मूसा ने उसे आकाश की ओर उछाल दिया, और मनुष्यों तथा पशुओं पर फफोलों वाले फोड़े निकल आए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פִּיחַ
  choice: कालिख
  rationale: यह शब्द सामान्य राख के बजाय भट्ठे से निकले महीन काले चूर्ण या कालिख को दर्शाता है।
- source_word: הַכִּבְשָׁן
  choice: भट्ठा
  rationale: כִּבְשָׁן उस भट्ठे या बड़ी भट्ठी को दर्शाता है जिसमें तेज़ ताप दिया जाता है; आधुनिक हिन्दी में ‘भट्ठा’ ठोस और स्वाभाविक है।
- source_word: לִפְנֵי פַרְעֹה
  choice: फ़िरौन के सामने
  rationale: यह इब्रानी मुहावरा फ़िरौन की उपस्थिति में खड़े होने का भाव देता है।
- source_word: וַיִּזְרֹק אֹתוֹ מֹשֶׁה
  choice: मूसा ने उसे ... उछाल दिया
  rationale: एकवचन कर्म-प्रत्यय कालिख को सामूहिक पदार्थ के रूप में संदर्भित करता है; ‘उछाल दिया’ ऊपर की दिशा में फेंकने की क्रिया को सहज हिन्दी में व्यक्त करता है।
- source_word: הַשָּׁמָיְמָה
  choice: आकाश की ओर
  rationale: दिशासूचक प्रत्यय ऊपर की ओर गति बताता है; यहाँ भौतिक दिशा अभिप्रेत है।
- source_word: שְׁחִין אֲבַעְבֻּעֹת
  choice: फफोलोंवाले फोड़े
  rationale: दोनों संज्ञाओं को साथ रखकर फोड़ों और उनसे जुड़े फफोलों या फुंसियों का चित्र सुरक्षित रहता है, बिना इसे केवल ‘पकते हुए’ कहकर सीमित किए।
- source_word: פֹּרֵחַ
  choice: निकल आए
  rationale: त्वचा के रोग के संदर्भ में यह कृदंत फूट निकलने या फैलने का भाव देता है; ‘निकल आए’ स्वाभाविक हिन्दी है।
- source_word: בָּאָדָם וּבַבְּהֵמָה
  choice: मनुष्यों और पशुओं के शरीर पर
  rationale: दोनों इब्रानी शब्द सामूहिक एकवचन हैं। हिन्दी में बहुवचन वर्ग-संज्ञाएँ वही व्यापक मानव-पशु विरोध स्पष्ट करती हैं; ‘शरीर पर’ रोग के स्थान को सहज बनाता है।
theological_decisions:
- issue: אָדָם का मानव जाति के लिए सामूहिक प्रयोग
  choice: मनुष्यों
  alternative: मनुष्य / मानवजाति
  rationale: यहाँ शब्द केवल पुरुषों को नहीं, पशुओं के विपरीत सभी मनुष्यों को सामूहिक रूप से दर्शाता है। ‘मनुष्यों’ आधुनिक हिन्दी में स्पष्ट और समावेशी है।
- issue: שְׁחִין אֲבַעְבֻּעֹת का संबंध
  choice: फफोलोंवाले फोड़े
  alternative: फूटते हुए फफोलेदार फोड़े / पकते हुए फोड़े
  rationale: इब्रानी वाक्यांश रोग की ठीक चिकित्सकीय प्रकृति को पूर्णतः निर्धारित नहीं करता। चुना गया रूप फोड़े और फफोले दोनों रखता है तथा अनावश्यक चिकित्सकीय व्याख्या से बचता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; कथात्मक, गरिमापूर्ण और सामान्य पाठक के लिए सहज। ‘कालिख’, ‘भट्ठा’ और ‘फफोलोंवाले फोड़े’ स्रोत की ठोस छवि बनाए रखते हैं। किसी पादटिप्पणी की आवश्यकता नहीं समझी गई।
