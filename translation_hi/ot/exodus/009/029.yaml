base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/029.yaml
  text: Moses said to him[a], “As soon as I have gone out of the city, I will spread out my hands to Yahweh; the thunder will cease, and the hail will be no more[b], so that you may know that the earth belongs to Yahweh.”
translation:
  language: hi
  text: मूसा ने उससे कहा, “जैसे ही मैं नगर से बाहर निकलूँगा, मैं याहवे की ओर अपने हाथ फैलाऊँगा। तब गरज[a] थम जाएगी और ओले फिर नहीं पड़ेंगे, जिससे तुम जान लो कि पृथ्वी[b] याहवे की है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में ‘आवाज़ें’; इस तूफ़ान के प्रसंग में इसका अर्थ बादलों की गरज है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘देश याहवे का है’ अथवा ‘भूमि याहवे की है।’
    reason: alternative_reading
lexical_decisions:
- source_word: כְּצֵאתִי אֶת־הָעִיר
  choice: जैसे ही मैं नगर से बाहर निकलूँगा
  rationale: כְּ के साथ infinitive construct यहाँ समय बताता है। ‘जैसे ही’ आसन्न क्रिया और उसके बाद होने वाली प्रार्थना को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֶפְרֹשׂ אֶת־כַּפַּי
  choice: मैं अपने हाथ फैलाऊँगा
  rationale: प्रार्थना के प्रसंग में यह पदबंध विनती करते हुए हाथ फैलाने की शारीरिक मुद्रा को दर्शाता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत वाचा-नाम को नाम के रूप में सुरक्षित रखा गया है।
- source_word: הַקֹּלוֹת
  choice: गरज
  rationale: शाब्दिक अर्थ ‘आवाज़ें’ है, पर ओलों और तूफ़ान के इस प्रसंग में इसका आशय बादलों की गरज है।
- source_word: יֶחְדָּלוּן
  choice: थम जाएगी
  rationale: חדל का अर्थ रुकना या समाप्त होना है; ‘थम जाएगी’ मौसम संबंधी प्रसंग में सहज और स्पष्ट है।
- source_word: וְהַבָּרָד לֹא יִהְיֶה־עוֹד
  choice: और ओले फिर नहीं पड़ेंगे
  rationale: हिन्दी में ओलावृष्टि के समाप्त होने को ‘ओले फिर नहीं पड़ेंगे’ स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לְמַעַן תֵּדַע
  choice: जिससे तू जान ले
  rationale: לְמַעַן उद्देश्य प्रकट करता है। फ़िरौन को एकवचन में सीधे संबोधित करने के लिए ‘तू’ रखा गया है।
- source_word: כִּי לַיהוָה הָאָרֶץ
  choice: कि पृथ्वी यहोवा की है
  rationale: לְ यहाँ स्वामित्व दर्शाता है। הָאָרֶץ का व्यापक अर्थ ‘पृथ्वी’ मुख्य पाठ में रखा गया है, जबकि ‘देश/भूमि’ की संभव सीमा को पादटिप्पणी में सुरक्षित किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल में वाचा-नाम स्पष्ट रूप से उपस्थित है; उसे सामान्य उपाधि में बदलने के बजाय हिन्दी में प्रचलित नामरूप ‘यहोवा’ रखा गया है।
- issue: הָאָרֶץ का दायरा
  choice: पृथ्वी
  alternative: देश / भूमि
  rationale: फ़िरौन के सामने यह कथन यहोवा के व्यापक प्रभुत्व की घोषणा के रूप में समझा जा सकता है; फिर भी इब्रानी शब्द स्थानीय ‘देश/भूमि’ भी सूचित कर सकता है, इसलिए विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। फ़िरौन के लिए एकवचन ‘तू’ मूल के प्रत्यक्ष संबोधन को बनाए रखता है। वाक्य-विन्यास को हिन्दी में स्वाभाविक बनाने के लिए दो वाक्यों में बाँटा गया है; दोनों पादटिप्पणी-चिह्न संबंधित शब्दों के तुरंत बाद रखे गए हैं।
