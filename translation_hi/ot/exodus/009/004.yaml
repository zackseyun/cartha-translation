source:
  edition: WLC
  text: וְ/הִפְלָ֣ה יְהוָ֔ה בֵּ֚ין מִקְנֵ֣ה יִשְׂרָאֵ֔ל וּ/בֵ֖ין מִקְנֵ֣ה מִצְרָ֑יִם וְ/לֹ֥א יָמ֛וּת מִ/כָּל לִ/בְנֵ֥י יִשְׂרָאֵ֖ל דָּבָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/004.yaml
  text: But Yahweh will make a distinction between the livestock of Israel and the livestock of Egypt[a], so that nothing belonging to the sons of Israel will die.
translation:
  language: hi
  text: पर याहवे इस्राएल के पशुधन और मिस्र के पशुधन के बीच भेद करेगा, और इस्राएलियों[a] के पशुधन में से एक भी पशु नहीं मरेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘इस्राएल के पुत्रों का।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִפְלָה
  choice: भेद करेगा
  rationale: हिफ़ील रूप यहाँ दो समूहों को स्पष्ट रूप से अलग ठहराने का भाव देता है; ‘भेद करेगा’ आधुनिक हिन्दी में स्वाभाविक रहते हुए इस अर्थ को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ के चतुरक्षरीय व्यक्तिगत ईश्वरीय नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है, किसी उपाधि से नहीं बदला गया।
- source_word: בֵּין ... וּבֵין
  choice: के बीच
  rationale: यह सहसंबंधी पूर्वसर्ग दो पक्षों के बीच अंतर दर्शाता है।
- source_word: מִקְנֵה
  choice: पशुधन
  rationale: यह शब्द केवल गाय-बैलों तक सीमित नहीं, बल्कि पाले जाने वाले पशुओं के व्यापक समूह को सूचित करता है।
- source_word: מִצְרַיִם
  choice: मिस्र
  rationale: सम्बन्धवाचक पदबंध ‘मिस्र का पशुधन’ देश अथवा उसके लोगों के पशुधन के लिए स्वाभाविक राष्ट्रीय अभिव्यक्ति है।
- source_word: וְלֹא יָמוּת
  choice: और ... नहीं मरेगी
  rationale: हिब्रू का समन्वयी ‘और’ और भविष्यकालीन निषेध सीधे सुरक्षित रखे गए हैं; इसे उद्देश्य या परिणाम के रूप में अधिक स्पष्ट नहीं किया गया।
- source_word: מִכָּל ... דָּבָר
  choice: एक भी चीज़
  rationale: निषेध के साथ यह पदबंध बलपूर्वक ‘कुछ भी नहीं/एक भी चीज़ नहीं’ का अर्थ देता है; ‘एक भी चीज़’ उसकी वितरणात्मक तीव्रता बनाए रखता है।
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: इस्राएलियों की
  rationale: सन्दर्भ में לְ स्वामित्व दर्शाता है। ‘इस्राएली’ हिन्दी में इस रूढ़ राष्ट्रीय अभिव्यक्ति का स्वाभाविक और समावेशी रूप है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में व्यक्तिगत नाम है, इसलिए उसे उपाधि ‘प्रभु’ से प्रतिस्थापित करने के बजाय हिन्दी में प्रचलित नामरूप से रखा गया।
- issue: בְּנֵי יִשְׂרָאֵל का राष्ट्रीय अर्थ
  choice: इस्राएली
  alternative: इस्राएल के पुत्र
  rationale: यह रूढ़ अभिव्यक्ति पूरे वाचा-समुदाय को सूचित करती है। मुख्य पाठ में स्वाभाविक हिन्दी ‘इस्राएली’ रखी गई है और शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- issue: अन्तिम खंड का सम्बन्ध
  choice: और ... नहीं मरेगी
  alternative: ताकि ... न मरे
  rationale: हिब्रू וְ साधारण समन्वय है और उद्देश्य अथवा परिणाम का सम्बन्ध स्पष्ट रूप से चिह्नित नहीं करता; इसलिए सम्भावित अर्थगत तनाव को निर्णीत किए बिना ‘और’ रखा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। ‘पशुधन’ व्यापक अर्थ रखता है। क्रिया ‘मरेगी’ निकटतम स्त्रीलिंग संज्ञा ‘चीज़’ के अनुसार है। पादटिप्पणी-चिह्न मुख्य पाठ में सम्मिलित है।
