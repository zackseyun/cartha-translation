  yaml_path: translation/ot/exodus/009/005.yaml
  text: And Yahweh set a time[a], saying, “Tomorrow Yahweh will do this thing in the land.”
translation:
  language: hi
  text: और याहवे ने एक समय निर्धारित किया[a] और कहा, “कल याहवे देश में यह काम करेगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “एक नियत समय” अथवा “एक निश्चित समय”।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: ठहराया
  rationale: שׂוּם यहाँ किसी समय को निर्धारित करने या तय करने के अर्थ में है। ‘ठहराया’ स्वाभाविक और गरिमापूर्ण हिन्दी में इस भाव को व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय दिव्य नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नाम-रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: מוֹעֵד
  choice: एक समय
  rationale: מוֹעֵד का अर्थ निर्धारित समय या नियत अवसर हो सकता है। मुख्य पाठ में सरल ‘एक समय’ रखा गया है; अगला शब्द ‘कल’ उसे स्पष्ट करता है, जबकि अधिक स्पष्ट विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: לֵאמֹר
  choice: और कहा
  rationale: इब्रानी कथात्मक सूत्र לֵאמֹר प्रत्यक्ष कथन का परिचय देता है। हिन्दी में ‘और कहा’ शब्दशः ‘यह कहते हुए’ की अपेक्षा अधिक स्वाभाविक है।
- source_word: מָחָר
  choice: कल
  rationale: यह आने वाले दिन का सीधा समय-सूचक क्रियाविशेषण है।
- source_word: יַעֲשֶׂה
  choice: करेगा
  rationale: עשה का सामान्य और व्यापक अर्थ ‘करना’ है; यहाँ ‘करेगा’ मूल की सादगी और भावी क्रिया दोनों बनाए रखता है।
- source_word: הַדָּבָר הַזֶּה
  choice: यह काम
  rationale: דָּבָר यहाँ घोषित घटना या कार्य की ओर संकेत करता है। ‘यह काम’ आधुनिक हिन्दी में सहज है और अनावश्यक व्याख्या नहीं जोड़ता।
- source_word: בָּאָרֶץ
  choice: देश में
  rationale: אֶרֶץ प्रसंग में मिस्र देश को सूचित करता है। मूल की तरह नाम जोड़े बिना ‘देश में’ रखा गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में निजी दिव्य नाम सीधे आया है, इसलिए ‘प्रभु’ जैसी उपाधि से उसका प्रतिस्थापन नहीं किया गया। आधुनिक हिन्दी बाइबलीय प्रयोग में पहचाने जाने वाले रूप ‘यहोवा’ को चुना गया; ‘याहवे’ अधिक प्रत्यक्ष विद्वत् लिप्यंतरण है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली। इब्रानी वाक्य की पुनरुक्ति और दिव्य नाम दोनों सुरक्षित रखे गए हैं; מוֹעֵד की अर्थ-व्याप्ति पादटिप्पणी में दी गई है।
