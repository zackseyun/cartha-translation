lexical_decisions:
- source_word: רַק
  choice: केवल
  rationale: यह शब्द प्रतिबंध और अपवाद का भाव व्यक्त करता है; वाक्य के आरम्भ में ‘केवल’ उसके बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: गोशेन प्रदेश में
  rationale: אֶרֶץ यहाँ गोशेन नामक भूभाग को दर्शाता है; आधुनिक हिन्दी में ‘प्रदेश’ स्पष्ट और स्वाभाविक है।
- source_word: אֲשֶׁר שָׁם
  choice: जहाँ
  rationale: सम्बन्धवाचक अव्यय और स्थानवाचक क्रियाविशेषण को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के बेटे
  rationale: इब्रानी के शाब्दिक पारिवारिक और पुल्लिंग बहुवचन रूप को सुरक्षित रखता है; सामूहिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: לֹא הָיָה בָּרָד
  choice: ओले नहीं पड़े
  rationale: शाब्दिक अर्थ ‘ओला नहीं था’ है, पर मौसम की घटना के लिए हिन्दी में ‘ओले नहीं पड़े’ अधिक स्वाभाविक है और पूर्ण अभाव का वही अर्थ देता है।
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל का अनुवाद
  choice: इस्राएल के बेटे
  alternative: इस्राएली; इस्राएल की संतान
  rationale: मूल पाठ स्पष्ट रूप से ‘इस्राएल के बेटे’ कहता है। मुख्य पाठ में इस रूप को बनाए रखने से स्रोत की पारिवारिक अभिव्यक्ति सुरक्षित रहती है, जबकि अधिक प्रचलित सामूहिक अर्थ पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘रहते थे’ स्थानगत शָׁם और प्रसंगगत निवास को स्वाभाविक हिन्दी में व्यक्त करता है; ‘ओले नहीं पड़े’ हिन्दी की प्रचलित मौसम-संबंधी अभिव्यक्ति है।
