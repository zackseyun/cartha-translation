base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/027.yaml
  text: Then Pharaoh sent and called for Moses and Aaron[a], and said to them, “I have sinned this time. Yahweh is in the right[b], and I and my people are the wicked ones.”
translation:
  language: hi
  text: तब फ़िरौन ने दूत भेजकर मूसा और हारून को बुलवाया और उनसे कहा, “इस बार मैंने पाप किया है। याहवे धर्मी है[a], और मैं और मेरी प्रजा दुष्ट हैं[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे सही पक्ष में है” अथवा “याहवे न्यायी है।”
    reason: lexical_alternative
  - marker: b
    text: या, “मैं और मेरी प्रजा दोषी हैं” अथवा “गलत हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח ... וַיִּקְרָא לְ
  choice: बुलवा भेजा
  rationale: 'दोनों क्रियाओं के संयुक्त आशय को स्वाभाविक हिन्दी में व्यक्त करता है: फ़िरौन ने संदेशवाहक भेजकर मूसा और हारून को अपने पास बुलाया।'
- source_word: חָטָאתִי הַפָּעַם
  choice: इस बार मैंने पाप किया है
  rationale: यह फ़िरौन द्वारा इस अवसर पर अपने किए हुए पाप की वर्तमान स्वीकारोक्ति को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण द्वारा प्रस्तुत किया गया है, न कि किसी उपाधि से बदला गया है।
- source_word: הַצַּדִּיק
  choice: धर्मी है
  rationale: संज्ञार्थक निश्चित विशेषण परमेश्वर के धर्मी और न्यायसंगत होने को बताता है तथा अगले खंड के नैतिक विरोध को बनाए रखता है।
- source_word: הָרְשָׁעִים
  choice: दुष्ट हैं
  rationale: बहुवचन विशेषण नैतिक दोष को व्यक्त करता है और ‘मैं और मेरी प्रजा’ के साथ स्वाभाविक हिन्दी में मेल खाता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: व्यक्तिगत ईश्वरीय नाम को उपाधि ‘प्रभु’ से प्रतिस्थापित न करके हिन्दी पाठकों में परिचित रूप में रखा गया है।
- issue: הַצַּדִּיק का नैतिक-न्यायिक बल
  choice: धर्मी है
  alternative: सही है / न्यायी है
  rationale: ‘धर्मी’ मूल के नैतिक और न्यायिक विस्तार को सुरक्षित रखता है; प्रसंग में इसका आशय यह भी है कि यहोवा सही पक्ष में है।
- issue: הָרְשָׁעִים में दोष की तीव्रता
  choice: दुष्ट हैं
  alternative: दोषी हैं / गलत हैं
  rationale: मूल शब्द केवल भूल या कानूनी दोष नहीं, बल्कि नैतिक दुष्टता भी व्यक्त कर सकता है; मुख्य पाठ में उसका अधिक प्रबल अर्थ रखा गया है और विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘बुलवा भेजा’ राजकीय आदेश के प्रसंग में स्वाभाविक है। ‘मैं और मेरी प्रजा’ मूल शब्दक्रम और फ़िरौन की आत्म-दोषस्वीकृति को प्रमुख रखता है।
