id: EXO.9.15
reference: Exodus 9:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֤י עַתָּה֙ שָׁלַ֣חְתִּי אֶת יָדִ֔/י וָ/אַ֥ךְ אוֹתְ/ךָ֛ וְ/אֶֽת עַמְּ/ךָ֖ בַּ/דָּ֑בֶר וַ/תִּכָּחֵ֖ד מִן הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/015.yaml
  text: For by now I could have stretched out my hand and struck you and your people with pestilence[a], and you would have been cut off from the earth.
translation:
  language: hi
  text: क्योंकि अब तक मैं अपना हाथ बढ़ाकर तुझे और तेरी प्रजा को महामारी से मार सकता था[a], और तू पृथ्वी पर से मिट गया होता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “क्योंकि अब मैंने अपना हाथ बढ़ाकर तुझे और तेरी प्रजा को महामारी से मारा, और तू पृथ्वी पर से मिट गया।” इब्रानी क्रियारूप औपचारिक रूप से भूतकालीन हैं, पर प्रसंग प्रतितथ्यात्मक अर्थ का प्रबल समर्थन करता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ स्वाभाविक है।
- source_word: עַתָּה
  choice: अब तक
  rationale: प्रतितथ्यात्मक प्रसंग में यह बताता है कि यह परिणाम इस समय तक घट चुका होता।
- source_word: שָׁלַחְתִּי אֶת־יָדִי
  choice: मैं अपना हाथ बढ़ाकर ... मार सकता था
  rationale: शाब्दिक पूर्णकाल रूप के बावजूद प्रसंग सम्भावित किन्तु न किए गए न्याय को व्यक्त करता है। ‘हाथ बढ़ाना’ इब्रानी मुहावरे को बनाए रखता है, और ‘सकता था’ उसका प्रतितथ्यात्मक भाव स्पष्ट करता है।
- source_word: וָאַךְ
  choice: मार सकता था
  rationale: נכה का अर्थ यहाँ दैवी प्रहार या दण्ड देना है; ‘मारना’ महामारी के साधन के साथ स्वाभाविक और प्रभावशाली हिन्दी है।
- source_word: אֹתְךָ וְאֶת־עַמְּךָ
  choice: तुझे और तेरी प्रजा को
  rationale: प्रत्यक्ष सम्बोधन और दोनों कर्मों का निकट, स्वाभाविक अनुवाद।
- source_word: בַּדָּבֶר
  choice: महामारी से
  rationale: דֶּבֶר यहाँ व्यापक अर्थ के ‘विपत्ति’ के बजाय घातक संक्रामक रोग अथवा महामारी को सूचित करता है।
- source_word: וַתִּכָּחֵד
  choice: तू ... मिट गया होता
  rationale: निफ़अल रूप पूर्ण उन्मूलन का भाव देता है; ‘मिट गया होता’ हिन्दी में प्रतितथ्यात्मक परिणाम और कथन की तीव्रता दोनों व्यक्त करता है।
- source_word: מִן־הָאָרֶץ
  choice: पृथ्वी पर से
  rationale: यहाँ व्यापक उन्मूलन अभिप्रेत है; ‘पृथ्वी’ उस विस्तार को ‘देश’ से बेहतर व्यक्त करती है।
theological_decisions:
- issue: क्रियाओं का प्रतितथ्यात्मक भाव
  choice: ‘मैं ... मार सकता था ... और तू ... मिट गया होता’
  alternative: ‘मैंने ... मारा, और तू ... मिट गया’
  rationale: इब्रानी क्रियारूप औपचारिक रूप से भूतकालीन हैं, पर अगले पद और जीवित फ़िरौन से प्रत्यक्ष सम्बोधन के कारण कथन उस न्याय का वर्णन करता है जो अब तक हो सकता था, किन्तु वास्तव में नहीं हुआ। यह चयन प्रसंगगत तनाव को स्पष्ट करता है, बिना अतिरिक्त धर्मवैज्ञानिक निष्कर्ष जोड़े।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। एकवचन ‘तू/तेरी’ मूल पाठ में फ़िरौन को किए गए सीधे एकवचन सम्बोधन को सुरक्षित रखता है।
