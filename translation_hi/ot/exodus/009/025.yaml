revisions:
- from: और ओलों ने मिस्र के सारे देश में मैदान में मौजूद हर चीज़ को—मनुष्य से लेकर पशु तक—मार गिराया। ओलों ने मैदान के हर पौधे को नष्ट कर दिया और मैदान के हर पेड़ को तोड़ डाला।
  to: और ओलों ने मिस्र के सारे देश में खुले मैदान में जो कुछ था, उस पर—मनुष्य से लेकर पशु तक—प्रहार किया। ओलों ने खुले मैदान के हर पौधे पर प्रहार किया और खुले मैदान के हर पेड़ को चकनाचूर कर दिया।
  rationale: The revision avoids making an unstated claim that all humans and animals died, retains the repeated striking action of the Hebrew, and renders the final intensive breaking with a strong but natural Hindi expression. It preserves the verse’s sequence and comprehensive scope.
