language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יַּ֨ךְ הַ/בָּרָ֜ד בְּ/כָל אֶ֣רֶץ מִצְרַ֗יִם אֵ֚ת כָּל אֲשֶׁ֣ר בַּ/שָּׂדֶ֔ה מֵ/אָדָ֖ם וְ/עַד בְּהֵמָ֑ה וְ/אֵ֨ת כָּל עֵ֤שֶׂב הַ/שָּׂדֶה֙ הִכָּ֣ה הַ/בָּרָ֔ד וְ/אֶת כָּל עֵ֥ץ הַ/שָּׂדֶ֖ה שִׁבֵּֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/025.yaml
  text: And the hail struck throughout all the land of Egypt everything that was in the field[a], from man to beast. The hail struck every plant of the field, and shattered every tree of the field.
translation:
  language: hi
  text: और ओलों ने मिस्र के सारे देश में खुले मैदान में जो कुछ था, उस पर—मनुष्य से लेकर पशु तक—प्रहार किया। ओलों ने खुले मैदान के हर पौधे पर प्रहार किया और खुले मैदान के हर पेड़ को चकनाचूर कर दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּךְ / הִכָּה
  choice: मार गिराया / नष्ट कर दिया
  rationale: נכה का मूल भाव प्रहार करना है। जीवित प्राणियों के संदर्भ में ‘मार गिराया’ ओलों के घातक प्रहार को स्वाभाविक हिंदी में व्यक्त करता है; पौधों के संदर्भ में ‘नष्ट कर दिया’ वही विनाशकारी परिणाम स्पष्ट करता है, बिना कृत्रिम शब्द-पुनरावृत्ति के।
- source_word: הַבָּרָד
  choice: ओले
  rationale: मौसम-संबंधी घटना का सीधा, प्रचलित हिंदी रूप; इब्रानी में पुनरावृत्ति होने के कारण हिंदी में भी दोहराया गया है।
- source_word: בְּכָל אֶרֶץ מִצְרַיִם
  choice: मिस्र के सारे देश में
  rationale: בְּכָל की व्यापकता और पूरे मिस्री भूभाग में प्रभाव को सहज हिंदी में बनाए रखता है।
- source_word: אֵת כָּל אֲשֶׁר בַּשָּׂדֶה
  choice: मैदान में मौजूद हर चीज़ को
  rationale: כָּל אֲשֶׁר की समग्रता तथा בַּשָּׂדֶה के खुले कृषि-क्षेत्र का संकेत सुरक्षित है।
- source_word: מֵאָדָם וְעַד בְּהֵמָה
  choice: मनुष्य से लेकर पशु तक
  rationale: यह मानव से पशु तक की समावेशी सीमा-अभिव्यक्ति है। ‘मनुष्य’ אָדָם का आधुनिक, प्रतिनिधिक और लिंग-समावेशी हिंदी रूप है; ‘पशु’ בְּהֵמָה के लिए स्वाभाविक व्यापक शब्द है।
- source_word: עֵשֶׂב הַשָּׂדֶה
  choice: मैदान का हर पौधा
  rationale: עֵשֶׂב घास, हरियाली अथवा वनस्पति को सूचित कर सकता है। ‘पौधा’ संदर्भ में स्पष्ट और सामान्य पाठकों के लिए सहज है।
- source_word: עֵץ הַשָּׂדֶה
  choice: मैदान का हर पेड़
  rationale: मूल की कृषि-क्षेत्र संबंधी पुनरावृत्ति को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: שִׁבֵּר
  choice: तोड़ डाला
  rationale: पिएल रूप की तीव्र, विनाशकारी शक्ति को सामान्य किंतु प्रभावशाली हिंदी में व्यक्त करता है।
theological_decisions:
- issue: सीमा-अभिव्यक्ति में אָדָם का अर्थ
  choice: मनुष्य
  alternative: आदमी / मानवजाति / लोग
  rationale: यहाँ אָדָם किसी एक पुरुष को नहीं, पशुओं के विपरीत मानव-वर्ग को दर्शाता है। ‘मनुष्य’ प्रतिनिधिक व्यापकता को बिना अनावश्यक लैंगिक संकुचन के व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी, सहज और गरिमापूर्ण रखी गई है। मूल की व्यापकता, ओलों की पुनरावृत्ति और तीन चरणों—जीवित प्राणी, पौधे, पेड़—की संरचना सुरक्षित है।
