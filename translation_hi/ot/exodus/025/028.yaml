translation:
  language: hi
  text: बबूल की लकड़ी के डंडे बनाना और उन पर सोना मढ़ना; मेज़ को उनसे उठाया जाएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: बनाना
  rationale: निर्देशात्मक प्रसंग में संयुक्त पूर्ण क्रिया आज्ञार्थक भाव रखती है; आसपास के निर्माण-निर्देशों के अनुरूप हिंदी अनंत-क्रिया शैली स्वाभाविक और स्पष्ट है।
- source_word: הַבַּדִּים
  choice: डंडे
  rationale: पवित्र-सामग्री को उठाकर ले जाने के लिए प्रयुक्त लंबे दंड अभिप्रेत हैं; ‘डंडे’ सामान्य आधुनिक हिंदी में स्पष्ट है।
- source_word: עֲצֵי שִׁטִּים
  choice: बबूल की लकड़ी
  rationale: שִׁטָּה अकासिया-वर्ग के वृक्ष को दर्शाता है; हिंदी बाइबल-प्रयोग और सामान्य बोध में ‘बबूल की लकड़ी’ सहज है।
- source_word: וְצִפִּיתָ אֹתָם זָהָב
  choice: उन पर सोना मढ़ना
  rationale: कारीगरी के इस प्रसंग में צפה किसी वस्तु की सतह पर सोने की परत चढ़ाने को व्यक्त करता है; ‘सोना मढ़ना’ सटीक और स्वाभाविक है।
- source_word: וְנִשָּׂא בָם
  choice: उन्हीं से ... उठाई जाएगी
  rationale: נשא का रूप यहाँ निष्क्रिय अर्थ देता है और בָם साधन सूचित करता है; ‘उन्हीं से’ डंडों को उठाने का माध्यम बताता है।
- source_word: הַשֻּׁלְחָן
  choice: मेज़
  rationale: यह निकटवर्ती प्रसंग में वर्णित मेज़ को संदर्भित करता है; सरल संज्ञा मूल पाठ से अधिक व्याख्या नहीं जोड़ती।
