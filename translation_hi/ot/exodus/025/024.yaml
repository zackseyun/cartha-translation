  verdict: revise
  source_fidelity: The draft accurately conveys the two instructions, the pure-gold material, and the encircling ornamental feature. However, Hebrew makes the table the direct object of the overlaying verb; Hindi expresses this more precisely as “उसे ... से मढ़ो” rather than “उस पर ... मढ़ना.”
  naturalness: The combination “तुम ... मढ़ना/बनाना” mismatches the modern standard Hindi pronoun with the imperative verb forms. “तुम ... मढ़ो ... बनाओ” is natural, clear, and retains the direct instructional register.
  terminology: “शुद्ध सोना” and “सजावटी किनारी” are suitable. The note responsibly preserves “घेरा,” “पट्टी,” and the traditional “मुकुट” rendering without treating the latter as required.
  issues:
  - severity: medium
    issue: Imperative agreement is nonstandard in the main text.
    rationale: With “तुम,” modern standard Hindi requires imperative forms such as “मढ़ो” and “बनाओ,” not infinitive-like “मढ़ना” and “बनाना.”
  - severity: low
    issue: The overlaying construction can more directly reflect the Hebrew object and material relationship.
    rationale: “उसे शुद्ध सोने से मढ़ो” identifies the table as the item overlaid and gold as the covering material more idiomatically than “उस पर शुद्ध सोना मढ़ो.”
