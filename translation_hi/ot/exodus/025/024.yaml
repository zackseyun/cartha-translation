lexical_decisions:
- source_word: וְצִפִּיתָ
  choice: मढ़ना
  rationale: यहाँ צפה लकड़ी की वस्तु पर धातु की परत चढ़ाने को दर्शाता है; ‘मढ़ना’ आधुनिक हिन्दी में इस कारीगरी का स्वाभाविक और सटीक शब्द है।
- source_word: אֹתוֹ
  choice: उस पर
  rationale: सर्वनाम पिछले पद की मेज़ की ओर संकेत करता है। हिन्दी में ‘उस पर ... मढ़ना’ क्रिया के साथ स्वाभाविक रचना है।
- source_word: זָהָב טָהוֹר
  choice: शुद्ध सोना
  rationale: यह पदबंध उच्च शुद्धता वाले सोने को दर्शाता है; ‘शुद्ध सोना’ स्पष्ट और प्रचलित हिन्दी समतुल्य है।
- source_word: וְעָשִׂיתָ
  choice: और ... बनाना
  rationale: עשה की सामान्य निर्माण-संबंधी क्रिया को सरल निर्देशात्मक हिन्दी में ‘बनाना’ से व्यक्त किया गया है।
- source_word: לּוֹ
  choice: उसके
  rationale: यह मेज़ के लिए अथवा उससे संबद्ध बनाई जाने वाली किनारी को दर्शाता है; हिन्दी में ‘उसके चारों ओर’ संबंध और स्थिति दोनों स्पष्ट करता है।
- source_word: זֵר
  choice: सजावटी किनारी
  rationale: זֵר यहाँ मेज़ के चारों ओर की उठी हुई अथवा अलंकृत पट्टी/किनारी को दर्शाता है। ‘सजावटी किनारी’ अर्थ को सामान्य पाठक के लिए स्पष्ट रखती है, जबकि ‘मुकुट’ इस संदर्भ में भ्रामक हो सकता है।
- source_word: זָהָב
  choice: सोने की
  rationale: सामग्री के साधारण निर्देश को स्वाभाविक हिन्दी विशेषणात्मक रचना में व्यक्त किया गया है।
- source_word: סָבִיב
  choice: चारों ओर
  rationale: यह हर तरफ घेरने का भाव देता है; ‘चारों ओर’ आधुनिक हिन्दी में स्वाभाविक और पूर्ण समतुल्य है।
