base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/036.yaml
  text: Their buds and their branches shall be of one piece with it[b][a], all of it a single hammered work of pure gold.
translation:
  language: hi
  text: उनकी कलियाँ और शाखाएँ उसी से निकली होंगी[a]; सारा दीपवृक्ष शुद्ध सोने का, एक ही टुकड़े को ठोक-पीटकर गढ़ा हुआ होगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसी में से होंगी”; आशय यह है कि कलियाँ और शाखाएँ दीपवृक्ष के साथ एक ही टुकड़े में गढ़ी जाएँ, अलग से जोड़कर न लगाई जाएँ।
    reason: lexical_alternative
  - marker: b
    text: या “पीटकर बनाया हुआ एक ही काम।” इब्रानी पद इस बात पर बल देता है कि पूरा दीपवृक्ष शुद्ध सोने के एक ही टुकड़े को ठोक-पीटकर गढ़ा गया हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּפְתֹּרֵיהֶם
  choice: उनकी कलियाँ
  rationale: दीपवृक्ष की वनस्पति-जैसी सजावट के संदर्भ में यह गोल पुष्पाकार अलंकरण को दर्शाता है; ‘कलियाँ’ आधुनिक हिन्दी में स्वाभाविक और चित्रात्मक है।
- source_word: וּקְנֹתָם
  choice: और उनकी शाखाएँ
  rationale: कָנֶה का मूल अर्थ नरकट या डंठल है, पर यहाँ दीपवृक्ष से निकली भुजाएँ अभिप्रेत हैं; ‘शाखाएँ’ वनस्पति-बिंब और संरचना दोनों को स्पष्ट करता है।
- source_word: מִמֶּנָּה
  choice: उसी में से बनी
  rationale: यह बताता है कि कलियाँ और शाखाएँ दीपवृक्ष के अपने ही पदार्थ से अभिन्न रूप में गढ़ी जाएँ, अलग से जोड़कर न लगाई जाएँ।
- source_word: יִהְיוּ
  choice: होंगी
  rationale: निर्देशात्मक प्रसंग में हिब्रू अपूर्ण क्रिया निर्धारित निर्माण-विधि बताती है; हिन्दी भविष्यत् रूप यहाँ स्वाभाविक विधिसूचक बल रखता है।
- source_word: כֻּלָּהּ
  choice: पूरा दीपवृक्ष
  rationale: स्त्रीलिंग सर्वनाम का संदर्भ दीपवृक्ष से है; संज्ञा को दोहराने से हिन्दी में संदर्भ स्पष्ट रहता है और संपूर्णता पर बल सुरक्षित रहता है।
- source_word: מִקְשָׁה אַחַת
  choice: एक ही हथौड़े से गढ़ी हुई कृति
  rationale: यह पद पूरे दीपवृक्ष को धातु के एक अखंड टुकड़े को पीटकर/गढ़कर बनाने पर बल देता है; यह हिन्दी पद निर्माण-प्रक्रिया और एकता दोनों व्यक्त करता है।
- source_word: זָהָב טָהוֹר
  choice: शुद्ध सोने
  rationale: यह मानक और सहज हिन्दी रूप स्रोत के धातु की शुद्धता के अर्थ को ठीक से व्यक्त करता है।
