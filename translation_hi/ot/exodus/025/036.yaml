  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘दीपवृक्ष’ निकटवर्ती संदर्भ से निहित वस्तु को स्पष्ट करता है। मुख्य पाठ में स्रोत की एक-टुकड़ा निर्माण-विधि को स्वाभाविक हिन्दी में व्यक्त किया गया है, जबकि अधिक शाब्दिक विकल्प पादटिप्पणियों में सुरक्षित हैं।
