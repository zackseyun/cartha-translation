lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: तब … ने … कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; ‘तब’ उसके क्रमिक भाव को स्वाभाविक हिन्दी में व्यक्त करता है। דּבר और उसके बाद לֵאמֹר की संयुक्त वाक्य-रचना हिन्दी में सहज रूप से ‘ने … कहा’ बनती है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम YHWH को किसी उपाधि से बदलने के बजाय उसके प्रचलित विद्वत्तापूर्ण उच्चारण के अनुसार देवनागरी में लिप्यंतरित किया गया है।
- source_word: אֶל
  choice: से
  rationale: बोलने के क्रियापद के साथ हिन्दी में संबोधित व्यक्ति को स्वाभाविक रूप से ‘से’ द्वारा व्यक्त किया जाता है।
- source_word: מֹשֶׁה
  choice: मूसा
  rationale: इस इब्रानी व्यक्तिगत नाम का हिन्दी में स्थापित और व्यापक रूप ‘मूसा’ है।
- source_word: לֵאמֹר
  choice: 'कहा:'
  rationale: यह रूप आगे आने वाले प्रत्यक्ष कथन का परिचय देता है। हिन्दी में ‘कहा:’ इसे स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है, जबकि ‘यह कहते हुए’ यहाँ अनावश्यक रूप से कृत्रिम लगेगा।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत नाम YHWH है। ‘याहवे’ उसके व्यापक रूप से स्वीकृत विद्वत्तापूर्ण उच्चारण का निकट देवनागरी लिप्यंतरण है; ‘यहोवा’ हिन्दी में परिचित वैकल्पिक रूप है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। इब्रानी की दोहरी कथन-रचना को शब्दशः दोहराने के बजाय हिन्दी के स्वाभाविक ‘ने … कहा:’ में व्यक्त किया गया है; विसर्ग आगे आने वाले प्रत्यक्ष कथन का संकेत देता है।
