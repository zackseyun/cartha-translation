  text: וְ/הָי֣וּ הַ/כְּרֻבִים֩ פֹּרְשֵׂ֨י כְנָפַ֜יִם לְ/מַ֗עְלָ/ה סֹכְכִ֤ים בְּ/כַנְפֵי/הֶם֙ עַל הַ/כַּפֹּ֔רֶת וּ/פְנֵי/הֶ֖ם אִ֣ישׁ אֶל אָחִ֑י/ו אֶל הַ/כַּפֹּ֔רֶת יִהְי֖וּ פְּנֵ֥י הַ/כְּרֻבִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/020.yaml
  text: And the cherubim shall spread out their wings upward[a], overshadowing the mercy seat with their wings, and their faces shall be one toward another; the faces of the cherubim shall be toward the mercy seat.
translation:
  language: hi
  text: करूब अपने पंख ऊपर की ओर फैलाए हों और अपने पंखों से प्रायश्चित-आवरण[a] को ढाँपते हों। उनके मुख एक-दूसरे की ओर हों; करूबों के मुख प्रायश्चित-आवरण की ओर हों।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द कप्पोरेत वाचा के सन्दूक के सोने के आवरण को दर्शाता है; इसका अनुवाद “प्रायश्चित का ढक्कन” भी किया जा सकता है।
    reason: यह पद सन्दूक के वास्तविक सोने के आवरण को तथा प्रायश्चित से उसके संबंध को दर्शाता है।
lexical_decisions:
- source_word: וְהָיוּ
  choice: हों
  rationale: निर्देशात्मक प्रसंग में यह रूप अपेक्षित बनावट और स्थिति बताता है; हिन्दी में विधिसूचक ‘हों’ स्वाभाविक है।
- source_word: הַכְּרֻבִים
  choice: करूब
  rationale: स्वर्गीय प्राणियों के लिए प्रचलित बाइबिलीय लिप्यंतरण रखा गया है; हिन्दी में बहुवचन का बोध प्रसंग और क्रिया से स्पष्ट है।
- source_word: פֹּרְשֵׂי כְנָפַיִם לְמַעְלָה
  choice: अपने पंख ऊपर की ओर फैलाए हुए
  rationale: कृदन्तीय रचना करूबों की स्थायी मुद्रा दर्शाती है और לְמַעְלָה पंखों की ऊर्ध्व दिशा बताता है।
- source_word: סֹכְכִים בְּכַנְפֵיהֶם
  choice: अपने पंखों से ... को ढाँपे रहें
  rationale: सכך यहाँ किसी वस्तु के ऊपर पंख फैलाकर उसे ढाँपने का ठोस दृश्य देता है; करणवाचक בְּ को ‘से’ द्वारा व्यक्त किया गया है।
- source_word: הַכַּפֹּרֶת
  choice: प्रायश्चित का ढकना
  rationale: कप्पोरेत वाचा के सन्दूक का सोने का ढकना है, जिसका प्रायश्चित-विधि में विशेष स्थान है। यह अनुवाद वस्तु और उसके धार्मिक प्रयोजन दोनों को व्यक्त करता है।
- source_word: וּפְנֵיהֶם אִישׁ אֶל־אָחִיו
  choice: उनके मुख एक-दूसरे की ओर हों
  rationale: शाब्दिक वितरक मुहावरा ‘एक अपने भाई की ओर’ पारस्परिक आमने-सामने की स्थिति बताता है; ‘एक-दूसरे’ आधुनिक हिन्दी में यही अर्थ स्वाभाविक रूप से देता है।
- source_word: אֶל־הַכַּפֹּרֶת יִהְיוּ פְּנֵי הַכְּרֻבִים
  choice: करूबों के मुख प्रायश्चित के ढकने की ओर हों
  rationale: मूल की पुनरुक्ति और मुखों की नीचे, ढकने की ओर अभिमुखता को स्पष्ट रूप से बनाए रखा गया है।
theological_decisions:
- issue: כַּפֹּרֶת का अनुवाद
  choice: प्रायश्चित का ढकना
  alternative: सन्दूक का ढकना; प्रायश्चित-आवरण
  rationale: शब्द एक वास्तविक सोने के ढकने को नामित करता है, पर उसका प्रायश्चित-संबंध भी महत्वपूर्ण है। मुख्य पाठ दोनों पहलुओं को साथ रखता है और पादटिप्पणी वस्तु की पहचान स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और निर्देशात्मक रखी गई है। ‘मुख’ और ‘ढाँपे रहें’ मूर्त दृश्य को बनाए रखते हैं, जबकि ‘एक-दूसरे की ओर’ इब्रानी मुहावरे का स्वाभाविक हिन्दी रूप है।
