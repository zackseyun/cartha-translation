  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। मूसा के लिए एकवचन ‘तुझे’ और अंतिम आदेश में बहुवचन ‘तुम लोग’ मूल पाठ के वचन-परिवर्तन को स्पष्ट करते हैं। ‘पवित्र निवास’ पारंपरिक पर अस्पष्ट ‘तम्बू’ शब्दावली की जगह מִשְׁכָּן के मूल अर्थ और धार्मिक संदर्भ दोनों को संप्रेषित करता है।
