base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/009.yaml
  text: Exactly according to all that I am showing you—the pattern of the tabernacle and the pattern of all its furnishings—so you shall make it[a][b].
translation:
  language: hi
  text: “जैसा कि मैं तुझे पवित्र निवास का नमूना और उसके सारे सामान का नमूना दिखा रहा हूँ, तुम लोग उसे ठीक वैसा ही बनाना।[a][b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “नमूना” के लिए इब्रानी शब्द का अनुवाद “योजना,” “रूपरेखा” या “प्रतिरूप” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “तुम लोग ... बनाना” बहुवचन है; इसमें मूसा के साथ काम के लिए उत्तरदायी लोग भी संबोधित हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכֹל אֲשֶׁר
  choice: जो कुछ … उसके अनुसार … ठीक वैसा ही
  rationale: यह अभिव्यक्ति दिखाई गई पूरी रूपरेखा से निकट और सटीक अनुरूपता व्यक्त करती है। हिंदी में खंडों को स्वाभाविक क्रम में रखकर ‘ठीक वैसा ही’ से इस बल को स्पष्ट किया गया है।
- source_word: מַרְאֶה
  choice: मैं तुझे दिखा रहा हूँ
  rationale: ראה का हिफ़ील कृदंत यहाँ चल रही प्रकाशन-क्रिया का बोध देता है; इसलिए वर्तमान प्रगतिशील रूप उपयुक्त है।
- source_word: תַּבְנִית
  choice: नमूना
  rationale: यह शब्द रूप, प्रतिरूप, योजना या संरचनात्मक नमूने को दर्शा सकता है। ‘नमूना’ मूल की व्यापकता और किसी दिखाई गई आकृति से अनुरूपता को बनाए रखता है; विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: הַמִּשְׁכָּן
  choice: पवित्र निवास
  rationale: מִשְׁכָּן का मूल अर्थ ‘निवास’ है और यहाँ यह इस्राएल के बीच परमेश्वर के पवित्र निवास-स्थान के लिए पारिभाषिक शब्द है। ‘मिलापवाला तम्बू’ कहने से מִשְׁכָּן और אֹהֶל מוֹעֵד के बीच का भेद मिट सकता था।
- source_word: כָּל כֵּלָיו
  choice: उसका सारा सामान
  rationale: כֵּלִים में पात्र, उपकरण और अन्य साज-सामान सभी सम्मिलित हो सकते हैं। ‘सामान’ किसी एक प्रकार की वस्तु तक अर्थ को सीमित नहीं करता।
- source_word: וְכֵן
  choice: ठीक वैसा ही
  rationale: यह दिखाई गई रूपरेखा के अनुरूप कार्य करने का परिणामी ढंग बताता है; हिंदी में ‘ठीक वैसा ही’ स्वाभाविक रूप से उस अनुरूपता को व्यक्त करता है।
- source_word: תַּעֲשׂוּ
  choice: तुम लोग उसे … बनाना
  rationale: क्रिया द्वितीय पुरुष बहुवचन है। ‘तुम लोग’ बहुवचन को स्पष्ट रखता है और ‘उसे’ संपूर्ण पवित्र-निवास परियोजना की ओर संकेत करता है।
theological_decisions:
- issue: क्या תַּבְנִית को स्पष्ट रूप से स्वर्गीय आदिरूप कहा जाए
  choice: नमूना
  alternative: योजना / रूपरेखा / प्रतिरूप
  rationale: पद बताता है कि परमेश्वर मूसा को תַּבְנִית दिखा रहे हैं, पर इस पद में उसके अस्तित्वगत स्वरूप को स्पष्ट नहीं किया गया। ‘नमूना’ किसी दिखाए गए आदिरूप की संभावना खुली रखता है, पर उसे अनावश्यक रूप से सिद्ध नहीं करता।
