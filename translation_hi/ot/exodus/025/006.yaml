translation:
  language: hi
  text: प्रकाश के लिए तेल, अभिषेक के तेल और सुगंधित धूप के लिए सुगंध-द्रव्य,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֶׁמֶן
  choice: तेल
  rationale: इब्रानी संज्ञा सामान्य रूप से ‘तेल’ कहती है; प्रसंग में जैतून का तेल अपेक्षित हो सकता है, पर स्रोत में ‘जैतून’ स्पष्ट नहीं है।
- source_word: לַמָּאֹר
  choice: दीपक के लिए
  rationale: מָאוֹר प्रकाश देने वाले साधन अथवा प्रकाश की व्यवस्था को दर्शाता है; निवास-स्थान के प्रसंग में ‘दीपक के लिए’ सहज और स्पष्ट है।
- source_word: בְּשָׂמִים
  choice: सुगंध-द्रव्य
  rationale: यह बहुवचन पवित्र तैयारियों में प्रयुक्त सुगंधित पदार्थों को दर्शाता है; ‘सुगंध-द्रव्य’ मसालों तक अर्थ को सीमित नहीं करता।
- source_word: לְשֶׁמֶן הַמִּשְׁחָה
  choice: अभिषेक के तेल के लिए
  rationale: यह उद्देश्यसूचक पदबंध उन सुगंध-द्रव्यों को बताता है जो विशिष्ट पवित्र अभिषेक-तेल की तैयारी में प्रयुक्त होंगे।
- source_word: קְטֹרֶת הַסַּמִּים
  choice: सुगंधित धूप के लिए
  rationale: निवास-स्थान के प्रसंग में קְטֹרֶת का अर्थ ‘धूप’ है, और הַסַּמִּים उसके सुगंधित पदार्थों से बने होने को सूचित करता है; हिंदी में यह स्वाभाविक और अर्थ-सटीक है।
