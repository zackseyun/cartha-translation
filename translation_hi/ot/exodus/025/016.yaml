translation:
  language: hi
  text: और जो साक्षीपत्र मैं तुम्हें दूँगा, उसे सन्दूक में रखना।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, इस प्रसंग में अधिक विशेष रूप से, ‘साक्षी की पटियाएँ’।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: और ... रखना
  rationale: נתן का मूल अर्थ ‘देना’ है, पर אֶל और पात्रवाचक ‘सन्दूक’ के साथ यहाँ किसी वस्तु को भीतर रखने का स्थानगत अर्थ है। हिन्दी में आज्ञार्थक ‘रखना’ स्वाभाविक और सटीक है।
- source_word: אֶל
  choice: में
  rationale: נתן और ‘सन्दूक’ के साथ אֶל भीतर रखे जाने की दिशा बताता है; हिन्दी में ‘में’ इस अर्थ को सहज रूप से व्यक्त करता है।
- source_word: הָאָרֹן
  choice: सन्दूक
  rationale: אָרוֹן यहाँ मिलापवाले तम्बू का पवित्र सन्दूक है। ‘सन्दूक’ आधुनिक हिन्दी में वस्तु के स्वरूप को स्पष्ट रखता है और बाइबिलीय प्रसंग में उपयुक्त है।
- source_word: הָעֵדֻת
  choice: साक्षीपत्र
  rationale: עֵדוּת का अर्थ ‘साक्ष्य/गवाही’ है, और इस प्रसंग में वह परमेश्वर द्वारा दी जाने वाली वाचा-साक्षी को दर्शाता है। ‘साक्षीपत्र’ उसके दस्तावेज़ात्मक स्वरूप को व्यक्त करता है, पर मुख्य पाठ में पट्टियों का उल्लेख जोड़कर मूल से अधिक विशिष्ट नहीं होता।
- source_word: אֲשֶׁר
  choice: जो
  rationale: सम्बन्धवाचक उपवाक्य के लिए आधुनिक हिन्दी का स्वाभाविक रूप ‘जो’ है।
- source_word: אֶתֵּן
  choice: मैं ... दूँगा
  rationale: प्रथम पुरुष एकवचन अपूर्ण क्रिया यहाँ भावी कार्य व्यक्त करती है; ‘दूँगा’ נתן के सामान्य अर्थ को बनाए रखता है।
- source_word: אֵלֶיךָ
  choice: तुम्हें
  rationale: यह मूसा की ओर निर्देशित अप्रत्यक्ष कर्म है; हिन्दी में ‘तुम्हें दूँगा’ इसका स्वाभाविक रूप है।
theological_decisions:
- issue: הָעֵדֻת का सन्दर्भ
  choice: मुख्य पाठ में ‘साक्षीपत्र’ कहना, बिना उसे स्पष्टतः पट्टियाँ बताने के
  alternative: ‘साक्षी की पट्टियाँ’ अथवा ‘वाचा की पट्टियाँ’
  rationale: इस पद का इब्रानी पाठ केवल ‘साक्षी’ कहता है। व्यापक प्रसंग से पत्थर की पट्टियाँ अभिप्रेत हैं, पर मुख्य पाठ में उन्हें जोड़ना पद की वास्तविक अभिव्यक्ति से अधिक विशिष्ट होगा; इसलिए यह जानकारी पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण आज्ञार्थक प्रयोग किया गया है। ‘रखना’ विधि-निर्देशों में स्वाभाविक है। ‘साक्षीपत्र’ वाचा-साक्षी के दस्तावेज़ात्मक अर्थ को साधारण ‘गवाही’ से अधिक स्पष्ट करता है, जबकि पादटिप्पणी प्रसंगगत पहचान बताती है।
