source:
  edition: WLC
  text: וַ֠/עֲשֵׂה כְּר֨וּב אֶחָ֤ד מִ/קָּצָה֙ מִ/זֶּ֔ה וּ/כְרוּב אֶחָ֥ד מִ/קָּצָ֖ה מִ/זֶּ֑ה מִן הַ/כַּפֹּ֛רֶת תַּעֲשׂ֥וּ אֶת הַ/כְּרֻבִ֖ים עַל שְׁנֵ֥י קְצוֹתָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/019.yaml
  text: Make one cherub on one end and one cherub on the other end[a]; from the mercy seat you shall make the cherubim on its two ends.
translation:
  language: hi
  text: एक करूब एक सिरे पर और दूसरा करूब दूसरे सिरे पर बनाना। करूबों को प्रायश्चित्त के ढक्कन में से ही[a] उसके दोनों सिरों पर बनाना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'और अधिक स्पष्ट रूप में: “दोनों करूबों को प्रायश्चित्त के ढक्कन के साथ एक ही टुकड़े के रूप में, उसके दोनों सिरों पर बनाना।” हिब्रू में प्रयुक्त “में से” बताता है कि करूब उसी ढक्कन से गढ़े जाएँ, अलग बनाकर बाद में न जोड़े जाएँ।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשֵׂה
  choice: बनाना
  rationale: निर्देशों की शृंखला में यह आज्ञार्थक रूप है। हिंदी में विधि-निर्देश के लिए कृदंतात्मक ‘बनाना’ स्वाभाविक और स्पष्ट है।
- source_word: כְּרוּב ... וּכְרוּב / הַכְּרֻבִים
  choice: करूब ... करूब / करूबों
  rationale: विशिष्ट स्वर्गीय प्राणियों के लिए प्रचलित बाइबलीय लिप्यंतरण रखा गया है; पहले प्रत्येक आकृति के लिए एकवचन और फिर दोनों के लिए बहुवचन सुरक्षित है।
- source_word: מִקָּצָה מִזֶּה ... מִקָּצָה מִזֶּה
  choice: एक सिरे पर ... दूसरे सिरे पर
  rationale: इस प्रसंग में पदस्थिति का भाव है। यह अभिव्यक्ति हिब्रू की सममिति को रखते हुए आधुनिक हिंदी में स्वाभाविक है।
- source_word: מִן הַכַּפֹּרֶת
  choice: प्रायश्चित्त के ढक्कन में से ही
  rationale: כַּפֹּרֶת संदूक के उस विशिष्ट ढक्कन को दर्शाता है जिसका प्रायश्चित्त-विधि से संबंध है। מִן यहाँ स्रोत अथवा सामग्री का संबंध बताता है; ‘में से ही’ स्पष्ट करता है कि करूब उसी ढक्कन से गढ़े जाएँ, अलग बनाकर जोड़े न जाएँ।
- source_word: עַל שְׁנֵי קְצוֹתָיו
  choice: उसके दोनों सिरों पर
  rationale: सर्वनाम का संदर्भ प्रायश्चित्त के ढक्कन से है और עַל यहाँ भौतिक स्थिति को दर्शाता है।
theological_decisions:
- issue: כַּפֹּרֶת का अनुवाद
  choice: प्रायश्चित्त का ढक्कन
  alternative: दया-आसन
  rationale: यह वस्तु मूलतः संदूक का ढक्कन है और उसका धार्मिक कार्य प्रायश्चित्त से जुड़ा है। ‘दया-आसन’ पारंपरिक है, पर इससे वस्तु के ढक्कन होने का प्रत्यक्ष अर्थ दब सकता है। चुना हुआ रूप वस्तुगत और अनुष्ठानिक दोनों पहलुओं को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, निर्देशात्मक शैली रखी गई है। ‘करूब’ तकनीकी बाइबलीय पद के रूप में और ‘प्रायश्चित्त का ढक्कन’ वस्तु तथा उसके धार्मिक कार्य दोनों को स्पष्ट करने के लिए प्रयुक्त है।
