source:
  edition: WLC
  text: וְ/עָשִׂ֥יתָ מְנֹרַ֖ת זָהָ֣ב טָה֑וֹר מִקְשָׁ֞ה תֵּעָשֶׂ֤ה הַ/מְּנוֹרָה֙ יְרֵכָ֣/הּ וְ/קָנָ֔/הּ גְּבִיעֶ֛י/הָ כַּפְתֹּרֶ֥י/הָ וּ/פְרָחֶ֖י/הָ מִמֶּ֥/נָּה יִהְיֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/031.yaml
  text: And you shall make a lampstand of pure gold[a]. The lampstand shall be made of hammered work; its base and its shaft, its cups, its buds[b], and its flowers shall be of one piece with it.
translation:
  language: hi
  text: “तुम शुद्ध सोने का एक दीपवृक्ष बनाना। दीपवृक्ष हथौड़े से गढ़कर बनाया जाए[a]। उसका आधार और उसका डंठल, उसके प्याले, उसकी कलियाँ[b] और उसके फूल—सब उसी में से बने हों।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पीटकर गढ़ा जाए।’ इब्रानी में इस बात पर बल है कि दीपवृक्ष हथौड़े से आकार दिया जाए—सम्भवतः अलग-अलग भाग जोड़ने के बजाय एक ही धातु-खंड से।
    reason: lexical_alternative
  - marker: b
    text: ‘कलियाँ’ का अनुवाद ‘गाँठें’ भी किया जा सकता है। इब्रानी शब्द दीपवृक्ष के पुष्पीय विन्यास में गोल, उभरे हुए सजावटी भागों को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מְנֹרַת
  choice: दीपवृक्ष
  rationale: यह शब्द दीपों को थामने वाले पूरे ढाँचे को दर्शाता है, स्वयं दीपों को नहीं। ‘दीपवृक्ष’ प्रचलित, संक्षिप्त और आगे आने वाली शाखाओं तथा पुष्प-अलंकरण की छवि के अनुकूल है।
- source_word: זָהָב טָהוֹר
  choice: शुद्ध सोना
  rationale: परिष्कृत और मिलावट-रहित सोने के लिए स्वाभाविक आधुनिक हिन्दी अभिव्यक्ति।
- source_word: מִקְשָׁה
  choice: हथौड़े से गढ़कर
  rationale: यह धातु को पीटकर आकार देने की कारीगरी बताता है; सन्दर्भ में अलग-अलग भाग जोड़ने के बजाय एक ही धातु-खंड से गढ़ने का भाव भी है।
- source_word: תֵּעָשֶׂה
  choice: बनाया जाए
  rationale: निर्देश के प्रसंग में निष्क्रिय क्रियारूप को स्वाभाविक आज्ञार्थक हिन्दी में रखा गया है।
- source_word: יְרֵכָהּ
  choice: उसका आधार
  rationale: शाब्दिक अर्थ ‘जाँघ/पार्श्व’ हो सकता है, पर वस्तु के प्रसंग में यह नीचे के सहारा देने वाले भाग को दर्शाता है।
- source_word: וְקָנָהּ
  choice: उसका डंठल
  rationale: यहाँ एकवचन रूप दीपवृक्ष के केंद्रीय तने को दर्शाता है। ‘डंठल’ पुष्पीय रूपांकन के अनुरूप है और इसे बाद की पार्श्व शाखाओं से अलग रखता है।
- source_word: גְּבִיעֶיהָ
  choice: उसके प्याले
  rationale: शब्द प्याले के आकार वाले सजावटी भागों को दर्शाता है; ‘प्याले’ सरल और सटीक है।
- source_word: כַּפְתֹּרֶיהָ
  choice: उसकी कलियाँ
  rationale: यह गोल उभरे हुए अलंकरणों का नाम है। पुष्पीय विन्यास में ‘कलियाँ’ स्वाभाविक है, जबकि ‘गाँठें’ भी सम्भव है।
- source_word: וּפְרָחֶיהָ
  choice: उसके फूल
  rationale: पुष्पाकार सजावट को सीधी और सामान्य हिन्दी में व्यक्त करता है।
- source_word: מִמֶּנָּה יִהְיוּ
  choice: सब उसी में से बने हों
  rationale: मूल वाक्य बताता है कि ये अंग दीपवृक्ष से ही निकलें या उसी धातु-खंड के अभिन्न भाग हों, अलग से जोड़कर न लगाए जाएँ।
