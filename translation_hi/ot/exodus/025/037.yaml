  yaml_path: translation/ot/exodus/025/037.yaml
  text: You shall make its seven lamps[b][a], and he shall set up its lamps so that they give light in front of it.
translation:
  language: hi
  text: तुम उसके सात दीपक बनाओ। वह उसके दीपकों को लगाएगा[a][b], ताकि वे दीवट के सामने की ओर प्रकाश दें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके दीपकों को जलाएगा, ताकि वे दीवट के सामने की ओर प्रकाश दें।” इब्रानी क्रिया का शाब्दिक भाव दीपकों को ऊपर चढ़ाने का है; इस प्रसंग में उसका आशय उन्हें लगाने के साथ-साथ जलाने से भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “वह” सम्भवतः उस याजक की ओर संकेत करता है जो दीवट की देखभाल करता था, यद्यपि इस पद में कर्ता का नाम स्पष्ट रूप से नहीं दिया गया है।
    reason: cultural_note
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: तुम ... बनाना
  rationale: निर्देशात्मक प्रसंग में संयोजक के साथ आया क़ाल पूर्ण रूप मूसा को दी गई आज्ञा व्यक्त करता है; आधुनिक हिन्दी में ‘तुम ... बनाना’ इसका स्पष्ट और स्वाभाविक निर्देशात्मक बल रखता है।
- source_word: נֵרֹתֶיהָ שִׁבְעָה
  choice: उसके सात दीपक
  rationale: נֵר यहाँ दीवट पर रखे जाने वाले दीपक को दर्शाता है, और स्त्रीलिंग एकवचन प्रत्यय दीवट की ओर संकेत करता है; שִׁבְעָה की संख्या सीधे ‘सात’ है।
- source_word: וְהֶעֱלָה
  choice: फिर वह ... लगाएगा
  rationale: עלה के हिफ़ील रूप का मूल भाव ‘ऊपर चढ़ाना’ है और दीपकों के प्रसंग में उसे स्थापित करने या जलाने का अर्थ हो सकता है। ‘लगाएगा’ मुख्य पाठ में क्रिया को स्वाभाविक रखता है, जबकि पादटिप्पणी ‘जलाएगा’ की वास्तविक संभावना सुरक्षित रखती है। क्रिया तृतीय पुरुष पुल्लिंग एकवचन है, इसलिए ‘वह’ रखा गया है।
- source_word: וְהֵאִיר
  choice: ताकि वे ... प्रकाश दें
  rationale: אור का हिफ़ील रूप यहाँ दीपकों को लगाने का उद्देश्य या परिणाम बताता है। हिन्दी में दीपकों को स्पष्ट बहुवचन कर्ता बनाकर ‘ताकि वे प्रकाश दें’ अर्थ को सहज रूप में व्यक्त करता है।
- source_word: עַל־עֵבֶר פָּנֶיהָ
  choice: उसके सामने
  rationale: यह पदबंध दीवट के मुख या सामने की दिशा/क्षेत्र में प्रकाश पड़ने का भाव देता है। ‘उसके सामने’ संक्षिप्त, स्वाभाविक और सन्दर्भानुकूल है।
