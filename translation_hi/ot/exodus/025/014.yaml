  register: आदेशात्मक हिब्रू शैली को हिन्दी के विधिसूचक अनन्त रूप ‘डालना’ में प्रस्तुत किया गया है, जो आसपास के निर्देशात्मक गद्य के लिए स्वाभाविक और गरिमापूर्ण है। शब्दावली सरल, आधुनिक और गैर-साम्प्रदायिक रखी गई है।
