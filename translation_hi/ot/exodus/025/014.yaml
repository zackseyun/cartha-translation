translation:
  language: hi
  text: और डंडों को सन्दूक के किनारों पर लगे छल्लों में डालना, ताकि उनके सहारे सन्दूक को उठाकर ले जाया जा सके।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/הֵֽבֵאתָ
  choice: और ... डालना
  rationale: בוא का मूल अर्थ ‘लाना’ है, पर डंडों और छल्लों के इस विन्यास में ‘छल्लों में डालना’ स्वाभाविक हिन्दी में भीतर रखने की क्रिया स्पष्ट करता है।
- source_word: הַ/בַּדִּים
  choice: डंडों
  rationale: בדים यहाँ पवित्र सन्दूक उठाने के लिए प्रयुक्त लंबे डंडों को दर्शाता है; ‘डंडे’ आधुनिक हिन्दी में स्पष्ट और सहज है।
- source_word: בַּ/טַּבָּעֹת
  choice: छल्लों में
  rationale: इस प्रसंग में ב preposition डंडों को छल्लों के भीतर डालने का भाव देता है।
- source_word: עַל צַלְעֹת הָ/אָרֹן
  choice: सन्दूक के किनारों पर लगे
  rationale: צלעות से सन्दूक के पार्श्व या किनारे अभिप्रेत हैं; हिन्दी वाक्य में ‘लगे’ जोड़ने से छल्लों की स्थिति स्वाभाविक रूप से व्यक्त होती है।
- source_word: הָ/אָרֹן
  choice: सन्दूक
  rationale: אָרוֹן का ठोस अर्थ पेटी या सन्दूक है। इस पद में वस्तु का वर्णन है; ‘सन्दूक’ सामान्य आधुनिक हिन्दी में स्पष्ट है और संदर्भ इसकी पवित्र पहचान बनाए रखता है।
- source_word: לָ/שֵׂאת
  choice: उठाया जा सके
  rationale: נשא यहाँ डंडों के माध्यम से सन्दूक को उठाकर ले जाने की क्रिया व्यक्त करता है; ‘उठाया जा सके’ उद्देश्य और साधन को सहज हिन्दी में रखता है।
- source_word: בָּ/הֶם
  choice: उनके सहारे
  rationale: बहुवचन सर्वनाम डंडों को सन्दूक उठाने के साधन के रूप में निर्दिष्ट करता है; ‘उनके सहारे’ हिन्दी में इस करणार्थक भाव को स्पष्ट करता है।
theological_decisions: []
