  text: अकेशिया की लकड़ी के डंडे बनाना और उन पर सोना मढ़ना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: बनाना
  rationale: निर्देशों की शृंखला में संयोजक सहित यह रूप आज्ञार्थक भाव रखता है। आस-पास के तम्बू-निर्माण निर्देशों के अनुरूप हिंदी में अनंत क्रिया का निर्देशात्मक प्रयोग स्वाभाविक और स्पष्ट है।
- source_word: בַדֵּי
  choice: डंडे
  rationale: यह वाचा के संदूक को उठाकर ले जाने के लिए बनाए जाने वाले लंबे डंडों को दर्शाता है; ‘डंडे’ सामान्य आधुनिक हिंदी में स्पष्ट है।
- source_word: עֲצֵי שִׁטִּים
  choice: बबूल की लकड़ी
  rationale: यह शिट्टीम/अकेशिया जाति की लकड़ी का संकेत है। ‘बबूल की लकड़ी’ हिंदी पाठकों के लिए परिचित और अर्थपूर्ण समतुल्य है।
- source_word: וְצִפִּיתָ
  choice: मढ़ना
  rationale: क्रिया किसी वस्तु को दूसरी सामग्री की परत से ढकने का बोध कराती है; काष्ठ पर सोने की परत चढ़ाने के शिल्प-संदर्भ में ‘मढ़ना’ सटीक और स्वाभाविक है।
- source_word: אֹתָם
  choice: उन पर
  rationale: बहुवचन सर्वनाम पहले बताए गए डंडों की ओर लौटता है। हिंदी में ‘सोना मढ़ना’ के साथ ‘उन पर’ स्वाभाविक संरचना है।
- source_word: זָהָב
  choice: सोना
  rationale: मढ़ने में प्रयुक्त सामग्री सोना है; हिंदी क्रिया ‘मढ़ना’ के साथ इसे सीधे कर्म के रूप में रखना स्वाभाविक है।
