source:
  edition: WLC
  text: וְ/עָשׂ֥וּ אֲר֖וֹן עֲצֵ֣י שִׁטִּ֑ים אַמָּתַ֨יִם וָ/חֵ֜צִי אָרְכּ֗/וֹ וְ/אַמָּ֤ה וָ/חֵ֨צִי֙ רָחְבּ֔/וֹ וְ/אַמָּ֥ה וָ/חֵ֖צִי קֹמָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/010.yaml
  text: They shall make an ark of acacia wood[a], two and a half cubits its length, a cubit and a half its width[c][b], and a cubit and a half its height.
translation:
  language: hi
  text: वे बबूल की लकड़ी का एक संदूक[a] बनाएँ। उसकी लंबाई ढाई हाथ[b], चौड़ाई डेढ़ हाथ और ऊँचाई डेढ़ हाथ हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द का अर्थ ‘संदूक’ या ‘पेटी’ हो सकता है; इसी पवित्र संदूक को आगे वाचा का संदूक कहा गया है।
    reason: lexical_alternative
  - marker: b
    text: ‘हाथ’ प्राचीन लंबाई की एक इकाई थी—लगभग कोहनी से मध्यमा उँगली के सिरे तक की दूरी।
    reason: cultural_note
lexical_decisions:
- source_word: וְעָשׂוּ
  choice: वे ... बनाएँ
  rationale: निर्देशात्मक प्रसंग में बहुवचन क्रिया को स्वाभाविक आधुनिक हिन्दी के विधिलिंग में व्यक्त किया गया है; आरंभिक संयोजक को हिन्दी में अनावश्यक होने के कारण नहीं रखा गया।
- source_word: אֲרוֹן
  choice: संदूक
  rationale: इब्रानी शब्द मूलतः संदूक या पेटी जैसे पात्र को सूचित करता है। हिन्दी में ‘संदूक’ अर्थ को स्पष्ट रखता है और आगे के वाचा-संदूक प्रसंग के अनुकूल है।
- source_word: עֲצֵי שִׁטִּים
  choice: बबूल की लकड़ी
  rationale: שִׁטָּה को आधुनिक हिन्दी में प्रचलित वनस्पति-नाम ‘बबूल’ से व्यक्त किया गया है; पारंपरिक लिप्यंतरण ‘शित्तीम’ सामान्य पाठक के लिए कम स्पष्ट है।
- source_word: אַמָּתַיִם וָחֵצִי
  choice: ढाई हाथ
  rationale: प्राचीन माप אַמָּה के लिए हिन्दी बाइबलीय प्रयोग में स्वाभाविक ‘हाथ’ रखा गया है और मात्रा को संक्षिप्त, सहज रूप में व्यक्त किया गया है।
- source_word: אָרְכּוֹ
  choice: उसकी लंबाई
  rationale: पुल्लिंग एकवचन प्रत्यय संदूक की ओर संकेत करता है; हिन्दी में ‘उसकी लंबाई’ स्वाभाविक और सटीक है।
- source_word: וְאַמָּה וָחֵצִי
  choice: डेढ़ हाथ
  rationale: शाब्दिक ‘एक हाथ और आधा’ का आधुनिक हिन्दी में स्वाभाविक समतुल्य ‘डेढ़ हाथ’ है।
- source_word: רָחְבּוֹ
  choice: चौड़ाई
  rationale: वस्तु के पार्श्व आयाम के लिए आधुनिक हिन्दी का स्पष्ट शब्द चुना गया है।
- source_word: קֹמָתוֹ
  choice: ऊँचाई
  rationale: वस्तु के खड़े आयाम के लिए ‘ऊँचाई’ प्रसंगानुकूल और स्वाभाविक है।
theological_decisions:
- issue: אֲרוֹן के लिए धार्मिक रूप से विशिष्ट पद या सामान्य पात्र-संज्ञा
  choice: संदूक
  alternative: वाचा का संदूक / मंजूषा
  rationale: मूल पद इस वाक्य में केवल पात्र को नाम देता है; ‘वाचा का’ जोड़ना इस पद में अनुपस्थित सूचना को पहले से सम्मिलित करता। ‘संदूक’ मूल की सामान्य अर्थ-सीमा और प्रसंगगत पवित्रता दोनों को बिना सांप्रदायिक विस्तार के बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। आयामों की सूची को प्राकृतिक हिन्दी वाक्य-विन्यास में बाँटा गया है। ‘बबूल’, ‘संदूक’ और ‘हाथ’ जैसे सामान्यतः समझ आने वाले शब्द चुने गए हैं; जहाँ शब्दार्थ या प्राचीन माप के लिए स्पष्टीकरण आवश्यक है, वहाँ पादटिप्पणी दी गई है।
