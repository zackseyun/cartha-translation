translation:
  language: hi
  text: और बबूल की लकड़ी की एक मेज़ बनाओ। उसकी लंबाई दो हाथ, चौड़ाई एक हाथ और ऊँचाई डेढ़ हाथ रखना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: और तुम ... बनाना
  rationale: संयोजक וְ इस निर्देश को पिछले आदेशों से जोड़ता है, और निर्देशात्मक क्रम में पूर्ण क्रिया आज्ञार्थक भाव रखती है। हिंदी में ‘और तुम ... बनाना’ इस संबंध और निर्देश—दोनों को स्वाभाविक रूप से बनाए रखता है।
- source_word: שֻׁלְחָן
  choice: एक मेज़
  rationale: उपासना-स्थान की इस वस्तु के लिए आधुनिक हिंदी में ‘मेज़’ स्पष्ट और सामान्य शब्द है; पहली बार उल्लेख होने के कारण ‘एक’ स्वाभाविक है।
- source_word: עֲצֵי שִׁטִּים
  choice: बबूल की लकड़ी
  rationale: यह पदबंध शिट्टा वृक्ष की लकड़ी को सूचित करता है। हिंदी बाइबलीय और सामान्य प्रयोग में ‘बबूल की लकड़ी’ सुबोध समतुल्य है।
- source_word: אַמָּתַיִם אָרְכּוֹ
  choice: उसकी लंबाई दो हाथ
  rationale: मूल के सांस्कृतिक माप को आधुनिक इकाई में बदले बिना ‘हाथ’ से व्यक्त किया गया है; संज्ञात्मक बनावट ‘उसकी लंबाई’ मूल के अनुरूप है।
- source_word: וְאַמָּה רָחְבּוֹ
  choice: चौड़ाई एक हाथ
  rationale: मूल का समानांतर माप-सूत्र संक्षिप्त और स्वाभाविक हिंदी में रखा गया है।
- source_word: וְאַמָּה וָחֵצִי קֹמָתוֹ
  choice: और ऊँचाई डेढ़ हाथ
  rationale: ‘डेढ़ हाथ’ मूल के ‘एक हाथ और आधा’ का स्वाभाविक हिंदी रूप है, जबकि माप की सटीकता बनी रहती है।
