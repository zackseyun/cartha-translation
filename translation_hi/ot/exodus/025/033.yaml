base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/033.yaml
  text: three almond-blossom-shaped cups on the one branch[a], with bulb and flower, and three almond-blossom-shaped cups on the one branch, with bulb and flower[c][b]; so it shall be for the six branches coming out from the lampstand.
translation:
  language: hi
  text: प्रत्येक शाखा पर बादाम के फूलों के आकार के तीन प्याले[a] हों, जिनके साथ एक गोल उभार[b] और एक फूल हो; और बादाम के फूलों के आकार के तीन प्याले हों, जिनके साथ एक गोल उभार और एक फूल हो। दीपवृक्ष[c] से निकलने वाली सभी छह शाखाओं के लिए ऐसा ही हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘बादाम के फूलों जैसे बनाए गए तीन प्याले।’
    reason: lexical_alternative
  - marker: b
    text: ‘गोल उभार’ इब्रानी כַּפְתֹּר का अनुवाद है, जो एक गोल सजावटी प्रक्षेप को दर्शाता है; ‘घुंडी’ भी संभव है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी מְנֹרָה को प्रायः ‘मिनोरा’ के रूप में लिप्यंतरित किया जाता है। यहाँ उसका अनुवाद ‘दीपवृक्ष’ किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: גְבִעִים
  choice: प्याले
  rationale: यह संज्ञा प्याले या कटोरे जैसी आकृति को दर्शाती है। दीपवृक्ष की छोटी सजावटी आकृतियों के लिए ‘प्याले’ स्वाभाविक और सटीक है।
- source_word: מְשֻׁקָּדִים
  choice: बादाम के फूलों के आकार के
  rationale: שקד से निकला यह रूप यहाँ बादाम के फूल की सजावटी बनावट बताता है; अनुवाद केवल बादाम के फल का आकार होने का भ्रम नहीं पैदा करता।
- source_word: קָּנֶה
  choice: शाखा
  rationale: इस प्रसंग में यह दीपवृक्ष से निकली हुई डंडी अथवा भुजा है। फूलों वाली बनावट के साथ ‘शाखा’ स्वाभाविक है।
- source_word: כַּפְתֹּר
  choice: गाँठ
  rationale: यह दीपवृक्ष पर बने गोल सजावटी उभार को दर्शाता है। ‘गाँठ’ संक्षिप्त है और वनस्पति-सदृश रूपक के अनुकूल है; अर्थ फुटनोट में स्पष्ट किया गया है।
- source_word: פֶרַח / פָרַח
  choice: फूल
  rationale: शब्द का सामान्य अर्थ फूल या पुष्प है। ‘फूल’ आधुनिक हिन्दी में सहज है और מְשֻׁקָּדִים के विस्तृत अनुवाद के साथ अनावश्यक पुनरुक्ति से बचाता है।
- source_word: כֵּן
  choice: ऐसा ही
  rationale: यह पहले बताए नमूने को सभी छह शाखाओं पर लागू करता है और हिन्दी में तुलना तथा निर्देश दोनों को स्पष्ट रखता है।
- source_word: לְשֵׁשֶׁת הַקָּנִים
  choice: सभी छह शाखाओं के लिए
  rationale: इससे स्पष्ट होता है कि यही सजावटी व्यवस्था छहों शाखाओं पर लागू है। ‘सभी’ निहित वितरणात्मक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַיֹּצְאִים מִן הַמְּנֹרָה
  choice: दीपवृक्ष से निकलने वाली
  rationale: कृदंत और पूर्वसर्ग को सीधे रूप में व्यक्त करते हुए यह बताता है कि शाखाएँ केंद्रीय दीपवृक्ष से बाहर की ओर निकली हैं।
- source_word: מְנֹרָה
  choice: दीपवृक्ष
  rationale: यह यहाँ तंबू के शाखायुक्त दीप-आधार का सामान्य नाम है। ‘दीपवृक्ष’ उसकी संरचना और इस पद की शाखा-पुष्प छवि दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: दो शाखाओं का उल्लेख
  choice: ‘एक शाखा’ और ‘दूसरी शाखा’
  alternative: दोनों बार ‘एक शाखा’
  rationale: इब्रानी में दोनों स्थानों पर הָאֶחָד है, पर युग्मित संरचना में אחד ‘एक ... दूसरी’ का अर्थ दे सकता है। निकटवर्ती संदर्भ में दीपवृक्ष की विपरीत ओर निकली शाखाओं का वर्णन है; इसलिए यह हिन्दी अभिव्यक्ति संदर्भगत संबंध स्पष्ट करती है, बिना सजावटी नमूने में कोई नया तत्व जोड़े।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और निर्देशात्मक रखी गई है। लंबे इब्रानी वाक्य को अर्धविराम और पूर्णविराम से बाँटकर पठनीय बनाया गया है। ‘हों/हो’ निर्माण-निर्देश का भाव बनाए रखता है। सभी फुटनोट चिह्न मुख्य पाठ में उपस्थित हैं।
