- source_word: אַבְנֵי מִלֻּאִים
  choice: जड़ने के लिए रत्न
  rationale: מִלֻּאִים यहाँ ऐसे मूल्यवान पत्थरों को सूचित करता है जिन्हें पुरोहितीय वस्त्रों में जड़ा जाना था। ‘रत्न’ प्रसंगानुकूल है और ‘जड़ने के लिए’ उनके प्रयोजन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לָאֵפֹד
  choice: एपोद के लिए
  rationale: אֵפוֹד एक विशिष्ट पुरोहितीय वस्त्र का तकनीकी नाम है; अनिश्चित वर्णनात्मक अनुवाद के बजाय इसका लिप्यंतरण रखा गया है।
- source_word: וְלַחֹשֶׁן
  choice: और सीनाबन्द के लिए
  rationale: חֹשֶׁן महायाजक द्वारा छाती पर पहने जाने वाले रत्न-जड़ित पुरोहितीय उपकरण को दर्शाता है। ‘सीनाबन्द’ हिन्दी बाइबलीय परंपरा में परिचित है और कवच का भ्रामक संकेत देने वाले ‘छाती के कवच’ से बचता है।
