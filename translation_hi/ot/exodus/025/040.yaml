  text: And see that you make them according to their pattern[a], which was shown to you on the mountain.
translation:
  language: hi
  text: और ध्यान रखना कि तुम उन्हें उनके उस नमूने के अनुसार बनाओ, जो तुम्हें पर्वत पर दिखाया जा रहा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּרְאֵה
  choice: और ध्यान रख
  rationale: ראה का आज्ञार्थक रूप यहाँ सावधानीपूर्वक ध्यान देने की चेतावनी देता है। शाब्दिक ‘और देख’ की अपेक्षा ‘और ध्यान रख’ आधुनिक हिन्दी में इसका प्रसंगगत बल स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַעֲשֵׂה
  choice: कि तू ... बनाए
  rationale: עשה निर्माण के प्रसंग में ‘बनाना’ है। ‘ध्यान रख कि’ के साथ आश्रित वाक्य हिन्दी में दोनों आज्ञार्थक क्रियाओं का संयुक्त आशय सहजता से व्यक्त करता है।
- source_word: בְּתַבְנִיתָם
  choice: उसी नमूने के अनुसार
  rationale: תבנית किसी नमूने, रूपरेखा या प्रतिरूप को सूचित करता है; बहुवचन प्रत्यय पूर्ववर्णित वस्तुओं की ओर संकेत करता है। ‘नमूने के अनुसार’ किसी विशेष तत्त्वमीमांसीय अर्थ को थोपे बिना अनुरूपता व्यक्त करता है। ‘उसी’ दिखाए गए नमूने पर बल देता है।
- source_word: אֲשֶׁר
  choice: जो
  rationale: सम्बन्धवाचक अव्यय को हिन्दी में स्वाभाविक सम्बन्धवाचक सर्वनाम ‘जो’ से व्यक्त किया गया है।
- source_word: אַתָּה
  choice: तू
  rationale: मूसा को एकवचन प्रत्यक्ष सम्बोधन है। बाइबलीय हिन्दी की गरिमामय परम्परा और स्पष्ट वचन-संख्या बनाए रखने के लिए ‘तू’ चुना गया है।
- source_word: מָרְאֶה
  choice: तुझे ... दिखाया गया था
  rationale: इसे ראה का होफ़ाल कृदन्त, ‘दिखाया जा रहा/गया’, माना गया है। प्रसंग में पर्वत पर दिए गए दर्शन की ओर संकेत होने के कारण पूर्ण भूतकाल हिन्दी में अधिक स्वाभाविक है, यद्यपि कृदन्त की कालगत व्यापकता स्वीकार की जाती है।
- source_word: בָּהָר
  choice: पर्वत पर
  rationale: इस प्रसंग में ב स्थान को सूचित करता है; हिन्दी में मूसा की स्थिति के लिए ‘पर्वत पर’ स्वाभाविक है।
theological_decisions:
- issue: पवित्रस्थान की वस्तुओं के प्रकट किए गए प्रारूप का स्वरूप
  choice: नमूना
  alternative: प्रतिरूप; रूपरेखा; योजना
  rationale: ‘नमूना’ תבנית की अर्थ-सीमा को बनाए रखता है और पाठ से परे जाकर किसी स्वर्गीय आदिरूप अथवा केवल वास्तु-योजना का सिद्धान्त निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमामय रखी गई है। एकवचन सम्बोधन ‘तू’ स्रोत के व्याकरण को स्पष्ट रखता है। कोई पादटिप्पणी आवश्यक नहीं समझी गई, क्योंकि ‘और देख, और बना’ वाला अधिक शाब्दिक विकल्प अर्थगत भिन्नता नहीं जोड़ता और हिन्दी में अस्वाभाविक होगा।
