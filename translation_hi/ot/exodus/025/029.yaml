  yaml_path: translation/ot/exodus/025/029.yaml
  text: You shall make its plates and its dishes[a], and its pitchers and its bowls with which the drink offering is poured[b]; you shall make them of pure gold.
translation:
  language: hi
  text: तू उसकी थालियाँ, कटोरियाँ, सुराहियाँ[a] और प्याले[b] बना, जिनसे पेय-भेंट उंडेली जाती है; उन्हें शुद्ध सोने के बनाना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “घड़े”; इब्रानी शब्द दुर्लभ है और द्रव रखने तथा उंडेलने के काम आने वाले पात्र को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: या “कटोरे”; यह शब्द पेय-भेंट उंडेलने की सेवा में प्रयुक्त पात्र को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: קְּעָרֹתָיו
  choice: उसकी थालियाँ
  rationale: कְעָרָה चपटी थाली या पात्र को सूचित करता है; मेज़ के प्रसंग में ‘थालियाँ’ स्वाभाविक है और अगले पात्र से भेद बनाए रखता है।
- source_word: כַפֹּתָיו
  choice: कटोरियाँ
  rationale: כַּף हथेली के आकार के छोटे पात्र को सूचित कर सकता है; ‘कटोरियाँ’ आधुनिक हिंदी में सहज है और वस्तुओं की अलग श्रेणी दर्शाता है।
- source_word: קְשׂוֹתָיו
  choice: सुराहियाँ
  rationale: यह दुर्लभ उपासना-संबंधी पात्र-शब्द है। उंडेलने के प्रसंग में ‘सुराहियाँ’ द्रव रखने और उंडेलने वाले पात्र का अर्थ स्वाभाविक रूप से देता है।
- source_word: מְנַקִּיֹּתָיו
  choice: प्याले
  rationale: यह शब्द अर्घ उंडेलने की सेवा से जुड़े पात्र को सूचित करता है; ‘प्याले’ अर्थ को सामान्य पाठक के लिए स्पष्ट रखते हुए पात्र की पहचान में निहित अनिश्चितता को पूरी तरह नहीं मिटाता।
- source_word: אֲשֶׁר יֻסַּךְ בָּהֵן
  choice: जिनसे अर्घ उंडेला जाएगा
  rationale: נסך का निष्क्रिय रूप धार्मिक रीति में द्रव-अर्पण उंडेलने को सूचित करता है। ‘अर्घ’ इस उपासना-संबंधी अर्थ को संक्षेप और गरिमा से व्यक्त करता है।
- source_word: זָהָב טָהוֹר
  choice: शुद्ध सोना
  rationale: यह तंबू के निर्माण-विवरण में सामग्री के लिए मानक और स्वाभाविक हिंदी अभिव्यक्ति है।
- source_word: וְעָשִׂיתָ ... תַּעֲשֶׂה אֹתָם
  choice: तू ... बनाना; उन्हें ... बनाना
  rationale: एकवचन संबोधन और दोहराई गई निर्माण-आज्ञा को सहज आधुनिक हिंदी में सुरक्षित रखा गया है।
theological_decisions:
- issue: נסך के धार्मिक अर्थ को स्पष्ट करना
  choice: अर्घ उंडेला जाएगा
  alternative: जिनसे उंडेला जाएगा
  rationale: क्रिया इस प्रसंग में सामान्य उंडेलने के बजाय धार्मिक द्रव-अर्पण को सूचित करती है; ‘अर्घ’ उस अर्थ को स्पष्ट करता है, पर द्रव के प्रकार को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, स्पष्ट आज्ञात्मक शैली रखी गई है। ‘तू’ मूल इब्रानी के एकवचन संबोधन को दर्शाता है। पात्रों के दुर्लभ नामों के लिए सामान्य हिंदी शब्द चुने गए हैं और वास्तविक शाब्दिक अनिश्चितता पादटिप्पणियों में रखी गई है।
