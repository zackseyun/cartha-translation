  text: וְ/צִפִּיתָ֤ אֹת/וֹ֙ זָהָ֣ב טָה֔וֹר מִ/בַּ֥יִת וּ/מִ/ח֖וּץ תְּצַפֶּ֑/נּוּ וְ/עָשִׂ֧יתָ עָלָ֛י/ו זֵ֥ר זָהָ֖ב סָבִֽיב׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/011.yaml
  text: You shall overlay it with pure gold; from the inside and from the outside you shall overlay it[a], and you shall make on it a gold molding all around.
translation:
  language: hi
  text: तू उसे शुद्ध सोने से मढ़ना; भीतर और बाहर से उसे मढ़ना, और उसके चारों ओर सोने की सजावटी किनारी[a] बनाना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सोने का घेरा’ अथवा ‘सोने की पट्टी’; परम्परागत अनुवाद ‘सोने का मुकुट’ है। इब्रानी शब्द זֵר वस्तु के चारों ओर बनी सजावटी किनारी को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִפִּיתָ / תְּצַפֶּנּוּ
  choice: मढ़ना / उसे मढ़ना
  rationale: इस निर्माण-संदर्भ में צפה किसी वस्तु की सतह पर सोने की परत चढ़ाने को दर्शाता है। ‘मढ़ना’ आधुनिक हिन्दी में संक्षिप्त, स्वाभाविक और शिल्प-संदर्भ के अनुकूल है।
- source_word: זָהָב טָהוֹר
  choice: शुद्ध सोना
  rationale: यह पद परिष्कृत और मिलावट-रहित सोने को सूचित करता है; ‘शुद्ध सोना’ सामान्य और सटीक हिन्दी अभिव्यक्ति है।
- source_word: מִבַּיִת וּמִחוּץ
  choice: भीतर और बाहर से
  rationale: दोनों शब्द सन्दूक की भीतरी और बाहरी सतहों के बीच स्पष्ट समानांतर विरोध रखते हैं। हिन्दी में ‘भीतर और बाहर से’ इस अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְעָשִׂיתָ עָלָיו
  choice: उसके ... बनाना
  rationale: עַל यहाँ सन्दूक पर किनारी लगाए या बनाए जाने का बोध देता है। हिन्दी वाक्य-विन्यास में ‘उसके चारों ओर ... बनाना’ स्थान-संबंध को स्पष्ट और सहज रखता है।
- source_word: זֵר
  choice: सजावटी किनारी
  rationale: זֵר यहाँ वस्तु के चारों ओर बनी अलंकारिक उठी हुई पट्टी या किनारी है। ‘सजावटी किनारी’ सामान्य पाठक को आशय स्पष्ट करती है और ‘मुकुट’ से उत्पन्न हो सकने वाली भ्रामक छवि से बचाती है।
- source_word: סָבִיב
  choice: चारों ओर
  rationale: यह शब्द वस्तु को सब ओर से घेरने का भाव देता है; ‘चारों ओर’ आधुनिक हिन्दी में स्वाभाविक और पूर्ण अभिव्यक्ति है।
