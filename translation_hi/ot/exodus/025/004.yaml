    reason: lexical_alternative
lexical_decisions:
- source_word: תְּכֵלֶת
  choice: नीला
  rationale: यह शब्द नीले अथवा नील-बैंगनी रंग से रंगी हुई वस्त्र-सामग्री को दर्शाता है। सामग्री की सूची में संक्षिप्त रंग-नाम स्वाभाविक है और वस्त्र-संदर्भ आगे के पदों से स्पष्ट होता है।
- source_word: אַרְגָּמָן
  choice: बैंगनी
  rationale: यह महँगे बैंगनी रंग से रंगी वस्त्र-सामग्री का सामान्य पद है; सूची में ‘बैंगनी’ स्पष्ट और स्वाभाविक है।
- source_word: תוֹלַעַת שָׁנִי
  choice: सुर्ख लाल धागा[a]
  rationale: शाब्दिक अभिव्यक्ति कीट से प्राप्त लाल रंग की ओर संकेत करती है। प्रसंग में रंगे हुए धागे की सामग्री अभिप्रेत है, इसलिए अर्थ को मुख्य पाठ में और स्रोत-संबंधी बिंब को पादटिप्पणी में रखा गया है।
- source_word: שֵׁשׁ
  choice: महीन सन का कपड़ा
  rationale: मिलापवाले तंबू के वस्त्र-संदर्भ में यह शब्द उत्तम गुणवत्ता वाले सन के वस्त्र को दर्शाता है। यह अनुवाद आधुनिक पाठक के लिए ‘लिनन’ से अधिक पारदर्शी है।
- source_word: עִזִּים
  choice: बकरी के बाल[b]
  rationale: इब्रानी में शाब्दिक रूप से ‘बकरियाँ’ है, पर सामग्री की इस सूची और तंबू के आवरणों के संदर्भ में उनसे प्राप्त बाल अभिप्रेत हैं।
