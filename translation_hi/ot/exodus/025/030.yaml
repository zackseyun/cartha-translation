  yaml_path: translation/ot/exodus/025/030.yaml
  text: And you shall set the bread of the Presence on the table before me continually[a].
translation:
  language: hi
  text: और मेज़ पर मेरे सामने उपस्थिति की रोटी सदा रखना।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: “उपस्थिति की रोटी”; परंपरागत रूप से इसे “दर्शन की रोटी” भी कहा जाता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/נָתַתָּ
  choice: और … रखना
  rationale: נתן का अर्थ यहाँ किसी वस्तु को उसके नियत स्थान पर रखना है। आज्ञार्थक भाव वाले हिब्रू पूर्ण रूप को स्वाभाविक आधुनिक हिन्दी में ‘रखना’ से व्यक्त किया गया है।
- source_word: עַל הַ/שֻּׁלְחָן
  choice: मेज़ पर
  rationale: पूर्वसर्ग עַל स्थान को सूचित करता है और निश्चित संज्ञा उस विशेष मेज़ की ओर संकेत करती है जिसका वर्णन पहले हुआ है।
- source_word: לֶחֶם פָּנִים
  choice: उपस्थिति की रोटी
  rationale: इस इब्रानी संबंध-पदबंध का शाब्दिक भाव ‘मुख/उपस्थिति की रोटी’ है। ‘उपस्थिति की रोटी’ पारिभाषिक धार्मिक अर्थ को सुरक्षित रखते हुए ‘भेंट की रोटी’ जैसे व्याख्यात्मक विस्तार से बचता है।
- source_word: לְ/פָנַ/י
  choice: मेरे सामने
  rationale: इसका शाब्दिक भाव ‘मेरे मुख के सामने’ है; ‘मेरे सामने’ सीधा, स्वाभाविक और ईश्वर के प्रत्यक्ष कथन के अनुरूप है।
- source_word: תָּמִיד
  choice: सदा
  rationale: याजकीय संदर्भ में यह निरंतर अथवा नियमित रूप से जारी रहने वाली व्यवस्था को दर्शाता है। ‘सदा’ संक्षिप्त है और उस स्थायी अनुष्ठानिक दायित्व को व्यक्त करता है।
theological_decisions:
- issue: लֶחֶם פָּנִים का उपासना-संबंधी अर्थ
  choice: उपस्थिति की रोटी
  alternative: भेंट की रोटी; दर्शन की रोटी; मेरे सामने रखी जाने वाली रोटी
  rationale: चुना गया अनुवाद इब्रानी पद की ‘उपस्थिति’ संबंधी अर्थ-छाया को बनाए रखता है और अगले अलग पद לְפָנַי (‘मेरे सामने’) को उसी में मिलाकर मूल की अभिव्यक्ति को सपाट नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण आज्ञात्मक विधान। ‘मेज़’ सामान्य पाठक के लिए स्वाभाविक है। ‘उपस्थिति की रोटी’ कुछ पारिभाषिक है, इसलिए उसका अर्थ और परंपरागत विकल्प पादटिप्पणी में दिया गया है।
