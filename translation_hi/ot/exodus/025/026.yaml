  - marker: b
    text: शाब्दिक रूप से “पैरों”; इब्रानी शब्द संदर्भ के अनुसार “पैर” या “पाया” बता सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: और ... बनाना
  rationale: निर्देशों की शृंखला में संयोजक सहित पूर्ण क्रिया आदेश का भाव देती है; हिंदी में ‘बनाना’ निर्माण-संबंधी निर्देश की स्वाभाविक शैली है।
- source_word: לּוֹ
  choice: उसके लिए
  rationale: पुल्लिंग एकवचन प्रत्यय संदर्भ में मेज़ की ओर संकेत करता है; हिंदी में निर्जीव वस्तु के लिए यह स्वाभाविक है।
- source_word: אַרְבַּע טַבְּעֹת זָהָב
  choice: सोने के चार छल्ले
  rationale: यह सामग्री और संख्या दोनों को स्पष्ट, सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: וְנָתַתָּ
  choice: लगाना
  rationale: यहाँ נָתַן का अर्थ निर्दिष्ट स्थान पर छल्लों को स्थापित करना है; ‘लगाना’ फर्नीचर-निर्माण के संदर्भ में ‘रखना’ से अधिक स्वाभाविक है।
- source_word: עַל
  choice: पर
  rationale: यह निर्दिष्ट स्थान पर संलग्न करने या रखने का सामान्य स्थानवाचक संबंध व्यक्त करता है।
- source_word: אַרְבַּע הַפֵּאֹת
  choice: चार कोनों
  rationale: פֵּאָה छोर, किनारा या कोना बता सकता है; मेज़ पर छल्ले लगाने के संदर्भ में ‘कोने’ सबसे संभावित और सहज अर्थ है, जबकि विकल्प पादटिप्पणी में सुरक्षित हैं।
- source_word: אֲשֶׁר לְאַרְבַּע רַגְלָיו
  choice: जो उसके चार पायों के पास हैं
  rationale: רֶגֶל शरीर के पैर तथा वस्तु के पाए, दोनों के लिए प्रयुक्त हो सकता है। मेज़ के संदर्भ में ‘पाए’ स्वाभाविक है; לְ का स्थानिक/संबंधवाचक भाव ‘के पास’ से व्यक्त किया गया है।
