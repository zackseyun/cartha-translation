  yaml_path: translation/ot/exodus/025/017.yaml
  text: And you shall make a mercy seat of pure gold; its length shall be two cubits and a half[a], and its width a cubit and a half.
translation:
  language: hi
  text: “तुम शुद्ध सोने का प्रायश्चित्त का आवरण[a] बनाओ। उसकी लंबाई ढाई हाथ और चौड़ाई डेढ़ हाथ हो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दया-आसन।” इब्रानी शब्द כַּפֹּרֶת वाचा के संदूक पर रखे सोने के आवरण का नाम है और प्रायश्चित्त से संबंधित כפר धातु से जुड़ा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: तुम ... बनाना
  rationale: निर्देशों के इस प्रसंग में संयोजक के साथ आया पूर्ण क्रियारूप आज्ञार्थक बल रखता है। यह रचना आधुनिक हिंदी में स्वाभाविक ढंग से उस निर्देश को व्यक्त करती है।
- source_word: כַפֹּרֶת
  choice: प्रायश्चित्त-ढकना
  rationale: यह शब्द वाचा के संदूक पर रखे जाने वाले विशिष्ट सोने के ढकने का नाम है और כפר धातु से संबंधित है। ‘प्रायश्चित्त-ढकना’ वस्तु और उसके उपासना-संबंधी अर्थ दोनों को व्यक्त करता है; पारंपरिक विकल्प पाद-टिप्पणी में दिया गया है।
- source_word: זָהָב טָהוֹר
  choice: शुद्ध सोने का
  rationale: यह सहज हिंदी में सामग्री और उसकी शुद्धता, दोनों को स्पष्ट रूप से व्यक्त करता है।
- source_word: אַמָּתַיִם וָחֵצִי
  choice: ढाई हाथ
  rationale: प्राचीन माप אַמָּה को प्रचलित हिंदी बाइबलीय इकाई ‘हाथ’ से व्यक्त किया गया है और मात्रा को स्वाभाविक हिंदी क्रम में रखा गया है।
- source_word: אָרְכָּהּ
  choice: उसकी लंबाई
  rationale: स्त्रीलिंग एकवचन प्रत्यय का संदर्भ प्रायश्चित्त-ढकने से है; हिंदी में ‘उसकी’ इस संबंध को स्पष्ट और सहज बनाता है।
- source_word: וְאַמָּה וָחֵצִי
  choice: और ... डेढ़ हाथ
  rationale: मात्रा का ठीक अर्थ रखते हुए इसे स्वाभाविक हिंदी रूप में व्यक्त किया गया है।
- source_word: רָחְבָּהּ
  choice: चौड़ाई
  rationale: यह आयाम-सूचक संज्ञा और उसके प्रत्यय का संक्षिप्त, स्पष्ट हिंदी रूप है; पहले आए ‘उसकी’ का संबंध दोनों आयामों पर स्वाभाविक रूप से लागू होता है।
theological_decisions:
- issue: उपासना और प्रायश्चित्त से जुड़े כַפֹּרֶת का अनुवाद
  choice: प्रायश्चित्त-ढकना
  alternative: दया-आसन; ढकना
  rationale: संदर्भ में यह संदूक के सोने के ऊपरी ढकने का विशिष्ट नाम है, मात्र कोई सामान्य ढक्कन नहीं। मूल शब्द का כפר से संबंध प्रायश्चित्त की धारणा को उपस्थित करता है, फिर भी ‘दया-आसन’ जैसी पारंपरिक व्याख्यात्मक अभिव्यक्ति को मुख्य पाठ में थोपने के बजाय विकल्प के रूप में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और निर्देशात्मक रखी गई है। ‘ढाई हाथ’ और ‘डेढ़ हाथ’ सामान्य हिंदी पाठक के लिए सहज हैं और प्राचीन माप को मीट्रिक इकाई में बदले बिना सुरक्षित रखते हैं।
