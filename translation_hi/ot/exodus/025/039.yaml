    reason: metrological_clarification
lexical_decisions:
- source_word: כִּכָּר
  choice: एक किक्कार
  rationale: यह प्राचीन भार-माप का नाम है। पारंपरिक बाइबलीय माप-शब्द को बनाए रखना किसी अनुमानित आधुनिक भार में बदलने से अधिक सटीक है।
- source_word: זָהָב טָהוֹר
  choice: शुद्ध सोना
  rationale: कारीगरी के इस प्रसंग में यह पदार्थ की शुद्धता बताता है; आधुनिक हिन्दी में ‘शुद्ध सोना’ स्वाभाविक और स्पष्ट है।
- source_word: יַעֲשֶׂה
  choice: वह ... बनाए
  rationale: इब्रानी रूप क़ाल अपूर्ण, अन्य पुरुष एकवचन है और यहाँ निर्देशात्मक अर्थ रखता है। ‘बनाए’ हिन्दी में विधिक निर्देश को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֹתָהּ
  choice: इसे
  rationale: स्त्रीलिंग एकवचन कर्म-सर्वनाम पिछले प्रसंग की दीपवृक्ष की ओर संकेत करता है; सर्वनाम बनाए रखने से मूल की संक्षिप्तता सुरक्षित रहती है।
- source_word: אֵת כָּל הַכֵּלִים הָאֵלֶּה
  choice: और इसके इन सभी उपकरणों को
  rationale: כֵּלִים व्यापक शब्द है, जो दीपवृक्ष से संबंधित औज़ार, पात्र या अन्य सामान को समेट सकता है। ‘उपकरणों’ मुख्य अर्थ को सहज हिन्दी में रखता है, जबकि ‘इसके’ प्रसंगगत संबंध स्पष्ट करता है।
