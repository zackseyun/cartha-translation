  yaml_path: translation/ot/exodus/025/032.yaml
  text: 'And six branches shall come out from its sides: three branches of the lampstand from its one side[a], and three branches of the lampstand from its other side.'
translation:
  language: hi
  text: और उसकी दोनों ओर से छः शाखाएँ निकलेंगी—दीपाधार की तीन शाखाएँ उसकी एक ओर से और दीपाधार की तीन शाखाएँ उसकी दूसरी ओर से।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָנִים
  choice: शाखाएँ
  rationale: इस प्रसंग में यह शब्द दीपाधार से बाहर निकलने वाले भुजाकार भागों को दर्शाता है। ‘शाखाएँ’ उसके वृक्ष-सदृश रूपक को बनाए रखता है और आधुनिक हिन्दी में सहज है।
- source_word: יֹצְאִים
  choice: निकलेंगी
  rationale: यह शाखाओं के दीपाधार की ओरों से बाहर आने या फैलने का वर्णन करता है और निर्माण-निर्देश के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִצִּדֶּיהָ
  choice: उसकी दोनों ओर से
  rationale: मूल में बहुवचन ‘उसकी ओरों से’ है; अगले वाक्यांश में एक ओर और दूसरी ओर का स्पष्ट उल्लेख होने के कारण ‘दोनों ओर से’ हिन्दी में स्वाभाविक और सटीक है।
- source_word: קְנֵי מְנֹרָה
  choice: दीपाधार की ... शाखाएँ
  rationale: यह रचना-संबंध को स्पष्ट रखता है और मूल में पदबंध की पुनरावृत्ति को भी बनाए रखता है।
- source_word: מְנֹרָה
  choice: दीपाधार
  rationale: यह सामान्य संज्ञा के अर्थ का अनुवाद करता है और केवल ‘दीप’ कहने से होने वाली वस्तुगत अस्पष्टता से बचाता है।
- source_word: הָאֶחָד ... הַשֵּׁנִי
  choice: एक ओर ... दूसरी ओर
  rationale: यह मूल के ‘एक’ और ‘दूसरी’ के संतुलित विरोध को आधुनिक हिन्दी में स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
