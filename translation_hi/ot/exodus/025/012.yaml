base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/012.yaml
  text: 'And you shall cast four rings of gold for it and put them on its four feet: two rings on one side of it and two rings on its second side[a].'
translation:
  language: hi
  text: उसके लिए सोने के चार छल्ले ढालना और उन्हें उसके चार पायों[a] पर लगाना—उसकी एक ओर दो छल्ले और उसकी दूसरी ओर दो छल्ले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके चार कोनों”; यहाँ प्रयुक्त इब्रानी शब्द कठिन है, पर सम्भवतः वह केवल कोनों के बजाय सन्दूक के निचले आधारों या पायों को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצַקְתָּ
  choice: ढालना
  rationale: सोने के उपकरण बनाने के प्रसंग में יצק धातु को साँचे में ढालने का अर्थ देता है; ‘ढालना’ आधुनिक हिन्दी में सटीक और स्वाभाविक है।
- source_word: טַבְּעֹת
  choice: कड़े
  rationale: यह शब्द उन धातु के छल्लेनुमा उपकरणों को दर्शाता है जिनमें उठाने वाले डंडे डाले जाते थे। इस वस्तु-निर्माण प्रसंग में ‘कड़े’ स्पष्ट और प्रचलित है।
- source_word: זָהָב
  choice: सोने के
  rationale: यह सामग्री का सीधा उल्लेख है; हिन्दी वाक्य में संबंधसूचक रूप स्वाभाविक है।
- source_word: וְנָתַתָּה
  choice: लगाना
  rationale: נתן का मूल अर्थ व्यापक है, पर यहाँ कड़ों को सन्दूक पर स्थापित या जोड़ने की क्रिया अभिप्रेत है; ‘लगाना’ सहज आधुनिक हिन्दी है।
- source_word: פַּעֲמֹתָיו
  choice: उसके चार पायों
  rationale: यह कठिन पद सम्भवतः सन्दूक के निचले आधारों या पायों को दर्शाता है। ‘पायों’ ठोस बिंब बनाए रखता है; ‘कोनों’ को पाठ में निश्चित मानने के बजाय पादटिप्पणी में विकल्प दिया गया है।
- source_word: צַלְעוֹ
  choice: उसकी ... बगल में
  rationale: वस्तु या स्थापत्य के सन्दर्भ में צלע पार्श्व या बगल को दर्शाता है। ‘बगल’ सन्दूक की दोनों लंबी पार्श्व सतहों के लिए स्पष्ट और स्वाभाविक है।
- source_word: הָאֶחָת ... הַשֵּׁנִית
  choice: एक ... दूसरी
  rationale: हिब्रू की क्रमिक भिन्नता को हिन्दी में स्वाभाविक रूप से ‘एक ... दूसरी’ द्वारा व्यक्त किया गया है।
