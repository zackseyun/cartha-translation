  text: וּ/בַ/מְּנֹרָ֖ה אַרְבָּעָ֣ה גְבִעִ֑ים מְשֻׁקָּדִ֔ים כַּפְתֹּרֶ֖י/הָ וּ/פְרָחֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/034.yaml
  text: And on the lampstand there shall be four cups made like almond blossoms[b][a], with its buds and its flowers.
translation:
  language: hi
  text: और दीपवृक्ष पर बादाम के फूलों के समान बनाए हुए चार कटोरे हों[a], साथ ही उसकी कलियाँ[b] और उसके फूल।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बादाम के आकार के” अथवा “बादाम के फूलों से सजाए हुए।” इब्रानी में कटोरों का वर्णन बादाम-वृक्ष की छवि से किया गया है; इससे उनकी आकृति या उनकी सजावट का बोध हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “उसकी गाँठें।” इब्रानी शब्द दीपवृक्ष पर बनी गोल, उभरी हुई सजावटी आकृति को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/מְּנֹרָה
  choice: और दीपवृक्ष पर
  rationale: संयोजक और पूर्वसर्ग को स्वाभाविक हिन्दी में ‘और ... पर’ कहा गया है। מְנֹרָה तम्बू के प्रकाश-उपकरण, अर्थात पूरे दीपवृक्ष, को दर्शाता है।
- source_word: אַרְבָּעָה גְבִעִים
  choice: चार कटोरे
  rationale: גְבִעִים कटोरे या प्याले जैसी आकृतियों को दर्शाता है; सजावटी बनावट के इस प्रसंग में ‘कटोरे’ स्पष्ट और स्वाभाविक है।
- source_word: מְשֻׁקָּדִים
  choice: बादाम के फूलों के समान बनाए हुए
  rationale: बादाम से व्युत्पन्न यह रूप आकृति या अलंकरण—दोनों की ओर संकेत कर सकता है। यह अनुवाद पुष्पाकार नमूने को स्पष्ट करता है, पर निर्माण की ठीक विधि को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: כַּפְתֹּרֶיהָ
  choice: उसकी कलियाँ
  rationale: यह शब्द दीपवृक्ष की गोल उभरी हुई सजावटी आकृतियों के लिए है। पुष्प-विन्यास के संदर्भ में ‘कलियाँ’ स्वाभाविक है, यद्यपि ‘गाँठें’ भी संभव है।
- source_word: וּפְרָחֶיהָ
  choice: और उसके फूल
  rationale: פֶּרַח का सामान्य अर्थ फूल या पुष्प है; ‘फूल’ साधारण पाठक के लिए स्पष्ट है और ‘कलियाँ’ के साथ स्वाभाविक जोड़ी बनाता है।
