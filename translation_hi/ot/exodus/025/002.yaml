source:
  edition: WLC
  text: דַּבֵּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/יִקְחוּ לִ֖/י תְּרוּמָ֑ה מֵ/אֵ֤ת כָּל אִישׁ֙ אֲשֶׁ֣ר יִדְּבֶ֣/נּוּ לִבּ֔/וֹ תִּקְח֖וּ אֶת תְּרוּמָתִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/002.yaml
  text: Speak to the sons of Israel[a], that they take an offering for me. From every man whose heart moves him[c][b], you shall take my offering.
translation:
  language: hi
  text: “इस्राएल के पुत्रों[a] से कह कि वे मेरे लिए भेंट[b] लें। हर उस पुरुष से, जिसका मन उसे प्रेरित करे[c], तुम मेरी भेंट लेना।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “इस्राएल के पुत्र”; यह इस्राएल के लोगों के लिए प्रचलित वाचा-संबंधी संबोधन है।
    reason: cultural_note
  - marker: b
    text: या “योगदान।” हिब्रू शब्द उस वस्तु या अंश को दर्शाता है जिसे पवित्र उपयोग के लिए अलग करके दिया जाता है।
    reason: lexical_alternative
  - marker: c
    text: या “जिसका मन उसे उभारे” अथवा “जिसका मन उसे तत्पर करे।” हिब्रू मुहावरा भीतर से उठने वाली स्वैच्छिक इच्छा पर बल देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל־בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों से कह
  rationale: एकवचन पिएल आज्ञार्थक דַּבֵּר को सीधे आज्ञार्थक ‘कह’ से व्यक्त किया गया है। בְּנֵי יִשְׂרָאֵל का पारिवारिक-वाचक रूप ‘इस्राएल के पुत्र’ रखा गया है, जबकि पादटिप्पणी इसका सामुदायिक अर्थ स्पष्ट करती है।
- source_word: וְיִקְחוּ לִי
  choice: कि वे मेरे लिए ... इकट्ठी करें
  rationale: आज्ञा के बाद आया अपूर्ण क्रियारूप निर्देशित परिणाम को व्यक्त करता है। इस संग्रह-संदर्भ में केवल ‘लें’ की अपेक्षा ‘इकट्ठी करें’ स्वाभाविक हिन्दी है और अगले वाक्य के ‘लेना’ से अर्थगत संबंध बनाए रखता है।
- source_word: תְּרוּמָה
  choice: भेंट
  rationale: यह शब्द पवित्र काम के लिए अलग करके दिए गए अंश या योगदान को दर्शाता है। ‘भेंट’ इसके परमेश्वर-समर्पित स्वरूप को व्यक्त करती है, बिना इसे किसी विशेष बलिदान-विधि तक सीमित किए।
- source_word: מֵאֵת כָּל־אִישׁ
  choice: हर उस पुरुष से
  rationale: वितरणात्मक एकवचन כָּל־אִישׁ तथा उसके पुल्लिंग रूप को स्पष्ट रखा गया है।
- source_word: אֲשֶׁר יִדְּבֶנּוּ לִבּוֹ
  choice: जिसका मन उसे देने के लिए प्रेरित करे
  rationale: हिब्रू मुहावरे में भीतर से उठने वाली स्वैच्छिक तत्परता है। ‘मन ... प्रेरित करे’ हृदय/मन की प्रेरणा की छवि और स्वेच्छा, दोनों को सहज हिन्दी में बनाए रखता है।
- source_word: תִּקְחוּ אֶת־תְּרוּמָתִי
  choice: तुम लोग मेरी भेंट लेना
  rationale: बहुवचन संबोधन को ‘तुम लोग’ से स्पष्ट किया गया है। ‘लेना’ לקח की मूल शब्दावली तथा ‘मेरी भेंट’ में परमेश्वर के अधिकार-सूचक प्रत्यय को बनाए रखता है।
theological_decisions:
- issue: मिलापवाले तंबू के लिए תְּרוּמָה का अर्थ
  choice: भेंट
  alternative: योगदान
  rationale: ‘भेंट’ दान के परमेश्वर की ओर समर्पित और पवित्र उपयोग के लिए अलग किए जाने को व्यक्त करती है। ‘योगदान’ संभव है और संग्रह के स्वैच्छिक स्वरूप को उभारता है, इसलिए उसे पादटिप्पणी में रखा गया है।
- issue: אֲשֶׁר יִדְּבֶנּוּ לִבּוֹ में स्वैच्छिकता
  choice: जिसका मन उसे देने के लिए प्रेरित करे
  alternative: जो अपनी इच्छा से देना चाहे
  rationale: मुख्य पाठ हिब्रू की ‘मन/हृदय प्रेरित करता है’ वाली सजीव छवि को सुरक्षित रखता है और स्वैच्छिक आंतरिक प्रेरणा को किसी बाहरी दबाव या धार्मिक बाध्यता में नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘इस्राएल के पुत्र’ औपचारिक स्रोत-सन्निकट पद है; उसका सामुदायिक आशय पादटिप्पणी में बताया गया है। एकवचन ‘कह’ और बहुवचन ‘तुम लोग ... लेना’ मूल पाठ में संबोधन के व्याकरणिक परिवर्तन को सुरक्षित रखते हैं।
