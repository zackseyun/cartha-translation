  text: And let them make a sanctuary for me[a], so that I may dwell among them.
translation:
  language: hi
  text: वे मेरे लिए एक पवित्र स्थान बनाएँ, ताकि मैं उनके बीच[a] निवास करूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उनके मध्य।” हिब्रू में “उनके बीच” है; यह परमेश्वर की लोगों के साथ उपस्थिति पर बल देता है, न कि केवल पवित्र स्थान की संरचना के भीतर।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשׂוּ
  choice: वे बनाएँ
  rationale: निर्देशात्मक संदर्भ में यह रूप तीसरे पुरुष बहुवचन की आज्ञार्थक अपेक्षा व्यक्त करता है; आधुनिक हिन्दी में “वे बनाएँ” स्वाभाविक और स्पष्ट है।
- source_word: לִי
  choice: मेरे लिए
  rationale: 'यहाँ לִי उद्देश्य अथवा हित का भाव देता है: पवित्र-स्थान परमेश्वर के लिए बनाया जाना है।'
- source_word: מִקְדָּשׁ
  choice: पवित्र-स्थान
  rationale: מִקְדָּשׁ परमेश्वर की उपस्थिति के लिए अलग किए गए पवित्र स्थान को सूचित करता है। “पवित्र-स्थान” सामान्य पाठक के लिए अर्थ को सीधे और गरिमापूर्वक व्यक्त करता है।
- source_word: וְשָׁכַנְתִּי
  choice: ताकि मैं ... निवास करूँ
  rationale: שׁכן का अर्थ बसना या निवास करना है। प्रसंग में यह खंड पवित्र-स्थान बनाए जाने के उद्देश्य अथवा परिणाम को व्यक्त करता है; “ताकि” इस संबंध को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: בְּתוֹכָם
  choice: उनके बीच
  rationale: हिब्रू पद का शाब्दिक भाव “उनके मध्य” है और प्रत्यय बहुवचन है। “उनके बीच” यह स्पष्ट रखता है कि परमेश्वर लोगों के बीच निवास करेंगे, केवल भवन के भीतर नहीं।
theological_decisions:
- issue: परमेश्वर के निवास का संदर्भ
  choice: उनके बीच
  alternative: उसमें
  rationale: हिब्रू में प्रत्यय बहुवचन “उनके” है, एकवचन “उसमें” नहीं। इसलिए अनुवाद परमेश्वर की इस्राएली समुदाय के बीच उपस्थिति को बनाए रखता है और उसे केवल पवित्र-स्थान के भवन तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। “पवित्र-स्थान” स्रोत के पवित्र स्थान के अर्थ को सीधे व्यक्त करता है, जबकि “उनके बीच” मूल के बहुवचन सामुदायिक बल को सुरक्षित रखता है।
