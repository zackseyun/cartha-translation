source:
  edition: WLC
  text: וְ/עָשִׂ֛יתָ שְׁנַ֥יִם כְּרֻבִ֖ים זָהָ֑ב מִקְשָׁה֙ תַּעֲשֶׂ֣ה אֹתָ֔/ם מִ/שְּׁנֵ֖י קְצ֥וֹת הַ/כַּפֹּֽרֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/018.yaml
  text: And you shall make two cherubim of gold; of hammered work you shall make them[a], at the two ends of the mercy seat.
translation:
  language: hi
  text: और तुम सोने के दो करूब बनाओ; उन्हें प्रायश्चित-आवरण[a] के दोनों सिरों पर ठोक-पीटकर गढ़ो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अर्थात वाचा के सन्दूक का आवरण; पारंपरिक अनुवाद: “दया-आसन।”'
    reason: הַכַּפֹּרֶת के वस्तुगत अर्थ और पारंपरिक उपासना-संबंधी नाम—दोनों को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: और तुम ... बनाना
  rationale: निर्देशात्मक प्रसंग में संयोजक सहित यह क्रियारूप आज्ञा का कार्य करता है। ‘और तुम ... बनाना’ इब्रानी निर्देशों के क्रम को रखते हुए स्वाभाविक आधुनिक हिन्दी है।
- source_word: שְׁנַיִם כְּרֻבִים זָהָב
  choice: सोने के दो करूब
  rationale: संख्या और सामग्री दोनों स्पष्ट रखे गए हैं। ‘करूब’ विशिष्ट स्वर्गीय प्राणियों के पारंपरिक नाम को सुरक्षित रखता है और भ्रामक वर्णनात्मक विस्तार नहीं जोड़ता।
- source_word: מִקְשָׁה
  choice: पीटकर गढ़े हुए काम के रूप में
  rationale: यह धातु को पीटकर आकार देने की कारीगरी बताता है। अनुवाद निर्माण-विधि स्पष्ट करता है, पर ‘एक ही टुकड़े से’ जैसी संदर्भगत सम्भावना को मूल शब्द का अनिवार्य अर्थ नहीं बनाता।
- source_word: תַּעֲשֶׂה אֹתָם
  choice: उन्हें ... बनाना
  rationale: मूल में ‘बनाना’ क्रिया की पुनरावृत्ति है; निर्माण की रीति पर दिए गए बल को बनाए रखने के लिए हिन्दी में भी इसे रखा गया है।
- source_word: מִשְּׁנֵי קְצֹוֹת
  choice: दोनों सिरों पर
  rationale: यह आवरण के दोनों छोरों से सम्बद्ध स्थान को स्वाभाविक हिन्दी में व्यक्त करता है, बिना अनावश्यक रूप से यह तय किए कि आकृतियाँ अलग से लगाई गई थीं या उन्हीं छोरों से अभिन्न रूप में गढ़ी गई थीं।
- source_word: הַכַּפֹּרֶת
  choice: प्रायश्चित-आवरण
  rationale: यह सन्दूक के विशिष्ट आवरण को उसके अनुष्ठानिक प्रायश्चित-संबंध सहित संक्षेप और गरिमा से व्यक्त करता है। शाब्दिक और पारंपरिक विकल्प पादटिप्पणी में दिए गए हैं।
theological_decisions:
- issue: मिलापवाले तम्बू के प्रसंग में הַכַּפֹּרֶת का अनुवाद
  choice: प्रायश्चित-आवरण
  alternative: सन्दूक का ढकना; दया-आसन
  rationale: वस्तु वास्तव में सन्दूक का आवरण है और अनुष्ठानिक रूप से प्रायश्चित से जुड़ी है। मुख्य पाठ में दोनों पहलुओं का संकेत रखा गया है; पादटिप्पणी पारंपरिक ‘दया-आसन’ को दर्ज करती है, पर किसी एक बाद की धर्मवैज्ञानिक व्याख्या को मूल में आरोपित नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी; निर्देशात्मक और गरिमापूर्ण शैली। ‘तुम’ सामान्य आधुनिक सम्बोधन है। तकनीकी वस्तु-नाम को समझने योग्य रखने के लिए ‘प्रायश्चित-आवरण’ चुना गया है और पादटिप्पणी में उसका अर्थ खोला गया है।
