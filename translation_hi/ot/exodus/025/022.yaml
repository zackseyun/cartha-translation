base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/022.yaml
  text: And there I will meet with you[a], and I will speak with you from above the mercy seat, from between the two cherubim that are over the ark of the testimony[b], about all that I will command you for the sons of Israel.
translation:
  language: hi
  text: और वहाँ मैं तुमसे मिलूँगा और उस प्रायश्चित्त-आवरण[a] के ऊपर से, उन दोनों करूबों के बीच से जो साक्षी-पत्र के सन्दूक के ऊपर हैं, उन सब बातों के विषय में तुमसे बात करूँगा जिनकी आज्ञा मैं तुम्हें इस्राएल के पुत्रों के लिए दूँगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अनुग्रहासन।” इब्रानी शब्द सन्दूक के सोने के आवरण को दर्शाता है और प्रायश्चित्त से शब्दगत रूप से संबंधित है।
    reason: lexical_alternative
  - marker: b
    text: या “इस्राएल के पुत्रों को।” इब्रानी पूर्वसर्ग का शाब्दिक अर्थ “को/की ओर” है; आशय यह है कि मूसा को दी गई आज्ञाएँ इस्राएल तक पहुँचाई जाएँ।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנוֹעַדְתִּי לְךָ שָׁם
  choice: और वहाँ मैं तुमसे मिला करूँगा
  rationale: निफ़अल रूप यहाँ नियत स्थान पर बार-बार होने वाली भेंट का भाव रखता है। ‘मिला करूँगा’ उस नियमित भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְדִבַּרְתִּי אִתְּךָ
  choice: और तुमसे ... बोलूँगा
  rationale: אִתְּךָ प्रत्यक्ष संवाद का भाव देता है; इसलिए ‘तुमसे बोलूँगा’ केवल ‘तुम्हें बताऊँगा’ की अपेक्षा अधिक निकट है।
- source_word: מֵעַל הַכַּפֹּרֶת
  choice: प्रायश्चित्त-आवरण के ऊपर से
  rationale: כַּפֹּרֶת संदूक के विशिष्ट स्वर्ण-आवरण का नाम है और इसका प्रायश्चित्त-संबंधी धार्मिक कार्य भी है। ‘प्रायश्चित्त-आवरण’ वस्तु और धार्मिक अर्थ दोनों को सुरक्षित रखता है।
- source_word: מִבֵּין שְׁנֵי הַכְּרֻבִים
  choice: उन दोनों करूबों के बीच से
  rationale: स्थान-संबंधी वाक्यांश का निकट और स्पष्ट अनुवाद; ‘करूब’ इस विशेष स्वर्गीय प्राणी के लिए प्रचलित बाइबलीय पद है।
- source_word: אֲשֶׁר עַל אֲרֹן הָעֵדֻת
  choice: जो साक्षी-पत्र के संदूक के ऊपर हैं
  rationale: עֵדֻת को केवल अमूर्त ‘साक्षी’ कहने के बजाय ‘साक्षी-पत्र’ रखने से संदूक में रखे वाचा-साक्ष्य का संकेत मिलता है, जबकि ‘पट्टिकाएँ’ जोड़कर पाठ को अनावश्यक रूप से विशिष्ट नहीं बनाया गया।
- source_word: אֵת כָּל אֲשֶׁר אֲצַוֶּה אוֹתְךָ
  choice: उन सब बातों के विषय में ... जिनकी आज्ञा मैं तुम्हें ... दूँगा
  rationale: यह रचना परमेश्वर के बोलने की विषय-वस्तु को आगे आने वाली समस्त आज्ञाओं से जोड़ती है और כָּל की व्यापकता बनाए रखती है।
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों के लिए
  rationale: ‘इस्राएल के पुत्र’ हिब्रू के पारिवारिक राष्ट्रीय पद को सुरक्षित रखता है। ‘के लिए’ यह स्पष्ट करता है कि मूसा को दी गई आज्ञाएँ इस्राएल को संबोधित हैं; मूल पूर्वसर्ग में ‘को’ का अर्थ भी संभव है।
theological_decisions:
- issue: הַכַּפֹּרֶת का अनुवाद
  choice: प्रायश्चित्त-आवरण
  alternative: अनुग्रहासन; संदूक का ढकना
  rationale: मूल पद संदूक के स्वर्ण-आवरण को दर्शाता है और प्रायश्चित्त की क्रिया से शब्दगत रूप से जुड़ा है। ‘प्रायश्चित्त-आवरण’ किसी सिंहासन की धारणा को मुख्य पाठ में जोड़े बिना उसके धार्मिक महत्व को बनाए रखता है।
- issue: בְּנֵי יִשְׂרָאֵל का अनुवाद
  choice: इस्राएल के पुत्र
  alternative: इस्राएली; इस्राएल के लोग
  rationale: मूल का वंशगत-पारिवारिक रूप सुरक्षित रखा गया है; यहाँ यह पूरे राष्ट्रीय समुदाय के लिए प्रतिनिधिक पद है।
- issue: אֶל का संबंध और अर्थ
  choice: इस्राएल के पुत्रों के लिए
  alternative: इस्राएल के पुत्रों को
  rationale: वाक्य में आदेश मूसा को दिया जाता है, पर उसका लक्ष्य इस्राएल है। ‘के लिए’ इस संकुचित रचना को सहज हिन्दी देता है, जबकि पादटिप्पणी मूल के ‘को’ वाले संभावित पाठ को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। पवित्र वस्तुओं के तकनीकी पदों में अर्थ-स्पष्टता रखते हुए अत्यधिक संस्कृतनिष्ठ भाषा से बचा गया है। एकवचन ‘तुम’ मूसा को संबोधन दर्शाता है।
