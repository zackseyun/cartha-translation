translation:
  language: hi
  text: और उसमें से निकलने वाली दो शाखाओं के नीचे एक गाँठ, उसमें से निकलने वाली दो शाखाओं के नीचे एक गाँठ, और उसमें से निकलने वाली दो शाखाओं के नीचे एक गाँठ हो; ये दीवट से निकलने वाली छहों शाखाओं के लिए हों।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַפְתֹּר
  choice: गाँठ
  rationale: यह शब्द दीवट की सजावटी उभरी हुई गाँठ या घुंडी को दर्शाता है। आधुनिक हिंदी में ‘गाँठ’ इस संरचनात्मक उभार को सहज ढंग से व्यक्त करता है।
- source_word: קָנִים
  choice: शाखाएँ
  rationale: दीवट से दोनों ओर निकलने वाले भाग अभिप्रेत हैं; ‘शाखाएँ’ चित्रात्मकता और सामान्य बोध दोनों बनाए रखता है।
- source_word: מְנֹרָה
  choice: दीवट
  rationale: यह दीप रखने वाले पूरे पवित्र उपकरण का नाम है; ‘दीवट’ आधुनिक हिंदी बाइबलीय प्रयोग में संक्षिप्त और गरिमापूर्ण है।
- source_word: מִמֶּנָּה / מִן־הַמְּנֹרָה
  choice: उसमें से / दीवट से
  rationale: स्त्रीलिंग प्रत्यय का संदर्भ दीवट है। हिंदी वाक्य में पुनरावृत्ति की अस्पष्टता घटाने के लिए आरंभ में ‘उसमें से निकलने वाली’ और निष्कर्ष में ‘दीवट से निकलने वाली’ रखा गया है।
