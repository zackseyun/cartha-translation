    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְגֶּרֶת
  choice: पट्टी
  rationale: यह मेज़ से जुड़ी हुई संरचनात्मक घेरने वाली पट्टी को दर्शाता है। आधुनिक हिन्दी में ‘पट्टी’ स्वाभाविक है और अनावश्यक तकनीकी विशिष्टता से बचती है।
- source_word: טֹפַח
  choice: एक बित्ता चौड़ी
  rationale: यह हथेली की चौड़ाई पर आधारित प्राचीन माप है। ‘एक बित्ता चौड़ी’ माप और उसके आयामी प्रयोग दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: סָבִיב
  choice: चारों ओर
  rationale: दोनों स्थानों पर घेरने वाले विन्यास का अर्थ बनाए रखता है और हिन्दी में स्वाभाविक है।
- source_word: זֵר
  choice: सजावटी किनारी
  rationale: पवित्र-तम्बू के साज-सामान के प्रसंग में यह उठी हुई अलंकारिक किनारी या मोल्डिंग को सूचित करता है। ‘सजावटी किनारी’ आधुनिक पाठक के लिए स्पष्ट है; पारंपरिक ‘मुकुट’ को पादटिप्पणी में रखा गया है।
- source_word: זָהָב
  choice: सोने की
  rationale: सामग्री-सूचक संज्ञा का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: לּוֹ / לְמִסְגַּרְתּוֹ
  choice: उसके / उस पट्टी के
  rationale: सर्वनाम प्रसंग में पहले वर्णित मेज़ की ओर संकेत करता है। हिन्दी में संदर्भ स्पष्ट रखते हुए सर्वनामिक संबंध सुरक्षित रखा गया है।
- source_word: וְעָשִׂיתָ
  choice: तू ... बनाना
  rationale: निर्देशात्मक बल और एकवचन संबोधन को बनाए रखता है तथा निर्गमन के निर्माण-निर्देशों में स्वाभाविक, गरिमापूर्ण हिन्दी देता है।
