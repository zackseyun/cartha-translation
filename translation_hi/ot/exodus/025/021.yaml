  text: וְ/נָתַתָּ֧ אֶת הַ/כַּפֹּ֛רֶת עַל הָ/אָרֹ֖ן מִ/לְ/מָ֑עְלָ/ה וְ/אֶל הָ֣/אָרֹ֔ן תִּתֵּן֙ אֶת הָ֣/עֵדֻ֔ת אֲשֶׁ֥ר אֶתֵּ֖ן אֵלֶֽי/ךָ־־־־׃
base_translation:
