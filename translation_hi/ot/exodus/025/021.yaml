revisions:
- from: तुम सन्दूक के ऊपर प्रायश्चित-आवरण[a] रखना, और सन्दूक के भीतर वह साक्षी रखना जिसे मैं तुम्हें दूँगा।
  to: तुम प्रायश्चित-आवरण को सन्दूक के ऊपर रखना, और उस साक्ष्य को सन्दूक के भीतर रखना जिसे मैं तुम्हें दूँगा।
  rationale: The revision makes the objects and their locations clearer in idiomatic modern Hindi. It retains the Hebrew’s unspecific “testimony” by using “साक्ष्य,” retains the atonement-related sense of כַּפֹּרֶת, and improves the lexical-alternative footnote without adding doctrinal interpretation.
