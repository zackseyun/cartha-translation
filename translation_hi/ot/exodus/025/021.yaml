  yaml_path: translation/ot/exodus/025/021.yaml
  text: And you shall put the mercy seat on top of the ark[a], and into the ark you shall put the testimony that I will give you.
translation:
  language: hi
  text: तुम प्रायश्चित-आवरण को सन्दूक के ऊपर रखना, और उस साक्ष्य को सन्दूक के भीतर रखना जिसे मैं तुम्हें दूँगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּפֹּרֶת
  choice: प्रायश्चित-आवरण
  rationale: यह शब्द सन्दूक के ऊपरी ढकने को दर्शाता है और उपासना में प्रायश्चित से उसके संबंध को भी बनाए रखता है। ‘आवरण’ उसके ठोस रूप को और ‘प्रायश्चित’ उसके धार्मिक प्रयोजन को स्पष्ट करता है।
- source_word: מִלְמָעְלָה
  choice: के ऊपर
  rationale: यहाँ शब्द सन्दूक के संबंध में आवरण रखने का स्थान बताता है; ‘के ऊपर’ आधुनिक हिन्दी में इसका स्वाभाविक स्थानगत अर्थ देता है।
- source_word: עֵדֻת
  choice: साक्षी
  rationale: यह निकट औपचारिक अनुवाद वाचा-संबंधी गवाही के अर्थ को बनाए रखता है और इस पद में स्पष्ट रूप से न कही गई ‘पटियाओं’ को मूल पाठ में नहीं जोड़ता।
- source_word: נָתַתָּ / תִּתֵּן / אֶתֵּן
  choice: रखना / रखना / दूँगा
  rationale: मनुष्य द्वारा वस्तुओं को स्थापित करने के लिए ‘रखना’ और परमेश्वर द्वारा साक्षी प्रदान करने के लिए ‘दूँगा’ स्वाभाविक हिन्दी है तथा मूल क्रिया के प्रसंगानुसार अर्थ को सुरक्षित रखता है।
- source_word: אֶל הָאָרֹן
  choice: सन्दूक के भीतर
  rationale: यद्यपि אֶל प्रायः दिशा सूचित करता है, ‘साक्षी रखना’ के साथ यहाँ उसका आशय सन्दूक के अंदर रखने से है।
theological_decisions:
- issue: उपासना और प्रायश्चित से जुड़े כַּפֹּרֶת का अनुवाद
  choice: प्रायश्चित-आवरण
  alternative: करुणासन; ढकना
  rationale: इब्रानी शब्द सन्दूक के ढकने को बताता है, साथ ही इस्राएल की उपासना में प्रायश्चित से जुड़ा है। ‘प्रायश्चित-आवरण’ इन दोनों पक्षों को रखता है, पर किसी विशेष मतानुसार इसकी धर्मवैज्ञानिक व्याख्या को सीमित नहीं करता। पारंपरिक विकल्प को पारदर्शिता के लिए पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण निर्देशात्मक शैली अपनाई गई है। ‘तुम ... रखना’ एकवचन संबोधन के आशय को स्वाभाविक हिन्दी में व्यक्त करता है; ‘साक्षी’ मूल की अस्पष्टता बनाए रखता है।
