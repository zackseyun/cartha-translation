  yaml_path: translation/ot/exodus/025/015.yaml
  text: The poles shall remain in the rings of the ark[a]; they shall not be removed from it.
translation:
  language: hi
  text: सन्दूक के कड़ों में डंडे लगे रहें; वे उसमें से निकाले न जाएँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּטַבְּעֹת
  choice: कड़ों में
  rationale: טַבַּעַת यहाँ सन्दूक से जुड़े उन छल्लेनुमा कड़ों को दर्शाता है जिनमें उठाने के डंडे डाले जाते थे; בְ को स्वाभाविक रूप से ‘में’ कहा गया है।
- source_word: הָאָרֹן
  choice: सन्दूक
  rationale: אָרוֹן मिलापवाले तम्बू के पवित्र सन्दूक को दर्शाता है। हिन्दी में ‘सन्दूक’ स्पष्ट और प्रचलित है तथा संदर्भ उसकी पवित्र भूमिका बताता है।
- source_word: יִהְיוּ
  choice: लगे रहें
  rationale: היה का मूल अर्थ ‘होना’ है, पर यहाँ स्थायी अवस्था का भाव है; अगले निषेध को देखते हुए ‘लगे रहें’ इस निरंतरता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַבַּדִּים
  choice: डंडे
  rationale: בַּדִּים सन्दूक को उठाकर ले जाने के लिए बनाए गए डंडे हैं। ‘डंडे’ आधुनिक और सहज हिन्दी है।
- source_word: לֹא יָסֻרוּ
  choice: निकाले न जाएँ
  rationale: סור का अर्थ हटना या हटाया जाना हो सकता है। कड़ों में पड़े डंडों के संदर्भ में हिन्दी का कर्मवाच्य ‘निकाले न जाएँ’ निषेध को स्पष्ट और स्वाभाविक बनाता है।
- source_word: מִמֶּנּוּ
  choice: उसमें से
  rationale: एकवचन प्रत्यय का निकटतम संदर्भ सन्दूक है। हिन्दी में डंडों को सन्दूक के कड़ों से निकालने के आशय के लिए ‘उसमें से’ स्वाभाविक है।
