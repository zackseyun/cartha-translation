source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר כִּֽי יָד֙ עַל כֵּ֣ס יָ֔הּ מִלְחָמָ֥ה לַ/יהוָ֖ה בַּֽ/עֲמָלֵ֑ק מִ/דֹּ֖ר דֹּֽר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/016.yaml
  text: And he said[a], “A hand is upon the throne of Yah; Yahweh will have war with Amalek from generation to generation.”
translation:
  language: hi
  text: और उसने कहा,[a] “एक हाथ याह के सिंहासन पर है; याहवे का अमालेक से पीढ़ी-दर-पीढ़ी युद्ध रहेगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी वाक्य कठिन और अत्यंत संक्षिप्त है; शाब्दिक रूप से, “एक हाथ याह के सिंहासन पर।” इसका अर्थ “एक हाथ याह के सिंहासन के विरुद्ध है” भी समझा गया है; कम संभावना से כֵּס का अर्थ “झंडा” लिया जाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब उसने कहा
  rationale: वय्यिक्तोल कथा को आगे बढ़ाता है; कर्ता का नाम इब्रानी में दोहराया नहीं गया, इसलिए ‘उसने’ रखा गया है।
- source_word: כִּי
  choice: प्रत्यक्ष कथन में अलग शब्द से व्यक्त नहीं
  rationale: यहाँ כִּי कथन की विषयवस्तु आरम्भ करता है। कठिन और संक्षिप्त अगले वाक्य पर ‘क्योंकि’ थोपने के बजाय हिंदी में उद्धरण-चिह्न स्वाभाविक रूप से यह काम करते हैं।
- source_word: יָד
  choice: एक हाथ
  rationale: संज्ञा पर निश्चित उपपद नहीं है; ‘एक हाथ’ इब्रानी की अनिश्चितता और संक्षिप्तता बनाए रखता है तथा यह नहीं बताता कि हाथ किसका है।
- source_word: עַל
  choice: पर
  rationale: इस पूर्वसर्ग का सामान्य अर्थ ‘पर’ है। ‘के विरुद्ध’ संभव व्याख्या है, पर उसे मुख्य पाठ में रखने से अर्थ आवश्यकता से अधिक निश्चित हो जाएगा।
- source_word: כֵּס
  choice: सिंहासन
  rationale: यह असामान्य रूप संभवतः כִּסֵּא ‘सिंहासन’ का संक्षिप्त या अपूर्ण लेखन है। ‘झंडा’ शाब्दिक दृष्टि से कम संभावित है।
- source_word: יָהּ
  choice: याह
  rationale: यह ईश्वरीय नाम का संक्षिप्त रूप याह है; इसे अगले पूर्ण नाम יהוה से अलग रखा गया है।
- source_word: מִלְחָמָה לַיהוָה
  choice: यहोवा का ... युद्ध रहेगा
  rationale: इब्रानी में क्रियारहित संज्ञात्मक वाक्य है, जिसमें युद्ध का संबंध यहोवा से बताया गया है। ‘युद्ध रहेगा’ हिंदी में स्वाभाविक है और संदर्भगत भावी निरंतरता को व्यक्त करता है, बिना ‘युद्ध करेगा’ जैसी अधिक व्याख्यात्मक क्रिया जोड़े।
- source_word: בַּעֲמָלֵק
  choice: अमालेक से
  rationale: युद्ध के प्रसंग में בְּ विरोधी सहभागिता बताता है; हिंदी में ‘अमालेक से युद्ध’ स्वाभाविक रूप से शत्रुता व्यक्त करता है।
- source_word: מִדֹּר דֹּר
  choice: पीढ़ी-दर-पीढ़ी
  rationale: यह मुहावरा लगातार आने वाली पीढ़ियों में जारी रहने की अवधि बताता है; चुना हुआ हिंदी रूप स्पष्ट और प्रचलित है।
theological_decisions:
- issue: एक ही पद में יָהּ और יהוה का अनुवाद
  choice: יָהּ को ‘याह’ और יהוה को ‘यहोवा’
  alternative: दोनों को ‘प्रभु’ कहना, अथवा יהוה को ‘याहवे’ लिखना
  rationale: मूल पाठ संक्षिप्त ईश्वरीय नाम और पूर्ण चतुरक्षरी नाम में भेद करता है। हिंदी में प्रचलित नामरूप ‘यहोवा’ रखते हुए यह भेद सुरक्षित किया गया है।
- issue: कठिन और लुप्तपदीय वाक्यांश כִּי יָד עַל כֵּס יָהּ
  choice: ‘एक हाथ याह के सिंहासन पर है’ के रूप में संरक्षित करना
  alternative: ‘एक हाथ याह के सिंहासन के विरुद्ध है’ या ‘एक हाथ याह के झंडे पर है’
  rationale: इब्रानी अत्यंत संक्षिप्त और विवादित है। मुख्य पाठ सामान्य शाब्दिक अर्थ रखता है और वास्तविक वैकल्पिक पाठों को पादटिप्पणी में देता है, ताकि अस्पष्टता चुपचाप हल न कर दी जाए।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सहज और स्रोत-सन्निकट शैली। ‘एक हाथ’ और ‘सिंहासन पर’ मूल की लुप्तपदीयता को बनाए रखते हैं; पादटिप्पणी-वाचक [a] मुख्य पाठ में स्पष्ट रूप से दिया गया है।
