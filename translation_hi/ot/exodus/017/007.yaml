id: EXO.17.7
reference: Exodus 17:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּקְרָא֙ שֵׁ֣ם הַ/מָּק֔וֹם מַסָּ֖ה וּ/מְרִיבָ֑ה עַל רִ֣יב בְּנֵ֣י יִשְׂרָאֵ֗ל וְ/עַ֨ל נַסֹּתָ֤/ם אֶת יְהוָה֙ לֵ/אמֹ֔ר הֲ/יֵ֧שׁ יְהוָ֛ה בְּ/קִרְבֵּ֖/נוּ אִם אָֽיִן־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/007.yaml
  text: And he called the name of the place Massah and Meribah[a], because of the quarreling of the sons of Israel and because they tested Yahweh, saying[c][b], “Is Yahweh among us or not?”
translation:
  language: hi
  text: 'उसने उस स्थान का नाम मस्सा और मरीबा रखा[a], क्योंकि इस्राएलियों ने झगड़ा किया और यह कहकर याहवे को परखा: “क्या याहवे हमारे बीच है या नहीं?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “मस्सा” नाम उस इब्रानी शब्द से संबंधित है जिसका अर्थ “परखना” है, और “मरीबा” उस शब्द से संबंधित है जिसका अर्थ “झगड़ा” या “विवाद” है।
    reason: नामों और पद में प्रयुक्त क्रियाओं के बीच इब्रानी शब्द-संबंध स्पष्ट करना।
lexical_decisions:
- source_word: וַיִּקְרָא שֵׁם הַמָּקוֹם
  choice: उसने उस स्थान का नाम … रखा
  rationale: यह हिन्दी में किसी स्थान का नाम रखने की स्वाभाविक अभिव्यक्ति है और इब्रानी नामकरण-सूत्र का अर्थ स्पष्ट रूप से रखती है।
- source_word: מַסָּה וּמְרִיבָה
  choice: मस्सा और मरीबा
  rationale: दोनों स्थान-नामों का लिप्यंतरण किया गया है; उनके अर्थ और पद में उपस्थित शब्द-संबंध को पादटिप्पणी में समझाया गया है।
- source_word: עַל רִיב בְּנֵי יִשְׂרָאֵל
  choice: क्योंकि इस्राएलियों ने झगड़ा किया
  rationale: עַל कारण बताता है और רִיב झगड़े या विवाद को सूचित करता है। सामूहिक पद בְּנֵי יִשְׂרָאֵל के लिए आधुनिक हिन्दी में स्वाभाविक ‘इस्राएलियों’ चुना गया है।
- source_word: וְעַל נַסֹּתָם אֶת יְהוָה
  choice: और … याहवे को परखा
  rationale: נסה का पिएल रूप यहाँ किसी को परीक्षा में डालने या परखने का अर्थ देता है; याहवे ही इसका प्रत्यक्ष कर्म है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार-अक्षरीय ईश्वरीय नाम को उपाधि से बदलने के बजाय हिन्दी में उसके प्रचलित निकट लिप्यंतरण से प्रस्तुत किया गया है।
- source_word: הֲיֵשׁ יְהוָה בְּקִרְבֵּנוּ אִם אָיִן
  choice: क्या याहवे हमारे बीच है या नहीं?
  rationale: בְּקִרְבֵּנוּ का अर्थ समुदाय के बीच उपस्थित होना है और אִם אָיִן ध्रुवीय प्रश्न को ‘या नहीं’ से पूरा करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत ईश्वरीय नाम का प्रयोग करता है। ‘याहवे’ उस नाम को नाम के रूप में बनाए रखता है, उसे किसी उपाधि में नहीं बदलता।
- issue: בְּנֵי יִשְׂרָאֵל का सामूहिक आशय
  choice: इस्राएली
  alternative: इस्राएल के पुत्र
  rationale: इब्रानी मुहावरा पूरे इस्राएली समुदाय के लिए प्रयुक्त है। ‘इस्राएली’ आधुनिक हिन्दी में उसी सामूहिक अर्थ को स्वाभाविक ढंग से व्यक्त करता है और केवल पुरुषों तक अर्थ को सीमित नहीं करता।
- issue: लोगों द्वारा याहवे को परखना
  choice: याहवे को परखा
  alternative: याहवे की परीक्षा ली
  rationale: 'सीधी अभिव्यक्ति मूल पाठ के धार्मिक तनाव को बनाए रखती है: लोग अपनी परिस्थिति के आधार पर याहवे की उपस्थिति को कसौटी पर रख रहे थे।'
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। नामकरण के इब्रानी मुहावरे को स्वाभाविक हिन्दी में व्यक्त किया गया है; स्थान-नामों को लिप्यंतरित करके आवश्यक शब्द-क्रीड़ा पादटिप्पणी में सुरक्षित रखी गई है।
