    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: तब ... आया
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ घटनाओं का क्रम स्वाभाविक हिन्दी में व्यक्त करता है, और בוא का सामान्य अर्थ ‘आना’ बनाए रखता है।
- source_word: עֲמָלֵק
  choice: अमालेक
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण। यहाँ पूर्वज के नाम से उसके वंशजों को सामूहिक रूप में बताया गया है; स्रोत की एकवचन अभिव्यक्ति बनाए रखी गई है।
- source_word: וַיִּלָּחֶם
  choice: लड़ा
  rationale: इस प्रसंग में לחם के निफ़अल रूप का अर्थ युद्ध करना या लड़ना है; ‘लड़ा’ सरल और स्वाभाविक कथात्मक हिन्दी है।
- source_word: עִם
  choice: से
  rationale: עִם का मूल अर्थ ‘साथ/के साथ’ है, पर लड़ाई के प्रसंग में हिन्दी का स्वाभाविक प्रयोग ‘किसी से लड़ना’ है। यह सहभागिता और विरोध—दोनों निहितार्थों को यथासंभव बनाए रखता है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: वाचा के लोगों/राष्ट्र के नाम का मानक हिन्दी रूप।
- source_word: בִּרְפִידִם
  choice: रपीदीम में
  rationale: בְּ स्थान सूचित करता है। किसी पड़ाव या स्थान पर घटी घटना के लिए ‘में’ स्वाभाविक हिन्दी है।
