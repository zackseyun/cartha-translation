  text: וַ/יִּצְמָ֨א שָׁ֤ם הָ/עָם֙ לַ/מַּ֔יִם וַ/יָּ֥לֶן הָ/עָ֖ם עַל מֹשֶׁ֑ה וַ/יֹּ֗אמֶר לָ֤/מָּה זֶּה֙ הֶעֱלִיתָ֣/נוּ מִ/מִּצְרַ֔יִם לְ/הָמִ֥ית אֹתִ֛/י וְ/אֶת בָּנַ֥/י וְ/אֶת מִקְנַ֖/י בַּ/צָּמָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/003.yaml
  text: And there the people thirsted for water, and the people grumbled against Moses and said, “Why is this—that you brought us up from Egypt to kill me and my children and my livestock with thirst?”
translation:
  language: hi
  text: वहाँ लोगों को पानी की प्यास लगी, और लोग मूसा के विरुद्ध शिकायत करने लगे और बोले, “तुम हमें मिस्र से ऊपर क्यों ले आए—मुझे, मेरे बच्चों और मेरे पशुधन को प्यास से मार डालने के लिए?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּצְמָא ... הָעָם לַמַּיִם
  choice: लोग पानी के लिए प्यासे थे
  rationale: इब्रानी अभिव्यक्ति का अर्थ स्वाभाविक आधुनिक हिन्दी में स्पष्ट रखा गया है।
- source_word: וַיָּלֶן
  choice: कुड़कुड़ाने लगे
  rationale: यह क्रिया विरोधपूर्ण शिकायत या बड़बड़ाहट व्यक्त करती है; ‘कुड़कुड़ाना’ प्रसंग में उस भाव को बनाए रखता है।
- source_word: הֶעֱלִיתָנוּ מִמִּצְרַיִם
  choice: हमें मिस्र से निकालकर ऊपर लाए
  rationale: ‘निकालना’ निर्गमन का आशय स्पष्ट करता है और ‘ऊपर लाए’ मूल क्रिया עלה की दिशात्मक छवि को सुरक्षित रखता है।
- source_word: מִקְנַי
  choice: मेरे पशुओं
  rationale: यहाँ सामूहिक रूप से पाले हुए मवेशी या पशुधन अभिप्रेत हैं; सामान्य पाठक के लिए ‘पशुओं’ स्वाभाविक है।
- source_word: בַצָּמָא
  choice: प्यास से
  rationale: मृत्यु के साधन अथवा कारण को व्यक्त करने वाली मूल रचना का सीधा हिन्दी रूप।
theological_decisions:
- issue: לָמָּה זֶּה और उद्देश्यसूचक infinitive की व्याख्या
  choice: क्या इसलिए कि ... मार डालो?
  alternative: तुम हमें ... क्यों लाए—मुझे ... प्यास से मार डालने के लिए?
  rationale: मूल में आरोपात्मक प्रश्न और कथित घातक उद्देश्य दोनों जुड़े हैं। प्रश्नात्मक हिन्दी इस तनाव को बनाए रखती है, बिना यह मान लेने के कि मूसा का वास्तविक उद्देश्य उन्हें मारना था।
- issue: सामूहिक वक्ता के बाद एकवचन कर्म
  choice: मुझे, मेरे बच्चों और मेरे पशुओं
  alternative: हमें, हमारे बच्चों और हमारे पशुओं
  rationale: मूल पाठ अचानक एकवचन ‘मुझे/मेरे’ में बोलता है। इसे सामूहिक बहुवचन में समतल न करके मूल की व्याकरणिक विशेषता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज किंतु गरिमापूर्ण है। मूल के दोहराव को हिन्दी प्रवाह के अनुरूप रखा गया है और सामूहिक ‘लोग’ से एकवचन ‘मुझे/मेरे’ में बदलाव जानबूझकर सुरक्षित रखा गया है।
