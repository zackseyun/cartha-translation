source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֤ה אֶל יְהוֹשֻׁ֨עַ֙ בְּחַר לָ֣/נוּ אֲנָשִׁ֔ים וְ/צֵ֖א הִלָּחֵ֣ם בַּ/עֲמָלֵ֑ק מָחָ֗ר אָנֹכִ֤י נִצָּב֙ עַל רֹ֣אשׁ הַ/גִּבְעָ֔ה וּ/מַטֵּ֥ה הָ/אֱלֹהִ֖ים בְּ/יָדִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/009.yaml
  text: And Moses said to Joshua[a], “Choose men for us and go out; fight against Amalek. Tomorrow I will stand on the top of the hill[b], with the staff of God in my hand.”
translation:
  language: hi
  text: तब मूसा ने यहोशू से कहा, “हमारे लिए कुछ पुरुष चुनो और बाहर जाकर अमालेकियों से लड़ो। कल मैं परमेश्वर की लाठी अपने हाथ में लेकर पहाड़ी की चोटी पर खड़ा रहूँगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: हिब्रू कथात्मक क्रम को आधुनिक हिन्दी में स्वाभाविक ढंग से आगे बढ़ाता है, बिना समय-क्रम पर अनावश्यक बल दिए।
- source_word: יְהוֹשֻׁעַ
  choice: यहोशू
  rationale: हिन्दी बाइबल परंपरा में प्रचलित और मूल नाम के निकट रूप।
- source_word: בְּחַר לָנוּ אֲנָשִׁים
  choice: हमारे लिए कुछ पुरुष चुनो
  rationale: בחר का अर्थ ‘चुनना’ और אֲנָשִׁים का मूल अर्थ ‘पुरुष’ है; हिन्दी में वाक्य स्वाभाविक बनाने के लिए ‘कुछ’ निहित अनिश्चित संख्या को व्यक्त करता है।
- source_word: וְצֵא הִלָּחֵם בַּעֲמָלֵק
  choice: और बाहर जाकर अमालेकियों से लड़ो
  rationale: יצא के ‘बाहर जाने’ और לחם के युद्ध करने के भाव को सुरक्षित रखता है। यहाँ सामूहिक जननाम עמלק को हिन्दी में स्वाभाविक रूप से ‘अमालेकियों’ कहा गया है।
- source_word: מָחָר אָנֹכִי נִצָּב
  choice: कल मैं ... खड़ा रहूँगा
  rationale: ‘कल’ के कारण कृदन्त נִצָּב का भावी अर्थ है; ‘खड़ा रहूँगा’ उसकी स्थिर मुद्रा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עַל רֹאשׁ הַגִּבְעָה
  choice: पहाड़ी की चोटी पर
  rationale: शाब्दिक ‘पहाड़ी के सिर पर’ एक हिब्रू मुहावरा है; ‘चोटी पर’ उसका स्पष्ट और स्वाभाविक हिन्दी अर्थ है।
- source_word: וּמַטֵּה הָאֱלֹהִים בְּיָדִי
  choice: परमेश्वर की लाठी अपने हाथ में लेकर
  rationale: अंतिम क्रियारहित पदबंध को मूसा के खड़े होने की रीति के रूप में जोड़ा गया है। ‘लाठी’ מַטֶּה के लिए सरल और निर्गमन के प्रसंग के अनुकूल है।
theological_decisions:
- issue: מַטֵּה הָאֱלֹהִים में הָאֱלֹהִים का अनुवाद
  choice: परमेश्वर की लाठी
  alternative: ईश्वर की लाठी
  rationale: ‘परमेश्वर’ आधुनिक हिन्दी बाइबल भाषा में इस्राएल के परमेश्वर के लिए स्पष्ट और प्रतिष्ठित रूप है; संबंधवाचक संरचना मूल इब्रानी construct को स्वाभाविक हिन्दी में व्यक्त करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। आदेशों को सीधे रखा गया है और हिब्रू मुहावरे को अर्थानुसार स्वाभाविक हिन्दी में दिया गया है।
