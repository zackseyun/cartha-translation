source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה כְּתֹ֨ב זֹ֤את זִכָּרוֹן֙ בַּ/סֵּ֔פֶר וְ/שִׂ֖ים בְּ/אָזְנֵ֣י יְהוֹשֻׁ֑עַ כִּֽי מָחֹ֤ה אֶמְחֶה֙ אֶת זֵ֣כֶר עֲמָלֵ֔ק מִ/תַּ֖חַת הַ/שָּׁמָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/014.yaml
  text: Then Yahweh said to Moses[a], “Write this as a memorial in the book, and put it in Joshua’s hearing[c][b], for I will surely blot out the remembrance of Amalek from under heaven.”
translation:
  language: hi
  text: तब याहवे ने मूसा से कहा, “स्मरणार्थ इस बात को पुस्तक में लिख[a] और यह बात यहोशू को सुना दे[b], क्योंकि मैं आकाश के नीचे से अमालेक के स्मरण को निश्चय ही मिटा दूँगा[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “पुस्तक में”; इसका अनुवाद “किसी पुस्तक में” या, प्राचीन लेखन-सामग्री को ध्यान में रखते हुए, “लिपटे हुए लेखपत्र में” भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “यहोशू के कानों में रख,” अर्थात उसे यह बात सुना दे या उसके सामने इसे दोहरा दे।
    reason: lexical_alternative
  - marker: c
    text: “निश्चय ही मिटा दूँगा” के लिए इब्रानी अभिव्यक्ति बलपूर्ण है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के व्यक्तिगत नाम के प्रचलित और सहज रूप का प्रयोग किया गया है; इसे किसी उपाधि से नहीं बदला गया।
- source_word: כְּתֹב זֹאת זִכָּרוֹן
  choice: इसे स्मरण के लिए ... लिख
  rationale: आज्ञार्थक ‘लिख’ को सीधा रखा गया है और זִכָּרוֹן के स्मारक/स्मरणार्थ उद्देश्य को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: בַּסֵּפֶר
  choice: पुस्तक में
  rationale: इब्रानी में निश्चित उपपद है, पर हिन्दी में ‘पुस्तक में’ स्वाभाविक रूप से निश्चित संदर्भ दे सकता है; ‘उस पुस्तक में’ अनावश्यक रूप से पहले से पहचानी हुई किसी विशिष्ट पुस्तक का संकेत दे सकता था।
- source_word: וְשִׂים בְּאָזְנֵי יְהוֹשֻׁעַ
  choice: यह बात यहोशू को सुना दे
  rationale: शाब्दिक रूप ‘यहोशू के कानों में रख’ एक इब्रानी मुहावरा है; हिन्दी में उसके आशय—यहोशू को सुनाना—को स्पष्ट और स्वाभाविक ढंग से दिया गया है।
- source_word: מָחֹה אֶמְחֶה
  choice: निश्चय ही मिटा दूँगा
  rationale: क्रिया के साथ infinitive absolute द्वारा व्यक्त बल और निश्चितता को ‘निश्चय ही’ से सुरक्षित रखा गया है।
- source_word: זֵכֶר עֲמָלֵק
  choice: अमालेक की स्मृति
  rationale: זֵכֶר का मूल अर्थ स्मृति/स्मरण है; यह पद के आरम्भ में आए स्मरण-विषयक भाव के साथ जानबूझकर बनी विरोधात्मक प्रतिध्वनि को बनाए रखता है।
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: आकाश के नीचे से
  rationale: इब्रानी मुहावरे को निकट और हिन्दी में बोधगम्य रूप में रखा गया है, जो पूर्णतः मिटा दिए जाने के व्यापक क्षेत्र को व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में चतुरक्षरीय व्यक्तिगत नाम יְהוָה है। हिन्दी के सामान्य पाठकों के लिए प्रतिष्ठित रूप ‘यहोवा’ नाम को उपाधि में बदले बिना सुरक्षित रखता है; ‘याहवे’ अधिक निकट विद्वत्तापरक लिप्यंतरण है।
- issue: अमालेक की स्मृति मिटाने के कथन का बल
  choice: निश्चय ही मिटा दूँगा
  alternative: पूरी तरह मिटा दूँगा
  rationale: मूल व्याकरण क्रिया की दृढ़ निश्चितता और बल व्यक्त करता है; ‘निश्चय ही’ उस बल को रखता है, जबकि ‘पूरी तरह’ परिणाम की संपूर्णता पर अपेक्षाकृत अधिक व्याख्यात्मक जोर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और श्रव्य रूप अपनाया गया है। इब्रानी मुहावरे को मुख्य पाठ में स्वाभाविक हिन्दी में व्यक्त करके उसका शाब्दिक रूप पादटिप्पणी में रखा गया है। ‘स्मरण’ और ‘स्मृति’ का चयन पद के आंतरिक वैचारिक विरोध को बनाए रखता है।
