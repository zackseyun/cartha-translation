source:
  edition: WLC
  text: וַ֠/יִּסְעוּ כָּל עֲדַ֨ת בְּנֵֽי יִשְׂרָאֵ֧ל מִ/מִּדְבַּר סִ֛ין לְ/מַסְעֵי/הֶ֖ם עַל פִּ֣י יְהוָ֑ה וַֽ/יַּחֲנוּ֙ בִּ/רְפִידִ֔ים וְ/אֵ֥ין מַ֖יִם לִ/שְׁתֹּ֥ת הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/001.yaml
  text: Then the whole congregation of the sons of Israel set out from the wilderness of Sin by stages[a], according to the command of Yahweh, and camped at Rephidim[b]; but there was no water for the people to drink.
translation:
  language: hi
  text: तब इस्राएलियों की सारी मण्डली अपने पड़ावों के अनुसार सीन के निर्जन प्रदेश से याहवे के आदेश के अनुसार चली, और रपीदीम में डेरा डाला; पर लोगों के पीने के लिए पानी नहीं था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: चली
  rationale: यात्रा के प्रसंग में נסע का अर्थ डेरा उठाकर आगे बढ़ना है। ‘चली’ स्वाभाविक आधुनिक हिन्दी में इस गति को व्यक्त करता है।
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों की सारी मण्डली
  rationale: עֵדָה पूरे संगठित समुदाय को सूचित करता है। ‘मण्डली’ उसका सामूहिक भाव रखता है, और ‘इस्राएली’ हिन्दी में בְּנֵי יִשְׂרָאֵל का स्वाभाविक, समावेशी रूप है।
- source_word: מִמִּדְבַּר סִין
  choice: सीन के निर्जन प्रदेश से
  rationale: מִדְבָּר आबादी से दूर शुष्क वन्य क्षेत्र है; ‘निर्जन प्रदेश’ आधुनिक पाठक के लिए स्पष्ट है और ‘सीन’ स्थान-नाम का लिप्यंतरण है।
- source_word: לְמַסְעֵיהֶם
  choice: पड़ाव-दर-पड़ाव
  rationale: מַסָּע यात्रा के क्रमिक चरण अथवा पड़ाव को दर्शाता है। यह हिन्दी मुहावरा क्रमशः आगे बढ़ने का अर्थ संक्षेप में रखता है।
- source_word: עַל פִּי יְהוָה
  choice: यहोवा के आदेश के अनुसार
  rationale: शाब्दिक रूप ‘यहोवा के मुख के अनुसार’ है, पर यह इब्रानी मुहावरा उनके आदेश या निर्देशन के अनुसार चलने को बताता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम יהוה को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से रखा गया है।
- source_word: וַיַּחֲנוּ בִּרְפִידִים
  choice: रपीदीम में डेरा डाला
  rationale: חנה का अर्थ शिविर लगाना है; ‘डेरा डाला’ स्वाभाविक हिन्दी है और רְפִידִים का रूप ‘रपीदीम’ रखा गया है।
- source_word: וְאֵין מַיִם לִשְׁתֹּת הָעָם
  choice: पर लोगों के पीने के लिए पानी नहीं था
  rationale: यहाँ ו आगमन के बाद उत्पन्न समस्या का विरोधात्मक संबंध दिखाता है, इसलिए ‘पर’ उपयुक्त है। शेष वाक्य इब्रानी आशय को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में उपाधि नहीं बल्कि चतुरक्षरीय व्यक्तिगत नाम है। ‘यहोवा’ हिन्दी बाइबलीय प्रयोग में पहचाना जाने वाला लिप्यंतरण है और नाम को नाम के रूप में सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सुबोध रखी गई है। ‘मण्डली’, ‘पड़ाव-दर-पड़ाव’ और ‘डेरा डाला’ सामुदायिक तथा यात्रा-संबंधी मूल भाव को स्वाभाविक ढंग से रखते हैं। किसी पादटिप्पणी की आवश्यकता नहीं पड़ी।
