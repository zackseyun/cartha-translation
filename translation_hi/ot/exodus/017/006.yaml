base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/006.yaml
  text: Behold[a], I will stand before you there on the rock at Horeb, and you shall strike the rock, and water will come out from it, and the people will drink. And Moses did so in the sight of the elders of Israel.
translation:
  language: hi
  text: देख, मैं वहाँ होरेब में उस चट्टान पर तेरे सामने खड़ा रहूँगा[a]। तू उस चट्टान पर प्रहार कर; उसमें से पानी निकलेगा और लोग पिएँगे। मूसा ने इस्राएल के बुज़ुर्गों की आँखों के सामने वैसा ही किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “देख, मैं वहाँ होरेब में उस चट्टान पर तेरे सामने खड़ा हूँ।” हिब्रू कृदंत का अनुवाद वर्तमानकाल में भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: देख
  rationale: यह ध्यान आकर्षित करने वाली गंभीर दैवी घोषणा है। आधुनिक हिंदी में ‘देख’ सहज और गरिमापूर्ण है तथा हिब्रू की संकेतात्मक शक्ति बनाए रखता है।
- source_word: עֹמֵד
  choice: खड़ा रहूँगा
  rationale: रूप की दृष्टि से यह कृदंत है, पर निर्देशों के इस क्रम में आसन्न भविष्य का भाव स्वाभाविक है। वर्तमानकालीन अर्थ को पाद-टिप्पणी में सुरक्षित रखा गया है।
- source_word: לְפָנֶיךָ
  choice: तेरे सामने
  rationale: यह मूसा के सम्मुख स्थान को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הַצּוּר
  choice: चट्टान
  rationale: צוּר किसी बड़ी चट्टान या शैलखंड को सूचित करता है; ‘चट्टान’ सामान्य आधुनिक हिंदी में सटीक है और पद में इसकी पुनरावृत्ति भी बनी रहती है।
- source_word: בְּחֹרֵב
  choice: होरेब में
  rationale: स्थान-सूचक בְ का सीधा और स्वाभाविक हिंदी रूप है।
- source_word: וְהִכִּיתָ
  choice: तू ... प्रहार करना
  rationale: निर्देशात्मक बल को ‘प्रहार करना’ स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: וְיָצְאוּ מִמֶּנּוּ מַיִם
  choice: उसमें से पानी निकलेगा
  rationale: यह क्रिया के सामान्य अर्थ ‘बाहर निकलना’ को बनाए रखता है और ‘बहना’ जैसी अतिरिक्त छवि नहीं जोड़ता।
- source_word: וְשָׁתָה הָעָם
  choice: लोग पिएँगे
  rationale: 'सरल परिणाम-क्रम को सुरक्षित रखता है: चट्टान पर प्रहार, पानी का निकलना और लोगों का पीना।'
- source_word: וַיַּעַשׂ כֵּן
  choice: वैसा ही किया
  rationale: हिब्रू के संक्षिप्त निष्पादन-सूत्र का स्वाभाविक हिंदी रूप।
- source_word: לְעֵינֵי
  choice: आँखों के सामने
  rationale: यह घटना के प्रत्यक्ष और सार्वजनिक साक्ष्य पर मूल वाक्यांश के बल को बनाए रखता है।
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुरनिये
  rationale: यह समुदाय के मान्य वरिष्ठ अगुओं के लिए प्रचलित बाइबलीय हिंदी पद है और केवल अधिक आयु वाले लोगों की अपेक्षा उनकी प्रतिनिधिक भूमिका को बेहतर व्यक्त करता है।
theological_decisions:
- issue: दैवी आत्म-प्रस्तुति में कृदंत का कालगत अर्थ
  choice: मैं ... खड़ा रहूँगा
  alternative: मैं ... खड़ा हूँ
  rationale: हिब्रू कृदंत वर्तमान या आसन्न भाव दे सकता है। निर्देशात्मक प्रसंग में भविष्याभिमुख अनुवाद स्वाभाविक है, जबकि वास्तविक वर्तमान-पाठ की संभावना पाद-टिप्पणी में रखी गई है।
- issue: ‘तेरे सामने’ और चट्टान पर दैवी उपस्थिति का संबंध
  choice: मैं वहाँ होरेब में उस चट्टान पर तेरे सामने खड़ा रहूँगा
  alternative: मैं वहाँ होरेब में उस चट्टान के पास तेरे सामने खड़ा रहूँगा
  rationale: वाक्य-विन्यास स्वाभाविक रूप से परमेश्वर के चट्टान पर खड़े होने को व्यक्त करता है। ‘के पास’ कहना मूल के עַל (‘पर’) को नरम करके अनावश्यक व्याख्या जोड़ देता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। दैवी संबोधन में एकवचन ‘तू/तेरे’ मूल के एकवचन संबोधन को बनाए रखता है। ‘पुरनिये’ बाइबलीय-सामुदायिक पद है, पर शेष वाक्यरचना वर्तमान हिंदी के अनुरूप सरल रखी गई है।
