id: EXO.17.15
reference: Exodus 17:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּ֥בֶן מֹשֶׁ֖ה מִזְבֵּ֑חַ וַ/יִּקְרָ֥א שְׁמ֖/וֹ יְהוָ֥ה נִסִּֽ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/015.yaml
  text: And Moses built an altar and called its name[a], “Yahweh Is My Banner.”
translation:
  language: hi
  text: तब मूसा ने एक वेदी बनाई और उसका नाम “याहवे मेरा झंडा है”[a] रखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: “याहवे निस्सी,” अर्थात “याहवे मेरा झंडा है” या “याहवे मेरा ध्वज है।” यहाँ झंडे से आशय ऐसा संकेत-चिह्न भी हो सकता है जिसके चारों ओर लोग इकट्ठे होते हैं।'
    reason: मूल नाम और उसके रूपक की वैकल्पिक अभिव्यक्ति बताना।
lexical_decisions:
- source_word: וַיִּבֶן
  choice: बनाई
  rationale: בנה का सामान्य अर्थ ‘बनाना/निर्माण करना’ है। वेदी के साथ ‘बनाई’ आधुनिक हिन्दी में स्वाभाविक और ठोस क्रिया है।
- source_word: מִזְבֵּחַ
  choice: वेदी
  rationale: מִזְבֵּחַ बलि या उपासना के लिए बनाए गए altar का मानक हिन्दी बाइबलीय शब्द ‘वेदी’ है।
- source_word: וַיִּקְרָא שְׁמוֹ
  choice: उसका नाम … रखा
  rationale: इब्रानी मुहावरे का शाब्दिक रूप ‘उसका नाम पुकारा’ है; आधुनिक हिन्दी में नामकरण के लिए ‘उसका नाम … रखा’ अधिक स्वाभाविक है और अर्थ को ठीक बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: यह चार अक्षरों वाला परमेश्वर का व्यक्तिगत नाम YHWH है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है; इसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: נִסִּי
  choice: मेरा झंडा है
  rationale: נֵס का अर्थ झंडा, ध्वज या लोगों को एकत्र करने वाला संकेत-चिह्न हो सकता है। प्रत्यय ‘मेरा’ है; इब्रानी के क्रियारहित वाक्य को स्वाभाविक हिन्दी बनाने के लिए ‘है’ जोड़ा गया है।
theological_decisions:
- issue: वेदी के नाम में יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम YHWH स्पष्ट रूप से है। ‘याहवे’ नाम को नाम के रूप में सुरक्षित रखता है; ‘प्रभु’ उसे उपाधि में बदल देता, जबकि ‘यहोवा’ बाद की मिश्रित उच्चारण-परंपरा को दर्शाता है।
- issue: יְהוָה נִסִּי में निहित संबंध
  choice: याहवे मेरा झंडा है
  alternative: याहवे मेरा ध्वज है / याहवे मेरी पताका है
  rationale: इब्रानी में कोई व्यक्त क्रिया नहीं है और रूपक को स्पष्ट नहीं किया गया। हिन्दी में केवल आवश्यक संयोजक ‘है’ जोड़ा गया है; विजय, रक्षा या युद्ध में अगुवाई जैसे किसी एक अर्थ को मुख्य पाठ में आरोपित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘तब’ कथात्मक क्रम को स्वाभाविक बनाता है। ‘झंडा’ सामान्य पाठक के लिए ‘ध्वज’ या ‘पताका’ से अधिक सहज है, जबकि पाद-टिप्पणी औपचारिक विकल्प और संकेत-चिह्न की अर्थ-छाया सुरक्षित रखती है।
