base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/012.yaml
  text: But Moses’ hands were heavy[a], so they took a stone and put it under him, and he sat on it. And Aaron and Hur supported his hands, one on this side and one on that side, so his hands remained steady until the sun set.
translation:
  language: hi
  text: परन्तु मूसा के हाथ भारी थे। तब उन्होंने एक पत्थर लिया और उसे मूसा के नीचे रख दिया, और मूसा उस पर बैठ गए। हारून और हूर ने उनके हाथों को सहारा दिया—एक ने इस ओर से और दूसरे ने उस ओर से। इस प्रकार सूर्यास्त तक उनके हाथ स्थिर[a] रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दृढ़” अथवा “अटल।” यहाँ प्रयुक्त इब्रानी संज्ञा का अर्थ “विश्वासयोग्यता” भी हो सकता है, पर इस प्रसंग में वह मूसा के हाथों की शारीरिक स्थिरता को दर्शाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וִידֵי / יָדָיו
  choice: हाथ / उनके हाथ
  rationale: יָד का सामान्य अर्थ ‘हाथ’ है। पूरे पद में इसी शब्द की पुनरावृत्ति को बनाए रखना दृश्य की एकता सुरक्षित रखता है; ‘बाँहें’ प्रसंगानुकूल हो सकता है, पर कम शाब्दिक है।
- source_word: כְּבֵדִים
  choice: भारी हो गए थे
  rationale: मूल विशेषण का ठोस अर्थ ‘भारी’ है और प्रसंग में थकान का संकेत देता है। ‘थक गए थे’ अर्थ स्पष्ट करता, पर मूल बिंब को खो देता।
- source_word: וַיִּקְחוּ
  choice: उन्होंने ... लाकर
  rationale: इब्रानी क्रिया बहुवचन है, पर कर्ता स्पष्ट रूप से नामित नहीं है। हिंदी में ‘उन्होंने’ इस अनिर्दिष्ट बहुवचन को स्वाभाविक रूप से बनाए रखता है।
- source_word: אֶבֶן
  choice: एक पत्थर
  rationale: אֶבֶן का सामान्य और सटीक हिंदी पर्याय ‘पत्थर’ है।
- source_word: תַחְתָּיו
  choice: मूसा के नीचे
  rationale: मूल का अर्थ ‘उसके नीचे’ है। हिंदी में संभावित सर्वनाम-अस्पष्टता से बचने के लिए संदर्भित व्यक्ति ‘मूसा’ दोहराया गया है।
- source_word: וַיֵּשֶׁב עָלֶיהָ
  choice: मूसा उस पर बैठ गए
  rationale: यह सीधे कथात्मक क्रम को व्यक्त करता है। सम्मानसूचक बहुवचन आधुनिक हिंदी में स्वाभाविक है।
- source_word: תָּמְכוּ בְיָדָיו
  choice: उनके हाथों को थामे रखा
  rationale: תמך का अर्थ सहारा देना या थामे रखना है। यहाँ निरंतर शारीरिक सहारे को ‘थामे रखा’ सहज रूप से व्यक्त करता है।
- source_word: מִזֶּה אֶחָד וּמִזֶּה אֶחָד
  choice: एक ने इस ओर से और दूसरे ने उस ओर से
  rationale: यह हारून और हूर के दोनों ओर से दिए गए अलग-अलग सहारे के वितरणात्मक भाव को स्पष्ट रखता है।
- source_word: וַיְהִי יָדָיו אֱמוּנָה
  choice: उनके हाथ स्थिर रहे
  rationale: אֱמוּנָה में स्थिरता, दृढ़ता और विश्वसनीयता का अर्थ-क्षेत्र है। शारीरिक थकान और सहारे के इस प्रसंग में ‘स्थिर’ प्रमुख अर्थ देता है, जबकि टिप्पणी अन्य संभावनाओं को सुरक्षित रखती है।
- source_word: עַד בֹּא הַשָּׁמֶשׁ
  choice: सूर्यास्त तक
  rationale: ‘सूर्य के आने/डूबने तक’ वाली इब्रानी समय-अभिव्यक्ति का संक्षिप्त, स्वाभाविक और गरिमापूर्ण हिंदी रूप है।
theological_decisions:
- issue: मूसा के हाथों के संबंध में אֱמוּנָה का अर्थ
  choice: 'शारीरिक स्थिरता: ‘स्थिर रहे’'
  alternative: दृढ़ रहे; अटल रहे; विश्वासयोग्य रहे
  rationale: तात्कालिक प्रसंग मूसा की शारीरिक थकान तथा हारून और हूर द्वारा उनके हाथ थामे रखने का है। इसलिए ‘स्थिर’ दृश्य के प्रत्यक्ष अर्थ को व्यक्त करता है, जबकि पादटिप्पणी शब्द की व्यापक अर्थ-छाया को पूरी तरह समाप्त नहीं करती।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी, सहज और गरिमापूर्ण रखी गई है। मूसा के लिए सम्मानसूचक बहुवचन का प्रयोग किया गया है। छोटे वाक्यों और दीर्घ विराम से दृश्य स्पष्ट रहता है; अनिर्दिष्ट बहुवचन कर्ता को अनावश्यक रूप से हारून और हूर के रूप में निश्चित नहीं किया गया।
