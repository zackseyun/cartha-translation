lexical_decisions:
- source_word: וַיַּחֲלֹשׁ
  choice: परास्त किया
  rationale: חלש का यह रूप दुर्लभ है और इसमें कमज़ोर करने अथवा युद्ध में काबू पाने का भाव हो सकता है। युद्ध-वर्णन में ‘परास्त किया’ परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है, पर पूर्ण विनाश का अर्थ नहीं जोड़ता।
- source_word: יְהוֹשֻׁעַ
  choice: यहोशू
  rationale: हिन्दी बाइबल-परंपरा में प्रचलित और पहचाना जाने वाला नाम-रूप।
- source_word: עֲמָלֵק
  choice: अमालेक
  rationale: मूल में एकवचन व्यक्तिवाचक नाम है, जो यहाँ अमालेकी युद्धबल का प्रतिनिधित्व कर सकता है; हिन्दी में नाम को उसी रूप में रखा गया है।
- source_word: עַמּוֹ
  choice: उसके लोगों
  rationale: עַם का मूल अर्थ ‘लोग/प्रजा’ है। प्रसंग में इससे लड़ाके अभिप्रेत हो सकते हैं, फिर भी ‘लोगों’ मूल की व्यापकता और अस्पष्टता बनाए रखता है।
- source_word: לְפִי חָרֶב
  choice: तलवार से
  rationale: शाब्दिक रूप से ‘तलवार के मुँह से’ एक इब्रानी मुहावरा है, जिसका आशय सशस्त्र युद्ध में तलवार के द्वारा परास्त करना है। ‘तलवार से’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
