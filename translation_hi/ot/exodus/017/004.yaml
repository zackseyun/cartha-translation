base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/004.yaml
  text: So Moses cried out to Yahweh[a], saying, “What shall I do with this people? A little more, and they will stone me!”
translation:
  language: hi
  text: तब मूसा ने याहवे को पुकारकर कहा, “मैं इस प्रजा के साथ क्या करूँ? बस थोड़ी ही देर और, और वे मुझे पत्थर मारेंगे![a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “अभी थोड़ा और, और वे मुझे पत्थर मारेंगे”; यह बताता है कि खतरा बिलकुल निकट था।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצְעַק
  choice: पुकारकर कहा
  rationale: צעק संकट और सहायता की तीव्र पुकार को व्यक्त करता है। ‘पुकारकर कहा’ हिंदी में स्वाभाविक है और मूसा की व्याकुलता बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम יהוה को किसी उपाधि से बदलने के बजाय हिंदी में ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: מָה אֶעֱשֶׂה לָעָם הַזֶּה
  choice: मैं इस प्रजा के साथ क्या करूँ?
  rationale: यह प्रश्न मूसा की तत्काल व्यावहारिक दुविधा को व्यक्त करता है। ‘के साथ क्या करूँ’ לָעָם के संबंधपरक अर्थ को सहज आधुनिक हिंदी में रखता है।
- source_word: עֹד מְעַט
  choice: बस थोड़ी ही देर है, फिर
  rationale: शाब्दिक भाव ‘अभी थोड़ा और’ है; प्रसंग में यह आसन्न खतरे का संकेत देता है। चुना हुआ रूप उसी निकटता को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: וּסְקָלֻנִי
  choice: वे मुझे पत्थर मारेंगे
  rationale: סקל का सीधा अर्थ पत्थर मारना अथवा पत्थरवाह करना है। ‘पत्थर मारेंगे’ स्पष्ट, सामान्य हिंदी है और वाक्य की भावी-अत्यासन्न शक्ति को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम स्पष्ट रूप से आया है। ‘याहवे’ उसे उपाधि में बदले बिना प्रस्तुत करता है; ‘यहोवा’ एक वैकल्पिक पारंपरिक स्वरूप है और ‘प्रभु’ नाम के स्थान पर उपाधि रखता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिंदी। ‘प्रजा’ सामूहिक עם के लिए उपयुक्त है, जबकि संवाद की तात्कालिकता के लिए वाक्यरचना सीधी रखी गई है। पादटिप्पणी का चिह्न उसी वाक्यांश के बाद रखा गया है जिसकी वह व्याख्या करती है।
