source:
  edition: WLC
  text: וַ/יָּ֤רֶב הָ/עָם֙ עִם מֹשֶׁ֔ה וַ/יֹּ֣אמְר֔וּ תְּנוּ לָ֥/נוּ מַ֖יִם וְ/נִשְׁתֶּ֑ה וַ/יֹּ֤אמֶר לָ/הֶם֙ מֹשֶׁ֔ה מַה תְּרִיבוּ/ן֙ עִמָּדִ֔/י מַה תְּנַסּ֖וּ/ן אֶת יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/002.yaml
  text: So the people quarreled with Moses and said[a], “Give us water so that we may drink.” And Moses said to them[b], “Why do you quarrel with me? Why do you test Yahweh?”
translation:
  language: hi
  text: तब लोगों ने मूसा से झगड़ा किया और कहा, “हमें पानी दो, ताकि हम पी सकें।” मूसा ने उनसे कहा, “तुम मुझसे क्यों झगड़ते हो? तुम याहवे[a] को क्यों परखते हो[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में יהוה (YHWH), परमेश्वर का निज नाम; इसका उच्चारण प्रायः ‘याहवे’ माना जाता है। परंपरागत अनुवाद: ‘प्रभु’।'
    reason: divine_name
  - marker: b
    text: या, “याहवे को परीक्षा में डालते हो?”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרֶב
  choice: झगड़ा किया
  rationale: रיב यहाँ विवाद या टकराव को व्यक्त करता है। ‘झगड़ा किया’ सहज आधुनिक हिन्दी है और केवल शिकायत करने से अधिक प्रबल विरोध का भाव बनाए रखता है।
- source_word: הָעָם
  choice: लोगों
  rationale: मूल पाठ में निश्चित पद ‘वे लोग/लोग’ है; इस पद में स्पष्ट न होने के कारण ‘इस्राएली’ जोड़ना आवश्यक नहीं है।
- source_word: עִם מֹשֶׁה
  choice: मूसा से
  rationale: हिन्दी में ‘किसी से झगड़ा करना’ स्वाभाविक प्रयोग है और עִם के ‘साथ’ संबंध को विरोध के प्रसंग में ठीक व्यक्त करता है।
- source_word: תְּנוּ לָנוּ מַיִם
  choice: हमें पानी दो
  rationale: बहुवचन आज्ञार्थ और परोक्ष कर्म का सीधा, स्वाभाविक अनुवाद।
- source_word: וְנִשְׁתֶּה
  choice: ताकि हम पी सकें
  rationale: आज्ञा के बाद प्रयुक्त रूप माँग के उद्देश्य या अपेक्षित परिणाम को व्यक्त करता है।
- source_word: מַה תְּרִיבוּן עִמָּדִי
  choice: तुम मुझसे क्यों झगड़ते हो?
  rationale: यहाँ מַה का मुहावरेदार अर्थ ‘क्यों’ है। ‘झगड़ते’ की पुनरावृत्ति मूल के ריב शब्द-संबंध को बनाए रखती है।
- source_word: מַה תְּנַסּוּן
  choice: तुम ... क्यों परखते हो
  rationale: पिएल रूप נסה का अर्थ ‘परखना/परीक्षा लेना’ है। ‘परखते हो’ परमेश्वर की उपस्थिति और प्रबंध को चुनौती देने की गंभीरता को बिना व्याख्यात्मक विस्तार के व्यक्त करता है।
- source_word: אֶת יְהוָה
  choice: याहवे
  rationale: मूल में परमेश्वर का निज नाम יהוה है। ‘याहवे’ उसे सामान्य उपाधि ‘प्रभु’ से अलग रखते हुए हिन्दी में प्रचलित विद्वत्तापूर्ण उच्चारण को दर्शाता है।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पद में चार अक्षरों वाला निज नाम सीधे आया है। उसे नाम के रूप में रखना मूल का भेद सुरक्षित रखता है; उच्चारण पूरी निश्चितता से ज्ञात न होने की बात पाद-टिप्पणी में बताई गई है।
- issue: परमेश्वर को ‘परखने’ का आशय
  choice: परखते हो
  alternative: परीक्षा लेते हो
  rationale: अनुवाद इस धर्मवैचारिक तनाव को बनाए रखता है कि मूसा से लोगों का झगड़ा याहवे को परखना भी है; इसे केवल ‘शिकायत’ कहकर नरम नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। लोगों की माँग और मूसा के दोहरे प्रश्न की संक्षिप्तता तथा तीक्ष्णता सुरक्षित है।
