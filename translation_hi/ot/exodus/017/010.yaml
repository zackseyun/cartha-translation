  yaml_path: translation/ot/exodus/017/010.yaml
  text: So Joshua did as Moses had told him[a], to fight against Amalek; and Moses, Aaron, and Hur went up to the top of the hill.
translation:
  language: hi
  text: तब यहोशू ने मूसा के कहे अनुसार अमालेक[a] से युद्ध किया; और मूसा, हारून और हूर पहाड़ी की चोटी पर चढ़ गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘अमालेक’; यहाँ इससे अमालेक के वंशज, अर्थात् अमालेकी लोग, अभिप्रेत हो सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ ... כַּאֲשֶׁר אָמַר לוֹ מֹשֶׁה
  choice: मूसा के कहे अनुसार
  rationale: यह वाक्यांश यहोशू द्वारा मूसा के पहले दिए निर्देश का पालन व्यक्त करता है। यह हिन्दी में स्वाभाविक है और मूल की अनुरूपता की भावना बनाए रखता है।
- source_word: לְהִלָּחֵם
  choice: युद्ध किया
  rationale: निफ़अल रूप यहाँ लड़ने या युद्ध करने का अर्थ देता है। प्रसंग में ‘युद्ध किया’ सहज और गरिमापूर्ण है।
- source_word: בַּעֲמָלֵק
  choice: अमालेक से
  rationale: לחם के साथ בְ विरोधी पक्ष को सूचित करता है। ‘अमालेक’ मूल में आए व्यक्तिनाम को सुरक्षित रखता है; यह उसके वंशज लोगों के लिए सामूहिक नाम भी हो सकता है।
- source_word: עָלוּ
  choice: चढ़ गए
  rationale: עלה ऊँचे स्थान की ओर जाने को बताता है। पहाड़ी के प्रसंग में ‘चढ़ गए’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: רֹאשׁ הַגִּבְעָה
  choice: पहाड़ी की चोटी
  rationale: शाब्दिक ‘पहाड़ी का सिर’ ऊपरी भाग या शिखर के लिए इब्रानी मुहावरा है; ‘पहाड़ी की चोटी’ उसका स्वाभाविक हिन्दी रूप है।
- source_word: יְהוֹשֻׁעַ / מֹשֶׁה / אַהֲרֹן / חוּר
  choice: यहोशू / मूसा / हारून / हूर
  rationale: हिन्दी बाइबल परंपरा में प्रचलित और पहचाने जाने योग्य नाम-रूप अपनाए गए हैं।
