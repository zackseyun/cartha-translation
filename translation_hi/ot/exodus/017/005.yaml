  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה עֲבֹר֙ לִ/פְנֵ֣י הָ/עָ֔ם וְ/קַ֥ח אִתְּ/ךָ֖ מִ/זִּקְנֵ֣י יִשְׂרָאֵ֑ל וּ/מַטְּ/ךָ֗ אֲשֶׁ֨ר הִכִּ֤יתָ בּ/וֹ֙ אֶת הַ/יְאֹ֔ר קַ֥ח בְּ/יָדְ/ךָ֖ וְ/הָלָֽכְתָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/005.yaml
  text: Then Yahweh said to Moses[a], “Pass on before the people, and take with you some of the elders of Israel. Take in your hand your staff with which you struck the Nile[b], and go.”
translation:
  language: hi
  text: तब यहोवा ने मूसा से कहा, “लोगों के आगे बढ़ और इस्राएल के पुरनियों में से कुछ को अपने साथ ले। अपनी वह लाठी, जिससे तूने नील नदी[a] पर प्रहार किया था, अपने हाथ में ले और जा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “नदी”; निर्गमन में यह शब्द सामान्यतः विशेष रूप से नील नदी को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित व्यक्तिगत नाम-रूप ‘यहोवा’ रखा गया है, ताकि मूल के वाचा-संबंधी ईश्वरीय नाम को किसी उपाधि से न बदला जाए।
- source_word: עֲבֹר לִפְנֵי הָעָם
  choice: लोगों के आगे से होकर जा
  rationale: यह अभिव्यक्ति עבר के ‘गुज़रना/होकर जाना’ और לִפְנֵי के स्थान-संबंधी ‘आगे’ दोनों भावों को स्वाभाविक हिन्दी में बनाए रखती है।
- source_word: וְקַח אִתְּךָ מִזִּקְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुरनियों में से कुछ को अपने साथ ले
  rationale: מִן का अंशवाचक भाव स्पष्ट करता है कि समस्त पुरनियों को नहीं, उनमें से चुने हुए कुछ जनों को साथ लेना है।
- source_word: וּמַטְּךָ
  choice: अपनी वह लाठी
  rationale: מַטֶּה के लिए ‘लाठी’ सहज आधुनिक हिन्दी है; ‘वह’ आगे आने वाले संबंधवाचक उपवाक्य से इसे स्वाभाविक रूप से जोड़ता है।
- source_word: אֲשֶׁר הִכִּיתָ בּוֹ אֶת הַיְאֹר
  choice: जिससे तूने नील नदी पर प्रहार किया था
  rationale: בּוֹ को करणवाचक ‘जिससे’ और יְאֹר को निर्गमन के मिस्री संदर्भ में विशिष्ट ‘नील नदी’ के रूप में व्यक्त किया गया है। ‘पर प्रहार’ हिन्दी में लक्ष्य पर लाठी मारने का स्वाभाविक प्रयोग है।
- source_word: קַח בְּיָדְךָ
  choice: अपने हाथ में ले
  rationale: मूल में קח की पुनरावृत्ति को आदेश-क्रम और बल सहित रखा गया है; कर्म का संकेत पिछली ‘लाठी’ से स्पष्ट है।
- source_word: וְהָלָכְתָּ
  choice: और जा
  rationale: यह रूप पूर्ववर्ती आदेशों की शृंखला में आदेश-जैसी निरंतरता देता है; ‘और जा’ संक्षिप्त और स्वाभाविक है।
- source_word: וַיֹּאמֶר
  choice: तब ... ने ... कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में उस क्रम को सहजता से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम YHWH का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: व्यक्तिगत नाम को उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं किया गया। हिन्दी पाठकों में परिचित लिप्यंतरण ‘यहोवा’ चुना गया है; यह किसी अतिरिक्त सांप्रदायिक व्याख्या को नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। परमेश्वर से मूसा के प्रत्यक्ष संबोधन में पारंपरिक एकवचन ‘तू’ मूल के एकवचन आदेशों को स्पष्ट और संक्षिप्त रूप से व्यक्त करता है। ‘पुरनियों’ को इस्राएली समुदाय के मान्य अगुओं के अर्थ में रखा गया है। अंग्रेज़ी परामर्श-पाठ का पहला पादटिप्पणी-चिह्न संभवतः असंगत स्थान पर था; अंशवाचक अर्थ मुख्य हिन्दी पाठ में सीधे स्पष्ट कर दिया गया है, इसलिए अलग पादटिप्पणी आवश्यक नहीं मानी गई।
