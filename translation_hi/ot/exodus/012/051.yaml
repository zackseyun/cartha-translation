id: EXO.12.51
reference: Exodus 12:51
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יְהִ֕י בְּ/עֶ֖צֶם הַ/יּ֣וֹם הַ/זֶּ֑ה הוֹצִ֨יא יְהוָ֜ה אֶת בְּנֵ֧י יִשְׂרָאֵ֛ל מֵ/אֶ֥רֶץ מִצְרַ֖יִם עַל צִבְאֹתָֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/051.yaml
  text: And on that very day[b][a], Yahweh brought the sons of Israel out from the land of Egypt according to their divisions.
translation:
  language: hi
  text: और ठीक उसी दिन याहवे इस्राएल के पुत्रों[a] को उनके दलों के अनुसार[b] मिस्र देश से बाहर ले आया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘इस्राएल की सन्तान’ अथवा ‘इस्राएली’। इब्रानी में शाब्दिक रूप से ‘इस्राएल के पुत्र’ है; यह पूरे समुदाय के लिए प्रयुक्त पारिवारिक अभिव्यक्ति है।
    reason: lexical_alternative
  - marker: b
    text: या ‘अपनी-अपनी टुकड़ियों में’ अथवा ‘अपनी सेनाओं के अनुसार’। इब्रानी पदबंध उनके क्रमबद्ध समूहों पर बल दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: और
  rationale: यह कथात्मक क्रम और समय-सूचक वाक्यांश का परिचय देता है; आधुनिक हिन्दी में पूरे रूढ़ वाक्यांश ‘और ऐसा हुआ’ की अपेक्षा ‘और’ स्वाभाविक है।
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: ठीक उसी दिन
  rationale: यह इब्रानी मुहावरा दिन की सटीकता पर बल देता है; ‘ठीक उसी दिन’ उसके बल और कथात्मक दृष्टिकोण दोनों को व्यक्त करता है।
- source_word: הוֹצִיא
  choice: बाहर ले आया
  rationale: יצא का हिफ़ील रूप कारणवाचक है और यहाँ किसी को बाहर निकालने या ले आने का अर्थ देता है; यह चयन रीति को अनावश्यक रूप से निश्चित किए बिना उस कारणवाचक भाव को रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत नाम का लिप्यंतरण किया गया है, उसे किसी उपाधि से नहीं बदला गया।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: यह मूल के पारिवारिक और सामूहिक पदबंध को निकटता से सुरक्षित रखता है; संदर्भ में यह पूरे इस्राएली समुदाय का द्योतक है।
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: मिस्र देश से
  rationale: אֶרֶץ को ‘देश’ के रूप में स्पष्ट रखा गया है, जबकि ‘बाहर’ को गति-सूचक क्रिया के साथ रखा गया है।
- source_word: עַל צִבְאֹתָם
  choice: उनके दलों के अनुसार
  rationale: צָבָא यहाँ संगठित समूहों, टुकड़ियों या समुदाय की क्रमबद्ध इकाइयों को सूचित कर सकता है; ‘दल’ सैन्य अर्थ को अनावश्यक रूप से थोपे बिना संगठन का भाव देता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पद में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और नाम को उपाधि में नहीं बदलता।
- issue: सामूहिक पदबंध בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  alternative: इस्राएल की सन्तान; इस्राएली
  rationale: यह मूल के वंशगत-पारिवारिक रूप को बनाए रखता है, साथ ही पादटिप्पणी स्पष्ट करती है कि प्रयोग सामूहिक है।
- issue: צִבְאֹתָם का स्वरूप
  choice: उनके दलों के अनुसार
  alternative: उनकी सेनाओं के अनुसार; अपनी-अपनी टुकड़ियों में
  rationale: मूल शब्द में सैन्य समूहों का अर्थ संभव है, पर इस प्रसंग में क्रमबद्ध समूहों पर बल भी हो सकता है; मुख्य पाठ व्यापक अर्थ रखता है और विकल्प पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज हिन्दी रखी गई है। वाक्य-क्रम हिन्दी की स्वाभाविकता के अनुसार बदला गया है, पर समयगत बल, कारणवाचक क्रिया, ईश्वरीय नाम, सामूहिक पारिवारिक पद और संगठित दलों का भाव सुरक्षित है।
