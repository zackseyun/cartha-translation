  text: וְ/כָכָה֮ תֹּאכְל֣וּ אֹת/וֹ֒ מָתְנֵי/כֶ֣ם חֲגֻרִ֔ים נַֽעֲלֵי/כֶם֙ בְּ/רַגְלֵי/כֶ֔ם וּ/מַקֶּלְ/כֶ֖ם בְּ/יֶדְ/כֶ֑ם וַ/אֲכַלְתֶּ֤ם אֹת/וֹ֙ בְּ/חִפָּז֔וֹן פֶּ֥סַח ה֖וּא לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/011.yaml
  text: 'And this is how you shall eat it: with your waist belted[a], your sandals on your feet, and your staff in your hand. You shall eat it in haste[b]; it is the Passover of Yahweh.'
translation:
  language: hi
  text: 'और तुम उसे इस प्रकार खाओ: कमर कसे हुए[a], पैरों में जूतियाँ पहने हुए और हाथ में लाठी लिए हुए। तुम उसे जल्दी में खाओ; यह याहवे का फ़सह है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक: “तुम्हारी कटियाँ कसी हुई”—अर्थात् तुरंत प्रस्थान के लिए तैयार।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָכָה
  choice: और ... इस प्रकार
  rationale: यह भोजन करने की विधि बताने वाला पदबंध है; ‘इस प्रकार’ स्वाभाविक और निर्देशात्मक है।
- source_word: תֹּאכְלוּ / וַאֲכַלְתֶּם
  choice: तुम ... खाना
  rationale: निर्देशात्मक संदर्भ में हिन्दी का क्रियार्थक आदेश बहुवचन सम्बोधन और अपेक्षित कर्तव्य को सहज रूप से व्यक्त करता है।
- source_word: מָתְנֵיכֶם חֲגֻרִים
  choice: कमर कसी हुई
  rationale: मूल ठोस बिंब को बनाए रखते हुए तत्काल प्रस्थान के लिए तैयार होने का भाव व्यक्त करता है।
- source_word: נַעֲלֵיכֶם בְּרַגְלֵיכֶם
  choice: पैरों में जूतियाँ
  rationale: נַעַל प्राचीन संदर्भ के पादत्राण को दर्शाता है; ‘जूतियाँ’ सामान्य आधुनिक हिन्दी में सुबोध है।
- source_word: וּמַקֶּלְכֶם בְּיֶדְכֶם
  choice: हाथ में लाठी लिए हुए
  rationale: यात्रा के सहारे वाली लाठी का अर्थ और तैयारी की मुद्रा दोनों स्वाभाविक हिन्दी में व्यक्त होते हैं।
- source_word: בְּחִפָּזוֹן
  choice: जल्दी-जल्दी
  rationale: यह शीघ्रता और तत्काल निकलने की तत्परता को स्पष्ट, सामान्य हिन्दी में व्यक्त करता है।
- source_word: פֶּסַח
  choice: फ़सह
  rationale: यह इब्रानी पर्व और बलि-भोज का प्रचलित हिन्दी बाइबलीय नाम है तथा पद में निहित संस्कारगत विशिष्टता बनाए रखता है।
- source_word: הוּא לַיהוָה
  choice: यह यहोवा का फ़सह है
  rationale: לַיהוָה के संबंध को स्वामित्व अथवा समर्पण की निहित व्यापकता सहित सहज हिन्दी में रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नाम-रूप से प्रस्तुत करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में निजी नाम है; ‘यहोवा’ हिन्दी पाठकों में स्थापित नाम-रूप है और इसे केवल उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं करता।
- issue: הוּא לַיהוָה में संबंध का स्वरूप
  choice: यह यहोवा का फ़सह है
  alternative: यह यहोवा के लिए फ़सह है
  rationale: लामेद स्वामित्व, संबंध या समर्पण व्यक्त कर सकता है। मुख्य पाठ का ‘यहोवा का’ स्वाभाविक रहते हुए इस व्यापक संबंध को खुला रखता है।
- issue: מָתְנֵיכֶם חֲגֻרִים का मुहावरा
  choice: कमर कसी हुई
  alternative: कटि बाँधे हुए
  rationale: चुना हुआ रूप शारीरिक बिंब और प्रस्थान की तत्परता दोनों को आधुनिक, सुबोध हिन्दी में सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। ‘खाना’ वाले निर्देशात्मक रूप से सामूहिक आदेश का बल रखा गया है। मूल के ठोस यात्रा-बिंब—कसी कमर, पैरों में पादत्राण और हाथ में लाठी—सुरक्षित हैं।
