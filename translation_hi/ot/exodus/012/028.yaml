  yaml_path: translation/ot/exodus/012/028.yaml
  text: Then the sons of Israel went and did so; just as Yahweh had commanded Moses and Aaron[a], so they did.
translation:
  language: hi
  text: तब इस्राएल के पुत्र गए और उन्होंने वैसा ही किया, जैसा याहवे ने मूसा और हारून को आज्ञा दी थी; वैसा ही उन्होंने किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: गए
  rationale: הלך का यह रूप कथा को आगे बढ़ाता है। संदर्भ में वे आज्ञाओं को पूरा करने गए, पर क्रिया में इससे अधिक बात स्पष्ट रूप से नहीं जोड़ी गई है।
- source_word: וַיַּעֲשׂוּ
  choice: उन्होंने वैसा ही किया
  rationale: עשה यहाँ पहले दी गई फसह-संबंधी आज्ञाओं की ओर संकेत करता है; ‘वैसा ही किया’ इस संदर्भसूचक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्र
  rationale: यह इब्रानी पदबंध का निकट और पारदर्शी रूप है तथा मूल के पुरुषवाची पारिवारिक पद को बनाए रखता है।
- source_word: כַּאֲשֶׁר
  choice: जैसा
  rationale: यह आज्ञा और पालन के बीच अनुरूपता व्यक्त करता है; वाक्य के अंत का ‘वैसा ही’ उस सटीक अनुरूपता पर बल देता है।
- source_word: צִוָּה
  choice: आज्ञा दी थी
  rationale: आज्ञा इस्राएल के कार्य से पहले दी गई थी; हिन्दी में पूर्वकालिक क्रम को ‘दी थी’ स्वाभाविक रूप से स्पष्ट करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित प्रतिलेखन ‘यहोवा’ चतुरक्षरीय दिव्य नाम को किसी उपाधि से बदलने के बजाय व्यक्तिगत नाम के रूप में प्रस्तुत करता है।
- source_word: אֶת מֹשֶׁה וְאַהֲרֹן
  choice: मूसा और हारून को
  rationale: אֶת मूसा और हारून को आज्ञा के प्रत्यक्ष कर्म के रूप में चिह्नित करता है; इसलिए ‘के द्वारा’ जोड़ना उचित नहीं होगा।
- source_word: כֵּן עָשׂוּ
  choice: वैसा ही उन्होंने किया
  rationale: समापन का यह पुनरुक्त वाक्यांश आज्ञा के ठीक अनुरूप आज्ञापालन पर मूल के बल को सुरक्षित रखता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम है, कोई उपाधि नहीं। आधुनिक हिन्दी बाइबल-पाठकों के लिए ‘यहोवा’ परिचित और स्पष्ट प्रतिलेखन है; ‘याहवे’ अधिक विद्वत्तापरक वैकल्पिक उच्चारण है।
- issue: בְּנֵי יִשְׂרָאֵל का रूप
  choice: इस्राएल के पुत्र
  alternative: इस्राएली
  rationale: मुख्य पाठ मूल के पुरुषवाची पारिवारिक पदबंध को बनाए रखता है। ‘इस्राएली’ अधिक मुहावरेदार है, पर मूल रूपक और व्याकरणिक रूप को सामान्यीकृत कर देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सुबोध रखी गई है। मूल की पुनरुक्ति—‘किया ... वैसा ही उन्होंने किया’—को आज्ञापालन पर दिए गए बल के कारण बनाए रखा गया है। कोई पादटिप्पणी आवश्यक नहीं मानी गई।
