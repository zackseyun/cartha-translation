source:
  edition: WLC
  text: וַֽ/יהוָ֞ה נָתַ֨ן אֶת חֵ֥ן הָ/עָ֛ם בְּ/עֵינֵ֥י מִצְרַ֖יִם וַ/יַּשְׁאִל֑וּ/ם וַֽ/יְנַצְּל֖וּ אֶת מִצְרָֽיִם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/036.yaml
  text: And Yahweh gave the people favor in the eyes of the Egyptians[a], so that they let them have what they asked; and they plundered Egypt.
translation:
  language: hi
  text: और यहोवा ने मिस्रियों के मन में उन लोगों के लिए अनुग्रह उत्पन्न किया, इसलिए मिस्रियों ने उन्हें वह दे दिया जो उन्होंने माँगा था[a]; इस प्रकार उन्होंने मिस्र को लूट लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, पारंपरिक अनुवाद के अनुसार, “मिस्रियों ने उन्हें उधार दिया।” यहाँ प्रयुक्त इब्रानी क्रिया का अर्थ या तो उधार देना या माँगी हुई वस्तुएँ दे देना समझा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַֽיהוָה
  choice: यहोवा
  rationale: परमेश्वर के विशिष्ट इब्रानी नाम को नाम के रूप में स्पष्ट और गरिमापूर्ण ढंग से प्रस्तुत करता है।
- source_word: נָתַן אֶת־חֵן הָעָם בְּעֵינֵי מִצְרַיִם
  choice: मिस्रियों की दृष्टि में उन लोगों पर कृपा की
  rationale: इब्रानी मुहावरे ‘दृष्टि में कृपा देना’ का भाव सुरक्षित रखते हुए स्वाभाविक हिन्दी में मिस्रियों के अनुकूल व्यवहार को व्यक्त करता है।
- source_word: וַיַּשְׁאִלוּם
  choice: मिस्रियों ने उन्हें वह सब दे दिया जो उन्होंने माँगा था
  rationale: सन्दर्भ में हिफ़ील रूप को माँगी हुई वस्तुएँ प्रदान करने के अर्थ में व्यक्त करता है; कर्ता और कर्म स्पष्ट किए गए हैं ताकि हिन्दी में सर्वनाम-संदेह न रहे। उधार देने की सम्भव पारम्परिक समझ पाद-टिप्पणी में रखी गई है।
- source_word: וַיְנַצְּלוּ
  choice: उन्होंने ... लूट लिया
  rationale: पिएल रूप के ‘वंचित कर देना/माल उतार लेना’ जैसे प्रबल परिणाम को सामान्य आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אֶת־מִצְרָיִם
  choice: मिस्र को
  rationale: मूल पाठ में सामूहिक भौगोलिक-राजनीतिक इकाई ‘मिस्र’ ही प्रत्यक्ष कर्म है।
theological_decisions:
- issue: וַיַּשְׁאִלוּם को ‘उधार दिया’ मानना या माँगी हुई वस्तुएँ दे देने के अर्थ में लेना
  choice: मिस्रियों ने उन्हें वह सब दे दिया जो उन्होंने माँगा था
  alternative: मिस्रियों ने उन्हें उधार दिया
  rationale: निर्गमन के तत्काल सन्दर्भ में मिस्री इस्राएलियों की माँगें स्वीकार करते हैं और परिणामस्वरूप मिस्र लुट जाता है। सामान्य ऋण और वापसी की अपेक्षा आरोपित न करते हुए मुख्य पाठ में प्रदान करने का अर्थ रखा गया है, पर वास्तविक शाब्दिक अनिश्चितता पाद-टिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण पर सहज शैली। ‘उन लोगों’ से इस्राएली समुदाय और ‘मिस्रियों’ से अनुग्रह दिखाने वाला पक्ष स्पष्ट किया गया है। मुख्य पाठ में [a] चिह्न रखा गया है।
