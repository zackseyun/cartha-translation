  yaml_path: translation/ot/exodus/012/014.yaml
  text: And this day shall be for you as a memorial[a], and you shall celebrate it as a feast to Yahweh; throughout your generations, you shall celebrate it as a permanent statute.
translation:
  language: hi
  text: और यह दिन तुम्हारे लिए स्मरण का दिन होगा, और तुम इसे याहवे के लिए पर्व के रूप में मनाओगे; पीढ़ी-दर-पीढ़ी तुम इसे एक स्थायी विधि के रूप में मनाओगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה הַיּוֹם הַזֶּה
  choice: और यह दिन ... होगा
  rationale: कानूनी-निर्देशात्मक प्रसंग में रूप का भावी और नियामक बल है; हिन्दी में ‘होगा’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: לָכֶם לְזִכָּרוֹן
  choice: तुम्हारे लिए स्मरण का दिन
  rationale: זִכָּרוֹן स्मरण अथवा स्मारक का भाव रखता है। ‘स्मरण का दिन’ वर्तमान हिन्दी में स्पष्ट है और दिन के स्मारक-स्वरूप को व्यक्त करता है।
- source_word: וְחַגֹּתֶם אֹתוֹ חַג
  choice: तुम इसे ... पर्व के रूप में मनाना
  rationale: חגג और חַג एक ही शब्द-परिवार के क्रिया और संज्ञा हैं। ‘पर्व के रूप में मनाना’ उत्सवी पालन का अर्थ स्वाभाविक हिन्दी में रखता है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: व्यक्तिगत ईश्वरीय नाम יהוה को हिन्दी में प्रचलित रूप ‘यहोवा’ से दिया गया है; לְ पर्व के समर्पण अथवा अभिमुखता को दर्शाता है।
- source_word: לְדֹרֹתֵיכֶם
  choice: पीढ़ी-दर-पीढ़ी
  rationale: यह मुहावरा आने वाली क्रमिक पीढ़ियों में निरंतर पालन को दर्शाता है; हिन्दी अभिव्यक्ति संक्षिप्त और स्वाभाविक है।
- source_word: חֻקַּת עוֹלָם
  choice: सदा की विधि
  rationale: חֻקָּה स्थापित विधान है और עוֹלָם यहाँ स्थायी अथवा निरंतर काल का बोध देता है। ‘सदा की विधि’ कानूनी तथा कालगत दोनों बल बनाए रखती है।
- source_word: תְּחָגֻּהוּ
  choice: तुम इसे ... मनाना
  rationale: दोहराई गई क्रिया पहले आदेश को बल देती है; ‘मनाना’ की पुनरावृत्ति मूल की पुनरावृत्ति को बनाए रखती है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में चार-अक्षरी व्यक्तिगत नाम सीधे आया है। हिन्दी पाठकों में स्थापित बाइबलीय रूप ‘यहोवा’ नाम को पदवी ‘प्रभु’ में बदलने के बजाय उसकी नामात्मकता सुरक्षित रखता है।
- issue: חֻקַּת עוֹלָם की कालगत शक्ति
  choice: सदा की विधि
  alternative: स्थायी विधि
  rationale: मूल पदबंध दीर्घस्थायी और पीढ़ियों तक जारी रहने वाले विधान को बताता है, पर अपने-आप में दार्शनिक रूप से अंतहीन काल की सारी जटिलताएँ तय नहीं करता; पादटिप्पणी वैकल्पिक हिन्दी को स्पष्ट करती है।
- issue: आज्ञार्थक भाव का हिन्दी रूप
  choice: मनाना
  alternative: मनाओगे
  rationale: इब्रानी विधिक वाक्य भविष्यरूप के माध्यम से बाध्यकारी निर्देश देता है। हिन्दी का ‘मनाना’ आदेशात्मक निर्देश को सहज रूप में व्यक्त करता है, बिना इसे केवल भविष्यवाणी बना देने के।
translation_notes:
  register: आधुनिक मानक हिन्दी में सम्मानपूर्ण, सार्वजनिक पाठ के योग्य शैली रखी गई है। ‘पर्व’, ‘विधि’ और ‘पीढ़ी-दर-पीढ़ी’ सामान्य पाठकों के लिए बोधगम्य रहते हुए विधानात्मक गरिमा बनाए रखते हैं।
