- source_word: בַּלַּיְלָה הַזֶּה
  choice: उसी रात
  rationale: इब्रानी का शाब्दिक अर्थ ‘इस रात में/को’ है। प्रसंग में निर्दिष्ट फसह की रात अभिप्रेत है; ‘उसी रात’ आधुनिक हिन्दी में उस विशिष्टता को सहजता से व्यक्त करता है।
- source_word: צְלִי אֵשׁ
