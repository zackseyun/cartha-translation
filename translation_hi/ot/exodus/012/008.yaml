  rationale: यह आग द्वारा भूनने की विधि बताता है और अगले पद में उबालने के निषेध से उसका अंतर बनाए रखता है।
- source_word: וּמַצּוֹת
  choice: अख़मीरी रोटी
  rationale: מַצּוֹת खमीर रहित रोटी/रोटियों को सूचित करता है; ‘अख़मीरी रोटी’ हिन्दी बाइबलीय प्रयोग में संक्षिप्त और समझने योग्य है।
- source_word: עַל
  choice: के साथ
  rationale: यहाँ עַל स्थान नहीं, भोजन की संगति बताता है; इसलिए ‘के साथ’ प्रसंगानुकूल है।
- source_word: מְרֹרִים
  choice: कड़वे साग
  rationale: शब्द का मूल अर्थ ‘कड़वी वस्तुएँ’ है और भोजन के इस प्रसंग में कड़वी खाने योग्य वनस्पतियाँ अभिप्रेत हैं; ‘कड़वे साग’ अनावश्यक वनस्पति-विशेष तय नहीं करता।
- source_word: יֹאכְלֻהוּ
  choice: वे उसे … खाएँ
  rationale: दूसरी क्रिया और उसके कर्मवाचक प्रत्यय को बनाए रखकर इब्रानी की पुनरुक्ति और मांस की ओर संकेत सुरक्षित रखा गया है।
