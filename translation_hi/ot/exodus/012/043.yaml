base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/043.yaml
  text: 'And Yahweh said to Moses and Aaron[a], “This is the statute of the Passover: no foreigner may eat of it.”'
translation:
  language: hi
  text: 'यहोवा ने मूसा और हारून से कहा, “फसह की विधि यह है: कोई भी विदेशी[a] उसमें से न खाए।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शाब्दिक रूप से, “पराएपन का पुत्र”; अर्थात विदेशी व्यक्ति।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण द्वारा रखा गया है।
- source_word: וַיֹּאמֶר
  choice: ने … कहा
  rationale: साधारण हिब्रू कथात्मक क्रिया का स्वाभाविक हिन्दी रूप।
- source_word: חֻקַּת הַפָּסַח
  choice: फसह की विधि
  rationale: חֻקָּה यहाँ निर्धारित धार्मिक नियम या विधान को सूचित करता है; ‘विधि’ कानूनी भाव बनाए रखते हुए सहज हिन्दी है। הַפָּסַח को व्यापक अर्थ में ‘फसह’ रखा गया है, क्योंकि यह पर्व, बलिदान या भोज की ओर संकेत कर सकता है।
- source_word: כָּל בֶּן נֵכָר לֹא יֹאכַל
  choice: कोई भी विदेशी … न खाए
  rationale: निषेध के साथ כָּל का स्वाभाविक हिन्दी रूप ‘कोई भी … न’ है। בֶּן נֵכָר के हिब्रू मुहावरे को ‘विदेशी’ कहा गया है, बिना मुख्य पाठ में अतिरिक्त वाचा-संबंधी व्याख्या जोड़े।
- source_word: בּוֹ
  choice: उसमें से
  rationale: אכל के साथ ב यहाँ फसह के भोजन में से खाने या उसमें भाग लेने का भाव देता है; ‘उसमें से’ इस संबंध को स्पष्ट और स्वाभाविक रखता है।
theological_decisions:
- issue: फसह के भोजन से बाहर रखे गए व्यक्ति की पहचान
  choice: विदेशी
  alternative: वाचा-समुदाय से बाहर का व्यक्ति; खतनारहित विदेशी
  rationale: इस पद का मूल वाक्यांश केवल בֶּן נֵכָר कहता है। आगे का संदर्भ वाचा की सीमाएँ स्पष्ट करता है, पर उन्हें इस पद के मुख्य पाठ में जोड़ना मूल से अधिक स्पष्टता थोपना होता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘फसह’ बाइबलीय रूप से परिचित शब्द है; ‘विधि’ औपचारिक निर्देश का भाव देता है, जबकि ‘कोई भी विदेशी … न खाए’ निषेध को सामान्य हिन्दी में व्यक्त करता है।
