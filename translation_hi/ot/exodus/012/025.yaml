base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/025.yaml
  text: And when you come into the land that Yahweh will give you[a], just as he promised[b], you shall keep this service.
translation:
  language: hi
  text: और जब तुम उस देश में पहुँचो जिसे यहोवा तुम्हें देगा, जैसा उसने कहा है,[a] तब तुम इस अनुष्ठान[b] का पालन करना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात्, जैसा उसने प्रतिज्ञा की थी। इब्रानी में शाब्दिक अर्थ है, “जैसा उसने कहा।”
    reason: lexical_alternative
  - marker: b
    text: या, “इस सेवा” अथवा “इस धार्मिक विधि।” यहाँ यह फसह के अनुष्ठान को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: और जब
  rationale: यह इब्रानी सूत्र भविष्य में होने वाली परिस्थिति प्रस्तुत करता है; ‘और जब’ स्वाभाविक हिंदी में उसके कालगत अर्थ को रखता है।
- source_word: תָבֹאוּ אֶל הָאָרֶץ
  choice: तुम उस देश में पहुँचो
  rationale: בוא का अर्थ आना, प्रवेश करना या पहुँचना हो सकता है। गंतव्य के रूप में देश के साथ ‘पहुँचो’ सहज और स्पष्ट है।
- source_word: אֲשֶׁר יִתֵּן יְהוָה לָכֶם
  choice: जिसे यहोवा तुम्हें देगा
  rationale: संदर्भ में יִתֵּן भविष्यसूचक है और प्रतिज्ञात देश को परमेश्वर के दान के रूप में प्रस्तुत करता है; יהוה को उसके व्यक्तिवाचक वाचा-नाम ‘यहोवा’ से व्यक्त किया गया है।
- source_word: כַּאֲשֶׁר דִּבֵּר
  choice: जैसा उसने कहा है
  rationale: דבר का सीधा अर्थ ‘कहा/बोला’ है। ‘कहा है’ पूर्व कथन और वर्तमान प्रासंगिकता दोनों रखता है तथा ‘प्रतिज्ञा की’ कहकर निहित अर्थ को मुख्य पाठ में अनिवार्य नहीं बनाता।
- source_word: וּשְׁמַרְתֶּם
  choice: तब तुम … का पालन करना
  rationale: अनुष्ठानिक विषय के साथ שׁמר का अर्थ विधि का ध्यानपूर्वक पालन करना है। हिंदी का यह आज्ञार्थक रूप भविष्य की परिस्थिति में दायित्व स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הָעֲבֹדָה הַזֹּאת
  choice: इस उपासना-विधि
  rationale: עֲבֹדָה सामान्य सेवा भी हो सकती है, पर यहाँ फसह की निर्धारित धार्मिक क्रिया है। ‘उपासना-विधि’ उसके अनुष्ठानिक और परमेश्वर-संबंधी दोनों पहलुओं को सामान्य पाठक के लिए स्पष्ट करती है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में टेट्राग्रामटन व्यक्तिवाचक नाम के रूप में है। आधुनिक हिंदी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला ‘यहोवा’ नाम को सामान्य उपाधि में बदलने के बजाय सुरक्षित रखता है।
- issue: כַּאֲשֶׁר דִּבֵּר में प्रतिज्ञा का भाव
  choice: जैसा उसने कहा है
  alternative: जैसा उसने प्रतिज्ञा की थी
  rationale: देश देने की पूर्व घोषणा संदर्भतः प्रतिज्ञा है, पर क्रिया का शाब्दिक अर्थ ‘कहा’ है। मुख्य पाठ मूल की व्यापकता रखता है और पादटिप्पणी प्रतिज्ञात्मक अर्थ बताती है।
translation_notes:
  register: आधुनिक मानक हिंदी, सरल किंतु गरिमापूर्ण। वाक्य की भविष्यकालीन शर्त और उसके बाद आने वाला दायित्व स्पष्ट रखा गया है; धार्मिक पारिभाषिकता को अत्यधिक संस्कृतनिष्ठ बनाए बिना व्यक्त किया गया है।
