  yaml_path: translation/ot/exodus/012/005.yaml
  text: Your lamb shall be without blemish[a], a male a year old; you shall take it from the sheep or from the goats.
translation:
  language: hi
  text: तुम्हारे लिए भेड़-बकरी के झुंड का एक पशु निर्दोष और एक वर्ष का नर होना चाहिए; उसे भेड़ों या बकरियों में से लेना चाहिए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֶׂה
  choice: पशु
  rationale: यह शब्द भेड़ या बकरी के छोटे पशु—मेमने या बकरी के बच्चे—दोनों के लिए प्रयुक्त हो सकता है। अगले वाक्यांश में दोनों विकल्प स्पष्ट हैं; इसलिए मुख्य पाठ में व्यापक शब्द रखा गया है और पादटिप्पणी में उसका दायरा बताया गया है।
- source_word: תָמִים
  choice: निर्दोष
  rationale: बलि के पशु के संदर्भ में इसका अर्थ किसी शारीरिक दोष या खोट से रहित होना है। ‘निर्दोष’ संक्षिप्त और स्वाभाविक है।
- source_word: זָכָר
  choice: नर
  rationale: यह पशु के लिंग का सीधा और सटीक संकेत है।
- source_word: בֶּן שָׁנָה
  choice: एक वर्ष का
  rationale: इब्रानी मुहावरे का स्वाभाविक हिन्दी रूप, जो पशु की निर्धारित आयु बताता है।
- source_word: יִהְיֶה לָכֶם
  choice: तुम्हारे लिए ... हो
  rationale: यह आवश्यक योग्यता को विधिसूचक ढंग से व्यक्त करता है और לָכֶם को भी अनावश्यक विस्तार के बिना सुरक्षित रखता है।
- source_word: מִן הַכְּבָשִׂים וּמִן הָעִזִּים
  choice: भेड़ों या बकरियों में से
  rationale: दो अनुमत पशु-समूहों को दर्शाता है। हिन्दी में ‘या’ चयनात्मक भाव स्पष्ट करता है, यद्यपि स्रोत में संयोजक וְ है।
- source_word: תִּקָּחוּ
  choice: उसे ... लेना
  rationale: द्वितीय पुरुष बहुवचन निर्देश को स्वाभाविक हिन्दी विधिसूचक शैली में रखा गया है; ‘उसे’ पूर्वोक्त एकवचन पशु से स्पष्ट रूप से पूरा किया गया है।
