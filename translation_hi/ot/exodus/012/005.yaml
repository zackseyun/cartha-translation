translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, संक्षिप्त विधिसूचक और गरिमापूर्ण रखी गई है। ‘पशु’ को पादटिप्पणी सहित चुनकर इब्रानी शब्द की व्यापकता सुरक्षित रखी गई है; ‘उसे ... लेना’ आज्ञार्थक निर्देश को सहज हिन्दी में व्यक्त करता है।
