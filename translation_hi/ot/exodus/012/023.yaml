base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/023.yaml
  text: For Yahweh will pass through to strike Egypt[a], and when he sees the blood on the lintel and on the two doorposts[b], Yahweh will pass over the doorway and will not allow the destroyer to enter your houses to strike.
translation:
  language: hi
  text: क्योंकि यहोवा मिस्र पर प्रहार करने के लिए देश में से होकर जाएगा; और जब वह द्वार की ऊपरी चौखट और दोनों बाज़ुओं पर लगा हुआ लहू देखेगा, तब यहोवा उस द्वार के ऊपर से होकर निकल जाएगा[a] और नाश करनेवाले को तुम्हारे घरों में प्रवेश करके प्रहार करने नहीं देगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस द्वार को बचा लेगा” अथवा “उस द्वार की रक्षा करेगा।” इब्रानी क्रिया फसह के नाम से संबंधित शब्द है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “नाश करनेवाले” की पहचान स्पष्ट नहीं की गई है; कुछ इसे न्याय करने वाला स्वर्गदूत समझते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के व्यक्तिगत नाम के प्रचलित लिप्यंतरण का प्रयोग किया गया है; इसे केवल उपाधि ‘प्रभु’ से नहीं बदला गया।
- source_word: וְעָבַר
  choice: देश में से होकर जाएगा
  rationale: עבר यहाँ मिस्र के बीच से होकर न्याय करने के लिए जाने की गति बताता है और इसे आगे आने वाले פסח से अलग रखता है। ‘देश’ प्रसंग से स्पष्ट पूरक है।
- source_word: לִנְגֹּף אֶת מִצְרַיִם
  choice: मिस्रियों को मारने के लिए
  rationale: נגף घातक प्रहार का बोध कराता है। מִצְרַיִם यहाँ केवल भूभाग के बजाय न्याय के अधीन मिस्र के लोगों को सूचित करता है; स्वाभाविक हिन्दी में ‘मिस्रियों’ से यह अर्थ स्पष्ट होता है।
- source_word: וְרָאָה
  choice: जब वह ... देखेगा
  rationale: क्रम में यह भावी कार्य की समयगत परिस्थिति व्यक्त करता है; आधुनिक हिन्दी में ‘जब’ इसे स्वाभाविक रूप से प्रकट करता है।
- source_word: הַדָּם
  choice: लगा हुआ लहू
  rationale: निश्चित रक्त का संकेत पूर्व आदेश में चौखट पर लगाए गए बलिदानी लहू की ओर है; ‘लगा हुआ’ प्रसंगगत और स्वाभाविक है।
- source_word: הַמַּשְׁקוֹף
  choice: चौखट का ऊपरी भाग
  rationale: यह द्वार की चौखट के ऊपर के आड़े भाग को बताता है। सामान्य पाठक के लिए तकनीकी ‘शहतीर’ अथवा दुर्बोध वास्तुशब्द की अपेक्षा यह स्पष्ट है।
- source_word: שְׁתֵּי הַמְּזוּזֹת
  choice: दोनों बाज़ू
  rationale: यह द्वार-चौखट के दोनों खड़े पार्श्वों को दर्शाता है; ‘चौखट ... दोनों बाज़ू’ हिन्दी में संरचना को सहज ढंग से व्यक्त करता है।
- source_word: וּפָסַח
  choice: लाँघ जाएगा
  rationale: פסח से फसह-वृत्तांत का प्रमुख शब्द-संबंध बना रहता है, जबकि इसका बचाने या रक्षा करने का संभावित अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: עַל הַפֶּתַח
  choice: उस द्वार को
  rationale: פתח यहाँ घर के प्रवेश-द्वार या द्वारमार्ग को सूचित करता है। ‘उस द्वार को लाँघ जाएगा’ हिन्दी में गति-चित्र को स्वाभाविक रखता है।
- source_word: וְלֹא יִתֵּן
  choice: नहीं देगा
  rationale: נתן और infinitive का मुहावरेदार अर्थ अनुमति देना है; हिन्दी की ‘करने नहीं देगा’ रचना इसे ठीक से व्यक्त करती है।
- source_word: הַמַּשְׁחִית
  choice: नाश करनेवाला
  rationale: मूल पाठ विनाश के कर्ता का उल्लेख करता है, पर उसकी पहचान को स्वर्गदूत के रूप में निश्चित नहीं करता।
theological_decisions:
- issue: यहोवा और ‘नाश करनेवाले’ का संबंध
  choice: 'दोनों को अलग रूप में रखा गया है: यहोवा न्याय के लिए जाता है और नाश करनेवाले को घरों में घुसने से रोकता है।'
  alternative: ‘नाश करनेवाले’ को यहोवा का ही दूसरा वर्णन मानना, अथवा मुख्य पाठ में ‘नाश करनेवाला स्वर्गदूत’ कहना।
  rationale: इब्रानी वाक्य में יְהוָה और הַמַּשְׁחִית व्याकरणतः अलग हैं। अनुवाद उनकी पहचान को न तो मिला देता है, न मूल से अधिक निश्चित करता है।
- issue: פסח का अर्थ
  choice: मुख्य पाठ में ‘लाँघ जाएगा’ और पादटिप्पणी में ‘बचा लेगा/रक्षा करेगा’ की अर्थ-संभावना।
  alternative: मुख्य पाठ में केवल ‘बचा लेगा’ या ‘रक्षा करेगा’।
  rationale: यह चयन फसह-कथा के प्रमुख क्रियात्मक चित्र को बनाए रखता है और साथ ही शब्द में संभावित रक्षात्मक अर्थ को दबाता नहीं है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए स्पष्ट रखी गई है। ‘चौखट का ऊपरी भाग’ और ‘दोनों बाज़ू’ सहज वास्तु-वर्णन हैं। ‘नाश करनेवाला’ मूल की अनिश्चितता बनाए रखता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
