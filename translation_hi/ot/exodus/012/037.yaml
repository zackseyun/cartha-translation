- from: इस्राएली रामसेस से सुक्कोत के लिए निकल पड़े। बच्चों को छोड़कर, पैदल चलनेवाले पुरुष लगभग छः लाख थे।
  to: इस्राएली रामसेस से सुक्कोत की ओर चले। बच्चों को गिने बिना, पैदल चलनेवाले पुरुष लगभग छह लाख थे।
