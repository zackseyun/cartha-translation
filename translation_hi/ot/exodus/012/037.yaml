  yaml_path: translation/ot/exodus/012/037.yaml
  text: And the sons of Israel journeyed from Rameses to Succoth[a], about six hundred thousand men on foot[d][c][b], besides children.
translation:
  language: hi
  text: इस्राएली रामसेस से सुक्कोत की ओर चले। बच्चों को गिने बिना, पैदल चलनेवाले पुरुष लगभग छह लाख थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: निकल पड़े
  rationale: נסע शिविर उठाकर यात्रा आरम्भ करने को व्यक्त कर सकता है; ‘निकल पड़े’ आधुनिक हिन्दी में इस आरम्भिक गति को स्वाभाविक ढंग से बताता है।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएली
  rationale: शाब्दिक अर्थ ‘इस्राएल के पुत्र’ है, पर यहाँ यह पूरे जातीय समुदाय का प्रचलित नाम है; ‘इस्राएली’ स्वाभाविक और संदर्भानुकूल है।
- source_word: מֵרַעְמְסֵס סֻכֹּתָה
  choice: रामसेस से सुक्कोत के लिए
  rationale: מִן उद्गम और दिशासूचक ה गंतव्य प्रकट करते हैं; हिन्दी में ‘से ... के लिए’ गति को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: כְּשֵׁשׁ מֵאוֹת אֶלֶף
  choice: लगभग छः लाख
  rationale: संख्या से पहले כְּ अनुमान दर्शाता है; भारतीय हिन्दी संख्या-पद्धति में 600,000 को स्वाभाविक रूप से ‘छः लाख’ कहा जाता है।
- source_word: רַגְלִי הַגְּבָרִים
  choice: पैदल चलनेवाले पुरुष
  rationale: רַגְלִי पैदल जानेवालों को और הַגְּבָרִים पुरुषों को सूचित करता है; यह अनुवाद दोनों तत्वों को बनाए रखता है।
- source_word: לְבַד מִטָּף
  choice: बच्चों को छोड़कर
  rationale: טַף छोटे बच्चों अथवा छोटे आश्रितों के लिए प्रयुक्त होता है; ‘बच्चों को छोड़कर’ स्पष्ट करता है कि वे उल्लिखित संख्या में शामिल नहीं थे।
