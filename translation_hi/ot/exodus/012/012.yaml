source:
  edition: WLC
  text: וְ/עָבַרְתִּ֣י בְ/אֶֽרֶץ מִצְרַיִם֮ בַּ/לַּ֣יְלָה הַ/זֶּה֒ וְ/הִכֵּיתִ֤י כָל בְּכוֹר֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם מֵ/אָדָ֖ם וְ/עַד בְּהֵמָ֑ה וּ/בְ/כָל אֱלֹהֵ֥י מִצְרַ֛יִם אֶֽעֱשֶׂ֥ה שְׁפָטִ֖ים אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/012.yaml
  text: For I will pass through the land of Egypt on this night[a], and I will strike every firstborn in the land of Egypt, from man to beast; and against all the gods of Egypt I will execute judgments[c][b]. I am Yahweh.
translation:
  language: hi
  text: क्योंकि इसी रात मैं मिस्र देश में से होकर जाऊँगा[a] और मिस्र देश के हर पहलौठे को—मनुष्य से लेकर पशु तक[b]—मारूँगा। मैं मिस्र के सभी देवताओं के विरुद्ध न्याय के कार्य करूँगा। मैं याहवे हूँ[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं मिस्र देश में से होकर निकलूँगा।” यहाँ क्रिया का अर्थ देश में से होकर जाना है, न कि किसी को छोड़ देना।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “मनुष्य से लेकर पशु तक।”
    reason: source_form
  - marker: c
    text: 'इब्रानी: YHWH (יהוה); “याहवे” इसका प्रचलित संभावित उच्चारण है। परंपरागत रूप से इसे “प्रभु” भी अनूदित किया गया है।'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָבַרְתִּי
  choice: मैं ... में से होकर जाऊँगा
  rationale: עבר के साथ בְּאֶרֶץ यहाँ देश के भीतर से होकर जाने को व्यक्त करता है, न कि किसी को छोड़ देने या उसके ऊपर से निकल जाने को।
- source_word: בְאֶרֶץ מִצְרַיִם
  choice: मिस्र देश में से
  rationale: मूल पाठ में אֶרֶץ भौगोलिक क्षेत्र को स्पष्ट करता है; ‘देश’ रखने से यह दायरा बना रहता है।
- source_word: בַּלַּיְלָה הַזֶּה
  choice: इसी रात
  rationale: यह स्वाभाविक आधुनिक हिन्दी है और संकेतवाचक הַזֶּה के बल को सुरक्षित रखती है।
- source_word: וְהִכֵּיתִי
  choice: मारूँगा
  rationale: इस प्रसंग में נכה प्राणघातक प्रहार को दर्शाता है; हिन्दी में ‘मारूँगा’ स्पष्ट और स्वाभाविक है।
- source_word: כָּל בְּכוֹר
  choice: हर पहलौठे
  rationale: एकवचन सामूहिक पद का स्वाभाविक हिन्दी रूप; मूल में ‘नर’ अलग से नहीं है, इसलिए नहीं जोड़ा गया।
- source_word: מֵאָדָם וְעַד בְּהֵמָה
  choice: मनुष्य से लेकर पशु तक
  rationale: यह मूल की आरंभ-से-अंत तक की समावेशी रचना को स्पष्ट और निकट रूप में रखता है।
- source_word: וּבְכָל אֱלֹהֵי מִצְרַיִם
  choice: मिस्र के सभी देवताओं का
  rationale: אֱלֹהִים को ‘देवता’ ही रखा गया है; इसे मूर्तियों या शासकों के रूप में व्याख्यायित नहीं किया गया।
- source_word: אֶעֱשֶׂה שְׁפָטִים
  choice: न्याय करूँगा
  rationale: यह शाब्दिक न्यायिक बल को बनाए रखते हुए हिन्दी में संक्षिप्त और गंभीर है; बहुवचन ‘न्याय के कार्य’ भी संभव है।
- source_word: אֲנִי יְהוָה
  choice: मैं यहोवा हूँ
  rationale: व्यक्तिगत दिव्य नाम יהוה को हिन्दी में प्रचलित नामरूप ‘यहोवा’ से प्रस्तुत किया गया है, न कि उपाधि ‘प्रभु’ से।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे आया है। मुख्य पाठ में नाम को नाम के रूप में रखने हेतु हिन्दी में व्यापक रूप से पहचाना जाने वाला ‘यहोवा’ चुना गया; संभावित उच्चारण ‘याहवे’ पादटिप्पणी में दिया गया है।
- issue: אֱלֹהֵי מִצְרַיִם की स्थिति
  choice: मिस्र के सभी देवता
  alternative: मिस्र की सभी मूर्तियाँ; मिस्र के शासक
  rationale: मूल पाठ स्पष्टतः मिस्र के देवताओं की बात करता है। अनुवाद उनकी अस्तित्वगत स्थिति को न तय करता है, न पद को रूपक बनाता है।
- issue: אֶעֱשֶׂה שְׁפָטִים का न्यायिक बल
  choice: न्याय करूँगा
  alternative: दण्ड दूँगा; न्याय के कार्य करूँगा
  rationale: ‘न्याय’ मूल की न्यायिक धारणा को सुरक्षित रखता है और केवल दण्ड तक अर्थ को सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट। ‘इसी रात’ कथन के बल को रखता है; डैश मनुष्य और पशु की समावेशी सीमा को पठनीय बनाते हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
