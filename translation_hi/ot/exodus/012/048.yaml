  text: וְ/כִֽי יָג֨וּר אִתְּ/ךָ֜ גֵּ֗ר וְ/עָ֣שָׂה פֶסַח֮ לַ/יהוָה֒ הִמּ֧וֹל ל֣/וֹ כָל זָכָ֗ר וְ/אָז֙ יִקְרַ֣ב לַ/עֲשֹׂת֔/וֹ וְ/הָיָ֖ה כְּ/אֶזְרַ֣ח הָ/אָ֑רֶץ וְ/כָל עָרֵ֖ל לֹֽא יֹ֥אכַל בּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/048.yaml
  text: If a sojourner resides with you and keeps the Passover to Yahweh[a], every male belonging to him must be circumcised; then he may come near to keep it, and he shall be like a native of the land[c][b]. But no uncircumcised person may eat of it.
translation:
  language: hi
  text: यदि कोई परदेशी[a] तुम्हारे यहाँ रहता हो और याहवे[b] के लिए फ़सह मनाए, तो उसके यहाँ के हर पुरुष का खतना किया जाए। तब वह उसे मनाने के लिए निकट आए, और वह देश के मूल निवासी के समान होगा। पर कोई भी खतनारहित पुरुष उसमें से न खाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘परदेशी’ (גֵּר) से आशय इस्राएलियों के बीच रहने वाले गैर-मूल निवासी से है, केवल कुछ समय के लिए आए यात्री से नहीं।
    reason: lexical_alternative
  - marker: b
    text: ‘याहवे’ इब्रानी में परमेश्वर के नाम יהוה का लिप्यंतरण है।
    reason: alternative_reading
lexical_decisions:
- source_word: גֵּר
  choice: परदेशी
  rationale: यह शब्द किसी राहगीर नहीं, बल्कि इस्राएलियों के बीच रहने वाले गैर-मूल निवासी को दर्शाता है। ‘परदेशी’ सहज हिन्दी है; पादटिप्पणी में उसके निवासी होने का कानूनी-सामाजिक भाव स्पष्ट किया गया है।
- source_word: יָגוּר אִתְּךָ
  choice: तुम्हारे यहाँ रहता हो
  rationale: גור यहाँ अस्थायी यात्रा नहीं, परदेशी के रूप में निवास करने का भाव देता है।
- source_word: וְעָשָׂה פֶסַח
  choice: फ़सह मनाए
  rationale: शाब्दिक रूप से ‘फ़सह करे/बनाए’; अनुष्ठान या पर्व के पालन के लिए ‘मनाए’ स्वाभाविक हिन्दी है और मूल में न आए ‘चाहे’ को नहीं जोड़ता।
- source_word: לַיהוָה
  choice: याहवे के लिए
  rationale: ל समर्पण या उद्देश्य का भाव देता है और יהוה को उसके व्यक्तिगत वाचा-नाम ‘याहवे’ से प्रस्तुत किया गया है।
- source_word: הִמּוֹל לוֹ כָל זָכָר
  choice: उसके सभी पुरुषों का खतना किया जाए
  rationale: यह विधिक आदेश उसके घराने या समूह के प्रत्येक पुरुष पर लागू होने वाली अनिवार्यता व्यक्त करता है।
- source_word: וְאָז יִקְרַב לַעֲשֹׂתוֹ
  choice: उसके बाद वह निकट आकर उसे मनाए
  rationale: קרב को केवल अनुमति में बदलने के बजाय उसके धार्मिक ‘निकट आने’ के भाव को बनाए रखा गया है; ‘उसे’ फ़सह की ओर संकेत करता है।
- source_word: כְּאֶזְרַח הָאָרֶץ
  choice: देश के मूल निवासी के समान
  rationale: אֶזְרָח स्थानीय, मूल निवासी समुदाय-सदस्य को दर्शाता है; यह तुलना उसकी फ़सह में भागीदारी की स्थिति बताती है।
- source_word: עָרֵל
  choice: खतनारहित पुरुष
  rationale: मूल विशेषण पुल्लिंग एकवचन है और निकट संदर्भ में प्रत्येक पुरुष के खतने की शर्त है; इसलिए ‘पुरुष’ स्पष्ट और संदर्भानुकूल है।
- source_word: לֹא יֹאכַל בּוֹ
  choice: उसमें से न खाए
  rationale: निषेधात्मक रूप रखा गया है; בּוֹ फ़सह के भोजन/बलि में से खाने और इस प्रकार भाग लेने का संकेत देता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम יהוה है। ‘याहवे’ उसका व्यापक रूप से स्वीकृत विद्वत्तापूर्ण लिप्यंतरण है और नाम को उपाधि में नहीं बदलता।
- issue: परदेशी की फ़सह में भागीदारी
  choice: उसके सभी पुरुषों के खतने के बाद उसे मूल निवासी के समान भाग लेने दिया जाता है
  alternative: पूर्ण जातीय बहिष्कार; या किसी भी वाचागत चिह्न के बिना भागीदारी
  rationale: पाठ समावेश और वाचागत सीमा—दोनों को साथ रखता है। अनुवाद बाद की धर्मवैज्ञानिक श्रेणियाँ जोड़े बिना इसी तनाव को सुरक्षित रखता है।
- issue: יִקְרַב का विधिक बल
  choice: निकट आकर उसे मनाए
  alternative: वह उसे मना सकता है; वह निकट आए
  rationale: हिब्रू रूप अनुमति और निर्देश के बीच कुछ खुलापन रखता है। चुना गया वाक्य धार्मिक निकटता और परिणामी सहभागिता दोनों को व्यक्त करता है, बिना उसे केवल स्थानगत गति या केवल अनुमति बनाने के।
translation_notes:
  register: भाषा आधुनिक, सरल और विधिक गरिमा वाली रखी गई है। ‘फ़सह’, ‘खतना’ और ‘याहवे’ जैसे स्थापित धार्मिक शब्द बनाए गए हैं। एकवचन ‘तुम्हारे’ मूल के संबोधन को दर्शाता है; वाक्य-विन्यास को हिन्दी में स्वाभाविक बनाने के लिए शर्त और उसके परिणाम को अलग वाक्यों में रखा गया है।
