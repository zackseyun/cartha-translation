source:
  edition: WLC
  text: וַ/יְהִ֣י בַּ/חֲצִ֣י הַ/לַּ֗יְלָה וַֽ/יהוָה֮ הִכָּ֣ה כָל בְּכוֹר֮ בְּ/אֶ֣רֶץ מִצְרַיִם֒ מִ/בְּכֹ֤ר פַּרְעֹה֙ הַ/יֹּשֵׁ֣ב עַל כִּסְא֔/וֹ עַ֚ד בְּכ֣וֹר הַ/שְּׁבִ֔י אֲשֶׁ֖ר בְּ/בֵ֣ית הַ/בּ֑וֹר וְ/כֹ֖ל בְּכ֥וֹר בְּהֵמָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/029.yaml
  text: And at midnight Yahweh struck down every firstborn in the land of Egypt[a], from the firstborn of Pharaoh, who sat on his throne, to the firstborn of the captive who was in the prison pit, and every firstborn of the livestock.
translation:
  language: hi
  text: आधी रात को याहवे ने मिस्र देश के हर पहलौठे को मार डाला—सिंहासन पर बैठे फ़िरौन के पहलौठे से लेकर उस बंदी के पहलौठे तक, जो कालकोठरी में था—और पशुओं के हर पहलौठे को भी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בַּחֲצִי הַלַּיְלָה
  choice: आधी रात को
  rationale: कथात्मक सूत्र וַיְהִי को हिंदी में अलग से व्यक्त करना आवश्यक नहीं; समय-सूचक वाक्यांश से घटना का क्रम स्वाभाविक रूप से आरंभ होता है। בַּחֲצִי הַלַּיְלָה का प्रचलित और सटीक हिंदी रूप ‘आधी रात को’ है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिंदी में प्रचलित नाम-रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: הִכָּה
  choice: मार डाला
  rationale: नכה का मूल अर्थ प्रहार करना है, किंतु इस प्रसंग में परिणाम स्पष्टतः मृत्यु है; ‘मार डाला’ आधुनिक हिंदी में उस घातक अर्थ को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: כָל בְּכוֹר
  choice: हर पहलौठे
  rationale: בכור के लिए ‘पहलौठा’ पारंपरिक, संक्षिप्त और सामान्य हिंदी बाइबलीय शब्द है; ‘हर’ כָל की वितरणात्मक शक्ति को व्यक्त करता है।
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: मिस्र देश के
  rationale: इब्रानी भौगोलिक अभिव्यक्ति ‘मिस्र देश’ के रूप में सुरक्षित है; हिंदी वाक्य-विन्यास में ‘के हर पहलौठे’ स्थान-सीमा को स्वाभाविक ढंग से दर्शाता है।
- source_word: מִבְּכֹר פַּרְעֹה ... עַד בְּכוֹר הַשְּׁבִי
  choice: फ़िरौन के पहलौठे से लेकर ... बंदी के पहलौठे तक
  rationale: מִן ... עַד की सीमा-संरचना को ‘से लेकर ... तक’ द्वारा स्पष्ट रूप से बनाए रखा गया है।
- source_word: הַיֹּשֵׁב עַל כִּסְאוֹ
  choice: सिंहासन पर बैठे
  rationale: सहभागी रूप फ़िरौन की राजकीय स्थिति बताता है; ‘सिंहासन पर बैठे’ संक्षिप्त और स्वाभाविक हिंदी है तथा कालगत तनाव को अनावश्यक रूप से नहीं बढ़ाता।
- source_word: הַשְּׁבִי
  choice: बंदी
  rationale: שבי उस व्यक्ति को दर्शाता है जिसे बंदी बनाया गया हो; ‘बंदी’ ‘कैदी’ की अपेक्षा मूल शब्द की व्यापकता बनाए रखता है।
- source_word: בְּבֵית הַבּוֹר
  choice: कारागार के गड्ढे में
  rationale: בּוֹר की ठोस ‘गड्ढा’ छवि और בֵּית के कारावास-संदर्भ दोनों को रखा गया है; केवल ‘जेल’ या ‘कालकोठरी’ कहने से मूल रूपक सपाट हो जाता।
- source_word: וְכֹל בְּכוֹר בְּהֵמָה
  choice: और पशुओं के हर पहलौठे को भी
  rationale: בְּהֵמָה यहाँ पालतू पशुओं का सामूहिक बोध देता है। ‘पशुओं’ सामान्य पाठक के लिए सहज है, और ‘भी’ अंतिम समावेश को स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है, इसलिए ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया। हिंदी में व्यापक रूप से पहचाने जाने वाले लिप्यंतरण ‘यहोवा’ को चुना गया; ‘याहवे’ अधिक संभावित विद्वत पुनर्निर्मित उच्चारण है, पर हिंदी सामान्य पाठक में कम स्थापित है।
- issue: הִכָּה में प्रहार और मृत्यु का संबंध
  choice: मार डाला
  alternative: प्रहार किया
  rationale: इस दसवीं विपत्ति के संदर्भ में क्रिया का परिणाम मृत्यु है। केवल ‘प्रहार किया’ घातक परिणाम को हिंदी में अस्पष्ट कर सकता है, जबकि ‘मार डाला’ प्रसंगगत अर्थ को बिना अतिरिक्त धार्मिक व्याख्या के व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। सामाजिक विस्तार को दिखाने वाली ‘से लेकर ... तक’ संरचना और मूल की ‘कारागार के गड्ढे’ वाली ठोस छवि सुरक्षित रखी गई है। कोई पाद-टिप्पणी आवश्यक नहीं समझी गई, क्योंकि ‘बंदी’ और ‘कारागार के गड्ढे’ दोनों मूल अर्थ को मुख्य पाठ में पर्याप्त रूप से समेटते हैं।
