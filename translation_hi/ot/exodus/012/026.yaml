source:
  edition: WLC
  text: וְ/הָיָ֕ה כִּֽי יֹאמְר֥וּ אֲלֵי/כֶ֖ם בְּנֵי/כֶ֑ם מָ֛ה הָ/עֲבֹדָ֥ה הַ/זֹּ֖את לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/026.yaml
  text: And when your sons say to you[a], ‘What is this service to you?’
translation:
  language: hi
  text: और जब तुम्हारे बेटे तुमसे कहें, “यह सेवा तुम्हारे लिए क्या है?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात, “इस सेवा का तुम्हारे लिए क्या अर्थ है?”
    reason: मूल इब्रानी प्रश्न का यह अधिक स्वाभाविक, किंतु कुछ अधिक व्याख्यात्मक हिंदी रूप है।
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: और जब
  rationale: यह संयुक्त इब्रानी पदबंध भविष्य में घटने वाली परिस्थिति का परिचय देता है। हिंदी में “और जब” इसका स्वाभाविक और संक्षिप्त रूप है।
- source_word: יֹאמְרוּ אֲלֵיכֶם
  choice: तुमसे कहें
  rationale: אָמַר का मूल अर्थ “कहना” है। कथन प्रश्न के रूप में है, फिर भी “कहें” मूल क्रिया को सुरक्षित रखता है; “पूछें” अधिक व्याख्यात्मक होता।
- source_word: בְּנֵיכֶם
  choice: तुम्हारे बेटे
  rationale: בֵּן का बहुवचन यहाँ स्पष्ट रूप से “बेटे” है; “बच्चे” कहना मूल की लिंग-विशिष्टता को सामान्य बना देता।
- source_word: הָעֲבֹדָה הַזֹּאת
  choice: यह सेवा
  rationale: עֲבֹדָה का अर्थ काम, सेवा या धार्मिक अनुष्ठानिक सेवा हो सकता है। “सेवा” फसह के संदर्भ को व्यक्त करते हुए इस अर्थ-विस्तार को सुरक्षित रखता है।
- source_word: מָה ... לָכֶם
  choice: तुम्हारे लिए क्या है
  rationale: यह रूप मूल इब्रानी प्रश्न की संरचना और उसकी संभावित अर्थगत व्यापकता को बनाए रखता है; इसे केवल “क्या अर्थ है” कहने से प्रश्न का आशय कुछ अधिक निश्चित हो जाता।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक और सहज रखी गई है, पर प्रश्न में मूल इब्रानी की संक्षिप्त तथा कुछ खुली हुई अभिव्यक्ति को जानबूझकर सुरक्षित रखा गया है। “सेवा” धार्मिक अनुष्ठान तक अर्थ को सीमित किए बिना फसह-संदर्भ के लिए उपयुक्त है।
