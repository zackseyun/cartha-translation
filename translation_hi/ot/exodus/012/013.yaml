  text: וְ/הָיָה֩ הַ/דָּ֨ם לָ/כֶ֜ם לְ/אֹ֗ת עַ֤ל הַ/בָּתִּים֙ אֲשֶׁ֣ר אַתֶּ֣ם שָׁ֔ם וְ/רָאִ֨יתִי֙ אֶת הַ/דָּ֔ם וּ/פָסַחְתִּ֖י עֲלֵ/כֶ֑ם וְ/לֹֽא יִֽהְיֶ֨ה בָ/כֶ֥ם נֶ֨גֶף֙ לְ/מַשְׁחִ֔ית בְּ/הַכֹּתִ֖/י בְּ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/013.yaml
  text: And the blood shall be a sign for you on the houses where you are[a]. When I see the blood, I will pass over you[b], and no plague will be among you to destroy, when I strike the land of Egypt.
translation:
  language: hi
  text: और वह लहू तुम्हारे लिए जिन घरों में तुम हो, उन घरों पर एक चिन्ह होगा। जब मैं लहू देखूँगा, तब मैं तुम्हारे ऊपर से निकल जाऊँगा[a]; और जब मैं मिस्र देश को मारूँगा, तब तुम्हारे बीच ऐसी कोई विपत्ति नहीं होगी जो नाश करे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं तुम्हें छोड़ दूँगा” अथवा “मैं तुम्हारी रक्षा करूँगा।”
    reason: lexical_alternative
  - marker: b
    text: या, “तुम्हारे बीच विनाशक के लिए कोई विपत्ति नहीं होगी,” जहाँ מַשְׁחִית को संज्ञा “विनाशक” के रूप में समझा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה הַדָּם לָכֶם לְאֹת
  choice: वह लहू तुम्हारे लिए ... एक चिन्ह होगा
  rationale: भविष्यसूचक-परिणामात्मक बल को स्वाभाविक हिन्दी में रखा गया है; निश्चित संज्ञा הַדָּם को पहले बताए गए लहू के रूप में ‘वह लहू’ कहा गया है।
- source_word: עַל הַבָּתִּים אֲשֶׁר אַתֶּם שָׁם
  choice: उन घरों पर ... जिनमें तुम हो
  rationale: עַל का स्थानवाचक अर्थ ‘पर’ और सम्बन्धवाचक उपवाक्य का सीधा अर्थ सुरक्षित रहता है।
- source_word: וְרָאִיתִי אֶת־הַדָּם
  choice: जब मैं लहू को देखूँगा
  rationale: समन्वयी हिब्रू वाक्यांश यहाँ घटनाक्रम में समय-सूचक है; ‘जब’ आधुनिक हिन्दी में उसका स्वाभाविक रूप है।
- source_word: וּפָסַחְתִּי עֲלֵכֶם
  choice: मैं तुम्हारे ऊपर से निकल जाऊँगा
  rationale: פסח और עַל की दृश्यात्मक तथा फसह-संबंधी शब्दावली को बनाए रखा गया है; ‘बचा दूँगा’ और ‘रक्षा करूँगा’ सम्भव अर्थगत विकल्प हैं, पर वे मुख्य पाठ में क्रिया की छवि को अधिक निर्णीत कर देते।
- source_word: וְלֹא יִהְיֶה בָכֶם נֶגֶף
  choice: तुम्हारे बीच ऐसी कोई विपत्ति नहीं होगी
  rationale: בָכֶם को ‘तुम्हारे बीच’ और נֶגֶף को इस प्रसंग में सामान्य पाठक के लिए स्पष्ट ‘विपत्ति’ से व्यक्त किया गया है।
- source_word: לְמַשְׁחִית
  choice: जो नाश करे
  rationale: रूप को विपत्ति के विनाशकारी परिणाम/कार्य से जोड़ा गया है और किसी पृथक व्यक्तिगत विनाशक को मुख्य पाठ में अनिवार्य नहीं बनाया गया।
- source_word: בְּהַכֹּתִי בְּאֶרֶץ מִצְרָיִם
  choice: जब मैं मिस्र देश को मारूँगा
  rationale: בְּ + infinitive construct का कालवाचक बल ‘जब’ से और प्रहार का सीधा अर्थ ‘मारूँगा’ से व्यक्त किया गया है।
theological_decisions:
- issue: וּפָסַחְתִּי עֲלֵיכֶם में क्रिया פסח का आशय
  choice: मैं तुम्हारे ऊपर से निकल जाऊँगा
  alternative: मैं तुम्हें छोड़ दूँगा / मैं तुम्हारी रक्षा करूँगा
  rationale: मुख्य पाठ क्रिया की स्थानात्मक छवि और फसह से उसके शाब्दिक सम्बन्ध को रखता है, जबकि सम्भावित प्रभावगत अर्थ पादटिप्पणी में सुरक्षित हैं।
- issue: לְמַשְׁחִית व्यक्तिगत विनाशक है या विनाशकारी परिणाम/कार्य
  choice: जो नाश करे
  alternative: विनाशक के कारण / विनाशक के रूप में
  rationale: हिब्रू रूप दोनों प्रकार से समझा जा सकता है। मुख्य पाठ अलग व्यक्तिगत कर्ता को आरोपित किए बिना विनाशकारी परिणाम बताता है; संज्ञात्मक पाठ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल किंतु गरिमापूर्ण वाक्य-विन्यास। ‘लहू’ बाइबलीय प्रसंग में परिचित और स्वाभाविक है। पादटिप्पणी-चिह्न अर्थगत रूप से सम्बद्ध पदों के तुरन्त बाद रखे गए हैं।
