base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/016.yaml
  text: On the first day there shall be a holy assembly for you[a], and on the seventh day a holy assembly. No work shall be done on them[c][b], except what every person must eat—that alone may be prepared for you.
translation:
  language: hi
  text: पहले दिन तुम्हारे लिए एक पवित्र सभा[a] होगी, और सातवें दिन भी एक पवित्र सभा होगी। उन दिनों कोई काम नहीं किया जाएगा; केवल हर व्यक्ति के खाने के लिए जो आवश्यक हो, वही तुम्हारे लिए तैयार किया जा सकता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पवित्र बुलायी हुई सभा”; परंपरागत रूप से “पवित्र सम्मेलन”।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְרָא קֹדֶשׁ
  choice: पवित्र सभा
  rationale: यह पद एक बुलाए गए, पवित्र सामुदायिक जमाव को दर्शाता है। ‘पवित्र सभा’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है तथा बुलाए जाने और पवित्र ठहराए जाने—दोनों भावों को पर्याप्त रूप से व्यक्त करता है।
- source_word: יִהְיֶה לָכֶם
  choice: तुम्हारे लिए ... होगी
  rationale: यह היה के अस्तित्वसूचक भाव और לָכֶם के संबोधनात्मक/हितसूचक अर्थ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: כָּל מְלָאכָה לֹא יֵעָשֶׂה בָהֶם
  choice: उन दिनों कोई काम नहीं किया जाएगा
  rationale: निषेध और हिब्रू के कर्मवाच्य को बनाए रखते हुए בָהֶם के कालवाचक संकेत को स्पष्ट हिन्दी में व्यक्त किया गया है।
- source_word: אַךְ
  choice: केवल
  rationale: यहाँ शब्द सामान्य निषेध के भीतर एकमात्र अपवाद प्रस्तुत करता है; ‘केवल’ अगले הוּא לְבַדּוֹ के विशेष बल के साथ स्वाभाविक बैठता है।
- source_word: אֲשֶׁר יֵאָכֵל לְכָל נֶפֶשׁ
  choice: हर व्यक्ति के खाने के लिए जो आवश्यक हो
  rationale: נֶפֶשׁ यहाँ ‘व्यक्ति’ को सूचित करता है, किसी पृथक आध्यात्मिक ‘आत्मा’ को नहीं। ‘आवश्यक हो’ भोजन-संबंधी अनुमत तैयारी का व्यावहारिक आशय स्पष्ट करता है, यद्यपि यह अर्थ प्रसंग से निहित है।
- source_word: הוּא לְבַדּוֹ יֵעָשֶׂה לָכֶם
  choice: वही तुम्हारे लिए तैयार किया जा सकता है
  rationale: ‘वही’ अपवाद की विशिष्टता को सुरक्षित रखता है। प्रसंग में יֵעָשֶׂה भोजन की तैयारी को सूचित करता है, इसलिए ‘तैयार किया’ स्वाभाविक है; ‘तुम्हारे लिए’ לָכֶם को निकटता से दर्शाता है।
theological_decisions:
- issue: नֶפֶשׁ का अर्थ
  choice: व्यक्ति
  alternative: प्राण/आत्मा
  rationale: इस विधिक और भोजन-संबंधी प्रसंग में נֶפֶשׁ का अर्थ प्रत्येक मनुष्य है; ‘आत्मा’ कहना मूल में निहित न होने वाला शरीर-आत्मा भेद उत्पन्न कर सकता है।
- issue: भोजन की तैयारी में आवश्यकता का भाव
  choice: खाने के लिए जो आवश्यक हो
  alternative: जो हर व्यक्ति खाएगा
  rationale: ‘आवश्यक’ प्रसंगगत आशय को स्पष्ट करता है, पर इसे भोजन की सामान्य अनुमति नहीं बल्कि निषिद्ध काम के सीमित अपवाद के रूप में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘उन दिनों’ ने शाब्दिक ‘उनमें’ का कालवाचक अर्थ स्पष्ट किया है। कर्मवाच्य और अपवाद की सीमितता बनाए रखी गई है।
