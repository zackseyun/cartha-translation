  text: וַ/אֲמַרְתֶּ֡ם זֶֽבַח פֶּ֨סַח ה֜וּא לַֽ/יהוָ֗ה אֲשֶׁ֣ר פָּ֠סַח עַל בָּתֵּ֤י בְנֵֽי יִשְׂרָאֵל֙ בְּ/מִצְרַ֔יִם בְּ/נָגְפּ֥/וֹ אֶת מִצְרַ֖יִם וְ/אֶת בָּתֵּ֣י/נוּ הִצִּ֑יל וַ/יִּקֹּ֥ד הָ/עָ֖ם וַ/יִּֽשְׁתַּחֲוּֽוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/027.yaml
  text: you shall say[a], ‘It is the Passover sacrifice to Yahweh[c][b], who passed over the houses of the sons of Israel in Egypt when he struck Egypt and delivered our houses.’ And the people bowed down and worshiped.
translation:
  language: hi
  text: तब तुम कहना, ‘यह यहोवा के लिए फ़सह-बलि है,[a] जो मिस्र में इस्राएलियों के घरों के ऊपर से उस समय लाँघ गया[b] जब उसने मिस्र को मारा और हमारे घरों को बचाया।’ तब लोगों ने सिर झुकाया और दण्डवत किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “फ़सह का बलिदान।”
    reason: रचनात्मक संबंध זֶבַח־פֶּסַח को हिन्दी में संयुक्त पद अथवा संबंधसूचक वाक्यांश, दोनों रूपों में व्यक्त किया जा सकता है।
  - marker: b
    text: “लाँघ गया” के पीछे वही हिब्रू मूल है जिससे “फ़सह” शब्द बना है; इस क्रिया में बचाने या रक्षा करने का भाव भी हो सकता है।
    reason: हिब्रू शब्दक्रीड़ा और क्रिया की संभावित संरक्षणात्मक अर्थच्छाया को सुरक्षित रखना।
lexical_decisions:
- source_word: זֶבַח פֶּסַח
  choice: फ़सह-बलि
  rationale: यह पदबंध फ़सह से जुड़ी बलि को दर्शाता है। संयुक्त रूप हिन्दी में स्वाभाविक है और बलि के अनुष्ठानिक अर्थ को बनाए रखता है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: ל समर्पण अथवा अर्पण का भाव देता है; बलि के संदर्भ में ‘के लिए’ सहज हिन्दी है।
- source_word: פָּסַח
  choice: लाँघ गया
  rationale: यह क्रिया ‘फ़सह’ संज्ञा से शब्दगत संबंध बनाए रखती है। प्रसंग में बचाने अथवा रक्षा करने का भाव भी है, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: בָּתֵּי בְנֵי יִשְׂרָאֵל
  choice: इस्राएलियों के घरों
  rationale: शाब्दिक रूप ‘इस्राएल के पुत्रों के घर’ है, पर आधुनिक हिन्दी में ‘इस्राएलियों के घर’ अधिक स्वाभाविक और पूरे समुदाय को स्पष्ट रूप से व्यक्त करता है।
- source_word: בְּנָגְפּוֹ אֶת מִצְרַיִם
  choice: जब उसने मिस्रियों को मारा
  rationale: कालवाचक בְּ के साथ infinitive construct का अर्थ ‘जब उसने मारा’ है। यहाँ ‘मिस्र’ देश के लोगों के लिए सामूहिक रूप से प्रयुक्त है; हिन्दी में ‘मिस्रियों’ से अभिप्राय स्पष्ट होता है।
- source_word: הִצִּיל
  choice: बचाया
  rationale: נצל का causative रूप संकट से छुड़ाने या बचाने का अर्थ देता है; ‘बचाया’ इस संदर्भ में स्वाभाविक है और केवल ‘हानि न पहुँचाने’ से अधिक सक्रिय उद्धार व्यक्त करता है।
- source_word: וַיִּקֹּד וַיִּשְׁתַּחֲווּ
  choice: सिर झुकाकर दण्डवत किया
  rationale: 'दोनों क्रमिक क्रियाओं को हिन्दी में संयुक्त अभिव्यक्ति से रखा गया है: पहली झुकने और दूसरी श्रद्धापूर्वक भूमि पर दण्डवत करने को दर्शाती है।'
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में वाचा का व्यक्तिगत नाम सीधे आया है। हिन्दी बाइबलीय प्रयोग में परिचित ‘यहोवा’ नाम को पदवी ‘प्रभु’ से बदलने के बजाय सुरक्षित रखा गया है।
- issue: בְנֵי יִשְׂרָאֵל की सामुदायिक अभिव्यक्ति
  choice: इस्राएली
  alternative: इस्राएल के पुत्र
  rationale: हिब्रू का पुरुषवाची बहुवचन यहाँ जातीय-वाचक समुदाय का प्रचलित नाम है। ‘इस्राएली’ आधुनिक हिन्दी में स्त्री-पुरुष सहित उसी समुदाय को स्वाभाविक रूप से व्यक्त करता है और अनावश्यक रूप से अर्थ को केवल पुरुषों तक सीमित नहीं करता।
- issue: פָּסַח में गति और संरक्षण का तनाव
  choice: लाँघ गया
  alternative: बचा लिया / रक्षा की
  rationale: मुख्य पाठ में ‘फ़सह’ के साथ मूल का शब्दगत संबंध बनाए रखा गया है, जबकि संरक्षण का संभावित भाव पादटिप्पणी में दिया गया है; इस प्रकार मूल की अर्थगत व्यापकता को एक ही व्याख्या में सीमित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘फ़सह-बलि’ संक्षिप्त धार्मिक पद है; ‘सिर झुकाकर दण्डवत किया’ दोनों हिब्रू क्रियाओं के भेद को हिन्दी में सहज रूप से व्यक्त करता है।
