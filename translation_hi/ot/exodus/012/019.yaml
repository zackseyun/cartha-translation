base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/019.yaml
  text: For seven days no leaven is to be found in your houses[a], for whoever eats anything leavened, that person shall be cut off from the congregation of Israel[c][b], whether a sojourner or a native of the land.
translation:
  language: hi
  text: सात दिन तक तुम्हारे घरों में खमीर न पाया जाए, क्योंकि जो कोई खमीरवाली कोई वस्तु खाए, उस व्यक्ति को इस्राएल की सभा से काट दिया जाएगा[a]—चाहे वह निवासी परदेशी हो[b] या देश में जन्मा हुआ व्यक्ति।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘काट दिया जाएगा’ का आशय संदर्भ के अनुसार समुदाय से बहिष्कार, मृत्यु, या परमेश्वर के न्याय से हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात ऐसा परदेशी जो इस्राएलियों के बीच रह रहा हो।
    reason: lexical_clarification
lexical_decisions:
- source_word: שִׁבְעַת יָמִים
  choice: सात दिन तक
  rationale: यह अवधि बताने वाला पदबंध है; ‘तक’ आधुनिक हिन्दी में सात दिनों की पूरी अवधि को स्वाभाविक रूप से व्यक्त करता है।
- source_word: שְׂאֹר
  choice: खमीर
  rationale: यह खमीर उठाने वाले पदार्थ को दर्शाता है, न कि केवल खमीर उठे भोजन को; ‘खमीर’ सामान्य आधुनिक हिन्दी में स्पष्ट है।
- source_word: לֹא יִמָּצֵא
  choice: न पाया जाए
  rationale: निफ़अल रूप निषिद्ध उपस्थिति की दशा व्यक्त करता है; यह चयन कर्मवाच्य स्वरूप और विधिक बल दोनों बनाए रखता है।
- source_word: בְּבָתֵּיכֶם
  choice: तुम्हारे घरों में
  rationale: बहुवचन ‘घरों’ को सीधे रखा गया है और यह निवास-स्थानों अथवा परिवारों के घरों के अर्थ के अनुकूल है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पहले दिए निषेध का कारण प्रस्तुत करता है।
- source_word: כָּל אֹכֵל
  choice: जो कोई ... खाए
  rationale: כל के साथ कृदन्त सार्वभौमिक अर्थ देता है; यह हिन्दी में स्वाभाविक और व्यापक है।
- source_word: מַחְמֶצֶת
  choice: खमीर उठी हुई कोई वस्तु
  rationale: यह केवल रोटी तक सीमित नहीं, बल्कि खमीर से उठी किसी खाद्य वस्तु का व्यापक बोध कराता है।
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא
  choice: वह व्यक्ति ... काट डाला जाएगा
  rationale: נפש यहाँ व्यक्ति को सूचित करता है। ‘काट डाला जाएगा’ वाचा-संबंधी दण्ड की मूल उपमा को उसके ठीक प्रकार—बहिष्कार, मृत्यु या दैवी न्याय—का निर्णय किए बिना बनाए रखता है।
- source_word: מֵעֲדַת יִשְׂרָאֵל
  choice: इस्राएल की प्रजा में से
  rationale: עֵדָה संगठित समुदाय अथवा सभा को दर्शाता है; ‘प्रजा’ सामान्य हिन्दी में सामुदायिक आशय स्पष्ट करती है, यद्यपि ‘मण्डली’ भी सम्भव है।
- source_word: בַּגֵּר
  choice: परदेशी निवासी
  rationale: גֵּר ऐसे गैर-स्थानीय व्यक्ति को दर्शाता है जो समुदाय के बीच निवास करता है; यह आधुनिक हिन्दी में ‘परदेशी’ से अधिक सटीक है क्योंकि निवास का भाव भी स्पष्ट करता है।
- source_word: וּבְאֶזְרַח הָאָרֶץ
  choice: देश में जन्मा व्यक्ति
  rationale: यह גֵּר के विपरीत देशज अथवा स्थानीय जन्म वाले व्यक्ति को दर्शाता है और आधुनिक नागरिकता की अवधारणा आरोपित नहीं करता।
theological_decisions:
- issue: वाचा-संबंधी दण्ड ‘काट डाला जाएगा’ का अर्थ
  choice: मूल उपमा ‘काट डाला जाएगा’ को बनाए रखा गया है।
  alternative: ‘मार डाला जाएगा’ या ‘समुदाय से निकाल दिया जाएगा’
  rationale: इब्रानी पद का सटीक दण्ड-विधान संदर्भानुसार मृत्यु, समुदाय से बहिष्कार या दैवी न्याय से जुड़ सकता है। अनुवाद किसी एक अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और विधिक स्वर वाली रखी गई है। ‘खमीर उठी हुई कोई वस्तु’ निषेध को केवल रोटी तक सीमित नहीं करती। मुख्य पाठ में सभी पादटिप्पणी-चिह्न उपस्थित हैं।
