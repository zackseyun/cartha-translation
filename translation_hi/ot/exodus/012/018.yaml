  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בָּ/רִאשֹׁ֡ן בְּ/אַרְבָּעָה֩ עָשָׂ֨ר י֤וֹם לַ/חֹ֨דֶשׁ֙ בָּ/עֶ֔רֶב תֹּאכְל֖וּ מַצֹּ֑ת עַ֠ד י֣וֹם הָ/אֶחָ֧ד וְ/עֶשְׂרִ֛ים לַ/חֹ֖דֶשׁ בָּ/עָֽרֶב׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/018.yaml
  text: In the first month[a], on the fourteenth day of the month at evening, you shall eat unleavened bread, until the twenty-first day of the month at evening.
translation:
  language: hi
  text: पहले महीने के चौदहवें दिन की साँझ से लेकर महीने के इक्कीसवें दिन की साँझ तक तुम अख़मीरी रोटी खाओ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּרִאשֹׁן
  choice: पहले महीने
  rationale: इब्रानी में शाब्दिक रूप से ‘पहले में’ है, पर आगे आए לַחֹדֶשׁ से स्पष्ट है कि आशय पहले महीने से है; हिन्दी में ‘महीने’ जोड़ना स्वाभाविक और स्पष्ट है।
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם
  choice: चौदहवें दिन
  rationale: यह इब्रानी की प्रचलित तिथि-सूचक रचना है; आधुनिक हिन्दी में क्रमवाचक रूप सबसे स्वाभाविक है।
- source_word: לַחֹדֶשׁ
  choice: महीने के
  rationale: חֹדֶשׁ का अर्थ ‘महीना’ या ‘नया चाँद’ हो सकता है, किंतु तिथि-सूत्र में यहाँ ‘महीना’ उपयुक्त है।
- source_word: בָּעֶרֶב
  choice: की साँझ
  rationale: यह समय-सीमा को दर्शाता है। ‘साँझ’ עֶרֶב का स्वाभाविक और गरिमापूर्ण हिन्दी रूप है; ‘से लेकर … तक’ वाक्य-विन्यास दोनों सीमाओं को स्पष्ट करता है, बिना ‘गोधूलि’ जैसी अत्यधिक विशिष्टता जोड़े।
- source_word: תֹּאכְלוּ
  choice: तुम … खाओ
  rationale: इस विधिक संदर्भ में अपूर्ण क्रिया निर्देशात्मक बल रखती है; ‘खाओ’ इसे आधुनिक और सीधी हिन्दी में व्यक्त करता है।
- source_word: מַצֹּת
  choice: अख़मीरी रोटी
  rationale: यह बिना ख़मीर की रोटी को सूचित करता है। ‘अख़मीरी रोटी’ हिन्दी बाइबलीय प्रयोग में परिचित और सामान्य पाठक के लिए बोधगम्य है।
- source_word: עַד
  choice: तक
  rationale: यह अवधि की अंतिम सीमा बताता है।
- source_word: יוֹם הָאֶחָד וְעֶשְׂרִים
  choice: इक्कीसवें दिन
  rationale: यह इब्रानी का सामान्य क्रमवाचक तिथि-प्रयोग है; हिन्दी में ‘इक्कीसवें दिन’ स्वाभाविक है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, निर्देशात्मक और गरिमापूर्ण शैली रखी गई है। इब्रानी के आरम्भ और अन्त के समांतर समय-सूचकों को हिन्दी के स्वाभाविक ‘से लेकर … तक’ ढाँचे में व्यक्त किया गया है।
