source:
  edition: WLC
  text: וְ/לֹא תוֹתִ֥ירוּ מִמֶּ֖/נּוּ עַד בֹּ֑קֶר וְ/הַ/נֹּתָ֥ר מִמֶּ֛/נּוּ עַד בֹּ֖קֶר בָּ/אֵ֥שׁ תִּשְׂרֹֽפוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/010.yaml
  text: You shall not leave any of it until morning[a], and what remains of it until morning you shall burn with fire.
translation:
  language: hi
  text: उसमें से कुछ भी सुबह तक बचा न रहने देना[a]; और उसमें से जो कुछ सुबह तक बच जाए, उसे आग में जला देना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसमें से कुछ भी सुबह तक बाकी न छोड़ना।”
    reason: יתר के हिफ़ील रूप को ‘बचा रहने देना’ या ‘बाकी छोड़ना’—दोनों तरह स्वाभाविक रूप से व्यक्त किया जा सकता है।
lexical_decisions:
- source_word: תוֹתִירוּ
  choice: बचा न रहने देना
  rationale: יתר के हिफ़ील रूप का अर्थ यहाँ किसी वस्तु को शेष या बचा रहने देना है। यह प्रयोग निषेध की निर्देशात्मक शक्ति और स्वाभाविक आधुनिक हिन्दी—दोनों को बनाए रखता है।
- source_word: מִמֶּנּוּ
  choice: उसमें से
  rationale: מן के साथ सर्वनाम-प्रत्यय का संदर्भ पहले बताए गए फसह के पशु से है। निषेध के कारण पहले खंड में ‘कुछ भी’ जोड़ना हिन्दी में आशय स्पष्ट करता है।
- source_word: עַד בֹּקֶר
  choice: सुबह तक
  rationale: यह वाक्यांश समय की अंतिम सीमा बताता है; ‘सुबह तक’ इसका सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: הַנֹּתָר
  choice: जो कुछ ... बच जाए
  rationale: יתר का निफ़ाल कृदंत उस भाग को दर्शाता है जो शेष रह जाए। ‘जो कुछ बच जाए’ सहज हिन्दी है और संभावित बचे हुए किसी भी अंश को समेटता है।
- source_word: בָּאֵשׁ
  choice: आग में
  rationale: ב साधन अथवा माध्यम दर्शा सकता है। हिन्दी में ‘आग में जला देना’ इस क्रिया के साथ स्वाभाविक है और आग द्वारा नष्ट करने का आशय स्पष्ट रखता है।
- source_word: תִּשְׂרֹפוּ
  choice: जला देना
  rationale: इस विधिक-निर्देशात्मक संदर्भ में अपूर्ण क्रिया आज्ञात्मक बल रखती है। ‘जला देना’ अनिवार्य निपटान का सीधा निर्देश देता है।
theological_decisions:
- issue: फसह के मांस के बचे हुए भाग के विषय में आदेश का स्वरूप
  choice: सीधा निषेध, जिसके बाद बचे हुए भाग को अनिवार्य रूप से जलाने का निर्देश है
  alternative: केवल व्यावहारिक सलाह, जिसमें विधिक बल न हो
  rationale: इब्रानी पाठ पहले सुबह तक कुछ बचा रहने देने से मना करता है और फिर यदि कुछ बच जाए तो उसे जलाने का आदेश देता है। अनुवाद इन दोनों निर्देशों को बिना कोई अप्रकट प्रतीकात्मक अर्थ जोड़े स्पष्ट रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और निर्देशात्मक रूप अपनाया गया है। ‘देना’ वाले क्रिया-रूप विधिक आदेश को साधारण पाठक के लिए स्वाभाविक रखते हैं।
