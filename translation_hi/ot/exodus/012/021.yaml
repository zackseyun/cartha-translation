  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּקְרָ֥א מֹשֶׁ֛ה לְ/כָל זִקְנֵ֥י יִשְׂרָאֵ֖ל וַ/יֹּ֣אמֶר אֲלֵ/הֶ֑ם מִֽשְׁכ֗וּ וּ/קְח֨וּ לָ/כֶ֥ם צֹ֛אן לְ/מִשְׁפְּחֹתֵי/כֶ֖ם וְ/שַׁחֲט֥וּ הַ/פָּֽסַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/021.yaml
  text: Then Moses called for all the elders of Israel and said to them[a], “Draw out and take for yourselves sheep according to your families[c][b], and slaughter the Passover lamb.”
translation:
  language: hi
  text: तब मूसा ने इस्राएल के सभी पुरनियों को बुलाकर उनसे कहा, “अपने-अपने परिवारों के लिए झुंड में से पशु[a] निकालो[b] और ले लो, और फ़सह के बलिपशु[c] का वध करो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ मूल इब्रानी शब्द भेड़-बकरियों जैसे छोटे पालतू पशुओं के झुंड को दर्शाता है; इसलिए इसका अर्थ केवल भेड़ या मेमना नहीं है।
    reason: lexical_alternative
  - marker: b
    text: “निकालो” का अर्थ “चुन लो” या “झुंड में से खींचकर बाहर निकालो” भी समझा जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में शाब्दिक रूप से “फ़सह” है; यहाँ उससे फ़सह की बलि के लिए वध किए जाने वाले पशु का अभिप्राय है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: बुलाकर
  rationale: संदर्भ में क्रिया का भाव पुरनियों को निर्देश देने के लिए बुलाने का है; ‘बुलाकर’ अगली क्रिया ‘कहा’ से स्वाभाविक रूप से जुड़ता है।
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: इस्राएल के सभी पुरनियों
  rationale: यह लोगों के मान्य अगुवों का पारंपरिक और गरिमापूर्ण हिन्दी पद है।
- source_word: מִשְׁכוּ
  choice: निकालो
  rationale: मूल क्रिया का ठोस अर्थ खींचने या बाहर निकालने का है; यहाँ झुंड में से पशु निकालना अभिप्रेत है, जबकि चयन का संभावित भाव पादटिप्पणी में रखा गया है।
- source_word: וּקְחוּ
  choice: और ले लो
  rationale: दूसरी आज्ञार्थक क्रिया को अलग रखा गया है, जिससे मूल के दोहरे निर्देश को एक क्रिया में नहीं समेटा जाता।
- source_word: לָכֶם
  choice: अपने-अपने ... के लिए
  rationale: सर्वनाम के आत्मवाचक और वितरणात्मक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: צֹאן
  choice: झुंड में से पशु
  rationale: צֹאן भेड़-बकरी जैसे छोटे पालतू पशुओं के सामूहिक झुंड को दर्शा सकता है; ‘मेमना’ या केवल ‘भेड़’ कहना संदर्भ को अनावश्यक रूप से संकरा कर देता।
- source_word: לְמִשְׁפְּחֹתֵיכֶם
  choice: अपने-अपने परिवारों के लिए
  rationale: परिवार अथवा कुल के अनुसार वितरण का भाव सरल आधुनिक हिन्दी में व्यक्त होता है।
- source_word: וְשַׁחֲטוּ
  choice: वध करो
  rationale: यह पशु को काटने, विशेषकर बलि-संदर्भ में, प्रयुक्त सटीक और गरिमापूर्ण अभिव्यक्ति है।
- source_word: הַפָּסַח
  choice: फ़सह के बलिपशु
  rationale: शाब्दिक रूप से ‘फ़सह’ है, पर यहाँ लक्षणा से फ़सह के लिए वध किए जाने वाले पशु का बोध होता है; ‘बलिपशु’ भेड़ या बकरी दोनों की संभावना बनाए रखता है।
theological_decisions:
- issue: הַפָּסַח का अभिप्राय
  choice: फ़सह के बलिपशु
  alternative: फ़सह; फ़सह की बलि; फ़सह का मेमना
  rationale: मूल पाठ केवल ‘फ़सह’ कहकर बलि के पशु की ओर संकेत करता है। हिन्दी में आशय स्पष्ट करने के लिए ‘बलिपशु’ जोड़ा गया है, पर ‘मेमना’ नहीं, क्योंकि निकट संदर्भ (निर्गमन 12:5) भेड़ या बकरी दोनों को स्वीकार करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और मौखिक निर्देश जैसा प्रवाह रखा गया है। ‘पुरनियों’ और ‘फ़सह’ जैसे प्रचलित बाइबलीय पद बनाए गए हैं। मुख्य पाठ में पशु की जाति को अनावश्यक रूप से सीमित नहीं किया गया और मूल की लक्षणा पादटिप्पणी में स्पष्ट की गई है।
