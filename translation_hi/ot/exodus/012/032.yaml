  text: גַּם צֹאנְ/כֶ֨ם גַּם בְּקַרְ/כֶ֥ם קְח֛וּ כַּ/אֲשֶׁ֥ר דִּבַּרְתֶּ֖ם וָ/לֵ֑כוּ וּ/בֵֽרַכְתֶּ֖ם גַּם אֹתִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/032.yaml
  text: Take both your flocks and your herds[a], just as you have said, and go—and bless me also.
translation:
  language: hi
  text: अपनी भेड़-बकरियाँ और गाय-बैल, दोनों ले जाओ, जैसा तुमने कहा था। जाओ, और मुझे भी आशीष दो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גַּם צֹאנְכֶם גַּם בְּקַרְכֶם
  choice: अपनी भेड़-बकरियाँ और गाय-बैल भी
  rationale: दोहराया गया גַּם दोनों पशु-वर्गों को समन्वित और बलयुक्त ढंग से जोड़ता है। आधुनिक हिन्दी में ‘भेड़-बकरियाँ और गाय-बैल भी’ छोटे और बड़े पालतू पशुओं का स्वाभाविक तथा स्पष्ट बोध देता है।
- source_word: קְחוּ
  choice: ले जाओ
  rationale: बहुवचन आज्ञार्थक रूप है; प्रस्थान के प्रसंग में केवल ‘लो’ की अपेक्षा ‘ले जाओ’ आशय को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: כַּאֲשֶׁר דִּבַּרְתֶּם
  choice: जैसा तुमने कहा था
  rationale: यह मूसा और हारून की पहले कही हुई माँग की ओर संकेत करता है और כַּאֲשֶׁר की तुलनात्मक शक्ति बनाए रखता है।
- source_word: וָלֵכוּ
  choice: अब जाओ
  rationale: הלך का आज्ञार्थक प्रयोग यहाँ प्रस्थान का आदेश है। ‘अब’ हिन्दी में आदेश की तात्कालिकता को स्वाभाविक बनाता है, यद्यपि यह अलग हिब्रू शब्द का अनुवाद नहीं है।
- source_word: וּבֵרַכְתֶּם גַּם אֹתִי
  choice: और मुझे भी आशीष दो
  rationale: ברך का सीधा अर्थ ‘आशीष देना’ रखा गया है और גַּם אֹתִי को ‘मुझे भी’ से व्यक्त किया गया है, बिना आशीष के माध्यम या स्वरूप को निर्धारित किए।
theological_decisions:
- issue: फ़िरौन की आशीष की माँग का स्वरूप
  choice: इसे सीधे ‘मुझे भी आशीष दो’ के रूप में रखा गया है।
  alternative: इसे इस्राएल के परमेश्वर से मध्यस्थतापूर्वक आशीष माँगना या केवल शुभकामना/विदाई की आशीष मानना।
  rationale: हिब्रू ברך आशीष की माँग को स्पष्ट करता है, पर यह नहीं बताता कि फ़िरौन किस विशिष्ट प्रकार या माध्यम की आशीष चाहता है। सरल अनुवाद इस अस्पष्टता और कथात्मक तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और मौखिक रूप से सहज है। सामूहिक पशु-श्रेणियों को सामान्य पाठक के लिए ठोस रूप में ‘भेड़-बकरियाँ’ और ‘गाय-बैल’ कहा गया है।
