translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘हाहाकार’ व्यापक शोक की तीव्रता व्यक्त करता है। संयुक्त कर्ता को स्वाभाविक हिंदी में स्पष्ट करने के लिए ‘भी उठ खड़ा हुआ’ रखा गया है, जबकि ‘सारा मिस्र’ का सामूहिक एकवचन रूप सुरक्षित है।
