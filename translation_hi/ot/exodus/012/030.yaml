base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/030.yaml
  text: And Pharaoh rose in the night[a], he and all his servants and all Egypt, and there was a great cry in Egypt[b], for there was no house where there was not someone dead.
translation:
  language: hi
  text: उसी रात फ़िरौन, उसके सभी सेवक और सारा मिस्र[a] उठ खड़े हुए। मिस्र में बड़ा हाहाकार मच गया, क्योंकि ऐसा कोई घर नहीं था जहाँ कोई मरा हुआ व्यक्ति न हो[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘सारा मिस्र’ में देश का नाम सामूहिक रूप से मिस्र के लोगों के लिए प्रयुक्त हुआ है।
    reason: cultural_note
  - marker: b
    text: 'अधिक शब्दशः: “ऐसा कोई घर नहीं था जहाँ कोई मृत व्यक्ति न हो।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: उठा
  rationale: קום का क़ाल रूप साधारण कथात्मक भूतकाल की क्रिया है। ‘उठा’ रात में हुई तत्काल कार्रवाई को बिना अतिरिक्त अर्थ जोड़े स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: לַיְלָה הוּא
  choice: उसी रात
  rationale: ‘रात’ के साथ प्रयुक्त संकेतवाचक सर्वनाम यहाँ उस निश्चित रात की ओर संकेत करता है। ‘उसी रात’ आधुनिक हिंदी में स्वाभाविक और प्रसंगानुकूल है।
- source_word: עֲבָדָיו
  choice: उसके सभी सेवक
  rationale: עֶבֶד का अर्थ ‘सेवक’ या ‘दास’ हो सकता है। राजदरबार के इस प्रसंग में ‘सेवक’ व्यापक है और अनावश्यक रूप से उनकी सामाजिक स्थिति निश्चित नहीं करता।
- source_word: וְכָל מִצְרַיִם
  choice: सारा मिस्र
  rationale: इब्रानी में देश का नाम सामूहिक रूप से उसके लोगों के लिए आया है। ‘सारा मिस्र’ उसी अलंकारिक प्रयोग और विपत्ति के व्यापक दायरे को बनाए रखता है।
- source_word: צְעָקָה גְדֹלָה
  choice: बड़ा हाहाकार
  rationale: צְעָקָה संकट और शोक की तीव्र पुकार है। ‘बड़ा हाहाकार’ केवल ऊँची आवाज़ नहीं, बल्कि व्यापक विलाप और व्याकुलता भी व्यक्त करता है।
- source_word: אֵין בַּיִת אֲשֶׁר אֵין שָׁם מֵת
  choice: ऐसा कोई घर नहीं था जहाँ कोई मरा हुआ व्यक्ति न हो
  rationale: यह अनुवाद इब्रानी की दोहरी नकारात्मक, ज़ोरदार रचना और בַּיִת के मूल अर्थ ‘घर’ को बनाए रखता है।
- source_word: מֵת
  choice: मरा हुआ व्यक्ति
  rationale: यह कृदंत संज्ञा के रूप में प्रयुक्त है और किसी अनिश्चित मृत व्यक्ति को दर्शाता है। हिंदी में ‘मरा हुआ व्यक्ति’ स्पष्ट और अर्थनिष्ठ है।
