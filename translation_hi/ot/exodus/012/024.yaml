  yaml_path: translation/ot/exodus/012/024.yaml
  text: And you shall keep this thing as a statute for you and for your sons forever[a][b].
translation:
  language: hi
  text: तुम इस बात को अपने और अपने पुत्रों के लिए सदा की विधि के रूप में मानकर इसका पालन करते रहना।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस विषय को,” “इस वस्तु को” अथवा “इस वचन को।” इब्रानी शब्द का अर्थ व्यापक रूप से बात, विषय, वस्तु या बोला हुआ वचन हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “अपने बच्चों के लिए” अथवा “अपने वंशजों के लिए।” इब्रानी में अक्षरशः “अपने पुत्रों के लिए” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: पालन करना
  rationale: शׁמר का अर्थ रखना, रक्षा करना या पालन करना हो सकता है। विधिक और वाचा-संबंधी संदर्भ में ‘पालन करना’ आज की स्वाभाविक हिन्दी में आज्ञाकारिता और निरंतरता दोनों व्यक्त करता है।
- source_word: הַדָּבָר הַזֶּה
  choice: इस बात
  rationale: דָּבָר का अर्थ बात, विषय, वस्तु या वचन हो सकता है। यहाँ यह पहले बताई गई फसह-विधि की ओर संकेत करता है; ‘इस बात’ उसके व्यापक अर्थ को अनावश्यक रूप से संकीर्ण नहीं करता।
- source_word: לְחָק
  choice: विधि
  rationale: חֹק किसी निर्धारित नियम या विधान को दर्शाता है। ‘विधि’ आधुनिक हिन्दी में संक्षिप्त, गरिमापूर्ण और विधिक-वाचा संबंधी बल के अनुकूल है।
- source_word: לְךָ וּלְבָנֶיךָ
  choice: अपने और अपने पुत्रों के लिए
  rationale: इब्रानी पाठ अक्षरशः ‘तेरे लिए और तेरे पुत्रों के लिए’ कहता है। ‘पुत्रों’ स्रोत की स्पष्ट पुल्लिंग अभिव्यक्ति को बनाए रखता है; व्यापक वंशगत अर्थ को पाद-टिप्पणी में दिया गया है।
- source_word: עַד עוֹלָם
  choice: सदा
  rationale: עַד עוֹלָם स्थायी अथवा निरंतर काल का प्रबल भाव देता है। ‘सदा’ इसका स्वाभाविक और संक्षिप्त हिन्दी समतुल्य है।
theological_decisions:
- issue: ‘तेरे पुत्रों’ में वाचा-संबंधी उत्तराधिकार का दायरा
  choice: मुख्य पाठ में ‘अपने पुत्रों’ रखा गया
  alternative: अपने बच्चों; अपने वंशजों
  rationale: मूल इब्रानी में स्पष्ट रूप से ‘तेरे पुत्रों’ है। यह घरेलू या वंशगत उत्तराधिकार का प्रतिनिधिक प्रयोग हो सकता है, पर उस व्याख्यात्मक विस्तार को मूल शब्द के स्थान पर मुख्य पाठ में रखना उचित नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक किंतु गरिमापूर्ण विधिक शैली रखी गई है। बहुवचन संबोधन के बावजूद हिन्दी में लिंग-चिह्नित सहायक क्रिया से बचने के लिए ‘पालन करना’ वाला आज्ञार्थक विन्यास चुना गया है।
