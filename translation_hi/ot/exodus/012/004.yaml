  yaml_path: translation/ot/exodus/012/004.yaml
  text: And if the household is too small for a lamb[a], then he and his nearest neighbor shall take one according to the number of persons; each man according to what he can eat[b], you shall count for the lamb.
translation:
  language: hi
  text: और यदि किसी घराने में एक मेमने[a] के लिए लोग बहुत कम हों, तो वह और उसका निकटतम पड़ोसी लोगों की संख्या के अनुसार एक मेमना लें। हर व्यक्ति जितना खा सकता है[b], उसके अनुसार तुम मेमने के लिए लोगों की गिनती करना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द का अर्थ भेड़ों या बकरियों में से कोई छोटा पशु भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, «हर व्यक्ति की खाने की मात्रा के अनुसार।»
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמְעַט הַבַּיִת מִהְיֹת מִשֶּׂה
  choice: यदि किसी परिवार में एक मेमना खाने के लिए लोग कम हों
  rationale: הַבַּיִת यहाँ भवन नहीं, परिवार/घराने को सूचित करता है। יִמְעַט ... מִהְיֹת का भाव है कि एक पशु खाने के अनुपात में परिवार के सदस्य पर्याप्त न हों; हिंदी में यह रूप अर्थ को स्वाभाविक ढंग से स्पष्ट करता है।
- source_word: שֶׂה
  choice: मेमना
  rationale: שֶׂה भेड़ या बकरी के छोटे पशु का व्यापक सूचक हो सकता है। फसह के प्रसंग में 'मेमना' सहज है, जबकि व्यापक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וְלָקַח הוּא וּשְׁכֵנוֹ הַקָּרֹב אֶל־בֵּיתוֹ
  choice: वह अपने घर के सबसे निकट रहने वाले पड़ोसी के साथ ... एक पशु ले
  rationale: यह निकटतम पड़ोसी परिवार के साथ संयुक्त रूप से पशु लेने का निर्देश है। निहित कर्म को 'एक पशु' कहने से हिंदी वाक्य स्पष्ट रहता है और केवल भेड़ मान लेने से बचता है।
- source_word: בְּמִכְסַת נְפָשֹׁת
  choice: लोगों की संख्या के अनुसार
  rationale: מִכְסָה गिनी हुई संख्या और נְפָשֹׁת यहाँ व्यक्तियों को दर्शाता है; 'प्राणों' जैसा शब्द इस प्रसंग में भ्रामक होगा।
- source_word: אִישׁ לְפִי אָכְלוֹ
  choice: हर व्यक्ति जितना खा सकता है, उसी के अनुसार
  rationale: אִישׁ यहाँ वितरणात्मक रूप में प्रत्येक सहभागी को दर्शाता है, और לְפִי אָכְלוֹ उसकी खाने की मात्रा या क्षमता को। यह हिंदी में स्वाभाविक और प्रसंगानुकूल है।
- source_word: תָּכֹסּוּ עַל־הַשֶּׂה
  choice: तुम मेमने के लिए लोगों की गिनती करना
  rationale: दुर्लभ क्रिया का प्रसंगगत अर्थ पशु के लिए सहभागियों की संख्या निर्धारित करना है। 'गिनती करना' गणना के भाव को बनाए रखता है, यद्यपि बाँटने की मात्रा भी अंतर्निहित है।
