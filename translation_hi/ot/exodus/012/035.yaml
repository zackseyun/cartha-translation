base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/035.yaml
  text: And the sons of Israel did according to the word of Moses[a], and they asked the Egyptians for articles of silver and articles of gold and clothing.
translation:
  language: hi
  text: इस्राएलियों ने मूसा के कहे अनुसार किया और मिस्रियों से चाँदी की वस्तुएँ, सोने की वस्तुएँ और कपड़े माँगे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘अनुरोध किया।’ पुरानी अंग्रेज़ी बाइबलों में अक्सर ‘उधार माँगा’ मिलता है, पर इब्रानी क्रिया का सामान्य अर्थ ‘माँगना’ या ‘अनुरोध करना’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: शाब्दिक अर्थ ‘इस्राएल के पुत्र’ है, पर आधुनिक हिन्दी में पूरे समुदाय के लिए ‘इस्राएली’ अधिक स्वाभाविक और स्पष्ट है तथा सामूहिक अर्थ सुरक्षित रखता है।
- source_word: עָשׂוּ כִּדְבַר מֹשֶׁה
  choice: मूसा के कहे अनुसार किया
  rationale: यह प्रयोग ‘मूसा के वचन के अनुसार किया’ का स्वाभाविक हिन्दी रूप है; इससे सरल क्रिया עשה और דבר का कथन/निर्देश-संबंधी अर्थ दोनों बने रहते हैं।
- source_word: וַיִּשְׁאֲלוּ
  choice: माँगे
  rationale: שאל का सामान्य अर्थ ‘माँगना’ या ‘अनुरोध करना’ है। ‘उधार माँगे’ लौटाने का आशय जोड़ देगा, जो यहाँ इब्रानी क्रिया में अनिवार्य नहीं है।
- source_word: מִמִּצְרַיִם
  choice: मिस्रियों से
  rationale: रूपतः ‘मिस्र से’ है, पर प्रसंग में वस्तुएँ देने वाले मिस्र के लोग हैं; हिन्दी में ‘मिस्रियों से’ स्वाभाविक रूप से इस आशय को व्यक्त करता है।
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב
  choice: चाँदी और सोने की वस्तुएँ
  rationale: כְּלִי व्यापक शब्द है, जिसका अर्थ पात्र, उपकरण या वस्तु हो सकता है। ‘वस्तुएँ’ इस व्यापकता को बनाए रखता है और अनावश्यक रूप से ‘बर्तन’ तक सीमित नहीं करता।
- source_word: וּשְׂמָלֹת
  choice: कपड़े
  rationale: שִׂמְלָה वस्त्र या पहनावे के लिए व्यापक शब्द है; ‘कपड़े’ आधुनिक, स्पष्ट और सामान्य हिन्दी है।
theological_decisions:
- issue: निर्गमन के संदर्भ में וַיִּשְׁאֲלוּ का नैतिक रूप से भारित अनुवाद
  choice: माँगे
  alternative: उधार माँगे; लूट लिए
  rationale: मुख्य पाठ मूल क्रिया का सामान्य अर्थ रखता है। ‘उधार’ लौटाने का आशय जोड़ता है और ‘लूट लिए’ आसपास के वर्णित परिणाम को इस क्रिया के भीतर पढ़ता है; इनमें से कोई भी अर्थ यहाँ स्वयं क्रिया द्वारा आवश्यक नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल। ‘इस्राएल के पुत्रों’ की अपेक्षा ‘इस्राएलियों’ और ‘वस्त्रों’ की अपेक्षा ‘कपड़े’ चुना गया है ताकि मूल आशय बनाए रखते हुए भाषा सामान्य पाठकों के लिए सहज रहे।
