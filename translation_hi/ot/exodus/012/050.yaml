id: EXO.12.50
reference: Exodus 12:50
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יַּֽעֲשׂ֖וּ כָּל בְּנֵ֣י יִשְׂרָאֵ֑ל כַּ/אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֥ה וְ/אֶֽת אַהֲרֹ֖ן כֵּ֥ן עָשֽׂוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/050.yaml
  text: And all the sons of Israel did as Yahweh had commanded Moses and Aaron[b][a]; so they did.
translation:
  language: hi
  text: और इस्राएल के सभी पुत्रों[a] ने वैसा ही किया जैसा याहवे[b] ने मूसा और हारून को आज्ञा दी थी; उन्होंने ठीक वैसा ही किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सभी इस्राएलियों” अथवा “इस्राएल की सारी संतान।” इब्रानी में शब्दशः “इस्राएल के सभी पुत्रों।”
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी: YHWH (याहवे); परंपरागत रूप से “प्रभु” अनुवादित।'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: और ... ने ... किया
  rationale: עשה का सामान्य अर्थ ‘करना’ है। यहाँ आज्ञा के पालन का प्रसंग है, और यही क्रिया पद के अंत में फिर आती है; इसलिए ‘किया’ स्वाभाविक है और पुनरावृत्ति भी बनी रहती है।
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के सभी पुत्रों
  rationale: כָּל पूरे समूह को समेटता है और בְּנֵי יִשְׂרָאֵל का शब्दशः पारिवारिक रूप ‘इस्राएल के पुत्र’ है। मुख्य पाठ में स्रोत की अभिव्यक्ति रखी गई है; स्वाभाविक सामूहिक विकल्प फुटनोट में दिया गया है।
- source_word: כַּאֲשֶׁר
  choice: वैसा ही ... जैसा
  rationale: यह आज्ञा और कार्य के बीच अनुरूपता व्यक्त करता है। हिंदी का ‘वैसा ही ... जैसा’ इस संबंध और बल दोनों को सहज रूप से प्रकट करता है।
- source_word: צִוָּה
  choice: आज्ञा दी थी
  rationale: हिब्रू पूर्ण क्रिया उस आज्ञा को बताती है जो इस्राएल के कार्य से पहले दी गई थी। हिंदी में ‘दी थी’ घटनाक्रम को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार-अक्षरीय ईश्वरीय नाम को उपाधि से बदलने के बजाय हिंदी में उसके प्रचलित ध्वन्यात्मक रूप ‘याहवे’ से व्यक्त किया गया है।
- source_word: אֶת מֹשֶׁה וְאֶת אַהֲרֹן
  choice: मूसा और हारून को
  rationale: दोनों אֶת प्रत्यक्ष कर्म को चिह्नित करते हैं; अतः मूसा और हारून वे व्यक्ति हैं जिन्हें आज्ञा दी गई। ‘के द्वारा’ जोड़ना स्रोत से अधिक अर्थ आरोपित करता।
- source_word: כֵּן עָשׂוּ
  choice: उन्होंने ठीक वैसा ही किया
  rationale: כֵּן पहले कथन को दोहराकर आज्ञा के अनुरूप कार्य पर बल देता है। ‘ठीक वैसा ही’ उस बल को स्पष्ट करता है और עשה की पुनरावृत्ति बनाए रखता है।
theological_decisions:
- issue: वाचा के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। ‘याहवे’ उसे एक उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है; पारंपरिक ‘प्रभु’ पाठ फुटनोट में सूचित है।
- issue: בְּנֵי יִשְׂרָאֵל का रूप
  choice: इस्राएल के पुत्र
  alternative: इस्राएली; इस्राएल की संतान
  rationale: हिब्रू में शब्दशः ‘इस्राएल के पुत्र’ है और यह जाति-परिवार का मानक पद भी है। मुख्य पाठ स्रोत-रूप को रखता है, जबकि फुटनोट स्पष्ट करता है कि सामूहिक अर्थ ‘इस्राएली’ भी हो सकता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। आरंभ और अंत में עשה की पुनरावृत्ति को ‘किया’ से सुरक्षित रखा गया है। ‘ठीक वैसा ही’ आज्ञा के अनुरूप पालन पर हिब्रू के बल को स्वाभाविक हिंदी में व्यक्त करता है।
