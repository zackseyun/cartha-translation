  yaml_path: translation/ot/exodus/012/007.yaml
  text: And they shall take some of the blood and put it on the two doorposts and on the lintel of the houses in which they eat it[a].
translation:
  language: hi
  text: वे उस लहू में से कुछ लें और जिन घरों में वे उसे खाएँगे, उनके दरवाज़ों की दोनों खड़ी चौखटों और ऊपरी चौखट पर लगाएँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקְחוּ
  choice: और वे ... लेकर
  rationale: निर्देशों की इस क्रमिक शृंखला में रूप का विधि/भविष्यसूचक बल है; अगले मुख्य क्रियापद ‘लगाएँ’ के साथ हिंदी की संयुक्त क्रिया इसे स्वाभाविक रूप से व्यक्त करती है।
- source_word: מִן הַדָּם
  choice: उस लहू में से कुछ
  rationale: מִן यहाँ अंशवाचक है, इसलिए पूरे लहू के बजाय उसके कुछ भाग का बोध कराया गया है। ‘लहू’ बलिदान और फसह के प्रसंग में स्वाभाविक तथा गरिमापूर्ण है।
- source_word: וְנָתְנוּ
  choice: लगाएँ
  rationale: נתן का मूल अर्थ देना/रखना है, पर सतह पर लहू रखने के इस प्रसंग में ‘लगाना’ आधुनिक हिंदी में सबसे स्वाभाविक और ठोस है।
- source_word: עַל שְׁתֵּי הַמְּזוּזֹת
  choice: दोनों चौखटों पर
  rationale: מְזוּזוֹת द्वार के दोनों खड़े बाजू के खंभों को दर्शाता है। हिंदी में ‘दोनों चौखटों’ से दोनों पार्श्व भागों का सहज बोध होता है।
- source_word: וְעַל הַמַּשְׁקוֹף
  choice: और चौखट के ऊपरी भाग पर
  rationale: מַשְׁקוֹף द्वार के ऊपर की आड़ी कड़ी है। ‘चौखट का ऊपरी भाग’ तकनीकी शब्दावली से बचे रहते हुए अर्थ को स्पष्ट करता है।
- source_word: עַל הַבָּתִּים
  choice: उन घरों के
  rationale: यद्यपि עַל सामान्यतः ‘पर’ है, यहाँ वह चिह्नित द्वार-भागों का संबंधित घरों से संबंध बताता है; हिंदी में संबंधकारक ‘के’ अधिक स्वाभाविक है।
- source_word: אֲשֶׁר יֹאכְלוּ אֹתוֹ בָהֶם
  choice: जिनमें वे उसे खाएँगे
  rationale: संबंधवाचक उपवाक्य ‘घरों’ को विशेषित करता है। निर्देशात्मक प्रसंग में imperfect का भावी अर्थ हिंदी के ‘खाएँगे’ से स्पष्ट और स्वाभाविक रूप में आता है।
