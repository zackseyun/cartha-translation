translation_notes:
  register: आधुनिक मानक हिंदी, सामान्य पाठक के लिए स्पष्ट और गरिमापूर्ण। ‘दरवाज़े के खंभे’ जैसे लंबे पद के बजाय परिचित ‘चौखट’ रखा गया है, और ऊपरी आड़ी कड़ी को अलग स्पष्ट करने के लिए ‘चौखट का ऊपरी भाग’ कहा गया है।
