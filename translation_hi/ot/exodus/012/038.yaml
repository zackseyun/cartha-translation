  text: A mixed multitude also went up with them[a], and flocks and herds—a very great amount of livestock.
translation:
  language: hi
  text: उनके साथ एक बड़ी मिली-जुली भीड़ भी निकली[a], और भेड़-बकरियों तथा मवेशियों के झुंड—बहुत अधिक पशुधन—भी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘एक बड़ा मिला-जुला समुदाय’ अथवा ‘एक मिली-जुली भीड़।’ इब्रानी पद עֵרֶב רַב इस्राएल के साथ जाने वाले विविध लोगों के समूह को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/גַם
  choice: भी
  rationale: यह पिछले वृत्तांत में एक और साथ जाने वाले समूह को जोड़ता है; हिन्दी में ‘भी’ इसकी योगात्मक शक्ति को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עֵרֶב רַב
  choice: एक बड़ी मिली-जुली भीड़
  rationale: यह पद इस्राएल के साथ जाने वाले विविध लोगों के एक बड़े समूह को दर्शाता है। ‘मिली-जुली’ उसकी विविधता और ‘बड़ी’ רַב की परिमाण-सूचक शक्ति बनाए रखता है।
- source_word: עָלָה
  choice: गई
  rationale: यहाँ क्रिया निर्गमन-यात्रा में आगे बढ़ने को बताती है। शाब्दिक ‘ऊपर चढ़ी’ हिन्दी में अनावश्यक भौगोलिक अर्थ जगा सकता है; ‘गई’ प्रसंग में स्वाभाविक है और दिशा के विषय में अतिरिक्त व्याख्या नहीं जोड़ता।
- source_word: אִתָּם
  choice: उनके साथ
  rationale: यह संबंधवाचक पद इस्राएलियों के साथ होने का सीधा अर्थ देता है।
- source_word: וְ/צֹאן וּ/בָקָר
  choice: और भेड़-बकरियों तथा गाय-बैलों के झुंड भी
  rationale: צֹאן छोटे पालतू पशुओं, विशेषतः भेड़-बकरियों, और בָקָר बड़े पशुओं/मवेशियों का सामूहिक बोध कराता है। यह हिन्दी रूप दोनों वर्गों का भेद सहज रूप से बनाए रखता है।
- source_word: מִקְנֶה
  choice: पशुधन
  rationale: यह पालतू पशुओं की सामूहिक संपत्ति के लिए व्यापक शब्द है; आधुनिक हिन्दी में ‘पशुधन’ इसका संक्षिप्त और उपयुक्त समतुल्य है।
- source_word: כָּבֵד מְאֹד
  choice: बहुत अधिक
  rationale: शाब्दिक अर्थ ‘बहुत भारी’ है, पर पशुधन के साथ यह मुहावरेदार रूप से अत्यधिक मात्रा या बहुतायत बताता है। ‘बहुत अधिक’ वही भाव स्वाभाविक हिन्दी में देता है।
