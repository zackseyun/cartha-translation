base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/002.yaml
  text: This month shall be for you the beginning of months[a]; it shall be the first month of the year for you.
translation:
  language: hi
  text: “यह महीना[क] तुम्हारे लिए महीनों का आरम्भ होगा; यह तुम्हारे लिए वर्ष के महीनों में पहला होगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: या, “यह नया चाँद”; इब्रानी शब्द का संबंध नवचंद्र के चक्र से भी हो सकता है, पर यहाँ इसका अर्थ पंचांग का महीना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֹדֶשׁ הַזֶּה
  choice: यह महीना
  rationale: इस पंचांग-संबंधी विधान में חֹדֶשׁ का स्वाभाविक अर्थ ‘महीना’ है; यद्यपि यह शब्द अमावस्या अथवा नवचंद्र के चक्र से भी जुड़ा हो सकता है।
- source_word: לָכֶם
  choice: तुम्हारे लिए
  rationale: यह पदबंध इस पंचांग-निर्धारण का सम्बन्ध इस्राएली समुदाय से बताता है और हिन्दी में स्वाभाविक रूप से वही सम्बन्ध बनाए रखता है।
- source_word: רֹאשׁ חֳדָשִׁים
  choice: महीनों का आरम्भ
  rationale: रֹאשׁ का मूल अर्थ ‘सिर’ है, पर समय-क्रम में इसका मुहावरेदार अर्थ ‘आरम्भ’ अथवा ‘पहला’ होता है।
- source_word: רִאשׁוֹן הוּא
  choice: यह ... पहला होगा
  rationale: רִאשׁוֹן क्रम में प्रथम होने को व्यक्त करता है; हिन्दी में स्पष्टता के लिए ‘होगा’ और सन्दर्भानुसार ‘महीनों में’ रखा गया है।
- source_word: לְחָדְשֵׁי הַשָּׁנָה
  choice: वर्ष के महीनों में
  rationale: 'यह रूप मूल इब्रानी की अपेक्षा-सूचक संरचना को स्पष्ट करता है: निर्धारित महीना वर्ष के महीनों के क्रम में पहला है।'
theological_decisions:
- issue: विधिक सन्दर्भ में क्रियारहित इब्रानी वाक्य का बल
  choice: भविष्य/विधिक अर्थ में ‘होगा’
  alternative: सामान्य वर्तमान अर्थ में ‘है’
  rationale: इब्रानी में स्पष्ट क्रिया नहीं है, पर प्रसंग में परमेश्वर इस्राएल के पंचांग की व्यवस्था स्थापित कर रहे हैं। ‘होगा’ इसे केवल विवरण नहीं, बल्कि निर्धारण के रूप में व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और विधिक घोषणा के अनुकूल है। ‘महीनों का आरम्भ’ मूल संरचना को निकटता से रखता है, जबकि ‘वर्ष के महीनों में पहला’ हिन्दी में क्रम का आशय स्पष्ट करता है। अंग्रेज़ी टिप्पणी में दिया ‘new moon’ वाला विकल्प हिन्दी मुख्य पाठ के लिए आवश्यक नहीं माना गया, क्योंकि इस सन्दर्भ में חֹדֶשׁ स्पष्टतः पंचांग के महीने को सूचित करता है।
