id: EXO.12.41
reference: Exodus 12:41
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יְהִ֗י מִ/קֵּץ֙ שְׁלֹשִׁ֣ים שָׁנָ֔ה וְ/אַרְבַּ֥ע מֵא֖וֹת שָׁנָ֑ה וַ/יְהִ֗י בְּ/עֶ֨צֶם֙ הַ/יּ֣וֹם הַ/זֶּ֔ה יָֽצְא֛וּ כָּל צִבְא֥וֹת יְהוָ֖ה מֵ/אֶ֥רֶץ מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/041.yaml
  text: And at the end of four hundred and thirty years[a], on that very day, all the hosts of Yahweh went out from the land of Egypt.
translation:
  language: hi
  text: और चार सौ तीस वर्ष पूरे होने पर, ठीक उसी दिन, याहवे के सभी दल मिस्र की भूमि से निकल गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִקֵּץ
  choice: पूरे होने पर
  rationale: यह पदबंध किसी अवधि की समाप्ति का बिंदु बताता है। हिंदी में यह स्वाभाविक रूप से 430 वर्षों की पूर्णता व्यक्त करता है।
- source_word: שְׁלֹשִׁים שָׁנָה וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: चार सौ तीस वर्ष
  rationale: हिब्रू की संख्या-क्रम रचना का अर्थ कुल 430 वर्ष है; आधुनिक हिंदी में संख्या इसी क्रम में कही जाती है।
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: ठीक उसी दिन
  rationale: यह हिब्रू मुहावरा दिन की सटीकता और कथन के विशेष बल को व्यक्त करता है।
- source_word: יָצְאוּ
  choice: निकल गए
  rationale: यह सामान्य गति-क्रिया मिस्र से बाहर प्रस्थान को सरल और स्वाभाविक हिंदी में व्यक्त करती है।
- source_word: כָּל צִבְאוֹת
  choice: सभी दल
  rationale: צִבְאוֹת संगठित समूहों या सेनाओं को सूचित कर सकता है। यहाँ ‘दल’ सामूहिक और व्यवस्थित प्रस्थान का भाव रखता है, पर उन्हें अनिवार्य रूप से युद्धरत सेना नहीं बताता।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में प्रयुक्त परमेश्वर के व्यक्तिगत नाम का हिंदी लिप्यंतरण किया गया है, किसी उपाधि से उसका स्थानापन्न नहीं किया गया।
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: मिस्र देश से
  rationale: अर्थ में उपस्थित ‘देश/भूमि’ को बनाए रखते हुए यह आधुनिक हिंदी की स्वाभाविक भौगोलिक अभिव्यक्ति है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: हिब्रू में व्यक्तिगत वाचा-नाम सीधे प्रयुक्त हुआ है; ‘याहवे’ उसका निकट हिंदी लिप्यंतरण है और उसे किसी उपाधि में नहीं बदलता।
- issue: צִבְאוֹת יְהוָה का आशय
  choice: याहवे के सभी दल
  alternative: याहवे की सारी सेनाएँ
  rationale: צָבָא का अर्थ संगठित दल या सेना दोनों हो सकता है। संदर्भ में इस्राएलियों के व्यवस्थित समुदाय अभिप्रेत हैं; ‘दल’ सैन्य अर्थ को अनावश्यक रूप से निश्चित किए बिना मूल की संगठित-सामूहिक छवि बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण कथात्मक शैली रखी गई है। आरंभिक וַיְהִי का कथात्मक संबंध ‘और’ से व्यक्त किया गया है; उसकी पुनरावृत्ति को हिंदी में अस्वाभाविक रूप से दोहराने के बजाय वाक्य की प्रवाहपूर्ण संरचना में समाहित किया गया है।
