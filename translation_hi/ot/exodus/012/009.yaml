source:
  edition: WLC
  text: אַל תֹּאכְל֤וּ מִמֶּ֨/נּוּ֙ נָ֔א וּ/בָשֵׁ֥ל מְבֻשָּׁ֖ל בַּ/מָּ֑יִם כִּ֣י אִם צְלִי אֵ֔שׁ רֹאשׁ֥/וֹ עַל כְּרָעָ֖י/ו וְ/עַל קִרְבּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/009.yaml
  text: Do not eat any of it raw or boiled in water[a], but only roasted over the fire, with its head, its legs, and its inner parts.
translation:
  language: hi
  text: उसमें से कुछ भी कच्चा[a] या पानी में उबला हुआ न खाना, बल्कि उसे केवल आग पर भूनकर खाना—उसका सिर, उसकी टाँगें और उसके भीतरी अंग समेत।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अधपका’।
    reason: נָא इस संदर्भ में पूरी तरह न पके हुए मांस को दर्शा सकता है; ‘कच्चा’ और ‘अधपका’ दोनों सम्भव हैं।
lexical_decisions:
- source_word: נָא
  choice: कच्चा
  rationale: इस पाक-संदर्भ में यह शब्द ऐसे मांस को दर्शाता है जो ठीक से पकाया नहीं गया है। ‘कच्चा’ आधुनिक हिन्दी में सबसे स्पष्ट है, जबकि ‘अधपका’ भी सम्भव अर्थ है।
- source_word: וּבָשֵׁל מְבֻשָּׁל בַּמָּיִם
  choice: या पानी में उबला हुआ
  rationale: मूल में क्रिया की पुनरुक्ति और ‘पानी में’ वाक्यांश विशेष रूप से उबालकर पकाने पर बल देते हैं; हिन्दी में यह रूप स्वाभाविक और सटीक है।
- source_word: כִּי אִם
  choice: बल्कि ... केवल
  rationale: 'यह निषेध के बाद एक प्रबल और अनन्य विकल्प प्रस्तुत करता है: इन तरीकों से नहीं, केवल आग पर भूनकर।'
- source_word: צְלִי אֵשׁ
  choice: आग पर भूनकर
  rationale: यह आग के द्वारा भूनने की विधि को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: רֹאשׁוֹ עַל־כְּרָעָיו וְעַל־קִרְבּוֹ
  choice: उसका सिर, उसकी टाँगें और उसके भीतरी अंग समेत
  rationale: दोहराया गया עַל यहाँ साथ या समावेश का भाव देता है। ‘भीतरी अंग’ קֶרֶב का स्पष्ट, मर्यादित और व्यापक हिन्दी समतुल्य है; वाक्य पशु के इन भागों को भी भूनने में शामिल रखता है।
- source_word: מִמֶּנּוּ
  choice: उसमें से कुछ भी
  rationale: यह मूल के अंशवाचक भाव को सहज हिन्दी में सुरक्षित रखता है।
