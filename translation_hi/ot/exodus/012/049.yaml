  text: תּוֹרָ֣ה אַחַ֔ת יִהְיֶ֖ה לָֽ/אֶזְרָ֑ח וְ/לַ/גֵּ֖ר הַ/גָּ֥ר בְּ/תוֹכְ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/049.yaml
  text: One law shall be for the native and for the sojourner who sojourns among you[a].
translation:
  language: hi
  text: देशी और तुम्हारे बीच रहनेवाले परदेशी—दोनों के लिए एक ही व्यवस्था होगी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “देशी और तुम्हारे बीच निवास करनेवाले विदेशी—दोनों के लिए एक ही निर्देश होगा।”
    reason: תּוֹרָה का अर्थ ‘निर्देश’ भी हो सकता है, और גֵּר को अधिक स्पष्ट रूप से ‘निवास करनेवाला विदेशी’ कहा जा सकता है।
lexical_decisions:
- source_word: תּוֹרָה
  choice: व्यवस्था
  rationale: इस फसह-संबंधी कानूनी प्रसंग में यह बाध्यकारी नियम या विधि को दर्शाता है; ‘व्यवस्था’ हिन्दी बाइबलीय प्रयोग में स्वाभाविक और गरिमापूर्ण है।
- source_word: אַחַת
  choice: एक ही
  rationale: यह दोनों समूहों के लिए नियम की एकता और समानता पर बल देता है; हिन्दी में ‘एक ही’ इस बल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יִהְיֶה
  choice: होगी
  rationale: हिब्रू के सामान्य अस्तित्ववाचक रूप ‘होगी’ को बनाए रखा गया है; ‘लागू होगी’ अर्थ स्पष्ट करता, पर मूल से अधिक व्याख्यात्मक होता।
- source_word: אֶזְרָח
  choice: देशी
  rationale: यह समुदाय के मूल निवासी सदस्य को दर्शाता है; ‘देशी’ संक्षिप्त है और आधुनिक नागरिकता की श्रेणी आरोपित नहीं करता।
- source_word: גֵּר
  choice: परदेशी
  rationale: यह इस्राएलियों के बीच रहनेवाले गैर-मूल निवासी को दर्शाता है; ‘परदेशी’ सामान्य हिन्दी में बोधगम्य है, जबकि निवास का स्थायी पहलू अगले वाक्यांश से स्पष्ट होता है।
- source_word: הַגָּר
  choice: रहनेवाले
  rationale: सहभागी रूप परदेशी को उनके बीच निवास करनेवाले के रूप में विशेषित करता है; हिन्दी में मूल धातु की पुनरुक्ति के बजाय यह स्वाभाविक है।
- source_word: בְּתוֹכְכֶם
  choice: तुम्हारे बीच
  rationale: यह समुदाय के मध्य निवास का सीधा और आधुनिक हिन्दी रूप है।
theological_decisions:
- issue: देशी और निवासी परदेशी के लिए विधिक मानक की समानता
  choice: दोनों के लिए एक ही व्यवस्था
  alternative: देशी के लिए और परदेशी के लिए एक व्यवस्था
  rationale: ‘दोनों’ हिब्रू के दो लक्षित समूहों को स्पष्ट करता है और אַחַת का समान मानक वाला बल व्यक्त करता है, बिना इस विधान को उसके तत्काल प्रसंग से बाहर सार्वभौमिक बनाने के।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण कानूनी शैली। ‘एक ही’ से समान विधिक मानक का बल और दीर्घ डैश से दोनों समूहों की समानांतरता स्पष्ट की गई है।
