  text: לֵ֣יל שִׁמֻּרִ֥ים הוּא֙ לַֽ/יהוָ֔ה לְ/הוֹצִיאָ֖/ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם הֽוּא הַ/לַּ֤יְלָה הַ/זֶּה֙ לַֽ/יהוָ֔ה שִׁמֻּרִ֛ים לְ/כָל בְּנֵ֥י יִשְׂרָאֵ֖ל לְ/דֹרֹתָֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/042.yaml
  text: It was a night of vigil for Yahweh[a], to bring them out from the land of Egypt; this same night is a vigil for Yahweh for all the children of Israel throughout their generations.
translation:
  language: hi
  text: मिस्र देश से उन्हें निकाल लाने के लिए यह यहोवा के लिए जागरण की रात थी। यही रात यहोवा के लिए इस्राएल की सारी संतान के लिए, पीढ़ी-दर-पीढ़ी, जागरण की रात है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵיל שִׁמֻּרִים
  choice: जागरण की रात
  rationale: रचना का अर्थ ऐसी रात है जो जागते रहने, निगरानी रखने या विशेष रूप से मनाए जाने से चिह्नित हो। ‘जागरण की रात’ इन अर्थों को संक्षेप में समेटती है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: ל संबंध अथवा समर्पण का भाव देता है। ‘के लिए’ रात का यहोवा से विशेष संबंध बनाए रखता है और यह निश्चित नहीं करता कि जागने वाला केवल यहोवा है या इस्राएल।
- source_word: לְהוֹצִיאָם
  choice: उन्हें निकाल लाने के लिए
  rationale: ל के साथ infinitive construct उद्देश्य अथवा परिणाम का भाव देता है; यह अनुवाद उसी संबंध को बनाए रखता है।
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: मिस्र देश से
  rationale: इब्रानी पाठ में אֶרֶץ ‘देश/भूमि’ स्पष्ट रूप से है, इसलिए उसे अनुवाद में रखा गया है।
- source_word: הוּא הַלַּיְלָה הַזֶּה
  choice: यही रात
  rationale: सर्वनाम और संकेतवाचक की पुनरुक्ति बलपूर्वक पहचान कराती है; ‘यही’ उस बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְכָל בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल की सारी सन्तान
  rationale: यह בני ישראל की पारिवारिक और वाचागत अभिव्यक्ति को केवल जातीय पद ‘इस्राएली’ की अपेक्षा अधिक निकटता से सुरक्षित रखता है।
- source_word: לְדֹרֹתָם
  choice: पीढ़ी-दर-पीढ़ी
  rationale: यह क्रमिक पीढ़ियों तक जारी रहने का भाव आधुनिक और सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के निज नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: पाठ में चार-अक्षरीय निज नाम सीधे प्रयुक्त है। हिन्दी में व्यापक रूप से पहचाने जाने वाले रूप ‘यहोवा’ से उस निज नाम को पदवी में बदले बिना रखा गया है।
- issue: שִׁמֻּרִים का कर्ता और धार्मिक आशय
  choice: जागरण
  alternative: पहरा / पालन / स्मारक-उपासनात्मक अनुष्ठान
  rationale: इब्रानी शब्द में जागते रहने, रखवाली और किसी बात को मानते रहने के अर्थ परस्पर जुड़े हैं। ‘जागरण’ इस तनाव को सुरक्षित रखता है और यह तय नहीं करता कि केवल यहोवा पहरा दे रहा है या इस्राएल इस रात को मान रहा है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘यही रात’ मूल के बल को व्यक्त करता है। दूसरी पंक्ति में कुछ औपचारिकता जानबूझकर रखी गई है, ताकि मूल में ‘यहोवा के लिए’ और ‘इस्राएल की सारी सन्तान’ के संबंध को अत्यधिक व्याख्यायित न किया जाए।
