translation:
  language: hi
  text: तब लोग अपना गूँधा हुआ आटा खमीर उठने से पहले ले चले। उनकी आटा गूँधने की परातें[a] उनके बाहरी वस्त्रों में बँधी हुई उनके कंधों पर थीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘आटा गूँधने के पात्र।’ इब्रानी शब्द आटा तैयार करने में प्रयुक्त पात्रों को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא
  choice: ले चले
  rationale: यहाँ נשׂא प्रस्थान के समय वस्तुओं को उठाकर साथ ले जाने का भाव देता है। ‘ले चले’ आधुनिक हिन्दी में गति और वहन—दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הָעָם
  choice: लोग
  rationale: कथानक में עָם इस्राएली समुदाय को सामूहिक रूप से दर्शाता है; ‘लोग’ स्पष्ट और सहज हिन्दी है।
- source_word: בְּצֵקוֹ
  choice: अपना गूँधा हुआ आटा
  rationale: בָּצֵק तैयार किया हुआ आटा है। एकवचन प्रत्यय सामूहिक विषय ‘लोग’ से जुड़ा है, इसलिए हिन्दी में ‘अपना’ स्वाभाविक रूप से सामूहिक अर्थ बनाए रखता है।
- source_word: טֶרֶם יֶחְמָץ
  choice: खमीर उठने से पहले ही
  rationale: यह पद बताता है कि आटे में अभी खमीर उठने की प्रक्रिया पूरी नहीं हुई थी। ‘पहले ही’ प्रस्थान की शीघ्रता को बिना अतिरिक्त व्याख्या के व्यक्त करता है।
- source_word: מִשְׁאֲרֹתָם
  choice: उनकी आटा गूँधने की परातें
  rationale: यह संज्ञा आटा तैयार करने या गूँधने में प्रयुक्त पात्रों को दर्शाती है। ‘परातें’ सामान्य हिन्दी में ऐसे चौड़े पात्र का सहज नाम है, जबकि पात्र का सटीक आकार निश्चित नहीं है; इसलिए विकल्प पाद-टिप्पणी में दिया गया है।
- source_word: צְרֻרֹת
  choice: बाँधकर
  rationale: צרר का निष्क्रिय कृदन्त पात्रों के यात्रा के लिए गठरी की तरह कसकर बाँधे जाने का चित्र देता है। हिन्दी वाक्य में ‘बाँधकर ... रखी हुई थीं’ उसी परिणामी अवस्था को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְּשִׂמְלֹתָם
  choice: उनके बाहरी वस्त्रों में
  rationale: שִׂמְלָה सामान्यतः ओढ़े या पहने जाने वाले बाहरी वस्त्र को सूचित करता है। ‘बाहरी वस्त्र’ किसी विशेष आधुनिक पोशाक का अनावश्यक चित्र थोपे बिना अर्थ देता है।
- source_word: עַל שִׁכְמָם
  choice: उनके कंधों पर
  rationale: सामूहिक एकवचन भाव को हिन्दी में स्वाभाविक बहुवचन ‘कंधों’ द्वारा व्यक्त किया गया है।
