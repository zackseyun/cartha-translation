  yaml_path: translation/ot/exodus/012/003.yaml
  text: Speak to all the congregation of Israel[a], saying, ‘On the tenth day of this month each man shall take for himself a lamb according to his fathers’ house, a lamb for the household.’
translation:
  language: hi
  text: “इस्राएल की सारी मंडली से कहो, ‘इस महीने के दसवें दिन हर पुरुष अपने पितृकुल के लिए एक भेड़ या बकरी[a] ले—हर घराने के लिए एक।’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी שֶׂה झुंड के किसी पशु, अर्थात भेड़ या बकरी, को सूचित कर सकता है; इसकी आयु और लिंग के विषय में आगे पद 5 में निर्देश दिया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבְּרוּ אֶל כָּל עֲדַת יִשְׂרָאֵל
  choice: इस्राएल की सारी मण्डली से कहो
  rationale: बहुवचन आज्ञार्थक क्रिया और सामूहिक עֵדָה का सीधा, गरिमापूर्ण तथा स्वाभाविक हिन्दी रूप; ‘मण्डली’ संगठित इस्राएली समुदाय का भाव रखती है।
- source_word: בֶּעָשֹׂר לַחֹדֶשׁ הַזֶּה
  choice: इस महीने के दसवें दिन
  rationale: इब्रानी में शाब्दिक रूप से ‘इस महीने की दसवीं को’ है; ‘दिन’ जोड़ने से आधुनिक हिन्दी में समय-सूचना स्पष्ट होती है।
- source_word: וְיִקְחוּ לָהֶם אִישׁ
  choice: हर पुरुष अपने लिए ... ले
  rationale: निर्देशात्मक क्रिया, आत्मवाचक לָהֶם और वितरणात्मक אִישׁ को एकवचन हिन्दी संरचना में सुरक्षित रखा गया है।
- source_word: שֶׂה
  choice: भेड़ या बकरी का एक बच्चा
  rationale: שֶׂה भेड़ अथवा बकरी, दोनों में से छोटे पशु को सूचित कर सकता है। निर्गमन 12:5 इस व्यापक अर्थ की पुष्टि करता है; इसलिए केवल ‘मेमना’ कहकर अर्थ सीमित नहीं किया गया।
- source_word: לְבֵית אָבֹת
  choice: अपने पितृकुल के अनुसार
  rationale: यह पद पितृवंश पर आधारित विस्तृत पारिवारिक इकाई को दर्शाता है; ‘पितृकुल’ आधुनिक हिन्दी में संक्षिप्त और सामाजिक संरचना के प्रति सटीक है।
- source_word: שֶׂה לַבָּיִת
  choice: हर घराने के लिए एक बच्चा
  rationale: בַּיִת यहाँ भवन नहीं, घरेलू परिवार या घराना है; ‘घराना’ उस सामाजिक इकाई को स्पष्ट करता है।
