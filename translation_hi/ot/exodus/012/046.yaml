  text: בְּ/בַ֤יִת אֶחָד֙ יֵאָכֵ֔ל לֹא תוֹצִ֧יא מִן הַ/בַּ֛יִת מִן הַ/בָּשָׂ֖ר ח֑וּצָ/ה וְ/עֶ֖צֶם לֹ֥א תִשְׁבְּרוּ בֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/046.yaml
  text: It shall be eaten in one house; you shall not take any of the meat outside the house[a], and you shall not break a bone of it.
translation:
  language: hi
  text: उसे एक ही घर में खाया जाए; उस घर में से मांस का कोई भाग बाहर न ले जाना[a], और उसकी कोई हड्डी न तोड़ना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक ही घराने में।” इब्रानी शब्द का अर्थ भौतिक घर या वहाँ एकत्र घराना—दोनों हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבַיִת אֶחָד
  choice: एक ही घर में
  rationale: בַּיִת का अर्थ भौतिक घर या उसमें रहने/जुटने वाला घराना हो सकता है। अगले वाक्यांश में मांस को घर से बाहर न ले जाने की बात होने के कारण यहाँ स्थानवाचक अर्थ प्रमुख है; ‘एक ही’ אֶחָד के एकल स्थान पर बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יֵאָכֵל
  choice: खाया जाए
  rationale: निफ़अल अपूर्ण रूप निष्क्रिय विधिक निर्देश देता है। ‘खाया जाए’ निष्क्रियता और आदेशात्मक भाव दोनों बनाए रखता है।
- source_word: לֹא תוֹצִיא ... מִן הַבָּשָׂר חוּצָה
  choice: मांस का कोई भाग बाहर न ले जाना
  rationale: हिफ़ील יצא का अर्थ बाहर निकालना/ले जाना है; partitive מִן को ‘कोई भाग’ व्यक्त करता है, और חוּצָה बाहर की ओर गति बताता है। यह हिन्दी में स्पष्ट और स्वाभाविक निषेध है।
- source_word: וְעֶצֶם לֹא תִשְׁבְּרוּ בוֹ
  choice: और उसकी कोई हड्डी न तोड़ना
  rationale: एकवचन עֶצֶם यहाँ वितरणात्मक अर्थ रखता है—उस पशु की एक भी हड्डी नहीं तोड़ी जानी है। ‘उसकी’ पुरुषवाचक एकवचन בוֹ के पूर्वोक्त फसह-पशु की ओर संकेत को बनाए रखता है।
theological_decisions:
- issue: अंतिम सर्वनाम בוֹ का संदर्भ
  choice: पूर्वोक्त फसह-पशु—‘उसकी’
  alternative: विशेष रूप से ‘मेमने की’
  rationale: इब्रानी पुरुषवाचक एकवचन सर्वनाम प्रसंग के फसह-पशु की ओर लौटता है। पद में अनुपस्थित विशिष्ट संज्ञा ‘मेमना’ जोड़ने के बजाय ‘उसकी’ मूल पाठ की संदर्भगत व्यापकता बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण विधिक शैली रखी गई है। निष्क्रिय ‘खाया जाए’ मूल की व्याकरणिक बनावट को बचाता है, जबकि ‘न ले जाना’ और ‘न तोड़ना’ सामान्य पाठक के लिए स्वाभाविक निर्देशात्मक हिन्दी है।
