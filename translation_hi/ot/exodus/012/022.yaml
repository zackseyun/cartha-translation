base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/022.yaml
  text: And you shall take a bunch of hyssop and dip it in the blood that is in the basin[a], and touch the lintel and the two doorposts with some of the blood that is in the basin. And none of you shall go out from the entrance of his house until morning.
translation:
  language: hi
  text: और जूफ़े का एक गुच्छा लो, और उसे उस लहू में डुबाओ जो कटोरे[a] में है; फिर कटोरे के लहू में से कुछ लेकर उसे द्वार की चौखट के ऊपरी भाग और उसके दोनों खंभों पर लगाओ। और तुम में से कोई भी सुबह तक अपने घर के द्वार से बाहर न निकले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘देहरी’। इब्रानी शब्द סַף (सफ़) के दोनों अर्थ सम्भव हैं; यहाँ ‘कटोरा’ इसलिए लिया गया है कि लहू उसमें है और जूफ़े को लहू में डुबाया जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲגֻדַּת אֵזוֹב
  choice: जूफ़े का एक गुच्छा
  rationale: אֲגֻדָּה बँधे हुए गुच्छे को दर्शाता है। אֵזוֹב का पारंपरिक हिन्दी बाइबलीय नाम ‘जूफ़ा’ है; संबंधकारक रूप ‘जूफ़े का’ आधुनिक हिन्दी में स्वाभाविक है और वनस्पति की सटीक पहचान के विवाद को नहीं सुलझाता।
- source_word: בַּדָּם
  choice: लहू में
  rationale: טבל के साथ ב उस पदार्थ को बताता है जिसमें वस्तु डुबाई जाती है। ‘लहू में डुबाना’ सीधा और स्वाभाविक है।
- source_word: הַסַּף
  choice: कटोरा
  rationale: इस प्रसंग में लहू का उसके भीतर होना और जूफ़े को उसमें डुबाना पात्र के अर्थ का समर्थन करता है। ‘देहरी’ सम्भव वैकल्पिक अर्थ है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: וְהִגַּעְתֶּם
  choice: लगाना
  rationale: נגע का हिफ़ील यहाँ किसी वस्तु को सतह के संपर्क में लाने का बोध देता है। हिन्दी में लहू को चौखट पर ‘लगाना’ ठोस क्रिया को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַמַּשְׁקוֹף
  choice: चौखट का ऊपरी भाग
  rationale: यह द्वार के ऊपर के क्षैतिज भाग को दर्शाता है। साधारण पाठक के लिए यह तकनीकी ‘सरदल’ से अधिक स्पष्ट है।
- source_word: שְׁתֵּי הַמְּזוּזֹת
  choice: दोनों बाज़ू
  rationale: सन्दर्भ में ये द्वार की चौखट के दोनों खड़े पार्श्व हैं। ‘चौखट के ... दोनों बाज़ू’ स्पष्ट और मुहावरेदार हिन्दी है।
- source_word: מִן הַדָּם
  choice: लहू में से कुछ
  rationale: מִן यहाँ पात्र में रखे लहू में से ली गई मात्रा को दर्शाता है; ‘में से कुछ’ इस आंशिक भाव को स्पष्ट रखता है।
- source_word: לֹא תֵצְאוּ אִישׁ
  choice: तुममें से कोई भी ... बाहर न निकले
  rationale: बहुवचन निषेध के साथ אִישׁ का वितरणात्मक अर्थ है। यह हिन्दी अभिव्यक्ति प्रत्येक व्यक्ति पर लागू निषेध को स्वाभाविक ढंग से बताती है।
- source_word: מִפֶּתַח בֵּיתוֹ
  choice: अपने घर के द्वार से
  rationale: वितरणात्मक אִישׁ और एकवचन प्रत्यय का भाव हिन्दी के ‘अपने’ में सुरक्षित रहता है, बिना आदेश को केवल पुरुषों तक सीमित दिखाए।
- source_word: עַד בֹּקֶר
  choice: सुबह तक
  rationale: यह समय-सीमा का सीधा और सामान्य आधुनिक हिन्दी रूप है।
theological_decisions:
- issue: אִישׁ ... בֵּיתוֹ का लिंगयुक्त वितरणात्मक रूप
  choice: तुममें से कोई भी अपने घर के द्वार से ... बाहर न निकले
  alternative: तुममें से कोई भी उसके घर के द्वार से ... बाहर न निकले
  rationale: हिब्रू का पुल्लिंग एकवचन यहाँ वितरणात्मक और प्रतिनिधिक है। हिन्दी का ‘अपने घर’ प्रत्येक संबोधित व्यक्ति से संबंध बनाए रखता है और अनावश्यक रूप से आदेश को केवल पुरुषों तक सीमित नहीं करता।
- issue: הַסַּף का अर्थ
  choice: कटोरा
  alternative: देहरी
  rationale: लहू का ‘उसमें’ होना और जूफ़े को लहू में डुबाने की क्रिया पात्र के अर्थ को अधिक सम्भावित बनाती है। वास्तविक शाब्दिक विकल्प ‘देहरी’ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। ‘जूफ़ा’ पारंपरिक वनस्पति-नाम के रूप में रखा गया है; वास्तुशिल्प के दुर्लभ तकनीकी शब्दों के स्थान पर ‘चौखट का ऊपरी भाग’ और ‘दोनों बाज़ू’ प्रयुक्त हैं। मुख्य पाठ में पादटिप्पणी सूचक [a] उपस्थित है।
