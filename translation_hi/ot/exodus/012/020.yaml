translation:
  language: hi
  text: तुम कोई भी खमीरवाली वस्तु न खाओ; अपने सभी निवास-स्थानों में अख़मीरी रोटी खाओ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל מַחְמֶצֶת
  choice: कोई भी खमीर उठी हुई वस्तु
  rationale: निषेध के साथ כָּל व्यापक अर्थ देता है, और מַחְמֶצֶת केवल रोटी नहीं बल्कि हर खमीर उठी हुई खाद्य-वस्तु को सूचित करता है। यह अनुवाद उस व्यापकता को बनाए रखता है।
- source_word: לֹא תֹאכֵלוּ
  choice: न खाना
  rationale: यह कानूनी संदर्भ में स्पष्ट निषेध है। आधुनिक हिन्दी में यह रूप स्वाभाविक होने के साथ आज्ञात्मक गरिमा रखता है।
- source_word: בְּכֹל מוֹשְׁבֹתֵיכֶם
  choice: जहाँ-जहाँ तुम रहते हो
  rationale: यह वाक्यांश प्रत्येक निवास-स्थान या बस्ती को समेटता है। यह हिन्दी अभिव्यक्ति अर्थ को स्पष्ट और स्वाभाविक रूप में पहुँचाती है।
- source_word: תֹּאכְלוּ
  choice: खाना
  rationale: संदर्भ में यह सकारात्मक आज्ञा है और पहले निषेध के समानांतर रखी गई है।
- source_word: מַצּוֹת
  choice: अख़मीरी रोटी
  rationale: यह खमीर के बिना बनी रोटी को सूचित करता है। ‘अख़मीरी रोटी’ हिन्दी बाइबलीय प्रयोग में परिचित, संक्षिप्त और अर्थतः सटीक है।
