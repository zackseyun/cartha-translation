language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: שִׁבְעַ֤ת יָמִים֙ מַצּ֣וֹת תֹּאכֵ֔לוּ אַ֚ךְ בַּ/יּ֣וֹם הָ/רִאשׁ֔וֹן תַּשְׁבִּ֥יתוּ שְּׂאֹ֖ר מִ/בָּתֵּי/כֶ֑ם כִּ֣י כָּל אֹכֵ֣ל חָמֵ֗ץ וְ/נִכְרְתָ֞ה הַ/נֶּ֤פֶשׁ הַ/הִוא֙ מִ/יִּשְׂרָאֵ֔ל מִ/יּ֥וֹם הָ/רִאשֹׁ֖ן עַד י֥וֹם הַ/שְּׁבִעִֽי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/015.yaml
  text: For seven days you shall eat unleavened bread[a]. But on the first day you shall remove leaven from your houses, for whoever eats anything leavened, that person shall be cut off from Israel[b], from the first day to the seventh day.
translation:
  language: hi
  text: सात दिन तक तुम अखमीरी रोटी खाओ। पर पहले दिन ही अपने घरों से खमीर दूर कर दो[a], क्योंकि पहले दिन से सातवें दिन तक जो कोई खमीरी वस्तु खाएगा, वह व्यक्ति इस्राएल में से काट दिया जाएगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “अपने घरों में खमीर का रहना बंद करा दो।” इसका अर्थ खमीर को हटा देना या नष्ट कर देना हो सकता है।'
    reason: lexical_alternative
  - marker: b
    text: “काट दिया जाएगा” एक हिब्रू कानूनी अभिव्यक्ति है। इसका संकेत समुदाय से निष्कासन, मृत्यु या परमेश्वर के न्याय की ओर हो सकता है; इस पद में दंड की ठीक विधि नहीं बताई गई है।
    reason: alternative_reading
lexical_decisions:
- source_word: מַצּוֹת
  choice: अखमीरी रोटी
  rationale: यह शब्द खमीर के बिना बनाई गई रोटी को दर्शाता है। ‘अखमीरी रोटी’ हिन्दी बाइबिलीय प्रयोग में परिचित, संक्षिप्त और अनुष्ठानिक संदर्भ के अनुकूल है।
- source_word: אַךְ
  choice: पर
  rationale: यह अव्यय सामान्य आज्ञा से पहले दिन की विशेष और अनिवार्य व्यवस्था की ओर बलयुक्त मोड़ दिखाता है।
- source_word: תַּשְׁבִּיתוּ
  choice: दूर कर दो
  rationale: שׁבת के हिफ़ील रूप का शाब्दिक भाव ‘बंद करा देना’ है; यहाँ व्यावहारिक आशय घरों से खमीर हटा देना है।
- source_word: שְּׂאֹר
  choice: खमीर
  rationale: यह आटा फुलाने वाले किण्वक पदार्थ को दर्शाता है। ‘खमीर’ आधुनिक हिन्दी में स्वाभाविक और धार्मिक संदर्भ में सटीक है।
- source_word: חָמֵץ
  choice: खमीरी वस्तु
  rationale: शब्द का दायरा केवल रोटी तक सीमित नहीं है, बल्कि किसी भी खमीर उठी खाद्य वस्तु को समेट सकता है।
- source_word: וְנִכְרְתָה
  choice: काट दिया जाएगा
  rationale: मूल का वाच्यार्थ और उसकी वाचा-संबंधी कानूनी शक्ति सुरक्षित रखी गई है; दंड की ठीक विधि पद में स्पष्ट नहीं है।
- source_word: הַנֶּפֶשׁ הַהִוא
  choice: वह व्यक्ति
  rationale: कानूनी सूत्र में נֶפֶשׁ किसी व्यक्तिगत मनुष्य को दर्शाता है; ‘प्राण’ या ‘आत्मा’ यहाँ अनावश्यक मानवशास्त्रीय अर्थ ला सकता है।
- source_word: מִיִּשְׂרָאֵל
  choice: इस्राएल में से
  rationale: यह वाचा-समुदाय से काटे जाने का संबंध व्यक्त करता है और मूल की संक्षिप्तता बनाए रखता है।
- source_word: מִיּוֹם הָרִאשֹׁן עַד יוֹם הַשְּׁבִעִי
  choice: पहले दिन से सातवें दिन तक
  rationale: इस कालवाची पदबंध को खमीरी वस्तु खाने के निषेध और उससे जुड़े दंड की अवधि के साथ रखा गया है, जैसा हिब्रू वाक्यक्रम स्वाभाविक रूप से संकेत करता है।
theological_decisions:
- issue: וְנִכְרְתָה (‘काट दिया जाएगा’) दंड का अर्थ
  choice: औपचारिक कानूनी अभिव्यक्ति ‘इस्राएल में से काट दिया जाएगा’ को बनाए रखना
  alternative: समुदाय से निकाल दिया जाएगा; मार डाला जाएगा; परमेश्वर के न्याय से नष्ट किया जाएगा
  rationale: यह हिब्रू पद वाचा और न्याय से संबंधित गंभीर दंड दर्शाता है, पर इस पद में यह स्पष्ट नहीं किया गया कि वह निष्कासन, मृत्यु या प्रत्यक्ष ईश्वरीय न्याय के रूप में लागू होगा। इसलिए अस्पष्टता को हल किए बिना सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। आज्ञार्थ के लिए सहज बहुवचन रूप ‘खाओ’ और ‘दूर कर दो’ अपनाए गए हैं। ‘अखमीरी रोटी’, ‘खमीर’ और ‘इस्राएल में से काट दिया जाएगा’ मूल के अनुष्ठानिक तथा कानूनी स्वर को बनाए रखते हैं।
