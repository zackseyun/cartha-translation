source:
  edition: WLC
  text: וַ/יֹּאפ֨וּ אֶת הַ/בָּצֵ֜ק אֲשֶׁ֨ר הוֹצִ֧יאוּ מִ/מִּצְרַ֛יִם עֻגֹ֥ת מַצּ֖וֹת כִּ֣י לֹ֣א חָמֵ֑ץ כִּֽי גֹרְשׁ֣וּ מִ/מִּצְרַ֗יִם וְ/לֹ֤א יָֽכְלוּ֙ לְ/הִתְמַהְמֵ֔הַּ וְ/גַם צֵדָ֖ה לֹא עָשׂ֥וּ לָ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/039.yaml
  text: 'They baked the dough they had brought out of Egypt into unleavened cakes, since it had not become leavened: they had been driven out of Egypt and could not delay, and had not prepared provisions for themselves.'
translation:
  language: hi
  text: उन्होंने मिस्र से लाए हुए गूँधे आटे की बेखमीर रोटियाँ सेंकीं, क्योंकि आटे में खमीर नहीं उठा था। उन्हें मिस्र से निकाल दिया गया था और वे देर नहीं कर सकते थे; उन्होंने अपने लिए रास्ते का भोजन भी तैयार नहीं किया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאפוּ
  choice: उन्होंने ... सेंकीं
  rationale: क्रिया का अर्थ पकाने/सेंकने से है; रोटियों के संदर्भ में ‘सेंकीं’ स्वाभाविक आधुनिक हिन्दी है। आरंभिक वाव को अलग से ‘और’ कहना इस स्वतंत्र पद में आवश्यक नहीं।
- source_word: הַבָּצֵק
  choice: गूँधा आटा
  rationale: בצק तैयार गूँधे हुए आटे को दर्शाता है; ‘गूँधा आटा’ सामान्य हिन्दी में स्पष्ट है।
- source_word: עֻגֹת מַצּוֹת
  choice: बेखमीर रोटियाँ
  rationale: עֻגֹת गोल/चपटी रोटी-जैसी टिकियों और מַצּוֹת बिना खमीर की रोटी को दर्शाता है। ‘बेखमीर रोटियाँ’ हिन्दी बाइबलीय प्रयोग में परिचित और सामान्य पाठक के लिए बोधगम्य है।
- source_word: כִּי לֹא חָמֵץ
  choice: क्योंकि आटे में खमीर नहीं उठा था
  rationale: חָמֵץ यहाँ क्रियात्मक रूप से आटे के खमीरयुक्त होने को बताता है। हिन्दी मुहावरे ‘खमीर उठना’ से प्रक्रिया और पूर्वकालीन अवस्था दोनों स्वाभाविक रूप से व्यक्त होते हैं।
- source_word: כִּי גֹרְשׁוּ מִמִּצְרַיִם
  choice: उन्हें मिस्र से निकाल दिया गया था
  rationale: पुअल रूप जबरन निकाले जाने का निष्क्रिय भाव देता है। ‘निकाल दिया गया’ बलपूर्वक प्रस्थान का अर्थ रखता है, पर अनावश्यक रूप से अधिक व्याख्यात्मक नहीं होता।
- source_word: וְלֹא יָכְלוּ לְהִתְמַהְמֵהַּ
  choice: और वे देर नहीं कर सकते थे
  rationale: התמהמה का अर्थ देर करना या ठहरना है; यह चयन समयाभाव और शीघ्र प्रस्थान की परिस्थिति को सहज हिन्दी में व्यक्त करता है।
- source_word: צֵדָה
  choice: रास्ते का भोजन
  rationale: צֵדָה यात्रा के लिए रखी खाद्य-सामग्री/रसद है। ‘रास्ते का भोजन’ सामान्य पाठक को आशय तुरंत समझाता है और संदर्भ में अपेक्षित भोजन पर केंद्रित रहता है।
- source_word: לָהֶם
  choice: अपने लिए
  rationale: यह सर्वनाम उनकी अपनी आवश्यकता के लिए तैयारी का सीधा संकेत देता है।
