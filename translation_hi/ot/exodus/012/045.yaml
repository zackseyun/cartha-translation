lexical_decisions:
- source_word: תּוֹשָׁב
  choice: निवासी परदेशी
  rationale: यह पद ऐसे गैर-इस्राएली निवासी को सूचित करता है जो इस्राएलियों के बीच रहता है, पर पूरी तरह वाचा-समुदाय में सम्मिलित नहीं है। ‘निवासी परदेशी’ निवास और बाहरी स्थिति—दोनों को स्पष्ट रखता है।
- source_word: שָׂכִיר
  choice: मज़दूरी पर रखा गया व्यक्ति
  rationale: यह शब्द वेतन के बदले काम करने वाले व्यक्ति के लिए है। यह अनुवाद आधुनिक हिन्दी में स्पष्ट है और उसे दास या स्थायी सेवक बताने से बचता है।
- source_word: לֹא יֹאכַל
  choice: न खाए
  rationale: विधिक प्रसंग में निषेध के साथ अपूर्ण क्रिया आज्ञात्मक प्रतिबंध व्यक्त करती है। ‘न खाए’ हिन्दी में संक्षिप्त, गरिमापूर्ण और विधिक बल वाला निषेध है।
- source_word: בּוֹ
  choice: उसमें से
  rationale: אכל के साथ ב यहाँ अंशग्रहण का भाव देता है—फसह के भोजन अथवा पशु में से खाना। ‘उसमें से’ इस भाव और इब्रानी सर्वनाम की संक्षिप्तता को बनाए रखता है।
theological_decisions:
- issue: फसह-विधान में ‘उसमें’ का संकेत
  choice: सर्वनाम को मुख्य पाठ में ‘उसमें से’ रखकर उसका संकेत प्रसंग पर छोड़ा गया है।
  alternative: इसे स्पष्ट रूप से ‘फसह के मेम्ने में से’ या ‘फसह के भोजन में से’ कहना।
  rationale: इब्रानी में निकट प्रसंग से समझा जाने वाला केवल सर्वनाम है। संक्षिप्त रूप मूल की अस्पष्टता बनाए रखता है; टिप्पणी व्यापक और संकीर्ण दोनों सम्भव संकेतों को बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का संक्षिप्त और गरिमापूर्ण विधिक रूप अपनाया गया है। ‘मज़दूरी पर रखा गया व्यक्ति’ सामान्य पाठक के लिए स्पष्ट है; ‘उसमें से’ मूल पाठ के संक्षिप्त सर्वनाम और उसके वास्तविक संदर्भगत खुलेपन को सुरक्षित रखता है।
