base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/040.yaml
  text: The dwelling of the sons of Israel[a], who lived in Egypt, was four hundred thirty years.
translation:
  language: hi
  text: इस्राएल के पुत्रों[a] के मिस्र में रहने की अवधि चार सौ तीस वर्ष थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ प्राचीन पाठ-साक्ष्यों में है, “इस्राएल के पुत्रों और उनके पूर्वजों के मिस्र और कनान में रहने की अवधि चार सौ तीस वर्ष थी।”
    reason: textual_variant
lexical_decisions:
- source_word: מוֹשַׁב
  choice: रहने की अवधि
  rationale: यहाँ संज्ञा निवास की दशा या स्थान से अधिक उसके काल को सूचित करती है; ‘रहने की अवधि’ आधुनिक हिन्दी में स्वाभाविक रूप से यही अर्थ व्यक्त करती है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: यह इब्रानी पदबंध के औपचारिक और वाचा-संबंधी रूप को बनाए रखता है; ‘इस्राएली’ अधिक सहज विकल्प है, पर स्रोत की अभिव्यक्ति को कम प्रत्यक्ष बनाता है।
- source_word: אֲשֶׁר יָשְׁבוּ בְּמִצְרָיִם
  choice: के मिस्र में रहने
  rationale: हिन्दी में संबंधवाचक उपवाक्य को कृदंतीय संरचना में समेटने से वाक्य सहज रहता है और ‘मिस्र में रहे’ का अर्थ स्पष्ट बना रहता है।
- source_word: שְׁלֹשִׁים שָׁנָה וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: चार सौ तीस वर्ष
  rationale: हिन्दी संख्या-क्रम के अनुसार यह 430 वर्ष का स्वाभाविक और सटीक रूप है।
theological_decisions:
- issue: 430 वर्षों की अवधि केवल मिस्र के निवास की है या कनान सहित व्यापक पूर्वजकालीन प्रवास की
  choice: मुख्य पाठ में मसोरेटिक पाठ के अनुसार इस्राएल के पुत्रों का मिस्र में निवास 430 वर्ष बताया गया है।
  alternative: कुछ प्राचीन पाठ-साक्ष्य इस निवास में उनके पूर्वजों और कनान में बिताए समय को भी सम्मिलित करते हैं।
  rationale: प्रदत्त WLC पाठ स्पष्टतः केवल ‘मिस्र में’ कहता है। कालक्रम को प्रभावित करने वाले प्राचीन पाठांतर को मुख्य पाठ में मिलाने के बजाय पादटिप्पणी में सुरक्षित रखना उचित है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज और गरिमापूर्ण है। ‘रहने की अवधि’ מוֹשַׁב के कालगत अर्थ को स्पष्ट करती है, जबकि ‘इस्राएल के पुत्रों’ स्रोत की पारंपरिक संरचना बनाए रखता है।
