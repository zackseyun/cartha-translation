  yaml_path: translation/ot/exodus/012/044.yaml
  text: But every man's servant[a], bought with silver—when you have circumcised him[b], then he may eat of it.
translation:
  language: hi
  text: परन्तु हर पुरुष का दास[a], जिसे चाँदी देकर खरीदा गया हो—जब तू उसका खतना कर चुका हो[b], तब वह उसमें से खा सकता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘हर पुरुष का सेवक, जिसे चाँदी देकर खरीदा गया हो।’
    reason: lexical_alternative
  - marker: b
    text: अर्थात वह खतना होने के बाद ही फसह के भोजन में भाग ले सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: וְ/כָל
  choice: परन्तु हर
  rationale: וְ पिछले पद में परदेशी के निषेध से इस नियम को जोड़ता है; ‘परन्तु’ प्रसंग का विरोध स्पष्ट करता है और כָּל का वितरणात्मक अर्थ ‘हर’ से बना रहता है।
- source_word: עֶבֶד
  choice: दास
  rationale: चाँदी देकर खरीदे जाने के स्पष्ट उल्लेख के कारण यहाँ बंधुआ और स्वामित्वाधीन स्थिति अभिप्रेत है; ‘सेवक’ इस सामाजिक यथार्थ को अनावश्यक रूप से नरम कर देता।
- source_word: אִישׁ
  choice: पुरुष का
  rationale: मूल शब्द पुल्लिंग एकवचन है और यहाँ स्वामी को सूचित करता है; ‘पुरुष का’ कानूनी कथन की लिंग-विशिष्टता बनाए रखता है।
- source_word: מִקְנַת כָּסֶף
  choice: जो चाँदी देकर खरीदा गया हो
  rationale: यह मुहावरा धन देकर प्राप्त किए गए व्यक्ति को दर्शाता है। ‘चाँदी देकर खरीदा’ मूल बिंब और खरीद का भाव दोनों सुरक्षित रखता है।
- source_word: וּ/מַלְתָּה אֹתוֹ
  choice: जब तू उसका खतना कर दे
  rationale: संयोजित पूर्ण क्रिया अगली अनुमति से पहले पूरी होने वाली आवश्यक कार्रवाई बताती है; एकवचन प्रत्यक्ष संबोधन ‘तू’ से सुरक्षित है।
- source_word: אָז
  choice: तभी
  rationale: यह खतने के बाद आने वाले परिणाम को चिह्नित करता है; ‘तभी’ पूर्वशर्त और उसके परिणाम के संबंध को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: יֹאכַל בּוֹ
  choice: वह उसमें से खा सकता है
  rationale: अपूर्ण क्रिया यहाँ अनुमति व्यक्त करती है, केवल भविष्य नहीं। בּוֹ का संबंध फसह के भोजन से है, इसलिए ‘उसमें से’ उपयुक्त है।
theological_decisions:
- issue: वाचा-संबंधी कानूनी प्रसंग में עֶבֶד का अनुवाद
  choice: दास
  alternative: सेवक
  rationale: व्यक्ति को चाँदी देकर खरीदा गया बताया गया है, इसलिए बंधुआ और स्वामित्वाधीन दर्जा अर्थ का केंद्रीय भाग है; ‘दास’ संस्था की वास्तविकता को नहीं छिपाता।
- issue: אִישׁ में लिंग-सूचक भाषा
  choice: पुरुष का
  alternative: व्यक्ति का
  rationale: इब्रानी रूप पुल्लिंग एकवचन है और प्रतिनिधिक कानूनी स्वामी को दर्शाता है; जहाँ प्रसंग बाध्य न करे, उसकी लिंग-सूचकता बनाए रखना उचित है।
- issue: खतना और फसह में भागीदारी का संबंध
  choice: खतने को भोजन में भाग लेने की पूर्वशर्त के रूप में व्यक्त किया
  alternative: दो स्वतंत्र क्रमिक कार्यों के रूप में व्यक्त करना
  rationale: וּמַלְתָּה ... אָז की रचना स्पष्टतः पहले खतना और फिर भोजन की अनुमति का क्रम देती है, बिना इससे आगे कोई अतिरिक्त धर्मवैज्ञानिक निष्कर्ष जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण कानूनी शैली रखी गई है। ‘दास’ सामाजिक स्थिति को स्पष्ट करता है; ‘तू’ मूल के एकवचन प्रत्यक्ष संबोधन को सुरक्षित रखता है। ‘खतना’ सामान्यतः समझा जाने वाला वर्तमान शब्द है। सभी पाद-टिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
