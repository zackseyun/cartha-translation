source:
  edition: WLC
  text: וַ/תֶּחֱזַ֤ק מִצְרַ֨יִם֙ עַל הָ/עָ֔ם לְ/מַהֵ֖ר לְ/שַׁלְּחָ֣/ם מִן הָ/אָ֑רֶץ כִּ֥י אָמְר֖וּ כֻּלָּ֥/נוּ מֵתִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/033.yaml
  text: And the Egyptians urged the people on[a], hurrying to send them out of the land, for they said, “We are all dead men.”
translation:
  language: hi
  text: तब मिस्रियों ने लोगों को देश से शीघ्र भेज देने के लिए उन पर बहुत दबाव डाला[a], क्योंकि उन्होंने कहा, “हम सब मर रहे हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्हें देश से भेज देने में जल्दी करने के लिए।” हिब्रू में लगातार दो अनंत क्रियारूप अत्यधिक जल्दबाज़ी और तात्कालिकता व्यक्त करते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֶּחֱזַק מִצְרַיִם עַל־הָעָם
  choice: मिस्री लोग इस्राएलियों पर बहुत दबाव डालने लगे
  rationale: חזק על यहाँ किसी पर जोरदार दबाव डालने का भाव देता है। מִצְרַיִם स्थानवाचक रूप होते हुए भी सामूहिक रूप से मिस्रियों को सूचित करता है; संदर्भ के कारण הָעָם को स्पष्ट करने के लिए ‘इस्राएलियों’ कहा गया है।
- source_word: לְמַהֵר לְשַׁלְּחָם
  choice: कि वे उन्हें ... शीघ्र निकाल दें
  rationale: क्रमिक दो infinitives तत्काल और शीघ्र विदा करने का उद्देश्य व्यक्त करते हैं। हिंदी में उद्देश्यवाचक उपवाक्य स्वाभाविक है और दोनों क्रियाओं की संयुक्त तात्कालिकता बनाए रखता है।
- source_word: מִן־הָאָרֶץ
  choice: देश से
  rationale: शाब्दिक अर्थ ‘उस देश/भूमि से’ है और संदर्भ में मिस्र का देश अभिप्रेत है; ‘देश से’ स्रोत की संक्षिप्तता बनाए रखता है।
- source_word: כִּי אָמְרוּ
  choice: क्योंकि वे कह रहे थे
  rationale: כִּי कारण बताता है। बहुवचन पूर्ण क्रिया को यहाँ सामूहिक रूप से चल रही प्रतिक्रिया के रूप में सहज हिंदी में ‘कह रहे थे’ किया गया है।
- source_word: כֻּלָּנוּ מֵתִים
  choice: हम सब मारे जाएँगे
  rationale: शाब्दिक रूप ‘हम सब मृत हैं’ है, पर विपत्ति के बीच यह आसन्न सामूहिक मृत्यु की भयपूर्ण घोषणा है। हिंदी में ‘मारे जाएँगे’ उस प्रसंगगत आशय को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: כֻּלָּנוּ מֵתִים का कालगत भाव
  choice: हम सब मारे जाएँगे
  alternative: हम सब मर रहे हैं / हम सब मरे हुए हैं
  rationale: हिब्रू participle वर्तमान दशा या आसन्न परिणाम दोनों का संकेत दे सकता है। संदर्भ में जीवित मिस्री आगे आने वाली सर्वनाशकारी मृत्यु का भय व्यक्त कर रहे हैं; इसलिए भविष्याभिमुख हिंदी चुनी गई, जबकि विकल्प पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिंदी; कथात्मक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज। ‘इस्राएलियों’ से संदर्भगत ‘लोगों’ की पहचान स्पष्ट की गई है। विस्मयादिबोधक चिह्न मिस्रियों के भय और तात्कालिकता को व्यक्त करता है।
