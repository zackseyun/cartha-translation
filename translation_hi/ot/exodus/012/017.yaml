base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/017.yaml
  text: And you shall keep the Feast of Unleavened Bread[a], because on this very day I brought your hosts out from the land of Egypt[c][b]. And you shall keep this day throughout your generations as a permanent statute.
translation:
  language: hi
  text: तुम अख़मीरी रोटी के पर्व[a] का पालन करना, क्योंकि ठीक इसी दिन मैं तुम्हारे दलों[b] को मिस्र देश से निकाल लाया। तुम पीढ़ी-दर-पीढ़ी इस दिन का पालन सदा की विधि[c] के रूप में करना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘अख़मीरी रोटियाँ/वस्तुएँ’ है; संदर्भ में यह अख़मीरी रोटी के पर्व और उसके पालन को भी सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘तुम्हारी टुकड़ियों’, ‘तुम्हारे समुदायों’ अथवा ‘तुम्हारे संगठित समूहों’। इब्रानी शब्द इस्राएल को व्यवस्थित दलों के रूप में चित्रित करता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘स्थायी विधि’ अथवा ‘युगों तक की विधि’।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: मनाना / मानना
  rationale: अनुष्ठानिक संदर्भ में שׁמר का अर्थ पालन करना या मानना है। पर्व के साथ ‘मनाना’ और दिन तथा विधि के साथ ‘मानना’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: הַמַּצּוֹת
  choice: अख़मीरी रोटी का पर्व
  rationale: शाब्दिक अर्थ ‘अख़मीरी रोटियाँ/वस्तुएँ’ है, पर इस संदर्भ में यह पर्व के पालन को सूचित करता है। मुख्य पाठ में स्वाभाविक हिन्दी के लिए ‘पर्व’ स्पष्ट किया गया है और शाब्दिक संभावना पादटिप्पणी में रखी गई है।
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: इसी दिन
  rationale: यह हिन्दी अभिव्यक्ति दिन की ठीक वही पहचान और मूल वाक्यांश के बलाघात को संक्षेप में व्यक्त करती है।
- source_word: הוֹצֵאתִי
  choice: निकाल लाया
  rationale: יצא के हिफ़ील रूप का कारक अर्थ ‘बाहर निकालना/ले आना’ है; ‘निकाल लाया’ उद्धार-गति को सहज हिन्दी में व्यक्त करता है।
- source_word: צִבְאוֹתֵיכֶם
  choice: तुम्हारे दलों
  rationale: צָבָא संगठित समूह, सेना या टुकड़ी का बोध करा सकता है। ‘दल’ सैन्य अर्थ को अनावश्यक रूप से कठोर किए बिना संगठित समुदाय का भाव बनाए रखता है।
- source_word: לְדֹרֹתֵיכֶם
  choice: पीढ़ी-दर-पीढ़ी
  rationale: उत्तरवर्ती पीढ़ियों में निरंतर पालन का स्वाभाविक और सुबोध हिन्दी रूप।
- source_word: חֻקַּת עוֹלָם
  choice: सदा की विधि
  rationale: חֻקָּה निर्धारित विधान है और עוֹלָם दीर्घस्थायी अथवा निरंतर अवधि दर्शाता है। ‘सदा की विधि’ मूल की गंभीरता और स्थायित्व बनाए रखती है।
theological_decisions:
- issue: הַמַּצּוֹת भोजन को सूचित करता है या पर्व को
  choice: मुख्य पाठ में ‘अख़मीरी रोटी का पर्व’
  alternative: ‘अख़मीरी रोटियाँ’ या ‘अख़मीरी वस्तुएँ’
  rationale: संदर्भ पर्वीय पालन का है, किंतु इब्रानी में ‘पर्व’ शब्द प्रत्यक्षतः नहीं है। अतः स्वाभाविक अर्थ मुख्य पाठ में और मूल की lexical ambiguity पादटिप्पणी में सुरक्षित है।
- issue: חֻקַּת עוֹלָם की अवधि
  choice: ‘सदा की विधि’
  alternative: ‘स्थायी विधि’ या ‘युगों तक की विधि’
  rationale: यह वाचा-संबंधी निरंतर दायित्व व्यक्त करता है। अनुवाद स्थायित्व को बनाए रखता है, जबकि पादटिप्पणी עוֹלָם की संदर्भगत अवधि की वैकल्पिक अभिव्यक्ति बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज आज्ञार्थक शैली अपनाई गई है। ‘अख़मीरी रोटी’ व्यापक रूप से समझ में आने वाला पारंपरिक पद है; अस्पष्टताओं को मुख्य पाठ में दबाने के बजाय पादटिप्पणियों में स्पष्ट रखा गया है।
