base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/006.yaml
  text: And it shall be kept by you until the fourteenth day of this month[a], and the whole assembly of the congregation of Israel shall slaughter it between the evenings.
translation:
  language: hi
  text: और वह इस महीने के चौदहवें दिन तक तुम्हारी देखरेख में रहे; फिर इस्राएल की पूरी समुदाय-सभा उसे साँझ के समय[a] वध करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “दो साँझों के बीच”; यह इब्रानी मुहावरा सूर्यास्त के आसपास के समय, अर्थात साँझ या गोधूलि, को दर्शाता है।'
    reason: मूल समय-सूचक मुहावरे की शाब्दिक बनावट और अर्थगत अनिश्चितता को सुरक्षित रखना।
lexical_decisions:
- source_word: וְהָיָה לָכֶם לְמִשְׁמֶרֶת
  choice: वह ... तुम्हारी देखरेख में रहे
  rationale: यह पदबंध पशु को नियत दिन तक अपने संरक्षण में रखने का निर्देश देता है। यह हिन्दी में स्वाभाविक है और मूल के अभिरक्षा-संबंधी भाव को व्यक्त करता है।
- source_word: עַד אַרְבָּעָה עָשָׂר יוֹם לַחֹדֶשׁ הַזֶּה
  choice: इस महीने के चौदहवें दिन तक
  rationale: इब्रानी की तिथि-अभिव्यक्ति को स्पष्ट और स्वाभाविक आधुनिक हिन्दी में रखा गया है।
- source_word: וְשָׁחֲטוּ אֹתוֹ
  choice: उसे ... बलि करे
  rationale: שׁחט पशु-वध को दर्शाता है और इस विधिक-संस्कारिक प्रसंग में ‘बलि करे’ उद्देश्य तथा गंभीरता को संक्षेप में व्यक्त करता है; केवल ‘मार डाले’ से यह विशेषता धुंधली पड़ती।
- source_word: כֹּל קְהַל עֲדַת יִשְׂרָאֵל
  choice: इस्राएल की प्रजा की सारी सभा
  rationale: मूल के दोहरे सामूहिक पदबंध को पूरी तरह सपाट किए बिना सुबोध हिन्दी में रखा गया है, जिससे समस्त इस्राएल की सामूहिक भागीदारी बनी रहती है।
- source_word: בֵּין הָעַרְבָּיִם
  choice: साँझ के समय
  rationale: शाब्दिक अर्थ ‘दो साँझों के बीच’ है। मुख्य पाठ में स्वाभाविक समय-सूचक अभिव्यक्ति दी गई है और मूल मुहावरे तथा उसकी अर्थ-सीमा को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: वध की आज्ञा का सामूहिक कर्ता
  choice: इस्राएल की प्रजा की सारी सभा ... बलि करे
  alternative: हर घराना अपने पशु की बलि करे
  rationale: इब्रानी पाठ इस्राएल की समूची सभा को सामूहिक कर्ता बनाता है। आसपास के प्रसंग में कार्य घरानों द्वारा होने पर भी अनुवाद उस व्यावहारिक विवरण को यहाँ जोड़कर मूल के सामूहिक कथन को नहीं बदलता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध हिन्दी। विधिक निर्देश का स्वर बनाए रखा गया है; ‘देखरेख में रहे’ अभिरक्षा का भाव देता है और पादटिप्पणी विवादित समय-मुहावरे को स्पष्ट करती है।
