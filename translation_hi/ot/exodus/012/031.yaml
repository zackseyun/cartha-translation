source:
  edition: WLC
  text: וַ/יִּקְרָא֩ לְ/מֹשֶׁ֨ה וּֽ/לְ/אַהֲרֹ֜ן לַ֗יְלָה וַ/יֹּ֨אמֶר֙ ק֤וּמוּ צְּאוּ֙ מִ/תּ֣וֹךְ עַמִּ֔/י גַּם אַתֶּ֖ם גַּם בְּנֵ֣י יִשְׂרָאֵ֑ל וּ/לְכ֛וּ עִבְד֥וּ אֶת יְהוָ֖ה כְּ/דַבֶּרְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/031.yaml
  text: Then he called for Moses and Aaron by night and said[a], “Rise up, go out from among my people, both you and the sons of Israel, and go, serve Yahweh[b], as you have said.”
translation:
  language: hi
  text: तब फ़िरौन ने रात में मूसा और हारून को बुलाया और कहा, “उठो, तुम भी और इस्राएल की संतान भी, मेरे लोगों के बीच से निकल जाओ। जाओ, याहवे की सेवा करो, जैसा तुमने कहा था।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: बुलवाकर
  rationale: संदर्भ में फ़िरौन मूसा और हारून को अपने पास तत्काल बुलाता है; ‘बुलवाकर’ राजकीय आदेश द्वारा बुलाए जाने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לַיְלָה
  choice: रात ही में
  rationale: कालवाचक प्रयोग रात के समय को बताता है; ‘ही’ विपत्ति के तुरंत बाद की तात्कालिकता को उभारता है, बिना अर्थ बढ़ाए।
- source_word: קוּמוּ צְּאוּ
  choice: उठो… निकल जाओ
  rationale: दोनों बहुवचन आज्ञाओं की तात्कालिकता और क्रम को बनाए रखा गया है; ‘निकल जाओ’ מִתּוֹךְ के साथ स्वाभाविक हिन्दी है।
- source_word: מִתּוֹךְ עַמִּי
  choice: मेरे लोगों के बीच से
  rationale: ‘बीच से’ स्रोत के स्थानवाचक अर्थ को बनाए रखता है और मिस्री जनसमुदाय के मध्य से बाहर जाने को व्यक्त करता है।
- source_word: גַּם אַתֶּם גַּם בְּנֵי יִשְׂרָאֵל
  choice: तुम और इस्राएल की संतान—दोनों
  rationale: दोहराए गए גַּם…גַּם का समावेशी बल ‘दोनों’ से व्यक्त होता है; ‘इस्राएल की संतान’ בְּנֵי יִשְׂרָאֵל की पारिवारिक सामूहिक अभिव्यक्ति को सुरक्षित रखता है।
- source_word: עִבְדוּ
  choice: सेवा करो
  rationale: עבד में सेवा और आराधना दोनों का अर्थ-क्षेत्र संभव है; ‘सेवा करो’ व्यापक मूल अर्थ को सुरक्षित रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित प्रतिलेखन द्वारा चतुरक्षरीय व्यक्तिगत नाम को शीर्षक से प्रतिस्थापित किए बिना प्रस्तुत किया गया है।
- source_word: כְּדַבֶּרְכֶם
  choice: जैसा तुमने कहा था
  rationale: यह मूसा और हारून की पहले कही हुई माँग के अनुसार फ़िरौन की अनुमति को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम सीधे प्रयुक्त है। हिन्दी पाठकों में परिचित ‘यहोवा’ नाम को नाम के रूप में सुरक्षित रखता है; ‘याहवे’ अधिक प्रत्यक्ष विद्वत् प्रतिलेखन है।
- issue: עִבְדוּ का अर्थ-क्षेत्र
  choice: सेवा करो
  alternative: आराधना करो
  rationale: क्रिया परमेश्वर के लिए धार्मिक सेवा अथवा आराधना का बोध करा सकती है। ‘सेवा करो’ इसकी व्यापकता बनाए रखता है और केवल उपासना-विधि तक अर्थ को सीमित नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी। फ़िरौन कर्ता मूल में पूर्वसंदर्भ से निहित है, पर स्वतंत्र पद की स्पष्टता के लिए उसका नाम व्यक्त किया गया है। आज्ञाओं की तीव्रता और हिब्रू के समावेशी ‘גם…גם’ को स्वाभाविक हिन्दी में बनाए रखा गया है।
