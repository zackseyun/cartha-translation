  text: כָּל עֲדַ֥ת יִשְׂרָאֵ֖ל יַעֲשׂ֥וּ אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/047.yaml
  text: All the congregation of Israel shall do it[a].
translation:
  language: hi
  text: इस्राएल की सारी मण्डली इसे करे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस्राएल का पूरा समुदाय इसका पालन करे।”
    reason: עֲדָה के लिए ‘समुदाय’ और עשה के संदर्भगत अर्थ के लिए ‘पालन करे’ सम्भव अर्थानुवाद हैं।
lexical_decisions:
- source_word: כָּל
  choice: सारी
  rationale: यह शब्द सम्पूर्णता व्यक्त करता है; स्त्रीलिंग संज्ञा ‘मण्डली’ के साथ ‘सारी’ स्वाभाविक और व्यापक अर्थ को सुरक्षित रखता है।
- source_word: עֲדַת
  choice: मण्डली
  rationale: עֵדָה यहाँ इस्राएल के सामुदायिक, वाचा-संबंधी समूह को दर्शाता है। ‘मण्डली’ उपासना-संबंधी संदर्भ में सहज है और केवल आकस्मिक भीड़ का अर्थ नहीं देता।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी बाइबलीय रूप रखा गया है।
- source_word: יַעֲשׂוּ
  choice: करे
  rationale: עשה का मूल अर्थ ‘करना’ है। विधिक निर्देश के संदर्भ में ‘करे’ आज्ञार्थक दायित्व को स्वाभाविक हिन्दी में व्यक्त करता है और ‘मनाए’ जैसे अधिक व्याख्यात्मक विकल्प को मुख्य पाठ में नहीं लाता।
- source_word: אֹתוֹ
  choice: इसे
  rationale: पुल्लिंग एकवचन कर्मवाचक सर्वनाम निकटवर्ती फसह-विधान की ओर संकेत करता है। ‘इसे’ उसके संदर्भ को अनावश्यक रूप से निश्चित किए बिना संकेतात्मक बल बनाए रखता है।
theological_decisions:
- issue: फसह की आज्ञा का सामूहिक कर्ता
  choice: ‘इस्राएल की सारी मण्डली’ को एक सामूहिक निकाय के रूप में संबोधित किया गया है।
  alternative: हर इस्राएली व्यक्ति अलग-अलग इसे करे।
  rationale: एकवचन सामूहिक संज्ञा עֲדָה और राष्ट्रीय नाम मिलकर पूरे वाचा-समुदाय को सामूहिक रूप से दर्शाते हैं; पाठ प्रत्येक व्यक्ति पर पृथक रूप से बल नहीं देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सहज विधिक शैली अपनाई गई है। ‘मण्डली’ सामुदायिक तथा उपासना-संबंधी संदर्भ बनाए रखता है; पादटिप्पणी अधिक सामान्य ‘समुदाय’ और संदर्भगत ‘पालन करे’ प्रस्तुत करती है।
