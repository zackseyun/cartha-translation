  text: וְ/עַתָּ֡ה אִם נָא֩ מָצָ֨אתִי חֵ֜ן בְּ/עֵינֶ֗י/ךָ הוֹדִעֵ֤/נִי נָא֙ אֶת דְּרָכֶ֔/ךָ וְ/אֵדָ֣עֲ/ךָ֔ לְמַ֥עַן אֶמְצָא חֵ֖ן בְּ/עֵינֶ֑י/ךָ וּ/רְאֵ֕ה כִּ֥י עַמְּ/ךָ֖ הַ/גּ֥וֹי הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/013.yaml
  text: Now therefore[a], if I have found favor in your eyes, please make your ways known to me, so that I may know you, in order that I may find favor in your eyes[c][b]. And consider that this nation is your people.
translation:
  language: hi
  text: अब इसलिए, यदि मैंने आपकी दृष्टि में कृपा पाई है, तो कृपया मुझे अपने मार्गों से परिचित कराइए, ताकि मैं आपको जानूँ और आपकी दृष्टि में कृपा पाऊँ। और देखिए कि यह राष्ट्र आपकी प्रजा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: अब इसलिए
  rationale: यह पद को पिछले कथन से जोड़ते हुए निष्कर्षात्मक आग्रह की ओर ले जाता है; ‘अब इसलिए’ काल और तर्क, दोनों को व्यक्त करता है।
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: मुझ पर आपकी कृपादृष्टि हुई है
  rationale: यह स्वाभाविक हिन्दी में स्वीकार और अनुग्रह का भाव रखता है तथा ‘अनुग्रह’ को अनावश्यक रूप से किसी विकसित धर्मवैज्ञानिक पारिभाषिक अर्थ में नहीं बाँधता।
- source_word: הוֹדִעֵנִי נָא אֶת־דְּרָכֶךָ
  choice: कृपया मुझे अपने मार्गों से परिचित कराइए
  rationale: הוֹדִיעַ का कारक अर्थ ‘ज्ञात कराना’ है और דְּרָכֶךָ यहाँ बहुवचन है। ‘मार्गों से परिचित कराइए’ परमेश्वर के आचरण और व्यवहार को जानने के अनुरोध को सहज हिन्दी में व्यक्त करता है।
- source_word: וְאֵדָעֲךָ
  choice: ताकि मैं आपको जानूँ
  rationale: वाक्य-संबंध को प्रयोजन के रूप में लिया गया है और व्यक्तिगत, संबंधपरक ‘जानने’ का भाव बनाए रखा गया है।
- source_word: לְמַעַן אֶמְצָא חֵן בְּעֵינֶיךָ
  choice: और मुझ पर आपकी कृपादृष्टि बनी रहे
  rationale: शाब्दिक रूप से यह ‘ताकि मैं आपकी दृष्टि में कृपा पाऊँ’ है। पहले ही कृपा पाने के उल्लेख के बाद हिन्दी में ‘बनी रहे’ अनुरोध के प्रगतिशील आशय को स्वाभाविक रूप देता है, यद्यपि इब्रानी क्रिया स्वयं ‘बनी रहे’ स्पष्टतः नहीं कहती।
- source_word: וּרְאֵה
  choice: इस बात पर ध्यान दीजिए
  rationale: ראה का शाब्दिक अर्थ ‘देखना’ है, पर यहाँ आज्ञार्थक प्रयोग शारीरिक दृष्टि से अधिक ध्यान देने या विचार करने का आग्रह है।
- source_word: כִּי עַמְּךָ הַגּוֹי הַזֶּה
  choice: कि यह जाति आपकी प्रजा है
  rationale: ‘जाति’ גּוֹי के राष्ट्रीय भाव और ‘प्रजा’ עַם के सामुदायिक तथा संबंधपरक भाव को अलग-अलग बनाए रखते हैं।
theological_decisions:
- issue: अंतिम उपवाक्य में राष्ट्रीय और वाचागत संबंध
  choice: यह जाति आपकी प्रजा है
  alternative: यह प्रजा आपकी प्रजा है
  rationale: इब्रानी में גּוֹי और עַם, दो अलग संज्ञाएँ हैं। दोनों को अलग हिन्दी शब्दों से देना मूसा की इस अपील को सुरक्षित रखता है कि इस राष्ट्र का परमेश्वर से विशेष संबंध है, बिना अतिरिक्त धर्मवैज्ञानिक निष्कर्ष जोड़े।
- issue: पहले से मिली कृपा और आगे कृपा पाने का संबंध
  choice: मुझ पर आपकी कृपादृष्टि बनी रहे
  alternative: ताकि मुझ पर आपकी कृपादृष्टि हो
  rationale: मूसा पहले कहता है कि उसे कृपा मिली है और फिर उसी कृपा को पाने का प्रयोजन बताता है। ‘बनी रहे’ हिन्दी में इस तनाव को निरंतर अनुग्रह की याचना के रूप में समझने योग्य बनाता है, जबकि फुटनोट अधिक शाब्दिक रूप बताता है।
translation_notes:
  register: आदरपूर्ण आधुनिक मानक हिन्दी में परमेश्वर के लिए ‘आप’ का प्रयोग किया गया है। शैली प्रार्थनापूर्ण और गरिमामय है, पर पुरातन या अत्यधिक संस्कृतनिष्ठ नहीं।
