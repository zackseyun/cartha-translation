source:
  edition: WLC
  text: וְ/רָאָ֤ה כָל הָ/עָם֙ אֶת עַמּ֣וּד הֶֽ/עָנָ֔ן עֹמֵ֖ד פֶּ֣תַח הָ/אֹ֑הֶל וְ/קָ֤ם כָּל הָ/עָם֙ וְ/הִֽשְׁתַּחֲוּ֔וּ אִ֖ישׁ פֶּ֥תַח אָהֳלֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/010.yaml
  text: When all the people saw the pillar of cloud standing at the entrance of the tent[a], all the people rose and worshiped, each man at the entrance of his tent.
translation:
  language: hi
  text: जब सब लोगों ने बादल के स्तम्भ को तम्बू के द्वार पर खड़ा देखा, तब सब लोग उठ खड़े हुए और हर एक ने अपने तम्बू के द्वार पर दण्डवत किया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “झुककर आराधना की” अथवा “भूमि पर मुँह के बल गिर पड़े”; इब्रानी क्रिया आदर में शरीर झुकाने की क्रिया बताती है और प्रायः आराधना के कार्य के रूप में प्रयुक्त होती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: जब ... देखा
  rationale: वाव के साथ आया क्रियारूप कथा को आगे बढ़ाता है और बाद की क्रियाओं की समयगत पृष्ठभूमि बनाता है; इसलिए स्वाभाविक हिन्दी में ‘जब ... देखा’ उपयुक्त है।
- source_word: כָל הָעָם
  choice: सब लोग
  rationale: यह समूचे समुदाय को सामूहिक रूप से दर्शाता है। ‘सब लोग’ सीधा और स्वाभाविक है तथा पद में अनुपस्थित ‘इस्राएली’ शब्द नहीं जोड़ता।
- source_word: עַמּוּד הֶעָנָן
  choice: बादल का स्तम्भ
  rationale: यह मूल की ठोस दृश्यात्मक छवि को बनाए रखने वाला स्पष्ट और प्रचलित धार्मिक-वर्णनात्मक पद है।
- source_word: עֹמֵד
  choice: खड़ा
  rationale: कृदन्त स्तम्भ की स्थिति बताता है; ‘खड़ा’ इसका सीधा और दृश्यात्मक हिन्दी समतुल्य है।
- source_word: פֶּתַח הָאֹהֶל
  choice: तम्बू के द्वार पर
  rationale: פֶּתַח खुलने की जगह या प्रवेश-द्वार को दर्शाता है। प्रसंग में यह मिलापवाले तम्बू की ओर संकेत करता है, पर इस पद में केवल ‘तम्बू’ है, इसलिए विस्तार नहीं जोड़ा गया।
- source_word: וְקָם
  choice: उठ खड़े हुए
  rationale: क्रिया लोगों के अपने स्थान से उठने को दर्शाती है। बहुवचन कर्ता के साथ ‘उठ खड़े हुए’ वर्तमान हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: וְהִשְׁתַּחֲוּוּ
  choice: दण्डवत किया
  rationale: यह क्रिया सम्मान या आराधना में शरीर झुकाने अथवा भूमि पर गिरने की क्रिया बताती है। ‘दण्डवत किया’ शारीरिक मुद्रा और धार्मिक आदर—दोनों को खुला रखता है; अन्य सम्भावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: אִישׁ
  choice: हर एक
  rationale: एकवचन पुल्लिंग रूप यहाँ वितरणात्मक अर्थ में समुदाय के प्रत्येक व्यक्ति को दर्शाता है। ‘हर एक’ उसी वितरणात्मक चित्र को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: פֶּתַח אָהֳלוֹ
  choice: अपने तम्बू के द्वार पर
  rationale: एकवचन अधिकारसूचक प्रत्यय के वितरणात्मक अर्थ को ‘अपने तम्बू’ स्वाभाविक रूप से व्यक्त करता है और प्रत्येक व्यक्ति को उसके तम्बू के द्वार पर दिखाता है।
theological_decisions:
- issue: दिव्य उपस्थिति के दृश्य चिह्न के प्रति लोगों की प्रतिक्रिया
  choice: दण्डवत किया
  alternative: आराधना की; झुक गए; भूमि पर मुँह के बल गिर पड़े
  rationale: इब्रानी क्रिया शारीरिक रूप से झुकने को प्रमुखता से व्यक्त करती है और इस प्रसंग में वह यहोवा की प्रकट उपस्थिति के प्रति आराधनापूर्ण आदर है। ‘दण्डवत किया’ किसी एक पक्ष को हटाए बिना शारीरिक क्रिया और धार्मिक भाव दोनों को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘स्तम्भ’, ‘तम्बू’ और ‘दण्डवत’ जैसे शब्द सामान्य पाठक के लिए बोधगम्य रहते हुए मूल की दृश्यात्मकता और धार्मिक प्रसंग को सुरक्षित रखते हैं।
