base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/023.yaml
  text: Then I will remove my hand[a], and you will see my back, but my face shall not be seen.
translation:
  language: hi
  text: तब मैं अपना हाथ हटा लूँगा, और तू मेरी पीठ[a] देखेगा; पर मेरा मुख दिखाई नहीं देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे पीछे का भाग।” इब्रानी शब्द पीठ अथवा पीछे की ओर के भाग को दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲסִרֹתִי
  choice: तब मैं ... हटा लूँगा
  rationale: सूर धातु के हिफ़ील रूप का अर्थ ‘हटाना/वापस खींचना’ है। आरंभिक वाव पिछले वाक्य की क्रमिकता को आगे बढ़ाता है, इसलिए ‘तब’ स्वाभाविक है।
- source_word: כַּפִּי
  choice: अपना हाथ
  rationale: כַּף का शाब्दिक अर्थ ‘हथेली’ भी हो सकता है, पर पिछले पद की ढकने वाली छवि में आधुनिक हिन्दी में ‘हाथ’ अधिक स्वाभाविक है और मानवरूपी बिंब को बनाए रखता है।
- source_word: וְרָאִיתָ
  choice: और तू ... देखेगा
  rationale: भावी संदर्भ में वाव-संलग्न पूर्ण क्रिया क्रमिक परिणाम व्यक्त करती है। एकवचन संबोधन को ‘तू’ से स्पष्ट रखा गया है।
- source_word: אֲחֹרָי
  choice: मेरी पीठ
  rationale: यह शब्द पीछे, पिछला भाग या पीठ दर्शा सकता है। ‘मेरी पीठ’ संक्षिप्त, ठोस और स्वाभाविक है; व्यापक शब्दार्थ को पादटिप्पणी में रखा गया है।
- source_word: וּפָנַי
  choice: पर मेरा मुख
  rationale: वाव यहाँ पिछले कथन के विपरीत बात प्रस्तुत करता है, इसलिए ‘पर’ उपयुक्त है। פָּנִים का ठोस बिंब ‘मुख’ से सुरक्षित रहता है।
- source_word: לֹא יֵרָאוּ
  choice: दिखाई नहीं देगा
  rationale: ראה का निफ़ाल रूप निष्क्रिय अर्थ ‘देखा जाना/दिखाई देना’ रखता है। हिन्दी में ‘मेरा मुख दिखाई नहीं देगा’ स्वाभाविक ढंग से इसी निष्क्रिय भाव को व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के लिए मानवरूपी भाषा
  choice: ‘हाथ,’ ‘पीठ’ और ‘मुख’ जैसे ठोस शब्द बनाए रखे गए हैं।
  alternative: इनके स्थान पर ‘उपस्थिति,’ ‘महिमा की झलक’ या अन्य अमूर्त भाषा देना।
  rationale: इब्रानी पाठ स्वयं मानवरूपी बिंबों का प्रयोग करता है। अनुवाद इनका आध्यात्मिकीकरण करके पाठ में निहित ईश्वरीय आत्म-प्रकाशन के तनाव को नहीं मिटाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली अपनाई गई है। परमेश्वर द्वारा मूसा को किए गए एकवचन संबोधन के लिए ‘तू’ रखा गया है। अर्धविराम अनुमति और निषेध के बीच स्पष्ट विरोध दिखाता है।
