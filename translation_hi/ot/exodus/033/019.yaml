source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר אֲנִ֨י אַעֲבִ֤יר כָּל טוּבִ/י֙ עַל פָּנֶ֔י/ךָ וְ/קָרָ֧אתִֽי בְ/שֵׁ֛ם יְהוָ֖ה לְ/פָנֶ֑י/ךָ וְ/חַנֹּתִי֙ אֶת אֲשֶׁ֣ר אָחֹ֔ן וְ/רִחַמְתִּ֖י אֶת אֲשֶׁ֥ר אֲרַחֵֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/019.yaml
  text: And he said[a], “I myself will make all my goodness pass before you, and I will proclaim the name of Yahweh before you. And I will be gracious to whom I will be gracious, and I will show mercy to whom I will show mercy.”
translation:
  language: hi
  text: तब उसने कहा, “मैं स्वयं अपनी सारी भलाई तेरे सामने से गुज़ारूँगा और तेरे सामने यहोवा के नाम की घोषणा करूँगा। मैं जिस पर अनुग्रह करूँगा, उस पर अनुग्रह करूँगा; और जिस पर दया करूँगा, उस पर दया करूँगा।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिस पर करुणा करूँगा, उस पर करुणा करूँगा।”
    reason: רחם के लिए ‘दया’ और ‘करुणा’ दोनों प्रसंगानुकूल अर्थ संभव हैं।
lexical_decisions:
- source_word: אַעֲבִיר
  choice: गुज़ारूँगा
  rationale: 'हिफ़ील रूप का कारणवाचक अर्थ व्यक्त करता है: परमेश्वर अपनी भलाई को मूसा के सामने से गुज़ारेगा।'
- source_word: כָּל טוּבִי
  choice: अपनी सारी भलाई
  rationale: טוּב यहाँ परमेश्वर की हितकारी भलाई और चरित्र को दर्शाता है; इसे केवल सौंदर्य या वरदानों तक सीमित नहीं किया गया।
- source_word: עַל־פָּנֶיךָ
  choice: तेरे सामने से
  rationale: स्थानगत भाव और गति, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְקָרָאתִי בְשֵׁם יְהוָה
  choice: यहोवा के नाम की घोषणा करूँगा
  rationale: संदर्भ में קרא בשם आह्वान नहीं, बल्कि परमेश्वर के नाम और चरित्र की उद्घोषणा है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी व्यक्तिगत नाम יהוה को उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण द्वारा रखा गया है।
- source_word: לְפָנֶיךָ
  choice: तेरे सामने
  rationale: मूसा की उपस्थिति में होने का ठोस स्थानगत अर्थ और मूल की पुनरावृत्ति बनाए रखता है।
- source_word: וְחַנֹּתִי אֶת אֲשֶׁר אָחֹן
  choice: मैं जिस पर अनुग्रह करना चाहूँगा, उस पर अनुग्रह करूँगा
  rationale: एक ही धातु की बलपूर्ण पुनरावृत्ति सुरक्षित है; हिन्दी में ‘चाहूँगा’ स्वेच्छा का भाव स्वाभाविक बनाता है, बिना किसी बाद की धर्मवैज्ञानिक व्यवस्था को आरोपित किए।
- source_word: וְרִחַמְתִּי אֶת אֲשֶׁר אֲרַחֵם
  choice: जिस पर दया करना चाहूँगा, उस पर दया करूँगा
  rationale: רחם का दया/करुणा संबंधी अर्थ और मूल की बलपूर्ण पुनरावृत्ति बनाए रखी गई है।
- source_word: אֲנִי
  choice: मैं स्वयं
  rationale: स्पष्ट सर्वनाम का अतिरिक्त बल व्यक्त करता है, पर ‘मैं ही’ जैसी अनावश्यक विशिष्टता नहीं जोड़ता।
theological_decisions:
- issue: अनुग्रह और दया संबंधी परमेश्वर की आत्म-घोषणा
  choice: पहले पुरुष में दोहराए गए कथनों को यथावत बल के साथ रखा गया है।
  alternative: इसे परमेश्वर की कृपा के सामान्य सिद्धांत के रूप में समझाकर कहना, या बाद की नियतिवादी धर्मवैज्ञानिक भाषा जोड़ना।
  rationale: इब्रानी पाठ अनुग्रह और दया करने में परमेश्वर की स्वतंत्रता को दोहराव द्वारा व्यक्त करता है। अनुवाद इस तनाव को सुरक्षित रखता है और बाद के धर्मवैज्ञानिक विवादों का निर्णय पाठ में नहीं जोड़ता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। परमेश्वर द्वारा मूसा को सीधे संबोधन के कारण ‘तेरे’ रखा गया है। समानांतर वाक्यरचना और मूल की पुनरावृत्ति को सुनाई देने योग्य रूप में सुरक्षित रखा गया है।
