base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/007.yaml
  text: Moses would take the tent and pitch it for himself outside the camp[a], far from the camp, and he called it the tent of meeting[b]. And everyone seeking Yahweh would go out to the tent of meeting that was outside the camp.
translation:
  language: hi
  text: मूसा उस तंबू[a] को लेकर छावनी के बाहर, छावनी से बहुत दूर, अपने लिए लगाया करता था। उसने उसका नाम “मिलने का तंबू” रखा। जो कोई याहवे की खोज करता, वह छावनी से निकलकर छावनी के बाहर स्थित मिलने के तंबू तक जाता था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में “उस तंबू” है। पाठ स्पष्ट रूप से “मूसा का तंबू” नहीं कहता; कुछ लोग इसे मूसा का अपना तंबू या इसी उद्देश्य के लिए इस्तेमाल किया गया कोई अलग तंबू समझते हैं।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी क्रिया-रूप यहाँ संभवतः प्रचलित या बार-बार होने वाली क्रिया बताते हैं; अर्थात मूसा ऐसा किया करता था और याहवे की खोज करने वाले वहाँ जाया करते थे।
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקַּח
  choice: लेकर ... लगाया करता था
  rationale: कथात्मक संदर्भ में यह yiqtol रूप प्रायः बार-बार होने वाली या प्रचलित क्रिया बताता है; इसलिए साधारण भूतकाल के बजाय अभ्यस्त क्रिया का हिंदी रूप चुना गया है।
- source_word: הָאֹהֶל
  choice: उस तंबू
  rationale: इब्रानी में निश्चित उपपद के साथ ‘वह/उस तंबू’ है। मूल पाठ इसे स्पष्ट रूप से ‘उसका तंबू’ नहीं कहता, इसलिए तंबू की ठीक पहचान खुली रखी गई है।
- source_word: וְנָטָה לוֹ
  choice: अपने लिए लगाया करता था
  rationale: तंबू के संदर्भ में נטה का अर्थ तंबू लगाना है; לוֹ को ‘अपने लिए’ द्वारा बनाए रखा गया है।
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: छावनी के बाहर
  rationale: यह तंबू की स्थिति को इस्राएली छावनी के बाहर बताता है।
- source_word: הַרְחֵק מִן הַמַּחֲנֶה
  choice: छावनी से बहुत दूर
  rationale: यह पद पहले कही गई बाहरी स्थिति पर बल देते हुए छावनी से पर्याप्त दूरी व्यक्त करता है।
- source_word: וְקָרָא לוֹ אֹהֶל מוֹעֵד
  choice: उसने उसका नाम ‘मिलने का तंबू’ रखा
  rationale: קרא לוֹ यहाँ नाम रखने का भाव देता है। वाक्य को स्वाभाविक हिंदी में अलग वाक्य बनाया गया है।
- source_word: אֹהֶל מוֹעֵד
  choice: मिलने का तंबू
  rationale: מוֹעֵד नियत भेंट या मिलने के स्थान का बोध करा सकता है। ‘मिलने का तंबू’ आधुनिक पाठक के लिए स्पष्ट है और ऐसे धार्मिक अर्थ को नहीं जोड़ता जो पद में प्रत्यक्ष नहीं है।
- source_word: כָּל מְבַקֵּשׁ יְהוָה
  choice: जो कोई याहवे की खोज करता
  rationale: מבקש में परमेश्वर को खोजने और उससे मार्गदर्शन चाहने, दोनों की व्यापकता हो सकती है; ‘खोज करता’ इस विस्तार को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले व्यक्तिगत दिव्य नाम का हिंदी लिप्यंतरण किया गया है, उसे किसी उपाधि से नहीं बदला गया।
- source_word: יֵצֵא
  choice: जाता था
  rationale: यह रूप भी संदर्भ में प्रचलित या बार-बार होने वाली क्रिया दर्शाता है; छावनी से बाहर जाने का भाव पहले से स्पष्ट होने के कारण स्वाभाविक हिंदी में ‘पास जाता था’ कहा गया है।
- source_word: אֲשֶׁר מִחוּץ לַמַּחֲנֶה
  choice: छावनी के बाहर के
  rationale: यह संबंधवाचक खंड मिलने के तंबू की स्थिति बताता है और संक्षिप्त, स्वाभाविक हिंदी विशेषण-रचना में प्रस्तुत किया गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में व्यक्तिगत वाचा-नाम प्रत्यक्ष रूप से आया है। ‘याहवे’ उसका निकट हिंदी लिप्यंतरण है और नाम को उपाधि में नहीं बदलता।
- issue: אֹהֶל מוֹעֵד की धार्मिक शब्दावली
  choice: मिलने का तंबू
  alternative: मिलापवाला तंबू; भेंट का तंबू
  rationale: ‘मिलने का तंबू’ नियत भेंट-स्थान का मूल भाव सीधे व्यक्त करता है और ‘मिलाप’ से उत्पन्न हो सकने वाले प्रायश्चित या मेल-मिलाप के अतिरिक्त अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘तंबू’ की प्रचलित आधुनिक वर्तनी अपनाई गई है। अभ्यस्त क्रिया के लिए ‘लगाया करता था’ और ‘जाता था’ का प्रयोग हुआ है; मूल की अस्पष्टताओं को पादटिप्पणियों में सुरक्षित रखा गया है।
