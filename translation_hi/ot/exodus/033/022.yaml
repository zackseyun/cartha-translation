base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/022.yaml
  text: And when my glory passes by[a], I will put you in a cleft of the rock, and I will cover you with my hand until I have passed by.
translation:
  language: hi
  text: और जब मेरी महिमा पास से गुज़रेगी, तब मैं तुझे चट्टान की एक दरार में रखूँगा और जब तक मैं पास से न गुज़र जाऊँ, तब तक अपने हाथ से तुझे ढके रहूँगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה בַּעֲבֹר
  choice: और जब ... पास से गुज़रेगी
  rationale: וְהָיָה के साथ ב और धातु עבר का infinitive construct अगले कार्य की समयगत परिस्थिति बताता है। हिन्दी में ‘और जब ... पास से गुज़रेगी’ इसका स्वाभाविक रूप है।
- source_word: כְּבֹדִי
  choice: मेरी महिमा
  rationale: ईश-दर्शन के इस प्रसंग में כָּבוֹד परमेश्वर की प्रकट महिमा को दर्शाता है; ‘महिमा’ अर्थ और धार्मिक प्रतिध्वनि दोनों को सुरक्षित रखती है।
- source_word: וְשַׂמְתִּיךָ
  choice: मैं तुझे ... रखूँगा
  rationale: שׂים का मूल अर्थ रखना या स्थापित करना है। यहाँ ‘रखूँगा’ सीधा और स्वाभाविक है।
- source_word: בְּנִקְרַת הַצּוּר
  choice: चट्टान की एक दरार में
  rationale: נִקְרָה चट्टान की दरार या खोह को दर्शाता है। Construct phrase में הַצּוּר निश्चित है, पर हिन्दी में ‘चट्टान की एक दरार’ सहज है और किसी एक दरार का भाव देता है।
- source_word: וְשַׂכֹּתִי כַפִּי עָלֶיךָ
  choice: अपने हाथ से तुझे ढके रहूँगा
  rationale: סכך ढकने या आड़ देने का भाव रखता है, और כַּף का यहाँ स्वाभाविक हिन्दी रूप ‘हाथ’ है। ‘ढके रहूँगा’ उस सुरक्षा की जारी अवधि को भी व्यक्त करता है।
- source_word: עַד עָבְרִי
  choice: जब तक मैं पास से न गुज़र जाऊँ
  rationale: עַד के साथ प्रथम-पुरुष प्रत्यययुक्त infinitive construct ढकने की क्रिया की अंतिम सीमा बताता है। यह हिन्दी संरचना उस क्रम और पूर्णता को स्पष्ट करती है।
theological_decisions:
- issue: परमेश्वर के लिए मानवरूपी भाषा—‘मेरा हाथ’
  choice: ‘अपने हाथ से’ की ठोस छवि बनाए रखी गई।
  alternative: ‘अपनी सुरक्षा में’ या ‘अपनी शक्ति से’
  rationale: इब्रानी पाठ प्रत्यक्ष शारीरिक रूपक का प्रयोग करता है। इसे अमूर्त व्याख्या में बदलना पाठ की कथात्मक छवि को अनावश्यक रूप से हल कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली। परमेश्वर द्वारा मूसा को एकवचन संबोधन के लिए ‘तुझे’ रखा गया है, जो निकट और प्रत्यक्ष संवाद के अनुकूल है। ‘पास से गुज़रना’ עבר की गतिशील छवि बनाए रखता है। अंग्रेज़ी में article-संबंधी जिस विकल्प पर पादटिप्पणी थी, हिन्दी की ‘एक दरार’ संरचना में अर्थ स्वाभाविक रूप से स्पष्ट होने के कारण पादटिप्पणी आवश्यक नहीं मानी गई।
