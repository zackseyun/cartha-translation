base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/011.yaml
  text: And Yahweh would speak to Moses face to face[a], as a man speaks to his friend. Then he would return to the camp, but his attendant Joshua son of Nun, a young man[b], would not depart from the midst of the tent.
translation:
  language: hi
  text: याहवे मूसा से आमने-सामने[a] बात किया करता था, जैसे कोई मनुष्य अपने मित्र से बात करता है। फिर मूसा छावनी में लौट आता था, पर उसका सहायक, नून का पुत्र यहोशू, एक युवक, तंबू के भीतर से नहीं निकलता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सीधे” अथवा “व्यक्तिगत रूप से।” इब्रानी मुहावरा “आमने-सामने” असाधारण रूप से प्रत्यक्ष भेंट और संवाद को व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדִבֶּר
  choice: बात किया करता था
  rationale: पिएल रूप यहाँ मिलापवाले तंबू से जुड़े बार-बार होने वाले सामान्य कार्य को व्यक्त करता है; हिन्दी का ‘किया करता था’ इस आदतन भाव को स्वाभाविक रूप से प्रकट करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में उसके प्रचलित निकट लिप्यंतरण के रूप में रखा गया है।
- source_word: פָּנִים אֶל פָּנִים
  choice: आमने-सामने
  rationale: यह स्वाभाविक हिन्दी मुहावरा इब्रानी की प्रत्यक्ष और व्यक्तिगत भेंट की अभिव्यक्ति को बनाए रखता है, बिना इसे अनिवार्यतः शाब्दिक दृश्य-दर्शन मान लेने के।
- source_word: כַּאֲשֶׁר יְדַבֵּר אִישׁ אֶל רֵעֵהוּ
  choice: जैसे कोई मनुष्य अपने मित्र से बात करता है
  rationale: אִישׁ और רֵעַ के अर्थ को सुरक्षित रखते हुए वर्तमान हिन्दी में तुलना को स्पष्ट और सहज बनाया गया है।
- source_word: וְשָׁב
  choice: फिर मूसा ... लौट आता था
  rationale: संदर्भ के आदतन वर्णन को जारी रखा गया है। कर्ता ‘मूसा’ को दोहराने से हिन्दी में सर्वनाम-संदेह दूर होता है।
- source_word: וּמְשָׁרְתוֹ
  choice: उसका सहायक
  rationale: यह शब्द सेवा और साथ रहकर सहायता करने की भूमिका बताता है; ‘सहायक’ आधुनिक हिन्दी में स्पष्ट है और घरेलू दासता का अनावश्यक संकेत नहीं देता।
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: नून का पुत्र यहोशू
  rationale: व्यक्तिगत नामों का हिन्दी बाइबलीय रूप रखा गया और patronymic को स्वाभाविक हिन्दी क्रम में व्यक्त किया गया है।
- source_word: נַעַר
  choice: जो एक जवान था
  rationale: यहाँ शब्द यहोशू की तुलनात्मक युवावस्था बताता है; ‘जवान’ सामान्य आधुनिक हिन्दी में स्वाभाविक है और पहले से व्यक्त सहायक की भूमिका को अनावश्यक रूप से नहीं दोहराता।
- source_word: לֹא יָמִישׁ
  choice: बाहर नहीं जाता था
  rationale: मूल क्रिया अलग न होने या न हटने का भाव रखती है। तंबू के भीतर से न जाने के संदर्भ में यह हिन्दी में सहज है और आदतन क्रिया को बनाए रखता है।
- source_word: מִתּוֹךְ הָאֹהֶל
  choice: तंबू के भीतर से
  rationale: מִתּוֹךְ के अंदरूनी स्थान से बाहर आने के भाव को स्पष्ट तथा स्वाभाविक हिन्दी में व्यक्त किया गया है; संदर्भ में यह मिलापवाला तंबू है।
theological_decisions:
- issue: याहवे का मूसा से ‘आमने-सामने’ बात करना
  choice: मुख्य पाठ में ‘आमने-सामने’ मुहावरा बनाए रखा गया
  alternative: ‘सीधे’ या ‘व्यक्तिगत रूप से’
  rationale: इब्रानी पाठ की प्रत्यक्षता और निकटता को सुरक्षित रखा गया है। यह अनुवाद शाब्दिक दृश्य-दर्शन के प्रश्न को स्वयं हल नहीं करता और अन्य संबंधित पदों के साथ उपस्थित धर्मवैज्ञानिक तनाव को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। आदतन क्रियाओं के लिए ‘किया करता था’, ‘लौट आता था’ और ‘नहीं जाता था’ का प्रयोग हुआ है। अंग्रेज़ी परत में दूसरी पादटिप्पणी का संकेत स्थान-विषय से मेल नहीं खाता था; मूल पाठ और संदर्भ के आधार पर ‘तंबू’ को मुख्य पाठ में स्पष्ट रखा गया है और कोई असंबद्ध [b] चिह्न नहीं जोड़ा गया।
