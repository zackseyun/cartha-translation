source:
  edition: WLC
  text: אֶל אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָ֑שׁ כִּי֩ לֹ֨א אֶֽעֱלֶ֜ה בְּ/קִרְבְּ/ךָ֗ כִּ֤י עַם קְשֵׁה עֹ֨רֶף֙ אַ֔תָּה פֶּן אֲכֶלְ/ךָ֖ בַּ/דָּֽרֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/003.yaml
  text: to a land flowing with milk and honey[a]. For I will not go up in your midst, because you are a stiff-necked people[b], lest I consume you on the way.
translation:
  language: hi
  text: उस देश को, जहाँ दूध और मधु बहते हैं। क्योंकि मैं तुम्हारे बीच में नहीं जाऊँगा, क्योंकि तुम हठी लोग हो; कहीं ऐसा न हो कि मैं मार्ग में तुम्हें नष्ट कर डालूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶל אֶרֶץ
  choice: उस देश में
  rationale: संदर्भ में यह पहले से पहचाना हुआ प्रतिज्ञात देश है; ‘उस देश में’ हिन्दी में गंतव्य को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: זָבַת חָלָב וּדְבָשׁ
  choice: जहाँ दूध और मधु की धाराएँ बहती हैं
  rationale: यह देश की भरपूरी बताने वाला रूपक है। ‘धाराएँ’ हिन्दी में रूपक को स्पष्ट और प्रचलित बनाता है, बिना उसे सपाट अर्थ में बदलने के।
- source_word: כִּי לֹא אֶעֱלֶה
  choice: क्योंकि मैं ... नहीं जाऊँगा
  rationale: पहला כִּי पूर्व कथन का कारण बताता है। हिन्दी में केवल ‘जाऊँगा’ यात्रा के भाव को स्वाभाविक रखता है; ‘ऊपर जाऊँगा’ इस संदर्भ में असहज और अनावश्यक रूप से भौगोलिक सुनाई देता।
- source_word: בְּקִרְבְּךָ
  choice: तुम्हारे बीच
  rationale: यह परमेश्वर की उपस्थिति को लोगों के मध्य होने के रूप में व्यक्त करता है; सामूहिक एकवचन को आधुनिक हिन्दी में सम्मानसूचक/बहुवचन ‘तुम्हारे’ से व्यक्त किया गया है।
- source_word: עַם קְשֵׁה עֹרֶף
  choice: हठीले लोग
  rationale: इब्रानी मुहावरे का आशय अड़ियल और न मानने वाले लोगों से है। मुख्य पाठ में स्वाभाविक हिन्दी रखी गई है और शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: פֶּן
  choice: कहीं ऐसा न हो कि
  rationale: यह आशंकित परिणाम को आधुनिक और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: אֲכֶלְךָ
  choice: तुम्हें मिटा डालूँ
  rationale: Piel रूप यहाँ पूरी तरह समाप्त कर देने या नष्ट कर देने का अर्थ देता है। यह चयन निर्णय की तीव्रता को बनाए रखता है और किसी विशिष्ट विधि को नहीं जोड़ता।
- source_word: בַּדָּרֶךְ
  choice: मार्ग में ही
  rationale: यात्रा के दौरान होने वाले संभावित परिणाम को संक्षिप्त, गरिमापूर्ण हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर की उपस्थिति का कथन
  choice: मैं तुम्हारे बीच होकर नहीं जाऊँगा
  alternative: मैं तुम्हारे साथ नहीं जाऊँगा
  rationale: ‘बीच’ लोगों के मध्य परमेश्वर की पवित्र उपस्थिति और उसके कारण उत्पन्न संकट को बनाए रखता है; केवल ‘साथ’ कहने से यह तनाव कुछ हल्का पड़ सकता है।
- issue: קְשֵׁה עֹרֶף का रूपक
  choice: हठीले लोग
  alternative: कठोर गर्दन वाले लोग
  rationale: मुख्य पाठ में अर्थ-स्पष्ट आधुनिक हिन्दी चुनी गई है, जबकि मूल रूपक को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: अֲכֶלְךָ में न्याय की तीव्रता
  choice: तुम्हें मिटा डालूँ
  alternative: तुम्हें भस्म कर दूँ
  rationale: इब्रानी क्रिया पूर्ण विनाश या अंत कर देने को व्यक्त कर सकती है, पर आग या किसी खास विधि को अनिवार्य नहीं करती। ‘मिटा डालूँ’ तीव्रता को बनाए रखते हुए अनावश्यक चित्र नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य पाठक के लिए सहज शैली अपनाई गई है। पद पिछले वाक्य से जुड़ा अंश है, इसलिए आरम्भ ‘उस देश में’ से रखा गया है। सामूहिक इब्रानी एकवचन को हिन्दी में स्वाभाविक बहुवचन ‘तुम’ से व्यक्त किया गया है।
