  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה גַּ֣ם אֶת הַ/דָּבָ֥ר הַ/זֶּ֛ה אֲשֶׁ֥ר דִּבַּ֖רְתָּ אֶֽעֱשֶׂ֑ה כִּֽי מָצָ֤אתָ חֵן֙ בְּ/עֵינַ֔/י וָ/אֵדָעֲ/ךָ֖ בְּ/שֵֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/017.yaml
  text: And Yahweh said to Moses[a], “I will also do this thing that you have spoken, because you have found favor in my eyes[b], and I know you by name.”
translation:
  language: hi
  text: याहवे ने मूसा से कहा, “तुमने जो यह बात[a] कही है, उसे भी मैं करूँगा, क्योंकि तुमने मेरी दृष्टि में कृपा पाई है[b], और मैं तुम्हें नाम से जानता हूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यह मामला” अथवा “यह वचन”।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “तुमने मेरी आँखों में कृपा पाई है”; यह अनुकूल स्वीकृति मिलने का इब्रानी मुहावरा है।
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी परमेश्वर-नाम का निकट देवनागरी लिप्यंतरण है; इसे किसी उपाधि से बदलने के बजाय मूल पाठ में उपस्थित विशिष्ट नाम को बनाए रखा गया है।
- source_word: גַּם
  choice: भी
  rationale: यह पिछले अनुरोध के साथ इस अनुरोध को जोड़ता है और इसके योगात्मक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַדָּבָר הַזֶּה
  choice: यह बात
  rationale: דָּבָר का अर्थ ‘बात,’ ‘वचन,’ ‘मामला’ या ‘वस्तु’ हो सकता है। यहाँ यह मूसा द्वारा अभी कही गई विनती को दर्शाता है, इसलिए ‘यह बात’ व्यापक और स्वाभाविक है।
- source_word: אֲשֶׁר דִּבַּרְתָּ
  choice: जो तुमने कही है
  rationale: मूसा के कथन से स्पष्ट शाब्दिक संबंध बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक पूर्णता व्यक्त करता है।
- source_word: אֶעֱשֶׂה
  choice: मैं करूँगा
  rationale: עשה के सामान्य अर्थ और उस विनती को पूरा करने की प्रतिज्ञा, दोनों को सीधी और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מָצָאתָ חֵן בְּעֵינַי
  choice: तुमने मेरी दृष्टि में अनुग्रह पाया है
  rationale: मूल इब्रानी मुहावरे की दृष्टि-संबंधी छवि और חֵן के कृपापूर्ण स्वीकार, दोनों को बनाए रखता है।
- source_word: וָאֵדָעֲךָ
  choice: और मैं तुम्हें जानता हूँ
  rationale: यहाँ ידע केवल तथ्यगत जानकारी नहीं, बल्कि परमेश्वर की व्यक्तिगत पहचान और संबंधपरक ज्ञान व्यक्त करता है।
- source_word: בְּשֵׁם
  choice: नाम से
  rationale: मूल वाक्यांश की संक्षिप्तता बनाए रखते हुए विशिष्ट और व्यक्तिगत पहचान का भाव व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला विशिष्ट परमेश्वर-नाम सीधे आया है। ‘याहवे’ उसे उपाधि से बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और वाचनीय रखी गई है। ‘अनुग्रह’ बाइबलीय संदर्भ में परिचित है, जबकि पादटिप्पणी मूल इब्रानी मुहावरे की शाब्दिक छवि स्पष्ट करती है।
