  text: וּ/בַ/מֶּ֣ה יִוָּדַ֣ע אֵפ֗וֹא כִּֽי מָצָ֨אתִי חֵ֤ן בְּ/עֵינֶ֨י/ךָ֙ אֲנִ֣י וְ/עַמֶּ֔/ךָ הֲ/ל֖וֹא בְּ/לֶכְתְּ/ךָ֣ עִמָּ֑/נוּ וְ/נִפְלֵ֨ינוּ֙ אֲנִ֣י וְ/עַמְּ/ךָ֔ מִ/כָּ֨ל הָ/עָ֔ם אֲשֶׁ֖ר עַל פְּנֵ֥י הָ/אֲדָמָֽה׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/016.yaml
  text: For how then will it be known that I have found favor in your sight[a], I and your people? Is it not by your going with us, so that I and your people are distinguished from every people who are on the face of the earth?
translation:
  language: hi
  text: फिर यह कैसे जाना जाएगा कि मुझ पर और आपकी प्रजा पर आपकी दृष्टि में अनुग्रह है? क्या यह आपके हमारे साथ चलने से नहीं होगा, जिससे मैं और आपकी प्रजा पृथ्वी पर के सभी लोगों से अलग पहचाने जाएँ[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “विशेष ठहरें” अथवा “दूसरों से भिन्न पहचाने जाएँ।” हिब्रू क्रिया किसी को असाधारण या अलग चिन्हित किए जाने का भाव दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַמֶּה ... אֵפוֹא
  choice: फिर यह कैसे
  rationale: संयोजक और प्रश्नवाचक पद के साथ אֵפוֹא के निष्कर्षात्मक बल को स्वाभाविक हिन्दी में व्यक्त करता है; प्रश्न यह है कि परमेश्वर की कृपा किस साधन से प्रकट होगी।
- source_word: יִוָּדַע
  choice: जाना जाएगा
  rationale: ידע के निफ़ाल रूप का कर्मवाच्य अर्थ सुरक्षित रहता है।
- source_word: כִּי מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: कि आपकी कृपादृष्टि मुझ पर हुई है
  rationale: हिब्रू मुहावरे का आधुनिक, गरिमापूर्ण हिन्दी रूप; यह अनुग्रहपूर्ण स्वीकृति को व्यक्त करता है, केवल देखने की शाब्दिक क्रिया को नहीं।
- source_word: אֲנִי וְעַמֶּךָ
  choice: मुझ पर और आपकी प्रजा पर / मैं और आपकी प्रजा
  rationale: मूसा और प्रजा की स्पष्ट जोड़ी को दोनों स्थानों पर बनाए रखा गया है। पहले स्थान पर हिन्दी कारक-रचना के अनुसार रूप बदला गया है।
- source_word: הֲלוֹא בְּלֶכְתְּךָ עִמָּנוּ
  choice: क्या इसी से नहीं कि आप हमारे साथ चलें
  rationale: הֲלוֹא की सहमति की अपेक्षा रखने वाली आलंकारिक प्रश्नवाचकता और בְּ के साधनसूचक भाव, दोनों सुरक्षित हैं।
- source_word: וְנִפְלֵינוּ
  choice: और इस प्रकार ... अलग ठहरें
  rationale: פלא के निफ़ाल रूप का यहाँ दूसरों से विशिष्ट या अलग पहचाने जाने का भाव है। ‘इस प्रकार’ परमेश्वर के साथ चलने और प्रजा की विशिष्टता के बीच परिणाम-संबंध स्पष्ट करता है।
- source_word: מִכָּל הָעָם
  choice: सब लोगों से
  rationale: एकवचन सामूहिक עָם को सन्दर्भानुसार वितरणात्मक बहुवचन में व्यक्त किया गया है, जिससे पृथ्वी के विभिन्न जनसमूहों का आशय स्पष्ट होता है।
- source_word: אֲשֶׁר עַל פְּנֵי הָאֲדָמָה
  choice: पृथ्वी भर के
  rationale: हिब्रू के व्यापक भौगोलिक मुहावरे को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: इस्राएल की विशिष्टता का आधार
  choice: परमेश्वर का अपने लोगों के साथ चलना ही उन्हें अन्य सब लोगों से अलग पहचान देता है।
  alternative: व्यवस्था, देश या जातीय पहचान को यहाँ उनकी विशिष्टता का मुख्य आधार मानना।
  rationale: पद स्वयं लोगों के अलग ठहरने को परमेश्वर की उपस्थिति से जोड़ता है; अनुवाद इसी संबंध को रखता है और आगे का कोई सांप्रदायिक निष्कर्ष नहीं जोड़ता।
- issue: מָצָאתִי के एकवचन और ‘मैं और आपकी प्रजा’ के बीच तनाव
  choice: ‘मुझ पर हुई है—मुझ पर और आपकी प्रजा पर’ द्वारा मूसा के एकवचन कथन और उसके बाद की विस्तृत जोड़ी, दोनों को बनाए रखना।
  alternative: पूरे वाक्य को सीधे बहुवचन बनाकर ‘हम पर आपकी कृपादृष्टि हुई है’ कहना।
  rationale: बहुवचन अधिक सहज होता, पर उससे मूल पाठ का एकवचन और उसके बाद आने वाला स्पष्ट विस्तार मिट जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज प्रश्नात्मक प्रवाह रखा गया है। आदरसूचक ‘आप/आपकी’ का प्रयोग परमेश्वर के संबोधन में किया गया है। दीर्घ हिब्रू वाक्य को एक ही आलंकारिक प्रश्न-क्रम में रखा गया है, जबकि डैश मूल के ‘मैं और आपकी प्रजा’ वाले पुनरुक्त विस्तार को स्पष्ट बनाता है।
