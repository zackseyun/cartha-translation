base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/008.yaml
  text: And whenever Moses went out to the tent[a], all the people would rise and stand, each man at the entrance of his tent[b], and they would watch after Moses until he entered the tent.
translation:
  language: hi
  text: जब-जब मूसा उस तम्बू[a] की ओर निकलता, तब सब लोग उठकर अपने-अपने तम्बू[b] के द्वार पर खड़े हो जाते और मूसा को तब तक जाते हुए देखते रहते, जब तक वह तम्बू में प्रवेश न कर जाता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तम्बू”; आसपास के प्रसंग में यह मिलापवाले तम्बू की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “हर पुरुष अपने तम्बू के द्वार पर”; इब्रानी का पुल्लिंग एकवचन यहाँ लोगों में से प्रत्येक के लिए वितरणात्मक रूप से प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: जब-जब ... तब
  rationale: यहाँ वाव के साथ היה का पूर्ण रूप कथा में बार-बार घटने वाली परिस्थिति बताता है; ‘जब-जब ... तब’ हिन्दी में इस आदतन अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כְּצֵאת מֹשֶׁה
  choice: मूसा ... की ओर निकलता
  rationale: כ के साथ infinitive construct समयसूचक है, और יצא बाहर निकलने की गति बताता है। अगले पद के संदर्भ में गंतव्य तम्बू है; ‘की ओर निकलता’ इसे सहज हिन्दी में रखता है।
- source_word: הָאֹהֶל
  choice: उस तम्बू
  rationale: इब्रानी में निश्चित पद के साथ केवल ‘तम्बू’ है, पूरा पद ‘मिलापवाला तम्बू’ नहीं। ‘उस’ पूर्वोक्त, छावनी के बाहर लगाए गए तम्बू की ओर संकेत स्पष्ट करता है, बिना नाम बढ़ाए।
- source_word: יָקוּמוּ וְנִצְּבוּ
  choice: उठकर ... खड़े हो जाते
  rationale: दोनों क्रियाएँ यहाँ नियमित व्यवहार दर्शाती हैं। ‘उठकर खड़े हो जाते’ आधुनिक हिन्दी में स्वाभाविक है और נצב के अपने स्थान पर खड़े होने के भाव को बनाए रखता है।
- source_word: אִישׁ פֶּתַח אָהֳלוֹ
  choice: अपने-अपने तम्बू के द्वार पर
  rationale: אישׁ का एकवचन यहाँ समूह के सदस्यों पर वितरणात्मक रूप से लागू है। ‘अपने-अपने’ उसी अर्थ को स्पष्ट और सहज हिन्दी में देता है; पादटिप्पणी शाब्दिक रूप बताती है।
- source_word: וְהִבִּיטוּ אַחֲרֵי מֹשֶׁה
  choice: मूसा को ... जाते हुए देखते रहते
  rationale: הביט אחרי का अर्थ पीछे जाते व्यक्ति को दृष्टि से देखते रहना है। यह अनुवाद ‘पीछे’ से उत्पन्न पीछा करने या शरीर के पिछले भाग को देखने की अनचाही अस्पष्टता से बचते हुए गति और निरंतर दृष्टि दोनों व्यक्त करता है।
- source_word: עַד בֹּאוֹ הָאֹהֱלָה
  choice: जब तक वह तम्बू में प्रवेश न कर जाता
  rationale: בוא और दिशासूचक ה तम्बू के भीतर जाने का संकेत देते हैं। ‘प्रवेश न कर जाता’ हिन्दी की ‘जब तक’ संरचना में पुनरावृत्त भूतकालीन क्रिया को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: הָאֹהֶל की पहचान
  choice: मुख्य पाठ में ‘उस तम्बू’
  alternative: ‘मिलापवाला तम्बू’
  rationale: आसपास का संदर्भ इसे मिलापवाले तम्बू से जोड़ता है, पर इस पद में केवल ‘तम्बू’ लिखा है। इसलिए विस्तृत धार्मिक पदनाम मुख्य पाठ में नहीं जोड़ा गया; पहचान पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठकों के लिए सहज। ‘जब-जब ... तब’, ‘अपने-अपने’ और ‘देखते रहते’ से इब्रानी की आदतन तथा वितरणात्मक संरचना स्वाभाविक हिन्दी में व्यक्त की गई है। ‘तम्बू’ की वर्तनी पूरे पद में एकरूप रखी गई है।
