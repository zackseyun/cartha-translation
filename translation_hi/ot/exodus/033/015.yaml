  text: Then he said to him[a], “If your presence does not go, do not bring us up from here.”
translation:
  language: hi
  text: तब उसने उससे कहा, “यदि आपकी उपस्थिति[a] हमारे साथ न चले, तो हमें यहाँ से आगे न ले जाइए।”
