  footnotes:
  - marker: a
    text: शाब्दिक, “आपका मुख।” इब्रानी में ‘मुख’ अक्सर किसी व्यक्ति की व्यक्तिगत उपस्थिति के अर्थ में प्रयुक्त होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  choice: तब उसने उससे कहा
  rationale: वाव-क्रम कथा को आगे बढ़ाता है; ‘तब’ क्रमिकता को स्वाभाविक हिन्दी में व्यक्त करता है। אֵלָיו को उसके पूर्वोक्त संबोधन के अनुसार ‘उससे’ रखा गया है।
- source_word: אִם אֵין
  choice: यदि ... नहीं चलेगी
  rationale: नकारात्मक अस्तित्ववाचक रचना यहाँ वास्तविक शर्त प्रस्तुत करती है; हिन्दी में इसे क्रिया के साथ सहज रूप से व्यक्त किया गया है।
- source_word: פָּנֶיךָ
  choice: आपकी उपस्थिति
  rationale: शाब्दिक अर्थ ‘आपका मुख’ है, पर इस प्रसंग में यह परमेश्वर की व्यक्तिगत और साथ चलने वाली उपस्थिति का इब्रानी मुहावरा है।
- source_word: הֹלְכִים
  choice: हमारे साथ नहीं चलेगी
  rationale: कृदन्त निरंतर साथ चलने की क्रिया बताता है। ‘हमारे साथ’ प्रसंग में निहित साथ होने के भाव को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אַל תַּעֲלֵנוּ
  choice: हमें ... ऊपर मत ले जाइए
  rationale: אַל के साथ अपूर्ण क्रिया निषेध अथवा आग्रह व्यक्त करती है; हिफ़ील रूप का कारक भाव ‘ऊपर ले जाइए’ में सुरक्षित है।
- source_word: מִזֶּה
  choice: यहाँ से
  rationale: पूर्वसर्गयुक्त संकेतवाचक शब्द वर्तमान स्थान की ओर संकेत करता है; ‘यहाँ से’ सहज हिन्दी है।
theological_decisions:
- issue: परमेश्वर के लिए פָּנֶיךָ का अनुवाद
  choice: आपकी उपस्थिति
  alternative: आपका मुख
  rationale: यहाँ ‘मुख’ परमेश्वर की व्यक्तिगत, साथ चलने वाली उपस्थिति का मुहावरा है। ‘उपस्थिति’ आशय स्पष्ट करती है, जबकि शाब्दिक रूप को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, आदरपूर्ण और सहज मानक हिन्दी। परमेश्वर के लिए आदरसूचक ‘आप’ और ‘ले जाइए’ प्रयुक्त हैं। मुख्य पाठ में पादटिप्पणी-चिह्न [a] ‘उपस्थिति’ के बाद होना चाहिए।
