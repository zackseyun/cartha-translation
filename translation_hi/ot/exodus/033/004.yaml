- source_word: וַיִּשְׁמַע הָעָם
  choice: जब लोगों ने ... सुना
  rationale: עָם एक सामूहिक संज्ञा है; आधुनिक हिन्दी में बहुवचन ‘लोगों ने’ स्वाभाविक है। שמע यहाँ किसी घोषणा को सुनने के अर्थ में है।
- source_word: הַדָּבָר הָרָע הַזֶּה
  choice: यह बुरा समाचार
  rationale: דָּבָר का मूल अर्थ ‘बात/वचन/मामला’ है, पर यहाँ यह अभी-अभी सुनाई गई दुखद घोषणा की ओर संकेत करता है। ‘बुरा समाचार’ सन्दर्भानुकूल और सहज हिन्दी है; अधिक शाब्दिक विकल्प पादटिप्पणी में सुरक्षित हैं।
- source_word: וַיִּתְאַבָּלוּ
  choice: उन्होंने शोक मनाया
  rationale: אבל का यह रूप शोक में पड़ने अथवा शोक प्रकट करने को दर्शाता है; ‘शोक मनाया’ भाव और व्यवहार दोनों को व्यक्त करता है।
- source_word: וְלֹא שָׁתוּ אִישׁ
  choice: और किसी ने भी ... नहीं पहने
  rationale: אִישׁ यहाँ वितरणात्मक अर्थ देता है—समुदाय में किसी एक व्यक्ति ने भी ऐसा नहीं किया। हिन्दी में ‘किसी ने भी नहीं’ यही बल स्वाभाविक ढंग से रखता है।
- source_word: עֶדְיוֹ עָלָיו
  choice: अपने आभूषण नहीं पहने
  rationale: עֲדִי सजावट की वस्तुओं अथवा गहनों का व्यापक शब्द है। שׂים ... עַל का अर्थ सन्दर्भ में शरीर पर धारण करना है, इसलिए ‘आभूषण पहनना’ स्वाभाविक हिन्दी है।
