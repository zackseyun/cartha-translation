lexical_decisions:
- source_word: וַיֹּאמַר
  choice: तब उसने कहा
  rationale: वाव-परिणामी कथा को आगे बढ़ाता है; ‘तब’ क्रमिक बल को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הַרְאֵנִי
  choice: मुझे ... दिखा
  rationale: ראה का हिफ़ील आज्ञार्थक, प्रथम पुरुष एकवचन प्रत्यय सहित, शाब्दिक रूप से ‘मुझे देखने दे/मुझे दिखा’ है। ‘दिखा’ सम्बोधित व्यक्ति की कारक भूमिका को स्पष्ट और सहज रूप से रखता है।
- source_word: נָא
  choice: कृपया
  rationale: यह विनती और नम्र आग्रह सूचित करता है; ‘कृपया’ इसका स्पष्ट समकालीन हिन्दी समतुल्य है।
- source_word: אֶת
  choice: '[निश्चित कर्म-सूचक; अनूदित नहीं]'
  rationale: यह निश्चित प्रत्यक्ष कर्म को चिह्नित करता है और हिन्दी में इसके लिए अलग शब्द आवश्यक नहीं है।
- source_word: כְּבֹדֶךָ
  choice: अपनी महिमा
  rationale: כבוד महिमा, सम्मान या प्रकट वैभव को सूचित कर सकता है। इस प्रसंग में ‘महिमा’ अर्थ की व्यापकता बनाए रखती है और इसे केवल दृश्य तेज तक सीमित नहीं करती।
theological_decisions:
- issue: मूसा के अनुरोध में ‘तेरी/अपनी महिमा’ का अर्थ
  choice: ‘अपनी महिमा’—ठोस, पर अर्थ को अत्यधिक विशिष्ट किए बिना
  alternative: ‘अपना वैभव’; ‘अपनी उपस्थिति की परिपूर्णता’
  rationale: इब्रानी पाठ स्पष्ट नहीं करता कि मूसा दृश्य तेज, ईश्वरीय प्रताप या परमेश्वर की उपस्थिति के प्रकटीकरण को देखने की माँग करता है। ‘महिमा’ इस व्यापकता और धर्मवैचारिक तनाव को बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज। परमेश्वर से प्रत्यक्ष संबोधन में प्रचलित एकवचन रूप रखा गया है।
