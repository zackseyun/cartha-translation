  text: तब उसने कहा, “कृपया मुझे अपनी महिमा दिखा।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मुझे अपना वैभव देखने दे।” इब्रानी क्रिया का मूल अर्थ है, “मुझे देखने कराओ,” अर्थात् “मुझे दिखाओ।” “महिमा” प्रकट वैभव या सम्मान को भी सूचित कर सकती है।
