base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/005.yaml
  text: And Yahweh said to Moses[a], “Say to the sons of Israel, ‘You are a stiff-necked people. In a single moment, if I were to go up in your midst, I would consume you. So now, take off your ornaments from upon you[e][d][c][b], and I will know what I should do with you.’”
translation:
  language: hi
  text: और याहवे ने मूसा से कहा, “इस्राएलियों[a] से कह, ‘तुम हठी लोग हो। यदि मैं एक क्षण के लिए तुम्हारे बीच में ऊपर जाऊँ[b], तो मैं तुम्हें नष्ट कर दूँगा[c]। अब अपने गहने उतार दो[d], और मैं जानूँगा कि तुम्हारे साथ क्या करूँ[e]।’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ “इस्राएल के पुत्रों” है; आशय इस्राएली समुदाय से है।
    reason: lexical_alternative
  - marker: b
    text: या “यदि मैं एक क्षण के लिए तुम्हारे बीच ऊपर जाऊँ” या “यदि मैं तुम्हारे बीच में ऊपर जाऊँ।”
    reason: lexical_alternative
  - marker: c
    text: या “तुम्हारा पूरी तरह अंत कर दूँ।”
    reason: lexical_alternative
  - marker: d
    text: या “अपने आभूषण अपने ऊपर से हटा दो।”
    reason: lexical_alternative
  - marker: e
    text: इब्रानी में “और मैं जानूँगा कि तुम्हारे साथ क्या करूँ।” यहाँ ‘जानना’ परमेश्वर के विषय में प्रयुक्त मूल पाठ की मानव-सदृश अभिव्यक्ति को बनाए रखता है; इसे केवल “निर्णय करूँगा” के अर्थ में सरल नहीं किया गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय उसका प्रचलित हिन्दी लिप्यंतरण रखा गया है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: शाब्दिक अर्थ ‘इस्राएल के पुत्र’ है, पर यहाँ पूरा समुदाय अभिप्रेत है; ‘इस्राएलियों’ आधुनिक हिन्दी में स्वाभाविक और समावेशी सामूहिक संबोधन है।
- source_word: עַם קְשֵׁה עֹרֶף
  choice: हठीले लोग
  rationale: मूल का शाब्दिक रूप ‘कठोर गर्दनवाले लोग’ है। ‘हठीले’ उस मुहावरे का अर्थ स्पष्ट करता है, जबकि पादटिप्पणी मूल रूपक को सुरक्षित रखती है।
- source_word: רֶגַע אֶחָד
  choice: एक क्षण भी
  rationale: यह अभिव्यक्ति उपस्थिति की अत्यल्प अवधि और न्याय की तात्कालिकता दोनों व्यक्त करती है।
- source_word: אֶעֱלֶה בְקִרְבְּךָ
  choice: तुम्हारे बीच होकर ऊपर चलूँ
  rationale: ‘ऊपर चलना’ यात्रा की दिशा को बनाए रखता है और ‘तुम्हारे बीच होकर’ समुदाय के मध्य याहवे की उपस्थिति को व्यक्त करता है।
- source_word: וְכִלִּיתִיךָ
  choice: मैं तुम्हें नष्ट कर दूँगा
  rationale: כלה यहाँ न्याय में पूर्ण अंत कर देने का भाव रखता है। ‘नष्ट कर दूँगा’ स्पष्ट है और विनाश के किसी विशेष साधन को अनावश्यक रूप से नहीं जोड़ता।
- source_word: הוֹרֵד עֶדְיְךָ מֵעָלֶיךָ
  choice: अपने गहने उतार दो
  rationale: עֲדִי शरीर पर पहने जानेवाले आभूषण या सजावट को दर्शाता है; ‘गहने उतार दो’ सहज हिन्दी है।
- source_word: וְאֵדְעָה מָה אֶעֱשֶׂה לָּךְ
  choice: और तब मैं जानूँगा कि तुम्हारे साथ क्या करूँ
  rationale: ‘जानूँगा’ मूल की मानव-सदृश अभिव्यक्ति को बनाए रखता है। ‘तुम्हारे साथ’ आगे की कार्रवाई को केवल दंड तक सीमित नहीं करता।
theological_decisions:
- issue: परमेश्वर के जानने की मानव-सदृश भाषा
  choice: ‘मैं जानूँगा’ को मुख्य पाठ में बनाए रखना
  alternative: ‘मैं निर्णय करूँगा’ या ‘मैं ठहराऊँगा’
  rationale: मूल पाठ ידע, ‘जानना’, का प्रयोग करता है। इसे निर्णय लेने की अमूर्त भाषा में बदलने से पाठ में उपस्थित धर्मवैज्ञानिक तनाव मिट जाता।
- issue: इस्राएल को संबोधित एकवचन प्रत्यय
  choice: हिन्दी में समुदाय को स्वाभाविक बहुवचन ‘तुम’ से संबोधित करना
  alternative: प्रत्येक रूप को व्याकरणिक एकवचन में दिखाना
  rationale: इब्रानी इस्राएल को एक सामूहिक इकाई मानकर एकवचन प्रत्यय लगाता है; हिन्दी ‘तुम’ पूरे समुदाय का स्वाभाविक संबोधन है।
- issue: याहवे का इस्राएल के बीच होकर ऊपर चलना
  choice: दिशात्मक क्रिया और मध्य-उपस्थिति दोनों को बनाए रखना
  alternative: केवल ‘तुम्हारे बीच आऊँ’ या ‘तुम्हारे साथ चलूँ’
  rationale: אעלה में ऊपर जाने की यात्रा और בקרבך में समुदाय के बीच उपस्थित होने का भाव है; अनुवाद दोनों को यथासंभव सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘हठीले’ तथा ‘गहने उतार दो’ सामान्य पाठक के लिए सहज हैं; ‘याहवे’, ‘ऊपर चलूँ’ और ‘मैं जानूँगा’ मूल पाठ की विशिष्ट शब्दावली तथा धर्मवैज्ञानिक तनाव को सुरक्षित रखते हैं।
