source:
  edition: WLC
  text: וְ/הָיָ֗ה כְּ/בֹ֤א מֹשֶׁה֙ הָ/אֹ֔הֱלָ/ה יֵרֵד֙ עַמּ֣וּד הֶֽ/עָנָ֔ן וְ/עָמַ֖ד פֶּ֣תַח הָ/אֹ֑הֶל וְ/דִבֶּ֖ר עִם מֹשֶֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/009.yaml
  text: And whenever Moses entered the tent[a], the pillar of cloud would descend and stand at the entrance of the tent, and he would speak with Moses.
translation:
  language: hi
  text: जब भी मूसा तंबू में प्रवेश करता था, बादल का खंभा उतरकर तंबू के द्वार पर ठहर जाता था, और वह[a] मूसा से बात करता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा अधिक स्पष्ट रूप में, “यहोवा मूसा से बात करता था।” इस उपवाक्य में इब्रानी पाठ कर्ता को स्पष्ट नहीं करता, यद्यपि संदर्भ से उसका संकेत यहोवा की ओर है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה כְּבֹא
  choice: जब भी ... प्रवेश करता
  rationale: यह रचना बीते समय में बार-बार होने वाली परिस्थिति बताती है। ‘जब भी’ और अपूर्ण क्रिया ‘करता’ आधुनिक हिन्दी में इस पुनरावृत्त भाव को स्वाभाविक रूप से व्यक्त करते हैं।
- source_word: הָאֹהֱלָה / הָאֹהֶל
  choice: तंबू
  rationale: इब्रानी में यहाँ केवल ‘तंबू’ है, पूरा पद ‘मिलापवाला तंबू’ नहीं; इसलिए संदर्भ से अधिक स्पष्टता पाठ में नहीं जोड़ी गई।
- source_word: יֵרֵד
  choice: उतरकर
  rationale: क्रिया बादल के खंभे के नीचे आने को बताती है। संयुक्त रूप ‘उतरकर ... ठहर जाता’ दोनों क्रमिक और बार-बार होने वाले कार्यों को सहज हिन्दी में रखता है।
- source_word: עַמּוּד הֶעָנָן
  choice: बादल का खंभा
  rationale: यह मूर्त बिंब को सीधे और सामान्य हिन्दी में बनाए रखता है।
- source_word: וְעָמַד
  choice: ठहर जाता
  rationale: פתח के निकट स्थिर होकर खड़े रहने का भाव है; ‘ठहर जाता’ तंबू के द्वार पर उपस्थिति को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: פֶּתַח הָאֹהֶל
  choice: तंबू के द्वार पर
  rationale: פתח तंबू के प्रवेश-स्थान या खुले द्वार को दर्शाता है; ‘द्वार पर’ संक्षिप्त, स्पष्ट और मुहावरेदार है।
- source_word: וְדִבֶּר
  choice: और वह ... बात करता था
  rationale: इब्रानी क्रिया पुल्लिंग एकवचन है, पर उसका कर्ता स्पष्ट रूप से लिखा नहीं गया। ‘वह’ इस अंतर्निहित कर्ता को बनाए रखता है और पुनरावृत्त क्रिया को ‘करता था’ से व्यक्त करता है।
- source_word: עִם מֹשֶׁה
  choice: मूसा से
  rationale: עם का मूल भाव ‘साथ/के साथ’ है; हिन्दी में ‘मूसा से बात करता था’ पारस्परिक संवाद को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: ‘वह मूसा से बात करता था’ में अंतर्निहित कर्ता
  choice: मुख्य पाठ में ‘वह’ रखकर इब्रानी की अनिर्दिष्टता बनाए रखी गई।
  alternative: ‘यहोवा मूसा से बात करता था’ कहकर कर्ता को स्पष्ट करना।
  rationale: व्यापक संदर्भ कर्ता को यहोवा के रूप में पहचानता है, पर इस उपवाक्य में इब्रानी पाठ उसका नाम नहीं देता। मुख्य पाठ में ‘वह’ रखना मूल की अभिव्यक्ति और उसका तनाव सुरक्षित रखता है; पादटिप्पणी संदर्भगत अर्थ स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘जब भी’ तथा ‘करता/ठहर जाता/करता था’ बीते समय की नियमित पुनरावृत्ति बताते हैं। ‘मिलापवाला तंबू’ जैसी विस्तृत उपाधि नहीं जोड़ी गई, क्योंकि इस पद में मूल पाठ केवल ‘तंबू’ कहता है।
