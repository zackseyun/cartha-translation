  text: तब इस्राएलियों ने होरेब पर्वत से अपने आभूषण उतार दिए[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस्राएलियों ने होरेब पर्वत पर अपने आभूषण उतार दिए।” इब्रानी वाक्यांश स्थान भी बता सकता है और वह आरंभ-बिंदु भी, जहाँ से उन्होंने आभूषण पहनना छोड़ दिया।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתְנַצְּלוּ
  choice: उतार दिए
  rationale: हित्पअेल रूप यहाँ अपने शरीर से आभूषण हटाने का अर्थ देता है। ‘उतार दिए’ आधुनिक हिन्दी में स्वाभाविक है और आत्मवाचक भाव प्रसंग से स्पष्ट रहता है।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: शाब्दिक ‘इस्राएल के पुत्रों’ के बजाय ‘इस्राएलियों’ सामान्य आधुनिक हिन्दी में पूरे समुदाय को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: עֶדְיָם
  choice: अपने आभूषण
  rationale: עֲדִי सजावट के लिए पहनी जाने वाली वस्तुओं का व्यापक शब्द है; ‘आभूषण’ सामग्री या प्रकार को अनावश्यक रूप से सीमित नहीं करता।
- source_word: מֵהַר חוֹרֵב
  choice: होरेब पर्वत से ही
  rationale: यह उस आरंभ-बिंदु का भाव व्यक्त करता है जहाँ से उन्होंने आभूषण पहनना छोड़ दिया, पर इब्रानी में स्थानसूचक अर्थ की संभावना को पादटिप्पणी में सुरक्षित रखा गया है।
