base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/002.yaml
  text: And I will send an angel before you[a], and I will drive out the Canaanite, the Amorite, the Hittite, the Perizzite, the Hivite, and the Jebusite.
translation:
  language: hi
  text: और मैं तुम्हारे आगे एक स्वर्गदूत[a] भेजूँगा, और कनानियों, एमोरियों, हित्तियों, परिज्जियों, हिव्वियों और यबूसियों को निकाल दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘दूत।’ इब्रानी शब्द מַלְאָךְ किसी स्वर्गीय या मानवीय संदेशवाहक को दर्शा सकता है; यहाँ प्रसंग के अनुसार ‘स्वर्गदूत’ अधिक उपयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁלַחְתִּי
  choice: और मैं ... भेजूँगा
  rationale: संयुक्त पूर्ण क्रिया यहाँ परमेश्वर के भावी कार्य को व्यक्त करती है; हिंदी में भविष्यकाल स्वाभाविक और प्रतिज्ञात्मक बल के अनुरूप है।
- source_word: לְפָנֶיךָ
  choice: तुम्हारे आगे
  rationale: यह इब्रानी मुहावरा आगे चलने या पहले पहुँचने का भाव देता है; ‘तुम्हारे आगे’ संक्षिप्त और स्वाभाविक है।
- source_word: מַלְאָךְ
  choice: एक स्वर्गदूत
  rationale: शब्द का अर्थ मानवीय ‘दूत’ या स्वर्गीय ‘स्वर्गदूत’ दोनों हो सकता है। इस प्रसंग में ‘स्वर्गदूत’ उपयुक्त है, पर विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: וְגֵרַשְׁתִּי
  choice: और ... निकाल दूँगा
  rationale: גרשׁ निवासियों को किसी देश से खदेड़ने या निष्कासित करने को दर्शाता है; ‘निकाल दूँगा’ सामान्य आधुनिक हिंदी में स्पष्ट है।
- source_word: הַכְּנַעֲנִי ... וְהַיְבוּסִי
  choice: कनानियों ... और यबूसियों
  rationale: इब्रानी में एकवचन जातिवाचक रूप सामूहिक अर्थ रखते हैं। हिंदी में बहुवचन जातिनाम इस सामूहिक आशय को अधिक स्वाभाविक ढंग से व्यक्त करते हैं।
theological_decisions:
- issue: इस पद में מַלְאָךְ की पहचान
  choice: ‘एक स्वर्गदूत’—उसकी विशिष्ट पहचान निर्धारित किए बिना
  alternative: ‘दूत’ अथवा ‘वह स्वर्गदूत’
  rationale: पद स्वयं यह स्पष्ट नहीं करता कि यह यहोवा का विशिष्ट दूत है या कोई अन्य स्वर्गदूत। इसलिए अनिश्चित रूप रखा गया है और शब्दगत विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए सहज। जातियों के इब्रानी सामूहिक एकवचन को स्वाभाविक हिंदी बहुवचन में व्यक्त किया गया है।
