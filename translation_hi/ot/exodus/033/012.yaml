base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/012.yaml
  text: Then Moses said to Yahweh[a], “See, you are saying to me, ‘Bring up this people,’ but you have not made known to me whom you will send with me. Yet you have said, ‘I know you by name[c][b], and you also have found favor in my sight.’”
translation:
  language: hi
  text: तब मूसा ने यहवे से कहा, “देखिए, आप मुझसे कहते हैं, ‘इस प्रजा को ऊपर ले जाओ,’ लेकिन आपने मुझे यह नहीं बताया कि आप मेरे साथ किसे भेजेंगे। फिर भी आपने कहा है, ‘मैं तुम्हें नाम से जानता हूँ[a], और तुमने मेरी दृष्टि में अनुग्रह पाया है[b]।’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “नाम से जानता हूँ” व्यक्तिगत रूप से जानने और कृपापूर्वक स्वीकार करने का इब्रानी मुहावरा है।
    reason: cultural_note
  - marker: b
    text: 'या, “तुम पर मेरी कृपादृष्टि हुई है।” शाब्दिक अर्थ: “तुमने मेरी आँखों में अनुग्रह पाया है।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित निकट लिप्यंतरण द्वारा रखा गया है।
- source_word: רְאֵה
  choice: देखिए
  rationale: यह आग्रह आरम्भ करने वाला आज्ञार्थक संवाद-सूचक है; आदरसूचक रूप हिन्दी में मूसा के परमेश्वर से संबोधन के अनुरूप स्वाभाविक है।
- source_word: הַעַל אֶת הָעָם הַזֶּה
  choice: इस प्रजा को यहाँ से ऊपर ले जाओ
  rationale: हिफ़ील क्रिया की ‘ऊपर ले जाने’ की दिशात्मकता को बनाए रखा गया है; ‘यहाँ से’ निर्गमन-प्रसंग को हिन्दी में स्पष्ट और स्वाभाविक बनाता है।
- source_word: לֹא הוֹדַעְתַּנִי
  choice: आपने मुझे यह नहीं बताया
  rationale: हिफ़ील का शाब्दिक अर्थ ‘मुझ पर प्रकट नहीं किया’ हो सकता है, पर आधुनिक हिन्दी में ‘नहीं बताया’ वही आशय सहजता से व्यक्त करता है।
- source_word: אֵת אֲשֶׁר תִּשְׁלַח עִמִּי
  choice: आप मेरे साथ किसे भेजेंगे
  rationale: אֲשֶׁר का संदर्भ स्वाभाविक रूप से किसी व्यक्ति से है और עִם साथ चलने या भेजे जाने को दर्शाता है।
- source_word: יְדַעְתִּיךָ בְשֵׁם
  choice: मैं तुम्हें नाम से जानता हूँ
  rationale: व्यक्तिगत पहचान और कृपा व्यक्त करने वाले इब्रानी मुहावरे को बिना व्याख्यात्मक विस्तार के सुरक्षित रखा गया है।
- source_word: מָצָאתָ חֵן בְּעֵינַי
  choice: तुमने मेरी दृष्टि में अनुग्रह पाया है
  rationale: मूल रूपक और חֵן का कृपा/पक्षपात-सूचक अर्थ दोनों बने रहते हैं; ‘अनुग्रह’ गरिमापूर्ण और समझने योग्य है।
- source_word: וְאַתָּה ... לֹא ... וְאַתָּה אָמַרְתָּ
  choice: लेकिन आपने ... फिर भी आपने कहा है
  rationale: दोहराए गए सर्वनाम से उत्पन्न विरोध और मूसा की विनती का तनाव स्वाभाविक हिन्दी संयोजकों से स्पष्ट किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है; उसे किसी उपाधि से प्रतिस्थापित न करके लिप्यंतरित किया गया है।
- issue: ‘मैं तुम्हें नाम से जानता हूँ’ का भाव
  choice: मुहावरे को ज्यों का त्यों बनाए रखना
  alternative: मैं तुम्हें व्यक्तिगत रूप से जानता हूँ; मैंने तुम्हें चुन लिया है
  rationale: मूल वाक्य व्यक्तिगत ज्ञान और अनुग्रह का संकेत देता है, पर स्पष्ट रूप से चुनाव जैसी अधिक विशिष्ट धर्मवैज्ञानिक धारणा नहीं कहता।
- issue: חֵן का अर्थ
  choice: अनुग्रह
  alternative: कृपा; प्रसन्नता
  rationale: यहाँ शब्द स्वीकृति और कृपादृष्टि व्यक्त करता है। ‘अनुग्रह’ मूल मुहावरे की धर्मवैज्ञानिक गूँज बचाता है, जबकि पादटिप्पणी सामान्य वैकल्पिक अभिव्यक्ति देती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। मूसा द्वारा परमेश्वर के संबोधन में ‘आप’ और उद्धृत ईश्वरीय वचन में मूसा के लिए ‘तुम’ रखा गया है। मूल के विरोधात्मक तनाव तथा ‘नाम से जानने’ और ‘दृष्टि में अनुग्रह पाने’ के मुहावरों को सुरक्षित रखा गया है।
