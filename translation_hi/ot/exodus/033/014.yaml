  text: And he said[a], “My presence will go, and I will give you rest.”
translation:
  language: hi
  text: और उसने कहा, “मेरी उपस्थिति[a] तेरे साथ जाएगी, और मैं तुझे विश्राम दूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “मेरा मुख” है। यहाँ इसका अर्थ है कि यहोवा स्वयं तेरे साथ जाएगा।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: और उसने कहा
  rationale: वय्यिक्तोल कथात्मक रूप को स्वाभाविक हिन्दी कथा-प्रवाह में रखा गया है; कर्ता निकटवर्ती प्रसंग से समझ में आता है।
- source_word: פָּנַי
  choice: मेरी उपस्थिति
  rationale: शाब्दिक अर्थ ‘मेरा मुख’ है, पर यहाँ यह स्वयं यहोवा की व्यक्तिगत उपस्थिति का मुहावरा है। हिन्दी में ‘मेरी उपस्थिति’ अर्थ को स्वाभाविक ढंग से व्यक्त करती है, जबकि मूल बिंब पाद-टिप्पणी में सुरक्षित है।
- source_word: יֵלֵכוּ
  choice: तेरे साथ चलेगी
  rationale: क्रिया का मूल अर्थ ‘जाएगी/चलेगी’ है। प्रसंग में साथ चलने का भाव निहित है; ‘तेरे साथ’ जोड़ने से हिन्दी में आश्वासन स्पष्ट और स्वाभाविक होता है, बिना किसी अलग एजेंट का संकेत दिए।
- source_word: וַהֲנִחֹתִי
  choice: और मैं तुझे विश्राम दूँगा
  rationale: נוח के हिफ़ईल रूप का कारणवाचक अर्थ ‘विश्राम देना/विश्राम पहुँचाना’ है। यह चयन सहज हिन्दी में उस कारणवाचक अर्थ को बनाए रखता है।
- source_word: לָךְ
  choice: तुझे
  rationale: यह द्वितीय पुरुष एकवचन स्त्रीलिंग प्रत्यय है, जो यहाँ मूसा को संबोधित करता है; ‘तुझे’ ‘विश्राम दूँगा’ के साथ स्वाभाविक हिन्दी कर्मरूप है।
theological_decisions:
- issue: פָּנַי में मानवरूपी ‘मुख’ के बिंब का अनुवाद
  choice: मेरी उपस्थिति
  alternative: मेरा मुख; मैं स्वयं
  rationale: इस प्रसंग में ‘मुख’ यहोवा की निजी उपस्थिति को व्यक्त करता है। मुख्य पाठ में ‘उपस्थिति’ अर्थ को स्पष्ट करता है, और पाद-टिप्पणी मूल इब्रानी बिंब तथा इस बात को सुरक्षित रखती है कि साथ जाने वाला स्वयं यहोवा है।
- issue: יֵלֵכוּ में साथ जाने का संबंध
  choice: तेरे साथ चलेगी
  alternative: जाएगी; चलेगी
  rationale: इब्रानी में केवल ‘जाएगी/चलेगी’ है, पर निर्गमन 33 के संवाद में प्रश्न यह है कि यहोवा मूसा और लोगों के साथ जाएगा या नहीं। हिन्दी में केवल ‘मेरी उपस्थिति चलेगी’ अधूरा लग सकता है; ‘तेरे साथ’ प्रसंगगत संबंध को व्यक्त करता है, यद्यपि इसे अलग इब्रानी शब्द न मानते हुए अनुवादगत पूर्ति समझा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘तेरे/तुझे’ का प्रयोग एकवचन संबोधन और बाइबिलीय गरिमा बनाए रखता है; अत्यधिक संस्कृतनिष्ठ शब्दावली से बचा गया है।
