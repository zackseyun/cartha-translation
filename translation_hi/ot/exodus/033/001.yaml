  text: וַ/יְדַבֵּ֨ר יְהוָ֤ה אֶל מֹשֶׁה֙ לֵ֣ךְ עֲלֵ֣ה מִ/זֶּ֔ה אַתָּ֣ה וְ/הָ/עָ֔ם אֲשֶׁ֥ר הֶֽעֱלִ֖יתָ מֵ/אֶ֣רֶץ מִצְרָ֑יִם אֶל הָ/אָ֗רֶץ אֲשֶׁ֣ר נִ֠שְׁבַּעְתִּי לְ/אַבְרָהָ֨ם לְ/יִצְחָ֤ק וּֽ/לְ/יַעֲקֹב֙ לֵ/אמֹ֔ר לְ/זַרְעֲ/ךָ֖ אֶתְּנֶֽ/נָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/001.yaml
  text: Then Yahweh said to Moses[a], “Go up from here, you and the people whom you brought up from the land of Egypt, to the land that I swore to Abraham, to Isaac, and to Jacob, saying[b], ‘I will give it to your offspring.’”
translation:
  language: hi
  text: तब याहवे ने मूसा से कहा[a], “तू और वे लोग, जिन्हें तू मिस्र देश से निकाल लाया है, यहाँ से निकलकर ऊपर उस देश में जा, जिसकी शपथ मैंने अब्राहम, इसहाक और याकूब से यह कहते हुए खाई थी[b], ‘मैं इसे तुम्हारे वंश को दूँगा।’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: ‘YHWH’ (य्ह्व्ह); परंपरागत अनुवादों में ‘यहोवा’ या ‘प्रभु’।'
    reason: alternative_reading
  - marker: b
    text: इब्रानी शब्द का शाब्दिक अर्थ ‘तुम्हारे बीज को’ है। यह सामूहिक एकवचन है और इसका अर्थ ‘वंश’ या ‘वंशज’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: तब ... ने ... कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; प्रत्यक्ष वचन की भूमिका में आधुनिक हिन्दी में ‘तब ... कहा’ स्वाभाविक है।
- source_word: יְהוָה
  choice: यहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: לֵךְ עֲלֵה מִזֶּה
  choice: यहाँ से ... जा
  rationale: दोनों आज्ञार्थक क्रियाओं में प्रस्थान और ऊपर/आगे जाने का संयुक्त भाव है। हिन्दी में ‘यहाँ से ... जा’ इसे स्वाभाविक रूप से व्यक्त करता है; गंतव्य देश की ओर भौगोलिक आरोहण को अलग से ‘चढ़’ कहना यहाँ असहज होता।
- source_word: אֲשֶׁר הֶעֱלִיתָ
  choice: जिन्हें तू ... निकाल लाया है
  rationale: हिफ़ील रूप का कारणात्मक ‘ऊपर ले आना’ निर्गमन के प्रसंग में मिस्र से निकाल लाने को सूचित करता है और आधुनिक हिन्दी में यही अधिक स्पष्ट है।
- source_word: אֶל הָאָרֶץ אֲשֶׁר נִשְׁבַּעְתִּי
  choice: उस देश को ... जिसके विषय में मैंने ... शपथ खाकर कहा था
  rationale: दिशा और शपथ के विषय—प्रतिज्ञात देश—को हिन्दी वाक्य-विन्यास में स्पष्ट और स्वाभाविक रखा गया है।
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: अब्राहम, इसहाक और याकूब से
  rationale: शपथ लेने की हिन्दी संयोजक रचना में ‘से’ स्वाभाविक है; तीनों पूर्वजों के नाम स्पष्ट रूप से सुरक्षित हैं।
- source_word: לְזַרְעֲךָ
  choice: तुम्हारे वंश को
  rationale: זֶרַע सामूहिक एकवचन है। ‘वंश’ आधुनिक हिन्दी में संतान/वंशजों के सामूहिक अर्थ को संक्षेप और गरिमा के साथ बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। ‘यहवे’ उसे उपाधि में बदले बिना हिन्दी में लिप्यंतरित करता है; पादटिप्पणी पारंपरिक प्रतिस्थापन बताती है।
- issue: ‘तू मिस्र देश से निकाल लाया’ में कर्तृत्व का तनाव
  choice: मूसा को संबोधित मूल द्वितीय पुरुष को अक्षुण्ण रखा
  alternative: ‘जिन्हें मैं मूसा के द्वारा निकाल लाया’ जैसी व्याख्यात्मक स्पष्टता
  rationale: आसपास के प्रसंग में ईश्वर ही परम उद्धारकर्ता हैं, फिर भी इस पद में कथन मूसा से सीधे ‘तू ... लाया’ कहता है। अनुवाद इस जानबूझकर उभरे तनाव को नहीं मिटाता।
- issue: זֶרַע का सामूहिक एकवचन
  choice: वंश
  alternative: सन्तान; वंशज
  rationale: ‘वंश’ सामूहिकता और व्याकरणिक एकवचन दोनों का भाव रखता है, बिना यह तय किए कि संकेत केवल एक व्यक्ति की ओर है या अनेक वंशजों की ओर।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ईश्वर से मूसा के संवाद में इब्रानी एकवचन संबोधन के अनुरूप ‘तू’ रखा गया है; प्रतिज्ञा में पूर्वजों के सामूहिक संबोधन के कारण ‘तुम्हारे’ स्वाभाविक है। मुख्य पाठ में केवल वही पादटिप्पणी-चिह्न रखा गया है जिसका पादटिप्पणी में विवरण है।
