source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר לֹ֥א תוּכַ֖ל לִ/רְאֹ֣ת אֶת פָּנָ֑/י כִּ֛י לֹֽא יִרְאַ֥/נִי הָ/אָדָ֖ם וָ/חָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/020.yaml
  text: But he said[a], “You cannot see my face[b], for man shall not see me and live.”
translation:
  language: hi
  text: पर उसने कहा, “तुम मेरा मुख[a] नहीं देख सकते, क्योंकि कोई मनुष्य[b] मुझे देखकर जीवित नहीं रह सकता।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरी उपस्थिति।” इब्रानी में शाब्दिक अर्थ “मेरा मुख” है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “मनुष्य” से किसी भी मानव का बोध होता है; यह कथन समस्त मानवजाति पर लागू है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: पर उसने कहा
  rationale: वाव-क्रम कथा को आगे बढ़ाता है, जबकि पिछले पद में मूसा के निवेदन के उत्तर में आया विरोध ‘पर’ से स्वाभाविक रूप से व्यक्त होता है।
- source_word: לֹא תוּכַל
  choice: तुम ... नहीं देख सकते
  rationale: יכל यहाँ अनुमति नहीं, बल्कि सामर्थ्य या संभावना का निषेध बताता है। आधुनिक हिन्दी में ‘नहीं देख सकते’ स्वाभाविक है।
- source_word: לִרְאֹת
  choice: देख
  rationale: ראה यहाँ प्रत्यक्ष देखने के सामान्य अर्थ में है; ‘देखना’ इसका स्पष्ट आधुनिक हिन्दी समतुल्य है।
- source_word: אֶת־פָּנַי
  choice: मेरा मुख
  rationale: פָּנִים का ठोस शाब्दिक अर्थ ‘मुख’ है। मुख्य पाठ में इसे बनाए रखने से मूल की मानव-सदृश अभिव्यक्ति सुरक्षित रहती है; ‘उपस्थिति’ को पादटिप्पणी में रखा गया है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पहले कथन का कारण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इस व्याख्यात्मक संबंध को स्पष्ट और स्वाभाविक बनाता है।
- source_word: לֹא יִרְאַנִי
  choice: मुझे देखकर ... नहीं रह सकता
  rationale: यह अपूर्ण क्रिया सामान्य सिद्धान्त और उसके परिणाम को व्यक्त करती है। हिन्दी में अगली क्रिया के साथ संयुक्त रचना मूल आशय को सहज ढंग से व्यक्त करती है।
- source_word: הָאָדָם
  choice: कोई मनुष्य
  rationale: संज्ञा व्याकरण की दृष्टि से एकवचन है, पर यहाँ समस्त मानवजाति के किसी भी सदस्य के लिए सामान्य अर्थ रखती है। ‘कोई मनुष्य’ उस व्यापक अर्थ को स्पष्ट रखता है।
- source_word: וָחָי
  choice: जीवित नहीं रह सकता
  rationale: यह परमेश्वर को देखने के परिणाम—जीवन का जारी न रहना—को व्यक्त करता है। ‘जीवित रहना’ आधुनिक हिन्दी में स्पष्ट और मुहावरेदार है।
theological_decisions:
- issue: ‘मेरा मुख’ में परमेश्वर के लिए मानव-सदृश भाषा
  choice: मुख्य पाठ में ‘मेरा मुख’ रखा गया
  alternative: मेरी उपस्थिति
  rationale: इब्रानी पाठ ठोस ‘मुख’ शब्द का प्रयोग करता है। इसे किसी अमूर्त व्याख्या से बदलने के बजाय मूल की भाषा और उसके धार्मिक तनाव को सुरक्षित रखा गया है।
- issue: הָאָדָם का जातिवाचक अर्थ
  choice: कोई मनुष्य
  alternative: मानवजाति; मनुष्य
  rationale: यह कथन केवल किसी पुरुष के विषय में नहीं, बल्कि प्रत्येक मानव के विषय में सामान्य सिद्धान्त बताता है। ‘कोई मनुष्य’ एकवचन रूप और व्यापक अर्थ दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। मूसा को सीधे संबोधन में ‘तुम’ वर्तमान मानक हिन्दी में स्वाभाविक है। ‘मुख’ मूल की ठोस अभिव्यक्ति और शास्त्रीय गरिमा बनाए रखता है, जबकि वाक्य का शेष विन्यास सामान्य पाठक के लिए सहज है।
