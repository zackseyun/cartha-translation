  text: For if you refuse to let my people go[a], behold[b], tomorrow I will bring locusts into your territory.
translation:
  language: hi
  text: क्योंकि यदि तू मेरी प्रजा को जाने देने से इनकार करता है, तो देख, कल मैं तेरी सीमाओं के भीतर टिड्डियाँ ले आऊँगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי אִם
  choice: क्योंकि यदि
  rationale: यह पद पिछली चेतावनी को आगे बढ़ाते हुए एक शर्त प्रस्तुत करता है; यह अनुवाद कारणात्मक और शर्तसूचक दोनों बल बनाए रखता है।
- source_word: מָאֵן
  choice: इनकार करता है
  rationale: यह जान-बूझकर न मानने या हठपूर्वक अस्वीकार करने का भाव व्यक्त करता है, न कि केवल असमर्थता का।
- source_word: לְשַׁלֵּחַ
  choice: जाने देने
  rationale: निर्गमन के प्रसंग में यह स्वाभाविक हिन्दी मुहावरा लोगों को बंधन से जाने देने का अर्थ स्पष्ट करता है।
- source_word: עַמִּי
  choice: मेरी प्रजा
  rationale: यह परमेश्वर और इस्राएल के संबंध तथा मूल के अधिकारसूचक बल को संक्षेप में बनाए रखता है।
- source_word: הִנְנִי
  choice: देख
  rationale: यह आगामी घोषणा पर गंभीर ध्यान खींचता है और चेतावनी की तात्कालिकता बनाए रखता है।
- source_word: מֵבִיא
  choice: मैं ... ले आऊँगा
  rationale: הִנְנִי के साथ यह कृदन्त निकट भविष्य की निश्चित कार्रवाई व्यक्त करता है; हिन्दी में भविष्यकाल स्वाभाविक और स्पष्ट है।
- source_word: מָחָר
  choice: कल
  rationale: मूल के सीधे समय-सूचक अर्थ को सुरक्षित रखता है।
- source_word: אַרְבֶּה
  choice: टिड्डियाँ
  rationale: मूल शब्द रूप की दृष्टि से एकवचन है, पर यहाँ सामूहिक अर्थ में पूरी टिड्डी-विपत्ति को सूचित करता है; हिन्दी में बहुवचन स्वाभाविक है।
- source_word: בִּגְבֻלֶךָ
  choice: तेरे क्षेत्र में
  rationale: גְּבוּל सीमा और उससे घिरे भूभाग दोनों को सूचित कर सकता है; यहाँ आने की गति के साथ ‘तेरे क्षेत्र में’ सहज हिन्दी है और फ़िरौन के अधिकार-क्षेत्र का भाव रखता है।
