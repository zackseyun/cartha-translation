source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם יְהִ֨י כֵ֤ן יְהוָה֙ עִמָּ/כֶ֔ם כַּ/אֲשֶׁ֛ר אֲשַׁלַּ֥ח אֶתְ/כֶ֖ם וְ/אֶֽת טַפְּ/כֶ֑ם רְא֕וּ כִּ֥י רָעָ֖ה נֶ֥גֶד פְּנֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/010.yaml
  text: And he said to them[a], “May Yahweh indeed be with you, if I ever send you and your little ones out! See[b], for evil is before your faces.”
translation:
  language: hi
  text: तब उसने उनसे कहा[a], “यदि मैं कभी तुम्हें और तुम्हारे नन्हे बच्चों को जाने दूँ, तो याहवे सचमुच तुम्हारे साथ हों! देखो[b], बुराई तुम्हारे सामने है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब मैं तुम्हें और तुम्हारे नन्हे बच्चों को जाने दूँ, तब याहवे तुम्हारे साथ हों।” यह सम्भवतः व्यंग्य में कहा गया था।
    reason: alternative_reading
  - marker: b
    text: इब्रानी वाक्य अस्पष्ट है; इसका अर्थ “विपत्ति तुम्हारे सामने है” या “तुम्हारे मन में बुराई है” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי כֵן יְהוָה עִמָּכֶם
  choice: याहवे तुम्हारे साथ वैसे ही रहे
  rationale: यह रूप इच्छासूचक कथन और כֵּן के व्यंग्यपूर्ण बल को बनाए रखता है; प्रसंग में फ़िरौन की बात स्पष्टतः कटाक्षपूर्ण सुनाई देती है।
- source_word: כַּאֲשֶׁר אֲשַׁלַּח
  choice: जैसे मैं ... जाने दूँगा
  rationale: כַּאֲשֶׁר का मूल तुलनात्मक/कालवाचक स्वर बनाए रखते हुए यह हिन्दी में फ़िरौन का व्यंग्य व्यक्त करता है, बिना शर्तार्थ को मुख्य पाठ में अनिवार्य बनाए।
- source_word: טַפְּכֶם
  choice: तुम्हारे बाल-बच्चों
  rationale: טַף मुख्यतः छोटे बच्चों को सूचित करता है। ‘बाल-बच्चे’ सहज आधुनिक हिन्दी है और वयस्क आश्रितों तक अर्थ को अनावश्यक रूप से नहीं फैलाता।
- source_word: רְאוּ
  choice: देख लो
  rationale: आज्ञार्थक रूप को निकटता से रखता है और प्रसंग में चेतावनी/धमकी का भाव भी ग्रहण कर सकता है।
- source_word: כִּי רָעָה נֶגֶד פְּנֵיכֶם
  choice: क्योंकि बुराई तुम्हारे सामने है
  rationale: यह इब्रानी की संक्षिप्त संरचना के निकट है और इस अस्पष्टता को बनाए रखता है कि सामने विपत्ति है या उनके इरादे बुरे हैं।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम को नाम के रूप में पारदर्शी ढंग से प्रस्तुत किया गया है।
- issue: फ़िरौन की अंतिम चेतावनी की अस्पष्टता
  choice: बुराई तुम्हारे सामने है
  alternative: विपत्ति तुम्हारे सामने है / तुम्हारे मन में बुराई है
  rationale: רָעָה और נֶגֶד פְּנֵיכֶם दोनों मिलकर एकाधिक अर्थों की अनुमति देते हैं; मुख्य पाठ किसी एक अर्थ को निर्णायक नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और मौखिक संवाद के अनुकूल शैली। ‘वैसे ही...जैसे’ से मूल की विडंबनापूर्ण तुलना बचती है; पादटिप्पणी वैकल्पिक कालवाचक समझ स्पष्ट करती है।
