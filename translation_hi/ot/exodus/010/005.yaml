  text: וְ/כִסָּה֙ אֶת עֵ֣ין הָ/אָ֔רֶץ וְ/לֹ֥א יוּכַ֖ל לִ/רְאֹ֣ת אֶת הָ/אָ֑רֶץ וְ/אָכַ֣ל אֶת יֶ֣תֶר הַ/פְּלֵטָ֗ה הַ/נִּשְׁאֶ֤רֶת לָ/כֶם֙ מִן הַ/בָּרָ֔ד וְ/אָכַל֙ אֶת כָּל הָ/עֵ֔ץ הַ/צֹּמֵ֥חַ לָ/כֶ֖ם מִן הַ/שָּׂדֶֽה־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/005.yaml
  text: And it will cover the surface of the land[a], so that one will not be able to see the land; and it will eat what remains of the survivors left to you from the hail[b], and it will eat every tree growing for you out of the field.
translation:
  language: hi
  text: वह धरती की सतह[a] को ढक देगा, जिससे धरती दिखाई नहीं देगी। ओलों से बचा हुआ जो कुछ तुम्हारे लिए शेष है[b], उसे वह खा जाएगा; और खेत में तुम्हारे लिए उगने वाले हर पेड़ को भी वह खा जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘धरती की आँख’ है; यह धरती की दिखाई देने वाली सतह के लिए इब्रानी मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘बच निकले हुए का वह शेष भाग, जो ओलों के बाद तुम्हारे लिए बचा है।’
    reason: alternative_reading
lexical_decisions:
- source_word: וְכִסָּה
  choice: वह ... ढक देगा
  rationale: כסה का अर्थ ‘ढकना’ है। प्रसंग आने वाली टिड्डियों की विपत्ति की घोषणा है, इसलिए हिन्दी में भविष्यकाल उपयुक्त है। एकवचन क्रिया टिड्डी-दल को सामूहिक इकाई के रूप में दर्शाती है।
- source_word: עֵין הָאָרֶץ
  choice: धरती की सतह
  rationale: इस इब्रानी मुहावरे का शाब्दिक अर्थ ‘धरती की आँख’ है, पर आशय धरती की दिखाई देने वाली सतह से है।
- source_word: וְלֹא יוּכַל לִרְאֹת אֶת הָאָרֶץ
  choice: जिससे धरती दिखाई नहीं देगी
  rationale: मूल में अनिश्चित कर्ता के साथ भाव है कि कोई धरती को देख न सकेगा। हिन्दी का भाववाच्य वही अर्थ स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יֶתֶר הַפְּלֵטָה הַנִּשְׁאֶרֶת לָכֶם מִן הַבָּרָד
  choice: ओलों से बचा हुआ जो कुछ तुम्हारे लिए शेष है
  rationale: यह अभिव्यक्ति ओलों के विनाश से बची और अब भी शेष कृषि-उपज को सूचित करती है। ‘जो कुछ’ निर्जीव उपज के संदर्भ में स्वाभाविक है और मूल की ‘बचे हुए शेष’ वाली परतदार अभिव्यक्ति का अर्थ रखता है।
- source_word: וְאָכַל
  choice: खा जाएगा
  rationale: אכל सामान्य और ठोस क्रिया ‘खाना’ है; ‘नष्ट करना’ अर्थ को अनावश्यक रूप से सामान्य बना देता। एकवचन रूप सामूहिक टिड्डी-दल के अनुरूप रखा गया है।
- source_word: כָּל הָעֵץ
  choice: हर पेड़
  rationale: כל के वितरणात्मक बल और עץ के एकवचन रूप को स्वाभाविक हिन्दी में ‘हर पेड़’ व्यक्त करता है।
- source_word: הַצֹּמֵחַ לָכֶם מִן הַשָּׂדֶה
  choice: मैदान में तुम्हारे लिए उगने वाले
  rationale: צמח का अर्थ ‘उगना’ है। מן यहाँ खेत/मैदान से उगने के उद्गम को दर्शाता है, जिसे हिन्दी में स्वाभाविक रूप से ‘मैदान में ... उगने वाले’ कहा गया है; לָכֶם का लाभ अथवा संबंध-सूचक भाव ‘तुम्हारे लिए’ से सुरक्षित है।
theological_decisions:
- issue: टिड्डी-दल के लिए सामूहिक एकवचन
  choice: ‘वह’ और एकवचन क्रियाएँ
  alternative: ‘वे’ और बहुवचन क्रियाएँ
  rationale: इब्रानी पाठ में क्रियाएँ एकवचन हैं और पिछले प्रसंग की टिड्डी को सामूहिक इकाई मानती हैं। हिन्दी में कुछ असामान्यता के बावजूद इस रूप को बनाए रखने से मूल व्याकरण और सामूहिक चित्र सुरक्षित रहता है; इससे कोई अतिरिक्त धर्मसैद्धांतिक अर्थ नहीं निकाला गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। ‘धरती’ और ‘मैदान’ इस कृषि-संदर्भ में स्वाभाविक हैं। मूल के लंबे वाक्य को पठनीयता के लिए दो वाक्यों में बाँटा गया है, जबकि उसके क्रम और अर्थ-संबंध को सुरक्षित रखा गया है।
