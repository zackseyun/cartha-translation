  yaml_path: translation/ot/exodus/010/008.yaml
  text: So Moses and Aaron were brought back to Pharaoh[a], and he said to them, “Go, serve Yahweh your God. Who are the ones going?”
translation:
  language: hi
  text: तब मूसा और हारून को फ़िरौन के पास वापस लाया गया। उसने उनसे कहा, “जाओ, अपने परमेश्वर याहवे की सेवा करो। कौन-कौन जा रहे हैं?”[क]
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: इब्रानी में शाब्दिक रूप से, “कौन और कौन जा रहे हैं?”—यह मुहावरा इस बात की सटीक पहचान पूछता है कि कौन-कौन जाने की अनुमति पाएँगे।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוּשַׁב
  choice: वापस लाया गया
  rationale: होफ़ाल रूप कारणवाचक कर्मवाच्य है; यह अनुवाद स्वाभाविक हिन्दी में बताता है कि मूसा और हारून को किसी ने फ़िरौन के पास लौटाया। संयुक्त कर्ता के साथ हिन्दी में निकटतम पुल्लिंग एकवचन ‘हारून’ के अनुसार ‘लाया गया’ स्वाभाविक है।
- source_word: אֶת מֹשֶׁה וְאֶת אַהֲרֹן
  choice: मूसा और हारून
  rationale: प्रत्यक्ष कर्मसूचक אֶת का हिन्दी में अलग अनुवाद आवश्यक नहीं; नामों के प्रचलित हिन्दी रूप रखे गए हैं।
- source_word: אֶל פַּרְעֹה
  choice: फ़िरौन के पास
  rationale: אֶל यहाँ फ़िरौन की ओर ले जाए जाने को दर्शाता है; ‘के पास’ आधुनिक हिन्दी में स्वाभाविक गंतव्य-सूचक प्रयोग है।
- source_word: לְכוּ
  choice: जाओ
  rationale: הלך का बहुवचन आज्ञार्थक रूप सीधे और स्वाभाविक ढंग से अनूदित है।
- source_word: עִבְדוּ
  choice: सेवा करो
  rationale: עבד का अर्थ यहाँ परमेश्वर की सेवा करना है, जिसमें उपासना सम्मिलित हो सकती है; ‘सेवा करो’ अर्थ को केवल अनुष्ठानिक उपासना तक सीमित नहीं करता।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को हिन्दी बाइबलीय परंपरा में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ रूप में प्रस्तुत किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: אֱלֹהֵיכֶם
  choice: अपने परमेश्वर
  rationale: द्वितीय पुरुष बहुवचन संबंधवाचक प्रत्यय को हिन्दी आज्ञार्थक वाक्य में स्वाभाविक आत्मवाचक ‘अपने’ से व्यक्त किया गया है।
- source_word: מִי וָמִי
  choice: कौन-कौन
  rationale: इब्रानी की दोहराई हुई प्रश्नात्मक अभिव्यक्ति को हिन्दी के स्वाभाविक वितरणात्मक प्रश्न ‘कौन-कौन’ से व्यक्त किया गया है; इससे जाने वालों की स्पष्ट पहचान पूछे जाने का भाव बना रहता है।
- source_word: הַהֹלְכִים
  choice: जा रहे हैं
  rationale: लेखयुक्त कृदंत जाने वाले व्यक्तियों की ओर संकेत करता है; ‘कौन-कौन जा रहे हैं?’ हिन्दी में उसी समूह की पहचान पूछता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत नाम स्पष्ट रूप से उपस्थित है, इसलिए उसे ‘प्रभु’ जैसी उपाधि से नहीं बदला गया। ‘यहोवा’ सामान्य हिन्दी पाठकों के लिए प्रतिष्ठित और तुरंत पहचाना जाने वाला रूप है; ‘याहवे’ अधिक निकट आधुनिक विद्वत्तापूर्ण लिप्यंतरण है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘कौन-कौन’ मूल के מִי וָמִי की पुनरुक्ति और फ़िरौन द्वारा व्यक्तियों की ठीक पहचान पूछने के भाव को बिना अनावश्यक व्याख्या के व्यक्त करता है।
