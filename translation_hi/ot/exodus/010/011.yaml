  text: לֹ֣א כֵ֗ן לְכֽוּ נָ֤א הַ/גְּבָרִים֙ וְ/עִבְד֣וּ אֶת יְהוָ֔ה כִּ֥י אֹתָ֖/הּ אַתֶּ֣ם מְבַקְשִׁ֑ים וַ/יְגָ֣רֶשׁ אֹתָ֔/ם מֵ/אֵ֖ת פְּנֵ֥י פַרְעֹֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/011.yaml
  text: No! Let the men go now and serve Yahweh[b][a], for that is what you are seeking.” Then he drove them out from Pharaoh’s presence.
translation:
  language: hi
  text: “नहीं, ऐसा नहीं![a] अब केवल तुम पुरुष ही[b] जाओ और याहवे की सेवा करो, क्योंकि तुम यही माँग रहे हो।” तब उसने उन्हें फ़िरौन के सामने से बाहर निकाल दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “नहीं!”—फ़िरौन की अचानक अस्वीकृति का अधिक मुहावरेदार रूप।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में विशेष रूप से “पुरुष”; पूरे लोगों का उल्लेख नहीं है।
    reason: lexical_clarification
lexical_decisions:
- source_word: לֹא כֵן
  choice: ऐसा नहीं!
  rationale: यह फ़िरौन की अचानक और स्पष्ट अस्वीकृति को व्यक्त करता है तथा इब्रानी पदबंध के रूप को भी स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: לְכוּ נָא
  choice: अब ... जाकर
  rationale: नָא यहाँ विनम्र ‘कृपया’ से अधिक तात्कालिकता और dismissive urgency दिखाता है; ‘अब’ प्रसंग के अनुकूल है।
- source_word: הַגְּבָרִים
  choice: तुम पुरुष ही
  rationale: गְּבָרִים विशेष रूप से पुरुषों को सूचित करता है। ‘ही’ फ़िरौन की सीमित अनुमति को स्पष्ट करता है, जिसमें स्त्रियाँ और बच्चे शामिल नहीं हैं।
- source_word: וְעִבְדוּ אֶת יְהוָה
  choice: याहवे की सेवा करो
  rationale: עבד का अर्थ यहाँ परमेश्वर की सेवा करना और उसकी उपासना करना दोनों समेट सकता है; ‘सेवा करो’ इस व्यापक अर्थ को सुरक्षित रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में ध्वन्यात्मक रूप से प्रस्तुत किया गया है।
- source_word: כִּי אֹתָהּ אַתֶּם מְבַקְשִׁים
  choice: क्योंकि तुम यही माँग रहे हो
  rationale: स्त्रीलिंग सर्वनाम אֹתָהּ का संकेत निहित माँग या चाही गई बात की ओर है; हिन्दी में ‘यही’ उस संदर्भ को बिना अनावश्यक रूप से निश्चित किए स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וַיְגָרֶשׁ אֹתָם
  choice: तब उसने उन्हें ... निकाल दिया
  rationale: एकवचन क्रिया का स्वाभाविक कर्ता प्रसंग में फ़िरौन है। ‘निकाल दिया’ बलपूर्वक विदा किए जाने को सहज हिन्दी में व्यक्त करता है।
- source_word: מֵאֵת פְּנֵי פַרְעֹה
  choice: फ़िरौन के सामने से
  rationale: यह इब्रानी दरबारी मुहावरे का निकट और स्पष्ट हिन्दी रूप है; इसका अर्थ फ़िरौन की उपस्थिति से बाहर किया जाना है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसे किसी उपाधि से बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: फ़िरौन की अनुमति में लिंग-विशिष्ट सीमा
  choice: तुम पुरुष ही
  alternative: तुम लोग; केवल वयस्क पुरुष
  rationale: मूल शब्द पुरुषों को निर्दिष्ट करता है। इसे सामान्य ‘लोग’ करना फ़िरौन की आंशिक रियायत और कथा के तनाव को मिटा देता। ‘वयस्क’ मूल में स्पष्ट नहीं है, इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। फ़िरौन की वाणी संक्षिप्त और आदेशात्मक है। ‘तुम पुरुष ही’ मूल की लिंग-विशिष्ट सीमा को बनाए रखता है, जबकि ‘सेवा करो’ उपासना और आज्ञापालन—दोनों की अर्थ-छाया खुली रखता है।
