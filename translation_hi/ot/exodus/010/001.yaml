  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה בֹּ֖א אֶל פַּרְעֹ֑ה כִּֽי אֲנִ֞י הִכְבַּ֤דְתִּי אֶת לִבּ/וֹ֙ וְ/אֶת לֵ֣ב עֲבָדָ֔י/ו לְמַ֗עַן שִׁתִ֛/י אֹתֹתַ֥/י אֵ֖לֶּה בְּ/קִרְבּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/001.yaml
  text: Then Yahweh said to Moses[a], "Go in to Pharaoh, because I have hardened his heart and the heart of his servants[b], so that I may set these signs of mine among them."
translation:
  language: hi
  text: तब यहोवा ने मूसा से कहा, “फ़िरौन के पास जा, क्योंकि मैंने उसके हृदय और उसके सेवकों के हृदय को कठोर कर दिया है[a], ताकि मैं अपने ये चिह्न उसके बीच में रखूँ[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “मैंने उसके हृदय और उसके सेवकों के हृदय को भारी कर दिया है।” यहाँ यह मुहावरा उनके हृदय को कठोर या अनुत्तरदायी करने का भाव देता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से, “उसके बीच में।” इसका संकेत विशेष रूप से फ़िरौन की ओर या व्यापक रूप से उसके दरबार और सेवकों सहित उसके परिवेश की ओर हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नामरूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: וַיֹּאמֶר
  choice: तब ... कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में घटनाक्रम स्पष्ट करता है।
- source_word: בֹּא אֶל־פַּרְעֹה
  choice: फ़िरौन के पास जा
  rationale: בוא यहाँ फ़िरौन के समक्ष जाने का आदेश देता है। ‘के पास जा’ आधुनिक हिन्दी में स्वाभाविक है और संदर्भगत दिशा को बनाए रखता है।
- source_word: הִכְבַּדְתִּי
  choice: कठोर कर दिया है
  rationale: इस हिफ़ील रूप का शाब्दिक अर्थ ‘भारी किया’ है, पर हृदय के साथ यह अनुत्तरदायी या हठी बनाने का मुहावरा है। शाब्दिक चित्र पादटिप्पणी में रखा गया है।
- source_word: לִבּוֹ ... לֵב עֲבָדָיו
  choice: उसके हृदय और उसके सेवकों के हृदय
  rationale: ‘हृदय’ इब्रानी में विचार, इच्छा और निर्णय के भीतरी केंद्र को दर्शाता है; हिन्दी में यह पारंपरिक और अर्थपूर्ण समतुल्य है।
- source_word: עֲבָדָיו
  choice: उसके सेवकों
  rationale: दरबारी संदर्भ में यह फ़िरौन के अधीन सेवकों या अधिकारियों को सूचित कर सकता है। ‘सेवक’ मूल शब्द की व्यापकता बचाता है।
- source_word: לְמַעַן
  choice: ताकि
  rationale: यह उद्देश्य बताता है; ‘ताकि’ आधुनिक हिन्दी का स्पष्ट और स्वाभाविक प्रयोजनसूचक है।
- source_word: שִׁתִי
  choice: प्रकट करूँ
  rationale: שׁית का मूल भाव रखना/स्थापित करना है; चिह्नों के संदर्भ में ‘प्रकट करूँ’ हिन्दी में उनके सामने उन्हें घटित करने का आशय स्वाभाविक रूप से देता है।
- source_word: אֹתֹתַי אֵלֶּה
  choice: अपने ये चिह्न
  rationale: यह चयन अधिकारसूचक प्रत्यय और संकेतवाचक ‘ये’ दोनों को बनाए रखता है।
- source_word: בְּקִרְבּוֹ
  choice: उसके बीच
  rationale: मसोरेटिक रूप एकवचन है—‘उसके बीच/मध्य में’। अस्पष्ट संदर्भ को बहुवचन बनाकर चुपचाप हल नहीं किया गया।
theological_decisions:
- issue: फ़िरौन के हृदय को परमेश्वर द्वारा कठोर किया जाना
  choice: मैंने ... हृदय को कठोर कर दिया है
  alternative: मैंने ... हृदय को भारी कर दिया है
  rationale: पद इस क्रिया का सीधा कर्ता यहोवा को बताता है। अनुवाद इस कथन को नरम नहीं करता और ईश्वरीय प्रभुता तथा मानवीय उत्तरदायित्व के संबंध को पद से आगे जाकर नहीं सुलझाता।
- issue: בְּקִרְבּוֹ का संदर्भ
  choice: उसके बीच
  alternative: उनके बीच
  rationale: पाठ का व्याकरणिक रूप एकवचन है और संभवतः फ़िरौन को सूचित करता है; फिर भी निकटवर्ती सेवकों के उल्लेख के कारण उसके दरबार या परिवेश का व्यापक आशय संभव है। मुख्य पाठ एकवचन बचाता है और विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘यहोवा’, ‘हृदय’ और ‘चिह्न’ जैसे बाइबलीय पदों को बनाए रखते हुए वाक्य-विन्यास स्वाभाविक हिन्दी का है।
