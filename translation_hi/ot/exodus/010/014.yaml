base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/014.yaml
  text: And the locusts came up over all the land of Egypt and settled in every territory of Egypt[a]—an extremely severe swarm. never before had there been locusts like it, nor will there be again after it.
translation:
  language: hi
  text: टिड्डियाँ मिस्र के सारे देश पर चढ़ आईं और मिस्र के पूरे क्षेत्र में आ बैठीं। वे अत्यंत भयंकर थीं[a]। उनसे पहले ऐसी टिड्डियाँ कभी नहीं हुई थीं और न उनके बाद फिर कभी ऐसी होंगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ ‘बहुत भारी’ है। यहाँ यह अभिव्यक्ति टिड्डियों के प्रकोप की असाधारण विकरालता को बताती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: चढ़ आईं
  rationale: עלה के ‘ऊपर चढ़ने/आने’ के बिंब को बनाए रखते हुए टिड्डियों के देश पर फैल जाने को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הָאַרְבֶּה
  choice: टिड्डियाँ
  rationale: इब्रानी में एकवचन रूप सामूहिक अर्थ में है; हिन्दी में इस विशाल आक्रमण के लिए बहुवचन अधिक स्वाभाविक है।
- source_word: עַל כָּל אֶרֶץ מִצְרַיִם
  choice: मिस्र के सारे देश पर
  rationale: यहाँ אֶרֶץ से मिस्र का भूभाग अभिप्रेत है; ‘सारे देश पर’ व्यापक फैलाव को स्पष्ट रखता है।
- source_word: וַיָּנַח
  choice: आ बैठीं
  rationale: נוח के ठहरने या विश्राम करने के अर्थ को टिड्डियों के भूमि पर उतरकर जम जाने के लिए सहज हिन्दी में व्यक्त करता है।
- source_word: בְּכֹל גְּבוּל מִצְרָיִם
  choice: मिस्र के पूरे क्षेत्र में
  rationale: גְּבוּל यहाँ केवल सीमा-रेखा नहीं, मिस्र का समूचा सीमाबद्ध भूभाग दर्शाता है।
- source_word: כָּבֵד מְאֹד
  choice: अत्यंत भयंकर
  rationale: शाब्दिक ‘बहुत भारी’ इस प्रसंग में टिड्डियों के असाधारण रूप से विकट प्रकोप को बताता है; मुख्य पाठ में स्वाभाविक हिन्दी रखी गई है और शाब्दिक बिंब पाद-टिप्पणी में दिया गया है।
- source_word: לְפָנָיו ... וְאַחֲרָיו
  choice: उनसे पहले ... उनके बाद
  rationale: इब्रानी प्रत्यय सामूहिक टिड्डी-आक्रमण की ओर संकेत करते हैं; हिन्दी बहुवचन उसी सामूहिक संदर्भ को स्वाभाविक ढंग से बनाए रखता है।
