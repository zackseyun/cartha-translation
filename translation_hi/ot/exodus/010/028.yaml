base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/028.yaml
  text: Then Pharaoh said to him[a], “Go away from me. Watch yourself; do not see my face again, for on the day you see my face[b], you will die.”
translation:
  language: hi
  text: तब फ़िरौन ने उससे कहा, “मेरे सामने से चला जा। सावधान रह! फिर कभी मेरा मुख मत देखना[a], क्योंकि जिस दिन तू मेरा मुख देखेगा[b], उस दिन तू मर जाएगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मेरे मुख को देखने में फिर न जोड़ना।” हिब्रू का यह मुहावरा “फिर कभी मेरा मुख मत देखना” अर्थात् दोबारा मेरे सामने मत आना, के अर्थ में है।
    reason: lexical_alternative
  - marker: b
    text: “मेरा मुख” का अर्थ “मेरी उपस्थिति” भी हो सकता है, पर हिब्रू पाठ बल देने के लिए “मुख” को दोहराता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לוֹ פַרְעֹה
  choice: तब फ़िरौन ने उससे कहा
  rationale: वाव-क्रमिक कथानक को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में क्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לֵךְ מֵעָלָי
  choice: मेरे सामने से चला जा
  rationale: यह कठोर विदाई का आदेश है। हिन्दी मुहावरा धमकीपूर्ण स्वर बनाए रखते हुए ‘मेरी उपस्थिति से दूर हो जा’ का भाव देता है।
- source_word: הִשָּׁמֶר לְךָ
  choice: सावधान रह
  rationale: निफ़अल आज्ञार्थ और आत्म-संबंधी दत्तिव चेतावनी को तीखा और सीधा बनाते हैं; ‘सावधान रह’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: אַל תֹּסֶף רְאוֹת פָּנַי
  choice: फिर कभी मुझे अपना मुँह मत दिखाना
  rationale: शाब्दिक संरचना ‘मेरा मुख देखने में फिर न जोड़ना’ हिन्दी में अप्राकृतिक है। प्रसंग में फ़िरौन मूसा को अपने सामने दोबारा न आने की धमकी देता है; चुना हुआ मुहावरा वही निषेध स्वाभाविक हिन्दी में रखता है।
- source_word: פָּנַי
  choice: मुझे अपना मुँह दिखाना
  rationale: हिब्रू ‘मेरा मुख देखना’ उपस्थिति/सामना करने का द्योतक है। हिन्दी का ‘अपना मुँह दिखाना’ उसी प्रत्यक्ष भेंट को स्वाभाविक रूप से व्यक्त करता है, यद्यपि व्याकरणिक दृष्टिकोण उलटता है।
- source_word: בְּיוֹם
  choice: जिस दिन … उस दिन
  rationale: हिब्रू के ‘दिन’ को बनाए रखता है और धमकी की गंभीर, निर्णायक अभिव्यक्ति देता है; केवल ‘जब’ की अपेक्षा स्रोत के निकट है।
- source_word: תָּמוּת
  choice: तू मर जाएगा
  rationale: प्रत्यक्ष धमकी का निश्चित भाव स्पष्ट करता है। ‘तू’ फ़िरौन के अपमानजनक और प्रभुत्वपूर्ण संबोधन के अनुकूल है।
