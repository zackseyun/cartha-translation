base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/021.yaml
  text: Then Yahweh said to Moses[a], “Stretch out your hand toward the sky, so that there may be darkness over the land of Egypt, and the darkness may be felt.”
translation:
  language: hi
  text: तब याहवे ने मूसा से कहा, “अपना हाथ आकाश की ओर बढ़ा, ताकि मिस्र के देश पर अंधकार छा जाए और अंधकार महसूस हो।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू का अर्थ “और अंधकार महसूस हो” या संभवतः “और कोई अंधकार को टटोल सके” हो सकता है। यहाँ प्रयुक्त क्रिया दुर्लभ है और अंधकार के मानो स्पर्शनीय होने पर बल देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के विशिष्ट वाचागत नाम को उपाधि से बदलने के बजाय हिन्दी लिपि में ध्वन्यंतरित किया गया है।
- source_word: נְטֵה יָדְךָ
  choice: अपना हाथ … बढ़ा
  rationale: आज्ञार्थक क्रिया और एकवचन संबोधन को स्वाभाविक आधुनिक हिन्दी में सीधे व्यक्त करता है।
- source_word: עַל הַשָּׁמַיִם
  choice: आकाश की ओर
  rationale: इस संकेतात्मक हावभाव के प्रसंग में עַל दिशा का बोध कराता है; ‘आकाश की ओर’ हिन्दी में स्वाभाविक है।
- source_word: וִיהִי חֹשֶׁךְ
  choice: ताकि … अंधकार छा जाए
  rationale: हिब्रू के इच्छार्थक/परिणामसूचक बल को बनाए रखते हुए ‘अंधकार होना’ को स्वाभाविक हिन्दी मुहावरे में व्यक्त करता है।
- source_word: עַל אֶרֶץ מִצְרָיִם
  choice: मिस्र देश पर
  rationale: אֶרֶץ को ‘देश’ के रूप में स्पष्ट रखते हुए भौगोलिक विस्तार को व्यक्त करता है।
- source_word: וְיָמֵשׁ חֹשֶׁךְ
  choice: और उस अंधकार को महसूस किया जा सके
  rationale: दुर्लभ क्रिया का प्रचलित अर्थ ग्रहण करता है, जिसमें अंधकार की स्पर्शनीय अथवा अत्यंत घनी अनुभूति पर बल है; अनिश्चितता पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में विशिष्ट ईश्वरीय नाम सीधे आया है; ‘याहवे’ उसका आधुनिक हिन्दी ध्वन्यंतरण है और उसे सामान्य उपाधि में नहीं बदलता।
- issue: अंतिम उपवाक्य में अंधकार की प्रकृति
  choice: उस अंधकार को महसूस किया जा सके
  alternative: कोई अंधकार को टटोल सके; अंधकार स्पर्शनीय हो
  rationale: पाठ की दुर्लभ क्रिया को अत्यंत घने, मानो स्पर्शनीय अंधकार के रूप में व्यक्त किया गया है, बिना इसे किसी अतिरिक्त अलौकिक सिद्धांत से जोड़ने के।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘छा जाए’ हिन्दी में व्यापक अंधकार के आने का स्वाभाविक प्रयोग है, जबकि अंतिम स्वतंत्र उपवाक्य और पादटिप्पणी मूल की दुर्लभ अभिव्यक्ति तथा उसकी अस्पष्टता को सुरक्षित रखते हैं।
