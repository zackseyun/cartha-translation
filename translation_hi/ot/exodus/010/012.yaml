base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/012.yaml
  text: Then Yahweh said to Moses[a], “Stretch out your hand over the land of Egypt for the locusts, so that they may come up over the land of Egypt and eat every plant of the land[b], everything that the hail has left.”
translation:
  language: hi
  text: तब याहवे ने मूसा से कहा, “मिस्र देश के ऊपर टिड्डियों के लिए[a][b] अपना हाथ फैला, ताकि वे मिस्र देश पर चढ़ आएँ और देश की सारी वनस्पति—वह सब जो ओलों ने छोड़ दिया है—खा जाएँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘टिड्डी के लिए/संबंध में’। यहाँ पूर्वसर्ग का अर्थ कठिन है; ‘टिड्डी के विरुद्ध’ या ‘टिड्डी पर’ जैसे अधिक शाब्दिक अनुवाद भी संभव हैं।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में ‘टिड्डी’ और उससे जुड़ी क्रियाएँ एकवचन में हैं, लेकिन यह शब्द पूरे टिड्डी-दल के लिए सामूहिक अर्थ में प्रयुक्त हुआ है; इसलिए हिन्दी में बहुवचन रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: נְטֵה יָדְךָ
  choice: अपना हाथ ... बढ़ा
  rationale: आज्ञार्थक क्रिया और शरीर-अंग के सीधे अर्थ को स्वाभाविक आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: עַל אֶרֶץ מִצְרַיִם
  choice: मिस्र देश पर
  rationale: עַל का स्थानगत अर्थ और אֶרֶץ का ‘देश/भूमि’ अर्थ संक्षिप्त तथा स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: בָּאַרְבֶּה
  choice: टिड्डियों के लिए
  rationale: यहाँ ב का प्रयोग कठिन है; ‘के लिए’ संकेत करता है कि हाथ बढ़ाना टिड्डी-विपत्ति के संबंध में है, पर संभावित दूसरे अर्थों को पादटिप्पणी में रखा गया है।
- source_word: אַרְבֶּה
  choice: टिड्डियों
  rationale: इब्रानी शब्द व्याकरणतः एकवचन होकर भी पूरे टिड्डी-दल के लिए सामूहिक रूप में प्रयुक्त है; हिन्दी में बहुवचन प्रसंग का अर्थ सहजता से देता है।
- source_word: וְיַעַל
  choice: ताकि वे ... चढ़ आएँ
  rationale: עלה के मूल ‘चढ़ना/ऊपर आना’ अर्थ को रखा गया है और उद्देश्यसूचक संबंध को हिन्दी में स्पष्ट किया गया है।
- source_word: כָּל עֵשֶׂב הָאָרֶץ
  choice: देश की सारी वनस्पति
  rationale: עֵשֶׂב यहाँ केवल घास नहीं बल्कि व्यापक हरियाली या वनस्पति को दर्शाता है।
- source_word: אֵת כָּל אֲשֶׁר הִשְׁאִיר הַבָּרָד
  choice: वह सब जो ओलों ने छोड़ दिया है
  rationale: पिछली ओला-विपत्ति के बाद बची हुई वनस्पति से संबंध को सीधा और स्पष्ट रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में आए व्यक्तिगत नाम को उपाधि से प्रतिस्थापित किए बिना हिन्दी लिपि में प्रस्तुत किया गया है; यह पाठ से आगे कोई सांप्रदायिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘वनस्पति’ कृषि और हरियाली दोनों को समेटता है। दोनों पादटिप्पणी-चिह्न संबंधित ‘टिड्डियों के लिए’ पदबंध पर लगाए गए हैं, क्योंकि पहली टिप्पणी पूर्वसर्ग और दूसरी सामूहिक एकवचन से संबंधित है।
