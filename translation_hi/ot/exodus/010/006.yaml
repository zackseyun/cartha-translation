base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/006.yaml
  text: And they will fill your houses[a], the houses of all your servants[b], and the houses of all Egypt—something your fathers and your fathers’ fathers have not seen from the day they were on the land until this day.” Then he turned and went out from Pharaoh.
translation:
  language: hi
  text: और वे तुम्हारे घरों, तुम्हारे सब सेवकों के घरों और सारे मिस्र के घरों को भर देंगी—ऐसा[a] तुम्हारे पुरखों और तुम्हारे पुरखों के पुरखों ने, जिस दिन से वे धरती[b] पर हैं, आज तक कभी नहीं देखा।” तब वह मुड़ा और फ़िरौन के पास से निकल गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, “जिसे तुम्हारे पुरखों और तुम्हारे पुरखों के पुरखों ने नहीं देखा।” यह उपवाक्य अभी वर्णित अभूतपूर्व विपत्ति की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: “धरती” का अनुवाद “भूमि” या “ज़मीन” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָלְאוּ
  choice: और वे ... भर देंगी
  rationale: संयोजक सहित पूर्ण क्रिया पिछले पद की भविष्यसूचक घोषणा को आगे बढ़ाती है। प्रसंग में इसका निहित कर्ता टिड्डियाँ हैं, इसलिए हिन्दी में स्त्रीलिंग बहुवचन रखा गया है।
- source_word: בָתֶּיךָ ... וּבָתֵּי כָל עֲבָדֶיךָ ... וּבָתֵּי כָל מִצְרַיִם
  choice: तुम्हारे घरों, तुम्हारे सब सेवकों के घरों और सारे मिस्र के घरों को
  rationale: तीनों बहुवचन संरचनाओं और फ़िरौन से उसके सेवकों तथा फिर सारे मिस्र तक बढ़ते दायरे को सुरक्षित रखा गया है।
- source_word: עֲבָדֶיךָ
  choice: तुम्हारे सब सेवकों
  rationale: राजदरबार के प्रसंग में यह पद सेवकों अथवा अधिकारियों को सूचित कर सकता है। ‘सेवक’ मूल के अधिक निकट है और सामाजिक स्थिति को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: אֲשֶׁר לֹא רָאוּ
  choice: ऐसा ... कभी नहीं देखा
  rationale: यह स्वाभाविक हिन्दी में अभी-अभी घोषित अभूतपूर्व विपत्ति की ओर संकेत करता है; सम्बन्धवाचक मूल संरचना का अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: אֲבֹתֶיךָ וַאֲבֹת אֲבֹתֶיךָ
  choice: तुम्हारे पुरखों और तुम्हारे पुरखों के पुरखों
  rationale: यह कई पिछली पीढ़ियों को समेटने वाली इब्रानी पुनरुक्ति को बनाए रखता है; ‘दादा-परदादा’ अर्थ को अनावश्यक रूप से सीमित कर देता।
- source_word: מִיּוֹם הֱיוֹתָם עַל הָאֲדָמָה
  choice: जिस दिन से वे धरती पर आए उस दिन से
  rationale: हिन्दी की सहज अभिव्यक्ति में उनके धरती पर होने के आरम्भ का कालगत भाव सुरक्षित है।
- source_word: הָאֲדָמָה
  choice: धरती
  rationale: यहाँ मानव पीढ़ियों के धरती पर होने का व्यापक मुहावरा अभिप्रेत है। ‘भूमि’ या ‘ज़मीन’ भी सम्भव हैं, इसलिए विकल्प पादटिप्पणी में रखा गया है।
- source_word: עַד הַיּוֹם הַזֶּה
  choice: आज तक
  rationale: यह इब्रानी कालगत मुहावरे का संक्षिप्त और स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: וַיִּפֶן וַיֵּצֵא מֵעִם פַּרְעֹה
  choice: तब वह मुड़ा और फ़िरौन के पास से निकल गया
  rationale: क्रमिक क्रियाओं और फ़िरौन की उपस्थिति से मूसा के चले जाने—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
