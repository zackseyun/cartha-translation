base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/015.yaml
  text: And it covered the face of the whole land[a], so that the land was darkened; and it ate every plant of the land and all the fruit of the trees that the hail had left. No green thing remained on the trees or on the plants of the field in all the land of Egypt.
translation:
  language: hi
  text: टिड्डियों के झुंड ने पूरे देश की सतह[a] को ढक लिया, और देश अँधेरा हो गया; उसने देश की सारी वनस्पति और पेड़ों के वे सारे फल खा लिए जिन्हें ओलावृष्टि ने बचा छोड़ा था। मिस्र के सारे देश में न पेड़ों पर, न खेत की वनस्पति में कोई हरी वनस्पति बची रही।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘सारे देश की आँख’; यह देश की दिखाई देने वाली सतह के लिए प्रयुक्त मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַס
  choice: उसने ... ढक लिया
  rationale: इब्रानी क्रिया एकवचन है और प्रसंग में टिड्डियों के सामूहिक झुंड की ओर संकेत करती है; हिन्दी का एकवचन सर्वनाम इस रूप को बनाए रखता है।
- source_word: עֵין כָּל הָאָרֶץ
  choice: सारे देश के मुख
  rationale: शाब्दिक अर्थ ‘सारे देश की आँख’ है, पर यह दृश्य सतह के लिए प्रयुक्त मुहावरा है। ‘देश का मुख’ मूल रूपक को बनाए रखते हुए हिन्दी में समझने योग्य है।
- source_word: וַתֶּחְשַׁךְ הָאָרֶץ
  choice: जिससे देश में अँधेरा छा गया
  rationale: क्रिया देश के अँधेरा हो जाने को व्यक्त करती है; यह अनुवाद आवरण के परिणाम और कथात्मक क्रम दोनों को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: וַיֹּאכַל
  choice: उसने ... खा लिए
  rationale: एकवचन क्रिया को सामूहिक झुंड के साथ एकवचन में रखा गया है; ‘खा लिए’ सामान्य और सीधा अर्थ देता है।
- source_word: כָּל עֵשֶׂב הָאָרֶץ
  choice: देश के सारे पौधे
  rationale: עֵשֶׂב केवल घास तक सीमित नहीं, बल्कि व्यापक वनस्पति को सूचित करता है; ‘पौधे’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: כָּל פְּרִי הָעֵץ
  choice: पेड़ों के ... सारे फल
  rationale: עֵץ रूप में एकवचन होते हुए यहाँ सामूहिक अर्थ रखता है; हिन्दी बहुवचन स्वाभाविक रूप से वितरणात्मक अर्थ व्यक्त करता है।
- source_word: אֲשֶׁר הוֹתִיר הַבָּרָד
  choice: जिन्हें ओलों ने छोड़ दिया था
  rationale: यह पहले की ओला-वृष्टि के बाद बची उपज को बताता है; पूर्ण भूतकाल कथानुक्रम को स्पष्ट करता है।
- source_word: וְלֹא נוֹתַר כָּל יֶרֶק
  choice: कोई हरी वस्तु बची
  rationale: नकारात्मक वाक्य-रचना के भीतर ‘कोई हरी वस्तु’ יֶרֶק की व्यापकता और विनाश की पूर्णता को बनाए रखता है।
- source_word: בָּעֵץ וּבְעֵשֶׂב הַשָּׂדֶה
  choice: न तो पेड़ों पर और न ही खेत के पौधों में
  rationale: मूल के दोनों क्षेत्रों को समानांतर हिन्दी संरचना में रखा गया है। पेड़ों के लिए ‘पर’ और खेत के पौधों के लिए ‘में’ स्वाभाविक प्रयोग हैं।
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: मिस्र के पूरे देश में
  rationale: यह क्षेत्रव्यापी विस्तार को स्पष्ट और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
