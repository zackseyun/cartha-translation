  text: וַ/יֵּ֨ט מֹשֶׁ֣ה אֶת מַטֵּ/הוּ֮ עַל אֶ֣רֶץ מִצְרַיִם֒ וַֽ/יהוָ֗ה נִהַ֤ג ר֥וּחַ קָדִים֙ בָּ/אָ֔רֶץ כָּל הַ/יּ֥וֹם הַ/ה֖וּא וְ/כָל הַ/לָּ֑יְלָה הַ/בֹּ֣קֶר הָיָ֔ה וְ/ר֨וּחַ֙ הַ/קָּדִ֔ים נָשָׂ֖א אֶת הָ/אַרְבֶּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/013.yaml
  text: So Moses stretched out his staff over the land of Egypt[a], and Yahweh drove an east wind over the land all that day and all the night. When morning came, the east wind had brought the locusts.
translation:
  language: hi
  text: तब मूसा ने अपनी लाठी मिस्र की भूमि पर फैलाई, और याहवे ने उस पूरे दिन और पूरी रात भूमि में पूर्वी हवा चलाई। जब भोर हुई, तब पूर्वी हवा टिड्डियों को ले आई।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּט
  choice: बढ़ाई
  rationale: נטה का अर्थ फैलाना या आगे बढ़ाना है; लाठी के साथ ‘बढ़ाई’ सहज और प्रसंगानुकूल है।
- source_word: מַטֵּהוּ
  choice: अपनी लाठी
  rationale: מַטֶּה यहाँ मूसा द्वारा प्रयुक्त staff/rod है; आधुनिक हिन्दी में ‘लाठी’ स्पष्ट और स्वाभाविक है।
- source_word: עַל אֶרֶץ מִצְרַיִם
  choice: मिस्र देश के ऊपर
  rationale: लाठी बढ़ाने की दिशा के साथ עַל का स्थानिक भाव ‘के ऊपर’ से सुरक्षित रहता है।
- source_word: וַיהוָה
  choice: यहोवा
  rationale: मूल पाठ के व्यक्तिगत वाचा-नाम יהוה को हिन्दी में प्रचलित नामरूप ‘यहोवा’ से प्रत्यक्ष रूप में रखा गया है।
- source_word: נִהַג
  choice: चलाई
  rationale: נהג में चलाने या हाँकने का सक्रिय भाव है; हवा के संबंध में ‘चलाई’ स्वाभाविक हिन्दी है और परमेश्वर की सक्रियता बनाए रखती है।
- source_word: רוּחַ קָדִים
  choice: पुरवाई
  rationale: यह पूर्व दिशा से आने वाली हवा है; ‘पुरवाई’ इसका संक्षिप्त, स्वाभाविक हिन्दी पद है।
- source_word: בָּאָרֶץ
  choice: देश में
  rationale: בְּ का सामान्य स्थानिक अर्थ ‘में’ है; हवा का पूरे देश में चलना हिन्दी में सहज है।
- source_word: כָּל הַיּוֹם הַהוּא וְכָל הַלָּיְלָה
  choice: उस पूरे दिन और पूरी रात
  rationale: दोनों अवधियों के साथ כָּל की अवधि-संबंधी पूर्णता को स्पष्ट रखते हुए मुहावरेदार हिन्दी दी गई है।
- source_word: הַבֹּקֶר הָיָה
  choice: जब सुबह हुई
  rationale: शाब्दिक काल-संक्रमण को स्वाभाविक हिन्दी उपवाक्य में व्यक्त किया गया है।
- source_word: נָשָׂא אֶת הָאַרְבֶּה
  choice: टिड्डियों को ले आई
  rationale: נשא का मूल उठाकर ले जाने/लाने का भाव बना रहता है और हवा द्वारा टिड्डियों के पहुँचने का आशय स्पष्ट होता है।
- source_word: הָאַרְבֶּה
  choice: टिड्डियों
  rationale: हिब्रू का एकवचन यहाँ सामूहिक है; हिन्दी में बहुवचन स्वाभाविक रूप से टिड्डी-दल को व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: व्यक्तिगत ईश्वरीय नाम को उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं किया गया; हिन्दी पाठकों में स्थापित प्रत्यक्ष नामरूप ‘यहोवा’ चुना गया है, जबकि स्वरांकन का ‘याहवे’ रूप भी सम्भव है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप। ‘पुरवाई’ सामान्य हिन्दी में पूर्व से आने वाली हवा को स्वाभाविक ढंग से व्यक्त करती है। कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि दिशात्मक अर्थ मुख्य पाठ में स्पष्ट है।
