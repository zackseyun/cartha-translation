translation:
  language: hi
  text: तब मूसा फ़िरौन के पास से निकल गया और उसने याहवे से विनती की।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: निकल गया
  rationale: יצא का क़ाल कथात्मक रूप ठोस रूप से बाहर जाने या किसी के पास से चले जाने को व्यक्त करता है; यहाँ फ़िरौन की उपस्थिति से निकलना अभिप्रेत है।
- source_word: מֵעִם פַּרְעֹה
  choice: फ़िरौन के पास से
  rationale: מֵעִם का शाब्दिक भाव ‘के साथ/पास होने से दूर’ है। ‘के पास से’ अलगाव और फ़िरौन की उपस्थिति छोड़ने—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיֶּעְתַּר
  choice: विनती की
  rationale: עתר इस प्रयोग में परमेश्वर से गंभीर और आग्रहपूर्ण निवेदन करने को दर्शाता है। ‘विनती की’ आधुनिक, गरिमापूर्ण हिन्दी में प्रार्थनापूर्ण याचना का भाव रखता है।
- source_word: אֶל יְהוָה
  choice: यहोवा से
  rationale: אֶל दिशा की दृष्टि से ‘की ओर/से’ है; हिन्दी में ‘विनती करना’ स्वाभाविक रूप से ‘से’ के साथ आता है। יְהוָה को उसके व्यक्तिगत नाम ‘यहोवा’ से व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में उपाधि नहीं, चतुरक्षरीय व्यक्तिगत नाम है। हिन्दी बाइबलीय प्रयोग में प्रचलित और सामान्य पाठकों के लिए पहचाना जाने वाला रूप ‘यहोवा’ चुना गया है; इसे ‘प्रभु’ से बदलकर नाम और उपाधि का भेद मिटाया नहीं गया।
- issue: עתר में प्रार्थना और आग्रह का संबंध
  choice: विनती की
  alternative: मन लगाकर प्रार्थना की; गिड़गिड़ाया
  rationale: क्रिया गंभीर याचना का अर्थ देती है, पर उसकी भावात्मक तीव्रता को अत्यधिक बढ़ाना उचित नहीं। ‘विनती की’ प्रार्थना और आग्रह दोनों की संभावना बनाए रखती है।
translation_notes:
  register: सरल, वर्तमान और गरिमापूर्ण मानक हिन्दी। कर्ता को संदर्भानुसार ‘मूसा’ कहकर स्पष्ट किया गया है, क्योंकि अलग पद के रूप में हिन्दी पाठ में केवल ‘वह’ अस्पष्ट हो सकता है।
