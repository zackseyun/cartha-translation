  text: וַ/יַּהֲפֹ֨ךְ יְהוָ֤ה רֽוּחַ יָם֙ חָזָ֣ק מְאֹ֔ד וַ/יִּשָּׂא֙ אֶת הָ֣/אַרְבֶּ֔ה וַ/יִּתְקָעֵ֖/הוּ יָ֣מָּ/ה סּ֑וּף לֹ֤א נִשְׁאַר֙ אַרְבֶּ֣ה אֶחָ֔ד בְּ/כֹ֖ל גְּב֥וּל מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/019.yaml
  text: And Yahweh turned a very strong west wind[a], and it carried away the locusts and drove them into the Sea of Reeds[b]. Not one locust remained in all the territory of Egypt.
translation:
  language: hi
  text: तब याहवे ने बहुत प्रबल समुद्री हवा[a] का रुख बदल दिया। उस हवा ने टिड्डियों को उड़ा ले जाकर सरकंडों के सागर[b] में धकेल दिया। मिस्र के पूरे प्रदेश में एक भी टिड्डी नहीं बची।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “समुद्र की हवा।” मिस्र की भौगोलिक स्थिति में इसका आशय पश्चिम से, अर्थात भूमध्य सागर की ओर से आने वाली हवा हो सकता है।'
    reason: cultural_note
  - marker: b
    text: 'इब्रानी: “सरकंडों का सागर”; परंपरागत अनुवाद: “लाल सागर।”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּהֲפֹךְ
  choice: हवा बदलकर ... हवा चलाई
  rationale: क्रिया का मूल अर्थ ‘पलटना’ या ‘बदलना’ है। हवा के संदर्भ में यह उसके बदलने और नई दिशा से चलने को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में उसका लिप्यंतरण किया गया है।
- source_word: רוּחַ יָם
  choice: समुद्र की ओर से ... हवा
  rationale: शाब्दिक अर्थ ‘समुद्र की हवा’ है। मिस्र के भौगोलिक संदर्भ में यह पश्चिम से आने वाली हवा है; मुख्य पाठ स्रोत की स्थानिक छवि रखता है और पाद-टिप्पणी दिशा स्पष्ट करती है।
- source_word: חָזָק מְאֹד
  choice: बहुत तेज़
  rationale: हवा के लिए ‘बहुत तेज़’ आधुनिक हिन्दी में स्वाभाविक है और इब्रानी तीव्रता को ठीक से व्यक्त करता है।
- source_word: וַיִּשָּׂא אֶת־הָאַרְבֶּה
  choice: टिड्डियों को उड़ाकर ले गई
  rationale: नשא का अर्थ उठाना या ले जाना है; हवा के कर्ता होने पर यह वाक्यांश प्रभाव को सहज हिन्दी में व्यक्त करता है।
- source_word: וַיִּתְקָעֵהוּ
  choice: उन्हें ... में धकेल दिया
  rationale: תקע यहाँ बलपूर्वक किसी दिशा या स्थान में पहुँचा देने का भाव रखता है। एकवचन प्रत्यय सामूहिक टिड्डी-दल को सूचित करता है, जिसे हिन्दी में बहुवचन से व्यक्त किया गया है।
- source_word: יָמָּה סּוּף
  choice: सरकंडों के सागर में
  rationale: स्थलनाम יַם־סוּף का स्रोत-सन्निकट अर्थ ‘सरकंडों का सागर’ है; पारंपरिक ‘लाल सागर’ पाद-टिप्पणी में दिया गया है।
- source_word: לֹא נִשְׁאַר אַרְבֶּה אֶחָד
  choice: एक भी टिड्डी नहीं बची
  rationale: इब्रानी के पूर्ण निषेध और ‘एक’ पर बल को संक्षिप्त, स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: בְּכֹל גְּבוּל מִצְרָיִם
  choice: मिस्र के पूरे क्षेत्र में
  rationale: גְּבוּל यहाँ केवल सीमा-रेखा नहीं, बल्कि उसके भीतर के समूचे भूभाग को दर्शाता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है। ‘याहवे’ उसका सीधा हिन्दी लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
- issue: יַם־סוּף स्थलनाम का अनुवाद
  choice: सरकंडों का सागर
  alternative: लाल सागर
  rationale: मुख्य पाठ में इब्रानी नाम का अर्थ सुरक्षित रखा गया है, जबकि पाठकों से परिचित पारंपरिक नाम पाद-टिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल किंतु गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘समुद्र की ओर से’ मूल की छवि और दिशागत अस्पष्टता बनाए रखता है; ‘पछुआ हवा’ को मुख्य पाठ में रखकर अर्थ को अनावश्यक रूप से सीमित नहीं किया गया।
