source:
  edition: WLC
  text: וַ/יִּקְרָ֨א פַרְעֹ֜ה אֶל מֹשֶׁ֗ה וַ/יֹּ֨אמֶר֙ לְכוּ֙ עִבְד֣וּ אֶת יְהוָ֔ה רַ֛ק צֹאנְ/כֶ֥ם וּ/בְקַרְ/כֶ֖ם יֻצָּ֑ג גַּֽם טַפְּ/כֶ֖ם יֵלֵ֥ךְ עִמָּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/024.yaml
  text: Then Pharaoh called to Moses and said[a], “Go, serve Yahweh. Only let your flocks and your herds remain behind[b]; even your little ones may go with you.”
translation:
  language: hi
  text: तब फ़िरौन ने मूसा को बुलाकर कहा, “जाओ, याहवे की सेवा करो। केवल तुम्हारी भेड़-बकरियाँ और गाय-बैल पीछे रह जाएँ[a]; तुम्हारे छोटे बच्चे भी तुम्हारे साथ जा सकते हैं[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “छोड़ दिए जाएँ।”
    reason: יֻצָּג के निष्क्रिय रूप को ‘पीछे रह जाएँ’ अथवा ‘छोड़ दिए जाएँ’ दोनों प्रकार से व्यक्त किया जा सकता है।
  - marker: b
    text: या, “तुम्हारे छोटे बच्चे भी तुम्हारे साथ जाएँ।”
    reason: יִלֵךְ का रूप संदर्भ में अनुमति अथवा निर्देश के भाव से समझा जा सकता है; ‘जा सकते हैं’ उसकी स्वाभाविक हिंदी अभिव्यक्ति है।
lexical_decisions:
- source_word: וַיִּקְרָא פַרְעֹה אֶל מֹשֶׁה
  choice: फ़िरौन ने मूसा को बुलाकर
  rationale: קרא אל यहाँ मूसा को बुलाने का भाव देता है। हिंदी में ‘मूसा को बुलाकर कहा’ स्वाभाविक है और अगले क्रियापद के साथ कथानक का प्रवाह बनाए रखता है।
- source_word: עִבְדוּ אֶת יְהוָה
  choice: यहोवा की सेवा करो
  rationale: עבד का मूल भाव ‘सेवा करना’ है और निर्गमन में फ़िरौन की सेवा के विपरीत यहोवा की सेवा करने की प्रमुख पुनरावृत्त धारणा को सुरक्षित रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिंदी में प्रचलित व्यक्तिगत नाम ‘यहोवा’ चतुरक्षरीय ईश-नाम को किसी उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- source_word: צֹאנְכֶם וּבְקַרְכֶם
  choice: तुम्हारी भेड़-बकरियाँ और गाय-बैल
  rationale: צֹאן छोटे पालतू पशुओं, विशेषतः भेड़-बकरियों, और בקר बड़े मवेशियों को सूचित करता है। ठोस हिंदी पद सामान्य पाठक के लिए स्पष्ट हैं।
- source_word: יֻצָּג
  choice: यहीं छोड़ दिए जाएँ
  rationale: יצג का होफ़ाल रूप यहाँ पशुओं को अपने स्थान पर पीछे छोड़ दिए जाने का निष्क्रिय भाव देता है; ‘यहीं’ संदर्भगत स्थान-बोध को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: גַּם טַפְּכֶם
  choice: तुम्हारे बाल-बच्चे भी
  rationale: טַף छोटे बच्चों अथवा परिवार के आश्रित बालकों के लिए सामूहिक पद है। ‘बाल-बच्चे’ आधुनिक सहज हिंदी में उस सामूहिक पारिवारिक अर्थ को व्यक्त करता है; גַּם को ‘भी’ से रखा गया है।
- source_word: יֵלֵךְ עִמָּכֶם
  choice: तुम्हारे साथ जा सकते हैं
  rationale: शाब्दिक भविष्यसूचक रूप ‘तुम्हारे साथ जाएँगे’ है, पर फ़िरौन की रियायत के संदर्भ में हिंदी का ‘जा सकते हैं’ अनुमति का आशय स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: ईश-नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ व्यक्तिगत ईश-नाम का प्रयोग करता है। हिंदी बाइबल परंपरा में अधिक परिचित ‘यहोवा’ सामान्य पाठकों के लिए सुलभ है और नाम को ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: עבד में सेवा और आराधना का संबंध
  choice: सेवा करो
  alternative: उपासना करो
  rationale: ‘सेवा’ अधिक सीधा शब्दार्थ है और निर्गमन की उस तनावपूर्ण धारणा को बनाए रखता है जिसमें इस्राएली फ़िरौन की नहीं, यहोवा की सेवा करेंगे; धार्मिक उपासना का भाव संदर्भ में अंतर्निहित रहता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। पशु-समूहों के लिए संस्कृतनिष्ठ या तकनीकी शब्दों के बजाय सामान्य ‘भेड़-बकरियाँ’ और ‘गाय-बैल’ चुने गए हैं। फ़िरौन की सीमित रियायत और आदेशात्मक स्वर सुरक्षित हैं।
