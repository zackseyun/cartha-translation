  text: וְ/גַם מִקְנֵ֜/נוּ יֵלֵ֣ךְ עִמָּ֗/נוּ לֹ֤א תִשָּׁאֵר֙ פַּרְסָ֔ה כִּ֚י מִמֶּ֣/נּוּ נִקַּ֔ח לַ/עֲבֹ֖ד אֶת יְהוָ֣ה אֱלֹהֵ֑י/נוּ וַ/אֲנַ֣חְנוּ לֹֽא נֵדַ֗ע מַֽה נַּעֲבֹד֙ אֶת יְהוָ֔ה עַד בֹּאֵ֖/נוּ שָֽׁמָּ/ה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/026.yaml
  text: And even our livestock will go with us; not a hoof will be left behind[a], for from them we must take to serve Yahweh our God, and we do not know with what we must serve Yahweh until we arrive there.
translation:
  language: hi
  text: और हमारा पशुधन भी हमारे साथ जाएगा; एक खुर भी पीछे नहीं छूटेगा[a], क्योंकि हमें उनमें से अपने परमेश्वर याहवे की सेवा करने के लिए लेना होगा। और हम वहाँ पहुँचने तक नहीं जानते कि याहवे की सेवा किससे करनी होगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने परमेश्वर याहवे की आराधना करने के लिए” और “याहवे की आराधना किससे करनी होगी।” इब्रानी क्रिया का अर्थ “सेवा करना” या इस संदर्भ में “आराधना करना” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְנֵנוּ
  choice: हमारे पशुधन
  rationale: यह सामूहिक शब्द पालतू पशुओं और पशु-संपत्ति को व्यापक रूप से दर्शाता है; ‘पशुधन’ आधुनिक हिन्दी में स्वाभाविक और पर्याप्त व्यापक है।
- source_word: לֹא תִשָּׁאֵר פַּרְסָה
  choice: एक खुर तक पीछे नहीं छूटेगा
  rationale: ‘खुर’ मूल का ठोस बिंब बनाए रखता है, और ‘एक…तक नहीं’ निषेध के बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כִּי מִמֶּנּוּ נִקַּח
  choice: क्योंकि उन्हीं में से हमें…लेना होगा
  rationale: मूल में कर्म व्यक्त नहीं है; हिन्दी में भी उसे अनावश्यक रूप से जोड़े बिना सन्दर्भगत आवश्यकता को ‘लेना होगा’ से व्यक्त किया गया है।
- source_word: לַעֲבֹד אֶת יְהוָה אֱלֹהֵינוּ
  choice: अपने परमेश्वर यहोवा की सेवा के लिए
  rationale: עבד के ‘सेवा करना’ और आराधना-संबंधी अर्थ दोनों सम्भव हैं। ‘सेवा’ मूल की व्यापकता तथा पद में इसकी पुनरावृत्ति बनाए रखती है।
- source_word: מַה נַּעֲבֹד אֶת יְהוָה
  choice: यहोवा की सेवा किससे करनी होगी
  rationale: सन्दर्भ में מַה को साधनवाचक समझना उचित है—किन पशुओं अथवा वस्तुओं से सेवा की जाएगी। ‘किससे’ इस अर्थ को संक्षेप में बनाए रखता है।
- source_word: עַד בֹּאֵנוּ שָׁמָּה
  choice: जब तक हम वहाँ पहुँच न जाएँ
  rationale: यह गन्तव्य पर पहुँचने तक की अवधि बताता है; यह आधुनिक हिन्दी का स्वाभाविक रूप है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यन्तरण ‘यहोवा’ से प्रस्तुत किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
theological_decisions:
- issue: बलिदान और आराधना के सन्दर्भ में עבד का अनुवाद
  choice: सेवा
  alternative: आराधना
  rationale: यहाँ आराधना अभिप्रेत हो सकती है, पर ‘सेवा’ इब्रानी शब्द का व्यापक वाचा-संबंधी अर्थ और दोनों प्रयोगों की पुनरावृत्ति बनाए रखती है; विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘एक खुर तक’ मूल की जोरदार अभिव्यक्ति बचाता है; दूसरे वाक्य की रचना हिन्दी में स्पष्टता के लिए पुनर्व्यवस्थित की गई है।
