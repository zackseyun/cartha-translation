  yaml_path: translation/ot/exodus/010/027.yaml
  text: But Yahweh hardened Pharaoh’s heart[b][a], and he was not willing to let them go.
translation:
  language: hi
  text: परन्तु यहवे ने फ़िरौन के हृदय को कठोर कर दिया[a], और वह उन्हें जाने देने को राज़ी नहीं हुआ[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “फ़िरौन के हृदय को दृढ़ कर दिया।” हिब्रू क्रिया का अर्थ “बलवान करना” या “दृढ़ करना” भी हो सकता है; यहाँ हृदय के साथ इसका भाव “कठोर करना” है।
    reason: lexical_alternative
  - marker: b
    text: या “और उसने उन्हें जाने देने से इनकार कर दिया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַזֵּק
  choice: कठोर कर दिया
  rationale: חזק का मूल अर्थ दृढ़ या बलवान करना है; पर निर्गमन में ‘हृदय’ के साथ प्रयुक्त यह सूत्र संकल्प को कठोर करने का भाव व्यक्त करता है।
- source_word: יְהוָה
  choice: यहवे
  rationale: परमेश्वर के व्यक्तिगत नाम का प्रचलित हिन्दी लिप्यंतरण रखा गया है, किसी उपाधि से उसका स्थान नहीं बदला गया।
- source_word: לֵב
  choice: हृदय
  rationale: यह मानक बाइबलीय रूपक है और यहाँ इच्छा, प्रवृत्ति तथा आन्तरिक संकल्प को समेटता है।
- source_word: פַּרְעֹה
  choice: फ़िरौन
  rationale: मिस्र के राजकीय पदनाम का हिन्दी में प्रचलित रूप।
- source_word: לֹא אָבָה
  choice: तैयार नहीं हुआ
  rationale: אָבָה इच्छा या सहमति को दर्शाता है; यह रूप नकारात्मक इच्छा को स्वाभाविक हिन्दी में व्यक्त करता है, बिना उसे केवल ‘इनकार किया’ में सीमित किए।
- source_word: לְשַׁלְּחָם
  choice: उन्हें जाने देने
  rationale: इस प्रसंग में שׁלח इस्राएलियों को प्रस्थान करने की अनुमति देने के अर्थ में है।
theological_decisions:
- issue: ईश्वरीय कठोरता और फ़िरौन की मानवीय इच्छा
  choice: 'दोनों कथनों को साथ रखा गया है: यहवे ने हृदय कठोर किया, और फ़िरौन तैयार नहीं हुआ।'
  alternative: यहवे ने फ़िरौन का हृदय दृढ़ किया, इसलिए उसने उन्हें जाने देने से इनकार कर दिया।
  rationale: हिब्रू पाठ ईश्वरीय कर्तृत्व और फ़िरौन की अनिच्छा दोनों कहता है, पर दोनों को स्पष्ट कारण-परिणाम सूचक शब्द से नहीं जोड़ता। अनुवाद इस तनाव और समन्वयी וְ को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी की गरिमापूर्ण और सहज शैली अपनाई गई है। ‘हृदय’ से बाइबलीय रूपक सुरक्षित रहता है; ‘तैयार नहीं हुआ’ फ़िरौन की इच्छा/सहमति के पहलू को स्वाभाविक ढंग से व्यक्त करता है।
