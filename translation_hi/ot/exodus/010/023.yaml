source:
  edition: WLC
  text: לֹֽא רָא֞וּ אִ֣ישׁ אֶת אָחִ֗י/ו וְ/לֹא קָ֛מוּ אִ֥ישׁ מִ/תַּחְתָּ֖י/ו שְׁלֹ֣שֶׁת יָמִ֑ים וּֽ/לְ/כָל בְּנֵ֧י יִשְׂרָאֵ֛ל הָ֥יָה א֖וֹר בְּ/מוֹשְׁבֹתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/023.yaml
  text: They did not see one another[a], and no one rose from his place for three days[b]; but all the sons of Israel had light in their dwellings.
translation:
  language: hi
  text: उन्होंने एक-दूसरे को नहीं देखा[a], और तीन दिन तक कोई भी अपने स्थान से नहीं उठा; परन्तु सभी इस्राएलियों के निवास-स्थानों में उजाला था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में शाब्दिक रूप से, “किसी ने अपने भाई को नहीं देखा।” यहाँ यह अभिव्यक्ति पारस्परिक अर्थ में है: “उन्होंने एक-दूसरे को नहीं देखा।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאוּ ... אֶת־אָחִיו
  choice: एक-दूसरे को नहीं देखा
  rationale: इब्रानी का शाब्दिक रूप ‘किसी ने अपने भाई को नहीं देखा’ है, पर אִישׁ אֶת־אָחִיו यहाँ पारस्परिक मुहावरा है। ‘एक-दूसरे को’ आधुनिक हिन्दी में उसका स्वाभाविक अर्थ देता है; ‘देख नहीं सके’ के बजाय ‘नहीं देखा’ मूल कथन की सादगी बनाए रखता है।
- source_word: אִישׁ
  choice: कोई भी
  rationale: यहाँ पुल्लिंग एकवचन शब्द वितरणात्मक और सामान्य अर्थ में प्रयुक्त है। ‘कोई भी’ सभी प्रभावित लोगों को समेटता है और हिन्दी में स्वाभाविक है।
- source_word: קָמוּ ... מִתַּחְתָּיו
  choice: अपने स्थान से नहीं उठा
  rationale: קום का मूल अर्थ ‘उठना’ है, और מִתַּחְתָּיו का शाब्दिक ‘अपने नीचे से’ इस प्रसंग में अपने स्थान से हटने या उठने का मुहावरा है।
- source_word: שְׁלֹשֶׁת יָמִים
  choice: तीन दिन तक
  rationale: अवधि व्यक्त करने के लिए ‘तक’ सहज हिन्दी है और लगातार तीन दिनों की अवधि स्पष्ट करता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएली
  rationale: शाब्दिक रूप ‘इस्राएल के पुत्र’ एक जातीय-सामुदायिक पद है। ‘इस्राएली’ स्त्री-पुरुष पूरे समुदाय को आधुनिक हिन्दी में स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: הָיָה אוֹר
  choice: उजाला था
  rationale: यह पद उनके लिए प्रकाश उपलब्ध होने की बात कहता है। ‘उजाला था’ अन्धकार के साथ विरोध को सरल और स्वाभाविक हिन्दी में रखता है।
- source_word: בְּמֹשְׁבֹתָם
  choice: उनके निवास-स्थानों में
  rationale: מוֹשָׁב निवास, रहने का स्थान या बस्ती सूचित कर सकता है। बहुवचन ‘निवास-स्थानों’ स्रोत के रूप और घरेलू/स्थानीय विरोध दोनों को बनाए रखता है।
