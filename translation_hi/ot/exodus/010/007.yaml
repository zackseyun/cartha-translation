base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/007.yaml
  text: Then Pharaoh’s servants said to him[a], “How long will this man be a snare to us? Send the men away so that they may serve Yahweh their God[e][d][c][b]. Do you not yet know that Egypt is ruined?”
translation:
  language: hi
  text: फिर फ़िरौन के सेवकों ने उससे कहा, “यह आदमी कब तक हमारे लिए फंदा बना रहेगा?[a] इन पुरुषों को जाने दे, ताकि वे अपने परमेश्वर याहवे की सेवा करें।[b][c] क्या तू अब भी नहीं जानता कि मिस्र बरबाद हो चुका है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जाल।”
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में “पुरुषों”; कुछ अनुवाद प्रसंग के अनुसार “लोगों” कहते हैं।
    reason: lexical_alternative
  - marker: c
    text: या “अपने परमेश्वर याहवे की उपासना करें”; यहाँ हिब्रू क्रिया में सेवा और उपासना, दोनों का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי פַרְעֹה
  choice: फ़िरौन के सेवकों
  rationale: ‘सेवक’ मूल शब्द का सीधा अर्थ रखता है; प्रसंग में ये राजदरबार के अधिकारी भी हो सकते हैं, पर ‘अधिकारी’ अधिक व्याख्यात्मक होगा।
- source_word: עַד מָתַי
  choice: कब तक
  rationale: यह हिब्रू कालवाचक प्रश्न का स्वाभाविक और सटीक हिन्दी रूप है।
- source_word: זֶה
  choice: यह आदमी
  rationale: संकेतवाचक सर्वनाम प्रसंग में मूसा की ओर संकेत करता है; हिन्दी में अकेला ‘यह’ अस्पष्ट होता, इसलिए ‘आदमी’ जोड़ा गया है।
- source_word: לְמוֹקֵשׁ
  choice: फंदा
  rationale: यह जाल या फंदे का रूपक बनाए रखता है और आधुनिक हिन्दी में सहज है।
- source_word: שַׁלַּח
  choice: जाने दे
  rationale: आज्ञार्थक क्रिया यहाँ छोड़ने अथवा विदा करने की माँग व्यक्त करती है; ‘जाने दे’ प्रसंगानुकूल और स्वाभाविक है।
- source_word: הָאֲנָשִׁים
  choice: इन पुरुषों
  rationale: मूल संज्ञा स्पष्टतः पुल्लिंग बहुवचन ‘पुरुषों’ है; इसे सामान्य ‘लोगों’ में विस्तृत नहीं किया गया।
- source_word: וְיַעַבְדוּ
  choice: ताकि वे ... सेवा करें
  rationale: עבד परमेश्वर के संबंध में सेवा और उपासना दोनों का भाव रख सकता है; ‘सेवा करें’ उसका व्यापक मूल भाव सुरक्षित रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम YHWH को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, न कि उपाधि ‘प्रभु’ से।
- source_word: הֲטֶרֶם תֵּדַע
  choice: क्या तू अब भी नहीं जानता
  rationale: यह प्रश्न फ़िरौन को फटकारता है; ‘अब भी नहीं’ उस बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אָבְדָה מִצְרָיִם
  choice: मिस्र बरबाद हो चुका है
  rationale: पूर्ण क्रिया अब तक हुई तबाही की परिणामी दशा बताती है; यह अनिवार्यतः पूर्ण विनाश नहीं दर्शाती।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में ईश्वर का व्यक्तिगत नाम है। हिन्दी पाठकों के लिए प्रतिष्ठित लिप्यंतरण ‘यहोवा’ नाम को नाम के रूप में बनाए रखता है; ‘प्रभु’ उसे उपाधि में बदल देता।
- issue: הָאֲנָשִׁים का लिंग-सटीक अर्थ
  choice: इन पुरुषों
  alternative: इन लोगों
  rationale: स्रोत शब्द विशेष रूप से पुरुषों को सूचित करता है। व्यापक प्रसंग में इस्राएली समुदाय ध्यान में हो सकता है, फिर भी पद की वास्तविक शब्दावली को विस्तृत नहीं किया गया।
- issue: עבד में सेवा और उपासना का संबंध
  choice: सेवा करें
  alternative: उपासना करें
  rationale: हिब्रू क्रिया दोनों भाव समेट सकती है। ‘सेवा’ व्यापक अर्थ सुरक्षित रखती है, जबकि पादटिप्पणी उपासना की सम्भावना स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज कथात्मक शैली। फ़िरौन को एकवचन ‘तू’ मूल के एकवचन संबोधन और अधिकार-संघर्ष की सीधी वाणी के अनुरूप रखा गया है। दिव्य नाम के लिए ‘यहोवा’ हिन्दी की स्थापित बाइबलीय वर्तनी है।
