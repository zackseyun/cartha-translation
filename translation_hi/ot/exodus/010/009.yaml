source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה בִּ/נְעָרֵ֥י/נוּ וּ/בִ/זְקֵנֵ֖י/נוּ נֵלֵ֑ךְ בְּ/בָנֵ֨י/נוּ וּ/בִ/בְנוֹתֵ֜/נוּ בְּ/צֹאנֵ֤/נוּ וּ/בִ/בְקָרֵ֨/נוּ֙ נֵלֵ֔ךְ כִּ֥י חַג יְהוָ֖ה לָֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/009.yaml
  text: Moses said, “We will go with our young and our old; we will go with our sons and our daughters, with our flocks and our herds, because we must hold a feast to the LORD.”
translation:
  language: hi
  text: मूसा ने कहा, “हम अपने युवाओं और बुज़ुर्गों के साथ जाएँगे; हम अपने बेटे-बेटियों और अपनी भेड़-बकरियों और गाय-बैलों के साथ जाएँगे, क्योंकि हमें यहोवा के लिए पर्व मनाना है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּנְעָרֵינוּ וּבִזְקֵנֵינוּ
  choice: अपने जवानों और बूढ़ों के साथ
  rationale: यह युग्म समुदाय के युवा और वृद्ध दोनों वर्गों को समावेशी ढंग से व्यक्त करता है; सरल आधुनिक हिन्दी में मूल का विरोधी समानांतर विन्यास रखा गया है।
- source_word: בְּצֹאנֵנוּ וּבִבְקָרֵנוּ
  choice: अपनी भेड़-बकरियों और गाय-बैलों के साथ
  rationale: צֹאן छोटे पालतू पशुओं, विशेषतः भेड़-बकरियों, और בָּקָר बड़े मवेशियों का सामूहिक बोध कराते हैं; हिन्दी के स्वाभाविक पशु-युग्मों से भेद स्पष्ट किया गया है।
- source_word: חַג
  choice: पर्व
  rationale: इस संदर्भ में शब्द यहोवा के सम्मान में मनाए जाने वाले धार्मिक उत्सव को दर्शाता है; ‘पर्व मनाना’ स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ के व्यक्तिगत ईश्वरीय नाम को सामान्य उपाधि में बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण द्वारा सुरक्षित रखा गया है।
- source_word: לָנוּ
  choice: हमें ... मनाना है
  rationale: शाब्दिक ‘हमारे लिए’ के स्थान पर प्रसंगगत दायित्व/आवश्यकता को स्वाभाविक हिन्दी में व्यक्त किया गया है, जैसा कि कथन का आशय है।
theological_decisions:
- issue: ईश्वरीय नाम का निरूपण
  choice: यहोवा
  alternative: प्रभु
  rationale: मसोरेटी पाठ में यहाँ יהוה है; व्यक्तिगत नाम को स्पष्ट रखना स्रोत-संगति बनाए रखता है और किसी विशिष्ट सांप्रदायिक व्याख्या को नहीं जोड़ता।
- issue: כִּי का संबंध
  choice: क्योंकि
  alternative: निश्चय ही / इसलिए कि
  rationale: यहाँ כִּי मूसा के सब लोगों और पशुओं को साथ ले जाने का कारण प्रस्तुत करता है; कारणसूचक अर्थ सबसे स्वाभाविक है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण शैली। मूल की दोहराई हुई ‘हम ... जाएँगे’ संरचना और पूरे समुदाय तथा पशुधन की समावेशी सूची सुरक्षित रखी गई है।
