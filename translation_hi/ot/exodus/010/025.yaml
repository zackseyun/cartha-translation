  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה גַּם אַתָּ֛ה תִּתֵּ֥ן בְּ/יָדֵ֖/נוּ זְבָחִ֣ים וְ/עֹל֑וֹת וְ/עָשִׂ֖ינוּ לַ/יהוָ֥ה אֱלֹהֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/025.yaml
  text: But Moses said[a], “You also must give into our hands sacrifices and burnt offerings, and we will offer them to Yahweh our God.”
translation:
  language: hi
  text: परन्तु मूसा ने कहा, “तुम्हें भी हमारे हाथों में बलिदान और होमबलियाँ देनी होंगी, और हम उन्हें याहवे, अपने परमेश्वर को चढ़ाएँगे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: परन्तु मूसा ने कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; पिछले पद में फ़िरौन द्वारा लगाई गई पाबंदी के उत्तर में यहाँ विरोध का भाव होने से ‘परन्तु’ स्वाभाविक है।
- source_word: גַּם אַתָּה
  choice: तुम्हें ... भी
  rationale: गַּם और स्वतंत्र सर्वनाम אַתָּה फ़िरौन पर बल देते हैं; हिन्दी में ‘तुम्हें ... भी’ इस योगात्मक और बलात्मक अर्थ को सहज ढंग से व्यक्त करता है।
- source_word: תִּתֵּן בְּיָדֵנוּ
  choice: हमारे हाथ में ... देनी होंगी
  rationale: נתן का मूल अर्थ ‘देना’ है और בְּיָדֵנוּ हस्तांतरण की ठोस छवि ‘हमारे हाथ में’ बनाए रखता है। प्रसंग में अपूर्ण क्रिया आग्रह/अनिवार्यता व्यक्त करती है।
- source_word: זְבָחִים
  choice: बलिदान
  rationale: यह वध करके चढ़ाए जाने वाले बलिदानों का सामान्य शब्द है; आधुनिक हिन्दी में ‘बलिदान’ स्पष्ट और परिचित है।
- source_word: וְעֹלֹת
  choice: और होमबलियाँ
  rationale: עֹלָה पूर्णतः जलाई जाने वाली भेंट है; ‘होमबलि’ इसका प्रचलित और विशिष्ट हिन्दी धार्मिक पद है।
- source_word: וְעָשִׂינוּ
  choice: ताकि हम उन्हें ... चढ़ाएँ
  rationale: बलिदान-संदर्भ में עשה का अर्थ बलिदान को सम्पन्न करना या चढ़ाना है। हिन्दी में उद्देश्यसूचक ‘ताकि ... चढ़ाएँ’ पूर्ववर्ती माँग और इच्छित कर्म का स्वाभाविक संबंध बताता है।
- source_word: לַיהוָה אֱלֹהֵינוּ
  choice: अपने परमेश्वर यहोवा को
  rationale: ל recipient को दर्शाता है; יהוה को उसके व्यक्तिगत नाम ‘यहोवा’ से और אֱלֹהֵינוּ को स्वाभाविक हिन्दी में ‘अपने परमेश्वर’ से व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का निरूपण
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम प्रत्यक्ष रूप से है। ‘यहोवा’ हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाता है और इसे केवल उपाधि ‘प्रभु’ से बदलने के बजाय नाम के रूप में सुरक्षित रखता है; वैकल्पिक उच्चारण पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘हमारे हाथ में’ मूल की ठोस अभिव्यक्ति को बनाए रखता है, जबकि ‘देनी होंगी’ मूसा के दृढ़ आग्रह को व्यक्त करता है।
