  text: וּ/לְמַ֡עַן תְּסַפֵּר֩ בְּ/אָזְנֵ֨י בִנְ/ךָ֜ וּ/בֶן בִּנְ/ךָ֗ אֵ֣ת אֲשֶׁ֤ר הִתְעַלַּ֨לְתִּי֙ בְּ/מִצְרַ֔יִם וְ/אֶת אֹתֹתַ֖/י אֲשֶׁר שַׂ֣מְתִּי בָ֑/ם וִֽ/ידַעְתֶּ֖ם כִּי אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/002.yaml
  text: so that you may tell in the hearing of your son and of your grandson how I dealt harshly with Egypt[a], and my signs that I placed among them[b], and so that you may know that I am Yahweh.
translation:
  language: hi
  text: ताकि तुम अपने बेटे और अपने पोते को यह बताओ कि मैंने मिस्र के साथ कैसा कठोर व्यवहार किया[a], और वे चिन्ह जो मैंने उनके बीच रखे, और ताकि तुम जानो कि मैं याहवे हूँ।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैंने मिस्र को कैसे उपहास का पात्र बनाया।” इब्रानी क्रिया कठोर व्यवहार के साथ-साथ मिस्र को अपमानित करने पर भी बल दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “और तुम जान जाओगे कि मैं याहवे हूँ।”
    reason: alternative_reading
lexical_decisions:
- source_word: וּלְמַעַן
  choice: ताकि
  rationale: यह पद पिछले प्रसंग से जुड़े उद्देश्य या परिणाम को व्यक्त करता है; ‘ताकि’ स्वाभाविक हिंदी में इसका प्रयोजनसूचक बल बनाए रखता है।
- source_word: תְּסַפֵּר בְּאָזְנֵי
  choice: सुनाओ
  rationale: पिएल रूप यहाँ भावी पीढ़ियों को घटनाएँ कह सुनाने का अर्थ देता है। ‘सुनाओ’ में ‘कानों में/सुनने में बताना’ मुहावरे का आशय स्वाभाविक रूप से समाहित है।
- source_word: בִנְךָ וּבֶן בִּנְךָ
  choice: अपने बेटे और अपने पोते
  rationale: शाब्दिक अर्थ ‘अपने बेटे और अपने बेटे के बेटे’ है; ‘पोते’ से पीढ़ियों पर दिया गया बल स्पष्ट और सहज रहता है।
- source_word: הִתְעַלַּלְתִּי
  choice: मैंने ... कैसी कठोरता की
  rationale: इस संदर्भ में क्रिया मिस्र के विरुद्ध कठोर और अपमानित करनेवाली दैवी कार्रवाई को व्यक्त करती है। मुख्य पाठ न्याय की कठोरता रखता है, जबकि उपहास/अपमान का संभव भाव पादटिप्पणी में सुरक्षित है।
- source_word: בְּמִצְרַיִם
  choice: मिस्र के साथ
  rationale: पूर्वसर्ग ב और चुनी हुई हिंदी अभिव्यक्ति के साथ यह मिस्र को दैवी कार्रवाई के लक्ष्य के रूप में स्वाभाविक ढंग से प्रस्तुत करता है।
- source_word: אֹתֹתַי
  choice: अपने ... चिह्न
  rationale: אוֹת का सीधा अर्थ ‘चिह्न’ है; ‘चमत्कार’ जोड़ना मूल संज्ञा से अधिक व्याख्यात्मक होता।
- source_word: שַׂמְתִּי בָם
  choice: उनके बीच रखे
  rationale: यह ‘रखना/स्थापित करना’ क्रिया की ठोस छवि बनाए रखता है; बहुवचन प्रत्यय को मिस्रियों की ओर संकेत मानते हुए ‘उनके बीच’ किया गया है।
- source_word: וִידַעְתֶּם
  choice: और ताकि तुम जानो
  rationale: आरंभिक לְמַעַן के साथ इसे आगे चलनेवाले उद्देश्य के रूप में पढ़ा गया है; भविष्यसूचक परिणाम की संभावना पादटिप्पणी में दी गई है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिंदी में प्रचलित लिप्यंतरण द्वारा परमेश्वर के व्यक्तिगत नाम को उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं किया गया।
theological_decisions:
- issue: मिस्र के प्रति הִתְעַלַּלְתִּי का अर्थ
  choice: मैंने मिस्र के साथ कैसी कठोरता की
  alternative: मैंने मिस्र को कैसे उपहास का पात्र बनाया
  rationale: विपत्तियों में दंड और अपमान दोनों निहित हैं। मुख्य पाठ न्यायिक कठोरता को व्यक्त करता है और संभव अपमानसूचक अर्थ को पादटिप्पणी में बनाए रखता है।
- issue: וִידַעְתֶּם को उद्देश्य या परिणाम के रूप में पढ़ना
  choice: और ताकि तुम जानो
  alternative: और तुम जान जाओगे
  rationale: वाक्यरचना इसे आरंभिक प्रयोजनसूचक पदबंध से जोड़ने देती है, पर भविष्यगत परिणाम का अर्थ भी संभव है; इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज, गरिमापूर्ण कथन। ‘सुनाओ’ ने इब्रानी मुहावरे ‘कानों में बताना’ को अनावश्यक शाब्दिकता से बचाते हुए उसका अर्थ रखा है। मुख्य पाठ में पीढ़ीगत शिक्षा, दैवी न्याय और परमेश्वर के नाम की पहचान स्पष्ट रखी गई है।
