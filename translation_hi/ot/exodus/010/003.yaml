  text: וַ/יָּבֹ֨א מֹשֶׁ֣ה וְ/אַהֲרֹן֮ אֶל פַּרְעֹה֒ וַ/יֹּאמְר֣וּ אֵלָ֗י/ו כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י הָֽ/עִבְרִ֔ים עַד מָתַ֣י מֵאַ֔נְתָּ לֵ/עָנֹ֖ת מִ/פָּנָ֑/י שַׁלַּ֥ח עַמִּ֖/י וְ/יַֽעַבְדֻֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/003.yaml
  text: 'So Moses and Aaron went in to Pharaoh and said to him[a], “Thus says Yahweh, the God of the Hebrews: How long will you refuse to humble yourself before me? Let my people go[b], so that they may serve me.”'
translation:
  language: hi
  text: 'तब मूसा और हारून फ़िरौन के पास गए और उससे कहा, “इब्रानियों का परमेश्वर याहवे यह कहता है: ‘तू कब तक मेरे सामने अपने आप को नम्र करने से इनकार करता रहेगा?[a] मेरी प्रजा को जाने दे, ताकि वे मेरी सेवा करें।’[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे सामने दीन होने से” अथवा “मेरे अधीन होने से।” इब्रानी क्रिया में दीन होने या स्वयं को नम्र करने का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “मेरी उपासना करें।” इब्रानी क्रिया में सेवा के साथ धार्मिक या उपासना-संबंधी सेवा का भाव भी शामिल हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: के पास गए
  rationale: בוא אֶל किसी व्यक्ति के पास या उसकी उपस्थिति में जाने को व्यक्त करता है। फ़िरौन को गंतव्य मानते हुए ‘के पास गए’ स्वाभाविक हिन्दी है।
- source_word: כֹּה אָמַר
  choice: यह कहता है
  rationale: यह दैवी संदेशवाहक सूत्र है; वर्तमान बल और सीधे उद्घोष को सहज आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ के व्यक्तिगत दैवी नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण द्वारा रखा गया है; उच्चारण-संबंधी विकल्प पादटिप्पणी में दिया गया है।
- source_word: אֱלֹהֵי הָעִבְרִים
  choice: इब्रानियों का परमेश्वर
  rationale: यह रचना यहोवा की पहचान इब्रानी लोगों के परमेश्वर के रूप में कराती है।
- source_word: עַד מָתַי מֵאַנְתָּ
  choice: तू कब तक ... इनकार करता रहेगा?
  rationale: पूर्ण क्रिया यहाँ बार-बार होते आए और अब भी जारी इनकार पर चुनौती है; हिन्दी का ‘कब तक ... करता रहेगा’ इस निरंतर भाव को व्यक्त करता है।
- source_word: לֵעָנֹת מִפָּנַי
  choice: मेरे सामने अपने आपको दीन करने
  rationale: निफ़अल रूप दीन होने या स्वयं को दीन करने का भाव दे सकता है। प्रसंग में फ़िरौन से अपेक्षित विनम्र अधीनता को रखते हुए कर्मवाच्य अस्पष्टता पादटिप्पणी में सुरक्षित है।
- source_word: שַׁלַּח עַמִּי
  choice: मेरी प्रजा को जाने दे
  rationale: निर्गमन में दोहराई गई रिहाई की माँग को स्वाभाविक हिन्दी में व्यक्त करता है। ‘प्रजा’ यहाँ परमेश्वर के सामुदायिक और राजकीय दावे को सहजता से बताती है।
- source_word: וְיַעַבְדֻנִי
  choice: ताकि वे मेरी सेवा करें
  rationale: עבד सामान्य सेवा के साथ धार्मिक सेवा और उपासना भी समेटता है। ‘सेवा करें’ व्यापक अर्थक्षेत्र को बनाए रखता है।
theological_decisions:
- issue: दैवी नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: व्यक्तिगत दैवी नाम को ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया। आधुनिक विद्वत् पुनर्निर्मित उच्चारण ‘याहवे’ को पादटिप्पणी में देकर हिन्दी में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ को मुख्य पाठ में रखा गया है।
- issue: לֵעָנֹת का वाच्य और आशय
  choice: अपने आपको दीन करने
  alternative: मेरे सामने दीन होने / मेरे अधीन होने
  rationale: मुख्य पाठ में प्रसंगानुकूल आत्म-विनम्रता व्यक्त है, किंतु इब्रानी निफ़अल के ‘दीन होने’ और ‘अधीन होने’ के निकट भावों को पादटिप्पणी में खुला रखा गया है।
- issue: וְיַעַבְדֻנִי में सेवा और उपासना
  choice: मेरी सेवा करें
  alternative: मेरी उपासना करें
  rationale: क्रिया धार्मिक उपासना को शामिल करती है, पर उससे व्यापक ‘सेवा’ का अर्थ भी रखती है; इसलिए मुख्य पाठ में व्यापक शब्द और पादटिप्पणी में धार्मिक आशय दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सरल शैली रखी गई है। फ़िरौन के लिए एकवचन ‘तू’ मूल इब्रानी के सीधे, अधिकारपूर्ण दैवी संबोधन को दर्शाता है; यह अनौपचारिक निकटता नहीं, बल्कि राजकीय टकराव का स्वर है। मुख्य पाठ में ‘सेवा’ धार्मिक सेवा/उपासना को भी समेटती है।
