source:
  edition: WLC
  text: וַ/יְחַזֵּ֥ק יְהוָ֖ה אֶת לֵ֣ב פַּרְעֹ֑ה וְ/לֹ֥א שִׁלַּ֖ח אֶת בְּנֵ֥י יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/020.yaml
  text: But Yahweh hardened Pharaoh’s heart[b][a], and he did not let the sons of Israel go.
translation:
  language: hi
  text: परन्तु यहोवा ने फ़िरौन का हृदय कठोर कर दिया[a], और उसने इस्राएल के पुत्रों को जाने नहीं दिया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “फ़िरौन के हृदय को दृढ़ कर दिया” अथवा “फ़िरौन के हृदय को मज़बूत कर दिया”; इब्रानी क्रिया का मूल अर्थ “दृढ़/मज़बूत करना” है।
    reason: lexical_alternative
  - marker: b
    text: या “इस्राएलियों को”; परंपरागत रूप से “इस्राएल की सन्तान को।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַזֵּק
  choice: कठोर कर दिया
  rationale: חזק का मूल अर्थ ‘दृढ़/मज़बूत करना’ है, पर निर्गमन में फ़िरौन के हृदय के विषय में यह उसकी हठीली प्रतिरोधी दशा के दृढ़ हो जाने को व्यक्त करता है। ‘कठोर कर दिया’ इस प्रसंग में स्वाभाविक हिंदी है; शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה को किसी उपाधि से बदलने के बजाय प्रचलित हिंदी लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है।
- source_word: לֵב
  choice: हृदय
  rationale: ‘हृदय’ इब्रानी बिंब को बनाए रखता है और यहाँ मन, इच्छा तथा आंतरिक संकल्प को समेटता है।
- source_word: פַּרְעֹה
  choice: फ़िरौन
  rationale: मिस्र के शासक की उपाधि का आधुनिक मानक हिंदी रूप।
- source_word: שִׁלַּח
  choice: जाने नहीं दिया
  rationale: मूल क्रिया का आधारभूत अर्थ ‘भेजना’ है, किंतु इस मुक्ति-प्रसंग में ‘जाने देना’ सहज और प्रसंगानुकूल हिंदी है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: यह चयन इब्रानी पारिवारिक अभिव्यक्ति को प्रत्यक्ष रूप से सुरक्षित रखता है; अधिक सहज सामूहिक विकल्प ‘इस्राएलियों’ को पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: फ़िरौन के हृदय को कठोर करने में यहोवा की भूमिका
  choice: यहोवा ने फ़िरौन का हृदय कठोर कर दिया
  alternative: यहोवा ने फ़िरौन के हृदय को दृढ़ कर दिया
  rationale: इब्रानी वाक्य स्पष्ट रूप से यहोवा को इस क्रिया का कर्ता बताता है। अनुवाद इस दैवी कर्तृत्व को न तो नरम करता है, न मनुष्य की ज़िम्मेदारी अथवा पूर्वनियति के विषय में पाठ से आगे कोई व्याख्या जोड़ता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘परन्तु’ कथा के विरोधात्मक संबंध को, ‘हृदय’ मूल बिंब को और ‘यहोवा’ दैवी व्यक्तिगत नाम को बनाए रखता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
