  text: וַ/יֵּ֥ט מֹשֶׁ֛ה אֶת יָד֖/וֹ עַל הַ/שָּׁמָ֑יִם וַ/יְהִ֧י חֹֽשֶׁךְ אֲפֵלָ֛ה בְּ/כָל אֶ֥רֶץ מִצְרַ֖יִם שְׁלֹ֥שֶׁת יָמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/022.yaml
  text: So Moses stretched out his hand toward the sky[b][a], and there was thick darkness over all the land of Egypt for three days.
translation:
  language: hi
  text: तब मूसा ने अपना हाथ आकाश की ओर बढ़ाया,[a] और पूरे मिस्र देश में तीन दिन तक घोर अँधकार[b] छाया रहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “स्वर्ग की ओर।” हिब्रू शब्द का अर्थ प्रसंग के अनुसार “आकाश” या “स्वर्ग/स्वर्गलोक” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “गहरा अँधकार।” हिब्रू में “अँधकार” के साथ घोर अँधेरे का एक और शब्द जोड़कर उसकी तीव्रता पर बल दिया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּט
  choice: बढ़ाया
  rationale: נטה हाथ के संकेत के संदर्भ में हाथ फैलाने या बढ़ाने को व्यक्त करता है; ‘हाथ ... बढ़ाया’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: יָדוֹ
  choice: अपना हाथ
  rationale: יָד का सामान्य अर्थ ‘हाथ’ है; हिन्दी में कर्ता मूसा की ओर लौटता ‘अपना’ स्वाभाविक और स्पष्ट है।
- source_word: עַל הַשָּׁמַיִם
  choice: आकाश की ओर
  rationale: हाथ बढ़ाने के इस प्रसंग में עַל दिशा सूचित करता है और שָּׁמַיִם का संदर्भानुकूल अर्थ ‘आकाश’ है; ‘स्वर्ग की ओर’ भी शाब्दिक रूप से संभव है।
- source_word: וַיְהִי
  choice: छाया रहा
  rationale: היה यहाँ उत्पन्न होकर बनी रहने वाली दशा बताता है। ‘छाया रहा’ अँधकार के लिए स्वाभाविक हिन्दी है और तीन दिन की अवधि को स्पष्ट करता है।
- source_word: חֹשֶׁךְ אֲפֵלָה
  choice: घोर अँधकार
  rationale: दोनों पद मिलकर अँधकार की तीव्रता पर बल देते हैं; ‘घोर अँधकार’ इस गहनता को संक्षेप और गरिमा से व्यक्त करता है।
- source_word: בְּכָל אֶרֶץ מִצְרַיִם
  choice: पूरे मिस्र देश में
  rationale: यह वाक्यांश समस्त मिस्र-प्रदेश को सूचित करता है; यह हिन्दी रूप सटीक और सहज है।
- source_word: שְׁלֹשֶׁת יָמִים
  choice: तीन दिन तक
  rationale: हिब्रू का कालावधि-सूचक पद हिन्दी में ‘तक’ के साथ स्वाभाविक रूप से व्यक्त होता है।
