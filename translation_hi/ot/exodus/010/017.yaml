  text: וְ/עַתָּ֗ה שָׂ֣א נָ֤א חַטָּאתִ/י֙ אַ֣ךְ הַ/פַּ֔עַם וְ/הַעְתִּ֖ירוּ לַ/יהוָ֣ה אֱלֹהֵי/כֶ֑ם וְ/יָסֵר֙ מֵֽ/עָלַ֔/י רַ֖ק אֶת הַ/מָּ֥וֶת הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/017.yaml
  text: So now[a], please forgive my sin just this once, and plead with Yahweh your God[b], that he may remove from me this death only.
translation:
  language: hi
  text: और अब[a], कृपया बस इस बार मेरा पाप क्षमा कर दो, और अपने परमेश्वर यहोवा से विनती करो कि वह केवल इस मृत्यु को मुझसे दूर कर दे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अब” या “इसलिए अब।”
    reason: वְעַתָּה में संयोजक वְ को साधारण “और” अथवा प्रसंगानुसार परिणामसूचक रूप में समझा जा सकता है।
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “यह मृत्यु।” संभवतः फिरौन वर्तमान प्राणघातक विपत्ति और उसके प्रभावों की बात कर रहा है।
    reason: मूल अभिव्यक्ति को स्पष्ट करते हुए उसके संभावित संदर्भगत आशय को बिना निश्चित किए बताना।
lexical_decisions:
- source_word: וְעַתָּה
  choice: इसलिए अब
  rationale: संयोजक और कालवाचक क्रियाविशेषण दोनों को स्वाभाविक हिन्दी में व्यक्त करता है और फिरौन की तात्कालिक विनती को पिछले प्रसंग से जोड़ता है।
- source_word: שָׂא נָא חַטָּאתִי
  choice: मेरा पाप क्षमा कर दो
  rationale: नָשָׂא का मूल अर्थ ‘उठाना/ढोना’ है, पर ‘पाप’ के साथ यह पाप को उठा ले जाने, अर्थात क्षमा करने का मुहावरा है; נָא की विनय आज्ञार्थक अभिव्यक्ति में बनी रहती है।
- source_word: אַךְ הַפַּעַם
  choice: बस इस बार
  rationale: 'प्रतिबंधात्मक बल को सहज आधुनिक हिन्दी में रखता है: फिरौन इसी अवसर के लिए क्षमा माँगता है।'
- source_word: וְהַעְתִּירוּ
  choice: विनती करो
  rationale: हिफ़ील रूप परमेश्वर से आग्रहपूर्ण प्रार्थना करने का भाव देता है; बहुवचन क्रिया मूसा और हारून दोनों को संबोधित करती है, जिसे हिन्दी में संदर्भ से समझा जाता है।
- source_word: לַיהוָה אֱלֹהֵיכֶם
  choice: अपने परमेश्वर यहोवा से
  rationale: יהוה को उसके व्यक्तिगत नाम ‘यहोवा’ से व्यक्त किया गया है और ‘अपने परमेश्वर’ फिरौन की दूरी बनाए रखने वाली भाषा को सुरक्षित रखता है।
- source_word: וְיָסֵר מֵעָלַי
  choice: कि वह ... मुझसे दूर कर दे
  rationale: मध्यस्थता की विनती के बाद आशय/परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: רַק אֶת־הַמָּוֶת הַזֶּה
  choice: केवल इस मृत्यु को
  rationale: इब्रानी की असामान्य किंतु अर्थपूर्ण संज्ञा ‘यह मृत्यु’ और רַק के प्रतिबंधात्मक बल को ज्यों का त्यों बनाए रखता है।
theological_decisions:
- issue: יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम सीधे आया है; उसे उपाधि ‘प्रभु’ से बदलने के बजाय नाम के रूप में रखा गया है। हिन्दी में ‘यहोवा’ व्यापक रूप से पहचाना जाने वाला रूप है।
- issue: ‘इस मृत्यु’ का आशय
  choice: शाब्दिक अभिव्यक्ति को मुख्य पाठ में बनाए रखना
  alternative: इस घातक विपत्ति को
  rationale: संदर्भ टिड्डियों की प्राणघातक विपत्ति की ओर संकेत करता है, पर मूल पाठ स्वयं ‘मृत्यु’ कहता है; अनुवाद उस तनाव को व्याख्यात्मक रूप से समाप्त नहीं करता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘बस इस बार’ फिरौन की सीमित विनती को स्वाभाविक ढंग से व्यक्त करता है। बहुवचन संबोधन को अलग सर्वनाम से चिह्नित नहीं किया गया, क्योंकि हिन्दी का ‘करो’ यहाँ मूसा और हारून दोनों के लिए स्वाभाविक है।
