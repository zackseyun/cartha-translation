base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/016.yaml
  text: Then Pharaoh hurried to call for Moses and Aaron, and he said, “I have sinned against Yahweh your God and against you.”
translation:
  language: hi
  text: तब फ़िरौन ने तुरंत मूसा और हारून को बुलाया और कहा, “मैंने तुम्हारे परमेश्वर, यहवे, के विरुद्ध और तुम्हारे विरुद्ध पाप किया है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: जल्दी की
  rationale: मूल क्रिया מהר शीघ्रता से कार्य करने का भाव व्यक्त करती है; यह प्रयोग आधुनिक हिंदी में स्वाभाविक रहते हुए फ़िरौन की तात्कालिकता बनाए रखता है।
- source_word: לִקְרֹא לְמֹשֶׁה וּלְאַהֲרֹן
  choice: मूसा और हारून को बुलाने
  rationale: इस संदर्भ में קרא ל किसी को अपने पास बुलवाने का अर्थ देता है। हिंदी में ‘को बुलाने’ स्पष्ट और सहज है।
- source_word: חָטָאתִי
  choice: मैंने ... पाप किया है
  rationale: חטא के नैतिक और धार्मिक अर्थ को ‘पाप किया है’ सीधे बनाए रखता है; पूर्ण वर्तमान रूप इस स्वीकारोक्ति की वर्तमान प्रासंगिकता व्यक्त करता है।
- source_word: לַיהוָה
  choice: यहवे के विरुद्ध
  rationale: חטא के साथ ל यहाँ उस पक्ष को सूचित करता है जिसके विरुद्ध पाप हुआ; हिंदी में ‘के विरुद्ध’ इसका स्वाभाविक समतुल्य है।
- source_word: יְהוָה
  choice: यहवे
  rationale: चार अक्षरों वाले परमेश्वर के निज नाम को सामान्य पदवी से बदलने के बजाय हिंदी में निकट लिप्यंतरण द्वारा प्रस्तुत किया गया है।
- source_word: אֱלֹהֵיכֶם
  choice: तुम्हारे परमेश्वर
  rationale: द्वितीय पुरुष बहुवचन प्रत्यय को ‘तुम्हारे’ से व्यक्त किया गया है; फ़िरौन उन्हें इस्राएल का परमेश्वर कहता है, अपना नहीं।
- source_word: וְלָכֶם
  choice: और तुम्हारे विरुद्ध
  rationale: बहुवचन ‘तुम्हारे’ मूसा और हारून दोनों को संबोधित करता है; ‘विरुद्ध’ पहले वाक्यांश से स्वाभाविक रूप से जुड़ता है।
theological_decisions:
- issue: परमेश्वर के निज नाम יהוה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ स्पष्ट रूप से निज नाम יהוה का प्रयोग करता है। ‘यहवे’ उसे पदवी में बदले बिना आधुनिक हिंदी में प्रचलित विद्वत्तापूर्ण उच्चारण के निकट रखता है।
- issue: फ़िरौन की स्वीकारोक्ति में ל का अर्थ
  choice: के विरुद्ध पाप किया है
  alternative: के प्रति पाप किया है
  rationale: חטא के साथ ל अपराध के लक्ष्य या पीड़ित पक्ष को दर्शाता है। ‘के विरुद्ध’ हिंदी में स्पष्ट है और स्वीकारोक्ति की नैतिक गंभीरता बनाए रखता है।
- issue: אֱלֹהֵיכֶם में संबंध
  choice: तुम्हारे परमेश्वर
  alternative: हमारे परमेश्वर
  rationale: मूल का बहुवचन द्वितीय पुरुष प्रत्यय स्पष्ट है। इसलिए फ़िरौन की बात को उससे अधिक व्यापक विश्वास-स्वीकारोक्ति नहीं बनाया गया।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘फ़िरौन’, ‘मूसा’ और ‘हारून’ के परिचित हिंदी रूप रखे गए हैं; वाक्य-संरचना मूल की क्रमिक गति और प्रत्यक्ष स्वीकारोक्ति को बनाए रखती है।
