- source_word: כֵּן דִּבַּרְתָּ
  choice: जैसा तूने कहा है
  rationale: यह वाक्यांश फिरौन की कही बात से सहमति व्यक्त करता है—“जैसा तूने कहा है” या “तूने ठीक कहा है।” चुना हुआ रूप मूल की संरचना और औपचारिक उत्तर दोनों को सुरक्षित रखता है।
- source_word: לֹא אֹסִף עוֹד
  choice: फिर कभी ... नहीं
  rationale: नकार के साथ יסף और עוֹד का संयोजन उस कार्य के दोबारा न होने का मुहावरा है। “फिर कभी ... नहीं” हिन्दी में इसका स्वाभाविक और दृढ़ भाव व्यक्त करता है।
- source_word: רְאוֹת פָּנֶיךָ
  choice: तेरा मुँह देखूँगा
  rationale: शाब्दिक अभिव्यक्ति “तेरा मुँह देखना” है। यह आमने-सामने उपस्थित होने का भाव भी रखती है, पर ठोस मूल बिंब को बनाए रखा गया है।
