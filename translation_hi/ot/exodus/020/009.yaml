lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: छः दिन
  rationale: पूर्वसर्ग के बिना यह कालवाचक पद इब्रानी की संक्षिप्त रचना को बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है; ‘छः दिनों तक’ भी संभव है।
- source_word: תַּעֲבֹד
  choice: तुम परिश्रम करना
  rationale: काल रूप यहाँ दशवचन के विधिक संदर्भ में निर्देशात्मक बल रखता है। ‘परिश्रम करना’ עבד के ‘काम/श्रम करना’ अर्थ को गंभीरता के साथ व्यक्त करता है।
- source_word: וְעָשִׂיתָ
  choice: और ... करना
  rationale: עשה का सामान्य अर्थ ‘करना/बनाना’ है; מְלָאכָה के साथ हिन्दी में ‘काम करना’ स्वाभाविक प्रयोग है।
- source_word: כָּל
  choice: सारा
  rationale: एकवचन भाव वाले ‘काम’ के साथ כָּל का स्वाभाविक हिन्दी रूप ‘सारा’ है।
- source_word: מְלַאכְתֶּךָ
  choice: अपना ... काम
  rationale: מְלָאכָה यहाँ कार्य, व्यवसाय या नियुक्त काम को दर्शाता है। ‘अपना काम’ सीधा, व्यापक और सब्त के प्रसंग के अनुकूल है।
theological_decisions:
- issue: सब्त-विधान में अपूर्ण काल का निर्देशात्मक बल
  choice: ‘तुम परिश्रम करना’ के रूप में विधिक निर्देश
  alternative: ‘तुम परिश्रम कर सकते हो’ अथवा ‘तुम परिश्रम करोगे’
  rationale: दशवचन के वाचा-संबंधी विधान में यह रूप केवल अनुमति या भविष्यवाणी नहीं, बल्कि निर्देश व्यक्त करता है। हिन्दी का ‘करना’ इस आज्ञात्मक-विधिक स्वर को स्वाभाविक ढंग से रखता है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘परिश्रम’ और ‘काम’ के द्वारा עבד तथा מְלָאכָה का lexical अंतर यथासंभव सुरक्षित है; दूसरा ‘करना’ मूल इब्रानी की समानांतर क्रिया-रचना को भी बनाए रखता है।
