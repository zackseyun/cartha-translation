  edition: WLC
  text: אָֽנֹכִ֖י יְהוָ֣ה אֱלֹהֶ֑י/ךָ אֲשֶׁ֧ר הוֹצֵאתִ֛י/ךָ מֵ/אֶ֥רֶץ מִצְרַ֖יִם מִ/בֵּ֥ית עֲבָדִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/002.yaml
  text: I am Yahweh your God[a], who brought you out from the land of Egypt[b], from the house of servants.
translation:
  language: hi
  text: “मैं याहवे[a], तुम्हारा परमेश्वर हूँ, जो तुम्हें मिस्र देश से, दासों के घर से[b] निकाल लाया।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: YHWH; परम्परागत रूप से ‘प्रभु’ अनूदित; एक अन्य लिप्यंतरण ‘यहोवा’ है।'
    reason: alternative_reading
  - marker: b
    text: अधिक भावपरक रूप में, ‘दासता के घर से।’ इब्रानी का शाब्दिक अर्थ ‘दासों के घर से’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אָֽנֹכִי
  choice: मैं ... हूँ
  rationale: स्वतंत्र प्रथम-पुरुष सर्वनाम पर बल है; हिन्दी की स्वाभाविक निर्वचनात्मक रचना में ‘हूँ’ जोड़कर गंभीर आत्म-परिचय व्यक्त किया गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल में प्रयुक्त परमेश्वर के व्यक्तिगत नाम YHWH को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֶיךָ
  choice: तुम्हारा परमेश्वर
  rationale: रूप बहुवचन-जैसा होने पर भी यहाँ एकवचन संदर्भ और एकवचन प्रत्यय के कारण अर्थ स्पष्टतः ‘तुम्हारा परमेश्वर’ है।
- source_word: אֲשֶׁר
  choice: जो
  rationale: यह सम्बन्धवाचक अव्यय याहवे का वर्णन करने वाला उपवाक्य आरम्भ करता है; ‘जो’ स्वाभाविक हिन्दी है।
- source_word: הוֹצֵאתִיךָ
  choice: तुम्हें ... निकाल लाया
  rationale: יצא के हिफ़ील रूप का अर्थ ‘बाहर निकालना/ले आना’ है; यह चयन निर्गमन के सक्रिय उद्धार को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: मिस्र देश से
  rationale: מן स्रोत को सूचित करता है; ‘मिस्र देश से’ मूल की भौगोलिक अभिव्यक्ति को संक्षिप्त और स्वाभाविक रूप में सुरक्षित रखता है।
- source_word: מִבֵּית עֲבָדִים
  choice: दासों के घर से
  rationale: यह मूल की ठोस बहुवचन रचना ‘दासों का घर’ को बनाए रखता है। प्रसंग में עֲבָדִים बँधुआ दासों को दर्शाता है, केवल सामान्य सेवकों को नहीं।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: पद में चार-अक्षरीय व्यक्तिगत नाम सीधे आया है; ‘याहवे’ उसका लिप्यंतरण करता है और उसे किसी उपाधि से नहीं बदलता।
- issue: मिस्र में עֲבָדִים की स्थिति
  choice: दासों
  alternative: सेवकों / दासता
  rationale: जबरन श्रम और बन्धन के प्रसंग में ‘दास’ स्थिति की कठोरता को स्पष्ट करता है। मुख्य पाठ ठोस बहुवचन बिम्ब रखता है, जबकि भाववाचक विकल्प पादटिप्पणी में दिया गया है।
- issue: द्वितीय पुरुष का वचन
  choice: तुम्हारा / तुम्हें
  alternative: तेरा / तुझे
  rationale: इब्रानी प्रत्यय व्याकरणतः एकवचन है और इस्राएल को सामूहिक रूप से सम्बोधित करता है। आधुनिक हिन्दी में ‘तुम’ सम्मानहीनता से बचते हुए सामूहिक सम्बोधन के लिए स्वाभाविक है, यद्यपि उसकी संख्या प्रसंग से समझी जाती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘दासों के घर’ जानबूझकर मूल के ठोस बिम्ब को बनाए रखता है; अधिक मुहावरेदार ‘दासता के घर’ पादटिप्पणी में है। पादटिप्पणी-चिह्न उनके वास्तविक विषयों के साथ लगाए गए हैं।
