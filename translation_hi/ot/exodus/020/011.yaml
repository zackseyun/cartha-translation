base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/011.yaml
  text: For in six days Yahweh made the heavens and the earth[a], the sea, and all that is in them, and he rested on the seventh day. Therefore Yahweh blessed the Sabbath day and made it holy.
translation:
  language: hi
  text: क्योंकि छह दिन में याहवे ने आकाश और पृथ्वी, समुद्र और उनमें जो कुछ है, वह सब बनाया; और सातवें दिन उसने विश्राम किया[a]। इसी कारण याहवे ने सब्त के दिन को आशीष दी और उसे पवित्र किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “विराम लिया।” इब्रानी क्रिया में विश्राम करने या काम से विराम लेकर ठहरने का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले पद में दी गई सब्त की आज्ञा का आधार बताता है; हिन्दी में ‘क्योंकि’ इस कारणसूचक संबंध को स्वाभाविक रूप से प्रकट करता है।
- source_word: שֵׁשֶׁת יָמִים
  choice: छह दिन में
  rationale: यह उस समयावधि को व्यक्त करता है जिसमें सृष्टि का कार्य हुआ; यह मूल के निकट और सहज हिन्दी है।
- source_word: עָשָׂה
  choice: बनाया
  rationale: इस सृष्टि-संदर्भ में व्यापक क्रिया עשה के लिए ‘बनाया’ स्पष्ट और स्वाभाविक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: यह इब्रानी चतुरक्षरीय व्यक्तिगत नाम का हिन्दी लिप्यंतरण है और इसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- source_word: הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: आकाश और पृथ्वी
  rationale: सृष्टि के समग्र क्षेत्र को बताने वाली पारंपरिक जोड़ी को स्पष्ट, आधुनिक हिन्दी में रखा गया है।
- source_word: הַיָּם
  choice: समुद्र
  rationale: मूल में यह एकवचन है और सृष्टि के एक व्यापक क्षेत्र को सूचित करता है।
- source_word: כָּל אֲשֶׁר בָּם
  choice: उनमें जो कुछ है, वह सब
  rationale: यह आकाश, पृथ्वी और समुद्र में मौजूद हर वस्तु को समाविष्ट करता है तथा मूल की व्यापकता बनाए रखता है।
- source_word: וַיָּנַח
  choice: उसने विश्राम किया
  rationale: נוח यहाँ काम के बाद विश्राम करने या शांत होकर ठहरने का भाव देता है; ‘विश्राम किया’ सब्त के संदर्भ में स्वाभाविक है और थकावट का दावा नहीं जोड़ता।
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: सातवें दिन
  rationale: यह विश्राम के समय को सीधे और मुहावरेदार हिन्दी में बताता है।
- source_word: עַל כֵּן
  choice: इसी कारण
  rationale: यह सृष्टि के प्रतिरूप से निकलने वाले निष्कर्ष को स्पष्ट रूप से जोड़ता है।
- source_word: בֵּרַךְ
  choice: आशीष दी
  rationale: यह दिन पर परमेश्वर की आशीष प्रदान किए जाने को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיְקַדְּשֵׁהוּ
  choice: उसे पवित्र किया
  rationale: यह क्रिया उस दिन को पवित्र बनाने या पवित्र उपयोग के लिए अलग करने को व्यक्त करती है; संक्षिप्त अनुवाद मूल की क्रियात्मक शक्ति बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत ईश्वरीय नाम का प्रयोग करता है। ‘याहवे’ उसका प्रत्यक्ष लिप्यंतरण है और नाम को उपाधि में नहीं बदलता।
- issue: सातवें दिन परमेश्वर के וַיָּנַח का वर्णन
  choice: उसने विश्राम किया
  alternative: उसने विराम लिया; वह ठहर गया
  rationale: मूल क्रिया विश्राम करने और काम से विराम लेकर ठहरने की अर्थ-सीमा रखती है। मुख्य पाठ में स्वाभाविक ‘विश्राम किया’ रखा गया है, जबकि पादटिप्पणी वैकल्पिक भाव बताती है; इससे न तो परमेश्वर की थकावट जोड़ी गई है, न क्रिया को केवल काम बंद करने तक सीमित किया गया है।
- issue: सब्त के दिन को पवित्र करने का अर्थ
  choice: उसे पवित्र किया
  alternative: उसे पवित्र ठहराया; उसे अलग किया
  rationale: וַיְקַדְּשֵׁהוּ दिन को पवित्र बनाने या पवित्र प्रयोजन के लिए अलग करने को व्यक्त करता है। ‘पवित्र किया’ मूल की संक्षिप्तता और धार्मिक अर्थ दोनों बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप अपनाया गया है। ‘सब्त’ बाइबलीय पद के रूप में रखा गया है। अर्धविराम सृष्टि के कार्य और सातवें दिन के विश्राम के बीच मूल वाक्य की संरचनात्मक सीमा स्पष्ट करता है। पादटिप्पणी का चिह्न उसी क्रिया के बाद रखा गया है जिससे वह संबंधित है।
