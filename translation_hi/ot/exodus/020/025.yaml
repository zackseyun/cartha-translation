language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אִם מִזְבַּ֤ח אֲבָנִים֙ תַּֽעֲשֶׂה לִּ֔/י לֹֽא תִבְנֶ֥ה אֶתְ/הֶ֖ן גָּזִ֑ית כִּ֧י חַרְבְּ/ךָ֛ הֵנַ֥פְתָּ עָלֶ֖י/הָ וַ/תְּחַֽלְלֶֽ/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/025.yaml
  text: And if you make for me an altar of stones[a], you shall not build it of cut stones; for if you wield your sword on it[b], you will profane it.
translation:
  language: hi
  text: और यदि तुम मेरे लिए पत्थरों की वेदी बनाओ, तो उसे तराशे हुए पत्थरों से न बनाना; क्योंकि यदि तुम उस पर अपनी तलवार[a] चलाओगे, तो उसे अपवित्र कर दोगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में “तुम्हारी तलवार”; इस प्रसंग में आशय सम्भवतः पत्थरों को तराशने के लिए प्रयुक्त किसी धातु के औज़ार से है।
    reason: cultural_note
lexical_decisions:
- source_word: וְאִם
  choice: और यदि
  rationale: संयोजक וְ और शर्तसूचक אִם दोनों को व्यक्त करता है और इस निर्देश का पिछले पद से संबंध बनाए रखता है।
- source_word: מִזְבַּח אֲבָנִים
  choice: पत्थरों की वेदी
  rationale: इब्रानी संबंधसूचक पदबंध का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: תַּעֲשֶׂה לִּי
  choice: मेरे लिए ... बनाओ
  rationale: לִּי के लाभार्थक संबंध को बिना अतिरिक्त व्याख्या के स्पष्ट करता है।
- source_word: לֹא תִבְנֶה אֶתְהֶן גָּזִית
  choice: उसे तराशे हुए पत्थरों से न बनाना
  rationale: גָּזִית का अर्थ मनुष्य द्वारा काटे या तराशे गए पत्थर हैं। हिन्दी में एकवचन 'उसे' वेदी को संदर्भित करता है; यह अर्थगत संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: חַרְבְּךָ
  choice: अपनी तलवार
  rationale: मूल शब्द का सामान्य और स्पष्ट अर्थ 'तलवार' है; उसे मुख्य पाठ में 'औज़ार' कह देना मूल की ठोस शब्दावली को अनावश्यक रूप से समझा देता।
- source_word: הֵנַפְתָּ עָלֶיהָ
  choice: उस पर ... चलाओगे
  rationale: इस प्रसंग में किसी धारदार वस्तु को पत्थर पर इस्तेमाल करने का स्वाभाविक हिन्दी वर्णन है, जबकि क्रिया की सक्रियता बनी रहती है।
- source_word: וַתְּחַלְלֶהָ
  choice: उसे अपवित्र कर दोगे
  rationale: חלל के पवित्रता-विरोधी, उपासना-संबंधी अर्थ को सामान्य आधुनिक हिन्दी में स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: वेदी के अपवित्र होने का स्वरूप
  choice: पत्थरों पर तलवार चलाना वेदी को उपासना-संबंधी अर्थ में अपवित्र करता है।
  alternative: इसे केवल हिंसा के प्रतीक से बचने या सादगी बनाए रखने का निर्देश माना जाए।
  rationale: חלל स्पष्ट रूप से पवित्रता के उल्लंघन को व्यक्त करता है। फिर भी पद इसके पीछे का पूरा कारण नहीं बताता, इसलिए अनुवाद कोई अतिरिक्त धार्मिक या प्रतीकात्मक व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में विधिक-आज्ञात्मक गरिमा रखी गई है। 'तराशे हुए पत्थर' सामान्य पाठक के लिए स्पष्ट है; 'अपवित्र' मूल के पवित्रता-संबंधी तनाव को बनाए रखता है।
