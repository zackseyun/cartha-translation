  - marker: a
    text: या “उसे पवित्र ठहराने के लिए” अथवा “उसे पवित्र करके अलग रखने के लिए।”
    reason: קדשׁ की उद्देश्यसूचक अभिव्यक्ति के वैध शाब्दिक विकल्प।
lexical_decisions:
- source_word: זָכוֹר
  choice: स्मरण रखना
  rationale: यह זכר का काल इम्पेरेटिव एकवचन रूप है और सक्रिय, निरंतर स्मरण की आज्ञा देता है। ‘स्मरण रखना’ आधुनिक हिन्दी में स्वाभाविक है और वाचा-संबंधी बल बनाए रखता है।
- source_word: אֶת
  choice: '[निश्चित कर्म-चिह्न, अनूदित नहीं]'
  rationale: यह इब्रानी में निश्चित प्रत्यक्ष कर्म को चिह्नित करता है; हिन्दी में इसके लिए अलग शब्द आवश्यक नहीं है।
- source_word: יוֹם הַשַּׁבָּת
  choice: विश्राम-दिन
  rationale: יוֹם का अर्थ ‘दिन’ है और שַׁבָּת रुकने अथवा विश्राम करने से जुड़ा विशिष्ट वाचा-संबंधी दिन है। ‘विश्राम-दिन’ हिन्दी बाइबलीय प्रयोग में सुबोध और स्थापित है।
- source_word: לְקַדְּשׁוֹ
  choice: ताकि उसे पवित्र मानो
  rationale: 'קדשׁ के इनफिनिटिव कंस्ट्रक्ट और तृतीय पुरुष पुल्लिंग एकवचन प्रत्यय से उद्देश्य व्यक्त होता है: उस दिन को पवित्र समझना और उसी के अनुरूप अलग रखना। ‘पवित्र मानो’ धार्मिक भार को बनाए रखते हुए स्वाभाविक हिन्दी देता है।'
theological_decisions:
- issue: विश्राम-दिन के संबंध में קדשׁ का अनुवाद
  choice: ताकि उसे पवित्र मानो
  alternative: उसे पवित्र ठहराने के लिए; उसे पवित्र करके अलग रखने के लिए
  rationale: इब्रानी क्रिया दिन को पवित्र मानने, ठहराने या पवित्र उपयोग के लिए अलग रखने का भाव रखती है। मुख्य पाठ संक्षिप्त और स्वाभाविक है, जबकि पादटिप्पणी वास्तविक शाब्दिक विकल्पों को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध। ‘स्मरण रखना’ आज्ञा के सक्रिय बल को और ‘पवित्र मानो’ קדשׁ की धार्मिक अर्थवत्ता को सुरक्षित रखता है।
