  text: וַ/יֹּ֨אמֶר מֹשֶׁ֣ה אֶל הָ/עָם֮ אַל תִּירָאוּ֒ כִּ֗י לְ/בַֽ/עֲבוּר֙ נַסּ֣וֹת אֶתְ/כֶ֔ם בָּ֖א הָ/אֱלֹהִ֑ים וּ/בַ/עֲב֗וּר תִּהְיֶ֧ה יִרְאָת֛/וֹ עַל פְּנֵי/כֶ֖ם לְ/בִלְתִּ֥י תֶחֱטָֽאוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/020.yaml
  text: And Moses said to the people[a], “Do not fear, for God has come to test you, and so that the fear of him may be before you[c][b], so that you may not sin.”
translation:
  language: hi
  text: तब मूसा ने लोगों से कहा, “मत डरो[a], क्योंकि परमेश्वर तुम्हें परखने के लिए आया है, और इस उद्देश्य से कि उसका भय[b] तुम्हारे सामने[c] बना रहे, ताकि तुम पाप न करो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “भयभीत मत हो।” हिब्रू में यहाँ और आगे “उसका भय” में एक ही मूल शब्द आया है; इससे घबराहट और परमेश्वर के उचित भय के बीच जानबूझकर विरोध उभरता है।
    reason: lexical_alternative
  - marker: b
    text: या “उसके प्रति श्रद्धा।” हिब्रू संज्ञा भय के साथ-साथ श्रद्धामय विस्मय का भाव भी व्यक्त कर सकती है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक अर्थ “तुम्हारे चेहरों पर” है; यह किसी बात के निरंतर सामने या चेतना में बने रहने का मुहावरा है।
    reason: cultural_note
lexical_decisions:
- source_word: אַל תִּירָאוּ
  choice: मत डरो
  rationale: यह स्वाभाविक आधुनिक हिन्दी है और आगे आने वाले יִרְאָתוֹ के साथ ‘डर/भय’ की समान अर्थ-जड़ तथा घबराहट और उचित परमेश्वर-भय के बीच जानबूझकर रखे गए तनाव को बनाए रखता है।
- source_word: לְבַעֲבוּר נַסּוֹת אֶתְכֶם
  choice: तुम्हें परखने के लिए
  rationale: לְבַעֲבוּר उद्देश्य व्यक्त करता है और נסה का अर्थ यहाँ जाँचकर सिद्ध करना है; ‘परखना’ प्रलोभन देने का अनावश्यक भाव जोड़े बिना इसे स्पष्ट करता है।
- source_word: בָּא הָאֱלֹהִים
  choice: परमेश्वर ... आया है
  rationale: कतल रूप का वर्तमान परिस्थिति से संबंध हिन्दी के पूर्ण वर्तमान ‘आया है’ से स्वाभाविक रूप में व्यक्त होता है; אֱלֹהִים के लिए ‘परमेश्वर’ मानक और गरिमापूर्ण हिन्दी है।
- source_word: וּבַעֲבוּר
  choice: और इसलिए कि
  rationale: दूसरा לְבַעֲבוּר भी उद्देश्य बताता है और इसके बाद आने वाले सीमित क्रियापद वाले उपवाक्य को सहज हिन्दी में जोड़ता है।
- source_word: יִרְאָתוֹ
  choice: उसका भय
  rationale: हिब्रू संज्ञा भय और श्रद्धामय विस्मय दोनों व्यक्त कर सकती है। ‘भय’ पहले ‘मत डरो’ के साथ शब्दगत संबंध बचाता और अर्थगत तनाव को खुला रखता है।
- source_word: עַל־פְּנֵיכֶם
  choice: तुम्हारे सामने ... बना रहे
  rationale: शाब्दिक अर्थ ‘तुम्हारे चेहरों पर’ है, पर यह किसी बात के निरंतर सामने या चेतना में रहने का मुहावरा है। ‘सामने बना रहे’ इस निरंतरता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְבִלְתִּי תֶחֱטָאוּ
  choice: ताकि तुम पाप न करो
  rationale: यह नकारात्मक उद्देश्य को स्पष्ट, सहज और स्रोत के अनुरूप व्यक्त करता है।
theological_decisions:
- issue: ‘मत डरो’ और ‘उसका भय’ के बीच प्रत्यक्ष तनाव
  choice: मुख्य पाठ में दोनों स्थानों पर डर/भय की समान अर्थ-जड़ बनाए रखना
  alternative: पहले ‘भयभीत मत हो’ और बाद में ‘उसके प्रति श्रद्धा’ कहना
  rationale: हिब्रू एक ही ירא-जड़ द्वारा आतंककारी घबराहट और स्थायी, उचित परमेश्वर-भय में अंतर रखते हुए उनका शब्दगत संबंध भी बनाए रखता है। अनुवाद इस तनाव को व्याख्या द्वारा समाप्त नहीं करता।
- issue: परमेश्वर द्वारा ‘परखने’ का स्वरूप
  choice: נסה को ‘परखना’ कहना
  alternative: ‘परीक्षा लेना’ या ‘जाँच करना’
  rationale: पद का उद्देश्य लोगों को सिद्ध या जाँचना है ताकि वे पाप न करें। ‘परखना’ बुराई के लिए लुभाने का भाव नहीं जोड़ता और कोई अतिरिक्त धर्मसैद्धांतिक निष्कर्ष आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। ‘मत डरो/उसका भय’ से मूल का शब्दगत तनाव सुरक्षित रखा गया है। ‘तुम्हारे सामने बना रहे’ शाब्दिक मुहावरे का स्वाभाविक हिन्दी रूप है।
