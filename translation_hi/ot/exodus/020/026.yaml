language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/לֹֽא תַעֲלֶ֥ה בְ/מַעֲלֹ֖ת עַֽל מִזְבְּחִ֑/י אֲשֶׁ֛ר לֹֽא תִגָּלֶ֥ה עֶרְוָתְ/ךָ֖ עָלָֽי/ו־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/026.yaml
  text: And you shall not go up by steps to my altar[a], so that your nakedness may not be exposed on it.
translation:
  language: hi
  text: और तुम मेरी वेदी पर सीढ़ियों से ऊपर न चढ़ना,[a] ऐसा न हो कि उस पर तुम्हारी नग्नता प्रकट हो जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ताकि उस पर तुम्हारी नग्नता खुल न जाए।”
    reason: इब्रानी אֲשֶׁר לֹא תִגָּלֶה ... का निकटतर वैकल्पिक अनुवाद; मुख्य पाठ में स्वाभाविक हिन्दी परिणामसूचक रूप रखा गया है।
lexical_decisions:
- source_word: תַעֲלֶה
  choice: ऊपर न चढ़ना
  rationale: עלה का मूल दिशात्मक अर्थ ‘ऊपर चढ़ना’ है; לֹא के साथ यह निषेध व्यक्त करता है। आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: בְמַעֲלֹת
  choice: सीढ़ियों से
  rationale: מַעֲלוֹת सीढ़ियों अथवा सोपानों को दर्शाता है और ב यहाँ साधन/मार्ग का भाव देता है।
- source_word: מִזְבְּחִי
  choice: मेरी वेदी के पास
  rationale: מִזְבֵּחַ के साथ प्रथम पुरुष एकवचन प्रत्यय का अर्थ ‘मेरी वेदी’ है। על के स्थानगत संबंध को हिन्दी में ‘के पास ... ऊपर चढ़ना’ से स्वाभाविक रूप में व्यक्त किया गया है; आशय वेदी तक सीढ़ियों से चढ़ने का है।
- source_word: אֲשֶׁר לֹא
  choice: कहीं ऐसा न हो कि
  rationale: निषेध के बाद यह वाक्यांश अवांछित परिणाम अथवा आशंका प्रस्तुत करता है; ‘कहीं ऐसा न हो कि’ आधुनिक हिन्दी में उस बल को सहजता से व्यक्त करता है।
- source_word: תִּגָּלֶה
  choice: प्रकट हो जाए
  rationale: גלה का निफ़अल रूप निष्क्रिय अर्थ ‘खुल जाना/प्रकट हो जाना’ देता है।
- source_word: עֶרְוָתְךָ
  choice: तुम्हारा नंगापन
  rationale: עֶרְוָה शारीरिक नग्नता, विशेषतः लज्जाजनक अंगों के खुलने, का संकेत देता है। ‘नंगापन’ अर्थ को सीधे रखता है, बिना निजी अंगों को अत्यधिक विशिष्ट बनाए।
- source_word: עָלָיו
  choice: उस पर
  rationale: पुल्लिंग एकवचन सर्वनाम का पूर्वपद מִזְבֵּחַ ‘वेदी’ है; ‘उस पर’ इस संबंध को बनाए रखता है।
theological_decisions:
- issue: वेदी के लिए सीढ़ियाँ निषिद्ध करने का कारण
  choice: पवित्र स्थान में शारीरिक नग्नता प्रकट होने की आशंका को ही स्पष्ट कारण के रूप में रखा गया है।
  alternative: इसे परमेश्वर के सामने नम्रता का प्रतीक मानना, या इसे विशेष रूप से याजकीय वस्त्रों से जोड़ना।
  rationale: इब्रानी पाठ केवल नग्नता प्रकट होने का कारण बताता है; अनुवाद इससे आगे कोई प्रतीकात्मक या याजकीय व्याख्या नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘कहीं ऐसा न हो कि’ मूल के आशंकासूचक परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
