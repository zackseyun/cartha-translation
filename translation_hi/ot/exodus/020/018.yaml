  text: וְ/כָל הָ/עָם֩ רֹאִ֨ים אֶת הַ/קּוֹלֹ֜ת וְ/אֶת הַ/לַּפִּידִ֗ם וְ/אֵת֙ ק֣וֹל הַ/שֹּׁפָ֔ר וְ/אֶת הָ/הָ֖ר עָשֵׁ֑ן וַ/יַּ֤רְא הָ/עָם֙ וַ/יָּנֻ֔עוּ וַ/יַּֽעַמְד֖וּ מֵֽ/רָחֹֽק־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/018.yaml
  text: All the people were seeing the thunder and the flashes of fire[a], and the sound of the trumpet, and the mountain smoking; and when the people saw it[c][b], they trembled and stood at a distance.
translation:
  language: hi
  text: सब लोग गरजों[a], आग की कौंधों[b], तुरही की ध्वनि और धुआँ छोड़ते हुए पर्वत को देख रहे थे[c]। यह देखकर लोग काँप उठे और दूर खड़े हो गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ ‘ध्वनियाँ’ या ‘आवाज़ें’ है; यहाँ संदर्भ में संभवतः बादलों की गरज अभिप्रेत है।
    reason: lexical_alternative
  - marker: b
    text: या ‘मशालें’; इस संदर्भ में यह शब्द संभवतः बिजली जैसी आग की कौंधों को दर्शाता है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में लोग उन घटनाओं को ‘देख’ रहे हैं जिनमें ध्वनियाँ भी शामिल हैं; इससे उस दृश्य का अभिभूत कर देने वाला मिला-जुला ऐंद्रिय प्रभाव बना रहता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאִים
  choice: देख रहे थे
  rationale: वर्तमान कृदंत की जारी और सजीव क्रिया को व्यक्त करता है तथा श्रव्य और दृश्य घटनाओं को एक साथ ‘देखने’ की इब्रानी अभिव्यक्ति बनाए रखता है।
- source_word: הַקּוֹלֹת
  choice: गरजों
  rationale: शाब्दिक अर्थ ‘ध्वनियाँ/आवाज़ें’ है, पर सीनै के तूफ़ानी ईश-प्रकटन के संदर्भ में बहुवचन का आशय बादलों की गरज से है।
- source_word: הַלַּפִּידִם
  choice: आग की कौंधों
  rationale: शब्द का मूल अर्थ ‘मशालें’ है, किंतु यहाँ वह बिजली जैसी अग्निमय चमकों को दर्शाता है; ‘आग की कौंधें’ ठोस बिंब और संदर्भगत अर्थ दोनों रखता है।
- source_word: קוֹל הַשֹּׁפָר
  choice: नरसिंगे की ध्वनि
  rationale: שׁוֹפָר सींग से बना वाद्य है; ‘नरसिंगा’ आधुनिक हिन्दी बाइबलीय संदर्भ में सटीक और समझने योग्य वाद्य-संज्ञा है।
- source_word: הָהָר עָשֵׁן
  choice: धुआँ उगलते पर्वत
  rationale: पर्वत के धूमायमान होने का सक्रिय, सजीव दृश्य व्यक्त करता है; यह केवल धुएँ से ढके होने की अपेक्षा עָשֵׁן की तत्कालता को अधिक स्वाभाविक हिन्दी में रखता है।
- source_word: וַיַּרְא הָעָם
  choice: यह देखकर
  rationale: पहले गिनाई गई समस्त घटनाओं को सामूहिक रूप से संदर्भित करता है और उसके बाद आई प्रतिक्रिया से स्वाभाविक कालगत संबंध बनाता है।
- source_word: וַיָּנֻעוּ
  choice: काँप उठे
  rationale: भय के कारण थरथराने या विचलित होने का अर्थ सजीव और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיַּעַמְדוּ מֵרָחֹק
  choice: दूर खड़े हो गए
  rationale: लोगों के भयवश पीछे हटकर दूरी पर ठहर जाने को स्रोत के निकट और सहज हिन्दी में व्यक्त करता है।
- source_word: וְכָל הָעָם
  choice: सब लोग
  rationale: एकत्र इस्राएली समुदाय की समग्रता का सीधा और स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: श्रव्य घटनाओं को भी लोगों द्वारा ‘देखे’ जाने वाली इब्रानी मिश्रित ऐंद्रिय भाषा
  choice: ‘देख रहे थे’ को सभी सूचीबद्ध घटनाओं, गरज और नरसिंगे की ध्वनि सहित, पर लागू रखा गया
  alternative: ‘गरज सुन रहे थे और कौंधें देख रहे थे’ या ‘इन घटनाओं को अनुभव कर रहे थे’
  rationale: स्रोत ईश-प्रकटन के अभिभूत कर देने वाले अनुभव को ऐंद्रिय तनाव के साथ प्रस्तुत करता है। उसे सामान्य बनाकर अलग-अलग इंद्रियों में बाँटना मूल की विशिष्टता को मिटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘नरसिंगा’ को सींग से बने वाद्य के स्पष्ट सांस्कृतिक अर्थ के लिए चुना गया है। वाक्य-विन्यास हिन्दी की स्वाभाविकता के अनुसार दो वाक्यों में रखा गया है, जबकि स्रोत की घटनाओं और प्रतिक्रिया का क्रम अक्षुण्ण है।
