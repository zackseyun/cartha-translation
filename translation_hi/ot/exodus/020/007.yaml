  text: לֹ֥א תִשָּׂ֛א אֶת שֵֽׁם יְהוָ֥ה אֱלֹהֶ֖י/ךָ לַ/שָּׁ֑וְא כִּ֣י לֹ֤א יְנַקֶּה֙ יְהוָ֔ה אֵ֛ת אֲשֶׁר יִשָּׂ֥א אֶת שְׁמ֖/וֹ לַ/שָּֽׁוְא־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/007.yaml
  text: You shall not bear the name of Yahweh your God falsely[a], for Yahweh will not leave unpunished the one who bears his name falsely.
translation:
  language: hi
  text: तुम याहवे, अपने परमेश्वर, का नाम झूठे या व्यर्थ रूप से धारण न करना[a], क्योंकि जो उसका नाम झूठे या व्यर्थ रूप से धारण करता है, उसे याहवे निर्दोष नहीं ठहराएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'परंपरागत अनुवाद: “तुम याहवे, अपने परमेश्वर, का नाम व्यर्थ न लेना।” इब्रानी में शाब्दिक भाव है, “नाम को झूठ/व्यर्थता के लिए उठाना या धारण करना।” इसमें झूठी शपथ, खोखला आह्वान, या परमेश्वर का अनुचित प्रतिनिधित्व शामिल हो सकता है।'
    reason: मूल क्रिया נשא और שָׁוְא के व्यापक अर्थ-क्षेत्र को स्पष्ट करना।
lexical_decisions:
- source_word: תִשָּׂא / יִשָּׂא (נשא)
  choice: धारण करना / धारण करता है
  rationale: नשא का मूल अर्थ उठाना, ले चलना या धारण करना है। ‘धारण करना’ दोनों उपवाक्यों में क्रियात्मक समानता बनाए रखता है और आज्ञा को केवल बोलने या उच्चारण तक सीमित नहीं करता।
- source_word: שֵׁם
  choice: नाम
  rationale: यह सामान्य और सीधा अनुवाद है; प्रसंग में यह परमेश्वर की प्रकट पहचान, प्रतिष्ठा और वाचाई दावे को भी समेटता है।
- source_word: יְהוָה
  choice: यहवे
  rationale: इब्रानी व्यक्तिगत नाम יהוה को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֶיךָ
  choice: अपने परमेश्वर
  rationale: दूसरे पुरुष एकवचन के वाचाई और व्यक्तिगत संबोधन को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: לַשָּׁוְא
  choice: किसी झूठे या व्यर्थ उद्देश्य से
  rationale: שָׁוְא में झूठ, खोखलापन, व्यर्थता और निकम्मेपन का अर्थ-क्षेत्र है। संयुक्त अभिव्यक्ति इस व्यापकता को हिन्दी में स्वाभाविक ढंग से रखती है और आज्ञा को केवल अपशब्द या झूठी शपथ तक सीमित नहीं करती।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह निषेध के आधार या कारण का परिचय देता है और आधुनिक हिन्दी में स्पष्ट है।
- source_word: יְנַקֶּה (נקה)
  choice: निर्दोष नहीं ठहराएगा
  rationale: यह न्यायिक अर्थ को व्यक्त करता है कि यहवे ऐसे व्यक्ति को दोषमुक्त नहीं करेगा; साथ ही इब्रानी क्रिया के दोष और दण्ड दोनों से जुड़े आशय को बनाए रखता है।
- source_word: אֲשֶׁר
  choice: जो
  rationale: यह उस किसी भी व्यक्ति की ओर संकेत करने वाला स्वाभाविक हिन्दी सापेक्ष सर्वनाम है जो वर्णित काम करता है।
- source_word: שְׁמוֹ
  choice: उसका नाम
  rationale: तीसरे पुरुष के प्रत्यय को स्पष्ट रखते हुए यहवे के नाम की ओर लौटता है।
theological_decisions:
- issue: परमेश्वर के नाम से संबंधित निषेध का दायरा
  choice: यहवे के नाम को किसी झूठे, खोखले या व्यर्थ उद्देश्य से धारण करने के विरुद्ध व्यापक निषेध
  alternative: केवल झूठी शपथ लेने या नाम का अपवित्र उच्चारण करने के विरुद्ध संकीर्ण निषेध
  rationale: נשא, שֵׁם और שָׁוְא का मेल केवल अनुचित उच्चारण से अधिक व्यापक है। इसमें झूठी शपथ, खोखला आह्वान और परमेश्वर का गलत प्रतिनिधित्व सम्मिलित हो सकते हैं; इसलिए मुख्य पाठ दायरे को खुला रखता है।
- issue: יהוה का अनुवाद
  choice: यहवे
  alternative: यहोवा या प्रभु
  rationale: व्यक्तिगत दिव्य नाम को उपाधि से प्रतिस्थापित किए बिना हिन्दी लिपि में प्रस्तुत किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘धारण करना’ कुछ औपचारिक है, पर मूल क्रिया की ठोस व्यापकता और दोनों उपवाक्यों की पुनरावृत्ति को सुरक्षित रखता है।
