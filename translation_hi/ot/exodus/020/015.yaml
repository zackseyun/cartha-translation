  choice: तुम चोरी न करना।
  alternative: चोरी मत करो।
  rationale: इब्रानी לֹא + अपूर्ण क्रिया वाचा-संबंधी व्यवस्था में सीधा निषेध है। “तुम चोरी न करना” उसकी संक्षिप्त और गंभीर विधिक ध्वनि को स्वाभाविक हिंदी में बनाए रखता है; “चोरी मत करो” अधिक गतिशील विकल्प है।
translation_notes:
