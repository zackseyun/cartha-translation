id: EXO.20.19
reference: Exodus 20:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּֽאמְרוּ֙ אֶל מֹשֶׁ֔ה דַּבֵּר אַתָּ֥ה עִמָּ֖/נוּ וְ/נִשְׁמָ֑עָה וְ/אַל יְדַבֵּ֥ר עִמָּ֛/נוּ אֱלֹהִ֖ים פֶּן נָמֽוּת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/019.yaml
  text: And they said to Moses[a], “You speak with us, and we will listen; but let not God speak with us, lest we die.”
translation:
  language: hi
  text: तब उन्होंने मूसा से कहा, “आप ही हमसे बात कीजिए, और हम सुनेंगे[a]; पर परमेश्वर हमसे बात न करे, कहीं ऐसा न हो कि हम मर जाएँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हम ध्यान से सुनेंगे” अथवा “हम मानेंगे।” इब्रानी क्रिया सुनने के साथ-साथ उत्तरदायी ढंग से मानने का भाव भी व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: तब उन्होंने कहा
  rationale: वय्यिक्तोल कथा को आगे बढ़ाता है; आधुनिक हिन्दी में ‘तब उन्होंने कहा’ क्रम और प्रसंग को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֶל־מֹשֶׁה
  choice: मूसा से
  rationale: यहाँ אֶל कथन के संबोधित व्यक्ति को दर्शाता है; हिन्दी में ‘मूसा से कहा’ स्वाभाविक प्रयोग है।
- source_word: דַּבֵּר אַתָּה
  choice: आप ही ... बात कीजिए
  rationale: आज्ञार्थक क्रिया के साथ स्पष्ट सर्वनाम אַתָּה मूसा पर विरोधात्मक बल देता है; ‘आप ही’ उस बल को व्यक्त करता है। आदरसूचक रूप निवेदन की हिन्दी शैली के अनुरूप है।
- source_word: עִמָּנוּ
  choice: हमसे
  rationale: עִם का मूल भाव ‘साथ’ है, पर हिन्दी में किसी से संवाद करने के लिए ‘हमसे बात कीजिए’ सर्वाधिक स्वाभाविक है और पारस्परिकता भी बनाए रखता है।
- source_word: וְנִשְׁמָעָה
  choice: और हम सुनेंगे
  rationale: यह रूप इच्छात्मक/प्रतिसादी भाव रखता है। ‘हम सुनेंगे’ सुनने की तत्परता को सीधे व्यक्त करता है, जबकि आज्ञापालन का संभावित अर्थ टिप्पणी में सुरक्षित रखा गया है।
- source_word: וְאַל יְדַבֵּר
  choice: पर ... बात न करे
  rationale: אַל के साथ अपूर्ण क्रिया निषेधात्मक/जुसिव भाव देती है; ‘पर’ पिछले अनुरोध के साथ स्पष्ट विरोध दिखाता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: एकवचन क्रिया और सीनै का प्रसंग इस्राएल के एक परमेश्वर को सूचित करते हैं; ‘परमेश्वर’ हिन्दी बाइबिलीय प्रयोग में स्वाभाविक और गरिमापूर्ण है।
- source_word: פֶּן נָמוּת
  choice: कहीं ऐसा न हो कि हम मर जाएँ
  rationale: פֶּן भयभीत करने वाले संभावित परिणाम को प्रस्तुत करता है; यह हिन्दी वाक्यांश उस आशंका को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: אֱלֹהִים का वचन और अभिप्रेत व्यक्ति
  choice: एकवचन ‘परमेश्वर’
  alternative: बहुवचन ‘देवता’
  rationale: निकटवर्ती सीनै-प्रसंग तथा एकवचन יְדַבֵּר एक ही परमेश्वर को अभिप्रेत बताते हैं; यह व्याकरणिक और प्रसंगगत निर्णय है।
- issue: וְנִשְׁמָעָה में सुनने और मानने का संबंध
  choice: मुख्य पाठ में ‘हम सुनेंगे’
  alternative: ‘हम मानेंगे’ / ‘हम आज्ञा मानेंगे’
  rationale: क्रिया का प्राथमिक अर्थ सुनना है, यद्यपि वह ध्यानपूर्वक सुनने और उत्तरदायी आज्ञाकारिता को भी सूचित कर सकती है। मुख्य पाठ व्यापक अर्थ को संकुचित नहीं करता; पादटिप्पणी इस अर्थ-व्याप्ति को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज। मूसा को संबोधन में ‘आप’ और ‘कीजिए’ लोगों के निवेदन तथा मूसा के प्रति सम्मान को स्वाभाविक हिन्दी में व्यक्त करते हैं। ‘आप ही’ मूल के स्पष्ट सर्वनाम का विरोधात्मक बल बनाए रखता है।
