base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/017.yaml
  text: You shall not covet your neighbor’s house; you shall not covet your neighbor’s wife[a], or his male servant, or his female servant, or his ox, or his donkey, or anything that belongs to your neighbor.
translation:
  language: hi
  text: तुम अपने पड़ोसी के घर[a] का लालच न करना; तुम अपने पड़ोसी की पत्नी, उसके दास, उसकी दासी, उसके बैल, उसके गधे, या किसी भी ऐसी वस्तु का जो तुम्हारे पड़ोसी की है, लालच न करना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘घराने’ अथवा ‘गृहस्थी’। जिस इब्रानी शब्द का अनुवाद ‘घर’ किया गया है, वह पूरे घराने को भी दर्शा सकता है; फिर भी यहाँ आगे पत्नी, दास-दासी और पशुओं का अलग उल्लेख होने के कारण ‘घर’ मुख्य पाठ में अधिक उपयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תַחְמֹד
  choice: लालच करना
  rationale: यहाँ חמד किसी दूसरे की वस्तु को पाने की अनुचित इच्छा को व्यक्त करता है। ‘लालच करना’ आधुनिक हिन्दी में इस नैतिक निषेध को स्पष्ट रखता है, जबकि केवल ‘इच्छा करना’ अत्यधिक व्यापक और तटस्थ होता।
- source_word: בֵּית רֵעֶךָ
  choice: अपने पड़ोसी का घर
  rationale: בַּיִת का अर्थ भवन अथवा घराना, दोनों हो सकता है। इसके बाद पत्नी, दास-दासी और पशुओं की अलग सूची होने के कारण मुख्य पाठ में ‘घर’ अधिक स्वाभाविक है; वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: רֵעֶךָ
  choice: तुम्हारा पड़ोसी
  rationale: विधान के इस संदर्भ में רֵעַ समुदाय के दूसरे व्यक्ति को दर्शाता है। ‘पड़ोसी’ प्रचलित, सहज और पारस्परिक नैतिक संबंध को बनाए रखने वाला हिन्दी शब्द है।
- source_word: אֵשֶׁת רֵעֶךָ
  choice: अपने पड़ोसी की पत्नी
  rationale: सम्बन्धवाचक इब्रानी पदबंध का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: עַבְדּוֹ / אֲמָתוֹ
  choice: उसका दास / उसकी दासी
  rationale: कानूनी और संपत्ति-सूची के संदर्भ में ये शब्द बंधुआ सामाजिक स्थिति को स्पष्ट करते हैं। ‘दास’ और ‘दासी’ मूल के लिंग-भेद को भी बनाए रखते हैं।
- source_word: שׁוֹרוֹ / חֲמֹרוֹ
  choice: उसका बैल / उसका गधा
  rationale: ये दोनों सामान्य एकवचन पशु-संज्ञाएँ हैं और कानूनी सूची में स्वाभाविक आधुनिक हिन्दी देती हैं।
- source_word: וְכֹל אֲשֶׁר לְרֵעֶךָ
  choice: और न किसी भी ऐसी वस्तु का जो तुम्हारे पड़ोसी की है
  rationale: यह समापन पद सूची को सर्वसमावेशी बनाता है और לְ की स्वामित्व-संबंधी शक्ति को स्पष्ट रखता है।
- source_word: לֹא ... לֹא
  choice: लालच न करना; ... लालच करना
  rationale: दोनों निषेधों को अलग-अलग रखा गया है; दूसरे खंड में सूची के साथ ‘न’ दोहराकर इब्रानी बल और आज्ञात्मक शैली सुरक्षित रखी गई है।
theological_decisions:
- issue: पहले खंड में בֵּית को ‘घर’ या ‘घराना’ समझना
  choice: घर
  alternative: घराना / गृहस्थी
  rationale: בַּיִת दोनों अर्थ दे सकता है, पर आगे पत्नी, दास-दासी और पशु अलग-अलग गिनाए गए हैं। इसलिए ‘घर’ मुख्य पाठ में सूची की संरचना के अनुकूल है, जबकि वास्तविक वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- issue: वाचा-विधान में עֶבֶד और אָמָה का अनुवाद
  choice: दास / दासी
  alternative: सेवक / सेविका
  rationale: इस संपत्ति-सूची में बंधुआ सामाजिक स्थिति प्रमुख है। ‘दास/दासी’ उस कठोर ऐतिहासिक वास्तविकता को ‘सेवक/सेविका’ की अपेक्षा अधिक स्पष्टता से व्यक्त करते हैं, बिना उस व्यवस्था का धार्मिक समर्थन जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज आज्ञात्मक शैली अपनाई गई है। ‘मत करना’ के बजाय ‘न करना’ दस आज्ञाओं के विधिक स्वर को बनाए रखता है। सूची में मूल पाठ का लिंग-भेद और दोहरे निषेध की संरचना सुरक्षित रखी गई है।
