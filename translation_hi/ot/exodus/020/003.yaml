  choice: मेरे सामने
  alternative: मेरे सिवा; मेरी उपस्थिति में
  rationale: हिब्रू मुहावरा स्थानिक उपस्थिति और प्रसंग में अनन्यता—दोनों का संकेत दे सकता है। मुख्य पाठ अपेक्षाकृत शाब्दिक अभिव्यक्ति रखता है और संभावित अर्थों को पादटिप्पणी में सुरक्षित रखता है।
