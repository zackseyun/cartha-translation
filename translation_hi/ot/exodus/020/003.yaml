- source_word: עַל־פָּנָי
  choice: मेरे सामने
  rationale: इस पदबंध का शाब्दिक बिंब ‘मेरे मुख के सामने’ है। ‘मेरे सामने’ उस बिंब और वाचायी उपस्थिति को बनाए रखता है; ‘मेरे सिवा’ और ‘मेरी उपस्थिति में’ संभावित अर्थ हैं, जिन्हें पादटिप्पणी में रखा गया है।
theological_decisions:
