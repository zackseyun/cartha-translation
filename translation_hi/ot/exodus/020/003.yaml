  choice: तुम्हारे लिए ... न हों
  rationale: हिब्रू में शाब्दिक अर्थ ‘तुम्हारे लिए न हों’ है। यह हिंदी में स्वाभाविक रहते हुए निषेध और एकवचन संबोधन दोनों को व्यक्त करता है।
- source_word: אֱלֹהִים אֲחֵרִים
  choice: कोई और देवता
