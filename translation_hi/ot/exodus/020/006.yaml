translation:
  language: hi
  text: परन्तु मैं हज़ारों के लिए अटल प्रेम दिखाता हूँ—उनके लिए जो मुझसे प्रेम रखते और मेरी आज्ञाओं का पालन करते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעֹשֶׂה
  choice: परन्तु ... मैं ... करता हूँ
  rationale: सहभागी रूप पिछले पद में दण्ड के कथन के साथ विरोध दर्शाता है। हिन्दी में पूर्ण वाक्य स्वाभाविक रखने के लिए कर्ता और क्रिया स्पष्ट किए गए हैं।
- source_word: חֶסֶד
  choice: अटल प्रेम
  rationale: חֶסֶד में स्थायी, निष्ठावान और वाचा-संबंधी प्रेम का भाव है; ‘अटल प्रेम’ आधुनिक हिन्दी में इसे संक्षेप और गरिमा के साथ व्यक्त करता है।
- source_word: לַאֲלָפִים
  choice: उन हज़ारों पर
  rationale: इब्रानी पाठ में केवल ‘हज़ारों’ है; ‘पीढ़ियाँ’ स्पष्ट रूप से नहीं लिखा। इसलिए मुख्य पाठ मूल की अनिश्चितता बनाए रखता है।
- source_word: לְאֹהֲבַי
  choice: जो मुझसे प्रेम करते
  rationale: सहभागी रूप और प्रथम-पुरुष प्रत्यय को स्वाभाविक हिन्दी संबंधवाचक उपवाक्य में व्यक्त किया गया है।
- source_word: וּלְשֹׁמְרֵי
  choice: और ... मानते हैं
  rationale: आज्ञाओं के संदर्भ में שׁמר का अर्थ पालन करना है; हिन्दी में ‘आज्ञाओं को मानना’ सहज और स्पष्ट है।
- source_word: מִצְוֺתָי
  choice: मेरी आज्ञाओं
  rationale: ‘आज्ञाएँ’ दस आज्ञाओं के विधिक और वाचागत संदर्भ को बनाए रखता है।
theological_decisions:
- issue: לַאֲלָפִים का विस्तार
  choice: हज़ारों
  alternative: हज़ार पीढ़ियों तक / हज़ारों पीढ़ियों तक
  rationale: इस पद के इब्रानी पाठ में ‘पीढ़ियाँ’ शब्द नहीं है। मुख्य पाठ उसी संक्षिप्त अभिव्यक्ति को रखता है, जबकि व्यवस्थाविवरण 5:10 और प्रचलित व्याख्या के आधार पर पीढ़ीगत अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और वाचागत संदर्भ के अनुकूल। ‘हज़ारों’ की वास्तविक अस्पष्टता पादटिप्पणी सहित सुरक्षित रखी गई है।
