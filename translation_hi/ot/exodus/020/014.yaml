  text: तुम व्यभिचार न करना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא
  choice: न करना
  rationale: हिब्रू לֹא अपूर्ण क्रिया के साथ यहाँ स्पष्ट और स्थायी निषेध व्यक्त करता है। हिंदी में ‘न करना’ दस आज्ञाओं की संक्षिप्त, प्रत्यक्ष और गंभीर निषेधात्मक शैली को स्वाभाविक रूप से बनाए रखता है।
- source_word: תִּנְאָף
  choice: व्यभिचार
  rationale: काल रूप נאף का अर्थ वैवाहिक निष्ठा तोड़ते हुए व्यभिचार करना है। ‘व्यभिचार करना’ आधुनिक मानक हिंदी में इस कानूनी और नैतिक निषेध का स्थापित तथा सटीक रूप है।
theological_decisions:
- issue: दस आज्ञाओं की निषेधात्मक शैली
  choice: तुम व्यभिचार न करना।
  alternative: व्यभिचार मत करना।
  rationale: לֹא के साथ द्वितीय पुरुष एकवचन अपूर्ण रूप वाचा-संबंधी कानून का दृढ़ निषेध है। ‘न करना’ बोलचाल के ‘मत करना’ की तुलना में अधिक गरिमापूर्ण और विधिक है, फिर भी आधुनिक पाठक के लिए सहज है।
- issue: पुल्लिंग एकवचन क्रियारूप का दायरा
  choice: लिंग-निरपेक्ष संदर्भ में सामान्य एकवचन ‘तुम’
  alternative: केवल पुरुष को संबोधित करने वाला स्पष्ट शब्दांकन
  rationale: हिब्रू क्रियारूप व्याकरणतः पुल्लिंग एकवचन है, पर दस आज्ञाओं में यह वाचा के सदस्य को प्रतिनिधिक रूप से संबोधित करता है। हिंदी ‘तुम’ संख्या और लिंग को अनावश्यक रूप से स्पष्ट किए बिना संबोधन की प्रत्यक्षता बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण और स्मरणीय आज्ञात्मक शैली। ‘तुम’ मूल के प्रत्यक्ष द्वितीय-पुरुष संबोधन को रखता है; ‘व्यभिचार’ मूल क्रिया का स्थापित नैतिक-कानूनी अर्थ देता है।
