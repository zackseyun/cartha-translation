lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: कहे
  rationale: यहाँ क्रिया प्रत्यक्ष वाणी का परिचय देती है; आधुनिक हिन्दी में ‘वचन कहे’ स्वाभाविक और अर्थ-सटीक है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: इस संदर्भ में इस्राएल के परमेश्वर के लिए मानक, प्रतिष्ठित हिन्दी पद।
- source_word: כָּל־הַדְּבָרִים הָאֵלֶּה
  choice: ये सब वचन
  rationale: דְּבָרִים का अर्थ यहाँ आगे घोषित की जाने वाली बातें/वचन है; ‘ये सब वचन’ पारंपरिक गरिमा और स्पष्टता दोनों रखता है।
- source_word: לֵאמֹר
  choice: ':'
  rationale: यह infinitive आगे आने वाले प्रत्यक्ष कथन का परिचायक है; हिन्दी में इसे अलग से ‘यह कहते हुए’ दोहराने के बजाय विसर्ग से स्वाभाविक रूप में व्यक्त किया गया है।
