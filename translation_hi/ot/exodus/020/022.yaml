  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה כֹּ֥ה תֹאמַ֖ר אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל אַתֶּ֣ם רְאִיתֶ֔ם כִּ֚י מִן הַ/שָּׁמַ֔יִם דִּבַּ֖רְתִּי עִמָּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/022.yaml
  text: 'Then Yahweh said to Moses[c][b][a], “Thus you shall say to the sons of Israel: You yourselves have seen that I have spoken to you from heaven.”'
translation:
  language: hi
  text: 'तब याहवे ने मूसा से कहा, “तुम इस्राएलियों[a] से यह कहना: ‘तुमने स्वयं देखा है कि मैंने स्वर्ग से तुम्हारे साथ बात की है।’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “इस्राएल के पुत्रों”; इसका आशय इस्राएल के लोग है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबलीय परंपरा में प्रचलित नाम-रूप है और मूल पाठ के व्यक्तिगत वाचा-नाम को सामान्य उपाधि में नहीं बदलता।
- source_word: וַיֹּאמֶר
  choice: तब ... ने ... कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में उसका स्वाभाविक क्रमिक बल व्यक्त करता है।
- source_word: כֹּה תֹאמַר
  choice: तुम ... से यह कहना
  rationale: दूत-सूत्र का आदेशात्मक बल बनाए रखते हुए हिन्दी में स्वाभाविक अभिव्यक्ति देता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: यह पद शाब्दिक रूप से ‘इस्राएल के पुत्रों’ है, पर यहाँ समूचे वाचा-समुदाय का सामान्य सामूहिक नाम है; ‘इस्राएलियों’ से आशय स्पष्ट और स्वाभाविक रहता है।
- source_word: אַתֶּם רְאִיתֶם
  choice: तुमने स्वयं देखा है
  rationale: स्वतंत्र सर्वनाम का जोर ‘स्वयं’ से व्यक्त होता है और पूर्ण क्रिया का वर्तमान साक्ष्य-संबंध ‘देखा है’ में बना रहता है।
- source_word: מִן הַשָּׁמַיִם
  choice: स्वर्ग से
  rationale: हिब्रू का रूप व्याकरणतः बहुवचन है, किंतु इस अर्थ में आधुनिक हिन्दी का स्वाभाविक रूप ‘स्वर्ग से’ है।
- source_word: דִּבַּרְתִּי עִמָּכֶם
  choice: मैंने ... तुम्हारे साथ बात की है
  rationale: עִם का सामान्य अर्थ ‘साथ’ है; यह प्रत्यक्ष सामना और संवाद का रंग सुरक्षित रखता है, केवल एकतरफा संबोधन तक अर्थ सीमित नहीं करता।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: नाम को उपाधि ‘प्रभु’ से बदलने के बजाय उसका हिन्दी में परिचित व्यक्तिगत नाम-रूप रखा गया है। ‘याहवे’ मूल उच्चारण का अधिक प्रत्यक्ष लिप्यंतरण है, पर ‘यहोवा’ सामान्य हिन्दी पाठक के लिए अधिक पहचाना हुआ है।
- issue: בְּנֵי יִשְׂרָאֵל का सामूहिक आशय
  choice: इस्राएलियों
  alternative: इस्राएल के पुत्रों; इस्राएल की संतान
  rationale: मूल की पुरुषवाची शाब्दिक बनावट को पादटिप्पणी में बताया गया है, जबकि मुख्य पाठ में पूरे समुदाय—स्त्री और पुरुष—का अभिप्रेत सामूहिक अर्थ स्वाभाविक हिन्दी में दिया गया है।
- issue: דבר עם में संबोधन या पारस्परिक भेंट का रंग
  choice: तुम्हारे साथ बात की है
  alternative: तुमसे बात की है; तुमसे कहा है
  rationale: ‘साथ’ मूल के עִם को प्रत्यक्ष रूप से दर्शाता और सीनै पर हुई सीधी भेंट का रंग बनाए रखता है; फिर भी इसका आशय आवश्यकतः समान स्तर का पारस्परिक संवाद नहीं है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। आदेश-सूत्र को अत्यधिक संस्कृतनिष्ठ ‘इस प्रकार कहना’ के बजाय स्वाभाविक ‘यह कहना’ से व्यक्त किया गया है; ‘स्वयं’ मूल के जोर को सुरक्षित रखता है।
