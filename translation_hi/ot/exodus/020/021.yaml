base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/021.yaml
  text: The people stood at a distance[a], and Moses approached the thick darkness where God was.
translation:
  language: hi
  text: लोग दूर खड़े रहे, और मूसा उस घने अंधकार[a] के पास गया जहाँ परमेश्वर था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘काला बादल’ अथवा ‘धुंधलापन’। इब्रानी शब्द उस घने अंधकार को भी दर्शा सकता है जो परमेश्वर के प्रकट होने से जुड़ा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: खड़े रहे
  rationale: यह क्रिया लोगों के दूर अपना स्थान लेकर वहीं बने रहने का भाव देती है; प्रसंग में ‘खड़े रहे’ स्वाभाविक और संक्षिप्त है।
- source_word: הָעָם
  choice: लोग
  rationale: निश्चित पद पहले से उल्लिखित इस्राएली समुदाय को सूचित करता है; ‘लोग’ बिना अतिरिक्त शब्द जोड़े इसे स्पष्ट करता है।
- source_word: מֵרָחֹק
  choice: दूर
  rationale: यह स्थानगत दूरी दर्शाता है; ‘दूर’ आधुनिक हिन्दी में सहज है।
- source_word: נִגַּשׁ
  choice: के पास गया
  rationale: נגשׁ का अर्थ निकट जाना है; ‘के पास गया’ सरल आधुनिक हिन्दी में उस गति को व्यक्त करता है।
- source_word: הָעֲרָפֶל
  choice: घना अंधकार
  rationale: עֲרָפֶל गहरे या सघन अंधकार को दर्शाता है, विशेषतः परमेश्वर के प्रकट होने के संदर्भ में; यह चयन दृश्य अस्पष्टता और गंभीरता दोनों बनाए रखता है।
- source_word: אֲשֶׁר שָׁם הָאֱלֹהִים
  choice: जहाँ परमेश्वर था
  rationale: सम्बन्धवाचक उपवाक्य परमेश्वर की उपस्थिति का स्थान बताता है; यह रूप मूल की सीधी अभिव्यक्ति और उसके तनाव को सुरक्षित रखता है।
- source_word: הָאֱלֹהִים
  choice: परमेश्वर
  rationale: इस प्रसंग में यह पद इस्राएल के परमेश्वर को सूचित करता है; हिन्दी बाइबलीय संदर्भ में ‘परमेश्वर’ स्पष्ट, प्रतिष्ठित और स्वाभाविक है।
theological_decisions:
- issue: अंधकार में परमेश्वर की उपस्थिति का वर्णन
  choice: עֲרָפֶל का ठोस अनुवाद ‘घना अंधकार’ किया गया है।
  alternative: काला बादल; धुंधलापन
  rationale: पद परमेश्वर की पवित्र उपस्थिति को अस्पष्टता और अगम्यता के साथ रखता है। अनुवाद इस तनाव को केवल मौसम-संबंधी बादल या प्रतीकात्मक अर्थ में सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली। ‘था’ को बनाए रखकर मूल कथन की सीधाई और धर्मवैज्ञानिक तनाव सुरक्षित रखा गया है।
