base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/024.yaml
  text: You shall make for me an altar of earth[a], and on it you shall sacrifice your burnt offerings and your peace offerings, your flock and your herd. In every place where I cause my name to be remembered, I will come to you and bless you.
translation:
  language: hi
  text: तुम मेरे लिए मिट्टी की एक वेदी बनाना और उस पर अपनी होमबलियाँ और मेलबलियाँ, अपनी भेड़-बकरियाँ और गाय-बैल चढ़ाना। हर उस स्थान पर जहाँ मैं अपने नाम का स्मरण कराऊँगा[a], मैं तुम्हारे पास आऊँगा और तुम्हें आशीष दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘जहाँ मैं अपने नाम की घोषणा करूँगा’ अथवा ‘जहाँ मैं अपना नाम अंकित करूँगा।’ इब्रानी क्रिया कारणवाचक है और उसका अर्थ परमेश्वर के नाम का स्मरण, उल्लेख, प्रचार या आह्वान कराया जाना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְבַּח אֲדָמָה
  choice: मिट्टी की एक वेदी
  rationale: यह संबंध-संरचना मिट्टी या भूमि से बनी वेदी को दर्शाती है। यह हिंदी में ठोस, स्वाभाविक और मूल के निकट है।
- source_word: תַּעֲשֶׂה לִּי
  choice: तुम मेरे लिए ... बनाना
  rationale: विधिक निर्देश में अपूर्ण क्रिया आज्ञार्थक बल रखती है। आधुनिक हिंदी में ‘बनाना’ प्रत्यक्ष निर्देश को स्वाभाविक रूप से व्यक्त करता है और ‘मेरे लिए’ समर्पण का भाव बनाए रखता है।
- source_word: וְזָבַחְתָּ עָלָיו
  choice: और उस पर ... चढ़ाना
  rationale: बलिदान-संदर्भ में ‘चढ़ाना’ हिंदी का स्वाभाविक धार्मिक पद है; ‘उस पर’ वेदी को स्पष्ट रूप से संदर्भित करता है।
- source_word: עֹלֹתֶיךָ
  choice: अपने होमबलि
  rationale: पूरी तरह जलाए जाने वाले बलिदान के लिए ‘होमबलि’ स्थापित और संक्षिप्त हिंदी पारिभाषिक शब्द है।
- source_word: שְׁלָמֶיךָ
  choice: अपने मेलबलि
  rationale: ‘मेलबलि’ शांति, कुशल और सहभागिता से जुड़े इस बलिदान के व्यापक अर्थ को किसी एक पक्ष तक सीमित किए बिना व्यक्त करता है।
- source_word: אֶת צֹאנְךָ וְאֶת בְּקָרֶךָ
  choice: अपनी भेड़-बकरियों और गाय-बैलों में से
  rationale: צֹאן छोटे पालतू पशुओं, विशेषकर भेड़-बकरियों, और בָּקָר गोवंश को सूचित करता है। हिंदी में ये ठोस वर्गनाम ‘झुंड’ जैसे अस्पष्ट शब्दों से अधिक स्पष्ट हैं; ‘में से’ बलियों और पशुओं के संबंध को स्वाभाविक बनाता है।
- source_word: בְּכָל הַמָּקוֹם
  choice: हर उस स्थान पर
  rationale: यह वितरणात्मक अर्थ को सहज हिंदी में व्यक्त करता है और आगे आने वाले संबंधवाचक उपवाक्य से स्वाभाविक रूप से जुड़ता है।
- source_word: אֲשֶׁר אַזְכִּיר אֶת שְׁמִי
  choice: जहाँ मैं अपने नाम का स्मरण कराऊँगा
  rationale: זכר के हिफ़ील रूप का कारणवाचक भाव ‘स्मरण कराऊँगा’ में सुरक्षित रहता है। इससे घोषणा, उल्लेख, स्मारकीकरण या नाम के आह्वान में से किसी एक अर्थ को अनावश्यक रूप से निर्णायक नहीं बनाया जाता।
- source_word: אָבֹא אֵלֶיךָ וּבֵרַכְתִּיךָ
  choice: मैं तुम्हारे पास आऊँगा और तुम्हें आशीष दूँगा
  rationale: यह परमेश्वर के निकट आने और आशीष देने, दोनों प्रत्यक्ष प्रतिज्ञाओं को स्पष्ट और स्वाभाविक हिंदी में रखता है।
theological_decisions:
- issue: אֲשֶׁר אַזְכִּיר אֶת שְׁמִי में परमेश्वर की क्रिया का अर्थ
  choice: जहाँ मैं अपने नाम का स्मरण कराऊँगा
  alternative: जहाँ मैं अपने नाम की घोषणा करूँगा; जहाँ मैं अपना नाम अंकित करूँगा; जहाँ मैं अपने नाम का आह्वान कराऊँगा
  rationale: कारणवाचक इब्रानी रूप परमेश्वर की सक्रियता को सुरक्षित रखता है, पर यह ठीक किस प्रकार उसका नाम स्मरण, उल्लिखित या प्रतिष्ठित होता है, इसे पाठ से अधिक निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। एकवचन संबोधन ‘तुम’ मूल के दूसरे पुरुष एकवचन को दर्शाता है। बलिदान-संबंधी स्थापित पद ‘होमबलि’ और ‘मेलबलि’ बनाए रखे गए हैं। पादटिप्पणी-चिह्न उस अस्पष्ट इब्रानी उपवाक्य के बाद रखा गया है जिससे पादटिप्पणी वास्तव में संबंधित है।
