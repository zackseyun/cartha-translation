source:
  edition: WLC
  text: לֹֽ֣א תַֽעֲשֶׂ֨ה לְ/ךָ֥ פֶ֨סֶל֙ וְ/כָל תְּמוּנָ֔ה אֲשֶׁ֤ר בַּ/שָּׁמַ֨יִם֙ מִ/מַּ֔עַל וַ/אֲשֶׁ֥ר בָּ/אָ֖רֶץ מִ/תָּ֑חַת וַ/אֲשֶׁ֥ר בַּ/מַּ֖יִם מִ/תַּ֥חַת לָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/004.yaml
  text: You shall not make for yourself a carved image[a], or any likeness of what is in the heavens above, or on the earth beneath[c][b], or in the waters under the earth.
translation:
  language: hi
  text: तू अपने लिए कोई तराशी हुई प्रतिमा[a] या किसी भी वस्तु का प्रतिरूप[b] न बनाना—चाहे वह ऊपर आकाश में हो, नीचे पृथ्वी पर हो, या पृथ्वी के नीचे जल में हो।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तराशकर बनाई हुई छवि।” इब्रानी शब्द विशेष रूप से काटकर या तराशकर बनाई गई छवि को सूचित करता है; “देवमूर्ति” कहना अधिक व्याख्यात्मक होगा।
    reason: lexical_alternative
  - marker: b
    text: या “कोई आकृति” अथवा “कोई समान रूप।”
    reason: lexical_alternative
  - marker: c
    text: 'यह पद प्राचीन ब्रह्मांड-वर्णन की स्थानिक भाषा में सृष्टि के क्षेत्रों को बताता है: ऊपर आकाश, नीचे पृथ्वी, और पृथ्वी के नीचे जल।'
    reason: cultural_note
lexical_decisions:
- source_word: לֹא תַעֲשֶׂה
  choice: न बनाना
  rationale: לֹא के साथ द्वितीय पुरुष एकवचन अपूर्ण क्रिया यहाँ सीधा निषेध व्यक्त करती है। ‘न बनाना’ दस आज्ञाओं की विधिक और गंभीर शैली को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: לְךָ
  choice: अपने लिए
  rationale: यह संबंधवाचक सर्वनाम कर्ता के निजी हित या प्रयोजन को दर्शाता है; हिन्दी में ‘अपने लिए’ इसका स्वाभाविक रूप है।
- source_word: פֶסֶל
  choice: तराशी हुई मूर्ति
  rationale: פֶסֶל काटकर या तराशकर बनाई गई छवि को सूचित करता है। ‘तराशी हुई मूर्ति’ इस निर्माण-विधि को स्पष्ट रखती है और केवल ‘पूजने की मूर्ति’ कहकर अर्थ को पहले से सीमित नहीं करती।
- source_word: וְכָל תְּמוּנָה
  choice: या किसी भी वस्तु का कोई प्रतिरूप
  rationale: תְּמוּנָה रूप, समानता या प्रतिनिधि आकृति का बोध कराता है। ‘प्रतिरूप’ व्यापक अर्थ को बनाए रखता है, और सूची में וְ का ‘या’ अनुवाद हिन्दी में निषेध की वैकल्पिक श्रेणियों को स्वाभाविक रूप से जोड़ता है।
- source_word: אֲשֶׁר בַּשָּׁמַיִם מִמַּעַל
  choice: चाहे वह ऊपर आकाश में हो
  rationale: यह सापेक्ष उपवाक्य प्रतिरूप के संभावित विषयों को बताता है। ‘ऊपर आकाश’ मूल के ऊर्ध्व स्थान और ब्रह्मांडीय भाषा को बनाए रखता है।
- source_word: וַאֲשֶׁר בָּאָרֶץ מִתָּחַת
  choice: नीचे पृथ्वी पर हो
  rationale: בָּאָרֶץ को यहाँ हिन्दी मुहावरे के अनुसार ‘पृथ्वी पर’ कहना स्वाभाविक है; ‘नीचे’ ऊपर के आकाश के साथ मूल स्थानिक विरोध को सुरक्षित रखता है।
- source_word: וַאֲשֶׁר בַּמַּיִם מִתַּחַת לָאָרֶץ
  choice: या पृथ्वी के नीचे जल में हो
  rationale: यह तीन-स्तरीय स्थानिक वर्णन की अंतिम श्रेणी है। अनुवाद प्राचीन विश्व-चित्र की भाषा को बिना आधुनिक व्याख्या जोड़े सीधे प्रस्तुत करता है।
theological_decisions:
- issue: दूसरी आज्ञा में निषेध का दायरा
  choice: पद में बताए गए अनुसार तराशी हुई मूर्ति और सृष्टि की किसी वस्तु का प्रतिरूप बनाने का निषेध रखा गया है, पर अनुवाद में ‘पूजा के लिए’ नहीं जोड़ा गया।
  alternative: इसे हर प्रकार की दृश्य कला का पूर्ण निषेध कहना, या मुख्य पाठ में इसे केवल पूजा के लिए बनाई गई मूर्तियों तक स्पष्ट रूप से सीमित कर देना।
  rationale: इब्रानी पद स्वयं मूर्ति और प्रतिरूप बनाने का निषेध तथा आकाश, पृथ्वी और जल की श्रेणियाँ देता है। दण्डवत करने और सेवा करने का संदर्भ अगले पद में आता है। इसलिए इस पद में ‘पूजा के लिए’ जोड़ना या हर कला पर प्रतिबंध स्पष्ट कर देना मूल पाठ की वास्तविक व्याख्यात्मक तनातनी को समय से पहले सुलझा देगा।
translation_notes:
  register: आज्ञा एक पुरुष से सीधे कही गई है, इसलिए ‘तू’ और एकवचन क्रियारूप रखा गया है। भाषा आधुनिक, गंभीर और सहज है। ‘तराशी हुई’ निर्माण की ठोस क्रिया बताता है; ‘प्रतिरूप’ व्यापक अर्थ को सुरक्षित रखता है। डैश के बाद ‘चाहे…’ वाली रचना लम्बे इब्रानी संबंधवाचक क्रम को स्पष्ट हिन्दी में प्रस्तुत करती है, बिना उसके दायरे को संकुचित किए।
