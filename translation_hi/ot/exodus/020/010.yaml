  text: but the seventh day is a Sabbath to Yahweh your God[a]; you shall not do any work—you, or your son, or your daughter, your male servant, or your female servant, or your livestock[c][b], or the sojourner within your gates.
translation:
  language: hi
  text: लेकिन सातवाँ दिन तुम्हारे परमेश्वर याहवे के लिए सब्त है[a]। उस दिन तुम कोई भी काम न करना—न तुम, न तुम्हारा बेटा, न तुम्हारी बेटी, न तुम्हारा दास, न तुम्हारी दासी[b], न तुम्हारे मवेशी, और न तुम्हारे फाटकों के भीतर जो परदेशी रहता है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और सातवाँ दिन।” इब्रानी संयोजक का अनुवाद दोनों प्रकार से हो सकता है; “लेकिन” पिछले पद के छह कार्य-दिवसों के साथ विरोध को उभारता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “तुम्हारा पुरुष दास ... तुम्हारी स्त्री दासी।” पारंपरिक अनुवादों में “सेवक” और “सेविका” भी मिलता है।
    reason: lexical_alternative
  - marker: c
    text: अर्थात समुदाय में रहने वाला गैर-इस्राएली; अनुवाद “निवासी विदेशी” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיוֹם הַשְּׁבִיעִי
  choice: लेकिन सातवाँ दिन
  rationale: वाव का मूल अर्थ ‘और’ हो सकता है, पर पिछले पद के छह कार्य-दिवसों के साथ स्पष्ट विरोध होने के कारण आधुनिक हिन्दी में ‘लेकिन’ स्वाभाविक है।
- source_word: שַׁבָּת
  choice: सब्त
  rationale: यह विशिष्ट इब्रानी धार्मिक-सामाजिक संज्ञा को केवल ‘विश्राम’ में सीमित किए बिना सुरक्षित रखता है।
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: तुम्हारे परमेश्वर याहवे के लिए
  rationale: लामेद दिन के याहवे के लिए समर्पित या अलग ठहराए जाने का संबंध व्यक्त करता है; याहवे मूल पाठ के वाचा-नाम को दर्शाता है।
- source_word: לֹא תַעֲשֶׂה כָל מְלָאכָה
  choice: उस दिन कोई भी काम न करना
  rationale: निषेध की आज्ञात्मक शक्ति और כָל की व्यापकता सहज आधुनिक हिन्दी में व्यक्त होती है; ‘उस दिन’ सन्दर्भ को स्पष्ट करता है।
- source_word: עַבְדְּךָ וַאֲמָתְךָ
  choice: तुम्हारा दास या तुम्हारी दासी
  rationale: जोड़ी घरेलू बंधुआ स्थिति को सूचित करती है; ‘दास/दासी’ सामाजिक यथार्थ को ‘सेवक/सेविका’ की अपेक्षा अधिक स्पष्ट रखता है।
- source_word: וּבְהֶמְתֶּךָ
  choice: तुम्हारे मवेशी
  rationale: यह घराने के पालतू पशुधन के सामूहिक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְגֵרְךָ אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: तुम्हारे फाटकों के भीतर रहने वाला परदेशी
  rationale: גֵּר किसी अस्थायी अजनबी मात्र के बजाय समुदाय में रहने वाले गैर-स्थानीय व्यक्ति को दर्शाता है; ‘फाटकों के भीतर’ मूल न्यायिक-नगरीय अभिव्यक्ति को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा-नाम सीधे उपस्थित है। ‘याहवे’ उसे उपाधि में बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: सब्त की आज्ञा के अधीन घराने का दायरा
  choice: बच्चों, दास-दासी, मवेशियों और निवासी परदेशी—सभी को स्पष्ट रूप से सम्मिलित करना
  alternative: आज्ञा को केवल संबोधित गृहस्वामी पर लागू समझना
  rationale: इब्रानी पाठ प्रत्येक श्रेणी को स्पष्ट रूप से गिनाता है; अनुवाद इस व्यापक दायरे को न तो नरम करता है, न संकुचित।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘सब्त’ और ‘फाटक’ जैसे स्थापित बाइबिलीय शब्द मूल सांस्कृतिक जगत को बनाए रखते हैं, जबकि वाक्य-विन्यास सहज हिन्दी का है।
