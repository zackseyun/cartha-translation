base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/012.yaml
  text: Honor your father and your mother[b][a], so that your days may be long on the land that Yahweh your God is giving you.
translation:
  language: hi
  text: अपने पिता और अपनी माता का आदर करो, ताकि जिस भूमि को याहवे, तुम्हारा परमेश्वर, तुम्हें दे रहा है, उस पर[b] तुम्हारे दिन लंबे हों[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘तुम्हारे दिन लंबे हों’ दीर्घ जीवन के लिए प्रयुक्त एक हिब्रू मुहावरा है।
    reason: cultural_note
  - marker: b
    text: इसका अनुवाद ‘उस भूमि में’ भी किया जा सकता है। हिब्रू संबंधबोधक का मूल अर्थ ‘पर/ऊपर’ है, पर इस संदर्भ में हिन्दी में ‘में’ भी स्वाभाविक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּבֵּד
  choice: आदर करो
  rationale: पिएल आज्ञार्थक रूप माता-पिता को महत्त्व और सम्मान देने का आदेश देता है। ‘आदर करो’ आधुनिक हिन्दी में स्वाभाविक है और केवल भावनात्मक सम्मान नहीं, बल्कि व्यवहार में मान देने का नैतिक बल भी रखता है।
- source_word: אָבִיךָ וְאֶת אִמֶּךָ
  choice: अपने पिता और अपनी माता
  rationale: दोनों एकवचन संबंधवाचक रूपों का सीधा और स्वाभाविक अनुवाद है। ‘अपने’ कर्ता के साथ संबंध स्पष्ट करता है, जबकि प्रत्येक संज्ञा के साथ संरचना का संतुलन बना रहता है।
- source_word: לְמַעַן
  choice: ताकि
  rationale: यह उद्देश्य अथवा परिणाम प्रस्तुत करता है। ‘ताकि’ आधुनिक हिन्दी में दोनों संभावनाओं को बिना अनावश्यक व्याख्या के स्वाभाविक रूप से व्यक्त करता है।
- source_word: יַאֲרִכוּן יָמֶיךָ
  choice: तुम्हारे दिन लंबे हों
  rationale: हिब्रू मुहावरे और उसकी बाइबिलीय प्रतिध्वनि को निकटता से सुरक्षित रखा गया है; इसका आशय दीर्घ जीवन है, जिसे पादटिप्पणी में स्पष्ट किया गया है।
- source_word: עַל הָאֲדָמָה
  choice: उस भूमि पर
  rationale: עַל का मूल स्थानवाचक भाव ‘पर’ से सुरक्षित रहता है और אֲדָמָה को इस संदर्भ में परमेश्वर द्वारा दी जाने वाली भूमि समझा गया है, केवल मिट्टी या पूरी पृथ्वी नहीं। संकेतवाचक ‘उस’ आगे आने वाले संबंधवाचक उपवाक्य से स्वाभाविक रूप से जुड़ता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: व्यक्तिगत दिव्य नाम के प्रचलित विद्वत्तापूर्ण उच्चारण Yahweh का देवनागरी लिप्यंतरण है; इसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: אֱלֹהֶיךָ
  choice: तुम्हारा परमेश्वर
  rationale: द्वितीय पुरुष एकवचन संबंधसूचक रूप का मानक, स्पष्ट और गरिमापूर्ण हिन्दी अनुवाद।
- source_word: נֹתֵן לָךְ
  choice: तुम्हें दे रहा है
  rationale: वर्तमान कृदंत भूमि देने की जारी अथवा आसन्न क्रिया को व्यक्त कर सकता है। सीनै के प्रसंग में ‘दे रहा है’ उस प्रक्रियात्मक और प्रतिज्ञात्मक पक्ष को बनाए रखता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में उपाधि नहीं, परमेश्वर का व्यक्तिगत नाम है। ‘याहवे’ उसका सीधे देवनागरी में लिप्यंतरण करता है और ‘प्रभु’ द्वारा नाम को छिपाता नहीं।
- issue: הָאֲדָמָה का संदर्भगत दायरा
  choice: भूमि
  alternative: धरती; मिट्टी
  rationale: ‘जिसे ... तुम्हें दे रहा है’ वाला उपवाक्य इस शब्द को इस्राएल को दी जाने वाली भूमि से जोड़ता है। फिर भी पाठ में निहित से अधिक जोड़कर ‘प्रतिज्ञात देश’ नहीं कहा गया।
- issue: लंबे दिनों की प्रतिज्ञा
  choice: मुहावरे को मुख्य पाठ में सुरक्षित रखना
  alternative: तुम लंबी आयु पाओ
  rationale: शाब्दिक मुहावरा ‘तुम्हारे दिन लंबे हों’ मूल अभिव्यक्ति और उसके धर्मवैधानिक स्वर को बनाए रखता है। उसके सामान्य अर्थ—दीर्घ जीवन—को पादटिप्पणी में बताया गया है, जिससे प्रतिज्ञा की प्रकृति को उससे अधिक विशिष्ट नहीं बनाया जाता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। एकवचन संबोधन को हिन्दी के सामान्य ‘तुम’ रूप में व्यक्त किया गया है। आज्ञा के लिए ‘आदर करो’ सीधा और स्वाभाविक है। मूल हिब्रू मुहावरा तथा भूमि के साथ प्रयुक्त संबंधबोधक की संभावित अस्पष्टता पादटिप्पणियों सहित सुरक्षित रखी गई है।
