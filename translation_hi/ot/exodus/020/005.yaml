  text: You shall not bow down to them or serve them[a], for I, Yahweh your God, am a jealous God, visiting the iniquity of fathers on children, on the third and on the fourth generations of those who hate me[d][c][b],
translation:
  language: hi
  text: तू उनके आगे दण्डवत् न करना[a] और न उनकी सेवा करना[b], क्योंकि मैं, याहवे, तेरा परमेश्वर, एक ईर्ष्यालु परमेश्वर हूँ। मैं पिताओं के अधर्म का लेखा संतानों से तीसरी और चौथी पीढ़ी तक लेता हूँ—मुझसे बैर रखनेवालों से[c][d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उनके आगे भूमि पर गिरकर प्रणाम न करना’; इब्रानी क्रिया श्रद्धा प्रकट करने के लिए अपने को झुकाने या भूमि पर गिरने को बताती है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘उनकी उपासना न करना’; यहाँ ‘सेवा करना’ मूर्तियों को दी जानेवाली धार्मिक सेवा को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, ‘पिताओं के अधर्म का संतानों पर लेखा लेता हूँ।’ यह इब्रानी न्यायिक मुहावरा है; सम्बन्धित व्यक्तिगत उत्तरदायित्व की शिक्षा के लिए व्यवस्थाविवरण 24:16 और यहेजकेल 18 देखें।
    reason: cross_reference
  - marker: d
    text: या, ‘मुझसे बैर रखनेवालों की तीसरी और चौथी पीढ़ी तक।’ इब्रानी में ‘मुझसे बैर रखनेवालों’ का सम्बन्ध पूर्ववर्ती पीढ़ीगत चेतावनी से है।
    reason: alternative_reading
