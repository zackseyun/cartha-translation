  text: לֹ֥א תַעֲשׂ֖וּ/ן אִתִּ֑/י אֱלֹ֤הֵי כֶ֨סֶף֙ וֵ/אלֹהֵ֣י זָהָ֔ב לֹ֥א תַעֲשׂ֖וּ לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/023.yaml
  text: You shall not make gods of silver alongside me[a], nor shall you make for yourselves gods of gold.
translation:
  language: hi
  text: तुम मेरे साथ चाँदी के देवता न बनाना[a], और न अपने लिए सोने के देवता बनाना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मेरे पास’ अथवा ‘मेरे साथ-साथ।’ इब्रानी में शाब्दिक अर्थ ‘मेरे साथ’ है; प्रसंग में इसका आशय यहोवा के साथ किसी प्रतिद्वंद्वी देवता को स्थान न देने से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תַעֲשׂוּן / תַעֲשׂוּ
  choice: बनाना
  rationale: यहाँ עשה उपासना के लिए देव-प्रतिमाएँ बनाने को दर्शाता है। निषेधात्मक वाक्य में ‘न बनाना’ स्वाभाविक, सीधा और विधिक बल वाला आधुनिक हिन्दी प्रयोग है।
- source_word: אִתִּי
  choice: मेरे साथ
  rationale: इब्रानी पद का मूल अर्थ ‘मेरे साथ’ है। यह अनुवाद जानबूझकर मूल की संबंधगत अस्पष्टता बनाए रखता है और ‘मेरे बराबर’ या ‘मेरे स्थान पर’ जैसी अधिक व्याख्यात्मक धारणाएँ नहीं जोड़ता।
- source_word: אֱלֹהֵי כֶסֶף
  choice: चाँदी के देवता
  rationale: यह पदबंध इब्रानी रचना का सीधा और स्वाभाविक हिन्दी रूप है तथा निर्मित देवताओं की सामग्री पर स्पष्ट बल देता है।
- source_word: וֵאלֹהֵי זָהָב
  choice: और न ... सोने के देवता
  rationale: दूसरे לֹא के साथ दोहराया निषेध समानांतर वाक्य-रचना बनाता है; ‘और न’ उसे हिन्दी में स्पष्ट रूप से सुरक्षित रखता है।
- source_word: לָכֶם
  choice: अपने लिए
  rationale: यह बहुवचन संबोधन में लोगों द्वारा अपने उपयोग या अधिकार के लिए देवता बनाने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לֹא ... לֹא
  choice: न ... और न
  rationale: दोनों निषेधों को अलग और समन्वित रखते हुए वाचा-संबंधी आज्ञा की दृढ़ता बनाए रखता है।
theological_decisions:
- issue: אִתִּי को केवल ‘मेरे साथ’ रखा जाए या प्रतिद्वंद्वी उपासना स्पष्ट करने के लिए ‘मेरे बराबर/मेरे पास’ कहा जाए
  choice: मेरे साथ
  alternative: मेरे पास; मेरे बराबर; मेरे साथ-साथ
  rationale: मूल पद का शाब्दिक अर्थ ‘मेरे साथ’ है। प्रसंग विशिष्ट उपासना का संकेत देता है, पर मुख्य पाठ में अधिक निश्चित व्याख्या जोड़ना मूल की अर्थगत गुंजाइश को संकुचित कर देगा।
translation_notes:
  register: आधुनिक मानक हिन्दी में सीधी, गरिमापूर्ण आज्ञात्मक शैली रखी गई है। ‘मत बनाना’ की अपेक्षा ‘न बनाना’ चुना गया है, क्योंकि यह संहिता-सदृश प्रसंग में अधिक संक्षिप्त और विधिक सुनाई देता है।
