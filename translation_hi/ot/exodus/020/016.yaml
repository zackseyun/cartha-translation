- source_word: לֹא
  choice: न देना
  rationale: निषेध को आधुनिक और स्वाभाविक हिंदी आज्ञार्थक रचना में व्यक्त करता है।
- source_word: תַעֲנֶה
  choice: गवाही देना
  rationale: न्यायिक संदर्भ में क्रिया का अर्थ उत्तर देने से अधिक विशेष रूप से साक्षी के रूप में बयान देना है।
- source_word: בְרֵעֲךָ
  choice: अपने पड़ोसी के विरुद्ध
  rationale: רֵעַ का सामान्य अर्थ पड़ोसी या साथी है; न्यायिक प्रसंग में בְּ प्रतिकूल दिशा को व्यक्त करता है, इसलिए 'के विरुद्ध' उपयुक्त है।
- source_word: עֵד שָׁקֶר
  choice: झूठी गवाही
  rationale: हिंदी में यह स्वाभाविक न्यायिक पदबंध है और झूठे साक्ष्य अथवा मिथ्या बयान का आशय स्पष्ट करता है।
