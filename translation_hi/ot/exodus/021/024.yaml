source:
  edition: WLC
  text: עַ֚יִן תַּ֣חַת עַ֔יִן שֵׁ֖ן תַּ֣חַת שֵׁ֑ן יָ֚ד תַּ֣חַת יָ֔ד רֶ֖גֶל תַּ֥חַת רָֽגֶל׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/024.yaml
  text: eye for eye[a], tooth for tooth, hand for hand, foot for foot.
translation:
  language: hi
  text: आँख के बदले आँख,[a] दाँत के बदले दाँत, हाथ के बदले हाथ, पैर के बदले पैर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आँख के स्थान पर आँख, दाँत के स्थान पर दाँत, हाथ के स्थान पर हाथ, पैर के स्थान पर पैर।”
    reason: תַּחַת के निकटतर वैकल्पिक अर्थ ‘के स्थान पर’ को दर्ज करना और मूल में निहित प्रतिस्थापन/प्रतिदान की छाया सुरक्षित रखना।
lexical_decisions:
- source_word: עַיִן
  choice: आँख
  rationale: यह संज्ञा शरीर की आँख को स्पष्ट रूप से दर्शाती है। बिना अनिश्चिततासूचक शब्द के प्रयोग से इब्रानी कानूनी सूत्र की संक्षिप्तता बनी रहती है।
- source_word: תַּחַת
  choice: के बदले
  rationale: इस कानूनी प्रसंग में इसका अर्थ स्थानसूचक ‘के नीचे’ नहीं, बल्कि किसी क्षति के स्थान पर उसके अनुरूप प्रतिदान है। ‘के बदले’ इस संबंध को स्वाभाविक हिंदी में व्यक्त करता है और दंड के स्वरूप की अतिरिक्त व्याख्या नहीं जोड़ता।
- source_word: שֵׁן
  choice: दाँत
  rationale: यह संज्ञा ‘दाँत’ को दर्शाती है और समानांतर कानूनी सूत्र की लय तथा संक्षिप्तता बनाए रखती है।
- source_word: יָד
  choice: हाथ
  rationale: यहाँ सामान्य शारीरिक अर्थ ‘हाथ’ उपयुक्त है और मूल पद के सीधे शाब्दिक अनुरूप को सुरक्षित रखता है।
- source_word: רֶגֶל
  choice: पैर
  rationale: यद्यपि कुछ प्रसंगों में यह टाँग या निचले अंग के व्यापक अर्थ में आ सकता है, यहाँ शरीर के अंगों वाले सूत्र में ‘पैर’ सबसे स्वाभाविक और सटीक हिंदी विकल्प है।
theological_decisions:
- issue: कानूनी सूत्र का स्वरूप
  choice: मूल की संक्षिप्त, समानांतर अभिव्यक्ति—‘आँख के बदले आँख ... पैर के बदले पैर’—को बनाए रखना।
  alternative: ‘हानि के अनुरूप दंड दिया जाए’ जैसी व्याख्यात्मक प्रस्तुति।
  rationale: इब्रानी पाठ में केवल शरीर के अंगों के जोड़े और תַּחַת हैं। व्याख्यात्मक रूप कानूनी सिद्धांत को स्पष्ट तो करता, पर मूल शब्दों से आगे जाकर अर्थ को एक विशेष ढंग से निश्चित कर देता।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण कानूनी शैली। ‘के बदले’ सामान्य पाठक के लिए स्वाभाविक है; पुनरावृत्ति मूल इब्रानी की लय और समानांतर संरचना को बनाए रखती है।
