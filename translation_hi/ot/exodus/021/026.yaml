  text: וְ/כִֽי יַכֶּ֨ה אִ֜ישׁ אֶת עֵ֥ין עַבְדּ֛/וֹ אֽוֹ אֶת עֵ֥ין אֲמָת֖/וֹ וְ/שִֽׁחֲתָ֑/הּ לַֽ/חָפְשִׁ֥י יְשַׁלְּחֶ֖/נּוּ תַּ֥חַת עֵינֽ/וֹ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/026.yaml
  text: And if a man strikes the eye of his male servant or the eye of his female servant and destroys it[c][b][a], he shall let him go free in compensation for his eye.
translation:
  language: hi
  text: और यदि कोई पुरुष अपने दास की आँख या अपनी दासी की आँख[b] पर प्रहार करे और उसे नष्ट कर दे[a], तो वह उसे उसकी आँख की क्षति के बदले[c] स्वतंत्र कर दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘और उसे अंधा कर दे’ भी हो सकता है। इब्रानी क्रिया आँख को बरबाद या निष्क्रिय कर देने, अर्थात स्थायी क्षति पहुँचाने, का भाव दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में स्वामित्वाधीन ‘पुरुष दास’ और ‘स्त्री दास’ के लिए अलग शब्द हैं। यह विधान मालिक द्वारा पहुँचाई गई स्थायी चोट के बदले स्वतंत्रता दिए जाने की बात करता है।
    reason: cultural_note
  - marker: c
    text: इब्रानी का अधिक शाब्दिक रूप ‘उसकी आँख के बदले’ है; यहाँ भाव आँख को पहुँचाई गई क्षति की प्रतिपूर्ति के रूप में रिहाई का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: यदि
  rationale: यह पद शर्त पर आधारित विधिक प्रकरण आरम्भ करता है। हिन्दी में ‘यदि’ इस कार्य को स्वाभाविक रूप से व्यक्त करता है; आरम्भिक וְ को अलग से ‘और’ कहना आवश्यक नहीं है।
- source_word: יַכֶּה
  choice: प्रहार करे
  rationale: נכה का मूल अर्थ मारना या प्रहार करना है। ‘प्रहार करे’ विधिक और गरिमापूर्ण शैली में एक वार को व्यक्त करता है, बिना बार-बार पीटने का भाव जोड़े।
- source_word: אִישׁ
  choice: कोई पुरुष
  rationale: इब्रानी शब्द व्याकरणतः पुल्लिंग एकवचन है। ‘कोई पुरुष’ शर्तपरक विधान की अनिश्चितता और मूल का लिंग—दोनों बनाए रखता है।
- source_word: עַבְדּוֹ / אֲמָתוֹ
  choice: अपने दास / अपनी दासी
  rationale: इस विधिक प्रसंग में ये शब्द स्वामित्वाधीन बंधुआ स्थिति और बाद में दी जाने वाली स्वतंत्रता को सूचित करते हैं। ‘दास/दासी’ आधुनिक हिन्दी में इस सामाजिक वास्तविकता को ‘सेवक/सेविका’ से अधिक स्पष्ट रखते हैं।
- source_word: וְשִׁחֲתָהּ
  choice: और उसे नष्ट कर दे
  rationale: שׁחת यहाँ आँख को स्थायी रूप से खराब या निष्क्रिय कर देने का अर्थ देता है। ‘नष्ट कर दे’ व्यापक अर्थ को बनाए रखता है; इसे केवल पूर्ण अंधापन तक सीमित नहीं करता।
- source_word: לַחָפְשִׁי יְשַׁלְּחֶנּוּ
  choice: उसे स्वतंत्र करके जाने दे
  rationale: यह पदबंध दासत्व से मुक्त कर देने का विधिक आदेश है। हिन्दी अभिव्यक्ति स्वतंत्रता और रिहाई दोनों को स्पष्ट करती है।
- source_word: תַּחַת עֵינוֹ
  choice: उसकी आँख के बदले
  rationale: תּחת विधिक प्रसंग में प्रतिपूर्ति अथवा बदले का भाव रखता है। ‘आँख के बदले’ मूल रूपक और प्रतिपूरक अर्थ दोनों सुरक्षित रखता है।
theological_decisions:
- issue: इस्राएली विधि में दासता-संबंधी शब्दावली
  choice: दास / दासी
  alternative: सेवक / सेविका
  rationale: पद में मालिक द्वारा चोट पहुँचाने और उसके बदले दास को स्वतंत्र करने की बात है; इसलिए बंधुआ और स्वामित्वाधीन सामाजिक स्थिति को नरम किए बिना व्यक्त करना आवश्यक है।
- issue: विधिक कर्ता का लिंग
  choice: कोई पुरुष
  alternative: कोई व्यक्ति
  rationale: मूल में אִישׁ पुल्लिंग है। हिन्दी में ‘पुरुष’ मूल की लैंगिक विशिष्टता बनाए रखता है, जबकि आदेश का लक्ष्य किसी निजी सिद्धान्त को स्थापित करना नहीं है।
- issue: पुल्लिंग कर्मवाचक सर्वनाम का दास या दासी दोनों पर लागू होना
  choice: उसे
  alternative: उस दास या दासी को
  rationale: इब्रानी में पुल्लिंग एकवचन सर्वनाम निकटवर्ती दोनों विकल्पों में से लागू व्यक्ति की ओर संकेत करता है। हिन्दी का ‘उसे’ समान संक्षिप्तता और संदर्भगत खुलापन बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण और विधिक है। वाक्य को सहज रखने के लिए आरम्भिक संयोजक का पृथक अनुवाद नहीं किया गया। ‘दास/दासी’ सामाजिक स्थिति को स्पष्ट करता है, और ‘स्वतंत्र करके जाने दे’ आदेश की कानूनी शक्ति को स्वाभाविक हिन्दी में व्यक्त करता है।
