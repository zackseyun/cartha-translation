source:
  edition: WLC
  text: וְ/כִֽי יִגֹּ֧ף שֽׁוֹר אִ֛ישׁ אֶת שׁ֥וֹר רֵעֵ֖/הוּ וָ/מֵ֑ת וּ/מָ֨כְר֜וּ אֶת הַ/שּׁ֤וֹר הַ/חַי֙ וְ/חָצ֣וּ אֶת כַּסְפּ֔/וֹ וְ/גַ֥ם אֶת הַ/מֵּ֖ת יֶֽחֱצֽוּ/ן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/035.yaml
  text: And if one man's ox strikes his neighbor's ox and it dies[a], then they shall sell the live ox and divide its price[c][b], and they shall also divide the dead one.
translation:
  language: hi
  text: और यदि किसी व्यक्ति का बैल उसके पड़ोसी के बैल को सींग मारे[a] और वह मर जाए, तो वे जीवित बैल को बेचकर उसकी कीमत[b] आपस में बाँट लें; और मरे हुए बैल को भी आपस में बाँट लें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “टक्कर मारे”; इब्रानी क्रिया बैल के जोरदार प्रहार को व्यक्त कर सकती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ “उसका चाँदी/धन” है, अर्थात जीवित बैल को बेचने से मिली रकम।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: और यदि
  rationale: यह विधिक शर्त का परिचय देता है; ‘और’ पूर्ववर्ती नियमों से संबंध बनाए रखता है और ‘यदि’ शर्त स्पष्ट करता है।
- source_word: יִגֹּף
  choice: सींग मारे
  rationale: संदर्भ में बैल द्वारा किए गए जोरदार प्रहार के लिए यह स्वाभाविक और सटीक हिन्दी है; क्रिया सामान्यतः मारने अथवा सींग से टक्कर देने का भाव रख सकती है।
- source_word: שׁוֹר אִישׁ
  choice: किसी व्यक्ति का बैल
  rationale: स्वामित्व और अनिश्चित एकवचन को स्पष्ट, आधुनिक हिन्दी में व्यक्त करता है।
- source_word: שׁוֹר רֵעֵהוּ
  choice: उसके पड़ोसी के बैल
  rationale: רֵעַ के पारस्परिक सामाजिक अर्थ को ‘पड़ोसी’ द्वारा सुरक्षित रखा गया है।
- source_word: וָמֵת
  choice: और वह मर जाए
  rationale: प्रहार के परिणाम को सरल शर्तात्मक विधिक हिन्दी में व्यक्त करता है।
- source_word: וּמָכְרוּ
  choice: तो वे ... बेचकर
  rationale: शर्त के बाद की विधिक प्रक्रिया और कार्यों का क्रम स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: הַשּׁוֹר הַחַי
  choice: जीवित बैल
  rationale: बचे हुए पशु के लिए संक्षिप्त और स्पष्ट अभिव्यक्ति है।
- source_word: וְחָצוּ אֶת כַּסְפּוֹ
  choice: उसकी कीमत आपस में बाँट लें
  rationale: כַּסְפּוֹ यहाँ बैल को बेचने से मिली धनराशि को सूचित करता है; ‘कीमत’ प्रसंगानुकूल है और ‘आपस में’ दोनों मालिकों में विभाजन स्पष्ट करता है।
- source_word: וְגַם אֶת הַמֵּת יֶחֱצוּן
  choice: और मरे हुए बैल को भी आपस में बाँट लें
  rationale: संज्ञीकृत ‘मरे हुए’ का संदर्भ स्पष्ट करने के लिए ‘बैल’ दोहराया गया है, जबकि वास्तविक पशु के विभाजन की विधिक बात सुरक्षित रहती है।
