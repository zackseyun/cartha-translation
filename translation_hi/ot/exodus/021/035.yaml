  register: आधुनिक मानक हिन्दी का सरल, dignified विधिक विन्यास अपनाया गया है। ‘बाँट लें’ आदेशात्मक कानूनी परिणाम को स्वाभाविक रूप से व्यक्त करता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
