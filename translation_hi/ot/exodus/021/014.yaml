  text: וְ/כִֽי יָזִ֥ד אִ֛ישׁ עַל רֵעֵ֖/הוּ לְ/הָרְג֣/וֹ בְ/עָרְמָ֑ה מֵ/עִ֣ם מִזְבְּחִ֔/י תִּקָּחֶ֖/נּוּ לָ/מֽוּת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/014.yaml
  text: But if a man schemes against his neighbor to kill him by treachery[c][b][a], you shall take him even from my altar to die.
translation:
  language: hi
  text: पर यदि कोई व्यक्ति अपने पड़ोसी को छल से मार डालने के इरादे से उसके विरुद्ध जान-बूझकर षड्यंत्र करे[a][b], तो तुम उसे मेरी वेदी के पास से भी हटाकर मृत्युदण्ड देना[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपने पड़ोसी के विरुद्ध ढिठाई से काम करे’; हिब्रू क्रिया इच्छापूर्वक, दुस्साहस के साथ किए गए कार्य का भाव भी रखती है।
    reason: lexical_alternative
  - marker: b
    text: या ‘कपटपूर्वक’ अथवा ‘चालाकी से’।
    reason: lexical_alternative
  - marker: c
    text: अर्थात यदि वह वेदी के पास शरण भी ले, तो वहाँ से हटाकर उसे मृत्युदण्ड दिया जाए।
    reason: cultural_note
lexical_decisions:
- source_word: וְכִי
  choice: पर यदि
  rationale: यह पिछले नियम से भिन्न, शर्तपरक स्थिति प्रस्तुत करता है; ‘पर यदि’ संबंध और विरोध दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יָזִד
  choice: जान-बूझकर ... योजना बनाए
  rationale: हिफ़ील रूप यहाँ आकस्मिक कृत्य के विपरीत इच्छापूर्वक, दुस्साहसपूर्ण और पूर्वनियोजित कार्य को सूचित करता है। हत्या के इस प्रसंग में यह चयन जानबूझकर रची गई योजना को स्पष्ट करता है, पर בערמה के ‘छल’ से इसे अलग रखता है।
- source_word: אִישׁ
  choice: कोई व्यक्ति
  rationale: हिब्रू में पुल्लिंग एकवचन कानूनी उदाहरण है, पर इसका नियम सामान्य रूप से किसी भी व्यक्ति पर लागू है; आधुनिक हिन्दी में ‘कोई व्यक्ति’ इस प्रतिनिधिक अर्थ को स्वाभाविक ढंग से देता है।
- source_word: עַל רֵעֵהוּ
  choice: अपने पड़ोसी ... उसके विरुद्ध
  rationale: רֵעַ समुदाय के दूसरे सदस्य या साथी को दर्शाता है और עַל वैरपूर्ण कार्रवाई की दिशा बताता है। ‘पड़ोसी’ स्थापित नैतिक-कानूनी शब्द है।
- source_word: לְהָרְגוֹ
  choice: उसे ... मार डालने के लिए
  rationale: הרג का सीधा अर्थ मारना है और לְ उद्देश्य बताता है। ‘हत्या करना’ कानूनी निष्कर्ष को क्रिया में पहले से जोड़ देता, इसलिए अधिक मूलार्थपरक अभिव्यक्ति चुनी गई।
- source_word: בְעָרְמָה
  choice: छल से
  rationale: यह संज्ञा चतुराई, कपट या विश्वासघाती युक्ति द्वारा किए गए कार्य को बताती है। संक्षिप्त ‘छल से’ आधुनिक हिन्दी में इस नैतिक और विधिक भाव को स्पष्ट रखता है।
- source_word: מֵעִם מִזְבְּחִי
  choice: मेरी वेदी के पास से भी
  rationale: מֵעִם वेदी की निकटता से हटाए जाने का संकेत देता है। ‘भी’ प्रसंगगत बल को व्यक्त करता है कि वेदी के निकट शरण लेना जानबूझकर हत्या करने वाले को नहीं बचाता।
- source_word: תִּקָּחֶנּוּ לָמוּת
  choice: उसे ... ले जाकर मृत्युदण्ड देना
  rationale: शाब्दिक ‘उसे मरने के लिए ले जाना’ हिन्दी में अस्वाभाविक और अस्पष्ट होता। कानूनी संदर्भ में उद्देश्यवाचक לָמוּת दोषी को दण्डस्वरूप मृत्यु के लिए ले जाने का आदेश है, जिसे यह अभिव्यक्ति स्पष्ट करती है।
theological_decisions:
- issue: क्या वेदी जानबूझकर हत्या करने वाले को शरण देती है
  choice: जानबूझकर और छलपूर्वक हत्या की योजना बनाने वाले को वेदी के पास से भी हटाकर मृत्युदण्ड दिया जाए।
  alternative: वचन केवल अभियुक्त को वेदी के पास से न्यायिक प्रक्रिया के लिए हटाने की बात कहता है, शरणाधिकार पर विशेष बल नहीं देता।
  rationale: ‘मेरी वेदी के पास से’ इस कानूनी प्रसंग में पवित्र स्थान पर शरण लेने की पृष्ठभूमि का प्रबल संकेत देता है। मुख्य पाठ इस निहितार्थ को ‘भी’ से व्यक्त करता है, जबकि विस्तृत सांस्कृतिक व्याख्या पादटिप्पणी में रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कानूनी आदेश के अनुरूप रखी गई है। ‘जान-बूझकर ... योजना बनाए’ पूर्वनियोजन को और ‘छल से’ कपटपूर्ण रीति को अलग-अलग व्यक्त करते हैं। ‘मृत्युदण्ड देना’ शाब्दिक संरचना से थोड़ा अधिक अर्थपरक है, पर आधुनिक हिन्दी में आदेश का आशय सबसे स्पष्ट और स्वाभाविक रूप से देता है।
