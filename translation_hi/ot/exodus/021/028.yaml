  text: וְ/כִֽי יִגַּ֨ח שׁ֥וֹר אֶת אִ֛ישׁ א֥וֹ אֶת אִשָּׁ֖ה וָ/מֵ֑ת סָק֨וֹל יִסָּקֵ֜ל הַ/שּׁ֗וֹר וְ/לֹ֤א יֵאָכֵל֙ אֶת בְּשָׂר֔/וֹ וּ/בַ֥עַל הַ/שּׁ֖וֹר נָקִֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/028.yaml
  text: And if an ox gores a man or a woman and he dies[a], the ox shall surely be stoned, and its flesh shall not be eaten; but the owner of the ox is clear.
translation:
  language: hi
  text: यदि कोई बैल किसी पुरुष या स्त्री को सींग मारे और उसकी मृत्यु हो जाए, तो उस बैल को पत्थरों से मार डाला जाए और उसका मांस न खाया जाए; पर बैल का मालिक दोषमुक्त रहेगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “निर्दोष रहेगा” अथवा “उत्तरदायी न ठहरेगा।” इब्रानी शब्द נָקִי यहाँ कानूनी रूप से दोष या दण्ड से मुक्त होने की स्थिति बताता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: यदि
  rationale: यह पद एक शर्ताधारित कानूनी प्रकरण आरम्भ करता है। हिन्दी में ‘यदि’ स्वाभाविक है; आरम्भिक וְ को अलग से ‘और’ कहना आवश्यक नहीं।
- source_word: יִגַּח
  choice: सींग मारे
  rationale: क्रिया विशेष रूप से सींग से मारने या घायल करने को दर्शाती है; यह सामान्य ‘टक्कर मारे’ से अधिक सटीक है।
- source_word: שׁוֹר
  choice: बैल
  rationale: हिन्दी बाइबलीय और कानूनी शैली में यह बड़े पालतू गोवंश के लिए परिचित एकवचन शब्द है; ‘साँड़’ पशु के लिंग और प्रजनन-स्थिति को अनावश्यक रूप से अधिक निश्चित करता।
- source_word: אֶת־אִישׁ אוֹ אֶת־אִשָּׁה
  choice: किसी पुरुष या स्त्री को
  rationale: इब्रानी दोनों को स्पष्ट रूप से नामित करता है, इसलिए अनुवाद भी इस भेद को बनाए रखता है।
- source_word: וָמֵת
  choice: और उसकी मृत्यु हो जाए
  rationale: यह अभिव्यक्ति पुरुष और स्त्री दोनों सम्भावित पीड़ितों पर स्वाभाविक रूप से लागू होती है और मृत्यु-परिणाम को स्पष्ट रखती है।
- source_word: סָקוֹל יִסָּקֵל
  choice: पत्थरवाह करके अवश्य मार डाला जाए
  rationale: धातु के अनन्त रूप और सीमित क्रिया का संयोजन आदेश पर बल देता है। ‘अवश्य’ उस बल को और ‘मार डाला जाए’ दण्ड के घातक परिणाम को स्पष्ट करता है।
- source_word: וְלֹא יֵאָכֵל אֶת־בְּשָׂרוֹ
  choice: और उसका मांस न खाया जाए
  rationale: निषेध को सरल और स्वाभाविक हिन्दी कर्मवाच्य में रखा गया है। इस भोजन-सन्दर्भ में בָּשָׂר के लिए ‘मांस’ सामान्य समतुल्य है।
- source_word: וּבַעַל הַשּׁוֹר
  choice: पर बैल का मालिक
  rationale: בַּעַל यहाँ स्वामित्व की कानूनी भूमिका बताता है। पिछले दण्ड से विरोध दिखाने के लिए ‘पर’ स्वाभाविक है।
- source_word: נָקִי
  choice: दोषमुक्त रहेगा
  rationale: यह कानूनी प्रसंग में दण्ड या दायित्व से मुक्त होने की स्थिति बताता है, पर उसकी सटीक सीमा खुली छोड़ता है।
theological_decisions:
- issue: अन्तिम उपवाक्य में बैल के मालिक की कानूनी स्थिति
  choice: मालिक को इस मूल प्रकरण में दोषमुक्त बताया गया है।
  alternative: इसे नैतिक रूप से ‘निर्दोष’ या किसी विशेष दण्ड के लिए ‘उत्तरदायी नहीं’ समझा जा सकता है।
  rationale: अगले पदों में लापरवाही की स्थिति अलग की गई है। यहाँ नָקִי संक्षेप में मालिक की मुक्ति बताता है; अनुवाद यह अनावश्यक रूप से निश्चित नहीं करता कि मुक्ति केवल नैतिक, दीवानी या प्राणदण्ड-संबंधी है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण कानूनी हिन्दी में रखी गई है। ‘पत्थरवाह’ बाइबलीय दण्ड-विधि का परिचित शब्द है; साथ का ‘मार डाला जाए’ उसका अर्थ सामान्य पाठक के लिए स्पष्ट करता है।
