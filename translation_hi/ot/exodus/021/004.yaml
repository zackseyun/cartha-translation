source:
  edition: WLC
  text: אִם אֲדֹנָי/ו֙ יִתֶּן ל֣/וֹ אִשָּׁ֔ה וְ/יָלְדָה ל֥/וֹ בָנִ֖ים א֣וֹ בָנ֑וֹת הָ/אִשָּׁ֣ה וִ/ילָדֶ֗י/הָ תִּהְיֶה֙ לַֽ/אדֹנֶ֔י/הָ וְ/ה֖וּא יֵצֵ֥א בְ/גַפּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/004.yaml
  text: If his master gives him a wife and she bears him sons or daughters[a], the wife and her children shall belong to her master[b], and he shall go out by himself.
translation:
  language: hi
  text: यदि उसका स्वामी उसे पत्नी दे और वह उसके लिए बेटे या बेटियाँ जने, तो पत्नी और उसके बच्चे उसके स्वामी के होंगे[a], और वह अकेला ही बाहर जाएगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पत्नी और उसके बच्चे उसके स्वामी के पास रहेंगे।”
    reason: हिब्रू अभिव्यक्ति कानूनी अधिकार को बताती है; संदर्भ में इसका परिणाम स्वामी के घर में बने रहना भी है।
  - marker: b
    text: अर्थात वह उस पत्नी और उन बच्चों को छोड़कर निकलेगा जो उसकी सेवा की अवधि में हुए थे।
    reason: ‘अकेला ही बाहर जाएगा’ हिब्रू मुहावरे का सांस्कृतिक और कानूनी आशय स्पष्ट करता है, बिना यह कहे कि बच्चों को स्वामी ने दिया था।
lexical_decisions:
- source_word: אִם
  choice: यदि
  rationale: यह कानूनी प्रकरण में एक शर्त प्रस्तुत करता है; ‘यदि’ इस शर्तात्मक रूप को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: אֲדֹנָיו
  choice: उसका स्वामी
  rationale: दासता और गृह-अधिकार के इस कानूनी संदर्भ में ‘स्वामी’ अधिकार-संबंध को स्पष्ट करता है; ‘प्रभु’ से उत्पन्न धार्मिक अर्थ-संकेत से बचता है।
- source_word: יִתֶּן לוֹ אִשָּׁה
  choice: उसे पत्नी दे
  rationale: אִשָּׁה का अर्थ ‘स्त्री’ या ‘पत्नी’ हो सकता है; संतान-जन्म और कानूनी संबंध के संदर्भ में ‘पत्नी’ उपयुक्त है।
- source_word: וְיָלְדָה לוֹ
  choice: वह उसके लिए ... जने
  rationale: हिब्रू में अप्रत्यक्ष कर्म ‘उसके लिए’ उपस्थित है; इसे रखते हुए हिंदी वाक्य को संक्षिप्त और स्वाभाविक बनाया गया है।
- source_word: בָנִים אוֹ בָנוֹת
  choice: बेटे या बेटियाँ
  rationale: हिब्रू दोनों लिंगों को स्पष्ट रूप से गिनाता है; सामान्य ‘बच्चे’ कहकर इस विशिष्टता को मिटाया नहीं गया।
- source_word: הָאִשָּׁה וִילָדֶיהָ
  choice: पत्नी और उसके बच्चे
  rationale: पहले आए אִשָּׁה के लिए ‘पत्नी’ के साथ संगति रखता है और יְלָדִים को स्वाभाविक हिंदी में ‘बच्चे’ कहता है।
- source_word: תִּהְיֶה לַאדֹנֶיהָ
  choice: उसके स्वामी के होंगे
  rationale: ‘होना + ל’ यहाँ कानूनी अधिकार या संबद्धता व्यक्त करता है। यह रूप मूल की संक्षिप्तता और कठोर कानूनी वास्तविकता को बनाए रखता है, पर अर्थ की सीमा को अनावश्यक रूप से नहीं बढ़ाता।
- source_word: וְהוּא יֵצֵא
  choice: और वह ... बाहर जाएगा
  rationale: יצא का मूल अर्थ ‘बाहर जाना’ है। संदर्भ में यह सेवा से निकलने को सूचित करता है, किंतु मुख्य पाठ में शाब्दिक क्रिया रखी गई है।
- source_word: בְגַפּוֹ
  choice: अकेला ही
  rationale: यह मुहावरा बिना पत्नी और बच्चों के, अपने आप निकलने का अर्थ देता है; ‘अकेला ही’ आधुनिक हिंदी में स्पष्ट है।
theological_decisions:
- issue: दासता के कानूनी संबंध की भाषा
  choice: ‘स्वामी’ और ‘स्वामी के होंगे’ द्वारा अधिकार-संबंध को स्पष्ट रखना
  alternative: ‘मालिक’ कहना या संबंध को नरम करके ‘स्वामी के पास रहेंगे’ कहना
  rationale: पाठ दासता से जुड़ी कानूनी व्यवस्था का वर्णन करता है। अनुवाद न तो उस वास्तविकता को नरम करता है और न उससे आगे बढ़कर आधुनिक नैतिक टिप्पणी मुख्य पाठ में जोड़ता है।
- issue: תִּהְיֶה לַאדֹנֶיהָ में स्वामित्व बनाम साथ बने रहने का भाव
  choice: मुख्य पाठ में ‘उसके स्वामी के होंगे’
  alternative: ‘उसके स्वामी के पास रहेंगे’
  rationale: ל के साथ ‘होना’ कानूनी अधिकार को व्यक्त कर सकता है, जबकि प्रसंग में साथ बने रहने का व्यावहारिक परिणाम भी निहित है। मुख्य पाठ कानूनी स्वर रखता है और पादटिप्पणी वैकल्पिक अभिव्यक्ति बताती है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण कानूनी शैली रखी गई है। ‘जने’ मूल की प्रसव-संबंधी क्रिया को संक्षिप्त रूप से व्यक्त करता है; ‘अकेला ही बाहर जाएगा’ मूल मुहावरे को बनाए रखते हुए सामान्य पाठक के लिए पादटिप्पणी में उसका आशय स्पष्ट करता है।
