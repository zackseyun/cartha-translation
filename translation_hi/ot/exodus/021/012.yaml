translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज विधिक हिन्दी। वाक्य ने मूल के प्रकरण-विधान, परिणाम और निश्चित मृत्युदंड—तीनों को बनाए रखा है।
