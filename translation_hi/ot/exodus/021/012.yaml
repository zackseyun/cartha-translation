  text: Whoever strikes a man so that he dies shall surely be put to death[a].
translation:
  language: hi
  text: जो किसी पुरुष को ऐसा मारे कि वह मर जाए, उसे निश्चय ही मृत्युदंड दिया जाए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “जो किसी पुरुष को मारे और वह मर जाए, उसे निश्चय ही मृत्युदंड दिया जाए।”'
    reason: शाब्दिक विकल्प
lexical_decisions:
- source_word: מַכֵּה
  choice: मारे
  rationale: נכה का कृदन्त रूप विधिक प्रसंग में ‘जो मारता है’ का मामला प्रस्तुत करता है। ‘मारे’ स्वाभाविक हिन्दी है और क्रिया में ही मृत्यु का परिणाम जोड़कर अर्थ को आवश्यकता से अधिक विशिष्ट नहीं बनाता।
- source_word: אִישׁ
  choice: किसी पुरुष को
  rationale: אִישׁ का सामान्य अर्थ ‘पुरुष’ है। यहाँ यह प्रहार के शिकार पुरुष को सूचित करता है; इसलिए मूल का लिंग-सूचक अर्थ बनाए रखा गया है।
- source_word: וָמֵת
  choice: कि वह मर जाए
  rationale: וְ के साथ מות का यह रूप प्रहार के परिणाम को व्यक्त करता है। ‘ऐसा...कि वह मर जाए’ आधुनिक हिन्दी में परिणाम-संबंध को स्पष्ट और स्वाभाविक ढंग से रखता है।
- source_word: מוֹת יוּמָת
  choice: उसे निश्चय ही मृत्युदंड दिया जाए
  rationale: इन्फिनिटिव एब्सोल्यूट और निष्क्रिय क्रियारूप दंड की निश्चितता और औपचारिक विधिक स्वर को प्रबल करते हैं। ‘निश्चय ही’ बलाघात को और ‘मृत्युदंड दिया जाए’ निष्क्रिय कानूनी विधान को बनाए रखता है।
