language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: א֣וֹ נוֹדַ֗ע כִּ֠י שׁ֣וֹר נַגָּ֥ח הוּא֙ מִ/תְּמ֣וֹל שִׁלְשֹׁ֔ם וְ/לֹ֥א יִשְׁמְרֶ֖/נּוּ בְּעָלָ֑י/ו שַׁלֵּ֨ם יְשַׁלֵּ֥ם שׁוֹר֙ תַּ֣חַת הַ/שּׁ֔וֹר וְ/הַ/מֵּ֖ת יִֽהְיֶה לּֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/036.yaml
  text: Or if it was known that the ox was accustomed to gore from yesterday and the day before[a], and its owner did not keep it in, he must surely pay ox for ox[c][b], and the dead animal will be his.
translation:
  language: hi
  text: या, यदि यह ज्ञात था कि वह बैल पहले से सींग मारने का आदी था[a], और उसके मालिक ने उसे रोककर नहीं रखा, तो वह बैल के बदले बैल अवश्य दे; और मरा हुआ पशु उसका हो जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “कल और परसों से”; यह एक हिब्रू मुहावरा है, जिसका अर्थ है कि बैल पहले भी ऐसा व्यवहार करता रहा था।
    reason: cultural_note
lexical_decisions:
- source_word: א֣וֹ
  choice: या यदि
  rationale: यह पिछले नियम के बाद वैकल्पिक परिस्थिति प्रस्तुत करता है; हिन्दी में ‘या यदि’ कानूनी शर्त को स्पष्ट और स्वाभाविक बनाता है।
- source_word: נוֹדַע כִּי
  choice: यह मालूम था कि
  rationale: निफ़अल रूप के निष्क्रिय/अव्यक्तिगत कानूनी भाव को सुरक्षित रखते हुए ज्ञात तथ्य का परिचय देता है।
- source_word: שׁוֹר
  choice: बैल
  rationale: इस कानूनी प्रसंग में שׁוֹר का सामान्य और स्पष्ट हिन्दी समतुल्य है।
- source_word: נַגָּח
  choice: सींग मारने का आदी
  rationale: यह विशेषण बार-बार सींग मारने की पहचानी हुई प्रवृत्ति बताता है, केवल किसी एक घटना को नहीं।
- source_word: מִתְּמוֹל שִׁלְשֹׁם
  choice: पहले से
  rationale: हिब्रू मुहावरे ‘कल और परसों से’ का आशय पूर्व से प्रमाणित व्यवहार है; मुख्य पाठ में स्वाभाविक आधुनिक हिन्दी चुनी गई और शाब्दिक रूप पादटिप्पणी में रखा गया है।
- source_word: וְלֹא יִשְׁמְרֶנּוּ
  choice: उसे काबू में नहीं रखा
  rationale: प्रसंग में שמר का अर्थ खतरनाक बैल को इस प्रकार रोककर रखना है कि वह हानि न पहुँचाए; ‘काबू में रखना’ हिन्दी में यह दायित्व स्पष्ट करता है।
- source_word: בְּעָלָיו
  choice: उसके मालिक
  rationale: कानूनी स्वामी को सरल और समकालीन हिन्दी में व्यक्त करता है।
- source_word: שַׁלֵּם יְשַׁלֵּם
  choice: अवश्य दे
  rationale: क्रियार्थक संज्ञा और अपूर्ण क्रिया की पुनरुक्ति से आए अनिवार्य एवं प्रबल दायित्व को संक्षेप में सुरक्षित करता है।
- source_word: שׁוֹר תַּחַת הַשּׁוֹר
  choice: बैल के बदले बैल
  rationale: תַּחַת के प्रतिस्थापन/क्षतिपूर्ति भाव और मूल कानूनी सूत्र दोनों को सीधे बनाए रखता है।
- source_word: וְהַמֵּת יִהְיֶה לּוֹ
  choice: और मरा हुआ पशु उसका हो जाएगा
  rationale: मूल का संक्षिप्त ‘मरा हुआ’ सन्दर्भतः मृत बैल है; ‘पशु’ जोड़ने से हिन्दी स्पष्ट होती है, जबकि उसका स्वामित्व किसे मिलता है इस विषय में मूल का सर्वनामात्मक तनाव बना रहता है।
theological_decisions:
- issue: ‘उसका’ किस व्यक्ति को सूचित करता है
  choice: मरा हुआ पशु उसका हो जाएगा
  alternative: मरे हुए पशु का शव दोषी बैल के मालिक का होगा
  rationale: हिब्रू में לּוֹ केवल ‘उसका/उसके लिए’ कहता है और निकटवर्ती पुरुषवाचक संदर्भों के कारण व्याख्यात्मक प्रश्न उठ सकता है। मुख्य पाठ किसी विशिष्ट पक्ष को नाम देकर अस्पष्टता को चुपचाप समाप्त नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज कानूनी शैली अपनाई गई है। ‘अवश्य दे’ दायित्व की तीव्रता व्यक्त करता है; अत्यधिक संस्कृतनिष्ठ ‘प्रतिपूर्ति’ से बचकर सामान्य पाठक के लिए स्पष्टता रखी गई है।
