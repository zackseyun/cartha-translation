  yaml_path: translation/ot/exodus/021/016.yaml
  text: Whoever kidnaps a man and sells him[a], or he is found in his hand[b], shall surely be put to death.
translation:
  language: hi
  text: जो किसी पुरुष का अपहरण करके उसे बेच दे, या जिसके कब्ज़े में वह पाया जाए, उसे निश्चय ही मृत्युदंड दिया जाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גֹנֵב
  choice: अपहरण करके
  rationale: क्रिया का मूल अर्थ ‘चुराना’ है, पर אִישׁ को कर्म बनाने और आगे बेचने अथवा कब्ज़े में पाए जाने के संदर्भ में यह मनुष्य को चुराने, अर्थात अपहरण करने, को दर्शाती है।
- source_word: אִישׁ
  choice: किसी पुरुष
  rationale: इब्रानी शब्द एकवचन पुल्लिंग है। ‘किसी पुरुष’ स्रोत की लैंगिक और वचन-संबंधी विशिष्टता को बनाए रखते हुए हिन्दी विधिक वाक्य में स्वाभाविक है।
- source_word: וּמְכָרוֹ
  choice: उसे बेच दे
  rationale: क्रिया के साथ लगा तृतीय पुरुष एकवचन पुल्लिंग प्रत्यय अपहृत पुरुष को कर्म के रूप में निर्दिष्ट करता है।
- source_word: וְנִמְצָא בְיָדוֹ
  choice: या वह उसके कब्ज़े में पाया जाए
  rationale: נמצא का अर्थ ‘पाया जाए’ है और ‘उसके हाथ में’ अधिकार अथवा नियंत्रण का मुहावरा है। हिन्दी में ‘कब्ज़े में’ इस विधिक आशय को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: מֹות יוּמָת
  choice: उसे निश्चय ही मृत्युदंड दिया जाए
  rationale: क्रिया के साथ प्रयुक्त धातु का अनंत रूप दंड की निश्चितता पर बल देता है। यह हिन्दी रूप औपचारिक न्यायिक दंड और उसके बलाघात दोनों को व्यक्त करता है।
theological_decisions:
- issue: अपराध की विधिक परिधि
  choice: यह निषेध किसी पुरुष के अपहरण पर लागू है, चाहे अपहरणकर्ता ने उसे बेच दिया हो या वह अब भी उसके कब्ज़े में पाया जाए।
  alternative: 'दूसरे खंड को विकल्प के बजाय जुड़ी हुई परिस्थिति माना जा सकता है: ‘और वह उसके हाथ में पाया जाए।’'
  rationale: वाक्य-विन्यास मनुष्य को चुराने के साथ बेचने अथवा निरंतर कब्ज़े को जोड़ता है। ‘या’ प्रकरण-विधि के वैकल्पिक हालात को स्पष्ट करता है, जबकि पादटिप्पणी संयोजक के अधिक शाब्दिक पाठ को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्पष्ट, गरिमापूर्ण और विधिक रजिस्टर अपनाया गया है। ‘कब्ज़े में’ शाब्दिक इब्रानी मुहावरे को स्वाभाविक हिन्दी में व्यक्त करता है; शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
