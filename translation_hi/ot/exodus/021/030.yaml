base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/030.yaml
  text: If a ransom is imposed on him[a], then he shall give the redemption price for his life according to all that is imposed on him.
translation:
  language: hi
  text: यदि उस पर छुड़ौती की रकम ठहराई जाए,[a] तो वह अपने जीवन के छुटकारे का मूल्य उतना ही दे, जितना उस पर ठहराया जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, “यदि उस पर छुड़ौती ठहराई जाए ...।” इब्रानी में यहाँ दो संबंधित लेकिन अलग शब्द हैं: כֹּפֶר (‘छुड़ौती’) और פִּדְיֹן (‘छुटकारे का मूल्य’)।'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: यदि
  rationale: यह पिछले नियम के बाद एक शर्तयुक्त कानूनी स्थिति प्रस्तुत करता है; आधुनिक मानक हिन्दी में ‘यदि’ स्पष्ट और गरिमापूर्ण है।
- source_word: כֹּפֶר
  choice: छुड़ौती की रकम
  rationale: यह ऐसी अदायगी है जो दण्ड को टालकर मुक्ति दिलाती है। ‘छुड़ौती की रकम’ कानूनी-आर्थिक अर्थ स्पष्ट करती है और इसे उपासना-संबंधी प्रायश्चित नहीं बनाती।
- source_word: יוּשַׁת עָלָיו
  choice: उस पर ... ठहराई जाए
  rationale: शीत का निष्क्रिय रूप और עַל किसी व्यक्ति पर कानूनी दायित्व निर्धारित किए जाने को व्यक्त करते हैं; ‘ठहराई जाए’ हिन्दी कानूनी संदर्भ में स्वाभाविक है।
- source_word: וְנָתַן
  choice: तो वह ... दे
  rationale: यह शर्त के परिणामस्वरूप लागू कानूनी आदेश को व्यक्त करता है।
- source_word: פִּדְיֹן נַפְשׁוֹ
  choice: अपने प्राण के छुटकारे का मूल्य
  rationale: ‘छुटकारे का मूल्य’ पहले प्रयुक्त כֹּפֶר से शब्दगत भेद बनाए रखता है; ‘प्राण’ यहाँ व्यक्ति के जीवन को दर्शाता है।
- source_word: כְּכֹל אֲשֶׁר יוּשַׁת עָלָיו
  choice: उतना ही ... जितना उस पर ठहराया जाए
  rationale: यह निर्धारित पूरी रकम के अनुरूप भुगतान का भाव स्वाभाविक हिन्दी में व्यक्त करता है और כֹּל की समग्रता बनाए रखता है।
theological_decisions:
- issue: मृत्युदण्ड की देनदारी के संदर्भ में भुगतान का स्वरूप
  choice: भुगतान को ‘छुड़ौती की रकम’ और ‘छुटकारे का मूल्य’ कहा गया है, बिना नैतिक निर्दोषता या उपासना-संबंधी प्रायश्चित का अर्थ जोड़े।
  alternative: दोनों इब्रानी शब्दों को केवल ‘जुर्माना’ कहना, अथवा अधिक प्रबल प्रायश्चित-संबंधी भाषा अपनाना।
  rationale: यह न्यायिक रूप से निर्धारित वह भुगतान है जो व्यक्ति के प्राण को अन्यथा लागू दण्ड से छुड़ाता है। अनुवाद इब्रानी के दो संबंधित किंतु भिन्न कानूनी-मुक्ति संबंधी पदों को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्पष्ट, गरिमापूर्ण कानूनी स्वर रखा गया है। ‘प्राण’ इस संदर्भ में व्यक्ति के जीवन का बोध कराता है, किसी पृथक अमूर्त आत्मा का नहीं।
