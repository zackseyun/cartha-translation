  yaml_path: translation/ot/exodus/021/018.yaml
  text: If men quarrel and one strikes his neighbor with a stone or with his fist[a], and he does not die but is confined to bed,
translation:
  language: hi
  text: यदि पुरुष आपस में झगड़ें और उनमें से एक अपने साथी को पत्थर या मुक्के से मारे, और वह न मरे, पर बिस्तर पर पड़ जाए[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “बिस्तर पर गिर पड़े”—अर्थात चोट के कारण बिस्तर पर पड़ा रहे।
    reason: मूल इब्रानी मुहावरे का शाब्दिक रूप और उसका आशय स्पष्ट करना।
lexical_decisions:
- source_word: וְכִי
  choice: यदि
  rationale: यह व्यवस्था में एक संभावित मामले का परिचय देता है; आधुनिक हिन्दी की शर्तवाचक कानूनी शैली में ‘यदि’ स्वाभाविक है।
- source_word: יְרִיבֻן
  choice: आपस में झगड़ें
  rationale: ריב विवाद या झगड़े को व्यक्त करता है; यहाँ प्रसंग में विवाद के हिंसा तक बढ़ने का भाव है, पर पूर्ण युद्ध का नहीं।
- source_word: אֲנָשִׁים
  choice: पुरुष
  rationale: इब्रानी शब्द व्याकरणतः पुल्लिंग बहुवचन है और इस कानूनी मामले के पुरुष पक्षों को सूचित करता है।
- source_word: וְהִכָּה אִישׁ אֶת רֵעֵהוּ
  choice: उनमें से एक अपने साथी को मारे
  rationale: ‘उनमें से एक’ झगड़नेवालों में से एक व्यक्ति को अलग करता है; רֵעַ के लिए ‘साथी’ इस पारस्परिक कानूनी प्रसंग में स्वाभाविक है।
- source_word: בְּאֶבֶן
  choice: पत्थर से
  rationale: यहाँ בְּ साधन को सूचित करता है और אֶבֶן का सीधा अर्थ ‘पत्थर’ है।
- source_word: אוֹ בְאֶגְרֹף
  choice: या मुक्के से
  rationale: אֶגְרֹף का सामान्य अर्थ ‘मुट्ठी/मुक्का’ है; प्रहार के प्रसंग में हिन्दी में ‘मुक्के से’ अधिक स्वाभाविक है।
- source_word: וְלֹא יָמוּת
  choice: और वह न मरे
  rationale: यह चोट खाए व्यक्ति के जीवित रहने का परिणाम बताता है और इब्रानी के साधारण संयोजन को बनाए रखता है।
- source_word: וְנָפַל לְמִשְׁכָּב
  choice: पर बिस्तर पर पड़ जाए
  rationale: शाब्दिक चित्र ‘बिस्तर पर गिरना/पड़ना’ है, जिसका आशय चोट के कारण बिस्तर पकड़ लेना है; हिन्दी मुहावरा मूल चित्र और आशय दोनों को सहज रूप में रखता है।
