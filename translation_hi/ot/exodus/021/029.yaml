source:
  edition: WLC
  text: וְ/אִ֡ם שׁוֹר֩ נַגָּ֨ח ה֜וּא מִ/תְּמֹ֣ל שִׁלְשֹׁ֗ם וְ/הוּעַ֤ד בִּ/בְעָלָי/ו֙ וְ/לֹ֣א יִשְׁמְרֶ֔/נּוּ וְ/הֵמִ֥ית אִ֖ישׁ א֣וֹ אִשָּׁ֑ה הַ/שּׁוֹר֙ יִסָּקֵ֔ל וְ/גַם בְּעָלָ֖י/ו יוּמָֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/029.yaml
  text: But if the ox was accustomed to gore from yesterday and the day before[a], and its owner had been warned but did not keep it in, and it kills a man or a woman, the ox shall be stoned[b], and its owner also shall be put to death.
translation:
  language: hi
  text: परन्तु यदि बैल पहले से सींग मारने का आदी था[a], और उसके मालिक को चेतावनी दी गई थी, फिर भी उसने उसे काबू में नहीं रखा, और वह किसी पुरुष या स्त्री को मार डाले, तो उस बैल को पत्थरों से मार डाला जाए और उसके मालिक को भी मृत्युदण्ड दिया जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “कल और परसों से”; यह हिब्रू मुहावरा पहले से स्थापित व्यवहार को दर्शाता है।
    reason: cultural_note
lexical_decisions:
- source_word: שׁוֹר
  choice: बैल
  rationale: इस कानूनी प्रसंग में यह पालतू गोवंश के एक पशु के लिए प्रचलित और स्वाभाविक हिन्दी शब्द है।
- source_word: נַגָּח
  choice: सींग मारने का आदी
  rationale: कृदन्त पशु के बार-बार सींग मारने से स्थापित स्वभाव को दर्शाता है, न कि केवल एक घटना को।
- source_word: מִתְּמֹל שִׁלְשֹׁם
  choice: पहले से
  rationale: शाब्दिक अभिव्यक्ति ‘कल और परसों से’ पूर्व में स्थापित व्यवहार का हिब्रू मुहावरा है; मुख्य पाठ में ‘पहले से’ उसका स्वाभाविक हिन्दी अर्थ देता है, जबकि पादटिप्पणी मूल चित्र को सुरक्षित रखती है।
- source_word: וְהוּעַד בִּבְעָלָיו
  choice: उसके मालिक को चेतावनी दी गई थी
  rationale: कानूनी संदर्भ में यह पशु के खतरनाक व्यवहार के विषय में मालिक को औपचारिक रूप से सावधान किए जाने को व्यक्त करता है।
- source_word: וְלֹא יִשְׁמְרֶנּוּ
  choice: उसने उसे काबू में नहीं रखा
  rationale: यहाँ क्रिया का व्यावहारिक आशय खतरनाक पशु की निगरानी करने, उसे रोकने या नियंत्रित रखने में विफल होना है।
- source_word: וְהֵמִית
  choice: मार डाले
  rationale: यह बैल के कारण हुई मृत्यु को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אִישׁ אֹו אִשָּׁה
  choice: किसी पुरुष या स्त्री को
  rationale: मूल पाठ दोनों लिंगों का स्पष्ट उल्लेख करता है; अनुवाद उस विशिष्टता को बनाए रखता है।
- source_word: יִסָּקֵל
  choice: पत्थरवाह किया जाए
  rationale: निफ़ाल रूप पत्थर मारकर दिए जाने वाले निर्धारित दण्ड को व्यक्त करता है; ‘पत्थरवाह’ हिन्दी बाइबलीय-कानूनी भाषा में संक्षिप्त और परिचित है।
- source_word: וְגַם בְּעָלָיו יוּמָת
  choice: उसके मालिक को भी मृत्युदण्ड दिया जाए
  rationale: होफ़ाल रूप न्यायिक रूप से प्राणदण्ड दिए जाने का कानूनी सूत्र है, केवल सामान्य मृत्यु का कथन नहीं।
theological_decisions:
- issue: मालिक के दण्ड का कानूनी बल
  choice: उसके मालिक को भी मृत्युदण्ड दिया जाए
  alternative: उसका मालिक भी मर जाए
  rationale: יוּמָת न्यायिक रूप से आरोपित प्राणदण्ड बताता है; केवल ‘मर जाए’ कहना उसके कानूनी बल को कम कर देगा।
- issue: पीड़ित के लिंग का स्पष्ट उल्लेख
  choice: किसी पुरुष या स्त्री को
  alternative: किसी व्यक्ति को
  rationale: मूल पाठ पुरुष और स्त्री दोनों को स्पष्ट रूप से नामित करता है, इसलिए उस भेद को सुरक्षित रखा गया है।
- issue: पूर्व स्थापित हिंसक व्यवहार
  choice: पहले से सींग मारने का आदी था
  alternative: कल और परसों से सींग मारनेवाला था
  rationale: मुख्य पाठ में मुहावरे का आशय स्पष्ट किया गया है, पर उसकी शाब्दिक बनावट और कानूनी संकेत पादटिप्पणी में सुरक्षित हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण कानूनी शैली रखी गई है। ‘सींग मारने का आदी’ बार-बार के ज्ञात व्यवहार को स्पष्ट करता है; ‘काबू में नहीं रखा’ उपेक्षित नियंत्रण का व्यावहारिक अर्थ देता है।
