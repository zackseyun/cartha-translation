  text: जलने की चोट के बदले जलने की चोट, घाव के बदले घाव, चोट के निशान के बदले चोट का निशान।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּוִיָּה
  choice: जलना
  rationale: यह संज्ञा जलने की चोट या उसके निशान को दर्शाती है। ‘जलना’ संक्षिप्त, स्वाभाविक और प्रतिपूरक कानूनी सूत्र के अनुकूल है।
- source_word: תַּחַת
  choice: के बदले
  rationale: इस कानूनी प्रसंग में यह समान प्रतिदान या प्रतिपूर्ति व्यक्त करता है; ‘के बदले’ आधुनिक हिन्दी में अर्थ और सूत्रात्मक लय दोनों सुरक्षित रखता है।
- source_word: פֶּצַע
  choice: घाव
  rationale: यह किसी ठोस शारीरिक घाव का व्यापक शब्द है; ‘घाव’ स्पष्ट है और इसे केवल कटने की चोट तक सीमित नहीं करता।
- source_word: חַבּוּרָה
  choice: चोट का निशान
  rationale: यह प्रहार से बने दाग, सूजन, नील या उभरे निशान को सूचित कर सकता है। ‘चोट का निशान’ मूल की प्रहार-जनित दृश्य छाप को ‘नील’ से अधिक व्यापक रूप में सुरक्षित रखता है।
