- source_word: לֹא אֵצֵא
  choice: मैं ... नहीं जाऊँगा
  rationale: हिब्रू ‘बाहर निकलना’ मुक्ति के लिए प्रयुक्त है; ‘स्वतंत्र होकर नहीं जाऊँगा’ हिन्दी में अर्थ को स्पष्ट रखते हुए गमन-रूपक को बनाए रखता है।
- source_word: חָפְשִׁי
  choice: स्वतंत्र होकर
  rationale: यह निकलने के समय दास की स्वतंत्र अवस्था बताता है; हिन्दी में क्रियाविशेषणीय रूप अधिक स्वाभाविक है।
