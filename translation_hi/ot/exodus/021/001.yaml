lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: और ये
  rationale: וְ इस खंड को पिछले प्रसंग से जोड़ता है; ‘और ये’ उस संबंध को बिना कोई कालसूचक अर्थ जोड़े स्वाभाविक रूप से बनाए रखता है।
- source_word: הַ/מִּשְׁפָּטִים
  choice: वे न्याय-विधान
  rationale: מִשְׁפָּטִים न्यायिक निर्णयों तथा उनसे निकले विधानों या प्रकरण-विधियों का बोध करा सकता है। ‘न्याय-विधान’ कानूनी-न्यायिक अर्थ को सुरक्षित रखते हुए आधुनिक हिन्दी में समझने योग्य है।
- source_word: אֲשֶׁר
  choice: जिन्हें
  rationale: संबंधवाचक उपवाक्य को हिन्दी में स्वाभाविक रूप से मुख्य संज्ञा से जोड़ता है।
- source_word: תָּשִׂים
  choice: तुम ... रखना
  rationale: שׂוּם का मूल अर्थ ‘रखना/स्थापित करना’ है। यहाँ निर्देशात्मक भाव है, जिसे हिन्दी का अनंत क्रियारूप प्रसंगानुसार स्पष्ट रूप से व्यक्त करता है।
- source_word: לִ/פְנֵי/הֶם
  choice: उनके सामने
  rationale: לִפְנֵי का अर्थ ‘के सामने/की उपस्थिति में’ है; यहाँ नियम लोगों के समक्ष प्रस्तुत करने का भाव है।
theological_decisions:
- issue: वाचा-संबंधी कानूनी प्रसंग में מִשְׁפָּטִים का अनुवाद
  choice: न्याय-विधान
  alternative: न्याय-निर्णय; विधि-विधान; नियम
  rationale: ‘न्याय-विधान’ न्यायिक और विधिक दोनों पहलुओं को बनाए रखता है तथा शब्द को केवल सामान्य ‘नियम’ बनाकर उसका अर्थ संकुचित नहीं करता। यह चुनाव किसी विशिष्ट सांप्रदायिक व्याख्या पर निर्भर नहीं है।
