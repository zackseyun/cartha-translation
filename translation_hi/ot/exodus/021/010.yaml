base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/010.yaml
  text: If he takes another wife for himself[a], he shall not diminish her food, her clothing, or her marital rights.
translation:
  language: hi
  text: यदि वह अपने लिए दूसरी पत्नी ले, तो वह उसके भोजन, वस्त्र और दांपत्य अधिकारों में कोई कमी न करे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם
  choice: यदि
  rationale: यह विधिक प्रसंग में शर्त प्रस्तुत करने वाला सामान्य अव्यय है; ‘यदि’ उस शर्तात्मक रूप को बनाए रखता है।
- source_word: אַחֶרֶת
  choice: दूसरी पत्नी
  rationale: शब्द का मूल अर्थ ‘दूसरी’ है, पर विवाह-संबंधी इस विधिक प्रसंग में आशय दूसरी स्त्री को पत्नी के रूप में लेने से है; ‘पत्नी’ जोड़ने से अर्थ स्वाभाविक और स्पष्ट होता है।
- source_word: יִקַּח לוֹ
  choice: अपने लिए ... ले
  rationale: לקח स्त्री के साथ विवाह के अर्थ में प्रयुक्त हो सकता है, जबकि ‘अपने लिए’ לוֹ को स्पष्ट रूप से दर्शाता है।
- source_word: שְׁאֵרָהּ
  choice: उसके भोजन
  rationale: यद्यपि שְׁאֵר का संबंध शाब्दिक रूप से मांस से हो सकता है, इस त्रयी में यह पत्नी के भरण-पोषण, विशेषतः भोजन, की बाध्यता को सूचित करता है।
- source_word: כְּסוּתָהּ
  choice: वस्त्र
  rationale: संज्ञा का अर्थ ओढ़ना/ढकना या पहनावा है; यहाँ ‘वस्त्र’ संक्षिप्त, स्वाभाविक और विधिक संदर्भ के अनुकूल है।
- source_word: וְעֹנָתָהּ
  choice: वैवाहिक अधिकार
  rationale: दुर्लभ शब्द पति द्वारा वैवाहिक अंतरंगता की बाध्यता की ओर संकेत करता है। ‘वैवाहिक अधिकार’ गरिमापूर्ण और समझने योग्य है, जबकि विशिष्ट अर्थ पाद-टिप्पणी में स्पष्ट किया गया है।
- source_word: לֹא יִגְרָע
  choice: कोई कमी न करे
  rationale: क्रिया का अर्थ घटाना या कम करना है; यह हिंदी अभिव्यक्ति सूचीबद्ध तीनों दायित्वों पर स्वाभाविक रूप से लागू होती है।
theological_decisions:
- issue: क्या यह विधान बहुविवाह को स्वीकृति या आदेश के रूप में प्रस्तुत करता है?
  choice: पद को एक शर्तात्मक विधिक स्थिति के रूप में अनूदित किया गया है।
  alternative: इसे बहुविवाह की धार्मिक स्वीकृति के रूप में अधिक स्पष्ट करना।
  rationale: אִם केवल संभावित परिस्थिति प्रस्तुत करता है और उस परिस्थिति में पहली स्त्री के अधिकारों की रक्षा करता है; अनुवाद को इससे आगे कोई धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ना चाहिए।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण विधिक शैली अपनाई गई है। ‘दूसरी पत्नी’ प्रसंगगत पूर्ति है; ‘वैवाहिक अधिकार’ मूल शब्द की गरिमा और अर्थगत व्यापकता बनाए रखता है, तथा पाद-टिप्पणी उसके अंतरंग वैवाहिक आशय को स्पष्ट करती है।
