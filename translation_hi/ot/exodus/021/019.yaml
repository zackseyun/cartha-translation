language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אִם יָק֞וּם וְ/הִתְהַלֵּ֥ךְ בַּ/ח֛וּץ עַל מִשְׁעַנְתּ֖/וֹ וְ/נִקָּ֣ה הַ/מַּכֶּ֑ה רַ֥ק שִׁבְתּ֛/וֹ יִתֵּ֖ן וְ/רַפֹּ֥א יְרַפֵּֽא־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/019.yaml
  text: If he gets up and walks about outside on his staff[a], then the one who struck him shall be cleared[c][b]; he must only pay for his lost time and have him thoroughly healed.
translation:
  language: hi
  text: यदि वह उठकर अपनी लाठी के सहारे[a] बाहर चलने-फिरने लगे, तो उसे मारनेवाला दण्ड से मुक्त होगा; फिर भी उसे उसके काम न कर पाने के समय की भरपाई[b] करनी होगी और उसका पूरा इलाज करवाना होगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपनी लाठी पर”; अर्थात लाठी का सहारा लेकर चलना, जो कुछ हद तक स्वस्थ होने का प्रमाण है।
    reason: lexical_alternative
  - marker: b
    text: इसका आशय चोट के कारण काम न कर पाने की अवधि और उससे हुई हानि की भरपाई से है।
    reason: cultural_note
  - marker: c
    text: इब्रानी में बल देने वाली अभिव्यक्ति शाब्दिक रूप से “चंगा करना, वह चंगा करेगा” है; यहाँ आशय घायल व्यक्ति के पूरे उपचार की जिम्मेदारी उठाने से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יָקוּם
  choice: यदि वह उठकर
  rationale: शर्तसूचक אִם और קום के सामान्य अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है; प्रसंग में घायल व्यक्ति का बिस्तर से उठ सकना सुधार का संकेत है।
- source_word: וְהִתְהַלֵּךְ בַּחוּץ
  choice: बाहर चलने-फिरने लगे
  rationale: हित्पअेल रूप केवल एक कदम चलने के बजाय इधर-उधर चल सकने या गतिशील होने का भाव देता है।
- source_word: עַל מִשְׁעַנְתּוֹ
  choice: अपनी लाठी के सहारे
  rationale: शाब्दिक रूप से ‘अपनी लाठी पर’; हिन्दी में ‘के सहारे’ समर्थित होकर चलने का आशय स्पष्ट और स्वाभाविक ढंग से देता है।
- source_word: וְנִקָּה הַמַּכֶּה
  choice: उसे मारनेवाला दण्ड से मुक्त होगा
  rationale: निफ़अल נקה कानूनी प्रसंग में दण्ड या गंभीर दायित्व से मुक्त होने का भाव रखता है। ‘दोषमुक्त’ कहने से आगे दी गई क्षतिपूर्ति की जिम्मेदारी के साथ अनावश्यक टकराव हो सकता था।
- source_word: רַק שִׁבְתּוֹ יִתֵּן
  choice: फिर भी उसे उसके काम न कर पाने के समय की भरपाई करनी होगी
  rationale: שִׁבְתּוֹ का मूल संबंध बैठने या निष्क्रिय रहने से है, पर चोट संबंधी इस नियम में इसका व्यावहारिक अर्थ अक्षमता के कारण खोया समय या काम है। רַק शेष दायित्व को सीमित करता है; हिन्दी में ‘फिर भी’ पिछले दण्ड-मुक्ति कथन के बाद इसका संबंध साफ करता है।
- source_word: וְרַפֹּא יְרַפֵּא
  choice: और उसका पूरा इलाज करवाना होगा
  rationale: क्रिया से पहले उसी धातु का infinitive absolute दायित्व पर बल देता है। मारनेवाला स्वयं वैद्य हो, यह आवश्यक नहीं; ‘इलाज करवाना’ उपचार की जिम्मेदारी को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: וְנִקָּה में मुक्ति का दायरा
  choice: दण्ड से मुक्त होगा
  alternative: दोषमुक्त होगा / निर्दोष ठहरेगा
  rationale: पद उसी व्यक्ति पर खोए समय और उपचार की आर्थिक जिम्मेदारी रखता है, इसलिए पूर्ण नैतिक निर्दोषता का अर्थ थोपना उचित नहीं। चुना हुआ रूप कानूनी दण्ड से मुक्ति को व्यक्त करते हुए शेष दायित्व बनाए रखता है।
- issue: רַפֹּא יְרַפֵּא का आशय
  choice: उसका पूरा इलाज करवाना होगा
  alternative: उसे पूरी तरह चंगा करवाना होगा
  rationale: इब्रानी बलाघातपूर्ण अभिव्यक्ति पूर्ण उपचार की जिम्मेदारी बताती है, पर अनिवार्य चिकित्सकीय परिणाम की गारंटी को स्पष्ट रूप से नहीं कहती। ‘पूरा इलाज’ बल को बनाए रखते हुए परिणाम और उपचार के बीच का तनाव अनावश्यक रूप से हल नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का dignified किंतु सहज कानूनी गद्य। ‘चलने-फिरने’, ‘भरपाई’ और ‘इलाज करवाना’ सामान्य पाठक के लिए स्पष्ट हैं; ‘दण्ड से मुक्त’ कानूनी स्वर बनाए रखता है और आगे के आर्थिक दायित्व से विरोध नहीं पैदा करता।
