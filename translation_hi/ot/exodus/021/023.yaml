  footnotes:
  - marker: a
    text: या ‘गंभीर चोट’ अथवा ‘मृत्यु’; हिब्रू शब्द गंभीर हानि या विपत्ति को सूचित कर सकता है, और इस प्रसंग में उसका अर्थ सामान्य चोट है या विशेष रूप से मृत्यु, इस पर मतभेद है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: परन्तु यदि
  rationale: यह पिछले पद की स्थिति के विपरीत एक शर्त प्रस्तुत करता है; आधुनिक हिन्दी में ‘परन्तु यदि’ उस संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: אָסוֹן
  choice: कोई हानि
  rationale: इस संज्ञा का अर्थ गंभीर हानि, विपत्ति या मृत्यु तक हो सकता है। व्यापक ‘हानि’ मूल की अनिश्चितता को बनाए रखता है और परिणाम को अनावश्यक रूप से केवल मृत्यु तक सीमित नहीं करता।
- source_word: יִהְיֶה
  choice: हो
  rationale: शर्तवाचक वाक्य में यह हिब्रू के साधारण अस्तित्व/घटना-सूचक प्रयोग का सहज हिन्दी रूप है।
- source_word: וְנָתַתָּה
  choice: तो तुम ... देना
  rationale: मूल क्रिया का आधारभूत अर्थ ‘देना’ है। यहाँ विधिक आदेश व्यक्त करने के लिए हिन्दी का यह रूप उपयुक्त है और इसे केवल धन चुकाने के अर्थ में सीमित नहीं करता।
- source_word: נֶפֶשׁ
  choice: प्राण
  rationale: इस विधिक सूत्र में अर्थ अमूर्त ‘आत्मा’ नहीं, बल्कि जीवन है। ‘प्राण’ पद की संक्षिप्तता, गरिमा और सूत्रात्मक समानता बनाए रखता है।
- source_word: תַּחַת
  choice: के बदले
  rationale: यहाँ यह प्रतिस्थापन अथवा समतुल्य प्रतिदान दर्शाता है; ‘के बदले’ हिन्दी में उस विधिक संबंध को स्पष्ट करता है।
- source_word: נָפֶשׁ
  choice: प्राण
  rationale: दोहराव हिब्रू सूत्र की शब्दगत समानता और विधिक सममिति को सुरक्षित रखता है।
theological_decisions:
- issue: इस व्यवस्था में אָסוֹן से अभिप्रेत हानि का दायरा
  choice: व्यापक रूप में ‘हानि’ कहना, बिना यह निर्धारित किए कि हानि किसे हुई या वह अनिवार्य रूप से घातक थी।
  alternative: ‘गंभीर चोट’ अथवा ‘मृत्यु’ कहना।
  rationale: पद स्वयं אָסוֹן की गंभीरता या उसके व्यक्ति-संदर्भ को स्पष्ट रूप से सीमित नहीं करता। व्यापक शब्द विवादित व्याख्यात्मक प्रश्न को अनसुलझा रहने देता है और मूल का तनाव सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘प्राण के बदले प्राण’ मूल के संक्षिप्त विधिक सूत्र और उसकी सममिति को सुरक्षित रखता है।
