base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/009.yaml
  text: But if he designates her for his son[a], he shall deal with her according to the rights of daughters.
translation:
  language: hi
  text: परन्तु यदि वह उसे अपने पुत्र के लिए ठहराए, तो वह उसके साथ बेटियों के अधिकार के अनुसार[a] व्यवहार करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बेटियों के लिए प्रचलित रीति के अनुसार।” इब्रानी पदबंध निर्धारित कानूनी अधिकार या प्रथागत व्यवहार—दोनों का भाव दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: परन्तु यदि
  rationale: यह कानूनी प्रसंग में अगली सशर्त स्थिति प्रस्तुत करता है और पिछले विकल्प से भेद भी दिखाता है।
- source_word: לִבְנוֹ
  choice: अपने पुत्र के लिए
  rationale: यहाँ ל विवाह-संबंधी व्यवस्था में किसी के लिए नियुक्त या निर्धारित करने का भाव देता है।
- source_word: יִיעָדֶנָּה
  choice: उसे ... ठहराए
  rationale: יעד यहाँ उसे वैवाहिक संबंध के लिए निर्धारित करने का कानूनी भाव रखता है; ‘विवाह कराए’ या ‘मंगनी करे’ कहना मूल से अधिक विशिष्ट होता।
- source_word: כְּמִשְׁפַּט
  choice: अधिकार के अनुसार
  rationale: कानूनी संदर्भ में מִשְׁפָּט किसी निर्धारित हक़, नियम या उचित व्यवहार को सूचित कर सकता है; यह अनुवाद उसके न्यायिक बल को बनाए रखता है।
- source_word: הַבָּנוֹת
  choice: बेटियों
  rationale: यह इब्रानी के निश्चित बहुवचन ‘बेटियों’ का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: יַעֲשֶׂה לָּהּ
  choice: वह उसके साथ ... व्यवहार करे
  rationale: עשה + ל किसी व्यक्ति के प्रति किए जाने वाले व्यवहार को व्यक्त करता है; हिन्दी में यह कानूनी दायित्व को स्वाभाविक ढंग से प्रकट करता है।
theological_decisions:
- issue: पुत्र के लिए ठहराई गई लड़की के प्रति दायित्व का स्वरूप
  choice: उसे बेटियों को मिलने वाले अधिकार के अनुरूप व्यवहार प्राप्त हो।
  alternative: यह केवल बेटियों के विवाह से जुड़ी प्रचलित रीति के अनुसार व्यवस्था करने की बात हो।
  rationale: כמשפט הבנות में कानूनी अधिकार और स्थापित प्रथा दोनों की अर्थ-छाया संभव है। मुख्य पाठ में न्यायिक बल रखा गया है, जबकि पादटिप्पणी वास्तविक वैकल्पिक अर्थ को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण कानूनी शैली रखी गई है। ‘ठहराए’ औपचारिक नियुक्ति का भाव देता है, पर ‘मंगनी’ जैसे अधिक विशिष्ट अर्थ को अनावश्यक रूप से नहीं जोड़ता।
