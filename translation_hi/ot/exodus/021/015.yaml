  text: Whoever strikes his father or his mother shall surely be put to death[a].
translation:
  language: hi
  text: जो अपने पिता या अपनी माता को मारे, वह निश्चय ही मार डाला जाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַכֵּה
  choice: मारे
  rationale: नכה का कृदन्त रूप किसी को शारीरिक रूप से मारने या प्रहार करने की क्रिया बताता है। ‘मारे’ सहज आधुनिक हिन्दी है और ‘पीटे’ की तरह बार-बार या अत्यधिक प्रहार का अर्थ अनावश्यक रूप से नहीं जोड़ता।
- source_word: אָבִיו
  choice: अपने पिता
  rationale: इब्रानी में स्पष्ट रूप से एकवचन ‘उसका पिता’ है। हिन्दी में कर्ता के साथ स्वाभाविक सम्बन्ध दिखाने के लिए ‘अपने पिता’ रखा गया है।
- source_word: אִמּוֹ
  choice: अपनी माता
  rationale: इब्रानी पाठ माता का अलग और स्पष्ट उल्लेख करता है; इसलिए माता-पिता को सामान्यीकृत करके केवल ‘अभिभावक’ नहीं कहा गया। ‘माता’ कानूनी और गरिमापूर्ण शैली के अनुकूल है।
- source_word: מוֹת יוּמָת
  choice: निश्चय ही मार डाला जाए
  rationale: इन्फिनिटिव एब्सोल्यूट के साथ सीमित क्रिया दण्ड की निश्चितता पर बल देती है। कर्मवाच्य रूप न्यायिक मृत्युदण्ड का भाव बनाए रखता है, केवल ‘मर जाए’ जैसा सामान्य परिणाम नहीं बताता।
- source_word: וּ / וְ
  choice: या
  rationale: रूपतः संयोजक ‘और’ है, पर इस कानून में आशय पिता अथवा माता—दोनों में से किसी एक—को मारना है। हिन्दी में ‘और’ यह भ्रामक संकेत दे सकता है कि दोनों को मारना आवश्यक है; इसलिए कानूनी अर्थ स्पष्ट करने हेतु ‘या’ रखा गया।
theological_decisions:
- issue: मृत्युदण्ड के कानूनी सूत्र का अनुवाद
  choice: निश्चय ही मार डाला जाए
  alternative: अवश्य मृत्यु-दण्ड दिया जाए / वह अवश्य मार डाला जाए
  rationale: यह पद केवल मृत्यु होने की बात नहीं, बल्कि न्यायिक दण्ड घोषित करता है। कर्मवाच्य कानूनी बल और मूल पाठ की गम्भीरता को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण कानूनी शैली में है। ‘जो…वह…’ हिन्दी में इब्रानी कृदन्तीय कानूनी विधान को स्वाभाविक रूप देता है। कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि ‘या’ हिन्दी में कानून का अभिप्रेत वितरणार्थक अर्थ सीधे और बिना भ्रम के व्यक्त करता है।
