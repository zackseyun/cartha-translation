source:
  edition: WLC
  text: וְ/הִגִּישׁ֤/וֹ אֲדֹנָי/ו֙ אֶל הָ֣/אֱלֹהִ֔ים וְ/הִגִּישׁ/וֹ֙ אֶל הַ/דֶּ֔לֶת א֖וֹ אֶל הַ/מְּזוּזָ֑ה וְ/רָצַ֨ע אֲדֹנָ֤י/ו אֶת אָזְנ/וֹ֙ בַּ/מַּרְצֵ֔עַ וַ/עֲבָד֖/וֹ לְ/עֹלָֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/006.yaml
  text: then his master shall bring him to God[a], and shall bring him to the door or to the doorpost, and his master shall pierce his ear with an awl; and he shall serve him forever.
translation:
  language: hi
  text: तब उसका स्वामी उसे परमेश्वर के सामने[a] ले जाए। फिर वह उसे द्वार या चौखट के पास ले जाए, और उसका स्वामी सुए से उसका कान छेद दे; तब वह सदा के लिए उसकी सेवा करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “न्यायाधीशों के सामने।” इब्रानी אֱלֹהִים कुछ कानूनी संदर्भों में मानव न्यायाधीशों या न्यायिक प्राधिकरण के लिए भी प्रयुक्त हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִגִּישׁוֹ
  choice: उसे ... के सामने ले जाए
  rationale: हिफ़ील रूप किसी व्यक्ति को किसी अधिकारी के समक्ष या निर्धारित स्थान पर प्रस्तुत करने का भाव देता है; यह हिन्दी में स्वाभाविक और विधिक प्रक्रिया के अनुरूप है।
- source_word: אֲדֹנָיו
  choice: उसका स्वामी
  rationale: यह दास और स्वामी के सामाजिक-कानूनी संबंध को स्पष्ट रूप से व्यक्त करता है और अनावश्यक ईश्वरीय अर्थ नहीं जोड़ता।
- source_word: הָאֱלֹהִים
  choice: परमेश्वर के सामने
  rationale: शब्द का प्राथमिक अर्थ परमेश्वर है; निश्चित उपपद सहित यह रूप किसी पवित्र या न्यायिक विधि में परमेश्वर के समक्ष उपस्थित किए जाने को स्वाभाविक रूप से व्यक्त कर सकता है। न्यायाधीशों वाला संभव अर्थ पादटिप्पणी में रखा गया है।
- source_word: הַדֶּלֶת
  choice: द्वार
  rationale: अनुष्ठान के वास्तविक स्थान के लिए सरल और सटीक स्थापत्य शब्द।
- source_word: הַמְּזוּזָה
  choice: चौखट
  rationale: आधुनिक हिन्दी में द्वार की खड़ी चौखट अथवा द्वार-स्तंभ के लिए सहज शब्द; यहाँ द्वार से इसका भेद पर्याप्त स्पष्ट रहता है।
- source_word: רָצַע
  choice: छेद दे
  rationale: क्रिया कान को नुकीले औज़ार से बेधने का संकेत देती है; यह हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: בַּמַּרְצֵעַ
  choice: सुए से
  rationale: מַרְצֵעַ छेद करने का नुकीला औज़ार है; 'सुआ' इसका सटीक और प्रचलित हिन्दी नाम है।
- source_word: וַעֲבָדוֹ
  choice: तब वह ... उसकी सेवा करे
  rationale: עבד यहाँ जारी बंधुआ सेवा बताता है; 'सेवा करे' क्रिया के अर्थ को सीधे रखता है, बिना स्थिति को नए ढंग से परिभाषित किए।
- source_word: לְעֹלָם
  choice: सदा के लिए
  rationale: मूल अभिव्यक्ति की दीर्घस्थायीता को सीधे व्यक्त करता है; इस कानूनी संदर्भ में इसका व्यावहारिक आशय जीवनभर की स्थायी सेवा है, पर मुख्य पाठ में मूल की व्यापक अभिव्यक्ति सुरक्षित रखी गई है।
theological_decisions:
- issue: कानूनी संदर्भ में הָאֱלֹהִים का अर्थ
  choice: परमेश्वर
  alternative: न्यायाधीश
  rationale: मूल शब्द का सामान्य और प्राथमिक अर्थ 'परमेश्वर' है और वाचा-संबंधी न्यायिक अनुष्ठान में यह अर्थ स्वाभाविक है। फिर भी मानव न्यायाधीशों या न्यायिक प्राधिकरण का अर्थ भी प्राचीन कानूनी संदर्भ में संभव है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
- issue: לְעֹלָם की कालावधि
  choice: सदा के लिए
  alternative: जीवनभर / स्थायी रूप से
  rationale: मुख्य पाठ मूल की व्यापक कालसूचक भाषा को बनाए रखता है। इस व्यवस्था में व्यावहारिक आशय जीवनभर की सेवा हो सकता है, पर अनुवाद में उसे चुपचाप अधिक सीमित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। विधिक निर्देश के लिए 'ले जाए', 'छेद दे' और 'सेवा करे' जैसे आज्ञार्थक-विधिक रूप प्रयुक्त हैं। 'परमेश्वर' और 'न्यायाधीशों' की वास्तविक अर्थगत अस्पष्टता पादटिप्पणी द्वारा सुरक्षित है।
