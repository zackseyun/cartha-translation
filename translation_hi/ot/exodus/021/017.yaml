  text: וּ/מְקַלֵּ֥ל אָבִ֛י/ו וְ/אִמּ֖/וֹ מ֥וֹת יוּמָֽת׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/017.yaml
  text: Whoever curses his father or his mother shall surely be put to death[a].
translation:
  language: hi
  text: जो अपने पिता या अपनी माता को शाप दे, उसे निश्चय ही मार डाला जाए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘और अपनी माता’; इस कानूनी विधान में आशय पिता या माता में से किसी एक को शाप देने से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמְקַלֵּל
  choice: जो ... शाप दे
  rationale: पिएल कृदंत यहाँ विधानात्मक शैली में अपराधी के सामान्य वर्ग को सूचित करता है। ‘जो ... शाप दे’ आधुनिक हिन्दी में इस कानूनी-सामान्य अर्थ को स्वाभाविक ढंग से व्यक्त करता है और ‘अपमान करे’ की अपेक्षा शाप देने के विशिष्ट भाव को बनाए रखता है।
- source_word: אָבִיו
  choice: अपने पिता
  rationale: तीसरे पुरुष एकवचन प्रत्यय का अर्थ पिता और उसी वाक्य के कर्ता के बीच संबंध है; हिन्दी में संबंधवाचक रचना ‘जो ... अपने पिता’ अधिक स्वाभाविक और स्पष्ट है।
- source_word: וְאִמּוֹ
  choice: या अपनी माता
  rationale: वाव का शाब्दिक अर्थ ‘और’ है, पर इस कानूनी कथन में माता-पिता में से किसी एक को शाप देना अपराध है। हिन्दी का ‘या’ इस वितरणात्मक आशय को स्पष्ट करता है।
- source_word: מוֹת יוּמָת
  choice: उसे निश्चय ही मार डाला जाए
  rationale: निरपेक्ष क्रियारूप के साथ धात्वर्थक संज्ञा दंडादेश की निश्चितता और प्रबलता व्यक्त करती है। यह अनुवाद केवल मृत्यु होने के बजाय न्यायिक रूप से मृत्युदंड दिए जाने का भाव सुरक्षित रखता है।
theological_decisions:
- issue: माता-पिता के युग्म का कानूनी विस्तार
  choice: ‘या अपनी माता’—अर्थात पिता अथवा माता में से किसी एक को शाप देना इस दंड के अंतर्गत है।
  alternative: इब्रानी संयोजक के अधिक शाब्दिक रूप में ‘और अपनी माता’।
  rationale: मूल पाठ में वाव है, फिर भी विधान का आशय दोनों को एक साथ शाप देने तक सीमित नहीं है। ‘या’ हिन्दी में वितरणात्मक कानूनी अर्थ को स्पष्ट करता है; शाब्दिक रूप की जानकारी पादटिप्पणी में दी गई है।
- issue: मृत्युदंड-सूत्र का स्वरूप
  choice: ‘उसे निश्चय ही मार डाला जाए’ को न्यायिक दंडादेश के रूप में प्रस्तुत किया गया है।
  alternative: ‘वह अवश्य मर जाए’ या ‘उसे मरना ही होगा’।
  rationale: इब्रानी हॉफअल क्रिया और धात्वर्थक संज्ञा का संयोजन लागू किए जाने वाले निश्चित मृत्युदंड को दर्शाता है, केवल मृत्यु के परिणाम को नहीं।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण कानूनी शैली में रखी गई है। ‘पिता’ और ‘माता’ मूल पदों की औपचारिकता बनाए रखते हैं, जबकि ‘जो ... दे’ सामान्य पाठक के लिए स्वाभाविक विधानात्मक रचना है।
