source:
  edition: WLC
  text: וְ/אִם שֵׁ֥ן עַבְדּ֛/וֹ אֽוֹ שֵׁ֥ן אֲמָת֖/וֹ יַפִּ֑יל לַֽ/חָפְשִׁ֥י יְשַׁלְּחֶ֖/נּוּ תַּ֥חַת שִׁנּֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/027.yaml
  text: And if he knocks out the tooth of his male servant or the tooth of his female servant[a], he shall let him go free in compensation for his tooth.
translation:
  language: hi
  text: और यदि कोई अपने दास या अपनी दासी का दाँत गिरा दे, तो उस दाँत के बदले वह उसे स्वतंत्र जाने दे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह नियम दास और दासी, दोनों पर लागू होता है; इब्रानी कानूनी वाक्य-रचना में यहाँ कर्म-सर्वनाम पुल्लिंग एकवचन है।
    reason: मूल पाठ के व्याकरणिक रूप और विधान के दोनों संभावित व्यक्तियों पर लागू होने की बात स्पष्ट करना।
lexical_decisions:
- source_word: וְאִם
  choice: और यदि
  rationale: यह पिछले नियम से जुड़े अगले कानूनी प्रसंग का आरंभ करता है; ‘और यदि’ संयोजक और शर्त—दोनों को सुरक्षित रखता है।
- source_word: שֵׁן
  choice: दाँत
  rationale: सामान्य शारीरिक अर्थ है और इब्रानी के समान एकवचन रखा गया है।
- source_word: עַבְדּוֹ / אֲמָתוֹ
  choice: अपने दास या दासी का
  rationale: ये क्रमशः पुरुष और स्त्री बंधुआ व्यक्ति के लिए प्रयुक्त शब्द हैं। ‘दास या दासी’ सामाजिक-कानूनी स्थिति और लिंग-भेद दोनों स्पष्ट करता है।
- source_word: יַפִּיל
  choice: तोड़ दे
  rationale: हिफ़ील रूप का शाब्दिक भाव ‘गिरा दे’ है; दाँत के संदर्भ में आधुनिक स्वाभाविक हिन्दी में ‘दाँत तोड़ दे’ उसी चोट को स्पष्ट रूप से व्यक्त करता है।
- source_word: לַחָפְשִׁי יְשַׁלְּחֶנּוּ
  choice: उसे स्वतंत्र करके जाने दे
  rationale: कानूनी संदर्भ में यह पदबंध दासता से मुक्त कर देने को दर्शाता है; यह रूप रिहाई और स्वतंत्र स्थिति दोनों व्यक्त करता है।
- source_word: תַּחַת שִׁנּוֹ
  choice: उस दाँत के बदले
  rationale: תַּחַת यहाँ चोट के प्रतिफल अथवा मुआवज़े का संबंध बताता है; ‘के बदले’ संक्षिप्त और स्वाभाविक कानूनी हिन्दी है।
theological_decisions:
- issue: निर्गमन की वाचा-संहिता में दासता-संबंधी शब्दावली
  choice: दास / दासी
  alternative: सेवक / सेविका
  rationale: यह विधान बंधुआ सामाजिक-कानूनी स्थिति से संबंधित है। ‘दास / दासी’ उस वास्तविकता को ‘सेवक / सेविका’ से अधिक स्पष्टता से दिखाता है और मूल पाठ के लिंग-भेद को भी बनाए रखता है।
- issue: रिहाई के कर्म का एकवचन पुल्लिंग सर्वनाम
  choice: मुख्य पाठ में ‘उसे’, साथ में व्याख्यात्मक पादटिप्पणी
  alternative: ‘उसे स्वतंत्र करके जाने दे’ को बिना पादटिप्पणी रखना, या बहुवचन ‘उन्हें’ करना
  rationale: इब्रानी कानूनी सूत्र में कर्म-प्रत्यय पुल्लिंग एकवचन है, जबकि शर्त में दास और दासी दोनों आते हैं। ‘उसे’ स्रोत-रूप को सुरक्षित रखता है; पादटिप्पणी स्पष्ट करती है कि नियम दोनों पर लागू है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज कानूनी हिन्दी। ‘दास / दासी’ ऐतिहासिक सामाजिक स्थिति को स्पष्ट रखता है; ‘स्वतंत्र करके जाने दे’ रिहाई के कानूनी परिणाम को स्वाभाविक ढंग से व्यक्त करता है।
