- from: यदि बैल किसी के बेटे या बेटी को सींग मारे, तो उसके मालिक के साथ इसी नियम के अनुसार व्यवहार किया जाए।
  to: यदि बैल किसी बेटे या बेटी को सींग मारे, तो उसके मालिक के साथ भी इसी नियम के अनुसार व्यवहार किया जाए।
  rationale: The revision removes the added possessive and adds ‘भी’ to convey the legal continuity expressed by ‘according to this judgment.’ It retains the contextual clarification that the person affected by the legal ruling is the ox’s owner, while preserving the Hebrew passive legal formulation in idiomatic modern Hindi.
