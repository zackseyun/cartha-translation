  register: आधुनिक, गरिमापूर्ण और सहज कानूनी हिन्दी। पूर्ववर्ती प्रसंग पर निर्भर सर्वनाम को अस्पष्टता से बचाने के लिए ‘बैल’ और ‘मालिक’ स्पष्ट किए गए हैं; कर्मवाच्य शैली सुरक्षित रखी गई है।
