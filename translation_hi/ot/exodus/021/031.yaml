  text: If it gores a son or a daughter[b][a], it shall be done to him according to this judgment.
translation:
  language: hi
  text: यदि बैल किसी बेटे या बेटी को सींग मारे, तो उसके मालिक के साथ भी इसी नियम के अनुसार व्यवहार किया जाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אוֹ
  choice: यदि
  rationale: वैकल्पिक कानूनी परिस्थिति आरम्भ करने वाला אוֹ यहाँ हिन्दी की शर्तसूचक शैली में स्वाभाविक रूप से ‘यदि’ व्यक्त होता है।
- source_word: בֵן ... בַת
  choice: किसी के बेटे या बेटी
  rationale: ‘बेटा’ और ‘बेटी’ मूल के लिंग-विशिष्ट युग्म को बनाए रखते हैं; ‘किसी के’ से हिन्दी में सम्बन्ध स्पष्ट और स्वाभाविक होता है।
- source_word: יִגָּח
  choice: सींग मारे
  rationale: נגח का अर्थ सींग से मारना है; पिछले प्रसंग से कर्ता बैल है, इसलिए उसे स्पष्ट किया गया है।
- source_word: כַּמִּשְׁפָּט הַזֶּה
  choice: इसी नियम के अनुसार
  rationale: कानूनी प्रसंग में מִשְׁפָּט पूर्ववर्ती पद में निर्धारित नियम या न्यायिक प्रावधान को सूचित करता है; ‘नियम’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: יֵעָשֶׂה לּוֹ
  choice: उसके मालिक के साथ ... व्यवहार किया जाए
  rationale: हिब्रू के कर्मवाच्य कानूनी कथन को बनाए रखते हुए प्रसंगगत संकेत ‘उसके’ को बैल के मालिक के रूप में स्पष्ट किया गया है।
