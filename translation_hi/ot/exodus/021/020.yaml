base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/020.yaml
  text: And if a man strikes his male servant or his female servant with a rod[a], and the servant dies under his hand, he must surely be avenged.
translation:
  language: hi
  text: और यदि कोई पुरुष अपने दास या अपनी दासी को लाठी से मारे, और वह उसके हाथ से मर जाए, तो उसका बदला अवश्य लिया जाए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मारने वाले को अवश्य दण्ड दिया जाए।” इब्रानी में अधिक शाब्दिक रूप से, “उसका बदला अवश्य लिया जाए”; यह बल देने वाली कानूनी अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כִֽי
  choice: और यदि
  rationale: यह प्रसंग से जुड़ी शर्तात्मक कानूनी धारा आरम्भ करता है और וְ तथा כִּי दोनों की भूमिका बनाए रखता है।
- source_word: יַכֶּה
  choice: मारे
  rationale: נכה प्रहार करने के लिए व्यापक क्रिया है; 'मारे' स्वाभाविक हिन्दी है और साधन का उल्लेख आगे 'लाठी से' होता है।
- source_word: אִישׁ
  choice: कोई पुरुष
  rationale: इब्रानी शब्द व्याकरणतः पुल्लिंग एकवचन है; 'कोई पुरुष' कानूनी शर्त की अनिश्चितता और लिंग दोनों व्यक्त करता है।
- source_word: עַבְדּוֹ / אֲמָתוֹ
  choice: अपने दास या अपनी दासी
  rationale: ये शब्द बंधुआ सामाजिक स्थिति और स्पष्ट पुरुष-स्त्री समानांतरता बताते हैं; 'नौकर/नौकरानी' उस स्थिति को अनावश्यक रूप से हल्का कर सकते हैं।
- source_word: בַּשֵּׁבֶט
  choice: लाठी से
  rationale: שֵׁבֶט का अर्थ छड़ी, लाठी या राजदंड हो सकता है; यहाँ प्रहार के साधन के रूप में 'लाठी' सबसे स्वाभाविक है।
- source_word: וּמֵת תַּחַת יָדוֹ
  choice: और वह उसके हाथों तत्काल मर जाए
  rationale: '''उसके हाथों'' कर्ता के सीधे प्रहार से मृत्यु को व्यक्त करता है; यहाँ תחת ידו का मुहावरा प्रहार के दौरान अथवा उसी के तत्काल प्रभाव में मृत्यु का संकेत देता है।'
- source_word: נָקֹם יִנָּקֵם
  choice: उसका बदला अवश्य लिया जाए
  rationale: क्रिया का निफ़अल रूप और धातु-संज्ञार्थक रूप के साथ प्रयोग प्रतिशोध/न्यायिक बदले की निश्चितता पर बल देता है; हिन्दी में यह कर्मवाच्य मूल अस्पष्टता को सुरक्षित रखता है।
theological_decisions:
- issue: נָקֹם יִנָּקֵם में निर्धारित कानूनी परिणाम का स्वरूप
  choice: उसका बदला अवश्य लिया जाए
  alternative: उसे अवश्य दण्ड दिया जाए
  rationale: इब्रानी पाठ इस पद में दण्ड की ठीक विधि या मात्रा नहीं बताता, बल्कि दृढ़तापूर्वक कहता है कि मृत दास या दासी के लिए प्रतिशोधात्मक न्याय किया जाए। मुख्य पाठ में अधिक विशिष्ट दण्ड जोड़ना मूल की सीमा से आगे जाता।
translation_notes:
  register: आधुनिक, स्पष्ट और गरिमापूर्ण कानूनी हिन्दी। 'दास/दासी' मूल सामाजिक स्थिति को स्पष्ट रखते हैं। 'उसका' का निकटतम सन्दर्भ मृत दास या दासी है, जबकि वैकल्पिक अर्थ को पादटिप्पणी में रखा गया है।
