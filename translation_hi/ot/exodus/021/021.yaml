base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/021.yaml
  text: However[a], if he survives for a day or two, he shall not be avenged[b], for he is his money.
translation:
  language: hi
  text: परन्तु यदि वह एक-दो दिन जीवित रहे, तो उसका बदला न लिया जाए,[a] क्योंकि वह उसका धन है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे दण्ड न दिया जाए।” इब्रानी में अधिक विशेष रूप से बदला लेने या कानूनी प्रतिशोध चुकाने की बात है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “क्योंकि वह उसका धन है”; यह स्वामी के लिए दास के आर्थिक मूल्य को व्यक्त करता है।
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: परन्तु
  rationale: यह पिछले कानूनी मामले में अपवाद अथवा सीमा जोड़ता है; ‘परन्तु’ आधुनिक हिन्दी में इसके विरोधात्मक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יוֹם אוֹ יוֹמַיִם
  choice: एक-दो दिन
  rationale: यह ‘एक दिन या दो दिन’ का स्वाभाविक हिन्दी रूप है और मूल की सीमित अवधि बनाए रखता है।
- source_word: יַעֲמֹד
  choice: जीवित रहे
  rationale: शाब्दिक अर्थ ‘खड़ा रहे’ है, पर इस कानूनी प्रसंग में आशय मार खाने के बाद जीवित बने रहने से है; यह पूर्ण रूप से स्वस्थ हो जाने का संकेत नहीं देता।
- source_word: לֹא יֻקַּם
  choice: उसका बदला न लिया जाए
  rationale: נקם के होफ़ाल रूप में कानूनी प्रतिशोध या बदला चुकाए जाने का भाव है; यह सामान्य ‘दण्ड’ से अधिक विशिष्ट है।
- source_word: כִּי כַסְפּוֹ הוּא
  choice: क्योंकि वह उसका धन है
  rationale: मूल की कठोर आर्थिक अभिव्यक्ति को सीधे बनाए रखता है; ‘सम्पत्ति’ कहना अधिक व्याख्यात्मक होता।
theological_decisions:
- issue: दासता-संबंधी विधान का आर्थिक तर्क
  choice: ‘क्योंकि वह उसका धन है’ को बिना नरम किए रखा गया।
  alternative: ‘क्योंकि वह उसकी सम्पत्ति है’ अथवा ‘क्योंकि हानि उसी की है’
  rationale: इब्रानी पाठ कारण को स्पष्ट और कठोर आर्थिक शब्दों में रखता है। नैतिक असहजता घटाने के लिए इसे नरम करना मूल पाठ के तनाव को मिटा देता।
- issue: לֹא יֻקַּם में कानूनी प्रतिशोध
  choice: ‘उसका बदला न लिया जाए’
  alternative: ‘उसे दण्ड न दिया जाए’
  rationale: मूल क्रिया विशेष रूप से बदला अथवा न्यायिक प्रतिशोध लिए जाने की ओर संकेत करती है; व्यापक ‘दण्ड’ को पादटिप्पणी में विकल्प के रूप में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण कानूनी शैली रखी गई है। ‘जीवित रहे’ प्रसंगगत अर्थ स्पष्ट करता है, जबकि ‘उसका धन’ मूल की कठोरता और theological tension को सुरक्षित रखता है।
