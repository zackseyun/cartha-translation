source:
  edition: WLC
  text: אִם עֶ֛בֶד יִגַּ֥ח הַ/שּׁ֖וֹר א֣וֹ אָמָ֑ה כֶּ֣סֶף שְׁלֹשִׁ֣ים שְׁקָלִ֗ים יִתֵּן֙ לַֽ/אדֹנָ֔י/ו וְ/הַ/שּׁ֖וֹר יִסָּקֵֽל־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/032.yaml
  text: If the ox gores a male servant or a female servant[a], he shall give thirty shekels of silver to his master, and the ox shall be stoned.
translation:
  language: hi
  text: यदि बैल किसी दास या दासी[a] को सींग मारे, तो बैल का मालिक उस दास या दासी के स्वामी को चाँदी के तीस शेकेल दे, और बैल को पत्थरों से मार डाला जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पुरुष दास या स्त्री दास।” इब्रानी में पुरुष दास (עֶבֶד) और स्त्री दास (אָמָה) के लिए अलग-अलग शब्द हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶבֶד
  choice: दास
  rationale: कानूनी संदर्भ में यह शब्द बँधी हुई दास-स्थिति को व्यक्त करता है; ‘सेवक’ की अपेक्षा ‘दास’ मूल के सामाजिक-कानूनी अर्थ को अधिक स्पष्टता से बनाए रखता है।
- source_word: אָמָה
  choice: दासी
  rationale: עֶבֶד के साथ जोड़े में यह स्त्री दास को सूचित करता है; ‘दासी’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: יִגַּח
  choice: सींग मारे
  rationale: नागह क्रिया बैल द्वारा सींग से घायल करने के विशिष्ट अर्थ में प्रयुक्त है; ‘सींग मारे’ हिन्दी में सटीक और सहज है।
- source_word: כֶּסֶף שְׁלֹשִׁים שְׁקָלִים
  choice: चाँदी के तीस शेकेल
  rationale: यह चाँदी की वह मात्रा बताता है जिसका भार तीस शेकेल है; लिप्यंतरित ‘शेकेल’ प्राचीन भार-मुद्रा को आधुनिक इकाई में बदले बिना सुरक्षित रखता है।
- source_word: יִתֵּן
  choice: दे
  rationale: इस शर्तात्मक कानून में अपूर्ण क्रिया कानूनी दायित्व व्यक्त करती है; ‘दे’ हिन्दी के विधिक निर्देश के लिए स्वाभाविक है।
- source_word: לַאדֹנָיו
  choice: उसके स्वामी को
  rationale: प्रत्यय का सबसे स्वाभाविक संबंध अभी उल्लिखित दास या दासी से है; ‘स्वामी’ यहाँ सामाजिक-कानूनी अधिकार-संबंध व्यक्त करता है।
- source_word: יִסָּקֵל
  choice: पत्थरों से मार डाला जाए
  rationale: सकल के निफ़अल रूप का अर्थ पत्थर मारकर मृत्युदंड देना है; यह हिन्दी रूप केवल ‘पत्थर मारे जाएँ’ की संभावित अस्पष्टता को दूर करते हुए परिणाम स्पष्ट करता है।
theological_decisions:
- issue: कानून में दास-स्थिति का वर्णन
  choice: मूल के सामाजिक-कानूनी शब्दों को ‘दास’ और ‘दासी’ के रूप में स्पष्ट रखा गया है।
  alternative: ‘सेवक’ और ‘सेविका’
  rationale: अनुवाद विधान का समर्थन या खंडन जोड़े बिना उसके ऐतिहासिक कानूनी संदर्भ को दर्शाता है; नरम शब्दावली मूल में निहित दास-स्थिति को छिपा सकती है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। शर्तात्मक कानून की संक्षिप्त संरचना बनाए रखी गई है। ‘वह’ मूल पाठ के अनिर्दिष्ट पुल्लिंग कर्ता को सुरक्षित रखता है, जिसे संदर्भ में बैल का मालिक समझा जाता है।
