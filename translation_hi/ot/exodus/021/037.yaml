  yaml_path: translation/ot/exodus/021/037.yaml
  text: If a man steals an ox or a sheep and slaughters it or sells it[b][a], he shall repay five cattle for the ox and four sheep for the sheep.
translation:
  language: hi
  text: यदि कोई पुरुष किसी बैल या भेड़ को चुराकर उसका वध कर दे या उसे बेच दे, तो वह उस बैल के बदले पाँच गाय-बैल और उस भेड़ के बदले चार भेड़-बकरियाँ क्षतिपूर्ति के रूप में दे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘भेड़’ के लिए प्रयुक्त शब्द भेड़ या बकरी, दोनों में से किसी एक छोटे पालतू पशु को सूचित कर सकता है; इसी प्रकार अंत में ‘भेड़-बकरियाँ’ छोटे पालतू पशुओं के सामूहिक वर्ग को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: यदि
  rationale: यह एक शर्तयुक्त कानूनी मामले का आरम्भ करता है; आधुनिक हिन्दी में ‘यदि’ स्वाभाविक और स्पष्ट है।
- source_word: אִישׁ
  choice: कोई पुरुष
  rationale: मूल पाठ के व्याकरणिक पुल्लिंग एकवचन को सुरक्षित रखता है, जबकि ‘कोई’ इसे सामान्य कानूनी उदाहरण के रूप में व्यक्त करता है।
- source_word: שׁוֹר
  choice: बैल
  rationale: कानूनी पशुधन-संदर्भ में שׁוֹר का सीधा और प्रचलित हिन्दी पर्याय है।
- source_word: שֶׂה
  choice: भेड़
  rationale: שֶׂה भेड़ या बकरी जैसे छोटे पालतू पशु को सूचित कर सकता है; यहाँ एक सहज मुख्य-पाठ विकल्प के रूप में ‘भेड़’ चुना गया है और व्यापक अर्थ पादटिप्पणी में दिया गया है।
- source_word: וּטְבָחוֹ
  choice: उसका वध कर दे
  rationale: טבח सामान्य हत्या नहीं, बल्कि पशु को काटने/वध करने का विशिष्ट अर्थ देता है; ‘वध’ गरिमापूर्ण और सटीक है।
- source_word: מְכָרוֹ
  choice: उसे बेच दे
  rationale: क्रिया और उसके एकवचन कर्म-सर्वनाम को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: חֲמִשָּׁה בָקָר
  choice: पाँच गाय-बैल
  rationale: בקר गोवंश का सामूहिक शब्द है; ‘गाय-बैल’ पाँच पशुओं की गणना को सहज रखते हुए केवल नर पशुओं तक अर्थ सीमित नहीं करता।
- source_word: יְשַׁלֵּם
  choice: लौटाए
  rationale: कानूनी संदर्भ में שלם क्षतिपूर्ति या प्रतिपूर्ति देने को सूचित करता है; पशुओं के अनुपात से ‘लौटाए’ का प्रतिपूर्ति-अर्थ स्पष्ट है।
- source_word: תַּחַת
  choice: के बदले
  rationale: प्रतिस्थापन और प्रतिपूर्ति का संबंध हिन्दी में सीधे व्यक्त करता है।
- source_word: וְאַרְבַּע צֹאן
  choice: चार भेड़-बकरियाँ
  rationale: צֹאן छोटे पालतू पशुओं का सामूहिक वर्ग है; ‘भेड़-बकरियाँ’ मूल की व्यापकता को बनाए रखता है।
