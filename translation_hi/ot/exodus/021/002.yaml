source:
  edition: WLC
  text: כִּ֤י תִקְנֶה֙ עֶ֣בֶד עִבְרִ֔י שֵׁ֥שׁ שָׁנִ֖ים יַעֲבֹ֑ד וּ/בַ֨/שְּׁבִעִ֔ת יֵצֵ֥א לַֽ/חָפְשִׁ֖י חִנָּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/002.yaml
  text: If you buy a Hebrew servant[a], he shall serve six years, but in the seventh he shall go out free[b], without payment.
translation:
  language: hi
  text: यदि तुम किसी इब्री दास[a] को खरीदो, तो वह छह वर्ष तक सेवा करे; पर सातवें वर्ष वह बिना कुछ चुकाए स्वतंत्र होकर चला जाए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब तुम किसी इब्री दास को खरीदो।” इब्रानी शर्तसूचक शब्द यहाँ “यदि” या “जब”—दोनों अर्थ दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “वह बिना मूल्य स्वतंत्रता के लिए बाहर जाए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: यदि
  rationale: यह शब्द यहाँ विधिक परिस्थिति प्रस्तुत करता है; आधुनिक हिन्दी की शर्तसूचक कानूनी शैली में ‘यदि’ स्वाभाविक है, यद्यपि ‘जब’ भी सम्भव है।
- source_word: תִקְנֶה
  choice: खरीदो
  rationale: קנה का अर्थ इस क्रय-विधिक सन्दर्भ में ‘खरीदना/अर्जित करना’ है; ‘खरीदो’ स्पष्ट और सीधा है।
- source_word: עֶבֶד עִבְרִי
  choice: इब्री दास
  rationale: עֶבֶד खरीदे गए बंधुआ व्यक्ति की स्थिति को व्यक्त करता है, इसलिए ‘सेवक’ के बजाय ‘दास’ अधिक पारदर्शी है; עִבְרִי को विशिष्ट जातिनाम ‘इब्री’ के रूप में रखा गया है।
- source_word: שֵׁשׁ שָׁנִים יַעֲבֹד
  choice: छः वर्ष तक सेवा करे
  rationale: अवधि और עבד के सेवा/काम करने के अर्थ को स्वाभाविक विधिक हिन्दी में व्यक्त करता है।
- source_word: וּבַשְּׁבִעִת
  choice: पर सातवें वर्ष
  rationale: वाव यहाँ पहले छह वर्षों और मुक्ति के सातवें वर्ष के बीच विरोध दिखाता है; हिन्दी में स्पष्टता के लिए निहित ‘वर्ष’ दोहराया गया है।
- source_word: יֵצֵא לַחָפְשִׁי
  choice: स्वतंत्र होकर चला जाए
  rationale: हिब्रू के बाहर जाने और स्वतंत्र अवस्था में प्रवेश करने—दोनों भावों को सहज हिन्दी में बनाए रखता है।
- source_word: חִנָּם
  choice: बिना कुछ चुकाए
  rationale: यह स्पष्ट करता है कि स्वतंत्र होने के लिए कोई मूल्य या मुक्ति-धन नहीं देना होगा, जबकि मूल का ‘बिना मूल्य’ भाव बना रहता है।
theological_decisions:
- issue: कानूनी दासता के सन्दर्भ में עֶבֶד का अनुवाद
  choice: दास
  alternative: सेवक / बंधुआ सेवक
  rationale: पद एक खरीदे गए व्यक्ति की बाध्य सेवा को नियंत्रित करता है। ‘दास’ इस स्थिति को नरम किए बिना स्पष्ट करता है; अवधि-सीमित सेवा का विवरण स्वयं पद में बना रहता है।
- issue: कानून की आरम्भिक शर्त כִּי
  choice: यदि
  alternative: जब
  rationale: दोनों अर्थ सम्भव हैं। ‘यदि’ परिस्थितिजन्य कानून की शर्त को स्वाभाविक हिन्दी में व्यक्त करता है, बिना यह मान लिए कि हर श्रोता ऐसा अवश्य करेगा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। कानूनी लहजे के लिए ‘यदि…तो’ और ‘सेवा करे/चला जाए’ का प्रयोग किया गया है। ‘दास’ मूल में निहित बंधुआ स्थिति को पारदर्शी बनाता है; ‘इब्री’ मूल जातिनाम को सुरक्षित रखता है।
