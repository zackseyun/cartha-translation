  text: אִם רָעָ֞ה בְּ/עֵינֵ֧י אֲדֹנֶ֛י/הָ אֲשֶׁר לא יְעָדָ֖/הּ וְ/הֶפְדָּ֑/הּ לְ/עַ֥ם נָכְרִ֛י לֹא יִמְשֹׁ֥ל לְ/מָכְרָ֖/הּ בְּ/בִגְד/וֹ בָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/008.yaml
  text: If she is displeasing in the eyes of her master[a], who has not designated her for himself, then he shall let her be redeemed. He has no right to sell her to a foreign people[b], since he has dealt deceitfully with her.
translation:
  language: hi
  text: यदि वह अपने स्वामी की दृष्टि में अप्रिय हो, जिसने उसे अपने लिए नियत नहीं किया है[a], तो वह उसे छुड़ाने की अनुमति दे। उसे विदेशी लोगों को बेचने का अधिकार उसे नहीं है, क्योंकि उसने उसके साथ विश्वासघात किया है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिसने उसे अपने लिए नियत किया है” अथवा “जिसने उसे अपने लिए विवाह के लिए ठहराया है।” इब्रानी पाठ और इस खंड का अर्थ दोनों कठिन हैं।
    reason: textual_variant
  - marker: b
    text: या, “क्योंकि उसने उसके प्रति कपटपूर्ण व्यवहार किया है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָה בְּעֵינֵי
  choice: पसंद न आए
  rationale: यह इब्रानी मुहावरा यहाँ नैतिक रूप से बुरा होने के बजाय स्वामी को अप्रिय या अस्वीकार्य लगने का भाव देता है; यह चयन आधुनिक हिन्दी में स्वाभाविक है।
- source_word: אֲדֹנֶיהָ
  choice: अपने स्वामी
  rationale: इस कानूनी संदर्भ में यह लड़की पर अधिकार रखने वाले पुरुष खरीदार को सूचित करता है; ‘स्वामी’ सामाजिक-कानूनी संबंध को स्पष्ट रखता है।
- source_word: יְעָדָהּ
  choice: अपने लिए नियत नहीं किया है
  rationale: क्रिया विवाह के उद्देश्य से ठहराने या नियत करने की ओर संकेत करती है, पर मुख्य पाठ में व्यापक ‘नियत’ रखा गया है ताकि अर्थ को अनावश्यक रूप से केवल सगाई तक सीमित न किया जाए।
- source_word: וְהֶפְדָּהּ
  choice: वह उसका छुड़ाया जाना होने दे
  rationale: हिफ़ील रूप यहाँ छुड़ाने की अनुमति देने या छुड़ाए जाने की व्यवस्था करने का कानूनी भाव रखता है; इससे यह आवश्यक नहीं ठहरता कि छुटकारे का मूल्य स्वामी स्वयं चुकाए।
- source_word: לְעַם נָכְרִי
  choice: किसी पराए लोगों के हाथ
  rationale: मूल वाक्यांश सामूहिक रूप से एक पराए जनसमुदाय को सूचित करता है; ‘लोगों के हाथ’ हिन्दी में बिक्री के संबंध को स्वाभाविक बनाता है।
- source_word: לֹא יִמְשֹׁל לְמָכְרָהּ
  choice: बेचने का अधिकार उसे नहीं है
  rationale: משל यहाँ सामर्थ्य से अधिक वैधानिक अधिकार व्यक्त करता है; यह अनुवाद कानूनी निषेध को साफ़ आधुनिक हिन्दी में देता है।
- source_word: בְּבִגְדוֹ בָהּ
  choice: क्योंकि उसने उसके साथ विश्वासघात किया है
  rationale: בגד किसी के प्रति कपटपूर्ण, विश्वासहीन या विश्वासघाती व्यवहार बताता है; ‘विश्वासघात’ कानूनी-नैतिक आरोप को संक्षेप में व्यक्त करता है।
theological_decisions:
- issue: יְעָדָהּ और לא/לו से जुड़ी पाठगत तथा व्याख्यात्मक कठिनाई
  choice: जिसने उसे अपने लिए नियत नहीं किया है
  alternative: जिसने उसे अपने लिए नियत/विवाह के लिए ठहराया है
  rationale: प्रदत्त मसोराई पाठ में לא (‘नहीं’) है, इसलिए मुख्य पाठ नकारात्मक वाचन को अपनाता है। किन्तु मसोराई परंपरा और प्राचीन व्याख्या में לו (‘अपने लिए’) तथा विवाह-संबंधी अर्थ की संभावना जुड़ी है; इसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण कानूनी गद्य। ‘पसंद न आए’ मुहावरे को स्वाभाविक बनाता है, जबकि ‘स्वामी’, ‘नियत’, ‘छुड़ाया जाना’ और ‘अधिकार’ मूल के सामाजिक-कानूनी ढाँचे को बनाए रखते हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
