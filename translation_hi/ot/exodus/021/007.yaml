reference: Exodus 21:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/כִֽי יִמְכֹּ֥ר אִ֛ישׁ אֶת בִּתּ֖/וֹ לְ/אָמָ֑ה לֹ֥א תֵצֵ֖א כְּ/צֵ֥את הָ/עֲבָדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/007.yaml
  text: And if a man sells his daughter as a female servant[b][a], she shall not go out as the male servants go out.
translation:
  language: hi
  text: और यदि कोई पुरुष अपनी बेटी को दासी के रूप में बेच दे, तो वह दासों की तरह सेवा से मुक्त होकर नहीं जाएगी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “वह दासों के निकलने की तरह नहीं निकलेगी”; अर्थात उसकी सेवा से मुक्ति पुरुष दासों के समान शर्तों पर नहीं होगी।
    reason: cultural_note
lexical_decisions:
- source_word: וְ/כִי
  choice: और यदि
  rationale: यह कानूनी प्रसंग में अगली शर्तपरक स्थिति प्रस्तुत करता है; ‘और’ से वाव का संयोजक बल बना रहता है।
- source_word: יִמְכֹּר
  choice: बेच दे
  rationale: हिब्रू क्रिया स्पष्टतः बिक्री बताती है; शर्तपरक कानूनी वाक्य में ‘बेच दे’ स्वाभाविक हिंदी है।
- source_word: אִישׁ
  choice: कोई पुरुष
  rationale: पुल्लिंग एकवचन को बनाए रखता है और इस प्रसंग में पिता अथवा पुरुष गृहस्वामी का संकेत देता है।
- source_word: בִּתּוֹ
  choice: अपनी बेटी
  rationale: तीसरे पुरुष एकवचन प्रत्यय सहित पुत्री-संबंध को सीधे व्यक्त करता है; हिंदी में कर्ता के साथ ‘अपनी’ स्वाभाविक है।
- source_word: לְאָמָה
  choice: दासी के रूप में
  rationale: אָמָה बंधुआ सेवा में स्त्री को दर्शाता है। ‘दासी’ आधुनिक हिंदी में स्त्री-दास की कानूनी-सामाजिक स्थिति को संक्षेप और स्पष्ट रूप से व्यक्त करता है।
- source_word: לֹא תֵצֵא
  choice: सेवा से मुक्त होकर नहीं जाएगी
  rationale: शाब्दिक अर्थ ‘बाहर नहीं जाएगी’ है, पर कानूनी मुहावरे में आशय सेवा से निकलने अथवा मुक्त होने का है; हिंदी में अर्थ स्पष्ट रखते हुए ‘जाएगी’ की गति-छवि भी बचाई गई है।
- source_word: כְּצֵאת הָעֲבָדִים
  choice: दासों की तरह
  rationale: पूर्ववर्ती नियम के पुरुष दासों के निकलने की रीति से तुलना है। हिंदी ‘दासों’ से संदर्भगत पुल्लिंग स्पष्ट रहता है।
theological_decisions:
- issue: वाचा-संहिता में दासता-संबंधी शब्दावली
  choice: אָמָה के लिए ‘दासी’ और עֲבָדִים के लिए ‘दासों’ का प्रयोग
  alternative: नौकरानी / सेविका; सेवक
  rationale: यह विधान बिक्री और सेवा से मुक्ति की शर्तों से जुड़ा है, इसलिए बंधुआ कानूनी स्थिति को नरम करके प्रस्तुत नहीं किया गया। साथ ही हिंदी के स्वाभाविक और ऐतिहासिक रूप से स्थापित लिंग-विशिष्ट शब्द रखे गए हैं।
- issue: स्त्री के निकलने पर निषेध का आशय
  choice: ‘सेवा से मुक्त होकर नहीं जाएगी’—अर्थात पुरुष दासों वाली रीति से नहीं
  alternative: ‘बाहर नहीं जाएगी,’ जिसे सामान्य आवागमन पर रोक समझा जा सकता है
  rationale: हिब्रू का कानूनी मुहावरा सेवा से रिहाई को दर्शाता है। पद का अर्थ यह नहीं कि वह कभी मुक्त नहीं हो सकती, बल्कि यह कि उसकी मुक्ति पुरुष दासों के समान शर्तों पर नहीं होती; अगले पद इस भिन्न व्यवस्था को बताते हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘दासी/दास’ कानूनी बंधन को बिना नरम किए व्यक्त करते हैं। मुख्य पाठ में अस्पष्ट ‘बाहर जाना’ के स्थान पर प्रसंगगत अर्थ ‘सेवा से मुक्त होना’ दिया गया है, जबकि शाब्दिक संरचना पादटिप्पणी में सुरक्षित है।
