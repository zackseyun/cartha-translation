  text: וַ/אֲשֶׁר֙ לֹ֣א צָדָ֔ה וְ/הָ/אֱלֹהִ֖ים אִנָּ֣ה לְ/יָד֑/וֹ וְ/שַׂמְתִּ֤י לְ/ךָ֙ מָק֔וֹם אֲשֶׁ֥ר יָנ֖וּס שָֽׁמָּ/ה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/013.yaml
  text: But if he did not lie in wait[a], and God caused it to come into his hand, then I will appoint for you a place to which he may flee.
translation:
  language: hi
  text: परन्तु यदि उसने घात नहीं लगाई थी और परमेश्वर ने ऐसा होने दिया कि वह उसके हाथ से मारा गया, तो मैं तेरे लिए एक स्थान ठहराऊँगा, जहाँ वह भागकर जा सके।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲשֶׁר
  choice: परन्तु यदि
  rationale: यह पिछले पद में जानबूझकर की गई हत्या के विपरीत परिस्थिति प्रस्तुत करता है; हिन्दी में सशर्त भाव स्पष्ट करना स्वाभाविक है।
- source_word: לֹא צָדָה
  choice: उसने घात नहीं लगाई थी
  rationale: कानूनी संदर्भ में צדה पूर्वनियोजित हत्या के लिए ताक लगाकर बैठने या घात लगाने को सूचित करता है।
- source_word: וְהָאֱלֹהִים
  choice: और परमेश्वर ने
  rationale: यहाँ אֱלֹהִים का अर्थ न्यायाधीशों की अपेक्षा परमेश्वर अधिक उपयुक्त है, क्योंकि वाक्य घटना को ईश्वरीय विधान के अंतर्गत प्रस्तुत करता है।
- source_word: אִנָּה לְיָדוֹ
  choice: ऐसा होने दिया कि वह उसके हाथ से मारा गया
  rationale: यह हिन्दी में दैवी सहभागिता और मनुष्य के माध्यम से अनचाहे घटित हुई मृत्यु—दोनों को व्यक्त करता है, बिना पूर्वनियोजित मंशा जोड़े।
- source_word: וְשַׂמְתִּי לְךָ מָקוֹם
  choice: तो मैं तेरे लिए एक स्थान ठहराऊँगा
  rationale: ठहराना किसी अधिकृत शरण-स्थान को निर्धारित करने का कानूनी भाव स्वाभाविक रूप से देता है।
- source_word: אֲשֶׁר יָנוּס שָׁמָּה
  choice: जहाँ वह भागकर जा सके
  rationale: יָנוּס शरण पाने के लिए भागने को और שָׁמָּה उस स्थान की ओर गति को व्यक्त करता है।
theological_decisions:
- issue: अनजाने में हुई हत्या में परमेश्वर की भूमिका
  choice: परमेश्वर ने ऐसा होने दिया कि वह उसके हाथ से मारा गया
  alternative: परमेश्वर ने उसे उसके हाथ में आने दिया
  rationale: चुना हुआ पाठ इब्रानी में विद्यमान दैवी विधान और मानवीय माध्यम की जटिलता बनाए रखता है, पर परमेश्वर पर हत्या की नैतिक दोषिता आरोपित नहीं करता। विकल्प अधिक शब्दशः है, पर आधुनिक हिन्दी में अस्पष्ट और अप्राकृतिक लग सकता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘तेरे’ का प्रयोग व्यवस्था-वचन में एकवचन सम्बोधन को बनाए रखता है।
