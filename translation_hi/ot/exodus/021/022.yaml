base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/022.yaml
  text: When men struggle together and strike a pregnant woman so that her children come out[a], but there is no harm, he shall surely be fined as the woman's husband imposes on him[c][b], and he shall pay according to the judges.
translation:
  language: hi
  text: जब पुरुष आपस में लड़ें और किसी गर्भवती स्त्री को चोट पहुँचा दें, जिससे उसके बच्चे बाहर निकल आएँ[a], पर कोई गंभीर हानि न हो[b], तो उस पुरुष पर अवश्य जुर्माना लगाया जाए—जितना उस स्त्री का पति उस पर ठहराए—और वह न्यायाधीशों के निर्णय के अनुसार भुगतान करे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “उसके बच्चे बाहर निकल आएँ।” इसका आशय समय से पहले जन्म हो सकता है; कुछ अनुवाद इसे “उसका गर्भपात हो जाए” समझते हैं।'
    reason: lexical_alternative
  - marker: b
    text: इब्रानी पद यह स्पष्ट नहीं करता कि गंभीर हानि स्त्री को, बच्चे को, या दोनों में से किसी को होने की बात है।
    reason: alternative_reading
  - marker: c
    text: या, “न्यायिक निर्णय के अनुसार” अथवा “अदालत के सामने।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: जब
  rationale: यह व्यवस्था के अंतर्गत एक संभावित मामले का परिचय देता है; आधुनिक हिन्दी में ‘जब’ सहज और विधिक प्रसंग के अनुकूल है।
- source_word: יִנָּצוּ אֲנָשִׁים
  choice: पुरुष आपस में लड़ें
  rationale: निप्अल क्रिया परस्पर शारीरिक संघर्ष का संकेत देती है, और אֲנָשִׁים यहाँ स्पष्ट रूप से पुरुषवाचक बहुवचन है।
- source_word: וְנָגְפוּ אִשָּׁה הָרָה
  choice: किसी गर्भवती स्त्री को चोट लग जाए
  rationale: क्रिया प्रहार लगने को व्यक्त करती है। बहुवचन कर्ता के बावजूद आगे दंडित व्यक्ति एकवचन है; हिन्दी का यह रूप घटना को स्वाभाविक ढंग से व्यक्त करता है और जानबूझकर प्रहार करने का अर्थ नहीं जोड़ता।
- source_word: וְיָצְאוּ יְלָדֶיהָ
  choice: जिससे उसके बच्चे बाहर आ जाएँ
  rationale: इब्रानी का निकट अर्थ ‘उसके बच्चे बाहर आ जाएँ’ है। इसे बनाए रखने से समयपूर्व जन्म और गर्भपात के बीच विवादित प्रश्न का निर्णय अनुवाद में नहीं थोपा जाता।
- source_word: אָסוֹן
  choice: गंभीर हानि
  rationale: यह शब्द विपत्ति या गंभीर क्षति का बोध कराता है। ‘गंभीर हानि’ इसे केवल मृत्यु तक सीमित नहीं करता और यह भी अनिर्णीत रखता है कि हानि माँ, बच्चे, या किसी भी संबंधित व्यक्ति को हुई हो सकती है।
- source_word: עָנוֹשׁ יֵעָנֵשׁ
  choice: अवश्य जुर्माना लगाया जाए
  rationale: धातु की पुनरुक्ति दंड की निश्चितता पर बल देती है; बाद के आर्थिक भुगतान-संदर्भ में ‘जुर्माना’ उपयुक्त है।
- source_word: כַּאֲשֶׁר יָשִׁית עָלָיו בַּעַל הָאִשָּׁה
  choice: जितना उस स्त्री का पति उससे माँगे
  rationale: मुहावरे का अर्थ दंड की राशि निर्धारित या आरोपित करना है। ‘माँगे’ हिन्दी में सहज है, जबकि अगला न्यायिक वाक्यांश बताता है कि भुगतान अदालत के अधीन है।
- source_word: וְנָתַן בִּפְלִלִים
  choice: वह न्यायाधीशों के निर्णय के अनुसार भुगतान करे
  rationale: विधिक-आर्थिक संदर्भ में וְנָתַן का अर्थ भुगतान करना है। בִּפְלִלִים दुर्लभ पद है और न्यायाधीशों अथवा न्यायिक निर्णय की ओर संकेत करता है; मुख्य पाठ दोनों को स्वाभाविक रूप से जोड़ता है।
theological_decisions:
- issue: गर्भवती स्त्री और उसके बच्चे से संबंधित क्षति की व्याख्या
  choice: मूल के निकट ‘उसके बच्चे बाहर आ जाएँ’ रखा गया और אָסוֹן को ‘गंभीर हानि’ कहा गया, बिना यह निश्चित किए कि परिणाम गर्भपात है या समयपूर्व जन्म, अथवा हानि किसे होती है।
  alternative: ‘उसका गर्भपात हो जाए’; अथवा ‘स्त्री को कोई हानि न हो’; अथवा हानि को माँ और बच्चे दोनों पर स्पष्ट रूप से लागू करना।
  rationale: इब्रानी वाक्य इन प्रश्नों को स्पष्ट रूप से हल नहीं करता। मुख्य पाठ को अधिक विशिष्ट बनाना वास्तविक भाषिक और धर्मवैचारिक तनाव को अनुवाद में समय से पहले सुलझा देता।
- issue: पति द्वारा माँगी गई राशि और न्यायिक नियंत्रण का संबंध
  choice: पति की माँग और न्यायाधीशों के निर्णय दोनों को अलग-अलग बनाए रखा गया है।
  alternative: राशि को केवल पति द्वारा निर्धारित बताना, या केवल अदालत द्वारा निर्धारित बताना।
  rationale: दोनों इब्रानी वाक्यांश पाठ में उपस्थित हैं; अनुवाद किसी एक को हटाकर विधिक प्रक्रिया को सरल नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। विधिक स्वर के लिए ‘अवश्य जुर्माना’, ‘निर्णय’ और ‘भुगतान’ जैसे वर्तमान मानक शब्द प्रयुक्त हैं। विवादित प्रसूति-संबंधी अभिव्यक्ति को मुख्य पाठ में मूल के निकट रखा गया है और आवश्यक विकल्प पादटिप्पणियों में दिए गए हैं।
