  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दया-आसन।”
    reason: הַכַּפֹּרֶת के लिए पारंपरिक धार्मिक पद को वैकल्पिक अनुवाद के रूप में सुरक्षित रखना।
lexical_decisions:
- source_word: הָאָרֹן
  choice: सन्दूक
  rationale: मिलापवाले तम्बू के प्रसंग में यह पवित्र सन्दूक को सूचित करता है। हिन्दी में ‘सन्दूक’ वस्तु के वास्तविक रूप को सहज और स्पष्ट ढंग से व्यक्त करता है।
- source_word: בַּדָּיו
  choice: उसके डंडे
  rationale: यह पवित्र साज-सामान को उठाकर ले जाने के लिए लगाए गए डंडों को सूचित करता है; ‘डंडे’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: הַכַּפֹּרֶת
  choice: प्रायश्चित्त-आवरण
  rationale: यह सन्दूक के सोने के आवरण का नाम है और प्रायश्चित्त से जुड़े उसके धार्मिक महत्त्व को भी बनाए रखता है। ‘आवरण’ उसके भौतिक स्वरूप को और ‘प्रायश्चित्त’ उसके उपासना-संबंधी कार्य को व्यक्त करता है।
- source_word: פָּרֹכֶת
  choice: परदा
  rationale: यह तम्बू के भीतर भागों को अलग करनेवाले लटकते परदे को सूचित करता है। ‘परदा’ सामान्य आधुनिक हिन्दी में सहज है और उसके विभाजक कार्य को व्यक्त करता है।
- source_word: הַמָּסָךְ
  choice: ओट
  rationale: यह आड़ या स्क्रीन का भाव देता है। ‘ओट का परदा’ दोनों इब्रानी संज्ञाओं को बनाए रखते हुए उनके संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֶת / וְאֶת
  choice: प्रत्यक्ष कर्म-चिह्नों का अलग अनुवाद नहीं
  rationale: ये निश्चित प्रत्यक्ष कर्म को चिह्नित करते हैं; हिन्दी में सूची, विराम-चिह्न और ‘और’ इनके वाक्यगत कार्य को पर्याप्त रूप से व्यक्त करते हैं।
theological_decisions:
- issue: उपासना-संबंधी प्रसंग में הַכַּפֹּרֶת का अनुवाद
  choice: प्रायश्चित्त-आवरण
  alternative: दया-आसन
  rationale: इब्रानी शब्द सन्दूक के आवरण को नाम देता है और प्रायश्चित्त से जुड़ा अर्थ रखता है। मुख्य पाठ में ‘प्रायश्चित्त-आवरण’ भौतिक वस्तु और धार्मिक संबंध दोनों को स्पष्ट रखता है; पारंपरिक वैकल्पिक समझ ‘दया-आसन’ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। पद एक बड़ी सूची का अंश है, इसलिए अंत में अर्धविराम रखा गया है। ‘ओट का परदा’ construct संबंध को व्यक्त करता है और किसी अतिरिक्त प्रयोजन का अर्थ नहीं जोड़ता।
