base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/028.yaml
  text: the balsam and the oil for the light[a], and for the anointing oil and for the incense of spices[b],
translation:
  language: hi
  text: और सुगंध-द्रव्य[a] तथा तेल—रोशनी के लिए, अभिषेक के तेल के लिए और सुगंध-द्रव्यों की धूप[b] के लिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सुगंधित मसाला’ अथवा ‘सुगंधित पदार्थ’।
    reason: lexical_alternative
  - marker: b
    text: या ‘सुगंधित धूप’।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבֹּשֶׂם
  choice: सुगंध-द्रव्य
  rationale: यह शब्द किसी सुगंधित पदार्थ, मसाले या सुगंधित गोंद/तेल को सूचित कर सकता है। प्रसंग में तंबू के लिए लाई गई सामग्री की सूची है; इसलिए व्यापक किंतु ठोस अर्थ वाला ‘सुगंध-द्रव्य’ उपयुक्त है।
- source_word: הַשָּׁמֶן
  choice: तेल
  rationale: इब्रानी में सामान्य रूप से तेल कहा गया है; यहाँ ‘जैतून का तेल’ जोड़ना मूल पाठ से अधिक विशिष्ट होता।
- source_word: לְמָאוֹר
  choice: रोशनी के लिए
  rationale: מָאוֹר प्रकाश या प्रकाश देने वाली वस्तु को सूचित कर सकता है। यहाँ तेल के उपयोग का आशय है, इसलिए ‘रोशनी के लिए’ निकट और स्वाभाविक है तथा किसी एक दीपक को अनावश्यक रूप से निर्दिष्ट नहीं करता।
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: अभिषेक का तेल
  rationale: यह पवित्र अभिषेक में प्रयुक्त तेल के लिए प्रचलित और स्पष्ट हिन्दी पदबंध है।
- source_word: קְטֹרֶת הַסַּמִּים
  choice: सुगंध-द्रव्यों की धूप
  rationale: यह अनुवाद קְטֹרֶת ‘धूप’ और סַמִּים ‘सुगंध-द्रव्य’ दोनों संज्ञाओं को व्यक्त करता है और इब्रानी संबंध-रचना को बनाए रखता है।
- source_word: וְאֶת ... וְאֶת ... וּלְ ... וְלִ
  choice: और ... तथा ... के लिए ... के लिए ... और ... के लिए
  rationale: दोहराए गए संयोजकों और संबंधबोधकों को हिन्दी की स्वाभाविक सूची-रचना में यथासंभव बनाए रखा गया है।
theological_decisions:
- issue: सुगंध-द्रव्य और तेल का बाद में बताए गए तीन उपयोगों से संबंध
  choice: विराम-चिह्न के द्वारा दोनों सामग्रियों को सूचीबद्ध करके उपयोगों को उनके बाद रखा गया है
  alternative: हर उपयोग को केवल निकटतम संज्ञा ‘तेल’ से जोड़ना, या स्पष्ट करना कि कौन-सी सामग्री किस उपयोग के लिए थी
  rationale: इब्रानी वाक्य-विन्यास इन सामग्रियों और उपयोगों की सूची देता है, पर प्रत्येक सामग्री को किसी एक उपयोग से स्पष्ट रूप से नहीं बाँधता। अनुवाद इस संभावित अस्पष्टता को व्याख्यात्मक जोड़ से हल नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली रखी गई है। ‘सुगंध-द्रव्य’ धार्मिक सामग्री की सूची में सटीक है, जबकि पादटिप्पणियाँ संभावित सरल विकल्प बताती हैं। मुख्य पाठ के सभी पादटिप्पणी-चिह्न [a], [b] रूप में उपस्थित हैं।
