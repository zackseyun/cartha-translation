- source_word: וְכָל הַנָּשִׁים
  choice: और जिन सब स्त्रियों
  rationale: כָּל के साथ बहुवचन संज्ञा का सामूहिक अर्थ है; संबंधवाचक उपवाक्य के कारण हिन्दी में ‘जिन सब स्त्रियों’ स्वाभाविक है।
- source_word: אֲשֶׁר נָשָׂא לִבָּן אֹתָנָה
  choice: जिनके मन ने उन्हें … प्रेरित किया
  rationale: ‘मन का किसी को उठा देना’ यहाँ आंतरिक तत्परता और प्रेरणा का इब्रानी मुहावरा है; ‘प्रेरित किया’ उसका स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: בְּחָכְמָה
  choice: कौशलपूर्वक काम करने को
  rationale: पवित्र निवास के निर्माण-संदर्भ में חָכְמָה अमूर्त बुद्धि से अधिक व्यावहारिक कारीगरी-कौशल को दर्शाता है।
- source_word: טָווּ
  choice: काते
  rationale: यह क्रिया रेशे से सूत कातने के लिए प्रयुक्त है; हिन्दी में ‘काते’ सटीक और सहज है।
- source_word: אֶת הָעִזִּים
  choice: बकरियों के बाल
  rationale: शाब्दिक रूप से ‘बकरियाँ’ है, पर वस्त्र-निर्माण के संदर्भ में यह कातने योग्य बकरी के बालों के लिए लोपयुक्त अभिव्यक्ति है; निहित संज्ञा स्पष्ट करने से जीवित बकरियों को कातने जैसी भ्रामक धारणा नहीं बनती।
