  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। वंशक्रम की अस्पष्टता से बचने के लिए हिन्दी में संबंधों का क्रम ‘हूर के पुत्र ऊरी के पुत्र बसलेल’ रखा गया है।
