- source_word: קָרָא ... בְּשֵׁם
  choice: नाम लेकर बुलाया है
  rationale: यह चयन और विशिष्ट बुलाहट का भाव रखने वाली इब्रानी अभिव्यक्ति को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יְהוָה
  choice: यहवे
  rationale: उपाधि से प्रतिस्थापित करने के बजाय परमेश्वर के व्यक्तिगत नाम का हिन्दी लिप्यंतरण।
- source_word: בְּצַלְאֵל
  choice: बसलेल
  rationale: इब्रानी नाम का प्रचलित और स्रोत-संगत हिन्दी लिप्यंतरण।
- source_word: בֶּן אוּרִי בֶן חוּר
  choice: हूर के पुत्र ऊरी के पुत्र
  rationale: 'इब्रानी वंशावली-शृंखला को स्पष्ट हिन्दी क्रम में व्यक्त करता है: बसलेल ऊरी का पुत्र और हूर का पौत्र है।'
- source_word: לְמַטֵּה יְהוּדָה
  choice: यहूदा के गोत्र के
  rationale: बसलेल की गोत्रीय संबद्धता को स्वाभाविक हिन्दी में बताता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: पद में चतुरक्षरी व्यक्तिगत नाम सीधे आया है; ‘यहवे’ उसे उपाधि से बदले बिना प्रस्तुत करता है।
- issue: בְּנֵי יִשְׂרָאֵל का लिंग और सामूहिक अर्थ
  choice: इस्राएल के पुत्रों
  alternative: इस्राएलियों; इस्राएल की सन्तानों
  rationale: मुख्य पाठ मूल के पुल्लिंग पारिवारिक रूप को सुरक्षित रखता है, यद्यपि प्रसंग में यह इस्राएली समुदाय के लिए सामूहिक पद है।
