  text: Then Moses said to the sons of Israel[a], “See, Yahweh has called by name Bezalel son of Uri, son of Hur, of the tribe of Judah.”
translation:
  language: hi
  text: तब मूसा ने इस्राएल के पुत्रों[a] से कहा, “देखो, यहवे ने बसलेल को, जो ऊरी का पुत्र और हूर का पौत्र है, यहूदा के गोत्र से नाम लेकर बुलाया है।”
  philosophy: optimal-equivalence
  footnotes:
