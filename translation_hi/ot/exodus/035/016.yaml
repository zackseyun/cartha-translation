lexical_decisions:
- source_word: מִזְבַּח הָעֹלָה
  choice: होमबलि की वेदी
  rationale: यह रचना उस विशिष्ट वेदी को बताती है जिस पर पूरी तरह जलाई जाने वाली बलि चढ़ाई जाती थी। ‘होमबलि की वेदी’ प्रचलित, संक्षिप्त और अर्थपूर्ण हिन्दी है।
- source_word: מִכְבַּר הַנְּחֹשֶׁת
  choice: काँसे की जाली
  rationale: מִכְבָּר वेदी से संबंधित जालीदार धातु-संरचना है। ‘जाली’ आधुनिक हिन्दी में स्वाभाविक है और उसके स्वरूप को अनावश्यक रूप से अधिक निश्चित नहीं करती।
- source_word: אֲשֶׁר לוֹ
  choice: उससे जुड़ी
  rationale: इब्रानी पद संबंध अथवा स्वामित्व बताता है, पर ठीक भौतिक स्थिति निर्दिष्ट नहीं करता। ‘उससे जुड़ी’ इस संबंध को सहज हिन्दी में बनाए रखता है।
- source_word: בַּדָּיו
  choice: उसके डंडे
  rationale: ये पवित्र वस्तुओं को उठाकर ले जाने के लिए प्रयुक्त लंबे डंडे हैं। ‘डंडे’ सरल और वर्तमान हिन्दी है; उनका वहन-संबंध प्रसंग से स्पष्ट है।
- source_word: כָּל כֵּלָיו
  choice: उसके सारे उपकरण
  rationale: כֵּלִים यहाँ वेदी से संबंधित विविध सामान को समेटने वाला व्यापक शब्द है। ‘उपकरण’ इस व्यापकता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַכִּיֹּר
  choice: हौद
  rationale: यह मिलापवाले तंबू के आँगन में धुलाई के लिए रखा बड़ा पात्र था। ‘हौद’ सामान्य ‘कटोरे’ की अपेक्षा उसके आकार और कार्य को बेहतर दिखाता है।
- source_word: כַּנּוֹ
  choice: उसका आधार
  rationale: כֵּן पात्र को थामने वाले आधार अथवा चौकी को दर्शाता है। ‘आधार’ अर्थ को स्पष्ट रखता है और ‘चौकी’ से कम रूप-विशिष्ट है।
