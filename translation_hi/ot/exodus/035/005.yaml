id: EXO.35.5
reference: Exodus 35:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: קְח֨וּ מֵֽ/אִתְּ/כֶ֤ם תְּרוּמָה֙ לַֽ/יהוָ֔ה כֹּ֚ל נְדִ֣יב לִבּ֔/וֹ יְבִיאֶ֕/הָ אֵ֖ת תְּרוּמַ֣ת יְהוָ֑ה זָהָ֥ב וָ/כֶ֖סֶף וּ/נְחֹֽשֶׁת׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/005.yaml
  text: 'Take from among you an offering for Yahweh[a]. Everyone whose heart is willing shall bring it—Yahweh’s offering: gold, silver[b], and bronze.'
translation:
  language: hi
  text: “तुम अपने बीच से याहवे[a] के लिए भेंट लो। हर वह व्यक्ति, जिसका मन स्वेच्छा से देने को तैयार हो, याहवे की भेंट ले आए—सोना, चाँदी और काँसा[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘याहवे’ इब्रानी में परमेश्वर का व्यक्तिगत नाम יהוה है।
    reason: divine_name
  - marker: b
    text: या ‘ताँबा’। इब्रानी शब्द ताँबे अथवा ताँबा-मिश्रित काँसे के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: קְחוּ מֵאִתְּכֶם
  choice: तुम अपने बीच से ... लो
  rationale: बहुवचन आज्ञा और समुदाय के भीतर से भेंट लेने के स्रोत—दोनों को स्पष्ट रखता है।
- source_word: תְּרוּמָה
  choice: भेंट
  rationale: इस प्रसंग में पवित्र कार्य के लिए अलग रखा गया स्वैच्छिक अंशदान अभिप्रेत है; ‘भेंट’ सामान्य पाठक के लिए स्वाभाविक और पर्याप्त व्यापक है।
- source_word: לַיהוָה / יְהוָה
  choice: याहवे के लिए / याहवे की
  rationale: इब्रानी पाठ में आए परमेश्वर के व्यक्तिगत वाचा-नाम को नाम के रूप में सुरक्षित रखा गया है; ל समर्पण या उद्देश्य प्रकट करता है।
- source_word: כֹּל נְדִיב לִבּוֹ
  choice: हर वह व्यक्ति, जिसका मन स्वेच्छा से देने को तैयार हो
  rationale: इब्रानी हृदय-संबंधी मुहावरे का आशय भीतर की स्वैच्छिक तत्परता है। हिंदी में यह रूप स्वाभाविक है और किसी बाध्यता का भाव नहीं जोड़ता।
- source_word: יְבִיאֶהָ
  choice: ले आए
  rationale: हिफ़ील अपूर्ण रूप अपेक्षित कार्य बताता है; स्त्रीलिंग प्रत्यय पहले आई ‘भेंट’ की ओर संकेत करता है। हिंदी में संज्ञा को दोहराने से संदर्भ स्पष्ट रहता है।
- source_word: זָהָב וָכֶסֶף וּנְחֹשֶׁת
  choice: सोना, चाँदी और काँसा
  rationale: सूची को सामान्य आधुनिक हिंदी धातु-नामों में रखा गया है। נְחֹשֶׁת प्राचीन संदर्भ में ताँबा या ताँबा-मिश्रित काँसा सूचित कर सकता है, इसलिए विकल्प पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। ‘याहवे’ नाम को उपाधि में बदलने के बजाय उसकी पहचान बनाए रखता है।
- issue: स्वैच्छिक भेंट और आज्ञा के बीच संबंध
  choice: आज्ञा समुदाय को भेंट लेने की है; देने वाला वही है जिसका मन स्वेच्छा से तैयार हो
  alternative: हर व्यक्ति के लिए अनिवार्य दान
  rationale: כֹּל נְדִיב לִבּוֹ दाता की भीतरी स्वैच्छिक तत्परता पर बल देता है; इसलिए अनिवार्यता का भाव नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिंदी, संबोधन के लिए स्वाभाविक बहुवचन ‘तुम’, और सार्वजनिक पाठ के योग्य गरिमापूर्ण शैली। ‘स्वेच्छा से देने को तैयार’ स्वैच्छिक आंतरिक भाव को स्पष्ट करता है, जबकि ‘भेंट लो’ मूल आज्ञा की सीधाई बनाए रखता है।
