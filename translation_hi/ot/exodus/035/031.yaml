base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/031.yaml
  text: and he filled him with the Spirit of God[a], with wisdom, with understanding, and with knowledge[b], and with every kind of craftsmanship.
translation:
  language: hi
  text: और उसने उसे परमेश्वर की आत्मा[a] से, बुद्धि, समझ और ज्ञान से, तथा हर प्रकार की कारीगरी[b] से भर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दैवी आत्मा।” इब्रानी वाक्यांश को अधिक सामान्य अर्थ में भी समझा जा सकता है, पर यहाँ संभवतः परमेश्वर की अपनी सामर्थ्य देनेवाली आत्मा अभिप्रेत है।
    reason: alternative_reading
  - marker: b
    text: या “हर काम में” अथवा “हर शिल्प में।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַלֵּא
  choice: और उसने भर दिया
  rationale: पिइएल कथात्मक क्रिया को भूतकाल में रखा गया है; कर्ता पिछले पद से परमेश्वर है।
- source_word: אֹתוֹ
  choice: उसे
  rationale: कर्मवाचक सर्वनाम पिछले संदर्भ के बसलेल की ओर संकेत करता है।
- source_word: רוּחַ אֱלֹהִים
  choice: परमेश्वर की आत्मा
  rationale: इस प्रसंग में यह वाक्यांश पवित्र सेवा के लिए परमेश्वर द्वारा सामर्थ्य दिए जाने को व्यक्त करता है; फिर भी इब्रानी की व्यापक संभावनाएँ पादटिप्पणी में सुरक्षित हैं।
- source_word: בְּחָכְמָה
  choice: बुद्धि से
  rationale: חָכְמָה यहाँ परमेश्वर-प्रदत्त विवेक और कार्य-कौशल की क्षमता को दर्शाता है।
- source_word: בִּתְבוּנָה
  choice: समझ से
  rationale: תְבוּנָה का सामान्य अर्थ समझ या सूझ-बूझ है; यह निकटवर्ती त्रयी को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: וּבְדַעַת
  choice: और ज्ञान से
  rationale: דַּעַת का मूल अर्थ ‘ज्ञान’ है; शिल्प के प्रसंग के कारण इसे केवल तकनीकी कौशल तक सीमित नहीं किया गया।
- source_word: וּבְכָל מְלָאכָה
  choice: और हर प्रकार की कारीगरी की कुशलता से
  rationale: מְלָאכָה सामान्यतः काम भी हो सकता है, पर तंबू के निर्माण के प्रसंग में कारीगरी अभिप्रेत है। हिंदी में ‘कुशलता’ जोड़ने से ‘से भर दिया’ के साथ वाक्य स्वाभाविक बनता है।
theological_decisions:
- issue: רוּחַ אֱלֹהִים को व्यक्तिगत अर्थ में ‘परमेश्वर की आत्मा’ मानना या अधिक सामान्य अर्थ में लेना
  choice: परमेश्वर की आत्मा
  alternative: परमेश्वर का आत्मा/दैवी आत्मा
  rationale: तात्कालिक प्रसंग पवित्र कार्य के लिए परमेश्वर द्वारा सामर्थ्य दिए जाने का है, इसलिए ‘परमेश्वर की आत्मा’ सर्वाधिक स्वाभाविक है। इब्रानी में लेख न होने और अधिक सामान्य अर्थ की संभावना को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज, गरिमापूर्ण रूप अपनाया गया है। ‘बुद्धि, समझ और ज्ञान’ की त्रयी को अलग रखा गया है, और शिल्प-संबंधी प्रसंग स्पष्ट करने के लिए ‘कारीगरी की कुशलता’ प्रयोग किया गया है।
