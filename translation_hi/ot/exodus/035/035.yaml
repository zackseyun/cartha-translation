base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/035.yaml
  text: He has filled them with wisdom of heart to do every kind of work of an engraver[a], a designer, and an embroiderer in blue, in purple, in scarlet yarn, and in fine linen[c][b], and of a weaver—makers of every kind of work and designers of designs.
translation:
  language: hi
  text: उसने उन्हें हृदय की बुद्धि[b] से भर दिया है, ताकि वे हर प्रकार की कारीगरी कर सकें—शिल्पकार[a], नमूने बनाने वाले, नीले, बैंगनी और लाल रंग के सूत तथा बारीक सन के कपड़े में कढ़ाई करने वाले, और बुनकर—हर प्रकार का काम करने वाले और योजनाएँ बनाने वाले।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘शिल्पकार’ का अर्थ अधिक विशिष्ट रूप में ‘नक्काश’ भी हो सकता है; इब्रानी शब्द कुशल कारीगर के व्यापक अर्थ में भी प्रयुक्त होता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘हृदय की बुद्धि’; यह इब्रानी मुहावरा भीतर से उत्पन्न कौशल, समझ और विवेक का संकेत देता है।
    reason: cultural_note
  - marker: c
    text: ‘योजनाएँ बनाने वाले’ के लिए इब्रानी में एक ही मूल से बने शब्दों की पुनरुक्ति है, जो कलात्मक अभिकल्प बनाने के भाव पर बल देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלֵּא אֹתָם
  choice: उसने ... भर दिया है
  rationale: पिएल क्रिया का मूल अर्थ ‘भर देना’ है; निकट संदर्भ में कर्ता यहोवा है और पूर्ण क्रिया उसके किए हुए कार्य को बताती है।
- source_word: חָכְמַת לֵב
  choice: हृदय को ऐसी बुद्धि
  rationale: हिब्रू के ‘हृदय की बुद्धि’ मुहावरे को स्वाभाविक हिन्दी में रखते हुए आंतरिक कौशल, समझ और विवेक का संयुक्त भाव बचाया गया है।
- source_word: כָּל מְלֶאכֶת
  choice: हर प्रकार की कारीगरी
  rationale: מְלָאכָה यहाँ कुशल शिल्प-कार्य को सूचित करता है; ‘कारीगरी’ सूची के संदर्भ में ‘काम’ से अधिक सटीक है।
- source_word: חָרָשׁ
  choice: नक्काशी करने वाला
  rationale: शब्द व्यापक रूप से कुशल कारीगर भी हो सकता है, पर तम्बू के शिल्प-संदर्भ और साथ की विशिष्ट कलाओं के कारण ‘नक्काशी करने वाला’ उपयुक्त है।
- source_word: חֹשֵׁב
  choice: नमूने बनाने वाला
  rationale: शिल्प-संदर्भ में यह कलात्मक आकृति या नमूना गढ़ने वाले व्यक्ति को दर्शाता है।
- source_word: רֹקֵם
  choice: कढ़ाई करने वाला
  rationale: वस्त्र-कला में सजावटी सुई-काम का स्वाभाविक आधुनिक हिन्दी पद।
- source_word: תְּכֵלֶת וְאַרְגָּמָן בְּתוֹלַעַת הַשָּׁנִי
  choice: नीले, बैंगनी और लाल रंग का सूत
  rationale: तीनों बहुमूल्य रंगी हुई वस्त्र-सामग्रियों का संकेत स्पष्ट किया गया है; यहाँ रंगों का संबंध कढ़ाई की सामग्री से है।
- source_word: שֵׁשׁ
  choice: बारीक मलमल
  rationale: तम्बू के संदर्भ में यह महीन सन-वस्त्र है; ‘बारीक मलमल’ सामान्य हिन्दी पाठक के लिए उसके महीन वस्त्र-स्वरूप को सहज रूप से व्यक्त करता है।
- source_word: אֹרֵג
  choice: बुनकर
  rationale: संज्ञात्मक कृदंत का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: עֹשֵׂי כָּל מְלָאכָה
  choice: हर प्रकार का काम करने वाले
  rationale: עשה की व्यापक क्रियात्मकता को रखा गया है और पहले आए ‘हर प्रकार की कारीगरी’ की समग्रता भी बनी रहती है।
- source_word: חֹשְׁבֵי מַחֲשָׁבֹת
  choice: कलात्मक नमूने सोचने वाले
  rationale: हिब्रू की सजातीय पुनरुक्ति को हिन्दी में कृत्रिम दोहराव के बिना रचनात्मक योजना और कलात्मक अभिकल्प का भाव दिया गया है।
theological_decisions:
- issue: मִלֵּא का निहित कर्ता
  choice: ‘उसने’ के द्वारा पिछले संदर्भ से परमेश्वर को निहित रहने दिया गया
  alternative: स्पष्ट रूप से ‘यहोवा ने’ जोड़ना
  rationale: मसोराई पाठ में इस पद पर नाम दोहराया नहीं गया; सर्वनाम मूल की वाक्यगत निरंतरता और अस्पष्टता को बनाए रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिन्दी। शिल्प-सूची की समानांतर संरचना और पद के समापन में काम करने तथा योजना रचने—दोनों पक्षों को सुरक्षित रखा गया है।
