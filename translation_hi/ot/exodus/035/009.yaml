    reason: lexical_alternative
lexical_decisions:
- source_word: אַבְנֵי שֹׁהַם
  choice: सुलेमानी पत्थर
  rationale: שֹׁהַם किसी बहुमूल्य पत्थर का नाम है, जिसकी सटीक पहचान अनिश्चित है। हिन्दी बाइबलीय परंपरा में ‘सुलेमानी पत्थर’ जाना-पहचाना और स्वाभाविक रूप है; अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: אַבְנֵי מִלֻּאִים
  choice: जड़ने के लिए रत्न
  rationale: מִלֻּאִים यहाँ याजकीय वस्त्रों में जड़े या बैठाए जाने वाले पत्थरों को सूचित करता है। ‘जड़ने के लिए रत्न’ कार्यात्मक अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: לָאֵפֹד
  choice: एपोद
  rationale: אֵפֹד याजकीय परिधान का विशिष्ट पारिभाषिक नाम है; अर्थ का अनुमान लगाकर सामान्य परिधान-शब्द देने के बजाय लिप्यंतरण इसकी सांस्कृतिक विशिष्टता बनाए रखता है।
- source_word: וְלַחֹשֶׁן
  choice: सीने का पट्टा
  rationale: חֹשֶׁן महायाजक के सीने पर पहनी जाने वाली रत्न-जड़ित वस्तु है। ‘सीने का पट्टा’ इसे सैनिक कवच मानने से बचाता और साधारण पाठक के लिए रूप स्पष्ट करता है।
