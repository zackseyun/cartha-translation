  text: וַ/יָּבֹ֕אוּ כָּל אִ֖ישׁ אֲשֶׁר נְשָׂא֣/וֹ לִבּ֑/וֹ וְ/כֹ֡ל אֲשֶׁר֩ נָדְבָ֨ה רוּח֜/וֹ אֹת֗/וֹ הֵ֠בִיאוּ אֶת תְּרוּמַ֨ת יְהוָ֜ה לִ/מְלֶ֨אכֶת אֹ֤הֶל מוֹעֵד֙ וּ/לְ/כָל עֲבֹ֣דָת֔/וֹ וּ/לְ/בִגְדֵ֖י הַ/קֹּֽדֶשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/021.yaml
  text: And everyone came whose heart stirred him[a], and everyone whose spirit moved him willingly brought Yahweh’s contribution for the work of the tent of meeting, for all its service[b], and for the holy garments.
translation:
  language: hi
  text: और हर वह व्यक्ति आया जिसके हृदय ने उसे प्रेरित किया, और हर वह व्यक्ति जिसकी आत्मा ने उसे स्वेच्छा से देने को उभारा[a]। वे मिलाप के तंबू के काम, उसकी सारी सेवा और पवित्र वस्त्रों के लिए याहवे के लिए भेंट[b] लाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “जिसके हृदय ने उसे उठा दिया” और “जिसकी आत्मा ने उसे स्वेच्छुक बनाया।” ये इब्रानी मुहावरे भीतर की प्रेरणा और स्वेच्छापूर्ण उदारता व्यक्त करते हैं।
    reason: lexical_alternative
  - marker: b
    text: या “याहवे की भेंट।” इब्रानी वाक्यांश भेंट के याहवे को समर्पित होने या उससे सम्बद्ध होने—दोनों का भाव दे सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹאוּ כָּל אִישׁ
  choice: और हर वह व्यक्ति आया
  rationale: בוא का सामान्य अर्थ ‘आना’ है। एकवचन ‘हर वह व्यक्ति’ इब्रानी के वितरणात्मक भाव को बनाए रखता है और आगे आए बहुवचन कर्ता से स्वाभाविक रूप से जुड़ता है।
- source_word: אֲשֶׁר נְשָׂאוֹ לִבּוֹ
  choice: जिसके हृदय ने उसे प्रेरित किया
  rationale: शाब्दिक बिंब ‘उसके हृदय ने उसे उठाया’ है, पर आधुनिक हिन्दी में वह भ्रामक होगा। ‘प्रेरित किया’ भीतर से उठी तत्परता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְכֹל אֲשֶׁר נָדְבָה רוּחוֹ אֹתוֹ
  choice: और हर वह व्यक्ति जिसकी आत्मा ने उसे स्वेच्छा से देने को उभारा
  rationale: נדב स्वेच्छा और उदार तत्परता, दोनों का भाव रखता है। ‘स्वेच्छा से देने को उभारा’ आंतरिक प्रेरणा तथा ऐच्छिक दान को स्पष्ट रखता है।
- source_word: הֵבִיאוּ
  choice: वे ... लाए
  rationale: बहुवचन क्रिया को स्पष्ट हिन्दी वाक्य में ‘वे ... लाए’ के रूप में रखा गया है।
- source_word: תְּרוּמַת יְהוָה
  choice: याहवे के लिए भेंट
  rationale: תְּרוּמָה यहाँ निर्माण-सामग्री के रूप में अलग रखी गई भेंट या अंशदान है। सम्बन्धकारक वाक्यांश को उद्देश्यसूचक ‘याहवे के लिए’ कहना इस प्रसंग में स्वाभाविक है, जबकि वैकल्पिक सम्बन्ध फुटनोट में सुरक्षित है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी लिपि में ‘याहवे’ लिखा गया है।
- source_word: לִמְלֶאכֶת אֹהֶל מוֹעֵד
  choice: मिलापवाले तंबू के निर्माण के लिए
  rationale: מְלָאכָה व्यापक रूप से काम या कारीगरी है; यहाँ दान की गई सामग्री तंबू बनाने के काम के लिए है, इसलिए ‘निर्माण’ प्रसंगानुकूल और स्पष्ट है। אֹהֶל מוֹעֵד का प्रचलित हिन्दी रूप ‘मिलापवाला तंबू’ रखा गया है।
- source_word: וּלְכָל עֲבֹדָתוֹ
  choice: उसकी सारी सेवा के लिए
  rationale: עֲבֹדָה तंबू से जुड़ी सेवा, कार्य और धार्मिक कर्तव्यों को समेटता है। ‘सेवा’ उसके उपासना-संबंधी प्रयोग को बनाए रखता है।
- source_word: וּלְבִגְדֵי הַקֹּדֶשׁ
  choice: और पवित्र वस्त्रों के लिए
  rationale: यह वाक्यांश अभिषिक्त याजकीय वस्त्रों को दर्शाता है। ‘पवित्र वस्त्र’ सटीक, प्रतिष्ठित और सहज हिन्दी है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसका लिप्यंतरण करता है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: תְּרוּמַת יְהוָה में सम्बन्धकारक का अर्थ
  choice: याहवे के लिए भेंट
  alternative: याहवे की भेंट
  rationale: इब्रानी रचना स्वामित्व, सम्बन्ध या समर्पण का भाव दे सकती है। इस दान-संग्रह के प्रसंग में उद्देश्य/समर्पण का भाव मुख्य पाठ में स्वाभाविक है; ‘याहवे की भेंट’ की सम्भावना फुटनोट में रखी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज किंतु गरिमापूर्ण रखी गई है। ‘हृदय’ और ‘आत्मा’ के समानांतर आंतरिक संकेतों को बचाया गया है; लंबे इब्रानी वाक्य को पठनीयता के लिए दो हिन्दी वाक्यों में बाँटा गया है।
