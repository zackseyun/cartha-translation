- source_word: עִזִּים
  choice: बकरियों के बाल
  rationale: इब्रानी में शाब्दिक रूप से 'बकरियाँ' है, पर सामग्री की इस सूची में आशय पवित्र निवास के आवरण बुनने के लिए प्रयुक्त बकरियों के बाल से है।
- source_word: וְ
