  text: 'And every woman wise of heart spun with her hands[a], and they brought what they had spun: the blue, the purple, the scarlet yarn[b], and the fine linen.'
translation:
  language: hi
  text: और हर वह स्त्री जो हृदय से बुद्धिमान थी[a], उसने अपने हाथों से सूत काता; और वे अपना काता हुआ—नीले, बैंगनी और लाल रंग का सूत तथा महीन सन का सूत—ले आईं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “हृदय से बुद्धिमान”; यह इब्रानी मुहावरा भीतरी बुद्धि से उपजी व्यावहारिक कुशलता को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חַכְמַת לֵב
  choice: हृदय से बुद्धिमान
  rationale: इब्रानी मुहावरे में भीतरी बुद्धि और व्यावहारिक कुशलता दोनों जुड़े हैं। यह रूप हृदय की छवि बनाए रखता है; अर्थ स्पष्ट करने के लिए पादटिप्पणी दी गई है।
- source_word: בְּיָדֶיהָ
  choice: अपने हाथों से
  rationale: करणवाचक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है और हस्तकौशल पर बल बनाए रखता है।
- source_word: טָווּ
  choice: सूत काता
  rationale: क्रिया रेशे से धागा या सूत बनाने को दर्शाती है; प्रसंग में 'सूत काता' स्पष्ट और स्वाभाविक है।
- source_word: וַיָּבִיאוּ
  choice: ले आईं
  rationale: बहुवचन स्त्रीलिंग क्रिया सामूहिक रूप से उन स्त्रियों की ओर संकेत करती है और इब्रानी के एकवचन-वितरणात्मक से बहुवचन-सामूहिक बदलाव को दर्शाती है।
- source_word: מַטְוֶה
  choice: अपना काता हुआ
  rationale: संज्ञा काती हुई सामग्री या सूत को दर्शाती है। हिन्दी में इसे आगे आने वाली सामग्री-सूची के साथ विशेषणात्मक रूप देना सहज है।
- source_word: תְּכֵלֶת
  choice: नीला
  rationale: मिलापवाले तंबू के प्रसंग में मूल्यवान नीले रंग की काती हुई सामग्री का संकेत है; साझा 'सूत' सूची के अंत में रखा गया है।
- source_word: אַרְגָּמָן
  choice: बैंगनी
  rationale: पवित्रस्थान के वस्त्रों में प्रयुक्त बैंगनी रंग की सामग्री का मानक और सहज हिन्दी रूप।
- source_word: תּוֹלַעַת הַשָּׁנִי
  choice: लाल सूत
  rationale: यह अभिव्यक्ति विशेष लाल रंग से रंगी वस्त्र-सामग्री को दर्शाती है। 'लाल सूत' आधुनिक पाठक के लिए स्पष्ट है और संदर्भगत वस्त्रार्थ बनाए रखता है।
- source_word: שֵׁשׁ
  choice: महीन मलमल
  rationale: इस पवित्रस्थान-संबंधी प्रसंग में उत्तम किस्म के महीन सन-वस्त्र का बोध होता है; 'महीन मलमल' हिन्दी बाइबलीय प्रयोग में परिचित और सहज है।
