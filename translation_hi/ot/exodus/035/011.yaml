    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּשְׁכָּן
  choice: पवित्र निवास
  rationale: מִשְׁכָּן का मूल अर्थ ‘निवास’ है और यहाँ यह इस्राएल के बीच यहोवा के पवित्र निवास-स्थान की संरचना को सूचित करता है। ‘पवित्र’ प्रसंगगत अर्थ को स्पष्ट करता है और आधुनिक पाठक के लिए स्वाभाविक है।
- source_word: אָהֳלוֹ
  choice: उसका तंबू
  rationale: אָהֶל का अर्थ ‘तंबू’ है; प्रत्यय पवित्र निवास की ओर संकेत करता है और उससे संबंधित तंबू-घटक को अलग पहचानता है।
- source_word: מִכְסֵהוּ
  choice: उसका ओढ़ना
  rationale: מִכְסֶה सुरक्षात्मक आवरण को दर्शाता है। ‘ओढ़ना’ तंबू पर डाली जाने वाली परत का ठोस और सुबोध बोध देता है, जबकि सामग्री को अनिर्दिष्ट रखता है।
- source_word: קְרָסָיו
  choice: उसके अंकुड़े
  rationale: קֶרֶס पर्दों या आवरणों को जोड़ने वाले छोटे संयोजकों के लिए प्रयुक्त है। ‘अंकुड़े’ उनके संभावित आकार और जोड़ने के कार्य को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: קְרָשָׁיו
  choice: उसकी चौखटें
  rationale: קֶרֶשׁ को तख्तों अथवा ढाँचेदार चौखटों के रूप में समझा जा सकता है। निर्गमन की संरचनात्मक व्यवस्था के संदर्भ में ‘चौखटें’ उपयुक्त है, जबकि विकल्प फुटनोट में सुरक्षित है।
- source_word: בְּרִיחָיו
  choice: उसके डंडे
  rationale: בְּרִיחַ उन लंबे पट्टों या डंडों को सूचित करता है जो चौखटों को साथ बाँधे रखते थे। ‘डंडे’ सरल और अनावश्यक तकनीकी विशिष्टता से मुक्त है।
- source_word: עַמֻּדָיו
  choice: उसके खंभे
  rationale: עַמּוּד खड़े सहारों को दर्शाता है; ‘खंभे’ आधुनिक मानक हिंदी में स्पष्ट वास्तुशिल्पीय शब्द है।
- source_word: אֲדָנָיו
  choice: उसकी आधार-चौकियाँ
  rationale: אֶדֶן उन भारी आधारों अथवा खानेदार चौकियों को दर्शाता है जिनमें संरचनात्मक अंग टिकाए जाते थे। ‘आधार-चौकियाँ’ आधार और सॉकेट दोनों भावों को सहज ढंग से व्यक्त करता है।
