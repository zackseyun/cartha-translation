  text: וַ/יָּבֹ֥אוּ הָ/אֲנָשִׁ֖ים עַל הַ/נָּשִׁ֑ים כֹּ֣ל נְדִ֣יב לֵ֗ב הֵ֠בִיאוּ חָ֣ח וָ/נֶ֜זֶם וְ/טַבַּ֤עַת וְ/כוּמָז֙ כָּל כְּלִ֣י זָהָ֔ב וְ/כָל אִ֕ישׁ אֲשֶׁ֥ר הֵנִ֛יף תְּנוּפַ֥ת זָהָ֖ב לַ/יהוָֽה־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/022.yaml
  text: So the men came with the women[a]. Everyone whose heart was willing brought brooches, earrings, rings, and ornaments—all kinds of gold jewelry[b]. And every man who presented a wave offering of gold to Yahweh did so.
translation:
  language: hi
  text: तब पुरुष स्त्रियों के साथ आए[a]। जितने लोग मन से उदार थे, वे ब्रोच, बालियाँ, अंगूठियाँ और आभूषण—सोने के हर प्रकार के गहने—ले आए[b]। और हर उस पुरुष ने याहवे के लिए सोने की हिलाई जानेवाली भेंट चढ़ाई, जिसने उसे चढ़ाया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी वाक्यांश का शाब्दिक रूप “स्त्रियों पर पुरुष” है। यहाँ यह मुहावरेदार ढंग से पुरुषों के स्त्रियों के साथ, या उनके अतिरिक्त, आने का अर्थ दे सकता है।
    reason: alternative_reading
  - marker: b
    text: इनमें से कुछ आभूषणों की ठीक पहचान अनिश्चित है। “ब्रोच” के लिए काँटे, छल्ले या कुंडियाँ; “बालियों” के लिए नथें; और “आभूषण” के लिए लटकन या बाजूबंद भी संभव हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: इसलिए ... आए
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; संदर्भ में “इसलिए” पिछले आह्वान के परिणाम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הָאֲנָשִׁים עַל הַנָּשִׁים
  choice: पुरुष स्त्रियों के साथ आए
  rationale: עַל का यहाँ शाब्दिक स्थान-संबंधी अर्थ अस्वाभाविक है; वाक्यांश संभवतः पुरुषों के स्त्रियों के साथ अथवा उनके अतिरिक्त आने को बताता है। मुख्य पाठ में सहज अर्थ रखा और विकल्प पादटिप्पणी में सुरक्षित किया गया है।
- source_word: כֹּל נְדִיב לֵב
  choice: जितने भी लोग मन से इच्छुक थे
  rationale: यह वाक्यांश स्वेच्छा और उदार आंतरिक प्रवृत्ति दर्शाता है। “मन से इच्छुक” हृदय-संबंधी इब्रानी अभिव्यक्ति को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: חָח
  choice: बिल्ले
  rationale: वस्तु की ठीक पहचान अनिश्चित है; आभूषणों की सूची में इससे बिल्ला, काँटा, छल्ला या कुंडी जैसा अलंकार अभिप्रेत हो सकता है।
- source_word: נֶזֶם
  choice: बालियाँ
  rationale: यह कान या नाक में पहना जाने वाला छल्ला हो सकता है। “बालियाँ” सहज मुख्य-पाठ विकल्प है और अनिश्चितता पादटिप्पणी में दी गई है।
- source_word: טַבַּעַת
  choice: अंगूठियाँ
  rationale: मूल शब्द सामान्यतः अंगूठी बताता है; कभी वह मुहरदार अंगूठी भी हो सकती है, पर यहाँ अनावश्यक विशिष्टता से बचा गया है।
- source_word: כוּמָז
  choice: आभूषण
  rationale: दुर्लभ शब्द का सटीक आशय अनिश्चित है; व्यापक हिन्दी शब्द झूठी सटीकता से बचाता है।
- source_word: כָּל כְּלִי זָהָב
  choice: हर प्रकार के सोने के गहने
  rationale: כְּלִי व्यापक रूप से वस्तु या पात्र हो सकता है, पर निकटवर्ती सूची व्यक्तिगत आभूषणों की है; यह अनुवाद उसी संदर्भ को स्वाभाविक रूप देता है।
- source_word: וְכָל אִישׁ
  choice: और जिस-जिस पुरुष ने
  rationale: मूल में אִישׁ स्पष्ट रूप से पुल्लिंग एकवचन है; हिन्दी में “जिस-जिस पुरुष” वितरणात्मक भाव को बनाए रखता है।
- source_word: הֵנִיף תְּנוּפַת זָהָב
  choice: सोने की हिलाई हुई भेंट चढ़ाई
  rationale: क्रिया और संज्ञा दोनों अनुष्ठानिक उठाने/हिलाने को व्यक्त करते हैं। “हिलाई हुई भेंट” इस विशिष्ट धार्मिक शब्दावली को सुरक्षित रखती है, जबकि “चढ़ाई” क्रिया को हिन्दी में स्पष्ट करती है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: व्यक्तिगत वाचा-नाम יהוה को उपाधि से बदलने के बजाय हिन्दी में प्रचलित ध्वन्यात्मक रूप “यहोवा” दिया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में टेट्राग्रामटन सीधे आया है। हिन्दी पाठकों के लिए परिचित व्यक्तिगत नाम “यहोवा” वाचा-नाम को बनाए रखता है; इसे सामान्य उपाधि “प्रभु” में नहीं बदला गया।
- issue: תְּנוּפָה की अनुष्ठानिक विशिष्टता
  choice: हिलाई हुई भेंट
  alternative: भेंट; अर्पित भेंट
  rationale: सामान्य “भेंट” अनुष्ठानिक उठाने या हिलाने के तत्व को मिटा देती। चुना हुआ रूप तकनीकी भाव को यथासंभव स्पष्ट रखता है।
- issue: וְכָל אִישׁ में लिंग
  choice: जिस-जिस पुरुष
  alternative: हर व्यक्ति
  rationale: मूल में पुरुषवाचक אִישׁ है, इसलिए इसे लिंग-निरपेक्ष नहीं किया गया; इससे पहले का व्यापक सहभागी समूह भी यथावत स्पष्ट है।
