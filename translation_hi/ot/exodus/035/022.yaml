  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य रूप अपनाया गया है। आभूषण-सूची की वास्तविक शब्दार्थगत अनिश्चितता पादटिप्पणी में रखी गई है। “हिलाई हुई भेंट” कुछ तकनीकी है, पर मूल की अनुष्ठानिक विशिष्टता बचाने के लिए उचित है।
