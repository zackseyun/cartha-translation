  yaml_path: translation/ot/exodus/035/029.yaml
  text: Every man and woman whose heart moved them to bring something for all the work that Yahweh had commanded to be done through Moses—the children of Israel brought a freewill offering to Yahweh[a][b][c].
translation:
  language: hi
  text: वे सभी इस्राएली पुरुष और स्त्रियाँ[b], जिनके मन ने उन्हें उस सारे काम के लिए कुछ लाने को प्रेरित किया था जिसे याहवे ने मूसा के द्वारा[a] करने की आज्ञा दी थी, याहवे के लिए स्वेच्छा-भेंट लेकर आए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मूसा के हाथ से”; अर्थात् “मूसा के द्वारा।”
    reason: lexical_alternative
  - marker: b
    text: “इस्राएली” का शाब्दिक रूप “इस्राएल की सन्तान” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אִישׁ וְאִשָּׁה
  choice: हर पुरुष और स्त्री
  rationale: यह इब्रानी के वितरणात्मक बल और स्त्री-पुरुष दोनों की स्पष्ट भागीदारी को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: נָדַב לִבָּם אֹתָם
  choice: जिनके मन ने उन्हें ... प्रेरित किया
  rationale: यह मुहावरा मन की स्वैच्छिक इच्छा और भीतरी प्रेरणा व्यक्त करता है; ‘प्रेरित किया’ इसे बिना बाध्यता का भाव जोड़े स्वाभाविक ढंग से कहता है।
- source_word: לְהָבִיא
  choice: कुछ लाने को
  rationale: मूल क्रिया ‘लाना’ है; प्रसंग में उसका कर्म भेंट की सामग्री है, इसलिए हिन्दी की स्पष्टता हेतु ‘कुछ’ जोड़ा गया है।
- source_word: לְכָל הַמְּלָאכָה
  choice: उस सारे काम के लिए
  rationale: מְלָאכָה यहाँ निवासस्थान और उसकी सामग्री से संबंधित समूचे निर्माण-कार्य को व्यापक रूप से दर्शाता है।
- source_word: בְּיַד מֹשֶׁה
  choice: मूसा के द्वारा
  rationale: शाब्दिक ‘मूसा के हाथ से’ यहाँ माध्यम अथवा प्रतिनिधित्व का इब्रानी मुहावरा है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित व्यक्तिगत नाम ‘यहोवा’ चतुरक्षरीय दिव्य नाम को किसी उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: यह मानक जातिवाचक पद का वर्तमान, सहज हिन्दी रूप है; शाब्दिक रूप ‘इस्राएल की सन्तान’ भी संभव है।
- source_word: נְדָבָה
  choice: स्वेच्छा-भेंट
  rationale: यह ऐसी भेंट है जो बाध्यता से नहीं, अपनी इच्छा से दी जाती है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत दिव्य नाम है। हिन्दी पाठकों के लिए ‘यहोवा’ सुस्थापित लिप्यंतरण है; ‘याहवे’ विद्वानों में प्रचलित वैकल्पिक उच्चारण है।
- issue: हृदय/मन की प्रेरणा और मानवीय स्वेच्छा
  choice: मन ने उन्हें प्रेरित किया
  alternative: मन ने उन्हें इच्छुक बनाया
  rationale: मूल वाक्य भीतर से उत्पन्न तत्परता व्यक्त करता है, पर उसके दार्शनिक या सिद्धान्तगत स्रोत को स्पष्ट नहीं करता; अनुवाद उसी तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज और गरिमापूर्ण रूप अपनाया गया है। वाक्य की आरम्भिक संरचना में मूल की पुनरुक्ति-सदृश विषय-रचना को डैश द्वारा बनाए रखा गया है। ‘स्वेच्छा-भेंट’ धार्मिक प्रसंग में स्पष्ट है और योगदान के ऐच्छिक स्वरूप को सुरक्षित रखता है।
