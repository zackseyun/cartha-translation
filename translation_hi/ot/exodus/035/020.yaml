  text: तब इस्राएलियों की सारी सभा मूसा के सामने से चली गई।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: तब ... चली गई
  rationale: वय्यिक्तोल रूप कथा को आगे बढ़ाता है। ‘तब’ क्रमिकता व्यक्त करता है और एकवचन सामूहिक संज्ञा ‘सभा’ के साथ ‘चली गई’ स्वाभाविक हिन्दी है।
- source_word: כָּל עֲדַת
  choice: सारी सभा
  rationale: כָּל संपूर्णता पर बल देता है और עֵדָה इस्राएल के एकत्र समुदाय को दर्शाता है; ‘सारी सभा’ आधुनिक हिन्दी में संक्षिप्त और स्पष्ट है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों की
  rationale: यहाँ वाक्यांश पूरे इस्राएली समुदाय का परिचय देता है। ‘इस्राएलियों की सभा’ स्वाभाविक आधुनिक हिन्दी है और संदर्भगत सामूहिक अर्थ को ठीक से व्यक्त करता है।
- source_word: מִלִּפְנֵי
  choice: के सामने से
  rationale: हिब्रू स्थानवाचक मुहावरे का अर्थ किसी के सम्मुख या उपस्थिति से निकल जाना है; ‘के सामने से’ उसका निकट और सहज हिन्दी रूप है।
- source_word: מֹשֶׁה
  choice: मूसा
  rationale: हिन्दी बाइबल परंपरा में इस नाम का मानक रूप ‘मूसा’ है।
