- source_word: בְּכָל מְלֶאכֶת
  choice: हर प्रकार की कारीगरी
  rationale: पदबंध कारीगर के सभी प्रकार के शिल्पकार्य को समावेशी ढंग से दर्शाता है।
- source_word: מַחֲשָׁבֶת
  choice: कुशल
  rationale: इस संदर्भ में शब्द सोच-विचार से रचे, योजनाबद्ध अथवा कलात्मक शिल्प का बोध कराता है; ‘कुशल कारीगरी’ आधुनिक हिंदी में सहज है, जबकि अन्य संभावित अर्थ पादटिप्पणी में सुरक्षित हैं।
