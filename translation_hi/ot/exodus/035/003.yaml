  text: You shall not kindle a fire in any of your dwellings on the Sabbath day.
translation:
  language: hi
  text: तुम सब्त के दिन अपने किसी भी निवास-स्थान में आग न जलाओ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְבַעֲרוּ
  choice: न जलाना
  rationale: בער के पिअेल रूप का अर्थ यहाँ आग सुलगाना या जलाना है। निषेधात्मक आज्ञा में ‘आग न जलाना’ स्वाभाविक आधुनिक हिन्दी है और क्रिया के आरम्भकारी भाव को व्यक्त करती है।
- source_word: אֵשׁ
  choice: आग
  rationale: एकवचन संज्ञा אֵשׁ को हिन्दी में स्वाभाविक रूप से बिना अनिश्चित उपपद के ‘आग’ कहा जाता है।
- source_word: בְּכֹל
  choice: किसी भी
  rationale: 'כֹל यहाँ वितरणात्मक निषेध व्यक्त करता है: यह मनाही हर एक निवास-स्थान पर लागू है। हिन्दी में ‘किसी भी’ इस अर्थ को स्पष्ट और सहज रखता है।'
- source_word: מֹשְׁבֹתֵיכֶם
  choice: अपने किसी भी निवास-स्थान में
  rationale: מוֹשָׁב का अर्थ निवास या रहने का स्थान हो सकता है। ‘निवास-स्थान’ ‘घर’ से अधिक व्यापक है और ‘बस्ती’ की अपेक्षा व्यक्तिगत अथवा सामुदायिक दोनों दायरों को खुला रखता है।
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: सब्त के दिन
  rationale: यह सीधा कालवाचक पद है। ‘सब्त के दिन’ मूल में उपस्थित ‘दिन’ को बनाए रखते हुए मानक हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: सब्त के दिन आग से संबंधित मनाही का दायरा
  choice: आग जलाने की सीधी मनाही के रूप में अनुवाद
  alternative: इसे आग के हर उपयोग, पहले से जलती आग को बनाए रखने, या ताप से जुड़े सभी कामों की व्यापक मनाही के रूप में स्पष्ट करना
  rationale: इब्रानी पाठ विशेष रूप से आग जलाने की मनाही करता है। अनुवाद बाद की व्याख्याओं को पद में जोड़े बिना इसी कथन को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘निवास-स्थान’ मूल शब्द की व्यापकता बचाता है; वाक्य में बहुवचन संबोधन ‘तुम’ के साथ आज्ञार्थक ‘न जलाना’ सामान्य हिन्दी बाइबिलीय शैली के अनुरूप है।
