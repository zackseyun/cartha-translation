lexical_decisions:
- source_word: יִתְדֹת
  choice: खूँटियाँ
  rationale: भूमि में गाड़कर पवित्र निवास और आँगन के परदों को बाँधने वाली खूँटियों के लिए यह सहज और सटीक आधुनिक हिन्दी शब्द है।
- source_word: הַמִּשְׁכָּן
  choice: पवित्र निवास
  rationale: מִשְׁכָּן का मूल अर्थ ‘निवास’ है और निर्गमन में यह परमेश्वर के पवित्र निवास-ढाँचे का तकनीकी नाम है। ‘पवित्र’ प्रसंग को स्पष्ट करता है, जबकि किसी विशेष सम्प्रदाय की पारिभाषिक अभिव्यक्ति से बचता है।
- source_word: הֶחָצֵר
  choice: आँगन
  rationale: यह पवित्र निवास के चारों ओर घिरे बाहरी क्षेत्र को दर्शाता है; ‘आँगन’ सामान्य पाठक के लिए स्वाभाविक और स्पष्ट है।
- source_word: מֵיתְרֵיהֶם
  choice: उनकी रस्सियाँ
  rationale: यह उन रस्सियों या डोरियों को दर्शाता है जिनसे ढाँचे और उसके परदे खूँटियों से बाँधे जाते थे। ‘रस्सियाँ’ आधुनिक हिन्दी में अधिक सहज है; मूल का बहुवचन संबंधवाचक रूप ‘उनकी’ से सुरक्षित रहता है।
- source_word: אֶת ... וְאֶת ... וְאֶת
  choice: … की खूँटियाँ, … की खूँटियाँ और उनकी रस्सियाँ
  rationale: अप्रत्यक्ष कर्म-चिह्न אֶת का अलग अनुवाद नहीं किया गया, पर उसकी पुनरावृत्ति से बनी सूची की समांतर संरचना हिन्दी में बनाए रखी गई है।
