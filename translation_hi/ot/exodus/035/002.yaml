base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/002.yaml
  text: Work may be done for six days[a], but on the seventh day there shall be for you a holy Sabbath, a complete rest to Yahweh[b]. Whoever does work on it shall surely be put to death.
translation:
  language: hi
  text: छह दिन काम किया जा सकता है, पर सातवाँ दिन तुम्हारे लिए पवित्र होगा—याहवे के लिए पूर्ण विश्राम का शब्बात[a]। जो कोई उस दिन काम करे, उसे मृत्युदंड दिया जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “शब्बात, शब्बात-विश्राम” है; यह काम से पूरी तरह रुकने के भाव को तीव्र करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּעָשֶׂה
  choice: किया जा सकता है
  rationale: निफ़अल अपूर्ण रूप के कर्मवाच्य और कानूनी निर्देश के भाव को स्वाभाविक हिन्दी में व्यक्त करता है; यह किसी निश्चित कर्ता को जोड़े बिना छः दिनों में काम की अनुमति बताता है।
- source_word: מְלָאכָה
  choice: काम
  rationale: शब्बात-विधि के प्रसंग में यह व्यावसायिक या सामान्य श्रम के लिए स्पष्ट और सहज आधुनिक हिन्दी शब्द है।
- source_word: קֹדֶשׁ
  choice: पवित्र
  rationale: दिन की परमेश्वर के लिए अलग की गई स्थिति को बिना अतिरिक्त व्याख्या के व्यक्त करता है।
- source_word: שַׁבַּת שַׁבָּתוֹן
  choice: पूर्ण विश्राम का शब्बात
  rationale: दो संबंधित इब्रानी शब्दों की तीव्रता को व्यक्त करते हुए काम से पूरी तरह रुकने के भाव को स्पष्ट रखता है।
- source_word: לַיהוָה
  choice: याहवे के लिए
  rationale: ל उपसर्ग के समर्पण अथवा अभिमुखता के भाव को रखता है और יהוה को उसके व्यक्तिगत वाचा-नाम के रूप में प्रस्तुत करता है।
- source_word: כָּל הָעֹשֶׂה
  choice: जो कोई ... करे
  rationale: सामान्य और सर्वसमावेशी कानूनी शर्त को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בּוֹ
  choice: उस दिन
  rationale: सर्वनाम का संकेत सातवें दिन की ओर है; हिन्दी में कालगत संदर्भ को स्पष्ट और सहज बनाता है।
- source_word: יוּמָת
  choice: अवश्य मार डाला जाए
  rationale: होफ़अल रूप के दंडात्मक कर्मवाच्य ‘मृत्युदंड दिया जाए’ को दृढ़ कानूनी विधान के रूप में व्यक्त करता है; ‘अवश्य’ दंड की निश्चितता बताता है, किसी अलग इब्रानी बलवाचक रूप का दावा नहीं करता।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ में चार-अक्षरीय वाचा-नाम सीधे आया है; ‘याहवे’ उसका व्यापक रूप से स्वीकृत विद्वत्तापूर्ण उच्चारण दर्शाता है और उसे केवल उपाधि में नहीं बदलता।
- issue: לַיהוָה में ל का संबंध
  choice: याहवे के लिए
  alternative: याहवे को समर्पित / याहवे का
  rationale: ‘के लिए’ समर्पण और अभिमुखता दोनों की संभावना खुली रखता है; पादटिप्पणी स्वामित्व-संबंधी अर्थ की संभावना भी बताती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘शब्बात’ मूल धार्मिक-सांस्कृतिक पद को सुरक्षित रखता है, जबकि ‘पूर्ण विश्राम’ उसका आशय स्पष्ट करता है। कानूनी दंड-वाक्य को कर्मवाच्य में रखा गया है।
