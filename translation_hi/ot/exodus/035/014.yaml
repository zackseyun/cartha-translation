lexical_decisions:
- source_word: מְנֹרַת הַמָּאוֹר
  choice: प्रकाश के लिए दीपाधार
  rationale: מְנוֹרָה पवित्र-तम्बू के दीपाधार को दर्शाता है। संबंधवाचक रचना הַמָּאוֹר को स्वाभाविक हिन्दी में ‘प्रकाश के लिए’ कहा गया है; इससे प्रयोजन स्पष्ट रहता है और मूल का ‘प्रकाश’ भी बना रहता है।
- source_word: כֵּלֶיהָ
  choice: उसके उपकरण
  rationale: כְּלִי एक व्यापक शब्द है, जिसका अर्थ पात्र, सामान या उपकरण हो सकता है। दीपाधार से जुड़ी वस्तुओं के लिए ‘उपकरण’ सहज और पर्याप्त रूप से व्यापक है।
- source_word: נֵרֹתֶיהָ
  choice: उसके दीपक
  rationale: נֵר यहाँ दीपाधार से जुड़े अलग-अलग दीपकों को दर्शाता है। ‘दीपक’ आधुनिक हिन्दी में स्पष्ट और सटीक है।
- source_word: שֶׁמֶן הַמָּאוֹר
  choice: प्रकाश के लिए तेल
  rationale: शाब्दिक संबंध ‘प्रकाश/प्रज्वलन का तेल’ है। ‘प्रकाश के लिए तेल’ स्वाभाविक हिन्दी में प्रयोजन व्यक्त करता और מָאוֹר की पुनरावृत्ति सुरक्षित रखता है।
- source_word: וְאֶת ... וְאֶת ... וְאֶת ... וְאֵת
  choice: और ... और ... और ... और
  rationale: संयोजक और प्रत्यक्ष-कर्म चिह्न की पुनरावृत्ति सूची की संरचना और लय बनाती है; हिन्दी में ‘और’ की पुनरावृत्ति से इसे बनाए रखा गया है।
