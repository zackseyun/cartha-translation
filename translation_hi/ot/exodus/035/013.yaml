- source_word: הַשֻּׁלְחָן
  choice: मेज़
  rationale: यह संज्ञा पवित्र-स्थान की मेज़ को दर्शाती है। आगे आने वाला पदबंध उसके विशेष उपयोग को स्पष्ट करता है, इसलिए यहाँ अतिरिक्त व्याख्या नहीं जोड़ी गई।
- source_word: בַּדָּיו
  choice: उसके डंडे
  rationale: मिलापवाले तंबू के संदर्भ में בַּד पवित्र साज-सामान को उठाकर ले जाने के डंडों को दर्शाता है। ‘डंडे’ सहज और संक्षिप्त आधुनिक हिन्दी है।
- source_word: כָּל כֵּלָיו
  choice: उसके सभी बर्तन
  rationale: כְּלִי का अर्थ बर्तन, पात्र या उपकरण हो सकता है। मेज़ के संदर्भ में ‘बर्तन’ स्वाभाविक और पर्याप्त रूप से व्यापक है।
- source_word: לֶחֶם הַפָּנִים
  choice: उपस्थिति की रोटी
  rationale: इब्रानी पदबंध का शाब्दिक भाव ‘मुख/उपस्थिति की रोटी’ है। ‘उपस्थिति की रोटी’ उसके उपासना-संबंधी विशेष अर्थ को बनाए रखती है, जबकि अधिक व्याख्यात्मक विस्तार से बचती है।
