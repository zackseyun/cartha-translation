base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/010.yaml
  text: And every skillful person among you shall come and make all that Yahweh has commanded:[a][b]
translation:
  language: hi
  text: और तुम में से हर निपुण व्यक्ति आए और वह सब बनाए जिसकी आज्ञा यहोवा ने दी है।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शाब्दिक रूप से “हृदय का बुद्धिमान”; यहाँ यह मुहावरा विशेष रूप से हस्तकला या निर्माण-कौशल में निपुण व्यक्ति के लिए है।
    reason: lexical_alternative
  - marker: b
    text: 'हिब्रू अभिव्यक्ति व्याकरणतः पुल्लिंग एकवचन है, पर यहाँ उसका अर्थ वितरणात्मक है: “तुम में से हर निपुण व्यक्ति।”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/כָל חֲכַם לֵב
  choice: और तुममें जितने निपुण कारीगर हैं
  rationale: וְ संबंधसूचक है; כָל के साथ एकवचन חֲכַם לֵב यहाँ वितरणात्मक अर्थ रखता है। ‘हृदय का बुद्धिमान’ शाब्दिक मुहावरा है, पर निवास-स्थान के निर्माण के प्रसंग में इसका स्वाभाविक अर्थ व्यावहारिक कौशल रखने वाले कारीगर हैं। हिंदी में ‘जितने ... हैं’ स्रोत के वितरणात्मक भाव और आगे के बहुवचन क्रियापदों को सहज रूप से व्यक्त करता है।
- source_word: בָּ/כֶם
  choice: तुममें
  rationale: בְּ के साथ द्वितीय पुरुष बहुवचन प्रत्यय समुदाय के भीतर उपस्थित लोगों को दर्शाता है; ‘तुममें’ संक्षिप्त और स्वाभाविक है।
- source_word: יָבֹאוּ וְ/יַעֲשׂוּ
  choice: वे आकर ... बनाएँ
  rationale: दोनों अपूर्ण क्रियाएँ इस प्रसंग में निर्देश या आह्वान का बल रखती हैं। ‘आकर ... बनाएँ’ आधुनिक हिंदी में संबंध और विधिवाचक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֵת כָּל אֲשֶׁר
  choice: वह सब ... जिसकी
  rationale: यह रचना आज्ञा की गई समस्त वस्तुओं और कार्यों को समेटती है। ‘वह सब ... जिसकी’ हिंदी में सुस्पष्ट संबंध बनाता है।
- source_word: צִוָּה יְהוָה
  choice: जिसकी आज्ञा यहोवा ने दी है
  rationale: पूर्ण क्रिया पूर्व में दी जा चुकी आज्ञा को दर्शाती है। יְהוָה को उसके व्यक्तिगत वाचा-नाम ‘यहोवा’ से प्रस्तुत किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम स्पष्ट रूप से है। हिंदी पाठकों में परिचित नाम-रूप ‘यहोवा’ उसका नामत्व बनाए रखता है; इसे केवल उपाधि ‘प्रभु’ से बदलना मूल की विशिष्टता घटाता।
- issue: חֲכַם לֵב में व्याकरणिक लिंग और वितरणात्मक बल
  choice: जितने निपुण कारीगर हैं
  alternative: हर निपुण पुरुष / हर वह व्यक्ति जो निपुण है
  rationale: हिब्रू पद व्याकरणतः पुल्लिंग एकवचन है, किंतु כָל और बहुवचन क्रियाओं के साथ उसका बल वितरणात्मक/समूहगत है। निर्माण-संदर्भ में पद योग्यता बताता है, केवल पुरुष लिंग पर कथन नहीं करता; हिंदी बहुवचन अभिव्यक्ति वास्तविक संदर्भ और व्याकरणिक बल दोनों को सहज रखती है।
translation_notes:
  register: आधुनिक मानक हिंदी, सम्मानपूर्ण किंतु सामान्य पाठक के लिए सहज। ‘निपुण कारीगर’ प्रसंगगत हस्तकौशल को स्पष्ट करता है; ‘वे ... बनाएँ’ निर्देशात्मक बल को कृत्रिम कानूनी शैली के बिना बनाए रखता है।
