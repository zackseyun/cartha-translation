source:
  edition: WLC
  text: וְ/כָל אִ֞ישׁ אֲשֶׁר נִמְצָ֣א אִתּ֗/וֹ תְּכֵ֧לֶת וְ/אַרְגָּמָ֛ן וְ/תוֹלַ֥עַת שָׁנִ֖י וְ/שֵׁ֣שׁ וְ/עִזִּ֑ים וְ/עֹרֹ֨ת אֵילִ֧ם מְאָדָּמִ֛ים וְ/עֹרֹ֥ת תְּחָשִׁ֖ים הֵבִֽיאוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/023.yaml
  text: And every man with whom blue yarn[a], purple yarn, scarlet yarn, fine linen, goats’ hair, ram skins dyed red, and tahash skins were found brought them.
translation:
  language: hi
  text: और जिस किसी पुरुष के पास नीले, बैंगनी और सुर्ख लाल रंग के सूत, महीन मलमल, बकरियों के बाल, लाल रंग से रंगी हुई मेढ़ों की खालें और तहश की खालें[a] थीं, वह उन्हें ले आया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘तहश’ कहलाने वाले पशु या सामग्री की ठीक-ठीक पहचान निश्चित नहीं है। इसके लिए ‘उत्तम चमड़ा’, ‘पॉरपॉइज़ की खाल’ और ‘डुगोंग की खाल’ जैसे अर्थ प्रस्तावित किए गए हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל אִישׁ
  choice: और जिन-जिन पुरुषों
  rationale: כָל के साथ एकवचन אִישׁ का प्रयोग प्रत्येक पुरुष को अलग-अलग इंगित करता है। हिंदी में ‘जिन-जिन पुरुषों’ इस वितरणात्मक अर्थ और अंतिम बहुवचन क्रिया—दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֲשֶׁר נִמְצָא אִתּוֹ
  choice: जिन-जिन पुरुषों के पास ... थीं
  rationale: इब्रानी का शाब्दिक भाव ‘जिसके साथ/पास पाया गया’ है। हिंदी में ‘के पास ... थीं’ स्वाभाविक ढंग से वस्तुओं के उनके अधिकार में होने का अर्थ बनाए रखता है।
- source_word: תְּכֵלֶת
  choice: नीले ... रंग का सूत
  rationale: मिलापवाले तंबू की सामग्री की इस सूची में यह नीले रंग की वस्त्र-सामग्री को दर्शाता है; ‘सूत’ उसके वस्त्र-निर्माण संबंधी उपयोग को स्पष्ट करता है।
- source_word: אַרְגָּמָן
  choice: बैंगनी ... रंग का सूत
  rationale: यह बैंगनी रंग की वस्त्र-सामग्री है। ‘सूत’ सूची में रंगे हुए रेशों की ठोस और सुसंगत अभिव्यक्ति है।
- source_word: תוֹלַעַת שָׁנִי
  choice: सुर्ख लाल रंग का सूत
  rationale: यह पद गहरे चटकीले लाल रंग से रंगी वस्त्र-सामग्री को सूचित करता है। ‘सुर्ख लाल’ आधुनिक हिंदी में रंग का अर्थ स्पष्ट करता है।
- source_word: שֵׁשׁ
  choice: महीन सन
  rationale: याजकीय और पवित्रस्थान-संबंधी प्रसंगों में שֵׁשׁ उत्तम कोटि की सन की वस्त्र-सामग्री को दर्शाता है। ‘महीन सन’ गुणवत्ता और मूल सामग्री दोनों को व्यक्त करता है।
- source_word: עִזִּים
  choice: बकरियों के बाल
  rationale: शब्द का मूल अर्थ ‘बकरियाँ’ है, पर इस सामग्री-सूची और तंबू के आवरणों के प्रसंग में आशय बकरी के बालों से बनी बुनाई की सामग्री है, जीवित पशुओं से नहीं।
- source_word: עֹרֹת אֵילִם מְאָדָּמִים
  choice: लाल रंगी हुई मेढ़ों की खालें
  rationale: यह पद मेढ़ों की उन खालों को दर्शाता है जिन्हें लाल रंग दिया गया था; हिंदी पदबंध कृदंत के अर्थ को स्पष्ट रखता है।
- source_word: עֹרֹת תְּחָשִׁים
  choice: तहश की खालें
  rationale: תְּחָשׁ की सटीक पहचान अनिश्चित है। अनुमानित पशु या चमड़े का प्रकार चुनने के बजाय लिप्यंतरण मूल की अनिश्चितता को सुरक्षित रखता है; पादटिप्पणी संभावित अर्थ बताती है।
- source_word: הֵבִיאוּ
  choice: वे उन्हें ले आए
  rationale: बहुवचन क्रिया उन सभी दाताओं की सम्मिलित कार्रवाई बताती है। ‘उन्हें’ सूचीबद्ध सामग्रियों को स्वाभाविक रूप से पुनः संदर्भित करता है।
