source:
  edition: WLC
  text: כָּל מֵרִ֗ים תְּר֤וּמַת כֶּ֨סֶף֙ וּ/נְחֹ֔שֶׁת הֵבִ֕יאוּ אֵ֖ת תְּרוּמַ֣ת יְהוָ֑ה וְ/כֹ֡ל אֲשֶׁר֩ נִמְצָ֨א אִתּ֜/וֹ עֲצֵ֥י שִׁטִּ֛ים לְ/כָל מְלֶ֥אכֶת הָ/עֲבֹדָ֖ה הֵבִֽיאוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/024.yaml
  text: Everyone who offered a contribution of silver or bronze brought Yahweh’s contribution[b][a], and everyone with whom acacia wood was found for any work of the service brought it.
translation:
  language: hi
  text: चाँदी या काँसे[a] की भेंट चढ़ाने वाले सभी लोग याहवे की भेंट ले आए; और जिनके पास सेवा के हर काम के लिए बबूल की लकड़ी थी[b], वे उसे ले आए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘चाँदी और काँसे की भेंट।’ इब्रानी संयोजक का अनुवाद ‘और’ भी किया जा सकता है; फिर भी यहाँ भाव यह है कि हर व्यक्ति उपलब्ध धातु की भेंट लाया।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से, ‘जिसके पास बबूल की लकड़ी पाई गई’; यह उपलब्ध होने या अधिकार में होने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל מֵרִים
  choice: जो कोई ... भेंट अर्पित करता था
  rationale: רוּם का कृदन्त תְּרוּמָה के साथ भेंट प्रस्तुत या अर्पित करने का मुहावरा है। यह हिंदी प्रयोग अर्थ और कृदन्तीय भाव दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: תְּרוּמַת כֶּסֶף וּנְחֹשֶׁת
  choice: चाँदी या काँसे की भेंट
  rationale: תְּרוּמָה पवित्र उपयोग के लिए अलग की गई भेंट है। נְחֹשֶׁת ताँबा या काँसा हो सकता है; निवास-स्थान की सामग्री के संदर्भ में ‘काँसा’ उपयुक्त है। अलग-अलग दाताओं द्वारा इनमें से जो धातु दी गई, उसे स्पष्ट करने के लिए ‘या’ रखा गया है, और मूल संयोजक की अस्पष्टता पादटिप्पणी में दी गई है।
- source_word: הֵבִיאוּ אֵת תְּרוּמַת יְהוָה
  choice: वह याहवे की भेंट ले आया
  rationale: सम्बन्धवाचक रचना का सीधा अर्थ ‘याहवे की भेंट’ है—अर्थात उसके लिए अलग की गई या उसकी मानी गई भेंट। हिंदी में संक्षिप्त सम्बन्धवाचक रूप मूल तनाव को बिना खोले रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिंदी में प्रचलित निकट लिप्यंतरण ‘याहवे’ से व्यक्त किया गया है।
- source_word: וְכֹל אֲשֶׁר נִמְצָא אִתּוֹ
  choice: और जिसके पास ... उपलब्ध थी
  rationale: शाब्दिक रचना ‘जिसके साथ/पास ... पाई गई’ उपलब्धता या अधिकार में होने का इब्रानी मुहावरा है। ‘जिसके पास ... उपलब्ध थी’ आधुनिक हिंदी में इसका स्वाभाविक अर्थ देता है।
- source_word: עֲצֵי שִׁטִּים
  choice: बबूल की लकड़ी
  rationale: שִׁטִּים अकासिया-वर्ग की लकड़ी है। ‘बबूल की लकड़ी’ साधारण हिंदी पाठक के लिए परिचित और संदर्भानुकूल नाम है।
- source_word: לְכָל מְלֶאכֶת הָעֲבֹדָה
  choice: सेवा के किसी भी काम के लिए
  rationale: מְלָאכָה और עֲבֹדָה दोनों को क्रमशः ‘काम’ और ‘सेवा’ से व्यक्त किया गया है। ‘किसी भी’ לְכָל के वितरणात्मक भाव को स्वाभाविक हिंदी में देता है।
- source_word: הֵבִיאוּ
  choice: वह उसे ले आया
  rationale: एकवचन भाव में सामूहिक ‘लकड़ी’ की ओर संकेत करने के लिए हिंदी में ‘उसे’ जोड़ा गया है; क्रिया मूल के ‘लाए’ अर्थ को बनाए रखती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पद में वाचा का व्यक्तिगत नाम सीधे उपस्थित है। ‘याहवे’ उसे उपाधि में बदलने के बजाय नाम के रूप में रखता है और इब्रानी उच्चारण के व्यापक विद्वत्तापूर्ण पुनर्निर्माण के निकट है।
- issue: תְּרוּמַת יְהוָה में सम्बन्ध का अर्थ
  choice: याहवे की भेंट
  alternative: याहवे के लिए भेंट
  rationale: इब्रानी सम्बन्धवाचक पदबंध स्वामित्व, संबद्धता या समर्पण का भाव दे सकता है। ‘याहवे की भेंट’ मूल की संक्षिप्तता और अर्थगत विस्तार को सुरक्षित रखता है, जबकि ‘के लिए’ केवल उद्देश्य के अर्थ को प्रमुख कर देता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘भेंट अर्पित करना’ उपासना-संदर्भ में स्वाभाविक है, जबकि ‘सेवा के किसी भी काम’ में मूल के दोनों कार्य-संबंधी पद सुरक्षित हैं। अनावश्यक रूप से ‘निवास-स्थान’ नहीं जोड़ा गया, क्योंकि वह इस पद में प्रत्यक्ष नहीं है।
