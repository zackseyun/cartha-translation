source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה אֶל כָּל עֲדַ֥ת בְּנֵֽי יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁר צִוָּ֥ה יְהוָ֖ה לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/004.yaml
  text: Then Moses said to all the congregation of the sons of Israel[a], “This is the thing that Yahweh has commanded[c][b], saying,”
translation:
  language: hi
  text: तब मूसा ने इस्राएलियों की सारी सभा से कहा, “यह वह बात है जिसकी आज्ञा याहवे ने दी है:”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब मूसा ने…कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में उसके क्रमिक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עֲדַת
  choice: सभा
  rationale: यह शब्द इस्राएल के एकत्रित समुदाय को दर्शाता है; ‘सभा’ सहज और गरिमापूर्ण हिन्दी है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: यह स्थापित सामूहिक जातिनाम हिन्दी में पूरे इस्राएली समुदाय को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है; शब्दशः ‘इस्राएल के पुत्रों’ से यहाँ आशय अनावश्यक रूप से केवल पुरुषों तक सीमित लग सकता है।
- source_word: זֶה הַדָּבָר
  choice: यह वह बात है
  rationale: דָּבָר का अर्थ ‘वचन’, ‘बात’ या ‘विषय’ हो सकता है। यहाँ यह आगे आने वाली आज्ञा का परिचय देता है; ‘बात’ अर्थगत व्यापकता रखते हुए हिन्दी में स्वाभाविक है।
- source_word: צִוָּה
  choice: आज्ञा दी है
  rationale: पूर्ण हो चुकी और वर्तमान में लागू आज्ञा को हिन्दी का पूर्णकाल स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय प्रचलित हिन्दी लिप्यंतरण में रखा गया है।
- source_word: לֵאמֹר
  choice: कहने की
  rationale: अंतिम לֵאמֹר अगले पद में आने वाली आज्ञा की विषयवस्तु का परिचय देता है; इसे मुख्य क्रिया के साथ ‘कहने की आज्ञा’ के रूप में जोड़ना हिन्दी में सहज है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। हिन्दी पाठकों के लिए परिचित ‘यहोवा’ उस नाम को उपाधि ‘प्रभु’ से प्रतिस्थापित किए बिना सुरक्षित रखता है।
- issue: בְּנֵי יִשְׂרָאֵל का सामूहिक आशय
  choice: इस्राएलियों
  alternative: इस्राएल के पुत्रों; इस्राएल की सन्तान
  rationale: संदर्भ में मूसा पूरे एकत्रित समुदाय को संबोधित कर रहा है। ‘इस्राएलियों’ हिन्दी में उस सामूहिक पहचान को स्पष्ट करता है और अनावश्यक लैंगिक संकुचन से बचता है।
- issue: דָּבָר की अर्थगत व्यापकता
  choice: बात
  alternative: वचन; विषय
  rationale: मूल शब्द बहुअर्थी है। ‘बात’ यहाँ आदेश की विषयवस्तु का स्वाभाविक परिचय देती है, जबकि ‘वचन’ अधिक धार्मिक अर्थच्छाया ला सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कथात्मक शैली। पद अगले पद की प्रत्यक्ष आज्ञा का परिचय देता है, इसलिए अंत में द्विबिंदु रखा गया है।
