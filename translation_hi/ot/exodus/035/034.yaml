  text: उसने बसलेल और दान के गोत्र के अहीसामाक के पुत्र ओहोलीआब, दोनों के मन में सिखाने की योग्यता भी दी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘निर्देश देने की योग्यता।’ इब्रानी क्रिया का यह रूप व्यापक अर्थ में सिखाने को दर्शा सकता है, जिसमें कुशल कारीगरी का प्रशिक्षण देना भी शामिल है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְהוֹרֹת
  choice: सिखाने की योग्यता
  rationale: हिफ़ील रूप का अर्थ ‘सिखाना’ या ‘निर्देश देना’ है। נָתַן בְּלִבּוֹ के साथ ‘योग्यता दी’ स्वाभाविक हिन्दी है और कारीगरी में दूसरों को प्रशिक्षित करने की अंतःप्रदत्त क्षमता व्यक्त करती है।
- source_word: נָתַן בְּלִבּוֹ
  choice: मन में ... योग्यता दी
  rationale: इब्रानी मुहावरा भीतर दी गई क्षमता या प्रवृत्ति बताता है। आधुनिक हिन्दी में ‘मन’ समझने, इच्छा और कौशल के भीतरी केंद्र को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הוּא וְאָהֳלִיאָב
  choice: बसलेल और ... ओहोलीआब—दोनों
  rationale: स्पष्ट सर्वनाम הוּא पिछले पद के बसलेल की ओर संकेत करता है। नाम दोहराने और ‘दोनों’ के प्रयोग से हिन्दी में संबंध स्पष्ट तथा इब्रानी का बल सुरक्षित रहता है।
- source_word: בֶּן אֲחִיסָמָךְ
  choice: अहीसामाक के पुत्र
  rationale: वंश-सूचक पद का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: לְמַטֵּה דָן
  choice: दान के गोत्र के
  rationale: यहाँ לְ जनजातीय संबद्धता दर्शाता है; ‘दान के गोत्र के’ सटीक और प्रचलित हिन्दी है।
