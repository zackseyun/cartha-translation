lexical_decisions:
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: धूप की वेदी
  rationale: इब्रानी संबंध-रचना धूप से संबद्ध वेदी को दर्शाती है। यह हिंदी में स्वाभाविक है और उपासना-संबंधी विशिष्ट अर्थ बनाए रखती है।
- source_word: בַּדָּיו
  choice: उसके डंडे
  rationale: पवित्र साज-सामान को उठाकर ले जाने के लिए लगाए गए डंडे अभिप्रेत हैं; संक्षिप्त रूप संदर्भ में पर्याप्त स्पष्ट है।
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: अभिषेक का तेल
  rationale: यह अनुष्ठान में अभिषेक के लिए प्रयुक्त तेल का सीधा और प्रचलित हिंदी रूप है।
- source_word: קְטֹרֶת הַסַּמִּים
  choice: सुगंधित धूप
  rationale: סַמִּים सुगंध देने वाले मसालों अथवा सुगंध-द्रव्यों को सूचित करता है; यह रूप अर्थ को सहज हिंदी में व्यक्त करता है।
- source_word: מָסַךְ הַפֶּתַח
  choice: प्रवेश-द्वार का परदा
  rationale: מָסָךְ यहाँ द्वार पर लटकाए जाने वाले आवरण या परदे को दर्शाता है; हिंदी में 'परदा' सबसे स्वाभाविक है।
- source_word: לְפֶתַח הַמִּשְׁכָּן
  choice: पवित्र निवास के प्रवेश-द्वार का
  rationale: לְ यहाँ परदे और प्रवेश-द्वार के प्रयोजन अथवा संबंध को दिखाता है। हिंदी संबंध-रचना अनावश्यक पुनरावृत्ति से बचते हुए इसे स्पष्ट करती है।
- source_word: הַמִּשְׁכָּן
  choice: पवित्र निवास
  rationale: मूल शब्द का आधारभूत अर्थ 'निवास-स्थान' है और इस प्रसंग में वह इस्राएल के चलायमान पवित्रस्थान को सूचित करता है; 'पवित्र निवास' अर्थ और उपासना-संबंधी संदर्भ दोनों को स्पष्ट रखता है।
