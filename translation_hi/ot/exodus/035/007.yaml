  yaml_path: translation/ot/exodus/035/007.yaml
  text: and rams’ skins dyed red[a], and hides of sea cows, and acacia wood.
translation:
  language: hi
  text: और लाल रंग में रंगी हुई मेढ़ों की खालें, और तहश की खालें[a], और बबूल की लकड़ी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘तहश’ (תְּחָשׁ) किस पशु या किस प्रकार के चमड़े को दर्शाता है, यह निश्चित नहीं है। इसके अनुवादों में ‘उत्तम चमड़ा,’ ‘बकरी की खाल,’ ‘सूंस की खाल’ और ‘डुगोंग की खाल’ भी मिलते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹרֹת אֵילִם
  choice: मेढ़ों की खालें
  rationale: बहुवचन संबंध-रचना पशु की खालों को सामग्री के रूप में बताती है; אֵילִם का सटीक और स्वाभाविक हिन्दी अर्थ ‘मेढ़े’ है।
- source_word: מְאָדָּמִים
  choice: लाल रंग में रंगी हुई
  rationale: यह निष्पन्न अवस्था बताने वाला रूप है, जिसका आशय खालों को लाल किया जाना है; हिन्दी में ‘लाल रंग में रंगी हुई’ स्वाभाविक रूप से सम्भावित रंगाई व्यक्त करता है।
- source_word: עֹרֹת תְּחָשִׁים
  choice: तहश की खालें
  rationale: תְּחָשׁ की पहचान अनिश्चित है। लिप्यंतरण मूल की अनिश्चितता को सुरक्षित रखता है और किसी विशेष पशु या चमड़े की गुणवत्ता को बिना पर्याप्त आधार के निश्चित नहीं करता।
- source_word: עֲצֵי שִׂטִּים
  choice: बबूल की लकड़ी
  rationale: यह वाक्यांश शिट्टीम/अकेशिया कुल के वृक्ष की लकड़ी को दर्शाता है; ‘बबूल की लकड़ी’ आधुनिक हिन्दी में स्पष्ट और प्रचलित पर्याय है।
