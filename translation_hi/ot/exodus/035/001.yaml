language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יַּקְהֵ֣ל מֹשֶׁ֗ה אֶֽת כָּל עֲדַ֛ת בְּנֵ֥י יִשְׂרָאֵ֖ל וַ/יֹּ֣אמֶר אֲלֵ/הֶ֑ם אֵ֚לֶּה הַ/דְּבָרִ֔ים אֲשֶׁר צִוָּ֥ה יְהוָ֖ה לַ/עֲשֹׂ֥ת אֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/001.yaml
  text: Then Moses assembled all the congregation of the sons of Israel and said to them[b][a], “These are the things that Yahweh has commanded to be done.”
translation:
  language: hi
  text: तब मूसा ने इस्राएल के पुत्रों[a] की सारी मण्डली को इकट्ठा किया और उनसे कहा, “ये वे बातें[b] हैं जिन्हें करने की आज्ञा याहवे ने दी है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘इस्राएल के पुत्र’; यह इस्राएल की प्रजा के लिए वाचा-संबंधी पदनाम है और यहाँ केवल पुरुषों को नहीं, पूरे समुदाय को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘ये वे वचन हैं’ अथवा ‘ये वे विषय हैं’।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְהֵל
  choice: इकट्ठा किया
  rationale: हिफ़ील रूप का अर्थ लोगों को एक सभा के रूप में एकत्र करना है। ‘इकट्ठा किया’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: כָּל עֲדַת
  choice: सारी मण्डली
  rationale: עֵדָה यहाँ इस्राएल के समूचे संगठित समुदाय को दर्शाता है; ‘मण्डली’ उसके सामूहिक स्वरूप को बनाए रखता है और כָּל को ‘सारी’ व्यक्त करता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: यह इब्रानी पदबंध के पुल्लिंग और वाचाई पदनाम को औपचारिक रूप से सुरक्षित रखता है; पादटिप्पणी स्पष्ट करती है कि सन्दर्भ पूरे समुदाय का है।
- source_word: אֵלֶּה הַדְּבָרִים
  choice: ये वे बातें
  rationale: דְּבָרִים का अर्थ ‘वचन’, ‘बातें’ या ‘विषय’ हो सकता है। आगे दिए जाने वाले आदेशों के सन्दर्भ में ‘बातें’ स्वाभाविक है, जबकि पादटिप्पणी वास्तविक शब्दार्थ-विकल्प बनाए रखती है।
- source_word: צִוָּה יְהוָה
  choice: आज्ञा याहवे ने दी है
  rationale: इब्रानी पूर्ण क्रिया को वर्तमान में प्रभावी पूर्व आदेश के रूप में ‘दी है’ कहा गया है; יְהוָה को व्यक्तिगत दिव्य नाम ‘याहवे’ के रूप में लिप्यन्तरित किया गया है।
- source_word: לַעֲשֹׂת אֹתָם
  choice: जिन्हें करने
  rationale: यह आज्ञा दी गई बातों को कार्यरूप में पूरा करने का भाव स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे प्रयुक्त है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यन्तरण है और उसे किसी उपाधि से नहीं बदलता।
- issue: בְּנֵי יִשְׂרָאֵל में लिंग और सामुदायिक सन्दर्भ
  choice: इस्राएल के पुत्रों
  alternative: इस्राएली / इस्राएल की सन्तान
  rationale: चुना हुआ रूप मूल के व्याकरणिक पुल्लिंग और वाचाई पदनाम को बनाए रखता है; साथ ही पादटिप्पणी यह बताती है कि यहाँ केवल पुरुष नहीं, पूरा समुदाय अभिप्रेत है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘मण्डली’ सामुदायिक-सभा का औपचारिक भाव देता है; वाक्य-विन्यास हिन्दी में स्वाभाविक रखते हुए मूल की आज्ञात्मक विषयवस्तु और शब्दार्थगत अस्पष्टता सुरक्षित रखी गई है।
