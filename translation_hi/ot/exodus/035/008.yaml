lexical_decisions:
- source_word: שֶׁמֶן
  choice: तेल
  rationale: इब्रानी संज्ञा सामान्य रूप से तेल को दर्शाती है; इस प्रसंग में जैतून का तेल अभिप्रेत हो सकता है, पर मूल पाठ में उसकी विशिष्टता स्पष्ट नहीं की गई है।
- source_word: לַמָּאוֹר
  choice: दीपक जलाने के लिए
  rationale: शाब्दिक अर्थ ‘प्रकाश के लिए’ है, पर मिलापवाले तंबू की सामग्री-सूची में आशय प्रकाश देने वाले दीपक को जलाने के लिए तेल से है; यह हिंदी में स्वाभाविक और स्पष्ट है।
- source_word: בְשָׂמִים
  choice: सुगंधित द्रव्य
  rationale: बहुवचन शब्द उन सुगंधयुक्त पदार्थों को दर्शाता है जिनका उपयोग पवित्र मिश्रण तैयार करने में होता था; ‘द्रव्य’ मसालों तक अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: अभिषेक का तेल
  rationale: यह स्थापित उपासना-संबंधी पदबंध है और निश्चित अनुष्ठानिक वस्तु को सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: קְטֹרֶת
  choice: धूप
  rationale: इस पवित्र-स्थान संबंधी प्रसंग में यह जलाए जाने वाले सुगंधित धूप-द्रव्य को दर्शाता है।
- source_word: הַסַּמִּים
  choice: सुगंधित
  rationale: पूरा पदबंध शाब्दिक रूप से ‘सुगंधित द्रव्यों की धूप’ है; मुख्य पाठ में ‘सुगंधित धूप’ सहज है, जबकि अधिक रूपगत विकल्प पाद-टिप्पणी में सुरक्षित रखा गया है।
