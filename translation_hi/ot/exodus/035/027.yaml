    text: हिब्रू शब्द छाती पर पहने जाने वाले याजकीय आभूषण को दर्शाता है, युद्ध में पहने जाने वाले कवच को नहीं।
    reason: lexical_clarification
lexical_decisions:
- source_word: וְהַנְּשִׂאִם
  choice: और अगुए
  rationale: נְשִׂיאִים यहाँ समुदाय के प्रमुख प्रतिनिधियों को दर्शाता है। ‘अगुए’ स्वाभाविक आधुनिक हिन्दी है और राजवंशीय अर्थ नहीं जोड़ता।
- source_word: הֵבִיאוּ
  choice: लाए
  rationale: בוא के हिफ़ील रूप का यहाँ सीधा अर्थ सामग्री लाना है; ‘लाए’ संक्षिप्त और प्रसंगानुकूल है।
- source_word: אַבְנֵי הַשֹּׁהַם
  choice: सुलेमानी पत्थर
  rationale: שֹׁהַם की पारंपरिक पहचान सुलेमानी पत्थर (onyx) के रूप में होती है, पर सटीक खनिज अनिश्चित होने के कारण विकल्प पादटिप्पणी में रखा गया है।
- source_word: אַבְנֵי הַמִּלֻּאִים
  choice: जड़ने के लिए रत्न
  rationale: मंदिर-आभूषण के इस प्रसंग में מִלֻּאִים उन रत्नों को सूचित करता है जिन्हें आभूषण में जड़ा जाना था। यह हिन्दी अभिव्यक्ति उनके प्रयोजन को स्पष्ट करती है।
- source_word: לָאֵפֹד
  choice: एपोद के लिए
  rationale: אֵפֹד याजकीय परिधान का विशिष्ट नाम है; इसका सटीक हिन्दी पर्याय न होने से प्रचलित लिप्यंतरण रखा गया है।
- source_word: וְלַחֹשֶׁן
  choice: और वक्षपट के लिए
  rationale: חֹשֶׁן छाती पर पहना जाने वाला याजकीय आभूषण था। ‘वक्षपट’ गरिमापूर्ण और संक्षिप्त है तथा ‘चपरास’ जैसे अप्रचलित शब्द से अधिक बोधगम्य है।
