  text: the finely woven garments for ministering in the sanctuary[a], the holy garments for Aaron the priest[b], and the garments of his sons for serving as priests.
translation:
  language: hi
  text: पवित्रस्थान में सेवा करने के लिए बारीकी से बुने हुए वस्त्र[a], याजक हारून के पवित्र वस्त्र, और याजक के रूप में सेवा करने के लिए उसके पुत्रों के वस्त्र।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सेवा के वस्त्र’; इब्रानी शब्द विशेष रूप से बुने हुए सेवा-वस्त्रों को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּגְדֵי הַשְּׂרָד
  choice: बारीकी से बुने हुए वस्त्र
  rationale: यह पदबंध विशेष रूप से तैयार किए गए वस्त्रों को सूचित करता है। हिन्दी में यह अभिव्यक्ति उनकी उत्कृष्ट बुनावट को स्वाभाविक ढंग से सामने लाती है; साथ ही वैकल्पिक अर्थ को पादटिप्पणी में रखा गया है।
- source_word: לְשָׁרֵת בַּקֹּדֶשׁ
  choice: पवित्रस्थान में सेवा करने के लिए
  rationale: इस संदर्भ में क्रिया पवित्र उपासना-संबंधी सेवा को और בַּקֹּדֶשׁ तम्बू के पवित्र क्षेत्र को सूचित करता है। 'पवित्रस्थान' सामान्य पाठक के लिए स्पष्ट और प्रसंगानुकूल है।
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  choice: पवित्र वस्त्र
  rationale: यह इब्रानी पदबंध का सीधा और प्रचलित हिन्दी रूप है तथा याजकीय उपयोग के लिए अलग किए गए वस्त्रों का भाव बनाए रखता है।
- source_word: לְאַהֲרֹן הַכֹּהֵן
  choice: याजक हारून के
  rationale: यह हारून के पद को स्वाभाविक हिन्दी में स्पष्ट करता है और मूल के संबंध को बनाए रखता है।
- source_word: בִּגְדֵי בָנָיו
  choice: उसके पुत्रों के वस्त्र
  rationale: यह मूल संरचना और हारून से संबंधित सर्वनाम, दोनों को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: לְכַהֵן
  choice: याजक के रूप में सेवा करने के लिए
  rationale: כהן का यह क्रियारूप केवल सामान्य सेवा नहीं, बल्कि याजक का कार्य करने को दर्शाता है; चुना हुआ रूप इस क्रियात्मक अर्थ को स्पष्ट रखता है।
theological_decisions:
- issue: בִּגְדֵי הַשְּׂרָד और בִּגְדֵי הַקֹּדֶשׁ के बीच संबंध
  choice: पहले पदबंध को पवित्रस्थान की सेवा हेतु बारीकी से बुने वस्त्रों की अलग सूची-वस्तु माना गया है, जिसके बाद हारून और उसके पुत्रों के याजकीय वस्त्र आते हैं।
  alternative: दोनों पदबंधों को समान वस्त्रों के दो वर्णन मानना।
  rationale: दोहराया गया אֶת सूची में अलग वस्तुओं की ओर संकेत करता है। फिर भी הַשְּׂרָד का अर्थ पूर्णतः निश्चित नहीं है, इसलिए उसकी वैकल्पिक समझ पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘याजक’ और ‘पवित्रस्थान’ निर्गमन के उपासना-संबंधी संदर्भ को स्पष्ट करते हैं; बाद की किसी विशिष्ट सम्प्रदायगत शब्दावली से बचा गया है।
