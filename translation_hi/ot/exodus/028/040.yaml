base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/040.yaml
  text: For Aaron’s sons you shall make tunics[a], and you shall make sashes for them, and you shall make caps for them, for glory and for beauty.
translation:
  language: hi
  text: हारून के पुत्रों के लिए कुरते बनाना, उनके लिए कमरबंद बनाना, और उनके लिए सिर के वस्त्र[a] बनाना—गरिमा और शोभा के लिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “टोपियाँ,” “पगड़ियाँ,” अथवा “शिरोवस्त्र”; मूल शब्द याजकों के सिर पर पहने जाने वाले वस्त्र को दर्शाता है, जिसकी ठीक आकृति निश्चित नहीं है।
    reason: शिरोवेष के लिए प्रयुक्त इब्रानी शब्द के कई संभव रूप हैं।
lexical_decisions:
- source_word: לִבְנֵי אַהֲרֹן
  choice: हारून के पुत्रों के लिए
  rationale: यह सीधा पुत्र-संबंध बनाए रखता है और इसे व्यापक अर्थ में ‘वंशज’ नहीं बनाता।
- source_word: תַּעֲשֶׂה / וְעָשִׂיתָ
  choice: बनाना
  rationale: इस निर्देशात्मक प्रसंग में हिंदी का आज्ञार्थक ‘बनाना’ आदेश की दृढ़ता और क्रमबद्ध शैली को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כֻתֳּנֹת
  choice: कुरते
  rationale: यह शरीर पर पहने जाने वाले मूल लंबे वस्त्र का सरल और आधुनिक हिंदी समतुल्य है; ‘कोट’ आधुनिक अर्थ में भ्रामक हो सकता है।
- source_word: אַבְנֵטִים
  choice: कमरबंद
  rationale: यह कमर के चारों ओर बाँधे जाने वाले कपड़े के पट्टे को व्यक्त करता है और कठोर आधुनिक बेल्ट का संकेत नहीं देता।
- source_word: מִגְבָּעוֹת
  choice: सिर के वस्त्र[a]
  rationale: मूल शब्द याजकीय शिरोवेष को दर्शाता है, पर उसकी ठीक आकृति निश्चित नहीं है। यह चयन अनावश्यक रूप से ‘टोपी’ या ‘पगड़ी’ तय किए बिना अर्थ स्पष्ट करता है।
- source_word: לְכָבוֹד
  choice: गरिमा के लिए
  rationale: כָבוֹד के सम्मान, प्रतिष्ठा और वैभव के भाव को इस वस्त्र-संदर्भ में स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: וּלְתִפְאָרֶת
  choice: और शोभा के लिए
  rationale: यह सौंदर्य, अलंकरण और वैभव के भाव को स्पष्ट रखता है तथा ‘गरिमा’ के साथ स्वाभाविक युग्म बनाता है।
theological_decisions:
- issue: याजकीय वस्त्रों के उद्देश्य का वाक्यांश
  choice: गरिमा और शोभा के लिए
  alternative: महिमा और सुंदरता के लिए
  rationale: यह वस्त्रों के सम्मानजनक और सौंदर्यपूर्ण उद्देश्य को सुरक्षित रखता है, पर पाठ में उपस्थित न होने वाला बाद का प्रतीकात्मक अर्थ नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। आज्ञार्थक ‘बनाना’ निर्गमन के निर्देशात्मक प्रसंग के अनुकूल है। ‘सिर के वस्त्र’ सामान्य पाठक के लिए बोधगम्य है और मूल शब्द की आकृति-संबंधी अनिश्चितता को बनाए रखता है।
