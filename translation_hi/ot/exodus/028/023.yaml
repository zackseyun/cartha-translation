translation:
  language: hi
  text: तू चपरास पर सोने के दो छल्ले बनाएगा और उन दोनों छल्लों को चपरास के दोनों सिरों पर लगाएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: तू ... बनाएगा
  rationale: निर्देशों की इस शृंखला में संयोजक वाव के साथ पूर्ण क्रिया आज्ञार्थक भाव रखती है; हिंदी का सामान्य भविष्यत् रूप यहाँ विधिसूचक आदेश को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַחֹשֶׁן
  choice: चपरास
  rationale: निर्गमन 28 में यह महायाजक के वक्ष पर पहने जाने वाले विशिष्ट पुरोहितीय उपकरण का पारंपरिक और संक्षिप्त हिंदी नाम है।
- source_word: שְׁתֵּי טַבְּעוֹת זָהָב
  choice: सोने के दो छल्ले
  rationale: यह सामग्री और संख्या दोनों को स्पष्ट, स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: וְנָתַתָּ
  choice: लगाएगा
  rationale: संदर्भ में छल्लों को निर्धारित स्थान पर जोड़ने या रखने की क्रिया है; 'लगाएगा' हिंदी में भौतिक संयोजन को स्पष्ट करता है।
- source_word: עַל שְׁנֵי קְצֹוֹת הַחֹשֶׁן
  choice: चपरास के दोनों सिरों पर
  rationale: קָצֶה का मूल अर्थ सिरा या छोर है; 'दोनों सिरों पर' हिब्रू की संख्या और स्थान-संबंध दोनों को सहज हिंदी में सुरक्षित रखता है।
