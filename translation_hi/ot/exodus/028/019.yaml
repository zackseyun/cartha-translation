  rationale: इस प्राचीन रत्न की ठीक आधुनिक पहचान अनिश्चित है। किसी एक खनिज को निश्चित मानने के बजाय स्रोत नाम का लिप्यंतरण रखा गया है और सम्भावित पहचान पादटिप्पणी में दी गई है।
- source_word: שְׁבוֹ
