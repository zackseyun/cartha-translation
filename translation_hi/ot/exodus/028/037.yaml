  text: और तू उसे नीली डोरी[a] पर लगाए; वह पगड़ी पर हो; वह पगड़ी के सामने की ओर हो[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “नीले रंग का धागा” अथवा “नीले रंग का फीता।”
