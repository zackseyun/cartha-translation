    text: इब्रानी पदबंध का शाब्दिक अर्थ है, “पगड़ी के सामने के भाग की ओर” या “पगड़ी के सामने के सम्मुख।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתָּ אֹתוֹ
  choice: और तू उसे ... लगाना
  rationale: שׂים का अर्थ ‘रखना, लगाना, स्थापित करना’ है। डोरी और सोने की पट्टी के प्रसंग में ‘लगाना’ स्वाभाविक है और निर्देश का सीधा भाव बनाए रखता है।
- source_word: פְּתִיל
  choice: डोरी
  rationale: यह शब्द बाँधने या लगाने में प्रयुक्त डोरी, धागे या फीते को दर्शाता है। यहाँ ‘डोरी’ सामान्य पाठक के लिए स्पष्ट और वस्तु के कार्य के अनुकूल है।
- source_word: תְּכֵלֶת
  choice: नीले रंग की
  rationale: תְּכֵלֶת पवित्र-स्थान की सामग्रियों में प्रयुक्त विशिष्ट मूल्यवान नीले रंग अथवा उससे रंगे वस्त्र को दर्शाता है। सटीक छाया अनिश्चित होने के कारण व्यापक और स्पष्ट ‘नीला रंग’ रखा गया है।
- source_word: מִצְנֶפֶת
  choice: पगड़ी
  rationale: यह महायाजक के सिर पर लपेटे जाने वाले शिरोवस्त्र का शब्द है; आधुनिक मानक हिन्दी में ‘पगड़ी’ सटीक और सहज है।
- source_word: אֶל מוּל פְּנֵי
  choice: सामने की ओर
  rationale: यह पदबंध सामने की दिशा या मुखवाले भाग में स्थिति बताता है। ‘सामने की ओर’ मूल की दिशात्मकता बनाए रखता है, जबकि पादटिप्पणी अधिक शाब्दिक संभावना स्पष्ट करती है।
- source_word: יִהְיֶה
  choice: वह होगा
  rationale: अंतिम क्रिया स्थान-संबंधी निर्देश को दोहराती और बल देती है; हिन्दी में पुनरावृत्ति रखकर इब्रानी संरचना का जोर सुरक्षित किया गया है।
