  naturalness: “और तू उसे ... लगाना” is not smooth modern standard Hindi in this syntactic setting, and “वह ... होगा” is an awkward rendering for an instructional requirement. A subjunctive/jussive formulation is natural, direct, and preserves the Hebrew’s repeated placement language.
  terminology: “नीली डोरी” and “पगड़ी” are suitable. The alternate “फीता” is possible but less precise than “रस्सी/डोरी” in this context; retaining it in the lexical-alternative footnote is acceptable. The footnote for b should avoid the confusing doubled expression “सामने की ओर/सामने के भाग के सम्मुख.”
