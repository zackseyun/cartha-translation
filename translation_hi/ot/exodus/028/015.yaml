  text: וְ/עָשִׂ֜יתָ חֹ֤שֶׁן מִשְׁפָּט֙ מַעֲשֵׂ֣ה חֹשֵׁ֔ב כְּ/מַעֲשֵׂ֥ה אֵפֹ֖ד תַּעֲשֶׂ֑/נּוּ זָ֠הָב תְּכֵ֨לֶת וְ/אַרְגָּמָ֜ן וְ/תוֹלַ֧עַת שָׁנִ֛י וְ/שֵׁ֥שׁ מָשְׁזָ֖ר תַּעֲשֶׂ֥ה אֹתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/015.yaml
  text: 'You shall make a breastpiece of judgment[a], the work of a skillful designer; like the work of the ephod you shall make it: of gold, blue, purple, scarlet yarn[b], and finely twisted linen you shall make it.'
translation:
  language: hi
  text: “तुम कुशल शिल्पी की कारीगरी से न्याय की छाती-पट्टी बनाना; उसे एपोद की कारीगरी के अनुसार बनाना। उसे सोने, नीले, बैंगनी और किरमिजी सूत तथा महीन बटे हुए सन से बनाना।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֹשֶׁן
  choice: छाती-पट्टी
  rationale: यह महायाजक की छाती पर पहने जाने वाले विशिष्ट अलंकृत पुरोहितीय उपकरण को दर्शाता है। ‘छाती-पट्टी’ कवच का भ्रामक संकेत दिए बिना उसके रूप और स्थान को स्पष्ट करता है।
- source_word: מִשְׁפָּט
  choice: न्याय की
  rationale: समास की औपचारिक अस्पष्टता और न्यायिक अथवा निर्णय-संबंधी अर्थ को बनाए रखता है; पद में उसके कार्य की विधि नहीं बताई गई है।
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: कुशल कारीगर की कारीगरी से
  rationale: वाक्यांश विशेषज्ञता से रची गई नमूनेदार कारीगरी को सूचित करता है। यह हिन्दी में स्वाभाविक है और केवल बुनाई या कढ़ाई तक अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: כְּמַעֲשֵׂה אֵפֹד
  choice: एपोद के समान
  rationale: छाती-पट्टी को एपोद जैसी सामग्री और कारीगरी से बनाने की तुलना को संक्षिप्त और स्पष्ट रूप में व्यक्त करता है।
- source_word: אֵפֹד
  choice: एपोद
  rationale: यह एक विशिष्ट पुरोहितीय परिधान का तकनीकी नाम है, जिसका कोई पूर्ण और संक्षिप्त हिन्दी पर्याय नहीं है; इसलिए लिप्यंतरण उचित है।
- source_word: זָהָב
  choice: सोना
  rationale: निर्माण-सामग्री के सामान्य अर्थ को सीधे व्यक्त करता है।
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: नीले, बैंगनी और लाल रंग का सूत
  rationale: रंग-संज्ञाओं को वस्त्र-निर्माण की सामग्री के रूप में स्पष्ट करने के लिए ‘सूत’ जोड़ा गया है; लाल रंग का पद विशेष रूप से किरमिजी/सुर्ख लाल रंगी सामग्री को दर्शाता है।
- source_word: שֵׁשׁ מָשְׁזָר
  choice: बारीक बटा हुआ मलमल
  rationale: तम्बू-वस्त्रों के संदर्भ में बारीक सन के धागों से बने, बटे हुए उत्तम कपड़े को दर्शाता है। ‘मलमल’ आधुनिक हिन्दी में महीन लिनन-सदृश कपड़े के लिए सुबोध पारंपरिक पद है।
- source_word: תַּעֲשֶׂנּוּ ... תַּעֲשֶׂה אֹתוֹ
  choice: बनाना ... उसे बनाना
  rationale: इब्रानी की दोहराई गई आज्ञात्मक निर्देश-शैली को हिन्दी में भी बनाए रखा गया है।
theological_decisions:
- issue: חֹשֶׁן מִשְׁפָּט का कार्य
  choice: ‘न्याय की छाती-पट्टी’
  alternative: ‘निर्णय की छाती-पट्टी’ अथवा ‘न्याय के लिए छाती-पट्टी’
  rationale: इब्रानी समास न्याय, निर्णय या न्यायिक प्रयोजन से संबंध व्यक्त कर सकता है, पर यह पद उसकी सटीक रीति नहीं बताता। औपचारिक अनुवाद धार्मिक और न्यायिक अनुगूँज को बनाए रखते हुए अर्थ को संकीर्ण नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और निर्देशात्मक शैली रखी गई है। तकनीकी पुरोहितीय शब्द ‘एपोद’ को लिप्यंतरित किया गया है। ‘छाती-पट्टी’ सामान्य पाठक के लिए दृश्य रूप से स्पष्ट है और ‘कवच’ जैसी सैन्य धारणा से बचाता है।
