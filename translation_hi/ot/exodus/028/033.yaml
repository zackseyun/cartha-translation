  yaml_path: translation/ot/exodus/028/033.yaml
  text: You shall make on its hem pomegranates of blue and purple and scarlet yarn[a], all around its hem, with bells of gold between them all around.
translation:
  language: hi
  text: तुम उसके निचले किनारे पर नीले, बैंगनी और लाल रंग के धागों से अनार[a] बनाओ, और उसके निचले किनारे के चारों ओर उनके बीच-बीच में सोने की घंटियाँ लगाओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अनार के आकार की सजावट।” इब्रानी में शाब्दिक रूप से “अनार” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: तुम ... बनाना
  rationale: निर्देशात्मक प्रसंग में संयोजक वाव के साथ पूर्ण क्रिया आज्ञार्थक भाव रखती है; आधुनिक हिन्दी में यह निर्माण-निर्देश का स्वाभाविक रूप है।
- source_word: שׁוּלָיו
  choice: उसके निचले किनारे
  rationale: यह वस्त्र के नीचे के छोर या घेर को सूचित करता है; ‘निचला किनारा’ सामान्य पाठक के लिए स्पष्ट है।
- source_word: רִמֹּנֵי
  choice: अनार
  rationale: इब्रानी में शाब्दिक शब्द ‘अनार’ है। प्रसंग में ये संभवतः अनार के आकार की सजावट हैं, पर मुख्य पाठ स्रोत की संक्षिप्त अभिव्यक्ति बनाए रखता है।
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: नीले, बैंगनी और लाल रंग के धागे से
  rationale: ये पवित्र तम्बू के वस्त्रों में प्रयुक्त रंगीन कपड़ा/धागा सूचित करते हैं। हिन्दी में ‘धागे से’ जोड़ने पर सजावटी अनार बनाने का आशय स्वाभाविक और स्पष्ट होता है।
- source_word: סָבִיב
  choice: चारों ओर
  rationale: यह पूरे निचले किनारे के चारों तरफ फैली व्यवस्था बताता है।
- source_word: וּפַעֲמֹנֵי זָהָב
  choice: सोने की घंटियाँ
  rationale: यह अतिरिक्त सजावटी वस्तुओं को जोड़ता है; ‘सोने की घंटियाँ’ निकट और स्वाभाविक हिन्दी है।
- source_word: בְּתוֹכָם
  choice: उनके बीच-बीच में
  rationale: घंटियों के अनारों के मध्य, अर्थात् क्रमशः उनके बीच रखे जाने का स्थानिक संबंध स्पष्ट करता है।
