base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/041.yaml
  text: You shall clothe Aaron your brother and his sons with him[a], and you shall anoint them and ordain them and consecrate them, and they shall serve as priests to me.
translation:
  language: hi
  text: तू अपने भाई हारून और उसके साथ उसके पुत्रों को ये वस्त्र पहनाना। फिर उनका अभिषेक करना, उन्हें याजक-पद पर नियुक्त करना[a] और उन्हें पवित्र ठहराना; तब वे मेरे लिए याजक का काम करेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उनके हाथ भरना”; यह किसी को याजकीय सेवा में विधिवत नियुक्त करने का इब्रानी मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִלְבַּשְׁתָּ
  choice: तू ... ये वस्त्र पहनाना
  rationale: हिफ़ील रूप का कारक अर्थ है कि मूसा उन्हें वस्त्र पहनाए। पिछले प्रसंग में बताए गए याजकीय वस्त्रों को स्पष्ट करने के लिए स्वाभाविक हिन्दी में ‘ये वस्त्र’ रखा गया है।
- source_word: אֹתָם אֶת־אַהֲרֹן אָחִיךָ וְאֶת־בָּנָיו אִתּוֹ
  choice: अपने भाई हारून और उसके साथ उसके पुत्रों को
  rationale: आरम्भिक कर्मवाचक सर्वनाम के बाद हारून और उसके पुत्रों द्वारा उसका आशय स्पष्ट होता है। हिन्दी में नामों को सीधे कर्म बनाना अधिक स्वाभाविक है और ‘उसके साथ’ इब्रानी אִתּוֹ को बनाए रखता है।
- source_word: וּמָשַׁחְתָּ אֹתָם
  choice: उनका अभिषेक करना
  rationale: याजकीय प्रतिष्ठापन के संदर्भ में משׁח तेल से किए जाने वाले विधिवत अभिषेक का प्रचलित और सटीक शब्द है।
- source_word: וּמִלֵּאתָ אֶת־יָדָם
  choice: उन्हें याजक-पद पर नियुक्त करना
  rationale: शाब्दिक अर्थ ‘उनके हाथ भरना’ है, पर यह याजकीय सेवा में विधिवत प्रतिष्ठित करने का इब्रानी मुहावरा है। ‘याजक-पद पर नियुक्त’ अर्थ को स्पष्ट करता है और किसी बाद की विशिष्ट सांप्रदायिक अभिषेक-विधि को आरोपित नहीं करता।
- source_word: וְקִדַּשְׁתָּ אֹתָם
  choice: उन्हें पवित्र ठहराना
  rationale: קדשׁ यहाँ पवित्र सेवा के लिए अलग ठहराने को दर्शाता है। ‘पवित्र ठहराना’ धार्मिक अर्थ और क्रियात्मक भाव दोनों को सुरक्षित रखता है।
- source_word: וְכִהֲנוּ לִי
  choice: वे मेरे लिए याजक का काम करेंगे
  rationale: כהן का पिएल रूप याजक के रूप में कार्य या सेवा करने को बताता है। ‘याजक का काम करेंगे’ पद और उसके कार्यात्मक भाव दोनों को सहज हिन्दी में व्यक्त करता है; ‘मेरे लिए’ לִי को सुरक्षित रखता है।
theological_decisions:
- issue: याजकीय प्रतिष्ठापन के मुहावरे מִלֵּא אֶת־יָד का अनुवाद
  choice: मुख्य पाठ में ‘याजक-पद पर नियुक्त करना’
  alternative: ‘उनके हाथ भरना’ अथवा ‘उन्हें प्रतिष्ठित करना’
  rationale: शाब्दिक अनुवाद आधुनिक हिन्दी में अस्पष्ट होगा। चुना हुआ पाठ इस प्रसंग में औपचारिक याजकीय नियुक्ति व्यक्त करता है, जबकि पादटिप्पणी मूल मुहावरे को पारदर्शी बनाती है।
- issue: וְכִהֲנוּ לִי का काल और संबंध
  choice: ‘तब वे मेरे लिए याजक का काम करेंगे’
  alternative: ‘और वे मेरे लिए याजक का काम करें’
  rationale: आज्ञासूचक क्रियाओं के बाद आया रूप प्रतिष्ठापन के परिणामस्वरूप होने वाली सेवा बताता है। ‘तब’ इस संबंध को स्वाभाविक हिन्दी में व्यक्त करता है, बिना सेवा के परमेश्वर-केंद्रित स्वर को बदलने के।
translation_notes:
  register: आधुनिक मानक हिन्दी में सम्मानपूर्ण किंतु सुबोध शैली अपनाई गई है। परमेश्वर द्वारा मूसा को सीधे संबोधन के अनुरूप एकवचन ‘तू’ और आज्ञार्थक रूप रखे गए हैं। ‘याजक-पद’ मुहावरे का प्रसंगगत आशय स्पष्ट करता है, और पादटिप्पणी मूल इब्रानी रूप को सुरक्षित रखती है।
