base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/027.yaml
  text: You shall make two rings of gold and put them on the two shoulder-pieces of the ephod[a], underneath, on its front side, opposite its seam[b], above the skillfully woven band of the ephod.
translation:
  language: hi
  text: तुम सोने के दो छल्ले बनाओ और उन्हें एपोद के दोनों कंधे-भागों पर, नीचे, उसके सामने वाले भाग में, उसके जोड़[a] के ठीक सामने, एपोद के कुशलता से बुने हुए पट्टे[b] के ऊपर लगाओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसके जुड़ने के स्थान’ अथवा ‘उसके लगाव के स्थान’। इब्रानी शब्द सामान्य रूप से उस जगह को दर्शाता है जहाँ एपोद जुड़ता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘एपोद के बुने हुए कमरबंद’। इब्रानी शब्द חֵשֶׁב एपोद के विशेष रूप से बनाए गए पट्टे या बाँधने वाले भाग को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: טַבְּעוֹת
