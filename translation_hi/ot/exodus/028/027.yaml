  rationale: यह शब्द यहाँ बाँधने के काम आने वाले धातु के छल्लों को दर्शाता है; याजकीय वस्त्र के संदर्भ में ‘छल्ले’ स्वाभाविक और सटीक है।
- source_word: כִתְפוֹת
  choice: कंधे के भाग
  rationale: शाब्दिक संबंध ‘कंधों’ से है, पर वस्त्र-निर्माण के संदर्भ में एपोद के कंधों पर आने वाले हिस्से अभिप्रेत हैं।
- source_word: הָאֵפוֹד
  choice: एपोद
  rationale: यह याजकीय वस्त्र का तकनीकी नाम है; संक्षिप्त और पूर्ण हिंदी पर्याय न होने के कारण लिप्यंतरण रखा गया है।
- source_word: מִלְּמַטָּה
  choice: नीचे की ओर
  rationale: यह एपोद के निचले या भीतरी स्थान की ओर स्थिति बताता है; हिंदी में यह स्थान-संबंध स्वाभाविक रूप से व्यक्त होता है।
- source_word: מִמּוּל פָּנָיו
  choice: उसके सामने की तरफ
  rationale: वस्तु के ‘मुख’ के सामने वाले भाग का इब्रानी मुहावरा हिंदी में सामने की तरफ के रूप में स्पष्ट किया गया है।
- source_word: לְעֻמַּת מֶחְבַּרְתּוֹ
  choice: उसके जोड़ के सामने
  rationale: לְעֻמַּת स्थानगत अनुरूपता या आमने-सामने की स्थिति बताता है और מֶחְבֶּרֶת जुड़ने के स्थान को; अनिश्चितता को पाद-टिप्पणी में रखा गया है।
- source_word: לְחֵשֶׁב הָאֵפֹד
  choice: एपोद के कुशलता से बुने हुए पट्टे
  rationale: חֵשֶׁב एपोद के विशेष रूप से निर्मित पट्टे या कमरबंद-जैसे भाग को दर्शाता है; संदर्भ उसकी कुशल बुनावट पर भी बल देता है।
