source:
  edition: WLC
  text: וְ/נָשָׂ֣א אַ֠הֲרֹן אֶת שְׁמ֨וֹת בְּנֵֽי יִשְׂרָאֵ֜ל בְּ/חֹ֧שֶׁן הַ/מִּשְׁפָּ֛ט עַל לִבּ֖/וֹ בְּ/בֹא֣/וֹ אֶל הַ/קֹּ֑דֶשׁ לְ/זִכָּרֹ֥ן לִ/פְנֵֽי יְהוָ֖ה תָּמִֽיד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/029.yaml
  text: Aaron shall carry the names of the sons of Israel in the breastpiece of judgment over his heart when he goes into the Holy Place[d][c][b][a], for a memorial before Yahweh continually.
translation:
  language: hi
  text: हारून इस्राएल के पुत्रों[c] के नाम न्याय की छाती-पट्टी[b] में अपने हृदय पर धारण करेगा[a], जब वह पवित्रस्थान में प्रवेश करेगा, यहोवा के सामने निरन्तर स्मरणार्थ[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘वहन करेगा।’
    reason: lexical_alternative
  - marker: b
    text: या ‘निर्णय की छाती-पट्टी।’ यह इब्रानी नाम सम्भवतः उस याजकीय छाती-पट्टी को दर्शाता है जिसका सम्बन्ध परमेश्वर के सामने न्याय या निर्णय जानने से था।
    reason: alternative_reading
  - marker: c
    text: शाब्दिक अर्थ ‘इस्राएल के पुत्र’; यह वंशावली-सूचक अभिव्यक्ति इस्राएल से निकले गोत्रों को दर्शाती है।
    reason: lexical_alternative
  - marker: d
    text: या ‘यहोवा के सामने स्मारक के रूप में।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָשָׂא
  choice: धारण किए रहे
  rationale: נשא का अर्थ उठाना, ढोना या धारण करना है। वस्त्र पर नामों को अपने ऊपर लिए रहने के इस याजकीय प्रसंग में ‘धारण किए रहे’ स्वाभाविक और ठोस अर्थ को सुरक्षित रखता है।
- source_word: שְׁמוֹת
  choice: नाम
  rationale: बहुवचन संज्ञा का सीधा अनुवाद; यहाँ छाती-पट्टी पर अंकित नाम अभिप्रेत हैं।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: इब्रानी वंशावली-सूचक अभिव्यक्ति को यथासम्भव औपचारिक रूप से रखा गया है; सन्दर्भ में यह इस्राएल से निकले गोत्रों को दर्शाती है।
- source_word: בְּחֹשֶׁן הַמִּשְׁפָּט
  choice: न्याय की छाती-पट्टी
  rationale: חֹשֶׁן याजकीय छाती-पट्टी है और מִשְׁפָּט न्याय या निर्णय का बोध कराता है। औपचारिक पदबंध इसकी विशिष्ट उपासना-संबंधी भूमिका को किसी एक व्याख्या तक सीमित नहीं करता।
- source_word: עַל לִבּוֹ
  choice: अपने हृदय के ऊपर
  rationale: यह छाती-पट्टी के स्थान और उसके प्रतिनिधिक प्रतीक—दोनों को व्यक्त करने वाला स्थानवाचक चित्र है।
- source_word: בְּבֹאוֹ אֶל הַקֹּדֶשׁ
  choice: जब हारून पवित्रस्थान में प्रवेश करे
  rationale: उपसर्ग ב के साथ infinitive construct समय बताता है। तम्बू के प्रसंग में הַקֹּדֶשׁ पवित्र उपासना-स्थान को दर्शाता है।
- source_word: לְזִכָּרוֹן
  choice: स्मरण का चिह्न
  rationale: यह यहोवा के सामने स्मरण कराने वाले प्रतीक या स्मारक का उद्देश्य व्यक्त करता है। हिन्दी में ‘स्मरण का चिह्न’ अर्थ को स्पष्ट और स्वाभाविक रखता है।
- source_word: לִפְנֵי יְהוָה
  choice: यहोवा के सामने
  rationale: मानक इब्रानी मुहावरा, जिसका अर्थ यहोवा के सम्मुख या उसकी उपस्थिति में है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम को हिन्दी में प्रचलित रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: תָּמִיד
  choice: निरन्तर
  rationale: यह याजकीय सेवा में नियमित, सतत बने रहने का भाव देता है।
theological_decisions:
- issue: उपासना-संबंधी पद חֹשֶׁן הַמִּשְׁפָּט का अनुवाद
  choice: न्याय की छाती-पट्टी
  alternative: निर्णय की छाती-पट्टी
  rationale: מִשְׁפָּט में न्याय और निर्णय दोनों अर्थ सम्भव हैं। मुख्य पाठ में अपेक्षाकृत औपचारिक ‘न्याय’ रखा गया है और वैकल्पिक अर्थ पादटिप्पणी में दिया गया है, जिससे याजकीय वस्तु की भूमिका को अनावश्यक रूप से संकुचित न किया जाए।
- issue: בְּנֵי יִשְׂרָאֵל का वंशावली-सूचक रूप
  choice: इस्राएल के पुत्रों
  alternative: इस्राएलियों
  rationale: मूल का शाब्दिक और वंशावली-सूचक रूप बनाए रखा गया है, जबकि पादटिप्पणी स्पष्ट करती है कि सामूहिक रूप से इस्राएल से निकले गोत्र अभिप्रेत हैं।
- issue: הַקֹּדֶשׁ का तम्बू-संबंधी अर्थ
  choice: पवित्रस्थान
  alternative: पवित्र स्थान
  rationale: सन्दर्भ में यह सामान्य पवित्रता नहीं, बल्कि याजकीय प्रवेश का पवित्र उपासना-क्षेत्र है। संयुक्त रूप हिन्दी में उस विशिष्ट स्थल को स्वाभाविक ढंग से दर्शाता है।
- issue: לְזִכָּרוֹן की उद्देश्यात्मक अभिव्यक्ति
  choice: ताकि वे ... स्मरण का चिह्न बने रहें
  alternative: यहोवा के सामने स्मरण के लिए
  rationale: इब्रानी पदबंध संक्षिप्त है और स्मरण के चिह्न या स्मारक—दोनों रंग रखता है। हिन्दी वाक्य में नामों को कर्ता बनाकर उद्देश्य स्पष्ट किया गया है, बिना यह निश्चित किए कि स्मरण किसकी ओर से है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठक के लिए सुबोध धार्मिक गद्य। ‘छाती-पट्टी’ ठोस वस्तु को स्पष्ट करता है; ‘पवित्रस्थान’ विशिष्ट उपासना-स्थल के रूप में प्रयुक्त है। वाक्य-क्रम हिन्दी की स्वाभाविकता के लिए बदला गया है, पर मूल के सभी अर्थ-घटक और उसकी सम्भावित अस्पष्टताएँ सुरक्षित रखी गई हैं।
