source:
  edition: WLC
  text: וְ/שַׂמְתָּ֞ אֶת שְׁתֵּ֣י הָ/אֲבָנִ֗ים עַ֚ל כִּתְפֹ֣ת הָֽ/אֵפֹ֔ד אַבְנֵ֥י זִכָּרֹ֖ן לִ/בְנֵ֣י יִשְׂרָאֵ֑ל וְ/נָשָׂא֩ אַהֲרֹ֨ן אֶת שְׁמוֹתָ֜/ם לִ/פְנֵ֧י יְהוָ֛ה עַל שְׁתֵּ֥י כְתֵפָ֖י/ו לְ/זִכָּרֹֽן־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/012.yaml
  text: And you shall set the two stones on the shoulder pieces of the ephod as memorial stones for the sons of Israel[b][a], and Aaron shall bear their names before Yahweh on his two shoulders for remembrance.
translation:
  language: hi
  text: और उन दोनों पत्थरों को एपोद के कंधे के पट्टों पर इस्राएल के पुत्रों[b] के लिए स्मरण-पत्थरों[a] के रूप में लगा देना। हारून उनके नाम यहवे के सामने अपने दोनों कंधों पर स्मरण के लिए धारण करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यादगार पत्थर।”
    reason: lexical_alternative
  - marker: b
    text: “इस्राएल के पुत्र” इब्रानी की पारिवारिक और वाचा-संबंधी अभिव्यक्ति है, जो यहाँ सामूहिक रूप से इस्राएल के लोगों को सूचित करती है।
    reason: cultural_note
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: लगाना
  rationale: שׂים का अर्थ रखना/लगाना है; वस्त्र पर जड़े हुए पत्थरों के संदर्भ में ‘लगाना’ स्वाभाविक है और इब्रानी आदेश का बल बनाए रखता है।
- source_word: כִּתְפֹת הָאֵפֹד
  choice: एपोद के कंधे के पट्टों
  rationale: वस्त्र-संदर्भ में כָּתֵף यहाँ एपोद के कंधों पर लगे भागों को दर्शाता है; ‘कंधे के पट्टे’ साधारण पाठक के लिए स्पष्ट है।
- source_word: אַבְנֵי זִכָּרֹן
  choice: स्मृति के पत्थरों
  rationale: यह रचना ‘स्मरण/स्मृति के पत्थर’ का अर्थ देती है। इससे अंतिम לְזִכָּרֹן के साथ शब्दगत संबंध भी बना रहता है।
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों की
  rationale: בְּנֵי की पारिवारिक वाचा-संबंधी भाषा को अक्षुण्ण रखा गया है; संदर्भ में यह इस्राएल से उत्पन्न समुदाय का सामूहिक संकेत है।
- source_word: וְנָשָׂא ... אֶת שְׁמוֹתָם
  choice: उनके नाम ... धारण करेगा
  rationale: נשׂא का ‘उठाना/ढोना/धारण करना’ अर्थ है। याजकीय वस्त्र और प्रतिनिधित्व के संदर्भ में ‘धारण करेगा’ सहज और सटीक है।
- source_word: לִפְנֵי יְהוָה
  choice: यहवे के सामने
  rationale: לִפְנֵי उपस्थिति के सामने होने को व्यक्त करता है और יהוה को उसके व्यक्तिगत वाचा-नाम ‘यहवे’ से दिया गया है।
- source_word: עַל שְׁתֵּי כְתֵפָיו
  choice: अपने दोनों कंधों पर
  rationale: यहाँ एपोद के भागों के बजाय हारून के वास्तविक दोनों कंधे अभिप्रेत हैं; इब्रानी की ठोस छवि और ‘दोनों’ का बल रखा गया है।
- source_word: לְזִכָּרֹן
  choice: स्मरण के लिए
  rationale: यह उद्देश्य या परिणाम बताता है। ‘स्मरण के लिए’ इस बात को अनिर्णीत रहने देता है कि स्मरण मुख्यतः किसके द्वारा या किस अर्थ में है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम יהוה है; ‘यहवे’ उसे उपाधि में बदले बिना प्रस्तुत करता है।
- issue: בְּנֵי יִשְׂרָאֵל की लैंगिक और सामुदायिक अभिव्यक्ति
  choice: इस्राएल के पुत्रों
  alternative: इस्राएलियों; इस्राएल के लोगों
  rationale: मूल की वंशगत-पारिवारिक भाषा सुरक्षित रखी गई है, जबकि पाद-टिप्पणी स्पष्ट करती है कि प्रयोग सामूहिक रूप से इस्राएल के लोगों को सूचित कर सकता है।
- issue: לְזִכָּרֹן में स्मरण करने वाला कौन है
  choice: स्मरण के लिए
  alternative: यहवे को स्मरण दिलाने के लिए; इस्राएलियों की यादगार के रूप में
  rationale: इब्रानी यह स्पष्ट नहीं करता कि स्मरण का कर्ता कौन है; इसलिए अनुवाद उस धार्मिक तनाव और अस्पष्टता को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। ‘एपोद’ पारंपरिक तकनीकी वस्त्र-नाम के रूप में रखा गया है। अंतिम वाक्य में ‘इस प्रकार’ से पत्थरों के लगाए जाने और हारून द्वारा नाम धारण करने का संबंध स्वाभाविक हिन्दी में स्पष्ट किया गया है, बिना स्मरण के कर्ता को निर्धारित किए।
