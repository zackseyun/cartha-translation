translation:
  language: hi
  text: सोने की एक घंटी और एक अनार, सोने की एक घंटी और एक अनार[b]—चोगे के निचले किनारे के चारों ओर[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘चोगे के निचले किनारे पर चारों ओर।’ इब्रानी में ‘पर’ अर्थ वाला पूर्वसर्ग और ‘चारों ओर’ अर्थ वाला शब्द साथ आए हैं।
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘अनार’ से संभवतः अनार के आकार की सजावट अभिप्रेत है, जो घंटियों के बीच लगाई गई थी।
    reason: cultural_note
lexical_decisions:
- source_word: פַּעֲמֹן
  choice: घंटी
  rationale: यह शब्द याजकीय वस्त्र से जुड़ी छोटी घंटी को सूचित करता है; आधुनिक हिन्दी में ‘घंटी’ सहज और सटीक है।
- source_word: זָהָב
  choice: सोने की
  rationale: यह घंटी की सामग्री बताता है। ‘सोने की घंटी’ हिन्दी में स्वाभाविक है और इब्रानी के पदार्थवाचक प्रयोग को व्यक्त करता है।
- source_word: רִמּוֹן
  choice: अनार
  rationale: शब्द का सामान्य अर्थ ‘अनार’ है। इस प्रसंग में संभवतः अनार के आकार की सजावट अभिप्रेत है, पर मुख्य पाठ में मूल शब्द की सादगी और संभावित अस्पष्टता रखी गई है।
- source_word: עַל
  choice: पर
  rationale: मूल पूर्वसर्ग का अर्थ ‘पर’ है; निचले किनारे और סָבִיב के साथ यह पूरे किनारे पर लगी सजावट का स्थान बताता है।
- source_word: שׁוּלֵי
  choice: निचले किनारे
  rationale: वस्त्र के संदर्भ में बहुवचन रूप उसके नीचे के किनारे या घेरे को सूचित करता है। ‘निचले किनारे’ आधुनिक पाठक के लिए स्पष्ट है।
- source_word: מְעִיל
  choice: चोगा
  rationale: यह याजकीय बाहरी वस्त्र है। ‘चोगा’ आधुनिक हिन्दी में समझ में आने वाला और इस प्रकार के लंबे वस्त्र के लिए उपयुक्त शब्द है।
- source_word: סָבִיב
  choice: चारों ओर
  rationale: यह पूरे घेरे में व्यवस्था होने पर बल देता है; ‘चारों ओर’ उस व्यापकता को स्पष्ट रूप से व्यक्त करता है।
