  text: וְ/הָיָה֮ עַל מֵ֣צַח אַהֲרֹן֒ וְ/נָשָׂ֨א אַהֲרֹ֜ן אֶת עֲוֺ֣ן הַ/קֳּדָשִׁ֗ים אֲשֶׁ֤ר יַקְדִּ֨ישׁוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לְ/כָֽל מַתְּנֹ֖ת קָדְשֵׁי/הֶ֑ם וְ/הָיָ֤ה עַל מִצְח/וֹ֙ תָּמִ֔יד לְ/רָצ֥וֹן לָ/הֶ֖ם לִ/פְנֵ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/038.yaml
  text: It shall be on Aaron’s forehead[a], and Aaron shall bear the iniquity of the holy things that the sons of Israel consecrate, for all the gifts of their holy things. It shall always be on his forehead[c][b], for acceptance for them before Yahweh.
translation:
  language: hi
  text: वह हारून के माथे पर होगा। हारून उन पवित्र वस्तुओं का दोष उठाएगा[a], जिन्हें इस्राएली[c] अपनी सभी पवित्र भेंटों के संबंध में पवित्र ठहराएँगे। वह सदा उसके माथे पर रहेगा, ताकि याहवे के सामने उन्हें स्वीकृति मिले[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दोष अपने ऊपर ले।” इब्रानी मुहावरा पवित्र भेंटों से जुड़े दोष या उसके दायित्व को उठाने का अर्थ दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “ताकि उन पर कृपा हो।” इसका अर्थ यह भी हो सकता है कि वे और उनकी भेंटें याहवे के सामने स्वीकार की जाएँ।
    reason: alternative_reading
  - marker: c
    text: शाब्दिक रूप से “इस्राएल के पुत्र”; यह इस्राएल के लोगों के लिए प्रचलित वाचा-संबंधी पद है।
    reason: cultural_note
lexical_decisions:
- source_word: מֵצַח / מִצְחוֹ
  choice: माथा / उसके माथे
  rationale: यह शब्द सिर के सामने के भाग को दर्शाता है; आधुनिक हिन्दी में ‘माथा’ सबसे स्वाभाविक और स्पष्ट है।
- source_word: נָשָׂא ... עֲוֺן
  choice: दोष का भार उठाना
  rationale: यह याजकीय मुहावरा दोष या उससे जुड़ी जवाबदेही अपने ऊपर लेने का भाव रखता है। ‘दोष का भार उठाना’ इसके न्यायिक और बलिदान-संबंधी तनाव को बनाए रखता है, बिना यह तय किए कि हारून उस दोष को किस रीति से दूर करता है।
- source_word: הַקֳּדָשִׁים
  choice: पवित्र वस्तुएँ
  rationale: इस उपासना-संबंधी प्रसंग में बहुवचन पवित्र चढ़ावों या अर्पित वस्तुओं को दर्शाता है। यह हिन्दी पद उस व्यापक श्रेणी को बनाए रखता है।
- source_word: יַקְדִּישׁוּ
  choice: पवित्र ठहराएँगे
  rationale: यह परमेश्वर के लिए अलग करके अर्पित करने का कार्य व्यक्त करता है। ‘पवित्र ठहराना’ आधुनिक हिन्दी में बोधगम्य है और केवल नैतिक शुद्धि का अर्थ नहीं देता।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएली
  rationale: शाब्दिक रूप ‘इस्राएल के पुत्र’ है, पर यहाँ यह पूरे वाचा-समुदाय का सामूहिक नाम है। ‘इस्राएली’ आधुनिक हिन्दी में स्वाभाविक है और अनावश्यक रूप से केवल पुरुषों तक अर्थ सीमित नहीं करता।
- source_word: לְכָל מַתְּנֹת קָדְשֵׁיהֶם
  choice: अपने सभी पवित्र दानों के रूप में
  rationale: इब्रानी वाक्यांश का संबंध कुछ कठिन है। यह रूप ‘पवित्र वस्तुओं’ और इस्राएल के ‘दानों’ का संबंध बनाए रखते हुए हिन्दी में पठनीय है।
- source_word: תָּמִיד
  choice: सदा
  rationale: यह निरंतर उपस्थित रहने की अपेक्षा व्यक्त करता है; ‘सदा’ संक्षिप्त, स्वाभाविक और गरिमापूर्ण है।
- source_word: לְרָצוֹן לָהֶם
  choice: उन्हें स्वीकृति मिले
  rationale: वाक्यांश याहवे के सामने अनुग्रहपूर्ण स्वीकृति का उद्देश्य या परिणाम बताता है। मुख्य पाठ उपासकों की स्वीकृति को सामने रखता है, जबकि पादटिप्पणी लोगों और उनके अर्पणों के परस्पर संबंध को खुला रखती है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले व्यक्तिगत दिव्य नाम को उपाधि से बदलने के बजाय हिन्दी लिपि में नाम के रूप में प्रस्तुत किया गया है।
theological_decisions:
- issue: हारून द्वारा ‘पवित्र वस्तुओं के दोष’ को उठाने का अर्थ
  choice: हारून पवित्र अर्पणों से जुड़े दोष या दायित्व का भार अपने याजकीय प्रतिनिधि-कार्य में उठाता है।
  alternative: हारून उस पाप को सीधे दूर कर देता है; अथवा वह केवल इस्राएल के पापों की स्मृति का प्रतीकात्मक भार रखता है।
  rationale: नָשָׂא עָוֺן याजकीय संदर्भों में दोष या दायित्व उठाने का भाव दे सकता है। अनुवाद किसी पूर्ण प्रायश्चित-सिद्धांत को पद में आरोपित किए बिना इसी तनाव को सुरक्षित रखता है।
- issue: ‘उन्हें स्वीकृति मिले’ का संदर्भ
  choice: इस्राएल के लोग अपने पवित्र दानों के संबंध में याहवे के सामने स्वीकृति पाते हैं।
  alternative: केवल दान ही स्वीकार किए जाते हैं।
  rationale: ‘उनके लिए/उन्हें’ का निकटतम स्वाभाविक संदर्भ उपासक हैं, पर प्रसंग में उनके अर्पण भी सम्मिलित हैं; इसलिए पादटिप्पणी दोनों के संबंध को स्पष्ट करती है, उसे संकीर्ण नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी; शैली सहज, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। याजकीय शब्दावली को अत्यधिक तकनीकी बनाए बिना ‘पवित्र वस्तुएँ’, ‘पवित्र दान’ और ‘स्वीकृति’ जैसे पदों से मूल अर्थ-संबंध सुरक्षित रखा गया है।
