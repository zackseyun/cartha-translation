  text: और सोने की दोनों गूँथी हुई ज़ंजीरें वक्षपट के सिरों पर लगे दोनों छल्लों से लगाना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: और ... लगाना
  rationale: निर्देशों की क्रमिक शृंखला में यह रूप आज्ञार्थक भाव रखता है। निर्माण-संबंधी निर्देश में हिंदी का अनंत क्रिया-रूप ‘लगाना’ स्वाभाविक और स्पष्ट है।
- source_word: שְׁתֵּי עֲבֹתֹת הַזָּהָב
  choice: सोने की दोनों गूँथी हुई ज़ंजीरों
  rationale: עֲבֹתֹת यहाँ डोरी की तरह गूँथे या बटे हुए सजावटी स्वर्ण-शृंखला-कार्य को सूचित करता है। ‘गूँथी हुई ज़ंजीरें’ वस्तु और उसकी बनावट दोनों को स्पष्ट करता है।
- source_word: עַל שְׁתֵּי הַטַּבָּעֹת
  choice: दोनों छल्लों पर
  rationale: עַל संलग्न करने या रखने का संबंध बताता है और טַבָּעֹת के लिए वस्त्र-निर्माण के संदर्भ में ‘छल्ले’ सहज हिंदी है।
- source_word: אֶל קְצֹוֹת הַחֹשֶׁן
  choice: वक्षपट के सिरों पर
  rationale: קְצֹוֹת वस्तु के अंतिम भागों या सिरों को दर्शाता है। חֹשֶׁן याजकीय परिधान का छाती पर पहना जाने वाला विशेष भाग है; ‘वक्षपट’ इसे कवच मानने का भ्रामक संकेत दिए बिना संक्षेप और गरिमा से व्यक्त करता है।
