  yaml_path: translation/ot/exodus/028/017.yaml
  text: 'And you shall set in it settings of stones[a], four rows of stones: the first row shall be a ruby, a topaz, and an emerald.'
translation:
  language: hi
  text: और तू उसमें रत्न जड़ना[a]—रत्नों की चार पंक्तियाँ। पहली पंक्ति में माणिक, पुखराज और पन्ना हों।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इन रत्नों की ठीक-ठीक पहचान निश्चित नहीं है। “माणिक” के स्थान पर “कार्नेलियन” (लाल अकीक), “पुखराज” के स्थान पर “क्रिसोलाइट” या “पेरिडॉट,” और “पन्ना” के स्थान पर “बेरिल” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִלֵּאתָ בּוֹ מִלֻּאַת אֶבֶן
  choice: और उसमें जड़े हुए रत्न लगाना
  rationale: מלא का मूल अर्थ ‘भरना’ है, पर कारीगरी के इस संदर्भ में आशय रत्नों को कवच में जड़कर लगाने से है। यह हिंदी प्रयोग तकनीकी भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אַרְבָּעָה טוּרִים אָבֶן
  choice: रत्नों की चार पंक्तियाँ
  rationale: טוּר व्यवस्थित पंक्ति को दर्शाता है और एकवचन אֶבֶן यहाँ सामूहिक अर्थ में रत्नों को सूचित करता है।
- source_word: טוּר ... הָאֶחָד
  choice: पहली पंक्ति
  rationale: चार पंक्तियों के क्रम में यह पहली पंक्ति को सूचित करता है; आधुनिक हिंदी में यही स्वाभाविक अभिव्यक्ति है।
- source_word: אֹדֶם
  choice: माणिक
  rationale: यह किसी लाल रत्न का नाम है। सटीक खनिज-पहचान अनिश्चित है; ‘माणिक’ पारंपरिक और सामान्यतः समझा जाने वाला अनुवाद है, जबकि विकल्प पादटिप्पणी में रखा गया है।
- source_word: פִּטְדָה
  choice: पुखराज
  rationale: रत्न की सटीक पहचान अनिश्चित है। ‘पुखराज’ प्रचलित पारंपरिक समतुल्य है; अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: בָרֶקֶת
  choice: पन्ना
  rationale: शब्द चमकते रत्न की ओर संकेत करता है, पर सटीक खनिज-पहचान अनिश्चित है। ‘पन्ना’ परिचित पारंपरिक अनुवाद है और विकल्प पादटिप्पणी में सुरक्षित है।
