  to: और तू अपने भाई हारून को, और उसके साथ उसके पुत्रों को, इस्राएल के पुत्रों[a] में से, अपने पास ले आ, कि वे मेरे लिए याजकों के रूप में सेवा करें—हारून, उसके पुत्र नादाब और अबीहू, एलीआज़ार और ईतामार।
