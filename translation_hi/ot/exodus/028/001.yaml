  text: וְ/אַתָּ֡ה הַקְרֵ֣ב אֵלֶי/ךָ֩ אֶת אַהֲרֹ֨ן אָחִ֜י/ךָ וְ/אֶת בָּנָ֣י/ו אִתּ֔/וֹ מִ/תּ֛וֹךְ בְּנֵ֥י יִשְׂרָאֵ֖ל לְ/כַהֲנ/וֹ לִ֑/י אַהֲרֹ֕ן נָדָ֧ב וַ/אֲבִיה֛וּא אֶלְעָזָ֥ר וְ/אִיתָמָ֖ר בְּנֵ֥י אַהֲרֹֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/001.yaml
  text: 'And you[a], bring near to yourself Aaron your brother, and his sons with him, from among the sons of Israel, to serve as priests for me: Aaron, Nadab and Abihu, Eleazar and Ithamar, Aaron’s sons.'
translation:
  language: hi
  text: और तू अपने भाई हारून को, और उसके साथ उसके पुत्रों को, इस्राएल के पुत्रों[a] में से, अपने पास ले आ, कि वे मेरे लिए याजकों के रूप में सेवा करें—हारून, उसके पुत्र नादाब और अबीहू, एलीआज़ार और ईतामार।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस्राएलियों में से।” इब्रानी में शाब्दिक रूप से “इस्राएल के पुत्रों में से” है, जो इस्राएली समुदाय के लिए एक प्रचलित पदनाम है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: और तू
  rationale: स्वतंत्र सर्वनाम אַתָּה मूसा पर बल देता है; एकवचन संबोधन बनाए रखने के लिए ‘तू’ रखा गया है।
- source_word: הַקְרֵב אֵלֶיךָ
  choice: अपने पास बुला ले
  rationale: हिफ़ील הַקְרֵב का मूल अर्थ ‘निकट ले आ’ है। आधुनिक हिंदी में ‘अपने पास बुला ले’ व्यक्तिगत दिशा और बुलाए जाने का भाव स्वाभाविक रूप से व्यक्त करता है, बिना इसे पूर्ण अभिषेक मान लेने के।
- source_word: אָחִיךָ
  choice: अपने भाई
  rationale: हारून के साथ मूसा का पारिवारिक संबंध स्पष्ट रखा गया है।
- source_word: בָּנָיו אִתּוֹ
  choice: उसके साथ उसके पुत्रों को
  rationale: 'אִתּוֹ का साथ होने का भाव स्पष्ट रखा गया है: हारून और उसके पुत्र एक साथ बुलाए जाते हैं।'
- source_word: מִתּוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों में से
  rationale: इब्रानी की वाचा-समुदाय संबंधी मानक अभिव्यक्ति को मूल-आकार में रखा गया है; अधिक सहज सामूहिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: לְכַהֲנוֹ לִי
  choice: ताकि वे मेरे लिए याजक का काम करें
  rationale: כהן की क्रिया याजकीय सेवा करना बताती है। यह अनुवाद पद और सेवा दोनों का भाव रखता है तथा לִי को ‘मेरे लिए’ के रूप में स्पष्ट करता है।
- source_word: בְּנֵי אַהֲרֹן
  choice: हारून के पुत्र
  rationale: नामित पुरुषों की हारून से वंशगत पहचान सीधे व्यक्त की गई है।
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל का सामुदायिक पदनाम
  choice: इस्राएल के पुत्रों में से
  alternative: इस्राएलियों में से
  rationale: मुख्य पाठ इब्रानी के ‘इस्राएल के पुत्र’ रूप को सुरक्षित रखता है; पादटिप्पणी बताती है कि इसका आशय पूरे इस्राएली समुदाय से है।
- issue: לְכַהֲנוֹ का याजकीय आशय
  choice: याजक का काम करें
  alternative: मेरे याजक हों
  rationale: क्रियात्मक रूप याजकीय सेवा पर बल देता है; इसे केवल पदवी या संपूर्ण अभिषेक-विधि के अर्थ में सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण मानक हिंदी; परमेश्वर द्वारा मूसा के लिए एकवचन ‘तू’ का प्रयोग। ‘याजक’ प्रचलित बाइबिलीय शब्द के रूप में रखा गया है। मुख्य पाठ में स्रोत-आकार ‘इस्राएल के पुत्र’ सुरक्षित है।
