base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/035.yaml
  text: It shall be on Aaron when he ministers[a], and its sound shall be heard when he goes into the Holy Place before Yahweh and when he comes out[c][b], so that he may not die.
translation:
  language: hi
  text: वह बागा हारून पर रहे जब वह सेवा करे; और जब हारून याहवे के सामने पवित्रस्थान[a] में प्रवेश करे और जब वहाँ से बाहर निकले, तब उसकी ध्वनि[b] सुनाई दे, ताकि वह मर न जाए।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पवित्र धाम में”; यहाँ “पवित्रस्थान” से मिलाप के तंबू का पवित्र क्षेत्र अभिप्रेत है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात बागे पर लगी घंटियों की ध्वनि; इब्रानी में शाब्दिक रूप से “उसकी ध्वनि” है।
    reason: referent_clarification
  - marker: c
    text: या अधिक शाब्दिक रूप में, “और वह नहीं मरेगा”; इसे “कहीं ऐसा न हो कि वह मर जाए” भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה עַל אַהֲרֹן
  choice: वह हारून के ऊपर रहे
  rationale: निर्देशात्मक प्रसंग में क्रिया का भाव अपेक्षित व्यवस्था को व्यक्त करता है। ‘वह’ पिछले पदों में वर्णित बागे की ओर संकेत करता है; ‘हारून के ऊपर रहे’ पहनावे का अर्थ स्वाभाविक रूप से देता है।
- source_word: לְשָׁרֵת
  choice: सेवा करते समय
  rationale: ל के साथ infinitive यहाँ उद्देश्य या परिस्थिति बता सकता है। पुरोहितीय कार्य के प्रसंग में कालवाचक रूप सहज और स्पष्ट है।
- source_word: וְנִשְׁמַע קֹלוֹ
  choice: तब उसकी आवाज़ सुनाई दे
  rationale: निफ़ाल रूप श्रव्य होने का भाव देता है। प्रत्यय का सबसे निकट प्रसंगगत संकेत बागे और उस पर लगी घंटियों की ध्वनि है, पर ‘उसकी’ मूल की सर्वनामगत संरचना को बनाए रखता है।
- source_word: בְּבֹאוֹ אֶל הַקֹּדֶשׁ
  choice: जब हारून … पवित्रस्थान में प्रवेश करे
  rationale: कालवाचक infinitive और गंतव्य को आधुनिक हिन्दी में ‘जब … प्रवेश करे’ स्वाभाविक रूप से व्यक्त करता है। संज्ञा הַקֹּדֶשׁ यहाँ तंबू के पवित्र क्षेत्र को सूचित करती है।
- source_word: לִפְנֵי יְהוָה
  choice: याहवे के सामने
  rationale: לִפְנֵי का सीधा अर्थ ‘के सामने’ है और यह परमेश्वर की उपस्थिति में आने का भाव रखता है। ईश्वरीय नाम को ‘याहवे’ रूप में रखा गया है।
- source_word: וּבְצֵאתוֹ
  choice: और जब वहाँ से बाहर निकले
  rationale: यह प्रवेश के समानांतर कालवाचक वाक्यांश है। ‘वहाँ से’ हिन्दी में संदर्भित पवित्रस्थान को स्पष्ट करता है, बिना नया आशय जोड़े।
- source_word: וְלֹא יָמוּת
  choice: ताकि वह मर न जाए
  rationale: अनुष्ठानिक निर्देश में यह परिणाम अथवा बचाव का भाव व्यक्त करता है। यह हिन्दी में स्पष्ट है, जबकि ‘और वह नहीं मरेगा’ मूल की संभावित अधिक औपचारिक रचना है।
theological_decisions:
- issue: सुनाई देने वाली आवाज़ का संदर्भ
  choice: यह बागे पर लगी घंटियों से उत्पन्न आवाज़ है।
  alternative: यह सामान्य रूप से हारून की आवाज़ या उसकी गतिविधि की ध्वनि है।
  rationale: निकटवर्ती पदों में बागे के निचले घेरे पर घंटियों का वर्णन है; इसलिए ‘उसकी आवाज़’ का स्वाभाविक संदर्भ बागा और उसकी घंटियाँ हैं। मुख्य पाठ में ‘उसकी’ रखकर मूल की सर्वनामगत अभिव्यक्ति बचाई गई है और पादटिप्पणी में संदर्भ स्पष्ट किया गया है।
- issue: וְלֹא יָמוּת का संबंध
  choice: ‘ताकि वह मर न जाए’—जीवन-सुरक्षा का उद्देश्य या परिणाम।
  alternative: ‘और वह नहीं मरेगा’—समन्वित परिणाम; अथवा ‘कहीं ऐसा न हो कि वह मर जाए’—चेतावनी।
  rationale: हिब्रू संयोजन उद्देश्य, परिणाम या रोकथाम की छाया रख सकता है। मुख्य पाठ सहज हिन्दी में प्रमुख प्रसंगगत अर्थ देता है और पादटिप्पणी वैकल्पिक औपचारिक अर्थ बताती है।
- issue: ईश्वरीय नाम יהוה
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम है; उसे उपाधि में बदलने के बजाय हिन्दी लिप्यंतरण ‘याहवे’ से प्रस्तुत किया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी अपनाई गई है। पुरोहितीय पदावली के लिए ‘सेवा’ और ‘पवित्रस्थान’ रखे गए हैं। वाक्य का क्रम हिब्रू के निकट है, पर हिन्दी की स्वाभाविकता के लिए ‘तब’ और ‘वहाँ से’ जोड़े गए हैं।
