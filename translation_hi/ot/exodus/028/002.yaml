  text: And you shall make holy garments for Aaron your brother[a], for glory and for beauty.
translation:
  language: hi
  text: और अपने भाई हारून के लिए पवित्र वस्त्र बनाना, महिमा और शोभा के लिए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: और ... बनाना
  rationale: निर्देशात्मक प्रसंग में संयोजक सहित क़ाल पूर्ण 2 पुरुष एकवचन आज्ञार्थक बल रखता है। हिंदी में पूर्ववर्ती निर्देश से जुड़ी आज्ञा के लिए ‘और ... बनाना’ स्वाभाविक और स्पष्ट है।
- source_word: בִגְדֵי קֹדֶשׁ
  choice: पवित्र वस्त्र
  rationale: समासिक पद ऐसे वस्त्रों को दर्शाता है जो पवित्र सेवा के लिए अलग किए गए हैं; ‘पवित्र वस्त्र’ अर्थ और गरिमापूर्ण शैली दोनों बनाए रखता है।
- source_word: לְאַהֲרֹן אָחִיךָ
  choice: अपने भाई हारून के लिए
  rationale: संबंधसूचक प्रत्यय मूसा की ओर संकेत करता है। हिंदी का ‘अपने भाई’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है और हारून नाम की प्रचलित हिंदी वर्तनी रखता है।
- source_word: לְכָבוֹד
  choice: गरिमा के लिए
  rationale: כבוד में महिमा, सम्मान और प्रतिष्ठा का अर्थक्षेत्र है। वस्त्रों के प्रसंग में ‘गरिमा’ दृश्य प्रतिष्ठा और पद की महत्ता व्यक्त करता है, बिना यह तय किए कि महिमा केवल मानवीय सम्मान है या दिव्य।
- source_word: וּלְתִפְאָרֶת
  choice: और शोभा के लिए
  rationale: תפארת सौंदर्य, वैभव और अलंकरण को सूचित कर सकता है। ‘शोभा’ आधुनिक हिंदी में सहज है और वस्त्रों के सौंदर्य तथा वैभव दोनों की छाया रखता है।
theological_decisions:
- issue: याजकीय वस्त्रों के उद्देश्य को बताने वाला पद לְכָבוֹד וּלְתִפְאָרֶת
  choice: गरिमा और शोभा के लिए
  alternative: महिमा और वैभव के लिए; सम्मान और सुंदरता के लिए
  rationale: इब्रानी पद याजकीय पद की प्रतिष्ठा और वस्त्रों की दृश्य शोभा—दोनों को व्यापक रूप से व्यक्त करता है। चुना हुआ अनुवाद यह निर्धारित नहीं करता कि ‘महिमा’ का आशय केवल परमेश्वर की महिमा है या केवल हारून का सम्मान।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, संक्षिप्त और गरिमापूर्ण रखी गई है। ‘परिधान’ या बाद की कलीसियाई शब्दावली से बचते हुए सामान्य पाठक के लिए ‘वस्त्र’ चुना गया है।
