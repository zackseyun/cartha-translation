  text: It shall be square and doubled[a], a span its length and a span its width.
translation:
  language: hi
  text: वह चौकोर और दोहरा[a] हो; उसकी लंबाई एक बित्ता और उसकी चौड़ाई एक बित्ता हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मोड़कर दोहरा किया हुआ।’ इब्रानी शब्द बताता है कि सीनाबन्द दोहरे रूप में बनाया जाए, सम्भवतः उसे मोड़कर।
    reason: lexical_alternative
lexical_decisions:
- source_word: רָבוּעַ
  choice: चौकोर
  rationale: यह विशेषण चार बराबर भुजाओं वाले आकार को बताता है; आधुनिक हिन्दी में ‘चौकोर’ स्पष्ट और स्वाभाविक है।
- source_word: יִהְיֶה
  choice: हो
  rationale: यहाँ अपूर्ण क्रिया निर्माण-संबंधी निर्देश व्यक्त करती है; ‘हो’ हिन्दी में उसके विधिसूचक बल को स्वाभाविक रूप से रखता है।
- source_word: כָּפוּל
  choice: दोहरा
  rationale: निष्क्रिय कृदंत वस्तु के दुहरे अथवा मोड़कर दोहरा किए हुए रूप का संकेत देता है; ‘दोहरा’ संक्षिप्त है और मोड़े जाने की बात को अनिवार्य नहीं बनाता।
- source_word: זֶרֶת
  choice: बित्ता
  rationale: यह फैले हुए हाथ से मापी जाने वाली प्राचीन लंबाई है; हिन्दी का ‘बित्ता’ इसका सटीक और सामान्य समतुल्य है।
- source_word: אָרְכּוֹ
  choice: उसकी लंबाई
  rationale: पुल्लिंग एकवचन प्रत्यय उस वर्णित वस्तु की ओर संकेत करता है; माप के कथन में यह स्वाभाविक हिन्दी है।
- source_word: וְזֶרֶת
  choice: और ... एक बित्ता
  rationale: संयोजक दूसरे आयाम को जोड़ता है; हिन्दी में माप की इकाई को दोहराना स्पष्ट और स्वाभाविक है।
- source_word: רָחְבּוֹ
  choice: उसकी चौड़ाई
  rationale: यह लंबाई के विपरीत दूसरे आयाम को बताता है; आधुनिक हिन्दी में ‘चौड़ाई’ सहज शब्द है।
