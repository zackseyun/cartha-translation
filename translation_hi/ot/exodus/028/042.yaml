lexical_decisions:
- source_word: וַעֲשֵׂה
  choice: और ... बनाना
  rationale: निर्देशों की शृंखला में वाव का क्रमसूचक बल रखा गया है; हिंदी विधिक शैली में संयुक्त क्रिया के साथ ‘बनाना’ स्वाभाविक आज्ञार्थक निर्देश है।
- source_word: לָהֶם
  choice: उनके लिए
  rationale: यह पहले उल्लिखित याजकों के लिए हितार्थक संबंध व्यक्त करता है।
- source_word: מִכְנְסֵי בָד
  choice: मलमल के अधोवस्त्र
  rationale: מִכְנְסֵי शरीर के निचले भाग पर अन्य याजकीय वस्त्रों के नीचे पहने जाने वाले वस्त्र हैं; ‘अधोवस्त्र’ उनके कार्य को स्पष्ट करता है। בָד यहाँ महीन सन के कपड़े को सूचित करता है, जिसके लिए ‘मलमल’ सहज हिंदी विकल्प है।
- source_word: לְכַסּוֹת
  choice: ताकि ... ढकें
  rationale: उद्देश्यसूचक infinitive को स्वाभाविक हिंदी उद्देश्य-वाक्य से व्यक्त किया गया है।
- source_word: בְּשַׂר עֶרְוָה
  choice: उनकी नग्न देह
  rationale: शाब्दिक भाव ‘नग्नता का मांस’ है। ‘नग्न देह’ ठोस शारीरिक संदर्भ को बनाए रखता है और न तो अनावश्यक रूप से कठोर है, न अत्यधिक शिष्टोक्तिपूर्ण।
- source_word: מִמָּתְנַיִם
  choice: कमर से
  rationale: מָתְנַיִם कमर/कटि/पार्श्व के क्षेत्र को दर्शाता है; वस्त्र की ऊपरी सीमा के लिए ‘कमर’ आधुनिक हिंदी में सबसे स्वाभाविक है।
- source_word: וְעַד יְרֵכַיִם
  choice: जाँघों तक
  rationale: יָרֵךְ का सामान्य अर्थ ‘जाँघ’ है और यहाँ वस्त्र की निचली सीमा बताई गई है।
- source_word: יִהְיוּ
  choice: वे ... हों
  rationale: सरल अस्तित्वसूचक क्रिया के निकट रहते हुए हिंदी में वस्त्र की निर्धारित सीमा व्यक्त करता है; ‘फैले हों’ जैसी व्याख्यात्मक वृद्धि से बचा गया है।
