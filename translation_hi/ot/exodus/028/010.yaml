translation:
  language: hi
  text: उनके नामों में से छह नाम एक पत्थर पर, और शेष छह नाम दूसरे पत्थर पर, उनके जन्म-क्रम के अनुसार[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके वंश-क्रम के अनुसार”; इब्रानी पद वंशगत क्रम या उससे निकलने वाले जन्म-क्रम, दोनों की ओर संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁשָּׁה מִשְּׁמֹתָם
  choice: उनके नामों में से छः
  rationale: 'מִן का प्रयोग अंशसूचक है: सभी नामों में से छः नाम। हिंदी में यह रूप अर्थ को स्पष्ट और स्वाभाविक रखता है।'
- source_word: עַל הָאֶבֶן הָאֶחָת
  choice: एक पत्थर पर
  rationale: הָאֶחָת का शाब्दिक अर्थ ‘एक’ है और आगे आए ‘दूसरे पत्थर’ से इसका स्पष्ट विरोध बनता है; इसलिए अनावश्यक रूप से ‘पहले’ नहीं किया गया।
- source_word: הַשִּׁשָּׁה הַנּוֹתָרִים
  choice: शेष छः
  rationale: נוֹתָרִים बचे हुए अथवा शेष लोगों को सूचित करता है; ‘शेष छः’ संक्षिप्त और स्वाभाविक है।
- source_word: עַל הָאֶבֶן הַשֵּׁנִית
  choice: दूसरे पत्थर पर
  rationale: הַשֵּׁנִית स्पष्ट क्रमवाचक विशेषण है, जिसका सीधा हिंदी रूप ‘दूसरे’ है।
- source_word: כְּתוֹלְדֹתָם
  choice: उनके जन्म-क्रम के अनुसार
  rationale: תּוֹלְדוֹת वंश, उत्पत्ति या पीढ़ियों को सूचित कर सकता है; इस प्रसंग में नामों को पुत्रों के जन्म-क्रम में रखने का भाव सर्वाधिक स्वाभाविक है, जबकि व्यापक वंशावलीगत अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: כְּתוֹלְדֹתָם में जन्म-क्रम और वंशावलीगत क्रम के बीच अर्थ-व्याप्ति
  choice: मुख्य पाठ में ‘उनके जन्म-क्रम के अनुसार’
  alternative: ‘उनकी वंशावलियों के अनुसार’ अथवा ‘उनकी पीढ़ियों के अनुसार’
  rationale: आसपास का प्रसंग इस्राएल के पुत्रों के नाम दो पत्थरों पर बाँटने का है, इसलिए जन्म-क्रम अभिप्रेत होने की अधिक संभावना है; फिर भी मूल शब्द की वंश/पीढ़ी संबंधी व्यापकता को पादटिप्पणी में बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण और पाठयोग्य रूप। पद पिछले वाक्य की निरंतरता है, इसलिए मूल की तरह वाक्यांशात्मक संरचना रखी गई है।
