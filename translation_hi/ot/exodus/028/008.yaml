source:
  edition: WLC
  text: וְ/חֵ֤שֶׁב אֲפֻדָּת/וֹ֙ אֲשֶׁ֣ר עָלָ֔י/ו כְּ/מַעֲשֵׂ֖/הוּ מִמֶּ֣/נּוּ יִהְיֶ֑ה זָהָ֗ב תְּכֵ֧לֶת וְ/אַרְגָּמָ֛ן וְ/תוֹלַ֥עַת שָׁנִ֖י וְ/שֵׁ֥שׁ מָשְׁזָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/008.yaml
  text: 'And the skillfully woven band of his ephod[a], which is on it, shall be like its workmanship, of one piece with it: gold, blue, and purple, and scarlet yarn[b], and fine twisted linen.'
translation:
  language: hi
  text: और उसके एपोद का कुशलता से बुना हुआ कमरबंद[a], जो उस पर है, उसी कारीगरी का हो और उसी में से बना हो। वह सोने, नीले और बैंगनी रंग के धागों, लाल रंग के सूत[b], और बटे हुए महीन सन से बनाया जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “एपोद का कलात्मक रूप से बुना हुआ पट्टा।” इब्रानी शब्द एपोद को कसने या सजाने वाले बुने हुए भाग को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “नीला, बैंगनी और लाल” उन रंगी हुई वस्त्र-सामग्रियों को दर्शाता है जिनका उपयोग पवित्र निवास और याजकीय वस्त्रों में होता था।
    reason: cultural_note
lexical_decisions:
- source_word: חֵשֶׁב אֲפֻדָּתוֹ
  choice: उसका कुशलता से बुना हुआ कमरबन्द
  rationale: याजकीय वस्त्र के प्रसंग में חֵשֶׁב एपोद को कसने वाला कलात्मक रूप से बुना पट्टा है। ‘कमरबन्द’ उसका कार्य स्पष्ट करता है और ‘कुशलता से बुना हुआ’ उसकी शिल्पगत प्रकृति को व्यक्त करता है।
- source_word: אֲשֶׁר עָלָיו
  choice: एपोद पर लगा हुआ
  rationale: निकटतम पूर्वपद एपोद है; इसलिए प्रत्यय को वस्त्र की ओर संकेत मानना प्रसंगानुकूल है। ‘लगा हुआ’ स्थिति बताता है, पर अलग से जोड़े जाने का अर्थ नहीं थोपता।
- source_word: כְּמַעֲשֵׂהוּ מִמֶּנּוּ יִהְיֶה
  choice: उसी कारीगरी का और उसी का अभिन्न भाग हो
  rationale: पहला पद निर्माण-कला की समानता और दूसरा एपोद के साथ उसकी एकीकृत रचना पर बल देता है। हिन्दी में दोनों पक्षों को अलग-अलग रखते हुए स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: זָהָב
  choice: सोना
  rationale: सामग्री का सीधा और सामान्य हिन्दी रूप।
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: नीले, बैंगनी और लाल रंग के सूत
  rationale: ये रंगे हुए वस्त्र-सामग्री के पारंपरिक पद हैं। सूची के वस्त्र-संदर्भ को स्पष्ट करने के लिए ‘सूत’ प्रयुक्त है।
- source_word: שֵׁשׁ מָשְׁזָר
  choice: बटी हुई उत्तम मलमल
  rationale: שֵׁשׁ महीन उच्च-गुणवत्ता वाले सन-वस्त्र को और מָשְׁזָר बटे हुए धागे को दर्शाता है। ‘उत्तम मलमल’ आधुनिक हिन्दी बाइबलीय प्रयोग में स्वाभाविक और समझने योग्य है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘एपोद’ को पारंपरिक तकनीकी नाम के रूप में सुरक्षित रखा गया है। इब्रानी वाक्य के दोहरे बल—कारीगरी की समानता और वस्त्र के साथ एकीकृत निर्माण—दोनों को मुख्य पाठ में बनाए रखा गया है।
