  text: וְ/עָשִׂ֗יתָ שְׁתֵּי֙ טַבְּע֣וֹת זָהָ֔ב וְ/שַׂמְתָּ֣ אֹתָ֔/ם עַל שְׁנֵ֖י קְצ֣וֹת הַ/חֹ֑שֶׁן עַל שְׂפָת֕/וֹ אֲשֶׁ֛ר אֶל עֵ֥בֶר הָ/אֵפֹ֖ד בָּֽיְתָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/026.yaml
  text: You shall make two gold rings and put them on the two ends of the breastpiece[a], on its edge that is toward the inner side of the ephod.
translation:
  language: hi
  text: तुम सोने के दो छल्ले बनाओ और उन्हें वक्षपट के दोनों छोरों पर, उसकी उस किनारी पर लगाओ जो एपोद की ओर, भीतर की तरफ़ है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी उस किनारी पर जो भीतर की तरफ़ एपोद की ओर है।”
    reason: स्थान-सूचक इब्रानी वाक्यांश को इस तरह भी जोड़ा और समझा जा सकता है।
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: तुम ... बनाना
  rationale: निर्देशों की शृंखला में संयोजक सहित क़ाल पूर्ण क्रिया आज्ञा का कार्य करती है। ‘तुम ... बनाना’ आधुनिक हिन्दी में निर्देशात्मक बल और मूल के एकवचन संबोधन को स्वाभाविक रूप से व्यक्त करता है।
- source_word: שְׁתֵּי טַבְּעוֹת זָהָב
  choice: सोने के दो छल्ले
  rationale: यह संख्या, वस्तु और सामग्री को सीधे व्यक्त करता है; ‘छल्ले’ परिधान में लगाए जाने वाले rings के लिए स्वाभाविक है।
- source_word: וְשַׂמְתָּ אֹתָם
  choice: और उन्हें ... लगाना
  rationale: שׂים का अर्थ रखना, लगाना या स्थापित करना हो सकता है। इस कारीगरी और परिधान-संबंधी प्रसंग में ‘लगाना’ सबसे स्पष्ट और स्वाभाविक है।
- source_word: עַל שְׁנֵי קְצוֹת הַחֹשֶׁן
  choice: वक्षपट के दोनों छोरों पर
  rationale: קצה किसी वस्तु के छोर या अंतिम सिरे को दर्शाता है। חֹשֶׁן के लिए ‘वक्षपट’ संक्षिप्त, गरिमापूर्ण और याजकीय परिधान के संदर्भ में सटीक है।
- source_word: עַל שְׂפָתוֹ
  choice: उसकी उस किनारी पर
  rationale: שָׂפָה का शाब्दिक अर्थ होंठ है, पर वस्त्र या वस्तु के संदर्भ में किनारा अथवा सीमा होता है। ‘किनारी’ यहाँ वस्त्र के भौतिक छोर को सहज ढंग से बताती है।
- source_word: אֲשֶׁר אֶל עֵבֶר הָאֵפֹד בָּיְתָה
  choice: जो भीतर की ओर एपोद की तरफ़ है
  rationale: עֵבֶר दिशा या सामने की ओर संकेत करता है और בָּיְתָה भीतर की दिशा बताता है। चुना गया वाक्यांश स्थानिक संबंध को स्पष्ट रखता है, जबकि संभावित वैकल्पिक विन्यास को पादटिप्पणी में सुरक्षित रखा गया है।
