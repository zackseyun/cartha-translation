  register: आधुनिक मानक हिन्दी का सरल, निर्देशात्मक और गरिमापूर्ण रूप अपनाया गया है। ‘तुम ... बनाना/लगाना’ कारीगरी के क्रमिक निर्देशों को सहज रूप देता है; ‘एपोद’ का लिप्यंतरण और ‘वक्षपट’ जैसी प्रसंगानुकूल संज्ञा याजकीय परिधान की तकनीकी पहचान बनाए रखते हैं।
