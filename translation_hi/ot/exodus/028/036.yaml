source:
  edition: WLC
  text: וְ/עָשִׂ֥יתָ צִּ֖יץ זָהָ֣ב טָה֑וֹר וּ/פִתַּחְתָּ֤ עָלָי/ו֙ פִּתּוּחֵ֣י חֹתָ֔ם קֹ֖דֶשׁ לַֽ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/036.yaml
  text: 'And you shall make a plate of pure gold[a], and engrave on it, like the engravings of a seal: ‘Holy to Yahweh.’'
translation:
  language: hi
  text: '“तुम शुद्ध सोने की एक पट्टी बनाना और उस पर मुहर की नक्काशी की तरह ये शब्द उकेरना: ‘याहवे के लिए पवित्र।’[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे के लिए पवित्रता।”
    reason: קֹדֶשׁ को यहाँ विशेषण-सदृश ‘पवित्र’ अथवा भाववाचक संज्ञा ‘पवित्रता’ समझा जा सकता है।
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: तुम … बनाना
  rationale: संयोजक वाव के साथ यह क्रिया पुरोहित के वस्त्र बनाने के क्रम में निर्देश देती है। आधुनिक हिंदी में ‘तुम … बनाना’ निर्देशात्मक बल को सहज रूप से व्यक्त करता है।
- source_word: צִּיץ
  choice: पट्टी
  rationale: यहाँ शब्द महायाजक की पगड़ी पर लगाए जाने वाले सोने के अलंकार को दर्शाता है। ‘पट्टी’ वस्तु के रूप और प्रसंग को सामान्य पाठक के लिए स्पष्ट रखती है; ‘फूल’ इस प्रसंग में भ्रामक होगा।
- source_word: זָהָב טָהוֹר
  choice: शुद्ध सोने की
  rationale: यह वस्तु की सामग्री और उसकी गुणवत्ता दोनों बताता है; हिंदी में यही स्वाभाविक और सटीक अभिव्यक्ति है।
- source_word: וּפִתַּחְתָּ עָלָיו
  choice: उस पर … खोदना
  rationale: इस धातु-शिल्प प्रसंग में क्रिया किसी लेख को उकेरने या खोदने को दर्शाती है। ‘खोदना’ अगले पदबंध ‘मुहर की नक्काशी’ के साथ स्वाभाविक बैठता है।
- source_word: פִּתּוּחֵי חֹתָם
  choice: मुहर की नक्काशी के समान
  rationale: बहुवचन रूप नक्काशी के काम अथवा उकेरे हुए चिह्नों का संकेत देता है। हिंदी में यह वाक्यांश मुहर पर की जाने वाली सूक्ष्म उत्कीर्ण शैली को स्पष्ट करता है और तुलनात्मक भाव बनाए रखता है।
- source_word: קֹדֶשׁ לַיהוָה
  choice: याहवे के लिए पवित्र
  rationale: संक्षिप्त अभिलेखीय सूत्र को संक्षिप्त ही रखा गया है। לַ का समर्पण-संबंधी भाव ‘के लिए’ से स्वाभाविक रूप में आता है; קֹדֶשׁ की संज्ञात्मक सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत वाचा-नाम है; उसे किसी उपाधि से बदलने के बजाय हिंदी लिप्यंतरण में प्रस्तुत किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में चार अक्षरों वाला व्यक्तिगत नाम सीधे प्रयुक्त है। ‘याहवे’ नाम को उपाधि में बदले बिना सुरक्षित रखता है।
- issue: अभिलेख קֹדֶשׁ לַיהוָה का अर्थ
  choice: याहवे के लिए पवित्र
  alternative: पवित्रता याहवे के लिए है
  rationale: קֹדֶשׁ यहाँ किसी समर्पित वस्तु की पवित्र स्थिति अथवा ‘पवित्रता’ दोनों का भाव दे सकता है। मुख्य पाठ में संक्षिप्त समर्पण-सूत्र रखा गया और संज्ञात्मक विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और निर्देशात्मक रखी गई है। अभिलेख को संक्षिप्त रखा गया है और वास्तविक शब्दार्थगत अस्पष्टता पादटिप्पणी में सुरक्षित की गई है।
