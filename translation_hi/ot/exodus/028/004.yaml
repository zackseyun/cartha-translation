source:
  edition: WLC
  text: וְ/אֵ֨לֶּה הַ/בְּגָדִ֜ים אֲשֶׁ֣ר יַעֲשׂ֗וּ חֹ֤שֶׁן וְ/אֵפוֹד֙ וּ/מְעִ֔יל וּ/כְתֹ֥נֶת תַּשְׁבֵּ֖ץ מִצְנֶ֣פֶת וְ/אַבְנֵ֑ט וְ/עָשׂ֨וּ בִגְדֵי קֹ֜דֶשׁ לְ/אַהֲרֹ֥ן אָחִ֛י/ךָ וּ/לְ/בָנָ֖י/ו לְ/כַהֲנ/וֹ לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/004.yaml
  text: 'And these are the garments that they shall make: a breastpiece[a], an ephod, a robe, a checkered tunic, a turban, and a sash. They shall make holy garments for Aaron your brother and for his sons[d][c][b], for him to serve as priest to me.'
translation:
  language: hi
  text: 'और ये वे वस्त्र हैं जो वे बनाएँ: एक वक्षपट[a], एक एपोद[b], एक चोगा, नमूनेदार बुना हुआ अंगरखा[c], एक पगड़ी और एक कमरबंद। वे तुम्हारे भाई हारून और उसके पुत्रों के लिए पवित्र वस्त्र[d] बनाएँ, ताकि वह मेरे लिए याजक का काम करे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसे ‘छाती पर पहनने का पट’ भी कहा जा सकता है। हिब्रू शब्द याजक की छाती पर पहनी जाने वाली वस्तु को दर्शाता है, कवच को नहीं।
    reason: lexical_alternative
  - marker: b
    text: ‘एपोद’ एक विशिष्ट याजकीय परिधान का हिब्रू नाम है; इसका कोई सटीक हिन्दी पर्याय नहीं है।
    reason: cultural_note
  - marker: c
    text: या ‘खानेदार अंगरखा’। हिब्रू शब्द संभवतः विशेष नमूने में बुने हुए वस्त्र को दर्शाता है, पर उस नमूने का ठीक स्वरूप निश्चित नहीं है।
    reason: lexical_alternative
  - marker: d
    text: या ‘पावन वस्त्र’।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּגָדִים
  choice: वस्त्र
  rationale: यह सामान्य, गरिमापूर्ण और याजकीय परिधान के संदर्भ में स्वाभाविक आधुनिक हिन्दी शब्द है।
- source_word: יַעֲשׂוּ
  choice: वे बनाएँ
  rationale: अपूर्ण क्रिया यहाँ निर्देशात्मक बल रखती है; हिन्दी का संभावनार्थक रूप आज्ञा के प्रसंग में इसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: חֹשֶׁן
  choice: वक्षपट
  rationale: यह याजक की छाती पर पहनी जाने वाली विशिष्ट वस्तु है, कवच नहीं; इसलिए ‘वक्षपट’ युद्ध-संबंधी अर्थ से बचते हुए उसके स्थान और रूप का संकेत देता है।
- source_word: אֵפוֹד
  choice: एपोद
  rationale: इस विशिष्ट याजकीय परिधान का हिन्दी में कोई सटीक सामान्य पर्याय नहीं है, इसलिए तकनीकी शब्द का लिप्यंतरण किया गया है।
- source_word: מְעִיל
  choice: चोगा
  rationale: यह ऊपर पहने जाने वाले लंबे परिधान के लिए स्पष्ट और प्रचलित हिन्दी शब्द है।
- source_word: כְתֹנֶת תַּשְׁבֵּץ
  choice: नमूनेदार बुना हुआ अंगरखा
  rationale: כְתֹנֶת को ‘अंगरखा’ और विवादित तַּשְׁבֵּץ को ऐसे बुने हुए नमूने के रूप में व्यक्त किया गया है, बिना किसी निश्चित खानेदार बनावट को अनिवार्य ठहराए।
- source_word: מִצְנֶפֶת
  choice: पगड़ी
  rationale: यह याजकीय सिर-वेष्टन के लिए आधुनिक हिन्दी में सबसे सहज और स्पष्ट शब्द है।
- source_word: אַבְנֵט
  choice: कमरबंद
  rationale: यह कमर पर लपेटे जाने वाले कपड़े के पट्टे को स्पष्ट करता है और समारोहिक संदर्भ के अनुकूल है।
- source_word: בִגְדֵי קֹדֶשׁ
  choice: पवित्र वस्त्र
  rationale: यह पदबंध का सीधा अनुवाद है और याजकीय संदर्भ में पवित्रता की मूल भाषा को बनाए रखता है।
- source_word: לְאַהֲרֹן אָחִיךָ וּלְבָנָיו
  choice: तुम्हारे भाई हारून और उसके पुत्रों के लिए
  rationale: सम्बोधन, पारिवारिक पहचान और पुत्रों के पुरुषवाचक उल्लेख—तीनों को यथावत रखा गया है।
- source_word: לְכַהֲנוֹ לִי
  choice: ताकि वह मेरे लिए याजक का काम करे
  rationale: हिब्रू के उद्देश्यसूचक रूप और एकवचन प्रत्यय को स्पष्ट आधुनिक हिन्दी में व्यक्त किया गया है।
theological_decisions:
- issue: विशिष्ट याजकीय परिधानों की शब्दावली
  choice: जहाँ स्पष्ट हिन्दी पर्याय उपलब्ध हैं वहाँ उनका प्रयोग, पर אֵפוֹד का ‘एपोद’ के रूप में लिप्यंतरण
  alternative: सभी तकनीकी शब्दों को पारंपरिक या वर्णनात्मक नामों से प्रस्तुत करना
  rationale: इससे प्राचीन इस्राएली उपासना की विशिष्टता बनी रहती है, पर पाठ अनावश्यक रूप से अपारदर्शी या बाद की कलीसियाई शब्दावली पर निर्भर नहीं होता।
- issue: לְכַהֲנוֹ में एकवचन प्रत्यय
  choice: ‘ताकि वह मेरे लिए याजक का काम करे’
  alternative: ‘ताकि वे मेरे लिए याजकों का काम करें’
  rationale: हारून और उसके पुत्रों के उल्लेख के बाद अर्थ की दृष्टि से बहुवचन सहज लग सकता है, फिर भी मसोराई हिब्रू में प्रत्यय एकवचन है। अनुवाद ने इस व्याकरणिक तनाव को बहुवचन बनाकर चुपचाप हल नहीं किया।
- issue: וּלְבָנָיו का लिंग-विशिष्ट अर्थ
  choice: ‘और उसके पुत्रों के लिए’
  alternative: ‘और उसकी संतानों के लिए’
  rationale: हिब्रू यहाँ विशेष रूप से हारून के पुत्रों का उल्लेख करता है; सामान्यीकृत ‘संतान’ मूल पाठ की याजकीय नियुक्ति को कम विशिष्ट बना देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध स्तर रखा गया है। ‘याजक’, ‘पवित्र वस्त्र’ और ‘एपोद’ जैसे प्रसंगगत शब्द बनाए गए हैं; अत्यधिक संस्कृतनिष्ठ या पुराने पारंपरिक विकल्पों से बचा गया है।
