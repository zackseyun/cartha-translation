translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘एपोद’ को पारिभाषिक याजकीय वस्त्र-संज्ञा के रूप में लिप्यंतरित किया गया है। रंगों और सूत की सूची को हिन्दी में स्वाभाविक ढंग से जोड़ा गया है, जबकि सोने के वास्तविक रूप की मूल अस्पष्टता पादटिप्पणी में सुरक्षित है।
