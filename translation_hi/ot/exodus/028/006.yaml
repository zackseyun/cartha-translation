  text: וְ/עָשׂ֖וּ אֶת הָ/אֵפֹ֑ד זָ֠הָב תְּכֵ֨לֶת וְ/אַרְגָּמָ֜ן תּוֹלַ֧עַת שָׁנִ֛י וְ/שֵׁ֥שׁ מָשְׁזָ֖ר מַעֲשֵׂ֥ה חֹשֵֽׁב־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/006.yaml
  text: And they shall make the ephod of gold[a], blue, and purple, scarlet yarn, and fine twisted linen[b], the work of a skillful designer.
translation:
  language: hi
  text: वे एपोद को सोने[a], नीले और बैंगनी रंग के धागों, लाल रंग के सूत और बटी हुई महीन मलमल से बनाएँ, जिसमें कुशल कारीगर की कलात्मक कारीगरी हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सोने के तार”; इब्रानी में केवल “सोना” है, पर इस वस्त्र-निर्माण के संदर्भ में कपड़े में लगाया गया सोना अभिप्रेत हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשׂוּ
  choice: वे ... बनाएँ
  rationale: निर्देशों की शृंखला में यह रूप आज्ञार्थक भाव व्यक्त करता है; आधुनिक हिन्दी में आदरसूचक/निर्देशात्मक संभाव्य रूप स्वाभाविक है।
- source_word: הָאֵפֹד
  choice: एपोद
  rationale: यह याजकीय वस्त्र का पारिभाषिक नाम है, जिसका सटीक हिन्दी पर्याय नहीं है; लिप्यंतरण उसके विशिष्ट संदर्भ को सुरक्षित रखता है।
- source_word: זָהָב
  choice: सोने
  rationale: इब्रानी में केवल ‘सोना’ है। वस्त्र-निर्माण के संदर्भ में सोने का तार अभिप्रेत हो सकता है, पर ‘तार’ मूल में स्पष्ट नहीं है।
- source_word: תְּכֵלֶת
  choice: नीले
  rationale: पवित्र-तंबू के वस्त्रों में प्रयुक्त पारंपरिक रंग-संज्ञा; सामग्री-सूची के संदर्भ में ‘सूत’ आगे सामूहिक रूप से समझा जाता है।
- source_word: וְאַרְגָּמָן
  choice: बैंगनी
  rationale: इस रंग/रंजित सामग्री के लिए स्वाभाविक और प्रचलित हिन्दी शब्द।
- source_word: תּוֹלַעַת שָׁנִי
  choice: लाल रंग के सूत
  rationale: यह पद लाल/किरमिजी रंग में रंगी वस्त्र-सामग्री को दर्शाता है; ‘सूत’ वस्त्र-निर्माण का आशय स्पष्ट करता है।
- source_word: שֵׁשׁ מָשְׁזָר
  choice: बटी हुई महीन मलमल
  rationale: שֵׁשׁ महीन लिनन-वस्त्र और מָשְׁזָר उसके बटे हुए होने को दर्शाता है; हिन्दी बाइबलीय संदर्भ में ‘महीन मलमल’ सुबोध है।
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: कुशल कारीगर की कलात्मक कारीगरी
  rationale: यह अभिव्यक्ति सोची-समझी, नमूनेदार और दक्ष शिल्पकला को दर्शाती है; इसे केवल ‘कढ़ाई’ कहना अनावश्यक रूप से अर्थ को संकीर्ण कर देगा।
