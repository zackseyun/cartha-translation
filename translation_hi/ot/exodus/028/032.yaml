base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/032.yaml
  text: Its opening for the head shall be in the middle of it; around its opening there shall be a woven edge[a], like the opening of a coat of mail, so that it may not be torn.
translation:
  language: hi
  text: उसमें सिर डालने का छेद बीचोंबीच हो। उस छेद के चारों ओर बुनाई की हुई किनारी हो, जिरह-बख्तर[a] के गले के छेद के समान, ताकि वह न फटे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘कवच’ अथवा ‘वक्ष-कवच’। इब्रानी शब्द תַחְרָא दुर्लभ है; तुलना ऐसे मज़बूत गले के छेद से है जो फटने से बचा रहे।
    reason: lexical_alternative
lexical_decisions:
- source_word: פִי רֹאשׁוֹ
  choice: सिर डालने का छेद
  rationale: वस्त्र के संदर्भ में פֶּה का शाब्दिक अर्थ ‘मुँह’ न होकर उसका खुला भाग या छेद है; רֹאשׁוֹ बताता है कि वह सिर के लिए है।
- source_word: בְּתוֹכוֹ
  choice: बीचोंबीच
  rationale: यह वस्त्र के मध्य में सिर के छेद की स्थिति बताता है; आधुनिक हिन्दी में ‘बीचोंबीच’ स्वाभाविक और स्पष्ट है।
- source_word: שָׂפָה ... מַעֲשֵׂה אֹרֵג
  choice: बुनकर बनाई हुई किनारी
  rationale: שָׂפָה यहाँ छेद के चारों ओर का किनारा है और מַעֲשֵׂה אֹרֵג उसके बुने हुए निर्माण को बताता है। यह पदावली वस्त्र-निर्माण की ठोस छवि बनाए रखती है।
- source_word: לְפִיו סָבִיב
  choice: उस छेद के चारों ओर
  rationale: פֶּה की पुनरावृत्ति उसी वस्त्र-छेद को सूचित करती है और סָבִיב उसके पूरे घेरे को।
- source_word: כְּפִי תַחְרָא
  choice: जैसी कवच के छेद के चारों ओर होती है
  rationale: दुर्लभ תַחְרָא किसी कवचयुक्त परिधान का संकेत देता है। ‘कवच’ सामान्य पाठक के लिए सुबोध है, जबकि पादटिप्पणी शब्द की अनिश्चितता और अधिक विशिष्ट विकल्पों को सुरक्षित रखती है।
- source_word: לֹא יִקָּרֵעַ
  choice: ताकि वह न फटे
  rationale: निफ़अल रूप निष्क्रिय अर्थ देता है। प्रसंग में इसे किनारी बनाने के उद्देश्य या परिणाम के रूप में व्यक्त करना स्वाभाविक है।
