base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/028.yaml
  text: They shall bind the breastpiece by its rings to the rings of the ephod with a cord of blue yarn[a], so that it may be on the skillfully woven band of the ephod[c][b], and the breastpiece shall not come loose from the ephod.
translation:
  language: hi
  text: वे वक्षपट[a] को उसके छल्लों के द्वारा एपोद के छल्लों से नीले सूत की डोरी[b] से बाँधें, ताकि वह एपोद के कुशलता से बुने हुए पट्टे पर रहे और वक्षपट एपोद के ऊपर से खिसक न जाए[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘वक्षस्थल का पट्ट’। यहाँ प्रयुक्त हिब्रू शब्द एपोद से जुड़े याजकीय वक्ष-वस्त्र को दर्शाता है, युद्ध के कवच को नहीं।
    reason: lexical_alternative
  - marker: b
    text: या ‘नीली डोरी’। हिब्रू शब्द תְּכֵלֶת पवित्र-स्थान और याजकीय वस्त्रों में प्रयुक्त नीले रंग की सामग्री को दर्शाता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘अपनी जगह से न हटे’।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִרְכְּסוּ
  choice: बाँधें
  rationale: यह क्रिया छल्लों और डोरी की सहायता से दो वस्तुओं को कसकर जोड़ने को व्यक्त करती है; ‘बाँधें’ सहज और प्रसंगानुकूल है।
- source_word: הַחֹשֶׁן
  choice: वक्षपट
  rationale: यह महायाजक के सीने पर पहना जाने वाला विशेष वस्त्रांश है, युद्ध में पहना जाने वाला कवच नहीं। ‘वक्षपट’ इस भेद को संक्षेप और गरिमा के साथ व्यक्त करता है।
- source_word: מִטַּבְּעֹתָיו
  choice: उसके छल्लों के द्वारा
  rationale: उपसर्ग מִ־ यहाँ वक्षपट के छल्लों को बंधन के आरंभ-बिंदु अथवा साधन के रूप में दिखाता है।
- source_word: טַבְּעֹת הָאֵפֹד
  choice: एपोद के छल्लों से
  rationale: सम्बन्धवाचक हिब्रू पदबंध को स्वाभाविक हिन्दी में रखा गया है।
- source_word: בִּפְתִיל תְּכֵלֶת
  choice: नीले सूत की डोरी से
  rationale: פְּתִיל डोरी या धागे को और תְּכֵלֶת पवित्र-स्थान के वस्त्रों में प्रयुक्त नीले रंग की रंगी हुई सामग्री को दर्शाता है।
- source_word: לִהְיוֹת עַל
  choice: पर बना रहे
  rationale: यह उद्देश्य अथवा अपेक्षित परिणाम व्यक्त करता है और वक्षपट की स्थिर स्थिति को बिना अनावश्यक अर्थ जोड़े स्वाभाविक हिन्दी में बताता है।
- source_word: חֵשֶׁב הָאֵפֹד
  choice: एपोद के कुशल कारीगरी से बुने हुए पट्टे
  rationale: חֵשֶׁב यहाँ एपोद से जुड़े कलात्मक रूप से बुने पट्टे को सूचित करता है; ‘पट्टा’ इसके आकार और कार्य को स्पष्ट रखता है।
- source_word: וְלֹא יִזַּח
  choice: खिसक न जाए
  rationale: दुर्लभ क्रिया का निफ़अल रूप अपनी जगह से हटने या अलग होने का भाव देता है; वस्त्र बाँधने के इस प्रसंग में ‘खिसक न जाए’ स्वाभाविक है।
- source_word: מֵעַל הָאֵפֹד
  choice: एपोद के ऊपर से
  rationale: מֵעַל उस स्थान से हटने का भाव रखता है जहाँ वक्षपट एपोद पर टिका है।
