  text: And they shall take the gold[a], and the blue, and the purple, and the scarlet yarn[b], and the fine linen.
translation:
  language: hi
  text: और वे सोना, नीले और बैंगनी रंग का सूत[a], किरमिजी सूत[b], और महीन सन का कपड़ा लें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “नीला” और “बैंगनी” के इब्रानी शब्द केवल रंगों के बजाय उन रंगों से रंगी वस्त्र-सामग्री को भी दर्शा सकते हैं।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “कीड़े का किरमिजी”; आशय एक कीट से प्राप्त रंग में रंगे किरमिजी सूत या वस्त्र से है।
    reason: cultural_note
lexical_decisions:
- source_word: וְהֵם
  choice: और वे
  rationale: स्वतंत्र सर्वनाम कारीगरों को स्पष्ट कर्ता बनाता है; हिंदी में स्वाभाविक रहते हुए यही हल्का बल सुरक्षित रहता है।
- source_word: יִקְחוּ
  choice: लें
  rationale: इस निर्देशात्मक प्रसंग में अपूर्ण क्रिया आज्ञार्थक/विधिक भाव रखती है; “लें” स्वाभाविक और संक्षिप्त है।
- source_word: הַזָּהָב
  choice: सोना
  rationale: निर्दिष्ट निर्माण-सामग्री का अर्थ सीधे और स्वाभाविक हिंदी में व्यक्त होता है।
- source_word: הַתְּכֵלֶת
  choice: नीला सूत
  rationale: यह शब्द केवल अमूर्त रंग नहीं, नीले रंग से रंगी वस्त्र-सामग्री को सूचित कर सकता है; परिधान-निर्माण के प्रसंग में “सूत” इसे स्पष्ट करता है।
- source_word: הָאַרְגָּמָן
  choice: बैंगनी सूत
  rationale: यह बैंगनी रंगी वस्त्र-सामग्री का द्योतक है; सूची में समानांतर और स्वाभाविक अभिव्यक्ति के लिए “सूत” जोड़ा गया है।
- source_word: תּוֹלַעַת הַשָּׁנִי
  choice: लाल रंग का सूत
  rationale: शाब्दिक मुहावरा कीट-स्रोत से बने गहरे लाल रंग की सामग्री को दर्शाता है; आधुनिक सामान्य हिंदी में “लाल रंग का सूत” सहज है, जबकि सांस्कृतिक विवरण पादटिप्पणी में सुरक्षित है।
- source_word: הַשֵּׁשׁ
  choice: बढ़िया मलमल
  rationale: मिलापवाले तंबू के प्रसंग में यह उत्तम महीन सन-वस्त्र को दर्शाता है; “बढ़िया मलमल” सामान्य हिंदी पाठक के लिए वस्त्र की महीन गुणवत्ता स्पष्ट करता है।
