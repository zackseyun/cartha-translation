- source_word: סַפִּיר
  choice: नीलम
  rationale: परम्परागत और सहज हिन्दी नाम ‘नीलम’ रखा गया है, यद्यपि प्राचीन सन्दर्भ में इससे लाजवर्द अभिप्रेत हो सकता है; यह अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: וְ/יָהֲלֹם
  choice: और हीरा
  rationale: ‘हीरा’ इसका प्रचलित पारम्परिक अनुवाद है, पर रत्न की सटीक पहचान विवादित है; वैकल्पिक पहचानों को पादटिप्पणी में रखा गया है।
