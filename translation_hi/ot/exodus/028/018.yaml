- source_word: וְ/הַ/טּוּר
  choice: और ... पंक्ति में
  rationale: हिब्रू טוּר यहाँ चपरास में जड़े रत्नों की पंक्ति को सूचित करता है। सूची के स्वाभाविक हिन्दी प्रवाह के लिए संबंध को ‘पंक्ति में’ से व्यक्त किया गया है।
- source_word: הַ/שֵּׁנִי
  choice: दूसरी
  rationale: यह क्रमवाचक विशेषण ‘पंक्ति’ को विशेषित करता है; हिन्दी में लिंग-सामंजस्य के साथ ‘दूसरी’ स्वाभाविक है।
- source_word: נֹפֶךְ
  choice: फ़िरोज़ा
