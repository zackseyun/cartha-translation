  text: और शुद्ध सोने की दो जंजीरें बनाना; उन्हें डोरी की तरह मरोड़ी हुई कारीगरी से बनाना[a], और उन मरोड़ी हुई जंजीरों को जड़ाऊ आधारों पर लगाना[b]।
