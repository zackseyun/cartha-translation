lexical_decisions:
- source_word: וְהַטּוּר הָרְבִיעִי
  choice: और चौथी पंक्ति में
  rationale: रत्नों की क्रमबद्ध पंक्तियों के संदर्भ में טוּר का स्वाभाविक हिन्दी अर्थ ‘पंक्ति’ है; ‘में’ जोड़ने से हिन्दी सूची सहज बनती है।
- source_word: תַּרְשִׁישׁ
  choice: बेरिल
  rationale: इस प्राचीन रत्न की ठीक पहचान अनिश्चित है। ‘बेरिल’ एक प्रचलित पारंपरिक समतुल्य है, और अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
- source_word: שֹׁהַם
  choice: सुलेमानी
  rationale: שֹׁהַם की पहचान विवादित है; ‘सुलेमानी’ हिन्दी में ओनिक्स के लिए परिचित पारंपरिक रत्न-नाम है।
- source_word: יָשְׁפֵה
  choice: यशब पत्थर
  rationale: ‘यशब’ जैस्पर का स्थापित हिन्दी बाइबलीय नाम है; ‘पत्थर’ जोड़ने से सामान्य पाठक के लिए अर्थ स्पष्ट रहता है।
- source_word: מְשֻׁבָּצִים
  choice: जड़े जाएँ
  rationale: रत्नों को आधार में बैठाने के लिए ‘जड़ना’ स्वाभाविक हिन्दी क्रिया है और हिब्रू के कर्मवाच्य भाव को बनाए रखती है।
- source_word: זָהָב
  choice: सोने
  rationale: धातु के सीधे अर्थ को स्वाभाविक सम्बन्धकारक रूप में व्यक्त किया गया है।
- source_word: יִהְיוּ
  choice: हों … जड़े जाएँ
  rationale: यहाँ अपूर्ण क्रिया निर्माण-संबंधी निर्देश व्यक्त करती है; हिन्दी विधिसूचक रूप उस निर्देशात्मक बल को सुरक्षित रखता है।
- source_word: בְּמִלּוּאֹתָם
  choice: खाँचों में
  rationale: कारीगरी के इस संदर्भ में מִלּוּאִים उन सोने के आधारों या खाँचों को दर्शाता है जिनमें रत्न जड़े जाते हैं; ‘खाँचे’ सामान्य हिन्दी में स्पष्ट और स्वाभाविक है।
