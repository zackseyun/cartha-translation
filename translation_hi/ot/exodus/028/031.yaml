  - marker: b
    text: यहाँ प्रयुक्त इब्रानी शब्द महँगी रंगी हुई सामग्री के लिए है, जिसका रंग नीले से नीले-बैंगनी तक हो सकता था।
    reason: cultural_note
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: तू ... बनाना
  rationale: निर्देशों की शृंखला में संयोजक सहित क़ाल पूर्ण क्रिया आज्ञार्थक भाव रखती है; यह रूप आधुनिक हिन्दी में सीधे निर्देश को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מְעִיל
  choice: बागा
  rationale: यह याजकीय परिधान का एक लंबा वस्त्र है; ‘बागा’ आधुनिक हिन्दी बाइबलीय प्रयोग में संक्षिप्त और समझने योग्य समतुल्य है।
- source_word: הָאֵפֹד
  choice: एपोद
  rationale: यह याजकीय परिधान के लिए तकनीकी शब्द है, इसलिए अनिश्चित वर्णनात्मक अनुवाद के बजाय लिप्यंतरण रखा गया है। संबंधवाचक रचना को ‘एपोद का बागा’ से व्यक्त किया गया है।
- source_word: כְּלִיל
  choice: पूरी तरह
  rationale: यह संपूर्णता का भाव देता है और अगले पदार्थ-सूचक पद के साथ हिन्दी में स्वाभाविक क्रियाविशेषणीय रूप है।
- source_word: תְּכֵלֶת
  choice: नीले रंग का कपड़ा
  rationale: यह महँगी नीली अथवा नीली-बैंगनी रंगाई वाले पदार्थ को सूचित करता है। मुख्य पाठ में सहज ‘नीले रंग का कपड़ा’ रखा गया है और रंग की सीमा पादटिप्पणी में स्पष्ट की गई है।
