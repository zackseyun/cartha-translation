id: EXO.28.11
reference: Exodus 28:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: מַעֲשֵׂ֣ה חָרַשׁ֮ אֶבֶן֒ פִּתּוּחֵ֣י חֹתָ֗ם תְּפַתַּח֙ אֶת שְׁתֵּ֣י הָ/אֲבָנִ֔ים עַל שְׁמֹ֖ת בְּנֵ֣י יִשְׂרָאֵ֑ל מֻסַבֹּ֛ת מִשְׁבְּצ֥וֹת זָהָ֖ב תַּעֲשֶׂ֥ה אֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/011.yaml
  text: Like the work of an engraver in stone[a], like the engravings of a signet, you shall engrave the two stones with the names of the sons of Israel[b]; you shall make them enclosed in settings of gold.
translation:
  language: hi
  text: पत्थर पर नक्काशी करनेवाले कारीगर के काम की तरह, मुहर की नक्काशी की तरह, तुम इस्राएल के पुत्रों के नाम उन दोनों पत्थरों पर उकेरना[a]; और उन्हें सोने की जड़ाइयों में जड़ना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “इस्राएल के पुत्रों” से यहाँ इस्राएल के बारह पुत्र अभिप्रेत हैं, जिनके नाम पत्थरों पर उकेरे जाने थे; ये नाम इस्राएल के गोत्रों से भी जुड़े हैं।
    reason: cultural_note
lexical_decisions:
- source_word: מַעֲשֵׂה חָרַשׁ אֶבֶן
  choice: पत्थर पर नक्काशी करनेवाले कारीगर के काम की तरह
  rationale: यह पदबंध पत्थर पर काम करनेवाले शिल्पी की कारीगरी को नमूने या रीति के रूप में प्रस्तुत करता है; हिन्दी में यह रूप स्पष्ट और स्वाभाविक है।
- source_word: פִּתּוּחֵי חֹתָם
  choice: मुहर पर की जानेवाली नक्काशी की तरह
  rationale: यह मुहर के लिए की जानेवाली बारीक उत्कीर्णन-कला को सूचित करता है; 'मुहर' सामान्य पाठक के लिए सहज है और मूल के अर्थ को बनाए रखता है।
- source_word: תְּפַתַּח
  choice: खोदना
  rationale: पत्थरों पर नाम उकेरने की आज्ञा के लिए 'खोदना' सरल और प्रसंगानुकूल हिन्दी है।
- source_word: שְׁתֵּי הָאֲבָנִים
  choice: उन दोनों पत्थरों
  rationale: मूल में सामान्य शब्द 'पत्थर' है; प्रसंग से इनके बहुमूल्य रत्न होने का बोध होता है, इसलिए अनावश्यक विशिष्टीकरण नहीं किया गया।
- source_word: עַל שְׁמֹת בְּנֵי יִשְׂרָאֵל
  choice: पर इस्राएल के पुत्रों के नाम
  rationale: यह पत्थरों पर अंकित सामग्री को व्यक्त करता है। 'इस्राएल के पुत्र' मूल के पुरुषवाची वंश-संबंधी पद को सुरक्षित रखता है।
- source_word: מֻסַבֹּת מִשְׁבְּצוֹת זָהָב
  choice: सोने के खाँचों में जड़ना
  rationale: यह पत्थरों को सोने की बनाई हुई घेरदार जड़ाइयों में बैठाने का भाव देता है; 'खाँचों में जड़ना' आभूषण-कला के संदर्भ में स्वाभाविक हिन्दी है।
- source_word: תַּעֲשֶׂה אֹתָם
  choice: उन्हें ... जड़ना
  rationale: हिब्रू की आज्ञा को पिछले क्रियापद के समान हिन्दी के सामान्य आज्ञार्थक रूप में प्रस्तुत किया गया है।
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל का पुरुषवाची पारिवारिक पद
  choice: इस्राएल के पुत्रों
  alternative: इस्राएल की सन्तानों / इस्राएलियों
  rationale: तात्कालिक प्रसंग में नाम इस्राएल के बारह पुत्रों और उनसे निकले गोत्रों के हैं; अतः मूल की वंशावली-संबंधी अभिव्यक्ति सुरक्षित रखी गई है, जबकि टिप्पणी उसका व्यापक प्रतिनिधिक संदर्भ स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण निर्देशात्मक शैली अपनाई गई है। शिल्प-संबंधी अर्थ स्पष्ट रखने के लिए 'नक्काशी', 'खोदना' और 'खाँचों में जड़ना' जैसे परिचित शब्द चुने गए हैं।
