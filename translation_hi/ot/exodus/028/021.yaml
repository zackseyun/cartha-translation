source:
  edition: WLC
  text: וְ֠/הָ/אֲבָנִים תִּֽהְיֶ֜יןָ עַל שְׁמֹ֧ת בְּנֵֽי יִשְׂרָאֵ֛ל שְׁתֵּ֥ים עֶשְׂרֵ֖ה עַל שְׁמֹתָ֑/ם פִּתּוּחֵ֤י חוֹתָם֙ אִ֣ישׁ עַל שְׁמ֔/וֹ תִּֽהְיֶ֕יןָ לִ/שְׁנֵ֥י עָשָׂ֖ר שָֽׁבֶט־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/021.yaml
  text: And the stones shall correspond to the names of the sons of Israel[a], twelve according to their names. They shall be engraved like a signet, each with his name[c][b], for the twelve tribes.
translation:
  language: hi
  text: और वे पत्थर इस्राएल के पुत्रों के नामों के अनुसार हों[a][c]—उनके नामों के अनुसार बारह। उन पर मुहर की नक्काशी के समान, हर एक पर उसका नाम खुदा हो[b]; वे बारह गोत्रों के लिए हों।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस्राएल के पुत्रों के नाम धारण करें।” हिब्रू में शाब्दिक रूप से “इस्राएल के पुत्रों के नामों पर/के अनुसार” है।
    reason: lexical_alternative
  - marker: b
    text: या, “उन पर मुहर की नक्काशी हो”; अर्थात मुहर पर अक्षर खोदने की शैली में।
    reason: lexical_alternative
  - marker: c
    text: “इस्राएल के पुत्र” हिब्रू की अभिव्यक्ति है; इसका अनुवाद “इस्राएल की संतान” या “इस्राएली” भी किया जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲבָנִים
  choice: और वे पत्थर
  rationale: संयोजक וְ और निश्चित पद को संदर्भानुसार स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: תִּהְיֶיןָ עַל שְׁמֹת בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों के नामों के अनुसार हों
  rationale: תִּהְיֶיןָ का अस्तित्ववाचक भाव और עַל का यहाँ संबंध/अनुरूपता का अर्थ दोनों सुरक्षित रहते हैं; इसे केवल भौतिक अर्थ ‘नामों पर’ नहीं बनाया गया।
- source_word: שְׁתֵּים עֶשְׂרֵה עַל שְׁמֹתָם
  choice: उनके नामों के अनुसार बारह
  rationale: पत्थरों की संख्या और नामों से उनके एक-एक संबंध को हिब्रू की संक्षिप्त पुनरुक्ति सहित व्यक्त करता है।
- source_word: פִּתּוּחֵי חוֹתָם
  choice: मुहर जैसी नक्काशी से … खुदा हो
  rationale: यह मुहर या मुद्रांक पर होनेवाली नक्काशी की शैली बताता है; हिन्दी में क्रियात्मक रूप स्वाभाविक है और उत्कीर्णन का आशय स्पष्ट करता है।
- source_word: אִישׁ עַל שְׁמוֹ
  choice: हरेक का नाम
  rationale: אִישׁ के वितरणात्मक अर्थ ‘हरेक’ को व्यक्त करता है और हर पत्थर पर संबंधित व्यक्ति/गोत्र का अलग नाम होने का भाव बनाए रखता है।
- source_word: תִּהְיֶיןָ לִשְׁנֵי עָשָׂר שָׁבֶט
  choice: वे बारह गोत्रों के लिए हों
  rationale: לְ के उद्देश्य/संबंध के भाव और मूल पाठ की अंतिम क्रिया को स्पष्ट रूप से बनाए रखता है।
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל का लिंगयुक्त वाचा-संबंधी पद
  choice: इस्राएल के पुत्र
  alternative: इस्राएली / इस्राएल की संतान
  rationale: मूल हिब्रू का शाब्दिक और पारंपरिक वाचा-संबंधी रूप ‘इस्राएल के पुत्र’ है। प्रसंग में ये बारह गोत्रों के नाम हैं; इसलिए पद को लिंग-निरपेक्ष बनाकर उसकी औपचारिक अभिव्यक्ति नहीं मिटाई गई।
- issue: पत्थरों और नामों के संबंध में עַל की व्याख्या
  choice: नामों के अनुसार
  alternative: नाम धारण करनेवाले
  rationale: यहाँ עַל संबंध या अनुरूपता बता सकता है। मुख्य पाठ में निकटतर ‘के अनुसार’ रखा गया है, जबकि ‘नाम धारण करनेवाले’ को वैध अर्थ-स्पष्टीकरण के रूप में पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप अपनाया गया है। ‘गोत्र’, ‘मुहर’ और ‘नक्काशी’ जैसे परिचित बाइबलीय तथा ठोस शब्द रखे गए हैं। हिब्रू की पुनरुक्ति और संबंधगत अस्पष्टता को अत्यधिक समझाकर समाप्त नहीं किया गया।
