  yaml_path: translation/ot/exodus/028/003.yaml
  text: And you shall speak to all the wise of heart[a], whom I have filled with a spirit of wisdom, and they shall make Aaron’s garments to consecrate him[c][b], for him to serve me as priest.
translation:
  language: hi
  text: “और तू उन सब हृदय से बुद्धिमानों[a] से बात करना, जिन्हें मैंने बुद्धि की आत्मा[b] से भर दिया है; और वे हारून के वस्त्र बनाएँ, उसे पवित्र ठहराने के लिए, जिससे वह मेरे लिए याजक के रूप में सेवा करे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “हृदय के बुद्धिमान”; यह मुहावरा उन लोगों के लिए है जिन्हें समझ और कुशल कारीगरी की योग्यता मिली है।
    reason: lexical_alternative
  - marker: b
    text: इसका अर्थ परमेश्वर की ओर से दी गई बुद्धि की आत्मा, प्रवृत्ति या सामर्थ्य हो सकता है; मूल भाषा यहाँ इससे अधिक स्पष्ट नहीं करती।
    reason: alternative_reading
lexical_decisions:
- source_word: תְּדַבֵּר
  choice: बात करना
  rationale: निर्देश के संदर्भ में पिएल अपूर्ण क्रिया का आदेशात्मक बल स्वाभाविक आधुनिक हिन्दी में ‘तू ... बात करना’ से व्यक्त होता है।
- source_word: חַכְמֵי לֵב
  choice: बुद्धिमान हृदयवाले
  rationale: यह इब्रानी मुहावरे में बुद्धि, समझ और कारीगरी की योग्यता का बोध कराता है। मुख्य पाठ में ‘हृदय’ का रूपक रखा गया है और पादटिप्पणी में उसका व्यावहारिक अर्थ स्पष्ट किया गया है।
- source_word: מִלֵּאתִיו רוּחַ חָכְמָה
  choice: जिन्हें मैंने बुद्धि की आत्मा से भर दिया है
  rationale: ‘भर दिया’ मूल क्रिया की छवि बनाए रखता है। ‘बुद्धि की आत्मा’ रוּחַ की उस वास्तविक अस्पष्टता को सुरक्षित रखता है जिसमें परमेश्वर से मिली आत्मा, प्रवृत्ति या सामर्थ्य का भाव हो सकता है। इब्रानी में एकवचन प्रत्यय सामूहिक समूह की ओर संकेत करता है; हिन्दी में स्वाभाविक सामूहिक संबंध के लिए ‘जिन्हें’ प्रयुक्त है।
- source_word: בִּגְדֵי אַהֲרֹן
  choice: हारून के वस्त्र
  rationale: यह संबंधवाचक पदबंध का सीधा अनुवाद है; ‘याजकीय’ संदर्भ से स्पष्ट है, पर इस पदबंध में स्वयं उपस्थित नहीं, इसलिए नहीं जोड़ा गया।
- source_word: לְקַדְּשׁוֹ
  choice: उसे पवित्र ठहराया जाए
  rationale: याजकीय संदर्भ में क्रिया किसी व्यक्ति को पवित्र सेवा के लिए अलग और समर्पित किए जाने का बोध कराती है। कर्मवाच्य हिन्दी में वस्त्र बनाए जाने के उद्देश्य को सहज रूप से व्यक्त करता है।
- source_word: לְכַהֲנוֹ לִי
  choice: वह मेरे लिए याजक का काम करे
  rationale: כהן क्रिया का अर्थ याजक के रूप में कार्य या सेवा करना है। ‘मेरे लिए’ לִי को स्पष्ट रखता है और अनावश्यक रूप से केवल पदवी ‘मेरा याजक’ में नहीं बदलता।
- source_word: וְעָשׂוּ
  choice: वे ... बनाएँ
  rationale: निर्देशों की शृंखला में यह क्रिया आगे का निर्देश देती है; हिन्दी में संभावनार्थक-आदेशात्मक ‘बनाएँ’ इसका स्वाभाविक रूप है।
theological_decisions:
- issue: क्या רוּחַ חָכְמָה को पवित्र आत्मा का स्पष्ट नाम माना जाए
  choice: बुद्धि की आत्मा
  alternative: बुद्धि देनेवाला पवित्र आत्मा; बुद्धि की योग्यता
  rationale: मूल पदबंध में רוּחַ पर निश्चित उपपद नहीं है और संदर्भ ईश्वर से मिली कारीगरी की बुद्धि का है। इसलिए अनुवाद न तो पवित्र आत्मा की स्पष्ट पहचान जोड़ता है, न ‘आत्मा’ को केवल मानवीय कौशल में सीमित करता है।
- issue: לְקַדְּשׁוֹ और לְכַהֲנוֹ के बीच उद्देश्य-संबंध
  choice: ताकि उसे पवित्र ठहराया जाए और वह मेरे लिए याजक का काम करे
  alternative: उसे पवित्र ठहराने के लिए कि वह मेरे लिए याजक का काम करे
  rationale: 'लगातार आए दोनों उद्देश्यसूचक infinitives को निकट संबंध में रखा गया है: वस्त्र उसके पवित्रीकरण से जुड़े हैं और उस पवित्रीकरण का लक्ष्य याजकीय सेवा है। हिन्दी में अत्यधिक बोझिल रचना से बचते हुए दोनों पहलू सुरक्षित रखे गए हैं।'
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, निर्देशात्मक स्वर रखा गया है। निकटवर्ती प्रसंग में परमेश्वर मूसा को सीधे संबोधित करता है, इसलिए ‘तू’ का प्रयोग हुआ है। ‘याजक का काम करे’ सामान्य पाठक के लिए स्पष्ट है और मूल क्रियात्मक अर्थ को बनाए रखता है।
