base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/025.yaml
  text: And you shall put the two ends of the two cords on the two settings[a], and you shall place them on the shoulder pieces of the ephod, at its front.
translation:
  language: hi
  text: और दोनों डोरियों[a] के दोनों छोर दोनों जड़ावों में लगाना; फिर उन जड़ावों को एपोद के कंधे वाले भागों पर, उसके सामने की ओर लगाना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ज़ंजीरें।” इब्रानी शब्द गुँथी हुई मोटी डोरियों या ज़ंजीरों, दोनों के लिए प्रयुक्त हो सकता है; आसपास के सोने के काम का संदर्भ ज़ंजीर-जैसे निर्माण की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: קְצוֹת
  choice: सिरों
  rationale: यह शब्द डोरियों या ज़ंजीरों के अंतिम छोरों को दर्शाता है; ‘सिरों’ सहज और स्पष्ट हिन्दी है।
- source_word: הָעֲבֹתֹת
  choice: डोरियों
  rationale: यह शब्द मोटी या गुँथी हुई डोरियों के साथ-साथ ज़ंजीर जैसे गुँथे काम को भी दर्शा सकता है। मुख्य पाठ में सामान्य अर्थ रखा गया है और सोने के ज़ंजीरनुमा काम की संभावना पादटिप्पणी में दी गई है।
- source_word: הַמִּשְׁבְּצֹת
  choice: जड़ावों
  rationale: यह एपोद पर लगे सोने के उन आधारों या जड़ाऊ हिस्सों को सूचित करता है जिनसे डोरियाँ जोड़ी जाती थीं। ‘जड़ाव’ तकनीकी आशय को अनावश्यक रूप से सीमित किए बिना व्यक्त करता है।
- source_word: כִתְפֹת
  choice: कंधे के भागों
  rationale: शाब्दिक अर्थ ‘कंधे’ है, पर वस्त्र-निर्माण के इस संदर्भ में एपोद के कंधों पर आने वाले भाग अभिप्रेत हैं।
- source_word: אֵפֹד
  choice: एपोद
  rationale: यह याजकीय वस्त्र का विशिष्ट नाम है और इसका कोई सटीक सामान्य हिन्दी पर्याय नहीं है; इसलिए लिप्यंतरण रखा गया है।
- source_word: אֶל מוּל פָּנָיו
  choice: उसके सामने की ओर
  rationale: यह वाक्यांश एपोद के सामने की दिशा या सामने वाले भाग में स्थान रखने का निर्देश देता है। यह हिन्दी अभिव्यक्ति स्थान-संबंधी अर्थ को स्वाभाविक रूप से बनाए रखती है।
- source_word: וְנָתַתָּה
  choice: फिर उन्हें ... रखना
  rationale: נתן यहाँ किसी वस्तु को निश्चित स्थान पर लगाने या रखने के अर्थ में है। ‘उन्हें’ का संदर्भ पूर्वोक्त जुड़े हुए सिरों/जड़ावों से है और हिन्दी में निर्देश को स्पष्ट बनाता है।
