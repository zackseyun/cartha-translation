- source_word: חֹשֶׁן הַמִּשְׁפָּט
  choice: निर्णय की छातीपट्टी
  rationale: חֹשֶׁן महायाजक द्वारा छाती पर पहने जाने वाले विशेष वस्त्र/थैलीनुमा पट्ट को दर्शाता है। מִשְׁפָּט यहाँ ऊरीम और तुम्मीम से जुड़े अधिकृत निर्णय के अर्थ में है; इसलिए सहज हिन्दी में ‘निर्णय की छातीपट्टी’ रखा गया है।
- source_word: הָאוּרִים וְהַתֻּמִּים
  choice: ऊरीम और तुम्मीम
  rationale: इन पवित्र वस्तुओं का सटीक रूप और कार्य अनिश्चित है। अतः विवादित व्युत्पत्तिगत अर्थ थोपने के बजाय हिब्रू नामों का लिप्यन्तरण किया गया है।
- source_word: אֶל
  choice: में
  rationale: נתן के साथ यह छातीपट्टी के भीतर या उससे लगी थैली में रखने का भाव देता है; हिन्दी में ‘में ... रखना’ स्वाभाविक है।
- source_word: וְהָיוּ עַל לֵב אַהֲרֹן
  choice: वे उसके हृदय पर रहें
  rationale: यह छाती पर पहनी वस्तु की वास्तविक स्थिति और हारून की प्रतिनिधिक जिम्मेदारी—दोनों की छवि बनाए रखता है।
- source_word: בְּבֹאוֹ לִפְנֵי יְהוָה
  choice: जब हारून याहवे के सामने भीतर जाए
  rationale: בוא यहाँ पवित्रस्थान में प्रवेश करके परमेश्वर की उपस्थिति में आने का संकेत देता है; ‘भीतर जाए’ प्रवेश का यह भाव सुरक्षित रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: हिब्रू चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यन्तरित किया गया है।
- source_word: וְנָשָׂא
  choice: लिए हुए ... रहे
  rationale: נשא का मूल भाव उठाने/धारण करने का है। हिन्दी वाक्य में यह रूप छातीपट्टी को भौतिक रूप से धारण करने और इस्राएल के लिए प्रतिनिधिक उत्तरदायित्व उठाने—दोनों को व्यक्त करता है।
- source_word: מִשְׁפַּט בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों का निर्णय
  rationale: ‘निर्णय’ पहले प्रयोग के साथ शब्दगत संबंध बनाए रखता है और यहाँ संभावित दैवी न्यायिक निर्णय का अर्थ देता है, जबकि उसके सटीक प्रकार को निश्चित नहीं करता।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्र
  rationale: हिब्रू के पारम्परिक वाचा-संबंधी पदबंध को निकटता से रखा गया है; पादटिप्पणी स्पष्ट करती है कि इसका सामूहिक संकेत इस्राएल की प्रजा से है।
- source_word: תָּמִיד
  choice: निरन्तर
  rationale: याजकीय प्रसंग में यह नियमित और सतत दायित्व को दर्शाता है, न कि अनिवार्यतः हर क्षण चलने वाली भौतिक क्रिया को।
