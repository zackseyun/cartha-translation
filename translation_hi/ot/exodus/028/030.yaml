base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/030.yaml
  text: And you shall put the Urim and the Thummim into the breastpiece of judgment[a], and they shall be on Aaron’s heart when he goes in before Yahweh[c][b]. And Aaron shall bear the judgment of the sons of Israel on his heart before Yahweh continually.
translation:
  language: hi
  text: तू निर्णय की छातीपट्टी में ऊरीम और तुम्मीम[a] रख। जब हारून याहवे के सामने भीतर जाए, तब वे उसके हृदय पर रहें। और हारून इस्राएल के पुत्रों[c] का निर्णय[b] अपने हृदय पर निरन्तर याहवे के सामने धारण करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ऊरीम और तुम्मीम याजकीय निर्णय से जुड़ी पवित्र वस्तुओं के हिब्रू नाम हैं। उनका ठीक रूप और उनके काम करने का ढंग निश्चित रूप से ज्ञात नहीं है। उनके सम्भावित व्युत्पत्तिगत अर्थों में ‘ज्योतियाँ’ और ‘पूर्णताएँ’ शामिल हैं।
    reason: lexical_alternative
  - marker: b
    text: या ‘न्याय’। हिब्रू शब्द מִשְׁפָּט प्रसंग के अनुसार निर्णय, न्यायिक फैसला या न्याय को दर्शा सकता है।
    reason: alternative_reading
  - marker: c
    text: ‘इस्राएल के पुत्र’ हिब्रू अभिव्यक्ति है; यहाँ इसका संकेत इस्राएल की वाचा-बद्ध प्रजा से है।
    reason: lexical_alternative
