base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/043.yaml
  text: And they shall be on Aaron and on his sons when they enter the tent of meeting[a], or when they approach the altar to minister in the holy place, so that they may not bear guilt and die[b]. It shall be a permanent statute for him and for his offspring after him.
translation:
  language: hi
  text: वे हारून और उसके पुत्रों पर उस समय हों, जब वे मिलाप के तंबू में प्रवेश करें या पवित्रस्थान में सेवा करने के लिए वेदी के पास जाएँ, ताकि वे दोष का भार न उठाएँ[a] और मर न जाएँ। यह हारून और उसके बाद उसके वंश के लिए सदा की विधि होगी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दोषी न ठहरें”; इब्रानी में शाब्दिक मुहावरा “दोष उठाना” है।
    reason: lexical_alternative
  - marker: b
    text: या “स्थायी विधि।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ עַל
  choice: वे ... पर ... हों
  rationale: बहुवचन कर्ता पूर्वपद में बताए गए वस्त्रों की ओर संकेत करता है। ‘पर हों’ इब्रानी संरचना और वस्त्र पहने होने के भाव को बनाए रखता है।
- source_word: אֹהֶל מוֹעֵד
  choice: मिलाप का तंबू
  rationale: यह याजकीय उपासना-स्थल का प्रचलित, स्पष्ट और स्रोत-संगत नाम है।
- source_word: בְגִשְׁתָּם אֶל הַמִּזְבֵּחַ
  choice: वेदी के पास जाएँ
  rationale: नגשׁ यहाँ पवित्र सेवा के लिए समीप आने को व्यक्त करता है; ‘पास जाएँ’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: לְשָׁרֵת בַּקֹּדֶשׁ
  choice: पवित्रस्थान में सेवा करने के लिए
  rationale: ‘सेवा’ याजकीय कार्य को सहज हिन्दी में व्यक्त करती है और ‘पवित्रस्थान’ קֹדֶשׁ के पवित्र क्षेत्र के भाव को सुरक्षित रखता है।
- source_word: וְלֹא יִשְׂאוּ עָוֺן
  choice: ताकि वे दोष का भार न उठाएँ
  rationale: यह कानूनी-याजकीय मुहावरे ‘दोष उठाना’ को बनाए रखते हुए उसके दायित्व और परिणाम का भाव देता है।
- source_word: וָמֵתוּ
  choice: और मर न जाएँ
  rationale: निषेधात्मक उद्देश्य के हिन्दी वाक्य-विन्यास में मृत्यु के वास्तविक परिणाम को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: חֻקַּת עוֹלָם
  choice: सदा की विधि
  rationale: यह स्थायी और पीढ़ीगत आदेश का भाव संक्षिप्त, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: זַרְעוֹ
  choice: उसके वंश
  rationale: सामूहिक एकवचन का भाव बनाए रखते हुए हारून के बाद आने वाले वंशजों को स्वाभाविक हिन्दी में दर्शाता है।
theological_decisions:
- issue: अनुचित याजकीय प्रवेश के दोष और मृत्यु का संबंध
  choice: वस्त्र पहनने की आज्ञा का उद्देश्य इस प्रकार व्यक्त किया गया है कि याजक दोष का भार न उठाएँ और मर न जाएँ।
  alternative: ‘ताकि वे दोषी न ठहरें और मर न जाएँ’ या ‘कहीं ऐसा न हो कि वे दोष उठाकर मर जाएँ।’
  rationale: मूल पाठ पवित्रता के उल्लंघन से जुड़ी वास्तविक दोष-देयता और मृत्यु, दोनों को सामने रखता है। अनुवाद न तो इस दंड को नरम करता है, न दोनों के संबंध को आवश्यकता से अधिक परिभाषित करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण याजकीय-कानूनी स्वर रखा गया है। ‘मिलाप का तंबू’, ‘पवित्रस्थान’, ‘वेदी’ और ‘विधि’ जैसे परिचित बाइबलीय पद सामान्य पाठक के लिए बोधगम्य रहते हुए प्रसंग की पवित्रता बनाए रखते हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में संबद्ध पदों के बाद रखे गए हैं।
