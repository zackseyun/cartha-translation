lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: तुम ... लेना
  rationale: निर्देशों की क्रमिक शृंखला में संयोजक वाव के साथ आया पूर्ण क्रियारूप आदेश का भाव देता है; हिंदी में ‘लेना’ स्वाभाविक और स्पष्ट निर्देश है।
- source_word: שְׁתֵּי אַבְנֵי שֹׁהַם
  choice: दो सुलेमानी पत्थर
  rationale: שֹׁהַם किसी बहुमूल्य पत्थर का नाम है जिसकी ठीक पहचान अनिश्चित है। ‘सुलेमानी पत्थर’ हिंदी में पारंपरिक और समझ में आने वाला समतुल्य है; अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: וּפִתַּחְתָּ
  choice: खोदना
  rationale: रत्नों पर नाम काटकर अंकित करने के प्रसंग में ‘खोदना’ क्रिया उत्कीर्ण करने की ठोस क्रिया को स्वाभाविक आधुनिक हिंदी में व्यक्त करती है।
- source_word: עֲלֵיהֶם
  choice: उन पर
  rationale: यह बहुवचन सर्वनाम पहले बताए गए दोनों पत्थरों की ओर संकेत करता है और स्थानगत अर्थ को सीधे बनाए रखता है।
- source_word: שְׁמוֹת
  choice: नाम
  rationale: यह उन विशिष्ट नामों को बताता है जिन्हें पत्थरों पर खोदा जाना है; हिंदी में यहाँ अलग निश्चितता-सूचक शब्द आवश्यक नहीं है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: यहाँ यह पद इस्राएल अर्थात याकूब के उन पुत्रों को सूचित करता है जिनसे गोत्र निकले; इसलिए सामान्य ‘इस्राएलियों’ की अपेक्षा शाब्दिक संबंध बनाए रखना अधिक सटीक है।
