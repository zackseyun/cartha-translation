- source_word: זָהָב
  choice: सोने के
  rationale: यह उस सामग्री को बताता है जिससे जड़ाव बनाए जाने हैं; ‘सोने के’ आधुनिक हिंदी में स्वाभाविक और स्पष्ट है।
