  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। याजकीय परिधान के तकनीकी शब्दों के लिए प्रचलित रूप चुने गए हैं, और שִׁבַּצְתָּ की वास्तविक शाब्दिक अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
