  text: You shall weave the tunic in checker work of fine linen[a], and you shall make a turban of fine linen, and you shall make a sash, the work of an embroiderer.
translation:
  language: hi
  text: “तुम महीन लिनन का कुरता चौखानेदार ढंग से बुनना[a], और महीन लिनन की पगड़ी बनाना; और कढ़ाई की कारीगरी का कमरबंद बनाना।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘महीन लिनन का कुरता चौखानेदार नमूने में बनाना।’ इब्रानी क्रिया संभवतः नमूनेदार कपड़ा तैयार करने का संकेत देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבַּצְתָּ
  choice: चौखानेदार बुनना
  rationale: यह क्रिया याजकीय वस्त्रों के संदर्भ में कपड़े को खानों या नमूनेदार बनावट में तैयार करने का संकेत देती है। यह अनुवाद बुनाई की प्रक्रिया और उसके संभावित चौखानेदार परिणाम, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַכְּתֹנֶת
  choice: कुरता
  rationale: כְּתֹנֶת शरीर पर पहना जाने वाला निकटवर्ती लंबा वस्त्र है। आधुनिक हिन्दी में ‘कुरता’ सामान्य पाठक के लिए सहज और ‘अंगरखा’ की तुलना में कम पुरातन है।
- source_word: שֵׁשׁ
  choice: महीन मलमल
  rationale: निवास-स्थान और याजकीय वस्त्रों के संदर्भ में שֵׁשׁ उच्च कोटि के महीन सन-वस्त्र को दर्शाता है। ‘महीन मलमल’ उसकी महीन, मूल्यवान वस्त्र-गुणवत्ता को सहज हिन्दी में प्रकट करता है।
- source_word: מִצְנֶפֶת
  choice: पगड़ी
  rationale: यह सिर पर लपेटा जाने वाला याजकीय सिर-वस्त्र है; हिन्दी में ‘पगड़ी’ इसका स्पष्ट और प्रचलित समतुल्य है।
- source_word: אַבְנֵט
  choice: कमरबंद
  rationale: यह कमर पर बाँधा जाने वाला लंबा, सजावटी याजकीय वस्त्र है। ‘कमरबंद’ ‘पेटी’ से अधिक सटीक और ‘कटिबंध’ से अधिक सामान्य आधुनिक हिन्दी है।
- source_word: מַעֲשֵׂה רֹקֵם
  choice: कढ़ाई करनेवाले की कारीगरी
  rationale: यह पद किसी कुशल कारीगर द्वारा किए गए सजावटी वस्त्र-कार्य को व्यक्त करता है। यह रूप मूल की कर्ता-केंद्रित संरचना को बनाए रखता है।
