  text: And you shall make on the breastpiece chains of pure gold[a], braided work like cords.
translation:
  language: hi
  text: और छातीबन्द पर शुद्ध सोने की ऐसी जंजीरें बनाना, जो डोरियों के समान गूँथी हुई हों।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: और ... बनाना
  rationale: निर्देशों की शृंखला में संयोजक सहित यह क्रियारूप आज्ञार्थक भाव रखता है; आधुनिक हिन्दी में ‘बनाना’ शिल्प-निर्देश की स्वाभाविक शैली है।
- source_word: עַל הַחֹשֶׁן
  choice: छातीबन्द पर
  rationale: עַל का मूल स्थानवाचक अर्थ ‘पर’ है और यहाँ जंजीरों के छातीबन्द पर बनाए या लगाए जाने का संकेत देता है।
- source_word: שַׁרְשֹׁת
  choice: जंजीरें
  rationale: यह बहुवचन संज्ञा जुड़ी हुई कड़ियों वाली जंजीरों को दर्शाती है; ‘जंजीरें’ स्पष्ट और प्रचलित हिन्दी है।
- source_word: גַּבְלֻת מַעֲשֵׂה עֲבֹת
  choice: ऐसी ... जो डोरियों के समान गूँथी हुई हों
  rationale: दुर्लभ גַּבְלֻת और ‘डोरी/रस्सी के काम’ वाली अगली अभिव्यक्ति मिलकर बटी, गूँथी या डोरी-जैसी कारीगरी बताते हैं; यह चयन उस रूपक को सहज हिन्दी में बनाए रखता है।
- source_word: זָהָב טָהוֹר
  choice: शुद्ध सोने की
  rationale: पवित्रस्थान की सामग्री के वर्णन में यह मानक और सीधा अनुवाद है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और शिल्प-निर्देश के अनुरूप रखी गई है। ‘छातीबन्द’ को חֹשֶׁן के लिए संक्षिप्त, समझने योग्य वस्त्र-संज्ञा के रूप में चुना गया है। स्रोत की डोरी-जैसी बनावट को मुख्य पाठ में स्पष्ट कर देने के कारण अलग पाठ-टिप्पणी आवश्यक नहीं समझी गई।
