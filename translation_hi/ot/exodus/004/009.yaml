language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הָיָ֡ה אִם לֹ֣א יַאֲמִ֡ינוּ גַּם֩ לִ/שְׁנֵ֨י הָ/אֹת֜וֹת הָ/אֵ֗לֶּה וְ/לֹ֤א יִשְׁמְעוּ/ן֙ לְ/קֹלֶ֔/ךָ וְ/לָקַחְתָּ֙ מִ/מֵּימֵ֣י הַ/יְאֹ֔ר וְ/שָׁפַכְתָּ֖ הַ/יַּבָּשָׁ֑ה וְ/הָי֤וּ הַ/מַּ֨יִם֙ אֲשֶׁ֣ר תִּקַּ֣ח מִן הַ/יְאֹ֔ר וְ/הָי֥וּ לְ/דָ֖ם בַּ/יַּבָּֽשֶׁת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/009.yaml
  text: And if they do not believe even these two signs and do not listen to your voice[a], then you shall take some of the water of the Nile and pour it on the dry ground[b], and the water that you take from the Nile will become blood on the dry ground.
translation:
  language: hi
  text: और यदि वे इन दोनों चिन्हों पर भी विश्वास न करें और तुम्हारी बात न सुनें[a], तो नील नदी का कुछ जल लेकर सूखी भूमि पर उंडेल देना। जो जल तुम नील नदी से लोगे, वह सूखी भूमि पर लहू बन जाएगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारी बात पर ध्यान न दें।” इब्रानी मुहावरे का शाब्दिक अर्थ है, “तुम्हारी आवाज़ न सुनें।”
    reason: lexical_alternative
  - marker: b
    text: या, “लहू में बदल जाएगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: और यदि
  rationale: यह पदबंध एक संभावित शर्त प्रस्तुत करता है। ‘और यदि’ इब्रानी प्रवाह को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: יַאֲמִינוּ
  choice: विश्वास न करें
  rationale: यहाँ אמן का हिफ़ील रूप दिए गए चिन्हों को प्रमाण मानकर विश्वास करने के अर्थ में है।
- source_word: גַּם לִשְׁנֵי הָאֹתוֹת הָאֵלֶּה
  choice: इन दोनों चिन्हों पर भी
  rationale: ‘भी’ גַּם के बल और पहले बताए गए दोनों चिन्हों के विशिष्ट संदर्भ को व्यक्त करता है।
- source_word: יִשְׁמְעוּן לְקֹלֶךָ
  choice: तुम्हारी बात न सुनें
  rationale: शाब्दिक रूप ‘तुम्हारी आवाज़ न सुनें’ है, पर इस प्रसंग में मुहावरे का आशय मूसा की बात सुनना अथवा उस पर ध्यान देना है। चुना हुआ रूप स्वाभाविक हिन्दी में इब्रानी बिंब को पर्याप्त रूप से बनाए रखता है।
- source_word: מִמֵּימֵי הַיְאֹר
  choice: नील नदी का कुछ जल
  rationale: מִן का अंशवाचक अर्थ ‘कुछ’ से व्यक्त होता है; निर्गमन में יְאֹר नील नदी को सूचित करता है।
- source_word: וְשָׁפַכְתָּ
  choice: उंडेल देना
  rationale: שפך के लिए ‘उंडेलना’ जल को भूमि पर डालने की क्रिया का स्पष्ट और स्वाभाविक हिन्दी रूप है।
- source_word: הַיַּבָּשָׁה / בַּיַּבָּשֶׁת
  choice: सूखी भूमि
  rationale: दोनों रूप जल के विपरीत सूखी जमीन को सूचित करते हैं। एक ही हिन्दी पद की पुनरावृत्ति मूल पाठ की पुनरावृत्ति को सुरक्षित रखती है।
- source_word: וְהָיוּ ... לְדָם
  choice: लहू बन जाएगा
  rationale: היה + ל परिणाम अथवा रूपांतरण व्यक्त करता है। ‘बन जाएगा’ इसे सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: דָם
  choice: लहू
  rationale: शब्द का सीधा अर्थ रक्त/लहू है। ‘लहू’ यहाँ गरिमापूर्ण, परिचित और कथात्मक हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: नील नदी के जल के लहू बनने वाले चिन्ह का स्वरूप
  choice: ‘लहू बन जाएगा’ के रूप में वास्तविक रूपांतरण
  alternative: ‘लहू जैसा दिखाई देगा’ या ‘लहू के रंग का हो जाएगा’
  rationale: इब्रानी पाठ היה + לדם के द्वारा बिना किसी शिथिलीकरण के जल के लहू बनने की बात कहता है। अनुवाद में ऐसी प्राकृतिक या केवल दृश्यात्मक व्याख्या नहीं जोड़ी गई जो मूल पाठ में नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘विश्वास’, ‘चिन्ह’, ‘सूखी भूमि’ और ‘लहू’ सामान्य पाठकों के लिए बोधगम्य हैं; मूल इब्रानी की शर्त, क्रमवृद्धि और शब्द-पुनरावृत्ति सुरक्षित रखी गई है।
