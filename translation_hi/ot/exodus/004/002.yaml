lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम के प्रचलित विद्वत्तापूर्ण लिप्यंतरण को देवनागरी में प्रस्तुत किया गया है; इसे किसी उपाधि से नहीं बदला गया।
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: कहा ... कहा
  rationale: दोनों स्थानों पर אמר की पुनरावृत्ति सुरक्षित रखी गई है। पहला कथन प्रसंग में प्रश्न है और दूसरा उत्तर, फिर भी ‘कहा’ स्वाभाविक और स्रोत के निकट है।
- source_word: אֵלָיו
  choice: उससे
  rationale: हिंदी में बोलने के संदर्भ में ‘उससे कहा’ स्वाभाविक रूप से ‘उसको/उसके प्रति कहा’ का अर्थ देता है।
- source_word: מַה־זֶּה / מִזֶּה
  choice: यह क्या है
  rationale: प्रश्नवाचक और संकेतवाचक अभिव्यक्ति सामने, मूसा के हाथ में उपस्थित वस्तु की पहचान पूछती है।
- source_word: בְּיָדֶךָ
  choice: तेरे हाथ में
  rationale: यह भौतिक रूप से हाथ में पकड़ी वस्तु को सूचित करने वाला सीधा और स्वाभाविक अनुवाद है।
- source_word: מַטֶּה
  choice: एक लाठी
  rationale: मूसा द्वारा साथ रखी जाने वाली staff के लिए ‘लाठी’ आधुनिक हिंदी में सहज है; हिब्रू शब्द का अर्थ ‘डंडा’ भी हो सकता है, इसलिए विकल्प को पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ में आए व्यक्तिगत नाम को उपाधि से बदलने के बजाय उसका देवनागरी लिप्यंतरण रखा गया है; ‘याहवे’ हिब्रू नाम के आधुनिक विद्वत्तापूर्ण उच्चारण को अधिक निकटता से दर्शाता है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘तेरे’ का प्रयोग एकवचन संबोधन और बाइबिलीय संवाद की सहजता को बनाए रखता है। पादटिप्पणी का चिह्न उस शब्द के बाद रखा गया है जिससे उसका वास्तविक संबंध है।
