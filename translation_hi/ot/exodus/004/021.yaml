base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/021.yaml
  text: Then Yahweh said to Moses[a], “When you go back to Egypt, see that you do before Pharaoh all the wonders that I have put in your hand. But I will harden his heart[b], and he will not let the people go.”
translation:
  language: hi
  text: तब याहवे ने मूसा से कहा, “जब तुम मिस्र लौटो, तो इस बात का ध्यान रखना कि फ़िरौन के सामने उन सभी अद्भुत कार्यों[a] को कर दिखाओ जिन्हें मैंने तुम्हारे हाथ में रखा है। पर मैं उसके हृदय को कठोर कर दूँगा[b], और वह लोगों को जाने नहीं देगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “चिह्न” अथवा “चमत्कार।” इब्रानी शब्द ऐसे असाधारण कार्यों को दर्शाता है जो परमेश्वर की सामर्थ्य का प्रदर्शन करते हैं।
    reason: lexical_alternative
  - marker: b
    text: या “मैं उसके हृदय को दृढ़ कर दूँगा” अथवा “मैं उसके हृदय को मज़बूत कर दूँगा।” इब्रानी क्रिया में दृढ़ या मज़बूत करने का भाव हो सकता है; यहाँ यह फ़िरौन के हठपूर्ण इनकार में दृढ़ होने को दर्शाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के विशिष्ट वाचा-नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: בְּלֶכְתְּךָ לָשׁוּב מִצְרַיְמָה
  choice: जब तुम मिस्र लौटो
  rationale: इब्रानी infinitive construction के कालगत अर्थ और लौटने की दिशा को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: רְאֵה
  choice: ध्यान रखना
  rationale: यहाँ आज्ञार्थक क्रिया केवल देखने की नहीं, बल्कि आगे दिए गए काम को सावधानी से पूरा करने की हिदायत देती है।
- source_word: הַמֹּפְתִים
  choice: अद्भुत काम
  rationale: यह शब्द ऐसे असाधारण कार्यों को दर्शाता है जो परमेश्वर की सामर्थ्य का प्रदर्शन और चिह्न होते हैं; विकल्प पादटिप्पणी में रखे गए हैं।
- source_word: שַׂמְתִּי בְיָדֶךָ
  choice: मैंने तुम्हारे हाथ में रखा है
  rationale: मूसा को सौंपे गए अधिकार और सामर्थ्य के अर्थ के साथ मूल इब्रानी की ‘हाथ’ वाली छवि को सुरक्षित रखता है।
- source_word: וַעֲשִׂיתָם לִפְנֵי פַרְעֹה
  choice: फ़िरौन के सामने करना
  rationale: कार्य को फ़िरौन की उपस्थिति में प्रदर्शित करने के सार्वजनिक और सामना करने वाले भाव को स्पष्ट रखता है।
- source_word: אֲחַזֵּק אֶת לִבּוֹ
  choice: मैं उसके हृदय को कठोर कर दूँगा
  rationale: इस प्रसंग में causative חזק फ़िरौन के हठीले इनकार में दृढ़ किए जाने को दर्शाता है; प्रचलित और प्रसंगानुकूल हिन्दी रूप चुना गया है।
- source_word: וְלֹא יְשַׁלַּח אֶת הָעָם
  choice: और वह लोगों को जाने नहीं देगा
  rationale: निर्गमन के प्रसंग में שׁלח का स्वाभाविक अर्थ लोगों को प्रस्थान की अनुमति देना है।
theological_decisions:
- issue: फ़िरौन के हृदय को परमेश्वर द्वारा कठोर किया जाना
  choice: मैं उसके हृदय को कठोर कर दूँगा
  alternative: मैं उसके हृदय को दृढ़ कर दूँगा / मैं उसके हृदय को मज़बूत कर दूँगा
  rationale: इब्रानी חזק में दृढ़ या मज़बूत करने का अर्थ हो सकता है, पर इस कथा में परिणाम फ़िरौन का हठीला इनकार है। मुख्य पाठ परमेश्वर की भूमिका और फ़िरौन की मानवीय ज़िम्मेदारी के बीच मौजूद धार्मिक तनाव को नरम या हल नहीं करता; शाब्दिक विकल्प पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली अपनाई गई है। ‘तुम’ मूसा को किए गए एकवचन संबोधन को सहज रूप में व्यक्त करता है। ‘हाथ में रखा’ मूल रूपक को बनाए रखता है, जबकि ‘ध्यान रखना’ इब्रानी आज्ञा का व्यावहारिक बल सामने लाता है।
