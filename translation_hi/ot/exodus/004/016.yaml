review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Aaron speaking representatively to the people and Moses' divinely authorized role toward Aaron. However, “मुख का काम करेगा” replaces the Hebrew predicate and its deliberately retained ‘mouth’ metaphor with an explanatory paraphrase. Restoring “मुख होगा” better reflects לְפֶה while remaining intelligible.
  naturalness: “वह तुम्हारी ओर से लोगों से बोलेगा” is natural modern Hindi. “वह तुम्हारे लिए मुख होगा” is concise, understandable in the verse's formal register, and preserves the metaphor more directly than “मुख का काम करेगा.”
  terminology: “परमेश्वर के समान होगे” suitably renders the functional comparison expressed in the English audit trail without suggesting that Moses is ontologically God. No names occur in this verse.
  issues:
  - severity: low
    issue: The phrase “मुख का काम करेगा” paraphrases the ‘mouth’ metaphor.
    rationale: The Hebrew says literally that Aaron ‘will be to you for a mouth.’ Since the source deliberately uses a metaphor that is paralleled by Moses' role ‘as God’ to Aaron, the Hindi should retain ‘मुख’ as the predicative image rather than convert it into a job-description.
  revised_text: वह तुम्हारी ओर से लोगों से बोलेगा; वह तुम्हारे लिए मुख होगा, और तुम उसके लिए परमेश्वर के समान होगे।
