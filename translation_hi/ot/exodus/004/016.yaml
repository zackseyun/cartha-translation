  yaml_path: translation/ot/exodus/004/016.yaml
  text: He will speak to the people for you[a], and he will be as a mouth for you[b], and you will be as God to him.
translation:
  language: hi
  text: वह तुम्हारी ओर से लोगों से बोलेगा; वह तुम्हारे लिए मुख होगा, और तुम उसके लिए परमेश्वर के समान होगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְדִבֶּר הוּא לְךָ אֶל־הָעָם
  choice: वह तुम्हारी ओर से लोगों से बोलेगा
  rationale: 'לְךָ को प्रसंगानुसार प्रतिनिधिक अर्थ में लिया गया है: हारून मूसा की ओर से इस्राएली लोगों से बोलेगा।'
- source_word: וְהָיָה הוּא יִהְיֶה לְּךָ לְפֶה
  choice: और तुम्हारे लिए मुख का काम करेगा
  rationale: לְפֶה के ‘मुख’ रूपक को बनाए रखते हुए ‘का काम करेगा’ आधुनिक हिन्दी में हारून की प्रवक्ता-भूमिका स्पष्ट करता है। हिब्रानी में ‘होना’ की पुनरावृत्ति बल देती है, जिसे हिन्दी में अलग से दोहराना अस्वाभाविक होता।
- source_word: וְאַתָּה תִּהְיֶה לּוֹ לֵאלֹהִים
  choice: और तुम उसके लिए परमेश्वर के समान होगे
  rationale: यह कथन मूसा की हारून के प्रति ईश्वर-प्रदत्त प्रतिनिधिक और निर्देशकारी भूमिका बताता है। ‘परमेश्वर के समान’ मूल रूपक का भार रखता है, पर मूसा को तात्त्विक रूप से परमेश्वर कहने का अनावश्यक संकेत नहीं देता।
theological_decisions:
- issue: क्या לֵאלֹהִים का अनुवाद मूसा को सीधे ‘परमेश्वर’ कहे या तुलनात्मक भूमिका व्यक्त करे
  choice: उसके लिए परमेश्वर के समान
  alternative: उसके लिए परमेश्वर
  rationale: हिब्रानी पदबंध मजबूत और संक्षिप्त है, पर संदर्भ में मूसा परमेश्वर से वचन पाकर हारून को देता है। तुलनात्मक हिन्दी इस प्रतिनिधिक अधिकार को व्यक्त करती है और तात्त्विक समानता का भ्रम टालती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक पठन में स्वाभाविक। ‘मुख’ का मूल रूपक सुरक्षित रखा गया है, जबकि ‘का काम करेगा’ उसके आशय को सामान्य पाठक के लिए स्पष्ट करता है।
