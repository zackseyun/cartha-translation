base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/022.yaml
  text: 'Then you shall say to Pharaoh[a], ‘Thus says Yahweh: Israel is my firstborn son.’'
translation:
  language: hi
  text: 'तब तुम फ़िरौन से कहना, “याहवे यों कहता है: इस्राएल मेरा पुत्र, मेरा पहलौठा है।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: तब तुम ... कहना
  rationale: संयोजक वाव सहित क़ाल पूर्ण 2 पुल्लिंग एकवचन यहाँ मूसा को दिए गए क्रमिक निर्देश का भाव रखता है; ‘तब’ क्रम और ‘कहना’ स्वाभाविक निर्देशात्मक स्वर व्यक्त करते हैं।
- source_word: פַּרְעֹה
  choice: फ़िरौन
  rationale: हिन्दी में प्रचलित नाम/उपाधि का रूप।
- source_word: כֹּה אָמַר
  choice: यों कहता है
  rationale: दूत-संदेश के पारंपरिक सूत्र की गंभीरता बनाए रखते हुए यह आधुनिक हिन्दी में स्वाभाविक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार-अक्षरीय व्यक्तिगत ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: בְּנִי
  choice: मेरा पुत्र
  rationale: पुत्रत्व का स्पष्ट रूपक बनाए रखा गया है; इसे लिंग-निरपेक्ष नहीं किया गया।
- source_word: בְכֹרִי
  choice: मेरा पहलौठा
  rationale: यह जन्मक्रम के साथ कानूनी, पारिवारिक और प्रतिष्ठासूचक अर्थ की संभावना को खुला रखता है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: व्यक्तिवाचक नाम का हिन्दी में प्रचलित बाइबलीय लिप्यंतरण; यहाँ यह ‘मेरा पुत्र, मेरा पहलौठा’ के साथ समानाधिकरण में है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल में व्यक्तिगत वाचा-नाम सीधे आया है; लिप्यंतरण उसे उपाधि से प्रतिस्थापित नहीं करता।
- issue: इस्राएल के पुत्रत्व और पहलौठेपन का संबंध
  choice: इस्राएल मेरा पुत्र, मेरा पहलौठा है
  alternative: इस्राएल मेरा पहलौठा पुत्र है
  rationale: मुख्य पाठ में इब्रानी शब्दक्रम और दोहरे समानाधिकरण को रखा गया है, जिससे ‘पुत्र’ और ‘पहलौठा’ दोनों पर बल बना रहता है और उनके संबंध को अनावश्यक रूप से संकुचित नहीं किया जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज और कथात्मक-आदेशात्मक स्तर। ‘यों कहता है’ संदेशवाहक सूत्र की औपचारिकता रखता है; ‘पहलौठा’ सामान्य पाठक के लिए परिचित और स्रोत के अर्थ के निकट है।
