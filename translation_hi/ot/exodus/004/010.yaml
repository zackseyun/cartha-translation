  text: וַ/יֹּ֨אמֶר מֹשֶׁ֣ה אֶל יְהוָה֮ בִּ֣י אֲדֹנָ/י֒ לֹא֩ אִ֨ישׁ דְּבָרִ֜ים אָנֹ֗כִי גַּ֤ם מִ/תְּמוֹל֙ גַּ֣ם מִ/שִּׁלְשֹׁ֔ם גַּ֛ם מֵ/אָ֥ז דַּבֶּרְ/ךָ אֶל עַבְדֶּ֑/ךָ כִּ֧י כְבַד פֶּ֛ה וּ/כְבַ֥ד לָשׁ֖וֹן אָנֹֽכִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/010.yaml
  text: Then Moses said to Yahweh[a], “Please, Lord, I am not a man of words, neither yesterday nor the day before, nor since you have spoken to your servant[b]; for I am heavy of mouth and heavy of tongue.”
translation:
  language: hi
  text: तब मूसा ने याहवे से कहा, “कृपा करके, प्रभु, मैं बोलने में कुशल व्यक्ति नहीं हूँ[a]—न कल, न परसों, न तब से जब से आपने अपने दास से बात की है; क्योंकि मेरा मुँह भारी है और मेरी जीभ भी भारी है[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी का शाब्दिक अर्थ है, “मैं शब्दों का व्यक्ति नहीं हूँ”; आशय हो सकता है, “मैं वाक्पटु नहीं हूँ।”
    reason: lexical_alternative
  - marker: b
    text: “मुँह भारी” और “जीभ भारी” बोलने में कठिनाई के इब्रानी रूपक हैं। ये वाक्पटुता की कमी या किसी वाक्-बाधा की ओर संकेत कर सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: בִּי אֲדֹנָי
  choice: हे प्रभु, कृपा कीजिए
  rationale: בִּי यहाँ विनम्र विनती का सूचक है; यह हिंदी में आदर और आग्रह दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לֹא אִישׁ דְּבָרִים אָנֹכִי
  choice: मैं बोलने में कुशल व्यक्ति नहीं हूँ
  rationale: शाब्दिक इब्रानी ‘मैं शब्दों का व्यक्ति नहीं हूँ’ बोलने की योग्यता की ओर संकेत करता है। मुख्य पाठ में अर्थ को सहज हिंदी में रखा गया और शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: גַּם מִתְּמוֹל גַּם מִשִּׁלְשֹׁם
  choice: न बीते कल था, न उससे पहले
  rationale: यह चयन इब्रानी की दोहरी काल-अभिव्यक्ति को बनाए रखते हुए हिंदी में स्पष्ट करता है कि बीते समय की बात हो रही है।
- source_word: גַּם מֵאָז דַּבֶּרְךָ אֶל עַבְדֶּךָ
  choice: और न तब से हूँ जब से आपने अपने दास से बात की है
  rationale: מֵאָז के ‘तब से’ वाले कालगत अर्थ और परमेश्वर के हाल के संबोधन से अब तक की अवधि को सुरक्षित रखा गया है।
- source_word: עַבְדֶּךָ
  choice: अपने दास
  rationale: प्रत्यक्ष संबोधन में यह मूसा की विनम्र आत्म-पहचान है; ‘दास’ हिंदी बाइबलीय भाषा में स्वाभाविक और गरिमापूर्ण है।
- source_word: כְבַד פֶּה וּכְבַד לָשׁוֹן
  choice: मेरा मुँह भारी है और मेरी जीभ भी भारी है
  rationale: इब्रानी रूपक और समानांतरता को ज्यों का त्यों रखा गया है, ताकि वाक्-कठिनाई का ठीक प्रकार अनावश्यक रूप से निर्धारित न हो।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा ‘प्रभु’
  rationale: मूल पाठ व्यक्तिगत नाम का प्रयोग करता है; लिप्यंतरण उसे किसी उपाधि से प्रतिस्थापित किए बिना सुरक्षित रखता है।
- issue: मूसा की बोलने संबंधी कठिनाई का स्वरूप
  choice: ‘मुँह भारी’ और ‘जीभ भारी’ का रूपक बनाए रखना
  alternative: ‘हकलाता हूँ,’ ‘वाक्-दोष है,’ अथवा केवल ‘अच्छा वक्ता नहीं हूँ’
  rationale: मूल पाठ यह स्पष्ट नहीं करता कि समस्या वाक्पटुता, आत्मविश्वास या शारीरिक वाक्-बाधा थी; इसलिए उसकी वास्तविक अस्पष्टता को बनाए रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिंदी अपनाई गई है। ‘बीते कल’ से कालगत अस्पष्टता दूर की गई है, जबकि ‘मुँह भारी’ और ‘जीभ भारी’ जैसे मूल रूपक जानबूझकर सुरक्षित रखे गए हैं।
