base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/012.yaml
  text: Now go[a], and I will be with your mouth and teach you what you shall speak.
translation:
  language: hi
  text: अब जा। मैं तेरे मुँह के साथ रहूँगा[a] और तुझे सिखाऊँगा कि तुझे क्या बोलना है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शब्दशः, ‘तेरे मुँह के साथ।’
    reason: मूल इब्रानी की ठोस अभिव्यक्ति ‘तेरे मुँह के साथ’ का शाब्दिक रूप सूचित करना।
lexical_decisions:
- source_word: וְעַתָּה
  choice: अब
  rationale: यह प्रसंग में मूसा की आपत्ति के उत्तर से तत्काल अगले कदम की ओर ले जाने वाला कालवाचक संवाद-सूचक है।
- source_word: לֵךְ
  choice: जा
  rationale: הלך का सरल पुल्लिंग एकवचन आज्ञार्थक रूप; प्रत्यक्ष आदेश को बिना विस्तार के रखता है।
- source_word: וְאָנֹכִי אֶהְיֶה
  choice: मैं ... रहूँगा
  rationale: स्वतंत्र सर्वनाम אָנֹכִי में निहित बल को स्वाभाविक हिन्दी में स्पष्ट कर्ता ‘मैं’ से व्यक्त किया गया है।
- source_word: עִם־פִּיךָ
  choice: तेरे मुँह के साथ
  rationale: इब्रानी की ठोस और कुछ असामान्य अभिव्यक्ति को बनाए रखता है, जिससे मूसा के बोलने और परमेश्वर की साथ देने वाली उपस्थिति पर बल सुरक्षित रहता है।
- source_word: וְהוֹרֵיתִיךָ
  choice: और तुझे सिखाऊँगा
  rationale: ירה के हिफ़ील रूप का यहाँ अर्थ निर्देश देना या सिखाना है; ‘सिखाऊँगा’ सामान्य आधुनिक हिन्दी में स्पष्ट है।
- source_word: אֲשֶׁר תְּדַבֵּר
  choice: कि तुझे क्या बोलना है
  rationale: यह सम्बन्धवाचक उपवाक्य उस शिक्षा की विषयवस्तु बताता है। यह रूप भावी निर्देश/दायित्व को स्वाभाविक हिन्दी में व्यक्त करता है, बिना उसे केवल भविष्यवाणी बना देने के।
theological_decisions:
- issue: बुलाहट के प्रसंग में परमेश्वर की उपस्थिति का सूत्र
  choice: मैं तेरे मुँह के साथ रहूँगा
  alternative: मैं बोलने में तेरी सहायता करूँगा
  rationale: मूल पाठ परमेश्वर की सामर्थ्य देने वाली उपस्थिति को ठोस शारीरिक बिंब में व्यक्त करता है। व्याख्यात्मक सरलीकरण के बजाय उसी बिंब और उसके धर्मवैचारिक तनाव को सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिन्दी। परमेश्वर द्वारा मूसा को सीधे संबोधन के कारण एकवचन आत्मीय सर्वनाम ‘तू/तेरे/तुझे’ रखा गया है। ‘मुँह के साथ’ की असामान्यता जानबूझकर मूल बिंब बचाने के लिए रखी गई है और पादटिप्पणी में उसका आशय बताया गया है।
