base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/027.yaml
  text: And Yahweh said to Aaron[a], “Go into the wilderness to meet Moses.” So he went and met him at the mountain of God and kissed him.
translation:
  language: hi
  text: याहवे ने हारून से कहा, “मूसा से मिलने के लिए निर्जन प्रदेश की ओर जाओ[a]।” तब वह गया और परमेश्वर के पर्वत पर उससे मिला और उसे चूमा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “निर्जन प्रदेश में जाकर मूसा से मिलो।” इब्रानी वाक्यरचना निर्जन प्रदेश को गमन की दिशा अथवा भेंट के स्थान के रूप में समझने की गुंजाइश देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: לֵךְ
  choice: जाओ
  rationale: הלך के आज्ञार्थक रूप का यह संक्षिप्त, स्वाभाविक और सीधा हिन्दी अनुवाद है।
- source_word: לִקְרַאת מֹשֶׁה
  choice: मूसा से मिलने के लिए
  rationale: לִקְרַאת यहाँ किसी की ओर जाकर उससे मिलने का उद्देश्य व्यक्त करता है; यह हिन्दी वाक्यांश उस प्रयोजन को स्वाभाविक रूप से बताता है।
- source_word: הַמִּדְבָּרָה
  choice: निर्जन प्रदेश की ओर
  rationale: दिशासूचक הָ प्रत्यय के कारण गमन की दिशा को स्पष्ट रखा गया है। מִדְבָּר को केवल रेतीली मरुभूमि तक सीमित न करके निर्जन वन्य क्षेत्र के व्यापक अर्थ में प्रस्तुत किया गया है।
- source_word: וַיִּפְגְּשֵׁהוּ
  choice: उससे मिला
  rationale: פגשׁ का प्रसंगानुकूल अर्थ मिलना है; सर्वनाम मूसा की ओर संकेत करता है।
- source_word: בְּהַר הָאֱלֹהִים
  choice: परमेश्वर के पर्वत पर
  rationale: इब्रानी संबंधवाचक पदबंध को औपचारिक किंतु स्वाभाविक हिन्दी में रखा गया है; בְּ को यहाँ पर्वत पर हुई भेंट के रूप में अनूदित किया गया है।
- source_word: וַיִּשַּׁק לוֹ
  choice: उसे चूमा
  rationale: נשׁק का सीधा अर्थ चूमना है। अभिवादन का भाव संभव है, पर उसे मुख्य पाठ में व्याख्या के रूप में नहीं जोड़ा गया।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा प्रभु
  rationale: मूल पाठ में आए व्यक्तिगत नाम को उपाधि से प्रतिस्थापित नहीं किया गया; प्रचलित विद्वत्तापूर्ण उच्चारण के निकट देवनागरी लिप्यंतरण अपनाया गया है।
- issue: בְּהַר הָאֱלֹהִים में אֱלֹהִים
  choice: परमेश्वर
  alternative: ईश्वर
  rationale: संबंधवाचक पदबंध का सीधा अर्थ सुरक्षित रखा गया है और किसी विशेष धार्मिक व्याख्या को नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सरल और गरिमापूर्ण रखी गई है। कथा की गति बनाए रखने के लिए छोटे, सीधे क्रियापद प्रयुक्त हुए हैं। ‘निर्जन प्रदेश’ מִדְבָּר के व्यापक भू-दृश्य को ‘मरुभूमि’ की अपेक्षा अधिक ठीक ढंग से व्यक्त करता है।
