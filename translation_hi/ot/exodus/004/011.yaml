  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלָ֗י/ו מִ֣י שָׂ֣ם פֶּה֮ לָֽ/אָדָם֒ א֚וֹ מִֽי יָשׂ֣וּם אִלֵּ֔ם א֣וֹ חֵרֵ֔שׁ א֥וֹ פִקֵּ֖חַ א֣וֹ עִוֵּ֑ר הֲ/לֹ֥א אָנֹכִ֖י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/011.yaml
  text: And the LORD said to him, “Who has put a mouth on man? Or who makes one mute, or deaf, or sighted, or blind? Is it not I, the LORD?”
translation:
  language: hi
  text: और यहोवा ने उससे कहा, “मनुष्य को मुँह किसने दिया? या कौन किसी को मूक, बहरा, देख सकनेवाला या अंधा बनाता है? क्या मैं, यहोवा, नहीं हूँ?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂם פֶּה לָאָדָם
  choice: मनुष्य को मुँह किसने दिया
  rationale: शाब्दिक अर्थ ‘मनुष्य के लिए मुँह किसने रखा’ है; स्वाभाविक हिन्दी में ‘मुँह दिया’ वही आशय स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: אִלֵּם
  choice: गूँगा
  rationale: यह शब्द बोल न सकनेवाले व्यक्ति को सूचित करता है; हिन्दी में संक्षिप्त और प्रचलित समतुल्य चुना गया है।
- source_word: חֵרֵשׁ
  choice: बहरा
  rationale: मूल शब्द सुन न सकनेवाले व्यक्ति के लिए प्रयुक्त है।
- source_word: פִקֵּחַ
  choice: देखनेवाला
  rationale: इस विरोधात्मक क्रम में शब्द का अर्थ दृष्टिसंपन्न व्यक्ति है; ‘देखनेवाला’ ‘अंधा’ के साथ स्पष्ट समानांतर बनाता है।
- source_word: עִוֵּר
  choice: अंधा
  rationale: मूल शब्द का सीधा और प्रचलित हिन्दी समतुल्य।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम को हिन्दी बाइबलीय परंपरा में परिचित रूप ‘यहोवा’ से प्रस्तुत किया गया है, सामान्य उपाधि में नहीं बदला गया।
theological_decisions:
- issue: मानवीय वाणी, श्रवण और दृष्टि की अवस्थाओं पर परमेश्वर की प्रभुता
  choice: ‘कौन उसे ... बनाता है? क्या वह मैं, यहोवा, नहीं हूँ?’ के सीधे कथन को बनाए रखा गया
  alternative: भाषा को नरम करके केवल परमेश्वर की अनुमति या सहायता का संकेत देना
  rationale: हिब्रू पाठ स्वयं यहोवा को इन अवस्थाओं का कर्ता बताता है। इसके कठिन धार्मिक तनाव को अनुवाद में न तो समझाया गया है, न कम किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मौखिक रूप से सहज वाक्य-विन्यास। मूल के प्रश्नात्मक क्रम और ‘गूँगा या बहरा, देखनेवाला या अंधा’ की समानांतर संरचना सुरक्षित रखी गई है।
