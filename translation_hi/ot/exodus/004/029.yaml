  language: hi
  text: तब मूसा और हारून गए और उन्होंने इस्राएल के पुत्रों के सभी पुरनियों को इकट्ठा किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: गए
  rationale: कथात्मक क्रम में הלך का सामान्य अर्थ ‘जाना’ है। इब्रानी क्रिया एकवचन है, यद्यपि उसके बाद मूसा और हारून दो संयुक्त कर्ता हैं; हिन्दी में अर्थानुसार बहुवचन ‘गए’ स्वाभाविक है।
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: मूसा और हारून
  rationale: इन व्यक्तिगत नामों के मानक और प्रचलित हिन्दी रूप।
- source_word: וַיַּאַסְפוּ
  choice: उन्होंने ... इकट्ठा किया
  rationale: אסף यहाँ लोगों को एक स्थान पर एकत्र करने के अर्थ में है। ‘उन्होंने’ जोड़ने से हिन्दी वाक्य में दूसरे क्रियापद का कर्ता स्पष्ट और स्वाभाविक रहता है।
- source_word: כָּל זִקְנֵי
  choice: सभी पुरनियों
  rationale: כָּל संपूर्णता बताता है और זקנים समुदाय के आयु एवं पद से मान्य अगुवों को सूचित करता है। ‘पुरनिये’ हिन्दी बाइबलीय परंपरा में इस सामाजिक पद का परिचित शब्द है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: यह अनुवाद मूल के स्पष्ट वंशसूचक पदबंध को बनाए रखता है; यहाँ ‘इस्राएल’ याकूब और उससे निकले समुदाय दोनों की पैतृक पहचान को जगाता है।
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל का अनुवाद
  choice: इस्राएल के पुत्रों
  alternative: इस्राएली; इस्राएल की संतान
  rationale: मूल पाठ के पुल्लिंग बहुवचन वंशसूचक रूप और पैतृक/वाचागत पहचान को सुरक्षित रखा गया है, बिना उसे केवल जातिवाचक नाम में बदलने के। विकल्प पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी की सरल कथात्मक शैली रखी गई है। ‘पुरनियों’ पद समुदाय के मान्य अगुवों के लिए प्रतिष्ठित हिन्दी बाइबलीय शब्दावली को बनाए रखता है; बाकी वाक्य-विन्यास वर्तमान और सहज है।
