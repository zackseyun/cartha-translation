id: EXO.4.30
reference: Exodus 4:30
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר אַהֲרֹ֔ן אֵ֚ת כָּל הַ/דְּבָרִ֔ים אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֑ה וַ/יַּ֥עַשׂ הָ/אֹתֹ֖ת לְ/עֵינֵ֥י הָ/עָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/030.yaml
  text: Aaron spoke all the words that Yahweh had spoken to Moses[a], and he performed the signs before the eyes of the people.
translation:
  language: hi
  text: हारून ने वे सारी बातें कहीं जो याहवे ने मूसा से कही थीं, और उसने लोगों की आँखों के सामने[a] वे चिन्ह करके दिखाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “लोगों के देखते हुए।”
    reason: לְעֵינֵי הָעָם का शाब्दिक चित्र ‘लोगों की आँखों के सामने’ है; वैकल्पिक हिंदी उसका स्वाभाविक आशय देती है।
lexical_decisions:
- source_word: וַיְדַבֵּר אַהֲרֹן
  choice: हारून ने…कहीं
  rationale: पिअल क्रिया דִּבֵּר का सामान्य अर्थ ‘बोलना/कहना’ है। हिंदी में ‘बातें कहीं’ स्वाभाविक है और ‘सारी बातें’ के साथ सहज बैठता है।
- source_word: אֵת כָּל הַדְּבָרִים
  choice: वे सारी बातें
  rationale: यह अनुवाद इब्रानी के ‘सभी वचन/बातें’ को स्पष्ट रखता है; केवल ‘सब कुछ’ कहने से मूल की ठोस संज्ञा दब जाती।
- source_word: אֲשֶׁר דִּבֶּר יְהוָה אֶל מֹשֶׁה
  choice: जो याहवे ने मूसा से कही थीं
  rationale: संबंधवाचक उपवाक्य और कथा में पहले हो चुकी क्रिया को स्वाभाविक हिंदी में सुरक्षित रखा गया है। אֶל को यहाँ हिंदी मुहावरे के अनुसार ‘से’ कहा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले व्यक्तिगत परमेश्वरीय नाम का हिंदी लिप्यंतरण किया गया है; उसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: וַיַּעַשׂ הָאֹתֹת
  choice: उसने…वे चिन्ह करके दिखाए
  rationale: עשה का मूल अर्थ ‘करना’ है। चिन्हों के संदर्भ में ‘करके दिखाए’ स्वाभाविक हिंदी है और ‘चमत्कार’ जोड़कर अर्थ को अनावश्यक रूप से विस्तृत नहीं करता। एकवचन क्रिया का कर्ता निकटतम कर्ता हारून समझा गया है और ‘उसने’ से स्पष्ट किया गया है।
- source_word: לְעֵינֵי הָעָם
  choice: लोगों की आँखों के सामने
  rationale: इब्रानी मुहावरे की दृश्यात्मकता को बनाए रखते हुए ऐसी हिंदी चुनी गई है जो आज भी समझने योग्य और स्वाभाविक है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत नाम יְהוָה है। ‘याहवे’ उसका व्यापक रूप से स्वीकृत विद्वत्तापूर्ण लिप्यंतरण है और मूल में उपस्थित नाम को उपाधि में नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘बातें’, ‘चिन्ह’ और ‘आँखों के सामने’ मूल की ठोस अभिव्यक्तियों को बनाए रखते हैं।
