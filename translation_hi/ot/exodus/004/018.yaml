base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/018.yaml
  text: Then Moses went and returned to Jethro his father-in-law and said to him[a], “Please let me go and return to my brothers who are in Egypt, so that I may see whether they are still alive.” And Jethro said to Moses[b], “Go in peace.”
translation:
  language: hi
  text: तब मूसा गया और अपने ससुर येतेर[a] के पास लौट आया और उससे कहा, “कृपया मुझे जाने दीजिए, ताकि मैं मिस्र में रहने वाले अपने भाइयों[b] के पास लौटकर देख सकूँ कि वे अभी भी जीवित हैं या नहीं।” यित्रो ने मूसा से कहा, “शान्ति से जाओ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ में यहाँ नाम ‘येतेर’ है, जबकि इसी पद के अन्त में ‘यित्रो’ है; दोनों नाम एक ही व्यक्ति के लिए प्रयुक्त हुए हैं।
    reason: textual_variant
  - marker: b
    text: ‘भाइयों’ का अर्थ यहाँ व्यापक रूप से ‘कुटुम्बियों’ या ‘अपने लोगों’ से भी हो सकता है; इब्रानी में शाब्दिक रूप से ‘मेरे भाई’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ ... וַיָּשָׁב
  choice: तब मूसा ... लौट गया
  rationale: दोनों क्रमिक क्रियाएँ कथा को आगे बढ़ाती हैं। हिन्दी में ‘तब’ और ‘लौट गया’ स्वाभाविक रूप से घटनाक्रम तथा שׁוּב के मूल अर्थ को व्यक्त करते हैं।
- source_word: יֶתֶר / יִתְרוֹ
  choice: येतेर / यित्रो
  rationale: मसोराई पाठ में इसी पद के पहले उल्लेख में יֶתֶר और दूसरे में יִתְרוֹ है। मुख्य पाठ में दोनों रूप रखकर स्रोत-पाठ का वास्तविक भेद सुरक्षित रखा गया है।
- source_word: חֹתְנוֹ
  choice: अपने ससुर
  rationale: सन्दर्भ में यह मूसा की पत्नी के पिता को सूचित करता है; ‘ससुर’ आधुनिक हिन्दी में सटीक और स्वाभाविक है।
- source_word: אֵלֲכָה נָּא
  choice: कृपया मुझे जाने दें
  rationale: सहोर्टेटिव रूप के साथ נָא विनम्र निवेदन व्यक्त करता है; यह हिन्दी प्रयोग उस आदरपूर्ण अनुरोध को स्पष्ट रखता है।
- source_word: וְאָשׁוּבָה
  choice: ताकि मैं ... के पास लौटकर
  rationale: यह मूसा के निवेदन की अगली सहोर्टेटिव क्रिया है। हिन्दी वाक्य-संरचना में ‘लौटकर’ गन्तव्य और आगे के उद्देश्य से इसे स्वाभाविक रूप से जोड़ता है।
- source_word: אַחַי
  choice: अपने भाइयों
  rationale: इब्रानी का शाब्दिक अर्थ ‘मेरे भाई’ है, यद्यपि सन्दर्भ में इसका व्यापक अर्थ सजातीय या कुटुम्बी भी हो सकता है; इस सम्भावना को पादटिप्पणी में रखा गया है।
- source_word: וְאֶרְאֶה
  choice: देखूँ
  rationale: पूर्ववर्ती गति-क्रियाओं के साथ यह मूसा के लौटने का उद्देश्य बताता है; ‘ताकि ... देखूँ’ उस प्रयोजन को सहज हिन्दी में व्यक्त करता है।
- source_word: הַעוֹדָם חַיִּים
  choice: कि वे अब तक जीवित हैं या नहीं
  rationale: यह वाक्यांश उनकी वर्तमान दशा के विषय में अनिश्चितता व्यक्त करता है। ‘अब तक’ עוֹד का और ‘या नहीं’ प्रश्नवाचक ה का स्वाभाविक हिन्दी रूप है।
- source_word: לֵךְ לְשָׁלוֹם
  choice: शान्ति से जाओ
  rationale: यह विदाई और मंगलकामना का इब्रानी मुहावरा है। ‘शान्ति से जाओ’ अर्थ और गरिमा दोनों सुरक्षित रखता है।
