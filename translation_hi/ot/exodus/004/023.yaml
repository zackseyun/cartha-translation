  edition: WLC
  text: וָ/אֹמַ֣ר אֵלֶ֗י/ךָ שַׁלַּ֤ח אֶת בְּנִ/י֙ וְ/יַֽעַבְדֵ֔/נִי וַ/תְּמָאֵ֖ן לְ/שַׁלְּח֑/וֹ הִנֵּה֙ אָנֹכִ֣י הֹרֵ֔ג אֶת בִּנְ/ךָ֖ בְּכֹרֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/023.yaml
  text: And I said to you, ‘Send out my son so that he may serve me,’ but you refused to send him out. Look, I am about to kill your son, your firstborn.
translation:
  language: hi
  text: और मैंने तुझसे कहा, ‘मेरे पुत्र को जाने दे, ताकि वह मेरी सेवा करे।’ पर तूने उसे जाने देने से इनकार कर दिया। देख, मैं तेरे पुत्र, तेरे पहलौठे को मार डालूँगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁלַּח
  choice: जाने दे
  rationale: इस संदर्भ में आदेश का स्वाभाविक हिंदी रूप; इसका अर्थ फ़िरौन के अधिकार से इस्राएल को मुक्त करके जाने देना है।
- source_word: וְיַעַבְדֵנִי
  choice: ताकि वह मेरी सेवा करे
  rationale: עבד का धार्मिक-संदर्भित अर्थ ‘सेवा करना’ रखा गया है; ‘आराधना करना’ संभव है, पर वह यहाँ अर्थ को अनावश्यक रूप से सीमित कर सकता है।
- source_word: הִנֵּה
  choice: देख
  rationale: आगामी दैवी घोषणा पर ध्यान खींचने वाली हिब्रू सूचक अभिव्यक्ति का सीधा और स्वाभाविक रूप।
- source_word: הֹרֵג
  choice: मार डालूँगा
  rationale: हिब्रू कृदन्त निकट और निश्चित भावी कार्रवाई व्यक्त करता है; हिंदी में यह रूप धमकी की निश्चितता और स्वाभाविकता दोनों बनाए रखता है।
- source_word: בְּכֹרֶךָ
  choice: तेरे पहलौठे
  rationale: वंश में प्रथम जन्मे पुत्र के लिए पारंपरिक, सटीक और बाइबिलीय हिंदी शब्द।
theological_decisions:
- issue: ‘मेरे पुत्र’ का संकेत
  choice: एकवचन ‘मेरे पुत्र’ को ज्यों का त्यों रखा गया
  alternative: ‘मेरी प्रजा’ या ‘मेरे पुत्र इस्राएल’
  rationale: मूल पाठ जानबूझकर एकवचन पुत्र-भाषा प्रयोग करता है, जो पिछले पद में इस्राएल के लिए दी गई पहचान पर निर्भर है; इसे स्पष्ट करके तनाव हटाना उचित नहीं।
- issue: ईश्वर द्वारा पहलौठे को मारने की घोषणा
  choice: प्रत्यक्ष प्रथम पुरुष ‘मैं ... मार डालूँगा’
  alternative: ‘तेरा पुत्र मारा जाएगा’
  rationale: मूल में कर्ता स्पष्टतः परमेश्वर स्वयं हैं; कर्मवाच्य करने से कथन की धर्मवैचारिक तीक्ष्णता कम हो जाती।
translation_notes:
  register: आधुनिक मानक हिंदी में गंभीर, सीधी और मौखिक घोषणा के अनुकूल शैली। फ़िरौन को संबोधन में एकवचन ‘तू/तेरे’ मूल के एकवचन संबोधन और राजकीय टकराव की तीक्ष्णता को सुरक्षित रखता है।
