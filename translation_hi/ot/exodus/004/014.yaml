base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/014.yaml
  text: Then Yahweh’s anger burned against Moses[a], and he said, “Is there not Aaron your brother, the Levite? I know that he can speak well. And also, look, he is coming out to meet you; when he sees you, he will rejoice in his heart.”
translation:
  language: hi
  text: तब मूसा पर याहवे का क्रोध भड़क उठा, और उन्होंने कहा, “तेरा भाई हारून, जो लेवी है, है न? मैं जानता हूँ कि वह अच्छी तरह बोल सकता है[a]। और देख, वह तुझसे मिलने निकल पड़ा है। जब वह तुझे देखेगा, तो मन ही मन प्रसन्न होगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं जानता हूँ कि वह धाराप्रवाह बोलता है”; अधिक शाब्दिक रूप में, “मैं जानता हूँ कि वह निश्चय ही बोलेगा।”
    reason: हिब्रू में क्रिया की बलाघाती पुनरुक्ति है, जिसे बोलने की योग्यता, प्रवाह अथवा निश्चितता के रूप में समझा जा सकता है।
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: क्रोध भड़क उठा
  rationale: यह हिब्रू मुहावरे में निहित ‘जलने/भड़कने’ के रूपक को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय प्रचलित हिन्दी लिप्यंतरण में प्रस्तुत किया गया है।
- source_word: הֲלֹא אַהֲרֹן אָחִיךָ הַלֵּוִי
  choice: तेरा भाई, लेवी हारून, है न?
  rationale: הֲלֹא की सकारात्मक उत्तर की अपेक्षा करने वाली प्रश्नवाचक शक्ति को स्वाभाविक हिन्दी ‘है न?’ से व्यक्त किया गया है; ‘लेवी’ यहाँ वंशीय पहचान है।
- source_word: יָדַעְתִּי כִּי דַבֵּר יְדַבֵּר הוּא
  choice: मैं जानता हूँ कि वह अच्छी तरह बोल सकता है
  rationale: क्रिया की हिब्रू पुनरुक्ति बोलने की प्रबल क्षमता पर बल देती है। प्रसंग में यह मूसा की आपत्ति के उत्तर में हारून की बोलने की योग्यता दर्शाती है; शाब्दिक और अन्य सम्भव अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: וְגַם הִנֵּה
  choice: और देख
  rationale: योगात्मक बल और ध्यान आकर्षित करने वाले הִנֵּה दोनों को आधुनिक, सहज हिन्दी में रखा गया है।
- source_word: יֹצֵא לִקְרָאתֶךָ
  choice: वह तुझसे मिलने निकल पड़ा है
  rationale: हिब्रू कृदन्त की जारी अथवा आसन्न गतिविधि और ‘मिलने के लिए निकलने’ का भाव स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: וְרָאֲךָ וְשָׂמַח בְּלִבּוֹ
  choice: जब वह तुझे देखेगा, तो अपने मन में आनन्दित होगा
  rationale: क्रमागत कथनों का समय-परिणाम सम्बन्ध स्पष्ट किया गया है और בְּלִבּוֹ की आन्तरिक, हार्दिक प्रसन्नता को बनाए रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है; ‘याहवे’ उसे किसी उपाधि से प्रतिस्थापित किए बिना दर्शाता है।
- issue: हारून की बोलने की क्षमता में हिब्रू बलाघात
  choice: अच्छी तरह बोल सकता है
  alternative: वह निश्चय ही बोलेगा / वह धाराप्रवाह बोलता है
  rationale: प्रसंग बोलने की योग्यता की ओर संकेत करता है, पर हिब्रू रचना केवल गुणवत्ता तक सीमित नहीं है; इसलिए वैकल्पिक सम्भावनाएँ पादटिप्पणी में दी गई हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। प्रत्यक्ष सम्बोधन में एकवचन ‘तेरा/तुझे’ मूल के एकवचन रूपों को दर्शाता है। परमेश्वर के लिए आदरसूचक ‘उन्होंने’ प्रयुक्त हुआ है।
