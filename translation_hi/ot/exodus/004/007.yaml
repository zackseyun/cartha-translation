  yaml_path: translation/ot/exodus/004/007.yaml
  text: And he said[a], “Put your hand back into your bosom.” So he put his hand back into his bosom, and when he brought it out from his bosom, behold[b], it had returned like his flesh.
translation:
  language: hi
  text: तब उसने कहा, “अपना हाथ फिर अपनी छाती के पास वस्त्र की तह में रखो[a]।” उसने अपना हाथ फिर अपनी छाती के पास वस्त्र की तह में रखा। जब उसने उसे वहाँ से बाहर निकाला, और देखो,[b] वह फिर उसके शरीर जैसा हो गया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “अपनी छाती में”; आशय छाती के पास वस्त्र की तह से हो सकता है।
    reason: cultural_note
  - marker: b
    text: अर्थात उसका हाथ फिर सामान्य हो गया था।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָשֵׁב
  choice: दोबारा ... रखो
  rationale: हिफ़ील आज्ञार्थक यहाँ हाथ को पहले वाले स्थान पर वापस रखने का निर्देश देता है। आधुनिक हिन्दी में “दोबारा ... रखो” स्वाभाविक है और पुनरावृत्ति का भाव स्पष्ट करता है।
- source_word: חֵיק
  choice: छाती के पास वस्त्र की तह
  rationale: यह शब्द छाती या छाती के पास वस्त्र की उस तह को सूचित कर सकता है जिसमें हाथ या कोई वस्तु रखी जाए। केवल “गोद” कहने से इस क्रिया का स्थान अस्पष्ट हो सकता है, इसलिए सांस्कृतिक अर्थ को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: וַיָּשֶׁב
  choice: उसने ... दोबारा ... रखा
  rationale: यह उसी क्रिया का कथात्मक रूप है जो पिछली आज्ञा में आई है; समान शब्दावली आज्ञा और उसके पालन के संबंध को बनाए रखती है।
- source_word: וַיּוֹצִאָהּ
  choice: उसने उसे ... बाहर निकाला
  rationale: יצא का हिफ़ील रूप किसी वस्तु को बाहर लाने या निकालने का अर्थ देता है। “बाहर निकाला” इस प्रसंग में सहज और सटीक है।
- source_word: וְהִנֵּה
  choice: तो देखो
  rationale: यह ध्यान को आश्चर्यजनक परिणाम की ओर खींचता है। “तो देखो” कथात्मक प्रवाह और विस्मय दोनों को बनाए रखता है।
- source_word: שָׁבָה
  choice: वह फिर ... हो गया था
  rationale: स्त्रीलिंग एकवचन क्रिया “हाथ” की ओर संकेत करती है और उसके पूर्व दशा में लौट आने का भाव देती है। हिन्दी में परिणामसूचक वाक्य स्वाभाविक रखने के लिए यह रूप चुना गया है।
- source_word: כִּבְשָׂרוֹ
  choice: उसके शरीर के बाकी हिस्से जैसा
  rationale: शाब्दिक अर्थ “उसके मांस जैसा” है, पर आधुनिक हिन्दी में वह अस्वाभाविक और संभावित रूप से भ्रामक है। प्रसंगगत तुलना उसके सामान्य शरीर से है; “बाकी हिस्से” इसे बिना अनावश्यक चिकित्सकीय व्याख्या के स्पष्ट करता है।
