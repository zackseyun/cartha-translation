source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה שְׁלַח֙ יָֽדְ/ךָ֔ וֶ/אֱחֹ֖ז בִּ/זְנָב֑/וֹ וַ/יִּשְׁלַ֤ח יָד/וֹ֙ וַ/יַּ֣חֲזֶק בּ֔/וֹ וַ/יְהִ֥י לְ/מַטֶּ֖ה בְּ/כַפּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/004.yaml
  text: Then Yahweh said to Moses[a], “Reach out your hand and take hold of its tail.” So he reached out his hand and took hold of it[b], and it became a staff in his hand.
translation:
  language: hi
  text: तब याहवे ने मूसा से कहा, “अपना हाथ बढ़ा और उसकी पूँछ[a] पकड़ ले।” तब उसने अपना हाथ बढ़ाकर उसे पकड़ लिया, और वह उसकी हथेली में लाठी[b] बन गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसे पूँछ से पकड़ ले।”
    reason: इब्रानी पूर्वसर्ग के कारण यह वैकल्पिक अभिव्यक्ति भी संभव है।
  - marker: b
    text: या “डंडा।”
    reason: इब्रानी מַטֶּה का अर्थ ‘लाठी’ या ‘डंडा’ हो सकता है।
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम के रूप में आए चतुरक्षरीय नाम का लिप्यंतरण किया गया है; इसे किसी उपाधि से नहीं बदला गया।
- source_word: שְׁלַח יָדְךָ
  choice: अपना हाथ बढ़ा
  rationale: हाथ को आगे बढ़ाने की आज्ञा को स्वाभाविक और स्पष्ट आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וֶאֱחֹז בִּזְנָבוֹ
  choice: उसकी पूँछ पकड़ ले
  rationale: आहाज़ क्रिया पकड़ने का ठोस कार्य बताती है; प्रत्यय पिछले पद के साँप की ओर संकेत करता है।
- source_word: וַיַּחֲזֶק בּוֹ
  choice: उसे पकड़ लिया
  rationale: हाज़क का यह रूप यहाँ किसी वस्तु को दृढ़ता से थामने का अर्थ देता है; सरल हिन्दी में क्रिया-क्रम भी बना रहता है।
- source_word: וַיְהִי לְמַטֶּה
  choice: लाठी बन गया
  rationale: हायाह यहाँ अवस्था-परिवर्तन व्यक्त करता है, और मत्तेह के लिए ‘लाठी’ सहज तथा प्रसंगानुकूल है।
- source_word: בְּכַפּוֹ
  choice: उसकी हथेली में
  rationale: कफ़ का अधिक विशिष्ट अर्थ ‘हथेली’ है; इससे पहले आए सामान्य ‘हाथ’ से मूल का शब्दभेद भी सुरक्षित रहता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम सीधे प्रयुक्त है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और नाम को उपाधि में नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। आज्ञा में ‘तू’ के अनुरूप हिन्दी का आत्मीय एकवचन रूप प्रयुक्त हुआ है। अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्न अर्थ से असंगत स्थानों पर थे; हिन्दी में उन्हें संबंधित शब्दों ‘पूँछ’ और ‘लाठी’ पर रखा गया है।
