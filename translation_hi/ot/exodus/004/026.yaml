base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/026.yaml
  text: So he let him alone[a]. Then she said[b], “A bridegroom of blood,” because of the circumcision.
translation:
  language: hi
  text: तब उसने उसे छोड़ दिया।[a] तब वह बोली, “खून का दूल्हा”[b]—खतने के कारण।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: प्रसंग के अनुसार छोड़ देने वाला यहोवा और छोड़ा गया व्यक्ति मूसा है; पर इस पद के इब्रानी पाठ में दोनों के लिए केवल सर्वनाम हैं।
    reason: referent_ambiguity
  - marker: b
    text: इब्रानी में शाब्दिक रूप से ‘खून का दूल्हा’ है। यह कठिन मुहावरा संभवतः खतने से जुड़ी पुकार या उपाधि है, पर इसका ठीक अर्थ अनिश्चित है।
    reason: lexical_alternative
  - marker: c
    text: 'इब्रानी शब्द बहुवचन में है: ‘खतनों के कारण’ या ‘खतने की रस्मों के कारण।’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרֶף
  choice: तब उसने उसे छोड़ दिया
  rationale: רפה का यह प्रयोग विरोधी कार्रवाई रोक देने या किसी को छोड़ देने का भाव देता है। सहज आधुनिक हिन्दी में ‘छोड़ दिया’ इस समाप्ति को व्यक्त करता है, जबकि कर्ता और कर्म को सर्वनामों में ही रहने देता है।
- source_word: מִמֶּנּוּ
  choice: उसे
  rationale: מן सहित प्रत्यय का शाब्दिक भाव ‘उससे’ है, पर हिन्दी मुहावरे ‘उसे छोड़ दिया’ में वही अर्थ स्वाभाविक रूप से समाहित है।
- source_word: אָז
  choice: तब
  rationale: यह घटनाक्रम में अगले क्षण या परिणाम को सूचित करने वाला सामान्य कालवाचक क्रियाविशेषण है।
- source_word: אָמְרָה
  choice: उसने कहा
  rationale: אמר का साधारण कथात्मक अर्थ रखा गया है। निकटवर्ती प्रसंग से बोलने वाली सिप्पोरा है; मूल पद में उसका नाम दोहराया नहीं गया, इसलिए अनुवाद में भी सर्वनाम रखा गया है।
- source_word: חֲתַן דָּמִים
  choice: खून का दूल्हा
  rationale: यह संक्षिप्त और कठिन इब्रानी पदबंध है। ‘खून का दूल्हा’ उसके शब्दरूप और अस्पष्टता को बनाए रखता है तथा किसी विशेष भावात्मक या अनुष्ठानिक व्याख्या को पाठ में नहीं जोड़ता।
- source_word: לַמּוּלֹת
  choice: खतने के कारण
  rationale: מול से बना यह दुर्लभ बहुवचन रूप है। प्रसंग में अभी किए गए खतने की ओर संकेत होने के कारण मुख्य पाठ में स्वाभाविक हिन्दी एकवचन रखा गया है; बहुवचन रूप को पादटिप्पणी में बताया गया है।
theological_decisions:
- issue: ‘उसने उसे छोड़ दिया’ में सर्वनामों के संदर्भ
  choice: मुख्य पाठ में सर्वनामों की मूल अस्पष्टता रखी गई; प्रसंग के अनुसार कर्ता यहोवा और कर्म मूसा सबसे स्वाभाविक समझे जाते हैं।
  alternative: नाम जोड़कर ‘यहोवा ने मूसा को छोड़ दिया’ कहना।
  rationale: पद 24 यहोवा को आक्रमण करने वाला बताता है और पद 26 उसी कार्रवाई के रुकने का वर्णन करता है, पर इस पद के इब्रानी पाठ में दोनों नाम स्पष्ट रूप से नहीं हैं। इसलिए नामों को मुख्य पाठ में जोड़ने के बजाय संदर्भगत समझ पादटिप्पणी में दी गई है।
- issue: ‘खून का दूल्हा’ का अर्थ
  choice: दुर्बोध मूल मुहावरे को अक्षरार्थ के निकट रखा गया है।
  alternative: इसे घृणा की पुकार, खतने से जुड़ी अनुष्ठानिक उपाधि, या मूसा अथवा बालक को संबोधित निश्चित कथन के रूप में स्पष्ट करना।
  rationale: इस अभिव्यक्ति का ठीक सांस्कृतिक और भावात्मक बल अनिश्चित है। किसी एक व्याख्या को चुनने से मूल पाठ का वास्तविक तनाव मिट जाएगा।
- issue: לַמּוּלֹת का व्याकरणिक बहुवचन
  choice: मुख्य पाठ में प्रसंगानुकूल ‘खतने के कारण’, और बहुवचन की सूचना पादटिप्पणी में।
  alternative: मुख्य पाठ में ‘खतनों के कारण’ या ‘खतने की रस्मों के कारण’।
  rationale: शाब्दिक बहुवचन हिन्दी में कई खतनों का भ्रामक संकेत दे सकता है, जबकि ‘रस्मों’ कहना मूल में अतिरिक्त व्याख्या जोड़ता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘खून’ सामान्य आधुनिक हिन्दी में स्पष्ट है; ‘दूल्हा’ मूल חֲתַן का सीधा और स्वाभाविक समकक्ष है। कठिन मुहावरे को व्याख्यात्मक रूप से सरल नहीं किया गया।
