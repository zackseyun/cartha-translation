source:
  edition: WLC
  text: וַֽ/יַּאֲמֵ֖ן הָ/עָ֑ם וַֽ/יִּשְׁמְע֡וּ כִּֽי פָקַ֨ד יְהוָ֜ה אֶת בְּנֵ֣י יִשְׂרָאֵ֗ל וְ/כִ֤י רָאָה֙ אֶת עָנְיָ֔/ם וַֽ/יִּקְּד֖וּ וַ/יִּֽשְׁתַּחֲוּֽוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/031.yaml
  text: And the people believed[a]; and when they heard that Yahweh had visited the sons of Israel and that he had seen their affliction[c][b], they bowed down and worshiped.
translation:
  language: hi
  text: तब लोगों ने विश्वास किया। जब उन्होंने सुना कि यहोवा ने इस्राएलियों की सुधि ली थी[a] और उनका दुःख देखा था[b], तो उन्होंने सिर झुकाया और दण्डवत किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस्राएल के पुत्रों की खोज-खबर ली थी” अथवा “उनकी ओर ध्यान दिया था।”
    reason: פקד के अर्थ-क्षेत्र और בְּנֵי יִשְׂרָאֵל के शाब्दिक रूप को स्पष्ट करना।
  - marker: b
    text: या, “उनका कष्ट” अथवा “उनकी दुर्दशा।”
    reason: עֳנִי के संभावित अर्थों को दिखाना।
lexical_decisions:
- source_word: וַיַּאֲמֵן
  choice: विश्वास किया
  rationale: हिफ़ील रूप यहाँ मूसा और हारून द्वारा दिए गए संदेश और चिन्हों को सच मानने का भाव व्यक्त करता है। मूल में कर्म स्पष्ट नहीं है, इसलिए हिंदी में भी उसे जोड़ा नहीं गया।
- source_word: הָעָם
  choice: लोगों
  rationale: इब्रानी का सामूहिक पद हिंदी में स्वाभाविक रूप से ‘लोगों’ द्वारा व्यक्त होता है।
- source_word: וַיִּשְׁמְעוּ כִּי
  choice: जब उन्होंने सुना कि
  rationale: यह रचना सुनी गई बात की विषयवस्तु बताती है और आगे की प्रतिक्रिया से समयगत तथा कारणगत संबंध रखती है।
- source_word: פָקַד יְהוָה
  choice: यहोवा ने ... सुधि ली है
  rationale: פקד का अर्थ ध्यान देना, सुधि लेना अथवा हस्तक्षेप करने के लिए आना हो सकता है। ‘सुधि ली’ आधुनिक, गरिमापूर्ण हिंदी में परमेश्वर के सक्रिय ध्यान का भाव रखता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: शाब्दिक रूप ‘इस्राएल के पुत्र’ है, पर इस संदर्भ में यह पूरे इस्राएली समुदाय का प्रचलित जातीय-सामुदायिक पद है; ‘इस्राएलियों’ से उसका आशय स्वाभाविक हिंदी में स्पष्ट होता है।
- source_word: רָאָה אֶת עָנְיָם
  choice: उनका दुःख देखा है
  rationale: עֳנִי विपत्ति, कष्ट या दीन दशा को सूचित करता है। ‘दुःख’ सामान्य पाठक के लिए सहज है, जबकि ‘देखा’ मूल की ठोस अभिव्यक्ति बनाए रखता है।
- source_word: וַיִּקְּדוּ
  choice: झुककर
  rationale: קדד शरीर झुकाने की क्रिया बताता है; इसे अगले उपासना-सूचक क्रियापद से जोड़कर स्वाभाविक हिंदी वाक्य बनाया गया है।
- source_word: וַיִּשְׁתַּחֲווּ
  choice: दण्डवत किया
  rationale: यह क्रिया भूमि की ओर झुकने अथवा औंधे होकर श्रद्धा व्यक्त करने को दर्शाती है। ‘दण्डवत किया’ शारीरिक मुद्रा और आराधनापूर्ण सम्मान दोनों को संक्षेप में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में चार-अक्षरीय वाचा-नाम सीधे प्रयुक्त है। हिंदी बाइबल परंपरा में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ को रखा गया है, न कि इसे उपाधि ‘प्रभु’ से बदला गया।
- issue: בְּנֵי יִשְׂרָאֵל की पारिवारिक अभिव्यक्ति
  choice: इस्राएलियों
  alternative: इस्राएल के पुत्रों
  rationale: यह बहुवचन पद यहाँ केवल पुरुषों तक सीमित न होकर पूरे समुदाय को दर्शाता है। ‘इस्राएलियों’ अर्थ को स्पष्ट और प्राकृतिक रखता है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- issue: פקד में निहित ईश्वरीय ध्यान और हस्तक्षेप
  choice: सुधि ली है
  alternative: भेंट की है
  rationale: संदर्भ में क्रिया केवल देखने नहीं, बल्कि सहायता हेतु ध्यान देने का संकेत करती है। ‘सुधि ली’ इस व्यापकता को रखती है, फिर भी आगामी छुटकारे को अनावश्यक रूप से पूर्ण हुआ नहीं बताती।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘विश्वास किया’ में मूल की अनिर्दिष्ट कर्म-संरचना सुरक्षित है। ‘सुधि ली’ अत्यधिक शाब्दिक ‘भेंट की’ की अपेक्षा अधिक स्पष्ट है, जबकि पादटिप्पणी मूल क्रिया की व्यापकता बताती है।
