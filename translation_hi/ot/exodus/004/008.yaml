  text: וְ/הָיָה֙ אִם לֹ֣א יַאֲמִ֣ינוּ לָ֔/ךְ וְ/לֹ֣א יִשְׁמְע֔וּ לְ/קֹ֖ל הָ/אֹ֣ת הָ/רִאשׁ֑וֹן וְ/הֶֽאֱמִ֔ינוּ לְ/קֹ֖ל הָ/אֹ֥ת הָ/אַחֲרֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/008.yaml
  text: And it will be[a], if they do not believe you and do not listen to the voice of the first sign, then they will believe the voice of the latter sign.
translation:
  language: hi
  text: और यदि वे तुम पर विश्वास न करें और पहले चिन्ह की वाणी पर ध्यान न दें, तो वे बाद वाले चिन्ह की वाणी पर विश्वास करेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: और यदि
  rationale: हिब्रू की भविष्यसूचक शर्तीय संरचना को स्वाभाविक हिन्दी में व्यक्त करता है; अलग से ‘और ऐसा होगा’ कहना हिन्दी में अनावश्यक रूप से भारी होता।
- source_word: יַאֲמִינוּ לָךְ
  choice: वे तुम पर विश्वास न करें
  rationale: हिफ़ील אמן के साथ ל किसी व्यक्ति को विश्वसनीय मानने या उस पर विश्वास करने का भाव देता है; ‘तुम पर विश्वास’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: יִשְׁמְעוּ לְקוֹל
  choice: वाणी पर ध्यान न दें
  rationale: शाब्दिक ‘वाणी सुनना’ यहाँ ग्रहण करने या मानने का मुहावरा है। ‘ध्यान देना’ इस ग्रहणशीलता को व्यक्त करता है, जबकि चिन्ह की ‘वाणी’ वाली हिब्रू छवि भी बची रहती है।
- source_word: הָאֹת
  choice: चिन्ह
  rationale: אוֹת का सामान्य अर्थ ‘चिन्ह’ है; ‘चमत्कारी’ जोड़ना मूल में निहित बात को अनावश्यक रूप से स्पष्ट करता।
- source_word: הָרִאשׁוֹן
  choice: पहले
  rationale: רִאשׁוֹן का सीधा अर्थ ‘पहला’ है और यह अगले विरोधी पद के साथ स्वाभाविक जोड़ी बनाता है।
- source_word: וְהֶאֱמִינוּ
  choice: तो वे ... विश्वास करेंगे
  rationale: संयोजक वाव यहाँ शर्त के परिणाम का परिचय देता है; हिन्दी में ‘तो’ परिणाम-संबंध को स्पष्ट और स्वाभाविक बनाता है।
- source_word: הָאַחֲרוֹן
  choice: बाद वाले
  rationale: אַחֲרוֹן का अर्थ ‘बाद वाला’ या ‘अन्तिम’ हो सकता है। अगले पद में एक और चिन्ह की संभावना होने के कारण ‘बाद वाला’ अनावश्यक अंतिमता से बचता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘चिन्ह की वाणी’ की व्यक्तिकारी हिब्रू छवि को सुरक्षित रखा गया है, पर ‘सुनें’ के स्थान पर ‘ध्यान दें’ से मुहावरे का आशय स्पष्ट किया गया है।
