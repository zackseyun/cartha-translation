source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ יְהוָ֨ה ל֜/וֹ ע֗וֹד הָֽבֵא נָ֤א יָֽדְ/ךָ֙ בְּ/חֵיקֶ֔/ךָ וַ/יָּבֵ֥א יָד֖/וֹ בְּ/חֵיק֑/וֹ וַ/יּ֣וֹצִאָ֔/הּ וְ/הִנֵּ֥ה יָד֖/וֹ מְצֹרַ֥עַת כַּ/שָּֽׁלֶג־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/006.yaml
  text: Then Yahweh said to him again[a], “Please put your hand into your bosom.” So he put his hand into his bosom, and when he brought it out, behold, his hand was leprous, like snow.
translation:
  language: hi
  text: फिर याहवे ने उससे कहा, “कृपया अपना हाथ अपने वस्त्र की तह में डालो।” उसने अपना हाथ अपने वस्त्र की तह में डाला; और जब उसने उसे बाहर निकाला, तो देखो, उसका हाथ चर्मरोगग्रस्त[a], बर्फ के समान सफेद था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में इस दशा के लिए צָרַעַת (त्साराअत) से बना शब्द है। पुराने नियम में यह विभिन्न प्रकार की त्वचा-संबंधी दशाओं को सूचित कर सकता है और आवश्यक नहीं कि आधुनिक कोढ़ (हैन्सन रोग) के ठीक समान हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के विशिष्ट वाचा-नाम को सामान्य उपाधि से बदलने के बजाय उसका प्रचलित हिंदी लिप्यंतरण रखा गया है।
- source_word: עוֹד
  choice: फिर
  rationale: यहाँ यह शब्द एक और संकेत की आज्ञा की ओर क्रम और पुनरावृत्ति दोनों को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: הָבֵא נָא יָדְךָ
  choice: अपना हाथ ... डालो
  rationale: शाब्दिक अर्थ ‘अपना हाथ ले आओ’ है, पर इस शारीरिक क्रिया के लिए ‘डालो’ स्वाभाविक हिंदी है। נָא आज्ञा को नरम करता है; हिंदी में विनम्रता का अलग शब्द जोड़ने पर परमेश्वर की आज्ञा अस्वाभाविक लग सकती है, इसलिए उसका भाव वाक्य के सहज आदेशात्मक रूप में रखा गया है।
- source_word: חֵיק
  choice: अपने वस्त्र के भीतर छाती पर
  rationale: यह शब्द छाती के पास वस्त्र की उस तह या भीतर के भाग को दर्शाता है जहाँ हाथ रखा जा सकता था; केवल ‘छाती’ कहने की तुलना में यह क्रिया को अधिक स्पष्ट करता है।
- source_word: וְהִנֵּה
  choice: तो देखो
  rationale: अचानक प्रकट हुए संकेत पर ध्यान खींचने वाली नाटकीय शक्ति को बनाए रखता है।
- source_word: מְצֹרַעַת
  choice: चर्म-रोग से ग्रस्त
  rationale: इब्रानी शब्द बाइबिल में צָרַעַת नामक दशा को दर्शाता है, जिसे आधुनिक हैन्सन रोग के साथ ठीक-ठीक समान मानना उचित नहीं; इसलिए ‘कोढ़ी’ से अधिक व्यापक और सावधान अभिव्यक्ति चुनी गई है।
- source_word: כַּשָּׁלֶג
  choice: बर्फ के समान दिखाई दे रहा था
  rationale: मूल पाठ की संक्षिप्त उपमा ‘बर्फ के समान’ सुरक्षित रखी गई है। ‘सफेद’ को स्पष्ट रूप से नहीं जोड़ा गया, यद्यपि उपमा रंग और रूप का संकेत देती है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में विशिष्ट नाम सीधे उपस्थित है। ‘याहवे’ उसे उपाधि ‘प्रभु’ से बदलने के बजाय नाम के रूप में सुरक्षित रखता है; ‘यहोवा’ एक पारंपरिक वैकल्पिक उच्चारण है।
- issue: מְצֹרַעַת की रोग-संबंधी पहचान
  choice: चर्म-रोग से ग्रस्त
  alternative: कोढ़ी
  rationale: प्राचीन बाइबिलीय श्रेणी को आधुनिक हैन्सन रोग से निश्चित रूप से समान नहीं माना गया, जिससे पाठ के रोग और शुद्धता-संबंधी अर्थ को किसी आधुनिक निदान तक सीमित करने से बचा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘अपने वस्त्र के भीतर छाती पर’ प्राचीन पहनावे की तह का अर्थ साधारण पाठक के लिए स्पष्ट करता है। ‘तो देखो’ संकेत के अचानक प्रकट होने की नाटकीयता बनाए रखता है।
