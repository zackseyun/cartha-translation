  yaml_path: translation/ot/exodus/004/013.yaml
  text: But he said[a], “Please, my Lord, send by the hand of whomever you will send.”
translation:
  language: hi
  text: पर उसने कहा[a], “मेरे प्रभु, कृपा करके, जिसे आप भेजना चाहें, उसके हाथ से भेजिए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक व्याख्यात्मक रूप में, “मेरे प्रभु, कृपा करके किसी और को भेजिए।”
    reason: वैकल्पिक व्याख्यात्मक पाठ
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: पर उसने कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है, किंतु प्रसंग में मूसा परमेश्वर के उत्तरों के बाद भी विरोध कर रहा है; इसलिए ‘पर’ यहाँ विरोधसूचक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בִּי
  choice: हे
  rationale: सम्मानसूचक संबोधन से पहले यह विनम्र निवेदन का मुहावरा है। हिंदी में ‘हे मेरे प्रभु’ संबोधन की दीनता को स्वाभाविक रूप से व्यक्त करता है; निवेदन का भाव आगे ‘कृपा करके’ से स्पष्ट है।
- source_word: אֲדֹנָי
  choice: मेरे प्रभु
  rationale: यह परमेश्वर के लिए आदरपूर्ण प्रत्यक्ष संबोधन है और प्रथम पुरुष एकवचन प्रत्यय को सुरक्षित रखता है। यह יהוה नाम नहीं है।
- source_word: שְׁלַח נָא
  choice: कृपा करके ... भेजिए
  rationale: आज्ञार्थक क्रिया और विनयकारी נָא को आधुनिक सम्मानपूर्ण हिंदी में विनम्र अनुरोध के रूप में व्यक्त किया गया है।
- source_word: בְּיַד
  choice: के हाथ से
  rationale: हिब्रू मुहावरा साधन अथवा प्रतिनिधि के द्वारा कार्य होने को बताता है। हिंदी में ‘के हाथ से’ बोधगम्य रहते हुए स्रोत की अभिव्यक्ति को बनाए रखता है।
- source_word: תִּשְׁלָח
  choice: जिसे आप भेजना चाहें
  rationale: अपूर्ण क्रिया को इस संबंधवाचक संरचना में स्वाभाविक हिंदी दी गई है। यह किसी व्यक्ति का नाम नहीं बताती और मूसा के टालमटोल भरे, किंतु अस्पष्ट, कथन को सुरक्षित रखती है।
theological_decisions:
- issue: मूसा के टालमटोल भरे अनुरोध का अर्थ
  choice: 'मुख्य पाठ में अस्पष्टता बनाए रखी गई: ‘जिसे आप भेजना चाहें, उसी के हाथ से भेजिए।’'
  alternative: ‘कृपा करके किसी और को भेजिए।’
  rationale: प्रसंग से मूसा की अनिच्छा स्पष्ट है, पर हिब्रू में ‘किसी और’ प्रत्यक्ष रूप से नहीं कहा गया। इसलिए मुख्य पाठ स्रोत की अस्पष्टता रखता है और अधिक व्याख्यात्मक अर्थ पादटिप्पणी में देता है।
translation_notes:
  register: आधुनिक मानक हिंदी; भाषा सम्मानपूर्ण, सहज और गरिमामय रखी गई है। ‘आप/भेजिए’ से परमेश्वर के प्रति आदर व्यक्त होता है। मुख्य वाक्य में हिब्रू मुहावरे और उसकी वास्तविक अर्थगत अस्पष्टता को यथासंभव सुरक्षित रखा गया है।
