base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/024.yaml
  text: And it happened on the way[a], at the lodging place[b], that Yahweh met him and sought to put him to death.
translation:
  language: hi
  text: और मार्ग में, रात बिताने की जगह पर[a], ऐसा हुआ कि याहवे उससे मिला और उसे मार डालना चाहा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “रात के पड़ाव पर”; इब्रानी शब्द रात बिताने की जगह को दर्शाता है, जो आवश्यक नहीं कि कोई व्यावसायिक सराय हो।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “उससे” और “उसे” किसके लिए हैं, इब्रानी पाठ इसे स्पष्ट नहीं करता; इनका संकेत मूसा की ओर या, कुछ व्याख्याओं के अनुसार, उसके पुत्र की ओर हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: ऐसा हुआ
  rationale: यह कथात्मक सूत्र नए प्रसंग का आरम्भ करता है; यह रूप स्वाभाविक आधुनिक हिन्दी में उसके कथावाचक कार्य को बनाए रखता है।
- source_word: בַדֶּרֶךְ
  choice: मार्ग में
  rationale: यह सीधा स्थानवाचक पद है और यात्रा के दौरान की स्थिति बताता है।
- source_word: בַמָּלוֹן
  choice: रात बिताने की जगह पर
  rationale: מָלוֹן रात ठहरने के स्थान को सूचित करता है; यह आवश्यक रूप से कोई व्यावसायिक सराय नहीं थी।
- source_word: וַיִּפְגְּשֵׁהוּ
  choice: उससे मिला
  rationale: פגע का मूल भाव मिलना या सामना होना है; अगले खंड से प्रसंग की घातक गंभीरता स्पष्ट होती है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित रूप से परमेश्वर के व्यक्तिगत वाचा-नाम को दर्शाता है, इसे किसी उपाधि से नहीं बदलता।
- source_word: וַיְבַקֵּשׁ
  choice: चाहा
  rationale: בקש यहाँ किसी कार्य को करने की चेष्टा या मंशा व्यक्त करता है; हिन्दी में 'चाहा' स्वाभाविक है और कथात्मक तनाव बनाए रखता है।
- source_word: הֲמִיתוֹ
  choice: उसे मार डालना
  rationale: מות के हिफ़ील रूप का अर्थ मृत्यु का कारण बनना या मार डालना है; यह स्पष्ट और गंभीर आधुनिक हिन्दी है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में व्यक्तिगत चतुरक्षरीय नाम है; हिन्दी का परिचित लिप्यंतरण उसे उपाधि से प्रतिस्थापित नहीं करता।
- issue: पुल्लिंग एकवचन कर्मवाचक प्रत्ययों का संदर्भ
  choice: मुख्य पाठ में 'उससे/उसे' रखकर संदर्भ अस्पष्ट रखा गया
  alternative: मूसा अथवा उसका पुत्र नाम से निर्दिष्ट करना
  rationale: इस पद में इब्रानी पाठ पूर्वपद को स्पष्ट नहीं करता। किसी व्यक्ति का नाम जोड़ना व्याख्यात्मक निर्णय होता, इसलिए वास्तविक अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। 'सराय' से उत्पन्न संभावित कालभ्रम से बचने के लिए वर्णनात्मक पद चुना गया है। अस्पष्ट सर्वनामों की पहचान मुख्य पाठ में नहीं जोड़ी गई।
