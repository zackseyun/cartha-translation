  text: וַ/תִּקַּ֨ח צִפֹּרָ֜ה צֹ֗ר וַ/תִּכְרֹת֙ אֶת עָרְלַ֣ת בְּנָ֔/הּ וַ/תַּגַּ֖ע לְ/רַגְלָ֑י/ו וַ/תֹּ֕אמֶר כִּ֧י חֲתַן דָּמִ֛ים אַתָּ֖ה לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/025.yaml
  text: Then Zipporah took a flint and cut off her son's foreskin and touched his feet with it[a], and she said, “Surely you are a bridegroom of blood to me.”
translation:
  language: hi
  text: तब सिप्पोरा ने चकमक पत्थर लिया और अपने बेटे का अग्रचर्म काट दिया। उसने उससे उसके पाँवों को छुआ[a] और कहा, “निश्चय ही तू मेरे लिए लहू का दूल्हा है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘उसके पाँव।’ ‘पाँव’ जननांगों के लिए व्यंजना हो सकता है, और ‘उसके’ का संकेत मूसा या उसके बेटे की ओर हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹר
  choice: चकमक पत्थर
  rationale: यह संज्ञा काटने के औज़ार के रूप में प्रयुक्त चकमक या पत्थर को दर्शाती है। ‘चकमक पत्थर’ प्रसंग में स्पष्ट और स्वाभाविक है।
- source_word: עָרְלַת בְּנָהּ
  choice: अपने बेटे की खलड़ी
  rationale: यह संबंधवाचक पदबंध का सीधा और शारीरिक रूप से सटीक अनुवाद है; ‘खलड़ी’ आधुनिक मानक हिन्दी में foreskin के लिए समझ में आने वाला शब्द है।
- source_word: וַתַּגַּע
  choice: छुए
  rationale: נגע का सामान्य अर्थ ‘छूना’ है। यह चयन संपर्क के ढंग को अनिर्धारित रखते हुए इब्रानी क्रिया की सरलता बनाए रखता है।
- source_word: לְרַגְלָיו
  choice: उसके पाँव
  rationale: शाब्दिक अर्थ ‘उसके पाँव’ है। चूँकि ‘पाँव’ जननांगों के लिए व्यंजना हो सकता है और सर्वनाम का संकेत भी अस्पष्ट है, मुख्य पाठ में मूल अस्पष्टता रखी गई है।
- source_word: כִּי
  choice: निश्चय ही
  rationale: यहाँ כִּי सिप्पोरा के उद्गार को बल देता है; ‘निश्चय ही’ आधुनिक हिन्दी में इस बलाघात को स्वाभाविक रूप से व्यक्त करता है।
- source_word: חֲתַן דָּמִים
  choice: लहू का दूल्हा
  rationale: यह असामान्य और कठिन पदबंध है। ‘लहू का दूल्हा’ इब्रानी बिंब और उसकी व्याख्यात्मक अस्पष्टता को सँवारकर मिटाने के बजाय सुरक्षित रखता है।
- source_word: לִי
  choice: मेरे लिए
  rationale: यह पूर्वसर्ग निजी संबंध को व्यक्त करता है और ‘लहू का दूल्हा’ के साथ स्वाभाविक हिन्दी बनाता है।
theological_decisions:
- issue: ‘उसके पाँव’ को जननांगों की व्यंजना मानना या सर्वनाम का संकेत मूसा अथवा बेटे के रूप में स्पष्ट करना
  choice: मुख्य पाठ में शाब्दिक ‘उसके पाँव’ रखकर संकेत को अनिर्धारित रखना
  alternative: ‘उसके जननांग,’ ‘मूसा के पाँव/जननांग,’ या ‘बेटे के पाँव/जननांग’
  rationale: यह पद प्रसिद्ध रूप से अस्पष्ट है। मूल पाठ से आगे जाकर किसी एक पात्र या व्यंजनार्थ को निश्चित करने के बजाय अनुवाद इब्रानी की व्याख्यात्मक और धर्मवैचारिक तनातनी बनाए रखता है; प्रमुख संभावनाएँ पादटिप्पणी में दी गई हैं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी। कठिन इब्रानी पद ‘लहू का दूल्हा’ जानबूझकर अक्षुण्ण रखा गया है; वाक्य-रचना पठनीय बनाई गई है, पर मूल अस्पष्टता नहीं हटाई गई।
