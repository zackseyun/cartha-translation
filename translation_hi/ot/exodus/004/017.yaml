lexical_decisions:
- source_word: וְאֶת
  choice: और
  rationale: संयोजक इस आज्ञा को पिछली बात से जोड़ता है; निश्चित कर्म-चिह्न אֶת का हिन्दी में अलग अनुवाद आवश्यक नहीं है।
- source_word: הַמַּטֶּה הַזֶּה
  choice: यह लाठी
  rationale: מַטֶּה का अर्थ लाठी या दण्ड हो सकता है। मूसा के चरवाहे वाले प्रसंग में ‘लाठी’ सहज और स्पष्ट है, और הַזֶּה निर्दिष्ट वस्तु की ओर संकेत करता है।
- source_word: תִּקַּח
  choice: ले ले
  rationale: यहाँ अपूर्ण क्रिया आज्ञार्थक बल रखती है। ‘ले ले’ आधुनिक हिन्दी में सीधे व्यक्तिगत निर्देश को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְּיָדֶךָ
  choice: अपने हाथ में
  rationale: यह इब्रानी पूर्वसर्गीय पदबंध का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: אֲשֶׁר ... בּוֹ
  choice: इसी से
  rationale: सम्बन्धवाचक रचना और בּוֹ मिलकर लाठी के साधन होने का भाव देते हैं। ‘इसी से’ उस निर्दिष्ट लाठी पर बल रखते हुए हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: תַּעֲשֶׂה
  choice: दिखाएगा
  rationale: עָשָׂה का मूल अर्थ ‘करना’ है, पर ‘चिन्ह’ के साथ हिन्दी में ‘चिन्ह दिखाना’ अधिक स्वाभाविक है और चिन्हों को कार्यान्वित/प्रस्तुत करने का प्रसंगगत अर्थ देता है।
- source_word: הָאֹתֹת
  choice: वे चिन्ह
  rationale: निश्चित उपपद पहले बताए गए चिन्हों की ओर संकेत करता है। ‘वे चिन्ह’ इस पूर्वसंदर्भ को स्वाभाविक हिन्दी में स्पष्ट करता है, जबकि ‘चमत्कारी’ जैसा व्याख्यात्मक विशेषण मुख्य पाठ में नहीं जोड़ा गया।
