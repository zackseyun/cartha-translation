  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּקַּ֨ח מֹשֶׁ֜ה אֶת אִשְׁתּ֣/וֹ וְ/אֶת בָּנָ֗י/ו וַ/יַּרְכִּבֵ/ם֙ עַֽל הַ/חֲמֹ֔ר וַ/יָּ֖שָׁב אַ֣רְצָ/ה מִצְרָ֑יִם וַ/יִּקַּ֥ח מֹשֶׁ֛ה אֶת מַטֵּ֥ה הָ/אֱלֹהִ֖ים בְּ/יָדֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/020.yaml
  text: Then Moses took his wife and his sons[a], set them on the donkey, and returned to the land of Egypt[b]. And Moses took the staff of God in his hand.
translation:
  language: hi
  text: तब मूसा ने अपनी पत्नी और अपने पुत्रों को साथ लिया, उन्हें गधे पर सवार कराया[a] और मिस्र देश लौट गया। मूसा ने परमेश्वर की लाठी[b] अपने हाथ में ले ली।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उन्हें गधे पर बिठाया।’
    reason: lexical_alternative
  - marker: b
    text: या ‘परमेश्वर की छड़ी।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: तब मूसा ने ... साथ लिया
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में क्रम दिखाता है। ‘साथ लिया’ לקח के अर्थ को इस यात्रा-संदर्भ में सहज रूप से व्यक्त करता है।
- source_word: אִשְׁתּוֹ
  choice: अपनी पत्नी
  rationale: यह אשה पर लगे तृतीय पुरुष एकवचन पुल्लिंग प्रत्यय का सीधा और स्वाभाविक अनुवाद है; यहाँ सिप्पोरा नाम जोड़ना आवश्यक नहीं।
- source_word: בָּנָיו
  choice: अपने पुत्रों
  rationale: इब्रानी शब्द स्पष्ट रूप से पुल्लिंग बहुवचन ‘पुत्रों’ का अर्थ देता है, इसलिए अधिक सामान्य ‘बच्चों’ के बजाय यही रखा गया है।
- source_word: וַיַּרְכִּבֵם
  choice: उन्हें गधे पर सवार कराया
  rationale: רכב का हिफ़ील रूप कारणवाचक है—उन्हें सवारी करने की स्थिति में रखा या चढ़ाया। यह हिन्दी में अर्थ और कारणवाचकता दोनों को स्पष्ट रखता है।
- source_word: הַחֲמֹר
  choice: गधे पर
  rationale: मूल में संज्ञा निश्चित है। हिन्दी में इस प्रसंग में ‘गधे पर’ स्वाभाविक रूप से पर्याप्त है; ‘उस गधे’ कहना पहले से पहचाने हुए किसी खास गधे का अनावश्यक संकेत दे सकता है।
- source_word: וַיָּשָׁב
  choice: लौट गया
  rationale: इस संदर्भ में שוב का अर्थ वापस जाना या लौटना है; ‘लौट गया’ आधुनिक हिन्दी में सहज है।
- source_word: אַרְצָה מִצְרָיִם
  choice: मिस्र देश को
  rationale: दिशासूचक रूप सहित यह पद ‘मिस्र देश की ओर/को’ व्यक्त करता है। ‘देश’ को बनाए रखने से इब्रानी अभिव्यक्ति की पूर्णता सुरक्षित रहती है।
- source_word: מַטֵּה הָאֱלֹהִים
  choice: परमेश्वर की लाठी
  rationale: מַטֶּה यहाँ हाथ में ली जाने वाली लाठी है, जो परमेश्वर द्वारा दिए गए चिन्हों से जुड़ी है। ‘लाठी’ सामान्य आधुनिक हिन्दी में स्पष्ट है और संबंधवाचक ‘परमेश्वर की’ मूल संरचना को बनाए रखता है।
- source_word: בְּיָדוֹ
  choice: अपने हाथ में
  rationale: यह पूर्वसर्गीय पद का सीधा अनुवाद है और मूसा द्वारा लाठी हाथ में लिए होने की ठोस छवि बनाए रखता है।
theological_decisions:
- issue: מַטֵּה הָאֱלֹהִים में הָאֱלֹהִים का अनुवाद
  choice: परमेश्वर की लाठी
  alternative: दैवी लाठी
  rationale: यहाँ संदर्भ उस लाठी का है जो परमेश्वर की बुलाहट और दिए गए चिन्हों से संबद्ध है। इसलिए व्यक्तिगत संदर्भ को स्पष्ट रखने वाला ‘परमेश्वर’ सामान्य विशेषण ‘दैवी’ से अधिक उपयुक्त है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सरल किंतु गरिमापूर्ण रखी गई है। ‘पुत्रों’ मूल के लिंग-विशिष्ट बहुवचन को सुरक्षित रखता है। पादटिप्पणी-चिह्न उन्हीं शब्दों के बाद रखे गए हैं जिनके अनुवाद-विकल्प दिए गए हैं।
