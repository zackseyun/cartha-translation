base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/005.yaml
  text: so that they may believe that Yahweh[a], the God of their fathers, the God of Abraham, the God of Isaac, and the God of Jacob[b], has appeared to you.
translation:
  language: hi
  text: ताकि वे विश्वास करें कि याहवे[a], उनके पितरों के परमेश्वर—अब्राहम के परमेश्वर, इसहाक के परमेश्वर और याकूब के परमेश्वर—तुम्हें दिखाई दिया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: ‘य॰ह॰व॰ह॰’ (YHWH); परंपरागत रूप से ‘प्रभु’ अनूदित। नाम के अन्य प्रचलित रूप ‘याहवे’ और ‘यहोवा’ हैं।'
    reason: alternative_reading
lexical_decisions:
- source_word: לְמַעַן
  choice: ताकि
  rationale: यह उद्देश्य सूचक पद है; ‘ताकि’ आधुनिक हिन्दी में स्वाभाविक रूप से प्रयोजन व्यक्त करता है।
- source_word: יַאֲמִינוּ
  choice: वे विश्वास करें
  rationale: यहाँ हिफ़ील रूप मूसा के दावे और चिन्ह के संदेश को सत्य मानने की बात करता है; ‘विश्वास करें’ संदर्भानुकूल है।
- source_word: כִּי
  choice: कि
  rationale: यह कारण नहीं, बल्कि विश्वास की विषय-वस्तु प्रस्तुत करता है।
- source_word: נִרְאָה אֵלֶיךָ
  choice: ने तुम्हें दर्शन दिया है
  rationale: נראה का निफ़ाल यहाँ ‘प्रकट होना/दिखाई देना’ है। ईश्वर के प्रकट होने के लिए ‘दर्शन दिया है’ स्वाभाविक और गरिमापूर्ण हिन्दी है तथा पूर्ण घटना की वर्तमान प्रासंगिकता बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबलीय प्रयोग में टेट्राग्रामाटन के प्रचलित नामरूप ‘यहोवा’ को रखा गया है; पादटिप्पणी मूल इब्रानी रूप और अन्य प्रचलित निरूपण स्पष्ट करती है।
- source_word: אֱלֹהֵי אֲבֹתָם
  choice: उनके पितरों के परमेश्वर
  rationale: ‘पितरों’ से मूल का पुल्लिंग बहुवचन और वाचा-संबंधी पैतृक वंश दोनों सुरक्षित रहते हैं; ‘पूर्वजों’ की तुलना में यह अधिक रूप-संगत है।
- source_word: אֱלֹהֵי אַבְרָהָם אֱלֹהֵי יִצְחָק וֵאלֹהֵי יַעֲקֹב
  choice: अब्राहम के परमेश्वर, इसहाक के परमेश्वर और याकूब के परमेश्वर
  rationale: हर कुलपिता के पहले ‘परमेश्वर’ की पुनरावृत्ति मूल इब्रानी के बल और गंभीर लय को बनाए रखती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में निजी वाचा-नाम सीधे आया है। शीर्षक ‘प्रभु’ से प्रतिस्थापित करने के बजाय हिन्दी पाठकों में व्यापक रूप से पहचाना जाने वाला नामरूप रखा गया है; पादटिप्पणी ‘याहवे’ विकल्प भी बताती है।
- issue: אֲבֹתָם का लिंग और वंश-संबंधी अर्थ
  choice: उनके पितरों
  alternative: उनके पूर्वजों
  rationale: मूल का पुल्लिंग बहुवचन और उसके तुरंत बाद अब्राहम, इसहाक तथा याकूब का उल्लेख ‘पितरों’ का समर्थन करते हैं; व्यापक अर्थ ‘पूर्वजों’ को पादटिप्पणी में दिया गया है।
- issue: נִרְאָה की अभिव्यक्ति
  choice: दर्शन दिया है
  alternative: प्रकट हुआ है
  rationale: दोनों मूल के निफ़ाल अर्थ को व्यक्त करते हैं। ‘दर्शन दिया है’ हिन्दी में दिव्य प्रकटाव के लिए स्वाभाविक है और यह नहीं बताता कि परमेश्वर का पूर्ण स्वरूप देखा गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। मूल की उद्देश्य-सूचक रचना तथा तीनों कुलपिताओं के साथ ‘परमेश्वर’ की पुनरावृत्ति सुरक्षित है। मुख्य पाठ में ‘पितरों’ का अर्थ पर्याप्त स्पष्ट होने के कारण अलग lexical footnote नहीं जोड़ी गई।
