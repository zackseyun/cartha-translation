  yaml_path: translation/ot/exodus/004/028.yaml
  text: Moses told Aaron all the words of Yahweh who had sent him[a], and all the signs that he had commanded him.
translation:
  language: hi
  text: मूसा ने हारून को उस यहोवा के सारे वचन बताए जिसने उसे भेजा था[a], और वे सारे चिन्ह भी बताए जिनके विषय में उन्होंने उसे आज्ञा दी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहोवा के वे सारे वचन जिनके साथ उन्होंने उसे भेजा था।” इब्रानी सम्बन्धवाचक उपवाक्य को ‘वचनों’ के साथ निकटता से जोड़ा जा सकता है; फिर भी दोनों व्याख्याओं में यहोवा द्वारा मूसा को भेजा जाना निहित है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: बताईं
  rationale: हिफ़ील रूप का अर्थ किसी बात को ज्ञात कराना या बताना है; यहाँ मूसा द्वारा हारून को सूचना देने के लिए ‘बताईं’ स्वाभाविक है।
- source_word: דִּבְרֵי יְהוָה
  choice: यहोवा की वे सारी बातें
  rationale: דָּבָר का अर्थ ‘वचन’, ‘बात’ या ‘संदेश’ हो सकता है। बहुवचन और כָּל को रखते हुए ‘वे सारी बातें’ आधुनिक हिन्दी में सहज है और मौखिक आदेशों का भाव बचाता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी व्यक्तिगत नाम יהוה को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नामरूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: אֲשֶׁר שְׁלָחוֹ
  choice: जिन्होंने उसे भेजा था
  rationale: सम्बन्धवाचक उपवाक्य को निकटतम स्पष्ट कर्ता यहोवा से जोड़ा गया है। आदरसूचक बहुवचन हिन्दी में परमेश्वर के लिए स्वाभाविक है; ‘उसे’ मूसा को सूचित करता है।
- source_word: הָאֹתֹת
  choice: चिन्ह
  rationale: אוֹת के लिए ‘चिन्ह’ सीधा और प्रसंगानुकूल है; ‘चमत्कारी’ जोड़ना मूल से अधिक स्पष्टता देता।
- source_word: אֲשֶׁר צִוָּהוּ
  choice: जिनके विषय में उन्होंने उसे आज्ञा दी थी
  rationale: शाब्दिक रूप से चिन्ह ही सम्बन्धवाचक उपवाक्य का पूर्वपद हैं। ‘जिनके विषय में’ हिन्दी की असहज ‘जिन्हें करने की आज्ञा’ से बचते हुए यह भी नहीं जोड़ता कि मूल में स्पष्ट क्रिया ‘करना’ है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: व्यक्तिगत वाचा-नाम को उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं किया गया। ‘यहोवा’ हिन्दी बाइबलीय प्रयोग में पहचाना जाने वाला लिप्यंतरण है।
- issue: אֲשֶׁר שְׁלָחוֹ का सम्बन्ध
  choice: सम्बन्धवाचक उपवाक्य यहोवा को विशेषित करता है
  alternative: ‘वे सारी बातें जिनके साथ उसने उसे भेजा था’
  rationale: इब्रानी रचना दोनों सम्बंधों की सम्भावना देती है। मुख्य पाठ में यहोवा को पूर्वपद मानने वाला सहज पाठ रखा गया और दूसरी सम्भावना पादटिप्पणी में सुरक्षित की गई।
- issue: चिन्हों के सम्बन्ध में आज्ञा का आशय
  choice: ‘जिनके विषय में ... आज्ञा दी थी’
  alternative: ‘जिन्हें करने की ... आज्ञा दी थी’
  rationale: मूल में ‘करना’ क्रिया व्यक्त नहीं है। चुना गया रूप आज्ञा और चिन्हों के सम्बन्ध को बनाए रखता है, पर निहित क्रिया को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। परमेश्वर के लिए आदरसूचक बहुवचन का प्रयोग किया गया है। ‘बातें’ और ‘चिन्ह’ सामान्य पाठक के लिए सहज हैं, जबकि इब्रानी की सम्भावित वाक्यगत अस्पष्टता पादटिप्पणी में सुरक्षित है।
