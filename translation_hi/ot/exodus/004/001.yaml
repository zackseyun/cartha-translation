base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/001.yaml
  text: Then Moses answered and said[a], “But behold, they will not believe me, and they will not listen to my voice, for they will say[b], ‘Yahweh has not appeared to you.’”
translation:
  language: hi
  text: तब मूसा ने उत्तर दिया, “लेकिन देखिए, वे मुझ पर विश्वास नहीं करेंगे और मेरी बात नहीं सुनेंगे,[a] क्योंकि वे कहेंगे, ‘याहवे तुम्हें प्रकट नहीं हुआ है।’”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मेरी आवाज़ नहीं सुनेंगे”; इस इब्रानी मुहावरे का अर्थ “मेरी बात नहीं सुनेंगे” या “मेरी बात नहीं मानेंगे” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “याहवे तुम्हें प्रकट नहीं हुआ।”
    reason: aspectual_alternative
lexical_decisions:
- source_word: וַיַּעַן מֹשֶׁה וַיֹּאמֶר
  choice: तब मूसा ने उत्तर दिया
  rationale: दोनों क्रियाएँ उत्तर देने और कहने का सूत्र बनाती हैं; हिन्दी में ‘उत्तर दिया’ स्वाभाविक रूप से दोनों का आशय व्यक्त करता है और अनावश्यक पुनरुक्ति से बचता है।
- source_word: וְהֵן
  choice: लेकिन देखिए
  rationale: यह कण मूसा की आपत्ति प्रस्तुत करते हुए ध्यान आकर्षित करता है; ‘लेकिन देखिए’ उसके विरोधात्मक और संकेतात्मक दोनों बल को बनाए रखता है।
- source_word: לֹא יַאֲמִינוּ לִי
  choice: वे मुझ पर विश्वास नहीं करेंगे
  rationale: हिफ़ील रूप यहाँ मूसा और उसके दावे पर विश्वास करने को सूचित करता है; यह आधुनिक हिन्दी में स्वाभाविक अभिव्यक्ति है।
- source_word: וְלֹא יִשְׁמְעוּ בְּקֹלִי
  choice: और मेरी बात नहीं मानेंगे
  rationale: शाब्दिक अर्थ ‘मेरी आवाज़ नहीं सुनेंगे’ है, पर यह इब्रानी मुहावरा सुनने, ध्यान देने या मानने का भाव रखता है; प्रसंग में ‘मेरी बात नहीं मानेंगे’ उपयुक्त है, जबकि टिप्पणी मूल चित्र को बताती है।
- source_word: כִּי יֹאמְרוּ
  choice: क्योंकि वे कहेंगे
  rationale: כִּי मूसा की आशंका का कारण प्रस्तुत करता है और यֹאמְרוּ भविष्य में संभावित प्रतिक्रिया बताता है।
- source_word: לֹא נִרְאָה אֵלֶיךָ
  choice: तुम्हारे सामने प्रकट नहीं हुआ है
  rationale: נראה का निफ़अल यहाँ ‘प्रकट होना’ है; पूर्ण क्रिया को कथित वर्तमान स्थिति से जुड़े भूतकाल के रूप में रखा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल में प्रयुक्त परमेश्वर के व्यक्तिगत नाम चतुराक्षर को किसी उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: पाठ में व्यक्तिगत वाचा-नाम सीधे उपस्थित है; ‘याहवे’ मूल नाम को सुरक्षित रखता है, जबकि ‘प्रभु’ उसे उपाधि में बदल देता और ‘यहोवा’ बाद की मिश्रित उच्चारण-परंपरा दर्शाता है।
- issue: שׁמע בקול में सुनने और मानने के बीच अर्थ
  choice: मेरी बात नहीं मानेंगे
  alternative: मेरी आवाज़ नहीं सुनेंगे / मेरी बात नहीं सुनेंगे
  rationale: मुहावरे में सुनना, ध्यान देना और मानना—इनका अर्थक्षेत्र खुला है। मुख्य पाठ में स्वाभाविक हिन्दी चुनी गई है और टिप्पणी में शाब्दिक रूप तथा अर्थ-विकल्प सुरक्षित हैं; इसे स्पष्ट आज्ञापालन तक सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक स्तर रखा गया है। ‘देखिए’ मूसा के ईश्वर से संबोधन के अनुरूप आदरसूचक है। ईश्वरीय नाम ‘याहवे’ देवनागरी में दिया गया है। सभी टिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
