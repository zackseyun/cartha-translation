  edition: WLC
  text: וְ/דִבַּרְתָּ֣ אֵלָ֔י/ו וְ/שַׂמְתָּ֥ אֶת הַ/דְּבָרִ֖ים בְּ/פִ֑י/ו וְ/אָנֹכִ֗י אֶֽהְיֶ֤ה עִם פִּ֨י/ךָ֙ וְ/עִם פִּ֔י/הוּ וְ/הוֹרֵיתִ֣י אֶתְ/כֶ֔ם אֵ֖ת אֲשֶׁ֥ר תַּעֲשֽׂוּ/ן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/015.yaml
  text: You shall speak to him and put the words in his mouth[a], and I will be with your mouth and with his mouth[b], and I will instruct you what you shall do.
translation:
  language: hi
  text: तू उससे बात करना और वे शब्द उसके मुँह में डालना। मैं तेरे मुँह के साथ और उसके मुँह के साथ रहूँगा[a], और मैं तुम दोनों को सिखाऊँगा कि तुम्हें क्या करना है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “मैं तेरे मुँह के साथ और उसके मुँह के साथ रहूँगा”; इसका भाव बोलने में परमेश्वर की उपस्थिति और सहायता से है।
    reason: मूल मुहावरे और उसके प्रसंगगत भाव को स्पष्ट करना
  - marker: b
    text: यहाँ “तुम” बहुवचन है और मूसा तथा हारून दोनों को सम्बोधित करता है।
    reason: इब्रानी में वचन के परिवर्तन को स्पष्ट करना
lexical_decisions:
- source_word: וְדִבַּרְתָּ אֵלָיו
  choice: तू उससे बात करना
  rationale: संयोजक के साथ प्रयुक्त पूर्ण क्रिया यहाँ निर्देश या आज्ञा का कार्य करती है। ‘उससे बात करना’ דבר + אל का सहज और सीधा हिन्दी रूप है।
- source_word: וְשַׂמְתָּ אֶת־הַדְּבָרִים בְּפִיו
  choice: और वे बातें उसके मुँह में डालना
  rationale: שׂים का सामान्य अर्थ ‘रखना/डालना’ है। ‘मुँह में डालना’ मूल इब्रानी मुहावरे को बनाए रखता है, जिसमें मूसा द्वारा हारून को बोलने के लिए शब्द दिए जाने का भाव है।
- source_word: הַדְּבָרִים
  choice: वे बातें
  rationale: निश्चित बहुवचन संज्ञा का सन्दर्भ पहले से बताई गई बातों से है। ‘सन्देश’ कहने की अपेक्षा ‘बातें’ मूल के बहुवचन और ठोस शब्दावली के अधिक निकट है।
- source_word: וְאָנֹכִי אֶהְיֶה עִם־פִּיךָ וְעִם־פִּיהוּ
  choice: मैं तेरे मुँह के साथ और उसके मुँह के साथ रहूँगा
  rationale: यह रूप इब्रानी की ठोस शारीरिक छवि को बनाए रखता है और परमेश्वर की उपस्थिति तथा बोलने में दी जाने वाली सामर्थ्य को व्याख्यात्मक विस्तार के बिना व्यक्त करता है।
- source_word: וְהוֹרֵיתִי אֶתְכֶם
  choice: और मैं तुम दोनों को सिखाऊँगा
  rationale: ירה का हिफ़ील रूप यहाँ ‘सिखाना/निर्देश देना’ है। אֶתְכֶם बहुवचन है, इसलिए ‘तुम दोनों’ मूसा और हारून दोनों को स्पष्ट रूप से सम्मिलित करता है।
- source_word: אֵת אֲשֶׁר תַּעֲשׂוּן
  choice: कि तुम्हें क्या करना है
  rationale: सम्बन्धवाचक रचना का अर्थ ‘क्या करना है’ है। बहुवचन क्रिया मूसा और हारून दोनों को सम्बोधित करती है; हिन्दी में यह रूप निर्देशात्मक भाव को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: बोलने में ईश्वरीय सहायता के लिए मानवरूपी अभिव्यक्ति
  choice: मुख्य पाठ में ‘तेरे मुँह के साथ और उसके मुँह के साथ रहूँगा’ रखा गया है।
  alternative: मैं तुझे और उसे बोलने में सहायता दूँगा
  rationale: मूल पाठ परमेश्वर की प्रत्यक्ष उपस्थिति और बोलने की सामर्थ्य को शारीरिक छवि द्वारा व्यक्त करता है। ठोस अभिव्यक्ति बनाए रखने से पाठ की बनावट और निहित धार्मिक तनाव सुरक्षित रहता है।
- issue: अन्तिम सर्वनाम और क्रिया का वचन
  choice: ‘तुम दोनों’ और ‘तुम्हें’ द्वारा मूसा और हारून दोनों को स्पष्ट किया गया है।
  alternative: तुम्हें सिखाऊँगा कि तुम क्या करोगे
  rationale: इब्रानी में אֶתְכֶם और תַּעֲשׂוּן स्पष्ट रूप से बहुवचन हैं। हिन्दी में ‘तुम दोनों’ इस व्याकरणिक परिवर्तन को स्वाभाविक और असंदिग्ध ढंग से सामने लाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली अपनाई गई है। मूसा के लिए एकवचन ‘तू/तेरे’ मूल के एकवचन सम्बोधन को दर्शाता है; अन्त में ‘तुम दोनों’ इब्रानी बहुवचन को स्पष्ट करता है। ‘मुँह के साथ रहना’ जानबूझकर ठोस रखा गया है ताकि मूल की मानवरूपी छवि मिट न जाए।
