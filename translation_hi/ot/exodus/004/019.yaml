base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/019.yaml
  text: And Yahweh said to Moses in Midian[a], “Go, return to Egypt, because all the men who were seeking your life are dead.”
translation:
  language: hi
  text: और याहवे ने मिद्यान में मूसा से कहा, “जा, मिस्र लौट जा[a], क्योंकि वे सभी पुरुष जो तेरे प्राण लेने का प्रयास कर रहे थे, मर चुके हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मिस्र वापस जा।” इब्रानी में दो आज्ञार्थक क्रियाएँ हैं, शाब्दिक रूप से, “जा, लौट।”
    reason: मूल की दोहरी आज्ञा को स्पष्ट करना
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के व्यक्तिगत नाम के प्रचलित लिप्यंतरण ‘यहोवा’ का प्रयोग किया गया है; इसे ‘प्रभु’ जैसे पद से नहीं बदला गया।
- source_word: בְּמִדְיָן
  choice: मिद्यान में
  rationale: בְּ स्थान सूचित करता है; इसलिए सीधा और स्वाभाविक अनुवाद ‘मिद्यान में’ है।
- source_word: לֵךְ שֻׁב
  choice: जा, ... लौट जा
  rationale: दोनों इब्रानी आज्ञार्थक क्रियाओं—गमन और लौटने—को हिन्दी में बनाए रखा गया है।
- source_word: כִּי מֵתוּ
  choice: क्योंकि ... मर चुके हैं
  rationale: כִּי कारण बताता है और पूर्ण क्रिया מֵתוּ वर्तमान से संबद्ध पूर्ण अवस्था व्यक्त करती है।
- source_word: כָּל הָאֲנָשִׁים
  choice: वे सभी पुरुष
  rationale: אֲנָשִׁים यहाँ पुरुष व्यक्तियों को सूचित करता है; अतः इसे सामान्य ‘लोग’ नहीं किया गया।
- source_word: הַמְבַקְשִׁים אֶת נַפְשֶׁךָ
  choice: जो तेरे प्राण के खोजी थे
  rationale: यह किसी के प्राण लेने के उद्देश्य से उसका पीछा करने का इब्रानी मुहावरा है। ‘प्राण के खोजी’ मूल रूपक को सुरक्षित रखता है और हिन्दी बाइबलीय शैली में बोधगम्य है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ के व्यक्तिगत ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नामरूप ‘यहोवा’ से प्रस्तुत किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज रखी गई है। मूसा को संबोधन में एकवचन निकटता और मूल की सीधी आज्ञा दिखाने के लिए ‘तेरे/जा’ रखा गया है। ‘प्राण के खोजी’ मूल मुहावरे को संरक्षित करता है, यद्यपि सामान्य बोलचाल में इसका अर्थ ‘जो तुझे मार डालना चाहते थे’ है।
