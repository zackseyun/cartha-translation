source:
  edition: WLC
  text: כִּֽי יִתֵּן֩ אִ֨ישׁ אֶל רֵעֵ֜/הוּ חֲמ֨וֹר אוֹ שׁ֥וֹר אוֹ שֶׂ֛ה וְ/כָל בְּהֵמָ֖ה לִ/שְׁמֹ֑ר וּ/מֵ֛ת אוֹ נִשְׁבַּ֥ר אוֹ נִשְׁבָּ֖ה אֵ֥ין רֹאֶֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/009.yaml
  text: If a man gives his neighbor a donkey[a], or an ox, or a sheep, or any animal to keep, and it dies, or is injured, or is carried off, with no one seeing it[c][b],
translation:
  language: hi
  text: यदि कोई व्यक्ति अपने पड़ोसी को गधा, बैल, भेड़[a] या कोई और पशु देखभाल के लिए सौंपे, और वह पशु मर जाए, घायल हो जाए[b] या उठा ले जाया जाए, और किसी ने यह होते न देखा हो[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बकरी’; इब्रानी שֶׂה रेवड़ के किसी एक पशु, अर्थात भेड़ या बकरी, को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ ‘टूट जाए’।
    reason: lexical_alternative
  - marker: c
    text: अर्थात जो कुछ पशु के साथ हुआ, उसका कोई प्रत्यक्षदर्शी न हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: यदि
  rationale: यह पद एक शर्तपरक न्याय-विधान आरम्भ करता है; आधुनिक हिन्दी में ‘यदि’ इसका स्वाभाविक कानूनी रूप है।
- source_word: יִתֵּן
  choice: सौंपे
  rationale: נתן का मूल अर्थ ‘देना’ है, पर לִשְׁמֹר के साथ यहाँ किसी पशु को दूसरे की देखभाल में देने का आशय है; ‘सौंपे’ इस प्रसंग को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: אִישׁ
  choice: कोई व्यक्ति
  rationale: इस शर्तपरक विधान में पुल्लिंग एकवचन אִישׁ प्रतिनिधिक और सामान्य अर्थ रखता है; ‘कोई व्यक्ति’ आधुनिक हिन्दी में उसी सामान्य कानूनी प्रयोग को व्यक्त करता है।
- source_word: אֶל רֵעֵהוּ
  choice: अपने पड़ोसी को
  rationale: רֵעַ सामाजिक निकटता वाले दूसरे व्यक्ति या सहचर को दर्शाता है; ‘पड़ोसी’ मानक और सहज समतुल्य है।
- source_word: חֲמוֹר
  choice: गधा
  rationale: यह आधुनिक हिन्दी में शब्द का सीधा और स्पष्ट अर्थ है।
- source_word: שׁוֹר
  choice: बैल
  rationale: पशुधन-संबंधी कानूनी प्रसंग में שׁוֹר के लिए ‘बैल’ स्वाभाविक पारंपरिक समतुल्य है।
- source_word: שֶׂה
  choice: भेड़
  rationale: שֶׂה रेवड़ के एक पशु—भेड़ या बकरी—को सूचित कर सकता है। मुख्य पाठ में परिचित विशिष्ट रूप ‘भेड़’ रखा गया है और व्यापक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: וְכָל בְּהֵמָה
  choice: या कोई और पशु
  rationale: בְּהֵמָה यहाँ सामान्यतः पालतू पशुधन को दर्शाता है। सूची के बाद ‘कोई और पशु’ हिन्दी में व्यापक श्रेणी को स्पष्ट और सहज ढंग से व्यक्त करता है।
- source_word: לִשְׁמֹר
  choice: देखभाल के लिए
  rationale: שׁמר में रक्षा और निगरानी का भाव है; सौंपे गए पशु के प्रसंग में ‘देखभाल के लिए’ स्वाभाविक अभिरक्षात्मक अर्थ देता है।
- source_word: וּמֵת
  choice: मर जाए
  rationale: शर्तपरक वाक्य में क्रिया का सरल और स्वाभाविक हिन्दी रूप।
- source_word: נִשְׁבַּר
  choice: घायल हो जाए
  rationale: शाब्दिक अर्थ ‘टूट जाए’ है, पर पशु के विषय में यह चोटिल होने को दर्शाता है; हिन्दी में ‘घायल हो जाए’ अर्थ को मुहावरेदार ढंग से व्यक्त करता है।
- source_word: נִשְׁבָּה
  choice: उठा ले जाया जाए
  rationale: Niphal रूप पकड़े या बंदी बनाकर ले जाए जाने का भाव देता है। यह अनुवाद केवल चोरी तक अर्थ को सीमित किए बिना पशु के बलपूर्वक ले जाए जाने को व्यक्त करता है।
- source_word: אֵין רֹאֶה
  choice: किसी ने यह होते न देखा हो
  rationale: यह बताता है कि घटना का कोई प्रत्यक्षदर्शी नहीं है; हिन्दी वाक्यांश उसी परिस्थिति को स्पष्ट और स्वाभाविक रूप में रखता है।
