  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज कानूनी शैली अपनाई गई है। वाक्य को शर्तपरक विधान के रूप में रखा गया है। पद आगे जारी रहने के कारण अंत में अल्पविराम रखा गया है; सभी पादटिप्पणी-चिह्न संबंधित शब्द या वाक्यांश के ठीक बाद दिए गए हैं।
