source:
  edition: WLC
  text: וְ/כִֽי יְפַתֶּ֣ה אִ֗ישׁ בְּתוּלָ֛ה אֲשֶׁ֥ר לֹא אֹרָ֖שָׂה וְ/שָׁכַ֣ב עִמָּ֑/הּ מָהֹ֛ר יִמְהָרֶ֥/נָּה לּ֖/וֹ לְ/אִשָּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/015.yaml
  text: If a man seduces a virgin who is not betrothed[a], and lies with her[b], he must surely pay the bride-price for her to be his wife.
translation:
  language: hi
  text: यदि कोई पुरुष किसी ऐसी कुँवारी को फुसलाए जिसकी मंगनी नहीं हुई है[a], और उसके साथ यौन-संबंध बनाए, तो उसे अपनी पत्नी बनाने के लिए उसका वधू-मूल्य[b] अवश्य देना होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात वह विवाह के लिए किसी पुरुष से औपचारिक रूप से वचनबद्ध नहीं हुई थी।
    reason: प्राचीन वैवाहिक-सांस्कृतिक अर्थ को स्पष्ट करना।
  - marker: b
    text: ‘वधू-मूल्य’ विवाह से जुड़ा वह भुगतान था जो वर या उसके परिवार की ओर से दिया जाता था; यह वधू-पक्ष द्वारा दिया जाने वाला ‘दहेज’ नहीं है।
    reason: इब्रानी מָהֹר के सांस्कृतिक और आर्थिक अर्थ को स्पष्ट करना।
lexical_decisions:
- source_word: יְפַתֶּה
  choice: फुसलाए
  rationale: पिएल रूप यहाँ यौन प्रसंग में मनाने, बहकाने या लुभाने का भाव देता है। ‘फुसलाए’ प्रलोभन या अनुचित मनुहार को व्यक्त करता है, पर मूल पाठ में स्पष्ट रूप से न कही गई बलपूर्वक हिंसा नहीं जोड़ता।
- source_word: אִישׁ
  choice: कोई पुरुष
  rationale: इब्रानी संज्ञा एकवचन पुल्लिंग है और इस विधान में पुरुष को कर्ता बताती है।
- source_word: בְּתוּלָה
  choice: कुँवारी
  rationale: इस कानूनी और वैवाहिक प्रसंग में यह शब्द ऐसी स्त्री को दर्शाता है जिसने यौन संबंध नहीं बनाया है; ‘कुँवारी’ आधुनिक हिन्दी में इस स्थिति को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֲשֶׁר לֹא אֹרָשָׂה
  choice: जिसकी मंगनी नहीं हुई है
  rationale: निष्क्रिय रूप ऐसी स्त्री को बताता है जो विवाह के लिए औपचारिक रूप से वचनबद्ध नहीं हुई। ‘मंगनी’ सामान्य पाठक के लिए सहज है, जबकि टिप्पणी में प्राचीन औपचारिक बंधन स्पष्ट किया गया है।
- source_word: וְשָׁכַב עִמָּהּ
  choice: और उसके साथ सोए
  rationale: שׁכב עם यौन संबंध का प्रचलित शिष्ट मुहावरा है। हिन्दी का ‘साथ सोना’ उसी मुहावरे को गरिमापूर्ण और समझने योग्य ढंग से रखता है।
- source_word: מָהֹר יִמְהָרֶנָּה
  choice: वधू-मूल्य अवश्य चुकाना होगा
  rationale: समधातुक क्रियार्थक संज्ञा और अपूर्ण क्रिया का मेल दायित्व पर बल देता है। מהר उस विवाह-संबंधी भुगतान को दर्शाता है जो वर की ओर से दिया जाता था; इसलिए ‘वधू-मूल्य’ ‘दहेज’ से अधिक सटीक है।
- source_word: לּוֹ לְאִשָּׁה
  choice: उस कुँवारी को अपनी पत्नी बनाने के लिए
  rationale: यह पद भुगतान के अभिप्रेत वैवाहिक परिणाम को व्यक्त करता है। संज्ञा को दोहराने से हिन्दी में सर्वनाम-संदर्भ स्पष्ट रहता है।
theological_decisions:
- issue: इस विधान में פתה द्वारा वर्णित यौन कृत्य का स्वरूप
  choice: बलपूर्वक बलात्कार के बजाय फुसलाना या बहकाना
  alternative: बलात्कार या जबरन यौन संबंध
  rationale: פתה का पिएल रूप सामान्यतः मनाने या फुसलाने को दर्शाता है। अनुवाद मूल में स्पष्ट रूप से न कही गई सहमति का दावा नहीं करता, लेकिन इसमें बलप्रयोग भी नहीं जोड़ता; इस प्रकार कानूनी प्रसंग की वास्तविक अस्पष्टता और अन्य बलपूर्वक यौन अपराधों से इसका भेद बना रहता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और कानूनी प्रसंग के अनुरूप गरिमापूर्ण रखी गई है। ‘फुसलाए’ और ‘उसके साथ सोए’ मूल के मुहावरेदार स्वर को बनाए रखते हैं; ‘वधू-मूल्य’ तकनीकी शब्द है, इसलिए उसे पाद-टिप्पणी में समझाया गया है।
