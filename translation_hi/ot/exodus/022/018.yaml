  text: Whoever lies with an animal shall surely be put to death[a].
translation:
  language: hi
  text: जो कोई किसी पशु के साथ संभोग करे, उसे निश्चय ही मार डाला जाए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शब्दशः: “वह निश्चय ही मरे।” इब्रानी विधिक सूत्र न्यायिक दंड के रूप में निश्चित मृत्यु को व्यक्त करता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל שֹׁכֵב
  choice: जो कोई ... संभोग करे
  rationale: כָּל के साथ कृदंत एक सामान्य अनिश्चित अभिव्यक्ति बनाता है। ‘जो कोई’ आधुनिक हिन्दी में इसे स्वाभाविक रूप से व्यक्त करता है; שׁכב עם यहाँ यौन संबंध का रूढ़ प्रयोग है, इसलिए ‘संभोग करे’ अर्थ को स्पष्ट और गरिमापूर्ण ढंग से बताता है।
- source_word: עִם
  choice: के साथ
  rationale: यह संबंधसूचक अव्यय क्रिया को उसके कर्म से जोड़ता है और हिन्दी में स्वाभाविक रूप से ‘के साथ’ होता है।
- source_word: בְּהֵמָה
  choice: किसी पशु
  rationale: בְּהֵמָה सामान्यतः पशु को दर्शाता है। ‘किसी पशु’ अनिश्चित भाव को स्पष्ट करता है और आधुनिक हिन्दी में ‘जानवर’ की अपेक्षा विधिक प्रसंग के अनुकूल है।
- source_word: מוֹת יוּמָת
  choice: उसे निश्चय ही मार डाला जाए
  rationale: क्रिया-मूल का infinitive absolute और निष्क्रिय imperfect मिलकर मृत्यु-दंड की निश्चितता पर बल देते हैं। यह अनुवाद बल तथा निष्क्रिय न्यायिक अर्थ—दोनों को बनाए रखता है।
theological_decisions:
- issue: विधिक मृत्यु-दंड सूत्र का अनुवाद
  choice: उसे निश्चय ही मार डाला जाए
  alternative: वह निश्चय ही मरे
  rationale: इब्रानी सूत्र निश्चित मृत्यु को न्यायिक दंड के रूप में व्यक्त करता है। चुना हुआ पाठ निष्क्रिय और दंडात्मक अर्थ स्पष्ट करता है, जबकि पादटिप्पणी अधिक शब्दशः विकल्प सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और विधिक गरिमा वाली रखी गई है। ‘संभोग करे’ मूल के यौन आशय को स्पष्ट करता है, जबकि ‘निश्चय ही मार डाला जाए’ दंड-विधान के बल और निष्क्रिय रूप को सुरक्षित रखता है।
