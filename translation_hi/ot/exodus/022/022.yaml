    issue: “मेरी दुहाई देगा” for אֵלַי / צָעֹק יִצְעַק
    rationale: Although understandable, this idiom is not the clearest modern Hindi equivalent of crying out directly to God. “मुझे पुकारेगा” preserves the Hebrew prepositional direction (“to me”) and the plea-like sense more transparently.
  - severity: low
    issue: Footnote a describes “अनाथ संतान” as though it were necessarily a child.
    rationale: The preceding Hebrew term denotes a fatherless/orphaned person; “अनाथ व्यक्ति” avoids unnecessarily narrowing the referent while preserving the distributive singular explanation.
