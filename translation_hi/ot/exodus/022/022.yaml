source:
  edition: WLC
  text: אִם עַנֵּ֥ה תְעַנֶּ֖ה אֹת֑/וֹ כִּ֣י אִם צָעֹ֤ק יִצְעַק֙ אֵלַ֔/י שָׁמֹ֥עַ אֶשְׁמַ֖ע צַעֲקָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/022.yaml
  text: If you indeed afflict him[a], and if he indeed cries out to me[b], I will surely hear his cry.
translation:
  language: hi
  text: यदि तुम उसे सचमुच सताओगे[a], और यदि वह सचमुच मुझे पुकारेगा[b], तो मैं उसकी पुकार अवश्य सुनूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में “उसे” और “उसकी” के लिए एकवचन पुल्लिंग रूप हैं। यहाँ वे पिछले पद में उल्लिखित किसी भी विधवा या अनाथ व्यक्ति के लिए वितरणात्मक रूप से प्रयुक्त हुए हैं।
    reason: cultural_note
  - marker: b
    text: 'हिब्रू में “सताना,” “पुकारना” और “सुनना”—तीनों क्रियाओं के बलात्मक दोहरे रूप हैं। उनका भाव है: “सचमुच सताना,” “सचमुच पुकारना” और “अवश्य सुनना।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: यदि
  rationale: यह शर्त प्रस्तुत करने वाला सामान्य हिब्रू अव्यय है; “यदि” उसके सशर्त अर्थ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: עַנֵּה תְעַנֶּה
  choice: सचमुच सताओगे
  rationale: क्रिया के साथ infinitive absolute क्रिया पर बल देता है। “सचमुच” उस बल को व्यक्त करता है, और “सताना” इस प्रसंग में ענה का स्पष्ट तथा स्वाभाविक हिन्दी रूप है।
- source_word: אֹתוֹ
  choice: उसे
  rationale: हिब्रू प्रत्यय एकवचन पुल्लिंग है और पिछले पद में बताई गई किसी भी विधवा या अनाथ संतान में से एक व्यक्ति की ओर वितरणात्मक रूप से संकेत करता है। हिन्दी “उसे” एकवचन बनाए रखता है, यद्यपि वह स्वयं लिंग नहीं बताता।
- source_word: כִּי אִם
  choice: और यदि
  rationale: यहाँ पदबंध आगे की सशर्त स्थिति को जोड़ता है, न कि “बल्कि” वाला विरोध प्रकट करता है।
- source_word: צָעֹק יִצְעַק
  choice: वह मेरी दुहाई देगा
  rationale: दोहराया हुआ हिब्रू क्रियारूप पुकार की निश्चितता या तीव्रता पर बल देता है। हिन्दी में “दुहाई देगा” संकट में सहायता के लिए पुकारने का स्वाभाविक भाव देता है; संयुक्त टिप्पणी मूल की बलात्मक रचना स्पष्ट करती है।
- source_word: אֵלַי
  choice: मेरी
  rationale: “मेरी दुहाई देना” स्वाभाविक हिन्दी मुहावरा है और मूल के “मेरी ओर/मुझसे पुकारना” का भाव व्यक्त करता है।
- source_word: שָׁמֹעַ אֶשְׁמַע
  choice: अवश्य सुनूँगा
  rationale: infinitive absolute और सीमित क्रिया का मेल परमेश्वर के उत्तर की सुनिश्चितता पर बल देता है; “अवश्य” इसे सहज हिन्दी में प्रकट करता है।
- source_word: צַעֲקָתוֹ
  choice: उसकी दुहाई
  rationale: यह उसी मूल צעק से बना संज्ञारूप है; “दुहाई” पहले प्रयुक्त क्रिया से अर्थगत संबंध बनाए रखता है।
theological_decisions:
- issue: पीड़ित व्यक्ति के लिए एकवचन पुल्लिंग हिब्रू सर्वनाम
  choice: उसे / वह / उसकी
  alternative: उन्हें / वे / उनकी
  rationale: मूल पाठ एकवचन पुल्लिंग रूप रखता है, जो पिछले पद में उल्लिखित किसी भी विधवा या अनाथ संतान के लिए वितरणात्मक रूप से प्रयुक्त है। हिन्दी के एकवचन सर्वनाम मूल की संख्या सुरक्षित रखते हैं, पर अनावश्यक रूप से व्यक्ति का लिंग निर्धारित नहीं करते।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। “दुहाई देना” संकट में सहायता के लिए पुकारने का परिचित हिन्दी प्रयोग है। पहले और तीसरे बलात्मक रूप क्रमशः “सचमुच” और “अवश्य” से स्पष्ट किए गए हैं; बीच के बलात्मक रूप की जानकारी पादटिप्पणी में दी गई है ताकि मुख्य वाक्य बोझिल न हो।
