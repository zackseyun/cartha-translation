  source_fidelity: The conditional sequence, singular reference, and emphatic force of the three infinitive-absolute constructions are retained. However, “मेरी दुहाई देगा” is less direct than the Hebrew “cry out to me” and can suggest invoking someone by name rather than addressing God in a plea. “मुझे पुकारेगा” renders the direction of the cry more clearly.
  naturalness: The proposed revision is idiomatic modern Hindi and maintains a clear, dignified legal-register sentence. “उसकी पुकार” naturally corresponds to both “मुझे पुकारेगा” and the Hebrew noun for “his cry.”
  terminology: “सताना” is an appropriate contextual rendering of ענה. “पुकारना/पुकार” provides a consistent and natural rendering of the צעק word group without importing additional theological interpretation.
  issues:
