source:
  edition: WLC
  text: שְׁבֻעַ֣ת יְהוָ֗ה תִּהְיֶה֙ בֵּ֣ין שְׁנֵי/הֶ֔ם אִם לֹ֥א שָׁלַ֛ח יָד֖/וֹ בִּ/מְלֶ֣אכֶת רֵעֵ֑/הוּ וְ/לָקַ֥ח בְּעָלָ֖י/ו וְ/לֹ֥א יְשַׁלֵּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/010.yaml
  text: an oath of Yahweh shall be between the two of them[a], that he has not put his hand to his neighbor’s property; and its owner shall accept it[c][b], and he shall not make restitution.
translation:
  language: hi
  text: याहवे की शपथ उन दोनों के बीच होगी[a] कि उसने अपने पड़ोसी की संपत्ति पर हाथ नहीं डाला है[b]। उस संपत्ति का मालिक उस शपथ को स्वीकार करेगा[c], और जिसके पास वह रखी गई थी उसे भरपाई नहीं करनी होगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात याहवे के नाम पर ली गई शपथ। इब्रानी में अक्षरशः ‘याहवे की शपथ।’
    reason: मूल संज्ञा-समास को रखते हुए कानूनी शपथ-सूत्र का आशय स्पष्ट करना।
  - marker: b
    text: ‘संपत्ति पर हाथ डालना’ किसी दूसरे की वस्तु को अनुचित रूप से लेने, इस्तेमाल करने या उससे छेड़छाड़ करने का मुहावरा है।
    reason: इब्रानी मुहावरे का सांस्कृतिक और कानूनी अर्थ बताना।
  - marker: c
    text: इसे ‘मालिक उसे ग्रहण करेगा’ भी अनुवादित किया जा सकता है; प्रसंग में आशय शपथ को पर्याप्त मानकर स्वीकार करना है।
    reason: לָקַח के शाब्दिक और प्रसंगगत अर्थों के बीच की गुंजाइश दिखाना।
lexical_decisions:
- source_word: שְׁבֻעַת יְהוָה
  choice: याहवे की शपथ
  rationale: इब्रानी में यह संज्ञा-समास अक्षरशः ‘याहवे की शपथ’ है। मुख्य पाठ में इसी रूप को रखा गया है; कानूनी प्रसंग में इसका आशय याहवे के नाम पर या उसके सामने ली गई शपथ है।
- source_word: בֵּין שְׁנֵיהֶם
  choice: उन दोनों के बीच
  rationale: मूल पाठ विवाद के दोनों पक्षों को स्पष्ट रूप से चिह्नित करता है; यह अनुवाद उस द्विपक्षीय कानूनी स्थिति को बनाए रखता है।
- source_word: אִם לֹא
  choice: कि ... नहीं ... है
  rationale: यहाँ यह सामान्य शर्त नहीं, बल्कि शपथ की विषयवस्तु प्रस्तुत करने वाला सूत्र है। इसलिए ‘यदि नहीं’ के बजाय ‘कि ... नहीं’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: שָׁלַח יָדוֹ
  choice: हाथ नहीं डाला है
  rationale: इब्रानी मुहावरा किसी दूसरे की वस्तु को अनुचित रूप से लेने, इस्तेमाल करने या उससे छेड़छाड़ करने का संकेत देता है। हिंदी में ‘हाथ डालना’ मूल बिंब और नकारात्मक कानूनी भाव दोनों को बनाए रखता है।
- source_word: בִּמְלֶאכֶת רֵעֵהוּ
  choice: अपने पड़ोसी की संपत्ति पर
  rationale: इस प्रसंग में מְלָאכָה अमूर्त ‘काम’ नहीं, बल्कि पड़ोसी की सौंपी हुई वस्तु या संपत्ति को दर्शाता है।
- source_word: וְלָקַח בְּעָלָיו
  choice: तब उस संपत्ति का मालिक उस शपथ को स्वीकार करे
  rationale: לָקַח का मूल अर्थ ‘लेना’ है, पर यहाँ निहित कर्म शपथ है और कानूनी अर्थ उसे पर्याप्त प्रमाण मानकर स्वीकार करना है। स्पष्टता के लिए दोनों निहित संदर्भ व्यक्त किए गए हैं।
- source_word: יְשַׁלֵּם
  choice: भरपाई न करे
  rationale: पिएल रूप covenant-law संदर्भ में क्षतिपूर्ति या प्रतिपूर्ति देने को व्यक्त करता है; आधुनिक हिंदी में ‘भरपाई’ इसका सहज कानूनी अर्थ देता है।
theological_decisions:
- issue: יהוה के दिव्य नाम का रूप
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल में व्यक्तिगत दिव्य नाम יהוה है, कोई उपाधि नहीं। ‘याहवे’ उसका निकट हिंदी लिप्यंतरण है और ‘प्रभु’ कहकर नाम को उपाधि में नहीं बदलता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध कानूनी हिंदी अपनाई गई है। वाक्य में मूल की औपचारिक शपथ-भाषा रखी गई है, जबकि निहित संदर्भों को इतना स्पष्ट किया गया है कि सर्वनामों से भ्रम न हो।
