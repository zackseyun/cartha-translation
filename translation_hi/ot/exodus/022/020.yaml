  text: וְ/גֵ֥ר לֹא תוֹנֶ֖ה וְ/לֹ֣א תִלְחָצֶ֑/נּוּ כִּֽי גֵרִ֥ים הֱיִיתֶ֖ם בְּ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/020.yaml
  text: You shall not mistreat a foreigner or oppress him[a], for you were foreigners in the land of Egypt.
translation:
  language: hi
  text: तुम किसी परदेशी के साथ बुरा व्यवहार न करना और न उसे दबाना,[a] क्योंकि तुम भी मिस्र देश में परदेशी थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘परदेशी’ से आशय ऐसे गैर-स्थानीय व्यक्ति से है जो इस्राएलियों के बीच रहता हो; अनुवाद ‘प्रवासी’ या ‘निवासी विदेशी’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: גֵר / גֵרִים
  choice: परदेशी / परदेशी
  rationale: यह शब्द इस्राएलियों के बीच रहने वाले गैर-स्थानीय व्यक्ति को दर्शाता है, केवल राह चलते अजनबी को नहीं। ‘परदेशी’ आधुनिक हिन्दी में सहज है और एकवचन तथा बहुवचन में मूल की पुनरावृत्ति बनाए रखता है।
- source_word: תוֹנֶה
  choice: के साथ बुरा व्यवहार करना
  rationale: हिफ़ील रूप यहाँ अन्यायपूर्ण या अनुचित व्यवहार का व्यापक अर्थ देता है; यह अनुवाद अर्थ को केवल आर्थिक शोषण तक सीमित नहीं करता।
- source_word: תִלְחָצֶנּוּ
  choice: उसे दबाना
  rationale: לחץ कठोर दबाव डालने अथवा उत्पीड़ित करने का भाव रखता है। ‘दबाना’ स्वाभाविक हिन्दी में इस कानूनी निषेध की व्यापकता और 3ms प्रत्यय ‘उसे’ दोनों को व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह आज्ञा का कारण प्रस्तुत करता है; ‘क्योंकि’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: הֱיִיתֶם
  choice: तुम ... थे
  rationale: यह मिस्र में इस्राएल के अतीत की अवस्था बताता है; ‘थे’ इसका सीधा और मुहावरेदार रूप है।
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: मिस्र देश में
  rationale: मूल में ‘देश/भूमि’ स्पष्ट रूप से उपस्थित है; ‘मिस्र देश’ उसे स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: एकवचन पुल्लिंग संदर्भ का सामान्य कानूनी प्रयोग
  choice: ‘किसी परदेशी’ और उसके अनुरूप ‘उसे’ को एकवचन में रखा गया।
  alternative: ‘परदेशियों ... उन्हें’ जैसे बहुवचन रूप का प्रयोग।
  rationale: इब्रानी में גֵר एकवचन है और उसके साथ 3ms प्रत्यय है। कानूनी शैली में यह सामान्य रूप से किसी भी ऐसे व्यक्ति पर लागू होता है; स्रोत की संख्या और व्याकरणिक रूप को बनाए रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘तुम ... न करना’ कानूनी निषेध का सीधा स्वर बनाए रखता है; ‘परदेशी’ दोनों खंडों में दोहराकर मूल का शब्द-संबंध सुरक्षित किया गया है।
