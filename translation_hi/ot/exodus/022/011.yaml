  footnotes:
  - marker: a
    text: इब्रानी में एक ही क्रिया के विशेष संयोजन से चोरी होने की बात पर बल दिया गया है; इसका भाव है, “यदि उसे निश्चय ही चुरा लिया जाए” या “यदि वह उसकी अभिरक्षा में रहते हुए सचमुच चोरी हो जाए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: पर यदि
  rationale: यह नियमों की शृंखला में पिछले मामले से भिन्न स्थिति प्रस्तुत करता है; इसलिए केवल ‘यदि’ की अपेक्षा ‘पर यदि’ प्रसंग के विरोधात्मक भाव को अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: גָּנֹב יִגָּנֵב
  choice: उसे सचमुच ... चुरा लिया जाए
  rationale: धातु के infinitive absolute और उसी धातु के finite passive रूप का मेल चोरी होने की बात पर बल देता है। ‘सचमुच’ उस बल को सहज आधुनिक हिन्दी में व्यक्त करता है; कर्म पिछले प्रसंग से समझा जाता है।
- source_word: מֵעִמּוֹ
  choice: उसके पास से
  rationale: शाब्दिक अर्थ ‘उसके साथ/पास से’ है। कानूनी प्रसंग में आशय उस व्यक्ति की अभिरक्षा में रहते हुए वस्तु के चोरी होने से है; ‘उसके पास से’ मूल अभिव्यक्ति के निकट और स्वाभाविक है।
- source_word: יְשַׁלֵּם
  choice: भरपाई करे
  rationale: कानूनी प्रसंग में पिएल रूप का अर्थ हानि की क्षतिपूर्ति या प्रतिपूर्ति करना है। ‘भरपाई करे’ सामान्य पाठक के लिए स्पष्ट और विधिक भाव के अनुकूल है।
- source_word: לִבְעָלָיו
  choice: उसके मालिक को
  rationale: בעל यहाँ सौंपी गई वस्तु या पशु के स्वामी को दर्शाता है। हिन्दी में एकवचन ‘मालिक’ प्रसंगानुकूल और स्वाभाविक है।
