base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/016.yaml
  text: If her father absolutely refuses to give her to him[b][a], he shall weigh out silver equal to the bride-price for virgins.
translation:
  language: hi
  text: यदि उसका पिता उसे उस पुरुष को देने से साफ़ इनकार कर दे,[a] तो वह पुरुष कुँवारियों के लिए निर्धारित वधू-मूल्य के बराबर चाँदी तौलकर दे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “विवाह में उसे उस पुरुष को देने से।” इब्रानी मुहावरा “उसे उस पुरुष को देना” विवाह के लिए पिता की सहमति को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ, “चाँदी तौले।” उस समय भुगतान सिक्कों के बजाय धातु को तौलकर किया जाता था।
    reason: cultural_note
lexical_decisions:
- source_word: אִם
  choice: यदि
  rationale: यह शर्तसूचक अव्यय इस कानूनी परिस्थिति की शर्त प्रस्तुत करता है।
- source_word: מָאֵן יְמָאֵן
  choice: साफ़ इनकार कर दे
  rationale: धातु के साथ infinitive absolute इनकार पर विशेष बल देता है; आधुनिक हिन्दी में ‘साफ़ इनकार’ इस बल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אָבִיהָ
  choice: उसका पिता
  rationale: तीसरे पुरुष स्त्रीलिंग एकवचन प्रत्यय को हिन्दी में स्पष्ट स्वत्वसूचक रूप से व्यक्त किया गया है।
- source_word: לְתִתָּהּ לוֹ
  choice: उसे उस पुरुष को देने
  rationale: इब्रानी का शाब्दिक मुहावरा सुरक्षित रखा गया है; प्रसंग में इसका अर्थ विवाह के लिए देना है, जिसे पादटिप्पणी स्पष्ट करती है। ‘उस पुरुष’ से हिन्दी में पुरुषवाचक सर्वनाम का संदर्भ साफ़ रहता है।
- source_word: כֶּסֶף
  choice: चाँदी
  rationale: मूल शब्द ठोस रूप से चाँदी को दर्शाता है, जो यहाँ भुगतान के साधन के रूप में प्रयुक्त है।
- source_word: יִשְׁקֹל
  choice: तौलकर दे
  rationale: क्रिया का मूल अर्थ ‘तौलना’ है और यह सिक्कों के बजाय भार से चाँदी दिए जाने की प्रथा दर्शाती है; ‘दे’ जोड़ने से कानूनी भुगतान का आशय स्वाभाविक हिन्दी में स्पष्ट होता है।
- source_word: כְּמֹהַר
  choice: वधू-मूल्य के बराबर
  rationale: מֹהַר विवाह के संबंध में वधू के परिवार को दिया जाने वाला निर्धारित भुगतान है; ‘वधू-मूल्य’ इसका संक्षिप्त और स्पष्ट हिन्दी समतुल्य है।
- source_word: הַבְּתוּלֹת
  choice: कुँवारियों के
  rationale: संज्ञा का बहुवचन यहाँ एक सामान्य वर्ग और उसके लिए प्रचलित दर की ओर संकेत करता है।
theological_decisions:
- issue: לְתִתָּהּ לוֹ में विवाह का आशय
  choice: मुख्य पाठ में शाब्दिक मुहावरा ‘उसे उस पुरुष को देने’ रखा गया और विवाह-संबंधी अर्थ पादटिप्पणी में बताया गया।
  alternative: ‘विवाह में उसे उस पुरुष को देने’
  rationale: इससे मूल की संक्षिप्त अभिव्यक्ति और उसकी निहित कानूनी-विवाहिक भावना दोनों सुरक्षित रहते हैं, बिना पाठ में अतिरिक्त स्पष्टता आरोपित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण कानूनी शैली रखी गई है। ‘साफ़ इनकार’, ‘वधू-मूल्य’ और ‘तौलकर दे’ सामान्य पाठक के लिए समझने योग्य हैं तथा इब्रानी की बलाघातपूर्ण और सांस्कृतिक विशेषताओं को सुरक्षित रखते हैं।
