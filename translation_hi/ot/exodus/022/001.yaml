source:
  edition: WLC
  text: אִם בַּ/מַּחְתֶּ֛רֶת יִמָּצֵ֥א הַ/גַּנָּ֖ב וְ/הֻכָּ֣ה וָ/מֵ֑ת אֵ֥ין ל֖/וֹ דָּמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/001.yaml
  text: If the thief is found breaking in and is struck so that he dies[b][a], there is no bloodguilt for him.
translation:
  language: hi
  text: यदि चोर सेंध लगाते समय पाया जाए[a] और उसे मारा जाए और वह मर जाए, तो उसे मारनेवाले पर रक्तपात का दोष नहीं होगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक शाब्दिक रूप से, ‘सेंध लगाने में पाया जाए।’ इब्रानी शब्द सेंध लगाकर—संभवतः दीवार खोदकर—या चोरी-छिपे भीतर घुसने के द्वारा किए गए प्रवेश का संकेत देता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात इस मामले में चोर को मारनेवाले पर रक्तपात की कानूनी जवाबदेही नहीं होगी।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּמַּחְתֶּרֶת
  choice: सेंध लगाते हुए
  rationale: यह संज्ञा सेंध लगाकर या चोरी-छिपे भीतर घुसने की घटना को दर्शाती है। आधुनिक हिन्दी में ‘सेंध लगाते हुए’ कानूनी परिस्थिति को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: יִמָּצֵא
  choice: पकड़ा जाए
  rationale: निफ़अल रूप यहाँ कानूनी शर्त में ‘पाया जाए/पकड़ा जाए’ का अर्थ देता है। चोर के अपराध करते समय मिलने के लिए ‘पकड़ा जाए’ स्वाभाविक हिन्दी है।
- source_word: הַגַּנָּב
  choice: चोर
  rationale: यह सामान्यतः ‘चोर’ का शब्द है; प्रसंग सेंधमारी का है, पर अधिक तकनीकी शब्द आवश्यक नहीं।
- source_word: וְהֻכָּה
  choice: उसे ऐसा मारा जाए
  rationale: नכה का कर्मवाच्य रूप प्रहार किए जाने को बताता है। ‘ऐसा मारा जाए’ अगले परिणामसूचक खंड से सहजता से जुड़ता है और बार-बार पीटने का अनावश्यक संकेत नहीं देता।
- source_word: וָמֵת
  choice: कि वह मर जाए
  rationale: वाव से जुड़ा यह रूप प्रहार के परिणामस्वरूप मृत्यु को व्यक्त करता है; हिन्दी में ‘कि वह मर जाए’ उस परिणाम को स्पष्ट करता है।
- source_word: אֵין לוֹ דָּמִים
  choice: मारनेवाले पर खून का दोष नहीं होगा
  rationale: דָּמִים यहाँ वास्तविक रक्त नहीं, बल्कि रक्तपात की कानूनी जवाबदेही का मुहावरा है। सर्वनाम का संदर्भ हिन्दी में अस्पष्ट हो सकता था, इसलिए प्रसंगानुसार ‘मारनेवाले’ स्पष्ट किया गया है।
theological_decisions:
- issue: सेंधमारी के समय हुई मृत्यु से संबंधित कानूनी मुहावरा
  choice: इसे ‘खून का दोष नहीं होगा’ के रूप में प्रस्तुत किया गया है।
  alternative: ‘वह हत्या का दोषी नहीं होगा।’
  rationale: इब्रानी पाठ इस परिस्थिति में रक्तपात की कानूनी जवाबदेही न होने का निर्णय देता है; वह हत्या के विषय में कोई व्यापक नैतिक अनुमोदन नहीं देता। ‘खून का दोष’ वाचा-संबंधी कानूनी अर्थ को बनाए रखता है और आधुनिक दंड-विधि की संकरी श्रेणी को पाठ में नहीं डालता।
translation_notes:
  register: आधुनिक, स्पष्ट और गरिमापूर्ण मानक हिन्दी। कानूनी स्वर बनाए रखते हुए ‘सेंध लगाते हुए’ और ‘खून का दोष’ जैसे सामान्यतः समझ आने वाले पद चुने गए हैं।
