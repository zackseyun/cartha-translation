source:
  edition: WLC
  text: עַֽל כָּל דְּבַר פֶּ֡שַׁע עַל שׁ֡וֹר עַל חֲ֠מוֹר עַל שֶׂ֨ה עַל שַׂלְמָ֜ה עַל כָּל אֲבֵדָ֗ה אֲשֶׁ֤ר יֹאמַר֙ כִּי ה֣וּא זֶ֔ה עַ֚ד הָֽ/אֱלֹהִ֔ים יָבֹ֖א דְּבַר שְׁנֵי/הֶ֑ם אֲשֶׁ֤ר יַרְשִׁיעֻ/ן֙ אֱלֹהִ֔ים יְשַׁלֵּ֥ם שְׁנַ֖יִם לְ/רֵעֵֽ/הוּ־־־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/008.yaml
  text: For every case of wrongdoing involving an ox[a], a donkey, a sheep, a garment, or any lost thing about which someone says, ‘This is it,’ the case of both parties shall come before God[b]. The one whom God declares guilty shall pay double to his neighbor.
translation:
  language: hi
  text: हर अपराध के मामले में—चाहे वह बैल, गधे, भेड़[a], वस्त्र या किसी भी खोई हुई वस्तु से जुड़ा हो, जिसके विषय में कोई कहे, ‘यह वही है’—दोनों पक्षों का मामला परमेश्वर[b] के सामने आएगा। जिसे परमेश्वर दोषी ठहराए, वह अपने पड़ोसी को दुगुना चुकाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी שֶׂה छोटे पालतू पशु के लिए व्यापक शब्द है और भेड़ या बकरी, दोनों को दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “न्यायियों के सामने” अथवा “न्यायालय के सामने”; इस कानूनी संदर्भ में इब्रानी אֱלֹהִים सीधे परमेश्वर को या उनके अधिकार के अधीन कार्य करने वाले मानवीय न्यायियों को दर्शा सकता है। यही शब्द अगली बार भी आया है।
    reason: alternative_reading
lexical_decisions:
- source_word: דְּבַר פֶּשַׁע
  choice: अपराध के मामले
  rationale: दָּבָר यहाँ कानूनी ‘मामला’ है और פֶּשַׁע गलत काम या अपराध को दर्शाता है; यह अनुवाद अपराध की सटीक प्रकृति को अनावश्यक रूप से सीमित नहीं करता।
- source_word: שׁוֹר
  choice: बैल
  rationale: संपत्ति-संबंधी कानूनी सूची में यह सामान्य और स्वाभाविक हिन्दी पर्याय है।
- source_word: חֲמוֹר
  choice: गधा
  rationale: आधुनिक हिन्दी में स्पष्ट और प्रचलित नाम।
- source_word: שֶׂה
  choice: भेड़
  rationale: सूची में सहज प्रतिनिधि अनुवाद; इब्रानी शब्द भेड़ या बकरी, दोनों प्रकार के छोटे पालतू पशु को दर्शा सकता है, इसलिए व्यापक अर्थ पाद-टिप्पणी में रखा गया है।
- source_word: שַׂלְמָה
  choice: वस्त्र
  rationale: यह किसी सामान्य पहनावे को दर्शाता है और ‘चादर’ जैसे अधिक संकुचित अर्थ से बचता है।
- source_word: אֲבֵדָה
  choice: खोई हुई वस्तु
  rationale: यह खोई हुई संपत्ति के व्यापक अर्थ को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֲשֶׁר יֹאמַר כִּי הוּא זֶה
  choice: जिसके विषय में कोई कहे, ‘यह वही है’
  rationale: यह विवादित वस्तु की पहचान या उस पर दावे को दर्शाने वाली इब्रानी संकेतात्मक अभिव्यक्ति को बिना अतिरिक्त व्याख्या जोड़े बनाए रखता है।
- source_word: הָאֱלֹהִים / אֱלֹהִים
  choice: परमेश्वर
  rationale: शब्द का सीधा अर्थ ‘परमेश्वर’ है। कानूनी संदर्भ में ‘न्यायियों’ या ‘न्यायालय’ का अर्थ भी संभव है, जिसे पाद-टिप्पणी में सुरक्षित रखा गया है।
- source_word: יָבֹא דְּבַר שְׁנֵיהֶם
  choice: दोनों पक्षों का मामला ... सामने आएगा
  rationale: द्विवचन संबंध को स्वाभाविक कानूनी हिन्दी में ‘दोनों पक्षों’ के रूप में व्यक्त किया गया है।
- source_word: יַרְשִׁיעֻן
  choice: दोषी ठहराए
  rationale: רשע के हिफ़ील रूप का न्यायिक अर्थ किसी को दोषी घोषित करना है।
- source_word: יְשַׁלֵּם שְׁנַיִם
  choice: दुगुना चुकाए
  rationale: यह दुगुनी प्रतिपूर्ति के इब्रानी मुहावरे को संक्षिप्त और स्पष्ट रूप से व्यक्त करता है।
- source_word: לְרֵעֵהוּ
  choice: अपने पड़ोसी को
  rationale: רֵעַ का मानक अर्थ पड़ोसी, साथी या सहचर है; कानूनी संदर्भ से स्पष्ट है कि यहाँ विवाद का दूसरा पक्ष अभिप्रेत है।
theological_decisions:
- issue: इस कानूनी संदर्भ में אֱלֹהִים का अर्थ
  choice: परमेश्वर
  alternative: न्यायी / न्यायालय
  rationale: इब्रानी रूप का प्रत्यक्ष अर्थ ‘परमेश्वर’ है, पर वाचा की कानूनी भाषा में यह परमेश्वर के अधिकार के अधीन कार्य करने वाले न्यायियों को भी सूचित कर सकता है। मुख्य पाठ मूल शब्द का सीधा अर्थ रखता है और वैकल्पिक न्यायिक अर्थ को पाद-टिप्पणी में देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। कानूनी प्रवाह स्पष्ट करने के लिए मुख्य सूची को डैशों के बीच रखा गया है। ‘परमेश्वर’ और ‘न्यायी/न्यायालय’ के बीच वास्तविक पाठगत अस्पष्टता को मुख्य पाठ और पाद-टिप्पणी के माध्यम से सुरक्षित रखा गया है।
