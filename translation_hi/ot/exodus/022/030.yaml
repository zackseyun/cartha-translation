  yaml_path: translation/ot/exodus/022/030.yaml
  text: And you shall be holy men to me[a]. You shall not eat flesh torn in the field[b]; you shall throw it to the dogs.
translation:
  language: hi
  text: और तुम मेरे लिए पवित्र पुरुष[a] होगे। खुले मैदान में फाड़ा गया मांस[b] मत खाना; उसे कुत्तों को फेंक देना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “पवित्रता के पुरुष।” इब्रानी में पुल्लिंग बहुवचन स्पष्ट है, यद्यपि संबोधन वाचा-समुदाय का प्रतिनिधित्व कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात ऐसा मांस जिसे फाड़ा गया हो, सम्भवतः किसी जंगली पशु द्वारा। इब्रानी में फाड़ने वाला स्पष्ट नहीं किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי קֹדֶשׁ
  choice: पवित्र पुरुष
  rationale: इब्रानी रचना का शाब्दिक भाव ‘पवित्रता के पुरुष’ है। ‘पवित्र पुरुष’ आधुनिक हिन्दी में स्वाभाविक रहते हुए स्रोत के स्पष्ट पुल्लिंग बहुवचन को बनाए रखता है।
- source_word: תִּהְיוּן לִי
  choice: मेरे लिए ... ठहरोगे
  rationale: यह वाक्यांश परमेश्वर से संबंध और वाचा के अंतर्गत अपेक्षित स्थिति—दोनों को व्यक्त करता है। ‘ठहरोगे’ केवल भविष्य नहीं, विधिक दायित्व का भाव भी देता है।
- source_word: בָשָׂר
  choice: मांस
  rationale: इस पशु-आहार संबंधी नियम में ‘मांस’ सहज और सटीक हिन्दी है; ‘देह’ यहाँ अनावश्यक रूप से व्यापक या अस्वाभाविक होती।
- source_word: בַּשָּׂדֶה
  choice: मैदान में
  rationale: स्थानसूचक वाक्यांश का सीधा और ठोस अनुवाद।
- source_word: טְרֵפָה
  choice: फाड़ा हुआ
  rationale: शब्द ऐसे मांस को सूचित करता है जिसे फाड़ा गया हो, सामान्यतः किसी जंगली पशु द्वारा; पर कर्ता स्रोत में स्पष्ट नहीं है, इसलिए मुख्य पाठ में नहीं जोड़ा गया।
- source_word: לֹא תֹאכֵלוּ
  choice: मत खाना
  rationale: निषेध को आधुनिक, स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לַכֶּלֶב
  choice: कुत्तों के आगे
  rationale: इब्रानी में संज्ञा एकवचन है, पर उसका प्रयोग जातिवाचक है। हिन्दी में ‘कुत्तों के आगे’ इस सामान्य वितरणात्मक अर्थ को सहजता से व्यक्त करता है।
- source_word: תַּשְׁלִכוּן אֹתוֹ
  choice: उसे ... फेंक देना
  rationale: ‘फेंक देना’ आधुनिक हिन्दी में क्रिया की स्पष्टता और निपटान के प्रसंग को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: वाचा की व्यवस्था में पवित्रता की भाषा
  choice: मेरे लिए पवित्र पुरुष ठहरोगे
  alternative: मेरे लिए पवित्र लोग ठहरोगे
  rationale: ‘पवित्र’ קֹדֶשׁ के धार्मिक और नैतिक भार को बनाए रखता है, जबकि ‘मेरे लिए’ परमेश्वर से संबंध और समर्पण को व्यक्त करता है। स्रोत का पुल्लिंग रूप अस्पष्ट नहीं है, इसलिए उसे मुख्य पाठ में रखा गया है; साथ ही पादटिप्पणी उसके सामुदायिक संदर्भ को बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और विधिक प्रसंग के अनुरूप रखी गई है। ‘मत खाना’ और ‘फेंक देना’ सामान्य पाठक के लिए सहज हैं; ‘पवित्र पुरुष’ स्रोत की स्पष्ट व्याकरणिक आकृति को सुरक्षित रखता है।
