source:
  edition: WLC
  text: אִם כֶּ֣סֶף תַּלְוֶ֣ה אֶת עַמִּ֗/י אֶת הֶֽ/עָנִי֙ עִמָּ֔/ךְ לֹא תִהְיֶ֥ה ל֖/וֹ כְּ/נֹשֶׁ֑ה לֹֽא תְשִׂימ֥וּ/ן עָלָ֖י/ו נֶֽשֶׁךְ־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/024.yaml
  text: If you lend money to my people[a], to the poor among you, you shall not be like a creditor to him[c][b]; you shall not impose interest on him.
translation:
  language: hi
  text: यदि तुम मेरी प्रजा में से तुम्हारे बीच के किसी गरीब को पैसा उधार दो,[a][b] तो उसके साथ लेनदार जैसा व्यवहार न करना; उस पर ब्याज न लगाना।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब तुम मेरी प्रजा में से तुम्हारे बीच के किसी गरीब को पैसा उधार दो।” इब्रानी में विधिक मामलों के लिए प्रचलित शर्तसूचक रूप है।
    reason: alternative_reading
  - marker: b
    text: इब्रानी में “चाँदी”; यहाँ अर्थ पैसा है।
    reason: lexical_alternative
  - marker: c
    text: या, “तुम उससे ब्याज न लेना।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: यदि
  rationale: यह शर्तसूचक अव्यय है; विधान-संबंधी प्रसंग में इसका अर्थ ‘यदि/जब’ हो सकता है। मुख्य पाठ में ‘यदि’ मूल रूप को बनाए रखता है।
- source_word: כֶּסֶף
  choice: पैसा
  rationale: शाब्दिक अर्थ ‘चाँदी’ है, पर यहाँ आर्थिक और कानूनी प्रसंग में इसका आशय धन या पैसा है।
- source_word: תַּלְוֶה
  choice: उधार दो
  rationale: हिफ़ील रूप यहाँ किसी को ऋण देने का अर्थ रखता है; आधुनिक हिन्दी में ‘पैसा उधार देना’ स्वाभाविक है।
- source_word: עַמִּי
  choice: मेरी प्रजा
  rationale: प्रथम पुरुष एकवचन प्रत्यय सहित अभिव्यक्ति का सीधा अर्थ ‘मेरी प्रजा’ है; पद में ‘इस्राएल’ जोड़ना अनावश्यक होगा।
- source_word: הֶעָנִי
  choice: किसी गरीब को
  rationale: यह निर्धन व्यक्ति के लिए प्रयुक्त विशेषण-संज्ञा है। हिन्दी में ‘किसी गरीब’ एकवचन व्यक्ति को स्वाभाविक रूप से व्यक्त करता है और अनावश्यक रूप से ‘पुरुष’ नहीं जोड़ता।
- source_word: עִמָּךְ
  choice: अपने बीच रहनेवाले
  rationale: शाब्दिक अर्थ ‘तुम्हारे साथ’ है; यहाँ समुदाय के भीतर उपस्थित व्यक्ति का भाव है। स्त्रीलिंग एकवचन संबोधन हिन्दी में अलग रूप से दिखाना स्वाभाविक नहीं है।
- source_word: כְּנֹשֶׁה
  choice: कर्ज़ वसूलनेवाले जैसा
  rationale: यह ऋणदाता, विशेषकर भुगतान के लिए दबाव डालनेवाले व्यक्ति, को सूचित करता है। केवल ‘लेनदार’ की अपेक्षा यह प्रसंगगत बल स्पष्ट करता है।
- source_word: תְשִׂימוּן ... נֶשֶׁךְ
  choice: ब्याज न लगाना
  rationale: ‘उस पर ब्याज रखना’ के इब्रानी मुहावरे का स्वाभाविक हिन्दी आर्थिक समतुल्य ‘ब्याज लगाना’ है।
- source_word: נֶשֶׁךְ
  choice: ब्याज
  rationale: यह ऋण पर लिए जानेवाले ब्याज को सूचित करता है; ‘सूदखोरी’ केवल अत्यधिक या अनैतिक ब्याज का संकुचित भाव दे सकती है।
theological_decisions:
- issue: विधान में אִם का बल
  choice: यदि तुम ... उधार दो
  alternative: जब तुम ... उधार दो
  rationale: इब्रानी विधिक शैली में शर्तसूचक रूप किसी सामने आनेवाले मामले को प्रस्तुत कर सकता है। ‘यदि’ मूल की वास्तविक शर्तात्मक अस्पष्टता बनाए रखता है; ‘जब’ को पादटिप्पणी में दिया गया है।
- issue: הֶעָנִי का लिंग और व्यक्ति-संदर्भ
  choice: किसी गरीब को
  alternative: गरीब पुरुष को
  rationale: इब्रानी रूप व्याकरणतः पुल्लिंग एकवचन है, पर संज्ञीकृत विशेषण में हिन्दी का ‘गरीब’ बिना ‘पुरुष’ जोड़े एक व्यक्ति का सटीक और स्वाभाविक उल्लेख करता है।
- issue: כְּנֹשֶׁה और ब्याज-निषेध का संबंध
  choice: दो अलग किंतु संबद्ध निषेध
  alternative: पहले खंड को केवल ‘उससे ब्याज मत लेना’ के अर्थ में समेटना
  rationale: मूल पाठ पहले ऋणदाता/वसूली करनेवाले जैसा न होने और फिर ब्याज न लगाने की समानांतर आज्ञाएँ देता है। अनुवाद दोनों को अलग रखता है, जबकि पादटिप्पणी संकुचित वैकल्पिक अर्थ बताती है।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पैसा उधार दो,’ ‘कर्ज़ वसूलनेवाले,’ और ‘ब्याज लगाना’ वर्तमान मानक हिन्दी के स्पष्ट आर्थिक पद हैं। वाक्य में मूल के एकवचन गरीब व्यक्ति और दो समानांतर निषेध सुरक्षित हैं।
