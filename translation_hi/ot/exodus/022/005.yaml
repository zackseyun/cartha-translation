  text: כִּֽי תֵצֵ֨א אֵ֜שׁ וּ/מָצְאָ֤ה קֹצִים֙ וְ/נֶאֱכַ֣ל גָּדִ֔ישׁ א֥וֹ הַ/קָּמָ֖ה א֣וֹ הַ/שָּׂדֶ֑ה שַׁלֵּ֣ם יְשַׁלֵּ֔ם הַ/מַּבְעִ֖ר אֶת הַ/בְּעֵרָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/005.yaml
  text: If a fire breaks out and catches in thorns[a], so that stacked grain or standing grain or the field is consumed[b], the one who started the fire must surely make restitution.
translation:
  language: hi
  text: यदि आग भड़क उठे और काँटों तक पहुँच जाए,[a] जिससे अनाज का ढेर, खड़ी फसल या खेत जलकर नष्ट हो जाए, तो जिसने आग जलाई, वह भरपाई अवश्य करे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “और काँटों को पा ले”; अर्थात आग काँटों तक पहुँच जाए और उन्हें पकड़ ले।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में क्रिया की पुनरुक्त रचना भरपाई करने के दायित्व पर विशेष बल देती है।
    reason: source_emphasis
lexical_decisions:
- source_word: כִּי
  choice: यदि
  rationale: यह शर्त के रूप में प्रस्तुत विधिक मामले का आरम्भ करता है; आधुनिक हिन्दी में ‘यदि’ स्पष्ट और स्वाभाविक है।
- source_word: תֵצֵא אֵשׁ
  choice: आग भड़क उठे
  rationale: शाब्दिक अर्थ ‘आग निकल जाए’ है, पर प्रसंग में आग के फैल निकलने या अनियंत्रित होने का भाव है; ‘भड़क उठे’ स्वाभाविक हिन्दी है।
- source_word: וּמָצְאָה קֹצִים
  choice: काँटेदार झाड़ियों में जा लगे
  rationale: इब्रानी में शाब्दिक रूप से ‘काँटों को पा ले’ है। चुना हुआ अनुवाद आग के सूखी काँटेदार वनस्पति तक पहुँचने और उसे पकड़ लेने का चित्र बनाए रखता है।
- source_word: גָּדִישׁ
  choice: अनाज का ढेर
  rationale: यह काटे और इकट्ठे किए गए अनाज के ढेर को दर्शाता है तथा खड़ी फसल के साथ मूल विरोध स्पष्ट रखता है।
- source_word: הַקָּמָה
  choice: खड़ी फसल
  rationale: इससे खेत में अभी न काटी गई खड़ी उपज अभिप्रेत है; आधुनिक हिन्दी में यह ‘खड़े अनाज’ से अधिक सहज है।
- source_word: הַשָּׂדֶה
  choice: खेत
  rationale: सीधा और सामान्य हिन्दी समतुल्य, जो प्रभावित कृषि-भूमि को सूचित करता है।
- source_word: וְנֶאֱכַל
  choice: जलकर नष्ट हो जाए
  rationale: अग्नि के विषय में אכל के निफ़अल रूप का अर्थ ‘भस्म/नष्ट हो जाना’ है; यह हिन्दी में स्पष्ट रूप से परिणाम बताता है।
- source_word: שַׁלֵּם יְשַׁלֵּם
  choice: भरपाई अवश्य करे
  rationale: अनन्त रूप और सीमित क्रिया की इब्रानी रचना दायित्व को बल देती है; ‘अवश्य’ उस ज़ोर को व्यक्त करता है।
- source_word: הַמַּבְעִר אֶת הַבְּעֵרָה
  choice: जिसने आग लगाई हो
  rationale: कारणवाचक कृदन्त आग आरम्भ करने वाले उत्तरदायी व्यक्ति की ओर संकेत करता है; यह सहज और स्पष्ट हिन्दी है।
theological_decisions:
- issue: क्षतिपूर्ति के दायित्व का बल
  choice: भरपाई अवश्य करे
  alternative: भरपाई करे
  rationale: मूल के שַׁלֵּם יְשַׁלֵּם में दायित्व पर विशेष बल है; इसे हटाना विधिक कथन की तीव्रता घटा देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। कृषि-संबंधी भेद को ‘अनाज का ढेर’ और ‘खड़ी फसल’ से स्पष्ट किया गया है; विधिक बल को ‘अवश्य’ द्वारा सुरक्षित रखा गया है।
