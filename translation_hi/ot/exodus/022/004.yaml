base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/004.yaml
  text: If a man causes a field or vineyard to be grazed over[a], and lets his animal loose so that it grazes in another man's field[b], he shall make restitution from the best of his own field and the best of his own vineyard.
translation:
  language: hi
  text: यदि कोई व्यक्ति किसी खेत या दाख की बारी को अपने पशु से चरवा दे[a], और अपने पशु को खुला छोड़ दे और वह किसी दूसरे के खेत[b] में चर जाए, तो वह अपने खेत की सबसे अच्छी उपज और अपनी दाख की बारी की सबसे अच्छी उपज से भरपाई करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “किसी खेत या दाख की बारी को जला दे।” इब्रानी क्रिया בער कुछ प्रसंगों में जलाने के अर्थ में आती है, पर यहाँ तुरंत पशु को छोड़ने का उल्लेख चरवाने या पशु द्वारा खा लिए जाने के अर्थ का प्रबल समर्थन करता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “दूसरे खेत” है; विधिक अर्थ स्पष्ट करने के लिए हिन्दी में “किसी दूसरे के खेत” कहा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: यदि
  rationale: यह विधिक प्रसंग में किसी संभावित मामले की शर्त प्रस्तुत करता है; आधुनिक हिन्दी में ‘यदि’ स्वाभाविक और सटीक है।
- source_word: יַבְעֶר
  choice: चरवा दे
  rationale: हिफ़ील रूप का कारक भाव बनाए रखा गया है। अगले वाक्यांश में पशु को छोड़ने और उसके दूसरे खेत में चरने का उल्लेख इस प्रसंग में चराने/चरवा देने के अर्थ का समर्थन करता है।
- source_word: שָׂדֶה אוֹ כֶרֶם
  choice: किसी खेत या दाख की बारी
  rationale: दोनों कृषि-संज्ञाओं और उनके एकवचन विधिक रूप को स्पष्ट, प्रचलित हिन्दी में रखा गया है।
- source_word: וְשִׁלַּח אֶת־בְּעִירֹה
  choice: और अपने पशु को खुला छोड़ दे
  rationale: שִׁלַּח का छोड़ने या स्वतंत्र जाने देने का भाव और בְּעִירֹה का सामान्य एकवचन ‘उसका पशु’ दोनों स्वाभाविक हिन्दी में व्यक्त होते हैं।
- source_word: וּבִעֵר בִּשְׂדֵה אַחֵר
  choice: जिससे वह किसी दूसरे के खेत में चरने लगे
  rationale: दोहराया गया בער यहाँ पशु द्वारा चरने का भाव देता है। उद्देश्यसूचक ‘जिससे’ हिन्दी में घटनाक्रम और क्षति का संबंध स्पष्ट करता है।
- source_word: אַחֵר
  choice: किसी दूसरे के
  rationale: इब्रानी में शाब्दिक अर्थ ‘दूसरा’ है; विधिक संदर्भ में खेत के किसी अन्य स्वामी का होना निहित है। हिन्दी में संबंधकारक जोड़ना आवश्यक और स्वाभाविक है।
- source_word: מֵיטַב שָׂדֵהוּ וּמֵיטַב כַּרְמוֹ
  choice: अपने खेत की सबसे अच्छी उपज और अपनी दाख की बारी की सबसे अच्छी उपज
  rationale: מֵיטַב सबसे अच्छे या उत्तम अंश को दर्शाता है। क्षतिपूर्ति के कृषि-संदर्भ में ‘उपज’ अर्थ को स्वाभाविक बनाती है, जबकि ‘अपने’ से भुगतान का स्रोत स्पष्ट होता है।
- source_word: יְשַׁלֵּם
  choice: देकर भरपाई करे
  rationale: पिएल रूप विधिक क्षतिपूर्ति या प्रतिपूर्ति का भाव रखता है; ‘भरपाई करे’ आधुनिक हिन्दी में इसे साफ़ व्यक्त करता है।
