- source_word: מֵעִם רֵעֵהוּ
  choice: अपने पड़ोसी से
  rationale: רֵעַ मित्र, साथी या पड़ोसी हो सकता है; सामुदायिक कानून के संदर्भ में ‘पड़ोसी’ सबसे उपयुक्त है।
- source_word: וְנִשְׁבַּר
  choice: वह टूट जाए
  rationale: यह क्रिया मूलतः ‘टूट जाना’ कहती है, पर उधार लिए पशु के घायल होने के लिए भी प्रयुक्त हो सकती है; मुख्य पाठ में मूल बिंब रखा गया और पादटिप्पणी में अर्थ-सीमा स्पष्ट की गई है।
- source_word: אוֹ מֵת
