base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/013.yaml
  text: And if a man borrows from his neighbor[a], and it is injured or dies, if its owner is not with it[b], he shall surely make restitution.
translation:
  language: hi
  text: और यदि कोई व्यक्ति अपने पड़ोसी से कुछ उधार ले, और वह टूट जाए[a] या मर जाए, और उसका मालिक उसके साथ मौजूद न हो, तो उधार लेनेवाला उसकी पूरी भरपाई अवश्य करे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शाब्दिक रूप से, “वह टूट जाए।” यह उधार ली हुई वस्तु के टूटने या उधार लिए पशु के घायल होने—दोनों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में, “वह निश्चय ही भुगतान करे”; अर्थात उसे पूरी भरपाई करनी होगी।
    reason: lexical_alternative
