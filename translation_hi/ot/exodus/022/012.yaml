  yaml_path: translation/ot/exodus/022/012.yaml
  text: But if it is torn by beasts[a], he shall bring it as evidence; he shall not make restitution for what was torn.
translation:
  language: hi
  text: परन्तु यदि उसे किसी पशु ने फाड़ दिया हो,[a] तो रखवाला उसे प्रमाण के रूप में प्रस्तुत करे; जो फाड़ा गया है उसकी भरपाई उसे नहीं करनी होगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यदि वह निश्चय ही फाड़ दिया गया हो, तो रखवाला जो फाड़ा गया है उसे प्रमाण के रूप में प्रस्तुत करे; उसकी भरपाई उसे नहीं करनी होगी।”
    reason: इब्रानी में क्रिया का दोहराव क्रिया के होने पर बल देता है। ‘किसी पशु ने’ प्रसंगानुकूल अर्थ है, जबकि वैकल्पिक रूप मूल की अधिक सामान्य अभिव्यक्ति बनाए रखता है।
lexical_decisions:
- source_word: אִם
  choice: परन्तु यदि
  rationale: यह कानूनी क्रम में एक विपरीत परिस्थिति प्रस्तुत करता है; इसलिए केवल ‘यदि’ के बजाय ‘परन्तु यदि’ प्रसंग के संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: טָרֹף יִטָּרֵף
  choice: किसी जंगली पशु द्वारा फाड़ डाला गया हो
  rationale: धातु טרף प्रायः किसी पशु द्वारा शिकार को फाड़े जाने का बोध कराती है। इन्फिनिटिव ऐब्सोल्यूट और सीमित क्रिया का संयोजन क्रिया को बल देता है, जिसे हिन्दी में ‘फाड़ डाला गया’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְבִאֵהוּ
  choice: वह उसे ... प्रस्तुत करे
  rationale: हिफ़ील रूप का अर्थ यहाँ लाना अथवा पेश करना है। ‘प्रस्तुत करे’ प्रमाण के कानूनी संदर्भ के अनुकूल है, जबकि ‘उसे’ फाड़े गए पशु या उसके अवशेषों की ओर संकेत करता है।
- source_word: עֵד
  choice: प्रमाण के रूप में
  rationale: शाब्दिक अर्थ ‘गवाह’ है, पर यहाँ प्रस्तुत किए गए अवशेषों का प्रमाणात्मक कार्य अभिप्रेत है; इसलिए आधुनिक हिन्दी में ‘प्रमाण के रूप में’ अधिक स्पष्ट और स्वाभाविक है।
- source_word: הַטְּרֵפָה
  choice: जो फाड़ा गया है
  rationale: यह अभिव्यक्ति मूल की संक्षिप्तता और सामान्यता बनाए रखती है तथा अनावश्यक रूप से ‘लोथ’ या ‘मरा हुआ पशु’ निर्दिष्ट नहीं करती।
- source_word: לֹא יְשַׁלֵּם
  choice: उसकी भरपाई उसे नहीं करनी होगी
  rationale: पिअल में שלם का कानूनी अर्थ क्षतिपूर्ति या भरपाई करना है। हिन्दी में ‘भरपाई’ इस आर्थिक-कानूनी आशय को सहजता से व्यक्त करती है।
