  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। कानूनी स्वर के लिए ‘प्रमाण के रूप में प्रस्तुत करे’ और ‘भरपाई’ चुने गए हैं। मुख्य पाठ में पशु-आक्रमण का संभावित आशय स्पष्ट किया गया है, जबकि पादटिप्पणी मूल की व्यापक शाब्दिक संभावना सुरक्षित रखती है।
