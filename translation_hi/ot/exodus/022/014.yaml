  text: אִם בְּעָלָ֥י/ו עִמּ֖/וֹ לֹ֣א יְשַׁלֵּ֑ם אִם שָׂכִ֣יר ה֔וּא בָּ֖א בִּ/שְׂכָרֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/014.yaml
  text: If its owner is with it[a], he shall not make restitution; if it is a hired thing, it came for its hire.
translation:
  language: hi
  text: यदि उसका मालिक उसके साथ हो, तो उधार लेने वाले को भरपाई नहीं करनी होगी। यदि वह किराए की वस्तु हो, तो उसकी भरपाई उसके किराए में शामिल है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी वाक्य बहुत संक्षिप्त है। इसका अनुवाद यह भी हो सकता है: “यदि वह मजदूरी पर रखा गया व्यक्ति हो, तो वह अपनी मजदूरी के लिए आया था।” निकटवर्ती प्रसंग उधार ली या किराए की संपत्ति की देयता का है; इसलिए मुख्य पाठ में इसे किराए की वस्तु के रूप में समझा गया है।'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּעָלָיו
  choice: उसका मालिक
  rationale: कानूनी प्रसंग में בַּעַל स्वामी या मालिक को दर्शाता है; प्रत्यय उस पशु या वस्तु की ओर लौटता है जिसका पिछले पद में उल्लेख है।
- source_word: עִמּוֹ
  choice: उसके साथ हो
  rationale: यह संक्षिप्त इब्रानी अभिव्यक्ति है। हिंदी में यह स्वाभाविक रूप से बताती है कि मालिक उधार दी गई वस्तु या पशु के साथ उपस्थित था।
- source_word: לֹא יְשַׁלֵּם
  choice: वह भरपाई न करे
  rationale: पिअल रूप कानूनी क्षतिपूर्ति या प्रतिपूर्ति करने का अर्थ रखता है; ‘भरपाई’ सामान्य पाठक के लिए स्पष्ट और विधिक प्रसंग के अनुकूल है।
- source_word: שָׂכִיר
  choice: किराए पर ली गई
  rationale: यद्यपि यह शब्द प्रायः ‘मजदूर’ के लिए आता है, निकटवर्ती संपत्ति-कानून के प्रसंग में इसे किराए पर ली गई वस्तु या पशु के लिए प्रयुक्त संक्षिप्त विशेषण माना गया है; हिंदी में स्त्रीलिंग अभिव्यक्ति अंतर्निहित ‘वस्तु’ के अनुरूप है।
- source_word: בָּא בִּשְׂכָרוֹ
  choice: उसका किराया ही उसकी भरपाई है
  rationale: शाब्दिक इब्रानी ‘वह अपने किराए में आया’ अत्यंत संक्षिप्त और हिंदी में अस्पष्ट होगा। यह रूप उस संभावित कानूनी आशय को स्वाभाविक ढंग से व्यक्त करता है कि हानि का जोखिम किराए में सम्मिलित है, जबकि पादटिप्पणी वैकल्पिक व्यक्तिगत पाठ को सुरक्षित रखती है।
theological_decisions:
- issue: שָׂכִיר और अंतिम उपवाक्य का कर्ता
  choice: मुख्य पाठ में किराए पर ली गई वस्तु या पशु के रूप में समझा गया
  alternative: ‘यदि वह किराए का मजदूर हो, तो वह अपनी मजदूरी के लिए आया था’
  rationale: इब्रानी वाक्य संक्षिप्त है और दोनों व्याख्याएँ संभव मानी गई हैं। उधार या किराए की संपत्ति की देयता वाले तात्कालिक प्रसंग के कारण मुख्य पाठ वस्तु-संबंधी अर्थ लेता है, पर वास्तविक अस्पष्टता पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिंदी। ‘भरपाई’ कानूनी अर्थ को सामान्य पाठक के लिए स्पष्ट रखती है। मुख्य पाठ में अंतर्निहित ‘वस्तु’ के अनुसार स्त्रीलिंग प्रयोग किया गया है और इब्रानी की वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है।
