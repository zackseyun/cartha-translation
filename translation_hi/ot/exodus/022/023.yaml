base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/023.yaml
  text: then my anger will burn[a], and I will kill you with the sword[b], and your wives will become widows and your sons fatherless.
translation:
  language: hi
  text: तब मेरा क्रोध भड़क उठेगा, और मैं तुम्हें तलवार से मार डालूँगा; तुम्हारी पत्नियाँ विधवा और तुम्हारे बेटे पितृहीन[a] हो जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अनाथ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחָרָה אַפִּי
  choice: तब मेरा क्रोध भड़क उठेगा
  rationale: חרה אף क्रोध के भड़कने का इब्रानी मुहावरा है। यह अनुवाद उसके रूपक और तीव्रता को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: וְהָרַגְתִּי אֶתְכֶם
  choice: मैं तुम्हें ... मार डालूँगा
  rationale: הרג का सामान्य अर्थ मारना या प्राण लेना है; ‘मार डालूँगा’ परिणाम को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है। बहुवचन ‘तुम्हें’ मूल के द्वितीय पुरुष बहुवचन के अनुरूप है।
- source_word: בֶּחָרֶב
  choice: तलवार से
  rationale: ב यहाँ साधन सूचित करता है। ‘तलवार से’ मूल की ठोस छवि और न्याय की हिंसक प्रकृति दोनों बनाए रखता है।
- source_word: וְהָיוּ נְשֵׁיכֶם אַלְמָנוֹת
  choice: तुम्हारी पत्नियाँ विधवा ... हो जाएँगी
  rationale: संबंधपरक प्रसंग में נָשִׁים का अर्थ ‘पत्नियाँ’ है, और היה यहाँ पूर्ववर्ती मृत्यु के फलस्वरूप उत्पन्न अवस्था दर्शाता है।
- source_word: וּבְנֵיכֶם
  choice: तुम्हारे बेटे
  rationale: בנים यहाँ पुल्लिंग बहुवचन है; मूल की लिंग-विशिष्ट अभिव्यक्ति को बनाए रखा गया है।
- source_word: יְתֹמִים
  choice: पितृहीन
  rationale: यह शब्द व्यापक रूप से ‘अनाथ’ भी हो सकता है, पर इस प्रसंग में पुरुषों की मृत्यु के कारण पिता से वंचित बेटों की सामाजिक दशा विशेष रूप से सामने आती है।
theological_decisions:
- issue: परमेश्वर के क्रोध की मानव-सदृश अभिव्यक्ति
  choice: मेरा क्रोध भड़क उठेगा
  alternative: मेरी नाक जल उठेगी; मेरा कोप प्रज्वलित होगा
  rationale: शाब्दिक शरीर-अंग ‘नाक’ हिन्दी में अर्थ को धुँधला कर देता। चुना गया रूप अर्थ स्पष्ट करता है, पर क्रोध के भड़कने का मूल रूपक नहीं मिटाता।
- issue: יְתֹמִים की सामाजिक और पारिवारिक व्याप्ति
  choice: पितृहीन
  alternative: अनाथ
  rationale: तत्काल प्रसंग में पतियों और पिताओं की मृत्यु का परिणाम बताया गया है, इसलिए ‘पितृहीन’ विशिष्ट संबंध को सुरक्षित रखता है। फिर भी शब्द की व्यापक सम्भावना को पाद-टिप्पणी में रखा गया है।
- issue: बेटों का लिंग-विशिष्ट उल्लेख
  choice: तुम्हारे बेटे
  alternative: तुम्हारे बच्चे
  rationale: मूल में בנים है। प्रसंग इसे लिंग-निरपेक्ष बनाने की माँग नहीं करता, इसलिए ‘बेटे’ रखा गया है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘भड़क उठेगा’ क्रोध के इब्रानी मुहावरे को स्वाभाविक हिन्दी में व्यक्त करता है; ‘मार डालूँगा’ बिना पुरातन शब्दावली के न्याय की कठोरता बनाए रखता है।
