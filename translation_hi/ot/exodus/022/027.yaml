  yaml_path: translation/ot/exodus/022/027.yaml
  text: You shall not revile God[a], nor curse a ruler among your people.
translation:
  language: hi
  text: तुम परमेश्वर[a] की निन्दा न करना, और न अपने लोगों के किसी शासक को शाप देना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “न्यायाधीशों”; कुछ संदर्भों में אֱלֹהִים मानवीय अधिकारियों के लिए भी प्रयुक्त हो सकता है, यद्यपि यहाँ समानांतर रचना में “परमेश्वर” अधिक उपयुक्त है।
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: इस विधिक संदर्भ और समानांतर दूसरे खंड में मानवीय शासक के उल्लेख को देखते हुए एकवचन अर्थ ‘परमेश्वर’ सबसे उपयुक्त है। ‘न्यायाधीशों’ का ऐतिहासिक वैकल्पिक पाठ पादटिप्पणी में रखा गया है।
- source_word: תְקַלֵּל
  choice: निन्दा करना
  rationale: पिएल रूप यहाँ अपमानजनक या तिरस्कारपूर्ण वाणी का भाव देता है। ‘निन्दा करना’ स्वाभाविक हिन्दी है और दूसरे खंड के अधिक प्रत्यक्ष ‘शाप देना’ से क्रियात्मक भेद बनाए रखता है।
- source_word: נָשִׂיא
  choice: शासक
  rationale: यह शब्द समुदाय में ऊँचे पद पर नियुक्त अगुवे या प्रधान को दर्शाता है। विधिक संदर्भ में ‘शासक’ आधुनिक, स्पष्ट और अधिकार-सूचक है।
- source_word: בְעַמְּךָ
  choice: अपने लोगों के किसी
  rationale: हिब्रू में समुदाय के भीतर के शासक का भाव है। हिन्दी में ‘अपने लोगों के किसी शासक’ इस संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: תָאֹר
  choice: शाप देना
  rationale: ארר का यह रूप स्पष्टतः शाप देने को व्यक्त करता है; ‘शाप देना’ इसका सीधा और प्रचलित हिन्दी समतुल्य है।
theological_decisions:
- issue: אֱלֹהִים का अभिप्रेत संदर्भ
  choice: परमेश्वर
  alternative: न्यायाधीशों; देवताओं
  rationale: तात्कालिक विधिक संदर्भ तथा ‘अपने लोगों के किसी शासक’ के साथ समानांतरता ‘परमेश्वर’ के अर्थ का समर्थन करती है। फिर भी אֱלֹהִים कुछ संदर्भों में मानवीय अधिकारियों या न्यायाधीशों के लिए प्रयुक्त हो सकता है, इसलिए उस वास्तविक अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्पष्ट, गरिमापूर्ण विधिक आदेशात्मक स्वर। ‘न करना’ और ‘न ... देना’ मूल के दोनों निषेधों को बनाए रखते हैं; ‘निन्दा’ तथा ‘शाप’ दोनों हिब्रू क्रियाओं का भेद सुरक्षित रखते हैं।
