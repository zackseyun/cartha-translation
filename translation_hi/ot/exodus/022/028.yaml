base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/028.yaml
  text: You shall not delay the fullness of your harvest and the outflow of your press[a]. You shall give to me the firstborn of your sons.
translation:
  language: hi
  text: अपनी भरपूर उपज और अपने कोल्हू से निकला रस[a] चढ़ाने में देर न करना। अपने पहलौठे पुत्र को मुझे देना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपनी पूरी उपज और अपना रस/दाखमधु।” इब्रानी शब्द संभवतः काटी हुई ठोस उपज और दबाकर निकाली गई तरल उपज को दर्शाते हैं। यह जोड़ी विशेष रूप से अन्न और दाखमधु भी हो सकती है, या अधिक सामान्य रूप से ठोस और तरल पैदावार।
    reason: lexical_alternative
lexical_decisions:
- source_word: מְלֵאָתְךָ
  choice: अपनी भरपूर उपज
  rationale: शब्द का मूल भाव ‘भरपूरी’ या ‘पूरी उपज’ है; इस विधिक-कृषि संदर्भ में इससे खेत की ठोस पैदावार अभिप्रेत है। यह हिंदी प्रयोग अर्थ को स्पष्ट रखते हुए मूल की संक्षिप्तता बचाता है।
- source_word: וְדִמְעֲךָ
  choice: अपने कोल्हू से निकला रस
  rationale: यद्यपि संज्ञा का सामान्य अर्थ ‘आँसू’ हो सकता है, यहाँ यह दबाकर निकाली गई तरल पैदावार को सूचित करती है। ‘रस’ के साथ ‘कोल्हू से निकला’ कहना कृषि-चित्र को बनाए रखता है और इसे केवल दाखमधु या तेल तक सीमित नहीं करता।
- source_word: לֹא תְאַחֵר
  choice: चढ़ाने में देर न करना
  rationale: पिएल रूप का अर्थ देर करना या टालना है। हिंदी में निषेध को स्वाभाविक बनाने के लिए पूरक क्रिया ‘चढ़ाने’ संदर्भ से स्पष्ट की गई है; आदेश का आशय देय उपज को विलंबित न करना है।
- source_word: בְּכוֹר בָּנֶיךָ
  choice: अपने पुत्रों में से पहलौठे को
  rationale: בְּכוֹר के लिए पारंपरिक और समझ में आने वाला विधिक शब्द ‘पहलौठा’ रखा गया है, और בָּנֶיךָ की पुरुषवाचक विशिष्टता ‘पुत्रों’ से सुरक्षित है।
- source_word: תִּתֶּן לִּי
  choice: मुझे देना
  rationale: यह सीधा विधिक आदेश है। हिंदी में ‘मुझे देना’ स्वाभाविक, गरिमापूर्ण और प्राप्तकर्ता पर मूल बल को बनाए रखता है।
theological_decisions:
- issue: מְלֵאָה और דִמְעָה की कृषि-संबंधी जोड़ी
  choice: ठोस उपज और कोल्हू से निकली तरल पैदावार—दोनों को समय पर चढ़ाने की आज्ञा
  alternative: इन्हें विशेष रूप से अन्न और दाखमधु मानना, अथवा बिना भेद किए सामान्य पहिली उपज कहना
  rationale: मूल शब्द संभवतः कटाई की उपज और दबाकर निकले तरल उत्पाद को जोड़ते हैं। अनुवाद इस जोड़ी को दर्शाता है, पर तरल को केवल दाखमधु या तेल बताकर वास्तविक अस्पष्टता को समाप्त नहीं करता।
- issue: בָּנֶיךָ का लिंग-विशिष्ट अर्थ
  choice: पुत्रों
  alternative: संतानों या बच्चों
  rationale: इब्रानी शब्द स्पष्टतः ‘पुत्रों’ का है। यहाँ उसे लिंग-निरपेक्ष बनाना मूल की विधिक श्रेणी को बदल देगा।
- issue: पहलौठे पुत्र को परमेश्वर को ‘देने’ का कथन
  choice: मूल की सीधी आज्ञा ‘मुझे देना’ को बनाए रखना
  alternative: अनुवाद में ही ‘छुड़ाना’ या किसी विशेष अनुष्ठान की व्याख्या जोड़ना
  rationale: इस पद में केवल देने की आज्ञा व्यक्त है। संबंधित छुटकारे की विधियों को यहाँ जोड़ना मूल से आगे जाकर धार्मिक तनाव को समय से पहले सुलझा देता।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त विधिक आज्ञा-शैली रखी गई है। ‘भरपूर उपज’, ‘कोल्हू से निकला रस’ और ‘पहलौठा’ सामान्य पाठक के लिए सुबोध हैं, साथ ही कृषि-संदर्भ और मूल की अस्पष्टता सुरक्षित रखते हैं।
