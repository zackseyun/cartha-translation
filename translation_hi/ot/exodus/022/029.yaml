base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/029.yaml
  text: 'You shall do the same with your ox and with your flock: seven days it shall remain with its mother[b][a]; on the eighth day you shall give it to me.'
translation:
  language: hi
  text: अपने बैल और अपनी भेड़-बकरियों के लिए भी ऐसा ही करना।[b] वह सात दिन अपनी माँ के साथ रहे;[a] आठवें दिन उसे मुझे देना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “वह अपनी माँ के साथ हो।” यहाँ “रहे” सात दिनों तक जारी रहने की बात स्पष्ट करता है।
    reason: lexical_alternative
  - marker: b
    text: यह आदेश पिछले संदर्भ में पहलौठे पशुओं को देने की बात को आगे बढ़ाता है; इस पद के इब्रानी पाठ में “पहलौठा” शब्द दोहराया नहीं गया है।
    reason: cross_reference
lexical_decisions:
- source_word: כֵּן
  choice: ऐसा ही
  rationale: यह पिछले आदेश से तुलना और निरंतरता दोनों व्यक्त करता है; आधुनिक हिन्दी में स्वाभाविक है।
- source_word: תַּעֲשֶׂה
  choice: करना
  rationale: विधिक आदेश के बल को सहज हिन्दी आज्ञार्थक शैली में व्यक्त करता है।
- source_word: לְשֹׁרְךָ
  choice: अपने बैल के साथ
  rationale: לְ यहाँ संबंध या विषय दर्शाता है; שׁוֹר के सामान्य पशुधन-संबंधी अर्थ के लिए ‘बैल’ पारंपरिक और समझने योग्य चयन है।
- source_word: לְצֹאנֶךָ
  choice: अपनी भेड़-बकरियों के साथ
  rationale: צֹאן छोटे पालतू पशुओं, विशेषकर भेड़ों और बकरियों, का सामूहिक पद है; हिन्दी में स्पष्टता के लिए दोनों को व्यक्त किया गया है।
- source_word: שִׁבְעַת יָמִים
  choice: सात दिन
  rationale: अवधि को सीधे और स्वाभाविक रूप में व्यक्त करता है।
- source_word: יִהְיֶה עִם אִמּוֹ
  choice: वह ... अपनी माँ के साथ रहे
  rationale: शाब्दिक ‘अपनी माँ के साथ हो’ में निहित सात दिनों की निरंतर अवधि को ‘रहे’ स्वाभाविक रूप से व्यक्त करता है, जबकि पादटिप्पणी शाब्दिक विकल्प सुरक्षित रखती है।
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: आठवें दिन
  rationale: मानक और स्वाभाविक कालवाचक अभिव्यक्ति।
- source_word: תִּתְּנוֹ לִי
  choice: उसे मुझे दे देना
  rationale: נתן के सीधे अर्थ और परमेश्वर की प्रथम-पुरुष माँग को बनाए रखता है; आज्ञार्थक ‘दे देना’ प्रसंग में स्वाभाविक है।
theological_decisions:
- issue: आदेश का पहलौठे पशुओं से संबंध
  choice: पद को पिछले संदर्भ के पहलौठे पशुओं के आदेश की निरंतरता के रूप में रखा गया है, पर मुख्य पाठ में ‘पहलौठा’ नहीं जोड़ा गया।
  alternative: स्पष्टता के लिए पिछले पद से ‘पहलौठा’ मुख्य पाठ में दोहराया जा सकता था।
  rationale: इस पद के इब्रानी पाठ में ‘पहलौठा’ नहीं है; संदर्भगत संबंध को पादटिप्पणी में बताना मूल पाठ से आगे बढ़े बिना अर्थ स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी की सीधी, गरिमापूर्ण आज्ञार्थक शैली अपनाई गई है। ‘भेड़-बकरियाँ’ सामूहिक पशु-पद को सामान्य पाठक के लिए स्पष्ट करती हैं। सर्वनाम ‘वह/उसे’ उस पशु-शिशु को संदर्भ से ग्रहण करता है और मुख्य पाठ में ‘पहलौठा’ जोड़ने से बचता है।
