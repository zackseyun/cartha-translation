base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/006.yaml
  text: If a man gives his neighbor money or goods to keep[a], and it is stolen from the man's house, if the thief is found[c][b], he shall pay double.
translation:
  language: hi
  text: यदि कोई आदमी अपने पड़ोसी को धन[a] या सामान[b] सुरक्षित रखने के लिए दे, और सौंपी हुई वस्तु उस आदमी के घर से चोरी हो जाए, और चोर मिल जाए, तो वह दुगुना चुका दे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, ‘चाँदी’; यहाँ धन के अर्थ में।
    reason: lexical_alternative
  - marker: b
    text: या ‘वस्तुएँ’ अथवा ‘चीज़ें’।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, ‘वह दो गुना चुका दे।’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: यदि
  rationale: यह शब्द यहाँ शर्त के रूप में प्रस्तुत किए गए विधिक मामले का आरंभ करता है; आधुनिक हिन्दी में ‘यदि’ स्वाभाविक और सटीक है।
- source_word: יִתֵּן אִישׁ
  choice: कोई आदमी ... दे
  rationale: इब्रानी में एकवचन पुल्लिंग विधिक प्रतिनिधि भाषा है। ‘कोई आदमी’ उस रूप को बनाए रखते हुए हिन्दी में सहज है।
- source_word: אֶל רֵעֵהוּ
  choice: अपने पड़ोसी को
  rationale: विधिक-सामुदायिक संदर्भ में רֵעַ निकटवर्ती साथी या समुदाय के दूसरे व्यक्ति को दर्शाता है; ‘पड़ोसी’ प्रचलित और उपयुक्त है।
- source_word: כֶּסֶף
  choice: रुपया
  rationale: शाब्दिक अर्थ ‘चाँदी’ है, पर आर्थिक-विधिक संदर्भ में यह धन या मुद्रा के अर्थ में प्रयुक्त है। ‘रुपया’ सामान्य आधुनिक हिन्दी में धनराशि को स्वाभाविक ढंग से व्यक्त करता है; शाब्दिक रूप पादटिप्पणी में रखा गया है।
- source_word: אוֹ כֵלִים
  choice: या सामान
  rationale: כֵלִים अनेक प्रकार की वस्तुओं या उपकरणों का व्यापक शब्द है। ‘सामान’ अर्थ को अनावश्यक रूप से संकीर्ण किए बिना सहज हिन्दी देता है।
- source_word: לִשְׁמֹר
  choice: सुरक्षित रखने के लिए
  rationale: क्रिया का उद्देश्य सौंपी हुई संपत्ति की देखरेख और सुरक्षा है; यह वाक्यांश हिन्दी में आशय स्पष्ट करता है।
- source_word: וְגֻנַּב
  choice: और वह ... चोरी हो जाए
  rationale: इब्रानी का कर्मवाच्य रूप सौंपी गई संपत्ति की ओर सामूहिक रूप से संकेत करता है। ‘वह’ उस संपत्ति को एक इकाई मानकर स्वाभाविक हिन्दी देता है।
- source_word: מִבֵּית הָאִישׁ
  choice: उस आदमी के घर से
  rationale: यह पहले बताए गए रखवाले के घर की ओर लौटता है; ‘उस आदमी’ संदर्भ को स्पष्ट रखता है।
- source_word: אִם יִמָּצֵא הַגַּנָּב
  choice: यदि चोर मिल जाए
  rationale: נמצא का मूल भाव ‘पाया जाना/मिलना’ है। ‘मिल जाए’ ‘पकड़ा जाए’ की अपेक्षा स्रोत की अस्पष्टता कम नहीं करता और हिन्दी में सहज है।
- source_word: יְשַׁלֵּם שְׁנָיִם
  choice: वह दुगुना भर दे
  rationale: विधिक प्रसंग में इसका अर्थ चोर द्वारा दुगुनी प्रतिपूर्ति करना है। ‘दुगुना भर दे’ संक्षिप्त, स्पष्ट और वर्तमान हिन्दी में बोधगम्य है।
