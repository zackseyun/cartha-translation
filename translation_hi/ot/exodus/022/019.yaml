base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/019.yaml
  text: Whoever sacrifices to any god[a], except to Yahweh alone, shall be devoted to destruction.
translation:
  language: hi
  text: जो कोई याहवे अकेले को छोड़कर किसी अन्य देवता के लिए बलि चढ़ाए, वह विनाश के लिए समर्पित कर दिया जाए[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे निषेध के अधीन कर दिया जाए” अथवा “उसे पूरी तरह नष्ट कर दिया जाए।” इब्रानी क्रिया में किसी को अपरिवर्तनीय रूप से विनाश के लिए समर्पित कर देने का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹבֵחַ
  choice: जो कोई … बलि चढ़ाए
  rationale: कर्तृवाचक कालवाचक कृदन्त यहाँ सामान्य व्यक्ति को सूचित करता है। ‘जो कोई’ इस अनिश्चित कानूनी प्रयोग को स्वाभाविक हिन्दी में व्यक्त करता है, और ‘बलि चढ़ाए’ वध-संबंधी उपासना-कर्म को बनाए रखता है।
- source_word: לָאֱלֹהִים
  choice: किसी और देवता के लिए
  rationale: אֱלֹהִים रूप में बहुवचन है, पर यहाँ याहवे के विपरीत किसी भी अन्य देवता का सामान्य और वितरणात्मक बोध देता है। ‘किसी और देवता’ प्रसंगगत विरोध को स्पष्ट करता है।
- source_word: יָחֳרָם
  choice: विनाश के लिए समर्पित कर दिया जाए
  rationale: חרם का होफ़ाल रूप किसी को अपरिवर्तनीय रूप से प्रतिबंध के अधीन, विनाश के लिए समर्पित किए जाने का भाव रखता है। यह अनुवाद दण्ड और समर्पण—दोनों पक्षों को सुरक्षित रखता है।
- source_word: בִּלְתִּי
  choice: छोड़
  rationale: यहाँ यह शब्द अपवाद प्रस्तुत करता है। ‘को छोड़’ आधुनिक हिन्दी में इस अपवाद को सहज रूप से व्यक्त करता है।
- source_word: לַיהוָה
  choice: याहवे को
  rationale: व्यक्तिगत वाचा-नाम יהוה को पदवी से बदलने के बजाय ‘याहवे’ के रूप में लिप्यंतरित किया गया है; परसर्ग बलि के लक्ष्य को दर्शाता है।
- source_word: לְבַדּוֹ
  choice: केवल
  rationale: यह क्रियाविशेषण याहवे की विशिष्टता पर बल देता है। ‘केवल’ उसी अनन्य अर्थ को स्वाभाविक हिन्दी में रखता है।
theological_decisions:
- issue: मूर्तिपूजक बलि के लिए חרם दण्ड का अनुवाद
  choice: विनाश के लिए समर्पित कर दिया जाए
  alternative: पूरी तरह नष्ट कर दिया जाए; प्रतिबंध के अधीन कर दिया जाए
  rationale: मूल शब्द केवल मार डालने से अधिक, किसी को חרם के अधीन अपरिवर्तनीय रूप से विनाश के लिए अलग कर देने का कानूनी-धार्मिक भाव रखता है। मुख्य पाठ में दोनों आयामों को बनाए रखा गया है और विकल्प पादटिप्पणी में दिए गए हैं।
- issue: ईश्वरीय नाम יהוה का रूप
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ वाचा-नाम का प्रत्यक्ष प्रयोग करता है। ‘याहवे’ उसका निकट और आधुनिक हिन्दी लिप्यंतरण है तथा उसे किसी पदवी से प्रतिस्थापित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, विधिक और गरिमापूर्ण रखी गई है। वाक्य में ‘केवल याहवे को छोड़’ मूल की अपवादात्मक तथा अनन्य संरचना को बनाए रखता है। पादटिप्पणी का चिह्न उसी दण्ड-वाक्यांश के बाद रखा गया है जिसकी वह व्याख्या करती है।
