  text: אִם זָרְחָ֥ה הַ/שֶּׁ֛מֶשׁ עָלָ֖י/ו דָּמִ֣ים ל֑/וֹ שַׁלֵּ֣ם יְשַׁלֵּ֔ם אִם אֵ֣ין ל֔/וֹ וְ/נִמְכַּ֖ר בִּ/גְנֵבָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/002.yaml
  text: But if the sun has risen on him[a], there is bloodguilt for him. He must surely make restitution. If he has nothing[c][b], then he shall be sold for his theft.
translation:
  language: hi
  text: परन्तु यदि उसके ऊपर सूर्य उग आया हो[a], तो उसे मारनेवाला रक्तपात का दोषी होगा[b]। चोर को पूरा हर्जाना भरना होगा। यदि उसके पास कुछ न हो, तो उसकी चोरी के कारण उसे बेच दिया जाए[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक भावार्थपूर्वक, “यदि यह सूर्योदय के बाद हुआ हो” अथवा “यदि यह दिन के उजाले में हुआ हो।” इब्रानी में शाब्दिक रूप से है, “यदि उसके ऊपर सूर्य उग आया हो।”
    reason: lexical_alternative
  - marker: b
    text: अर्थात, इस परिस्थिति में चोर को मारनेवाला रक्तपात का दोषी होगा।
    reason: alternative_reading
  - marker: c
    text: जब चोर के पास प्रतिपूर्ति के साधन न हों, तब यह बिक्री उसकी चोरी के लिए प्रतिपूर्ति की कानूनी व्यवस्था थी।
    reason: cultural_note
lexical_decisions:
- source_word: אִם זָרְחָה הַשֶּׁמֶשׁ עָלָיו
  choice: परन्तु यदि सूर्य उस पर निकल आया हो
  rationale: पिछले पद के रात्रिकालीन प्रसंग के विपरीत शर्त को स्पष्ट करते हुए इब्रानी की ठोस अभिव्यक्ति को बनाए रखता है।
- source_word: דָּמִים לוֹ
  choice: उसे मारनेवाला रक्तपात का दोषी होगा
  rationale: कानूनी बहुवचन דָּמִים रक्तपात के दोष या दायित्व को दर्शाता है। हिन्दी में कर्ता को स्पष्ट करना आवश्यक है; प्रसंगानुसार यह चोर को मारनेवाला व्यक्ति है।
- source_word: שַׁלֵּם יְשַׁלֵּם
  choice: पूरा हर्जाना भरना होगा
  rationale: क्रिया की बलवर्धक रचना निश्चित और पूर्ण प्रतिपूर्ति की बाध्यता बताती है; कानूनी प्रसंग में ‘हर्जाना भरना’ स्वाभाविक हिन्दी है।
- source_word: אִם אֵין לוֹ
  choice: यदि उसके पास कुछ न हो
  rationale: प्रतिपूर्ति के साधनों के अभाव को सहज और स्रोत-समीप हिन्दी में व्यक्त करता है।
- source_word: וְנִמְכַּר בִּגְנֵבָתוֹ
  choice: अपनी चोरी का हर्जाना चुकाने के लिए उसे बेच दिया जाए
  rationale: निष्क्रिय कानूनी परिणाम और बिक्री का चोरी से संबंधित ऋण चुकाने का उद्देश्य स्पष्ट करता है, बिना पद में कोई अवधि जोड़ने के।
theological_decisions:
- issue: दिन के उजाले में चोर को मारने पर रक्तपात का दोष
  choice: सूर्य निकल आने के बाद चोर को मारनेवाला रक्तपात का दोषी ठहरता है।
  alternative: इसे केवल समय के बजाय खतरे की स्पष्टता और अस्पष्टता के सामान्य भेद के रूप में समझना।
  rationale: मुख्य पाठ सूर्य निकलने की ठोस भाषा और पिछले पद से उसका विरोध बनाए रखता है; व्यापक नैतिक सिद्धान्त आरोपित नहीं किया गया।
- issue: प्रतिपूर्ति करनेवाला कौन है
  choice: दूसरे वाक्य का कर्ता चोर है, जो हर्जाना भरेगा और साधन न होने पर बेचा जाएगा।
  alternative: निकटवर्ती ‘मारनेवाला’ को प्रतिपूर्ति का कर्ता समझना।
  rationale: ‘यदि उसके पास कुछ न हो, तो ... उसे बेच दिया जाए’ और ‘अपनी चोरी’ से वाक्य-क्रम चोर को प्रतिपूर्ति का कर्ता ठहराता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण कानूनी स्वर रखा गया है। ‘रक्तपात का दोषी’ स्रोत के विधिक अर्थ को व्यक्त करता है, और ‘हर्जाना’ सामान्य पाठक के लिए प्रतिपूर्ति का स्वाभाविक शब्द है। सभी पाद-टिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
