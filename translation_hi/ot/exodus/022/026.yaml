source:
  edition: WLC
  text: כִּ֣י הִ֤וא כסות/ה לְ/בַדָּ֔/הּ הִ֥וא שִׂמְלָת֖/וֹ לְ/עֹר֑/וֹ בַּ/מֶּ֣ה יִשְׁכָּ֔ב וְ/הָיָה֙ כִּֽי יִצְעַ֣ק אֵלַ֔/י וְ/שָׁמַעְתִּ֖י כִּֽי חַנּ֥וּן אָֽנִי־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/026.yaml
  text: For it is his only covering; it is his cloak for his skin. In what will he lie down? And if he cries out to me[a], I will hear, for I am compassionate.
translation:
  language: hi
  text: क्योंकि वही उसका एकमात्र ओढ़ने का वस्त्र है; वही उसकी त्वचा को ढकने वाला वस्त्र है। फिर वह क्या ओढ़कर सोएगा? और यदि वह मेरी दुहाई दे, तो मैं उसकी सुनूँगा, क्योंकि मैं करुणामय[a] हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अनुग्रहकारी” अथवा “दयालु।”
    reason: חַנּוּן के वैध अर्थ-विकल्पों को सुरक्षित रखना।
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले आदेश का कारण बताता है; हिन्दी में ‘क्योंकि’ इस व्याख्यात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כְּסוּתוֹ לְבַדָּהּ
  choice: उसका एकमात्र ओढ़ना
  rationale: כְּסוּת किसी ढकने या ओढ़ने के वस्त्र को और לְבַדָּהּ उसके अकेले उपलब्ध होने को दर्शाता है। ‘ओढ़ना’ रात में उसके उपयोग को भी स्पष्ट रखता है।
- source_word: שִׂמְלָתוֹ לְעֹרוֹ
  choice: उसके शरीर को ढकने का वस्त्र
  rationale: שִׂמְלָה वस्त्र या चादर-जैसे बाहरी परिधान को दर्शाता है और עוֹר का शाब्दिक अर्थ ‘त्वचा’ है। सहज हिन्दी में ‘शरीर को ढकने का वस्त्र’ ठोस आशय को बिना अस्वाभाविकता के रखता है।
- source_word: בַּמֶּה יִשְׁכָּב
  choice: फिर वह क्या ओढ़कर सोएगा?
  rationale: यह आलंकारिक प्रश्न रात को ढकने के लिए कुछ न बचने पर बल देता है। ‘क्या ओढ़कर’ בַּמֶּה का साधनवाचक अर्थ और संदर्भगत कार्य व्यक्त करता है; ‘सोएगा’ שׁכב का स्वाभाविक हिन्दी रूप है।
- source_word: וְהָיָה כִּי יִצְעַק אֵלַי
  choice: और यदि वह मेरी दुहाई दे
  rationale: וְהָיָה כִּי भावी परिस्थिति प्रस्तुत करता है, जिसे हिन्दी में ‘और यदि’ सहजता से व्यक्त करता है। צעק संकट में सहायता की पुकार है; ‘दुहाई दे’ उसका भावनात्मक और न्यायिक बल बनाए रखता है।
- source_word: וְשָׁמַעְתִּי
  choice: तो मैं उसकी सुनूँगा
  rationale: שׁמע यहाँ केवल ध्वनि सुनने से अधिक, पुकार पर ध्यान देकर उत्तर देने का भाव रखता है। ‘उसकी सुनूँगा’ हिन्दी में यही अर्थ स्वाभाविक रूप से देता है।
- source_word: חַנּוּן
  choice: करुणामय
  rationale: यह शब्द अनुग्रह करने वाले, दयालु और संकटग्रस्त पर करुणा दिखाने वाले स्वभाव को व्यक्त करता है। इस प्रसंग में ‘करुणामय’ स्पष्ट, dignified और अर्थ-संगत है।
theological_decisions:
- issue: ईश्वर के आत्म-वर्णन חַנּוּן का अनुवाद
  choice: करुणामय
  alternative: अनुग्रहकारी; दयालु
  rationale: חַנּוּן में अनुग्रह, दया और करुणा का अर्थ-क्षेत्र है। गरीब की पुकार सुनने के इस कानूनी संदर्भ में ‘करुणामय’ नैतिक और भावात्मक बल को प्रमुखता देता है, जबकि अन्य अर्थ-संगत विकल्प पादटिप्पणी में सुरक्षित हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और बोलचाल से ऊपर किंतु सहज शैली। ‘ओढ़ना’ और ‘क्या ओढ़कर सोएगा’ वस्त्र के रात्रिकालीन उपयोग को स्पष्ट करते हैं। पादटिप्पणी चिह्न उसी शब्द के बाद रखा गया है जिससे वह संबंधित है।
