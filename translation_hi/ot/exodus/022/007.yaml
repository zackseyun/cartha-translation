source:
  edition: WLC
  text: אִם לֹ֤א יִמָּצֵא֙ הַ/גַּנָּ֔ב וְ/נִקְרַ֥ב בַּֽעַל הַ/בַּ֖יִת אֶל הָֽ/אֱלֹהִ֑ים אִם לֹ֥א שָׁלַ֛ח יָד֖/וֹ בִּ/מְלֶ֥אכֶת רֵעֵֽ/הוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/007.yaml
  text: If the thief is not found[a], the owner of the house shall come near to God to determine whether he has not laid his hand on his neighbor’s property.
translation:
  language: hi
  text: यदि चोर न मिले, तो घर का मालिक परमेश्वर[a] के पास आए, कि जाँच हो कि उसने अपने पड़ोसी की वस्तु पर हाथ डाला है या नहीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “न्यायियों के पास।” इब्रानी में “परमेश्वर” है, पर कुछ कानूनी प्रसंगों में यह दैवी अधिकार के अधीन कार्य करने वाले न्यायियों को सूचित कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: יִמָּצֵא הַגַּנָּב
  choice: चोर न मिले
  rationale: निफ़अल रूप का निष्क्रिय अर्थ सीधे व्यक्त होता है और यह खुला रहता है कि चोर की पहचान हुई या वह पकड़ा गया।
- source_word: וְנִקְרַב
  choice: के सामने उपस्थित हो
  rationale: कानूनी प्रसंग में निकट आने या प्रस्तुत होने का भाव है; यह स्वाभाविक आधुनिक हिन्दी में औपचारिक उपस्थिति व्यक्त करता है, बिना यह तय किए कि उसे कौन लाता है।
- source_word: בַּעַל הַבַּיִת
  choice: घर का मालिक
  rationale: यह घर पर अधिकार या उसका दायित्व रखने वाले व्यक्ति के लिए स्पष्ट और सहज कानूनी अभिव्यक्ति है।
- source_word: אֶל הָאֱלֹהִים
  choice: परमेश्वर के सामने
  rationale: मूल शब्द का सीधा अर्थ परमेश्वर है। 'के सामने' कानूनी जाँच के लिए परमेश्वर की उपस्थिति में आने का भाव स्वाभाविक हिन्दी में देता है; न्यायियों वाला सम्भव अर्थ पादटिप्पणी में रखा गया है।
- source_word: אִם לֹא שָׁלַח יָדוֹ
  choice: हाथ डाला है या नहीं
  rationale: यह इब्रानी बिंब को बनाए रखते हुए अनुचित रूप से लेने या इस्तेमाल करने की सम्भावना व्यक्त करता है; केवल 'चुराया' कहना अर्थ को अनावश्यक रूप से संकीर्ण कर देता।
- source_word: בִּמְלֶאכֶת רֵעֵהוּ
  choice: अपने पड़ोसी की संपत्ति
  rationale: इस जमा-संपत्ति संबंधी कानूनी प्रसंग में מְלָאכָה दूसरे व्यक्ति की वस्तुओं या संपत्ति को सूचित करता है; 'संपत्ति' व्यापक और स्पष्ट है।
theological_decisions:
- issue: इस कानूनी प्रसंग में אֱלֹהִים का अर्थ
  choice: परमेश्वर के सामने
  alternative: न्यायियों के सामने
  rationale: इब्रानी पाठ का सामान्य और सीधा अर्थ 'परमेश्वर' है, पर वाचा-संबंधी कानून के कुछ प्रसंगों में यही शब्द दैवी अधिकार के अधीन कार्य करने वाले न्यायियों के लिए समझा जा सकता है। मुख्य पाठ सीधे अर्थ को रखता है और वैकल्पिक न्यायिक अर्थ को पादटिप्पणी में स्पष्ट करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। कानूनी भाव के लिए 'उपस्थित हो' और 'यह ठहराया जाए' प्रयुक्त हैं। 'हाथ डालना' मूल मुहावरे का बिंब बचाता है और हिन्दी में अनुचित हस्तक्षेप या हड़पने का भाव देता है।
