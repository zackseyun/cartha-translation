  yaml_path: translation/ot/exodus/039/002.yaml
  text: And he made the ephod of gold[a], blue, purple, scarlet yarn[b], and finely twisted linen.
translation:
  language: hi
  text: और उसने सोने, नीले, बैंगनी और लाल रंग के सूत तथा बारीक बटे हुए सन से एपोद बनाया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: और उसने बनाया
  rationale: वाव-युक्त कथात्मक क्रिया क्रम को आगे बढ़ाती है; हिन्दी में सरल भूतकाल स्वाभाविक और स्रोत के अनुरूप है।
- source_word: הָאֵפֹד
  choice: एपोद
  rationale: यह याजकीय परिधान की विशिष्ट संज्ञा है; अर्थ को अनिश्चित रूप से परिभाषित करने के बजाय प्रचलित लिप्यंतरण रखा गया है।
- source_word: זָהָב
  choice: सोने
  rationale: पद में सामग्री का सामान्य नाम है; अगले पद की जानकारी से ‘सोने का तार’ यहाँ जोड़ना आवश्यक नहीं।
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: नीले, बैंगनी और लाल रंग के सूत
  rationale: ये रंगे हुए वस्त्र-सामग्री के पद हैं। ‘सूत’ वस्त्र-निर्माण के प्रसंग को स्वाभाविक हिन्दी में स्पष्ट करता है और तीनों रंगों पर लागू होता है।
- source_word: וְשֵׁשׁ מָשְׁזָר
  choice: तथा बारीक बटे हुए सन
  rationale: שֵׁשׁ बारीक सन को और מָשְׁזָר उसके बटे हुए होने को बताता है; अनुवाद दोनों अर्थों को बनाए रखता है।
