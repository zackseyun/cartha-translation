  text: וְ֠/הָ/אֲבָנִים עַל שְׁמֹ֨ת בְּנֵי יִשְׂרָאֵ֥ל הֵ֛נָּה שְׁתֵּ֥ים עֶשְׂרֵ֖ה עַל שְׁמֹתָ֑/ם פִּתּוּחֵ֤י חֹתָם֙ אִ֣ישׁ עַל שְׁמ֔/וֹ לִ/שְׁנֵ֥ים עָשָׂ֖ר שָֽׁבֶט־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/014.yaml
  text: And the stones corresponded to the names of the sons of Israel[a], twelve according to their names, engraved like a signet, each according to its name[c][b], for the twelve tribes.
translation:
  language: hi
  text: और वे पत्थर इस्राएल के पुत्रों के नामों के अनुरूप थे—इस्राएल के पुत्रों के नामों के अनुसार वे बारह थे। वे मुहर की खुदाई की तरह उत्कीर्ण थे; हर एक पर उसका अपना नाम था, बारह गोत्रों के लिए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָאֲבָנִים
  choice: और वे पत्थर
  rationale: मूल शब्द का सामान्य अर्थ ‘पत्थर’ है; सन्दर्भ से वे बहुमूल्य पत्थर हैं, पर मूल में यह विशेषण स्पष्ट नहीं है।
- source_word: עַל שְׁמֹת בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों के नामों के अनुसार
  rationale: עַל यहाँ स्थानसूचक ‘पर’ से अधिक अनुरूपता अथवा सम्बद्धता व्यक्त करता है; ‘नामों के अनुसार’ मूल की पुनरावृत्त संरचना भी बनाए रखता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: यह हिब्रू वाचा-सम्बन्धी पारम्परिक पद का औपचारिक और लिंग-सटीक अनुवाद है; इसे सामान्यीकृत ‘इस्राएली’ नहीं बनाया गया।
- source_word: הֵנָּה שְׁתֵּים עֶשְׂרֵה
  choice: बारह
  rationale: स्त्रीलिंग सर्वनाम और संख्या पत्थरों की गिनती पर बल देते हैं; हिन्दी वाक्य में ‘उनके नामों के अनुसार बारह’ इसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עַל שְׁמֹתָם
  choice: उनके नामों के अनुसार
  rationale: पहले आए עַל שְׁמֹת की अनुरूपता और मूल की समानान्तर पुनरावृत्ति सुरक्षित रखी गई है।
- source_word: פִּתּוּחֵי חֹתָם
  choice: मुहर के समान नक्काशी
  rationale: यह मुहर काटने जैसी उत्कीर्णन-शैली को दर्शाता है; ‘नक्काशी’ साधारण आधुनिक हिन्दी में बोधगम्य है।
- source_word: אִישׁ עַל שְׁמוֹ
  choice: हर एक पर उसका नाम
  rationale: אִישׁ यहाँ वितरणार्थक ‘हर एक’ है और प्रत्येक पत्थर को एक नाम से जोड़ता है; हिन्दी में यह रूप मूल आशय को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לִשְׁנֵים עָשָׂר שָׁבֶט
  choice: बारह गोत्रों के लिए
  rationale: לְ सम्बन्ध अथवा प्रतिनिधित्व बताता है; ‘के लिए’ संक्षिप्त है और पत्थरों का बारह गोत्रों से सम्बन्ध स्पष्ट करता है।
