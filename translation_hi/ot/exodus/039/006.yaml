  text: And they made the onyx stones[a], enclosed in settings of gold, engraved like the engravings of a seal, according to the names of the sons of Israel.
translation:
  language: hi
  text: उन्होंने सुलेमानी पत्थरों[a] को सोने के खाँचों में जड़ा और उन पर इस्राएल के पुत्रों के नाम मुहर की नक्काशी के समान उकेरे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या सम्भवतः “शोहम पत्थरों”; इस रत्न की ठीक-ठीक पहचान निश्चित नहीं है। “सुलेमानी पत्थर” पारंपरिक अनुवाद है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: उन्होंने ... जड़ा
  rationale: עשה का सामान्य अर्थ ‘बनाना’ है, पर पत्थरों और सोने के खाँचों के प्रसंग में हिंदी में ‘जड़ा’ अधिक स्वाभाविक ढंग से निर्माण-कार्य को व्यक्त करता है।
- source_word: אַבְנֵי הַשֹּׁהַם
  choice: सुलेमानी पत्थरों
  rationale: שֹׁהַם की सटीक खनिज-पहचान अनिश्चित है। हिंदी में ‘सुलेमानी पत्थर’ पारंपरिक और सुबोध पर्याय है; अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: מֻסַבֹּת מִשְׁבְּצֹת זָהָב
  choice: सोने के खाँचों में जड़ा
  rationale: यह पद पत्थरों के चारों ओर सोने की बनाई हुई जड़ाई या बैठाने की संरचना बताता है। ‘खाँचों में जड़ा’ शिल्पकारी का अर्थ स्पष्ट और स्वाभाविक हिंदी में देता है।
- source_word: מְפֻתָּחֹת פִּתּוּחֵי חוֹתָם
  choice: मुहर की नक्काशी के समान ... खोदे
  rationale: इब्रानी में उसी मूल की पुनरावृत्ति नक्काशी की विधि पर बल देती है। हिंदी में ‘मुहर की नक्काशी के समान ... खोदे’ उस तुलना और उत्कीर्णन दोनों को बनाए रखता है।
- source_word: עַל שְׁמוֹת
  choice: नाम खोदे
  rationale: यहाँ עַל नामों से संबंध या अनुरूपता दर्शाता है। हिंदी में ‘नाम खोदे’ शिलालेख का आशय सीधे और स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: यह इब्रानी के स्पष्ट पुल्लिंग बहुवचन और वंशगत/वाचाई पदबंध को निकटता से सुरक्षित रखता है।
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל का लिंगयुक्त वाचाई संबोधन
  choice: इस्राएल के पुत्रों
  alternative: इस्राएलियों / इस्राएल की सन्तानों
  rationale: मूल पदबंध स्पष्ट रूप से ‘इस्राएल के पुत्र’ कहता है और यहाँ कुलपिताओं/गोत्रों के नाम अभिप्रेत हैं; इसलिए इसे लिंग-तटस्थ नहीं किया गया।
