lexical_decisions:
- source_word: הַמְּנֹרָה
  choice: दीवट
  rationale: यह शब्द दीपकों को थामने वाले पवित्रस्थान के उपकरण को दर्शाता है, किसी एक दीपक को नहीं। ‘दीवट’ संक्षिप्त, स्वाभाविक और प्रचलित हिन्दी शब्द है।
- source_word: הַטְּהֹרָה
  choice: शुद्ध
  rationale: यहाँ विशेषण पवित्रस्थान की वस्तु की शुद्धता को व्यक्त करता है; ‘शुद्ध’ धार्मिक और भौतिक दोनों संदर्भों में उपयुक्त है।
- source_word: נֵרֹתֶיהָ
  choice: उसके दीपक
  rationale: तम्बू के सामान की सूची में यह दीवट से जुड़े अलग-अलग दीपकों को दर्शाता है।
- source_word: נֵרֹת הַמַּעֲרָכָה
  choice: क्रम से लगाए जानेवाले दीपक
  rationale: מַעֲרָכָה व्यवस्थित क्रम या निर्धारित सज्जा का भाव देता है। यह अनुवाद निर्धारित व्यवस्था के भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: כָּל כֵּלֶיהָ
  choice: उसके सभी उपकरण
  rationale: כְּלִי बर्तनों, औजारों या सहायक वस्तुओं के लिए व्यापक शब्द है; ‘उपकरण’ बिना अनावश्यक विशिष्टता के इसका अर्थ समेटता है।
- source_word: שֶׁמֶן הַמָּאוֹר
  choice: प्रकाश के लिए तेल
  rationale: यह समास प्रकाश देने के काम आने वाले तेल को बताता है; यह रूप मूल की औपचारिक सूची-शैली के निकट और हिन्दी में स्पष्ट है।
