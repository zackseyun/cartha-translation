  text: And they made pomegranates of blue and purple and scarlet yarn[a], twisted[b], on the hem of the robe.
translation:
  language: hi
  text: और उन्होंने बागे के निचले किनारे पर नीले, बैंगनी और लाल रंग के बटे हुए सूत से अनार[a] बनाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात अनार के आकार की सजावटें। इब्रानी में केवल “अनार” कहा गया है और वस्तु का नाम उसके आकार के लिए प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: और उन्होंने ... बनाए
  rationale: עשה के क़ल वय्यिक्तोल बहुवचन का सीधा, स्वाभाविक कथात्मक अनुवाद।
- source_word: עַל שׁוּלֵי הַמְּעִיל
  choice: बागे के निचले किनारे पर
  rationale: שׁוּלֵי वस्त्र के निचले छोर या किनारे को दर्शाता है; आधुनिक हिन्दी में यह वाक्यांश स्पष्ट है। מְעִיל के लिए याजकीय लंबे वस्त्र के अर्थ में 'बागा' चुना गया है।
- source_word: רִמּוֹנֵי
  choice: अनार
  rationale: इब्रानी में साधारण संज्ञा 'अनार' ही है, यद्यपि प्रसंग में उससे अनार के आकार की वस्त्र-सज्जाएँ अभिप्रेत हैं; मुख्य पाठ स्रोत की संक्षिप्तता बनाए रखता है।
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: नीले, बैंगनी और लाल रंग के ... सूत
  rationale: ये पवित्र-तम्बू के वस्त्रों में प्रयुक्त रंगीन सामग्री के पद हैं। हिन्दी में वस्त्र-संदर्भ स्पष्ट करने के लिए 'सूत' जोड़ा गया है; תְּכֵלֶת को नीला, אַרְגָּמָן को बैंगनी और תוֹלַעַת שָׁנִי को लाल रंग प्रस्तुत किया गया है।
- source_word: מָשְׁזָר
  choice: बटे हुए
  rationale: यह पद धागे या सूत के बटे/मरोड़े हुए होने का वर्णन करता है; 'बटे हुए सूत' स्वाभाविक वस्त्र-शिल्प संबंधी हिन्दी है।
