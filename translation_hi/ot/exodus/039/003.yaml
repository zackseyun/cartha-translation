base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/003.yaml
  text: They hammered out sheets of gold and cut it into threads[a], to work it into the blue and into the purple and into the scarlet yarn and into the fine linen[c][b], the work of a skillful designer.
translation:
  language: hi
  text: उन्होंने सोने की पतली चादरों[a] को पीटकर फैलाया और उनसे महीन तार[b] काटे, ताकि उन्हें नीले, बैंगनी और लाल रंग के सूत तथा महीन लिनन में कलात्मक कारीगरी[c] के लिए बुना जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘सोने के पतले पत्तर।’ इब्रानी शब्द धातु के पतले, पीटकर बनाए गए टुकड़ों को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘पतली पट्टियाँ’ अथवा ‘धागे।’ सोने को इतने महीन तंतुओं में काटा गया था कि उसे कपड़े की बुनाई में सम्मिलित किया जा सके।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में यह एक तकनीकी अभिव्यक्ति है, जो कुशलतापूर्वक रची गई कलात्मक कारीगरी को दर्शाती है। इसका अनुवाद ‘कुशल शिल्पी की कारीगरी’ या ‘कलात्मक बुनकर का काम’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְרַקְּעוּ
  choice: पीटकर ... बनाईं
  rationale: धातु-कारीगरी के इस संदर्भ में क्रिया सोने को हथौड़े से पीटकर पतला करने का बोध देती है।
- source_word: פַּחֵי הַזָּהָב
  choice: सोने की पतली चादरें
  rationale: פַּחִים धातु के पतले पीटे हुए टुकड़ों या पत्तरों को दर्शाता है; आधुनिक हिन्दी में ‘पतली चादरें’ स्वाभाविक और स्पष्ट है।
- source_word: וְקִצֵּץ פְּתִילִם
  choice: उन्हें काटकर महीन तार बनाए
  rationale: सोने की चादरों को बुनाई में काम आने वाले पतले तंतुओं में काटा गया। सोने के लिए ‘तार’ हिन्दी में ‘धागे’ से अधिक स्वाभाविक है, जबकि ‘महीन’ उनके बुनाई योग्य रूप को स्पष्ट करता है।
- source_word: בְּתוֹךְ
  choice: में पिरोया
  rationale: बार-बार आया यह पद रंगीन सूत और सन के भीतर सोने के तारों को सम्मिलित करने का बोध देता है; ‘में पिरोया’ उस कारीगरी को सहज हिन्दी में व्यक्त करता है।
- source_word: הַתְּכֵלֶת ... הָאַרְגָּמָן ... תּוֹלַעַת הַשָּׁנִי
  choice: नीले, बैंगनी और सुर्ख लाल सूत
  rationale: ये शब्द रंगे हुए वस्त्र-सामग्री को दर्शाते हैं। प्रसंग बुनाई का है, इसलिए ‘सूत’ स्पष्ट है; תּוֹלַעַת הַשָּׁנִי के लिए ‘सुर्ख लाल’ रंग की तीव्रता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַשֵּׁשׁ
  choice: महीन सन का सूत
  rationale: मिश्कान के वस्त्र-संदर्भ में שֵׁשׁ उत्तम या महीन लिनन को दर्शाता है; ‘सन का सूत’ आधुनिक पाठक के लिए सामग्री और उसके उपयोग दोनों को स्पष्ट करता है।
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: निपुण कारीगर की कलात्मक कारीगरी
  rationale: यह तकनीकी पद योजनाबद्ध, कुशल और कलात्मक वस्त्र-कारीगरी का संकेत देता है। यह रूप किसी एक विशेष कारीगरी-पद को अनावश्यक रूप से निश्चित नहीं करता।
