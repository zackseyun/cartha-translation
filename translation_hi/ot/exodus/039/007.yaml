base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/007.yaml
  text: And he set them on the shoulder pieces of the ephod as memorial stones for the sons of Israel[b][a], just as Yahweh had commanded Moses.
translation:
  language: hi
  text: उसने उन्हें एपोद के कंधे के पट्टों पर इस्राएल के पुत्रों के लिए स्मरणार्थ पत्थरों[a][b] के रूप में लगाया, ठीक वैसे ही जैसे यहवे ने मूसा को आज्ञा दी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “स्मरण के पत्थर।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “इस्राएल के पुत्रों”; यह इस्राएल के लोगों के लिए प्रयुक्त एक मानक अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם אֹתָם
  choice: उसने उन्हें ... जड़ दिया
  rationale: שׂוּם का मूल अर्थ रखना या स्थापित करना है; रत्नों और कारीगरी के प्रसंग में हिंदी का ‘जड़ दिया’ ठोस क्रिया को स्वाभाविक और सटीक रूप से व्यक्त करता है।
- source_word: עַל כִּתְפֹת הָאֵפֹד
  choice: एपोद के कंधे के पट्टों पर
  rationale: כָּתֵף का शाब्दिक अर्थ ‘कंधा’ है, पर यहाँ एपोद के कंधे से जुड़े वस्त्र-भाग अभिप्रेत हैं; ‘कंधे के पट्टे’ आधुनिक हिंदी में स्पष्ट है।
- source_word: אַבְנֵי זִכָּרוֹן
  choice: स्मरण-पत्थरों के रूप में
  rationale: यह संबंध-पदबंध स्मरण या यादगार के लिए पत्थरों को दर्शाता है; ‘स्मरण-पत्थर’ संक्षिप्त और स्रोत के निकट है।
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों के लिए
  rationale: स्थिर इब्रानी अभिव्यक्ति בְּנֵי יִשְׂרָאֵל का रूपगत अर्थ सुरक्षित रखा गया है; पादटिप्पणी बताती है कि यह समूचे इस्राएली लोगों के लिए प्रयुक्त मानक पद है।
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: ठीक वैसे ही जैसे यहवे ने मूसा को आज्ञा दी थी
  rationale: כַּאֲשֶׁר अनुरूपता व्यक्त करता है, इसलिए ‘ठीक वैसे ही जैसे’; पूर्व में दी गई आज्ञा के लिए ‘दी थी’ कथानुक्रम के अनुकूल है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम सीधे आया है। ‘यहवे’ उसे किसी उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- issue: בְּנֵי יִשְׂרָאֵל में लिंग-सूचक रूप
  choice: इस्राएल के पुत्रों
  alternative: इस्राएली / इस्राएल की संतान
  rationale: मूल की व्याकरणिक रूपरेखा और पारंपरिक वाचागत अभिव्यक्ति सुरक्षित रखी गई है, जबकि व्यापक सामूहिक संदर्भ पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण, सहज रूप रखा गया है। ‘एपोद’ तकनीकी वस्त्र-नाम के रूप में लिप्यंतरित है; ‘कंधे के पट्टे’ वस्त्र की बनावट स्पष्ट करता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
