  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כְּ/כֹ֛ל אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶׁ֑ה כֵּ֤ן עָשׂוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֵ֖ת כָּל הָ/עֲבֹדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/042.yaml
  text: According to all that Yahweh had commanded Moses[a], so the sons of Israel did all the work.
translation:
  language: hi
  text: याहवे ने मूसा को जो कुछ आदेश दिया था, इस्राएल के पुत्रों ने वह सारा काम उसी के अनुसार किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּכֹל אֲשֶׁר ... כֵּן
  choice: जैसा ... ठीक वैसा ही
  rationale: आरम्भिक כְּכֹל और उत्तरवर्ती כֵּן के अनुरूपता-संबंध को स्वाभाविक हिन्दी में स्पष्ट रूप से बनाए रखता है।
- source_word: צִוָּה
  choice: आदेश दिया था
  rationale: क्रिया का अर्थ आदेश देना है; ‘दिया था’ आदेश के कार्य पूरा होने से पहले दिए जाने को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है, किसी उपाधि से नहीं।
- source_word: אֶת מֹשֶׁה
  choice: मूसा को
  rationale: צוה के साथ चिह्नित व्यक्ति हिन्दी में स्वाभाविक रूप से ‘मूसा को आदेश दिया’ बनता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: शाब्दिक रूप ‘इस्राएल के पुत्र’ है, पर यहाँ यह पूरी वाचा-समुदाय के लिए मानक सामूहिक पद है; मुख्य पाठ में ‘इस्राएलियों’ स्पष्ट और स्वाभाविक है, जबकि शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: אֵת כָּל הָעֲבֹדָה
  choice: सारा काम
  rationale: निवास-स्थान के निर्माण-संदर्भ में עֲבֹדָה पूरे सौंपे गए कार्य को दर्शाता है; ‘सारा काम’ सहज और प्रसंगानुकूल है।
- source_word: עָשׂוּ
  choice: किया
  rationale: यहाँ עשה सौंपे गए समस्त कार्य को पूरा करने के व्यापक अर्थ में है; ‘किया’ वस्तु ‘सारा काम’ के साथ स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है। आधुनिक हिन्दी बाइबलीय प्रयोग में ‘यहोवा’ अधिक परिचित लिप्यंतरण है और इसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: בְּנֵי יִשְׂרָאֵל का सामूहिक आशय
  choice: इस्राएलियों
  alternative: इस्राएल के पुत्रों
  rationale: वाक्यांश रूपतः पुल्लिंग बहुवचन है, किंतु प्रसंग में इस्राएल की प्रजा को सामूहिक रूप से निर्दिष्ट करता है। सहज मुख्य पाठ के साथ पादटिप्पणी शाब्दिक रूप और उसकी वाचागत प्रकृति दोनों बताती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘जैसा ... ठीक वैसा ही’ मूल की अनुरूपता को उभारता है; अनावश्यक तकनीकी या सांप्रदायिक शब्दावली से बचा गया है।
