  text: וַ/יַּ֧עַשׂ אֶת הַ/חֹ֛שֶׁן מַעֲשֵׂ֥ה חֹשֵׁ֖ב כְּ/מַעֲשֵׂ֣ה אֵפֹ֑ד זָהָ֗ב תְּכֵ֧לֶת וְ/אַרְגָּמָ֛ן וְ/תוֹלַ֥עַת שָׁנִ֖י וְ/שֵׁ֥שׁ מָשְׁזָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/008.yaml
  text: 'He made the breastpiece[a], the work of a skillful designer, like the work of the ephod: of gold, blue, purple, scarlet yarn[b], and finely twisted linen.'
translation:
  language: hi
  text: उसने चपरास[a] को कुशल शिल्पकारी से, एपोद की कारीगरी के समान बनाया—सोने, नीले, बैंगनी और किरमिजी धागे तथा महीन बटे हुए सन से।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “चपरास” महायाजक की छाती पर धारण की जाने वाली, एपोद से जुड़ी वस्तु थी; इसका अर्थ धातु का युद्ध-कवच नहीं है।
    reason: lexical_clarification
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: उसने ... बनाया
  rationale: वय्यिक्तोल रूप कथा को आगे बढ़ाता है; हिन्दी में सामान्य भूतकाल स्वाभाविक रूप से क्रम को व्यक्त करता है।
- source_word: הַחֹשֶׁן
  choice: चपरास
  rationale: यह महायाजक के एपोद से जुड़ी छाती पर धारण की जाने वाली विशिष्ट वस्तु का प्रचलित हिन्दी बाइबलीय नाम है; कवच का भ्रामक अर्थ नहीं देता।
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: कुशल कारीगरी से
  rationale: इब्रानी पदबंध कलात्मक, नमूनेदार और निपुण शिल्प पर बल देता है; यह हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: כְּמַעֲשֵׂה אֵפֹד
  choice: ठीक वैसे ही जैसे एपोद बनाया गया था
  rationale: यह चपरास की निर्माण-विधि और कारीगरी की तुलना एपोद से करता है।
- source_word: אֵפֹד
  choice: एपोद
  rationale: यह एक विशिष्ट याजकीय परिधान का तकनीकी नाम है, जिसका सटीक हिन्दी पर्याय नहीं है; इसलिए लिप्यंतरण रखा गया है।
- source_word: זָהָב
  choice: सोने
  rationale: सामग्री के प्रत्यक्ष अर्थ को बनाए रखता है।
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: नीले, बैंगनी और लाल रंग के सूत
  rationale: सन्दर्भ वस्त्र-निर्माण का है; ‘सूत’ जोड़ने से स्पष्ट होता है कि ये केवल अमूर्त रंग नहीं, रंगे हुए धागे हैं।
- source_word: שֵׁשׁ מָשְׁזָר
  choice: बारीक बटे हुए मलमल
  rationale: שֵׁשׁ बारीक सन-वस्त्र/मलमल और מָשְׁזָר बटे हुए धागे को सूचित करता है; यह पारंपरिक तथा बोधगम्य हिन्दी अभिव्यक्ति है।
