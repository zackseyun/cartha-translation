translation:
  language: hi
  text: सोने की वेदी, अभिषेक का तेल, सुगंधित धूप और तंबू के प्रवेश-द्वार का परदा;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִזְבַּח הַזָּהָב
  choice: सोने की वेदी
  rationale: इब्रानी में ‘सोना’ संज्ञा विशेषणवत् प्रयुक्त है। ‘सोने की वेदी’ इस रचना को स्वाभाविक और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: अभिषेक का तेल
  rationale: यह रचना अभिषेक के लिए प्रयुक्त तेल को दर्शाती है; यह हिन्दी में प्रचलित और अनुष्ठानिक अर्थ के अनुरूप है।
- source_word: קְטֹרֶת הַסַּמִּים
  choice: सुगंधित धूप
  rationale: קְטֹרֶת का अर्थ ‘धूप’ और סַּמִּים का आशय सुगंधित द्रव्यों से है। ‘सुगंधित धूप’ सहज हिन्दी में दोनों का संयुक्त अर्थ देता है।
- source_word: מָסַךְ
  choice: परदा
  rationale: मिलापवाले तंबू के प्रसंग में यह प्रवेश पर लटकाए जाने वाले आवरण को दर्शाता है। सामान्य हिन्दी पाठक के लिए ‘परदा’ स्वाभाविक और सटीक है।
- source_word: פֶּתַח הָאֹהֶל
  choice: तंबू के प्रवेश-द्वार का
  rationale: यह तंबू के प्रवेश अथवा द्वार को सूचित करता है; ‘प्रवेश-द्वार’ अर्थ को स्पष्ट और संक्षिप्त रखता है।
- source_word: וְאֵת ... וְאֵת ... וְאֵת ... וְאֵת
  choice: अल्पविरामों वाली सूची और अंतिम वस्तु से पहले ‘और’
  rationale: दोहराया गया संयोजक और कर्म-चिह्न वस्तुओं की सूची बनाता है; आधुनिक हिन्दी में इसे सहज सूची के रूप में प्रस्तुत करना अर्थ को पूर्णतः बनाए रखता है।
