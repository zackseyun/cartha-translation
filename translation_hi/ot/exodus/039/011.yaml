translation:
  language: hi
  text: 'और दूसरी पंक्ति में: फ़िरोज़ा[a], नीलम और हीरा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कई प्राचीन रत्नों की ठीक-ठीक पहचान अनिश्चित है। נֹפֶךְ का अनुवाद ‘पन्ना’ या ‘लाल मणि’ भी किया जा सकता है, और יָהֲלֹם का अनुवाद ‘जलकांत मणि’ या ‘यशब’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/טּוּר
  choice: और ... पंक्ति में
  rationale: रत्नों की क्रमबद्ध सज्जा के संदर्भ में טוּר का अर्थ ‘पंक्ति’ है। हिंदी में सूची के ढाँचे को स्वाभाविक बनाने के लिए ‘में’ जोड़ा गया है और וְ को ‘और’ से व्यक्त किया गया है।
- source_word: הַ/שֵּׁנִי
  choice: दूसरी
  rationale: यह क्रमवाचक विशेषण ‘दूसरी’ है और स्त्रीलिंग संज्ञा ‘पंक्ति’ के अनुरूप रखा गया है।
- source_word: נֹפֶךְ
  choice: फ़िरोज़ा
  rationale: प्राचीन रत्न की सटीक पहचान अनिश्चित है। ‘फ़िरोज़ा’ एक संभावित आधुनिक समतुल्य है; अन्य प्रमुख विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: סַפִּיר
  choice: नीलम
  rationale: סַפִּיר के लिए ‘नीलम’ प्रचलित और स्वाभाविक हिंदी समतुल्य है, यद्यपि प्राचीन खनिज की आधुनिक खनिज-विज्ञान संबंधी पहचान पूर्णतः निश्चित नहीं है।
- source_word: וְ/יָהֲלֹם
  choice: और हीरा
  rationale: יָהֲלֹם की पहचान अनिश्चित है, पर ‘हीरा’ इसका प्रचलित पारंपरिक अनुवाद है। संयोजक וְ को ‘और’ से व्यक्त किया गया है; विकल्प पादटिप्पणी में सुरक्षित हैं।
