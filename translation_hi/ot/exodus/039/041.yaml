  yaml_path: translation/ot/exodus/039/041.yaml
  text: the garments of woven work for ministering in the sanctuary[a], the holy garments for Aaron the priest, and the garments of his sons for serving as priests.
translation:
  language: hi
  text: पवित्रस्थान में सेवा करने के लिए कारीगरी वाले वस्त्र[a], हारून याजक के पवित्र वस्त्र, और याजकों के रूप में सेवा करने के लिए उसके पुत्रों के वस्त्र।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सेवा के वस्त्र’; इब्रानी पदबंध संभवतः पवित्रस्थान की सेवा के लिए विशेष रूप से तैयार किए गए वस्त्रों को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּגְדֵי הַשְּׂרָד
  choice: बारीक कारीगरी से बने वस्त्र
  rationale: यह पदबंध विशेष रूप से तैयार किए गए वस्त्रों या कपड़े की कारीगरी की ओर संकेत करता है। यह अनुवाद शिल्पगत अर्थ को व्यक्त करता है, पर वस्त्रों की बनावट के बारे में मूल से अधिक निश्चित दावा नहीं करता।
- source_word: לְשָׁרֵת
  choice: सेवा करने के लिए
  rationale: שׁרת यहाँ पवित्रस्थान में औपचारिक धार्मिक सेवा को दर्शाता है। सरल हिंदी का ‘सेवा करना’ प्रसंग में यह अर्थ स्वाभाविक रूप से देता है।
- source_word: בַּקֹּדֶשׁ
  choice: पवित्रस्थान में
  rationale: यहाँ קֹדֶשׁ अमूर्त पवित्रता नहीं, बल्कि मिलापवाले तंबू के पवित्र क्षेत्र को सूचित करता है।
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  choice: पवित्र वस्त्र
  rationale: यह याजकीय वस्त्रों के लिए प्रयुक्त मानक पदबंध का निकट और स्वाभाविक हिंदी रूप है।
- source_word: לְאַהֲרֹן הַכֹּהֵן
  choice: हारून याजक के
  rationale: यह हारून को वस्त्रों का धारक बताता और उसके पद को ‘याजक’ के रूप में बनाए रखता है।
- source_word: בִּגְדֵי בָנָיו
  choice: उसके पुत्रों के वस्त्र
  rationale: यह मूल की संबंधवाचक संरचना और हारून के पुत्रों का स्पष्ट संदर्भ सुरक्षित रखता है।
- source_word: לְכַהֵן
  choice: याजकों के रूप में सेवा करने के लिए
  rationale: כֹּהֵן से बना यह क्रियापद याजक का कार्य करने को दर्शाता है; चुना हुआ रूप पद और कार्य दोनों को स्पष्ट करता है।
theological_decisions:
- issue: בִּגְדֵי הַשְּׂרָד और בִּגְדֵי הַקֹּדֶשׁ के बीच संबंध
  choice: पहले पदबंध को पवित्रस्थान की सेवा के लिए विशेष कारीगरी से बने वस्त्रों के रूप में अलग रखा गया है, और उसके बाद हारून तथा उसके पुत्रों के पवित्र वस्त्रों का उल्लेख किया गया है।
  alternative: दोनों पदबंधों को लगभग समानार्थी मानकर पहले को ‘सेवा के वस्त्र’ कहना।
  rationale: इब्रानी पाठ दोनों पदबंधों को दोहराकर अलग-अलग प्रस्तुत करता है। अनुवाद इस भेद को बनाए रखता है, लेकिन उनके ठीक-ठीक उपयोग के विषय में पाठ से आगे नहीं जाता।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और धार्मिक प्रसंग के अनुकूल भाषा रखी गई है। ‘पवित्रस्थान’ और ‘याजक’ प्रचलित बाइबलीय शब्द हैं; वाक्य की सूचीबद्ध संरचना मूल पाठ के अनुरूप सुरक्षित है।
