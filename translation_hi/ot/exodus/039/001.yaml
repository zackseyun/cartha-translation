base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/001.yaml
  text: And from the blue[a], the purple, and the scarlet yarn they made finely woven garments for ministering in the sanctuary, and they made the holy garments for Aaron, just as Yahweh had commanded Moses.
translation:
  language: hi
  text: नीले, बैंगनी और सुर्ख लाल सूत से उन्होंने पवित्रस्थान में सेवा करने के लिए बारीकी से बुने हुए वस्त्र[a] बनाए। उन्होंने हारून के लिए पवित्र वस्त्र बनाए, ठीक वैसे ही जैसे याहवे ने मूसा को आज्ञा दी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सेवा के वस्त्र।” इब्रानी पद विशिष्ट है और उसका आशय या तो इन वस्त्रों की बारीक कारीगरी से या पवित्रस्थान की सेवा में उनके उपयोग से हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַתְּכֵלֶת וְהָאַרְגָּמָן וְתוֹלַעַת הַשָּׁנִי
  choice: नीले, बैंगनी और सुर्ख लाल रंग के सूत से
  rationale: ये निवास-स्थान के वस्त्रों में प्रयुक्त रंगीन सामग्री के प्रचलित नाम हैं। प्रसंग के कारण ‘सूत’ स्पष्ट किया गया है, जबकि प्राचीन रंगों की सटीक छटा को अनावश्यक रूप से निश्चित नहीं किया गया।
- source_word: בִגְדֵי שְׂרָד
  choice: बारीकी से बुने हुए वस्त्र
  rationale: यह विशिष्ट और अर्थ की दृष्टि से कुछ अनिश्चित पद है। चुना हुआ अनुवाद कुशल वस्त्र-निर्माण के भाव को व्यक्त करता है; सेवा-कार्य पर बल देने वाला वैकल्पिक अर्थ पाद-टिप्पणी में सुरक्षित रखा गया है।
- source_word: לְשָׁרֵת
  choice: सेवा करने के लिए
  rationale: पवित्रस्थान के औपचारिक उपासना-कार्य को सहज और वर्तमान हिन्दी में व्यक्त करता है।
- source_word: בַּקֹּדֶשׁ
  choice: पवित्रस्थान में
  rationale: यहाँ शब्द पवित्र तंबू के सेवा-क्षेत्र को सूचित करता है; ‘पवित्रस्थान’ इसे अमूर्त पवित्रता या किसी एक भीतरी कक्ष तक सीमित नहीं करता।
- source_word: בִגְדֵי הַקֹּדֶשׁ
  choice: पवित्र वस्त्र
  rationale: हारून के याजकीय वस्त्रों के औपचारिक पदनाम का सीधा और स्वाभाविक अनुवाद।
- source_word: לְאַהֲרֹן
  choice: हारून के लिए
  rationale: समर्पित उपयोग अथवा नियोजन बताने वाले संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: ठीक वैसे ही जैसे याहवे ने मूसा को आज्ञा दी थी
  rationale: ‘ठीक वैसे ही’ पूर्ण अनुपालन पर बल देता है, और ‘दी थी’ पहले दी जा चुकी आज्ञा की कथा-संदर्भगत पूर्वता दर्शाता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे प्रयुक्त है। ‘याहवे’ उसका व्यापक रूप से स्वीकृत विद्वत्तापूर्ण लिप्यंतरण है और उसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पवित्रस्थान’, ‘पवित्र वस्त्र’ और ‘आज्ञा’ जैसे परिचित बाइबलीय पद बनाए रखे गए हैं। मूल की दो समानांतर क्रियाओं को दो वाक्यों में रखा गया है ताकि हिन्दी स्पष्ट रहे; ‘भी’ दूसरी क्रिया के निकट संबंध को दर्शाता है।
