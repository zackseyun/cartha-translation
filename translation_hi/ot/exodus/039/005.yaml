source:
  edition: WLC
  text: וְ/חֵ֨שֶׁב אֲפֻדָּת֜/וֹ אֲשֶׁ֣ר עָלָ֗י/ו מִמֶּ֣/נּוּ הוּא֮ כְּ/מַעֲשֵׂ/הוּ֒ זָהָ֗ב תְּכֵ֧לֶת וְ/אַרְגָּמָ֛ן וְ/תוֹלַ֥עַת שָׁנִ֖י וְ/שֵׁ֣שׁ מָשְׁזָ֑ר כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/005.yaml
  text: 'And the skillfully woven band of his ephod[a], which was on it, was of one piece with it and made like it: of gold, blue, purple, scarlet yarn, and fine twisted linen, just as Yahweh had commanded Moses.'
translation:
  language: hi
  text: और उसके एपोद[a] का कारीगरी से बुना हुआ कमरबंद, जो उस पर था, उसी का अभिन्न भाग था और उसी की कारीगरी के अनुसार बनाया गया था—सोने, नीले, बैंगनी और सुर्ख लाल धागे तथा महीन बटे हुए सन के धागों से—ठीक वैसे ही जैसे यहोवा ने मूसा को आज्ञा दी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके एपोद की सजावटी पट्टी … उसी से बनी थी और उसकी कारीगरी के समान थी।” इब्रानी पाठ इस बात पर बल देता है कि पट्टी एपोद का अभिन्न भाग थी और उसकी कारीगरी से मेल खाती थी।
    reason: חֵשֶׁב तथा מִמֶּנּוּ הוּא כְּמַעֲשֵׂהוּ के वैकल्पिक, अधिक शाब्दिक अनुवाद को सुरक्षित रखना।
lexical_decisions:
- source_word: חֵשֶׁב
  choice: कारीगरी से बुना हुआ कमरबंद
  rationale: याजकीय वस्त्र के संदर्भ में यह एपोद से जुड़ी बुनी हुई पट्टी या कमरबंद को दर्शाता है; यह चयन वस्त्र और कुशल कारीगरी दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֲפֻדָּתוֹ
  choice: एपोद का
  rationale: प्रत्यय महायाजक के एपोद को सूचित करता है; हिन्दी वाक्य-विन्यास में संबंध को स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: אֲשֶׁר עָלָיו
  choice: जो उस पर था
  rationale: यह संबंधवाचक उपवाक्य कमरबंद की स्थिति एपोद पर बताता है; मूल की अस्पष्टता से आगे बढ़कर 'जुड़ा हुआ' नहीं कहा गया।
- source_word: מִמֶּנּוּ הוּא
  choice: उसी का एक भाग था
  rationale: वाक्यांश कमरबंद और एपोद की संरचनात्मक एकता पर बल देता है; यह हिन्दी में अलग टुकड़ा न होने का भाव स्पष्ट करता है।
- source_word: כְּמַעֲשֵׂהוּ
  choice: उसी के समान बनाया गया था
  rationale: यह एपोद के अनुरूप कारीगरी को व्यक्त करता है, जबकि ठीक तकनीकी संबंध पर मूल की कुछ गुंजाइश बनी रहती है।
- source_word: זָהָב תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: सोने, नीले, बैंगनी और सुर्ख लाल धागे
  rationale: सामग्री और रंगों की सूची को आधुनिक, समझने योग्य हिन्दी में रखा गया है; 'धागे' वस्त्र-संदर्भ से पूरित है।
- source_word: שֵׁשׁ מָשְׁזָר
  choice: बटी हुई उत्तम मलमल
  rationale: שֵׁשׁ तम्बू और याजकीय वस्त्रों के संदर्भ में महीन सन-वस्त्र तथा מָשְׁזָר बटे हुए धागे को दर्शाता है; 'उत्तम मलमल' प्रचलित और सुबोध हिन्दी है।
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: ठीक वैसे ही जैसे यहोवा ने मूसा को आज्ञा दी थी
  rationale: आज्ञा के अनुपालन का सूत्र सुरक्षित है और יהוה को उसके व्यक्तिगत वाचा-नाम 'यहोवा' से प्रस्तुत किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है, इसलिए उपाधि 'प्रभु' से प्रतिस्थापित नहीं किया गया। आधुनिक हिन्दी बाइबलीय प्रयोग में 'यहोवा' व्यापक रूप से पहचाना जाता है, यद्यपि 'याहवे' संभावित उच्चारण के अधिक निकट माना जाता है।
- issue: מִמֶּנּוּ הוּא में एपोद और कमरबंद का संबंध
  choice: उसी का एक भाग था
  alternative: उसी से बना था
  rationale: चयन संरचनात्मक एकता को व्यक्त करता है, पर इसे अलग सामग्री-स्रोत मात्र नहीं मानता; पादटिप्पणी अधिक शाब्दिक विकल्प सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। 'एपोद' तकनीकी याजकीय वस्त्र-नाम के रूप में लिप्यंतरित है; सामग्री-सूची में अनावश्यक व्याख्या नहीं जोड़ी गई।
