reference: Exodus 39:32
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/תֵּ֕כֶל כָּל עֲבֹדַ֕ת מִשְׁכַּ֖ן אֹ֣הֶל מוֹעֵ֑ד וַֽ/יַּעֲשׂוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל כְּ֠/כֹל אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֖ה כֵּ֥ן עָשֽׂוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/032.yaml
  text: Thus all the work of the tabernacle[a], the tent of meeting, was finished, and the sons of Israel did according to all that Yahweh had commanded Moses[b]; so they did.
translation:
  language: hi
  text: इस प्रकार निवास-स्थान अर्थात् मिलाप के तंबू का सारा काम पूरा हुआ। इस्राएलियों ने ठीक वैसा ही किया जैसा याहवे ने मूसा को आज्ञा दी थी; उन्होंने वैसा ही किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּכֶל
  choice: पूरा हुआ
  rationale: यहाँ כלה निर्माण-कार्य के पूर्ण हो जाने को दर्शाता है; हिंदी में यह स्वाभाविक है और ध्यान कार्य पर बनाए रखता है।
- source_word: כָּל עֲבֹדַת
  choice: सारा काम
  rationale: כָּל की समग्रता और עֲבֹדָה का निर्माण-संदर्भ दोनों स्पष्ट रूप से व्यक्त होते हैं।
- source_word: מִשְׁכַּן אֹהֶל מוֹעֵד
  choice: मिलापवाले तंबू का पवित्र निवास
  rationale: 'दोनों संबद्ध पदों को बनाए रखता है: מִשְׁכָּן को पवित्र निवास और אֹהֶל מוֹעֵד को प्रचलित हिंदी पद मिलापवाला तंबू दिया गया है।'
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: यह मानक राष्ट्रीय पद यहाँ सामूहिक रूप से इस्राएल के लोगों को सूचित करता है; आधुनिक हिंदी में 'इस्राएली' स्वाभाविक और अर्थतः सटीक है।
- source_word: כְּכֹל אֲשֶׁר צִוָּה
  choice: ठीक वैसा ही ... जैसा ... आज्ञा दी थी
  rationale: आज्ञा के साथ पूर्ण अनुरूपता व्यक्त करता है और पूर्वकालिक आज्ञा को सहज हिंदी में दर्शाता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिंदी बाइबलीय परंपरा में दिव्य नाम YHWH का व्यापक और पहचाना हुआ लिप्यंतरण है; इसे उपाधि से नहीं बदला गया।
- source_word: כֵּן עָשׂוּ
  choice: उन्होंने वैसा ही किया
  rationale: मूल की समापन-पुनरुक्ति को सुरक्षित रखता है, जो इस्राएल की यथार्थ आज्ञाकारिता पर बल देती है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: पाठ में निजी दिव्य नाम है, इसलिए 'प्रभु' जैसी उपाधि के स्थान पर नाम का प्रचलित हिंदी रूप रखा गया; 'याहवे' निकटतर वैकल्पिक लिप्यंतरण है।
- issue: בְּנֵי יִשְׂרָאֵל का सामूहिक अर्थ
  choice: इस्राएलियों
  alternative: इस्राएल के पुत्रों
  rationale: यह राष्ट्रीय समुदाय के लिए रूढ़ सामूहिक अभिव्यक्ति है। 'इस्राएलियों' आधुनिक हिंदी में स्वाभाविक है और स्त्री-पुरुष सहित पूरे समुदाय का संदर्भ स्पष्ट करता है, जबकि शाब्दिक रूप भी संभव है।
- issue: כֵּן עָשׂוּ की पुनरुक्ति
  choice: उन्होंने वैसा ही किया
  alternative: पुनरुक्ति को छोड़ देना
  rationale: पुनरुक्ति आज्ञा के पूर्ण पालन पर धार्मिक और साहित्यिक बल देती है, इसलिए इसे बनाए रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिंदी। पारंपरिक 'मिलापवाला तंबू' को पहचान के लिए रखा गया, जबकि מִשְׁכָּן का अर्थ 'पवित्र निवास' से स्पष्ट किया गया है। मूल की आज्ञाकारिता-सूचक पुनरुक्ति जानबूझकर सुरक्षित है।
