  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘जड़ीं’ आभूषण-निर्माण के प्रसंग को स्पष्ट करता है, जबकि पादटिप्पणी प्राचीन रत्न-नामों की वास्तविक शब्दार्थगत अनिश्चितता बनाए रखती है।
