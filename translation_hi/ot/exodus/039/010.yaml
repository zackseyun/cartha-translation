  text: וַ/יְמַלְאוּ ב֔/וֹ אַרְבָּעָ֖ה ט֣וּרֵי אָ֑בֶן ט֗וּר אֹ֤דֶם פִּטְדָה֙ וּ/בָרֶ֔קֶת הַ/טּ֖וּר הָ/אֶחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/010.yaml
  text: 'And they mounted on it four rows of stones: the first row was a ruby[a], a topaz, and an emerald.'
translation:
  language: hi
  text: उन्होंने उसमें रत्नों की चार पंक्तियाँ जड़ीं। पहली पंक्ति में माणिक[a], पुखराज और पन्ना थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इन रत्नों की सटीक पहचान निश्चित नहीं है। ‘माणिक’, ‘पुखराज’ और ‘पन्ना’ प्रचलित पारंपरिक अनुवाद हैं। इनके सम्भावित विकल्प क्रमशः ‘लाल अकीक’, ‘क्राइसोलाइट’ और कोई अन्य चमकीला हरा या दमकता रत्न हो सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַלְאוּ
  choice: उन्होंने ... जड़ीं
  rationale: क्रिया का मूल अर्थ ‘भरना’ है, पर यहाँ रत्नों को चपरास में जड़ने का प्रसंग है; इसलिए आधुनिक हिन्दी में ‘जड़ीं’ आशय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בּוֹ
  choice: उसमें
  rationale: सर्वनाम का संकेत पहले वर्णित चपरास की ओर है। जड़े हुए रत्नों के लिए हिन्दी में ‘उसमें’ स्वाभाविक है।
- source_word: אַרְבָּעָה טוּרֵי אָבֶן
  choice: रत्नों की चार पंक्तियाँ
  rationale: טוּרֵי का अर्थ ‘पंक्तियाँ’ है और אָבֶן यहाँ सामूहिक अर्थ में प्रयुक्त है; आभूषण-संदर्भ में ‘रत्नों’ कहना स्पष्ट और सहज है।
- source_word: טוּר
  choice: पंक्ति
  rationale: पहले प्रयुक्त बहुवचन के अनुरूप यही शब्द पहली पंक्ति के रत्नों की सूची प्रस्तुत करता है।
- source_word: אֹדֶם
  choice: माणिक
  rationale: सटीक रत्न की पहचान अनिश्चित है। ‘माणिक’ प्रचलित पारंपरिक हिन्दी नाम है; सम्भावित विकल्प पादटिप्पणी में सुरक्षित रखे गए हैं।
- source_word: פִּטְדָה
  choice: पुखराज
  rationale: यह पारंपरिक रूप से ‘टोपाज़’ के लिए प्रयुक्त परिचित हिन्दी नाम है, यद्यपि प्राचीन रत्न की सटीक पहचान निश्चित नहीं है।
- source_word: בָרֶקֶת
  choice: पन्ना
  rationale: ‘पन्ना’ सामान्य पारंपरिक अनुवाद है, हालांकि मूल शब्द किसी चमकीले या दमकते हरे रत्न को सूचित कर सकता है।
- source_word: הַטּוּר הָאֶחָד
  choice: पहली पंक्ति में ... थे
  rationale: शाब्दिक रूप ‘एक पंक्ति’ है, पर चार क्रमिक पंक्तियों के विवरण में यह पहली पंक्ति को सूचित करता है; हिन्दी में अस्तित्वसूचक ‘थे’ जोड़ना स्वाभाविक है।
