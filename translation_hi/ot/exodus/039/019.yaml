  yaml_path: translation/ot/exodus/039/019.yaml
  text: They made two gold rings and put them on the two ends of the breastpiece[b][a], on its edge that was on the inner side toward the ephod.
translation:
  language: hi
  text: उन्होंने सोने के दो छल्ले बनाए और उन्हें सीने की पट्टी के दोनों सिरों पर, उसके उस किनारे पर लगाए जो एपोद की ओर भीतर की तरफ़[b] था[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘एपोद की तरफ़ मुँह किए था’ अथवा ‘एपोद के सामने था।’
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में ‘भीतर की ओर’ के लिए प्रयुक्त शब्द का शाब्दिक भाव ‘घर की ओर’ है; यहाँ इससे सीने की पट्टी का एपोद की ओर वाला भीतरी भाग अभिप्रेत है।
    reason: cultural_note
lexical_decisions:
- source_word: טַבְּעֹת זָהָב
  choice: सोने के दो छल्ले
  rationale: טַבַּעַת यहाँ याजकीय वस्त्र में जोड़ने के लिए प्रयुक्त छल्ले को दर्शाता है; ‘सोने के छल्ले’ स्वाभाविक हिन्दी है और सामग्री भी स्पष्ट रखता है।
- source_word: הַחֹשֶׁן
  choice: सीने की पट्टी
  rationale: חֹשֶׁן महायाजक के सीने पर पहनी जाने वाली सजावटी, थैलीनुमा वस्तु है। ‘सीने की पट्टी’ साधारण पाठक के लिए स्पष्ट है और ‘वक्ष-कवच’ जैसे युद्ध-कवच के भ्रामक अर्थ से बचती है।
- source_word: שְׁנֵי קְצוֹת
  choice: दोनों सिरों
  rationale: קָצֶה का अर्थ सिरा या छोर है; आकार को अनावश्यक रूप से ‘कोना’ बताने के बजाय ‘सिरा’ मूल की व्यापकता बनाए रखता है।
- source_word: שְׂפָתוֹ
  choice: उसके उस किनारे
  rationale: שָׂפָה का शाब्दिक अर्थ ‘होंठ’ है, पर किसी बनाई हुई वस्तु के लिए ‘किनारा’ स्वाभाविक और सटीक है।
- source_word: אֲשֶׁר אֶל עֵבֶר הָאֵפֹד
  choice: जो ... एपोद की ओर था
  rationale: עֵבֶר यहाँ एपोद के सापेक्ष दिशा या सामने/विपरीत स्थित भाग बता सकता है। ‘एपोद की ओर’ स्थानिक संबंध को स्पष्ट रखते हुए मूल की अस्पष्टता को अधिक नहीं सुलझाता।
- source_word: בָּיְתָה
  choice: भीतर की तरफ़
  rationale: בַּיִת से बना दिशासूचक रूप शाब्दिक रूप से ‘घर की ओर’ और प्रसंग में ‘भीतर की ओर’ है; यहाँ यह सीने की पट्टी के एपोद से लगे भीतरी भाग को दर्शाता है।
- source_word: וַיָּשִׂימוּ עַל
  choice: उन्हें ... पर ... लगाया
  rationale: שׂוּם का अर्थ रखना या स्थापित करना है। छल्लों को वस्त्र के किनारे जोड़ने के प्रसंग में ‘लगाया’ आधुनिक हिन्दी में अधिक स्वाभाविक है।
