  text: וַ/יַּ֨רְא מֹשֶׁ֜ה אֶת כָּל הַ/מְּלָאכָ֗ה וְ/הִנֵּה֙ עָשׂ֣וּ אֹתָ֔/הּ כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה כֵּ֣ן עָשׂ֑וּ וַ/יְבָ֥רֶךְ אֹתָ֖/ם מֹשֶֽׁה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/043.yaml
  text: And Moses saw all the work, and behold, they had done it; just as Yahweh had commanded, so they had done it. And Moses blessed them.
translation:
  language: hi
  text: मूसा ने सारा काम देखा, और देखो, उन्होंने वह काम ठीक वैसे ही किया था जैसे याहवे ने आज्ञा दी थी; उन्होंने वैसा ही किया था। और मूसा ने उन्हें आशीर्वाद दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: देखा
  rationale: ראה का मूल अर्थ ‘देखना’ है। यह शब्द मूसा द्वारा पूरे किए गए काम को देखने का वर्णन करता है; ‘जाँच की’ कहना स्रोत से अधिक व्याख्यात्मक होता।
- source_word: כָּל הַמְּלָאכָה
  choice: सारा काम
  rationale: מְלָאכָה यहाँ पवित्र निवास के निर्माण और उससे जुड़े समस्त कार्य को सूचित करता है। ‘सारा काम’ आधुनिक हिन्दी में स्वाभाविक और व्यापक है।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: הִנֵּה ध्यान आकर्षित करता और अगले कथन पर बल देता है। ‘और देखो’ उसकी कथात्मक शक्ति को स्पष्ट रूप से बनाए रखता है।
- source_word: עָשׂוּ אֹתָהּ
  choice: उन्होंने उसे ... किया था
  rationale: עשה का अर्थ व्यापक रूप से ‘करना/बनाना’ है और स्त्रीलिंग सर्वनाम ‘काम’ की ओर लौटता है। ‘उसे किया था’ स्रोत की पुनरावृत्ति और पूर्ण हो चुके कार्य, दोनों को बनाए रखता है।
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה
  choice: ठीक वैसे ही ... जैसे याहवे ने आज्ञा दी थी
  rationale: כַּאֲשֶׁר यहाँ आज्ञा और किए गए काम के सटीक अनुरूप होने पर बल देता है; ‘ठीक वैसे ही ... जैसे’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय दिव्य नाम को उपाधि से बदलने के बजाय आधुनिक हिन्दी लिप्यंतरण ‘याहवे’ से प्रस्तुत किया गया है।
- source_word: כֵּן עָשׂוּ
  choice: उन्होंने वैसा ही किया था
  rationale: इब्रानी पाठ आज्ञापालन की पूर्ण अनुरूपता पर बल देने के लिए עשה को दोहराता है। अलग दूसरे उपवाक्य में यह पुनरावृत्ति सुरक्षित रखी गई है।
- source_word: וַיְבָרֶךְ אֹתָם
  choice: और मूसा ने उन्हें आशीर्वाद दिया
  rationale: ברך का सीधा और प्रसंगानुकूल अर्थ ‘आशीर्वाद देना’ है; कर्ता ‘मूसा’ को हिन्दी में स्पष्ट स्थान दिया गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पाठ में व्यक्तिगत दिव्य नाम יְהוָה है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण हिन्दी लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सुबोध रखी गई है। ‘और देखो’ से הִנֵּה का कथात्मक बल तथा ‘उन्होंने वैसा ही किया था’ से मूल की जानबूझकर की गई पुनरावृत्ति सुरक्षित है।
