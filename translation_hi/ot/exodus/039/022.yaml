lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: और उसने बनाया
  rationale: वाव-क्रमिक रूप कथा की अगली क्रिया बताता है; ‘और’ तथा ‘बनाया’ इसके सीधे और स्वाभाविक हिन्दी समतुल्य हैं।
- source_word: מְעִיל הָאֵפֹד
  choice: एपोद का बागा
  rationale: מְעִיל याजकीय संदर्भ में लंबा ऊपरी वस्त्र है, जिसके लिए ‘बागा’ गरिमापूर्ण और समझने योग्य है; तकनीकी पद אֵפֹד को ‘एपोद’ के रूप में लिप्यंतरित किया गया है।
- source_word: מַעֲשֵׂה אֹרֵג
  choice: जुलाहे की कारीगरी का
  rationale: यह पदबंध शाब्दिक रूप से ‘जुलाहे का काम’ है; ‘कारीगरी’ बुने हुए निर्माण और पेशेवर शिल्प, दोनों को बिना ‘कुशल’ जोड़े व्यक्त करती है।
- source_word: כְּלִיל
  choice: पूरा
  rationale: यह शब्द संपूर्णता बताता है; यहाँ पूरा बागा एक ही वर्ण की सामग्री से बना होने का भाव है।
- source_word: תְּכֵלֶת
  choice: नीले रंग का
  rationale: यह विशिष्ट मूल्यवान नीले रंग से रंगी वस्त्र-सामग्री को सूचित करता है। मूल पद में इस स्थान पर ‘सूत’ स्पष्ट नहीं है, इसलिए मुख्य पाठ में रंग रखा गया और सांस्कृतिक अर्थ टिप्पणी में बताया गया है।
