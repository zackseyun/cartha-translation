lexical_decisions:
- source_word: וְהַטּוּר
  choice: और ... पंक्ति में
  rationale: वक्षपट की मणियों की सूची में טוּר मणियों की पंक्ति को दर्शाता है; हिन्दी में स्थान-सूचक ‘में’ स्वाभाविक है और וְ को ‘और’ से रखा गया है।
- source_word: הַשְּׁלִישִׁי
  choice: तीसरी
  rationale: क्रमवाचक विशेषण पंक्ति को स्त्रीलिंग हिन्दी संज्ञा ‘पंक्ति’ के अनुरूप सीधे पहचानता है।
- source_word: לֶשֶׁם
  choice: लिगूर
  rationale: इस प्राचीन रत्न की ठीक पहचान अनिश्चित है। पारंपरिक नाम ‘लिगूर’ मुख्य पाठ में रखा गया है और अधिक परिचित संभावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: שְׁבוֹ
  choice: सुलेमानी पत्थर
  rationale: यह ‘अकीक’ के लिए साधारण हिन्दी नाम है; प्राचीन रत्न की अनिश्चित पहचान और ‘गोमेदक’ की संभावना पादटिप्पणी में सुरक्षित है।
- source_word: וְאַחְלָמָה
  choice: और नीलमणि
  rationale: אַחְלָמָה को सामान्यतः amethyst माना जाता है; आधुनिक हिन्दी में ‘नीलमणि’ सहज और प्रतिष्ठित नाम है तथा आरम्भिक conjunction को ‘और’ से व्यक्त किया गया है।
