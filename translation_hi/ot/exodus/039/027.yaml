  yaml_path: translation/ot/exodus/039/027.yaml
  text: They made the tunics of fine linen[a], the work of a weaver, for Aaron and for his sons.
translation:
  language: hi
  text: उन्होंने हारून और उसके पुत्रों के लिए महीन सन के, बुनकर की कारीगरी से बने, कुरते बनाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: उन्होंने ... बनाए
  rationale: עשה के क़ाल वय्यिक्तोल रूप से कथा की अगली क्रिया व्यक्त होती है। हिन्दी में पूर्ववर्ती संयोजक को अलग से ‘और’ कहे बिना वाक्य स्वाभाविक रहता है।
- source_word: הַכָּתְנֹת
  choice: कुरते
  rationale: כֻּתֹּנֶת शरीर पर पहने जाने वाले लंबे अधोवस्त्र/अंगरखे को दर्शाता है। ‘कुरते’ साधारण आधुनिक हिन्दी में समझने योग्य और ‘वस्त्र’ से अधिक विशिष्ट है।
- source_word: שֵׁשׁ
  choice: महीन मलमल
  rationale: पवित्र-तंबू और याजकीय परिप्रेक्ष्य में שֵׁשׁ उच्च कोटि के महीन सन-वस्त्र को सूचित करता है। ‘महीन मलमल’ हिन्दी बाइबलीय प्रयोग में कपड़े की महीन गुणवत्ता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מַעֲשֵׂה אֹרֵג
  choice: जो जुलाहे का काम था
  rationale: यह संबंध-पदबंध बुनाई से बने कारीगरी के काम पर बल देता है। यह अनुवाद सामग्री और निर्माण-विधि को अलग रखते हुए कारीगर-संबंधी अर्थ बचाता है।
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: हारून और उसके पुत्रों के लिए
  rationale: दोनों पर लागू לְ का उद्देश्य/लाभार्थी अर्थ स्वाभाविक हिन्दी में संयुक्त पदबंध से स्पष्ट है; ‘पुत्रों’ याजकीय पारिवारिक संदर्भ को ठीक रखता है।
