  text: וְ/אֵ֨ת שְׁתֵּ֤י קְצוֹת֙ שְׁתֵּ֣י הָֽ/עֲבֹתֹ֔ת נָתְנ֖וּ עַל שְׁתֵּ֣י הַֽ/מִּשְׁבְּצֹ֑ת וַֽ/יִּתְּנֻ֛/ם עַל כִּתְפֹ֥ת הָ/אֵפֹ֖ד אֶל מ֥וּל פָּנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/018.yaml
  text: And they put the two ends of the two braided chains on the two settings[a], and put them on the shoulder pieces of the ephod[b], at its front.
translation:
  language: hi
  text: उन्होंने दोनों गुँथी हुई जंजीरों के दोनों सिरों को दोनों जड़ावों पर रखा और उन्हें एपोद के कंधे-पट्टों पर, उसके सामने की ओर, लगा दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קְצוֹת
  choice: सिरों
  rationale: यह शब्द किसी वस्तु के अंतिम छोरों को दर्शाता है; जंजीरों के संदर्भ में ‘सिरे’ स्वाभाविक और स्पष्ट है।
- source_word: הָעֲבֹתֹת
  choice: गुँथी हुई जंजीरों
  rationale: पवित्र तंबू और आभूषण-निर्माण के इस संदर्भ में यह साधारण रस्सियों के बजाय मरोड़कर या गूँथकर बनाई गई जंजीरों को दर्शाता है।
- source_word: הַמִּשְׁבְּצֹת
  choice: जड़ाऊ खाँचों
  rationale: यह उन सोने की बनावटों को दर्शाता है जिनमें रत्न जड़े या टिकाए जाते थे; ‘जड़ाऊ खाँचे’ शिल्पगत अर्थ को सामान्य हिंदी में स्पष्ट करता है।
- source_word: וַיִּתְּנֻם
  choice: उन्हें ... रखा
  rationale: मूल क्रिया נתן का सामान्य अर्थ रखना या लगाना है; ‘बाँधा’ कहना क्रिया को आवश्यकता से अधिक विशिष्ट बना देता।
- source_word: כִּתְפֹת
  choice: कंधे के पट्टों
  rationale: वस्त्र-निर्माण के संदर्भ में यह शारीरिक कंधों के बजाय एपोद के कंधों पर आने वाले हिस्सों को दर्शाता है।
- source_word: אֶל מוּל פָּנָיו
  choice: उसके सामने की ओर
  rationale: यह स्थान-सूचक वाक्यांश एपोद के सामने की ओर स्थित भाग को दर्शाता है और दिशा की मूल सूक्ष्मता बनाए रखता है।
