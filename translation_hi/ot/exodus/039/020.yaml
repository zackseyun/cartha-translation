base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/020.yaml
  text: They made two gold rings and put them on the two shoulder pieces of the ephod[a], below, on its front side, opposite its joining[b], above the skillfully woven band of the ephod.
translation:
  language: hi
  text: उन्होंने सोने के दो छल्ले बनाए और उन्हें एपोद के दोनों कंधा-भागों पर, नीचे, उसके सामने की ओर, उसके जोड़ के सामने, एपोद की कुशलता से बुनी हुई पट्टी के ऊपर लगाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: טַבְּעֹת
  choice: छल्ले
  rationale: यह शब्द यहाँ धातु के उन छल्लों को दर्शाता है जिनसे पुरोहित के वस्त्र के भाग बाँधे जाते थे; आधुनिक हिन्दी में ‘छल्ले’ स्वाभाविक और सटीक है।
- source_word: כִתְפֹת
  choice: कंधे के भाग
  rationale: एपोद के संदर्भ में यह शरीर के कंधों के बजाय वस्त्र के कंधों पर आने वाले भागों को दर्शाता है।
- source_word: מִלְמַטָּה
  choice: नीचे की ओर
  rationale: यह एपोद पर छल्लों की निचली स्थिति को व्यक्त करता है।
- source_word: מִמּוּל פָּנָיו
  choice: उसके सामने वाले हिस्से में
  rationale: शाब्दिक भाव ‘उसके मुख के सामने’ है; निर्जीव वस्त्र के लिए ‘सामने वाला हिस्सा’ स्वाभाविक हिन्दी है।
- source_word: לְעֻמַּת
  choice: के सामने
  rationale: यह स्थानगत अनुरूपता या आमने-सामने की स्थिति बताता है; ‘के सामने’ उस संबंध को बिना अधिक व्याख्या के रखता है।
- source_word: מֶחְבַּרְתּוֹ
  choice: उसके जोड़
  rationale: यह वस्त्र के भागों के जुड़ने के स्थान को दर्शाता है; ‘जोड़’ मूल शब्द की व्यापकता बनाए रखता है और इसे केवल सिलाई मानकर सीमित नहीं करता।
- source_word: חֵשֶׁב
  choice: कुशलता से बुनी हुई पट्टी
  rationale: एपोद के साथ यह कमरबंद-जैसी बुनी हुई पट्टी को दर्शाता है; यह अनुवाद उसकी वस्त्रगत प्रकृति और कारीगरी दोनों व्यक्त करता है।
- source_word: אֵפֹד
  choice: एपोद
  rationale: यह प्रधान याजक के विशिष्ट वस्त्र का तकनीकी नाम है; किसी सामान्य हिन्दी परिधान-शब्द से इसका पूरा अर्थ व्यक्त नहीं होता।
- source_word: וַיִּתְּנֻם
  choice: उन्हें ... लगाया
  rationale: छल्लों को वस्त्र पर निर्धारित स्थान में रखने या जड़ने के लिए ‘लगाया’ आधुनिक हिन्दी में स्वाभाविक है।
