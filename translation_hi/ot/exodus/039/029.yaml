  yaml_path: translation/ot/exodus/039/029.yaml
  text: and the sash of finely twisted linen[a], and blue and purple and scarlet yarn, the work of an embroiderer[b], just as Yahweh had commanded Moses.
translation:
  language: hi
  text: और महीन बटे हुए लिनन तथा नीले, बैंगनी और सुर्ख लाल धागों[b] से कढ़ाईदार कमरबंद[a] बनाया—ठीक वैसे ही, जैसे याहवे ने मूसा को आज्ञा दी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘कमरपट्टा’ अथवा ‘कटिबंध’।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी पद सुर्ख लाल रंग में रंगी सामग्री को दर्शाता है; इसका अनुवाद ‘गहरा किरमिजी धागा’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאַבְנֵט
  choice: कमरबंद
  rationale: यह शब्द याजकीय वस्त्र के साथ पहने जाने वाले पट्टे या सैश को दर्शाता है। आधुनिक हिन्दी में ‘कमरबंद’ इस परिधान-संदर्भ को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: שֵׁשׁ מָשְׁזָר
  choice: बारीक बटा हुआ मलमल
  rationale: שֵׁשׁ उत्तम महीन सन-वस्त्र को और מָשְׁזָר उसके बटे हुए होने को बताता है; यह पदबंध सामग्री और निर्माण-विधि दोनों को सुरक्षित रखता है।
- source_word: תְכֵלֶת
  choice: नीला धागा
  rationale: तंबू के वस्त्रों में प्रयुक्त प्रतिष्ठित नीले रंग की सामग्री अभिप्रेत है; सूची के संदर्भ में ‘धागा’ स्पष्ट किया गया है।
- source_word: אַרְגָּמָן
  choice: बैंगनी धागा
  rationale: पवित्रस्थान के वस्त्रों में प्रयुक्त बैंगनी रंग की सामग्री का मानक और सहज हिन्दी रूप।
- source_word: תוֹלַעַת שָׁנִי
  choice: सुर्ख लाल धागा
  rationale: यह पद सुर्ख लाल रंग में रंगी वस्त्र-सामग्री को दर्शाता है; ‘धागा’ वस्त्र-निर्माण के संदर्भ को स्पष्ट करता है, जबकि रंग की संभावित छाया को पादटिप्पणी में रखा गया है।
- source_word: מַעֲשֵׂה רֹקֵם
  choice: कढ़ाई का काम करके
  rationale: यह कुशल सजावटी वस्त्र-कर्म को व्यक्त करता है। हिन्दी में यह अभिव्यक्ति कारीगरी को स्वाभाविक ढंग से बताती है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: ठीक वैसे ही, जैसे याहवे ने मूसा को आज्ञा दी थी
  rationale: निर्गमन में बार-बार आने वाला यह सूत्र परमेश्वर की आज्ञा के ठीक अनुरूप कार्य किए जाने पर बल देता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे प्रयुक्त हुआ है। ‘याहवे’ उसका प्रचलित विद्वतापूर्ण लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। पद पूर्ववर्ती सूची का व्याकरणिक विस्तार है; हिन्दी में स्पष्टता के लिए संदर्भ से निहित क्रिया ‘बनाया’ जोड़ी गई है। रंग-सूची में ‘धागे’ को साझा संज्ञा के रूप में रखा गया है और मूल की कारीगरी-संबंधी सूचना सुरक्षित रखी गई है।
