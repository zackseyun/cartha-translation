translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। इब्रानी की दोहराई हुई स्थान-सूचक अभिव्यक्ति को सँवारकर हटाने के बजाय सुरक्षित रखा गया है। कोई पाद-टिप्पणी आवश्यक नहीं मानी गई, क्योंकि ‘बीच’ हिन्दी में अनारों के मध्य/उनके बीच वितरित स्थिति को पर्याप्त रूप से व्यक्त करता है।
