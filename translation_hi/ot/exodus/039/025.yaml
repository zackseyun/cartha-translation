source:
  edition: WLC
  text: וַ/יַּעֲשׂ֥וּ פַעֲמֹנֵ֖י זָהָ֣ב טָה֑וֹר וַ/יִּתְּנ֨וּ אֶת הַ/פַּֽעֲמֹנִ֜ים בְּ/ת֣וֹךְ הָ/רִמֹּנִ֗ים עַל שׁוּלֵ֤י הַ/מְּעִיל֙ סָבִ֔יב בְּ/ת֖וֹךְ הָ/רִמֹּנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/025.yaml
  text: They made bells of pure gold[a], and they put the bells among the pomegranates on the hem of the robe, all around, among the pomegranates.
translation:
  language: hi
  text: उन्होंने शुद्ध सोने की घंटियाँ बनाईं और उन घंटियों को अनारों के बीच, बागे के निचले किनारे पर चारों ओर, अनारों के बीच लगाया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: उन्होंने ... बनाईं
  rationale: सामान्य कथात्मक क्रम को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: פַעֲמֹנֵי זָהָב טָהוֹר
  choice: शुद्ध सोने की घंटियाँ
  rationale: घंटियों की सामग्री और सोने की शुद्धता दोनों को स्पष्ट तथा स्वाभाविक ढंग से रखता है।
- source_word: וַיִּתְּנוּ
  choice: लगाया
  rationale: यहाँ נתן का अर्थ वस्तुओं को निर्धारित स्थान पर रखना या जड़ना है; परिधान की सजावट के संदर्भ में ‘लगाया’ सहज है।
- source_word: בְּתוֹךְ הָרִמֹּנִים
  choice: अनारों के बीच
  rationale: בְּתוֹךְ का मूल भाव ‘मध्य में’ है; सजावटी अनारों के सापेक्ष घंटियों की स्थिति के लिए ‘बीच’ स्वाभाविक है और ‘among/between’ की वास्तविक स्थानगत अस्पष्टता को अनावश्यक रूप से नहीं सुलझाता।
- source_word: הָרִמֹּנִים
  choice: अनारों
  rationale: इब्रानी पाठ केवल ‘अनार’ कहता है; संदर्भ से इनके अनार के आकार के सजावटी रूप होने का बोध होता है, इसलिए मुख्य पाठ में अतिरिक्त व्याख्या नहीं जोड़ी गई।
- source_word: עַל שׁוּלֵי הַמְּעִיל
  choice: बागे के निचले किनारे पर
  rationale: שׁוּלִים वस्त्र के निचले किनारे को सूचित करता है। ‘निचला किनारा’ आधुनिक पाठकों के लिए ‘दामन’ की तुलना में अधिक स्पष्ट है; מְעִיל के लिए याजकीय परिधान के संदर्भ में ‘बागा’ उपयुक्त है।
- source_word: סָבִיב
  choice: चारों ओर
  rationale: बागे के पूरे निचले किनारे को घेरे हुए सजावटी क्रम को स्पष्ट करता है।
- source_word: בְּתוֹךְ הָרִמֹּנִים (repeated)
  choice: अनारों के बीच
  rationale: इब्रानी पाठ की पुनरावृत्ति को बनाए रखा गया है, क्योंकि वह सजावट की व्यवस्था पर बल देती है।
