  text: וַ/יַּעֲשׂ֧וּ עַל הַ/חֹ֛שֶׁן שַׁרְשְׁרֹ֥ת גַּבְלֻ֖ת מַעֲשֵׂ֣ה עֲבֹ֑ת זָהָ֖ב טָהֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/015.yaml
  text: And they made on the breastpiece chains of braided work[a], like cords, of pure gold.
translation:
  language: hi
  text: उन्होंने वक्षपट पर शुद्ध सोने की जंजीरें बनाईं, जो बटी हुई डोरियों के समान थीं[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘मरोड़ी हुई कारीगरी की जंजीरें’ अथवा ‘डोरीदार कारीगरी की जंजीरें।’ इब्रानी में ऐसी जंजीरों का वर्णन है जिनकी बनावट बटी हुई डोरी या रस्सी जैसी थी।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: उन्होंने … बनाईं
  rationale: वाव-क्रमिक रूप में सामान्य क्रिया עשה कथा को आगे बढ़ाती है; ‘बनाईं’ सहज और सीधा हिन्दी रूप है।
- source_word: עַל הַחֹשֶׁן
  choice: वक्षपट पर
  rationale: עַל के स्थान अथवा संलग्नता-सूचक अर्थ को ‘पर’ बनाए रखता है। याजकीय संदर्भ में חֹשֶׁן के लिए ‘वक्षपट’ आधुनिक, गरिमापूर्ण और समझने योग्य पद है।
- source_word: שַׁרְשְׁרֹת
  choice: जंजीरें
  rationale: बहुवचन संज्ञा का सामान्य और स्पष्ट हिन्दी रूप; अनावश्यक रूप से ‘छोटी कड़ियाँ’ जैसी विशिष्टता नहीं जोड़ी गई।
- source_word: גַּבְלֻת מַעֲשֵׂה עֲבֹת
  choice: जो बटी हुई डोरियों के समान थीं
  rationale: यह पदबंध जंजीरों की डोरी या रस्सी जैसी गुँथी-बटी बनावट का वर्णन करता है। सहज हिन्दी में कारीगरी का दृश्य रूप व्यक्त किया गया है और वैकल्पिक अर्थ पाद-टिप्पणी में रखा गया है।
- source_word: זָהָב טָהוֹר
  choice: शुद्ध सोने की
  rationale: सामग्री बताने वाले इब्रानी पदबंध का स्वाभाविक और सटीक हिन्दी रूप।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण वर्णनात्मक रूप अपनाया गया है। ‘वक्षपट’ याजकीय वस्तु के लिए स्पष्ट पद है; जंजीरों की बनावट से जुड़ी इब्रानी अभिव्यक्ति की वास्तविक lexical अस्पष्टता पाद-टिप्पणी में सुरक्षित रखी गई है।
