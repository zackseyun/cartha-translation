translation:
  language: hi
  text: काँसे की वेदी और उसके लिए काँसे की जाली[a], वेदी के डंडे और उसके सारे उपकरण; हौदी और उसका आधार[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘झंझरी’ अथवा ‘जाल’।
    reason: lexical_alternative
  - marker: b
    text: या ‘उसकी चौकी’।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְבַּח הַנְּחֹשֶׁת
  choice: काँसे की वेदी
  rationale: מִזְבַּח का सामान्य अर्थ ‘वेदी’ है। प्रसंग में यह होमबलि की वेदी है, पर इस पद में इब्रानी पाठ केवल ‘वेदी’ कहता है। נְחֹשֶׁת के लिए तंबू-संबंधी प्रसंग में प्रचलित ‘काँसा’ चुना गया है।
- source_word: מִכְבַּר הַנְּחֹשֶׁת
  choice: काँसे की जाली
  rationale: מִכְבַּר वेदी से जुड़ी जालीदार संरचना को दर्शाता है। ‘जाली’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है तथा शब्द की बनावट संबंधी धारणा को बनाए रखता है।
- source_word: אֲשֶׁר לוֹ
  choice: उसके लिए
  rationale: यह संबंधवाचक पद जाली को वेदी से जोड़ता है। ‘उसके लिए’ संबंध को व्यक्त करता है, पर उसकी ठीक स्थिति को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: בַּדָּיו
  choice: उसके डंडे
  rationale: ये सामान उठाकर ले जाने के डंडे हैं। ‘डंडे’ सरल, वर्तमान और स्वाभाविक हिन्दी है; ‘बहंगियाँ’ या अन्य विशेष शब्द अनावश्यक रूप से संकुचित होते।
- source_word: כָּל־כֵּלָיו
  choice: उसके सारे उपकरण
  rationale: כֵּלִים वस्तुओं, पात्रों या काम में आने वाले सामान का व्यापक शब्द है। वेदी के प्रसंग में ‘उपकरण’ इस व्यापकता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כִּיֹּר
  choice: हौदी
  rationale: यह धोने के लिए प्रयुक्त बड़ा पात्र था। ‘हौदी’ आधुनिक हिन्दी में वस्तु का सहज बोध कराती है और पाठ में निहित न होने वाला अतिरिक्त वर्णन नहीं जोड़ती।
- source_word: כַּנּוֹ
  choice: उसका आधार
  rationale: כֵּן यहाँ हौदी को थामने वाले आधार या चौकी को दर्शाता है। ‘आधार’ स्पष्ट है और वस्तु के सटीक आकार को अनावश्यक रूप से निश्चित नहीं करता।
