translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। पद मूल वाक्य की सूची का अंश है, इसलिए अंत में अर्धविराम रखा गया है। ‘उसके लिए’ इब्रानी संबंधवाचक अभिव्यक्ति की स्थानगत अस्पष्टता को बनाए रखता है।
