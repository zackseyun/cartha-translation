base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/021.yaml
  text: They fastened the breastpiece by its rings to the rings of the ephod with a cord of blue[a], so that it would be on the skillfully woven band of the ephod, and so that the breastpiece would not come loose from on the ephod[b], just as Yahweh had commanded Moses.
translation:
  language: hi
  text: उन्होंने नीली डोरी[a] से वक्षपट के छल्लों को एपोद के छल्लों से बाँध दिया, ताकि वह एपोद के कुशलता से बुने हुए पटके[b] पर रहे और वक्षपट एपोद पर से न खिसके, जैसा याहवे ने मूसा को आज्ञा दी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “नीले रंग की डोरी।”
    reason: इब्रानी पदबंध को रंग-संबंधी विशेषण या ‘नीले रंग की’ संरचना, दोनों रूपों में स्वाभाविक ढंग से व्यक्त किया जा सकता है।
  - marker: b
    text: या, “एपोद का बुना हुआ कमरबंद।” इब्रानी शब्द एपोद से जुड़े सजावटी बुने हुए पटके को दर्शाता है।
    reason: तकनीकी वस्त्र-शब्द के लिए ‘पटका’ और ‘कमरबंद’ दोनों संभव हैं।
lexical_decisions:
- source_word: וַיִּרְכְּסוּ
  choice: बाँध दिया
  rationale: क्रिया का अर्थ दो भागों को सुरक्षित रूप से जोड़ना या कसना है। डोरी और छल्लों के प्रसंग में ‘बाँध दिया’ स्वाभाविक और स्पष्ट है।
- source_word: הַחֹשֶׁן
  choice: वक्षपात्र
  rationale: यह महायाजक के सीने पर पहना जाने वाला रत्नजड़ित पवित्र वस्त्र-भाग है। ‘वक्षपात्र’ इसे कवच समझे जाने से बचाता है और ‘चपरास’ की अपेक्षा अधिक पारदर्शी है।
- source_word: מִטַּבְּעֹתָיו אֶל טַבְּעֹת הָאֵפֹד
  choice: उसके छल्लों से एपोद के छल्लों के साथ
  rationale: यह वक्षपात्र के छल्लों के माध्यम से एपोद के छल्लों तक किए गए जुड़ाव को व्यक्त करता है।
- source_word: בִּפְתִיל תְּכֵלֶת
  choice: नीले रंग की डोरी
  rationale: פְּתִיל बाँधने योग्य डोरी या धागे को और תְּכֵלֶת विशेष नीले रंग को सूचित करता है; वस्त्र को सुरक्षित बाँधने के प्रसंग में ‘डोरी’ उपयुक्त है।
- source_word: חֵשֶׁב הָאֵפֹד
  choice: एपोद के कुशलता से बुने हुए पटके
  rationale: यह एपोद से जुड़े सजावटी, बुने हुए पटके या कमरबंद को दर्शाने वाला तकनीकी वस्त्र-शब्द है। मुख्य पाठ में ‘पटका’ उसका आकार और कार्य सहज रूप में बताता है।
- source_word: וְלֹא יִזַּח
  choice: न खिसके
  rationale: यह अपने नियत स्थान से हटने या सरकने का भाव देता है। ‘न खिसके’ बाँधने के प्रसंग में सटीक और स्वाभाविक है।
- source_word: מֵעַל הָאֵפֹד
  choice: एपोद के ऊपर से
  rationale: संयुक्त संबंधबोधक में ‘ऊपर से’ का स्थानिक भाव स्पष्ट है; इसे अनावश्यक रूप से केवल ‘एपोद से’ नहीं किया गया।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी पाठ में परमेश्वर का व्यक्तिगत नाम है; इसलिए किसी उपाधि के स्थान पर उसका हिन्दी लिप्यंतरण रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत नाम सीधे प्रयुक्त है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण स्वरूप सुरक्षित रखता है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘एपोद’ सांस्कृतिक वस्त्र-नाम के रूप में लिप्यंतरित है, जबकि ‘वक्षपात्र’ उसके सीने पर पहने जाने के स्वरूप को स्पष्ट करता है। वाक्य की उद्देश्य-सूचक रचना और ‘ऊपर से’ का स्थानिक भाव मूल इब्रानी के निकट रखे गए हैं।
