base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/040.yaml
  text: the hangings of the court[a], its pillars and its bases, and the screen for the gate of the court, its ropes and its pegs, and all the utensils for the service of the tabernacle, for the tent of meeting[c][b];
translation:
  language: hi
  text: आँगन के परदे[a], उसके खम्भे और उनके आधार[b], आँगन के प्रवेश-द्वार का परदा, उसकी रस्सियाँ[c] और खूँटियाँ, और निवास-तम्बू की सेवा के, अर्थात् मिलाप के तम्बू के, सभी उपकरण;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘आँगन की कनातें’।
    reason: lexical_alternative
  - marker: b
    text: या ‘खाँचेदार आधार’।
    reason: lexical_alternative
  - marker: c
    text: या ‘डोरियाँ’।
    reason: lexical_alternative
lexical_decisions:
- source_word: קַלְעֵי
  choice: परदे
  rationale: यह शब्द आँगन की घेराबन्दी बनाने वाले कपड़े के पटों को दर्शाता है; सहज हिन्दी में ‘परदे’ उपयुक्त है और प्रवेश-द्वार के विशिष्ट परदे से सन्दर्भ द्वारा भेद स्पष्ट रहता है।
- source_word: חָצֵר
  choice: आँगन
  rationale: यह पवित्र निवास के चारों ओर के घिरे हुए खुले क्षेत्र को दर्शाता है; ‘आँगन’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: עַמֻּדֶיהָ
  choice: उसके खम्भे
  rationale: ये आँगन की घेराबन्दी को थामने वाले सीधे संरचनात्मक आधार थे; ‘खम्भे’ सामान्य और सटीक हिन्दी है।
- source_word: אֲדָנֶיהָ
  choice: उसकी कुर्सियाँ
  rationale: यह उन धातु-आधारों को दर्शाता है जिनमें खम्भे लगाए जाते थे; तम्बू-सम्बन्धी पारिभाषिक हिन्दी में ‘कुर्सियाँ’ इस तकनीकी अर्थ को व्यक्त करती है।
- source_word: הַמָּסָךְ
  choice: परदा
  rationale: यह प्रवेश पर लटकाए जाने वाले आवरण को दर्शाता है; हिन्दी में ‘परदा’ स्वाभाविक है, जबकि वाक्य में उसका प्रवेश-द्वार से सम्बन्ध उसका विशिष्ट कार्य स्पष्ट करता है।
- source_word: לְשַׁעַר הֶחָצֵר
  choice: आँगन के प्रवेश-द्वार का
  rationale: לְ यहाँ सम्बन्ध अथवा नियत उपयोग बताता है। कपड़े के प्रवेश को देखते हुए ‘प्रवेश-द्वार’ केवल ‘फाटक’ से अधिक स्वाभाविक है।
- source_word: מֵיתָרָיו
  choice: उसकी रस्सियाँ
  rationale: ये संरचना को कसकर बाँधने वाली डोरियाँ थीं; ‘रस्सियाँ’ आज की सामान्य हिन्दी में तुरन्त समझ आती हैं।
- source_word: וִיתֵדֹתֶיהָ
  choice: उसकी खूँटियाँ
  rationale: ये रस्सियों को बाँधने के लिए भूमि में गाड़ी जाने वाली तम्बू की खूँटियाँ थीं; यह सटीक और प्रचलित हिन्दी है।
- source_word: כָּל כְּלֵי עֲבֹדַת
  choice: सेवा के सभी उपकरण
  rationale: כְּלֵי सामूहिक रूप से सामान, पात्रों या औजारों को और עֲבֹדַת यहाँ पवित्र स्थान की सेवा को दर्शाता है; ‘उपकरण’ व्यापक अर्थ को बनाए रखता है।
- source_word: הַמִּשְׁכָּן
  choice: पवित्र निवास
  rationale: शब्द का मूल अर्थ ‘निवास’ है और यहाँ यह परमेश्वर के पोर्टेबल पवित्र निवास का पारिभाषिक नाम है; ‘पवित्र’ जोड़ने से सामान्य घर से भेद स्पष्ट होता है।
- source_word: לְאֹהֶל מוֹעֵד
  choice: मिलापवाले तम्बू के लिए
  rationale: यह पवित्र तम्बू का स्थापित नाम है। अन्तिम לְ को उद्देश्य/सम्बन्ध के रूप में रखते हुए हिन्दी में इसे पहले रखना अधिक स्वाभाविक है।
theological_decisions:
- issue: הַמִּשְׁכָּן और אֹהֶל מוֹעֵד का परस्पर सम्बन्ध
  choice: ‘मिलापवाले तम्बू के लिए पवित्र निवास की सेवा के सभी उपकरण’
  alternative: ‘पवित्र निवास की सेवा के सभी उपकरण, अर्थात् मिलापवाले तम्बू के लिए’
  rationale: हिब्रू दोनों पदों को साथ रखता है, पर उनके सम्बन्ध को पूरी तरह व्याख्यायित नहीं करता। चयनित क्रम उद्देश्य/सम्बन्ध को स्पष्ट करता है, पर दोनों पदों को समानार्थक घोषित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सूची-शैली के अनुरूप रखी गई है। पद पूर्ववर्ती वाक्य की वस्तु-सूची का अंश है, इसलिए अन्त में अर्धविराम रखा गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
