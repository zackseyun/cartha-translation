translation:
  language: hi
  text: 'तब वे निवास-स्थान को मूसा के पास ले आए—तंबू और उसका सारा सामान: उसकी कुंडियाँ, उसके चौखटे[a], उसके डंडे, उसके खंभे और उसके आधार[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तख्ते’। इब्रानी शब्द निवास-स्थान के खड़े संरचनात्मक भागों को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘आधार-खाने’, जिनमें चौखटे या खंभे बैठाए जाते थे।
    reason: lexical_alternative
