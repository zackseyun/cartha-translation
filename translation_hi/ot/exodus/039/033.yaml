- source_word: כָּל כֵּלָיו
  choice: उसका सारा सामान
  rationale: כֵּלִים उपकरणों, वस्तुओं और संरचनात्मक सामग्री के लिए व्यापक शब्द है; ‘सामान’ इस सूची में अपेक्षित व्यापकता बनाए रखता है।
- source_word: קְרָסָיו
