- source_word: קְרָשָׁיו
  choice: उसके चौखटे
  rationale: קְרָשִׁים निवास-स्थान के खड़े संरचनात्मक भाग हैं; ‘चौखटे’ उनके संरचनात्मक कार्य को ‘तख्तों’ की अपेक्षा अधिक स्पष्ट करता है, जबकि वैकल्पिक रूप पाद-टिप्पणी में रखा गया है।
- source_word: בריחו
  choice: उसके डंडे
  rationale: בְּרִיחִים वे क्षैतिज डंडे हैं जो चौखटों को साथ बाँधे रखते थे; ‘डंडे’ सरल और सटीक आधुनिक हिन्दी है।
- source_word: עַמֻּדָיו
  choice: उसके खंभे
  rationale: עַמּוּדִים खड़ी सहायक संरचनाएँ हैं; ‘खंभे’ सामान्य और स्पष्ट हिन्दी शब्द है।
- source_word: אֲדָנָיו
  choice: उसके आधार
  rationale: אֲדָנִים वे नींववाले आधार या खाने हैं जिनमें संरचनात्मक भाग बैठाए जाते थे; ‘आधार’ पठनीय है और तकनीकी विकल्प पाद-टिप्पणी में सुरक्षित है।
