base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/026.yaml
  text: a bell and a pomegranate[a], a bell and a pomegranate, around the hem of the robe, all around, for ministering, just as Yahweh had commanded Moses.
translation:
  language: hi
  text: एक घंटी और एक अनार, एक घंटी और एक अनार, चोगे के निचले किनारे के चारों ओर, सेवा करने के लिए,[a] ठीक वैसे ही जैसे याहवे ने मूसा को आज्ञा दी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सेवाकार्य के लिए” या “सेवा के लिए।” इब्रानी अनंत क्रियारूप बताता है कि यह चोगा याजकीय सेवा के उद्देश्य से था।
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּעֲמֹן
  choice: घंटी
  rationale: इस संज्ञा का सीधा अर्थ ‘घंटी’ है। इस पद में ‘सोने की’ स्पष्ट रूप से नहीं है, इसलिए उसे नहीं जोड़ा गया।
- source_word: רִמּוֹן
  choice: अनार
  rationale: शब्द का शाब्दिक अर्थ ‘अनार’ है; प्रसंग में यह अनार के आकार की सजावटी आकृति है, पर मूल शब्द को स्वाभाविक रूप से बनाए रखा गया है।
- source_word: עַל שׁוּלֵי הַמְּעִיל סָבִיב
  choice: चोगे के निचले किनारे पर चारों ओर
  rationale: שׁוּלֵי वस्त्र के निचले किनारे को और סָבִיב उसके चारों ओर की व्यवस्था को व्यक्त करता है। ‘निचला किनारा’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: לְשָׁרֵת
  choice: सेवा करने के लिए
  rationale: लामेद सहित धातु का अनंत रूप उद्देश्य बताता है। ‘सेवा’ याजकीय सेवाकार्य के लिए सहज और पर्याप्त रूप से व्यापक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय परमेश्वर-नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नामरूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: ठीक वैसे ही जैसे यहोवा ने मूसा को आज्ञा दी थी
  rationale: כַּאֲשֶׁר अनुरूपता व्यक्त करता है; ‘दी थी’ पहले दी गई आज्ञा और अब पूरे हुए काम का काल-संबंध स्वाभाविक हिन्दी में दिखाता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत परमेश्वर-नाम सीधे प्रयुक्त है। हिन्दी पाठकों के लिए व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ को रखा गया है, न कि ‘प्रभु’ जैसी उपाधि को।
- issue: לְשָׁרֵת में सेवा का आशय
  choice: सेवा करने के लिए
  alternative: सेवाकार्य के लिए
  rationale: मूल अनंत रूप उद्देश्य को व्यक्त करता है और प्रसंग याजकीय सेवा का है। मुख्य पाठ में सरल पदबंध रखा गया है तथा टिप्पणी में उसके याजकीय आशय को स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। घंटी और अनार की क्रमिक व्यवस्था को दोहराव से सुरक्षित रखा गया है; डैश वाक्य की संरचना स्पष्ट करते हैं।
