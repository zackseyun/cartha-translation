  rationale: עשה के काल रूप का सीधा और स्वाभाविक अनुवाद, जो अध्याय में निर्माण-कार्य के क्रम के अनुकूल है।
- source_word: לוֹ
  choice: एपोद के लिए
  rationale: पुल्लिंग एकवचन प्रत्यय का प्रसंगगत संकेत निर्जीव पुल्लिंग संज्ञा ‘एपोद’ की ओर है। हिन्दी में संदर्भ स्पष्ट करने के लिए संज्ञा दोहराई गई है।
- source_word: חֹבְרֹת
  choice: जो उससे जुड़े हुए थे
  rationale: חבר की जोड़ने/मिलाने की धारणा को व्यक्त करता है और पट्टों के एपोद से जुड़े होने का स्वाभाविक वर्णन देता है।
- source_word: עַל שְׁנֵי קצוותו
  choice: अपने दोनों सिरों पर
  rationale: वस्त्र के दो अंतिम छोरों का बोध कराता है; ‘सिरों पर’ हिन्दी में संक्षिप्त और सहज है।
- source_word: חֻבָּר
  choice: जोड़ा गया था
  rationale: חבר के पुअल निष्पन्न रूप की कर्मवाच्य शक्ति सुरक्षित रखी गई है। ‘जुड़े’ और ‘जोड़ा’ से मूल की पुनरुक्त जोड़-धारणा भी बनी रहती है।
