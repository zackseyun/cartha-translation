- source_word: כְּתֵפֹת
  choice: कंधे के पट्टे
  rationale: बहुवचन संज्ञा का मूल संबंध ‘कंधों’ से है और यहाँ एपोद के उन बने हुए भागों का संकेत है जो कंधों पर रहते और उसके हिस्सों को जोड़ते थे। ‘कंधे के पट्टे’ सामान्य आधुनिक हिन्दी में स्पष्ट है; वैकल्पिक ‘कंधे के भाग’ पादटिप्पणी में रखा गया है।
- source_word: עָשׂוּ
