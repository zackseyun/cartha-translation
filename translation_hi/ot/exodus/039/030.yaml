source:
  edition: WLC
  text: וַֽ/יַּעֲשׂ֛וּ אֶת צִ֥יץ נֵֽזֶר הַ/קֹּ֖דֶשׁ זָהָ֣ב טָה֑וֹר וַ/יִּכְתְּב֣וּ עָלָ֗י/ו מִכְתַּב֙ פִּתּוּחֵ֣י חוֹתָ֔ם קֹ֖דֶשׁ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/030.yaml
  text: They made the plate[a], the holy crown, of pure gold, and they inscribed on it, like the engraving of a seal, “Holy to Yahweh.”
translation:
  language: hi
  text: 'उन्होंने शुद्ध सोने की पट्टिका, अर्थात् पवित्र मुकुट, बनाई; और उस पर मुहर की नक्काशी के समान यह लेख अंकित किया: “याहवे के लिए पवित्र।”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पवित्रता याहवे के लिए।”
    reason: इब्रानी קֹדֶשׁ को यहाँ ‘पवित्र’ अथवा ‘पवित्रता’ के रूप में समझना संभव है।
lexical_decisions:
- source_word: צִיץ
  choice: पट्टिका
  rationale: याजकीय वस्त्रों के संदर्भ में यह शब्द पगड़ी पर लगाई जाने वाली सोने की पट्टी या पट्टिका को सूचित करता है; ‘पट्टिका’ आधुनिक हिन्दी में स्पष्ट है और फूल-संबंधी सामान्य अर्थ से भ्रम नहीं कराता।
- source_word: נֵזֶר הַקֹּדֶשׁ
  choice: पवित्र मुकुट
  rationale: נֵזֶר अभिषिक्त अथवा समर्पित मुकुट/किरीट को सूचित करता है। ‘पवित्र मुकुट की पट्टिका’ हिन्दी में दोनों संज्ञाओं का संबंध स्वाभाविक रूप से व्यक्त करता है।
- source_word: זָהָב טָהוֹר
  choice: शुद्ध सोने से
  rationale: यह सामग्री और उसकी शुद्धता, दोनों को सीधे और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיִּכְתְּבוּ עָלָיו
  choice: उस पर … लेख अंकित किया
  rationale: मूल क्रिया ‘लिखना’ है, जबकि अगला वाक्यांश मुहर-जैसी खुदाई की रीति बताता है। ‘लेख अंकित किया’ धातु और धातु-पट्टिका पर बने स्थायी लेख, दोनों भावों को सहज हिन्दी में रखता है।
- source_word: מִכְתַּב פִּתּוּחֵי חוֹתָם
  choice: मुहर की नक्काशी के समान यह लेख
  rationale: वाक्यांश लेख की रीति को मुहर पर की जाने वाली खुदाई से तुलना करता है; यह रूप तुलना और कारीगरी दोनों को स्पष्ट रखता है।
- source_word: קֹדֶשׁ לַיהוָה
  choice: याहवे के लिए पवित्र
  rationale: संक्षिप्त समर्पण-सूचक अभिलेख का बल बनाए रखता है। ‘पवित्रता याहवे के लिए’ भी व्याकरणतः संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में प्रस्तुत किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: पाठ में व्यक्तिगत वाचा-नाम सीधे आया है; ‘याहवे’ उसके प्रचलित विद्वत्तापूर्ण उच्चारण का देवनागरी रूप है और उसे ‘प्रभु’ जैसी उपाधि से नहीं बदलता।
- issue: अभिलेख קֹדֶשׁ לַיהוָה का रूप
  choice: याहवे के लिए पवित्र
  alternative: पवित्रता याहवे के लिए
  rationale: קֹדֶשׁ यहाँ समर्पित होने का गुण अथवा अमूर्त संज्ञा, दोनों अर्थ दे सकता है। मुख्य पाठ में स्वाभाविक समर्पण-सूचक रूप लिया गया है और वास्तविक भाषिक विकल्प पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठकों के लिए स्पष्ट रूप अपनाया गया है। ‘पट्टिका’, ‘मुकुट’, ‘नक्काशी’ और ‘अंकित’ जैसे परिचित शब्द याजकीय वस्तु तथा उसकी कारीगरी को बिना अनावश्यक तकनीकीपन के व्यक्त करते हैं।
