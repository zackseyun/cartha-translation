  text: उन्होंने सोने के दो जड़ाऊ चौखटे और सोने के दो छल्ले बनाए, और उन दोनों छल्लों को सीने के पट्ट के दोनों सिरों पर लगाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: उन्होंने ... बनाए
  rationale: עשה का बहुवचन क्रमिक क्रियारूप पिछले कार्यों के बाद अगला कार्य बताता है; हिन्दी में प्रसंगानुसार ‘उन्होंने’ स्वाभाविक है।
- source_word: מִשְׁבְּצֹת
  choice: जड़ाऊ खाँचे
  rationale: यह शब्द रत्न आदि जड़ने या आभूषण को थामने वाली सोने की बनावट का संकेत देता है। ‘जड़ाऊ खाँचे’ सामान्य पाठक के लिए कार्य और रूप दोनों को पर्याप्त रूप से व्यक्त करता है, बिना किसी विशिष्ट कारीगरी को निश्चित किए।
- source_word: זָהָב
  choice: सोने के
  rationale: मूल में पदार्थ-सूचक शब्द दोनों वस्तुओं के साथ दोहराया गया है; हिन्दी में भी यह पुनरावृत्ति रखी गई है।
- source_word: טַבְּעֹת
  choice: छल्ले
  rationale: यह याजकीय वस्त्रों में जोड़ने या बाँधने के लिए प्रयुक्त गोल कड़ियों को दर्शाता है; ‘छल्ले’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: וַיִּתְּנוּ
  choice: लगाया
  rationale: נתן यहाँ रखने या स्थापित करने के अर्थ में है। छल्लों को वस्त्र पर जोड़ने के प्रसंग में ‘लगाया’ स्वाभाविक हिन्दी है।
- source_word: עַל שְׁנֵי קְצוֹת
  choice: दोनों सिरों पर
  rationale: यह स्थान-संबंध को ठोस रूप में बनाए रखता है और हिन्दी में ‘दो सिरों’ की अपेक्षा ‘दोनों सिरों’ अधिक सहज है।
- source_word: הַחֹשֶׁן
  choice: सीने पर बाँधे जानेवाला पट्टा
  rationale: विशिष्ट याजकीय वस्तु को सामान्य आधुनिक हिन्दी में उसके स्थान और उपयोग से स्पष्ट किया गया है; इसे केवल ‘छाती’ या आधुनिक आभूषण समझने से बचाया गया है।
