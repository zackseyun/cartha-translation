  text: וַ/יִּתְּנ֤וּ עָלָי/ו֙ פְּתִ֣יל תְּכֵ֔לֶת לָ/תֵ֥ת עַל הַ/מִּצְנֶ֖פֶת מִ/לְ/מָ֑עְלָ/ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/031.yaml
  text: And they attached to it a cord of blue yarn[a], to put it above on the turban, just as Yahweh had commanded Moses.
translation:
  language: hi
  text: उन्होंने उस पर नीले सूत की डोरी[a] लगाई, ताकि उसे पगड़ी के ऊपर रखा जाए, ठीक वैसे ही जैसे याहवे ने मूसा को आज्ञा दी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “नीली डोरी” अथवा “बैंगनी-नीली डोरी”; इब्रानी תְּכֵלֶת मिलापवाले तंबू में प्रयुक्त विशिष्ट नीले रंग की सामग्री को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ עָלָיו
  choice: उन्होंने उस पर … लगाई
  rationale: נתן का मूल अर्थ ‘रखना/देना’ है, पर עַל और डोरी के संदर्भ में यह किसी वस्तु पर डोरी लगाने का भाव देता है। ‘उस पर’ पिछले पद की पवित्र सोने की पट्टी की ओर संकेत करने वाले सर्वनाम को बनाए रखता है।
- source_word: פְּתִיל
  choice: डोरी
  rationale: यह शब्द बटे हुए धागे या डोरी को दर्शाता है; यहाँ वस्तु को बाँधने के कार्य के कारण ‘डोरी’ स्वाभाविक है।
- source_word: תְּכֵלֶת
  choice: नीले सूत की
  rationale: यह मिलापवाले तंबू में प्रयुक्त विशिष्ट नीले अथवा नीले-बैंगनी रंगे वस्त्र-सामग्री को दर्शाता है। ‘नीले सूत की डोरी’ रंग और सामग्री दोनों का भाव स्पष्ट करती है।
- source_word: לָתֵת עַל הַמִּצְנֶפֶת מִלְמָעְלָה
  choice: ताकि उसे पगड़ी पर ऊपर की ओर रखा जाए
  rationale: लָתֵת उद्देश्य बताता है, הַמִּצְנֶפֶת महायाजक की पगड़ी है, और מִלְמָעְלָה ऊपरी स्थान का संकेत देता है। यह अनुवाद निहित कर्म को ‘उसे’ के रूप में रखता और स्थानगत अर्थ को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: ठीक वैसे ही जैसे याहवे ने मूसा को आज्ञा दी थी
  rationale: बार-बार आने वाला यह सूत्र परमेश्वर की आज्ञा के ठीक अनुरूप कार्य पूरा होने पर बल देता है; यְהוָה को व्यक्तिगत नाम ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘उस पर’ और ‘उसे’ मूल के सर्वनामों को बनाए रखते हैं, जबकि संदर्भ में दोनों का संकेत पिछले पद की सोने की पवित्र पट्टी की ओर है।
