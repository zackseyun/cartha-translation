  text: And the opening of the robe was in the middle of it[a], like the opening of a coat of mail, with a binding around its opening, so that it would not be torn.
translation:
  language: hi
  text: और चोगे के बीच में गले का खुला भाग था, जो कवच के खुले भाग के समान था[a]। उसके खुले भाग के चारों ओर किनारी थी, ताकि वह खुला भाग फट न जाए।
  philosophy: optimal-equivalence
  footnotes:
