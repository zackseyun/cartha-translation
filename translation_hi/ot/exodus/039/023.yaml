    reason: lexical_alternative
lexical_decisions:
- source_word: פִי הַמְּעִיל
  choice: चोगे का गले का छेद
  rationale: वस्त्र के संदर्भ में פֶּה का अर्थ उसका खुला भाग है; यहाँ पहनने के लिए बना गले का छेद अभिप्रेत है। ‘चोगा’ מְעִיל के लिए सहज और गरिमापूर्ण आधुनिक हिन्दी है।
- source_word: בְּתוֹכוֹ
  choice: उसके बीच में
  rationale: यह पद छेद की वस्त्र के मध्य में स्थिति बताता है।
- source_word: כְּפִי תַחְרָא
  choice: कवच के छेद के समान
  rationale: תַחְרָא दुर्लभ शब्द है और किसी सुरक्षात्मक युद्ध-वस्त्र को सूचित करता है। ‘कवच’ उसके व्यापक अर्थ को रखता है और किसी अनिश्चित विशिष्ट बनावट को आरोपित नहीं करता।
- source_word: שָׂפָה לְפִיו סָבִיב
  choice: उसके छेद के चारों ओर एक किनारी
  rationale: שָׂפָה का मूल अर्थ होंठ या किनारा है; वस्त्र में यह छेद को चारों ओर से घेरे हुए मजबूत किनारे को दर्शाता है।
- source_word: לֹא יִקָּרֵעַ
  choice: ताकि वह फटे नहीं
  rationale: निफ़ाल अपूर्ण क्रिया यहाँ किनारी के उद्देश्य अथवा अपेक्षित परिणाम को स्वाभाविक हिन्दी में व्यक्त करती है।
