lexical_decisions:
- source_word: הַשֻּׁלְחָן
  choice: मेज़
  rationale: यह शब्द सीधे मेज़ को दर्शाता है। संदर्भ से स्पष्ट है कि यह पवित्र निवास की सामग्री की सूची है, इसलिए अतिरिक्त व्याख्यात्मक शब्द जोड़ना आवश्यक नहीं।
- source_word: כָּל כֵּלָיו
  choice: उसके सभी पात्र
  rationale: כְּלִי का अर्थ पात्र, उपकरण या वस्तु हो सकता है। यहाँ मेज़ के साथ प्रयुक्त धार्मिक सामग्री के लिए ‘पात्र’ स्वाभाविक, ठोस और प्रचलित हिंदी है।
- source_word: לֶחֶם הַפָּנִים
  choice: उपस्थिति की रोटी
  rationale: शाब्दिक अर्थ ‘मुख/उपस्थिति की रोटी’ है। ‘उपस्थिति की रोटी’ मूल अभिव्यक्ति को पारदर्शी ढंग से सुरक्षित रखती है और पारंपरिक किंतु कम स्पष्ट पद का अर्थ स्वयं तय नहीं करती।
- source_word: אֶת ... אֶת ... וְאֵת
  choice: अलग से अनूदित नहीं
  rationale: ये कर्म-चिह्न सूची की वस्तुओं को समन्वित करते हैं; हिंदी में उनका कार्य शब्दक्रम और ‘और’ से व्यक्त होता है।
