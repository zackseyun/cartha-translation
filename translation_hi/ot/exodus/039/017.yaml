lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: और उन्होंने…लगा दीं
  rationale: נתן यहाँ किसी वस्तु को छल्लों पर या उनमें लगाने का भाव देता है। हिन्दी में आभूषण-सदृश जोड़ के लिए “लगा दीं” स्वाभाविक है।
- source_word: שְׁתֵּי הָעֲבֹתֹת הַזָּהָב
  choice: सोने की वे दोनों डोरियाँ
  rationale: עֲבֹתֹת मुड़ी हुई डोरियों अथवा जंजीर-जैसी लड़ियों को सूचित कर सकता है। “डोरियाँ” मूल बिंब को रखता है, जबकि “सोने की” सामग्री स्पष्ट करता है।
- source_word: עַל שְׁתֵּי הַטַּבָּעֹת
  choice: दोनों छल्लों में
  rationale: עַל का मूल अर्थ “पर” है, पर जोड़ने की इस क्रिया में हिन्दी का “छल्लों में लगा दीं” अधिक स्वाभाविक और आशय-संगत है।
- source_word: עַל קְצוֹת הַחֹשֶׁן
  choice: चपरास के सिरों पर लगे
  rationale: यह पदबंध छल्लों की स्थिति बताता है। “सिरों पर लगे” संबंध को हिन्दी में स्पष्ट और सहज बनाता है।
- source_word: הַחֹשֶׁן
  choice: चपरास
  rationale: निर्गमन के याजकीय परिधान के संदर्भ में חֹשֶׁן के लिए “चपरास” प्रचलित हिन्दी बाइबलीय शब्द है और वक्ष पर पहने जाने वाले विशेष वस्त्रांश को सूचित करता है।
