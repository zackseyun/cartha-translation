base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/021.yaml
  text: Then Moses stretched out his hand over the sea[a], and Yahweh drove the sea back by a strong east wind all night and made the sea dry land[d][c][b], and the waters were split.
translation:
  language: hi
  text: तब मूसा ने समुद्र के ऊपर अपना हाथ फैलाया। याहवे ने सारी रात प्रबल पूर्वी हवा से समुद्र को पीछे हटा दिया[a] और समुद्र को सूखी भूमि बना दिया[b]; और जल फटकर अलग हो गया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “समुद्र को चलाया”; यहाँ क्रिया कारणवाचक है। प्रसंग में “समुद्र को पीछे हटा दिया” अभिप्रेत प्रभाव को स्पष्ट करता है।
    reason: lexical_alternative
  - marker: b
    text: या, “समुद्र को सूखी ज़मीन में बदल दिया।”
    reason: lexical_alternative
  - marker: c
    text: या, “जल विभाजित हो गया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּט ... אֶת־יָדוֹ עַל־הַיָּם
  choice: समुद्र के ऊपर अपना हाथ बढ़ाया
  rationale: נטה के साथ ‘हाथ’ का अर्थ हाथ बढ़ाना या फैलाना है। עַל को दृश्य के अनुसार स्वाभाविक रूप से ‘के ऊपर’ रखा गया है।
- source_word: וַיּוֹלֶךְ יְהוָה אֶת־הַיָּם
  choice: याहवे ने ... समुद्र को पीछे हटा दिया
  rationale: הלך का हिफ़ील रूप कारणवाचक है। प्रसंग में ‘पीछे हटा दिया’ परिणाम को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है, जबकि पादटिप्पणी अधिक शाब्दिक संभावना सुरक्षित रखती है।
- source_word: בְּרוּחַ קָדִים עַזָּה
  choice: प्रचण्ड पुरवाई के द्वारा
  rationale: רוּחַ यहाँ दिशा-सूचक קָדִים के कारण ‘हवा’ है। ‘पुरवाई’ पूर्व दिशा से चलने वाली हवा को सहज हिन्दी में व्यक्त करती है और ‘प्रचण्ड’ עַזָּה की शक्ति को दर्शाता है।
- source_word: כָּל־הַלַּיְלָה
  choice: सारी रात
  rationale: यह पूरी रात की अवधि को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיָּשֶׂם אֶת־הַיָּם לֶחָרָבָה
  choice: समुद्र को सूखी भूमि बना दिया
  rationale: חָרָבָה सूखी भूमि या सूखी ज़मीन को दर्शाता है। यह रूप हिब्रू में समुद्र को कर्म बनाए रखने के साथ हिन्दी में स्पष्ट है।
- source_word: וַיִּבָּקְעוּ הַמָּיִם
  choice: पानी फटकर अलग हो गया
  rationale: בקע का निफ़अल रूप पानी के चिरने या फटकर अलग होने को व्यक्त करता है। अनावश्यक रूप से ‘दो भागों’ को जोड़ने के बजाय मूल की सजीवता और अनिर्दिष्टता रखी गई है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में उपाधि नहीं बल्कि चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम है। ‘याहवे’ उसका व्यापक रूप से मान्य निकट लिप्यंतरण है; इसे ‘प्रभु’ से बदलने पर नाम और उपाधि का भेद मिट जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और कथात्मक रूप अपनाया गया है। ‘पुरवाई’ सामान्य हिन्दी में पूर्वी हवा का संक्षिप्त और स्वाभाविक शब्द है। वाक्य-विन्यास हिब्रू की क्रमिक क्रियाओं को बनाए रखता है, पर पठनीयता के लिए पहले उपवाक्य के बाद पूर्णविराम दिया गया है।
