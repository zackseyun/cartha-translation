  text: तब उसने छह सौ चुने हुए रथ और मिस्र के सभी रथ लिए, और उन सबके ऊपर अधिकारी थे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन सबके साथ रथ-अधिकारी भी थे”; इब्रानी शब्द रथों से जुड़े विशिष्ट सैन्य सहायकों या सेनापतियों को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: तब उसने ... लिए
  rationale: वय्यिक्तोल रूप कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में क्रमिकता व्यक्त करता है।
- source_word: שֵׁשׁ מֵאוֹת
  choice: छह सौ
  rationale: संख्या का सीधा और स्पष्ट अनुवाद।
- source_word: רֶכֶב
  choice: रथ
  rationale: यह शब्द सामूहिक रूप से रथ-दल भी सूचित कर सकता है, पर स्पष्ट संख्या के साथ हिन्दी में ‘रथ’ स्वाभाविक है।
- source_word: בָּחוּר
  choice: चुने हुए
  rationale: בחר से बना यह रूप विशेष रूप से चयनित अथवा श्रेष्ठ सैन्य रथों को दर्शाता है; ‘चुने हुए’ अर्थ को स्पष्ट रखता है।
- source_word: וְכֹל רֶכֶב מִצְרָיִם
  choice: और मिस्र के सभी रथ
  rationale: यह छह सौ चुने हुए रथों के अतिरिक्त मिस्र के पूरे रथ-दल को सूचित करता है।
- source_word: וְשָׁלִשִׁם
  choice: अधिकारी
  rationale: यह अनिश्चित सैन्य पदनाम रथों से जुड़े उच्च सैनिक सहायकों या नायकों के लिए प्रयुक्त हो सकता है; ‘अधिकारी’ अनावश्यक विशिष्टता से बचता है।
- source_word: עַל כֻּלּוֹ
  choice: उन सब पर
  rationale: एकवचन प्रत्यय सामूहिक रथ-दल की ओर संकेत करता है; हिन्दी में इसका वितरणात्मक अर्थ ‘उन सब पर’ स्वाभाविक है।
