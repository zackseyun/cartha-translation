id: EXO.14.26
reference: Exodus 14:26
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה נְטֵ֥ה אֶת יָדְ/ךָ֖ עַל הַ/יָּ֑ם וְ/יָשֻׁ֤בוּ הַ/מַּ֨יִם֙ עַל מִצְרַ֔יִם עַל רִכְבּ֖/וֹ וְ/עַל פָּרָשָֽׁי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/026.yaml
  text: Then Yahweh said to Moses[a], “Stretch out your hand over the sea, so that the waters may return over the Egyptians, over their chariots, and over their horsemen.”
translation:
  language: hi
  text: तब याहवे ने मूसा से कहा, “अपना हाथ समुद्र के ऊपर बढ़ा, ताकि पानी मिस्रियों, उनके रथों और उनके घुड़सवारों के ऊपर लौट आए[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और पानी मिस्रियों के ऊपर लौट आएगा।” हिब्रू क्रिया का अधिक शाब्दिक अनुवाद सरल भविष्य के रूप में किया जा सकता है, पर यहाँ वह संभवतः मूसा के कार्य का अभिप्रेत परिणाम बताती है।
    reason: क्रियारूप के सरल भविष्य और प्रयोजन/परिणाम-सूचक अर्थ—दोनों संभावित पाठों को सुरक्षित रखना।
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने ... कहा
  rationale: वाव-क्रमिक रूप कथा को अगले घटनाक्रम में बढ़ाता है; आधुनिक हिन्दी में ‘तब’ इस क्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: यह परमेश्वर के व्यक्तिगत नाम का हिन्दी लिप्यंतरण है; मूल में आए नाम को किसी उपाधि से नहीं बदला गया।
- source_word: נְטֵה אֶת־יָדְךָ
  choice: अपना हाथ ... बढ़ा
  rationale: आज्ञार्थक क्रिया समुद्र के ऊपर हाथ फैलाने या आगे बढ़ाने की क्रिया बताती है; ‘हाथ बढ़ा’ हिन्दी में सीधा और स्वाभाविक है।
- source_word: עַל־הַיָּם
  choice: समुद्र के ऊपर
  rationale: עַל का स्थान-संबंधी अर्थ यहाँ हाथ को समुद्र के ऊपर बढ़ाने के संकेत के अनुकूल है।
- source_word: וְיָשֻׁבוּ
  choice: ताकि ... लौट आए
  rationale: आज्ञा के बाद आया अपूर्ण क्रियारूप मूसा के कार्य के अभिप्रेत परिणाम को व्यक्त कर सकता है; ‘ताकि’ उस संबंध को स्पष्ट रखता है। सरल भविष्य का अर्थ भी संभव है और पादटिप्पणी में दिया गया है।
- source_word: הַמַּיִם
  choice: पानी
  rationale: हिब्रू शब्द रूप में बहुवचन है, पर आधुनिक हिन्दी में इस प्रसंग में अगणनीय ‘पानी’ अधिक स्वाभाविक है और समुद्र के जल को स्पष्ट रूप से व्यक्त करता है।
- source_word: עַל מִצְרַיִם
  choice: मिस्रियों के ऊपर
  rationale: यहाँ מִצְרַיִם सामूहिक रूप से मिस्रियों को सूचित करता है और עַל लौटते पानी से उनके ढक जाने का स्थानिक चित्र बनाए रखता है।
- source_word: עַל רִכְבּוֹ
  choice: उनके रथों के ऊपर
  rationale: हिब्रू प्रत्यय व्याकरणिक रूप से एकवचन है, किंतु उसका सामूहिक संदर्भ मिस्रियों से है; हिन्दी में बहुवचन संबंधवाचक ‘उनके’ स्वाभाविक है।
- source_word: וְעַל פָּרָשָׁיו
  choice: और उनके घुड़सवारों के ऊपर
  rationale: פָּרָשָׁיו सवार योद्धाओं को दर्शाता है; ‘घुड़सवार’ सीधा और सामान्य हिन्दी शब्द है, जबकि अधिक तकनीकी ‘अश्वारोही सेना’ अनावश्यक व्याख्या जोड़ती।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ में उपाधि नहीं बल्कि चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम है। ‘याहवे’ प्रचलित विद्वत्तापूर्ण पुनर्निर्मित उच्चारण का देवनागरी रूप है और नाम को नाम के रूप में सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। परमेश्वर द्वारा मूसा को दी गई एकवचन आज्ञा के लिए ‘बढ़ा’ मूल की सीधी आज्ञार्थक शक्ति को बनाए रखता है। ‘पानी’ सामान्य पाठक के लिए ‘जलराशियाँ’ से अधिक स्वाभाविक है।
