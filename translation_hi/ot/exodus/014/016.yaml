base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/016.yaml
  text: But as for you[a], lift up your staff and stretch out your hand over the sea and split it, so that the sons of Israel may go through the midst of the sea on dry ground.
translation:
  language: hi
  text: परन्तु तू अपनी लाठी उठा और अपना हाथ समुद्र के ऊपर बढ़ाकर उसे चीर दे, ताकि इस्राएल के पुत्र[a] सूखी भूमि पर समुद्र के बीच से होकर निकल जाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘इस्राएली लोग’ अथवा ‘इस्राएल की सन्तान।’ इब्रानी में शाब्दिक रूप से ‘इस्राएल के पुत्र’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: परन्तु तू
  rationale: संयोजक के साथ स्वतंत्र सर्वनाम मूसा पर विरोधात्मक बल देता है; पहले लोगों को आगे बढ़ने को कहा गया है, अब मूसा को विशेष कार्य सौंपा जाता है।
- source_word: הָרֵם אֶת מַטְּךָ
  choice: अपनी लाठी उठा
  rationale: हिफ़ील आज्ञार्थक ऊँचा उठाने का निर्देश देता है; מַטֶּה के लिए कथा-संदर्भ में ‘लाठी’ स्वाभाविक और स्पष्ट है।
- source_word: וּנְטֵה אֶת יָדְךָ עַל הַיָּם
  choice: और अपना हाथ समुद्र के ऊपर बढ़ाकर
  rationale: נטה हाथ फैलाने या बढ़ाने की क्रिया है और עַל इस संकेत में समुद्र के ऊपर की दिशा/स्थिति बताता है।
- source_word: וּבְקָעֵהוּ
  choice: उसे चीर दे
  rationale: בקע का ठोस अर्थ फाड़ना या चीरकर अलग करना है; ‘चीर दे’ जल के विभाजन की सजीव छवि बनाए रखता है।
- source_word: וְיָבֹאוּ
  choice: ताकि ... निकल जाएँ
  rationale: आज्ञाओं के बाद वाव-सहित अपूर्ण क्रिया अपेक्षित परिणाम या उद्देश्य बताती है; पूरे प्रसंग में समुद्र पार करने की गति के लिए ‘निकल जाएँ’ स्वाभाविक है।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्र
  rationale: यह इब्रानी के स्पष्ट पुल्लिंग बहुवचन संबंध-रूप को निकटता से सुरक्षित रखता है; संदर्भ में यह पूरे इस्राएली समुदाय को सूचित करता है।
- source_word: בְּתוֹךְ הַיָּם
  choice: समुद्र के बीच से होकर
  rationale: בְּתוֹךְ समुद्र के आंतरिक या मध्य भाग को दर्शाता है; ‘बीच से होकर’ स्थानिक चित्र और पारगमन दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בַּיַּבָּשָׁה
  choice: सूखी भूमि पर
  rationale: यह संज्ञा समुद्र के विपरीत सूखी जमीन को दर्शाती है और चमत्कार के भौतिक परिणाम को स्पष्ट रखती है।
theological_decisions:
- issue: בְנֵי יִשְׂרָאֵל में लिंग-सूचक मूल रूप
  choice: इस्राएल के पुत्र
  alternative: इस्राएली; इस्राएल की सन्तान
  rationale: मूल पाठ के ‘पुत्र’ रूप को बनाए रखा गया है, जबकि पादटिप्पणी स्पष्ट करती है कि प्रसंग में आशय सम्पूर्ण इस्राएली समुदाय से है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सीधी आज्ञात्मक शैली रखी गई है। ईश्वर द्वारा मूसा को एकवचन सम्बोधन होने के कारण ‘तू’ मूल के निकट है; वाक्य में ‘परन्तु’ मूसा पर दिए गए विरोधात्मक बल को दर्शाता है।
