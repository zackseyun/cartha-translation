source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר יְהֹוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/001.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: hi
  text: तब यहोवा ने मूसा से कहा,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: तब … कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है, इसलिए ‘तब’ उसके क्रमिक बल को व्यक्त करता है। דבר के साथ לֵאמֹר की संयुक्त वाक्य-रचना को स्वाभाविक आधुनिक हिन्दी में ‘कहा’ कहना पर्याप्त और स्पष्ट है।
- source_word: יְהֹוָה
  choice: यहोवा
  rationale: यह परमेश्वर के विशिष्ट वाचा-नाम YHWH का हिन्दी में प्रचलित लिप्यंतरण है और मूल पाठ में आए नाम को पदवी से प्रतिस्थापित नहीं करता।
- source_word: אֶל
  choice: से
  rationale: हिन्दी में ‘किसी से कहना’ वाणी के संबोधित व्यक्ति को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מֹשֶׁה
  choice: मूसा
  rationale: इस इब्रानी व्यक्तिगत नाम का मानक और व्यापक रूप से पहचाना जाने वाला हिन्दी रूप।
- source_word: לֵּאמֹר
  choice: कहा
  rationale: यह रूप आगे आने वाली वाणी का परिचय देता है। अलग से ‘यह कहते हुए’ जोड़ना हिन्दी में अनावश्यक रूप से भारी होता; मुख्य क्रिया के साथ ‘कहा’ इस सूत्र का स्वाभाविक समतुल्य है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में विशिष्ट नाम YHWH है। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में परिचित लिप्यंतरण है; ‘प्रभु’ नाम को पदवी में बदल देता, जबकि ‘याहवे’ वैकल्पिक विद्वत्तापूर्ण स्वरूप है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। इब्रानी ‘वह बोला … यह कहते हुए’ की पुनरुक्त संरचना को हिन्दी के स्वाभाविक ‘ने … से कहा’ में व्यक्त किया गया है।
