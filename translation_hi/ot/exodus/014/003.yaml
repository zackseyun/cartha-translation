base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/003.yaml
  text: For Pharaoh will say of the sons of Israel[a], ‘They are confused in the land[c][b]; the wilderness has shut them in.’
translation:
  language: hi
  text: क्योंकि फ़िरौन इस्राएल के पुत्रों[a] के विषय में कहेगा, “वे इस देश में दिशाहीन हैं[b]; निर्जन प्रदेश ने उन्हें घेर लिया है[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “इस्राएल के पुत्रों।” इसका अर्थ इस्राएली लोग है।
    reason: lexical_alternative
  - marker: b
    text: या “वे इस देश में उलझन में पड़े हैं,” अथवा “वे इस देश में भटक गए हैं।” इब्रानी शब्द असमंजस, दिशाभ्रम या फँस जाने की अवस्था व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: c
    text: या “निर्जन प्रदेश ने उन्हें चारों ओर से बंद कर दिया है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַר
  choice: क्योंकि ... कहेगा
  rationale: संदर्भ में यह फ़िरौन की आगामी प्रतिक्रिया की भविष्यवाणी है। आरंभिक וְ का यहाँ व्याख्यात्मक संबंध है, जिसे स्वाभाविक हिन्दी में ‘क्योंकि’ व्यक्त करता है।
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों के विषय में
  rationale: אמר के साथ ל कथन के विषय को सूचित कर सकता है। ‘इस्राएल के पुत्र’ मूल इब्रानी पदबंध को बनाए रखता है।
- source_word: נְבֻכִים
  choice: दिशाहीन हैं
  rationale: यह कृदंत उलझन, असमंजस या रास्ता न सूझने की अवस्था बता सकता है। ‘दिशाहीन’ प्रसंगानुकूल है और मूल में स्पष्ट न किए गए भटकने के कार्य को अनावश्यक रूप से नहीं जोड़ता।
- source_word: בָּאָרֶץ
  choice: इस देश में
  rationale: אֶרֶץ का सामान्य अर्थ ‘देश/भूमि’ है। ‘इस देश में’ हिन्दी में स्वाभाविक है और यह तय नहीं करता कि संकेत मिस्र की सीमा की ओर है या व्यापक भूभाग की ओर।
- source_word: סָגַר עֲלֵיהֶם
  choice: उन्हें घेर लिया है
  rationale: यह मुहावरा चारों ओर से बंद हो जाने या फँस जाने का भाव देता है। ‘घेर लिया है’ बिंब को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
- source_word: הַמִּדְבָּר
  choice: निर्जन प्रदेश
  rationale: מִדְבָּר केवल रेतीले मरुस्थल को नहीं, बल्कि निर्जन और अकृषित भूभाग को भी दर्शाता है; इसलिए ‘निर्जन प्रदेश’ अर्थ को अनावश्यक रूप से सीमित नहीं करता।
