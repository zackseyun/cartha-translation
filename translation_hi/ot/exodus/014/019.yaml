id: EXO.14.19
reference: Exodus 14:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּסַּ֞ע מַלְאַ֣ךְ הָ/אֱלֹהִ֗ים הַ/הֹלֵךְ֙ לִ/פְנֵי֙ מַחֲנֵ֣ה יִשְׂרָאֵ֔ל וַ/יֵּ֖לֶךְ מֵ/אַחֲרֵי/הֶ֑ם וַ/יִּסַּ֞ע עַמּ֤וּד הֶֽ/עָנָן֙ מִ/פְּנֵי/הֶ֔ם וַ/יַּֽעֲמֹ֖ד מֵ/אַחֲרֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/019.yaml
  text: Then the angel of God[a], who had been going before the camp of Israel, moved and went behind them; and the pillar of cloud moved from before them and stood behind them.
translation:
  language: hi
  text: तब परमेश्वर का दूत[a], जो इस्राएल की छावनी के आगे-आगे चल रहा था, वहाँ से हटकर उनके पीछे चला गया; और बादल का खम्भा भी उनके आगे से हटकर उनके पीछे खड़ा हो गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘परमेश्वर का स्वर्गदूत।’ इब्रानी शब्द का अर्थ ‘दूत’ या ‘स्वर्गदूत’ दोनों हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסַּע
  choice: वहाँ से हटकर
  rationale: נסע के मूल अर्थ में स्थान छोड़ना या आगे बढ़ना शामिल है। यहाँ यात्रा आरम्भ करने के बजाय आगे की स्थिति से पीछे की ओर स्थान बदलना अभिप्रेत है; इसलिए ‘वहाँ से हटकर’ प्रसंगानुकूल और स्वाभाविक है।
- source_word: מַלְאַךְ הָאֱלֹהִים
  choice: परमेश्वर का दूत
  rationale: מַלְאָךְ का अर्थ ‘दूत’ या ‘स्वर्गदूत’ हो सकता है। ‘दूत’ मूल शब्द की व्यापकता और इस व्यक्ति की प्रकृति से जुड़ी अस्पष्टता बनाए रखता है; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: הַהֹלֵךְ
  choice: चल रहा था
  rationale: हिब्रू कृदन्त पूर्व से जारी क्रिया को दर्शाता है। हिन्दी का अपूर्ण भूतकाल ‘चल रहा था’ उस निरन्तर पूर्ववर्ती गतिविधि को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לִפְנֵי מַחֲנֵה יִשְׂרָאֵל
  choice: इस्राएल की छावनी के आगे-आगे
  rationale: यह स्थानसूचक पद है। ‘आगे-आगे’ मार्गदर्शक की अग्रिम स्थिति और चलने की निरन्तरता दोनों को स्पष्ट करता है।
- source_word: וַיֵּלֶךְ מֵאַחֲרֵיהֶם
  choice: उनके पीछे चला गया
  rationale: מֵאַחֲרֵי यहाँ पीछा करने की क्रिया नहीं, बल्कि पीछे की स्थिति बताता है। यह हिन्दी वाक्यांश उसी स्थान-परिवर्तन को स्पष्ट रखता है।
- source_word: עַמּוּד הֶעָנָן
  choice: बादल का खम्भा
  rationale: यह पद ठोस दृश्य बिम्ब और हिब्रू रचना दोनों को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: מִפְּנֵיהֶם
  choice: उनके आगे से
  rationale: स्थानसूचक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है और पहले आए ‘आगे-आगे’ से अर्थगत संगति रखता है।
- source_word: וַיַּעֲמֹד
  choice: खड़ा हो गया
  rationale: עמד का सामान्य अर्थ ‘खड़ा होना’ है। ‘खड़ा हो गया’ नई स्थिर स्थिति ग्रहण करने को हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: מַלְאַךְ הָאֱלֹהִים की पहचान और प्रकृति
  choice: ‘परमेश्वर का दूत’ रखा गया है और उसकी सत्ता या प्रकृति को अधिक स्पष्ट नहीं किया गया।
  alternative: ‘परमेश्वर का स्वर्गदूत’, अथवा इसे परमेश्वर के प्रत्यक्ष प्राकट्य के रूप में स्पष्ट करना।
  rationale: हिब्रू पाठ इस पात्र को नाम देता है, पर इस पद में यह निर्धारित नहीं करता कि वह सृजित स्वर्गदूत है, परमेश्वर का प्राकट्य है, या उसकी कोई अन्य विशिष्ट पहचान है। ‘दूत’ और पादटिप्पणी मूल भाषिक अस्पष्टता तथा धर्मवैज्ञानिक तनाव को सुरक्षित रखते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किन्तु सहज शैली अपनाई गई है। ‘इस्राएल’, ‘छावनी’ और ‘बादल का खम्भा’ बाइबलीय संदर्भ के परिचित शब्द हैं; वाक्य की समानान्तर संरचना मूल पाठ की गति और स्थान-परिवर्तन को बनाए रखती है।
