source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֣ה אֶל הָ/עָם֮ אַל תִּירָאוּ֒ הִֽתְיַצְב֗וּ וּ/רְאוּ֙ אֶת יְשׁוּעַ֣ת יְהוָ֔ה אֲשֶׁר יַעֲשֶׂ֥ה לָ/כֶ֖ם הַ/יּ֑וֹם כִּ֗י אֲשֶׁ֨ר רְאִיתֶ֤ם אֶת מִצְרַ֨יִם֙ הַ/יּ֔וֹם לֹ֥א תֹסִ֛יפוּ לִ/רְאֹתָ֥/ם ע֖וֹד עַד עוֹלָֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/013.yaml
  text: And Moses said to the people, “Do not fear. Stand firm, and see the salvation of the LORD, which he will accomplish for you today; for the Egyptians whom you see today, you will never see again forever.”
translation:
  language: hi
  text: मूसा ने लोगों से कहा, “मत डरो। स्थिर खड़े रहो और यहोवा का वह उद्धार देखो जो वह आज तुम्हारे लिए करेगा; क्योंकि जिन मिस्रियों को तुम आज देख रहे हो, उन्हें तुम फिर कभी नहीं देखोगे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל תִּירָאוּ
  choice: मत डरो
  rationale: निषेध और भय के सामान्य, सीधे अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הִתְיַצְבוּ
  choice: दृढ़ खड़े रहो
  rationale: हिब्रू में अपना स्थान लेकर स्थिर रहने का भाव है; केवल ‘खड़े रहो’ की अपेक्षा ‘दृढ़’ प्रसंगगत आग्रह को स्पष्ट करता है।
- source_word: יְשׁוּעַת יְהוָה
  choice: उस उद्धार को ... जो यहोवा ... करेगा
  rationale: יְשׁוּעָה का अर्थ यहाँ संकट से छुटकारा/विजय है; ‘उद्धार’ व्यापक बाइबिलीय अर्थ बनाए रखता है। दिव्य नाम יהוה को ‘यहोवा’ के रूप में लिप्यंतरित किया गया है।
- source_word: יַעֲשֶׂה לָכֶם
  choice: तुम्हारे लिए करेगा
  rationale: क्रिया और लाभार्थी संबंध का सीधा तथा सहज हिन्दी रूप।
- source_word: לֹא תֹסִיפוּ לִרְאֹתָם עוֹד עַד עוֹלָם
  choice: उन्हें फिर कभी नहीं देखोगे
  rationale: हिब्रू के संचयी निषेध और עַד עוֹלָם की स्थायी अंतिमता को मुहावरेदार हिन्दी ‘फिर कभी नहीं’ में व्यक्त करता है।
theological_decisions:
- issue: יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में सामान्य उपाधि नहीं, परमेश्वर का विशिष्ट नाम है; लिप्यंतरण यह भेद सुरक्षित रखता है।
- issue: יְשׁוּעָה का आशय
  choice: उद्धार
  alternative: छुटकारा / विजय
  rationale: इस प्रसंग में भौतिक मुक्ति प्रमुख है, पर व्यापक शब्द ‘उद्धार’ मूल की अर्थ-समृद्धि और आगे की धर्मवैचारिक प्रतिध्वनि को अनावश्यक रूप से सीमित नहीं करता।
- issue: עַד עוֹלָם की अंतिमता
  choice: फिर कभी नहीं
  alternative: फिर कभी सदा तक नहीं
  rationale: हिन्दी में ‘फिर कभी नहीं’ पूर्ण और स्थायी निषेध व्यक्त करता है; ‘सदा तक’ जोड़ने पर वाक्य अस्वाभाविक और पुनरुक्तिपूर्ण होता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक रूप से सहज रखी गई है। आज्ञाएँ संक्षिप्त हैं और कथन में मूल हिब्रू का आश्वासन तथा निर्णायक अंतिमता सुरक्षित है।
