source:
  edition: WLC
  text: וַ/יַּ֨רְא יִשְׂרָאֵ֜ל אֶת הַ/יָּ֣ד הַ/גְּדֹלָ֗ה אֲשֶׁ֨ר עָשָׂ֤ה יְהוָה֙ בְּ/מִצְרַ֔יִם וַ/יִּֽירְא֥וּ הָ/עָ֖ם אֶת יְהוָ֑ה וַ/יַּֽאֲמִ֨ינוּ֙ בַּֽ/יהוָ֔ה וּ/בְ/מֹשֶׁ֖ה עַבְדּֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/031.yaml
  text: Israel saw the great hand that Yahweh had done against Egypt[a], and the people feared Yahweh[b], and they believed in Yahweh and in Moses his servant.
translation:
  language: hi
  text: इस्राएल ने उस महान सामर्थ्य को देखा जो यहोवा ने मिस्र पर दिखाई थी[a]। लोगों ने यहोवा का भय मानने लगे और यहोवा पर तथा उसके सेवक मूसा पर विश्वास किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “वह महान हाथ जो यहोवा ने मिस्र में किया।” यहाँ “हाथ” सामर्थ्य का बिंब है। इब्रानी में “मिस्र में” का अर्थ संदर्भ के अनुसार “मिस्र पर” या “मिस्र के विरुद्ध” भी हो सकता है।
    reason: ‘महान हाथ’ के शाब्दिक बिंब तथा בְמִצְרַיִם के सम्भव अर्थों को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: וַיַּרְא
  choice: देखा
  rationale: यह क्रिया हाल में घटी घटना के प्रत्यक्ष बोध को व्यक्त करती है; ‘देखा’ इसका सीधा और स्वाभाविक कथात्मक अनुवाद है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: इब्रानी में यह पूरे समुदाय के लिए एकवचन सामूहिक संज्ञा है; इसे बनाए रखने से आगे आए ‘लोगों’ के साथ मूल शैली भी बनी रहती है।
- source_word: הַיָּד הַגְּדֹלָה
  choice: उस महान हाथ
  rationale: शाब्दिक बिंब ‘महान हाथ’ को रखा गया है, क्योंकि निर्गमन में ‘हाथ’ यहोवा की सामर्थ्य का बार-बार आने वाला बिंब है।
- source_word: אֲשֶׁר עָשָׂה יְהוָה בְּמִצְרַיִם
  choice: जिसे यहोवा ने मिस्र के विरुद्ध प्रकट किया था
  rationale: हिन्दी में हाथ को ‘करना’ अस्वाभाविक है। ‘प्रकट किया’ עשה के परिणामकारी भाव को हाथ के बिंब के साथ स्वाभाविक बनाता है, जबकि ‘मिस्र के विरुद्ध’ संदर्भ में בְ की विरोधात्मक दिशा व्यक्त करता है; अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार-अक्षरीय दिव्य नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नामरूप ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: וַיִּירְאוּ
  choice: भय माना
  rationale: यह ירא के भय वाले मूल अर्थ को बनाए रखता है और हिन्दी में श्रद्धामिश्रित भय के लिए स्वाभाविक है, बिना इसे केवल आतंक या केवल आदर तक सीमित किए।
- source_word: וַיַּאֲמִינוּ בַּיהוָה
  choice: यहोवा पर विश्वास किया
  rationale: אמן के हिफ़ील रूप के साथ בְ विश्वास और भरोसे का संबंध बताता है; ‘पर विश्वास किया’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: וּבְמֹשֶׁה עַבְדּוֹ
  choice: तथा उसके सेवक मूसा पर
  rationale: सर्वनाम यहोवा की ओर संकेत करता है और मूसा को उसके अधीन सेवक के रूप में पहचानता है; साथ ही दोनों पदों के साथ एक ही विश्वास-निर्माण बना रहता है।
theological_decisions:
- issue: मूसा के प्रति इस्राएल के विश्वास का स्वरूप
  choice: लोगों ने यहोवा पर और उसके सेवक मूसा पर विश्वास किया।
  alternative: लोगों ने यहोवा और मूसा की बात पर विश्वास किया; अथवा उन्होंने मूसा पर व्यक्तिगत रूप से भरोसा किया।
  rationale: मूल में אמן + בְ दोनों—यहोवा और मूसा—के साथ आता है। समान व्याकरणिक रचना को रखा गया है, पर ‘उसके सेवक’ मूसा की अधीन और अधिकृत भूमिका स्पष्ट करता है; इससे यहोवा और मूसा की समानता नहीं जताई जाती।
- issue: यहोवा के प्रति लोगों का भय
  choice: यहोवा का भय माना
  alternative: यहोवा से डर गए; अथवा यहोवा के प्रति श्रद्धा से भर गए।
  rationale: मूल क्रिया भय, विस्मय और श्रद्धा की परास रख सकती है। चुना हुआ वाक्यांश इस तनाव को खुला रखता है और किसी एक भाव तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण पर सामान्य पाठक के लिए सहज। ‘महान हाथ’ का बाइबलीय बिंब सुरक्षित रखा गया है। वाक्य को स्वाभाविक हिन्दी प्रवाह के लिए दो भागों में बाँटा गया है; दिव्य नाम के लिए ‘यहोवा’ और विश्वास के लिए ‘पर विश्वास किया’ प्रयुक्त हैं।
