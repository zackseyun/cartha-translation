source:
  edition: WLC
  text: הֲ/לֹא זֶ֣ה הַ/דָּבָ֗ר אֲשֶׁר֩ דִּבַּ֨רְנוּ אֵלֶ֤י/ךָ בְ/מִצְרַ֨יִם֙ לֵ/אמֹ֔ר חֲדַ֥ל מִמֶּ֖/נּוּ וְ/נַֽעַבְדָ֣ה אֶת מִצְרָ֑יִם כִּ֣י ט֥וֹב לָ֨/נוּ֙ עֲבֹ֣ד אֶת מִצְרַ֔יִם מִ/מֻּתֵ֖/נוּ בַּ/מִּדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/012.yaml
  text: Is this not the word that we spoke to you in Egypt, saying, ‘Leave us alone so that we may serve the Egyptians’? For it would have been better for us to serve the Egyptians than to die in the wilderness.
translation:
  language: hi
  text: क्या यह वह बात नहीं है जो हमने मिस्र में तुमसे कही थी, ‘हमें छोड़ दो, और हमें मिस्रियों की सेवा करने दो’? क्योंकि मरुभूमि में मरने से हमारे लिए मिस्रियों की सेवा करना बेहतर होता।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַדָּבָר
  choice: बात
  rationale: यहाँ ‘वचन’ की अपेक्षा पिछली कही हुई बात या कथन का संकेत है; आधुनिक हिन्दी में ‘बात’ स्वाभाविक और अर्थ-सटीक है।
- source_word: חֲדַל מִמֶּנּוּ
  choice: हमें हमारे हाल पर छोड़ दो
  rationale: मुहावरे का आशय उनसे हस्तक्षेप न करने की माँग है; यह हिन्दी अभिव्यक्ति ‘हमसे रुक जाओ’ जैसे अस्वाभाविक शाब्दिक रूप से अधिक स्पष्ट है।
- source_word: וְנַעַבְדָה אֶת־מִצְרָיִם
  choice: ताकि हम मिस्रियों की सेवा करते रहें
  rationale: וְ के प्रसंगगत परिणाम/उद्देश्य को ‘ताकि’ से व्यक्त किया गया है; संदर्भ बताता है कि वे पहले से दास-सेवा कर रहे थे, इसलिए ‘करते रहें’ स्वाभाविक है। מִצְרַיִם को यहाँ देश नहीं, मिस्री स्वामियों/लोगों के अर्थ में लिया गया है।
- source_word: כִּי טוֹב לָנוּ עֲבֹד ... מִמֻּתֵנוּ
  choice: क्योंकि जंगल में मरने से तो हमारे लिए मिस्रियों की सेवा करना ही अच्छा होता
  rationale: हिब्रू में ‘अच्छा है’ का रूप है, पर वक्ता अतीत में छोड़े गए विकल्प की तुलना वर्तमान संभावित मृत्यु से कर रहे हैं; हिन्दी का ‘अच्छा होता’ उस प्रतिकल्पित आशय को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: मिस्र की दासता के विषय में इस्राएलियों के कथन का काल और भाव
  choice: ‘सेवा करते रहें’ और ‘अच्छा होता’
  alternative: ‘सेवा करें’ और ‘अच्छा है’
  rationale: यह वर्णनकर्ता का धर्मशास्त्रीय निर्णय नहीं, भयभीत लोगों का प्रतिकल्पित कथन है। चुना हुआ रूप ऐतिहासिक प्रसंग स्पष्ट करता है, बिना उनके दावे को सत्य ठहराए।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। प्रश्नवाचक आरंभ और शिकायत का तीखा स्वर सुरक्षित है। ‘मिस्रियों की सेवा’ दासता के लिए मूल पाठ का संयत शब्द-प्रयोग बनाए रखता है।
