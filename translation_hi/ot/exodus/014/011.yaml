  text: וַ/יֹּאמְרוּ֮ אֶל מֹשֶׁה֒ הַֽ/מִ/בְּלִ֤י אֵין קְבָרִים֙ בְּ/מִצְרַ֔יִם לְקַחְתָּ֖/נוּ לָ/מ֣וּת בַּ/מִּדְבָּ֑ר מַה זֹּאת֙ עָשִׂ֣יתָ לָּ֔/נוּ לְ/הוֹצִיאָ֖/נוּ מִ/מִּצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/011.yaml
  text: And they said to Moses[a], “Was it because there were no graves in Egypt that you took us away to die in the wilderness? What is this you have done to us by bringing us out of Egypt?”
translation:
  language: hi
  text: उन्होंने मूसा से कहा, “क्या मिस्र में कब्रें नहीं थीं कि तुम हमें जंगल में मरने के लिए ले आए? हमें मिस्र से निकालकर तुमने हमारे साथ यह क्या किया?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֶל־מֹשֶׁה
  choice: उन्होंने मूसा से कहा
  rationale: אמר का सामान्य कथात्मक अर्थ ‘कहा’ है, और אֶל भाषण की दिशा बताता है; आधुनिक हिन्दी में यह स्वाभाविक कथात्मक रूप है।
- source_word: הֲמִבְּלִי אֵין קְבָרִים בְּמִצְרַיִם
  choice: क्या मिस्र में कब्रें नहीं थीं
  rationale: यह व्यंग्यपूर्ण आलंकारिक प्रश्न है। हिन्दी का यह रूप मूल के आरोप और विडंबना को स्वाभाविक ढंग से बनाए रखता है।
- source_word: לְקַחְתָּנוּ
  choice: तुम हमें ... यहाँ ले आए
  rationale: לקח का मूल भाव ‘लेना/ले जाना’ है। प्रसंग में वक्ताओं के वर्तमान स्थान की ओर गति के कारण ‘यहाँ ले आए’ स्वाभाविक है और आगे के הוציא (‘निकालना’) से lexical भेद बनाए रखता है।
- source_word: לָמוּת בַּמִּדְבָּר
  choice: जंगल में मरने के लिए
  rationale: मूल के उद्देश्य/परिणामसूचक infinitive को ‘मरने के लिए’ से व्यक्त किया गया है। מִדְבָּר के लिए निर्जन, असंवर्धित प्रदेश के अर्थ में प्रचलित बाइबलीय हिन्दी ‘जंगल’ चुना गया है।
- source_word: מַה־זֹּאת עָשִׂיתָ לָּנוּ
  choice: तुमने हमारे साथ यह क्या किया
  rationale: विस्मय और आरोप से भरे मूल प्रश्न की संरचना को स्वाभाविक हिन्दी में निकटता से रखा गया है; इसे केवल ‘तुमने ऐसा क्यों किया’ बनाकर अर्थ को कारण-प्रश्न तक सीमित नहीं किया गया।
- source_word: לְהוֹצִיאָנוּ מִמִּצְרָיִם
  choice: हमें मिस्र से निकालकर
  rationale: הוציא का causative अर्थ ‘बाहर निकालना’ है। ‘निकालकर’ पूर्ववर्ती शिकायत से क्रिया का संबंध स्पष्ट करता है और निर्गमन की शब्दावली बनाए रखता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। व्यंग्यपूर्ण प्रश्न तथा लोगों का तीखा आरोप सुरक्षित है। ‘जंगल’ यहाँ वन नहीं, निर्जन/वीरान प्रदेश के प्रचलित बाइबलीय अर्थ में है।
