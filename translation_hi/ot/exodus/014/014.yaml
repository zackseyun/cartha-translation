source:
  edition: WLC
  text: יְהוָ֖ה יִלָּחֵ֣ם לָ/כֶ֑ם וְ/אַתֶּ֖ם תַּחֲרִישֽׁוּ/ן׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/014.yaml
  text: Yahweh will fight for you[a], and you must be silent.
translation:
  language: hi
  text: याहवे तुम्हारे लिए लड़ेगा, और तुम चुप रहोगे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम चुप रहो,” अथवा “तुम्हें चुप रहना है।”
    reason: क्रिया का अपूर्ण रूप भविष्यसूचक कथन या प्रसंगानुसार निर्देश—दोनों अर्थ दे सकता है।
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: יִלָּחֵם
  choice: लड़ेगा
  rationale: निफ़अल अपूर्ण रूप यहाँ आने वाली कार्रवाई को व्यक्त करता है; सामान्य आधुनिक हिन्दी में ‘लड़ेगा’ सैन्य अर्थ को स्वाभाविक रूप से बनाए रखता है।
- source_word: לָכֶם
  choice: तुम्हारे लिए
  rationale: ल उपसर्ग और द्वितीय पुरुष बहुवचन प्रत्यय इस्राएल के पक्ष में अथवा उसकी ओर से किए जाने वाले कार्य का भाव देते हैं।
- source_word: וְאַתֶּם
  choice: और तुम
  rationale: मूल समुच्चय और स्वतंत्र सर्वनाम को बनाए रखते हुए याहवे के कार्य और लोगों की निष्क्रियता के बीच का विरोध उभरता है।
- source_word: תַּחֲרִישׁוּן
  choice: चुप रहोगे
  rationale: हिफ़ईल अपूर्ण रूप का मूल अर्थ चुप रहना है। भविष्यसूचक रूप हिन्दी में स्वाभाविक है, जबकि प्रसंग में संभावित आज्ञार्थक बल को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है; ‘याहवे’ उसका लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
- issue: תַּחֲרִישׁוּן का कथनात्मक या आज्ञार्थक बल
  choice: तुम चुप रहोगे
  alternative: तुम चुप रहो; तुम्हें चुप रहना है
  rationale: रूपतः यह अपूर्ण क्रिया है और भविष्यसूचक कथन हो सकता है, पर मूसा के प्रोत्साहन के प्रसंग में इसे निर्देश भी समझा जा सकता है। मुख्य पाठ रूपगत अर्थ रखता है और पादटिप्पणी संभावित आज्ञार्थक अर्थ बताती है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘याहवे’ व्यक्तिगत ईश्वरीय नाम का लिप्यंतरण है। एकवचन कर्ता के अनुरूप ‘लड़ेगा’ रखा गया है; बहुवचन समुदाय को हिन्दी के सामान्य ‘तुम’ से संबोधित किया गया है।
