id: EXO.14.15
reference: Exodus 14:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה מַה תִּצְעַ֖ק אֵלָ֑/י דַּבֵּ֥ר אֶל בְּנֵי יִשְׂרָאֵ֖ל וְ/יִסָּֽעוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/015.yaml
  text: Then Yahweh said to Moses[b][a], “Why are you crying out to me? Tell the sons of Israel to set out.”
translation:
  language: hi
  text: तब याहवे ने मूसा से कहा, “तुम मेरी दुहाई क्यों दे रहे हो? इस्राएल के पुत्रों[a] से कहो कि वे कूच करें[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस्राएलियों।”
    reason: lexical_alternative
  - marker: b
    text: या “आगे बढ़ें।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने ... कहा
  rationale: वाव-क्रमागत रूप कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में उसके क्रमिक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम का लिप्यंतरण किया गया है, उसे किसी उपाधि से नहीं बदला गया।
- source_word: מַה תִּצְעַק אֵלָי
  choice: तुम मेरी दुहाई क्यों दे रहे हो?
  rationale: यहाँ מַה प्रश्नवाचक फटकार में ‘क्यों’ का अर्थ देता है, और צעק संकट में सहायता के लिए पुकारने को दर्शाता है; ‘दुहाई देना’ इस भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: דַּבֵּר אֶל
  choice: से कहो
  rationale: शाब्दिक ‘से बोलो’ की अपेक्षा ‘से कहो’ निर्देशात्मक बल को सहज हिन्दी में रखता है, बिना इसे अनावश्यक रूप से ‘आज्ञा दो’ बनाने के।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: यह चयन इब्रानी के पुरुषवाचक संबंध-पदबंध को स्पष्ट रूप से सुरक्षित रखता है; अधिक मुहावरेदार ‘इस्राएलियों’ को पादटिप्पणी में दिया गया है।
- source_word: וְיִסָּעוּ
  choice: कि वे कूच करें
  rationale: נסע यात्रा आरम्भ करने या पड़ाव से निकलने का बोध देता है। ‘कूच करें’ उस गतिशील अर्थ को संक्षेप में रखता है; प्रसंगानुकूल ‘आगे बढ़ें’ पादटिप्पणी में है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: व्यक्तिगत वाचा-नाम को शीर्षक से बदलने के बजाय लिप्यंतरित किया गया है; ‘याहवे’ उपलब्ध इब्रानी साक्ष्य के निकट प्रचलित रूप है।
- issue: בְּנֵי יִשְׂרָאֵל में पुरुषवाचक रूप
  choice: इस्राएल के पुत्रों
  alternative: इस्राएलियों
  rationale: मुख्य पाठ इब्रानी की औपचारिक पुरुषवाचक अभिव्यक्ति को बनाए रखता है, जबकि सामूहिक और अधिक स्वाभाविक विकल्प पादटिप्पणी में सुरक्षित है।
- issue: मूसा को संबोधित करते समय हिन्दी सर्वनाम
  choice: तुम
  alternative: तू; आप
  rationale: इब्रानी क्रिया एकवचन है पर आदरसूचक स्तर निर्दिष्ट नहीं करती। आधुनिक मानक हिन्दी में ‘तुम’ प्रत्यक्षता और गरिमा के बीच संतुलन रखता है; ‘तू’ अनावश्यक अवमानना और ‘आप’ अतिरिक्त आदरसूचक अर्थ ला सकता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। प्रत्यक्ष कथन में ‘तुम’ और ‘कहो’ स्वाभाविक हिन्दी देते हैं। पादटिप्पणी-चिह्न उन्हीं पदों पर लगाए गए हैं जिनके विकल्प दिए गए हैं।
