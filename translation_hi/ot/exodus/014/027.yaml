base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/027.yaml
  text: So Moses stretched out his hand over the sea[a], and toward morning the sea returned to its usual place, while the Egyptians were fleeing toward it[b]. And Yahweh threw the Egyptians into the midst of the sea.
translation:
  language: hi
  text: तब मूसा ने अपना हाथ समुद्र के ऊपर फैलाया, और भोर के समय समुद्र अपनी प्रबल, स्थायी अवस्था में लौट आया, जबकि मिस्री समुद्र की ओर भाग रहे थे। तब याहवे ने मिस्रियों को झटककर समुद्र के बीच में डाल दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּט
  choice: हाथ बढ़ाया
  rationale: נטה का ‘हाथ’ के साथ सामान्य अर्थ हाथ को फैलाना या आगे बढ़ाना है; यह स्वाभाविक हिन्दी में शारीरिक क्रिया को बनाए रखता है।
- source_word: לִפְנוֹת בֹּקֶר
  choice: भोर होते-होते
  rationale: यह पदबंध सुबह के मुड़ने या प्रकट होने, अर्थात भोर के समय की ओर संकेत करता है; हिन्दी में यह समयगत अर्थ सहज ढंग से व्यक्त होता है।
- source_word: לְאֵיתָנוֹ
  choice: अपनी पूरी शक्ति में
  rationale: אֵיתָן स्थायित्व, दृढ़ता या प्रबल सामान्य दशा को व्यक्त कर सकता है। यहाँ समुद्र का विभाजन समाप्त होकर उसका सामर्थ्यपूर्ण स्वभाव लौटना अभिप्रेत है; स्थान की धारणा मूल पद में स्पष्ट नहीं है।
- source_word: נָסִים לִקְרָאתוֹ
  choice: उसकी ओर भाग रहे थे
  rationale: נָסִים जारी क्रिया में भागने को और לִקְרָאתוֹ सामने/ओर की दिशा को बताता है। ‘उसकी’ का निकटतम संदर्भ समुद्र है; मूल की चौंकाने वाली दिशात्मकता सुरक्षित रखी गई है।
- source_word: וַיְנַעֵר
  choice: झटककर ... डाल दिया
  rationale: נער का मूल बिंब झाड़ने या झटकने का है। ‘झटककर ... डाल दिया’ हिन्दी में उस सजीव बिंब और परिणामकारी गति, दोनों को सुरक्षित रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबल-परंपरा में प्रचलित रूप ‘यहोवा’ इब्रानी व्यक्तिगत नाम יהוה को उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- source_word: בְּתוֹךְ הַיָּם
  choice: समुद्र के बीच में
  rationale: תּוֹךְ समुद्र के अंदरूनी या मध्य भाग को दर्शाता है। गति का भाव क्रिया ‘डाल दिया’ से स्पष्ट होता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल में व्यक्तिगत वाचा-नाम सीधे आया है। हिन्दी पाठक के लिए व्यापक रूप से पहचाना जाने वाला नामरूप ‘यहोवा’ रखा गया है, न कि उसे केवल ‘प्रभु’ उपाधि से प्रतिस्थापित किया गया।
- issue: समुद्र का לְאֵיתָנוֹ लौटना
  choice: अपनी पूरी शक्ति में
  alternative: अपनी पूर्व दशा में / अपने सामान्य स्थान पर
  rationale: אֵיתָן में स्थायी शक्ति और दृढ़ दशा की अर्थ-छाया है। ‘पूरी शक्ति’ उसी को सामने रखती है, जबकि ‘स्थान’ संदर्भजनित व्याख्या है, पद का सीधा अर्थ नहीं।
- issue: मिस्रियों का समुद्र की ओर भागना
  choice: उसकी ओर भाग रहे थे
  alternative: उससे दूर भाग रहे थे
  rationale: לִקְרָאתוֹ का औपचारिक दिशात्मक अर्थ ‘उसकी ओर/उससे मिलने को’ है। प्रसंग के आधार पर इसे उलटकर ‘दूर’ कहना मूल की वास्तविक कठिनाई को चुपचाप सुलझा देता; इसलिए तनाव बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कथा-शैली। वाक्य-विभाजन से लंबी इब्रानी समन्वयी रचना को हिन्दी में स्पष्ट बनाया गया है। किसी पंथ-विशेष की शब्दावली नहीं जोड़ी गई।
