  yaml_path: translation/ot/exodus/014/025.yaml
  text: And he removed the wheels from his chariots, and drove them with difficulty. And Egypt said, “Let me flee from before Israel, for the LORD is fighting for them against Egypt.”
translation:
  language: hi
  text: उसने उसके रथों के पहिए निकाल दिए[a], और उसे कठिनाई से चलाया। तब मिस्र ने कहा, “मैं इस्राएल के सामने से भाग निकलूँ, क्योंकि यहोवा उनकी ओर से मिस्र के विरुद्ध लड़ रहा है।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ प्राचीन पाठ-परंपराएँ और अनुवाद यहाँ ‘पहिए निकाल दिए’ के स्थान पर ‘पहियों को जाम कर दिया’ या ‘पहियों को बाँध दिया’ जैसा अर्थ दर्शाते हैं।
    reason: इस पद की प्राचीन पाठ-परंपराओं में क्रिया के पाठ/अर्थ को लेकर उल्लेखनीय भिन्नता है; मुख्य पाठ WLC के व्यंजन-पाठ और स्वरांकन का अनुसरण करता है।
  - marker: b
    text: 'हिब्रू में सामूहिक ‘मिस्र’ बोलता है, और क्रिया भी एकवचन है: शाब्दिक रूप से, ‘मैं भागूँ।’'
    reason: असामान्य एकवचन को मुख्य पाठ में बनाए रखते हुए पाठक को उसके सामूहिक संदर्भ की सूचना देना।
lexical_decisions:
- source_word: וַיָּסַר
  choice: निकाल दिए
  rationale: मूल क्रिया का सामान्य अर्थ ‘हटा देना/निकाल देना’ है; रथों के पहियों के संदर्भ में ‘निकाल दिए’ स्वाभाविक और ठोस है।
- source_word: אֹפַן מַרְכְּבֹתָיו
  choice: उसके रथों के पहिए
  rationale: मसोरेटिक पाठ में ‘उसके’ एकवचन प्रत्यय है, जो सामूहिक ‘मिस्र’ की ओर संकेत कर सकता है; इसी असामान्य संख्या-सामंजस्य को सुरक्षित रखा गया है।
- source_word: בִּכְבֵדֻת
  choice: कठिनाई से
  rationale: यह क्रियाविशेषण भारीपन अथवा कठिनाई से चलने का भाव देता है; ‘कठिनाई से’ दोनों को सहज हिंदी में व्यक्त करता है।
- source_word: מִצְרַיִם
  choice: मिस्रियों
  rationale: देश का नाम यहाँ सामूहिक रूप से मिस्री सेना/लोगों के लिए प्रयुक्त है; हिंदी में कथनकर्ता के रूप में ‘मिस्रियों’ अधिक स्वाभाविक है।
- source_word: אָנ֨וּסָה
  choice: मैं ... भाग निकलूँ
  rationale: हिब्रू रूप प्रथम पुरुष एकवचन है, यद्यपि वक्ता सामूहिक ‘मिस्र’ है; पाठ की वास्तविक संख्या-विषमता को बनाए रखा गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: ईश्वर के विशिष्ट हिब्रू नाम को सामान्य उपाधि में बदलने के बजाय प्रचलित हिंदी लिप्यंतरण से प्रस्तुत किया गया है।
theological_decisions:
- issue: मिस्र को सामूहिक एकवचन वक्ता के रूप में प्रस्तुत करना
  choice: ‘मिस्रियों ने कहा, “मैं...”’
  alternative: ‘मिस्रियों ने कहा, “हम...”’
  rationale: मूल में מִצְרַיִם के बाद प्रथम पुरुष एकवचन אָנ֨וּסָה है। सामूहिक पहचान और व्याकरणिक तनाव को बहुवचन बनाकर चुपचाप समतल नहीं किया गया।
- issue: यहोवा किसकी ओर से और किसके विरुद्ध लड़ता है
  choice: ‘उनकी ओर से मिस्रियों के विरुद्ध’
  alternative: ‘उनके लिए मिस्र से लड़ रहा है’
  rationale: 'לָהֶם और בְּמִצְרָיִם के संबंध को स्पष्ट, किंतु तटस्थ ढंग से व्यक्त किया गया है: इस्राएल के पक्ष में और मिस्र के विरुद्ध।'
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य में ‘उसके रथों’ तथा उद्धरण में ‘मैं’ मूल हिब्रू की सामूहिक एकवचन रचना को जानबूझकर सुरक्षित रखते हैं।
