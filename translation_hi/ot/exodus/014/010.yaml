source:
  edition: WLC
  text: וּ/פַרְעֹ֖ה הִקְרִ֑יב וַ/יִּשְׂאוּ֩ בְנֵֽי יִשְׂרָאֵ֨ל אֶת עֵינֵי/הֶ֜ם וְ/הִנֵּ֥ה מִצְרַ֣יִם נֹסֵ֣עַ אַחֲרֵי/הֶ֗ם וַ/יִּֽירְאוּ֙ מְאֹ֔ד וַ/יִּצְעֲק֥וּ בְנֵֽי יִשְׂרָאֵ֖ל אֶל יְהוָֽה־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/010.yaml
  text: As Pharaoh drew near[a], the sons of Israel lifted up their eyes, and behold, the Egyptians were marching after them; and they were very afraid[b], and the sons of Israel cried out to Yahweh.
translation:
  language: hi
  text: जब फ़िरौन निकट आया, तब इस्राएल के पुत्रों ने अपनी आँखें उठाईं। और देखा कि मिस्री[a] उनके पीछे चले आ रहे थे। वे बहुत डर गए और इस्राएल के पुत्रों ने याहवे की दुहाई दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में ‘मिस्र’; यहाँ यह नाम सामूहिक रूप से पीछा कर रही मिस्री शक्ति के लिए प्रयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִקְרִיב
  choice: निकट आया
  rationale: यहाँ हिफ़ील रूप का अर्थ कर्ता फ़िरौन के निकट आने से है; हिन्दी में यह सहज है और कथा का तनाव बनाए रखता है।
- source_word: וַיִּשְׂאוּ ... אֶת עֵינֵיהֶם
  choice: अपनी आँखें उठाईं
  rationale: इब्रानी मुहावरे की छवि को रखते हुए हिन्दी में बोधगम्य अभिव्यक्ति दी गई है।
- source_word: וְהִנֵּה
  choice: और देखा कि
  rationale: यह अचानक दिखाई देने और नाटकीय बोध का संकेत देता है; आधुनिक हिन्दी में ‘देखो’ की अपेक्षा यह कथा के भीतर अधिक स्वाभाविक है।
- source_word: מִצְרַיִם
  choice: मिस्री
  rationale: मूल में ‘मिस्र’ सामूहिक अर्थ में पीछा करती मिस्री शक्ति के लिए आया है; हिन्दी में केवल देश का नाम कर्ता बनाने की अस्पष्टता से बचने के लिए ‘मिस्री’ रखा गया है और मूल रूप को पादटिप्पणी में बताया गया है।
- source_word: נֹסֵעַ אַחֲרֵיהֶם
  choice: उनके पीछे चले आ रहे थे
  rationale: נסע के गतिशील अर्थ और पीछे आने की क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है, बिना ‘पीछा कर रहे थे’ कहकर क्रिया को आवश्यकता से अधिक विशिष्ट बनाए।
- source_word: וַיִּירְאוּ מְאֹד
  choice: वे बहुत डर गए
  rationale: क्रिया और तीव्रतासूचक מְאֹד का सरल, सशक्त और स्वाभाविक हिन्दी रूप।
- source_word: וַיִּצְעֲקוּ
  choice: दुहाई दी
  rationale: संकट में सहायता के लिए परमेश्वर को की गई व्याकुल पुकार का भाव व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले व्यक्तिगत ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिपि में लिप्यंतरित किया गया है।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: मूल के व्याकरणिक रूप और मानक सामूहिक राष्ट्रीय पदनाम को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: पाठ में व्यक्तिगत वाचा-नाम सीधे प्रयुक्त है; इसलिए उसे उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं किया गया और स्रोत-आधारित प्रचलित पुनर्निर्मित उच्चारण का हिन्दी लिप्यंतरण रखा गया है।
- issue: בְנֵי יִשְׂרָאֵל का सामूहिक, लिंगसूचक रूप
  choice: इस्राएल के पुत्रों
  alternative: इस्राएली
  rationale: मूल में ‘इस्राएल के पुत्र’ का पुरुषवाची सामूहिक पद है। अनुवाद ने इसे सामान्य जातिनाम में समतल करने के बजाय स्रोत की अभिव्यक्ति बनाए रखी है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और कथात्मक हिन्दी। ‘अपनी आँखें उठाईं’ जैसे स्रोत-मुहावरे को समझने योग्य रूप में बनाए रखा गया है; ‘दुहाई दी’ संकट में की गई तीव्र प्रार्थनापूर्ण पुकार को संक्षेप में व्यक्त करता है।
