  text: דַּבֵּר֮ אֶל בְּנֵ֣י יִשְׂרָאֵל֒ וְ/יָשֻׁ֗בוּ וְ/יַחֲנוּ֙ לִ/פְנֵי֙ פִּ֣י הַחִירֹ֔ת בֵּ֥ין מִגְדֹּ֖ל וּ/בֵ֣ין הַ/יָּ֑ם לִ/פְנֵי֙ בַּ֣עַל צְפֹ֔ן נִכְח֥/וֹ תַחֲנ֖וּ עַל הַ/יָּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/002.yaml
  text: Speak to the sons of Israel[a], that they turn back and camp before Pi-hahiroth, between Migdol and the sea. Before Baal-zephon, opposite it[c][b], you shall camp by the sea.
translation:
  language: hi
  text: इस्राएलियों[a] से कह कि वे मुड़कर पी-हहीरोत के सामने, मिग्दोल और समुद्र के बीच डेरा डालें। बाल-सफ़ोन के सामने, उसके आमने-सामने[b], समुद्र के किनारे डेरा डालो।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “इस्राएल के पुत्र।”
    reason: lexical_alternative
  - marker: b
    text: “उसके” का संकेत सम्भवतः बाल-सफ़ोन की ओर है। इसका अनुवाद “उसके विपरीत” भी हो सकता है।
    reason: referent_ambiguity
  - marker: c
    text: पी-हहीरोत, मिग्दोल और बाल-सफ़ोन स्थानों के नाम हैं; इसलिए यहाँ उनके अर्थ का अनुवाद न करके उनका लिप्यंतरण किया गया है।
    reason: cultural_note
lexical_decisions:
- source_word: דַּבֵּר אֶל־בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों से कह
  rationale: בְּנֵי יִשְׂרָאֵל का शाब्दिक रूप ‘इस्राएल के पुत्र’ है, पर आधुनिक हिन्दी में समुदाय के लिए ‘इस्राएली’ अधिक स्वाभाविक और समावेशी है; एकवचन ‘कह’ मूसा को संबोधित आदेश को बनाए रखता है।
- source_word: וְיָשֻׁבוּ וְיַחֲנוּ
  choice: कि वे मुड़कर … डेरा डालें
  rationale: दोनों क्रियाओं का आदेशात्मक आशय हिन्दी के संभावनार्थक ‘डालें’ से व्यक्त होता है; ‘मुड़कर’ दिशा उलटने का प्रसंगगत अर्थ रखता है।
- source_word: לִפְנֵי פִּי הַחִירֹת
  choice: पी-हहीरोत के सामने
  rationale: लִפְנֵי का स्थानवाचक अर्थ ‘के सामने’ है; פִּי הַחִירֹת को स्थान-नाम मानकर लिप्यंतरित किया गया है।
- source_word: בֵּין מִגְדֹּל וּבֵין הַיָּם
  choice: मिग्दोल और समुद्र के बीच
  rationale: בֵּין…וּבֵין की दोनों सीमाएँ सरल और ठीक हिन्दी में व्यक्त होती हैं।
- source_word: לִפְנֵי בַּעַל צְפֹן נִכְחוֹ
  choice: बाल-सपोन के सामने, उसके ठीक विपरीत
  rationale: दो निकटवर्ती स्थानवाचक अभिव्यक्तियों की पुनरुक्ति को बनाए रखा गया है। पुल्लिंग प्रत्यय का सम्भावित पूर्वपद बाल-सपोन है, पर इसकी संदर्भगत सम्भाव्यता पादटिप्पणी में स्पष्ट की गई है।
- source_word: תַחֲנוּ עַל־הַיָּם
  choice: तुम समुद्र के किनारे डेरा डालना
  rationale: द्वितीय पुरुष बहुवचन का प्रत्यक्ष निर्देश ‘तुम…डेरा डालना’ से स्वाभाविक आधुनिक हिन्दी में आता है; עַל यहाँ निकटता बताता है, इसलिए ‘किनारे’ चुना गया है।
