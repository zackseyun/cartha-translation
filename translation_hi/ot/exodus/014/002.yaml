  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण स्तर रखा गया है। स्थान-नामों को हिन्दी ध्वन्यात्मक रूप में लिप्यंतरित किया गया है। पहले वाक्य में अप्रत्यक्ष आदेश और अंतिम वाक्य में प्रत्यक्ष बहुवचन निर्देश के बीच इब्रानी का परिवर्तन सुरक्षित रखा गया है।
