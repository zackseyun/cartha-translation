source:
  edition: WLC
  text: וַ/יָּשֻׁ֣בוּ הַ/מַּ֗יִם וַ/יְכַסּ֤וּ אֶת הָ/רֶ֨כֶב֙ וְ/אֶת הַ/פָּ֣רָשִׁ֔ים לְ/כֹל֙ חֵ֣יל פַּרְעֹ֔ה הַ/בָּאִ֥ים אַחֲרֵי/הֶ֖ם בַּ/יָּ֑ם לֹֽא נִשְׁאַ֥ר בָּ/הֶ֖ם עַד אֶחָֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/028.yaml
  text: And the waters returned and covered the chariots and the horsemen[a], all the army of Pharaoh that had gone after them into the sea; not one of them remained.
translation:
  language: hi
  text: तब पानी लौट आया और उसने रथों और घुड़सवारों[a] को—फ़िरौन की उस सारी सेना को जो समुद्र में उनके पीछे गई थी—ढक लिया; उनमें से एक भी नहीं बचा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “घुड़सवार सेना।”
    reason: פָּרָשִׁים के लिए सामूहिक सैन्य अर्थ का वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: וַיָּשֻׁבוּ הַמַּיִם
  choice: तब पानी लौट आया
  rationale: שׁוב यहाँ समुद्र के पानी के अपनी पूर्व स्थिति में लौटने को व्यक्त करता है। हिन्दी में सामूहिक द्रव्यवाचक संज्ञा ‘पानी’ के साथ एकवचन क्रिया स्वाभाविक है; ‘तब’ कथानक की अगली घटना को सहज रूप से जोड़ता है।
- source_word: וַיְכַסּוּ
  choice: ढक लिया
  rationale: כסה का सीधा अर्थ ‘ढकना’ है। यह चयन मूल बिंब को बनाए रखता है और ‘डुबो दिया’ जैसे निहित परिणाम को मूल क्रिया में नहीं जोड़ता।
- source_word: הָרֶכֶב
  choice: रथों
  rationale: רֶכֶב यहाँ सामूहिक रूप से युद्ध-रथों या रथ-दल को सूचित करता है। ‘रथों’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: הַפָּרָשִׁים
  choice: घुड़सवारों
  rationale: פָּרָשִׁים सवार योद्धाओं को सूचित करता है। ‘घुड़सवारों’ सीधा और सर्वसुलभ रूप है; सामूहिक सैन्य अर्थ ‘अश्वारोही सेना’ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: לְכֹל חֵיל פַּרְעֹה
  choice: अर्थात फ़िरौन की उस सारी सेना को
  rationale: חֵיל का प्रसंगगत अर्थ सैन्य बल या सेना है और לְכֹל उसकी समग्रता पर बल देता है। ‘उस’ आगे आने वाले संबंधवाचक उपवाक्य से सेना को उसी पीछा करने वाले दल तक सीमित करता है। ‘अर्थात’ रथों और घुड़सवारों के साथ व्याख्यात्मक संबंध स्पष्ट करता है।
- source_word: הַבָּאִים אַחֲרֵיהֶם בַּיָּם
  choice: जो उनके पीछे समुद्र में गई थी
  rationale: संदर्भ में कृदंत पीछा करते हुए समुद्र में प्रवेश कर चुकी सेना को बताता है। यह रूप हिन्दी कथानक में स्वाभाविक है और ‘उनके’ का संकेत इस्राएलियों की ओर रहने देता है।
- source_word: לֹא נִשְׁאַר בָּהֶם עַד אֶחָד
  choice: उनमें से एक भी नहीं बचा
  rationale: यह इब्रानी मुहावरा पूर्णता पर बल देता है। ‘एक भी नहीं बचा’ उसी जोर को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: फ़िरौन की सेना के विनाश का विस्तार
  choice: ‘एक भी नहीं बचा’ उस पूरी सेना के लिए कहा गया है जो इस्राएलियों के पीछे समुद्र में गई थी।
  alternative: इसे मिस्र की हर सैन्य टुकड़ी या प्रत्येक सैनिक के सार्वभौमिक विनाश के रूप में पढ़ना।
  rationale: इब्रानी वाक्य ‘फ़िरौन की सारी सेना’ को संबंधवाचक पद ‘जो उनके पीछे समुद्र में गई थी’ से सीमित करता है। अनुवाद पीछा करने वाले उस दल के पूर्ण विनाश को बनाए रखता है, पर कथन को पाठ में उल्लिखित दल से आगे नहीं बढ़ाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पानी’ हिन्दी का स्वाभाविक सामूहिक रूप है; युग्मित दीर्घ विराम-चिह्न व्याख्यात्मक पद को स्पष्ट करते हैं और अर्धविराम अंतिम परिणाम की निकट संबद्धता बनाए रखता है।
