  yaml_path: translation/ot/exodus/014/029.yaml
  text: But the sons of Israel walked on dry ground through the midst of the sea[b][a], and the waters were a wall to them on their right and on their left.
translation:
  language: hi
  text: परन्तु इस्राएल के पुत्र समुद्र के बीच सूखी भूमि पर चले गए, और जल उनके लिए उनकी दाहिनी ओर और बाईं ओर दीवार बना हुआ था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जल उनके लिए उनकी दाहिनी ओर और बाईं ओर दीवार के समान था।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: परन्तु इस्राएल के पुत्र
  rationale: בני ישראל का शाब्दिक, पारिवारिक और राष्ट्रीय रूप सुरक्षित रखा गया है। וּ को निकटवर्ती प्रसंग में मिस्रियों के विनाश के विपरीत इस्राएल की सुरक्षित यात्रा दिखाने के लिए ‘परन्तु’ कहा गया है।
- source_word: הָלְכוּ
  choice: चलते गए
  rationale: הלך का अर्थ ‘चलना/जाना’ है; यह रूप समुद्र में से उनके आगे बढ़ने की कथात्मक गति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בַיַּבָּשָׁה
  choice: सूखी भूमि पर
  rationale: יַבָּשָׁה सूखी भूमि या धरातल को दर्शाता है; यह हिन्दी में स्पष्ट और सहज है।
- source_word: בְּתוֹךְ הַיָּם
  choice: समुद्र के बीच
  rationale: בְּתוֹךְ का स्थानगत अर्थ ‘के बीच/मध्य में’ सुरक्षित रखा गया है।
- source_word: וְהַמַּיִם
  choice: और जल
  rationale: מַיִם रूप की दृष्टि से बहुवचन है, पर हिन्दी में ‘जल’ स्वाभाविक सामूहिक संज्ञा है।
- source_word: לָהֶם חֹמָה
  choice: उनके लिए दीवार था
  rationale: לָהֶם का संबंधसूचक अर्थ ‘उनके लिए’ और חֹמָה का सीधा अर्थ ‘दीवार’ रखा गया है; मूल में तुलना-सूचक शब्द नहीं है।
- source_word: מִימִינָם וּמִשְּׂמֹאלָם
  choice: उनके दाहिनी ओर और बाईं ओर
  rationale: दोनों दिशाओं की समानांतर संरचना को स्पष्ट, आधुनिक हिन्दी में बनाए रखा गया है।
theological_decisions:
- issue: בני ישראל का अनुवाद
  choice: इस्राएल के पुत्र
  alternative: इस्राएली
  rationale: मूल इब्रानी की पारिवारिक-राष्ट्रीय अभिव्यक्ति को बनाए रखा गया है; ‘इस्राएली’ अधिक मुहावरेदार किंतु कम रूपात्मक विकल्प है।
- issue: חֹמָה को सीधा कथन मानना या उपमा
  choice: दीवार था
  alternative: दीवार के समान था
  rationale: इब्रानी पाठ में स्पष्ट तुलना-सूचक कण नहीं है, इसलिए मुख्य पाठ उसके प्रबल, सीधे कथन को सुरक्षित रखता है; सम्भावित उपमात्मक समझ टिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठकों के लिए सुबोध कथात्मक रूप। ‘इस्राएल के पुत्र’ मूल की पारिवारिक अभिव्यक्ति को जानबूझकर सुरक्षित रखता है; ‘जल’ हिन्दी में स्वाभाविक सामूहिक संज्ञा है।
