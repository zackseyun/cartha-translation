base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/009.yaml
  text: The Egyptians pursued them and overtook them as they were camped by the sea—all Pharaoh’s horses and chariots[a], his horsemen, and his army—by Pi-hahiroth, before Baal-zephon.
translation:
  language: hi
  text: मिस्रियों ने उनका पीछा किया और जब वे समुद्र के किनारे डेरा डाले हुए थे, तब उन्हें जा पकड़ा—फ़िरौन के सभी घोड़े और रथ, उसके घुड़सवार और उसकी सेना—पी-हहीरोत के पास, बाल-सफ़ोन के सामने[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बाल-सफ़ोन के विपरीत।” इब्रानी पदबंध किसी प्रमुख स्थान के सामने या उसकी ओर मुख किए हुए स्थिति को भी बता सकता है।
    reason: स्थानवाचक इब्रानी पदबंध לִפְנֵי की ‘सामने/विपरीत’ संबंधी अर्थ-सीमा को सुरक्षित रखना।
lexical_decisions:
- source_word: וַיִּרְדְּפוּ
  choice: पीछा किया
  rationale: רדף का सामान्य अर्थ पीछा करना है; सैन्य प्रसंग में यह स्वाभाविक और स्पष्ट है।
- source_word: מִצְרַיִם
  choice: मिस्रियों
  rationale: बहुवचन क्रियाओं और प्रसंग से यहाँ देश नहीं, मिस्र के लोग अथवा सैन्य बल अभिप्रेत हैं।
- source_word: וַיַּשִּׂיגוּ
  choice: जा पकड़ा
  rationale: נשׂג यहाँ पीछा करते हुए किसी तक पहुँच जाने या उसे पकड़ लेने का भाव देता है; ‘जा पकड़ा’ कथा की गति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: חֹנִים עַל הַיָּם
  choice: समुद्र के किनारे डेरा डाले हुए थे
  rationale: कृदंत חֹנִים इस्राएलियों की उस समय की अवस्था बताता है, और עַל यहाँ स्थानवाचक है।
- source_word: כָּל סוּס רֶכֶב פַּרְעֹה
  choice: फ़िरौन के रथों के सभी घोड़े
  rationale: इब्रानी का संक्षिप्त सामूहिक पदबंध शाब्दिक रूप से फ़िरौन की रथ-सेना से जुड़े घोड़ों की ओर संकेत करता है। हिन्दी में यह रूप घोड़ों को रथों से स्पष्टतः जोड़ता है और रथों को अलग सूची-वस्तु मानने की आवश्यकता नहीं डालता।
- source_word: וּפָרָשָׁיו
  choice: उसके घुड़सवार
  rationale: פָּרָשִׁים घुड़सवार सैनिकों को दर्शाता है; ‘घुड़सवार’ आधुनिक हिन्दी में सीधा और पारदर्शी है।
- source_word: וְחֵילוֹ
  choice: उसकी सारी सेना
  rationale: חַיִל यहाँ सैन्य बल का बोध कराता है; ‘सेना’ सबसे सहज हिन्दी है। ‘सारी’ मूल सूची में निहित समग्रता को व्यक्त करती है।
- source_word: עַל פִּי הַחִירֹת
  choice: पी-हहीरोत के पास
  rationale: यह स्थानवाचक पदबंध एक स्थान-नाम के निकट स्थिति बताता है; ‘के पास’ स्वाभाविक हिन्दी है।
- source_word: לִפְנֵי בַּעַל צְפֹן
  choice: बाल-सफ़ोन के सामने
  rationale: לִפְנֵי स्थान संबंधी प्रसंग में ‘के सामने’, ‘के सम्मुख’ या ‘के विपरीत दिशा में’ का भाव दे सकता है; ‘के सामने’ इस अस्पष्टता को काफी हद तक बनाए रखता है।
