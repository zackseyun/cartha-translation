reference: Exodus 14:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֻּגַּד֙ לְ/מֶ֣לֶךְ מִצְרַ֔יִם כִּ֥י בָרַ֖ח הָ/עָ֑ם וַ֠/יֵּהָפֵךְ לְבַ֨ב פַּרְעֹ֤ה וַ/עֲבָדָי/ו֙ אֶל הָ/עָ֔ם וַ/יֹּֽאמרוּ֙ מַה זֹּ֣את עָשִׂ֔ינוּ כִּֽי שִׁלַּ֥חְנוּ אֶת יִשְׂרָאֵ֖ל מֵ/עָבְדֵֽ/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/005.yaml
  text: It was reported to the king of Egypt that the people had fled[a], and the heart of Pharaoh and his servants was turned against the people, and they said, “What is this we have done[b], that we have let Israel go from serving us?”
translation:
  language: hi
  text: जब मिस्र के राजा को बताया गया कि लोग भाग गए थे, तब फ़िरौन और उसके सेवकों का मन इस्राएलियों के विरुद्ध हो गया[a]। उन्होंने कहा, “हमने यह क्या किया कि इस्राएल को हमारी सेवा करना छोड़ने दिया[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “फ़िरौन और उसके सेवकों का हृदय लोगों की ओर पलट गया।”
    reason: हिब्रू के 'हृदय' रूपक तथा אֶל की दिशात्मक अभिव्यक्ति का शाब्दिक विकल्प।
  - marker: b
    text: या, “इस्राएल को हमारी सेवा से मुक्त कर दिया,” अथवा “उन्हें हमारे दास बने रहना छोड़ने दिया।”
    reason: שׁלח और מֵעָבְדֵנוּ के निकटवर्ती वैकल्पिक अर्थ; दूसरा विकल्प व्यापक दासत्व-संदर्भ को स्पष्ट करता है।
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: बताया गया
  rationale: होफ़ाल का कर्मवाच्य रूप सूचना देने वाले को अनिर्दिष्ट रखता है; हिन्दी कर्मवाच्य मूल की शैली को स्वाभाविक रूप से सुरक्षित रखता है।
- source_word: כִּי בָרַח הָעָם
  choice: कि वे लोग भाग गए हैं
  rationale: ברח का अर्थ भाग जाना है। कथानक में राजा को मिली सूचना के रूप में पूर्ण क्रिया स्वाभाविक हिन्दी में व्यक्त हुई है; 'वे लोग' पहले से परिचित समुदाय को सूचित करता है।
- source_word: וַיֵּהָפֵךְ לְבַב פַּרְעֹה וַעֲבָדָיו
  choice: फ़िरौन और उसके सेवकों का मन ... बदल गया
  rationale: לְבַב विचार, इच्छा और रुख के आंतरिक केंद्र को दर्शाता है। हिन्दी में संयुक्त कर्ताओं के साथ एकवचन 'मन' मूल के एकवचन रूप को बनाए रखता है और 'हृदय पलट गया' की अपेक्षा अधिक स्वाभाविक है।
- source_word: אֶל הָעָם
  choice: उन लोगों के प्रति
  rationale: אֶל रुख की दिशा बताता है। प्रसंग में यह बदलाव प्रतिकूल है, पर 'के प्रति' मूल की दिशात्मक अस्पष्टता को बनाए रखता है और शत्रुता को अनावश्यक रूप से मुख्य पाठ में नहीं जोड़ता।
- source_word: מַה זֹּאת עָשִׂינוּ
  choice: हमने यह क्या किया
  rationale: यह रूप प्रश्नवाचक और संकेतवाचक दोनों तत्वों को रखते हुए पछतावे और घबराहट की स्वाभाविक हिन्दी अभिव्यक्ति है।
- source_word: שִׁלַּחְנוּ
  choice: जाने दिया
  rationale: इस प्रसंग में שׁלח का अर्थ छोड़ना या मुक्त करके जाने देना है; यह निर्गमन की आवर्ती अभिव्यक्ति को सहज हिन्दी में रखता है।
- source_word: מֵעָבְדֵנוּ
  choice: अपनी सेवा से
  rationale: עבד यहाँ मिस्रियों के लिए सेवा या काम करने की समाप्ति दर्शाता है। यह चुनाव दासत्व के व्यापक प्रसंग को नकारे बिना तत्काल शब्दावली के निकट रहता है।
theological_decisions:
- issue: לְבַב का मानवशास्त्रीय अर्थ
  choice: मन
  alternative: हृदय
  rationale: हिब्रू में यह शब्द विचार, इच्छा और निश्चय के आंतरिक केंद्र को दर्शाता है। आधुनिक हिन्दी में इस मुहावरे के साथ 'मन बदल गया' स्रोत के भाव को अधिक स्वाभाविक और स्पष्ट रूप से पहुँचाता है; 'हृदय' का विकल्प पादटिप्पणी में दिया गया है।
- issue: फ़िरौन और उसके सेवकों के रुख का स्वरूप
  choice: उन लोगों के प्रति बदल गया
  alternative: उन लोगों के विरुद्ध हो गया
  rationale: प्रसंग बदलाव की शत्रुतापूर्ण दिशा स्पष्ट करता है, पर אֶל अपने आप में 'के प्रति' है। मुख्य पाठ मूल की दिशात्मक अभिव्यक्ति रखता है और पादटिप्पणी संभावित स्पष्ट अर्थ बताती है।
- issue: מֵעָבְדֵנוּ में इस्राएल की स्थिति
  choice: अपनी सेवा से
  alternative: अपनी गुलामी से
  rationale: व्यापक कथा में यह कठोर दासत्व था, फिर भी इस उपवाक्य का निकटतम शब्दार्थ सेवा करना है। इसलिए मुख्य पाठ में अधिक औपचारिक समतुल्य रखा गया है और स्पष्टतर विकल्प पादटिप्पणी में है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक हिन्दी है। 'फ़िरौन', 'इस्राएल' और 'मिस्र' प्रचलित बाइबलीय नामरूप हैं। मुख्य पाठ में स्रोत की अस्पष्टता और एकवचन 'मन' की सामूहिक रचना सुरक्षित रखी गई है; पादटिप्पणियाँ शाब्दिक रूपक और दासत्व-संदर्भ स्पष्ट करती हैं।
