  text: וַ/יָּבֹ֞א בֵּ֣ין מַחֲנֵ֣ה מִצְרַ֗יִם וּ/בֵין֙ מַחֲנֵ֣ה יִשְׂרָאֵ֔ל וַ/יְהִ֤י הֶֽ/עָנָן֙ וְ/הַ/חֹ֔שֶׁךְ וַ/יָּ֖אֶר אֶת הַ/לָּ֑יְלָה וְ/לֹא קָרַ֥ב זֶ֛ה אֶל זֶ֖ה כָּל הַ/לָּֽיְלָה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/020.yaml
  text: And it came between the camp of Egypt and the camp of Israel[a], and there was the cloud and the darkness, yet it lit up the night; and the one did not come near the other all night.
translation:
  language: hi
  text: वह मिस्र की छावनी और इस्राएल की छावनी के बीच आ गया। वहाँ बादल और अंधकार था[a], फिर भी उसने रात को प्रकाशित किया; और रात भर एक छावनी दूसरी छावनी के पास नहीं आई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वहाँ बादल और अंधकार था, पर वह रात में उजाला देता रहा।” इब्रानी कथन संक्षिप्त है; अंधकार और प्रकाश का दोनों छावनियों से क्या संबंध था, इस विषय में प्राचीन संस्करणों और अनुवादों में भिन्नता है।
    reason: वैकल्पिक पाठ-समझ
lexical_decisions:
- source_word: וַיָּבֹא
  choice: वह ... आ गया
  rationale: एकवचन पुल्लिंग क्रिया पिछले संदर्भ में परमेश्वर के दूत या बादल के खंभे की ओर संकेत कर सकती है। केवल ‘वह’ कहना इस संदर्भगत अस्पष्टता को बनाए रखता है।
- source_word: בֵּין ... וּבֵין
  choice: '... और ... के बीच'
  rationale: स्थान-संबंधी अर्थ का स्वाभाविक और सटीक हिन्दी रूप।
- source_word: מַחֲנֵה
  choice: छावनी
  rationale: यात्रा और सैन्य प्रसंग में यह लोगों के दल और उनके डेरा डालने के स्थान—दोनों को समेटने वाला गरिमापूर्ण, सहज शब्द है।
- source_word: מִצְרַיִם / יִשְׂרָאֵל
  choice: मिस्र / इस्राएल
  rationale: इब्रानी के ‘मिस्र की छावनी’ और ‘इस्राएल की छावनी’ रूप को बनाए रखा गया है; प्रसंग से संबंधित जनसमूह स्पष्ट हैं।
- source_word: וַיְהִי הֶעָנָן וְהַחֹשֶׁךְ
  choice: वहाँ बादल और अंधकार था
  rationale: संक्षिप्त इब्रानी अस्तित्ववाचक कथन को निकटता से रखता है और बादल तथा अंधकार की तीखी संगति को बनाए रखता है।
- source_word: וַיָּאֶר אֶת־הַלָּיְלָה
  choice: फिर भी उसने रात को उजाला कर दिया
  rationale: אור का अर्थ प्रकाश देना है और את־הַלָּיְלָה में ‘रात’ प्रत्यक्ष कर्म है। ‘फिर भी’ अंधकार और प्रकाश के बीच निहित विरोध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְלֹא קָרַב זֶה אֶל־זֶה
  choice: एक छावनी दूसरी छावनी के पास नहीं आई
  rationale: मुहावरे का आशय दोनों छावनियों के परस्पर निकट न आने से है; संज्ञा दोहराने से हिन्दी में संदर्भ स्पष्ट रहता है।
- source_word: כָּל־הַלָּיְלָה
  choice: रात भर
  rationale: पूरी रात की अवधि का संक्षिप्त और स्वाभाविक हिन्दी रूप।
theological_decisions:
- issue: एकवचन क्रियाओं का संदर्भ
  choice: ‘वह/उसने’ के द्वारा संदर्भ को अनिर्धारित रखना
  alternative: मुख्य पाठ में स्पष्ट रूप से ‘परमेश्वर का दूत’ या ‘बादल का खंभा’ कहना
  rationale: पिछले पद में परमेश्वर का दूत और बादल का खंभा दोनों उपस्थित हैं, और इब्रानी एकवचन क्रियाएँ संदर्भ को पूरी तरह निश्चित नहीं करतीं। किसी एक को स्पष्टतः जोड़ना पाठ की वास्तविक अस्पष्टता को अनावश्यक रूप से समाप्त कर देता।
- issue: अंधकार और प्रकाश का संबंध
  choice: ‘फिर भी’ से विरोध व्यक्त करना, पर यह न बताना कि किस छावनी पर अंधकार या प्रकाश पड़ा
  alternative: मिस्रियों की ओर अंधकार और इस्राएलियों की ओर प्रकाश था—यह बात मुख्य पाठ में स्पष्ट जोड़ना
  rationale: इब्रानी वाक्य अत्यंत संक्षिप्त है और प्राचीन पाठ-परंपराएँ इसके संबंधों को अलग-अलग समझती हैं। मुख्य पाठ में दोनों छावनियों के लिए अलग प्रभाव निर्धारित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘छावनी’, ‘अंधकार’ और ‘उजाला’ सामान्य पाठक के लिए बोधगम्य हैं। मुख्य पाठ में इब्रानी की संक्षिप्तता और संदर्भगत अस्पष्टता को यथासंभव सुरक्षित रखा गया है।
