source:
  edition: WLC
  text: וַֽ/יְהִי֙ בְּ/אַשְׁמֹ֣רֶת הַ/בֹּ֔קֶר וַ/יַּשְׁקֵ֤ף יְהוָה֙ אֶל מַחֲנֵ֣ה מִצְרַ֔יִם בְּ/עַמּ֥וּד אֵ֖שׁ וְ/עָנָ֑ן וַ/יָּ֕הָם אֵ֖ת מַחֲנֵ֥ה מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/024.yaml
  text: And in the morning watch[a], Yahweh looked down on the camp of the Egyptians through the pillar of fire and cloud[b], and threw the camp of the Egyptians into confusion.
translation:
  language: hi
  text: भोर के पहर में याहवे ने आग और बादल के खम्भे के द्वारा[a] मिस्रियों की छावनी पर नज़र डाली और मिस्रियों की छावनी में खलबली मचा दी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आग और बादल के खम्भे में से।”
    reason: पूर्वसर्ग ב यहाँ साधन के बजाय स्थान अथवा भीतर से किए गए कार्य को भी सूचित कर सकता है।
  - marker: b
    text: या, “मिस्रियों की छावनी को आतंकित कर दिया।”
    reason: הום उलझन या खलबली के साथ घबराहट और आतंक का भाव भी व्यक्त कर सकता है।
lexical_decisions:
- source_word: בְּאַשְׁמֹרֶת הַבֹּקֶר
  choice: भोर के पहर में
  rationale: यह पदबंध रात के अंतिम, भोर वाले पहर को सूचित करता है। यह रूप समय की विशिष्टता बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: וַיַּשְׁקֵף
  choice: नीचे दृष्टि डाली
  rationale: इस क्रिया में किसी ऊँचे स्थान से नीचे की ओर देखने का भाव है; चुना हुआ रूप दिशा और दिव्य दृष्टिकोण दोनों को व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी पाठ में परमेश्वर का व्यक्तिगत नाम स्पष्ट रूप से आया है, इसलिए उसे किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: מַחֲנֵה מִצְרַיִם
  choice: मिस्रियों की छावनी
  rationale: यह रचना मिस्रियों की सैनिक छावनी को सूचित करती है और हिन्दी में स्पष्ट तथा स्वाभाविक है।
- source_word: בְּעַמּוּד אֵשׁ וְעָנָן
  choice: आग और बादल के खम्भे के द्वारा
  rationale: पूर्वसर्ग ב साधन अथवा स्थान-साधन, दोनों भाव दे सकता है। मुख्य पाठ में माध्यम का भाव रखा गया है और स्थानगत अर्थ को पादटिप्पणी में सुरक्षित किया गया है।
- source_word: וַיָּהָם
  choice: खलबली मचा दी
  rationale: הום के कारक रूप में उलझन, हड़कंप या घबराहट उत्पन्न करने का भाव है। यह अनुवाद पूर्ण पराजय का अर्थ जोड़े बिना उस कारक बल को व्यक्त करता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ में चार अक्षरों वाला दिव्य नाम सीधे प्रयुक्त है। 'याहवे' प्रचलित विद्वत्तापूर्ण उच्चारण का देवनागरी लिप्यंतरण है और नाम को 'प्रभु' जैसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: खम्भे के साथ पूर्वसर्ग ב का संबंध
  choice: खम्भे के द्वारा
  alternative: खम्भे में से
  rationale: इब्रानी में साधनगत और स्थानगत अर्थ के बीच वास्तविक अस्पष्टता है। मुख्य पाठ माध्यम का भाव देता है, जबकि पादटिप्पणी स्थानगत पाठ को बनाए रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। 'भोर का पहर', 'छावनी' और 'खलबली मचा दी' मूल की समय-सूचना, सैनिक संदर्भ और कारक क्रिया को स्वाभाविक हिन्दी में व्यक्त करते हैं।
