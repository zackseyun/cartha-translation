  text: וַ/יּ֨וֹשַׁע יְהוָ֜ה בַּ/יּ֥וֹם הַ/ה֛וּא אֶת יִשְׂרָאֵ֖ל מִ/יַּ֣ד מִצְרָ֑יִם וַ/יַּ֤רְא יִשְׂרָאֵל֙ אֶת מִצְרַ֔יִם מֵ֖ת עַל שְׂפַ֥ת הַ/יָּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/030.yaml
  text: So Yahweh saved Israel that day from the hand of Egypt[b][a], and Israel saw the Egyptians dead on the seashore.
translation:
  language: hi
  text: उस दिन याहवे ने इस्राएल को मिस्र के हाथ से[a] बचाया, और इस्राएल ने मिस्रियों को समुद्र के तट पर मरे हुए देखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, ‘मिस्र के हाथ से’; अर्थात मिस्र की सत्ता या नियंत्रण से।
    reason: cultural_note
lexical_decisions:
- source_word: וַיּוֹשַׁע
  choice: बचाया
  rationale: हिफ़ील रूप यहाँ संकट और शत्रु के अधिकार से छुड़ाने की यहोवा की क्रिया बताता है। ‘बचाया’ सहज आधुनिक हिन्दी है और दैवी उद्धार का भाव बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम है; हिन्दी की प्रचलित बाइबलीय वर्तनी ‘यहोवा’ शीर्षक से बदलने के बजाय उस नाम को प्रस्तुत करती है।
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह स्वाभाविक हिन्दी में समय बताने वाला सीधा अनुवाद है।
- source_word: מִיַּד מִצְרָיִם
  choice: मिस्र के हाथ से
  rationale: ‘हाथ से’ मूल इब्रानी रूपक को सुरक्षित रखता है, जहाँ हाथ सत्ता या नियंत्रण को दर्शाता है; अर्थ स्पष्ट करने के लिए पादटिप्पणी दी गई है।
- source_word: מִצְרַיִם
  choice: मिस्रियों को
  rationale: दूसरे प्रयोग में दिखाई देने वाले मृत लोग अभिप्रेत हैं, इसलिए देश के नाम के बजाय उसके लोगों के लिए ‘मिस्रियों’ स्वाभाविक है।
- source_word: מֵת
  choice: मरे पड़े
  rationale: एकवचन विशेषण सामूहिक रूप से मिस्रियों की मृत अवस्था बताता है। हिन्दी में ‘मरे पड़े’ दृश्य और स्थानगत कथन को स्वाभाविक ढंग से व्यक्त करता है, बिना मृत्यु के कारण या ढंग को जोड़े।
- source_word: עַל שְׂפַת הַיָּם
  choice: समुद्र के किनारे
  rationale: शाब्दिक ‘समुद्र के होंठ’ का अर्थ समुद्र का तट या किनारा है; ‘समुद्र के किनारे’ स्पष्ट और स्वाभाविक आधुनिक हिन्दी है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: पद व्यक्तिगत ईश्वरीय नाम का प्रयोग करता है। हिन्दी पाठकों के लिए व्यापक रूप से पहचानी जाने वाली ‘यहोवा’ वर्तनी नाम को किसी उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करती है; ‘याहवे’ अधिक प्रत्यक्ष विद्वत्तापूर्ण लिप्यंतरण है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। आरम्भ का ‘इस प्रकार’ वाव-परिणामी कथानक को पिछले घटनाक्रम के परिणाम से जोड़ता है। मूल स्रोत में केवल एक वास्तविक व्याख्यात्मक आवश्यकता—‘हाथ’ के सत्ता-संबंधी मुहावरे—पर पादटिप्पणी दी गई है; उपलब्ध अंग्रेज़ी पादटिप्पणियों के चिह्न और विषय में असंगति थी, इसलिए हिन्दी मसौदा मूल इब्रानी के आधार पर व्यवस्थित किया गया है।
