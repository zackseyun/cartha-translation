source:
  edition: WLC
  text: וַ/אֲנִ֗י הִנְ/נִ֤י מְחַזֵּק֙ אֶת לֵ֣ב מִצְרַ֔יִם וְ/יָבֹ֖אוּ אַחֲרֵי/הֶ֑ם וְ/אִכָּבְדָ֤ה בְּ/פַרְעֹה֙ וּ/בְ/כָל חֵיל֔/וֹ בְּ/רִכְבּ֖/וֹ וּ/בְ/פָרָשָֽׁי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/017.yaml
  text: And I—behold[a], I am hardening the hearts of the Egyptians so that they will go in after them, and I will get glory over Pharaoh and over all his army[b], over his chariots and over his horsemen.
translation:
  language: hi
  text: और मैं—देखो, मैं मिस्रियों के हृदय को कठोर कर रहा हूँ, ताकि वे उनके पीछे आएँ; और मैं फ़िरौन, उसकी सारी सेना, उसके रथों और उसके घुड़सवारों पर अपनी महिमा प्रकट करूँगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं फ़िरौन तथा उसकी सारी सेना—उसके रथों और उसके घुड़सवारों—के द्वारा महिमान्वित होऊँगा।”
    reason: כבד के निफ़अल रूप को ‘महिमान्वित होना’ के रूप में, और इस संदर्भ में בְּ को ‘के द्वारा’ के रूप में भी अनुवादित किया जा सकता है।
lexical_decisions:
- source_word: הִנְנִי
  choice: देखो, मैं
  rationale: הִנְנִי में बलयुक्त आत्म-संदर्भ है। ‘देखो, मैं’ उस उभरे हुए बल को बनाए रखता है और आधुनिक हिन्दी में समझने योग्य है।
- source_word: מְחַזֵּק אֶת לֵב מִצְרַיִם
  choice: मिस्रियों के हृदय को कठोर कर रहा हूँ
  rationale: पिएल कृदन्त परमेश्वर की प्रत्यक्ष और जारी/आसन्न क्रिया व्यक्त करता है। एकवचन ‘हृदय’ को सामूहिक अर्थ में रखा गया है, जैसा इब्रानी में है।
- source_word: וְיָבֹאוּ אַחֲרֵיהֶם
  choice: ताकि वे उनके पीछे समुद्र में चले आएँ
  rationale: संदर्भ में בוא इस्राएलियों के पीछे समुद्र में प्रवेश करने को सूचित करता है। ‘ताकि’ कठोर किए जाने और उनके पीछे आने के बीच उद्देश्य/परिणाम का संबंध स्पष्ट करता है; ‘समुद्र में’ निकट संदर्भ से निहित है।
- source_word: וְאִכָּבְדָה
  choice: अपनी महिमा प्रकट करूँगा
  rationale: כבד का निफ़अल रूप यहाँ न्याय के द्वारा यहोवा के महिमान्वित होने या महिमा पाने का भाव देता है। हिन्दी में ‘अपनी महिमा प्रकट करूँगा’ स्वाभाविक ढंग से इस घटनात्मक अर्थ को व्यक्त करता है।
- source_word: בְּפַרְעֹה וּבְכָל חֵילוֹ
  choice: फ़िरौन, उसकी सारी सेना ... पर
  rationale: כבד के साथ ב यहाँ उस व्यक्ति और सैन्य शक्ति को दिखाता है जिन पर न्यायपूर्ण विजय के द्वारा महिमा प्रकट होती है।
- source_word: בְּרִכְבּוֹ וּבְפָרָשָׁיו
  choice: उसके रथों और उसके घुड़सवारों पर
  rationale: רכב सामूहिक रूप में रथ-दल और פָרָשִׁים सवार सैनिकों को दर्शाते हैं; ठोस बहुवचन हिन्दी में स्पष्ट और स्वाभाविक हैं।
theological_decisions:
- issue: मिस्रियों के हृदय को कठोर करने में परमेश्वर की भूमिका
  choice: ‘मैं ... कठोर कर रहा हूँ’ द्वारा परमेश्वर की प्रत्यक्ष क्रिया स्पष्ट रखी गई है।
  alternative: ‘मैं उन्हें कठोर होने दूँगा’ या ‘मैं उनका हृदय दृढ़ करूँगा’
  rationale: इब्रानी पाठ क्रिया को सीधे परमेश्वर से जोड़ता है। अनुवाद दैवी प्रभुता और मानवीय उत्तरदायित्व के तनाव को नरम करके हल नहीं करता।
- issue: न्याय के प्रसंग में כבד का अर्थ
  choice: ‘अपनी महिमा प्रकट करूँगा’
  alternative: ‘महिमान्वित होऊँगा’ या ‘महिमा पाऊँगा’
  rationale: तीनों अर्थसंगत हैं, पर चुना गया वाक्यांश आधुनिक हिन्दी में स्पष्ट रूप से बताता है कि फ़िरौन और उसकी सेना पर न्याय के द्वारा परमेश्वर की महिमा दिखाई देगी।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘फ़िरौन’, ‘रथ’ और ‘घुड़सवार’ प्रचलित बाइबिलीय-सैन्य शब्द हैं। इब्रानी का सामूहिक एकवचन ‘हृदय’ जानबूझकर सुरक्षित रखा गया है।
