  yaml_path: translation/ot/exodus/014/022.yaml
  text: And the sons of Israel went into the midst of the sea on the dry ground[a], and the waters were a wall to them on their right and on their left.
translation:
  language: hi
  text: इस्राएली सूखी भूमि पर समुद्र के बीच में प्रवेश कर गए, और जल उनके दाएँ और बाएँ उनके लिए दीवार था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: जा पहुँचे
  rationale: कथात्मक संदर्भ में בוא किसी स्थान में प्रवेश या वहाँ पहुँचने को व्यक्त करता है। ‘जा पहुँचे’ हिन्दी में स्वाभाविक रूप से समुद्र के भीतर जाने की दिशा बताता है।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएली
  rationale: शाब्दिक अर्थ ‘इस्राएल के पुत्र’ है, पर यहाँ यह पूरे इस्राएली समुदाय का प्रचलित जातिवाचक नाम है; ‘इस्राएली’ आधुनिक हिन्दी में स्वाभाविक और समावेशी है।
- source_word: בְּתוֹךְ הַיָּם
  choice: समुद्र के बीच में
  rationale: בְּתוֹךְ का स्थानवाचक अर्थ ‘बीच में/मध्य में’ है; यह पद मूल बिंब को स्पष्ट और सहज हिन्दी में सुरक्षित रखता है।
- source_word: בַּיַּבָּשָׁה
  choice: सूखी भूमि पर
  rationale: यह संज्ञा जल के विपरीत सूखी भूमि या जमीन को दर्शाती है। ‘सूखी भूमि पर’ समुद्रतल के सूख जाने का ठोस बिंब देता है।
- source_word: וְהַמַּיִם
  choice: और जल
  rationale: हिब्रू का रूप बहुवचन है, पर מַיִם सामान्यतः जल के लिए प्रयुक्त व्याकरणिक बहुवचन संज्ञा है; हिन्दी का अगणनीय ‘जल’ अधिक स्वाभाविक और गरिमापूर्ण है।
- source_word: חֹמָה
  choice: दीवार
  rationale: इसका सीधा अर्थ ‘दीवार’ है। मूल में उपमा-सूचक शब्द नहीं है, इसलिए ‘दीवार के समान’ नहीं जोड़ा गया।
- source_word: מִימִינָם וּמִשְּׂמֹאלָם
  choice: उनके दाएँ और बाएँ
  rationale: दोनों पद समुदाय के दाहिने और बाएँ ओर जल की स्थिति बताते हैं; समांतर हिन्दी संरचना मूल की सममिति बनाए रखती है।
theological_decisions:
- issue: जल को वास्तविक दीवार के रूप में प्रस्तुत करने वाला कथात्मक बिंब
  choice: ‘दीवार बना हुआ था’
  alternative: ‘दीवार के समान था’
  rationale: मूल पाठ חֹמָה को बिना किसी स्पष्ट उपमा-सूचक चिह्न के विधेय के रूप में रखता है। अनुवाद उसी प्रबल कथन को बनाए रखता है और उसे उपमा बनाकर नरम नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘इस्राएल के पुत्र’ की अत्यधिक शाब्दिक अभिव्यक्ति के स्थान पर समुदायसूचक ‘इस्राएली’ रखा गया है। वाक्यक्रम को हिन्दी की स्वाभाविक प्रवाहशीलता के अनुसार व्यवस्थित करते हुए समुद्र के बीच, सूखी भूमि और दोनों ओर जल की दीवार—इन सभी मूल विवरणों को सुरक्षित रखा गया है।
