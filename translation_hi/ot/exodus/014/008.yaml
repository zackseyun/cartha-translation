  text: וַ/יְחַזֵּ֣ק יְהֹוָ֗ה אֶת לֵ֤ב פַּרְעֹה֙ מֶ֣לֶךְ מִצְרַ֔יִם וַ/יִּרְדֹּ֕ף אַחֲרֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל וּ/בְנֵ֣י יִשְׂרָאֵ֔ל יֹצְאִ֖ים בְּ/יָ֥ד רָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/008.yaml
  text: And Yahweh hardened the heart of Pharaoh king of Egypt[a], and he pursued the sons of Israel[b], while the sons of Israel were going out with a high hand.
translation:
  language: hi
  text: याहवे ने मिस्र के राजा फ़िरौन का हृदय कठोर कर दिया[a], और उसने इस्राएल के पुत्रों का पीछा किया, जबकि इस्राएल के पुत्र ऊँचा हाथ उठाए हुए[b] निकल रहे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “फ़िरौन के हृदय को दृढ़ कर दिया।” इब्रानी क्रिया का शाब्दिक अर्थ “बलवान या दृढ़ करना” है, हालाँकि निर्गमन में फ़िरौन के हृदय के लिए इसका सामान्य आशय “कठोर करना” है।
    reason: lexical_alternative
  - marker: b
    text: या “साहसपूर्वक।” इब्रानी मुहावरे का शाब्दिक अर्थ “ऊँचे/उठे हाथ के साथ” है।
    reason: idiom_explanation
lexical_decisions:
- source_word: יְהֹוָה
  choice: याहवे
  rationale: इब्रानी विशिष्ट नाम को पारदर्शी रूप से लिप्यंतरित किया गया है; इससे पद में कर्ता की स्पष्ट पहचान बनी रहती है।
- source_word: וַיְחַזֵּק
  choice: कठोर कर दिया
  rationale: חזק का मूल भाव ‘दृढ़/बलवान करना’ है, पर फ़िरौन के हृदय के विषय में निर्गमन की आवर्ती अभिव्यक्ति उसके विरोधी संकल्प के कठोर होने को बताती है। मूल शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: לֵב
  choice: हृदय
  rationale: यहाँ यह इच्छा, मनोवृत्ति और संकल्प के आंतरिक केंद्र को व्यक्त करता है; ‘हृदय’ हिंदी में इस रूपक को बनाए रखता है।
- source_word: פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: मिस्र के राजा फ़िरौन
  rationale: हिंदी की स्वाभाविक पद-रचना में इब्रानी संबंध-श्रृंखला का स्पष्ट और निकट अनुवाद।
- source_word: וַיִּרְדֹּף אַחֲרֵי
  choice: पीछा किया
  rationale: यह सैन्य और शत्रुतापूर्ण पीछा करने के अर्थ को सहज हिंदी में व्यक्त करता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: पद में दो बार आई इब्रानी अभिव्यक्ति की पुनरावृत्ति और उसका औपचारिक रूप सुरक्षित रखा गया है।
- source_word: יֹצְאִים
  choice: निकल रहे थे
  rationale: इब्रानी कृदंत की जारी क्रिया को व्यक्त करता है, जो फ़िरौन के पीछा करने की समकालिक पृष्ठभूमि है।
- source_word: בְּיָד רָמָה
  choice: हाथ ऊँचा किए हुए
  rationale: इब्रानी मुहावरे की ठोस छवि को बनाए रखते हुए हिंदी में बोधगम्य रूप दिया गया है; ‘बेधड़क’ और ‘विजयी भाव से’ जैसे अर्थ पादटिप्पणी में स्पष्ट किए गए हैं।
theological_decisions:
- issue: फ़िरौन के हृदय को कठोर करने में परमेश्वर की प्रत्यक्ष क्रिया
  choice: याहवे ने ... फ़िरौन का हृदय कठोर कर दिया
  alternative: याहवे ने ... फ़िरौन के हृदय को दृढ़ कर दिया
  rationale: इब्रानी पाठ इस क्रिया को सीधे याहवे से जोड़ता है। अनुवाद इस धर्मवैचारिक तनाव को नरम नहीं करता, जबकि חזק के ‘दृढ़ करना’ वाले शाब्दिक पहलू को पादटिप्पणी में सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिंदी अपनाई गई है। वाक्य की समकालिकता के लिए “जबकि” और कृदंत के जारी भाव के लिए “निकल रहे थे” रखा गया है। मूल पाठ में दोहराई गई “इस्राएल के पुत्र” अभिव्यक्ति को अलंकारिक प्रभाव सहित बनाए रखा गया है।
