source:
  edition: WLC
  text: וְ/יָדְע֥וּ מִצְרַ֖יִם כִּי אֲנִ֣י יְהוָ֑ה בְּ/הִכָּבְדִ֣/י בְּ/פַרְעֹ֔ה בְּ/רִכְבּ֖/וֹ וּ/בְ/פָרָשָֽׁי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/018.yaml
  text: And the Egyptians will know that I am Yahweh[a], when I gain glory through Pharaoh, through his chariots[b], and through his horsemen.
translation:
  language: hi
  text: और जब मैं फ़िरौन, उसके रथों और उसके घुड़सवारों के द्वारा महिमा पाऊँगा[a], तब मिस्री जान लेंगे कि मैं याहवे[b] हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब मैं फ़िरौन, उसके रथों और उसके घुड़सवारों के द्वारा महिमान्वित होऊँगा।”
    reason: lexical_alternative
  - marker: b
    text: “याहवे” हिब्रू के ईश्वरीय नाम YHWH का लिप्यंतरण है; कई अनुवादों में इसे परंपरागत रूप से “प्रभु” लिखा जाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: तब ... जान लेंगे
  rationale: संयोजित सिद्ध क्रिया यहाँ आने वाली घटना के परिणाम को व्यक्त करती है; ‘तब ... जान लेंगे’ आधुनिक हिन्दी में उस भाव को स्वाभाविक रूप से प्रकट करता है।
- source_word: מִצְרַיִם
  choice: मिस्री
  rationale: यहाँ संदर्भ देश की भूमि नहीं, बल्कि मिस्र के लोगों को ज्ञान होने का है।
- source_word: כִּי אֲנִי יְהוָה
  choice: कि मैं याहवे हूँ
  rationale: यह पहचान-सूत्र परमेश्वर के व्यक्तिगत नाम के साथ ज्यों का त्यों रखा गया है।
- source_word: בְּהִכָּבְדִי
  choice: जब मैं ... महिमा पाऊँगा
  rationale: כבד के निफ़अल infinitive construct और प्रथम पुरुष एकवचन प्रत्यय का अर्थ परमेश्वर का महिमान्वित होना है; בְּ का कालवाचक भाव ‘जब’ से व्यक्त किया गया है।
- source_word: בְּפַרְעֹה
  choice: फ़िरौन ... के द्वारा
  rationale: यहाँ ב उस माध्यम या क्षेत्र को सूचित करता है जिसके द्वारा याहवे की महिमा प्रकट होगी।
- source_word: בְּרִכְבּוֹ
  choice: उसके रथों
  rationale: רכב यहाँ सामूहिक रूप से रथ-सेना को सूचित कर सकता है; ‘रथों’ साधारण पाठक के लिए स्पष्ट और प्रत्यक्ष है।
- source_word: וּבְפָרָשָׁיו
  choice: और उसके घुड़सवारों
  rationale: פָרָשִׁים घुड़सवार सैनिकों या अश्वारोही सेना को दर्शाता है; ‘घुड़सवारों’ आधुनिक हिन्दी में स्पष्ट है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम YHWH है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
- issue: בְּהִכָּבְדִי में कर्तृवाच्य और कर्मवाच्य का तनाव
  choice: मैं ... महिमा पाऊँगा
  alternative: मेरी महिमा प्रकट होगी; मैं अपनी महिमा प्रकट करूँगा
  rationale: निफ़अल रूप मुख्यतः परमेश्वर के महिमान्वित होने को व्यक्त करता है। चुना हुआ पाठ यह भाव बनाए रखता है और इसे केवल परमेश्वर द्वारा अपनी महिमा दिखाने के कर्तृवाच्य अर्थ में सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। वाक्य को हिन्दी के स्वाभाविक क्रम में रखा गया है, जबकि फ़िरौन, रथों और घुड़सवारों की त्रिस्तरीय समानांतर रचना तथा मूल पाठ का कारण-परिणाम संबंध सुरक्षित है।
