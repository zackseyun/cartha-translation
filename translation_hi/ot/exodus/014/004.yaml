  text: וְ/חִזַּקְתִּ֣י אֶת לֵב פַּרְעֹה֮ וְ/רָדַ֣ף אַחֲרֵי/הֶם֒ וְ/אִכָּבְדָ֤ה בְּ/פַרְעֹה֙ וּ/בְ/כָל חֵיל֔/וֹ וְ/יָדְע֥וּ מִצְרַ֖יִם כִּֽי אֲנִ֣י יְהוָ֑ה וַ/יַּֽעֲשׂוּ כֵֽן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/004.yaml
  text: And I will harden Pharaoh’s heart[a], and he will pursue them; and I will get glory over Pharaoh and over all his army[b], and the Egyptians will know that I am Yahweh.” And they did so.
translation:
  language: hi
  text: “मैं फ़िरौन के हृदय को कठोर करूँगा[a], और वह उनका पीछा करेगा। और मैं फ़िरौन और उसकी सारी सेना पर अपनी महिमा प्रकट करूँगा[b], और मिस्री जान जाएँगे कि मैं यहोवा हूँ।” और उन्होंने वैसा ही किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं फ़िरौन के हृदय को दृढ़ करूँगा।” इब्रानी क्रिया का अर्थ “बलवान या दृढ़ करना” भी हो सकता है; निर्गमन के इस प्रसंग में यह दृढ़ता हठ के रूप में प्रकट होती है, इसलिए मुख्य पाठ में “कठोर” है।
    reason: lexical_alternative
  - marker: b
    text: या, “मैं फ़िरौन और उसकी सारी सेना के द्वारा महिमा पाऊँगा।” इब्रानी अभिव्यक्ति बताती है कि आगे होने वाली घटना में फ़िरौन और उसकी सेना के संबंध में यहोवा का गौरव प्रकट होगा।
    reason: alternative_reading
lexical_decisions:
- source_word: וְחִזַּקְתִּי
  choice: मैं ... कठोर करूँगा
  rationale: हिफ़ील रूप में यहोवा स्वयं कर्ता हैं। मूल अर्थ ‘दृढ़/बलवान करना’ हो सकता है, पर निर्गमन के इस प्रसंग में हृदय की दृढ़ता हठ के रूप में प्रकट होती है; इसलिए ‘कठोर करूँगा’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: לֵב
  choice: हृदय
  rationale: यहाँ לֵב विचार, इच्छा और निर्णय के भीतरी केंद्र को सूचित करता है। ‘हृदय’ बाइबलीय रूपक को बनाए रखते हुए हिन्दी में समझने योग्य है।
- source_word: וְרָדַף אַחֲרֵיהֶם
  choice: वह उनका पीछा करेगा
  rationale: רדף אחרי सैन्य पीछा करने को व्यक्त करता है; यह आधुनिक हिन्दी में सीधा और स्वाभाविक अनुवाद है।
- source_word: וְאִכָּבְדָה בְּפַרְעֹה
  choice: मैं फ़िरौन ... पर अपनी महिमा प्रकट करूँगा
  rationale: כבד का निफ़ाल रूप और בְּ का प्रयोग यहाँ आने वाले न्याय द्वारा यहोवा के गौरव और सम्मान के प्रकट होने को दर्शाता है। ‘पर अपनी महिमा प्रकट करूँगा’ विजय/न्याय के प्रसंग को बनाए रखता है और हिन्दी में ‘महिमा पाऊँगा’ से अधिक स्वाभाविक है।
- source_word: וּבְכָל חֵילוֹ
  choice: और उसकी सारी सेना पर
  rationale: חַיִל यहाँ फ़िरौन के सैन्य बल को सूचित करता है; ‘सेना’ स्पष्ट आधुनिक समतुल्य है।
- source_word: וְיָדְעוּ מִצְרַיִם
  choice: मिस्री जान जाएँगे
  rationale: बहुवचन क्रिया के कारण देश की अमूर्त सत्ता के बजाय मिस्र के लोगों का बोध देना उचित है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम יהוה को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: וַיַּעֲשׂוּ כֵן
  choice: और उन्होंने वैसा ही किया
  rationale: यह पूर्व आदेश के पालन को बताने वाला सीधा कथात्मक समापन है।
theological_decisions:
- issue: फ़िरौन के हृदय को कठोर करने में परमेश्वर की क्रिया
  choice: ‘मैं फ़िरौन के हृदय को कठोर करूँगा’—प्रत्यक्ष ईश्वरीय कारणता को बनाए रखा गया।
  alternative: ‘मैं फ़िरौन के हृदय को दृढ़ करूँगा’ अथवा ‘मैं फ़िरौन का हृदय कठोर होने दूँगा।’
  rationale: प्रथम पुरुष हिफ़ील रूप यहोवा को स्पष्टतः क्रिया का कर्ता बताता है। इसे केवल अनुमति में बदलना मूल पाठ में निहित धर्मवैज्ञानिक तनाव को कम कर देता।
- issue: न्याय के प्रसंग में כבד और בְּ का अर्थ
  choice: ‘फ़िरौन और उसकी सारी सेना पर अपनी महिमा प्रकट करूँगा।’
  alternative: ‘फ़िरौन और उसकी सारी सेना के द्वारा महिमा पाऊँगा।’
  rationale: मूल अभिव्यक्ति फ़िरौन और उसकी सेना के संबंध में यहोवा के सम्मानित/महिमान्वित होने को कहती है। प्रसंग प्रतिकूल न्याय और विजय का है, इसलिए ‘पर’ उस बल को व्यक्त करता है; पादटिप्पणी ‘के द्वारा’ की वास्तविक वैकल्पिक समझ सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। वाक्य-रचना मूल के क्रम और कारण-परिणाम को पर्याप्त रूप से बनाए रखती है। ‘हृदय’ जैसे स्थापित बाइबलीय रूपक को सुरक्षित रखा गया है; अस्पष्टता और वैकल्पिक अर्थ पादटिप्पणियों में दिए गए हैं।
