source:
  edition: WLC
  text: וַ/יַּ֛עַשׂ אֶת מִזְבַּ֥ח הַ/קְּטֹ֖רֶת עֲצֵ֣י שִׁטִּ֑ים אַמָּ֣ה אָרְכּ/וֹ֩ וְ/אַמָּ֨ה רָחְבּ֜/וֹ רָב֗וּעַ וְ/אַמָּתַ֨יִם֙ קֹֽמָת֔/וֹ מִמֶּ֖/נּוּ הָי֥וּ קַרְנֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/025.yaml
  text: He made the altar of incense of acacia wood. Its length was one cubit[a], and its width one cubit—it was square—and its height was two cubits. Its horns were of one piece with it.
translation:
  language: hi
  text: उसने धूप की वेदी बबूल की लकड़ी से बनाई। उसकी लंबाई एक हाथ और चौड़ाई एक हाथ थी—वह चौकोर थी—और उसकी ऊँचाई दो हाथ थी। उसके सींग उसी में से बने थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: उसने ... बनाई
  rationale: वाव-क्रमिक क्रिया बीते हुए कथात्मक कार्य को व्यक्त करती है। हिन्दी में प्रसंग का क्रम बिना आरम्भिक ‘और’ के स्वाभाविक रूप से बना रहता है।
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: धूप की वेदी
  rationale: यह संबंध-पदबंध वेदी के धूप चढ़ाने के प्रयोजन को बताता है; ‘धूप की वेदी’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: עֲצֵי שִׁטִּים
  choice: बबूल की लकड़ी
  rationale: शिट्टीम/अकेशिया वर्ग की लकड़ी के लिए ‘बबूल की लकड़ी’ सामान्य हिन्दी पाठक के लिए सुलभ मानक चयन है।
- source_word: אַמָּה
  choice: हाथ
  rationale: प्राचीन माप को आधुनिक इकाई में अनुमानतः बदलने के बजाय हिन्दी में प्रचलित बाइबलीय माप ‘हाथ’ रखा गया है।
- source_word: אָרְכּוֹ ... רָחְבּוֹ
  choice: उसकी लंबाई ... चौड़ाई
  rationale: प्रत्यय वेदी के आयाम बताते हैं; हिन्दी में संबंधसूचक ‘उसकी’ इसे स्पष्ट करता है।
- source_word: רָבוּעַ
  choice: वह चौकोर थी
  rationale: यह वेदी के आकार का विधेयात्मक वर्णन है; पूर्ण उपवाक्य हिन्दी में स्पष्ट और सहज है।
- source_word: וְאַמָּתַיִם קֹמָתוֹ
  choice: और उसकी ऊँचाई दो हाथ थी
  rationale: मूल माप को सुरक्षित रखते हुए शब्दक्रम स्वाभाविक हिन्दी के अनुसार रखा गया है।
- source_word: מִמֶּנּוּ הָיוּ קַרְנֹתָיו
  choice: उसके सींग उसी में से बने थे
  rationale: मूल वाक्यांश बताता है कि सींग वेदी से ही एकीकृत रूप में बने थे, अलग से जोड़कर नहीं; यह चयन अर्थ को बिना अनावश्यक तकनीकी भाषा के व्यक्त करता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज कथात्मक शैली रखी गई है। ‘वेदी’, ‘धूप’ और ‘सींग’ जैसे स्थापित उपासना-संबंधी पद बनाए रखे गए हैं; प्राचीन माप के लिए ‘हाथ’ प्रयुक्त है।
