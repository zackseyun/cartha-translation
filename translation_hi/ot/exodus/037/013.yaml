  text: He cast four gold rings for it and put the rings on the four corners at its four feet[a].
translation:
  language: hi
  text: उसने उसके लिए सोने के चार छल्ले ढाले और उन छल्लों को उन चारों कोनों पर लगाया, जो उसके चारों पायों के पास थे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके चारों पायों से संबंधित चारों कोनों पर।”
    reason: मूल इब्रानी वाक्यांश कोनों और पायों के संबंध को स्थानिक या संबंधसूचक—दोनों प्रकार से समझने की गुंजाइश देता है।
lexical_decisions:
- source_word: וַיִּצֹק
  choice: ढाले
  rationale: धातु-निर्माण के इस प्रसंग में क्रिया का अर्थ पिघली हुई धातु को साँचे में ढालना है, केवल उँडेलना नहीं।
- source_word: לוֹ
  choice: उसके लिए
  rationale: सर्वनाम निकटवर्ती मेज़ की ओर संकेत करता है; हिन्दी में निर्जीव वस्तु के लिए भी यह रूप स्वाभाविक है।
- source_word: טַבְּעֹת
  choice: छल्ले
  rationale: ये डंडों को थामने वाले गोल धातु के छल्ले हैं; आधुनिक हिन्दी में यह स्पष्ट और सहज शब्द है।
- source_word: זָהָב
  choice: सोने के
  rationale: मूल में सामग्री का सीधा उल्लेख है।
- source_word: וַיִּתֵּן
  choice: लगाया
  rationale: यहाँ वस्तु को किसी निश्चित स्थान पर लगाने का भाव है; हिन्दी में 'लगाया' स्वाभाविक है।
- source_word: עַל אַרְבַּע הַפֵּאֹת
  choice: चारों कोनों पर
  rationale: निर्मित वस्तु के चार छोरों या कोनों पर छल्लों की स्थिति बताई गई है।
- source_word: אֲשֶׁר לְאַרְבַּע רַגְלָיו
  choice: जो उसके चारों पायों के पास थे
  rationale: यह वाक्यांश कोनों और मेज़ के चार पायों के बीच स्थानिक संबंध बताता है; 'पास' उस संबंध को बिना अनावश्यक व्याख्या के व्यक्त करता है।
