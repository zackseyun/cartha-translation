base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/017.yaml
  text: He made the lampstand of pure gold[a]. He made the lampstand of hammered work; its base and its shaft, its cups, its buds[b], and its blossoms were of one piece with it.
translation:
  language: hi
  text: उसने शुद्ध सोने का दीपाधार बनाया। उसने दीपाधार को पीटकर गढ़ा[a]। उसका आधार और उसका दंड, उसके प्याले, उसकी कलियाँ[b] और उसके फूल—सब उसी के एक ही टुकड़े से बने थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पीटकर बनाया।” इब्रानी शब्द धातु को हथौड़े से पीटकर आकार देने की प्रक्रिया को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या, “गाँठें।” इब्रानी शब्द उभरी हुई सजावटी आकृतियों को दर्शाता है; यहाँ दीपाधार की वनस्पति-सदृश बनावट के कारण “कलियाँ” चुना गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מְנֹרָה
  choice: दीपाधार
  rationale: यह शब्द केवल एक दीपक नहीं, बल्कि पवित्रस्थान में दीपकों को थामने वाली शाखायुक्त संरचना को दर्शाता है। ‘दीपाधार’ आधुनिक, स्पष्ट और गरिमापूर्ण है।
- source_word: זָהָב טָהוֹר
  choice: शुद्ध सोना
  rationale: सामग्री के संदर्भ में טָהוֹר परिष्कृत अथवा अशुद्धिरहित सोने को दर्शाता है; ‘शुद्ध सोना’ स्वाभाविक हिन्दी है।
- source_word: מִקְשָׁה
  choice: कूटकर बनाया
  rationale: यह धातु को हथौड़े से पीटकर आकार देने की विधि बताता है। क्रियात्मक अनुवाद हिन्दी में निर्माण-प्रक्रिया को स्पष्ट रखता है।
- source_word: יְרֵכָהּ
  choice: उसका आधार
  rationale: शाब्दिक अर्थ ‘जाँघ/पार्श्व’ हो सकता है, पर इस साज-सामान के संदर्भ में यह नीचे के सहारा देने वाले भाग को सूचित करता है।
- source_word: קָנָהּ
  choice: उसका मध्य-दंड
  rationale: यहाँ एकवचन रूप दीपाधार के केंद्रीय संरचनात्मक भाग को दर्शाता है; ‘मध्य-दंड’ इसे शाखाओं से स्पष्ट रूप से अलग करता है।
- source_word: גְּבִיעֶיהָ
  choice: उसके प्याले
  rationale: यह दीपाधार की प्याले के आकार वाली सजावटी आकृतियों को दर्शाता है।
- source_word: כַּפְתֹּרֶיהָ
  choice: उसकी कलियाँ
  rationale: शब्द गाँठ अथवा उभरी हुई सजावटी आकृति का बोध कराता है। दीपाधार की वनस्पति-सदृश बनावट में ‘कलियाँ’ उपयुक्त है, जबकि ‘गाँठें’ भी संभव है।
- source_word: פְרָחֶיהָ
  choice: उसके फूल
  rationale: यह पुष्पाकार सजावट को सहज आधुनिक हिन्दी में व्यक्त करता और ‘कलियाँ’ के साथ वनस्पति-रूपक बनाए रखता है।
- source_word: מִמֶּנָּה הָיוּ
  choice: सब उसी के साथ एक ही टुकड़े में बने थे
  rationale: इससे स्पष्ट होता है कि ये भाग अलग से जोड़कर नहीं लगाए गए थे, बल्कि दीपाधार के अभिन्न भाग थे।
- source_word: וַיַּעַשׂ ... עָשָׂה
  choice: उसने ... बनाया। उसने ... बनाया
  rationale: इब्रानी में ‘बनाना’ क्रिया की पुनरावृत्ति है; उसे हिन्दी में बनाए रखने से वाक्य-संरचना और बल दोनों सुरक्षित रहते हैं।
