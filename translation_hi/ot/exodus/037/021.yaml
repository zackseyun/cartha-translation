- source_word: שְׁנֵי הַקָּנִים
  choice: दो शाखाएँ
  rationale: यहाँ קנה दीवट से बाहर निकलने वाले डंडों या भुजाओं के लिए है; वनस्पति-सदृश आकृति के कारण ‘शाखाएँ’ प्रसंगानुकूल और प्रचलित है।
- source_word: מִמֶּנָּה
  choice: उसमें से
