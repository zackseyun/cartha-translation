- source_word: לְשֵׁשֶׁת הַקָּנִים
  choice: छः शाखाओं के लिए
  rationale: यह तीन गाँठों की व्यवस्था को कुल छः पार्श्व शाखाओं से जोड़ने वाला सारांश है।
- source_word: הַיֹּצְאִים מִמֶּנָּה
  choice: उसमें से निकलने वाली
  rationale: यह कृदंत शाखाओं के केंद्रीय दीवट से बाहर की ओर निकलने का चित्र सुरक्षित रखता है।
