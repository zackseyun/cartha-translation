translation:
  language: hi
  text: उसमें से निकलने वाली दो शाखाओं के नीचे एक गोल उभार[a], उसमें से निकलने वाली दो शाखाओं के नीचे एक गोल उभार, और उसमें से निकलने वाली दो शाखाओं के नीचे एक गोल उभार—उसमें से निकलने वाली छह शाखाओं के लिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘गोल उभार’ के स्थान पर ‘गाँठ’ भी संभव है। इब्रानी शब्द כפתर दीवट पर बने गोल सजावटी भाग को दर्शाता है।
    reason: lexical_alternative
