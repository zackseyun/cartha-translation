id: EXO.37.1
reference: Exodus 37:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יַּ֧עַשׂ בְּצַלְאֵ֛ל אֶת הָ/אָרֹ֖ן עֲצֵ֣י שִׁטִּ֑ים אַמָּתַ֨יִם וָ/חֵ֜צִי אָרְכּ֗/וֹ וְ/אַמָּ֤ה וָ/חֵ֨צִי֙ רָחְבּ֔/וֹ וְ/אַמָּ֥ה וָ/חֵ֖צִי קֹמָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/001.yaml
  text: Bezalel made the ark of acacia wood. Its length was two and a half cubits[a], its width one and a half cubits, and its height one and a half cubits.
translation:
  language: hi
  text: बसलेल ने बबूल की लकड़ी का संदूक[a] बनाया। उसकी लंबाई ढाई हाथ, चौड़ाई डेढ़ हाथ और ऊँचाई डेढ़ हाथ थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द का अर्थ सामान्यतः ‘पेटी’ या ‘संदूक’ हो सकता है; यहाँ यह पवित्र निवास के उस संदूक को दर्शाता है जिसे प्रायः ‘वाचा का सन्दूक’ कहा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: बनाया
  rationale: עשה का सामान्य अर्थ ‘बनाना/करना’ है; यहाँ किसी अतिरिक्त शिल्पगत अर्थ को जोड़े बिना ‘बनाया’ स्वाभाविक है।
- source_word: בְּצַלְאֵל
  choice: बसलेल
  rationale: इब्रानी नाम का आधुनिक हिन्दी में निकट और सुबोध लिप्यंतरण।
- source_word: הָאָרֹן
  choice: संदूक
  rationale: אָרוֹן मूलतः पेटी या संदूक को दर्शाता है। हिन्दी में ‘संदूक’ वस्तु का रूप स्पष्ट करता है; इस पवित्र संदर्भ में प्रचलित वैकल्पिक पद ‘वाचा का सन्दूक’ भी समझा जा सकता है, पर मूल में यहाँ ‘वाचा’ नहीं है।
- source_word: עֲצֵי שִׁטִּים
  choice: बबूल की लकड़ी
  rationale: שִׁטָּה के लिए हिन्दी बाइबलीय और सामान्य प्रयोग में ‘बबूल’ सुबोध है; ‘लकड़ी’ पदार्थ को स्पष्ट करता है।
- source_word: אַמָּתַיִם וָחֵצִי
  choice: ढाई हाथ
  rationale: אַמָּה प्राचीन लंबाई की इकाई ‘हाथ’ है; ‘ढाई हाथ’ मूल माप को बिना आधुनिक रूपांतरण के स्वाभाविक हिन्दी में रखता है।
- source_word: אָרְכּוֹ
  choice: उसकी लंबाई
  rationale: सर्वनाम-प्रत्यय सहित संज्ञा का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: וְאַמָּה וָחֵצִי
  choice: डेढ़ हाथ
  rationale: मूल ‘एक हाथ और आधा’ का सहज आधुनिक हिन्दी रूप, प्राचीन इकाई को सुरक्षित रखते हुए।
- source_word: רָחְבּוֹ
  choice: चौड़ाई
  rationale: वस्तु के अनुप्रस्थ माप के लिए आधुनिक हिन्दी का सामान्य शब्द।
- source_word: קֹמָתוֹ
  choice: ऊँचाई
  rationale: वस्तु के ऊर्ध्वाधर माप के लिए संदर्भानुकूल और स्पष्ट शब्द।
theological_decisions:
- issue: הָאָרֹן के पवित्र उपासना-संबंधी संदर्भ का अनुवाद
  choice: संदूक
  alternative: वाचा का सन्दूक / पवित्र सन्दूक
  rationale: मूल पद अपने आप में ‘संदूक/पेटी’ है और इस पद में ‘वाचा’ या ‘पवित्र’ विशेषण नहीं है। इसलिए मुख्य पाठ में उन्हें जोड़ने के बजाय संदर्भगत पारंपरिक अर्थ को पादटिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। माप की प्राचीन इकाई אַמָּה को हिन्दी के पारंपरिक ‘हाथ’ से व्यक्त किया गया है; आधुनिक मीट्रिक अनुमान नहीं जोड़ा गया।
