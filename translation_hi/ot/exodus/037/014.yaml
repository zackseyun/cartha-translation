  text: छल्ले चौखटे के पास थे; वे मेज़ को उठाकर ले जाने के लिए डंडों के आधार थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְעֻמַּת הַמִּסְגֶּרֶת
  choice: चौखटे के पास
  rationale: לְעֻמַּת यहाँ स्थान-संबंध बताता है और इसका अर्थ ‘सामने/निकट/के पास’ हो सकता है। संदर्भ में छल्लों की चौखटे से निकटता अभिप्रेत है; ‘के पास’ स्वाभाविक हिंदी है और अनावश्यक रूप से ठीक आमने-सामने होने का अर्थ नहीं जोड़ता।
- source_word: בָּתִּים לַבַּדִּים
  choice: डंडों को थामने के लिए
  rationale: शाब्दिक रूप से ‘डंडों के लिए घर/खाने’ है, अर्थात छल्ले डंडों को रखने या थामने वाले आधार थे। कार्यात्मक हिंदी अनुवाद अर्थ को स्पष्ट और सहज रखता है।
- source_word: לָשֵׂאת אֶת־הַשֻּׁלְחָן
  choice: मेज़ उठाने के
  rationale: נשא का अर्थ यहाँ डंडों द्वारा मेज़ को उठाकर ले जाना है। संक्षिप्त ‘मेज़ उठाने के’ हिंदी में उद्देश्य स्पष्ट करता है।
