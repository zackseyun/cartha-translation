translation:
  language: hi
  text: उसने बल्लियों को बबूल की लकड़ी से बनाया और उन पर सोना मढ़ा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: उसने ... बनाया
  rationale: עשה का क़ाल वय्यिक्तोल रूप क्रमिक भूतकालीन कथन व्यक्त करता है। हिन्दी में प्रसंगगत कर्ता के साथ ‘उसने ... बनाया’ स्वाभाविक है।
- source_word: הַבַּדִּים
  choice: बल्लियों को
  rationale: निवास-स्थान के साज-सामान के प्रसंग में בַּדִּים उन बल्लियों को सूचित करता है जिनसे पवित्र वस्तुएँ उठाकर ले जाई जाती थीं। ‘बल्लियाँ’ संक्षिप्त और प्रचलित स्थापत्य-शब्दावली के अनुरूप है।
- source_word: עֲצֵי שִׁטִּים
  choice: बबूल की लकड़ी से
  rationale: यह रचना-सामग्री बताने वाला संबंध-वाक्यांश है। שִׁטָּה के लिए हिन्दी बाइबलीय प्रयोग में ‘बबूल’ सुबोध और स्थापित है।
- source_word: וַיְצַף
  choice: और ... मढ़ा
  rationale: कारीगरी के इस प्रसंग में צפה का अर्थ किसी वस्तु पर धातु की परत चढ़ाना है; ‘मढ़ा’ हिन्दी में यही अर्थ स्वाभाविक रूप से देता है।
- source_word: אֹתָם
  choice: उन पर
  rationale: पुल्लिंग बहुवचन सर्वनाम का संबंध पहले उल्लिखित बल्लियों से है। हिन्दी में ‘मढ़ना’ के साथ लक्ष्य को ‘उन पर’ कहना सहज है।
- source_word: זָהָב
  choice: सोना
  rationale: यह उस पदार्थ को बताता है जिससे बल्लियाँ मढ़ी गईं; हिन्दी वाक्य-विन्यास में ‘उन पर सोना मढ़ा’ स्पष्ट और स्वाभाविक है।
