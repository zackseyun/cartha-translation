  text: וּ/שְׁתֵּי֩ טַבְּעֹ֨ת זָהָ֜ב עָֽשָׂה ל֣/וֹ מִ/תַּ֣חַת לְ/זֵר֗/וֹ עַ֚ל שְׁתֵּ֣י צַלְעֹתָ֔י/ו עַ֖ל שְׁנֵ֣י צִדָּ֑י/ו לְ/בָתִּ֣ים לְ/בַדִּ֔ים לָ/שֵׂ֥את אֹת֖/וֹ בָּ/הֶֽם־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/027.yaml
  text: And he made for it two rings of gold under its rim[a], on its two side frames, on its two sides[b], as holders for poles with which to carry it.
translation:
  language: hi
  text: और उसने उसके लिए सोने के दो छल्ले बनाए, जो उसके सजावटी किनारे[a] के नीचे, उसकी दोनों पार्श्व-पट्टियों पर, उसके दोनों पार्श्वों पर[b] थे। वे डंडों के लिए धारक थे, ताकि उनके द्वारा उसे उठाकर ले जाया जा सके।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके किनारे के नीचे।” इब्रानी शब्द זֵר ऊपर के चारों ओर बने सजावटी किनारे या घेरे को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी में दो संबंधित अभिव्यक्तियाँ दोहराई गई हैं: “उसकी दोनों पार्श्व-पट्टियों पर, उसके दोनों पार्श्वों पर।” अनुवाद ने इस दोहराव को हटाया नहीं है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁתֵּי טַבְּעֹת זָהָב
  choice: और... सोने के दो छल्ले
  rationale: संयोजक वाव वर्णन का क्रम आगे बढ़ाता है; טַבְּעֹת धातु के छल्लों और זָהָב उनकी सामग्री को दर्शाता है।
- source_word: עָשָׂה ל/וֹ
  choice: उसने उसके लिए... बनाए
  rationale: प्रत्यय का संदर्भ पिछले पदों में वर्णित वेदी से है; हिन्दी में सम्प्रदान संबंध स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: מִ/תַּחַת לְ/זֵר/וֹ
  choice: उसके किनारे के नीचे
  rationale: זֵר यहाँ ऊपरी सजावटी घेर, किनारे या पट्टी को सूचित करता है। 'किनारा' सामान्य आधुनिक हिन्दी में स्पष्ट है, जबकि वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: עַל שְׁתֵּי צַלְעֹתָי/ו
  choice: उसकी दोनों बगल की पट्टियों पर
  rationale: צלע यहाँ संरचनात्मक बगल के भाग या पट्टी को दर्शा सकता है। 'बगल की पट्टियाँ' अगले צִדָּיו से भेद रखते हुए वस्तु के पार्श्व भाग का बोध कराता है।
- source_word: עַל שְׁנֵי צִדָּי/ו
  choice: उसकी दोनों ओर
  rationale: צד साधारणतः 'ओर/पार्श्व' है। इब्रानी की संबंधित दोहरी अभिव्यक्ति को हटाने के बजाय हिन्दी में बनाए रखा गया है।
- source_word: לְ/בָתִּים לְ/בַדִּים
  choice: डंडों के लिए कड़ियों का काम करते थे
  rationale: בָּתִּים का शाब्दिक अर्थ 'घर' है, पर यहाँ छल्लों के डंडे थामने वाले खाने या धारक होने का भाव है; 'कड़ियों का काम' हिन्दी में कार्य स्पष्ट करता है।
- source_word: לָ/שֵׂאת אֹת/וֹ בָּ/הֶם
  choice: ताकि उनके सहारे उसे उठाकर ले जाया जा सके
  rationale: क्रियार्थक रूप उद्देश्य और בָּהֶם साधन व्यक्त करता है; हिन्दी में दोनों को स्पष्ट और स्वाभाविक ढंग से रखा गया है।
