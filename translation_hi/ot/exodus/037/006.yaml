  yaml_path: translation/ot/exodus/037/006.yaml
  text: He made the mercy seat of pure gold; its length was two and a half cubits[a], and its width a cubit and a half.
translation:
  language: hi
  text: उसने शुद्ध सोने का प्रायश्चित-आवरण[a] बनाया। उसकी लंबाई ढाई हाथ और चौड़ाई डेढ़ हाथ थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दया-आसन।” इब्रानी शब्द वाचा के सन्दूक के सोने के ढकने को दर्शाता है और प्रायश्चित से भी जुड़ा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: उसने बनाया
  rationale: वय्यिक्तोल रूप बीते हुए क्रमिक कार्य को बताता है; हिन्दी में प्रसंगानुसार आरंभिक संयोजक के बिना यह स्वाभाविक है।
- source_word: כַּפֹּרֶת
  choice: प्रायश्चित-आवरण
  rationale: यह वाचा के सन्दूक के सोने के ढकने का नाम है और उसके प्रायश्चित-संबंधी धार्मिक कार्य को भी व्यक्त करता है।
- source_word: זָהָב טָהוֹר
  choice: शुद्ध सोने का
  rationale: सामग्री और उसकी शुद्धता को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: אַמָּתַיִם וָחֵצִי
  choice: ढाई हाथ
  rationale: इब्रानी माप को हिन्दी बाइबलीय प्रयोग में प्रचलित ‘हाथ’ और स्वाभाविक संख्या-रूप में प्रस्तुत करता है।
- source_word: אָרְכָּהּ
  choice: उसकी लंबाई
  rationale: स्त्रीलिंग प्रत्यय का संबंध प्रायश्चित-आवरण से है; हिन्दी में ‘उसकी’ संदर्भ को स्पष्ट रखता है।
- source_word: וְאַמָּה וָחֵצִי
  choice: और ... डेढ़ हाथ
  rationale: इब्रानी ‘एक हाथ और आधा’ का स्वाभाविक हिन्दी माप-रूप है।
- source_word: רָחְבָּהּ
  choice: चौड़ाई
  rationale: आधुनिक हिन्दी में आयाम के लिए स्पष्ट और सामान्य शब्द है।
theological_decisions:
- issue: उपासना-संबंधी प्रसंग में כַּפֹּרֶת का अनुवाद
  choice: प्रायश्चित-आवरण
  alternative: दया-आसन; ढकना
  rationale: यह चयन वस्तु के रूप में सन्दूक के आवरण और प्रायश्चित से उसके संबंध—दोनों को बनाए रखता है। ‘दया-आसन’ पारंपरिक विकल्प है, पर हिन्दी में वस्तु को वास्तविक आसन समझे जाने की आशंका है; इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। माप के लिए हिन्दी बाइबलीय परंपरा का ‘हाथ’ रखा गया है; वाक्य-विन्यास संक्षिप्त और मूल के आयाम-क्रम के अनुरूप है।
