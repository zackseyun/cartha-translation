    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַפֵּהוּ
  choice: उसने उसे ... मढ़ा
  rationale: पिअेल रूप यहाँ किसी वस्तु पर धातु की परत चढ़ाने का अर्थ देता है; शिल्पकारी के संदर्भ में ‘मढ़ा’ सटीक और स्वाभाविक हिंदी है।
- source_word: זָהָב טָהוֹר
  choice: शुद्ध सोने से
  rationale: यह पदबंध सोने की शुद्धता बताता है; ‘शुद्ध सोना’ आधुनिक हिंदी में स्पष्ट और प्रचलित है।
- source_word: מִבַּיִת וּמִחוּץ
  choice: भीतर और बाहर
  rationale: यह युग्म वस्तु की भीतरी और बाहरी दोनों सतहों को सूचित करता है।
- source_word: וַיַּעַשׂ לוֹ
  choice: उसके ... बनाई
  rationale: לֹו वस्तु को अप्रत्यक्ष प्राप्तकर्ता के रूप में चिह्नित करता है; हिंदी में ‘उसके ... बनाई’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: זֵר
  choice: सजावटी किनारी
  rationale: मिलापवाले तंबू के सामान के संदर्भ में זֵר चारों ओर बनी उठी हुई या सजावटी किनारी को दर्शाता है; ‘किनारी’ सहज है और ‘सजावटी’ इसके कार्यगत भाव को स्पष्ट करता है।
- source_word: זֵר זָהָב
  choice: सोने की एक सजावटी किनारी
  rationale: यह रचना किनारी की सामग्री को सोना बताती है; हिंदी में संबंधकारक संरचना स्वाभाविक है।
- source_word: סָבִיב
  choice: चारों ओर
  rationale: यह शब्द वस्तु को सब ओर से घेरे होने का भाव स्पष्ट रूप से बनाए रखता है।
