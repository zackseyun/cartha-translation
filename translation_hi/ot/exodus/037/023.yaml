    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: उसने ... बनाईं
  rationale: עשה के वय्यिक्तोल रूप को स्वाभाविक हिन्दी कथन-शैली में साधारण भूतकाल से व्यक्त किया गया है; आरम्भिक וַ को अलग से व्यक्त करना आवश्यक नहीं है।
- source_word: נֵרֹתֶיהָ שִׁבְעָה
  choice: उसके सात दीपक
  rationale: נֵרוֹת का अर्थ दीपक है, दीपवृक्ष नहीं; स्त्रीलिंग एकवचन प्रत्यय का संकेत प्रसंग में दीपवृक्ष की ओर है। संख्या को स्वाभाविक हिन्दी क्रम में संज्ञा से पहले रखा गया है।
- source_word: מַלְקָחֶיהָ
  choice: उसकी बत्ती सँवारने की चिमटियाँ
  rationale: यह दीपकों की बत्तियों को पकड़ने या सँवारने के उपकरण को सूचित करता है। केवल ‘चिमटियाँ’ की अपेक्षा यह प्रयोग वस्तु का कार्य स्पष्ट करता है, पर ‘बत्ती बुझाने का औज़ार’ जैसा अधिक संकीर्ण अर्थ नहीं थोपता।
- source_word: מַחְתֹּתֶיהָ
  choice: उसकी राख की तश्तरियाँ
  rationale: दीपवृक्ष के प्रसंग में यह छोटे पात्रों या तश्तरियों को सूचित करता है, सम्भवतः जली बत्ती या राख रखने के लिए। ‘अंगारदानियाँ’ वेदी-संबंधी उपयोग का अनावश्यक आभास दे सकता है; विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: זָהָב טָהוֹר
  choice: शुद्ध सोने की
  rationale: यह सामग्री बताने वाला पद है; हिन्दी में ‘शुद्ध सोने की बनाईं’ स्वाभाविक और स्पष्ट है तथा सभी उल्लिखित वस्तुओं पर लागू होता है।
