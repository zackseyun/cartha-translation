  text: He made the table of acacia wood; its length was two cubits[a], its width one cubit, and its height one and a half cubits.
translation:
  language: hi
  text: उसने बबूल की लकड़ी की मेज़ बनाई। उसकी लंबाई दो हाथ[a], चौड़ाई एक हाथ और ऊँचाई डेढ़ हाथ थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: एक हाथ प्राचीन लंबाई की एक इकाई था, जो लगभग कोहनी से उँगली के सिरे तक की दूरी के बराबर थी।
    reason: ‘हाथ’ को आधुनिक पाठक के लिए स्पष्ट करना, बिना उसकी लंबाई को अनावश्यक रूप से निश्चित बताए।
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: उसने ... बनाई
  rationale: वाव-क्रमिक रूप बीते हुए कथात्मक कार्य को बताता है। हिंदी में पद के आरंभ में बार-बार ‘और’ न जोड़ना स्वाभाविक है; स्त्रीलिंग क्रिया ‘मेज़’ के अनुरूप है।
- source_word: הַשֻּׁלְחָן
  choice: मेज़
  rationale: यह संज्ञा यहाँ मिलापवाले निवास की निश्चित मेज़ को दर्शाती है; हिंदी में प्रसंग से निश्चितता स्पष्ट है।
- source_word: עֲצֵי שִׁטִּים
  choice: बबूल की लकड़ी
  rationale: निर्माण-सामग्री के रूप में यह आधुनिक हिंदी का स्पष्ट और प्रचलित पर्याय है; पारंपरिक ‘शित्तीम’ सामान्य पाठक के लिए कम बोधगम्य है।
- source_word: אַמָּתַיִם
  choice: दो हाथ
  rationale: אַמָּה प्राचीन लंबाई की इकाई ‘क्यूबिट’ है। हिंदी बाइबल-परंपरा और सामान्य बोध में ‘हाथ’ इसका स्वाभाविक ऐतिहासिक इकाई-सूचक रूप है।
- source_word: אָרְכּוֹ
  choice: उसकी लंबाई
  rationale: पुल्लिंग एकवचन प्रत्यय का संदर्भ मेज़ से है; हिंदी में स्वामित्वसूचक ‘उसकी’ मेज़ के स्त्रीलिंग के अनुसार आता है।
- source_word: וְאַמָּה רָחְבּוֹ
  choice: चौड़ाई एक हाथ
  rationale: दूसरे आयाम और उसकी ठीक माप को संक्षिप्त, स्वाभाविक हिंदी में रखा गया है।
- source_word: וְאַמָּה וָחֵצִי
  choice: डेढ़ हाथ
  rationale: ‘एक हाथ और आधा’ का स्वाभाविक आधुनिक हिंदी रूप ‘डेढ़ हाथ’ है और माप ठीक वही रहता है।
- source_word: קֹמָתוֹ
  choice: ऊँचाई
  rationale: वस्तु के वर्णन में קֹמָה उसके खड़े आयाम, अर्थात ऊँचाई, को दर्शाता है।
