  text: וַ/יִּהְי֣וּ הַ/כְּרֻבִים֩ פֹּרְשֵׂ֨י כְנָפַ֜יִם לְ/מַ֗עְלָ/ה סֹֽכְכִ֤ים בְּ/כַנְפֵי/הֶם֙ עַל הַ/כַּפֹּ֔רֶת וּ/פְנֵי/הֶ֖ם אִ֣ישׁ אֶל אָחִ֑י/ו אֶל הַ/כַּפֹּ֔רֶת הָי֖וּ פְּנֵ֥י הַ/כְּרֻבִֽים־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/009.yaml
  text: The cherubim had their wings spread upward[a], overshadowing the mercy seat with their wings, and their faces were toward one another; the faces of the cherubim were toward the mercy seat.
translation:
  language: hi
  text: करूब अपने पंख ऊपर की ओर फैलाए हुए थे और अपने पंखों से प्रायश्चित-आवरण[a] पर छाया किए हुए थे। उनके मुख एक-दूसरे की ओर थे; करूबों के मुख प्रायश्चित-आवरण की ओर थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक शाब्दिक रूप से, “ढकना”; इसे “प्रायश्चित का ढकना” भी कहा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכְּרֻבִים
  choice: करूब
  rationale: इब्रानी धार्मिक-सांस्कृतिक पद का प्रचलित लिप्यंतरण रखा गया है; सन्दर्भ से इसका बहुवचन स्पष्ट है।
- source_word: פֹּרְשֵׂי כְנָפַיִם לְמַעְלָה
  choice: अपने पंख ऊपर की ओर फैलाए हुए थे
  rationale: प्रतिभागी पदबंध और क्रिया को स्वाभाविक हिन्दी में जोड़ते हुए पंखों की ऊपर की दिशा और फैली हुई मुद्रा दोनों सुरक्षित रखी गई हैं।
- source_word: סֹכְכִים
  choice: ढाँपे हुए थे
  rationale: यह ऊपर से ढकने या आच्छादित करने की मुद्रा बताता है; ‘ढाँपे हुए’ पंखों द्वारा आवरण देने के दृश्य को सहज रूप से व्यक्त करता है, बिना पूर्णतः छिपा देने का अनावश्यक अर्थ जोड़े।
- source_word: הַכַּפֹּרֶת
  choice: प्रायश्चित का ढकना
  rationale: यह वाचा के सन्दूक के विशिष्ट ऊपरी ढकने को दर्शाता है और पद की प्रायश्चित-संबंधी धार्मिक भूमिका को भी संकेतित करता है। अधिक शाब्दिक विकल्प ‘ढकना’ पादटिप्पणी में दिया गया है।
- source_word: בְּכַנְפֵיהֶם
  choice: अपने पंखों से
  rationale: साधन सूचक בְ को स्वाभाविक हिन्दी ‘से’ द्वारा व्यक्त किया गया है।
- source_word: וּפְנֵיהֶם אִישׁ אֶל אָחִיו
  choice: उनके मुख एक-दूसरे की ओर थे
  rationale: शाब्दिक मुहावरे ‘एक जन अपने भाई की ओर’ का पारस्परिक अर्थ वर्तमान हिन्दी में स्पष्ट और स्वाभाविक रूप से दिया गया है।
- source_word: אֶל הַכַּפֹּרֶת הָיוּ פְּנֵי הַכְּרֻבִים
  choice: करूबों के मुख प्रायश्चित के ढकने की ओर थे
  rationale: इब्रानी की पुनरुक्ति और मुखों पर दिए गए बल को बनाए रखा गया है; इसे केवल ‘करूब ढकने की ओर मुख किए थे’ कहकर संक्षिप्त नहीं किया गया।
theological_decisions:
- issue: मिलापवाले तम्बू के सन्दर्भ में הַכַּפֹּרֶת का अनुवाद
  choice: प्रायश्चित का ढकना
  alternative: ढकना; प्रायश्चित-आवरण; दया-आसन
  rationale: मूल पद वस्तुतः सन्दूक के ढकने को बताता है, पर उसका धार्मिक प्रयोग प्रायश्चित से जुड़ा है। ‘प्रायश्चित का ढकना’ वस्तु और उसके धार्मिक कार्य दोनों को पहचानने योग्य बनाता है; अधिक शाब्दिक ‘ढकना’ पादटिप्पणी में रखकर शब्दार्थ की वास्तविक गुंजाइश सुरक्षित रखी गई है। परम्परागत ‘दया-आसन’ को मुख्य पाठ में नहीं लिया गया, क्योंकि वह मूल वस्तु की छवि को कम स्पष्ट करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘करूब’ और ‘प्रायश्चित’ जैसे आवश्यक धार्मिक पद बनाए गए हैं, जबकि वाक्य-विन्यास स्वाभाविक हिन्दी का है। पादटिप्पणी का चिह्न उसी पद के बाद रखा गया है जिससे वह वास्तव में संबंधित है।
