  yaml_path: translation/ot/exodus/037/029.yaml
  text: He made the holy anointing oil and the pure fragrant incense[b][a], the work of a perfumer.
translation:
  language: hi
  text: उसने पवित्र अभिषेक का तेल और शुद्ध सुगंधित धूप[a] तैयार किए; यह सुगंध-द्रव्य मिलानेवाले कारीगर की कारीगरी थी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सुगंध-द्रव्यों की धूप” अथवा “सुगंधित द्रव्यों से बनी धूप।” इब्रानी अभिव्यक्ति का शाब्दिक आशय सुगंधित पदार्थों से बनी धूप है।
    reason: lexical_alternative
  - marker: b
    text: या “सुगंध-द्रव्य मिलानेवाले कारीगर की कारीगरी” अथवा “कुशल कारीगर द्वारा मिश्रित।” इब्रानी में किसी विशेषज्ञ द्वारा कुशलतापूर्वक तैयार किए जाने पर बल है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: उसने ... बनाई
  rationale: वय्यिक्तोल रूप पूर्ण भूतकाल की अगली कथात्मक क्रिया बताता है। हिन्दी में ‘उसने ... बनाई’ स्वाभाविक है; क्रिया दोनों स्त्रीलिंग कर्मों—तेल और धूप—के संयुक्त उल्लेख के बाद आती है।
- source_word: שֶׁמֶן הַמִּשְׁחָה קֹדֶשׁ
  choice: पवित्र अभिषेक का तेल
  rationale: यह पद अभिषेक के लिए अलग किए गए पवित्र तेल को दर्शाता है। यह रूप स्रोत की संज्ञात्मक संरचना को काफी निकट रखते हुए आधुनिक हिन्दी में स्पष्ट है।
- source_word: קְטֹרֶת הַסַּמִּים
  choice: सुगंधित धूप
  rationale: शाब्दिक अर्थ ‘सुगंध-द्रव्यों की धूप’ है। ‘सुगंधित धूप’ सामान्य पाठक के लिए स्वाभाविक है और सुगंधित पदार्थों से बनी धूप का आशय बनाए रखता है।
- source_word: טָהוֹר
  choice: शुद्ध
  rationale: इस धार्मिक और पदार्थ-संबंधी प्रसंग में यह धूप की शुद्धता बताता है; ‘शुद्ध’ मानक और स्पष्ट हिन्दी विकल्प है।
- source_word: מַעֲשֵׂה רֹקֵחַ
  choice: सुगंध-द्रव्य तैयार करनेवाले कारीगर का काम
  rationale: यह पद किसी कुशल मिश्रणकर्ता या सुगंध-द्रव्य बनानेवाले विशेषज्ञ की कारीगरी पर बल देता है। चुना हुआ रूप ‘इत्रसाज़’ जैसे कम सर्वसुलभ शब्द से बचते हुए विशेषज्ञता और संज्ञात्मक अभिव्यक्ति दोनों को सुरक्षित रखता है।
