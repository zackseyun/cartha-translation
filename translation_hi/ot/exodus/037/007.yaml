translation:
  language: hi
  text: उसने सोने के दो करूब बनाए; उसने उन्हें प्रायश्चित्त के ढकने के दोनों सिरों से पीटकर गढ़ा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: उसने बनाए
  rationale: वाव-क्रमिक रूप कथा की अगली क्रिया बताता है। आधुनिक हिन्दी में हर वाक्य के आरम्भ में ‘और’ जोड़ना आवश्यक नहीं है।
- source_word: שְׁנֵי כְרֻבִים
  choice: दो करूब
  rationale: ‘करूब’ पवित्र सन्दूक और निवास-स्थान से जुड़े विशिष्ट स्वर्गीय प्राणियों के लिए हिन्दी बाइबलीय प्रयोग में पहचाना जाने वाला शब्द है।
- source_word: זָהָב
  choice: सोने के
  rationale: यह संज्ञा करूबों के निर्माण की सामग्री बताती है; ‘सोने के’ स्वाभाविक हिन्दी अभिव्यक्ति है।
- source_word: מִקְשָׁה
  choice: हथौड़े से गढ़कर
  rationale: यह शब्द धातु को पीटकर आकार देने की कारीगरी को सूचित करता है। यह अनुवाद निर्माण-विधि को स्पष्ट रखता है, पर ‘एक ही टुकड़े से’ जैसी सन्दर्भगत व्याख्या को मूल अर्थ में नहीं जोड़ता।
- source_word: עָשָׂה אֹתָם
  choice: उसने उन्हें ... बनाया
  rationale: मूल में עשה की पुनरावृत्ति निर्माण और उसकी विधि पर बल देती है; हिन्दी में भी इसे बनाए रखा गया है।
- source_word: מִשְּׁנֵי קְצוֹת
  choice: दोनों सिरों से
  rationale: מִן स्रोत या उद्गम का भाव देता है; करूब ढकने के दोनों सिरों से निर्मित हुए थे, केवल उनके पास रखे नहीं गए थे।
- source_word: הַכַּפֹּרֶת
  choice: प्रायश्चित्त का ढकना
  rationale: यह सन्दूक के सोने के ढकने का नाम है, जिसका सम्बन्ध प्रायश्चित्त से है। यह रूप वस्तु और उसके धार्मिक प्रयोजन दोनों को स्पष्ट करता है।
theological_decisions:
- issue: הַכַּפֹּרֶת का अनुवाद
  choice: प्रायश्चित्त का ढकना
  alternative: कृपा-आसन; ढकना
  rationale: मूल शब्द सन्दूक के उस ढकने को सूचित करता है जो प्रायश्चित्त की विधि से जुड़ा है। ‘प्रायश्चित्त का ढकना’ वर्णनात्मक और स्रोत-संगत है; परम्परागत ‘कृपा-आसन’ को पादटिप्पणी में रखा गया है ताकि किसी एक धर्मवैज्ञानिक व्याख्या को चुपचाप निर्णायक न बनाया जाए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। धातु-कारीगरी के तकनीकी भाव को ‘हथौड़े से गढ़कर’ व्यक्त किया गया है और मूल में ‘बनाने’ की पुनरावृत्ति सुरक्षित रखी गई है।
