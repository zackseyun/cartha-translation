    text: या “उसके चारों कोनों पर” अथवा “उसके चारों आधारों पर”; इब्रानी शब्द पायों, निचले छोरों या सहारे के बिंदुओं के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצֹק
  choice: ढाले
  rationale: धातु-कर्म के संदर्भ में יצק पिघली हुई धातु को साँचे में ढालने का बोध देता है; इसलिए ‘ढाले’ स्वाभाविक और सटीक है।
- source_word: לוֹ
  choice: उसके लिए
  rationale: प्रत्यय का संदर्भ पिछले प्रसंग में वर्णित सन्दूक से है; ‘उसके लिए’ इस संबंध को स्पष्ट रखता है।
- source_word: טַבְּעֹת זָהָב
  choice: सोने के चार कड़े
  rationale: טבעת यहाँ डंडों को थामने वाले छल्ले या कड़े हैं। सन्दूक-संबंधी भाषा में ‘कड़े’ संक्षिप्त, सहज और प्रतिष्ठित हिंदी है।
- source_word: פַּעֲמֹתָיו
  choice: उसके चारों पायों
  rationale: यह दुर्लभ शब्द पाँव, निचले छोर, कोने या आधार-बिंदु का संकेत कर सकता है। मुख्य पाठ में ‘पायों’ ठोस और सहज है, जबकि वास्तविक शाब्दिक अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: צַלְעוֹ
  choice: ओर
  rationale: वस्तु के संबंध में צלע का अर्थ ‘पार्श्व/बगल’ है। यहाँ ‘एक ओर ... दूसरी ओर’ आधुनिक हिंदी में स्वाभाविक रूप से दोनों पार्श्वों को व्यक्त करता है।
- source_word: הָאֶחָת ... הַשֵּׁנִית
  choice: एक ओर ... दूसरी ओर
  rationale: यह इब्रानी के शाब्दिक ‘एक पार्श्व ... दूसरे पार्श्व’ का सहज हिंदी रूप है और प्रत्येक ओर दो कड़ों की व्यवस्था स्पष्ट करता है।
