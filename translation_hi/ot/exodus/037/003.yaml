translation:
  language: hi
  text: उसने उसके लिए उसके चार पायों[a] पर सोने के चार कड़े ढाले—एक पार्श्व पर दो कड़े और दूसरे पार्श्व पर दो कड़े।
  philosophy: optimal-equivalence
  footnotes:
