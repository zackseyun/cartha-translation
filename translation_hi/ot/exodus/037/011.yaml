  text: He overlaid it with pure gold[a], and made for it a gold molding all around.
translation:
  language: hi
  text: उसने उस पर शुद्ध सोना मढ़ा और उसके चारों ओर सोने की एक सजावटी पट्टी[a] बनाई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या ‘सोने की किनारी’; परंपरागत अनुवाद: ‘सोने का मुकुट’।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַף
  choice: मढ़ा
  rationale: धातु की परत चढ़ाने के शिल्पगत अर्थ को स्वाभाविक और सटीक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אֹתוֹ
  choice: उस पर
  rationale: सर्वनाम पिछले पद की मेज़ की ओर संकेत करता है; हिन्दी में ‘उस पर ... मढ़ा’ स्वाभाविक संरचना है।
- source_word: זָהָב טָהוֹר
  choice: शुद्ध सोना
  rationale: सोने की उच्च शुद्धता का सीधा और प्रचलित हिन्दी रूप।
- source_word: וַיַּעַשׂ לוֹ
  choice: उसके ... बनाई
  rationale: לֹו के संबंधसूचक भाव को ‘उसके ...’ द्वारा बनाए रखा गया है, अर्थात पट्टी मेज़ के लिए/उससे लगी हुई बनाई गई।
- source_word: זֵר
  choice: सजावटी पट्टी
  rationale: यहाँ मेज़ के चारों ओर बनी हुई कारीगरीयुक्त किनारी या उठी हुई पट्टी अभिप्रेत है; ‘सजावटी पट्टी’ सामान्य पाठक के लिए स्पष्ट है, जबकि शब्द की अन्य संभावनाएँ पादटिप्पणी में सुरक्षित हैं।
- source_word: זָהָב
  choice: सोने की
  rationale: सामग्री को सीधे और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: סָבִיב
  choice: चारों ओर
  rationale: पूरी तरह घेरे रहने का भाव देने वाला स्वाभाविक आधुनिक हिन्दी प्रयोग।
