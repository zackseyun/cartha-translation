  yaml_path: translation/ot/exodus/037/005.yaml
  text: And he put the poles into the rings on the sides of the ark, to carry the ark.
translation:
  language: hi
  text: उसने सन्दूक को उठाकर ले जाने के लिए उसके दोनों ओर के छल्लों में डंडे डाल दिए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֵא
  choice: डाल दिए
  rationale: בוא का मूल अर्थ ‘लाना/आना’ है, पर डंडों और छल्लों के इस विन्यास में इसका आशय छल्लों के भीतर डंडे डालना है।
- source_word: הַבַּדִּים
  choice: डंडे
  rationale: בַּדִּים से पवित्र साज-सामान को उठाकर ले जाने वाले लंबे डंडे अभिप्रेत हैं; ‘डंडे’ सहज और आधुनिक हिन्दी है।
- source_word: בַּטַּבָּעֹת
  choice: छल्लों में
  rationale: בְּ यहाँ छल्लों के भीतर डंडे डाले जाने का स्थान बताता है।
- source_word: עַל צַלְעֹת הָאָרֹן
  choice: सन्दूक के दोनों ओर के
  rationale: צְלָעוֹת सन्दूक की पार्श्व दिशाओं को दर्शाता है; बहुवचन के कारण ‘दोनों ओर’ हिन्दी में स्वाभाविक रूप से वही दृश्य प्रस्तुत करता है।
- source_word: הָאָרֹן
  choice: सन्दूक
  rationale: אָרוֹן एक पेटीनुमा पवित्र पात्र को सूचित करता है। ‘सन्दूक’ आधुनिक हिन्दी में वस्तु का स्वरूप स्पष्ट रखता है और प्रसंग में उसकी पवित्रता स्वयं प्रकट होती है।
- source_word: לָשֵׂאת
  choice: उठाकर ले जाने के लिए
  rationale: נשׂא का infinitive यहाँ उद्देश्य बताता है। ‘उठाकर ले जाना’ केवल सामान्य ‘ले जाना’ की अपेक्षा डंडों द्वारा भार वहन करने की क्रिया अधिक स्पष्ट करता है।
