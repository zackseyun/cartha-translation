lexical_decisions:
- source_word: וּ/בַ/מְּנֹרָה
  choice: और दीपदान पर
  rationale: संयोजक וּ और स्थानसूचक בַּ यहाँ दीपदान पर लगे सजावटी अंगों का स्थान बताते हैं। ‘दीपदान’ इस पवित्र-स्थान की वस्तु के लिए सहज और प्रतिष्ठित हिन्दी शब्द है।
- source_word: אַרְבָּעָה
  choice: चार
  rationale: यह अगले पुल्लिंग बहुवचन संज्ञा ‘प्याले’ की सीधी संख्या है।
- source_word: גְבִעִים
  choice: प्याले
  rationale: यह शब्द प्याले या कटोरे जैसे आकार के सजावटी अंगों को दर्शाता है; ‘प्याले’ आकार को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מְשֻׁקָּדִים
  choice: बादाम के फूलों के आकार के
  rationale: यह रूप बादाम या उसके पुष्प-सदृश नमूने में गढ़े जाने का भाव देता है। यह अनुवाद सजावटी आकृति को स्पष्ट रखते हुए मूल के आशय के निकट है।
- source_word: כַּפְתֹּרֶיהָ
  choice: उसकी कलियाँ
  rationale: כפתור दीपदान पर लगी गाँठ या उभार जैसी सजावट को दर्शाता है। पुष्पात्मक प्रसंग में ‘कलियाँ’ स्वाभाविक है, जबकि ‘गाँठें’ एक सम्भव अधिक आकारप्रधान विकल्प है।
- source_word: וּפְרָחֶיהָ
  choice: और उसके फूल
  rationale: פֶּרַח का अर्थ फूल या पुष्प है। ‘फूल’ आधुनिक हिन्दी में स्पष्ट है और ‘कलियाँ’ के साथ स्वाभाविक युग्म बनाता है।
