  text: He overlaid it with pure gold—its top[a], its sides all around, and its horns—and he made for it a gold molding all around.
translation:
  language: hi
  text: उसने उसे शुद्ध सोने से मढ़ा—उसका ऊपरी भाग, उसकी चारों ओर की दीवारें और उसके सींग—और उसके चारों ओर सोने की एक सजावटी किनारी[a] बनाई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “चारों ओर सोने का मुकुट।” यहाँ प्रयुक्त इब्रानी शब्द वस्तु के चारों ओर बनी सजावटी पट्टी या किनारी को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַף
  choice: मढ़ा
  rationale: तम्बू के साज-सामान के संदर्भ में क्रिया צפה लकड़ी की वस्तु पर धातु का आवरण चढ़ाने को व्यक्त करती है; ‘मढ़ा’ इसका स्वाभाविक और संक्षिप्त हिन्दी रूप है।
- source_word: זָהָב טָהוֹר
  choice: शुद्ध सोना
  rationale: यह पद सोने की शुद्धता और गुणवत्ता पर बल देता है; ‘शुद्ध सोना’ आधुनिक हिन्दी में स्पष्ट और सहज है।
- source_word: גַּגּוֹ
  choice: उसका ऊपरी भाग
  rationale: גג का सामान्य अर्थ ‘छत’ है, पर छोटी वेदी के संदर्भ में इससे उसकी ऊपरी सतह अभिप्रेत है; ‘ऊपरी भाग’ स्वाभाविक और सटीक है।
- source_word: קִירֹתָיו
  choice: चारों ओर की दीवारें
  rationale: मूल शब्द का सीधा अर्थ ‘दीवारें’ है। वस्तु के संदर्भ में यह उसकी खड़ी पार्श्व सतहों को दर्शाता है; ‘चारों ओर’ सָבִיב की व्यापकता को भी सुरक्षित रखता है।
- source_word: קַרְנֹתָיו
  choice: उसके सींग
  rationale: वेदी के कोनों पर निकले हुए सींगों के लिए प्रयुक्त पारिभाषिक शब्द को शाब्दिक रूप में बनाए रखा गया है।
- source_word: זֵר
  choice: सजावटी किनारी
  rationale: यह शब्द वस्तु को चारों ओर से घेरे हुए अलंकृत घेरे, पट्टी या उभरी किनारी को दर्शाता है। ‘सजावटी किनारी’ सामान्य पाठक के लिए स्पष्ट है और राजकीय मुकुट का भ्रामक बिंब उत्पन्न नहीं करती।
- source_word: סָבִיב
  choice: चारों ओर
  rationale: यह वस्तु को घेरे हुए संपूर्ण विस्तार को व्यक्त करता है; ‘चारों ओर’ हिन्दी में सहज और व्यापकता-सूचक है।
