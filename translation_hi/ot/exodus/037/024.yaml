  yaml_path: translation/ot/exodus/037/024.yaml
  text: He made it and all its utensils from a talent of pure gold[a].
translation:
  language: hi
  text: उसने उसे और उसके सब उपकरणों को एक किक्कार शुद्ध सोने से बनाया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके सब पात्रों” अथवा “उससे जुड़ी सब वस्तुओं।” इब्रानी כֵּלִים दीपवृक्ष से संबंधित वस्तुओं या उपकरणों के लिए एक व्यापक शब्द है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּכָּר
  choice: एक किक्कार
  rationale: मिलापवाले तंबू के निर्माण के संदर्भ में यह भार की प्राचीन इकाई है। ‘किक्कार’ मूल इकाई के नाम को बनाए रखता है; पद स्वयं आधुनिक भार-समतुल्य नहीं बताता।
- source_word: זָהָב טָהוֹר
  choice: शुद्ध सोना
  rationale: यह चयन पदार्थ की शुद्धता को स्वाभाविक और प्रचलित हिन्दी में व्यक्त करता है।
- source_word: עָשָׂה
  choice: बनाया
  rationale: सामान्य क्रिया עשה का सीधा और सहज हिन्दी अनुवाद है।
- source_word: אֹתָהּ
  choice: उसे
  rationale: स्त्रीलिंग एकवचन प्रत्यय पिछले संदर्भ की दीपवृक्ष-संज्ञा की ओर संकेत करता है; हिन्दी में सर्वनाम संदर्भ को स्वाभाविक रूप से बनाए रखता है।
- source_word: וְאֵת כָּל כֵּלֶיהָ
  choice: और उसके सब उपकरणों को
  rationale: כֵּלִים एक व्यापक शब्द है, जो दीपवृक्ष से जुड़ी वस्तुओं, पात्रों या औज़ारों को सूचित कर सकता है; ‘उपकरण’ आधुनिक हिन्दी में इसकी व्यापकता को पर्याप्त रूप से बनाए रखता है।
