translation:
  language: hi
  text: उसने बबूल की लकड़ी के डंडे बनाए और उन पर सोना मढ़ा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: उसने बनाए
  rationale: עשה का क़ल वय्यिक्तोल रूप क्रमिक कथा में ‘उसने बनाया’ व्यक्त करता है; हिन्दी में आरम्भिक संयोजक को छोड़े बिना भी कथा-क्रम स्वाभाविक रूप से स्पष्ट है।
- source_word: בַּדֵּי
  choice: डंडे
  rationale: पवित्र वस्तु को उठाकर ले जाने के लिए लगे लंबे डंडों के अर्थ में यह सरल और प्रचलित आधुनिक हिन्दी शब्द है।
- source_word: עֲצֵי שִׁטִּים
  choice: बबूल की लकड़ी
  rationale: यह रचना शिट्टा वृक्ष की लकड़ी को दर्शाती है; ‘बबूल’ आधुनिक हिन्दी पाठक के लिए सहज और परंपरागत रूप से उपयुक्त वनस्पति-संज्ञा है।
- source_word: וַיְצַף
  choice: मढ़ा
  rationale: कारीगरी के इस प्रसंग में צפה किसी वस्तु की सतह पर धातु चढ़ाने को दर्शाता है; ‘सोना मढ़ना’ स्वाभाविक और सटीक हिन्दी है।
- source_word: אֹתָם
  choice: उन पर
  rationale: बहुवचन सर्वनाम का संदर्भ पहले बताए गए डंडों से है; हिन्दी में ‘उन पर ... मढ़ा’ इस वस्तु-संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: זָהָב
  choice: सोना
  rationale: मढ़ाई में प्रयुक्त पदार्थ सोना है; ‘सोना मढ़ा’ हिन्दी का स्वाभाविक प्रयोग है।
