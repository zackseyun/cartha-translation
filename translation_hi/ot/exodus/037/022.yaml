  text: उसकी कलियाँ[a] और उसकी शाखाएँ उसी से बनी थीं[b]; वह सारी की सारी शुद्ध सोने की पीटकर गढ़ी हुई एक ही रचना थी[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके गोल सजावटी उभार।” इब्रानी शब्द फूलों जैसे रूप में बने गोल अलंकरण को दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उसी से थीं”; अर्थात कलियाँ और शाखाएँ दीपवृक्ष के साथ एक ही धातु-खंड से बनाई गई थीं।
    reason: lexical_alternative
  - marker: c
    text: या, “वह शुद्ध सोने के एक ही टुकड़े से पीटकर गढ़ी गई थी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּפְתֹּרֵיהֶם
  choice: उसके फूलों की कलियाँ
  rationale: दीपवृक्ष के पुष्प-अलंकरण के संदर्भ में यह शब्द गोल सजावटी उभारों को दर्शाता है; ‘फूलों की कलियाँ’ आधुनिक हिन्दी में इस चित्र को स्वाभाविक और ठोस रूप से व्यक्त करता है।
- source_word: וּקְנֹתָם
  choice: और उसकी शाखाएँ
  rationale: קָנֶה का मूल अर्थ सरकंडा या डंठल हो सकता है, पर दीपवृक्ष के संदर्भ में इससे बाहर की ओर निकली भुजाएँ अभिप्रेत हैं; ‘शाखाएँ’ सर्वाधिक सहज है।
- source_word: מִמֶּנָּה הָיוּ
  choice: उसी में से निकली हुई थीं
  rationale: शाब्दिक ‘उसी से थीं’ को स्वाभाविक हिन्दी में इस प्रकार व्यक्त किया गया है, जिससे यह स्पष्ट रहता है कि कलियाँ और शाखाएँ अलग जोड़ नहीं, बल्कि दीपवृक्ष के उसी धातु-खंड से बनी थीं।
- source_word: כֻּלָּהּ
  choice: वह पूरी की पूरी
  rationale: स्त्रीलिंग एकवचन प्रत्यय दीपवृक्ष की संपूर्णता पर बल देता है; यह हिन्दी प्रयोग उस व्यापक बल को सुरक्षित रखता है।
- source_word: מִקְשָׁה אַחַת
  choice: पीटकर बनाई गई एक ही रचना
  rationale: מִקְשָׁה धातु को पीटकर गढ़ी गई वस्तु और אַחַת उसकी एकात्मकता दर्शाता है; चुना गया वाक्यांश दोनों अर्थों को स्पष्ट और स्वाभाविक ढंग से रखता है।
- source_word: זָהָב טָהוֹר
  choice: शुद्ध सोने
  rationale: मिलापवाले तम्बू के निर्माण-वर्णन में सामग्री के लिए यह मानक और सटीक हिन्दी अभिव्यक्ति है।
