  yaml_path: translation/ot/exodus/037/008.yaml
  text: one cherub from one end on this side[a], and one cherub from one end on that side; from the mercy seat he made the cherubim on its two ends.
translation:
  language: hi
  text: उसने इस ओर के एक सिरे से एक करूब और उस ओर के एक सिरे से एक करूब बनाया; उसने करूबों को प्रायश्चित-आवरण[a] के दोनों सिरों से बनाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आवरण/ढकना” अथवा “दया-आसन”; इब्रानी कप्पोरेत, वाचा के संदूक का सोने का आवरण।
    reason: कप्पोरेत के भौतिक ‘आवरण’ अर्थ और पारंपरिक उपासना-संबंधी ‘दया-आसन’ विकल्प को पारदर्शी रखना।
lexical_decisions:
- source_word: כְּרוּב
  choice: करूब
  rationale: यह सन्दूक से जुड़े विशिष्ट पंखों वाले प्राणियों का पारंपरिक और सटीक नाम है; वर्णनात्मक परिभाषा जोड़ना मूल से अधिक कहना होता।
- source_word: מִקָּצָה מִזֶּה ... מִקָּצָה מִזֶּה
  choice: इस सिरे पर ... उस सिरे पर
  rationale: युग्मित अभिव्यक्ति दो विपरीत सिरों को दिखाती है; आधुनिक हिन्दी में यह स्थानिक भेद स्वाभाविक और स्पष्ट है।
- source_word: הַכַּפֹּרֶת
  choice: प्रायश्चित-आवरण
  rationale: यह वाचा के सन्दूक के सोने के ढकने का पारिभाषिक उपासना-संबंधी नाम है। यह चयन वस्तु के आवरण होने और उसके प्रायश्चित-संबंधी महत्त्व, दोनों को संक्षेप में बनाए रखता है।
- source_word: עָשָׂה
  choice: बनाया / बनाए
  rationale: सामान्य क्रिया का सीधा और स्वाभाविक हिन्दी रूप; इससे मूल में निहित साधारण निर्माण-अर्थ सुरक्षित रहता है।
- source_word: מִן הַכַּפֹּרֶת ... מִשְּׁנֵי קצוותיו
  choice: प्रायश्चित-आवरण से ही, उसके दोनों सिरों पर
  rationale: ‘से ही’ यह स्पष्ट करता है कि करूब उसी आवरण में से बनाए गए थे, जबकि ‘दोनों सिरों पर’ उनकी स्थिति बताता है।
theological_decisions:
- issue: הַכַּפֹּרֶת का उपासना-संबंधी अर्थ
  choice: प्रायश्चित-आवरण
  alternative: ढकना; दया-आसन
  rationale: ‘प्रायश्चित-आवरण’ सन्दूक के वास्तविक ढकने और उसके धार्मिक कार्य, दोनों को व्यक्त करता है। ‘दया-आसन’ पारंपरिक है, पर आधुनिक हिन्दी पाठक उसे वास्तविक आसन समझ सकता है; ‘ढकना’ अकेले धार्मिक संबंध को दबा देता है। विकल्प पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘इस सिरे ... उस सिरे’ सामान्य पाठक के लिए स्पष्ट है, और ‘प्रायश्चित-आवरण’ पारिभाषिक अर्थ को बिना सम्प्रदायगत व्याख्या जोड़े सुरक्षित रखता है।
