  text: וַ/יַּ֜עַשׂ אֶֽת הַ/כֵּלִ֣ים אֲשֶׁ֣ר עַל הַ/שֻּׁלְחָ֗ן אֶת קְעָרֹתָ֤י/ו וְ/אֶת כַּפֹּתָי/ו֙ וְ/אֵת֙ מְנַקִּיֹּתָ֔י/ו וְ/אֶת הַ/קְּשָׂוֺ֔ת אֲשֶׁ֥ר יֻסַּ֖ךְ בָּ/הֵ֑ן זָהָ֖ב טָהֽוֹר־׀־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/016.yaml
  text: 'He made the utensils that were on the table: its plates[a], its cups, its pitchers, and its bowls with which the drink offering was poured out, of pure gold.'
translation:
  language: hi
  text: उसने मेज़ पर रखे पात्र भी बनाए—उसकी थालियाँ[a], कटोरियाँ, सुराहियाँ और वे प्याले जिनसे पेय-भेंट उंडेली जाती थी। ये सब शुद्ध सोने के थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इन चारों पात्रों के लिए आए हिब्रू शब्दों का ठीक-ठीक अर्थ निश्चित नहीं है; इनके अनुवाद ‘थालियाँ, कटोरियाँ, सुराहियाँ और प्याले’ के स्थान पर ‘तश्तरियाँ, छोटे कटोरे, घड़े और कटोरे’ भी हो सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֵּלִים
  choice: पात्र
  rationale: यह व्यापक शब्द मेज़ से संबंधित बर्तनों और उपकरणों को समेटता है; ‘पात्र’ संक्षिप्त, स्वाभाविक और प्रसंगानुकूल है।
- source_word: אֲשֶׁר עַל הַשֻּׁלְחָן
  choice: मेज़ पर रखे
  rationale: हिब्रू का शाब्दिक भाव ‘जो मेज़ पर [थे]’ है। हिंदी में ‘रखे’ स्थान-संबंध को स्वाभाविक ढंग से व्यक्त करता है, बिना उनके कार्य को अधिक निश्चित किए।
- source_word: קְעָרֹתָיו
  choice: उसकी थालियाँ
  rationale: קְעָרָה चौड़े बर्तन, थाली या तश्तरी को सूचित कर सकता है; मेज़ के प्रसंग में ‘थालियाँ’ सहज है।
- source_word: כַּפֹּתָיו
  choice: कटोरियाँ
  rationale: यहाँ शब्द छोटे पात्र के अर्थ में प्रयुक्त है; ‘कटोरियाँ’ सामान्य पाठक के लिए स्पष्ट है, जबकि ठीक आकार अनिश्चित है।
- source_word: מְנַקִּיֹּתָיו
  choice: सुराहियाँ
  rationale: यह दुर्लभ पात्र-शब्द संभवतः उंडेलने वाले बर्तन को सूचित करता है; ‘सुराहियाँ’ उस सामान्य कार्य को व्यक्त करता है, पर शब्दगत अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: הַקְּשָׂוֹת
  choice: प्याले
  rationale: यह मेज़ से जुड़े एक अन्य प्रकार के पात्र का नाम है और अगले वाक्यांश में उंडेलने से संबंधित है; ‘प्याले’ पठनीय अनुमान है।
- source_word: אֲשֶׁר יֻסַּךְ בָּהֵן
  choice: जिनसे पेय-भेंट उंडेली जाती थी
  rationale: हिफ़अल/होफ़अल निष्क्रिय रूप को निष्क्रिय हिंदी में रखा गया है। ‘पेय-भेंट’ נסך के अनुष्ठानिक उंडेलने के निहित अर्थ को स्पष्ट करता है।
- source_word: זָהָב טָהוֹר
  choice: ये सब शुद्ध सोने के थे
  rationale: अंतिम पदार्थ-सूचक पद पूरी सूची पर लागू होता है; स्वतंत्र हिंदी वाक्य इसे स्पष्ट और स्वाभाविक बनाता है।
