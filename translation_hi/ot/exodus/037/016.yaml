  register: आधुनिक मानक हिंदी का सरल किंतु गरिमापूर्ण रूप अपनाया गया है। अनुष्ठानिक शब्द נסך के लिए अपेक्षाकृत स्पष्ट ‘पेय-भेंट’ चुना गया है। दुर्लभ पात्र-नामों की वास्तविक अनिश्चितता को मुख्य पाठ में पठनीय शब्दों और पादटिप्पणी में विकल्पों द्वारा सुरक्षित रखा गया है।
