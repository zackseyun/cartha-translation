translation:
  language: hi
  text: उसने बबूल की लकड़ी के डंडे बनाए और उन पर सोना मढ़ा, ताकि मेज़ को उठाकर ले जाने के लिए उनका उपयोग हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: उसने बनाए
  rationale: वाव-परिणामी कथा में अगली क्रिया बताता है; हिन्दी में अलग संयोजक के बिना वाक्य स्वाभाविक और क्रमबद्ध रहता है।
- source_word: הַבַּדִּים
  choice: डंडे
  rationale: यह पवित्र साज-सामान को उठाकर ले जाने के लिए बनाए गए लंबे डंडों को सूचित करता है; ‘डंडे’ आधुनिक और सहज हिन्दी है।
- source_word: עֲצֵי שִׁטִּים
  choice: बबूल की लकड़ी
  rationale: सम्बन्धवाची पदबंध का स्वाभाविक हिन्दी रूप; यह निर्माण-सामग्री को स्पष्ट रखता है।
- source_word: וַיְצַף אֹתָם זָהָב
  choice: उन पर सोना मढ़ा
  rationale: कारीगरी के इस प्रसंग में צפה धातु की परत चढ़ाने का अर्थ देती है; ‘सोना मढ़ा’ हिन्दी में सटीक और प्रचलित है।
- source_word: לָשֵׂאת
  choice: ताकि ... उठाकर ले जाया जा सके
  rationale: क्रियार्थक रूप उद्देश्य व्यक्त करता है; यह हिन्दी में डंडों के प्रयोजन को स्पष्ट और स्वाभाविक ढंग से बताता है।
- source_word: הַשֻּׁלְחָן
  choice: मेज़
  rationale: इब्रानी पाठ केवल निश्चित ‘मेज़’ कहता है; अनुवाद प्रसंग से अतिरिक्त विवरण नहीं जोड़ता।
