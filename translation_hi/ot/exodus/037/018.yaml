    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उसकी एक ओर से ... उसकी दूसरी ओर से”; इसे “एक ओर से ... दूसरी ओर से” भी कहा जा सकता है।
    reason: lexical_alternative
