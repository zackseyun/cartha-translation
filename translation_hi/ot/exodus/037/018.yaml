translation:
  language: hi
  text: 'और उसकी दोनों ओर से छह शाखाएँ निकलती थीं[a]: दीपाधार की तीन शाखाएँ उसकी एक ओर से[b], और दीपाधार की तीन शाखाएँ उसकी दूसरी ओर से।'
  philosophy: optimal-equivalence
  footnotes:
