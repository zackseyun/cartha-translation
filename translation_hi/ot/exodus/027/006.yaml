translation:
  language: hi
  text: तुम वेदी के लिए बबूल की लकड़ी के डंडे बनाओ और उन पर काँसा[a] मढ़ो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘ताँबा’।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: तुम ... बनाना
  rationale: निर्देशात्मक प्रसंग में संयोजक सहित काल-रूप आज्ञा व्यक्त करता है। आधुनिक हिन्दी में ‘तुम ... बनाना’ स्पष्ट और स्वाभाविक निर्देश है।
- source_word: בַדִּים / בַּדֵּי
  choice: डंडे
  rationale: ये वेदी को उठाकर ले जाने के लिए प्रयुक्त लंबे डंडे हैं। ‘डंडे’ सामान्य पाठक के लिए सहज है और संरचनात्मक ‘छड़ों’ की अपेक्षा परिवहन-साधन का अर्थ अधिक स्वाभाविक रूप से देता है।
- source_word: לַמִּזְבֵּחַ
  choice: वेदी के लिए
  rationale: मूल में केवल ‘वेदी के लिए’ है; प्रसंग से ज्ञात विशिष्ट वेदी का अतिरिक्त नाम पाठ में नहीं जोड़ा गया।
- source_word: עֲצֵי שִׁטִּים
  choice: बबूल की लकड़ी
  rationale: शिट्टीम/अकेशिया कुल की लकड़ी के लिए आधुनिक हिन्दी में ‘बबूल की लकड़ी’ सुबोध और प्रचलित रूप है।
- source_word: וְצִפִּיתָ
  choice: मढ़ना
  rationale: तंबू-संबंधी कारीगरी में यह धातु की परत चढ़ाने का अर्थ देता है; ‘मढ़ना’ हिन्दी में इस क्रिया को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֹתָם
  choice: उन पर
  rationale: सर्वनाम का संदर्भ डंडों से है। हिन्दी में ‘उन पर ... मढ़ना’ धातु चढ़ाने की क्रिया के साथ स्वाभाविक है।
- source_word: נְחֹשֶׁת
  choice: काँसा
  rationale: पवित्र-स्थान की वस्तुओं के प्रसंग में परंपरागत और संभावित मिश्रधातु-अर्थ को ‘काँसा’ व्यक्त करता है; शुद्ध धातु ‘ताँबा’ भी शब्दार्थ की वास्तविक संभावना है, इसलिए उसे पादटिप्पणी में रखा गया है।
