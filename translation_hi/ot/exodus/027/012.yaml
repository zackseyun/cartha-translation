translation:
  language: hi
  text: और आँगन की पश्चिमी ओर की चौड़ाई के लिए पचास हाथ लंबे परदे हों; उनके खंभे दस और उनके आधार दस हों।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/רֹחַב הֶֽ/חָצֵר֙
  choice: और आँगन की चौड़ाई में
  rationale: רֹחַב का अर्थ ‘चौड़ाई’ और חָצֵר का अर्थ तंबू के चारों ओर का घिरा हुआ आँगन है। ‘चौड़ाई में’ इस स्थापत्य निर्देश को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לִ/פְאַת יָ֔ם
  choice: पश्चिम की ओर
  rationale: יָם का शाब्दिक अर्थ ‘समुद्र’ है, पर दिशासूचक प्रयोग में यह पश्चिम को दर्शाता है; פֵאָה यहाँ दिशा अथवा पार्श्व बताता है।
- source_word: קְלָעִ֖ים
  choice: परदे
  rationale: यह शब्द आँगन की घेराबंदी बनाने वाले लटकाए गए वस्त्रों को सूचित करता है। ‘परदे’ सामान्य आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: חֲמִשִּׁ֣ים אַמָּ֑ה
  choice: पचास हाथ लंबे
  rationale: मूल में ‘पचास अम्मा’ है। हिन्दी बाइबलीय माप-परंपरा में אַמָּה के लिए ‘हाथ’ सुबोध है; ‘लंबे’ जोड़ने से स्पष्ट होता है कि माप परदों के विस्तार का है।
- source_word: עַמֻּדֵי/הֶ֣ם עֲשָׂרָ֔ה
  choice: उनके खंभे दस
  rationale: עַמּוּד के लिए ‘खंभा’ स्वाभाविक है। बहुवचन प्रत्यय ‘उनके’ को बनाए रखा गया है और मूल की गणनात्मक संरचना भी सुरक्षित है।
- source_word: וְ/אַדְנֵי/הֶ֖ם עֲשָׂרָֽה
  choice: और उनकी चौकियाँ दस
  rationale: אֶדֶן तंबू के ढाँचे में खंभे को थामने वाली आधार-चौकी या पादपीठ है। ‘चौकियाँ’ स्थापत्य वस्तु को ‘आधार’ की अपेक्षा अधिक ठोस रूप में व्यक्त करता है; प्रत्यय ‘उनकी’ भी सुरक्षित है।
