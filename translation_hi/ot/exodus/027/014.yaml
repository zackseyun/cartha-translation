lexical_decisions:
- source_word: חֲמֵשׁ עֶשְׂרֵה
  choice: पंद्रह
  rationale: यह संयुक्त संख्या सीधे ‘पंद्रह’ का अर्थ देती है; माप की इकाई अगले शब्द से मिलती है।
- source_word: אַמָּה
  choice: हाथ
  rationale: यह मानक प्राचीन लंबाई-माप ‘क्यूबिट’ है। हिंदी बाइबल-परंपरा और सामान्य बोध में ‘हाथ’ स्वाभाविक है।
- source_word: קְלָעִים
  choice: पर्दे
  rationale: मिलापवाले तम्बू के आँगन के संदर्भ में यह घेरे को बनाने वाले कपड़े के लटकते पर्दों को दर्शाता है।
- source_word: לַכָּתֵף
  choice: एक ओर के लिए
  rationale: शब्द का मूल अर्थ ‘कंधा’ है, पर स्थापत्य-संदर्भ में यह प्रवेश-द्वार के एक पार्श्व अथवा ओर को दर्शाता है; अगली आयत में दूसरी ओर का समान वर्णन है।
- source_word: עַמֻּדֵיהֶם
  choice: उनके तीन खम्भे
  rationale: עַמּוּד खम्भे अथवा स्तम्भ को दर्शाता है। प्रत्यय को ‘उनके’ से बनाए रखा गया है।
- source_word: אַדְנֵיהֶם
  choice: तीन आधार
  rationale: אֶדֶן खम्भों को थामने वाले आधार या खानेदार चौकी को दर्शाता है। मुख्य पाठ में ‘आधार’ स्पष्ट और स्वाभाविक है; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
