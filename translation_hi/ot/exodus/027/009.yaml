  yaml_path: translation/ot/exodus/027/009.yaml
  text: And you shall make the court of the tabernacle. For the south side[a], southward, there shall be hangings for the court of finely twisted linen, a hundred cubits long for one side.
translation:
  language: hi
  text: “तुम निवास-स्थान का आँगन बनाना। दक्षिणी पार्श्व के लिए, दक्षिण की ओर, आँगन के लिए महीन बटे हुए सन से बने परदे[a] हों; एक पार्श्व के लिए उनकी लंबाई सौ हाथ हो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात कपड़े के वे पट जो आँगन की सीमा बनाते थे।
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲצַר
  choice: आँगन
  rationale: यह निवास-स्थान से जुड़ा खुला, घिरा हुआ परिसर है; आधुनिक हिंदी में ‘आँगन’ स्वाभाविक और स्पष्ट है।
- source_word: הַמִּשְׁכָּן
  choice: निवास-स्थान
  rationale: मूल शब्द का अर्थ ‘निवास’ है और निर्गमन में यह पवित्र तंबू-धाम को सूचित करता है; ‘निवास-स्थान’ अर्थ और पवित्र संदर्भ दोनों बनाए रखता है।
- source_word: לִפְאַת נֶגֶב תֵּימָנָה
  choice: दक्षिण की ओर, दक्षिणी भाग में
  rationale: इब्रानी में दक्षिण दिशा का दोहरा उल्लेख है; हिंदी में कुछ पुनरुक्ति रखते हुए इस बल को सुरक्षित किया गया है।
- source_word: קְלָעִים
  choice: परदे
  rationale: ये कपड़े के पट हैं जो आँगन की सीमा बनाते हैं; ‘परदे’ साधारण पाठक के लिए स्वाभाविक है, जबकि पादटिप्पणी वास्तु-संबंधी अर्थ स्पष्ट करती है।
- source_word: שֵׁשׁ מָשְׁזָר
  choice: बटी हुई महीन मलमल
  rationale: यह अभिव्यक्ति महीन सन-वस्त्र और उसके बटे हुए धागे को दर्शाती है; यह हिंदी बाइबलीय-सांस्कृतिक संदर्भ में सुबोध है।
- source_word: מֵאָה בָאַמָּה
  choice: सौ हाथ
  rationale: प्राचीन माप ‘अम्मा’ के लिए प्रचलित हिंदी बाइबलीय पद ‘हाथ’ रखा गया है; आधुनिक इकाई में परिवर्तन नहीं किया गया।
- source_word: אֹרֶךְ
  choice: लंबाई
  rationale: माप-वाक्य में संज्ञात्मक रूप हिंदी में स्पष्ट और स्वाभाविक है।
- source_word: לַפֵּאָה הָאֶחָת
  choice: उस एक ओर
  rationale: आँगन की एक विशिष्ट दिशा/भुजा का एकवचन संदर्भ सुरक्षित रहता है।
