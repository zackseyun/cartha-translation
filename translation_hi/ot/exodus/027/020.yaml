base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/020.yaml
  text: And you shall command the sons of Israel that they bring to you pure beaten olive oil for the light[c][b][a], to cause a lamp to burn continually.
translation:
  language: hi
  text: “और तुम इस्राएलियों[a] को आज्ञा देना कि वे प्रकाश के लिए कुटा हुआ[b] जैतून का शुद्ध तेल तुम्हारे पास लाएँ, ताकि दीपक निरन्तर[c] जलता रहे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस्राएल के लोग” या “इस्राएल की प्रजा।” इब्रानी में शाब्दिक रूप से, “इस्राएल के पुत्र।”
    reason: lexical_alternative
  - marker: b
    text: “कुटा हुआ” का अनुवाद “कुचला हुआ” भी हो सकता है। आशय ऐसे उत्तम तेल से है जो जैतून को साधारण रीति से दबाने के बजाय कूटकर निकाला जाता था।
    reason: lexical_alternative
  - marker: c
    text: तम्बू की उपासना के प्रसंग में “निरन्तर” का अर्थ नियमित रूप से लगातार देखभाल करना भी हो सकता है; इसका यह अर्थ आवश्यक नहीं कि दीपक एक क्षण के लिए भी कभी न बुझे। निर्गमन 27:21 और लैव्यव्यवस्था 24:2–4 देखें।
    reason: cross_reference
lexical_decisions:
- source_word: וְאַתָּה
  choice: और तुम
  rationale: संयोजक और स्वतंत्र सर्वनाम मूसा को दिए गए सीधे, किंचित बलयुक्त संबोधन को बनाए रखते हैं।
- source_word: תְּצַוֶּה
  choice: आज्ञा देना
  rationale: पिएल रूप का अर्थ ‘आज्ञा देना/आदेश देना’ है; हिन्दी निर्देशात्मक शैली में यह स्वाभाविक और स्पष्ट है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: शाब्दिक अर्थ ‘इस्राएल के पुत्र’ है, पर यह रूढ़ वाचा-संबंधी सामुदायिक पद है; आधुनिक हिन्दी में ‘इस्राएलियों’ पूरे समुदाय को स्वाभाविक रूप से व्यक्त करता है, जबकि शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: וְיִקְחוּ אֵלֶיךָ
  choice: वे ... तुम्हारे पास लाएँ
  rationale: לקח का मूल अर्थ ‘लेना’ है, किन्तु אֶלֶיךָ और आपूर्ति के प्रसंग में अभिप्राय वस्तु प्राप्त करके मूसा के पास लाना है।
- source_word: שֶׁמֶן זַיִת זָךְ
  choice: जैतून का शुद्ध तेल
  rationale: यह तेल के स्रोत और उसकी शुद्धता/स्वच्छता दोनों को सीधे और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כָּתִית
  choice: कूटी हुई
  rationale: यह जैतून को साधारण दबाव से निकालने के बजाय कूटकर प्राप्त उच्च-गुणवत्ता वाले तेल की ओर संकेत करता है; हिन्दी में तेल के साथ स्त्रीलिंगानुसार रूप रखा गया है।
- source_word: לַמָּאוֹר
  choice: दीपक जलाने के लिए
  rationale: शाब्दिक ‘प्रकाश के लिए’ हिन्दी में अस्पष्ट हो सकता है; प्रसंगानुसार यह दीप-प्रकाश हेतु तेल को सूचित करता है, बिना किसी विशिष्ट उपकरण को अनावश्यक रूप से जोड़ने के।
- source_word: לְהַעֲלֹת נֵר
  choice: ताकि दीपक ... जलता रहे
  rationale: शाब्दिक causative मुहावरा ‘दीपक को ऊपर चढ़ाना’ वास्तव में दीपक जलाने और उसे जलाए रखने को व्यक्त करता है; हिन्दी रूप मुहावरे का अर्थ सहजता से देता है।
- source_word: תָּמִיד
  choice: निरन्तर
  rationale: याजकीय प्रसंग में यह नियमित, सतत रखरखाव भी दर्शा सकता है, न कि अनिवार्यतः हर क्षण बिना विराम; मुख्य पाठ में पारंपरिक व्यापक अर्थ रखा गया है और पादटिप्पणी में सीमा स्पष्ट की गई है।
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל का लिंगयुक्त वाचा-संबंधी पद
  choice: इस्राएलियों
  alternative: इस्राएल के पुत्रों
  rationale: मूल इब्रानी पद शाब्दिक रूप से पुल्लिंग पारिवारिक अभिव्यक्ति है, पर इस संदर्भ में वह स्थापित सामुदायिक नाम के रूप में इस्राएल की वाचा-प्रजा को दर्शाता है। मुख्य पाठ में स्वाभाविक आधुनिक हिन्दी रखी गई है और औपचारिक रूप पादटिप्पणी में बताया गया है, जिससे स्त्रियों के बहिष्कार का अनपेक्षित सिद्धान्त न बने।
- issue: תָּמִיד की कालगत सीमा
  choice: निरन्तर
  alternative: नियमित रूप से
  rationale: शब्द में निरंतरता और नियमित आवृत्ति दोनों की सम्भावना है। मुख्य पाठ व्यापक पारंपरिक अर्थ बनाए रखता है; पादटिप्पणी तम्बू-सेवा के प्रसंग में नियमित देखभाल की सम्भावना सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। ‘दीपक जलाने के लिए’ और ‘जलता रहे’ इब्रानी दीप-प्रज्वलन मुहावरे को स्वाभाविक हिन्दी में व्यक्त करते हैं। सभी पाठ-पादटिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
