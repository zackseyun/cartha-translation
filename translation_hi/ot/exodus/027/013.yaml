  text: וְ/רֹ֣חַב הֶֽ/חָצֵ֗ר לִ/פְאַ֛ת קֵ֥דְמָ/ה מִזְרָ֖חָ/ה חֲמִשִּׁ֥ים אַמָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/013.yaml
  text: And the width of the court on the east side[a], toward the sunrise, shall be fifty cubits.
translation:
  language: hi
  text: और आँगन की चौड़ाई पूर्व दिशा में[a], सूर्योदय की ओर, पचास हाथ होगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आँगन की चौड़ाई पूर्वी ओर, पूर्व की दिशा में, पचास हाथ होगी।”
    reason: इब्रानी में पूर्व दिशा के लिए क्रमिक रूप से आए קֵדְמָה और מִזְרָחָה को अधिक शाब्दिक ढंग से व्यक्त करने वाला वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: וְרֹחַב
  choice: और ... की चौड़ाई
  rationale: רֹחַב आयाम की चौड़ाई को दर्शाता है; ‘चौड़ाई’ आधुनिक हिन्दी में स्वाभाविक है। आरम्भिक וְ को निर्देशों की समन्वयात्मक शैली बनाए रखने के लिए ‘और’ से व्यक्त किया गया है।
- source_word: הֶחָצֵר
  choice: आँगन की
  rationale: חָצֵר यहाँ पवित्र निवास के चारों ओर घिरे हुए बाहरी क्षेत्र को सूचित करता है; ‘आँगन’ सामान्य आधुनिक हिन्दी में स्पष्ट और सहज है।
- source_word: לִפְאַת קֵדְמָה
  choice: पूर्व दिशा में
  rationale: פֵאָה का अर्थ किनारा या दिशा वाला भाग हो सकता है और קֵדְמָה पूर्व को दर्शाता है; संयुक्त पद का स्वाभाविक हिन्दी रूप ‘पूर्व दिशा में’ है।
- source_word: מִזְרָחָה
  choice: सूर्योदय की ओर
  rationale: מִזְרָחָה पूर्व अथवा सूर्योदय की दिशा बताता है। ‘सूर्योदय की ओर’ पहले आए ‘पूर्व’ को अनावश्यक रूप से दोहराए बिना इब्रानी की दोहरी दिशात्मक अभिव्यक्ति सुरक्षित रखता है।
- source_word: חֲמִשִּׁים אַמָּה
  choice: पचास हाथ
  rationale: संख्या का सीधा अनुवाद ‘पचास’ है। אַמָּה प्राचीन लंबाई की इकाई है, जिसके लिए हिन्दी बाइबलीय प्रयोग में ‘हाथ’ स्वाभाविक है; आधुनिक माप में परिवर्तन मुख्य पाठ में नहीं जोड़ा गया।
