lexical_decisions:
- source_word: עַמֻּדָיו
  choice: उसके बीस खम्भे
  rationale: עַמּוּד का अर्थ खम्भा/स्तम्भ है; 3ms प्रत्यय पिछले पद में वर्णित दक्षिणी ओर के परदों की ओर संकेत करता है। सरल आधुनिक हिन्दी में ‘उसके बीस खम्भे’ स्वाभाविक है।
- source_word: אַדְנֵיהֶם
  choice: उनके काँसे के बीस आधार
  rationale: मिलापवाले तम्बू के निर्माण-सन्दर्भ में אֶדֶן खम्भों को टिकाने वाले आधार या खाने को दर्शाता है। ‘आधार’ सामान्य पाठक के लिए स्पष्ट है; ‘खाने’ सम्भव तकनीकी विकल्प है।
- source_word: נְחֹשֶׁת
  choice: काँसा
  rationale: נְחֹשֶׁת ताँबा या काँसा दर्शा सकता है; पवित्र तम्बू की सामग्री के इस सन्दर्भ में पारम्परिक और सम्भावित अर्थ ‘काँसा’ है।
- source_word: וָוֵי
  choice: काँटे
  rationale: וָו तम्बू की संरचना में परदे या अन्य भाग लगाने के लिए प्रयुक्त हुकनुमा वस्तुओं को दर्शाता है। ‘काँटे’ निर्माण-सन्दर्भ में संक्षिप्त और बोधगम्य है।
- source_word: חֲשֻׁקֵיהֶם
  choice: बन्धन
  rationale: इस वास्तु-संज्ञा का ठीक स्वरूप अनिश्चित है। ‘बन्धन’ खम्भों से जुड़े चाँदी के बाँधने या जोड़ने वाले अंग का सामान्य अर्थ बनाए रखता है, बिना उसके रूप को आवश्यकता से अधिक निश्चित किए।
- source_word: כָּסֶף
  choice: चाँदी
  rationale: यह सामग्री के लिए प्रयुक्त सीधा शब्द है; यहाँ खम्भों के काँटों और बन्धनों, दोनों की सामग्री बताता है।
- source_word: וְ
  choice: और
  rationale: आरम्भिक संयोजक पिछले पद के वर्णन को आगे बढ़ाता है; हिन्दी में ‘और’ इस निरन्तरता तथा सूचीबद्ध संरचना को स्वाभाविक रूप से व्यक्त करता है।
