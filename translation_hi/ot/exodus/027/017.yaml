  rationale: यह उन धातु-निर्मित आधारों या खाँचेदार चौकियों को दर्शाता है जिनमें खम्भे टिकाए जाते थे; ‘आधार’ सर्वसुलभ है।
- source_word: נְחֹשֶׁת
  choice: काँसे
  rationale: प्राचीन धातु-संदर्भ में यह ताँबे अथवा ताँबा-मिश्रित धातु को दर्शा सकता है; तम्बू-निर्माण के प्रसंग में ‘काँसा’ स्थापित और उपयुक्त अनुवाद है।
