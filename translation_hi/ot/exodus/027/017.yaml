  text: All the pillars around the courtyard shall be banded with silver[c][b][a], with their hooks of silver and their bases of bronze.
translation:
  language: hi
  text: आँगन के चारों ओर के सभी खम्भे चाँदी की पट्टियों से घिरे होंगे[a]; उनके हुक चाँदी के और उनके आधार[b] काँसे[c] के होंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “चाँदी की छड़ों से जोड़े हुए होंगे।” इब्रानी शब्द खम्भों पर लगी चाँदी की पट्टियों या उन्हें जोड़ने वाली छड़ों को दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “सॉकेट।” इब्रानी शब्द उन धातु के आधारों को दर्शा सकता है जिनमें खम्भे टिकाए जाते थे।
    reason: lexical_alternative
  - marker: c
    text: “काँसा” का अनुवाद “ताँबा” भी किया जा सकता है, क्योंकि प्राचीन प्रयोग में इब्रानी शब्द ताँबे या ताँबा-मिश्रित धातु, दोनों को दर्शा सकता है।
    reason: lexical_alternative
