  yaml_path: translation/ot/exodus/027/018.yaml
  text: The length of the court shall be a hundred cubits[a], and the width fifty cubits, and the height five cubits, of finely twisted linen[b], with their bases of bronze.
translation:
  language: hi
  text: आँगन की लंबाई सौ हाथ, चौड़ाई पचास हाथ[a], और पर्दों की ऊँचाई पाँच हाथ हो। वे बारीक बटे हुए सन के हों, और उनके आधार काँसे के हों।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में चौड़ाई के लिए शाब्दिक अभिव्यक्ति “पचास में पचास” है; आशय संभवतः पचास हाथ है।
    reason: alternative_reading
lexical_decisions:
- source_word: אֹרֶךְ הֶחָצֵר
  choice: आँगन की लंबाई
  rationale: यह पवित्र निवास के घेरे वाले आँगन और उसके वास्तु-माप को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: מֵאָה בָאַמָּה
  choice: सौ हाथ
  rationale: बाइबलीय माप 'अम्मा' के लिए प्रचलित हिन्दी 'हाथ' रखा गया है; आधुनिक इकाई में बदलने से मूल माप की अनिश्चितता और पाठ-संगति घटती।
- source_word: חֲמִשִּׁים בַּחֲמִשִּׁים
  choice: पचास हाथ
  rationale: संदर्भ में चौड़ाई का माप पचास हाथ है। असामान्य शाब्दिक रूप 'पचास में पचास' को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וְקֹמָה חָמֵשׁ אַמּוֹת
  choice: और ऊँचाई पाँच हाथ
  rationale: यह आँगन के पर्दों की ऊर्ध्वाधर माप को स्पष्ट और संक्षिप्त ढंग से व्यक्त करता है।
- source_word: שֵׁשׁ מָשְׁזָר
  choice: बारीक बटे हुए सन
  rationale: שֵׁשׁ को तंबू-निर्माण के संदर्भ में बारीक सन और מָשְׁזָר को बटे हुए धागे के रूप में व्यक्त किया गया है।
- source_word: וְאַדְנֵיהֶם
  choice: और उनके आधार
  rationale: אַדֶן खंभों को थामने वाले धातु के आधार या खाने को दर्शाता है; 'आधार' सामान्य पाठक के लिए सहज है।
- source_word: נְחֹשֶׁת
  choice: काँसा
  rationale: पवित्र निवास की निर्माण-सूचियों में यह पारंपरिक और स्वाभाविक हिन्दी धातु-नाम है, यद्यपि मूल शब्द ताँबे अथवा ताँबा-मिश्रित धातु को भी सूचित कर सकता है।
