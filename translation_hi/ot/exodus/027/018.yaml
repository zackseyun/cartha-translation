  register: भाषा आधुनिक, गरिमापूर्ण और निर्माण-विवरण के अनुरूप रखी गई है। मूल पद में पर्दों का उल्लेख निहित है; हिन्दी में सामग्री और ऊँचाई का संबंध स्पष्ट करने के लिए 'उसके पर्दे' जोड़ा गया है।
