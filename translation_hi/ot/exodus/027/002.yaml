translation:
  language: hi
  text: और उसके चारों कोनों पर उसके सींग बनाओ। उसके सींग उसी के अभिन्न भाग हों[a], और उस पर काँसा मढ़ो[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसके सींग उसी में से हों”; अर्थात् वे अलग से जोड़ने के बजाय वेदी के साथ अभिन्न रूप से बने हों।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी शब्द का अर्थ “ताँबा” भी हो सकता है; इस निर्माण-संदर्भ में “काँसा” अधिक संभावित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: और तुम ... बनाना
  rationale: संयोजक वाव के साथ क़ाल पूर्ण रूप इस निर्देशात्मक क्रम में आज्ञार्थक भाव रखता है। ‘तुम ... बनाना’ आधुनिक हिन्दी में स्वाभाविक रहते हुए निर्देश की शक्ति और मूल के एकवचन संबोधन को बनाए रखता है।
- source_word: קַרְנֹתָיו
  choice: उसके सींग
  rationale: קֶרֶן का मूल अर्थ ‘सींग’ है और यहाँ वेदी के सींग-जैसे उभार अभिप्रेत हैं। ठोस उपासना-संबंधी बिंब को ज्यों का त्यों रखा गया है।
- source_word: עַל אַרְבַּע פִּנֹּתָיו
  choice: उसके चारों कोनों पर
  rationale: עַל का स्थानवाचक अर्थ ‘पर’ है। ‘चारों कोनों पर’ हिन्दी में स्वाभाविक है और वेदी पर सींगों की स्थिति स्पष्ट करता है।
- source_word: מִמֶּנּוּ תִּהְיֶיןָ קַרְנֹתָיו
  choice: उसके सींग उसी के साथ एक ही टुकड़े के हों
  rationale: शाब्दिक रचना ‘उसी में से उसके सींग हों’ है। निर्माण-संदर्भ में इसका आशय है कि सींग अलग से जोड़कर न बनाए जाएँ, बल्कि वेदी के साथ अभिन्न रूप से बने हों। चुना हुआ रूप इस अर्थ को सहज हिन्दी में व्यक्त करता है; शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: וְצִפִּיתָ אֹתוֹ
  choice: और तुम उस पर ... चढ़ाना
  rationale: पिएल रूप צפה किसी वस्तु पर धातु की परत चढ़ाने को दर्शाता है। हिन्दी निर्माण-भाषा में ‘पर ... चढ़ाना’ स्पष्ट और स्वाभाविक है।
- source_word: נְחֹשֶׁת
  choice: काँसा
  rationale: נְחֹשֶׁת ताँबे अथवा काँसे को सूचित कर सकता है। प्राचीन वेदी-निर्माण और धातुकर्म के इस संदर्भ में ‘काँसा’ सर्वाधिक संभावित और प्रचलित अर्थ है; ‘ताँबा’ को पादटिप्पणी में रखा गया है।
