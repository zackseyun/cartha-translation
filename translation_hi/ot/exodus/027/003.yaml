  text: You shall make its pots for removing its ashes[a], and its shovels, and its basins, and its forks, and its firepans[b]; you shall make all its utensils of bronze.
translation:
  language: hi
  text: तू उसके लिए राख हटाने की हाँडियाँ, उसके फावड़े, उसके कटोरे, उसके काँटे और उसके अंगारदान बनाना; उसके सभी उपकरण काँसे[b] के बनाना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: या ‘ताँबे’।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: बनाना
  rationale: निर्देशात्मक प्रसंग में इब्रानी पूर्णेतर क्रिया को आधुनिक हिन्दी की विधिपरक अनंत क्रिया से व्यक्त किया गया है; इससे आसपास के निर्माण-निर्देशों के अनुरूप स्वाभाविक और गरिमापूर्ण शैली बनती है।
- source_word: סִּירֹתָיו
  choice: उसकी हाँडियाँ
  rationale: संज्ञा पात्रों या हाँडियों को सूचित करती है। उनके प्रयोजन को अगला पद बताता है, इसलिए ‘राख’ को संज्ञा में नहीं जोड़ा गया।
- source_word: לְדַשְּׁנוֹ
  choice: उसकी राख हटाने के लिए
  rationale: पिएल रूप वेदी पर चढ़ाई गई भेंटों से बनी चिकनी या वसायुक्त राख हटाने को सूचित करता है। मुख्य पाठ में कार्य को स्पष्ट, सहज हिन्दी में रखा गया है और शाब्दिक सूक्ष्मता पादटिप्पणी में सुरक्षित है।
- source_word: יָעָיו
  choice: उसके फावड़े
  rationale: ये राख या अंगारों को उठाने-हटाने के औजार हैं; ‘फावड़े’ आधुनिक हिन्दी में स्पष्ट और प्रसंगानुकूल है।
- source_word: מִזְרְקֹתָיו
  choice: उसके कटोरे
  rationale: यह शब्द बलि के रक्त या अन्य द्रव के लिए प्रयुक्त पात्रों को बताता है। ‘कटोरे’ सामान्य पाठक के लिए सहज है और पात्र के सटीक अनुष्ठानिक उपयोग को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: מִזְלְגֹתָיו
  choice: उसके काँटे
  rationale: संज्ञा काँटे जैसे औजारों को सूचित करती है; ‘मांस के काँटे’ कहना प्रसंग से अधिक व्याख्या जोड़ता।
- source_word: מַחְתֹּתָיו
  choice: उसके अंगारदान
  rationale: यह आग या अंगारे उठाने-ले जाने के पात्र को सूचित करता है। ‘अंगारदान’ हिन्दी में संक्षिप्त और प्रसंगानुकूल है।
- source_word: לְכָל־כֵּלָיו
  choice: उसके सभी उपकरण
  rationale: כְּלִי व्यापक रूप से पात्र, औजार या सामान को सूचित करता है; यहाँ सूचीबद्ध वेदी-सामग्री के सामूहिक नाम के रूप में ‘उपकरण’ स्वाभाविक है।
- source_word: נְחֹשֶׁת
  choice: काँसा
  rationale: मिलापवाले तंबू की सामग्री के प्रसंग में यह पारंपरिक और संभावित धातु-मिश्र को व्यक्त करता है; ‘ताँबा’ भी भाषिक रूप से संभव है और पादटिप्पणी में दिया गया है।
