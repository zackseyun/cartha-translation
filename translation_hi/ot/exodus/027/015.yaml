id: EXO.27.15
reference: Exodus 27:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/לַ/כָּתֵף֙ הַ/שֵּׁנִ֔ית חְמֵ֥שׁ עֶשְׂרֵ֖ה קְלָעִ֑ים עַמֻּדֵי/הֶ֣ם שְׁלֹשָׁ֔ה וְ/אַדְנֵי/הֶ֖ם שְׁלֹשָֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/015.yaml
  text: And for the second side there shall be fifteen cubits of hangings[c][b][a], with three pillars and their three bases.
translation:
  language: hi
  text: और दूसरी ओर के लिए पंद्रह हाथ[a] लंबी कनातें हों; उनके तीन खंभे और तीन आधार[b] हों।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में केवल ‘पंद्रह’ है; ‘हाथ’ की माप पिछले पद की समानांतर रचना से समझी जाती है।
    reason: supplied_measurement
  - marker: b
    text: या ‘खाँचे’; इब्रानी शब्द उन नींव के टुकड़ों के लिए है जिनमें खंभे टिकाए जाते थे।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לַ/כָּתֵף הַ/שֵּׁנִית
  choice: और दूसरी ओर के लिए
  rationale: כָּתֵף का मूल अर्थ ‘कंधा’ है, पर आँगन की बनावट के इस संदर्भ में इसका स्थानिक अर्थ ‘ओर/बगल’ है। הַשֵּׁנִית को सीधे ‘दूसरी’ अनूदित किया गया है।
- source_word: חְמֵשׁ עֶשְׂרֵה
  choice: पंद्रह हाथ
  rationale: इब्रानी में केवल ‘पंद्रह’ है, लेकिन पिछले पद की समानांतर रचना से लंबाई की इकाई ‘हाथ’ स्पष्टतः अध्याहृत है; इसलिए अर्थ को स्वाभाविक और सही ढंग से व्यक्त करने के लिए इसे पाठ में जोड़ा गया है।
- source_word: קְלָעִים
  choice: कनातें
  rationale: यह शब्द आँगन को घेरने वाले बुने हुए कपड़े के पर्दों को दर्शाता है। ‘कनातें’ बाहरी घेरे के कपड़े के लिए आधुनिक हिन्दी में संक्षिप्त और उपयुक्त है।
- source_word: עַמֻּדֵי/הֶם
  choice: उनके तीन खंभे
  rationale: עַמּוּד यहाँ कनातों को थामने वाले संरचनात्मक खंभों को दर्शाता है; बहुवचन संबंधसूचक प्रत्यय को ‘उनके’ से व्यक्त किया गया है।
- source_word: וְ/אַדְנֵי/הֶם
  choice: और तीन आधार
  rationale: אֶדֶן उस नींव-सदृश आधार या खाने को दर्शाता है जिसमें खंभा टिकता था। ‘आधार’ सामान्य पाठक के लिए स्पष्ट है; ‘खाँचे’ अधिक तकनीकी विकल्प है।
