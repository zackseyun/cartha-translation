  register: आधुनिक मानक हिन्दी में सरल, निर्देशात्मक और गरिमापूर्ण शैली रखी गई है। एकवचन संबोधन के लिए ‘तुम’ और आज्ञार्थक ‘बनाना’ का प्रयोग किया गया है। तकनीकी वस्तु के लिए ‘जालीदार झंझरी’ मूल की दो निकटवर्ती संज्ञाओं को बिना अनावश्यक व्याख्या के सुरक्षित रखता है।
