  yaml_path: translation/ot/exodus/027/004.yaml
  text: You shall make for it a grating[a], a network of bronze[b], and on the network you shall make four bronze rings at its four corners.
translation:
  language: hi
  text: तुम उसके लिए काँसे की जालीदार झंझरी[a] बनाओ, और उस जाली पर उसके चारों कोनों[b] पर काँसे के चार छल्ले बनाओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “काँसे की जाली।” इब्रानी में शाब्दिक रूप से “झंझरी, जाल का काम, काँसे की” है।
    reason: lexical_alternative
  - marker: b
    text: या, “उसके चारों सिरों पर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכְבָּר מַעֲשֵׂה רֶשֶׁת
  choice: जालीदार झंझरी
  rationale: मִכְבָּר वेदी से जुड़ी जाली या झंझरी को दर्शाता है, और מַעֲשֵׂה רֶשֶׁת उसकी जाल-सदृश बनावट स्पष्ट करता है। ‘जालीदार झंझरी’ दोनों अभिव्यक्तियों का भेद यथासंभव बनाए रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: נְחֹשֶׁת
  choice: काँसा
  rationale: मिलापवाले तम्बू के सामान के संदर्भ में यह मानक और प्रसंगानुकूल हिन्दी रूप है; मूल शब्द ताँबे या ताँबे की मिश्रधातु को भी सूचित कर सकता है।
- source_word: עַל הָרֶשֶׁת
  choice: उस जाली पर
  rationale: עַל का सीधा स्थान-सूचक अर्थ ‘पर’ है, और ‘जाली’ रֶשֶׁת के साथ शब्दगत संबंध बनाए रखता है।
- source_word: טַבְּעֹת
  choice: छल्ले
  rationale: यह उन गोल धातु-छल्लों को दर्शाता है जो तम्बू और उसके सामान में जोड़ने या डंडे लगाने के काम आते थे।
- source_word: קְצוֹתָיו
  choice: उसके चारों कोनों
  rationale: शब्द का मूल अर्थ ‘छोर/सिरे’ है; चौकोर जाली के संदर्भ में ‘कोने’ अधिक स्पष्ट और स्वाभाविक है, जबकि वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: לוֹ
  choice: उसके लिए
  rationale: सर्वनाम का पूर्वपद वेदी है; हिन्दी में निर्जीव वस्तु के लिए ‘उसके लिए’ स्वाभाविक है।
- source_word: וְעָשִׂיתָ
  choice: तुम ... बनाना
  rationale: यह एकवचन संबोधन में जारी निर्देश है। आधुनिक हिन्दी में ‘तुम ... बनाना’ आज्ञार्थक बल को स्पष्ट और सहज रूप से व्यक्त करता है।
