base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/021.yaml
  text: In the tent of meeting[a], outside the veil that is before the testimony, Aaron and his sons shall arrange it before Yahweh from evening until morning[c][b]. It shall be a perpetual statute throughout their generations from the Israelites.
translation:
  language: hi
  text: मिलाप के तंबू में, उस परदे के बाहर जो साक्ष्य के आगे है,[a] हारून और उसके पुत्र उसे शाम से सुबह तक यहोवा के सामने व्यवस्थित करेंगे।[b] यह इस्राएलियों की ओर से उनकी पीढ़ियों तक सदा की विधि होगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “साक्ष्य।” यहाँ इसका आशय संभवतः वाचा की उन पटियाओं से है जो संदूक में रखी थीं; परदा उस संदूक के आगे था।
    reason: cultural_note
  - marker: b
    text: “व्यवस्थित करेंगे” का अनुवाद “ठीक क्रम में लगाएंगे” भी हो सकता है; प्रसंग में इसका संबंध दीप-सेवा से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֹהֶל מוֹעֵד
  choice: मिलापवाले तंबू में
  rationale: यह प्रचलित और सहज हिन्दी पदावली है, जो इस उपासना-संबंधी विशिष्ट तंबू के अर्थ को बनाए रखती है।
- source_word: מִחוּץ לַפָּרֹכֶת
  choice: परदे के बाहर
  rationale: פָּרֹכֶת पवित्रस्थान को अलग करनेवाले भीतरी परदे को दर्शाता है; ‘परदा’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: אֲשֶׁר עַל הָעֵדֻת
  choice: जो साक्ष्य-पत्रों के सामने है
  rationale: स्थान-संबंधी प्रसंग में עַל उस परदे की स्थिति बताता है जो साक्ष्य-पत्रों वाले संदूक के सामने था। ‘साक्ष्य-पत्रों’ से आशय वाचा की पटियाओं से है और इससे हिन्दी में एकवचन अमूर्त ‘साक्ष्य’ की अस्पष्टता घटती है।
- source_word: יַעֲרֹךְ אֹתוֹ
  choice: उसे ... व्यवस्थित रखेंगे
  rationale: ערך का मूल भाव व्यवस्थित करने या ठीक क्रम में रखने का है; यहाँ निरंतर रात्रिकालीन दीप-सेवा के प्रसंग में ‘व्यवस्थित रखेंगे’ स्वाभाविक है और केवल एक बार सजाने का अर्थ नहीं देता।
- source_word: מֵעֶרֶב עַד בֹּקֶר
  choice: शाम से सुबह तक
  rationale: यह समयावधि का सीधा, सहज आधुनिक हिन्दी रूप है।
- source_word: לִפְנֵי יְהוָה
  choice: यहोवा के सामने
  rationale: לִפְנֵי का उपासना-संबंधी स्थानवाचक भाव सुरक्षित रहता है और יהוה को उसके व्यक्तिवाचक वाचा-नाम ‘यहोवा’ से व्यक्त किया गया है।
- source_word: חֻקַּת עוֹלָם
  choice: सदा की विधि
  rationale: यह स्थायी और पीढ़ियों तक लागू रहनेवाले विधान का भाव देता है, बिना उससे संदर्भ से परे दार्शनिक अनंतता निष्कर्षित किए।
- source_word: לְדֹרֹתָם
  choice: उनकी पीढ़ी-दर-पीढ़ी के लिए
  rationale: यह पुनरावर्ती पीढ़ियों के अर्थ को आधुनिक, मुहावरेदार हिन्दी में व्यक्त करता है।
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों की ओर से
  rationale: מֵאֵת यहाँ इस विधान अथवा सेवा के समुदायगत स्रोत/दायित्व को दर्शा सकता है; ‘की ओर से’ अस्वाभाविक ‘इस्राएलियों से’ की अपेक्षा हिन्दी में अधिक स्पष्ट है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिवाचक नाम सीधे आया है। हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाने जानेवाले ‘यहोवा’ को रखा गया है, न कि उसे पदवी ‘प्रभु’ से बदला गया।
- issue: חֻקַּת עוֹלָם का कालगत बल
  choice: सदा की विधि
  alternative: स्थायी विधि
  rationale: यह कानूनी विधान के टिकाऊ, पीढ़ीगत चरित्र को सुरक्षित रखता है; साथ का לְדֹרֹתָם इसके वाचाई और पीढ़ीगत संदर्भ को स्पष्ट करता है।
- issue: הָעֵדֻת का आशय
  choice: साक्ष्य-पत्रों
  alternative: साक्ष्य
  rationale: इस तंबू-संबंधी संदर्भ में यह संदूक में रखी वाचा की पटियाओं की ओर संकेत करता है। मुख्य पाठ में इसे स्पष्ट किया गया है, जबकि पादटिप्पणी मूल पद के शाब्दिक रूप को बताती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘मिलापवाला तंबू,’ ‘परदा,’ ‘साक्ष्य-पत्र,’ और ‘विधि’ उपासना-संबंधी तकनीकी अर्थ को अत्यधिक संस्कृतनिष्ठ बनाए बिना व्यक्त करते हैं।
