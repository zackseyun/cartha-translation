translation:
  language: hi
  text: “तुम बबूल की लकड़ी की एक वेदी बनाओ। उसकी लंबाई पाँच हाथ और चौड़ाई पाँच हाथ हो; वेदी चौकोर हो, और उसकी ऊँचाई तीन हाथ हो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: तुम ... बनाना
  rationale: निर्देशों की इस शृंखला में संयोजक सहित क़ाल पूर्ण रूप आज्ञार्थक निर्देश देता है। हिंदी का यह प्रयोग स्पष्ट, स्वाभाविक और निर्देशात्मक है।
- source_word: הַמִּזְבֵּחַ
  choice: वेदी
  rationale: मִזְבֵּחַ के लिए बलिदान चढ़ाने की संरचना के अर्थ में प्रचलित और स्पष्ट हिंदी शब्द।
- source_word: עֲצֵי שִׁטִּים
  choice: बबूल की लकड़ी
  rationale: निर्माण-सामग्री बताने वाले संबंध-वाक्यांश का स्वाभाविक हिंदी रूप; שִׁטָּה अकासिया/बबूल कुल के वृक्ष को दर्शाता है।
- source_word: חָמֵשׁ אַמּוֹת אֹרֶךְ
  choice: लंबाई पाँच हाथ
  rationale: माप-सूचक वाक्यांश का सहज हिंदी रूप। אַמָּה को पारंपरिक, सामान्यतः समझ में आने वाले माप ‘हाथ’ से व्यक्त किया गया है।
- source_word: וְחָמֵשׁ אַמּוֹת רֹחַב
  choice: चौड़ाई पाँच हाथ
  rationale: पिछले माप के समानांतर स्वाभाविक हिंदी अभिव्यक्ति।
- source_word: רָבוּעַ יִהְיֶה
  choice: चौकोर हो
  rationale: רָבוּעַ समान लंबाई और चौड़ाई वाली चौकोर आकृति बताता है; ‘चौकोर’ आधुनिक हिंदी में स्पष्ट है।
- source_word: וְשָׁלֹשׁ אַמּוֹת קֹמָתוֹ
  choice: उसकी ऊँचाई तीन हाथ हो
  rationale: कֹמָה और उसके प्रत्यय का अर्थ तथा मूल वाक्य का माप-संबंध सहज हिंदी में सुरक्षित रहता है।
