  text: וּ/לְ/שַׁ֨עַר הֶֽ/חָצֵ֜ר מָסָ֣ךְ עֶשְׂרִ֣ים אַמָּ֗ה תְּכֵ֨לֶת וְ/אַרְגָּמָ֜ן וְ/תוֹלַ֧עַת שָׁנִ֛י וְ/שֵׁ֥שׁ מָשְׁזָ֖ר מַעֲשֵׂ֣ה רֹקֵ֑ם עַמֻּֽדֵי/הֶם֙ אַרְבָּעָ֔ה וְ/אַדְנֵי/הֶ֖ם אַרְבָּעָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/016.yaml
  text: And for the gate of the courtyard there shall be a screen twenty cubits long[a], of blue, purple, and scarlet yarn, and fine twined linen, the work of an embroiderer[c][b], with their four pillars and their four bases.
translation:
  language: hi
  text: और आँगन के प्रवेश-द्वार के लिए बीस हाथ लंबा[a] एक परदा हो, जो नीले, बैंगनी और किरमिज़ी रंग के सूत तथा बटे हुए महीन लिनन का हो, कढ़ाई करनेवाले की कारीगरी का; उसके चार खंभे और उनके चार आधार हों।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में केवल “बीस हाथ” है; स्थापत्य माप स्पष्ट करने के लिए “लंबा” जोड़ा गया है।
    reason: माप की शाब्दिक बनावट और अनुवाद में जोड़े गए स्पष्टकारी शब्द को दर्शाना।
lexical_decisions:
- source_word: וּלְשַׁעַר הֶחָצֵר
  choice: और आँगन के प्रवेश-द्वार के लिए
  rationale: שַׁעַר यहाँ आँगन में प्रवेश के स्थान को बताता है; ‘प्रवेश-द्वार’ आधुनिक हिन्दी में स्पष्ट है, जबकि חָצֵר के लिए ‘आँगन’ घिरे हुए बाहरी प्रांगण का स्वाभाविक अनुवाद है।
- source_word: מָסָךְ
  choice: एक परदा
  rationale: मिलापवाले तंबू के प्रसंग में यह प्रवेश को ढकनेवाला कपड़े का परदा है, ठोस द्वार नहीं।
- source_word: עֶשְׂרִים אַמָּה
  choice: बीस हाथ लंबा
  rationale: इब्रानी में शाब्दिक रूप से ‘बीस हाथ’ है; स्थापत्य माप स्पष्ट करने के लिए हिन्दी में ‘लंबा’ जोड़ा गया है।
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: नीले, बैंगनी और लाल रंग के सूत
  rationale: ये रंगे हुए वस्त्र-सामग्री के रंग हैं; ‘सूत’ सूची के वस्त्र-संदर्भ को स्पष्ट करता है।
- source_word: וְשֵׁשׁ מָשְׁזָר
  choice: बटी हुई महीन मलमल
  rationale: שֵׁשׁ महीन लिनन-वस्त्र और מָשְׁזָר बटे हुए धागों की बनावट को दर्शाता है; ‘महीन मलमल’ सामान्य हिन्दी में सुलभ वस्त्र-शब्द है।
- source_word: מַעֲשֵׂה רֹקֵם
  choice: कढ़ाई करनेवाले की कारीगरी से
  rationale: यह कुशल रंगीन कढ़ाई अथवा सजावटी वस्त्र-काम को और कारीगर की भूमिका को बनाए रखता है।
- source_word: עַמֻּדֵיהֶם אַרְבָּעָה וְאַדְנֵיהֶם אַרְבָּעָה
  choice: उसके चार खंभे और उनके चार आधार
  rationale: बहुवचन संबंधसूचक प्रत्ययों का भाव बनाए रखा गया है। אֶדֶן खंभे को थामनेवाले आधार या खाने के लिए आता है; ‘आधार’ आधुनिक हिन्दी में अधिक सहज है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज स्थापत्य भाषा रखी गई है। ‘प्रवेश-द्वार’, ‘परदा’, ‘खंभे’ और ‘आधार’ सामान्य पाठक के लिए स्पष्ट हैं; इब्रानी के संबंधसूचक प्रत्ययों का भाव भी सुरक्षित रखा गया है।
