  text: וְ/כֵ֨ן לִ/פְאַ֤ת צָפוֹן֙ בָּ/אֹ֔רֶךְ קְלָעִ֖ים מֵ֣אָה אֹ֑רֶךְ ו/עמד/ו עֶשְׂרִ֗ים וְ/אַדְנֵי/הֶ֤ם עֶשְׂרִים֙ נְחֹ֔שֶׁת וָוֵ֧י הָֽ/עַמֻּדִ֛ים וַ/חֲשֻׁקֵי/הֶ֖ם כָּֽסֶף׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/011.yaml
  text: 'And likewise for the north side in length: hangings a hundred cubits long[a], its twenty pillars and their twenty bronze bases[b], and the hooks of the pillars and their bands shall be silver.'
translation:
  language: hi
  text: और उत्तर की ओर भी, लंबाई में, सौ हाथ लंबे परदे[a] हों; उनके बीस खंभे और काँसे के उनके बीस आधार हों; खंभों के हुक और उनके पट्टे चाँदी के हों।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में केवल “सौ लंबे” है; निकटवर्ती संदर्भ के मापों के आधार पर “हाथ” जोड़ा गया है।
    reason: cultural_note
lexical_decisions:
- source_word: וְכֵן
  choice: और इसी प्रकार
  rationale: यह पिछले भाग में दिए गए दक्षिणी ओर के विन्यास के साथ समानता व्यक्त करता है।
- source_word: לִפְאַת צָפוֹן בָּאֹרֶךְ
  choice: उत्तर की ओर की लंबाई में
  rationale: पאה को यहाँ आँगन की दिशा/ओर और אֹרֶךְ को उसके लंबाई वाले विस्तार के रूप में व्यक्त किया गया है।
- source_word: קְלָעִים
  choice: परदे
  rationale: आँगन की घेराबंदी बनाने वाले लटकाए गए कपड़े के परदों के लिए स्वाभाविक और सर्वसुलभ हिन्दी शब्द।
- source_word: מֵאָה אֹרֶךְ
  choice: सौ हाथ लंबे
  rationale: इब्रानी में माप की इकाई लुप्त है, पर निकटवर्ती संदर्भ से 'हाथ' स्पष्ट है; इसे सहज बोध के लिए पाठ में जोड़ा गया है।
- source_word: וְעַמֻּדָיו עֶשְׂרִים
  choice: उनके बीस खंभे
  rationale: प्रत्यय को परदों/उस ओर के विन्यास से संबद्ध रखते हुए सूची की संक्षिप्त संरचना सुरक्षित रखी गई है।
- source_word: וְאַדְנֵיהֶם עֶשְׂרִים נְחֹשֶׁת
  choice: उनके लिए काँसे की बीस कुर्सियाँ
  rationale: מִשְׁכָּן-वर्णनों में אֶדֶן खंभे को थामने वाली आधार-कुर्सी या सॉकेट है; 'कुर्सियाँ' इस स्थापत्य अर्थ का प्रचलित हिन्दी बाइबलीय पद है।
- source_word: וָוֵי הָעַמֻּדִים
  choice: खंभों के अंकुड़े
  rationale: וָוִים खंभों से जुड़े हुक हैं; 'अंकुड़े' ठोस और संक्षिप्त हिन्दी रूप है।
- source_word: וַחֲשֻׁקֵיהֶם
  choice: उनके पट्टे
  rationale: यह खंभों से संबद्ध बाँधने, जोड़ने या चारों ओर लगे भागों को दर्शाता है; 'पट्टे' मूल की व्यापकता को बनाए रखता है।
- source_word: כָּסֶף
  choice: चाँदी
  rationale: सामग्री का सीधा और स्पष्ट अनुवाद।
