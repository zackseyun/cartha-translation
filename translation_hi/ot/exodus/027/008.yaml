- source_word: נְבוּב לֻחֹת
  choice: तख्तों से खोखला
  rationale: यह पदबंध वेदी को ठोस नहीं, बल्कि तख्तों से बनी खोखली संरचना के रूप में बताता है। यह हिंदी अभिव्यक्ति दोनों शब्दों के निर्माण-संबंधी अर्थ को स्वाभाविक ढंग से रखती है।
- source_word: תַּעֲשֶׂה אֹתוֹ
  choice: उसे ... बनाना
  rationale: दूसरे पुरुष एकवचन में मूसा को दिया गया निर्देश है। हिंदी में यह आज्ञार्थक infinitive शैली प्रसंगानुकूल और स्वाभाविक है।
- source_word: כַּאֲשֶׁר
  choice: जैसा
  rationale: यह पर्वत पर दिखाए गए नमूने और किए जाने वाले निर्माण के बीच तुलना स्थापित करता है।
- source_word: הֶרְאָה אֹתְךָ
  choice: तुम्हें ... दिखाया गया था
  rationale: हिब्रू होफ़अल का कर्मवाच्य रूप सुरक्षित रहता है और निहित कर्ता को स्पष्ट रूप से जोड़े बिना मूल की अस्पष्टता बनाए रखता है।
- source_word: בָּהָר
  choice: पर्वत पर
  rationale: स्थान के लिए आधुनिक मानक हिंदी में स्वाभाविक अभिव्यक्ति है।
- source_word: כֵּן יַעֲשׂוּ
  choice: वैसा ही वे उसे बनाएँ
  rationale: बहुवचन क्रिया को सुरक्षित रखते हुए उन कारीगरों की ओर संकेत करता है जो निर्माण करेंगे; 'वैसा ही' तुलना-परिणाम की संरचना स्पष्ट करता है।
