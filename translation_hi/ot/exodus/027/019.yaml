lexical_decisions:
- source_word: כְּלֵי
  choice: सभी सामान
  rationale: כְּלִי यहाँ निवास की सेवा में प्रयुक्त विविध वस्तुओं और उपकरणों का व्यापक संकेत देता है; ‘सामान’ आधुनिक हिन्दी में इस व्यापकता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַמִּשְׁכָּן
  choice: निवास
  rationale: מִשְׁכָּן का मूल अर्थ ‘निवास-स्थान’ है और यहाँ पवित्र निवास को दर्शाता है; ‘निवास’ स्रोत की अर्थछवि बनाए रखता है।
- source_word: בְּכֹל עֲבֹדָתוֹ
  choice: निवास की सेवा में काम आनेवाले
  rationale: वाक्यांश निवास से संबंधित समस्त सेवा या कार्य में इन वस्तुओं के उपयोग को बताता है; यह हिन्दी रूप उद्देश्य और कार्यात्मक संबंध दोनों को सहजता से व्यक्त करता है।
- source_word: יְתֵדֹתָיו
  choice: उसकी सभी खूँटियाँ
  rationale: יָתֵד तंबू या संरचना को स्थिर रखने वाली खूँटी है; ‘खूँटियाँ’ हिन्दी में स्पष्ट और प्रसंगानुकूल है।
- source_word: יִתְדֹת הֶחָצֵר
  choice: आँगन की सभी खूँटियाँ
  rationale: חָצֵר यहाँ निवास के चारों ओर घिरे खुले क्षेत्र को दर्शाता है; ‘आँगन’ साधारण आधुनिक हिन्दी में स्वाभाविक है।
- source_word: נְחֹשֶׁת
  choice: काँसा
  rationale: נְחֹשֶׁת ताँबे या ताँबा-आधारित धातु के लिए व्यापक रूप से प्रयुक्त हो सकता है; इस सामग्री-सूची में परंपरागत और संभावित अर्थ ‘काँसा’ मुख्य पाठ में उपयुक्त है।
