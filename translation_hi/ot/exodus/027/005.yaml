  text: और जाली को वेदी के कगार[a] के नीचे से लगाना; और जाली वेदी की आधी ऊँचाई तक रहेगी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “घेरा,” “किनारा,” अथवा “बाहर निकली हुई पट्टी”; इब्रानी כַּרְכֹּב वेदी पर बनी किसी उभरी हुई सीमा या चौखटे को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “और जाली वेदी के आधे तक होगी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: लगाना
  rationale: स्थान-सूचक वाक्य में נתן का अर्थ ‘रखना/लगाना’ है; जाली को वेदी की संरचना से जोड़ने के संदर्भ में ‘लगाना’ स्वाभाविक है और निर्देश का बल बनाए रखता है।
- source_word: אֹתָהּ
  choice: जाली को
  rationale: स्त्रीलिंग एकवचन सर्वनाम पिछले पद में उल्लिखित काँसे की जाली की ओर संकेत करता है; हिन्दी में स्पष्टता के लिए संज्ञा दोहराई गई है।
- source_word: תַּחַת
  choice: के तले
  rationale: यह कगार की अपेक्षा जाली की नीचे की स्थिति दर्शाता है; ‘के तले’ आधुनिक और स्पष्ट स्थान-सूचक अभिव्यक्ति है।
- source_word: כַּרְכֹּב
  choice: नीचे निकला हुआ कगार
  rationale: दुर्लभ वास्तु-संज्ञा वेदी से बाहर निकली सीमा, पट्टी या कगार को सूचित करती है। ‘कगार’ के साथ वर्णनात्मक पद इसके प्रक्षेपित होने का भाव स्पष्ट करता है, जबकि विकल्प पादटिप्पणी में रखा गया है।
- source_word: הַמִּזְבֵּחַ
  choice: वेदी
  rationale: मִזְבֵּחַ के लिए मानक, सुबोध हिन्दी धार्मिक-वास्तु शब्द।
- source_word: מִלְּמָטָּה
  choice: नीचे निकले हुए
  rationale: इस कठिन स्थानिक पदबंध को कगार के वेदी के निचले भाग में होने के रूप में व्यक्त किया गया है। मूल की संक्षिप्तता और संभावित संरचनात्मक अस्पष्टता के कारण वैकल्पिक समझ पादटिप्पणी में दी गई है।
- source_word: וְהָיְתָה
  choice: तब ... रहेगी
  rationale: היה यहाँ जाली की परिणामी स्थिति या विस्तार बताता है। ‘रहेगी’ बिना उद्देश्य-सूचक अर्थ जोड़े स्वाभाविक हिन्दी देता है।
- source_word: הָרֶשֶׁת
  choice: वह जाली
  rationale: רשת जालीनुमा धातु-संरचना है; ‘जाली’ हिन्दी में ‘जाल’ की तुलना में वास्तु-संदर्भ के लिए अधिक उपयुक्त है।
- source_word: עַד חֲצִי הַמִּזְבֵּחַ
  choice: वेदी की आधी ऊँचाई तक
  rationale: शाब्दिक रूप से ‘वेदी के आधे तक’; संदर्भ में ऊर्ध्वाधर मध्य-बिंदु अभिप्रेत है। ‘आधी ऊँचाई तक’ अर्थ स्पष्ट करता है, और अधिक शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
