base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/016.yaml
  text: 'Go and gather the elders of Israel[a], and say to them, ‘Yahweh, the God of your fathers—the God of Abraham, Isaac, and Jacob—has appeared to me[b], saying: “I have surely attended to you and to what has been done to you in Egypt.”’'
translation:
  language: hi
  text: जा और इस्राएल के बुज़ुर्गों को इकट्ठा कर; उनसे कह, ‘याहवेह, तुम्हारे पितरों[a] के परमेश्वर—अब्राहम, इसहाक और याकूब के परमेश्वर—मुझे प्रकट हुए हैं और उन्होंने कहा है, “मैंने निश्चय ही तुम्हारी सुधि ली है[b], और मिस्र में तुम्हारे साथ जो किया गया है उसकी भी।”’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में “तुम्हारे पितरों”; इसके बाद उन्हें अब्राहम, इसहाक और याकूब के रूप में स्पष्ट किया गया है।
    reason: lexical_clarification
  - marker: b
    text: “तुम्हारी सुधि ली है” के लिए हिब्रू में एक ही क्रिया की बलसूचक पुनरुक्ति है। इसका अर्थ “मैंने निश्चय ही तुम पर ध्यान दिया है” भी हो सकता है; यहाँ ऐसा निर्णायक ईश्वरीय ध्यान अभिप्रेत है जो हस्तक्षेप की ओर ले जाता है, केवल देख लेना नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵךְ וְאָסַפְתָּ
  choice: जा, ... इकट्ठा कर
  rationale: एकवचन पुरुष को दिए गए दोनों आदेशों को आधुनिक, स्वाभाविक हिंदी में प्रत्यक्ष आज्ञार्थक रूप में रखा गया है।
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुरनियों
  rationale: यह समुदाय के मान्य वरिष्ठ अगुओं का सामाजिक-राजनीतिक पदनाम है; ‘पुरनियों’ बाइबलीय संदर्भ में संक्षिप्त और परिचित है।
- source_word: יְהוָה
  choice: याहवेह
  rationale: चार-अक्षरीय व्यक्तिगत ईश्वरीय नाम को उपाधि से बदलने के बजाय हिंदी में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: तुम्हारे पितरों के परमेश्वर
  rationale: आगे अब्राहम, इसहाक और याकूब के उल्लेख से स्पष्ट पुरुष-वंशीय, कुलपितृ संदर्भ को बनाए रखता है।
- source_word: נִרְאָה אֵלַי
  choice: ने मुझे दर्शन दिया है
  rationale: निफ़अल रूप यहाँ ईश्वरीय प्रकट होने का प्रचलित मुहावरा है; हिंदी में ‘दर्शन दिया’ स्वाभाविक और अर्थसंगत है।
- source_word: פָּקֹד פָּקַדְתִּי
  choice: मैंने निश्चय ही ... ध्यान दिया है
  rationale: इनफिनिटिव ऐब्सल्यूट और सीमित क्रिया की पुनरुक्ति बल प्रकट करती है; ‘निश्चय ही’ उस बल को दर्शाता है, जबकि ‘ध्यान दिया’ निर्णायक ईश्वरीय संज्ञान को व्यक्त करता है।
- source_word: וְאֶת הֶעָשׂוּי לָכֶם בְּמִצְרָיִם
  choice: और मिस्र में तुम्हारे साथ जो किया जा रहा है उस पर
  rationale: हिब्रू कर्मवाच्य कृदंत का कर्ता अनिर्दिष्ट रखा गया है। वर्तमानगत अनुवाद जारी उत्पीड़न के संदर्भ में कृदंत की संभावित अपूर्ण/वर्तमान अर्थच्छाया को सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवेह
  alternative: प्रभु / यहोवा
  rationale: मूल में व्यक्तिगत वाचा-नाम है; इसलिए उसे किसी उपाधि से प्रतिस्थापित न करके लिप्यंतरित किया गया है।
- issue: פָּקֹד פָּקַדְתִּי में ईश्वरीय ध्यान और हस्तक्षेप का संबंध
  choice: मैंने निश्चय ही ... ध्यान दिया है
  alternative: मैं निश्चय ही तुम्हारी सुधि लेने आया हूँ / मैंने निश्चय ही तुमसे भेंट की है
  rationale: क्रिया केवल देख लेने से अधिक, उद्देश्यपूर्ण ध्यान और आसन्न हस्तक्षेप का संकेत दे सकती है। मुख्य पाठ इसे सहज हिंदी में रखता है और पादटिप्पणी व्यापक अर्थच्छाया बताती है।
- issue: אֲבֹתֵיכֶם की कुलपितृ अर्थच्छाया
  choice: तुम्हारे पितरों
  alternative: तुम्हारे पूर्वजों
  rationale: तुरंत बाद अब्राहम, इसहाक और याकूब नामित हैं, इसलिए सामान्य ‘पूर्वजों’ की अपेक्षा पुरुष कुलपिताओं का विशिष्ट संदर्भ सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। मूसा से एकवचन संबोधन के कारण ‘जा’, ‘कर’ और ‘कह’ प्रयुक्त हैं। उद्धरण-स्तरों को स्पष्ट रखने के लिए हिंदी विरामचिह्नों का उपयोग किया गया है।
