  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה אָסֻֽרָה נָּ֣א וְ/אֶרְאֶ֔ה אֶת הַ/מַּרְאֶ֥ה הַ/גָּדֹ֖ל הַ/זֶּ֑ה מַדּ֖וּעַ לֹא יִבְעַ֥ר הַ/סְּנֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/003.yaml
  text: Then Moses said[a], “Let me turn aside and see this great sight, why the bush is not burned up.”
translation:
  language: hi
  text: तब मूसा ने कहा, “मैं ज़रा मुड़कर यह अद्भुत दृश्य देखूँ कि यह झाड़ी जलकर भस्म क्यों नहीं हो जाती[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यह झाड़ी क्यों नहीं जलती,” अथवा “यह झाड़ी क्यों नहीं जलकर नष्ट होती।”
    reason: इब्रानी क्रिया का मूल अर्थ ‘जलना’ है; प्रसंग में आश्चर्य यह है कि आग में होने पर भी झाड़ी जलकर समाप्त नहीं होती।
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-परिणामी कथा को आगे बढ़ाता है; आधुनिक हिन्दी में ‘तब’ घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מֹשֶׁה
  choice: मूसा
  rationale: हिन्दी बाइबल परंपरा में प्रचलित नामरूप।
- source_word: אָסֻרָה נָּא
  choice: मैं उधर जाकर
  rationale: कोहोर्टेटिव और נָא मूसा के स्वयं किए गए निश्चय/इच्छा को व्यक्त करते हैं। ‘मैं उधर जाकर’ हिन्दी में स्वाभाविक है और दिशा बदलकर पास जाने का भाव रखता है।
- source_word: וְאֶרְאֶה
  choice: देखूँ
  rationale: रूप उद्देश्यपूर्ण देखने या जाँचने का भाव देता है; ‘देखूँ’ कोहोर्टेटिव प्रवाह को स्वाभाविक रूप से बनाए रखता है।
- source_word: הַמַּרְאֶה הַגָּדֹל הַזֶּה
  choice: यह अद्भुत दृश्य
  rationale: शाब्दिक ‘यह बड़ा दृश्य’ आधुनिक हिन्दी में अस्वाभाविक है; प्रसंग में גָּדֹל विस्मयकारी या असाधारण दृश्य का संकेत देता है।
- source_word: מַדּוּעַ
  choice: क्यों
  rationale: कारण पूछने वाले प्रश्नवाचक का सीधा और स्वाभाविक अनुवाद।
- source_word: לֹא יִבְעַר
  choice: जल क्यों नहीं जाती
  rationale: בער का मूल अर्थ ‘जलना’ है। हिन्दी में झाड़ी के संदर्भ में ‘जल नहीं जाती’ जलकर नष्ट न होने का प्रसंगगत आशय रखता है, पर ‘भस्म’ या ‘नष्ट’ को मुख्य पाठ में स्पष्ट रूप से जोड़ता नहीं।
- source_word: הַסְּנֶה
  choice: यह झाड़ी
  rationale: סְנֶה के लिए ‘झाड़ी’ स्पष्ट और पर्याप्त है; ‘काँटेदार झाड़ी’ मूल से अधिक विशिष्ट हो सकता है।
theological_decisions:
- issue: आग में झाड़ी की दशा
  choice: यह झाड़ी जल क्यों नहीं जाती
  alternative: यह झाड़ी क्यों नहीं जलती / यह झाड़ी जलकर नष्ट क्यों नहीं होती
  rationale: इब्रानी क्रिया सीधे ‘जलना’ कहती है, जबकि प्रसंग झाड़ी के नष्ट न होने को उजागर करता है। मुख्य पाठ ‘जल नहीं जाती’ द्वारा दोनों के बीच स्वाभाविक संतुलन रखता है और पादटिप्पणी वास्तविक अर्थ-विकल्पों को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण कथात्मक शैली। ‘अद्भुत दृश्य’ सामान्य पाठक के लिए स्वाभाविक है और मूसा के विस्मय को व्यक्त करता है।
