base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/015.yaml
  text: 'God also said to Moses[a], “Thus you shall say to the sons of Israel: Yahweh, the God of your fathers, the God of Abraham, the God of Isaac, and the God of Jacob, has sent me to you. This is my name forever[b], and this is my memorial from generation to generation.”'
translation:
  language: hi
  text: 'परमेश्वर ने मूसा से यह भी कहा, “इस्राएल के पुत्रों से तुम यह कहना: याहवे[a], तुम्हारे पितरों के परमेश्वर—अब्राहम के परमेश्वर, इसहाक के परमेश्वर और याकूब के परमेश्वर—ने मुझे तुम्हारे पास भेजा है। यही सदा के लिए मेरा नाम है, और यही पीढ़ी-दर-पीढ़ी मेरा स्मरण है[b]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: YHWH; इसे “यहोवा” भी लिखा जाता है।'
    reason: alternative_reading
  - marker: b
    text: 'या: “मेरा स्मारक”; अथवा, “वह नाम जिससे मुझे स्मरण किया जाता है।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय देवनागरी में प्रचलित विद्वत् उच्चारण के निकट लिप्यंतरित किया गया है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: मूल के स्पष्ट पुरुषवाचक संबंध-सूचक पद को बनाए रखते हुए हिंदी में स्वाभाविक बहुवचन रूप दिया गया है।
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: तुम्हारे पूर्वजों के परमेश्वर
  rationale: אבות संदर्भ में कुलपुरुषों सहित पूर्वजों को दर्शाता है; ‘पूर्वज’ आधुनिक हिंदी में अर्थ को स्पष्ट और स्वाभाविक रखता है, जबकि अगली पंक्ति अब्राहम, इसहाक और याकूब को निर्दिष्ट करती है।
- source_word: שְׁלָחַנִי
  choice: ने मुझे ... भेजा है
  rationale: पूर्ण हुई भेजने की क्रिया और वर्तमान में कायम प्रतिनिधिक नियुक्ति दोनों को हिंदी पूर्ण वर्तमान से व्यक्त किया गया है।
- source_word: זֶה שְּׁמִי לְעֹלָם
  choice: यही सदा के लिए मेरा नाम है
  rationale: לְעֹלָם की स्थायी कालावधि को सहज आधुनिक हिंदी में ‘सदा के लिए’ कहा गया है।
- source_word: זִכְרִי
  choice: इसी नाम से मुझे स्मरण किया जाएगा
  rationale: शाब्दिक ‘मेरा स्मरण/स्मारक’ हिंदी में अस्पष्ट हो सकता है; संदर्भगत अर्थ, अर्थात वह नाम जिसके द्वारा परमेश्वर स्मरण किया जाए, मुख्य पाठ में स्पष्ट किया गया है और शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: לְדֹר דֹּר
  choice: पीढ़ी-दर-पीढ़ी
  rationale: इब्रानी पुनरुक्त मुहावरे के निरंतर पीढ़ीगत अर्थ को संक्षिप्त और स्वाभाविक हिंदी मुहावरे से व्यक्त किया गया है।
- source_word: כֹּה תֹאמַר
  choice: तुम यह कहना
  rationale: दिव्य निर्देश के सूत्र को वर्तमान, गरिमापूर्ण और बोलचाल में समझ आने वाली हिंदी में रखा गया है।
- source_word: עוֹד
  choice: यह भी
  rationale: यह शब्द पिछले कथन में और बात जोड़ता है; ‘यह भी’ पुनरावृत्ति के बजाय भाषण की निरंतरता दिखाता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे उपस्थित है। ‘याहवे’ उसे उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं करता; ‘यहोवा’ वैकल्पिक पारंपरिक रूप के रूप में पादटिप्पणी में दिया गया है।
- issue: इस्राएल को संबोधन में पुरुषवाचक संबंध-सूचक भाषा
  choice: इस्राएल के पुत्रों
  alternative: इस्राएलियों; इस्राएल की सन्तान
  rationale: בְּנֵי का रूप स्पष्टतः ‘पुत्रों’ है, इसलिए मूल की लैंगिक अभिव्यक्ति को बनाए रखा गया है।
- issue: זִכְרִי में नाम और स्मरण का संबंध
  choice: इसी नाम से मुझे स्मरण किया जाएगा
  alternative: यह मेरा स्मरण है; यह मेरा स्मारक है
  rationale: पद के व्युत्पत्तिगत ‘स्मरण’ अर्थ और संदर्भ में ईश्वरीय नाम के स्मारकात्मक कार्य दोनों को व्यक्त किया गया है, किसी विशिष्ट धार्मिक व्याख्या को निर्णायक बनाए बिना वैकल्पिक अधिक शाब्दिक रूप पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी, गरिमापूर्ण और साधारण पाठक के लिए सुबोध रखी गई है। प्रत्यक्ष वचन की संरचना और मूल की पुनरुक्ति सुरक्षित है; लंबे पद को विरामचिह्नों से स्पष्ट किया गया है।
