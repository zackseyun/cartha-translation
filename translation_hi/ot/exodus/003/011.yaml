base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/011.yaml
  text: But Moses said to God[a], “Who am I that I should go to Pharaoh and that I should bring the sons of Israel out of Egypt?”
translation:
  language: hi
  text: पर मूसा ने परमेश्वर से कहा, “मैं कौन हूँ कि फ़िरौन के पास जाऊँ और इस्राएल के पुत्रों[a] को मिस्र से बाहर निकाल लाऊँ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस्राएलियों को”; परंपरागत रूप से “इस्राएल की संतानों को।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ने कहा
  rationale: हिब्रू कथात्मक शैली में אמר का यह रूप सामान्यतः सीधे कथन को प्रस्तुत करता है; आधुनिक हिन्दी में ‘ने कहा’ स्वाभाविक है।
- source_word: אֶל הָאֱלֹהִים
  choice: परमेश्वर से
  rationale: निश्चित पद के बावजूद यहाँ इस्राएल के परमेश्वर का प्रत्यक्ष उल्लेख है; हिन्दी बाइबलीय प्रयोग में ‘परमेश्वर’ स्पष्ट और गरिमापूर्ण है।
- source_word: מִי אָנֹכִי
  choice: मैं कौन हूँ
  rationale: यह मूसा की अयोग्यता-बोध से भरी आलंकारिक आपत्ति को बिना अतिरिक्त व्याख्या के सीधे रखता है।
- source_word: כִּי אֵלֵךְ
  choice: कि फ़िरौन के पास जाऊँ
  rationale: כִּי यहाँ ‘मैं कौन हूँ’ पर आश्रित संभावित कार्य का परिचय देता है; हिन्दी में संभावनार्थक ‘जाऊँ’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: פַּרְעֹה
  choice: फ़िरौन
  rationale: मिस्र के शासक की उपाधि का प्रचलित आधुनिक हिन्दी रूप।
- source_word: וְכִי אוֹצִיא
  choice: और ... बाहर निकाल लाऊँ
  rationale: दूसरा כִּי पहले के समानांतर दूसरी जिम्मेदारी जोड़ता है। हिफ़ील रूप का कारणवाचक अर्थ ‘बाहर निकालना’ है; ‘लाऊँ’ हिन्दी में लोगों को किसी स्थान से निकालकर ले आने की गति को सहज बनाता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: यह हिब्रू की वंश-सूचक, व्याकरणतः पुल्लिंग अभिव्यक्ति को मुख्य पाठ में बनाए रखता है। अधिक सामूहिक और स्वाभाविक विकल्प फुटनोट में दिया गया है।
- source_word: מִמִּצְרַיִם
  choice: मिस्र से बाहर
  rationale: מִן और कारणवाचक יצא मिलकर मिस्र के भीतर से बाहर लाने का अर्थ देते हैं; ‘से बाहर’ इसे स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל का अनुवाद
  choice: इस्राएल के पुत्रों
  alternative: इस्राएली; परंपरागत रूप से ‘इस्राएल की संतान’
  rationale: मुख्य पाठ मूल की वंश-सूचक और पुल्लिंग संरचना को सुरक्षित रखता है, जबकि फुटनोट सामूहिक और परंपरागत हिन्दी विकल्पों को बताता है; इससे अभिव्यक्ति की सीमा को किसी एक व्याख्या में नहीं बाँधा जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण कथात्मक शैली। ‘मैं कौन हूँ कि…’ मूल की आलंकारिक आपत्ति को संक्षिप्त रखता है। ‘इस्राएल के पुत्रों’ की औपचारिकता को मुख्य पाठ में बनाए रखते हुए सहज सामूहिक विकल्प फुटनोट में दिया गया है।
