id: EXO.3.1
reference: Exodus 3:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/מֹשֶׁ֗ה הָיָ֥ה רֹעֶ֛ה אֶת צֹ֛אן יִתְר֥וֹ חֹתְנ֖/וֹ כֹּהֵ֣ן מִדְיָ֑ן וַ/יִּנְהַ֤ג אֶת הַ/צֹּאן֙ אַחַ֣ר הַ/מִּדְבָּ֔ר וַ/יָּבֹ֛א אֶל הַ֥ר הָ/אֱלֹהִ֖ים חֹרֵֽבָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/001.yaml
  text: Moses was shepherding the flock of Jethro his father-in-law[a], the priest of Midian. He led the flock beyond the wilderness and came to the mountain of God, Horeb.
translation:
  language: hi
  text: मूसा अपने ससुर यित्रो—मिद्यान के याजक—की भेड़-बकरियाँ चरा रहा था। वह झुंड को निर्जन प्रदेश के पार[a] ले गया और परमेश्वर के पर्वत होरेब पर पहुँचा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “निर्जन प्रदेश की दूसरी ओर।”
    reason: אַחַר הַמִּדְבָּר के स्थानगत अर्थ का स्वाभाविक वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: וּ/מֹשֶׁה
  choice: मूसा
  rationale: आरंभिक ו नया कथात्मक दृश्य प्रस्तुत करता है; हिन्दी में बिना कृत्रिम ‘अब’ या ‘और’ जोड़े सीधे ‘मूसा’ से आरंभ करना स्वाभाविक है।
- source_word: הָיָה רֹעֶה
  choice: चरा रहा था
  rationale: यह रचना भूतकाल में चल रही क्रिया व्यक्त करती है; ‘चरा रहा था’ उसके पक्ष और चरवाही के अर्थ दोनों को सहज हिन्दी में रखता है।
- source_word: צֹאן
  choice: भेड़-बकरियाँ; झुंड
  rationale: यह शब्द सामूहिक रूप से छोटे पालतू पशुओं, प्रायः भेड़ों और बकरियों, को दर्शाता है। पहले उल्लेख में ‘भेड़-बकरियाँ’ अर्थ स्पष्ट करता है और बाद में ‘झुंड’ स्वाभाविक संदर्भ देता है।
- source_word: יִתְרוֹ חֹתְנוֹ
  choice: अपने ससुर यित्रो
  rationale: यित्रो नाम का मानक हिन्दी लिप्यंतरण है और חֹתְנוֹ को प्रसंगानुसार स्पष्ट रूप से ‘अपने ससुर’ कहा गया है।
- source_word: כֹּהֵן מִדְיָן
  choice: मिद्यान के याजक
  rationale: यह संबंधवाचक पद यित्रो की पहचान बताता है; ‘मिद्यान के याजक’ हिब्रू संरचना का सीधा और स्वाभाविक रूप है।
- source_word: וַיִּנְהַג
  choice: ले गया
  rationale: נהג झुंड को हाँकने या ले जाने का अर्थ दे सकता है। ‘ले गया’ अनावश्यक कठोरता जोड़े बिना गति और मार्गदर्शन दोनों व्यक्त करता है।
- source_word: אַחַר הַמִּדְבָּר
  choice: निर्जन प्रदेश के पार
  rationale: स्थानगत प्रयोग में אַחַר यहाँ निर्जन क्षेत्र के पार या दूसरी ओर जाने का संकेत देता है। ‘पार’ संक्षिप्त और स्वाभाविक है; वैकल्पिक रूप पादटिप्पणी में रखा गया है।
- source_word: הַר הָאֱלֹהִים
  choice: परमेश्वर का पर्वत
  rationale: यह हिब्रू संबंधवाचक पद का पारदर्शी अनुवाद है और पर्वत के इस नामकरण का समय या कारण निर्धारित नहीं करता।
- source_word: חֹרֵבָה
  choice: होरेब पर
  rationale: स्थानवाचक प्रत्यय उस स्थान की ओर गति दिखाता है। हिन्दी में पर्वत पर पहुँचने के लिए ‘होरेब पर पहुँचा’ स्वाभाविक है।
theological_decisions:
- issue: क्या הַר הָאֱלֹהִים को ऐसा अनूदित किया जाए कि पर्वत पहले से पवित्र था, या केवल बाद में ऐसा माना गया
  choice: परमेश्वर का पर्वत
  alternative: पवित्र पर्वत
  rationale: प्रत्यक्ष संबंधवाचक अनुवाद मूल की अस्पष्टता बनाए रखता है और यह तय नहीं करता कि यह नाम पूर्वप्रचलित, प्रत्याशित या बाद की दृष्टि से प्रयुक्त है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। ‘भेड़-बकरियाँ’ צֹאן का व्यापक अर्थ स्पष्ट करता है, जबकि पुनरुक्ति से बचने के लिए अगले वाक्य में ‘झुंड’ प्रयुक्त है। पादटिप्पणी चिह्न उसी पद के बाद रखा गया है जिससे उसका वास्तविक संबंध है।
