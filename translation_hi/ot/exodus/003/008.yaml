base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/008.yaml
  text: And I have come down to deliver him from the hand of Egypt and to bring him up from that land to a good and broad land[a], to a land flowing with milk and honey, to the place of the Canaanite, the Hittite, the Amorite, the Perizzite, the Hivite[c][b], and the Jebusite.
translation:
  language: hi
  text: और मैं उसको[b] मिस्र के हाथ[a] से छुड़ाने और उसको उस देश से एक अच्छे और विशाल[c] देश में ऊपर ले जाने के लिए नीचे उतरा हूँ—ऐसे देश में जो दूध और मधु से बहता हुआ है—अर्थात कनानी, हित्ती, अमोरी, परिज्जी, हिव्वी और यबूसी लोगों के स्थान में।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मिस्र के हाथ से’ एक हिब्रू मुहावरा है, जिसका अर्थ मिस्र की सत्ता या नियंत्रण से है।
    reason: lexical_alternative
  - marker: b
    text: मूल हिब्रू में ‘उसको’ दोनों क्रियाओं—‘छुड़ाने’ और ‘ऊपर ले जाने’—के साथ एकवचन है; इसका संकेत एक समुदाय के रूप में इस्राएल की ओर है।
    reason: lexical_alternative
  - marker: c
    text: या ‘एक अच्छे और विस्तृत देश में’।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵרֵד
  choice: मैं ... नीचे उतरा हूँ
  rationale: यह चयन परमेश्वर के स्थानगत, मानवरूपी वर्णन को बनाए रखता है और प्रसंग में उसके हस्तक्षेप की वर्तमान प्रासंगिकता व्यक्त करता है।
- source_word: לְהַצִּילוֹ
  choice: उसको छुड़ाने
  rationale: हिफ़ील रूप यहाँ संकट और दमनकारी नियंत्रण से मुक्त कराने का ठोस भाव देता है; ‘छुड़ाना’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: מִיַּד מִצְרַיִם
  choice: मिस्र के हाथ से
  rationale: मूल का ‘हाथ’ वाला बिंब सुरक्षित रखा गया है; यहाँ हाथ सत्ता या नियंत्रण का मुहावरा है।
- source_word: וּלְהַעֲלֹתוֹ
  choice: उसको ... निकालकर ... ले जाने
  rationale: हिब्रू क्रिया का मूल भाव ‘ऊपर ले जाना’ है। हिन्दी में गंतव्य के साथ ‘निकालकर ... ले जाना’ अधिक स्वाभाविक है, जबकि निर्गमन और स्थानांतरण दोनों भाव सुरक्षित रहते हैं।
- source_word: אֶל אֶרֶץ טוֹבָה וּרְחָבָה
  choice: एक अच्छे और विशाल देश में
  rationale: ‘अच्छा’ गुणवत्ता और ‘विशाल’ खुलेपन तथा पर्याप्त विस्तार को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: ऐसे देश में जहाँ दूध और मधु की धाराएँ बहती हैं
  rationale: यह हिन्दी में प्रचलित और बोधगम्य रूप से भूमि की प्रचुरता तथा हिब्रू के ‘बहने’ वाले सजीव बिंब को व्यक्त करता है।
- source_word: אֶל מְקוֹם
  choice: स्थान में
  rationale: מקום के सीधे अर्थ ‘स्थान’ को बनाए रखा गया है; ‘प्रदेश’ या ‘भूमि’ कहने से अधिक भौगोलिक व्याख्या जुड़ती।
- source_word: הַכְּנַעֲנִי ... הַיְבוּסִי
  choice: कनानी, हित्ती, एमोरी, परिज्जी, हिव्वी और यबूसी लोगों
  rationale: हिब्रू के एकवचन जातिनाम सामूहिक अर्थ रखते हैं। हिन्दी में ‘लोगों’ जोड़ने से वह सामूहिक अर्थ स्पष्ट और स्वाभाविक हो जाता है।
theological_decisions:
- issue: परमेश्वर का ‘नीचे उतरना’
  choice: स्थानगत भाषा को सीधे रूप में रखना
  alternative: ‘मैं हस्तक्षेप करने आया हूँ’ या ‘मैंने कार्य करने का निश्चय किया है’
  rationale: मूल पाठ परमेश्वर की कार्रवाई को मानवरूपी स्थानगत भाषा में प्रस्तुत करता है। इसे बनाए रखना कथा की सजीवता और धार्मिक तनाव का सम्मान करता है।
- issue: इस्राएल के लिए सामूहिक एकवचन सर्वनाम
  choice: दोनों क्रियाओं के संबंध में एकवचन ‘उसको’ का प्रयोग
  alternative: बहुवचन ‘उन्हें’ का प्रयोग
  rationale: मूल के दोनों प्रत्यय एकवचन हैं और इस्राएल को एक सामूहिक इकाई के रूप में देखते हैं। हिन्दी में ‘उसको’ उस दृष्टिकोण को सुरक्षित रखता है।
- issue: ‘ऊपर ले जाने’ की स्थानगत छवि
  choice: स्वाभाविक हिन्दी में ‘उस देश से निकालकर ... ले जाने’
  alternative: शाब्दिक ‘ऊपर ले जाने’
  rationale: हिब्रू में ऊर्ध्व दिशा स्पष्ट है, पर हिन्दी में इस संदर्भ में ‘ऊपर ले जाना’ अस्पष्ट या अप्राकृतिक लग सकता है। चयन निर्गमन और नए देश तक पहुँचाने का आशय रखता है; वैचारिक अर्थ नहीं बदला गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मिस्र के हाथ’ और परमेश्वर के ‘नीचे उतरने’ जैसे मूल बिंब सुरक्षित हैं। जातिनामों के साथ ‘लोगों’ जोड़ा गया है ताकि हिब्रू सामूहिक एकवचन हिन्दी में स्पष्ट हो।
