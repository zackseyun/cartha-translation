base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/012.yaml
  text: 'And he said[a], “Certainly I will be with you, and this will be the sign for you that I have sent you: when you bring the people out of Egypt, you will serve God on this mountain.”'
translation:
  language: hi
  text: 'उसने कहा, “निश्चय ही, मैं तेरे साथ रहूँगा। और तेरे लिए यह चिन्ह होगा कि मैंने ही तुझे भेजा है: जब तू लोगों को मिस्र से निकाल लाएगा, तब तुम लोग इस पर्वत पर परमेश्वर की सेवा करोगे[a]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘परमेश्वर की आराधना करोगे।’ इब्रानी क्रिया का अर्थ ‘सेवा करना’ और परमेश्वर के संबंध में ‘आराधना करना’—दोनों हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: 'यहाँ כִּי मूसा की आपत्ति के उत्तर का आधार प्रस्तुत करता है: वह जा सकता है क्योंकि परमेश्वर उसके साथ रहेगा। ‘निश्चय ही’ भी सम्भव है, पर कारणसूचक अर्थ मूल वाक्य-संबंध को अधिक सीधे बनाए रखता है।'
- source_word: אֶהְיֶה עִמָּךְ
  choice: मैं तेरे साथ रहूँगा
  rationale: अपूर्ण क्रिया यहाँ भावी प्रतिज्ञा व्यक्त करती है और עִם साथ रहने तथा सहायता देने वाली उपस्थिति को दर्शाता है।
- source_word: הָאוֹת
  choice: चिन्ह
  rationale: אוֹת किसी पुष्टि करने वाले संकेत या चिन्ह को दर्शाता है; ‘चिन्ह’ स्वाभाविक और व्यापक हिन्दी विकल्प है।
- source_word: כִּי אָנֹכִי שְׁלַחְתִּיךָ
  choice: कि मैंने ही तुझे भेजा है
  rationale: אָנֹכִי का बल ‘मैंने ही’ से व्यक्त होता है, और पूर्ण क्रिया उस भेजे जाने को वर्तमान बुलाहट से जुड़ी हुई पूरी कार्रवाई के रूप में रखती है।
- source_word: בְּהוֹצִיאֲךָ
  choice: जब तू ... निकाल लाएगा
  rationale: בְּ सहित infinitive construct और द्वितीय पुरुष एकवचन प्रत्यय को समयसूचक माना गया है; मूसा लोगों को बाहर ले आने वाला कर्ता है।
- source_word: תַּעַבְדוּן
  choice: तुम लोग ... सेवा करोगे
  rationale: क्रिया बहुवचन है और עבד में ‘सेवा करना’ तथा परमेश्वर के संदर्भ में ‘आराधना करना’ दोनों भाव हो सकते हैं। ‘सेवा’ इसकी अर्थ-व्याप्ति बनाए रखती है।
- source_word: עַל הָהָר הַזֶּה
  choice: इसी पर्वत पर
  rationale: עַל का स्थानसूचक अर्थ ‘पर’ से सुरक्षित रहता है; ‘इसी’ संकेतवाचक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: प्रतिज्ञात ‘चिन्ह’ का स्वरूप
  choice: वाक्य को इस प्रकार रखा गया है कि मिस्र से निकलने के बाद इसी पर्वत पर परमेश्वर की सेवा करना आगे मिलने वाला चिन्ह है।
  alternative: चिन्ह परमेश्वर की वर्तमान साथ रहने की प्रतिज्ञा हो सकता है, या वर्तमान आश्वासन और भावी पूर्ति—दोनों को समेट सकता है।
  rationale: इब्रानी वाक्य-विन्यास स्वाभाविक रूप से आगे आने वाले कथन को चिन्ह की विषय-वस्तु से जोड़ता है, फिर भी विराम-चिह्नों द्वारा अन्य सम्भावनाओं को सिद्धान्ततः असम्भव नहीं बनाया गया है।
- issue: एकवचन से बहुवचन में परिवर्तन
  choice: मूसा के लिए ‘तू’ और लोगों सहित समूह के लिए ‘तुम लोग’ रखा गया है।
  alternative: पूरे वाक्य में अस्पष्ट ‘तुम’ का प्रयोग।
  rationale: मूल पाठ בְּהוֹצִיאֲךָ में एकवचन से תַּעַבְדוּן में बहुवचन की ओर बदलता है; हिन्दी में इसे स्पष्ट करना मूल की अर्थगत गति को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी अपनाई गई है। परमेश्वर द्वारा मूसा को संबोधन में एकवचन ‘तू/तेरे/तुझे’ और समुदाय के लिए स्पष्ट बहुवचन ‘तुम लोग’ रखा गया है।
