  yaml_path: translation/ot/exodus/003/021.yaml
  text: And I will give this people favor in the sight of the Egyptians[a], and when you go[b], you will not go empty-handed.
translation:
  language: hi
  text: और मैं इस प्रजा को मिस्रियों की दृष्टि में अनुग्रह दिलाऊँगा[a]; और जब तुम जाओगे, तो खाली हाथ नहीं जाओगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “मैं इस प्रजा को मिस्रियों की आँखों में अनुग्रह दूँगा।” अर्थात मिस्री इस प्रजा को अनुकूल दृष्टि से देखेंगे।'
    reason: lexical_alternative
  - marker: b
    text: या “खाली नहीं जाओगे।” इब्रानी अभिव्यक्ति का आशय बिना सामान या रसद के प्रस्थान करना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי אֶת־חֵן
  choice: मैं ... कृपापात्र बनाऊँगा
  rationale: शाब्दिक रूप से ‘अनुग्रह दूँगा’ है, पर इस प्रयोग का आशय किसी की दृष्टि में अनुकूल स्वीकृति पाना है। ‘कृपापात्र बनाऊँगा’ आधुनिक हिन्दी में स्वाभाविक है और अनावश्यक धर्मशास्त्रीय अर्थ नहीं जोड़ता।
- source_word: הָעָם הַזֶּה
  choice: इस प्रजा को
  rationale: सामूहिक एकवचन עָם के लिए ‘प्रजा’ स्वाभाविक और गरिमापूर्ण हिन्दी है; यह यहाँ इस्राएली समुदाय को सूचित करता है।
- source_word: בְּעֵינֵי מִצְרָיִם
  choice: मिस्रियों की दृष्टि में
  rationale: इब्रानी मुहावरे ‘आँखों में’ का अर्थ है कि वे किसी को किस प्रकार देखते या स्वीकार करते हैं। ‘दृष्टि में’ उस रूपक और आशय दोनों को सुरक्षित रखता है।
- source_word: וְהָיָה כִּי
  choice: और जब
  rationale: यह भविष्य की परिस्थिति प्रस्तुत करने वाला सामान्य इब्रानी सूत्र है; हिन्दी में ‘और जब’ संक्षिप्त और स्वाभाविक है।
- source_word: תֵלֵכוּן / תֵלְכוּ
  choice: तुम जाओगे / नहीं जाओगे
  rationale: הלך का मूल अर्थ ‘जाना’ है। प्रसंग में यह मिस्र से प्रस्थान को सूचित करता है, पर ‘जाना’ स्रोत की सरलता बनाए रखता है।
- source_word: רֵיקָם
  choice: खाली हाथ
  rationale: यह शब्द ‘खाली’ अथवा ‘खाली हाथ’ जाने का भाव देता है। इस प्रसंग में ‘खाली हाथ’ स्पष्ट करता है कि वे वस्तुओं या प्रावधान के बिना नहीं निकलेंगे।
