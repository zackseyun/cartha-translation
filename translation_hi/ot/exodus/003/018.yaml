  yaml_path: translation/ot/exodus/003/018.yaml
  text: And they will listen to your voice[a], and you and the elders of Israel will go to the king of Egypt and say to him, ‘Yahweh, the God of the Hebrews, has met with us. And now, please let us go a journey of three days into the wilderness, so that we may sacrifice to Yahweh our God.’
translation:
  language: hi
  text: वे तुम्हारी बात सुनेंगे। तब तुम और इस्राएल के बुज़ुर्ग मिस्र के राजा के पास जाओगे और उससे कहोगे, ‘याहवे, इब्रानियों का परमेश्वर, हमसे मिला है[a]। अब, कृपया, हमें जंगल में तीन दिन की यात्रा पर जाने दीजिए, ताकि हम अपने परमेश्वर याहवे को बलि चढ़ाएँ।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमारा सामना हुआ है।” हिब्रू अभिव्यक्ति का अर्थ यह भी हो सकता है कि याहवे ने हमसे भेंट की है या हमारा सामना किया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמְעוּ לְקֹלֶךָ
  choice: वे तुम्हारी बात मानेंगे
  rationale: शाब्दिक अर्थ ‘वे तुम्हारी आवाज़ सुनेंगे’ है, पर इस प्रसंग में שׁמע में सुनने के साथ स्वीकार करने का भाव है। ‘बात मानेंगे’ आधुनिक हिन्दी में स्वाभाविक है और प्रत्युत्तरपूर्ण ग्रहण व्यक्त करता है।
- source_word: וּבָאתָ אַתָּה וְזִקְנֵי יִשְׂרָאֵל
  choice: तब तुम इस्राएल के पुरनियों के साथ ... जाना
  rationale: हिब्रू में मूसा और इस्राएल के पुरनियों का संयुक्त कर्ता है। हिन्दी का निर्देशात्मक ‘जाना’ प्रसंग में भविष्य/आज्ञार्थक आशय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מֶלֶךְ מִצְרַיִם
  choice: मिस्र के राजा
  rationale: यह construct phrase का सीधा और सहज हिन्दी रूप है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में प्रयुक्त परमेश्वर के व्यक्तिगत नाम יהוה को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֵי הָעִבְרִיִּים
  choice: इब्रानियों का परमेश्वर
  rationale: जातीय पद ‘इब्रानियों’ को बनाए रखते हुए construct संबंध स्पष्ट किया गया है।
- source_word: נִקְרָה עָלֵינוּ
  choice: हमसे मिला है
  rationale: קרא का निफ़अल रूप עַל के साथ यहाँ मिलने या सामना होने का अर्थ देता है। यह अनुवाद किसी अधिक विशिष्ट ‘बुलाहट’ को आरोपित नहीं करता।
- source_word: נֵלֲכָה נָּא
  choice: कृपया हमें ... जाने दे
  rationale: cohortative और נָא मिलकर फिरौन से विनम्र निवेदन व्यक्त करते हैं; ‘जाने दे’ सम्बोधित राजा से अनुमति माँगने का आशय स्पष्ट करता है।
- source_word: דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: तीन दिन की यात्रा
  rationale: यात्रा की अवधि अथवा दूरी बताने वाले हिब्रू मुहावरे का स्पष्ट आधुनिक हिन्दी रूप।
- source_word: בַּמִּדְבָּר
  choice: जंगल में
  rationale: מִדְבָּר निर्जन वनप्रदेश को सूचित करता है; ‘जंगल’ हिन्दी बाइबलीय प्रयोग में स्वाभाविक और ‘रेगिस्तान’ से अधिक व्यापक है।
- source_word: וְנִזְבְּחָה
  choice: ताकि हम ... बलि चढ़ाएँ
  rationale: दूसरा cohortative यहाँ जाने के उद्देश्य को व्यक्त करता है; ‘ताकि’ इस संबंध को सहज हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: पद में tetragrammaton सीधे आया है। ‘याहवे’ व्यक्तिगत नाम को सुरक्षित रखता है और उसे उपाधि में नहीं बदलता।
- issue: נִקְרָה עָלֵינוּ में दिव्य भेंट का स्वरूप
  choice: हमसे मिला है
  alternative: हमारे सामने प्रकट हुआ है / हमें बुलाया है / हमारा सामना हुआ है
  rationale: मूल अभिव्यक्ति भेंट या सामना सूचित करती है, पर उसके स्वरूप को पूरी तरह परिभाषित नहीं करती। ‘मिला है’ उस अस्पष्टता को अनावश्यक रूप से दर्शन या बुलाहट में सीमित नहीं करता।
- issue: שׁמע का ग्रहण और आज्ञापालन के बीच अर्थ
  choice: बात मानेंगे
  alternative: आवाज़ सुनेंगे
  rationale: यहाँ आशय केवल ध्वनि सुनना नहीं बल्कि मूसा की बात स्वीकार करना है। फिर भी इसे पूर्ण आज्ञापालन की सैद्धांतिक घोषणा की तरह विस्तृत नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पुरनियों’ को बाइबलीय सामुदायिक पद के रूप में रखा गया है; ‘याहवे’ मूल व्यक्तिगत नाम का देवनागरी रूप है। पद में कोई पाद-टिप्पणी आवश्यक नहीं समझी गई, क्योंकि נִקְרָה עָלֵינוּ का प्रमुख अर्थ मुख्य पाठ में स्वाभाविक रूप से व्यक्त हो जाता है।
