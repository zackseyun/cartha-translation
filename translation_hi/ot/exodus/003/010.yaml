base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/010.yaml
  text: And now[a], come, and I will send you to Pharaoh, and bring my people, the sons of Israel, out of Egypt.
translation:
  language: hi
  text: अब जा। मैं तुझे फिरौन के पास भेजूँगा; और मेरी प्रजा, अर्थात् इस्राएलियों[a] को मिस्र से बाहर निकाल ला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “इस्राएल के पुत्रों।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: इसलिए अब
  rationale: यह पद पिछले कथन से जुड़कर बुलाहट के अगले चरण को सामने लाता है; ‘इसलिए अब’ संयोजक और प्रसंगगत निष्कर्ष, दोनों को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: לְכָה
  choice: जा
  rationale: הלך का पुल्लिंग एकवचन आज्ञार्थ यहाँ मूसा को कार्य पर जाने की आज्ञा देता है। हिंदी में गंतव्य ‘फ़िरौन के पास’ होने के कारण ‘जा’ स्थानगत अर्थ को स्पष्ट और स्वाभाविक रखता है।
- source_word: וְאֶשְׁלָחֲךָ
  choice: मैं तुझे ... भेजूँगा
  rationale: प्रथम पुरुष एकवचन अपूर्ण क्रिया और द्वितीय पुरुष एकवचन प्रत्यय को सीधे रखा गया है; इससे परमेश्वर की नियुक्ति स्पष्ट रहती है, बिना अनावश्यक प्रयोजनार्थक भाव जोड़े।
- source_word: אֶל־פַּרְעֹה
  choice: फ़िरौन के पास
  rationale: दिशासूचक אֶל को हिंदी के स्वाभाविक प्रयोग ‘के पास’ से व्यक्त किया गया है।
- source_word: וְהוֹצֵא
  choice: और तू ... बाहर निकाल लाना
  rationale: יצא के हिफ़ील आज्ञार्थ का कारक अर्थ ‘बाहर निकालना’ से सुरक्षित रहता है। ‘लाना’ वक्ता-केंद्रित गति का भाव देता है और हिंदी में आयोग को स्वाभाविक बनाता है।
- source_word: עַמִּי
  choice: मेरी प्रजा
  rationale: राजकीय और सामूहिक प्रसंग में ‘मेरी प्रजा’ स्वाभाविक हिंदी है तथा परमेश्वर से संबंधित अधिकार और वाचा-संबंध को बनाए रखती है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: इब्रानी की वंशपरक पुल्लिंग अभिव्यक्ति को औपचारिक रूप से सुरक्षित रखा गया है; अधिक मुहावरेदार जातीय पद ‘इस्राएलियों’ को पादटिप्पणी में दिया गया है।
- source_word: מִמִּצְרָיִם
  choice: मिस्र से
  rationale: הוֹצֵא के साथ ‘मिस्र से बाहर निकालना’ स्रोत के निर्गमन-भाव को स्वाभाविक हिंदी में पूर्णतः व्यक्त करता है।
theological_decisions:
- issue: वाचा-समुदाय के लिए בְּנֵי יִשְׂרָאֵל का अनुवाद
  choice: इस्राएल के पुत्रों
  alternative: इस्राएलियों
  rationale: मुख्य पाठ में मूल की वंशपरक और पुल्लिंग संरचना को बनाए रखा गया है, जिससे याकूब/इस्राएल से सामुदायिक संबंध स्पष्ट रहता है। सामान्य आधुनिक हिंदी के अधिक सहज विकल्प को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिंदी अपनाई गई है। परमेश्वर द्वारा मूसा को एकवचन अनौपचारिक संबोधन के अनुरूप ‘जा’, ‘तुझे’ और ‘तू’ रखा गया है। वाक्य-विन्यास को हिंदी में स्पष्ट किया गया है, जबकि आयोग, आज्ञार्थ और वाचा-संबंधी भाषा सुरक्षित है।
