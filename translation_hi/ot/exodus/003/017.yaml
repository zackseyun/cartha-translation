base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/017.yaml
  text: And I have said[a], ‘I will bring you up out of the affliction of Egypt to the land of the Canaanites, the Hittites, the Amorites, the Perizzites, the Hivites[b], and the Jebusites—to a land flowing with milk and honey.’
translation:
  language: hi
  text: और मैंने कहा है[a], ‘मैं तुम्हें मिस्र के उत्पीड़न से ऊपर ले जाऊँगा—कनानियों, हित्तियों, एमोरियों, परिज्जियों, हिव्वियों और यबूसियों के देश में, अर्थात् उस देश में जहाँ दूध और मधु बहता है।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और मैंने कहा।” इब्रानी क्रिया रूपतः भूतकाल में है; मुख्य पाठ में उसका अब भी प्रभावी होना व्यक्त किया गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֹמַר
  choice: और मैंने कहा है
  rationale: इब्रानी क्रिया रूपतः भूतकाल में है, पर प्रसंग में परमेश्वर की पहले कही हुई और अब भी प्रभावी घोषणा को व्यक्त करता है। यह अनुवाद उस वर्तमान प्रासंगिकता को बनाए रखता है; सरल भूतकाल का विकल्प पादटिप्पणी में दिया गया है।
- source_word: אַעֲלֶה
  choice: मैं तुम्हें ... निकालकर ऊपर ले जाऊँगा
  rationale: हिफ़ील रूप का मूल अर्थ ‘ऊपर ले जाना’ है। हिन्दी में केवल ‘ऊपर ले जाऊँगा’ अस्पष्ट हो सकता है, इसलिए प्रस्थान का भाव स्पष्ट करने हेतु ‘निकालकर’ जोड़ा गया, जबकि ‘ऊपर’ की मूल छवि भी सुरक्षित रखी गई है।
- source_word: מֵעֳנִי מִצְרַיִם
  choice: मिस्र के उत्पीड़न से
  rationale: עֳנִי दुःख, दीन दशा या उत्पीड़न बता सकता है। इस प्रसंग में इस्राएल पर थोपे गए अत्याचार के लिए ‘उत्पीड़न’ स्वाभाविक और सटीक है।
- source_word: הַכְּנַעֲנִי ... הַיְבוּסִי
  choice: कनानियों, हित्तियों, एमोरियों, परिज्जियों, हिव्वियों और यबूसियों के देश में
  rationale: इब्रानी में जातिनाम व्याकरणतः एकवचन हैं, किंतु सामूहिक जनसमुदायों को सूचित करते हैं; आधुनिक हिन्दी में बहुवचन रूप अर्थ को सहजता से व्यक्त करते हैं।
- source_word: אֶל אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: उस देश में जहाँ दूध और मधु की धाराएँ बहती हैं
  rationale: यह उर्वरता और प्रचुरता का इब्रानी रूपक है। ‘धाराएँ बहती हैं’ रूपक की जीवंतता बनाए रखते हुए हिन्दी में स्वाभाविक और सुबोध है।
theological_decisions:
- issue: ईश्वरीय प्रतिज्ञा की आरंभिक क्रिया का काल
  choice: और मैंने कहा है
  alternative: और मैंने कहा
  rationale: मूल रूप भूतकालीन है, पर कथन परमेश्वर के ठहराए हुए और अब भी प्रभावी संकल्प के रूप में प्रस्तुत होता है। पूर्ण वर्तमान हिन्दी में यह संबंध बनाए रखता है, जबकि औपचारिक भूतकाल को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज पाठ। जातिनामों के प्रचलित हिन्दी बाइबलीय रूप रखे गए हैं। ‘निकालकर ऊपर ले जाऊँगा’ मूल की आरोहण-छवि और मिस्र से छुटकारे—दोनों को स्पष्ट करता है। अंग्रेज़ी परामर्श-पाठ की पादटिप्पणी b का विषय वास्तव में ‘मिस्र के उत्पीड़न’ वाला पदबंध है, न कि ‘हिव्वियों’; इसलिए हिन्दी में अनावश्यक b चिह्न नहीं रखा गया।
