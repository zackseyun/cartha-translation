  text: וַ/יֹּ֣אמֶר יְהוָ֔ה רָאֹ֥ה רָאִ֛יתִי אֶת עֳנִ֥י עַמִּ֖/י אֲשֶׁ֣ר בְּ/מִצְרָ֑יִם וְ/אֶת צַעֲקָתָ֤/ם שָׁמַ֨עְתִּי֙ מִ/פְּנֵ֣י נֹֽגְשָׂ֔י/ו כִּ֥י יָדַ֖עְתִּי אֶת מַכְאֹבָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/007.yaml
  text: Then Yahweh said[a], “I have surely seen the affliction of my people who are in Egypt, and I have heard their cry because of their oppressors[c][b], for I know their sufferings.”
translation:
  language: hi
  text: तब याहवे ने कहा, “मैंने मिस्र में रहनेवाले अपने लोगों की दुर्दशा निश्चय ही देखी है[a], और उनके उत्पीड़कों[b] के कारण उनकी पुकार[c] सुनी है, क्योंकि मैं उनकी पीड़ाओं को जानता हूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसे “मैंने सचमुच देखा है” भी कहा जा सकता है। इब्रानी में बल देने के लिए क्रिया के साथ उसी धातु का एक विशेष क्रियारूप आया है।
    reason: lexical_alternative
  - marker: b
    text: या “उनसे बेगार करानेवालों।”
    reason: lexical_alternative
  - marker: c
    text: या “उनकी दुहाई।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के व्यक्तिगत नाम के प्रचलित लिप्यंतरण ‘यहोवा’ का प्रयोग किया गया है; इसे किसी उपाधि से नहीं बदला गया।
- source_word: רָאֹה רָאִיתִי
  choice: मैंने ... निश्चय ही देखा है
  rationale: क्रिया के साथ प्रयुक्त infinitive absolute के बलाघात को स्वाभाविक आधुनिक हिन्दी में ‘निश्चय ही’ से व्यक्त किया गया है।
- source_word: עֳנִי
  choice: दुःख
  rationale: यह शब्द दयनीय दशा और उत्पीड़न से उपजी यातना को समेटता है; ‘दुःख’ साधारण पाठक के लिए स्वाभाविक और व्यापक है।
- source_word: עַמִּי
  choice: अपनी प्रजा
  rationale: यह वाचा-संबंधी ‘मेरे लोग’ का भाव रखता है; हिन्दी में परमेश्वर के संदर्भ में ‘अपनी प्रजा’ स्वाभाविक है।
- source_word: אֲשֶׁר בְּמִצְרָיִם
  choice: मिस्र में रहनेवाली
  rationale: सम्बन्धवाचक वाक्यांश को हिन्दी में ‘प्रजा’ के स्वाभाविक विशेषण के रूप में रखा गया है।
- source_word: צַעֲקָתָם
  choice: उनकी पुकार
  rationale: यह संकट से उठी हुई सहायता की पुकार है; ‘पुकार’ सरल और प्रभावशाली है।
- source_word: מִפְּנֵי נֹגְשָׂיו
  choice: उनके सतानेवालों के कारण
  rationale: נֹגֵשׂ श्रम कराने या दबाव डालनेवाले अधिकारी को दर्शाता है; ‘सतानेवाले’ व्यापक अर्थ बचाता है और प्रसंग में सहज है। מִפְּנֵי का कारणवाचक संबंध ‘के कारण’ से व्यक्त किया गया है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह अगले कथन को पहले कथन के आधार या स्पष्टीकरण के रूप में जोड़ता है।
- source_word: יָדַעְתִּי
  choice: मैं ... जानता हूँ
  rationale: पूर्ण क्रिया यहाँ वर्तमान और निजी संज्ञान का भाव देती है; ‘जानता हूँ’ उस निकटता को बनाए रखता है।
- source_word: מַכְאֹבָיו
  choice: उनकी पीड़ाओं
  rationale: बहुवचन संज्ञा शारीरिक और मानसिक दोनों प्रकार के कष्टों का संकेत दे सकती है; ‘पीड़ाओं’ उसका विस्तार बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: व्यक्तिगत वाचा-नाम को उपाधि ‘प्रभु’ से बदलने के बजाय हिन्दी में परिचित लिप्यंतरण द्वारा सुरक्षित रखा गया है।
- issue: परमेश्वर के जानने की मानव-सदृश भाषा
  choice: मैं उनकी पीड़ाओं को जानता हूँ
  alternative: मुझे उनकी पीड़ाओं का पता है
  rationale: मूल पाठ परमेश्वर के निजी और संलग्न ज्ञान को सीधे व्यक्त करता है। ‘जानता हूँ’ उस धार्मिक तनाव और निकटता को अमूर्त ‘पता है’ में हल्का नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्य-विन्यास हिन्दी के अनुरूप है, जबकि मूल के बलाघात, कारण-संबंध और परमेश्वर के निजी ज्ञान को बनाए रखा गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
