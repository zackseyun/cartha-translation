  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/שָׁלַחְתִּ֤י אֶת יָדִ/י֙ וְ/הִכֵּיתִ֣י אֶת מִצְרַ֔יִם בְּ/כֹל֙ נִפְלְאֹתַ֔/י אֲשֶׁ֥ר אֶֽעֱשֶׂ֖ה בְּ/קִרְבּ֑/וֹ וְ/אַחֲרֵי כֵ֖ן יְשַׁלַּ֥ח אֶתְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/020.yaml
  text: And I will stretch out my hand and strike Egypt with all my wonders that I will do in its midst[b][a]; and after that he will send you out.
translation:
  language: hi
  text: और मैं अपना हाथ बढ़ाऊँगा[a] और मिस्र पर उन सब आश्चर्यकर्मों से प्रहार करूँगा, जो मैं उसके बीच करूँगा; और उसके बाद वह तुम्हें बाहर भेज देगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘मैं अपना हाथ भेजूँगा।’ इब्रानी मुहावरे में इसका अर्थ कार्य या सामर्थ्य के लिए हाथ बढ़ाना है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘वह तुम्हें जाने देगा।’ इब्रानी में अधिक शाब्दिक रूप से, ‘वह तुम्हें भेज देगा/बाहर भेज देगा’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁלַחְתִּי אֶת־יָדִי
  choice: तब मैं अपना हाथ बढ़ाकर
  rationale: शׁלח का मूल अर्थ ‘भेजना’ है, पर हाथ के साथ यह मुहावरा सक्रिय सामर्थ्य के प्रयोग को दर्शाता है। ‘हाथ बढ़ाकर’ इब्रानी बिंब को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וְהִכֵּיתִי
  choice: प्रहार करूँगा
  rationale: נכה का अर्थ ‘मारना/प्रहार करना’ है। ‘प्रहार करूँगा’ आने वाली विपत्तियों को समेटता है, पर मृत्यु या पूर्ण विनाश को अनावश्यक रूप से निर्दिष्ट नहीं करता।
- source_word: מִצְרַיִם
  choice: मिस्र
  rationale: यहाँ उचित नाम भूमि और राष्ट्र को सामूहिक इकाई के रूप में दर्शाता है; इसलिए ‘मिस्र’ उपयुक्त है, न कि केवल ‘मिस्रियों’।
- source_word: בְּכֹל נִפְלְאֹתַי
  choice: उन सब आश्चर्यकर्मों से
  rationale: נפלאות असाधारण, विस्मयकारी कार्यों को दर्शाता है। ‘आश्चर्यकर्म’ आधुनिक हिन्दी में स्पष्ट रहते हुए बाइबलीय भाव को बनाए रखता है।
- source_word: אֲשֶׁר אֶעֱשֶׂה
  choice: जो मैं ... करूँगा
  rationale: यह עשה के सरल और सीधे अर्थ को सुरक्षित रखता है।
- source_word: בְּקִרְבּוֹ
  choice: उसके बीच
  rationale: एकवचन प्रत्यय का निकटतम संदर्भ ‘मिस्र’ है। ‘उसके बीच’ एकवचन और स्थानगत बिंब दोनों को बनाए रखता है।
- source_word: וְאַחֲרֵי כֵן
  choice: और उसके बाद
  rationale: यह वाक्यांश घटनाओं का कालक्रम स्पष्ट करता है और स्वाभाविक आधुनिक हिन्दी है।
- source_word: יְשַׁלַּח אֶתְכֶם
  choice: वह तुम लोगों को जाने देगा
  rationale: शाब्दिक रूप से क्रिया ‘भेजना’ है, किंतु इस संदर्भ में इसका अर्थ बंधन से निकलने की अनुमति देना है। ‘जाने देगा’ स्वाभाविक हिन्दी में यही भाव व्यक्त करता है; बहुवचन ‘तुम’ को ‘तुम लोगों’ से स्पष्ट किया गया है।
theological_decisions:
- issue: परमेश्वर की कार्रवाई के लिए मानवरूपी भाषा
  choice: ‘अपना हाथ बढ़ाकर’ का ठोस बिंब बनाए रखा गया
  alternative: ‘अपनी सामर्थ्य प्रकट करके’ जैसे अमूर्त रूप में अनुवाद करना
  rationale: इब्रानी पाठ परमेश्वर के हस्तक्षेप के लिए जानबूझकर शारीरिक बिंब का प्रयोग करता है। इसे बनाए रखना मूल पाठ के स्पष्ट अर्थ और काव्यात्मक शक्ति का सम्मान करता है।
- issue: फिरौन की रिहाई या निष्कासन की क्रिया
  choice: ‘जाने देगा’
  alternative: ‘बाहर भेज देगा’
  rationale: दोनों अर्थ संदर्भ में संभव हैं। हिन्दी में ‘जाने देगा’ रिहाई के भाव को सहज रूप से व्यक्त करता है, जबकि निष्कासन की संभावित छाया निकटवर्ती संदर्भ में उभरती है; यहाँ कोई संप्रदायगत अर्थ आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘तब’ पिछले कथन से परिणामात्मक संबंध जोड़ता है; ‘आश्चर्यकर्म’ असाधारण दैवी कार्यों का संक्षिप्त और परिचित पद है।
