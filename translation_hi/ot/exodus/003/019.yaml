  text: וַ/אֲנִ֣י יָדַ֔עְתִּי כִּ֠י לֹֽא יִתֵּ֥ן אֶתְ/כֶ֛ם מֶ֥לֶךְ מִצְרַ֖יִם לַ/הֲלֹ֑ךְ וְ/לֹ֖א בְּ/יָ֥ד חֲזָקָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/019.yaml
  text: But I know that the king of Egypt will not let you go[a], except by a strong hand.
translation:
  language: hi
  text: परन्तु मैं जानता हूँ कि मिस्र का राजा तुम्हें जाने नहीं देगा[a], जब तक कि एक शक्तिशाली हाथ उसे विवश न करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मिस्र का राजा तुम्हें जाने नहीं देगा—शक्तिशाली हाथ से भी नहीं”; अथवा, “केवल एक शक्तिशाली हाथ के द्वारा ही तुम्हें जाने देगा।” इब्रानी उपवाक्य संक्षिप्त है और संभवतः इस बात पर बल देता है कि अत्यन्त प्रबल शक्ति ही फ़िरौन को झुकाएगी।
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲנִי
  choice: परन्तु मैं
  rationale: स्वतंत्र सर्वनाम के साथ संयोजक यहाँ कथन में विरोधात्मक और बलयुक्त मोड़ लाता है; आधुनिक हिन्दी में ‘परन्तु मैं’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: יָדַעְתִּי
  choice: जानता हूँ
  rationale: पूर्ण क्रिया यहाँ परमेश्वर के निश्चित और वर्तमान ज्ञान को व्यक्त करती है; हिन्दी में वर्तमान काल स्वाभाविक है।
- source_word: כִּי
  choice: कि
  rationale: यह जानी गई बात की विषय-वस्तु प्रस्तुत करता है।
- source_word: לֹא יִתֵּן אֶתְכֶם ... לַהֲלֹךְ
  choice: तुम्हें जाने नहीं देगा
  rationale: נתן के साथ क्रिया का infinitive यहाँ अनुमति देने के अर्थ में प्रयुक्त है; यह हिन्दी में स्पष्ट और स्वाभाविक मुहावरा है।
- source_word: מֶלֶךְ מִצְרַיִם
  choice: मिस्र का राजा
  rationale: यह इब्रानी संबंध-वाचक पदबंध का सीधा और स्वाभाविक हिन्दी अनुवाद है।
- source_word: וְלֹא בְּיָד חֲזָקָה
  choice: जब तक कि एक शक्तिशाली हाथ उसे विवश न करे
  rationale: इब्रानी उपवाक्य संक्षिप्त और अर्थगर्भित है। संदर्भ के अनुसार फिरौन प्रबल शक्ति के दबाव में ही छोड़ेगा। ‘शक्तिशाली हाथ’ मूल बिंब को बनाए रखता है और ‘उसे विवश न करे’ हिन्दी में निहित अर्थ स्पष्ट करता है।
theological_decisions:
- issue: וְלֹא בְּיָד חֲזָקָה के संक्षिप्त उपवाक्य की व्याख्या
  choice: मिस्र का राजा इस्राएल को तब तक नहीं जाने देगा, जब तक एक शक्तिशाली हाथ उसे विवश न करे।
  alternative: मिस्र का राजा तुम्हें जाने नहीं देगा—शक्तिशाली हाथ से भी नहीं; अथवा, वह केवल एक शक्तिशाली हाथ के कारण तुम्हें जाने देगा।
  rationale: इब्रानी वाक्य-विन्यास संक्षिप्त है और एक से अधिक प्रकार से समझा गया है। अगले पद में परमेश्वर द्वारा मिस्र पर हाथ बढ़ाकर प्रहार करने की बात मुख्य पाठ के चुने हुए अर्थ का समर्थन करती है, पर वैकल्पिक समझ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘शक्तिशाली हाथ’ निर्गमन में बार-बार आने वाले मूल बिंब को सुरक्षित रखता है; मुख्य पाठ में निहित विवशता स्पष्ट की गई है और वास्तविक भाषिक अस्पष्टता पादटिप्पणी में दी गई है।
