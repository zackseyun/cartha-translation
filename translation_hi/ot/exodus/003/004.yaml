  text: When Yahweh saw that he had turned aside to look[a], God called to him from the midst of the bush and said, “Moses, Moses!” And he said[c][b], “Here I am.”
translation:
  language: hi
  text: जब यहोवा ने देखा कि वह देखने के लिए मुड़ गया था, तब परमेश्वर ने झाड़ी के बीच से उसे पुकारा[a], “मूसा, मूसा!” और उसने कहा, “मैं यहाँ हूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘झाड़ी के बीच से’; इसका अनुवाद ‘झाड़ी के भीतर से’ भी हो सकता है। यहाँ ‘झाड़ी’ संभवतः काँटेदार झाड़ी थी।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित नामरूप ‘यहोवा’ रखकर इब्रानी व्यक्तिगत ईश्वरीय नाम और इसी पद में आए אֱלֹהִים के बीच का भेद सुरक्षित रहता है।
- source_word: וַיַּרְא
  choice: ने देखा
  rationale: ראה का सामान्य कथात्मक अर्थ ‘देखना’ है; यहाँ इससे आगे होने वाली पुकार की भूमिका बनती है।
- source_word: כִּי סָר לִרְאוֹת
  choice: कि वह देखने के लिए मुड़कर आया है
  rationale: כִּי को देखी गई बात की विषयवस्तु और לִרְאוֹת को उद्देश्य के रूप में व्यक्त किया गया है। ‘मुड़कर आया’ पिछले पद में मूसा के उस ओर जाने के निर्णय से स्वाभाविक रूप से जुड़ता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: यह हिन्दी बाइबल-परंपरा में स्वाभाविक और गरिमापूर्ण रूप है तथा יְהוָה से स्रोत-पाठ का शब्दगत भेद बनाए रखता है।
- source_word: וַיִּקְרָא אֵלָיו
  choice: उसे पुकारा
  rationale: קרא אל का भाव किसी को संबोधित करके पुकारना है; हिन्दी में ‘उसे पुकारा’ संक्षिप्त और स्वाभाविक है।
- source_word: מִתּוֹךְ הַסְּנֶה
  choice: झाड़ी के बीच से
  rationale: מִתּוֹךְ का स्थानगत अर्थ सुरक्षित है; ‘झाड़ी के भीतर से’ भी संभव है और पादटिप्पणी में दिया गया है।
- source_word: מֹשֶׁה מֹשֶׁה
  choice: मूसा, मूसा!
  rationale: नाम की पुनरावृत्ति व्यक्तिगत और गंभीर पुकार को ज्यों का त्यों रखती है।
- source_word: הִנֵּנִי
  choice: मैं यहाँ हूँ
  rationale: यह उपस्थिति और तत्परता सूचित करने वाला प्रचलित उत्तर है; इसमें आज्ञाकारिता का अतिरिक्त अर्थ आरोपित नहीं किया गया।
theological_decisions:
- issue: एक ही पद में יְהוָה और אֱלֹהִים का अनुवाद
  choice: क्रमशः ‘यहोवा’ और ‘परमेश्वर’
  alternative: दोनों को ‘परमेश्वर’ कहना, अथवा יְהוָה को ‘प्रभु’ कहना
  rationale: दो अलग इब्रानी पदों का भेद रखने से स्रोत-पाठ की निकटता और कथन की ईश्वरीय पहचान दोनों सुरक्षित रहती हैं।
- issue: अंतिम וַיֹּאמֶר का कर्ता
  choice: ‘उसने कहा’—संदर्भ से मूसा
  alternative: ‘मूसा ने कहा’
  rationale: इब्रानी में कर्ता निहित है। हिन्दी में पिछली प्रत्यक्ष पुकार के कारण ‘उसने’ का संकेत स्पष्ट है और स्रोत की संक्षिप्तता बनी रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘तब’ इब्रानी कथाक्रम को हिन्दी में स्पष्ट करता है। प्रत्यक्ष वचन में स्वाभाविक विराम-चिह्न रखे गए हैं।
