  text: וַ֠/יֵּרָא מַלְאַ֨ךְ יְהֹוָ֥ה אֵלָ֛י/ו בְּ/לַבַּת אֵ֖שׁ מִ/תּ֣וֹךְ הַ/סְּנֶ֑ה וַ/יַּ֗רְא וְ/הִנֵּ֤ה הַ/סְּנֶה֙ בֹּעֵ֣ר בָּ/אֵ֔שׁ וְ/הַ/סְּנֶ֖ה אֵינֶ֥/נּוּ אֻכָּֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/002.yaml
  text: Then the angel of Yahweh appeared to him in a flame of fire from the midst of the bush. He looked[a], and behold, the bush was burning with fire, but the bush was not consumed.
translation:
  language: hi
  text: तब याहवे का दूत[a] उसे झाड़ी के भीतर से आग की लपट में दिखाई दिया। उसने देखा—झाड़ी आग में जल रही थी, लेकिन वह भस्म नहीं हो रही थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे का स्वर्गदूत।” इब्रानी शब्द का अर्थ “दूत” या “स्वर्गदूत” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: दिखाई दिया
  rationale: निफ़अल रूप यहाँ प्रकट होने या दृश्य होने का भाव देता है; ‘दिखाई दिया’ आधुनिक हिन्दी में स्वाभाविक है और मूसा के अनुभव के दृष्टिकोण को बनाए रखता है।
- source_word: מַלְאַךְ יְהוָה
  choice: याहवे का दूत
  rationale: מַלְאַךְ का अर्थ ‘दूत’ या संदर्भानुसार ‘स्वर्गदूत’ हो सकता है। ‘दूत’ मूल शब्द की व्यापकता और इस ईश-प्रकटन की कथात्मक-धर्मवैज्ञानिक जटिलता को सुरक्षित रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय दिव्य नाम को उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत किया गया है।
- source_word: אֵלָיו
  choice: उसे
  rationale: पूर्वसर्ग और सर्वनाम-प्रत्यय का सीधा संदर्भ मूसा से है।
- source_word: בְּלַבַּת אֵשׁ
  choice: आग की लपट में
  rationale: रचना के अग्नि-संबंधी दृश्य-बिंब और इब्रानी संबंध-पदबंध को स्पष्ट, स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: מִתּוֹךְ הַסְּנֶה
  choice: झाड़ी के बीच से
  rationale: מִתּוֹךְ के ‘भीतर/बीच से’ वाले स्थानिक भाव को निकटता से व्यक्त करता है।
- source_word: וַיַּרְא וְהִנֵּה
  choice: उसने देखा—
  rationale: מֹשֶׁה के ध्यान देने और उसके सामने उपस्थित विस्मयकारी दृश्य, दोनों को संक्षिप्त कथात्मक विराम द्वारा व्यक्त किया गया है; इससे आधुनिक हिन्दी में अस्वाभाविक ‘और देखो’ से बचते हुए הִנֵּה का ध्यानाकर्षक बल बना रहता है।
- source_word: בֹּעֵר בָּאֵשׁ
  choice: आग में जल रही थी
  rationale: कृदंत की निरंतर क्रिया को ‘जल रही थी’ व्यक्त करता है और मूल में आए ‘आग’ को भी स्पष्ट रखता है।
- source_word: אֵינֶנּוּ אֻכָּל
  choice: वह भस्म नहीं हो रही थी
  rationale: आग के संदर्भ में אכל के कर्मवाच्य का अर्थ ‘भस्म/समाप्त हो जाना’ है। यह अनुवाद झाड़ी के लगातार जलने पर भी नष्ट न होने के विरोधाभास को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: यहाँ मूल पाठ में वाचा का विशिष्ट दिव्य नाम है; ‘याहवे’ उसे नाम के रूप में बनाए रखता है, न कि सामान्य उपाधि में बदलता है।
- issue: ईश-प्रकटन के संदर्भ में מַלְאַךְ की पहचान
  choice: दूत
  alternative: स्वर्गदूत
  rationale: मूल शब्द दूत और स्वर्गदूत दोनों अर्थों में प्रयुक्त हो सकता है। केवल ‘स्वर्गदूत’ कहने से पहचान मूल पाठ की अपेक्षा अधिक निश्चित हो सकती है; ‘दूत’ अस्पष्टता और आगामी कथा के धर्मवैज्ञानिक तनाव को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘याहवे’ को व्यक्तिनाम की तरह और ‘दूत’ को जानबूझकर व्यापक अर्थ में रखा गया है। डैश विस्मयकारी दृश्य पर ध्यान केंद्रित करता है, जबकि वाक्यांश मूल की अग्नि-संबंधी पुनरावृत्ति और निरंतर क्रिया को बनाए रखते हैं।
