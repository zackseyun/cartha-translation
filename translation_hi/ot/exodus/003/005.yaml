  yaml_path: translation/ot/exodus/003/005.yaml
  text: Then he said[a], “Do not come near here. Remove your sandals from your feet[b], because the place where you are standing is holy ground.”
translation:
  language: hi
  text: तब उसने कहा[a], “यहाँ पास मत आ। अपने पैरों से अपने सैंडल उतार दो, क्योंकि जिस स्थान पर तुम खड़े हो, वह पवित्र भूमि है[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहाँ निकट मत आ।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ, “पवित्रता की भूमि।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब उसने कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम का स्वाभाविक क्रम व्यक्त करता है।
- source_word: אַל תִּקְרַב הֲלֹם
  choice: इधर पास मत आ
  rationale: निषेध के साथ क्रिया स्थान की ओर निकट आने से रोकती है; ‘इधर पास मत आ’ הֲלֹם की दिशात्मक-स्थानिक बारीकी को सहज हिन्दी में रखता है।
- source_word: שַׁל נְעָלֶיךָ מֵעַל רַגְלֶיךָ
  choice: अपने पैरों से अपनी जूतियाँ उतार दे
  rationale: आज्ञार्थक क्रिया footwear को पैरों से निकालने का निर्देश देती है। ‘जूतियाँ’ प्राचीन प्रकार की पादुका का सांस्कृतिक ठोसपन बनाए रखती है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह आज्ञा का कारण प्रस्तुत करता है; ‘क्योंकि’ समकालीन हिन्दी में कारण स्पष्ट करता है।
- source_word: הַמָּקוֹם אֲשֶׁר אַתָּה עוֹמֵד עָלָיו
  choice: जिस स्थान पर तू खड़ा है
  rationale: सम्बन्धवाचक उपवाक्य मूसा की वर्तमान स्थिति बताता है। एकवचन सम्बोधन को ‘तू’ से सुरक्षित रखा गया है।
- source_word: אַדְמַת קֹדֶשׁ
  choice: पवित्र भूमि
  rationale: इब्रानी संबंध-विन्यास का शाब्दिक अर्थ ‘पवित्रता की भूमि’ है; ‘पवित्र भूमि’ अर्थ को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: הוּא
  choice: वह ... है
  rationale: सर्वनाम यहाँ विधेयात्मक वाक्य को पूरा करता है; हिन्दी में ‘वह ... है’ उसके बल और वाक्य-संरचना को स्पष्ट रखता है।
theological_decisions:
- issue: स्थान की पवित्रता का स्वरूप
  choice: केवल यह कहना कि वह स्थान ‘पवित्र भूमि’ है
  alternative: यह स्पष्ट जोड़ना कि भूमि परमेश्वर की उपस्थिति के कारण पवित्र है
  rationale: पद भूमि को पवित्र घोषित करता है, पर इसी वाक्य में उसकी पवित्रता की प्रक्रिया या कारण की व्याख्या नहीं करता; इसलिए अनुवाद कोई अतिरिक्त धर्मवैज्ञानिक स्पष्टीकरण नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और प्रत्यक्ष कथात्मक स्वर अपनाया गया है। परमेश्वर द्वारा मूसा को दिए गए एकवचन आदेशों के लिए ‘तू’ प्रयोग किया गया है, जो निकट और प्रत्यक्ष सम्बोधन को दिखाता है; इसे अनादर सूचित करने के लिए नहीं चुना गया।
