id: EXO.3.6
reference: Exodus 3:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר אָנֹכִי֙ אֱלֹהֵ֣י אָבִ֔י/ךָ אֱלֹהֵ֧י אַבְרָהָ֛ם אֱלֹהֵ֥י יִצְחָ֖ק וֵ/אלֹהֵ֣י יַעֲקֹ֑ב וַ/יַּסְתֵּ֤ר מֹשֶׁה֙ פָּנָ֔י/ו כִּ֣י יָרֵ֔א מֵ/הַבִּ֖יט אֶל הָ/אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/006.yaml
  text: Then he said, “I am the God of your father, the God of Abraham, the God of Isaac, and the God of Jacob.” And Moses hid his face, because he was afraid to look at God.
translation:
  language: hi
  text: तब उसने कहा, “मैं तुम्हारे पिता का परमेश्वर, अब्राहम का परमेश्वर, इसहाक का परमेश्वर और याकूब का परमेश्वर हूँ।” तब मूसा ने अपना चेहरा छिपा लिया, क्योंकि वह परमेश्वर की ओर देखने से डरता था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब उसने कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में घटनाक्रम स्पष्ट करता है।
- source_word: אָנֹכִי
  choice: मैं ... हूँ
  rationale: स्वतंत्र सर्वनाम बलयुक्त है; हिन्दी के परिचयात्मक नामवाचक वाक्य में ‘मैं ... हूँ’ स्वाभाविक है।
- source_word: אֱלֹהֵי אָבִיךָ
  choice: तुम्हारे पिता का परमेश्वर
  rationale: एकवचन संबंधसूचक प्रत्यय और मूल रचना को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: אֱלֹהֵי אַבְרָהָם אֱלֹהֵי יִצְחָק וֵאלֹהֵי יַעֲקֹב
  choice: अब्राहम का परमेश्वर, इसहाक का परमेश्वर और याकूब का परमेश्वर
  rationale: इब्रानी में ‘परमेश्वर’ की पुनरावृत्ति स्पष्ट और बलयुक्त है, इसलिए उसे संक्षिप्त नहीं किया गया।
- source_word: וַיַּסְתֵּר ... פָּנָיו
  choice: अपना चेहरा छिपा लिया
  rationale: हिफ़ील क्रिया छिपाने या ओझल करने की क्रिया बताती है; ‘चेहरा’ यहाँ शारीरिक अर्थ में उपयुक्त है।
- source_word: כִּי יָרֵא
  choice: क्योंकि वह ... डरता था
  rationale: כִּי का कारणसूचक बल और יָרֵא की अवस्थात्मक भावना सहज आधुनिक हिन्दी में व्यक्त होती है।
- source_word: מֵהַבִּיט אֶל הָאֱלֹהִים
  choice: परमेश्वर की ओर देखने से
  rationale: מן के साथ धातुरूप भय की विषय-वस्तु बताता है; אֶל की दिशात्मक छाया को ‘की ओर’ सुरक्षित रखता है।
theological_decisions:
- issue: प्रत्यक्ष ईश्वरीय आत्म-परिचय में אֱלֹהִים का अनुवाद
  choice: परमेश्वर
  alternative: ईश्वर; देवता
  rationale: संदर्भ में बोलने वाला स्वयं को कुलपिताओं के परमेश्वर के रूप में पहचानता है; ‘परमेश्वर’ एकेश्वरवादी और वाचा-संबंधी संदर्भ को बिना अतिरिक्त व्याख्या के स्पष्ट करता है।
- issue: कुलपिताओं के नामों के साथ אֱלֹהֵי की पुनरावृत्ति
  choice: हर नाम के साथ ‘का परमेश्वर’ दोहराना
  alternative: अब्राहम, इसहाक और याकूब का परमेश्वर
  rationale: पुनरावृत्ति मूल पाठ की अलंकारिक और वाचा-संबंधी महत्ता बनाए रखती है।
- issue: אָבִיךָ के एकवचन का संरक्षण
  choice: तुम्हारे पिता
  alternative: तुम्हारे पूर्वजों
  rationale: मूल पाठ में ‘पिता’ एकवचन है; उसे कुलपिताओं के सामूहिक अर्थ में बदलना पाठ की वास्तविक भिन्नता को मिटा देगा।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘तुम्हारे’ मूल के एकवचन संबोधन को दर्शाता है। वाक्य में मूल इब्रानी की पुनरावृत्ति और कारणसूचक संबंध सुरक्षित रखे गए हैं।
