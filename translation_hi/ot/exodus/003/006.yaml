  terminology: “परमेश्वर” is an established, comprehensible Hindi biblical rendering for אֱלֹהִים in this explicit patriarchal divine-identification context. The repeated patriarchal formula and the singular “तुम्हारे पिता” are retained faithfully. Names are standard Hindi biblical forms.
