id: EXO.3.13
reference: Exodus 3:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶל הָֽ/אֱלֹהִ֗ים הִנֵּ֨ה אָנֹכִ֣י בָא֮ אֶל בְּנֵ֣י יִשְׂרָאֵל֒ וְ/אָמַרְתִּ֣י לָ/הֶ֔ם אֱלֹהֵ֥י אֲבוֹתֵי/כֶ֖ם שְׁלָחַ֣/נִי אֲלֵי/כֶ֑ם וְ/אָֽמְרוּ לִ֣/י מַה שְּׁמ֔/וֹ מָ֥ה אֹמַ֖ר אֲלֵ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/013.yaml
  text: Then Moses said to God, “Look, when I come to the sons of Israel and say to them, ‘The God of your fathers has sent me to you,’ and they say to me, ‘What is his name?’ what shall I say to them?”
translation:
  language: hi
  text: तब मूसा ने परमेश्वर से कहा, “देखिए, जब मैं इस्राएलियों के पास जाकर उनसे कहूँगा, ‘तुम्हारे पूर्वजों के परमेश्वर ने मुझे तुम्हारे पास भेजा है,’ और वे मुझसे पूछेंगे, ‘उसका नाम क्या है?’ तब मैं उनसे क्या कहूँ?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: देखिए
  rationale: यहाँ यह शब्द मूसा की बात के अगले काल्पनिक प्रसंग की ओर ध्यान खींचता है; आधुनिक हिंदी में ‘देखिए’ स्वाभाविक रूप से वही संवादात्मक बल देता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: शाब्दिक ‘इस्राएल के पुत्रों’ के बजाय यह आधुनिक हिंदी में उसी जातीय-समुदायगत अर्थ को स्पष्ट और सहज ढंग से व्यक्त करता है।
- source_word: אֱלֹהֵי אֲבוֹתֵיכֶם
  choice: तुम्हारे पूर्वजों के परमेश्वर
  rationale: ‘पूर्वजों’ आधुनिक पाठक के लिए पितृपुरुषों/पुरखों का व्यापक आशय स्वाभाविक रूप से पहुँचाता है और वाक्य की गरिमा बनाए रखता है।
- source_word: מַה שְּׁמוֹ
  choice: उसका नाम क्या है?
  rationale: मूल प्रश्न की सीधी संरचना और नाम की पहचान संबंधी खुलापन सुरक्षित रखा गया है।
- source_word: מָה אֹמַר אֲלֵהֶם
  choice: तब मैं उनसे क्या कहूँ?
  rationale: अपूर्ण क्रिया के प्रसंगगत भावी/विचारात्मक अर्थ को हिंदी के स्वाभाविक प्रश्नात्मक रूप में व्यक्त किया गया है।
theological_decisions:
- issue: ‘उसका नाम क्या है?’ में ‘नाम’ का आशय
  choice: प्रश्न को बिना व्याख्यात्मक विस्तार के यथावत खुला रखा गया
  alternative: ‘उसकी पहचान/स्वभाव क्या है?’ जैसे अर्थ-विस्तार को मुख्य पाठ में जोड़ना
  rationale: मूल में שֵׁם सीधे ‘नाम’ है; उसका धार्मिक या चरित्रगत निहितार्थ हो सकता है, पर पद स्वयं उसे स्पष्ट नहीं करता।
- issue: אֱלֹהִים का संबोधन
  choice: परमेश्वर
  alternative: ईश्वर या भगवान
  rationale: ‘परमेश्वर’ आधुनिक हिंदी बाइबलीय शैली में गरिमापूर्ण और व्यापक रूप से समझा जाने वाला पद है; यहाँ किसी विशिष्ट दैवी नाम को समय से पहले नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। मूसा के विनम्र संवाद के लिए ‘देखिए’ और ‘कहूँगा/पूछेंगे/कहूँ’ का आदरसूचक-सामान्य विन्यास अपनाया गया है। कोई पादटिप्पणी आवश्यक नहीं मानी गई।
