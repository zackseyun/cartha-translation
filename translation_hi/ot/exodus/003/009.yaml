id: EXO.3.9
reference: Exodus 3:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/עַתָּ֕ה הִנֵּ֛ה צַעֲקַ֥ת בְּנֵי יִשְׂרָאֵ֖ל בָּ֣אָה אֵלָ֑/י וְ/גַם רָאִ֨יתִי֙ אֶת הַ/לַּ֔חַץ אֲשֶׁ֥ר מִצְרַ֖יִם לֹחֲצִ֥ים אֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/009.yaml
  text: And now[a], behold, the cry of the sons of Israel has come to me[b], and I have also seen the oppression with which the Egyptians are oppressing them.
translation:
  language: hi
  text: और अब देखो, इस्राएल के पुत्रों की दुहाई मुझ तक आ पहुँची है, और मैंने वह अत्याचार भी देखा है जो मिस्री उन पर कर रहे हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: और अब
  rationale: संयोजक और कालसूचक क्रियाविशेषण दोनों को रखते हुए प्रसंग में अगले कथन की ओर स्वाभाविक संक्रमण दिखाता है।
- source_word: הִנֵּה
  choice: देखो
  rationale: ध्यान आकर्षित करने वाले इब्रानी अव्यय का आधुनिक, सहज और गरिमापूर्ण हिन्दी रूप है।
- source_word: צַעֲקַת
  choice: दुहाई
  rationale: संकट में सहायता के लिए उठी पुकार का भाव व्यक्त करता है; केवल सामान्य 'पुकार' की अपेक्षा इस प्रसंग में अधिक सटीक है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: मूल के पारिवारिक और वाचा-संबंधी पदबंध को बनाए रखता है; यहाँ 'इस्राएली' अधिक स्वाभाविक विकल्प होता, पर मूल रूपक को समतल कर देता।
- source_word: בָּאָה אֵלַי
  choice: मुझ तक आ पहुँची है
  rationale: मूल क्रिया 'आना' को रखते हुए हिन्दी में गंतव्य तक पहुँचने का स्वाभाविक अर्थ देता है और वर्तमान प्रासंगिकता व्यक्त करता है।
- source_word: וְגַם
  choice: और ... भी
  rationale: मूल के संयोजन और अतिरिक्त बल दोनों को हिन्दी वाक्यक्रम में स्वाभाविक ढंग से सुरक्षित रखता है।
- source_word: רָאִיתִי
  choice: मैंने ... देखा है
  rationale: पूर्ण क्रिया के वर्तमान परिणाम और आगे होने वाली परमेश्वर की कार्रवाई से उसके संबंध को व्यक्त करता है।
- source_word: הַלַּחַץ
  choice: अत्याचार
  rationale: दमनकारी दबाव और कठोर व्यवहार के सामाजिक अर्थ को इस प्रसंग में स्पष्ट तथा स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִצְרַיִם
  choice: मिस्री
  rationale: यद्यपि रूप सामान्यतः देशनाम 'मिस्र' है, बहुवचन कृदंत לֹחֲצִים यहाँ मिस्रियों को सामूहिक कर्ता के रूप में सूचित करता है; हिन्दी में 'मिस्री ... कर रहे हैं' स्पष्ट और व्याकरणसम्मत है।
- source_word: לֹחֲצִים
  choice: कर रहे हैं
  rationale: संज्ञा 'अत्याचार' के साथ मिलकर मूल के सजातीय 'दमन से दबा रहे हैं' भाव को सहज हिन्दी में व्यक्त करता है और जारी कार्रवाई को बनाए रखता है।
- source_word: אֹתָם
  choice: उन पर
  rationale: हिन्दी में 'अत्याचार करना' के साथ परसर्ग 'पर' स्वाभाविक है और सर्वनाम इस्राएल के पुत्रों की ओर संकेत करता है।
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל का लिंगयुक्त वाचा-संबंधी पद
  choice: इस्राएल के पुत्रों
  alternative: इस्राएलियों / इस्राएल की सन्तानों
  rationale: मूल के पुरुषवाचक पारिवारिक पदबंध को सुरक्षित रखा गया है, बिना यह दावा जोड़े कि पुकार करने वालों में केवल पुरुष ही थे।
- issue: परमेश्वर का पुकार सुनना और अत्याचार देखना
  choice: दुहाई मुझ तक आ पहुँची है ... मैंने ... देखा है
  alternative: दुहाई मेरे पास आई ... मैंने देखा
  rationale: मूल कथन को मानवीय भाषा में जैसा है वैसा रखा गया है; परमेश्वर के ज्ञान के स्वरूप पर कोई अतिरिक्त धर्मवैज्ञानिक व्याख्या नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। 'देखो' आधुनिक ध्यानाकर्षक रूप है; 'दुहाई' संकट में सहायता की पुकार को सटीक बनाती है। कोई पादटिप्पणी आवश्यक नहीं समझी गई।
