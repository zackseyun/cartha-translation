base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/014.yaml
  text: 'And God said to Moses[a], “I AM WHO I AM.” And he said[b], “Thus you shall say to the sons of Israel: ‘I AM has sent me to you.’”'
translation:
  language: hi
  text: 'परमेश्वर ने मूसा से कहा, “मैं जो हूँ, वही हूँ।”[a] फिर उसने कहा, “तुम इस्राएलियों[b] से यह कहना: ‘मैं हूँ’ ने मुझे तुम्हारे पास भेजा है।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “मैं जो रहूँगा, वही रहूँगा” या “मैं वह होऊँगा जो मैं होऊँगा” भी हो सकता है। यहाँ प्रयुक्त इब्रानी क्रिया वर्तमान के साथ-साथ भावी अर्थ भी व्यक्त कर सकती है।
    reason: alternative_reading
  - marker: b
    text: 'शाब्दिक रूप से: “इस्राएल के पुत्रों।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: इस कथात्मक संदर्भ में व्याकरणिक रूप बहुवचन होते हुए भी यह इस्राएल के एक परमेश्वर का एकवचन पदनाम है; ‘परमेश्वर’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: אֶהְיֶה
  choice: मैं हूँ
  rationale: היה का प्रथम पुरुष एकवचन अपूर्ण रूप यहाँ वर्तमान अथवा भावी अर्थ दे सकता है। मुख्य पाठ में ‘मैं हूँ’ आत्म-परिचय और अगली पंक्ति में पदनाम-जैसे पुनःप्रयोग को स्पष्ट रखता है; भावी अर्थ पाद-टिप्पणी में सुरक्षित है।
- source_word: אֲשֶׁר
  choice: जो
  rationale: व्यक्तिगत आत्म-संदर्भ में सम्बन्धवाचक ‘जो’ אֲשֶׁר का स्वाभाविक हिन्दी प्रतिरूप है। पूरे वाक्य को सहज बनाने के लिए उत्तरार्ध में ‘वही’ प्रयुक्त हुआ है।
- source_word: כֹּה
  choice: यह
  rationale: यह शब्द आगे दिए जाने वाले कथन का परिचय कराता है; ‘यह कहना’ आधुनिक हिन्दी में आदेशात्मक सूत्र को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: תֹאמַר
  choice: तुम ... कहना
  rationale: द्वितीय पुरुष पुल्लिंग एकवचन अपूर्ण रूप यहाँ मूसा को दिया गया निर्देश है। ‘तुम ... कहना’ आधुनिक हिन्दी में स्पष्ट है और अनावश्यक रूप से पुरातन संबोधन नहीं अपनाता।
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: सन्दर्भ में यह वंश-समुदाय के लोगों का सामूहिक पदनाम है; ‘इस्राएलियों’ सहज आधुनिक हिन्दी है। शाब्दिक रूप ‘इस्राएल के पुत्रों’ पाद-टिप्पणी में दिया गया है।
- source_word: שְׁלָחַנִי
  choice: ने मुझे ... भेजा है
  rationale: पूर्ण रूप और प्रथम पुरुष कर्म-प्रत्यय सम्पन्न भेजे जाने और उसके वर्तमान महत्त्व को व्यक्त करते हैं; हिन्दी का ‘भेजा है’ इसे स्वाभाविक रूप से संप्रेषित करता है।
- source_word: וַיֹּאמֶר
  choice: ने ... कहा / फिर उसने कहा
  rationale: पहला प्रयोग कथन आरम्भ करता है और दूसरा कथन को आगे बढ़ाता है; दूसरे स्थान पर ‘फिर’ हिन्दी में कथानक-क्रम स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय आत्म-पदनाम אֶהְיֶה אֲשֶׁר אֶהְיֶה का अनुवाद
  choice: मैं जो हूँ, वही हूँ
  alternative: मैं जो रहूँगा, वही रहूँगा / मैं वह होऊँगा जो मैं होऊँगा
  rationale: इब्रानी अपूर्ण क्रिया वर्तमान और भावी दोनों बल ग्रहण कर सकती है। मुख्य पाठ में वर्तमान अर्थ पदनाम-जैसे आत्म-परिचय और अगले वाक्य के संक्षिप्त אֶהְיֶה से सम्बन्ध को बनाए रखता है, जबकि वास्तविक भावी सम्भावना पाद-टिप्पणी में दी गई है।
- issue: אֶהְיֶה को नाम-जैसे पदनाम के रूप में दिखाना
  choice: उद्धरण-चिह्नों में “मैं हूँ”
  alternative: बिना विशेष संकेत के मैं हूँ
  rationale: इब्रानी में अलग अक्षर-रूप या बड़े अक्षर नहीं हैं। हिन्दी में उद्धरण-चिह्न यह स्पष्ट करते हैं कि पूरा आत्म-पदनाम वाक्य का कर्ता है, बिना मूल पाठ पर किसी अलग औपचारिक नाम का दावा थोपे।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘तुम’ मूसा के लिए एकवचन निर्देश को स्वाभाविक हिन्दी में व्यक्त करता है। ‘मैं जो हूँ, वही हूँ’ अर्थ की गम्भीरता बनाए रखते हुए ‘मैं जो हूँ सो हूँ’ जैसे अपेक्षाकृत पुरातन मुहावरे से बचता है।
