id: EXO.3.22
reference: Exodus 3:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/שָׁאֲלָ֨ה אִשָּׁ֤ה מִ/שְּׁכֶנְתָּ/הּ֙ וּ/מִ/גָּרַ֣ת בֵּיתָ֔/הּ כְּלֵי כֶ֛סֶף וּ/כְלֵ֥י זָהָ֖ב וּ/שְׂמָלֹ֑ת וְ/שַׂמְתֶּ֗ם עַל בְּנֵי/כֶם֙ וְ/עַל בְּנֹ֣תֵי/כֶ֔ם וְ/נִצַּלְתֶּ֖ם אֶת מִצְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/022.yaml
  text: Each woman shall ask from her neighbor and from the woman staying in her house articles of silver and articles of gold[a], and clothing; and you shall put them on your sons and on your daughters[c][b]. So you will plunder Egypt.
translation:
  language: hi
  text: हर स्त्री अपनी पड़ोसिन और अपने घर में रहनेवाली स्त्री से चाँदी और सोने की वस्तुएँ[a] तथा वस्त्र माँगे। तुम उन्हें अपने बेटों और बेटियों को पहनाना; इस प्रकार तुम मिस्र को लूट लोगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “वस्तुएँ” का अर्थ पात्र, सामान या आभूषण भी हो सकता है; मूल शब्द इनके प्रकार को निश्चित नहीं करता।
    reason: lexical_alternative
  - marker: b
    text: या “मिस्र को संपत्ति से वंचित कर दोगे” अथवा “मिस्र को खाली कर दोगे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁאֲלָה
  choice: माँगे
  rationale: שׁאל का मूल अर्थ ‘माँगना’ या ‘अनुरोध करना’ है; ‘उधार माँगना’ लौटाने का ऐसा भाव जोड़ सकता है जो यहाँ व्यक्त नहीं है।
- source_word: מִשְּׁכֶנְתָּהּ
  choice: अपनी पड़ोसिन से
  rationale: इब्रानी संज्ञा स्त्रीलिंग है और प्रसंग में स्त्री पड़ोसी को दर्शाती है; ‘पड़ोसिन’ इसे स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: וּמִגָּרַת בֵּיתָהּ
  choice: अपने घर में रहनेवाली स्त्री से
  rationale: גור का कृदन्त किसी अस्थायी निवासी या परदेशी के रूप में रहनेवाली स्त्री को सूचित करता है; मुख्य पाठ में यह वाक्यांश व्यापक अर्थ को सहज हिंदी में रखता है।
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב
  choice: चाँदी और सोने की वस्तुएँ
  rationale: כְּלִי व्यापक शब्द है; ‘वस्तुएँ’ पात्र या गहने जैसी अनिर्दिष्ट श्रेणी को अनावश्यक रूप से सीमित नहीं करता।
- source_word: וּשְׂמָלֹת
  choice: वस्त्र
  rationale: यह परिधानों के लिए सामान्य शब्द है; ‘वस्त्र’ आधुनिक, गरिमापूर्ण और पर्याप्त रूप से व्यापक है।
- source_word: וְשַׂמְתֶּם עַל
  choice: उन्हें ... पहनाना
  rationale: शाब्दिक अर्थ ‘उन पर रखना’ है, पर वस्त्रों और बहुमूल्य वस्तुओं के प्रसंग में ‘पहनाना’ स्वाभाविक हिंदी है।
- source_word: בְּנֵיכֶם ... בְּנֹתֵיכֶם
  choice: अपने बेटों और बेटियों को
  rationale: मूल पाठ दोनों को अलग-अलग स्पष्ट करता है; इसलिए केवल ‘बच्चों’ कहना उचित नहीं होगा।
- source_word: וְנִצַּלְתֶּם אֶת מִצְרָיִם
  choice: इस प्रकार तुम मिस्र को लूट लोगे
  rationale: नצל के पिएल रूप में यहाँ लूट लेने या संपत्ति से वंचित कर देने का प्रबल भाव है; ‘लूट लोगे’ उसे बिना नरम किए स्पष्ट हिंदी में व्यक्त करता है।
theological_decisions:
- issue: मिस्रियों से वस्तुएँ लेने के नैतिक और धर्मवैचारिक भाव को नरम करने की संभावना
  choice: इस प्रकार तुम मिस्र को लूट लोगे
  alternative: इस प्रकार तुम मिस्र को संपत्ति से वंचित कर दोगे
  rationale: मूल पाठ इसे केवल उधार लेने के रूप में प्रस्तुत नहीं करता। अनुवाद न तो लौटाने का अनकहा दायित्व जोड़े और न נצל की तीव्रता को कम करे।
translation_notes:
  register: आधुनिक मानक हिंदी, सहज किंतु गरिमापूर्ण शैली। स्त्रीलिंग संदर्भ को ‘पड़ोसिन’ और ‘रहनेवाली स्त्री’ से स्पष्ट रखा गया है। आज्ञार्थक क्रम के बाद परिणामसूचक अंतिम वाक्य रखा गया है।
