source:
  edition: WLC
  text: וְ/עַתָּ֗ה אִם שָׁמ֤וֹעַ תִּשְׁמְעוּ֙ בְּ/קֹלִ֔/י וּ/שְׁמַרְתֶּ֖ם אֶת בְּרִיתִ֑/י וִ/הְיִ֨יתֶם לִ֤/י סְגֻלָּה֙ מִ/כָּל הָ֣/עַמִּ֔ים כִּי לִ֖/י כָּל הָ/אָֽרֶץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/005.yaml
  text: And now[a], if you will indeed listen to my voice and keep my covenant, then you will be my treasured possession out of all the peoples[c][b], for all the earth is mine.
translation:
  language: hi
  text: और अब, यदि तुम सचमुच मेरी वाणी सुनोगे[a] और मेरी वाचा का पालन करोगे, तो तुम सभी जातियों में से[c] मेरे लिए विशेष सम्पत्ति[b] ठहरोगे, क्योंकि सारी पृथ्वी मेरी है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘यदि तुम सच में मेरी आज्ञा मानोगे।’ इब्रानी में शाब्दिक रूप से ‘यदि सुनते हुए तुम सुनोगे’ है; यह बलाघाती रचना ध्यानपूर्वक अथवा आज्ञाकारी ढंग से सुनने का भाव देती है।
    reason: lexical_alternative
  - marker: b
    text: या ‘मेरी बहुमूल्य सम्पत्ति’ अथवा ‘मेरी अपनी सम्पत्ति।’
    reason: lexical_alternative
  - marker: c
    text: अर्थात सभी राष्ट्रों या जनसमूहों के बीच से; अगला उपवाक्य स्पष्ट करता है कि सारी पृथ्वी फिर भी परमेश्वर की है।
    reason: cross_reference
lexical_decisions:
- source_word: וְעַתָּה
  choice: और अब
  rationale: संयोजक ו और कालवाचक עַתָּה दोनों को रखते हुए यह पिछले प्रसंग से वाचा-संबंधी निष्कर्ष की ओर स्वाभाविक संक्रमण कराता है।
- source_word: שָׁמֹעַ תִּשְׁמְעוּ
  choice: सचमुच ... सुनोगे
  rationale: क्रिया के साथ infinitive absolute की इब्रानी बलाघाती रचना को ‘सचमुच’ व्यक्त करता है; ‘सुनोगे’ श्रवण और आज्ञापालन, दोनों की वाचागत ध्वनि को खुला रखता है।
- source_word: בְּקֹלִי
  choice: मेरी वाणी
  rationale: שמע בקול का अर्थ किसी की वाणी सुनना और उस पर ध्यान देना है। ‘मेरी वाणी सुनोगे’ आधुनिक हिन्दी में स्वाभाविक रहते हुए मूल का ठोस बिंब बनाए रखता है।
- source_word: וּשְׁמַרְתֶּם אֶת־בְּרִיתִי
  choice: और मेरी वाचा का पालन करोगे
  rationale: वाचा के संदर्भ में שׁמר निष्ठापूर्वक मानने या निभाने का अर्थ देता है। ‘पालन’ हिन्दी में ‘वाचा’ के साथ स्पष्ट और स्वाभाविक है।
- source_word: וִהְיִיתֶם לִי
  choice: तो तुम ... मेरी ... ठहरोगे
  rationale: शर्त के बाद आने वाले परिणाम को ‘तो’ स्पष्ट करता है, और ‘ठहरोगे’ इस भाव को व्यक्त करता है कि वे परमेश्वर के लिए एक विशेष हैसियत प्राप्त करेंगे।
- source_word: סְגֻלָּה
  choice: बहुमूल्य सम्पत्ति
  rationale: यह शब्द स्वामी या राजा की विशेष रूप से रखी हुई मूल्यवान सम्पत्ति को सूचित करता है। ‘बहुमूल्य सम्पत्ति’ मूल्य और स्वामित्व दोनों बताता है, बिना किसी अतिरिक्त धर्मवैधानिक अर्थ को जोड़ने के।
- source_word: מִכָּל הָעַמִּים
  choice: सब जातियों में से
  rationale: यहाँ מִן चयन को दर्शाता है—अन्य सभी लोगों के बीच से। ‘जातियों में से’ आधुनिक बाइबलीय हिन्दी में राष्ट्रों/जनसमूहों का बोध कराता है और ‘ऊपर’ जैसी पदानुक्रमात्मक अतिव्याख्या से बचता है।
- source_word: כִּי לִי כָּל־הָאָרֶץ
  choice: क्योंकि सारी पृथ्वी मेरी है
  rationale: כִּי पिछले कथन का आधार देता है। इस प्रसंग में הָאָרֶץ सार्वभौमिक ‘पृथ्वी’ है, क्योंकि कथन सभी जातियों पर परमेश्वर के अधिकार को आधार बनाता है।
theological_decisions:
- issue: वाचा के संदर्भ में שמע को ‘सुनना’ कहा जाए या ‘आज्ञा मानना’
  choice: मेरी वाणी सुनोगे
  alternative: मेरी आज्ञा मानोगे
  rationale: इब्रानी मुहावरे में आज्ञाकारी ढंग से सुनना निहित है, पर मूल पाठ श्रवण के ठोस बिंब को सामने रखता है। मुख्य पाठ में ‘सुनोगे’ उस बिंब को बचाता है, जबकि अगला वाक्यांश ‘वाचा का पालन’ आज्ञाकारिता को स्पष्ट करता है।
- issue: סְגֻלָּה के द्वारा इस्राएल की विशिष्ट स्थिति को कैसे व्यक्त किया जाए
  choice: सब जातियों में से मेरी बहुमूल्य सम्पत्ति
  alternative: सब जातियों से ऊपर मेरी विशेष सम्पत्ति
  rationale: ‘में से’ चुने जाने की विशिष्टता बताता है, पर ऐसी निरपेक्ष श्रेष्ठता नहीं जोड़ता जो मूल में अनिवार्य नहीं है। अगला उपवाक्य साथ ही परमेश्वर के समस्त पृथ्वी पर स्वामित्व को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘वाणी’ और ‘वाचा’ जैसे स्थापित धर्मग्रंथीय शब्द मूल के ठोस तथा वाचा-संबंधी स्वर को बनाए रखते हैं; वाक्य-विन्यास हिन्दी में सहज है।
