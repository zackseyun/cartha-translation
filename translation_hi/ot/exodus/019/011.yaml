  text: וְ/הָי֥וּ נְכֹנִ֖ים לַ/יּ֣וֹם הַ/שְּׁלִישִׁ֑י כִּ֣י בַּ/יּ֣וֹם הַ/שְּׁלִישִׁ֗י יֵרֵ֧ד יְהוָ֛ה לְ/עֵינֵ֥י כָל הָ/עָ֖ם עַל הַ֥ר סִינָֽי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/011.yaml
  text: and let them be ready for the third day[a], because on the third day Yahweh will come down in the sight of all the people on Mount Sinai.
translation:
  language: hi
  text: और वे तीसरे दिन के लिए तैयार रहें, क्योंकि तीसरे दिन याहवे सभी लोगों की आँखों के सामने सीनै पर्वत पर उतरेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיוּ נְכֹנִים
  choice: और वे…तैयार रहें
  rationale: निर्देशात्मक संदर्भ में यह रूप अपेक्षा/आज्ञा व्यक्त करता है। ‘तैयार रहें’ आधुनिक हिन्दी में स्वाभाविक है और तैयारी के भाव को स्पष्ट रखता है।
- source_word: לַיּוֹם הַשְּׁלִישִׁי
  choice: तीसरे दिन के लिए
  rationale: ל यहाँ उस नियत दिन को दर्शाता है जिसके लिए लोगों को तैयार होना है; इसे समय-सीमा मात्र (‘तीसरे दिन तक’) नहीं बनाया गया।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह तैयारी के निर्देश का कारण प्रस्तुत करता है।
- source_word: יֵרֵד
  choice: उतरेगा
  rationale: ירד नीचे आने/उतरने का बिंब रखता है; पर्वत पर ईश्वरीय प्रकटता के संदर्भ में ‘उतरेगा’ संक्षिप्त और स्वाभाविक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में सुरक्षित रखा गया है।
- source_word: לְעֵינֵי כָל הָעָם
  choice: सारी प्रजा की आँखों के सामने
  rationale: यह अभिव्यक्ति ‘आँखों के सामने’ के सजीव इब्रानी बिंब को बनाए रखती है; הָעָם को सामूहिक समुदाय के अर्थ में ‘प्रजा’ कहा गया है।
- source_word: עַל הַר סִינָי
  choice: सीनै पर्वत पर
  rationale: עַל उस पर्वत को उतरने और प्रकट होने का स्थान बताता है; हिन्दी में यह क्रम स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में चतुरक्षरीय व्यक्तिगत नाम स्पष्ट रूप से उपस्थित है। ‘याहवे’ उसका निकट हिन्दी लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। मूल का निर्देशात्मक बल, तीसरे दिन की पुनरावृत्ति और ‘आँखों के सामने’ का दृश्यात्मक भाव सुरक्षित हैं। उपलब्ध अंग्रेज़ी परामर्श-पाठ का [a] संकेत जिस स्थान पर है, उससे दी गई टिप्पणी का कोई संगत पाठांतर नहीं बनता; मूल इब्रानी में भी यहाँ ऐसी आवश्यक अस्पष्टता नहीं है, इसलिए निराधार पादटिप्पणी शामिल नहीं की गई।
