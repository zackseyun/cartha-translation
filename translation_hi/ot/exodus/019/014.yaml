  text: So Moses went down from the mountain to the people[a], and he consecrated the people, and they washed their garments.
translation:
  language: hi
  text: तब मूसा पहाड़ से उतरकर लोगों के पास गया और उसने लोगों को पवित्र किया[a]; फिर उन्होंने अपने वस्त्र धोए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् उन्हें परमेश्वर से भेंट के लिए तैयार करके पवित्र उद्देश्य के लिए अलग किया।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: उतरकर ... गया
  rationale: ירד नीचे की ओर जाने को व्यक्त करता है। संदर्भ में मूसा पहाड़ पर था, इसलिए हिंदी में ‘पहाड़ से उतरकर ... गया’ स्वाभाविक और कथानुक्रम के अनुकूल है।
- source_word: מִן הָהָר
  choice: पहाड़ से
  rationale: הַר निकट संदर्भ में सीनै पहाड़ को सूचित करता है; यहाँ ‘पहाड़’ स्पष्ट और मानक हिंदी रूप है।
- source_word: אֶל הָעָם
  choice: लोगों के पास
  rationale: עָם का सामान्य अर्थ ‘लोग’ है। गति-सूचक אֶל को इस संदर्भ में ‘के पास’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיְקַדֵּשׁ
  choice: पवित्र किया
  rationale: קדשׁ का पिएल रूप यहाँ परमेश्वर से भेंट की धार्मिक तैयारी और लोगों को पवित्र उद्देश्य के लिए अलग किए जाने को दर्शाता है। ‘पवित्र किया’ स्रोत की संक्षिप्तता और धार्मिक तनाव को बनाए रखता है; अर्थ की विशेषता पाद-टिप्पणी में दी गई है।
- source_word: הָעָם
  choice: लोगों को
  rationale: इब्रानी में ‘लोगों’ की पुनरावृत्ति है; स्पष्टता और स्रोत-संगति के लिए हिंदी में भी इसे बनाए रखा गया है।
- source_word: וַיְכַבְּסוּ
  choice: उन्होंने ... धोए
  rationale: כבס विशेष रूप से वस्त्र धोने के लिए प्रयुक्त है। बहुवचन कर्ता को ‘उन्होंने’ से स्पष्ट किया गया है।
- source_word: שִׂמְלֹתָם
  choice: अपने वस्त्र
  rationale: שִׂמְלָה वस्त्र या पहनावे को सूचित करता है। ‘वस्त्र’ धार्मिक तैयारी के प्रसंग के अनुरूप गरिमापूर्ण और आधुनिक मानक हिंदी है; संबंधवाचक प्रत्यय को ‘अपने’ से व्यक्त किया गया है।
theological_decisions:
- issue: सीनै पर परमेश्वर के प्रकट होने से पहले धार्मिक पवित्रीकरण की भाषा
  choice: लोगों को पवित्र किया
  alternative: लोगों का संस्कार किया / लोगों को पवित्र उद्देश्य के लिए अलग किया
  rationale: यह पद धार्मिक तैयारी का वर्णन करता है, पर क्रिया स्वयं संक्षिप्त है और पवित्र करने तथा अलग ठहराने दोनों का भाव रखती है। ‘पवित्र किया’ उस धार्मिक अर्थ और मूल की अस्पष्टता को बनाए रखता है, जबकि पाद-टिप्पणी प्रसंगगत अर्थ स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिंदी, सहज किंतु गरिमापूर्ण कथात्मक शैली। ‘पवित्र किया’ सामान्य पाठक के लिए बोधगम्य है और इब्रानी पवित्रता-भाषा को सीधे बनाए रखता है। मुख्य पाठ में पाद-टिप्पणी चिह्न सम्मिलित है।
