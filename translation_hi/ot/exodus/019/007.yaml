  text: וַ/יָּבֹ֣א מֹשֶׁ֔ה וַ/יִּקְרָ֖א לְ/זִקְנֵ֣י הָ/עָ֑ם וַ/יָּ֣שֶׂם לִ/פְנֵי/הֶ֗ם אֵ֚ת כָּל הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה אֲשֶׁ֥ר צִוָּ֖/הוּ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/007.yaml
  text: So Moses came and called for the elders of the people[b][a], and set before them all these words that Yahweh had commanded him.
translation:
  language: hi
  text: तब मूसा आया और लोगों के बुज़ुर्गों[a] को बुलाया। उसने उनके सामने वे सब वचन[b] रखे जिन्हें बताने की आज्ञा यहोवा ने उसे दी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् लोगों के मान्य वरिष्ठ प्रतिनिधियों को।
    reason: cultural_clarification
  - marker: b
    text: या “वे सब बातें” अथवा “वे सब विषय।” हिब्रू शब्द बोले गए वचनों और विचाराधीन बातों—दोनों को दर्शा सकता है। यहाँ “वचन” इसलिए चुना गया है क्योंकि मूसा यहोवा का संदेश पहुँचा रहा था।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: आया
  rationale: בוא का अर्थ दृष्टिकोण के अनुसार ‘आना’ या ‘जाना’ हो सकता है। यहाँ मूसा यहोवा के पास से लोगों के पास लौटता है, इसलिए ‘आया’ स्वाभाविक है।
- source_word: וַיִּקְרָא לְזִקְנֵי הָעָם
  choice: लोगों के पुरनियों को बुलाया
  rationale: קרא ל किसी को बुलाने या अपने पास आने के लिए पुकारने को व्यक्त कर सकता है। ‘बुलाया’ प्रसंग के अनुकूल है और ‘तलब किया’ की अपेक्षा कम कठोर है।
- source_word: זִקְנֵי הָעָם
  choice: लोगों के पुरनिये
  rationale: זקנים समुदाय के मान्य वरिष्ठ प्रतिनिधियों को दर्शाता है। ‘पुरनिये’ बाइबलीय सामाजिक पद को सुरक्षित रखता है; आधुनिक पाठक के लिए अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: וַיָּשֶׂם לִפְנֵיהֶם
  choice: उनके सामने रखे
  rationale: שׂים לפני का ठोस मुहावरा ‘सामने रखना’ हिन्दी में संदेश प्रस्तुत करने के अर्थ में भी स्वाभाविक है।
- source_word: כָּל הַדְּבָרִים הָאֵלֶּה
  choice: वे सब वचन
  rationale: דברים का अर्थ ‘वचन’, ‘बातें’ या ‘विषय’ हो सकता है। पिछले पदों में मिले ईश्वरीय संदेश को पहुँचाने के कारण यहाँ ‘वचन’ चुना गया है, जबकि व्यापक अर्थ पादटिप्पणी में रखा गया है।
- source_word: אֲשֶׁר צִוָּהוּ יְהוָה
  choice: जिनकी आज्ञा यहोवा ने उसे दी थी
  rationale: यह उपवाक्य संदेश के स्रोत और अधिकार को बताता है। ‘दी थी’ से स्पष्ट होता है कि आज्ञा मूसा द्वारा उसे लोगों के सामने रखने से पहले दी गई थी।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिब्रू चतुरक्षरीय ईश-नाम को हिन्दी में प्रचलित व्यक्तिगत नाम ‘यहोवा’ से व्यक्त किया गया है, न कि उपाधि ‘प्रभु’ से।
theological_decisions:
- issue: ईश-नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे प्रयुक्त है। हिन्दी पाठकों में परिचित रूप ‘यहोवा’ उस नाम को उपाधि में बदले बिना सुरक्षित रखता है; ‘याहवे’ अधिक निकट ध्वन्यात्मक विकल्प है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘पुरनिये’ पदनाम की बाइबलीय-सामाजिक विशिष्टता बचाता है और पादटिप्पणी उसका सामान्य अर्थ खोलती है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
