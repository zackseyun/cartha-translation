base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/017.yaml
  text: Then Moses brought the people out of the camp to meet God[a], and they took their stand at the foot of the mountain.
translation:
  language: hi
  text: तब मूसा लोगों को परमेश्वर से मिलने के लिए छावनी से बाहर ले आया, और उन्होंने पहाड़ की तलहटी में[a] अपना स्थान लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पहाड़ के निचले भाग में।” इब्रानी अभिव्यक्ति पहाड़ के आधार या निचले हिस्से को सूचित करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצֵא
  choice: बाहर ले आया
  rationale: 'हिफ़ील रूप का कारणवाचक अर्थ सुरक्षित रहता है: मूसा लोगों को छावनी से बाहर लाया। यह ‘अगुवाई की’ जैसा अतिरिक्त भाव नहीं जोड़ता।'
- source_word: לִקְרַאת
  choice: से मिलने के लिए
  rationale: यह रचना किसी से भेंट की ओर बढ़ने का अर्थ देती है; आधुनिक हिन्दी में यह स्वाभाविक और सटीक है।
- source_word: הָאֱלֹהִים
  choice: परमेश्वर
  rationale: सिनै के प्रसंग में यह इस्राएल के एकमात्र परमेश्वर को सूचित करता है; हिन्दी में ‘परमेश्वर’ स्वाभाविक निश्चित संदर्भ देता है।
- source_word: מִן הַמַּחֲנֶה
  choice: छावनी से बाहर
  rationale: यह लोगों के प्रस्थान-स्थान और बाहर निकलने, दोनों को स्पष्ट करता है।
- source_word: וַיִּתְיַצְּבוּ
  choice: अपना स्थान लिया
  rationale: हित्पाएल रूप केवल खड़े होने से बढ़कर जान-बूझकर किसी स्थान पर स्थित होने का भाव दे सकता है; यह हिन्दी प्रयोग उस औपचारिक मुद्रा को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְּתַחְתִּית הָהָר
  choice: पहाड़ की तलहटी में
  rationale: प्रसंग में यह पहाड़ के निचले भाग या आधार को सूचित करता है। ‘तलहटी’ स्पष्ट है और पहाड़ के भौतिक रूप से नीचे दबे होने का भ्रम नहीं उत्पन्न करती।
theological_decisions:
- issue: सिनै के ईशप्रकाशन में הָאֱלֹהִים का अनुवाद
  choice: परमेश्वर
  alternative: उस परमेश्वर
  rationale: इब्रानी का निश्चित पद संदर्भित परमेश्वर को स्पष्ट करता है, पर आधुनिक हिन्दी में ‘परमेश्वर’ ही स्वाभाविक है। ‘उस परमेश्वर’ अनावश्यक भेद या दूरी का भाव दे सकता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। कारणवाचक क्रिया, परमेश्वर से भेंट की दिशा और लोगों के जान-बूझकर स्थान ग्रहण करने का भाव सुरक्षित रखा गया है। पादटिप्पणी-चिह्न को उसी वाक्यांश पर रखा गया है जिससे उसका शाब्दिक विकल्प संबंधित है।
