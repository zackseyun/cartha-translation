base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/008.yaml
  text: And all the people answered together and said[a], “All that Yahweh has spoken we will do.” Then Moses brought back the words of the people to Yahweh.
translation:
  language: hi
  text: तब सभी लोगों ने एक साथ उत्तर दिया, “जो कुछ याहवे ने कहा है, वह सब हम करेंगे।” फिर मूसा ने लोगों की बातें याहवे को पहुँचा दीं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, लोगों की बातें याहवे को सुनाईं।
    reason: हिब्रू हिफ़ईल क्रिया यहाँ लोगों के उत्तर को याहवे तक वापस पहुँचाने अथवा उसका प्रतिवेदन करने का भाव दे सकती है।
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: उत्तर दिया
  rationale: यहाँ ענה संवाद के प्रसंग में बोलकर उत्तर देने को दर्शाता है; ‘उत्तर दिया’ स्वाभाविक और सटीक है।
- source_word: כָל הָעָם
  choice: सारी प्रजा
  rationale: सामूहिक अर्थ को बनाए रखते हुए ‘सारी प्रजा’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: יַחְדָּו
  choice: एक साथ
  rationale: यह पूरी प्रजा की संयुक्त प्रतिक्रिया पर बल देता है।
- source_word: כֹּל אֲשֶׁר דִּבֶּר
  choice: जो कुछ ... ने कहा है, वह सब
  rationale: यह अभिव्यक्ति मूल के व्यापक अर्थ और कथन की वर्तमान प्रासंगिकता को स्वाभाविक हिन्दी में रखती है।
- source_word: יְהוָה
  choice: यहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: נַעֲשֶׂה
  choice: हम करेंगे
  rationale: עשה का मूल अर्थ ‘करना’ है; ‘मानेंगे’ या ‘पालन करेंगे’ प्रसंगानुकूल होते हुए भी अधिक व्याख्यात्मक हैं।
- source_word: וַיָּשֶׁב
  choice: पहुँचा दीं
  rationale: हिफ़ील रूप यहाँ लोगों की बातें यहवे तक वापस ले जाने या निवेदित करने का भाव देता है; हिन्दी में ‘पहुँचा दीं’ स्पष्ट और स्वाभाविक है।
- source_word: דִּבְרֵי הָעָם
  choice: प्रजा की बातें
  rationale: मूल के ठोस ‘शब्दों/बातों’ के अर्थ को सहज हिन्दी में सुरक्षित रखता है।
- source_word: אֶל יְהוָה
  choice: यहवे तक
  rationale: אֶל यहाँ दिशा या संबोधन का संकेत देता है; ‘तक’ चुने गए क्रियापद ‘पहुँचा दीं’ के साथ स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में निजी वाचा-नाम है; ‘यहवे’ उसका सीधा हिन्दी लिप्यंतरण है और उसे उपाधि में नहीं बदलता।
- issue: נַעֲשֶׂה को आज्ञापालन की भाषा में प्रस्तुत करना
  choice: हम करेंगे
  alternative: हम मानेंगे / हम पालन करेंगे
  rationale: वाचा का प्रसंग आज्ञापालन का संकेत देता है, पर मूल क्रिया सीधे ‘करना’ कहती है; इसलिए व्याख्यात्मक विस्तार से बचा गया है।
- issue: וַיָּשֶׁב की लौटाने वाली शब्द-छवि
  choice: प्रजा की बातें यहवे तक पहुँचा दीं
  alternative: प्रजा की बातें यहवे को लौटा दीं / बताईं
  rationale: शाब्दिक ‘लौटा दीं’ हिन्दी में यह भ्रम पैदा कर सकता है कि वही शब्द पहले यहवे से आए थे; ‘पहुँचा दीं’ प्रतिवेदन और दिशा दोनों व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मौखिक रूप से सहज शैली। ‘प्रजा’ सामूहिक covenant समुदाय के लिए चुना गया है; वाक्य विन्यास मूल की क्रमिक कथा को बनाए रखता है।
