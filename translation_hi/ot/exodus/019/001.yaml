  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בַּ/חֹ֨דֶשׁ֙ הַ/שְּׁלִישִׁ֔י לְ/צֵ֥את בְּנֵי יִשְׂרָאֵ֖ל מֵ/אֶ֣רֶץ מִצְרָ֑יִם בַּ/יּ֣וֹם הַ/זֶּ֔ה בָּ֖אוּ מִדְבַּ֥ר סִינָֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/001.yaml
  text: In the third month after the sons of Israel had gone out from the land of Egypt[b][a], on this very day they came to the wilderness of Sinai.
translation:
  language: hi
  text: इस्राएल के पुत्रों[a] के मिस्र देश से निकलने के तीसरे महीने में, ठीक इसी दिन[b] वे सीनै के निर्जन प्रदेश में आए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् ‘इस्राएली’ या ‘इस्राएल की संतान।’ इब्रानी में शाब्दिक रूप से ‘इस्राएल के पुत्र’ है; यहाँ यह पूरे इस्राएली समुदाय का पदनाम है।
    reason: lexical_alternative
  - marker: b
    text: या ‘इसी दिन।’ इब्रानी वाक्यांश आगमन के ठीक दिन पर बल दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֹדֶשׁ הַשְּׁלִישִׁי
  choice: तीसरे महीने में
  rationale: חֹדֶשׁ इस काल-सूचक वाक्य में सामान्यतः ‘महीना’ है; यह अनुवाद स्रोत की क्रम-सूचना को स्पष्ट और स्वाभाविक हिंदी में रखता है।
- source_word: לְצֵאת
  choice: निकलने के बाद
  rationale: ל के साथ infinitive construct निर्गमन को समय का संदर्भ-बिंदु बनाता है। हिंदी में ‘निकलने के बाद’ मुख्य घटना से उसका संबंध सहज रूप में व्यक्त करता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: यह इब्रानी पद का पारदर्शी रूप है और यहाँ वाचा-समुदाय के परंपरागत राष्ट्रीय नाम के रूप में प्रयुक्त है; अधिक सहज सामूहिक विकल्प फुटनोट में दिया गया है।
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: मिस्र देश से
  rationale: אֶרֶץ को ‘देश’ के रूप में बनाए रखने से मूल अभिव्यक्ति पूरी आती है और हिंदी भी स्वाभाविक रहती है।
- source_word: בַּיּוֹם הַזֶּה
  choice: ठीक इसी दिन
  rationale: ‘इसी’ स्पष्ट संकेतवाचक भाव को और ‘ठीक’ संभावित बलाघात को व्यक्त करता है; कम बलयुक्त विकल्प फुटनोट में सुरक्षित है।
- source_word: בָּאוּ
  choice: वे ... आए
  rationale: בוא का सीधा अर्थ ‘आना’ है। ‘पहुँचे’ संभव है, पर वह आगमन की पूर्णता को कुछ अधिक स्पष्ट कर देता है।
- source_word: מִדְבַּר סִינָי
  choice: सीनै के निर्जन प्रदेश
  rationale: מִדְבָּר आबादी से दूर वन्य या उजाड़ भूभाग को दर्शाता है। आधुनिक हिंदी में ‘जंगल’ प्रायः वृक्षों वाले वन का बोध कराता है और ‘मरुभूमि’ अत्यधिक शुष्कता निश्चित कर सकती है; ‘निर्जन प्रदेश’ इन अनावश्यक धारणाओं से बचता है।
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל में वाचा-समुदाय का नाम
  choice: इस्राएल के पुत्रों
  alternative: इस्राएली; इस्राएल की संतान
  rationale: मुख्य पाठ में इब्रानी के पुरुषवाची बहुवचन और राष्ट्रीय पदनाम की पारदर्शिता रखी गई है। संदर्भ में यह पूरे इस्राएली समुदाय का नाम है, केवल पुरुषों का सीमित उल्लेख नहीं; इसलिए यह बात फुटनोट में स्पष्ट की गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘निर्जन प्रदेश’ भौगोलिक अर्थ को ‘जंगल’ के आधुनिक वन-संबंधी अर्थ या ‘मरुभूमि’ की अधिक विशिष्ट धारणा के बिना व्यक्त करता है।
