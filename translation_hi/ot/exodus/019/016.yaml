source:
  edition: WLC
  text: וַ/יְהִי֩ בַ/יּ֨וֹם הַ/שְּׁלִישִׁ֜י בִּֽ/הְיֹ֣ת הַ/בֹּ֗קֶר וַ/יְהִי֩ קֹלֹ֨ת וּ/בְרָקִ֜ים וְ/עָנָ֤ן כָּבֵד֙ עַל הָ/הָ֔ר וְ/קֹ֥ל שֹׁפָ֖ר חָזָ֣ק מְאֹ֑ד וַ/יֶּחֱרַ֥ד כָּל הָ/עָ֖ם אֲשֶׁ֥ר בַּֽ/מַּחֲנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/016.yaml
  text: And it happened on the third day[a], when morning came, that there were thunders and lightnings, and a heavy cloud on the mountain, and the sound of a trumpet, very loud[c][b]; and all the people who were in the camp trembled.
translation:
  language: hi
  text: तीसरे दिन, भोर के समय, गरजें[a] और बिजली की चमकें हुईं, पर्वत पर एक घना बादल था, और तुरही[b] की ध्वनि बहुत ऊँची[c] थी; और छावनी में जो लोग थे, वे सब काँप उठे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘आवाज़ें’। इब्रानी शब्द का अर्थ ‘ध्वनियाँ’ या ‘स्वर’ भी हो सकता है, पर यहाँ बिजली की चमकों के साथ आने के कारण इसका आशय सम्भवतः गरज से है।
    reason: lexical_alternative
  - marker: b
    text: या ‘मेढ़े के सींग की ध्वनि’। इब्रानी शब्द ‘शोफ़ार’ सींग से बने तुरही-जैसे वाद्य को दर्शाता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक अर्थ ‘बहुत प्रबल’। यहाँ यह तुरही की ध्वनि की तीव्रता बताता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַיּוֹם הַשְּׁלִישִׁי בִּהְיֹת הַבֹּקֶר
  choice: तीसरे दिन, जब भोर हुई
  rationale: इब्रानी कथात्मक आरंभ और कालवाचक रचना को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; अलग से ‘ऐसा हुआ’ जोड़ना हिन्दी में अनावश्यक रूप से भारी होता।
- source_word: קֹלֹת
  choice: गरजें
  rationale: शब्द का व्यापक अर्थ ‘आवाज़ें’ या ‘स्वर’ भी हो सकता है, परन्तु यहाँ बिजलियों के साथ प्रयुक्त होने के कारण बादलों की गर्जना सर्वाधिक संभावित अर्थ है।
- source_word: וּבְרָקִים
  choice: और बिजलियाँ चमकने लगीं
  rationale: बहुवचन और दृश्य प्रभाव को सहज हिन्दी में व्यक्त करता है; केवल ‘बिजलियाँ’ कहने की अपेक्षा क्रिया जोड़ना अधिक स्वाभाविक है।
- source_word: עָנָן כָּבֵד
  choice: घना बादल
  rationale: כָּבֵד का मूल भाव ‘भारी’ है, पर बादल के लिए यह उसके घनेपन को बताता है; ‘घना बादल’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: קֹל שֹׁפָר
  choice: तुरही की ध्वनि
  rationale: קוֹל ध्वनि को और שֹׁפָר सींग से बने तुरही-जैसे वाद्य को दर्शाता है। मुख्य पाठ में ‘तुरही’ सुबोध है और विशिष्ट वाद्य की जानकारी पादटिप्पणी में दी गई है।
- source_word: חָזָק מְאֹד
  choice: बहुत ऊँची
  rationale: शाब्दिक अर्थ ‘बहुत प्रबल’ है; ध्वनि के संदर्भ में हिन्दी में ‘बहुत ऊँची’ उसकी तीव्रता को अधिक स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיֶּחֱרַד
  choice: काँप उठे
  rationale: क्रिया भय या तीव्र व्याकुलता से काँपने को दर्शाती है; यह अनुवाद शारीरिक और भावात्मक दोनों प्रभावों को बनाए रखता है।
- source_word: כָּל הָעָם אֲשֶׁר בַּמַּחֲנֶה
  choice: छावनी में जितने लोग थे, वे सब
  rationale: इब्रानी के संबंधवाचक उपवाक्य और ‘सब’ के व्यापक बल को स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: सीनै पर्वत पर ईश्वरीय प्रकटता के साथ आने वाली घटनाएँ
  choice: घटनाओं को गरज, बिजली, घने बादल और तुरही की तीव्र ध्वनि के रूप में वर्णनात्मक ढंग से प्रस्तुत किया गया है।
  alternative: קֹלֹת का अनुवाद ‘आवाज़ें’ करके अलौकिक या स्वर्गीय स्वरों का संकेत देना।
  rationale: पद स्वयं इन अनुभूत घटनाओं का वर्णन करता है, पर उनकी अतिरिक्त धर्मवैज्ञानिक व्याख्या नहीं देता। बिजलियों के साथ होने के कारण ‘गरजें’ संदर्भानुकूल है, जबकि शब्द की व्यापक अर्थ-सीमा पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। दृश्य की तीव्रता बनाए रखने के लिए छोटे समन्वित वाक्यांश और अंत में ‘काँप उठे’ का प्रयोग किया गया है। सभी पादटिप्पणी-चिह्न संबद्ध शब्दों के तुरंत बाद रखे गए हैं।
