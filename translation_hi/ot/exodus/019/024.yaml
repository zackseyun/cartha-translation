base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/024.yaml
  text: And Yahweh said to him[a], “Go down, and come up—you and Aaron with you. But the priests and the people must not break through to come up to Yahweh, lest he break out against them.”
translation:
  language: hi
  text: यहोवा ने उससे कहा, “नीचे जाओ। फिर तुम ऊपर आना, और हारून तुम्हारे साथ आए। पर याजक और लोग यहोवा के पास चढ़ने के लिए ज़बरदस्ती न घुसें, कहीं ऐसा न हो कि वह उन पर टूट पड़े।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इसे इस प्रकार भी अनुवाद किया जा सकता है: “ज़बरदस्ती रास्ता बनाकर…कहीं ऐसा न हो कि वह उनके विरुद्ध फूट पड़े।” इब्रानी में लोगों के बलपूर्वक आगे बढ़ने और यहोवा के दंड के फूट पड़ने के लिए परस्पर संबंधित चित्रात्मक भाषा प्रयुक्त हुई है।'
    reason: शाब्दिक विकल्प और मूल पाठ की चित्रात्मक प्रतिध्वनि स्पष्ट करना
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित रूप के द्वारा परमेश्वर के व्यक्तिगत नाम को शीर्षक से प्रतिस्थापित किए बिना प्रस्तुत किया गया है।
- source_word: לֶךְ רֵד
  choice: नीचे जाओ
  rationale: दोनों आज्ञार्थक क्रियाओं का स्वाभाविक हिन्दी रूप, जो तत्काल प्रस्थान और नीचे उतरने की गति व्यक्त करता है।
- source_word: וְעָלִיתָ
  choice: फिर तुम ऊपर आना
  rationale: आज्ञाओं की इस शृंखला में पूर्ण क्रिया का निर्देशात्मक भाव है; ‘फिर’ पहले नीचे जाने और बाद में लौटकर ऊपर आने के क्रम को स्पष्ट करता है।
- source_word: אַתָּה וְאַהֲרֹן עִמָּךְ
  choice: तुम ऊपर आना, और हारून तुम्हारे साथ आए
  rationale: स्पष्ट सर्वनाम का बल और हारून के साथ आने का भाव दोनों सुरक्षित रखे गए हैं।
- source_word: הַכֹּהֲנִים וְהָעָם
  choice: याजक और लोग
  rationale: उपासना-सेवा करने वाले याजकों और सामान्य समुदाय के बीच मूल पाठ का भेद बनाए रखता है।
- source_word: אַל יֶהֶרְסוּ לַעֲלֹת
  choice: ऊपर चढ़ आने के लिए सीमा तोड़कर न घुसें
  rationale: הרס की अवरोध या निर्धारित सीमा तोड़कर आगे बढ़ने की ठोस छवि को सहज हिन्दी में व्यक्त करता है। ‘सीमा’ तत्काल संदर्भ में निर्धारित मर्यादा को स्पष्ट करती है।
- source_word: פֶּן יִפְרָץ בָּם
  choice: कहीं ऐसा न हो कि वह उन पर टूट पड़े
  rationale: अचानक फूट पड़ने वाले दैवी दंड की तीव्र छवि को बनाए रखता है और लोगों के सीमा तोड़ने के साथ अर्थगत प्रतिध्वनि भी देता है।
theological_decisions:
- issue: יְהוָה परमेश्वर के नाम का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: शीर्षक ‘प्रभु’ रखने के बजाय व्यक्तिगत नाम को हिन्दी पाठकों के लिए परिचित लिप्यंतरण में रखा गया है; इससे किसी विशेष उच्चारण को निर्णायक सिद्ध करने का दावा नहीं किया जाता।
- issue: दैवी दंड के कर्ता का उल्लेख
  choice: वह उन पर टूट पड़े
  alternative: यहोवा उन पर टूट पड़े
  rationale: मूल पाठ की एकवचन क्रिया में निहित कर्ता को सर्वनाम से रखा गया है; निकटतम पूर्वपद यहोवा होने के कारण अर्थ स्पष्ट रहता है और मूल की संक्षिप्तता सुरक्षित रहती है।
- issue: אֵלָיו के संकेत का अनुवाद
  choice: उससे
  alternative: मूसा से
  rationale: इस पद में नाम स्पष्ट रूप से नहीं दोहराया गया है। संदर्भ से संकेत मूसा की ओर है, पर अनुवाद मूल पाठ की सर्वनामगत अभिव्यक्ति को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण आदेशात्मक गद्य। ‘ऊपर चढ़ आने’ से पर्वत की दिशा स्पष्ट रहती है; ‘सीमा तोड़कर न घुसें’ चेतावनी की ठोस और तीखी छवि बनाए रखता है।
