source:
  edition: WLC
  text: וְ/הַ֤ר סִינַי֙ עָשַׁ֣ן כֻּלּ֔/וֹ מִ֠/פְּנֵי אֲשֶׁ֨ר יָרַ֥ד עָלָ֛י/ו יְהוָ֖ה בָּ/אֵ֑שׁ וַ/יַּ֤עַל עֲשָׁנ/וֹ֙ כְּ/עֶ֣שֶׁן הַ/כִּבְשָׁ֔ן וַ/יֶּחֱרַ֥ד כָּל הָ/הָ֖ר מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/018.yaml
  text: Mount Sinai was all in smoke because Yahweh had descended on it in fire[a], and its smoke went up like the smoke of a furnace, and the whole mountain trembled greatly.
translation:
  language: hi
  text: सीनै पर्वत पूरी तरह धुएँ में लिपटा था, क्योंकि याहवे आग में उस पर उतरा था। उसका धुआँ भट्ठी[a] के धुएँ के समान ऊपर उठा, और पूरा पर्वत बहुत काँप उठा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भट्ठे के धुएँ के समान।”
    reason: כִּבְשָׁן का अर्थ धातु गलाने की भट्ठी या मिट्टी/ईंट पकाने का भट्ठा हो सकता है; विकल्प मूल शब्द की अर्थ-सीमा को सुरक्षित रखता है।
lexical_decisions:
- source_word: וְ/הַר סִינַי
  choice: सीनै पर्वत
  rationale: स्थान-नाम और संज्ञा का स्वाभाविक हिन्दी क्रम रखा गया है। आरम्भिक וְ को अलग से ‘और’ नहीं बनाया गया, क्योंकि यहाँ उसका कथात्मक संयोजक बल हिन्दी में वाक्य-क्रम से स्पष्ट है।
- source_word: עָשַׁן כֻּלּוֹ
  choice: पूरी तरह धुएँ में लिपटा था
  rationale: क्रिया और כֻּלּוֹ मिलकर पूरे पर्वत के धुएँ से आच्छादित होने का दृश्य देते हैं; यह हिन्दी में स्वाभाविक रहते हुए सम्पूर्णता को बनाए रखता है।
- source_word: מִפְּנֵי אֲשֶׁר
  choice: क्योंकि
  rationale: यह पदबंध आगे कही गई घटना को धुएँ का कारण बताता है।
- source_word: יָרַד עָלָיו יְהוָה בָּאֵשׁ
  choice: याहवे आग में होकर उस पर उतरा था
  rationale: יָרַד का नीचे उतरने का ठोस भाव, עָלָיו का ‘उस पर’, और בָּאֵשׁ का आग में/आग के माध्यम से प्रकट होकर उतरने का भाव सुरक्षित रखा गया है। पूर्वकालिक ‘उतरा था’ कारणवाचक उपवाक्य का समय-संबंध स्पष्ट करता है।
- source_word: וַיַּעַל עֲשָׁנוֹ
  choice: उसका धुआँ ... ऊपर उठ रहा था
  rationale: पुल्लिंग प्रत्यय का निकटतम संदर्भ पर्वत है; עלה की ऊपर की दिशा स्पष्ट रूप से व्यक्त की गई है।
- source_word: כְּעֶשֶׁן הַכִּבְשָׁן
  choice: भट्ठी के धुएँ के समान
  rationale: כִּבְשָׁן के furnace/kiln अर्थ-क्षेत्र के लिए सामान्य और समझने योग्य ‘भट्ठी’ चुना गया है; अधिक विशिष्ट ‘भट्ठा’ पाद-टिप्पणी में दिया गया है।
- source_word: וַיֶּחֱרַד כָּל הָהָר מְאֹד
  choice: पूरा पर्वत बहुत अधिक काँप उठा
  rationale: חרד के तीव्र भौतिक काँपने और מְאֹד की प्रबलता को सहज आधुनिक हिन्दी में व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: याहवे
  alternative: यहोवा
  rationale: मूल में उपाधि नहीं बल्कि चतुरक्षरीय व्यक्तिगत नाम है। ‘याहवे’ उसके प्रचलित विद्वत् पुनर्निर्मित उच्चारण का देवनागरी रूप है और नाम को ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: בָּאֵשׁ में परमेश्वर के उतरने की रीति
  choice: आग में होकर
  alternative: आग के साथ
  rationale: पूर्वसर्ग בְּ यहाँ ‘आग में’ या ‘आग के माध्यम से’ का भाव दे सकता है। ‘आग में होकर’ इस दृश्यात्मक भाषा को बनाए रखता है और यह तय नहीं करता कि आग केवल साथ आई थी या स्वयं प्रकट होने का माध्यम थी।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। दृश्य की तीव्रता बनाए रखने के लिए ‘पूरी तरह’, ‘ऊपर’ और ‘बहुत अधिक’ का प्रयोग किया गया है। पाद-टिप्पणी चिह्न उसी शब्द-समूह पर रखा गया है जिससे उसका वास्तविक शाब्दिक विकल्प सम्बद्ध है।
