reference: Exodus 19:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/גַ֧ם הַ/כֹּהֲנִ֛ים הַ/נִּגָּשִׁ֥ים אֶל יְהוָ֖ה יִתְקַדָּ֑שׁוּ פֶּן יִפְרֹ֥ץ בָּ/הֶ֖ם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/022.yaml
  text: And even the priests who come near to Yahweh must consecrate themselves[b][a], lest Yahweh break out against them.
translation:
  language: hi
  text: और जो याजक याहवे के निकट आते हैं[a], वे भी अपने आपको पवित्र करें, नहीं तो याहवे उन पर टूट पड़ेगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जो याहवे के पास आते हैं” अथवा “जो याहवे के समीप जाते हैं।”
    reason: lexical_alternative
  - marker: b
    text: या “उन पर फूट पड़ेगा।” इब्रानी में याहवे के न्याय के अचानक और प्रबल रूप से प्रकट होने का चित्र है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: और … भी
  rationale: यह पिछले आदेशों से संबंध जोड़ते हुए इस बात पर बल देता है कि याजक भी चेतावनी के दायरे में हैं।
- source_word: הַכֹּהֲנִים
  choice: याजक
  rationale: उपासना और पवित्र सेवा के संदर्भ में כֹּהֲנִים का प्रचलित और स्पष्ट हिन्दी रूप।
- source_word: הַנִּגָּשִׁים אֶל יְהוָה
  choice: जो याहवे के निकट आते हैं
  rationale: नגשׁ का कृदन्त रूप निकट आने या सेवा के लिए परमेश्वर की उपस्थिति में पहुँचने का भाव रखता है; यह अनुवाद उस धार्मिक संदर्भ को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिवाचक वाचा-नाम को हिन्दी में लिप्यंतरित किया गया है और दोनों स्थानों पर उसकी स्पष्ट पुनरावृत्ति बनाए रखी गई है।
- source_word: יִתְקַדָּשׁוּ
  choice: अपने आपको पवित्र करें
  rationale: हित्पएल रूप आत्मवाचक है और अपेक्षित पवित्रीकरण/अलग किए जाने को व्यक्त करता है; यह साधारण आधुनिक हिन्दी में स्पष्ट है।
- source_word: פֶּן
  choice: नहीं तो
  rationale: यह चेतावनी और संभावित नकारात्मक परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יִפְרֹץ בָּהֶם
  choice: उन पर टूट पड़ेगा
  rationale: פרץ की अचानक और प्रबल दैवी कार्रवाई की सजीव छवि को बनाए रखता है, बिना दंड का कोई अनिर्दिष्ट रूप जोड़ने के।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिवाचक वाचा-नाम सीधे आया है; उसका लिप्यंतरण मूल की विशिष्टता और दोनों बार की पुनरावृत्ति को सुरक्षित रखता है।
- issue: יִפְרֹץ בָּהֶם में चेतावनी का स्वरूप
  choice: याहवे उन पर टूट पड़ेगा
  alternative: याहवे उनके बीच फूट पड़ेगा
  rationale: सिनै पर्वत के प्रसंग और בָּהֶם के प्रयोग में प्रतिकूल दैवी कार्रवाई निहित है। चुना हुआ रूप आकस्मिक न्याय की तीव्रता रखता है, पर दंड का कोई विशेष प्रकार नहीं बताता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज धार्मिक भाषा रखी गई है। “याजक,” “पवित्र करें,” और “निकट आते हैं” सामान्य पाठक के लिए बोधगम्य हैं, जबकि मूल के उपासना-संबंधी अर्थ और चेतावनी की तीव्रता भी बनी रहती है।
