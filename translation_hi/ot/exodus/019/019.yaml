  text: וַ/יְהִי֙ ק֣וֹל הַ/שּׁוֹפָ֔ר הוֹלֵ֖ךְ וְ/חָזֵ֣ק מְאֹ֑ד מֹשֶׁ֣ה יְדַבֵּ֔ר וְ/הָ/אֱלֹהִ֖ים יַעֲנֶ֥/נּוּ בְ/קֽוֹל׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/019.yaml
  text: And the sound of the trumpet kept growing stronger and stronger[a]; Moses would speak[b], and God would answer him with a voice.
translation:
  language: hi
  text: तुरही की ध्वनि लगातार और भी प्रबल होती गई[a]। मूसा बोलता था, और परमेश्वर उसे वाणी से उत्तर देता था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “और अधिक ऊँची होती गई।” हिब्रू में शाब्दिक रूप से तुरही की ध्वनि के “चलते जाने और बहुत प्रबल होने” का वर्णन है।
    reason: lexical_alternative
  - marker: b
    text: या “परमेश्वर उसे गर्जन के द्वारा उत्तर देता था” अथवा “सुनाई देने योग्य ढंग से उत्तर देता था।” हिब्रू में “वाणी/आवाज़ से” है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: लगातार ... होती गई
  rationale: यह रूप दृश्य के क्रमिक विकास का परिचय देता है और अगले कृदन्त की निरंतरता के साथ स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: קוֹל הַשּׁוֹפָר
  choice: तुरही की ध्वनि
  rationale: קוֹל यहाँ שׁוֹפָר के साथ होने के कारण ‘ध्वनि’ है; ‘तुरही’ आधुनिक हिन्दी में वाद्य को स्पष्ट और स्वाभाविक रूप से बताती है।
- source_word: הוֹלֵךְ וְחָזֵק מְאֹד
  choice: लगातार और भी प्रबल होती गई
  rationale: हिब्रू पदबंध निरंतर तीव्र वृद्धि बताता है। ‘प्रबल’ मूल के बल-वृद्धि के बिंब को रखता है, जबकि केवल ऊँचाई या तेज़ी तक अर्थ को सीमित नहीं करता।
- source_word: מֹשֶׁה יְדַבֵּר
  choice: मूसा बोलता था
  rationale: अपूर्ण क्रिया दृश्य के भीतर जारी या बार-बार होने वाली क्रिया दिखा सकती है; हिन्दी का ‘बोलता था’ उस पहलू को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְהָאֱלֹהִים
  choice: और परमेश्वर
  rationale: यह निश्चित रूप से इस्राएल के परमेश्वर की ओर संकेत करता है; हिन्दी में ‘परमेश्वर’ स्वाभाविक व्यक्तिवाचक प्रयोग है।
- source_word: יַעֲנֶנּוּ
  choice: उसे ... उत्तर देता था
  rationale: सर्वनाम-प्रत्यय ‘उसे’ को सूचित करता है, और अपूर्ण क्रिया मूसा के बोलने के समानांतर जारी या पुनरावृत्त उत्तर को व्यक्त करती है।
- source_word: בְּקוֹל
  choice: वाणी से
  rationale: पदबंध का शाब्दिक अर्थ ‘वाणी/आवाज़ से’ है। ‘वाणी से’ ईश्वरीय उत्तर को श्रव्य रूप में रखता है, पर उसे अनिवार्यतः गर्जन नहीं ठहराता।
theological_decisions:
- issue: सीनै पर्वत पर परमेश्वर के उत्तर का स्वरूप
  choice: परमेश्वर उसे ‘वाणी से’ उत्तर देता था
  alternative: परमेश्वर उसे गर्जन में उत्तर देता था; परमेश्वर उसे सुनाई देने योग्य ढंग से उत्तर देता था
  rationale: בְּקוֹל में ‘वाणी/आवाज़’ का व्यापक अर्थ है और प्रसंग में गर्जन की व्याख्या संभव है, पर इस पद में गर्जन स्पष्ट रूप से नहीं कहा गया। मुख्य पाठ मूल की अभिव्यक्ति और उसके धर्मवैचारिक तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘तुरही की ध्वनि’, ‘प्रबल होती गई’ और समांतर ‘बोलता था/उत्तर देता था’ मूल की निरंतरता तथा पुनरावृत्त क्रिया को स्पष्ट करते हैं। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
