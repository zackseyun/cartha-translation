base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/015.yaml
  text: And he said to the people[a], “Be ready for three days; do not go near a woman.”
translation:
  language: hi
  text: और उसने लोगों से कहा, “तीन दिनों के लिए तैयार रहो; किसी स्त्री के पास न जाना।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ है, “किसी स्त्री के पास न जाना।” इस संदर्भ में यह तैयारी की अवधि के दौरान यौन संबंधों से दूर रहने का व्यंजनापूर्ण निर्देश है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: और उसने कहा
  rationale: हिब्रू कथात्मक क्रम को स्वाभाविक हिन्दी में बनाए रखता है; कर्ता संदर्भ से मूसा है, इसलिए मूल की तरह सर्वनाम रखा गया है।
- source_word: הָעָם
  choice: लोगों से
  rationale: यहाँ עַם एकत्रित इस्राएलियों के सामूहिक समुदाय को दर्शाता है; ‘लोगों’ आधुनिक हिन्दी में सहज है।
- source_word: הֱיוּ נְכֹנִים
  choice: तैयार रहो
  rationale: היה के आदेशात्मक रूप और נָכוֹן का संयुक्त अर्थ तैयारी की अवस्था में रहने का निर्देश है।
- source_word: לִשְׁלֹשֶׁת יָמִים
  choice: तीन दिनों के लिए
  rationale: वाक्यांश को उसकी वास्तविक अस्पष्टता सहित तीन दिनों की तैयारी-अवधि के रूप में प्रस्तुत करता है; संदर्भ में तीसरे दिन की ओर संकेत संभव है, पर वह इस रूप में स्पष्ट नहीं कहा गया।
- source_word: אַל תִּגְּשׁוּ
  choice: पास न जाना
  rationale: אַל के साथ क्रिया निषेध व्यक्त करती है; ‘पास न जाना’ स्पष्ट और स्वाभाविक हिन्दी है।
- source_word: אֶל אִשָּׁה
  choice: किसी स्त्री के
  rationale: मूलतः ‘एक/किसी स्त्री के पास’ है। मुख्य पाठ में मूल व्यंजना सुरक्षित रखी गई है और यौन संबंध से विरत रहने का आशय टिप्पणी में स्पष्ट किया गया है।
theological_decisions:
- issue: अनुष्ठानिक तैयारी के समय यौन संबंधों के निषेध को मुख्य पाठ में स्पष्ट करना या मूल व्यंजना बनाए रखना
  choice: मुख्य पाठ में ‘किसी स्त्री के पास न जाना’ रखकर हिब्रू व्यंजना को सुरक्षित रखा गया।
  alternative: ‘किसी स्त्री से यौन संबंध न रखना’ अथवा ‘अपनी पत्नियों के पास न जाना।’
  rationale: मूल पाठ स्पष्ट यौन क्रिया का शब्द नहीं, बल्कि प्रचलित व्यंजना प्रयोग करता है। उसे बनाए रखने से स्रोत की अभिव्यक्ति और धार्मिक तनाव सुरक्षित रहते हैं; पाद-टिप्पणी संदर्भगत अर्थ स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और आदेशात्मक रूप अपनाया गया है। ‘स्त्री’ मूल אִשָּׁה के अनुरूप है; ‘पत्नी’ कहने से अर्थ अनावश्यक रूप से सीमित हो जाता।
