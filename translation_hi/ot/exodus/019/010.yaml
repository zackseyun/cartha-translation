  text: וַ/יֹּ֨אמֶר יְהוָ֤ה אֶל מֹשֶׁה֙ לֵ֣ךְ אֶל הָ/עָ֔ם וְ/קִדַּשְׁתָּ֥/ם הַ/יּ֖וֹם וּ/מָחָ֑ר וְ/כִבְּס֖וּ שִׂמְלֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/010.yaml
  text: Then Yahweh said to Moses[a], “Go to the people and consecrate them today and tomorrow, and let them wash their garments.”
translation:
  language: hi
  text: तब याहवे ने मूसा से कहा, “लोगों के पास जाओ और आज और कल उन्हें पवित्र ठहराओ[a], और वे अपने वस्त्र धो लें।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उन्हें पवित्र करो” या “उन्हें पवित्र होने के लिए अलग ठहराओ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय आधुनिक हिन्दी में निकट लिप्यंतरण द्वारा प्रस्तुत किया गया है।
- source_word: וַיֹּאמֶר
  choice: तब ... ने ... कहा
  rationale: वाव-क्रमागत कथानक को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में उसके अनुक्रमिक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לֵךְ אֶל־הָעָם
  choice: लोगों के पास जाओ
  rationale: आज्ञार्थक क्रिया और אֶל के गंतव्य-बोध को सरल, स्वाभाविक हिन्दी में रखा गया है।
- source_word: וְקִדַּשְׁתָּם
  choice: उन्हें पवित्र ठहराओ
  rationale: पिएल रूप यहाँ लोगों को परमेश्वर से भेंट के लिए विधिपूर्वक पवित्र करने या अलग ठहराने का भाव देता है; यह हिन्दी पदबंध धार्मिक अर्थ बनाए रखते हुए समझने योग्य है।
- source_word: הַיּוֹם וּמָחָר
  choice: आज और कल
  rationale: दो दिनों की तैयारी को सूचित करने वाली समय-अभिव्यक्ति का सीधा और स्वाभाविक अनुवाद।
- source_word: וְכִבְּסוּ
  choice: और वे ... धोएँ
  rationale: इब्रानी बहुवचन क्रिया का कर्ता लोग हैं। हिन्दी में संभावनार्थक/आज्ञार्थक ‘धोएँ’ निर्देशित कार्य को स्वाभाविक ढंग से व्यक्त करता है और मूसा की अतिरिक्त अभिकर्ता-भूमिका नहीं जोड़ता।
- source_word: שִׂמְלֹתָם
  choice: अपने वस्त्र
  rationale: שִׂמְלָה वस्त्र या परिधान को दर्शाता है; ‘वस्त्र’ इस गंभीर विधिगत प्रसंग के अनुकूल है।
theological_decisions:
- issue: קדשׁ की विधिगत तैयारी की भाषा
  choice: पवित्र ठहराओ
  alternative: उनका पवित्रीकरण करो; उन्हें पवित्र करके अलग करो
  rationale: सिनै पर परमेश्वर से भेंट की तैयारी इसका निकट प्रसंग है। चुना हुआ अनुवाद विधिगत और पवित्रता-संबंधी अर्थ को बनाए रखता है, पर इसे केवल आंतरिक नैतिक परिवर्तन तक सीमित नहीं करता।
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम है। ‘यहवे’ उसे उपाधि से प्रतिस्थापित किए बिना आधुनिक हिन्दी लिपि में प्रस्तुत करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और कथात्मक प्रयोग। ‘पवित्र ठहराओ’ सामान्य पाठक के लिए बोधगम्य रखते हुए मूल के धार्मिक-विधिगत अर्थ और संभावित व्यापकता को पादटिप्पणी में सुरक्षित रखता है।
