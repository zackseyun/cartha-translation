  yaml_path: translation/ot/exodus/019/013.yaml
  text: No hand shall touch him[a], for he must surely be stoned or surely shot; whether beast or man, he shall not live. When the ram’s horn sounds a long blast[c][b], they may go up on the mountain.
translation:
  language: hi
  text: कोई उसे हाथ न लगाए[a], क्योंकि उसे निश्चय ही पत्थरों से मार डाला जाए या तीर से मार डाला जाए[b]। चाहे पशु हो या मनुष्य, वह जीवित न रहे। जब मेढ़े के सींग का लम्बा नाद सुनाई दे[c], तब वे पर्वत पर चढ़ सकते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से, “कोई हाथ उसे न छुए।” या, सर्वनाम को अधिक सामान्य अर्थ में लिया जाए: “कोई हाथ उसे/उस वस्तु को न छुए।” भाव यह है कि सीमा लाँघने वाले को सीधे पकड़कर नहीं, बल्कि दूर से दण्ड दिया जाए।'
    reason: alternative_reading
  - marker: b
    text: या, “बेध दिया जाए।” इब्रानी क्रिया का अर्थ प्रक्षेपास्त्र चलाकर मारना हो सकता है; इस प्रसंग में सम्भवतः तीरों से।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “जब योबेल लम्बा खींचा जाए”; यहाँ सम्भवतः मेढ़े के सींग से निकला लम्बा नाद अभिप्रेत है।
    reason: cultural_note
lexical_decisions:
- source_word: תִגַּע בּוֹ יָד
  choice: कोई हाथ उसे न छुए
  rationale: इब्रानी की निर्वैयक्तिक कानूनी शैली और पुल्लिंग एकवचन प्रत्यय को बनाए रखता है; प्रसंग में यह सीमा लाँघने वाले अपराधी को सूचित करता है, जिसे सीधे छूना मना है।
- source_word: סָקוֹל יִסָּקֵל
  choice: निश्चय ही पत्थरवाह किया जाए
  rationale: क्रिया के साथ प्रयुक्त infinitive absolute दण्ड की अनिवार्यता और निश्चितता पर बल देता है।
- source_word: יָרֹה יִיָּרֶה
  choice: तीर से मारा जाए
  rationale: ירה इस प्रसंग में दूर से प्रक्षेपास्त्र चलाकर मारने का संकेत देता है; 'तीर से' आधुनिक पाठक के लिए सम्भावित साधन को स्पष्ट करता है, जबकि व्यापक अर्थ 'बेधा जाए' पादटिप्पणी में सुरक्षित है।
- source_word: אִם בְּהֵמָה אִם אִישׁ
  choice: चाहे पशु हो या मनुष्य
  rationale: दोनों श्रेणियों पर समान दण्ड लागू होने का भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त होता है।
- source_word: לֹא יִחְיֶה
  choice: वह जीवित न रहे
  rationale: मूल की संक्षिप्त न्यायिक कठोरता और एकवचन रूप को बनाए रखता है।
- source_word: בִּמְשֹׁךְ הַיֹּבֵל
  choice: जब मेढ़े के सींग का लम्बा नाद सुनाई दे
  rationale: יוֹבֵל यहाँ मेढ़े के सींग अथवा उससे निकले नाद को, और משׁך नाद के लम्बा खिंचने को सूचित करता है।
- source_word: הֵמָּה יַעֲלוּ בָהָר
  choice: तब वे पर्वत पर चढ़ सकते हैं
  rationale: लम्बे नाद के बाद पहले का निषेध हटने और अनुमति मिलने का भाव स्पष्ट करता है।
theological_decisions:
- issue: בּוֹ में पुल्लिंग एकवचन प्रत्यय का संदर्भ
  choice: इसे सीमा लाँघने वाले अपराधी के लिए 'उसे' अनूदित किया गया है।
  alternative: इसे अधिक सामान्य रूप में उस प्राणी या वस्तु के लिए 'उसे/उसको' माना जा सकता है जो पर्वत छूने से निषिद्ध हो गई हो।
  rationale: निकटवर्ती प्रसंग उस मनुष्य या पशु की बात करता है जो सीमा पार करता है; उसे सीधे छुए बिना दूर से मृत्युदण्ड देने की कानूनी व्यवस्था इस संदर्भ के अनुकूल है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और संक्षिप्त कानूनी शैली रखी गई है। 'पत्थरवाह' बाइबलीय संदर्भ में परिचित और सटीक है; 'लम्बा नाद' सांस्कृतिक संकेत को सहज हिन्दी में व्यक्त करता है।
