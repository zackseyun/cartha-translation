base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/012.yaml
  text: And you shall set bounds for the people all around[a], saying, ‘Be careful not to go up on the mountain or touch its edge. Whoever touches the mountain shall surely be put to death.’
translation:
  language: hi
  text: तू लोगों के चारों ओर एक सीमा बाँध देना और कहना, ‘सावधान रहो कि तुम पहाड़ पर न चढ़ो और न उसके किनारे को छुओ। जो कोई पहाड़ को छुएगा, वह निश्चय ही मार डाला जाएगा।’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “निश्चय ही मर जाएगा।” इब्रानी में यह मृत्यु की निश्चितता पर बल देने वाली अभिव्यक्ति है। यहाँ निष्क्रिय क्रिया-रूप और अगली आयत में दूसरों द्वारा दण्ड दिए जाने के संदर्भ के कारण “निश्चय ही मार डाला जाएगा” अनुवाद किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִגְבַּלְתָּ
  choice: तुम ... सीमा निर्धारित कर देना
  rationale: גבל के हिफ़ील रूप का अर्थ किसी सीमा या हद को स्थापित करना है। यह अभिव्यक्ति मूसा को दिए गए एकवचन आदेश और प्रतिबंधित परिधि—दोनों को स्पष्ट रखती है।
- source_word: אֶת־הָעָם סָבִיב
  choice: लोगों के लिए चारों ओर
  rationale: यह वाक्यांश लोगों के चारों ओर बनाई जाने वाली परिधि को दर्शाता है। ‘चारों ओर’ सָבִיב के सर्वदिशात्मक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הִשָּׁמְרוּ לָכֶם
  choice: सावधान रहना
  rationale: שׁמר का निफ़ाल आज्ञार्थक और לָכֶם मिलकर स्वयं को चौकस रखने की कड़ी चेतावनी देते हैं। ‘सावधान रहना’ आधुनिक हिन्दी में स्वाभाविक है और चेतावनी का बल बनाए रखता है।
- source_word: עֲלוֹת בָּהָר
  choice: पहाड़ पर न चढ़ना
  rationale: עלה के साथ בָּהָר पहाड़ पर ऊपर जाने या चढ़ने को बताता है; निषेध का भाव पहले आए चेतावनी-सूचक मुहावरे से स्पष्ट होता है।
- source_word: וּנְגֹעַ בְּקָצֵהוּ
  choice: और न उसके छोर को छूना
  rationale: קָצֶה किसी वस्तु के छोर या किनारे को दर्शाता है। ‘छोर’ पहाड़ की निषिद्ध बाहरी सीमा का ठोस स्थानिक भाव बनाए रखता है।
- source_word: כָּל־הַנֹּגֵעַ בָּהָר
  choice: जो कोई पहाड़ को छुएगा
  rationale: यह रचना सामान्य और सर्वसमावेशी चेतावनी देती है; ‘जो कोई’ उसके प्रत्येक व्यक्ति पर लागू होने वाले भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: מוֹת יוּמָת
  choice: निश्चय ही मार डाला जाएगा
  rationale: क्रिया-मूल के infinitive absolute के साथ निष्क्रिय imperfect मृत्यु-दण्ड की निश्चितता पर बल देता है। ‘निश्चय ही’ बलाघात और ‘मार डाला जाएगा’ निष्क्रिय रूप को व्यक्त करते हैं; अगली आयत में दूसरों द्वारा दण्ड लागू किए जाने का संदर्भ भी इसी के अनुकूल है।
theological_decisions:
- issue: מוֹת יוּמָת में मृत्यु की निश्चितता बनाम दण्डस्वरूप वध
  choice: निश्चय ही मार डाला जाएगा
  alternative: निश्चय ही मर जाएगा
  rationale: इब्रानी रूप निष्क्रिय है और अगली आयत दण्ड को समुदाय द्वारा लागू किए जाने का संकेत देती है, इसलिए मुख्य पाठ में दण्डस्वरूप वध रखा गया है। फिर भी इब्रानी बलाघाती मृत्यु-सूत्र को केवल परिणामसूचक ‘मर जाएगा’ भी समझा जा सकता है; इस वास्तविक भाषिक विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और आदेशात्मक रखी गई है। मूसा के लिए एकवचन ‘तुम’ तथा लोगों के लिए बहुवचन चेतावनी का भेद सुरक्षित है। ‘सीमा निर्धारित कर देना’ प्रशासनिक स्पष्टता देता है, जबकि ‘छोर’ मूल के ठोस स्थानिक बिंब को बनाए रखता है।
