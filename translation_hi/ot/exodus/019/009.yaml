id: EXO.19.9
reference: Exodus 19:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה הִנֵּ֨ה אָנֹכִ֜י בָּ֣א אֵלֶי/ךָ֮ בְּ/עַ֣ב הֶֽ/עָנָן֒ בַּ/עֲב֞וּר יִשְׁמַ֤ע הָ/עָם֙ בְּ/דַבְּרִ֣/י עִמָּ֔/ךְ וְ/גַם בְּ/ךָ֖ יַאֲמִ֣ינוּ לְ/עוֹלָ֑ם וַ/יַּגֵּ֥ד מֹשֶׁ֛ה אֶת דִּבְרֵ֥י הָ/עָ֖ם אֶל יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/009.yaml
  text: And Yahweh said to Moses[a], “Behold, I am coming to you in a thick cloud, so that the people may hear when I speak with you, and may also believe in you forever.” Then Moses told Yahweh the words of the people.
translation:
  language: hi
  text: और यहवे ने मूसा से कहा, “देख, मैं घने बादल में तेरे पास आ रहा हूँ, ताकि जब मैं तुझसे बात करूँ तब लोग सुनें और सदा तुझ पर भी विश्वास करें[a]।” तब मूसा ने लोगों की बातें यहवे को बताईं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुझ पर भी भरोसा रखें,” अथवा “तेरी बात पर भी विश्वास करें।” इब्रानी वाक्यांश मूसा पर परमेश्वर के प्रमाणित प्रवक्ता के रूप में भरोसा रखने का भाव व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय आधुनिक हिन्दी में निकट लिप्यंतरण द्वारा रखा गया है।
- source_word: הִנֵּה
  choice: देख
  rationale: प्रत्यक्ष कथन में ध्यान आकर्षित करने वाले इब्रानी संकेतक की शक्ति को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: בָּא
  choice: आ रहा हूँ
  rationale: कृदन्त आसन्न और सजीव क्रिया व्यक्त करता है; हिन्दी का वर्तमान प्रगतिशील रूप इसे स्वाभाविक ढंग से दर्शाता है।
- source_word: בְּעַב הֶעָנָן
  choice: घने बादल में
  rationale: बादल के घनत्व का दृश्य बिंब संक्षिप्त और स्वाभाविक हिन्दी में सुरक्षित रहता है।
- source_word: בַּעֲבוּר
  choice: ताकि
  rationale: यहाँ पद आगे आने वाले वाक्य का प्रयोजन बताता है।
- source_word: בְּדַבְּרִי עִמָּךְ
  choice: जब मैं तुझसे बात करूँ
  rationale: पूर्वसर्गयुक्त क्रियारूप का कालवाचक भाव और परस्पर संवाद का अर्थ स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: וְגַם בְּךָ יַאֲמִינוּ
  choice: और सदा तुझ पर भी विश्वास करें
  rationale: אמן के साथ בְ किसी व्यक्ति पर भरोसा या उसकी विश्वसनीयता स्वीकार करने का भाव दे सकता है; यह अनुवाद इब्रानी संरचना को बनाए रखते हुए हिन्दी में स्वाभाविक है।
- source_word: לְעוֹלָם
  choice: सदा
  rationale: स्थायी और निरंतर अवधि को संक्षिप्त, प्रतिष्ठित हिन्दी में व्यक्त करता है।
- source_word: וַיַּגֵּד ... אֶת דִּבְרֵי הָעָם
  choice: तब मूसा ने लोगों की बातें ... बताईं
  rationale: कथानक की अगली क्रिया और लोगों के कथनों की सूचना देने का अर्थ सहज हिन्दी में व्यक्त होता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत नाम है; उसका लिप्यंतरण नाम को सुरक्षित रखता है और उसे किसी उपाधि से नहीं बदलता।
- issue: בְּךָ יַאֲמִינוּ में मूसा के प्रति विश्वास का स्वरूप
  choice: तुझ पर भी विश्वास करें
  alternative: तेरी बात पर भी विश्वास करें; तुझ पर भी भरोसा रखें
  rationale: मूल में בְ के साथ אמן मूसा की परमेश्वर-प्रमाणित विश्वसनीयता पर भरोसा दर्शाता है। मुख्य पाठ इब्रानी अभिव्यक्ति की व्यापकता रखता है; पादटिप्पणी सम्भव आशय स्पष्ट करती है, बिना इसे आराधनात्मक विश्वास मानने के।
- issue: לְעוֹלָם की कालगत शक्ति
  choice: सदा
  alternative: हमेशा; सर्वदा
  rationale: दीर्घस्थायी स्वीकृति का सीधा अर्थ रखा गया है; सन्दर्भ में इसकी दार्शनिक सीमा को अतिरिक्त रूप से निर्धारित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किन्तु सामान्य पाठक के लिए सहज। परमेश्वर से मूसा के प्रत्यक्ष संबोधन में एकवचन निकटवाची ‘तू’ के रूप (‘तेरे’, ‘तुझसे’, ‘तुझ पर’) रखे गए हैं, जो इब्रानी एकवचन को स्पष्ट करते हैं और हिन्दी बाइबलीय शैली में स्वाभाविक हैं।
