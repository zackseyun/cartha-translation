source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶל יְהוָ֔ה לֹא יוּכַ֣ל הָ/עָ֔ם לַ/עֲלֹ֖ת אֶל הַ֣ר סִינָ֑י כִּֽי אַתָּ֞ה הַעֵדֹ֤תָה בָּ֨/נוּ֙ לֵ/אמֹ֔ר הַגְבֵּ֥ל אֶת הָ/הָ֖ר וְ/קִדַּשְׁתּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/023.yaml
  text: And Moses said to Yahweh[a], “The people cannot go up to Mount Sinai, because you yourself warned us, saying[b], ‘Set bounds around the mountain and consecrate it.’”
translation:
  language: hi
  text: 'तब मूसा ने याहवे से कहा, “लोग सीनै पर्वत पर नहीं चढ़ सकते, क्योंकि आपने स्वयं हमें चेतावनी दी थी[a]: ‘पर्वत के चारों ओर सीमा निर्धारित करो और उसे पवित्र ठहराओ।’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हमें गंभीरतापूर्वक आदेश दिया था” अथवा “हमें साक्षी देकर चेताया था।” इब्रानी क्रिया औपचारिक चेतावनी, गंभीर आदेश, या साक्ष्य देने का भाव रख सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित नाम-रूप ‘यहोवा’ चतुरक्षरीय दिव्य नाम को उपाधि से बदलने के बजाय व्यक्तिगत नाम के रूप में प्रस्तुत करता है।
- source_word: לֹא יוּכַל הָעָם
  choice: लोग ... नहीं चढ़ सकते
  rationale: यहाँ יכל असमर्थता व्यक्त करता है; बहुवचन ‘सकते’ सामूहिक ‘लोग’ के साथ स्वाभाविक हिन्दी है।
- source_word: לַעֲלֹת אֶל הַר סִינָי
  choice: सीनै पर्वत पर ... चढ़
  rationale: עלה की ऊपर जाने की भौतिक दिशा को ‘चढ़ना’ स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: אַתָּה
  choice: तूने स्वयं
  rationale: अलग से आए सर्वनाम का बल ‘स्वयं’ द्वारा सुरक्षित रखा गया है; परमेश्वर को संबोधित एकवचन निकट रूप बाइबलीय हिन्दी के अनुरूप है।
- source_word: הַעֵדֹתָה בָּנוּ
  choice: हमें कड़ी चेतावनी देकर
  rationale: עוד के हिफ़ील रूप का प्रसंगानुकूल अर्थ औपचारिक और गंभीर चेतावनी देना है; ‘कड़ी’ उसकी गंभीरता बताता है।
- source_word: הַגְבֵּל אֶת הָהָר
  choice: पर्वत के चारों ओर सीमा बाँध
  rationale: גבל का प्रेरणार्थक आदेश सीमा निर्धारित करने को कहता है; ‘चारों ओर सीमा बाँध’ पहाड़ तक पहुँच रोकने का आशय सहज हिन्दी में देता है।
- source_word: וְקִדַּשְׁתּוֹ
  choice: और उसे पवित्र ठहरा
  rationale: קדשׁ का पिएल रूप किसी वस्तु को पवित्र प्रयोजन के लिए अलग ठहराने का भाव रखता है; ‘पवित्र ठहरा’ धार्मिक अर्थ को बनाए रखता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत दिव्य नाम है, इसलिए ‘प्रभु’ जैसी उपाधि के स्थान पर हिन्दी में परिचित नाम-रूप रखा गया है।
- issue: הַעֵדֹתָה בָּנוּ की विधिक/चेतावनी संबंधी शक्ति
  choice: कड़ी चेतावनी देकर
  alternative: हमें दृढ़तापूर्वक आदेश देकर / हमारे सामने साक्षी देकर
  rationale: सीनै की सीमा के प्रसंग में चेतावनी का अर्थ सर्वाधिक स्वाभाविक है, जबकि पादटिप्पणी क्रिया की औपचारिक साक्ष्य अथवा गंभीर आदेश वाली अर्थ-छाया सुरक्षित रखती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘सीनै पर्वत’, ‘सीमा बाँध’ और ‘पवित्र ठहरा’ मूल की ठोस तथा धार्मिक भाषा को बिना अनावश्यक तकनीकी शब्दावली के सुरक्षित रखते हैं।
