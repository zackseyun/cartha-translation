source:
  edition: WLC
  text: וְ/אַתֶּ֧ם תִּהְיוּ לִ֛/י מַמְלֶ֥כֶת כֹּהֲנִ֖ים וְ/ג֣וֹי קָד֑וֹשׁ אֵ֚לֶּה הַ/דְּבָרִ֔ים אֲשֶׁ֥ר תְּדַבֵּ֖ר אֶל בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/006.yaml
  text: And you shall be to me a kingdom of priests and a holy nation[b][a]. These are the words that you shall speak to the sons of Israel.
translation:
  language: hi
  text: और तुम मेरे लिए याजकों का राज्य और एक पवित्र राष्ट्र[a] ठहरोगे। ये वे वचन हैं जो तुम इस्राएल के पुत्रों[b] से कहोगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याजकीय राज्य।” इब्रानी पदबंध का अर्थ याजकों से बना राज्य अथवा याजकीय चरित्र वाला राज्य हो सकता है। तुलना करें 1 पतरस 2:9, जहाँ इससे संबंधित अभिव्यक्ति “राजकीय याजक-समुदाय” आती है।
    reason: lexical_alternative
  - marker: b
    text: “इस्राएल के पुत्र” इब्रानी में पूरे इस्राएली समुदाय के लिए प्रयुक्त अभिव्यक्ति है; इससे केवल पुरुष इस्राएली अभिप्रेत नहीं हैं।
    reason: cultural_note
lexical_decisions:
- source_word: תִּהְיוּ
  choice: ठहरोगे
  rationale: यहाँ Qal अपूर्ण रूप वाचा की घोषणा में भावी परिणाम व्यक्त करता है। ‘ठहरोगे’ गंभीर प्रतिज्ञात्मक स्वर को स्वाभाविक हिन्दी में रखता है।
- source_word: לִי
  choice: मेरे लिए
  rationale: לִי संबंध, समर्पण और संबद्धता दर्शाता है; ‘मेरे लिए’ मूल पूर्वसर्गीय अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: מַמְלֶכֶת כֹּהֲנִים
  choice: याजकों का राज्य
  rationale: समास-पद का सबसे सीधा अर्थ ऐसा राज्य है जो याजकों से बना या याजकीय स्वरूप वाला है। मुख्य पाठ में ‘राज्य’ और ‘याजक’ दोनों संज्ञाएँ सुरक्षित रखी गई हैं।
- source_word: גּוֹי קָדוֹשׁ
  choice: एक पवित्र राष्ट्र
  rationale: यह संज्ञा-विशेषण पदबंध का स्पष्ट और धर्मवैचारिक प्रतिध्वनि को बनाए रखने वाला आधुनिक हिन्दी अनुवाद है।
- source_word: אֵלֶּה הַדְּבָרִים
  choice: ये वे वचन हैं
  rationale: प्रत्यक्ष कथन के संदर्भ में דְּבָרִים का अर्थ ‘वचन’ स्वाभाविक है और आगे के ‘कहना’ के अनुरूप है।
- source_word: תְּדַבֵּר
  choice: कहना
  rationale: मूसा को संबोधित इस निर्देश को हिन्दी में ‘ये वे वचन हैं जो तुम ... से कहना’ स्वाभाविक, स्पष्ट और आदेशात्मक स्वर में व्यक्त करता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: यह मूल इब्रानी की पुत्र-संबंधी और व्याकरणतः पुल्लिंग अभिव्यक्ति को पारदर्शी ढंग से सुरक्षित रखता है; पादटिप्पणी इसके सामूहिक आशय को स्पष्ट करती है।
theological_decisions:
- issue: वाचा में इस्राएल की सामूहिक बुलाहट
  choice: याजकों का राज्य
  alternative: याजकीय राज्य
  rationale: इब्रानी पदबंध इस अर्थ के लिए खुला है कि यह याजकों से बना राज्य हो अथवा याजकीय चरित्र वाला राज्य। मुख्य पाठ अधिक रूप-संगत अनुवाद रखता है और पादटिप्पणी वास्तविक अस्पष्टता बताती है।
- issue: वाचा-समुदाय का लिंगसूचक नाम
  choice: इस्राएल के पुत्रों
  alternative: इस्राएलियों
  rationale: मुख्य पाठ मूल की स्पष्ट पुत्र-संबंधी अभिव्यक्ति को रखता है, जबकि पादटिप्पणी स्पष्ट करती है कि प्रसंग में पूरा इस्राएली समुदाय अभिप्रेत है, केवल पुरुष नहीं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘याजक’ और ‘वचन’ जैसे परिचित बाइबलीय शब्द धर्मवैचारिक प्रतिध्वनि बनाए रखते हैं। दोनों पादटिप्पणी-चिह्न संबंधित पदों के तुरंत बाद लगाए गए हैं।
