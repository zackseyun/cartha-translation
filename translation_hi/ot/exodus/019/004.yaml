  edition: WLC
  text: אַתֶּ֣ם רְאִיתֶ֔ם אֲשֶׁ֥ר עָשִׂ֖יתִי לְ/מִצְרָ֑יִם וָ/אֶשָּׂ֤א אֶתְ/כֶם֙ עַל כַּנְפֵ֣י נְשָׁרִ֔ים וָ/אָבִ֥א אֶתְ/כֶ֖ם אֵלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/004.yaml
  text: You yourselves have seen what I did to Egypt[c][b][a], and how I carried you on eagles’ wings and brought you to myself.
translation:
  language: hi
  text: तुमने स्वयं देखा है कि मैंने मिस्र के साथ क्या किया; मैं तुम्हें उकाबों के पंखों पर उठाकर अपने पास ले आया।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उकाब’ के लिए प्रयुक्त इब्रानी शब्द बड़े शिकारी पक्षियों को अधिक व्यापक रूप से भी सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘उकाबों के पंखों पर’ सुरक्षा और सामर्थ्य से किए गए उद्धार का सजीव रूपक है।
    reason: metaphor_clarification
lexical_decisions:
- source_word: אַתֶּם רְאִיתֶם
  choice: तुमने स्वयं देखा है
  rationale: स्वतंत्र सर्वनाम אַתֶּם संबोधन पर बल देता है; ‘स्वयं’ उस बल को व्यक्त करता है। पूर्ण क्रिया का वर्तमान प्रसंग से संबंध ‘देखा है’ द्वारा स्वाभाविक रूप से सामने आता है।
- source_word: אֲשֶׁר עָשִׂיתִי לְמִצְרָיִם
  choice: कि मैंने मिस्र के साथ क्या किया
  rationale: यहाँ לְ मिस्र को परमेश्वर के कार्य से प्रभावित पक्ष के रूप में दिखाता है। ‘मिस्र के साथ क्या किया’ आधुनिक हिन्दी में स्वाभाविक है और देश/राष्ट्र के सामूहिक अर्थ को बनाए रखता है।
- source_word: וָאֶשָּׂא אֶתְכֶם
  choice: मैं तुम्हें ... उठाकर
  rationale: נשא का मूल अर्थ उठाना या ढोना है। पंखों के रूपक के साथ ‘उठाकर’ सुरक्षापूर्ण और सामर्थी उद्धार की छवि को सहज हिन्दी में रखता है।
- source_word: עַל כַּנְפֵי נְשָׁרִים
  choice: उकाबों के पंखों पर
  rationale: נְשָׁרִים के लिए ‘उकाब’ पारंपरिक और संदर्भानुकूल विकल्प है; बहुवचन संबंध-वाक्यांश को औपचारिक रूप से सुरक्षित रखा गया है।
- source_word: וָאָבִא אֶתְכֶם אֵלָי
  choice: अपने पास ले आया
  rationale: אֵלָי का शाब्दिक अर्थ ‘मेरे पास’ है। हिन्दी में वक्ता परमेश्वर होने के कारण ‘अपने पास’ संबंधपरक दिशा को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के उद्धार का संबंधपरक लक्ष्य
  choice: अपने पास ले आया
  alternative: मेरे पास ले आया
  rationale: वाक्य निर्गमन को केवल मिस्र से छुटकारा नहीं, बल्कि परमेश्वर के पास लाए जाने के रूप में प्रस्तुत करता है। ‘अपने पास’ इस संबंधपरक बल को बनाए रखता है, पर वाचा-संबंध के बारे में ऐसा अतिरिक्त विवरण नहीं जोड़ता जो पद में प्रत्यक्षतः नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन बहुवचन ‘तुम’ में है, जो प्रसंग के सामूहिक इस्राएली श्रोताओं के लिए स्वाभाविक है। भाषा सरल किंतु गरिमापूर्ण रखी गई है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
