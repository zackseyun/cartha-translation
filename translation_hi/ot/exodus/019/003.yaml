base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/003.yaml
  text: And Moses went up to God[a], and Yahweh called to him from the mountain, saying, “Thus you shall say to the house of Jacob, and tell the sons of Israel:”
translation:
  language: hi
  text: 'और मूसा परमेश्वर के पास ऊपर चढ़ गया। याहवे ने पर्वत पर से उसे पुकारकर कहा, “याकूब के घराने से यह कहना और इस्राएल के पुत्रों[a] को बताना:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस्राएल की सन्तान” अथवा “इस्राएल के लोग।” हिब्रू में शाब्दिक रूप से “इस्राएल के पुत्रों” है; यह एक पुल्लिंग सामूहिक अभिव्यक्ति है।
    reason: शाब्दिक रूप और उसके सामूहिक अर्थ के वैकल्पिक अनुवाद बताने के लिए।
lexical_decisions:
- source_word: עָלָה
  choice: ऊपर चढ़ गया
  rationale: क्रिया ऊपर की ओर जाने को व्यक्त करती है; यह चयन स्थानगत अर्थ को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: הָאֱלֹהִים
  choice: परमेश्वर
  rationale: सप्रत्यय रूप सन्दर्भ में इस्राएल के परमेश्वर की ओर संकेत करता है; हिन्दी में ‘परमेश्वर’ स्वाभाविक निश्चित नाम-संज्ञा के रूप में प्रयुक्त होता है।
- source_word: וַיִּקְרָא אֵלָיו
  choice: उसे पुकारकर कहा
  rationale: קרא के साथ אֶל किसी की ओर पुकारने का भाव देता है; ‘पुकारकर कहा’ हिन्दी में अगले कथन से इसे सहज रूप से जोड़ता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: यह चतुरक्षरीय व्यक्तिगत ईश्वरीय नाम का हिन्दी लिप्यन्तरण है, किसी उपाधि का प्रतिस्थापन नहीं।
- source_word: מִן הָהָר
  choice: पर्वत पर से
  rationale: הַר यहाँ सीनै पर्वत को सूचित करता है; ‘पर से’ पुकार के स्रोत को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לֵאמֹר
  choice: कहा
  rationale: यह प्रत्यक्ष वचन का परिचय देता है; हिन्दी में ‘पुकारकर कहा’ इसके कार्य को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כֹּה תֹאמַר
  choice: ऐसा कहना
  rationale: यह औपचारिक सन्देश-सूत्र को संक्षिप्त और गरिमापूर्ण हिन्दी में सुरक्षित रखता है।
- source_word: לְבֵית יַעֲקֹב
  choice: याकूब के घराने से
  rationale: ‘घराना’ सामूहिक और वाचा-संबंधी अर्थ को बनाए रखते हुए आधुनिक हिन्दी में ‘घर’ से अधिक स्पष्ट है।
- source_word: וְתַגֵּיד
  choice: और ... को यह बताना
  rationale: हिफ़ील रूप ‘ज्ञात कराना/बताना’ व्यक्त करता है; यह ‘कहना’ के समानान्तर रहते हुए सहज हिन्दी देता है।
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: यह हिब्रू के पुल्लिंग सामूहिक पद और ‘याकूब के घराने’ के साथ उसकी समानान्तर संरचना को सुरक्षित रखता है; अन्य सामूहिक अर्थ पादटिप्पणी में दिए गए हैं।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा ‘प्रभु’
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है; ‘याहवे’ उसे उपाधि में बदले बिना प्रस्तुत करता है।
- issue: לִבְנֵי יִשְׂרָאֵל में पुल्लिंग सामूहिक अभिव्यक्ति
  choice: इस्राएल के पुत्रों
  alternative: इस्राएल की सन्तान / इस्राएल के लोग
  rationale: चुना हुआ रूप मूल की व्याकरणिक आकृति और समानान्तरता बनाए रखता है, जबकि उसका व्यापक सामूहिक आशय पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘ऐसा कहना’ और ‘यह बताना’ मूल समानान्तरता को स्वाभाविक हिन्दी में व्यक्त करते हैं। पादटिप्पणी-चिह्न उसी पद के बाद रखा गया है जिससे वह सम्बन्धित है।
