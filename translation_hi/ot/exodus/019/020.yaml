  text: וַ/יֵּ֧רֶד יְהוָ֛ה עַל הַ֥ר סִינַ֖י אֶל רֹ֣אשׁ הָ/הָ֑ר וַ/יִּקְרָ֨א יְהוָ֧ה לְ/מֹשֶׁ֛ה אֶל רֹ֥אשׁ הָ/הָ֖ר וַ/יַּ֥עַל מֹשֶֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/020.yaml
  text: And Yahweh came down on Mount Sinai[a], to the top of the mountain. Then Yahweh called Moses to the top of the mountain[b], and Moses went up.
translation:
  language: hi
  text: और यहोवा सीनै पर्वत पर—पर्वत की चोटी पर—उतरा। तब यहोवा ने मूसा को पर्वत की चोटी पर आने के लिए बुलाया, और मूसा ऊपर चढ़ गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: उतरा
  rationale: ירד का मूल अर्थ नीचे जाना या उतरना है। प्रसंग में परमेश्वर के पर्वत पर उतरने के लिए ‘उतरा’ स्वाभाविक और सीधा है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय प्रचलित हिन्दी रूप ‘यहोवा’ में रखा गया है।
- source_word: הַר סִינַי
  choice: सीनै पर्वत
  rationale: यह स्थान-नाम का मानक, संक्षिप्त और स्वाभाविक हिन्दी रूप है।
- source_word: אֶל רֹאשׁ הָהָר
  choice: पर्वत की चोटी पर
  rationale: רֹאשׁ का शाब्दिक अर्थ ‘सिर’ है, पर यहाँ स्थान-सूचक मुहावरे में पर्वत की चोटी अभिप्रेत है। ‘पर’ गंतव्य और स्थिति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיִּקְרָא
  choice: बुलाया
  rationale: קרא यहाँ किसी को अपने पास आने के लिए बुलाने के अर्थ में है; ‘बुलाया’ प्रत्यक्ष है और ‘आज्ञा देकर बुलाया’ जैसी अतिरिक्त व्याख्या नहीं जोड़ता।
- source_word: לְמֹשֶׁה
  choice: मूसा को
  rationale: व्यक्तिनाम का मानक हिन्दी रूप और इब्रानी संबंधसूचक לְ का प्रसंगानुकूल कर्म-चिह्न।
- source_word: וַיַּעַל
  choice: ऊपर चढ़ गया
  rationale: עלה ऊपर जाने या चढ़ने को दर्शाता है। पर्वत के प्रसंग में ‘ऊपर चढ़ गया’ स्वाभाविक है और पहले के ‘उतरा’ के साथ दिशात्मक विरोध बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम सीधे आया है, इसलिए उसे ‘प्रभु’ जैसी उपाधि से नहीं बदला गया। हिन्दी पाठकों में सुस्थापित लिप्यंतरण ‘यहोवा’ चुना गया; स्वरांकन की ऐतिहासिक अनिश्चितता के कारण ‘याहवे’ भी संभव है।
- issue: यहोवा का सीनै पर्वत पर उतरना
  choice: सीधे स्थानगत कथन के रूप में ‘सीनै पर्वत पर ... उतरा’
  alternative: उपस्थिति प्रकट की या महिमा उतरी जैसी व्याख्यात्मक भाषा
  rationale: मूल क्रिया उतरने का कथन करती है और उसके ढंग की व्याख्या नहीं करती। इसलिए मानवरूपी या प्राकट्य-संबंधी तनाव को बिना समाधान थोपे सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कथात्मक शैली। ‘चोटी’ सामान्य पाठक के लिए ‘शिखर’ से अधिक सहज है। मूल में ‘पर्वत की चोटी’ की पुनरावृत्ति को जानबूझकर बनाए रखा गया है।
