base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/021.yaml
  text: And Yahweh said to Moses[a], “Go down; warn the people, lest they break through to Yahweh to look[b], and many of them fall.”
translation:
  language: hi
  text: और याहवे ने मूसा से कहा, “नीचे उतर और लोगों को चेतावनी दे, कहीं ऐसा न हो कि वे याहवे को देखने[a] के लिए सीमा तोड़कर आगे बढ़ें और उनमें से बहुत-से गिर पड़ें[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “नज़र डालने के लिए।” इब्रानी क्रिया का अर्थ ‘देखना’ या ‘नज़र डालना’ हो सकता है; यहाँ आशय याहवे के प्रकट रूप को देखने का प्रयत्न करना है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “और उनमें से बहुत-से गिरें।” इस प्रसंग में ‘गिरना’ मृत्यु का संकेत दे सकता है, पर इब्रानी पाठ इसे अधिक स्पष्ट रूप से नहीं कहता।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय उसके प्रचलित विद्वत्तापूर्ण उच्चारण के निकट देवनागरी लिप्यंतरण में रखा गया है।
- source_word: רֵד
  choice: नीचे उतर
  rationale: आज्ञार्थक क्रिया की दिशात्मकता को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: הָעֵד
  choice: चेतावनी दे
  rationale: इस प्रसंग में हिफ़ील रूप लोगों को निषिद्ध सीमा पार न करने की गंभीर चेतावनी देने का अर्थ रखता है।
- source_word: יֶהֶרְסוּ
  choice: सीमा तोड़कर आगे बढ़ें
  rationale: क्रिया यहाँ पवित्र पर्वत के चारों ओर निर्धारित रोक को तोड़कर भीतर बढ़ने का भाव देती है; ‘सीमा’ प्रसंग से स्पष्ट निहित वस्तु को हिन्दी में सहज बनाती है।
- source_word: לִרְאוֹת
  choice: देखने
  rationale: उद्देश्यसूचक क्रिया को सामान्य और व्यापक हिन्दी शब्द से व्यक्त किया गया है, जो ‘देखना’ और ‘नज़र डालना’ की स्रोतगत अर्थ-सीमा को अनावश्यक रूप से संकुचित नहीं करता।
- source_word: וְנָפַל מִמֶּנּוּ רָב
  choice: और उनमें से बहुत-से गिर पड़ें
  rationale: ‘गिरना’ स्रोत की अप्रत्यक्ष अभिव्यक्ति को बनाए रखता है; प्रसंग में मृत्यु संभव है, पर उसे मुख्य पाठ में स्पष्ट करके नहीं जोड़ा गया।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसे उपाधि में बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: ‘गिर पड़ें’ का आशय
  choice: मूल की अप्रत्यक्ष अभिव्यक्ति बनाए रखना
  alternative: मारे जाएँ / मर पड़ें
  rationale: न्याय के इस प्रसंग में मृत्यु निहित हो सकती है, फिर भी इब्रानी पाठ सामान्य क्रिया ‘गिरना’ का प्रयोग करता है; इसलिए अर्थ को अधिक स्पष्ट करके धार्मिक तनाव समाप्त नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। मूसा को संबोधित एकवचन आज्ञार्थक रूप ‘उतर’ और ‘दे’ स्रोत की प्रत्यक्षता को बनाए रखते हैं।
