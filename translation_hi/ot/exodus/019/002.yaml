  text: וַ/יִּסְע֣וּ מֵ/רְפִידִ֗ים וַ/יָּבֹ֨אוּ֙ מִדְבַּ֣ר סִינַ֔י וַֽ/יַּחֲנ֖וּ בַּ/מִּדְבָּ֑ר וַ/יִּֽחַן שָׁ֥ם יִשְׂרָאֵ֖ל נֶ֥גֶד הָ/הָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/002.yaml
  text: They set out from Rephidim and came to the wilderness of Sinai[a], and they camped in the wilderness. There Israel camped before the mountain.
translation:
  language: hi
  text: वे रपीदीम से चलकर सीनै के निर्जन प्रदेश में आए और वहीं निर्जन प्रदेश में डेरा डाला। वहाँ इस्राएल ने पहाड़ के सामने[a] डेरा डाला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पहाड़ के सम्मुख।’ इब्रानी संबंधबोधक शब्द किसी वस्तु के सामने या उसकी ओर मुँह किए हुए स्थान को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: वे ... से चलकर
  rationale: यात्रा-वृत्तांत में נסע का अर्थ पड़ाव छोड़कर आगे बढ़ना है; ‘चलकर’ आधुनिक हिन्दी में गति और प्रस्थान दोनों को सहजता से व्यक्त करता है।
- source_word: מֵרְפִידִים
  choice: रपीदीम से
  rationale: स्थान-नाम का देवनागरी लिप्यंतरण किया गया है और उपसर्ग מ को ‘से’ से व्यक्त किया गया है।
- source_word: וַיָּבֹאוּ
  choice: आए
  rationale: בוא के व्यापक अर्थ ‘आना/पहुँचना’ में से ‘आए’ गंतव्य के साथ स्वाभाविक है और इब्रानी कथात्मक क्रम बनाए रखता है।
- source_word: מִדְבַּר סִינַי
  choice: सीनै का निर्जन प्रदेश
  rationale: מִדְבָּר केवल रेतीले रेगिस्तान तक सीमित नहीं, बल्कि विरल आबादी वाले वन्य/निर्जन भूभाग को दर्शाता है; इसलिए ‘निर्जन प्रदेश’ अर्थ को अनावश्यक रूप से संकीर्ण नहीं करता।
- source_word: וַיַּחֲנוּ
  choice: डेरा डाला
  rationale: חנה के लिए ‘डेरा डालना’ सामान्य, वर्तमान हिन्दी में स्वाभाविक है और अस्थायी पड़ाव का भाव स्पष्ट करता है।
- source_word: בַּמִּדְבָּר
  choice: वहीं निर्जन प्रदेश में
  rationale: मूल में מִדְבָּר की पुनरावृत्ति को बनाए रखा गया है; ‘वहीं’ हिन्दी में कथन को सहज बनाते हुए उसी स्थान की ओर संकेत करता है।
- source_word: וַיִּחַן שָׁם יִשְׂרָאֵל
  choice: वहाँ इस्राएल ने ... डेरा डाला
  rationale: एकवचन क्रिया के साथ יִשְׂרָאֵל को सामूहिक राष्ट्र के रूप में रखा गया है और שָׁם को ‘वहाँ’ से स्पष्ट किया गया है।
- source_word: נֶגֶד הָהָר
  choice: पहाड़ के सामने
  rationale: נֶגֶד सामने, सम्मुख या दूसरी ओर होने की स्थानिक धारणा देता है; ‘सामने’ सटीक और सामान्य हिन्दी है, जबकि अधिक विशिष्ट विकल्प पाद-टिप्पणी में दिया गया है।
