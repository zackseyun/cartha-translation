  rationale: बहुवचन कृदन्त चौखटों की सीधी, खड़ी अवस्था बताता है। हिन्दी में ‘खड़े चौखटे’ संक्षेप में उसी स्थापत्य अभिविन्यास को व्यक्त करता है।
