  rationale: यहाँ ऐसे संरचनात्मक डंडे अभिप्रेत हैं जो चौखटों को साथ बाँधते थे; मूल में स्पष्ट रूप से 'आड़े' न होने के कारण अतिरिक्त विशिष्टता नहीं जोड़ी गई।
- source_word: עֲצֵי שִׁטִּים
  choice: बबूल की लकड़ी
  rationale: शिट्टीम/अकेशिया कुल की लकड़ी के लिए सामान्य आधुनिक हिंदी में 'बबूल की लकड़ी' सहज और परिचित है।
- source_word: חֲמִשָּׁה
  choice: पाँच
  rationale: डंडों की संख्या का सीधा अनुवाद।
- source_word: לְקַרְשֵׁי
  choice: चौखटों के लिए
  rationale: कֶרֶשׁ निवासस्थान के खड़े संरचनात्मक अंगों को दर्शाता है; 'चौखटे' उनके स्थापत्य कार्य को व्यक्त करता है, जबकि 'तख्ते' भी संभव है।
- source_word: צֶלַע
  choice: ओर
  rationale: इस प्रसंग में शब्द संरचना के पार्श्व या एक तरफ को दर्शाता है, न कि शाब्दिक पसली को।
- source_word: הַמִּשְׁכָּן
  choice: निवासस्थान
  rationale: מִשְׁכָּן का मूल और प्रसंगानुकूल अर्थ परमेश्वर का पवित्र निवास है; यह हिंदी में स्पष्ट तथा गरिमापूर्ण है।
- source_word: הָאֶחָד
  choice: एक
  rationale: यह जोड़ी की एक निश्चित ओर को इंगित करता है और अगले पद में दूसरी ओर के उल्लेख की भूमिका बनाता है।
