  yaml_path: translation/ot/exodus/026/036.yaml
  text: You shall make a screen for the entrance of the tent[a], of blue and purple and scarlet yarn, and fine twisted linen, the work of an embroiderer.
translation:
  language: hi
  text: तुम तंबू के प्रवेश-द्वार के लिए नीले, बैंगनी और किरमिजी सूत तथा महीन बटे हुए सन के कपड़े से एक परदा[a] बनाओ; उस पर कशीदाकार का काम हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा “ओट” या “प्रवेश को ढकने वाला परदा”; यहाँ यह तंबू के भीतर वाले परदे से भिन्न है, जिसका वर्णन इसी अध्याय में किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מָסָךְ
  choice: परदा
  rationale: यह शब्द प्रवेश को ढकने वाले लटकते वस्त्र या विभाजक को दर्शाता है। आधुनिक हिन्दी में ‘परदा’ इसका सबसे सहज और स्पष्ट अनुवाद है; पादटिप्पणी इसे अध्याय के भीतर वाले परदे से अलग पहचानने में सहायता करती है।
- source_word: לְפֶתַח הָאֹהֶל
  choice: तंबू के प्रवेश-द्वार के लिए
  rationale: פֶתַח प्रवेश या खुलने की जगह है और אֹהֶל तंबू है। यह अनुवाद स्थान और प्रयोजन दोनों को स्वाभाविक हिन्दी में व्यक्त करता है, बिना यहाँ अधिक व्याख्यात्मक ‘निवास-स्थान’ जोड़ने के।
- source_word: תְּכֵלֶת
  choice: नीले ... रंग का सूत
  rationale: यह प्रतिष्ठित नीले अथवा नील-बैंगनी रंग की रँगी सामग्री को दर्शाता है। सूची के वस्त्र-संदर्भ में ‘सूत’ को रंगों के साथ सामूहिक रूप से व्यक्त किया गया है।
- source_word: אַרְגָּמָן
  choice: बैंगनी ... रंग का सूत
  rationale: यह बैंगनी रंग की रँगी हुई वस्त्र-सामग्री को दर्शाता है; ‘बैंगनी’ प्रचलित और पर्याप्त रूप से सटीक हिन्दी है।
- source_word: תוֹלַעַת שָׁנִי
  choice: लाल रंग का सूत
  rationale: यह संयुक्त पद इस प्रसंग में लाल/किरमिजी रँगी वस्त्र-सामग्री का मुहावरेदार संकेत है, न कि कीड़े का शाब्दिक उल्लेख। ‘लाल रंग का सूत’ साधारण पाठक के लिए स्पष्ट है।
- source_word: שֵׁשׁ מָשְׁזָר
  choice: बारीक बटी हुई मलमल
  rationale: שֵׁשׁ उत्तम महीन सन-वस्त्र को और מָשְׁזָר बटे हुए धागे को दर्शाता है। ‘बारीक बटी हुई मलमल’ हिन्दी बाइबलीय वस्त्र-शब्दावली में स्वाभाविक रहते हुए दोनों पहलुओं को सुरक्षित रखती है।
- source_word: מַעֲשֵׂה רֹקֵם
  choice: कढ़ाई करनेवाले कारीगर का काम
  rationale: यह सजावटी वस्त्र-कला और उसे करने वाले कुशल कारीगर दोनों पर बल देता है; इसीलिए केवल ‘कढ़ाईदार’ की अपेक्षा कर्ता-केंद्रित रचना रखी गई है।
- source_word: וְעָשִׂיתָ
  choice: तुम ... बनाना
  rationale: निर्देशों की इस शृंखला में वाव सहित पूर्ण क्रिया आदेशात्मक बल रखती है। ‘तुम ... बनाना’ आधुनिक हिन्दी में स्पष्ट निर्देशात्मक शैली देता है।
