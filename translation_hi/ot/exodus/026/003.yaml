lexical_decisions:
- source_word: יְרִיעֹת
  choice: परदे
  rationale: मिलापवाले तंबू के निर्माण के संदर्भ में यह शब्द बड़े कपड़े के परदों को दर्शाता है; ‘परदे’ आधुनिक हिन्दी में स्वाभाविक और वास्तु-संदर्भ के अनुकूल है।
- source_word: תִּהְיֶיןָ חֹבְרֹת
  choice: जुड़े हों
  rationale: היה के निर्देशात्मक अपूर्ण रूप और חבר के स्त्रीलिंग बहुवचन कृदंत को मिलाकर यह अनुवाद अपेक्षित निर्माण-व्यवस्था और जुड़े रहने की अवस्था, दोनों को संक्षेप में व्यक्त करता है।
- source_word: אִשָּׁה אֶל אֲחֹתָהּ
  choice: एक-दूसरे से
  rationale: शाब्दिक रूप ‘एक स्त्री अपनी बहन से’ निर्जीव स्त्रीलिंग वस्तुओं के पारस्परिक संबंध का इब्रानी मुहावरा है; हिन्दी में ‘एक-दूसरे से’ उसी अर्थ को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: חֲמֵשׁ ... וְחָמֵשׁ
  choice: पाँच ... और पाँच
  rationale: यह मूल पाठ की समानांतर रचना को बनाए रखते हुए दस परदों के दो समूहों को स्पष्ट करता है और कोई अतिरिक्त शब्द नहीं जोड़ता।
