base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/005.yaml
  text: You shall make fifty loops on the one curtain[a], and you shall make fifty loops on the edge of the curtain that is in the second set; the loops shall be opposite one another.
translation:
  language: hi
  text: तुम एक परदे पर पचास फंदे बनाओ, और उस परदे के किनारे पर भी पचास फंदे बनाओ जो दूसरे जुड़े हुए समूह में है; फंदे एक-दूसरे के आमने-सामने हों।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अक्षरशः, “फंदे—एक स्त्री अपनी बहन की ओर”; यह इब्रानी मुहावरा बताता है कि फंदे अपने-अपने समकक्ष फंदों के ठीक सामने और सीध में हों।
    reason: lexical_alternative
lexical_decisions:
- source_word: לֻלָאֹת
  choice: फंदे
  rationale: यह शब्द परदों को जोड़ने के लिए बनी छल्लेनुमा कपड़े की लगनियों को दर्शाता है। ‘फंदे’ आधुनिक हिन्दी में स्वाभाविक है और अगले पद की धातु की अंकुड़ियों से इन्हें अलग रखता है।
- source_word: יְרִיעָה
  choice: परदा
  rationale: मिलापवाले तंबू के संदर्भ में यह बड़े कपड़े के परदे को दर्शाता है; ‘परदा’ स्पष्ट, प्रचलित और प्रसंगानुकूल है।
- source_word: הָאֶחָת
  choice: एक
  rationale: इब्रानी में अक्षरशः ‘एक’ है; ‘पहला’ कहने से ऐसा क्रम जुड़ सकता है जो यहाँ स्पष्ट नहीं है।
- source_word: קְצֵה
  choice: किनारा
  rationale: सिलाई और जोड़ने के प्रसंग में यह परदे की बाहरी सीमा को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מַחְבֶּרֶת
  choice: जोड़ा
  rationale: आसपास के पदों में पाँच-पाँच परदों को जोड़कर बने समूह का संकेत है। ‘जोड़ा’ यहाँ जुड़े हुए समूह का सुबोध हिन्दी रूप है।
- source_word: הַשֵּׁנִית
  choice: दूसरा
  rationale: यह परदों के दूसरे जुड़े हुए समूह की सीधी पहचान कराता है।
- source_word: מַקְבִּילֹת
  choice: आमने-सामने
  rationale: यह फंदों के परस्पर अनुरूप स्थान और सीध को व्यक्त करता है; हिन्दी में स्थानिक अर्थ स्पष्ट रहता है।
- source_word: אִשָּׁה אֶל אֲחֹתָהּ
  choice: एक-दूसरे के
  rationale: अक्षरशः ‘एक स्त्री अपनी बहन की ओर’ एक इब्रानी मुहावरा है, जो समकक्ष वस्तुओं के पारस्परिक मेल को दर्शाता है। मुख्य पाठ में स्वाभाविक अर्थ रखा गया और शाब्दिक रूप पादटिप्पणी में दिया गया है।
