  register: आधुनिक मानक हिन्दी का निर्देशात्मक और गरिमापूर्ण रूप रखा गया है। निर्गमन 26 के निर्माण-निर्देशों के अनुरूप ‘बनाना’ और ‘हों’ का प्रयोग किया गया है; तकनीकी शब्दावली को साधारण पाठक के लिए सुबोध रखा गया है।
