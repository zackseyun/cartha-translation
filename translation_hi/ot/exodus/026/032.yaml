translation_notes:
  register: आधुनिक मानक हिंदी में एकवचन संबोधन ‘तुम’ रखा गया है। शैली निर्देशात्मक, गरिमापूर्ण और सामान्य पाठक के लिए सहज है। हिब्रू के संक्षिप्त नाममात्र वाक्य को स्पष्ट हिंदी के लिए ‘हों’ और ‘टिके हों’ से पूरा किया गया है।
