  yaml_path: translation/ot/exodus/026/032.yaml
  text: And you shall hang it on four pillars of acacia wood overlaid with gold[a], their hooks being of gold, on four silver bases.
translation:
  language: hi
  text: और तुम उसे सोने से मढ़े हुए बबूल की लकड़ी के चार खंभों पर लटकाओ। उनके हुक सोने के हों, और खंभे चाँदी के चार आधारों[a] पर हों।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “चाँदी की चार चौकियाँ।”
    reason: אֲדָנִים का अर्थ सहारा देने वाले आधार या चौकियाँ हो सकता है; कुछ संदर्भों में ऐसे आधारों में खंभे बैठाए जाते थे।
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: लटकाना
  rationale: נתן का मूल अर्थ ‘रखना/लगाना’ है, पर पिछले पद के परदे और खंभों के संदर्भ में उसे खंभों पर लटकाना ही अभिप्रेत है; हिंदी में यह क्रिया स्वाभाविक और संदर्भानुकूल है।
- source_word: אֹתָהּ
  choice: उसे
  rationale: स्त्रीलिंग एकवचन कर्म-सर्वनाम पिछले पद में आए परदे की ओर संकेत करता है।
- source_word: עַל אַרְבָּעָה עַמּוּדֵי
  choice: चार खंभों पर
  rationale: עַל स्थान-संबंधी ‘पर’ और עַמּוּדִים खड़े सहारों, अर्थात खंभों, को दर्शाता है।
- source_word: שִׁטִּים
  choice: बबूल की लकड़ी
  rationale: यह शिट्टीम/अकेशिया जाति की इमारती लकड़ी है; प्रचलित और सरल हिंदी में ‘बबूल की लकड़ी’ सामग्री को स्पष्ट करता है।
- source_word: מְצֻפִּים זָהָב
  choice: सोने से मढ़े हुए
  rationale: צפה का कर्मवाच्य रूप सतह पर सोने की परत चढ़ाए जाने को व्यक्त करता है; ‘मढ़े हुए’ हिंदी में सटीक और परिचित है।
- source_word: וָוֵיהֶם
  choice: उनके काँटे
  rationale: וָוִים यहाँ परदा टाँगने के लिए खंभों पर लगे हुकनुमा उपकरण हैं; ‘काँटे’ सहज हिंदी स्थापत्य-शब्द है।
- source_word: עַל אַרְבָּעָה אַדְנֵי כָסֶף
  choice: चाँदी के चार आधारों पर टिके हों
  rationale: אֲדָנִים वे आधार या खाँचेदार पाये हैं जिनमें खंभे टिकते हैं। ‘आधार’ सामान्य पाठक के लिए स्पष्ट है, और ‘टिके हों’ संबंध को स्वाभाविक हिंदी में व्यक्त करता है।
