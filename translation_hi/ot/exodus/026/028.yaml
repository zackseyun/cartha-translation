lexical_decisions:
- source_word: הַבְּרִיחַ
  choice: बेंड़ा
  rationale: मिलापवाले तम्बू की बनावट में यह वह क्षैतिज संरचनात्मक डंडा है जो खड़ी चौखटों को बाँधे रखता है; हिंदी स्थापत्य-संदर्भ में ‘बेंड़ा’ इस कार्य को संक्षेप में व्यक्त करता है।
- source_word: הַתִּיכֹן
  choice: बीच का
  rationale: यह विशेषण अन्य बेंड़ों के बीच इसकी स्थिति बताता है; ‘बीच का’ स्वाभाविक और स्पष्ट हिंदी है।
- source_word: בְּתוֹךְ
  choice: के भीतर
  rationale: यह चौखटों के बीच या आंतरिक भाग में स्थिति दर्शाता है, पर यांत्रिक रूप से छेदों में से गुजरने की बात अनिवार्य नहीं करता।
- source_word: הַקְּרָשִׁים
  choice: चौखटों
  rationale: यहाँ शब्द तम्बू के खड़े संरचनात्मक अवयवों को सूचित करता है; ‘चौखटें’ साधारण सपाट तख्तों की अपेक्षा उनकी संरचनात्मक भूमिका बेहतर व्यक्त करता है।
- source_word: מַבְרִחַ
  choice: फैला रहेगा
  rationale: हिफ़ील कृदंत यहाँ बेंड़े के पूरी लंबाई में विस्तृत होने का वर्णन करता है; ‘फैला रहेगा’ छेदों में से गुजरने का अनावश्यक विवरण जोड़े बिना स्थायी विस्तार दर्शाता है।
- source_word: מִן הַקָּצֶה אֶל הַקָּצֶה
  choice: एक सिरे से दूसरे सिरे तक
  rationale: यह मुहावरा पूरी लंबाई में विस्तार बताता है और आधुनिक हिंदी में सहज है।
