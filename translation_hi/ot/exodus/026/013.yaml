  text: And the extra cubit on this side and the extra cubit on that side[a], from the surplus in the length of the tent curtains, shall hang over the sides of the tabernacle on this side and on that side[b], to cover it.
translation:
  language: hi
  text: और तंबू के परदों की लंबाई में बचा हुआ भाग—इस ओर एक हाथ और उस ओर एक हाथ[a]—निवास के इस ओर और उस ओर के किनारों पर लटका रहेगा, उसे ढकने के लिए।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “वह हाथ इस ओर और वह हाथ उस ओर”; आशय है कि प्रत्येक ओर एक-एक हाथ अतिरिक्त कपड़ा होगा।'
    reason: lexical_alternative
  - marker: b
    text: “निवास” इब्रानी मिश्कान का अनुवाद है—तंबू के आवरण के नीचे की पवित्र निवास-संरचना।
    reason: cultural_note
lexical_decisions:
- source_word: הָאַמָּה
  choice: एक हाथ
  rationale: אַמָּה प्राचीन लंबाई की मानक इकाई है। हिंदी बाइबलीय प्रयोग में ‘हाथ’ सहज है; संख्या संदर्भ के अनुसार स्पष्ट की गई है।
- source_word: מִזֶּה ... מִזֶּה
  choice: इस ओर ... उस ओर
  rationale: दो विपरीत ओरों का संकेत करने वाली इब्रानी पुनरुक्ति को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: בָּעֹדֵף
  choice: जो भाग बचा रहेगा
  rationale: यह शब्द परदों की लंबाई में बचे हुए अतिरिक्त अंश को दर्शाता है; क्रियात्मक हिंदी मूल अर्थ को स्पष्ट रखती है।
- source_word: אֹרֶךְ
  choice: लंबाई
  rationale: निर्माण-संदर्भ में स्थानिक अर्थ का सीधा और स्वाभाविक अनुवाद।
- source_word: יְרִיעֹת הָאֹהֶל
  choice: मिलापवाले तंबू के परदे
  rationale: יְרִיעֹת कपड़े के परदों/पटों को और הָאֹהֶל तंबू को सूचित करता है। ‘मिलापवाला तंबू’ संदर्भगत पवित्र तंबू को सामान्य हिंदी पाठक के लिए पहचानने योग्य बनाता है।
- source_word: יִהְיֶה סָרוּחַ
  choice: लटका रहेगा
  rationale: अतिरिक्त कपड़े के किनारों से नीचे लटकने की भौतिक छवि को सहज हिंदी में व्यक्त करता है।
- source_word: צִדֵּי הַמִּשְׁכָּן
  choice: निवास के दोनों किनारों
  rationale: מִשְׁכָּן का मूल अर्थ ‘निवास’ है और बहुवचन צִדֵּי यहाँ दोनों पार्श्वों को सूचित करता है।
- source_word: לְכַסֹּתוֹ
  choice: ताकि उसे ढक सके
  rationale: उद्देश्यवाचक infinitive को स्वाभाविक हिंदी में व्यक्त करता है; सर्वनाम का संदर्भ निवास है।
theological_decisions:
- issue: אֹהֶל और מִשְׁכָּן के अलग स्थापत्य पद
  choice: ‘मिलापवाला तंबू’ और ‘निवास’ को अलग रखा गया
  alternative: दोनों के लिए ‘तंबू’ या מִשְׁכָּן के लिए ‘पवित्र तंबू’
  rationale: पद में बाहरी तंबू/आवरण और उसके नीचे की निवास-संरचना के बीच मूल इब्रानी भेद है; उसे मिटाना स्थापत्य और धर्मवैचारिक तनाव को अनावश्यक रूप से समतल कर देता।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली। ‘एक हाथ’ पारंपरिक माप-इकाई के रूप में रखा गया है। वाक्य को हिंदी की स्वाभाविक सूचना-क्रम व्यवस्था में ढाला गया, जबकि ‘इस ओर ... उस ओर’ की मूल पुनरुक्ति और אֹהֶל/מִשְׁכָּן का भेद सुरक्षित रखा गया है।
