base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/019.yaml
  text: 'And you shall make forty silver bases under the twenty frames: two bases under one frame for its two tenons[b][a], and two bases under the next frame for its two tenons.'
translation:
  language: hi
  text: 'और तुम बीस खड़े ढाँचों[b] के नीचे चाँदी के चालीस आधार[a] बनाओ: हर एक ढाँचे के नीचे उसके दोनों जोड़ने वाले उभारों के लिए दो-दो आधार।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘चाँदी के खाँचे’; इब्रानी शब्द तंबू की बनावट में ऐसा आधार भी दर्शा सकता है जिसमें ढाँचे का उभरा हुआ भाग बैठता था।
    reason: lexical_alternative
  - marker: b
    text: परंपरागत रूप से ‘तख्तों’; इब्रानी शब्द संभवतः तंबू के सीधे खड़े संरचनात्मक अंगों को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַדְנֵי כֶסֶף
  choice: चाँदी के आधार
  rationale: मिलापवाले तंबू की रचना में אֶדֶן भार सँभालनेवाले आधार अथवा खाँचे जैसे आधार को दर्शाता है। ‘आधार’ आधुनिक हिन्दी में स्पष्ट है; ‘खाँचे’ को पादटिप्पणी में रखा गया है।
- source_word: תַּעֲשֶׂה
  choice: तुम ... बनाना
  rationale: निर्देशात्मक प्रसंग में यह क्रिया आज्ञा का भाव रखती है। ‘तुम ... बनाना’ स्वाभाविक हिन्दी में उस निर्देशात्मक बल को बनाए रखता है।
- source_word: תַּחַת
  choice: के नीचे
  rationale: यह संरचनात्मक वस्तुओं के नीचे आधारों की स्थिति को सीधे व्यक्त करता है।
- source_word: הַקָּרֶשׁ / הַקֶּרֶשׁ
  choice: खड़ा ढाँचा
  rationale: קֶרֶשׁ यहाँ तंबू के सीधे खड़े संरचनात्मक अंग को दर्शाता है। ‘खड़ा ढाँचा’ उसके कार्य को ‘तख्ता’ से अधिक स्पष्ट करता है, जबकि पारंपरिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: שְׁנֵי אֲדָנִים
  choice: दो आधार
  rationale: हर संरचनात्मक अंग के नीचे दो सहायक आधार होने की बात है; यह आरंभिक पदावली से संगति रखता है।
- source_word: לִשְׁתֵּי יְדֹתָיו
  choice: उसके दोनों जोड़नेवाले उभारों के लिए
  rationale: יָדוֹת का शाब्दिक अर्थ ‘हाथ’ है, पर यहाँ यह ढाँचे से निकले उन दो भागों का स्थापत्य शब्द है जो आधारों में बैठते हैं। ‘जोड़नेवाले उभार’ सामान्य पाठक के लिए तकनीकी अर्थ स्पष्ट करता है।
- source_word: הָאֶחָד ... הָאֶחָד
  choice: एक ढाँचे ... दूसरे ढाँचे
  rationale: इब्रानी में दोहराया गया ‘एक’ वितरणात्मक है। हिन्दी में ‘एक ... दूसरे’ प्रत्येक अगले ढाँचे के लिए यही व्यवस्था स्वाभाविक रूप से व्यक्त करता है।
