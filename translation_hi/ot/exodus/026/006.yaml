translation:
  language: hi
  text: और सोने की पचास कड़ियाँ बनाओ, और कड़ियों से परदों को एक-दूसरे से[क] जोड़ो, ताकि तंबू एक हो जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: 'शाब्दिक: “एक स्त्री को उसकी बहन से।” यह इब्रानी मुहावरा वस्तुओं के परस्पर अनुरूप जुड़ने को व्यक्त करता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: और तुम ... बनाना
  rationale: निर्देशों के क्रम में यह क्रिया आज्ञार्थक भाव रखती है; आधुनिक हिन्दी में ‘तुम ... बनाना’ स्पष्ट और स्वाभाविक निर्देश है।
- source_word: קַרְסֵי זָהָב
  choice: सोने के अंकुड़े
  rationale: קֶרֶס परदों को जोड़ने वाला उपकरण है। ‘अंकुड़े’ उसका आकार अनावश्यक रूप से निश्चित किए बिना प्रचलित तंबू-निर्माण शब्दावली से मेल खाता है।
- source_word: וְחִבַּרְתָּ
  choice: जोड़ना
  rationale: חבר का मूल अर्थ जोड़ना या मिलाना है; यहाँ परदों को जोड़ने की निर्माण-क्रिया अभिप्रेत है।
- source_word: הַיְרִיעֹת
  choice: परदों
  rationale: יְרִיעָה यहाँ पवित्र तंबू के कपड़े के बड़े पटों को दर्शाता है; ‘परदे’ सामान्य पाठक के लिए सहज और संदर्भानुकूल है।
- source_word: אִשָּׁה אֶל אֲחֹתָהּ
  choice: एक-दूसरे से
  rationale: शाब्दिक रूप ‘एक स्त्री अपनी बहन से’ निर्जीव वस्तुओं के परस्पर अनुरूप जुड़ने का इब्रानी मुहावरा है; हिन्दी में ‘एक-दूसरे से’ उसका अर्थ स्वाभाविक रूप से व्यक्त करता है।
- source_word: בַּקְּרָסִים
  choice: उन अंकुड़ों से
  rationale: ב यहाँ साधन सूचित करता है; ‘से’ हिन्दी में उपकरण का स्वाभाविक चिह्न है।
- source_word: וְהָיָה הַמִּשְׁכָּן אֶחָד
  choice: ताकि मिलापवाला तंबू एक हो जाए
  rationale: यह जोड़ने के परिणाम को व्यक्त करता है। ‘मिलापवाला तंबू’ निर्गमन के पवित्र निवास के तकनीकी संदर्भ को बनाए रखता है, और ‘एक हो जाए’ संयुक्त इकाई बनने का भाव देता है।
theological_decisions:
- issue: הַמִּשְׁכָּן का अनुवाद
  choice: मिलापवाला तंबू
  alternative: निवास; पवित्र तंबू
  rationale: यहाँ शब्द साधारण निवास नहीं, इस्राएल के बीच परमेश्वर के पवित्र तंबू के लिए तकनीकी पद है। हिन्दी बाइबल-परंपरा में ‘मिलापवाला तंबू’ पहचाना जाता है, यद्यपि मूल शब्द स्वयं केवल ‘निवास’ के अर्थ से बना है।
translation_notes:
  register: भाषा आधुनिक, निर्देशात्मक और गरिमापूर्ण रखी गई है। इब्रानी मुहावरे का शाब्दिक स्त्रीलिंग रूप मुख्य पाठ में नहीं रखा गया, क्योंकि हिन्दी में वह अर्थ को अस्पष्ट करेगा; ‘एक-दूसरे से’ वास्तविक आशय स्पष्ट करता है।
