  yaml_path: translation/ot/exodus/026/012.yaml
  text: And the overhang that remains from the tent curtains[a]—the half curtain that remains over[b]—shall hang over the back of the tabernacle.
translation:
  language: hi
  text: और तंबू के परदों का जो अतिरिक्त भाग बचा है[a]—अर्थात परदे का बचा हुआ आधा भाग—वह निवास-स्थान[b] के पिछले हिस्से पर लटका रहेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बचा हुआ लटकता भाग।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी पाठ में “तंबू” (आवरण की परत) और “निवास-स्थान” (निवास की संरचना) के लिए अलग-अलग शब्द हैं।
    reason: cultural_note
lexical_decisions:
- source_word: סֶרַח
  choice: लटकता भाग
  rationale: यह संज्ञा बचे हुए ऐसे अतिरिक्त भाग को दर्शाती है जो आगे निकला या नीचे लटका हो; स्थापत्य-संदर्भ में ‘लटकता भाग’ उसके आकार और कार्य दोनों को स्पष्ट करता है।
- source_word: הָעֹדֵף / הָעֹדֶפֶת
  choice: बचा हुआ
  rationale: दोनों कृदंत अतिरिक्त या शेष बचे अंश को सूचित करते हैं। ‘बचा हुआ’ आधुनिक हिन्दी में स्वाभाविक है और दोनों प्रयोगों की पुनरावृत्ति बनाए रखता है।
- source_word: יְרִיעֹת / יְרִיעָה
  choice: परदे / परदा
  rationale: निवास-स्थान के संदर्भ में ये बड़े कपड़े के आवरण हैं; ‘परदा’ प्रचलित, स्पष्ट और सामान्य पाठक के लिए सहज शब्द है।
- source_word: הָאֹהֶל
  choice: तंबू
  rationale: यहाँ यह बाहरी तंबू अथवा आवरण-परत को दर्शाता है और बाद में आए מִשְׁכָּן से अलग है।
- source_word: חֲצִי הַיְרִיעָה
  choice: आधा परदा
  rationale: यह वाक्यांश एक परदे की आधी चौड़ाई को दर्शाता है; ‘आधा परदा’ संक्षिप्त और स्वाभाविक है।
- source_word: תִּסְרַח
  choice: लटका रहेगा
  rationale: इस संदर्भ में क्रिया अतिरिक्त कपड़े के पीछे की ओर लटकने या फैलने को बताती है; ‘लटका रहेगा’ स्थायी विन्यास की भौतिक छवि को स्पष्ट करता है।
- source_word: עַל אֲחֹרֵי
  choice: के पिछले भाग पर
  rationale: यह संरचना के पीछे वाले हिस्से के ऊपर कपड़ा लटकने की स्थिति बताता है।
- source_word: הַמִּשְׁכָּן
  choice: निवास-स्थान
  rationale: यह पवित्र निवास-संरचना के लिए प्रयुक्त तकनीकी शब्द है। ‘निवास-स्थान’ मूल शब्द के ‘निवास’ अर्थ को बनाए रखता और ‘तंबू’ से उसका भेद स्पष्ट करता है।
theological_decisions:
- issue: אֹהֶל और מִשְׁכָּן के बीच भेद
  choice: क्रमशः ‘तंबू’ और ‘निवास-स्थान’
  alternative: दोनों के लिए ‘तंबू’ अथवा ‘मिलापवाला तंबू’
  rationale: इब्रानी पाठ इस पद में आवरण-तंबू और निवास-संरचना के लिए अलग शब्द प्रयोग करता है; अलग हिन्दी शब्द उस वास्तविक पाठगत भेद को बिना किसी सांप्रदायिक व्याख्या के सुरक्षित रखते हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य में दीर्घ विरामचिह्न मूल की पुनर्व्याख्यात्मक संरचना को दिखाता है, जिसमें ‘बचा हुआ आधा परदा’ पहले कहे गए लटकते भाग को स्पष्ट करता है।
