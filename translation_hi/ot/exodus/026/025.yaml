lexical_decisions:
- source_word: קְרָשִׁים
  choice: चौखटे
  rationale: यह शब्द निवास की खड़ी संरचनात्मक इकाइयों को दर्शाता है। ‘चौखटे’ आधुनिक हिन्दी में उनकी संरचनात्मक भूमिका स्पष्ट करता है; ‘तख्ते’ भी सम्भव है।
- source_word: אַדְנֵי/הֶם ... אֲדָנִים
  choice: कुर्सियाँ
  rationale: यहाँ आशय चौखटों के नीचे लगी सहारा देने वाली आधार-इकाइयों से है। निर्माण-संदर्भ में ‘कुर्सी’ आधार या पादपीठ के अर्थ में प्रयुक्त होती है; सामान्य पाठक के लिए ‘खाँचे’ वैकल्पिक रूप से दिया गया है।
- source_word: כֶּסֶף
  choice: चाँदी
  rationale: आधार-इकाइयों की सामग्री का सीधा और स्वाभाविक हिन्दी नाम।
- source_word: שִׁשָּׁה עָשָׂר
  choice: सोलह
  rationale: मूल संख्या का मानक हिन्दी रूप।
- source_word: תַּחַת
  choice: नीचे
  rationale: निर्माण-विन्यास में स्थान को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הַקֶּרֶשׁ הָאֶחָד
  choice: एक चौखटे ... दूसरे चौखटे
  rationale: इब्रानी में ‘एक चौखटा’ का वितरणात्मक प्रयोग दोहराया गया है। हिन्दी में ‘एक ... दूसरे’ प्रत्येक चौखटे के नीचे दो आधार होने की बात स्वाभाविक रूप से व्यक्त करता है, बिना क्रम का अनावश्यक संकेत दिए।
- source_word: וְהָיוּ
  choice: इस प्रकार ... होंगे
  rationale: विनिर्देश-सूची के प्रवाह में अस्तित्व और परिणामी कुल संख्या को स्वाभाविक हिन्दी में व्यक्त करता है।
