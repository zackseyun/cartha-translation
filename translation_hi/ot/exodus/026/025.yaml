  rationale: The revision replaces the misleading everyday term ‘कुर्सियाँ’ with ‘आधार’ and updates its lexical-alternative footnote. It preserves the source’s eight frames, sixteen silver bases, and two bases for each frame; the distributive Hindi wording also makes the numerical relation explicit without adding historical or doctrinal interpretation.
