- source_word: קְרָשִׁים
  choice: तख्ते
  rationale: यह निवास की दीवार बनाने वाले लकड़ी के संरचनात्मक खंडों को दर्शाता है। ‘तख्ते’ पारंपरिक और सहज है, जबकि उनकी ठीक बनावट—ठोस पटरे या खुले चौखटे—अनिश्चित है।
