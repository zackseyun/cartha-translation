  text: and five bars for the boards of the second side of the tabernacle[b][a], and five bars for the boards of the side of the tabernacle at the rear westward.
translation:
  language: hi
  text: और निवास-स्थान की दूसरी ओर के तख्तों के लिए पाँच छड़ें[a], और निवास-स्थान की पिछली ओर के, पश्चिम की दिशा में स्थित तख्तों के लिए पाँच छड़ें[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘निवास-स्थान की दूसरी तरफ़’; इब्रानी में शब्दशः ‘दूसरी’ है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शब्दशः, ‘निवास-स्थान की पिछली ओर के लिए, पश्चिम की ओर।’
    reason: lexical_alternative
lexical_decisions:
- source_word: בְרִיחִם
  choice: छड़ें
  rationale: निर्माण के इस प्रसंग में यह उन क्षैतिज लकड़ी की छड़ों को दर्शाता है जो तख्तों को एक साथ बाँधती थीं। ‘छड़ें’ सहज और पर्याप्त रूप से स्पष्ट है; ‘आड़ी छड़ें’ अधिक व्याख्यात्मक होता।
- source_word: קַרְשֵׁי
  choice: तख्तों
  rationale: यह शब्द निवास-स्थान के ढाँचे में प्रयुक्त लकड़ी के संरचनात्मक भागों को दर्शाता है। ‘तख्ते’ अर्थ को स्पष्ट रखता है और ‘चौखटों’ जैसी अधिक विशिष्ट व्याख्या से बचता है।
- source_word: צֶלַע
  choice: ओर
  rationale: वास्तु-वर्णन में इसका अर्थ किसी संरचना का पार्श्व या बगल है। आधुनिक हिन्दी में ‘ओर’ स्वाभाविक रूप से वही स्थान-संबंध व्यक्त करता है।
- source_word: הַשֵּׁנִית
  choice: दूसरी
  rationale: मूल शब्द का प्रत्यक्ष अर्थ ‘दूसरी’ है। इसे बनाए रखने से पिछली आयत में बताई गई पहली ओर के साथ क्रमबद्ध संबंध स्पष्ट रहता है, जबकि संदर्भ में इसका आशय ‘दूसरी तरफ़’ भी है।
- source_word: הַמִּשְׁכָּן
  choice: निवास-स्थान
  rationale: यह शब्द ‘निवास’ से संबंधित है और निर्गमन में पवित्र तम्बू-संरचना का स्थापित नाम है। ‘निवास-स्थान’ मूल अर्थ को पारदर्शी रखते हुए आधुनिक हिन्दी में समझने योग्य है।
- source_word: לַיַּרְכָתַיִם
  choice: पिछले भाग में
  rationale: यह संरचना के दूरस्थ या पिछले हिस्से को दर्शाता है। यहाँ ‘पिछले भाग में’ वास्तु-संदर्भ में स्वाभाविक है।
- source_word: יָמָּה
  choice: पश्चिम की ओर
  rationale: यह पश्चिम दिशा बताने वाला क्रियाविशेषण है, जो मूलतः समुद्र की दिशा से निकला है। ‘पश्चिम की ओर’ हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: וַחֲמִשָּׁה ... וַחֲמִשָּׁה
  choice: और ... पाँच ... और ... पाँच
  rationale: दोनों खंडों में संख्या की पुनरावृत्ति और संयोजक संरचना को बनाए रखा गया है, जिससे निर्माण-निर्देश की सूचीबद्ध शैली सुरक्षित रहती है।
