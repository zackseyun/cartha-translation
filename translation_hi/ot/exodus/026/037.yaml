  text: וְ/עָשִׂ֣יתָ לַ/מָּסָ֗ךְ חֲמִשָּׁה֙ עַמּוּדֵ֣י שִׁטִּ֔ים וְ/צִפִּיתָ֤ אֹתָ/ם֙ זָהָ֔ב וָוֵי/הֶ֖ם זָהָ֑ב וְ/יָצַקְתָּ֣ לָ/הֶ֔ם חֲמִשָּׁ֖ה אַדְנֵ֥י נְחֹֽשֶׁת׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/037.yaml
  text: And you shall make for the screen five pillars of acacia wood[a], and overlay them with gold; their hooks shall be of gold[b]; and you shall cast for them five bases of bronze.
translation:
  language: hi
  text: और प्रवेश के परदे[a] के लिए बबूल की लकड़ी के पाँच खम्भे बनाना, उन्हें सोने से मढ़ना; उनके हुक सोने के हों; और उनके लिए काँसे के पाँच आधार[b] ढालना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '''प्रवेश के परदे'' के लिए केवल ''परदा'' या ''ओट'' भी सम्भव है; इब्रानी शब्द यहाँ प्रवेश पर लटके परदे को दर्शाता है, जो परमपवित्र स्थान के भीतरी परदे से अलग था।'
    reason: lexical_alternative
  - marker: b
    text: '''आधार'' के लिए ''सॉकेट'' भी सम्भव है; ये खम्भों को थामने वाले धातु के आधार थे।'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָּסָךְ
  choice: प्रवेश का परदा
  rationale: यह शब्द यहाँ पवित्र निवास के प्रवेश पर लगे परदे को दर्शाता है, भीतर के परमपवित्र स्थान वाले विभाजक परदे को नहीं। 'प्रवेश का परदा' कार्य और स्थान दोनों को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: עַמּוּדֵי שִׁטִּים
  choice: बबूल की लकड़ी के पाँच खम्भे
  rationale: עַמּוּדִים के लिए 'खम्भे' निर्माण-संदर्भ में सहज है; שִׁטִּים को पवित्र निवास की निर्माण-सामग्री के रूप में प्रचलित हिन्दी 'बबूल की लकड़ी' से व्यक्त किया गया है।
- source_word: וְצִפִּיתָ אֹתָם זָהָב
  choice: उन पर सोना मढ़ना
  rationale: צפה धातु की परत चढ़ाने को दर्शाता है; 'सोना मढ़ना' आधुनिक हिन्दी में संक्षिप्त, स्वाभाविक और सटीक है।
- source_word: וָוֵיהֶם
  choice: उनके काँटे
  rationale: וָוִים यहाँ परदा टाँगने के लिए खम्भों से जुड़े हुक-जैसे उपकरण हैं। निर्माण और परदा-टाँगने के संदर्भ में 'काँटे' स्वाभाविक हिन्दी शब्द है।
- source_word: אַדְנֵי נְחֹשֶׁת
  choice: काँसे की पाँच कुर्सियाँ
  rationale: אַדָן खम्भे को थामने वाली आधार-सॉकेट को दर्शाता है। पवित्र निवास के स्थापत्य-संदर्भ में 'कुर्सियाँ' पारंपरिक और उपयोगी हिन्दी पद है; विकल्प को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: נְחֹשֶׁת
  choice: काँसा
  rationale: प्राचीन धातु-सामग्री के इस संदर्भ में 'काँसा' आधुनिक हिन्दी में उपयुक्त है और भ्रामक 'पीतल' से बेहतर है।
- source_word: וְיָצַקְתָּ לָהֶם
  choice: उनके लिए ... ढालना
  rationale: יצק धातु को साँचे में ढालने का बोध देता है और לָהֶם बताता है कि आधार खम्भों के लिए बनाए जाने हैं।
