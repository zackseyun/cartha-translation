- source_word: הָאַחַת / הָאֶחָת
  choice: हर एक
  rationale: शाब्दिक रूप ‘वह एक’ है, पर यहाँ इब्रानी प्रयोग वितरणात्मक है और प्रत्येक अलग परदे पर समान आयाम लागू करता है।
- source_word: שְׁמֹנֶה וְעֶשְׂרִים
  choice: अट्ठाईस
  rationale: संख्या का सीधा आधुनिक हिन्दी रूप।
- source_word: בָּאַמָּה
  choice: हाथ
  rationale: אַמָּה प्राचीन लंबाई की इकाई ‘क्यूबिट’ है; हिन्दी बाइबलीय और सामान्य माप-भाषा में ‘हाथ’ इसका स्वाभाविक समतुल्य है।
- source_word: וְרֹחַב
  choice: और चौड़ाई
  rationale: ‘लंबाई’ के साथ आयाम बताने वाला स्वाभाविक आधुनिक हिन्दी पद।
- source_word: אַרְבַּע
  choice: चार
  rationale: संख्या का सीधा हिन्दी रूप।
- source_word: מִדָּה אַחַת
  choice: नाप एक ही
  rationale: शाब्दिक ‘एक नाप’ के अर्थ को सहज हिन्दी में व्यक्त करता है और सभी परदों के समान आकार पर बल बनाए रखता है।
- source_word: לְכָל הַיְרִיעֹת
  choice: सभी परदों का
  rationale: एक ही निर्धारित नाप पूरे परदा-समूह पर लागू होने का सामूहिक आशय स्पष्ट करता है।
