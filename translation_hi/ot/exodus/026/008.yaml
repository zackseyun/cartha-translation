  text: אֹ֣רֶךְ הַ/יְרִיעָ֣ה הָֽ/אַחַ֗ת שְׁלֹשִׁים֙ בָּֽ/אַמָּ֔ה וְ/רֹ֨חַב֙ אַרְבַּ֣ע בָּ/אַמָּ֔ה הַ/יְרִיעָ֖ה הָ/אֶחָ֑ת מִדָּ֣ה אַחַ֔ת לְ/עַשְׁתֵּ֥י עֶשְׂרֵ֖ה יְרִיעֹֽת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/008.yaml
  text: The length of each curtain shall be thirty cubits[a], and the width of each curtain four cubits[b]; all eleven curtains shall have one measure.
translation:
  language: hi
  text: प्रत्येक पर्दे की लंबाई तीस हाथ[a] और चौड़ाई चार हाथ होगी; सभी ग्यारह पर्दों का नाप एक ही[b] होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘हाथ’ एक प्राचीन लंबाई की इकाई थी, जो लगभग 45 सेंटीमीटर के बराबर मानी जाती है।
    reason: measurement_clarification
  - marker: b
    text: शाब्दिक रूप से ‘एक नाप’; अर्थात सभी ग्यारह पर्दों के आयाम समान थे।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹרֶךְ
  choice: लंबाई
  rationale: यह רֹחַב (‘चौड़ाई’) के साथ प्रयुक्त मानक माप-संबंधी शब्द है; आधुनिक हिन्दी में ‘लंबाई’ स्वाभाविक और स्पष्ट है।
- source_word: יְרִיעָה
  choice: पर्दा
  rationale: मिलापवाले तंबू के संदर्भ में यह बड़े कपड़े के आवरण-खंड को दर्शाता है; ‘पर्दा’ प्रचलित और सहज हिन्दी शब्द है।
- source_word: הָאַחַת / הָאֶחָת
  choice: प्रत्येक
  rationale: शाब्दिक रूप ‘एक पर्दा’ है, पर यहाँ इसका प्रयोग वितरणात्मक है और हर अलग पर्दे के माप को बताता है; इसलिए ‘प्रत्येक’ अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שְׁלֹשִׁים בָּאַמָּה
  choice: तीस हाथ
  rationale: אַמָּה प्राचीन लंबाई की इकाई ‘हाथ’ (क्यूबिट) है। आधुनिक इकाई में निश्चित रूपांतरण करने के बजाय मूल सांस्कृतिक इकाई रखी गई है।
- source_word: רֹחַב
  choice: चौड़ाई
  rationale: यह ‘लंबाई’ के साथ आया है; आधुनिक हिन्दी में ‘चौड़ाई’ सबसे स्पष्ट समतुल्य है।
- source_word: אַרְבַּע בָּאַמָּה
  choice: चार हाथ
  rationale: मूल प्राचीन माप-इकाई को बनाए रखते हुए आयाम को सीधी और स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: מִדָּה אַחַת
  choice: नाप एक ही
  rationale: इब्रानी का शाब्दिक अर्थ ‘एक नाप’ है और इससे सभी पर्दों के समान आयाम पर बल पड़ता है; हिन्दी में ‘नाप एक ही’ इसी बल को स्वाभाविक ढंग से रखता है।
- source_word: לְעַשְׁתֵּי עֶשְׂרֵה יְרִיעֹת
  choice: सभी ग्यारह पर्दों का
  rationale: यह वाक्यांश उन पूरे ग्यारह पर्दों को निर्दिष्ट करता है जिनका माप समान है; ‘सभी’ पूरे समूह को स्पष्ट करता है।
