  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘हाथ’ पारंपरिक हिन्दी बाइबलीय माप-शब्द है; अनुमानित आधुनिक मान केवल पाद-टिप्पणी में दिया गया है। वितरणात्मक इब्रानी रूप को ‘प्रत्येक’ और समान माप के बल को ‘नाप एक ही’ से व्यक्त किया गया है।
