translation_notes:
  register: आधुनिक मानक हिंदी में निर्देशात्मक शैली रखी गई है। एकवचन संबोधन के लिए ‘तुम’ प्रयोग किया गया है; भाषा सहज है, पर पवित्र स्थान के निर्माण-निर्देश के अनुरूप गरिमापूर्ण बनी हुई है।
