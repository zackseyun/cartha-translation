base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/009.yaml
  text: And you shall join the five curtains separately[a], and the six curtains separately; and you shall fold the sixth curtain double at the front of the tent.
translation:
  language: hi
  text: तुम पाँच परदों को एक साथ जोड़ो और छह परदों को भी एक साथ जोड़ो; फिर छठे परदे को तंबू के सामने दोहरा मोड़ो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तंबू के मुख के सम्मुख दोहरा मोड़ो।”
    reason: אֶל מוּל פְּנֵי का अधिक शाब्दिक स्थान-सूचक अनुवाद; यह तंबू के सामने वाले भाग के सम्मुख होने का भाव भी दे सकता है।
lexical_decisions:
- source_word: חִבַּרְתָּ
  choice: जोड़ना
  rationale: क्रिया חָבַר का अर्थ जोड़ना या परस्पर मिलाना है। हिंदी में ‘जोड़ना’ निर्माण-संबंधी इस निर्देश को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: יְרִיעֹת / יְרִיעָה
  choice: परदे / परदा
  rationale: यह शब्द निवास-तंबू के कपड़े के आवरणों या लटकते पटों के लिए प्रयुक्त है। सामान्य पाठक के लिए ‘परदा’ सबसे स्पष्ट और प्रचलित विकल्प है।
- source_word: לְבָד
  choice: एक अलग समूह में / दूसरे अलग समूह में
  rationale: यहाँ शब्द प्रत्येक संख्या के परदों को अलग इकाई के रूप में जोड़ने का निर्देश देता है। ‘अलग-अलग’ से हर परदे को पृथक रखने का गलत अर्थ निकल सकता था, इसलिए समूह का भाव स्पष्ट किया गया है।
- source_word: כָפַלְתָּ
  choice: दोहरा मोड़कर
  rationale: כָּפַל में किसी वस्तु को दुहरा करने या मोड़ने का भाव है। ‘दोहरा मोड़कर’ दोनों पहलुओं को संक्षेप में बनाए रखता है।
- source_word: הַשִּׁשִּׁית
  choice: छठे
  rationale: यह ‘परदे’ को विशेषित करने वाली सीधी क्रमवाचक संख्या है।
- source_word: אֶל מוּל פְּנֵי
  choice: सामने की ओर
  rationale: यह संयुक्त पद तंबू के मुख या सामने वाले भाग की ओर स्थिति दर्शाता है। हिंदी में ‘सामने की ओर’ स्वाभाविक है, जबकि ‘मुख के सम्मुख’ अधिक शाब्दिक विकल्प है।
- source_word: הָאֹהֶל
  choice: तंबू
  rationale: मूल शब्द का सीधा अर्थ ‘तंबू’ है। संदर्भ में यह पवित्र निवास को दर्शाता है, पर ‘तंबू’ मूल की शब्दावली को बनाए रखता है।
