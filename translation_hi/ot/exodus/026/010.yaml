  text: וְ/עָשִׂ֜יתָ חֲמִשִּׁ֣ים לֻֽלָאֹ֗ת עַ֣ל שְׂפַ֤ת הַ/יְרִיעָה֙ הָֽ/אֶחָ֔ת הַ/קִּיצֹנָ֖ה בַּ/חֹבָ֑רֶת וַ/חֲמִשִּׁ֣ים לֻֽלָאֹ֗ת עַ֚ל שְׂפַ֣ת הַ/יְרִיעָ֔ה הַ/חֹבֶ֖רֶת הַ/שֵּׁנִֽית׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/010.yaml
  text: And you shall make fifty loops on the edge of the one curtain[a], the outermost one in the set joined together, and fifty loops on the edge of the second curtain that is joined to it.
translation:
  language: hi
  text: तुम उस एक परदे के किनारे पर पचास फंदे बनाओ, जो जुड़े हुए समूह में सबसे बाहर वाला परदा है, और दूसरे जुड़े हुए समूह के परदे के किनारे पर भी पचास फंदे बनाओ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: तुम ... बनाना
  rationale: निर्देशात्मक प्रसंग में संयोजक सहित कालरूप आज्ञा का कार्य करता है। ‘तुम ... बनाना’ आधुनिक हिन्दी में निर्माण-संबंधी निर्देश को स्वाभाविक और स्पष्ट रखता है।
- source_word: לֻלָאֹת
  choice: फंदे
  rationale: यह कपड़े के उन छल्लेनुमा फंदों को दर्शाता है जिनसे परदे जोड़े जाते हैं; ‘फंदे’ संक्षिप्त और सामान्य हिन्दी शब्द है।
- source_word: שְׂפַת
  choice: किनारे
  rationale: शाब्दिक अर्थ ‘होंठ’ है, पर कपड़े के संदर्भ में ‘किनारा’ स्वाभाविक अर्थ देता है।
- source_word: הַיְרִיעָה
  choice: परदे
  rationale: मिलापवाले तंबू के प्रसंग में यह बड़े कपड़े के परदे या पट को दर्शाता है; ‘परदा’ प्रचलित और सहज है।
- source_word: הָאֶחָת
  choice: एक परदे
  rationale: मूल पाठ में स्पष्ट रूप से ‘पहला’ नहीं, बल्कि ‘एक’ है; इसलिए क्रमसूचक अर्थ थोपे बिना ‘एक’ रखा गया है।
- source_word: הַקִּיצֹנָה
  choice: सबसे बाहर वाला परदा
  rationale: यह जुड़े हुए समूह के अंतिम छोर पर स्थित परदे को बताता है। हिन्दी में संज्ञा दोहराने से संदर्भ स्पष्ट रहता है।
- source_word: בַּחֹבָרֶת
  choice: जुड़े हुए समूह में
  rationale: संज्ञा कई परदों को जोड़कर बनी इकाई या जोड़ को दर्शाती है। ‘जुड़ा हुआ समूह’ निर्माणात्मक संबंध को सामान्य पाठक के लिए स्पष्ट करता है।
- source_word: הַחֹבֶרֶת הַשֵּׁנִית
  choice: दूसरे जुड़े हुए समूह के
  rationale: यह पदबंध दूसरे जोड़े गए परदा-समूह को दर्शाता है। संबंधसूचक हिन्दी रचना मूल के संक्षिप्त पदबंध का स्वाभाविक रूप है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और निर्माण-संबंधी निर्देश के अनुरूप रखी गई है। लंबे वाक्य में डैश का प्रयोग बाहरी परदे की पहचान स्पष्ट करने के लिए किया गया है; ‘भी’ दोनों समान निर्देशों का संबंध सहज बनाता है।
