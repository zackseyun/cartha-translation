source:
  edition: WLC
  text: וְ/אֶת הַ/מִּשְׁכָּ֥ן תַּעֲשֶׂ֖ה עֶ֣שֶׂר יְרִיעֹ֑ת שֵׁ֣שׁ מָשְׁזָ֗ר וּ/תְכֵ֤לֶת וְ/אַרְגָּמָן֙ וְ/תֹלַ֣עַת שָׁנִ֔י כְּרֻבִ֛ים מַעֲשֵׂ֥ה חֹשֵׁ֖ב תַּעֲשֶׂ֥ה אֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/001.yaml
  text: And you shall make the tabernacle with ten curtains of finely twisted linen[a], and blue and purple and scarlet yarn; with cherubim, the work of a skillful designer, you shall make them.
translation:
  language: hi
  text: “और पवित्र निवास को दस परदों से बनाना। ये परदे बारीक बटे हुए सन के सूत और नीले, बैंगनी तथा सुर्ख लाल सूत से बनाना; उन पर करूबों की आकृतियाँ कुशल कारीगर की कलात्मक कारीगरी से बनाना।[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “करूबों की आकृतियाँ उनमें कुशलता से बुनना।” इब्रानी पद कलात्मक, योजनाबद्ध वस्त्र-कारीगरी को दर्शाता है, पर यह ठीक-ठीक नहीं बताता कि आकृतियाँ किस तकनीक से बनाई गई थीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּשְׁכָּן
  choice: पवित्र निवास
  rationale: מִשְׁכָּן का मूल अर्थ ‘निवास’ है और यहाँ यह इस्राएल के पवित्र चलायमान उपासना-स्थान का तकनीकी नाम है। ‘पवित्र निवास’ आधुनिक हिंदी में अर्थ स्पष्ट रखता है और इसे ‘मिलापवाला तंबू’ (जो אֹהֶל מוֹעֵד के अधिक निकट है) से नहीं मिलाता।
- source_word: יְרִיעֹת
  choice: परदे
  rationale: इस निर्माण-संदर्भ में शब्द बड़े कपड़े के पटों या लटकाए जाने वाले परदों को दर्शाता है। ‘परदे’ सहज हिंदी है और संरचना में उनके उपयोग को स्पष्ट करता है।
- source_word: שֵׁשׁ מָשְׁזָר
  choice: बारीक बटे हुए सन के सूत
  rationale: שֵׁשׁ बारीक सन और מָשְׁזָר बटे हुए धागे को दर्शाता है। यह चयन सामग्री और धागा बनाने की विधि, दोनों को व्यक्त करता है।
- source_word: תְּכֵלֶת
  choice: नीला सूत
  rationale: यह तंबू-निर्माण में प्रयुक्त नीले रंग की रंगी हुई वस्त्र-सामग्री का नाम है। संदर्भ के कारण ‘सूत’ जोड़ना स्वाभाविक और स्पष्ट है।
- source_word: אַרְגָּמָן
  choice: बैंगनी सूत
  rationale: शब्द बैंगनी रंगी हुई वस्त्र-सामग्री को दर्शाता है; ‘बैंगनी’ साधारण आधुनिक हिंदी में स्पष्ट है।
- source_word: תֹלַעַת שָׁנִי
  choice: सुर्ख लाल सूत
  rationale: यह पद गहरे चमकीले लाल या किरमिजी रंग की वस्त्र-सामग्री को दर्शाता है। ‘सुर्ख लाल’ सामान्य पाठक के लिए ‘किरमिजी’ से अधिक सहज है।
- source_word: כְּרֻבִים
  choice: करूबों
  rationale: ‘करूब’ बाइबिल के इस विशिष्ट स्वर्गीय प्राणी के लिए प्रचलित तकनीकी शब्द है और आधुनिक ‘देवदूत’ जैसी व्यापक श्रेणी में अर्थ को नहीं मिला देता।
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: कुशल शिल्पकार की कारीगरी
  rationale: यह पद योजनाबद्ध, कलात्मक वस्त्र-कारीगरी को बताता है, संभवतः बुनाई में बनाई गई आकृतियों को; हिंदी वाक्यांश कौशल और कलात्मक रचना दोनों को बनाए रखता है।
- source_word: וְאֶת ... תַּעֲשֶׂה
  choice: पवित्र निवास को ... बनाना
  rationale: हिंदी के निर्देशात्मक infinitive ‘बनाना’ से इब्रानी के दूसरे पुरुष एकवचन आदेश का स्वाभाविक और गरिमापूर्ण रूप मिलता है। आरंभिक וְ निर्देशों की निरंतरता दिखाता है, जिसे संदर्भ और वाक्य-क्रम पर्याप्त रूप से व्यक्त करते हैं।
- source_word: אֹתָם
  choice: ये परदे ... बनाना; उन पर
  rationale: इब्रानी बहुवचन सर्वनाम दस परदों की ओर लौटता है। हिंदी में संदर्भ को स्पष्ट रखने के लिए ‘ये परदे’ और ‘उन पर’ का प्रयोग किया गया है।
