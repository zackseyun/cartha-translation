translation:
  language: hi
  text: तुम निवास-स्थान के ऊपर तम्बू बनाने के लिए बकरी के बालों[क] के परदे बनाना; कुल ग्यारह परदे बनाना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: शाब्दिक रूप से, “बकरियों के परदे।” इब्रानी में “बकरियाँ” यहाँ बकरी के बालों से बनी सामग्री के अर्थ में है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: तुम ... भी बनाना
  rationale: निर्देशों की क्रमिक शृंखला में संयुक्त वाव को हिन्दी में सहज रूप से ‘भी’ द्वारा व्यक्त किया गया है; ‘बनाना’ मूसा को दिए सीधे निर्देश का स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: יְרִיעֹת
  choice: परदे
  rationale: निवास-स्थान के निर्माण-संदर्भ में यह बड़े कपड़े के पटों को सूचित करता है; ‘परदे’ सामान्य पाठक के लिए स्पष्ट और गरिमापूर्ण है।
- source_word: עִזִּים
  choice: बकरी के बालों के
  rationale: इब्रानी में शाब्दिक रूप से ‘बकरियाँ’ है, पर यहाँ उससे प्राप्त सामग्री, अर्थात बकरी के बालों से बुना कपड़ा, अभिप्रेत है। हिन्दी में सामग्री को स्पष्ट करना आवश्यक है।
- source_word: לְאֹהֶל
  choice: ताकि ... तम्बू हो
  rationale: 'לְ यहाँ प्रयोजन या परिणति दर्शाता है: इन परदों से निवास-स्थान के ऊपर तम्बू बनना है। यह हिन्दी में ‘के लिए एक तम्बू’ की अपेक्षा अधिक स्वाभाविक है।'
- source_word: עַל הַמִּשְׁכָּן
  choice: निवास-स्थान के ऊपर
  rationale: עַל स्थानगत ‘ऊपर’ दर्शाता है। מִשְׁכָּן का मूल भाव ‘निवास-स्थान’ है और निर्गमन के इस पवित्रस्थान-संदर्भ में यह स्पष्ट रहते हुए अनावश्यक पारिभाषिक उधारी से बचता है।
- source_word: עַשְׁתֵּי עֶשְׂרֵה יְרִיעֹת תַּעֲשֶׂה אֹתָם
  choice: तुम कुल ग्यारह परदे बनाना
  rationale: इब्रानी ग्यारह की संख्या और ‘परदे’ को दोहराकर कुल संख्या निर्दिष्ट करता है। हिन्दी में ‘कुल ग्यारह परदे’ वही बल स्वाभाविक ढंग से व्यक्त करता है।
