  register: आधुनिक मानक हिन्दी; निर्देशात्मक, गरिमापूर्ण और सामान्य पाठक के लिए सहज। ‘तम्बू’ और ‘निवास-स्थान’ के भेद को बनाए रखा गया है, क्योंकि मूल में אֹהֶל और מִשְׁכָּן अलग शब्द हैं।
