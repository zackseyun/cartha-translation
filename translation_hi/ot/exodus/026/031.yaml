source:
  edition: WLC
  text: וְ/עָשִׂ֣יתָ פָרֹ֗כֶת תְּכֵ֧לֶת וְ/אַרְגָּמָ֛ן וְ/תוֹלַ֥עַת שָׁנִ֖י וְ/שֵׁ֣שׁ מָשְׁזָ֑ר מַעֲשֵׂ֥ה חֹשֵׁ֛ב יַעֲשֶׂ֥ה אֹתָ֖/הּ כְּרֻבִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/031.yaml
  text: And you shall make a veil of blue[a], purple, and scarlet yarn, and fine twisted linen; it shall be made with cherubim[c][b], the work of a skillful designer.
translation:
  language: hi
  text: “तुम नीले, बैंगनी और सुर्ख लाल सूत[b] तथा महीन बटे हुए सन के धागों से एक पर्दा[a] बनाना। उस पर कुशल कलात्मक कारीगरी[c] से करूबों की आकृतियाँ बनवाई जाएँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘विभाजक पर्दा।’ यह वह भीतरी पर्दा था जो पवित्र स्थान को परमपवित्र स्थान से अलग करता था।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में ‘सुर्ख लाल’ का आशय अधिक शाब्दिक रूप से लाल रंग में रंगी सामग्री से है; परंपरागत रूप से यह रंग कीटों से तैयार किया जाता था।
    reason: cultural_note
  - marker: c
    text: या, ‘कलात्मक बुनकर का काम’ अथवा ‘कुशलता से किया हुआ काम।’ इब्रानी अभिव्यक्ति विशेषज्ञ कलात्मक कारीगरी को सूचित करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: פָרֹכֶת
  choice: परदा
  rationale: यह पवित्र स्थान और परमपवित्र स्थान के बीच लगाए जाने वाले भीतरी परदे का नाम है। ‘परदा’ आधुनिक हिन्दी में स्वाभाविक है; विशेष संदर्भ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: תְּכֵלֶת
  choice: नीला सूत
  rationale: यह प्रतिष्ठित नीले रंग से रंगी वस्त्र-सामग्री को सूचित करता है। सूची के सभी रंगों के साथ सामूहिक रूप से ‘सूत’ लगाया गया है।
- source_word: אַרְגָּמָן
  choice: बैंगनी सूत
  rationale: मिलापवाले तंबू के वर्णनों में यह बहुमूल्य बैंगनी रंग की वस्त्र-सामग्री के लिए प्रयुक्त सामान्य शब्द है।
- source_word: תוֹלַעַת שָׁנִי
  choice: सुर्ख लाल सूत
  rationale: यह गहरे चटकीले लाल रंग से रंगी सामग्री को दर्शाता है। ‘सुर्ख लाल’ आधुनिक पाठक के लिए रंग को स्पष्ट करता है, जबकि रंग बनाने की प्राचीन विधि पादटिप्पणी में दी गई है।
- source_word: שֵׁשׁ מָשְׁזָר
  choice: बटा हुआ महीन सन
  rationale: שֵׁשׁ महीन सन के वस्त्र को और מָשְׁזָר धागों के बटे हुए होने को व्यक्त करता है; यह रूप सामग्री और उसकी बनावट दोनों को बनाए रखता है।
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: कुशल कारीगर
  rationale: यह पद कलात्मक कौशल से किए गए विशेषज्ञ काम को दर्शाता है। ‘कुशल कारीगर’ स्वाभाविक हिन्दी है और किसी संकीर्ण आधुनिक पेशे, जैसे केवल कढ़ाई करने वाले, को अनावश्यक रूप से निर्धारित नहीं करता।
- source_word: יַעֲשֶׂה אֹתָהּ
  choice: उस पर … बनाए
  rationale: इब्रानी में आरंभिक दूसरे पुरुष के निर्देश के बाद तीसरे पुरुष का क्रिया-रूप आता है। हिन्दी में ‘कुशल कारीगर … बनाए’ इस बदलाव और निर्माण-निर्देश दोनों को सहज रूप से व्यक्त करता है।
- source_word: כְּרֻבִים
  choice: करूबों की आकृतियाँ
  rationale: करूब परदे की कलात्मक रूपरेखा का हिस्सा हैं। ‘आकृतियाँ’ जोड़ने से स्पष्ट होता है कि परदे पर उनके रूप बनाए जाने हैं, न कि स्वयं जीवित करूब उपस्थित हैं।
theological_decisions:
- issue: परदे और करूबों के वर्णन में बाद की धार्मिक प्रतीकात्मकता जोड़ना
  choice: पद को मिलापवाले तंबू के निर्माण का ठोस निर्देश मानकर अनुवाद करना
  alternative: परदे की बाद की बाइबिलीय या धर्मवैज्ञानिक प्रतीकात्मकता को मुख्य पाठ में प्रमुख बनाना
  rationale: यह पद वास्तु और कलात्मक निर्माण का निर्देश देता है। बाद की धर्मवैज्ञानिक व्याख्याएँ मुख्य अनुवाद में जोड़ना मूल पाठ से आगे जाना होगा।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण निर्देशात्मक रूप अपनाया गया है। ‘तुम … बनाना’ आज्ञार्थक शैली को स्वाभाविक रखता है। तकनीकी वस्त्र-शब्दावली को अत्यधिक संस्कृतनिष्ठ बनाए बिना स्रोत की सामग्री, रंग और कारीगरी का भेद सुरक्षित रखा गया है।
