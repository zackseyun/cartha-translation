  yaml_path: translation/ot/exodus/026/014.yaml
  text: And you shall make for the tent a covering of rams’ skins dyed red[a], and a covering of tahash skins above.
translation:
  language: hi
  text: तुम तंबू के लिए लाल रंग से रंगी हुई मेढ़ों की खालों का एक आवरण और उसके ऊपर तहाश[a] की खालों का एक आवरण बनाओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘तहाश’ के लिए प्रयुक्त इब्रानी शब्द का अर्थ अनिश्चित है। यह किसी विशेष पशु या किसी प्रकार के टिकाऊ चमड़े को दर्शा सकता है; इसके लिए ‘उत्तम चमड़ा,’ ‘सूंस की खालें,’ और ‘डुगोंग की खालें’ जैसे अनुवाद प्रस्तावित किए गए हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: तुम ... बनाना
  rationale: निर्देशों की इस शृंखला में संयोजक सहित पूर्ण क्रिया आज्ञार्थक बल रखती है। हिंदी में ‘तुम ... बनाना’ उस निर्देश को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: מִכְסֶה
  choice: एक आवरण
  rationale: यह संज्ञा किसी वस्तु को ढकने वाली सुरक्षात्मक परत को दर्शाती है; ‘आवरण’ तंबू के निर्माण के प्रसंग में सटीक और गरिमापूर्ण है।
- source_word: לָאֹהֶל
  choice: तंबू के लिए
  rationale: אֹהֶל का सामान्य अर्थ ‘तंबू’ है। यहाँ विशिष्ट धार्मिक पद का अनावश्यक आयात किए बिना मूल शब्द को रखा गया है।
- source_word: עֹרֹת אֵילִם מְאָדָּמִים
  choice: लाल रंग में रंगी हुई मेढ़ों की खालें
  rationale: वाक्यांश मेढ़ों की खालों के लाल किए जाने को बताता है। यह हिंदी अभिव्यक्ति खालों के प्रसंस्कृत या रंगे हुए होने का अर्थ स्पष्ट करती है।
- source_word: עֹרֹת תְּחָשִׁים
  choice: तहाश की खालें
  rationale: תְּחָשִׁים की सटीक पहचान अनिश्चित है। किसी अनुमानित पशु या चमड़े का नाम चुनने के बजाय लिप्यंतरण मूल की अनिश्चितता को सुरक्षित रखता है।
- source_word: מִלְמָעְלָה
  choice: उसके ऊपर
  rationale: प्रसंग में यह दूसरे आवरण की ऊपरी स्थिति बताता है। ‘उसके ऊपर’ हिंदी में परतों का संबंध स्पष्ट करता है, यद्यपि मूल में संकेतवाचक सर्वनाम प्रत्यक्ष रूप से नहीं है।
