  text: And you shall place the table outside the veil[a], and the lampstand opposite the table on the south side of the tabernacle[b]; and you shall put the table on the north side.
translation:
  language: hi
  text: और मेज़ को परदे के बाहर रखना[a], और दीपाधार को मेज़ के सामने, निवास-स्थान की दक्षिणी ओर रखना[b]; और मेज़ को उत्तरी ओर रखना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात निवास-स्थान के भीतरी भाग को अलग करने वाले परदे के बाहर।
    reason: lexical_alternative
  - marker: b
    text: 'हिब्रू: मेनोरा; यहाँ अर्थ स्पष्ट करने के लिए ‘दीपाधार’ अनुवाद किया गया है।'
    reason: cultural_note
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: और ... रखना
  rationale: שׂוּם का अर्थ ‘रखना/स्थापित करना’ है। निर्देशात्मक प्रसंग में हिन्दी का ‘रखना’ स्वाभाविक है और हिब्रू के द्वितीय पुरुष एकवचन आदेशात्मक भाव को बनाए रखता है।
- source_word: הַשֻּׁלְחָן
  choice: मेज़
  rationale: मूल संज्ञा केवल ‘मेज़’ कहती है; यहाँ ‘भेंट की रोटी की मेज़’ जैसी संदर्भगत पहचान जोड़ना मूल से अधिक स्पष्टता लाता।
- source_word: מִחוּץ לַפָּרֹכֶת
  choice: परदे के बाहर
  rationale: פָּרֹכֶת पवित्र-निवास के भीतर विभाजन करने वाले परदे को दर्शाता है। ‘परदा’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: הַמְּנֹרָה
  choice: दीपाधार
  rationale: यह दीपों को थामने वाले पात्र/ढाँचे का सामान्य नाम है। लिप्यंतरण ‘मनोरा’ के बजाय अर्थसूचक ‘दीपाधार’ सामान्य हिन्दी पाठक के लिए अधिक स्पष्ट है।
- source_word: נֹכַח
  choice: के सामने
  rationale: यह आमने-सामने या दूसरी ओर स्थित होने का स्थानिक भाव देता है। ‘के सामने’ सहज हिन्दी में उस संबंध को सुरक्षित रखता है।
- source_word: עַל צֶלַע הַמִּשְׁכָּן תֵּימָנָה
  choice: पवित्र-निवास की दक्षिणी ओर
  rationale: צֶלַע यहाँ ‘बगल/ओर’ और תֵּימָנָה दक्षिण दिशा बताता है। ‘दक्षिणी ओर’ स्पष्ट स्थानिक हिन्दी है।
- source_word: תִּתֵּן
  choice: रखना
  rationale: נָתַן इस साज-सज्जा के प्रसंग में ‘रखना/स्थापित करना’ अर्थ देता है। समान हिन्दी क्रिया निर्देश को सहज और संक्षिप्त रखती है।
- source_word: עַל צֶלַע צָפוֹן
  choice: उत्तरी ओर
  rationale: צֶלַע और צָפוֹן मिलकर उत्तर की ओर/बगल का स्थान बताते हैं; ‘उत्तरी ओर’ स्वाभाविक और सटीक है।
