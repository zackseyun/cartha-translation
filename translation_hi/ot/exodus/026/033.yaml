  text: וְ/נָתַתָּ֣ה אֶת הַ/פָּרֹכֶת֮ תַּ֣חַת הַ/קְּרָסִים֒ וְ/הֵבֵאתָ֥ שָׁ֨מָּ/ה֙ מִ/בֵּ֣ית לַ/פָּרֹ֔כֶת אֵ֖ת אֲר֣וֹן הָ/עֵד֑וּת וְ/הִבְדִּילָ֤ה הַ/פָּרֹ֨כֶת֙ לָ/כֶ֔ם בֵּ֣ין הַ/קֹּ֔דֶשׁ וּ/בֵ֖ין קֹ֥דֶשׁ הַ/קֳּדָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/033.yaml
  text: And you shall place the veil under the clasps[a], and there, within the veil, you shall bring the ark of the testimony[b]; and the veil shall separate for you between the Holy Place and the Most Holy Place.
translation:
  language: hi
  text: तुम परदे को कुंडियों के नीचे लगाना, और वहाँ, परदे के भीतर, गवाही का संदूक[a] ले जाना। वह परदा तुम्हारे लिए पवित्र स्थान और परमपवित्र स्थान[b] को अलग करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वाचा का संदूक।” इब्रानी में यहाँ “गवाही” है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “पवित्रों का पवित्र।”
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרֹכֶת
  choice: परदा
  rationale: यह भीतरी पवित्र कक्ष को ढकने और अलग करने वाले लटकते विभाजक को दर्शाता है। आधुनिक हिन्दी में ‘परदा’ स्वाभाविक और स्पष्ट है।
- source_word: קְרָסִים
  choice: कुंडियाँ
  rationale: यह मिलाए जाने वाले तंबू-पटों को जोड़ने वाले उपकरणों के लिए प्रयुक्त है। ‘कुंडियाँ’ उनके जोड़ने वाले कार्य को सहज हिन्दी में व्यक्त करता है, बिना उनकी बनावट को अनावश्यक रूप से निश्चित किए।
- source_word: מִבֵּית לַפָּרֹכֶת
  choice: परदे के भीतर
  rationale: वाक्यांश परदे की अंदरूनी ओर स्थित स्थान को दर्शाता है। ‘परदे के भीतर’ स्थानिक अर्थ को स्पष्ट और स्वाभाविक ढंग से रखता है।
- source_word: אֲרוֹן הָעֵדוּת
  choice: गवाही का संदूक
  rationale: इब्रानी पाठ में עֵדוּת का अर्थ ‘गवाही’ है, ‘वाचा’ नहीं। इसलिए पारंपरिक संबद्ध नाम से सामंजस्य बैठाने के बजाय मूल शब्दावली सुरक्षित रखी गई है।
- source_word: וְהִבְדִּילָה
  choice: अलग करेगा
  rationale: בדל का हिफ़ील रूप किसी चीज़ द्वारा अलगाव कराने का भाव देता है। ‘अलग करेगा’ हिन्दी में स्वाभाविक रूप से परदे का कार्य बताता है।
- source_word: לָכֶם
  choice: तुम्हारे लिए
  rationale: इब्रानी बहुवचन दत्तिवाचक सर्वनाम को बनाए रखा गया है; यह इस्राएल की उपासना-व्यवस्था के लिए परदे के अलग करने वाले कार्य को सूचित करता है।
- source_word: הַקֹּדֶשׁ
  choice: पवित्र स्थान
  rationale: इस प्रसंग में यह बाहरी पवित्र कक्ष है, जिसे भीतरी कक्ष से अलग किया गया है। ‘पवित्र स्थान’ स्पष्ट और प्रचलित धार्मिक-स्थानिक पद है।
- source_word: קֹדֶשׁ הַקֳּדָשִׁים
  choice: परमपवित्र स्थान
  rationale: शाब्दिक इब्रानी संरचना ‘पवित्रों का पवित्र’ सर्वोच्च पवित्रता व्यक्त करती है। ‘परमपवित्र स्थान’ आधुनिक हिन्दी में उसका अर्थ स्पष्ट करते हुए भीतरी कक्ष को विशिष्ट करता है।
theological_decisions:
- issue: भीतरी पवित्र कक्ष के लिए पारंपरिक धार्मिक शब्दावली
  choice: परमपवित्र स्थान
  alternative: शाब्दिक रूप से ‘पवित्रों का पवित्र स्थान’
  rationale: इब्रानी की सर्वोच्चता-सूचक संरचना को शब्दशः अस्वाभाविक हिन्दी में रखने के बजाय उसका अर्थ सहज रूप में दिया गया है; शाब्दिक रूप पाद-टिप्पणी में सुरक्षित है।
- issue: संदूक के नाम में עֵדוּת का अनुवाद
  choice: गवाही का संदूक
  alternative: वाचा का संदूक
  rationale: इस पद में मूल पाठ स्पष्ट रूप से ‘गवाही’ कहता है। परिचित पारंपरिक नाम ‘वाचा का संदूक’ प्रसंगगत रूप से संबद्ध है, पर यहाँ प्रयुक्त शब्द का सीधा अनुवाद नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और निर्देशात्मक शैली रखी गई है। मुख्य पाठ में तकनीकी पवित्र-स्थान संबंधी भेद स्पष्ट है। स्रोत-सामग्री में पाद-टिप्पणी संकेत अपने विषयों से हटे हुए थे; हिन्दी पाठ में [a] को ‘गवाही का संदूक’ और [b] को ‘परमपवित्र स्थान’ के साथ सही स्थान पर रखा गया है।
