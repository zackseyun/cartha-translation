lexical_decisions:
- source_word: קַרְסֵי נְחֹשֶׁת
  choice: काँसे के अंकुड़े
  rationale: קַרְסִים यहाँ परदों को जोड़ने वाले धातु के बंधन-साधन हैं; हिंदी में ‘अंकुड़े’ उनके आकार और कार्य को सहज रूप से व्यक्त करता है। נְחֹשֶׁת ताँबा या काँसा हो सकता है; पवित्र निवास के धातु-कार्य के संदर्भ में ‘काँसा’ उपयुक्त पारंपरिक चयन है।
- source_word: חֲמִשִּׁים
  choice: पचास
  rationale: यह अंकुड़ों की संख्या बताने वाली सामान्य गणनावाचक संख्या है।
- source_word: וְהֵבֵאתָ אֶת הַקְּרָסִים בַּלֻּלָאֹת
  choice: उन अंकुड़ों को फंदों में डालना
  rationale: בוא का हिफ़ील रूप यहाँ अंकुड़ों को फंदों के भीतर पहुँचाने या डालने का भाव देता है; ‘डालना’ आधुनिक हिंदी में स्वाभाविक और क्रिया की दृष्टि से स्पष्ट है।
- source_word: וְחִבַּרְתָּ אֶת הָאֹהֶל
  choice: तंबू के दोनों भागों को जोड़ देना
  rationale: חבר का अर्थ जोड़ना है। पिछले संदर्भ में दो अलग आवरण-समूह हैं; ‘दोनों भागों’ से हिंदी में निर्माण-क्रिया स्पष्ट होती है, जबकि वस्तु वही तंबू रहती है।
- source_word: וְהָיָה אֶחָד
  choice: ताकि वह एक हो जाए
  rationale: 'यह जोड़ने के परिणाम को व्यक्त करता है: अलग भाग मिलकर एक समग्र तंबू बनते हैं। ‘हो जाए’ इस परिणामी भाव को स्वाभाविक हिंदी में रखता है।'
