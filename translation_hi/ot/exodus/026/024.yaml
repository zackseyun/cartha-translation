base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/024.yaml
  text: They shall be paired at the bottom[a], and together they shall be complete at its top, to the first ring. So it shall be for both of them[c][b]; they shall be for the two corners.
translation:
  language: hi
  text: वे नीचे से एक-दूसरे के अनुरूप हों[a], और साथ-साथ उसके ऊपरी सिरे पर उस एक छल्ले तक पूर्ण हों[b][c]। उन दोनों के लिए ऐसा ही हो; वे दोनों कोनों के लिए हों।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘जोड़े में’, ‘जुड़वाँ’, अथवा ‘एक-दूसरे के अनुरूप’; हिब्रू शब्द दोनों तख्तों के मेल खाता जोड़ा होने का वर्णन करता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘सम्पूर्ण हों’ अथवा ‘ठीक से फिट हों’; हिब्रू शब्द यहाँ नैतिक सिद्धता नहीं, बल्कि संरचनात्मक पूर्णता का बोध देता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘पहले छल्ले तक’; हिब्रू में ‘उस एक छल्ले’ कहा गया है, जिसका सटीक स्थापत्य-संदर्भ निश्चित नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תֹאֲמִים
  choice: जोड़े में
  rationale: यह शब्द तख्तों के परस्पर अनुरूप जोड़ा बनने का बोध देता है। ‘जोड़े में’ आधुनिक हिन्दी में स्वाभाविक है और जोड़ने की सटीक बढ़ईगीरी-विधि तय नहीं करता।
- source_word: מִלְּמַטָּה
  choice: नीचे की ओर
  rationale: यह तख्तों के निचले सिरे को सूचित करता है; ‘नीचे की ओर’ स्थान-संबंधी अर्थ को सहज रूप से व्यक्त करता है।
- source_word: וְיַחְדָּו
  choice: दोनों मिलकर
  rationale: क्रियाविशेषण दोनों तख्तों के संयुक्त रूप से एक संरचना बनाने पर बल देता है।
- source_word: תַמִּים
  choice: पूरी तरह जुड़े
  rationale: यहाँ अर्थ नैतिक सिद्धता नहीं, बल्कि संरचनात्मक पूर्णता है। सन्दर्भानुकूल ‘पूरी तरह जुड़े’ इस भाव को स्पष्ट करता है, यद्यपि जोड़ की तकनीकी विधि निर्धारित नहीं करता।
- source_word: עַל רֹאשׁוֹ
  choice: ऊपर
  rationale: शाब्दिक ‘उसके सिर पर’ वास्तु-सन्दर्भ में ऊपरी सिरे को दर्शाता है; हिन्दी में ‘ऊपर’ स्वाभाविक है।
- source_word: אֶל הַטַּבַּעַת הָאֶחָת
  choice: एक ही छल्ले तक
  rationale: हिब्रू के निश्चित पद और संख्या को ‘एक ही छल्ले’ के रूप में रखा गया है; इससे ‘पहला छल्ला’ जैसी अनिश्चित व्याख्या आरोपित नहीं होती।
- source_word: כֵּן יִהְיֶה לִשְׁנֵיהֶם
  choice: उन दोनों के साथ ऐसा ही हो
  rationale: यह आदेश दोनों कोने के तख्तों पर समान निर्माण लागू करता है और हिन्दी में स्पष्ट है।
- source_word: לִשְׁנֵי הַמִּקְצֹעֹת
  choice: दोनों कोनों के लिए
  rationale: מִקְצֹעֹת का सीधा स्थानगत अर्थ ‘कोने’ है; पद स्वयं ‘पिछले’ या किसी विशिष्ट जोड़-प्रकार को नहीं कहता।
