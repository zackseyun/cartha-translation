  yaml_path: translation/ot/exodus/026/021.yaml
  text: 'and their forty bases shall be of silver: two bases under the one frame[b][a], and two bases under the other frame.'
translation:
  language: hi
  text: और उनके चाँदी के चालीस आधार[a] हों—एक तख्ते[b] के नीचे दो आधार और दूसरे तख्ते के नीचे दो आधार।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘खाँचे’; इब्रानी शब्द उन चाँदी के सहारों को दर्शाता है जिनमें पवित्र निवास के तख्ते टिकाए जाते थे।
    reason: lexical_alternative
  - marker: b
    text: या ‘पटिया’; इब्रानी शब्द पवित्र निवास के प्रत्येक खड़े संरचनात्मक काष्ठ-खंड के लिए प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַרְבָּעִים אַדְנֵי/הֶם כָּסֶף
  choice: और उनके चाँदी के चालीस आधार हों
  rationale: संयोजक וְ पिछले वाक्य से क्रम जारी रखता है। אֶדֶן यहाँ पवित्र निवास के तख्तों को थामने वाला चाँदी का आधार अथवा खाँचा है; आधुनिक हिन्दी में ‘आधार’ स्वाभाविक और संरचनात्मक अर्थ में स्पष्ट है।
- source_word: שְׁנֵי אֲדָנִים
  choice: दो आधार
  rationale: एक ही स्थापत्य शब्द के लिए पूरे पद में ‘आधार’ लगातार रखा गया है।
- source_word: תַּחַת
  choice: के नीचे
  rationale: यह प्रत्येक तख्ते के नीचे आधारों की भौतिक स्थिति को सीधे व्यक्त करता है।
- source_word: הַ/קֶּרֶשׁ
  choice: तख्ता
  rationale: קֶרֶשׁ पवित्र निवास के प्रत्येक खड़े संरचनात्मक काष्ठ-खंड को दर्शाता है। ‘तख्ता’ सामान्य आधुनिक हिन्दी में समझने योग्य है और ‘चौखटा’ की तरह पूर्ण आयताकार फ्रेम का भ्रामक बोध नहीं कराता।
- source_word: הָ/אֶחָד ... הָ/אֶחָד
  choice: एक तख्ते ... दूसरे तख्ते
  rationale: इब्रानी दोनों खंडों में शाब्दिक रूप से ‘उस एक तख्ते’ दोहराती है। प्रसंग में यह वितरणात्मक जोड़ी है; हिन्दी में ‘एक ... दूसरे’ उस आशय को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है, बिना संख्या या संरचना बदले।
