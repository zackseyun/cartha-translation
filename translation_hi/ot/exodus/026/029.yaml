  yaml_path: translation/ot/exodus/026/029.yaml
  text: You shall overlay the frames with gold[a], and you shall make their rings of gold as holders for the bars[b], and you shall overlay the bars with gold.
translation:
  language: hi
  text: तख्तों[a] को सोने से मढ़ना; उनके छल्ले सोने के बनाना, डंडों के लिए खाने[b] के रूप में; और डंडों को सोने से मढ़ना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘चौखटों’ अथवा ‘खड़े पटरों।’ इब्रानी शब्द पवित्र निवास की खड़ी संरचनात्मक इकाइयों को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘डंडों के लिए घर,’ अर्थात् वे खाने या धारक जिनमें डंडे लगाए जाते थे।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְּרָשִׁים
  choice: तख्तों
  rationale: कֶרֶשׁ यहाँ पवित्र निवास की खड़ी संरचनात्मक लकड़ी की इकाइयों को दर्शाता है। ‘तख्ते’ आधुनिक हिन्दी में स्वाभाविक और मूल के निकट है; ‘चौखटे’ उनके संरचनात्मक कार्य को अधिक स्पष्ट करता, पर आकार के विषय में अधिक व्याख्यात्मक हो सकता है।
- source_word: תְּצַפֶּה / וְצִפִּיתָ
  choice: सोने से मढ़ना
  rationale: पिएल रूप में צפה किसी वस्तु पर धातु की परत चढ़ाने का शिल्पगत अर्थ देता है। ‘मढ़ना’ हिन्दी में इस प्रक्रिया का स्पष्ट और स्वाभाविक शब्द है।
- source_word: זָהָב
  choice: सोना
  rationale: यह सामग्री का सीधा उल्लेख है। इब्रानी की पुनरावृत्ति के अनुरूप पद में सोने का उल्लेख तीनों स्थानों पर रखा गया है।
- source_word: טַבְּעֹתֵיהֶם
  choice: उनके छल्ले
  rationale: טַבַּעַת का सामान्य अर्थ ‘छल्ला’ है; यहाँ ये तख्तों से जुड़े वे धातु के छल्ले हैं जिनमें डंडे लगते थे।
- source_word: תַּעֲשֶׂה
  choice: बनाना
  rationale: עשה का सीधा अर्थ ‘बनाना’ है और निर्देशात्मक शैली में यह सहज हिन्दी देता है।
- source_word: בָּתִּים לַבְּרִיחִם
  choice: डंडों को थामने के लिए खाने
  rationale: शाब्दिक रूप ‘डंडों के लिए घर’ है। यहाँ בָּתִּים से आशय उन खानों या धारकों से है जिनमें डंडे लगाए जाते थे। ‘खाने’ रूपक को कुछ हद तक बनाए रखते हुए कार्य भी स्पष्ट करता है।
- source_word: הַבְּרִיחִם
  choice: डंडों
  rationale: בְּרִיחַ उन क्षैतिज लकड़ी के डंडों को दर्शाता है जो तख्तों को जोड़कर रखते थे। ‘डंडे’ सटीक और सामान्य हिन्दी है; ‘आड़े डंडे’ अधिक स्पष्ट पर कुछ अधिक व्याख्यात्मक है।
