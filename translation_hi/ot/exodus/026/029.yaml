  to: तख्तों[a] को सोने से मढ़ना; उनके छल्ले सोने के बनाना, डंडों के लिए खाने[b] के रूप में; और डंडों को सोने से मढ़ना।
  rationale: The complete text is revised conservatively to improve clause flow and to render ‘houses for the bars’ more closely as ‘डंडों के लिए खाने.’ The established formal instructional infinitives are retained to match the surrounding legal/instructional register, while semicolons make the three coordinated commands clear.
