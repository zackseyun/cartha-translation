translation:
  language: hi
  text: और तुम परमपवित्र स्थान में साक्षीपत्र के सन्दूक पर प्रायश्चित्त का ढक्कन[a] रखो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘दया-आसन’।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/נָתַתָּ
  choice: और तुम ... रखना
  rationale: संयोजक वाव के साथ काल रूप यहाँ निर्देशों की शृंखला में आज्ञार्थक बल रखता है। ‘तुम ... रखना’ आधुनिक हिन्दी में एकवचन सम्बोधन और निर्देश—दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַכַּפֹּרֶת
  choice: प्रायश्चित्त का ढक्कन
  rationale: यह वाचा-सन्दूक के ऊपर रखे जाने वाले विशेष आवरण का नाम है, जो प्रायश्चित्त से जुड़ा है। ‘ढक्कन’ वस्तु का स्वरूप स्पष्ट करता है और ‘प्रायश्चित्त’ उसके उपासना-संबंधी अर्थ को बनाए रखता है। पारम्परिक विकल्प पाद-टिप्पणी में दिया गया है।
- source_word: עַל
  choice: पर
  rationale: यह सम्बन्ध सन्दूक के ऊपर सीधे रखे जाने को दर्शाता है; हिन्दी में ‘पर’ इसका स्पष्ट और स्वाभाविक समतुल्य है।
- source_word: אֲרוֹן הָעֵדֻת
  choice: साक्षीपत्र का सन्दूक
  rationale: इब्रानी पाठ में ‘वाचा’ नहीं, ‘साक्षी’ है। निर्गमन के प्रसंग में यह साक्षी-लेख अथवा साक्षीपत्र से सम्बद्ध सन्दूक है; इसलिए मूल पदावली को पारम्परिक सामंजस्य के कारण बदला नहीं गया।
- source_word: בְּ/קֹדֶשׁ הַקֳּדָשִׁים
  choice: परमपवित्र स्थान में
  rationale: इब्रानी संज्ञा-समूह ‘पवित्रता की पवित्रता’ सामी भाषाओं की परमोत्कृष्टता-सूचक रचना है और निवासस्थान के सबसे भीतरी पवित्र कक्ष को बताता है। ‘परमपवित्र स्थान’ आधुनिक हिन्दी में स्पष्ट है।
theological_decisions:
- issue: כַּפֹּרֶת को पारम्परिक उपाधि के रूप में या वस्तु और कार्य स्पष्ट करने वाले पद से अनूदित करना
  choice: मुख्य पाठ में ‘प्रायश्चित्त का ढक्कन’
  alternative: ‘दया-आसन’
  rationale: मुख्य विकल्प वस्तु को सिंहासन के रूप में परिभाषित किए बिना उसके भौतिक स्वरूप और प्रायश्चित्त-संबंध को व्यक्त करता है। पारम्परिक धर्मवैचारिक पद को पाद-टिप्पणी में सुरक्षित रखा गया है।
- issue: אֲרוֹן הָעֵדֻת में ‘साक्षी’ को बनाए रखना या प्रचलित ‘वाचा का सन्दूक’ करना
  choice: ‘साक्षीपत्र का सन्दूक’
  alternative: ‘वाचा का सन्दूक’
  rationale: इस पद में मूल इब्रानी ‘साक्षी’ कहता है। ‘वाचा’ प्रसंग-संगत सम्बद्ध धारणा है, पर इस पद का प्रत्यक्ष शब्द नहीं; अतः मूल की विशिष्टता बनाए रखी गई है।
- issue: קֹדֶשׁ הַקֳּדָשִׁים का स्पष्ट आधुनिक या शाब्दिक पारम्परिक रूप
  choice: ‘परमपवित्र स्थान’
  alternative: ‘पवित्रों का पवित्रस्थान’
  rationale: चुना हुआ रूप इब्रानी परमोत्कृष्टता को स्पष्ट हिन्दी में व्यक्त करता है; अधिक शाब्दिक मुहावरा पाद-टिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। एकवचन सम्बोधन के लिए ‘तुम’ चुना गया है, ताकि ‘तू’ से उत्पन्न हो सकने वाला अवमाननापूर्ण आधुनिक भाव न आए। उपासना-सम्बन्धी तकनीकी शब्दों को यथासम्भव स्पष्ट रखा गया है और पारम्परिक विकल्प पाद-टिप्पणियों में दिए गए हैं।
