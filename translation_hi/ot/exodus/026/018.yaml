lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: तुम ... बनाना
  rationale: निर्देशात्मक प्रसंग में संयोजक सहित क़ाल पूर्ण रूप आज्ञा का भाव देता है। यह रचना आधुनिक हिन्दी में स्पष्ट और स्वाभाविक निर्देश व्यक्त करती है।
- source_word: הַקְּרָשִׁים
  choice: चौखटे
  rationale: यह शब्द पवित्र तम्बू के खड़े संरचनात्मक अंगों को दर्शाता है। ‘चौखटे’ उनके संरचनात्मक कार्य को व्यक्त करता है, जबकि ‘तख्ते’ भी सम्भव अर्थ है।
- source_word: לַמִּשְׁכָּן
  choice: पवित्र तम्बू के लिए
  rationale: निर्गमन के इस प्रसंग में מִשְׁכָּן उस पवित्र चलायमान निवास-स्थान का स्थापित संदर्भ है; ‘पवित्र तम्बू’ सामान्य हिन्दी पाठक के लिए स्पष्ट और स्वाभाविक है।
- source_word: עֶשְׂרִים קֶרֶשׁ
  choice: बीस चौखटे
  rationale: इब्रानी में संख्या के साथ संज्ञा एकवचन रूप में है, पर स्वाभाविक हिन्दी में बहुवचन ‘बीस चौखटे’ अपेक्षित है।
- source_word: לִפְאַת
  choice: भुजा के लिए
  rationale: स्थापत्य-वर्णन में פֵאָה किसी ओर या पार्श्व को सूचित करता है। ‘भुजा’ तम्बू के उस पार्श्व का स्पष्ट स्थानिक बोध कराती है।
- source_word: נֶגְבָּה תֵימָנָה
  choice: दक्षिण की ओर, दक्षिणी
  rationale: दोनों दिशासूचक शब्द दक्षिणी अभिमुखता को दोहराकर स्पष्ट करते हैं। हिन्दी में हल्की पुनरुक्ति रखकर मूल की पूर्णता और बल सुरक्षित रखा गया है।
