    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/צֶלַע
  choice: और ... पार्श्व के लिए
  rationale: संयोजक और पूर्वसर्ग अगली निर्माण-विधि को प्रस्तुत करते हैं। इस स्थापत्य संदर्भ में צֶלַע का अर्थ शरीर की ‘पसली’ नहीं, बल्कि निवास का पार्श्व है।
- source_word: הַמִּשְׁכָּן
  choice: निवास
  rationale: निर्गमन में מִשְׁכָּן पवित्र तंबू-धाम के लिए प्रयुक्त विशिष्ट शब्द है। ‘निवास’ उसके मूल अर्थ को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: הַשֵּׁנִית
  choice: दूसरे
  rationale: यह पिछले पद में बताए गए पहले लंबे पार्श्व के अनुरूप दूसरे पार्श्व को सूचित करता है।
- source_word: לִפְאַת צָפוֹן
  choice: उत्तर की ओर
  rationale: यह वाक्यांश स्थापत्य की दिशा बताता है; ‘उत्तर की ओर’ स्रोत की दिशात्मकता को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עֶשְׂרִים
  choice: बीस
  rationale: मूल पाठ की संख्या का सीधा अनुवाद।
- source_word: קָרֶשׁ
  choice: चौखटे
  rationale: यह शब्द निवास की दीवार बनाने वाले खड़े संरचनात्मक अवयवों को दर्शाता है। ‘चौखटे’ उनके संरचनात्मक कार्य को व्यक्त करता है; ‘तख्ते’ भी संभव है।
