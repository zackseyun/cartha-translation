  yaml_path: translation/ot/exodus/026/004.yaml
  text: And you shall make loops of blue on the edge of the one curtain at the end of the first set joined together[c][b][a]; and so you shall do on the edge of the outermost curtain in the second set joined together.
translation:
  language: hi
  text: और पहले जुड़े हुए समूह में सिरे पर स्थित उस एक पर्दे के किनारे पर नीले रंग की[a] फंदियाँ बनाओ; और इसी प्रकार दूसरे जुड़े हुए समूह के सबसे बाहरी पर्दे के किनारे पर भी बनाओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘नीले’ के लिए प्रयुक्त इब्रानी शब्द नील-बैंगनी रंग अथवा उस रंग से रँगी सामग्री को भी दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לֻלְאֹת
  choice: फंदियाँ
  rationale: यह शब्द पर्दों को जोड़ने के लिए लगाए जाने वाले फंदेनुमा बंधनों को दर्शाता है; आधुनिक हिन्दी में ‘फंदियाँ’ स्वाभाविक और स्पष्ट है।
- source_word: תְּכֵלֶת
  choice: नीले रंग की
  rationale: यह तंबू के वस्त्रों में प्रयुक्त विशिष्ट नीले अथवा नील-बैंगनी रंग की रँगी सामग्री को दर्शाता है। मूल में सामग्री का अलग संज्ञात्मक उल्लेख नहीं है, इसलिए मुख्य पाठ में रंगसूचक अभिव्यक्ति रखी गई है और रंग की सीमा पर पादटिप्पणी दी गई है।
- source_word: שְׂפַת
  choice: किनारे पर
  rationale: वस्त्र के संदर्भ में ‘किनारा’ सबसे सहज हिन्दी समतुल्य है।
- source_word: יְרִיעָה
  choice: पर्दा
  rationale: निर्गमन 26 में यह तंबू के वस्त्र-पटों को दर्शाता है; ‘पर्दा’ सामान्य पाठक के लिए स्पष्ट और प्रचलित है।
- source_word: הָאֶחָת ... מִקָּצָה בַּחֹבָרֶת
  choice: पहले जुड़े हुए समूह के सिरे पर जो पर्दा है
  rationale: हिब्रू की स्थान-संबंधी रचना को स्वाभाविक हिन्दी में व्यक्त किया गया है। ‘पहले’ समानांतर ‘दूसरे’ समूह से संदर्भानुसार स्पष्ट होता है।
- source_word: חֹבָרֶת / מַחְבֶּרֶת
  choice: जुड़ा हुआ समूह
  rationale: दोनों निकट-संबंधी शब्द कई पर्दों को जोड़कर बनी एक इकाई बताते हैं; समान हिन्दी अनुवाद उनका संबंध बनाए रखता है।
- source_word: וְכֵן
  choice: और इसी प्रकार
  rationale: यह समान निर्देश को दूसरी इकाई पर लागू करता है और हिन्दी में स्पष्ट संक्रमण देता है।
- source_word: הַקִּיצוֹנָה
  choice: सबसे बाहरी
  rationale: यह समूह के छोर अथवा बाहरी स्थान वाले पर्दे को बताता है; ‘सबसे बाहरी’ उसकी स्थितिगत भूमिका स्पष्ट करता है।
- source_word: הַשֵּׁנִית
  choice: दूसरे
  rationale: यह दो जुड़े हुए समूहों में दूसरे समूह को स्पष्ट रूप से चिन्हित करता है।
