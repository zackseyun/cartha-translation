  text: Each board is to have two tenons joined one to another[a]; this is how you shall make all the boards of the tabernacle.
translation:
  language: hi
  text: हर तख़्ते में दो चूलें हों, जो एक-दूसरे से जुड़ी हुई हों।[a] निवास के सभी तख़्ते तुम इसी प्रकार बनाना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में शाब्दिक रूप से: “एक तख़्ते के लिए दो हाथ, जुड़े हुए, एक स्त्री अपनी बहन की ओर।” यहाँ “हाथ” से तख़्ते से निकली हुई जोड़ की चूलें अभिप्रेत हैं।'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדוֹת
  choice: चूलें
  rationale: शाब्दिक अर्थ ‘हाथ’ है, पर बढ़ईगीरी के इस संदर्भ में इससे तख़्ते के नीचे निकले हुए वे जोड़ अभिप्रेत हैं जो आधारों में बैठते हैं। ‘चूलें’ हिंदी में इस संरचनात्मक जोड़ का संक्षिप्त और उपयुक्त नाम है।
- source_word: מְשֻׁלָּבֹת
  choice: अनुरूप हों
  rationale: यह निष्क्रिय कृदंत दोनों चूलों के परस्पर संगत या समानांतर रूप से व्यवस्थित होने को बताता है। ‘अनुरूप’ जोड़ की ठीक-ठीक अज्ञात बनावट को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: אִשָּׁה אֶל אֲחֹתָהּ
  choice: एक-दूसरे के
  rationale: शाब्दिक मुहावरा ‘एक स्त्री अपनी बहन की ओर’ समान वस्तुओं के परस्पर संबंध या अनुरूपता को व्यक्त करता है। सहज हिंदी में ‘एक-दूसरे के’ वही संबंध बताता है।
- source_word: קֶרֶשׁ
  choice: तख़्ता
  rationale: निवास की खड़ी लकड़ी की संरचनात्मक इकाई के लिए ‘तख़्ता’ स्वाभाविक है और ‘चौखटा’ जैसी अधिक व्याख्यात्मक धारणा नहीं जोड़ता।
- source_word: מִשְׁכָּן
  choice: निवास
  rationale: मूल संज्ञा का अर्थ ‘निवास’ है और निर्गमन के संदर्भ में यह पवित्र चलायमान निवास का विशिष्ट नाम बनती है। हिंदी में ‘निवास’ मूल रूपक को सुरक्षित रखता है।
- source_word: כֵּן תַּעֲשֶׂה
  choice: तुम इसी प्रकार बनाना
  rationale: यह सभी तख़्तों के लिए उसी नमूने का पालन करने का सीधा निर्देश है; यह रूप आधुनिक हिंदी में स्पष्ट और आदेशात्मक है।
- source_word: שְׁתֵּי
  choice: दो
  rationale: चूलों की संख्या बताने वाला सीधा अंकवाचक अनुवाद।
- source_word: לַקֶּרֶשׁ הָאֶחָד
  choice: हर तख़्ते में
  rationale: यद्यपि रूपतः ‘एक तख़्ते के लिए’ है, संदर्भ में भाव वितरणात्मक है और प्रत्येक तख़्ते पर लागू होता है। ‘हर तख़्ते में’ इसे स्वाभाविक हिंदी में व्यक्त करता है।
