  yaml_path: translation/ot/exodus/026/030.yaml
  text: And you shall set up the tabernacle according to its ordinance[a], which you were shown on the mountain.
translation:
  language: hi
  text: और पवित्र निवास को उसकी निर्धारित रीति के अनुसार खड़ा करना, जैसा तुम्हें पर्वत पर दिखाया गया था[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक इब्रानी: “जो तुमने पर्वत पर देखी थी।”'
    reason: इब्रानी में क्रिया सक्रिय है; मुख्य पाठ संदर्भ में निहित भाव को स्वाभाविक हिन्दी में ‘तुम्हें ... दिखाया गया था’ कहकर व्यक्त करता है।
lexical_decisions:
- source_word: וַהֲקֵמֹתָ
  choice: खड़ा करना
  rationale: हिफ़ील रूप का अर्थ किसी वस्तु को खड़ा करना या स्थापित करना है। इस निर्देशात्मक संदर्भ में ‘खड़ा करना’ तंबू-सदृश संरचना के लिए स्वाभाविक और स्रोत के निकट है।
- source_word: הַמִּשְׁכָּן
  choice: पवित्र निवास
  rationale: מִשְׁכָּן का मूल अर्थ ‘निवास’ है और निर्गमन में यह परमेश्वर के पवित्र तंबू-निवास का विशिष्ट नाम है। ‘पवित्र निवास’ आधुनिक पाठक के लिए अर्थ स्पष्ट रखते हुए धार्मिक संदर्भ को सुरक्षित रखता है।
- source_word: כְּמִשְׁפָּטוֹ
  choice: उसकी निर्धारित रीति के अनुसार
  rationale: מִשְׁפָּט यहाँ न्यायिक ‘निर्णय’ नहीं, बल्कि निर्धारित व्यवस्था, विधि या विन्यास को सूचित करता है। यह अनुवाद निर्माण-संबंधी संदर्भ के अनुकूल है और केवल दृश्य ‘नमूने’ तक अर्थ को सीमित नहीं करता।
- source_word: אֲשֶׁר הָרְאֵיתָ
  choice: जो तुम्हें ... दिखाई गई थी
  rationale: इब्रानी रूप शाब्दिक रूप से ‘जो तुमने देखी’ है; संदर्भ में मूसा को वह निर्धारित रीति दिखाई गई थी। मुख्य पाठ में स्वाभाविक हिन्दी के लिए निहित दिखाए जाने का भाव व्यक्त किया गया है, और शाब्दिक रूप पाद-टिप्पणी में सुरक्षित है।
- source_word: בָּהָר
  choice: पर्वत पर
  rationale: स्थानवाचक בְּ इस संदर्भ में ‘पर’ के रूप में स्वाभाविक है और सीनै पर्वत पर मूसा की स्थिति को व्यक्त करता है।
