translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और निर्देशात्मक रखी गई है। ‘करना’ आज्ञार्थक भविष्य-निर्देश का स्वाभाविक हिन्दी रूप है। ‘निर्धारित रीति’ स्रोत के विधि/विन्यास संबंधी अर्थ-विस्तार को बनाए रखती है।
