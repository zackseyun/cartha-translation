source:
  edition: WLC
  text: וַ/יֹּאמְר֨וּ אֲלֵ/הֶ֜ם בְּנֵ֣י יִשְׂרָאֵ֗ל מִֽי יִתֵּ֨ן מוּתֵ֤/נוּ בְ/יַד יְהוָה֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם בְּ/שִׁבְתֵּ֨/נוּ֙ עַל סִ֣יר הַ/בָּשָׂ֔ר בְּ/אָכְלֵ֥/נוּ לֶ֖חֶם לָ/שֹׂ֑בַע כִּֽי הוֹצֵאתֶ֤ם אֹתָ֨/נוּ֙ אֶל הַ/מִּדְבָּ֣ר הַ/זֶּ֔ה לְ/הָמִ֛ית אֶת כָּל הַ/קָּהָ֥ל הַ/זֶּ֖ה בָּ/רָעָֽב־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/003.yaml
  text: And the sons of Israel said to them[a], “If only we had died by the hand of Yahweh in the land of Egypt, when we sat by the pots of meat, when we ate bread to the full[c][b]. For you have brought us out into this wilderness to kill this whole assembly with hunger.”
translation:
  language: hi
  text: तब इस्राएलियों ने उनसे कहा, “काश, हम मिस्र देश में ही यहोवा के हाथ से मर गए होते, जब हम मांस की हाँड़ियों के पास बैठते और भरपेट रोटी खाते थे! क्योंकि तुम हमें इस वीराने में इसलिए निकाल लाए हो कि इस पूरी सभा को भूख से मार डालो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएली
  rationale: हिब्रू का शाब्दिक रूप ‘इस्राएल के पुत्र’ है, पर यहाँ यह पूरे जातीय समुदाय का प्रचलित पद है; आधुनिक हिन्दी में ‘इस्राएली’ स्वाभाविक और समावेशी अर्थ को स्पष्ट रखता है।
- source_word: מִי יִתֵּן מוּתֵנוּ
  choice: काश, हम ... मर गए होते
  rationale: מִי יִתֵּן यहाँ वास्तविक प्रश्न नहीं, बल्कि अतीत के विषय में तीव्र और असंभव इच्छा व्यक्त करने वाला मुहावरा है।
- source_word: בְיַד יְהוָה
  choice: यहोवा के हाथ से
  rationale: कारण या कर्तृत्व दर्शाने वाले हिब्रू मुहावरे ‘के हाथ से’ को बनाए रखा गया है; यह शिकायत की तीव्रता भी व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिवाचक दिव्य नाम YHWH को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: בְּשִׁבְתֵּנוּ עַל סִיר הַבָּשָׂר
  choice: जब हम मांस की हाँड़ियों के पास बैठते
  rationale: ठोस चित्र और कालवाचक उपवाक्य दोनों सुरक्षित हैं। ‘हाँड़ियाँ’ भोजन पकाने के बड़े पात्रों के लिए सहज हिन्दी है।
- source_word: בְּאָכְלֵנוּ לֶחֶם לָשֹׂבַע
  choice: भरपेट रोटी खाते थे
  rationale: לָשֹׂבַע का तृप्ति तक खाने का भाव संक्षिप्त और स्वाभाविक हिन्दी ‘भरपेट’ से व्यक्त होता है।
- source_word: הַמִּדְבָּר הַזֶּה
  choice: इस वीराने में
  rationale: מִדְבָּר का आशय निर्जन वन्य प्रदेश है; ‘वीराना’ आधुनिक हिन्दी में इसे सहजता से व्यक्त करता है और केवल रेतीले मरुस्थल तक अर्थ सीमित नहीं करता।
- source_word: לְהָמִית
  choice: मार डालो
  rationale: हिफ़ील रूप के कारणवाचक और आरोपात्मक बल को सीधी आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: כָּל הַקָּהָל הַזֶּה
  choice: इस पूरी सभा को
  rationale: קָהָל के संगठित जनसमूह के भाव के लिए ‘सभा’ उपयुक्त है और मूल की सामूहिक अभिव्यक्ति को बनाए रखता है।
- source_word: בָּרָעָב
  choice: भूख से
  rationale: यहाँ अकाल या भुखमरी से मृत्यु का साधन बताया गया है; ‘भूख से’ मूल के निकट और स्वाभाविक है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में उपाधि नहीं बल्कि चार अक्षरों वाला व्यक्तिवाचक दिव्य नाम है। हिन्दी बाइबलीय प्रयोग में परिचित रूप ‘यहोवा’ चुना गया; उच्चारण का वैकल्पिक विद्वत् पुनर्निर्माण ‘याहवे’ है।
- issue: ‘यहोवा के हाथ से’ में दिव्य कर्तृत्व
  choice: मूल मुहावरे को बनाए रखना
  alternative: ‘यहोवा के कारण’ अथवा केवल ‘यहोवा से’
  rationale: वक्ता इच्छा जता रहे हैं कि वे मिस्र में यहोवा के हाथ से मर गए होते। अनुवाद इसे न तो दिव्य दंड के रूप में अधिक स्पष्ट करता है, न सामान्य मृत्यु बनाकर इसका धर्मवैचारिक तनाव मिटाता है।
- issue: בְּנֵי יִשְׂרָאֵל की सामुदायिक पहचान
  choice: इस्राएली
  alternative: इस्राएल के पुत्र
  rationale: यह पुरुषों तक सीमित संदर्भ नहीं, बल्कि पूरे समुदाय का वंशगत नाम है। ‘इस्राएली’ प्रतिनिधिक सामुदायिक अर्थ को बिना अनावश्यक लैंगिक संकीर्णता के व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, मौखिक शिकायत के अनुरूप तीखी, फिर भी गरिमापूर्ण रखी गई है। वाक्य-संरचना हिब्रू की कारणात्मक प्रगति को बनाए रखती है। कोई पाद-टिप्पणी आवश्यक नहीं समझी गई, इसलिए मुख्य पाठ में कोई पाद-टिप्पणी चिह्न नहीं है।
