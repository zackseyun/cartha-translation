base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/029.yaml
  text: See[a], for Yahweh has given you the Sabbath; therefore on the sixth day he gives you bread for two days. Let each man stay in his place; let no man go out from his place on the seventh day.
translation:
  language: hi
  text: देखो, याहवे ने तुम्हें सब्त दिया है; इसलिए छठे दिन वह तुम्हें दो दिनों के लिए रोटी देता है। हर व्यक्ति[a] अपने स्थान पर रहे; सातवें दिन कोई भी अपने स्थान से बाहर न निकले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “हर पुरुष” और फिर “कोई पुरुष” है; यहाँ पुल्लिंग रूप समुदाय के प्रत्येक व्यक्ति के लिए वितरणात्मक अर्थ में प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאוּ
  choice: देखो
  rationale: बहुवचन आज्ञार्थक रूप का सीधा आह्वान बनाए रखता है; आगे का कारण इस देखने को पहचानने या समझने का भाव भी देता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम का देवनागरी लिप्यंतरण है; इसे किसी उपाधि से नहीं बदला गया।
- source_word: נָתַן לָכֶם הַשַּׁבָּת
  choice: तुम्हें सब्त दिया है
  rationale: पूर्ण क्रिया सब्त को दी हुई भेंट या व्यवस्था के रूप में प्रस्तुत करती है।
- source_word: עַל כֵּן
  choice: इसलिए
  rationale: कारण से परिणाम का स्पष्ट और स्वाभाविक संबंध व्यक्त करता है।
- source_word: לֶחֶם יוֹמָיִם
  choice: दो दिनों के लिए रोटी
  rationale: ‘रोटी’ के ठोस अर्थ को बनाए रखते हुए इब्रानी ‘दो दिनों की रोटी’ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שְׁבוּ אִישׁ תַּחְתָּיו
  choice: हर व्यक्ति अपने स्थान पर रहे
  rationale: यहाँ ישב का अर्थ केवल बैठना नहीं, बल्कि वहीं ठहरे रहना है; תַּחְתָּיו प्रसंग में ‘अपने स्थान पर’ का मुहावरेदार भाव देता है।
- source_word: אַל יֵצֵא אִישׁ מִמְּקֹמוֹ
  choice: कोई भी अपने स्थान से बाहर न निकले
  rationale: निषेधात्मक आज्ञा को स्पष्ट हिन्दी में व्यक्त करता है और ‘स्थान’ की पुनरावृत्ति बनाए रखता है।
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: सातवें दिन
  rationale: इब्रानी क्रमसूचक अभिव्यक्ति का सीधा और पर्याप्त अनुवाद है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है; लिप्यंतरण उसे उपाधि में बदलने से बचाता है।
- issue: אִישׁ का समुदाय के प्रत्येक सदस्य के लिए वितरणात्मक प्रयोग
  choice: हर व्यक्ति / कोई भी
  alternative: हर पुरुष / कोई पुरुष
  rationale: इस आदेश में पुल्लिंग एकवचन रूप समुदाय के प्रत्येक सदस्य पर वितरणात्मक रूप से लागू है। स्वाभाविक हिन्दी में ‘व्यक्ति’ और ‘कोई भी’ यह व्यापक प्रयोजन स्पष्ट करते हैं, जबकि पादटिप्पणी मूल रूप की जानकारी सुरक्षित रखती है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। वाक्य की आदेशात्मक स्पष्टता तथा कारण-परिणाम संबंध बनाए रखे गए हैं; ‘सब्त’ प्रचलित बाइबिलीय शब्द के रूप में रखा गया है।
