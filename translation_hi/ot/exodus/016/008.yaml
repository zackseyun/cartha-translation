base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/008.yaml
  text: And Moses said[a], “When Yahweh gives you meat to eat in the evening and bread in the morning to the full, because Yahweh hears your grumblings that you are grumbling against him—what are we? Your grumblings are not against us, but against Yahweh.”
translation:
  language: hi
  text: और मूसा ने कहा, “जब यहोवा तुम्हें शाम को खाने के लिए मांस और सुबह तृप्त होने के लिए रोटी देगा—क्योंकि यहोवा तुम्हारी उन शिकायतों को सुनता है जो तुम उसके विरुद्ध करते हो[a]—हम क्या हैं? तुम्हारी शिकायतें हमारे विरुद्ध नहीं, बल्कि यहोवा के विरुद्ध हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में एक ही मूल से बनी संज्ञा और क्रिया की पुनरावृत्ति है: “तुम्हारी शिकायतें ... जो तुम शिकायत करते हो।” यह पुनरावृत्ति आरोप पर जोर देती है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּתֵת
  choice: जब ... देगा
  rationale: בְּ के साथ infinitive construct यहाँ समयसूचक परिस्थिति बताता है; आधुनिक हिन्दी में ‘जब ... देगा’ स्वाभाविक है और कथन के भावी संदर्भ को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה को किसी उपाधि से बदलने के बजाय प्रचलित हिन्दी लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: בָּשָׂר
  choice: मांस
  rationale: भोजन के इस प्रसंग में ‘मांस’ सहज और सटीक अर्थ देता है।
- source_word: לֶחֶם
  choice: रोटी
  rationale: यह ठोस खाद्य-चित्र को बनाए रखता है और आधुनिक हिन्दी में सामान्य पाठक के लिए स्वाभाविक है।
- source_word: לִשְׂבֹּעַ
  choice: पेट भर खाने के लिए
  rationale: שׂבע से बना यह रूप तृप्त होने या भरपेट खाने का भाव व्यक्त करता है; हिन्दी में यह प्रयोग स्पष्ट और स्वाभाविक है।
- source_word: בִּשְׁמֹעַ
  choice: क्योंकि ... सुनता है
  rationale: 'यहाँ वाक्य-संबंध कारणसूचक समझा गया है: यहोवा उनकी शिकायतें सुनकर प्रबंध करता है।'
- source_word: תְּלֻנֹּתֵיכֶם / מַלִּינִם
  choice: तुम्हारी ... शिकायतें ... जो तुम ... करते रहते हो
  rationale: संज्ञा और उसी मूल की क्रिया की पुनरावृत्ति को हिन्दी में ‘शिकायतें ... करते रहते हो’ द्वारा बनाए रखा गया है; ‘रहते हो’ लगातार असंतोष का भाव भी देता है।
- source_word: עָלָיו
  choice: उसके विरुद्ध
  rationale: इस प्रसंग में עַל शिकायत की विरोधी दिशा दिखाता है, केवल उसके विषय को नहीं।
- source_word: וְנַחְנוּ מָה
  choice: तो हम क्या हैं?
  rationale: ‘क्या’ मूसा और हारून की नगण्यता पर बल देता है; ‘कौन’ की अपेक्षा यह इब्रानी अभिव्यक्ति के अधिक निकट है।
- source_word: לֹא עָלֵינוּ תְלֻנֹּתֵיכֶם כִּי עַל יְהוָה
  choice: तुम्हारी शिकायतें हमारे विरुद्ध नहीं, बल्कि यहोवा के विरुद्ध हैं
  rationale: ‘नहीं, बल्कि’ मूल के स्पष्ट विरोध को स्वाभाविक हिन्दी में व्यक्त करता है; स्पष्टता के लिए विधेय ‘हैं’ लगाया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में उपाधि नहीं बल्कि चतुरक्षरीय व्यक्तिगत नाम है। हिन्दी पाठकों में व्यापक रूप से पहचाने जाने वाले रूप ‘यहोवा’ को अपनाते हुए नाम को नाम के रूप में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी की सहज, गरिमापूर्ण शैली अपनाई गई है। मूल की लंबी कारणसूचक संरचना और उसके अलंकारिक प्रश्न को डैश के सहारे सुरक्षित रखा गया है। ‘पेट भर खाने के लिए रोटी’ सामान्य पाठक के लिए तृप्ति का आशय स्पष्ट करता है।
