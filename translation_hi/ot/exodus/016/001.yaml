base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/001.yaml
  text: They set out from Elim[a], and the whole congregation of the sons of Israel came to the wilderness of Sin, which is between Elim and Sinai[b], on the fifteenth day of the second month after they had gone out from the land of Egypt.
translation:
  language: hi
  text: वे एलीम से रवाना हुए, और इस्राएलियों की पूरी सभा[a] मिस्र देश से उनके निकलने के बाद दूसरे महीने के पंद्रहवें दिन सीन[b] के निर्जन प्रदेश में पहुँची, जो एलीम और सीनै के बीच है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘इस्राएल की संतानों की पूरी सभा’। यह पूरे इस्राएली समुदाय का प्रचलित राष्ट्रीय नाम है, केवल पुरुषों का नहीं।
    reason: lexical_alternative
  - marker: b
    text: ‘सीन’ यहाँ एक स्थान का नाम है—सीन का निर्जन प्रदेश। यह ‘सीनै’ से अलग नाम है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: वे ... से रवाना हुए
  rationale: जंगल-यात्रा के संदर्भ में נסע का अर्थ पड़ाव छोड़कर आगे चलना है। ‘रवाना हुए’ आधुनिक और स्वाभाविक हिन्दी में यह भाव स्पष्ट करता है।
- source_word: מֵאֵילִם
  choice: एलीम से
  rationale: אֵילִם स्थान का नाम है; इसे अनुवाद करने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: וַיָּבֹאוּ
  choice: पहुँची
  rationale: בוא यहाँ यात्रा के गंतव्य पर आने का सामान्य क्रियापद है। हिन्दी में ‘पहुँची’ कथानक का क्रम स्वाभाविक रूप से व्यक्त करता है।
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों की पूरी सभा
  rationale: כָּל עֲדַת का सामुदायिक भाव ‘पूरी सभा’ से व्यक्त होता है। בְּנֵי יִשְׂרָאֵל का शाब्दिक रूप ‘इस्राएल की संतान’ है, पर यहाँ यह समूचे राष्ट्र का प्रचलित नाम है; इसलिए मुख्य पाठ में स्वाभाविक ‘इस्राएलियों’ और शाब्दिक जानकारी हेतु पादटिप्पणी रखी गई है।
- source_word: אֶל מִדְבַּר סִין
  choice: सीन के निर्जन प्रदेश में
  rationale: מִדְבַּר बसावट से बाहर का सूखा या निर्जन भूभाग बताता है; ‘निर्जन प्रदेश’ इसे केवल रेतीला मरुस्थल मान लेने से बचाता है। סִין स्थान-नाम है।
- source_word: אֲשֶׁר בֵּין אֵילִם וּבֵין סִינָי
  choice: जो एलीम और सीनै के बीच है
  rationale: यह मूल का सीधा भौगोलिक संबंधवाचक उपवाक्य है।
- source_word: בַּחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ הַשֵּׁנִי
  choice: दूसरे महीने का पंद्रहवाँ दिन
  rationale: इब्रानी तिथि-विन्यास को सहज आधुनिक हिन्दी तिथि-विन्यास में व्यक्त किया गया है।
- source_word: לְצֵאתָם מֵאֶרֶץ מִצְרָיִם
  choice: मिस्र देश से उनके निकलने के बाद
  rationale: לְ के साथ क्रियार्थक संज्ञा यहाँ निर्गमन को तिथि का संदर्भ-बिंदु बनाती है। ‘के बाद’ इस काल-संबंध को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
