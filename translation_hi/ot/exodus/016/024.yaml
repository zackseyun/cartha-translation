  text: उन्होंने उसे सुबह तक रख छोड़ा, जैसा मूसा ने आज्ञा दी थी। उसमें न दुर्गंध आई और न ही कीड़े[a] पड़े।
  philosophy: optimal-equivalence
  footnotes:
