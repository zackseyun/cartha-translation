    text: या, “मक्खियों के लार्वे।” इब्रानी शब्द सामान्य रूप से सड़ते हुए पदार्थ में पाए जाने वाले कृमि-जैसे जीवों को दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּנִּיחוּ אֹתוֹ
  choice: उन्होंने उसे ... रख छोड़ा
  rationale: संदर्भ में मन्ना के उस भाग को रात भर सुरक्षित रखने का भाव है। ‘रख छोड़ा’ क्रिया और एकवचन सर्वनाम, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עַד הַבֹּקֶר
  choice: सुबह तक
  rationale: यह समय-सीमा बताने वाला सीधा और स्वाभाविक हिन्दी प्रयोग है।
- source_word: כַּאֲשֶׁר צִוָּה מֹשֶׁה
  choice: मूसा की आज्ञा के अनुसार
  rationale: यह तुलना और पहले दी गई आज्ञा के अनुरूप किए गए कार्य—दोनों को संक्षेप में व्यक्त करता है।
- source_word: הִבְאִישׁ
  choice: दुर्गंध आई
  rationale: क्रिया का अर्थ बदबूदार या दुर्गंधयुक्त हो जाना है। यह पिछले दिन के मन्ना के बिगड़ने से स्पष्ट विरोध बनाए रखता है।
- source_word: רִמָּה
  choice: कीड़े
  rationale: इब्रानी संज्ञा सड़ते पदार्थ में पाए जाने वाले कृमि-जैसे जीवों के लिए प्रयुक्त हो सकती है। ‘कीड़े’ व्यापक, सहज और स्रोत की अनिर्दिष्टता के अनुरूप है।
- source_word: לֹא הָיְתָה בּוֹ
  choice: न ही ... पड़े
  rationale: शाब्दिक अस्तित्ववाचक अर्थ ‘उसमें नहीं थे’ को मन्ना में कीड़े पड़ने के स्वाभाविक हिन्दी मुहावरे में व्यक्त किया गया है।
