source:
  edition: WLC
  text: וַ/יְהִ֣י בַּ/יּ֣וֹם הַ/שִּׁשִּׁ֗י לָֽקְט֥וּ לֶ֨חֶם֙ מִשְׁנֶ֔ה שְׁנֵ֥י הָ/עֹ֖מֶר לָ/אֶחָ֑ד וַ/יָּבֹ֨אוּ֙ כָּל נְשִׂיאֵ֣י הָֽ/עֵדָ֔ה וַ/יַּגִּ֖ידוּ לְ/מֹשֶֽׁה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/022.yaml
  text: And it happened on the sixth day that they gathered twice as much bread[a], two omers for each person, and all the leaders of the congregation came and told Moses.
translation:
  language: hi
  text: और छठे दिन ऐसा हुआ कि उन्होंने दुगुनी रोटी इकट्ठी की—हर एक के लिए दो ओमेर[a]। तब समुदाय के सभी प्रधानों ने आकर मूसा को यह बात बताई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ओमेर प्राचीन इस्राएल में सूखी वस्तुओं को मापने की एक इकाई थी।
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי
  choice: और ... ऐसा हुआ
  rationale: यह कथात्मक wayyiqtol नए घटनाक्रम का परिचय देता है; यह रूप स्वाभाविक आधुनिक हिन्दी में उसके कथात्मक कार्य को बनाए रखता है।
- source_word: בַּיּוֹם הַשִּׁשִּׁי
  choice: छठे दिन
  rationale: निश्चित कालवाचक पद का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: לָקְטוּ
  choice: इकट्ठी की
  rationale: मन्ना को बटोरने या एकत्र करने के अर्थ में प्रयुक्त לקט का सहज हिन्दी अनुवाद।
- source_word: לֶחֶם
  choice: रोटी
  rationale: यद्यपि प्रसंग में वस्तु मन्ना है, इब्रानी पाठ לֶחֶם कहता है; 'रोटी' मूल शब्दावली और मन्ना को रोटी कहने वाली व्यापक विषयवस्तु को सुरक्षित रखता है।
- source_word: מִשְׁנֶה
  choice: दुगुनी
  rationale: यह शब्द सामान्य मात्रा की अपेक्षा दोहरी मात्रा बताता है; आगे दिया गया 'दो ओमेर' इसे स्पष्ट करता है।
- source_word: שְׁנֵי הָעֹמֶר
  choice: दो ओमेर
  rationale: प्राचीन सूखी वस्तुओं की माप को अनुमानित आधुनिक इकाई में बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: לָאֶחָד
  choice: हर एक के लिए
  rationale: शाब्दिक रूप से 'एक के लिए', पर यहाँ इसका प्रयोग वितरणात्मक है; यह हिन्दी रूप उस अर्थ को स्पष्ट रखता है।
- source_word: כָּל נְשִׂיאֵי הָעֵדָה
  choice: समुदाय के सभी प्रधानों
  rationale: נְשִׂיאִים मान्य मुखियाओं या अगुवों को और עֵדָה संगठित समुदाय को दर्शाता है; 'प्रधान' अधिकारयुक्त नेतृत्व का भाव बनाए रखता है।
- source_word: וַיָּבֹאוּ ... וַיַּגִּידוּ לְמֹשֶׁה
  choice: आकर मूसा को यह बात बताई
  rationale: आने और फिर बताने की क्रिया-श्रृंखला को स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
