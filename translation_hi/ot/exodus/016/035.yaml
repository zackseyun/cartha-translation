base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/035.yaml
  text: And the sons of Israel ate the manna forty years[a], until they came to an inhabited land[c][b]; they ate the manna until they came to the border of the land of Canaan.
translation:
  language: hi
  text: इस्राएली चालीस वर्ष तक मन्ना खाते रहे,[a] जब तक वे एक बसे हुए देश में नहीं पहुँचे। वे मन्ना तब तक खाते रहे, जब तक वे कनान देश की सीमा पर नहीं पहुँचे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘इस्राएल के पुत्र’; यह इस्राएल की प्रजा के लिए एक प्रचलित इब्रानी पद है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: इस्राएली
  rationale: यह इब्रानी में शाब्दिक रूप से ‘इस्राएल के पुत्र’ है, पर यहाँ समूचे वाचा-समुदाय का प्रचलित जातिनाम है; आधुनिक हिन्दी में ‘इस्राएली’ स्वाभाविक और समावेशी है।
- source_word: אָכְלוּ אֶת הַמָּן
  choice: मन्ना खाते रहे
  rationale: दोहराए गए सारांश-वाक्य और चालीस वर्ष की अवधि के कारण हिन्दी का निरंतर भूतकाल दीर्घकालीन क्रिया को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אַרְבָּעִים שָׁנָה
  choice: चालीस वर्ष तक
  rationale: अवधि को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עַד בֹּאָם
  choice: जब तक वे ... नहीं पहुँचे
  rationale: इब्रानी की समय-सीमा को हिन्दी की स्वाभाविक ‘जब तक ... नहीं’ रचना में व्यक्त किया गया है; ‘पहुँचे’ בוא के संदर्भगत अर्थ को बिना ‘प्रवेश किया’ जैसा अतिरिक्त अर्थ जोड़े देता है।
- source_word: אֶל אֶרֶץ נוֹשָׁבֶת
  choice: एक बसे हुए देश में
  rationale: נוֹשָׁבֶת निर्जन जंगल के विपरीत मानव-निवास वाले, बसे हुए भूभाग को दर्शाता है।
- source_word: אֶל קְצֵה אֶרֶץ כְּנָעַן
  choice: कनान देश की सीमा पर
  rationale: קְצֵה का अर्थ किनारा, छोर या सीमा हो सकता है; भौगोलिक संदर्भ में ‘सीमा’ सबसे स्वाभाविक है और मूल की अर्थ-सीमा बनाए रखता है।
