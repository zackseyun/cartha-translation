source:
  edition: WLC
  text: וַ/יָּמֹ֣דּוּ בָ/עֹ֔מֶר וְ/לֹ֤א הֶעְדִּיף֙ הַ/מַּרְבֶּ֔ה וְ/הַ/מַּמְעִ֖יט לֹ֣א הֶחְסִ֑יר אִ֥ישׁ לְ/פִֽי אָכְל֖/וֹ לָקָֽטוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/018.yaml
  text: When they measured it by the omer[a], the one who gathered much had nothing left over, and the one who gathered little had no lack; each one gathered according to what he could eat.
translation:
  language: hi
  text: जब उन्होंने उसे ओमेर[a] से नापा, तो जिसने अधिक बटोरा था, उसके पास कोई अधिशेष नहीं रहा, और जिसने थोड़ा बटोरा था, उसे कोई कमी नहीं हुई।[b] हर एक ने अपने खाने की मात्रा के अनुसार बटोरा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ओमेर सूखी वस्तुएँ नापने की एक प्राचीन इस्राएली इकाई थी।
    reason: अपरिचित प्राचीन माप-इकाई की संक्षिप्त सांस्कृतिक व्याख्या।
  - marker: b
    text: या, “जिसके पास अधिक था, उसके पास कोई अधिकता न रही, और जिसके पास थोड़ा था, उसे कोई कमी न हुई।”
    reason: इब्रानी कृदंतों और अधिकता/कमी की क्रियाओं की वैकल्पिक, परिणाम-केंद्रित अभिव्यक्ति।
lexical_decisions:
- source_word: וַיָּמֹדּוּ
  choice: जब उन्होंने ... नापा
  rationale: वाव-क्रम कथा को आगे बढ़ाता है, पर यह उपवाक्य आगे आने वाले परिणाम की समयगत भूमिका निभाता है; इसलिए आधुनिक हिन्दी में ‘जब’ स्वाभाविक है।
- source_word: בָעֹמֶר
  choice: ओमेर से
  rationale: עֹמֶר सूखी वस्तुओं की प्राचीन माप-इकाई है। इकाई को बदले बिना ‘से’ द्वारा मापने के मानक/साधन का भाव व्यक्त किया गया है।
- source_word: הֶעְדִּיף
  choice: उसके पास कुछ भी अधिक न निकला
  rationale: हिफ़ील क्रिया यहाँ बचत, अधिकता या अधिशेष होने का भाव देती है। नापने के बाद के परिणाम को हिन्दी में स्पष्ट और सहज रूप से व्यक्त किया गया है।
- source_word: הַמַּרְבֶּה
  choice: जिसने अधिक बटोरा था
  rationale: रूपतः यह ‘अधिक करने वाला’ कृदंत है; मन्ना बटोरने के निकट संदर्भ से निहित क्रिया ‘बटोरा’ स्पष्ट की गई है।
- source_word: הֶחְסִיר
  choice: उसे कोई कमी न हुई
  rationale: क्रिया का अर्थ कम पड़ना या अभाव होना है। यह पहले खंड की अधिकता के साथ संतुलित विरोध प्रस्तुत करता है।
- source_word: הַמַּמְעִיט
  choice: जिसने थोड़ा बटोरा था
  rationale: रूपतः ‘कम करने वाला’ है; संदर्भ के आधार पर बटोरने की निहित क्रिया स्पष्ट की गई और समानांतर रचना बनाए रखी गई है।
- source_word: אִישׁ
  choice: हर एक
  rationale: यहाँ पुल्लिंग एकवचन शब्द समूह के प्रत्येक व्यक्ति के लिए वितरणात्मक रूप से प्रयुक्त है; ‘हर एक’ उसी बल को बिना केवल पुरुषों तक सीमित किए व्यक्त करता है।
- source_word: לְפִי אָכְלוֹ
  choice: जितना वह खा सकता था
  rationale: शाब्दिक संरचना ‘उसके खाने के मुँह/अनुपात के अनुसार’ आवश्यक उपभोग की मात्रा का मुहावरा है; चुना हुआ रूप आधुनिक हिन्दी में स्पष्ट है।
- source_word: לָקָטוּ
  choice: बटोरा था
  rationale: मन्ना के वृत्तांत में לקט वस्तुएँ चुनकर इकट्ठी करने की सामान्य क्रिया है; ‘बटोरना’ हिन्दी में इस प्रसंग के लिए सटीक और स्वाभाविक है।
theological_decisions:
- issue: אִישׁ ... אָכְלוֹ में वितरणात्मक पुल्लिंग एकवचन
  choice: ‘हर एक ... जितना वह खा सकता था’
  alternative: ‘हर पुरुष ... अपने खाने के अनुसार’ अथवा बहुवचन ‘सबने ... जितना वे खा सकते थे’
  rationale: इब्रानी पुल्लिंग एकवचन रूपों को वितरणात्मक ढंग से रखती है। हिन्दी में ‘हर एक’ पूरे समुदाय के प्रत्येक सदस्य को समेटता है, जबकि ‘वह’ मूल की एकवचन संरचना बनाए रखता है और अनावश्यक पुरुष-मात्र अर्थ से बचाता है।
- issue: הַמַּרְבֶּה और הַמַּמְעִיט में क्रिया का निहित होना
  choice: संदर्भानुसार ‘अधिक/थोड़ा बटोरा था’
  alternative: ‘जिसके पास अधिक/थोड़ा था’
  rationale: कृदंत अपने आप में ‘अधिक करने वाला/कम करने वाला’ कह सकते हैं, पर निकट संदर्भ बटोरने का है। मुख्य पाठ में संदर्भगत क्रिया स्पष्ट की गई है, और वैकल्पिक परिणाम-केंद्रित अभिव्यक्ति पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘ओमेर’ को लिप्यंतरित कर मूल सांस्कृतिक इकाई सुरक्षित रखी गई है; ‘बटोरा’ मन्ना चुनकर इकट्ठा करने के प्रसंग में सामान्य पाठक के लिए स्वाभाविक है।
