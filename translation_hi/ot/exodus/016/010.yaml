id: EXO.16.10
reference: Exodus 16:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יְהִ֗י כְּ/דַבֵּ֤ר אַהֲרֹן֙ אֶל כָּל עֲדַ֣ת בְּנֵֽי יִשְׂרָאֵ֔ל וַ/יִּפְנ֖וּ אֶל הַ/מִּדְבָּ֑ר וְ/הִנֵּה֙ כְּב֣וֹד יְהוָ֔ה נִרְאָ֖ה בֶּ/עָנָֽן־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/010.yaml
  text: And it happened[a], as Aaron spoke to the whole congregation of the sons of Israel, that they turned toward the wilderness, and behold[b], the glory of Yahweh appeared in the cloud.
translation:
  language: hi
  text: और ऐसा हुआ कि जब हारून इस्राएल के पुत्रों[a] की सारी मंडली से बोल रहा था, तब वे जंगल की ओर मुड़े; और देखो, बादल में याहवे की महिमा दिखाई दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात ‘इस्राएलियों’।
    reason: मूल इब्रानी में शाब्दिक रूप से ‘इस्राएल के पुत्र’ है; इसका सामुदायिक अर्थ सभी इस्राएली हो सकता है।
lexical_decisions:
- source_word: וַיְהִי
  choice: और ऐसा हुआ कि
  rationale: यह इब्रानी कथात्मक सूत्र अगले घटनाक्रम का परिचय देता है। यह रूप उसके कथात्मक कार्य को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: כְּדַבֵּר
  choice: जब ... बोल रहा था
  rationale: כְּ के साथ infinitive construct समकालिकता व्यक्त करता है; हिन्दी का अपूर्ण पक्ष दिखाता है कि हारून के बोलते समय ही लोग मुड़े।
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों की सारी मंडली
  rationale: עֵדָה के सामुदायिक अर्थ को ‘मंडली’ और בְּנֵי יִשְׂרָאֵל की पुत्र-संबंधी अभिव्यक्ति को ‘इस्राएल के पुत्र’ द्वारा सुरक्षित रखा गया है।
- source_word: וַיִּפְנוּ אֶל הַמִּדְבָּר
  choice: वे जंगल की ओर मुड़े
  rationale: פנה के साथ אֶל दिशा की ओर मुड़ने को व्यक्त करता है; ‘जंगल की ओर’ हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: यह ध्यान आकृष्ट करने वाला संकेतक है, जो अचानक सामने आए दृश्य की नाटकीयता को बनाए रखता है।
- source_word: כְּבוֹד יְהוָה
  choice: याहवे की महिमा
  rationale: כָּבוֹד यहाँ परमेश्वर की प्रत्यक्ष प्रकट महिमा को सूचित करता है, और יְהוָה को व्यक्तिगत नाम ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: נִרְאָה
  choice: दिखाई दी
  rationale: ראה का निफ़अल रूप यहाँ दृश्य रूप से प्रकट होने का अर्थ देता है; ‘दिखाई दी’ हिन्दी में सहज है और महिमा के व्याकरणिक लिंग के अनुरूप है।
- source_word: בֶּעָנָן
  choice: बादल में
  rationale: उपसर्ग में निश्चित उपपद समाहित है और प्रसंग परिचित बादल की ओर संकेत करता है; हिन्दी में प्रसंग से निश्चितता स्पष्ट रहती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
- issue: בְּנֵי יִשְׂרָאֵל का रूप
  choice: इस्राएल के पुत्र
  alternative: इस्राएली
  rationale: मुख्य पाठ मूल की पुत्र-संबंधी और पुल्लिंग बहुवचन अभिव्यक्ति को सुरक्षित रखता है; पादटिप्पणी उसका स्वाभाविक सामुदायिक अर्थ बताती है।
- issue: याहवे की महिमा का बादल में दिखाई देना
  choice: बादल में याहवे की महिमा दिखाई दी
  alternative: बादल के भीतर याहवे की महिमा प्रकट हुई
  rationale: पाठ दृश्य प्राकट्य बताता है, पर उसकी ठीक प्रकृति या बादल और महिमा के संबंध को विस्तार से परिभाषित नहीं करता; अनुवाद उसी संयम को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मंडली’, ‘महिमा’ और ‘याहवे’ जैसे मुख्य बाइबलीय पद स्रोत की धार्मिक और साहित्यिक गंभीरता बनाए रखते हैं; ‘और देखो’ הִנֵּה की ध्यानाकर्षक शक्ति को व्यक्त करता है।
