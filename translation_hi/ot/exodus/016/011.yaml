base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/011.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: hi
  text: तब यहोवा ने मूसा से कहा,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: तब … ने … कहा
  rationale: वाव-क्रमिक रूप कथा में अगली घटना प्रस्तुत करता है; हिंदी में प्रत्यक्ष वचन से पहले ‘कहा’ स्वाभाविक है और דּבר के वाक्-अर्थ को स्पष्ट रखता है। ‘तब’ कथात्मक क्रम व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुराक्षरीय परमेश्वर-नाम को हिंदी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: אֶל־מֹשֶׁה
  choice: मूसा से
  rationale: भाषण के संबोधित व्यक्ति को आधुनिक स्वाभाविक हिंदी में ‘से’ के द्वारा व्यक्त किया जाता है।
- source_word: לֵאמֹר
  choice: कहा
  rationale: यह इब्रानी वचन-परिचय सूत्र है। हिंदी में ‘यह कहते हुए कहा’ अनावश्यक पुनरुक्ति होगी; इसलिए मुख्य क्रिया के साथ समाहित ‘कहा’ आगामी प्रत्यक्ष वचन का स्वाभाविक परिचय देता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ व्यक्तिगत परमेश्वर-नाम का प्रयोग करता है। ‘यहोवा’ हिंदी पाठकों में स्थापित लिप्यंतरण है और नाम को ‘प्रभु’ जैसी उपाधि से नहीं बदलता; ‘याहवे’ अधिक संभावित विद्वत पुनर्निर्मित उच्चारण है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिंदी। इब्रानी सूत्र का शब्दशः पुनरावर्तन न करके स्वाभाविक हिंदी वचन-परिचय अपनाया गया है।
