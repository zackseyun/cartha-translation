base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/026.yaml
  text: For six days you shall gather it[a], but on the seventh day, a Sabbath[c][b], there will be none.
translation:
  language: hi
  text: छह दिन तक तुम उसे बटोरोगे, पर सातवाँ दिन विश्राम-दिन[a] है; उस दिन वह नहीं मिलेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल में संक्षेपतः, “सातवाँ दिन—विश्राम-दिन।”
    reason: मूल इब्रानी की संक्षिप्त समानाधिकरणीय रचना को दिखाने के लिए।
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: छह दिन तक
  rationale: यह कालावधि बताने वाला स्वाभाविक हिन्दी प्रयोग है और इब्रानी पदबंध के अर्थ को ठीक रखता है।
- source_word: תִּלְקְטֻהוּ
  choice: तुम उसे बटोरोगे
  rationale: לקט का अर्थ बिखरी वस्तु को चुनकर इकट्ठा करना है; यहाँ कर्म-प्रत्यय उस मन्ना की ओर संकेत करता है जिसका उल्लेख संदर्भ में है।
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: पर सातवें दिन
  rationale: ו सामान्यतः ‘और’ हो सकता है, पर यहाँ पहले छह दिनों के साथ स्पष्ट विरोध होने के कारण ‘पर’ स्वाभाविक है।
- source_word: שַׁבָּת
  choice: विश्राम-दिन होगा
  rationale: שַׁבָּת सातवें दिन को विश्राम के लिए अलग दिन बताता है। हिन्दी में ‘विश्राम-दिन’ अर्थ स्पष्ट करता है, जबकि पादटिप्पणी मूल की संक्षिप्त पद-संरचना सुरक्षित रखती है।
- source_word: לֹא יִהְיֶה בּוֹ
  choice: उस दिन वह नहीं मिलेगा
  rationale: शाब्दिक अर्थ ‘उसमें/उस दिन वह नहीं होगा’ है। निकट संदर्भ से निहित कर्ता मन्ना है; हिन्दी में ‘वह नहीं मिलेगा’ संग्रह करने के संदर्भ को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: सीनै से पहले के प्रसंग में שַׁבָּת का अनुवाद
  choice: विश्राम-दिन
  alternative: सब्त
  rationale: यह चयन शब्द के मूल विश्राम-संबंधी अर्थ को सामान्य हिन्दी पाठक के लिए स्पष्ट करता है और बाद की संस्थागत या सांप्रदायिक धारणाएँ अनावश्यक रूप से आरोपित नहीं करता।
- issue: לֹא יִהְיֶה בּוֹ में निहित कर्ता
  choice: ‘वह’ को संदर्भानुसार मन्ना समझते हुए ‘उस दिन वह नहीं मिलेगा’
  alternative: ‘उसमें कुछ नहीं होगा’
  rationale: इब्रानी में वस्तु स्पष्ट रूप से दोहराई नहीं गई है। सर्वनामात्मक ‘वह’ इस निहित संदर्भ को बनाए रखता है, जबकि ‘नहीं मिलेगा’ बटोरने के प्रसंग में स्वाभाविक हिन्दी है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथनात्मक शैली। ‘बटोरोगे’ ग्रामीण या पुरातन हुए बिना मन्ना चुनकर इकट्ठा करने की क्रिया को सटीक व्यक्त करता है।
