base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/015.yaml
  text: When the sons of Israel saw it[a], they said to one another, “What is it?” For they did not know what it was. And Moses said to them[b], “It is the bread that Yahweh has given you to eat.”
translation:
  language: hi
  text: जब इस्राएलियों ने उसे देखा, तो उन्होंने एक-दूसरे से कहा[a], “यह क्या है?”[b] क्योंकि वे नहीं जानते थे कि वह क्या था। तब मूसा ने उनसे कहा, “यह वही रोटी है जिसे याहवे ने तुम्हें खाने के लिए दिया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “एक व्यक्ति अपने भाई से।” यह एक-दूसरे से कहने का मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: “यह क्या है?” के पीछे का इब्रानी पद पारंपरिक रूप से “मन्ना” नाम से जोड़ा जाता है।
    reason: wordplay
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएली
  rationale: शाब्दिक रूप ‘इस्राएल के पुत्र’ है, पर यहाँ यह पूरे समुदाय का प्रचलित जातीय नाम है। ‘इस्राएली’ आधुनिक हिन्दी में स्वाभाविक और समावेशी है।
- source_word: אִישׁ אֶל־אָחִיו
  choice: एक-दूसरे से
  rationale: शाब्दिक रूप ‘एक पुरुष ने अपने भाई से’ है; प्रसंग में यह परस्पर बातचीत का इब्रानी मुहावरा है।
- source_word: מָן הוּא
  choice: यह क्या है?
  rationale: अगला उपवाक्य स्पष्ट करता है कि लोग उस पदार्थ को पहचान नहीं पाए थे। इसलिए इसे यहाँ नाम के बजाय प्रश्न के रूप में रखना उचित है।
- source_word: לֹא יָדְעוּ מַה הוּא
  choice: वे नहीं जानते थे कि वह क्या था
  rationale: यह लोगों के प्रश्न का सीधा कथात्मक स्पष्टीकरण है और मूल की अनिश्चितता बनाए रखता है।
- source_word: הוּא הַלֶּחֶם
  choice: यह वही रोटी है
  rationale: सर्वनाम और निश्चित संज्ञा उस दिखाई पड़े पदार्थ की पहचान परमेश्वर द्वारा दी गई रोटी के रूप में कराते हैं; ‘वही’ हिन्दी में इस पहचान को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार-अक्षरीय व्यक्तिगत दिव्य नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: לְאָכְלָה
  choice: खाने के लिए
  rationale: यह उद्देश्य व्यक्त करता है और आधुनिक हिन्दी में संक्षिप्त तथा सहज है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम है। ‘याहवे’ उसका सीधा हिन्दी लिप्यंतरण है और उसे उपाधि में नहीं बदलता।
- issue: מָן को इसी स्थान पर व्यक्तिवाचक नाम मानना या प्रश्न
  choice: प्रश्न के रूप में ‘यह क्या है?’
  alternative: मुख्य पाठ में ‘मन्ना’
  rationale: इसके तुरंत बाद कहा गया है कि वे नहीं जानते थे कि वह क्या था; अतः कथानक में यह प्रश्न है। बाद में प्रचलित ‘मन्ना’ नाम से इसका संबंध पाद-टिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। सामुदायिक अर्थ के लिए ‘इस्राएली’ और परस्पर कथन के लिए ‘एक-दूसरे से’ चुना गया है। ‘रोटी’ यहाँ व्यापक अर्थ में भोजनरूपी आहार को दर्शाती है, जैसा मूल לֶחֶם में है।
