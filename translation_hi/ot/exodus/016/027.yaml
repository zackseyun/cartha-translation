  text: וַֽ/יְהִי֙ בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֔י יָצְא֥וּ מִן הָ/עָ֖ם לִ/לְקֹ֑ט וְ/לֹ֖א מָצָֽאוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/027.yaml
  text: And it happened on the seventh day that some of the people went out to gather[a], but they found none.
translation:
  language: hi
  text: और सातवें दिन ऐसा हुआ कि लोगों में से कुछ बटोरने के लिए बाहर गए, पर उन्हें कुछ नहीं मिला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: और ऐसा हुआ
  rationale: यह कथात्मक क्रम को आगे बढ़ाने वाला सामान्य इब्रानी प्रयोग है; हिंदी में यह स्वाभाविक ढंग से अगले घटनाक्रम का परिचय देता है।
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: सातवें दिन
  rationale: मूल पाठ केवल ‘सातवें दिन’ कहता है; ‘सप्ताह के’ जोड़ना अनावश्यक है।
- source_word: יָצְאוּ
  choice: बाहर गए
  rationale: यह छावनी अथवा निवास-स्थान से बाहर जाने के सामान्य अर्थ को व्यक्त करता है।
- source_word: מִן הָעָם
  choice: लोगों में से कुछ
  rationale: מן का अंशवाचक प्रयोग बताता है कि पूरे समुदाय ने नहीं, बल्कि उसके कुछ लोगों ने ऐसा किया।
- source_word: לִלְקֹט
  choice: बटोरने के लिए
  rationale: לקט का अर्थ बीनना या बटोरना है; प्रसंग से मन्ना वस्तु के रूप में स्पष्ट है, इसलिए उसे जोड़ना आवश्यक नहीं।
- source_word: וְלֹא מָצָאוּ
  choice: पर उन्हें कुछ नहीं मिला
  rationale: शाब्दिक अर्थ ‘और उन्होंने नहीं पाया’ है; उद्देश्य विफल होने के कारण हिंदी में ‘पर’ स्वाभाविक विरोध व्यक्त करता है, और ‘कुछ नहीं मिला’ निहित वस्तु को बिना नाम दिए बनाए रखता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण और कथात्मक। ‘लोगों में से कुछ’ के द्वारा मूल इब्रानी का अंशवाचक भाव मुख्य पाठ में ही स्पष्ट कर दिया गया है, इसलिए पादटिप्पणी आवश्यक नहीं है।
