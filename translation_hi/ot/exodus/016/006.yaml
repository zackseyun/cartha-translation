source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ וְ/אַהֲרֹ֔ן אֶֽל כָּל בְּנֵ֖י יִשְׂרָאֵ֑ל עֶ֕רֶב וִֽ/ידַעְתֶּ֕ם כִּ֧י יְהוָ֛ה הוֹצִ֥יא אֶתְ/כֶ֖ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/006.yaml
  text: Then Moses and Aaron said to all the sons of Israel[a], “At evening you will know that Yahweh brought you out from the land of Egypt.”
translation:
  language: hi
  text: तब मूसा और हारून ने सभी इस्राएलियों से कहा, “साँझ को तुम जान जाओगे कि याहवे तुम्हें मिस्र देश से निकाल लाया।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमागत कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है। एकवचन क्रिया संयुक्त कर्ता मूसा और हारून के कथन को इब्रानी मुहावरे के अनुसार प्रस्तुत करती है।
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: मूसा और हारून
  rationale: हिन्दी बाइबल परंपरा में प्रचलित और आसानी से पहचाने जाने वाले नाम-रूप।
- source_word: אֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के सभी लोगों से
  rationale: शाब्दिक अर्थ ‘इस्राएल के सभी पुत्रों से’ है, पर यह स्थापित सामुदायिक पद पूरे इस्राएली समुदाय को दर्शाता है। ‘लोगों’ से आशय आधुनिक हिन्दी में स्पष्ट रहता है और अनावश्यक रूप से केवल पुरुषों तक सीमित नहीं लगता।
- source_word: עֶרֶב
  choice: साँझ को
  rationale: यह संज्ञा यहाँ कालवाचक रूप में प्रयुक्त है; ‘साँझ को’ संक्षिप्त, स्वाभाविक और अर्थ के निकट है।
- source_word: וִידַעְתֶּם
  choice: तुम जान जाओगे
  rationale: भविष्य में प्राप्त होने वाले निश्चित ज्ञान को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: כִּי
  choice: कि
  rationale: यह उस बात की विषय-वस्तु आरम्भ करता है जिसे लोग जानेंगे।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में व्यापक रूप से प्रचलित नाम-रूप ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: הוֹצִיא אֶתְכֶם
  choice: तुम्हें ... से निकाल लाया है
  rationale: हिफ़ील रूप का अर्थ ‘बाहर निकालना/ले आना’ है। हिन्दी में ‘निकाल लाया है’ उद्धार की पूरी हुई घटना और वर्तमान पहचान से उसके संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: मिस्र देश से
  rationale: ‘देश’ द्वारा אֶרֶץ को स्पष्ट रखा गया है और वाक्यांश हिन्दी में सहज है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम सीधे आया है। हिन्दी पाठकों में स्थापित ‘यहोवा’ नाम को रखा गया है; इसे ‘प्रभु’ जैसी उपाधि से नहीं बदला गया।
- issue: הוֹצִיא का काल-पक्ष
  choice: निकाल लाया है
  alternative: निकाल लाया
  rationale: इब्रानी पूर्ण क्रिया निर्गमन की सम्पन्न घटना बताती है। हिन्दी का पूर्ण वर्तमान उस सम्पन्न कार्य की वर्तमान प्रासंगिकता दर्शाता है, जबकि साधारण भूत भी व्याकरणतः संभव है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। ‘इस्राएल के सभी लोगों’ से सामुदायिक आशय स्पष्ट किया गया है; कोई पादटिप्पणी आवश्यक नहीं मानी गई।
