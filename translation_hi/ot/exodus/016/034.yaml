base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/034.yaml
  text: As Yahweh commanded Moses[a], so Aaron placed it before the testimony for safekeeping.
translation:
  language: hi
  text: जैसा यहोवा ने मूसा को आज्ञा दी थी, वैसा ही हारून ने उसे सुरक्षित रखने के लिए साक्ष्य[a] के सामने रख दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वाचा का साक्ष्य।” यहाँ “साक्ष्य” पवित्रस्थान से जुड़ा एक तकनीकी शब्द है, जो विशेष रूप से वाचा की पटियाओं या उनसे संबंधित वस्तु की ओर संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: जैसा ... वैसा ही
  rationale: आज्ञा और हारून के कार्य के बीच अनुरूपता को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: צִוָּה
  choice: आज्ञा दी थी
  rationale: ईश्वरीय आदेश का अधिकारपूर्ण भाव बनाए रखता है; पूर्वकालिक क्रिया को हिन्दी में सहज रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के विशिष्ट नाम को हिन्दी की प्रचलित बाइबलीय वर्तनी में प्रत्यक्ष रूप से प्रस्तुत करता है।
- source_word: אֶל מֹשֶׁה
  choice: मूसा को
  rationale: हिन्दी में आज्ञा पाने वाले व्यक्ति को व्यक्त करने का स्वाभाविक रूप।
- source_word: וַיַּנִּיחֵהוּ
  choice: हारून ने उसे ... रख दिया
  rationale: वस्तु को निर्धारित स्थान पर रखने की पूर्ण क्रिया को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: לִפְנֵי
  choice: के सामने
  rationale: स्थान-संबंधी अर्थ को सीधा रखता है और पवित्रस्थान के संदर्भ में उपयुक्त है।
- source_word: הָעֵדֻת
  choice: साक्ष्य
  rationale: यह पवित्रस्थान-संबंधी तकनीकी शब्द है; अनुवाद उसकी व्यापकता को बनाए रखता है और उसे केवल पटियाओं तक सीमित नहीं करता।
- source_word: לְמִשְׁמָרֶת
  choice: सुरक्षित रखने के लिए
  rationale: संरक्षण के उद्देश्य को आधुनिक, स्पष्ट हिन्दी में व्यक्त करता है और स्मारक होने का अतिरिक्त विचार नहीं जोड़ता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: विशिष्ट वाचा-नाम को सामान्य उपाधि से बदलने के बजाय नाम के रूप में रखा गया है; हिन्दी पाठकों में प्रचलित रूप 'यहोवा' चुना गया।
- issue: הָעֵדֻת का संदर्भ
  choice: साक्ष्य
  alternative: वाचा का साक्ष्य / साक्ष्य की पटियाएँ
  rationale: मूल तकनीकी पद स्वयं संक्षिप्त और कुछ हद तक संदर्भ-निर्भर है; मुख्य पाठ में उसकी वास्तविक व्यापकता और अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। 'जैसा ... वैसा ही' से मूल की तुलना स्पष्ट होती है, जबकि 'साक्ष्य' को तकनीकी पद के रूप में बनाए रखकर अनावश्यक व्याख्यात्मक सीमांकन से बचा गया है।
