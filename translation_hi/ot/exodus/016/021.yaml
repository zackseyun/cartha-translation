  yaml_path: translation/ot/exodus/016/021.yaml
  text: And they gathered it morning by morning[a], each according to what he could eat; but when the sun grew hot, it melted.
translation:
  language: hi
  text: वे उसे हर सुबह बटोरते थे; हर व्यक्ति उतना ही बटोरता था जितना वह खा सकता था। जब सूरज तेज हो जाता था, तो वह पिघल जाता था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּלְקְטוּ
  choice: बटोरते थे
  rationale: לָקַט भोजन जैसी वस्तुओं को इकट्ठा करने या बटोरने के लिए प्रयुक्त होता है। प्रसंग में बार-बार होने वाली क्रिया को दिखाने के लिए अपूर्ण भूतकाल का प्रयोग किया गया है।
- source_word: אֹתוֹ
  choice: उसे
  rationale: पुल्लिंग एकवचन कर्मवाचक सर्वनाम पिछले प्रसंग के मन्ना की ओर संकेत करता है; मूल की तरह यहाँ संज्ञा को दोहराया नहीं गया है।
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: सुबह-दर-सुबह
  rationale: दोहराव का भाव वितरणात्मक और नियमित है। यह अभिव्यक्ति मूल की पुनरुक्ति और ‘हर सुबह’ के अर्थ, दोनों को स्वाभाविक हिन्दी में बनाए रखती है।
- source_word: אִישׁ
  choice: हर व्यक्ति
  rationale: אִישׁ यहाँ वितरणात्मक अर्थ में है। ‘हर व्यक्ति’ आधुनिक हिन्दी में स्वाभाविक है और समुदाय के प्रत्येक सदस्य का आशय स्पष्ट करता है।
- source_word: כְּפִי אָכְלוֹ
  choice: अपने खाने के अनुसार
  rationale: शाब्दिक रूप से ‘उसके खाने के मुँह के अनुसार’ एक इब्रानी मुहावरा है, जिसका अर्थ प्रत्येक की खाने की मात्रा या आवश्यकता के अनुपात में है। मुख्य पाठ में संक्षिप्त अभिव्यक्ति रखी गई और शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: וְחַם הַשֶּׁמֶשׁ
  choice: जब सूरज गरम हो जाता
  rationale: क्रिया सूर्य के गरम होने को बताती है और प्रसंग में कालगत संबंध व्यक्त करती है। हिन्दी में ‘जब’ इस संबंध को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: וְנָמָס
  choice: तो वह पिघल जाता था
  rationale: מָסַס का यहाँ उपयुक्त अर्थ ‘पिघलना’ है। आदतन घटने वाली घटना के कारण ‘जाता था’ प्रयुक्त हुआ है।
