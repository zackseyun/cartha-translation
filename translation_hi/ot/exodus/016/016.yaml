source:
  edition: WLC
  text: זֶ֤ה הַ/דָּבָר֙ אֲשֶׁ֣ר צִוָּ֣ה יְהוָ֔ה לִקְט֣וּ מִמֶּ֔/נּוּ אִ֖ישׁ לְ/פִ֣י אָכְל֑/וֹ עֹ֣מֶר לַ/גֻּלְגֹּ֗לֶת מִסְפַּר֙ נַפְשֹׁ֣תֵי/כֶ֔ם אִ֛ישׁ לַ/אֲשֶׁ֥ר בְּ/אָהֳל֖/וֹ תִּקָּֽחוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/016.yaml
  text: 'This is the word that Yahweh has commanded: ‘Gather from it[a], each man according to his eating; an omer per person, according to the number of your persons. Each man shall take for those who are in his tent.’'
translation:
  language: hi
  text: 'यहोवा की आज्ञा यह है: “तुम उसमें से बटोरो; हर पुरुष अपने खाने के अनुसार बटोरे—तुम्हारे लोगों की संख्या के अनुसार प्रति व्यक्ति[a] एक ओमेर। हर पुरुष अपने तंबू में रहनेवालों के लिए ले।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “प्रति सिर।”
    reason: मूल לַגֻּלְגֹּלֶת का ठोस शाब्दिक रूप बताने के लिए।
lexical_decisions:
- source_word: זֶה הַדָּבָר אֲשֶׁר צִוָּה
  choice: की आज्ञा यह है
  rationale: शाब्दिक संरचना ‘यह वह बात है जिसकी आज्ञा...’ हिन्दी में असहज है। यह रूप कथित आदेश के अर्थ और सूत्रात्मक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण से प्रस्तुत किया गया है।
- source_word: לִקְטוּ מִמֶּנּוּ
  choice: तुम उसमें से बटोरो
  rationale: לקט बिखरी खाद्य-वस्तु एकत्र करने का बोध देता है; ‘बटोरो’ मन्ना के प्रसंग में सटीक और स्वाभाविक है। मִמֶּנּוּ का संकेत पहले उल्लिखित मन्ना की ओर है।
- source_word: אִישׁ לְפִי אָכְלוֹ
  choice: हर पुरुष अपने खाने के अनुसार
  rationale: אִישׁ के पुल्लिंग एकवचन और उसके वितरणात्मक अर्थ को ‘हर पुरुष’ से रखा गया है। לְפִי אָכְלוֹ मात्रा को उस व्यक्ति के उपभोग के अनुसार निर्धारित करता है; अनावश्यक रूप से इसे ‘आवश्यकता’ या ‘भूख’ नहीं बनाया गया।
- source_word: עֹמֶר
  choice: एक ओमेर
  rationale: यह एक विशिष्ट प्राचीन सूखी माप है; अनिश्चित आधुनिक समतुल्य देने के बजाय इसका लिप्यंतरण किया गया है।
- source_word: לַגֻּלְגֹּלֶת
  choice: प्रति व्यक्ति[a]
  rationale: शाब्दिक अर्थ ‘प्रति सिर’ है और यहाँ गणना में प्रत्येक व्यक्ति का बोध देता है। मुख्य पाठ में स्वाभाविक हिन्दी रखकर शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: מִסְפַּר נַפְשֹׁתֵיכֶם
  choice: तुम्हारे लोगों की गिनती के अनुसार
  rationale: נֶפֶשׁ यहाँ अमूर्त ‘आत्मा’ नहीं बल्कि गिने जाने वाले व्यक्तियों को दर्शाता है। ‘तुम्हारे लोगों’ से समूह के व्यक्तियों का अर्थ स्पष्ट रहता है।
- source_word: אִישׁ לַאֲשֶׁר בְּאָהֳלוֹ תִּקָּחוּ
  choice: हर पुरुष अपने तंबू में रहनेवालों के लिए ले
  rationale: ठोस ‘तंबू’ की छवि बनाए रखी गई है और उसे केवल ‘परिवार’ मानकर सीमित नहीं किया गया। बहुवचन आदेश का वितरणात्मक प्रयोग हिन्दी में ‘हर पुरुष...ले’ से स्वाभाविक रूप में व्यक्त होता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे आया है। ‘यहोवा’ उसे उपाधि से प्रतिस्थापित किए बिना हिन्दी पाठक के लिए परिचित रूप में सुरक्षित रखता है।
- issue: אִישׁ का वितरणात्मक पुल्लिंग
  choice: हर पुरुष
  alternative: हर व्यक्ति / हर एक
  rationale: ‘हर पुरुष’ मूल के व्याकरणिक पुल्लिंग को बनाए रखता है; फिर भी तंबू में रहनेवालों के बारे में वाक्य को ‘परिवार’ तक सीमित नहीं किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण आज्ञार्थक शैली अपनाई गई है। ‘बटोरो,’ ‘ओमेर,’ और ‘तंबू’ प्रसंग की ठोस भाषा को बनाए रखते हैं। पादटिप्पणी का चिह्न उसी पदांश ‘प्रति व्यक्ति’ पर लगाया गया है जिसका वह शाब्दिक विकल्प बताती है।
