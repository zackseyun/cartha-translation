  yaml_path: translation/ot/exodus/016/013.yaml
  text: And in the evening the quail came up and covered the camp[a], and in the morning a layer of dew was around the camp.
translation:
  language: hi
  text: शाम को बटेरें आकर छावनी पर छा गईं, और सुबह छावनी के चारों ओर ओस की एक परत पड़ी थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בָעֶרֶב
  choice: शाम को
  rationale: यह कथात्मक क्रम में समय बताता है। ‘शाम को ऐसा हुआ’ अधिक शब्दशः है, पर आधुनिक हिन्दी में ‘शाम को’ स्वाभाविक और अर्थपूर्ण है।
- source_word: וַתַּעַל הַשְּׂלָו
  choice: बटेरें आकर
  rationale: שְׂלָו बटेर को दर्शाता है और यहाँ सामूहिक अर्थ में है; हिन्दी में बहुवचन ‘बटेरें’ स्वाभाविक है। עלה की गति को प्रसंगानुकूल ‘आकर’ व्यक्त करता है, बिना अनावश्यक दिशा जोड़ने के।
- source_word: וַתְּכַס אֶת־הַמַּחֲנֶה
  choice: छावनी पर छा गईं
  rationale: शब्दशः भाव ‘छावनी को ढक लिया’ है। पक्षियों के बड़े झुंड के लिए ‘छावनी पर छा गईं’ आधुनिक हिन्दी में अधिक स्वाभाविक है और व्यापक आवरण का चित्र बनाए रखता है।
- source_word: הָיְתָה שִׁכְבַת הַטַּל
  choice: ओस की एक परत पड़ी थी
  rationale: שִׁכְבַת का ठोस अर्थ ‘परत’ है। ‘पड़ी थी’ हिन्दी में भूमि पर जमी या फैली ओस का स्वाभाविक वर्णन है।
- source_word: סָבִיב לַמַּחֲנֶה
  choice: छावनी के चारों ओर
  rationale: यह छावनी को घेरे हुए स्थान को स्पष्ट और सहज आधुनिक हिन्दी में व्यक्त करता है।
