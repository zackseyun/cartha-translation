  text: And on the sixth day[a], when they prepare what they bring in, it will be twice as much as what they gather day by day.
translation:
  language: hi
  text: और छठे दिन, जब वे जो कुछ ले आएँगे उसे तैयार करेंगे, तो वह प्रतिदिन उनके बटोरे हुए की मात्रा से दुगुना[a] होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह उनके प्रतिदिन बटोरे हुए की तुलना में दुगुना भाग होगा।”
    reason: מִשְׁנֶה को केवल ‘दुगुना’ अथवा संज्ञात्मक रूप में ‘दुगुना भाग’ समझने की शाब्दिक संभावना को दर्शाता है।
lexical_decisions:
- source_word: וְהָיָה
  choice: तो वह ... होगा
  rationale: वाव-संयुक्त पूर्ण क्रिया यहाँ भावी परिस्थिति और उसके परिणाम को व्यक्त करती है; हिंदी में ‘तो ... होगा’ इस संबंध को स्वाभाविक रूप से प्रकट करता है।
- source_word: בַּיּוֹם הַשִּׁשִּׁי
  choice: छठे दिन
  rationale: यह सीधा कालवाचक पद है। मूल में ‘सप्ताह के’ नहीं है, इसलिए उसे नहीं जोड़ा गया।
- source_word: וְהֵכִינוּ
  choice: जब वे ... तैयार करेंगे
  rationale: निर्देशात्मक संदर्भ में यह छठे दिन होने वाली परिस्थिति बताता है। ‘जब’ मुख्य कथन के साथ इसका कालगत संबंध स्पष्ट करता है।
- source_word: אֵת אֲשֶׁר יָבִיאוּ
  choice: अपने लाए हुए को
  rationale: संबंधवाचक पद उस सामग्री की ओर संकेत करता है जिसे लोग बटोरकर भीतर लाएँगे; संक्षिप्त हिंदी अभिव्यक्ति संदर्भ को स्वाभाविक रखती है।
- source_word: וְהָיָה מִשְׁנֶה
  choice: वह ... दुगुना होगा
  rationale: מִשְׁנֶה दोहरी मात्रा को दर्शाता है। ‘दुगुना’ मूल विधेय की संक्षिप्तता और मात्रात्मक अर्थ दोनों बनाए रखता है।
- source_word: עַל אֲשֶׁר
  choice: उस मात्रा से ... जिसे
  rationale: עַל यहाँ तुलना अथवा माप का संबंध व्यक्त करता है। हिंदी में ‘उस मात्रा से दुगुना’ इस संबंध को स्पष्ट और सहज बनाता है।
- source_word: יִלְקְטוּ
  choice: वे ... बटोरते हैं
  rationale: मन्ना के संदर्भ में לקט का अर्थ जमीन से इकट्ठा करना है; ‘बटोरना’ आधुनिक हिंदी में सटीक और स्वाभाविक है।
- source_word: יוֹם יוֹם
  choice: प्रतिदिन
  rationale: शब्द की पुनरावृत्ति वितरणात्मक अर्थ, अर्थात हर दिन, देती है। ‘प्रतिदिन’ इसे संक्षिप्त और स्पष्ट रूप से व्यक्त करता है।
