source:
  edition: WLC
  text: וּ/בֹ֗קֶר וּ/רְאִיתֶם֙ אֶת כְּב֣וֹד יְהוָ֔ה בְּ/שָׁמְע֥/וֹ אֶת תְּלֻנֹּתֵי/כֶ֖ם עַל יְהוָ֑ה וְ/נַ֣חְנוּ מָ֔ה כִּ֥י תלונו עָלֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/007.yaml
  text: And in the morning you will see the glory of Yahweh[a], because he has heard your grumblings against Yahweh. And what are we, that you grumble against us?
translation:
  language: hi
  text: और सुबह तुम याहवे की महिमा देखोगे, क्योंकि[क] उसने याहवे के विरुद्ध तुम्हारी शिकायतें सुन ली हैं। और हम क्या हैं कि तुम हमारे विरुद्ध शिकायत करते हो?
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: या, “जब वह याहवे के विरुद्ध तुम्हारी शिकायतें सुनेगा।” हिब्रू रचना का अर्थ कारणसूचक के साथ-साथ कालसूचक भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/בֹקֶר
  choice: और सुबह
  rationale: संयोजक के साथ यह संज्ञा समयसूचक क्रियाविशेषण की तरह प्रयुक्त है; ‘और सुबह’ पूर्ववर्ती कथन का क्रम भी बनाए रखता है।
- source_word: וּ/רְאִיתֶם
  choice: तुम ... देखोगे
  rationale: इस संदर्भ में क्रिया आगामी घटना का बोध कराती है; आधुनिक हिन्दी में भविष्यकाल स्वाभाविक है।
- source_word: כְּבוֹד יְהוָה
  choice: यहोवा की महिमा
  rationale: כָּבוֹד परमेश्वर के प्रकट वैभव और गौरवपूर्ण उपस्थिति को व्यक्त करता है; ‘महिमा’ इसका पारदर्शी और प्रचलित हिन्दी प्रतिशब्द है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ के व्यक्तिगत ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण द्वारा रखा गया है।
- source_word: בְּ/שָׁמְע/וֹ
  choice: क्योंकि उसने ... सुन लिया है
  rationale: בְּ के साथ infinitive construct यहाँ कारणसूचक समझा जा सकता है और महिमा दिखाई देने का कारण बताता है; पूर्णता का भाव ‘सुन लिया है’ से व्यक्त होता है।
- source_word: תְּלֻנֹּתֵיכֶם / תלונו
  choice: तुम्हारा कुड़कुड़ाना / तुम ... कुड़कुड़ाते हो
  rationale: संज्ञा और क्रिया दोनों में एक ही मूल की शब्द-संगति बनाए रखी गई है। ‘कुड़कुड़ाना’ असंतोषपूर्ण और विद्रोही शिकायत का नकारात्मक भाव देता है।
- source_word: עַל יְהוָה / עָלֵינוּ
  choice: यहोवा के विरुद्ध / हमारे विरुद्ध
  rationale: शिकायत के इस प्रसंग में עַל विरोध की दिशा बताता है; दोनों पदों में समान संरचना मूल की समानांतरता सुरक्षित रखती है।
- source_word: וְנַחְנוּ מָה כִּי
  choice: और हम क्या हैं कि
  rationale: यह आलंकारिक प्रश्न मूसा और हारून की गौणता दिखाता है। ‘और’ हिब्रू संयोजक को निकटता से दर्शाता है और ‘कि’ प्रश्न के आशय को स्वाभाविक हिन्दी में जोड़ता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु / याहवे
  rationale: मूल में उपाधि नहीं, चतुरक्षरीय व्यक्तिगत नाम है। हिन्दी पाठकों के लिए पहचाने जाने योग्य ‘यहोवा’ नाम को बनाए रखता है और ‘प्रभु’ कहकर नाम को छिपाता नहीं।
- issue: בְּשָׁמְעוֹ का कारणसूचक या कालसूचक अर्थ
  choice: क्योंकि उसने ... सुन लिया है
  alternative: जब वह ... सुनेगा
  rationale: निकट संदर्भ में यह महिमा दिखाई देने का कारण बताता है, इसलिए कारणसूचक पाठ मुख्य पाठ में अधिक संगत है। फिर भी हिब्रू रचना कालसूचक अर्थ भी ग्रहण कर सकती है; उस वास्तविक अस्पष्टता को टिप्पणी में सुरक्षित रखना उचित होता, पर बिना टिप्पणी-चिह्न के पाठ अधिक स्वच्छ है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मौखिक रूप से सहज शैली रखी गई है। ‘कुड़कुड़ाना’ सामान्य पाठक के लिए स्पष्ट है और मूल के नकारात्मक शिकायत-भाव तथा संज्ञा-क्रिया की पुनरावृत्ति दोनों को बनाए रखता है।
