source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם ה֚וּא אֲשֶׁ֣ר דִּבֶּ֣ר יְהוָ֔ה שַׁבָּת֧וֹן שַׁבַּת קֹ֛דֶשׁ לַֽ/יהוָ֖ה מָחָ֑ר אֵ֣ת אֲשֶׁר תֹּאפ֞וּ אֵפ֗וּ וְ/אֵ֤ת אֲשֶֽׁר תְּבַשְּׁלוּ֙ בַּשֵּׁ֔לוּ וְ/אֵת֙ כָּל הָ֣/עֹדֵ֔ף הַנִּ֧יחוּ לָ/כֶ֛ם לְ/מִשְׁמֶ֖רֶת עַד הַ/בֹּֽקֶר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/023.yaml
  text: 'And he said to them[a], “This is what Yahweh has spoken: Tomorrow is a solemn rest, a holy Sabbath to Yahweh. What you will bake, bake; and what you will boil, boil; and all that is left over[b], set aside for yourselves to be kept until the morning.”'
translation:
  language: hi
  text: 'तब उसने उनसे कहा, “याहवे ने यह कहा है: कल विश्राम का विशेष दिन होगा—याहवे के लिए पवित्र सब्त। जो कुछ सेंकना हो, सेंक लो, और जो कुछ उबालना हो, उबाल लो;[a] और जो कुछ बच जाए, उसे अपने लिए सुबह तक सँभालकर रख दो।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में बल देने के लिए दोनों क्रियाएँ दोहराई गई हैं: “जो कुछ सेंकना हो, सेंक लो” और “जो कुछ उबालना हो, उबाल लो।”'
    reason: मूल की बलसूचक क्रिया-पुनरावृत्ति स्पष्ट करना
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: तब उसने उनसे कहा
  rationale: इब्रानी कथात्मक क्रम को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और सीधे कथन का सरल परिचय बनाए रखता है।
- source_word: הוּא אֲשֶׁר דִּבֶּר יְהוָה
  choice: याहवे ने यह कहा है
  rationale: वाक्य का संकेत वर्तमान विषय की ओर है; पूर्ण हुई दिव्य वाणी की वर्तमान प्रासंगिकता भी बनी रहती है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: שַׁבָּתוֹן שַׁבַּת קֹדֶשׁ לַיהוָה
  choice: पूर्ण विश्राम का दिन होगा—याहवे के लिए पवित्र सब्त
  rationale: שַׁבָּתוֹן के गहन विश्राम और שַׁבַּת קֹדֶשׁ की पवित्र सब्त-संज्ञा, दोनों को बनाए रखते हुए हिन्दी में दोनों पदों का संबंध स्पष्ट किया गया है।
- source_word: אֵת אֲשֶׁר תֹּאפוּ אֵפוּ
  choice: जो कुछ तुम्हें सेंकना है, सेंक लो
  rationale: क्रिया की इब्रानी पुनरावृत्ति और उसके बल को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: וְאֵת אֲשֶׁר תְּבַשְּׁלוּ בַּשֵּׁלוּ
  choice: और जो कुछ उबालना है, उबाल लो
  rationale: בשל के इस प्रसंग में ठोस अर्थ ‘उबालना’ लिया गया है और मूल की समानांतर क्रिया-पुनरावृत्ति रखी गई है।
- source_word: וְאֵת כָּל הָעֹדֵף
  choice: फिर जो कुछ बच जाए
  rationale: शेष या अतिरिक्त रह जाने वाली मात्रा का अर्थ सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הַנִּיחוּ לָכֶם לְמִשְׁמֶרֶת עַד הַבֹּקֶר
  choice: उसे अपने लिए सुबह तक सँभालकर रख दो
  rationale: जानबूझकर अलग रख देने, अपने लिए सुरक्षित रखने और समय-सीमा—तीनों को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत वाचा-नाम है; ‘याहवे’ उसका सीधा और व्यापक रूप से स्वीकृत लिप्यंतरण है।
- issue: שַׁבָּתוֹן और שַׁבַּת קֹדֶשׁ के संबंध को व्यक्त करना
  choice: पूर्ण विश्राम का दिन—याहवे के लिए पवित्र सब्त
  alternative: विशेष विश्राम, याहवे के लिए एक पवित्र सब्त
  rationale: दोनों निकटवर्ती संज्ञात्मक पदों को एक-दूसरे का स्पष्टीकरण माना गया है, पर उनके बीच की काव्यात्मक-संज्ञात्मक तीव्रता को समतल नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण किंतु सहज शैली। ‘सब्त’ स्थापित बाइबलीय पद के रूप में रखा गया है। आज्ञाओं में ‘लो/दो’ का प्रयोग सामूहिक संबोधन के लिए स्वाभाविक है; अनावश्यक संस्कृतनिष्ठ शब्दावली से बचा गया है।
