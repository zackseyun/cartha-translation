  text: וְ/לֹא שָׁמְע֣וּ אֶל מֹשֶׁ֗ה וַ/יּוֹתִ֨רוּ אֲנָשִׁ֤ים מִמֶּ֨/נּוּ֙ עַד בֹּ֔קֶר וַ/יָּ֥רֻם תּוֹלָעִ֖ים וַ/יִּבְאַ֑שׁ וַ/יִּקְצֹ֥ף עֲלֵ/הֶ֖ם מֹשֶֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/020.yaml
  text: But they did not listen to Moses[a], and some men left some of it until morning, and it bred worms and stank[b]; and Moses was angry with them.
translation:
  language: hi
  text: परन्तु उन्होंने मूसा की बात नहीं मानी[a]। कुछ पुरुषों ने उसमें से थोड़ा-सा सुबह तक बचाकर रखा; तब उसमें कीड़े पड़ गए[b] और वह दुर्गन्ध देने लगा। इस पर मूसा उनसे क्रोधित हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्होंने मूसा की न सुनी।” इब्रानी अभिव्यक्ति में इस प्रकार न सुनने का भाव हो सकता है जिसमें आज्ञा न मानना निहित है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उसमें कीड़े उत्पन्न हो गए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְעוּ אֶל מֹשֶׁה
  choice: मूसा की बात नहीं मानी
  rationale: שׁמע के साथ אֶל का अर्थ किसी की बात सुनना या उस पर ध्यान देना है और प्रसंग में अवज्ञा निहित है। यह हिंदी में स्वाभाविक है, जबकि पादटिप्पणी अधिक शाब्दिक विकल्प सुरक्षित रखती है।
- source_word: וַיּוֹתִרוּ ... מִמֶּנּוּ
  choice: उसमें से थोड़ा-सा ... बचाकर रखा
  rationale: יתר के हिफ़ईल रूप का भाव किसी अंश को शेष छोड़ देने का है। यह वाक्य मन्ना के कुछ भाग को निर्देश के विरुद्ध अगली सुबह तक रखने को स्पष्ट और स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: אֲנָשִׁים
  choice: कुछ पुरुषों
  rationale: मूल संज्ञा पुल्लिंग बहुवचन है और प्रसंग में एक अनिश्चित समूह को सूचित करती है; इसलिए 'कुछ पुरुषों' मूल के लिंग और अनिश्चितता दोनों को बनाए रखता है।
- source_word: עַד בֹּקֶר
  choice: सुबह तक
  rationale: यह समय-सूचक पद का सीधा और स्वाभाविक हिंदी रूप है।
- source_word: וַיָּרֻם תּוֹלָעִים
  choice: उसमें कीड़े पड़ गए
  rationale: हिंदी में खाद्य पदार्थ में कीड़े उत्पन्न होने के लिए यह सहज मुहावरा है। अधिक शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: וַיִּבְאַשׁ
  choice: वह दुर्गन्ध देने लगा
  rationale: क्रिया का अर्थ सड़ांध या दुर्गन्ध उत्पन्न करना है। यह रूप स्पष्ट, वर्तमान हिंदी में स्वाभाविक और कथात्मक शैली के अनुकूल है।
- source_word: וַיִּקְצֹף עֲלֵהֶם
  choice: मूसा उनसे क्रोधित हुआ
  rationale: קצף क्रोध को व्यक्त करता है और עַל यहाँ क्रोध के लक्ष्य को बताता है। 'से क्रोधित हुआ' हिंदी का स्वाभाविक प्रयोग है और तीव्रता को अनावश्यक रूप से नहीं बढ़ाता।
