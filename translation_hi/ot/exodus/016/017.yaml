  language: hi
  text: इस्राएल के पुत्रों ने वैसा ही किया और इकट्ठा किया—किसी ने अधिक और किसी ने कम।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: वैसा ही किया
  rationale: यह मुहावरा पिछली आज्ञा के अनुसार काम करने को दर्शाता है; आधुनिक हिन्दी में ‘वैसा ही किया’ स्वाभाविक और सटीक है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: मूल के पारिवारिक पदबंध ‘इस्राएल के पुत्र’ को बनाए रखा गया है; यहाँ यह इस्राएली समुदाय के लिए प्रयुक्त है।
- source_word: וַיִּלְקְטוּ
  choice: इकट्ठा किया
  rationale: לקט का अर्थ खाद्य सामग्री को चुनकर या बटोरकर इकट्ठा करना है; मन्ना के प्रसंग में यह सरल और स्वाभाविक है।
- source_word: הַמַּרְבֶּה
  choice: किसी ने अधिक
  rationale: संज्ञा के रूप में प्रयुक्त कृदन्त उस व्यक्ति को दर्शाता है जिसने अधिक मात्रा इकट्ठी की; ‘किसी ने अधिक’ वितरणात्मक भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: הַמַּמְעִיט
  choice: किसी ने कम
  rationale: यह विपरीत कृदन्त कम मात्रा इकट्ठी करने वाले को दर्शाता है; ‘किसी ने कम’ पूर्व पद के साथ स्वाभाविक समानांतर बनाता है।
