  text: וַ/תַּ֖עַל שִׁכְבַ֣ת הַ/טָּ֑ל וְ/הִנֵּ֞ה עַל פְּנֵ֤י הַ/מִּדְבָּר֙ דַּ֣ק מְחֻסְפָּ֔ס דַּ֥ק כַּ/כְּפֹ֖ר עַל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/014.yaml
  text: When the layer of dew had gone up[a], behold, on the surface of the wilderness was a fine, flaky thing, fine as frost on the ground.
translation:
  language: hi
  text: जब ओस की परत ऊपर उठ गई[a], तो देखो, वीराने की सतह पर एक बारीक, पपड़ी-जैसी चीज़ थी—भूमि पर पाले के समान बारीक।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ओस की परत हट गई।” हिब्रानी क्रिया का शाब्दिक अर्थ “ऊपर उठ गई” है; प्रसंग में ओस के लुप्त हो जाने का भाव हो सकता है। “पपड़ी-जैसी” जिस दुर्लभ हिब्रानी शब्द का अनुवाद है, उसका सूक्ष्म अर्थ अनिश्चित है; वह बनावट या रूप का संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַל
  choice: ऊपर उठ गई
  rationale: עלה का मूल अर्थ ‘ऊपर जाना/उठना’ है। ओस के लुप्त होने के प्रसंग में यह हिब्रानी बिंब को बनाए रखता है; ‘भाप बन गई’ अर्थ को आवश्यकता से अधिक स्पष्ट करता।
- source_word: שִׁכְבַת הַטָּל
  choice: ओस की परत
  rationale: שִׁכְבָה किसी बिछी हुई तह या परत को दर्शाता है; यह हिंदी में स्वाभाविक और दृश्यात्मक है।
- source_word: וְהִנֵּה
  choice: तो देखो
  rationale: הִנֵּה अचानक दिखाई देने वाली बात की ओर ध्यान खींचता है; ‘तो देखो’ आधुनिक हिंदी में इसकी जीवंतता बनाए रखता है।
- source_word: עַל פְּנֵי הַמִּדְבָּר
  choice: वीराने की सतह पर
  rationale: פְּנֵי का स्थानगत अर्थ यहाँ ‘सतह’ है। מִדְבָּר के लिए ‘वीराना’ निर्जन भूभाग का अर्थ देता है, बिना उसे केवल रेतीला मरुस्थल मानने के।
- source_word: דַּק
  choice: बारीक
  rationale: यह विशेषण सूक्ष्मता या पतलेपन को दर्शाता है; दोनों आवृत्तियों में ‘बारीक’ स्वाभाविक है और पुनरुक्ति सुरक्षित रखता है।
- source_word: מְחֻסְפָּס
  choice: परतदार-सी चीज़
  rationale: यह दुर्लभ शब्द अनिश्चित है और संभवतः बनावट या रूप का वर्णन करता है। ‘परतदार-सी’ संभावित अर्थ देता है, जबकि ‘चीज़’ हिब्रानी में निहित संज्ञा को हिंदी में पूरा करता है।
- source_word: דַּק כַּכְּפֹר
  choice: पाले के समान बारीक
  rationale: כְּפֹר का अर्थ पाला है; यह तुलना और דַּק की पुनरावृत्ति दोनों को बनाए रखता है।
- source_word: עַל הָאָרֶץ
  choice: भूमि पर
  rationale: तात्कालिक भौतिक संदर्भ में אֶרֶץ का आशय जमीन/भूमि है; ‘भूमि’ गरिमापूर्ण और स्पष्ट है।
