source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶֽל אַהֲרֹ֗ן קַ֚ח צִנְצֶ֣נֶת אַחַ֔ת וְ/תֶן שָׁ֥מָּ/ה מְלֹֽא הָ/עֹ֖מֶר מָ֑ן וְ/הַנַּ֤ח אֹת/וֹ֙ לִ/פְנֵ֣י יְהוָ֔ה לְ/מִשְׁמֶ֖רֶת לְ/דֹרֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/033.yaml
  text: And Moses said to Aaron[a], “Take one jar, and put an omerful of manna in it, and place it before Yahweh, to be kept throughout your generations.”
translation:
  language: hi
  text: तब मूसा ने हारून से कहा, “एक मर्तबान[a] लो, उसमें एक ओमेर भर मन्ना रखो और उसे याहवे के सामने रख दो, ताकि वह तुम्हारी पीढ़ियों के लिए सुरक्षित रखा जाए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पात्र” अथवा “बर्तन”।
    reason: इब्रानी शब्द सामान्यतः किसी पात्र को सूचित करता है; उसके ठीक आकार या सामग्री का यहाँ उल्लेख नहीं है।
lexical_decisions:
- source_word: צִנְצֶנֶת
  choice: मर्तबान
  rationale: यह शब्द किसी पात्र या डिब्बेनुमा बर्तन को सूचित करता है। ‘मर्तबान’ आधुनिक हिन्दी में संग्रह के लिए प्रयुक्त पात्र का स्वाभाविक नाम है और इसे पकाने का बर्तन नहीं ठहराता।
- source_word: מְלֹא הָעֹמֶר
  choice: एक ओमेर भर
  rationale: מְלֹא पूरी मात्रा का भाव देता है और עֹמֶר एक सूखी माप है। ‘एक ओमेर भर’ माप और उसके पूरा भरे होने—दोनों अर्थों को सहज हिन्दी में रखता है।
- source_word: מָן
  choice: मन्ना
  rationale: सन्दर्भ में वर्णित पदार्थ के लिए यह हिन्दी बाइबल-परम्परा में स्थापित लिप्यन्तरण है।
- source_word: וְתֶן שָׁמָּה
  choice: उसमें ... रखो
  rationale: शाब्दिक अर्थ ‘वहाँ रखो’ है, पर सन्दर्भ में ‘वहाँ’ अभी बताए गए पात्र के भीतर को सूचित करता है। ‘उसमें’ हिन्दी में इस सम्बन्ध को स्वाभाविक और स्पष्ट बनाता है।
- source_word: וְהַנַּח אֹתוֹ
  choice: उसे ... रख दो
  rationale: क्रिया किसी वस्तु को निश्चित स्थान पर रखने का भाव देती है। ‘रख दो’ स्पष्ट, सहज और प्रसंगानुकूल है।
- source_word: לִפְנֵי יְהוָה
  choice: याहवे के सामने
  rationale: לִפְנֵי का अर्थ ‘के सामने/की उपस्थिति में’ है। ‘के सामने’ संक्षिप्त और मूल के निकट है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय दिव्य नाम का हिन्दी लिप्यन्तरण किया गया है, किसी उपाधि से उसका स्थानापन्न नहीं किया गया।
- source_word: לְמִשְׁמֶרֶת
  choice: सुरक्षित रखा जाए
  rationale: संज्ञा में रखवाली, संरक्षण या सुरक्षित रखे जाने का भाव है। यहाँ उद्देश्य को हिन्दी में स्वाभाविक निष्क्रिय रचना से व्यक्त किया गया है।
- source_word: לְדֹרֹתֵיכֶם
  choice: तुम्हारी पीढ़ियों तक
  rationale: वाक्यांश इस्राएल की क्रमागत पीढ़ियों में निरन्तर संरक्षण को दर्शाता है। ‘पीढ़ियों तक’ इस अवधि को सहज हिन्दी में व्यक्त करता है।
- source_word: קַח ... אַחַת
  choice: एक मर्तबान लो
  rationale: आज्ञार्थक क्रिया और संख्या एक ही पात्र लेने पर बल देते हैं; हिन्दी में यह सीधी और स्वाभाविक रचना है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम सीधे आया है। ‘याहवे’ उसके सम्भावित इब्रानी उच्चारण का प्रचलित लिप्यन्तरण है और नाम को उपाधि में नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। माप ‘ओमेर’ को मूल सांस्कृतिक इकाई के रूप में बनाए रखा गया है। फुटनोट-चिह्न उस शब्द के तुरन्त बाद रखा गया है जिससे वह सम्बन्धित है।
