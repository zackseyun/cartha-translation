  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֶל מֹשֶׁ֑ה עַד אָ֨נָה֙ מֵֽאַנְתֶּ֔ם לִ/שְׁמֹ֥ר מִצְוֺתַ֖/י וְ/תוֹרֹתָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/028.yaml
  text: Then Yahweh said to Moses[a], “How long will you refuse to keep my commandments and my laws?”
translation:
  language: hi
  text: तब याहवे ने मूसा से कहा, “तुम कब तक मेरी आज्ञाओं और मेरी व्यवस्थाओं[a] को मानने से इनकार करते रहोगे?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरी शिक्षाओं” अथवा “मेरे निर्देशों।” इब्रानी तोरोत (तोराह का बहुवचन) व्यवस्था के साथ-साथ अधिकारपूर्ण शिक्षा या निर्देश को भी व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने ... कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम का स्वाभाविक संकेत देता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण द्वारा प्रस्तुत किया गया है।
- source_word: עַד אָנָה
  choice: कब तक
  rationale: यह अवधि और लगातार बने हुए व्यवहार पर प्रश्न करने वाला स्वाभाविक हिन्दी मुहावरा है।
- source_word: מֵאַנְתֶּם
  choice: इनकार करते रहोगे
  rationale: क्रिया अनिच्छा अथवा अस्वीकार को व्यक्त करती है; प्रश्न के संदर्भ में ‘करते रहोगे’ जारी हठ और फटकार को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לִשְׁמֹר
  choice: मानने
  rationale: आज्ञाओं के साथ שׁמר का अर्थ उनका पालन करना है; ‘मानना’ साधारण आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: מִצְוֺתַי
  choice: मेरी आज्ञाओं
  rationale: यह शब्द अधिकारपूर्ण आदेशों को दर्शाता है और वाचा-संबंधी विधिक भाव बनाए रखता है।
- source_word: וְתוֹרֹתָי
  choice: और मेरी व्यवस्थाओं
  rationale: आज्ञाओं के समानांतर और इस प्रसंग में बहुवचन תּוֹרָה के मानक स्वरूप को व्यक्त करने के लिए ‘व्यवस्थाओं’ का प्रयोग किया गया है; ‘शिक्षाओं/निर्देशों’ की व्यापक अर्थ-छाया पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: व्यक्तिगत वाचा-नाम को ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला रूप है, यद्यपि ‘याहवे’ मूल उच्चारण का निकटतर लिप्यंतरण माना जाता है।
- issue: बहुवचन תּוֹרֹתָי का अर्थ
  choice: मेरी व्यवस्थाओं
  alternative: मेरी शिक्षाओं / मेरे निर्देशों
  rationale: प्रसंग और ‘मेरी आज्ञाओं’ के समानांतर प्रयोग के कारण मुख्य पाठ में इसके नियमात्मक बल को रखा गया है, जबकि इसके शिक्षापरक अर्थ को पादटिप्पणी में प्रस्तुत किया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। प्रत्यक्ष वचन में बहुवचन ‘तुम’ मूल के बहुवचन संबोधन को बनाए रखता है। ‘आज्ञाओं’ और ‘व्यवस्थाओं’ द्वारा विधिक स्वर सुरक्षित है, जबकि पादटिप्पणी תּוֹרָה की व्यापक अर्थ-सीमा बताती है।
