  text: An omer is a tenth of an ephah[a].
translation:
  language: hi
  text: ओमेर एपा का दसवाँ भाग होता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ओमेर और एपा सूखी वस्तुओं को मापने की प्राचीन इब्रानी इकाइयाँ थीं; यह पद बताता है कि एक ओमेर, एपा का दसवाँ भाग था।
    reason: cultural_note
lexical_decisions:
- source_word: הָעֹמֶר
  choice: ओमेर
  rationale: यह प्राचीन इब्रानी सूखी वस्तुओं की माप है; किसी अनुमानित आधुनिक इकाई से बदलने के बजाय इसका लिप्यंतरण अर्थ को अधिक ठीक रखता है। परिभाषात्मक वाक्य में हिन्दी में बिना निश्चयवाचकता के ‘ओमेर’ स्वाभाविक है।
- source_word: עֲשִׂרִית
  choice: दसवाँ भाग
  rationale: यह शब्द यहाँ भिन्नात्मक परिमाण, अर्थात एक-दशमांश, व्यक्त करता है; ‘दसवाँ भाग’ सामान्य पाठक के लिए स्पष्ट और स्वाभाविक है।
- source_word: הָאֵיפָה
  choice: एपा का
  rationale: एपा भी प्राचीन इब्रानी सूखी वस्तुओं की माप है; लिप्यंतरण मूल सांस्कृतिक इकाई को सुरक्षित रखता है।
- source_word: הוּא
  choice: होता है
  rationale: यह सर्वनाम नामवाचक वाक्य में संयोजक का काम करता है। हिन्दी में माप की सामान्य परिभाषा के लिए ‘होता है’ स्वाभाविक है।
- source_word: וְ
  choice: अलग से अनूदित नहीं
  rationale: यहाँ וְ व्याख्यात्मक/संयोजक भूमिका निभाता है। स्वतंत्र पद जोड़ने से हिन्दी वाक्य अनावश्यक रूप से भारी होता; प्रसंगगत संबंध बिना ‘और’ या ‘अब’ के भी स्पष्ट है।
