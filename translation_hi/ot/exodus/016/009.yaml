base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/009.yaml
  text: Then Moses said to Aaron[a], “Say to all the congregation of the sons of Israel, ‘Come near before Yahweh[b], for he has heard your grumblings.’”
translation:
  language: hi
  text: तब मूसा ने हारून से कहा, “इस्राएलियों की पूरी सभा से कहो, ‘याहवे के सामने आओ, क्योंकि उसने तुम्हारी बड़बड़ाहट सुन ली है।’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... कहा
  rationale: वाव-क्रमवाचक कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में घटनाक्रम स्पष्ट करता है।
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों की सारी सभा
  rationale: עֵדָה के सामुदायिक और एकत्रित सभा के भाव को सुरक्षित रखते हुए בְּנֵי יִשְׂרָאֵל को आधुनिक हिन्दी में स्वाभाविक रूप से ‘इस्राएली’ कहा गया है।
- source_word: קִרְבוּ
  choice: निकट आओ
  rationale: आज्ञार्थक क्रिया परमेश्वर की उपस्थिति के सामने आने का भाव रखती है; ‘निकट आओ’ स्पष्ट और गरिमापूर्ण है।
- source_word: לִפְנֵי יְהוָה
  choice: याहवे के सामने
  rationale: לִפְנֵי का मूल भाव ‘सामने/उपस्थिति में’ है और יְהוָה को उसके व्यक्तिगत नाम ‘याहवे’ से व्यक्त किया गया है।
- source_word: כִּי שָׁמַע
  choice: क्योंकि उसने ... सुन लिया है
  rationale: כִּי कारण बताता है और पूर्ण क्रिया वर्तमान प्रसंग पर प्रभाव रखने वाली पूरी हो चुकी क्रिया को व्यक्त करती है।
- source_word: תְּלֻנֹּתֵיכֶם
  choice: तुम्हारा कुड़कुड़ाना
  rationale: यह शब्द केवल शिकायत नहीं, बल्कि दबे स्वर में असंतोष और विद्रोही शिकायत का भाव भी रखता है; ‘कुड़कुड़ाना’ आधुनिक हिन्दी में यह अर्थ व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में उपाधि नहीं बल्कि चार अक्षरों वाला व्यक्तिगत वाचा-नाम है; ‘याहवे’ उसका सीधा लिप्यंतरण है और नाम को उपाधि में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, मौखिक रूप से सहज और गरिमापूर्ण। ‘सभा’ सामूहिक पहचान बनाए रखता है और ‘कुड़कुड़ाना’ शिकायत के नकारात्मक भाव को व्यक्त करता है।
