lexical_decisions:
- source_word: וַיִּשְׁבְּתוּ
  choice: विश्राम किया
  rationale: שׁבת के क़ाल रूप का मूल अर्थ काम से रुकना या विश्राम करना है। इस प्रसंग में ‘विश्राम किया’ स्वाभाविक हिन्दी है और ‘सब्त मनाया’ जैसी व्याख्यात्मक वृद्धि से बचता है।
- source_word: הָעָם
  choice: लोगों ने
  rationale: עָם यहाँ इस्राएली समुदाय के लिए सामूहिक अर्थ में प्रयुक्त है; आधुनिक हिन्दी में ‘लोगों’ स्वाभाविक और स्पष्ट है।
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: सातवें दिन
  rationale: विशिष्ट दिन के समय-संदर्भ को हिन्दी में ‘सातवें दिन’ सहज और ठीक रूप से व्यक्त करता है।
- source_word: וַ
  choice: इसलिए
  rationale: वाव-क्रम कथा को आगे बढ़ाते हुए यहाँ पिछले निर्देश के परिणाम को प्रस्तुत करता है; ‘इसलिए’ उस संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: क्या क्रिया में सब्त का उल्लेख स्पष्ट रूप से जोड़ना चाहिए
  choice: ‘विश्राम किया’ रखा गया है।
  alternative: ‘सब्त मनाया’ या ‘काम करना छोड़ दिया’
  rationale: इब्रानी क्रिया स्वयं रुकने या विश्राम करने को बताती है। सब्त का आशय प्रसंग और ‘सातवें दिन’ से स्पष्ट है; ‘सब्त मनाया’ अनावश्यक व्याख्यात्मक विस्तार होगा।
