source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה הִנְ/נִ֨י מַמְטִ֥יר לָ/כֶ֛ם לֶ֖חֶם מִן הַ/שָּׁמָ֑יִם וְ/יָצָ֨א הָ/עָ֤ם וְ/לָֽקְטוּ֙ דְּבַר י֣וֹם בְּ/יוֹמ֔/וֹ לְמַ֧עַן אֲנַסֶּ֛/נּוּ הֲ/יֵלֵ֥ךְ בְּ/תוֹרָתִ֖/י אִם לֹֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/004.yaml
  text: Then Yahweh said to Moses[a], “Behold, I am raining bread from heaven for you, and the people shall go out and gather a day's portion each day, so that I may test them[c][b], whether they will walk in my law or not.”
translation:
  language: hi
  text: तब यहोवा ने मूसा से कहा, “देखो, मैं तुम लोगों के लिए स्वर्ग से रोटी बरसाने वाला हूँ। लोग बाहर जाएँ और प्रतिदिन उस दिन की आवश्यकता भर बटोरें, ताकि मैं उन्हें परखूँ कि वे मेरी शिक्षा के अनुसार चलेंगे या नहीं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के विशिष्ट वाचा-नाम को सामान्य उपाधि में बदलने के बजाय हिन्दी में प्रचलित रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: הִנְנִי מַמְטִיר
  choice: देख, मैं ... बरसाने वाला हूँ
  rationale: הִנְנִי घोषणा की ओर ध्यान खींचता है और कृदन्त מַמְטִיר निकट भविष्य की निश्चित कार्रवाई व्यक्त कर सकता है; यह हिन्दी में स्वाभाविक और तात्कालिक है।
- source_word: לֶחֶם מִן הַשָּׁמַיִם
  choice: आकाश से रोटी
  rationale: לֶחֶם के ठोस अर्थ ‘रोटी’ को बनाए रखा गया है; שָׁמַיִם यहाँ उस ऊपरी आकाश को दर्शाता है जहाँ से रोटी बरसती है।
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: प्रतिदिन ... उस दिन की आवश्यकता भर
  rationale: शाब्दिक रूप ‘एक दिन की बात उसके दिन में’ हिन्दी में अस्पष्ट होता; मुहावरे का आशय हर दिन उसी दिन की आवश्यक मात्रा बटोरना है।
- source_word: לְמַעַן אֲנַסֶּנּוּ
  choice: इस प्रकार मैं उनकी परीक्षा लूँगा
  rationale: एकवचन प्रत्यय सामूहिक संज्ञा ‘लोगों’ की ओर संकेत करता है, इसलिए हिन्दी में आदरसूचक नहीं बल्कि सामूहिक बहुवचन ‘उनकी’ स्वाभाविक है।
- source_word: הֲיֵלֵךְ בְּתוֹרָתִי
  choice: कि वे मेरी शिक्षा के अनुसार चलेंगे
  rationale: ‘चलना’ आचरण का इब्रानी रूपक सुरक्षित रखता है; תּוֹרָה का मूल भाव यहाँ परमेश्वर का दिया हुआ निर्देश है, और निर्गमन 16 की सीनै-पूर्व स्थिति में ‘शिक्षा’ स्वाभाविक है।
theological_decisions:
- issue: सीनै से पहले תּוֹרָה का अनुवाद
  choice: मेरी शिक्षा
  alternative: मेरी व्यवस्था
  rationale: तत्काल प्रसंग में यह प्रतिदिन बटोरने के परमेश्वर के निर्देश को सूचित करता है। ‘शिक्षा’ शब्द के व्यापक अर्थ को बनाए रखता है और बाद की संहिताबद्ध व्यवस्था को अनावश्यक रूप से इस पद में आरोपित नहीं करता।
- issue: परीक्षा का उद्देश्य
  choice: कि वे ... चलेंगे या नहीं
  alternative: यह देखने के लिए कि वे आज्ञा मानेंगे या नहीं
  rationale: मूल पाठ परीक्षा के परिणाम को खुला रखता है और ‘चलना’ रूपक प्रयोग करता है; इसलिए केवल ‘आज्ञा मानना’ कहकर अर्थ को संकुचित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘बरसाने वाला हूँ’ निकट भविष्य का भाव देता है; ‘उस दिन की आवश्यकता भर’ इब्रानी मुहावरे को स्पष्ट करता है। किसी पादटिप्पणी की आवश्यकता नहीं समझी गई।
