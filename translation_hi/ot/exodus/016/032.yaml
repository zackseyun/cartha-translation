base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/032.yaml
  text: 'And Moses said[a], “This is the thing that Yahweh has commanded: Let a full omer of it be kept throughout your generations, so that they may see the bread with which I fed you in the wilderness, when I brought you out from the land of Egypt.”'
translation:
  language: hi
  text: 'और मूसा ने कहा, “यह वह बात है जिसकी आज्ञा यहोवा ने दी है: इसमें से पूरा एक ओमेर[a] तुम्हारी पीढ़ियों के लिए सँभालकर रखा जाए, ताकि वे उस रोटी को देखें जिसे मैंने तुम्हें वीराने में खिलाई थी, जब मैं तुम्हें मिस्र देश से निकाल लाया था।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात ओमेर नामक माप की पूरी मात्रा।
    reason: प्राचीन माप की सांस्कृतिक व्याख्या
lexical_decisions:
- source_word: וַיֹּאמֶר מֹשֶׁה
  choice: और मूसा ने कहा
  rationale: इब्रानी कथात्मक क्रम को बनाए रखते हुए यह आधुनिक हिन्दी में स्वाभाविक है।
- source_word: זֶה הַדָּבָר אֲשֶׁר צִוָּה יְהוָה
  choice: यह वह बात है जिसकी आज्ञा यहोवा ने दी है
  rationale: דָּבָר यहाँ किसी विशिष्ट निर्देश को सूचित करता है; ‘बात’ उसके अर्थ-विस्तार को बनाए रखता है। יְהוָה को उसके व्यक्तिगत वाचा-नाम ‘यहोवा’ से व्यक्त किया गया है।
- source_word: מְלֹא הָעֹמֶר מִמֶּנּוּ
  choice: इसमें से एक ओमेर भर
  rationale: मन्ना के लिए संकेतवाचक सर्वनाम रखा गया है और प्राचीन माप ‘ओमेर’ को परिवर्तित करने के बजाय सुरक्षित रखा गया है; ‘भर’ पूर्ण मात्रा व्यक्त करता है।
- source_word: לְמִשְׁמֶרֶת לְדֹרֹתֵיכֶם
  choice: तुम्हारी पीढ़ियों के लिए सँभालकर रखा जाए
  rationale: מִשְׁמֶרֶת में सुरक्षित रखे जाने का भाव है और לְדֹרֹתֵיכֶם भावी पीढ़ियों तक स्मृति बनाए रखने का प्रयोजन बताता है।
- source_word: לְמַעַן יִרְאוּ
  choice: ताकि वे ... देखें
  rationale: उद्देश्यसूचक उपवाक्य को स्पष्ट रखा गया है; ‘वे’ का संदर्भ अभी उल्लिखित भावी पीढ़ियों से है।
- source_word: הַלֶּחֶם אֲשֶׁר הֶאֱכַלְתִּי אֶתְכֶם
  choice: उस रोटी को ... जो मैंने तुम्हें ... खिलाई थी
  rationale: לֶחֶם का शाब्दिक ‘रोटी’ रखा गया है और हिफ़ील रूप הֶאֱכַלְתִּי को स्वाभाविक हिन्दी ‘खिलाई’ से व्यक्त किया गया है।
- source_word: בַּמִּדְבָּר
  choice: वीराने में
  rationale: מִדְבָּר निर्जन और उजाड़ प्रदेश को सूचित करता है; ‘वीराना’ आधुनिक हिन्दी में इस व्यापक अर्थ को व्यक्त करता है।
- source_word: בְּהוֹצִיאִי אֶתְכֶם מֵאֶרֶץ מִצְרָיִם
  choice: तुम्हें मिस्र देश से निकालते समय
  rationale: בְּ सहित क्रियार्थक संज्ञा की कालसूचक भूमिका को सहज हिन्दी में व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम सीधे आया है। ‘यहोवा’ हिन्दी बाइबलीय प्रयोग में परिचित लिप्यंतरण है और इसे सामान्य उपाधि में नहीं बदलता।
- issue: הַלֶּחֶם का अर्थ
  choice: रोटी
  alternative: भोजन
  rationale: संदर्भ में यह मन्ना है, फिर भी मूल पाठ ‘रोटी’ शब्द का प्रयोग करता है; उसी शब्दावली और उसके धर्मवैचारिक संबंधों को सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। प्राचीन माप ‘ओमेर’ को मूल रूप में रखते हुए पादटिप्पणी में समझाया गया है।
