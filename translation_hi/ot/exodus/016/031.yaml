  text: וַ/יִּקְרְא֧וּ בֵֽית יִשְׂרָאֵ֛ל אֶת שְׁמ֖/וֹ מָ֑ן וְ/ה֗וּא כְּ/זֶ֤רַע גַּד֙ לָבָ֔ן וְ/טַעְמ֖/וֹ כְּ/צַפִּיחִ֥ת בִּ/דְבָֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/031.yaml
  text: The house of Israel called its name manna[a], and it was like white coriander seed[c][b], and its taste was like wafers with honey.
translation:
  language: hi
  text: इस्राएल के घराने ने उसका नाम मन्ना[a] रखा। वह सफेद धनिए के बीज[b] जैसा था, और उसका स्वाद शहद मिली पतली टिकिया[c] जैसा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'हिब्रू: मान; हिन्दी में परंपरागत रूप से ‘मन्ना’।'
    reason: lexical_alternative
  - marker: b
    text: इसे “धनिए के बीज जैसा—सफेद” भी समझा जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: या “शहद मिला पतला पुआ”; इस हिब्रू शब्द का आशय पतली सेंकी हुई टिकिया या पुए जैसे खाद्य से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ בֵית יִשְׂרָאֵל אֶת־שְׁמוֹ
  choice: इस्राएल के घराने ने उसका नाम … रखा
  rationale: यह नाम रखने की क्रिया और मूल के सामूहिक पद ‘इस्राएल का घराना’—दोनों को स्पष्ट, स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: מָן
  choice: मन्ना
  rationale: हिब्रू रूप ‘मान’ है, पर जंगल में मिले इस भोजन के लिए हिन्दी बाइबलीय परंपरा में ‘मन्ना’ सुविख्यात और तुरंत समझ में आने वाला नाम है।
- source_word: כְּזֶרַע גַּד לָבָן
  choice: सफेद धनिए के बीज जैसा
  rationale: גַּד की सामान्य पहचान धनिया है और לָבָן का अर्थ ‘सफेद’ है। यह रूप तुलना को सहज हिन्दी में व्यक्त करता है; विशेषण के संबंध की वैकल्पिक समझ पादटिप्पणी में दी गई है।
- source_word: וְטַעְמוֹ
  choice: और उसका स्वाद
  rationale: טַעַם यहाँ भोजन के स्वाद को बताता है; ‘स्वाद’ सीधा और सामान्य हिन्दी समतुल्य है।
- source_word: כְּצַפִּיחִת בִּדְבָשׁ
  choice: शहद मिली पतली टिकिया जैसा
  rationale: צַפִּיחִת किसी पतली सेंकी हुई टिकिया या पुए जैसे खाद्य को सूचित करता है, जबकि בִּדְבָשׁ सामग्री या संगति का भाव देता है। ‘पतली टिकिया’ आकार और खाद्य-स्वरूप दोनों बताती है, पर शब्द की अनिश्चितता पादटिप्पणी में रखी गई है।
