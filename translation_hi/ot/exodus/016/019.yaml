  text: तब मूसा ने उनसे कहा, “कोई भी उसमें से कुछ भी सुबह तक बचाकर न रखे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक कथानक को आगे बढ़ाता है; हिन्दी कथात्मक शैली में ‘तब’ स्वाभाविक है।
- source_word: מֹשֶׁה
  choice: मूसा
  rationale: इस इब्रानी नाम का प्रचलित मानक हिन्दी रूप।
- source_word: אֲלֵהֶם
  choice: उनसे
  rationale: אֶל तथा तृतीय पुरुष बहुवचन प्रत्यय का स्वाभाविक हिन्दी रूप; ‘लोगों से’ कहना अनावश्यक व्याख्या होती।
- source_word: אִישׁ אַל
  choice: कोई भी ... न
  rationale: यहाँ אִישׁ का प्रयोग वितरणात्मक है और निषेध प्रत्येक व्यक्ति पर लागू होता है; आधुनिक हिन्दी में ‘कोई भी ... न’ अर्थ को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: יוֹתֵר
  choice: बचाकर ... रखे
  rationale: इस प्रसंग में क्रिया का अर्थ मन्ना को शेष छोड़ना अथवा अगले समय के लिए रख छोड़ना है; ‘बचाकर रखना’ हिन्दी में इस आशय को सहजता से व्यक्त करता है।
- source_word: מִמֶּנּוּ
  choice: उसमें से कुछ भी
  rationale: प्रत्यय पहले उल्लिखित मन्ना की ओर संकेत करता है; निषेध के साथ ‘कुछ भी’ हिन्दी में परिमाणगत अर्थ को स्पष्ट करता है।
- source_word: עַד בֹּקֶר
  choice: सुबह तक
  rationale: समय-सीमा बताने वाले इस पदबंध का सीधा और स्वाभाविक हिन्दी अनुवाद।
