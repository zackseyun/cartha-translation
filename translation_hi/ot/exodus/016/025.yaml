  yaml_path: translation/ot/exodus/016/025.yaml
  text: And Moses said, “Eat it today, because today is a Sabbath to the LORD; today you will not find it in the field.”
translation:
  language: hi
  text: मूसा ने कहा, “इसे आज खाओ, क्योंकि आज यहोवा के लिए विश्राम-दिन है; आज तुम इसे खेत में नहीं पाओगे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁבָּת
  choice: विश्राम-दिन
  rationale: यह शब्द यहाँ काम से विराम के लिए ठहराए गए दिन को दर्शाता है; ‘विश्राम-दिन’ आधुनिक पाठक के लिए अर्थ स्पष्ट रखते हुए मूल धार्मिक संकल्पना को बनाए रखता है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: पूर्वसर्ग לַ का समर्पण अथवा संबंध-सूचक बल ‘के लिए’ से व्यक्त होता है, और चार-अक्षरीय ईश्वरीय नाम को ‘यहोवा’ से दर्शाया गया है।
- source_word: בַּשָּׂדֶה
  choice: मैदान में
  rationale: यह उस खुले स्थान को सूचित करता है जहाँ लोग मन्ना बटोरने जाते थे; ‘मैदान’ स्वाभाविक और संदर्भानुकूल है।
theological_decisions:
- issue: ‘यहोवा के लिए विश्राम-दिन’ में संबंध का स्वरूप
  choice: यहोवा के लिए
  alternative: यहोवा का
  rationale: मूल לַיהוָה को ‘के लिए’ कहना दिन के यहोवा को समर्पित होने का भाव सुरक्षित रखता है और उसे केवल स्वामित्व के रूप में सीमित नहीं करता।
translation_notes:
  register: सरल, गरिमापूर्ण आधुनिक मानक हिन्दी। मूल में ‘आज’ की तीन बार पुनरावृत्ति बल देती है; हिन्दी में ‘आज ही’, ‘आज’, और ‘आज’ द्वारा यह जोर बनाए रखा गया है। प्रत्यक्ष कथन स्वाभाविक हिन्दी विराम-चिह्नों में दिया गया है।
