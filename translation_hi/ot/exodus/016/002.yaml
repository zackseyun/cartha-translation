lexical_decisions:
- source_word: וַיִּלּוֹנוּ
  choice: कुड़कुड़ाया
  rationale: इस प्रसंग में לון/לין सामूहिक असंतोष और अगुवों के विरुद्ध शिकायत व्यक्त करता है। ‘कुड़कुड़ाया’ आधुनिक हिन्दी में इसकी नकारात्मक और दबी हुई शिकायत की छाया को स्वाभाविक रूप से रखता है।
- source_word: כָּל עֲדַת
  choice: सारी मण्डली
  rationale: כָּל समग्रता पर बल देता है और עֵדָה इस्राएल के संगठित समुदाय को दर्शाता है; ‘सारी मण्डली’ दोनों अर्थों को संक्षेप में सुरक्षित रखता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: इब्रानी पदबंध का पुरुषवाचक और वंश-संबंधी रूप औपचारिक रूप से बनाए रखा गया है; अधिक सहज सामुदायिक विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: עַל ... וְעַל
  choice: मूसा और हारून के विरुद्ध
  rationale: शिकायत के इस संदर्भ में עַל विरोध या शिकायत के लक्ष्य को सूचित करता है। हिन्दी में दोहराव के बिना ‘के विरुद्ध’ दोनों नामों पर स्वाभाविक रूप से लागू होता है।
- source_word: בַּמִּדְבָּר
  choice: जंगल में
  rationale: מִדְבָּר निर्जन वन्य प्रदेश को दर्शाता है, अनिवार्यतः रेतीले मरुस्थल को नहीं। बाइबलीय हिन्दी में ‘जंगल’ इस अर्थ का परिचित और सुबोध रूप है।
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל का सामूहिक संबोधन
  choice: इस्राएल के पुत्रों
  alternative: इस्राएली; इस्राएल की सन्तान
  rationale: मूल का पुरुषवाचक वंश-संबंधी रूप मुख्य पाठ में सुरक्षित रखा गया है, जबकि सामूहिक और पारंपरिक हिन्दी रूप पादटिप्पणी में दिए गए हैं; इससे मूल की व्याकरणिक विशिष्टता बिना छिपाए पाठक को अर्थ-सहायता मिलती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘मण्डली’ सामुदायिक स्वरूप और ‘कुड़कुड़ाया’ सामूहिक शिकायत के नकारात्मक भाव को बनाए रखते हैं।
