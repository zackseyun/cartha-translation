base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/012.yaml
  text: I have heard the grumblings of the sons of Israel[a]. Speak to them, saying, ‘Between the evenings you shall eat meat, and in the morning you shall be filled with bread[b], and you shall know that I am Yahweh your God.’
translation:
  language: hi
  text: मैंने इस्राएल के पुत्रों की बड़बड़ाहटें सुन ली हैं। उनसे कह, ‘साँझ के झुटपुटे में[a] तुम मांस खाओगे और सुबह रोटी से तृप्त हो जाओगे। तब तुम जानोगे कि मैं याहवे तुम्हारा परमेश्वर हूँ।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “दो साँझों के बीच”; यह एक इब्रानी मुहावरा है, जो साँझ के झुटपुटे के समय को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְתִּי
  choice: मैंने ... सुन ली है
  rationale: इब्रानी पूर्ण क्रिया का वर्तमान से जुड़ा परिणाम यहाँ महत्त्वपूर्ण है; हिन्दी का पूर्ण वर्तमान परमेश्वर द्वारा अभी दिए जा रहे उत्तर से इसका संबंध स्वाभाविक रूप से दिखाता है।
- source_word: תְּלוּנֹּת
  choice: कुड़कुड़ाहट
  rationale: यह शब्द जंगल के प्रसंग में असंतोष से बार-बार शिकायत करने का भाव रखता है; ‘शिकायतें’ की अपेक्षा ‘कुड़कुड़ाहट’ उस स्वर को अधिक स्पष्ट करता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: इब्रानी का शाब्दिक पुरुषवाचक बहुवचन ‘इस्राएल के पुत्र’ रखा गया है; अधिक मुहावरेदार विकल्प ‘इस्राएलियों’ होता।
- source_word: דַּבֵּר אֲלֵהֶם לֵאמֹר
  choice: उनसे कह
  rationale: इब्रानी भाषण-प्रस्तावना का अर्थ सहज आधुनिक हिन्दी में संक्षेप और स्वाभाविक रूप से व्यक्त होता है; ‘यह कहते हुए उनसे बोल’ अत्यधिक कृत्रिम होता।
- source_word: בֵּין הָעַרְבַּיִם
  choice: साँझ के झुटपुटे में
  rationale: शाब्दिक अर्थ ‘दो साँझों के बीच’ है, पर अभिप्राय साँझ का संधिकाल है। मुख्य पाठ में स्पष्ट हिन्दी दी गई और शाब्दिक रूप पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: תִּשְׂבְּעוּ לָחֶם
  choice: रोटी खाकर तृप्त हो जाओगे
  rationale: क्रिया שבע पेट भरने और संतुष्ट होने का अर्थ देती है। यह अनुवाद ‘रोटी से भर दिए जाओगे’ की तुलना में स्वाभाविक हिन्दी में पर्याप्तता का ठोस भाव बनाए रखता है।
- source_word: וִידַעְתֶּם
  choice: तब तुम जानोगे
  rationale: वाव-संयुक्त रूप यहाँ दिए गए भोजन के फलस्वरूप होने वाली पहचान को आगे बढ़ाता है; ‘तब’ उस परिणामी संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले व्यक्तिगत दिव्य नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित निकट लिप्यंतरण ‘याहवे’ से व्यक्त किया गया है।
- source_word: אֱלֹהֵיכֶם
  choice: तुम्हारा परमेश्वर
  rationale: यद्यपि אֱלֹהִים रूपतः बहुवचन है, यहाँ इस्राएल के एक परमेश्वर के लिए प्रयुक्त है; संबंधवाचक प्रत्यय बहुवचन श्रोताओं के लिए है, जिसे हिन्दी में सामूहिक ‘तुम्हारा’ व्यक्त करता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / यहोवा के स्थान पर ‘प्रभु’
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। लिप्यंतरण नाम और उपाधि के भेद को सुरक्षित रखता है, जबकि किसी विशेष व्याख्यात्मक परंपरा को आरोपित नहीं करता।
- issue: בְּנֵי יִשְׂרָאֵל में पुरुषवाचक रूप
  choice: इस्राएल के पुत्रों
  alternative: इस्राएलियों / इस्राएल की सन्तान
  rationale: मूल की स्पष्ट पुरुषवाचक संरचना को औपचारिक पारदर्शिता के लिए रखा गया है, यद्यपि प्रसंग में संबोधित समुदाय व्यापक इस्राएली जनसमूह है।
- issue: ज्ञान-वाक्य का परिणामसूचक संबंध
  choice: तब तुम जानोगे
  alternative: और तुम जानोगे
  rationale: दोनों मूल के वाव को व्यक्त कर सकते हैं; ‘तब’ भोजन की प्रतिज्ञा और याहवे की पहचान के बीच निहित परिणाम को स्पष्ट करता है, बिना ज्ञान के स्वरूप को आगे परिभाषित किए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। एकवचन ‘कह’ मूसा को संबोधन और बहुवचन ‘तुम’ इस्राएली समुदाय को संबोधन दर्शाता है। उद्धरण-चिह्नों में प्रत्यक्ष वाणी स्पष्ट की गई है।
