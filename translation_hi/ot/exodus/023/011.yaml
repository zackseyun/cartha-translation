base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/011.yaml
  text: But in the seventh year you shall let it rest and leave it alone[a], so that the poor of your people may eat; and what they leave, the wild animals of the field may eat[b]. You shall do the same with your vineyard and your olive grove.
translation:
  language: hi
  text: परन्तु सातवें वर्ष भूमि को खेती से मुक्त कर देना और उसे परती रहने देना[a], ताकि तुम्हारे लोगों के निर्धन उससे खा सकें; और जो कुछ वे छोड़ दें, उसे खेत के जंगली पशु खा सकें[b]। अपनी अंगूर की बारी और जैतून के बाग के साथ भी ऐसा ही करना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे छोड़ देना और त्याग देना”; इब्रानी की दोनों क्रियाएँ सातवें वर्ष सामान्य खेती रोककर भूमि को बिना जोते छोड़ने पर बल देती हैं।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “खेत का पशु।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשְּׁבִיעִת
  choice: परन्तु सातवें वर्ष
  rationale: संयोजक और क्रमवाचक पद पिछले छह वर्षों के विपरीत सातवें वर्ष का विधान प्रस्तुत करते हैं; हिन्दी में यह स्वाभाविक कालवाचक अभिव्यक्ति है।
- source_word: תִּשְׁמְטֶנָּה
  choice: भूमि को विश्राम करने देना
  rationale: שׁמט यहाँ भूमि को सामान्य खेती से मुक्त रखने का बोध देता है। पिछले पद से निहित स्त्रीलिंग कर्म ‘भूमि’ को स्पष्ट किया गया है।
- source_word: וּנְטַשְׁתָּהּ
  choice: उसे यूँ ही छोड़ देना
  rationale: נטשׁ का अर्थ छोड़ना या त्यागना हो सकता है। कृषि-विधान के इस संदर्भ में यह अनुवाद स्थायी परित्याग का अनावश्यक अर्थ दिए बिना भूमि को न जोतने की बात बताता है।
- source_word: אֶבְיֹנֵי עַמֶּךָ
  choice: तुम्हारी प्रजा के निर्धन लोग
  rationale: אביון निर्धन या जरूरतमंद व्यक्ति को दर्शाता है; यह चयन सामाजिक सरोकार और संबंधसूचक भाव दोनों बनाए रखता है।
- source_word: וְיִתְרָם
  choice: जो कुछ वे छोड़ दें
  rationale: יתר से बना यह रूप निर्धनों के खाने के बाद बची हुई वस्तु को दर्शाता है; हिन्दी में कर्ता और आशय स्पष्ट रहते हैं।
- source_word: תֹּאכַל חַיַּת הַשָּׂדֶה
  choice: उसे मैदान के जंगली जीव खा लें
  rationale: חַיַּת הַשָּׂדֶה एक सामूहिक अभिव्यक्ति है जिसका स्वाभाविक आधुनिक हिन्दी रूप ‘मैदान के जंगली जीव’ है।
- source_word: כֵּן תַּעֲשֶׂה
  choice: के साथ भी ऐसा ही करना
  rationale: यह पहले दिए गए सातवें वर्ष के नियम को आगे बताई गई उपज पर लागू करने वाला सीधा कानूनी निर्देश है।
- source_word: לְכַרְמְךָ
  choice: अपनी अंगूर की बारी
  rationale: כרם अंगूर की खेती वाली बारी को दर्शाता है; यह आधुनिक हिन्दी में स्पष्ट और कृषि-संदर्भ के अनुकूल है।
- source_word: לְזֵיתֶךָ
  choice: जैतून के बाग
  rationale: זית यहाँ सामूहिक रूप से जैतून के वृक्षों की खेती को दर्शाता है; ‘जैतून का बाग’ अंगूर की बारी के समानांतर प्राकृतिक हिन्दी है।
