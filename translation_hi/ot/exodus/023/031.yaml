source:
  edition: WLC
  text: וְ/שַׁתִּ֣י אֶת גְּבֻלְ/ךָ֗ מִ/יַּם סוּף֙ וְ/עַד יָ֣ם פְּלִשְׁתִּ֔ים וּ/מִ/מִּדְבָּ֖ר עַד הַ/נָּהָ֑ר כִּ֣י אֶתֵּ֣ן בְּ/יֶדְ/כֶ֗ם אֵ֚ת יֹשְׁבֵ֣י הָ/אָ֔רֶץ וְ/גֵרַשְׁתָּ֖/מוֹ מִ/פָּנֶֽי/ךָ־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/031.yaml
  text: And I will set your border from the Red Sea to the Sea of the Philistines[a], and from the wilderness to the River; for I will give the inhabitants of the land into your hand[b], and you will drive them out from before you.
translation:
  language: hi
  text: मैं तेरी सीमा लाल समुद्र[a] से लेकर पलिश्तियों के समुद्र तक, और निर्जन प्रदेश से लेकर नदी[b] तक निर्धारित करूँगा; क्योंकि मैं उस देश के निवासियों को तुम्हारे हाथ में दे दूँगा, और तू उन्हें अपने सामने से निकाल देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ सम्भवतः ‘सरकंडों का समुद्र’ है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात् फरात नदी।
    reason: cultural_note
lexical_decisions:
- source_word: וְשַׁתִּי
  choice: मैं ... ठहराऊँगा
  rationale: संदर्भ में यह पूर्ण रूप परमेश्वर की भावी प्रतिज्ञा व्यक्त करता है। ‘सीमा ठहराना’ आधुनिक हिन्दी में स्वाभाविक है और שׂים के अर्थ को सुरक्षित रखता है।
- source_word: גְּבֻלְךָ
  choice: तेरी सीमा
  rationale: गְּבוּל यहाँ भौगोलिक सीमा को सूचित करता है; ‘सीमा’ हिन्दी में स्पष्ट और सटीक है।
- source_word: מִיַּם סוּף
  choice: लाल समुद्र
  rationale: यह प्रचलित और पहचानने योग्य भौगोलिक नाम है; इब्रानी पद का अधिक शाब्दिक अर्थ पाद-टिप्पणी में दिया गया है।
- source_word: יָם פְּלִשְׁתִּים
  choice: पलिश्तियों का समुद्र
  rationale: यह इब्रानी जातीय-भौगोलिक पदनाम को पारदर्शी रूप से सुरक्षित रखता है; सम्भावित आधुनिक पहचान को मूल पाठ में नहीं मिलाया गया।
- source_word: וּמִמִּדְבָּר
  choice: और निर्जन प्रदेश से
  rationale: מִדְבָּר निर्जन, कम आबाद भूभाग को दर्शा सकता है। ‘निर्जन प्रदेश’ आधुनिक पाठक के लिए स्पष्ट है और हर संदर्भ में रेतीले मरुस्थल का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: הַנָּהָר
  choice: नदी
  rationale: मूल में निश्चित पद ‘नदी’ है, जो परंपरागत रूप से फरात को सूचित करता है। मुख्य पाठ इब्रानी अभिव्यक्ति रखता है और पाद-टिप्पणी पहचान स्पष्ट करती है।
- source_word: אֶתֵּן בְּיֶדְכֶם
  choice: तुम्हारे हाथ में कर दूँगा
  rationale: यह נתן ביד की ठोस इब्रानी छवि और किसी को अधिकार में सौंपने का भाव दोनों सुरक्षित रखता है।
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: उस देश के निवासी
  rationale: यह देश में रहने वालों के लिए प्रयुक्त सहभागी रूप का स्वाभाविक हिन्दी अनुवाद है।
- source_word: וְגֵרַשְׁתָּמוֹ מִפָּנֶיךָ
  choice: तू उन्हें अपने सामने से निकाल देगा
  rationale: ‘निकाल देगा’ גרשׁ के बलपूर्वक बाहर करने के भाव को व्यक्त करता है, और ‘अपने सामने से’ मूल मुहावरे की छवि बनाए रखता है।
theological_decisions:
- issue: יַם סוּף की भौगोलिक पहचान
  choice: मुख्य पाठ में ‘लाल समुद्र’
  alternative: ‘सरकंडों का समुद्र’
  rationale: ‘लाल समुद्र’ पहचानने योग्य पारंपरिक भौगोलिक नाम है, जबकि अधिक शाब्दिक सम्भावना को पाद-टिप्पणी में सुरक्षित रखा गया है; इस प्रकार पाठ किसी विवादित व्युत्पत्ति को चुपचाप निर्णायक नहीं बनाता।
- issue: הַנָּהָר का संकेत
  choice: मुख्य पाठ में ‘नदी’, पाद-टिप्पणी में फरात की पहचान
  alternative: मुख्य पाठ में ‘फरात नदी’
  rationale: मूल पाठ केवल निश्चित रूप में ‘नदी’ कहता है। पाद-टिप्पणी पारंपरिक भौगोलिक संकेत स्पष्ट करती है, पर मुख्य पाठ में नाम जोड़ने से बचती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। इब्रानी में संबोधन का वचन ‘तेरी/तू’ (एकवचन) से ‘तुम्हारे’ (बहुवचन) और फिर एकवचन में बदलता है; अनुवाद ने इस वास्तविक रूप-परिवर्तन को समतल नहीं किया है।
