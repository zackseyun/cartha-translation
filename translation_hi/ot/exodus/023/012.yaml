id: EXO.23.12
reference: Exodus 23:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: שֵׁ֤שֶׁת יָמִים֙ תַּעֲשֶׂ֣ה מַעֲשֶׂ֔י/ךָ וּ/בַ/יּ֥וֹם הַ/שְּׁבִיעִ֖י תִּשְׁבֹּ֑ת לְמַ֣עַן יָנ֗וּחַ שֽׁוֹרְ/ךָ֙ וַ/חֲמֹרֶ֔/ךָ וְ/יִנָּפֵ֥שׁ בֶּן אֲמָתְ/ךָ֖ וְ/הַ/גֵּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/012.yaml
  text: For six days you shall do your work[a], but on the seventh day you shall cease, so that your ox and your donkey may rest[c][b], and the son of your female servant and the sojourner may be refreshed.
translation:
  language: hi
  text: छः दिन अपना काम-काज करना, पर सातवें दिन काम बंद रखना[a], ताकि तुम्हारे बैल और गधे आराम पाएँ, और तुम्हारी दासी का बेटा तथा तुम्हारे बीच रहनेवाला परदेशी[b] नया दम पा सकें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी क्रिया का मूल अर्थ ‘रुकना’ या ‘विराम लेना’ है; इसका अनुवाद ‘विश्राम करना’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘परदेशी’ से आशय ऐसे विदेशी व्यक्ति से है जो इस्राएलियों के बीच रहकर उनकी सामाजिक और कानूनी व्यवस्था के अधीन था।
    reason: cultural_note
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים תַּעֲשֶׂה מַעֲשֶׂיךָ
  choice: छः दिन अपना काम-काज करना
  rationale: इब्रानी में अवधि के साथ कानूनी निर्देश है। हिंदी का क्रियार्थक आज्ञार्थक रूप निर्देश को स्वाभाविक ढंग से व्यक्त करता है; ‘काम-काज’ מַעֲשֶׂיךָ के व्यापक अर्थ को रखता है।
- source_word: וּבַיּוֹם הַשְּׁבִיעִי תִּשְׁבֹּת
  choice: पर सातवें दिन काम बंद रखना
  rationale: וְ यहाँ छह दिनों और सातवें दिन के बीच विरोध दर्शाता है। שׁבת का मूल भाव काम से रुकना या विराम लेना है; ‘काम बंद रखना’ हिंदी में स्पष्ट और स्वाभाविक है।
- source_word: לְמַעַן יָנוּחַ
  choice: ताकि ... आराम पाएँ
  rationale: לְמַעַן उद्देश्य बताता है और נוח विश्राम पाने का भाव देता है।
- source_word: שׁוֹרְךָ וַחֲמֹרֶךָ
  choice: तुम्हारे बैल और गधे
  rationale: दोनों संज्ञाएँ घरेलू काम करनेवाले पशुओं को उनके सामान्य अर्थ में दर्शाती हैं।
- source_word: וְיִנָּפֵשׁ
  choice: नया दम पा सकें
  rationale: נפשׁ का निफ़अल रूप यहाँ साँस लेने, फिर से स्फूर्ति पाने या तरोताज़ा होने का भाव देता है। ‘नया दम पा सकें’ इस सजीव भाव को सहज हिंदी में रखता है।
- source_word: בֶּן אֲמָתְךָ
  choice: तुम्हारी दासी का बेटा
  rationale: यह मूल वाक्यांश की सामाजिक और पारिवारिक संबद्धता को बिना अतिरिक्त व्याख्या के सीधे बनाए रखता है।
- source_word: הַגֵּר
  choice: तुम्हारे बीच रहनेवाला परदेशी
  rationale: גֵּר केवल अनजान व्यक्ति नहीं, बल्कि इस्राएल के बीच बसकर रहनेवाला बाहरी व्यक्ति है। यह अनुवाद उस कानूनी-सामाजिक श्रेणी को सामान्य हिंदी में स्पष्ट करता है।
theological_decisions:
- issue: सब्त-विधान में שׁבת का अर्थ
  choice: काम बंद रखना
  alternative: विश्राम करना
  rationale: क्रिया का मूल बल गतिविधि, विशेषकर काम, रोकने पर है। अगले उद्देश्य-वाक्य पशुओं और आश्रित लोगों को मिलनेवाले विश्राम और स्फूर्ति को अलग से बताते हैं; इसलिए दोनों भावों को एक नहीं किया गया।
- issue: גֵּר की सामाजिक पहचान
  choice: तुम्हारे बीच रहनेवाला परदेशी
  alternative: अजनबी
  rationale: पद सब्त की राहत को उस निवासी विदेशी तक बढ़ाता है जो इस्राएली समाज में रहता है। ‘अजनबी’ इस स्थायी कानूनी-सामाजिक संबंध को अस्पष्ट कर सकता है।
- issue: בֶּן אֲמָתְךָ का संबंध
  choice: तुम्हारी दासी का बेटा
  alternative: दासी का पुत्र
  rationale: मूल पाठ व्यक्ति को दासी के बेटे के रूप में पहचानता है। इस संबंध को सामान्यीकृत करके केवल ‘दास’ या ‘सेवक’ नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज किंतु गरिमापूर्ण कानूनी निर्देश। ‘करना’ और ‘रखना’ वाले रूप आज्ञा को कठोर या पुरातन बनाए बिना स्पष्ट रखते हैं। संबोधन एकवचन इब्रानी है, पर आधुनिक हिंदी में सम्मानपूर्ण/सामान्य ‘तुम’ का प्रयोग किया गया है।
