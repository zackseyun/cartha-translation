base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/019.yaml
  text: The first of the firstfruits of your ground you shall bring into the house of Yahweh your God[b][a]. You shall not boil a young goat in its mother’s milk.
translation:
  language: hi
  text: अपनी भूमि की पहली उपज का पहला भाग[a] तुम अपने परमेश्वर याहवे के भवन में लाना। बकरी के बच्चे[b] को उसकी माँ के दूध में न उबालना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपनी भूमि की पहली उपज।” इब्रानी में शाब्दिक रूप से, “पहली उपज का पहला भाग।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी शब्द का सामान्य अर्थ “बकरी का बच्चा” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵאשִׁית בִּכּוּרֵי
  choice: पहली उपज का पहला भाग
  rationale: रֵאשִׁית के ‘पहले भाग’ और בִּכּוּרֵי के उपासना-संबंधी ‘पहली उपज’—दोनों भावों को बनाए रखता है, यद्यपि हिन्दी में हल्की पुनरुक्ति आती है।
- source_word: אַדְמָתְךָ
  choice: अपनी भूमि की
  rationale: यहाँ अֲדָמָה खेती की भूमि या मिट्टी को सूचित करता है; ‘भूमि’ कृषि-संदर्भ में स्वाभाविक और पर्याप्त रूप से ठोस है।
- source_word: תָּבִיא
  choice: तुम ... लाना
  rationale: विधिक निर्देश की आज्ञात्मक शक्ति को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בֵּית יְהוָה אֱלֹהֶיךָ
  choice: अपने परमेश्वर याहवे के भवन में
  rationale: בַּיִת का अनुवाद ‘भवन’ किया गया है, ‘मन्दिर’ नहीं, क्योंकि संदर्भ किसी बाद के स्थायी मन्दिर तक सीमित नहीं है; יְהוָה को उसके व्यक्तिगत वाचा-नाम ‘याहवे’ से दर्शाया गया है।
- source_word: לֹא תְבַשֵּׁל
  choice: न उबालना
  rationale: בשל के विशिष्ट अर्थ ‘उबालना’ को व्यापक ‘पकाना’ की अपेक्षा प्राथमिकता दी गई है।
- source_word: גְּדִי
  choice: बकरी के बच्चे
  rationale: शब्द का सामान्य अर्थ बकरी का बच्चा है; यह हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: בַּחֲלֵב אִמּוֹ
  choice: उसकी माँ के दूध में
  rationale: मूल इब्रानी की प्रत्यक्ष छवि और संबंध को स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम स्पष्ट रूप से उपस्थित है; ‘याहवे’ उसे उपाधि में बदले बिना अधिक निकटता से प्रस्तुत करता है।
- issue: बकरी के बच्चे को उसकी माँ के दूध में उबालने की मनाही का आशय
  choice: मनाही को उसके शाब्दिक रूप में रखना
  alternative: इसे कनानी अनुष्ठान, क्रूरता अथवा बाद की आहार-व्यवस्था से जोड़कर व्याख्यात्मक अनुवाद करना
  rationale: पद स्वयं इस मनाही का कारण नहीं बताता; इसलिए अनुवाद किसी अनिश्चित ऐतिहासिक या धर्मशास्त्रीय व्याख्या को पाठ में नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रखी गई है। विधिक आज्ञा के लिए ‘लाना’ और ‘न उबालना’ का प्रयोग किया गया है; ‘भवन’ मूल के व्यापक उपासना-स्थान को बनाए रखता है।
