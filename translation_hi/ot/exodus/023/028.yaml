base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/028.yaml
  text: And I will send the hornet ahead of you[a], and it will drive out the Hivite, the Canaanite, and the Hittite from before you.
translation:
  language: hi
  text: और मैं तुम्हारे आगे बर्रे[a] भेजूँगा, और वे हिव्वियों, कनानियों और हित्तियों को तुम्हारे सामने से निकाल देंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः यह घबराहट अथवा परमेश्वर द्वारा इस्राएल के आगे भेजे गए किसी अन्य प्रकार के दबाव का रूपक है; इब्रानी शब्द का सामान्य अर्थ “बर्रा” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁלַחְתִּי
  choice: और मैं ... भेजूँगा
  rationale: संयोजक वाव के साथ काल रूप इस प्रतिज्ञात्मक प्रसंग में भविष्य का भाव देता है; यह अनुवाद परमेश्वर के कर्तृत्व को स्पष्ट रखता है।
- source_word: הַצִּרְעָה
  choice: बर्रे
  rationale: इब्रानी शब्द का सामान्य अर्थ बर्रा अथवा डंक मारने वाला ऐसा कीट है। एकवचन रूप सामूहिक अर्थ में प्रयुक्त हो सकता है, इसलिए स्वाभाविक हिन्दी में बहुवचन रखा गया है।
- source_word: לְפָנֶיךָ
  choice: तुम्हारे आगे
  rationale: शाब्दिक अर्थ 'तुम्हारे मुख के सामने' है; यहाँ इस्राएल से पहले भेजे जाने का स्थानिक भाव है।
- source_word: וְגֵרְשָׁה
  choice: और वे ... निकाल देंगे
  rationale: גרשׁ का अर्थ खदेड़ना या निकाल देना है। हिन्दी में सामूहिक 'बर्रे' के अनुरूप बहुवचन क्रिया स्वाभाविक है।
- source_word: הַחִוִּי
  choice: हिव्वियों
  rationale: जनसमूह के नाम का प्रचलित हिन्दी लिप्यंतरण; प्रसंग में जाति के लोगों को सामूहिक रूप से सूचित करता है।
- source_word: הַכְּנַעֲנִי
  choice: कनानियों
  rationale: जनसमूह के नाम का प्रचलित हिन्दी रूप।
- source_word: הַחִתִּי
  choice: हित्तियों
  rationale: जनसमूह के नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: מִלְּפָנֶיךָ
  choice: तुम्हारे सामने से
  rationale: यह पहले आए स्थानिक मुहावरे को प्रतिध्वनित करता है और उनके मार्ग अथवा उपस्थिति से हटाए जाने का भाव देता है।
theological_decisions:
- issue: הַצִּרְעָה को वास्तविक बर्रे समझा जाए या आतंक/दैवी दबाव का रूपक
  choice: मुख्य पाठ में शाब्दिक अर्थ 'बर्रे'
  alternative: '''आतंक'', घबराहट, या परमेश्वर द्वारा भेजे गए किसी अन्य दबाव का रूपक'
  rationale: शब्द का सामान्य कोशगत अर्थ डंक मारने वाला कीट, विशेषतः बर्रा, है। रूपकात्मक व्याख्या संभव है, पर पाठ द्वारा अनिवार्य नहीं; इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। 'बर्रे' सामूहिक अर्थ को स्वाभाविक ढंग से व्यक्त करता है; जातिनामों के बहुवचन रूप सामान्य हिन्दी बाइबलीय प्रयोग के अनुरूप हैं।
