  text: כִּ֣י אִם שָׁמֹ֤עַ תִּשְׁמַע֙ בְּ/קֹל֔/וֹ וְ/עָשִׂ֕יתָ כֹּ֖ל אֲשֶׁ֣ר אֲדַבֵּ֑ר וְ/אָֽיַבְתִּי֙ אֶת אֹ֣יְבֶ֔י/ךָ וְ/צַרְתִּ֖י אֶת צֹרְרֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/022.yaml
  text: But if you carefully obey his voice and do all that I speak[b][a], then I will be an enemy to your enemies and an adversary to your adversaries.
translation:
  language: hi
  text: परन्तु यदि तुम उसकी वाणी को ध्यान से मानोगे[a] और वह सब करोगे जो मैं कहूँगा[b], तो मैं तुम्हारे शत्रुओं का शत्रु और तुम्हारे विरोधियों का विरोधी हो जाऊँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यदि तुम निश्चय उसकी वाणी सुनोगे।” इब्रानी में बल देने के लिए अनन्तरूप के साथ उसी धातु की क्रिया प्रयुक्त है; ‘सुनना’ यहाँ आज्ञापालन का भाव भी रखता है।
    reason: lexical_alternative
  - marker: b
    text: पद में “उसकी वाणी” से “मैं कहूँगा” की ओर बदलाव होता है। यह प्रसंग में दूत और यहोवा के बीच घनिष्ठ संबंध को ज्यों का त्यों रखता है।
    reason: cross_reference
lexical_decisions:
- source_word: כִּי אִם
  choice: परन्तु यदि
  rationale: यह पद पिछले प्रसंग के संबंध में एक प्रबल शर्त और विरोध प्रकट करता है; ‘परन्तु यदि’ आधुनिक हिन्दी में दोनों भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: שָׁמֹעַ תִּשְׁמַע
  choice: सचमुच ... सुनोगे
  rationale: क्रिया के साथ प्रयुक्त infinitive absolute बल देता है। ‘सचमुच सुनोगे’ उस बल को बनाए रखता है और ‘वाणी सुनना’ संदर्भ में आज्ञापालन का भाव भी समेटता है, पर उसे केवल ‘पालन करना’ कहकर सुनने की मूल छवि मिटाता नहीं।
- source_word: בְּקֹלוֹ
  choice: उसकी वाणी
  rationale: यह अनुवाद इब्रानी की व्यक्तिगत ‘उसकी आवाज़/वाणी’ को सुरक्षित रखता है और प्रसंग के दूत की ओर संकेत बनाए रखता है।
- source_word: וְעָשִׂיתָ כֹּל אֲשֶׁר אֲדַבֵּר
  choice: और वह सब करोगे जो मैं कहूँगा
  rationale: ‘उसकी वाणी’ से ‘मैं कहूँगा’ तक पुरुष का बदलाव ज्यों का त्यों रखा गया है। ‘कहूँगा’ हिन्दी में स्वाभाविक और स्रोत के אֲדַבֵּר का स्पष्ट अर्थ है।
- source_word: וְאָיַבְתִּי אֶת אֹיְבֶיךָ
  choice: मैं तुम्हारे शत्रुओं का शत्रु ... हो जाऊँगा
  rationale: यह איב और אֹיְבֶיךָ के शब्द-संबंध तथा पारस्परिक शत्रुता की स्पष्ट समानांतर रचना को सुरक्षित रखता है।
- source_word: וְצַרְתִּי אֶת צֹרְרֶיךָ
  choice: और तुम्हारे विरोधियों का विरोधी हो जाऊँगा
  rationale: ‘विरोधी’ की पुनरावृत्ति क्रिया צרר और उसके सजातीय संज्ञात्मक रूप צֹרְרֶיךָ के इब्रानी शब्दालंकार को हिन्दी में यथासंभव दर्शाती है तथा पहले खंड के ‘शत्रु’ से भिन्नता बनाए रखती है।
theological_decisions:
- issue: ‘उसकी वाणी’ से ‘मैं कहूँगा’ तक संदर्भ-पुरुष का बदलाव
  choice: दूत की वाणी और यहोवा के प्रथम-पुरुष कथन के बीच मूल पाठ के बदलाव को सुरक्षित रखा गया।
  alternative: दोनों वाक्यांशों को केवल दूत अथवा केवल यहोवा की वाणी मानकर एक ही पुरुष में समतल कर देना।
  rationale: निकटवर्ती संदर्भ दूत और यहोवा के अधिकार के बीच घनिष्ठ संबंध रखता है। अनुवाद इस धर्मवैज्ञानिक तनाव को समझाकर समाप्त करने के बजाय मूल रूप में बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। ‘वाणी’ प्रसंग के व्यक्तिगत और अधिकारपूर्ण स्वर को रखती है; ‘शत्रु का शत्रु’ और ‘विरोधी का विरोधी’ मूल की समानांतरता तथा शब्द-संबंध को स्पष्ट रखते हैं।
