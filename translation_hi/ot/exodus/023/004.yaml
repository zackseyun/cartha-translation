source:
  edition: WLC
  text: כִּ֣י תִפְגַּ֞ע שׁ֧וֹר אֹֽיִבְ/ךָ֛ א֥וֹ חֲמֹר֖/וֹ תֹּעֶ֑ה הָשֵׁ֥ב תְּשִׁיבֶ֖/נּוּ לֽ/וֹ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/004.yaml
  text: If you come upon your enemy’s ox or his donkey going astray[a], you must surely return it to him.
translation:
  language: hi
  text: यदि तुम्हें अपने शत्रु का बैल या उसका गधा भटकता हुआ मिले[a], तो उसे अवश्य उसके पास लौटा देना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘जब तुम्हें अपने शत्रु का बैल या उसका गधा इधर-उधर भटकता मिले।’
    reason: כִּי को यहाँ ‘जब’ भी समझा जा सकता है, और תֹּעֶה में इधर-उधर भटकने का भाव हो सकता है।
lexical_decisions:
- source_word: כִּי
  choice: यदि
  rationale: यहाँ यह व्यवस्था की शर्त प्रस्तुत करता है; ‘यदि’ हिन्दी में इस शर्तात्मक रचना को स्वाभाविक रूप से व्यक्त करता है।
- source_word: תִפְגַּע
  choice: तुम्हें ... मिले
  rationale: इस प्रसंग में פגע का अर्थ संयोग से सामना होना या रास्ते में मिलना है; हिन्दी में यह रचना सहज और स्पष्ट है।
- source_word: שׁוֹר
  choice: बैल
  rationale: שׁוֹר यहाँ पालतू गोवंश को सूचित करता है; कृषि-संबंधी कानूनी प्रसंग में ‘बैल’ सटीक और प्रचलित है।
- source_word: אֹיִבְךָ
  choice: अपने शत्रु का
  rationale: मूल पाठ स्पष्ट रूप से ‘तुम्हारे शत्रु’ कहता है; नैतिक तनाव को किसी नरम या तटस्थ संबंध में नहीं बदला गया।
- source_word: חֲמֹרוֹ
  choice: उसका गधा
  rationale: חֲמוֹר का सामान्य अर्थ ‘गधा’ है, और प्रत्यय उसके शत्रु से संबंध को व्यक्त करता है।
- source_word: תֹּעֶה
  choice: भटकता हुआ
  rationale: תעה का कृदंत पशु के रास्ते से भटकने या इधर-उधर जाने की अवस्था बताता है; ‘भटकता हुआ’ इस गतिशील और कुछ हद तक अस्पष्ट भाव को बनाए रखता है।
- source_word: הָשֵׁב תְּשִׁיבֶנּוּ
  choice: उसे अवश्य ... लौटा देना
  rationale: क्रिया के साथ infinitive absolute आदेश पर बल देता है; ‘अवश्य’ उस जोर को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: לוֹ
  choice: उसके पास
  rationale: सर्वनाम सीधे शत्रु अर्थात पशु के स्वामी की ओर संकेत करता है; ‘उसके पास’ मूल के सर्वनामिक रूप को बनाए रखता है।
theological_decisions:
- issue: शत्रु के प्रति नैतिक दायित्व
  choice: ‘शत्रु’ को स्पष्ट रखते हुए उसके भटके पशु को लौटाने का आदेश
  alternative: ‘पड़ोसी’ या किसी तटस्थ व्यक्ति का पशु
  rationale: इब्रानी पाठ אֹיִבְךָ, ‘तुम्हारा शत्रु’, कहता है। इसे बनाए रखने से विरोधी के प्रति भी न्याय और व्यावहारिक दया दिखाने की नैतिक तीक्ष्णता सुरक्षित रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए सहज। कानूनी आदेश का जोर ‘अवश्य’ से व्यक्त किया गया है, जबकि शत्रु के प्रति दायित्व की मूल नैतिक तीक्ष्णता सुरक्षित रखी गई है।
