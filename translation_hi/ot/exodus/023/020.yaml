  text: הִנֵּ֨ה אָנֹכִ֜י שֹׁלֵ֤חַ מַלְאָךְ֙ לְ/פָנֶ֔י/ךָ לִ/שְׁמָרְ/ךָ֖ בַּ/דָּ֑רֶךְ וְ/לַ/הֲבִ֣יאֲ/ךָ֔ אֶל הַ/מָּק֖וֹם אֲשֶׁ֥ר הֲכִנֹֽתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/020.yaml
  text: Behold[a], I am sending an angel before you to guard you on the way and to bring you to the place that I have prepared.
translation:
  language: hi
  text: देख, मैं तेरे आगे एक स्वर्गदूत[a] भेज रहा हूँ, ताकि वह मार्ग में तेरी रक्षा करे और तुझे उस स्थान पर पहुँचाए जिसे मैंने तैयार किया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “संदेशवाहक।” हिब्रू शब्द מַלְאָךְ का अर्थ मानवीय संदेशवाहक या स्वर्गीय दूत—दोनों हो सकता है; यहाँ प्रसंग में “स्वर्गदूत” अधिक उपयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: देख
  rationale: यह ध्यान आकर्षित करने वाले हिब्रू अव्यय की शक्ति को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: אָנֹכִי שֹׁלֵחַ
  choice: मैं ... भेज रहा हूँ
  rationale: स्वतंत्र सर्वनाम और कृदन्त का मेल आसन्न या आरम्भ हो रही क्रिया को व्यक्त करता है; हिन्दी का वर्तमान प्रगतिशील रूप इसे सहज ढंग से दर्शाता है।
- source_word: מַלְאָךְ
  choice: एक स्वर्गदूत
  rationale: शब्द का मूल अर्थ 'संदेशवाहक' भी हो सकता है, पर इस प्रसंग में परमेश्वर द्वारा भेजे गए अलौकिक रक्षक और मार्गदर्शक का अर्थ अधिक उपयुक्त है; वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: לְפָנֶיךָ
  choice: तेरे आगे
  rationale: यह आगे-आगे जाने के स्थानिक और मार्गदर्शक भाव को संक्षिप्त तथा स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לִשְׁמָרְךָ בַּדָּרֶךְ
  choice: मार्ग में तेरी रक्षा करे
  rationale: שׁמר के सुरक्षात्मक अर्थ और यात्रा-संदर्भ दोनों को स्पष्ट रूप से बनाए रखता है।
- source_word: וְלַהֲבִיאֲךָ
  choice: और तुझे ... पहुँचाए
  rationale: बोअल के हिफ़ील रूप का कारणवाचक अर्थ 'ले आना/पहुँचाना' है; गन्तव्य के साथ 'पहुँचाए' आधुनिक हिन्दी में अधिक स्वाभाविक है।
- source_word: הַמָּקוֹם אֲשֶׁר הֲכִנֹתִי
  choice: उस स्थान ... जिसे मैंने तैयार किया है
  rationale: מקום का सीधा अर्थ 'स्थान' और כון हिफ़ील का प्रसंगानुकूल अर्थ 'तैयार करना' सुरक्षित रहता है।
theological_decisions:
- issue: इस प्रसंग में מַלְאָךְ की पहचान
  choice: मुख्य पाठ में 'एक स्वर्गदूत' रखा गया है, पर उसकी सृष्ट स्वर्गदूत अथवा यहोवा की किसी विशिष्ट दिव्य अभिव्यक्ति के रूप में पहचान निश्चित नहीं की गई।
  alternative: मानवीय संदेशवाहक; अथवा यहोवा का अद्वितीय दिव्य दूत
  rationale: पद स्वयं इस पात्र को केवल מַלְאָךְ कहता है। व्यापक प्रसंग उसकी स्थिति पर प्रश्न उठाता है, इसलिए अनुवाद किसी विशिष्ट धर्मवैज्ञानिक पहचान को आरोपित नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। एकवचन सम्बोधन के लिए 'तेरे/तुझे' रखा गया है, जो हिब्रू के एकवचन रूप को सुरक्षित रखता है और यहाँ सामूहिक इस्राएल को सम्बोधित करता है।
