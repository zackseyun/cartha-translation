base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/033.yaml
  text: They must not dwell in your land[a], lest they cause you to sin against me; for if you serve their gods[c][b], it will surely become a snare to you.
translation:
  language: hi
  text: वे तुम्हारे देश में न बसें, कहीं ऐसा न हो कि वे तुमसे मेरे विरुद्ध पाप करवाएँ[a]; क्योंकि यदि तुम उनके देवताओं की उपासना करोगे[b], तो यह तुम्हारे लिए फंदा[c] बन जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे तुम्हें मेरे विरुद्ध पाप करने को उकसाएँ।”
    reason: lexical_alternative
  - marker: b
    text: या, “क्योंकि तुम उनके देवताओं की उपासना करने लगोगे”; इब्रानी संयोजक को व्याख्यात्मक माना जा सकता है, जिससे यह उपवाक्य केवल शर्त नहीं बल्कि संभावित परिणाम भी बताता है।
    reason: alternative_reading
  - marker: c
    text: “फंदा” इब्रानी शब्द मोकेश का अनुवाद है। यह ऐसे जाल का रूपक है जो पाप, विनाश या परमेश्वर से विमुखता की ओर ले जाता है।
    reason: cultural_note
lexical_decisions:
- source_word: יֵשְׁבוּ בְּאַרְצְךָ
  choice: तुम्हारे देश में न बसें
  rationale: ישׁב यहाँ लगातार निवास करने या बसने का भाव देता है। אֶרֶץ के वाचा-संबंधी क्षेत्रीय संदर्भ में ‘देश’ सहज आधुनिक हिन्दी है।
- source_word: פֶּן
  choice: कहीं ऐसा न हो कि
  rationale: यह निषेध के पीछे आशंकित और अवांछित परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יַחֲטִיאוּ אֹתְךָ לִי
  choice: वे तुमसे मेरे विरुद्ध पाप कराएँ
  rationale: חטא का हिफ़ील रूप कारणवाचक है; ‘पाप कराएँ’ उस कारणवाचकता को बनाए रखता है, और לִי को नैतिक अर्थ में ‘मेरे विरुद्ध’ समझा गया है।
- source_word: תַעֲבֹד אֶת אֱלֹהֵיהֶם
  choice: यदि तुम उनके देवताओं की उपासना करोगे
  rationale: עבד का देवताओं के साथ प्रयोग सेवा और आराधना दोनों का भाव रखता है। हिन्दी में ‘उपासना’ यहाँ धार्मिक निष्ठा को साफ़ और स्वाभाविक रूप से व्यक्त करती है; वाक्य को संभावित परिणाम के रूप में पढ़ते हुए ‘यदि’ रखा गया है।
- source_word: יִהְיֶה לְךָ לְמוֹקֵשׁ
  choice: यह तुम्हारे लिए फंदा बन जाएगा
  rationale: מוֹקֵשׁ वास्तविक फंदे का रूपक है जो पाप, विनाश या धर्मत्याग की ओर ले जाने वाले खतरे को दिखाता है। ‘बन जाएगा’ भविष्य के परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: चेतावनी में बताए गए पाप का स्वरूप
  choice: दूसरे देवताओं की उपासना के द्वारा परमेश्वर के प्रति विश्वासघात
  alternative: विदेशी पड़ोसियों से होने वाले सामान्य नैतिक या सांस्कृतिक भ्रष्टाचार की चेतावनी
  rationale: अगला उपवाक्य सीधे ‘उनके देवताओं की उपासना’ का उल्लेख करता है। इसलिए अनुवाद चेतावनी को मूर्तिपूजक निष्ठा से जोड़ता है, पर इसे जातीय अलगाव के व्यापक दावे में नहीं बदलता।
- issue: כִּי תַעֲבֹד की वाक्यगत भूमिका
  choice: 'शर्त के रूप में: ‘यदि तुम ... उपासना करोगे’'
  alternative: 'संभावित या अपेक्षित परिणाम के रूप में: ‘क्योंकि तुम ... उपासना करने लगोगे’'
  rationale: इब्रानी כִּי यहाँ कारण, व्याख्या या परिस्थिति का संकेत दे सकता है। मुख्य पाठ में स्वाभाविक शर्तीय संबंध रखा गया है और वास्तविक अस्पष्टता को पादटिप्पणी में सुरक्षित किया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘न बसें’, ‘कहीं ऐसा न हो कि’ और ‘फंदा’ मूल की निषेधात्मक चेतावनी तथा रूपक को बनाए रखते हैं। ‘उपासना’ सामान्य पाठक के लिए देवताओं के संदर्भ में ‘सेवा करना’ से अधिक स्पष्ट है, जबकि धार्मिक निष्ठा का आशय सुरक्षित रहता है।
