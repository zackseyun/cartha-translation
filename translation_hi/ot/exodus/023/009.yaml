  yaml_path: translation/ot/exodus/023/009.yaml
  text: You shall not oppress a sojourner[a], and you yourselves know the soul of the sojourner[b], because you were sojourners in the land of Egypt.
translation:
  language: hi
  text: किसी परदेशी[a] पर अत्याचार न करना। तुम स्वयं जानते हो कि परदेशी का जीवन कैसा होता है[b], क्योंकि तुम मिस्र देश में परदेशी थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘विदेशी,’ ‘निवासी विदेशी’ अथवा ‘अजनबी।’ इब्रानी शब्द गेर ऐसे गैर-स्थानीय व्यक्ति को दर्शाता है जो किसी दूसरे समुदाय के बीच रहता है और प्रायः सामाजिक रूप से असुरक्षित होता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘तुम परदेशी के नेफेश को जानते हो।’ यहाँ नेफेश परदेशी के भीतरी अनुभव और उसकी भोगी हुई जीवन-दशा को व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: גֵר
  choice: परदेशी
  rationale: यह शब्द किसी क्षणिक यात्री के बजाय दूसरे लोगों के बीच रहने वाले गैर-स्थानीय और प्रायः सामाजिक रूप से असुरक्षित व्यक्ति को दर्शाता है। ‘परदेशी’ आधुनिक हिन्दी में इस व्यापक सामाजिक स्थिति को सहज रूप से व्यक्त करता है।
- source_word: תִלְחָץ
  choice: अत्याचार न करना
  rationale: इस कानूनी संदर्भ में क्रिया दबाने, शोषण करने या उत्पीड़ित करने का भाव रखती है; ‘अत्याचार करना’ आदेश की सामाजिक-नैतिक गंभीरता स्पष्ट करता है।
- source_word: וְאַתֶּם יְדַעְתֶּם
  choice: तुम स्वयं ... जानते हो
  rationale: स्वतंत्र सर्वनाम וְאַתֶּם के बल और इस्राएल के अनुभव से प्राप्त ज्ञान—दोनों को व्यक्त करता है।
- source_word: אֶת נֶפֶשׁ הַגֵּר
  choice: परदेशी के मन की दशा
  rationale: शाब्दिक ‘परदेशी का नेफेश’ यहाँ उसके भीतरी अनुभव और जीवन की दशा जानने का मुहावरा है। ‘मन की दशा’ हिन्दी में अर्थ स्पष्ट रखती है, जबकि पादटिप्पणी मूल अभिव्यक्ति सुरक्षित करती है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह आदेश का कारण प्रस्तुत करता है।
- source_word: גֵרִים הֱיִיתֶם
  choice: तुम ... परदेशी थे
  rationale: पहले प्रयोग के समान शब्द रखकर इस्राएल के अपने ऐतिहासिक अनुभव पर आधारित नैतिक तर्क को उभारा गया है।
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: मिस्र देश में
  rationale: हिब्रू के ‘मिस्र की भूमि में’ को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: वाचा-संबंधी व्यवस्था में גֵר का अर्थ
  choice: परदेशी
  alternative: विदेशी; निवासी विदेशी; अजनबी
  rationale: पद का तर्क जातीय पहचान मात्र पर नहीं, बल्कि दूसरे देश में गैर-स्थानीय निवासी के रूप में इस्राएल की असुरक्षित स्थिति पर आधारित है। ‘परदेशी’ इस सामाजिक और कानूनी तनाव को व्यापक रूप से बनाए रखता है।
- issue: נֶפֶשׁ को इस मुहावरे में समझना
  choice: मन की दशा
  alternative: प्राण; मन; परदेशी होना कैसा होता है
  rationale: यहाँ נֶפֶשׁ को शरीर से अलग किसी दार्शनिक ‘आत्मा’ के अर्थ में निश्चित नहीं किया गया है। वाक्य परदेशी की भीतरी अनुभूति और भोगी हुई दशा के प्रत्यक्ष ज्ञान की ओर संकेत करता है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कानूनी-उपदेशात्मक स्वर रखा गया है। आदेश के लिए प्रचलित ‘न करना’ संरचना और अनुभवात्मक बल के लिए ‘तुम स्वयं’ प्रयुक्त हुआ है।
