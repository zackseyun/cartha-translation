id: EXO.23.23
reference: Exodus 23:23
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּֽי יֵלֵ֣ךְ מַלְאָכִ/י֮ לְ/פָנֶי/ךָ֒ וֶ/הֱבִֽיאֲ/ךָ֗ אֶל הָֽ/אֱמֹרִי֙ וְ/הַ֣/חִתִּ֔י וְ/הַ/פְּרִזִּי֙ וְ/הַֽ/כְּנַעֲנִ֔י הַ/חִוִּ֖י וְ/הַ/יְבוּסִ֑י וְ/הִכְחַדְתִּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/023.yaml
  text: For my angel will go before you and bring you to the Amorites[a], the Hittites, the Perizzites, the Canaanites, the Hivites, and the Jebusites[b], and I will wipe them out.
translation:
  language: hi
  text: क्योंकि मेरा दूत[a] तुम्हारे आगे-आगे जाएगा और तुम्हें एमोरियों, हित्तियों, परिज्जियों, कनानियों, हिव्वियों और यबूसियों के पास पहुँचाएगा, और मैं उनका नाश कर दूँगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरा संदेशवाहक।” इब्रानी शब्द מַלְאָךְ किसी मानवीय या स्वर्गीय संदेशवाहक के लिए प्रयुक्त हो सकता है; यहाँ ईश्वरीय मार्गदर्शन का संदर्भ स्वर्गीय दूत की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “मैं उसका नाश कर दूँगा”; एकवचन प्रत्यय यहाँ गिनाई गई जातियों के लिए सामूहिक रूप में प्रयुक्त हुआ है।
    reason: source_form
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले आदेश और प्रतिज्ञा का आधार बताता है; आधुनिक हिन्दी में ‘क्योंकि’ इसका स्वाभाविक व्याख्यात्मक संबंध बनाए रखता है।
- source_word: מַלְאָכִי
  choice: मेरा दूत
  rationale: מַלְאָךְ का अर्थ मानवीय अथवा स्वर्गीय संदेशवाहक हो सकता है। ‘दूत’ इस मूल व्यापकता को बनाए रखता है; संदर्भ यहाँ ईश्वर द्वारा भेजे गए स्वर्गीय दूत की ओर संकेत करता है।
- source_word: לְפָנֶיךָ
  choice: तुम्हारे आगे-आगे
  rationale: यह पहले चलने और मार्गदर्शन करने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וֶהֱבִיאֲךָ
  choice: तुम्हें ... के पास पहुँचाएगा
  rationale: बोअल का हिफ़ील रूप ‘ले आना/पहुँचाना’ है। लोगों के नाम गंतव्य के रूप में आने के कारण ‘के पास पहुँचाएगा’ हिन्दी में सहज और स्रोत के निकट है।
- source_word: הָאֱמֹרִי ... וְהַיְבוּסִי
  choice: एमोरियों, हित्तियों, परिज्जियों, कनानियों, हिव्वियों और यबूसियों
  rationale: इब्रानी में जातिनाम एकवचन सामूहिक रूप में हैं; हिन्दी में जनसमूहों के लिए प्रचलित बहुवचन रूप दिए गए हैं।
- source_word: וְהִכְחַדְתִּיו
  choice: और मैं उनका नाश कर दूँगा
  rationale: כחד के हिफ़ील का भाव मिटा देने या नष्ट कर देने का है। प्रत्यय व्याकरणतः एकवचन है, पर सूचीबद्ध जातियों को सामूहिक रूप से दर्शाता है; हिन्दी में ‘उनका’ स्वाभाविक सामूहिक संदर्भ देता है।
theological_decisions:
- issue: מַלְאָכִי में दूत का स्वरूप और अभिप्राय
  choice: मुख्य पाठ में ‘मेरा दूत’ रखा गया और उसकी पहचान इससे आगे निर्धारित नहीं की गई।
  alternative: ‘मेरा स्वर्गदूत’; प्रभु का प्रत्यक्ष प्राकट्य; देहधारण से पूर्व पुत्र
  rationale: पद उस व्यक्ति को केवल परमेश्वर का दूत कहता है। ‘दूत’ इब्रानी शब्द की वास्तविक अर्थ-विस्तार और पद की धर्मवैज्ञानिक खुली स्थिति को सुरक्षित रखता है।
- issue: וְהִכְחַדְתִּיו के कर्म की वचन-संख्या
  choice: एकवचन इब्रानी प्रत्यय को जातियों के सामूहिक संदर्भ में हिन्दी ‘उनका’ से व्यक्त किया गया।
  alternative: शाब्दिक ‘उसका नाश कर दूँगा’
  rationale: स्रोत में प्रत्यय एकवचन है, किन्तु पहले गिनाए गए अनेक जनसमूह सामूहिक इकाई के रूप में अभिप्रेत हैं। हिन्दी का बहुवचन-संदर्भ अर्थ स्पष्ट करता है, जबकि पादटिप्पणी मूल रूप बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। जातिनामों के हिन्दी बाइबलीय लिप्यंतरण अपनाए गए हैं। ‘दूत’ मूल शब्द की अस्पष्टता बचाता है और पादटिप्पणी स्वर्गीय संदर्भ स्पष्ट करती है।
