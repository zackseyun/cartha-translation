base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/017.yaml
  text: Three times in the year every male among you shall appear before the Lord Yahweh[a].
translation:
  language: hi
  text: वर्ष में तीन बार तुम्हारे सभी पुरुष प्रभु याहवे[a] के सामने उपस्थित हों।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में दिव्य नाम יהוה (YHWH) है; ‘यहोवा’ इसका एक पारंपरिक हिन्दी रूप है।
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁלֹשׁ פְּעָמִים
  choice: तीन बार
  rationale: यह इब्रानी मुहावरा अवसरों की संख्या बताता है; ‘तीन बार’ सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: בַּשָּׁנָה
  choice: वर्ष में
  rationale: सप्रत्यय संज्ञा वार्षिक चक्र के भीतर होने का भाव देती है; ‘वर्ष में’ स्रोत की संरचना और अर्थ दोनों को बनाए रखता है।
- source_word: יֵרָאֶה
  choice: उपस्थित हों
  rationale: ראה का निफ़अल रूप यहाँ किसी अधिकारी अथवा परमेश्वर के सम्मुख आने के रूढ़ अर्थ में है। ‘उपस्थित हों’ स्वाभाविक हिन्दी है और कर्मवाच्य ‘देखे जाएँ’ की असहजता से बचता है।
- source_word: כָּל זְכוּרְךָ
  choice: तुम्हारे सभी पुरुष
  rationale: पदबंध इस्राएली समुदाय के पुरुष सदस्यों को स्पष्टतः निर्दिष्ट करता है; यह अनुवाद उस लैंगिक विशिष्टता को बनाए रखता है।
- source_word: אֶל פְּנֵי
  choice: के सामने
  rationale: यह किसी की उपस्थिति में आने का सामान्य इब्रानी पदबंध है; ‘के सामने’ संक्षिप्त और स्वाभाविक समतुल्य है।
- source_word: הָאָדֹן
  choice: प्रभु
  rationale: यहाँ אָדוֹן परमेश्वर की उपाधि है; ‘प्रभु’ आधुनिक हिन्दी बाइबलीय भाषा में प्रतिष्ठित और सुबोध है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: यह उपाधि नहीं, इब्रानी चतुराक्षरीय दिव्य नाम है; हिन्दी में प्रचलित नामरूप ‘यहोवा’ व्यक्तिगत नाम को उपाधि से अलग रखता है।
theological_decisions:
- issue: הָאָדֹן יְהוָה में दिव्य उपाधि और व्यक्तिगत नाम का संयुक्त अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर / प्रभु याहवे
  rationale: मूल में הָאָדֹן उपाधि और יְהוָה दिव्य नाम, दोनों अलग-अलग उपस्थित हैं। ‘प्रभु यहोवा’ दोनों को बनाए रखता है और उन्हें एक ही उपाधि में विलीन नहीं करता; पादटिप्पणी नाम के वैकल्पिक लिप्यंतरण को बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। आज्ञार्थक विधि के लिए ‘उपस्थित हों’ प्रयुक्त है; ‘हर एक पुरुष’ की अपेक्षा ‘सभी पुरुष’ अधिक सहज है और मूल की पुरुष-विशिष्टता बनाए रखता है।
