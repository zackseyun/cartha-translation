base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/030.yaml
  text: Little by little I will drive them out from before you[b][a], until you become fruitful and take possession of the land.
translation:
  language: hi
  text: मैं उसे[a] तेरे सामने से थोड़ा-थोड़ा करके निकाल दूँगा, जब तक कि तू फलता-फूलता न हो जाए और देश पर अधिकार[b] न कर ले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘उसे’ है; यह एकवचन संभवतः देश के निवासियों या जातियों को सामूहिक रूप में दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या, “देश को विरासत में न पा ले।”
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעַט מְעַט
  choice: थोड़ा-थोड़ा करके
  rationale: मूल की पुनरुक्ति और क्रमिक कार्रवाई—एक ही बार में नहीं, बल्कि धीरे-धीरे—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אֲגָרְשֶׁנּוּ
  choice: मैं उसे निकाल दूँगा
  rationale: גרשׁ का अर्थ यहाँ किसी को स्थान से खदेड़ना या निकालना है। ‘उसे’ मूल के तीसरे पुरुष पुल्लिंग एकवचन प्रत्यय को सुरक्षित रखता है, जबकि संदर्भ में उसका आशय देश के निवासियों से सामूहिक रूप में है।
- source_word: מִפָּנֶיךָ
  choice: तेरे सामने से
  rationale: यह ‘मुख/उपस्थिति के सामने से’ वाले इब्रानी मुहावरे का स्पष्ट और स्वाभाविक हिन्दी रूप है।
- source_word: עַד אֲשֶׁר
  choice: जब तक कि
  rationale: यह धीरे-धीरे निकाले जाने की कार्रवाई की समय-सीमा अथवा लक्ष्य को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: תִּפְרֶה
  choice: तू फलता-फूलता न जाए
  rationale: פרה के ‘फलवन्त होना, बढ़ना’ रूपक को बनाए रखता है; इस संदर्भ में मुख्य आशय लोगों की संख्या बढ़ने से है।
- source_word: וְנָחַלְתָּ
  choice: अपने अधिकार में न ले ले
  rationale: נחל यहाँ विरासत में पाने और स्थायी अधिकार ग्रहण करने, दोनों अर्थ-छायाएँ रखता है। मुख्य पाठ में भूमि पर वास्तविक अधिकार पाने का स्वाभाविक हिन्दी रूप दिया गया है और वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: אֶת־הָאָרֶץ
  choice: देश
  rationale: संदर्भ में यह इस्राएल को दिए जाने वाले निश्चित भूभाग को दर्शाता है; ‘देश’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: निकाले जाने वालों के लिए सामूहिक एकवचन प्रत्यय
  choice: मूल के व्याकरणिक एकवचन के अनुसार ‘उसे’ रखा गया और सामूहिक आशय पादटिप्पणी में स्पष्ट किया गया।
  alternative: संदर्भानुसार बहुवचन ‘उन्हें’ लिखा जा सकता है।
  rationale: इब्रानी प्रत्यय वास्तव में पुल्लिंग एकवचन है, यद्यपि वह संभवतः देश के निवासियों या जातियों को एक समूह मानकर बताता है। एकवचन रखने से स्रोत की उल्लेखनीय विशेषता नहीं मिटती।
- issue: נחל में विरासत और अधिकार का संबंध
  choice: मुख्य पाठ में ‘अपने अधिकार में ले ले’ रखा गया।
  alternative: ‘देश का वारिस हो जाए’ अथवा ‘देश को विरासत में पाए’ भी संभव है।
  rationale: संदर्भ में देश को प्राप्त करके उसमें बसने का ठोस भाव प्रमुख है, पर विरासत की अर्थ-छाया वास्तविक है और पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी अपनाई गई है। परमेश्वर द्वारा इस्राएल को सीधे संबोधित किए जाने के कारण एकवचन ‘तू/तेरे’ रखा गया है। ‘फलता-फूलता’ मूल के फलवन्त होने के रूपक को बचाता है, जबकि संदर्भ में जनसंख्या-वृद्धि का संकेत देता है।
