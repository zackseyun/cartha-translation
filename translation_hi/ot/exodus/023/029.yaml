  text: לֹ֧א אֲגָרְשֶׁ֛/נּוּ מִ/פָּנֶ֖י/ךָ בְּ/שָׁנָ֣ה אֶחָ֑ת פֶּן תִּהְיֶ֤ה הָ/אָ֨רֶץ֙ שְׁמָמָ֔ה וְ/רַבָּ֥ה עָלֶ֖י/ךָ חַיַּ֥ת הַ/שָּׂדֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/029.yaml
  text: I will not drive them out from before you in one year[b][a], lest the land become desolate and the wild animals of the field become too numerous against you.
translation:
  language: hi
  text: मैं उन्हें एक ही वर्ष में तुम्हारे सामने से नहीं निकालूँगा, कहीं ऐसा न हो कि देश उजाड़ हो जाए और जंगली पशु बढ़कर तुम्हारे लिए संकट बन जाएँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲגָרְשֶׁנּוּ
  choice: मैं उन्हें ... नहीं निकालूँगा
  rationale: גרש का अर्थ ‘निकाल देना/खदेड़ देना’ है। एकवचन कर्म-प्रत्यय यहाँ पहले उल्लिखित देशवासियों का सामूहिक बोध कराता है; स्वाभाविक हिन्दी में बहुवचन ‘उन्हें’ यह अर्थ स्पष्ट रखता है।
- source_word: מִפָּנֶיךָ
  choice: तुम्हारे सामने से
  rationale: यह इब्रानी स्थानवाचक मुहावरे के निकट है और विरोध में खड़े लोगों को हटाने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּשָׁנָה אֶחָת
  choice: एक ही वर्ष में
  rationale: ‘एक ही वर्ष में’ अवधि की एकता पर इब्रानी אֶחָת के बल को सहज हिन्दी में व्यक्त करता है।
- source_word: פֶּן
  choice: कहीं ऐसा न हो कि
  rationale: यह नकारात्मक आशंका अथवा टाले जाने वाले परिणाम को आधुनिक हिन्दी में स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: תִּהְיֶה הָאָרֶץ שְׁמָמָה
  choice: देश उजाड़ हो जाए
  rationale: שְׁמָמָה निर्जनता और उजाड़ दशा बताता है; ‘उजाड़ हो जाए’ परिणामसूचक क्रिया को भी बनाए रखता है।
- source_word: וְרַבָּה עָלֶיךָ
  choice: बढ़कर तुम्हारे लिए संकट बन जाएँ
  rationale: רבה का मूल भाव संख्या में बढ़ना है और עָלֶיךָ यहाँ उस वृद्धि से होने वाले प्रतिकूल प्रभाव को दर्शाता है। शाब्दिक ‘तुम्हारे विरुद्ध बढ़ें’ हिन्दी में अस्वाभाविक है, इसलिए संदर्भगत संकट को स्पष्ट किया गया है।
- source_word: חַיַּת הַשָּׂדֶה
  choice: जंगली पशु
  rationale: यह खेत अथवा खुले प्रदेश में रहने वाले वन्य जीवों का सामान्य पद है; ‘जंगली पशु’ संक्षिप्त, वर्तमान और सुबोध हिन्दी है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल किंतु गरिमापूर्ण रूप। परमेश्वर के कथन में भविष्यकाल और चेतावनी का भाव सुरक्षित रखा गया है; सामूहिक इब्रानी एकवचन को हिन्दी में स्वाभाविक बहुवचन से व्यक्त किया गया है।
