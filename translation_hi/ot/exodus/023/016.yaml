  text: וְ/חַ֤ג הַ/קָּצִיר֙ בִּכּוּרֵ֣י מַעֲשֶׂ֔י/ךָ אֲשֶׁ֥ר תִּזְרַ֖ע בַּ/שָּׂדֶ֑ה וְ/חַ֤ג הָֽ/אָסִף֙ בְּ/צֵ֣את הַ/שָּׁנָ֔ה בְּ/אָסְפְּ/ךָ֥ אֶֽת מַעֲשֶׂ֖י/ךָ מִן הַ/שָּׂדֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/016.yaml
  text: and the Feast of Harvest[a], the firstfruits of your labors, of what you sow in the field; and the Feast of Ingathering at the end of the year[c][b], when you gather in your labors from the field.
translation:
  language: hi
  text: और कटनी का पर्व—तुम्हारे परिश्रम की पहली उपज का पर्व, जो तुम खेत में बोते हो—और वर्ष के अंत में[a] बटोरने का पर्व[b], जब तुम अपने परिश्रम की उपज खेत से बटोरते हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ ‘वर्ष के निकलने पर’ है।
    reason: lexical_alternative
  - marker: b
    text: ‘बटोरने का पर्व’ खेत की उपज एकत्र किए जाने के अवसर पर मनाया जाने वाला पर्व था।
    reason: cultural_note
lexical_decisions:
- source_word: חַג
  choice: पर्व
  rationale: यह शब्द नियत धार्मिक उत्सव को दर्शाता है; ‘पर्व’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है तथा दोनों अवसरों पर एकरूप रखा गया है।
- source_word: הַקָּצִיר
  choice: कटनी
  rationale: संज्ञा फसल काटने अथवा कटाई के समय को दर्शाती है; ‘कटनी का पर्व’ कृषि-संदर्भ और पर्वनाम दोनों को स्पष्ट रखता है।
- source_word: בִּכּוּרֵי
  choice: पहली उपज
  rationale: यह सबसे पहले प्राप्त होने वाली उपज को दर्शाता है; हिन्दी में ‘पहली उपज’ साधारण पाठक के लिए स्पष्ट रहते हुए कृषि और अर्पण-संबंधी अर्थ बनाए रखती है।
- source_word: מַעֲשֶׂיךָ
  choice: तुम्हारे परिश्रम / अपने परिश्रम की उपज
  rationale: मूल शब्द का सामान्य अर्थ ‘काम’ या ‘किए हुए कार्य’ है। कृषि-संदर्भ में पहले प्रयोग में ‘परिश्रम’ रखा गया है और दूसरे में वाक्य को स्वाभाविक तथा आशय को स्पष्ट करने के लिए ‘परिश्रम की उपज’ कहा गया है।
- source_word: הָאָסִף
  choice: बटोरना
  rationale: यह खेत की उपज को एकत्र करने को दर्शाता है। ‘बटोरने का पर्व’ क्रिया-संबंध को बनाए रखता है और आधुनिक हिन्दी में सहज है।
- source_word: בְּצֵאת הַשָּׁנָה
  choice: वर्ष के अंत में
  rationale: शाब्दिक चित्र ‘वर्ष के निकलने पर’ है; उसका स्वाभाविक काल-संबंधी अर्थ हिन्दी में ‘वर्ष के अंत में’ है।
- source_word: בְּאָסְפְּךָ ... מִן הַשָּׂדֶה
  choice: जब तुम ... खेत से बटोरते हो
  rationale: पूर्वसर्गयुक्त क्रियारूप यहाँ समय बताता है। यह अनुवाद सीधे संबोधन और खेत से उपज एकत्र करने की क्रिया दोनों को सुरक्षित रखता है।
