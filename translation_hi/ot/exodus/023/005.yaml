base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/005.yaml
  text: If you see the donkey of one who hates you lying down under its load[a], and would refrain from helping him[b], you must surely help with him.
translation:
  language: hi
  text: यदि तुम किसी ऐसे व्यक्ति के गधे को, जो तुमसे घृणा करता है, उसके बोझ के नीचे पड़ा देखो और उसकी सहायता करने से पीछे हटना चाहो,[b] तो उसके साथ मिलकर[a] उसकी सहायता अवश्य करना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी [अर्थात गधे की] सहायता करना,” अर्थात गधे को उसके बोझ से छुड़ाने में सहायता करना। इब्रानी अंतिम सर्वनाम का संबंध उस व्यक्ति या गधे, दोनों में से किसी से समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: यहाँ प्रयुक्त इब्रानी क्रिया का सामान्य अर्थ “छोड़ना” या “त्याग देना” है, पर इस प्रसंग में उसका भाव सहायता देना, विशेषतः बोझ से जूझ रहे गधे की सहायता करना, है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: यदि
  rationale: यहाँ כִּי कानूनी शर्त प्रस्तुत करता है; ‘यदि’ उसके सशर्त भाव को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: תִרְאֶה
  choice: तू ... देखे
  rationale: ראה का सीधा अर्थ ‘देखना’ है; यह अनायास मिलने जैसी अतिरिक्त धारणा नहीं जोड़ता।
- source_word: חֲמוֹר
  choice: गधा
  rationale: यह आधुनिक मानक हिन्दी में इस पशु का सामान्य और स्पष्ट नाम है।
- source_word: שֹׂנַאֲךָ
  choice: ऐसा व्यक्ति ... जो तुझसे बैर रखता है
  rationale: इब्रानी कृदन्त का अर्थ शाब्दिक रूप से ‘तुझसे घृणा/बैर रखनेवाला’ है; यह ‘शत्रु’ जैसी अधिक व्यापक श्रेणी थोपे बिना संबंध को व्यक्त करता है।
- source_word: רֹבֵץ
  choice: पड़ा
  rationale: רבץ किसी पशु के लेटे या नीचे पड़े होने का चित्र देता है; ‘पड़ा’ उसके बोझ के नीचे होने की स्थिति को बिना ‘गिर पड़ा’ या ‘ढह गया’ जोड़ने के व्यक्त करता है।
- source_word: תַּחַת מַשָּׂאוֹ
  choice: उसके बोझ तले
  rationale: यह वाक्यांश पशु के अपने ऊपर लदे बोझ के नीचे पड़े होने को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְחָדַלְתָּ מֵעֲזֹב לוֹ
  choice: और उसकी सहायता करने से पीछे हटना चाहे
  rationale: कठिन इब्रानी रचना सहायता से रुकने या पीछे हटने की प्रवृत्ति व्यक्त करती है। ‘पीछे हटना चाहे’ सशर्त प्रसंग और नैतिक तनाव दोनों बनाए रखता है।
- source_word: עָזֹב תַּעֲזֹב
  choice: उसकी सहायता अवश्य करना
  rationale: धातु के निरपेक्ष क्रियारूप और अपूर्ण क्रिया का मेल आज्ञा पर बल देता है। इस प्रसंग में עזב सहायता देने—विशेषतः पशु को बोझ से छुड़ाने—के अर्थ में समझा गया है।
- source_word: עִמּוֹ
  choice: उसके साथ मिलकर
  rationale: पुल्लिंग एकवचन प्रत्यय को मुख्य पाठ में पशु के स्वामी की ओर संकेत करनेवाला माना गया है; ‘मिलकर’ इब्रानी עִם के सहभागितापूर्ण भाव को स्पष्ट करता है।
theological_decisions:
- issue: अंतिम सर्वनाम עִמּוֹ का संदर्भ
  choice: उसके साथ मिलकर—अर्थात उस व्यक्ति के साथ
  alternative: उसके साथ—अर्थात गधे की सहायता करना
  rationale: पुल्लिंग एकवचन सर्वनाम व्याकरण की दृष्टि से व्यक्ति या गधे, दोनों की ओर संकेत कर सकता है। मुख्य पाठ में व्यक्ति के साथ मिलकर सहायता करने का अर्थ लिया गया है, क्योंकि व्यवस्था का पारस्परिक नैतिक पक्ष इससे स्पष्ट रहता है; वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है।
- issue: इस प्रसंग में עזב का अर्थ
  choice: सहायता करना
  alternative: छोड़ना अथवा बोझ से छुड़ाना
  rationale: धातु का सामान्य अर्थ ‘छोड़ना’ है, पर यहाँ समान धातु का दोहराव उस पशु और उसके स्वामी की सहायता करने की आज्ञा के रूप में समझा जाता है। अनुवाद प्रसंगगत अर्थ देता है और शब्दगत कठिनाई पादटिप्पणी में बताता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कानूनी-उपदेशात्मक रूप अपनाया गया है। एकवचन संबोधन के अनुरूप ‘तू’ रखा गया है। ‘बैर रखता है’ बोलचाल की अत्यधिक तीक्ष्ण ‘नफ़रत’ की तुलना में मूल संबंधपरक विरोध को संतुलित ढंग से व्यक्त करता है।
