  text: לֹ֥א תַטֶּ֛ה מִשְׁפַּ֥ט אֶבְיֹנְ/ךָ֖ בְּ/רִיבֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/006.yaml
  text: You shall not pervert the justice due to your poor person in his dispute[a].
translation:
  language: hi
  text: तू अपने निर्धन व्यक्ति के मुकदमे में उसके न्याय को न बिगाड़ना।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तू अपने निर्धन जन को उसके मुकदमे में न्याय से वंचित न करना।”
    reason: מִשְׁפַּט और תַטֶּה के संयुक्त न्यायिक भाव का एक स्वाभाविक वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: לֹא
  choice: न ... बिगाड़ना
  rationale: निषेध को वाचा-संहिता की सीधी, विधिक आज्ञा के अनुरूप हिंदी में व्यक्त किया गया है।
- source_word: תַטֶּה
  choice: बिगाड़ना
  rationale: हिफ़ील रूप यहाँ न्याय को मोड़ने या विकृत करने के न्यायिक अर्थ में है; ‘बिगाड़ना’ सहज आधुनिक हिंदी में यही भाव देता है।
- source_word: מִשְׁפַּט
  choice: न्याय
  rationale: यहाँ शब्द उस उचित न्यायिक निर्णय या अधिकार को सूचित करता है जो निर्धन व्यक्ति को मिलना चाहिए; हिंदी में ‘उसके न्याय’ मूल की संक्षिप्त संरचना बनाए रखता है।
- source_word: אֶבְיֹנְךָ
  choice: अपने निर्धन व्यक्ति
  rationale: אֶבְיוֹן का अर्थ निर्धन या जरूरतमंद व्यक्ति है। ‘अपने’ संबोधन में निहित द्वितीय पुरुष एकवचन प्रत्यय को सुरक्षित रखता है, और ‘व्यक्ति’ अनावश्यक जैविक लिंग जोड़े बिना संदर्भ के व्यक्ति-वाचक अर्थ को व्यक्त करता है।
- source_word: בְּרִיבוֹ
  choice: उसके मुकदमे में
  rationale: רִיב यहाँ न्यायिक विवाद या मुकदमे को दर्शाता है; ‘मुकदमे में’ इस विधिक संदर्भ को स्पष्ट और स्वाभाविक बनाता है तथा ‘उसके’ मूल के प्रत्यय को सुरक्षित रखता है।
theological_decisions:
- issue: क्या निषेध निर्धन व्यक्ति के विरुद्ध पक्षपात का है या निर्धन के पक्ष में पक्षपात का
  choice: निर्धन व्यक्ति के मुकदमे में उसे मिलने वाले न्याय को विकृत न करना
  alternative: सामान्य रूप से ‘निर्धन को न्याय से वंचित न करना’
  rationale: इब्रानी वाक्य में מִשְׁפַּט वह वस्तु है जिसे मोड़ने से मना किया गया है, और אֶבְיֹנְךָ उस निर्धन व्यक्ति को पहचानता है जिसके רִיב, अर्थात मुकदमे, का विचार हो रहा है। अनुवाद निष्पक्ष न्याय के विधिक केंद्र को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण विधिक शैली अपनाई गई है। ‘तू’ मूल के एकवचन संबोधन को बनाए रखता है; ‘अपने निर्धन व्यक्ति’ समुदाय से संबंधित निर्धन वादी का भाव व्यक्त करता है।
