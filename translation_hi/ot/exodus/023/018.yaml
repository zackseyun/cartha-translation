  choice: न चढ़ाना
  rationale: לֹא के साथ प्रयुक्त द्वितीय पुरुष एकवचन क्रिया कानूनी निषेध व्यक्त करती है। हिंदी में ‘न चढ़ाना’ बलिदान-संबंधी क्रिया को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עַל חָמֵץ
  choice: किसी खमीरी वस्तु के साथ
  rationale: עַל का मूल अर्थ ‘ऊपर’ है, पर इस बलिदानी संदर्भ में यह खमीर वाली वस्तु के साथ संबद्ध होकर चढ़ाने का निषेध बताता है। मुख्य पाठ में स्वाभाविक अर्थ रखा गया है और शाब्दिक संभावना पादटिप्पणी में दी गई है।
- source_word: דַּם זִבְחִי
  choice: मेरे बलिदान का लहू
  rationale: सम्बन्धवाचक रचना और प्रथम पुरुष एकवचन प्रत्यय दोनों सुरक्षित हैं। मूल में ‘लहू’ स्पष्ट है, इसलिए इसे केवल ‘बलिदान’ कहकर सामान्यीकृत नहीं किया गया।
- source_word: יָלִין
  choice: पड़ी न रहे
