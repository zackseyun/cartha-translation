  language: hi
  text: तुम मेरे बलिदान का लहू किसी खमीरी वस्तु के साथ न चढ़ाना[a], और मेरे पर्व[b] की चरबी भोर तक पड़ी न रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “खमीर के साथ” अथवा अधिक शाब्दिक रूप में, “खमीर के ऊपर।” यहाँ इब्रानी संबंधसूचक शब्द का मूल अर्थ “ऊपर” है, पर बलिदान के संदर्भ में आशय संभवतः किसी खमीरी वस्तु के साथ बलिदान चढ़ाने से है।
    reason: lexical_alternative
  - marker: b
    text: या, “उत्सव।” इब्रानी शब्द पवित्र धार्मिक पर्व-उत्सव को दर्शाता है।
    reason: lexical_alternative
