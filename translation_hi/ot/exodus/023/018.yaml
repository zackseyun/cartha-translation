- source_word: חֵלֶב
  choice: चरबी
  rationale: मूल शब्द विशेष रूप से बलिदान की चरबी को दर्शाता है; ‘उत्तम भाग’ जैसा व्याख्यात्मक रूप नहीं अपनाया गया।
- source_word: חַגִּי
  choice: मेरे पर्व
  rationale: חַג पवित्र धार्मिक पर्व या उत्सव को दर्शाता है। ‘पर्व’ संक्षिप्त, सम्मानपूर्ण और संदर्भानुकूल है।
- source_word: עַד בֹּקֶר
  choice: भोर तक
  rationale: यह समयसूचक वाक्यांश मूल के अर्थ को स्वाभाविक और संक्षिप्त हिंदी में व्यक्त करता है।
theological_decisions:
- issue: ‘मेरे बलिदान’ और ‘मेरे पर्व’ में प्रथम पुरुष प्रत्ययों का संदर्भ
  choice: ईश्वरीय प्रथम पुरुष वाणी को ‘मेरे बलिदान’ और ‘मेरे पर्व’ के रूप में बनाए रखा गया।
  alternative: ‘मुझे चढ़ाया जाने वाला बलिदान’ और ‘यहोवा का पर्व’
  rationale: इब्रानी में प्रथम पुरुष प्रत्यय स्पष्ट हैं। व्याख्यात्मक विस्तार किए बिना उन्हें बनाए रखना परमेश्वर से इन उपासना-विधियों के वाचागत संबंध को सुरक्षित रखता है।
