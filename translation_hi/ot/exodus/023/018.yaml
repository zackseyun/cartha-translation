  register: आधुनिक मानक हिंदी में विधिक निषेध का सीधा, गरिमापूर्ण रूप रखा गया है। ‘लहू,’ ‘बलिदान,’ ‘पर्व’ और ‘चरबी’ जैसे ठोस उपासना-संबंधी शब्द मूल की विशिष्टता बनाए रखते हैं; जहाँ इब्रानी संबंधसूचक शब्द अस्पष्ट है, वहाँ मुख्य पाठ को सहज रखते हुए विकल्प पादटिप्पणी में सुरक्षित किए गए हैं।
