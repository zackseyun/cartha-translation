source:
  edition: WLC
  text: לֹֽא תִהְיֶ֥ה אַחֲרֵֽי רַבִּ֖ים לְ/רָעֹ֑ת וְ/לֹא תַעֲנֶ֣ה עַל רִ֗ב לִ/נְטֹ֛ת אַחֲרֵ֥י רַבִּ֖ים לְ/הַטֹּֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/002.yaml
  text: You shall not follow the many to do evil[a], and you shall not testify in a dispute so as to turn aside after the many, to pervert justice.
translation:
  language: hi
  text: बुराई करने के लिए बहुत-से लोगों के पीछे मत चलो; और किसी मुकदमे में ऐसी गवाही मत दो कि बहुत-से लोगों के पक्ष में झुककर न्याय को बिगाड़ो[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “किसी मुकदमे के विषय में ऐसा उत्तर मत दो कि बहुत-से लोगों के पक्ष में झुककर निर्णय को मोड़ो।”
    reason: תַעֲנֶה का अर्थ ‘उत्तर देना’ भी हो सकता है। अंतिम वाक्यांश में न्याय/निर्णय का कर्म निहित है; ‘निर्णय को मोड़ो’ अधिक शाब्दिक न्यायिक विकल्प है।
lexical_decisions:
- source_word: תִהְיֶה אַחֲרֵי רַבִּים
  choice: बहुत-से लोगों के पीछे मत चलो
  rationale: היה के साथ אַחֲרֵי यहाँ किसी के पीछे जाने या उसका अनुसरण करने का भाव देता है। רַבִּים को ‘बहुत-से लोग’ कहना स्रोत की व्यापकता बनाए रखता है और इसे केवल औपचारिक बहुमत तक सीमित नहीं करता।
- source_word: לְרָעֹת
  choice: बुराई करने के लिए
  rationale: לְ के साथ यह रूप उद्देश्य या परिणाम व्यक्त करता है; ‘बुराई’ नैतिक बल को स्पष्ट रखता है।
- source_word: תַעֲנֶה
  choice: गवाही मत दो
  rationale: कानूनी प्रसंग में ענה किसी मामले में बोलने या साक्ष्य देने को सूचित कर सकता है। ‘गवाही देना’ हिंदी में न्यायिक संदर्भ को स्वाभाविक रूप से स्पष्ट करता है, जबकि ‘उत्तर देना’ की शाब्दिक संभावना पादटिप्पणी में रखी गई है।
- source_word: עַל רִיב
  choice: किसी मुकदमे में
  rationale: רִיב विवाद, कानूनी झगड़े या मुकदमे का अर्थ दे सकता है। गवाही और न्याय के इस संदर्भ में ‘मुकदमा’ न्यायिक अर्थ को सहज ढंग से सामने लाता है।
- source_word: לִנְטֹת אַחֲרֵי רַבִּים
  choice: कि बहुत-से लोगों के पीछे चलकर
  rationale: נטה के मुड़ने या हटने के भाव तथा אַחֲרֵי רַבִּים की पुनरावृत्ति को यथासंभव बनाए रखते हुए यह वाक्यांश बहुसंख्यक दबाव के कारण सही मार्ग से हटने का आशय व्यक्त करता है।
- source_word: לְהַטֹּת
  choice: न्याय को विकृत कर दो
  rationale: נטה का हिफ़ईल रूप कानूनी संदर्भ में निर्णय या न्याय को मोड़ने का भाव देता है। हिंदी में निहित कर्म ‘न्याय’ को प्रकट करना वाक्य को स्पष्ट और स्वाभाविक बनाता है।
theological_decisions:
- issue: अंतिम वाक्यांश का न्यायिक-नैतिक बल
  choice: निहित कानूनी कर्म को स्पष्ट करते हुए ‘न्याय को विकृत कर दो’
  alternative: ‘निर्णय को मोड़ दो’ या केवल ‘मोड़ दो’
  rationale: इब्रानी अंतिम क्रिया संक्षिप्त है, पर मुकदमे और गवाही का निकट संदर्भ न्याय या निर्णय को अनुचित ढंग से मोड़ने की ओर संकेत करता है। ‘न्याय’ जोड़ना संदर्भगत स्पष्टता देता है, कोई अतिरिक्त सांप्रदायिक शिक्षा नहीं।
translation_notes:
  register: आधुनिक मानक हिंदी; साधारण पाठक के लिए सहज, किंतु विधिक आज्ञा के अनुरूप गरिमापूर्ण। ‘बहुत-से लोग’ स्रोत के ‘अनेकों/बहुसंख्यकों’ के भाव को रखता है और आधुनिक राजनीतिक ‘बहुमत’ का अनावश्यक संकुचन टालता है।
