  text: וּ/בְ/כֹ֛ל אֲשֶׁר אָמַ֥רְתִּי אֲלֵי/כֶ֖ם תִּשָּׁמֵ֑רוּ וְ/שֵׁ֨ם אֱלֹהִ֤ים אֲחֵרִים֙ לֹ֣א תַזְכִּ֔ירוּ לֹ֥א יִשָּׁמַ֖ע עַל פִּֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/013.yaml
  text: In all that I have said to you[a], be careful[b]; and the name of other gods you shall not mention—it shall not be heard on your lips.
translation:
  language: hi
  text: मैंने तुमसे जो कुछ कहा है, उस सब के विषय में सावधान रहना। दूसरे देवताओं का नाम न लेना[a]; वह तुम्हारे मुँह से सुनाई न दे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक विशिष्ट अर्थ में, “दूसरे देवताओं के नाम का आह्वान न करना।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “वह तुम्हारे मुँह पर सुनाई न दे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכֹל אֲשֶׁר אָמַרְתִּי אֲלֵיכֶם
  choice: मैंने तुमसे जो कुछ कहा है, उस सब के विषय में
  rationale: यह पदबंध पहले दिए गए सभी निर्देशों को समग्र रूप से समेटता है। ‘उस सब के विषय में’ בְּ की संबंध-सूचक भूमिका और כֹּל की व्यापकता दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: תִּשָּׁמֵרוּ
  choice: सावधान रहना
  rationale: निफ़अल रूप यहाँ अपने आचरण पर ध्यान देने और चौकस रहने की आज्ञा देता है। ‘सावधान रहना’ आधुनिक हिन्दी में स्वाभाविक है और कानूनी-उपदेशात्मक बल बनाए रखता है।
- source_word: אֱלֹהִים אֲחֵרִים
  choice: दूसरे देवताओं
  rationale: यह इस्राएल के परमेश्वर के अतिरिक्त अन्य देवताओं का सीधा उल्लेख है। अनुवाद उनकी सत्ता या असत्ता के विषय में पाठ से आगे कोई निष्कर्ष नहीं जोड़ता।
- source_word: לֹא תַזְכִּירוּ
  choice: नाम न लेना
  rationale: זכר के हिफ़ईल का अर्थ यहाँ स्मरण कराना, उल्लेख करना या नाम लेना हो सकता है। ‘नाम न लेना’ हिन्दी में स्वाभाविक है और ‘आह्वान करना’ जैसे अधिक संकीर्ण अर्थ को मुख्य पाठ में आरोपित नहीं करता।
- source_word: לֹא יִשָּׁמַע עַל פִּיךָ
  choice: वह तुम्हारे मुँह से सुनाई न दे
  rationale: यह निषेधात्मक भाव और बोलकर उच्चारण किए जाने की छवि दोनों को सुरक्षित रखता है। यद्यपि עַל का शाब्दिक अर्थ ‘पर’ है, हिन्दी में ‘मुँह से’ अधिक स्वाभाविक है।
theological_decisions:
- issue: दूसरे देवताओं के नाम से संबंधित निषेध का दायरा
  choice: मुख्य पाठ में ‘नाम न लेना’ रखा गया है।
  alternative: ‘उनका आह्वान न करना’ या विशेष रूप से उपासना में उनका नाम न लेना।
  rationale: इब्रानी क्रिया साधारण उल्लेख और धार्मिक आह्वान दोनों की संभावना रख सकती है। पद स्वयं निषेध का सटीक धार्मिक दायरा स्पष्ट नहीं करता, इसलिए मुख्य अनुवाद व्यापक शब्दावली रखता है और संकीर्ण संभावना पादटिप्पणी में देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। एकवचन संबोधन को हिन्दी में स्वाभाविक ‘तुम’ से व्यक्त किया गया है। आज्ञाओं के कानूनी स्वर को बनाए रखते हुए अत्यधिक संस्कृतनिष्ठ या पुरातन पदावली से बचा गया है।
