  text: אֶת אֵֽימָתִ/י֙ אֲשַׁלַּ֣ח לְ/פָנֶ֔י/ךָ וְ/הַמֹּתִי֙ אֶת כָּל הָ/עָ֔ם אֲשֶׁ֥ר תָּבֹ֖א בָּ/הֶ֑ם וְ/נָתַתִּ֧י אֶת כָּל אֹיְבֶ֛י/ךָ אֵלֶ֖י/ךָ עֹֽרֶף־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/027.yaml
  text: I will send my terror ahead of you[a], and I will throw into confusion all the people among whom you come[c][b], and I will make all your enemies turn their backs to you.
translation:
  language: hi
  text: मैं अपना आतंक[a] तेरे आगे भेजूँगा और जिन लोगों के बीच तू जाएगा, उन सभी में खलबली मचा दूँगा[b]; और मैं तेरे सभी शत्रुओं को तेरे सामने पीठ दिखाने पर मजबूर कर दूँगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपनी दहशत’ अथवा ‘अपना भय’।
    reason: lexical_alternative
  - marker: b
    text: या ‘घबरा दूँगा’, ‘भ्रम में डाल दूँगा’ अथवा ‘तितर-बितर कर दूँगा’।
    reason: lexical_alternative
  - marker: c
    text: 'इब्रानी मुहावरा, शाब्दिक रूप से: ‘मैं तेरे सभी शत्रुओं को तेरी ओर पीठ/गर्दन कर दूँगा।’ अर्थात वे तेरे सामने पीठ फेरकर भागेंगे।'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵימָתִי
  choice: अपना आतंक
  rationale: אֵימָה भय, दहशत या आतंक को व्यक्त करता है। ‘अपना आतंक’ संबंधसूचक बल और परमेश्वर की ओर से भेजी जाने वाली भयावह दहशत—दोनों को बनाए रखता है।
- source_word: אֲשַׁלַּח לְפָנֶיךָ
  choice: तेरे आगे भेजूँगा
  rationale: לְפָנֶיךָ यहाँ आगे या अग्रिम रूप से भेजने की दिशा बताता है; यह हिंदी में स्वाभाविक और स्रोत के निकट है।
- source_word: וְהַמֹּתִי
  choice: खलबली मचा दूँगा
  rationale: המם का अर्थ भ्रम, घबराहट या युद्धकालीन उथल-पुथल उत्पन्न करना है। यह चयन कारक क्रिया-बल को रखता है, पर इस बिंदु पर पूर्ण सैन्य पराजय को अनावश्यक रूप से नहीं जोड़ता।
- source_word: כָּל הָעָם אֲשֶׁר תָּבֹא בָהֶם
  choice: जिन-जिन लोगों के बीच तू जाएगा, उन सब
  rationale: בָהֶם का स्वाभाविक अर्थ ‘उनके बीच’ है। ‘जिन-जिन…उन सब’ सामूहिक כָּל הָעָם को सहज हिंदी में व्यक्त करता है और ‘उनके विरुद्ध’ जैसी व्याख्यात्मक तीव्रता नहीं जोड़ता।
- source_word: וְנָתַתִּי ... אֵלֶיךָ עֹרֶף
  choice: तेरी ओर पीठ फेरने पर मजबूर कर दूँगा
  rationale: यह इब्रानी मुहावरा शत्रुओं के पीठ दिखाकर पीछे हटने या भागने का चित्र देता है। हिंदी रूप मूल चित्र को समझने योग्य ढंग से सुरक्षित रखता है।
theological_decisions:
- issue: सैन्य विजय और घबराहट में परमेश्वर की प्रत्यक्ष भूमिका
  choice: 'तीनों कार्यों में प्रत्यक्ष प्रथम-पुरुष दैवी कर्तृत्व रखा गया है: ‘भेजूँगा’, ‘मचा दूँगा’, और ‘मजबूर कर दूँगा’।'
  alternative: दैवी कारणता को नरम करते हुए इन घटनाओं को केवल अप्रत्यक्ष अनुमति या सामान्य परिणाम के रूप में व्यक्त करना।
  rationale: इब्रानी पाठ में परमेश्वर स्पष्ट रूप से प्रथम-पुरुष क्रियाओं का कर्ता है। अनुवाद इस दावे को न तो नरम करता है, न उससे आगे कोई सिद्धान्त जोड़ता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘तू/तेरे’ मूल पाठ के एकवचन संबोधन को स्पष्ट रूप से सुरक्षित रखता है। युद्ध-संदर्भ की कठोरता को न छिपाया गया है, न उससे अधिक तीखा बनाया गया है।
