  yaml_path: translation/ot/exodus/023/007.yaml
  text: Keep far from a false matter[a], and do not kill the innocent and the righteous[b], for I will not justify the wicked.
translation:
  language: hi
  text: झूठी बात से दूर रहो[a], और निर्दोष और धर्मी व्यक्ति को मत मार डालना, क्योंकि मैं दुष्ट को निर्दोष न ठहराऊँगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “झूठे आरोप से” अथवा “झूठ से।” इब्रानी में प्रयुक्त शब्द व्यापक है और झूठी गवाही या कपटपूर्ण मुकदमे को भी शामिल कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “क्योंकि मैं दोषी को बरी न करूँगा।” यहाँ इब्रानी क्रिया न्यायिक अर्थ में है और इसका अर्थ “निर्दोष ठहराना” या “बरी करना” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדְּבַר שֶׁקֶר
  choice: झूठी बात से
  rationale: דָּבָר का अर्थ ‘बात’, ‘वचन’, ‘मामला’ या ‘मुकदमा’ हो सकता है। ‘झूठी बात’ इसकी व्यापकता बनाए रखता है; न्यायिक संदर्भ में इसमें झूठा आरोप, झूठी गवाही या कपटपूर्ण मुकदमा भी शामिल हो सकता है।
- source_word: תִּרְחָק
  choice: दूर रहो
  rationale: यह निर्देशात्मक बल के साथ सक्रिय दूरी बनाए रखने को व्यक्त करता है और स्वाभाविक आधुनिक हिन्दी है।
- source_word: וְנָקִי
  choice: निर्दोष
  rationale: נָקִי ऐसे व्यक्ति को दर्शाता है जो दोष से मुक्त है; न्यायिक संदर्भ में ‘निर्दोष’ स्पष्ट और स्वाभाविक है।
- source_word: וְצַדִּיק
  choice: धर्मी
  rationale: צַדִּיק का अर्थ धर्मी, न्यायी या वह व्यक्ति हो सकता है जो मुकदमे में सही पक्ष पर है। ‘धर्मी’ मूल के नैतिक-न्यायिक विस्तार को बनाए रखता है।
- source_word: אַל תַּהֲרֹג
  choice: प्राणदंड न देना
  rationale: הרג सामान्यतः ‘मार डालना’ है, पर यहाँ न्यायिक आदेशों का संदर्भ निर्दोष व्यक्ति को न्यायिक प्रक्रिया द्वारा मृत्यु दिलाने की ओर संकेत करता है। ‘प्राणदंड न देना’ इस संदर्भ को स्वाभाविक हिन्दी में व्यक्त करता है, बिना इसे निजी हत्या तक सीमित किए।
- source_word: לֹא אַצְדִּיק
  choice: निर्दोष न ठहराऊँगा
  rationale: צדק का हिफ़ील रूप यहाँ न्यायिक घोषणा—निर्दोष या सही ठहराना—व्यक्त करता है। ‘निर्दोष न ठहराऊँगा’ आधुनिक हिन्दी में इसके forensic अर्थ को स्पष्ट करता है।
- source_word: רָשָׁע
  choice: दुष्ट
  rationale: רָשָׁע नैतिक रूप से दुष्ट या न्यायिक रूप से दोषी व्यक्ति को दर्शा सकता है। ‘दुष्ट’ व्यापकता बनाए रखता है, जबकि ‘दोषी’ का न्यायिक विकल्प पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: परमेश्वर के कथन का न्यायिक अर्थ
  choice: क्योंकि मैं दुष्ट को निर्दोष न ठहराऊँगा
  alternative: क्योंकि मैं दोषी को बरी न करूँगा
  rationale: मुख्य पाठ मूल के नैतिक शब्द רָשָׁע और צדק के न्यायिक क्रियारूप—दोनों को बनाए रखता है। विकल्प अधिक स्पष्ट न्यायालयी हिन्दी है, इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘प्राणदंड’ न्यायिक संदर्भ को स्पष्ट करता है; ‘झूठी बात’ मूल की व्यापकता और ‘दुष्ट को निर्दोष न ठहराऊँगा’ नैतिक तथा न्यायिक तनाव दोनों को सुरक्षित रखते हैं।
