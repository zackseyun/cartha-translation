base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/024.yaml
  text: You shall not bow down to their gods[a], nor serve them, nor do according to their deeds; rather, you shall surely tear them down and surely shatter their pillars.
translation:
  language: hi
  text: तुम उनके देवताओं के आगे दण्डवत् न करना, न उनकी सेवा करना, और उनके कामों के अनुसार न करना; बल्कि उन्हें पूरी तरह ढा देना और उनके स्तम्भों[a] को चकनाचूर कर देना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके पवित्र स्तम्भों” अथवा “उनके खड़े पत्थरों।” इब्रानी शब्द उपासना से जुड़े खड़े किए गए पत्थर के स्मारकों को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשְׁתַּחֲוֶה
  choice: दण्डवत् करना
  rationale: यह क्रिया श्रद्धा में झुकने या भूमि पर गिरने की ठोस शारीरिक क्रिया बताती है। ‘दण्डवत् करना’ उस क्रिया को बनाए रखता है और उसे केवल व्यापक ‘पूजा करना’ में नहीं समेटता।
- source_word: לֵאלֹהֵיהֶם
  choice: उनके देवताओं के आगे
  rationale: दण्डवत् करने के साथ यह स्वाभाविक हिन्दी है और अन्य जातियों के देवताओं की ओर संकेत स्पष्ट रखती है।
- source_word: תָעָבְדֵם
  choice: उनकी सेवा करना
  rationale: עבד धार्मिक उपासना सहित सेवा और अधीनता को व्यक्त कर सकता है। ‘सेवा करना’ मूल क्रिया की व्यापकता बनाए रखता है।
- source_word: תַעֲשֶׂה כְּמַעֲשֵׂיהֶם
  choice: उनके कामों के अनुसार करना
  rationale: यह मूल की औपचारिक संरचना और ‘कामों/रीतियों’ की कुछ व्यापकता को सुरक्षित रखता है, यद्यपि सन्दर्भ में विशेषतः धार्मिक आचरण अभिप्रेत है।
- source_word: כִּי
  choice: बल्कि
  rationale: यहाँ כִּי पिछले निषेधों के विपरीत अपेक्षित कार्य प्रस्तुत करता है; ‘बल्कि’ उस प्रबल विरोध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הָרֵס תְּהָרְסֵם
  choice: उन्हें पूरी तरह ढा देना
  rationale: क्रिया के साथ infinitive absolute आदेश को तीव्र करता है। ‘पूरी तरह’ उस बल को व्यक्त करता है, और ‘ढा देना’ दृश्यमान उपासना-संरचनाओं या प्रतीकों के विनाश के अनुकूल है।
- source_word: וְשַׁבֵּר תְּשַׁבֵּר
  choice: चकनाचूर कर देना
  rationale: दोहराई गई क्रिया प्रबल और पूर्ण तोड़ने पर जोर देती है। ‘चकनाचूर’ पत्थर के धार्मिक स्मारकों के सन्दर्भ में स्वाभाविक है।
- source_word: מַצֵּבֹתֵיהֶם
  choice: उनके पूजा-स्तम्भ
  rationale: מַצֵּבָה खड़े किए गए पत्थर या स्तम्भ को बताता है, जो यहाँ उपासना से जुड़ा है। ‘पूजा-स्तम्भ’ सामान्य पाठक को उसका धार्मिक कार्य स्पष्ट करता है; अधिक ठोस विकल्प पादटिप्पणी में दिए गए हैं।
theological_decisions:
- issue: विदेशी देवताओं के प्रति निषिद्ध कृत्यों का स्वरूप
  choice: ‘दण्डवत् करना’ और ‘सेवा करना’ को अलग क्रियाओं के रूप में रखा गया है।
  alternative: दोनों को सामान्य ‘पूजा करना’ की भाषा में मिला देना।
  rationale: 'इब्रानी दो भिन्न क्रियाएँ प्रयोग करती है: बाहरी श्रद्धा-प्रदर्शन और स्थायी धार्मिक सेवा। दोनों को बनाए रखने से निषेध का पूरा बल सुरक्षित रहता है।'
- issue: विनाश की आज्ञाओं का लक्ष्य
  choice: भाषा को देवताओं से सम्बद्ध मूर्त उपासना-वस्तुओं और प्रतीकों की ओर संकेत करने दिया गया है, जिनमें पूजा-स्तम्भ स्पष्ट रूप से शामिल हैं।
  alternative: ‘उन्हें ढा देना’ को स्वयं देवताओं के शाब्दिक विनाश के रूप में स्पष्ट करना।
  rationale: मूल में कर्म-सूचक प्रत्यय कुछ संदिग्धता रखता है, पर अगला वाक्यांश मूर्त पत्थर-स्तम्भों को स्पष्ट करता है। अनुवाद मूल के प्रबल मूर्तिपूजा-विरोध को रखता है, बिना देवताओं के शाब्दिक विनाश की व्याख्या थोपे।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सीधे आदेशात्मक वाक्य। ‘दण्डवत्’ धार्मिक सन्दर्भ में व्यापक रूप से समझा जाता है; ‘पूजा-स्तम्भ’ तकनीकी अर्थ को साधारण पाठक के लिए स्पष्ट करता है।
