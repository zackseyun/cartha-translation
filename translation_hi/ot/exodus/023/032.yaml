lexical_decisions:
- source_word: לֹא
  choice: न ... कोई
  rationale: यह निषेध को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; दो निषिद्ध पक्षों के कारण ‘न तो ... और न’ संरचना अपनाई गई है।
- source_word: תִכְרֹת
  choice: बाँधना
  rationale: כרת ברית का शाब्दिक अर्थ ‘वाचा काटना’ है, पर हिन्दी में ‘वाचा बाँधना’ उसी मुहावरे का स्वाभाविक और गरिमापूर्ण समतुल्य है।
- source_word: לָהֶם
  choice: उनके साथ
  rationale: वाचा के संदर्भ में ל उस पक्ष को दर्शाता है जिसके साथ वाचा की जाती है।
- source_word: וְלֵאלֹהֵיהֶם
  choice: और न उनके देवताओं के साथ
  rationale: वाव का औपचारिक मूल्य ‘और’ सुरक्षित रखा गया है, जबकि ‘न तो ... और न’ पूरे निषेध का वितरक अर्थ स्पष्ट करता है। बहुवचन אֱלֹהִים को संदर्भानुसार ‘देवताओं’ कहा गया है।
- source_word: בְּרִית
  choice: वाचा
  rationale: ‘वाचा’ ברית का मानक, धार्मिक और संबंधपरक भार सुरक्षित रखने वाला हिन्दी प्रतिशब्द है; ‘संधि’ केवल राजनीतिक अर्थ को अधिक उभार सकती है।
theological_decisions:
- issue: כרת ברית मुहावरे का अनुवाद
  choice: वाचा बाँधना
  alternative: वाचा काटना
  rationale: शाब्दिक चित्र को मुख्य पाठ में रखने से हिन्दी अस्वाभाविक होती। ‘वाचा बाँधना’ विधिक-धार्मिक अर्थ और गंभीरता को स्वाभाविक हिन्दी में बनाए रखता है।
- issue: देवताओं से पहले ו का बल
  choice: न तो उनके साथ और न उनके देवताओं के साथ
  alternative: उनके साथ और उनके देवताओं के साथ
  rationale: ‘न तो ... और न’ यह स्पष्ट करता है कि निषेध दोनों अलग-अलग पक्षों पर लागू है, साथ ही हिब्रू के संयोजक ‘और’ को भी बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; एकवचन पुरुषवाचक आदेश के अनुरूप ‘तू’ रखा गया है। भाषा संक्षिप्त, विधिक और गरिमापूर्ण है।
