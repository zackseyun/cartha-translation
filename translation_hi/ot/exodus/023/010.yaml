review_pass:
  verdict: revise
  source_fidelity: The draft accurately identifies the six-year duration, the addressee's land, and the sequence of sowing and gathering its agricultural output. However, its finite-command sense is not carried naturally by the infinitives “बीज बोना” and “बटोरना” following “तुम.”
  naturalness: The wording “छः वर्ष तक तुम अपनी भूमि में बीज बोना और उसकी उपज बटोरना” is syntactically incomplete/nonstandard as an independent legal instruction in modern Hindi. Finite imperative forms make the directive clear and idiomatic. आधुनिक वर्तनी में “छह” is also preferable to “छः.”
  terminology: “भूमि” appropriately renders the cultivated landholding, and “उपज” is a precise, natural rendering of תְּבוּאָה. “इकट्ठी करो” renders the broad sense of gathering without narrowing it to harvesting or reaping.
  issues:
  - severity: medium
    issue: The main verbs are infinitives rather than finite directive forms.
    rationale: In this context the Hebrew imperfects are prescriptive. With an explicit subject, “तुम ... बोना ... बटोरना” is not a well-formed standalone modern Hindi command; “बोओ” and “इकट्ठी करो” preserve the legal-instructional force.
  - severity: low
    issue: Nonpreferred spelling “छः.”
    rationale: “छह” is the standard modern Hindi spelling and improves consistency with the specified target variant.
  revised_text: छह वर्ष तक तुम अपनी भूमि में बीज बोओ और उसकी उपज इकट्ठी करो।
