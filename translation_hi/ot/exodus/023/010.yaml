  text: For six years you shall sow your land and gather its produce[a].
translation:
  language: hi
  text: छह वर्ष तक तुम अपनी भूमि में बीज बोओ और उसकी उपज इकट्ठी करो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/שֵׁשׁ שָׁנִים
  choice: छः वर्ष तक
  rationale: आरंभिक संयोजक वाव और समय-सूचक पद को स्वाभाविक हिन्दी में अवधि बताने वाले वाक्यांश के रूप में व्यक्त किया गया है।
- source_word: תִּזְרַע
  choice: तुम ... बीज बोना
  rationale: विधिक संदर्भ में अपूर्ण क्रिया का निर्देशात्मक बल है; आधुनिक हिन्दी में समानांतर आज्ञार्थक रचना स्वाभाविक और स्पष्ट है।
- source_word: אַרְצֶךָ
  choice: अपनी भूमि
  rationale: यहाँ אֶרֶץ पूरी पृथ्वी नहीं, खेती की भूमि को दर्शाता है; कर्ता के साथ संबंध सूचित करने के लिए ‘अपनी’ स्वाभाविक है।
- source_word: וְאָסַפְתָּ
  choice: और ... बटोरना
  rationale: אָסַף का सामान्य अर्थ इकट्ठा करना या बटोरना है; ‘बटोरना’ फसल भीतर लाने की क्रिया को व्यक्त करता है, पर ‘कटाई करना’ जितना विशिष्ट नहीं है।
- source_word: תְּבוּאָתָהּ
  choice: उसकी उपज
  rationale: תְּבוּאָה भूमि से प्राप्त कृषि-उत्पादन को दर्शाता है; ‘उपज’ संक्षिप्त, प्रचलित और प्रत्यय के भूमि की ओर संकेत को सुरक्षित रखता है।
