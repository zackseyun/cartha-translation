  text: There shall not be one miscarrying or barren in your land[b][a]; I will fill up the number of your days.
translation:
  language: hi
  text: तुम्हारे देश में न किसी स्त्री का गर्भ गिरेगा[a], और न कोई स्त्री बाँझ होगी; मैं तुम्हारे दिनों की गिनती पूरी करूँगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कोई संतान से वंचित न होगी।” इब्रानी शब्द का अर्थ अधिक व्यापक रूप से संतान खोना भी हो सकता है; यहाँ “बाँझ” के साथ आने के कारण संभवतः गर्भ गिरने या प्रसव के समय संतान खोने का भाव है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “मैं तुम्हारे दिनों की गिनती भर दूँगा,” अर्थात मैं तुम्हारी आयु को उसकी पूरी अवधि तक पहुँचाऊँगा।
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשַׁכֵּלָה
  choice: किसी स्त्री का गर्भ गिरेगा
  rationale: संदर्भ में यह स्त्रीलिंग कृदंत עֲקָרָה (‘बाँझ’) के साथ आया है और संतान खोने, विशेषतः गर्भ न टिकने, की ओर संकेत करता है। हिंदी में यह अभिव्यक्ति स्वाभाविक है और जानबूझकर गर्भपात कराने का भ्रामक अर्थ नहीं देती।
- source_word: עֲקָרָה
  choice: बाँझ
  rationale: संतान उत्पन्न करने में असमर्थ स्त्री के लिए यह संक्षिप्त, प्रचलित और संदर्भानुकूल हिंदी शब्द है।
- source_word: בְּאַרְצֶךָ
  choice: तुम्हारे देश में
  rationale: यहाँ אֶרֶץ इस्राएल को दी जानेवाली भूमि/देश को सूचित करता है; आधुनिक हिंदी में ‘तुम्हारे देश में’ सहज और स्पष्ट है।
- source_word: אֶת מִסְפַּר יָמֶיךָ
  choice: तुम्हारे दिनों की गिनती
  rationale: यह इब्रानी पदबंध का निकट अनुवाद है और निर्धारित जीवनकाल की धारणा को रूपक सहित बनाए रखता है।
- source_word: אֲמַלֵּא
  choice: पूरी करूँगा
  rationale: מלא का मूल भाव भरने या पूर्ण करने का है। ‘गिनती पूरी करूँगा’ हिंदी में समझने योग्य रहते हुए जीवन को उसकी पूरी ठहराई हुई अवधि तक पहुँचाने का अर्थ देता है।
- source_word: לֹא תִהְיֶה
  choice: न ... गिरेगा, न ... होगी
  rationale: इब्रानी अस्तित्वसूचक निषेध को स्वाभाविक हिंदी में दो समन्वित निषेधात्मक वाक्यांशों द्वारा व्यक्त किया गया है।
theological_decisions:
- issue: प्रजनन-आशीष की सीमा
  choice: यह पद देश में इस्राएल को दी गई वाचा की आशीष के रूप में गर्भ न गिरने, बाँझपन न होने और जीवन की पूरी अवधि पाने का वादा व्यक्त करता है।
  alternative: इसे हर युग के प्रत्येक विश्वासी के लिए गर्भपात, बाँझपन अथवा असमय मृत्यु से मुक्त रहने की सार्वभौमिक व्यक्तिगत गारंटी मानना।
  rationale: निकटवर्ती संदर्भ इस्राएल और उसे दिए जानेवाले देश से संबंधित वाचा के वादों का है। अनुवाद उस दायरे को न तो संकुचित करता है, न संदर्भ से अलग करके विस्तृत।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण रूप अपनाया गया है। ‘गर्भपात करनेवाली’ से बचा गया है, क्योंकि आज की हिंदी में उससे जानबूझकर गर्भ समाप्त कराने का अर्थ निकल सकता है। इब्रानी की ‘दिनों की गिनती’ वाली छवि मुख्य पाठ में रखी गई है और उसका आशय पादटिप्पणी में स्पष्ट किया गया है।
