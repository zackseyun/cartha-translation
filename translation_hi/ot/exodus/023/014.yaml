  rationale: חגג का अर्थ पर्व मनाना है। विधिक संदर्भ में हिन्दी का अनिवार्य भाव वाला क्रियार्थक प्रयोग ‘मनाना’ संक्षिप्त, स्वाभाविक और आदेशात्मक है।
- source_word: לִי
  choice: मेरे लिए
  rationale: पूर्वसर्ग पर्व को वक्ता, अर्थात परमेश्वर, के लिए आयोजित किए जाने के रूप में दिखाता है। ‘मेरे लिए’ आधुनिक हिन्दी में स्वाभाविक है और व्यक्तिगत संबोधन बनाए रखता है।
- source_word: בַּשָּׁנָה
  choice: वर्ष में
  rationale: यह इब्रानी के ‘वर्ष में’ का निकट और सहज हिन्दी रूप है तथा ‘तीन बार’ के साथ वार्षिक आवृत्ति स्पष्ट करता है।
