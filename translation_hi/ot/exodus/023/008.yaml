source:
  edition: WLC
  text: וְ/שֹׁ֖חַד לֹ֣א תִקָּ֑ח כִּ֤י הַ/שֹּׁ֨חַד֙ יְעַוֵּ֣ר פִּקְחִ֔ים וִֽ/יסַלֵּ֖ף דִּבְרֵ֥י צַדִּיקִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/008.yaml
  text: And you shall not take a bribe[b][a], for a bribe blinds the clear-sighted and twists the words of the righteous.
translation:
  language: hi
  text: तुम घूस मत लेना, क्योंकि घूस साफ़ देखने वालों को अंधा कर देती है[a] और धर्मियों की बातों को तोड़-मरोड़ देती है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “विवेक रखने वालों को।” इब्रानी में देखने का बिंब बना रहता है, पर इसका आशय सही परख और निर्णय करने की क्षमता भी है।
    reason: lexical_alternative
  - marker: b
    text: “धर्मियों की बातें” का न्यायिक अर्थ “जो सही पक्ष में हैं, उनके कथन” या “उनका मामला” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁחַד
  choice: घूस
  rationale: यह भ्रष्ट भुगतान को दर्शाता है, जिसका उद्देश्य निर्णय को प्रभावित करना है; आधुनिक मानक हिन्दी में ‘घूस’ स्पष्ट और स्वाभाविक है।
- source_word: לֹא תִקָּח
  choice: न लेना
  rationale: विधिक प्रसंग में यह निषेध है। ‘न लेना’ मूल क्रिया לקח के निकट रहते हुए संक्षिप्त और स्वाभाविक है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह निषेध का कारण प्रस्तुत करता है और हिन्दी में कारणसूचक संबंध स्पष्ट करता है।
- source_word: יְעַוֵּר
  choice: अंधा कर देती है
  rationale: कारणवाचक क्रिया और न्याय-विवेक को भ्रष्ट करने वाली दृष्टि की उपमा, दोनों सुरक्षित रहते हैं।
- source_word: פִּקְחִים
  choice: देखने वालों
  rationale: यह शब्द मूलतः खुली आँखों या दृष्टि रखने वालों को सूचित करता है और यहाँ विवेकपूर्ण समझ का रूपक है; यह चयन दृश्य बिंब को बनाए रखता है।
- source_word: וִיסַלֵּף
  choice: तोड़-मरोड़ देती है
  rationale: यह वचन या न्यायिक कथन को विकृत करने का सजीव और सहज हिन्दी रूप है।
- source_word: דִּבְרֵי
  choice: बातों
  rationale: דבר के बहुवचन की व्यापकता बनाए रखता है; न्यायिक संदर्भ में इसका अर्थ कथन, गवाही या मामला भी हो सकता है।
- source_word: צַדִּיקִים
  choice: धर्मियों
  rationale: यह नैतिक रूप से धर्मी व्यक्तियों और न्यायिक रूप से सही पक्ष पर खड़े लोगों—दोनों अर्थों की गुंजाइश बनाए रखता है।
theological_decisions:
- issue: צַדִּיקִים का नैतिक अथवा न्यायिक अर्थ
  choice: धर्मियों
  alternative: जो सही पक्ष पर हैं
  rationale: मूल इब्रानी दोनों अर्थों को वहन कर सकता है; मुख्य पाठ में व्यापक पारंपरिक अर्थ रखा गया है और न्यायिक संभावना पादटिप्पणी में बताई गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘देखने वालों को अंधा’ मूल दृश्य बिंब को जानबूझकर सुरक्षित रखता है, जबकि पादटिप्पणी उसका विवेक-संबंधी आशय स्पष्ट करती है।
