  text: אֶת חַ֣ג הַ/מַּצּוֹת֮ תִּשְׁמֹר֒ שִׁבְעַ֣ת יָמִים֩ תֹּאכַ֨ל מַצּ֜וֹת כַּֽ/אֲשֶׁ֣ר צִוִּיתִ֗/ךָ לְ/מוֹעֵד֙ חֹ֣דֶשׁ הָֽ/אָבִ֔יב כִּי ב֖/וֹ יָצָ֣אתָ מִ/מִּצְרָ֑יִם וְ/לֹא יֵרָא֥וּ פָנַ֖/י רֵיקָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/015.yaml
  text: You shall keep the Feast of Unleavened Bread[a]. For seven days you shall eat unleavened bread, as I commanded you, at the appointed time in the month of Abib, for in it you came out from Egypt[b]. And no one shall appear before me empty-handed.
translation:
  language: hi
  text: “अख़मीरी रोटी का पर्व मनाना। सात दिन तक अख़मीरी रोटी खाना, जैसा मैंने तुझे आज्ञा दी है। यह आबिब के महीने में नियत समय पर करना, क्योंकि उसी महीने में तू मिस्र से निकला था। और वे मेरे सामने खाली हाथ न आएँ।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और कोई मेरे सामने खाली हाथ न आए।” इब्रानी में इस अंतिम उपवाक्य की क्रिया तृतीय पुरुष बहुवचन में है, जबकि इससे पहले संबोधन द्वितीय पुरुष एकवचन में है।
    reason: alternative_reading
lexical_decisions:
- source_word: חַג הַמַּצּוֹת
  choice: अख़मीरी रोटी का पर्व
  rationale: חַג धार्मिक पर्व को और מַצּוֹת बिना खमीर की रोटी को दर्शाता है। यह पदबंध आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: תִּשְׁמֹר
  choice: मनाना
  rationale: धार्मिक पर्व के संदर्भ में שׁמר का अर्थ उसका विधिपूर्वक पालन करना है; हिन्दी में पर्व ‘मनाना’ सबसे स्वाभाविक अभिव्यक्ति है।
- source_word: שִׁבְעַת יָמִים תֹּאכַל מַצּוֹת
  choice: सात दिन तक अख़मीरी रोटी खाना
  rationale: यह अवधि और आज्ञा दोनों को सीधे व्यक्त करता है; मַצּוֹת को हिन्दी में स्वाभाविक सामूहिक एकवचन से अनूदित किया गया है।
- source_word: כַּאֲשֶׁר צִוִּיתִךָ
  choice: जैसा मैंने तुझे आज्ञा दी है
  rationale: इब्रानी के एकवचन संबोधन और तुलना के भाव को सुरक्षित रखता है।
- source_word: לְמוֹעֵד חֹדֶשׁ הָאָבִיב
  choice: आबिब के महीने में नियत समय पर
  rationale: מוֹעֵד निश्चित किए गए समय को बताता है और אָבִיב यहाँ महीने का पारंपरिक नाम है।
- source_word: כִּי בוֹ יָצָאתָ מִמִּצְרָיִם
  choice: क्योंकि उसी महीने में तू मिस्र से निकला था
  rationale: בוֹ का संकेत निकटतम पूर्वपद ‘महीने’ की ओर स्पष्ट किया गया है; एकवचन संबोधन बरकरार है।
- source_word: וְלֹא יֵרָאוּ פָנַי רֵיקָם
  choice: और वे मेरे सामने खाली हाथ न आएँ
  rationale: ‘मेरे मुख के सामने’ एक इब्रानी मुहावरा है जिसका स्वाभाविक हिन्दी अर्थ ‘मेरे सामने’ है। तृतीय पुरुष बहुवचन क्रिया को ‘वे’ द्वारा सुरक्षित रखा गया है और רֵיקָם का मुहावरेदार अर्थ ‘खाली हाथ’ है।
theological_decisions:
- issue: फָנַי में परमेश्वर के ‘मुख’ का उल्लेख
  choice: मेरे सामने
  alternative: मेरे मुख के सामने
  rationale: यह परमेश्वर की उपस्थिति में आने का इब्रानी मुहावरा है। ‘मेरे सामने’ अर्थ को बिना अनावश्यक शाब्दिक कठोरता के व्यक्त करता है।
- issue: अंतिम उपवाक्य में पुरुष-वचन का परिवर्तन
  choice: वे मेरे सामने खाली हाथ न आएँ
  alternative: कोई मेरे सामने खाली हाथ न आए
  rationale: पूर्ववर्ती आज्ञाएँ द्वितीय पुरुष एकवचन में हैं, पर अंतिम इब्रानी क्रिया तृतीय पुरुष बहुवचन है। अनुवाद इस वास्तविक व्याकरणिक परिवर्तन को बनाए रखता है; इसका अनिश्चित सामान्य अर्थ फुटनोट में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सम्मानपूर्ण किंतु सहज विधिक-धार्मिक शैली अपनाई गई है। इब्रानी के एकवचन ‘तू’ को बनाए रखा गया है। अंतिम वाक्य में मूल का तृतीय पुरुष बहुवचन भी सुरक्षित है।
