lexical_decisions:
- source_word: וְ
  choice: और
  rationale: यह संयोजक इस निषेध को आस-पास के न्याय-संबंधी नियमों से जोड़ता है; इसमें कोई अनिवार्य विरोधार्थ नहीं है।
- source_word: דָל
  choice: किसी निर्धन
  rationale: דָל सामाजिक या आर्थिक रूप से दीन, गरीब अथवा कमजोर व्यक्ति को दर्शाता है। यहाँ एकवचन और कानूनी संदर्भ के अनुसार ‘किसी निर्धन’ स्वाभाविक और सटीक है।
- source_word: לֹא תֶהְדַּר
  choice: पक्ष न लेना
  rationale: הדר का अधिक शाब्दिक अर्थ ‘आदर करना’ हो सकता है, पर इस न्यायिक संदर्भ में इसका आशय अनुचित अनुग्रह या पक्षपात दिखाने से है। ‘पक्ष न लेना’ सामान्य आधुनिक हिन्दी में निषेध को स्पष्ट करता है।
- source_word: בְּרִיבוֹ
  choice: उसके मुकदमे में
  rationale: רִיב विवाद, कानूनी मामला या मुकदमा हो सकता है। आस-पास के न्यायिक नियमों के कारण ‘मुकदमे’ उपयुक्त है, और प्रत्यय का अर्थ ‘उसके’ से व्यक्त हुआ है।
theological_decisions:
- issue: निर्धन के प्रति करुणा और न्यायालय में निष्पक्षता
  choice: पद न्यायिक मामले में निर्धन व्यक्ति का पक्ष लेने से मना करता है।
  alternative: यह पद सामान्य रूप से निर्धन व्यक्ति का आदर करने की आज्ञा देता है।
  rationale: ‘उसके मुकदमे में’ वाक्यांश और निकटवर्ती न्यायिक संदर्भ दिखाते हैं कि बात अदालत में पक्षपात की है, निर्धनों के प्रति करुणा या सम्मान का निषेध नहीं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘निर्धन’ औपचारिकता और सामान्य बोध के बीच संतुलन रखता है; ‘मुकदमा’ न्यायिक संदर्भ को स्पष्ट करता है।
