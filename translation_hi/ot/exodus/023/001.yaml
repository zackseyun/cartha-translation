  text: לֹ֥א תִשָּׂ֖א שֵׁ֣מַע שָׁ֑וְא אַל תָּ֤שֶׁת יָֽדְ/ךָ֙ עִם רָשָׁ֔ע לִ/הְיֹ֖ת עֵ֥ד חָמָֽס־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/001.yaml
  text: You shall not spread a false report[b][a]. Do not join hands with a wicked man to be a malicious witness.
translation:
  language: hi
  text: तुम झूठी खबर न फैलाना।[a] किसी दुष्ट का साथ देकर ऐसा गवाह न बनना जो अन्याय करे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “झूठी खबर लेकर न चलना।” इब्रानी क्रिया का शाब्दिक अर्थ “उठाना” या “ढोना” है; यहाँ इसका आशय खबर को आगे पहुँचाना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “किसी दुष्ट के साथ अपना हाथ रखकर हिंसक गवाह न बनना।” “हिंसक गवाह” का अर्थ दुर्भावनापूर्ण, अन्यायी, या अन्याय करनेवाला गवाह भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשָּׂא
  choice: फैलाना
  rationale: נָשָׂא का मूल अर्थ ‘उठाना/ढोना’ है, पर שֵׁמַע के साथ इसका आशय किसी खबर को लेकर चलना या आगे पहुँचाना है। ‘फैलाना’ आधुनिक हिन्दी में इस भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: שֵׁמַע שָׁוְא
  choice: झूठी खबर
  rationale: שֵׁמַע सुनी हुई बात, खबर या अफ़वाह को और שָׁוְא झूठ, खोखलेपन या निरर्थकता को दर्शाता है। कानूनी-नैतिक प्रसंग में ‘झूठी खबर’ स्पष्ट और संक्षिप्त है।
- source_word: תָּשֶׁת יָדְךָ עִם
  choice: का साथ देकर
  rationale: शाब्दिक अर्थ ‘अपना हाथ ... के साथ रखना’ है। यह सहयोग करने या किसी का पक्ष लेने का मुहावरा है; ‘साथ देकर’ हिन्दी में अर्थ को स्पष्ट रखता है और केवल हाथ मिलाने की क्रिया समझे जाने से बचाता है।
- source_word: רָשָׁע
  choice: किसी दुष्ट
  rationale: רָשָׁע नैतिक रूप से दुष्ट अथवा न्यायिक अर्थ में दोषी व्यक्ति को सूचित कर सकता है। यहाँ ‘दुष्ट’ स्रोत की नैतिक-कानूनी शक्ति बनाए रखता है।
- source_word: לִהְיוֹת עֵד חָמָס
  choice: ऐसा गवाह ... जो अन्याय करे
  rationale: עֵד ‘गवाह’ है और חָמָס हिंसा, अत्याचार या घोर अन्याय का बोध कराता है। न्यायिक प्रसंग में यह ऐसा गवाह है जिसकी गवाही न्याय को हानि पहुँचाती है। चुना हुआ रूप स्वाभाविक हिन्दी में इस बल को रखता है, बिना इसे केवल ‘झूठा’ तक सीमित किए।
- source_word: לֹא / אַל
  choice: न ... / न ...
  rationale: दोनों निषेध व्यक्त करते हैं। हिन्दी की विधिक-उपदेशात्मक शैली में ‘न ... ना’ दृढ़ निषेध को सहज रूप से व्यक्त करता है।
theological_decisions:
- issue: कानूनी निर्देश में पुल्लिंग एकवचन रूप
  choice: एकवचन सम्बोधन और ‘दुष्ट’ तथा ‘गवाह’ के प्रतिनिधिक पुल्लिंग रूप बनाए रखना
  alternative: पूरे वाक्य में स्पष्ट रूप से लिंग-निरपेक्ष बहुवचन शब्दावली अपनाना
  rationale: इब्रानी पाठ एकवचन पुल्लिंग सम्बोधन और पुल्लिंग एकवचन दुष्ट व्यक्ति का रूप रखता है। हिन्दी में ये रूप सामान्य प्रतिनिधिक निर्देश के रूप में स्वाभाविक हैं और स्रोत की व्याकरणिक बनावट को अनावश्यक रूप से समतल नहीं करते।
- issue: עֵד חָמָס का अर्थ
  choice: ऐसा गवाह जो अन्याय करे
  alternative: हिंसक गवाह; दुर्भावनापूर्ण गवाह; झूठा गवाह
  rationale: חָמָס में हिंसा और अन्याय दोनों का अर्थक्षेत्र है। कानूनी प्रसंग में ‘अन्याय करे’ उसके न्याय-विरोधी प्रभाव को स्पष्ट करता है, जबकि पादटिप्पणी वास्तविक शाब्दिक और अर्थगत विकल्प सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘तुम ... न फैलाना/न बनना’ व्यवस्था-संबंधी दृढ़ निर्देश की शैली देता है। ‘का साथ देकर’ इब्रानी हस्त-मुहावरे का स्वाभाविक हिन्दी अर्थ प्रस्तुत करता है; शाब्दिक चित्र पादटिप्पणी में सुरक्षित है।
