id: EXO.23.25
reference: Exodus 23:25
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/עֲבַדְתֶּ֗ם אֵ֚ת יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם וּ/בֵרַ֥ךְ אֶֽת לַחְמְ/ךָ֖ וְ/אֶת מֵימֶ֑י/ךָ וַ/הֲסִרֹתִ֥י מַחֲלָ֖ה מִ/קִּרְבֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/025.yaml
  text: You shall serve Yahweh your God[a], and he will bless your bread and your water[b], and I will remove sickness from your midst.
translation:
  language: hi
  text: तुम अपने परमेश्वर याहवे की सेवा करना। वह तुम्हारी रोटी[a] और तुम्हारे पानी को आशीष देगा, और मैं तुम्हारे बीच से बीमारी[b] दूर कर दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘रोटी’ से व्यापक रूप में भोजन या जीविका भी अभिप्रेत हो सकती है।
    reason: lexical_alternative
  - marker: b
    text: या ‘रोग’।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲבַדְתֶּם
  choice: तुम ... की सेवा करना
  rationale: עבד परमेश्वर के प्रति वाचा-संबंधी सेवा और आराधना दोनों का भाव रखता है। ‘सेवा करना’ इस व्यापक अर्थ को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम יהוה का देवनागरी लिप्यंतरण किया गया है, किसी उपाधि से उसका स्थान नहीं लिया गया।
- source_word: אֱלֹהֵיכֶם
  choice: अपने परमेश्वर
  rationale: यहाँ बहुवचन संबोधन के साथ इस्राएल के एक परमेश्वर का वाचा-संबंधी उल्लेख है। ‘अपने’ हिन्दी में संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וּבֵרַךְ
  choice: वह ... आशीष देगा
  rationale: इस रूप को आज्ञा के बाद आने वाले प्रतिज्ञात्मक परिणाम के रूप में समझा गया है। निहित कर्ता याहवे को ‘वह’ से स्पष्ट किया गया है।
- source_word: לַחְמְךָ
  choice: तुम्हारी रोटी
  rationale: לחם का मूल ठोस अर्थ ‘रोटी’ है, यद्यपि यह व्यापक रूप से भोजन या जीविका का भी संकेत कर सकता है।
- source_word: מֵימֶיךָ
  choice: तुम्हारे पानी
  rationale: מים रूप में बहुवचन/समूहवाचक है, पर हिन्दी में इस प्रसंग में ‘पानी’ स्वाभाविक समूहवाचक प्रयोग है।
- source_word: וַהֲסִרֹתִי
  choice: मैं ... दूर कर दूँगा
  rationale: हिफ़ील रूप का अर्थ हटाना या दूर करना है। ‘दूर कर दूँगा’ प्रतिज्ञा और पूर्ण निष्कासन का स्वाभाविक हिन्दी भाव देता है।
- source_word: מַחֲלָה
  choice: बीमारी
  rationale: מַחֲלָה बीमारी, रोग या अस्वस्थता को सूचित करता है। ‘बीमारी’ सामान्य आधुनिक हिन्दी में व्यापक और सहज है।
- source_word: מִקִּרְבֶּךָ
  choice: तुम्हारे बीच से
  rationale: यह सामुदायिक अर्थ को बनाए रखता है और बीमारी को केवल किसी व्यक्ति के शरीर के भीतर की दशा तक सीमित नहीं करता।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम יהוה का प्रयोग करता है। ‘याहवे’ उस नाम का निकट देवनागरी लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: एक ही वचन में कर्ता का ‘वह’ से ‘मैं’ में परिवर्तन
  choice: ‘वह ... आशीष देगा, और मैं ... दूर कर दूँगा’ को बनाए रखा
  alternative: दोनों उपवाक्यों में ‘वह’ या दोनों में ‘मैं’ करना
  rationale: इब्रानी पाठ में आशीष देने वाले के लिए तीसरा पुरुष निहित है, फिर परमेश्वर प्रथम पुरुष में बोलते हैं। इस वास्तविक व्याकरणिक तनाव को समतल नहीं किया गया।
- issue: बहुवचन संबोधन से एकवचन स्वत्वसूचक प्रत्ययों की ओर परिवर्तन
  choice: हिन्दी में सामूहिक संबोधन के अनुसार ‘तुम्हारी/तुम्हारे’
  alternative: ‘तुम ... तेरी रोटी ... तेरे पानी ... तेरे बीच’ के द्वारा वचन-परिवर्तन को अक्षरशः दिखाना
  rationale: इब्रानी में क्रिया बहुवचन है, जबकि आगे के प्रत्यय एकवचन हैं; यह इस्राएल को एक समुदाय के रूप में संबोधित करने का प्रचलित ढंग है। अक्षरशः वचन-परिवर्तन आधुनिक हिन्दी में भ्रामक और अस्वाभाविक होता, इसलिए सामूहिक अर्थ रखा गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘सेवा करना’ आराधना तक सीमित न होकर वाचा के प्रति निष्ठापूर्ण सेवा का व्यापक भाव बनाए रखता है। मूल के ‘वह’ से ‘मैं’ में हुए परिवर्तन को जानबूझकर सुरक्षित रखा गया है।
