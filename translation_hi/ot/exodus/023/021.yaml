base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/021.yaml
  text: Be on your guard before him[a], and listen to his voice. Do not rebel against him, for he will not pardon your transgression, because my name is within him.
translation:
  language: hi
  text: उसके सामने सतर्क रहो और उसकी बात सुनो। उसके विरुद्ध विद्रोह मत करो, क्योंकि वह तुम्हारे अपराध को क्षमा नहीं करेगा; क्योंकि मेरा नाम उसके भीतर है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘मेरा नाम उसमें है’ या ‘मेरा नाम उस पर है’; अधिक व्याख्यात्मक रूप में, ‘वह मेरा नाम धारण करता है।’ यह वाक्यांश परमेश्वर से मिले अधिकार का संकेत देता है, पर यह पद दूत के ठीक स्वरूप को स्पष्ट रूप से परिभाषित नहीं करता।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֶר מִפָּנָיו
  choice: उसके सामने सावधान रहना
  rationale: निफ़अल आज्ञार्थक यहाँ चौकसी की गंभीर चेतावनी देता है। ‘उसके सामने सावधान रहना’ מִפָּנָיו के उपस्थिति/सम्मुख होने के भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וּשְׁמַע בְּקֹלוֹ
  choice: और उसकी बात सुनना
  rationale: इब्रानी प्रयोग में सुनने के साथ मानने का भाव भी है। ‘उसकी बात सुनना’ आधुनिक हिन्दी में स्वाभाविक है और आज्ञापालन का निहितार्थ संदर्भ से उभरने देता है।
- source_word: אַל תַּמֵּר בּוֹ
  choice: उसके विरुद्ध विद्रोह न करना
  rationale: מרה जान-बूझकर विरोध या विद्रोह को दर्शाता है; यह चयन वाचा-संबंधी चेतावनी की गंभीरता बनाए रखता है।
- source_word: לֹא יִשָּׂא לְפִשְׁעֲכֶם
  choice: वह तुम्हारे अपराध को क्षमा नहीं करेगा
  rationale: पाप के साथ נשא का प्रयोग क्षमा करने अथवा अपराध उठा लेने के अर्थ में आता है। ‘क्षमा नहीं करेगा’ स्पष्ट और स्वाभाविक हिन्दी है; ‘अपराध’ सामूहिक एकवचन को बनाए रखता है।
- source_word: שְׁמִי בְּקִרְבּוֹ
  choice: मेरा नाम उसके भीतर है
  rationale: यह בְּקִרְבּוֹ के ‘उसके भीतर/मध्य में’ अर्थ के निकट रहता है और दूत के स्वरूप या दिव्य नाम से उसके संबंध को आवश्यकता से अधिक परिभाषित नहीं करता।
theological_decisions:
- issue: दूत का स्वरूप और ‘मेरा नाम उसके भीतर है’ वाक्यांश
  choice: वाक्यांश को स्रोत के निकट रखते हुए दूत के ठीक स्वरूप को अनिर्णीत रखा गया है।
  alternative: इसे ‘वह मेरा नाम धारण करता है’ कहकर केवल प्रत्यायोजित दिव्य अधिकार के रूप में स्पष्ट करना, अथवा इसे सीधे परमेश्वर के प्रकट रूप के रूप में समझाना।
  rationale: पद दूत के दिव्य अधिकार के विषय में सशक्त कथन करता है, पर यह स्पष्ट नहीं करता कि वह सृजा हुआ प्रतिनिधि है या परमेश्वर की उपस्थिति का अधिक प्रत्यक्ष प्रकटीकरण। अनुवाद इस धर्मवैज्ञानिक तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर, आज्ञात्मक और गरिमापूर्ण शैली रखी गई है। एकवचन ‘तुम्हारे अपराध’ मूल के सामूहिक एकवचन का अनुसरण करता है। पादटिप्पणी-चिह्न संबंधित वाक्यांश के तुरंत बाद रखा गया है।
