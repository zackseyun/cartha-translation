base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/012.yaml
  text: Then Yahweh said to Moses[a], “Come up to me on the mountain and remain there, and I will give you the stone tablets, and the law and the commandment[b], which I have written for their instruction.”
translation:
  language: hi
  text: तब याहवे ने मूसा से कहा, “मेरे पास पहाड़ पर चढ़ आ और वहीं ठहरा रह। मैं तुझे पत्थर की पटियाएँ, व्यवस्था और आज्ञा[a] दूँगा, जो मैंने उन्हें शिक्षा देने के लिए लिखा है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “व्यवस्था” का अर्थ “शिक्षा” या “उपदेश” भी हो सकता है। “पत्थर की पटियाएँ, व्यवस्था और आज्ञा” अलग-अलग वस्तुओं का उल्लेख हो सकता है, या “व्यवस्था और आज्ञा” पटियाओं पर लिखी सामग्री का और वर्णन हो सकता है।
    reason: lexical_alternative_and_alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: यहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में निकट ध्वन्यात्मक लिप्यंतरण द्वारा रखा गया है।
- source_word: עֲלֵה אֵלַי הָהָרָה
  choice: पहाड़ पर मेरे पास ऊपर आ
  rationale: आज्ञार्थक क्रिया, ‘मेरे पास’ और पहाड़ की ओर गति—तीनों को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: וֶהְיֵה שָׁם
  choice: और वहीं ठहरा रह
  rationale: यहाँ היה केवल उपस्थित होने के बजाय वहाँ बने रहने का भाव देता है।
- source_word: לֻחֹת הָאֶבֶן
  choice: पत्थर की पटियाएँ
  rationale: वाचा से संबंधित पत्थर के लेखन-फलक के लिए स्पष्ट और प्रचलित हिन्दी अभिव्यक्ति।
- source_word: וְהַתּוֹרָה
  choice: और व्यवस्था
  rationale: सीनै के वाचा-संदर्भ में ‘व्यवस्था’ पहचाना हुआ पद है; ‘शिक्षा’ का मूल भाव वाक्य के अंतिम उद्देश्य-वाक्य में भी व्यक्त होता है।
- source_word: וְהַמִּצְוָה
  choice: और आज्ञा
  rationale: हिब्रू के एकवचन को बनाए रखते हुए आधुनिक और सहज हिन्दी रूप चुना गया है।
- source_word: אֲשֶׁר כָּתַבְתִּי
  choice: जिन्हें मैंने ... लिखा है
  rationale: पूर्ण हो चुके किन्तु वर्तमान प्रसंग से संबद्ध दिव्य लेखन को स्वाभाविक हिन्दी पूर्णकाल में व्यक्त करता है; बहुवचन संबंधवाचक सर्वनाम पूर्ववर्ती समन्वित वस्तुओं से जुड़ता है।
- source_word: לְהוֹרֹתָם
  choice: लोगों को शिक्षा देने के लिए
  rationale: हिफ़ील infinitive का उद्देश्यगत ‘सिखाना/शिक्षा देना’ भाव रखता है और तृतीय पुरुष बहुवचन प्रत्यय के आशय, अर्थात इस्राएली लोगों, को हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: ‘व्यवस्था और आज्ञा’ का ‘पत्थर की पटियाओं’ से संबंध
  choice: 'तीनों पदों को समन्वित क्रम में रखा गया है: ‘पत्थर की पटियाएँ, और व्यवस्था और आज्ञा।’'
  alternative: ‘व्यवस्था और आज्ञा’ को पटियाओं की व्याख्या मानना, या सभी पदों को केवल दस आज्ञाओं का संयुक्त उल्लेख मानना।
  rationale: हिब्रू समन्वित संज्ञाएँ देता है और यह निश्चित नहीं करता कि बाद के पद अलग सामग्री हैं या पटियाओं का अधिक वर्णन; मुख्य पाठ इस अस्पष्टता को बनाए रखता है।
- issue: אֲשֶׁר का वचन और संदर्भ
  choice: हिन्दी में ‘जिन्हें’ द्वारा समूचे समन्वित पदसमूह से संबंध दिखाया गया है।
  alternative: इसे केवल निकटतम एकवचन ‘आज्ञा’ से जोड़कर ‘जिसे’ कहना।
  rationale: हिब्रू संबंधवाचक अव्यय स्वयं वचन नहीं बताता। व्यापक संबंध प्रसंगानुकूल है, पर पदों के आपसी संबंध की व्याख्यात्मक अनिश्चितता पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ईश्वरीय संबोधन में निकटता के अनुरूप एकवचन ‘तू’ के रूप (‘आ’, ‘तुझे’) प्रयुक्त हैं। ‘यहवे’, ‘व्यवस्था’, ‘आज्ञा’ और ‘पटियाएँ’ बाइबलीय संदर्भ में परिचित हैं, जबकि वाक्य-विन्यास सामान्य पाठक के लिए सीधा रखा गया है।
