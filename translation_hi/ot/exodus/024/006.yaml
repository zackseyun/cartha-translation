  edition: WLC
  text: וַ/יִּקַּ֤ח מֹשֶׁה֙ חֲצִ֣י הַ/דָּ֔ם וַ/יָּ֖שֶׂם בָּ/אַגָּנֹ֑ת וַ/חֲצִ֣י הַ/דָּ֔ם זָרַ֖ק עַל הַ/מִּזְבֵּֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/006.yaml
  text: Moses took half of the blood and put it in basins[a], and half of the blood he threw against the altar.
translation:
  language: hi
  text: मूसा ने आधा लहू लेकर कटोरों में रखा, और बाकी आधा लहू वेदी पर उछाल दिया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वेदी पर छिड़क दिया” अथवा “वेदी पर छींटे मारे।” बलिदान-संबंधी प्रसंगों में इस इब्रानी क्रिया का अनुवाद कई प्रकार से किया जा सकता है; मुख्य पाठ संभवतः बलयुक्त शारीरिक क्रिया को व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: लेकर
  rationale: לקח का सामान्य कथात्मक अर्थ ‘लेना’ है; संयुक्त क्रिया ‘लेकर ... रखा’ आधुनिक हिन्दी में क्रियाक्रम को स्वाभाविक रूप से व्यक्त करती है।
- source_word: חֲצִי הַדָּם
  choice: आधा लहू / बाकी आधा लहू
  rationale: पहले प्रयोग में मूल का अंशवाचक अर्थ सीधे रखा गया है। दूसरे प्रयोग में ‘बाकी’ जोड़ने से हिन्दी में वही दो बराबर भाग स्पष्ट और स्वाभाविक होते हैं, बिना अर्थ बदले।
- source_word: וַיָּשֶׂם
  choice: रखा
  rationale: שׂים यहाँ किसी वस्तु को पात्रों में रखने का सामान्य क्रियार्थ देता है; ‘रखा’ सहज और सटीक हिन्दी है।
- source_word: בָּאַגָּנֹת
  choice: कटोरों में
  rationale: אַגָּנֹת तरल रखने वाले पात्रों को दर्शाता है। ‘कटोरे’ साधारण आधुनिक पाठक के लिए स्पष्ट है और अनावश्यक तकनीकी विशिष्टता नहीं जोड़ता।
- source_word: זָרַק
  choice: उछाल दिया
  rationale: बलिदान-संबंधी संदर्भ में זרק लहू को वेदी की ओर बलपूर्वक डालने या उछालने की क्रिया बता सकता है। ‘उछाल दिया’ केवल कोमल छिड़काव का आभास देने से बचता है।
- source_word: עַל הַמִּזְבֵּחַ
  choice: वेदी पर
  rationale: עַל का सामान्य स्थानीय अर्थ ‘पर’ है; हिन्दी में ‘वेदी पर उछाल दिया’ लहू को वेदी की सतह पर लगाने की क्रिया स्पष्ट करता है।
- source_word: מֹשֶׁה
  choice: मूसा
  rationale: हिन्दी बाइबिल परंपरा में इस नाम का मानक और व्यापक रूप ‘मूसा’ है।
theological_decisions:
- issue: वेदी पर लहू लगाने की अनुष्ठानिक क्रिया
  choice: ‘वेदी पर उछाल दिया’—क्रिया की बलयुक्त प्रकृति को मुख्य पाठ में रखा गया।
  alternative: ‘वेदी पर छिड़क दिया’ या ‘वेदी पर छींटे मारे’
  rationale: इब्रानी זרק बलिदान-संबंधी प्रयोग में फेंकने, उछालने या छींटे डालने के अर्थ-क्षेत्र में आता है। मुख्य पाठ अधिक बलयुक्त क्रिया चुनता है, पर पादटिप्पणी वैध विकल्पों को सुरक्षित रखती है; इससे कोई अतिरिक्त सांप्रदायिक या धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘लहू’ धार्मिक-बलिदानी संदर्भ में परिचित और स्वाभाविक है। वाक्य की दो-भागीय समानांतर रचना मूल इब्रानी क्रम को बनाए रखती है।
