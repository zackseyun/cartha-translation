source:
  edition: WLC
  text: וְ/נִגַּ֨שׁ מֹשֶׁ֤ה לְ/בַדּ/וֹ֙ אֶל יְהוָ֔ה וְ/הֵ֖ם לֹ֣א יִגָּ֑שׁוּ וְ/הָ/עָ֕ם לֹ֥א יַעֲל֖וּ עִמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/002.yaml
  text: Moses alone shall come near to Yahweh[a], but they shall not come near, and the people shall not go up with him.
translation:
  language: hi
  text: मूसा अकेला ही याहवे[a] के निकट आए; और वे निकट न आएँ, और लोग उसके साथ ऊपर न चढ़ें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'हिब्रू में: “याहवे” (יהוה, YHWH), परमेश्वर का निजी नाम।'
    reason: हिब्रू ईश्वरीय नाम के पाठ-रूप की जानकारी देना।
lexical_decisions:
- source_word: וְנִגַּשׁ
  choice: निकट आए
  rationale: נגשׁ का अर्थ निकट आना या पास जाना है। निर्देशात्मक संदर्भ में हिंदी का विध्यर्थक रूप आज्ञा का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: מֹשֶׁה לְבַדּוֹ
  choice: केवल मूसा ही
  rationale: לבדו मूसा की विशिष्टता बताता है—सिर्फ वही निकट आ सकता है। ‘केवल...ही’ इसे स्पष्ट और स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: אֶל יְהוָה
  choice: यहोवा के निकट
  rationale: אֶל गति की दिशा बताता है; נגשׁ के साथ ‘के निकट’ स्वाभाविक है। יְהוָה को उसके प्रचलित हिंदी लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: וְהֵם לֹא יִגָּשׁוּ
  choice: पर वे निकट न आएँ
  rationale: दूसरी बार आए נגשׁ के लिए भी ‘निकट आएँ’ रखकर शब्दगत पुनरावृत्ति और मूसा के साथ विरोध बनाए रखा गया है। וְ को यहाँ वाक्य के विरोधात्मक संबंध के कारण ‘पर’ किया गया है।
- source_word: וְהָעָם
  choice: और लोग
  rationale: הָעָם सामूहिक रूप से उपस्थित जनसमुदाय को दर्शाता है। मूल में ‘इस्राएल’ नहीं जोड़ा गया है।
- source_word: לֹא יַעֲלוּ
  choice: ऊपर न चढ़ें
  rationale: עלה पर्वत पर ऊपर जाने या चढ़ने की स्थानिक गति बताता है; ‘ऊपर न चढ़ें’ संदर्भ को स्पष्ट और सहज रखता है।
- source_word: עִמּוֹ
  choice: उसके साथ
  rationale: यह सर्वनाम मूसा की ओर संकेत करता है; हिंदी में ‘उसके साथ’ सीधा और स्पष्ट अनुवाद है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ में चतुरक्षरीय निजी नाम सीधे प्रयुक्त है। ‘यहोवा’ आधुनिक हिंदी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला रूप है; पादटिप्पणी पाठक को हिब्रू नाम और वैकल्पिक उच्चारण से अवगत कराती है, बिना मूल में आए निजी नाम को उपाधि में बदलने के।
- issue: निर्देशात्मक अपूर्ण क्रियाओं का बल
  choice: आए / न आएँ / न चढ़ें
  alternative: आएगा / नहीं आएँगे / नहीं चढ़ेंगे
  rationale: इस प्रसंग में हिब्रू अपूर्ण क्रियाएँ साधारण भविष्य की अपेक्षा निर्देश या निषेध का भाव रखती हैं। हिंदी विध्यर्थक रूप उसी बल को स्वाभाविक ढंग से व्यक्त करते हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘केवल...ही’ मूसा की विशिष्ट अनुमति पर बल देता है, जबकि दोहराया गया ‘निकट’ मूल की शब्दगत समानता बनाए रखता है।
