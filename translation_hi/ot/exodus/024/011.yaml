  text: But he did not stretch out his hand against the nobles of the sons of Israel; they saw God[a], and they ate and drank.
translation:
  language: hi
  text: परन्तु उसने इस्राएल के प्रतिष्ठित जनों के विरुद्ध अपना हाथ नहीं बढ़ाया। उन्होंने परमेश्वर को देखा[a], और उन्होंने खाया और पिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्होंने परमेश्वर को निहारा”—इस क्रिया में ध्यान से देखने या निहारने का भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל
  choice: के विरुद्ध
  rationale: שָׁלַח יָד के साथ यह संबंधसूचक शब्द यहाँ विरोधी या दंडात्मक दिशा व्यक्त करता है; आशय है कि परमेश्वर ने उन पर प्रहार नहीं किया।
- source_word: אֲצִילֵי
  choice: प्रतिष्ठित जनों
  rationale: यह शब्द समुदाय के प्रमुख, चुने हुए या ऊँचे पद वाले पुरुषों को सूचित करता है। ‘प्रतिष्ठित जन’ आधुनिक हिन्दी में स्वाभाविक है और केवल वंशगत कुलीनता का अर्थ नहीं देता।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: यह चयन मूल इब्रानी की पारिवारिक अभिव्यक्ति को स्पष्ट रूप से बनाए रखता है।
- source_word: שָׁלַח יָדוֹ
  choice: अपना हाथ नहीं बढ़ाया
  rationale: मूल रूपक को सुरक्षित रखते हुए यह हिन्दी में स्वाभाविक ढंग से उस दंडात्मक या हिंसक कार्य को व्यक्त करता है जो परमेश्वर ने नहीं किया।
- source_word: וַיֶּחֱזוּ
  choice: देखा
  rationale: क्रिया देखने, ध्यानपूर्वक निहारने या दर्शन करने का भाव रख सकती है। मुख्य पाठ में ‘देखा’ सबसे स्पष्ट है; गहन भाव को पादटिप्पणी में रखा गया है।
- source_word: אֶת הָאֱלֹהִים
  choice: परमेश्वर को
  rationale: निश्चित पदबंध यहाँ इस्राएल के परमेश्वर को संदर्भित करता है; हिन्दी में ‘परमेश्वर को’ इसका सीधा और स्वाभाविक अनुवाद है।
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: और उन्होंने खाया-पिया
  rationale: दोनों क्रमिक क्रियाओं को सरलता से रखा गया है, जिससे दिव्य दर्शन के बाद भोजन और पान का उल्लेख अपनी उल्लेखनीय सहजता सहित बना रहता है।
theological_decisions:
- issue: ‘अपना हाथ नहीं बढ़ाया’ का कर्ता
  choice: अव्यक्त कर्ता को ‘उसने’ के रूप में व्यक्त किया गया है, जिसका संदर्भ परमेश्वर है।
  alternative: कर्ता को हिन्दी में भी अव्यक्त छोड़ना।
  rationale: इब्रानी में कर्ता क्रियारूप में निहित है, और प्रसंग में उसका सबसे स्वाभाविक संदर्भ परमेश्वर है। ‘उसने’ कहना वाक्य को स्पष्ट करता है, बिना कोई नया धर्मवैज्ञानिक दावा जोड़े।
- issue: दिव्य साक्षात्कार का वर्णन
  choice: ‘उन्होंने परमेश्वर को देखा’
  alternative: ‘उन्होंने परमेश्वर का कोई प्रकट रूप देखा’ या ‘उन्होंने परमेश्वर का दर्शन किया’।
  rationale: इब्रानी पाठ सीधे कहता है कि उन्होंने परमेश्वर को देखा। अन्य बाइबिल-पाठों के साथ संभावित धर्मवैज्ञानिक तनाव को दूर करने के लिए यहाँ ‘प्रकट रूप’ जोड़ना मूल से अधिक व्याख्यात्मक होता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘इस्राएल के पुत्रों’ से मूल पारिवारिक पदबंध सुरक्षित है; ‘प्रतिष्ठित जन’ अनावश्यक रूप से सामंती अर्थ दिए बिना उनकी प्रमुख सामाजिक स्थिति बताता है।
