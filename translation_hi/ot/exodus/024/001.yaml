source:
  edition: WLC
  text: וְ/אֶל מֹשֶׁ֨ה אָמַ֜ר עֲלֵ֣ה אֶל יְהוָ֗ה אַתָּה֙ וְ/אַהֲרֹן֙ נָדָ֣ב וַ/אֲבִיה֔וּא וְ/שִׁבְעִ֖ים מִ/זִּקְנֵ֣י יִשְׂרָאֵ֑ל וְ/הִשְׁתַּחֲוִיתֶ֖ם מֵ/רָחֹֽק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/001.yaml
  text: Then he said to Moses[a], “Come up to Yahweh, you and Aaron, Nadab and Abihu, and seventy of the elders of Israel, and bow down from a distance.”
translation:
  language: hi
  text: फिर उसने मूसा से कहा,[a] “तुम, हारून, नादाब, अबीहू और इस्राएल के बुज़ुर्गों में से सत्तर जन यहोवा के पास ऊपर आओ और दूर से दण्डवत् करो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “यहोवा के पास ऊपर आओ।” वक्ता यहोवा प्रतीत होता है, फिर भी पाठ में यही तृतीय-पुरुष अभिव्यक्ति है; कुछ अनुवाद इसे “मेरे पास ऊपर आओ” या “यहोवा के सामने ऊपर आओ” करते हैं।
    reason: मूल पाठ की असामान्य अभिव्यक्ति और उसके वैकल्पिक अनुवादों को स्पष्ट करना।
lexical_decisions:
- source_word: וְ/אֶל מֹשֶׁה אָמַר
  choice: फिर उसने मूसा से कहा
  rationale: इब्रानी में शब्दक्रम ‘और मूसा से उसने कहा’ है और कर्ता निहित है। आधुनिक हिन्दी में स्वाभाविक कथात्मक क्रम रखते हुए ‘उसने’ तत्काल प्रसंग से ग्रहण किया गया है।
- source_word: עֲלֵה
  choice: ऊपर आओ
  rationale: आज्ञार्थक क्रिया का अर्थ ऊपर जाना/आना है। दिव्य उपस्थिति की ओर बुलावे के प्रसंग में ‘ऊपर आओ’ स्वाभाविक है।
- source_word: אֶל יְהוָה
  choice: यहोवा के पास
  rationale: אֶל निकट पहुँचने की दिशा बताता है और יְהוָה परमेश्वर का व्यक्तिवाचक वाचा-नाम है। वक्ता स्वयं यहोवा प्रतीत होने पर भी स्रोत की असामान्य तृतीय-पुरुष अभिव्यक्ति सुरक्षित रखी गई है।
- source_word: אַתָּה וְ/אַהֲרֹן נָדָב וַ/אֲבִיהוּא
  choice: तुम हारून, नादाब और अबीहू ... के साथ
  rationale: स्पष्ट सर्वनाम ‘तुम’ मूसा को सूची के आरम्भ में विशेष रूप से रखता है। हिन्दी में सहभागी सूची को ‘के साथ’ से जोड़ना अर्थ को स्पष्ट और सहज बनाता है।
- source_word: וְ/שִׁבְעִים מִ/זִּקְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुरनियों में से सत्तर जन
  rationale: 'מִן की अंशसूचक भूमिका सुरक्षित है: ये इस्राएल के पुरनियों में से चुने गए सत्तर व्यक्ति हैं। ‘पुरनिये’ इस संदर्भ में समुदाय के मान्य अगुओं का परिचित बाइबलीय हिन्दी पद है।'
- source_word: וְ/הִשְׁתַּחֲוִיתֶם
  choice: और ... दण्डवत् करो
  rationale: क्रिया श्रद्धापूर्वक झुकने या भूमि पर गिरकर प्रणाम करने को दर्शाती है। ‘दण्डवत् करो’ शारीरिक क्रिया और आदर दोनों को व्यक्त करता है, बिना इसे केवल सामान्य ‘आराधना’ कहकर व्याख्यायित किए।
- source_word: מֵ/רָחֹק
  choice: दूर से
  rationale: यह दिव्य उपस्थिति से स्थानिक दूरी बनाए रखने का निर्देश है; ‘दूर से’ संक्षिप्त और स्वाभाविक आधुनिक हिन्दी है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में वाचा-नाम स्पष्ट रूप से उपस्थित है। हिन्दी में व्यापक रूप से पहचाने जाने वाले व्यक्तिवाचक रूप ‘यहोवा’ द्वारा नाम को उपाधि में बदले बिना सुरक्षित रखा गया है।
- issue: यहोवा के वक्ता होने पर भी ‘यहोवा के पास’ कहना
  choice: मुख्य पाठ में स्रोत की तृतीय-पुरुष अभिव्यक्ति बनाए रखना
  alternative: मेरे पास ऊपर आओ; यहोवा के सामने ऊपर आओ
  rationale: इब्रानी स्पष्टतः ‘यहोवा के पास’ कहता है। इसे ‘मेरे पास’ करना पाठ की वास्तविक कथात्मक और धर्मवैज्ञानिक असामान्यता को चुपचाप सुलझा देता; इसलिए तनाव को सुरक्षित रखा गया है और पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘पुरनिये’ और ‘दण्डवत्’ जैसे परिचित बाइबलीय शब्द इस प्राचीन औपचारिक प्रसंग में अर्थपूर्ण हैं; वाक्य-संरचना साधारण हिन्दी पाठक के लिए सहज बनाई गई है।
