id: EXO.24.10
reference: Exodus 24:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּרְא֕וּ אֵ֖ת אֱלֹהֵ֣י יִשְׂרָאֵ֑ל וְ/תַ֣חַת רַגְלָ֗י/ו כְּ/מַעֲשֵׂה֙ לִבְנַ֣ת הַ/סַּפִּ֔יר וּ/כְ/עֶ֥צֶם הַ/שָּׁמַ֖יִם לָ/טֹֽהַר׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/010.yaml
  text: And they saw the God of Israel[a], and under his feet was something like a pavement of sapphire stone[b], like the very heavens in clearness.
translation:
  language: hi
  text: और उन्होंने इस्राएल के परमेश्वर को देखा। उसके चरणों के नीचे नीलम-पत्थर[a] की बनाई हुई पक्की सतह[b] जैसा कुछ था, जो निर्मलता में स्वयं आकाश जैसा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः “लाजवर्द”; प्राचीन संसार में סַפִּיר नामक पत्थर की ठीक पहचान निश्चित नहीं है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक भाव है, “नीलम की ईंट/पटिया की कारीगरी जैसी”; इससे उसके चरणों के नीचे कारीगरी से बनी ईंटों या पटियों जैसी सतह का चित्र उभरता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: उन्होंने ... देखा
  rationale: ראה का सामान्य अर्थ प्रत्यक्ष रूप से ‘देखना’ है। यह अनुवाद दर्शन के कथन को न तो नरम करता है, न उसकी व्याख्या जोड़ता है।
- source_word: אֵת אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर को
  rationale: सीधे कर्म को चिह्नित करने वाला אֵת और संबंधवाचक पदबंध स्पष्ट रूप से इस्राएल के परमेश्वर को देखे जाने का विषय बताते हैं।
- source_word: וְתַחַת רַגְלָיו
  choice: उसके चरणों के नीचे
  rationale: תַחַת का अर्थ ‘नीचे’ है और एकवचन पुल्लिंग प्रत्यय ‘उसके’ को दर्शाता है। ‘चरण’ गरिमापूर्ण किन्तु सहज हिन्दी है और मूल के देहात्मक चित्रण को बनाए रखता है।
- source_word: כְּמַעֲשֵׂה
  choice: बनाई हुई ... जैसा
  rationale: מַעֲשֶׂה यहाँ काम या कारीगरी का भाव देता है। ‘बनाई हुई’ दृश्य में गढ़ी गई सतह का संकेत देते हुए तुलना-सूचक כְּ को ‘जैसा’ से बनाए रखता है।
- source_word: לִבְנַת
  choice: पक्की सतह
  rationale: לִבְנָה ईंट या ईंट/पटिया से बने काम को सूचित कर सकता है। पैरों के नीचे के दृश्य में ‘पक्की सतह’ स्वाभाविक है और केवल एक ईंट होने का भ्रामक अर्थ नहीं देता।
- source_word: הַסַּפִּיר
  choice: नीलम-पत्थर
  rationale: परंपरागत पहचान ‘नीलम’ है, पर प्राचीन खनिज की ठीक पहचान अनिश्चित है। ‘पत्थर’ जोड़ने से रत्न/खनिज का बोध स्पष्ट होता है; वैकल्पिक पहचान पाद-टिप्पणी में दी गई है।
- source_word: וּכְעֶצֶם הַשָּׁמַיִם
  choice: स्वयं आकाश जैसा
  rationale: עֶצֶם यहाँ ‘हड्डी’ के शाब्दिक अर्थ में नहीं, बल्कि आकाश के अपने ही स्वरूप पर बल देता है। ‘स्वयं आकाश’ उस बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לָטֹהַר
  choice: निर्मलता में
  rationale: טֹהַר शुद्धता, स्वच्छता या निर्मल स्पष्टता का अर्थ देता है। दृश्य संदर्भ में ‘निर्मलता’ नैतिक शुद्धता तक अर्थ को सीमित किए बिना चमकती स्वच्छता का भाव रखता है।
theological_decisions:
- issue: परमेश्वर को देखने और उसके चरणों का देहात्मक वर्णन
  choice: ‘उन्होंने इस्राएल के परमेश्वर को देखा’ और ‘उसके चरणों के नीचे’ को सीधे बनाए रखा गया है।
  alternative: ‘उन्होंने इस्राएल के परमेश्वर का प्रकट रूप देखा’ अथवा ‘उन्होंने वह स्थान देखा जहाँ परमेश्वर खड़ा था।’
  rationale: इब्रानी पाठ सीधे कहता है कि उन्होंने परमेश्वर को देखा और उसके चरणों के नीचे की वस्तु का वर्णन करता है। ‘प्रकट रूप’ जैसी व्याख्या जोड़ना मूल पाठ की वास्तविक धर्मवैज्ञानिक तनातनी को पहले ही हल कर देगा।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज और गरिमापूर्ण रखी गई है। ‘चरण’ दर्शन के ऊँचे प्रसंग के अनुरूप है, जबकि वाक्य-विन्यास सामान्य पाठक के लिए सीधा है। पाद-टिप्पणी चिह्न उन्हीं शब्दों के बाद रखे गए हैं जिनसे वे संबंधित हैं।
