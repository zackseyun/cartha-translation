language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֗ח אֶֽת נַעֲרֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יַּֽעֲל֖וּ עֹלֹ֑ת וַֽ/יִּזְבְּח֞וּ זְבָחִ֧ים שְׁלָמִ֛ים לַ/יהוָ֖ה פָּרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/005.yaml
  text: And he sent the young men of the sons of Israel[b][a], and they offered up burnt offerings and sacrificed peace offerings of bulls to Yahweh.
translation:
  language: hi
  text: फिर उसने इस्राएलियों के जवानों[a] को भेजा। उन्होंने याहवे के लिए होमबलियाँ चढ़ाईं और बैलों की मेलबलियाँ[b] चढ़ाईं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “इस्राएल के पुत्रों के जवानों।”
    reason: इब्रानी संबंधवाचक पदबंध की अधिक शाब्दिक रचना बताने के लिए।
  - marker: b
    text: इसे “सहभागिता-बलि” या “कुशल-बलि” भी कहा जा सकता है।
    reason: שְׁלָמִים के अर्थ में मेल, साझा सहभागिता और कुशल-क्षेम—इनसे जुड़े भाव समाए हो सकते हैं।
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: उसने भेजा
  rationale: שׁלח का सीधा और स्वाभाविक हिन्दी अर्थ ‘भेजना’ है; कर्ता पिछले प्रसंग से मूसा है, पर मूल पाठ की तरह यहाँ उसका नाम नहीं जोड़ा गया।
- source_word: נַעֲרֵי בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों के जवानों
  rationale: נַעֲרֵי पुरुष युवकों या जवानों को सूचित करता है। ‘इस्राएलियों के जवान’ आधुनिक हिन्दी में स्वाभाविक है और इब्रानी रचना का आशय सुरक्षित रखता है।
- source_word: וַיַּעֲלוּ עֹלֹת
  choice: होमबलियाँ चढ़ाईं
  rationale: עלה और עֹלָה का यह स्थापित बलिदानी प्रयोग है। ‘होमबलि’ उस बलि को व्यक्त करती है जो वेदी पर पूर्णतः जलाई जाती थी, और ‘चढ़ाईं’ क्रिया के बलिदानी भाव को स्वाभाविक हिन्दी में रखती है।
- source_word: וַיִּזְבְּחוּ זְבָחִים שְׁלָמִים
  choice: मेलबलि के रूप में बलि चढ़ाया
  rationale: זבח का अर्थ बलि करना या बलि चढ़ाना है, जबकि שְׁלָמִים एक विशिष्ट बलिदानी श्रेणी है। ‘मेलबलि’ हिन्दी बाइबलीय प्रयोग में परिचित है; अन्य सम्भव अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: לַיהוָה
  choice: याहवे के लिए
  rationale: לְ उद्देश्य या प्राप्तकर्ता दर्शाता है, और יהוה को उसके व्यक्तिगत वाचा-नाम के रूप में ‘याहवे’ लिखा गया है।
- source_word: פָּרִים
  choice: बैलों को
  rationale: פָּרִים स्पष्ट करता है कि मेलबलि के पशु बैल थे। हिन्दी वाक्य में इन्हें ‘मेलबलि के रूप में’ चढ़ाए गए प्रत्यक्ष कर्म के रूप में रखना स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम יהוה है। ‘याहवे’ उसके सम्भावित प्राचीन उच्चारण को सीधे सुरक्षित रखता है; उसे केवल उपाधि ‘प्रभु’ से बदलने पर नाम और उपाधि का भेद मिट जाता।
- issue: שְׁלָמִים की बलिदानी श्रेणी
  choice: मेलबलि
  alternative: सहभागिता-बलि; कुशल-बलि
  rationale: शब्द में मेल, सहभागिता और कुशल-क्षेम से जुड़े अर्थों की सम्भावना है। मुख्य पाठ में परिचित ‘मेलबलि’ रखा गया है और अर्थ-परास को पादटिप्पणी में सुरक्षित किया गया है।
- issue: בְּנֵי יִשְׂרָאֵל का सामूहिक अर्थ
  choice: इस्राएली
  alternative: इस्राएल के पुत्र
  rationale: यहाँ स्थापित जातिनाम का आशय इस्राएल के समुदाय से है। ‘इस्राएली’ आधुनिक हिन्दी में स्वाभाविक है, जबकि शाब्दिक संरचना पादटिप्पणी में दी गई है; נַעֲרֵי का पुरुष-संदर्भ ‘जवानों’ में बना रहता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘होमबलि’ और ‘मेलबलि’ प्रसंगानुकूल धार्मिक पारिभाषिक शब्द हैं। दो छोटे वाक्यों का प्रयोग इब्रानी कथन-क्रम को स्पष्ट और स्वाभाविक हिन्दी में प्रस्तुत करता है।
