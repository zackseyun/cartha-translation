  text: וַ/יַּ֥עַל מֹשֶׁ֖ה אֶל הָ/הָ֑ר וַ/יְכַ֥ס הֶ/עָנָ֖ן אֶת הָ/הָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/015.yaml
  text: Then Moses went up onto the mountain[a], and the cloud covered the mountain.
translation:
  language: hi
  text: तब मूसा पहाड़ पर चढ़ गया[a], और बादल ने पहाड़ को ढक लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और मूसा पहाड़ की ओर चढ़ा।” इब्रानी कथात्मक संयोजक का अनुवाद “और” भी हो सकता है, और सम्बन्धबोधक शब्द का अर्थ “की ओर” या, “चढ़ा” के साथ इस प्रसंग में, “पर” लिया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: तब … चढ़ गया
  rationale: עלה का मूल अर्थ ऊपर जाना या चढ़ना है। कथात्मक וַ को यहाँ क्रमसूचक ‘तब’ से व्यक्त किया गया है; ‘चढ़ गया’ आधुनिक हिन्दी में स्वाभाविक रूप से ऊर्ध्व दिशा बताता है।
- source_word: מֹשֶׁה
  choice: मूसा
  rationale: व्यक्तिनाम का मानक हिन्दी बाइबलीय रूप।
- source_word: אֶל־הָהָר
  choice: पहाड़ पर
  rationale: עלה के साथ אֶל गंतव्य की ओर ऊपर जाने को व्यक्त करता है। सन्दर्भ में ‘पहाड़ पर’ स्वाभाविक है, यद्यपि ‘पहाड़ की ओर’ भी व्याकरणतः सम्भव है।
- source_word: וַיְכַס
  choice: ढक लिया
  rationale: כסה का सीधा अर्थ ढकना है। ‘ढक लिया’ पूर्ण हुई कथात्मक क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है, बिना ‘चारों ओर घेर लिया’ जैसा अतिरिक्त अर्थ जोड़े।
- source_word: הֶעָנָן
  choice: बादल
  rationale: निश्चित संज्ञा उस बादल को सूचित करती है जो इस प्रसंग में पहले से पहचाना हुआ है; हिन्दी में ‘बादल ने’ प्रसंगगत निश्चितता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֵת הָהָר
  choice: पहाड़ को
  rationale: אֵת अनूदित न होने वाला निश्चित कर्म-चिह्न है; हिन्दी में ‘को’ से कर्म स्पष्ट किया गया है।
theological_decisions:
- issue: बादल की प्रकृति
  choice: केवल ‘बादल’
  alternative: ‘यहोवा का बादल’ या ‘महिमा का बादल’
  rationale: इब्रानी पद में केवल הֶעָנָן है। व्यापक प्रसंग इसे परमेश्वर की उपस्थिति से जोड़ता है, पर इस पद में ‘यहोवा का’ या ‘महिमा’ नहीं जोड़ा गया; इसलिए मूल की संयमित अभिव्यक्ति सुरक्षित रखी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली। ‘आरोहण किया’ की अपेक्षा ‘चढ़ गया’ सामान्य पाठक के लिए अधिक स्वाभाविक है।
