  text: וַ/יָּ֣קָם מֹשֶׁ֔ה וִ/יהוֹשֻׁ֖עַ מְשָׁרְת֑/וֹ וַ/יַּ֥עַל מֹשֶׁ֖ה אֶל הַ֥ר הָ/אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/013.yaml
  text: So Moses arose with Joshua his attendant[a], and Moses went up to the mountain of God.
translation:
  language: hi
  text: तब मूसा अपने सहायक[a] यहोशू के साथ उठा, और मूसा परमेश्वर के पर्वत पर चढ़ गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सेवक।” इब्रानी शब्द पास रहकर सेवा करनेवाले व्यक्ति के लिए प्रयुक्त हो सकता है; यहाँ यह संभवतः मूसा के निजी सहायक के रूप में यहोशू की भूमिका बताता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: उठा
  rationale: קום का क़ाल कथात्मक रूप यहाँ उठने और आगे की कार्रवाई आरम्भ करने को व्यक्त करता है। ‘उठा’ स्वाभाविक हिन्दी है और इसे केवल ‘चल पड़ा’ तक सीमित नहीं करता।
- source_word: וִיהוֹשֻׁעַ
  choice: यहोशू
  rationale: नाम का प्रचलित हिन्दी बाइबलीय रूप अपनाया गया है।
- source_word: מְשָׁרְתוֹ
  choice: अपने सहायक
  rationale: שרת से बना यह शब्द किसी के पास रहकर उसकी सेवा करनेवाले व्यक्ति को सूचित कर सकता है। इस प्रसंग में ‘सहायक’ यहोशू की मूसा के प्रति व्यक्तिगत सेवा को स्वाभाविक रूप से व्यक्त करता है और दासता या धार्मिक पद का अनावश्यक भाव नहीं लाता।
- source_word: וַיַּעַל
  choice: चढ़ गया
  rationale: עלה यहाँ पर्वत की ओर ऊपर जाने को दर्शाता है; ‘चढ़ गया’ आधुनिक हिन्दी में इस स्थानिक गति का स्वाभाविक अनुवाद है।
- source_word: הַר הָאֱלֹהִים
  choice: परमेश्वर के पर्वत
  rationale: यह रूप इब्रानी संबंध-वाक्यांश का सीधा और स्वाभाविक हिन्दी प्रतिरूप है तथा पर्वत के पवित्र संबंध को बिना व्याख्यात्मक विस्तार के बनाए रखता है।
theological_decisions:
- issue: מְשָׁרְתוֹ में मूसा और यहोशू का संबंध
  choice: यहोशू को मूसा का ‘सहायक’ कहा गया है।
  alternative: ‘सेवक’ या ‘सेवा करनेवाला’
  rationale: इब्रानी शब्द सेवा के कई प्रकार सूचित कर सकता है, पर यहाँ कथा-संदर्भ व्यक्तिगत रूप से साथ रहकर सहायता करने की ओर संकेत करता है। ‘सहायक’ न तो दासता का भाव थोपता है, न बाद के किसी संस्थागत धार्मिक पद का।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। इब्रानी के समन्वित वाक्य ‘मूसा और उसका सहायक यहोशू उठे’ को स्वाभाविक हिन्दी में ‘अपने सहायक यहोशू के साथ उठा’ कहा गया है; इससे दोनों के साथ होने का आशय बना रहता है और अगली क्रिया में मूसा पर केंद्रित कथन भी स्पष्ट रहता है।
