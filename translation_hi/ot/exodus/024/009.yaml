  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: ऊपर गए
  rationale: עלה की ऊपर की ओर गति को स्वाभाविक हिन्दी में व्यक्त करता है। प्रसंग में पहाड़ अभिप्रेत है, पर इस पद में उसका स्पष्ट उल्लेख नहीं है, इसलिए उसे जोड़ा नहीं गया। एकवचन हिब्रू क्रिया संयुक्त कर्ताओं के आगे आई है; हिन्दी में पूरे संयुक्त कर्ता के अनुसार बहुवचन रखा गया है।
- source_word: מֹשֶׁה
  choice: मूसा
  rationale: इस नाम का प्रचलित मानक हिन्दी रूप।
- source_word: וְאַהֲרֹן
  choice: हारून
  rationale: संयोजक सहित नाम; हिन्दी बाइबल परंपरा में प्रचलित रूप।
- source_word: נָדָב
  choice: नादाब
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: וַאֲבִיהוּא
  choice: अबीहू
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: וְשִׁבְעִים
  choice: और ... सत्तर जन
  rationale: हिब्रू समन्वय और संख्या दोनों को स्पष्ट तथा स्वाभाविक हिन्दी में व्यक्त करता है; ‘जन’ मनुष्यों की गिनती को सहज बनाता है।
- source_word: מִזִּקְנֵי
  choice: पुरनियों में से
  rationale: 'מן का यहाँ अंशसूचक अर्थ है: इस्राएल के पुरनियों के समूह में से चुने गए सत्तर। ‘में से’ इस संबंध को स्पष्ट रखता है।'
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: राष्ट्रीय नाम का प्रचलित मानक हिन्दी रूप।
