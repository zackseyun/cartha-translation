  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אֶל הַ/זְּקֵנִ֤ים אָמַר֙ שְׁבוּ לָ֣/נוּ בָ/זֶ֔ה עַ֥ד אֲשֶׁר נָשׁ֖וּב אֲלֵי/כֶ֑ם וְ/הִנֵּ֨ה אַהֲרֹ֤ן וְ/חוּר֙ עִמָּ/כֶ֔ם מִי בַ֥עַל דְּבָרִ֖ים יִגַּ֥שׁ אֲלֵ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/014.yaml
  text: And to the elders he said[a], “Wait here for us until we return to you. And look, Aaron and Hur are with you. Whoever has a dispute, let him approach them.”
translation:
  language: hi
  text: उसने प्राचीनों से कहा, “हमारे लौटकर तुम्हारे पास आने तक तुम यहीं ठहरे रहो। देखो, हारून और हूर तुम्हारे साथ हैं। जिस किसी का कोई विवाद हो,[a] वह उनके पास जाए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिस किसी का कोई मुक़दमा हो।”
    reason: בַעַל דְּבָרִים कानूनी विवाद या विधिवत मामले—दोनों अर्थ दे सकता है; ‘मुक़दमा’ उसका अधिक स्पष्ट न्यायिक विकल्प है।
lexical_decisions:
- source_word: הַזְּקֵנִים
  choice: प्राचीनों
  rationale: यह शब्द समुदाय के मान्य अगुओं की ओर संकेत करता है, केवल अधिक आयु वाले पुरुषों की ओर नहीं। ‘प्राचीन’ हिन्दी बाइबल की परिचित और प्रसंगानुकूल संज्ञा है।
- source_word: שְׁבוּ לָנוּ בָזֶה
  choice: हमारे ... आने तक तुम यहीं ठहरे रहो
  rationale: ישׁב का मूल भाव बैठने या बने रहने का है; यहाँ आदेश का आशय उसी स्थान पर रुककर प्रतीक्षा करना है। לָנוּ के ‘हमारे लिए/हमारी प्रतीक्षा में’ भाव को पूरे वाक्य की स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: עַד אֲשֶׁר נָשׁוּב אֲלֵיכֶם
  choice: हमारे लौटकर तुम्हारे पास आने तक
  rationale: यह temporal clause שוב के लौटने के भाव और אֲלֵיכֶם के ‘तुम्हारे पास’ अर्थ—दोनों को स्पष्ट रखता है।
- source_word: וְהִנֵּה
  choice: देखो
  rationale: यह आगे की बात पर ध्यान खींचता है। ‘देखो’ आधुनिक, स्वाभाविक और गरिमापूर्ण है तथा अत्यधिक पुरातन शैली से बचता है।
- source_word: עִמָּכֶם
  choice: तुम्हारे साथ हैं
  rationale: עִם यहाँ उपस्थिति और संगति बताता है; सीधा हिन्दी समतुल्य ‘तुम्हारे साथ’ है।
- source_word: מִי בַעַל דְּבָרִים
  choice: जिस किसी का कोई विवाद हो
  rationale: यह इब्रानी मुहावरा किसी न्यायिक मामले, दावे या विवाद से जुड़े व्यक्ति को दर्शाता है। ‘विवाद’ कानूनी संदर्भ को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि वैकल्पिक ‘मुक़दमा’ पादटिप्पणी में सुरक्षित है।
- source_word: יִגַּשׁ אֲלֵהֶם
  choice: वह उनके पास जाए
  rationale: इस प्रसंग में imperfect का निर्देशात्मक भाव है। हिन्दी में ‘वह ... जाए’ उस एकवचन सामान्य निर्देश को सहज रूप से व्यक्त करता है।
theological_decisions:
- issue: न्यायिक निर्देश में सामान्य एकवचन
  choice: वह उनके पास जाए
  alternative: वे उनके पास जाएँ
  rationale: इब्रानी מִי ... יִגַּשׁ एकवचन सामान्य कर्ता का प्रयोग करता है। हिन्दी का ‘जिस किसी ... वह’ इसी व्याकरणिक रूप को स्वाभाविक ढंग से बनाए रखता है और अनावश्यक बहुवचन व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और वाचनीय शैली रखी गई है। ‘प्राचीनों’ से सामुदायिक पद का भाव और ‘देखो’ से הִנֵּה का ध्यानाकर्षक बल सुरक्षित रखा गया है।
