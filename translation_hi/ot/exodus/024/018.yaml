  text: Moses entered into the midst of the cloud and went up the mountain[a]. And Moses was on the mountain forty days and forty nights.
translation:
  language: hi
  text: मूसा बादल के बीच में प्रवेश करके पर्वत पर चढ़ गया।[a] और मूसा चालीस दिन और चालीस रात पर्वत पर रहा।
  philosophy: optimal-equivalence
  footnotes:
