    text: या, “बादल के भीतर।” इब्रानी में इस बात पर बल है कि मूसा बादल के अंदर गया।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: प्रवेश करके
  rationale: यहाँ בוא मूसा के बादल के भीतर जाने को व्यक्त करता है; ‘प्रवेश करके’ दिशा और अगले क्रमिक कार्य से संबंध को स्वाभाविक हिंदी में रखता है।
- source_word: בְּתוֹךְ הֶעָנָן
  choice: बादल के बीच में
  rationale: תּוֹךְ बादल के भीतरी भाग या मध्य पर बल देता है; यह अनुवाद स्पष्ट करता है कि मूसा बादल के भीतर गया, केवल उसके पास नहीं।
- source_word: וַיַּעַל אֶל הָהָר
  choice: पर्वत पर चढ़ गया
  rationale: עלה ऊपर जाने या चढ़ने को बताता है, और אֶל गंतव्य सूचित करता है; संयुक्त हिंदी वाक्यांश स्वाभाविक रूप से पर्वतारोहण व्यक्त करता है।
- source_word: וַיְהִי מֹשֶׁה בָּהָר
  choice: मूसा ... पर्वत पर रहा
  rationale: היה यहाँ अवधि भर मूसा की स्थिति और स्थान बताता है। ‘रहा’ हिंदी में केवल ‘था’ से अधिक स्वाभाविक है, पर इसमें किसी अतिरिक्त धार्मिक अर्थ का समावेश नहीं होता।
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לָיְלָה
  choice: चालीस दिन और चालीस रात
  rationale: यह इब्रानी अवधि-वाक्यांश का सीधा, प्रचलित और स्वाभाविक हिंदी रूप है।
theological_decisions:
- issue: ईश्वरीय उपस्थिति से जुड़े बादल का चित्रण
  choice: बादल
  alternative: घना बादल
  rationale: यहाँ इब्रानी पाठ में केवल निश्चित रूप वाला עָנָן है; ‘घना’ अर्थ पाठ में जोड़ देगा। साधारण ‘बादल’ कथा के ईश्वर-प्रकटन संबंधी तनाव और संकेत को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज, गरिमापूर्ण और कथात्मक शैली। ‘पर्वत’ और ‘प्रवेश’ जैसे शब्द सामान्य पाठकों के लिए बोधगम्य रहते हुए प्रसंग की गंभीरता बनाए रखते हैं।
