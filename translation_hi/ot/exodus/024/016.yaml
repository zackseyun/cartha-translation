source:
  edition: WLC
  text: וַ/יִּשְׁכֹּ֤ן כְּבוֹד יְהוָה֙ עַל הַ֣ר סִינַ֔י וַ/יְכַסֵּ֥/הוּ הֶ/עָנָ֖ן שֵׁ֣שֶׁת יָמִ֑ים וַ/יִּקְרָ֧א אֶל מֹשֶׁ֛ה בַּ/יּ֥וֹם הַ/שְּׁבִיעִ֖י מִ/תּ֥וֹךְ הֶ/עָנָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/016.yaml
  text: And the glory of Yahweh settled on Mount Sinai[a], and the cloud covered it for six days[b]. On the seventh day he called to Moses from the midst of the cloud.
translation:
  language: hi
  text: याहवे की महिमा सीनै पर्वत पर ठहर गई, और बादल ने उसे[a] छह दिन तक ढके रखा। सातवें दिन याहवे ने बादल के बीच से मूसा को पुकारा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उसे’ का संकेत संभवतः सीनै पर्वत की ओर है। इसका अर्थ यह भी हो सकता है कि बादल ने याहवे की महिमा को ढक लिया।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁכֹּן
  choice: ठहर गई
  rationale: שׁכן यहाँ किसी स्थान पर आकर स्थिर उपस्थिति ग्रहण करने का भाव देता है। ‘ठहर गई’ आधुनिक और स्वाभाविक हिंदी में इस ठहरने को व्यक्त करता है।
- source_word: כְּבוֹד יְהוָה
  choice: याहवे की महिमा
  rationale: כָּבוֹד के लिए ‘महिमा’ प्रचलित और अर्थपूर्ण हिंदी पद है; यहाँ यह याहवे की प्रकट वैभवपूर्ण उपस्थिति को दर्शाता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिगत नाम יהוה का देवनागरी लिप्यंतरण किया गया है, किसी उपाधि से उसका स्थान नहीं लिया गया।
- source_word: עַל הַר סִינַי
  choice: सीनै पर्वत पर
  rationale: स्थान-सूचक עַל का स्वाभाविक हिंदी रूप है और पर्वत के नाम को स्पष्ट रखता है।
- source_word: וַיְכַסֵּהוּ
  choice: उसे … ढके रखा
  rationale: पुल्लिंग एकवचन प्रत्यय का सबसे संभावित संकेत सीनै पर्वत की ओर है। ‘ढके रखा’ छह दिनों तक बनी रही अवस्था को सहज हिंदी में व्यक्त करता है; संदर्भ की वास्तविक अस्पष्टता पादटिप्पणी में रखी गई है।
- source_word: שֵׁשֶׁת יָמִים
  choice: छह दिन तक
  rationale: इब्रानी कालावधि को आधुनिक हिंदी में स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיִּקְרָא אֶל־מֹשֶׁה
  choice: याहवे ने … मूसा को पुकारा
  rationale: קרא אל का सीधा और प्रसंगानुकूल अर्थ ‘को पुकारना’ है। हिंदी में अस्पष्ट सर्वनाम से बचने के लिए प्रसंग से स्पष्ट कर्ता याहवे को दोहराया गया है।
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: सातवें दिन
  rationale: निश्चित क्रमवाचक काल-सूचक पद का सहज हिंदी रूप।
- source_word: מִתּוֹךְ הֶעָנָן
  choice: बादल के बीच से
  rationale: מִתּוֹךְ बादल के भीतर या मध्य से आने की स्थानिक छवि बनाए रखता है।
theological_decisions:
- issue: ‘पुकारा’ का कर्ता
  choice: याहवे
  alternative: ‘याहवे की महिमा’ को लाक्षणिक कर्ता समझना
  rationale: इब्रानी में कर्ता अंतर्निहित ‘उसने’ है। सीनै के व्यापक प्रसंग में मूसा को पुकारने वाला याहवे है; हिंदी में नाम दोहराने से वाक्य स्वाभाविक और संदर्भ स्पष्ट रहता है।
- issue: וַיְכַסֵּהוּ में कर्मवाचक प्रत्यय का संकेत
  choice: सीनै पर्वत
  alternative: याहवे की महिमा
  rationale: व्याकरणतः दोनों पुल्लिंग एकवचन संज्ञाएँ संभव हैं। दृश्य और निकट प्रसंग पर्वत को प्राथमिक बनाते हैं, पर दूसरी वास्तविक संभावना पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिंदी पाठक के लिए सहज रखी गई है। ‘महिमा,’ ‘पर्वत’ और ‘पुकारा’ जैसे परिचित शब्द मूल की धार्मिक तथा कथात्मक गरिमा बनाए रखते हैं।
