language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יָּבֹ֣א מֹשֶׁ֗ה וַ/יְסַפֵּ֤ר לָ/עָם֙ אֵ֚ת כָּל דִּבְרֵ֣י יְהוָ֔ה וְ/אֵ֖ת כָּל הַ/מִּשְׁפָּטִ֑ים וַ/יַּ֨עַן כָּל הָ/עָ֜ם ק֤וֹל אֶחָד֙ וַ/יֹּ֣אמְר֔וּ כָּל הַ/דְּבָרִ֛ים אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה נַעֲשֶֽׂה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/003.yaml
  text: Then Moses came and told the people all the words of Yahweh and all the ordinances[a], and all the people answered with one voice and said, “All the words that Yahweh has spoken we will do.”
translation:
  language: hi
  text: तब मूसा आया और उसने लोगों को याहवे की सारी बातें और सारे न्याय-विधान[a] सुनाए। तब सभी लोगों ने एक स्वर में उत्तर दिया, “जो कुछ याहवे ने कहा है, वह सब हम करेंगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “नियम”; इब्रानी शब्द मिश्पाटीम वाचा से जुड़े कानूनी निर्णयों या विधानों को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: तब मूसा ने आकर
  rationale: वाव-क्रम कथा को आगे बढ़ाता है और בוא का मूल अर्थ ‘आना’ है; हिंदी में ‘तब ... ने आकर’ स्वाभाविक कथात्मक प्रवाह देता है।
- source_word: וַיְסַפֵּר
  choice: सुनाए
  rationale: पिएल रूप में ספר का अर्थ बताना या विस्तार से सुनाना है। ‘सुनाए’ लोगों तक कही हुई बात पहुँचाने का स्वाभाविक हिंदी प्रयोग है।
- source_word: כָּל דִּבְרֵי יְהוָה
  choice: यहोवा की सारी बातें
  rationale: דְּבָרִים को सामान्यीकृत करके केवल ‘आज्ञाएँ’ नहीं बनाया गया, ताकि इब्रानी में ‘बातों/वचनों’ की व्यापकता बनी रहे।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिंदी में प्रचलित व्यक्तिगत नाम ‘यहोवा’ चतुरक्षरीय ईश्वरीय नाम को किसी उपाधि से प्रतिस्थापित किए बिना व्यक्त करता है।
- source_word: הַמִּשְׁפָּטִים
  choice: न्याय-विधान
  rationale: מִשְׁפָּטִים यहाँ वाचा से जुड़े कानूनी निर्णयों और नियमों को सूचित करता है। ‘न्याय-विधान’ इसके न्यायिक आधार और विधिक कार्य, दोनों को संक्षेप में बनाए रखता है।
- source_word: וַיַּעַן
  choice: उत्तर दिया
  rationale: ענה का इस प्रसंग में सीधा अर्थ उत्तर देना है।
- source_word: קוֹל אֶחָד
  choice: एक स्वर में
  rationale: शाब्दिक ‘एक आवाज़’ सामूहिक सहमति का मुहावरा है; ‘एक स्वर में’ आधुनिक हिंदी में इसका स्वाभाविक समतुल्य है।
- source_word: כָּל הַדְּבָרִים אֲשֶׁר דִּבֶּר יְהוָה
  choice: जो कुछ यहोवा ने कहा है, वह सब
  rationale: यह स्वाभाविक हिंदी में समग्रता को स्पष्ट रखता है और पहले उल्लिखित यहोवा की सारी बातों से संबंध बनाए रखता है।
- source_word: נַעֲשֶׂה
  choice: हम करेंगे
  rationale: עשה का सीधा अर्थ ‘करना’ है। ‘हम करेंगे’ आज्ञापालन का निहितार्थ रखते हुए मूल की ठोस अभिव्यक्ति को सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: पद में व्यक्तिगत वाचा-नाम सीधे प्रयुक्त है। हिंदी पाठकों में सुबोध और स्थापित रूप ‘यहोवा’ नाम को ‘प्रभु’ जैसी उपाधि से बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: מִשְׁפָּטִים का विधिक आशय
  choice: न्याय-विधान
  alternative: नियम; न्यायनिर्णय
  rationale: यह बहुवचन सिनाई की वाचा के कानूनी प्रावधानों की ओर संकेत करता है। संयुक्त पद मूल के न्यायिक अर्थ और संदर्भगत विधिक अर्थ को किसी एक संकीर्ण विकल्प में सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। वाक्य-विन्यास को हिंदी की स्वाभाविक लय के अनुसार दो वाक्यों में रखा गया है और लोगों की एकमत प्रतिज्ञा को प्रत्यक्ष कथन में सुरक्षित किया गया है।
