base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/008.yaml
  text: Then Moses took the blood and threw it on the people[a], and said, “Behold[b], the blood of the covenant that Yahweh has made with you concerning all these words.”
translation:
  language: hi
  text: तब मूसा ने लहू लिया और उसे लोगों पर फेंक दिया[a], और कहा, “देखो, यह उस वाचा का लहू है जो याहवे ने तुम्हारे साथ इन सब वचनों के अनुसार बाँधी है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसे लोगों पर छिड़क दिया।” इब्रानी क्रिया का अधिक शाब्दिक अर्थ “फेंकना” या “उछालना” है, पर बलिदानी प्रसंगों में यह लहू को विधिपूर्वक छिड़कने या लगाने का वर्णन कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: लिया
  rationale: לקח का सामान्य कथात्मक अर्थ ‘लेना’ है; प्रसंग में मूसा द्वारा पहले उल्लिखित बलिदानी लहू लेने की क्रिया है।
- source_word: הַדָּם
  choice: वह लहू
  rationale: निश्चित उपपद पहले उल्लिखित बलिदानी लहू की ओर संकेत करता है; ‘वह’ हिंदी में इस संदर्भगत निश्चितता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיִּזְרֹק
  choice: छिड़क दिया
  rationale: זרק का मूल भाव फेंकना या उछालना है, किंतु बलिदानी अनुष्ठान में यह लहू को विधिपूर्वक डालने या छिड़कने का वर्णन करता है। मुख्य पाठ में स्वाभाविक अनुष्ठानिक हिंदी रखी गई और अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: עַל הָעָם
  choice: लोगों पर
  rationale: עַל का स्थानसूचक अर्थ यहाँ सीधे ‘पर’ है और הָעָם का स्वाभाविक सामूहिक हिंदी रूप ‘लोग’ है।
- source_word: הִנֵּה
  choice: देखो
  rationale: यह गंभीर प्रस्तुति की ओर ध्यान खींचने वाला निपात है; ‘देखो’ आधुनिक हिंदी में स्पष्ट और गरिमापूर्ण है।
- source_word: דַם הַבְּרִית
  choice: वाचा का लहू
  rationale: इब्रानी संबंध-रचना को निकटता से सुरक्षित रखता है और पद के महत्वपूर्ण वाचागत तथा बलिदानी संबंध को व्यक्त करता है।
- source_word: כָּרַת ... בְּרִית
  choice: वाचा ... बाँधी है
  rationale: शाब्दिक इब्रानी मुहावरा ‘वाचा काटना’ है, पर हिंदी में ‘वाचा बाँधना’ उसी अर्थ का स्वाभाविक और गरिमापूर्ण मुहावरा है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिंदी में प्रचलित नामरूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: עִמָּכֶם
  choice: तुम्हारे साथ
  rationale: द्वितीय पुरुष बहुवचन प्रत्यय का सहज हिंदी रूप; संबोधन की बहुवचनता संदर्भ से स्पष्ट है।
- source_word: עַל כָּל הַדְּבָרִים הָאֵלֶּה
  choice: इन सब वचनों के आधार पर
  rationale: यहाँ עַל वाचा को अभी कहे गए वचनों या शर्तों से जोड़ता है। ‘के आधार पर’ इस संबंध को स्पष्ट करता है और דְּבָרִים के लिए ‘वचन’ को बनाए रखता है।
theological_decisions:
- issue: כָּרַת ... בְּרִית वाचा-स्थापन मुहावरे का अनुवाद
  choice: वाचा ... बाँधी है
  alternative: वाचा ... काटी है; वाचा ... की है
  rationale: ‘काटना’ इब्रानी का शाब्दिक रूप है, पर हिंदी में अस्वाभाविक और भ्रमकारी हो सकता है। ‘वाचा बाँधना’ संधि-स्थापन का अर्थ और गंभीरता दोनों रखता है, जबकि बलिदानी संदर्भ पद में लहू से स्पष्ट रहता है।
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचागत नाम है। हिंदी पाठकों के लिए स्थापित देवनागरी नामरूप ‘यहोवा’ नाम को सुरक्षित रखता है और उसे उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं करता।
- issue: עַל כָּל הַדְּבָרִים הָאֵלֶּה द्वारा वाचा और वचनों का संबंध
  choice: इन सब वचनों के आधार पर
  alternative: इन सब वचनों के विषय में; इन सब वचनों के अनुसार
  rationale: यह पदबंध वाचा को पहले सुनाए गए वचनों से जोड़ता है। ‘के आधार पर’ उस आधारगत संबंध को व्यक्त करता है, बिना ‘वचनों’ को केवल कानूनी ‘शर्तें’ बनाकर अर्थ सीमित किए।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘लहू’ और ‘वाचा’ बाइबलीय संदर्भ में परिचित तथा गंभीर हैं; वाक्यरचना को अनावश्यक संस्कृतनिष्ठता से बचाया गया है।
