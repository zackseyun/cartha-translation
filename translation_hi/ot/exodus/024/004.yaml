  text: וַ/יִּכְתֹּ֣ב מֹשֶׁ֗ה אֵ֚ת כָּל דִּבְרֵ֣י יְהוָ֔ה וַ/יַּשְׁכֵּ֣ם בַּ/בֹּ֔קֶר וַ/יִּ֥בֶן מִזְבֵּ֖חַ תַּ֣חַת הָ/הָ֑ר וּ/שְׁתֵּ֤ים עֶשְׂרֵה֙ מַצֵּבָ֔ה לִ/שְׁנֵ֥ים עָשָׂ֖ר שִׁבְטֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/004.yaml
  text: And Moses wrote down all the words of Yahweh[a]. He rose early in the morning and built an altar at the foot of the mountain[b], and twelve pillars for the twelve tribes of Israel.
translation:
  language: hi
  text: मूसा ने याहवे[a] के सभी वचन लिखे। वह सुबह तड़के उठा और उसने पर्वत की तलहटी में[b] एक वेदी और इस्राएल के बारह गोत्रों के लिए बारह खड़े पत्थर बनाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में परमेश्वर का व्यक्तिगत नाम יהוה (YHWH) है, जिसका यहाँ लिप्यंतरण “याहवे” किया गया है।
    reason: divine_name
  - marker: b
    text: शाब्दिक रूप से, “पर्वत के नीचे”; अर्थात उसके आधार या तलहटी में।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: लिख लीं
  rationale: כתב का मूल अर्थ ‘लिखना’ है। ‘लिख लीं’ स्वाभाविक हिन्दी में पहले कही गई बातों को लिखित रूप देने का भाव व्यक्त करता है, बिना ‘दर्ज किया’ जैसी अतिरिक्त औपचारिकता जोड़े।
- source_word: דִּבְרֵי
  choice: बातें
  rationale: דבר यहाँ यहवे द्वारा कही गई समस्त वाणी को सूचित करता है। हिन्दी में ‘सारी बातें’ सहज है और केवल ‘आज्ञाएँ’ कहकर अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: יְהוָה
  choice: यहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित निकट लिप्यंतरण ‘यहवे’ से प्रस्तुत किया गया है।
- source_word: וַיַּשְׁכֵּם בַּבֹּקֶר
  choice: वह सुबह तड़के उठा
  rationale: שׁכם के हिफ़ील रूप का अर्थ तड़के उठना है और בַּבֹּקֶר सुबह का समय स्पष्ट करता है। यह वाक्यांश दोनों तत्वों को स्वाभाविक हिन्दी में रखता है।
- source_word: וַיִּבֶן מִזְבֵּחַ
  choice: एक वेदी बनाई
  rationale: בנה और מזבח का सीधा तथा स्वाभाविक हिन्दी रूप ‘वेदी बनाई’ है।
- source_word: תַּחַת הָהָר
  choice: पहाड़ की तलहटी में
  rationale: शाब्दिक अर्थ ‘पहाड़ के नीचे’ है, पर इस स्थान-संदर्भ में आशय पहाड़ के आधार या तलहटी का है।
- source_word: וּשְׁתֵּים עֶשְׂרֵה מַצֵּבָה
  choice: बारह खड़े पत्थर स्थापित किए
  rationale: מַצֵּבָה खड़ा किया हुआ पत्थर या स्तंभ है। ‘खड़े पत्थर’ वस्तु का ठोस अर्थ बचाता है और ‘स्थापित किए’ उसके खड़ा किए जाने को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לִשְׁנֵים עָשָׂר שִׁבְטֵי יִשְׂרָאֵל
  choice: इस्राएल के बारह गोत्रों के लिए
  rationale: ל यहाँ संबंध, अनुरूपता या प्रतिनिधित्व बताता है। ‘के लिए’ मूल की संक्षिप्तता बनाए रखते हुए इस संबंध को व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: पाठ में व्यक्तिगत वाचा-नाम יְהוָה है। ‘यहवे’ नाम को नाम के रूप में सुरक्षित रखता है; ‘प्रभु’ उसे उपाधि में बदल देता, जबकि ‘यहोवा’ एक वैकल्पिक पारंपरिक स्वरांकन है।
- issue: बारह מַצֵּבָה का स्वरूप
  choice: बारह खड़े पत्थर
  alternative: बारह स्तंभ
  rationale: मूल शब्द पत्थर के खड़े स्मारक या स्तंभ दोनों अर्थ दे सकता है। मुख्य पाठ में ठोस और कम स्थापत्यपरक ‘खड़े पत्थर’ रखा गया है तथा विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘गोत्र’, ‘वेदी’ और ‘यहवे’ जैसे बाइबिलीय पद अर्थ-सटीकता के लिए बनाए रखे गए हैं। मַצֵּבָה के लिए ‘खड़े पत्थर’ चुना गया है ताकि प्राचीन निकट-पूर्वी वस्तु को आधुनिक स्थापत्य-स्तंभ न समझा जाए।
