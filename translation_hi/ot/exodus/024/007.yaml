base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/007.yaml
  text: Then he took the Book of the Covenant and read it in the hearing of the people[a], and they said, “All that Yahweh has spoken we will do, and we will obey.”
translation:
  language: hi
  text: तब उसने वाचा की पुस्तक ली और लोगों को सुनाकर पढ़ी। उन्होंने कहा, “याहवे ने जो कुछ कहा है, वह सब हम करेंगे और सुनेंगे[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और आज्ञा मानेंगे।” इब्रानी क्रिया का अर्थ “सुनना/ध्यान देना” और वाचा के संदर्भ में “आज्ञा मानना” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: तब उसने … ली
  rationale: वाव-क्रमिक क्रिया कथा को आगे बढ़ाती है; ‘तब’ हिंदी में उसके क्रमिक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: סֵפֶר הַבְּרִית
  choice: वाचा की पुस्तक
  rationale: यह ठोस लिखित वाचा-दस्तावेज़ को दर्शाता है और हिंदी बाइबलीय भाषा में स्पष्ट तथा परिचित है।
- source_word: וַיִּקְרָא בְּאָזְנֵי הָעָם
  choice: लोगों को सुनाकर पढ़ी
  rationale: लिखित पुस्तक के संदर्भ में קרא का अर्थ ‘पढ़ना’ है, जबकि ‘लोगों के कानों में’ का स्वाभाविक हिंदी रूप सार्वजनिक रूप से ‘सुनाकर’ पढ़ना है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण किया गया है; इसके स्थान पर कोई उपाधि नहीं रखी गई।
- source_word: נַעֲשֶׂה
  choice: हम करेंगे
  rationale: עשה की व्यापक और ठोस क्रिया को बनाए रखता है; आज्ञापालन निहित है, पर उसे समय से पहले स्पष्ट नहीं करता।
- source_word: וְנִשְׁמָע
  choice: और सुनेंगे
  rationale: שׁמע के मूल श्रवण-अर्थ को बनाए रखता है, साथ ही वाचा के संदर्भ में निहित ‘आज्ञा मानना’ फुटनोट में दिया गया है।
theological_decisions:
- issue: वाचा के उत्तर וְנִשְׁמָע का अर्थ
  choice: और सुनेंगे
  alternative: और आज्ञा मानेंगे
  rationale: שׁמע का अर्थ ‘सुनना/ध्यान देना’ और संदर्भानुसार ‘आज्ञा मानना’ दोनों हो सकता है। निकट संदर्भ में वाचा की पुस्तक सुनाकर पढ़ी गई है, इसलिए मुख्य पाठ श्रवण-अर्थ को बनाए रखता है; वाचा-संबंधी आज्ञाकारिता का अर्थ फुटनोट में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘लोगों को सुनाकर पढ़ी’ इब्रानी मुहावरे का स्वाभाविक हिंदी रूप है। ‘करेंगे और सुनेंगे’ की कुछ असामान्य संरचना मूल पाठ की वास्तविक अर्थगत गहराई और तनाव को जानबूझकर बनाए रखती है।
