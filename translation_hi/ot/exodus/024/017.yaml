base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/017.yaml
  text: And the appearance of the glory of Yahweh was like a consuming fire on the top of the mountain in the sight of the sons of Israel[a][b].
translation:
  language: hi
  text: इस्राएलियों[b] की आँखों के सामने यहोवा की महिमा का दृश्य पर्वत की चोटी पर भस्म कर देने वाली आग[a] के समान था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “निगल जाने वाली आग के समान।”
    reason: lexical_alternative
  - marker: b
    text: या, “इस्राएल की संतान”; शाब्दिक, “इस्राएल के पुत्र।”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַרְאֵה
  choice: दृश्य
  rationale: यह शब्द यहाँ दिखाई देने वाले रूप या नज़ारे को बताता है; ‘दृश्य’ दृश्यता पर बल देता है और भविष्यसूचक दर्शन का अनावश्यक संकेत नहीं देता।
- source_word: כְּבוֹד
  choice: महिमा
  rationale: यहोवा की प्रत्यक्ष, तेजोमय उपस्थिति के संदर्भ में ‘महिमा’ स्वाभाविक और स्थापित हिन्दी रूप है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय प्रचलित हिन्दी लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है।
- source_word: כְּאֵשׁ אֹכֶלֶת
  choice: भस्म करने वाली आग के समान
  rationale: כְּ तुलना को स्पष्ट करता है और אֹכֶלֶת आग के लिए ‘खा जाने/भस्म कर देने’ का भाव रखता है; यह वाक्यांश उपमा और तीव्रता दोनों बनाए रखता है।
- source_word: בְּרֹאשׁ הָהָר
  choice: पर्वत की चोटी पर
  rationale: यह पर्वत के सबसे ऊपरी भाग पर स्थिति को सीधे और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְעֵינֵי
  choice: आँखों के सामने
  rationale: यह इब्रानी मुहावरे के दृश्य बल को बनाए रखता है और बताता है कि घटना उनके पूर्ण दृष्टिगोचर थी।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: यह सामूहिक जातीय पद का स्वाभाविक आधुनिक हिन्दी रूप है। संदर्भ पूरे इस्राएली समुदाय का है; शाब्दिक ‘इस्राएल के पुत्र’ हिन्दी में अनावश्यक रूप से केवल पुरुष वंशजों का संकेत दे सकता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: व्यक्तिगत वाचा-नाम को उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं किया गया। ‘यहोवा’ हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला लिप्यंतरण है।
- issue: בְּנֵי יִשְׂרָאֵל का सामूहिक अर्थ
  choice: इस्राएलियों
  alternative: इस्राएल के पुत्र; इस्राएल की संतान
  rationale: इब्रानी पद व्याकरणतः पुल्लिंग है, पर यहाँ पूरे वाचा-समुदाय का जातीय नाम है। ‘इस्राएलियों’ अर्थ और आधुनिक हिन्दी की स्वाभाविकता को सुरक्षित रखता है।
- issue: महिमा और आग के बीच संबंध
  choice: आग के समान
  alternative: महिमा स्वयं आग थी
  rationale: तुलनासूचक כְּ को सुरक्षित रखते हुए पाठ की उपमा बनाए रखी गई है; महिमा और आग को पूर्णतः एक नहीं माना गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य-क्रम हिन्दी की स्वाभाविकता के अनुसार बदला गया है, जबकि दृश्यता, स्थान और उपमा का मूल बल सुरक्षित है।
