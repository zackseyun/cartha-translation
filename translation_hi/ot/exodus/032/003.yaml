  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘छल्ले’ के साथ ‘कानों में पड़े’ मूल की शब्दगत व्यापकता और संदर्भगत स्पष्टता दोनों को बनाए रखता है। जोरपूर्वक उतारने की संभावित छाया हिन्दी के मुख्य पाठ में स्वाभाविक ढंग से व्यक्त नहीं होती; ‘नोचकर’ अनावश्यक रूप से निश्चित और तीव्र होता, इसलिए उसे नहीं अपनाया गया।
