    reason: lexical_alternative
  - marker: b
    text: या “सोने की बालियाँ।” यहाँ प्रयुक्त इब्रानी शब्द कान या नाक में पहने जाने वाले छल्लेनुमा आभूषण के लिए आ सकता है; इस संदर्भ में वे कानों में पहने हुए थे।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפָּרְקוּ
  choice: उतारकर
  rationale: हित्पाएल रूप अपने ऊपर पहने आभूषणों को स्वयं उतारने का भाव देता है। ‘उतारकर’ स्वाभाविक आधुनिक हिन्दी है; क्रिया में संभवतः निहित जोरपूर्वक अलग करने का भाव पादटिप्पणी में रखा गया है।
- source_word: כָּל הָעָם
  choice: सब लोगों ने
  rationale: यह एकत्र समुदाय को सामूहिक रूप से व्यक्त करता है और हिन्दी में सहज तथा सीधा है।
- source_word: נִזְמֵי הַזָּהָב
  choice: सोने के छल्ले
  rationale: נֶזֶם कान या नाक में पहना जाने वाला छल्लेनुमा आभूषण हो सकता है। अगला वाक्यांश कानों का स्थान स्पष्ट करता है, इसलिए ‘छल्ले’ मूल शब्द की व्यापकता बनाए रखता है।
- source_word: אֲשֶׁר בְּאָזְנֵיהֶם
  choice: अपने कानों में पड़े
  rationale: यह संबंधवाचक वाक्यांश छल्लों का स्थान बताता है। ‘कानों में पड़े’ आधुनिक हिन्दी में स्वाभाविक है और בְּ के स्थानसूचक अर्थ को व्यक्त करता है।
- source_word: וַיָּבִיאוּ אֶל אַהֲרֹן
  choice: हारून के पास ला दिए
  rationale: क्रिया का अर्थ लाना है; ‘उन्हें’ अलग से दोहराए बिना ‘ला दिए’ पूर्वोक्त छल्लों को स्वाभाविक रूप से संदर्भित करता है।
