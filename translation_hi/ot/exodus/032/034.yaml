  edition: WLC
  text: וְ/עַתָּ֞ה לֵ֣ךְ נְחֵ֣ה אֶת הָ/עָ֗ם אֶ֤ל אֲשֶׁר דִּבַּ֨רְתִּי֙ לָ֔/ךְ הִנֵּ֥ה מַלְאָכִ֖/י יֵלֵ֣ךְ לְ/פָנֶ֑י/ךָ וּ/בְ/י֣וֹם פָּקְדִ֔/י וּ/פָקַדְתִּ֥י עֲלֵי/הֶ֖ם חַטָּאתָֽ/ם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/034.yaml
  text: But now go, lead the people to where I have spoken to you. Look, my angel will go before you; but on the day when I call them to account, I will call them to account for their sin.
translation:
  language: hi
  text: पर अब जा, इन लोगों को वहाँ ले चल जहाँ जाने के विषय में मैंने तुझसे कहा था। देख, मेरा दूत तेरे आगे-आगे चलेगा। पर जिस दिन मैं उनसे हिसाब लूँगा, उस दिन उनके पाप के लिए उनसे हिसाब लूँगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נְחֵה
  choice: ले चल
  rationale: हिफ़ील आज्ञार्थक का नेतृत्व करके गंतव्य तक पहुँचाने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מַלְאָכִי
  choice: मेरा दूत
  rationale: מַלְאָךְ का मूल अर्थ ‘दूत’ है; यह अनावश्यक रूप से उसकी प्रकृति या पहचान तय नहीं करता।
- source_word: פָּקְדִי / וּפָקַדְתִּי
  choice: मैं लेखा लूँगा / मैं ... लेखा ... लूँगा
  rationale: פקד के संदर्भगत अर्थ—ध्यान देकर जवाबदेही ठहराना या दंड देना—को एक ही हिन्दी पदावली की पुनरावृत्ति से रखा गया है, जैसा इब्रानी में है।
theological_decisions:
- issue: ‘मेरे दूत’ की पहचान
  choice: मेरा दूत
  alternative: मेरा स्वर्गदूत
  rationale: पाठ स्वयं दूत की सटीक पहचान या प्रकृति स्पष्ट नहीं करता; ‘दूत’ उस अस्पष्टता को बनाए रखता है।
- issue: פקד में न्याय और दंड का संबंध
  choice: लेखा लेना
  alternative: दंड देना
  rationale: ‘लेखा लेना’ न्यायिक जवाबदेही को व्यक्त करता है और दंड को नकारे बिना क्रिया के व्यापक अर्थ को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। ईश्वर द्वारा मूसा को एकवचन संबोधन के कारण ‘तुझसे/तेरे’ रखा गया है। ‘देख’ הִנֵּה की ध्यान आकर्षित करने वाली भूमिका को संक्षेप में व्यक्त करता है।
