base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/005.yaml
  text: When Aaron saw it[a], he built an altar before it. Then Aaron proclaimed and said, “Tomorrow will be a feast to Yahweh.”
translation:
  language: hi
  text: 'जब हारून ने यह देखा, तब उसने उसके सामने[a] एक वेदी बनाई। फिर हारून ने यह घोषणा की: “कल याहवे के लिए एक पर्व होगा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हारून के सामने”; इब्रानी सर्वनाम व्याकरण की दृष्टि से हारून की ओर संकेत कर सकता है, यद्यपि संदर्भ में बछड़ा अधिक संभावित है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּרְא
  choice: जब हारून ने यह देखा
  rationale: क्रिया का अर्थ ‘देखा’ है; ‘यह’ का संदर्भ पिछले पद में बनाए गए बछड़े से स्वाभाविक रूप से जुड़ता है। आरंभिक क्रमवाचक रूप को हिंदी में समयसूचक ‘जब...तब’ से व्यक्त किया गया है।
- source_word: וַיִּבֶן מִזְבֵּחַ
  choice: उसने ... एक वेदी बनाई
  rationale: בנה और מזבח का सीधा, स्वाभाविक तथा धार्मिक संदर्भ के अनुकूल हिंदी रूप।
- source_word: לְפָנָיו
  choice: उसके सामने
  rationale: पुल्लिंग एकवचन सर्वनाम का सबसे संभावित संदर्भ सोने का बछड़ा है; हिंदी में ‘उसके’ मूल की व्याकरणिक अस्पष्टता को भी कुछ हद तक बनाए रखता है।
- source_word: וַיִּקְרָא ... וַיֹּאמַר
  choice: घोषणा करके कहा
  rationale: קרא यहाँ सार्वजनिक घोषणा को व्यक्त करता है, जबकि ויאמר को भी अलग से उपस्थित रखा गया है; इसलिए दोनों क्रियाओं का प्रतिनिधित्व किया गया है।
- source_word: חַג
  choice: पर्व
  rationale: חג उपासना-संबंधी उत्सव को सूचित करता है। ‘पर्व’ आधुनिक हिंदी में संक्षिप्त, गरिमापूर्ण और स्वाभाविक है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: ל समर्पण अथवा संबंध दर्शाता है; ‘के लिए’ इस घोषणा में सहज है। יהוה को उसके व्यक्तिगत वाचा-नाम ‘यहोवा’ से व्यक्त किया गया है।
- source_word: מָחָר
  choice: कल ... होगा
  rationale: इब्रानी नामवाचक वाक्य में निहित भविष्य भाव को हिंदी में स्पष्ट और स्वाभाविक बनाने के लिए ‘होगा’ जोड़ा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में चार-अक्षरीय व्यक्तिगत नाम सीधे आया है; ‘यहोवा’ हिंदी पाठक के लिए परिचित रूप में उस वाचा-नाम को सुरक्षित रखता है, न कि उसे किसी उपाधि से बदलता है।
- issue: לְפָנָיו में सर्वनाम का संदर्भ
  choice: वेदी बछड़े के सामने बनाई गई
  alternative: वेदी हारून के सामने बनाई गई
  rationale: व्याकरणतः प्रत्यय हारून की ओर भी संकेत कर सकता है, पर निकटवर्ती कथानक में अभी-अभी बनाए गए बछड़े को संदर्भ मानना अधिक संगत है। वास्तविक अस्पष्टता को पादटिप्पणी में दर्ज किया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘घोषणा करके कहा’ मूल की दोनों क्रियाओं को सुरक्षित रखता है; ‘पर्व’ धार्मिक उत्सव का स्वाभाविक हिंदी शब्द है।
