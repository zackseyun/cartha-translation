  text: וַ/יִּקַּ֞ח אֶת הָ/עֵ֨גֶל אֲשֶׁ֤ר עָשׂוּ֙ וַ/יִּשְׂרֹ֣ף בָּ/אֵ֔שׁ וַ/יִּטְחַ֖ן עַ֣ד אֲשֶׁר דָּ֑ק וַ/יִּ֨זֶר֙ עַל פְּנֵ֣י הַ/מַּ֔יִם וַ/יַּ֖שְׁקְ אֶת בְּנֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/020.yaml
  text: He took the calf that they had made[a], burned it with fire, ground it until it was fine, scattered it on the surface of the water, and made the sons of Israel drink it.
translation:
  language: hi
  text: उसने उस बछड़े को, जिसे उन्होंने बनाया था, लिया, उसे आग में जला दिया, उसे इतना पीसा कि वह बारीक हो गया, उसे पानी की सतह पर बिखेर दिया और इस्राएलियों को उसे पिला दिया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में पिलाई गई वस्तु अलग से व्यक्त नहीं है। संदर्भ में यह पानी पर बिखेरा गया पिसा हुआ पदार्थ है।
    reason: source_ambiguity
lexical_decisions:
- source_word: הָעֵגֶל
  choice: उस बछड़े को
  rationale: עֵגֶל का सामान्य अर्थ बछड़ा या कम उम्र का गोवंश है; इस प्रसंग में परिचित और स्वाभाविक पद ‘बछड़ा’ उपयुक्त है।
- source_word: אֲשֶׁר עָשׂוּ
  choice: जिसे उन्होंने बनाया था
  rationale: यह संबंधवाचक उपवाक्य उस बछड़े को लोगों द्वारा पहले बनाई गई वस्तु के रूप में पहचानता है; ‘बनाया था’ पूर्व क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיִּשְׂרֹף בָּאֵשׁ
  choice: आग में जला दिया
  rationale: क्रिया और בָּאֵשׁ का ठोस तथा स्वाभाविक हिन्दी रूप; धातु की मूर्ति जलाने से जुड़ी व्यावहारिक कठिनाई को पाठ स्वयं स्पष्ट नहीं करता, इसलिए अनुवाद भी उसे नहीं सुलझाता।
- source_word: וַיִּטְחַן עַד אֲשֶׁר דָּק
  choice: उसे इतना पीसा कि वह बारीक हो गया
  rationale: טחן पीसने और דק बारीक होने का बोध देता है; ‘चूर्ण’ जोड़ने की अपेक्षा यह मूल की अभिव्यक्ति के अधिक निकट है।
- source_word: וַיִּזֶר
  choice: बिखेर दिया
  rationale: यहाँ पिसे हुए अवशेष को पानी पर फैलाने का अर्थ है; ‘बिखेर दिया’ आधुनिक हिन्दी में स्पष्ट है और अनावश्यक रूप से ‘फटकना’ निर्दिष्ट नहीं करता।
- source_word: עַל פְּנֵי הַמַּיִם
  choice: पानी की सतह पर
  rationale: פְּנֵי के ‘मुख/सतह’ वाले चित्र को सहज हिन्दी में बनाए रखता है।
- source_word: וַיַּשְׁקְ אֶת בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों को वह पानी पिला दिया
  rationale: שׁקה का हिफ़ील रूप कारणवाचक है, इसलिए ‘पिला दिया’ उचित है। हिन्दी में ‘इस्राएली’ पूरे समुदाय के लिए स्वाभाविक सामूहिक संबोधन है। ‘वह पानी’ निकटवर्ती जल को स्पष्ट करता है; मूल में प्रत्यक्ष कर्म लोगों को दर्शाता है, किसी अलग ‘उसे’ को नहीं।
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל का सामुदायिक अर्थ
  choice: इस्राएलियों
  alternative: इस्राएल के पुत्रों
  rationale: शाब्दिक रूप ‘इस्राएल के पुत्र’ है, किंतु यह मानक वाचा-संबंधी सामुदायिक पद पूरे इस्राएली समुदाय को दर्शाता है। आधुनिक हिन्दी में ‘इस्राएलियों’ वही अर्थ स्वाभाविक ढंग से देता है और केवल पुरुष संतानों तक अर्थ सीमित करने से बचाता है।
- issue: पिलाई गई वस्तु की अभिव्यक्ति
  choice: वह पानी पिला दिया
  alternative: उन्हें पिलाया
  rationale: हिब्रू कारणवाचक क्रिया का प्रत्यक्ष कर्म ‘इस्राएल के पुत्र’ हैं और पी जाने वाली वस्तु अलग से व्यक्त नहीं है। प्रसंग के निकटवर्ती ‘पानी’ को हिन्दी में दोहराना अर्थ स्पष्ट करता है, जबकि ‘बछड़ा पिलाया’ जैसी भ्रामक व्याख्या से बचाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कथात्मक शैली। क्रियाओं का क्रम सुरक्षित रखा गया है। कोई पादटिप्पणी आवश्यक नहीं मानी गई, इसलिए मुख्य पाठ में कोई पादटिप्पणी-चिह्न नहीं है।
