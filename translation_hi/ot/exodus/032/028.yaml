  alternative: लगभग तीन हज़ार पुरुष मारे गए
  rationale: इब्रानी पाठ ‘मारना’ की स्पष्ट क्रिया के बजाय ‘गिरना’ की रूढ़ अभिव्यक्ति इस्तेमाल करता है। चुना हुआ रूप मृत्यु का गंभीर भाव बनाए रखता है और मूल से अधिक कारणगत विशिष्टता नहीं जोड़ता।
