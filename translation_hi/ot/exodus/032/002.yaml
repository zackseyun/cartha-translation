  text: וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ אַהֲרֹ֔ן פָּֽרְקוּ֙ נִזְמֵ֣י הַ/זָּהָ֔ב אֲשֶׁר֙ בְּ/אָזְנֵ֣י נְשֵׁי/כֶ֔ם בְּנֵי/כֶ֖ם וּ/בְנֹתֵי/כֶ֑ם וְ/הָבִ֖יאוּ אֵלָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/002.yaml
  text: And Aaron said to them[a], “Take off the rings of gold that are in the ears of your wives, your sons, and your daughters, and bring them to me.”
translation:
  language: hi
  text: तब हारून ने उनसे कहा, “तुम्हारी पत्नियों, बेटों और बेटियों के कानों में जो सोने के कुंडल हैं, उन्हें उतार लो[a] और मेरे पास ले आओ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उन्हें तोड़कर निकाल लो।” इब्रानी क्रिया आभूषणों को बलपूर्वक खींचकर उतारने या तोड़कर निकालने का भाव भी दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; आधुनिक हिन्दी में ‘तब’ स्वाभाविक रूप से क्रम व्यक्त करता है, बिना अतिरिक्त कारणात्मक अर्थ जोड़े।
- source_word: אֲלֵהֶם
  choice: उनसे
  rationale: इब्रानी का स्पष्ट सर्वनाम सुरक्षित रखा गया है; उसकी जगह व्याख्यात्मक रूप से ‘लोगों से’ नहीं रखा गया।
- source_word: אַהֲרֹן
  choice: हारून
  rationale: नाम का प्रचलित हिन्दी बाइबलीय रूप अपनाया गया है।
- source_word: פָּרְקוּ
  choice: उतार लो
  rationale: संदर्भ में शरीर पर पहने आभूषण हटाने का स्वाभाविक हिन्दी रूप है। क्रिया में संभव अधिक बलपूर्ण अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: נִזְמֵי הַזָּהָב
  choice: सोने के कुंडल
  rationale: נֶזֶם संदर्भ के अनुसार नथ या कान का कुंडल हो सकता है; अगला वाक्यांश कानों का उल्लेख करता है, इसलिए ‘कुंडल’ स्पष्ट और स्वाभाविक है। ‘सोने के’ पदार्थ को ठीक प्रकार व्यक्त करता है।
- source_word: אֲשֶׁר בְּאָזְנֵי
  choice: कानों में जो ... हैं
  rationale: בְּ का स्थानसूचक अर्थ ‘में’ से सीधे व्यक्त हुआ है और हिन्दी वाक्य-विन्यास में संबंधवाचक उपवाक्य स्वाभाविक रखा गया है।
- source_word: נְשֵׁיכֶם
  choice: तुम्हारी पत्नियों
  rationale: घरेलू संबंधों की सूची में ‘पत्नियाँ’ सबसे संभावित अर्थ है; सामान्य ‘स्त्रियाँ’ की अपेक्षा संबंधसूचक अर्थ सुरक्षित रहता है।
- source_word: בְּנֵיכֶם וּבְנֹתֵיכֶם
  choice: बेटों और बेटियों
  rationale: मूल में पुत्र और पुत्रियाँ अलग-अलग स्पष्ट हैं; हिन्दी में वही लैंगिक विशिष्टता रखी गई है।
- source_word: וְהָבִיאוּ אֵלָי
  choice: और मेरे पास ले आओ
  rationale: आज्ञार्थक क्रिया और אֵלַי की दिशा दोनों स्वाभाविक हिन्दी में व्यक्त हैं; कर्म ‘उन्हें’ पिछले ‘कुंडल’ की ओर स्पष्ट संकेत करता है।
