base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/004.yaml
  text: And he took it from their hands and fashioned it with a graving tool[a], and he made it into a cast calf. Then they said, “These are your gods, Israel[d][c][b], who brought you up from the land of Egypt.”
translation:
  language: hi
  text: उसने उनके हाथों से वह सोना लिया और उसे नक्काशी के औज़ार से गढ़ा[a], और उससे एक ढला हुआ बछड़ा बनाया। तब वे बोले[b], “हे इस्राएल, ये तेरे देवता हैं[c], जो तुझे मिस्र देश से ऊपर ले आए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उकेरने के औज़ार से,” “लेखनी से,” अथवा “छेनी से”; यहाँ प्रयुक्त इब्रानी शब्द का ठीक अर्थ विवादित है।
    reason: lexical_alternative
  - marker: b
    text: कुछ प्राचीन पाठ-परंपराओं में “वह बोला” है।
    reason: textual_variant
  - marker: c
    text: 'इब्रानी में बहुवचन है: “ये तेरे देवता हैं”; एक ही बछड़े के कारण परंपरागत अनुवादों में प्रायः “यह तेरा देवता है” मिलता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקַּח מִיָּדָם
  choice: उसने उनके हाथों से वह सोना लिया
  rationale: לקח का सीधा अर्थ ‘लेना’ है। पिछले पद के संदर्भ से कर्म सोना है; हिन्दी में ‘वह सोना’ स्पष्ट और स्वाभाविक है, जबकि ‘उनके हाथों से’ इब्रानी बहुवचन को बनाए रखता है।
- source_word: וַיָּצַר אֹתוֹ בַּחֶרֶט
  choice: उसे नक्काशी के औज़ार से आकार दिया
  rationale: יצר कारीगरी से आकार देने को व्यक्त करता है। חֶרֶט का ठीक आशय विवादित है, इसलिए मुख्य पाठ में सामान्य ‘नक्काशी का औज़ार’ और पादटिप्पणी में विकल्प दिए गए हैं।
- source_word: וַיַּעֲשֵׂהוּ עֵגֶל מַסֵּכָה
  choice: इस प्रकार उसने उसे ढालकर बछड़ा बनाया
  rationale: עגל ‘बछड़ा’ और מסכה धातु ढालकर बनी वस्तु या प्रतिमा है। ‘ढालकर बछड़ा बनाया’ निर्माण-विधि और परिणामी रूप दोनों को स्वाभाविक हिन्दी में व्यक्त करता है; ‘इस प्रकार’ इब्रानी के क्रमिक वाक्यों को तकनीकी प्रक्रिया का अत्यधिक कठोर क्रम बनाए बिना जोड़ता है।
- source_word: וַיֹּאמְרוּ
  choice: तब वे बोले
  rationale: WLC का क्रियारूप बहुवचन है। कुछ परंपराओं के एकवचन पाठ को मुख्य पाठ में न अपनाकर पादटिप्पणी में रखा गया है।
- source_word: אֵלֶּה אֱלֹהֶיךָ יִשְׂרָאֵל
  choice: हे इस्राएल, ये तेरे देवता हैं
  rationale: אֵלֶּה और אֱלֹהֶיךָ रूपतः बहुवचन हैं। एक ही बछड़े के कारण उत्पन्न तनाव को एकवचन करके दूर नहीं किया गया। सम्बोधन को स्वाभाविक हिन्दी के लिए आगे रखा गया है।
- source_word: אֲשֶׁר הֶעֱלוּךָ מֵאֶרֶץ מִצְרָיִם
  choice: जो तुझे मिस्र देश से निकाल लाए
  rationale: עלה का हिफ़ील मूलतः ‘ऊपर ले आना’ है, पर निर्गमन के प्रसंग में आधुनिक हिन्दी में ‘निकाल लाना’ स्वाभाविक और अर्थनिष्ठ है। बहुवचन ‘लाए’ निकटवर्ती बहुवचन ‘देवता’ तथा इब्रानी क्रियारूप के अनुरूप है।
theological_decisions:
- issue: मूर्ति की घोषणा में बहुवचन अथवा एकवचन
  choice: “ये तेरे देवता हैं”
  alternative: “यह तेरा परमेश्वर/देवता है”
  rationale: मसोरेटिक पाठ में संकेतवाचक, संज्ञा-रूप और आगे की क्रिया बहुवचन हैं। एक बछड़े के साथ इस व्याकरणिक बहुवचन से पैदा होने वाले तनाव को सुरक्षित रखा गया है।
- issue: प्रतिमा बनाने में हारून की भूमिका
  choice: दोनों निर्माण-क्रियाओं का कर्ता हारून ही रखा गया
  alternative: केवल सोना लेने या काम की निगरानी करने का संकेत देना
  rationale: इब्रानी की एकवचन क्रियाएँ सीधे उसी कर्ता को सोना लेने, आकार देने और बनाने का कार्य सौंपती हैं; उसकी भूमिका को नरम नहीं किया गया।
- issue: אֱלֹהֶיךָ के लिए हिन्दी धार्मिक पद
  choice: देवता
  alternative: परमेश्वर
  rationale: इस मूर्तिपूजक घोषणा में बहुवचन को स्पष्ट रखने के लिए ‘देवता’ उपयुक्त है। ‘परमेश्वर’ आधुनिक हिन्दी में प्रायः एकवचन और विशिष्ट ईश्वर का बोध देता है तथा स्रोत की जानबूझकर बनी बहुवचनता को धुंधला कर सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘तेरे/तुझे’ बाइबिलीय प्रत्यक्ष सम्बोधन की एकवचनता को स्पष्ट करता है। मुख्य पाठ स्रोत-क्रम को पर्याप्त रूप से बनाए रखता है, पर ‘इस प्रकार’ द्वारा इब्रानी पराटैक्सिस को स्वाभाविक हिन्दी में जोड़ा गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
