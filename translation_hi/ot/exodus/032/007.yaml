reference: Exodus 32:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֑ה לֶךְ רֵ֕ד כִּ֚י שִׁחֵ֣ת עַמְּ/ךָ֔ אֲשֶׁ֥ר הֶעֱלֵ֖יתָ מֵ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/007.yaml
  text: Then Yahweh said to Moses[a], “Go down, because your people, whom you brought up from the land of Egypt, have corrupted themselves.”
translation:
  language: hi
  text: तब याहवे ने मूसा से कहा, “जाओ, नीचे उतरो, क्योंकि तुम्हारे लोग, जिन्हें तुम मिस्र देश से निकालकर ऊपर ले आए हो, अपने को भ्रष्ट कर चुके हैं[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भ्रष्ट आचरण किया है।” इब्रानी क्रिया का अनुवाद इस प्रकार भी हो सकता है कि अपने को भ्रष्ट करने के बजाय भ्रष्ट व्यवहार पर बल पड़े।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: तब ... कहा
  rationale: वाव-क्रम कथा को आगे बढ़ाता है; आधुनिक हिन्दी में ‘तब’ स्वाभाविक कथात्मक प्रवाह देता है, और ‘कहा’ वाणी का सहज रूप है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी पाठ में प्रयुक्त परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: לֶךְ רֵד
  choice: जाओ, नीचे उतरो
  rationale: दोनों आज्ञार्थक रूपों—‘जाओ’ और ‘उतरो’—को रखते हुए आदेश की तत्परता और इब्रानी अभिव्यक्ति की संरचना सुरक्षित की गई है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ यह शब्द नीचे उतरने की आज्ञा का कारण बताता है।
- source_word: שִׁחֵת
  choice: अपने को भ्रष्ट कर चुके हैं
  rationale: सन्दर्भ में क्रिया लोगों के मूर्तिपूजक आचरण से उत्पन्न नैतिक आत्म-भ्रष्टता को व्यक्त करती है; पूर्णता का भाव ‘कर चुके हैं’ से प्रकट होता है।
- source_word: עַמְּךָ
  choice: तुम्हारे लोग
  rationale: ‘लोग’ सामूहिक संज्ञा का स्वाभाविक हिन्दी रूप है। ‘तुम्हारे’ को बनाए रखने से मूसा को संबोधित करते समय प्रयुक्त अर्थपूर्ण स्वामित्व-सूचक भाषा सुरक्षित रहती है।
- source_word: אֲשֶׁר הֶעֱלֵיתָ
  choice: जिन्हें तुम ... निकालकर ऊपर ले आए हो
  rationale: यह सम्बन्धवाचक उपवाक्य लोगों की पहचान निर्गमन की घटना से कराता है; ‘ऊपर ले आए’ העלה की दिशा को बनाए रखता है।
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: मिस्र देश से
  rationale: यह इब्रानी के ‘मिस्र की भूमि से’ का स्वाभाविक और संक्षिप्त आधुनिक हिन्दी रूप है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम सीधे आया है; ‘याहवे’ उसे उपाधि में बदले बिना प्रस्तुत करता है।
- issue: שִׁחֵת में निहित आत्मवाचक अथवा आचरणपरक अर्थ
  choice: अपने को भ्रष्ट कर चुके हैं
  alternative: भ्रष्ट आचरण किया है; भ्रष्ट हो गए हैं
  rationale: मुख्य पाठ आत्म-भ्रष्टता और लोगों की उत्तरदायिता को व्यक्त करता है, जबकि पादटिप्पणी उस सम्भव अर्थ को सुरक्षित रखती है जिसमें बल उनके भ्रष्ट आचरण पर है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सम्मानसूचक बहुवचन संबोधन (‘तुम’, ‘जाओ’, ‘उतरो’) अपनाया गया है। भाषा सरल, वर्तमान और गरिमापूर्ण रखी गई है; मूल की पुनरुक्त आज्ञार्थक संरचना तथा ‘तुम्हारे लोग’ का अलंकारिक तनाव सुरक्षित है।
