  text: וַ/יַּ֣רְא הָ/עָ֔ם כִּֽי בֹשֵׁ֥שׁ מֹשֶׁ֖ה לָ/רֶ֣דֶת מִן הָ/הָ֑ר וַ/יִּקָּהֵ֨ל הָ/עָ֜ם עַֽל אַהֲרֹ֗ן וַ/יֹּאמְר֤וּ אֵלָי/ו֙ ק֣וּם עֲשֵׂה לָ֣/נוּ אֱלֹהִ֗ים אֲשֶׁ֤ר יֵֽלְכוּ֙ לְ/פָנֵ֔י/נוּ כִּי זֶ֣ה מֹשֶׁ֣ה הָ/אִ֗ישׁ אֲשֶׁ֤ר הֶֽעֱלָ֨/נוּ֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם לֹ֥א יָדַ֖עְנוּ מֶה הָ֥יָה לֽ/וֹ־־־׀־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/001.yaml
  text: When the people saw that Moses was taking a long time to come down from the mountain[a], the people gathered around Aaron and said to him, “Get up, make gods for us that will go before us, because this Moses, the man who brought us up from the land of Egypt—we do not know what has happened to him.”
translation:
  language: hi
  text: जब लोगों ने देखा कि मूसा को पहाड़ से नीचे आने में बहुत देर हो रही थी, तो वे हारून के पास इकट्ठे हुए और उससे बोले, “उठ, हमारे लिए ऐसे देवता बना जो हमारे आगे-आगे चलें[a], क्योंकि यह मूसा, वह आदमी जो हमें मिस्र देश से निकाल लाया था—हम नहीं जानते कि उसके साथ क्या हुआ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हमारे लिए एक ऐसा देवता बना जो हमारे आगे-आगे चले।” आगे की कथा एक ही बछड़े की प्रतिमा पर केंद्रित है, इसलिए कुछ लोग यहाँ אֱלֹהִים को एकवचन अर्थ में समझते हैं; किंतु हिब्रू में इसका रूप और इसके बाद आने वाली क्रिया, दोनों बहुवचन हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: בֹשֵׁשׁ
  choice: बहुत देर हो रही है
  rationale: यह क्रिया मूसा के विलंब को लोगों की दृष्टि से व्यक्त करती है; यह आधुनिक हिन्दी में स्वाभाविक है और अनावश्यक रूप से यह संकेत नहीं देती कि मूसा ने जानबूझकर देर की।
- source_word: לָרֶדֶת מִן הָהָר
  choice: पहाड़ से नीचे आने में
  rationale: दिशात्मक अर्थ और स्रोत के संबंध को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: וַיִּקָּהֵל ... עַל אַהֲרֹן
  choice: हारून के पास इकट्ठे हुए
  rationale: עַל यहाँ हारून के संबंध में भीड़ के जमा होने और उस पर दबाव डालने का दृश्य प्रस्तुत करता है; 'पास' स्वाभाविक है और 'विरुद्ध' कहकर शत्रुता को आवश्यकता से अधिक स्पष्ट नहीं करता।
- source_word: קוּם
  choice: उठ
  rationale: एकवचन आज्ञार्थक का अचानक और दबावपूर्ण स्वर बनाए रखता है।
- source_word: עֲשֵׂה לָנוּ
  choice: हमारे लिए ... बना
  rationale: लाभार्थक לָנוּ को स्पष्ट रूप से व्यक्त करता है।
- source_word: אֱלֹהִים אֲשֶׁר יֵלְכוּ
  choice: ऐसे देवता ... जो ... चलें
  rationale: संज्ञा रूपात्मक रूप से बहुवचन है और उसके साथ प्रयुक्त क्रिया יֵלְכוּ भी बहुवचन है; हिन्दी में 'देवता' का रूप संदिग्ध हो सकता है, इसलिए 'ऐसे' और बहुवचन क्रिया 'चलें' बहुवचन अर्थ स्पष्ट करते हैं।
- source_word: לְפָנֵינוּ
  choice: हमारे आगे-आगे
  rationale: नेतृत्व करते हुए आगे चलने के भाव को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: זֶה מֹשֶׁה הָאִישׁ
  choice: यह मूसा, वह आदमी
  rationale: मूल के संकेतवाचक और समानाधिकरण को बनाए रखता है तथा लोगों के उपेक्षापूर्ण स्वर को उभरने देता है।
- source_word: הֶעֱלָנוּ מֵאֶרֶץ מִצְרַיִם
  choice: हमें मिस्र देश से निकाल लाया था
  rationale: निर्गमन के संदर्भ में causative 'ऊपर लाने' का लक्ष्य-भाषा में स्वाभाविक अर्थ देता है; 'मिस्र देश' मूल के 'मिस्र की भूमि' को संक्षिप्त, प्रचलित रूप में व्यक्त करता है।
- source_word: מֶה הָיָה לוֹ
  choice: उसके साथ क्या हुआ
  rationale: हिब्रू मुहावरे का सीधा और समकालीन हिन्दी समतुल्य है।
theological_decisions:
- issue: אֱלֹהִים को यहाँ एकवचन माना जाए या बहुवचन
  choice: 'बहुवचन: “देवता”'
  alternative: 'एकवचन: “एक देवता”'
  rationale: 'निकटवर्ती व्याकरण बहुवचन का समर्थन करता है: אֱלֹהִים रूप में बहुवचन है और संबंधवाचक उपवाक्य की क्रिया יֵלְכוּ भी बहुवचन है। आगे कथा में एक ही बछड़े की प्रतिमा पर ध्यान होने के कारण एकवचन समझना संभव है, इसलिए उस पाठ को पादटिप्पणी में रखा गया है।'
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। भीड़ का दबाव आज्ञार्थक “उठ” में बना रहता है। बहुवचन को स्पष्ट करने के लिए “ऐसे देवता ... जो ... चलें” रखा गया है, जबकि एकवचन की वास्तविक व्याख्यात्मक संभावना पादटिप्पणी में सुरक्षित है।
