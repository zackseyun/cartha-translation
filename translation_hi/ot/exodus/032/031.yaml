base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/031.yaml
  text: Then Moses returned to Yahweh and said[a], “Please, this people has sinned a great sin, and they have made gods of gold for themselves.”
translation:
  language: hi
  text: तब मूसा याहवे के पास लौट गया और बोला, “कृपया, इस प्रजा ने बड़ा पाप किया है; उन्होंने अपने लिए सोने के देवता बनाए हैं।[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उन्होंने अपने लिए सोने का एक देवता बनाया है।” हिब्रू में शाब्दिक रूप से “सोने के देवता” (बहुवचन) है, हालांकि व्यापक प्रसंग में सोने के बछड़े के कारण कुछ लोग इसे एकवचन अर्थ में समझते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: लौटकर
  rationale: שׁוב का यह रूप मूसा के प्रजा के पास से यहवे के पास वापस जाने को दर्शाता है; ‘लौटकर’ स्वाभाविक और संक्षिप्त है।
- source_word: אֶל יְהוָה
  choice: यहवे के पास
  rationale: אֶל दिशा/गंतव्य बताता है, और יְהוָה को उसके वाचा-संबंधी नाम ‘यहवे’ से लिप्यंतरित किया गया है।
- source_word: אָנָּא
  choice: कृपा करके सुनिए
  rationale: यह विनय और अनुनय का कण है। हिंदी में केवल ‘कृपया’ की अपेक्षा यह वाक्यांश मूसा की निवेदनपूर्ण पुकार को अधिक स्वाभाविक रूप से व्यक्त करता है।
- source_word: חָטָא הָעָם הַזֶּה חֲטָאָה גְדֹלָה
  choice: इस प्रजा ने बड़ा पाप किया है
  rationale: ‘इस प्रजा’ सामूहिक एकवचन को बनाए रखता है। धातु और सजातीय संज्ञा की पुनरुक्ति को अस्वाभाविक ढंग से दोहराने के बजाय ‘बड़ा पाप किया है’ उसकी तीव्रता और अर्थ को स्पष्ट हिंदी में व्यक्त करता है।
- source_word: וַיַּעֲשׂוּ לָהֶם
  choice: उन्होंने अपने लिए ... बनाए हैं
  rationale: לָהֶם का आत्मसंबंधी/हितार्थक भाव ‘अपने लिए’ से सुरक्षित रहता है।
- source_word: אֱלֹהֵי זָהָב
  choice: सोने के देवता
  rationale: हिब्रू रूप व्याकरणतः बहुवचन construct है; इसलिए व्यापक प्रसंग में एक बछड़ा होने के बावजूद मुख्य पाठ में बहुवचन रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुरक्षरीय वाचा-नाम सीधे आया है। ‘यहवे’ उसे उपाधि से बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: אֱלֹהֵי זָהָב की वचन-संख्या
  choice: सोने के देवता
  alternative: सोने का देवता
  rationale: मूल हिब्रू में रूप बहुवचन है, जबकि निकटवर्ती कथा सोने के एक बछड़े पर केंद्रित है। मुख्य पाठ मूल की संख्या बनाए रखता है और प्रसंगानुकूल एकवचन संभावना को पाद-टिप्पणी में देता है।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रूप। मूसा की विनती का भाव बनाए रखा गया है और हिब्रू बहुवचन से उत्पन्न वास्तविक अस्पष्टता को पाद-टिप्पणी में स्पष्ट किया गया है।
