base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/029.yaml
  text: And Moses said, “Today ordain yourselves to the LORD, for each man has been against his son and against his brother, so that he may bestow a blessing on you today.”
translation:
  language: hi
  text: तब मूसा ने कहा, “आज अपने आपको यहोवा के लिए समर्पित करो, क्योंकि तुममें से हर एक अपने बेटे और अपने भाई के विरुद्ध खड़ा हुआ है, ताकि आज तुम पर आशीष दी जाए।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִלְאוּ יֶדְכֶם
  choice: अपने आपको ... सेवा के लिए समर्पित करो
  rationale: शाब्दिक मुहावरा ‘अपना हाथ भरो’ याजकीय नियुक्ति अथवा अधिकार-सौंपने को सूचित करता है, पर आधुनिक हिन्दी में अस्पष्ट होगा। यहाँ लेवियों को यहोवा के प्रति औपचारिक समर्पण का आह्वान है; इसीलिए अर्थ को स्वाभाविक हिन्दी में व्यक्त किया गया।
- source_word: לַיהוָה
  choice: यहोवा की सेवा के लिए
  rationale: לְ संबंध और उद्देश्य दोनों व्यक्त कर सकता है। नियुक्ति-संबंधी मुहावरे के साथ ‘यहोवा की सेवा के लिए’ सहज और प्रसंगानुकूल है; दिव्य नाम को ‘यहोवा’ के रूप में रखा गया।
- source_word: כִּי אִישׁ בִּבְנוֹ וּבְאָחִיו
  choice: क्योंकि तुममें से हर एक अपने बेटे और अपने भाई के विरुद्ध हुआ है
  rationale: खंडित इब्रानी वाक्य में पूर्ववर्ती कार्रवाई निहित है। בְּ को प्रसंग के अनुसार विरोधात्मक अर्थ में लिया गया और संबंधों की कठोरता को नरम नहीं किया गया।
- source_word: וְלָתֵת עֲלֵיכֶם הַיּוֹם בְּרָכָה
  choice: ताकि वह आज तुम्हें आशीष दे
  rationale: उद्देश्य/परिणाम बताने वाले infinitive को ‘ताकि’ से व्यक्त किया। एकवचन निहित कर्ता को निकटतम धर्मवैज्ञानिक संदर्भ में यहोवा माना गया, जैसा पारंपरिक वाक्य-विन्यास संकेत करता है।
theological_decisions:
- issue: समर्पण/अभिषेक और हिंसक आज्ञाकारिता का संबंध
  choice: 'आयत के कारणात्मक तनाव को यथावत रखा: निकट संबंधियों के विरुद्ध होने के बाद यहोवा के लिए समर्पण और आशीष।'
  alternative: वाक्य को केवल सामान्य याजकीय अभिषेक के आदेश के रूप में प्रस्तुत करना और पिछले कार्य से संबंध हल्का करना।
  rationale: मूल पाठ כִּי और उद्देश्यसूचक וְלָתֵת के द्वारा इन विचारों को जोड़ता है; अनुवाद को इस कठिन धर्मवैज्ञानिक संबंध को मिटाना नहीं चाहिए।
- issue: आशीष देने वाला कौन है
  choice: ‘वह’ रखा गया, जिसका स्वाभाविक संदर्भ यहोवा है।
  alternative: ‘यहोवा’ को दोहराना या मूसा को कर्ता मानना।
  rationale: इब्रानी में कर्ता स्पष्ट रूप से दोहराया नहीं गया। ‘वह’ मूल की कुछ व्याकरणिक अंतर्निहितता बचाते हुए हिन्दी में अर्थपूर्ण है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘अपना हाथ भरो’ जैसे अस्वाभाविक शाब्दिक मुहावरे के स्थान पर प्रसंगगत अर्थ दिया गया है, जबकि बेटे और भाई के विरुद्ध होने की कठोरता तथा आशीष से उसका संबंध सुरक्षित रखा गया है।
