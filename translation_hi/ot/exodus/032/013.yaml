base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/013.yaml
  text: Remember Abraham[a], Isaac, and Israel, your servants, to whom you swore by yourself and said to them, ‘I will multiply your offspring like the stars of the heavens, and all this land that I have spoken of I will give to your offspring, and they shall inherit it forever.’
translation:
  language: hi
  text: अपने सेवकों अब्राहम[a], इसहाक और इस्राएल को स्मरण कर, जिनसे तूने अपनी ही शपथ खाकर कहा था, ‘मैं तुम्हारे वंश को आकाश के तारों के समान बढ़ाऊँगा, और यह सारा देश, जिसके बारे में मैंने कहा था, मैं तुम्हारे वंश को दूँगा, और वे सदा के लिए उसके अधिकारी होंगे।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘याकूब’—वही पितृपुरुष जिसका नाम बाद में इस्राएल रखा गया। इब्रानी पाठ में यहाँ ‘इस्राएल’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר
  choice: स्मरण कर
  rationale: परमेश्वर को संबोधित पुल्लिंग एकवचन आज्ञार्थक है। ‘स्मरण कर’ वाचा के आधार पर मूसा की विनती को स्वाभाविक और गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיִשְׂרָאֵל
  choice: अब्राहम, इसहाक और इस्राएल
  rationale: मूल इब्रानी में तीसरा नाम ‘इस्राएल’ है; उसे ‘याकूब’ से बदलने के बजाय पाठ का वास्तविक नाम और उसका वाचागत संकेत सुरक्षित रखा गया है।
- source_word: עֲבָדֶיךָ
  choice: अपने सेवकों
  rationale: यहाँ पितृपुरुषों का परमेश्वर के वाचागत सेवकों के रूप में संबंध प्रमुख है; इसलिए ‘दासों’ की अपेक्षा ‘सेवकों’ अधिक उपयुक्त है।
- source_word: אֲשֶׁר נִשְׁבַּעְתָּ לָהֶם בָּךְ
  choice: जिनसे तूने अपनी ही शपथ खाकर
  rationale: בָּךְ का आशय है कि परमेश्वर ने स्वयं को अपनी शपथ की गारंटी बनाया। ‘अपनी ही शपथ खाकर’ इस आत्म-संदर्भित बल को सहज हिन्दी में व्यक्त करता है।
- source_word: אַרְבֶּה אֶת זַרְעֲכֶם
  choice: मैं तुम्हारे वंश को ... बढ़ाऊँगा
  rationale: זרע सामूहिक अर्थ वाला पद है। ‘वंश’ आधुनिक हिन्दी में भावी संतति को स्वाभाविक रूप से व्यक्त करता है और आगे भी उसी शब्द को बनाए रखता है।
- source_word: כְּכוֹכְבֵי הַשָּׁמָיִם
  choice: आकाश के तारों के समान
  rationale: यह वाक्यांश मूल उपमा और उसकी ऊँची वाचागत शैली को स्पष्ट, प्रचलित हिन्दी में सुरक्षित रखता है।
- source_word: וְכָל הָאָרֶץ הַזֹּאת
  choice: और यह सारा देश
  rationale: הָאָרֶץ यहाँ प्रतिज्ञात भूभाग को सूचित करता है; ‘यह सारा देश’ संकेतवाचकता और समग्रता दोनों बनाए रखता है।
- source_word: אֲשֶׁר אָמַרְתִּי
  choice: जिसके विषय में मैंने कहा है
  rationale: यह अनुवाद सापेक्ष उपवाक्य को अगले स्वतंत्र ‘मैं ... दूँगा’ में विलीन नहीं करता और इब्रानी की दो पृथक क्रियात्मक इकाइयों को बनाए रखता है।
- source_word: אֶתֵּן לְזַרְעֲכֶם
  choice: मैं तुम्हारे वंश को दूँगा
  rationale: भविष्यकालीन प्रतिज्ञा और זרע के लिए चुने गए ‘वंश’ की संगति सुरक्षित है।
- source_word: וְנָחֲלוּ לְעֹלָם
  choice: और वे सदा के लिए उसके अधिकारी होंगे
  rationale: נחל का अर्थ उत्तराधिकार अथवा स्थायी अधिकार पाना है। ‘उसके अधिकारी होंगे’ भूमि को निहित कर्म के रूप में स्पष्ट करता है; ‘सदा के लिए’ לְעֹלָם की कालगत शक्ति रखता है।
theological_decisions:
- issue: पितृपुरुष के लिए ‘इस्राएल’ या ‘याकूब’
  choice: मुख्य पाठ में ‘इस्राएल’
  alternative: याकूब
  rationale: इब्रानी पाठ स्पष्टतः ‘इस्राएल’ कहता है। ‘याकूब’ करना अनुवाद के स्थान पर व्याख्या होता और नाम-परिवर्तन से जुड़ी वाचागत प्रतिध्वनि को मंद कर देता।
- issue: בָּךְ में शपथ का आधार
  choice: अपनी ही शपथ खाकर
  alternative: अपने आप की शपथ खाकर
  rationale: चुना हुआ रूप स्पष्ट करता है कि शपथ परमेश्वर ने अपने ही नाम/स्वरूप की खाई, पर हिन्दी में अनावश्यक रूप से असहज नहीं होता।
- issue: אֲשֶׁר אָמַרְתִּי और אֶתֵּן के बीच संबंध
  choice: 'दोनों खंडों को अलग रखना: ‘जिसके विषय में मैंने कहा है, मैं ... दूँगा’'
  alternative: ‘जिसे देने के लिए मैंने कहा था’
  rationale: वैकल्पिक रूप अगले खंड की ‘दूँगा’ क्रिया को सापेक्ष खंड में मिला देता है। चुना हुआ पाठ मूल की संरचना और उसकी कुछ हद तक असामान्य अभिव्यक्ति को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, एकवचन निकट संबोधन ‘तू’ के साथ, क्योंकि मूसा सीधे परमेश्वर से प्रार्थना कर रहा है। शैली गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है; ‘स्मरण कर’, ‘वंश’ और ‘अधिकारी होंगे’ जैसे पद औपचारिकता तथा स्वाभाविकता के बीच संतुलन रखते हैं।
