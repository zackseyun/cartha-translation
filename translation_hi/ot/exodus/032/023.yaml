  text: וַ/יֹּ֣אמְרוּ לִ֔/י עֲשֵׂה לָ֣/נוּ אֱלֹהִ֔ים אֲשֶׁ֥ר יֵלְכ֖וּ לְ/פָנֵ֑י/נוּ כִּי זֶ֣ה מֹשֶׁ֣ה הָ/אִ֗ישׁ אֲשֶׁ֤ר הֶֽעֱלָ֨/נוּ֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם לֹ֥א יָדַ֖עְנוּ מֶה הָ֥יָה לֽ/וֹ־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/023.yaml
  text: And they said to me[a], ‘Make gods for us, which will go before us, because this Moses, the man who brought us up from the land of Egypt—we do not know what has happened to him.’
translation:
  language: hi
  text: और उन्होंने मुझसे कहा, ‘हमारे लिए ऐसे देवता बना[a] जो हमारे आगे-आगे चलें, क्योंकि यह मूसा, वह आदमी जो हमें मिस्र देश से निकाल लाया—हम नहीं जानते कि उसके साथ क्या हुआ।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमारे लिए एक देवता बना, जो हमारे आगे-आगे चले।” इस पद में ‘देवता’ के साथ बहुवचन क्रिया (‘चलें’) है; फिर भी आसपास के प्रसंग में बछड़े की एक मूर्ति होने के कारण कुछ अनुवाद इसका भाव एकवचन में देते हैं।
    reason: אֱלֹהִים की संभावित एकवचन व्याख्या और प्रसंगगत तनाव को दर्ज करना।
lexical_decisions:
- source_word: וַיֹּאמְרוּ לִי
  choice: और उन्होंने मुझसे कहा
  rationale: वय्यिक़्तोल कथा को आगे बढ़ाता है; ‘और’ क्रमिक प्रवाह को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: עֲשֵׂה לָנוּ
  choice: हमारे लिए ... बना
  rationale: आज्ञार्थक क्रिया ‘बना/तैयार कर’ का अर्थ देती है और לָנוּ का हितार्थक भाव ‘हमारे लिए’ से स्पष्ट होता है।
- source_word: אֱלֹהִים ... יֵלְכוּ
  choice: ऐसे देवता ... जो ... चलें
  rationale: संज्ञा אֱלֹהִים के साथ बहुवचन क्रिया יֵלְכוּ है, इसलिए मुख्य पाठ में बहुवचन रखा गया है। ‘ऐसे’ हिन्दी में आगे आने वाले संबंधवाचक उपवाक्य से स्वाभाविक संबंध बनाता है।
- source_word: אֲשֶׁר יֵלְכוּ לְפָנֵינוּ
  choice: जो हमारे आगे-आगे चलें
  rationale: ‘आगे-आगे चलना’ नेतृत्व करते हुए मार्ग दिखाने के इब्रानी मुहावरे को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह उनके अनुरोध का कारण प्रस्तुत करता है।
- source_word: זֶה מֹשֶׁה הָאִישׁ
  choice: यह मूसा, वह आदमी
  rationale: ‘यह मूसा’ मूल के कुछ दूरी या तिरस्कार सूचक बल को बनाए रखता है; הָאִישׁ को अलग पदबंध ‘वह आदमी’ के रूप में रखकर मूल की पुनरुक्त पहचान भी सुरक्षित रहती है।
- source_word: אֲשֶׁר הֶעֱלָנוּ מֵאֶרֶץ מִצְרַיִם
  choice: जो हमें मिस्र देश से निकाल लाया
  rationale: हिफ़ील रूप निर्गमन के प्रसंग में ‘बाहर/ऊपर ले आना’ दर्शाता है; हिन्दी में ‘से निकाल लाया’ अर्थ को स्पष्ट और स्वाभाविक रूप से देता है, जबकि ‘देश’ אֶרֶץ को दर्शाता है।
- source_word: לֹא יָדַעְנוּ מֶה הָיָה לוֹ
  choice: हम नहीं जानते कि उसके साथ क्या हुआ
  rationale: पूर्ण क्रिया यहाँ वर्तमान परिणामी अवस्था व्यक्त करती है; यह हिन्दी मुहावरा व्यक्ति के अज्ञात हाल या भाग्य को स्वाभाविक रूप से बताता है।
theological_decisions:
- issue: हारून के कथन में אֱלֹהִים को एकवचन माना जाए या बहुवचन
  choice: 'बहुवचन: ‘देवता’'
  alternative: 'एकवचन: ‘एक देवता’'
  rationale: इस पद में אֱלֹהִים के साथ स्पष्ट बहुवचन क्रिया יֵלְכוּ (‘चलें’) प्रयुक्त है। इसलिए मुख्य पाठ बहुवचन रखता है और आसपास के बछड़े के एकवचन चित्र के आधार पर व्याकरणिक तनाव को समतल नहीं करता।
