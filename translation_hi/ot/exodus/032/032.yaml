  text: וְ/עַתָּ֖ה אִם תִּשָּׂ֣א חַטָּאתָ֑/ם וְ/אִם אַ֕יִן מְחֵ֣/נִי נָ֔א מִֽ/סִּפְרְ/ךָ֖ אֲשֶׁ֥ר כָּתָֽבְתָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/032.yaml
  text: But now[a], if you will forgive their sin—but if not[b], please blot me out of your book that you have written.
translation:
  language: hi
  text: पर अब, यदि तू उनका पाप क्षमा कर दे[a]—और यदि नहीं, तो मुझे, कृपा करके, अपनी उस पुस्तक[b] में से मिटा दे जिसे तूने लिखा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनका पाप उठा ले” अथवा “उनका पाप क्षमा कर”; इब्रानी मुहावरे में शाब्दिक रूप से पाप को “उठाने/वहन करने” की क्रिया है।
    reason: lexical_alternative
  - marker: b
    text: “तेरी पुस्तक” जीवित लोगों के दैवी अभिलेख की ओर संकेत कर सकती है या व्यापक अर्थ में जीवन की पुस्तक की ओर; इब्रानी पाठ इससे अधिक स्पष्ट नहीं करता।
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: पर अब
  rationale: संदर्भ में मूसा की विनती का तीखा मोड़ दिखाता है; केवल ‘और अब’ की अपेक्षा विरोधात्मक भाव अधिक स्वाभाविक है।
- source_word: תִּשָּׂא חַטָּאתָם
  choice: उनका पाप क्षमा कर दे
  rationale: נשׂא का मूल भाव ‘उठाना/वहन करना’ है, पर ‘पाप’ के साथ यह पाप को उठा ले जाने, अर्थात क्षमा करने, का इब्रानी मुहावरा है।
- source_word: וְאִם אַיִן
  choice: और यदि नहीं
  rationale: मूल का अपूर्ण नकारात्मक शर्त-वाक्य सुरक्षित रखा गया है; पहली शर्त का परिणाम जानबूझकर अनकहा है।
- source_word: מְחֵנִי נָא
  choice: कृपा करके ... मेरा नाम मिटा दे
  rationale: מחה लिखित अभिलेख से मिटाने का भाव रखता है और נָא विनम्र आग्रह व्यक्त करता है। हिंदी में पुस्तक से व्यक्ति को मिटाने की अपेक्षा ‘मेरा नाम मिटा दे’ वही अभिप्रेत चित्र स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִסִּפְרְךָ
  choice: अपनी ... पुस्तक में से
  rationale: סֵפֶר का अर्थ पुस्तक, पत्रक या अभिलेख हो सकता है। ‘पुस्तक’ मूल की अनिर्दिष्टता और बाइबलीय प्रतिध्वनि दोनों बनाए रखता है।
- source_word: אֲשֶׁר כָּתָבְתָּ
  choice: जिसे तूने लिखा है
  rationale: सम्बन्धवाचक उपवाक्य यह स्पष्ट करता है कि यह वही पुस्तक है जिसे स्वयं परमेश्वर ने लिखा है।
theological_decisions:
- issue: ‘तेरी पुस्तक’ का स्वरूप
  choice: अपनी उस पुस्तक
  alternative: जीवन की पुस्तक / जीवितों का दैवी अभिलेख
  rationale: इब्रानी पाठ पुस्तक की ठीक प्रकृति नहीं बताता। इसलिए इसे ‘जीवन की पुस्तक’ कहकर व्याख्यात्मक रूप से निश्चित नहीं किया गया।
- issue: पहली शर्त का अधूरा वाक्य
  choice: यदि तू उनका पाप क्षमा कर दे—
  alternative: यदि तू उनका पाप क्षमा कर दे, तो अच्छा है
  rationale: मूल पाठ में शर्त के बाद परिणाम व्यक्त नहीं है। डैश उस भावनात्मक विराम और वास्तविक व्याकरणिक अपूर्णता को बनाए रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिंदी। परमेश्वर के लिए एकवचन निकट-संबोधन ‘तू’ रखा गया है, जो बाइबलीय प्रार्थना-संदर्भ में आदरहीन नहीं बल्कि प्रत्यक्ष और गंभीर है। भावनात्मक अपूर्णता दिखाने के लिए दीर्घ डैश प्रयुक्त है।
