base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/022.yaml
  text: And Aaron said[a], “Do not let my lord’s anger burn hot. You know the people, that they are set on evil.”
translation:
  language: hi
  text: और हारून ने कहा, “मेरे स्वामी का क्रोध न भड़के। आप इन लोगों को जानते हैं कि ये बुराई पर तुले रहते हैं।[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ये बुराई की ओर झुके हुए हैं” अथवा “इनकी प्रवृत्ति बुराई की है।” हिब्रू मुहावरा लोगों को बुराई की ओर प्रवृत्त बताता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אַהֲרֹן
  choice: और हारून ने कहा
  rationale: हिब्रू कथात्मक क्रम को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: אַל יִחַר אַף
  choice: क्रोध न भड़के
  rationale: मूल में क्रोध के जलने का रूपक है; ‘भड़के’ उसे स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: אֲדֹנִי
  choice: मेरे प्रभु
  rationale: यहाँ हारून मूसा को आदरपूर्वक संबोधित करता है, परमेश्वर को नहीं। ‘मेरे प्रभु’ मानवीय आदरसूचक संबोधन को सुरक्षित रखता है।
- source_word: אַתָּה יָדַעְתָּ אֶת הָעָם
  choice: आप इन लोगों को जानते हैं
  rationale: स्पष्ट द्वितीय-पुरुष सर्वनाम का सम्मानसूचक ‘आप’ स्वाभाविक हिन्दी में उचित बल देता है; ‘इन लोगों’ से उपस्थित समुदाय का संकेत स्पष्ट होता है।
- source_word: כִּי בְרָע הוּא
  choice: कि ये बुराई पर तुले रहते हैं
  rationale: शाब्दिक रूप ‘वह बुराई में है’ हिन्दी में अस्वाभाविक है। यह चयन सामूहिक प्रजा की बुराई की ओर दृढ़ प्रवृत्ति बताता है, जबकि पादटिप्पणी मुहावरे की अर्थ-सीमा सुरक्षित रखती है।
theological_decisions:
- issue: אֲדֹנִי का मानवीय संबोधन
  choice: मेरे प्रभु
  alternative: मेरे स्वामी; महोदय
  rationale: संबोधित व्यक्ति मूसा है। इसलिए यह परमेश्वर के नाम या दिव्य उपाधि के रूप में नहीं, बल्कि आदरसूचक मानवीय संबोधन के रूप में अनूदित है।
- issue: בְרָע הוּא में बुराई से संबंध की प्रकृति
  choice: बुराई पर तुले रहते हैं
  alternative: बुराई की ओर झुके हुए हैं; बुराई में पड़े हैं
  rationale: हिब्रू मुहावरा लोगों को बुराई से चरित्रगत रूप से जुड़ा बताता है, पर उस प्रवृत्ति की ठीक सूक्ष्मता अस्पष्ट है; इसलिए मुख्य पाठ के साथ विकल्प पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी; कथात्मक, गरिमापूर्ण और सामान्य पाठक के लिए सहज। मूसा के लिए आदरसूचक ‘आप’ रखा गया है।
