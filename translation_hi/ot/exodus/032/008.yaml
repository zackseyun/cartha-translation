reference: Exodus 32:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: סָ֣רוּ מַהֵ֗ר מִן הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר צִוִּיתִ֔/ם עָשׂ֣וּ לָ/הֶ֔ם עֵ֖גֶל מַסֵּכָ֑ה וַ/יִּשְׁתַּֽחֲווּ ל/וֹ֙ וַ/יִּזְבְּחוּ ל֔/וֹ וַ/יֹּ֣אמְר֔וּ אֵ֤לֶּה אֱלֹהֶ֨י/ךָ֙ יִשְׂרָאֵ֔ל אֲשֶׁ֥ר הֶֽעֱל֖וּ/ךָ מֵ/אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/008.yaml
  text: They have quickly turned aside from the way that I commanded them. They have made for themselves a cast image of a calf[a], and have bowed down to it and sacrificed to it, and said, ‘These are your gods, Israel, who brought you up from the land of Egypt.’
translation:
  language: hi
  text: जिस मार्ग पर चलने की आज्ञा मैंने उन्हें दी थी, उससे वे बहुत जल्दी हट गए हैं। उन्होंने अपने लिए बछड़े की एक ढली हुई मूर्ति[a] बनाई है, उसके सामने दण्डवत किया है, उसे बलि चढ़ाई है और कहा है, ‘हे इस्राएल, ये तेरे देवता हैं, जो तुझे मिस्र देश से निकाल लाए हैं।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यह तेरा देवता है, हे इस्राएल।” इब्रानी में शाब्दिक रूप से “ये तेरे देवता हैं” है, यद्यपि संदर्भ में एक ही बछड़ा है।
    reason: एक बछड़े के संदर्भ में इब्रानी के व्याकरणिक बहुवचन से उत्पन्न वास्तविक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: סָרוּ מַהֵר
  choice: वे बहुत जल्दी हट गए हैं
  rationale: यह मार्ग से शीघ्र विचलित होने का भाव रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: מִן הַדֶּרֶךְ אֲשֶׁר צִוִּיתִם
  choice: जिस मार्ग पर चलने की आज्ञा मैंने उन्हें दी थी, उससे
  rationale: ‘मार्ग’ की नैतिक उपमा सुरक्षित रहती है; ‘पर चलने की’ हिन्दी में आज्ञा और मार्ग का संबंध स्पष्ट करती है।
- source_word: עָשׂוּ לָהֶם
  choice: उन्होंने अपने लिए ... बनाई है
  rationale: לָהֶם के आत्मसापेक्ष भाव को स्पष्ट रूप से व्यक्त करता है।
- source_word: עֵגֶל מַסֵּכָה
  choice: बछड़े की एक ढली हुई मूर्ति
  rationale: מַסֵּכָה धातु ढालकर बनाई गई प्रतिमा को सूचित करता है; यह चयन निर्माण-विधि और बछड़े के रूप दोनों को स्पष्ट रखता है।
- source_word: וַיִּשְׁתַּחֲווּ לוֹ
  choice: उसके सामने दण्डवत किया है
  rationale: शारीरिक रूप से झुकने अथवा भूमि पर गिरकर प्रणाम करने की क्रिया को सामान्य ‘आराधना’ में विलीन नहीं करता।
- source_word: וַיִּזְבְּחוּ לוֹ
  choice: उसे बलि चढ़ाई है
  rationale: बलिदान की उपासना-संबंधी क्रिया को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֵלֶּה אֱלֹהֶיךָ
  choice: ये तेरे देवता हैं
  rationale: इब्रानी के स्पष्ट बहुवचन ‘ये’ और ‘तेरे देवता’ को मुख्य पाठ में सुरक्षित रखता है, यद्यपि संदर्भ में मूर्ति एक है।
- source_word: הֶעֱלוּךָ מֵאֶרֶץ מִצְרָיִם
  choice: जो तुझे मिस्र देश से निकाल लाए हैं
  rationale: निर्गमन की गति को आधुनिक हिन्दी में स्वाभाविक ढंग से व्यक्त करता है; बहुवचन क्रिया इब्रानी वाक्य के व्याकरणिक बहुवचन से मेल खाती है।
theological_decisions:
- issue: एक बछड़े के संदर्भ में אֵלֶּה אֱלֹהֶיךָ का वचन
  choice: 'मुख्य पाठ में बहुवचन: ‘ये तेरे देवता हैं’'
  alternative: 'एकवचन: ‘यह तेरा देवता है’'
  rationale: इब्रानी व्याकरण प्रत्यक्ष रूप से बहुवचन है। एक मूर्ति के संदर्भ से उत्पन्न तनाव को मुख्य पाठ में मिटाने के बजाय वैकल्पिक एकवचन को पादटिप्पणी में रखा गया है।
- issue: וַיִּשְׁתַּחֲווּ की उपासना-संबंधी क्रिया
  choice: ‘उसके सामने दण्डवत किया’
  alternative: ‘उसकी आराधना की’
  rationale: मूल शब्द की शारीरिक क्रिया को सुरक्षित रखता है और दण्डवत करने, बलि चढ़ाने तथा कहने के क्रम को अलग-अलग व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘दण्डवत’ प्रचलित बाइबलीय-धार्मिक शब्द है और यहाँ मूल की शारीरिक क्रिया को सटीक रखता है। परमेश्वर का कथन होने के कारण ‘उन्हें/उन्होंने’ और उद्धृत संबोधन में परंपरागत किंतु सहज ‘हे इस्राएल’ तथा ‘तेरे/तुझे’ प्रयुक्त हैं।
