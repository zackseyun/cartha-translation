base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/010.yaml
  text: Now leave me alone[a], so that my anger may burn against them and I may consume them[b]; and I will make you into a great nation.
translation:
  language: hi
  text: अब मुझे अकेला छोड़ दे[a], ताकि मेरा क्रोध उन पर भड़क उठे और मैं उनका अंत कर दूँ[b]; और मैं तुझे एक महान राष्ट्र बनाऊँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मुझे मेरे हाल पर छोड़ दे।”
    reason: lexical_alternative
  - marker: b
    text: या, “मैं उन्हें नष्ट कर दूँ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: अब
  rationale: यह वार्तालाप को आगे बढ़ाकर तत्काल आदेश प्रस्तुत करता है; आधुनिक हिन्दी में ‘अब’ स्वाभाविक और संक्षिप्त है।
- source_word: הַנִּיחָה לִּי
  choice: मुझे अकेला छोड़ दे
  rationale: इस प्रयोग में हिफ़ील आज्ञार्थक का अर्थ किसी को उसके हाल पर छोड़ देना या उसे न रोकना है। यह हिन्दी में आदेश की शक्ति को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְיִחַר אַפִּי
  choice: ताकि मेरा क्रोध ... भड़क उठे
  rationale: हिब्रू मुहावरे में क्रोध के जलने या गर्म होने का सजीव बिंब है। ‘भड़क उठे’ उस बिंब और प्रसंगगत उद्देश्य/परिणाम दोनों को सहज हिन्दी में बनाए रखता है।
- source_word: בָהֶם
  choice: उन पर
  rationale: क्रोध के लक्ष्य को बताने के लिए हिन्दी में ‘उन पर’ स्वाभाविक प्रयोग है।
- source_word: וַאֲכַלֵּם
  choice: मैं उनका अंत कर दूँ
  rationale: पिअेल रूप यहाँ समाप्त कर देने, मिटा देने या नष्ट करने का अर्थ देता है। ‘अंत कर दूँ’ कठोर न्याय का भाव स्पष्ट रखता है, जबकि वैकल्पिक ‘भस्म कर दूँ’ मूल क्रिया में निहित न होने वाला अग्नि-बिंब जोड़ सकता है।
- source_word: וְאֶעֱשֶׂה אוֹתְךָ לְגוֹי גָּדוֹל
  choice: मैं तुझसे एक महान जाति बनाऊँगा
  rationale: ‘तुझसे’ यह स्पष्ट करता है कि मूसा से एक बड़ा जनसमुदाय उत्पन्न किया जाएगा। ‘जाति’ यहाँ גּוֹי के राष्ट्र/जनसमूह संबंधी अर्थ को व्यक्त करती है, न कि आधुनिक सामाजिक जाति-व्यवस्था को।
theological_decisions:
- issue: परमेश्वर के क्रोध का मानव-सदृश सजीव वर्णन
  choice: ‘मेरा क्रोध ... भड़क उठे’ के रूप में रूपक को बनाए रखा गया।
  alternative: ‘मैं उन पर क्रोधित होऊँ’ जैसे अमूर्त कथन से इसे नरम करना।
  rationale: हिब्रू पाठ क्रोध के जलने का सजीव मुहावरा रखता है; इसे बनाए रखने से ईश्वरीय पवित्रता और न्याय का कथात्मक तथा धर्मवैचारिक तनाव सुरक्षित रहता है।
- issue: आज्ञा और मूसा की मध्यस्थता का संबंध
  choice: ‘मुझे अकेला छोड़ दे’ को वास्तविक, सीधी आज्ञा के रूप में अनूदित किया गया।
  alternative: इसे मुख्य पाठ में मूसा को मध्यस्थता के लिए अप्रत्यक्ष निमंत्रण बताना।
  rationale: पद स्वयं सीधी आज्ञा, घोषित न्याय और मूसा से महान जाति बनाने की प्रतिज्ञा प्रस्तुत करता है। किसी निहित निमंत्रण की व्याख्या अनुवाद में नहीं जोड़ी गई।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। परमेश्वर के लिए प्रसंगानुकूल एकवचन निकट संबोधन ‘तू’ के रूप ‘दे/तुझसे’ प्रयुक्त हैं। ‘महान जाति’ बाइबिलीय प्रतिज्ञा की प्रतिध्वनि बनाए रखती है; यहाँ ‘जाति’ का अर्थ राष्ट्र या जनसमूह है।
