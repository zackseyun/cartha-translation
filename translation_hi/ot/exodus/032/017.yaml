  yaml_path: translation/ot/exodus/032/017.yaml
  text: When Joshua heard the sound of the people as they shouted[a], he said to Moses, “There is the sound of war in the camp.”
translation:
  language: hi
  text: जब यहोशू ने लोगों के चिल्लाने की आवाज़ सुनी[a], तो उसने मूसा से कहा, “छावनी में युद्ध की आवाज़ सुनाई दे रही है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “लोगों के कोलाहल की आवाज़।” हिब्रू अभिव्यक्ति लोगों की ऊँची पुकार या शोर मचाने को दर्शाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: सुनी
  rationale: यहाँ שׁמע का अर्थ कथा-क्रम में साधारण श्रवण-बोध है; इसलिए ‘सुनी’ स्वाभाविक है।
- source_word: יְהוֹשֻׁעַ
  choice: यहोशू
  rationale: हिब्रू नाम का हिन्दी बाइबल-परंपरा में प्रचलित रूप।
- source_word: קוֹל
  choice: आवाज़
  rationale: यह शब्द यहाँ लोगों की सुनाई देने वाली ध्वनि या कोलाहल को दर्शाता है; ‘आवाज़’ दोनों प्रयोगों में स्वाभाविक और संगत है।
- source_word: הָעָם
  choice: लोगों
  rationale: यहाँ עָם इस्राएली समुदाय को सामूहिक रूप से दर्शाता है; ‘लोग’ सामान्य आधुनिक हिन्दी है।
- source_word: בְּרֵעֹה
  choice: के चिल्लाने
  rationale: अभिव्यक्ति ऊँची पुकार या शोर मचाने की ओर संकेत करती है। एकवचन प्रत्यय सामूहिक संज्ञा עָם के अनुरूप है; हिन्दी में ‘लोगों के चिल्लाने’ से सामूहिक अर्थ स्वाभाविक रूप में आता है।
- source_word: וַיֹּאמֶר אֶל־מֹשֶׁה
  choice: तो उसने मूसा से कहा
  rationale: मानक कथात्मक वचन-सूत्र; ‘उसने’ से यहोशू का संदर्भ स्पष्ट रहता है।
- source_word: קוֹל מִלְחָמָה
  choice: युद्ध की आवाज़
  rationale: मूल रचना का निकट अर्थ ‘युद्ध की आवाज़’ है; ‘लड़ाई का शोर’ भी संभव है, पर चुना हुआ रूप हिब्रू संरचना को बनाए रखता है।
- source_word: בַּמַּחֲנֶה
  choice: छावनी में
  rationale: מַחֲנֶה इस्राएलियों की छावनी को दर्शाता है; ‘छावनी में’ सीधा और प्रचलित अनुवाद है।
