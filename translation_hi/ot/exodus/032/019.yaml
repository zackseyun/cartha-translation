base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/019.yaml
  text: And as soon as he came near the camp and saw the calf and the dancing[a], Moses' anger burned, and he threw the tablets from his hands and shattered them at the foot of the mountain.
translation:
  language: hi
  text: जैसे ही वह छावनी के पास पहुँचा और उसने बछड़े और नाच[a] को देखा, मूसा का क्रोध भड़क उठा। उसने अपने हाथ से पटियाएँ फेंक दीं और उन्हें पहाड़ की तलहटी में चकनाचूर कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “नाचों”। इब्रानी में यह संज्ञा बहुवचन है; हिन्दी में सामूहिक गतिविधि के अर्थ में “नाच” अधिक स्वाभाविक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: जैसे ही
  rationale: इब्रानी कथात्मक सूत्र और काल-संबंध को सहज आधुनिक हिन्दी में व्यक्त करता है; यहाँ घटनाओं की तत्काल क्रमिकता स्पष्ट है।
- source_word: קָרַב אֶל הַמַּחֲנֶה
  choice: छावनी के पास पहुँचा
  rationale: קָרַב के निकट आने के स्थानिक भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וַיַּרְא אֶת הָעֵגֶל
  choice: उसने बछड़े ... को देखा
  rationale: רָאָה का सामान्य अर्थ ‘देखना’ है और निश्चित उपपद पहले से ज्ञात विशिष्ट बछड़े की ओर संकेत करता है।
- source_word: וּמְחֹלֹת
  choice: और नाच
  rationale: बहुवचन इब्रानी संज्ञा उत्सवी नृत्यों/नाचने की गतिविधि को सूचित करती है। हिन्दी में ‘नाच’ सामूहिक गतिविधि के लिए स्वाभाविक है और ‘रंगरलियाँ’ जैसी व्याख्यात्मक वृद्धि से बचता है।
- source_word: וַיִּחַר אַף מֹשֶׁה
  choice: मूसा का क्रोध भड़क उठा
  rationale: क्रोध के जलने वाले सजीव इब्रानी मुहावरे को स्पष्ट और गरिमापूर्ण हिन्दी मुहावरे में व्यक्त करता है।
- source_word: וַיַּשְׁלֵךְ מִיָּדוֹ
  choice: उसने अपने हाथों से ... फेंक दीं
  rationale: שׁלך के फेंकने के बलपूर्ण भाव को रखता है। मूल में ‘हाथ’ एकवचन है, पर दो पटियाओं के प्रसंग में हिन्दी का बहुवचन स्वाभाविक है।
- source_word: הַלֻּחֹת
  choice: पटियाएँ
  rationale: לוּחֹת के लिए प्रचलित और प्रसंगानुकूल हिन्दी शब्द है; इस पद में निहित न होने के कारण ‘पत्थर की’ नहीं जोड़ा गया।
- source_word: וַיְשַׁבֵּר אֹתָם
  choice: उन्हें चकनाचूर कर दिया
  rationale: שׁבר की बलपूर्ण क्रिया को व्यक्त करता है और पटियाओं के पूरी तरह टूटने का दृश्य स्पष्ट रखता है।
- source_word: תַּחַת הָהָר
  choice: पहाड़ के नीचे
  rationale: תַּחַת का अपेक्षाकृत औपचारिक और प्रत्यक्ष स्थानिक अनुवाद है; हिन्दी में यह पहाड़ की तलहटी के क्षेत्र को स्वाभाविक रूप से व्यक्त कर सकता है।
