base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/024.yaml
  text: And I said to them[a], ‘Whoever has gold, take it off.’ So they gave it to me, and I threw it into the fire, and this calf came out.
translation:
  language: hi
  text: और मैंने उनसे कहा[a], “जिसके पास सोना है, वह उसे उतार दे।” तब उन्होंने वह मुझे दे दिया। और मैंने उसे आग में फेंक दिया, और यह बछड़ा निकल आया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “किसके पास सोना है? उसे तोड़कर/खींचकर उतार लो।” इब्रानी में शाब्दिक रूप से है, “किसके पास सोना है? उसे अलग कर लो।”
    reason: ‘לְמִי זָהָב הִתְפָּרָקוּ’ की प्रश्नात्मक और अधिक शाब्दिक सम्भावना तथा פרק के ‘अलग करने/उतारने’ वाले बल को सुरक्षित रखना।
lexical_decisions:
- source_word: וָאֹמַר לָהֶם
  choice: और मैंने उनसे कहा
  rationale: यह वाक्य हारून के बताए हुए घटनाक्रम को आगे बढ़ाता है; ‘और’ इब्रानी कथात्मक क्रम को सहज हिन्दी में बनाए रखता है।
- source_word: לְמִי זָהָב
  choice: जिसके पास सोना है
  rationale: शाब्दिक अर्थ ‘किसके लिए/किसके पास सोना है’ है; अनिश्चित संबोधन को स्वाभाविक हिन्दी में ‘जिसके पास’ से व्यक्त किया गया है।
- source_word: הִתְפָּרָקוּ
  choice: वह उसे उतार दे
  rationale: हित्पएल रूप यहाँ अपने ऊपर पहने सोने के आभूषण को उतारने का निर्देश देता है। एकवचन ‘वह’ अनिश्चित ‘जिसके’ से मेल खाता है, और ‘उसे’ सोने को सामूहिक रूप से संदर्भित करता है।
- source_word: וַיִּתְּנוּ לִי
  choice: तब उन्होंने वह मुझे दे दिया
  rationale: सोना निहित कर्म है; ‘तब’ आज्ञा के बाद की कथात्मक प्रगति को स्पष्ट और स्वाभाविक बनाता है।
- source_word: וָאַשְׁלִכֵהוּ בָאֵשׁ
  choice: मैंने उसे आग में डाल दिया
  rationale: שׁלך का मूल भाव फेंकना/डालना है। इस प्रसंग में ‘आग में डाल दिया’ आधुनिक हिन्दी में स्वाभाविक है और दिशात्मक अर्थ व्यक्त करता है।
- source_word: וַיֵּצֵא הָעֵגֶל הַזֶּה
  choice: और यह बछड़ा निकल आया
  rationale: ‘निकल आया’ हारून के दावे को बिना व्याख्यात्मक टिप्पणी के सीधे रखता है; ‘बछड़ा’ עגל का प्रचलित प्रसंगानुकूल अनुवाद है।
theological_decisions:
- issue: मूर्ति की उत्पत्ति के विषय में हारून का टालमटोल भरा वर्णन
  choice: हारून के कथन को बिना ‘अपने आप,’ ‘चमत्कार से,’ या ‘कथित रूप से’ जैसे व्याख्यात्मक शब्द जोड़े सीधे प्रस्तुत किया गया है।
  alternative: मुख्य पाठ में व्यंग्य या छल को स्पष्ट करने के लिए व्याख्यात्मक पद जोड़ना।
  rationale: इब्रानी पाठ स्वयं केवल हारून का कथन देता है। अनुवाद को उसकी कथात्मक विडंबना और तनाव सुरक्षित रखना चाहिए, न कि उसकी सत्यता या आशय पर टिप्पणी जोड़नी चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। हारून के कथन की असंगति को न बढ़ाया गया है, न समझाकर कम किया गया है।
