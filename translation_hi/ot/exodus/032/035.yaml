lexical_decisions:
- source_word: וַיִּגֹּף
  choice: महामारी से पीड़ित किया
  rationale: नָגַף का अर्थ प्रहार करना या विपत्ति से पीड़ित करना है और यह प्रायः महामारी-सदृश दैवी दंड के लिए प्रयुक्त होता है। यह अनुवाद दंड का भाव स्पष्ट करता है, पर यह नहीं कहता कि सभी लोग मर गए। व्यापक अर्थ ‘प्रहार किया’ पादटिप्पणी में रखा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिगत नाम को उपाधि से बदलने के बजाय आधुनिक हिन्दी में उसका लिप्यंतरण किया गया है।
- source_word: הָעָם
  choice: लोगों
  rationale: यहाँ עַם सामूहिक रूप से इस्राएल के लोगों को सूचित करता है; ‘लोगों’ स्वाभाविक और सटीक है।
- source_word: עַל אֲשֶׁר
  choice: क्योंकि
  rationale: पूर्वसर्ग और संबंधवाचक उपवाक्य यहाँ कारण व्यक्त करते हैं; आधुनिक हिन्दी में ‘क्योंकि’ इसका सहज रूप है।
- source_word: עָשׂוּ אֶת הָעֵגֶל
  choice: उन्होंने वह बछड़ा बनाया था
  rationale: बहुवचन क्रिया עָשׂוּ और प्रत्यक्ष कर्म הָעֵגֶל को सीधे व्यक्त किया गया है। इससे अगले उपवाक्य ‘जिसे हारून ने बनाया था’ के साथ मूल पाठ की असामान्य पुनरुक्ति और उत्तरदायित्व का तनाव बना रहता है।
- source_word: הָעֵגֶל
  choice: वह बछड़ा
  rationale: עֵגֶל का सामान्य अर्थ ‘बछड़ा’ है। इस पद में ‘सोने का’ नहीं कहा गया, इसलिए वह विवरण नहीं जोड़ा गया।
- source_word: אֲשֶׁר עָשָׂה אַהֲרֹן
  choice: जिसे हारून ने बनाया था
  rationale: संबंधवाचक उपवाक्य बछड़े को हारून द्वारा बनाया हुआ बताता है। पूर्वकालिकता को हिन्दी में ‘बनाया था’ से स्वाभाविक रूप में व्यक्त किया गया है।
theological_decisions:
- issue: וַיִּגֹּף में दैवी दंड का स्वरूप
  choice: याहवे ने लोगों को महामारी से पीड़ित किया
  alternative: याहवे ने लोगों पर प्रहार किया
  rationale: क्रिया किसी साधन का अलग से नाम नहीं लेती, पर उसका अर्थ-क्षेत्र प्रहार और महामारी-सदृश विपत्ति दोनों को समेटता है। मुख्य पाठ संदर्भानुकूल विपत्ति का भाव स्पष्ट करता है, जबकि पादटिप्पणी व्यापक अनुवाद को सुरक्षित रखती है।
- issue: लोगों और हारून—दोनों के ‘बनाने’ का कथन
  choice: मूल पाठ की पुनरुक्ति को बनाए रखा गया
  alternative: बछड़े के साथ उन्होंने जो किया था, उसके कारण
  rationale: इब्रानी में बहुवचन ‘उन्होंने बनाया’ के बाद एकवचन ‘हारून ने बनाया’ आता है। इसे केवल लोगों की पूजा या अन्य कर्म के रूप में समझाकर तनाव मिटाने के बजाय अनुवाद दोनों कथनों को रहने देता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘याहवे’ व्यक्तिगत ईश्वरीय नाम का लिप्यंतरण है। असामान्य ‘उन्होंने बनाया…हारून ने बनाया’ को जानबूझकर सरल करके नहीं हटाया गया, क्योंकि वही इब्रानी वाक्य की वास्तविक संरचना और उत्तरदायित्व का तनाव है।
