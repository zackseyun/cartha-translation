base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/015.yaml
  text: Then Moses turned and went down from the mountain[a], with the two tablets of the testimony in his hand, tablets written on both their sides; on this side and on that they were written.
translation:
  language: hi
  text: तब मूसा मुड़ा और पर्वत से नीचे उतरा। उसके हाथ में साक्ष्य की दोनों पटियाएँ थीं। उन पटियाओं के दोनों ओर लिखा हुआ था; इस ओर और उस ओर[a] वे लिखी हुई थीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘एक ओर और दूसरी ओर।’
    reason: מִזֶּה וּמִזֶּה की वैकल्पिक, समानार्थी अभिव्यक्ति।
lexical_decisions:
- source_word: וַיִּפֶן
  choice: मुड़ा
  rationale: यह क्रिया नीचे उतरने से पहले मूसा के दिशा बदलने को बताती है। ‘मुड़ा’ संक्षिप्त, स्वाभाविक और मूल के निकट है।
- source_word: וַיֵּרֶד
  choice: नीचे उतरा
  rationale: ירד का अर्थ नीचे जाना या उतरना है। पर्वत के प्रसंग में ‘नीचे उतरा’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: הָהָר
  choice: पर्वत
  rationale: सीनै के प्रसंग में הַר के लिए ‘पर्वत’ उपयुक्त और प्रचलित पद है।
- source_word: שְׁנֵי לֻחֹת
  choice: दोनों पटियाएँ
  rationale: לֻחֹת लेख वाली पटियाओं को सूचित करता है। यहाँ ‘पत्थर’ स्पष्ट रूप से नहीं कहा गया, इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
- source_word: הָעֵדֻת
  choice: साक्षी
  rationale: ‘साक्षी’ עֵדוּת की covenantal और theological प्रतिध्वनि को बनाए रखता है, बिना इसे व्याख्यात्मक रूप से केवल ‘वाचा-पत्र’ बना देने के।
- source_word: בְּיָדוֹ
  choice: उसके हाथ में
  rationale: मूल में ‘हाथ’ एकवचन है; हिन्दी में भी यह वहन करने के अर्थ में स्वाभाविक है।
- source_word: לֻחֹת כְּתֻבִים
  choice: उन पटियाओं ... लिखा हुआ था
  rationale: כתב के निष्क्रिय भाव को ‘लिखा हुआ था’ से व्यक्त किया गया है; ‘खुदा हुआ’ पत्थर और लेखन की विधि को अपेक्षा से अधिक स्पष्ट कर देता।
- source_word: מִשְּׁנֵי עֶבְרֵיהֶם
  choice: उन पटियाओं के दोनों ओर
  rationale: यह वाक्यांश पटियाओं की दोनों सतहों या ओरों पर लेख होने को बताता है।
- source_word: מִזֶּה וּמִזֶּה
  choice: इस ओर और उस ओर
  rationale: यह संतुलित अभिव्यक्ति मूल के संकेतात्मक और वितरणात्मक बल को बनाए रखती है।
- source_word: הֵם כְּתֻבִים
  choice: वे लिखी हुई थीं
  rationale: मूल में लेखन की बात दोहराकर बल दिया गया है; हिन्दी अनुवाद में भी इस पुनरुक्ति को सुरक्षित रखा गया है।
theological_decisions:
- issue: עֵדוּת का अनुवाद
  choice: साक्षी
  alternative: वाचा; गवाही
  rationale: ‘साक्षी’ स्थापित वाचागत शब्दावली और मूल पद की व्यापक धार्मिक अर्थच्छाया को सुरक्षित रखता है। ‘वाचा’ संबंध को अधिक स्पष्ट कर देती, पर मूल शब्द को संकुचित भी कर सकती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज किंतु गरिमापूर्ण रखी गई है। ‘पटियाएँ’ और ‘साक्षी’ बाइबलीय प्रसंग में परिचित हैं। मूल की पुनरुक्ति को हटाया नहीं गया, और पाद-टिप्पणी का चिह्न उसी वाक्यांश पर रखा गया है जिससे उसका संबंध है।
