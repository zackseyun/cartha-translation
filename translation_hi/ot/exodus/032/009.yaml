base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/009.yaml
  text: And Yahweh said to Moses[a], “I have seen this people, and behold, it is a stiff-necked people.”
translation:
  language: hi
  text: याहवे ने मूसा से कहा, “मैंने इस प्रजा को देखा है। देखो, यह हठीली प्रजा है[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी मुहावरे का शाब्दिक अर्थ है, ‘अकड़ी हुई गर्दन वाली’; इसका भाव हठीली और झुकने को तैयार न होने वाली प्रजा से है।
    reason: मूल रूपक और उसके मुहावरेदार अर्थ—दोनों को स्पष्ट करना।
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय परमेश्वर-नाम को उपाधि से बदलने के बजाय आधुनिक हिन्दी में उसके प्रचलित लिप्यंतरण द्वारा रखा गया है।
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: यह रूप कथा के अगले क्रमिक कार्य को बताता है; ‘तब’ आधुनिक हिन्दी में प्रसंग का स्वाभाविक प्रवाह बनाए रखता है।
- source_word: רָאִיתִי
  choice: मैंने ... देखा है
  rationale: इब्रानी पूर्ण रूप ऐसी पूरी हो चुकी दृष्टि/परख व्यक्त करता है जिसका परिणाम वर्तमान आकलन में सामने आता है।
- source_word: הָעָם הַזֶּה
  choice: इस प्रजा
  rationale: ‘प्रजा’ सामूहिक एकवचन और संकेतवाचक की दूरी—दोनों को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: וְהִנֵּה
  choice: सचमुच
  rationale: ध्यान खींचने और अगले कथन पर बल देने वाले अव्यय का स्वाभाविक, गरिमापूर्ण हिन्दी रूप; शाब्दिक ‘देख’ यहाँ हिन्दी संवाद में असहज होता।
- source_word: קְשֵׁה עֹרֶף
  choice: बड़ी हठीली
  rationale: मुहावरे का आशय साधारण आधुनिक हिन्दी में स्पष्ट करता है, जबकि मूल ‘कठोर गरदन’ रूपक को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: הוּא
  choice: यह ... है
  rationale: सर्वनाम सामूहिक एकवचन ‘प्रजा’ की ओर लौटता है; हिन्दी में ‘यह ... है’ उसका स्वाभाविक मेल है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में निजी वाचा-नाम स्पष्ट रूप से आया है; ‘याहवे’ उसे उपाधि में बदले बिना और किसी विशिष्ट सांप्रदायिक व्याख्या को जोड़े बिना प्रस्तुत करता है।
- issue: परमेश्वर के ‘देखने’ का अर्थ
  choice: मैंने इस प्रजा को देखा है
  alternative: मैं इस प्रजा को अच्छी तरह जानता हूँ
  rationale: ‘देखा है’ मूल क्रिया की ठोस भाषा और उसकी संभावित व्यापकता को बनाए रखता है; इसे केवल सर्वज्ञता या जाँच-पड़ताल की तकनीकी धारणा में सीमित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘प्रजा’ सामूहिक एकवचन को बनाए रखती है; ‘सचमुच’ וְהִנֵּה का बल स्वाभाविक हिन्दी में देता है। मुख्य पाठ में अर्थ-स्पष्ट ‘हठीली’ रखा गया है और इब्रानी रूपक पादटिप्पणी में दिया गया है।
