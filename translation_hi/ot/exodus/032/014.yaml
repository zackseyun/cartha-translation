base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/014.yaml
  text: And Yahweh relented concerning the harm that he had spoken of doing to his people[a][b].
translation:
  language: hi
  text: तब याहवे ने उस विपत्ति[b] को अपनी प्रजा पर लाने का विचार छोड़ दिया[a], जिसे लाने की बात उसने कही थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपना मन बदल लिया’ अथवा ‘पछताया’।
    reason: alternative_reading
  - marker: b
    text: इब्रानी में ‘बुराई/विपत्ति’; यहाँ इसका अर्थ घोषित अनिष्ट या विनाश है, परमेश्वर में नैतिक बुराई नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנָּחֶם
  choice: विचार छोड़ दिया
  rationale: निफ़अल रूप यहाँ पहले घोषित दंड को न लाने की ओर मुड़ने को व्यक्त करता है। यह सहज आधुनिक हिन्दी में कथानक का आशय बताता है, जबकि ‘अपना मन बदल लिया’ या ‘पछताया’ से उत्पन्न होने वाले अतिरिक्त अर्थ को मुख्य पाठ में अनिवार्य नहीं बनाता।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार अक्षरों वाले परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ रखा गया है।
- source_word: עַל הָרָעָה
  choice: वह विपत्ति
  rationale: इस न्याय-संदर्भ में רָעָה का अर्थ नैतिक बुराई नहीं, बल्कि घोषित अनिष्ट या विपत्ति है। हिन्दी में ‘विपत्ति’ स्पष्ट और स्वाभाविक है।
- source_word: אֲשֶׁר דִּבֶּר לַעֲשׂוֹת
  choice: लाने ... जिसकी बात उसने कही थी
  rationale: यह वाक्यांश उस विपत्ति की ओर संकेत करता है जिसे यहोवा ने पहले लाने की बात कही थी। ‘करना’ की अपेक्षा ‘विपत्ति लाना’ हिन्दी में अधिक स्वाभाविक है।
- source_word: לְעַמּוֹ
  choice: अपनी प्रजा पर
  rationale: लोग घोषित विपत्ति से प्रभावित होने वाले हैं; ‘अपनी प्रजा पर’ इस संबंध को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: נחם द्वारा परमेश्वर का मानव-सदृश वर्णन
  choice: मुख्य पाठ में ‘विचार छोड़ दिया’
  alternative: ‘अपना मन बदल लिया’ या ‘पछताया’
  rationale: पद मध्यस्थता के उत्तर में घोषित कार्यवाही के सचमुच न किए जाने को बताता है। यह चयन उस कथात्मक बदलाव को बनाए रखता है, पर परमेश्वर के ज्ञान या परिवर्तनशीलता के विषय में पाठ से आगे जाकर निष्कर्ष नहीं थोपता; अधिक शाब्दिक संभावनाएँ पादटिप्पणी में दी गई हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘प्रजा’ वाचा-संबंधी सामूहिक अर्थ को स्वाभाविक हिन्दी में व्यक्त करती है; पादटिप्पणियाँ इब्रानी क्रिया और संज्ञा की वास्तविक अर्थ-सीमा सुरक्षित रखती हैं।
