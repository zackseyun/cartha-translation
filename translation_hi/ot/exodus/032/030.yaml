  text: וַ/יְהִי֙ מִֽ/מָּחֳרָ֔ת וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶל הָ/עָ֔ם אַתֶּ֥ם חֲטָאתֶ֖ם חֲטָאָ֣ה גְדֹלָ֑ה וְ/עַתָּה֙ אֶֽעֱלֶ֣ה אֶל יְהוָ֔ה אוּלַ֥י אֲכַפְּרָ֖ה בְּעַ֥ד חַטַּאתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/030.yaml
  text: And it happened on the next day that Moses said to the people[a], “You have sinned a great sin. And now I will go up to Yahweh; perhaps I can make atonement for your sin.”
translation:
  language: hi
  text: अगले दिन मूसा ने लोगों से कहा, “तुमने बहुत बड़ा पाप किया है।[a] अब मैं याहवे के पास ऊपर चढ़ूँगा; शायद मैं तुम्हारे पाप के लिए प्रायश्चित कर सकूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शाब्दिक रूप से, “तुमने एक बड़ा पाप पाप किया है”; क्रिया और सजातीय संज्ञा का यह प्रयोग अपराध की गंभीरता पर बल देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִמָּחֳרָת
  choice: अगले दिन
  rationale: हिब्रू कथात्मक सूत्र और समय-सूचक पद मिलकर पिछली घटनाओं के बाद वाले दिन की ओर संकेत करते हैं। स्वाभाविक हिन्दी में ‘अगले दिन’ इसका पर्याप्त कथात्मक रूप है।
- source_word: וַיֹּאמֶר מֹשֶׁה אֶל הָעָם
  choice: मूसा ने लोगों से कहा
  rationale: אמר עם אל संबोधित वचन का सामान्य निर्माण है; ‘लोगों से कहा’ आधुनिक हिन्दी में सीधा और स्वाभाविक है।
- source_word: אַתֶּם חֲטָאתֶם חֲטָאָה גְדֹלָה
  choice: तुमने बहुत बड़ा पाप किया है
  rationale: स्पष्ट बहुवचन सर्वनाम का बल ‘तुमने’ में बना रहता है। सजातीय क्रिया-संज्ञा निर्माण अपराध की गंभीरता बढ़ाता है; हिन्दी का ‘बहुत बड़ा पाप किया है’ उसी तीव्रता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְעַתָּה
  choice: अब
  rationale: यह आरोप से मूसा की आगामी कार्रवाई की ओर संक्रमण दिखाता है। हिन्दी में ‘अब’ संयोजक और कालगत भाव दोनों स्पष्ट करता है।
- source_word: אֶעֱלֶה אֶל יְהוָה
  choice: मैं यहोवा के पास ऊपर जाऊँगा
  rationale: עלה पर्वत पर परमेश्वर की उपस्थिति की ओर ऊपर जाने को सूचित करता है। ‘पास ऊपर जाऊँगा’ दिशा और संबंध दोनों को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित नामरूप ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: אוּלַי
  choice: शायद
  rationale: यह परिणाम के विषय में आशापूर्ण अनिश्चितता व्यक्त करता है; ‘शायद’ आधुनिक हिन्दी में ठीक वही तनाव बनाए रखता है।
- source_word: אֲכַפְּרָה בְּעַד חַטַּאתְכֶם
  choice: मैं तुम्हारे पाप के लिए प्रायश्चित कर सकूँ
  rationale: כפר का पिएल रूप इस प्रसंग में प्रायश्चित करने का अर्थ देता है और בְּעַד प्रतिनिधिक हित को दिखाता है। संभावनार्थक ‘कर सकूँ’ אוּלַי के साथ अनिश्चित आशा को व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम है। हिन्दी पाठकों के लिए स्थापित नामरूप ‘यहोवा’ व्यक्तिगत नाम को बनाए रखता है, जबकि ‘प्रभु’ उसे उपाधि में बदल देता।
- issue: मूसा के प्रायश्चित-वचन की निश्चितता
  choice: शायद मैं ... प्रायश्चित कर सकूँ
  alternative: मैं ... प्रायश्चित कर दूँगा; शायद मुझे ... प्रायश्चित मिल सके
  rationale: मूल का אוּלַי परिणाम को अनिश्चित रखता है, और אֲכַפְּרָה मूसा की अपनी संभावित कार्रवाई को व्यक्त करता है। चुना हुआ रूप न सफलता की गारंटी देता है, न क्रिया को चुपचाप केवल प्रायश्चित प्राप्त करने में बदलता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण पर सहज। वाक्य में मूल की गंभीरता और ‘शायद’ से व्यक्त धर्मवैचारिक तनाव सुरक्षित रखा गया है। सजातीय हिब्रू अभिव्यक्ति को शब्दशः अस्वाभाविक दोहराव के बजाय ‘बहुत बड़ा पाप’ से व्यक्त किया गया है, इसलिए अलग पादटिप्पणी आवश्यक नहीं मानी गई।
