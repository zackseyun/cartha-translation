base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/027.yaml
  text: 'And he said to them[a], “Thus says Yahweh, the God of Israel: Each man, put his sword on his thigh. Pass through and return from gate to gate throughout the camp, and each man kill his brother, and each man his companion, and each man his neighbor.”'
translation:
  language: hi
  text: 'और उसने उनसे कहा, “याहवे, इस्राएल का परमेश्वर, यह कहता है: हर पुरुष अपनी तलवार अपनी जाँघ पर बाँध ले। छावनी में फाटक से फाटक तक होकर आओ-जाओ, और हर पुरुष अपने भाई को मार डाले, और हर पुरुष अपने साथी को, और हर पुरुष अपने निकट संबंधी[a] को।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'हिब्रू: ‘उसके निकट व्यक्ति।’ इसका अनुवाद ‘उसका कुटुम्बी’ या ‘उसका निकट संबंधी’ भी हो सकता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם
  choice: और उसने उनसे कहा
  rationale: वाव-क्रमिक कथन की स्वाभाविक कथात्मक गति बनाए रखता है और वक्ता के पुल्लिंग एकवचन को सुरक्षित रखता है।
- source_word: כֹּה אָמַר
  choice: यह कहता है
  rationale: हिब्रू दूत-वचन सूत्र के अधिकारपूर्ण वर्तमान भाव को सरल, आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: ईश्वरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण द्वारा प्रस्तुत किया गया है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल का परमेश्वर
  rationale: संबंधवाचक हिब्रू पदबंध का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: שִׂימוּ אִישׁ חַרְבּוֹ עַל יְרֵכוֹ
  choice: हर पुरुष अपनी तलवार अपनी जाँघ पर बाँध ले
  rationale: शस्त्र धारण करने के मुहावरे को स्पष्ट हिन्दी में व्यक्त करते हुए जाँघ की मूल छवि और אִישׁ का वितरणात्मक बल सुरक्षित रखा गया है।
- source_word: עִבְרוּ וָשׁוּבוּ
  choice: इधर-उधर जाओ
  rationale: दोनों आज्ञार्थक क्रियाओं से व्यक्त छावनी में आगे-पीछे घूमने की गति को प्राकृतिक हिन्दी में समेटता है; केवल एक बार लौटने का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: מִשַּׁעַר לָשַׁעַר בַּמַּחֲנֶה
  choice: छावनी में एक फाटक से दूसरे फाटक तक
  rationale: गतिशीलता और पूरे शिविर में फैलाव का अर्थ स्पष्ट करता है।
- source_word: וְהִרְגוּ
  choice: मार डाले
  rationale: मृत्यु तक मारने की आज्ञा को स्पष्ट आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אִישׁ אֶת אָחִיו וְאִישׁ אֶת רֵעֵהוּ וְאִישׁ אֶת קְרֹבוֹ
  choice: हर पुरुष अपने भाई को, अपने साथी को और अपने निकट संबंधी को
  rationale: अंतरंग सामाजिक संबंधों की त्रयी को बनाए रखता है; अन्तिम קרוב को अस्पष्ट ‘पड़ोसी’ के बजाय उसके निकटता/नातेदारी-संबंधी अर्थ में प्रस्तुत करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ व्यक्तिगत नाम देता है। हिन्दी पाठक-वर्ग में स्थापित ‘यहोवा’ नाम को रखा गया है, न कि उसे ‘प्रभु’ उपाधि से प्रतिस्थापित किया गया।
- issue: बार-बार आए אִישׁ का वितरणात्मक और लैंगिक बल
  choice: हर पुरुष
  alternative: हर कोई; प्रत्येक व्यक्ति
  rationale: संदर्भ में आज्ञा लेवी पुरुषों को दी गई है; इसलिए मूल के पुल्लिंग और प्रत्येक व्यक्ति पर रखे गए दायित्व दोनों को सुरक्षित रखा गया है।
- issue: קְרֹבוֹ में संबंध की निकटता
  choice: निकट संबंधी
  alternative: पड़ोसी; कुटुम्बी
  rationale: शब्द निकट व्यक्ति या निकट रिश्तेदार का बोध करा सकता है। प्रसंग की ‘भाई—साथी—निकट व्यक्ति’ त्रयी में ‘निकट संबंधी’ अर्थगत निकटता को व्यक्त करता है, पर अत्यधिक विशिष्ट रक्त-संबंध निर्धारित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गंभीर और मौखिक रूप से सुबोध रखी गई है। आज्ञा की कठोरता को नरम नहीं किया गया। ‘तलवार जाँघ पर बाँधना’ मूल बिंब रखते हुए शस्त्र धारण करने का स्वाभाविक हिन्दी मुहावरा है।
