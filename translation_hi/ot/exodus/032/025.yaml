base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/025.yaml
  text: When Moses saw that the people were out of control—for Aaron had let them get out of control[b][a], for a derision among those who rose against them—
translation:
  language: hi
  text: जब मूसा ने देखा कि लोग बेलगाम हो गए थे—क्योंकि हारून ने उन्हें बेलगाम छोड़ दिया था[a], जिससे वे अपने विरोधियों के बीच उपहास का विषय बन गए थे[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या लोगों की दशा के लिए, ‘बेकाबू’ या ‘अनियंत्रित’; और हारून के कार्य के लिए, ‘उन्हें खुला छोड़ दिया।’ इब्रानी में दोनों के लिए एक ही मूल शब्द दोहराया गया है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उनके विरोधियों के बीच तिरस्कार या निंदा का विषय।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: जब मूसा ने देखा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; संदर्भ में ‘जब’ अगली कार्रवाई से समय-संबंध को स्वाभाविक रूप से जोड़ता है।
- source_word: הָעָם
  choice: लोग
  rationale: यहाँ עָם छावनी में एकत्र इस्राएली समुदाय को सूचित करता है; आधुनिक हिन्दी में ‘लोग’ सहज और स्पष्ट है।
- source_word: כִּי פָרֻעַ הוּא
  choice: कि लोग बेलगाम हो गए हैं
  rationale: פרע से बना यह रूप नियंत्रण और संयम के हट जाने की दशा बताता है। ‘बेलगाम’ सामाजिक अव्यवस्था को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כִּי פְרָעֹה אַהֲרֹן
  choice: क्योंकि हारून ने उन्हें बेलगाम छोड़ दिया था
  rationale: यहाँ उसी मूल פרע की पुनरावृत्ति है और हारून कर्ता है। ‘बेलगाम’ दोहराकर मूल का शब्द-संबंध रखा गया है, जबकि ‘छोड़ दिया था’ हारून की जिम्मेदारी बताता है पर जानबूझकर कराए जाने का अर्थ नहीं थोपता।
- source_word: לְשִׁמְצָה
  choice: उपहास का विषय
  rationale: שִׁמְצָה तिरस्कार, हँसी या निंदात्मक चर्चा का लक्ष्य होने का भाव रखता है। ‘उपहास का विषय’ आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: בְּקָמֵיהֶם
  choice: अपने विरोधियों के सामने
  rationale: קום के कृदन्त रूप का शाब्दिक भाव ‘उनके विरुद्ध उठनेवाले’ है; प्रसंग में इससे उनके विरोधी अभिप्रेत हैं। ‘सामने’ בְּ के परिस्थिति/उपस्थिति-संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: פרע में नैतिक अथवा सामाजिक अर्थ की सीमा
  choice: ‘बेलगाम’—अर्थात नियंत्रण और संयम से बाहर
  alternative: ‘निरंकुश’, ‘खुला छोड़ दिया गया’, अथवा ‘नंगा/उघड़ा हुआ’
  rationale: इस प्रसंग में मूल शब्द मुख्यतः अनुशासन टूटने और अव्यवस्था की ओर संकेत करता है। ‘नंगा’ अर्थ को अनावश्यक रूप से संकीर्ण कर सकता है; इसलिए व्यापक अर्थ रखा गया है और विकल्प पादटिप्पणी में बताया गया है।
- issue: לְשִׁמְצָה בְּקָמֵיהֶם का संबंध
  choice: लोग अपने विरोधियों के सामने उपहास का विषय बने
  alternative: उनके विरोधियों के बीच निंदा/तिरस्कार का कारण बने
  rationale: इब्रानी पदबंध उपहास, तिरस्कार या निंदात्मक चर्चा का भाव दे सकता है। मुख्य पाठ में सहज हिन्दी चुनी गई है, जबकि पादटिप्पणी अर्थ-सीमा को खुला रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘बेलगाम’ की पुनरावृत्ति मूल इब्रानी के शब्द-संबंध को सुनाई देती है। वाक्य के अंत का दीर्घ विराम-चिह्न अगले पद में जारी रहने वाली संरचना के अनुरूप रखा गया है।
