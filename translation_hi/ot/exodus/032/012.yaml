source:
  edition: WLC
  text: לָ/מָּה֩ יֹאמְר֨וּ מִצְרַ֜יִם לֵ/אמֹ֗ר בְּ/רָעָ֤ה הֽוֹצִיאָ/ם֙ לַ/הֲרֹ֤ג אֹתָ/ם֙ בֶּֽ/הָרִ֔ים וּ֨/לְ/כַלֹּתָ֔/ם מֵ/עַ֖ל פְּנֵ֣י הָֽ/אֲדָמָ֑ה שׁ֚וּב מֵ/חֲר֣וֹן אַפֶּ֔/ךָ וְ/הִנָּחֵ֥ם עַל הָ/רָעָ֖ה לְ/עַמֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/012.yaml
  text: Why should the Egyptians say[a], ‘He brought them out with evil intent, to kill them in the mountains and to wipe them off the face of the earth’? Turn from your burning anger[c][b], and relent concerning the harm intended for your people.
translation:
  language: hi
  text: मिस्री क्यों कहें[a], ‘वह उन्हें बुरी नीयत से बाहर निकाल लाया, ताकि उन्हें पहाड़ों में मार डाले और धरती के ऊपर से मिटा दे[b]’? अपने धधकते क्रोध से फिर, और अपनी प्रजा पर विपत्ति लाने से मन फेर ले[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मिस्री ऐसा क्यों कहें?” यहाँ अपूर्ण क्रिया मूसा की आलंकारिक विनती का भाव व्यक्त करती है।
    reason: रूपक प्रश्न में अपूर्ण क्रिया के सम्भावित भाव को दर्शाने वाला वैकल्पिक अनुवाद।
  - marker: b
    text: शाब्दिक रूप से, “और उन्हें पूरी तरह समाप्त कर दे”; यह क्रिया सम्पूर्ण विनाश का भाव रखती है।
    reason: मूल क्रिया के अधिक औपचारिक अर्थ को सुरक्षित रखना।
  - marker: c
    text: या, “अपनी प्रजा पर आनेवाली विपत्ति के विषय में पछता”; मूल में परमेश्वर के लिए मानव-सदृश भाषा प्रयुक्त हुई है।
    reason: धर्मवैचारिक रूप से महत्त्वपूर्ण वैकल्पिक वाचन और मूल अभिव्यक्ति की अस्पष्टता बताना।
lexical_decisions:
- source_word: לָמָּה יֹאמְרוּ מִצְרַיִם
  choice: मिस्री क्यों कहें
  rationale: लָמָּה के साथ अपूर्ण क्रिया यहाँ मूसा की आलंकारिक विनती व्यक्त करती है; ‘क्यों कहें’ आधुनिक हिन्दी में इसे स्वाभाविक रूप से रखता है।
- source_word: בְּרָעָה
  choice: बुरी नीयत से
  rationale: यहाँ पदबंध उस दुर्भावनापूर्ण उद्देश्य को व्यक्त करता है जिसका आरोप मिस्री परमेश्वर पर लगाएँगे; यह केवल बुरे परिणाम का संकेत नहीं है।
- source_word: הוֹצִיאָם
  choice: उन्हें ... निकाल ले गया
  rationale: हिफ़ील रूप निर्गमन के संदर्भ में बाहर निकालने की कारक क्रिया व्यक्त करता है।
- source_word: בֶּהָרִים
  choice: पहाड़ों में
  rationale: बहुवचन संज्ञा का सीधा और स्वाभाविक अनुवाद।
- source_word: וּלְכַלֹּתָם מֵעַל פְּנֵי הָאֲדָמָה
  choice: धरती पर से उनका नामो-निशान मिटा दे
  rationale: כלה का पिएल रूप पूर्ण विनाश बताता है; हिन्दी मुहावरा आगामी ‘धरती पर से’ के साथ सम्पूर्ण उन्मूलन का भाव स्पष्ट करता है।
- source_word: שׁוּב מֵחֲרוֹן אַפֶּךָ
  choice: अपने धधकते क्रोध से फिर जा
  rationale: आज्ञार्थक שׁוּב क्रोध से हटने की विनती है; ‘धधकता क्रोध’ मूल की ताप-संबंधी रूपकात्मकता बचाता है।
- source_word: וְהִנָּחֵם עַל הָרָעָה לְעַמֶּךָ
  choice: अपनी प्रजा पर विपत्ति लाने से मन फेर ले
  rationale: נחם की यहाँ प्रयुक्त विनती और רעה की दंडात्मक विपत्ति—दोनों को सहज हिन्दी में व्यक्त करता है, बिना नैतिक बुराई आरोपित किए।
theological_decisions:
- issue: וְהִנָּחֵם में परमेश्वर के लिए मानव-सदृश भावभाषा
  choice: मन फेर ले
  alternative: पछता; विपत्ति न लाने का निश्चय कर
  rationale: ‘मन फेर ले’ मूसा की वास्तविक विनती और पाठ का धर्मवैचारिक तनाव बनाए रखता है, पर यह संकेत नहीं देता कि परमेश्वर ने कोई नैतिक भूल की थी।
- issue: परमेश्वर की धमकी दी हुई कार्रवाई के लिए הָרָעָה
  choice: विपत्ति
  alternative: हानि; अनिष्ट; बुराई
  rationale: ‘विपत्ति’ लोगों पर आने वाले विनाशकारी न्याय को व्यक्त करती है और परमेश्वर में नैतिक बुराई का अनुचित अर्थ उत्पन्न नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण पर सहज स्तर रखा गया है। ‘मिस्री’, ‘बुरी नीयत’, ‘नामो-निशान मिटा दे’ और ‘मन फेर ले’ सामान्य पाठक के लिए स्पष्ट हैं; क्रोध की मूल रूपकात्मक तीव्रता ‘धधकते’ से सुरक्षित है। सभी पाद-टिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
