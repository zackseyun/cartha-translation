  text: וַ/יְחַ֣ל מֹשֶׁ֔ה אֶת פְּנֵ֖י יְהוָ֣ה אֱלֹהָ֑י/ו וַ/יֹּ֗אמֶר לָ/מָ֤ה יְהוָה֙ יֶחֱרֶ֤ה אַפְּ/ךָ֙ בְּ/עַמֶּ֔/ךָ אֲשֶׁ֤ר הוֹצֵ֨אתָ֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם בְּ/כֹ֥חַ גָּד֖וֹל וּ/בְ/יָ֥ד חֲזָקָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/011.yaml
  text: But Moses pleaded with Yahweh his God and said[a], “Why, Yahweh, should your anger burn against your people[b], whom you brought out of the land of Egypt with great power and with a strong hand?”
translation:
  language: hi
  text: परन्तु मूसा ने अपने परमेश्वर यहोवा से विनती की[a], “हे यहोवा, तेरा क्रोध तेरी प्रजा पर क्यों भड़के, जिसे तू बड़े सामर्थ्य और शक्तिशाली हाथ से मिस्र देश से निकाल लाया है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में यह एक मुहावरा है जिसका अर्थ यहोवा से अनुग्रह के लिए गंभीर विनती करना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַל ... אֶת־פְּנֵי
  choice: से विनती की
  rationale: यह पूरा इब्रानी मुहावरा शाब्दिक रूप से ‘मुख को खोजा/मनाया’ है और किसी की कृपा पाने के लिए उससे गंभीर निवेदन करने का भाव देता है। ‘से विनती की’ आधुनिक हिन्दी में स्वाभाविक और तात्कालिक आग्रह के अनुरूप है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, न कि केवल किसी उपाधि से।
- source_word: אֱלֹהָיו
  choice: अपने परमेश्वर
  rationale: एकवचन प्रत्यय मूसा के परमेश्वर को दर्शाता है; ‘अपने परमेश्वर’ हिन्दी में संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: יֶחֱרֶה אַפְּךָ
  choice: तेरा क्रोध ... क्यों भड़के
  rationale: इब्रानी में क्रोध के जलने का देहात्मक मुहावरा है। ‘क्रोध भड़कना’ उसके ताप और तीव्रता के रूपक को बनाए रखते हुए सहज हिन्दी देता है।
- source_word: בְּעַמֶּךָ
  choice: तेरी प्रजा पर
  rationale: क्रोध के साथ בְּ विरोध या लक्ष्य का भाव रखता है; ‘पर’ हिन्दी में स्वाभाविक है। ‘तेरी प्रजा’ मूसा की वाचा-संबंधी अपील को सुरक्षित रखता है।
- source_word: אֲשֶׁר הוֹצֵאתָ
  choice: जिसे तू ... निकाल लाया है
  rationale: सम्बन्धवाचक पद प्रजा की ओर लौटता है। ‘निकाल लाया’ निर्गमन की क्रिया और गन्तव्य की ओर ले आने—दोनों का स्वाभाविक हिन्दी रूप है।
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: मिस्र देश से
  rationale: मूल के ‘मिस्र की भूमि’ को संक्षिप्त किन्तु औपचारिक हिन्दी ‘मिस्र देश’ में सुरक्षित रखा गया है।
- source_word: בְּכֹחַ גָּדוֹל
  choice: बड़े सामर्थ्य से
  rationale: करणवाचक בְּ को ‘से’ द्वारा और כֹּחַ גָּדוֹל को सीधे ‘बड़े सामर्थ्य’ द्वारा व्यक्त किया गया है।
- source_word: וּבְיָד חֲזָקָה
  choice: बलवन्त हाथ से
  rationale: ‘हाथ’ का मूल रूपक बनाए रखा गया है। ‘बलवन्त’ חֲזָקָה के मजबूत/शक्तिशाली अर्थ को गरिमापूर्ण हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के क्रोध की मानवरूपी भाषा
  choice: ‘तेरा क्रोध ... भड़के’ द्वारा ताप का रूपक बनाए रखना
  alternative: ‘तू क्रोधित क्यों हो’
  rationale: मूल पाठ क्रोध को जलने के रूप में चित्रित करता है। चुना हुआ रूप उस आलंकारिक तीव्रता और मूसा की साहसपूर्ण मध्यस्थता को बनाए रखता है, बिना ‘नाक जलने’ जैसा अस्वाभाविक अतिशाब्दिक अनुवाद किए।
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: हिन्दी पाठकों के लिए परिचित व्यक्तिगत नाम ‘यहोवा’ मूल में आए नाम को उपाधि में बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- issue: मूसा की विनती और ईश्वरीय निर्णय के बीच तनाव
  choice: विनती को वास्तविक, गंभीर अपील के रूप में रखना
  alternative: ऐसा शब्दांकन जो पहले से तय परिणाम या परमेश्वर को छलपूर्वक मनाने का संकेत दे
  rationale: पद मूसा की मध्यस्थता को सीधे प्रस्तुत करता है। अनुवाद यह निर्धारित नहीं करता कि इस अपील से ईश्वरीय इच्छा में किस दार्शनिक अर्थ में परिवर्तन होता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण बाइबलीय शैली रखी गई है। परमेश्वर के लिए निकट, एकवचन सम्बोधन ‘तू/तेरा’ मूल के एकवचन रूप और पारंपरिक हिन्दी धार्मिक प्रयोग के अनुरूप है। वाक्य-संरचना सरल रखी गई, जबकि ‘क्रोध भड़के’, ‘बड़े सामर्थ्य’ और ‘बलवन्त हाथ’ मूल की काव्यात्मक तथा अलंकारिक शक्ति बनाए रखते हैं।
