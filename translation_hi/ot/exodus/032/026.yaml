  text: וַ/יַּעֲמֹ֤ד מֹשֶׁה֙ בְּ/שַׁ֣עַר הַֽ/מַּחֲנֶ֔ה וַ/יֹּ֕אמֶר מִ֥י לַ/יהוָ֖ה אֵלָ֑/י וַ/יֵּאָסְפ֥וּ אֵלָ֖י/ו כָּל בְּנֵ֥י לֵוִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/026.yaml
  text: Then Moses stood at the gate of the camp and said[a], “Whoever is for Yahweh[b], come to me.” And all the sons of Levi gathered to him.
translation:
  language: hi
  text: तब मूसा छावनी के फाटक पर खड़ा हुआ और बोला, “जो कोई याहवे के पक्ष में है, वह मेरे पास आए[a]!” और लेवी के सभी पुत्र[b] उसके पास इकट्ठे हो गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में शाब्दिक रूप से: “याहवे की ओर कौन है? मेरे पास!” हिन्दी अनुवाद में निहित बुलावे को स्पष्ट किया गया है।'
    reason: lexical_alternative
  - marker: b
    text: 'या, “सभी लेवीवंशी।” इब्रानी में शाब्दिक रूप से: “लेवी के सभी पुत्र।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: खड़ा हुआ
  rationale: עמד का सामान्य कथात्मक अर्थ किसी स्थान पर खड़ा होना है। यह स्वाभाविक हिन्दी है और इससे अनावश्यक औपचारिक या सैनिक भाव नहीं जुड़ता।
- source_word: בְּשַׁעַר הַמַּחֲנֶה
  choice: छावनी के फाटक पर
  rationale: שַׁעַר के ठोस अर्थ ‘फाटक’ को बनाए रखा गया है; בְּ का प्रसंगानुकूल हिन्दी रूप ‘पर’ है।
- source_word: מִי לַיהוָה
  choice: जो कोई याहवे के पक्ष में है
  rationale: शाब्दिक रचना ‘याहवे की ओर कौन है?’ है। प्रसंग में यह जानकारी माँगने वाला प्रश्न नहीं, निष्ठा प्रकट करने का आह्वान है; ‘के पक्ष में’ इस भाव को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम का देवनागरी लिप्यंतरण किया गया है, किसी उपाधि से उसका प्रतिस्थापन नहीं किया गया।
- source_word: אֵלַי
  choice: वह मेरे पास आए
  rationale: इब्रानी में केवल ‘मेरे पास!’ है और गति की क्रिया निहित है। हिन्दी में आह्वान को पूरा और स्वाभाविक बनाने के लिए ‘आए’ जोड़ा गया है।
- source_word: וַיֵּאָסְפוּ
  choice: इकट्ठे हो गए
  rationale: निफ़अल रूप यहाँ एकत्र होने को बताता है। यह तटस्थ और सहज हिन्दी है तथा इसमें अनावश्यक सैनिक भाव नहीं आता।
- source_word: אֵלָיו
  choice: उसके पास
  rationale: אֶל का मूल दिशात्मक अर्थ किसी व्यक्ति की ओर या उसके पास जाना है; ‘उसके चारों ओर’ जैसी व्याख्यात्मक वृद्धि आवश्यक नहीं।
- source_word: כָּל בְּנֵי לֵוִי
  choice: लेवी के सभी पुत्र
  rationale: मूल पाठ के स्पष्ट वंश-सूचक, पुल्लिंग पदबंध को बनाए रखा गया है। टिप्पणी स्पष्ट करती है कि इसका आशय लेवीवंशी पुरुषों से है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत वाचा-नाम है। उसे उपाधि ‘प्रभु’ से बदलने के बजाय देवनागरी में ‘याहवे’ लिखा गया है।
- issue: מִי לַיהוָה में निष्ठा अथवा संबंध का भाव
  choice: जो कोई याहवे के पक्ष में है
  alternative: कौन याहवे का है?; कौन याहवे की ओर है?
  rationale: לַיהוָה में पक्षधरता और संबंध, दोनों की छाया हो सकती है। तत्काल प्रसंग में मूसा निष्ठा के अनुसार अपने पास आने को कह रहा है, इसलिए ‘के पक्ष में’ चुना गया; शाब्दिक संक्षिप्तता पादटिप्पणी में सुरक्षित है।
- issue: בְּנֵי לֵוִי का लिंग और वंश-सूचक रूप
  choice: लेवी के सभी पुत्र
  alternative: सभी लेवीवंशी; सभी लेवीय
  rationale: स्रोत में ‘पुत्र’ का स्पष्ट पुल्लिंग वंश-सूचक पद है। उसे सामान्य जाति-संज्ञा में समतल न करके मुख्य पाठ में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘छावनी’, ‘फाटक’ और ‘इकट्ठे हो गए’ सामान्य पाठक के लिए स्पष्ट हैं। मूल की संक्षिप्त पुकार को स्वाभाविक हिन्दी वाक्य में खोला गया है, जबकि उसका शाब्दिक रूप पादटिप्पणी में दिया गया है।
