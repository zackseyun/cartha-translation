  yaml_path: translation/ot/exodus/032/016.yaml
  text: The tablets were the work of God[a], and the writing was the writing of God, engraved on the tablets.
translation:
  language: hi
  text: वे पटियाएँ परमेश्वर की कारीगरी थीं[a], और वह लेख परमेश्वर का लेख था, जो पटियाओं पर उकेरा हुआ था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर की बनाई हुई थीं ... परमेश्वर का लिखा हुआ था।” इब्रानी में बल देने के लिए “कारीगरी” और “लेख” जैसे संज्ञात्मक पदबंध प्रयुक्त हुए हैं।
    reason: शाब्दिक विकल्प और मूल की बलसूचक रचना स्पष्ट करना।
lexical_decisions:
- source_word: הַלֻּחֹת
  choice: पटियाएँ
  rationale: यहाँ शब्द वाचा की पटियाओं को दर्शाता है। इस पद में पत्थर स्पष्ट रूप से नहीं कहा गया, इसलिए उसे जोड़ा नहीं गया।
- source_word: מַעֲשֵׂה אֱלֹהִים
  choice: परमेश्वर की कारीगरी
  rationale: संज्ञात्मक इब्रानी पदबंध ‘परमेश्वर का काम/कारीगरी’ को बनाए रखता है और पटियाओं की उत्पत्ति सीधे परमेश्वर से बताता है।
- source_word: הֵמָּה
  choice: थीं
  rationale: स्वतंत्र सर्वनाम का बल हिन्दी में स्वाभाविक विधेय-वाक्य और स्त्रीलिंग बहुवचन क्रिया से पर्याप्त रूप से व्यक्त होता है।
- source_word: הַמִּכְתָּב
  choice: वह लेख
  rationale: यह लिखी हुई सामग्री अथवा अभिलेख को दर्शाता है; ‘लेख’ अगले समान शब्द की पुनरावृत्ति बनाए रखता है।
- source_word: מִכְתַּב אֱלֹהִים
  choice: परमेश्वर का लेख
  rationale: मूल पाठ की जानबूझकर की गई ‘लेख ... लेख’ पुनरावृत्ति को सुरक्षित रखा गया है।
- source_word: הוּא
  choice: था
  rationale: इब्रानी का पुनरुक्त/बलसूचक सर्वनाम हिन्दी में ‘वह लेख ... था’ की रचना द्वारा स्वाभाविक रूप से व्यक्त है।
- source_word: חָרוּת
  choice: उकेरा हुआ
  rationale: यह काटकर या खोदकर अंकित किए गए लेख को बताता है; ‘उकेरा हुआ’ पत्थर की पटियाओं के संदर्भ में सटीक और सामान्य हिन्दी है।
- source_word: עַל הַלֻּחֹת
  choice: पटियाओं पर
  rationale: स्थानवाचक अर्थ को सीधे और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְ
  choice: और
  rationale: दूसरे खंड को पहले से जोड़ने वाला संयोजक स्पष्ट रूप से रखा गया है; पद के आरम्भिक संयोजक को हिन्दी में अलग से देना आवश्यक नहीं, क्योंकि संदर्भगत निरंतरता बनी रहती है।
theological_decisions:
- issue: पटियाओं और लेख के कर्तृत्व का संबंध
  choice: पटियाएँ ‘परमेश्वर की कारीगरी’ और लेख ‘परमेश्वर का लेख’ कहा गया है।
  alternative: 'अधिक क्रियात्मक अनुवाद: ‘पटियाएँ परमेश्वर ने बनाई थीं और लेख परमेश्वर ने लिखा था।’'
  rationale: मूल इब्रानी दोनों स्थानों पर संज्ञात्मक पदबंधों का प्रयोग करता है। उन्हें बनाए रखने से दोनों वस्तुओं का परमेश्वर से सीधा संबंध और मूल का अलंकारिक बल सुरक्षित रहता है, बिना कर्तृत्व की रीति के बारे में अतिरिक्त व्याख्या जोड़े।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी अपनाई गई है। ‘पटियाएँ’ संदर्भ के लिए पर्याप्त है; इस पद में अनुपस्थित ‘पत्थर’ नहीं जोड़ा गया। ‘लेख ... लेख’ की कुछ असामान्य पुनरावृत्ति जानबूझकर रखी गई है ताकि इब्रानी का बल न मिटे।
