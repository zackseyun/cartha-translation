  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֶל מֹשֶׁ֑ה מִ֚י אֲשֶׁ֣ר חָֽטָא לִ֔/י אֶמְחֶ֖/נּוּ מִ/סִּפְרִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/033.yaml
  text: And Yahweh said to Moses[a], “Whoever has sinned against me[b], I will blot him out of my book.”
translation:
  language: hi
  text: तब याहवे ने मूसा से कहा, “जिसने मेरे विरुद्ध पाप किया है, उसी को मैं अपनी पुस्तक[b] में से मिटा दूँगा[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मैं उसे अपनी पुस्तक से मिटा दूँगा।”
    reason: lexical_alternative
  - marker: b
    text: “मेरी पुस्तक” से आशय परमेश्वर की देखरेख में रहने वालों के अभिलेख से हो सकता है; कुछ लोग इसे अधिक विशेष रूप से “जीवन की पुस्तक” समझते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमागत रूप कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में इस कथात्मक क्रम को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: यह परमेश्वर के व्यक्तिगत नाम के चार इब्रानी व्यंजनों का प्रचलित हिन्दी लिप्यंतरण है; इसे किसी उपाधि से नहीं बदला गया है।
- source_word: אֶל מֹשֶׁה
  choice: मूसा से
  rationale: हिन्दी में बोलने की क्रिया के साथ ‘मूसा से कहा’ स्वाभाविक है और इब्रानी संबंध को ठीक व्यक्त करता है।
- source_word: מִי אֲשֶׁר
  choice: जिसने ... उसी को
  rationale: यह अनिश्चित संबंधवाचक रचना को हिन्दी की स्वाभाविक सहसंबंधी संरचना में व्यक्त करता है और दोषी व्यक्ति पर दिए गए बल को बनाए रखता है।
- source_word: חָטָא לִי
  choice: मेरे विरुद्ध पाप किया है
  rationale: लामेद यहाँ पाप के लक्ष्य को दर्शाता है; पूर्ण क्रिया को संदर्भानुसार ‘किया है’ से व्यक्त किया गया है।
- source_word: אֶמְחֶנּוּ
  choice: उसी को मैं ... मिटा दूँगा
  rationale: מחה का अर्थ पोंछकर या लिखित अभिलेख से मिटाना है। ‘मिटा दूँगा’ पुस्तक के रूपक के साथ स्वाभाविक है और एकवचन कर्म को बनाए रखता है।
- source_word: מִסִּפְרִי
  choice: अपनी पुस्तक में से
  rationale: מִן निष्कासन या अलग किए जाने का भाव देता है, और סֵפֶר का सामान्य अर्थ ‘पुस्तक’ है। ‘अपनी’ हिन्दी में कर्ता याहवे की पुस्तक का संबंध स्पष्ट करती है।
theological_decisions:
- issue: ‘मेरी पुस्तक’ का आशय
  choice: मुख्य पाठ में केवल ‘अपनी पुस्तक’ का रूपक रखा गया है।
  alternative: ‘जीवन की पुस्तक’, ‘जीवित लोगों का अभिलेख’ या ‘वाचा में सम्मिलित लोगों की सूची’
  rationale: इब्रानी पाठ पुस्तक के स्वरूप को अधिक स्पष्ट नहीं करता। इसलिए किसी विशेष उद्धार-सिद्धांत या व्याख्या को मुख्य पाठ में नहीं जोड़ा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘याहवे’ व्यक्तिगत दिव्य नाम को सुरक्षित रखता है। संबंधवाचक ‘जिसने ... उसी को’ दोषी व्यक्ति और उसके परिणाम के बीच स्पष्ट बल देता है। पादटिप्पणी-चिह्न संबंधित शब्दों के तुरंत बाद रखे गए हैं।
