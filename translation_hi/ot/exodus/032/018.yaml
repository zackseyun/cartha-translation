  text: וַ/יֹּ֗אמֶר אֵ֥ין קוֹל֙ עֲנ֣וֹת גְּבוּרָ֔ה וְ/אֵ֥ין ק֖וֹל עֲנ֣וֹת חֲלוּשָׁ֑ה ק֣וֹל עַנּ֔וֹת אָנֹכִ֖י שֹׁמֵֽעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/018.yaml
  text: And he said[a], “It is not the sound of a cry of victory, and it is not the sound of a cry of defeat; I hear the sound of singing.”
translation:
  language: hi
  text: उसने कहा, “यह न विजय की जयकार है, न हार की चीख; मुझे गाने[a] की आवाज़ सुनाई दे रही है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पुकारने की आवाज़।” ענה से बने ये हिब्रू रूप प्रत्युत्तर में निकली आवाज़ या पुकार को भी दर्शा सकते हैं; इसलिए अंतिम वाक्यांश का अधिक सामान्य अनुवाद “मुझे पुकारने की आवाज़ सुनाई दे रही है” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲנוֹת / עַנּוֹת
  choice: जयकार / चीख / गाने
  rationale: इन रूपों का संबंध मुख से निकली प्रत्युत्तरात्मक ध्वनि, पुकार या गान से हो सकता है। विजय और हार के साथ पहले दो प्रयोग युद्ध की जयकार और पराजितों की चीख को व्यक्त करते हैं; अंतिम प्रयोग बछड़े के चारों ओर उत्सव के प्रसंग में गाने के अर्थ में स्वाभाविक है। संभावित व्यापक अर्थ को पादटिप्पणी में रखा गया है।
- source_word: גְּבוּרָה
  choice: विजय
  rationale: शब्द का मूल अर्थ सामर्थ्य या वीरता है, पर युद्ध-संबंधी विरोध में यह विजयी पक्ष की पुकार को सूचित करता है।
- source_word: חֲלוּשָׁה
  choice: हार
  rationale: यह शब्द दुर्बलता से संबंधित है, किंतु גְּבוּרָה के विरोध और छावनी से आती ध्वनि के प्रसंग में युद्ध में पराजित होने का भाव देता है।
- source_word: קוֹל
  choice: आवाज़
  rationale: यह तीनों प्रयोगों में सुनाई देने वाली ध्वनि के लिए सहज आधुनिक हिन्दी है और स्पष्ट वाणी का अनावश्यक संकेत नहीं देता।
- source_word: אֵין
  choice: यह न ... है
  rationale: दोहराए गए निषेध को स्वाभाविक हिन्दी में समानांतर रचना के रूप में रखा गया है।
- source_word: אָנֹכִי שֹׁמֵעַ
  choice: मुझे ... सुनाई दे रही है
  rationale: सर्वनाम और कृदंत वर्तमान अनुभूति व्यक्त करते हैं; यह हिन्दी में वर्तमान श्रवण का स्वाभाविक रूप है।
- source_word: וַיֹּאמֶר
  choice: उसने कहा
  rationale: हिब्रू कथात्मक क्रम को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
