  yaml_path: translation/ot/exodus/032/021.yaml
  text: Moses said to Aaron[a], “What did this people do to you, that you have brought a great sin upon them?”
translation:
  language: hi
  text: मूसा ने हारून से कहा, “इन लोगों ने तुम्हारे साथ क्या किया था कि तुमने उन पर इतना बड़ा पाप ला दिया?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ने ... कहा
  rationale: वय्यिक्तोल कथात्मक रूप को स्वाभाविक हिन्दी भूतकाल में व्यक्त किया गया है; आरम्भिक संयोजक का अलग अनुवाद आवश्यक नहीं।
- source_word: מֶה עָשָׂה לְךָ הָעָם הַזֶּה
  choice: इन लोगों ने तुम्हारे साथ क्या किया था
  rationale: עָשָׂה לְ का अर्थ यहाँ किसी के साथ कुछ करना है। हिन्दी में सामूहिक एकवचन ‘यह प्रजा’ की अपेक्षा ‘इन लोगों’ अधिक स्वाभाविक है और הַזֶּה का संकेत भी बनाए रखता है। ‘किया था’ अगली परिणामी उपवाक्य की पृष्ठभूमि स्पष्ट करता है।
- source_word: כִּי
  choice: कि
  rationale: 'यह प्रश्न के परिणामी आशय को जोड़ता है: उन्होंने ऐसा क्या किया कि हारून ने उन पर बड़ा पाप ला दिया।'
- source_word: הֵבֵאתָ
  choice: तुमने ... ला दिया
  rationale: בוא के हिफ़ील रूप का मूल अर्थ ‘लाना’ है। ‘ला दिया’ पूर्ण हुई और लोगों को प्रभावित करने वाली क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עָלָיו
  choice: उन पर
  rationale: सर्वनाम रूपात्मक रूप से एकवचन है, पर सामूहिक संज्ञा הָעָם की ओर लौटता है; हिन्दी में अर्थानुसार बहुवचन ‘उन पर’ स्वाभाविक है।
- source_word: חֲטָאָה גְדֹלָה
  choice: इतना बड़ा पाप
  rationale: חֲטָאָה का सीधा अर्थ ‘पाप’ और גְדֹלָה का ‘बड़ा’ है। प्रश्न के परिणामसूचक ढाँचे में ‘इतना’ फटकार की मात्रा को स्वाभाविक रूप से व्यक्त करता है, बिना पाप का स्वरूप बढ़ाकर बताने के।
theological_decisions:
- issue: हारून की दोषिता का स्वरूप
  choice: हारून ने लोगों पर बड़ा पाप ला दिया
  alternative: हारून ने लोगों से बड़ा पाप करवाया / उन पर बड़ा दोष लाद दिया
  rationale: इब्रानी पाठ हारून को लोगों पर חֲטָאָה גְדֹלָה लाने के लिए उत्तरदायी ठहराता है। ‘ला दिया’ इसी नैतिक आरोप को बनाए रखता है, पर कारणता को ‘पाप करवाया’ कहकर पाठ से अधिक स्पष्ट नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘इन लोगों’ मूसा की कुछ दूरी दर्शाने वाले संकेत को बनाए रखता है। कोई पादटिप्पणी आवश्यक नहीं, क्योंकि हिन्दी में सामूहिक संदर्भ के लिए ‘उन पर’ अर्थ और व्याकरण दोनों की दृष्टि से स्पष्ट है।
