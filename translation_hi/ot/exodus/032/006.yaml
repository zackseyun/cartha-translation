base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/006.yaml
  text: And they rose early the next day and offered burnt offerings and brought peace offerings. Then the people sat down to eat and drink[a], and rose up to revel.
translation:
  language: hi
  text: अगले दिन वे तड़के उठे और उन्होंने होमबलियाँ चढ़ाईं और मेलबलियाँ भेंट कीं। फिर लोग खाने-पीने बैठ गए और उच्छृंखल मौज-मस्ती करने[a] उठ खड़े हुए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “खेलने” अथवा “उत्सव मनाने।” इब्रानी क्रिया का अर्थ खेलना, उत्सव करना या उच्छृंखल आमोद में लगना हो सकता है; यहाँ का प्रसंग साधारण मनोरंजन से अधिक अव्यवस्थित उत्सव की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכִּימוּ מִמָּחֳרָת
  choice: अगले दिन वे तड़के उठे
  rationale: हिफ़िल क्रिया שׁכם का अर्थ प्रायः तड़के उठना है, और מִמָּחֳרָת अगले दिन को सूचित करता है। यह वाक्यांश समय के बल को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: וַיַּעֲלוּ עֹלֹת
  choice: होमबलियाँ चढ़ाईं
  rationale: बलिदान-संदर्भ में עלה और עֹלָה का यह प्रचलित तथा सटीक हिन्दी प्रतिरूप है; इसमें बलि के पूर्णतः जलाए जाने वाली श्रेणी का पारंपरिक नाम बना रहता है।
- source_word: וַיַּגִּשׁוּ שְׁלָמִים
  choice: मेलबलियाँ भेंट कीं
  rationale: נגשׁ यहाँ सामने लाने या अर्पित करने का अर्थ देता है। שְׁלָמִים के लिए ‘मेलबलियाँ’ शांति, सहभागिता और संगति से जुड़ी बलिदानी श्रेणी को संक्षेप में व्यक्त करता है।
- source_word: וַיֵּשֶׁב הָעָם לֶאֱכֹל וְשָׁתוֹ
  choice: लोग खाने-पीने बैठ गए
  rationale: ישׁב और उद्देश्यसूचक क्रियारूपों को सहज हिन्दी कथन में रखते हुए भोजन और पान की गतिविधि स्पष्ट की गई है।
- source_word: וַיָּקֻמוּ לְצַחֵק
  choice: रंगरलियाँ मनाने उठ खड़े हुए
  rationale: צחק का अर्थ खेलना, उत्सव करना या उच्छृंखल आमोद में लगना हो सकता है। बछड़े की उपासना और न्याय के प्रसंग में ‘रंगरलियाँ मनाने’ नकारात्मक उत्सवी भाव को व्यक्त करता है, पर यौन आचरण को अनावश्यक रूप से निश्चित नहीं करता।
theological_decisions:
- issue: सोने के बछड़े के प्रसंग में לְצַחֵק का भाव
  choice: रंगरलियाँ मनाने
  alternative: खेलने; उत्सव मनाने
  rationale: संदर्भ निर्दोष खेल से अधिक—मूर्तिपूजक भोज और उच्छृंखल उत्सव—की ओर संकेत करता है। चुना हुआ अनुवाद नैतिक तनाव बनाए रखता है, किंतु इस पद से अकेले किसी विशिष्ट यौन कृत्य का निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज हिन्दी। ‘होमबलियाँ’ और ‘मेलबलियाँ’ बलिदानी शब्दावली की निरंतरता रखते हैं। मुख्य पाठ में [a] उसी अस्पष्ट इब्रानी क्रिया पर लगाया गया है जिसकी वैकल्पिक व्याख्याएँ पादटिप्पणी में दी गई हैं।
