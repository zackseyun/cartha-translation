  text: And they made their lives bitter with hard labor in mortar and bricks and in every kind of field work—all their labor that they imposed on them with harshness[a].
translation:
  language: hi
  text: उन्होंने गारे और ईंटों के काम में, खेत के हर तरह के काम में, कठिन परिश्रम से उनका जीवन कड़वा कर दिया; वे उनसे जो भी काम करवाते थे, वह सब कठोरता से करवाते थे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “निर्दयता से।” इब्रानी शब्द कठोर और कुचल देने वाले दमन का बोध कराता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָרְרוּ אֶת חַיֵּיהֶם
  choice: उनका जीवन कड़वा कर दिया
  rationale: मूल की ‘कड़वा करना’ रूपक-भाषा को बनाए रखता है और पूरे जीवन-अनुभव पर पड़े प्रभाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בַּעֲבֹדָה קָשָׁה
  choice: कठिन परिश्रम
  rationale: עֲבֹדָה और קָשָׁה के श्रम तथा उसकी कठोर कठिनाई—दोनों अर्थों को सरल, वर्तमान हिन्दी में व्यक्त करता है।
- source_word: בְּחֹמֶר וּבִלְבֵנִים
  choice: गारे और ईंटों
  rationale: निर्माण के प्रसंग में חֹמֶר को ‘गारा’ और לְבֵנִים के वास्तविक बहुवचन को ‘ईंटों’ के रूप में रखा गया है।
- source_word: וּבְכָל עֲבֹדָה בַּשָּׂדֶה
  choice: खेत के हर प्रकार के काम
  rationale: כָל की व्यापकता बनाए रखते हुए खेत में किए जाने वाले विविध श्रम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֵת כָּל עֲבֹדָתָם אֲשֶׁר עָבְדוּ בָהֶם
  choice: उनका सारा काम, जो वे उनसे करवाते थे
  rationale: भारी और पुनरावृत्तिमूलक इब्रानी रचना को पूरी तरह हटाए बिना, मिस्रियों द्वारा इस्राएलियों से काम करवाने का भाव स्पष्ट करता है।
- source_word: בְּפָרֶךְ
  choice: कठोरता से
  rationale: यह कुचल देने वाली सख्ती और निर्दय दमन का अर्थ देता है; अधिक प्रबल शब्दार्थ को पादटिप्पणी में सुरक्षित रखा गया है।
