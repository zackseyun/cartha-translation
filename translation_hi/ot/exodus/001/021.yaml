base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/021.yaml
  text: And because the midwives feared God[a], he made households for them.
translation:
  language: hi
  text: और, क्योंकि दाइयाँ परमेश्वर का भय मानती थीं, उसने उनके लिए घराने दिए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक शाब्दिक रूप में, “उसने उनके लिए घर बनाए।” हिब्रू अभिव्यक्ति भौतिक घरों का अर्थ भी दे सकती है, पर यहाँ परिवारों या घरानों की स्थापना का संकेत हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: और क्योंकि
  rationale: यह पद पिछले कथन के परिणाम को कारण से जोड़ता है। ‘और क्योंकि’ हिब्रू संबंध को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יָרְאוּ
  choice: भय मानती थीं
  rationale: परमेश्वर के प्रति ירא में भय और श्रद्धा दोनों निहित हो सकते हैं। ‘भय मानना’ प्रचलित बाइबलीय अभिव्यक्ति है और इस अर्थ-तनाव को बनाए रखता है।
- source_word: הַמְיַלְּדֹת
  choice: दाइयाँ
  rationale: सप्रसंग निश्चित स्त्री-समूह के लिए आधुनिक हिन्दी का सीधा और स्वाभाविक शब्द।
- source_word: הָאֱלֹהִים
  choice: परमेश्वर
  rationale: संदर्भ में निश्चित रूप से इस्राएल के परमेश्वर का उल्लेख है; हिन्दी बाइबलीय शैली में ‘परमेश्वर’ स्वाभाविक है।
- source_word: וַיַּעַשׂ לָהֶם בָּתִּים
  choice: उसने उनके घराने बसाए
  rationale: शाब्दिक रूप ‘उनके लिए घर बनाए’ है, पर בָּתִּים यहाँ परिवार या वंशगत घराने का संकेत दे सकता है। ‘घराने बसाए’ रूपक को बनाए रखते हुए सम्भावित आशय स्पष्ट करता है।
theological_decisions:
- issue: ‘उसने उनके घराने बसाए’ का कर्ता और अर्थ
  choice: परमेश्वर ने दाइयों को परिवार/घराने देकर आशीष दी
  alternative: उसने उनके लिए भौतिक घर बनाए
  rationale: निकटवर्ती संदर्भ में परमेश्वर ही प्रत्याशित कर्ता है। ‘घर बनाना’ परिवार या वंश स्थापित करने का हिब्रू मुहावरा हो सकता है; फिर भी भौतिक घरों वाला अधिक शाब्दिक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘भय मानती थीं’ पारंपरिक धार्मिक मुहावरे को बनाए रखता है, जबकि ‘घराने बसाए’ शाब्दिक रूपक और प्रसंगगत अर्थ के बीच संतुलन रखता है।
