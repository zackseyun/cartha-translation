base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/022.yaml
  text: Then Pharaoh commanded all his people[a], saying, “Every son who is born you must throw into the Nile[c][b], but every daughter you must let live.”
translation:
  language: hi
  text: तब फ़िरौन ने अपनी सारी प्रजा को आज्ञा दी, “जो भी बेटा[b] पैदा हो, उसे नील नदी[a] में फेंक देना, पर[c] हर बेटी को जीवित रहने देना।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ ‘नदी’ है; निर्गमन की पुस्तक में यह शब्द सामान्यतः विशेष रूप से नील नदी के लिए आया है।
    reason: lexical_alternative
  - marker: b
    text: इस प्रसंग में ‘बेटा’ का अर्थ ‘बालक’ या ‘लड़का’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में शाब्दिक रूप से ‘और हर बेटी’ है; दोनों आदेशों के बीच विरोध दिखाने के लिए यहाँ ‘पर’ कहा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: आज्ञा दी
  rationale: צוה राजकीय आदेश देने को व्यक्त करता है; ‘आज्ञा दी’ औपचारिक होने के साथ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: פַּרְעֹה
  choice: फ़िरौन
  rationale: मिस्र के शासक की उपाधि का हिन्दी में प्रचलित रूप।
- source_word: לְכָל עַמּוֹ
  choice: अपनी सारी प्रजा को
  rationale: עַם का मूल अर्थ ‘लोग/प्रजा’ है। यहाँ फ़िरौन के अधीन मिस्री जनसमुदाय अभिप्रेत है; ‘प्रजा’ राजकीय प्रसंग को स्पष्ट और संक्षिप्त रूप से व्यक्त करता है।
- source_word: לֵאמֹר
  choice: प्रत्यक्ष कथन से व्यक्त
  rationale: इब्रानी का कथन-परिचायक रूप हिन्दी में उद्धरण आरम्भ करके स्वाभाविक रूप से व्यक्त हो जाता है; अलग से ‘यह कहते हुए’ जोड़ना अनावश्यक रूप से भारी होता।
- source_word: כָּל הַבֵּן הַיִּלּוֹד
  choice: जो भी बेटा पैदा हो
  rationale: यह रूप בֵּן ‘बेटा’ और ילד के निष्क्रिय अर्थ ‘पैदा हो’ को सुरक्षित रखता है तथा यह अनिर्दिष्टता नहीं मिटाता कि वाक्यांश में माता-पिता को दोबारा स्पष्ट नहीं किया गया।
- source_word: הַיְאֹרָה
  choice: नील नदी में
  rationale: יְאֹר का शाब्दिक अर्थ ‘नदी’ है, पर निर्गमन के मिस्री संदर्भ में इसका विशिष्ट संकेत नील नदी की ओर है। हिन्दी पाठक के लिए संदर्भ स्पष्ट करने हेतु ‘नील नदी’ चुना गया।
- source_word: תַּשְׁלִיכֻהוּ
  choice: उसे ... फेंक देना
  rationale: हिफ़ील बहुवचन आज्ञार्थक रूप और एकवचन पुल्लिंग कर्म-प्रत्यय दोनों को ‘उसे ... फेंक देना’ स्पष्ट रूप से व्यक्त करता है।
- source_word: וְכָל הַבַּת
  choice: पर हर बेटी
  rationale: וְ का मूल अर्थ ‘और’ है, किंतु यहाँ बेटों और बेटियों के प्रति विपरीत आदेशों के बीच विरोध है; हिन्दी में ‘पर’ उस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: תְּחַיּוּן
  choice: जीवित रहने देना
  rationale: חיה के पिएल रूप का यहाँ अर्थ ‘जीवित रखना/जीने देना’ है। ‘जीवित रहने देना’ मृत्यु के आदेश के साथ विरोध को साफ़ और सहज ढंग से व्यक्त करता है।
