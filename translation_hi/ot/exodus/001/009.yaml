  text: उसने अपनी प्रजा से कहा, “देखो, इस्राएल की सन्तानों का यह समुदाय संख्या में हमसे अधिक और हमसे शक्तिशाली है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: उसने ... कहा
  rationale: हिब्रू वय्यिक्तोल कथानक को आगे बढ़ाता है; हिन्दी में सामान्य भूतकाल स्वाभाविक रूप से वही कथात्मक प्रवाह व्यक्त करता है।
- source_word: אֶל עַמּוֹ
  choice: अपनी प्रजा से
  rationale: यहाँ עַם मिस्र के राजा के अधीन सामूहिक जनसमुदाय को दर्शाता है; ‘अपनी प्रजा’ आधुनिक हिन्दी में राजनीतिक संदर्भ को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הִנֵּה
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला सूचक अव्यय है; ‘देखो’ आधुनिक हिन्दी में इसके प्रत्यक्ष संबोधन-बल को बनाए रखता है।
- source_word: עַם בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल की सन्तानों के लोग
  rationale: यह चयन हिब्रू की संबंध-श्रृंखला ‘इस्राएल की सन्तानों के लोग’ और उसके पारिवारिक-जातीय संकेत को बनाए रखता है।
- source_word: רַב
  choice: अधिक
  rationale: מִמֶּנּוּ के साथ यह संख्या की तुलना व्यक्त करता है; हिन्दी में ‘हमसे अधिक’ जनसंख्या की अधिकता को संक्षेप और स्वाभाविक रूप में बताता है।
- source_word: וְעָצוּם
  choice: और शक्तिशाली
  rationale: עָצוּם सामर्थ्य या बल का बोध कराता है; ‘शक्तिशाली’ संख्या से अलग शक्ति की दूसरी विशेषता को सुरक्षित रखता है।
- source_word: מִמֶּנּוּ
  choice: हमसे
  rationale: מן के साथ प्रथम पुरुष बहुवचन प्रत्यय तुलना दर्शाता है; ‘हमसे’ दोनों विशेषणों से संबद्ध तुलनात्मक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
