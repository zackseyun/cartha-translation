  yaml_path: translation/ot/exodus/001/005.yaml
  text: And all the persons who came from Jacob’s loins were seventy persons[a], and Joseph was already in Egypt.
translation:
  language: hi
  text: याकूब के वंशजों की कुल संख्या सत्तर थी[a]; और यूसुफ पहले से मिस्र में था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “याकूब की जाँघ से निकले।” यह उसके प्रत्यक्ष वंशजों के लिए प्रयुक्त मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: थे
  rationale: यहाँ कथात्मक रूप में कुल संख्या बताई गई है। आधुनिक हिन्दी में सरल भूतकाल स्वाभाविक है; अलग से ‘और ऐसा हुआ’ कहना अनावश्यक और बोझिल होता।
- source_word: כָּל נֶפֶשׁ ... שִׁבְעִים נָפֶשׁ
  choice: सभी लोग कुल सत्तर थे
  rationale: इस संदर्भ में נֶפֶשׁ गिनती की इकाई के रूप में व्यक्तियों को दर्शाता है, न कि मनुष्य के किसी पृथक आध्यात्मिक अंश को। ‘लोग’ सहज आधुनिक हिन्दी है और ‘कुल’ संख्या-विधान को स्पष्ट करता है।
- source_word: יֹצְאֵי יֶרֶךְ יַעֲקֹב
  choice: याकूब के वंश से निकले
  rationale: इब्रानी मुहावरा शाब्दिक रूप से याकूब की ‘जाँघ से निकलने’ की बात करता है और उसके प्रत्यक्ष शारीरिक वंशजों को सूचित करता है। हिन्दी में ‘वंश से निकले’ मूल की उत्पत्ति-संबंधी छवि को कुछ हद तक बनाए रखते हुए अर्थ को स्वाभाविक ढंग से पहुँचाता है।
- source_word: שִׁבְעִים
  choice: सत्तर
  rationale: मूल पाठ की स्पष्ट संख्या का सीधा अनुवाद।
- source_word: וְיוֹסֵף הָיָה בְמִצְרָיִם
  choice: और यूसुफ पहले से मिस्र में था
  rationale: इसे गणना में जोड़े गए पदांश के बजाय एक अतिरिक्त कथन के रूप में रखा गया है। ‘पहले से’ याकूब के घराने के आगमन की अपेक्षा यूसुफ की पूर्व उपस्थिति को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: सत्तर की संख्या और यूसुफ का संबंध
  choice: यूसुफ के विषय में अलग समन्वयी वाक्यांश बनाए रखा गया
  alternative: ‘यूसुफ समेत सत्तर’ के रूप में संख्या में स्पष्टतः सम्मिलित करना
  rationale: इब्रानी पाठ पहले सत्तर व्यक्तियों का कथन करता है और फिर कहता है कि यूसुफ मिस्र में था। अनुवाद इस व्याकरणिक तनाव को बनाए रखता है और गणना की पद्धति को स्वयं से निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘प्राणी’ या ‘आत्माएँ’ की अपेक्षा ‘लोग’ सामान्य पाठक के लिए अधिक स्वाभाविक है। अर्धविराम दोनों जुड़े हुए, किंतु व्याकरणतः अलग कथनों को स्पष्ट रखता है।
