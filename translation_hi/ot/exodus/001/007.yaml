  text: וּ/בְנֵ֣י יִשְׂרָאֵ֗ל פָּר֧וּ וַֽ/יִּשְׁרְצ֛וּ וַ/יִּרְבּ֥וּ וַ/יַּֽעַצְמ֖וּ בִּ/מְאֹ֣ד מְאֹ֑ד וַ/תִּמָּלֵ֥א הָ/אָ֖רֶץ אֹתָֽ/ם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/007.yaml
  text: But the sons of Israel were fruitful and swarmed and multiplied and became exceedingly strong[b][a], so that the land was filled with them.
translation:
  language: hi
  text: पर[a] इस्राएल के पुत्र फलवन्त हुए, बहुतायत से फैल गए[b], बढ़ते गए और अत्यन्त सामर्थी हो गए; और देश उनसे भर गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और इस्राएल के पुत्र”; आरम्भिक इब्रानी संयोजक का अनुवाद “और” भी हो सकता है, पर “पर” पिछले पद के साथ विरोध को उभारता है।
    reason: alternative_reading
  - marker: b
    text: या, “झुंड की तरह उमड़ पड़े”; इब्रानी क्रिया झुंडों में उमड़ने या बहुतायत से फैलने की सजीव छवि जगाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: पर इस्राएल के पुत्र
  rationale: ‘इस्राएल के पुत्र’ मूल इब्रानी की पारिवारिक-राष्ट्रीय अभिव्यक्ति को बनाए रखता है। आरम्भिक संयोजक को पिछले पद में वर्णित मृत्यु के विपरीत उभरती वृद्धि के कारण ‘पर’ कहा गया है।
- source_word: פָּרוּ
  choice: फलवन्त हुए
  rationale: यह प्रजनन और फलने-फूलने का अर्थ रखता है तथा उत्पत्ति की आशीष-संबंधी भाषा की सम्भावित प्रतिध्वनि को बिना व्याख्यात्मक विस्तार के बनाए रखता है।
- source_word: וַיִּשְׁרְצוּ
  choice: बहुतायत से फैल गए
  rationale: क्रिया झुंड की तरह उमड़ने या असाधारण प्रचुरता से भर जाने का सजीव बोध देती है। मनुष्यों के लिए स्वाभाविक हिन्दी रखते हुए उस प्रचुरता को व्यक्त किया गया है।
- source_word: וַיִּרְבּוּ
  choice: बढ़ते गए
  rationale: यह संख्या में बहुत हो जाने को दर्शाता है और क्रमिक, तीव्र जनवृद्धि की लय बनाए रखता है।
- source_word: וַיַּעַצְמוּ בִּמְאֹד מְאֹד
  choice: अत्यन्त सामर्थी हो गए
  rationale: עצם का मूल भाव बलवान या सामर्थी होना है; दोहरे מְאֹד की तीव्रता ‘अत्यन्त’ से व्यक्त होती है। इसे केवल संख्या तक सीमित नहीं किया गया।
- source_word: וַתִּמָּלֵא הָאָרֶץ אֹתָם
  choice: और देश उनसे भर गया
  rationale: निष्क्रिय रूप और ‘देश’ को कर्ता बनाए रखा गया है। यहाँ הָאָרֶץ से आशय उनके निवास का देश है, सम्पूर्ण पृथ्वी नहीं। साधारण ‘और’ मूल वाक्य-संयोजन को सुरक्षित रखता है।
theological_decisions:
- issue: फलवन्त होने और बढ़ने की भाषा में सृष्टि/आशीष की सम्भावित प्रतिध्वनि
  choice: मुख्य पाठ में ‘फलवन्त हुए ... बढ़ते गए’ की शब्दावली रखी गई
  alternative: उत्पत्ति की आशीष का संकेत स्पष्ट करने के लिए व्याख्यात्मक शब्द जोड़ना
  rationale: इब्रानी शब्दावली सम्भवतः उत्पत्ति की आशीष को प्रतिध्वनित करती है, पर अनुवाद उस सम्बन्ध को शब्द-चयन द्वारा सुरक्षित रखता है; पाठ में अनुपस्थित धर्मवैज्ञानिक व्याख्या नहीं जोड़ता।
- issue: וַיַּעַצְמוּ का अर्थ
  choice: ‘अत्यन्त सामर्थी हो गए’
  alternative: ‘संख्या में अत्यन्त बढ़ गए’
  rationale: सन्दर्भ में जनसंख्या की शक्ति सम्मिलित हो सकती है, किन्तु क्रिया का व्यापक बल/सामर्थ्य-सूचक अर्थ सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘फलवन्त’ बाइबलीय प्रतिध्वनि के कारण रखा गया, जबकि ‘बहुतायत से फैल गए’ असामान्य इब्रानी बिम्ब को अत्यधिक कठोर या अपमानजनक हिन्दी बनाए बिना व्यक्त करता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
