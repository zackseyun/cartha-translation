    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבִדוּ
  choice: काम कराया
  rationale: עבד के हिफ़ील रूप का यहाँ कारक अर्थ है—किसी से काम या सेवा कराना। ‘काम कराया’ आधुनिक हिन्दी में स्वाभाविक है और केवल इसी क्रिया के आधार पर ‘दास बना लिया’ जैसी अधिक व्याख्यात्मक अभिव्यक्ति से बचता है।
- source_word: מִצְרַיִם
  choice: मिस्रियों
  rationale: यह रूप देश अथवा उसके लोगों को सूचित कर सकता है; यहाँ क्रिया के कर्ता के रूप में मिस्र के लोग अभिप्रेत हैं, इसलिए ‘मिस्रियों’ उपयुक्त है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: यह चयन इब्रानी की पारिवारिक और सामूहिक अभिव्यक्ति को बनाए रखता है। टिप्पणी में अधिक प्रचलित सामूहिक विकल्प दिए गए हैं।
- source_word: בְּפָרֶךְ
  choice: कठोरता के साथ
  rationale: פֶרֶךְ बेगार में बरती जाने वाली कठोर, कुचल देने वाली सख़्ती को व्यक्त करता है। यह अनुवाद בְּ द्वारा व्यक्त रीति को बनाए रखता है; ‘निर्दयता से’ भी अर्थानुकूल विकल्प है।
- source_word: וַ
  choice: तब
  rationale: कथात्मक क्रम में वाव को आधुनिक हिन्दी में ‘तब’ से व्यक्त करना प्रसंगगत अनुक्रम को स्वाभाविक ढंग से प्रकट करता है।
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל का सामूहिक वाचा-संबंधी पदनाम
  choice: इस्राएल के पुत्रों
  alternative: इस्राएली; इस्राएल की सन्तान
  rationale: मुख्य पाठ में स्रोत की वंशगत और सामूहिक संरचना सुरक्षित रखी गई है, जबकि पादटिप्पणी यह स्पष्ट करती है कि पूरा इस्राएली समुदाय अभिप्रेत है, केवल पुरुष या नाबालिग नहीं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘काम कराया’ कारक क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है; ‘कठोरता के साथ’ स्रोत की रीति-सूचक रचना को बनाए रखता है।
