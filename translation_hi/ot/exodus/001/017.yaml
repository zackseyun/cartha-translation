id: EXO.1.17
reference: Exodus 1:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/תִּירֶ֤אןָ הַֽ/מְיַלְּדֹת֙ אֶת הָ֣/אֱלֹהִ֔ים וְ/לֹ֣א עָשׂ֔וּ כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר אֲלֵי/הֶ֖ן מֶ֣לֶךְ מִצְרָ֑יִם וַ/תְּחַיֶּ֖יןָ אֶת הַ/יְלָדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/017.yaml
  text: But the midwives feared God[a], and did not do as the king of Egypt had told them; rather, they let the children live.
translation:
  language: hi
  text: परन्तु दाइयाँ परमेश्वर का भय मानती थीं। उन्होंने वैसा नहीं किया जैसा मिस्र के राजा ने उनसे कहा था, बल्कि बच्चों को जीवित रहने दिया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बच्चों को जीवित रखा।”
    reason: וַתְּחַיֶּיןָ के पिएल रूप का वैकल्पिक, समान रूप से संभव अनुवाद।
lexical_decisions:
- source_word: וַתִּירֶאןָ
  choice: भय मानती थीं
  rationale: मूल क्रिया ירא परमेश्वर के प्रति भय और श्रद्धा दोनों का भाव रखती है। हिंदी का प्रचलित बाइबलीय मुहावरा ‘परमेश्वर का भय मानना’ इस तनाव को केवल ‘आदर करना’ कहकर हल्का नहीं करता।
- source_word: הַמְיַלְּדֹת
  choice: दाइयाँ
  rationale: ילד से बना यह स्त्रीलिंग कृदंत यहाँ प्रसव कराने वाली स्त्रियों के लिए संज्ञा के रूप में प्रयुक्त है; ‘दाइयाँ’ स्वाभाविक और सटीक हिंदी है।
- source_word: אֶת־הָאֱלֹהִים
  choice: परमेश्वर
  rationale: इस प्रसंग में אֱלֹהִים सच्चे परमेश्वर को सूचित करता है। हिंदी में ‘परमेश्वर का भय मानना’ स्वाभाविक अभिव्यक्ति है।
- source_word: וְלֹא עָשׂוּ
  choice: उन्होंने ... नहीं किया
  rationale: नकार सहित עשׂה का सीधा अर्थ सुरक्षित रखा गया है और आगे आने वाली तुलना के साथ स्वाभाविक हिंदी वाक्य बनाया गया है।
- source_word: כַּאֲשֶׁר דִּבֶּר אֲלֵיהֶן
  choice: जैसा ... ने उनसे कहा था
  rationale: דבר का मूल अर्थ ‘बोलना’ है, पर आदेश के इस संदर्भ में ‘कहा था’ सहज रूप से वही आशय व्यक्त करता है।
- source_word: מֶלֶךְ מִצְרָיִם
  choice: मिस्र के राजा
  rationale: इब्रानी संबंध-संरचना का स्पष्ट और स्वाभाविक हिंदी रूप।
- source_word: וַתְּחַיֶּיןָ
  choice: जीवित रहने दिया
  rationale: חיה का पिएल रूप यहाँ किसी को जीवित रहने देने या जीवित रखने का अर्थ देता है। मुख्य पाठ में पहला स्वाभाविक विकल्प रखा गया है और दूसरा पादटिप्पणी में दिया गया है।
- source_word: הַיְלָדִים
  choice: बच्चों
  rationale: יְלָדִים शब्द अपने आप में ‘बच्चे’ दर्शाता है, यद्यपि पिछले संदर्भ से स्पष्ट है कि यहाँ निशाने पर लड़के थे। ‘बच्चों’ मूल शब्द की व्यापकता बनाए रखता है।
theological_decisions:
- issue: ‘परमेश्वर का भय मानना’ में אֱלֹהִים का अनुवाद
  choice: परमेश्वर
  alternative: उस परमेश्वर
  rationale: कथा-संदर्भ में संकेत सच्चे परमेश्वर की ओर है, पर हिंदी में निश्चितता दिखाने के लिए ‘उस’ जोड़ना अनावश्यक और अस्वाभाविक होगा।
- issue: दाइयों की प्रेरणा में भय और श्रद्धा का संबंध
  choice: भय मानती थीं
  alternative: श्रद्धा रखती थीं
  rationale: ‘भय मानना’ मूल ירא की वास्तविक भय-संबंधी धार को बनाए रखते हुए हिंदी के धार्मिक प्रयोग में श्रद्धापूर्ण अर्थ की गुंजाइश भी रखता है; इसे केवल ‘श्रद्धा’ कहना मूल के तनाव को कम कर देता।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘दाइयाँ’ और ‘बच्चों’ सामान्य पाठक के लिए सहज हैं; ‘परमेश्वर का भय मानना’ मूल मुहावरे और उसके श्रद्धापूर्ण भाव दोनों को सुरक्षित रखता है। अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्न ‘God’ के बाद था, पर पादटिप्पणी वַתְּחַיֶּיןָ से संबंधित है; इसलिए हिंदी मुख्य पाठ में चिह्न संबंधित वाक्यांश के बाद रखा गया है।
