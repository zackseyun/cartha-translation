  text: וַ/יָּשִׂ֤ימוּ עָלָי/ו֙ שָׂרֵ֣י מִסִּ֔ים לְמַ֥עַן עַנֹּת֖/וֹ בְּ/סִבְלֹתָ֑/ם וַ/יִּ֜בֶן עָרֵ֤י מִסְכְּנוֹת֙ לְ/פַרְעֹ֔ה אֶת פִּתֹ֖ם וְ/אֶת רַעַמְסֵֽס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/011.yaml
  text: 'So they set taskmasters over him to afflict him with their burdens[c][b][a], and he built storage cities for Pharaoh: Pithom and Rameses.'
translation:
  language: hi
  text: तब उन्होंने इस्राएल पर बेगार के अधिकारी नियुक्त किए, ताकि उसे उनके बोझों से सताएँ; और उसने[a] फ़िरौन के लिए भंडार-नगर[b]—पितोम और रामसेस[c]—बनाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा “उन पर,” “उन्हें” और “उन्होंने।” इब्रानी में एकवचन रूप (“उस पर,” “उसे,” “उसने”) इस्राएल को सामूहिक रूप से दर्शाते हैं।
    reason: alternative_reading
  - marker: b
    text: अथवा “संचय-नगर।”
    reason: lexical_alternative
  - marker: c
    text: “रामसेस” का अधिक अक्षरानुरूप रूप “राअमसेस” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: उन्होंने … नियुक्त किए
  rationale: שׂים यहाँ अधिकारियों को किसी के ऊपर ठहराने या नियुक्त करने के अर्थ में है; आधुनिक हिन्दी में “नियुक्त किए” स्पष्ट और स्वाभाविक है।
- source_word: עָלָיו
  choice: इस्राएल पर / उस पर
  rationale: इब्रानी प्रत्यय व्याकरणतः पुल्लिंग एकवचन है और इस्राएल को सामूहिक एकवचन मानता है। पहले उल्लेख में “इस्राएल” और आगे “उस पर” रखने से संदर्भ भी स्पष्ट रहता है और मूल की सामूहिक एकवचन शैली भी बचती है।
- source_word: שָׂרֵי מִסִּים
  choice: बेगार के अधिकारी
  rationale: यह पद जबरन श्रम या राजकीय बेगार की देखरेख करने वाले अधिकारियों को दर्शाता है। “बेगार के अधिकारी” सामान्य पाठक के लिए स्पष्ट है और केवल सामान्य पर्यवेक्षण की अपेक्षा दमनकारी श्रम-व्यवस्था को अधिक ठीक व्यक्त करता है।
- source_word: לְמַעַן עַנֹּתוֹ
  choice: ताकि … उसे सताएँ
  rationale: पिएल रूप ענה यहाँ दुःख देने, दबाने या सताने का भाव रखता है। “सताएँ” उद्देश्य और दमन की तीव्रता दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּסִבְלֹתָם
  choice: कठिन कामों का बोझ डालकर
  rationale: סִבְלֹת भार, बोझ ढोने और कठोर श्रम-दायित्व के अर्थ-क्षेत्र में आता है। यह चुनाव शारीरिक बोझ और दमनकारी श्रम—दोनों भावों को साथ रखता है, यद्यपि हिन्दी वाक्य को स्वाभाविक बनाने के लिए संबंध को स्पष्ट किया गया है।
- source_word: וַיִּבֶן
  choice: उसने … बनाए
  rationale: क्रिया रूप व्याकरणतः तीसरे पुरुष पुल्लिंग एकवचन है। इसे इस्राएल के सामूहिक एकवचन संदर्भ के रूप में सुरक्षित रखा गया है; बहुवचन सम्भावना पादटिप्पणी में दी गई है।
- source_word: עָרֵי מִסְכְּנוֹת
  choice: भंडार-नगर
  rationale: यह पद सामग्री, अन्न या रसद संचित करने वाले नगरों को दर्शाता है। “भंडार-नगर” संक्षिप्त, पारदर्शी और आधुनिक हिन्दी में बोधगम्य है।
- source_word: לְפַרְעֹה
  choice: फ़िरौन के लिए
  rationale: राजकीय उपाधि का मानक हिन्दी रूप रखते हुए लाभार्थी संबंध को सीधे व्यक्त किया गया है।
- source_word: פִּתֹם
  choice: पितोम
  rationale: स्थान-नाम का स्रोतानुकूल और हिन्दी में प्रचलित लिप्यंतरण।
- source_word: רַעַמְסֵס
  choice: रामसेस
  rationale: स्थान-नाम का हिन्दी में परिचित रूप अपनाया गया है; अधिक अक्षरानुरूप “राअमसेस” पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: इस्राएल के लिए इब्रानी सामूहिक एकवचन
  choice: “उस पर,” “उसे,” और “उसने” के द्वारा एकवचन रूप सुरक्षित रखा गया
  alternative: संदर्भानुसार “उन पर,” “उन्हें,” और “उन्होंने” करना
  rationale: मूल पाठ जानबूझकर इस्राएल को एक सामूहिक व्यक्ति के रूप में पुल्लिंग एकवचन में प्रस्तुत करता है। हिन्दी में यह कुछ असामान्य लग सकता है, इसलिए अर्थगत बहुवचन को पादटिप्पणी में रखा गया है, न कि मूल की संख्या को चुपचाप बदल दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। “बेगार” ऐतिहासिक जबरन श्रम को संक्षेप में व्यक्त करता है। मूल इब्रानी का सामूहिक एकवचन मुख्य पाठ में जानबूझकर सुरक्षित है और संभावित बहुवचन पाठ पादटिप्पणी में स्पष्ट किया गया है।
