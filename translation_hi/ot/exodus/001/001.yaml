base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/001.yaml
  text: These are the names of the sons of Israel who came to Egypt with Jacob[a], each man with his household.
translation:
  language: hi
  text: 'और[a] ये इस्राएल के उन बेटों के नाम हैं जो याकूब के साथ मिस्र आए थे: हर आदमी अपने घराने के साथ आया था।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ये इस्राएल के बेटों के नाम हैं।” इब्रानी पाठ एक संयोजक से आरंभ होता है, जो निर्गमन को उत्पत्ति की पूर्ववर्ती कथा से जोड़ता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: और ... ये हैं
  rationale: आरंभिक וְ को ‘और’ से व्यक्त किया गया है, जिससे उत्पत्ति की पिछली कथा के साथ इसका संबंध बना रहता है; ‘ये हैं’ नए खंड का स्वाभाविक परिचय देता है।
- source_word: שְׁמוֹת
  choice: नाम
  rationale: मूल संज्ञा का सीधा और स्वाभाविक अर्थ; यह पुस्तक के इब्रानी नाम से जुड़े विषयगत संकेत को भी बनाए रखता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के बेटे
  rationale: यहाँ गिने गए याकूब के पुरुष वंशजों के लिए ‘बेटे’ आधुनिक हिंदी में स्पष्ट और मूल के लिंग-विशिष्ट अर्थ के अनुरूप है।
- source_word: הַבָּאִים מִצְרָיְמָה
  choice: जो ... मिस्र आए थे
  rationale: इब्रानी कृदंत यहाँ अतीत में पहचाने गए समूह को दर्शाता है; ‘आए थे’ हिंदी कथन में स्वाभाविक है और दिशासूचक रूप को ‘मिस्र’ के साथ गति के रूप में व्यक्त करता है।
- source_word: אֵת יַעֲקֹב
  choice: याकूब के साथ
  rationale: यहाँ אֵת कर्मचिह्न नहीं, संगति का बोध कराता है।
- source_word: אִישׁ וּבֵיתוֹ
  choice: उनमें से हर एक अपने घराने के साथ
  rationale: אִישׁ का वितरणात्मक भाव ‘हर एक’ से और בַּיִת का पारिवारिक इकाई वाला अर्थ ‘घराने’ से व्यक्त होता है।
- source_word: בָּאוּ
  choice: आया था
  rationale: अंतिम क्रिया को छोड़ा नहीं गया; वितरणात्मक एकवचन ‘हर एक’ के अनुसार हिंदी में एकवचन क्रिया रखी गई है, जिससे मूल की पुनरुक्त संरचना भी अर्थपूर्ण ढंग से बनी रहती है।
