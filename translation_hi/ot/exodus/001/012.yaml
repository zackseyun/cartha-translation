base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/012.yaml
  text: But the more they afflicted them[a], the more they multiplied and the more they spread out[c][b], so that they dreaded the sons of Israel.
translation:
  language: hi
  text: परन्तु जितना अधिक वे इस्राएलियों को सताते गए, उतना ही अधिक वे बढ़ते और फैलते गए; और मिस्री इस्राएलियों से भयभीत हो गए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस्राएलियों से घृणा करने लगे।” मूल इब्रानी क्रिया भय, वितृष्णा या घृणा का भाव व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכַאֲשֶׁר ... כֵּן ... וְכֵן
  choice: परन्तु जितना अधिक ... उतना ही अधिक
  rationale: यह सहसंबंधी रचना उत्पीड़न बढ़ने के साथ इस्राएल की वृद्धि और विस्तार बढ़ने का अनुपात व्यक्त करती है; ‘परन्तु’ प्रसंग का विरोधाभास बनाए रखता है।
- source_word: יְעַנּוּ אֹתוֹ
  choice: वे इस्राएलियों को सताते गए
  rationale: पिएल रूप कठोर व्यवहार अथवा उत्पीड़न बताता है। एकवचन सर्वनाम सामूहिक ‘इस्राएल’ को सूचित करता है, जिसे स्वाभाविक हिन्दी में बहुवचन ‘इस्राएलियों को’ किया गया है।
- source_word: יִרְבֶּה
  choice: वे बढ़ते गए
  rationale: एकवचन क्रिया सामूहिक इस्राएल के लिए है और यहाँ मुख्यतः जनसंख्या-वृद्धि व्यक्त करती है।
- source_word: יִפְרֹץ
  choice: फैलते गए
  rationale: क्रिया तीव्र विस्तार या सीमाएँ तोड़कर फैलने का भाव रखती है; ‘फैलते गए’ आधुनिक हिन्दी में इसे सहजता से व्यक्त करता है।
- source_word: וַיָּקֻצוּ
  choice: वे ... भय और घृणा करने लगे
  rationale: קוץ भय, वितृष्णा अथवा घोर अरुचि का भाव व्यक्त कर सकता है। संयुक्त अभिव्यक्ति इसकी वास्तविक अर्थ-व्याप्ति को किसी एक भाव तक सीमित नहीं करती।
- source_word: מִפְּנֵי בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों से
  rationale: מִפְּנֵי यहाँ उनकी उपस्थिति के कारण अथवा उनके सामने होने वाली प्रतिक्रिया बताता है। בְּנֵי יִשְׂרָאֵל प्रचलित जातिनाम है, इसलिए ‘इस्राएली’ अधिक स्वाभाविक हिन्दी है।
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל का अनुवाद
  choice: इस्राएली
  alternative: इस्राएल के पुत्र / इस्राएल की सन्तान
  rationale: यहाँ पदबंध एक पूरे जातीय समुदाय का प्रचलित नाम है। ‘इस्राएली’ स्त्री-पुरुष सहित समुदाय को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि शाब्दिक ‘पुत्र’ अनावश्यक रूप से केवल पुरुषों का आभास दे सकता है।
- issue: קוץ में भय और घृणा की अर्थ-व्याप्ति
  choice: भय और घृणा करने लगे
  alternative: उनसे भय खाने लगे / उनसे घृणा करने लगे
  rationale: मूल क्रिया दोनों भावों की अनुमति देती है और प्रसंग किसी एक को निर्विवाद रूप से अलग नहीं करता; मुख्य पाठ में दोनों रखना इस वास्तविक अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, स्पष्ट और गरिमापूर्ण मानक हिन्दी। ‘सताते गए’, ‘बढ़ते गए’ और ‘फैलते गए’ जारी तथा अनुपातिक क्रिया का भाव देते हैं। मुख्य पाठ में सामूहिक ‘इस्राएल’ को स्वाभाविक जातिनाम ‘इस्राएली’ से व्यक्त किया गया है।
