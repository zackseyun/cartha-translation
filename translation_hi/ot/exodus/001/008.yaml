  text: A new king arose over Egypt[b][a], who did not know Yosef.
translation:
  language: hi
  text: मिस्र पर एक नया[a] राजा शासन करने लगा, जो योसेफ़ को नहीं जानता था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक दूसरा राजा”; इब्रानी विशेषण का शाब्दिक अर्थ “नया” है, पर कुछ लोग इसे अलग राजवंश या शासन के अर्थ में समझते हैं।
    reason: lexical_alternative
  - marker: b
    text: या, “योसेफ़ को मान्यता नहीं देता था”; यहाँ “जानना” केवल जानकारी न होने के बजाय उसे पहचानने या उसके महत्त्व का ध्यान रखने का भाव भी दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: उठा
  rationale: यह क्रिया कथा को आगे बढ़ाती है और किसी राजा के सत्ता में उभरने के लिए हिन्दी में स्वाभाविक रूप से प्रयुक्त हो सकती है; इससे इब्रानी क्रिया का बिंब भी बना रहता है।
- source_word: מֶלֶךְ
  choice: राजा
  rationale: यह इब्रानी संज्ञा का सीधा और सटीक अर्थ है।
- source_word: חָדָשׁ
  choice: नया
  rationale: विशेषण का मूल अर्थ ‘नया’ है। ‘दूसरा’ संभव व्याख्यात्मक अर्थ है, जिसे पादटिप्पणी में रखा गया है।
- source_word: עַל מִצְרָיִם
  choice: मिस्र पर
  rationale: עַל यहाँ राज्य पर अधिकार को व्यक्त करता है; ‘मिस्र पर’ इब्रानी संरचना और राजकीय प्रभुत्व दोनों को सुरक्षित रखता है।
- source_word: אֲשֶׁר לֹא יָדַע
  choice: जो ... को नहीं जानता था
  rationale: יָדַע का सामान्य अर्थ ‘जानना’ है। संदर्भ में मान्यता या महत्त्व स्वीकार न करने का भाव संभव है, पर मुख्य पाठ उस अस्पष्टता को खुला रखता है।
- source_word: יוֹסֵף
  choice: योसेफ़
  rationale: यह इब्रानी नाम का देवनागरी में सीधा लिप्यंतरण है।
theological_decisions:
- issue: क्या ‘नया राजा’ से राजवंश-परिवर्तन और ‘नहीं जानता था’ से जानबूझकर उपेक्षा स्पष्ट की जाए
  choice: 'मुख्य पाठ में सीधा कथन रखा गया है: ‘एक नया राजा ... जो योसेफ़ को नहीं जानता था।’'
  alternative: ‘दूसरा राजा/नया राजवंश’ और ‘जो योसेफ़ को मान्यता नहीं देता था।’
  rationale: पद राजवंश बदलने या जानबूझकर राजनीतिक उपेक्षा करने की बात स्पष्ट रूप से नहीं कहता। सीधा अनुवाद ऐतिहासिक और अभिप्रायगत अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक शैली रखी गई है। ‘सत्ता में आया’ अधिक व्याख्यात्मक होता, इसलिए स्रोत के क्रियात्मक बिंब को बचाने हेतु ‘उठा’ चुना गया है। नाम को इब्रानी उच्चारण के निकट ‘योसेफ़’ लिखा गया है।
