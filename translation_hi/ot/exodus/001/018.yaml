  text: וַ/יִּקְרָ֤א מֶֽלֶךְ מִצְרַ֨יִם֙ לַֽ/מְיַלְּדֹ֔ת וַ/יֹּ֣אמֶר לָ/הֶ֔ן מַדּ֥וּעַ עֲשִׂיתֶ֖ן הַ/דָּבָ֣ר הַ/זֶּ֑ה וַ/תְּחַיֶּ֖יןָ אֶת הַ/יְלָדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/018.yaml
  text: So the king of Egypt called for the midwives and said to them[a], “Why have you done this thing and let the children live?”
translation:
  language: hi
  text: तब मिस्र के राजा ने दाइयों को बुलाकर उनसे कहा, “तुमने ऐसा क्यों किया और बच्चों को जीवित रहने दिया[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “लड़कों को जीवित रखा।” इब्रानी क्रिया का अर्थ किसी को जीवित करना, जीवित रखना या जीवित रहने देना हो सकता है; और प्रसंग में ये बच्चे विशेष रूप से लड़के हैं।
    reason: शब्दार्थ और संदर्भगत विकल्प
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: बुलाकर
  rationale: קרא के साथ ל व्यक्तियों को बुलाने या उपस्थित होने के लिए बुलवाने का भाव देता है। हिंदी में ‘दाइयों को बुलाकर उनसे कहा’ घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מֶלֶךְ מִצְרַיִם
  choice: मिस्र के राजा
  rationale: यह संबंधसूचक रचना का सीधा और प्रचलित हिंदी रूप है।
- source_word: לַמְיַלְּדֹת
  choice: दाइयों
  rationale: यह ילד से बना स्त्रीलिंग बहुवचन रूप है और प्रसव में सहायता करने वाली स्त्रियों को सूचित करता है; ‘दाइयाँ’ इसका सटीक तथा सहज हिंदी पर्याय है।
- source_word: וַיֹּאמֶר לָהֶן
  choice: उनसे कहा
  rationale: אמר का सामान्य अर्थ ‘कहना’ है। ‘उनसे कहा’ प्रत्यक्ष कथन की भूमिका को बिना अतिरिक्त व्याख्या के व्यक्त करता है।
- source_word: מַדּוּעַ
  choice: क्यों
  rationale: यह कारण पूछने वाला प्रश्नवाचक शब्द है; ‘क्यों’ इसका संक्षिप्त और स्वाभाविक हिंदी रूप है।
- source_word: עֲשִׂיתֶן הַדָּבָר הַזֶּה
  choice: तुमने ऐसा किया
  rationale: क्रिया स्त्रीलिंग बहुवचन संबोधन में है। हिंदी में ‘तुमने’ बहुवचन श्रोताओं के लिए स्वाभाविक है, और ‘ऐसा किया’ הַדָּבָר הַזֶּה के आशय को अनावश्यक भारीपन के बिना व्यक्त करता है।
- source_word: וַתְּחַיֶּיןָ
  choice: जीवित रहने दिया
  rationale: חיה का यह रूप किसी को जीवित करने, जीवित रखने या जीवित रहने देने का भाव दे सकता है। प्रसंग में ‘जीवित रहने दिया’ फिरौन के आरोप को स्वाभाविक हिंदी में व्यक्त करता है, जबकि ‘जीवित रखा’ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: הַיְלָדִים
  choice: बच्चों
  rationale: יְלָדִים अपने आप में ‘बच्चे’ कह सकता है। निकटवर्ती प्रसंग विशेष रूप से लड़कों से संबंधित है, इसलिए उस संदर्भगत अर्थ को पादटिप्पणी में दिया गया है, पर मुख्य पाठ में शब्द की व्यापकता सुरक्षित रखी गई है।
