base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/019.yaml
  text: The midwives said to Pharaoh[a], “Because the Hebrew women are not like the Egyptian women, for they are vigorous; before the midwife comes to them, they have given birth.”
translation:
  language: hi
  text: तब दाइयों ने फ़िरौन से कहा, “इब्रानी स्त्रियाँ मिस्री स्त्रियों जैसी नहीं हैं, क्योंकि वे बहुत जीवट वाली हैं। दाई के उनके पास पहुँचने से पहले ही वे जन्म दे चुकी होती हैं।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “बहुत जीवट वाली” का अनुवाद “बलवान” या “सशक्त” भी हो सकता है। इब्रानी शब्द प्रसव में शक्ति और शीघ्रता का संकेत दे सकता है। कुछ व्याख्याकार इसे पशुओं से संबद्ध अर्थ में लेते हैं, पर यहाँ उसका आशय निश्चित नहीं है।
    reason: lexical_alternative
