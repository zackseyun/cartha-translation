- source_word: וַתֹּאמַרְןָ
  choice: तब ... ने ... कहा
  rationale: कथात्मक wayyiqtol को स्वाभाविक हिन्दी कथा-क्रम में व्यक्त करता है; बहुवचन स्त्रीलिंग कर्ता ‘दाइयों’ से स्पष्ट है।
- source_word: הַמְיַלְּדֹת
  choice: दाइयों
  rationale: प्रसव में सहायता करने वाली स्त्रियों के लिए आधुनिक हिन्दी का संक्षिप्त और प्रचलित शब्द।
- source_word: אֶל־פַּרְעֹה
  choice: फ़िरौन से
  rationale: אמר के साथ हिन्दी में संबोधित व्यक्ति को ‘से’ द्वारा व्यक्त करना स्वाभाविक है; ‘फ़िरौन’ मानक हिन्दी रूप है।
- source_word: כִּי לֹא כַנָּשִׁים הַמִּצְרִיֹּת הָעִבְרִיֹּת
  choice: इब्रानी स्त्रियाँ मिस्री स्त्रियों जैसी नहीं हैं
  rationale: मूल के तुलना-वाक्य और इब्रानी-मिस्री विरोध को स्पष्ट, स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: חָיוֹת
  choice: हृष्ट-पुष्ट
  rationale: यहाँ प्रसव में जीवट, शक्ति और शीघ्रता का भाव सम्भव है। ‘हृष्ट-पुष्ट’ आधुनिक पाठक को शक्ति/मज़बूती का अर्थ देता है, जबकि अधिक शाब्दिक सम्भावना को पादटिप्पणी में रखा गया है।
- source_word: בְּטֶרֶם תָּבוֹא אֲלֵהֶן הַמְיַלֶּדֶת
  choice: दाई के उनके पास पहुँचने से पहले ही
  rationale: בטרם की पूर्वकालिकता स्पष्ट करता है; एकवचन ‘दाई’ को जातिवाचक अर्थ में रखा गया है और ‘ही’ शीघ्रता पर प्रसंगगत बल देता है।
- source_word: וְיָלָדוּ
  choice: वे बच्चे को जन्म दे चुकी होती हैं
  rationale: दाई के पहुँचने से पहले प्रसव पूरा हो जाने की पुनरावर्ती स्थिति को हिन्दी के पूर्णतासूचक रूप में व्यक्त करता है।
