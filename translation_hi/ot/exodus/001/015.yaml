base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/015.yaml
  text: Then the king of Egypt said to the Hebrew midwives[a], one of whom was named Shiphrah and the other Puah,
translation:
  language: hi
  text: तब मिस्र के राजा ने इब्री दाइयों[a] से कहा, जिनमें से एक का नाम शिप्रा और दूसरी का नाम पूआ था,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इब्रियों की दाइयों।” इब्रानी पदबंध का अर्थ यह हो सकता है कि दाइयाँ स्वयं इब्री थीं, या यह कि वे इब्री स्त्रियों के प्रसव में सहायता करती थीं।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने ... कहा
  rationale: वाव-क्रमवाचक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में उसके क्रमिक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מֶלֶךְ מִצְרַיִם
  choice: मिस्र के राजा
  rationale: यह इब्रानी संबंध-रचना का सीधा और स्वाभाविक रूप है; यहाँ मूल पाठ में ‘फ़िरौन’ उपाधि नहीं है, इसलिए उसे नहीं जोड़ा गया।
- source_word: לַמְיַלְּדֹת
  choice: दाइयों से
  rationale: यह ילד से बना स्त्रीलिंग कृदंत है और प्रसव कराने या उसमें सहायता देने वाली स्त्रियों को सूचित करता है; ‘दाई’ इसका प्रचलित हिन्दी समानार्थी है।
- source_word: הָעִבְרִיֹּת
  choice: इब्री
  rationale: इसे ‘दाइयों’ का विशेषण मानते हुए ‘इब्री दाइयों’ किया गया है; पर इब्रानी पदबंध का अर्थ ‘इब्रियों की दाइयाँ’ भी हो सकता है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: אֲשֶׁר שֵׁם הָאַחַת ... וְשֵׁם הַשֵּׁנִית ...
  choice: जिनमें से एक का नाम ... और दूसरी का नाम ... था
  rationale: यह दोनों दाइयों को अलग-अलग नाम से पहचानने वाली संबंधवाचक रचना है; हिन्दी रूप मूल के ‘एक ... दूसरी’ भाव को स्पष्ट और स्वाभाविक ढंग से रखता है।
- source_word: שִׁפְרָה
  choice: शिप्रा
  rationale: नाम का इब्रानी उच्चारणानुसार देवनागरी लिप्यंतरण।
- source_word: פּוּעָה
  choice: पूआ
  rationale: नाम का इब्रानी उच्चारणानुसार देवनागरी लिप्यंतरण।
theological_decisions:
- issue: הָעִבְרִיֹּת का व्याकरणिक संबंध
  choice: मुख्य पाठ में दाइयों को इब्री माना गया है
  alternative: ये ऐसी दाइयाँ थीं जो इब्री स्त्रियों की सेवा करती थीं
  rationale: विशेषण को ‘दाइयों’ के साथ जोड़ना वाक्यरचना का स्वाभाविक पठन है, किन्तु संबंधवाचक अर्थ भी व्याकरणतः संभव है; इसलिए अस्पष्टता पादटिप्पणी में बनी रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप। ‘इब्री’ बाइबिलीय जातिनाम के रूप में रखा गया है और ‘दाई’ सामान्य पाठक के लिए स्पष्ट तथा प्रचलित शब्द है।
