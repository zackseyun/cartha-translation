  text: Then Joseph died, and all his brothers, and all that generation.
translation:
  language: hi
  text: तब यूसुफ की मृत्यु हो गई, और उसके सभी भाइयों की भी, और उस पूरी पीढ़ी की भी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: तब ... की मृत्यु हो गई
  rationale: वाव-क्रमिक रूप कथा को अगली भूतकालीन घटना की ओर बढ़ाता है। हिंदी में ‘तब ... की मृत्यु हो गई’ इस क्रम को स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: יוֹסֵף
  choice: यूसुफ
  rationale: व्यक्तिनाम का प्रचलित मानक हिंदी बाइबलीय रूप अपनाया गया है।
- source_word: וְכָל אֶחָיו
  choice: और उसके सभी भाइयों की भी
  rationale: כֹּל का सामूहिक अर्थ ‘सभी’ से और אֶחָיו का पुरुष बहुवचन अर्थ ‘उसके भाइयों’ से स्पष्ट होता है। ‘भी’ पहले खंड से साझा क्रिया ‘मृत्यु हो गई’ को स्वाभाविक हिंदी में जोड़ता है।
- source_word: וְכֹל הַדּוֹר הַהוּא
  choice: और उस पूरी पीढ़ी की भी
  rationale: דּוֹר समकालीन लोगों की पीढ़ी को दर्शाता है। ‘पूरी’ כֹל की व्यापकता बनाए रखता है, जबकि ‘उस ... पीढ़ी’ हिब्रू के निश्चित संकेत को व्यक्त करता है।
