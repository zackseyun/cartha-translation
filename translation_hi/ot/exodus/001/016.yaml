base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/016.yaml
  text: And he said[a], “When you help the Hebrew women give birth and see them on the birthstool, if it is a son, then you shall put him to death; but if it is a daughter, then she shall live.”
translation:
  language: hi
  text: उसने कहा, “जब तुम इब्री स्त्रियों को प्रसव कराने में सहायता करो और उन्हें प्रसव-आसन[a] पर देखो, तो यदि पुत्र हो, उसे मार डालना; पर यदि पुत्री हो, तो वह जीवित रहे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्री में शाब्दिक अर्थ “दो पत्थरों पर” है; संभवतः इससे प्रसव के लिए प्रयुक्त आसन का संकेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיַלֶּדְכֶן
  choice: जब तुम ... प्रसव कराने में सहायता करो
  rationale: पिएल रूप यहाँ दाइयों द्वारा प्रसव में सहायता देने का भाव व्यक्त करता है। यह आधुनिक हिन्दी में स्वाभाविक है और क्रिया को केवल उनके पदनाम ‘दाई’ तक सीमित नहीं करता।
- source_word: הָעִבְרִיּוֹת
  choice: इब्री स्त्रियों
  rationale: स्त्रीलिंग बहुवचन पद का सीधा और गरिमापूर्ण अनुवाद; प्रसव का संदर्भ क्रिया से स्पष्ट है।
- source_word: עַל הָאָבְנָיִם
  choice: प्रसव-आसन
  rationale: शाब्दिक अर्थ ‘दो पत्थरों पर’ है, पर प्रसव-संदर्भ में यह प्रसव के समय प्रयुक्त आसन या स्थान का संकेत देता है। मुख्य पाठ में संदर्भगत अर्थ और पादटिप्पणी में शाब्दिक रूप रखा गया है।
- source_word: אִם בֵּן הוּא
  choice: यदि पुत्र हो
  rationale: בֵּן नवजात के पुरुष होने को बताता है। ‘पुत्र’ औपचारिक आदेश की शैली और पुत्र/पुत्री की समानांतरता बनाए रखता है।
- source_word: וַהֲמִתֶּן אֹתוֹ
  choice: उसे मार डालना
  rationale: हिफ़ील रूप जानबूझकर मृत्यु देने की आज्ञा व्यक्त करता है। हिन्दी का यह रूप आदेश की कठोरता को स्पष्ट और स्वाभाविक ढंग से रखता है।
- source_word: וְאִם בַּת הִיא
  choice: पर यदि पुत्री हो
  rationale: בַּת को ‘पुत्री’ कहना पुत्र के साथ मूल समानांतरता रखता है; ‘पर’ दोनों स्थितियों का विरोध स्पष्ट करता है।
- source_word: וָחָיָה
  choice: तो वह जीवित रहे
  rationale: यह स्त्री शिशु को न मारने और जीवित रहने देने का भाव रखता है। अनुवाद मूल की संक्षिप्तता तथा आदेश-संदर्भ में निहित अनुमतिपरक अर्थ दोनों बनाए रखता है।
