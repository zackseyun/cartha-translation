source:
  edition: WLC
  text: הָ֥בָ/ה נִֽתְחַכְּמָ֖ה ל֑/וֹ פֶּן יִרְבֶּ֗ה וְ/הָיָ֞ה כִּֽי תִקְרֶ֤אנָה מִלְחָמָה֙ וְ/נוֹסַ֤ף גַּם הוּא֙ עַל שֹׂ֣נְאֵ֔י/נוּ וְ/נִלְחַם בָּ֖/נוּ וְ/עָלָ֥ה מִן הָ/אָֽרֶץ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/010.yaml
  text: Come[a], let us deal shrewdly with them, lest they multiply, and if war breaks out[c][b], they too may join our enemies and fight against us and go up out of the land.
translation:
  language: hi
  text: “आओ, हम उनके साथ चतुराई से पेश आएँ,[a] कहीं ऐसा न हो कि वे और बढ़ जाएँ; और यदि युद्ध छिड़ जाए, तो वे भी हमारे शत्रुओं से जा मिलें, हमारे विरुद्ध लड़ें और इस देश से निकल जाएँ।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “उसके साथ” है। एकवचन सर्वनाम इस्राएल की प्रजा को सामूहिक रूप से दर्शाता है। “चतुराई से” का अनुवाद “बुद्धिमानी से” भी हो सकता है, पर यहाँ संदर्भ सोची-समझी चालाक नीति का है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “देश में से ऊपर चला जाए” है; भावार्थ “देश छोड़कर चला जाए” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבָה
  choice: आओ
  rationale: यह सामूहिक और तत्काल कार्यवाही के लिए बुलाने वाला स्वाभाविक हिंदी उद्गार है।
- source_word: נִתְחַכְּמָה
  choice: हम ... चतुराई से पेश आएँ
  rationale: हित्पाएल रूप यहाँ नैतिक बुद्धिमत्ता से अधिक सोची-समझी, राजनीतिक चालाकी का भाव देता है; यह अभिव्यक्ति उस संदर्भगत नकारात्मक छाया को बनाए रखती है।
- source_word: לוֹ
  choice: उनके साथ
  rationale: इब्रानी सर्वनाम व्याकरणतः एकवचन है, पर वह इस्राएल को सामूहिक जाति के रूप में दर्शाता है; हिंदी में बहुवचन संदर्भ अधिक स्वाभाविक और स्पष्ट है।
- source_word: פֶּן יִרְבֶּה
  choice: कहीं ऐसा न हो कि वे और बढ़ जाएँ
  rationale: פֶּן आशंकित परिणाम बताता है, और सामूहिक एकवचन क्रिया का हिंदी में स्वाभाविक बहुवचन किया गया है; 'और बढ़ जाएँ' संख्या-वृद्धि का भाव व्यक्त करता है।
- source_word: וְהָיָה כִּי תִקְרֶאנָה מִלְחָמָה
  choice: और यदि युद्ध छिड़ जाए
  rationale: वाक्यांश संभावित परिस्थिति प्रस्तुत करता है; 'युद्ध छिड़ जाए' आधुनिक हिंदी का सहज मुहावरा है।
- source_word: וְנוֹסַף גַּם הוּא עַל שֹׂנְאֵינוּ
  choice: तो वे भी हमारे शत्रुओं से जा मिलें
  rationale: יסף עם על यहाँ किसी पक्ष में सम्मिलित होने का अर्थ देता है; सामूहिक इस्राएल के लिए बहुवचन रखा गया है।
- source_word: וְנִלְחַם בָּנוּ
  choice: हमारे विरुद्ध लड़ें
  rationale: यह स्पष्ट रूप से विरोधी युद्ध-कार्यवाही व्यक्त करता है और हिंदी में संक्षिप्त तथा स्वाभाविक है।
- source_word: וְעָלָה מִן הָאָרֶץ
  choice: और इस देश से निकल जाएँ
  rationale: עלה का मूल अर्थ 'ऊपर जाना/चढ़ना' है, पर מן־הארץ के साथ यहाँ देश से प्रस्थान का अर्थ स्वाभाविक है। 'निकल जाएँ' अर्थ स्पष्ट करता है, जबकि पादटिप्पणी शाब्दिक दिशात्मक बिंब सुरक्षित रखती है।
theological_decisions:
- issue: וְעָלָה מִן הָאָרֶץ में आशय—देश से निकलना या देश पर चढ़ आना
  choice: इस देश से निकल जाएँ
  alternative: देश पर चढ़ आएँ / देश से ऊपर चले जाएँ
  rationale: מן सामान्यतः 'से/में से' प्रस्थान दर्शाता है, इसलिए निर्गमन का अर्थ भाषिक रूप से सीधा है। फिर भी עלה का दिशात्मक बिंब और वाक्य की व्याख्यात्मक कठिनाई पादटिप्पणी में बताई गई है, ताकि तनाव चुपचाप समाप्त न हो।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज वाक्य-विन्यास रखा गया है। फ़िरौन की आशंका और राजनीतिक चालाकी का स्वर स्पष्ट है। सामूहिक इस्राएल के लिए स्वाभाविक हिंदी बहुवचन अपनाया गया है, और कठिन अंतिम वाक्यांश की शाब्दिक छवि पादटिप्पणी में सुरक्षित रखी गई है।
