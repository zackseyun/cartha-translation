  text: So God dealt well with the midwives[a], and the people multiplied and became very strong.
translation:
  language: hi
  text: इसलिए परमेश्वर ने दाइयों का भला किया[a], और लोग बढ़े और बहुत बलवान हो गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘दाइयों के प्रति भला रहा’ अथवा ‘दाइयों को आशीष दी।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּיטֶב
  choice: भलाई की
  rationale: हिफ़ील रूप और उसके साथ ל किसी के प्रति भला करने का भाव व्यक्त करते हैं। ‘भलाई की’ स्वाभाविक हिन्दी है और ‘आशीष दी’ जैसा अधिक विशिष्ट अर्थ नहीं जोड़ती।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: इस कथानक में यह इस्राएल के परमेश्वर के लिए प्रयुक्त है और क्रिया भी एकवचन है।
- source_word: לַמְיַלְּדֹת
  choice: दाइयों के साथ
  rationale: ל यहाँ लाभार्थी संबंध दिखाता है; ‘के साथ भलाई की’ आधुनिक हिन्दी में स्वाभाविक रूप से उसी संबंध को व्यक्त करता है।
- source_word: וַיִּרֶב
  choice: बढ़ते गए
  rationale: यहाँ רבה लोगों की संख्या बढ़ने का संकेत देता है। ‘बढ़ते गए’ निरंतर जन-वृद्धि को सहज हिन्दी में व्यक्त करता है।
- source_word: הָעָם
  choice: वे लोग
  rationale: इब्रानी में केवल ‘लोग’ है। हिन्दी में पूर्वोक्त समुदाय की ओर स्पष्ट संकेत के लिए ‘वे लोग’ स्वाभाविक है, बिना ‘इस्राएली’ जोड़कर पाठ का विस्तार किए।
- source_word: וַיַּעַצְמוּ
  choice: बहुत सामर्थी हो गए
  rationale: עצם यहाँ बल या सामर्थ्य में बढ़ने का अर्थ देता है; यह अनुवाद उस गतिशील भाव को बनाए रखता है।
- source_word: מְאֹד
  choice: बहुत
  rationale: מְאֹד तीव्रता बताता है; आधुनिक हिन्दी में ‘बहुत’ इसका स्पष्ट और स्वाभाविक समतुल्य है।
theological_decisions:
- issue: परमेश्वर के दाइयों के प्रति कार्य को ‘आशीष दी’ कहा जाए या अधिक तटस्थ रूप से भलाई करना
  choice: दाइयों के साथ भलाई की
  alternative: दाइयों को आशीष दी; दाइयों के प्रति भला रहा
  rationale: יָטַב का हिफ़ील रूप भला करने या अच्छा व्यवहार करने का भाव देता है, पर उस भलाई का विशिष्ट ढंग स्वयं क्रिया में नहीं बताता। इसलिए मुख्य पाठ तटस्थ अर्थ रखता है और पद 21 को परिणाम स्पष्ट करने देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक शैली। ‘भलाई की’ स्रोत की व्यापक अर्थ-सीमा बनाए रखता है, और पाद-टिप्पणी प्रचलित वैकल्पिक अनुवाद देती है।
