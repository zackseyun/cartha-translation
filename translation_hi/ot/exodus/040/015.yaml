base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/015.yaml
  text: You shall anoint them just as you anointed their father[a], so that they may serve as priests to me. And their anointing shall be for them an everlasting priesthood throughout their generations.
translation:
  language: hi
  text: तुम उनका अभिषेक करना, जैसे तुमने उनके पिता का अभिषेक किया था, ताकि वे मेरे लिए याजकों के रूप में सेवा करें। उनका अभिषेक उनकी पीढ़ियों तक उनके लिए सदा की याजकाई[a] होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा “स्थायी याजकाई।” इब्रानी शब्द वाचा के संदर्भ में पीढ़ियों तक बनी रहने वाली निरंतरता को दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָשַׁחְתָּ אֹתָם
  choice: उनका भी अभिषेक करना
  rationale: निर्देशों की शृंखला में संयोजक सहित पूर्ण क्रिया आज्ञा या भावी निर्देश का बल रखती है। हिंदी में ‘अभिषेक करना’ इस निर्देश को स्वाभाविक रूप से व्यक्त करता है; ‘भी’ पिता के अभिषेक से तुलना को स्पष्ट करता है।
- source_word: כַּאֲשֶׁר מָשַׁחְתָּ אֶת אֲבִיהֶם
  choice: जिस प्रकार तुमने उनके पिता का अभिषेक किया था, उसी प्रकार
  rationale: כַּאֲשֶׁר निकट समानता बताता है। ‘जिस प्रकार…उसी प्रकार’ मूल तुलना को स्पष्ट और स्वाभाविक हिंदी में रखता है।
- source_word: וְכִהֲנוּ לִי
  choice: ताकि वे मेरे लिए याजक का काम करें
  rationale: כהן का क्रियात्मक रूप याजक के रूप में सेवा करने को दर्शाता है। ‘याजक का काम करें’ साधारण पाठक के लिए स्पष्ट है और לִי के ‘मेरे लिए’ भाव को बनाए रखता है।
- source_word: מָשְׁחָתָם
  choice: उनका अभिषेक
  rationale: यहाँ संज्ञा अभिषेक अथवा अभिषेक द्वारा प्रतिष्ठापन को दर्शाती है; पाठ में तेल का स्पष्ट उल्लेख नहीं है, इसलिए ‘अभिषेक’ अधिक सटीक है।
- source_word: לִכְהֻנַּת עוֹלָם
  choice: सदा की याजकाई
  rationale: כְּהֻנָּה के लिए ‘याजकाई’ याजकीय पद और सेवा को व्यक्त करता है। עוֹלָם के दीर्घस्थायी, निरंतर कालगत भाव के लिए ‘सदा की’ मुख्य पाठ में सशक्त और परिचित समतुल्य है।
- source_word: לְדֹרֹתָם
  choice: पीढ़ी-दर-पीढ़ी
  rationale: यह हारून के वंश की क्रमिक पीढ़ियों में निरंतरता व्यक्त करता है; ‘पीढ़ी-दर-पीढ़ी’ आधुनिक हिंदी में सहज और सटीक है।
theological_decisions:
- issue: याजकीय वाचा की भाषा में עוֹלָם से सूचित अवधि
  choice: सदा की याजकाई
  alternative: स्थायी याजकाई
  rationale: עוֹלָם इस वैधानिक-वाचागत संदर्भ में पीढ़ियों तक बनी रहने वाली निरंतरता दर्शा सकता है, और आवश्यक नहीं कि वह संदर्भ से बाहर कोई अमूर्त दार्शनिक दावा करे। मुख्य पाठ में प्रबल स्वाभाविक अर्थ रखा गया है और वैकल्पिक अर्थ पाद-टिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। एकवचन संबोधन के लिए संदर्भानुकूल ‘तुम’ रखा गया है। ‘याजक का काम करें’ सामान्य पाठक के लिए स्पष्ट है, जबकि ‘याजकाई’ पद और संस्था की निरंतरता को संक्षेप में व्यक्त करता है। पाद-टिप्पणी का चिह्न अवधि-संबंधी पद ‘सदा की याजकाई’ पर लगाया गया है।
