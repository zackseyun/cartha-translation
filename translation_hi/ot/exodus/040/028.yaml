  text: And he put the screen at the entrance to the tabernacle[a].
translation:
  language: hi
  text: और उसने तंबू के प्रवेश-द्वार पर परदा लगाया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तंबू के द्वार का परदा लगाया।”
    reason: मूल इब्रानी में संबंध को ‘प्रवेश-द्वार पर परदा’ अथवा ‘द्वार का परदा’ के रूप में व्यक्त किया जा सकता है।
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: और उसने … लगाया
  rationale: שׂוּם का मूल अर्थ ‘रखना/स्थापित करना’ है। प्रवेश-द्वार के परदे के संदर्भ में ‘लगाया’ स्वाभाविक हिन्दी है और उसे उचित स्थान पर स्थापित करने का भाव व्यक्त करता है।
- source_word: מָסַךְ
  choice: परदा
  rationale: मिलापवाले तंबू के संदर्भ में यह शब्द प्रवेश पर लटकाए जाने वाले आवरण को दर्शाता है। हिन्दी में ‘परदा’ सहज है और इसे भीतरी ‘विभाजन के परदे’ (פָּרֹכֶת) के लिए प्रयुक्त विशिष्ट शब्द मानकर अनावश्यक रूप से एक जैसा नहीं करता।
- source_word: הַפֶּתַח
  choice: प्रवेश-द्वार
  rationale: פֶּתַח किसी भवन या संरचना के खुले प्रवेश अथवा द्वार को दर्शाता है। ‘प्रवेश-द्वार’ यहाँ स्पष्ट और स्वाभाविक है।
- source_word: לַמִּשְׁכָּן
  choice: निवास के
  rationale: מִשְׁכָּן का मूल भाव ‘निवास’ है। उपसर्ग ל को यहाँ प्रवेश-द्वार के साथ संबंधसूचक मानते हुए हिन्दी में ‘निवास के प्रवेश-द्वार’ किया गया है।
