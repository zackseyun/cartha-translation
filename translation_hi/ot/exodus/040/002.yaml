base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/002.yaml
  text: On the first day of the first month[a], you shall set up the tabernacle, the tent of meeting.
translation:
  language: hi
  text: पहले महीने के पहले दिन तुम पवित्र निवास, अर्थात् मिलाप का तंबू[a], खड़ा करोगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से: “मिलाप के तंबू का पवित्र निवास।” इब्रानी में पवित्रस्थान के ये दोनों पद ऐसे जुड़े हैं कि इन्हें एक ही वस्तु के दो समानाधिकरण नाम या अधिक घनिष्ठ संबंधसूचक पदबंध माना जा सकता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּיוֹם הַחֹדֶשׁ הָרִאשׁוֹן בְּאֶחָד לַחֹדֶשׁ
  choice: पहले महीने के पहले दिन
  rationale: यह इब्रानी तिथि-सूत्र पहले महीने की पहली तारीख बताता है। स्वाभाविक आधुनिक हिन्दी में इसे ‘पहले महीने के पहले दिन’ कहना स्पष्ट और सटीक है।
- source_word: תָּקִים
  choice: खड़ा करना
  rationale: קום के हिफ़ील रूप का अर्थ यहाँ किसी संरचना को खड़ा या स्थापित करना है। निर्देश के प्रसंग में ‘तुम … खड़ा करना’ स्वाभाविक आज्ञार्थक हिन्दी है।
- source_word: מִשְׁכַּן
  choice: पवित्र-निवास
  rationale: मִשְׁכָּן का मूल भाव ‘निवास-स्थान’ है, और निर्गमन में यह परमेश्वर के पोर्टेबल पवित्रस्थान के लिए प्रयुक्त होता है। ‘पवित्र-निवास’ इस अर्थ को सामान्य पाठक के लिए स्पष्ट रखता है।
- source_word: אֹהֶל מוֹעֵד
  choice: मिलापवाला तंबू
  rationale: यह निर्गमन में पवित्रस्थान का प्रचलित पद है। ‘मिलापवाला तंबू’ उस तंबू को दर्शाता है जहाँ परमेश्वर और उसका नियुक्त प्रतिनिधि मिलते हैं, बिना ‘מוֹעֵד’ को केवल सभा तक सीमित किए।
theological_decisions:
- issue: מִשְׁכַּן और אֹהֶל מוֹעֵד का पारस्परिक संबंध
  choice: 'समानाधिकरण: ‘पवित्र-निवास, अर्थात् मिलापवाला तंबू’'
  alternative: 'अधिक शाब्दिक, संबंधसूचक रूप: ‘मिलापवाले तंबू का पवित्र-निवास’'
  rationale: इब्रानी में दोनों पवित्रस्थान-संज्ञाएँ साथ रखी गई हैं और स्पष्ट संबंधसूचक चिह्न नहीं है। प्रसंग में वे एक ही पवित्र संरचना के पूरक नाम हैं; इसलिए मुख्य पाठ समानाधिकरण को अपनाता है, जबकि अधिक सघन संबंधसूचक समझ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल किंतु गरिमापूर्ण निर्देशात्मक शैली। ‘पवित्र-निवास’ अर्थ को स्पष्ट करता है और ‘मिलापवाला तंबू’ निर्गमन की परिचित पवित्रस्थान-संज्ञा को बनाए रखता है। पादटिप्पणी-चिह्न उसी पदबंध पर रखा गया है जिससे वैकल्पिक व्याकरणिक समझ संबंधित है।
