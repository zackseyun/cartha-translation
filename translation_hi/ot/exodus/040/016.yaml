  yaml_path: translation/ot/exodus/040/016.yaml
  text: And Moses did according to all that Yahweh commanded him[a]; so he did.
translation:
  language: hi
  text: मूसा ने वह सब कुछ किया जिसकी आज्ञा याहवे[a] ने उसे दी थी; उसने वैसा ही किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'हिब्रू: ‘YHWH’ (יהוה); परंपरागत रूप से ‘प्रभु’ के रूप में अनूदित।'
    reason: ईश्वरीय नाम के मूल हिब्रू रूप और उसके पारंपरिक वैकल्पिक अनुवाद की सूचना।
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: ने...किया
  rationale: עשה का अर्थ व्यापक रूप से ‘करना/बनाना’ है; यहाँ आज्ञा के अनुरूप कार्य करने की बात है, इसलिए ‘किया’ स्वाभाविक है।
- source_word: מֹשֶׁה
  choice: मूसा
  rationale: हिन्दी बाइबल परंपरा में इस व्यक्तिगत नाम का प्रचलित रूप।
- source_word: כְּכֹל אֲשֶׁר
  choice: ठीक वैसा ही...जैसा
  rationale: यह वाक्य-विन्यास आज्ञा की समस्त बातों के साथ पूर्ण अनुरूपता व्यक्त करता है; ‘ठीक’ כְּכֹל की व्यापकता और बल को सहज हिन्दी में सामने लाता है।
- source_word: צִוָּה
  choice: आज्ञा दी थी
  rationale: आज्ञा मूसा के कार्य से पहले दी गई थी; हिन्दी का पूर्ण भूतकाल इस क्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: ईश्वरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लंबे समय से प्रचलित लिप्यंतरण ‘यहोवा’ रखा गया है।
- source_word: אֹתוֹ
  choice: उसे
  rationale: पुल्लिंग एकवचन कर्म-सर्वनाम मूसा की ओर संकेत करता है।
- source_word: כֵּן עָשָׂה
  choice: उसने वैसा ही किया
  rationale: मूल में עשה की पुनरावृत्ति मूसा की पूर्ण आज्ञाकारिता पर बल देती है; हिन्दी में इसे बनाए रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; अथवा पारंपरिक ‘यहोवा’ के स्थान पर ‘प्रभु’
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे आया है। हिन्दी पाठकों के लिए परिचित ‘यहोवा’ उसका लिप्यंतरण है और नाम को उपाधि में नहीं बदलता; पादटिप्पणी मूल हिब्रू रूप स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और पठनीय रूप। मूल की दोहरी ‘किया’ संरचना को जानबूझकर सुरक्षित रखा गया है, क्योंकि वह आज्ञा और उसके ठीक अनुरूप पालन पर बल देती है।
