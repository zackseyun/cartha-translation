source:
  edition: WLC
  text: וַ/יִּקַּ֞ח וַ/יִּתֵּ֤ן אֶת הָ/עֵדֻת֙ אֶל הָ֣/אָרֹ֔ן וַ/יָּ֥שֶׂם אֶת הַ/בַּדִּ֖ים עַל הָ/אָרֹ֑ן וַ/יִּתֵּ֧ן אֶת הַ/כַּפֹּ֛רֶת עַל הָ/אָרֹ֖ן מִ/לְ/מָֽעְלָ/ה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/020.yaml
  text: Then he took the testimony and put it into the ark[a], and he set the poles on the ark[b], and he placed the mercy seat on the ark above.
translation:
  language: hi
  text: फिर उसने साक्षी-पत्र को लेकर सन्दूक के भीतर रखा[a], डंडों को सन्दूक पर लगाया, और प्रायश्चित-आवरण[b] को सन्दूक के ऊपर रखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “साक्षी की पटियाएँ।” इब्रानी में यहाँ पारिभाषिक रूप से “साक्षी” कहा गया है।
    reason: lexical_alternative
  - marker: b
    text: या, “करुणा-आसन”; यह सन्दूक के ऊपर रखा विशेष आवरण था।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֵדֻת
  choice: साक्षी-पत्र
  rationale: यह तम्बू से जुड़ा पारिभाषिक शब्द है और यहाँ सन्दूक में रखी गई ठोस वाचा-साक्षी की ओर संकेत करता है। ‘साक्षी-पत्र’ मूल की पारिभाषिकता बनाए रखता है, जबकि उसे सीधे ‘पटियाएँ’ कहकर आवश्यकता से अधिक स्पष्ट नहीं करता।
- source_word: הָאָרֹן
  choice: सन्दूक
  rationale: אָרוֹן का मूल अर्थ सन्दूक या पेटी है; प्रसंग से इसका पवित्र सन्दूक होना स्पष्ट है। ‘वाचा का’ जोड़ना इस पद में उपस्थित नहीं है।
- source_word: הַבַּדִּים
  choice: डंडे
  rationale: ये सन्दूक को उठाकर ले जाने के लिए बने डंडे हैं। ‘डंडे’ आधुनिक और सहज है; प्रसंग उनका कार्य स्पष्ट करता है।
- source_word: הַכַּפֹּרֶת
  choice: प्रायश्चित-आवरण
  rationale: यह सन्दूक के ऊपर रखा विशिष्ट स्वर्ण आवरण है और इसका प्रायश्चित-विधि से गहरा संबंध है। यह अनुवाद वस्तु के आवरण होने और उसके धार्मिक महत्व—दोनों को व्यक्त करता है, पर शब्द की सारी व्याख्या मुख्य पाठ में नहीं भरता।
- source_word: מִלְמָעְלָה
  choice: सन्दूक के ऊपर
  rationale: यहाँ पदबंध आवरण की ऊपरी स्थिति बताता है। हिन्दी में ‘सन्दूक के ऊपर’ स्वाभाविक है और प्रसंगगत संबंध को स्पष्ट करता है।
- source_word: וַיִּתֵּן ... אֶל
  choice: के भीतर रखा
  rationale: इस भौतिक प्रसंग में נתן עם אֶל का अर्थ किसी वस्तु को भीतर रखना है।
- source_word: וַיָּשֶׂם ... עַל
  choice: पर लगाया
  rationale: यह डंडों को सन्दूक पर उनके नियत स्थान में लगाने का भाव देता है और हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: ‘साक्षी’ का अभिप्रेत पदार्थ
  choice: सन्दूक में रखी गई वाचा-साक्षी के लिए पारिभाषिक ‘साक्षी-पत्र’, जो सम्भवतः पत्थर की पटियाओं को सूचित करता है
  alternative: इसे सीधे ‘साक्षी की पटियाएँ’ या ‘वाचा की पटियाएँ’ कहना
  rationale: वर्णित क्रिया ठोस वस्तु की माँग करती है, पर इब्रानी पाठ पटियाओं का स्पष्ट नाम न लेकर עֵדוּת का प्रयोग करता है। इसलिए अनुवाद उस संकेत को बनाए रखता है और पहचान को पादटिप्पणी में स्पष्ट करता है।
- issue: כַּפֹּרֶת का अनुवाद
  choice: प्रायश्चित-आवरण
  alternative: करुणा-आसन; ढकना
  rationale: यह शब्द सन्दूक के विशिष्ट ऊपरी आवरण को नाम देता है, जिसका प्रायश्चित-विधि में विशेष महत्व है। ‘प्रायश्चित-आवरण’ वस्तु और धार्मिक कार्य दोनों को संक्षेप में व्यक्त करता है; केवल ‘ढकना’ उसके विधिक महत्व को कम कर सकता है, जबकि ‘करुणा-आसन’ हिन्दी में कम पारदर्शी है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘साक्षी-पत्र’ और ‘प्रायश्चित-आवरण’ प्रसंग के पारिभाषिक धार्मिक शब्द हैं; पादटिप्पणियाँ उनके सम्भव वैकल्पिक अनुवाद बताती हैं।
