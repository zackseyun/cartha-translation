  yaml_path: translation/ot/exodus/040/032.yaml
  text: Whenever they entered the tent of meeting, and whenever they approached the altar, they washed, just as Yahweh had commanded Moses.
translation:
  language: hi
  text: जब-जब वे मिलापवाले तंबू में प्रवेश करते थे और जब-जब वे वेदी के पास आते थे, तब वे धोते थे, ठीक वैसे ही जैसे यहोवा ने मूसा को आज्ञा दी थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּבֹאָם
  choice: जब-जब वे ... प्रवेश करते
  rationale: בְּ + infinitive construct और बहुवचन प्रत्यय समयसूचक परिस्थिति व्यक्त करते हैं। संदर्भ में यह बार-बार होने वाली याजकीय क्रिया है, इसलिए ‘जब-जब’ स्वाभाविक रूप से पुनरावृत्ति प्रकट करता है।
- source_word: אֹהֶל מוֹעֵד
  choice: मिलापवाला तंबू
  rationale: यह स्थापित, सुबोध हिंदी पदावली है और उस पवित्र तंबू को सूचित करती है जहाँ परमेश्वर इस्राएल से मिलता था।
- source_word: וּבְקָרְבָתָם
  choice: और जब-जब वे ... पास आते
  rationale: यह भी בְּ + infinitive construct की समयसूचक रचना है। ‘पास आते’ קרב के निकट आने के अर्थ को सहज हिंदी में व्यक्त करता है।
- source_word: הַמִּזְבֵּחַ
  choice: वेदी
  rationale: निश्चित उपपद सहित संज्ञा को संदर्भ में निश्चित और परिचित ‘वेदी’ से व्यक्त किया गया है।
- source_word: יִרְחָצוּ
  choice: तब वे अपने को धोते थे
  rationale: अपूर्ण क्रिया यहाँ अतीत की अभ्यस्त क्रिया बताती है। हिंदी का ‘धोते थे’ उस पुनरावृत्त भाव को स्पष्ट करता है; मध्यवाची अर्थ के लिए ‘अपने को’ जोड़ा गया है, बिना यह निर्धारित किए कि वे कौन-से अंग धोते थे।
- source_word: כַּאֲשֶׁר
  choice: ठीक वैसे ही जैसे
  rationale: यह पहले दी गई आज्ञा के अनुरूप कार्य करने पर बल देता है और आधुनिक हिंदी में स्वाभाविक है।
- source_word: צִוָּה
  choice: आज्ञा दी थी
  rationale: यह धुलाई से पहले दी जा चुकी आज्ञा को हिंदी के पूर्णभूत रूप में स्पष्ट करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिंदी में प्रचलित व्यक्तिगत नाम ‘यहोवा’ चतुरक्षरीय दिव्य नाम को किसी उपाधि से बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- source_word: אֶת מֹשֶׁה
  choice: मूसा को
  rationale: צוה के साथ אֶת आज्ञा पाने वाले व्यक्ति को चिह्नित करता है; हिंदी मुहावरे में ‘मूसा को आज्ञा दी’ उपयुक्त है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत दिव्य नाम है, इसलिए ‘प्रभु’ जैसी उपाधि नहीं रखी गई। आधुनिक हिंदी बाइबलीय प्रयोग में ‘यहोवा’ अधिक परिचित और तुरंत समझ में आने वाला रूप है, जबकि ‘याहवे’ संभावित वैकल्पिक लिप्यंतरण है।
- issue: धोने की क्रिया का कर्म
  choice: अपने को धोते थे
  alternative: हाथ-पैर धोते थे
  rationale: יִרְחָצוּ का कर्म इस पद में व्यक्त नहीं है। निकटवर्ती संदर्भ हाथ-पैर बताता है, पर इस पद में उसे भर देने के बजाय मूल की संक्षिप्तता बनाए रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘जब-जब ... तब’ से अभ्यस्त क्रिया स्पष्ट होती है। ‘मिलापवाला तंबू’ परिचित बाइबलीय पदावली है; वाक्य की समानांतर इब्रानी संरचना को यथासंभव बनाए रखा गया है।
