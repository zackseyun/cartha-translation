  text: He placed the basin between the tent of meeting and the altar[a], and put water there for washing.
translation:
  language: hi
  text: उसने मिलाप के तंबू और वेदी के बीच हौद[a] रखा और वहाँ धोने के लिए पानी रखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द כִּיּוֹר धोने के लिए रखे गए एक बड़े पात्र को दर्शाता है; इसलिए यहाँ ‘हौद’ कहा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: उसने … रखा
  rationale: שׂוּם का अर्थ किसी वस्तु को किसी स्थान पर रखना या स्थापित करना है। यहाँ ‘रखा’ सहज और प्रसंगानुकूल है।
- source_word: הַכִּיֹּר
  choice: हौद
  rationale: כִּיּוֹר निवास-स्थान की सेवा में धोने के लिए प्रयुक्त बड़े पात्र को दर्शाता है। ‘हौद’ आधुनिक हिंदी में उसके आकार और उपयोग को संक्षेप में व्यक्त करता है।
- source_word: בֵּין אֹהֶל מוֹעֵד וּבֵין הַמִּזְבֵּחַ
  choice: मिलापवाले तंबू और वेदी के बीच
  rationale: दोहराए गए בֵּין…וּבֵין को स्वाभाविक हिंदी में ‘…और…के बीच’ कहा गया है। אֹהֶל מוֹעֵד के लिए परिचित और अर्थ-संगत पद ‘मिलापवाला तंबू’ रखा गया है।
- source_word: וַיִּתֵּן
  choice: और … रखा
  rationale: נָתַן यहाँ रखने या डालने के अर्थ में है। ‘रखा’ मूल क्रिया के सामान्य अर्थ को बनाए रखता है और पात्र को भर देने जैसी अतिरिक्त धारणा नहीं जोड़ता।
- source_word: שָׁמָּה
  choice: वहाँ
  rationale: שָׁמָּה स्थानवाचक क्रिया-विशेषण है, जिसका सीधा अर्थ ‘वहाँ’ है। ‘उसमें’ कहने के बजाय ‘वहाँ’ मूल की अभिव्यक्ति और उसकी हल्की संदर्भगत अस्पष्टता को सुरक्षित रखता है।
- source_word: מַיִם
  choice: पानी
  rationale: यह מַיִם का सामान्य और स्वाभाविक आधुनिक हिंदी रूप है।
- source_word: לְרָחְצָה
  choice: धोने के लिए
  rationale: רָחַץ के इस क्रियार्थक रूप में उद्देश्य बताया गया है, पर धोने वाले व्यक्ति या शरीर के अंग का स्पष्ट उल्लेख नहीं है। ‘धोने के लिए’ वही अनिर्दिष्टता बनाए रखता है।
