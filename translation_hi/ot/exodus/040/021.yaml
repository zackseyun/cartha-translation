base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/021.yaml
  text: He brought the ark into the tabernacle[a], set up the veil of the screen, and screened the ark of the testimony[b], just as Yahweh had commanded Moses.
translation:
  language: hi
  text: वह सन्दूक को पवित्र निवास के भीतर ले आया, ओट का परदा लगाया, और उस परदे से साक्ष्य के सन्दूक को ओट में कर दिया,[a] ठीक वैसे ही जैसे यहोवा ने मूसा को आज्ञा दी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “साक्ष्य के सन्दूक को ढाँप दिया” अथवा “साक्ष्य के सन्दूक को परदे से अलग कर दिया।” इब्रानी क्रिया में परदे द्वारा ओट देने, ढाँपने या अलग करने का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  choice: वह ... भीतर ले आया
  rationale: בוא के हिफ़ील रूप का कारणवाचक अर्थ है; यहाँ मूसा द्वारा सन्दूक को पवित्र निवास के भीतर लाना व्यक्त होता है।
- source_word: הָאָרֹן
  choice: सन्दूक
  rationale: उपासना-संबंधी संदर्भ में אָרוֹן सामान्य पेटी नहीं, पवित्र सन्दूक को दर्शाता है।
- source_word: הַמִּשְׁכָּן
  choice: पवित्र निवास
  rationale: מִשְׁכָּן का मूल अर्थ निवास-स्थान है और निर्गमन में यह चलायमान पवित्रस्थान का नाम है; 'पवित्र निवास' आधुनिक हिन्दी में अर्थ स्पष्ट रखता है।
- source_word: פָּרֹכֶת הַמָּסָךְ
  choice: ओट का परदा
  rationale: פָּרֹכֶת भीतरी परदे को और מָסָךְ उसके आड़ या ओट देने के कार्य को व्यक्त करता है; यह पदबंध दोनों पक्ष स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וַיָּשֶׂם
  choice: उसकी जगह पर लगाया
  rationale: שׂים का अर्थ रखना या स्थापित करना है; पवित्र निवास की सज्जा के संदर्भ में नियत स्थान पर लगाने का भाव उपयुक्त है।
- source_word: וַיָּסֶךְ עַל
  choice: ओट में कर दिया
  rationale: क्रिया का अर्थ परदे द्वारा ढाँपना, छिपाना या अलग करना है; 'ओट में कर दिया' परदे के माध्यम और उसके विभाजक कार्य दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֲרוֹן הָעֵדוּת
  choice: साक्षीपत्र का सन्दूक
  rationale: הָעֵדוּת यहाँ सन्दूक में रखे वाचा-संबंधी लिखित साक्ष्य, अर्थात पटियाओं, की ओर संकेत करता है; 'साक्षीपत्र' केवल अमूर्त गवाही की अपेक्षा इस संबंध को अधिक स्पष्ट रखता है।
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: ठीक वैसे ही जैसे यहोवा ने मूसा को आज्ञा दी थी
  rationale: यह आवर्ती सूत्र परमेश्वर की आज्ञा के साथ मूसा के कार्य की पूर्ण अनुरूपता पर बल देता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी व्यक्तिगत नाम יהוה को हिन्दी में प्रचलित लिप्यंतरण 'यहोवा' से प्रस्तुत किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे प्रयुक्त है। 'यहोवा' आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक और सहज-पहचाना लिप्यंतरण है; इसे 'प्रभु' जैसी उपाधि से नहीं बदला गया।
- issue: הָעֵדוּת का आशय
  choice: साक्षीपत्र
  alternative: साक्षी / गवाही
  rationale: निर्गमन के संदर्भ में यह शब्द सन्दूक से जुड़ी वाचा की पटियाओं को सूचित करता है। 'साक्षीपत्र' लिखित साक्ष्य का संकेत देता है, पर उसे विस्तारपूर्वक 'वाचा की पटियाएँ' कहकर मूल की संक्षिप्तता को नहीं खोलता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सुबोध रखी गई है। 'ओट का परदा' और 'ओट में कर दिया' मूल के संज्ञा-क्रिया संबंध को यथासंभव बनाए रखते हैं। मुख्य पाठ का [a] चिह्न संबंधित पादटिप्पणी से मेल खाता है।
