source:
  edition: WLC
  text: וְ/אֵת֙ מִזְבַּ֣ח הָ/עֹלָ֔ה שָׂ֕ם פֶּ֖תַח מִשְׁכַּ֣ן אֹֽהֶל מוֹעֵ֑ד וַ/יַּ֣עַל עָלָ֗י/ו אֶת הָ/עֹלָה֙ וְ/אֶת הַ/מִּנְחָ֔ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/029.yaml
  text: And he set the altar of burnt offering at the entrance to the tabernacle of the tent of meeting, and offered on it the burnt offering and the grain offering, just as Yahweh had commanded Moses.
translation:
  language: hi
  text: और उसने होमबलि की वेदी मिलाप के तंबू, अर्थात् निवास-स्थान, के प्रवेश-द्वार पर रखी, और उस पर होमबलि और अन्नबलि चढ़ाई, ठीक वैसे ही जैसे याहवे ने मूसा को आज्ञा दी थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִזְבַּח הָעֹלָה
  choice: होमबलि की वेदी
  rationale: यह रचना वेदी को उसके प्रमुख बलिदानी प्रयोजन से पहचानती है। ‘होमबलि की वेदी’ प्रचलित, स्पष्ट और עֹלָה की विशिष्टता को बनाए रखता है।
- source_word: שָׂם
  choice: रखी
  rationale: स्थापना के इस प्रसंग में שׂים का सीधा और स्वाभाविक हिन्दी रूप; कर्ता मूसा और कर्म वेदी होने के कारण स्त्रीलिंग क्रिया उपयुक्त है।
- source_word: פֶּתַח
  choice: प्रवेश-द्वार पर
  rationale: यह तंबू के खुले प्रवेश-स्थान को व्यक्त करता है और स्थानगत संबंध को सहज हिन्दी में स्पष्ट रखता है।
- source_word: מִשְׁכַּן אֹהֶל מוֹעֵד
  choice: मिलापवाले तंबू के निवास-स्थान
  rationale: 'इब्रानी construct संबंध में दोनों पदों को बनाए रखा गया है: מִשְׁכָּן को ‘निवास-स्थान’ और אֹהֶל מוֹעֵד को परिचित ‘मिलापवाला तंबू’।'
- source_word: וַיַּעַל עָלָיו
  choice: उस पर ... चढ़ाई
  rationale: बलिदानी संदर्भ में עלה का अर्थ वेदी पर अर्पित करना है; ‘चढ़ाई’ हिन्दी के धार्मिक-सांस्कृतिक प्रयोग में स्वाभाविक है और ‘उस पर’ वेदी को स्थान के रूप में स्पष्ट करता है।
- source_word: הָעֹלָה
  choice: होमबलि
  rationale: पूरी तरह जलाकर चढ़ाए जाने वाले बलिदान के लिए मान्य और संक्षिप्त हिन्दी पारिभाषिक शब्द।
- source_word: הַמִּנְחָה
  choice: अन्नबलि
  rationale: याजकीय बलिदानी संदर्भ में מִנְחָה अन्न से बने अर्पण को दर्शाता है; ‘अन्नबलि’ स्थापित और सामान्य पाठक के लिए बोधगम्य है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुर्वर्णी व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नामरूप ‘यहोवा’ द्वारा प्रस्तुत किया गया है।
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: ठीक वैसे ही जैसे यहोवा ने मूसा को आज्ञा दी थी
  rationale: सूत्रवाक्य मूसा के कार्य की परमेश्वर की पूर्व आज्ञा से पूर्ण अनुरूपता पर बल देता है; ‘दी थी’ आज्ञा के पहले दिए जाने का क्रम व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत वाचा-नाम सीधे उपस्थित है, इसलिए ‘प्रभु’ जैसी उपाधि नहीं रखी गई। आधुनिक हिन्दी बाइबल-पाठकों के बीच पहचाने जाने योग्य पारंपरिक लिप्यंतरण ‘यहोवा’ चुना गया; ‘याहवे’ मूल उच्चारण के पुनर्निर्माण के अधिक निकट वैकल्पिक रूप है।
- issue: מִשְׁכַּן אֹהֶל מוֹעֵד का संबंध
  choice: मिलापवाले तंबू के निवास-स्थान
  alternative: निवास-स्थान, अर्थात् मिलापवाला तंबू
  rationale: मसोरेटिक पाठ के construct संबंध को प्राथमिकता दी गई और दोनों पवित्र-स्थान संबंधी संज्ञाएँ सुरक्षित रखी गईं; वैकल्पिक appositional अर्थ को पाठ में आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य बाइबलीय शैली अपनाई गई है। वाक्य-संरचना मूल की क्रमिकता बनाए रखती है, जबकि ‘रखी’ और ‘चढ़ाई’ जैसे स्वाभाविक हिन्दी क्रियारूप पठनीयता देते हैं। कोई पाद-टिप्पणी आवश्यक नहीं मानी गई।
