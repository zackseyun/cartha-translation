    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: जलाए
  rationale: हिफ़ील रूप का शाब्दिक अर्थ ‘ऊपर चढ़ाया/उठाया’ है, पर दीपकों के संदर्भ में यह उन्हें जलाने या उनकी लौ चढ़ाने का प्रचलित अनुष्ठानिक प्रयोग है। हिंदी में ‘दीपक जलाए’ स्वाभाविक और प्रसंगानुकूल है; शाब्दिक तथा संभावित वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: הַנֵּרֹת
  choice: दीपक
  rationale: यह शब्द दीवट पर लगे ठोस दीपकों को सूचित करता है, अमूर्त ‘ज्योति’ को नहीं।
- source_word: לִפְנֵי יְהוָה
  choice: याहवे के सामने
  rationale: यह स्थानिक और उपासना-संबंधी अभिव्यक्ति है, जिसका अर्थ ‘याहवे के सामने/उसकी उपस्थिति में’ है। ‘के सामने’ हिंदी में संक्षिप्त और स्वाभाविक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय दिव्य नाम को उपाधि से बदलने के बजाय हिंदी में उसके प्रचलित लिप्यंतरण ‘याहवे’ से व्यक्त किया गया है।
- source_word: כַּאֲשֶׁר
  choice: ठीक वैसे ही जैसे
  rationale: यह संयोजक पहले दी गई आज्ञा के साथ पूर्ण अनुरूपता दर्शाता है।
- source_word: צִוָּה
  choice: आज्ञा दी थी
  rationale: पूर्ण क्रिया कथा की वर्तमान कार्रवाई से पहले दी गई आज्ञा को दर्शाती है; ‘दी थी’ यह पूर्वकालिक संबंध स्वाभाविक हिंदी में स्पष्ट करता है।
- source_word: אֶת מֹשֶׁה
  choice: मूसा को
  rationale: אֶת मूसा को क्रिया का प्रत्यक्ष कर्म चिह्नित करता है; हिंदी में ‘मूसा को आज्ञा दी’ स्वाभाविक रचना है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम सीधे प्रयुक्त है। ‘याहवे’ उसे उपाधि ‘प्रभु’ से प्रतिस्थापित किए बिना प्रस्तुत करता है; ‘यहोवा’ एक पारंपरिक वैकल्पिक लिप्यंतरण है।
- issue: וַיַּעַל से सूचित दीपक-संबंधी क्रिया
  choice: दीपक जलाए
  alternative: दीपक लगाए/सजाए
  rationale: दीवट के अनुष्ठानिक संदर्भ में यह अभिव्यक्ति सामान्यतः दीपक जलाने अथवा लौ चढ़ाने को सूचित करती है। फिर भी क्रिया अपने आप में व्यवस्था/स्थापना की संभावना पूरी तरह समाप्त नहीं करती, इसलिए वैकल्पिक संभावना पादटिप्पणी में दी गई है।
