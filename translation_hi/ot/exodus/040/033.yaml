  yaml_path: translation/ot/exodus/040/033.yaml
  text: Then he set up the courtyard around the tabernacle and the altar[a], and put up the screen for the gate of the courtyard. So Moses finished the work.
translation:
  language: hi
  text: फिर उसने पवित्र निवास और वेदी के चारों ओर आँगन की घेराबंदी खड़ी की और आँगन के द्वार का परदा[a] लगाया। मूसा ने काम पूरा किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘ओट’ अथवा ‘लटकता हुआ आवरण’; हिब्रू शब्द מָסַךְ आँगन के प्रवेश पर लगे कपड़े के आवरण को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: खड़ा किया
  rationale: हिफ़इल रूप यहाँ किसी संरचना को स्थापित या खड़ा करने का अर्थ देता है; निर्माण के प्रसंग में यह स्वाभाविक और सटीक है।
- source_word: הֶחָצֵר
  choice: आँगन
  rationale: यह पवित्र निवास के चारों ओर के घेरेदार खुले स्थान को दर्शाता है; आधुनिक हिन्दी में ‘आँगन’ स्पष्ट और सहज है।
- source_word: סָבִיב
  choice: चारों ओर
  rationale: यह पवित्र निवास और वेदी को घेरने का भाव स्पष्ट रूप से व्यक्त करता है।
- source_word: לַמִּשְׁכָּן
  choice: पवित्र निवास
  rationale: מִשְׁכָּן का मूल भाव ‘निवास-स्थान’ है और निर्गमन में यह विशेष पवित्र तंबू का तकनीकी नाम है; ‘पवित्र निवास’ अर्थ और प्रसंग दोनों को स्पष्ट रखता है।
- source_word: וְלַמִּזְבֵּחַ
  choice: और वेदी
  rationale: מִזְבֵּחַ का सीधा और प्रचलित हिन्दी प्रतिशब्द ‘वेदी’ है।
- source_word: וַיִּתֵּן
  choice: लगा दिया
  rationale: נתן का मूल अर्थ ‘रखना’ है, पर इस निर्माण-प्रसंग में प्रवेश के वस्त्र को उसके स्थान पर लगाने का कार्य अभिप्रेत है।
- source_word: מָסַךְ
  choice: परदा
  rationale: यह प्रवेश को ढकने वाला कपड़े का परदा या ओट है; ‘परदा’ साधारण पाठक के लिए सबसे स्वाभाविक शब्द है, जबकि वैकल्पिक बारीकी पादटिप्पणी में दी गई है।
- source_word: שַׁעַר הֶחָצֵר
  choice: आँगन के द्वार पर
  rationale: हिब्रू में ‘आँगन के द्वार का परदा’ है; हिन्दी में ‘द्वार पर परदा लगाया’ वही संबंध अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וַיְכַל
  choice: पूरा किया
  rationale: כלה यहाँ कार्य को समाप्त और पूर्ण करने का भाव देता है।
- source_word: הַמְּלָאכָה
  choice: सारा काम
  rationale: מְלָאכָה पूरे निर्माण-कार्य का सार है; ‘सारा’ संदर्भ में उसकी समग्र पूर्णता को स्वाभाविक हिन्दी में प्रकट करता है।
