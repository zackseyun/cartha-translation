  text: וּ/בְ/הֵעָל֤וֹת הֶֽ/עָנָן֙ מֵ/עַ֣ל הַ/מִּשְׁכָּ֔ן יִסְע֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל בְּ/כֹ֖ל מַסְעֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/036.yaml
  text: Whenever the cloud was taken up from over the tabernacle[a], the sons of Israel would set out in all their journeys.
translation:
  language: hi
  text: जब-जब बादल पवित्र निवास के ऊपर से उठता था, तब इस्राएल के पुत्र[a] अपनी सारी यात्राओं में कूच करते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात “इस्राएली”; इब्रानी में शाब्दिक रूप से “इस्राएल के पुत्र।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהֵעָלֹת
  choice: जब-जब ... उठता था
  rationale: बे उपसर्ग के साथ क्रिया का infinitive construct कालवाचक उपवाक्य बनाता है। प्रसंग में यह बार-बार होने वाली स्थिति है, इसलिए ‘जब-जब’ और अपूर्ण भूतकाल ‘उठता था’ उसके आवर्ती भाव को स्वाभाविक हिंदी में व्यक्त करते हैं।
- source_word: הֶעָנָן
  choice: बादल
  rationale: यह निश्चित संज्ञा प्रसंग में पहले से बताए गए परमेश्वर की उपस्थिति से जुड़े विशिष्ट बादल को सूचित करती है।
- source_word: מֵעַל
  choice: के ऊपर से
  rationale: यह किसी वस्तु के ऊपर स्थित स्थान से हटने या ऊपर उठने का भाव देता है।
- source_word: הַמִּשְׁכָּן
  choice: पवित्र निवास
  rationale: מִשְׁכָּן का मूल अर्थ ‘निवास’ है और निर्गमन में यह चलायमान पवित्रस्थान को दर्शाता है। ‘पवित्र निवास’ आधुनिक हिंदी में स्पष्ट है और इसे केवल साधारण आवास समझे जाने से बचाता है।
- source_word: יִסְעוּ
  choice: कूच करते थे
  rationale: נסע यहाँ पड़ाव से आगे यात्रा के लिए निकलने को दर्शाता है। ‘कूच करते थे’ अपूर्ण क्रिया के आदतन अर्थ और इस्राएल की चरणबद्ध यात्रा दोनों को व्यक्त करता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्र
  rationale: यह इब्रानी पद का औपचारिक रूप सुरक्षित रखता है; पद पूरे इस्राएली समुदाय के लिए सामूहिक नाम के रूप में प्रयुक्त है, जिसे पाद-टिप्पणी स्पष्ट करती है।
- source_word: בְּכֹל מַסְעֵיהֶם
  choice: अपनी सारी यात्राओं में
  rationale: यह वाक्यांश उनकी यात्रा के सभी चरणों में लागू होने वाली नियमित प्रक्रिया का सार देता है।
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל का सामूहिक पदनाम
  choice: इस्राएल के पुत्र
  alternative: इस्राएली
  rationale: मुख्य पाठ में इब्रानी अभिव्यक्ति का रूप बनाए रखा गया है, जबकि पाद-टिप्पणी स्पष्ट करती है कि यह पूरे इस्राएली समुदाय का सामूहिक पदनाम है; इससे न तो संदर्भ अनावश्यक रूप से सीमित होता है, न स्रोत की अभिव्यक्ति मिटती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘जब-जब ... तब’ आवर्ती घटनाक्रम को स्पष्ट करता है; ‘कूच करते थे’ यात्रा के लिए पड़ाव छोड़ने का स्वाभाविक हिंदी रूप है।
