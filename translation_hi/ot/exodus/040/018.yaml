  text: So Moses set up the tabernacle[a], and placed its bases, and set its frames, and put in its bars[c][b], and raised up its pillars.
translation:
  language: hi
  text: तब मूसा ने निवास-स्थान[a] खड़ा किया; उसकी आधार-चौकियाँ[b] रखीं, उसके चौखटे[c] लगाए, उसके डंडे लगाए और उसके खंभे[d] खड़े किए।
  philosophy: optimal-equivalence
  footnotes:
