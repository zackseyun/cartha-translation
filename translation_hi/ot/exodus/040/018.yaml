- source_word: אֲדָנָיו
  choice: आधार-चौकियाँ
  rationale: אֶדֶן उन नींव के टुकड़ों अथवा खाँचेदार आधारों को दर्शाता है जिनमें चौखटे टिकते थे; ‘आधार-चौकियाँ’ सामान्य पाठक को उनका संरचनात्मक कार्य समझाती हैं।
- source_word: קְרָשָׁיו
  choice: चौखटे
