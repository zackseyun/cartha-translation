- source_word: בְּרִיחָיו
  choice: डंडे
  rationale: בְּרִיחַ उन आड़े डंडों को दर्शाता है जो चौखटों को एक साथ बाँधते थे; ‘डंडे’ स्पष्ट और स्वाभाविक है, जबकि अधिक विशिष्ट विकल्प पादटिप्पणी में दिया गया है।
- source_word: עַמּוּדָיו
  choice: खंभे
  rationale: עַמּוּד सीधे खड़े सहारों के लिए प्रयुक्त है; ‘खंभे’ आधुनिक मानक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: וַיָּשֶׂם
  choice: लगाए
  rationale: שׂוּם का अर्थ रखना या स्थापित करना है; चौखटों के साथ ‘लगाए’ निर्माण-क्रम में स्वाभाविक है।
- source_word: וַיִּתֵּן
  choice: रखीं / लगाए
  rationale: נָתַן यहाँ वस्तुओं को उनके स्थान पर रखने के अर्थ में है; हिन्दी में अलग-अलग वस्तुओं के अनुसार क्रिया बदलने से वाक्य स्वाभाविक रहता है और मूल क्रिया का आशय सुरक्षित रहता है।
