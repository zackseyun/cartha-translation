    text: या “पवित्र तंबू”; इब्रानी शब्द का शाब्दिक अर्थ “निवास-स्थान” है।
    reason: lexical_alternative
  - marker: b
    text: या “आधार-खाँचे” या “सॉकेट”; ये वे आधार-टुकड़े थे जिनमें चौखटे टिकते थे।
    reason: lexical_alternative
  - marker: c
    text: या “तख्ते”; इब्रानी शब्द यहाँ निवास-स्थान के खड़े संरचनात्मक सदस्यों को दर्शाता है।
