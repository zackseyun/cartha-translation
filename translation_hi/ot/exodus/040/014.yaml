lexical_decisions:
- source_word: וְאֶת
  choice: और
  rationale: संयोजक अगले निर्देश को क्रम में जोड़ता है; कर्म-सूचक אֶת का हिन्दी में अलग अनुवाद आवश्यक नहीं है।
- source_word: בָּנָיו
  choice: उसके पुत्रों को
  rationale: यह पद विशेष रूप से पुरुष संतानों को दर्शाता है और यहाँ हारून के पुत्र अभिप्रेत हैं।
- source_word: תַּקְרִיב
  choice: पास ले आना
  rationale: קרב के हिफ़ील रूप का अर्थ किसी को निकट लाना या औपचारिक रूप से प्रस्तुत करना हो सकता है; यह चयन मूल की स्थानगत तथा याजकीय दोनों छायाओं को बनाए रखता है।
- source_word: וְהִלְבַּשְׁתָּ
  choice: और ... पहनाना
  rationale: क्रिया का कारक अर्थ है किसी को वस्त्र पहनाना; हिन्दी में 'पहनाना' स्वाभाविक और सटीक है।
- source_word: אֹתָם
  choice: उन्हें
  rationale: यह कर्मवाचक सर्वनाम पीछे उल्लिखित पुत्रों की ओर संकेत करता है।
- source_word: כֻּתֳּנֹת
  choice: अंगरखे
  rationale: यह शरीर पर पहने जाने वाले लंबे मूल वस्त्रों को दर्शाता है; 'अंगरखे' आधुनिक हिन्दी में समझने योग्य है और मूल में अनुपस्थित 'सन के' नहीं जोड़ता।
theological_decisions:
- issue: קרב का याजकीय/उपासना-संबंधी भाव
  choice: पास ले आना
  alternative: उपस्थित करना; आगे ले आना
  rationale: प्रसंग याजकीय प्रतिष्ठापन का है। 'पास ले आना' हिब्रू की मूल निकटता की धारणा को सुरक्षित रखता है, जबकि पादटिप्पणी उसके औपचारिक पवित्र-सेवा संबंधी अर्थ की संभावना स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण निर्देशात्मक शैली रखी गई है। 'अंगरखे' को याजकीय वस्त्र के लिए सहज और पर्याप्त विशिष्ट शब्द माना गया है।
