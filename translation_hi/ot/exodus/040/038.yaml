source:
  edition: WLC
  text: כִּי֩ עֲנַ֨ן יְהוָ֤ה עַֽל הַ/מִּשְׁכָּן֙ יוֹמָ֔ם וְ/אֵ֕שׁ תִּהְיֶ֥ה לַ֖יְלָה בּ֑/וֹ לְ/עֵינֵ֥י כָל בֵּֽית יִשְׂרָאֵ֖ל בְּ/כָל מַסְעֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/038.yaml
  text: For the cloud of Yahweh was over the tabernacle by day[a], and fire was in it by night[b], before the eyes of all the house of Israel throughout all their journeys.
translation:
  language: hi
  text: क्योंकि दिन के समय याहवे का बादल निवास-तंबू के ऊपर रहता था, और रात के समय उसमें[a] आग रहती थी। यह इस्राएल के पूरे घराने की आँखों के सामने उनकी सभी यात्राओं के दौरान बना रहता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उसमें’ का संकेत संदर्भ के अनुसार बादल की ओर है; व्याकरणतः इसे निवास-तंबू से भी जोड़ा जा सकता है।
    reason: सर्वनाम के पूर्वपद की संदर्भगत अस्पष्टता
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह अव्यय पिछली घटनाओं का कारणात्मक और व्याख्यात्मक सार प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עֲנַן יְהוָה
  choice: याहवे का बादल
  rationale: सम्बन्धवाचक रचना को सीधे और स्वाभाविक हिन्दी में रखा गया है, बिना बादल को स्वयं याहवे के साथ एकरूप किए।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि में बदलने के बजाय हिन्दी लिप्यंतरण में प्रस्तुत किया गया है।
- source_word: הַמִּשְׁכָּן
  choice: निवास-तंबू
  rationale: ‘निवास’ मूल धातु और पवित्र निवास के भाव को रखता है, जबकि ‘तंबू’ पाठक को इस चलायमान पवित्र स्थान का ठोस स्वरूप समझाता है।
- source_word: יוֹמָם ... לַיְלָה
  choice: दिन के समय ... रात के समय
  rationale: समानांतर काल-सूचक शब्दों को सहज आधुनिक हिन्दी में समान संरचना के साथ व्यक्त किया गया है।
- source_word: וְאֵשׁ תִּהְיֶה לַיְלָה בּוֹ
  choice: और रात के समय उसमें आग रहती थी
  rationale: अपूर्ण क्रिया यहाँ जंगल की यात्राओं के दौरान बार-बार बनी रहने वाली स्थिति का सार देती है। בּוֹ को मुख्य पाठ में ‘उसमें’ रखा गया है, पर उसके संदर्भ और स्थानगत अर्थ की वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है।
- source_word: לְעֵינֵי כָל בֵּית יִשְׂרָאֵל
  choice: इस्राएल के पूरे घराने की आँखों के सामने
  rationale: ठोस इब्रानी मुहावरे और इस्राएल की सामूहिक पहचान, दोनों को बनाए रखा गया है।
- source_word: בְּכָל מַסְעֵיהֶם
  choice: उनकी सभी यात्राओं के दौरान
  rationale: מַסָּע यात्रा अथवा यात्रा के चरण को सूचित कर सकता है; यह चयन पूरे मरुभूमि-प्रवास में जारी स्थिति को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है; लिप्यंतरण उस नाम को सामान्य उपाधि में बदले बिना सुरक्षित रखता है।
- issue: रात की आग किसमें या किस पर थी
  choice: उसमें
  alternative: उसके ऊपर
  rationale: בְּ का सामान्य अर्थ ‘में’ है, पर पुल्लिंग एकवचन सर्वनाम बादल या निवास-तंबू की ओर संकेत कर सकता है, और प्रसंग स्थानगत ‘ऊपर’ समझने की भी गुंजाइश देता है। मुख्य पाठ इस तनाव को अतिनिर्धारित नहीं करता और विकल्प पादटिप्पणी में देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रखी गई है। ‘निवास-तंबू’ तकनीकी धार्मिक शब्द के साथ उसके ठोस अर्थ को भी सामने लाता है। अंतिम वाक्यांश को हिन्दी में पूर्ण वाक्य बनाया गया है, ताकि यह स्पष्ट हो कि दृश्य उपस्थिति सभी यात्राओं के दौरान बनी रही।
