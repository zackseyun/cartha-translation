  choice: दूसरे वर्ष के पहले महीने
  rationale: यह हिंदी में स्वाभाविक तिथि-विन्यास है और दोनों क्रमवाचक काल-सूचकों को ठीक बनाए रखता है।
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: के पहले दिन
  rationale: शाब्दिक रूप ‘महीने के एक पर’ एक हिब्रू तिथि-मुहावरा है, जिसका अर्थ महीने का पहला दिन है।
- source_word: הוּקַם
  choice: खड़ा किया गया
  rationale: קום के होफल रूप का कर्मवाच्य अर्थ सुरक्षित रहता है और तंबू-जैसी संरचना के स्थापित किए जाने के लिए यह सहज आधुनिक हिंदी है।
- source_word: הַמִּשְׁכָּן
  choice: निवास-तंबू
  rationale: מִשְׁכָּן की ‘निवास’ संबंधी अर्थ-छाया और निर्गमन में उसके चलायमान पवित्र तंबू होने की विशिष्टता, दोनों को व्यक्त करता है।
