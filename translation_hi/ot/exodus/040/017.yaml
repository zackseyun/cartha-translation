  choice: '[अलग शब्द से अनूदित नहीं]'
  rationale: हिब्रू कथात्मक सूत्र यहाँ घटना और समय-निर्देश को आगे बढ़ाता है। हिंदी में सीधे काल-वाक्य से आरंभ करना अधिक स्वाभाविक है; ‘और ऐसा हुआ’ जोड़ने से अनावश्यक भारीपन आता।
