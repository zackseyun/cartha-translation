  text: And you shall place there the ark of the testimony[b][a], and you shall screen the ark with the curtain.
translation:
  language: hi
  text: और वहाँ साक्ष्य के संदूक[b] को रखना, और परदे[a] से संदूक को ओट में कर देना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह निवास-स्थान का भीतरी परदा था, जो संदूक को ओट में रखता था।
    reason: lexical_alternative
  - marker: b
    text: कुछ परंपरागत अनुवादों में ‘वाचा का संदूक’; यहाँ इब्रानी पाठ में ‘साक्ष्य’ है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: रखना
  rationale: निर्देशों की इस शृंखला में संयोजक सहित पूर्ण क्रिया आज्ञार्थक भाव रखती है। हिंदी में ‘रखना’ मूसा को दिए गए निर्देश को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: שָׁם
  choice: वहाँ
  rationale: यह स्थानवाचक क्रियाविशेषण पिछले संदर्भ में बताए गए निवास-स्थान की ओर संकेत करता है; ‘वहाँ’ मूल की संकेतात्मकता बनाए रखता है।
- source_word: אֲרוֹן הָעֵדוּת
  choice: साक्षी का संदूक
  rationale: इब्रानी पद का सीधा अर्थ ‘साक्षी/गवाही का संदूक’ है। ‘वाचा का संदूक’ से सामंजस्य बैठाने के बजाय मूल पद עֵדוּת को सुरक्षित रखा गया है।
- source_word: וְסַכֹּתָ
  choice: ओट में कर देना
  rationale: סכך का अर्थ ढाँपना, आड़ करना या ओट में करना है। यहाँ परदा संदूक पर बिछाया नहीं जाता, बल्कि उसे दृष्टि से अलग करने वाली आड़ बनता है; इसलिए यह प्रयोग स्थानिक कार्य को स्पष्ट करता है।
- source_word: עַל הָאָרֹן
  choice: संदूक को
  rationale: עַל का मूल अर्थ ‘पर/ऊपर’ है, पर इस क्रिया और तंबू की व्यवस्था में भाव संदूक को परदे की आड़ में करने का है। हिंदी वाक्य-विन्यास में कर्मकारक इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַפָּרֹכֶת
  choice: परदा
  rationale: यह शब्द निवास-स्थान के भीतर संदूक को अलग रखने वाले परदे के लिए है। ‘परदा’ आधुनिक हिंदी में सहज और बोधगम्य है।
theological_decisions:
- issue: संदूक की उपाधि
  choice: साक्षी का संदूक
  alternative: वाचा का संदूक
  rationale: यहाँ इब्रानी पाठ में עֵדוּת, अर्थात ‘साक्षी/गवाही’, है; इसलिए अधिक परिचित ‘वाचा’ पद लाकर मूल की शब्दावली को नहीं बदला गया।
- issue: פָּרֹכֶת का अनुवाद
  choice: परदा
  alternative: भीतरी परदा
  rationale: मुख्य पाठ में सरल ‘परदा’ रखा गया है। संदर्भ से इसका विशेष, भीतरी विभाजक परदा होना स्पष्ट है और पादटिप्पणी में उसका कार्य बताया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। मूसा को दिए गए क्रमिक निर्देश के लिए हिंदी की स्वाभाविक आज्ञार्थक रचना ‘रखना…कर देना’ अपनाई गई है। ‘साक्षी’ मूल की धार्मिक शब्दावली और ‘ओट में’ परदे के वास्तविक स्थानिक कार्य को सुरक्षित रखते हैं।
