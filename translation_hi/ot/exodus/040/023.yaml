base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/023.yaml
  text: And he arranged on it the bread in order before Yahweh[a], just as Yahweh had commanded Moses.
translation:
  language: hi
  text: और उसने उस पर यहोवा के सामने रोटियाँ क्रम से रखीं, ठीक वैसे ही जैसे यहोवा ने मूसा को आज्ञा दी थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲרֹךְ
  choice: क्रम से रखीं
  rationale: ערך का अर्थ व्यवस्थित करना या क्रम से रखना है; यहाँ यह मेज़ पर रोटियों को निर्धारित व्यवस्था में रखने की क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עָלָיו
  choice: उस पर
  rationale: पुल्लिंग एकवचन सर्वनाम पिछले पद की मेज़ की ओर संकेत करता है; ‘उस पर’ स्थान-संबंध को स्पष्ट और सहज रूप में रखता है।
- source_word: עֵרֶךְ לֶחֶם
  choice: रोटियाँ क्रम से
  rationale: यह पदबंध रोटी की व्यवस्थित सजावट या क्रम को दर्शाता है। हिन्दी में बहुवचन ‘रोटियाँ’ प्रसंगानुकूल है और ‘क्रम से’ मूल के व्यवस्था-बोध को बनाए रखता है, बिना इसे तकनीकी पारंपरिक पद ‘भेंट की रोटी’ में बदलने के।
- source_word: לִפְנֵי יְהוָה
  choice: यहोवा के सामने
  rationale: लִפְנֵי का मूल स्थानिक और उपासना-संबंधी भाव ‘के सामने/उपस्थिति में’ है; ‘के सामने’ संक्षिप्त तथा स्वाभाविक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबलीय प्रयोग में यह चतुरक्षरीय परमेश्वर-नाम का व्यापक और पहचाना हुआ लिप्यंतरण है; यह नाम को किसी उपाधि से प्रतिस्थापित नहीं करता।
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: ठीक वैसे ही जैसे यहोवा ने मूसा को आज्ञा दी थी
  rationale: ‘ठीक वैसे ही’ निर्देश के अनुरूप पूर्ण पालन पर बल देता है, और ‘दी थी’ पहले दी जा चुकी आज्ञा को स्वाभाविक हिन्दी काल-प्रयोग में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। ‘यहोवा’ आधुनिक हिन्दी पाठकों के लिए व्यापक रूप से पहचाना हुआ रूप है और नाम को ‘प्रभु’ जैसी उपाधि से नहीं बदलता; ‘याहवे’ अधिक अकादमिक लिप्यंतरण है।
- issue: עֵרֶךְ לֶחֶם को पारंपरिक तकनीकी नाम से व्यक्त करना
  choice: रोटियाँ क्रम से
  alternative: उपस्थिति की रोटी
  rationale: इस पद में לֶחֶם הַפָּנִים वाला पारंपरिक तकनीकी पदबंध नहीं, बल्कि रोटी की व्यवस्था बताने वाला עֵרֶךְ לֶחֶם है। इसलिए वर्णनात्मक अर्थ रखा गया है और व्यापक संस्था से लिया गया नाम आरोपित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और साधारण पाठक के लिए सहज रखी गई है। वाक्य की इब्रानी क्रमिक संरचना को बनाए रखते हुए हिन्दी में स्वाभाविक शब्दक्रम अपनाया गया है।
