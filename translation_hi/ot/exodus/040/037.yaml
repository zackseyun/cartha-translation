    reason: referent_clarification
lexical_decisions:
- source_word: וְאִם
  choice: परन्तु यदि
  rationale: यह पद पिछले पद की स्थिति के विपरीत शर्त रखता है; ‘परन्तु यदि’ इस संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יֵעָלֶה
  choice: ऊपर न उठता
  rationale: עלה के मूल अर्थ ‘ऊपर जाना/उठना’ को बादल के सन्दर्भ में स्पष्ट और स्वाभाविक रूप से रखा गया है; अनावश्यक कर्मवाच्य नहीं जोड़ा गया।
- source_word: הֶעָנָן
  choice: बादल
  rationale: निश्चित संज्ञा उसी पहले से उल्लिखित बादल को सूचित करती है; हिन्दी में प्रसंग से निश्चितता स्पष्ट है।
- source_word: יִסְעוּ
  choice: आगे न बढ़ते
  rationale: נסע पड़ाव से यात्रा आरम्भ करने को दर्शाता है; ‘आगे न बढ़ते’ प्रसंगानुकूल, सहज और सामान्य पाठकों के लिए स्पष्ट है।
- source_word: עַד יוֹם
  choice: उस दिन तक
  rationale: इब्रानी में ‘दिन’ स्पष्ट रूप से है, इसलिए इसे सामान्य ‘समय’ में नहीं बदला गया।
- source_word: הֵעָלֹתוֹ
  choice: जब वह ऊपर उठता
  rationale: शाब्दिक रूप ‘उसके ऊपर उठने का’ है। हिन्दी में कालवाचक उपवाक्य अधिक स्वाभाविक है और ‘वह’ का संकेत बादल की ओर है।
