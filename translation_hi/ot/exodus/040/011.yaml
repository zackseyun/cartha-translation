  yaml_path: translation/ot/exodus/040/011.yaml
  text: You shall anoint the basin and its stand[b][a], and consecrate it.
translation:
  language: hi
  text: और हौदी और उसके पाए[a] का अभिषेक करना, और उसे पवित्र ठहराना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आधार।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָשַׁחְתָּ
  choice: और ... का अभिषेक करना
  rationale: משׁח पवित्र-स्थान की विधि में तेल से अभिषेक करके किसी वस्तु को पवित्र उपयोग के लिए नियुक्त करने को व्यक्त करता है। आज्ञाओं की इस शृंखला में हिंदी का निर्देशात्मक क्रिया-रूप स्वाभाविक है।
- source_word: הַכִּיֹּר
  choice: हौदी
  rationale: כִּיּוֹר यहाँ मिलापवाले तंबू की सेवा में धोने के लिए प्रयुक्त बड़े पात्र को दर्शाता है। ‘हौदी’ आधुनिक हिंदी में बड़े जल-पात्र का स्पष्ट और संक्षिप्त नाम है।
- source_word: כַּנּוֹ
  choice: उसका पाया
  rationale: כֵּן यहाँ हौदी को सहारा देने वाली संरचना है। ‘पाया’ सहायक आधार का स्वाभाविक हिंदी शब्द है; ‘आधार’ भी संभव है।
- source_word: וְקִדַּשְׁתָּ אֹתוֹ
  choice: और उसे पवित्र ठहराना
  rationale: קדשׁ का पिएल रूप यहाँ किसी वस्तु को पवित्र सेवा के लिए अलग ठहराने की विधिक क्रिया बताता है। एकवचन सर्वनाम ‘उसे’ मूल की व्याकरणिक संख्या को बनाए रखता है और प्रसंग में हौदी-पाए की संयुक्त वस्तु की ओर संकेत कर सकता है।
theological_decisions:
- issue: पवित्र-स्थान संबंधी प्रसंग में קדשׁ का अनुवाद
  choice: पवित्र ठहराना
  alternative: अर्पित करना / पवित्र करना
  rationale: ‘पवित्र ठहराना’ नैतिक परिवर्तन के बजाय पवित्र उपयोग के लिए अलग किए जाने का अर्थ स्पष्ट करता है और किसी विशिष्ट सांप्रदायिक व्याख्या को नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘अभिषेक’ और ‘पवित्र ठहराना’ इस विधिक-पवित्र प्रसंग के स्थापित किंतु समझने योग्य शब्द हैं।
