base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/006.yaml
  text: And you shall place the altar of burnt offering before the entrance of the tabernacle[a], the tent of meeting.
translation:
  language: hi
  text: और होमबलि की वेदी को निवासस्थान, अर्थात् मिलाप के तंबू, के प्रवेश-द्वार के सामने रखना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: और ... रखना
  rationale: נתן का मूल अर्थ ‘देना/रखना/स्थापित करना’ है; वस्तुओं की नियत व्यवस्था के इस प्रसंग में हिंदी का आदेशात्मक क्रियारूप ‘रखना’ स्वाभाविक और सटीक है।
- source_word: מִזְבַּח הָעֹלָה
  choice: होमबलि की वेदी
  rationale: यह संबंध-पदबंध उस वेदी को दर्शाता है जिस पर पूरी तरह जलायी जानेवाली बलि चढ़ती थी; ‘होमबलि की वेदी’ हिंदी बाइबलीय प्रयोग में संक्षिप्त और परिचित है।
- source_word: לִפְנֵי
  choice: के सामने
  rationale: स्थान-सूचक अर्थ ‘के सामने/आगे’ है; यहाँ ‘के सामने’ स्थानिक संबंध को स्पष्ट करता है।
- source_word: פֶּתַח
  choice: प्रवेश-द्वार
  rationale: यह प्रवेश की खुली जगह या द्वार को दर्शाता है; ‘प्रवेश-द्वार’ साधारण पाठक के लिए स्पष्ट है।
- source_word: מִשְׁכַּן
  choice: निवासस्थान
  rationale: मִשְׁכָּן का मूल अर्थ ‘निवासस्थान’ है और निर्गमन में यह पवित्र निवास की संरचना का तकनीकी नाम है; यह अनुवाद अर्थ को पारदर्शी रखता है।
- source_word: אֹהֶל מוֹעֵד
  choice: मिलापवाला तंबू
  rationale: यह नियत भेंट/मुलाकात के तंबू का स्थिर पदनाम है; ‘मिलापवाला तंबू’ हिंदी बाइबलीय परंपरा में पहचाना जानेवाला और सहज रूप है।
theological_decisions:
- issue: מִשְׁכַּן और אֹהֶל מוֹעֵד का पारस्परिक संबंध
  choice: ‘मिलापवाले तंबू के निवासस्थान’ के रूप में निकट संबंध बनाए रखा
  alternative: ‘निवासस्थान, अर्थात् मिलापवाला तंबू’
  rationale: इब्रानी में दोनों संज्ञाएँ बिना स्पष्ट व्याख्यात्मक संयोजक के साथ आती हैं। मुख्य पाठ उनका संबंध बनाए रखता है, पर ‘अर्थात्’ जोड़कर समानता को आवश्यकता से अधिक स्पष्ट नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण निर्देशात्मक शैली। ‘रखना’ निर्गमन 40 के क्रमिक आदेशों के लिए स्वाभाविक है। ‘निवासस्थान’ मूल शब्द की छवि बचाता है और ‘मिलापवाला तंबू’ स्थापित धार्मिक पदनाम को बनाए रखता है।
