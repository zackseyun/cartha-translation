    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: ने…कहा
  rationale: यह क्रिया दिव्य वाणी के सूत्रबद्ध परिचय में प्रयुक्त है। हिन्दी में ‘मूसा से कहा’ स्वाभाविक है और कथन की क्रिया को स्पष्ट रूप से व्यक्त करता है।
- source_word: וַ
  choice: तब
  rationale: आरम्भिक वाव कथा को आगे बढ़ाता है; ‘तब’ क्रमिक प्रगति को सहज आधुनिक हिन्दी में दर्शाता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम YHWH है। हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ नाम को उपाधि से प्रतिस्थापित किए बिना सुरक्षित रखता है।
- source_word: אֶל מֹשֶׁה
  choice: मूसा से
  rationale: वाणी के संदर्भ में हिन्दी परसर्ग ‘से’ संबोधित व्यक्ति को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לֵאמֹר
  choice: कहा
  rationale: यह आगामी प्रत्यक्ष वचन का परिचय देने वाला सूत्र है। हिन्दी में अलग से ‘यह कहते हुए’ जोड़ना अनावश्यक और असहज होगा; ‘कहा’ वही कार्य पूरा करता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: पाठ में उपाधि नहीं, चार अक्षरों वाला व्यक्तिगत दिव्य नाम है। ‘यहोवा’ सामान्य हिन्दी बाइबलीय प्रयोग में पहचाना जाने वाला लिप्यंतरण है; ‘याहवे’ भी सम्भव विद्वत्तापूर्ण पुनर्निर्माण है, पर मूल उच्चारण निश्चित नहीं है।
translation_notes:
