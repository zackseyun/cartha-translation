base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/026.yaml
  text: And he placed the gold altar in the tent of meeting[a], before the veil.
translation:
  language: hi
  text: फिर उसने सोने की वेदी मिलाप के तंबू में, परदे[a] के सामने रखी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह इब्रानी शब्द निवास के भीतरी भाग को अलग करने वाले परदे के लिए प्रयुक्त हुआ है।
    reason: शब्द का संदर्भगत अर्थ स्पष्ट करना
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: फिर उसने ... रखी
  rationale: वय्यिक्तोल रूप क्रमिक भूतकालीन कार्य बताता है। ‘फिर’ कथानक के क्रम को और ‘रखी’ वस्तु को निश्चित स्थान पर स्थापित करने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִזְבַּח הַזָּהָב
  choice: सोने की वेदी
  rationale: इब्रानी पदबंध का शाब्दिक अर्थ ‘सोने की वेदी’ है; यह आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: בְּאֹהֶל מוֹעֵד
  choice: मिलाप के तंबू में
  rationale: यह पवित्रस्थान की संरचना का प्रचलित बाइबलीय नाम है। ‘मिलाप’ परमेश्वर और लोगों के मिलने के आशय को बनाए रखता है।
- source_word: לִפְנֵי
  choice: के सामने
  rationale: यह स्थान-संबंध को आधुनिक हिन्दी में स्पष्ट रूप से व्यक्त करता है।
- source_word: הַפָּרֹכֶת
  choice: परदा
  rationale: यह शब्द तंबू के भीतरी विभाजक परदे को सूचित करता है। ‘परदा’ हिन्दी में सटीक और सहज है; ‘घूँघट’ इस स्थापत्य और उपासना-संबंधी संदर्भ में अनुपयुक्त होगा।
theological_decisions:
- issue: הַפָּרֹכֶת के लिए पवित्रस्थान-संबंधी शब्दावली
  choice: परदा
  alternative: भीतरी परदा
  rationale: मूल पाठ केवल निश्चित पद ‘परदा’ कहता है। मुख्य पाठ में ‘भीतरी’ जोड़ने के बजाय संदर्भगत जानकारी पादटिप्पणी में दी गई है, जिससे मूल की संक्षिप्तता और बाद के बाइबलीय संदर्भों में इसकी महत्ता दोनों बनी रहती हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मिलाप का तंबू’ और ‘वेदी’ जैसी स्थापित बाइबलीय शब्दावली बनाए रखी गई है।
