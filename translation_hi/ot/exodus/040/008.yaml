lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: और ... खड़ा करना
  rationale: שׂים का मूल अर्थ ‘रखना/स्थापित करना’ है; निवास-स्थान की रचना के संदर्भ में आँगन को ‘खड़ा करना’ स्वाभाविक और ठोस है। पूर्ववर्ती आदेश-शृंखला के अनुरूप हिन्दी में क्रियार्थक आदेश-रूप रखा गया है।
- source_word: הֶחָצֵר
  choice: आँगन
  rationale: חָצֵר यहाँ निवास-स्थान को घेरे हुए खुले प्रांगण को दर्शाता है; ‘आँगन’ साधारण आधुनिक हिन्दी में स्पष्ट है।
- source_word: סָבִיב
  choice: चारों ओर
  rationale: यह आँगन की घेरेदार स्थापना का व्यापक अर्थ व्यक्त करता है।
- source_word: וְנָתַתָּ
  choice: और ... लगाना
  rationale: נתן का सामान्य अर्थ ‘रखना’ है, पर प्रवेश पर लटकते परदे को स्थापित करने के लिए ‘लगाना’ स्वाभाविक हिन्दी है।
- source_word: מָסַךְ
  choice: परदा
  rationale: מָסָךְ प्रवेश पर लगे लटकते आवरण को दर्शाता है। ‘परदा’ इसके पदार्थ या बनावट को अनावश्यक रूप से निर्धारित किए बिना हिन्दी में स्पष्ट है।
- source_word: שַׁעַר הֶחָצֵר
  choice: आँगन के फाटक पर
  rationale: सम्बन्ध-वाचक इब्रानी पदबंध का स्वाभाविक हिन्दी रूप है; ‘पर’ स्पष्ट करता है कि परदा फाटक/प्रवेश-स्थान पर लगाया जाना है।
