base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/005.yaml
  text: And you shall place the golden altar for incense before the ark of the testimony[b][a], and you shall set the screen for the entrance of the tabernacle.
translation:
  language: hi
  text: और धूप के लिए सोने की वेदी को साक्ष्य के संदूक[a] के सामने रखना, और निवास-स्थान के प्रवेश-द्वार के लिए परदा लगाना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: परंपरागत रूप से प्रायः “वाचा का संदूक”; इब्रानी में “साक्ष्य का संदूक” है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: रखना
  rationale: निर्देशों की इस शृंखला में נתן का अर्थ किसी वस्तु को नियत स्थान पर रखना है; हिंदी में आज्ञार्थक अनंत रूप स्वाभाविक है।
- source_word: מִזְבַּח הַזָּהָב לִקְטֹרֶת
  choice: धूप के लिए सोने की वेदी
  rationale: यह रचना वेदी की सामग्री और उसके प्रयोजन—धूप—दोनों को स्पष्ट रखती है और לִ का प्रयोजनार्थक भाव बचाती है।
- source_word: אֲרוֹן הָעֵדֻת
  choice: साक्षी-पत्र का संदूक
  rationale: עֵדֻת को सामान्य परंतु संदर्भ-संगत 'साक्षी-पत्र' से व्यक्त किया गया है; 'वाचा का संदूक' अधिक परिचित है, पर इस पद के ठीक इब्रानी शब्द को नहीं दर्शाता।
- source_word: מָסַךְ הַפֶּתַח
  choice: प्रवेश-द्वार पर परदा
  rationale: מָסַךְ यहाँ प्रवेश पर लगाया जाने वाला लटकता परदा है। हिंदी में 'प्रवेश-द्वार पर परदा' स्थान और कार्य दोनों को सहज रूप से बताता है।
- source_word: לַמִּשְׁכָּן
  choice: पवित्र निवास
  rationale: מִשְׁכָּן का मूल भाव निवास-स्थान है; इस उपासना-संदर्भ में 'पवित्र निवास' अर्थ को स्पष्ट रखते हुए साधारण पाठक के लिए बोधगम्य है।
theological_decisions:
- issue: עֵדֻת वाले संदूक की उपाधि
  choice: साक्षी-पत्र का संदूक
  alternative: वाचा का संदूक
  rationale: मूल पाठ में עֵדֻת अर्थात 'साक्षी/साक्षी-पत्र' है, בְּרִית अर्थात 'वाचा' नहीं। इसलिए अधिक परिचित पारंपरिक उपाधि को मुख्य पाठ में न रखकर मूल शब्दावली सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और निर्देशात्मक हिंदी। समन्वित आज्ञाओं के लिए 'रखना/लगाना' रूप अपनाया गया है। 'साक्षी-पत्र' मूल शब्द की विशिष्टता बचाता है, जबकि फुटनोट परिचित पारंपरिक नाम देता है।
