source:
  edition: WLC
  text: וַ/יִּפְרֹ֤שׂ אֶת הָ/אֹ֨הֶל֙ עַל הַ/מִּשְׁכָּ֔ן וַ/יָּ֜שֶׂם אֶת מִכְסֵ֥ה הָ/אֹ֛הֶל עָלָ֖י/ו מִ/לְ/מָ֑עְלָ/ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/019.yaml
  text: Then he spread the tent over the tabernacle and put the covering of the tent over it from above, just as Yahweh had commanded Moses.
translation:
  language: hi
  text: फिर उसने निवास-स्थान के ऊपर तंबू फैलाया और उस पर तंबू का आवरण ऊपर से लगाया, ठीक वैसे ही जैसे याहवे ने मूसा को आज्ञा दी थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפְרֹשׂ
  choice: फैलाया
  rationale: פרשׂ का मूल भाव किसी वस्तु को फैलाने या तानने का है। यहाँ तम्बू की परत को निवास-स्थान के ऊपर फैलाने की क्रिया व्यक्त होती है।
- source_word: הָאֹהֶל
  choice: तम्बू
  rationale: אֹהֶל का सामान्य अर्थ ‘तम्बू’ है। यह अनुवाद आगे आने वाले מִכְסֶה (‘आवरण’) से इसके भेद को बनाए रखता है।
- source_word: הַמִּשְׁכָּן
  choice: निवास-स्थान
  rationale: מִשְׁכָּן का अर्थ ‘निवास’ या ‘निवास-स्थान’ है और निर्गमन में यह परमेश्वर के पवित्र निवास को दर्शाता है। ‘निवास-स्थान’ आधुनिक हिन्दी में अर्थ स्पष्ट रखते हुए पारंपरिक ‘मिलापवाला तम्बू’ से होने वाले संभावित भ्रम से बचता है।
- source_word: וַיָּשֶׂם
  choice: लगाया
  rationale: שׂים का अर्थ रखना, लगाना या स्थापित करना है। किसी बाहरी आवरण को संरचना पर रखने के लिए ‘लगाया’ स्वाभाविक हिन्दी है।
- source_word: מִכְסֵה הָאֹהֶל
  choice: तम्बू का आवरण
  rationale: מִכְסֶה का अर्थ ‘आवरण’ है। यह पदबंध तम्बू और उसके ऊपर लगाए गए अलग बाहरी आवरण के बीच स्रोत-पाठ का भेद सुरक्षित रखता है।
- source_word: עָלָיו מִלְמָעְלָה
  choice: उसके ऊपर, सबसे ऊपर
  rationale: עָלָיו और מִלְמָעְלָה दोनों ऊपरी स्थान पर बल देते हैं। ‘उसके ऊपर, सबसे ऊपर’ हिन्दी में अनावश्यक अस्वाभाविक पुनरुक्ति से बचते हुए बाहरी आवरण की सबसे ऊपरी स्थिति स्पष्ट करता है।
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: ठीक वैसे ही जैसे याहवे ने मूसा को आज्ञा दी थी
  rationale: ‘ठीक वैसे ही’ כַּאֲשֶׁר में निहित निर्देश और कार्य के अनुरूप संबंध को व्यक्त करता है; ‘दी थी’ पहले दी गई आज्ञा को स्वाभाविक हिन्दी काल-क्रम में रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: यह चार अक्षरों वाला इब्रानी व्यक्तिगत दिव्य नाम YHWH है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: स्रोत-पाठ में व्यक्तिगत दिव्य नाम יְהוָה है। ‘याहवे’ नाम को नाम के रूप में सुरक्षित रखता है; ‘प्रभु’ उसे उपाधि से बदल देता, जबकि ‘यहोवा’ बाद की मिश्रित उच्चारण-परंपरा को दर्शाता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘निवास-स्थान’, ‘तम्बू’ और ‘आवरण’ द्वारा पद में उपस्थित तीन स्थापत्य शब्दों का भेद बनाए रखा गया है।
