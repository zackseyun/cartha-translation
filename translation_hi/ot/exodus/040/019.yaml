- from: फिर उसने निवास-स्थान के ऊपर तम्बू फैलाया और उसके ऊपर, सबसे ऊपर, तम्बू का आवरण लगाया, ठीक वैसे ही जैसे याहवे ने मूसा को आज्ञा दी थी।
  to: फिर उसने निवास-स्थान के ऊपर तंबू फैलाया और उस पर तंबू का आवरण ऊपर से लगाया, ठीक वैसे ही जैसे याहवे ने मूसा को आज्ञा दी थी।
  rationale: The revision only replaces the unnatural and slightly over-interpreting expression “उसके ऊपर, सबसे ऊपर” with “उस पर ... ऊपर से.” This preserves the Hebrew’s two successive actions and its indication that the covering was placed from above, without altering the established terminology or the verse’s meaning.
