  text: וְ/הִלְבַּשְׁתָּ֙ אֶֽת אַהֲרֹ֔ן אֵ֖ת בִּגְדֵ֣י הַ/קֹּ֑דֶשׁ וּ/מָשַׁחְתָּ֥ אֹת֛/וֹ וְ/קִדַּשְׁתָּ֥ אֹת֖/וֹ וְ/כִהֵ֥ן לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/013.yaml
  text: And you shall clothe Aaron with the holy garments[a], and you shall anoint him and consecrate him, and he shall serve as priest to me.
translation:
  language: hi
  text: और तुम हारून को पवित्र वस्त्र पहनाओ, उसका अभिषेक करो और उसे पवित्र ठहराओ, और वह मेरे लिए याजक के रूप में सेवा करे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और वह मेरे लिए याजक का कार्य करे।” इब्रानी क्रिया का अर्थ याजक के पद पर कार्य करना या सेवा करना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִלְבַּשְׁתָּ
  choice: तुम ... पहनाना
  rationale: 'לבשׁ का हिफ़ील रूप यहाँ करणवाचक है: मूसा को हारून के शरीर पर वस्त्र पहनाने हैं। हिंदी में ‘पहनाना’ स्वाभाविक और सटीक है।'
- source_word: אַהֲרֹן
  choice: हारून
  rationale: हिंदी बाइबलीय परंपरा में प्रचलित नाम-रूप।
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  choice: पवित्र वस्त्र
  rationale: शाब्दिक अर्थ ‘पवित्रता के वस्त्र’ है; ‘पवित्र वस्त्र’ सहज हिंदी में इसके उपासना-संबंधी भाव को सुरक्षित रखता है।
- source_word: וּמָשַׁחְתָּ
  choice: उसका अभिषेक करना
  rationale: משׁח के याजकीय प्रतिष्ठापन-संदर्भ का मानक हिंदी रूप ‘अभिषेक करना’ है।
- source_word: וְקִדַּשְׁתָּ
  choice: उसे पवित्र ठहराना
  rationale: पिएल रूप यहाँ पवित्र सेवा के लिए अलग किए जाने का भाव देता है। यह ‘अभिषेक’ से भिन्न संबंधित क्रिया को बनाए रखता है और ‘संस्कार/दीक्षा’ जैसे बाद के संस्थागत अर्थों से बचता है।
- source_word: וְכִהֵן
  choice: वह ... याजक का काम करे
  rationale: כהן का अर्थ याजक के पद में कार्य या सेवा करना है। आज्ञार्थक अनुक्रम के बाद तीसरे पुरुष का यह रूप अपेक्षित परिणाम अथवा सेवा को व्यक्त करता है; हिंदी में ‘करे’ मूल की संभावित प्रयोजन/परिणाम छाया को बिना अत्यधिक स्पष्ट किए बनाए रखता है।
- source_word: לִי
  choice: मेरे लिए
  rationale: לִי यहोवा के लिए की जाने वाली सेवा को दर्शाता है। स्वाभाविक हिंदी में ‘मेरे लिए’ इस संबंध को स्पष्ट करता है।
theological_decisions:
- issue: याजकीय प्रतिष्ठापन की क्रियाओं का अनुवाद
  choice: वस्त्र पहनाने, अभिषेक करने और पवित्र ठहराने को अलग-अलग क्रियाओं के रूप में रखा गया।
  alternative: पूरे क्रम को ‘याजक नियुक्त करना’ जैसी एक क्रिया में समेटना।
  rationale: इब्रानी पाठ क्रमिक अनुष्ठानिक क्रियाएँ प्रस्तुत करता है। उन्हें अलग रखने से पाठ की विशिष्टता बनी रहती है और बाद की कलीसियाई श्रेणियाँ आरोपित नहीं होतीं।
- issue: וְכִהֵן לִי का बल
  choice: ‘और वह मेरे लिए याजक का काम करे’
  alternative: ‘ताकि वह मेरे लिए याजक का काम करे’ अथवा ‘और वह मेरे लिए याजक का काम करेगा।’
  rationale: וְכִהֵן को आदेशों के परिणाम या उद्देश्य के रूप में समझा जा सकता है, किंतु संयोजक וְ स्पष्टतः केवल प्रयोजनवाचक नहीं है। ‘और ... करे’ समन्वय को बचाता है तथा प्रयोजन और अपेक्षित परिणाम के बीच की वास्तविक अस्पष्टता को पूरी तरह समाप्त नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी; गरिमापूर्ण किंतु सामान्य पाठकों के लिए सहज। ‘पवित्र वस्त्र’, ‘अभिषेक’ और ‘याजक’ जैसे स्थापित बाइबलीय पद रखे गए हैं। वाक्य में निर्देशात्मक शैली के लिए ‘पहनाना/करना/ठहराना’ और अंतिम खंड में ‘करे’ प्रयुक्त है।
