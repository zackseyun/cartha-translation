source:
  edition: WLC
  text: וַ/יְכַ֥ס הֶ/עָנָ֖ן אֶת אֹ֣הֶל מוֹעֵ֑ד וּ/כְב֣וֹד יְהוָ֔ה מָלֵ֖א אֶת הַ/מִּשְׁכָּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/034.yaml
  text: Then the cloud covered the tent of meeting[a], and the glory of Yahweh filled the tabernacle.
translation:
  language: hi
  text: तब बादल ने मिलाप के तंबू को ढक लिया, और याहवे[a] की महिमा ने निवासस्थान को भर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ईश्वरीय नाम יהוה (YHWH) है।
    reason: मूल पाठ में आए व्यक्तिगत ईश्वरीय नाम के इब्रानी रूप को स्पष्ट करना।
lexical_decisions:
- source_word: וַיְכַס
  choice: तब ... ढक लिया
  rationale: כסה का सामान्य अर्थ ‘ढकना’ है; आरंभिक וַ कथा को आगे बढ़ाता है, जिसे स्वाभाविक हिन्दी में ‘तब’ से व्यक्त किया गया है।
- source_word: הֶעָנָן
  choice: बादल
  rationale: सप्रत्यय संज्ञा उस विशिष्ट बादल की ओर संकेत करती है जिसका निर्गमन-वृत्तांत में पहले से उल्लेख है; हिन्दी में प्रसंग के कारण ‘बादल’ पर्याप्त रूप से निश्चित है।
- source_word: אֹהֶל מוֹעֵד
  choice: मिलापवाला तंबू
  rationale: यह प्रचलित, सहज और धार्मिक संदर्भ में समझ आने वाला हिन्दी पद है, जो नियुक्त भेंट/मिलन-स्थान की धारणा बनाए रखता है।
- source_word: כְבוֹד יְהוָה
  choice: यहोवा की महिमा
  rationale: כָּבוֹד यहाँ परमेश्वर की प्रकट महिमा और प्रभावशाली उपस्थिति को दर्शाता है; संबंधकारक रचना हिन्दी में स्वाभाविक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल में प्रयुक्त चार-अक्षरीय ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नामरूप ‘यहोवा’ द्वारा प्रस्तुत किया गया है।
- source_word: מָלֵא
  choice: भर दिया
  rationale: यहाँ क्रिया का कर्ता ‘यहोवा की महिमा’ और कर्म ‘पवित्र निवास’ है; ‘भर दिया’ इस सकर्मक रचना को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַמִּשְׁכָּן
  choice: पवित्र निवास
  rationale: מִשְׁכָּן का मूल भाव ‘निवास-स्थान’ है और निर्गमन में यह विशेष पवित्र संरचना का तकनीकी नाम है; ‘पवित्र निवास’ उस भाव और विशिष्ट धार्मिक संदर्भ दोनों को संप्रेषित करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम सीधे उपस्थित है। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाता है और नाम को उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं करता; ‘याहवे’ को पादटिप्पणी में वैकल्पिक लिप्यंतरण के रूप में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण धार्मिक शैली। ‘तंबू’ सामान्य पाठक के लिए सहज है; ‘पवित्र निवास’ מִשְׁכָּן के निवास-संबंधी मूल भाव और उसकी विशिष्ट पवित्र भूमिका दोनों को दर्शाता है।
