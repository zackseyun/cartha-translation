base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/022.yaml
  text: He put the table in the tent of meeting[a], on the north side of the tabernacle, outside the veil.
translation:
  language: hi
  text: उसने मेज़ को मिलापवाले तंबू में, निवास-स्थान के उत्तरी पार्श्व पर, भीतरी परदे के बाहर[a] रखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द פָּרֹכֶת उस भीतरी विभाजक परदे को दर्शाता है जो परमपवित्र स्थान को ओट में रखता था।
    reason: lexical_clarification
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: उसने ... रखा
  rationale: נתן का मूल अर्थ ‘देना/रखना’ हो सकता है; वस्तुओं की स्थान-व्यवस्था के इस प्रसंग में ‘रखा’ स्वाभाविक और सटीक है।
- source_word: הַשֻּׁלְחָן
  choice: मेज़
  rationale: मूल पाठ में केवल निश्चित रूप ‘मेज़’ है; ‘भेंट की रोटियों की मेज़’ जैसी अतिरिक्त पहचान इस पद में जोड़ना उचित नहीं।
- source_word: בְּאֹהֶל מוֹעֵד
  choice: मिलापवाले तंबू में
  rationale: यह पवित्र तंबू के लिए प्रचलित, स्पष्ट और सामान्य हिन्दी पद है।
- source_word: עַל יֶרֶךְ הַמִּשְׁכָּן צָפֹנָה
  choice: निवास-स्थान की उत्तर दिशा में
  rationale: יֶרֶךְ यहाँ किसी संरचना के पार्श्व या ओर को दर्शाता है और צָפֹנָה उत्तर की स्थिति बताता है; हिन्दी में यह रूप स्थान-संबंध को सहजता से व्यक्त करता है।
- source_word: הַמִּשְׁכָּן
  choice: निवास-स्थान
  rationale: מִשְׁכָּן का अर्थ ‘निवास’ है और निर्गमन के स्थापत्य-संदर्भ में यह उस पवित्र संरचना का तकनीकी नाम है; ‘निवास-स्थान’ अर्थ और विशिष्ट संदर्भ दोनों बनाए रखता है।
- source_word: מִחוּץ לַפָּרֹכֶת
  choice: भीतरी परदे के बाहर
  rationale: מִחוּץ स्थान की दृष्टि से ‘बाहर’ है और פָּרֹכֶת उस आंतरिक विभाजक परदे को दर्शाता है जो परमपवित्र स्थान की ओट करता था। ‘भीतरी’ संदर्भ स्पष्ट करता है, बिना किसी अतिरिक्त धार्मिक निष्कर्ष के।
