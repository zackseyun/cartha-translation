  yaml_path: translation/ot/exodus/040/004.yaml
  text: Then you shall bring in the table and arrange what belongs on it[a], and you shall bring in the lampstand and set up its lamps.
translation:
  language: hi
  text: फिर मेज़ को भीतर लाकर उस पर रखी जानेवाली वस्तुओं को क्रम से सजा देना। दीपाधार को भी भीतर लाकर उसके दीपक स्थापित करना।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके दीपक जला देना।” इब्रानी क्रिया का शाब्दिक अर्थ “ऊपर चढ़ाना” है; दीपकों के संदर्भ में इसका अर्थ उन्हें स्थापित करना या उनकी लौ ऊपर उठाना, अर्थात उन्हें जलाना, हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבֵאתָ
  choice: भीतर लाकर
  rationale: בוא के हिफ़ील रूप से यहाँ वस्तुओं को मिलापवाले तंबू के भीतर ले आने का भाव है; ‘भीतर लाकर’ इस निहित दिशा को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: הַשֻּׁלְחָן
  choice: मेज़
  rationale: मूल संज्ञा केवल मेज़ को बताती है; इस पद में उसकी विस्तृत धार्मिक पहचान जोड़ना आवश्यक नहीं है।
- source_word: וְעָרַכְתָּ אֶת־עֶרְכּוֹ
  choice: उस पर रखी जानेवाली वस्तुओं को क्रम से सजा देना
  rationale: क्रिया और उसी मूल से बनी संज्ञा का शाब्दिक दोहराव हिन्दी में अस्वाभाविक होगा। यह अनुवाद मेज़ पर निर्धारित वस्तुओं को उचित क्रम में रखने का भाव व्यक्त करता है।
- source_word: הַמְּנֹרָה
  choice: दीपाधार
  rationale: यह सामान्य संज्ञा दीपकों को थामनेवाले आधार के लिए है। ‘दीपाधार’ अर्थ को सीधे व्यक्त करता है और आधुनिक धार्मिक हिन्दी में गरिमापूर्ण तथा बोधगम्य है।
- source_word: וְהַעֲלֵיתָ
  choice: जला देना
  rationale: עלה के हिफ़ील रूप का दीपकों के साथ प्रयोग लौ को ऊपर उठाने, अर्थात दीपक जलाने, के अर्थ में हो सकता है। निर्गमन 40 के निकटवर्ती क्रियान्वयन-संदर्भ में भी दीपक जलाने का अर्थ प्रबल है, यद्यपि दीपकों को चढ़ाने या स्थापित करने की संभावना टिप्पणी में सुरक्षित रखी गई है।
- source_word: נֵרֹתֶיהָ
  choice: उसके दीपक
  rationale: נֵר तेल के दीपक अथवा उसकी लौ को सूचित कर सकता है; यहाँ बहुवचन में दीपाधार के अलग-अलग दीपक अभिप्रेत हैं।
