  yaml_path: translation/ot/exodus/040/024.yaml
  text: He placed the lampstand in the tent of meeting[a], opposite the table, on the south side of the tabernacle.
translation:
  language: hi
  text: उसने मिलाप के तंबू में दीपाधार को मेज़ के सामने[a], निवासस्थान के दक्षिणी भाग में रखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेज़ के आमने-सामने।” इब्रानी शब्द נֹכַח किसी वस्तु के सामने अथवा उसके आमने-सामने की स्थिति बता सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: उसने ... रखा
  rationale: שׂים का यह कथात्मक रूप पूर्ण हुई भूतकालीन क्रिया बताता है। हिंदी में वस्तु की सुविचारित स्थापना के लिए ‘रखा’ स्वाभाविक है।
- source_word: הַמְּנֹרָה
  choice: दीपाधार
  rationale: מְנוֹרָה साधारण दीपक नहीं, दीपों को धारण करने वाला पवित्र उपकरण है; ‘दीपाधार’ उसका कार्य स्पष्ट करता है।
- source_word: בְּאֹהֶל מוֹעֵד
  choice: मिलापवाले तंबू में
  rationale: यह उस पवित्र तंबू का प्रचलित और सुबोध हिंदी नाम है जहाँ परमेश्वर और मनुष्य के मिलन का भाव निहित है।
- source_word: נֹכַח הַשֻּׁלְחָן
  choice: मेज़ के सामने
  rationale: נֹכַח स्थान की दृष्टि से ‘सामने’ अथवा ‘आमने-सामने’ होने को व्यक्त कर सकता है। ‘मेज़ के सामने’ हिंदी में सहज है और मूल की स्थानगत व्यापकता बनाए रखता है।
- source_word: הַשֻּׁלְחָן
  choice: मेज़
  rationale: मूल पाठ केवल ‘मेज़’ कहता है; इसलिए प्रसंग से ज्ञात भेंट की रोटी का विवरण पाठ में नहीं जोड़ा गया।
- source_word: עַל יֶרֶךְ הַמִּשְׁכָּן
  choice: पवित्र निवास की ... ओर
  rationale: יֶרֶךְ यहाँ किसी संरचना के पार्श्व या ओर को बताता है; इसके बाद का दिशासूचक शब्द दक्षिण दिशा निश्चित करता है।
- source_word: נֶגְבָּה
  choice: दक्षिणी
  rationale: दिशासूचक रूप दक्षिण की ओर स्थित होने का संकेत देता है; ‘दक्षिणी ओर’ स्वाभाविक हिंदी स्थान-वर्णन है।
- source_word: הַמִּשְׁכָּן
  choice: पवित्र निवास
  rationale: מִשְׁכָּן का मूल भाव ‘निवास’ है और निर्गमन में यह पवित्र निवास-तंबू को निर्दिष्ट करता है; यह अनुवाद अर्थ को सामान्य पाठक के लिए पारदर्शी रखता है।
