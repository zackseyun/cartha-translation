  yaml_path: translation/ot/exodus/040/012.yaml
  text: Then bring Aaron and his sons near to the entrance of the tent of meeting, and wash them with water.
translation:
  language: hi
  text: फिर हारून और उसके पुत्रों को मिलापवाले तंबू के प्रवेश-द्वार के पास ले आना और उन्हें पानी से धोना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִקְרַבְתָּ
  choice: पास ले आना
  rationale: हिफ़ील रूप का कारणवाचक अर्थ ‘निकट ले आना’ है। ‘पास ले आना’ इस अर्थ और अनुष्ठानिक संदर्भ दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אַהֲרֹן
  choice: हारून
  rationale: व्यक्तिनाम का प्रचलित मानक हिन्दी बाइबलीय लिप्यंतरण।
- source_word: בָּנָיו
  choice: उसके पुत्रों
  rationale: इब्रानी शब्द यहाँ पुरुष संतानों को सूचित करता है और याजकीय संदर्भ में ‘पुत्रों’ सटीक है।
- source_word: פֶּתַח
  choice: प्रवेश-द्वार
  rationale: यह तंबू में प्रवेश करने के स्थान को स्पष्ट और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אֹהֶל מוֹעֵד
  choice: मिलापवाला तंबू
  rationale: यह पवित्र मिलन-स्थान के लिए हिन्दी बाइबल परंपरा में परिचित अभिव्यक्ति है और मूल पदबंध के आशय को बनाए रखती है।
- source_word: וְרָחַצְתָּ
  choice: धोना
  rationale: רחץ का सामान्य अर्थ ‘धोना’ है। यह क्रिया की विधि को मूल पाठ से अधिक विशिष्ट किए बिना अनुष्ठानिक धुलाई व्यक्त करता है।
- source_word: אֹתָם
  choice: उन्हें
  rationale: यह सर्वनाम हारून और उसके पुत्रों, दोनों को एक साथ संदर्भित करता है।
- source_word: בַּמָּיִם
  choice: पानी से
  rationale: यहाँ ב साधनवाचक है; ‘पानी से’ हिन्दी में धुलाई के माध्यम को स्वाभाविक रूप से व्यक्त करता है।
