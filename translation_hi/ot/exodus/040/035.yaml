  yaml_path: translation/ot/exodus/040/035.yaml
  text: And Moses was not able to enter the tent of meeting[a], because the cloud settled on it, and the glory of Yahweh filled the tabernacle.
translation:
  language: hi
  text: और मूसा मिलाप के तंबू में प्रवेश नहीं कर सका, क्योंकि बादल उस पर ठहर गया[a], और याहवे की महिमा ने निवास-स्थान को भर दिया।
  philosophy: optimal-equivalence
  footnotes:
