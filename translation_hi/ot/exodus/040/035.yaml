    text: या “उस पर टिक गया” अथवा “उस पर निवास किया।” इब्रानी क्रिया में ठहरने और निवास करने—दोनों की अर्थ-छाया हो सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא יָכֹל
  choice: और ... नहीं कर सका
  rationale: कथा के क्रम को सरलता से आगे बढ़ाते हुए क्रिया की असमर्थता को स्वाभाविक आधुनिक हिंदी में व्यक्त करता है।
- source_word: לָבוֹא
  choice: प्रवेश करना
  rationale: किसी संरचना के भीतर जाने के अर्थ को स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: אֹהֶל מוֹעֵד
  choice: मिलाप का तंबू
  rationale: इस्राएल के निर्धारित उपासना-स्थान के प्रचलित नाम को सहज आधुनिक हिंदी में रखता है; ‘मिलाप’ यहाँ ठहराए गए साक्षात्कार/भेंट के भाव को व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: मूसा के प्रवेश न कर सकने का कारण स्पष्ट रूप से प्रस्तुत करता है।
- source_word: שָׁכַן
  choice: ठहर गया था
  rationale: बादल के तंबू पर आकर टिकने का ठोस दृश्य व्यक्त करता है, साथ ही मूल क्रिया में निहित ठहरने या निवास करने की अर्थ-छाया को पादटिप्पणी के लिए खुला रखता है।
- source_word: עָלָיו
  choice: उस पर
  rationale: बादल और तंबू के स्थानिक संबंध को सीधा और स्वाभाविक रूप से व्यक्त करता है।
- source_word: הֶעָנָן
  choice: बादल
  rationale: निश्चित लेख का अर्थ प्रसंग में पहले से पहचाने गए दिव्य बादल से स्पष्ट है; हिंदी में अलग निश्चित लेख आवश्यक नहीं है।
- source_word: כְבוֹד יְהוָה
  choice: याहवे की महिमा
  rationale: सम्बन्धसूचक इब्रानी रचना और כָּבוֹד के धर्मवैचारिक भार को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम का देवनागरी लिप्यंतरण करता है, उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- source_word: מָלֵא
  choice: भर दिया था
  rationale: सकर्मक इब्रानी क्रिया—जिसका कर्ता ‘महिमा’ और कर्म ‘निवास-स्थान’ है—को हिंदी में स्पष्ट रखता है; पूर्ण भूतकाल कारणात्मक प्रसंग में स्वाभाविक है।
- source_word: הַמִּשְׁכָּן
  choice: निवास-स्थान
  rationale: निर्गमन में इस पोर्टेबल पवित्र संरचना के तकनीकी नाम को उसके ‘निवास’ संबंधी मूल अर्थ सहित व्यक्त करता है और אֹהֶל מוֹעֵד से शब्दगत भेद बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसका व्यापक रूप से स्वीकृत शैक्षिक लिप्यंतरण है और नाम को उपाधि में नहीं बदलता।
- issue: שָׁכַן में ठहरने और निवास करने की अर्थ-छाया
  choice: ठहर गया था
  alternative: निवास किया था; टिक गया था
  rationale: तात्कालिक दृश्य बादल के तंबू पर आकर ठहरने का है। मुख्य पाठ में इसी ठोस अर्थ को रखा गया है, जबकि ‘निवास’ की वास्तविक अर्थ-छाया पादटिप्पणी में सुरक्षित है।
- issue: מִשְׁכָּן के लिए तकनीकी पद
  choice: निवास-स्थान
  alternative: तंबू; पवित्र तंबू; तंबू-निवास
  rationale: यह शब्द उस पोर्टेबल पवित्र संरचना का नाम है और उसकी जड़ में ‘निवास’ का भाव है। ‘निवास-स्थान’ उस भाव को बचाता है, बिना पद में ऐसा विशेषण जोड़ने के जो यहाँ मूल में नहीं है।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘मिलाप का तंबू’ और ‘निवास-स्थान’ के द्वारा मूल के दो अलग इब्रानी पदों का भेद बनाए रखा गया है। पादटिप्पणी का चिह्न उसी क्रिया के बाद रखा गया है जिससे वह संबंधित है।
