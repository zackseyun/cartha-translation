  text: You shall anoint the altar of burnt offering and all its utensils[a], and you shall consecrate the altar, and the altar shall be most holy.
translation:
  language: hi
  text: तुम होम-बलि की वेदी और उसके सभी उपकरणों का अभिषेक करो; वेदी को पवित्र करो, और वह वेदी परमपवित्र[a] होगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “पवित्रों में पवित्र”; यह इब्रानी में सर्वोच्च पवित्रता व्यक्त करने वाली उक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָשַׁחְתָּ
  choice: अभिषेक करना
  rationale: पवित्र उपासना के संदर्भ में משׁח तेल लगाकर किसी वस्तु को पवित्र सेवा के लिए नियुक्त करने को दर्शाता है; हिंदी में ‘अभिषेक करना’ इसका प्रचलित और सटीक धार्मिक पर्याय है।
- source_word: מִזְבַּח הָעֹלָה
  choice: होम-बलि की वेदी
  rationale: यह संबंधसूचक पद उस वेदी को निर्दिष्ट करता है जिस पर होम-बलि चढ़ाई जाती थी; ‘होम-बलि की वेदी’ अर्थ को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: כָּל כֵּלָיו
  choice: उसके सभी उपकरणों
  rationale: כֵּלִים वेदी से जुड़े पात्रों और अन्य साधनों के लिए व्यापक शब्द है; ‘उपकरण’ किसी एक प्रकार की वस्तु तक अर्थ को सीमित नहीं करता।
- source_word: וְקִדַּשְׁתָּ
  choice: पवित्र करना
  rationale: קדשׁ यहाँ वेदी को पवित्र उपयोग के लिए अलग ठहराने का बोध देता है। ‘पवित्र करना’ आम पाठक के लिए स्पष्ट रहते हुए अनुष्ठानिक अर्थ बनाए रखता है।
- source_word: וְהָיָה
  choice: होगी
  rationale: क्रिया अभिषेक और पवित्रीकरण के फलस्वरूप वेदी की होने वाली अवस्था बताती है; हिंदी भविष्यकाल निर्देश के क्रम और परिणामी स्थिति दोनों को सहज रूप से व्यक्त करता है।
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: परमपवित्र
  rationale: इब्रानी की यह रचना पवित्रता की सर्वोच्च मात्रा व्यक्त करती है। ‘परमपवित्र’ संक्षिप्त, स्वाभाविक और स्थान-सूचक अनावश्यक अर्थ से मुक्त है।
theological_decisions:
- issue: कֹדֶשׁ קָדָשִׁים की पवित्रता-सूचक अभिव्यक्ति
  choice: परमपवित्र
  alternative: पवित्रों में पवित्र
  rationale: यह पद यहाँ पवित्रता की सर्वोच्च मात्रा बताता है, अनिवार्य रूप से तंबू के भीतरी ‘परमपवित्र स्थान’ को नहीं। मुख्य पाठ में ‘परमपवित्र’ अर्थ स्पष्ट करता है, जबकि पादटिप्पणी इब्रानी अभिव्यक्ति का रूप सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल किंतु गरिमापूर्ण शैली रखी गई है। मूसा को संबोधित एकवचन निर्देशों के लिए ‘तुम’ का प्रयोग किया गया है। दोनों आदेशों को अलग वाक्यों में रखकर हिंदी में क्रम स्पष्ट किया गया है। पादटिप्पणी का चिह्न ‘परमपवित्र’ के बाद रखा गया है, क्योंकि वही उसका वास्तविक संदर्भ है।
