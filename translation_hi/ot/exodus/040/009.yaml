base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/009.yaml
  text: Then you shall take the anointing oil and anoint the tabernacle and all that is in it[a], and you shall consecrate it and all its furnishings[b], and it shall be holy.
translation:
  language: hi
  text: फिर अभिषेक का तेल[क] लो और निवासस्थान और उसमें जो कुछ है, उस सबका अभिषेक करो। उसे और उसकी सारी वस्तुओं को पवित्र ठहराओ; तब वह पवित्र होगा[ख]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: या, अधिक शाब्दिक रूप से, “अभिषेक का तेल।”
    reason: lexical_alternative
  - marker: ख
    text: इब्रानी में “पवित्र” है, “परमपवित्र” नहीं।
    reason: alternative_reading
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: फिर ... लेकर
  rationale: संयोजक सहित पूर्ण क्रिया यहाँ निर्देशों की क्रमिक शृंखला में आदेश का भाव देती है; ‘फिर’ क्रम को और ‘लेकर’ स्वाभाविक हिंदी वाक्य-विन्यास को व्यक्त करता है।
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: अभिषेक का तेल
  rationale: यह संबंध-वाचक पद पवित्र कार्य के लिए निर्धारित तेल को सूचित करता है; आधुनिक हिंदी में यह स्वाभाविक और स्पष्ट है।
- source_word: וּמָשַׁחְתָּ
  choice: अभिषेक करना
  rationale: משׁח का अर्थ इस उपासना-संबंधी प्रसंग में तेल लगाकर पवित्र सेवा के लिए नियुक्त करना है।
- source_word: הַמִּשְׁכָּן
  choice: पवित्र निवास
  rationale: מִשְׁכָּן मूलतः ‘निवास-स्थान’ है और यहाँ इस्राएल के चलायमान पवित्रस्थान को दर्शाता है; ‘पवित्र निवास’ अर्थ को सामान्य पाठक के लिए स्पष्ट रखता है।
- source_word: כָּל אֲשֶׁר בּוֹ
  choice: उसमें जो कुछ है, उस सब
  rationale: यह व्यापक अभिव्यक्ति पवित्र निवास के भीतर की सभी वस्तुओं को समेटती है।
- source_word: וְקִדַּשְׁתָּ אֹתוֹ
  choice: उसे ... पवित्र ठहराना
  rationale: קדשׁ के पिएल रूप का आशय पवित्र उपयोग के लिए अलग और समर्पित करना है; ‘पवित्र ठहराना’ इसे बिना अतिरिक्त धार्मिक शब्दावली के व्यक्त करता है।
- source_word: כָּל כֵּלָיו
  choice: उसकी सारी वस्तुओं
  rationale: כֵּלִים यहाँ पात्रों, उपकरणों और अन्य साज-सामान का व्यापक समूह है; ‘वस्तुओं’ से स्रोत की व्यापकता बनी रहती है।
- source_word: וְהָיָה קֹדֶשׁ
  choice: तब वह पवित्र होगा
  rationale: परिणाम-वाक्य अभिषेक और पवित्रीकरण के बाद उसके पवित्र होने की स्थिति बताता है; קֹדֶשׁ को बिना तीव्र किए ‘पवित्र’ अनूदित किया गया है।
theological_decisions:
- issue: अभिषेक और पवित्र ठहराए जाने के बाद पवित्र निवास की धार्मिक स्थिति
  choice: वह ‘पवित्र’ होगा
  alternative: वह ‘परमपवित्र’ होगा
  rationale: इब्रानी पाठ में केवल קֹדֶשׁ (‘पवित्र’) है, קֹדֶשׁ קָדָשִׁים (‘परमपवित्र’) नहीं; इसलिए निकटवर्ती पदों या परंपरा के आधार पर अर्थ को तीव्र नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और निर्देशात्मक रखी गई है। क्रमिक आदेशों को स्वाभाविक हिंदी में संयुक्त क्रियार्थक रचना से व्यक्त किया गया है। ‘पवित्र निवास’ सामान्य पाठक को अर्थ बताता है और अत्यधिक तकनीकी या संप्रदायगत शब्दावली से बचता है।
