  text: שִׁבְעַ֣ת יָמִ֗ים תְּכַפֵּר֙ עַל הַ/מִּזְבֵּ֔חַ וְ/קִדַּשְׁתָּ֖ אֹת֑/וֹ וְ/הָיָ֤ה הַ/מִּזְבֵּ֨חַ֙ קֹ֣דֶשׁ קָֽדָשִׁ֔ים כָּל הַ/נֹּגֵ֥עַ בַּ/מִּזְבֵּ֖חַ יִקְדָּֽשׁ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/037.yaml
  text: For seven days you shall make atonement for the altar and consecrate it[a], and the altar shall be most holy. Whatever touches the altar shall become holy.
translation:
  language: hi
  text: सात दिनों तक तुम वेदी के लिए प्रायश्चित करोगे और उसे पवित्र करोगे; और वेदी परमपवित्र होगी। जो कोई या जो कुछ वेदी को छुएगा, वह पवित्र हो जाएगा[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इसे इस प्रकार भी समझा जा सकता है: “जो कोई या जो कुछ वेदी को छुए, वह पवित्र हो।” इब्रानी कथन का अर्थ या तो यह हो सकता है कि वेदी के स्पर्श से पवित्रता मिलती है, या यह कि वेदी को छूने वाला पहले से पवित्र होना चाहिए।'
    reason: alternative_reading
lexical_decisions:
- source_word: תְּכַפֵּר עַל הַמִּזְבֵּחַ
  choice: वेदी के लिए प्रायश्चित करोगे
  rationale: याजकीय अनुष्ठान के संदर्भ में כפר शुद्धि/प्रायश्चित की विधि करने को व्यक्त करता है, और עַל उस वस्तु को चिह्नित करता है जिसके लिए यह विधि की जाती है।
- source_word: וְקִדַּשְׁתָּ אֹתוֹ
  choice: और उसे पवित्र ठहराओगे
  rationale: यह वेदी को पवित्र उपयोग के लिए अलग किए जाने को स्वाभाविक और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: परमपवित्र
  rationale: इब्रानी की तीव्रतम श्रेणी वाली रचना को संक्षिप्त और प्रचलित हिन्दी में व्यक्त करता है।
- source_word: כָּל הַנֹּגֵעַ
  choice: जो भी ... छुएगा
  rationale: यह व्यक्ति या वस्तु तक अर्थ को अनावश्यक रूप से सीमित किए बिना इब्रानी अभिव्यक्ति की व्यापकता बनाए रखता है।
- source_word: יִקְדָּשׁ
  choice: पवित्र हो जाएगा
  rationale: 'मुख्य पाठ में क्रिया के परिणामसूचक अर्थ को व्यक्त करता है: वेदी के संपर्क में आने वाला पवित्र अवस्था में आ जाता है।'
theological_decisions:
- issue: वेदी के स्पर्श से पवित्रता का संबंध
  choice: स्पर्श करने वाला पवित्र हो जाएगा
  alternative: केवल पवित्र व्यक्ति या वस्तु ही वेदी को छू सकती है; अथवा जो छुए उसे पवित्र होना चाहिए
  rationale: יִקְדָּשׁ का सीधा परिणामसूचक अर्थ मुख्य पाठ में स्वाभाविक है, पर अनुष्ठानिक संदर्भ में इसे पवित्रता की पूर्वशर्त के रूप में भी समझा गया है; इसलिए वैकल्पिक समझ को टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, अनुष्ठानिक संदर्भ के अनुरूप गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट रखी गई है। “परमपवित्र” स्थापित बाइबलीय शब्दावली है; “जो भी” मूल की व्यक्ति/वस्तु संबंधी व्यापकता को यथासंभव बनाए रखता है।
