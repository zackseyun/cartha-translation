  text: and unleavened bread[a], and unleavened cakes mixed with oil, and unleavened wafers spread with oil[b]; you shall make them of fine wheat flour.
translation:
  language: hi
  text: और अख़मीरी रोटी, तेल में गूँधी हुई अख़मीरी रोटियाँ[a], और तेल से चुपड़ी हुई अख़मीरी पतली रोटियाँ[b]; इन्हें गेहूँ के बारीक आटे से बनाना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अख़मीरी लोफ़-आकार की रोटियाँ”; इब्रानी शब्द रोटी के एक अलग, सम्भवतः गोल या लोफ़-जैसे, रूप को दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ “तेल से अभिषिक्त”; यहाँ यह पतली रोटियों पर तेल लगाने की विधि बताता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם מַצּוֹת
  choice: अख़मीरी रोटी
  rationale: यह पदबंध ऐसी रोटी को दर्शाता है जिसमें ख़मीर न हो। ‘अख़मीरी रोटी’ हिन्दी में संक्षिप्त, स्वाभाविक और अनुष्ठानिक अर्थ के अनुरूप है।
- source_word: חַלֹּת מַצֹּת
  choice: अख़मीरी रोटियाँ
  rationale: חַלָּה रोटी अथवा लोई से बनी मोटी, सम्भवतः गोल वस्तु को दर्शा सकता है। ‘रोटियाँ’ सामान्य לֶחֶם के बाद इस अलग प्रकार को सहज हिन्दी में व्यक्त करता है; आकार की सम्भावना पादटिप्पणी में रखी गई है।
- source_word: בְּלוּלֹת בַּשֶּׁמֶן
  choice: तेल में गूँधी हुई
  rationale: בלל का अर्थ मिलाना है; आटे से बनी वस्तुओं के संदर्भ में ‘तेल में गूँधी हुई’ तैयारी की विधि को स्वाभाविक हिन्दी में व्यक्त करता है, बिना यह निश्चित किए कि तेल केवल ऊपर लगाया गया था।
- source_word: רְקִיקֵי מַצּוֹת
  choice: अख़मीरी पपड़ियाँ
  rationale: רָקִיק पतली रोटी या चपटी पपड़ी जैसी वस्तु है। ‘पपड़ियाँ’ मोटी रोटियों से इसका भेद बनाए रखता है और आधुनिक हिन्दी में बोधगम्य है।
- source_word: מְשֻׁחִים בַּשָּׁמֶן
  choice: तेल से चुपड़ी हुई
  rationale: משׁח का सामान्य अर्थ अभिषेक करना है, पर यहाँ खाद्य-वस्तु की तैयारी में तेल लगाने या पोतने का भाव है। ‘चुपड़ी हुई’ इस संदर्भ में स्वाभाविक है; शाब्दिक संबंध पादटिप्पणी में सुरक्षित है।
- source_word: סֹלֶת חִטִּים
  choice: गेहूँ का मैदा
  rationale: סֹלֶת बारीक अथवा उत्तम आटे और חִטִּים गेहूँ को दर्शाता है। ‘गेहूँ का मैदा’ साधारण आधुनिक हिन्दी में बारीक गेहूँ के आटे का स्पष्ट समतुल्य है।
- source_word: תַּעֲשֶׂה אֹתָם
  choice: इन्हें … बनाना
  rationale: कानूनी-अनुदेशात्मक प्रसंग में अपूर्ण क्रिया आदेश का बल रखती है। हिन्दी का कृदन्तीय निर्देश ‘बनाना’ संक्षिप्त और स्वाभाविक रूप से वही अनिवार्यता व्यक्त करता है।
