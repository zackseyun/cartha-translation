base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/036.yaml
  text: And each day you shall offer a bull as a sin offering for atonement[a], and you shall purify the altar when you make atonement for it, and you shall anoint it to consecrate it.
translation:
  language: hi
  text: हर दिन प्रायश्चित के लिए एक बैल पापबलि[a] के रूप में चढ़ाओ। जब तुम वेदी के लिए प्रायश्चित करो, तब उसे शुद्ध करो, और उसे पवित्र करने के लिए उसका अभिषेक करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘शुद्धिकरण-बलि।’ इब्रानी शब्द חַטָּאת का अर्थ ‘पाप’ भी हो सकता है और बलि-संबंधी प्रसंगों में पाप या अशुद्धता से शुद्ध करने वाली बलि भी।
    reason: lexical_alternative
lexical_decisions:
- source_word: פַר
  choice: बछड़ा
  rationale: बलि-विधान के संदर्भ में פַר नर गोवंश को सूचित करता है; आधुनिक हिन्दी बाइबल-प्रयोग में ‘बछड़ा’ स्वाभाविक और सुबोध है, यद्यपि शब्द स्वयं आयु पर विशेष बल नहीं देता।
- source_word: חַטָּאת
  choice: पापबलि
  rationale: बलि-संदर्भ में यह अमूर्त ‘पाप’ नहीं, बल्कि पाप अथवा अशुद्धता के निवारण से जुड़ी बलि है। स्थापित हिन्दी पद ‘पापबलि’ मुख्य पाठ में संक्षिप्त और स्पष्ट है; ‘शुद्धिकरण-बलि’ का अर्थ-पक्ष पादटिप्पणी में रखा गया है।
- source_word: לַיּוֹם
  choice: प्रतिदिन
  rationale: दोहराए जाने वाले अनुष्ठान के संदर्भ में यह दैनिक वितरणात्मक अर्थ देता है।
- source_word: עַל הַכִּפֻּרִים
  choice: प्रायश्चित के लिए
  rationale: बहुवचन रूप यहाँ प्रायश्चित अथवा प्रायश्चित-विधियों को सूचित करता है; हिन्दी में अमूर्त एकवचन अधिक स्वाभाविक है।
- source_word: וְחִטֵּאתָ
  choice: शुद्ध करना
  rationale: חטא का पिएल रूप पवित्र वस्तु को अनुष्ठानिक रूप से शुद्ध करने का अर्थ देता है; इससे यह भ्रामक संकेत नहीं मिलता कि वेदी ने नैतिक पाप किया था।
- source_word: הַמִּזְבֵּחַ
  choice: वेदी
  rationale: मिलापवाले तम्बू और बलि-विधान के संदर्भ में מזבח का मानक हिन्दी अनुवाद।
- source_word: בְּכַפֶּרְךָ עָלָיו
  choice: वेदी के लिए प्रायश्चित करते समय
  rationale: בְּ के कालवाचक अर्थ को ‘करते समय’ से व्यक्त किया गया है। עָלָיו का संदर्भ वेदी से है; ‘के लिए’ हिन्दी में अनुष्ठानिक उद्देश्य को स्पष्ट रखता है।
- source_word: וּמָשַׁחְתָּ
  choice: अभिषेक करना
  rationale: משׁח पवित्र उपयोग के लिए तेल लगाने की विधि का मानक धार्मिक पद है।
- source_word: לְקַדְּשׁוֹ
  choice: उसे पवित्र ठहराने के लिए
  rationale: यह वेदी को पवित्र उपयोग के लिए अलग करने को व्यक्त करता है और सामान्य पाठक के लिए ‘प्रतिष्ठित’ अथवा ‘संस्कारित’ से अधिक स्पष्ट है।
theological_decisions:
- issue: बलि-संबंधी शुद्धि और प्रायश्चित की भाषा को बाद की धर्मसैद्धान्तिक श्रेणियों के बिना व्यक्त करना
  choice: ‘पापबलि’, ‘शुद्ध करना’ और ‘प्रायश्चित करना’ को तम्बू की अनुष्ठानिक विधि के अर्थ में रखा गया है।
  alternative: חַטָּאת के लिए ‘शुद्धिकरण-बलि’ और וְחִטֵּאתָ के लिए ‘पाप दूर करना’ कहा जा सकता था।
  rationale: पद वेदी के अनुष्ठानिक शुद्धीकरण और पवित्रीकरण की बात करता है, वेदी की नैतिक क्षमा की नहीं। मुख्य पाठ प्रचलित शब्दावली रखता है और वास्तविक अर्थ-विकल्प को पादटिप्पणी में सुरक्षित करता है।
- issue: בְּכַפֶּרְךָ עָלָיו में कालवाचक या साधनवाचक संबंध
  choice: ‘वेदी के लिए प्रायश्चित करते समय’
  alternative: ‘वेदी के लिए प्रायश्चित करके’
  rationale: इब्रानी בְּ दोनों अर्थों की अनुमति देता है। कालवाचक अनुवाद क्रियाओं के संबंध को स्वाभाविक ढंग से व्यक्त करता है, बिना साधनवाचक अर्थ को धर्मसैद्धान्तिक रूप से अनिवार्य बनाए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और अनुष्ठानिक शब्दावली रखी गई है। इब्रानी निर्देशात्मक शैली को हिन्दी में स्वाभाविक समानान्तर क्रियाओं—‘चढ़ाना’, ‘शुद्ध करना’, ‘अभिषेक करना’—से व्यक्त किया गया है।
