source:
  edition: WLC
  text: וְֽ/אִם יִוָּתֵ֞ר מִ/בְּשַׂ֧ר הַ/מִּלֻּאִ֛ים וּ/מִן הַ/לֶּ֖חֶם עַד הַ/בֹּ֑קֶר וְ/שָׂרַפְתָּ֤ אֶת הַ/נּוֹתָר֙ בָּ/אֵ֔שׁ לֹ֥א יֵאָכֵ֖ל כִּי קֹ֥דֶשׁ הֽוּא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/034.yaml
  text: And if any of the flesh of the ordination offering or any of the bread is left until the morning[a], then you shall burn what is left with fire. It shall not be eaten, because it is holy.
translation:
  language: hi
  text: यदि याजक-प्रतिष्ठा के बलिदान[a] के मांस या रोटी में से कुछ सुबह तक बच जाए, तो जो बचा हो उसे आग में जला देना। उसे खाया न जाए, क्योंकि वह पवित्र है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसे “प्रतिष्ठा का बलिदान” या “याजक-स्थापना का बलिदान” भी कहा जा सकता है। इब्रानी शब्द याजकों को उनके पद पर स्थापित करने के संस्कार को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יִוָּתֵר / הַנּוֹתָר
  choice: बच जाए / जो बचा हो
  rationale: दोनों रूप एक ही धातु יתר से हैं और किसी वस्तु के शेष रह जाने का भाव देते हैं। हिंदी में ये प्रयोग स्वाभाविक हैं और पहले निष्क्रिय भाव तथा बाद में शेष वस्तु के संदर्भ को स्पष्ट रखते हैं।
- source_word: בְּשַׂר
  choice: मांस
  rationale: बलिदान के संदर्भ में यह ठोस और सामान्य आधुनिक हिंदी शब्द है।
- source_word: הַמִּלֻּאִים
  choice: याजक-प्रतिष्ठा के बलिदान
  rationale: यह पद निर्गमन 29 में याजकों को उनके पद पर स्थापित और समर्पित करने के संस्कार को सूचित करता है। संदर्भ से 'बलिदान' जोड़ा गया है, क्योंकि यहाँ उसी संस्कार के बलिदानी मांस की बात है।
- source_word: לֶּחֶם
  choice: रोटी
  rationale: इस प्रसंग में तैयार की गई रोटियों के लिए सरल और स्वाभाविक हिंदी रूप।
- source_word: עַד הַבֹּקֶר
  choice: सुबह तक
  rationale: עַד द्वारा व्यक्त समय-सीमा को सीधे बनाए रखता है।
- source_word: וְשָׂרַפְתָּ ... בָּאֵשׁ
  choice: तो ... आग में जला देना
  rationale: शर्त के परिणाम को 'तो' से स्पष्ट किया गया है; 'आग में जला देना' वर्तमान हिंदी में स्वाभाविक है और पूर्ण निपटान का भाव रखता है।
- source_word: לֹא יֵאָכֵל
  choice: उसे खाया न जाए
  rationale: इब्रानी के निष्क्रिय निषेध और विधिक लहजे को संक्षिप्त हिंदी में बनाए रखता है।
- source_word: קֹדֶשׁ
  choice: पवित्र
  rationale: उपासना-संबंधी अलगाव और परमेश्वर के लिए समर्पित होने का मानक बाइबिलीय भाव व्यक्त करता है।
theological_decisions:
- issue: याजकीय संस्कार के पद הַמִּלֻּאִים का अनुवाद
  choice: याजक-प्रतिष्ठा के बलिदान
  alternative: याजक-अभिषेक के बलिदान; समर्पण-संस्कार के बलिदान
  rationale: यहाँ पद याजकों को उनके सेवकाई-पद पर स्थापित करने के पूरे संस्कार से जुड़ा है। 'याजक-प्रतिष्ठा' उस संस्थापन-भाव को स्पष्ट करता है, जबकि पादटिप्पणी निकट विकल्पों और संस्कारगत अर्थ को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और साधारण पाठक के लिए स्पष्ट रखी गई है। विधिक निर्देश के लिए 'जला देना' और निष्क्रिय निषेध 'खाया न जाए' प्रयुक्त हैं।
