base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/027.yaml
  text: And you shall consecrate the breast of the wave offering and the thigh of the contribution[a], which was waved and which was raised, from the ram of ordination[b], from what was Aaron's and from what was his sons'.
translation:
  language: hi
  text: और तुम लहराने की भेंट की छाती और उठाने की भेंट की जाँघ[a] को पवित्र ठहराना, जो पदस्थापना-संस्कार के मेढ़े[b] में से लहराई गई और उठाई गई थी—हारून के हिस्से में से और उसके पुत्रों के हिस्से में से।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “उठाई गई भेंट की जाँघ”; परंपरागत रूप से इसे “ऊँचा उठाई गई भेंट” भी कहा जाता है।'
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “भराइयों का मेढ़ा”; यह याजकों को उनके पद पर स्थापित करने के संस्कार में प्रयुक्त मेढ़े के लिए एक मुहावरा है।
    reason: cultural_note
lexical_decisions:
- source_word: קִדַּשְׁתָּ
  choice: पवित्र ठहराना
  rationale: पिएल रूप का अर्थ किसी वस्तु को पवित्र उपयोग के लिए अलग करना है। आज्ञा-सूचक वाक्य-विन्यास में यह स्वाभाविक और याजकीय संदर्भ के अनुकूल है।
- source_word: חֲזֵה הַתְּנוּפָה
  choice: हिलाकर अर्पित की गई भेंट की छाती
  rationale: यह अनुवाद पशु की छाती के भाग और נוף से जुड़े ठोस अनुष्ठानिक हिलाने के कार्य, दोनों को स्पष्ट रखता है।
- source_word: שׁוֹק הַתְּרוּמָה
  choice: उठाकर अर्पित की गई भेंट की जाँघ
  rationale: שׁוֹק के लिए 'जाँघ' ऊपरी पिछले पैर के भाग को दर्शाता है; תְּרוּמָה को 'उठाकर अर्पित की गई भेंट' कहना उसके समर्पित अंश और उठाने की क्रिया दोनों को सुरक्षित रखता है।
- source_word: הוּנַף
  choice: हिलाया गया
  rationale: निफ़/होफ़ाल क्रिया के अनुष्ठानिक संकेत को बनाए रखता है और תְּנוּפָה के साथ शब्दगत संबंध स्पष्ट करता है।
- source_word: הוּרָם
  choice: उठाया गया
  rationale: होफ़ाल रूप और תְּרוּמָה से जुड़े उठाए जाने के ठोस कर्म को सीधे व्यक्त करता है।
- source_word: אֵיל הַמִּלֻּאִים
  choice: अभिषेक-संस्कार का मेढ़ा
  rationale: शाब्दिक रूप 'भराइयों का मेढ़ा' है, पर यह याजकों को पद पर स्थापित और समर्पित करने के संस्कार का रूढ़ मुहावरा है। 'अभिषेक-संस्कार' सामान्य हिन्दी पाठक के लिए प्रसंग को स्पष्ट करता है।
- source_word: מֵאֲשֶׁר לְאַהֲרֹן וּמֵאֲשֶׁר לְבָנָיו
  choice: चाहे वह हारून का भाग हो या उसके पुत्रों का
  rationale: यह हारून और उसके पुत्रों से संबद्ध अलग-अलग हिस्सों का वितरणगत अर्थ स्वाभाविक हिन्दी में व्यक्त करता है, बिना स्वामित्व की प्रकृति को अनावश्यक रूप से कठोर बनाए।
theological_decisions:
- issue: बलिदान-संबंधी तकनीकी शब्दों का अनुवाद
  choice: भेंट और उससे जुड़ी ठोस क्रियाओं—'हिलाकर', 'उठाकर', 'हिलाया गया', 'उठाया गया'—को बनाए रखना
  alternative: दोनों को सामान्यतः 'प्रस्तुत की गई भेंट' या 'विशेष भेंट' कहना
  rationale: इब्रानी पाठ संज्ञाओं और संबंधित क्रियाओं के बीच जानबूझकर समानता रखता है। उसे बनाए रखने से याजकीय विधि की ठोस भाषा सुरक्षित रहती है और किसी बाद की सांप्रदायिक व्याख्या को नहीं थोपा जाता।
- issue: אֵיל הַמִּלֻּאִים में संस्कार का स्वरूप
  choice: मुख्य पाठ में 'अभिषेक-संस्कार का मेढ़ा' और पादटिप्पणी में शाब्दिक मुहावरा
  alternative: '''समर्पण का मेढ़ा'' या शाब्दिक ''भराइयों का मेढ़ा'''
  rationale: यह पद याजकीय पदस्थापन के संस्कार को सूचित करता है। चुना हुआ रूप आधुनिक हिन्दी में बोधगम्य है, जबकि पादटिप्पणी मूल मुहावरे की पारदर्शिता बचाती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और विधिक-याजकीय है। दुर्बोध पारंपरिक संज्ञा गढ़ने के बजाय अनुष्ठानिक क्रियाओं को स्पष्ट वाक्यांशों में व्यक्त किया गया है। मुख्य पाठ में दोनों पादटिप्पणी चिह्न [a] और [b] उपस्थित हैं।
