base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/009.yaml
  text: You shall fasten sashes on them[a], on Aaron and on his sons, and you shall bind caps on them. The priesthood shall belong to them as a permanent statute. So you shall ordain Aaron and his sons.
translation:
  language: hi
  text: तू हारून और उसके पुत्रों की कमर पर कमरबन्द बाँधना और उनके सिर पर टोपियाँ बाँधना। याजकपद सदा की विधि के रूप में उनका होगा। इस प्रकार तू हारून और उसके पुत्रों को याजकपद पर नियुक्त करना।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “हारून और उसके पुत्रों के हाथ भरना”; यह याजकीय सेवा में विधिवत स्थापित या नियुक्त करने का एक इब्रानी मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חָגַרְתָּ ... אַבְנֵט
  choice: कमर पर कमरबन्द बाँधना
  rationale: חגר और אַבְנֵט का संयुक्त प्रयोग याजकीय कमरबन्द पहनाने या कसकर बाँधने की क्रिया बताता है। यह हिन्दी में स्वाभाविक है और वस्त्र-संबंधी क्रिया को स्पष्ट रखता है।
- source_word: חָבַשְׁתָּ לָהֶם מִגְבָּעֹת
  choice: उनके सिर पर टोपियाँ बाँधना
  rationale: חבש सिर पर बाँधने या लपेटने की क्रिया है, और מִגְבָּעוֹת सामान्य याजकों के विशिष्ट सिर के आवरण हैं। ‘टोपियाँ’ इन्हें महायाजक की पगड़ी से अलग रखता है।
- source_word: וְהָיְתָה לָהֶם כְּהֻנָּה
  choice: याजकपद ... उनका होगा
  rationale: यह הָיָה + לְ के स्वामित्व या नियत अधिकार वाले इब्रानी प्रयोग को सहज हिन्दी में व्यक्त करता है।
- source_word: לְחֻקַּת עוֹלָם
  choice: सदा की विधि के अनुसार
  rationale: חֻקָּה स्थिर विधि या विधान है और עוֹלָם यहाँ वाचा-संबंधी व्यवस्था की चिरस्थायी अवधि दर्शाता है। ‘सदा की विधि’ बल बनाए रखती है, पर दार्शनिक अनन्तता का अतिरिक्त निष्कर्ष नहीं जोड़ती।
- source_word: וּמִלֵּאתָ יַד
  choice: अभिषेक करना
  rationale: ‘हाथ भरना’ याजकीय सेवा में स्थापित या नियुक्त करने का पारिभाषिक मुहावरा है। हिन्दी बाइबिलीय-सांस्कृतिक प्रयोग में ‘अभिषेक करना’ इस स्थापना-संस्कार को सुबोध ढंग से व्यक्त करता है; शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: לְחֻקַּת עוֹלָם में याजकीय व्यवस्था की अवधि
  choice: सदा की विधि के अनुसार
  alternative: सदा की विधि के रूप में; सनातन विधान के अनुसार
  rationale: यह अनुवाद इस्राएल की वाचा-व्यवस्था में विधान की निरन्तर बाध्यता व्यक्त करता है और प्रसंग से परे पूर्ण दार्शनिक कालातीतता का निर्णय नहीं थोपता।
- issue: וּמִלֵּאתָ יַד का याजकीय स्थापना-संबंधी अर्थ
  choice: हारून और उसके पुत्रों का अभिषेक करना
  alternative: हारून और उसके पुत्रों को याजकपद पर नियुक्त करना; हारून और उसके पुत्रों के हाथ भरना
  rationale: मूल मुहावरा याजकीय पद पर विधिवत स्थापित करने को दर्शाता है। ‘अभिषेक करना’ हिन्दी पाठक के लिए संस्कारगत नियुक्ति को संक्षेप में बताता है, जबकि शाब्दिक मुहावरा पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, आज्ञार्थक बाइबिलीय शैली अपनाई गई है। ‘तू’ एकवचन संबोधन मूल इब्रानी के अनुरूप है। ‘कमरबन्द’, ‘टोपियाँ’, ‘याजकपद’ और ‘विधि’ सामान्य पाठक के लिए सुबोध रहते हुए उपासना-संबंधी प्रसंग की औपचारिकता बनाए रखते हैं।
