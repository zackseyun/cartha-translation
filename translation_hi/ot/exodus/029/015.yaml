  yaml_path: translation/ot/exodus/029/015.yaml
  text: Then you shall take the one ram[a], and Aaron and his sons shall lay their hands on the head of the ram.
translation:
  language: hi
  text: फिर तुम उस एक मेढ़े[a] को लो, और हारून और उसके पुत्र अपने हाथ उस मेढ़े के सिर पर रखें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “उस एक मेढ़े” है, जो इस विधि के दूसरे मेढ़े से इसे अलग करता है; कुछ अनुवाद इसे “पहला मेढ़ा” कहते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: फिर
  rationale: संयोजक और कर्म-चिह्न विधि के अगले क्रमिक चरण का परिचय देते हैं; आधुनिक हिन्दी में “फिर” इस प्रगति को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הָ/אַיִל הָ/אֶחָד
  choice: उस एक मेढ़े
  rationale: אַיִל का सटीक अर्थ “मेढ़ा” है। निश्चित पद הָאֶחָד यहाँ दो मेढ़ों में से एक को अलग पहचानता है; “उस एक” इस भेद को बनाए रखता है और इसे अनिवार्य रूप से “पहला” नहीं बनाता।
- source_word: תִּקָּח
  choice: तुम ... लेना
  rationale: यह मूसा को संबोधित द्वितीय पुरुष एकवचन का विधिपरक निर्देश है। “तुम ... लेना” हिन्दी में क्रमबद्ध धार्मिक निर्देश की स्वाभाविक और स्पष्ट शैली है।
- source_word: וְ/סָמְכוּ
  choice: अपने हाथ ... रखें
  rationale: סמך बल देकर टिकाने या रखने का भाव दे सकता है; बलिदान-विधि में “हाथ सिर पर रखना” इस अनुष्ठानिक क्रिया का स्पष्ट, प्रचलित और अनावश्यक व्याख्या से मुक्त हिन्दी रूप है।
- source_word: אַהֲרֹן וּ/בָנָי/ו
  choice: हारून और उसके पुत्र
  rationale: यहाँ בנים हारून के उन पुरुष वंशजों को सूचित करता है जिनका याजकीय अभिषेक हो रहा है; इसलिए “पुत्र” संदर्भानुकूल है।
- source_word: אֶת יְדֵי/הֶם
  choice: अपने हाथ
  rationale: मूल में बहुवचन “उनके हाथ” है। कर्ता के अपने ही हाथ होने के कारण हिन्दी में निजवाचक “अपने हाथ” अधिक स्वाभाविक है और बहुवचन भी सुरक्षित रहता है।
- source_word: עַל רֹאשׁ הָ/אָיִל
  choice: उस मेढ़े के सिर पर
  rationale: यह स्थान-सूचक वाक्यांश का सीधा और स्वाभाविक हिन्दी रूप है; मेढ़े का दोबारा स्पष्ट उल्लेख मूल की पुनरुक्ति को बनाए रखता है।
theological_decisions:
- issue: बलिदान-संबंधी विधि में हाथ रखने की क्रिया
  choice: अपने हाथ उस मेढ़े के सिर पर रखें
  alternative: अपने हाथ उस मेढ़े के सिर पर टिकाएँ
  rationale: मूल क्रिया में टिकाने या सहारा देने का भाव संभव है, पर इस विधिक संदर्भ में हाथ रखने की अनुष्ठानिक क्रिया अभिप्रेत है। अनुवाद क्रिया को बताता है, पर उसके प्रायश्चित्त, प्रतिनिधित्व या स्थानापन्नता संबंधी किसी ऐसे धर्मवैज्ञानिक अर्थ को नहीं जोड़ता जो इस पद में स्पष्ट नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सरल किंतु गरिमापूर्ण विधिपरक शैली में रखी गई है। मूसा के लिए एकवचन अर्थ वाले सम्मानसूचक “तुम” के साथ हिन्दी का निर्देशात्मक “लेना” प्रयुक्त है; हारून और उसके पुत्रों के लिए बहुवचन “रखें” रखा गया है।
