base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/021.yaml
  text: Then you shall take some of the blood that is on the altar and some of the anointing oil[a], and sprinkle it on Aaron and on his garments and on his sons and on the garments of his sons with him; and he and his garments shall be holy, and his sons and the garments of his sons with him.
translation:
  language: hi
  text: फिर तू वेदी पर के लहू में से और अभिषेक के तेल में से कुछ लेकर उसे हारून पर और उसके वस्त्रों पर, और हारून के साथ उसके पुत्रों पर और उनके वस्त्रों पर छिड़कना। तब हारून और उसके वस्त्र, और हारून के साथ उसके पुत्र और उनके वस्त्र पवित्र होंगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पवित्र ठहराए जाएँगे।” इब्रानी में शाब्दिक रूप से “पवित्र होंगे” है, जो इस अनुष्ठान के बाद प्राप्त पवित्र स्थिति को व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לָקַחְתָּ
  choice: तू ... कुछ लेकर ... छिड़कना
  rationale: संयोजक वाव के साथ पूर्ण क्रिया यहाँ अनुष्ठान-संबंधी निर्देशों की क्रमिक शृंखला में आदेशात्मक भाव रखती है। आधुनिक हिंदी में कृदंत और आदेशात्मक क्रिया का संयोजन स्वाभाविक है।
- source_word: מִן הַדָּם אֲשֶׁר עַל הַמִּזְבֵּחַ
  choice: वेदी पर के लहू में से ... कुछ
  rationale: מִן किसी मात्रा में से एक अंश लेने का संकेत देता है; इसलिए ‘में से कुछ’ स्रोत का अर्थ स्पष्ट रखता है।
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: अभिषेक का तेल
  rationale: यह अभिषेक के लिए प्रयुक्त तेल का मानक रचनात्मक पद है और हिंदी बाइबलीय संदर्भ में स्वाभाविक है।
- source_word: הִזֵּיתָ
  choice: छिड़कना
  rationale: हिफ़ील रूप נזה याजकीय अनुष्ठानों में किसी द्रव को छिड़कने की क्रिया बताता है।
- source_word: בְּגָדָיו / בִּגְדֵי בָנָיו
  choice: उसके वस्त्र / उसके पुत्रों के वस्त्र
  rationale: בגד सामान्यतः वस्त्र को दर्शाता है; ‘वस्त्र’ याजकीय संदर्भ के अनुकूल है और बाद की कलीसियाई तकनीकी शब्दावली नहीं जोड़ता।
- source_word: בָּנָיו
  choice: उसके पुत्र
  rationale: इब्रानी पुल्लिंग बहुवचन है और संदर्भ में हारून के उन पुत्रों की बात है जो याजकीय सेवा के लिए नियुक्त हो रहे हैं।
- source_word: אִתּוֹ
  choice: उसके साथ
  rationale: यह पद हारून के साथ उसके पुत्रों और उनके वस्त्रों के सम्मिलित होने को सीधे व्यक्त करता है।
- source_word: וְקָדַשׁ
  choice: पवित्र होंगे
  rationale: अनुष्ठान के फलस्वरूप प्राप्त दशा को व्यक्त करता है। ‘पवित्र होंगे’ קדשׁ की मूल धारणा को बनाए रखता है और प्रक्रिया को अनावश्यक रूप से अधिक तकनीकी नहीं बनाता।
- source_word: הוּא
  choice: वह
  rationale: सर्वनाम का संकेत निकटवर्ती हारून की ओर स्पष्ट है और इब्रानी संरचना को बनाए रखता है।
theological_decisions:
- issue: अनुष्ठान से उत्पन्न पवित्र स्थिति का अनुवाद
  choice: पवित्र होंगे
  alternative: पवित्र ठहराए जाएँगे / समर्पित किए जाएँगे
  rationale: इब्रानी पाठ स्वयं קדשׁ की भाषा में परिणामी स्थिति बताता है। ‘पवित्र होंगे’ इस धर्मवैचारिक तनाव और स्रोत की श्रेणी को सुरक्षित रखता है, जबकि ‘समर्पित’ अनुष्ठान की प्रक्रिया को अधिक प्रमुख बना सकता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, स्पष्ट और अनुष्ठान-संबंधी शैली। मूसा को संबोधित एकवचन ‘तू’ निकटवर्ती विधिक निर्देशों की शैली को बनाए रखता है। ‘लहू’ और ‘अभिषेक’ परिचित बाइबलीय शब्द हैं; वाक्य-विन्यास को हिंदी में स्वाभाविक बनाने के लिए क्रम हल्का समायोजित किया गया है।
