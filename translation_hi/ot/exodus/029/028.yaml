  yaml_path: translation/ot/exodus/029/028.yaml
  text: It shall belong to Aaron and to his sons as a permanent statute from the Israelites[a], for it is a contribution; it shall be a contribution from the Israelites, from the sacrifices of their peace offerings, their contribution to Yahweh.
translation:
  language: hi
  text: यह हारून और उसके पुत्रों के लिए इस्राएलियों की ओर से सदा का नियत अधिकार होगा, क्योंकि यह अर्पित अंश है। यह इस्राएलियों की ओर से उनकी मेल-बलियों[a] में से यहोवा के लिए उनका अर्पित अंश होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मेल-बलि’ का अनुवाद ‘शांति-बलि’ या ‘कुशल-मंगल की बलि’ भी किया जा सकता है। इब्रानी शब्द में शांति, पूर्ण कुशलता और मेल-सहभागिता की अर्थछायाएँ हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה לְאַהֲרֹן וּלְבָנָיו
  choice: हारून और उसके पुत्रों के लिए ... ठहराया हुआ भाग होगा
  rationale: शाब्दिक ‘होगा’ यहाँ पुरोहितों को मिलने वाले नियत भाग का बोध कराता है; ‘ठहराया हुआ भाग’ हिन्दी में कानूनी और स्वामित्व-संबंधी आशय स्पष्ट करता है।
- source_word: לְחָק עוֹלָם
  choice: सदा की विधि के अनुसार
  rationale: חָק नियत विधान या अधिकार और עוֹלָם स्थायी अवधि का बोध कराते हैं; यह पदबंध अनावश्यक दार्शनिक ‘अनन्तता’ थोपे बिना स्थायी वैधानिक बल बनाए रखता है।
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों की ओर से
  rationale: מֵאֵת दाता/स्रोत को दर्शाता है; ‘की ओर से’ आधुनिक हिन्दी में स्वाभाविक है और ‘इस्राएल के पुत्रों’ जैसी अनावश्यक शब्दशः अभिव्यक्ति से बचता है।
- source_word: תְרוּמָה
  choice: उठाकर अर्पित किया गया अंश
  rationale: תְרוּמָה किसी अलग किए और यहोवा के सामने प्रस्तुत किए गए अंश को दर्शाता है तथा धातु में उठाने का भाव भी हो सकता है। यह अनुवाद केवल सामान्य ‘भेंट’ से अधिक विशिष्ट है, पर पुराने तकनीकी शब्द पर निर्भर नहीं करता।
- source_word: מִזִּבְחֵי שַׁלְמֵיהֶם
  choice: उनके मेलबलियों में से
  rationale: זִבְחֵי बलिदानों को और שְׁלָמִים शांति, कुशलता तथा सहभागिता से जुड़े बलिदान-वर्ग को दर्शाता है। ‘मेलबलि’ संक्षिप्त तथा पहचाना जाने वाला पंथ-संबंधी पद है; अन्य अर्थछायाएँ पादटिप्पणी में दी गई हैं।
- source_word: תְּרוּמָתָם לַיהוָה
  choice: यहोवा के लिए उनका अर्पित अंश
  rationale: संबंधसूचक प्रत्यय योगदान को इस्राएलियों का बताता है और לַיהוָה उसके प्राप्तकर्ता/समर्पण को; ‘अर्पित अंश’ निकटवर्ती पुनरावृत्ति को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יהוה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के व्यक्तिगत वाचा-नाम का प्रचलित और स्पष्ट रूप; इससे मूल पाठ में उपस्थित नाम की विशिष्टता बनी रहती है।
theological_decisions:
- issue: शְׁלָמִים का अर्थ-क्षेत्र
  choice: मेलबलि
  alternative: शान्ति-बलि; कुशल-मंगल की बलि
  rationale: मूल पद में शांति, पूर्णता/कुशलता और सहभागी भोज की परस्पर जुड़ी अर्थछायाएँ हैं। मुख्य पाठ में ‘मेलबलि’ पंथ-संबंधी नाम को संक्षेप में रखता है, जबकि पादटिप्पणी genuine semantic breadth को सुरक्षित रखती है।
- issue: ईश्वरीय नाम יהוה
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल इब्रानी में सामान्य उपाधि नहीं बल्कि चतुरक्षरीय व्यक्तिगत नाम है। ‘यहोवा’ हिन्दी पाठक के लिए नाम को प्रत्यक्ष रखता है और उसे ‘प्रभु’ के साथ मौन रूप से नहीं मिलाता।
- issue: תְרוּמָה में उठाने की रीति और सामान्य योगदान का संबंध
  choice: उठाकर अर्पित किया गया अंश
  alternative: अर्पण; योगदान; उठाई हुई भेंट
  rationale: संदर्भ किसी सामान्य दान से अधिक, परमेश्वर के लिए अलग किए गए पुरोहितीय अंश का है। चुना रूप क्रियात्मक अर्थछाया और नियत हिस्से—दोनों को रखता है, बिना यह दावा किए कि हर प्रसंग में कोई एक निश्चित अनुष्ठानिक मुद्रा अनिवार्य थी।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सुबोध रखी गई है। कानूनी-पंथ संबंधी पुनरावृत्ति को काफी हद तक सुरक्षित रखा गया है। ‘उठाकर अर्पित किया गया अंश’ तकनीकी आशय को स्पष्ट करता है, और अंतिम खंड में लय तथा बल बनाए रखने के लिए दीर्घ विराम-चिह्न प्रयोग किया गया है।
