base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/020.yaml
  text: Then you shall slaughter the ram[a], and take some of its blood and put it on the lobe of Aaron’s right ear, and on the lobe of the right ear of his sons, and on the thumb of their right hand, and on the big toe of their right foot[b]; and you shall throw the blood against the altar all around.
translation:
  language: hi
  text: तब उस मेढ़े का वध करना, और उसका कुछ रक्त लेकर हारून के दाहिने कान की पाली पर, और उसके पुत्रों के दाहिने कानों की पालियों पर, और उनके दाहिने हाथों के अँगूठों पर तथा उनके दाहिने पैरों के बड़े अँगूठों पर लगाना; फिर रक्त को वेदी पर चारों ओर उछालना[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘रक्त को वेदी पर चारों ओर छपका देना।’ इब्रानी क्रिया हल्के छिड़काव के बजाय बलपूर्वक किए गए अनुष्ठानिक प्रयोग का संकेत देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁחַט
  choice: बलि करना
  rationale: बलिदान के अनुष्ठान में यह पशु के वध को दर्शाता है; ‘बलि करना’ आधुनिक हिन्दी में प्रसंग और उद्देश्य दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אַיִל
  choice: मेढ़ा
  rationale: यह नर भेड़ के लिए मानक और सटीक हिन्दी शब्द है।
- source_word: מִדָּמוֹ
  choice: उसका कुछ रक्त
  rationale: यहाँ מִן रक्त के एक अंश को लेने का भाव देता है; ‘कुछ रक्त’ हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: תְּנוּךְ אֹזֶן
  choice: कान की लौ
  rationale: याजकीय अनुष्ठान के इस प्रसंग में यह संभवतः कान के निचले कोमल भाग को दर्शाता है; शब्द कान के छोर को अधिक सामान्य अर्थ में भी दर्शा सकता है, इसलिए विकल्प पादटिप्पणी में रखा गया है।
- source_word: הַיְמָנִית
  choice: दाहिने
  rationale: यह कान, हाथ और पैर के दाहिने अंग को निर्दिष्ट करता है।
- source_word: בֹּהֶן יָד
  choice: हाथ का अँगूठा
  rationale: हाथ के संदर्भ में בֹּהֶן विशेष रूप से अँगूठे को दर्शाता है।
- source_word: בֹּהֶן רֶגֶל
  choice: पैर का अँगूठा
  rationale: पैर के संदर्भ में בֹּהֶן बड़े अँगूठे को दर्शाता है; हिन्दी में ‘पैर का अँगूठा’ स्पष्ट है।
- source_word: זָרַק
  choice: फेंकना
  rationale: बलिदान-विधि में यह वेदी पर रक्त के बलपूर्वक प्रयोग को दर्शाता है, केवल हल्के छिड़काव को नहीं।
- source_word: סָבִיב
  choice: चारों ओर
  rationale: यह वेदी के चारों ओर रक्त लगाए जाने का वितरणात्मक भाव सुरक्षित रखता है।
- source_word: וְ
  choice: फिर / और
  rationale: क्रमिक वाव अनुष्ठान की अगली क्रियाओं को आगे बढ़ाता है; हिन्दी में ‘फिर’ और ‘और’ इस प्रवाह को स्वाभाविक रखते हैं।
