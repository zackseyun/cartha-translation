review_pass:
  verdict: revise
  source_fidelity: 'The draft generally follows the Hebrew ritual sequence and preserves the specified right ear, hand, and foot. However, “शेष रक्त” adds information not stated in the verse: the Hebrew simply resumes with “the blood.” The rendering of the final action should also make clear that the blood is applied onto/against the altar, not merely thrown around it.'
  naturalness: “कान की लौ” is not standard modern Hindi for an earlobe and can evoke “flame.” “कान की पाली” is the natural anatomical expression. The revised wording is clear, dignified, and idiomatic while retaining the procedural imperative style.
  terminology: “मेढ़ा,” “रक्त,” “दाहिना,” and “अँगूठा” are appropriate. “वध करना” accurately renders the sacrificial slaughter without importing the broader ritual sense of “बलि चढ़ाना.” “उछालना” conveys the forceful ritual application of זָרַק more naturally than an unqualified “फेंकना.”
  issues:
  - severity: medium
    issue: “शेष रक्त” is an added qualification.
    rationale: The Hebrew says “the blood,” not “the remaining blood.” Although the implication is understandable in context, the addition narrows the wording beyond the source.
  - severity: medium
    issue: “कान की लौ” is not a natural Hindi term for earlobe.
    rationale: Modern standard Hindi normally uses “कान की पाली.” The present expression may be misunderstood as “flame of the ear.”
  - severity: low
    issue: The final clause does not explicitly locate the blood on the altar.
    rationale: “वेदी पर चारों ओर फेंकना” can be read as throwing blood around the altar. The Hebrew specifies forceful application against/on the altar around its sides.
