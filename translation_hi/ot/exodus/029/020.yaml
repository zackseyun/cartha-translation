revisions:
- from: फिर तुम उस मेढ़े को बलि करना और उसका कुछ रक्त लेकर हारून के दाहिने कान की लौ[a] पर, उसके पुत्रों के दाहिने कानों की लौ पर, उनके दाहिने हाथ के अँगूठे पर और उनके दाहिने पैर के अँगूठे पर लगाना; फिर शेष रक्त वेदी पर चारों ओर फेंकना[b]।
  to: तब उस मेढ़े का वध करना, और उसका कुछ रक्त लेकर हारून के दाहिने कान की पाली पर, और उसके पुत्रों के दाहिने कानों की पालियों पर, और उनके दाहिने हाथों के अँगूठों पर तथा उनके दाहिने पैरों के बड़े अँगूठों पर लगाना; फिर रक्त को वेदी पर चारों ओर उछालना[a]।
  rationale: The revision removes the unsupported word “शेष,” replaces the unnatural anatomical expression “कान की लौ” with “कान की पाली,” and clarifies that the blood is forcefully applied on/against the altar. The former footnote on “कान की लौ/छोर” is not retained because the main rendering now uses the natural Hindi term “कान की पाली”; the Hebrew’s broader possible sense does not require a footnote in this concise translation.
