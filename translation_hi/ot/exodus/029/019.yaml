  text: Then you shall take the second ram, and Aaron and his sons shall lay their hands on the head of the ram.
translation:
  language: hi
  text: फिर दूसरे मेढ़े को लेना, और हारून और उसके पुत्र अपने हाथ उस मेढ़े के सिर पर रखें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: फिर तुम ... लेना
  rationale: निर्देशों के क्रम में संयोजक सहित पूर्ण क्रिया आज्ञार्थक निर्देश का काम करती है। ‘फिर’ क्रम को और ‘लेना’ स्वाभाविक आधुनिक हिन्दी में निर्देश को व्यक्त करता है।
- source_word: הָאַיִל הַשֵּׁנִי
  choice: दूसरे मेढ़े
  rationale: אַיִל का अर्थ ‘मेढ़ा’ और הַשֵּׁנִי का अर्थ क्रमवाचक ‘दूसरा’ है; यह अभिषेक-विधि के दूसरे मेढ़े को सूचित करता है।
- source_word: וְסָמַךְ
  choice: रखें
  rationale: बलिदान-संबंधी प्रसंग में סמך पशु पर हाथ रखने अथवा टिकाने की विधिक क्रिया बताता है। ‘हाथ ... रखें’ स्पष्ट और स्वाभाविक हिन्दी है।
- source_word: אַהֲרֹן וּבָנָיו
  choice: हारून और उसके बेटे
  rationale: इस याजकीय अभिषेक के प्रसंग में בָּנִים हारून के पुरुष वंशजों को सूचित करता है; ‘बेटे’ वर्तमान हिन्दी में सटीक है।
- source_word: אֶת יְדֵיהֶם
  choice: अपने हाथ
  rationale: इब्रानी में ‘उनके हाथ’ बहुवचन है। हिन्दी में समान कर्ता के साथ ‘अपने हाथ’ संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: עַל רֹאשׁ הָאָיִל
  choice: उस मेढ़े के सिर पर
  rationale: यह सीधा स्थानवाचक पदबंध है। ‘उस मेढ़े’ पहले उल्लिखित दूसरे मेढ़े की ओर संकेत करता है।
theological_decisions:
- issue: हाथ रखने की विधि का अर्थ बिना अतिरिक्त धर्मवैज्ञानिक व्याख्या जोड़े व्यक्त करना
  choice: अपने हाथ उस मेढ़े के सिर पर रखें
  alternative: अपने हाथ उस मेढ़े के सिर पर टिकाएँ
  rationale: मूल पाठ केवल विधिक क्रिया बताता है, उसका प्रतीकात्मक अर्थ नहीं समझाता। इसलिए अनुवाद दोष-स्थानांतरण, तादात्म्य या अभिषेक जैसी कोई अतिरिक्त व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज निर्देशात्मक शैली। मूसा को संबोधित एकवचन ‘तुम’ रखा गया है और हारून तथा उसके बेटों के लिए आदरसूचक बहुवचन क्रिया ‘रखें’ प्रयुक्त हुई है।
