  yaml_path: translation/ot/exodus/029/007.yaml
  text: Then you shall take the anointing oil and pour it on his head and anoint him.
translation:
  language: hi
  text: फिर अभिषेक का तेल लेकर उसके सिर पर उँडेलना और उसका अभिषेक करना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: फिर ... लेकर
  rationale: संयोजक सहित क्रिया विधि के क्रम में अगला निर्देश देती है। हिंदी में ‘फिर’ क्रम को स्वाभाविक रूप से व्यक्त करता है, और ‘लेकर’ आगे की समन्वित क्रियाओं से इसे सहजता से जोड़ता है।
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: अभिषेक का तेल
  rationale: यह संबंधसूचक पदबंध विशेष रूप से अभिषेक के लिए प्रयुक्त तेल को दर्शाता है। यह हिंदी में स्वाभाविक है और अनुष्ठानिक अर्थ बनाए रखता है।
- source_word: וְיָצַקְתָּ
  choice: उँडेलना
  rationale: יצק का मूल अर्थ यहाँ किसी द्रव को ‘उँडेलना’ है। यह ‘डालना’ की अपेक्षा जानबूझकर किए गए प्रवाह की क्रिया को अधिक स्पष्ट रखता है।
- source_word: עַל רֹאשׁוֹ
  choice: उसके सिर पर
  rationale: पूर्वसर्ग और संबंधसूचक प्रत्यय का सीधा, स्पष्ट और स्वाभाविक हिंदी रूप।
- source_word: וּמָשַׁחְתָּ אֹתוֹ
  choice: और उसका अभिषेक करना
  rationale: משׁח के विशिष्ट अनुष्ठानिक और धर्मवैचारिक अर्थ को ‘अभिषेक करना’ ठीक प्रकार से सुरक्षित रखता है; इसे केवल ‘अलग ठहराना’ कहकर व्याख्यात्मक नहीं बनाया गया।
theological_decisions:
- issue: तेल उँडेलने और अभिषेक करने की अनुष्ठानिक क्रमबद्धता
  choice: 'दोनों क्रियाओं को अलग-अलग रखा गया है: ‘उसके सिर पर उँडेलना और उसका अभिषेक करना।’'
  alternative: ‘उसके सिर पर तेल उँडेलकर उसका अभिषेक करना,’ जिससे पहली क्रिया दूसरी का केवल साधन प्रतीत हो सकती है।
  rationale: इब्रानी पाठ में दो समन्वित क्रियाएँ हैं। दोनों को अलग बनाए रखने से शारीरिक क्रिया और अभिषेक की अनुष्ठानिक क्रिया में पाठ द्वारा रखा गया भेद सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिंदी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। विधिसंबंधी प्रसंग के अनुरूप ‘लेकर ... उँडेलना ... करना’ वाला निर्देशात्मक ढाँचा अपनाया गया है।
