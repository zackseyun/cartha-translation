base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/003.yaml
  text: You shall put them into one basket[a], and you shall bring them near in the basket[b], along with the bull and the two rams.
translation:
  language: hi
  text: तू उन्हें एक टोकरी में रखेगा[a], और उस टोकरी में उन्हें, बैल और दोनों मेढ़ों को, समीप लाएगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘एक टोकरी पर’; पात्र के इस संदर्भ में अर्थ ‘एक टोकरी में’ है।
    reason: lexical_alternative
  - marker: b
    text: या ‘प्रस्तुत करेगा’ अथवा ‘चढ़ाएगा’। इब्रानी क्रिया बलिदान के लिए प्रयुक्त होने वाला सामान्य शब्द है, जिसका मूल भाव ‘समीप लाना’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ אוֹתָם
  choice: तू उन्हें रखेगा
  rationale: נתן का मूल अर्थ ‘देना/रखना’ है; इस अनुष्ठानिक निर्देश में ‘रखना’ स्वाभाविक है। एकवचन संबोधन और निर्देशात्मक भविष्य-रूप को बनाए रखा गया है।
- source_word: עַל סַל אֶחָד
  choice: एक टोकरी में
  rationale: על का सामान्य अर्थ ‘पर’ है, पर किसी पात्र में वस्तुएँ रखने के इस संदर्भ में हिन्दी में ‘में’ अधिक स्वाभाविक है। אֶחָד को ‘एक’ के रूप में सुरक्षित रखा गया है।
- source_word: וְהִקְרַבְתָּ אֹתָם
  choice: उन्हें ... समीप लाएगा
  rationale: हिफ़ील הקריב बलिदान-संबंधी संदर्भ में ‘समीप लाना/प्रस्तुत करना/चढ़ाना’ हो सकता है। ‘समीप लाना’ मूल क्रिया-चित्र और इसकी व्यापकता बनाए रखता है।
- source_word: בַּסָּל
  choice: टोकरी में ही
  rationale: 'ב का अर्थ यहाँ ‘में’ है: पिछली आयत की रोटियाँ टोकरी में रहते हुए समीप लाई जाती हैं। ‘ही’ हिन्दी में इस संबंध को स्पष्ट करता है, बिना टोकरी को अलग प्रत्यक्ष कर्म बनाए।'
- source_word: וְאֶת הַפָּר וְאֵת שְׁנֵי הָאֵילִם
  choice: उस बैल और दोनों मेढ़ों समेत
  rationale: दोहराए गए कर्म-सूचक את से स्पष्ट है कि बैल और मेढ़े भी समीप लाए जाने वाले प्रत्यक्ष कर्म हैं। ‘समेत’ इस समन्वय को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַפָּר
  choice: उस बैल
  rationale: פַּר का अर्थ ‘बैल’ है। संकेतात्मक ‘उस’ पूर्वोक्त और निश्चित पशु को हिन्दी में स्वाभाविक रूप से दर्शाता है।
- source_word: שְׁנֵי הָאֵילִם
  choice: दोनों मेढ़ों
  rationale: निश्चित बहुवचन संज्ञा के साथ संख्या को हिन्दी में स्वाभाविक रूप से ‘दोनों मेढ़ों’ कहा गया है।
theological_decisions:
- issue: הקריב की बलिदान-संबंधी विशिष्टता
  choice: समीप लाएगा
  alternative: प्रस्तुत करेगा / चढ़ाएगा
  rationale: ‘चढ़ाना’ इस चरण को अंतिम बलिदानी क्रिया के रूप में अधिक निश्चित कर सकता है, जबकि मूल क्रिया यहाँ टोकरी की वस्तुओं और पशुओं—दोनों को समीप लाने का निर्देश देती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। निकटवर्ती विधिक निर्देशों के अनुरूप एकवचन ‘तू’ और भविष्यात्मक आज्ञार्थक शैली रखी गई है। ‘मेढ़ा’ सामान्य आधुनिक हिन्दी का पशु-नाम है; वाक्यक्रम को हिन्दी की स्वाभाविकता के लिए पुनर्गठित किया गया है।
