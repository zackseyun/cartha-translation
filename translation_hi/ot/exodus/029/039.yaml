  yaml_path: translation/ot/exodus/029/039.yaml
  text: You shall offer the one lamb in the morning[a], and the second lamb you shall offer between the evenings.
translation:
  language: hi
  text: एक मेम्ने को सुबह चढ़ाना, और दूसरे मेम्ने को साँझों के बीच[a] चढ़ाना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “साँझों के बीच।” यह एक पारंपरिक अभिव्यक्ति है, जिसे प्रायः “गोधूलि के समय” या देर दोपहर से सूर्यास्त के बीच का समय समझा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כֶּבֶשׂ
  choice: मेम्ना
  rationale: बलिदान के प्रसंग में यह शब्द भेड़ के बच्चे को दर्शाता है; आधुनिक हिन्दी में “मेम्ना” स्वाभाविक और विशिष्ट है।
- source_word: הָאֶחָד
  choice: एक
  rationale: इब्रानी में शाब्दिक अर्थ “एक” है। “दूसरे” के साथ इसका युग्म क्रम को स्पष्ट करता है, इसलिए इसे अनावश्यक रूप से “पहला” नहीं बनाया गया।
- source_word: תַּעֲשֶׂה
  choice: चढ़ाना
  rationale: क्रिया का सामान्य अर्थ “करना/बनाना” है, पर बलिदान-संबंधी निर्देश में इसका भाव बलि अर्पित करना है; “चढ़ाना” हिन्दी में इस धार्मिक क्रिया को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: בַבֹּקֶר
  choice: सुबह
  rationale: समय-सूचक पद का सरल, स्वाभाविक और सटीक हिन्दी रूप।
- source_word: הַשֵּׁנִי
  choice: दूसरे
  rationale: यह क्रमवाचक विशेषण दूसरे मेम्ने को पहले से अलग करता है और मूल पाठ के क्रम को बनाए रखता है।
- source_word: בֵּין הָעַרְבָּיִם
  choice: साँझों के बीच
  rationale: विवादित पारंपरिक इब्रानी अभिव्यक्ति का औपचारिक अर्थ सुरक्षित रखा गया है; अधिक सहज संभावित अर्थ पादटिप्पणी में दिए गए हैं।
