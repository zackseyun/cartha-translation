base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/012.yaml
  text: And you shall take some of the blood of the bull and put it on the horns of the altar with your finger[c][b][a], and you shall pour out all the blood at the base of the altar.
translation:
  language: hi
  text: तुम बैल के लहू में से कुछ लेना और उसे अपनी उँगली से वेदी के सींगों पर लगाना,[a][b] और सारा लहू वेदी के आधार पर उँडेल देना।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “बैल के लहू में से”; यहाँ आशय लहू का कुछ भाग लेने से है।
    reason: lexical_alternative
  - marker: b
    text: “सींग” वेदी के कोनों पर बने सींग-जैसे उभार थे।
    reason: cultural_note
  - marker: c
    text: या, “वेदी के आधार की ओर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: तुम ... लेकर
  rationale: निर्देशों की क्रमिक शृंखला में संयोजक सहित पूर्ण क्रिया आज्ञार्थक भाव रखती है; हिन्दी में ‘लेकर ... लगाना’ स्वाभाविक विधि-निर्देश है।
- source_word: מִדַּם הַפָּר
  choice: बैल के लहू में से कुछ
  rationale: מִן यहाँ अंशवाचक है—सींगों पर लगाने के लिए कुल लहू का कुछ भाग लिया जाता है।
- source_word: וְנָתַתָּה
  choice: लगाना
  rationale: נתן का मूल अर्थ ‘रखना/देना’ है, पर लहू को उँगली से वेदी के सींगों पर रखने की क्रिया के लिए ‘लगाना’ स्पष्ट और स्वाभाविक है।
- source_word: עַל קַרְנֹת הַמִּזְבֵּחַ
  choice: वेदी के सींगों पर
  rationale: मूल पाठ की ठोस उपासना-संबंधी शब्दावली बनाए रखी गई है; ‘सींग’ वेदी के कोनों पर बने सींग-जैसे उभार हैं।
- source_word: בְּאֶצְבָּעֶךָ
  choice: अपनी उँगली से
  rationale: בְּ यहाँ साधन सूचित करता है; ‘से’ हिन्दी में उसका स्वाभाविक रूप है।
- source_word: וְאֶת כָּל הַדָּם תִּשְׁפֹּךְ
  choice: और बाकी सारा लहू ... उँडेल देना
  rationale: पहले कुछ लहू लिए जाने के बाद כָּל הַדָּם प्रसंगतः शेष समस्त लहू को दर्शाता है; ‘उँडेल देना’ जानबूझकर किए गए अनुष्ठानिक कार्य को व्यक्त करता है।
- source_word: אֶל יְסוֹד הַמִּזְבֵּחַ
  choice: वेदी के आधार पर
  rationale: יְסוֹד का अर्थ नींव/आधार है। אֶל दिशा या लक्ष्य बताता है; हिन्दी में ‘आधार पर’ इस क्रिया के साथ स्वाभाविक है, जबकि ‘आधार की ओर’ अधिक शाब्दिक विकल्प है।
theological_decisions:
- issue: वेदी की अनुष्ठानिक संरचना की विशिष्ट शब्दावली
  choice: ‘सींगों’ और ‘आधार’ को बनाए रखना
  alternative: ‘कोनों’ और ‘तले’ जैसे सामान्यीकृत शब्द
  rationale: पद अभिषेक-विधि की ठोस क्रियाओं और वेदी के विशिष्ट भागों का वर्णन करता है; इन शब्दों को बनाए रखने से पाठ का अनुष्ठानिक और धर्मवैचारिक स्वर बिना अतिरिक्त व्याख्या के सुरक्षित रहता है।
- issue: כָּל הַדָּם का प्रसंगगत आशय
  choice: ‘बाकी सारा लहू’
  alternative: ‘सारा लहू’
  rationale: आरम्भ में लहू का कुछ भाग सींगों पर लगाया जाता है, इसलिए बाद का ‘सारा लहू’ स्वाभाविक रूप से शेष मात्रा को सूचित करता है। ‘बाकी’ आशय स्पष्ट करता है, मात्रा को बदलता नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज विधि-निर्देशात्मक रूप। ‘लहू’ बलिदान-संबंधी प्रसंग में स्वाभाविक और बाइबलीय है; ‘वेदी’, ‘सींग’ और ‘आधार’ मूल की ठोस उपासना-संबंधी शब्दावली को सुरक्षित रखते हैं।
