base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/032.yaml
  text: Aaron and his sons shall eat the flesh of the ram and the bread that is in the basket at the entrance of the tent of meeting[a].
translation:
  language: hi
  text: हारून और उसके पुत्र मेढ़े का मांस[a] और टोकरी में जो रोटी है, उसे मिलाप के तम्बू के प्रवेश-द्वार पर खाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द का शाब्दिक अर्थ ‘मांस’ है; बलिदान के संदर्भ में यह खाने योग्य मांस को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָכַל
  choice: खाएँ
  rationale: अनुष्ठान-संबंधी निर्देश में यह रूप विधिसूचक भाव रखता है। हिंदी का आदरसूचक बहुवचन ‘खाएँ’ हारून और उसके पुत्रों के संयुक्त कर्ता तथा निर्देशात्मक बल—दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אַהֲרֹן וּבָנָיו
  choice: हारून और उसके पुत्र
  rationale: ‘पुत्र’ यहाँ हारून के उन पुरुष वंशजों को सूचित करता है जो याजकीय अभिषेक-विधि में सहभागी हैं; इसलिए व्यापक ‘सन्तान’ की अपेक्षा यह अधिक सटीक है।
- source_word: בְּשַׂר הָאַיִל
  choice: मेढ़े का मांस
  rationale: בשר का मूल अर्थ ‘देह/मांस’ है, और बलिदान के इस संदर्भ में खाने योग्य मांस अभिप्रेत है। आधुनिक हिंदी में ‘मांस’ स्वाभाविक और सटीक है।
- source_word: הַלֶּחֶם אֲשֶׁר בַּסָּל
  choice: टोकरी में रखी रोटी
  rationale: यह अभिव्यक्ति टोकरी में स्थित रोटी की पहचान कराती है। ‘रखी’ हिंदी में स्थान-संबंध को सहजता से व्यक्त करता है, बिना यह अर्थ जोड़े कि रोटी टोकरी से निकाल ली गई थी।
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: मिलापवाले तम्बू के द्वार पर
  rationale: यह हिंदी बाइबलीय परंपरा में परिचित पद है और פתח के स्थानवाचक अर्थ ‘द्वार/प्रवेश-स्थान पर’ को स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: याजकीय संदर्भ में पुरुष-सूचक भाषा
  choice: उसके पुत्र
  alternative: उसकी सन्तान
  rationale: यहाँ संदर्भ हारून के अभिषिक्त पुरुष याजकीय वंशजों का है; ‘पुत्र’ मूल पाठ के विशिष्ट संकेत को सुरक्षित रखता है।
- issue: अनुष्ठानिक निर्देश का क्रियाबल
  choice: खाएँ
  alternative: खाएँगे / खाना चाहिए
  rationale: मूल इब्रानी रूप इस विधिक-अनुष्ठानिक संदर्भ में निर्देशात्मक है। ‘खाएँ’ इसे स्वाभाविक हिंदी में व्यक्त करता है, जबकि ‘खाएँगे’ केवल भविष्यवाणी और ‘खाना चाहिए’ अपेक्षाकृत कमजोर सलाह का भाव दे सकता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘मिलापवाला तम्बू’ परिचित धार्मिक पदावली है; वाक्यक्रम ऐसा रखा गया है कि भोजन की वस्तुएँ और भोजन का स्थान स्पष्ट रहें।
