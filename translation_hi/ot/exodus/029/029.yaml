  yaml_path: translation/ot/exodus/029/029.yaml
  text: And the holy garments that are Aaron’s shall belong to his sons after him[a], for anointing in them and for ordaining them in them.
translation:
  language: hi
  text: और हारून के पवित्र वस्त्र हारून के बाद उसके पुत्रों के होंगे, ताकि उन वस्त्रों को पहने हुए उनका अभिषेक किया जाए और उन्हें याजकपद पर नियुक्त किया जाए।[क]
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: 'शाब्दिक: “उनके हाथ भरने के लिए।” यह याजकों को पद पर विधिवत स्थापित करने का इब्रानी मुहावरा है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִגְדֵי הַקֹּדֶשׁ
  choice: पवित्र वस्त्र
  rationale: यह पदबंध याजकीय सेवा के लिए अलग किए गए वस्त्रों को दर्शाता है; ‘पवित्र वस्त्र’ स्वाभाविक और अर्थनिष्ठ हिन्दी है।
- source_word: אֲשֶׁר לְאַהֲרֹן
  choice: हारून के
  rationale: यहाँ לְ संबंध अथवा अधिकार प्रकट करता है; हिन्दी में संबंधकारक ‘के’ इसे सहज रूप से व्यक्त करता है।
- source_word: יִהְיוּ לְבָנָיו אַחֲרָיו
  choice: उसके बाद उसके पुत्रों के लिए होंगे
  rationale: यह वाक्यांश हारून के बाद उसके पुत्रों द्वारा इन वस्त्रों के उत्तराधिकार और याजकीय उपयोग को व्यक्त करता है, बिना ‘बेटे’ शब्द को केवल तत्काल पुत्रों से अधिक स्पष्ट किए।
- source_word: לְמָשְׁחָה בָהֶם
  choice: उन्हें वे वस्त्र पहनाकर उनका अभिषेक किया जाए
  rationale: בָהֶם का आशय वस्त्र पहने हुए अभिषेक होना है, वस्त्रों को अभिषेक का साधन बनाना नहीं। हिन्दी में यह रूप उस परिस्थितिजन्य अर्थ को स्वाभाविक ढंग से स्पष्ट करता है।
- source_word: וּלְמַלֵּא בָם אֶת־יָדָם
  choice: और उन्हें याजकपद पर नियुक्त किया जाए
  rationale: ‘उनका हाथ भरना’ एक तकनीकी इब्रानी मुहावरा है जिसका अर्थ याजकीय पद पर प्रतिष्ठित या नियुक्त करना है। शाब्दिक हिन्दी अस्पष्ट होती, इसलिए कार्यगत अर्थ मुख्य पाठ में दिया गया है।
theological_decisions:
- issue: याजकीय प्रतिष्ठापन के मुहावरे מִלֵּא אֶת־יָד का अनुवाद
  choice: याजकपद पर नियुक्त किया जाए
  alternative: उनका हाथ भरा जाए; उनका संस्कार किया जाए
  rationale: यहाँ मुहावरा याजकीय पद पर विधिवत प्रतिष्ठापन को बताता है। ‘याजकपद पर नियुक्त’ आधुनिक पाठक के लिए स्पष्ट है और बाद की कलीसियाई ‘ordination’ शब्दावली को अनावश्यक रूप से आरोपित नहीं करता।
- issue: בָהֶם का दोनों क्रियाओं से संबंध
  choice: अभिषेक के साथ वस्त्र पहनने का भाव स्पष्ट किया गया; नियुक्ति उसी अनुष्ठानिक संदर्भ में समझी गई
  alternative: दोनों खंडों में ‘इनमें’ को शब्दशः दोहराना
  rationale: इब्रानी में सर्वनाम दोनों समानांतर खंडों में आता है, पर हिन्दी में ‘उन्हें वे वस्त्र पहनाकर’ पूरे संयुक्त प्रयोजन को स्वाभाविक रूप से नियंत्रित करता है और वस्त्रों को अभिषेक का उपकरण समझने से रोकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। वाक्य की उत्तराधिकार-संबंधी संरचना रखी गई है, जबकि अपारदर्शी याजकीय मुहावरे का अर्थ मुख्य पाठ में स्पष्ट किया गया है।
