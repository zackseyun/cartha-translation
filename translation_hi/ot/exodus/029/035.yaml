base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/035.yaml
  text: And you shall do thus for Aaron and for his sons[a], according to all that I have commanded you. Seven days you shall ordain them.
translation:
  language: hi
  text: हारून और उसके पुत्रों के लिए वही करना जो कुछ मैंने तुम्हें आज्ञा दी है। सात दिन तक उन्हें याजक-पद पर नियुक्त करना[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उनके हाथ भरना”; यह किसी को याजक की सेवा में विधिवत नियुक्त करने का इब्रानी मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: करना
  rationale: निर्देशों की इस शृंखला में संयोजक के साथ आया पूर्ण क्रियारूप आज्ञार्थक भाव व्यक्त करता है; आधुनिक हिन्दी में ‘करना’ स्वाभाविक और स्पष्ट निर्देश है।
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: हारून और उसके पुत्रों के लिए
  rationale: दोहराया गया לְ बताता है कि अनुष्ठान हारून और उसके पुत्रों के संबंध में किया जाना है; ‘के लिए’ इस भाव को सहज हिन्दी में रखता है।
- source_word: כָּכָה
  choice: ठीक वैसा ही
  rationale: यह संकेतवाचक क्रियाविशेषण पहले बताए गए अनुष्ठान की रीति की ओर लौटता है; ‘ठीक वैसा ही’ समानता और निर्देश की निश्चितता दोनों व्यक्त करता है।
- source_word: כְּכֹל אֲשֶׁר צִוִּיתִי אֹתָכָה
  choice: जैसा मैंने तुम्हें आज्ञा दी है
  rationale: यह अनुवाद पूर्ववर्ती सभी आदेशों के अनुरूप कार्य करने का भाव स्वाभाविक हिन्दी में व्यक्त करता है; ‘ठीक वैसा ही’ के साथ मिलकर כְּכֹל की समग्रता भी बनी रहती है।
- source_word: שִׁבְעַת יָמִים
  choice: सात दिन तक
  rationale: यह अवधि सूचक पद है; ‘सात दिन तक’ हिन्दी में अनुष्ठान की पूरी कालावधि स्पष्ट करता है।
- source_word: תְּמַלֵּא יָדָם
  choice: उन्हें याजक-पद पर नियुक्त करना
  rationale: ‘उनका हाथ भरना’ याजकीय सेवा में विधिवत स्थापित करने का इब्रानी मुहावरा है। अर्थानुवाद सामान्य पाठक के लिए स्पष्ट है और पद का याजकीय संदर्भ बनाए रखता है।
theological_decisions:
- issue: מלא יד याजकीय मुहावरे का अनुवाद
  choice: उन्हें याजक-पद पर नियुक्त करना
  alternative: उनके हाथ भरना; उनका संस्कार करना; उन्हें प्रतिष्ठित करना
  rationale: शाब्दिक रूप आधुनिक हिन्दी में अस्पष्ट होगा। ‘याजक-पद पर नियुक्त करना’ यहाँ पद-स्थापन का आशय स्पष्ट करता है, बिना किसी बाद की संप्रदायगत अभिषेक-पद्धति को पाठ में आरोपित किए; शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण निर्देशात्मक रूप अपनाया गया है। परमेश्वर द्वारा मूसा को दिए गए एकवचन निर्देश को हिन्दी में स्वाभाविक ‘तुम्हें’ और क्रियामूलक आज्ञा ‘करना’ से व्यक्त किया गया है।
