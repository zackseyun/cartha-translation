  naturalness: ‘इस्राएल के पुत्रों से मिलूँगा’ is natural modern Hindi. ‘मेरी महिमा से पवित्र किया जाएगा’ is clear, retains the passive force, and avoids the somewhat cumbersome ‘महिमा के द्वारा।’
  terminology: ‘इस्राएल के पुत्र’ appropriately preserves בני ישראל, with the idiomatic collective equivalent in a note. ‘महिमा’ and ‘पवित्र किया जाएगा’ accurately convey כבוד and the Niphal of קדש.
