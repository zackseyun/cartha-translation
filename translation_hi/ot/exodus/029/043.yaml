  text: וְ/נֹעַדְתִּ֥י שָׁ֖מָּ/ה לִ/בְנֵ֣י יִשְׂרָאֵ֑ל וְ/נִקְדַּ֖שׁ בִּ/כְבֹדִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/043.yaml
  text: There I will meet with the sons of Israel[b][a], and it will be sanctified by my glory.
translation:
  language: hi
  text: वहाँ मैं इस्राएल के पुत्रों[a] से मिलूँगा, और वह मेरी महिमा से पवित्र किया जाएगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् ‘इस्राएली’ या ‘इस्राएल के लोग।’ इब्रानी में शाब्दिक रूप से ‘इस्राएल के पुत्र’ है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में ‘पवित्र किया जाएगा’ का कर्ता व्यक्त नहीं है। ‘वह’ सामान्यतः यहाँ वर्णित पवित्रस्थान-क्षेत्र की ओर संकेत करता है, अथवा विशेष रूप से मिलापवाले तंबू या वेदी की ओर।
    reason: alternative_reading
lexical_decisions:
- source_word: וְנֹעַדְתִּי
  choice: मैं ... मिला करूँगा
  rationale: יעד के निफ़ाल रूप का अर्थ इस पवित्रस्थान-संदर्भ में नियत भेंट करना है। ‘मिला करूँगा’ निरंतर/नियत भेंट के भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: שָׁמָּה
  choice: वहाँ
  rationale: यह स्थानवाचक क्रियाविशेषण पिछले संदर्भ में बताए गए मिलापवाले तंबू के स्थान की ओर संकेत करता है।
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों से
  rationale: ל यहाँ יעד के निफ़ाल रूप के साथ भेंट के सहभागी को दर्शाता है। ‘इस्राएल के पुत्र’ मूल इब्रानी वाचा-संबंधी अभिव्यक्ति को बनाए रखता है।
- source_word: וְנִקְדַּשׁ
  choice: वह स्थान ... पवित्र ठहरेगा
  rationale: קדש का निफ़ाल रूप पवित्र किए जाने अथवा पवित्र सिद्ध होने का निष्क्रिय भाव देता है। हिन्दी में अनिर्दिष्ट ‘वह’ असहज है, इसलिए ‘वह स्थान’ संदर्भगत अनिश्चितता को यथासंभव बनाए रखते हुए स्वाभाविक है।
- source_word: בִּכְבֹדִי
  choice: मेरी महिमा के द्वारा
  rationale: 'בְּ को करणवाचक समझना उचित है: यहोवा की प्रकट महिमा उस स्थान को पवित्र करने का माध्यम है।'
theological_decisions:
- issue: וְנִקְדַּשׁ का अंतर्निहित कर्ता
  choice: ‘वह स्थान’—सामान्य रूप से संदर्भ में आया पवित्रस्थान-क्षेत्र
  alternative: विशेष रूप से मिलापवाला तंबू; वेदी; अथवा हारून
  rationale: इब्रानी क्रिया पुल्लिंग एकवचन है, पर इस पद में उसका कर्ता व्यक्त नहीं है। किसी एक वस्तु को निश्चित करना मूल की अस्पष्टता को मिटा देता; ‘वह स्थान’ तंबू/वेदी/पवित्रस्थान के संदर्भ को खुला रखता है।
- issue: בְּנֵי יִשְׂרָאֵל का रूपांतरण
  choice: इस्राएल के पुत्र
  alternative: इस्राएली; इस्राएल के लोग
  rationale: यह मानक वाचा-संबंधी जातिनाम है। औपचारिक पारदर्शिता के लिए मूल अभिव्यक्ति मुख्य पाठ में रखी गई है और स्वाभाविक सामूहिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘इस्राएल के पुत्र’ मूल वाचा-संबंधी पदावली को संरक्षित करता है; ‘पवित्र ठहरेगा’ निष्क्रिय पवित्रीकरण के भाव को स्वाभाविक हिन्दी में देता है।
