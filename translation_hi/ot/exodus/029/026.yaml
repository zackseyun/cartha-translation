  text: וְ/לָקַחְתָּ֣ אֶת הֶֽ/חָזֶ֗ה מֵ/אֵ֤יל הַ/מִּלֻּאִים֙ אֲשֶׁ֣ר לְ/אַהֲרֹ֔ן וְ/הֵנַפְתָּ֥ אֹת֛/וֹ תְּנוּפָ֖ה לִ/פְנֵ֣י יְהוָ֑ה וְ/הָיָ֥ה לְ/ךָ֖ לְ/מָנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/026.yaml
  text: Then you shall take the breast from the ram of ordination that is for Aaron[a], and you shall wave it as a wave offering before Yahweh; and it shall be your portion.
translation:
  language: hi
  text: फिर हारून के लिए नियुक्ति के मेढ़े की छाती लो और उसे याहवे के सामने लहराने की भेंट के रूप में लहराओ; वह तुम्हारा भाग होगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶחָזֶה
  choice: छाती
  rationale: बलिदान-संबंधी प्रसंग में यह पशु की छाती के उस विशेष भाग को दर्शाता है जो याजकीय विधान में नियत किया गया है।
- source_word: אֵיל הַמִּלֻּאִים
  choice: याजक-पद पर नियुक्ति के संस्कार वाला मेढ़ा
  rationale: यह हारून को याजकीय पद पर स्थापित करने के अनुष्ठान में प्रयुक्त मेढ़े का तकनीकी नाम है। यह अनुवाद पद-स्थापना और संस्कार, दोनों पहलुओं को स्पष्ट करता है।
- source_word: אֲשֶׁר לְאַהֲרֹן
  choice: हारून के ... वाला
  rationale: यह उस विशेष मेढ़े को हारून के नियुक्ति-संस्कार से जोड़ता है, बिना उसे केवल हारून की संपत्ति बताने के।
- source_word: וְהֵנַפְתָּ אֹתוֹ תְּנוּפָה
  choice: उसे ... हिलाकर भेंट करना
  rationale: क्रिया और उसी मूल की संज्ञा से बना इब्रानी अनुष्ठानिक पद वस्तु को हिलाकर परमेश्वर के सामने अर्पित करने की क्रिया बताता है। सहज हिन्दी में क्रिया को स्पष्ट रखा गया है।
- source_word: לִפְנֵי יְהוָה
  choice: याहवे के सामने
  rationale: לִפְנֵי का उपासना-संबंधी अर्थ ‘के सामने’ है और יהוה को उसके व्यक्तिगत नाम ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: וְהָיָה לְךָ לְמָנָה
  choice: वह तुम्हारा भाग होगा
  rationale: מָנָה नियत हिस्से या भाग को दर्शाता है; ‘तुम्हारा भाग’ संक्षिप्त और स्वाभाविक हिन्दी है।
- source_word: וְלָקַחְתָּ ... וְהֵנַפְתָּ ... וְהָיָה
  choice: लेना ... भेंट करना; ... होगा
  rationale: विधिक निर्देश की आज्ञार्थक शक्ति को आधुनिक हिन्दी के स्वाभाविक निर्देशात्मक रूप में व्यक्त किया गया है।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम יהוה है। ‘याहवे’ उसका प्रत्यक्ष लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
- issue: הַמִּלֻּאִים का याजकीय तकनीकी अर्थ
  choice: याजक-पद पर नियुक्ति का संस्कार
  alternative: समर्पण-संस्कार; अभिषेक-संस्कार
  rationale: इस प्रसंग में हारून को याजकीय पद पर स्थापित किया जा रहा है। चुना हुआ रूप पद-स्थापना का आशय स्पष्ट करता है, जबकि वैध वैकल्पिक अर्थ पाद-टिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण निर्देशात्मक शैली अपनाई गई है। एकवचन संबोधन के लिए ‘तुम’ रखा गया है; तकनीकी अनुष्ठानिक भाषा को समझने योग्य बनाया गया है, पर उसका याजकीय आशय बनाए रखा गया है।
