  text: וְ/אֵת֙ הַ/כֶּ֣בֶשׂ הַ/שֵּׁנִ֔י תַּעֲשֶׂ֖ה בֵּ֣ין הָ/עַרְבָּ֑יִם כְּ/מִנְחַ֨ת הַ/בֹּ֤קֶר וּ/כְ/נִסְכָּ/הּ֙ תַּֽעֲשֶׂה לָּ֔/הּ לְ/רֵ֣יחַ נִיחֹ֔חַ אִשֶּׁ֖ה לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/041.yaml
  text: And you shall offer the second lamb at twilight[a]; you shall offer for it its grain offering and its drink offering, as in the morning, as a pleasing aroma[b], a food offering to Yahweh.
translation:
  language: hi
  text: और दूसरे मेमने को तुम साँझ के समय[a] चढ़ाओ। जैसे प्रातःकाल की अन्नबलि और उसकी पेय-भेंट चढ़ाई जाती है, वैसे ही उसके लिए अन्नबलि और पेय-भेंट चढ़ाओ; यह यहोवा के लिए सुखद सुगंध देने वाली अग्नि-भेंट होगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, ‘दो साँझों के बीच’; अर्थात देर दोपहर या गोधूलि का समय।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֶּבֶשׂ הַשֵּׁנִי
  choice: दूसरे मेमने
  rationale: כֶּבֶשׂ बलि के योग्य मेमने या कम उम्र की भेड़ को दर्शाता है; पिछले पद के पहले मेमने के क्रम में ‘दूसरे मेमने’ स्वाभाविक है।
- source_word: תַּעֲשֶׂה
  choice: चढ़ाना
  rationale: क्रिया का मूल अर्थ ‘करना/बनाना’ है, पर बलिदान-संबंधी प्रसंग में हिन्दी का स्वाभाविक अर्थ ‘चढ़ाना’ है।
- source_word: בֵּין הָעַרְבָּיִם
  choice: साँझ के समय
  rationale: शाब्दिक रूप से ‘दो साँझों के बीच’; यह देर दोपहर से गोधूलि तक के समय का इब्रानी मुहावरा है। शाब्दिक रूप पादटिप्पणी में रखा गया है।
- source_word: מִנְחַת הַבֹּקֶר
  choice: प्रातःकाल के अन्नबलि
  rationale: इस याजकीय प्रसंग में מִנְחָה पशुबलि के साथ चढ़ाया जाने वाला अन्नबलि है।
- source_word: נִסְכָּהּ
  choice: उसके पेय-भेंट
  rationale: נֶסֶךְ उँडेली जाने वाली पेय-भेंट है; ‘पेय-भेंट’ आधुनिक पाठक के लिए ‘अर्घ’ की अपेक्षा अधिक पारदर्शी है। स्त्रीलिंग प्रत्यय निकटवर्ती प्रातःकालीन अन्नबलि से संबद्ध समझा गया है।
- source_word: לְרֵיחַ נִיחֹחַ
  choice: सुखद सुगंध के रूप में
  rationale: स्थिर बलिदानी पदबंध परमेश्वर को स्वीकार्य सुगंध का रूपक रखता है; अनुवाद इसे बिना व्याख्यात्मक विस्तार के बनाए रखता है।
- source_word: אִשֶּׁה
  choice: आग में चढ़ाई जाने वाली भेंट
  rationale: यह बलिदानी पारिभाषिक शब्द परंपरागत रूप से आग पर चढ़ाई गई भेंट को दर्शाता है; सम्भावित वैकल्पिक व्युत्पत्ति पादटिप्पणी में सुरक्षित है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: मूल पाठ में वाचा का विशिष्ट नाम יהוה है; हिन्दी में उसका प्रचलित प्रतिलेखन ‘यहोवा’ नाम को स्पष्ट रूप से सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में सामान्य उपाधि नहीं, चार अक्षरों वाला विशिष्ट वाचा-नाम है; इसलिए नाम को उपाधि से बदलने के बजाय हिन्दी के परिचित रूप में रखा गया है।
- issue: אִשֶּׁה का बलिदानी अर्थ
  choice: आग में चढ़ाई जाने वाली भेंट
  alternative: भोजन-भेंट
  rationale: शब्द की व्युत्पत्ति और अर्थ पर वास्तविक शाब्दिक अनिश्चितता है। मुख्य पाठ पारंपरिक अग्नि-संबंधी अर्थ देता है, जबकि वैकल्पिक समझ को पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘अन्नबलि’ स्थापित बलिदानी शब्द है, जबकि ‘पेय-भेंट’ अर्थ को सहज बनाता है। आज्ञार्थक शैली और मूल वाक्य की बलिदानी पुनरावृत्ति सुरक्षित रखी गई है।
