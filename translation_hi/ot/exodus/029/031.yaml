  yaml_path: translation/ot/exodus/029/031.yaml
  text: And you shall take the ram of ordination and boil its flesh in a holy place[a][b].
translation:
  language: hi
  text: तू प्रतिष्ठा-संस्कार के मेढ़े[a] को ले और उसका मांस किसी पवित्र स्थान में उबाल[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “समर्पण-संस्कार के मेढ़े।” इब्रानी शब्द याजकों को उनके पद पर स्थापित करने की विधि को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: या, “पवित्र-स्थान में,” यदि इसे विशिष्ट पवित्र कक्ष के रूप में समझा जाए; पर इब्रानी का अधिक सीधा अर्थ “किसी पवित्र स्थान में” है।
    reason: alternative_reading
lexical_decisions:
- source_word: אֵיל
  choice: मेढ़ा
  rationale: बलि के पशु के लिए אֵיל का मानक और स्वाभाविक हिन्दी अर्थ ‘मेढ़ा’ है।
- source_word: הַמִּלֻּאִים
  choice: अभिषेक-संस्कार का
  rationale: याजकीय स्थापना के इस संदर्भ में מִלֻּאִים पद ग्रहण कराने वाले समर्पण-संस्कार को सूचित करता है। ‘अभिषेक-संस्कार’ आधुनिक हिन्दी में इस विधिक अर्थ को स्पष्ट करता है; वैकल्पिक ‘प्रतिष्ठा-संस्कार’ पादटिप्पणी में दिया गया है।
- source_word: תִּקָּח
  choice: तू ... लेना
  rationale: द्वितीय पुरुष एकवचन के निर्देशात्मक अपूर्ण रूप को हिन्दी की स्वाभाविक विधिसूचक रचना में रखा गया है।
- source_word: וּבִשַּׁלְתָּ
  choice: और ... उबालना
  rationale: בשׁל यहाँ तरल में पकाने, अर्थात उबालने, को सूचित करता है; इसलिए व्यापक ‘पकाना’ की अपेक्षा ‘उबालना’ अधिक सटीक है।
- source_word: בְּשָׂרוֹ
  choice: उसका मांस
  rationale: בשר का प्रसंगानुकूल, सहज हिन्दी रूप ‘मांस’ है और सर्वनाम मेढ़े की ओर संकेत करता है।
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: किसी पवित्र स्थान में
  rationale: मूल वाक्यांश में निश्चित उपपद नहीं है; ‘किसी पवित्र स्थान में’ अनिश्चित अर्थ को स्वाभाविक हिन्दी में सुरक्षित रखता है और इसे तम्बू के विशिष्ट ‘पवित्र-स्थान’ तक सीमित नहीं करता।
theological_decisions:
- issue: याजकीय स्थापना के संदर्भ में הַמִּלֻּאִים का तकनीकी अर्थ
  choice: अभिषेक-संस्कार का मेढ़ा
  alternative: प्रतिष्ठा-संस्कार का मेढ़ा
  rationale: दोनों रूप याजकों को पद पर स्थापित और समर्पित करने की विधि व्यक्त कर सकते हैं। मुख्य पाठ में ‘अभिषेक-संस्कार’ सामान्य पाठक के लिए अधिक परिचित है, जबकि वैकल्पिक तकनीकी अभिव्यक्ति पादटिप्पणी में सुरक्षित है।
- issue: क्या בְּמָקוֹם קָדֹשׁ सामान्य पवित्र स्थान है या तम्बू का विशिष्ट ‘पवित्र-स्थान’
  choice: किसी पवित्र स्थान में
  alternative: पवित्र-स्थान में
  rationale: इब्रानी की अनिश्चित रचना किसी विशेष कक्ष की पहचान अनिवार्य नहीं करती। अतः मुख्य पाठ उस स्थान को आवश्यकता से अधिक विशिष्ट नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण और निर्देशात्मक शैली। आसपास के विधिक संबोधन के अनुरूप एकवचन ‘तू’ रखा गया है। ‘अभिषेक-संस्कार’ तकनीकी अर्थ को सामान्य पाठक के लिए स्पष्ट करता है, और स्थानवाचक अनिश्चितता को ‘किसी’ द्वारा सुरक्षित रखा गया है।
