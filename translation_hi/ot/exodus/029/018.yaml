  text: And you shall burn the whole ram on the altar[a]. It is a burnt offering to Yahweh, a pleasing aroma[b], a food offering to Yahweh.
translation:
  language: hi
  text: और तुम पूरे मेढ़े को वेदी पर जलाकर चढ़ा देना। वह याहवे के लिए होमबलि है—एक सुखदायक सुगंध[a], याहवे के लिए अग्नि-भेंट[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मनभावनी सुगंध।’ यह इब्रानी अभिव्यक्ति बलिदान के लिए प्रयुक्त एक निश्चित सूत्र है, जो याहवे को स्वीकार्य भेंट का संकेत देती है।
    reason: lexical_alternative
  - marker: b
    text: या ‘भोजन-भेंट।’ इब्रानी शब्द का सटीक व्युत्पत्तिगत अर्थ अनिश्चित है; इसका अनुवाद प्रायः ‘आग से चढ़ाई गई भेंट’ भी किया जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטַרְתָּ
  choice: और तुम ... जलाकर चढ़ाना
  rationale: हिफ़ील रूप बलि को वेदी पर जलाकर उसका धुआँ ऊपर चढ़ाने को दर्शाता है। ‘जलाकर चढ़ाना’ आधुनिक हिन्दी में स्वाभाविक है और बलिदान-संबंधी अर्थ बनाए रखता है।
- source_word: כָּל־הָאַיִל
  choice: पूरे मेढ़े को
  rationale: כָּל यहाँ इस बात पर बल देता है कि मेढ़े का केवल एक भाग नहीं, बल्कि पूरा पशु चढ़ाया जाए; אַיִל का विशिष्ट अर्थ ‘मेढ़ा’ है।
- source_word: הַמִּזְבֵּחָה
  choice: वेदी पर
  rationale: दिशासूचक प्रत्यय वेदी की ओर ले जाकर चढ़ाने का भाव देता है; इस क्रिया के संदर्भ में स्वाभाविक हिन्दी ‘वेदी पर’ है।
- source_word: עֹלָה
  choice: होमबलि
  rationale: यह उस बलि का प्रचलित हिन्दी नाम है जो पूरी तरह जलाकर चढ़ाई जाती थी; इससे स्थापित बलिदान-संबंधी अर्थ संक्षेप में स्पष्ट होता है।
- source_word: לַיהוָה
  choice: याहवे के लिए
  rationale: ל समर्पण अथवा संबंध व्यक्त करता है और יהוה को उसके व्यक्तिगत वाचा-नाम के रूप में ‘याहवे’ लिखा गया है।
- source_word: רֵיחַ נִיחוֹחַ
  choice: एक सुखदायक सुगंध
  rationale: यह स्थिर बलिदान-सूत्र परमेश्वर को स्वीकार्य भेंट का संकेत देता है। ‘सुखदायक सुगंध’ मूल अभिव्यक्ति के चित्रात्मक और स्वीकार्यता-संबंधी दोनों भावों को बनाए रखती है।
- source_word: אִשֶּׁה
  choice: अग्नि-भेंट
  rationale: शब्द की व्युत्पत्ति विवादित है, पर इस प्रसंग में आग के द्वारा चढ़ाई गई भेंट का पारंपरिक अर्थ स्पष्ट है। ‘अग्नि-भेंट’ संक्षिप्त है और मूल की अस्पष्टता को ‘भोजन-भेंट’ कहकर अनावश्यक रूप से नहीं सुलझाता।
- source_word: הוּא
  choice: वह ... है
  rationale: सर्वनाम मेढ़े अथवा चढ़ाई गई बलि की पहचान बताने वाला विधेयात्मक रूप है; हिन्दी में ‘वह ... है’ स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसका व्यापक रूप से स्वीकृत आधुनिक लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: רֵיחַ נִיחוֹחַ का भाव
  choice: सुखदायक सुगंध
  alternative: मनभावनी सुगंध / शांति देने वाली सुगंध
  rationale: स्थिर बलिदान-सूत्र को चित्रात्मक रूप में रखा गया है, पर इससे परमेश्वर की स्वीकृति का भाव समझा जाता है; पाठ में यह अतिरिक्त सिद्धांत नहीं जोड़ा गया कि भेंट ने क्रोधित परमेश्वर को शांत किया।
- issue: אִשֶּׁה की विवादित व्याख्या
  choice: अग्नि-भेंट
  alternative: भोजन-भेंट
  rationale: शब्द को ‘भोजन’ से जोड़ना एक संभव विश्लेषण है, किंतु निश्चित नहीं। इसलिए मुख्य पाठ में आग से चढ़ाई गई भेंट का अधिक पारंपरिक और प्रसंग-संगत रूप रखा गया तथा विकल्प पादटिप्पणी में दिया गया।
