  yaml_path: translation/ot/exodus/029/040.yaml
  text: and a tenth of fine flour mixed with a quarter of a hin of beaten oil[a], and a drink offering of a quarter of a hin of wine[c][b], for the one lamb.
translation:
  language: hi
  text: और उस एक मेम्ने के लिए एपा का दसवाँ भाग मैदा, जो कूटे हुए तेल के एक चौथाई हीन के साथ मिला हुआ हो,[a] और एक चौथाई हीन दाखरस की पेय-भेंट चढ़ाना।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “कूटा हुआ तेल” जैतूनों को कूटकर निकाला गया तेल है; इसका अनुवाद “दबा हुआ तेल” भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “एक मेम्ने के लिए।” संदर्भ में यह दो दैनिक मेम्नों में से पहले मेम्ने की ओर संकेत कर सकता है, पर मूल पाठ में “पहला” शब्द नहीं है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְעִשָּׂרֹן סֹלֶת
  choice: एपा का दसवाँ भाग मैदा
  rationale: עִשָּׂרוֹן बलिदान-संबंधी संदर्भ में एपा के दसवें भाग की मानक मात्रा है; हिंदी पाठक के लिए निहित इकाई स्पष्ट की गई है। סֹלֶת के लिए प्रचलित और सहज 'मैदा' चुना गया।
- source_word: בָּלוּל בְּשֶׁמֶן כָּתִית
  choice: कूटे हुए जैतून के ... तेल में मिला हुआ
  rationale: בָּלוּל तेल के साथ मिलाने को और כָּתִית जैतूनों को कूटकर निकाले गए तेल को बताता है। 'जैतून' मूल में निहित उत्पादन-संदर्भ को साधारण पाठक के लिए स्पष्ट करता है।
- source_word: רֶבַע הַהִין
  choice: एक चौथाई हीन
  rationale: प्राचीन द्रव-माप को आधुनिक अनुमान में बदलने के बजाय मूल इकाई 'हीन' और ठीक अनुपात सुरक्षित रखा गया है।
- source_word: וְנֵסֶךְ
  choice: और अर्घ के रूप में ... चढ़ाना
  rationale: נֶסֶךְ उंडेली जाने वाली पेय-भेंट का तकनीकी शब्द है। 'अर्घ' संक्षिप्त और गरिमापूर्ण है, जबकि 'के रूप में ... चढ़ाना' क्रिया-संबंध को हिंदी में स्पष्ट करता है।
- source_word: יָיִן
  choice: दाखमधु
  rationale: यह יַיִן का स्वाभाविक, गरिमापूर्ण बाइबलीय हिंदी समतुल्य है और मदिरा के प्रकार को स्पष्ट करता है।
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: एक मेम्ने के साथ
  rationale: मूल के निश्चित पदबंध को अस्वाभाविक 'उस एक मेम्ने' बनाने के बजाय संदर्भानुकूल हिंदी दी गई है; इसे 'पहले मेम्ने' कहकर संदर्भगत अर्थ को पाठ में निर्णायक रूप से नहीं जोड़ा गया।
theological_decisions:
- issue: לַכֶּבֶשׂ הָאֶחָד में मेम्ने की पहचान
  choice: एक मेम्ने के साथ
  alternative: पहले मेम्ने के साथ
  rationale: आसपास के पदों में दो दैनिक मेम्ने हैं, इसलिए पहला मेम्ना आशय हो सकता है; फिर भी इस पद में 'पहला' शब्द प्रत्यक्ष नहीं है, अतः मुख्य पाठ मूल की अस्पष्टता बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज किंतु उपासना-संबंधी गरिमापूर्ण शैली रखी गई है। प्राचीन माप 'एपा' और 'हीन' सुरक्षित हैं; निहित 'एपा' स्पष्ट किया गया है। मुख्य पाठ में केवल एक आवश्यक शब्दार्थ-संबंधी पादटिप्पणी रखी गई है।
