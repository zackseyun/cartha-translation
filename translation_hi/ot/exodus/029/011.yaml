lexical_decisions:
- source_word: וְשָׁחַטְתָּ
  choice: और ... बलि करना
  rationale: निर्देशों की क्रमिक शृंखला में संयोजक सहित क़ाल पूर्ण क्रिया आदेश का भाव देती है। बलिदान-संदर्भ में हिंदी का ‘बलि करना’ सामान्य ‘मारना’ की अपेक्षा अधिक सटीक और स्वाभाविक है।
- source_word: הַפָּר
  choice: उस बैल को
  rationale: פַּר बलिदान-संदर्भ में बैल को सूचित करता है; निश्चित पद के कारण ‘उस बैल’ पूर्वोक्त पशु की ओर संकेत करता है।
- source_word: לִפְנֵי יְהוָה
  choice: यहोवा के सामने
  rationale: לִפְנֵי का स्थानगत और उपासना-संबंधी भाव ‘के सामने’ से स्पष्ट रहता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिंदी बाइबल-परंपरा में प्रचलित रूप ‘यहोवा’ मूल चतुरक्षरीय दिव्य नाम को उपाधि से बदलने के बजाय व्यक्तिगत नाम के रूप में प्रस्तुत करता है।
- source_word: פֶּתַח
  choice: प्रवेश-द्वार पर
  rationale: यह शब्द प्रवेश या द्वार-स्थान को सूचित करता है; ‘प्रवेश-द्वार पर’ अनुष्ठान के स्थान को स्पष्ट और स्वाभाविक ढंग से बताता है।
- source_word: אֹהֶל מוֹעֵד
  choice: मिलापवाला तम्बू
  rationale: यह निर्गमन में पवित्रस्थान का पारंपरिक और सामान्य हिंदी नाम है तथा लोगों के परमेश्वर से मिलने के नियत स्थान का भाव बनाए रखता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम सीधे आया है। ‘यहोवा’ आधुनिक हिंदी पाठकों में व्यापक रूप से पहचाना जाने वाला नामरूप है; पादटिप्पणी मूल व्यंजनरूप और अन्य प्रचलित प्रस्तुतियाँ बताती है।
