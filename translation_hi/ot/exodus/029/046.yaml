base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/046.yaml
  text: And they shall know that I am Yahweh their God[a], who brought them out from the land of Egypt so that I might dwell among them[b]. I am Yahweh their God.
translation:
  language: hi
  text: और वे जानेंगे कि मैं याहवे, उनका परमेश्वर हूँ[a], जो उन्हें मिस्र देश से निकाल लाया, ताकि मैं उनके बीच[b] निवास करूँ। मैं याहवे, उनका परमेश्वर हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं याहवे, उनका परमेश्वर हूँ, जो उन्हें उनके बीच निवास करने के लिए मिस्र देश से निकाल लाया।”
    reason: उद्देश्यवाचक इब्रानी infinitive के ‘ताकि मैं ... निवास करूँ’ के स्थान पर ‘... निवास करने के लिए’ वाला वैकल्पिक हिन्दी रूप दिखाने के लिए।
  - marker: b
    text: 'शाब्दिक अर्थ: “उनके मध्य में।”'
    reason: मूल इब्रानी मुहावरे בְּתוֹכָם के अधिक शाब्दिक रूप को बताने के लिए।
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: और वे जानेंगे
  rationale: संदर्भ में यह रूप आगामी परिणाम को व्यक्त करता है; यह आधुनिक हिन्दी में स्वाभाविक है और कथन की वाचा-संबंधी गंभीरता बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण द्वारा प्रस्तुत किया गया है।
- source_word: אֱלֹהֵיהֶם
  choice: उनका परमेश्वर
  rationale: यद्यपि संज्ञा का रूप बहुवचन-जैसा है, यहाँ यहोवा और वाचा के संदर्भ में अर्थ स्पष्टतः एकवचन है।
- source_word: הוֹצֵאתִי אֹתָם מֵאֶרֶץ מִצְרַיִם
  choice: उन्हें मिस्र देश से निकाल लाया
  rationale: यह निर्गमन की मानक अभिव्यक्ति को स्वाभाविक हिन्दी में रखता है और מִן के स्रोत-बोध को ‘से’ द्वारा व्यक्त करता है।
- source_word: לְשָׁכְנִי
  choice: इसलिए ... कि मैं ... निवास करूँ
  rationale: לְ के साथ infinitive construct यहाँ उद्देश्य बताता है; हिन्दी संरचना उस प्रयोजन को स्पष्ट और स्वाभाविक बनाती है।
- source_word: בְתוֹכָם
  choice: उनके बीच
  rationale: यह आधुनिक हिन्दी में स्वाभाविक है और समुदाय के भीतर परमेश्वर की उपस्थिति का मूल अर्थ सुरक्षित रखता है।
- source_word: אֲנִי יְהוָה אֱלֹהֵיהֶם
  choice: मैं यहोवा, उनका परमेश्वर हूँ
  rationale: यह मूल के बलयुक्त वाचा-सूत्र और उसके शब्दक्रम को पठनीय हिन्दी में बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत वाचा-नाम सीधे आया है। हिन्दी पाठकों में पहचाने जाने वाले ‘यहोवा’ को चुना गया है, न कि इसे केवल ‘प्रभु’ जैसी उपाधि से बदला गया है।
- issue: इस्राएल को मिस्र से निकालने का उद्देश्य
  choice: इसलिए निकाल लाया कि मैं उनके बीच निवास करूँ
  alternative: उन्हें मिस्र देश से निकाल लाया, उनके बीच निवास करने के लिए
  rationale: मूल का לְשָׁכְנִי उद्देश्य व्यक्त करता है; चुना हुआ पाठ छुटकारे और परमेश्वर के निवास के बीच के प्रयोजन-संबंध को स्पष्ट रखता है, बिना उससे आगे कोई धर्मवैज्ञानिक निष्कर्ष जोड़े।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘निवास करूँ’ पवित्रस्थान और दैवी उपस्थिति के प्रसंग के अनुकूल है; ‘रहूँ’ की तुलना में अधिक औपचारिक होते हुए भी सहज है।
