lexical_decisions:
- source_word: וְאֶת
  choice: फिर
  rationale: संयोजक וְ अगले समन्वित निर्देश को आगे बढ़ाता है, जबकि אֶת कर्म-सूचक है और हिंदी में अलग से अनूदित नहीं होता। इस क्रम में ‘फिर’ स्वाभाविक है।
- source_word: בָּנָיו
  choice: उसके पुत्रों को
  rationale: यह संज्ञा हारून के पुरुष वंशजों को निर्दिष्ट करती है; ‘पुत्रों’ से लिंग-विशिष्ट संदर्भ सुरक्षित रहता है।
- source_word: תַּקְרִיב
  choice: पास ले आना
  rationale: קרב के हिफ़ील रूप का अर्थ ‘निकट लाना’ या अनुष्ठान के लिए आगे प्रस्तुत करना हो सकता है। ‘पास ले आना’ मूल स्थानिक अर्थ और अनुष्ठानिक संकेत दोनों को बनाए रखता है।
- source_word: וְהִלְבַּשְׁתָּם
  choice: और उन्हें ... पहनाना
  rationale: यह क्रिया किसी को वस्त्र पहनाने का अर्थ देती है। हिंदी में ‘उन्हें अंगरखे पहनाना’ संक्षिप्त, स्वाभाविक और गरिमापूर्ण है।
- source_word: כֻּתֳּנֹת
  choice: अंगरखे
  rationale: यह शरीर पर पहने जाने वाले ट्यूनिक-जैसे वस्त्रों को दर्शाता है। ‘अंगरखे’ आधुनिक हिंदी पाठक के लिए समझने योग्य है और इसे ढीले बाहरी ‘चोगों’ से अलग रखता है।
