review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the priestly headwrap (מִצְנֶפֶת), its placement on his head, and the holy nezer on the headwrap. However, ‘लगाना’ can imply fastening or attaching more specifically than the Hebrew נתן (‘put/place’) states.
  naturalness: The procedural infinitive style is acceptable in modern Hindi. Reordering the first clause to ‘उसके सिर पर पगड़ी’ is smoother, and using ‘रखना’ in both clauses is clear and does not introduce an unwarranted nuance.
  terminology: ‘पगड़ी’ is a suitable modern rendering of the priestly turban, and ‘पवित्र मुकुट’ is an acceptable rendering of נֵזֶר הַקֹּדֶשׁ. The footnote should describe nezer as a consecrated crown-like emblem, rather than as an emblem of an ‘anointed or dedicated person,’ which overstates the lexical claim.
  issues:
  - severity: low
    issue: ‘लगाना’ may over-specify the second action.
    rationale: נתן in this context means to put or place. Although the object may have been affixed in practice, the verse itself does not explicitly state attachment.
  - severity: medium
    issue: The footnote’s explanation of נֵזֶר is lexically imprecise.
    rationale: נֵזֶר can refer to a consecrated crown-like emblem or diadem; it does not itself mean an emblem belonging to an ‘anointed or dedicated person.’ The note should retain the lexical alternative without adding that claim.
  revised_text: उसके सिर पर पगड़ी रखना और पगड़ी पर पवित्र मुकुट[a] रखना।
