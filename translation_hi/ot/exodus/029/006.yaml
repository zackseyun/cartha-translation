lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: और ... रखना
  rationale: שׂים का मूल अर्थ ‘रखना/स्थापित करना’ है। विधिपरक क्रम में हिंदी का क्रियारूप ‘रखना’ स्वाभाविक और स्पष्ट है।
- source_word: הַמִּצְנֶפֶת
  choice: पगड़ी
  rationale: מִצְנֶפֶת याजकीय सिर-वस्त्र को दर्शाता है। ‘पगड़ी’ आधुनिक हिंदी में स्पष्ट है और किसी बाद की कलीसियाई वेशभूषा का भ्रामक संकेत नहीं देता।
- source_word: עַל רֹאשׁוֹ
  choice: उसके सिर पर
  rationale: स्थान-संबंधी वाक्यांश का सीधा और स्वाभाविक हिंदी रूप।
- source_word: וְנָתַתָּ
  choice: और ... लगाना
  rationale: נתן यहाँ किसी वस्तु को निर्धारित स्थान पर रखने या जड़ने के अर्थ में है। सिर-वस्त्र पर अलंकरण के लिए ‘लगाना’ सहज हिंदी है।
- source_word: אֵת
  choice: '[अलग से अनूदित नहीं]'
  rationale: यह निश्चित कर्म का व्याकरणिक चिह्न है, जिसका हिंदी में अलग शब्द नहीं होता।
- source_word: נֵזֶר הַקֹּדֶשׁ
  choice: पवित्र मुकुट
  rationale: נֵזֶר अभिषिक्त या समर्पित व्यक्ति के मुकुट-जैसे पवित्र चिह्न को दर्शा सकता है। ‘पवित्र मुकुट’ संक्षिप्त, प्रतिष्ठित और सामान्य पाठक के लिए बोधगम्य है; संदर्भ में यह पगड़ी पर लगाया जाने वाला याजकीय अलंकरण है।
- source_word: עַל הַמִּצְנָפֶת
  choice: पगड़ी पर
  rationale: दोहराए गए עַל को ‘पर’ से व्यक्त किया गया है, जिससे स्पष्ट होता है कि पवित्र मुकुट पगड़ी पर लगाया जाना है।
