- from: तू यह सब हारून की हथेलियों पर और उसके पुत्रों की हथेलियों पर रखेगा[a], और उन्हें यहोवा के सामने हिलाकर हिलाई हुई भेंट के रूप में चढ़ाएगा।
  to: तू यह सब हारून की हथेलियों पर और उसके पुत्रों की हथेलियों पर रखेगा[a], और उन वस्तुओं को यहोवा के सामने लहराकर लहराने की भेंट के रूप में अर्पित करेगा।
  rationale: The revision explicitly identifies the waved objects as the ritual portions, thereby preserving the Hebrew pronoun's referent and avoiding a misleading Hindi antecedent. It also replaces the awkward repetition “हिलाकर हिलाई हुई भेंट” with a natural expression that maintains both the wave action and the technical offering designation.
