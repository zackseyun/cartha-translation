language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/שַׂמְתָּ֣ הַ/כֹּ֔ל עַ֚ל כַּפֵּ֣י אַהֲרֹ֔ן וְ/עַ֖ל כַּפֵּ֣י בָנָ֑י/ו וְ/הֵנַפְתָּ֥ אֹתָ֛/ם תְּנוּפָ֖ה לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/024.yaml
  text: You shall put all of it on the palms of Aaron and on the palms of his sons[a], and you shall wave them as a wave offering before Yahweh.
translation:
  language: hi
  text: तू यह सब हारून की हथेलियों पर और उसके पुत्रों की हथेलियों पर रखेगा[a], और उन वस्तुओं को यहोवा के सामने लहराकर लहराने की भेंट के रूप में अर्पित करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में अक्षरशः, “हारून की हथेलियों पर और उसके पुत्रों की हथेलियों पर”; कुछ अनुवाद इसे व्यापक अर्थ में “हाथों पर” कहते हैं, पर यहाँ प्रयुक्त शब्द विशेष रूप से हथेली को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: तू ... रखेगा
  rationale: निर्देशों की शृंखला में संयोजक सहित पूर्ण क्रिया आज्ञार्थक भाव रखती है; ‘रखेगा’ विधिपरक आदेश को स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: הַכֹּל
  choice: यह सब
  rationale: यह पिछले पद में गिनाए गए सभी अंशों की ओर संकेत करता है; ‘यह सब’ उस संदर्भ को संक्षेप में स्पष्ट करता है।
- source_word: עַל כַּפֵּי
  choice: की हथेलियों पर
  rationale: כַּף विशेष रूप से हथेली को दर्शाता है; अनुष्ठान में भेंट के अंश हथेलियों पर रखने का ठोस चित्र सुरक्षित रखा गया है।
- source_word: אַהֲרֹן
  choice: हारून
  rationale: व्यक्तिनाम का प्रचलित मानक हिन्दी रूप।
- source_word: בָנָיו
  choice: उसके पुत्रों
  rationale: यहाँ हारून के अभिषेक में सहभागी पुरुष वंशज अभिप्रेत हैं; ‘पुत्रों’ शाब्दिक और प्रसंगानुकूल है।
- source_word: וְהֵנַפְתָּ
  choice: हिलाकर ... चढ़ाएगा
  rationale: נוף का हिफ़ील बलिदानी प्रसंग में भेंट को अनुष्ठानपूर्वक हिलाकर प्रस्तुत करने को बताता है; हिन्दी में ‘हिलाकर ... चढ़ाना’ क्रिया और प्रस्तुति दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֹתָם
  choice: उन्हें
  rationale: पुल्लिंग बहुवचन कर्म-सर्वनाम अनेक भेंट-अंशों की ओर संकेत करता है; हिन्दी बहुवचन रखा गया है।
- source_word: תְּנוּפָה
  choice: हिलाई हुई भेंट के रूप में
  rationale: यह संज्ञा अनुष्ठानिक क्रिया से पहचानी जाने वाली भेंट को नाम देती है; यह पद परिचित धार्मिक अर्थ और हिलाने की दृश्य क्रिया दोनों बनाए रखता है।
- source_word: לִפְנֵי יְהוָה
  choice: यहोवा के सामने
  rationale: לִפְנֵי का सीधा अर्थ ‘के सामने/उपस्थिति में’ है और יהוה को प्रचलित हिन्दी नाम-रूप ‘यहोवा’ से व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में चार-अक्षरीय वाचा-नाम प्रत्यक्ष है; उसे उपाधि ‘प्रभु’ से बदलने के बजाय हिन्दी में व्यापक रूप से पहचाने जाने वाले नाम-रूप ‘यहोवा’ द्वारा सुरक्षित रखा गया है।
- issue: תְּנוּפָה की अनुष्ठानिक प्रकृति
  choice: हिलाई हुई भेंट
  alternative: अर्पण की भेंट
  rationale: सामान्य प्रस्तुति कहने से विशिष्ट अनुष्ठानिक हिलाने की क्रिया खो सकती है; चुना हुआ रूप मूल के कर्मकाण्डीय चित्र को बनाए रखता है, बिना उसकी दिशा या रीति के बारे में अतिरिक्त दावा किए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण विधिपरक शैली रखी गई है। ‘तू’ मूसा को दिए जा रहे प्रत्यक्ष एकवचन निर्देश को दर्शाता है। ‘हथेलियाँ’ और ‘हिलाई हुई भेंट’ मूल अनुष्ठान के ठोस दृश्य को सुरक्षित रखते हैं।
