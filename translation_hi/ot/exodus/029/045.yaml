  yaml_path: translation/ot/exodus/029/045.yaml
  text: And I will dwell among the sons of Israel[c][b][a], and I will be their God.
translation:
  language: hi
  text: मैं इस्राएल के पुत्रों के बीच निवास करूँगा और उनका परमेश्वर होऊँगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשָׁכַנְתִּי
  choice: मैं ... निवास करूँगा
  rationale: שׁכן किसी स्थान या समुदाय के बीच बसने अथवा निवास करने को व्यक्त करता है। ‘निवास करूँगा’ आधुनिक, गरिमापूर्ण और स्वाभाविक है तथा परमेश्वर की स्थायी उपस्थिति का भाव बनाए रखता है।
- source_word: בְּתוֹךְ
  choice: के बीच
  rationale: लोगों के समूह के साथ בְּתוֹךְ समुदाय के भीतर उपस्थिति व्यक्त करता है। ‘के बीच’ हिंदी में स्वाभाविक है और स्थानगत तथा संबंधपरक दोनों भावों को सुरक्षित रखता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: इब्रानी पदबंध का शाब्दिक अर्थ ‘इस्राएल के पुत्र’ है। यह स्रोत के पुरुषवाची पारिवारिक रूपक को बिना सामान्यीकृत किए बनाए रखता है।
- source_word: וְהָיִיתִי
  choice: और ... होऊँगा
  rationale: यहाँ היה परिवर्तन की अपेक्षा वाचा-संबंध को व्यक्त करता है; इसलिए ‘होऊँगा’ उपयुक्त है, ‘बन जाऊँगा’ नहीं।
- source_word: לָהֶם
  choice: उनका
  rationale: यद्यपि इब्रानी संरचना शाब्दिक रूप से ‘उनके लिए/उनको’ है, हिंदी की स्वाभाविक वाचा-सूत्र अभिव्यक्ति ‘उनका परमेश्वर’ संबंधपरक अर्थ को ठीक रखती है।
- source_word: לֵאלֹהִים
  choice: परमेश्वर
  rationale: प्रथम पुरुष में बोलने वाले परमेश्वर और इस्राएल के साथ वाचा के प्रसंग में אֱלֹהִים निश्चित रूप से ‘परमेश्वर’ है, कोई अनिश्चित ‘एक देवता’ नहीं।
theological_decisions:
- issue: वाचा-सूत्र का अनुवाद
  choice: उनका परमेश्वर होऊँगा
  alternative: उनके लिए परमेश्वर होऊँगा
  rationale: ‘उनका परमेश्वर होऊँगा’ हिंदी में स्वाभाविक रूप से वाचा के संबंध और अपनत्व को व्यक्त करता है, जबकि वैकल्पिक रूप इब्रानी व्याकरण के अधिक निकट है पर कम सहज है।
- issue: लोगों के समूह की पुरुषवाची अभिव्यक्ति
  choice: इस्राएल के पुत्रों
  alternative: इस्राएलियों / इस्राएल की सन्तानों
  rationale: मूल पाठ स्पष्ट रूप से पुरुषवाची बहुवचन ‘पुत्रों’ का प्रयोग करता है। मुख्य पाठ में इसे बनाए रखने से स्रोत की पारिवारिक अभिव्यक्ति सुरक्षित रहती है।
translation_notes:
  register: आधुनिक मानक हिंदी, सरल किंतु गरिमापूर्ण शैली। ‘निवास करूँगा’ धार्मिक प्रतिध्वनि को बनाए रखते हुए सामान्य पाठक के लिए स्पष्ट है; वाक्यक्रम हिंदी में स्वाभाविक रखा गया है।
