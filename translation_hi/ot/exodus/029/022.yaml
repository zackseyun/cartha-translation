  text: וְ/לָקַחְתָּ֣ מִן הָ֠/אַיִל הַ/חֵ֨לֶב וְ/הָֽ/אַלְיָ֜ה וְ/אֶת הַ/חֵ֣לֶב הַֽ/מְכַסֶּ֣ה אֶת הַ/קֶּ֗רֶב וְ/אֵ֨ת יֹתֶ֤רֶת הַ/כָּבֵד֙ וְ/אֵ֣ת שְׁתֵּ֣י הַ/כְּלָיֹ֗ת וְ/אֶת הַ/חֵ֨לֶב֙ אֲשֶׁ֣ר עֲלֵ/הֶ֔ן וְ/אֵ֖ת שׁ֣וֹק הַ/יָּמִ֑ין כִּ֛י אֵ֥יל מִלֻּאִ֖ים הֽוּא־־׀־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/022.yaml
  text: And you shall take from the ram the fat[a], and the fat tail, and the fat that covers the entrails, and the lobe of the liver, and the two kidneys, and the fat that is on them, and the right thigh, for it is a ram of ordination.
translation:
  language: hi
  text: तब तुम मेढ़े में से उसकी चर्बी, उसकी चरबीली पूँछ, अंतड़ियों को ढकने वाली चर्बी, यकृत का उभार, दोनों गुर्दे और उन पर की चर्बी, और दाहिनी जाँघ लो, क्योंकि वह याजकों की नियुक्ति का मेढ़ा है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “समर्पण का मेढ़ा” अथवा “प्रतिष्ठापन का मेढ़ा।” हिब्रू पद उस मेढ़े को दर्शाता है जिसका उपयोग याजकों को उनके पद पर नियुक्त करने के अनुष्ठान में होता था।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: फिर तुम ... लेना
  rationale: निर्देशों के क्रम में वाव-संयुक्त पूर्ण क्रिया को आधुनिक हिन्दी में अगले अनुष्ठानिक कदम के निर्देश के रूप में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: חֵלֶב
  choice: चर्बी
  rationale: बलिदान के प्रसंग में यह चढ़ाए जाने के लिए निर्धारित पशु-चर्बी को सूचित करता है; ‘चर्बी’ सीधा और सामान्य हिन्दी शब्द है।
- source_word: אַלְיָה
  choice: चरबीली पूँछ
  rationale: यह भेड़ या मेढ़े की विशेष रूप से मोटी, चर्बीदार पूँछ को दर्शाता है, केवल सामान्य पूँछ को नहीं।
- source_word: הַמְכַסֶּה אֶת־הַקֶּרֶב
  choice: अंतड़ियों को ढकने वाली
  rationale: वाक्यांश भीतर के अंगों पर छाई चर्बी का वर्णन करता है; ‘अंतड़ियाँ’ अनुष्ठानिक शारीरिक संदर्भ में ठोस और आसानी से समझ आने वाला पद है।
- source_word: יֹתֶרֶת הַכָּבֵד
  choice: कलेजे का उभार
  rationale: सटीक शारीरिक अंग विवादित है। ‘उभार’ יֹתֶרֶת की किसी जुड़े या निकले हुए भाग की धारणा रखता है और ‘कलेजा’ सामान्य हिन्दी में यकृत के लिए सहज है।
- source_word: כְּלָיֹת
  choice: गुर्दे
  rationale: यह शब्द सीधे गुर्दों को दर्शाता है और यहाँ इसका अर्थ शाब्दिक है।
- source_word: שׁוֹק הַיָּמִין
  choice: दाहिनी जाँघ
  rationale: बलिदानी पशु के बाँटे गए हिस्से के संदर्भ में שׁוֹק टाँग के ऊपरी या जाँघ वाले भाग को दर्शाता है; ‘जाँघ’ अपेक्षाकृत विशिष्ट है।
- source_word: אֵיל מִלֻּאִים
  choice: याजक-पद पर नियुक्ति का मेढ़ा
  rationale: यह उस मेढ़े को सूचित करता है जो हारून और उसके पुत्रों को याजकीय सेवा में स्थापित करने के अनुष्ठान में प्रयुक्त होता है। हिन्दी में यह पद अर्थ को स्पष्ट करता है, जबकि विकल्प पादटिप्पणी में रखे गए हैं।
theological_decisions:
- issue: אֵיל מִלֻּאִים में याजकीय स्थापना की शब्दावली
  choice: याजक-पद पर नियुक्ति का मेढ़ा
  alternative: अभिषेक का मेढ़ा; प्रतिष्ठापन का मेढ़ा
  rationale: संदर्भ हारून और उसके पुत्रों को याजकीय पद पर स्थापित करने का है। चुना हुआ रूप बाद की किसी विशिष्ट कलीसियाई पद-व्यवस्था को आरोपित किए बिना अनुष्ठान का कार्य स्पष्ट करता है। हिब्रू पद की व्यापक अनुष्ठानिक अर्थ-सीमा पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, निर्देशात्मक और सामान्य पाठक के लिए सुबोध रूप अपनाया गया है। अनुष्ठानिक वस्तुओं के लिए ठोस शारीरिक शब्द रखे गए हैं; जहाँ मूल की शारीरिक पहचान या संस्कार-संबंधी पदावली में अनिश्चितता है, वहाँ उसे अत्यधिक निश्चित नहीं बनाया गया।
