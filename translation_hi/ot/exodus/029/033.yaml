source:
  edition: WLC
  text: וְ/אָכְל֤וּ אֹתָ/ם֙ אֲשֶׁ֣ר כֻּפַּ֣ר בָּ/הֶ֔ם לְ/מַלֵּ֥א אֶת יָדָ֖/ם לְ/קַדֵּ֣שׁ אֹתָ֑/ם וְ/זָ֥ר לֹא יֹאכַ֖ל כִּי קֹ֥דֶשׁ הֵֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/033.yaml
  text: They shall eat those things by which atonement was made[a], to ordain them and to consecrate them; but an outsider shall not eat them[c][b], because they are holy.
translation:
  language: hi
  text: वे उन वस्तुओं को खाएँ जिनके द्वारा प्रायश्चित किया गया[b], ताकि उन्हें याजकीय सेवा के लिए नियुक्त[a] और पवित्र किया जाए; परन्तु कोई अनधिकृत व्यक्ति[c] उन्हें न खाए, क्योंकि ये वस्तुएँ पवित्र हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘उनका हाथ भरने के लिए’; यह याजकों को उनके पद पर नियुक्त या स्थापित करने का इब्रानी मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘जिनके द्वारा उनके लिए प्रायश्चित किया गया।’
    reason: lexical_alternative
  - marker: c
    text: यहाँ ‘अनधिकृत व्यक्ति’ का अर्थ वह व्यक्ति है जिसे इस याजकीय अनुष्ठान में भाग लेने का अधिकार नहीं था; इसका अर्थ अनिवार्य रूप से किसी दूसरी जाति का व्यक्ति नहीं है।
    reason: cultural_note
lexical_decisions:
- source_word: וְאָכְלוּ אֹתָם
  choice: वे उन वस्तुओं को खाएँ
  rationale: निर्देशात्मक अपूर्ण क्रिया को स्वाभाविक हिन्दी विधि-वाचक रूप में रखा गया है। सर्वनाम का संकेत पिछले पद में बताई गई बलि की वस्तुओं की ओर है, इसलिए स्पष्टता के लिए ‘उन वस्तुओं’ कहा गया है।
- source_word: אֲשֶׁר כֻּפַּר בָּהֶם
  choice: जिनके द्वारा प्रायश्चित किया गया
  rationale: בָּהֶם यहाँ उन वस्तुओं को प्रायश्चित के साधन के रूप में दिखाता है। इब्रानी में इस उपवाक्य के भीतर लाभार्थी स्पष्ट रूप से नहीं दिया गया, इसलिए मुख्य पाठ उस अस्पष्टता को बनाए रखता है।
- source_word: לְמַלֵּא אֶת יָדָם
  choice: उन्हें याजकीय सेवा के लिए नियुक्त
  rationale: शाब्दिक अर्थ ‘उनका हाथ भरना’ है, पर याजकीय विधान में यह पदस्थापन या नियुक्ति का पारिभाषिक मुहावरा है। हिन्दी रूप अर्थ को स्पष्ट करता है और बाद की किसी विशिष्ट सांप्रदायिक पद-व्यवस्था को नहीं थोपता।
- source_word: לְקַדֵּשׁ אֹתָם
  choice: पवित्र किया जाए
  rationale: याजकीय अनुष्ठान के संदर्भ में इसका अर्थ पवित्र सेवा के लिए अलग करना है। ‘पवित्र किया जाए’ स्रोत की धार्मिक शब्दावली और निष्क्रिय संरचना दोनों को सहज हिन्दी में रखता है।
- source_word: וְזָר
  choice: परन्तु कोई अनधिकृत व्यक्ति
  rationale: यहाँ זָר मुख्यतः जातीय विदेशी नहीं, बल्कि उस याजकीय अनुष्ठान में भाग लेने के अधिकार से बाहर व्यक्ति है। ‘अनधिकृत व्यक्ति’ इस विधिक-अनुष्ठानिक अर्थ को स्पष्ट करता है।
- source_word: לֹא יֹאכַל
  choice: उन्हें न खाए
  rationale: सीधे निषेध को हिन्दी के स्वाभाविक विधि-वाचक रूप में व्यक्त किया गया है; प्रसंग से प्राप्त कर्म को स्पष्ट रूप से रखा गया है।
- source_word: כִּי קֹדֶשׁ הֵם
  choice: क्योंकि ये वस्तुएँ पवित्र हैं
  rationale: उपवाक्य निषेध का कारण देता है। हिन्दी में अस्पष्ट सर्वनाम से बचने और बलि की वस्तुओं को संदर्भित करने के लिए संज्ञा दोहराई गई है।
theological_decisions:
- issue: बलि-संबंधी संदर्भ में כּפר का अनुवाद
  choice: प्रायश्चित किया गया
  alternative: दोष-निवारण किया गया; उनके लिए प्रायश्चित किया गया
  rationale: ‘प्रायश्चित’ सामान्य पाठक के लिए परिचित रहते हुए शब्द का अनुष्ठानिक और धर्मवैचारिक भार बनाए रखता है। इब्रानी उपवाक्य में लाभार्थी स्पष्ट नहीं है, इसलिए ‘उनके लिए’ मुख्य पाठ में नहीं जोड़ा गया; सम्भव व्याख्या पादटिप्पणी में दी गई है।
- issue: מִלֵּא יָד याजकीय मुहावरे का अनुवाद
  choice: याजकीय सेवा के लिए नियुक्त
  alternative: उनका हाथ भरना; याजक-पद पर स्थापित करना
  rationale: शाब्दिक रूप हिन्दी में अभिप्रेत अर्थ नहीं पहुँचाता। कार्यगत अनुवाद प्राचीन याजकीय पदस्थापन को स्पष्ट करता है, पर आधुनिक संप्रदायगत अभिषेक या दीक्षा की धारणा नहीं जोड़ता।
- issue: זָר की अनुष्ठानिक सीमा
  choice: अनधिकृत व्यक्ति
  alternative: बाहरी व्यक्ति; जो याजक न हो
  rationale: इस प्रसंग में निषेध जातीय पहचान के बजाय पवित्र भोजन में भाग लेने के अधिकार से जुड़ा है। चुना हुआ रूप इस सीमा को व्यक्त करता है, जबकि पादटिप्पणी सांस्कृतिक आशय स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और विधिक-अनुष्ठानिक है। ‘याजकीय सेवा के लिए नियुक्त’ तकनीकी मुहावरे को सामान्य पाठक के लिए स्पष्ट करता है। ‘अभिषेक’ से परहेज़ किया गया है, क्योंकि वह इस अध्याय में वर्णित अलग तेल-अभिषेक क्रिया से भ्रम पैदा कर सकता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में संबंधित पदों के तुरंत बाद दिए गए हैं।
