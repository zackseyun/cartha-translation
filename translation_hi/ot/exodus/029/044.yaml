id: EXO.29.44
reference: Exodus 29:44
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/קִדַּשְׁתִּ֛י אֶת אֹ֥הֶל מוֹעֵ֖ד וְ/אֶת הַ/מִּזְבֵּ֑חַ וְ/אֶת אַהֲרֹ֧ן וְ/אֶת בָּנָ֛י/ו אֲקַדֵּ֖שׁ לְ/כַהֵ֥ן לִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/044.yaml
  text: And I will consecrate the tent of meeting and the altar[b][a]; and I will consecrate Aaron and his sons to serve me as priests.
translation:
  language: hi
  text: मैं मिलाप के तंबू और वेदी को पवित्र ठहराऊँगा[a]; और हारून और उसके पुत्रों को पवित्र ठहराऊँगा, ताकि वे याजक के रूप में मेरी सेवा करें[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दोनों स्थानों पर इसका अर्थ ‘पवित्र करूँगा’ या ‘पवित्र उपयोग के लिए अलग करूँगा’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘मेरे लिए याजक का काम करें।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִדַּשְׁתִּי / אֲקַדֵּשׁ
  choice: पवित्र ठहराऊँगा
  rationale: पिएल रूप में קדשׁ का अर्थ किसी व्यक्ति या वस्तु को पवित्र उपयोग के लिए अलग करना अथवा समर्पित करना है। दोनों occurrences में एक ही हिंदी पद रखकर मूल की पुनरावृत्ति सुरक्षित की गई है।
- source_word: אֹהֶל מוֹעֵד
  choice: मिलाप का तंबू
  rationale: यह उस पवित्र तंबू का प्रचलित और सहज हिंदी नाम है जहाँ परमेश्वर अपने लोगों से मिलने के लिए नियुक्त करता है।
- source_word: הַמִּזְבֵּחַ
  choice: वेदी
  rationale: बलिदान चढ़ाने के पवित्र स्थान के लिए मानक और स्पष्ट हिंदी शब्द।
- source_word: אַהֲרֹן
  choice: हारून
  rationale: हिंदी बाइबल परंपरा में प्रचलित नाम-रूप।
- source_word: בָּנָיו
  choice: उसके पुत्रों
  rationale: मूल में स्पष्ट रूप से पुत्रों का उल्लेख है; इसलिए इसे व्यापक अर्थ वाले ‘संतानों’ से नहीं बदला गया।
- source_word: לְכַהֵן לִי
  choice: याजक के रूप में मेरी सेवा करें
  rationale: כהן का क्रियात्मक रूप याजकीय सेवा करना बताता है और לִי यह स्पष्ट करता है कि यह सेवा परमेश्वर के लिए है। यह रूप आधुनिक हिंदी में स्वाभाविक रहते हुए दोनों बातों को व्यक्त करता है।
theological_decisions:
- issue: अनुष्ठानिक पवित्रता की भाषा
  choice: पवित्र ठहराऊँगा
  alternative: अभिषिक्त करूँगा / पवित्र करूँगा / पवित्र उपयोग के लिए अलग करूँगा
  rationale: यहाँ तंबू, वेदी और याजकों को परमेश्वर की सेवा के लिए अलग करने की बात है। ‘पवित्र ठहराऊँगा’ इस धार्मिक समर्पण को व्यक्त करता है और इसे केवल अभिषेक की क्रिया तक सीमित नहीं करता।
- issue: याजकीय वंश का लिंग-स्पष्ट उल्लेख
  choice: उसके पुत्रों
  alternative: उसकी संतानों
  rationale: इब्रानी पाठ पुरुषवाची בָּנָיו का प्रयोग करता है और प्रसंग हारून के पुत्रों की याजकीय नियुक्ति का है।
- issue: לְכַהֵן לִי में सेवा का संबंध
  choice: याजक के रूप में मेरी सेवा करें
  alternative: मेरे लिए याजक का काम करें
  rationale: चुना हुआ पाठ याजकीय कार्य और परमेश्वर की ओर निर्देशित सेवा—दोनों को स्पष्ट रखता है, बिना किसी अतिरिक्त सांप्रदायिक अर्थ के।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सरल धार्मिक शैली अपनाई गई है। ‘मिलाप का तंबू’, ‘वेदी’ और ‘याजक’ जैसे परिचित बाइबलीय पद बनाए रखे गए हैं। मूल में קדשׁ की पुनरावृत्ति को हिंदी में भी दोहराया गया है और उद्देश्यसूचक infinitive को स्वाभाविक हिंदी में ‘ताकि’ से व्यक्त किया गया है।
