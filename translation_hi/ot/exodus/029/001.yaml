source:
  edition: WLC
  text: וְ/זֶ֨ה הַ/דָּבָ֜ר אֲשֶֽׁר תַּעֲשֶׂ֥ה לָ/הֶ֛ם לְ/קַדֵּ֥שׁ אֹתָ֖/ם לְ/כַהֵ֣ן לִ֑/י לְ֠קַח פַּ֣ר אֶחָ֧ד בֶּן בָּקָ֛ר וְ/אֵילִ֥ם שְׁנַ֖יִם תְּמִימִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/001.yaml
  text: 'And this is the thing that you shall do for them to consecrate them to serve as priests for me: take one bull from the herd and two unblemished rams[a][b].'
translation:
  language: hi
  text: '“उन्हें मेरे लिए याजक के रूप में सेवा करने के लिए पवित्र ठहराने हेतु तू यह कर: गाय-बैलों के झुंड में से एक बैल[a] और दो दोषरहित मेढ़े[b] ले।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा “एक जवान बैल।” इब्रानी में शाब्दिक रूप से “एक बैल, गाय-बैलों के झुंड का पुत्र” है; यह झुंड के एक गोवंशी पशु के लिए प्रयुक्त मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: अथवा “निर्दोष।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּבָר
  choice: यह करना
  rationale: इस अनुष्ठान-संबंधी निर्देश में शाब्दिक ‘यह वह बात है’ की अपेक्षा यह अभिव्यक्ति स्वाभाविक हिन्दी में आगे बताई जाने वाली विधि का परिचय देती है।
- source_word: תַּעֲשֶׂה
  choice: तू ... करना
  rationale: अपूर्ण क्रिया यहाँ निर्देश का बल रखती है। एकवचन संबोधन को ‘तू’ से बनाए रखा गया है और हिन्दी निर्देशात्मक शैली में ‘करना’ उसका आदेशात्मक भाव व्यक्त करता है।
- source_word: לְקַדֵּשׁ
  choice: पवित्र ठहराने
  rationale: याजकीय संदर्भ में इसका अर्थ पवित्र सेवा के लिए अलग करना है। ‘पवित्र ठहराना’ स्पष्ट है और केवल तेल लगाने तक सीमित ‘अभिषेक करना’ से अधिक व्यापक है।
- source_word: לְכַהֵן לִי
  choice: मेरे लिए याजक का काम करने हेतु
  rationale: यह כהן से बनी क्रिया का कार्यात्मक अर्थ बनाए रखता है—परमेश्वर के लिए याजक के पद में सेवा करना—और किसी बाद की कलीसियाई पदावली को नहीं जोड़ता।
- source_word: לְקַח
  choice: लेना
  rationale: मूल आज्ञा का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: गाय-बैलों के झुंड में से एक बैल
  rationale: בֶּן־בָּקָר को अपारदर्शी शाब्दिक रूप ‘पशुओं का पुत्र’ न देकर झुंड के गोवंशी पशु के अर्थ में व्यक्त किया गया है; कम आयु का भाव संभव है पर अनिवार्य नहीं।
- source_word: אֵילִם שְׁנַיִם
  choice: दो ... मेढ़े
  rationale: संज्ञा और स्पष्ट संख्या का सहज हिन्दी अनुवाद।
- source_word: תְּמִימִם
  choice: निर्दोष
  rationale: बलि के पशुओं के संदर्भ में इसका अर्थ शारीरिक दोष या खोट से रहित होना है; ‘निर्दोष’ संक्षिप्त और प्रतिष्ठित धार्मिक हिन्दी है।
theological_decisions:
- issue: याजकीय कार्य की भाषा
  choice: मेरे लिए याजक का काम करने हेतु
  alternative: मेरी याजकीय सेवा करने के लिए
  rationale: चुना हुआ रूप संस्थागत याजकीय भूमिका और परमेश्वर की ओर उसके संबंध को स्पष्ट रखता है, पर मूल पाठ से आगे कोई सांप्रदायिक अर्थ नहीं जोड़ता।
- issue: पवित्र ठहराने की क्रिया
  choice: पवित्र ठहराने
  alternative: अभिषेक करने
  rationale: קדשׁ का आशय पवित्र सेवा के लिए अलग करना है; ‘अभिषेक’ अनुष्ठान के केवल एक पहलू का आभास दे सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण निर्देशात्मक शैली रखी गई है। इब्रानी का एकवचन संबोधन ‘तू’ से सुरक्षित है। वाक्य को स्वाभाविक बनाने के लिए आरंभिक הַדָּבָר को ‘तू उनके साथ यह करना’ में समाहित किया गया है; अनुष्ठानिक अर्थ के लिए ‘पवित्र ठहराना’ और सामान्य पाठक के लिए स्पष्ट ‘याजक का काम करना’ चुना गया है।
