source:
  edition: WLC
  text: וְ/כִכַּ֨ר לֶ֜חֶם אַחַ֗ת וַֽ/חַלַּ֨ת לֶ֥חֶם שֶׁ֛מֶן אַחַ֖ת וְ/רָקִ֣יק אֶחָ֑ד מִ/סַּל֙ הַ/מַּצּ֔וֹת אֲשֶׁ֖ר לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/023.yaml
  text: and one loaf of bread[a], one cake of bread with oil, and one wafer, from the basket of unleavened bread that is before Yahweh.
translation:
  language: hi
  text: और एक गोल रोटी, तेल मिली रोटी की एक टिकिया, और एक पतली रोटी—अखमीरी रोटियों की उस टोकरी में से, जो याहवे[a] के सामने है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में परमेश्वर का नाम YHWH है; पारंपरिक रूप से इसे ‘यहोवा’ भी कहा जाता है।
    reason: ईश्वरीय नाम के इब्रानी रूप और प्रचलित वैकल्पिक हिंदी रूप को स्पष्ट करना।
lexical_decisions:
- source_word: כִּכַּר לֶחֶם
  choice: एक गोल रोटी
  rationale: כִּכָּר यहाँ गोल आकार की रोटी या टिकिया को सूचित करता है। ‘गोल रोटी’ सामान्य पाठक के लिए स्वाभाविक है और अगले חַלָּה से इसे अलग रखता है।
- source_word: חַלַּת לֶחֶם שֶׁמֶן
  choice: तेल मिली रोटी की एक टिकिया
  rationale: חַלָּה रोटी की टिकिया है और שֶׁמֶן तेल को सूचित करता है। इब्रानी वाक्यांश तेल के प्रयोग को बताता है, पर उसे लगाने या मिलाने की विधि स्पष्ट नहीं करता; ‘तेल मिली’ इस संबंध को संक्षेप में व्यक्त करता है।
- source_word: רָקִיק
  choice: एक पतली रोटी
  rationale: רָקִיק पतली रोटी या टिकिया को दर्शाता है। ‘पतली रोटी’ आधुनिक हिंदी में ‘वेफर’ की अपेक्षा अधिक सहज और सांस्कृतिक रूप से स्पष्ट है।
- source_word: מִסַּל הַמַּצּוֹת
  choice: अखमीरी रोटियों की उस टोकरी में से
  rationale: מִן स्रोत को, סַל टोकरी को और מַצּוֹת बिना खमीर की रोटियों को दर्शाता है। ‘अखमीरी’ हिंदी बाइबलीय प्रयोग में परिचित और संक्षिप्त है।
- source_word: אֲשֶׁר לִפְנֵי יְהוָה
  choice: जो याहवे के सामने है
  rationale: לִפְנֵי का स्थानगत और उपासना-संबंधी अर्थ ‘के सामने’ से सुरक्षित रहता है; स्रोत में ‘रखी हुई’ क्रिया नहीं है, इसलिए उसे नहीं जोड़ा गया।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले इब्रानी व्यक्तिगत नाम YHWH का हिंदी लिप्यंतरण किया गया है; इसे किसी उपाधि से नहीं बदला गया।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत नाम יְהוָה है। ‘याहवे’ उसका व्यापक रूप से स्वीकृत विद्वत्तापूर्ण उच्चारण दर्शाता है और नाम को उपाधि में परिवर्तित नहीं करता; वैकल्पिक पारंपरिक रूप पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिंदी पाठक के लिए सहज रखी गई है। पद पिछले निर्देश की सूची को आगे बढ़ाता है, इसलिए आरंभ का ‘और’ तथा अंत की स्रोत-वाचक खंड-रचना सुरक्षित रखी गई है; मूल में अनुपस्थित कोई आज्ञार्थक क्रिया नहीं जोड़ी गई।
