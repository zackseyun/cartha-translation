  text: עֹלַ֤ת תָּמִיד֙ לְ/דֹרֹ֣תֵי/כֶ֔ם פֶּ֥תַח אֹֽהֶל מוֹעֵ֖ד לִ/פְנֵ֣י יְהוָ֑ה אֲשֶׁ֨ר אִוָּעֵ֤ד לָ/כֶם֙ שָׁ֔מָּ/ה לְ/דַבֵּ֥ר אֵלֶ֖י/ךָ שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/042.yaml
  text: It shall be a regular burnt offering throughout your generations at the entrance of the tent of meeting before Yahweh[a], where I will meet with you[b], to speak to you there.
translation:
  language: hi
  text: यह तुम्हारी पीढ़ियों तक मिलाप के तंबू के द्वार पर, याहवे के सामने, चढ़ाई जाने वाली नियमित होमबलि होगी[a]। वहीं मैं तुम लोगों से मिलूँगा, ताकि वहाँ तुझ से बोलूँ[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘नियमित होमबलि’ का अनुवाद ‘निरंतर होमबलि’ या ‘सदा की होमबलि’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में पहले बहुवचन (‘तुम लोगों से’) और फिर एकवचन (‘तुझ से’) है; सम्भवतः पहली अभिव्यक्ति व्यापक समुदाय और दूसरी विशेष रूप से मूसा की ओर संकेत करती है।
    reason: source_ambiguity
lexical_decisions:
- source_word: עֹלַת תָּמִיד
  choice: नियमित होमबलि
  rationale: עֹלָה पूर्णतः जलाई जाने वाली बलि का प्रचलित धार्मिक पद है, जिसके लिए ‘होमबलि’ स्थापित हिन्दी शब्द है। תָּמִיד यहाँ निर्धारित रूप से बार-बार चढ़ाई जाने वाली बलि को दर्शाता है; ‘नियमित’ इस अर्थ को स्वाभाविक ढंग से व्यक्त करता है और बिना रुके निरंतर जलते रहने का अनावश्यक संकेत नहीं देता।
- source_word: לְדֹרֹתֵיכֶם
  choice: तुम्हारी पीढ़ी-पीढ़ी के लिए
  rationale: यह पद successive generations में बने रहने वाली व्यवस्था को दर्शाता है। ‘पीढ़ी-पीढ़ी के लिए’ आधुनिक हिन्दी में इस दीर्घकालिक लागू होने के भाव को स्पष्ट रखता है।
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: मिलापवाले तंबू के द्वार पर
  rationale: פֶּתַח स्थानसूचक रूप में प्रवेश-द्वार है। אֹהֶל מוֹעֵד परमेश्वर से नियत भेंट के तंबू का नाम है; ‘मिलापवाला तंबू’ हिन्दी बाइबलीय प्रयोग में पहचाना जाने वाला और कार्य-सूचक पद है।
- source_word: לִפְנֵי יְהוָה
  choice: याहवे के सामने
  rationale: לִפְנֵי यहाँ स्थान और उपस्थिति दोनों का भाव रखता है। ‘के सामने’ इसे संक्षेप और स्पष्टता से व्यक्त करता है। יְהוָה को उपाधि से बदलने के बजाय उसके व्यक्तिगत नाम के हिन्दी लिप्यंतरण ‘याहवे’ से प्रस्तुत किया गया है।
- source_word: אֲשֶׁר אִוָּעֵד לָכֶם שָׁמָּה
  choice: वहीं मैं तुम लोगों से मिलूँगा
  rationale: יעד का निफ़अल रूप नियत भेंट या मिलने का अर्थ देता है। ‘तुम लोगों’ से לָכֶם का बहुवचन स्पष्ट होता है और שָׁמָּה का स्थानसूचक बल ‘वहीं’ में सुरक्षित रहता है।
- source_word: לְדַבֵּר אֵלֶיךָ שָׁם
  choice: ताकि वहाँ तुझसे बात करूँ
  rationale: לְדַבֵּר उद्देश्य बताता है, इसलिए ‘ताकि’ स्वाभाविक है। אֵלֶיךָ एकवचन है; ‘तुझसे’ इसे स्पष्ट रूप से बनाए रखता है और सम्भवतः मूसा को अलग संबोधन दिखाता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। ‘याहवे’ हिब्रू नाम का निकट हिन्दी लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: लָכֶם के बहुवचन से אֵלֶיךָ के एकवचन में परिवर्तन
  choice: ‘तुम लोगों से’ और फिर ‘तुझसे’
  alternative: दोनों को एक ही वचन में समरूप करना
  rationale: हिब्रू पाठ जानबूझकर या अर्थपूर्ण ढंग से बहुवचन से एकवचन में जाता है। अनुवाद इस तनाव को बनाए रखता है; एकवचन सम्भवतः मूसा की ओर विशेष संकेत करता है, पर इसे मुख्य पाठ में व्याख्या बनाकर नहीं जोड़ा गया।
- issue: תָּמִיד की कालगत व्यापकता
  choice: नियमित
  alternative: निरंतर अथवा सदा की
  rationale: सन्दर्भ निर्धारित आवर्ती होमबलि का है। ‘नियमित’ अनुष्ठान की सतत व्यवस्था को व्यक्त करता है, जबकि ‘निरंतर’ से बिना किसी विराम की क्रिया और ‘सदा की’ से केवल स्थायित्व पर अधिक बल पड़ सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘होमबलि’ और ‘मिलापवाला तंबू’ जैसे स्थापित बाइबलीय पद बनाए गए हैं, जबकि वाक्य-विन्यास स्वाभाविक हिन्दी का है। बहुवचन से एकवचन में मूल का परिवर्तन स्पष्ट करने के लिए ‘तुम लोगों’ और ‘तुझसे’ का प्रयोग किया गया है।
