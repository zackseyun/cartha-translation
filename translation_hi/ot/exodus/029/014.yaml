  yaml_path: translation/ot/exodus/029/014.yaml
  text: But the flesh of the bull[a], and its hide, and its dung, you shall burn with fire outside the camp; it is a sin offering.
translation:
  language: hi
  text: पर बैल का मांस, उसकी खाल और उसका गोबर आग में छावनी के बाहर जला देना; यह पापबलि[a] है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शुद्धि-बलि।” इब्रानी חַטָּאת का अर्थ “पाप” अथवा पाप से संबंधित बलि हो सकता है। ऐसे बलिदान-संबंधी प्रसंगों में प्रायः “पापबलि” अनुवाद किया जाता है; कुछ अनुवाद विधि के शुद्धिकरणकारी कार्य को उभारने के लिए “शुद्धि-बलि” कहते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשַׂר הַפָּר
  choice: बछड़े का मांस
  rationale: बलिदान-संबंधी व्यवस्था में פַּר के लिए प्रचलित और स्वाभाविक हिन्दी 'बछड़ा' है; בָּשָׂר का ठोस शारीरिक अर्थ यहाँ 'मांस' से स्पष्ट होता है।
- source_word: עֹרוֹ
  choice: उसकी खाल
  rationale: पशु के संदर्भ में 'खाल' आधुनिक हिन्दी में सटीक और स्वाभाविक है।
- source_word: פִּרְשׁוֹ
  choice: उसका गोबर
  rationale: פֶּרֶשׁ मल अथवा गोबर को सूचित करता है; इसे अंतड़ियों या अन्य अवशेष के अर्थ में नरम नहीं किया गया।
- source_word: תִּשְׂרֹף בָּאֵשׁ
  choice: आग में ... जला देना
  rationale: द्वितीय पुरुष एकवचन क्रिया के निर्देशात्मक बल को स्वाभाविक हिन्दी आज्ञार्थक रचना से व्यक्त किया गया है।
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: छावनी के बाहर
  rationale: मरुभूमि में इस्राएल की छावनी की सीमा से बाहर के स्थान के लिए यह स्पष्ट और मानक हिन्दी है।
- source_word: חַטָּאת
  choice: पापबलि
  rationale: यहाँ बलिदान-संबंधी प्रसंग में शब्द अमूर्त 'पाप' के बजाय पाप से संबंधित चढ़ावे को सूचित करता है; 'पापबलि' परिचित और संक्षिप्त है।
- source_word: הוּא
  choice: यह ... है
  rationale: सर्वनाम उस पशु अथवा बलिदान-विधि की पहचान पापबलि के रूप में कराता है।
- source_word: וְאֶת ... וְאֶת ... וְאֶת
  choice: मांस, उसकी खाल और उसका गोबर
  rationale: सूची के सभी तीन अंग बनाए रखे गए हैं; हिन्दी में बार-बार 'और' लगाने के बजाय स्वाभाविक सूची-विन्यास अपनाया गया।
theological_decisions:
- issue: बलिदान-संबंधी व्यवस्था में חַטָּאת का अनुवाद
  choice: पापबलि
  alternative: शुद्धि-बलि; पाप
  rationale: तात्कालिक कर्मकांडीय संदर्भ में बलि का अर्थ प्रमुख है। 'शुद्धि-बलि' इस विधि के शुद्धिकरणकारी कार्य को उभारता है, जबकि 'पापबलि' शब्द के पाप-संबंध को बनाए रखते हुए हिन्दी पाठकों के लिए अधिक परिचित है। वास्तविक वैकल्पिक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और निर्देशात्मक शैली रखी गई है। 'जला देना' कानूनी निर्देश का स्वाभाविक बल देता है; 'गोबर' मूल की स्पष्टता को बिना शिष्टोक्ति के बनाए रखता है।
