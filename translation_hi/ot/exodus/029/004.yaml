  yaml_path: translation/ot/exodus/029/004.yaml
  text: You shall bring Aaron and his sons near to the entrance of the tent of meeting[a], and you shall wash them with water.
translation:
  language: hi
  text: तू हारून और उसके पुत्रों को मिलापवाले तंबू के प्रवेश-द्वार पर ले आना[a], और उन्हें पानी से धोना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हारून और उसके पुत्रों को प्रस्तुत करना।” इब्रानी क्रिया का अर्थ किसी को अनुष्ठानिक कार्य के लिए औपचारिक रूप से प्रस्तुत करना भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּקְרִיב
  choice: पास ले आना
  rationale: हिफ़ईल रूप का अर्थ ‘निकट लाना’ या अनुष्ठान के लिए ‘प्रस्तुत करना’ हो सकता है। ‘पास ले आना’ निकट आने के भाव और याजकीय संस्कार के प्रसंग—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אֶל פֶּתַח
  choice: प्रवेश-द्वार के पास
  rationale: אֶל गति की दिशा और פֶּתַח प्रवेश या द्वार-मुख को दर्शाता है। संयुक्त पद लक्ष्य-स्थान को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֹהֶל מוֹעֵד
  choice: मिलापवाला तम्बू
  rationale: यह इस्राएली पवित्र-स्थान का प्रचलित हिन्दी नाम है और उस नियुक्त स्थान का भाव रखता है जहाँ परमेश्वर अपने लोगों से मिलता है।
- source_word: וְרָחַצְתָּ אֹתָם
  choice: और उन्हें ... धोना
  rationale: यह विधि-संबंधी क्रम में मूसा को दिया गया निर्देश है। हिन्दी का ‘धोना’ आज्ञार्थक निर्देश को स्पष्ट और संक्षिप्त रूप से व्यक्त करता है।
- source_word: בַּמָּיִם
  choice: पानी से
  rationale: בְ यहाँ साधन का भाव दे सकता है; ‘पानी से धोना’ स्वाभाविक हिन्दी प्रयोग है।
- source_word: אַהֲרֹן
  choice: हारून
  rationale: व्यक्तिनाम का मानक हिन्दी बाइबलीय रूप।
- source_word: בָּנָיו
  choice: उसके पुत्रों
  rationale: בנים यहाँ हारून के पुरुष वंशजों को सूचित करता है, जो याजकीय अभिषेक के प्रसंग में महत्त्वपूर्ण है।
theological_decisions:
- issue: याजकीय प्रतिष्ठापन के प्रसंग में קרב का अनुष्ठानिक भाव
  choice: हारून और उसके पुत्रों को ... पास ले आना
  alternative: हारून और उसके पुत्रों को ... प्रस्तुत करना
  rationale: ‘पास ले आना’ मूल क्रिया के स्थानिक अर्थ को बनाए रखते हुए पवित्र-स्थान के निकट लाए जाने का अनुष्ठानिक भाव भी व्यक्त करता है। ‘प्रस्तुत करना’ सम्भव है, पर मुख्य पाठ में कुछ अधिक व्याख्यात्मक होता; इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। विधिक निर्देश के अनुरूप ‘तू ... ले आना’ और ‘धोना’ का प्रयोग किया गया है। ‘मिलापवाला तम्बू’ परिचित बाइबलीय पदावली है; पादटिप्पणी मूल क्रिया की वास्तविक अनुष्ठानिक सम्भावना सुरक्षित रखती है।
