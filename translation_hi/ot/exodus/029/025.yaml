source:
  edition: WLC
  text: וְ/לָקַחְתָּ֤ אֹתָ/ם֙ מִ/יָּדָ֔/ם וְ/הִקְטַרְתָּ֥ הַ/מִּזְבֵּ֖חָ/ה עַל הָ/עֹלָ֑ה לְ/רֵ֤יחַ נִיח֨וֹחַ֙ לִ/פְנֵ֣י יְהוָ֔ה אִשֶּׁ֥ה ה֖וּא לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/025.yaml
  text: Then you shall take them from their hands and burn them on the altar[a], on top of the burnt offering, as a pleasing aroma before Yahweh. It is an offering made by fire to Yahweh.
translation:
  language: hi
  text: फिर तुम उन्हें उनके हाथों से लेना और वेदी पर, होमबलि के ऊपर, जला देना, यहोवा के सामने सुखदायक सुगन्ध के रूप में। यह यहोवा के लिए अग्नि में चढ़ाई गई भेंट[a] है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहोवा के लिए अग्नि-भेंट” अथवा “यहोवा के लिए अग्नि द्वारा अर्पित भेंट।”
    reason: अִשֶּׁה के प्रचलित वैकल्पिक अनुवादों को दर्शाने और बलिदानी तकनीकी पद की पारदर्शिता बनाए रखने के लिए।
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: फिर तुम ... लेकर
  rationale: संयोजक सहित पूर्ण क्रिया अनुष्ठानिक निर्देशों के क्रम में आज्ञार्थक भाव रखती है; ‘फिर’ क्रम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִיָּדָם
  choice: उनके हाथों से
  rationale: मूल की शारीरिक और अनुष्ठानिक ठोसता को सीधे बनाए रखता है।
- source_word: וְהִקְטַרְתָּ
  choice: जला देना
  rationale: हिफ़िल रूप बलिदानी सन्दर्भ में वेदी पर जलाकर धुआँ उठाने को सूचित करता है; वर्तमान हिन्दी में यह स्पष्ट और स्वाभाविक है।
- source_word: הַמִּזְבֵּחָה
  choice: वेदी पर
  rationale: दिशासूचक रूप यहाँ वेदी पर रखकर जलाने का अर्थ देता है।
- source_word: עַל הָעֹלָה
  choice: होमबलि के ऊपर
  rationale: עַל पहले से उपस्थित होमबलि के ऊपर इन अंशों को रखने का संकेत देता है।
- source_word: לְרֵיחַ נִיחוֹחַ
  choice: ताकि यह ... सुखदायक सुगन्ध हो
  rationale: स्थिर बलिदानी पद परमेश्वर को स्वीकार्य और प्रसन्न करने वाली सुगन्ध का रूपक व्यक्त करता है।
- source_word: לִפְנֵי יְהוָה
  choice: यहोवा के सामने
  rationale: לִפְנֵי उपस्थिति/सम्मुखता दर्शाता है और יהוה को उसके वाचिक नाम ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: אִשֶּׁה
  choice: अग्नि में चढ़ाई गई भेंट
  rationale: यह बलिदानी पद अग्नि के माध्यम से यहोवा को अर्पित भेंट बताता है; यह अनुवाद आग से सम्बन्ध बनाए रखता है, पर आग को स्वयं भेंट नहीं बनाता।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: ל समर्पण और अभिप्राय दर्शाता है; हिन्दी में ‘के लिए’ स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिवाचक नाम प्रत्यक्ष है; ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाता है और नाम को उपाधि में नहीं बदलता।
- issue: बलिदानी पद אִשֶּׁה का अर्थ
  choice: अग्नि में चढ़ाई गई भेंट
  alternative: अग्नि-भेंट / भोजन-भेंट
  rationale: शब्द की सटीक व्युत्पत्ति पर अनिश्चितता के बावजूद इस सन्दर्भ में अग्नि द्वारा अर्पण प्रमुख है। ‘भोजन-भेंट’ निकटवर्ती याजकीय भोजन-रूपक को आयत में अनावश्यक रूप से आयात कर सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और अनुष्ठानिक क्रम के अनुरूप रखी गई है। ‘होमबलि’, ‘वेदी’ और ‘भेंट’ जैसे स्थापित हिन्दी बाइबलीय शब्द सामान्य पाठक के लिए पहचाने जाने योग्य हैं; वाक्य-विन्यास को मूल के क्रम के निकट रखते हुए स्वाभाविक हिन्दी बनाया गया है।
