base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/013.yaml
  text: Then you shall take all the fat that covers the entrails[a], the lobe on the liver, the two kidneys, and the fat that is on them, and you shall burn them on the altar.
translation:
  language: hi
  text: फिर तुम अंतड़ियों को ढकने वाली सारी चरबी, कलेजे पर का उपांग[a], दोनों गुर्दे और उन पर की चरबी ले लेना, और उन्हें वेदी पर जलाना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द कलेजे से जुड़े एक विशिष्ट भाग को दर्शाता है, लेकिन आधुनिक शरीर-रचना में उसकी ठीक पहचान निश्चित नहीं है; इसका अनुवाद “कलेजे का खंड” या “कलेजे का लोब” भी किया जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: फिर तुम ... ले लेना
  rationale: संयोजक वाव के साथ यह पूर्ण क्रिया अनुष्ठान-संबंधी निर्देशों के क्रम में आज्ञार्थक भाव व्यक्त करती है। ‘ले लेना’ आधुनिक हिन्दी में इस प्रक्रियात्मक आदेश को स्वाभाविक ढंग से रखता है।
- source_word: כָּל הַחֵלֶב
  choice: सारी चरबी
  rationale: यह बलि-पशु के विशिष्ट वसायुक्त भागों को दर्शाता है। ‘चरबी’ सामान्य पाठक के लिए स्पष्ट और बलि-विधान के संदर्भ में उपयुक्त है।
- source_word: הַמְכַסֶּה אֶת הַקֶּרֶב
  choice: अंतड़ियों को ढकने वाली
  rationale: यह पशु के भीतर के अंगों या आंतरिक भाग को ढकने वाली चरबी का वर्णन है। ‘अंतड़ियाँ’ हिन्दी में ठोस, सहज और इस बलि-संदर्भ के अनुकूल है।
- source_word: הַיֹּתֶרֶת עַל הַכָּבֵד
  choice: कलेजे पर लगी झिल्ली
  rationale: योतेरेत कलेजे से जुड़े किसी विशिष्ट भाग को दर्शाता है, पर आधुनिक शरीर-रचना में उसकी ठीक पहचान अनिश्चित है। ‘झिल्ली’ हिन्दी में स्वाभाविक है और किसी निश्चित आधुनिक अंग-नाम का अनुचित दावा नहीं करती; ‘पर लगी’ עַל के संबंध को बनाए रखता है।
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: दोनों गुर्दे
  rationale: यह दो वृक्कों का सीधा शारीरिक उल्लेख है; ‘दोनों गुर्दे’ स्पष्ट और स्वाभाविक हिन्दी है।
- source_word: הַחֵלֶב אֲשֶׁר עֲלֵיהֶן
  choice: उन पर की चरबी
  rationale: यह गुर्दों से लगी चरबी को बताता है और עֲלֵיהֶן के ‘उन पर’ संबंध को निकटता से सुरक्षित रखता है।
- source_word: וְהִקְטַרְתָּ הַמִּזְבֵּחָה
  choice: और उन्हें वेदी पर जलाना
  rationale: हिफ़ील קטר बलि के रूप में वेदी पर जलाने को दर्शाता है। ‘वेदी पर जलाना’ स्पष्ट है और बलि का भाव संदर्भ से मिलता है; दिशासूचक ה को ‘वेदी पर’ से स्वाभाविक हिन्दी में व्यक्त किया गया है।
