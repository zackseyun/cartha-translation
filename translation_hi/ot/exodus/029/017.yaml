  text: Then cut the ram into its pieces[a], wash its entrails and its legs[b], and put them on its pieces and on its head.
translation:
  language: hi
  text: फिर मेढ़े को टुकड़ों में काटना, उसकी अंतड़ियों[a] और टाँगों को धोना, और उन्हें उसके टुकड़ों और सिर के ऊपर रखना।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘भीतरी अंगों’। यहाँ प्रयुक्त इब्रानी शब्द पशु के अंदरूनी भागों को व्यापक रूप से भी दर्शा सकता है, यद्यपि बलिदान के इस प्रसंग में ‘अंतड़ियाँ’ अधिक संभावित है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ ‘उन्हें उसके टुकड़ों और उसके सिर पर रखना’ है। इसका आशय धोए हुए भागों को कटे हुए टुकड़ों और सिर के साथ व्यवस्थित करना भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאַיִל
  choice: मेढ़े
  rationale: बलिदान के प्रसंग में אַיִל वयस्क नर भेड़, अर्थात् मेढ़े, को दर्शाता है।
- source_word: תְּנַתֵּחַ לִנְתָחָיו
  choice: टुकड़ों में काटना
  rationale: पिएल क्रिया और נְתָחִים मिलकर बलिदान के लिए पशु को उसके निर्धारित टुकड़ों में काटने की प्रक्रिया बताते हैं।
- source_word: קִרְבּוֹ
  choice: उसकी अंतड़ियों
  rationale: קֶרֶב सामान्यतः अंदरूनी भाग कह सकता है, पर पशु-बलिदान के निर्देश में धोए जाने वाले आंतरिक अंगों के लिए ‘अंतड़ियाँ’ प्रसंगानुकूल और सहज है; व्यापक अर्थ पादटिप्पणी में रखा गया है।
- source_word: כְרָעָיו
  choice: टाँगों
  rationale: כְּרָעַיִם पशु की टाँगों, विशेषकर निचले भागों, को दर्शाता है; ‘टाँगें’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: וְנָתַתָּ עַל
  choice: ऊपर रखना
  rationale: עַל का मूल स्थानगत अर्थ ‘पर/ऊपर’ है। इसे मुख्य पाठ में बनाए रखा गया है, जबकि साथ व्यवस्थित करने की संभावित प्रसंगगत समझ पादटिप्पणी में दी गई है।
- source_word: רֹאשׁוֹ
  choice: सिर
  rationale: यह सीधे पशु के सिर को दर्शाता है।
- source_word: וְ
  choice: फिर / और
  rationale: क्रमिक निर्देशों की शृंखला में पहला वाव ‘फिर’ और आगे के वाव ‘और’ से स्वाभाविक हिन्दी क्रम व्यक्त करते हैं।
