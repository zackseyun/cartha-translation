lexical_decisions:
- source_word: וְשָׁחַטְתָּ
  choice: बलि करना
  rationale: इस अनुष्ठानिक संदर्भ में क्रिया पशु को वध करने के लिए है; ‘बलि करना’ सामान्य पाठक के लिए यज्ञ-संबंधी आशय स्पष्ट रखते हुए स्वाभाविक है।
- source_word: הָאָיִל
  choice: मेढ़ा
  rationale: आयिल यहाँ नर भेड़ को सूचित करता है; ‘मेढ़ा’ सटीक और प्रचलित हिन्दी शब्द है।
- source_word: וְזָרַקְתָּ
  choice: फेंकना
  rationale: मूल क्रिया का सामान्य अर्थ ‘फेंकना’ है और अंग्रेज़ी परामर्श-पाठ में भी इसी ठोस क्रिया को रखा गया है; ‘छिड़कना’ कहने से क्रिया की तीव्रता अनावश्यक रूप से हल्की पड़ सकती है।
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: वेदी पर चारों ओर
  rationale: स्थान और वितरण—वेदी के चारों ओर रक्त लगाए जाने—को मूल की संक्षिप्तता के साथ बनाए रखता है।
