base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/005.yaml
  text: Then you shall take the garments and clothe Aaron with the tunic[a], the robe of the ephod, the ephod, and the breastpiece[b], and you shall skillfully fasten it on him with the woven band of the ephod.
translation:
  language: hi
  text: फिर तुम वे वस्त्र लेकर हारून को अंगरखा, एपोद का चोगा, एपोद और सीनाबंद[a] पहनाना, और एपोद को उसकी बुनी हुई पट्टी से हारून पर कस देना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: परम्परागत अनुवादों में प्रायः “छाती की पट्टी” या “छाती का पट्टा” मिलता है। इब्रानी शब्द छाती पर पहने जाने वाले एक विशेष याजकीय भाग को दर्शाता है, कवच को नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: फिर तुम ... लेकर
  rationale: निर्देशों के क्रम में वाव-संयुक्त क्रिया अगले चरण को बताती है; ‘फिर’ आधुनिक हिन्दी में इस प्रक्रियात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַבְּגָדִים
  choice: वे वस्त्र
  rationale: यह वस्त्रों के सामान्य समूह का सूचक है; ‘वस्त्र’ गरिमापूर्ण और स्वाभाविक है तथा बाद की कलीसियाई शब्दावली नहीं लाता।
- source_word: וְהִלְבַּשְׁתָּ אֶת־אַהֲרֹן
  choice: हारून को ... पहनाना
  rationale: हिफ़ील रूप का कारक अर्थ हिन्दी के ‘पहनाना’ से संक्षिप्त और स्वाभाविक रूप में व्यक्त होता है।
- source_word: הַכֻּתֹּנֶת
  choice: अंगरखा
  rationale: כֻּתֹּנֶת शरीर के पास पहने जाने वाले मूल लंबे परिधान को दर्शाता है; ‘अंगरखा’ सामान्य पाठक के लिए समझने योग्य निकटतम हिन्दी पद है।
- source_word: מְעִיל הָאֵפֹד
  choice: एपोद का चोगा
  rationale: सम्बन्धवाचक इब्रानी पदबंध को निकटता से रखता है और מְעִיל के बाहरी लंबे परिधान का बोध कराता है।
- source_word: הָאֵפֹד
  choice: एपोद
  rationale: यह एक विशिष्ट याजकीय परिधान का तकनीकी नाम है जिसका सटीक हिन्दी पर्याय नहीं है; इसलिए लिप्यंतरण उचित है।
- source_word: הַחֹשֶׁן
  choice: सीनाबन्द
  rationale: यह छाती पर बाँधे जाने वाले याजकीय अंश को दर्शाता है; ‘सीनाबन्द’ कवच होने का भ्रामक संकेत दिए बिना उसके स्थान और बँधे होने को व्यक्त करता है।
- source_word: וְאָפַדְתָּ לוֹ
  choice: उसे उस पर अच्छी तरह कस देना
  rationale: दुर्लभ क्रिया אפד एपोद को पहनाकर कसने या बाँधने का अर्थ देती है। ‘उसे’ एपोद को और ‘उस पर’ हारून को संदर्भित करता है; ‘अच्छी तरह कस देना’ क्रिया की कार्यवाही को स्वाभाविक हिन्दी में रखता है, जबकि उसकी दुर्लभता और वैकल्पिक समझ पादटिप्पणी में सुरक्षित है।
- source_word: בְּחֵשֶׁב הָאֵפֹד
  choice: एपोद की बुनी हुई पट्टी से
  rationale: חֵשֶׁב यहाँ एपोद से जुड़ी बुनी या कलात्मक कमर-पट्टी को बताता है; ‘बुनी हुई पट्टी’ ठोस, संक्षिप्त और प्रसंगानुकूल है।
