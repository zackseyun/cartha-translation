  yaml_path: translation/ot/exodus/029/010.yaml
  text: You shall bring the bull before the tent of meeting[a], and Aaron and his sons shall lay their hands on the head of the bull.
translation:
  language: hi
  text: तुम बैल को मिलापवाले तम्बू के सामने ले आना[a], और हारून और उसके पुत्र बैल के सिर पर अपने हाथों को रखें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, ‘बैल को मिलापवाले तम्बू के सामने प्रस्तुत करना’ या ‘निकट लाना’।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתָּ
  choice: ले आना
  rationale: קרב के हिफ़ील रूप का अर्थ बलिदान-संबंधी प्रसंग में निकट लाना या प्रस्तुत करना है। ‘ले आना’ सहज आधुनिक हिन्दी है, जबकि स्थानसूचक पद इसकी दिशा स्पष्ट करता है।
- source_word: הַפָּר
  choice: बैल
  rationale: פַּר बलिदान के लिए प्रयुक्त बैल को दर्शाता है; ‘बैल’ सामान्य हिन्दी में स्पष्ट और पर्याप्त रूप से सटीक है।
- source_word: לִפְנֵי
  choice: के सामने
  rationale: यह पद किसी स्थान के सम्मुख या उसकी उपस्थिति में होने का भाव देता है; ‘के सामने’ स्वाभाविक हिन्दी है।
- source_word: אֹהֶל מוֹעֵד
  choice: मिलापवाला तम्बू
  rationale: यह पवित्रस्थान के लिए रूढ़ बाइबलीय हिन्दी पद है और सभा अथवा नियत भेंट-स्थान का धार्मिक संदर्भ बनाए रखता है।
- source_word: וְסָמַךְ
  choice: रखें
  rationale: סמך यहाँ बलि-पशु के सिर पर हाथ रखने की ठोस अनुष्ठानिक क्रिया बताता है; ‘हाथ ... रखें’ स्पष्ट और स्वाभाविक है।
- source_word: יְדֵיהֶם
  choice: अपने हाथ
  rationale: इब्रानी में बहुवचन है; हिन्दी में ‘अपने हाथ’ हारून और उसके पुत्रों की सामूहिक क्रिया को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עַל רֹאשׁ הַפָּר
  choice: बैल के सिर पर
  rationale: यह मूल पाठ की ठोस शारीरिक क्रिया और संबंध को सीधे तथा सहज हिन्दी में सुरक्षित रखता है।
- source_word: אַהֲרֹן וּבָנָיו
  choice: हारून और उसके पुत्र
  rationale: प्रसंग में בנים हारून के उन पुरुष वंशजों को सूचित करता है जो याजकीय अभिषेक में सम्मिलित हैं; ‘पुत्र’ सटीक है।
theological_decisions:
- issue: बलि-पशु पर हाथ रखने की अनुष्ठानिक क्रिया
  choice: अपने हाथ बैल के सिर पर रखें
  alternative: अपने हाथ बैल के सिर पर टिकाएँ
  rationale: पद क्रिया का वर्णन करता है, पर उसके धार्मिक प्रतीक का अर्थ स्पष्ट नहीं करता। अनुवाद दोष-स्थानांतरण जैसी बाद की व्याख्या जोड़े बिना मूल की धर्मवैचारिक खुली स्थिति बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। आज्ञार्थक विधान के लिए ‘तू ... ले आना’ और आगे ‘रखें’ रखा गया है। ‘मिलापवाला तम्बू’ हिन्दी बाइबल परंपरा में परिचित पवित्रस्थान-संज्ञा है।
