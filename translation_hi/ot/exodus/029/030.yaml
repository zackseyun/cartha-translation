  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: שִׁבְעַ֣ת יָמִ֗ים יִלְבָּשָׁ֧/ם הַ/כֹּהֵ֛ן תַּחְתָּ֖י/ו מִ/בָּנָ֑י/ו אֲשֶׁ֥ר יָבֹ֛א אֶל אֹ֥הֶל מוֹעֵ֖ד לְ/שָׁרֵ֥ת בַּ/קֹּֽדֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/030.yaml
  text: For seven days the priest from among his sons who succeeds him shall put them on[c][b][a], when he enters the tent of meeting to minister in the holy place.
translation:
  language: hi
  text: सात दिनों तक उसके पुत्रों में से जो याजक उसके स्थान पर होगा[b], वह उन वस्त्रों को पहने रहेगा[a], जब वह पवित्रस्थान[c] में सेवा करने के लिए मिलापवाले तम्बू में प्रवेश करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उन वस्त्रों को पहनेगा।” इब्रानी क्रिया का अर्थ प्रसंग के अनुसार “पहनना” या “पहने रहना” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक, “उसके स्थान पर याजक, उसके पुत्रों में से”; अर्थात वह याजक जो उसके पद पर उत्तराधिकारी होगा।
    reason: lexical_alternative
  - marker: c
    text: या “पवित्र धाम में।”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבְעַת יָמִים
  choice: सात दिन तक
  rationale: यह अवधि सूचक पद है; ‘तक’ स्वाभाविक हिन्दी में पूरे सात दिनों की अवधि व्यक्त करता है।
- source_word: יִלְבָּשָׁם
  choice: उन वस्त्रों को पहने रहेगा
  rationale: לבש का अर्थ पहनना या धारण करना है। पूर्ववर्ती प्रसंग के याजकीय वस्त्रों को स्पष्ट करने के लिए ‘उन वस्त्रों’ और अवधि के भाव के लिए ‘पहने रहेगा’ चुना गया है।
- source_word: הַכֹּהֵן תַּחְתָּיו
  choice: जो याजक उसके स्थान पर होगा
  rationale: शाब्दिक ‘उसके नीचे/उसके स्थान पर’ यहाँ पद में उत्तराधिकार को सूचित करता है; यह हिन्दी रूप उस आशय को स्पष्ट रखते हुए मूल बिंब के निकट है।
- source_word: מִבָּנָיו
  choice: उसके पुत्रों में से
  rationale: यह विभाजक भाव को सुरक्षित रखता है और बताता है कि उत्तराधिकारी उसके पुत्रों में से होगा।
- source_word: אֲשֶׁר יָבֹא
  choice: जब वह ... प्रवेश करेगा
  rationale: सम्बन्धवाचक रचना प्रसंग में उस अवसर को बताती है जब उत्तराधिकारी सेवा के लिए तम्बू में आता है; हिन्दी में कालवाचक रूप स्वाभाविक है।
- source_word: אֹהֶל מוֹעֵד
  choice: मिलापवाला तम्बू
  rationale: यह इस्राएली उपासना-स्थान के पारंपरिक नाम को स्पष्ट और परिचित हिन्दी में व्यक्त करता है।
- source_word: לְשָׁרֵת
  choice: सेवा करने के लिए
  rationale: यह याजकीय पवित्र सेवा को सहज आधुनिक हिन्दी में व्यक्त करता है, बिना अतिरिक्त धार्मिक अर्थ जोड़े।
- source_word: בַּקֹּדֶשׁ
  choice: पवित्रस्थान में
  rationale: קֹדֶשׁ यहाँ पवित्र उपासना-क्षेत्र को सूचित करता है; ‘पवित्रस्थान’ इसकी स्थानगत और उपासना-संबंधी विशिष्टता बनाए रखता है।
theological_decisions:
- issue: याजकीय उत्तराधिकार की भाषा
  choice: उसके पुत्रों में से जो याजक उसके स्थान पर होगा
  alternative: उसके पुत्रों में से उसके बदले याजक होनेवाला
  rationale: यह वंशानुगत याजकीय पद में उत्तराधिकार व्यक्त करता है, पर बाद की किसी विशेष धार्मिक व्यवस्था को पाठ में नहीं जोड़ता।
- issue: בַּקֹּדֶשׁ का उपासना-स्थान
  choice: पवित्रस्थान में
  alternative: पवित्र धाम में
  rationale: ‘पवित्रस्थान’ तम्बू के पवित्र क्षेत्र का ठोस स्थानगत अर्थ बनाए रखता है; मूल में यह आवश्यक रूप से किसी एक तकनीकी उपभाग तक सीमित है या व्यापक पवित्र क्षेत्र है, इस सम्भावित विस्तार को टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मिलापवाला तम्बू’ और ‘पवित्रस्थान’ जैसे परिचित बाइबलीय पद बनाए गए हैं। वाक्यक्रम हिन्दी की स्वाभाविकता के अनुसार है, जबकि उत्तराधिकार, अवधि और पवित्र सेवा के मूल अर्थ सुरक्षित हैं।
