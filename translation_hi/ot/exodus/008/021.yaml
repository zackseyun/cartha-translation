    reason: The phrase is contextually Egypt, while the translation preserves the Hebrew's non-explicit geographic wording.
  revision_rationale: The revision removes non-explicit emphasis, preserves the two sequential Hebrew narrative actions, and supplies an anchored note corresponding to the audit trail's clarification that ‘the land’ means Egypt in context. No theological interpretation has been added.
