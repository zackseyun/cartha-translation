base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/021.yaml
  text: Then Pharaoh called Moses and Aaron and said[a], “Go, sacrifice to your God in the land.”
translation:
  language: hi
  text: तब फ़िरौन ने मूसा और हारून को बुलाया और कहा, “जाओ, इस देश[a] में अपने परमेश्वर को बलिदान चढ़ाओ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात मिस्र देश के भीतर; इब्रानी में शाब्दिक रूप से “देश में।”
    reason: The phrase is contextually Egypt, while the translation preserves the Hebrew's non-explicit geographic wording.
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: बुलाकर
  rationale: कרא यहाँ किसी को अपने पास बुलाने का भाव देता है। संयुक्त क्रिया “बुलाकर कहा” स्वाभाविक हिन्दी में इब्रानी घटनाक्रम को स्पष्ट रखती है।
- source_word: פַרְעֹה
  choice: फ़िरौन
  rationale: मिस्र के शासक की उपाधि का प्रचलित आधुनिक हिन्दी रूप।
- source_word: אֶל־מֹשֶׁה וּלְאַהֲרֹן
  choice: मूसा और हारून को
  rationale: सम्बोधन के लक्ष्य को स्वाभाविक हिन्दी कर्म-चिह्न “को” से व्यक्त किया गया है।
- source_word: וַיֹּאמֶר
  choice: कहा
  rationale: कथात्मक אמר का सीधा और प्रचलित हिन्दी समतुल्य।
- source_word: לְכוּ
  choice: जाओ
  rationale: बहुवचन आज्ञार्थक रूप का सीधा अनुवाद।
- source_word: זִבְחוּ
  choice: बलिदान चढ़ाओ
  rationale: זבח यहाँ धार्मिक बलिदान देने की क्रिया है; “बलिदान चढ़ाओ” सामान्य हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: לֵאלֹהֵיכֶם
  choice: अपने परमेश्वर को
  rationale: प्रत्यय ‘तुम्हारे’ का सम्बन्ध हिन्दी में कर्ता से स्वाभाविक रूप से “अपने” द्वारा व्यक्त होता है; ל बलिदान के प्राप्तकर्ता अथवा दिशा को सूचित करता है।
- source_word: בָּאָרֶץ
  choice: इसी देश में
  rationale: शाब्दिक अर्थ “देश में” है; प्रसंग में फ़िरौन का आशय मिस्र की सीमाओं के भीतर ही बलिदान करने से है। “इसी” उस प्रसंगगत विरोध को स्वाभाविक हिन्दी में व्यक्त करता है, बिना सीधे ‘मिस्र’ जोड़ने के।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। “बलिदान चढ़ाओ” धार्मिक क्रिया को आम पाठक के लिए स्पष्ट करता है। “इसी देश में” इब्रानी की संक्षिप्तता तथा प्रसंग में निहित मिस्र के भीतर रहने की सीमा—दोनों को व्यक्त करता है।
