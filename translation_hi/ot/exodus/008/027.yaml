base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/027.yaml
  text: And Yahweh did according to Moses' word[a], and removed the swarm from Pharaoh, from his servants, and from his people; not one remained.
translation:
  language: hi
  text: और याहवे ने मूसा के वचन के अनुसार किया। उसने फ़िरौन, उसके सेवकों और उसकी प्रजा से कीड़ों का झुंड[a] हटा दिया; एक भी नहीं बचा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द עָרֹב झुंड बनाकर आने वाले कीड़ों की इस विपत्ति को दर्शाता है; इससे कीड़ों की ठीक-ठीक प्रजाति निश्चित नहीं होती। परंपरागत अनुवादों में इसे कभी-कभी “मक्खियों का झुंड” कहा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय आधुनिक हिन्दी में लिप्यंतरित किया गया है।
- source_word: כִּדְבַר מֹשֶׁה
  choice: मूसा के कहे के अनुसार
  rationale: यह דָּבָר के ‘कहे हुए वचन/बात’ के अर्थ को स्वाभाविक हिन्दी में व्यक्त करता और मूल के ‘अनुसार’ संबंध को बनाए रखता है।
- source_word: וַיָּסַר
  choice: हटा दिया
  rationale: हिफ़ील रूप यहाँ विपत्ति को दूर करने का अर्थ देता है; ‘हटा दिया’ सरल और प्रसंगानुकूल है।
- source_word: הֶעָרֹב
  choice: कीड़ों का झुंड
  rationale: यह सामूहिक विपत्ति-सूचक पद को व्यक्त करता है, पर किसी विशेष कीट-प्रजाति का दावा नहीं करता।
- source_word: מִפַּרְעֹה מֵעֲבָדָיו וּמֵעַמּוֹ
  choice: फ़िरौन, उसके सेवकों और उसकी प्रजा के पास से
  rationale: ‘के पास से’ हटाए जाने के स्थान अथवा प्रभावित क्षेत्र को स्वाभाविक हिन्दी में बताता है; तीनों समूह स्पष्ट रखे गए हैं।
- source_word: לֹא נִשְׁאַר אֶחָד
  choice: एक भी नहीं बचा
  rationale: नकार के साथ אֶחָד की एकवचनात्मक और पूर्णता दर्शाने वाली दृढ़ता को मुहावरेदार हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसका लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
translation_notes:
  register: आधुनिक, सरल और गरिमापूर्ण मानक हिन्दी। दो वाक्यों में विभाजन हिन्दी की स्वाभाविक पठनीयता बढ़ाता है; मूल के क्रम और अंतिम जोर को बनाए रखा गया है।
