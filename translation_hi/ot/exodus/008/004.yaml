base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/004.yaml
  text: Then Pharaoh called for Moses and Aaron and said[a], “Pray to Yahweh, that he may remove the frogs from me and from my people, and I will let the people go[b], so that they may sacrifice to Yahweh.”
translation:
  language: hi
  text: तब फ़िरौन ने मूसा और हारून को बुलवाकर कहा, “याहवे से विनती करो[a] कि वह मेंढकों को मुझसे और मेरी प्रजा से दूर कर दे। और मैं लोगों को जाने दूँगा, ताकि वे याहवे को बलिदान चढ़ाएँ[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू क्रिया का अर्थ ‘याहवे से आग्रहपूर्वक विनती करो’ या ‘याहवे के सामने मध्यस्थता करो’ भी हो सकता है; इसमें साधारण प्रार्थना से अधिक तीव्र निवेदन का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “और वे याहवे को बलिदान चढ़ाएँ।” हिब्रू में अंतिम खंड साधारण समन्वय के रूप में भी पढ़ा जा सकता है, हालाँकि यहाँ वह प्रजा को जाने देने का उद्देश्य बताता हुआ प्रतीत होता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרָא ... לְמֹשֶׁה וּלְאַהֲרֹן
  choice: मूसा और हारून को बुलवाकर
  rationale: קרא के साथ לְ यहाँ उन्हें अपने पास बुलाने या बुलवा भेजने का भाव देता है। ‘बुलवाकर’ फ़िरौन की राजकीय स्थिति और प्रसंग को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַעְתִּירוּ
  choice: विनती करो
  rationale: עתר का हिफ़ील रूप साधारण प्रार्थना से बढ़कर आग्रहपूर्वक प्रार्थना या मध्यस्थता करने का भाव रख सकता है। ‘विनती करो’ इस तीव्रता को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אֶל יְהוָה / לַיהוָה
  choice: याहवे से / याहवे को
  rationale: ईश्वरीय नाम יהוה को उसके व्यक्तिगत वाचा-नाम ‘याहवे’ के रूप में रखा गया है; हिन्दी कारक क्रमशः विनती और बलिदान की क्रियाओं के अनुसार हैं।
- source_word: וְיָסֵר
  choice: कि वह ... दूर कर दे
  rationale: סור के हिफ़ील का अर्थ हटाना या दूर करना है। आग्रहसूचक आज्ञा के बाद यह माँगी गई कार्रवाई को व्यक्त करता है।
- source_word: מִמֶּנִּי וּמֵעַמִּי
  choice: मुझसे और मेरी प्रजा से
  rationale: दोनों संज्ञाओं के साथ दोहराए गए מִן को ‘से’ की पुनरावृत्ति द्वारा सुरक्षित रखा गया है। फ़िरौन के अधीन लोगों के लिए ‘मेरी प्रजा’ प्रसंगानुकूल है।
- source_word: וַאֲשַׁלְּחָה אֶת־הָעָם
  choice: तब मैं इस प्रजा को जाने दूँगा
  rationale: कोहोर्टेटिव फ़िरौन की घोषित इच्छा या प्रतिज्ञा बताता है। निर्गमन के आवर्ती प्रयोग में שלח का अर्थ लोगों को मुक्त होकर जाने देना है। ‘इस प्रजा’ पहले उल्लिखित ‘मेरी प्रजा’ से समूह का भेद स्पष्ट रखता है।
- source_word: וְיִזְבְּחוּ
  choice: ताकि वे ... बलिदान चढ़ाएँ
  rationale: यह क्रिया फ़िरौन द्वारा प्रजा को जाने देने के अभिप्रेत उद्देश्य या परिणाम को व्यक्त कर सकती है। ‘बलिदान चढ़ाएँ’ वर्तमान हिन्दी में स्वाभाविक धार्मिक अभिव्यक्ति है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम स्पष्ट रूप से आया है। उसका लिप्यंतरण नाम की विशिष्टता को बनाए रखता है और उसे किसी उपाधि में नहीं बदलता।
- issue: अंतिम उपवाक्य וְיִזְבְּחוּ का संबंध
  choice: उद्देश्य—‘ताकि वे ... बलिदान चढ़ाएँ’
  alternative: साधारण समन्वय—‘और वे ... बलिदान चढ़ाएँ’
  rationale: फ़िरौन की प्रतिज्ञा के बाद अपूर्ण क्रिया उसके अभिप्रेत उद्देश्य या परिणाम के रूप में स्वाभाविक रूप से समझी जा सकती है, यद्यपि व्याकरण साधारण समन्वय की संभावना भी रहने देता है।
- issue: फ़िरौन की प्रार्थना-संबंधी माँग की तीव्रता
  choice: विनती करो
  alternative: प्रार्थना करो; मध्यस्थता करो
  rationale: हिब्रू क्रिया आग्रहपूर्ण निवेदन का भाव रखती है। ‘विनती’ उस तीव्रता को बनाए रखती है, पर किसी विशिष्ट संस्थागत मध्यस्थता-सिद्धांत को पाठ में नहीं जोड़ती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘फ़िरौन’, ‘प्रजा’, ‘विनती’ और ‘बलिदान चढ़ाना’ बाइबलीय प्रसंग के अनुकूल होने के साथ आज की मानक हिन्दी में बोधगम्य हैं। दोनों वास्तविक भाषिक विकल्पों को पादटिप्पणियों में सुरक्षित रखा गया है।
