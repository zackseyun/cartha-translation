  text: וַ/יֵּ֤ט אַהֲרֹן֙ אֶת יָד֔/וֹ עַ֖ל מֵימֵ֣י מִצְרָ֑יִם וַ/תַּ֨עַל֙ הַ/צְּפַרְדֵּ֔עַ וַ/תְּכַ֖ס אֶת אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/002.yaml
  text: So Aaron stretched out his hand over the waters of Egypt[a], and the frogs came up and covered the land of Egypt.
translation:
  language: hi
  text: तब हारून ने मिस्र के जल के ऊपर अपना हाथ बढ़ाया; और मेंढक[a] निकल आए और उन्होंने मिस्र देश को ढक लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘मेंढक’ एकवचन है, पर सम्भवतः यहाँ यह शब्द सामूहिक अर्थ में सभी मेंढकों के लिए प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּט
  choice: बढ़ाया
  rationale: हाथ के साथ यह क्रिया किसी दिशा में हाथ फैलाने या बढ़ाने की संकेतात्मक क्रिया बताती है; आधुनिक हिन्दी में ‘हाथ बढ़ाया’ स्वाभाविक और सटीक है।
- source_word: יָדוֹ
  choice: अपना हाथ
  rationale: इब्रानी में स्पष्ट रूप से ‘उसका हाथ’ है। हिन्दी में कर्ता हारून की ओर लौटते स्वामित्व के लिए ‘अपना हाथ’ अधिक स्वाभाविक है और मूल बिंब को बनाए रखता है।
- source_word: עַל
  choice: के ऊपर
  rationale: यहाँ हाथ और मिस्र के जल के बीच स्थानिक संबंध है; ‘के ऊपर’ इसे स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מֵימֵי מִצְרַיִם
  choice: मिस्र के जल
  rationale: बहुवचन रचना मिस्र के समस्त जल को सामूहिक रूप से दर्शाती है। ‘मिस्र के जल’ मूल की व्यापकता बनाए रखता है और ‘जलाशय’ जैसी अधिक विशिष्ट धारणा नहीं जोड़ता।
- source_word: וַתַּעַל
  choice: निकल आए
  rationale: यह क्रिया जल से ऊपर आकर भूमि पर प्रकट होने की गति बताती है। मेंढकों के संदर्भ में ‘निकल आए’ सहज आधुनिक हिन्दी है।
- source_word: הַצְּפַרְדֵּעַ
  choice: मेंढक
  rationale: इब्रानी संज्ञा रूप की दृष्टि से एकवचन है, पर यहाँ उसका अर्थ सामूहिक है। हिन्दी का बहुवचन-सदृश सामान्य रूप ‘मेंढक’ इस सामूहिक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַתְּכַס
  choice: ढक लिया
  rationale: כסה का सीधा अर्थ ‘ढकना’ है। ‘ढक लिया’ भूमि पर मेंढकों के व्यापक रूप से फैल जाने को बिना अतिरिक्त व्याख्या के व्यक्त करता है।
- source_word: אֶרֶץ מִצְרַיִם
  choice: मिस्र देश
  rationale: यहाँ אֶרֶץ मिस्र के भूभाग या देश को दर्शाता है, संपूर्ण पृथ्वी को नहीं। ‘मिस्र देश’ स्पष्ट, संक्षिप्त और बाइबिलीय वर्णन के अनुकूल है।
