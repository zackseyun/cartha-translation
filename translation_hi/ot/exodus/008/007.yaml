base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/007.yaml
  text: And the frogs will depart from you[a], and from your houses, and from your servants, and from your people; only in the Nile will they remain.
translation:
  language: hi
  text: और मेंढक तेरे पास से, तेरे घरों से, तेरे सेवकों से और तेरी प्रजा से चले जाएँगे; वे केवल नील नदी[a] में रह जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “नदी में।” इब्रानी शब्द יְאֹר का अर्थ “नदी” हो सकता है, पर निर्गमन की पुस्तक में यह सामान्यतः विशेष रूप से नील नदी के लिए प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָרוּ
  choice: चले जाएँगे
  rationale: सוּר का मूल भाव हटने या चले जाने का है। विपत्ति के समाप्त होने के इस संदर्भ में ‘चले जाएँगे’ स्वाभाविक है और यह नहीं कहता कि मेंढक नष्ट कर दिए जाएँगे।
- source_word: הַצְפַרְדְּעִים
  choice: मेंढक
  rationale: निश्चित बहुवचन संज्ञा का सीधा और सामान्य हिन्दी रूप।
- source_word: מִמְּךָ
  choice: तेरे पास से
  rationale: शाब्दिक अर्थ ‘तुझ से’ है, पर यहाँ फ़िरौन की उपस्थिति या निकटता से हटने का भाव है; ‘तेरे पास से’ आधुनिक हिन्दी में अधिक स्वाभाविक है।
- source_word: וּמִבָּתֶּיךָ
  choice: तेरे घरों से
  rationale: इब्रानी बहुवचन को हिन्दी में भी स्पष्ट रूप से बनाए रखा गया है।
- source_word: וּמֵעֲבָדֶיךָ
  choice: तेरे सेवकों से
  rationale: עֶבֶד का अर्थ सेवक, दास या अधिकारी हो सकता है। यहाँ ‘सेवकों’ से फ़िरौन के अधीन लोगों का व्यापक अर्थ बना रहता है और किसी विशेष सामाजिक स्थिति को अनावश्यक रूप से निश्चित नहीं किया जाता।
- source_word: וּמֵעַמֶּךָ
  choice: तेरी प्रजा से
  rationale: फ़िरौन के अधीन जनसमुदाय के लिए ‘प्रजा’ सन्दर्भानुकूल और स्वाभाविक है।
- source_word: רַק
  choice: केवल
  rationale: 'यह सीमा या अपवाद को स्पष्ट करता है: मेंढक अन्य स्थानों से चले जाएँगे, पर नील में रहेंगे।'
- source_word: בַּיְאֹר
  choice: नील नदी में
  rationale: निर्गमन के सन्दर्भ में יְאֹר सामान्यतः विशेष रूप से नील नदी को दर्शाता है। ‘नील नदी’ आधुनिक पाठक के लिए स्पष्ट है; सामान्य ‘नदी’ को पादटिप्पणी में रखा गया है।
- source_word: תִּשָּׁאַרְנָה
  choice: रह जाएँगे
  rationale: निफ़अल रूप शेष रहने या बचे रहने का भाव देता है। ‘रह जाएँगे’ इस अर्थ को सहज हिन्दी में व्यक्त करता है।
