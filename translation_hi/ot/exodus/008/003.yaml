review_pass:
  verdict: revise
  source_fidelity: ‘वैसा ही किया’ correctly represents וַיַּעֲשׂוּ כֵן, ‘जादूगरों’ is an appropriate contextual rendering of הַחַרְטֻמִּים, and ‘अपनी गुप्त विद्याओं से’ preserves the instrumental and deliberately nonspecific sense of בְּלָטֵיהֶם. However, ‘मेंढक चढ़ा लाए’ is not idiomatic modern Hindi for the causative Hiphil וַיַּעֲלוּ and can suggest that the magicians themselves brought the frogs along. ‘मेंढकों को ... चढ़ा दिया’ states that they caused the frogs to come up onto the land.
  naturalness: The draft is generally clear and has an appropriate restrained narrative register. Revising the final clause improves idiomatic flow and makes the grammatical relation between the magicians and frogs explicit.
  terminology: ‘जादूगरों’ and ‘गुप्त विद्याओं’ are suitable modern Hindi choices. The footnote appropriately supplies possible more specific alternatives without asserting that the Hebrew identifies one particular technique.
  issues:
  - severity: medium
    issue: ‘मेंढक चढ़ा लाए’ is an awkward and potentially misleading rendering of the causative verb.
    rationale: The Hiphil of עלה means that the magicians caused the frogs to come up. In Hindi, ‘चढ़ा लाए’ can imply personally bringing something upward; ‘मेंढकों को ... चढ़ा दिया’ more clearly retains the causative force.
  revised_text: और जादूगरों ने भी अपनी गुप्त विद्याओं[a] से वैसा ही किया और मेंढकों को मिस्र देश पर चढ़ा दिया।
