  yaml_path: translation/ot/exodus/008/003.yaml
  text: And the magicians did the same by their secret arts[a], and they brought up the frogs over the land of Egypt.
translation:
  language: hi
  text: और जादूगरों ने भी अपनी गुप्त विद्याओं[a] से वैसा ही किया और मेंढकों को मिस्र देश पर चढ़ा दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपने मंत्रों से’ अथवा ‘अपनी तांत्रिक विद्याओं से।’
    reason: בְּלָטֵיהֶם गुप्त, मंत्रात्मक या गूढ़ जादुई साधनों को सूचित कर सकता है; मूल किसी एक विशिष्ट तकनीक को निश्चित नहीं करता।
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: वैसा ही किया
  rationale: यह मुहावरा पहले किए गए कार्य के समान कार्य करने का भाव व्यक्त करता है; यह चयन तुलना के बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: הַחֲרְטֻמִּים
  choice: जादूगरों
  rationale: निर्गमन के संदर्भ में यह फ़िरौन के दरबार के उन विशेषज्ञों को दर्शाता है जो गूढ़ साधनों से चिन्हों की नकल करते हैं; ‘जादूगर’ आधुनिक हिन्दी में स्पष्ट और प्रचलित है।
- source_word: בְּלָטֵיהֶם
  choice: अपनी गुप्त विद्याओं से
  rationale: यह पद साधन के साथ गुप्त या गूढ़ जादुई क्रियाओं का संकेत देता है; ‘गुप्त विद्याओं’ मूल की अस्पष्टता को किसी निश्चित विधि में सीमित नहीं करता।
- source_word: וַיַּעֲלוּ
  choice: चढ़ा लाए
  rationale: 'हिफ़ील रूप का कारक भाव सुरक्षित है: जादूगरों ने मेंढकों को ऊपर भूमि पर आने दिया या पहुँचाया।'
- source_word: אֶת הַצְפַרְדְּעִים
  choice: मेंढक
  rationale: निश्चित बहुवचन संज्ञा है; हिन्दी में जातिवाचक बहुवचन का रूप ‘मेंढक’ ही रहता है और यहाँ अलग निश्चिततासूचक शब्द आवश्यक नहीं।
- source_word: עַל אֶרֶץ מִצְרָיִם
  choice: मिस्र देश पर
  rationale: ‘पर’ עַל के स्थानिक भाव को सीधे व्यक्त करता है, जबकि ‘मिस्र देश’ אֶרֶץ מִצְרָיִם का स्वाभाविक और गरिमापूर्ण हिन्दी रूप है।
theological_decisions:
- issue: जादूगरों के कार्य की प्रकृति
  choice: वर्णन को सीधे इस रूप में रखा गया है कि जादूगर भी मेंढक चढ़ा लाए।
  alternative: इसे केवल दिखावटी नकल, भ्रम या छल के रूप में स्पष्ट करना।
  rationale: इब्रानी कथा इस कार्य को बिना किसी संशयात्मक योग्यता के बताती है। अनुवाद को पाठ से परे जाकर न तो प्राकृतिक व्याख्या जोड़नी चाहिए, न जादूगरों की सामर्थ्य की कोई अतिरिक्त धर्मवैज्ञानिक व्याख्या।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली। ‘गुप्त विद्याओं’ सामान्य पाठक के लिए बोधगम्य है और मूल के गूढ़ साधनों के भाव को बनाए रखता है; पादटिप्पणी वैकल्पिक अर्थ देती है।
