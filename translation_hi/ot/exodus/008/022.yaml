  text: וַ/יֹּ֣אמֶר מֹשֶׁ֗ה לֹ֤א נָכוֹן֙ לַ/עֲשׂ֣וֹת כֵּ֔ן כִּ֚י תּוֹעֲבַ֣ת מִצְרַ֔יִם נִזְבַּ֖ח לַ/יהוָ֣ה אֱלֹהֵ֑י/נוּ הֵ֣ן נִזְבַּ֞ח אֶת תּוֹעֲבַ֥ת מִצְרַ֛יִם לְ/עֵינֵי/הֶ֖ם וְ/לֹ֥א יִסְקְלֻֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/022.yaml
  text: But Moses said[a], “It would not be right to do so, because we would sacrifice to Yahweh our God what is detestable to the Egyptians. If we sacrifice what is detestable to the Egyptians before their eyes, will they not stone us?”
translation:
  language: hi
  text: पर मूसा ने कहा, “ऐसा करना उचित नहीं होगा, क्योंकि हम अपने परमेश्वर यहोवा के लिए वह बलि चढ़ाएँगे जो मिस्रियों के लिए घृणित है।[a] यदि हम मिस्रियों की आँखों के सामने वही बलि चढ़ाएँ जो उनके लिए घृणित है, तो क्या वे हमें पत्थरों से मार नहीं डालेंगे?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, “मिस्रियों की घृणित वस्तु।” सम्भवतः इसका अर्थ वह है जिसे मिस्री घृणित मानते थे।
    reason: lexical_alternative
lexical_decisions:
- source_word: נָכוֹן
  choice: उचित
  rationale: यहाँ शब्द स्वीकार्य, ठीक या उपयुक्त होने का भाव देता है; ‘उचित’ नैतिक और व्यावहारिक दोनों पहलुओं को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לַעֲשׂוֹת כֵּן
  choice: ऐसा करना
  rationale: हिब्रू मुहावरे का संक्षिप्त और स्वाभाविक हिन्दी रूप।
- source_word: תּוֹעֲבַת מִצְרַיִם
  choice: जो मिस्रियों के लिए घृणित है
  rationale: सम्बन्धवाचक रचना में वास्तविक अस्पष्टता है; प्रसंग में वस्तुगत अर्थ—जिसे मिस्री घृणित मानते हैं—तर्क को सबसे स्पष्ट करता है, जबकि पादटिप्पणी अधिक शाब्दिक विकल्प सुरक्षित रखती है।
- source_word: נִזְבַּח
  choice: हम ... बलि चढ़ाएँगे
  rationale: अपूर्ण क्रिया यहाँ प्रस्ताव के अंतर्गत सोची गई भावी क्रिया व्यक्त करती है; हिन्दी में भविष्यकाल स्वाभाविक है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: व्यक्तिगत वाचा-नाम יהוה को हिन्दी में प्रचलित ध्वन्यात्मक रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: אֱלֹהֵינוּ
  choice: अपने परमेश्वर
  rationale: प्रथम पुरुष बहुवचन सम्बन्ध को ‘अपने’ स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: הֵן
  choice: यदि
  rationale: यहाँ यह एक जीवंत काल्पनिक शर्त का परिचय देता है।
- source_word: לְעֵינֵיהֶם
  choice: उनकी आँखों के सामने
  rationale: मूल की दृश्यात्मकता और सार्वजनिक रूप से किए जाने का बल बनाए रखता है।
- source_word: יִסְקְלֻנוּ
  choice: वे हमें पत्थरवाह नहीं करेंगे?
  rationale: क्रिया पत्थरों से मारने को निर्दिष्ट करती है; नकारात्मक आलंकारिक प्रश्न की अपेक्षित पुष्टि भी सुरक्षित रहती है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में वाचा-नाम प्रत्यक्ष है। हिन्दी पाठकों के लिए प्रतिष्ठित व्यक्तिगत नाम ‘यहोवा’ उसे उपाधि में बदले बिना पहचानने योग्य रूप में रखता है।
- issue: תּוֹעֲבַת מִצְרַיִם का अर्थ
  choice: जिसे मिस्री घृणित मानते हैं
  alternative: मिस्रियों की घृणित वस्तु / मिस्र का घृणित काम
  rationale: मिस्रियों की संभावित हिंसक प्रतिक्रिया वाला प्रसंग वस्तुगत अर्थ का समर्थन करता है; फिर भी निर्माण की शाब्दिक अस्पष्टता पादटिप्पणी में बताई गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘बलि चढ़ाना’, ‘आँखों के सामने’ और ‘पत्थरवाह करना’ बाइबलीय प्रसंग के परिचित तथा स्पष्ट पद हैं।
