base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/017.yaml
  text: For if you do not let my people go[a], behold, I am sending the swarm upon you, upon your servants, upon your people, and into your houses. The houses of Egypt will be filled with the swarm[b], and also the ground on which they are.
translation:
  language: hi
  text: क्योंकि यदि तू मेरी प्रजा को जाने नहीं देगा, तो देख, मैं तुझ पर, तेरे सेवकों पर, तेरी प्रजा पर और तेरे घरों में झुंड[a] भेजने वाला हूँ। मिस्र के घर उस झुंड से भर जाएँगे, और जिस ज़मीन[b] पर वे हैं, वह भी उस झुंड से भर जाएगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मक्खियों का झुंड’। हिब्रू शब्द עָרֹב संभवतः किसी प्रकार के झुंड को दर्शाता है; परंपरागत रूप से इसे मक्खियाँ समझा गया है, पर जीव की ठीक-ठीक पहचान निश्चित नहीं है।
    reason: lexical_alternative
  - marker: b
    text: या ‘भूमि’। हिब्रू אֲדָמָה का अर्थ ‘ज़मीन’ या ‘भूमि’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: क्योंकि यदि
  rationale: यह पद पिछले कथन के आधार पर शर्तयुक्त चेतावनी देता है; ‘क्योंकि यदि’ संयोजक और शर्त—दोनों को बनाए रखता है।
- source_word: אֵינְךָ מְשַׁלֵּחַ אֶת עַמִּי
  choice: तू मेरी प्रजा को जाने नहीं देगा
  rationale: निर्गमन-वृत्तांत में שׁלח का आशय बंधन से छोड़कर जाने देना है; यह हिंदी में स्वाभाविक और प्रसंगानुकूल है।
- source_word: הִנְנִי מַשְׁלִיחַ
  choice: तो देख, मैं ... भेजने वाला हूँ
  rationale: הִנְנִי के गंभीर ध्यानाकर्षण और कृदंत में निहित आसन्न, निश्चित कार्रवाई—दोनों को व्यक्त करता है।
- source_word: הֶעָרֹב
  choice: झुंड
  rationale: इस हिब्रू शब्द से किस जीव का झुंड अभिप्रेत है, यह निश्चित नहीं है। ‘झुंड’ उसकी सामूहिकता को व्यक्त करते हुए अनावश्यक रूप से ‘मक्खियाँ’ निर्धारित नहीं करता।
- source_word: בְּךָ וּבַעֲבָדֶיךָ וּבְעַמְּךָ וּבְבָתֶּיךָ
  choice: तुझ पर, तेरे सेवकों पर, तेरी प्रजा पर और तेरे घरों में
  rationale: दोहराए गए संबंधबोधकों की चेतावनीपूर्ण क्रमवृद्धि रखी गई है; घरों के साथ ‘में’ अगले वाक्य में उनके भर जाने से स्वाभाविक रूप से जुड़ता है।
- source_word: וּמָלְאוּ בָּתֵּי מִצְרַיִם
  choice: मिस्र के घर उस झुंड से भर जाएँगे
  rationale: हिब्रू परिणाम-वाचक भाव को सहज हिंदी में व्यक्त करता है और एकवचन सामूहिक संज्ञा से संबंध स्पष्ट करता है।
- source_word: וְגַם הָאֲדָמָה אֲשֶׁר הֵם עָלֶיהָ
  choice: और वह ज़मीन भी जिस पर वे हैं
  rationale: अर्थ और वाक्यगत अस्पष्टता को बनाए रखते हुए אֲדָמָה का सामान्य भौतिक अर्थ ‘ज़मीन’ चुना गया है।
