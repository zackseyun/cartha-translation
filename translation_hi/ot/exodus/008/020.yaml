base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/020.yaml
  text: And Yahweh did so[a], and a heavy swarm came into Pharaoh’s house and into his servants’ houses, and throughout all the land of Egypt the land was ruined because of the swarm.
translation:
  language: hi
  text: याहवे ने वैसा ही किया, और एक बहुत बड़ा झुंड[a] फ़िरौन के घर और उसके सेवकों के घरों में प्रवेश कर गया। मिस्र के पूरे देश की भूमि उस झुंड के कारण उजड़ गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द से झुंड में शामिल जीवों की ठीक-ठीक प्रजाति निश्चित नहीं होती। इसका अर्थ कीड़ों का विशाल झुंड हो सकता है; परंपरागत रूप से इसे मक्खियों का झुंड समझा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय आधुनिक हिन्दी में उसके प्रचलित ध्वन्यात्मक रूप में रखा गया है।
- source_word: וַיַּעַשׂ ... כֵּן
  choice: ने वैसा ही किया
  rationale: यह स्वाभाविक हिन्दी में बताता है कि याहवे ने घोषित बात के अनुसार कार्य किया।
- source_word: וַיָּבֹא
  choice: घुस आया
  rationale: आने की क्रिया और घरों के भीतर प्रवेश की दिशा—दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: עָרֹב
  choice: झुंड
  rationale: मूल शब्द से जीवों की ठीक-ठीक जाति निश्चित नहीं होती; इसलिए मुख्य पाठ में ‘मक्खियाँ’ जैसा संकीर्ण अर्थ नहीं जोड़ा गया।
- source_word: כָּבֵד
  choice: बहुत बड़ा
  rationale: शाब्दिक अर्थ ‘भारी’ है, पर झुंड की विशालता और तीव्रता बताने के लिए ‘बहुत बड़ा’ अधिक स्वाभाविक आधुनिक हिन्दी है।
- source_word: בֵּיתָה פַרְעֹה
  choice: फ़िरौन के घर
  rationale: मूल में दिशासूचक रूप और ‘घर’ है; ‘घुस आया’ प्रवेश का भाव स्पष्ट करता है, जबकि ‘महल’ कहकर अर्थ को अनावश्यक रूप से संकीर्ण नहीं किया गया।
- source_word: וּבֵית עֲבָדָיו
  choice: और उसके सेवकों के घरों में
  rationale: एकवचन समष्टिगत ‘घर’ को बहुवचन सेवकों के साथ हिन्दी में स्वाभाविक वितरणात्मक बहुवचन दिया गया है; ‘सेवक’ मूल शब्द की व्यापकता बनाए रखता है।
- source_word: וּבְכָל אֶרֶץ מִצְרַיִם
  choice: मिस्र के सारे देश में
  rationale: समूचे मिस्र में व्यापक प्रभाव को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: תִּשָּׁחֵת הָאָרֶץ
  choice: भूमि उजड़ गई
  rationale: निफ़अल क्रिया से भूमि के बुरी तरह बिगड़ने या बरबाद होने का भाव आता है; ‘उजड़ गई’ इसे व्यक्त करता है, पर पूर्ण विनाश का दावा नहीं करता।
- source_word: מִפְּנֵי הֶעָרֹב
  choice: उस झुंड के कारण
  rationale: यहाँ इब्रानी मुहावरा कारण बताता है; ‘के कारण’ उसका स्पष्ट हिन्दी रूप है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पद में व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ नाम को सुरक्षित रखता है, उसे किसी उपाधि से नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘बहुत बड़ा झुंड’ शाब्दिक ‘भारी झुंड’ की अपेक्षा स्वाभाविक हिन्दी है, जबकि पाद-टिप्पणी मूल शब्द की वास्तविक अनिश्चितता बनाए रखती है।
