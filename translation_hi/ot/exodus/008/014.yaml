  text: And the magicians did the same by their secret arts to bring out the gnats[a], but they were not able; and the gnats were on man and on beast.
translation:
  language: hi
  text: तब जादूगरों ने भी अपनी गुप्त कलाओं से कीट[a] उत्पन्न करने का वैसा ही प्रयत्न किया, पर वे सफल न हो सके; और वे कीट मनुष्यों और पशुओं पर थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जूँ।” इस इब्रानी शब्द से अभिप्रेत कीट की ठीक पहचान अनिश्चित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחַרְטֻמִּים
  choice: जादूगरों
  rationale: यह शब्द फ़िरौन के दरबार के अनुष्ठानिक और जादुई विद्या के विशेषज्ञों को सूचित करता है; ‘जादूगर’ आधुनिक हिन्दी में स्वाभाविक और प्रचलित है।
- source_word: בְּלָטֵיהֶם
  choice: अपनी गुप्त कलाओं से
  rationale: मूल शब्द छिपी हुई जादुई विधियों को दर्शाता है; यह अनुवाद अर्थ को स्पष्ट रखता है और किसी विशिष्ट तकनीक को अनावश्यक रूप से नहीं जोड़ता।
- source_word: לְהוֹצִיא
  choice: निकालने का प्रयत्न किया
  rationale: क्रिया का मूल अर्थ ‘बाहर निकालना’ है; प्रसंग में जादूगर इन्हें उत्पन्न करने की कोशिश कर रहे हैं, इसलिए प्रयत्न का भाव हिन्दी में स्पष्ट किया गया है।
- source_word: הַכִּנִּים / הַכִּנָּם
  choice: कुटकियाँ
  rationale: इस कीट की ठीक पहचान अनिश्चित है। ‘कुटकी’ छोटे काटने वाले कीट के लिए उपयुक्त हिन्दी शब्द है; वैकल्पिक पहचान पादटिप्पणी में दी गई है।
- source_word: וְלֹא יָכֹלוּ
  choice: पर वे ऐसा न कर सके
  rationale: यह उनकी असमर्थता को सहज और सीधे आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בָּאָדָם
  choice: मनुष्यों पर
  rationale: यहाँ אָדָם सामूहिक अर्थ में समस्त मनुष्यों को सूचित करता है; ‘मनुष्यों’ से हिन्दी में यही भाव स्वाभाविक रूप से आता है।
- source_word: וּבַבְּהֵמָה
  choice: और पशुओं पर
  rationale: בְּהֵמָה यहाँ सामूहिक रूप से पशुओं को दर्शाता है; बहुवचन हिन्दी में मानव-पशु युग्म को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: सामूहिक अर्थ में אָדָם का अनुवाद
  choice: मनुष्यों
  alternative: मनुष्य
  rationale: इब्रानी एकवचन संज्ञा सामूहिक अर्थ रखती है। हिन्दी में ‘मनुष्यों’ पूरे मानव समुदाय का अर्थ स्पष्ट करती है और इसे किसी एक पुरुष तक सीमित नहीं करती।
