base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/025.yaml
  text: And Moses said[a], “Look, I am going out from you, and I will plead with Yahweh, and the swarm will depart from Pharaoh, from his servants, and from his people tomorrow. Only let Pharaoh not continue to mock by not letting the people go to sacrifice to Yahweh.”
translation:
  language: hi
  text: तब मूसा ने कहा, “देख, मैं तेरे पास से जा रहा हूँ और यहोवा से विनती करूँगा। कल वह झुंड[a] फ़िरौन से, उसके सेवकों से और उसकी प्रजा से दूर हो जाएगा। पर फ़िरौन फिर ऐसा छल न करे कि लोगों को यहोवा के लिए बलि चढ़ाने जाने न दे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी עָרֹב संभवतः मक्खियों या अन्य झुंड बनाने वाले कीटों को सूचित करता है; इसकी ठीक पहचान अनिश्चित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: देख
  rationale: यह ध्यान आकर्षित करने वाला अव्यय है; आधुनिक हिंदी में ‘देख’ उसकी तात्कालिकता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יוֹצֵא מֵעִמָּךְ
  choice: तेरे पास से जा रहा हूँ
  rationale: יצא की गति और מֵעִמָּךְ के ‘तेरे पास/संग से’ भाव को स्पष्ट, सहज हिंदी में रखता है।
- source_word: וְהַעְתַּרְתִּי אֶל יְהוָה
  choice: यहोवा से विनती करूँगा
  rationale: עתר यहाँ साधारण प्रार्थना नहीं, बल्कि आग्रहपूर्ण मध्यस्थ विनती दर्शाता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी विशिष्ट ईश्वरीय नाम को हिंदी में प्रचलित ध्वन्यात्मक रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: וְסָר
  choice: हट जाएगा
  rationale: इस अकर्मक क्रिया का अर्थ यहाँ किसी स्थान से दूर हो जाना है; ‘हट जाएगा’ हिंदी में स्वाभाविक है।
- source_word: הֶעָרֹב
  choice: वह झुंड
  rationale: जीवों की ठीक प्रजाति अनिश्चित है; ‘झुंड’ अनावश्यक रूप से ‘मक्खियाँ’ निर्धारित नहीं करता और पहले से ज्ञात विपत्ति की ओर संकेत करता है।
- source_word: מִפַּרְעֹה מֵעֲבָדָיו וּמֵעַמּוֹ
  choice: फ़िरौन, उसके सेवकों और उसकी प्रजा के पास से
  rationale: तीनों प्रभावित पक्षों को बनाए रखते हुए दोहराए गए इब्रानी संबंधसूचक का सामूहिक, स्वाभाविक हिंदी रूप दिया गया है।
- source_word: מָחָר
  choice: कल
  rationale: सीधा कालवाचक अर्थ है; हिंदी में ‘कल’ प्रसंग से आगामी दिन को स्पष्ट करता है।
- source_word: רַק
  choice: केवल
  rationale: मूसा की चेतावनी और शर्त को संक्षेप में चिह्नित करता है।
- source_word: אַל יֹסֵף ... הָתֵל
  choice: फिर छल न करे
  rationale: יסף पुनरावृत्ति का और התל छलपूर्ण खिलवाड़ का भाव देता है; ‘फिर छल न करे’ दोनों को सहज हिंदी में समेटता है।
- source_word: לְבִלְתִּי שַׁלַּח
  choice: जाने से न रोके
  rationale: फ़िरौन के छल का ठोस रूप लोगों को जाने न देना है; हिंदी में निषेध को स्पष्ट और स्वाभाविक बनाता है।
- source_word: לִזְבֹּחַ
  choice: बलि चढ़ाने
  rationale: זבח सामान्य आराधना के बजाय बलिदान चढ़ाने की विशिष्ट क्रिया बताता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: मूल का व्यक्तिगत वाचा-नाम सामान्य उपाधि ‘प्रभु’ में नहीं बदला गया; आधुनिक हिंदी बाइबलीय प्रयोग में पहचाने जाने योग्य रूप ‘यहोवा’ रखा गया है।
- issue: עָרֹב की विशिष्ट पहचान
  choice: वह झुंड
  alternative: मक्खियों का झुंड
  rationale: शब्द किन जीवों को सूचित करता है, यह निश्चित नहीं है; व्यापक रूप मूल की वास्तविक अनिश्चितता बनाए रखता है।
- issue: הָתֵל का अर्थ-बल
  choice: छल करना
  alternative: उपहास करना
  rationale: प्रसंग में फ़िरौन का बार-बार वचन देकर लोगों को न जाने देना छलपूर्ण व्यवहार है; केवल ‘उपहास’ कहने से धोखे का तत्व कमजोर पड़ सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और बोलचाल में समझ आने योग्य रखी गई है। मूसा द्वारा फ़िरौन को सीधे संबोधित करने के कारण ‘तेरे’ का प्रयोग हुआ है। ‘बलि चढ़ाना’ धार्मिक क्रिया की विशिष्टता बनाए रखता है।
