  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה הַשְׁכֵּ֤ם בַּ/בֹּ֨קֶר֙ וְ/הִתְיַצֵּב֙ לִ/פְנֵ֣י פַרְעֹ֔ה הִנֵּ֖ה יוֹצֵ֣א הַ/מָּ֑יְמָ/ה וְ/אָמַרְתָּ֣ אֵלָ֗י/ו כֹּ֚ה אָמַ֣ר יְהוָ֔ה שַׁלַּ֥ח עַמִּ֖/י וְ/יַֽעַבְדֻֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/016.yaml
  text: 'Then the LORD said to Moses, “Rise early in the morning and station yourself before Pharaoh. Look, he is going out to the water, and you shall say to him, ‘Thus says the LORD: Let my people go, so that they may serve me.’”'
translation:
  language: hi
  text: 'तब यहोवा ने मूसा से कहा, “भोर को जल्दी उठकर फ़िरौन के सामने जा खड़े हो। देख, वह पानी की ओर निकल रहा है। उससे कहना, ‘यहोवा यों कहता है: मेरी प्रजा को जाने दे, ताकि वे मेरी सेवा करें।’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के विशिष्ट नाम को सामान्य उपाधि में बदलने के बजाय प्रचलित हिंदी रूप में रखा गया है।
- source_word: הִתְיַצֵּב
  choice: जा खड़े हो
  rationale: यह रूप फ़िरौन के सामने दृढ़तापूर्वक उपस्थित होने की आज्ञा को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: הַמָּיְמָה
  choice: पानी के पास
  rationale: दिशासूचक रूप का अर्थ पानी की ओर/पानी के पास जाना है; संदर्भ किसी विशेष नदी का नाम स्पष्टतः नहीं देता।
- source_word: וְיַעַבְדֻנִי
  choice: ताकि वे मेरी उपासना करें
  rationale: עבד धार्मिक संदर्भ में सेवा और उपासना दोनों का भाव रखता है; फ़िरौन से माँगी गई रिहाई का उद्देश्य यहाँ यहोवा की उपासना करना है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में व्यक्तिगत वाचा-नाम आया है; उसे उपाधि ‘प्रभु’ से प्रतिस्थापित न करके उसका प्रचलित हिंदी लिप्यंतरण चुना गया है।
- issue: עבד में सेवा और उपासना का संबंध
  choice: उपासना करें
  alternative: सेवा करें
  rationale: मिस्र से निकलने की माँग के धार्मिक उद्देश्य को ‘उपासना’ स्पष्ट करता है, यद्यपि मूल क्रिया में सेवा का व्यापक भाव भी निहित है।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण किंतु सहज शैली। प्रत्यक्ष वचन के भीतर उद्धरण-स्तर स्पष्ट रखे गए हैं। ‘देख’ से הִנֵּה का ध्यानाकर्षक बल सुरक्षित है।
