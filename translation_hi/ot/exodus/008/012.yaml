- from: तब याहवे ने मूसा से कहा, “हारून से कह, ‘अपनी लाठी बढ़ाकर भूमि की धूल पर मार; तब वह सारे मिस्र देश में छोटे-छोटे कीड़े[a] बन जाएगी।’”
  to: तब याहवे ने मूसा से कहा, “हारून से कह, ‘अपनी लाठी आगे बढ़ा और भूमि की धूल पर प्रहार कर; तब वह सारे मिस्र देश में छोटे-छोटे कीड़ों में बदल जाएगी।’”
