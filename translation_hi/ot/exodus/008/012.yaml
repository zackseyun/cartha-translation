review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the narrative sequence, the divine name, the command to Aaron, the staff, the dust, the resulting infestation, and its extent across Egypt. The uncertain identification of כִּנִּים is appropriately retained in a footnote.
  naturalness: ‘अपनी लाठी बढ़ाकर’ can sound as though Aaron is lengthening the staff rather than extending it. Rendering the two Hebrew imperatives separately is clearer and more natural. ‘धूल ... कीड़े बन जाएगी’ is understandable but is smoother as ‘धूल ... कीड़ों में बदल जाएगी.’
  terminology: ‘याहवे,’ ‘मूसा,’ ‘हारून,’ and ‘लाठी’ are suitable modern Hindi forms. The broad main-text expression ‘छोटे-छोटे कीड़े’ properly avoids deciding the disputed insect species. The footnote should omit the comparatively obscure and potentially misleading alternative ‘कुटकियाँ.’
  issues:
  - severity: medium
    issue: The phrase ‘अपनी लाठी बढ़ाकर’ is ambiguous and unnatural in this context.
    rationale: The Hebrew נְטֵה means extend/stretch out; in Hindi, ‘लाठी बढ़ाना’ may suggest making it longer. ‘अपनी लाठी आगे बढ़ा’ clearly expresses the commanded gesture.
  - severity: low
    issue: The result clause can be phrased more idiomatically.
    rationale: ‘धूल ... छोटे-छोटे कीड़े बन जाएगी’ is grammatically possible, but ‘छोटे-छोटे कीड़ों में बदल जाएगी’ more naturally states the transformation expressed by וְהָיָה לְכִנִּם.
  - severity: low
    issue: The footnote’s alternative ‘कुटकियाँ’ is not a clear modern-Hindi equivalent.
    rationale: Since the Hebrew insect is uncertain, the note should state that uncertainty without introducing an obscure or overly specific Hindi term.
  revised_text: तब याहवे ने मूसा से कहा, “हारून से कह, ‘अपनी लाठी आगे बढ़ा और भूमि की धूल पर प्रहार कर; तब वह सारे मिस्र देश में छोटे-छोटे कीड़ों में बदल जाएगी।’”
  revised_footnotes:
