base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/012.yaml
  text: Then Yahweh said to Moses[a], “Say to Aaron, ‘Stretch out your staff and strike the dust of the earth, and it will become gnats throughout all the land of Egypt.’”
translation:
  language: hi
  text: तब याहवे ने मूसा से कहा, “हारून से कह, ‘अपनी लाठी आगे बढ़ा और भूमि की धूल पर प्रहार कर; तब वह सारे मिस्र देश में छोटे-छोटे कीड़ों में बदल जाएगी।’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के विशिष्ट वाचा-नाम को उपाधि से बदलने के बजाय आधुनिक हिन्दी में निकट लिप्यंतरण द्वारा रखा गया है।
- source_word: וַיֹּאמֶר
  choice: तब ... ने ... कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; ‘तब’ हिन्दी में स्वाभाविक कथात्मक प्रगति व्यक्त करता है।
- source_word: אֱמֹר
  choice: से कह
  rationale: यह मूसा को दिया गया संक्षिप्त आदेश है कि वह हारून तक वचन पहुँचाए।
- source_word: נְטֵה אֶת־מַטְּךָ
  choice: अपनी लाठी बढ़ाकर
  rationale: נטה का अर्थ आगे फैलाना या बढ़ाना है; ‘लाठी’ आधुनिक हिन्दी में staff का स्पष्ट और स्वाभाविक रूप है।
- source_word: וְהַךְ
  choice: पर मार
  rationale: נכה के आदेशात्मक रूप का सीधा अर्थ प्रहार करना है; यहाँ ‘मार’ सहज हिन्दी है।
- source_word: עֲפַר הָאָרֶץ
  choice: भूमि की धूल
  rationale: मूल पदबंध में बारीक मिट्टी या धूल का भाव है; यह रूप उसकी ठोस छवि बनाए रखता है।
- source_word: וְהָיָה לְכִנִּם
  choice: तब वह ... छोटे-छोटे कीड़े बन जाएगी
  rationale: היה परिणामस्वरूप परिवर्तन को दर्शाता है। כִּנִּם की सटीक कीट-प्रजाति अनिश्चित होने के कारण मुख्य पाठ में व्यापक, समझने योग्य पद रखा गया है।
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: सारे मिस्र देश में
  rationale: यह पूरे मिस्र में व्यापक फैलाव को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ विशिष्ट चतुरक्षरीय वाचा-नाम का प्रयोग करता है। ‘याहवे’ उसे उपाधि में बदले बिना और किसी संप्रदायगत व्याख्या को जोड़े बिना प्रस्तुत करता है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। छोटे कीड़ों की सटीक पहचान के विषय में मूल इब्रानी की अनिश्चितता मुख्य पाठ और पाद-टिप्पणी में सुरक्षित रखी गई है।
