base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/013.yaml
  text: And they did so[a]. Aaron stretched out his hand with his staff and struck the dust of the earth, and the gnats came upon man and beast[b]. All the dust of the earth became gnats throughout all the land of Egypt.
translation:
  language: hi
  text: तब उन्होंने वैसा ही किया। हारून ने अपनी लाठी के साथ हाथ बढ़ाया और धरती की धूल पर प्रहार किया। तब मनुष्यों और पशुओं पर कुटकियाँ[a] छा गईं। मिस्र देश भर में धरती की सारी धूल कुटकियाँ बन गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जूँ”; इब्रानी शब्द की सटीक कीट-जाति निश्चित नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: तब उन्होंने वैसा ही किया
  rationale: यह पूर्व आदेश के पालन को बताने वाला इब्रानी कथात्मक सूत्र है; ‘वैसा ही किया’ स्वाभाविक और अर्थनिष्ठ है।
- source_word: וַיֵּט אַהֲרֹן אֶת יָדוֹ בְמַטֵּהוּ
  choice: हारून ने अपनी लाठी के साथ अपना हाथ बढ़ाया
  rationale: נטה का अर्थ हाथ बढ़ाना है। ‘लाठी के साथ’ इब्रानी में साथ अथवा साधन—दोनों की सम्भावना को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: וַיַּךְ אֶת עֲפַר הָאָרֶץ
  choice: धरती की धूल पर प्रहार किया
  rationale: נכה के लिए ‘प्रहार किया’ गरिमापूर्ण आधुनिक विकल्प है और עפר की धूल वाली छवि को बनाए रखता है।
- source_word: הַכִּנָּם / כִנִּים
  choice: कुटकियाँ
  rationale: इस इब्रानी कीट-नाम की सटीक प्राणिवैज्ञानिक पहचान अनिश्चित है। ‘कुटकी’ छोटे काटने वाले जूँ-सदृश कीट के लिए उपयुक्त हिन्दी शब्द है; अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: בָּאָדָם וּבַבְּהֵמָה
  choice: मनुष्यों और पशुओं पर
  rationale: אָדָם यहाँ सामूहिक अर्थ में मानवजाति को सूचित करता है, इसलिए हिन्दी में समावेशी बहुवचन स्वाभाविक है; בְּהֵמָה के लिए ‘पशु’ व्यापक और सहज है।
- source_word: כָּל עֲפַר הָאָרֶץ הָיָה כִנִּים
  choice: धरती की सारी धूल कुटकियाँ बन गई
  rationale: ‘सारी’ כָּל की व्यापकता, ‘धूल’ पुनरुक्त चित्र, और ‘बन गई’ היה के परिणामसूचक अर्थ को व्यक्त करते हैं।
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: मिस्र देश भर में
  rationale: यह पूरे मिस्र देश में फैले प्रभाव को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: אָדָם का सामूहिक अर्थ
  choice: मनुष्यों
  alternative: मनुष्य
  rationale: यहाँ शब्द किसी एक पुरुष को नहीं, समस्त मानव समुदाय को पशुओं के समानांतर बताता है। बहुवचन हिन्दी में इस सामूहिक अर्थ को स्पष्ट करता है और कोई अतिरिक्त धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
