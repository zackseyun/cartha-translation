  text: 'And Moses said to Pharaoh[a], “Have this honor over me: when shall I plead for you, for your servants, and for your people, to cut off the frogs from you and from your houses? Only in the Nile shall they remain.”'
translation:
  language: hi
  text: 'तब मूसा ने फ़िरौन से कहा[a], “मुझ पर यह अधिकार रख: मैं तेरे लिए, तेरे सेवकों के लिए और तेरी प्रजा के लिए कब विनती करूँ कि मेंढक तुझसे और तेरे घरों से हटा दिए जाएँ? वे केवल नील नदी में ही रह जाएँगे।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक शाब्दिक रूप से, “मुझ पर गौरव/सम्मान कर।” इब्रानी मुहावरा कठिन है; प्रसंग में मूसा फ़िरौन को यह अधिकार दे रहा है कि वह समय तय करे, जब मूसा उसके लिए विनती करे।
