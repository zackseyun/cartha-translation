  text: और मैं अपने लोगों और तुम्हारे लोगों के बीच भेद करूँगा।[a] कल यह चिन्ह घटित होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “छुटकारा” अथवा “उद्धार।” इब्रानी शब्द परमेश्वर के छुड़ाने वाले कार्य का भाव रख सकता है; यहाँ वह इस्राएल और मिस्र के बीच भेद करने के रूप में व्यक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: और मैं ... करूँगा
  rationale: שׂים का मूल अर्थ ‘रखना/ठहराना’ है, पर अमूर्त कर्म פְדֻת और ‘के बीच’ वाली रचना के साथ हिन्दी में ‘भेद करना’ स्वाभाविक है।
- source_word: פְדֻת
  choice: भेद
  rationale: इस प्रसंग में परमेश्वर अपने लोगों और फ़िरौन के लोगों के साथ अलग-अलग व्यवहार करेगा। शब्द में ‘छुटकारा’ या ‘उद्धार’ का भाव भी हो सकता है; इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: בֵּין ... וּבֵין
  choice: '... और ... के बीच'
  rationale: दो समुदायों के बीच भेद या अलगाव बताने वाली इब्रानी सहसंबंधी रचना का स्वाभाविक हिन्दी रूप।
- source_word: עַמִּי
  choice: अपने लोगों
  rationale: परमेश्वर से संबद्ध समुदाय, अर्थात इस्राएल, को दर्शाने वाला प्रथम पुरुष संबंधसूचक रूप।
- source_word: עַמֶּךָ
  choice: तुम्हारे लोगों
  rationale: सम्बोधित फ़िरौन के लोगों, अर्थात मिस्रियों, को दर्शाने वाला द्वितीय पुरुष संबंधसूचक रूप।
- source_word: לְמָחָר
  choice: कल
  rationale: आने वाले दिन को सूचित करने वाला सीधा कालवाचक रूप।
- source_word: יִהְיֶה
  choice: प्रकट होगा
  rationale: शाब्दिक अर्थ ‘होगा’ है; ‘यह चिन्ह प्रकट होगा’ आगामी दैवी चिन्ह के घटित होकर दिखाई देने का अर्थ स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הָאֹת הַזֶּה
  choice: यह चिन्ह
  rationale: אוֹת निर्गमन के इस प्रसंग में परमेश्वर के कार्य को दर्शाने वाले चिन्ह या संकेत के लिए प्रयुक्त है।
theological_decisions:
- issue: פְדֻת को उसके उद्धार-संबंधी अर्थ में अनूदित किया जाए या प्रसंगगत भेद के अर्थ में
  choice: मुख्य पाठ में ‘भेद’
  alternative: ‘छुटकारा’ या ‘उद्धार’
  rationale: ‘मेरे लोगों और तुम्हारे लोगों के बीच’ वाली वाक्य-रचना यहाँ दोनों समुदायों के साथ परमेश्वर के भिन्न व्यवहार पर बल देती है। फिर भी शब्द में निहित उद्धार का भाव वास्तविक है, इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण शैली। ‘भेद करूँगा’ सामान्य पाठक के लिए स्वाभाविक है, जबकि पादटिप्पणी मूल शब्द की उद्धार-संबंधी अर्थ-छाया को बनाए रखती है।
