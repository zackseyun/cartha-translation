  text: וַ/יֹּ֖אמֶר לְ/מָחָ֑ר וַ/יֹּ֨אמֶר֙ כִּ/דְבָ֣רְ/ךָ֔ לְמַ֣עַן תֵּדַ֔ע כִּי אֵ֖ין כַּ/יהוָ֥ה אֱלֹהֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/006.yaml
  text: He said[a], “Tomorrow.” And he said, “According to your word, so that you may know that there is no one like Yahweh our God.”
translation:
  language: hi
  text: फिरौन ने कहा, “कल।” तब मूसा ने कहा, “जैसा आपने कहा है, वैसा ही होगा, ताकि आप जान लें कि हमारे परमेश्वर याहवे[a] के समान कोई नहीं है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में: יהוה (YHWH), ईश्वर का विशिष्ट नाम; यहाँ ‘याहवे’ लिप्यंतरित किया गया है।'
    reason: divine_name
lexical_decisions:
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: उसने कहा ... तब मूसा ने कहा
  rationale: दोनों क्रियाएँ संवाद का क्रम दिखाती हैं। पहले कर्ता को प्रसंग के अनुसार सर्वनाम से रखा गया है; दूसरे में स्वाभाविक हिन्दी और वक्ता की स्पष्टता के लिए ‘मूसा’ कहा गया है।
- source_word: לְמָחָר
  choice: कल
  rationale: यह फिरौन का संक्षिप्त प्रत्यक्ष उत्तर है और इब्रानी कालवाचक अभिव्यक्ति को सहज रूप से व्यक्त करता है।
- source_word: כִּדְבָרְךָ
  choice: जैसा आपने कहा है
  rationale: शाब्दिक अर्थ ‘आपके वचन के अनुसार’ है; चुना गया रूप आधुनिक हिन्दी में स्वाभाविक है और फिरौन द्वारा बताए समय को स्वीकार करने का भाव बनाए रखता है।
- source_word: לְמַעַן תֵּדַע
  choice: ताकि आप जान लें
  rationale: לְמַעַן उद्देश्य सूचित करता है और תֵּדַע द्वितीय पुरुष एकवचन है; आदरसूचक ‘आप’ फिरौन को संबोधन के अनुकूल है।
- source_word: אֵין כַּיהוָה
  choice: यहोवा के समान कोई नहीं है
  rationale: अस्तित्ववाचक निषेध और तुलनात्मक כ दोनों को स्पष्ट, स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: אֱלֹהֵינוּ
  choice: हमारे परमेश्वर
  rationale: इस प्रसंग में אֱלֹהִים रूप से बहुवचन होते हुए भी इस्राएल के एक परमेश्वर को सूचित करता है; हिन्दी में एकवचन ‘परमेश्वर’ उपयुक्त है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में वाचा का विशिष्ट नाम सीधे आया है। हिन्दी पाठकों में प्रचलित ‘यहोवा’ मुख्य पाठ में रखा गया है, जबकि अधिक संभावित विद्वत्तापरक उच्चारण ‘याहवे’ को पादटिप्पणी में बताया गया है; इसे सामान्य उपाधि ‘प्रभु’ से नहीं बदला गया।
- issue: तुलना का आशय
  choice: हमारे परमेश्वर यहोवा के समान कोई नहीं है
  alternative: यहोवा के अतिरिक्त कोई परमेश्वर नहीं है
  rationale: מִי/אֵין כְּ प्रकार की तुलना यहाँ ‘समान कोई नहीं’ कहती है। इसे ‘अतिरिक्त कोई परमेश्वर नहीं’ बनाना कथन को अधिक स्पष्ट एकेश्वरवादी सूत्र में बदल देता, इसलिए मूल की तुलनात्मक भाषा सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और कथात्मक है। फिरौन के लिए ‘आप’ का प्रयोग किया गया है। ‘जैसा आपने कहा है’ शाब्दिक ‘आपके वचन के अनुसार’ की अपेक्षा सामान्य पाठक के लिए अधिक स्वाभाविक है, जबकि अर्थ अक्षुण्ण रहता है।
