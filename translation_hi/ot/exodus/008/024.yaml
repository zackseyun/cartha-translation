  text: וַ/יֹּ֣אמֶר פַּרְעֹ֗ה אָנֹכִ֞י אֲשַׁלַּ֤ח אֶתְ/כֶם֙ וּ/זְבַחְתֶּ֞ם לַ/יהוָ֤ה אֱלֹֽהֵי/כֶם֙ בַּ/מִּדְבָּ֔ר רַ֛ק הַרְחֵ֥ק לֹא תַרְחִ֖יקוּ לָ/לֶ֑כֶת הַעְתִּ֖ירוּ בַּעֲדִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/024.yaml
  text: Then Pharaoh said, “I will let you go, so that you may sacrifice to Yahweh your God in the wilderness. Only, you must not go very far away. Plead for me.”
translation:
  language: hi
  text: तब फ़िरौन ने कहा, “मैं तुम्हें जाने दूँगा, ताकि तुम जंगल में अपने परमेश्वर याहवे को बलि चढ़ाओ। बस, बहुत दूर मत जाना। मेरे लिए प्रार्थना करो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमागत रूप कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אָנֹכִי אֲשַׁלַּח אֶתְכֶם
  choice: मैं तुम लोगों को जाने दूँगा
  rationale: इस बातचीत के संदर्भ में שׁלח का अर्थ जाने की अनुमति देना या मुक्त करना है। ‘तुम लोगों’ से बहुवचन संबोधन स्पष्ट होता है।
- source_word: וּזְבַחְתֶּם
  choice: ताकि ... बलि चढ़ाओ
  rationale: यहाँ संयोजन, जाने देने के उद्देश्य या अपेक्षित परिणाम को व्यक्त करता है; हिन्दी में ‘ताकि’ इस संबंध को स्पष्ट और स्वाभाविक बनाता है।
- source_word: לַיהוָה
  choice: याहवे को
  rationale: मूल पाठ में परमेश्वर का विशिष्ट वाचा-नाम יהוה है; ‘याहवे’ उसके प्रचलित विद्वत्तापूर्ण उच्चारण का हिन्दी लिप्यंतरण है।
- source_word: אֱלֹהֵיכֶם
  choice: अपने परमेश्वर
  rationale: द्वितीय पुरुष बहुवचन संबंध को हिन्दी में स्वाभाविक ढंग से व्यक्त करता है और याहवे को इस्राएल के परमेश्वर के रूप में पहचानता है।
- source_word: בַּמִּדְבָּר
  choice: जंगल में
  rationale: מִדְבָּר आबादी और खेती से दूर निर्जन प्रदेश को सूचित करता है। निर्गमन के संदर्भ में ‘जंगल’ सामान्य हिन्दी पाठक के लिए सहज है और केवल रेतीले मरुस्थल का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: רַק
  choice: बस
  rationale: यह फ़िरौन द्वारा लगाई गई सीमा या शर्त का स्वाभाविक हिन्दी परिचय है।
- source_word: הַרְחֵק לֹא תַרְחִיקוּ לָלֶכֶת
  choice: बहुत दूर मत जाना
  rationale: धातु के क्रियार्थक संज्ञा-रूप और सीमित क्रिया का मेल निषेध पर बल देता है; ‘बहुत दूर’ उस तीव्रता को सहज हिन्दी में बनाए रखता है।
- source_word: הַעְתִּירוּ בַּעֲדִי
  choice: मेरे लिए विनती करो
  rationale: העתיר यहाँ किसी की ओर से आग्रहपूर्वक प्रार्थना या निवेदन करने को दर्शाता है; ‘विनती करो’ उसकी तत्परता और मध्यस्थ भाव को सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: यह पद सामान्य उपाधि नहीं, चार-अक्षरीय विशिष्ट नाम יהוה का प्रयोग करता है। ‘याहवे’ उस नाम को नाम के रूप में बनाए रखता है और उसे ‘प्रभु’ में बदलकर मूल भेद को मिटाता नहीं।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। फ़िरौन की रियायत और उसके साथ लगी कठोर सीमा को छोटे, सीधे वाक्यों में व्यक्त किया गया है।
