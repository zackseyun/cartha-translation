  yaml_path: translation/ot/exodus/008/023.yaml
  text: We will go a three days' journey into the wilderness and sacrifice to Yahweh our God[b][a], just as he tells us.
translation:
  language: hi
  text: हम निर्जन प्रदेश में तीन दिन की यात्रा[a] करेंगे और याहवे, अपने परमेश्वर, के लिए बलिदान चढ़ाएँगे, ठीक जैसा वह हमसे कहेगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तीन दिन की दूरी।”
    reason: lexical_alternative
  - marker: b
    text: या, “ठीक जैसा वह हमसे कहता है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: तीन दिन की दूरी तक
  rationale: समय की माप के साथ דֶּרֶךְ उस अवधि में तय होने वाली यात्रा या दूरी का मुहावरेदार बोध देता है। यह चयन सरल आधुनिक हिन्दी में उस अर्थ को व्यक्त करता है; वैकल्पिक रूप पादटिप्पणी में रखा गया है।
- source_word: נֵלֵךְ
  choice: हम ... जाएँगे
  rationale: प्रथम पुरुष बहुवचन अपूर्ण क्रिया यहाँ भावी कार्य को स्वाभाविक रूप से व्यक्त करती है; अनावश्यक आज्ञार्थक या बाध्यता का भाव नहीं जोड़ा गया।
- source_word: בַּמִּדְבָּר
  choice: निर्जन प्रदेश में
  rationale: מִדְבָּר खुले, कम आबाद वन्य क्षेत्र को दर्शाता है और अनिवार्य रूप से रेतीला रेगिस्तान नहीं; इसलिए ‘निर्जन प्रदेश’ आधुनिक हिन्दी में उपयुक्त है।
- source_word: וְזָבַחְנוּ
  choice: और ... बलिदान चढ़ाएँगे
  rationale: זבח का अर्थ बलिदान के लिए पशु वध करना अथवा बलिदान अर्पित करना है। ‘बलिदान चढ़ाना’ हिन्दी में स्पष्ट और प्रचलित धार्मिक अभिव्यक्ति है।
- source_word: לַיהוָה
  choice: याहवे को
  rationale: לְ लाभार्थी अथवा प्राप्तकर्ता को सूचित करता है, और יהוה को उसके व्यक्तिगत वाचा-नाम के रूप में ‘याहवे’ लिप्यंतरित किया गया है।
- source_word: אֱלֹהֵינוּ
  choice: अपने परमेश्वर
  rationale: प्रथम पुरुष बहुवचन प्रत्यय का अर्थ ‘हमारा परमेश्वर’ है। हिन्दी वाक्य में कर्ता के साथ स्वाभाविक संबंध व्यक्त करने के लिए ‘अपने परमेश्वर’ चुना गया।
- source_word: כַּאֲשֶׁר
  choice: ठीक जैसा
  rationale: यह तुलना और दैवी निर्देश के अनुरूप कार्य करने का भाव व्यक्त करता है।
- source_word: יֹאמַר אֵלֵינוּ
  choice: वह हमसे कहेगा
  rationale: अपूर्ण क्रिया को भावी निर्देश के रूप में पढ़ना प्रसंगानुकूल है; वर्तमान या सामान्य कथन का सम्भव अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसे उपाधि से बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: יֹאמַר की कालगत अस्पष्टता
  choice: वह हमसे कहेगा
  alternative: वह हमसे कहता है
  rationale: अपूर्ण रूप अपेक्षित भावी निर्देश को व्यक्त कर सकता है, पर वर्तमान या सामान्य अर्थ भी व्याकरणतः सम्भव है; इसलिए विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘निर्जन प्रदेश’ मִדְבָּר को केवल रेतीले ‘रेगिस्तान’ तक सीमित नहीं करता। पादटिप्पणी चिह्न उन्हीं पदबंधों के तुरंत बाद रखे गए हैं जिनसे वे संबंधित हैं।
