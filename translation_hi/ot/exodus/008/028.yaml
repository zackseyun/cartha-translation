base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/028.yaml
  text: But Pharaoh hardened his heart this time also[a], and did not let the people go.
translation:
  language: hi
  text: लेकिन फ़िरौन ने इस बार भी अपने हृदय को कठोर कर लिया[a] और लोगों को जाने नहीं दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ है, “अपने हृदय को भारी कर लिया।” यह मुहावरा हठी या असंवेदनशील हो जाने का भाव देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכְבֵּד
  choice: कठोर कर लिया
  rationale: כבד का मूल अर्थ ‘भारी होना/करना’ है, पर ‘हृदय’ के साथ यह हठी और असंवेदनशील होने का मुहावरा है। ‘कठोर कर लिया’ स्वाभाविक हिन्दी में इस नैतिक प्रतिरोध को व्यक्त करता है और फ़िरौन की अपनी भूमिका बनाए रखता है।
- source_word: לִבּוֹ
  choice: अपने हृदय को
  rationale: हिब्रू में ‘हृदय’ इच्छा और मनोवृत्ति का केंद्र है। हिन्दी में कर्ता फ़िरौन की ओर लौटते संबंध को स्पष्ट करने के लिए ‘अपने’ स्वाभाविक है।
- source_word: גַּם בַּפַּעַם הַזֹּאת
  choice: इस बार भी
  rationale: यह पदबंध वर्तमान अवसर पर उसी व्यवहार की पुनरावृत्ति बताता है; ‘इस बार भी’ संक्षिप्त और स्वाभाविक हिन्दी है।
- source_word: וְלֹא שִׁלַּח
  choice: और ... जाने नहीं दिया
  rationale: निर्गमन के प्रसंग में שלח लोगों को मुक्त होकर जाने देने को दर्शाता है। ‘जाने नहीं दिया’ अनुमति और रिहाई, दोनों के भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: הָעָם
  choice: लोगों को
  rationale: यह निश्चितवाचक सामूहिक संज्ञा प्रसंग में इस्राएली लोगों को सूचित करती है; ‘लोगों’ से इसे स्वाभाविक रूप में व्यक्त किया गया है।
- source_word: וַ
  choice: लेकिन
  rationale: कथात्मक वाव क्रम को आगे बढ़ाता है, पर यहाँ विपत्ति से राहत मिलने के बाद फ़िरौन की विरोधी प्रतिक्रिया को ‘लेकिन’ स्पष्ट और स्वाभाविक ढंग से दिखाता है।
theological_decisions:
- issue: फ़िरौन के हृदय को कठोर करने में कर्तृत्व
  choice: फ़िरौन ने स्वयं अपने हृदय को कठोर किया
  alternative: फ़िरौन का हृदय कठोर हो गया / परमेश्वर ने यहाँ उसका हृदय कठोर किया
  rationale: इस पद में फ़िरौन स्पष्ट कर्ता है और क्रिया उसे सक्रिय भूमिका देती है। अनुवाद इसी कर्तृत्व को रखता है, जबकि निर्गमन के अन्य पदों में परमेश्वर के कर्तृत्व से उत्पन्न व्यापक कथात्मक और धर्मवैज्ञानिक तनाव को यहाँ समतल नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक शैली। ‘हृदय’ बाइबिलीय रूपक को बनाए रखता है, जबकि ‘कठोर कर लिया’ उसका सहज हिन्दी मुहावरेदार अर्थ देता है।
