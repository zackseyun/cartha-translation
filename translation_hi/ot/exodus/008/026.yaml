  text: וַ/יֵּצֵ֥א מֹשֶׁ֖ה מֵ/עִ֣ם פַּרְעֹ֑ה וַ/יֶּעְתַּ֖ר אֶל יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/026.yaml
  text: So Moses went out from Pharaoh and pleaded with Yahweh[a].
translation:
  language: hi
  text: तब मूसा फ़िरौन के पास से निकल गया और उसने यहोवा से विनती की[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहोवा से आग्रहपूर्वक प्रार्थना की।” इब्रानी क्रिया गंभीर और आग्रहपूर्ण विनती का भाव व्यक्त करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: निकल गया
  rationale: יצא का क़ाल रूप शारीरिक रूप से बाहर जाने या किसी स्थान से निकलने को दर्शाता है; आधुनिक हिन्दी में यह स्वाभाविक है और कथानक का क्रम बनाए रखता है।
- source_word: מֵעִם
  choice: के पास से
  rationale: מֵעִם संगति या उपस्थिति से अलग होने का भाव देता है। ‘फ़िरौन के पास से’ केवल ‘से’ की तुलना में उसकी उपस्थिति से प्रस्थान का संकेत अधिक स्पष्ट करता है।
- source_word: פַּרְעֹה
  choice: फ़िरौन
  rationale: निर्गमन में मिस्र के शासक की उपाधि का प्रचलित आधुनिक हिन्दी रूप।
- source_word: וַיֶּעְתַּר
  choice: विनती की
  rationale: עתר यहाँ साधारण प्रार्थना से अधिक आग्रहपूर्ण निवेदन या अनुनय का अर्थ देता है। ‘विनती की’ सहज, सम्मानपूर्ण हिन्दी में इस भाव को व्यक्त करता है; तीव्रता को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: אֶל
  choice: से
  rationale: אֶל का मूल भाव संबोधन की दिशा में ‘की ओर/को’ है, पर हिन्दी में ‘विनती करना’ के साथ संबोधित व्यक्ति के लिए ‘से’ स्वाभाविक कारक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय परमेश्वर-नाम יהוה को हिन्दी बाइबल परंपरा में व्यापक और पहचाने जाने वाले व्यक्तिनाम ‘यहोवा’ से प्रस्तुत किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में व्यक्तिनाम יהוה स्पष्ट रूप से है। ‘यहोवा’ आधुनिक हिन्दी पाठकों में प्रचलित रूप है और नाम को ‘प्रभु’ जैसी उपाधि से बदलने के बजाय उसकी नामात्मकता सुरक्षित रखता है; ‘याहवे’ अधिक संभावित प्राचीन उच्चारण का विकल्प है।
- issue: मूसा के निवेदन की प्रकृति
  choice: विनती की
  alternative: मन लगाकर प्रार्थना की; गिड़गिड़ाया
  rationale: עתר आग्रहपूर्ण प्रार्थना या अनुनय दर्शाता है, पर क्रिया अपने आप में भाव-भंगिमा या अपमानजनक गिड़गिड़ाहट निश्चित नहीं करती। इसलिए मुख्य पाठ में संयत ‘विनती की’ रखा गया और तीव्रता पादटिप्पणी में बताई गई।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘तब’ कथात्मक וַ का स्वाभाविक हिन्दी संयोजन है। ‘फ़िरौन के पास से निकल गया’ उपस्थिति से अलग होकर जाने की मूल सूक्ष्मता को स्पष्ट करता है।
