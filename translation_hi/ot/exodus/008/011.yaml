base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/011.yaml
  text: But when Pharaoh saw that there was relief[a], he hardened his heart and did not listen to them, just as Yahweh had said.
translation:
  language: hi
  text: लेकिन जब फ़िरौन ने देखा कि राहत मिली थी[a], तो उसने अपने हृदय को कठोर कर लिया और उनकी बात नहीं सुनी, जैसा यहोवा ने कहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘कुछ राहत मिली थी।’ इब्रानी शब्द राहत, अवकाश, दबाव कम होने या साँस लेने की मोहलत का भाव दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: देखा
  rationale: मूल क्रिया का सामान्य अर्थ ‘देखना’ है; यहाँ परिस्थिति में आए बदलाव को पहचानने का भाव भी स्वाभाविक रूप से व्यक्त होता है।
- source_word: כִּי הָיְתָה הָרְוָחָה
  choice: कि राहत मिल गई है
  rationale: הָרְוָחָה दबाव कम होने से मिली राहत, अवकाश या चैन को दर्शाता है। ‘राहत मिल गई’ विपत्ति के संदर्भ में सहज आधुनिक हिन्दी है।
- source_word: וְהַכְבֵּד אֶת לִבּוֹ
  choice: उसने अपने हृदय को कठोर कर लिया
  rationale: हिफ़ील रूप में फ़िरौन स्वयं कर्ता है। ‘हृदय को कठोर करना’ इब्रानी रूपक और निर्गमन की आवर्ती अभिव्यक्ति को बनाए रखता है।
- source_word: וְלֹא שָׁמַע אֲלֵהֶם
  choice: और उनकी बात नहीं सुनी
  rationale: שׁמע אֶל का अर्थ यहाँ किसी की बात सुनना या उस पर ध्यान देना है। यह अनुवाद ‘आज्ञा मानना’ जैसा अधिक विशिष्ट अर्थ जोड़े बिना अस्वीकार का भाव देता है।
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: ठीक जैसा यहोवा ने कहा था
  rationale: यह वाक्यांश पहले कही गई ईश्वरीय बात की पूर्ति बताता है; ‘कहा था’ हिन्दी कथा में पूर्वकालिकता स्पष्ट करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है, न कि किसी उपाधि से।
theological_decisions:
- issue: फ़िरौन के हृदय के कठोर होने में कर्तृत्व
  choice: इस पद में फ़िरौन को अपना हृदय कठोर करने वाला बताया गया है।
  alternative: उसका हृदय कठोर हो गया; अथवा इस पद में ईश्वर को निहित कर्ता माना जाए।
  rationale: इब्रानी में सक्रिय कारक रूप है और फ़िरौन उसका कर्ता है। इससे निर्गमन के अन्य पदों में परमेश्वर द्वारा फ़िरौन का हृदय कठोर किए जाने के कथनों के साथ मौजूद धार्मिक तनाव बिना सुलझाए सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथा-शैली अपनाई गई है। ‘फ़िरौन’, ‘हृदय’ और ‘यहोवा’ बाइबलीय संदर्भ के परिचित रूप हैं; वाक्य को सामान्य पाठक के लिए स्पष्ट रखा गया है।
