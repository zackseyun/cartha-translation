source:
  edition: WLC
  text: וְ/הִפְלֵיתִי֩ בַ/יּ֨וֹם הַ/ה֜וּא אֶת אֶ֣רֶץ גֹּ֗שֶׁן אֲשֶׁ֤ר עַמִּ/י֙ עֹמֵ֣ד עָלֶ֔י/הָ לְ/בִלְתִּ֥י הֱיֽוֹת שָׁ֖ם עָרֹ֑ב לְמַ֣עַן תֵּדַ֔ע כִּ֛י אֲנִ֥י יְהוָ֖ה בְּ/קֶ֥רֶב הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/018.yaml
  text: But on that day I will set apart the land of Goshen[a], where my people dwell, so that no swarm will be there[b], in order that you may know that I am Yahweh in the midst of the land.
translation:
  language: hi
  text: परन्तु उस दिन मैं गोशेन प्रदेश को, जहाँ मेरी प्रजा रहती है, अलग रखूँगा; वहाँ कीटों का कोई झुंड नहीं होगा[a], ताकि तू जान ले कि मैं, याहवे, इस देश के बीच में हूँ[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “झुंड” अथवा “मक्खियों का झुंड।” इब्रानी शब्द कीटों के किसी व्यापक समूह को सूचित कर सकता है; उसकी ठीक पहचान निश्चित नहीं है।
    reason: lexical_alternative
  - marker: b
    text: या “पृथ्वी के बीच में।” इब्रानी शब्द का अर्थ अधिक व्यापक हो सकता है, यद्यपि इस प्रसंग में संभवतः मिस्र देश अभिप्रेत है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִפְלֵיתִי
  choice: अलग रखूँगा
  rationale: हिफ़ील रूप यहाँ भेद करने अथवा विशेष रूप से अलग व्यवहार करने का भाव देता है; यह चयन गोशेन को विपत्ति से बचाकर अलग रखने का आशय स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֶרֶץ גֹּשֶׁן
  choice: गोशेन प्रदेश
  rationale: אֶרֶץ यहाँ भूभाग या क्षेत्र को सूचित करता है; आधुनिक हिन्दी में ‘प्रदेश’ भौगोलिक आशय को स्पष्ट करता है।
- source_word: עַמִּי עֹמֵד עָלֶיהָ
  choice: जहाँ मेरी प्रजा रहती है
  rationale: भूमि के संबंध में यह पदबंध वहाँ ठहरे रहने या निवास करने का मुहावरेदार अर्थ देता है, न कि केवल खड़े होने का।
- source_word: לְבִלְתִּי הֱיוֹת שָׁם
  choice: वहाँ ... नहीं होगा
  rationale: यह रचना उद्देश्य या परिणाम व्यक्त करती है कि वह विपत्ति गोशेन में उपस्थित नहीं होगी।
- source_word: עָרֹב
  choice: कीटों का झुंड
  rationale: इस शब्द की ठीक प्राणीवैज्ञानिक पहचान अनिश्चित है। ‘कीटों का झुंड’ केवल मक्खियों तक अर्थ सीमित किए बिना प्रसंग में स्पष्ट और स्वाभाविक है।
- source_word: לְמַעַן תֵּדַע
  choice: ताकि तू जान ले
  rationale: यह स्पष्ट उद्देश्यवाचक उपवाक्य है और क्रिया एकवचन पुल्लिंग में फ़िरौन को संबोधित करती है; इसलिए ‘तू’ रखा गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित प्रतिलेखन द्वारा परमेश्वर के व्यक्तिगत नाम को उपाधि से प्रतिस्थापित किए बिना रखा गया है।
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: इस देश के बीच में
  rationale: בְּקֶרֶב स्थानगत ‘बीच में’ का भाव देता है। प्रसंग में הָאָרֶץ से मिस्र देश सबसे स्वाभाविक रूप से अभिप्रेत है, जबकि व्यापक ‘पृथ्वी’ का पाठ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ व्यक्तिगत ईश्वरीय नाम का सीधे प्रयोग करता है; अतः उसे किसी उपाधि से बदलने के बजाय हिन्दी के परिचित प्रतिलेखन में रखा गया है।
- issue: בְּקֶרֶב הָאָרֶץ का दायरा
  choice: इस देश के बीच में
  alternative: पृथ्वी के बीच में
  rationale: तात्कालिक विपत्ति-वर्णन में मिस्र देश अभिप्रेत होना अधिक संभावित है, पर मूल का व्यापक अर्थ संभव है और उसे पादटिप्पणी में रखा गया है।
- issue: עָרֹב की पहचान
  choice: कीटों का झुंड
  alternative: मक्खियों का झुंड
  rationale: मूल शब्द की सटीक प्राणीवैज्ञानिक पहचान विवादित है; व्यापक अनुवाद अनिश्चितता को बनाए रखता है और किसी विशेष कीट को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। फ़िरौन के लिए मूल के एकवचन संबोधन को ‘तू’ से बनाए रखा गया है। विराम-चिह्नों द्वारा प्रतिज्ञा, परिणाम और उद्देश्य के क्रम को स्पष्ट किया गया है।
