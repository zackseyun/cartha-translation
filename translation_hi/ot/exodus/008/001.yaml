base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/001.yaml
  text: Then Yahweh said to Moses[a], “Say to Aaron, ‘Stretch out your hand with your staff over the rivers, over the canals, and over the pools, and bring up the frogs over the land of Egypt.’”
translation:
  language: hi
  text: तब याहवे ने मूसा से कहा, “हारून से कह, ‘अपनी लाठी हाथ में लेकर नदियों, नहरों[a] और तालाबों के ऊपर अपना हाथ बढ़ा, और मेंढकों को मिस्र देश पर ऊपर ले आ।’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “नील नदी की धाराओं”; इब्रानी शब्द मिस्र के संदर्भ में प्रायः नील से जुड़ी जलधाराओं के लिए आता है।
    reason: शाब्दिक विकल्प और मिस्री भौगोलिक संदर्भ स्पष्ट करना।
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमवाचक कथा को आगे बढ़ाता है; आधुनिक हिन्दी में “तब” घटनाक्रम को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार अक्षरों वाले परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नामरूप से प्रस्तुत किया गया है।
- source_word: אֱמֹר
  choice: कह
  rationale: यह मूसा को दिया गया एकवचन आज्ञार्थक निर्देश है, जो आगे हारून से कही जाने वाली बात आरम्भ करता है।
- source_word: נְטֵה אֶת־יָדְךָ בְּמַטֶּךָ
  choice: अपनी लाठी लेकर अपना हाथ ... बढ़ा
  rationale: נטה का अर्थ हाथ बढ़ाना है और בְּמַטֶּךָ साधन अथवा साथ रखी वस्तु को दर्शाता है; यह हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: הַנְּהָרֹת
  choice: नदियों
  rationale: सामान्य जलधाराओं के लिए प्रयुक्त शब्द को अगली दो जल-श्रेणियों से अलग रखा गया है।
- source_word: הַיְאֹרִים
  choice: नहरों
  rationale: मिस्री संदर्भ में बहुवचन शब्द प्रायः नील से जुड़ी जलधाराओं या नहरों को सूचित करता है; संक्षिप्त मुख्य पाठ में “नहरों” स्वाभाविक है और अधिक विशिष्ट विकल्प पादटिप्पणी में दिया गया है।
- source_word: הָאֲגַמִּים
  choice: तालाबों
  rationale: यह एकत्र जल वाले तालाबों या जलाशयों को दर्शाता है; “तालाब” साधारण आधुनिक हिन्दी में स्पष्ट है।
- source_word: וְהַעַל אֶת־הַצְפַרְדְּעִים
  choice: और मेंढकों को ... चढ़ा ला
  rationale: 'עלה के हिफ़ील आज्ञार्थक रूप का कारक भाव बनाए रखा गया है: हारून के संकेत द्वारा मेंढक जल से ऊपर और देश पर लाए जाएँ।'
- source_word: עַל אֶרֶץ מִצְרָיִם
  choice: मिस्र देश पर
  rationale: עַל के स्थानिक भाव को अनावश्यक रूप से “सारे देश में” बनाकर विस्तार नहीं दिया गया है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम है, इसलिए उसे “प्रभु” जैसी उपाधि से प्रतिस्थापित नहीं किया गया। हिन्दी पाठकों में स्थापित “यहोवा” रूप को चुना गया, जबकि “याहवे” अधिक प्रत्यक्ष आधुनिक लिप्यंतरण है।
