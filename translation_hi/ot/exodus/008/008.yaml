  text: So Moses and Aaron went out from Pharaoh[a], and Moses cried out to Yahweh concerning the frogs that he had set upon Pharaoh.
translation:
  language: hi
  text: तब मूसा और हारून फिरौन के पास से निकल गए, और मूसा ने उन मेंढकों के विषय में, जिन्हें उसने फिरौन पर डाल दिया था,[a] याहवे को पुकारा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “जिन्हें उसने फिरौन के विरुद्ध रखा था।” इब्रानी क्रिया का शाब्दिक अर्थ “रखना” या “स्थापित करना” है; विपत्ति के इस प्रसंग में “फिरौन पर डाल दिया” उसका स्वाभाविक भाव व्यक्त करता है।'
    reason: שָׂם לְפַרְעֹה के शाब्दिक और प्रसंगानुकूल अर्थों के बीच lexical alternative दर्ज करना।
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: निकल गए
  rationale: यह क्रिया फिरौन की उपस्थिति से बाहर जाने को बताती है; बहुवचन कर्ता ‘मूसा और हारून’ के अनुसार हिन्दी में बहुवचन प्रयोग स्वाभाविक है।
- source_word: מֵעִם פַּרְעֹה
  choice: फिरौन के पास से
  rationale: מֵעִם यहाँ फिरौन की उपस्थिति या संगति से अलग होकर जाने का भाव देता है; ‘के पास से’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: וַיִּצְעַק
  choice: पुकारा
  rationale: צעק तीव्र पुकार या सहायता की गुहार को व्यक्त करता है। ‘पुकारा’ केवल सामान्य प्रार्थना कहने की अपेक्षा मूल क्रिया की तीव्रता को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम יהוה है; इसलिए उपाधि से बदलने के बजाय उसका हिन्दी लिप्यंतरण किया गया है।
- source_word: עַל דְּבַר הַצְפַרְדְּעִים
  choice: उन मेंढकों के विषय में
  rationale: עַל דְּבַר का अर्थ यहाँ ‘के विषय में/के संबंध में’ है और निश्चित लेख पूर्ववर्ती विपत्ति के उन्हीं मेंढकों की ओर संकेत करता है।
- source_word: אֲשֶׁר שָׂם לְפַרְעֹה
  choice: जिन्हें उसने फिरौन पर डाल दिया था
  rationale: שׂים का मूल भाव रखना/स्थापित करना है; विपत्ति के प्रसंग में ‘पर डाल दिया’ स्वाभाविक हिन्दी है। ‘उसने’ मूल पाठ के अव्यक्त एकवचन कर्ता को अनावश्यक रूप से नामित नहीं करता।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: यहाँ मूल इब्रानी पाठ उपाधि नहीं बल्कि चार अक्षरों वाला व्यक्तिगत नाम प्रयोग करता है; ‘याहवे’ उसे नाम के रूप में सुरक्षित रखता है।
- issue: שָׂם का अव्यक्त कर्ता
  choice: ‘उसने’ कहकर व्याकरणिक अस्पष्टता बनाए रखना
  alternative: ‘याहवे ने’ या ‘परमेश्वर ने’ कहकर कर्ता स्पष्ट करना
  rationale: प्रसंग में संकेत याहवे की ओर है, पर इब्रानी क्रिया में कर्ता नाम से दोहराया नहीं गया। हिन्दी सर्वनाम मूल की अभिव्यक्ति और उसके तनाव को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्य-विन्यास हिन्दी के अनुकूल है, जबकि तीव्र पुकार, ईश्वरीय नाम और अंतिम उपवाक्य की कर्तृ-अस्पष्टता सुरक्षित रखी गई है।
