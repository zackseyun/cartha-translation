source:
  edition: WLC
  text: וַ/יֹּאמְר֤וּ הַֽ/חַרְטֻמִּים֙ אֶל פַּרְעֹ֔ה אֶצְבַּ֥ע אֱלֹהִ֖ים הִ֑וא וַ/יֶּחֱזַ֤ק לֵב פַּרְעֹה֙ וְ/לֹֽא שָׁמַ֣ע אֲלֵ/הֶ֔ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/015.yaml
  text: Then the magicians said to Pharaoh[a], “This is the finger of God.” But Pharaoh’s heart was hardened, and he did not listen to them[c][b], just as Yahweh had spoken.
translation:
  language: hi
  text: तब जादूगरों ने फ़िरौन से कहा, “यह परमेश्वर की उँगली है।”[a] फिर भी फ़िरौन का हृदय कठोर हो गया,[b] और उसने उनकी बात नहीं मानी, ठीक वैसे ही जैसे याहवे ने कहा था।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “परमेश्वर की उँगली” प्रत्यक्ष रूप से कार्य कर रही परमेश्वर की सामर्थ्य का चित्रात्मक वर्णन है।
    reason: cultural_note
  - marker: b
    text: या “फ़िरौन का हृदय दृढ़ हो गया।” इब्रानी में इस उपवाक्य के भीतर हृदय को कठोर करने वाला कर्ता स्पष्ट नहीं किया गया है।
    reason: lexical_alternative
  - marker: c
    text: 'इब्रानी: YHWH (याहवे); इसे परंपरागत रूप से “प्रभु” भी लिखा जाता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: הַחַרְטֻמִּים
  choice: जादूगरों
  rationale: यह शब्द फ़िरौन के अनुष्ठान और गुप्त विद्याओं से जुड़े विशेषज्ञों को दर्शाता है। ‘जादूगर’ आधुनिक हिन्दी में स्पष्ट और प्रचलित है तथा उनकी भूमिका को अनावश्यक रूप से अधिक विशिष्ट नहीं बनाता।
- source_word: אֶצְבַּע אֱלֹהִים הִוא
  choice: यह परमेश्वर की उँगली है
  rationale: यह इब्रानी की क्रियारहित संज्ञात्मक उक्ति को स्वाभाविक हिन्दी में व्यक्त करता है और प्रत्यक्ष दैवी सामर्थ्य के रूपक को बनाए रखता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: यद्यपि אֱלֹהִים के अन्य संदर्भों में बहुवचन या अनिश्चित अर्थ संभव हैं, यहाँ कथा और एकवचन अर्थ ‘परमेश्वर’ का समर्थन करते हैं।
- source_word: וַיֶּחֱזַק לֵב פַּרְעֹה
  choice: फ़िरौन का हृदय कठोर हो गया
  rationale: חזק यहाँ हृदय के दृढ़ या कठोर हो जाने का परिणाम बताता है। यह अनुवाद किसी ऐसे कर्ता को स्पष्ट नहीं करता जिसे इब्रानी वाक्य स्वयं स्पष्ट नहीं करता।
- source_word: שָׁמַע אֲלֵהֶם
  choice: उसने उनकी बात नहीं मानी
  rationale: שׁמע עם אֶל का अर्थ सुनना, ध्यान देना या मानना हो सकता है। प्रसंग में ‘बात नहीं मानी’ केवल ध्वनि सुनने के बजाय उनकी चेतावनी को स्वीकार न करने का भाव स्वाभाविक रूप से देता है।
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: ठीक वैसे ही जैसे यहोवा ने कहा था
  rationale: यह पूर्व में कही गई दैवी घोषणा की ओर संकेत करता है। ‘कहा था’ हिन्दी कथा-क्रम में स्वाभाविक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: दैवी नाम YHWH को हिन्दी में परिचित नामरूप ‘यहोवा’ से व्यक्त किया गया है, न कि उसे किसी उपाधि से बदलकर। पादटिप्पणी मूल नाम और पारंपरिक विकल्प स्पष्ट करती है।
theological_decisions:
- issue: दैवी नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में व्यक्तिगत दैवी नाम YHWH है। मुख्य पाठ में उसका हिन्दी में परिचित लिप्यंतरण रखा गया है; ‘प्रभु’ नाम के स्थान पर उपाधि रख देता।
- issue: फ़िरौन के हृदय के कठोर होने में कर्तृत्व
  choice: फ़िरौन का हृदय कठोर हो गया
  alternative: फ़िरौन ने अपना हृदय कठोर कर लिया; फ़िरौन का हृदय कठोर किया गया
  rationale: इस उपवाक्य में इब्रानी पाठ कठोर करने वाले कर्ता को स्पष्ट नहीं करता। परिणामसूचक हिन्दी रचना इस अस्पष्टता और उससे जुड़ी धर्मवैचारिक तनातनी को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी में है। ‘फ़िरौन’, ‘परमेश्वर’ और ‘यहोवा’ जैसे बाइबिलीय रूप सामान्य हिन्दी पाठकों के लिए परिचित हैं। मूल रूपक तथा कठोर होने के कर्तृत्व की अस्पष्टता बनाए रखी गई है।
