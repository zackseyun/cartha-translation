  register: भाषा आधुनिक, गरिमापूर्ण और निर्माण-विवरण के अनुरूप रखी गई है। मूल के सर्वनाम “उसके लिए” को मुख्य पाठ में अनावश्यक रूप से स्पष्ट नहीं किया गया। उपलब्ध अंग्रेज़ी परामर्श-पाठ की पादटिप्पणी-सूचियाँ अपने चिह्नों से असंगत थीं, इसलिए उन्हें हिन्दी पाठ में नहीं अपनाया गया।
