  yaml_path: translation/ot/exodus/036/036.yaml
  text: He made for it four pillars of acacia wood and overlaid them with gold[a]; their hooks were of gold[b]; and he cast for them four silver bases.
translation:
  language: hi
  text: उसने उसके लिए बबूल की लकड़ी के चार खंभे बनाए और उन पर सोना मढ़ा। उनके हुक सोने के थे; और उसने उनके लिए चाँदी के चार आधार ढाले।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַמּוּדֵי
  choice: खंभे
  rationale: यह शब्द खड़े संरचनात्मक सहारों को दर्शाता है; आधुनिक हिन्दी में “खंभे” स्वाभाविक और स्पष्ट है।
- source_word: שִׁטִּים
  choice: बबूल की लकड़ी
  rationale: यह तंबू के निर्माण में प्रयुक्त अकासिया-वर्ग की लकड़ी है; “बबूल की लकड़ी” हिन्दी पाठकों के लिए परिचित और स्पष्ट पद है।
- source_word: וַיְצַפֵּם
  choice: उन पर सोना मढ़ा
  rationale: धातु की परत चढ़ाने के अर्थ को “सोना मढ़ा” संक्षिप्त और स्वाभाविक हिन्दी में ठीक व्यक्त करता है।
- source_word: וָוֵיהֶם
  choice: उनके हुक
  rationale: तंबू के खंभों पर लगे जोड़ने या लटकाने वाले उपकरण अभिप्रेत हैं; “हुक” आधुनिक हिन्दी में सबसे सहज और वस्तुगत रूप से स्पष्ट है।
- source_word: אַדְנֵי
  choice: आधार
  rationale: ये वे धातु के आधार-पात्र थे जिनमें खंभे टिकाए जाते थे; “आधार” सरल आधुनिक हिन्दी है और “कुर्सियाँ” जैसे पुराने तकनीकी प्रयोग से अधिक स्पष्ट है।
- source_word: כָסֶף
  choice: चाँदी
  rationale: मूल भाषा में प्रयुक्त धातु का सीधा और निर्विवाद अर्थ।
- source_word: לָהּ
  choice: उसके लिए
  rationale: स्त्रीलिंग एकवचन सर्वनाम को मूल की तरह सर्वनाम रूप में रखा गया है; प्रसंग में इसका पूर्वपद पिछले पद का परदा है।
- source_word: וַיִּצֹק
  choice: ढाले
  rationale: धातु को साँचे में ढालकर आधार बनाने की क्रिया को सटीक और स्वाभाविक रूप से व्यक्त करता है।
