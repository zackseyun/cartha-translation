  yaml_path: translation/ot/exodus/036/005.yaml
  text: And they said to Moses[a], “The people are bringing much more than enough for the work of the task that Yahweh commanded to be done.”
translation:
  language: hi
  text: और उन्होंने मूसा से कहा, “जिस काम को करने की आज्ञा याहवे ने दी है, उसके लिए लोग आवश्यकता से कहीं अधिक[a] सामग्री ला रहे हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “लोग उस काम के लिए बहुत अधिक ला रहे हैं।” इब्रानी अभिव्यक्ति इस बात पर बल देती है कि लाई जा रही सामग्री आवश्यकता से अधिक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֶל־מֹשֶׁה לֵּאמֹר
  choice: और उन्होंने मूसा से कहा
  rationale: इब्रानी कथात्मक वाक्य-विन्यास और प्रत्यक्ष कथन की भूमिका को स्वाभाविक हिन्दी में व्यक्त किया गया है; לֵאמֹר का अलग से ‘यह कहते हुए’ अनावश्यक है।
- source_word: מַרְבִּים ... לְהָבִיא מִדֵּי
  choice: आवश्यकता से कहीं अधिक ... ला रहे हैं
  rationale: यह संयुक्त अभिव्यक्ति लोगों द्वारा लगातार लाई जा रही भेंटों के जरूरत से बढ़कर होने पर बल देती है।
- source_word: הָעָם
  choice: लोग
  rationale: इस्राएल के समुदाय के लिए स्वाभाविक सामूहिक हिन्दी पद।
- source_word: הָעֲבֹדָה לַמְּלָאכָה
  choice: उस काम के लिए ... सामग्री
  rationale: संदर्भ निवास-स्थान के निर्माण हेतु योगदान का है। हिन्दी में ‘सामग्री’ जोड़ने से लाई जा रही वस्तुओं का आशय स्पष्ट होता है, जबकि ‘काम’ कार्य-परियोजना को व्यक्त करता है।
- source_word: אֲשֶׁר צִוָּה יְהוָה לַעֲשֹׂת אֹתָהּ
  choice: जिसे करने की आज्ञा यहोवा ने दी है
  rationale: सम्बन्धवाचक उपवाक्य और परमेश्वर द्वारा आदेशित कार्य दोनों को निकट रूप से सुरक्षित रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में पवित्र नाम के प्रचलित, पहचाने जाने योग्य लिप्यंतरण का प्रयोग किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में आए व्यक्तिगत वाचा-नाम को ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया। आधुनिक हिन्दी बाइबल-पाठकों में ‘यहोवा’ अधिक परिचित रूप है, यद्यपि ‘याहवे’ ध्वन्यात्मक पुनर्निर्माण के अधिक निकट माना जाता है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘आवश्यकता से कहीं अधिक’ मूल के अतिशय अर्थ को स्पष्ट करता है; ‘सामग्री’ संदर्भ से निहित योगदानों को स्वाभाविक हिन्दी में सामने लाता है।
