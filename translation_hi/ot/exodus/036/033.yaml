revisions:
- from: उसने बीच का डंडा बनाया, जो तख्तों के भीतर से एक सिरे से दूसरे सिरे तक जाए[a][b]।
  to: उसने बीच वाला डंडा बनाया, जो तख्तों के बीच से एक सिरे से दूसरे सिरे तक जाता था[a][b]।
  rationale: Revision resolves the awkward subjunctive relative clause and avoids implying that the bar necessarily passed through the material of the boards. It retains the source’s description of the bar extending across the structural boards from one end to the other, while preserving the audit-trail lexical alternatives in anchored footnotes.
