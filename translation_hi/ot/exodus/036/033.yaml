lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: उसने ... बनाया
  rationale: עשה के क़ाल वय्यिक्तोल रूप का सामान्य कथात्मक अर्थ है ‘और उसने बनाया’; सहज हिन्दी वर्णन में आरम्भिक संयोजक को व्यक्त करना आवश्यक नहीं है।
- source_word: הַבְּרִיחַ
  choice: डंडा
  rationale: मिलापवाले तम्बू की रचना में בְּרִיחַ उन लम्बे डंडों को दर्शाता है जो तख्तों को एक साथ बाँधे रखते थे; ‘डंडा’ सामान्य पाठक के लिए स्वाभाविक और स्पष्ट है।
- source_word: הַתִּיכֹן
  choice: बीच का
  rationale: विशेषण का अर्थ मध्य या केन्द्र में स्थित है; ‘बीच का’ स्थानिक अर्थ को सरल आधुनिक हिन्दी में रखता है।
- source_word: לִבְרֹחַ
  choice: जाए
  rationale: इस स्थापत्य सन्दर्भ में ברח का क्रियार्थ डंडे के आर-पार जाने या पूरी लम्बाई में फैले होने का है; ‘जाए’ प्रयोजनसूचक रचना में स्वाभाविक है और वास्तविक गतिशील क्रिया पर अनावश्यक बल नहीं देता।
- source_word: בְּתוֹךְ
  choice: के भीतर से
  rationale: בְּתוֹךְ भीतर या मध्य में होने का बोध देता है; यहाँ डंडे के तख्तों के अन्दर से निकलने का स्थानिक भाव है।
- source_word: הַקְּרָשִׁים
  choice: तख्तों
  rationale: קֶרֶשׁ तम्बू के संरचनात्मक पटरे या चौखटे का संकेत कर सकता है; ‘तख्ता’ पारम्परिक होने के साथ सामान्य हिन्दी में समझने योग्य है।
- source_word: מִן הַקָּצֶה אֶל הַקָּצֶה
  choice: एक सिरे से दूसरे सिरे तक
  rationale: यह पदबंध सम्पूर्ण लम्बाई में विस्तार व्यक्त करता है; चुना हुआ रूप हिन्दी में स्पष्ट और स्वाभाविक है।
