  yaml_path: translation/ot/exodus/036/029.yaml
  text: They were paired at the bottom[a], and together they were complete up to its top, to the one ring. Thus he did for both of them[c][b], for the two corners.
translation:
  language: hi
  text: वे नीचे से एक-दूसरे के अनुरूप थे[a], और उसके ऊपरी सिरे पर एक ही कड़े में वे दोनों साथ-साथ पूर्ण थे[b]। उसने दोनों के लिए, अर्थात् दोनों कोनों के लिए, ऐसा ही किया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “नीचे से एक-दूसरे से मेल खाते हुए थे” अथवा “जोड़े में थे”; इब्रानी शब्द इस बात पर बल देता है कि दोनों भाग संरचना में एक-दूसरे के अनुरूप थे।
    reason: lexical_alternative
  - marker: b
    text: या “दोनों साथ-साथ अखंड थे।” भाव यह भी हो सकता है कि दोनों भाग नीचे से ऊपर तक पूरी तरह जुड़े या तैयार किए गए थे।
    reason: lexical_alternative
  - marker: c
    text: या “दोनों कोने के भागों के लिए”; इब्रानी में शाब्दिक रूप से “दोनों कोनों के लिए” है और संभवतः कोनों पर लगे चौखटों या तख्तों का संकेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תוֹאֲמִם
  choice: एक-दूसरे के अनुरूप जोड़े गए
  rationale: यह शब्द दो संरचनात्मक भागों के परस्पर मेल खाते हुए जोड़ा बनने का भाव देता है। यह हिन्दी में केवल ‘जुड़े’ कहने से अधिक स्पष्ट है और ‘जुड़वाँ’ जैसे अस्वाभाविक वास्तुशिल्पीय प्रयोग से बचता है।
- source_word: מִלְּמַטָּה
  choice: नीचे से
  rationale: यह जोड़ की आरम्भिक दिशा अथवा निचले भाग को सूचित करता है और मूल के ‘से/नीचे की ओर’ वाले भाव को सहज हिन्दी में रखता है।
- source_word: יַחְדָּו
  choice: दोनों मिलकर
  rationale: साधारण ‘साथ’ के अर्थ को संरचनात्मक संदर्भ में स्पष्ट करता है और दोनों भागों की संयुक्त अवस्था व्यक्त करता है।
- source_word: תַמִּים
  choice: पूरे
  rationale: मूल विशेषण के ‘संपूर्ण/अखंड’ अर्थ को बनाए रखता है; इसे केवल ‘जुड़े हुए’ कहना पहले क्रियापद के अर्थ में मिला देता और मूल की संभावित अर्थ-भिन्नता मिटा देता।
- source_word: אֶל רֹאשׁוֹ
  choice: ऊपर उसके सिरे तक
  rationale: אֶל की दिशात्मकता तथा नीचे से ऊपरी सिरे तक की वास्तुशिल्पीय प्रगति दोनों सुरक्षित रहती हैं। एकवचन सर्वनाम मूल के रूप को भी बनाए रखता है।
- source_word: הַטַּבַּעַת הָאֶחָת
  choice: एक ही कड़े पर
  rationale: निश्चित पद और संख्या को रखते हुए ‘एक ही’ दोनों भागों के एक कड़े पर मिलने का भाव स्वाभाविक हिन्दी में देता है; ‘पहला कड़ा’ कहना मूल से अधिक व्याख्यात्मक होता।
- source_word: כֵּן עָשָׂה
  choice: उसने ... इसी प्रकार बनाया
  rationale: निर्माण-संदर्भ में עשה के सामान्य अर्थ और כֵּן के पूर्ववर्णित ढंग की ओर संकेत को सहज हिन्दी में व्यक्त करता है।
- source_word: לִשְׁנֵיהֶם
  choice: उन दोनों को
  rationale: द्विवचन-सदृश संदर्भ को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
- source_word: לִשְׁנֵי הַמִּקְצֹעֹת
  choice: दोनों कोनों के लिए
  rationale: מִקְצֹעֹת का मूल ‘कोने’ अर्थ सुरक्षित रखता है और ‘कोने के तख्ते/चौखटे’ जैसी संदर्भगत व्याख्या को मुख्य पाठ में नहीं जोड़ता।
