base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/011.yaml
  text: He made loops of blue yarn on the edge of the first curtain at the end of the first set joined together[a]; likewise he made them on the edge of the outermost curtain in the second set joined together.
translation:
  language: hi
  text: उसने पहले जुड़े हुए समूह[a] के छोर पर वाली पहली परदे की पट्टी के किनारे पर नीले सूत के फंदे बनाए; इसी प्रकार उसने दूसरे जुड़े हुए समूह में सबसे बाहरी परदे की पट्टी के किनारे पर फंदे बनाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जोड़ में” अथवा “जोड़ने के स्थान पर।” इब्रानी शब्द उस स्थान या व्यवस्था को दर्शाता है जहाँ परदे आपस में जोड़े गए थे।
    reason: lexical_alternative
lexical_decisions:
- source_word: לֻלְאֹת
  choice: फंदे
  rationale: यह शब्द कपड़े के उन फंदों को दर्शाता है जिनसे परदों को जोड़ा जाता था; आधुनिक हिन्दी में ‘फंदे’ संक्षिप्त और स्वाभाविक है।
- source_word: תְּכֵלֶת
  choice: नीले सूत
  rationale: तंबू के निर्माण के संदर्भ में यह केवल रंग नहीं, बल्कि नीले रंग से रँगी वस्त्र-सामग्री या धागे को दर्शाता है।
- source_word: שְׂפַת
  choice: किनारे
  rationale: शाब्दिक अर्थ ‘होंठ’ है, पर यहाँ परदे की सीमा या किनारा अभिप्रेत है।
- source_word: הַיְרִיעָה
  choice: परदे
  rationale: यह निवास के आवरण में प्रयुक्त एक वस्त्र-पट को दर्शाता है; ‘परदा’ इस संदर्भ में प्रचलित और सुबोध है।
- source_word: הָאֶחָת
  choice: पहले
  rationale: शाब्दिक रूप से ‘एक’ है, किंतु आगे ‘दूसरी’ से विरोध होने के कारण यहाँ क्रमवाचक अर्थ स्वाभाविक है।
- source_word: מִקָּצָה
  choice: छोर पर
  rationale: यह उस अंतिम सिरे का स्थान बताता है जहाँ परदों की पट्टियाँ आपस में जोड़ी जाती थीं।
- source_word: בַּמַּחְבָּרֶת
  choice: जोड़ी गई पट्टी
  rationale: מַחְבָּרֶת जोड़ या आपस में जुड़े परदों की व्यवस्था को दर्शाता है। प्रवाहपूर्ण हिन्दी में ‘जोड़ी गई पट्टी’ उस समूह और उसके जुड़ाव दोनों को व्यक्त करती है; इसकी वास्तविक स्थानवाचक अस्पष्टता पादटिप्पणी में रखी गई है।
- source_word: כֵּן עָשָׂה
  choice: इसी प्रकार उसने ... भी ... बनाए
  rationale: यह समानांतर क्रिया को स्पष्ट करता है और हिन्दी में अनावश्यक पूर्ण पुनरावृत्ति से बचते हुए मूल संरचना बनाए रखता है।
- source_word: הַקִּיצוֹנָה
  choice: सबसे बाहरी
  rationale: यह जुड़े हुए समूह के अंतिम या बाहरी छोर वाले परदे को दर्शाता है।
- source_word: הַשֵּׁנִית
  choice: दूसरी
  rationale: यह पहले समूह के विपरीत दूसरे जुड़े हुए समूह की स्पष्ट पहचान करता है।
