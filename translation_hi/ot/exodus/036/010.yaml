  text: He joined five of the curtains to one another[a], and the other five curtains he joined to one another.
translation:
  language: hi
  text: उसने पाँच परदों को एक-दूसरे से जोड़ दिया, और दूसरे पाँच परदों[a] को भी एक-दूसरे से जोड़ दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में दूसरे उपवाक्य में शाब्दिक रूप से ‘और पाँच परदे’ है; यहाँ ‘दूसरे’ शब्द से स्पष्ट किया गया है कि पाँच परदों का दूसरा समूह अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַבֵּר / חִבַּר
  choice: जोड़ दिया
  rationale: חבר का अर्थ जोड़ना या परस्पर मिलाना है। निर्माण के इस प्रसंग में ‘जोड़ दिया’ स्वाभाविक है और जोड़ने की विधि को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: יְרִיעֹת
  choice: परदों
  rationale: मिलापवाले तंबू के प्रसंग में यह शब्द कपड़े के बड़े आवरण-खंडों को दर्शाता है; ‘परदे’ सामान्य पाठक के लिए स्पष्ट और प्रचलित है।
- source_word: חֲמֵשׁ
  choice: पाँच
  rationale: मूल पाठ की निश्चित संख्या का सीधा अनुवाद।
- source_word: אַחַת אֶל אֶחָת
  choice: एक-दूसरे से
  rationale: यह इब्रानी पदबंध प्रत्येक समूह के परदों को परस्पर जोड़ने का भाव व्यक्त करता है; ‘एक-दूसरे से’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: וְחָמֵשׁ יְרִיעֹת
  choice: और दूसरे पाँच परदों
  rationale: इब्रानी में शाब्दिक रूप से ‘और पाँच परदे’ है। समानांतर रचना से स्पष्ट है कि यह पाँच परदों का दूसरा समूह है, इसलिए हिन्दी में स्पष्टता के लिए ‘दूसरे’ जोड़ा गया है।
