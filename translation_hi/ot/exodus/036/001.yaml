source:
  edition: WLC
  text: וְ/עָשָׂה֩ בְצַלְאֵ֨ל וְ/אָהֳלִיאָ֜ב וְ/כֹ֣ל אִ֣ישׁ חֲכַם לֵ֗ב אֲשֶׁר֩ נָתַ֨ן יְהוָ֜ה חָכְמָ֤ה וּ/תְבוּנָה֙ בָּ/הֵ֔מָּה לָ/דַ֣עַת לַ/עֲשֹׂ֔ת אֶֽת כָּל מְלֶ֖אכֶת עֲבֹדַ֣ת הַ/קֹּ֑דֶשׁ לְ/כֹ֥ל אֲשֶׁר צִוָּ֖ה יְהוָֽה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/001.yaml
  text: And Bezalel and Oholiab[a], and every skillful man in whom Yahweh has put wisdom and understanding to know how to do all the work for the service of the sanctuary[c][b], shall do according to all that Yahweh has commanded.
translation:
  language: hi
  text: बसलेल, ओहोलीआब और हर कुशल पुरुष[a], जिनमें याहवे ने बुद्धि और समझ रखी है[b], ताकि वे पवित्रस्थान की सेवा का सारा काम[c] करना जानें, उस काम को याहवे की हर आज्ञा के अनुसार करेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “हर बुद्धिमान-हृदय पुरुष”; इस प्रसंग में यह पद हर कुशल कारीगर के लिए सामान्य रूप से प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “जिन्हें याहवे ने बुद्धि और समझ दी है।” इब्रानी में बहुवचन “उनमें” है, जो बसलेल, ओहोलीआब और हर कुशल पुरुष को सामूहिक रूप से संदर्भित करता है।
    reason: lexical_alternative
  - marker: c
    text: या, “पवित्रस्थान की सेवा के सारे काम।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה
  choice: करेंगे
  rationale: संयुक्त कर्ताओं के साथ इब्रानी क्रिया का भाव भावी/निर्देशात्मक है। हिन्दी में बहुवचन भविष्यकाल स्वाभाविक है और कार्य पूरा करने की अपेक्षा व्यक्त करता है।
- source_word: בְצַלְאֵל וְאָהֳלִיאָב
  choice: बसलेल, ओहोलीआब
  rationale: इब्रानी व्यक्तिगत नामों का प्रचलित हिन्दी लिप्यंतरण।
- source_word: וְכֹל אִישׁ חֲכַם לֵב
  choice: हर कुशल पुरुष
  rationale: शाब्दिक अर्थ ‘हर बुद्धिमान-हृदय पुरुष’ है; शिल्पकारी के प्रसंग में यह व्यावहारिक योग्यता बताता है। ‘कुशल पुरुष’ वर्तमान हिन्दी में स्पष्ट है, जबकि पादटिप्पणी मूल मुहावरे को सुरक्षित रखती है।
- source_word: אֲשֶׁר נָתַן יְהוָה חָכְמָה וּתְבוּנָה בָהֵמָּה
  choice: जिनमें याहवे ने बुद्धि और समझ रखी है
  rationale: बहुवचन ‘उनमें’ बसलेल, ओहोलीआब और सभी कुशल पुरुषों को सामूहिक रूप से संदर्भित करता है। ‘रखी है’ נתן और בָהֵמָּה दोनों की छवि बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चतुरक्षरीय ईश्वरीय नाम का हिन्दी लिप्यंतरण, इसे उपाधि से प्रतिस्थापित नहीं किया गया है।
- source_word: לָדַעַת לַעֲשֹׂת
  choice: करना जानें
  rationale: यहाँ ‘जानना’ व्यावहारिक ज्ञान और क्षमता को व्यक्त करता है।
- source_word: כָּל מְלֶאכֶת עֲבֹדַת הַקֹּדֶשׁ
  choice: पवित्रस्थान की सेवा का सारा काम
  rationale: מְלָאכָה ‘काम’, עֲבֹדָה ‘सेवा’, और הַקֹּדֶשׁ इस प्रसंग में ‘पवित्रस्थान’ है; हिन्दी वाक्यांश इब्रानी की स्तरित रचना को यथासंभव बनाए रखता है।
- source_word: לְכֹל אֲשֶׁר צִוָּה יְהוָה
  choice: वह सब जिसकी आज्ञा याहवे ने दी है
  rationale: לְכֹל यहाँ आज्ञा के अनुरूप कार्य करने का भाव देता है; हिन्दी में यह रचना स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है। ‘याहवे’ उसका सीधा हिन्दी लिप्यंतरण है और उसे किसी उपाधि में नहीं बदलता।
- issue: אִישׁ חֲכַם לֵב में लिंग और इब्रानी मुहावरा
  choice: हर कुशल पुरुष
  alternative: हर कुशल व्यक्ति / हर बुद्धिमान-हृदय पुरुष
  rationale: אִישׁ का पुल्लिंग रूप सुरक्षित रखा गया है, पर חֲכַם לֵב का प्रसंगानुकूल अर्थ ‘कुशल’ दिया गया है। मूल मुहावरे और उसके संभावित सामान्य आशय को पादटिप्पणी में बताया गया है।
- issue: कर्ता-समूह में दी गई बुद्धि का सामूहिक संदर्भ
  choice: जिनमें याहवे ने बुद्धि और समझ रखी है
  alternative: जिन्हें याहवे ने बुद्धि और समझ दी है
  rationale: इब्रानी בָהֵמָּה बहुवचन ‘उनमें’ है और सभी उल्लिखित कारीगरों को सामूहिक रूप से संदर्भित करता है; मुख्य पाठ इस सामूहिकता को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। शिल्पकारी के प्रसंग में ‘कुशल’ स्वाभाविक है; मूल ‘बुद्धिमान-हृदय’ मुहावरा पादटिप्पणी में संरक्षित है। वाक्य की सामूहिक कर्ता-रचना के कारण हिन्दी में बहुवचन क्रिया प्रयुक्त हुई है।
