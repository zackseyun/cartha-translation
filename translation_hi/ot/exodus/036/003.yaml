  text: וַ/יִּקְח֞וּ מִ/לִּ/פְנֵ֣י מֹשֶׁ֗ה אֵ֤ת כָּל הַ/תְּרוּמָה֙ אֲשֶׁ֨ר הֵבִ֜יאוּ בְּנֵ֣י יִשְׂרָאֵ֗ל לִ/מְלֶ֛אכֶת עֲבֹדַ֥ת הַ/קֹּ֖דֶשׁ לַ/עֲשֹׂ֣ת אֹתָ֑/הּ וְ֠/הֵם הֵבִ֨יאוּ אֵלָ֥י/ו ע֛וֹד נְדָבָ֖ה בַּ/בֹּ֥קֶר בַּ/בֹּֽקֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/003.yaml
  text: And they took from before Moses all the contribution that the sons of Israel had brought for the work of the service of the sanctuary[a], to do it[c][b]. But they still kept bringing to him freewill offerings morning after morning.
translation:
  language: hi
  text: उन्होंने मूसा के पास से[a] वह सारी भेंट ले ली, जो इस्राएली[b] पवित्रस्थान की सेवा के काम के लिए, उसे करने के लिए लाए थे। फिर भी वे हर सुबह[c] उसके पास स्वेच्छा की भेंटें लाते रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मूसा के सामने से” या “मूसा की उपस्थिति से।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “इस्राएल के पुत्र।” यह पूरे इस्राएली समुदाय के लिए प्रयुक्त सामूहिक पद है।
    reason: lexical_alternative
  - marker: c
    text: या, “सुबह-दर-सुबह।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: उन्होंने ... ले ली
  rationale: לקח का मूल अर्थ ‘लेना’ है। यहाँ कारीगर मूसा के पास रखी निर्माण-सामग्री अपने काम के लिए लेते हैं।
- source_word: מִלִּפְנֵי מֹשֶׁה
  choice: मूसा के पास से
  rationale: शाब्दिक चित्र ‘मूसा के सामने/उपस्थिति से’ है; आधुनिक हिन्दी में ‘मूसा के पास से’ वस्तुओं के उसकी देखरेख से लिए जाने का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: כָּל הַתְּרוּמָה
  choice: वह सारी भेंट
  rationale: תְּרוּמָה यहाँ बलिदान से अधिक पवित्र काम के लिए अलग रखी गई दान-सामग्री को सूचित करता है। ‘भेंट’ धार्मिक संदर्भ और सामूहिक सामग्री—दोनों के अनुकूल है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएली
  rationale: शाब्दिक रूप ‘इस्राएल के पुत्र’ एक परंपरागत सामूहिक पद है, जिसमें समस्त इस्राएली समुदाय सम्मिलित है; ‘इस्राएली’ आधुनिक हिन्दी में स्पष्ट और समावेशी है।
- source_word: לִמְלֶאכֶת עֲבֹדַת הַקֹּדֶשׁ
  choice: पवित्रस्थान की सेवा का काम करने के लिए
  rationale: यह अनुवाद מלאכה (‘काम’), עבודה (‘सेवा’) और הקֹדשׁ (‘पवित्रस्थान’) के जुड़े हुए भावों को बनाए रखता है और निवास-स्थान के निर्माण-संदर्भ में स्वाभाविक है।
- source_word: לַעֲשֹׂת אֹתָהּ
  choice: काम करने के लिए
  rationale: עשה व्यापक रूप से ‘करना/बनाना’ हो सकता है। स्त्रीलिंग प्रत्यय निकटवर्ती מלאכה अर्थात काम की ओर संकेत करता है; हिन्दी में इसे उसी वाक्यांश में स्वाभाविक ढंग से समाहित किया गया है।
- source_word: וְהֵם הֵבִיאוּ
  choice: फिर भी वे ... लाते रहे
  rationale: 'स्वतंत्र सर्वनाम הֵם और प्रसंग मिलकर जारी तथा कुछ हद तक विपरीत स्थिति दर्शाते हैं: सामग्री ले ली गई थी, फिर भी लोग और लाते रहे। ‘लाते रहे’ इस निरंतरता को व्यक्त करता है।'
- source_word: נְדָבָה
  choice: स्वेच्छा से भेंटें
  rationale: נְדָבָה स्वेच्छा से दी गई भेंट है। एकवचन रूप यहाँ सामूहिक अर्थ रख सकता है; बार-बार लाने के प्रसंग में हिन्दी बहुवचन स्वाभाविक है।
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: हर सुबह
  rationale: दोहराया हुआ पद नियमित पुनरावृत्ति बताता है। ‘हर सुबह’ आधुनिक हिन्दी में उसका स्पष्ट और स्वाभाविक रूप है।
theological_decisions:
- issue: הַקֹּדֶשׁ का संदर्भ
  choice: पवित्रस्थान
  alternative: पवित्र सेवा
  rationale: निवास-स्थान के निर्माण के तत्काल प्रसंग में यह पद पवित्रस्थान को सूचित करता है; फिर भी ‘सेवा’ को अलग संज्ञा के रूप में बनाए रखा गया है।
- issue: וְהֵם में निरंतरता अथवा साधारण संयोजन
  choice: फिर भी वे ... लाते रहे
  alternative: और वे ... लाते रहे
  rationale: וְ अपने आप में साधारण ‘और’ है, पर स्वतंत्र הֵם और कथानक की स्थिति जारी क्रिया तथा हल्के विरोध को संभव बनाती है। मुख्य पाठ इस प्रासंगिक बल को व्यक्त करता है, बिना किसी सिद्धान्तगत निष्कर्ष को जोड़े।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पवित्रस्थान’, ‘सेवा’ और ‘स्वेच्छा से भेंटें’ धार्मिक संदर्भ को स्पष्ट रखते हैं, जबकि अत्यधिक शाब्दिक और अस्वाभाविक हिन्दी से बचा गया है। सभी पाद-टिप्पणी चिह्न मुख्य पाठ में संबंधित पदों के तुरंत बाद रखे गए हैं।
