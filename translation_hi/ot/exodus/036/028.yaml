  rationale: निवास की संरचना के संदर्भ में यह शब्द खड़े किए जाने वाले लकड़ी के संरचनात्मक पटलों या तख्तों को दर्शाता है; आधुनिक हिन्दी में ‘तख्ते’ सहज और स्पष्ट है।
- source_word: עָשָׂה
  choice: उसने ... बनाए
  rationale: עשה का सामान्य अर्थ ‘बनाना’ है; कर्ता को पूर्ववर्ती प्रसंग से ग्रहण करते हुए हिन्दी में ‘उसने’ स्वाभाविक है।
- source_word: לִ/מְקֻצְעֹת
  choice: कोनों के लिए
  rationale: यह रूप कोने के स्थानों अथवा कोने पर जोड़े गए विशेष भागों की ओर संकेत कर सकता है; मुख्य पाठ में स्थान-संबंधी अर्थ स्पष्ट रखते हुए वास्तविक अस्पष्टता पादटिप्पणी में दी गई है।
- source_word: הַ/מִּשְׁכָּן
  choice: निवास
  rationale: מִשְׁכָּן परमेश्वर के निवास-स्थान के रूप में इस पवित्र संरचना का नाम है। ‘निवास’ मूल शब्द के अर्थ-संबंध को बनाए रखता है और इस प्रसंग में गरिमापूर्ण तथा बोधगम्य है।
- source_word: בַּ/יַּרְכָתָיִם
  choice: पिछले भाग में
  rationale: द्विवचन रूप संरचना के पीछे के दोनों छोरों या पार्श्वों को सूचित करता है। ‘पिछले भाग में’ अनावश्यक रूप से ‘कोनों’ की पुनरुक्ति किए बिना पीछे की स्थिति बताता है।
