lexical_decisions:
- source_word: עַמּוּדָיו חֲמִשָּׁה
  choice: उसके लिए पाँच खंभे
  rationale: עַמּוּד upright structural supports को दर्शाता है। हिंदी में ‘खंभे’ स्वाभाविक और स्पष्ट है। एकवचन संबंधसूचक प्रत्यय को पिछले पद में वर्णित द्वार के परदे से जोड़ते हुए ‘उसके लिए’ रखा गया है।
- source_word: וָוֵיהֶם
  choice: उनके काँटे
  rationale: मिलापवाले तंबू के निर्माण-संदर्भ में וָו उन काँटेनुमा उपकरणों को दर्शाता है जिनसे परदा खंभों पर लटकाया जाता था। ‘काँटे’ आधुनिक हिंदी में इस वस्तु को संक्षेप और स्पष्टता से व्यक्त करता है।
- source_word: וְצִפָּה
  choice: उसने ... सोना मढ़ा
  rationale: पिएल क्रिया צפה धातु की परत चढ़ाने का अर्थ देती है। ‘सोना मढ़ा’ हिंदी शिल्प-भाषा में स्वाभाविक है और क्रिया की कर्तृवाचकता बनाए रखता है।
- source_word: רָאשֵׁיהֶם
  choice: खंभों के ऊपरी सिरे
  rationale: शाब्दिक अर्थ ‘उनके सिर’ है, पर स्थापत्य-संदर्भ में खंभों के ऊपर के भाग अभिप्रेत हैं। ‘ऊपरी सिरे’ स्पष्ट है और किसी विशिष्ट अलंकृत शीर्ष की अनावश्यक कल्पना नहीं जोड़ता।
- source_word: חֲשֻׁקֵיהֶם
  choice: उनकी पट्टियाँ
  rationale: इस दुर्लभ स्थापत्य शब्द का ठीक आकार अनिश्चित है; यह खंभों पर लगी बाँधने, जोड़ने या सजाने वाली पट्टियों का संकेत दे सकता है। ‘पट्टियाँ’ इस अनिश्चितता को अत्यधिक विशिष्ट किए बिना स्वाभाविक हिंदी देता है।
- source_word: זָהָב
  choice: सोना
  rationale: यह उस धातु को बताता है जिसकी परत खंभों के ऊपरी सिरों और पट्टियों पर चढ़ाई गई थी।
- source_word: אַדְנֵיהֶם חֲמִשָּׁה
  choice: उनके पाँच आधार
  rationale: אֶדֶן खंभे को थामने वाले आधार अथवा खाँचे को दर्शाता है। ‘आधार’ साधारण पाठक के लिए सहज है और वस्तु के कार्य को ठीक से बताता है।
- source_word: נְחֹשֶׁת
  choice: काँसा
  rationale: पवित्र तंबू की धातुओं के संदर्भ में נְחֹשֶׁת का पारंपरिक और प्रसंगानुकूल हिंदी रूप ‘काँसा’ है, यद्यपि प्राचीन धातु-मिश्रण की ठीक संरचना निश्चित नहीं है।
