  text: और उसने निवास-स्थान के लिए बबूल की लकड़ी के सीधे खड़े तख्ते बनाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: और उसने ... बनाए
  rationale: वय्यिक्तोल कथा को आगे बढ़ाता है; सामान्य भूतकाल और आरंभिक ‘और’ इसके क्रमिक बल को स्वाभाविक हिन्दी में रखते हैं।
- source_word: הַקְּרָשִׁים
  choice: तख्ते
  rationale: मिलापवाले निवास के संदर्भ में קֶרֶשׁ संरचनात्मक लकड़ी के तख्तों को सूचित करता है; ‘तख्ते’ आधुनिक हिन्दी में स्पष्ट और वास्तु-संदर्भ के अनुकूल है।
- source_word: לַמִּשְׁכָּן
  choice: पवित्र निवास के लिए
  rationale: מִשְׁכָּן का मूल भाव ‘निवास-स्थान’ है और यहाँ वह इस्राएल के पवित्र चल निवास का पारिभाषिक नाम है; ‘पवित्र निवास’ अर्थ को सुलभ रखते हुए संदर्भ स्पष्ट करता है।
- source_word: עֲצֵי שִׁטִּים
  choice: बबूल की लकड़ी के
  rationale: यह रचना शिट्टा/अकेशिया की लकड़ी बताती है। आधुनिक हिन्दी में ‘बबूल की लकड़ी’ सामान्य पाठक के लिए सहज वनस्पति-संबंधी समतुल्य है।
- source_word: עֹמְדִים
  choice: उन्हें खड़ा किया
  rationale: पुल्लिंग बहुवचन कृदंत तख्तों की सीधी, खड़ी दिशा बताता है। हिन्दी में समन्वित क्रिया-वाक्यांश इस वास्तु-संबंधी अर्थ को स्वाभाविक रूप से व्यक्त करता है।
