  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘पवित्र निवास’ को पारिभाषिक संदर्भ में अपनाया गया है; किसी संप्रदाय-विशेष की शब्दावली नहीं जोड़ी गई। हिब्रू के अंतिम कृदंत को हिन्दी में ‘और उन्हें खड़ा किया’ बनाना अर्थगत रूप से स्पष्ट है, यद्यपि शाब्दिक संरचना ‘खड़े/सीधे’ है।
