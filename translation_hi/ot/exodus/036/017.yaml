  yaml_path: translation/ot/exodus/036/017.yaml
  text: He made fifty loops on the edge of the outer curtain in the first set[a], and he made fifty loops on the edge of the curtain of the second set.
translation:
  language: hi
  text: उसने पहले जुड़े हुए समूह[a] के अंतिम परदे के किनारे पर पचास फंदे बनाए, और दूसरे जुड़े हुए समूह के परदे के किनारे पर भी पचास फंदे बनाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जोड़ पर” अथवा “पहले जुड़े हुए भाग में”; इब्रानी शब्द परदों के जुड़े हुए समूह या उनके जोड़ को दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לֻלָאֹת
  choice: फंदे
  rationale: यह संज्ञा परदों को जोड़ने के लिए कपड़े से बने फंदों को दर्शाती है। इस पद में रंग का उल्लेख नहीं है, इसलिए उसे जोड़ा नहीं गया।
- source_word: שְׂפַת
  choice: किनारे
  rationale: कपड़े या परदे के संदर्भ में यह शब्द उसके छोर अथवा किनारे को दर्शाता है; आधुनिक हिन्दी में ‘किनारा’ स्वाभाविक है।
- source_word: יְרִיעָה
  choice: परदा
  rationale: निवास-स्थान के वर्णन में यह बड़े कपड़े के परदे के लिए प्रयुक्त है।
- source_word: הַקִּיצֹנָה
  choice: अंतिम
  rationale: यह समूह के छोर पर स्थित परदे को दर्शाता है। ‘अंतिम’ स्थानगत अर्थ को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: בַּמַּחְבָּרֶת
  choice: पहले जुड़े हुए समूह के
  rationale: מַחְבָּרֶת जुड़ी हुई इकाई अथवा परदों के समूह को दर्शाता है। सन्दर्भ से पहले समूह का आशय स्पष्ट है, यद्यपि ‘पहले’ मूल शब्द में प्रत्यक्ष रूप से नहीं है; इसलिए वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: הַחֹבֶרֶת הַשֵּׁנִית
  choice: दूसरे जुड़े हुए समूह के
  rationale: חֹבֶרֶת का कृदन्तीय रूप जुड़ने या जुड़े होने का भाव रखता है और הַשֵּׁנִית दूसरे समकक्ष समूह को चिह्नित करता है। यह अनुवाद उस जोड़ने के भाव को बनाए रखता है।
- source_word: וַיַּעַשׂ ... עָשָׂה
  choice: उसने ... बनाए ... बनाए
  rationale: दोनों उपवाक्यों में ‘बनाना’ क्रिया की पुनरावृत्ति रखी गई है; दूसरे उपवाक्य में हिन्दी की स्वाभाविकता के लिए ‘भी’ जोड़ा गया है।
