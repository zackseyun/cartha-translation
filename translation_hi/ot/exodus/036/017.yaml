  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। तकनीकी वस्त्र-संबंधी शब्दों के लिए ‘परदा’, ‘किनारा’ और ‘फंदे’ जैसे सामान्य शब्द चुने गए हैं। इब्रानी में जुड़े समूह और जोड़ के बीच जो अर्थगत संभावना है, उसे मुख्य पाठ और पादटिप्पणी दोनों में सुरक्षित रखा गया है।
