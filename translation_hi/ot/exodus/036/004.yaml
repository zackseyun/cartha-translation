  text: तब पवित्र-स्थान का सारा काम कर रहे सभी कुशल कारीगर अपने-अपने उस काम से आए, जिसे वे कर रहे थे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “एक-एक जन अपने उस काम से, जिसे वे कर रहे थे।” “एक-एक जन” वितरणात्मक अभिव्यक्ति है; इसका अर्थ है कि हर व्यक्ति उस काम से आया जिसे वह कर रहा था।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: तब ... आए
  rationale: वय्यिक्तोल रूप कथा की अगली घटना बताता है; ‘तब ... आए’ स्वाभाविक हिन्दी कथात्मक क्रम व्यक्त करता है।
- source_word: כָּל הַחֲכָמִים
  choice: सभी कुशल कारीगर
  rationale: यहाँ חכמים बौद्धिक बुद्धिमत्ता से अधिक पवित्र-स्थान के निर्माण के लिए प्राप्त कौशल वाले कामगारों को सूचित करता है।
- source_word: הָעֹשִׂים אֵת כָּל מְלֶאכֶת הַקֹּדֶשׁ
  choice: पवित्र-स्थान का सारा काम कर रहे
  rationale: कृदन्त जारी गतिविधि व्यक्त करता है; מלאכת העבודה-सदृश प्रसंग में מְלֶאכֶת काम/कारीगरी है और הַקֹּדֶשׁ यहाँ पवित्र-स्थान को सूचित करता है।
- source_word: אִישׁ אִישׁ
  choice: अपना-अपना
  rationale: शब्द की पुनरावृत्ति वितरणात्मक है—हर व्यक्ति अपने काम से आया। हिन्दी में ‘अपना-अपना’ इस बल को सहजता से व्यक्त करता है।
- source_word: מִמְּלַאכְתּוֹ אֲשֶׁר הֵמָּה עֹשִׂים
  choice: अपना-अपना काम छोड़कर
  rationale: מן कार्यस्थल/काम से हटकर आने का भाव देता है। ‘छोड़कर’ यहाँ काम को स्थायी रूप से त्यागना नहीं, बल्कि उससे हटकर आना बताता है; संक्षिप्त हिन्दी मूल की वितरणात्मक अभिव्यक्ति का आशय रखती है।
