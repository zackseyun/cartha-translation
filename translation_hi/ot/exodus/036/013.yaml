  text: וַ/יַּ֕עַשׂ חֲמִשִּׁ֖ים קַרְסֵ֣י זָהָ֑ב וַ/יְחַבֵּ֨ר אֶת הַ/יְרִעֹ֜ת אַחַ֤ת אֶל אַחַת֙ בַּ/קְּרָסִ֔ים וַֽ/יְהִ֥י הַ/מִּשְׁכָּ֖ן אֶחָֽד־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/013.yaml
  text: And he made fifty gold clasps[a], and joined the curtains to one another with the clasps, so that the tabernacle became one.
translation:
  language: hi
  text: उसने सोने की पचास कुंडियाँ बनाईं और कुंडियों से परदों को आपस में जोड़ दिया। इस प्रकार निवास एक हो गया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक शाब्दिक रूप में, “और निवास एक था।”
    reason: इब्रानी वाक्यांश को परिणाम-वाचक ‘एक हो गया’ अथवा अधिक औपचारिक स्थिति-वाचक ‘एक था’ के रूप में व्यक्त किया जा सकता है।
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: उसने बनाए
  rationale: עשה का सामान्य अर्थ ‘बनाना’ है; यहाँ वस्तुओं के निर्माण के लिए यही स्वाभाविक और सटीक क्रिया है।
- source_word: חֲמִשִּׁים קַרְסֵי זָהָב
  choice: सोने के पचास अंकुड़े
  rationale: קֶרֶס उन जोड़ने वाले धातु-उपकरणों को दर्शाता है जिनसे परदे परस्पर बाँधे गए। ‘अंकुड़े’ उनके कार्य को स्पष्ट करता है, पर उनके आकार को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: וַיְחַבֵּר
  choice: जोड़ दिया
  rationale: חבר का अर्थ जोड़ना या परस्पर मिलाना है। पूर्ण क्रिया के वर्णन में ‘जोड़ दिया’ सहज आधुनिक हिन्दी है।
- source_word: אֶת הַיְרִעֹת
  choice: परदों को
  rationale: יְרִיעוֹת पवित्र निवास को बनाने वाले कपड़े के परदों या पटों को दर्शाता है; ‘परदे’ इस प्रसंग में स्पष्ट और प्रचलित शब्द है।
- source_word: אַחַת אֶל אַחַת
  choice: एक-दूसरे से
  rationale: इब्रानी का स्त्रीलिंग एकवचन वाला दोहराव परदों के पारस्परिक जुड़ाव को व्यक्त करता है; हिन्दी में ‘एक-दूसरे से’ इसका स्वाभाविक रूप है।
- source_word: בַּקְּרָסִים
  choice: अंकुड़ों से
  rationale: 'यहाँ ב साधन का बोध कराता है: परदों को अंकुड़ों के माध्यम से जोड़ा गया।'
- source_word: וַיְהִי הַמִּשְׁכָּן אֶחָד
  choice: इस प्रकार निवास एक हो गया
  rationale: यह वाक्यांश परदों को जोड़ने का परिणाम बताता है। ‘एक हो गया’ संरचना के एक समग्र इकाई बनने को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि अधिक शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: הַמִּשְׁכָּן
  choice: निवास
  rationale: מִשְׁכָּן का मूल आशय ‘निवास’ है और निर्गमन के प्रसंग में यह परमेश्वर के लिए बनाए गए पवित्र तंबू-सदृश ढाँचे का पारिभाषिक नाम है। ‘निवास’ मूल शब्द-संबंध को बनाए रखते हुए सरल और गरिमापूर्ण है।
theological_decisions:
- issue: וַיְהִי הַמִּשְׁכָּן אֶחָד में स्थिति और परिणाम के बीच अर्थ-संबंध
  choice: इस प्रकार निवास एक हो गया
  alternative: और निवास एक था
  rationale: क्रमागत कथन परदों को जोड़ने के परिणाम पर बल देता है, इसलिए ‘एक हो गया’ चुना गया है; फिर भी इब्रानी को स्थिति-वाचक रूप में अधिक औपचारिक ढंग से पढ़ने की संभावना पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘मिलापवाला तम्बू’ जैसे परंपरा-विशिष्ट पद के बजाय मूल מִשְׁכָּן के निकट ‘निवास’ रखा गया है। छोटे वाक्यों से निर्माण-क्रम और उसका परिणाम स्पष्ट होता है।
