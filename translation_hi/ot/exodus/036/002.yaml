base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/002.yaml
  text: Then Moses called Bezalel and Oholiab and every wise-hearted man in whose heart Yahweh had put wisdom[b][a], everyone whose heart stirred him to come to the work to do it.
translation:
  language: hi
  text: तब मूसा ने बसलेल, ओहोलीआब और हर एक ऐसे निपुण व्यक्ति को बुलाया, जिसके हृदय में यहोवा ने बुद्धि दी थी[b]—हर उस व्यक्ति को, जिसका हृदय उसे उस काम को करने के लिए आगे आने को प्रेरित करता था[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिसका हृदय उसे चलाता था” अथवा “ऊपर उठाता था।” इब्रानी मुहावरा भीतर की इच्छा और प्रेरणा का भाव देता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “हृदय से बुद्धिमान”; यहाँ इसका आशय बुद्धि और कारीगरी की योग्यता से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: बुलाया
  rationale: קרא אל यहाँ किसी कार्य के लिए लोगों को बुलाने का भाव देता है; ‘बुलाया’ स्वाभाविक और स्रोत के निकट है।
- source_word: בְּצַלְאֵל וְאֶל אָהֳלִיאָב
  choice: बसलेल, ओहोलीआब
  rationale: इब्रानी व्यक्तिगत नामों का आधुनिक हिन्दी में प्रचलित ध्वन्यात्मक लिप्यंतरण।
- source_word: כָּל אִישׁ חֲכַם לֵב
  choice: सभी निपुण लोगों
  rationale: शाब्दिक ‘हृदय से बुद्धिमान’ इस प्रसंग में बुद्धि और कारीगरी की योग्यता का मुहावरा है; ‘निपुण’ हिन्दी में आशय स्पष्ट करता है, जबकि पादटिप्पणी मूल बिंब सुरक्षित रखती है।
- source_word: אֲשֶׁר נָתַן יְהוָה חָכְמָה בְּלִבּוֹ
  choice: जिनके हृदय में यहोवा ने बुद्धि दी थी
  rationale: यह अनुवाद बुद्धि के ईश्वरीय दान और मूल के हृदय-संबंधी बिंब दोनों को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत दिव्य नाम को उपाधि से बदलने के बजाय हिन्दी में सुविदित रूप ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: כֹּל אֲשֶׁר נְשָׂאוֹ לִבּוֹ
  choice: हर उस व्यक्ति को, जिसका हृदय उसे प्रेरित करता था
  rationale: נשא לב का मुहावरा आंतरिक तत्परता या प्रेरणा व्यक्त करता है; यह रूप हृदय का मूल बिंब भी सुरक्षित रखता है।
- source_word: לְקָרְבָה אֶל הַמְּלָאכָה
  choice: कि वह पास आकर उस काम को करे
  rationale: קרב के ‘निकट आने’ के भाव को ‘पास आकर’ से रखा गया है और מלאכה को प्रसंगानुकूल ‘काम’ कहा गया है।
- source_word: לַעֲשֹׂת אֹתָהּ
  choice: उस काम को करे
  rationale: हिन्दी में सर्वनाम ‘उसे करे’ की अपेक्षा संज्ञा दोहराना अधिक स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में परमेश्वर का व्यक्तिगत नाम है। हिन्दी पाठकों में स्थापित और पहचाना हुआ लिप्यंतरण ‘यहोवा’ चुना गया; इसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया।
- issue: कारीगरों की बुद्धि का स्वरूप
  choice: यहोवा द्वारा हृदय में दी गई बुद्धि
  alternative: केवल मानवीय कौशल
  rationale: पद स्पष्ट रूप से योग्यता को यहोवा का दिया हुआ बताता है; अनुवाद इस दैवी स्रोत को बनाए रखता है और बुद्धि को मात्र प्राकृतिक प्रतिभा तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण गद्य। ‘निपुण’ प्रसंगगत कारीगरी-कौशल को स्पष्ट करता है; ‘हृदय’ का बिंब दोनों मूल वाक्यांशों में रखा गया है। मुख्य पाठ में पादटिप्पणी चिह्न संबंधित पदबंधों के तुरंत बाद लगाए गए हैं।
