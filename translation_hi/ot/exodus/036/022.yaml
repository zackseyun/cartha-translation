  text: Two tenons for each board[a], joined one to another[b]; thus he made all the boards of the tabernacle.
translation:
  language: hi
  text: हर तख़्ते में दो चूलें[a] थीं, जो एक-दूसरी के अनुरूप जुड़ी हुई थीं[b]। उसने निवास-स्थान के सभी तख़्ते इसी प्रकार बनाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ “हाथ”; यहाँ तख़्ते से निकले जोड़ने वाले भागों के लिए यह शब्द रूपक के रूप में प्रयुक्त हुआ है।
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद “एक-दूसरी के सामने जुड़ी हुई” भी हो सकता है; इससे दोनों चूलों के मेल खाते विन्यास पर बल पड़ता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי יָדֹת
  choice: दो चूलें
  rationale: יָדֹת का शाब्दिक अर्थ ‘हाथ’ है, पर निर्माण-संदर्भ में यह तख़्ते से निकले जोड़ने वाले भागों को दर्शाता है। हिंदी काष्ठकारी में ‘चूल’ इस प्रकार के निकले हुए जोड़ के लिए संक्षिप्त और सटीक शब्द है।
- source_word: קֶּרֶשׁ
  choice: तख़्ता
  rationale: यह पवित्र निवास की संरचना में प्रयुक्त लकड़ी के प्रत्येक ठोस घटक को दर्शाता है; ‘तख़्ता’ आधुनिक हिंदी में सहज है।
- source_word: מְשֻׁלָּבֹת
  choice: जुड़ी हुई
  rationale: निष्क्रिय कृदंत दोनों चूलों की परस्पर मिलान वाली व्यवस्था बताता है; ‘जुड़ी हुई’ उस संबंध को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: אַחַת אֶל אֶחָת
  choice: एक-दूसरी के अनुरूप
  rationale: वाक्यांश परस्पर संबंध या आमने-सामने के मिलान को व्यक्त कर सकता है। ‘एक-दूसरी के अनुरूप’ ज्यामिति को अनावश्यक रूप से निश्चित किए बिना समान विन्यास का भाव रखता है।
- source_word: כֵּן עָשָׂה
  choice: इसी प्रकार बनाए
  rationale: रीति-सूचक כֵּן और निर्माण-संदर्भ में עָשָׂה का सीधा, स्वाभाविक हिंदी रूप।
- source_word: מִּשְׁכָּן
  choice: पवित्र निवास
  rationale: मूल शब्द का अर्थ ‘निवास’ है और निर्गमन में यह विशिष्ट उपासना-तंबू को दर्शाता है। ‘पवित्र निवास’ सामान्य पाठक के लिए अर्थपूर्ण तथा संदर्भानुकूल है।
