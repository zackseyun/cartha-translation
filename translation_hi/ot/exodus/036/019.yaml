  language: hi
  text: उसने तंबू के लिए लाल रंग में रंगी हुई मेढ़ों की खालों का एक आवरण बनाया, और उसके ऊपर उत्तम चमड़े[a] का एक आवरण।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ प्रयुक्त इब्रानी शब्द תְּחָשִׁים का अर्थ अनिश्चित है। इसके संभावित अनुवादों में “समुद्री गाय की खालें,” “पॉरपॉइज़ की खालें,” “डुगोंग की खालें,” और परंपरागत रूप से “बिज्जू की खालें” शामिल हैं।
