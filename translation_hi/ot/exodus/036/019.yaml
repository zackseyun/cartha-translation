lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: उसने ... बनाया
  rationale: यह क्रमिक भूतकालीन क्रिया है। हिन्दी में एक ही कर्ता और क्रिया के द्वारा दोनों आवरणों के बनाए जाने का भाव स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: מִכְסֶה לָאֹהֶל
  choice: तंबू के लिए ... एक आवरण
  rationale: מִכְסֶה किसी ढकने वाली परत या आवरण को और אֹהֶל सामान्यतः तंबू को दर्शाता है; इसलिए धार्मिक पारिभाषिक शब्द थोपने के बजाय मूल अर्थ रखा गया है।
- source_word: עֹרֹת אֵלִים מְאָדָּמִים
  choice: लाल रंग में रंगी हुई मेढ़ों की खालें
  rationale: यह पदबंध मेढ़ों की उन खालों को दर्शाता है जिन्हें लाल किया या लाल रंग में रंगा गया था। हिन्दी वाक्य-विन्यास में सामग्री और उसकी विशेषता स्पष्ट रखी गई है।
- source_word: עֹרֹת תְּחָשִׁים
  choice: उत्तम चमड़ा
  rationale: תְּחָשִׁים की सटीक पहचान अनिश्चित है। किसी अनुमानित पशु का नाम मुख्य पाठ में रखने के बजाय उपयुक्त बाहरी आवरण का संकेत देने वाला सावधान और सुबोध पद चुना गया है; अनिश्चितता पाद-टिप्पणी में स्पष्ट है।
- source_word: מִלְמָעְלָה
  choice: उसके ऊपर
  rationale: यह पद दूसरे आवरण की ऊपरी स्थिति बताता है। 'उसके ऊपर' हिन्दी में दोनों परतों का संबंध स्पष्ट और स्वाभाविक बनाता है।
