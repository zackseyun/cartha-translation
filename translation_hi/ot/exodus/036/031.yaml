  text: उसने पवित्र निवास की एक ओर के खड़े ढाँचों के लिए बबूल की लकड़ी की पाँच आड़ी बल्लियाँ बनाईं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: उसने ... बनाईं
  rationale: यह क्रिया कथा में अगली कार्रवाई बताती है; हिन्दी में प्रसंग से क्रम स्पष्ट होने के कारण अलग से ‘तब’ जोड़ना आवश्यक नहीं है।
- source_word: בְּרִיחֵי
  choice: छड़ें
  rationale: यहाँ आशय उन क्षैतिज लकड़ी की छड़ों से है जो खड़े चौखटों को एक साथ बाँधे रखती थीं; ‘छड़ें’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: עֲצֵי שִׁטִּים
  choice: बबूल की लकड़ी की
  rationale: यह रचना शिट्टीम/अकेशिया जाति के वृक्ष की लकड़ी को दर्शाती है; ‘बबूल की लकड़ी’ हिन्दी बाइबलीय परंपरा में परिचित और सामान्य पाठक के लिए सुबोध है।
- source_word: חֲמִשָּׁה
  choice: पाँच
  rationale: मूल पाठ की निश्चित संख्या को सीधे व्यक्त करता है।
- source_word: לְקַרְשֵׁי
  choice: चौखटों के लिए
  rationale: קֶרֶשׁ पवित्र निवास के खड़े संरचनात्मक भागों को सूचित करता है। ‘चौखटे’ उनके संरचनात्मक कार्य को व्यक्त करता है, जबकि ‘तख्ते’ भी संभव है और उसे पादटिप्पणी में रखा गया है।
- source_word: צֶלַע
  choice: एक ओर
  rationale: स्थापत्य-संदर्भ में इसका अर्थ भवन की ‘ओर’ या ‘बगल’ है, न कि शाब्दिक ‘पसली’।
- source_word: הַמִּשְׁכָּן
  choice: पवित्र निवास
  rationale: מִשְׁכָּן का मूल अर्थ ‘निवास’ है और इस प्रसंग में वह इस्राएल के चलायमान पवित्रस्थान को सूचित करता है; ‘पवित्र’ संदर्भगत पहचान स्पष्ट करता है।
- source_word: הָאֶחָת
  choice: एक
  rationale: यह स्त्रीलिंग शब्द ‘ओर’ के साथ संगति रखता है और दो ओरों में से एक को बताता है; इसे क्रमवाचक ‘पहली’ नहीं बनाया गया है।
