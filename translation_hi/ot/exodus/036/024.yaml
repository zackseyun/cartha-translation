base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/024.yaml
  text: And he made forty silver bases under the twenty frames, two bases under the one frame for its two tenons, and two bases under the other frame for its two tenons.
translation:
  language: hi
  text: और उसने बीस चौखटों के नीचे चाँदी के चालीस आधार बनाए—एक चौखट के नीचे उसके दो चूलों के लिए दो आधार, और दूसरी चौखट के नीचे उसके दो चूलों के लिए दो आधार।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַדְנֵי
  choice: आधार
  rationale: यहाँ तम्बू की चौखटों के नीचे लगाए जाने वाले चाँदी के socket-bases का उल्लेख है; ‘आधार’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: הַקְּרָשִׁים
  choice: चौखटों
  rationale: מִשְׁכָּן की खड़ी संरचनात्मक इकाइयों के लिए ‘चौखट’ साधारण पाठक को लकड़ी की बनी खड़ी संरचना का बोध कराता है और प्रसंग में स्थापित वास्तुशिल्पीय अर्थ रखता है।
- source_word: יְדֹתָיו
  choice: उसके दो चूलों
  rationale: शाब्दिक अर्थ ‘हाथ’ है, पर इस निर्माण-प्रसंग में ये चौखट के नीचे निकले हुए जोड़ने वाले tenons हैं; ‘चूल’ लकड़ी के जोड़ के उस उभरे भाग को व्यक्त करता है जो आधार में बैठता है।
- source_word: הָאֶחָד ... הָאֶחָד
  choice: एक ... दूसरी
  rationale: इब्रानी में दोनों बार ‘एक’ है, पर समानांतर वितरण का आशय दो अलग चौखटों पर दो-दो आधार बताना है; हिन्दी में ‘एक ... दूसरी’ इसे स्वाभाविक और स्पष्ट रखता है।
