base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/008.yaml
  text: And every skillful man among those doing the work made the tabernacle with ten curtains of finely twisted linen[a], and blue, and purple, and scarlet yarn; he made them with cherubim[b], the work of a skillful designer.
translation:
  language: hi
  text: काम करनेवालों में सब निपुण कारीगरों ने निवास-तंबू के लिए दस परदे बनाए—महीन बटे हुए सन, और नीले, बैंगनी और सुर्ख लाल सूत के। उसने उन्हें करूबों के डिज़ाइन वाली कुशल कारीगरी से बनाया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पद के आरंभ में इब्रानी क्रिया बहुवचन है—“उन्होंने बनाया”—पर अंत में क्रिया एकवचन है—“उसने उन्हें बनाया।” कुछ अनुवाद अंत की क्रिया को भी बहुवचन कर देते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: חֲכַם לֵב
  choice: निपुण कारीगर
  rationale: शाब्दिक अर्थ ‘हृदय से बुद्धिमान’ है, पर यहाँ यह शिल्प-कौशल का मुहावरा है। ‘निपुण कारीगर’ आधुनिक हिन्दी में इसका व्यावसायिक अर्थ स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּעֹשֵׂי הַמְּלָאכָה
  choice: काम करनेवालों में
  rationale: पूर्वसर्ग और कृदन्त उस समूह के भीतर सदस्यता बताते हैं जो निर्माण-कार्य में लगा था।
- source_word: הַמִּשְׁכָּן
  choice: पवित्र निवास
  rationale: מִשְׁכָּן का मूल अर्थ निवास-स्थान है और निर्गमन में यह इस्राएल के बीच परमेश्वर के पवित्र निवास-तंबू को सूचित करता है; ‘पवित्र’ संदर्भगत पहचान स्पष्ट करता है।
- source_word: יְרִיעֹת
  choice: परदे
  rationale: निवास के निर्माण-संदर्भ में यह बड़े कपड़े के पटों या परदों को सूचित करता है; ‘परदे’ सामान्य हिन्दी में सहज है।
- source_word: שֵׁשׁ מָשְׁזָר
  choice: बारीक बटा हुआ मलमल
  rationale: यह बारीक, बटे हुए सन के वस्त्र-सूत को सूचित करता है। ‘मलमल’ हिन्दी बाइबलीय और वस्त्र-संदर्भ में महीन लिनन के लिए बोधगम्य है।
- source_word: תְכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: नीले, बैंगनी और लाल रंग का सूत
  rationale: तीनों शब्द प्रतिष्ठित रंगे हुए वस्त्र-सामग्री को सूचित करते हैं; साझा ‘सूत’ जोड़ना हिन्दी में निर्माण-सामग्री को स्पष्ट करता है।
- source_word: כְּרֻבִים
  choice: करूबों की आकृतियाँ
  rationale: ‘करूब’ पवित्रस्थान से जुड़े विशिष्ट स्वर्गीय प्राणियों का पारंपरिक नाम है; ‘आकृतियाँ’ से स्पष्ट होता है कि परदों पर उनका कलात्मक निरूपण था।
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: कुशल कारीगरी से
  rationale: यह नियोजित, कलात्मक बुनाई या डिज़ाइन-कर्म को दर्शाता है। यह हिन्दी अभिव्यक्ति तकनीक को अनावश्यक रूप से केवल कढ़ाई तक सीमित नहीं करती।
- source_word: עָשָׂה אֹתָם
  choice: उसने ... बनाईं
  rationale: मसोरेटिक पाठ के अंतिम एकवचन क्रिया-रूप को बहुवचन में समतल करने के बजाय सुरक्षित रखा गया है।
theological_decisions:
- issue: חֲכַם לֵב का लिंग और सामान्य कारीगर-संदर्भ
  choice: जितने निपुण कारीगर थे, उन सबने
  alternative: हर निपुण पुरुष ने
  rationale: इब्रानी पद व्याकरणतः पुल्लिंग रूप में है, पर आरंभिक क्रिया बहुवचन है और वाक्य समूह के सभी कुशल कारीगरों की बात करता है। हिन्दी में ‘कारीगर’ स्वाभाविक रूप से स्रोत का व्यावसायिक आशय रखता है, जबकि ‘पुरुष’ जोड़ना संदर्भ से अधिक विशिष्टता ला सकता है।
- issue: पद के अंत में एकवचन क्रिया
  choice: उसने उन पर ... बनाईं
  alternative: उन्होंने उन पर ... बनाईं
  rationale: पद बहुवचन कर्ता से आरंभ होता है, लेकिन अंत में עָשָׂה एकवचन है। मुख्य पाठ में इस तनाव को रखा गया है और पादटिप्पणी में स्पष्ट किया गया है, ताकि पाठ को चुपचाप समरूप न बनाया जाए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और साधारण पाठक के लिए सुबोध रखी गई है। वस्त्र-निर्माण की तकनीकी बारीकियों को बनाए रखते हुए अत्यधिक संस्कृतनिष्ठ शब्दावली से बचा गया है। मुख्य पाठ में इब्रानी के बहुवचन से एकवचन की ओर बदलाव सुरक्षित है।
