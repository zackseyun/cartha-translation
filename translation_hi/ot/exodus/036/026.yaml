  choice: और ... चालीस
  rationale: संयोजक पूर्ववर्ती निर्माण-विवरण को आगे बढ़ाता है; संख्या को सीधे और स्वाभाविक हिंदी क्रम में रखा गया है।
- source_word: אַדְנֵי/הֶם
  choice: उनके लिए ... कुर्सियाँ
  rationale: मिलापवाले तंबू के संदर्भ में אֲדָנִים तख़्तों को थामने वाली आधार-कुर्सियों को दर्शाता है। हिंदी बाइबलीय स्थापत्य-प्रयोग में ‘कुर्सियाँ’ संक्षिप्त और उपयुक्त है; संबंधवाचक प्रत्यय को स्वाभाविक हिंदी में ‘उनके लिए’ व्यक्त किया गया है।
- source_word: כָּסֶף
  choice: चाँदी की
  rationale: यह आधार-कुर्सियों की सामग्री बताता है; ‘चाँदी की’ सहज हिंदी है।
- source_word: שְׁנֵי אֲדָנִים
  choice: दो कुर्सियाँ
  rationale: पहले आए स्थापत्य शब्द के साथ संगति रखते हुए संख्या और संज्ञा को सीधे अनूदित किया गया है।
- source_word: תַּחַת
  choice: के नीचे
  rationale: यह प्रत्येक तख़्ते के नीचे आधार-कुर्सियों की स्थिति बताता है।
- source_word: הַ/קֶּרֶשׁ
  choice: तख़्ता
  rationale: कֶרֶשׁ यहाँ तंबू की खड़ी संरचनात्मक पटिया है। ‘तख़्ता’ आधुनिक हिंदी में स्पष्ट है और वस्तु के ठोस रूप को बनाए रखता है।
- source_word: הָ/אֶחָד
  choice: एक
  rationale: इब्रानी दोनों उपवाक्यों में समान रूप से ‘एक तख़्ता’ दोहराता है। हिंदी में यह पुनरावृत्ति सुरक्षित रखी गई है, न कि दूसरे स्थान पर ‘दूसरा’ डालकर पाठ को स्पष्टतर बनाया गया है।
