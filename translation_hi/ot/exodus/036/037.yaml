base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/037.yaml
  text: And he made a screen for the entrance of the tent[a], of blue and purple and scarlet yarn, and fine twisted linen, the work of an embroiderer.
translation:
  language: hi
  text: और उसने तंबू के प्रवेश के लिए नीले, बैंगनी और लाल रंग के सूत तथा महीन बटे हुए लिनन से एक परदा[a] बनाया, जो कढ़ाईकार की कारीगरी था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘प्रवेश का आवरण’। यहाँ प्रयुक्त इब्रानी शब्द प्रवेश पर लटकाए जाने वाले परदे या आवरण को दर्शाता है और भीतरी ‘विभाजक परदे’ (פָּרֹכֶת) के लिए प्रयुक्त शब्द से अलग है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: और उसने ... बनाया
  rationale: यह क्रिया कथा को आगे बढ़ाती है; हिंदी में ‘और उसने ... बनाया’ उसके क्रमिक कथात्मक बल को स्वाभाविक रूप से बनाए रखता है।
- source_word: מָסָךְ
  choice: परदा
  rationale: यह प्रवेश पर लटकाए जाने वाले आवरण को दर्शाता है। सामान्य हिंदी में ‘परदा’ स्वाभाविक है; भीतरी विभाजक פָּרֹכֶת से इसका अंतर पादटिप्पणी में स्पष्ट किया गया है।
- source_word: לְפֶתַח הָאֹהֶל
  choice: तंबू के प्रवेश के लिए
  rationale: פֶּתַח प्रवेश या खुलने की जगह है और אֹהֶל सामान्य संज्ञा ‘तंबू’; इसलिए मूल को अनावश्यक रूप से ‘निवासस्थान’ में विस्तृत नहीं किया गया।
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: नीले, बैंगनी और लाल रंग के सूत
  rationale: ये रंगे हुए वस्त्र-सामग्री या धागों की सूची है। ‘सूत’ जोड़ने से हिंदी में वस्त्र-संदर्भ स्पष्ट होता है, जबकि रंगों की पारंपरिक पहचान बनी रहती है।
- source_word: וְשֵׁשׁ מָשְׁזָר
  choice: बटी हुई उत्तम मलमल
  rationale: שֵׁשׁ उत्तम महीन लिनन और מָשְׁזָר बटे हुए धागे को दर्शाता है। ‘मलमल’ आधुनिक हिंदी बाइबलीय वस्त्र-संदर्भ में महीन लिनन के लिए सुबोध शब्द है।
- source_word: מַעֲשֵׂה רֹקֵם
  choice: कढ़ाई करने वाले कारीगर का काम
  rationale: यह कुशल रंगीन कढ़ाई या सजावटी वस्त्रकारी को बताने वाला तकनीकी पद है; यह अनुवाद कारीगरी और कारीगर दोनों को स्पष्ट रखता है।
