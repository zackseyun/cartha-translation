translation:
  language: hi
  text: 'उसने निवास-मण्डप के लिए तख्ते बनाए: दक्षिण की ओर वाले पार्श्व[a] के लिए बीस तख्ते।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘दक्षिण की ओर वाले पार्श्व के लिए बीस पटरे।’ इब्रानी में ‘दक्षिण’ के लिए दो पद साथ आए हैं—शाब्दिक रूप से, ‘दक्षिण के पार्श्व के लिए, दक्षिण की ओर।’
    reason: ‘तख्ते/पटरे’ की वैकल्पिक शब्दावली तथा इब्रानी के दोहरे दक्षिण-सूचक प्रयोग को स्पष्ट करना।
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: उसने ... बनाए
  rationale: עשה के क़ाल वय्यिक्तोल रूप को बीती हुई क्रमिक घटना के रूप में रखा गया है; कर्ता संदर्भ से एकवचन है।
- source_word: הַקְּרָשִׁים
  choice: तख्ते
  rationale: קֶרֶשׁ निवास-मण्डप के खड़े संरचनात्मक सदस्यों को दर्शाता है। ‘तख्ते’ आधुनिक हिन्दी में ठोस और सहज है; ‘चौखटे’ उनकी बनावट को आवश्यकता से अधिक निश्चित कर सकता है।
- source_word: לַמִּשְׁכָּן
  choice: निवास-मण्डप के लिए
  rationale: מִשְׁכָּן निर्गमन में इस पवित्र निवास-संरचना का मानक नाम है। ‘निवास-मण्डप’ उसके ‘निवास’ अर्थ और तम्बू-सदृश संरचना, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עֶשְׂרִים קְרָשִׁים
  choice: बीस तख्ते
  rationale: गिनती और संज्ञा को सीधे रखा गया है तथा इब्रानी की पुनरावृत्ति बनाए रखने के लिए ‘तख्ते’ फिर से कहा गया है।
- source_word: לִפְאַת
  choice: भुजा के लिए
  rationale: פֵּאָה यहाँ संरचना की एक ओर या भुजा को दर्शाता है। वास्तु-वर्णन में ‘भुजा’ संक्षिप्त और स्पष्ट है।
- source_word: נֶגֶב תֵּימָנָה
  choice: दक्षिणी ... दक्षिण की ओर
  rationale: दोनों दक्षिण-सूचक पदों को बनाए रखा गया है, ताकि मूल पाठ का दोहरा भौगोलिक-दिशात्मक कथन मिट न जाए।
