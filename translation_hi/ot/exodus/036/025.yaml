  yaml_path: translation/ot/exodus/036/025.yaml
  text: For the second side of the tabernacle[a], on the north side, he made twenty boards.
translation:
  language: hi
  text: और पवित्र निवास के दूसरे पार्श्व के लिए, अर्थात् उत्तर की ओर, उसने बीस तख्ते[a] बनाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “चौखटे।” इब्रानी शब्द संरचना में लगे तख्तों या चौखटों को सूचित कर सकता है; पवित्र निवास के इन भागों का ठीक स्वरूप निश्चित नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְצֶלַע
  choice: और ... की दूसरी ओर
  rationale: צֶלַע यहाँ शरीर की ‘पसली’ नहीं, बल्कि पवित्र निवास के संरचनात्मक ‘पार्श्व/ओर’ को दर्शाता है। आरंभिक וּ को ‘और’ के रूप में रखा गया है, जबकि לְ को हिंदी में स्वाभाविक वाक्य-विन्यास के भीतर व्यक्त किया गया है।
- source_word: הַמִּשְׁכָּן
  choice: पवित्र निवास
  rationale: מִשְׁכָּן का मूल भाव ‘निवास-स्थान’ है और इस प्रसंग में यह इस्राएल के चलायमान पवित्रस्थान का मानक नाम है। ‘पवित्र निवास’ आधुनिक हिंदी में अर्थपूर्ण और गरिमापूर्ण है।
- source_word: הַשֵּׁנִית
  choice: दूसरी
  rationale: विशेषण निर्माण-क्रम में संबंधित दूसरी ओर को स्पष्ट रूप से चिह्नित करता है; इसलिए अस्पष्ट ‘दूसरी तरफ़’ के बजाय ‘दूसरी ओर’ रखा गया है।
- source_word: לִפְאַת צָפוֹן
  choice: उत्तर दिशा में
  rationale: यह पदबंध उत्तर की ओर स्थित भाग या दिशा को बताता है। ‘उत्तर दिशा में’ स्रोत का दिशात्मक अर्थ स्वाभाविक हिंदी में देता है।
- source_word: עָשָׂה
  choice: उसने ... बनाए
  rationale: עָשָׂה सामान्य क्रिया ‘बनाना’ है। कर्ता पिछले संदर्भ से निहित है, इसलिए हिंदी में ‘उसने’ रखा गया है।
- source_word: עֶשְׂרִים
  choice: बीस
  rationale: मूल संख्या का सीधा अनुवाद।
- source_word: קְרָשִׁים
  choice: तख्ते
  rationale: यह शब्द पवित्र निवास के लकड़ी के संरचनात्मक अवयवों को दर्शाता है। ‘तख्ते’ सामान्य हिंदी में सहज है, पर उनकी सटीक बनावट—ठोस तख्ते या चौखटे—विवादित होने के कारण विकल्प पादटिप्पणी में रखा गया है।
