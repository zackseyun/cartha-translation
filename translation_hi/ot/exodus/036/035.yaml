base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/035.yaml
  text: And he made the curtain of blue[a], purple, and scarlet yarn, and fine twisted linen; he made it with cherubim[c][b], the work of a skillful designer.
translation:
  language: hi
  text: उसने नीले, बैंगनी और किरमिजी धागे[b] तथा महीन बटे हुए सन के कपड़े से परदा[a] बनाया। उस पर उसने करूबों की आकृतियाँ कुशल कलात्मक कारीगरी[c] से बनाईं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘विभाजक परदा।’ यह पवित्र निवास के भीतर परमपवित्र स्थान को अलग करने वाला परदा था।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में यह किरमिजी-रंगे पदार्थ या धागे के लिए एक पद है; ‘स्कारलेट’ या ‘गहरा लाल’ भी संभावित अनुवाद हैं।
    reason: lexical_alternative
  - marker: c
    text: या, ‘कुशल शिल्पकार का काम’ अथवा ‘नमूनेदार शिल्पकार्य।’ इब्रानी पद कलात्मक, योजनाबद्ध कारीगरी का संकेत देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפָּרֹכֶת
  choice: परदा
  rationale: यह शब्द पवित्र निवास के भीतर भागों को अलग करने वाले परदे के लिए है। ‘परदा’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है; ‘विभाजक परदा’ अर्थ को अधिक स्पष्ट करने वाला विकल्प है।
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: नीले, बैंगनी और लाल रंग का सूत
  rationale: ये रंगीन वस्त्र-सामग्री के पद हैं। प्रसंग के कारण ‘सूत’ को सामूहिक रूप से व्यक्त किया गया है; תוֹלַעַת שָׁנִי के गहरे लाल/किरमिजी रंग को सरल आधुनिक हिन्दी में ‘लाल’ कहा गया है।
- source_word: שֵׁשׁ מָשְׁזָר
  choice: बारीक बटा हुआ मलमल
  rationale: שֵׁשׁ बढ़िया सन-वस्त्र और מָשְׁזָר उसके बटे हुए होने को बताता है। ‘मलमल’ हिन्दी बाइबलीय वस्त्र-प्रसंग में सुबोध है और ‘बटा हुआ’ निर्माण की विशेषता बनाए रखता है।
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: कुशल कारीगर की कारीगरी
  rationale: यह पद कलात्मक, नमूनेदार और योजनापूर्वक किए गए वस्त्र-काम को सूचित करता है। यह अनुवाद कारीगरी के भाव को रखता है, बिना किसी एक तकनीक—जैसे कढ़ाई—को निश्चित किए।
- source_word: כְּרֻבִים
  choice: करूबों की आकृतियाँ
  rationale: ‘करूब’ इन स्वर्गीय प्राणियों के लिए स्थापित हिन्दी बाइबलीय शब्द है। ‘आकृतियाँ’ जोड़ने से स्पष्ट होता है कि वे परदे की कलात्मक बनावट में दर्शाए गए थे।
