  text: He made curtains of goats’ hair for a tent over the tabernacle[a]; he made eleven curtains.
translation:
  language: hi
  text: उसने निवास के ऊपर तम्बू बनाने के लिए बकरी के बालों के ग्यारह परदे बनाए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘बकरियों के परदे’; यहाँ सम्भवतः बकरी के बालों से बुने परदे अभिप्रेत हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ / עָשָׂה
  choice: उसने … बनाए
  rationale: עָשָׂה का सामान्य अर्थ ‘बनाना’ है। हिंदी में एक ही वाक्य में क्रिया दोहराने के बजाय ग्यारह परदों को सीधे कर्म बनाना अर्थ और स्वाभाविकता दोनों बनाए रखता है।
- source_word: יְרִיעֹת
  choice: परदे
  rationale: निवास के प्रसंग में यह शब्द बड़े कपड़े के पटों या परदों को सूचित करता है; ‘परदे’ आधुनिक हिंदी में स्पष्ट और परिचित है।
- source_word: עִזִּים
  choice: बकरी के बालों के
  rationale: शाब्दिक रूप से ‘बकरियों के’ है, पर इस वस्त्र-निर्माण प्रसंग में आशय बकरी के बालों से बुने परदों का है; सामग्री को स्पष्ट करना स्वाभाविक हिंदी देता है।
- source_word: לְאֹהֶל
  choice: तम्बू बनाने के लिए
  rationale: לְ यहाँ उद्देश्य अथवा कार्य बताता है। यह वाक्यांश स्पष्ट करता है कि ये परदे निवास के ऊपर तम्बू-सदृश आवरण बनाने के लिए थे।
- source_word: עַל
  choice: के ऊपर
  rationale: यह निवास पर आवरण की स्थिति व्यक्त करता है।
- source_word: הַמִּשְׁכָּן
  choice: निवास
  rationale: מִשְׁכָּן का मूल भाव ‘निवास-स्थान’ है और निर्गमन में यह पवित्र संरचना का पारिभाषिक नाम है; ‘निवास’ dignified और समझने योग्य हिंदी है तथा ऊपर के ‘तम्बू’ से भेद रखता है।
- source_word: עַשְׁתֵּי עֶשְׂרֵה
  choice: ग्यारह
  rationale: यह संख्या सीधे ‘ग्यारह’ है।
- source_word: אֹתָם
  choice: ग्यारह परदे बनाए
  rationale: सर्वनाम का संदर्भ परदों से है; स्वाभाविक हिंदी में संख्या और संज्ञा को क्रिया का सीधा कर्म बनाने से इसका भाव समाहित हो जाता है।
