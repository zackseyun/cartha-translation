id: EXO.36.32
reference: Exodus 36:32
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/חֲמִשָּׁ֣ה בְרִיחִ֔ם לְ/קַרְשֵׁ֥י צֶֽלַע הַ/מִּשְׁכָּ֖ן הַ/שֵּׁנִ֑ית וַ/חֲמִשָּׁ֤ה בְרִיחִם֙ לְ/קַרְשֵׁ֣י הַ/מִּשְׁכָּ֔ן לַ/יַּרְכָתַ֖יִם יָֽמָּ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/032.yaml
  text: and five bars for the boards of the second side of the tabernacle[b][a], and five bars for the boards of the tabernacle at the far rear on the west.
translation:
  language: hi
  text: और निवास की दूसरी ओर के तख्तों के लिए पाँच छड़ें[a], और पश्चिम की ओर निवास के बिलकुल पिछले भाग के तख्तों के लिए पाँच छड़ें[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘आड़ी छड़ें’।
    reason: lexical_alternative
  - marker: b
    text: या, ‘निवास के पिछले सिरे के लिए, पश्चिम की ओर’।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְרִיחִם
  choice: छड़ें
  rationale: यहाँ ये तख्तों को आपस में बाँधने वाली क्षैतिज संरचनात्मक छड़ें हैं। ‘छड़ें’ आधुनिक और सहज है; ‘आड़ी छड़ें’ को पादटिप्पणी में वैकल्पिक स्पष्टता के रूप में रखा गया है।
- source_word: קַרְשֵׁי
  choice: तख्तों
  rationale: निर्गमन में यह निवास के लकड़ी के संरचनात्मक खंडों को दर्शाता है। ‘तख्ते’ सामान्य पाठक के लिए स्वाभाविक है और ‘चौखटे’ जैसा अधिक व्याख्यात्मक वास्तु-निर्धारण नहीं करता।
- source_word: צֶלַע
  choice: ओर
  rationale: इस वास्तु-संदर्भ में शब्द निवास के एक पार्श्व या बाजू को दर्शाता है। ‘ओर’ सहज हिन्दी है और संरचना को अनावश्यक रूप से ‘बगल की दीवार’ नहीं ठहराता।
- source_word: הַשֵּׁנִית
  choice: दूसरी
  rationale: शाब्दिक क्रम ‘दूसरी’ को बनाए रखा गया है; यह पिछले पद में वर्णित पहली ओर से इसका भेद दिखाता है।
- source_word: הַמִּשְׁכָּן
  choice: निवास
  rationale: मिश्कान का मूल अर्थ निवास-स्थान है और निर्गमन में यह पवित्र तंबू-संरचना का स्थापित नाम है। ‘निवास’ संक्षिप्त, गरिमापूर्ण और स्रोत-शब्द की अर्थ-छवि के निकट है।
- source_word: לַיַּרְכָתַיִם
  choice: बिलकुल पिछले भाग
  rationale: यह शब्द केवल पीछे की दिशा नहीं, बल्कि दूरस्थ अथवा अंतिम पिछला भाग भी व्यक्त करता है। ‘बिलकुल पिछले भाग’ उस स्थानिक बल को सहज हिन्दी में बनाए रखता है।
- source_word: יָמָּה
  choice: पश्चिम की ओर
  rationale: दिशासूचक रूप यहाँ पश्चिम दिशा को बताता है। ‘पश्चिम की ओर’ उसके दिशात्मक स्वरूप को सीधे व्यक्त करता है।
- source_word: וַחֲמִשָּׁה ... וַחֲמִשָּׁה
  choice: और ... पाँच ... और ... पाँच
  rationale: दोनों समूहों के समन्वय और सूची-जैसी इब्रानी शैली को हिन्दी में दोहराए गए ‘और’ तथा ‘पाँच’ से बनाए रखा गया है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण निर्माण-सम्बन्धी वर्णन अपनाया गया है। ‘बिलकुल पिछले भाग’ से יַרְכָתַיִם की दूरस्थ/अंतिम भाग वाली अर्थ-छाया बचाई गई है; वाक्य की सूचीबद्ध पुनरावृत्ति भी मूल के अनुरूप रखी गई है।
