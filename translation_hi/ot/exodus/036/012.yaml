translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, सरल किंतु गरिमापूर्ण रखी गई है। निर्माण-विवरण की पुनरावृत्ति को मूल के अनुरूप बनाए रखा गया है। “जुड़ा हुआ समूह” सामान्य पाठक के लिए समझने योग्य है, जबकि उसकी वास्तविक शब्दगत व्यापकता पादटिप्पणी में दी गई है।
