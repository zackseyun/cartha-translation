base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/012.yaml
  text: He made fifty loops on the one curtain[a], and he made fifty loops on the edge of the curtain that was in the second set[b]; the loops corresponded to one another.
translation:
  language: hi
  text: उसने एक परदे में पचास फंदे बनाए, और उस परदे के किनारे पर पचास फंदे बनाए जो दूसरे जुड़े हुए समूह में था[a]। फंदे आमने-सामने, एक-दूसरे के अनुरूप थे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जो दूसरे जोड़ में था” अथवा “जो दूसरे जुड़े हुए खंड में था।”
    reason: מַחְבֶּרֶת के लिए “जोड़,” “जुड़ा हुआ खंड” और “जुड़ा हुआ समूह” संभव हैं; मूल शब्द जोड़ने की क्रिया अथवा उससे बनी संयुक्त इकाई का संकेत दे सकता है।
  - marker: b
    text: शाब्दिक रूप से, “फंदे एक-एक दूसरे के सामने थे।”
    reason: यह टिप्पणी מַקְבִּילֹת और אַחַת אֶל אֶחָת की इब्रानी संरचना को सुरक्षित रखती है, जो फंदों के एक-एक करके सामने मिलने पर बल देती है।
lexical_decisions:
- source_word: לֻלָאֹת
  choice: फंदे
  rationale: यह शब्द कपड़े के उन फंदों को दर्शाता है जिनसे परदों को आपस में जोड़ा जाता था। “फंदे” आधुनिक हिंदी में स्वाभाविक है और इसे अलग से प्रयुक्त धातु के अंकड़ों से भिन्न रखता है।
- source_word: יְרִיעָה
  choice: परदा
  rationale: मिलापवाले तंबू के संदर्भ में यह बड़े कपड़े के परदे को दर्शाता है; “परदा” स्पष्ट, प्रचलित और प्रसंगानुकूल है।
- source_word: בִּקְצֵה
  choice: किनारे पर
  rationale: यहाँ फंदे परदे की सीमा पर लगाए गए थे, इसलिए “किनारे पर” स्थान और प्रयोजन दोनों को स्पष्ट रूप से व्यक्त करता है।
- source_word: מַחְבֶּרֶת
  choice: जुड़ा हुआ समूह
  rationale: यह उन परदों से बने एक संयुक्त खंड या समूह को दर्शाता है जिन्हें आपस में जोड़ा गया था। “जुड़ा हुआ समूह” प्रक्रिया और परिणामी इकाई दोनों को समझने योग्य ढंग से व्यक्त करता है।
- source_word: הַשֵּׁנִית
  choice: दूसरे
  rationale: मूल में क्रमसूचक विशेषण है, जो पहले संयुक्त समूह के अनुरूप दूसरे समूह को बताता है; इसलिए “दूसरे” रखा गया है।
- source_word: מַקְבִּילֹת
  choice: आमने-सामने, ... अनुरूप थे
  rationale: यह कृदंत फंदों के परस्पर सामने और मेल में होने का भाव देता है। संयुक्त अभिव्यक्ति उनकी वास्तविक स्थिति और कार्यात्मक अनुरूपता दोनों बताती है।
- source_word: אַחַת אֶל אֶחָת
  choice: एक-दूसरे के
  rationale: शाब्दिक रूप से “एक का एक की ओर” फंदों की परस्पर एक-एक करके अनुरूपता दर्शाता है; हिंदी में “एक-दूसरे के” स्वाभाविक है।
- source_word: עָשָׂה
  choice: बनाए
  rationale: सामान्य क्रिया का सीधा और प्रसंगानुकूल हिंदी समतुल्य “बनाए” है।
