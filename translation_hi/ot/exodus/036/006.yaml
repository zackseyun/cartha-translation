base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/006.yaml
  text: So Moses commanded[a], and they sent a proclamation through the camp, saying[b], “Let neither man nor woman do any more work for the contribution of the sanctuary.” So the people were restrained from bringing more.
translation:
  language: hi
  text: 'तब मूसा ने आज्ञा दी, और छावनी भर में यह घोषणा करवाई गई[a]: “कोई पुरुष या स्त्री पवित्रस्थान के लिए चढ़ावे का अब और कोई काम न करे।” लोगों को और भेंट लाने से रोक दिया गया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “छावनी में आवाज़ फिरवाई गई”; अर्थात सार्वजनिक घोषणा प्रसारित करवाई गई।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: आज्ञा दी
  rationale: צוה यहाँ अधिकारपूर्वक आदेश देने को दर्शाता है; ‘आज्ञा दी’ उसके बल और कथात्मक शैली दोनों को बनाए रखता है।
- source_word: וַיַּעֲבִירוּ קוֹל
  choice: यह घोषणा करवाई गई
  rationale: इस इब्रानी मुहावरे का शाब्दिक अर्थ ‘आवाज़ को फिरवाना’ है। ‘घोषणा करवाई गई’ हिफ़ील के कारक भाव और सार्वजनिक सूचना, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בַּמַּחֲנֶה
  choice: छावनी भर में
  rationale: ב का मूल अर्थ ‘में’ है, पर घोषणा के पूरे समुदाय में प्रसारित होने के संदर्भ में ‘छावनी भर में’ अधिक स्वाभाविक है।
- source_word: אִישׁ וְאִשָּׁה
  choice: कोई पुरुष या स्त्री
  rationale: यह युग्म दोनों लिंगों को स्पष्ट रूप से सम्मिलित करता है और निषेधात्मक वाक्य में स्वाभाविक हिन्दी देता है।
- source_word: אַל יַעֲשׂוּ עוֹד מְלָאכָה
  choice: अब और कोई काम न करे
  rationale: מְלָאכָה काम अथवा कारीगरी को सूचित कर सकता है। व्यापक ‘काम’ मूल की अर्थ-सीमा को अनावश्यक रूप से संकुचित नहीं करता।
- source_word: לִתְרוּמַת הַקֹּדֶשׁ
  choice: पवित्रस्थान के चढ़ावे के लिए
  rationale: תְּרוּמָה अलग रखे गए अंश, योगदान या चढ़ावे को और הַקֹּדֶשׁ इस प्रसंग में पवित्रस्थान को सूचित करता है। यह रूप धार्मिक संदर्भ में सुबोध और स्वाभाविक है।
- source_word: וַיִּכָּלֵא
  choice: रोक दिया गया
  rationale: כלא का निफ़ाल रूप रोके या नियंत्रित किए जाने का निष्क्रिय भाव देता है; ‘रोक दिया गया’ अनिच्छा का संकेत जोड़े बिना इसे स्पष्ट करता है।
- source_word: מֵהָבִיא
  choice: और सामग्री लाने से
  rationale: מן के साथ क्रियार्थक रूप किसी कार्य से रोके जाने को दर्शाता है। ‘और’ प्रसंग से स्पष्ट निरंतरता को व्यक्त करता है, और ‘सामग्री’ बताता है कि लोग पवित्रस्थान के निर्माण हेतु वस्तुएँ ला रहे थे।
