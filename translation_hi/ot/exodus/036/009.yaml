base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/009.yaml
  text: The length of each curtain was twenty-eight cubits[a], and the width of each curtain was four cubits[b]; all the curtains had one measurement.
translation:
  language: hi
  text: प्रत्येक परदे की लंबाई अट्ठाईस हाथ[a] और चौड़ाई चार हाथ थी; सभी परदों का नाप एक ही था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘हाथ’ एक प्राचीन लंबाई की इकाई थी, जो लगभग 45 सेंटीमीटर के बराबर थी।
    reason: measurement_clarification
lexical_decisions:
- source_word: אֹרֶךְ
  choice: लंबाई
  rationale: भौतिक आयाम के लिए आधुनिक मानक हिन्दी का स्वाभाविक शब्द।
- source_word: יְרִיעָה
  choice: परदा
  rationale: मिलापवाले तम्बू के प्रसंग में यह कपड़े के बड़े आवरण या पट को दर्शाता है; ‘परदा’ स्पष्ट और प्रचलित हिन्दी रूप है।
- source_word: הָאַחַת / הָאֶחָת
  choice: प्रत्येक
  rationale: शाब्दिक रूप ‘एक’ है, पर माप के इस वितरणात्मक कथन में आशय हर परदे से है।
- source_word: שְׁמֹנֶה וְעֶשְׂרִים
  choice: अट्ठाईस
  rationale: संख्या का स्वाभाविक आधुनिक हिन्दी रूप।
- source_word: אַמָּה
  choice: हाथ
  rationale: प्राचीन कोहनी से उँगलियों तक की माप के लिए हिन्दी बाइबलीय परंपरा में प्रचलित शब्द; आधुनिक पाठक की सहायता के लिए टिप्पणी दी गई है।
- source_word: רֹחַב
  choice: चौड़ाई
  rationale: लंबाई के समानांतर भौतिक आयाम का सहज हिन्दी शब्द।
- source_word: אַרְבַּע
  choice: चार
  rationale: मूल संख्या का सीधा अनुवाद।
- source_word: מִדָּה אַחַת
  choice: नाप एक ही था
  rationale: शाब्दिक ‘एक नाप’ को स्वाभाविक हिन्दी में रखते हुए सभी परदों के समान आकार का भाव व्यक्त करता है।
- source_word: לְכָל הַיְרִיעֹת
  choice: सभी परदों का
  rationale: समान नाप के दायरे में समस्त परदों को स्पष्ट रूप से शामिल करता है।
