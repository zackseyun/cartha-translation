  rationale: 'इब्रानी की पुनरुक्ति वितरण का भाव देती है: आठों चौखटों में से प्रत्येक के नीचे दो आधार। हिन्दी का ‘दो-दो’ इस पुनरुक्त वितरण को संक्षेप में स्वाभाविक रूप से व्यक्त करता है।'
