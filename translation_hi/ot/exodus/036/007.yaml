translation:
  language: hi
  text: और सामग्री सारा काम करने के लिए पर्याप्त थी, और बच भी गई थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַמְּלָאכָה
  choice: सामग्री
  rationale: पहला מְלָאכָה संदर्भ में लोगों द्वारा लाई गई निर्माण-सामग्री को सूचित करता है; हिन्दी में ‘सामग्री’ इस आशय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הָיְתָה דַיָּם
  choice: उनके पास ... पर्याप्त ... थी
  rationale: דַיָּם पर्याप्तता व्यक्त करता है और बहुवचन प्रत्यय कारीगरों/काम करने वालों की ओर संकेत करता है; हिन्दी में ‘उनके पास पर्याप्त सामग्री थी’ सहज है।
- source_word: לְכָל הַמְּלָאכָה
  choice: वह सारा काम
  rationale: दूसरा מְלָאכָה यहाँ किए जाने वाले पूरे कार्य को दर्शाता है; ‘सारा काम’ כָל की व्यापकता बनाए रखता है।
- source_word: לַעֲשׂוֹת אֹתָהּ
  choice: पूरा करने के लिए
  rationale: शाब्दिक ‘उसे करने के लिए’ की अपेक्षा यह हिन्दी में स्वाभाविक है और निर्माण-कार्य को संपन्न करने का आशय स्पष्ट करता है।
- source_word: וְהוֹתֵר
  choice: बल्कि आवश्यकता से भी अधिक थी
  rationale: יתר का हिफ़ईल रूप जरूरत से बढ़कर होने अथवा बच रहने का भाव देता है; यह चयन मुख्य पाठ में प्रचुरता को स्वाभाविक ढंग से व्यक्त करता है।
