lexical_decisions:
- source_word: וּלְיַרְכְּתֵי
  choice: और ... के पीछे
  rationale: यह पदबंध निर्माण के अगले विवरण को जोड़ता है और पवित्र निवास के दूरस्थ अथवा पिछले भाग को दर्शाता है। आधुनिक हिन्दी में ‘के पीछे’ स्वाभाविक और वास्तु-संदर्भ में स्पष्ट है।
- source_word: הַמִּשְׁכָּן
  choice: पवित्र निवास
  rationale: מִשְׁכָּן का मूल अर्थ ‘निवास’ है और निर्गमन में यह इस्राएल के पवित्र तंबू-सदृश आराधना-स्थान का तकनीकी नाम है। ‘पवित्र निवास’ अर्थ को स्पष्ट रखते हुए सामान्य आधुनिक पाठक के लिए बोधगम्य है।
- source_word: יָמָּה
  choice: पश्चिम की ओर
  rationale: शाब्दिक रूप से यह ‘समुद्र की ओर’ है, पर बाइबिलीय दिशा-प्रयोग में इसका आशय पश्चिम है। हिन्दी में ‘पश्चिम की ओर’ दिशात्मक भाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עָשָׂה
  choice: उसने ... बनाए
  rationale: सामान्य क्रिया עשה का सीधा अर्थ ‘बनाना’ है। कर्ता पूर्ववर्ती प्रसंग से समझा जाता है और हिन्दी में ‘उसने’ उसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: שִׁשָּׁה
  choice: छह
  rationale: मूल पाठ की निश्चित संख्या का सीधा अनुवाद।
- source_word: קְרָשִׁים
  choice: चौखटे
  rationale: यह शब्द पवित्र निवास के सीधे खड़े संरचनात्मक अवयवों को दर्शाता है। ‘चौखटे’ उन्हें केवल सपाट तख्ते मान लेने के बजाय संरचनात्मक इकाइयों के रूप में व्यक्त करता है; वास्तविक बनावट को लेकर शब्द की अनिश्चितता पादटिप्पणी में सुरक्षित है।
