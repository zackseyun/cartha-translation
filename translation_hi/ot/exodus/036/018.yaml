lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: उसने बनाए
  rationale: वय्यिक्तोल रूप कथा को आगे बढ़ाता है; आधुनिक हिन्दी में साधारण भूतकाल स्वाभाविक है।
- source_word: קַרְסֵי
  choice: अंकुड़े
  rationale: यह तंबू के भागों को परस्पर जोड़ने वाले धातु के बंधकों को दर्शाता है; ‘अंकुड़े’ निर्माण-संदर्भ में संक्षिप्त और ठोस है।
- source_word: נְחֹשֶׁת
  choice: काँसे के
  rationale: पवित्र तंबू की सामग्री के संदर्भ में यह शब्द परंपरागत और संभावित रूप से काँसे को दर्शाता है, यद्यपि मूल शब्द ताँबे के लिए भी प्रयुक्त हो सकता है।
- source_word: חֲמִשִּׁים
  choice: पचास
  rationale: अंकुड़ों की संख्या बताने वाला सीधा गणनावाचक शब्द है।
- source_word: לְחַבֵּר
  choice: जोड़कर
  rationale: यह अंकुड़ों के उद्देश्य को व्यक्त करता है—तंबू के भागों को परस्पर जोड़ना।
- source_word: אֶת הָאֹהֶל
  choice: तंबू
  rationale: אֹהֶל का प्रत्यक्ष अर्थ ‘तंबू’ है; संदर्भ में यह पवित्र निवास की तंबू-संरचना को दर्शाता है।
- source_word: לִהְיוֹת אֶחָד
  choice: एक किया जा सके
  rationale: यह जोड़ने के उद्देश्य अथवा परिणाम को व्यक्त करता है कि संरचना एक इकाई बने।
