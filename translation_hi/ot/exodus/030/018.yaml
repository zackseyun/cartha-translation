base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/018.yaml
  text: You shall make a bronze basin[a], with its stand of bronze, for washing; and you shall place it between the tent of meeting and the altar[c][b], and you shall put water there.
translation:
  language: hi
  text: “तुम धोने के लिए काँसे का एक हौद[a][b] और काँसे का उसका आधार[c] बनाओ। उसे मिलाप के तंबू और वेदी के बीच रखो, और उसमें पानी डालो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “धोने का बड़ा पात्र” या पारंपरिक रूप से, “हौदी।”
    reason: lexical_alternative
  - marker: b
    text: “काँसा” का अनुवाद “ताँबा” भी किया जा सकता है; इब्रानी शब्द संदर्भ के अनुसार ताँबे या ताँबे की किसी मिश्रधातु को दर्शा सकता है।
    reason: lexical_alternative
  - marker: c
    text: या, “चौकी” या “स्टैंड।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּיּוֹר
  choice: हौद
  rationale: यह पवित्र-स्थान में धोने के लिए पानी रखने वाले बड़े पात्र को दर्शाता है। ‘हौद’ सामान्य आधुनिक पाठक के लिए स्पष्ट है और पात्र के अपेक्षाकृत बड़े आकार का संकेत देता है।
- source_word: נְחֹשֶׁת
  choice: काँसा
  rationale: पवित्र-स्थान की वस्तुओं के संदर्भ में यह प्रचलित और उपयुक्त अनुवाद है; इब्रानी शब्द ताँबे या ताँबे की मिश्रधातु को भी दर्शा सकता है, इसलिए विकल्प को पादटिप्पणी में रखा गया है।
- source_word: כַּן
  choice: चौकी
  rationale: यह हौद को थामने वाली सहायक संरचना है। ‘चौकी’ उसका कार्य सहज रूप से बताती है; ‘आधार’ भी संभव है।
- source_word: לְרָחְצָה
  choice: धोने के लिए
  rationale: उद्देश्यसूचक इब्रानी रूप का संक्षिप्त अनुवाद है और इस पद में न बताए गए कर्म को जोड़ने से बचता है।
- source_word: אֹהֶל מוֹעֵד
  choice: मिलाप का तंबू
  rationale: यह इस्राएल के पवित्र तंबू का मान्य, सहज और अर्थपूर्ण हिन्दी नाम है, जहाँ परमेश्वर अपने लोगों से मिलने के लिए उपस्थित होता है।
- source_word: מִזְבֵּחַ
  choice: वेदी
  rationale: बलि चढ़ाने की वेदी के लिए सीधा और स्थापित हिन्दी शब्द।
- source_word: שָׁמָּה
  choice: उसमें
  rationale: इब्रानी का शाब्दिक अर्थ ‘वहाँ’ है, पर हिन्दी में पानी के अभिप्रेत स्थान—हौद—को स्पष्ट करके ‘उसमें पानी डालना’ अधिक स्वाभाविक है।
- source_word: מַיִם
  choice: पानी
  rationale: सामान्य आधुनिक हिन्दी में सीधा और स्वाभाविक अनुवाद।
- source_word: וְעָשִׂיתָ ... וְנָתַתָּ ... וְנָתַתָּ
  choice: तुम ... बनाना ... रखना ... डालना
  rationale: निर्देशात्मक संदर्भ में ये रूप आदेश का भाव रखते हैं। हिन्दी का ‘तुम ... बनाना/रखना/डालना’ क्रमिक निर्देश की शक्ति और एकवचन संबोधन के आशय को स्वाभाविक ढंग से व्यक्त करता है।
