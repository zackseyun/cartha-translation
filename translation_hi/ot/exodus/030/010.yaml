source:
  edition: WLC
  text: וְ/כִפֶּ֤ר אַהֲרֹן֙ עַל קַרְנֹתָ֔י/ו אַחַ֖ת בַּ/שָּׁנָ֑ה מִ/דַּ֞ם חַטַּ֣את הַ/כִּפֻּרִ֗ים אַחַ֤ת בַּ/שָּׁנָה֙ יְכַפֵּ֤ר עָלָי/ו֙ לְ/דֹרֹ֣תֵי/כֶ֔ם קֹֽדֶשׁ קָֽדָשִׁ֥ים ה֖וּא לַ/יהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/010.yaml
  text: Aaron shall make atonement on its horns once a year[a]. With the blood of the sin offering of atonement he shall make atonement for it once a year throughout your generations. It is most holy to Yahweh.
translation:
  language: hi
  text: हारून वर्ष में एक बार उसके सींगों पर प्रायश्चित करे। प्रायश्चित की पापबलि के लहू से वह तुम्हारी पीढ़ियों तक वर्ष में एक बार उसके लिए प्रायश्चित करे। वह यहोवा के लिए परमपवित्र है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִפֶּר / יְכַפֵּר
  choice: प्रायश्चित करे
  rationale: याजकीय बलिदान-संदर्भ में כפר विधिवत प्रायश्चित करने को दर्शाता है; यह स्थापित, संक्षिप्त और अर्थानुकूल हिन्दी पद है।
- source_word: קַרְנֹתָיו
  choice: उसकी सींगों पर
  rationale: सर्वनाम निकटवर्ती धूप-वेदी की ओर संकेत करता है; हिन्दी में व्याकरणिक लिंग के अनुसार 'उसकी' स्वाभाविक है।
- source_word: אַחַת בַּשָּׁנָה
  choice: वर्ष में एक बार
  rationale: यह इब्रानी अभिव्यक्ति की आवृत्ति को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִדַּם
  choice: लहू से
  rationale: מִן यहाँ साधन का बोध देता है; बलिदानी प्रसंग में 'लहू से' सहज हिन्दी है।
- source_word: חַטַּאת
  choice: पापबलि
  rationale: इस विधिक संदर्भ में शब्द अमूर्त पाप नहीं, बलि को सूचित करता है; 'पापबलि' प्रचलित और स्पष्ट पारिभाषिक पद है।
- source_word: הַכִּפֻּרִים
  choice: प्रायश्चित के
  rationale: शाब्दिक बहुवचन हिन्दी में असहज होगा; यहाँ यह प्रायश्चित-विधि से संबंधित पापबलि का विशेषणात्मक संबंध व्यक्त करता है।
- source_word: לְדֹרֹתֵיכֶם
  choice: तुम्हारी पीढ़ी-पीढ़ी में
  rationale: यह आने वाली क्रमिक पीढ़ियों तक विधि की निरंतरता को प्राकृतिक हिन्दी में बनाए रखता है।
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: परमपवित्र
  rationale: इब्रानी श्रेष्ठतासूचक रचना का स्पष्ट हिन्दी समतुल्य है और इसे परमपवित्र स्थान समझे जाने से बचाता है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: पूर्वसर्ग समर्पण अथवा संबंध दर्शाता है; 'के लिए' हिन्दी में स्वाभाविक है और יהוה के व्यक्तिगत नाम को पारदर्शी रूप से प्रस्तुत करता है।
theological_decisions:
- issue: יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत वाचा-नाम है; 'यहोवा' उसे सामान्य उपाधि में बदले बिना हिन्दी पाठकों के लिए परिचित रूप में सुरक्षित रखता है।
- issue: वेदी के संबंध में प्रायश्चित की दिशा
  choice: उसके लिए प्रायश्चित करे
  alternative: उस पर प्रायश्चित करे
  rationale: पहले खंड में सींगों पर क्रिया का स्थान स्पष्ट है, जबकि दूसरे עָלָיו में वेदी प्रायश्चित-विधि का लक्ष्य है; 'उसके लिए' इस अंतर को स्वाभाविक हिन्दी में रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण विधिक-याजकीय शैली रखी गई है। 'प्रायश्चित', 'पापबलि', 'लहू' और 'परमपवित्र' जैसे परिचित बाइबलीय पद सामान्य पाठक के लिए समझने योग्य हैं। मूल में कोई ऐसी पाठगत अनिश्चितता नहीं मिली जिसके लिए अनिवार्य पाद-टिप्पणी चाहिए।
