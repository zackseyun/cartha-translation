lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: तब … ने … कहा
  rationale: वाव-क्रम के साथ דִּבֵּר कथा में अगला चरण आरम्भ करता है। आधुनिक हिन्दी में ‘तब … ने … कहा’ इस दिव्य वाणी-सूत्र को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम יהוה को उपाधि से बदलने के बजाय हिन्दी में उसके प्रचलित विद्वत्तापूर्ण उच्चारण के निकट लिप्यंतरित किया गया है।
- source_word: אֶל־מֹשֶׁה
  choice: मूसा से
  rationale: बोलने की हिन्दी संरचना में אֶל द्वारा सूचित संबोधित व्यक्ति को ‘मूसा से’ कहना स्वाभाविक है।
- source_word: לֵאמֹר
  choice: 'कहा:'
  rationale: यह क्रिया-रूप आगे आने वाली वाणी का परिचय देता है। हिन्दी में ‘कहा:’ इस कार्य को सहज ढंग से निभाता है; अलग से ‘यह कहते हुए’ जोड़ना अनावश्यक और अस्वाभाविक होता।
- source_word: וַ
  choice: तब
  rationale: आरम्भिक वाव कथा को आगे बढ़ाता है; ‘तब’ उसके क्रमिक कथानक-कार्य को आधुनिक हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘याहवे’ नाम को सुरक्षित रखता है, जबकि ‘प्रभु’ उसे एक उपाधि से बदल देता और ‘यहोवा’ एक वैकल्पिक पारंपरिक लिप्यंतरण है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। ‘कहा:’ अगले पद में आने वाली प्रत्यक्ष वाणी की ओर संकेत करता है और इब्रानी सूत्र को स्वाभाविक हिन्दी में प्रस्तुत करता है।
