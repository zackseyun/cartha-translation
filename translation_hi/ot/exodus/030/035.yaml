  yaml_path: translation/ot/exodus/030/035.yaml
  text: And you shall make it into incense[a], a perfume blended by the work of a perfumer, salted, pure[c][b], holy.
translation:
  language: hi
  text: और तुम उससे धूप बनाओ—सुगंध-द्रव्य बनाने वाले की कारीगरी से तैयार किया हुआ सुगंधित मिश्रण; नमक मिला हुआ, शुद्ध और पवित्र।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ אֹתָהּ קְטֹרֶת
  choice: और तुम उससे धूप बनाना
  rationale: निर्देशात्मक प्रसंग में क्रिया आज्ञार्थक भाव रखती है। स्त्रीलिंग कर्म-सर्वनाम पिछली आयत की सामग्री की ओर संकेत करता है; हिंदी में ‘उससे’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: רֹקַח מַעֲשֵׂה רוֹקֵחַ
  choice: सुगंध-द्रव्य बनाने वाले की कारीगरी से तैयार किया हुआ सुगंधित मिश्रण
  rationale: मूल में सुगंधित पदार्थों को कुशलता से मिलाकर तैयार करने और उस काम के कारीगर—दोनों पर बल है। यह रूप पुनरुक्ति को बोझिल किए बिना दोनों अर्थों को रखता है।
- source_word: מְמֻלָּח
  choice: नमक मिला हुआ
  rationale: नमक-संबंधी मूल से बना निष्क्रिय कृदंत है। ‘नमक मिला हुआ’ आधुनिक हिंदी में स्पष्ट है और वास्तविक नमक मिलाने के सामान्य अर्थ को सुरक्षित रखता है।
- source_word: טָהוֹר
  choice: शुद्ध
  rationale: सामग्री और उपासना-संबंधी प्रसंग में ‘शुद्ध’ भौतिक तथा अनुष्ठानिक शुद्धता—दोनों की गुंजाइश रखता है।
- source_word: קֹדֶשׁ
  choice: पवित्र
  rationale: यहाँ साधारण रूप से ‘पवित्र’ कहा गया है; ‘परमपवित्र’ कहना मूल से अधिक प्रबल होगा।
theological_decisions:
- issue: धूप की उपासना-संबंधी स्थिति
  choice: पवित्र
  alternative: परमपवित्र; पवित्र उपयोग के लिए अलग किया हुआ
  rationale: इस आयत में קֹדֶשׁ है, कोई स्पष्ट अतिशयोक्तिपूर्ण ‘परमपवित्र’ रचना नहीं। इसलिए अनुवाद मूल कथन की सीमा बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और निर्देशात्मक रखी गई है। ‘सुगंध-द्रव्य बनाने वाला’ सामान्य पाठक के लिए समझने योग्य है, जबकि ‘कारीगरी’ मूल के कुशल शिल्प का भाव बनाए रखता है।
