  text: וְ/נָתַתָּ֤ה אֹת/וֹ֙ לִ/פְנֵ֣י הַ/פָּרֹ֔כֶת אֲשֶׁ֖ר עַל אֲרֹ֣ן הָ/עֵדֻ֑ת לִ/פְנֵ֣י הַ/כַּפֹּ֗רֶת אֲשֶׁר֙ עַל הָ֣/עֵדֻ֔ת אֲשֶׁ֛ר אִוָּעֵ֥ד לְ/ךָ֖ שָֽׁמָּ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/006.yaml
  text: And you shall place it before the veil that is before the ark of the testimony[a], before the mercy seat that is over the testimony[b], where I will meet with you.
translation:
  language: hi
  text: तू उसे उस परदे के सामने रखना जो साक्षी के सन्दूक के सामने है, उस प्रायश्चित के आवरण[a] के सामने जो साक्षी के ऊपर है—वहीं मैं तुझसे मिलूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “करुणासन।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה אֹתוֹ
  choice: तू उसे ... रखना
  rationale: נתן का मूल अर्थ व्यापक है, पर इस उपासना-संबंधी स्थान-निर्देश में ‘रखना’ स्वाभाविक और स्पष्ट है। एकवचन ‘तू’ इब्रानी संबोधन को बनाए रखता है।
- source_word: לִפְנֵי
  choice: के सामने / के आगे
  rationale: यहाँ पद स्थान-संबंध बताता है। निकट पुनरावृत्ति में सहज हिन्दी के लिए ‘सामने’ और ‘आगे’ प्रयुक्त हैं, अर्थ दोनों जगह समान स्थानिक है।
- source_word: הַפָּרֹכֶת
  choice: परदा
  rationale: यह पवित्रस्थान के भीतरी विभाजक परदे का संकेत है। ‘परदा’ आधुनिक हिन्दी में स्पष्ट है और ‘पर्दा’ की अपेक्षा मानक संस्कृतनिष्ठ वर्तनी से मेल खाता है।
- source_word: אֲרֹן הָעֵדֻת
  choice: साक्षी-पेटी
  rationale: אָרוֹן यहाँ पवित्र संदूक/पेटी है और עֵדוּת स्पष्टतः ‘साक्षी’ है, न कि सीधे ‘वाचा’। संयुक्त पद वस्तु और उसके धार्मिक नाम दोनों को संक्षेप में व्यक्त करता है।
- source_word: הַכַּפֹּרֶת
  choice: प्रायश्चित-ढकना
  rationale: यह साक्षी-पेटी के ऊपर का सोने का आवरण है, जिसका प्रायश्चित-संबंधी धार्मिक कार्य भी पद में निहित है। ‘ढकना’ वस्तु को और ‘प्रायश्चित’ उसके सांस्कृतिक अर्थ को व्यक्त करता है; विकल्प पादटिप्पणी में दिया गया है।
- source_word: הָעֵדֻת
  choice: साक्षी
  rationale: इब्रानी शब्द को उसी पद में पहली अभिव्यक्ति के अनुरूप रखा गया है; ‘वाचा’ कहने से मूल में प्रयुक्त अलग संज्ञा का भेद मिट जाता।
- source_word: אֲשֶׁר אִוָּעֵד לְךָ שָׁמָּה
  choice: वहीं मैं तुझसे मिला करूँगा
  rationale: יעד के निफ़अल रूप में नियत भेंट का भाव है। ‘मिला करूँगा’ भावी आवर्ती भेंट को स्वाभाविक हिन्दी में व्यक्त करता है और שָׁמָּה को ‘वहीं’ से स्पष्ट रखता है।
theological_decisions:
- issue: הַכַּפֹּרֶת का अनुवाद
  choice: प्रायश्चित-ढकना
  alternative: करुणासन
  rationale: मुख्य पाठ में वस्तु के आवरण होने और उसके प्रायश्चित-संबंधी आशय दोनों को व्यक्त किया गया है। पारंपरिक ‘करुणासन’ परिचित हो सकता है, पर आधुनिक पाठक को वस्तु का स्वरूप कम स्पष्ट करता है; इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
- issue: עֵדוּת का अनुवाद
  choice: साक्षी
  alternative: वाचा
  rationale: मूल पाठ दोनों बार עֵדוּת कहता है। ‘वाचा’ परिचित धार्मिक अभिव्यक्ति है, किंतु यहाँ वह मूल शब्द के स्थान पर एक संबंधित पर अलग धारणा ला सकती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिन्दी। परमेश्वर का मूसा से एकवचन संबोधन ‘तू/तुझसे’ द्वारा रखा गया है। ‘साक्षी-पेटी’ मूल के ‘साक्षी’ शब्द को सुरक्षित रखते हुए संदूक के आशय को स्पष्ट करता है।
