source:
  edition: WLC
  text: וְ/אַתָּ֣ה קַח לְ/ךָ֮ בְּשָׂמִ֣ים רֹאשׁ֒ מָר דְּרוֹר֙ חֲמֵ֣שׁ מֵא֔וֹת וְ/קִנְּמָן בֶּ֥שֶׂם מַחֲצִית֖/וֹ חֲמִשִּׁ֣ים וּ/מָאתָ֑יִם וּ/קְנֵה בֹ֖שֶׂם חֲמִשִּׁ֥ים וּ/מָאתָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/023.yaml
  text: 'And you[a], take for yourself the finest spices: five hundred shekels of flowing myrrh, and half as much—two hundred fifty—of fragrant cinnamon, and two hundred fifty of fragrant cane[b],'
translation:
  language: hi
  text: '“और तुम अपने लिए उत्तम सुगंध-द्रव्य लो: बहने वाला गंधरस[a] पाँच सौ शेकेल, सुगंधित दालचीनी उसकी आधी मात्रा—दो सौ पचास शेकेल—और सुगंधित सरकंडा[b] दो सौ पचास शेकेल,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शुद्ध गंधरस।” इब्रानी अभिव्यक्ति संभवतः उस गंधरस को बताती है जो अपनी प्राकृतिक अवस्था में स्वतः बहता है।
    reason: lexical_alternative
  - marker: b
    text: परंपरागत अनुवादों में “मीठी दालचीनी” और “मीठा कैलमस” भी मिलता है। इब्रानी शब्द अधिक व्यापक रूप से सुगंधित दालचीनी और सुगंधित सरकंडे को दर्शाते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשָׂמִים רֹאשׁ
  choice: उत्तम सुगंध-द्रव्य
  rationale: רֹאשׁ यहाँ शाब्दिक ‘सिर’ नहीं, बल्कि श्रेष्ठ या सर्वोत्तम होने का भाव देता है; ‘उत्तम सुगंध-द्रव्य’ इस मुहावरे को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מָר דְּרוֹר
  choice: बहनेवाला गन्धरस
  rationale: מָר का अर्थ गन्धरस है और דְּרוֹר संभवतः अपनी प्राकृतिक अवस्था में स्वतः बहनेवाले गन्धरस को दर्शाता है। ‘शुद्ध गन्धरस’ संभव है, पर अधिक व्याख्यात्मक है।
- source_word: חֲמֵשׁ מֵאוֹת
  choice: पाँच सौ शेकेल
  rationale: मूल में यहाँ केवल संख्या है, पर नुस्खे के निकट संदर्भ और पद 24 से भार की इकाई ‘शेकेल’ समझी जाती है; मात्रा स्पष्ट करने के लिए इसे जोड़ा गया है।
- source_word: קִנְּמָן בֶּשֶׂם
  choice: सुगंधित दालचीनी
  rationale: קִנְּמָן दालचीनी है और בֶּשֶׂם उसकी सुगंधित प्रकृति बताता है। यह ‘मीठी दालचीनी’ की अपेक्षा गंध पर मूल बल को अधिक स्पष्ट रखता है।
- source_word: מַחֲצִיתוֹ
  choice: उसकी आधी मात्रा
  rationale: प्रत्यय पहले बताई गई पाँच सौ की मात्रा की ओर संकेत करता है; हिन्दी में यह अभिव्यक्ति संबंध और माप दोनों को स्पष्ट करती है।
- source_word: חֲמִשִּׁים וּמָאתָיִם
  choice: दो सौ पचास
  rationale: यह आधी मात्रा का स्पष्ट संख्यात्मक मान है; मूल की तरह इसे व्याख्यात्मक समानाधिकरण में रखा गया है।
- source_word: קְנֵה בֹשֶׂם
  choice: सुगंधित सरकंडा
  rationale: קָנֶה का सामान्य अर्थ नरकट या सरकंडा है और בֹשֶׂם उसे सुगंधित बताता है। ‘अगरु घास’ या ‘कैलमस’ जैसी अधिक विशिष्ट वनस्पति-पहचान को मूल पाठ निश्चित नहीं करता।
- source_word: וְאַתָּה קַח לְךָ
  choice: और तुम अपने लिए ... लो
  rationale: अलग से प्रयुक्त אַתָּה संबोधित व्यक्ति पर हल्का बल देता है। आधुनिक मानक हिन्दी में ‘तुम’ एकवचन संबोधन को सहज और गरिमापूर्ण ढंग से व्यक्त करता है।
