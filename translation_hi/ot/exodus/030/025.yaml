  text: तुम उससे अभिषेक का पवित्र तेल बनाना, जो सुगंधकार की कला से तैयार किया हुआ सुगंधित मिश्रण हो[a]; वह अभिषेक का पवित्र तेल होगा।
  philosophy: optimal-equivalence
  footnotes:
