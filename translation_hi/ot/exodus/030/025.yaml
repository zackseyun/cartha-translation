    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ אֹתוֹ
  choice: तुम उससे ... बनाना
  rationale: निर्देशात्मक प्रसंग में यह क्रिया आज्ञा का भाव रखती है। ‘उससे’ पिछले पद में बताए गए तेल और सुगंध-द्रव्यों के मिश्रण की ओर संकेत करता है।
- source_word: שֶׁמֶן מִשְׁחַת קֹדֶשׁ
  choice: अभिषेक का पवित्र तेल
  rationale: यह पदबंध अभिषेक के लिए अलग किए गए पवित्र तेल को व्यक्त करता है। यही अनुवाद पद के अंत में भी दोहराया गया है।
- source_word: רֹקַח מִרְקַחַת
  choice: सुगंधित मिश्रण
  rationale: इन सजातीय शब्दों में सुगंध-द्रव्यों को मिलाकर तैयार की गई वस्तु का भाव है। सहज हिन्दी में ‘सुगंधित मिश्रण’ सुगंध और मिश्रण, दोनों पहलुओं को रखता है।
- source_word: מַעֲשֵׂה רֹקֵחַ
  choice: सुगंधकार की कला से तैयार किया हुआ
  rationale: शाब्दिक भाव ‘सुगंध-द्रव्य मिलाने वाले का काम’ है; चुना हुआ रूप प्रशिक्षित कारीगर और उसकी कुशल विधि, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יִהְיֶה
  choice: होगा
  rationale: यह तैयार तेल की परिणामी अवस्था बताता है और विधिक निर्देश के भाव को बनाए रखता है।
