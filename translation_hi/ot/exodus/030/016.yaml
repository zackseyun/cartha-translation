base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/016.yaml
  text: You shall take the atonement money from the sons of Israel and give it for the service of the tent of meeting[a], and it shall be for the sons of Israel as a memorial before Yahweh[b], to make atonement for your lives.
translation:
  language: hi
  text: तुम इस्राएल के पुत्रों[a] से प्रायश्चित का धन लेकर उसे मिलाप के तंबू की सेवा के लिए देना। वह इस्राएल के पुत्रों के लिए याहवे के सामने एक स्मरण-चिह्न होगा, तुम्हारे जीवन के लिए प्रायश्चित करने के लिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् “इस्राएलियों”; इब्रानी में शाब्दिक रूप से “इस्राएल के पुत्रों” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כֶּסֶף הַכִּפֻּרִים
  choice: प्रायश्चित का धन
  rationale: כֶּסֶף का अर्थ ‘चाँदी/धन’ है और यहाँ पिछली आयतों में निर्धारित गणना-राशि अभिप्रेत है; הַכִּפֻּרִים उसके प्रायश्चित-संबंधी प्रयोजन को बताता है।
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों से
  rationale: यह इब्रानी पद के पुरुषवाची वाचा-समुदाय संबंधी रूप को प्रत्यक्ष रूप से बनाए रखता है; सहज विकल्प ‘इस्राएलियों से’ पादटिप्पणी में दिया गया है।
- source_word: עַל עֲבֹדַת אֹהֶל מוֹעֵד
  choice: मिलाप के तंबू की सेवा के लिए
  rationale: עַל यहाँ धन के आवंटन या प्रयोजन को व्यक्त करता है; पवित्रस्थान के संदर्भ में עֲבֹדָה के लिए ‘सेवा’ उपयुक्त है और אֹהֶל מוֹעֵד का प्रचलित, सुबोध अनुवाद ‘मिलाप का तंबू’ है।
- source_word: וְהָיָה ... לְזִכָּרוֹן
  choice: वह ... एक स्मरण-चिह्न होगा
  rationale: זִכָּרוֹן परमेश्वर के सामने बने रहने वाले स्मरण या स्मारक को दर्शाता है; ‘स्मरण-चिह्न’ आधुनिक हिंदी में स्पष्ट है।
- source_word: לִפְנֵי יְהוָה
  choice: याहवे के सामने
  rationale: לִפְנֵי का अर्थ यहाँ ईश्वरीय उपस्थिति में है और יהוה को उसके वाचा-नाम ‘याहवे’ से प्रस्तुत किया गया है।
- source_word: לְכַפֵּר
  choice: प्रायश्चित किया जाए
  rationale: पिएल रूप याजकीय संदर्भ में प्रायश्चित संपन्न करने का भाव रखता है; हिंदी का कर्मवाच्य अंतिम प्रयोजन को स्वाभाविक ढंग से व्यक्त करता है और कर्ता को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: עַל נַפְשֹׁתֵיכֶם
  choice: तुम्हारे प्राणों के लिए
  rationale: נֶפֶשׁ यहाँ व्यक्तियों के प्राण या जीवन को सूचित करता है, किसी बाद की शरीर-आत्मा द्वैतवादी धारणा को नहीं; ‘प्राणों’ से मूल का बहुवचन भी सुरक्षित रहता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में वाचा का विशिष्ट नाम יהוה है; ‘याहवे’ उसे सामान्य उपाधि में बदले बिना प्रस्तुत करता है।
- issue: वाचागत पद בְּנֵי יִשְׂרָאֵל का लिंगयुक्त रूप
  choice: इस्राएल के पुत्र
  alternative: इस्राएली / इस्राएल की संतान
  rationale: मूल का शाब्दिक पुरुषवाची बहुवचन सामूहिक वाचा-समुदाय का नाम है। मुख्य पाठ में उसका रूप रखा गया है, जबकि अधिक मुहावरेदार अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- issue: נְפָשׁוֹת का मानव-संबंधी अर्थ
  choice: प्राण
  alternative: जीवन / स्वयं तुम
  rationale: गणना और प्रायश्चित-राशि के संदर्भ में यह व्यक्तियों के जीवन को दर्शाता है; इसे अमूर्त, शरीर से अलग ‘आत्माओं’ के रूप में निश्चित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘इस्राएल के पुत्रों’ और ‘प्राणों’ जैसे स्रोत-सन्निकट पदों के साथ पादटिप्पणियाँ दी गई हैं, ताकि मूल की संरचना और आशय दोनों स्पष्ट रहें।
