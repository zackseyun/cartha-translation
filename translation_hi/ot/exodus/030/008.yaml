  text: וּ/בְ/הַעֲלֹ֨ת אַהֲרֹ֧ן אֶת הַ/נֵּרֹ֛ת בֵּ֥ין הָ/עֲרְבַּ֖יִם יַקְטִירֶ֑/נָּה קְטֹ֧רֶת תָּמִ֛יד לִ/פְנֵ֥י יְהוָ֖ה לְ/דֹרֹתֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/008.yaml
  text: And when Aaron sets up the lamps at twilight[a], he shall burn it, a regular incense[b], before Yahweh throughout your generations.
translation:
  language: hi
  text: और जब हारून साँझ के समय[a] दीपकों को जलाए, तब वह यहोवा के सामने तुम्हारी पीढ़ियों तक नियमित धूप[b] जलाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “दोनों साँझों के बीच”; यह साँझ या गोधूलि की अवधि के लिए एक इब्रानी मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: या “निरंतर धूप।” इब्रानी शब्द निर्धारित धूप-चढ़ावे की सतत नियमितता या स्थायित्व पर बल दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהַעֲלֹת
  choice: और जब ... जलाए
  rationale: בְּ के साथ हिफ़ील infinitive construct समयसूचक उपवाक्य बनाता है। दीपकों के प्रसंग में עלה का अर्थ लौ को ऊपर उठाना, अर्थात दीपक जलाना है; आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: הַנֵּרֹת
  choice: दीपकों को
  rationale: निवास-स्थान की सामग्री के संदर्भ में נֵרוֹת तेल के दीपकों को सूचित करता है।
- source_word: בֵּין הָעַרְבַּיִם
  choice: साँझ के समय
  rationale: शाब्दिक अभिव्यक्ति ‘दोनों साँझों के बीच’ साँझ अथवा गोधूलि की अवधि का मुहावरा है। सहज हिन्दी पाठ मुख्य वाक्य में रखा गया है और शाब्दिक रूप पादटिप्पणी में।
- source_word: יַקְטִירֶנָּה
  choice: वह उसे जलाए
  rationale: क़तर का हिफ़ील धूप को धुएँ के रूप में चढ़ाने के लिए जलाने को दर्शाता है। स्त्रीलिंग प्रत्यय का संदर्भ קְטֹרֶת ‘धूप’ है।
- source_word: קְטֹרֶת תָּמִיד
  choice: नियमित धूप
  rationale: תמיד यहाँ हर क्षण निरंतर जलते रहने की अपेक्षा विधिवत बार-बार चढ़ाए जाने की नियमितता दर्शा सकता है। ‘नियमित’ यह भाव स्पष्ट करता है; ‘निरंतर’ विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: לִפְנֵי יְהוָה
  choice: यहोवा के सामने
  rationale: לִפְנֵי उपासना-स्थान में परमेश्वर की उपस्थिति के सामने होने का भाव देता है; יְהוָה को उसके व्यक्तिगत वाचा-नाम ‘यहोवा’ से व्यक्त किया गया है।
- source_word: לְדֹרֹתֵיכֶם
  choice: तुम्हारी पीढ़ी-दर-पीढ़ी
  rationale: यह पदबंध इस निर्धारित उपासना के इस्राएल की क्रमिक पीढ़ियों में बने रहने को दर्शाता है। हिन्दी मुहावरे में ‘पीढ़ी-दर-पीढ़ी’ स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में उपाधि नहीं, चार अक्षरों वाला व्यक्तिगत वाचा-नाम है। हिन्दी में व्यापक रूप से पहचाना जाने वाला ‘यहोवा’ नाम को नाम के रूप में बनाए रखता है; ‘याहवे’ अधिक प्रत्यक्ष विद्वत्तापरक लिप्यंतरण है।
- issue: תָּמִיד में नियमितता अथवा अविच्छिन्न निरंतरता
  choice: नियमित
  alternative: निरंतर
  rationale: पद 7–8 में धूप प्रातः और साँझ नियत अवसरों पर चढ़ाई जाती है, इसलिए ‘नियमित’ पुनरावृत्त विधि का भाव देता है। फिर भी इब्रानी शब्द स्थायित्व या निरंतरता पर बल दे सकता है, इसलिए विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठकों के लिए सुबोध धार्मिक गद्य। ‘जलाए’ दीपकों और धूप दोनों के साथ स्वाभाविक पुनरुक्ति रखता है। मुख्य वाक्य में ‘यह ... होगा’ जोड़कर קְטֹרֶת תָּמִיד को विधि की स्थायी प्रकृति से जोड़ा गया है और हिन्दी में अस्पष्ट सर्वनाम-संबंध से बचा गया है।
