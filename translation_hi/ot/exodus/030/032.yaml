source:
  edition: WLC
  text: עַל בְּשַׂ֤ר אָדָם֙ לֹ֣א יִיסָ֔ךְ וּ/בְ/מַ֨תְכֻּנְתּ֔/וֹ לֹ֥א תַעֲשׂ֖וּ כָּמֹ֑/הוּ קֹ֣דֶשׁ ה֔וּא קֹ֖דֶשׁ יִהְיֶ֥ה לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/032.yaml
  text: It shall not be poured on human flesh[a], and in its composition you shall not make any like it. It is holy; it shall be holy to you.
translation:
  language: hi
  text: इसे किसी मनुष्य की देह पर न उंडेलो[a], और इसकी मिश्रण-विधि के अनुसार इसके जैसा कुछ न बनाओ। यह पवित्र है; यह तुम्हारे लिए पवित्र होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मनुष्य के मांस पर।” यहाँ “मनुष्य” का अर्थ सामान्य रूप से सभी मनुष्यों से है।
    reason: मूल के शाब्दिक “मांस” को सुरक्षित रखते हुए אָדָם के सामान्य मानव-सूचक अर्थ को स्पष्ट करना।
lexical_decisions:
- source_word: יִיסָךְ
  choice: उंडेला जाए
  rationale: निष्क्रिय क्रिया तेल को देह पर डालने या लगाने की ठोस क्रिया बताती है। ‘अभिषेक किया जाए’ प्रसंगानुकूल है, पर वह क्रिया के अनुष्ठानिक परिणाम को मूल से अधिक स्पष्ट कर देता।
- source_word: עַל בְּשַׂר אָדָם
  choice: मनुष्य की देह पर
  rationale: בָּשָׂר का मूल अर्थ ‘मांस’ है, पर इस संदर्भ में ‘देह’ सहज और गरिमापूर्ण हिन्दी है; אָדָם यहाँ समस्त मनुष्यों के लिए सामान्य अर्थ में प्रयुक्त है।
- source_word: וּבְמַתְכֻּנְתּוֹ
  choice: इसके संघटन के अनुसार
  rationale: מַתְכֹּנֶת नापे हुए मिश्रण, अनुपात या संरचना को दर्शाता है। ‘संघटन’ पवित्र तेल की निर्धारित मिश्रण-विधि को आधुनिक हिन्दी में सटीक रूप से व्यक्त करता है।
- source_word: לֹא תַעֲשׂוּ כָּמֹהוּ
  choice: इसके जैसा कुछ न बनाना
  rationale: यह वाक्य उसी प्रकार का दूसरा पदार्थ बनाने का निषेध करता है। ‘कुछ’ हिन्दी में तुलना के आशय को स्वाभाविक बनाता है, बिना किसी अतिरिक्त वस्तु को निश्चित किए।
- source_word: קֹדֶשׁ הוּא
  choice: यह पवित्र है
  rationale: ‘पवित्र’ קֹדֶשׁ के प्रमुख बाइबलीय और धर्मवैचारिक अर्थ को बनाए रखता है।
- source_word: קֹדֶשׁ יִהְיֶה לָכֶם
  choice: यह तुम्हारे लिए पवित्र रहे
  rationale: यह अनुवाद इस्राएल के लिए तेल की सतत अलग और पवित्र स्थिति को व्यक्त करता है; ‘रहे’ हिन्दी में आज्ञात्मक/विधिक भाव को सहज रूप देता है।
theological_decisions:
- issue: אָדָם का सामान्य मानव-सूचक प्रयोग
  choice: मनुष्य
  alternative: मानव / किसी व्यक्ति
  rationale: यहाँ אָדָם किसी विशेष पुरुष को नहीं, मनुष्य जाति के सदस्य को सामान्य रूप से दर्शाता है। ‘मनुष्य’ हिन्दी में मूल शब्द की प्रतिनिधिक मानव-सूचकता और गरिमापूर्ण शैली दोनों बनाए रखता है।
- issue: तेल लगाने की क्रिया का अनुष्ठानिक अर्थ
  choice: उंडेला जाए
  alternative: अभिषेक किया जाए / लगाया जाए
  rationale: ‘उंडेला जाए’ निष्क्रिय हिब्रू क्रिया की ठोस क्रिया को प्राथमिकता देता है और ‘अभिषेक’ कहकर अनुष्ठानिक परिणाम को पाठ में स्पष्ट रूप से नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। विधिक निषेध के लिए ‘न उंडेला जाए’ और ‘न बनाना’ का प्रयोग किया गया है; पुनरुक्त ‘पवित्र’ को मूल के बलाघात के अनुसार बनाए रखा गया है।
