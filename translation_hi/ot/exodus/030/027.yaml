lexical_decisions:
- source_word: הַשֻּׁלְחָן
  choice: मेज़
  rationale: यहाँ इब्रानी संज्ञा का सीधा अर्थ ‘मेज़’ है; इस पद में उसकी विस्तृत पवित्र उपाधि दोहराई नहीं गई है।
- source_word: כָּל כֵּלָיו
  choice: उसके सब पात्रों
  rationale: כְּלִי साधनों, बर्तनों या पात्रों के लिए व्यापक शब्द है। पवित्र-स्थान के संदर्भ में ‘पात्र’ स्वाभाविक, गरिमापूर्ण और पर्याप्त व्यापक है।
- source_word: הַמְּנֹרָה
  choice: दीपदान
  rationale: यह अनुवाद वस्तु के दीप धारण करने वाले कार्य को स्पष्ट करता है और अनावश्यक लिप्यंतरण से बचता है।
- source_word: כֵּלֶיהָ
  choice: उसके पात्रों
  rationale: स्त्रीलिंग प्रत्यय दीपदान की ओर संकेत करता है; वही व्यापक शब्दावली बनाए रखने के लिए ‘पात्र’ चुना गया है।
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: धूप की वेदी
  rationale: यह संबंध-वाचक इब्रानी पदबंध को स्पष्ट और प्रचलित हिंदी में व्यक्त करता है।
