source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ יְהוָ֨ה אֶל מֹשֶׁ֜ה קַח לְ/ךָ֣ סַמִּ֗ים נָטָ֤ף וּ/שְׁחֵ֨לֶת֙ וְ/חֶלְבְּנָ֔ה סַמִּ֖ים וּ/לְבֹנָ֣ה זַכָּ֑ה בַּ֥ד בְּ/בַ֖ד יִהְיֶֽה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/034.yaml
  text: 'Then Yahweh said to Moses[a], “Take for yourself spices: stacte and onycha and galbanum, spices, and pure frankincense; they shall be in equal parts.”'
translation:
  language: hi
  text: तब याहवे ने मूसा से कहा, “अपने लिए सुगंधित द्रव्य ले—नताफ़[a], शेहेलेत, गालबान और शुद्ध लोबान। ये सब बराबर मात्रा में हों।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘नताफ़’ और ‘शेहेलेत’ नामक पदार्थों की सटीक पहचान अनिश्चित है; हिब्रू में संभवतः धूप के लिए प्रयुक्त दो विशिष्ट सुगंधित पदार्थ अभिप्रेत हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय उसका निकट देवनागरी लिप्यंतरण रखा गया है।
- source_word: וַיֹּאמֶר
  choice: तब ... ने ... कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिंदी में इस क्रम को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: קַח לְךָ
  choice: अपने लिए ... ले
  rationale: आज्ञार्थक क्रिया के साथ לְךָ में निहित व्यक्तिगत/स्वहित भाव को स्पष्ट रखा गया है।
- source_word: סַמִּים
  choice: सुगंधित द्रव्य
  rationale: यह धूप बनाने में प्रयुक्त सुगंधित पदार्थों के लिए व्यापक शब्द है; हिंदी में ‘सुगंधित द्रव्य’ मसालों तक सीमित अर्थ देने से बचता है।
- source_word: נָטָף
  choice: नताफ़
  rationale: इस विशिष्ट सुगंधित पदार्थ की पहचान अनिश्चित है; लिप्यंतरण किसी संदिग्ध वनस्पति-पहचान को निश्चित नहीं बनाता।
- source_word: שְׁחֵלֶת
  choice: शहेलेत
  rationale: पदार्थ की सटीक पहचान अनिश्चित होने के कारण हिब्रू नाम का निकट लिप्यंतरण चुना गया है।
- source_word: חֶלְבְּנָה
  choice: गालबान
  rationale: यह सामान्यतः गालबान नामक सुगंधित राल के रूप में पहचाना जाता है; प्रचलित पदार्थ-नाम रखा गया है।
- source_word: לְבֹנָה זַכָּה
  choice: शुद्ध लोबान
  rationale: לְבֹנָה के लिए स्वाभाविक हिंदी ‘लोबान’ और זַכָּה के शुद्धता-संबंधी अर्थ के लिए ‘शुद्ध’ रखा गया है।
- source_word: בַּד בְּבַד
  choice: बराबर मात्रा में
  rationale: यह मुहावरा पदार्थों के समान अनुपात को दर्शाता है; आधुनिक हिंदी में यह स्पष्ट और सहज अभिव्यक्ति है।
- source_word: יִהְיֶה
  choice: ये सब ... हों
  rationale: हिब्रू क्रिया एकवचन है, पर सूचीबद्ध पदार्थों को सामूहिक रूप से संबोधित करती है; हिंदी में बहुवचन स्वाभाविक है।
theological_decisions:
- issue: चतुरक्षरीय परमेश्वर-नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ के व्यक्तिगत नाम को उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं किया गया। ‘याहवे’ उपलब्ध भाषाशास्त्रीय साक्ष्य के निकट आधुनिक लिप्यंतरण है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। हिब्रू में ‘सुगंधित द्रव्य’ की पुनरावृत्ति सूची की संरचना का भाग है; हिंदी में डैश और समन्वित सूची द्वारा उसका आशय स्वाभाविक ढंग से व्यक्त किया गया है।
