  yaml_path: translation/ot/exodus/030/021.yaml
  text: They shall wash their hands and their feet[a], so that they may not die. This shall be a permanent statute for them[b], for him and for his offspring throughout their generations.
translation:
  language: hi
  text: वे अपने हाथ और पैर धोएँ, ताकि वे मर न जाएँ। यह उनके लिए एक स्थायी नियम होगा—उसके और उसके वंश के लिए, पीढ़ी-दर-पीढ़ी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְרָחֲצוּ
  choice: वे ... धोएँ
  rationale: कानूनी-निर्देशात्मक प्रसंग में यह रूप आज्ञात्मक भाव रखता है; आधुनिक हिन्दी में संभावनार्थक क्रिया स्वाभाविक और स्पष्ट है।
- source_word: יְדֵיהֶם וְרַגְלֵיהֶם
  choice: अपने हाथ और पैर
  rationale: दोनों शरीर-अंगों का अनुष्ठानिक निर्देश स्पष्ट रखते हुए सम्बन्धसूचक सर्वनाम को हिन्दी के स्वाभाविक आत्मवाचक रूप में व्यक्त किया गया है।
- source_word: וְלֹא יָמֻתוּ
  choice: ताकि वे मर न जाएँ
  rationale: धुलाई से जुड़ा उद्देश्य/परिणाम और मृत्यु की चेतावनी, दोनों हिन्दी में स्पष्ट रहते हैं।
- source_word: חָק עוֹלָם
  choice: स्थायी विधि
  rationale: חָק के कानूनी-अनुष्ठानिक अर्थ के लिए 'विधि' और עוֹלָם की दीर्घस्थायी बाध्यता के लिए 'स्थायी' सहज आधुनिक विकल्प हैं।
- source_word: לּוֹ וּלְזַרְעוֹ
  choice: उसके और उसके वंश के लिए
  rationale: एकवचन सर्वनाम को सुरक्षित रखा गया है और सामूहिक זֶרַע को स्वाभाविक हिन्दी 'वंश' से व्यक्त किया गया है।
- source_word: לְדֹרֹתָם
  choice: पीढ़ी-दर-पीढ़ी
  rationale: यह हिन्दी में पीढ़ियों के क्रम में निरन्तर लागू रहने का स्वाभाविक मुहावरा है।
theological_decisions:
- issue: חָק עוֹלָם द्वारा व्यक्त विधि की अवधि
  choice: स्थायी विधि
  alternative: सदा की विधि / चिरस्थायी विधि
  rationale: यह चुनाव विधि की निरन्तर और दीर्घकालीन बाध्यता को रखता है, पर स्रोत से आगे बढ़कर दार्शनिक अर्थ में अनन्तता निर्धारित नहीं करता।
- issue: एकवचन לּוֹ का संदर्भ
  choice: उसके
  alternative: हारून के
  rationale: मूल का सर्वनाम सुरक्षित रखा गया है; निकटवर्ती प्रसंग में इसका संदर्भ हारून है, पर मुख्य पाठ में नाम जोड़कर निहित संदर्भ को स्पष्ट कथन नहीं बनाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण लेकिन सामान्य पाठक के लिए सहज। हिब्रू के बहुवचन 'उनके लिए' के बाद एकवचन 'उसके' की वास्तविक संरचनात्मक विषमता को अर्थपूर्ण ढंग से सुरक्षित रखा गया है।
