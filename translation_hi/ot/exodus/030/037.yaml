  yaml_path: translation/ot/exodus/030/037.yaml
  text: And the incense that you make according to its composition[a], you shall not make for yourselves[b]; it shall be holy to you for Yahweh.
translation:
  language: hi
  text: और जो धूप तुम बनाओगे, उसकी मिश्रण-विधि[a] के अनुसार तुम लोग अपने लिए धूप न बनाओ[b]। वह तुम्हारे लिए यहोवा के निमित्त पवित्र होगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसके संघटन के अनुसार’ अथवा ‘उन्हीं अनुपातों में’।
    reason: lexical_alternative
  - marker: b
    text: अर्थात् इस पवित्र धूप के मिश्रण को सामान्य निजी उपयोग के लिए उसी प्रकार नहीं बनाना था।
    reason: cultural_note
lexical_decisions:
- source_word: הַקְּטֹרֶת
  choice: धूप
  rationale: यह निकटवर्ती संदर्भ में बताई गई पवित्र सुगंधित धूप को सूचित करता है। हिंदी में ‘धूप’ इसका सहज और प्रचलित समतुल्य है।
- source_word: אֲשֶׁר תַּעֲשֶׂה
  choice: जो धूप तुम बनाओगे
  rationale: संबंधवाचक उपवाक्य और क्रिया के सीधे अर्थ को स्वाभाविक आधुनिक हिंदी में व्यक्त करता है।
- source_word: בְּמַתְכֻּנְתָּהּ
  choice: उसी मिश्रण-विधि के अनुसार
  rationale: מַתְכֹּנֶת यहाँ निर्धारित संघटन, अनुपात या विधि को सूचित करता है। ‘मिश्रण-विधि’ इन अर्थों को अत्यधिक आधुनिक वैज्ञानिक शब्दावली के बिना व्यक्त करती है।
- source_word: לֹא תַעֲשׂוּ לָכֶם
  choice: अपने लिए वैसी धूप न बनाना
  rationale: बहुवचन निषेध और לָכֶם के निजी उपयोग या अधिकार के भाव को स्पष्ट, स्वाभाविक हिंदी में रखता है। ‘वैसी धूप’ पहले बताए गए समान मिश्रण की ओर संकेत करता है।
- source_word: קֹדֶשׁ
  choice: पवित्र
  rationale: यह पवित्रता और विशेष रूप से अलग ठहराए जाने की स्थिति व्यक्त करता है; ‘पवित्र’ मानक और धर्मवैज्ञानिक भार वाला हिंदी रूप है।
- source_word: תִּהְיֶה לְךָ
  choice: वह तुम्हारे लिए ... पवित्र होगी
  rationale: एकवचन संबोधन और धूप के स्त्रीलिंग संदर्भ को सुरक्षित रखते हुए बताता है कि उसे पवित्र माना जाना है।
- source_word: לַיהוָה
  choice: यहोवा के निमित्त
  rationale: लामेद समर्पण या संबंध का भाव देता है। ‘के निमित्त’ पवित्र धूप के यहोवा के लिए अलग किए जाने को स्वाभाविक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चतुरक्षरीय वाचा-नाम सीधे प्रयुक्त है। हिंदी बाइबल परंपरा में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ से नाम को सामान्य उपाधि ‘प्रभु’ में बदले बिना सुरक्षित रखा गया है; ‘याहवे’ संभावित वैकल्पिक लिप्यंतरण है।
- issue: धूप की पवित्रता का संबंध
  choice: तुम्हारे लिए यहोवा के निमित्त पवित्र
  alternative: तुम उसे यहोवा के लिए पवित्र मानना
  rationale: हिब्रू की विधेयात्मक संरचना और לְךָ तथा לַיהוָה दोनों संबंधों को यथासंभव सुरक्षित रखा गया है, बिना यह तय किए कि वाक्य केवल स्वामित्व, दृष्टिकोण या समर्पण में से किस पर बल देता है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप रखा गया है। आज्ञा के लिए ‘न बनाना’ का प्रयोग विधिक संदर्भ में स्वाभाविक है। ‘मिश्रण-विधि’ तकनीकी कठोरता से बचते हुए निर्धारित संघटन और अनुपात का भाव देता है।
