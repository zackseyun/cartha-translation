- source_word: וְהִקְטִיר
  choice: जलाए
  rationale: हिफ़ील रूप यहाँ वेदी पर धूप को जलाकर उसका धुआँ उठाने की उपासना-संबंधी क्रिया बताता है; ‘जलाए’ सहज और सन्दर्भानुकूल है।
- source_word: עָלָיו
  choice: उस पर
  rationale: यह पिछले सन्दर्भ में वर्णित धूप की वेदी की ओर संकेत करता है और स्थानवाचक अर्थ बनाए रखता है।
- source_word: קְטֹרֶת סַמִּים
  choice: सुगन्धित धूप
  rationale: यह सुगन्ध देने वाले मसालों से बनी धूप है; यह अभिव्यक्ति मूल के दोनों पदों का अर्थ स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: हर सुबह
  rationale: ‘सुबह, सुबह’ की पुनरुक्ति नियमित दैनिक क्रिया व्यक्त करती है; ‘हर सुबह’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: בְּהֵיטִיבוֹ
  choice: जब वह ... को ठीक करे
  rationale: हिफ़ील क्रिया यहाँ दीपकों को व्यवस्थित और उपयोग के लिए तैयार करने का व्यापक भाव रखती है; यह केवल बाती काटने तक अर्थ सीमित नहीं करती।
- source_word: הַנֵּרֹת
  choice: दीपकों
  rationale: पवित्रस्थान के पहले से उल्लिखित दीपकों के लिए सरल और सटीक शब्द।
- source_word: יַקְטִירֶנָּה
  choice: वह धूप जलाए
  rationale: स्त्रीलिंग एकवचन प्रत्यय ‘धूप’ की ओर लौटता है; हिन्दी में अस्पष्ट ‘उसे’ के बजाय संज्ञा दोहराना अधिक स्वाभाविक और स्पष्ट है।
