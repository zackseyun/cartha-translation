  text: You shall consecrate them[a], and they shall be most holy. Whatever touches them shall become holy.
translation:
  language: hi
  text: तुम उन वस्तुओं को पवित्र ठहराओ, और वे परमपवित्र होंगी। जो भी उन्हें छुएगा, वह पवित्र हो जाएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְקִדַּשְׁתָּ
  choice: तुम ... पवित्र ठहराना
  rationale: पिएल रूप यहाँ किसी वस्तु को पवित्र उपयोग के लिए अलग करने या समर्पित करने का भाव देता है। विधि-संबंधी निर्देश में ‘पवित्र ठहराना’ स्वाभाविक और गरिमापूर्ण है।
- source_word: אֹתָם
  choice: उन वस्तुओं को
  rationale: पुल्लिंग बहुवचन सर्वनाम निकटवर्ती संदर्भ में तंबू से संबंधित साज-सामान की ओर संकेत करता है; हिंदी में ‘वस्तुओं’ जोड़ने से संदर्भ स्पष्ट रहता है।
- source_word: וְהָיוּ
  choice: और वे ... होंगी
  rationale: यह पवित्र ठहराने के परिणामस्वरूप उनकी स्थिति बताने वाला साधारण भविष्यकालीन विधान है।
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: परमपवित्र
  rationale: इब्रानी संज्ञा-श्रृंखला उच्चतम स्तर की पवित्रता व्यक्त करती है। ‘परमपवित्र’ आधुनिक हिंदी में संक्षिप्त और स्वाभाविक समतुल्य है।
- source_word: כָּל הַנֹּגֵעַ
  choice: जो कुछ ... छुएगा
  rationale: यह सामान्य और व्यापक अभिव्यक्ति है, जो व्यक्ति या वस्तु—दोनों की संभावना को खुला रखती है।
- source_word: בָּהֶם
  choice: उन्हें
  rationale: यह सर्वनाम उन्हीं पवित्र ठहराई गई वस्तुओं की ओर लौटता है।
- source_word: יִקְדָּשׁ
  choice: पवित्र हो जाएगा
  rationale: कल का यह रूप यहाँ अवस्था-परिवर्तन का अर्थ दे सकता है। ‘हो जाएगा’ संपर्क के फलस्वरूप पवित्र होने का भाव स्पष्ट करता है, पर उसके अनुष्ठानिक परिणाम की व्याख्या नहीं जोड़ता।
theological_decisions:
- issue: संपर्क से प्राप्त पवित्रता का अर्थ
  choice: कथन को इतना ही रहने दिया गया है कि छूने वाला पवित्र हो जाएगा।
  alternative: इसे केवल लाभकारी अभिषेक मानना, या पवित्र क्षेत्र में आने से उत्पन्न खतरे और प्रतिबंध के रूप में समझाना।
  rationale: इब्रानी पाठ इस पवित्रता को लाभकारी, खतरनाक या प्रतिबंधकारी नहीं बताता। अनुवाद उस धार्मिक तनाव और अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी; विधिक-उपासना संबंधी संदर्भ के अनुरूप गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज भाषा। ‘परमपवित्र’ से इब्रानी सर्वोच्चता-सूचक संरचना व्यक्त की गई है।
