lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: फिर ... कहा
  rationale: वाव-युक्त कथात्मक क्रिया प्रसंग को आगे बढ़ाती है; आधुनिक हिन्दी में ‘फिर’ स्वाभाविक है। דבר के बाद לֵאמֹר आने पर हिन्दी में दोनों को अलग-अलग ‘बोला ... कहते हुए’ कहना अनावश्यक रूप से भारी होता, इसलिए संयुक्त वाक्य-विन्यास ‘कहा’ चुना गया।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार-अक्षरीय परमेश्वर-नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नामरूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: אֶל־מֹשֶׁה
  choice: मूसा से
  rationale: बोलने के प्राप्तकर्ता को व्यक्त करने के लिए आधुनिक हिन्दी का स्वाभाविक परसर्ग ‘से’ है।
- source_word: לֵאמֹר
  choice: कहा
  rationale: यह अनन्त क्रियारूप आगामी प्रत्यक्ष वचन का परिचय देता है। हिन्दी में पूर्ववर्ती דבר के साथ इसे एक ही स्वाभाविक कथन-सूत्र ‘कहा’ में समाहित किया गया है; अंत का अल्पविराम अगले पद के कथन से संबंध बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। हिन्दी पाठकों के लिए व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ को रखा गया है, न कि नाम के स्थान पर ‘प्रभु’ उपाधि। ‘याहवे’ अधिक संभावित विद्वत्तापूर्ण उच्चारण है, पर ‘यहोवा’ हिन्दी बाइबलीय प्रयोग में अधिक परिचित है।
translation_notes:
  register: सरल, आधुनिक और गरिमापूर्ण हिन्दी। मूल इब्रानी कथन-सूत्र को हिन्दी में अनावश्यक पुनरुक्ति से बचाते हुए स्वाभाविक बनाया गया है।
