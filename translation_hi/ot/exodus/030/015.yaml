source:
  edition: WLC
  text: הֶֽ/עָשִׁ֣יר לֹֽא יַרְבֶּ֗ה וְ/הַ/דַּל֙ לֹ֣א יַמְעִ֔יט מִֽ/מַּחֲצִ֖ית הַ/שָּׁ֑קֶל לָ/תֵת֙ אֶת תְּרוּמַ֣ת יְהוָ֔ה לְ/כַפֵּ֖ר עַל נַפְשֹׁתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/015.yaml
  text: The rich shall not give more[a], and the poor shall not give less, than the half-shekel, when giving the contribution to Yahweh to make atonement for your lives.
translation:
  language: hi
  text: धनी आधे शेकेल से अधिक न दे और निर्धन उससे कम न दे, जब तुम अपने प्राणों[a] के लिए प्रायश्चित करने को यहोवा को अंशदान दो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने जीवनों” अथवा “स्वयं अपने लिए।” इब्रानी शब्द नेफ़ेश का अर्थ प्राण, जीवन, स्वयं या व्यक्ति हो सकता है। जनगणना के इस भुगतान-संदर्भ में इसका संकेत संभवतः गिने गए लोगों के जीवन या स्वयं उन व्यक्तियों की ओर है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעָשִׁיר
  choice: धनी
  rationale: संज्ञा के रूप में प्रयुक्त विशेषण आर्थिक रूप से संपन्न व्यक्ति या वर्ग को दर्शाता है; ‘धनी’ आधुनिक हिन्दी में स्वाभाविक और संक्षिप्त है।
- source_word: יַרְבֶּה / יַמְעִיט
  choice: अधिक न दे / कम न दे
  rationale: निर्धारित राशि के संदर्भ में इन क्रियाओं का आशय योगदान को बढ़ाने या घटाने से है; समानांतर हिन्दी अभिव्यक्ति कानूनी संतुलन बनाए रखती है।
- source_word: הַדַּל
  choice: निर्धन
  rationale: यहाँ आर्थिक साधनों की कमी वाला व्यक्ति अभिप्रेत है; ‘निर्धन’ ‘धनी’ के साथ स्पष्ट और गरिमापूर्ण विरोध प्रस्तुत करता है।
- source_word: מִמַּחֲצִית הַשָּׁקֶל
  choice: आधे शेकेल से
  rationale: नकारात्मक तुलनात्मक रचना में यही वह निश्चित मानक राशि है जिससे न अधिक और न कम देना है। ‘शेकेल’ प्राचीन भार और मुद्रा-इकाई को सुरक्षित रखता है।
- source_word: תְּרוּמַת יְהוָה
  choice: यहोवा को अंशदान
  rationale: תְּרוּמָה पवित्र प्रयोजन के लिए अलग किए गए योगदान को सूचित करता है; जनगणना-भुगतान के संदर्भ में ‘अंशदान’ बलिदान-संबंधी अनावश्यक अर्थ से बचता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ के व्यक्तिगत ईश्वरीय नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, न कि उसे किसी उपाधि से प्रतिस्थापित किया गया है।
- source_word: לְכַפֵּר
  choice: प्रायश्चित करने को
  rationale: यह उपासना-संबंधी क्रिया के धर्मवैचारिक भार को बनाए रखता है, पर प्रायश्चित की किसी संकीर्ण व्याख्या को आरोपित नहीं करता।
- source_word: עַל נַפְשֹׁתֵיכֶם
  choice: अपने प्राणों के लिए
  rationale: जनगणना और छुड़ौती के इस संदर्भ में נֶפֶשׁ गिने गए लोगों के जीवन अथवा स्वयं व्यक्तियों की ओर संकेत करता है; ‘प्राणों’ मूल की व्यापकता को बनाए रखता है और विकल्प को पादटिप्पणी में स्पष्ट किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: व्यक्तिगत नाम को शीर्षक से बदलने के बजाय मूल पाठ की नाम-संबंधी विशिष्टता सुरक्षित रखी गई है।
- issue: נֶפֶשׁ का संदर्भगत अर्थ
  choice: प्राणों
  alternative: जीवनों; स्वयं तुम्हारे लिए
  rationale: यहाँ शब्द मनुष्य के जीवन या पूरे व्यक्ति को दर्शाता है; यह चयन किसी शरीर-आत्मा संबंधी बाद की विशिष्ट धारणा को पाठ में नहीं जोड़ता।
- issue: כפר का अनुवाद
  choice: प्रायश्चित करना
  alternative: दोष ढाँपना; छुड़ौती देना
  rationale: ‘प्रायश्चित’ उपासना-संबंधी अर्थक्षेत्र और धर्मवैचारिक तनाव को बनाए रखता है, जबकि प्रायश्चित की कार्यविधि पर कोई एक सिद्धांत तय नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण कानूनी शैली रखी गई है। ‘अधिक न दे / कम न दे’ से मूल का संतुलित समानांतर विन्यास सुरक्षित है; ‘शेकेल’ को प्राचीन इकाई के रूप में लिप्यंतरित किया गया है।
