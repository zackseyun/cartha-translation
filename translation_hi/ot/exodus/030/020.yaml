source:
  edition: WLC
  text: בְּ/בֹאָ֞/ם אֶל אֹ֧הֶל מוֹעֵ֛ד יִרְחֲצוּ מַ֖יִם וְ/לֹ֣א יָמֻ֑תוּ א֣וֹ בְ/גִשְׁתָּ֤/ם אֶל הַ/מִּזְבֵּ֨חַ֙ לְ/שָׁרֵ֔ת לְ/הַקְטִ֥יר אִשֶּׁ֖ה לַֽ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/020.yaml
  text: When they enter the tent of meeting[a], they shall wash with water, so that they may not die; or when they come near the altar to minister, to burn a food offering to Yahweh[b],
translation:
  language: hi
  text: जब वे मिलाप के तंबू में प्रवेश करें, या वेदी के पास सेवा करने और याहवे के लिए अग्नि-भेंट जलाने को आएँ, तो वे पानी से धोएँ, ताकि वे मर न जाएँ[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और वे न मरें”; अथवा, “कहीं ऐसा न हो कि वे मर जाएँ।”
    reason: संयोजक וְ के शाब्दिक समन्वय और प्रसंगगत उद्देश्य/परिणाम—दोनों को सम्भव रूप में सुरक्षित रखना।
lexical_decisions:
- source_word: בְּבֹאָם
  choice: जब वे ... प्रवेश करें
  rationale: בְּ + infinitive construct और बहुवचन प्रत्यय यहाँ समयसूचक अर्थ देते हैं। ‘प्रवेश करें’ तंबू के भीतर आने की गति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֹהֶל מוֹעֵד
  choice: मिलापवाला तंबू
  rationale: यह उस पवित्र तंबू का प्रचलित और समझने योग्य हिन्दी नाम है जहाँ परमेश्वर इस्राएल से मिलता है।
- source_word: יִרְחֲצוּ מַיִם
  choice: पानी से धोएँ
  rationale: मूल पाठ ‘पानी’ को स्पष्ट रूप से रखता है, जबकि धोए जाने वाले अंग पिछले पद से समझे जाते हैं; इसलिए इस पद में उन्हें दोहराकर नहीं जोड़ा गया।
- source_word: וְלֹא יָמֻתוּ
  choice: ताकि वे मर न जाएँ
  rationale: औपचारिक रूप से यह ‘और वे न मरें’ है, पर प्रसंग में धुलाई के उद्देश्य अथवा परिणाम को बताता है। हिन्दी में ‘ताकि’ चेतावनी की गंभीरता बनाए रखते हुए संबंध स्पष्ट करता है।
- source_word: אוֹ
  choice: या
  rationale: यह दूसरी परिस्थिति को पहली से जोड़ने वाला सीधा विकल्पसूचक संयोजक है।
- source_word: בְגִשְׁתָּם אֶל־הַמִּזְבֵּחַ
  choice: जब वे ... वेदी के पास आएँ
  rationale: נגשׁ का अर्थ पास आना या निकट जाना है और यहाँ उसका याजकीय-सांस्कारिक संदर्भ है।
- source_word: לְשָׁרֵת
  choice: सेवा करने के लिए
  rationale: यह याजकीय सेवा है; ‘सेवा करना’ आधुनिक हिन्दी में स्वाभाविक है और संदर्भ उसके पवित्र स्वरूप को स्पष्ट करता है।
- source_word: לְהַקְטִיר
  choice: जलाने के लिए
  rationale: קטר का हिफ़ील रूप वेदी पर भेंट जलाकर उसका धुआँ ऊपर उठाने को सूचित करता है। संक्षिप्त हिन्दी में ‘जलाना’ स्वाभाविक है।
- source_word: אִשֶּׁה
  choice: अग्नि-भेंट
  rationale: यह आग पर चढ़ाई जाने वाली बलिदानी भेंट का तकनीकी शब्द है। ‘अग्नि-भेंट’ उसके साधन और बलिदानी स्वरूप दोनों को संक्षेप में रखता है; ‘भोजन-भेंट’ संभावित कार्यात्मक समझ है, पर मूल शब्द की व्युत्पत्तिगत अनिश्चितता के कारण उसे मुख्य पाठ में नहीं रखा गया।
- source_word: לַיהוָה
  choice: याहवे के लिए
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम יהוה है; ‘याहवे’ उसे उपाधि में बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: यहाँ चतुरक्षरीय वाचा-नाम सीधे आया है। ‘याहवे’ नाम को नाम ही रहने देता है और ‘प्रभु’ जैसी उपाधि से उसका भेद बनाए रखता है।
- issue: וְלֹא יָמֻתוּ में मृत्यु-संबंधी चेतावनी
  choice: ताकि वे मर न जाएँ
  alternative: और वे न मरें; कहीं ऐसा न हो कि वे मर जाएँ
  rationale: यह वास्तविक मृत्यु-दंड की गंभीरता को बनाए रखता है और प्रसंग में धुलाई के साथ उसके उद्देश्य/परिणाम का संबंध स्वाभाविक हिन्दी में व्यक्त करता है।
- issue: אִשֶּׁה का बलिदानी अर्थ
  choice: अग्नि-भेंट
  alternative: भोजन-भेंट; आग में चढ़ाई जानेवाली भेंट
  rationale: शब्द आग से चढ़ाई गई भेंट को सूचित करता है, जबकि ‘भोजन-भेंट’ उसकी व्यापक धर्मवैधानिक भूमिका की व्याख्या करता है। मुख्य पाठ में कम व्याख्यात्मक विकल्प रखा गया है और विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मिलापवाला तंबू’, ‘वेदी’ और ‘अग्नि-भेंट’ जैसे सांस्कारिक पद स्पष्ट धार्मिक संदर्भ बनाए रखते हैं। अंतिम ‘तब भी ऐसा करें’ हिन्दी में अधूरे निहित आदेश को स्पष्ट करता है और उसका आशय पहले खंड के ‘पानी से धोएँ’ से ग्रहण करता है।
