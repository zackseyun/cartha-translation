  text: And you shall make two gold rings for it under its molding[a]; on its two side panels you shall make them, on its two sides[c][b], and they shall be holders for poles with which to carry it.
translation:
  language: hi
  text: और उसके सजावटी किनारे के नीचे उसके लिए सोने के दो छल्ले बनाना। उन्हें उसके दोनों पार्श्वों पर, उसकी दोनों ओर बनाना; और वे डंडों के लिए स्थान हों, ताकि उन्हीं के द्वारा उसे उठाकर ले जाया जाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: טַבְּעֹת זָהָב
  choice: सोने के दो छल्ले
  rationale: טַבַּעַת यहाँ सोने से बने छल्लों को दर्शाता है; यह हिन्दी में स्वाभाविक और सामग्री की स्पष्ट अभिव्यक्ति है।
- source_word: מִתַּחַת לְזֵרוֹ
  choice: उसके सजावटी किनारे के नीचे
  rationale: זֵר वेदी के चारों ओर बने सजावटी घेरे या किनारे को सूचित करता है। ‘सजावटी किनारा’ वस्तु की बनावट और कार्य-संदर्भ दोनों को स्पष्ट रखता है।
- source_word: צַלְעֹתָיו
  choice: उसकी दोनों पार्श्व-पट्टियों पर
  rationale: צֵלָע का अर्थ पार्श्व, पसली-जैसी संरचना या संरचनात्मक पट्टी हो सकता है। निर्माण-संदर्भ में ‘पार्श्व-पट्टियाँ’ ठोस अर्थ देता है, जबकि अगला वाक्यांश सामान्य ‘दोनों ओर’ को बनाए रखता है।
- source_word: עַל שְׁנֵי צִדָּיו
  choice: उसकी दोनों ओर
  rationale: צַד सामान्यतः ‘ओर/बगल’ है। यह इब्रानी की पुनरुक्ति को हटाए बिना स्वाभाविक हिन्दी देता है।
- source_word: וְהָיָה לְבָתִּים לְבַדִּים
  choice: वे डंडों के लिए कड़ियाँ हों
  rationale: בָּתִּים का शाब्दिक अर्थ ‘घर’ है, पर यहाँ आशय डंडों को थामने वाली जगह या धारक से है। छल्लों के संदर्भ में ‘कड़ियाँ’ उनका धारक-कार्य स्वाभाविक रूप से व्यक्त करता है।
- source_word: בַדִּים
  choice: डंडे
  rationale: बַּד यहाँ वस्तु को ढोने के लिए लगाए जाने वाले लंबे डंडों को दर्शाता है; ‘डंडे’ आधुनिक और सामान्य हिन्दी है।
- source_word: לָשֵׂאת אֹתוֹ בָּהֵמָּה
  choice: ताकि उन्हीं से उसे उठाकर ले जाया जाए
  rationale: 'यह उद्देश्य और साधन दोनों व्यक्त करता है: वेदी को उन डंडों के माध्यम से उठाकर ले जाना।'
- source_word: תַּעֲשֶׂה ... תַּעֲשֶׂה
  choice: बनाना ... बनाना
  rationale: निर्देशात्मक शैली में हिन्दी का ‘बनाना’ आदेश की गरिमा बनाए रखता है और मूल की पुनरावृत्ति भी सुरक्षित रखता है।
