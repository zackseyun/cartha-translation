translation:
  language: hi
  text: और होमबलि की वेदी और उसके सारे उपकरण, और धोने का पात्र और उसका आधार।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִזְבַּח הָעֹלָה
  choice: होमबलि की वेदी
  rationale: מִזְבַּח का अर्थ ‘वेदी’ और הָעֹלָה का अर्थ पूर्णतः जलाया जाने वाला बलिदान है। ‘होमबलि’ प्रचलित हिंदी बाइबलीय पद है और संक्षिप्त रूप में मूल बलिदानी अर्थ बनाए रखता है।
- source_word: כָּל כֵּלָיו
  choice: उसके सारे उपकरण
  rationale: כְּלִי का अर्थ पात्र, औज़ार या उपकरण हो सकता है। वेदी से संबंधित विविध वस्तुओं के लिए ‘उपकरण’ स्वाभाविक और पर्याप्त व्यापक है; एकवचन प्रत्यय को ‘उसके’ से व्यक्त किया गया है।
- source_word: הַכִּיֹּר
  choice: हौद
  rationale: כִּיּוֹר पवित्रस्थान की सेवा में धोने के लिए प्रयुक्त बड़े पात्र को दर्शाता है। ‘हौद’ आधुनिक हिंदी में ‘धोने का पात्र’ की अपेक्षा अधिक संक्षिप्त और ठोस है।
- source_word: כַּנּוֹ
  choice: उसका आधार
  rationale: כֵּן यहाँ हौद को थामने वाले आधार या चौकी को दर्शाता है। ‘आधार’ मूल की संरचनात्मक अस्पष्टता बनाए रखता है और अनावश्यक विशिष्टता नहीं जोड़ता।
- source_word: וְאֶת
  choice: और
  rationale: बार-बार आया וְ समन्वय करता है, जबकि אֶת निश्चित कर्म-चिह्न है जिसका हिंदी में अलग अनुवाद आवश्यक नहीं। सूची की संरचना को ‘और’ से बनाए रखा गया है।
