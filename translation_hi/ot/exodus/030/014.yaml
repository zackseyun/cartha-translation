  text: כֹּ֗ל הָ/עֹבֵר֙ עַל הַ/פְּקֻדִ֔ים מִ/בֶּ֛ן עֶשְׂרִ֥ים שָׁנָ֖ה וָ/מָ֑עְלָ/ה יִתֵּ֖ן תְּרוּמַ֥ת יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/014.yaml
  text: Everyone who passes over to those who are counted[a], from twenty years old and upward, shall give Yahweh’s contribution.
translation:
  language: hi
  text: बीस वर्ष की आयु से और ऊपर का हर व्यक्ति, जो गिने हुओं में सम्मिलित होने के लिए पार जाए[a], याहवे का अंशदान दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “गिने हुओं के बीच से पार जाए।” इब्रानी मुहावरा शाब्दिक रूप से गिने गए लोगों के संबंध में “पार जाने” की बात करता है; सम्भवतः यह जनगणना की प्रक्रिया की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: जितने लोग … वे सब
  rationale: यह रचना כֹּל के वितरणात्मक अर्थ ‘हर एक/सभी’ को स्वाभाविक हिन्दी में व्यक्त करती है और पूरे कृदन्तीय वाक्यांश को समेटती है।
- source_word: הָעֹבֵר עַל הַפְּקֻדִים
  choice: गिने हुओं में सम्मिलित होने के लिए पार जाएँ
  rationale: עבר की ठोस ‘पार जाने’ की छवि सुरक्षित रखी गई है, जबकि עַל הַפְּקֻדִים का जनगणना-संबंधी आशय ‘गिने हुओं में सम्मिलित होने’ से स्पष्ट होता है। वाक्यांश की वास्तविक मुहावरेदार अस्पष्टता पादटिप्पणी में दी गई है।
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמָעְלָה
  choice: बीस वर्ष या उससे अधिक आयु के
  rationale: यह आयु-सीमा के इब्रानी सूत्र का सहज और सटीक आधुनिक हिन्दी रूप है।
- source_word: יִתֵּן
  choice: दें
  rationale: यहाँ अपूर्ण क्रिया का वैधानिक/आदेशात्मक बल हिन्दी के आदरसूचक बहुवचन विधिलिंग ‘दें’ से स्वाभाविक रूप में व्यक्त होता है।
- source_word: תְּרוּמַת
  choice: अंशदान
  rationale: תְּרוּמָה यहाँ यहोवा के लिए अलग रखे गए जनगणना-संबंधी योगदान को दर्शाता है; ‘अंशदान’ ‘बलि’ जैसी अनावश्यक कर्मकाण्डीय विशिष्टता से बचता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित प्रत्यक्ष नामरूप ‘यहोवा’ चतुरक्षरीय ईश-नाम को ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
theological_decisions:
- issue: ईश-नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत ईश-नाम सीधे आया है। हिन्दी पाठकों के लिए परिचित ‘यहोवा’ उसे उपाधि में बदले बिना सुरक्षित रखता है; ‘याहवे’ अधिक पुनर्निर्मित उच्चारण-आधारित विकल्प है।
- issue: जनगणना के मुहावरे को कितना स्पष्ट किया जाए
  choice: पार जाने की छवि रखते हुए ‘गिने हुओं में सम्मिलित होने’ से प्रक्रिया स्पष्ट करना
  alternative: जो गिने जाएँ
  rationale: सिर्फ ‘जो गिने जाएँ’ कहना עבר की ठोस प्रक्रियात्मक छवि मिटा देता। मुख्य पाठ छवि और आशय दोनों रखता है, तथा पादटिप्पणी वैकल्पिक संबंध स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण कानूनी-निर्देशात्मक स्वर रखा गया है। ‘अर्थात’ आयु-योग्यता को पिछले जनगणना-वाक्यांश से सहजता से जोड़ता है; अनावश्यक पुरातनता और सम्प्रदायगत शब्दावली से बचा गया है।
