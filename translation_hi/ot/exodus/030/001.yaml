    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: तू ... बनाना
  rationale: संयोजक के साथ आया क़ाल पूर्ण रूप इस निर्देश-क्रम में आज्ञार्थक भाव रखता है। हिंदी में ‘तू ... बनाना’ अगले निर्देशों से जुड़ा हुआ, स्वाभाविक और गरिमापूर्ण आदेश व्यक्त करता है।
- source_word: מִזְבֵּחַ
  choice: एक वेदी
  rationale: यह बलि या अर्पण के लिए बने पवित्र ढाँचे का मानक हिंदी पद है; यहाँ पहली बार उल्लेख होने के कारण ‘एक’ उपयुक्त है।
- source_word: מִקְטַר קְטֹרֶת
  choice: धूप जलाने के लिए
  rationale: यह पद धूप जलाने या उसका धुआँ उठाने के कार्य को व्यक्त करता है। कार्यसूचक अनुवाद इब्रानी रचना को ‘धूप की वेदी’ जैसे संक्षिप्त नाम में बदलने से बचाता है।
- source_word: עֲצֵי שִׁטִּים
  choice: बबूल की लकड़ी
  rationale: इब्रानी बहुवचन-रचना यहाँ बबूल से प्राप्त लकड़ी को सूचित करती है। ‘बबूल की लकड़ी’ आधुनिक हिंदी में स्पष्ट और परिचित है।
- source_word: תַּעֲשֶׂה אֹתוֹ
  choice: उसे ... बनाना
  rationale: दूसरा क्रियारूप वस्तु की ओर फिर ध्यान खींचते हुए निर्माण-सामग्री बताता है। पुनरुक्ति को बनाए रखने से मूल निर्देश की संरचना सुरक्षित रहती है।
