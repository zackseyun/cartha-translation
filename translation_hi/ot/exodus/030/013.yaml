  text: זֶ֣ה יִתְּנ֗וּ כָּל הָ/עֹבֵר֙ עַל הַ/פְּקֻדִ֔ים מַחֲצִ֥ית הַ/שֶּׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ עֶשְׂרִ֤ים גֵּרָה֙ הַ/שֶּׁ֔קֶל מַחֲצִ֣ית הַ/שֶּׁ֔קֶל תְּרוּמָ֖ה לַֽ/יהוָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/013.yaml
  text: 'This is what everyone who passes over to those who are numbered shall give: half a shekel according to the sanctuary shekel (the shekel is twenty gerahs)[a], half a shekel as an offering to Yahweh.'
translation:
  language: hi
  text: '“जो कोई जनगणना में दर्ज होनेवालों में शामिल हो[a], वह यह दे: पवित्रस्थान के शेकेल के अनुसार आधा शेकेल (एक शेकेल बीस गेरा का होता है)—याहवे के लिए भेंट के रूप में आधा शेकेल।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “गिने हुओं के पार जानेवाला हर व्यक्ति।” यह इब्रानी पदबंध जनगणना में आधिकारिक गिनती में शामिल होने का मुहावरा है।
    reason: मूल पदबंध के शाब्दिक रूप और जनगणना-संबंधी मुहावरे दोनों को सुरक्षित रखना।
lexical_decisions:
- source_word: זֶה יִתְּנוּ
  choice: वह यह दे
  rationale: निर्देशात्मक कानूनी संदर्भ में अपूर्ण क्रिया अपेक्षित दायित्व व्यक्त करती है; यह वाक्यांश आधुनिक हिन्दी में स्वाभाविक रहते हुए संकेतवाचक बल बनाए रखता है।
- source_word: כָּל הָעֹבֵר עַל הַפְּקֻדִים
  choice: जिस किसी की गिनती दर्ज किए गए लोगों में हो
  rationale: यह जनगणना में आधिकारिक रूप से गिने या पंजीकृत किए जाने का मुहावरा है। मुख्य पाठ अर्थ स्पष्ट करता है, जबकि शाब्दिक गति-संबंधी रूप को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: מַחֲצִית הַשֶּׁקֶל
  choice: आधा शेकेल
  rationale: मूल भार-मुद्रा की इकाई को लिप्यंतरित करते हुए मात्रा स्पष्ट रखी गई है।
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: पवित्रस्थान में प्रचलित शेकेल के मान के अनुसार
  rationale: בְ यहाँ मापदंड या मान बताता है। यह रूप स्पष्ट करता है कि राशि पवित्रस्थान के अधिकृत मानक से आँकी जानी है।
- source_word: עֶשְׂרִים גֵּרָה הַשֶּׁקֶל
  choice: एक शेकेल बीस गेरा का होता है
  rationale: मूल की व्याख्यात्मक इकाई-परिभाषा को सरल और स्वाभाविक हिन्दी में रखा गया है।
- source_word: תְּרוּמָה לַיהוָה
  choice: याहवे के लिए भेंट के रूप में
  rationale: תְּרוּמָה अलग रखे गए अंशदान या भेंट को दर्शाता है; ‘भेंट’ सामान्य पाठक के लिए सुबोध है और उपासना-संबंधी भाव भी बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल में आए परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: इब्रानी पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे उपस्थित है; ‘याहवे’ उसे उपाधि में बदले बिना प्रस्तुत करता है।
- issue: תְּרוּמָה का धार्मिक अर्थ
  choice: भेंट
  alternative: अंशदान; उठाई हुई भेंट
  rationale: इस प्रसंग में यह याहवे के लिए अलग रखे गए भुगतान को सूचित करता है। ‘भेंट’ धार्मिक आयाम को बनाए रखता है, पर किसी विशेष अनुष्ठानिक तकनीक को अनावश्यक रूप से आरोपित नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और स्पष्ट हिन्दी अपनाई गई है। प्राचीन माप-इकाइयाँ ‘शेकेल’ और ‘गेरा’ के रूप में रखी गई हैं; कोष्ठक मूल की व्याख्यात्मक सूचना को दर्शाते हैं।
