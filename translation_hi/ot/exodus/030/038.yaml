  yaml_path: translation/ot/exodus/030/038.yaml
  text: Whoever makes any like it to smell it shall be cut off from his people[a][b].
translation:
  language: hi
  text: जो कोई सूँघने के लिए इसके समान धूप बनाए, वह अपने लोगों में से काट डाला जाएगा।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसकी सुगंध का आनंद लेने के लिए” अथवा “उसकी सुगंध सूँघने के लिए।” इब्रानी क्रियारूप ऐसी धूप को निजी तौर पर सूँघने या उसकी सुगंध का आनंद लेने के उद्देश्य से बनाने को व्यक्त करता है।
    reason: lexical_alternative
  - marker: b
    text: “अपने लोगों में से काट डाला जाएगा” एक प्रचलित कानूनी सूत्र है। संदर्भ के अनुसार इसका आशय मृत्यु, समुदाय से निष्कासन या परमेश्वर द्वारा हटा दिया जाना हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ אֲשֶׁר
  choice: जो कोई
  rationale: कानूनी विधान में यह पदबंध किसी भी ऐसे व्यक्ति को सामान्य रूप से दर्शाता है जो बताई गई क्रिया करे।
- source_word: יַעֲשֶׂה
  choice: बनाए
  rationale: עשה का मूल अर्थ ‘करना/बनाना’ है; धूप तैयार करने के संदर्भ में ‘बनाए’ सीधा और स्वाभाविक है।
- source_word: כָמוֹהָ
  choice: इसके समान धूप
  rationale: स्त्रीलिंग सर्वनाम पूर्ववर्ती पवित्र धूप की ओर संकेत करता है। हिंदी में संदर्भ स्पष्ट रखने के लिए ‘धूप’ को व्यक्त किया गया है; वाक्यांश समान प्रकार की मिश्रित धूप को दर्शाता है, बिना यह तय किए कि पूर्णतः हूबहू मिश्रण ही अभिप्रेत है।
- source_word: לְהָרִיחַ בָּהּ
  choice: सूँघने के लिए
  rationale: हिफ़ील infinitive उद्देश्य व्यक्त करता है—उस धूप को निजी तौर पर सूँघना अथवा उसकी सुगंध लेना। संक्षिप्त हिंदी मूल की संरचना और आशय दोनों रखती है।
- source_word: וְנִכְרַת
  choice: काट डाला जाएगा
  rationale: निफ़ाल रूप का कानूनी सूत्र समुदाय से गंभीर रूप से अलग किए जाने को दर्शाता है। कर्मवाच्य अनिर्दिष्ट कर्ता और दंड की अस्पष्ट विधि को सुरक्षित रखता है।
- source_word: מֵעַמָּיו
  choice: अपने लोगों में से
  rationale: עם यहाँ व्यक्ति के लोग अथवा समुदाय को दर्शाता है। ‘अपने लोगों में से’ हिंदी में प्रचलित कानूनी-बाइबलीय अभिव्यक्ति है।
theological_decisions:
- issue: ‘अपने लोगों में से काट डाला जाएगा’ दंडसूत्र का सटीक अर्थ
  choice: औपचारिक दंडसूत्र को बनाए रखा गया है और दंड की विधि तय नहीं की गई।
  alternative: ‘मार डाला जाएगा’, ‘समुदाय से निकाल दिया जाएगा’, अथवा ‘परमेश्वर के न्याय से हटा दिया जाएगा’।
  rationale: इब्रानी सूत्र गंभीर निष्कासन या विनाश बताता है, पर हर संदर्भ में यह स्पष्ट नहीं करता कि इसका माध्यम मृत्यु, बहिष्कार या ईश्वरीय दंड है। अनुवाद इस वास्तविक अर्थगत और धर्मवैज्ञानिक तनाव को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और कानूनी स्वर वाली रखी गई है। ‘धूप’ को संदर्भ की स्पष्टता के लिए जोड़ा गया है। ‘काट डाला जाएगा’ जानबूझकर औपचारिक रखा गया है ताकि मूल दंडसूत्र की कठोरता और उसकी अस्पष्ट विधि दोनों बनी रहें।
