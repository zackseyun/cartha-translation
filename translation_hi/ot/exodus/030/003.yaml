  text: וְ/צִפִּיתָ֨ אֹת֜/וֹ זָהָ֣ב טָה֗וֹר אֶת גַּגּ֧/וֹ וְ/אֶת קִירֹתָ֛י/ו סָבִ֖יב וְ/אֶת קַרְנֹתָ֑י/ו וְ/עָשִׂ֥יתָ לּ֛/וֹ זֵ֥ר זָהָ֖ב סָבִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/003.yaml
  text: You shall overlay it with pure gold—its top[a], its walls all around, and its horns—and you shall make for it a gold molding all around.
translation:
  language: hi
  text: तुम उसके ऊपरी भाग, चारों ओर की दीवारों और उसके सींगों को शुद्ध सोने से मढ़ना; और उसके चारों ओर सोने की एक किनारी[a] बनाना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सोने का मुकुट-जैसा घेरा।” इब्रानी शब्द ज़ेर का अर्थ किनारी, घेरा, उभरी पट्टी या मुकुट-जैसी सज्जा हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִפִּיתָ
  choice: मढ़ना
  rationale: यह क्रिया किसी वस्तु की सतह पर धातु की परत चढ़ाने को व्यक्त करती है; ‘मढ़ना’ आधुनिक हिन्दी में संक्षिप्त, स्वाभाविक और सटीक है।
- source_word: זָהָב טָהוֹר
  choice: शुद्ध सोना
  rationale: यह सोने की उच्च शुद्धता का सीधा और प्रचलित हिन्दी रूप है।
- source_word: גַּגּוֹ
  choice: उसका ऊपरी भाग
  rationale: גג का सामान्य अर्थ ‘छत’ है, पर छोटी वेदी के संदर्भ में उसकी ऊपरी सतह अभिप्रेत है; ‘ऊपरी भाग’ भौतिक रूप को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: קִירֹתָיו
  choice: चारों ओर की दीवारें
  rationale: ‘दीवारें’ मूल शब्द के ठोस, ऊर्ध्वाधर पृष्ठों के अर्थ को बनाए रखता है; ‘चारों ओर की’ סָבִיב की परिधीय पूर्णता व्यक्त करता है।
- source_word: קַרְנֹתָיו
  choice: उसके सींग
  rationale: वेदी के कोनों पर निकले पवित्र-उपयोग संबंधी अंगों के लिए मूल रूपक को बनाए रखना आवश्यक है; इसे सामान्यीकृत नहीं किया गया।
- source_word: זֵר זָהָב
  choice: सोने की एक किनारी
  rationale: זֵר पवित्र साज-सामान के चारों ओर बने घेरे, उभरी पट्टी या मुकुट-जैसी सज्जा को सूचित कर सकता है। ‘किनारी’ सामान्य पाठक के लिए स्पष्ट है और अनावश्यक राजकीय अर्थ नहीं जोड़ती।
- source_word: סָבִיב
  choice: चारों ओर
  rationale: मूल में दो बार आए इस शब्द को दोनों स्थानों पर रखा गया है, जिससे पूर्णतः घेरे होने का भाव और इब्रानी पुनरावृत्ति सुरक्षित रहती है।
theological_decisions:
- issue: पवित्र साज-सामान की पारिभाषिक भाषा
  choice: קַרְנֹתָיו को ‘सींग’ और זֵר को ‘किनारी’ कहना
  alternative: ‘सींगों’ को व्याख्यात्मक रूप देना और זֵר को ‘मुकुट’ या ‘कंगनी’ कहना
  rationale: ‘सींग’ वेदी की विशिष्ट संरचना और उससे जुड़ी बाइबिलीय शब्दावली को बनाए रखता है। זֵר का यहाँ मुख्य कार्य भौतिक बनावट बताना है; ‘किनारी’ उस अर्थ को सहज हिन्दी में देता है, जबकि ‘मुकुट’ सम्भव होने पर भी पाठ में राजकीय संकेत अधिक प्रबल कर सकता है। उस विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है और निर्देशात्मक भाव के लिए ‘मढ़ना’ तथा ‘बनाना’ वाले स्वाभाविक आज्ञार्थक ढाँचे का प्रयोग किया गया है। ‘दीवारें’ मूल के निकट है, जबकि ‘ऊपरी भाग’ और ‘किनारी’ छोटे धार्मिक साज-सामान के संदर्भ में सामान्य पाठक के लिए अधिक स्पष्ट हैं। पादटिप्पणी-चिह्न उसी शब्द के बाद रखा गया है जिससे वह वास्तव में संबंधित है।
