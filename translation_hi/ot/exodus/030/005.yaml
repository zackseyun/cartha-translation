  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। मूल के क्रमिक निर्देशात्मक भाव को हिंदी के क्रियार्थक ‘बनाना ... मढ़ना’ से व्यक्त किया गया है; कोई पादटिप्पणी आवश्यक नहीं है।
