source:
  edition: WLC
  text: וְ/עָשִׂ֥יתָ אֶת הַ/בַּדִּ֖ים עֲצֵ֣י שִׁטִּ֑ים וְ/צִפִּיתָ֥ אֹתָ֖/ם זָהָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/005.yaml
  text: And you shall make the poles of acacia wood and overlay them with gold.
translation:
  language: hi
  text: और डंडों को बबूल की लकड़ी से बनाना और उन पर सोना मढ़ना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: और ... बनाना
  rationale: निर्देशों की क्रमिक शृंखला में संयोजक सहित यह क्रियारूप आज्ञार्थक भाव रखता है। आधुनिक हिंदी में ‘बनाना’ पूर्ववर्ती निर्देश से स्वाभाविक रूप से जुड़ता है और विधिक-निर्देशात्मक स्वर बनाए रखता है।
- source_word: הַבַּדִּים
  choice: डंडों
  rationale: पवित्र साज-सामान को उठाकर ले जाने के लिए लगाए जाने वाले लंबे डंडे अभिप्रेत हैं। ‘डंडे’ आधुनिक हिंदी में स्पष्ट और सहज है।
- source_word: עֲצֵי שִׁטִּים
  choice: बबूल की लकड़ी से
  rationale: यह शिट्टा/अकैशिया कुल की लकड़ी का संकेत है। ‘बबूल की लकड़ी’ हिंदी पाठकों के लिए प्रचलित और बोधगम्य नाम है; ‘से’ निर्माण-सामग्री का स्वाभाविक हिंदी संबंध व्यक्त करता है।
- source_word: וְצִפִּיתָ
  choice: और ... मढ़ना
  rationale: कारीगरी के इस प्रसंग में क्रिया का अर्थ किसी वस्तु की सतह पर धातु की परत चढ़ाना है। सोने के साथ ‘मढ़ना’ सटीक, संक्षिप्त और स्वाभाविक हिंदी है।
- source_word: אֹתָם
  choice: उन पर
  rationale: सर्वनाम का पूर्वपद ‘डंडे’ है। हिंदी में ‘सोना मढ़ना’ के साथ लक्ष्य-वस्तु को ‘उन पर’ कहना स्वाभाविक है।
- source_word: זָהָב
  choice: सोना
  rationale: मढ़ाई में प्रयुक्त पदार्थ को दर्शाता है; हिंदी वाक्य-विन्यास में ‘सोना मढ़ना’ स्वाभाविक प्रयोग है।
theological_decisions: []
