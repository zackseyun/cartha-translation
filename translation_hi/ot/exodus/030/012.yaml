  text: כִּ֣י תִשָּׂ֞א אֶת רֹ֥אשׁ בְּנֵֽי יִשְׂרָאֵ֘ל לִ/פְקֻדֵי/הֶם֒ וְ/נָ֨תְנ֜וּ אִ֣ישׁ כֹּ֧פֶר נַפְשׁ֛/וֹ לַ/יהוָ֖ה בִּ/פְקֹ֣ד אֹתָ֑/ם וְ/לֹא יִהְיֶ֥ה בָ/הֶ֛ם נֶ֖גֶף בִּ/פְקֹ֥ד אֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/012.yaml
  text: When you take a census of the sons of Israel according to those numbered among them[a], then each man shall give to Yahweh a ransom for his life when you number them[c][b], so that there will be no plague among them when you number them.
translation:
  language: hi
  text: जब तुम इस्राएल के पुत्रों की जनगणना करोगे, तब उनमें से हर पुरुष, जब उनकी गिनती की जाए, अपने जीवन के लिए याहवे को छुड़ौती दे,[a] ताकि जब उनकी गिनती की जाए तो उन पर कोई महामारी न आए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “इस्राएल के पुत्रों का सिर उठाओ”; यह जनगणना करने का एक इब्रानी मुहावरा है। “अपने जीवन के लिए” का इब्रानी शब्द जीवन या स्वयं व्यक्ति का भी अर्थ दे सकता है, केवल “आत्मा” नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: जब
  rationale: विधिक निर्देश में यह अपेक्षित अवसर को बताता है; इसलिए सशर्त ‘यदि’ की अपेक्षा ‘जब’ अधिक स्वाभाविक है।
- source_word: תִשָּׂא אֶת רֹאשׁ
  choice: गिनती करो
  rationale: शाब्दिक अर्थ ‘सिर उठाना’ है, पर यहाँ यह जनगणना करने का इब्रानी मुहावरा है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: मूल की पारिवारिक और पुल्लिंग अभिव्यक्ति को बनाए रखता है।
- source_word: לִפְקֻדֵיהֶם
  choice: उनकी गणना के अनुसार
  rationale: פקד धातु के पंजीकरण और गिनती के प्रशासनिक भाव को व्यक्त करता है।
- source_word: וְנָתְנוּ אִישׁ
  choice: तब उनमें से हर पुरुष ... दे
  rationale: אִישׁ का वितरणात्मक एकवचन गिने जा रहे प्रत्येक पुरुष की व्यक्तिगत जिम्मेदारी बताता है।
- source_word: כֹּפֶר
  choice: छुड़ौती का मूल्य
  rationale: यह ऐसा प्रतिपूरक भुगतान है जो दंड को टालता है; ‘छुड़ौती का मूल्य’ आधुनिक हिन्दी में भुगतान का भाव स्पष्ट करता है।
- source_word: נַפְשׁוֹ
  choice: अपने प्राण के बदले
  rationale: यहाँ נֶפֶשׁ का अर्थ व्यक्ति का जीवन अथवा स्वयं व्यक्ति है, केवल अमूर्त ‘आत्मा’ नहीं।
- source_word: לַיהוָה
  choice: यहोवा को
  rationale: वाचा के नाम יהוה को हिन्दी में प्रचलित ध्वन्यात्मक रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: בִּפְקֹד אֹתָם
  choice: अपनी गिनती के समय / उनकी गिनती करते समय
  rationale: पूर्वसर्गयुक्त क्रियार्थक संज्ञा गिनती किए जाने की समय-परिस्थिति बताती है; मूल की पुनरावृत्ति भी बनाए रखी गई है।
- source_word: נֶגֶף
  choice: महामारी
  rationale: दैवी दंड के इस संदर्भ में यह घातक प्रकोप अथवा plague को सूचित करता है।
- source_word: וְלֹא יִהְיֶה בָהֶם נֶגֶף
  choice: ताकि ... उन पर कोई महामारी न आए
  rationale: छुड़ौती देने के अभिप्रेत परिणाम को स्वाभाविक हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल में वाचा का विशिष्ट नाम है; इसे सामान्य उपाधि में बदलने के बजाय हिन्दी में परिचित नामरूप रखा गया है।
- issue: נַפְשׁוֹ का अर्थ
  choice: अपने प्राण के बदले
  alternative: अपने लिए / अपनी आत्मा के लिए
  rationale: जनगणना-छुड़ौती के प्रसंग में शब्द जीवन अथवा स्वयं व्यक्ति को दर्शाता है; ‘आत्मा’ कहने से अनावश्यक उत्तरवर्ती दार्शनिक अर्थ जुड़ सकता है।
- issue: בְּנֵי יִשְׂרָאֵל और אִישׁ की लैंगिक अभिव्यक्ति
  choice: इस्राएल के पुत्रों ... हर पुरुष
  alternative: इस्राएलियों ... हर व्यक्ति
  rationale: मूल के स्पष्ट पुल्लिंग रूप और इस प्रसंग में गिने जा रहे पुरुषों की व्यक्तिगत देनदारी को सुरक्षित रखा गया है।
- issue: छुड़ौती और महामारी का संबंध
  choice: ‘ताकि’ द्वारा उद्देश्य/परिणाम
  alternative: और उन पर कोई महामारी न आए
  rationale: वाक्य छुड़ौती के भुगतान को महामारी टलने से जोड़ता है; अनुवाद संबंध को स्पष्ट करता है, पर उसके प्रायश्चित्त-सिद्धान्त का अतिरिक्त विवरण नहीं जोड़ता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। ‘गिनती/गणना’ की पुनरावृत्ति मूल के प्रशासनिक शब्द-संबंध को बनाए रखती है। ‘छुड़ौती का मूल्य’ केवल ‘छुड़ौती’ की तुलना में भुगतान की प्रकृति अधिक स्पष्ट करता है।
