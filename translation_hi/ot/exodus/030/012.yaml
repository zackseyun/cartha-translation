- from: जब तुम इस्राएल के पुत्रों की गिनती उनकी गणना के अनुसार करो,[a] तब उनमें से हर पुरुष अपनी गिनती के समय अपने प्राण के बदले यहोवा को छुड़ौती का मूल्य दे,[b] ताकि उनकी गिनती करते समय उन पर कोई महामारी न आए।
  to: जब तुम इस्राएल के पुत्रों की जनगणना करोगे, तब उनमें से हर पुरुष, जब उनकी गिनती की जाए, अपने जीवन के लिए याहवे को छुड़ौती दे,[a] ताकि जब उनकी गिनती की जाए तो उन पर कोई महामारी न आए।
