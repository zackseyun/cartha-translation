review_pass:
  verdict: revise
  source_fidelity: 'The draft preserves the principal referents and cultic terms: Aaron, his sons, anointing, consecration, and priestly service directed to God. However, the Hebrew addresses a singular second-person addressee with two coordinated directives. The opening bare infinitive phrase “...अभिषेक करना” leaves that directive force insufficiently expressed in a standalone Hindi verse.'
  naturalness: “पवित्र ठहराना” and “याजकों के रूप में सेवा करें” are clear and appropriately formal. Adding an explicit second-person directive makes the sentence complete and natural modern Hindi.
  terminology: “अभिषेक,” “पवित्र ठहराना,” and “याजकों के रूप में सेवा” suitably convey משׁח, קדשׁ, and כהן in this priestly-installation context. “पुत्रों” correctly retains the source's masculine wording. No footnote is needed.
  issues:
  - severity: medium
    issue: The two Hebrew second-person-singular instructions are rendered as an unanchored infinitive phrase.
    rationale: “और हारून और उसके पुत्रों का अभिषेक करना...” does not clearly state who is to perform the actions. The source has “you shall anoint ... and you shall consecrate,” so Hindi should retain explicit directive force.
  revised_text: तुम हारून और उसके पुत्रों का अभिषेक करो और उन्हें पवित्र ठहराओ, ताकि वे मेरे लिए याजकों के रूप में सेवा करें।
