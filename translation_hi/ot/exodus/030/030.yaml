  edition: WLC
  text: וְ/אֶת אַהֲרֹ֥ן וְ/אֶת בָּנָ֖י/ו תִּמְשָׁ֑ח וְ/קִדַּשְׁתָּ֥ אֹתָ֖/ם לְ/כַהֵ֥ן לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/030.yaml
  text: And you shall anoint Aaron and his sons, and you shall consecrate them to serve as priests to me.
translation:
  language: hi
  text: तुम हारून और उसके पुत्रों का अभिषेक करो और उन्हें पवित्र ठहराओ, ताकि वे मेरे लिए याजकों के रूप में सेवा करें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּמְשָׁח
  choice: अभिषेक करना
  rationale: משׁח पवित्र तेल लगाकर किसी को धार्मिक सेवा के लिए नियुक्त करने की विधि को व्यक्त करता है; ‘अभिषेक करना’ इस अनुष्ठानिक और धर्मवैचारिक अर्थ को सुरक्षित रखता है।
- source_word: וְקִדַּשְׁתָּ
  choice: पवित्र ठहराना
  rationale: קדשׁ के पिएल रूप का अर्थ पवित्र उद्देश्य के लिए अलग करना है। ‘पवित्र ठहराना’ आधुनिक हिन्दी में स्वाभाविक रहते हुए इस याजकीय समर्पण को व्यक्त करता है।
- source_word: לְכַהֵן
  choice: याजकों के रूप में सेवा करें
  rationale: כהן का क्रियात्मक रूप याजक का कार्य करने या याजकीय सेवा निभाने को दर्शाता है; यह वाक्यांश भूमिका और कार्य दोनों को स्पष्ट करता है।
- source_word: לִי
  choice: मेरे लिए
  rationale: पहले पुरुष के प्रत्यय सहित ל सेवा के परमेश्वर के लिए किए जाने का संबंध व्यक्त करता है। हिन्दी में ‘मेरे लिए’ इसका सहज और निकट अनुवाद है।
- source_word: בָּנָיו
  choice: उसके पुत्रों
  rationale: मूल पाठ विशेष रूप से हारून के पुत्रों को निर्दिष्ट करता है; अतः लिंग-विशिष्ट अर्थ को बनाए रखा गया है।
theological_decisions:
- issue: קדשׁ और כהן का उपासना-विधि संबंधी संदर्भ
  choice: ‘पवित्र ठहराना’ और ‘याजकों के रूप में सेवा करें’
  alternative: ‘पवित्र करना’ और ‘याजकीय सेवा करें’
  rationale: चुना हुआ रूप हारून और उसके पुत्रों को पवित्र पद के लिए अलग किए जाने और उस पद में सेवा करने—दोनों बातों को स्पष्ट रूप से व्यक्त करता है, बिना बाद की कलीसियाई पदावली आरोपित किए।
- issue: בָּנָיו का लिंग-विशिष्ट अर्थ
  choice: ‘उसके पुत्रों’
  alternative: ‘उसकी संतानों’
  rationale: इब्रानी पाठ और तत्कालीन याजकीय संदर्भ पुरुष वंशजों को निर्दिष्ट करते हैं, इसलिए अर्थ को लिंग-निरपेक्ष नहीं बनाया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और निर्देशात्मक है। निकटवर्ती विधिक प्रसंग के अनुरूप इब्रानी यिक्तोल और वे-क़ातल रूपों को हिन्दी के आदेशसूचक कृदंत ‘करना’ और प्रयोजनवाचक ‘ताकि...करें’ से व्यक्त किया गया है।
