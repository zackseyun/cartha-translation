  to: तुम हारून और उसके पुत्रों का अभिषेक करो और उन्हें पवित्र ठहराओ, ताकि वे मेरे लिए याजकों के रूप में सेवा करें।
  rationale: The revision supplies the singular-address instruction in idiomatic Hindi while retaining the source sequence, the distinct acts of anointing and consecrating, the male-specific “sons,” and the purpose of serving as priests for God. The purpose clause naturally represents the infinitive לְכַהֵן.
