  text: וְ/אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל תְּדַבֵּ֣ר לֵ/אמֹ֑ר שֶׁ֠מֶן מִשְׁחַת קֹ֨דֶשׁ יִהְיֶ֥ה זֶ֛ה לִ֖/י לְ/דֹרֹתֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/031.yaml
  text: And you shall speak to the sons of Israel, saying, ‘This shall be a holy anointing oil to me throughout your generations.’
translation:
  language: hi
  text: और तुम इस्राएलियों से कहना, ‘यह तुम्हारी पीढ़ी-पीढ़ी तक मेरे लिए पवित्र अभिषेक का तेल होगा।’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएली
  rationale: शाब्दिक रूप से ‘इस्राएल के पुत्र’; आधुनिक हिन्दी में पूरे समुदाय के लिए स्वाभाविक और समावेशी सामूहिक संबोधन ‘इस्राएली’ है।
- source_word: שֶׁמֶן מִשְׁחַת קֹדֶשׁ
  choice: पवित्र अभिषेक का तेल
  rationale: संबंधित पदबंध में तेल के पवित्र अभिषेक हेतु नियत होने का भाव सुरक्षित रहता है और प्रचलित बाइबलीय शब्दावली भी बनी रहती है।
- source_word: לִי
  choice: मेरे लिए
  rationale: हिब्रू संबंधसूचक अर्थ को सीधे रखता है—यह तेल परमेश्वर के लिए अलग ठहराया गया है—बिना ‘मेरा’ कहकर स्वामित्व को अधिक स्पष्ट बनाने के।
- source_word: לְדֹרֹתֵיכֶם
  choice: तुम्हारी पीढ़ी-पीढ़ी तक
  rationale: पीढ़ियों के क्रम में निरंतर लागू रहने का भाव सहज आधुनिक हिन्दी में व्यक्त होता है।
theological_decisions:
- issue: पवित्र तेल का परमेश्वर से संबंध
  choice: मेरे लिए
  alternative: मेरा
  rationale: לִי का दत्तिवाचक संबंध सुरक्षित रखा गया है; पाठ जितना कहता है उससे अधिक स्वामित्व या विधिक अर्थ नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। हिब्रू आज्ञार्थक वाक्य-विन्यास को हिन्दी में स्वाभाविक ‘से कहना’ द्वारा व्यक्त किया गया है।
