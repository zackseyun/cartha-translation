translation:
  language: hi
  text: तुम उससे मिलाप के तंबू और साक्ष्य के संदूक[a] का अभिषेक करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक पारंपरिक अनुवाद: “वाचा का संदूक”; यहाँ इब्रानी में “साक्ष्य” है।'
    reason: पारंपरिक वैकल्पिक अनुवाद को बताते हुए मूल इब्रानी शब्द-चयन स्पष्ट करना।
lexical_decisions:
- source_word: וּמָשַׁחְתָּ
  choice: अभिषेक करना
  rationale: निर्देशों की इस क्रमिक शैली में संयोजक सहित पूर्ण क्रिया आदेशात्मक भाव व्यक्त करती है। ‘अभिषेक करना’ पवित्र उपयोग के लिए तेल लगाने का सटीक और प्रचलित धार्मिक पद है।
- source_word: בּוֹ
  choice: उसी से
  rationale: यह पुल्लिंग एकवचन सर्वनाम पिछले संदर्भ के अभिषेक के तेल की ओर संकेत करता है और ב का साधनवाचक अर्थ व्यक्त करता है।
- source_word: אֹהֶל מוֹעֵד
  choice: मिलाप का तंबू
  rationale: यह पद उस पवित्र तंबू को दर्शाता है जहाँ भेंट या मिलन होता है। ‘मिलाप का तंबू’ हिन्दी में सुबोध है और मूल पद की संक्षिप्तता बनाए रखता है।
- source_word: אֲרוֹן
  choice: संदूक
  rationale: पवित्र वस्तु रखने वाले पात्र के लिए ‘संदूक’ स्वाभाविक आधुनिक हिन्दी है और इस प्रसंग में पारंपरिक अर्थ को स्पष्ट रखता है।
- source_word: הָעֵדֻת
  choice: साक्षी-पत्र
  rationale: यह शब्द यहाँ संदूक में रखी वाचा-संबंधी लिखित साक्षी की ओर संकेत करता है। ‘साक्षी-पत्र’ मूल के ‘साक्षी/गवाही’ भाव को बनाए रखते हुए हिन्दी में संदर्भ को समझने योग्य बनाता है।
theological_decisions:
- issue: אֲרוֹן הָעֵדֻת का अनुवाद
  choice: साक्षी-पत्र का संदूक
  alternative: वाचा का संदूक
  rationale: मूल इब्रानी में यहाँ ‘वाचा’ (בְּרִית) नहीं, बल्कि ‘साक्षी/गवाही’ (עֵדוּת) है। इसलिए मुख्य पाठ मूल शब्द-चयन को बनाए रखता है, जबकि अधिक परिचित पारंपरिक पद को पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘तंबू’ की आधुनिक वर्तनी अपनाई गई है; आदेश के लिए स्वाभाविक हिन्दी संरचना ‘तुम … करना’ प्रयुक्त हुई है।
