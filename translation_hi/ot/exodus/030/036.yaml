source:
  edition: WLC
  text: וְ/שָֽׁחַקְתָּ֣ מִמֶּ/נָּה֮ הָדֵק֒ וְ/נָתַתָּ֨ה מִמֶּ֜/נָּה לִ/פְנֵ֤י הָ/עֵדֻת֙ בְּ/אֹ֣הֶל מוֹעֵ֔ד אֲשֶׁ֛ר אִוָּעֵ֥ד לְ/ךָ֖ שָׁ֑מָּ/ה קֹ֥דֶשׁ קָֽדָשִׁ֖ים תִּהְיֶ֥ה לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/036.yaml
  text: And you shall grind some of it very fine[a], and put some of it before the testimony in the tent of meeting, where I will meet with you. It shall be most holy for you.
translation:
  language: hi
  text: तुम उसमें से कुछ को बहुत बारीक पीसना और उसमें से कुछ को मिलाप के तंबू में साक्षीपत्र के सामने रखना, जहाँ मैं तुमसे मिलूँगा। वह तुम्हारे लिए परम पवित्र[a] होगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “पवित्रों में पवित्र।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁחַקְתָּ
  choice: पीसना
  rationale: यहाँ क्रिया धूप-मिश्रण को चूर्ण करने की क्रिया बताती है; आधुनिक हिन्दी में ‘पीसना’ स्वाभाविक और सटीक है।
- source_word: מִמֶּנָּה
  choice: उसमें से कुछ को
  rationale: 'पूर्वसर्ग और सर्वनाम यहाँ अंशवाचक हैं: पूरे मिश्रण में से केवल कुछ भाग लिया जाना है।'
- source_word: הָדֵק
  choice: बहुत बारीक
  rationale: यह रूप पीसने की क्रिया की तीव्रता और उससे बनने वाले अत्यन्त महीन चूर्ण को व्यक्त करता है।
- source_word: וְנָתַתָּה
  choice: रखना
  rationale: अनुष्ठानिक स्थान पर किसी वस्तु को स्थापित करने के संदर्भ में ‘रखना’ सहज हिन्दी है।
- source_word: לִפְנֵי הָעֵדֻת
  choice: साक्षीपत्र के सामने
  rationale: ‘साक्षीपत्र’ पवित्रस्थान से जुड़ी इस पारिभाषिक संज्ञा को व्यक्त करता है और पाठ में न कही गई ‘सन्दूक’ जैसी व्याख्या नहीं जोड़ता।
- source_word: בְּאֹהֶל מוֹעֵד
  choice: मिलापवाले तंबू में
  rationale: यह प्रचलित हिन्दी पारिभाषिक अभिव्यक्ति उस तंबू को दर्शाती है जहाँ परमेश्वर अपने लोगों से मिलने को नियुक्त करता है।
- source_word: אֲשֶׁר אִוָּעֵד לְךָ שָׁמָּה
  choice: जहाँ मैं तुमसे मिलूँगा
  rationale: יעד का निफ़अल रूप यहाँ निर्धारित भेंट को दर्शाता है; यह हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: परम पवित्र
  rationale: इब्रानी की ‘पवित्रता का पवित्र’ संरचना सर्वोच्च स्तर की पवित्रता व्यक्त करती है; ‘परम पवित्र’ उसका स्वाभाविक हिन्दी समतुल्य है।
- source_word: תִּהְיֶה לָכֶם
  choice: वह तुम्हारे लिए ... होगी
  rationale: यह धूप के समुदाय के संबंध में पवित्र दर्जे को व्यक्त करता है और स्वामित्व का अनावश्यक अर्थ नहीं जोड़ता।
theological_decisions:
- issue: ‘साक्षीपत्र’ का अभिप्राय
  choice: मूल पाठ की पारिभाषिक संज्ञा ‘साक्षीपत्र’ को बनाए रखा गया है।
  alternative: साक्षीपत्र का सन्दूक / वाचा की पटियाएँ
  rationale: इब्रानी पाठ स्पष्ट रूप से सन्दूक या पटियाओं का नाम नहीं लेता; इसलिए किसी एक संभावित संदर्भ को मुख्य पाठ में जोड़ना उचित नहीं है।
- issue: पवित्रता के सर्वोच्च दर्जे का अनुवाद
  choice: मुख्य पाठ में ‘परम पवित्र’
  alternative: पवित्रों में पवित्र
  rationale: ‘परम पवित्र’ आधुनिक हिन्दी में इब्रानी अतिशयोक्तिपरक संरचना का अर्थ स्पष्ट करता है; अधिक शाब्दिक रूप को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और निर्देशात्मक है। इब्रानी में निहित स्त्रीलिंग धूप/सुगन्धित मिश्रण की ओर संकेत करता है; हिन्दी में ‘वह ... होगी’ इसी व्याकरणिक संबंध को बनाए रखता है। पादटिप्पणी-चिह्न को ‘परम पवित्र’ के बाद रखा गया है, क्योंकि टिप्पणी उसी पदबंध से संबंधित है।
