  yaml_path: translation/ot/exodus/030/033.yaml
  text: Whoever compounds any like it[a], or puts any of it on a stranger[b], shall be cut off from his people.
translation:
  language: hi
  text: जो कोई इसके समान तेल तैयार करे, या उस तेल में से कुछ किसी अनधिकृत व्यक्ति पर लगाए[a], वह अपने लोगों में से काट डाला जाएगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “किसी पराए व्यक्ति पर।” यहाँ इब्रानी शब्द ज़ार का अर्थ ऐसे व्यक्ति से है जिसे इस पवित्र तेल को ग्रहण करने का अधिकार नहीं है।
    reason: lexical_alternative
  - marker: b
    text: “अपने लोगों में से काट डाला जाएगा” वाचा-संबंधी कानूनी सूत्र है; यहाँ पाठ दण्ड की ठीक रीति नहीं बताता।
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ אֲשֶׁר
  choice: जो कोई
  rationale: यह इब्रानी कानूनी सूत्र किसी भी व्यक्ति पर सामान्य रूप से लागू होता है; ‘जो कोई’ आधुनिक हिन्दी में उसका स्वाभाविक और विधिक बल बनाए रखता है।
- source_word: יִרְקַח
  choice: तैयार करे
  rationale: רקח सुगंधित पदार्थ को निश्चित रीति से मिलाकर बनाने को दर्शाता है। तेल के संदर्भ में ‘तैयार करे’ सहज है और केवल साधारण मिश्रण से अधिक तकनीकी आशय देता है।
- source_word: כָּמֹהוּ
  choice: इसके समान तेल
  rationale: सर्वनाम प्रसंग में पवित्र अभिषेक के तेल की ओर संकेत करता है। हिन्दी में संदर्भ स्पष्ट रखने के लिए ‘तेल’ की पुनरावृत्ति उचित है, जबकि समानता की सीमा को अनावश्यक रूप से निश्चित नहीं किया गया।
- source_word: וַאֲשֶׁר יִתֵּן מִמֶּנּוּ
  choice: या उसमें से ... पर लगाए
  rationale: यहाँ נתן על तेल को किसी व्यक्ति पर रखने अथवा लगाने के अर्थ में है; ‘लगाए’ हिन्दी में इस क्रिया का स्वाभाविक रूप है।
- source_word: עַל זָר
  choice: किसी अनधिकृत व्यक्ति पर
  rationale: याजकीय पवित्रता के इस प्रसंग में זָר जातीय विदेशी से अधिक ऐसे व्यक्ति को सूचित करता है जिसे इस पवित्र तेल का उपयोग या ग्रहण करने का अधिकार नहीं है।
- source_word: וְנִכְרַת מֵעַמָּיו
  choice: वह अपने लोगों में से काट डाला जाएगा
  rationale: यह वाचा-संबंधी न्यायिक सूत्र है। शाब्दिक बिंब को बनाए रखने से दण्ड की रीति—बहिष्कार, मृत्यु या दैवी दण्ड—को पाठ से अधिक निश्चित नहीं किया जाता।
theological_decisions:
- issue: याजकीय व्यवस्था में זָר का अर्थ
  choice: अनधिकृत व्यक्ति
  alternative: पराया व्यक्ति / बाहरी व्यक्ति / साधारण जन
  rationale: यह निषेध मुख्यतः पवित्र उपयोग की अधिकार-सीमा से संबंधित है, न कि जातीय पहचान से। ‘अनधिकृत’ उस प्रसंगगत अर्थ को स्पष्ट करता है।
- issue: וְנִכְרַת מֵעַמָּיו में दण्ड का स्वरूप
  choice: अपने लोगों में से काट डाला जाएगा
  alternative: अपने लोगों से निकाल दिया जाएगा / मार डाला जाएगा
  rationale: मूल पाठ यहाँ दण्ड को लागू करने की ठीक रीति नहीं बताता। इसलिए पारंपरिक न्यायिक मुहावरे और उसकी वास्तविक अस्पष्टता दोनों सुरक्षित रखी गई हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कानूनी-पवित्र शैली-रजिस्टर। ‘अनधिकृत व्यक्ति’ प्रसंगगत अर्थ स्पष्ट करता है; दण्ड-सूत्र को जानबूझकर व्याख्यात्मक रूप से नहीं खोला गया।
