base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/009.yaml
  text: You shall not offer unauthorized incense on it[a], or a burnt offering, or a grain offering; and you shall not pour out a drink offering on it.
translation:
  language: hi
  text: तुम उस पर अनधिकृत धूप, होमबलि या अन्नबलि न चढ़ाओ, और उस पर पेयबलि न उंडेलो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַעֲלוּ
  choice: चढ़ाना
  rationale: हिफ़ील रूप का मूल अर्थ ‘ऊपर चढ़ाना’ है, पर वेदी और बलि के संदर्भ में यह अर्पित करने की क्रिया बताता है। ‘चढ़ाना’ हिंदी में स्वाभाविक रूप से दोनों भाव रखता है।
- source_word: עָלָיו
  choice: उस पर
  rationale: संदर्भ में यह धूप की वेदी को सूचित करता है और मूल स्थान-संबंध को बनाए रखता है।
- source_word: קְטֹרֶת זָרָה
  choice: अनधिकृत धूप
  rationale: याजकीय संदर्भ में זָרָה उस धूप को दर्शाता है जो निर्धारित या अनुमत व्यवस्था से बाहर हो; ‘अनधिकृत’ आधुनिक पाठक के लिए यह विधिक-अनुष्ठानिक भाव स्पष्ट करता है।
- source_word: וְעֹלָה
  choice: होमबलि
  rationale: עֹלָה पूर्णतः जलाकर चढ़ाई जाने वाली बलि का प्रचलित और सटीक हिंदी धार्मिक पद है। निषेध-सूची में हिंदी के स्वाभाविक प्रयोग के अनुसार ‘या’ लगाया गया है।
- source_word: וּמִנְחָה
  choice: अन्नबलि
  rationale: याजकीय बलि-विधान में מִנְחָה सामान्यतः अनाज से बनी भेंट को दर्शाता है; ‘अन्नबलि’ संक्षिप्त और परिचित पद है।
- source_word: וְנֵסֶךְ
  choice: पेयबलि
  rationale: נֵסֶךְ उंडेली जाने वाली तरल भेंट है; ‘पेयबलि’ सुलभ और अनुष्ठानिक अर्थ में स्पष्ट है।
- source_word: תִסְּכוּ
  choice: उंडेलना
  rationale: यहाँ נסך का अर्थ पेयबलि को उंडेलना है; यह शब्द अनुष्ठानिक क्रिया को साफ़ और स्वाभाविक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: धूप के लिए זָרָה का अनुष्ठानिक अर्थ
  choice: अनधिकृत धूप
  alternative: अनोखी धूप; पराई धूप
  rationale: पद धूप की वेदी पर उचित उपासना को नियंत्रित करता है। ‘अनधिकृत’ निर्धारित व्यवस्था से बाहर होने का भाव देता है, पर जातीय रूप से ‘विदेशी’ होने का अनावश्यक अर्थ नहीं जोड़ता। विकल्पों को पादटिप्पणी में रखा गया है ताकि मूल शब्द की अर्थ-सीमा बनी रहे।
translation_notes:
  register: आधुनिक मानक हिंदी में आज्ञार्थक निषेध रखा गया है। ‘होमबलि’, ‘अन्नबलि’ और ‘पेयबलि’ जैसे परिचित बाइबलीय-अनुष्ठानिक पद प्रयुक्त हैं; वाक्य को गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखा गया है।
