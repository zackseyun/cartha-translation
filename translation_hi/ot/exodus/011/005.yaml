  text: וּ/מֵ֣ת כָּל בְּכוֹר֮ בְּ/אֶ֣רֶץ מִצְרַיִם֒ מִ/בְּכ֤וֹר פַּרְעֹה֙ הַ/יֹּשֵׁ֣ב עַל כִּסְא֔/וֹ עַ֚ד בְּכ֣וֹר הַ/שִּׁפְחָ֔ה אֲשֶׁ֖ר אַחַ֣ר הָ/רֵחָ֑יִם וְ/כֹ֖ל בְּכ֥וֹר בְּהֵמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/005.yaml
  text: And every firstborn in the land of Egypt will die[a], from the firstborn of Pharaoh, who sits on his throne, to the firstborn of the servant woman who is behind the millstones, and every firstborn of the livestock.
translation:
  language: hi
  text: और मिस्र देश में हर पहलौठा मर जाएगा—सिंहासन पर बैठे फ़िरौन के पहलौठे से लेकर चक्कियों के पीछे काम करने वाली दासी[a] के पहलौठे तक—और पशुधन का भी हर पहलौठा मर जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दास स्त्री” अथवा “सेविका।” इब्रानी शब्द सेवाधीन स्थिति वाली स्त्री के लिए है; “चक्कियों के पीछे” अनाज पीसने के निम्न-प्रतिष्ठित श्रम का चित्र प्रस्तुत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵת
  choice: और ... मर जाएगा
  rationale: संयोजक वाव के साथ यह कालरूप आने वाली विपत्ति की निश्चित भविष्यवाणी करता है; आधुनिक हिन्दी में भविष्यकाल इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: כָּל בְּכוֹר
  choice: हर पहलौठा
  rationale: एकवचन संज्ञा के साथ כָּל का वितरणात्मक बल है। ‘हर पहलौठा’ मूल की व्यापकता बनाए रखता है और मनुष्यों तथा पशुओं दोनों पर लागू हो सकता है।
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: मिस्र देश में
  rationale: यह भौगोलिक पदबंध को स्पष्ट, गरिमापूर्ण और हिन्दी बाइबलीय प्रयोग के अनुरूप रखता है।
- source_word: מִבְּכוֹר ... עַד בְּכוֹר
  choice: के पहलौठे से लेकर ... के पहलौठे तक
  rationale: ‘से लेकर ... तक’ सर्वोच्च राजकीय स्तर से निम्नतम दास-श्रम की सामाजिक परास को स्पष्ट करता है।
- source_word: פַּרְעֹה הַיֹּשֵׁב עַל כִּסְאוֹ
  choice: सिंहासन पर बैठे फ़िरौन
  rationale: कृदन्तीय पद फ़िरौन की राजकीय स्थिति दिखाता है; यह हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: הַשִּׁפְחָה
  choice: दासी
  rationale: यह स्त्री की सेवाधीन अथवा दास स्थिति को दर्शाता है। ‘दासी’ आधुनिक पाठक के लिए सुबोध है, जबकि पादटिप्पणी उस स्थिति की तीव्रता स्पष्ट करती है।
- source_word: אַחַר הָרֵחָיִם
  choice: चक्कियों के पीछे काम करने वाली
  rationale: ‘पीछे’ की ठोस छवि सुरक्षित रखते हुए ‘काम करने वाली’ जोड़ना प्रसंगगत पीसने के श्रम को आधुनिक हिन्दी में स्पष्ट करता है। बहुवचन ‘चक्कियों’ से द्विपाषाण चक्की का संकेत बना रहता है।
- source_word: וְכֹל בְּכוֹר בְּהֵמָה
  choice: और पालतू पशुओं का भी हर पहलौठा
  rationale: בְּהֵמָה यहाँ व्यापक रूप से घरेलू पशुधन को सूचित करता है। ‘पालतू पशु’ सामान्य पाठक के लिए ‘पशुधन’ से अधिक सहज है; ‘भी’ अंतिम श्रेणी के समावेश को स्पष्ट करता है।
theological_decisions:
- issue: שִׁפְחָה में स्त्री की सामाजिक स्थिति
  choice: दासी
  alternative: दास स्त्री / सेविका
  rationale: मूल पद सेवाधीन, प्रायः दास स्थिति वाली स्त्री को बताता है और फ़िरौन से सामाजिक रूप से सबसे नीचे के श्रम तक का विरोध रचता है। मुख्य पाठ में सहज ‘दासी’ रखा गया है और पादटिप्पणी में संभावित अर्थ स्पष्ट किया गया है, ताकि न तो बंधुआ स्थिति को नरम किया जाए, न मूल से अधिक कानूनी विशिष्टता थोपी जाए।
