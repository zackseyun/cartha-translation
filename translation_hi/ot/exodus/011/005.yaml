  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज। सामाजिक परास और मूल की ठोस चक्की वाली छवि को बनाए रखा गया है। मुख्य पाठ में [a] चिह्न संबंधित शब्द के तुरंत बाद दिया गया है।
