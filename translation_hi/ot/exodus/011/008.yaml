  yaml_path: translation/ot/exodus/011/008.yaml
  text: Then all these servants of yours will come down to me and bow down to me[a], saying, ‘Go out[b], you and all the people who are at your feet,’ and after that I will go out.” And he went out from Pharaoh in burning anger.
translation:
  language: hi
  text: तब तेरे ये सभी सेवक मेरे पास उतरकर आएँगे और मेरे सामने झुककर कहेंगे, ‘तू और तेरे पैरों के पास के सभी लोग[a] निकल जाओ।’ इसके बाद मैं निकल जाऊँगा।” फिर मूसा धधकते क्रोध में फ़िरौन के पास से निकल गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘तेरे पैरों के पास के सभी लोग।’ यह इब्रानी मुहावरा तेरे साथ चलनेवाले, तेरे अनुयायियों, या तेरे अधीन लोगों का संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרְדוּ
  choice: उतरकर आएँगे
  rationale: ירד के उतरने के दिशात्मक बिंब को बनाए रखते हुए वक्ता मूसा की ओर गति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עֲבָדֶיךָ
  choice: तेरे ये सभी सेवक
  rationale: עבד का मूल अर्थ सेवक है और दरबारी प्रसंग में यह फ़िरौन के अधिकारियों या अनुचरों को सूचित कर सकता है; मुख्य पाठ व्यापक अर्थ बनाए रखता है।
- source_word: וְהִשְׁתַּחֲוּוּ לִי
  choice: मेरे सामने झुककर
  rationale: यह शारीरिक रूप से झुकने या दंडवत करने का भाव देता है, बिना इस दरबारी प्रसंग में उपासना का अर्थ आरोपित किए।
- source_word: צֵא אַתָּה
  choice: तू ... निकल जा
  rationale: יצא के सामान्य अर्थ ‘निकलना’ और אַתָּה की बलाघाती उपस्थिति को हिन्दी की प्रत्यक्ष आज्ञा में सुरक्षित रखा गया है। बहुवचन समूह के कारण उद्धरण में स्वाभाविक रूप से ‘निकल जाओ’ आया है।
- source_word: וְכָל הָעָם אֲשֶׁר בְּרַגְלֶיךָ
  choice: तेरे पीछे चलनेवाले सभी लोग
  rationale: शाब्दिक ‘तेरे पैरों पर/पास’ एक मुहावरा है, जिसका आशय साथ चलने या अनुसरण करनेवाले लोगों से है; हिन्दी में अर्थ स्पष्ट किया गया है।
- source_word: וְאַחֲרֵי כֵן אֵצֵא
  choice: इसके बाद मैं निकल जाऊँगा
  rationale: कालक्रम और יצא की पुनरावृत्ति दोनों को स्पष्ट और स्वाभाविक हिन्दी में रखा गया है।
- source_word: וַיֵּצֵא מֵעִם פַּרְעֹה
  choice: फिर मूसा ... फ़िरौन के पास से निकल गया
  rationale: इब्रानी में निहित कर्ता को अस्पष्टता से बचाने के लिए प्रसंगानुसार मूसा के रूप में व्यक्त किया गया है; מֵעִם का संबंध ‘के पास से’ से सुरक्षित है।
- source_word: בָּחֳרִי אָף
  choice: धधकते क्रोध में
  rationale: यह क्रोध की तपिश और तीव्रता के इब्रानी रूपक को जीवंत, गरिमापूर्ण आधुनिक हिन्दी में बनाए रखता है।
