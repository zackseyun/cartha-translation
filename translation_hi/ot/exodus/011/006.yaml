    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: मचेगी
  rationale: भविष्यसूचक प्रसंग में यह क्रिया भविष्य का बोध कराती है। हिन्दी में ‘चीख-पुकार मचेगी’ स्वाभाविक है और घटना के घटित होने का भाव स्पष्ट करती है।
- source_word: צְעָקָה
  choice: चीख-पुकार
  rationale: यह संज्ञा संकट या दुःख से निकली ऊँची पुकार को दर्शाती है। ‘चीख-पुकार’ आधुनिक हिन्दी में उसके सामूहिक और व्यथापूर्ण स्वर को व्यक्त करती है।
- source_word: גְדֹלָה
  choice: बड़ी
  rationale: यह विशेषण पुकार की अत्यधिक तीव्रता और व्यापकता बताता है। ‘बड़ी’ मूल इब्रानी अभिव्यक्ति के निकट और सहज है।
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: पूरे मिस्र देश में
  rationale: यह वाक्यांश समूचे मिस्री भूभाग में घटना के व्यापक विस्तार को व्यक्त करता है।
- source_word: אֲשֶׁר כָּמֹהוּ לֹא נִהְיָתָה
  choice: जैसी न पहले कभी मची
  rationale: स्त्रीलिंग तुलना ‘चीख-पुकार’ की ओर लौटती है। ‘मची’ हिन्दी में ऐसी सामूहिक पुकार के घटित होने के लिए स्वाभाविक है।
- source_word: וְכָמֹהוּ לֹא תֹסִף
  choice: और न फिर कभी मचेगी
  rationale: निषेध के साथ יסף का भाव दोबारा न होने का है। यह अनुवाद भविष्य में उसकी पूर्णतः अनुपम प्रकृति बनाए रखता है।
