  text: And there will be a great cry throughout all the land of Egypt[a], such as has never happened before, nor will ever happen again.
translation:
  language: hi
  text: और पूरे मिस्र देश में ऐसी बड़ी चीख-पुकार[a] मचेगी, जैसी न पहले कभी मची और न फिर कभी मचेगी।
  philosophy: optimal-equivalence
  footnotes:
