source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה כֹּ֖ה אָמַ֣ר יְהוָ֑ה כַּ/חֲצֹ֣ת הַ/לַּ֔יְלָה אֲנִ֥י יוֹצֵ֖א בְּ/ת֥וֹךְ מִצְרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/004.yaml
  text: 'Then Moses said[a], “Thus says Yahweh: About midnight I will go out into the midst of Egypt.”'
translation:
  language: hi
  text: 'तब मूसा ने कहा, “याहवे यों कहता है: ‘लगभग[a] आधी रात को मैं मिस्र के बीचों-बीच निकलूँगा।’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आधी रात को।” इब्रानी पद में लगा उपसर्ग समय के अनुमान या निकटता का भाव दे सकता है; इसलिए “लगभग आधी रात को।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमवाचक कथा को आगे बढ़ाता है; आधुनिक हिन्दी में ‘तब’ उसके क्रमिक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מֹשֶׁה
  choice: मूसा
  rationale: इस व्यक्ति-नाम का मानक हिन्दी बाइबलीय रूप।
- source_word: כֹּה אָמַר
  choice: यों कहता है
  rationale: भविष्यद्वक्ताओं के संदेशवाहक-सूत्र का स्वाभाविक और गरिमापूर्ण हिन्दी रूप; रूप की दृष्टि से पूर्ण क्रिया होने पर भी सूत्र में वर्तमान काल उपयुक्त है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार-अक्षरीय ईश्वरीय नाम को उपाधि से बदलने के बजाय हिन्दी में उसके प्रचलित निकट लिप्यंतरण से रखा गया है।
- source_word: כַּחֲצֹת הַלַּיְלָה
  choice: लगभग आधी रात को
  rationale: उपसर्ग כ यहाँ समय की निकटता या अनुमान व्यक्त कर सकता है; ‘लगभग’ इस सूक्ष्मता को सुरक्षित रखता है।
- source_word: אֲנִי
  choice: मैं
  rationale: मूल में स्पष्ट प्रथम-पुरुष सर्वनाम है, जो कर्ता पर बल देता है।
- source_word: יוֹצֵא
  choice: निकलूँगा
  rationale: कृदंत यहाँ निकट भविष्य की घोषित क्रिया व्यक्त करता है; ‘निकलूँगा’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: בְּתוֹךְ
  choice: बीच से होकर
  rationale: यह रूप मिस्र के भीतर और उसके मध्य से होने वाली गति को स्वाभाविक हिन्दी में व्यक्त करता है; केवल स्थिर स्थान का बोध नहीं देता।
- source_word: מִצְרָיִם
  choice: मिस्र
  rationale: स्थान-नाम का मानक हिन्दी रूप।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु; यहोवा
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम सीधे आया है। उसका लिप्यंतरण नाम को बनाए रखता है और उसे किसी उपाधि से नहीं बदलता।
- issue: כַּחֲצֹת הַלַּיְלָה का समय-संबंधी अर्थ
  choice: लगभग आधी रात को
  alternative: आधी रात को
  rationale: उपसर्ग כ अनुमान या निकटता सूचित कर सकता है। ‘लगभग’ उस वास्तविक भाषिक संभावना को बनाए रखता है और अनावश्यक सटीकता नहीं जोड़ता।
- issue: בְּתוֹךְ מִצְרָיִם के साथ गति की दिशा
  choice: मिस्र के बीच से होकर निकलूँगा
  alternative: मिस्र के बीच में निकलूँगा; मिस्र के भीतर जाऊँगा
  rationale: יוֹצֵא और בְּתוֹךְ का मेल भीतर/मध्य में सक्रिय गति को दर्शाता है। हिन्दी में ‘बीच से होकर निकलूँगा’ उस गति को स्पष्ट और स्वाभाविक रखता है, बिना किसी अतिरिक्त धर्मवैज्ञानिक निष्कर्ष के।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। प्रत्यक्ष वचन के भीतर याहवे के संदेश को अलग उद्धरण-चिह्नों में रखा गया है। ‘यों कहता है’ संदेशवाहक-सूत्र की औपचारिकता बनाए रखता है।
