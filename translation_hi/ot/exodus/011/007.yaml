source:
  edition: WLC
  text: וּ/לְ/כֹ֣ל בְּנֵ֣י יִשְׂרָאֵ֗ל לֹ֤א יֶֽחֱרַץ כֶּ֨לֶב֙ לְשֹׁנ֔/וֹ לְ/מֵ/אִ֖ישׁ וְ/עַד בְּהֵמָ֑ה לְמַ֨עַן֙ תֵּֽדְע֔וּ/ן אֲשֶׁר֙ יַפְלֶ֣ה יְהוָ֔ה בֵּ֥ין מִצְרַ֖יִם וּ/בֵ֥ין יִשְׂרָאֵֽל׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/007.yaml
  text: But against any of the sons of Israel[a], not a dog will sharpen its tongue, from man to beast, so that you may know that Yahweh makes a distinction between Egypt and Israel.
translation:
  language: hi
  text: पर इस्राएलियों के बीच, मनुष्य से लेकर पशु तक, किसी के विरुद्ध भी कोई कुत्ता अपनी जीभ पैनी नहीं करेगा।[a] ताकि तुम जानो कि याहवे मिस्र और इस्राएल के बीच भेद करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके विरुद्ध कोई कुत्ता भौंकेगा तक नहीं।” यह मुहावरा इस्राएल के लिए पूरी शांति और सुरक्षा प्रकट करता है।
    reason: शाब्दिक चित्र ‘जीभ पैनी करना’ आधुनिक पाठक के लिए अस्पष्ट हो सकता है; पादटिप्पणी उसका प्रसंगगत मुहावरेदार अर्थ देती है।
lexical_decisions:
- source_word: וּלְכֹל בְּנֵי יִשְׂרָאֵל
  choice: पर इस्राएलियों में ... किसी के विरुद्ध
  rationale: וְ यहाँ पिछले कथन के विपरीत स्थिति प्रस्तुत करता है। בְּנֵי יִשְׂרָאֵל का स्वाभाविक और समावेशी आधुनिक हिन्दी रूप ‘इस्राएली’ है; לְ का विरोधात्मक भाव ‘किसी के विरुद्ध’ से स्पष्ट किया गया है।
- source_word: לֹא יֶחֱרַץ כֶּלֶב לְשֹׁנוֹ
  choice: कोई कुत्ता अपनी जीभ पैनी नहीं करेगा
  rationale: मुख्य पाठ में इब्रानी का सजीव और असामान्य चित्र सुरक्षित रखा गया है। इसका प्रसंगगत आशय कुत्ते के भौंकने या गुर्राने तक का न होना है, जिसे पादटिप्पणी में स्पष्ट किया गया है।
- source_word: לְמֵאִישׁ וְעַד בְּהֵמָה
  choice: मनुष्य से लेकर पशु तक
  rationale: यह युग्म संपूर्ण दायरा व्यक्त करता है और बताता है कि सुरक्षा मनुष्यों और पशुओं दोनों तक फैली है।
- source_word: לְמַעַן תֵּדְעוּן
  choice: ऐसा इसलिए होगा कि तुम जान लो
  rationale: उद्देश्य-सूचक לְמַעַן को स्वाभाविक हिन्दी में व्यक्त किया गया है; बहुवचन संबोधन ‘तुम’ बनाए रखा गया है।
- source_word: יַפְלֶה
  choice: भेद करता है
  rationale: इस प्रसंग में हिफ़ील रूप का अर्थ मिस्र और इस्राएल को अलग ठहराना या उनके साथ अलग व्यवहार करना है, न कि केवल कोई अद्भुत काम करना।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिगत नाम को पदवी से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: בֵּין מִצְרַיִם וּבֵין יִשְׂרָאֵל
  choice: मिस्र और इस्राएल के बीच
  rationale: दोनों राष्ट्रीय नामों और उनके बीच के स्पष्ट विरोध को स्रोत के अनुरूप रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। ‘याहवे’ उसका व्यापक रूप से स्वीकृत विद्वतापूर्ण लिप्यंतरण है; ‘यहोवा’ प्रचलित वैकल्पिक हिन्दी रूप है।
- issue: יַפְלֶה में ईश्वरीय कार्य का स्वरूप
  choice: मिस्र और इस्राएल के बीच भेद करता है
  alternative: मिस्र और इस्राएल को अलग ठहराता है
  rationale: यहाँ बल दोनों समुदायों के अलग परिणाम पर है। अनुवाद इस भेद को स्पष्ट करता है, पर उसके पीछे की धार्मिक व्यवस्था या कारण को पाठ से अधिक विशिष्ट नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘इस्राएलियों’ का प्रयोग ‘इस्राएल के पुत्रों’ की अपेक्षा अधिक स्वाभाविक है। मुख्य पाठ में इब्रानी मुहावरे का सजीव चित्र रखा गया है और उसकी व्याख्या पादटिप्पणी में दी गई है।
