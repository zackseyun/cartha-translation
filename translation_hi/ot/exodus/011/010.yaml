  text: וּ/מֹשֶׁ֣ה וְ/אַהֲרֹ֗ן עָשׂ֛וּ אֶת כָּל הַ/מֹּפְתִ֥ים הָ/אֵ֖לֶּה לִ/פְנֵ֣י פַרְעֹ֑ה וַ/יְחַזֵּ֤ק יְהוָה֙ אֶת לֵ֣ב פַּרְעֹ֔ה וְ/לֹֽא שִׁלַּ֥ח אֶת בְּנֵֽי יִשְׂרָאֵ֖ל מֵ/אַרְצֽ/וֹ־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/010.yaml
  text: And Moses and Aaron did all these signs before Pharaoh[a], and Yahweh hardened Pharaoh’s heart[c][b], and he did not let the sons of Israel go out from his land.
translation:
  language: hi
  text: मूसा और हारून ने फ़िरौन के सामने ये सारे चिन्ह[a] दिखाए, और याहवे ने फ़िरौन का हृदय कठोर कर दिया[b], और फ़िरौन ने इस्राएल के पुत्रों[c] को अपने देश से जाने नहीं दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ये सारे अद्भुत काम।” इब्रानी शब्द चमत्कारी चिन्हों या अद्भुत कामों—दोनों को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “फ़िरौन के हृदय को दृढ़ कर दिया” अथवा “मज़बूत कर दिया।”
    reason: lexical_alternative
  - marker: c
    text: या “इस्राएलियों” अथवा “इस्राएल की संतान।” शाब्दिक रूप से, “इस्राएल के पुत्रों”; यहाँ यह पूरी प्रजा के लिए सामूहिक पदबंध है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: मूसा और हारून
  rationale: दोनों व्यक्तिनामों के प्रचलित और सहज हिन्दी रूप।
- source_word: עָשׂוּ אֶת כָּל הַמֹּפְתִים הָאֵלֶּה
  choice: ये सारे चिन्ह दिखाए
  rationale: מוֹפֵת चमत्कारी और प्रमाणसूचक कार्य को दर्शाता है। हिन्दी में ‘चिन्ह दिखाए’ यहाँ ‘चिन्ह किए’ से अधिक स्वाभाविक है, जबकि मूल की अर्थगत दिशा बनाए रखता है। ‘अद्भुत काम’ भी संभव है और पादटिप्पणी में दिया गया है।
- source_word: לִפְנֵי פַרְעֹה
  choice: फ़िरौन के सामने
  rationale: לִפְנֵי का सीधा, स्वाभाविक स्थानवाचक हिन्दी रूप।
- source_word: וַיְחַזֵּק
  choice: कठोर कर दिया
  rationale: חזק का मूल बिंब मजबूत या दृढ़ करने का है; फ़िरौन के हृदय वाले निर्गमन-वृत्तांत में ‘कठोर कर दिया’ उसके अडिग विरोध को स्वाभाविक हिन्दी में व्यक्त करता है। अधिक शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार-अक्षरीय ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में रखा गया है।
- source_word: לֵב פַּרְעֹה
  choice: फ़िरौन का हृदय
  rationale: इब्रानी संबंधवाचक संरचना का सीधा हिन्दी रूप; ‘हृदय’ मूल के रूपक को सुरक्षित रखता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: मूल पदबंध का निकट रूप, जो सामूहिक रूप से इस्राएली प्रजा को सूचित करता है।
- source_word: וְלֹא שִׁלַּח ... מֵאַרְצוֹ
  choice: और फ़िरौन ने ... अपने देश से जाने नहीं दिया
  rationale: שׁלח का यहाँ प्रसंगानुकूल अर्थ रिहा करके जाने देना है। अस्पष्टता से बचने के लिए हिन्दी में कर्ता ‘फ़िरौन’ दोहराया गया है; ‘अपने देश’ उसी को संदर्भित करता है।
theological_decisions:
- issue: फ़िरौन के हृदय पर याहवे की क्रिया
  choice: याहवे ने फ़िरौन का हृदय कठोर कर दिया
  alternative: याहवे ने फ़िरौन के हृदय को दृढ़ कर दिया
  rationale: मुख्य पाठ प्रसंग में उत्पन्न अड़ियल प्रतिरोध को स्पष्ट करता है, पर पादटिप्पणी חזק के ‘दृढ़/मजबूत करने’ वाले मूल बिंब को बनाए रखती है। ईश्वरीय सार्वभौमता और फ़िरौन की जिम्मेदारी के बीच तनाव को समझाकर समाप्त नहीं किया गया।
- issue: בְּנֵי יִשְׂרָאֵל का सामूहिक अर्थ
  choice: इस्राएल के पुत्रों
  alternative: इस्राएली; इस्राएल की संतान
  rationale: मुख्य पाठ इब्रानी के पुरुषवाचक बहुवचन रूप को बनाए रखता है, जबकि पादटिप्पणी स्पष्ट करती है कि पदबंध पूरी इस्राएली प्रजा के लिए सामूहिक संज्ञा के रूप में प्रयुक्त है।
- issue: ईश्वरीय नाम יְהוָה
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम है; इसलिए उसे उपाधि में बदलने के बजाय लिप्यंतरित किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, कथात्मक शैली रखी गई है। ‘फिर भी’ इब्रानी के सामान्य वाव को प्रसंगगत परिणाम-विरोध के रूप में कुछ अधिक स्पष्ट करता है; यदि संयोजक की अधिक औपचारिक समानता वांछित हो तो केवल ‘और’ रखा जा सकता है। ‘हृदय कठोर कर दिया’ परिचित बाइबिलीय अभिव्यक्ति है, पर अत्यधिक संस्कृतनिष्ठ नहीं।
