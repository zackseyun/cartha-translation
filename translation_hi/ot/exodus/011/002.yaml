base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/002.yaml
  text: Speak now in the hearing of the people[a], and let each man ask from his neighbor, and each woman from her neighbor, for articles of silver and articles of gold.
translation:
  language: hi
  text: अब लोगों के सुनते हुए यह कह कि हर पुरुष अपने पड़ोसी से और हर स्त्री अपनी पड़ोसिन से चाँदी और सोने की वस्तुएँ माँगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उधार माँगे।” इब्रानी क्रिया का अर्थ “माँगना” या “निवेदन करना” है; वह अपने आप यह नहीं बताती कि वस्तुएँ लौटाई जानी थीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֶּר נָא
  choice: अब ... कह
  rationale: आज्ञार्थक क्रिया और נָא की तात्कालिकता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; यहाँ ‘कृपया’ ईश्वरीय आदेश को अनावश्यक रूप से विनयपूर्ण बना सकता है।
- source_word: בְּאָזְנֵי הָעָם
  choice: लोगों के सुनते हुए
  rationale: ‘लोगों के कानों में’ के शाब्दिक मुहावरे का आशय है कि बात उन्हें सुनाई देकर कही जाए; यह रूप अर्थ और इब्रानी चित्र दोनों को पर्याप्त रूप से रखता है।
- source_word: וְיִשְׁאֲלוּ
  choice: माँगे
  rationale: जुस्सिव निर्देश को हिन्दी के आज्ञार्थक रूप में व्यक्त किया गया है। שאל का मूल अर्थ माँगना/निवेदन करना है; लौटाने की बाध्यता इसमें स्वयं निहित नहीं है।
- source_word: אִישׁ מֵאֵת רֵעֵהוּ
  choice: हर पुरुष अपने पड़ोसी से
  rationale: वितरणात्मक पुल्लिंग एकवचन तथा उसके बाद आने वाले स्त्रीलिंग समानांतर को सुरक्षित रखता है। רֵעַ के व्यापक सामाजिक अर्थ के लिए ‘पड़ोसी’ उपयुक्त है।
- source_word: וְאִשָּׁה מֵאֵת רְעוּתָהּ
  choice: हर स्त्री अपनी पड़ोसिन से
  rationale: इब्रानी में स्त्री और उसकी स्त्री-सहचरी/पड़ोसिन का स्पष्ट स्त्रीलिंग समानांतर है; ‘पड़ोसिन’ उसे स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב
  choice: चाँदी और सोने की वस्तुएँ
  rationale: כְּלִי व्यापक शब्द है, जो पात्र, सामान या अन्य निर्मित वस्तुओं को सूचित कर सकता है; ‘वस्तुएँ’ आभूषण या पात्र जैसा अनावश्यक विशेषीकरण नहीं करता।
theological_decisions:
- issue: मिस्रियों से मूल्यवान वस्तुएँ लेने के प्रसंग में שאל का अनुवाद
  choice: माँगे
  alternative: उधार माँगे
  rationale: इब्रानी क्रिया अपने आप में केवल माँगने या निवेदन करने को बताती है, वस्तुओं को बाद में लौटाने को नहीं। इसलिए मुख्य पाठ में अस्पष्टता को बनाए रखा गया है और पारंपरिक वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘कह’ मूसा को संबोधित एकवचन आदेश है। ‘पड़ोसिन’ स्त्रीलिंग समानांतर को स्पष्ट रखता है। पादटिप्पणी-चिह्न उस पूरे निर्देश से संबंधित होने के कारण वाक्य के अंत में रखा गया है।
