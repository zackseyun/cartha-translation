id: EXO.11.9
reference: Exodus 11:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה לֹא יִשְׁמַ֥ע אֲלֵי/כֶ֖ם פַּרְעֹ֑ה לְמַ֛עַן רְב֥וֹת מוֹפְתַ֖/י בְּ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/009.yaml
  text: And Yahweh said to Moses[a], “Pharaoh will not listen to you[c][b], so that my wonders may be multiplied in the land of Egypt.”
translation:
  language: hi
  text: और यहोवा ने मूसा से कहा[c], “फ़िरौन तुम लोगों की नहीं सुनेगा[a], ताकि मिस्र देश में मेरे अद्भुत चिन्ह बढ़ते जाएँ[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम लोगों की बात नहीं मानेगा।”
    reason: lexical_alternative
  - marker: b
    text: या “मेरे आश्चर्यकर्म” अथवा “मेरे चिन्ह।” इब्रानी शब्द अद्भुत कार्य, चिन्ह या शकुन का अर्थ दे सकता है।
    reason: lexical_alternative
  - marker: c
    text: कुछ अनुवाद प्रसंग के साथ कालक्रम मिलाने के लिए “यहोवा ने मूसा से कहा था” लिखते हैं; इब्रानी क्रियारूप स्वयं सामान्य कथात्मक भूतकाल है।
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबलीय परंपरा में प्रचलित रूप ‘यहोवा’ परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- source_word: וַיֹּאמֶר
  choice: ने ... कहा
  rationale: वेय्यिक्तोल रूप सामान्य कथात्मक भूतकाल है; इसलिए पूर्वपूर्ण ‘कहा था’ के बजाय सरल भूतकाल रखा गया है।
- source_word: לֹא יִשְׁמַע אֲלֵיכֶם
  choice: तुम लोगों की नहीं सुनेगा
  rationale: שׁמע אֶל का अर्थ ‘किसी की सुनना/उसकी बात मानना’ है। ‘तुम लोगों’ से इब्रानी बहुवचन प्रत्यय स्पष्ट होता है, जो प्रसंग में मूसा और हारून की ओर संकेत करता है, जबकि वचन सीधे मूसा से कहा गया है।
- source_word: לְמַעַן
  choice: ताकि
  rationale: यहाँ उद्देश्य का भाव स्वाभाविक और संक्षिप्त आधुनिक हिन्दी में व्यक्त होता है।
- source_word: רְבוֹת
  choice: बढ़ते जाएँ
  rationale: रבה का आशय संख्या या विस्तार में बढ़ना है; यह हिन्दी प्रयोग निरंतर बहुल होने का भाव सहज रूप से देता है।
- source_word: מוֹפְתַי
  choice: मेरे अद्भुत चिन्ह
  rationale: מוֹפֵת आश्चर्यजनक चिह्न, अद्भुत कार्य या शकुन को सूचित कर सकता है। ‘अद्भुत चिन्ह’ उसके चिह्नात्मक और विस्मयकारी दोनों पहलुओं को संजोता है।
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: मिस्र देश में
  rationale: यह אֶרֶץ को स्पष्ट रखते हुए स्वाभाविक हिन्दी पदबंध है।
theological_decisions:
- issue: फ़िरौन के न सुनने में ईश्वरीय उद्देश्य
  choice: ‘ताकि’ द्वारा उद्देश्य का संबंध स्पष्ट रखा गया है।
  alternative: 'इसे केवल परिणाम के रूप में अनूदित किया जा सकता है: ‘जिसके फलस्वरूप मेरे अद्भुत चिन्ह बढ़ेंगे।’'
  rationale: לְמַעַן सामान्यतः उद्देश्य व्यक्त करता है। अनुवाद फ़िरौन के इनकार और परमेश्वर के उद्देश्य के बीच पाठ में मौजूद तनाव को बनाए रखता है और कठोर किए जाने के विषय में इस पद से आगे कोई धार्मिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘तुम लोगों’ बहुवचन संबोधन को स्पष्ट करता है। सभी पादटिप्पणी-चिह्न संबंधित पदांशों के साथ मुख्य पाठ में दिए गए हैं।
