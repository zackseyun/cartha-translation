source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה ע֣וֹד נֶ֤גַע אֶחָד֙ אָבִ֤יא עַל פַּרְעֹה֙ וְ/עַל מִצְרַ֔יִם אַֽחֲרֵי כֵ֕ן יְשַׁלַּ֥ח אֶתְ/כֶ֖ם מִ/זֶּ֑ה כְּ/שַׁ֨לְּח֔/וֹ כָּלָ֕ה גָּרֵ֛שׁ יְגָרֵ֥שׁ אֶתְ/כֶ֖ם מִ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/001.yaml
  text: Then Yahweh said to Moses[a], “One more plague I will bring upon Pharaoh and upon Egypt. After that he will send you away from here. When he sends you away[b], he will surely drive you out completely from here.”
translation:
  language: hi
  text: तब याहवे ने मूसा से कहा, “मैं फ़िरौन और मिस्र पर एक और विपत्ति लाऊँगा। उसके बाद वह तुम्हें यहाँ से जाने देगा। जब वह तुम्हें जाने देगा, तो वह तुम्हें यहाँ से पूरी तरह निकाल ही देगा।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “निकाल ही देगा” के लिए इब्रानी में बलपूर्ण पुनरुक्ति है; शब्दशः, “निकालते हुए वह निकाल देगा।”
    reason: मूल भाषा की बलपूर्ण व्याकरणिक रचना स्पष्ट करना
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नामरूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: וַיֹּאמֶר
  choice: तब ... ने ... कहा
  rationale: वाव-क्रमवाचक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में उसके क्रमिक बल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עוֹד נֶגַע אֶחָד
  choice: एक और विपत्ति
  rationale: עוֹד का योगात्मक अर्थ ‘और’ से तथा נֶגַע का मिस्र पर आए दैवी प्रहार के संदर्भ में व्यापक अर्थ ‘विपत्ति’ से व्यक्त होता है।
- source_word: אָבִיא עַל פַּרְעֹה וְעַל מִצְרַיִם
  choice: फ़िरौन और मिस्र पर ... लाऊँगा
  rationale: हिफ़ील क्रिया का अर्थ ‘लाना’ है और עַל न्याय के किसी पर आने को दर्शाता है; हिन्दी में साझा परसर्ग से समानांतर संबंध स्पष्ट रहता है।
- source_word: יְשַׁלַּח אֶתְכֶם מִזֶּה
  choice: वह तुम लोगों को यहाँ से जाने देगा
  rationale: שׁלח यहाँ जाने देने अथवा विदा करने के अर्थ में है; ‘जाने देगा’ निर्गमन-संदर्भ में स्वाभाविक है और अगले, अधिक प्रबल ‘निकाल देगा’ से भेद बनाए रखता है।
- source_word: כְּשַׁלְּחוֹ
  choice: जब वह तुम्हें जाने देगा
  rationale: उपसर्ग כְּ यहाँ समयसूचक है और पूर्ववर्ती क्रिया को दोहराते हुए अगली बात से जोड़ता है।
- source_word: כָּלָה
  choice: तुम सबको ... पूरी तरह
  rationale: यहाँ כָּלָה समग्रता अथवा पूर्णता का बल देता है। ‘तुम सबको’ और ‘पूरी तरह’ मिलकर समूह की पूर्ण निकासी का अर्थ स्पष्ट करते हैं, यद्यपि शब्द का वाक्यगत संबंध कुछ कठिन है।
- source_word: גָּרֵשׁ יְגָרֵשׁ
  choice: निकाल ही देगा
  rationale: क्रियार्थक संज्ञा और अपूर्ण क्रिया की पुनरुक्ति तीव्र निश्चय प्रकट करती है; ‘ही’ उस बल को सहज हिन्दी में रखता है।
- source_word: מִזֶּה
  choice: यहाँ से
  rationale: यह मिस्र अथवा वर्तमान स्थान की ओर संकेत करता है; ‘यहाँ से’ संक्षिप्त और स्वाभाविक समतुल्य है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत चतुरक्षरीय नाम है, कोई उपाधि नहीं। हिन्दी के सामान्य बाइबिलीय प्रयोग में पहचाने जाने वाले ‘यहोवा’ को रखा गया है; ‘याहवे’ वैकल्पिक लिप्यंतरण है।
- issue: अंतिम निष्कासन का बल
  choice: निकाल ही देगा
  alternative: अवश्य निकाल देगा
  rationale: मूल की emphatic infinitive absolute रचना निश्चय और तीव्रता व्यक्त करती है; हिन्दी का ‘ही’ उस बल को बिना अतिरिक्त धार्मिक व्याख्या के संप्रेषित करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कथा-शैली। ‘तुम लोगों’ और ‘तुम सबको’ से बहुवचन संबोधन स्पष्ट किया गया है। ‘विपत्ति’ को ‘महामारी’ की अपेक्षा चुना गया ताकि נֶגַע के व्यापक अर्थ—प्रहार, चोट या क्लेश—को अनावश्यक रूप से संकीर्ण न किया जाए।
