source:
  edition: WLC
  text: וַ/יִּתֵּ֧ן יְהוָ֛ה אֶת חֵ֥ן הָ/עָ֖ם בְּ/עֵינֵ֣י מִצְרָ֑יִם גַּ֣ם הָ/אִ֣ישׁ מֹשֶׁ֗ה גָּד֤וֹל מְאֹד֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם בְּ/עֵינֵ֥י עַבְדֵֽי פַרְעֹ֖ה וּ/בְ/עֵינֵ֥י הָ/עָֽם־׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/003.yaml
  text: And Yahweh gave the people favor in the sight of the Egyptians[a]. Moreover, the man Moses was very great in the land of Egypt[d][c][b], in the sight of Pharaoh’s servants and in the sight of the people.
translation:
  language: hi
  text: और यहोवा ने लोगों को मिस्रियों की दृष्टि में अनुकूलता प्रदान की[a]। साथ ही, मूसा नामक पुरुष[b] मिस्र देश में फ़िरौन के सेवकों[c] और लोगों[d] की दृष्टि में अत्यन्त महान था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मिस्रियों की आँखों में लोगों को अनुकूलता दी।” भाव यह है कि यहोवा ने मिस्रियों को उनके प्रति अनुकूल कर दिया।
    reason: lexical_alternative
  - marker: b
    text: “मूसा नामक पुरुष” इब्रानी की बलयुक्त अभिव्यक्ति “वह पुरुष, मूसा” को व्यक्त करता है।
    reason: lexical_alternative
  - marker: c
    text: या “फ़िरौन के अधिकारियों”; इब्रानी में शाब्दिक अर्थ “फ़िरौन के सेवक” है।
    reason: lexical_alternative
  - marker: d
    text: अन्त में आए “लोग” से सम्भवतः फ़िरौन के सेवकों से अलग मिस्र का व्यापक जनसमुदाय अभिप्रेत है।
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के व्यक्तिगत नाम के प्रचलित लिप्यंतरण ‘यहोवा’ का प्रयोग किया गया है; इसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: וַיִּתֵּן ... חֵן
  choice: कृपादृष्टि की
  rationale: यह हिन्दी मुहावरा किसी के मन में अनुकूलता या सद्भाव उत्पन्न करने का सामाजिक अर्थ स्वाभाविक रूप से व्यक्त करता है; यहाँ धार्मिक अर्थ वाली ‘अनुग्रह’ शब्दावली से बचा गया है।
- source_word: הָעָם
  choice: उन लोगों
  rationale: सन्दर्भ में यह इस्राएली लोगों की ओर संकेत करता है, पर मूल पाठ केवल ‘लोग’ कहता है। ‘उन’ से पूर्ववर्ती सन्दर्भ स्पष्ट रहता है, बिना ‘इस्राएली’ जोड़ने के।
- source_word: בְּעֵינֵי מִצְרַיִם
  choice: मिस्रियों की दृष्टि में
  rationale: यह בְּעֵינֵי के दृष्टिकोण अथवा आँकलन-सूचक मुहावरे का स्वाभाविक और गरिमापूर्ण हिन्दी रूप है।
- source_word: גַּם
  choice: इसके अलावा
  rationale: यह मूसा के विषय में एक अतिरिक्त, कुछ बलयुक्त कथन जोड़ने का कार्य स्पष्ट करता है।
- source_word: הָאִישׁ מֹשֶׁה
  choice: वह पुरुष मूसा
  rationale: मूल के चिह्नित ‘पुरुष मूसा’ को बनाए रखते हुए हिन्दी में संकेतवाचक ‘वह’ वाक्यांश को स्वाभाविक बनाता है और उसके बल को सुरक्षित रखता है।
- source_word: גָּדוֹל מְאֹד
  choice: अत्यन्त महान
  rationale: यह मूसा की असाधारण प्रतिष्ठा, महत्ता या प्रभाव की व्यापकता को खुला रखता है; ‘महत्त्वपूर्ण’ या ‘सम्मानित’ अर्थ को अनावश्यक रूप से संकीर्ण कर देते।
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: मिस्र देश में
  rationale: मूल के ‘मिस्र की भूमि में’ का संक्षिप्त, स्वाभाविक हिन्दी समतुल्य है और भौगोलिक वाक्यांश को बनाए रखता है।
- source_word: עַבְדֵי פַרְעֹה
  choice: फ़िरौन के सेवकों
  rationale: ‘सेवक’ עֶבֶד का सीधा अर्थ सुरक्षित रखता है; राजकीय प्रसंग में ये अधिकारी भी हो सकते हैं, जिसे पादटिप्पणी में बताया गया है।
- source_word: וּבְעֵינֵי הָעָם
  choice: और लोगों की दृष्टि में
  rationale: मूल केवल ‘लोग’ कहता है। यह सम्भवतः फ़िरौन के सेवकों के विपरीत व्यापक मिस्री जनसमुदाय है, पर मुख्य पाठ में उस व्याख्या को निश्चित नहीं किया गया।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: व्यक्तिगत ईश्वरीय नाम को उपाधि ‘प्रभु’ से बदलने के बजाय हिन्दी में व्यापक रूप से पहचाने जाने वाले लिप्यंतरण ‘यहोवा’ से रखा गया है।
- issue: חֵן का धार्मिक या सामाजिक अर्थ
  choice: कृपादृष्टि
  alternative: अनुग्रह
  rationale: इस प्रसंग में शब्द मिस्रियों की अनुकूल भावना या सद्भाव को दर्शाता है, उद्धारशास्त्रीय ‘अनुग्रह’ को नहीं; इसलिए सामाजिक अर्थ चुना गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप अपनाया गया है। ‘कृपादृष्टि की’ हिन्दी में स्वाभाविकता देता है, जबकि पादटिप्पणी मूल इब्रानी संरचना दिखाती है। ‘वह पुरुष मूसा’ और ‘अत्यन्त महान’ मूल की चिह्नित अभिव्यक्ति तथा अर्थगत व्यापकता को सुरक्षित रखते हैं।
