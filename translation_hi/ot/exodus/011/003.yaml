- from: और यहोवा ने मिस्रियों की दृष्टि में उन लोगों पर कृपादृष्टि की[a]। इसके अलावा, वह पुरुष मूसा मिस्र देश में फ़िरौन के सेवकों[c] और लोगों की दृष्टि में अत्यन्त महान था[b][d]।
