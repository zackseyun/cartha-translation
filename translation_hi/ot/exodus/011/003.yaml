  rationale: 'मुख्य संशोधन חֵן और ‘मिस्रियों की दृष्टि में’ के संबंध को स्पष्ट करता है: यहोवा लोगों को मिस्रियों की अनुकूलता प्रदान करता है। मूसा के लिए वाक्यांश को आधुनिक, स्वाभाविक हिन्दी में सुधारा गया है, जबकि मूल इब्रानी का स्पष्ट ‘पुरुष’ बना रहता है। सभी पादटिप्पणी-चिह्न अपने संगत शब्दों पर रखे गए हैं।'
