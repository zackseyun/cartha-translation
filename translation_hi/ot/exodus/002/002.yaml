base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/002.yaml
  text: The woman became pregnant and gave birth to a son. When she saw that he was good[a], she hid him for three months.
translation:
  language: hi
  text: वह स्त्री गर्भवती हुई और उसने एक पुत्र को जन्म दिया। जब उसने देखा कि वह अच्छा[a] है, तो उसने उसे तीन महीने तक छिपाए रखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सुन्दर।” हिब्रू में “अच्छा” है, जिसका इस प्रसंग में अर्थ मनोहर या सुन्दर भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהַר
  choice: गर्भवती हुई
  rationale: हिब्रू क्रिया गर्भधारण करने या गर्भवती होने को व्यक्त करती है; यह आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: הָאִשָּׁה
  choice: वह स्त्री
  rationale: मूल पाठ में स्पष्टतः ‘स्त्री’ है; इस पद में संदर्भ से ‘उसकी पत्नी’ जोड़ना आवश्यक नहीं है।
- source_word: וַתֵּלֶד בֵּן
  choice: उसने एक पुत्र को जन्म दिया
  rationale: यह प्रसव के लिए स्वाभाविक आधुनिक हिन्दी अभिव्यक्ति है और हिब्रू वाक्यांश का अर्थ सीधे रखती है।
- source_word: וַתֵּרֶא אֹתוֹ כִּי טוֹב הוּא
  choice: जब उसने देखा कि वह अच्छा है
  rationale: ‘जब’ कथा-प्रवाह को स्वाभाविक बनाता है; ‘अच्छा’ טוֹב का सीधा अर्थ रखता और उत्पत्ति-वृत्तांत की संभावित प्रतिध्वनि बचाता है।
- source_word: וַתִּצְפְּנֵהוּ
  choice: उसने उसे ... छिपाए रखा
  rationale: क्रिया छिपाने या गुप्त रखने को दर्शाती है; ‘छिपाए रखा’ तीन महीने की निरंतर अवधि को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שְׁלֹשָׁה יְרָחִים
  choice: तीन महीने तक
  rationale: यֶרַח महीने, मूलतः चंद्र-मास, का द्योतक है; सामान्य कथा में ‘तीन महीने तक’ पर्याप्त और स्वाभाविक है।
theological_decisions:
- issue: शिशु के लिए טוֹב का वर्णन
  choice: अच्छा
  alternative: सुन्दर; मनोहर
  rationale: टוֹב का मूल और व्यापक अर्थ ‘अच्छा’ है। इसे मुख्य पाठ में रखने से संभावित सृष्टि-संबंधी साहित्यिक प्रतिध्वनि बनी रहती है और पाठ को केवल रूप-सौन्दर्य तक सीमित नहीं किया जाता; प्रासंगिक सौन्दर्यपरक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘वह स्त्री’ मूल की स्पष्ट संज्ञा को बनाए रखता है, और ‘छिपाए रखा’ अवधि के भाव को बोलचाल से अधिक परिष्कृत किन्तु सामान्य हिन्दी में व्यक्त करता है।
