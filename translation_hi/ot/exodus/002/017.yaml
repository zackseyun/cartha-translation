base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/017.yaml
  text: Then the shepherds came and drove them away[a], but Moses stood up and saved them, and watered their flock.
translation:
  language: hi
  text: तब चरवाहे आए और उन्हें भगा दिया। लेकिन मूसा उठ खड़ा हुआ, उसने उन्हें बचाया[a] और उनके झुंड को पानी पिलाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्हें छुड़ाया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: तब ... आए
  rationale: वाव-क्रमिक क्रिया कथा को आगे बढ़ाती है; आधुनिक हिन्दी में “तब” घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הָרֹעִים
  choice: चरवाहे
  rationale: רעה का कृदन्त यहाँ पशुओं के झुंड चराने वालों के लिए संज्ञा के रूप में प्रयुक्त है; “चरवाहे” सहज और प्रसंगानुकूल है।
- source_word: וַיְגָרְשׁוּם
  choice: उन्हें वहाँ से भगा दिया
  rationale: גרש बलपूर्वक हटाने या खदेड़ने का भाव रखता है। “वहाँ से भगा दिया” विरोधी कार्रवाई को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיָּקָם
  choice: उठ खड़ा हुआ
  rationale: קום यहाँ मूसा की तत्काल और निर्णायक प्रतिक्रिया दिखाता है; “उठ खड़ा हुआ” शारीरिक उठने और हस्तक्षेप करने, दोनों का भाव बनाए रखता है।
- source_word: וַיּוֹשִׁעָן
  choice: उन्हें बचाया
  rationale: ישׁע का हिफ़ील रूप बचाने या छुड़ाने का प्रबल अर्थ देता है। “बचाया” इसे केवल सहायता करने तक सीमित नहीं करता, जबकि प्रसंग में चरवाहों के दुर्व्यवहार से रक्षा अभिप्रेत है।
- source_word: וַיַּשְׁקְ
  choice: पानी पिलाया
  rationale: שקה का अर्थ पानी देना या पिलाना है; पशुओं के संदर्भ में “पानी पिलाया” आधुनिक हिन्दी में स्वाभाविक है।
- source_word: צֹאנָם
  choice: उनके झुंड
  rationale: צאן भेड़-बकरियों जैसे छोटे पालतू पशुओं का सामूहिक शब्द है। “झुंड” सामूहिक अर्थ बनाए रखता है और किसी एक पशु-प्रजाति को अनावश्यक रूप से निश्चित नहीं करता।
theological_decisions:
- issue: וַיּוֹשִׁעָן में बचाव की शक्ति
  choice: उन्हें बचाया
  alternative: उनकी सहायता की
  rationale: कमज़ोर विकल्प “सहायता की” के बजाय मूल क्रिया के बचाने/छुड़ाने के अर्थ को रखा गया है; इससे किसी विशेष धार्मिक अर्थ को प्रसंग पर आरोपित नहीं किया जाता।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। “लेकिन” विरोध का स्वाभाविक संकेत देता है, और “उठ खड़ा हुआ” मूसा की निर्णायक प्रतिक्रिया को बोलचाल की हल्काई के बिना व्यक्त करता है। पादटिप्पणी का चिह्न उसी क्रिया के बाद रखा गया है जिससे उसका वैकल्पिक अनुवाद संबंधित है।
