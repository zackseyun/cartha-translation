base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/010.yaml
  text: When the child grew[a], she brought him to Pharaoh’s daughter, and he became her son. She named him Moses, for she said[b], “I drew him out of the water.”
translation:
  language: hi
  text: जब बच्चा बड़ा हुआ, तब उसकी माँ उसे फ़िरौन की बेटी के पास ले गई, और वह उसका बेटा बन गया।[a] उसने उसका नाम मूसा रखा,[b] क्योंकि उसने कहा, “मैंने उसे पानी में से खींच निकाला।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह उसके लिए बेटे के समान हो गया।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में ‘मूसा’ नाम की ध्वनि उस अभिव्यक्ति से मिलती-जुलती है जिसका अर्थ है “मैंने उसे खींच निकाला।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִגְדַּל
  choice: बड़ा हो गया
  rationale: यहाँ גדל बच्चे के आयु और परिपक्वता में बढ़ने को व्यक्त करता है, न कि पद या महत्त्व में महान होने को।
- source_word: הַיֶּלֶד
  choice: बच्चा
  rationale: יֶלֶד का अर्थ ‘बच्चा’ या ‘लड़का’ हो सकता है; शैशवावस्था के निकट संदर्भ में ‘बच्चा’ अधिक स्वाभाविक और व्यापक है।
- source_word: וַתְּבִאֵהוּ
  choice: वह उसे ... के पास ले गई
  rationale: בוא के हिफ़ील रूप का सामान्य अर्थ ‘ले आना/ले जाना’ है। हिंदी में गंतव्य के साथ ‘के पास ले गई’ स्वाभाविक है; स्त्रीलिंग कर्ता पिछले संदर्भ की बच्चे की माँ है।
- source_word: לְבַת פַּרְעֹה
  choice: फ़िरौन की बेटी के पास
  rationale: यह संबंध-सूचक इब्रानी संरचना को सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: וַיְהִי לָהּ לְבֵן
  choice: वह उसका बेटा बन गया
  rationale: यह इब्रानी पदबंध वास्तविक पुत्र-संबंध स्थापित होने को बताता है, पर किसी औपचारिक कानूनी प्रक्रिया का विवरण नहीं देता।
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: उसने उसका नाम ... रखा
  rationale: इब्रानी नामकरण-सूत्र का यह स्वाभाविक हिंदी रूप है।
- source_word: מֹשֶׁה
  choice: मूसा
  rationale: यह नाम का हिंदी बाइबल-परंपरा में प्रचलित और व्यापक रूप है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह नाम रखे जाने का कारण प्रस्तुत करता है।
- source_word: מִן הַמַּיִם
  choice: पानी में से
  rationale: शाब्दिक अर्थ ‘पानी से/में से’ है; बचाकर बाहर निकालने के प्रसंग में ‘पानी में से’ सहज हिंदी है।
- source_word: מְשִׁיתִהוּ
  choice: मैंने उसे ... खींच निकाला है
  rationale: यह משה धातु के ‘खींचकर बाहर निकालना’ अर्थ को स्पष्ट करता और नाम के साथ इब्रानी शब्द-साम्य को यथासंभव बनाए रखता है।
theological_decisions:
- issue: וַיְהִי לָהּ לְבֵן में मूसा और फ़िरौन की बेटी के संबंध का स्वरूप
  choice: वह उसका बेटा बन गया
  alternative: वह उसके लिए बेटे के समान हो गया
  rationale: मूल पाठ पुत्र का वास्तविक कथात्मक दर्जा व्यक्त करता है, जबकि औपचारिक दत्तक-विधान का उल्लेख नहीं करता। मुख्य पाठ में मजबूत पुत्र-संबंध रखा गया है और हल्का वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘वह’ स्त्रीलिंग क्रिया ‘ले गई’ के साथ पिछले संदर्भ में मूसा की माँ की ओर संकेत करता है। नाम-संबंधी इब्रानी शब्द-क्रीड़ा हिंदी मुख्य पाठ में पूरी तरह पुनरुत्पादित नहीं हो सकती, इसलिए उसे पादटिप्पणी में स्पष्ट किया गया है।
