  yaml_path: translation/ot/exodus/002/016.yaml
  text: The priest of Midian had seven daughters[b][a], and they came and drew water and filled the troughs to water their father's flock.
translation:
  language: hi
  text: मिद्यान के याजक[a] की सात बेटियाँ थीं। वे आईं, उन्होंने पानी खींचा[b] और अपने पिता की भेड़-बकरियों को पानी पिलाने के लिए हौद भर दिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मिद्यान के एक याजक।’ इब्रानी में यह पदबंध किसी विशिष्ट याजक या मिद्यान से जुड़े याजकों में से एक—दोनों अर्थ दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘पानी खींचा’ उस क्रिया का अनुवाद है जिसका अर्थ कुएँ से पानी ऊपर खींचना है।
    reason: cultural_note
lexical_decisions:
- source_word: וּלְכֹהֵן מִדְיָן
  choice: मिद्यान के याजक
  rationale: כֹהֵן का सामान्य अर्थ ‘याजक’ है और מִדְיָן के साथ इसका संबंध स्वाभाविक हिन्दी में ‘मिद्यान के’ से व्यक्त होता है। आरम्भिक וְ को अलग संयोजक से व्यक्त करना हिन्दी में आवश्यक नहीं है।
- source_word: שֶׁבַע בָּנוֹת
  choice: की सात बेटियाँ थीं
  rationale: इब्रानी का स्वामित्वसूचक नाममात्र वाक्य हिन्दी में ‘की ... थीं’ के रूप में स्वाभाविक है।
- source_word: וַתָּבֹאנָה
  choice: वे आईं
  rationale: בוא के स्त्रीलिंग बहुवचन कथात्मक रूप का सीधा और स्वाभाविक अनुवाद।
- source_word: וַתִּדְלֶנָה
  choice: उन्होंने पानी खींचा
  rationale: דלה यहाँ कुएँ जैसे जलस्रोत से पानी ऊपर खींचने को दर्शाता है; निहित कर्म ‘पानी’ स्पष्ट किया गया है।
- source_word: וַתְּמַלֶּאנָה אֶת־הָרְהָטִים
  choice: हौद भर दिए
  rationale: רְהָטִים पशुओं को पानी पिलाने के पात्र या नाँदनुमा हौद हैं; ‘हौद’ संक्षिप्त और सामान्य हिन्दी शब्द है।
- source_word: לְהַשְׁקוֹת
  choice: पानी पिलाने के लिए
  rationale: שקה का हिफ़ील रूप किसी को पीने के लिए पानी देने का अर्थ रखता है; पशुओं के संदर्भ में यह हिन्दी प्रयोग स्वाभाविक है।
- source_word: צֹאן אֲבִיהֶן
  choice: अपने पिता की भेड़-बकरियों
  rationale: צֹאן छोटे पालतू पशुओं, विशेषकर भेड़ों और बकरियों, का सामूहिक शब्द है। हिन्दी में ‘भेड़-बकरियाँ’ अर्थ को सामान्य पाठक के लिए स्पष्ट रखता है; אֲבִיהֶן को ‘अपने पिता की’ से व्यक्त किया गया है।
theological_decisions:
- issue: मिद्यान के याजक की निश्चितता
  choice: मिद्यान के याजक
  alternative: मिद्यान के एक याजक
  rationale: इब्रानी पदबंध में निश्चित उपपद नहीं है, पर संबंधसूचक संरचना किसी विशिष्ट कथात्मक पात्र की ओर संकेत कर सकती है। मुख्य पाठ में स्वाभाविक ‘मिद्यान के याजक’ रखा गया है और वास्तविक व्याकरणिक अस्पष्टता पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। स्त्रीलिंग बहुवचन को ‘वे आईं’ से स्पष्ट किया गया है। ‘भेड़-बकरियाँ’ צֹאן के सामूहिक अर्थ को केवल ‘झुंड’ की तुलना में अधिक स्पष्ट रूप से सामने लाता है।
