  yaml_path: translation/ot/exodus/002/004.yaml
  text: And his sister stood at a distance[b][a], to know what would be done to him.
translation:
  language: hi
  text: और उसकी बहन कुछ दूरी पर खड़ी रही[a], ताकि जान सके कि उसके साथ क्या किया जाएगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दूर खड़ी रही।”
    reason: lexical_alternative
  - marker: b
    text: या “ताकि पता लगा सके कि उसके साथ क्या होगा।” इब्रानी में अधिक शाब्दिक रूप से, “ताकि जान सके कि उसके साथ क्या किया जाएगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּתַצַּב
  choice: खड़ी रही
  rationale: हित्पएल रूप यहाँ किसी स्थान पर खड़े होकर बने रहने का भाव देता है। ‘खड़ी रही’ स्वाभाविक हिन्दी में उस सतत निगरानी की मुद्रा को व्यक्त करता है।
- source_word: אֲחֹתוֹ
  choice: उसकी बहन
  rationale: यह 3 पुं. एकवचन प्रत्यय सहित संज्ञा का सीधा और स्वाभाविक अनुवाद है।
- source_word: מֵרָחֹק
  choice: कुछ दूरी पर
  rationale: यह स्थानगत दूरी बताता है। ‘कुछ दूरी पर’ आधुनिक हिन्दी में स्वाभाविक है और अनिर्दिष्ट दूरी को बनाए रखता है।
- source_word: לְדֵעָה
  choice: ताकि जान सके
  rationale: लामेद सहित धातु ידע का infinitive उद्देश्य व्यक्त करता है। ‘ताकि जान सके’ हिन्दी में उद्देश्य को स्पष्ट और सहज रूप से रखता है।
- source_word: מַה
  choice: क्या
  rationale: यह आगे आने वाली अप्रत्यक्ष प्रश्नवाचक उपवाक्य की मानक हिन्दी अभिव्यक्ति है।
- source_word: יֵּעָשֶׂה
  choice: क्या किया जाएगा
  rationale: עשה का निफ़अल अपूर्ण रूप कर्मवाच्य है। ‘किया जाएगा’ उस कर्मवाच्य को सुरक्षित रखता है; केवल ‘क्या होगा’ कहना अधिक सामान्य अर्थ देता।
- source_word: לוֹ
  choice: उसके साथ
  rationale: इस संदर्भ में हिन्दी का ‘उसके साथ क्या किया जाएगा’ शिशु के प्रति होने वाली कार्रवाई को स्वाभाविक रूप से व्यक्त करता है। शाब्दिक ‘उसको’ यहाँ कम सहज होता।
