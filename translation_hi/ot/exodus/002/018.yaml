  text: When they came to Reuel their father[a], he said, “Why have you come back so quickly today?”
translation:
  language: hi
  text: जब वे अपने पिता रऊएल के पास पहुँचीं, तो उसने कहा, “आज तुम इतनी जल्दी क्यों आ गईं?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शब्दानुसार: “तुमने आज आने में इतनी जल्दी क्यों की?” इब्रानी में “जल्दी करना” क्रिया के साथ “आना” प्रयुक्त हुआ है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹאנָה
  choice: जब वे … पहुँचीं
  rationale: स्त्रीलिंग बहुवचन क्रिया पुत्रियों को सूचित करती है। प्रसंग की समयगत और क्रमिक गति को स्वाभाविक हिन्दी में दिखाने के लिए ‘जब … पहुँचीं’ चुना गया है।
- source_word: רְעוּאֵל
  choice: रऊएल
  rationale: इब्रानी नाम רְעוּאֵל का देवनागरी में निकट लिप्यंतरण।
- source_word: אֲבִיהֶן
  choice: अपने पिता
  rationale: शाब्दिक अर्थ ‘उनके पिता’ है; हिन्दी में कर्ता से संबंध स्पष्ट होने के कारण ‘अपने पिता’ अधिक स्वाभाविक है और वही संबंध व्यक्त करता है।
- source_word: וַיֹּאמֶר
  choice: उसने कहा
  rationale: אמר के सामान्य अर्थ ‘कहना’ को बनाए रखा गया है; आगे के प्रश्नचिह्न से प्रश्नवाचक आशय स्पष्ट है।
- source_word: מַדּוּעַ
  choice: क्यों
  rationale: कारण पूछने वाले इब्रानी प्रश्नवाचक क्रियाविशेषण का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: מִהַרְתֶּן בֹּא
  choice: इतनी जल्दी … आ गईं
  rationale: इब्रानी में ‘जल्दी करना’ और ‘आना’ साथ हैं। पिता के दृष्टिकोण से हिन्दी का ‘इतनी जल्दी आ गईं’ स्वाभाविक रूप से उसी आशय को व्यक्त करता है; अधिक औपचारिक संरचना पादटिप्पणी में दी गई है।
- source_word: הַיּוֹם
  choice: आज
  rationale: संदर्भ में निश्चित पद ‘उस दिन/दिन’ का मुहावरेदार अर्थ ‘आज’ है।
