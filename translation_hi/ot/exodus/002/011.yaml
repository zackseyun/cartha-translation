base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/011.yaml
  text: It happened in those days[a], when Moses had grown up, that he went out to his brothers and saw their burdens. And he saw an Egyptian man striking a Hebrew man, one of his brothers.
translation:
  language: hi
  text: उन दिनों ऐसा हुआ कि, जब मूसा बड़ा हो चुका था, वह बाहर निकलकर अपने भाइयों[a] के पास गया और उसने उन पर पड़े बोझ को देखा। उसने एक मिस्री आदमी को एक इब्री आदमी को मारते देखा—जो उसके भाइयों में से एक था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “भाइयों” का अर्थ “सगे-संबंधी” या “अपने लोग” भी हो सकता है। इब्रानी पाठ इब्रियों के साथ मूसा की एकजुटता व्यक्त करने के लिए पारिवारिक भाषा का प्रयोग करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיָּמִים הָהֵם
  choice: उन दिनों ऐसा हुआ कि
  rationale: इब्रानी कथात्मक संक्रमण-सूत्र को अर्थपूर्ण ढंग से बनाए रखता है, पर पुराने या अस्वाभाविक हिन्दी मुहावरे से बचता है।
- source_word: וַיִּגְדַּל
  choice: बड़ा हो चुका था
  rationale: संदर्भ में यह मूसा के शारीरिक रूप से वयस्क होने को दर्शाता है, प्रतिष्ठा में महान होने को नहीं; पूर्णता का भाव आगे की घटना से पहले उसकी परिपक्वता स्पष्ट करता है।
- source_word: אֶל־אֶחָיו
  choice: अपने भाइयों के पास
  rationale: मूल के पारिवारिक संबोधन को सुरक्षित रखता है और इब्रियों के साथ मूसा की आत्मीय एकता व्यक्त करता है।
- source_word: בְּסִבְלֹתָם
  choice: उनके बोझ
  rationale: शब्द का ठोस अर्थ ‘बोझ’ है और संदर्भ में उससे दमनकारी श्रम तथा उससे जुड़ी पीड़ा दोनों का संकेत मिलता है; अनुवाद किसी एक अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: אִישׁ מִצְרִי
  choice: एक मिस्री पुरुष
  rationale: दोनों पक्षों के लिए दोहराई गई इब्रानी संज्ञा אִישׁ को व्यक्त करता और अगले ‘इब्री पुरुष’ के साथ संरचनात्मक समानता बनाए रखता है।
- source_word: מַכֶּה
  choice: मार रहा था
  rationale: इब्रानी कृदंत चल रही शारीरिक हिंसा दर्शाता है; हिन्दी का अपूर्ण भूतकाल उसी जारी क्रिया को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אִישׁ עִבְרִי
  choice: एक इब्री पुरुष
  rationale: मूल में ‘मिस्री पुरुष’ के समानांतर रचना को बनाए रखता है और जातीय पहचान स्पष्ट करता है।
- source_word: מֵאֶחָיו
  choice: उसके भाइयों में से एक
  rationale: पहले आए ‘भाइयों’ से शब्दगत संबंध बनाए रखता और उस इब्री व्यक्ति को मूसा के अपने समुदाय का सदस्य बताता है।
theological_decisions:
- issue: אֶחָיו / מֵאֶחָיו के पारिवारिक संबोधन का अनुवाद
  choice: भाइयों / उसके भाइयों में से एक
  alternative: सगे-सम्बन्धियों / अपने लोगों में से एक
  rationale: मूल पाठ जानबूझकर पारिवारिक भाषा का प्रयोग करता है, जो इब्रियों के साथ मूसा की एकजुटता को उभारती है। ‘अपने लोग’ अर्थ की व्याख्या करता है, जबकि ‘भाई’ मूल रूपक और उसकी धर्मवैचारिक शक्ति दोनों को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘बाहर ... गया’ मूल क्रिया וַיֵּצֵא की दिशा को बनाए रखता है। वाक्य-विभाजन हिन्दी में स्पष्टता के लिए किया गया है, जबकि घटनाक्रम और मूल संबंध सुरक्षित हैं।
