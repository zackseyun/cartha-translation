  text: וַ/יֵּצֵא֙ בַּ/יּ֣וֹם הַ/שֵּׁנִ֔י וְ/הִנֵּ֛ה שְׁנֵֽי אֲנָשִׁ֥ים עִבְרִ֖ים נִצִּ֑ים וַ/יֹּ֨אמֶר֙ לָֽ/רָשָׁ֔ע לָ֥/מָּה תַכֶּ֖ה רֵעֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/013.yaml
  text: He went out the next day[a], and behold, two Hebrew men were fighting. And he said to the wicked one[b], “Why are you striking your companion?”
translation:
  language: hi
  text: अगले दिन वह बाहर गया, और देखा कि दो इब्री पुरुष आपस में लड़ रहे थे। उसने उस व्यक्ति से, जो दोषी था, कहा, “तुम अपने साथी को क्यों मार रहे हो?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: वह फिर बाहर गया
  rationale: יצא के क़ाल कथात्मक रूप का अर्थ ‘बाहर गया’ है। पिछले पद की घटना के बाद मूसा के दोबारा बाहर जाने का प्रसंग हिन्दी में ‘फिर’ से स्वाभाविक रूप से व्यक्त होता है।
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: अगले दिन
  rationale: शाब्दिक अर्थ ‘दूसरे दिन’ है; कथात्मक हिन्दी में ‘अगले दिन’ वही कालगत अर्थ अधिक स्वाभाविक ढंग से देता है।
- source_word: וְהִנֵּה
  choice: और देखा कि
  rationale: הִנֵּה यहाँ अचानक सामने आए दृश्य पर ध्यान खींचता है। ‘और देखा कि’ इस दृष्टिकोण और कथात्मक जीवंतता को आधुनिक हिन्दी में सहजता से व्यक्त करता है।
- source_word: שְׁנֵי אֲנָשִׁים עִבְרִים
  choice: दो इब्री पुरुष
  rationale: मूल में संख्या, पुरुषवाचक संज्ञा और जातीय पहचान तीनों स्पष्ट हैं; अनुवाद इन्हें बनाए रखता है।
- source_word: נִצִּים
  choice: आपस में लड़ रहे थे
  rationale: निफ़अल कृदंत सक्रिय पारस्परिक संघर्ष बताता है; अगले वाक्य में प्रहार का उल्लेख होने के कारण ‘लड़ रहे थे’ उपयुक्त है।
- source_word: לָרָשָׁע
  choice: दोषी व्यक्ति
  rationale: רָשָׁע का अर्थ ‘दुष्ट’ भी हो सकता है, पर इस विवाद में यह उस व्यक्ति को चिह्नित करता है जो गलत पक्ष पर है। ‘दोषी व्यक्ति’ प्रसंगगत न्याय-निर्णय को व्यक्त करता है, बिना उसके पूरे चरित्र पर अनावश्यक स्थायी निर्णय लगाए।
- source_word: לָמָּה תַכֶּה
  choice: तुम ... क्यों मार रहे हो?
  rationale: प्रश्न में अपूर्ण क्रिया चल रही या तत्काल घट रही क्रिया को सूचित कर सकती है। ‘क्यों मार रहे हो’ दृश्य के वर्तमान प्रहार को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: רֵעֶךָ
  choice: अपने साथी
  rationale: רֵעַ का अर्थ साथी, सहचर, निकटवर्ती या संगी हो सकता है। यहाँ एक इब्री पुरुष के संबंध में ‘साथी’ सहज है और बाद की विधिक भाषा को अनावश्यक रूप से आरोपित नहीं करता।
theological_decisions:
- issue: לָרָשָׁע में व्यक्ति के चरित्र और विवाद में उसकी दोषिता के बीच अर्थगत तनाव
  choice: दोषी व्यक्ति
  alternative: दुष्ट व्यक्ति / गलत करने वाला
  rationale: प्रसंग तत्काल झगड़े में गलती करने वाले व्यक्ति की पहचान करता है। ‘दोषी’ नैतिक-न्यायिक अर्थ को बनाए रखते हुए ‘दुष्ट’ की अपेक्षा स्थायी चरित्र-निर्णय को कम आरोपित करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण कथात्मक शैली। ‘इब्री’ बाइबिलीय जातीय पद के रूप में रखा गया है। मूल के הִנֵּה को कृत्रिम ‘देखो’ के बजाय दृष्टिकोण-सापेक्ष ‘और देखा कि’ से व्यक्त किया गया है।
