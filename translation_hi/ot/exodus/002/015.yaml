  yaml_path: translation/ot/exodus/002/015.yaml
  text: When Pharaoh heard this matter[a], he sought to kill Moses. But Moses fled from Pharaoh and stayed in the land of Midian[b], and he sat down by the well.
translation:
  language: hi
  text: जब फ़िरौन ने इस बात के बारे में सुना[a], तो उसने मूसा को मार डालने की कोशिश की। पर मूसा फ़िरौन से भाग गया और मिद्यान देश में रहने लगा[b]। वह उस कुएँ के पास बैठ गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “यह बात सुनी”; इसका अर्थ “इस घटना की खबर मिली” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'हिब्रू में एक ही क्रिया दो बार आई है: पहले मिद्यान में “रहने” के लिए और फिर कुएँ के पास “बैठने” के लिए।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: सुना
  rationale: שׁמע का मूल अर्थ ‘सुनना’ है; प्रसंग में इसका आशय घटना की खबर मिलने से है।
- source_word: הַדָּבָר הַזֶּה
  choice: इस घटना के बारे में
  rationale: דבר यहाँ मूसा द्वारा मिस्री को मारने की पूर्ववर्ती घटना की ओर संकेत करता है; यह हिंदी में स्वाभाविक है और बात को अनावश्यक रूप से अधिक विशिष्ट नहीं बनाता।
- source_word: וַיְבַקֵּשׁ לַהֲרֹג
  choice: मार डालने की कोशिश की
  rationale: בקש के साथ क्रिया का infinitive इच्छा, प्रयास या प्रयत्न व्यक्त कर सकता है; यहाँ ‘कोशिश की’ स्वाभाविक हिंदी में अभिप्राय और प्रयास दोनों को समेटता है।
- source_word: וַיִּבְרַח ... מִפְּנֵי
  choice: के सामने से भाग गया
  rationale: מִפְּנֵי का शाब्दिक स्थान-संबंध बनाए रखते हुए यह हिंदी में समझने योग्य है और फ़िरौन की पहुँच अथवा उपस्थिति से भागने का भाव देता है।
- source_word: וַיֵּשֶׁב בְּאֶרֶץ מִדְיָן
  choice: मिद्यान देश में रहने लगा
  rationale: ישׁב की पहली आवृत्ति यहाँ निवास करने या टिकने के अर्थ में है; ‘रहने लगा’ स्थायी बसावट को आवश्यकता से अधिक नहीं दर्शाता।
- source_word: וַיֵּשֶׁב עַל הַבְּאֵר
  choice: एक कुएँ के पास बैठ गया
  rationale: ישׁב की दूसरी आवृत्ति ठोस अर्थ ‘बैठना’ में है; עַל इस प्रसंग में ‘पास’ से स्वाभाविक रूप से व्यक्त होता है।
- source_word: הַבְּאֵר
  choice: एक कुआँ
  rationale: हिब्रू में निश्चित पदबंध है, पर कथा में कुएँ का पहली बार उल्लेख होने के कारण आधुनिक हिंदी में ‘एक कुएँ’ अधिक स्वाभाविक परिचय देता है।
- source_word: פַּרְעֹה
  choice: फ़िरौन
  rationale: राजकीय उपाधि का हिंदी में प्रचलित रूप।
- source_word: מֹשֶׁה
  choice: मूसा
  rationale: व्यक्तिनाम का हिंदी में प्रचलित बाइबलीय रूप।
- source_word: מִדְיָן
  choice: मिद्यान
  rationale: स्थाननाम का स्रोत के निकट और हिंदी में प्रचलित लिप्यंतरण।
