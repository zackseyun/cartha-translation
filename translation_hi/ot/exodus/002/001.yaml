- source_word: וַיֵּלֶךְ
  choice: गया
  rationale: הלך का सामान्य अर्थ ‘जाना’ है। इसे बनाए रखने से इब्रानी कथा में क्रियाओं का क्रम सुरक्षित रहता है।
- source_word: אִישׁ
  choice: एक पुरुष
  rationale: यहाँ אִישׁ एक अनाम वयस्क पुरुष को दर्शाता है; ‘पति’ कहना वैवाहिक परिणाम को समय से पहले जोड़ देता।
- source_word: מִבֵּית לֵוִי
  choice: लेवी के घराने का
  rationale: ‘घराना’ वंशगत परिवार या कुल का स्वाभाविक हिन्दी बोध देता है और इब्रानी ‘लेवी के घर’ की वंशावली-संबंधी छाया बनाए रखता है।
- source_word: וַיִּקַּח
  choice: अपनी पत्नी बनाया
  rationale: לקח का मूल अर्थ ‘लिया’ है, पर इस वैवाहिक संदर्भ में केवल ‘ले लिया’ आधुनिक हिन्दी में भ्रामक हो सकता है। ‘अपनी पत्नी बनाया’ विवाह का प्रसंग स्पष्ट करता है।
- source_word: בַּת לֵוִי
  choice: लेवी की एक बेटी
  rationale: शाब्दिक वंशगत अभिव्यक्ति ‘लेवी की बेटी’ को रखा गया है; इसका आशय लेवी की स्त्री वंशज है।
