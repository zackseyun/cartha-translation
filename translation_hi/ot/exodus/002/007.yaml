language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/תֹּ֣אמֶר אֲחֹת/וֹ֮ אֶל בַּת פַּרְעֹה֒ הַ/אֵלֵ֗ךְ וְ/קָרָ֤אתִי לָ/ךְ֙ אִשָּׁ֣ה מֵינֶ֔קֶת מִ֖ן הָ/עִבְרִיֹּ֑ת וְ/תֵינִ֥ק לָ֖/ךְ אֶת הַ/יָּֽלֶד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/007.yaml
  text: Then his sister said to Pharaoh’s daughter[a], “Shall I go and call a nursing woman from the Hebrew women for you, so that she may nurse the child for you?”
translation:
  language: hi
  text: तब उसकी बहन ने फ़िरौन की बेटी से कहा, “क्या मैं जाकर इब्रानी स्त्रियों में से किसी दूध पिलानेवाली स्त्री[a] को आपके लिए बुलाऊँ, ताकि वह आपके लिए बच्चे को दूध पिलाए?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इब्रानी स्त्रियों में से किसी धाय को।”
    reason: ‘दूध पिलानेवाली स्त्री’ के लिए अधिक संक्षिप्त पारंपरिक हिन्दी पद ‘धाय’ भी संभव है।
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमागत रूप कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में घटनाक्रम व्यक्त करता है।
- source_word: אֲחֹתוֹ
  choice: उसकी बहन
  rationale: पुल्लिंग एकवचन प्रत्यय का संदर्भ प्रसंग में शिशु से है; हिन्दी में भी मूल की तरह संदर्भ को अप्रकट रखा गया है।
- source_word: בַּת פַּרְעֹה
  choice: फ़िरौन की बेटी
  rationale: इब्रानी संबंध-रचना का स्वाभाविक और सीधा हिन्दी रूप।
- source_word: הַאֵלֵךְ
  choice: क्या मैं जाकर
  rationale: प्रश्नवाचक प्रथम-पुरुष अपूर्ण क्रिया यहाँ विनम्र प्रस्ताव व्यक्त करती है।
- source_word: וְקָרָאתִי
  choice: बुलाऊँ
  rationale: קרא का यहाँ अर्थ किसी को बुलाना है; ‘बुलाऊँ’ मूल से निकट और सहज है।
- source_word: אִשָּׁה מֵינֶקֶת
  choice: किसी दूध पिलानेवाली स्त्री
  rationale: शाब्दिक अर्थ ‘दूध पिलानेवाली स्त्री’ है, अर्थात ऐसी स्त्री जो शिशु को स्तनपान करा सके; यह सामान्य पाठक के लिए स्पष्ट है।
- source_word: מִן הָעִבְרִיֹּת
  choice: इब्रानी स्त्रियों में से
  rationale: מִן यहाँ किसी समूह में से चयन को दर्शाता है।
- source_word: וְתֵינִק
  choice: ताकि वह ... दूध पिलाए
  rationale: ינק का हिफ़ील रूप शिशु को स्तनपान कराने का अर्थ देता है; प्रस्ताव के बाद उद्देश्य को हिन्दी में ‘ताकि’ से स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: הַיָּלֶד
  choice: बच्चे
  rationale: יֶלֶד के सामान्य अर्थ ‘बच्चा’ को रखा गया है; प्रसंग से उसकी आयु और लिंग ज्ञात होते हैं, पर शब्द में उससे अधिक विशिष्टता नहीं जोड़ी गई।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘आपके लिए’ की पुनरावृत्ति मूल पाठ में לָךְ के दोहराव को सुरक्षित रखती है।
