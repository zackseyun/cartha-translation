source:
  edition: WLC
  text: וַ/יִּ֤פֶן כֹּה֙ וָ/כֹ֔ה וַ/יַּ֖רְא כִּ֣י אֵ֣ין אִ֑ישׁ וַ/יַּךְ֙ אֶת הַ/מִּצְרִ֔י וַֽ/יִּטְמְנֵ֖/הוּ בַּ/חֽוֹל־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/012.yaml
  text: He looked this way and that[a], and when he saw that there was no one there, he struck down the Egyptian and hid him in the sand.
translation:
  language: hi
  text: उसने इधर-उधर देखा, और जब उसने देखा कि वहाँ कोई नहीं है,[a] तब उसने उस मिस्री को मार डाला और उसे रेत में छिपा दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “कि कोई पुरुष नहीं था”; यहाँ यह वाक्यांश किसी भी व्यक्ति के उपस्थित न होने के अर्थ में हो सकता है।
    reason: इब्रानी אִישׁ के शाब्दिक रूप और उसके सम्भावित सामान्य प्रयोग—दोनों को सुरक्षित रखना।
lexical_decisions:
- source_word: וַיִּפֶן כֹּה וָכֹה
  choice: उसने इधर-उधर देखा
  rationale: פנה का मूल अर्थ ‘मुड़ना’ है, पर כֹּה וָכֹה के साथ यह चारों ओर दृष्टि डालने का भाव देता है। ‘इधर-उधर देखा’ आधुनिक हिन्दी में इस मुहावरे का स्वाभाविक और सटीक रूप है।
- source_word: וַיַּרְא כִּי אֵין אִישׁ
  choice: जब उसने देखा कि वहाँ कोई नहीं है
  rationale: אִישׁ का शाब्दिक अर्थ ‘पुरुष/मनुष्य’ है, पर इस नकारात्मक अस्तित्ववाचक प्रयोग में आशय किसी भी व्यक्ति के उपस्थित न होने से है। इसलिए ‘कोई नहीं’ सहज हिन्दी है; शाब्दिक रूप फुटनोट में सुरक्षित है।
- source_word: וַיַּךְ
  choice: मार डाला
  rationale: נכה का मूल अर्थ ‘मारना/प्रहार करना’ है। यहाँ अगले वाक्यांश में शरीर को रेत में छिपाने से घातक परिणाम स्पष्ट है; ‘मार डाला’ हिन्दी में क्रिया और उसके परिणाम दोनों को संक्षेप में व्यक्त करता है।
- source_word: הַמִּצְרִי
  choice: उस मिस्री को
  rationale: निश्चित पद הַמִּצְרִי उस पहले उल्लिखित मिस्री व्यक्ति को दर्शाता है। हिन्दी में ‘उस मिस्री को’ संदर्भ और निश्चितता दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיִּטְמְנֵהוּ
  choice: उसे ... छिपा दिया
  rationale: טמן का अर्थ ‘छिपाना/गुप्त रखना’ है। रेत का उल्लेख छिपाने की रीति स्पष्ट करता है, इसलिए ‘छिपा दिया’ मूल अर्थ के निकट है और अनावश्यक रूप से ‘दफना दिया’ नहीं कहता।
- source_word: בַּחוֹל
  choice: रेत में
  rationale: חוֹל का सामान्य अर्थ ‘रेत’ है। हिन्दी में इस संदर्भ में ‘रेत में’ स्वाभाविक है; इब्रानी निश्चित उपपद को अलग से व्यक्त करना आवश्यक नहीं।
