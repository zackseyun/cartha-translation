translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। कथात्मक क्रम बनाए रखने के लिए ‘और जब... तब’ का प्रयोग किया गया है। ‘मार डाला’ मृत्यु के प्रसंगगत रूप से स्पष्ट परिणाम को व्यक्त करता है, जबकि ‘रेत में छिपा दिया’ טמן के मूल अर्थ को बनाए रखता है।
