  yaml_path: translation/ot/exodus/002/021.yaml
  text: And Moses agreed to dwell with the man[b][a], and he gave Zipporah his daughter to Moses.
translation:
  language: hi
  text: मूसा उस पुरुष के साथ रहने को राज़ी हो गया[a], और उसने अपनी बेटी सिप्पोरा मूसा को दे दी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मूसा उस पुरुष के साथ रहने को इच्छुक हुआ।” इब्रानी क्रिया इच्छा, सहमति या संतोष का भाव व्यक्त कर सकती है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात उसने सिप्पोरा का विवाह मूसा से कर दिया।
    reason: cultural_note
lexical_decisions:
- source_word: וַיּוֹאֶל
  choice: राज़ी हो गया
  rationale: यह क्रिया इच्छा, सहमति या तत्परता व्यक्त कर सकती है। प्रसंग में ‘राज़ी हो गया’ स्वाभाविक आधुनिक हिन्दी है; ‘इच्छुक हुआ’ की सम्भावना पादटिप्पणी में रखी गई है।
- source_word: לָשֶׁבֶת
  choice: रहने
  rationale: यहाँ ישב का अर्थ बैठना नहीं, बल्कि किसी के साथ निवास करना है। ‘रहने’ सामान्य पाठक के लिए सहज और सटीक है।
- source_word: הָאִישׁ
  choice: उस पुरुष
  rationale: इब्रानी पाठ सामान्य संज्ञा ‘पुरुष’ का प्रयोग करता है। हिन्दी में प्रसंगगत निश्चितता दिखाने के लिए ‘उस पुरुष’ रखा गया है, नाम जोड़कर पाठ को स्पष्ट नहीं किया गया।
- source_word: וַיִּתֵּן
  choice: उसने ... दे दी
  rationale: मूल क्रिया का सीधा अर्थ ‘देना’ है। विवाह का आशय प्रसंग से स्पष्ट है, इसलिए मुख्य पाठ में विस्तार न करके पादटिप्पणी दी गई है।
- source_word: צִפֹּרָה
  choice: सिप्पोरा
  rationale: व्यक्तिवाचक नाम को प्रचलित हिन्दी बाइबलीय लिप्यन्तरण के अनुसार प्रस्तुत किया गया है।
- source_word: בִתּוֹ
  choice: अपनी बेटी
  rationale: सम्बन्धवाचक प्रत्यय देने वाले पुरुष की बेटी को सूचित करता है; हिन्दी में समान कर्ता के कारण ‘अपनी बेटी’ स्वाभाविक है।
- source_word: לְמֹשֶׁה
  choice: मूसा को
  rationale: לְ प्राप्तकर्ता को चिह्नित करता है। ‘पत्नी के रूप में’ का आशय अन्तर्निहित है, पर मूल पाठ में स्पष्टतः नहीं जोड़ा गया।
