base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/003.yaml
  text: But when she could no longer hide him[a], she took for him a papyrus basket and coated it with bitumen and pitch. Then she put the child in it and placed it among the reeds by the bank of the Nile.
translation:
  language: hi
  text: पर जब वह उसे और नहीं छिपा सकी, तब उसने उसके लिए पपीरस की एक टोकरी[a] ली और उस पर डामर और राल का लेप लगाया। फिर उसने बच्चे को उसमें रख दिया और उसे नील नदी के तट पर सरकंडों के बीच रख दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा ‘पपीरस का सन्दूक।’ यहाँ प्रयुक्त इब्रानी शब्द תֵּבָה वही है जो उत्पत्ति में नूह के सन्दूक के लिए आया है; इस प्रकार जल के बीच से बचाए जाने की साहित्यिक प्रतिध्वनि सुनाई देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצְּפִינוֹ
  choice: उसे और अधिक छिपाकर न रख सकी
  rationale: हिफ़ील रूप यहाँ बच्चे को छिपाए रखने का अर्थ देता है; यह वाक्यांश जारी रखी गई क्रिया और अब उसकी असमर्थता, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: תֵּבַת
  choice: टोकरी
  rationale: सन्दर्भ में यह शिशु के लिए पपीरस से बनाया गया छोटा जलरोधी पात्र है। ‘टोकरी’ आधुनिक हिन्दी में सहज है; नूह के वृत्तांत से जुड़ा ‘सन्दूक’ वाला साहित्यिक संकेत पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: גֹּמֶא
  choice: पपीरस
  rationale: यह सामान्य सरकंडे के बजाय पपीरस पौधे को सूचित करता है और मिस्री परिवेश को सटीकता से बनाए रखता है।
- source_word: וַתַּחְמְרָה בַחֵמָר
  choice: उस पर डामर ... का लेप लगाया
  rationale: क्रिया का अर्थ पोतना या लेप लगाना है और חֵמָר प्राकृतिक बिटुमेन/डामर को दर्शाता है; हिन्दी में ‘डामर का लेप’ स्पष्ट और स्वाभाविक है।
- source_word: וּבַזָּפֶת
  choice: और राल
  rationale: זֶפֶת जलरोधी बनाने वाली पिच अथवा राल-सदृश सामग्री है; ‘राल’ इसे डामर से अलग रखते हुए सामान्य पाठक के लिए बोधगम्य है।
- source_word: הַיֶּלֶד
  choice: बच्चे
  rationale: יֶלֶד का व्यापक अर्थ ‘बच्चा’ है; इससे शिशु होने का प्रसंग बना रहता है, पर शब्द के अर्थ से अधिक विशिष्टता नहीं जोड़ी जाती।
- source_word: בַּסּוּף
  choice: सरकंडों के बीच
  rationale: סוּף नदी किनारे उगने वाले सरकंडों या जलवनस्पति को दर्शाता है; ‘के बीच’ पात्र को वनस्पति में रखने की स्थिति स्पष्ट करता है।
- source_word: עַל שְׂפַת הַיְאֹר
  choice: नील नदी के तट पर
  rationale: मिस्री सन्दर्भ में יְאֹר नील नदी को सूचित करता है; ‘तट पर’ שְׂפַת का स्वाभाविक हिन्दी रूप है।
- source_word: לֹא יָכְלָה עוֹד
  choice: और अधिक ... न रख सकी
  rationale: यह मुहावरा उस सीमा को व्यक्त करता है जिसके बाद वह काम जारी रखना सम्भव नहीं रहा।
- source_word: לּוֹ
  choice: उसके लिए
  rationale: इब्रानी का दातृवाचक सर्वनाम स्पष्ट रूप से रखा गया है, जिससे पता चलता है कि पात्र बच्चे के लिए लिया गया था।
theological_decisions:
- issue: תֵּבָה के द्वारा नूह के जलपोत से साहित्यिक सम्बन्ध
  choice: मुख्य पाठ में प्रसंगानुकूल ‘टोकरी’, और पादटिप्पणी में ‘सन्दूक’ तथा उत्पत्ति का संकेत
  alternative: मुख्य पाठ में ‘सन्दूक’
  rationale: तत्काल दृश्य को सामान्य पाठक के लिए स्पष्ट रखते हुए उसी दुर्लभ इब्रानी शब्द के कारण बनने वाली जल के बीच उद्धार की साहित्यिक प्रतिध्वनि को दबाया नहीं गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किन्तु गरिमापूर्ण कथात्मक शैली। ‘पपीरस’ और ‘नील नदी’ स्रोत की वनस्पति तथा मिस्री भौगोलिक पृष्ठभूमि को सटीक रखते हैं। पादटिप्पणी-चिह्न को ‘टोकरी’ पर रखा गया है, क्योंकि वैकल्पिक अर्थ उसी शब्द से सम्बन्धित है।
