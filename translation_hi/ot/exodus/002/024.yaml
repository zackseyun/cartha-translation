  yaml_path: translation/ot/exodus/002/024.yaml
  text: God heard their groaning[a], and God remembered his covenant with Abraham, with Isaac[b], and with Jacob.
translation:
  language: hi
  text: परमेश्वर ने उनकी कराह[a] सुनी, और परमेश्वर ने अब्राहम, इसहाक और याकूब के साथ अपनी वाचा को स्मरण किया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनका कराहना।” इब्रानी संज्ञा उत्पीड़न के बीच की कराह या पीड़ा-भरी पुकार का अर्थ दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “स्मरण किया” वाचा-संबंधी भाषा है। इसका अर्थ यह नहीं कि परमेश्वर भूल गया था, बल्कि यह कि उसने अपनी वाचा के प्रति विश्वासयोग्यता के साथ ध्यान दिया।
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: सुना
  rationale: यहाँ שׁמע का सामान्य अर्थ ‘सुनना’ है; प्रसंग में इस्राएलियों की पीड़ा-भरी पुकार परमेश्वर तक पहुँचने पर बल है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: रूप की दृष्टि से यह शब्द बहुवचन है, पर यहाँ एकवचन क्रियाओं के साथ इस्राएल के एक परमेश्वर को सूचित करता है। आधुनिक गरिमापूर्ण हिन्दी में ‘परमेश्वर’ स्वाभाविक है।
- source_word: נַאֲקָתָם
  choice: उनका कराहना
  rationale: נַאֲקָה उत्पीड़न और पीड़ा से निकली कराह या व्याकुल पुकार को व्यक्त करता है। ‘कराहना’ सामूहिक और जारी पीड़ा को स्वाभाविक हिन्दी में प्रकट करता है, जबकि ‘विलाप’ अपेक्षाकृत अधिक औपचारिक और व्याख्यात्मक होता।
- source_word: וַיִּזְכֹּר
  choice: स्मरण किया
  rationale: मूल क्रिया का सीधा अर्थ ‘स्मरण करना’ है। वाचा के प्रसंग में इससे आगे होने वाली विश्वासयोग्य कार्रवाई का संकेत मिलता है, पर मुख्य पाठ में उस संकेत को व्याख्यात्मक रूप से विस्तृत नहीं किया गया।
- source_word: בְּרִיתוֹ
  choice: अपनी वाचा
  rationale: בְּרִית वाचा के लिए मानक शब्द है और प्रत्यय इसे परमेश्वर की वाचा बताता है। ‘वाचा’ इस पद की केंद्रीय वाचागत भाषा को बनाए रखता है।
- source_word: אֶת אַבְרָהָם אֶת יִצְחָק וְאֶת יַעֲקֹב
  choice: अब्राहम, इसहाक और याकूब के साथ
  rationale: दोहराए गए אֶת इन तीनों पूर्वजों को वाचा से अलग-अलग जोड़ते हैं। हिन्दी में ‘के साथ’ उस संबंध को स्पष्ट और स्वाभाविक बनाता है; नामों की सूची मूल की लय और बल को पर्याप्त रूप से सुरक्षित रखती है।
theological_decisions:
- issue: ‘परमेश्वर ने स्मरण किया’ में मानवरूपी भाषा
  choice: मुख्य पाठ में ‘स्मरण किया’ को बनाए रखा गया।
  alternative: ‘परमेश्वर ने अपनी वाचा पर कार्रवाई की’ या ‘अपनी वाचा की ओर ध्यान दिया।’
  rationale: इब्रानी पाठ साधारण मानवरूपी वाचागत भाषा का प्रयोग करता है। ‘स्मरण किया’ यह नहीं बताता कि परमेश्वर पहले भूल गया था; यह उसकी वाचा के प्रति विश्वासयोग्य रूप से मुड़ने और उसके अनुरूप कार्य करने का संकेत देता है। मुख्य पाठ में मूल अभिव्यक्ति रखकर उसके धर्मवैचारिक तनाव को अनावश्यक रूप से हल नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सहज किंतु गरिमापूर्ण रखी गई है। ‘वाचा’ जैसे केंद्रीय बाइबलीय पद को बनाए रखा गया है। मूल में ‘परमेश्वर’ की पुनरावृत्ति को भी बल और वाक्य-लय के लिए सुरक्षित रखा गया है।
