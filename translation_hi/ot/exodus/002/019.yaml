  text: וַ/תֹּאמַ֕רְןָ אִ֣ישׁ מִצְרִ֔י הִצִּילָ֖/נוּ מִ/יַּ֣ד הָ/רֹעִ֑ים וְ/גַם דָּלֹ֤ה דָלָה֙ לָ֔/נוּ וַ/יַּ֖שְׁקְ אֶת הַ/צֹּֽאן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/019.yaml
  text: They said[a], “An Egyptian man rescued us from the hand of the shepherds[b], and he even drew water for us and watered the flock.”
translation:
  language: hi
  text: उन्होंने कहा, “एक मिस्री आदमी ने हमें चरवाहों के हाथ से[a] बचाया। उसने हमारे लिए पानी भी खींचा[b] और झुंड को पानी पिलाया।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “चरवाहों के वश से”; इब्रानी में शाब्दिक अर्थ “चरवाहों के हाथ से” है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में एक ही धातु को दो रूपों में साथ रखकर इस बात पर बल दिया गया है कि उसने स्वयं उनके लिए पानी खींचा।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמַרְןָ
  choice: उन्होंने कहा
  rationale: אמר के स्त्रीलिंग बहुवचन रूप से बोलने वाली बेटियाँ हैं। हिन्दी में प्रसंग से कर्ता स्पष्ट है; आरम्भिक संयोजक וַ को अलग से ‘और’ कहना आवश्यक नहीं।
- source_word: אִישׁ מִצְרִי
  choice: एक मिस्री आदमी
  rationale: אִישׁ और מִצְרִי दोनों तत्वों को स्वाभाविक आधुनिक हिन्दी में रखा गया है।
- source_word: הִצִּילָנוּ
  choice: हमें ... बचाया
  rationale: נצל के हिफ़ील रूप का अर्थ यहाँ तत्काल शारीरिक संकट से छुड़ाना या बचाना है।
- source_word: מִיַּד הָרֹעִים
  choice: चरवाहों के हाथ से
  rationale: मूल इब्रानी की ‘हाथ से’ वाली सत्ता या पकड़ की छवि सुरक्षित रखी गई है; अर्थ स्पष्ट करने के लिए पाद-टिप्पणी दी गई है।
- source_word: וְגַם
  choice: भी
  rationale: यह कण बचाने के अतिरिक्त मूसा के अगले, अपेक्षा से बढ़कर किए गए काम पर बल देता है।
- source_word: דָּלֹה דָלָה
  choice: पानी ... खींचा
  rationale: क्रिया के infinitive absolute और finite verb का संयोजन क्रिया पर बल देता है। मुख्य पाठ में ‘भी’ और पाद-टिप्पणी मिलकर इस बल को व्यक्त करते हैं।
- source_word: וַיַּשְׁקְ אֶת הַצֹּאן
  choice: झुंड को पानी पिलाया
  rationale: שקה का हिफ़ील पशुओं को पानी पिलाने के अर्थ में है; צאן भेड़-बकरियों जैसे छोटे पशुओं का सामूहिक झुंड है, इसलिए प्रजाति अनावश्यक रूप से निश्चित नहीं की गई।
