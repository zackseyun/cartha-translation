  text: She opened it and saw him[a], the child, and behold, a boy was crying. She had compassion on him and said[c][b], “This is one of the Hebrews’ children.”
translation:
  language: hi
  text: उसने उसे खोला और उस बालक को देखा[a]—और देखो, एक लड़का रो रहा था। उसे उस पर दया आई[b], और उसने कहा, “यह इब्रानियों के बच्चों में से एक है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप में, “उसे देखा—उस बालक को।” इब्रानी पाठ पहले पुल्लिंग एकवचन प्रत्यय का प्रयोग करता है और फिर “बालक” कहकर उसकी पहचान स्पष्ट करता है।
    reason: lexical_alternative
  - marker: b
    text: या, “उसके प्रति उसके मन में करुणा उमड़ी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפְתַּח
  choice: उसने उसे खोला
  rationale: क्रिया का अर्थ ‘खोला’ है; स्त्रीलिंग कर्ता और खोली गई वस्तु संदर्भ से स्पष्ट हैं। हिन्दी में कर्म-सर्वनाम जोड़ना स्वाभाविक है।
- source_word: וַתִּרְאֵהוּ אֶת הַיֶּלֶד
  choice: और उस बालक को देखा
  rationale: क्रिया से जुड़ा पुल्लिंग एकवचन प्रत्यय ‘उसे’ है और उसके बाद ‘बालक’ उसे स्पष्ट करता है। हिन्दी में दोनों को साथ रखने पर अनावश्यक पुनरुक्ति होती, इसलिए स्पष्ट संज्ञा से पूरे आशय को व्यक्त किया गया; स्रोत की संरचना पादटिप्पणी में दी गई है।
- source_word: הַיֶּלֶד
  choice: बालक
  rationale: יֶלֶד के सामान्य अर्थ ‘बच्चा/बालक’ में यहाँ पुल्लिंग संदर्भ स्पष्ट है। ‘बालक’ गरिमापूर्ण और सहज है तथा शिशु से बड़े लड़के तक के अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: הִנֵּה दृश्य की ओर आकस्मिक और सजीव ध्यान खींचता है। ‘देखो’ आधुनिक हिन्दी में इस वाक्यगत बल को स्वाभाविक रूप से बनाए रखता है।
- source_word: נַעַר בֹּכֶה
  choice: वह लड़का रो रहा था
  rationale: נַעַר यहाँ नर शिशु का वर्णन करता है, जबकि कृदंत בֹּכֶה उस समय जारी रोने की क्रिया बताता है।
- source_word: וַתַּחְמֹל עָלָיו
  choice: उसे उस पर दया आई
  rationale: חמל על दया या करुणा की भावात्मक प्रतिक्रिया व्यक्त करता है। यह हिन्दी प्रयोग स्वाभाविक है और ‘उसे छोड़ दिया’ जैसा आगे की कार्रवाई का अर्थ नहीं जोड़ता।
- source_word: מִיַּלְדֵי הָעִבְרִים
  choice: इब्रानियों के बच्चों में से एक
  rationale: מִן यहाँ अंशवाचक है—इब्रानियों के बच्चों के समूह में से एक। यह रूप जातीय पहचान और अंशवाचक संबंध दोनों स्पष्ट रखता है।
- source_word: זֶה
  choice: यह ... है
  rationale: संकेतवाचक सर्वनाम सामने उपस्थित बालक की ओर संकेत करता है; हिन्दी में ‘यह ... है’ इसका स्वाभाविक रूप है।
