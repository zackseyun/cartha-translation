  text: וַ/תֵּ֤רֶד בַּת פַּרְעֹה֙ לִ/רְחֹ֣ץ עַל הַ/יְאֹ֔ר וְ/נַעֲרֹתֶ֥י/הָ הֹלְכֹ֖ת עַל יַ֣ד הַ/יְאֹ֑ר וַ/תֵּ֤רֶא אֶת הַ/תֵּבָה֙ בְּ/ת֣וֹךְ הַ/סּ֔וּף וַ/תִּשְׁלַ֥ח אֶת אֲמָתָ֖/הּ וַ/תִּקָּחֶֽ/הָ־־־־־
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/005.yaml
  text: Then Pharaoh’s daughter went down to bathe at the Nile[a], while her young women were walking along the bank of the Nile. She saw the basket in the midst of the reeds[c][b], and she sent her servant girl and took it.
translation:
  language: hi
  text: तब फ़िरौन की बेटी नहाने के लिए नील नदी के पास उतरी। उसकी युवतियाँ नील नदी के किनारे चल रही थीं। उसने सरकंडों के बीच वह टोकरी[a] देखी और अपनी दासी[b] को भेजा और टोकरी ले ली।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘टोकरी’ के लिए प्रयुक्त इब्रानी शब्द वही है जो उत्पत्ति 6–9 में नूह के ‘जहाज़’ के लिए प्रयुक्त हुआ है।
    reason: cross_reference
  - marker: b
    text: 'इब्रानी: ‘अपनी दासी’; परंपरागत रूप से कुछ लोग इसका अनुवाद ‘अपना हाथ’ करते हैं।'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֵּרֶד
  choice: उतरी
  rationale: ירד का दिशासूचक अर्थ ‘नीचे जाना/उतरना’ है; नदी की ओर जाने के प्रसंग में ‘उतरी’ स्वाभाविक और सटीक है।
- source_word: בַּת פַּרְעֹה
  choice: फ़िरौन की बेटी
  rationale: इब्रानी संबंधवाचक पदबंध का सहज आधुनिक हिन्दी रूप।
- source_word: לִרְחֹץ עַל הַיְאֹר
  choice: नहाने के लिए नील नदी के पास
  rationale: רחץ यहाँ नदी पर जाकर स्नान करने को दर्शाता है; על का प्रयोग स्थानवाचक है, इसलिए ‘पास’ चुना गया है।
- source_word: וְנַעֲרֹתֶיהָ
  choice: उसकी युवतियाँ
  rationale: נערות स्त्रीलिंग बहुवचन है और युवतियों को सूचित करता है; प्रसंग से उनका साथ या परिचारिका होना समझ आता है, पर मुख्य पाठ में उससे अधिक अर्थ नहीं जोड़ा गया।
- source_word: הֹלְכֹת עַל יַד הַיְאֹר
  choice: नील नदी के किनारे टहल रही थीं
  rationale: स्त्रीलिंग बहुवचन कृदंत पृष्ठभूमि में जारी क्रिया बताता है; עַל יַד का स्थानगत अर्थ ‘किनारे/पास’ है। ‘टहल रही थीं’ यहाँ चलते रहने का स्वाभाविक हिन्दी रूप है।
- source_word: הַתֵּבָה
  choice: टोकरी
  rationale: इस प्रसंग में शिशु को रखने वाला छोटा पात्र अभिप्रेत है। वही इब्रानी शब्द नूह के जहाज़ के लिए भी आता है; उस संबंध को पादटिप्पणी में रखा गया है।
- source_word: בְּתוֹךְ הַסּוּף
  choice: सरकंडों के बीच
  rationale: סוּף जल के निकट उगने वाले सरकंडों या नरकट को सूचित करता है और בְּתוֹךְ का अर्थ ‘बीच में’ है।
- source_word: וַתִּשְׁלַח אֶת אֲמָתָהּ
  choice: अपनी दासी को भेजकर
  rationale: שלח का सामान्य अर्थ ‘भेजना’ है और אֲמָה यहाँ स्त्री दासी है। यह वाक्य-विन्यास मसोरेटिक पाठ के अनुकूल है।
- source_word: וַתִּקָּחֶהָ
  choice: उसे मँगवा लिया
  rationale: स्त्रीलिंग प्रत्यय टोकरी की ओर संकेत करता है। दासी को भेजने के बाद राजकुमारी द्वारा टोकरी प्राप्त करने का आशय हिन्दी में स्वाभाविक रूप से व्यक्त होता है।
theological_decisions:
- issue: मूसा के पात्र के लिए תבה का अनुवाद
  choice: टोकरी
  alternative: जहाज़ / सन्दूक
  rationale: तत्काल प्रसंग में छोटा, सरकंडों में रखा पात्र है, इसलिए ‘टोकरी’ स्पष्ट है; नूह की कथा से शब्दगत संबंध पादटिप्पणी में सुरक्षित है।
- issue: אֲמָתָהּ की पाठगत व्याख्या
  choice: अपनी दासी
  alternative: अपना हाथ
  rationale: मसोरेटिक स्वरांकन और שלח के साथ वाक्य-विन्यास ‘उसकी दासी’ का समर्थन करते हैं। प्राचीन परंपरा में मिलने वाला ‘उसका हाथ’ विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘नील नदी’ हिन्दी में स्पष्ट पहचान देता है; ‘फ़िरौन’ प्रचलित बाइबिलीय रूप है। मुख्य पाठ में दोनों पादटिप्पणी-चिह्न [a] और [b] संबंधित शब्दों के तुरंत बाद रखे गए हैं।
