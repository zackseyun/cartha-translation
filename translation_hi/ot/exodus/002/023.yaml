base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/023.yaml
  text: It happened in those many days that the king of Egypt died[a], and the sons of Israel groaned because of the slavery and cried out[c][b], and their cry for help went up to God because of the slavery.
translation:
  language: hi
  text: उन बहुत दिनों के दौरान ऐसा हुआ कि मिस्र का राजा मर गया[a]। इस्राएल के पुत्र[b] दासता[c] के कारण कराहे और चिल्लाए; और दासता के कारण उनकी सहायता की पुकार परमेश्वर की ओर ऊपर उठी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या ‘उन बहुत दिनों में’; अधिक भावार्थपूर्ण अनुवाद: ‘बहुत समय बीतने के बाद।’'
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में ‘इस्राएल के पुत्र’; यहाँ यह पूरी इस्राएली प्रजा का सामूहिक उल्लेख है।
    reason: lexical_alternative
  - marker: c
    text: या ‘बेगार’ अथवा ‘बंधुआई’; यहाँ इब्रानी शब्द दमनकारी जबरन मजदूरी को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ऐसा हुआ
  rationale: यह कथा में एक नए घटनाक्रम का परिचय देता है। ‘ऐसा हुआ’ मूल के कथात्मक कार्य को सहज आधुनिक हिन्दी में व्यक्त करता है, बिना कोई स्पष्ट ‘अब’ जोड़े।
- source_word: בַיָּמִים הָרַבִּים הָהֵם
  choice: उन बहुत दिनों के दौरान
  rationale: यह पदबंध शाब्दिक रूप से ‘उन बहुत दिनों में’ है और एक लंबे, अनिश्चित काल को दर्शाता है। चुना हुआ रूप इसकी अवधि को बनाए रखता है; अधिक व्याख्यात्मक विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: וַיָּמָת מֶלֶךְ מִצְרַיִם
  choice: मिस्र का राजा मर गया
  rationale: मूल कथन का सीधा और स्वाभाविक हिन्दी अनुवाद।
- source_word: וַיֵּאָנְחוּ
  choice: कराह उठे
  rationale: क्रिया पीड़ा और दबाव से निकली श्रव्य कराह को व्यक्त करती है। ‘कराह उठे’ इस तीव्र दुःख को स्वाभाविक हिन्दी में प्रकट करता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्र
  rationale: यह मूल के रूप को सुरक्षित रखता है, जबकि सन्दर्भ में यह पूरी इस्राएली प्रजा का सामूहिक उल्लेख है।
- source_word: מִן הָעֲבֹדָה
  choice: दासता के कारण
  rationale: इस सन्दर्भ में עֲבֹדָה साधारण काम नहीं, बल्कि मिस्र द्वारा थोपा गया दमनकारी बेगार और दासत्व है। कारणवाचक ‘के कारण’ מִן की प्रसंगगत शक्ति को व्यक्त करता है।
- source_word: וַיִּזְעָקוּ
  choice: पुकारने लगे
  rationale: यह संकट में निकली तीव्र पुकार को दर्शाता है। मूल की तरह पुकार का कर्म स्पष्ट नहीं किया गया है।
- source_word: וַתַּעַל שַׁוְעָתָם
  choice: सहायता के लिए उनकी पुकार ... ऊपर उठी
  rationale: שַׁוְעָה सहायता पाने के लिए की गई पुकार है। ‘ऊपर उठी’ मूल के ऊर्ध्वगामी रूपक को बनाए रखता है।
- source_word: אֶל הָאֱלֹהִים
  choice: परमेश्वर की ओर
  rationale: मूल का अर्थ ‘परमेश्वर की ओर/तक’ है। यह रूप पुकार के ऊपर उठने वाले रूपक के साथ स्वाभाविक बैठता है।
- source_word: מִן הָעֲבֹדָה (दूसरा प्रयोग)
  choice: दासता के कारण
  rationale: एक ही पदबंध को दोहराकर मूल कराह और पुकार—दोनों का कारण रेखांकित करता है; हिन्दी में भी वही पुनरावृत्ति रखी गई है।
theological_decisions:
- issue: इस्राएल के उत्पीड़न में עֲבֹדָה का अर्थ
  choice: दासता
  alternative: मेहनत, सेवा, बेगार
  rationale: निर्गमन के निकटवर्ती सन्दर्भ में यह मिस्र द्वारा थोपी गई दमनकारी जबरन मजदूरी और दासत्व को दर्शाता है। ‘दासता’ स्थिति की कठोरता स्पष्ट करता है, बिना कोई अतिरिक्त धर्मवैज्ञानिक दावा जोड़े।
- issue: בְּנֵי יִשְׂרָאֵל का अनुवाद
  choice: इस्राएल के पुत्र
  alternative: इस्राएली, इस्राएल की संतान
  rationale: चुना हुआ रूप मूल के पुल्लिंग बहुवचन पदबंध को पारदर्शी ढंग से सुरक्षित रखता है। पादटिप्पणी स्पष्ट करती है कि सन्दर्भ में इससे पूरी प्रजा अभिप्रेत है।
- issue: पुकार का परमेश्वर की ओर ऊपर उठना
  choice: मूल का ऊर्ध्वगामी रूपक सुरक्षित रखा
  alternative: उनकी पुकार परमेश्वर तक पहुँची
  rationale: ‘ऊपर उठी’ पाठ की रूपकात्मक भाषा को बनाए रखता है, पर इससे परमेश्वर के स्थान या स्वरूप के विषय में कोई अतिरिक्त सिद्धान्त नहीं निकाला गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘उन बहुत दिनों के दौरान’ कुछ हद तक स्रोत-सन्निकट जानबूझकर रखा गया है, और अधिक सहज कालगत विकल्प पादटिप्पणी में दिए गए हैं। वाक्य में अर्धविराम लगातार घटित घटनाओं और अंतिम परिणाम के बीच स्पष्टता देता है।
