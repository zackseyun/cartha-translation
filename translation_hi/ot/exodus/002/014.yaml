base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/014.yaml
  text: But he said[a], “Who made you a ruler and a judge over us? Are you saying, ‘Will you kill me as you killed the Egyptian?’” Then Moses was afraid and said, “Surely the matter has become known.”
translation:
  language: hi
  text: पर उसने कहा[a], “किसने तुम्हें हमारे ऊपर शासक और न्यायाधीश नियुक्त किया? क्या तुम कह रहे हो कि तुम मुझे वैसे ही मार डालोगे, जैसे तुमने उस मिस्री को मार डाला?” तब मूसा डर गया और उसने कहा, “निश्चय ही यह बात प्रकट हो गई है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या तुम मुझे वैसे ही मार डालना चाहते हो, जैसे तुमने उस मिस्री को मार डाला?”
    reason: הַלְהָרְגֵנִי אַתָּה אֹמֵר का स्वाभाविक वैकल्पिक अर्थ, जिसमें ‘कहने’ की रचना को आशय या इरादे के रूप में समझा जाता है।
lexical_decisions:
- source_word: מִי שָׂמְךָ
  choice: किसने तुम्हें ... नियुक्त किया
  rationale: שׂים का अर्थ यहाँ अधिकार के पद पर ठहराना या नियुक्त करना है; ‘नियुक्त किया’ आधुनिक हिन्दी में चुनौती का भाव स्पष्ट रखता है।
- source_word: לְאִישׁ שַׂר וְשֹׁפֵט
  choice: शासक और न्यायी
  rationale: אִישׁ यहाँ पदसूचक संज्ञाओं के साथ प्रयोग हुआ है; हिन्दी में अलग से ‘मनुष्य’ जोड़ना अस्वाभाविक होगा। שַׂר अधिकार रखने वाले शासक और שֹׁפֵט न्याय करने वाले व्यक्ति को दर्शाता है।
- source_word: עָלֵינוּ
  choice: हमारे ऊपर
  rationale: עַל यहाँ वक्ताओं पर अधिकार का बोध कराता है।
- source_word: הַלְהָרְגֵנִי אַתָּה אֹמֵר
  choice: क्या तुम कह रहे हो, ‘क्या तुम मुझे ... मार डालोगे?’
  rationale: रूप में ‘कहना’ क्रिया को बनाए रखते हुए प्रश्न की आशयगत अनिश्चितता सुरक्षित रखी गई है; स्वाभाविक हिन्दी में भीतर का प्रश्न प्रत्यक्ष कथन के रूप में दिया गया है।
- source_word: כַּאֲשֶׁר הָרַגְתָּ אֶת־הַמִּצְרִי
  choice: वैसे ही ... जैसे तुमने उस मिस्री को मार डाला
  rationale: तुलनात्मक כַּאֲשֶׁר और निश्चित मिस्री व्यक्ति, दोनों को स्पष्ट रूप से व्यक्त करता है।
- source_word: וַיִּירָא מֹשֶׁה
  choice: तब मूसा डर गया
  rationale: कथात्मक क्रम और ירא की सीधी भावात्मक प्रतिक्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אָכֵן נוֹדַע הַדָּבָר
  choice: निश्चय ही यह बात प्रकट हो गई है
  rationale: אָכֵן मूसा के दृढ़ निष्कर्ष को और ידע का निफ़अल रूप बात के ज्ञात या उजागर हो जाने को व्यक्त करता है।
theological_decisions:
- issue: לְאִישׁ में पुल्लिंग अभिव्यक्ति
  choice: पदसूचक वाक्यांश में अलग से ‘मनुष्य’ न जोड़ना
  alternative: किसने तुम्हें एक मनुष्य, शासक और न्यायी नियुक्त किया?
  rationale: אִישׁ का शब्दार्थ पुल्लिंग है, पर इस निर्माण में वह पदसूचक संज्ञाओं से जुड़ा है। हिन्दी में ‘एक मनुष्य’ जोड़ने से अर्थ भ्रमित और वाक्य अस्वाभाविक होगा; ‘शासक और न्यायी’ प्रसंग के पुरुष व्यक्ति को बिना अनावश्यक विस्तार के सुरक्षित रखता है।
- issue: הַלְהָרְגֵנִי אַתָּה אֹמֵר की वाक्यरचनात्मक अस्पष्टता
  choice: क्या तुम कह रहे हो, ‘क्या तुम मुझे ... मार डालोगे?’
  alternative: क्या तुम मुझे ... मार डालने का इरादा रखते हो?
  rationale: चुना गया रूप אֹמֵר के ‘कहना’ अर्थ को बनाए रखता है और इरादे को अनिवार्य रूप से आरोपित नहीं करता; वैकल्पिक स्वाभाविक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण कथात्मक शैली। ‘न्यायी’ को न्याय करने वाले अधिकारी के अर्थ में और ‘उस मिस्री’ को प्रसंग में पहले उल्लिखित निश्चित व्यक्ति के लिए चुना गया है।
