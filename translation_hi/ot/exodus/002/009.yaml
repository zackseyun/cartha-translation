language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/תֹּ֧אמֶר לָ֣/הּ בַּת פַּרְעֹ֗ה הֵילִ֜יכִי אֶת הַ/יֶּ֤לֶד הַ/זֶּה֙ וְ/הֵינִקִ֣/הוּ לִ֔/י וַ/אֲנִ֖י אֶתֵּ֣ן אֶת שְׂכָרֵ֑/ךְ וַ/תִּקַּ֧ח הָ/אִשָּׁ֛ה הַ/יֶּ֖לֶד וַ/תְּנִיקֵֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/009.yaml
  text: Then Pharaoh’s daughter said to her[a], “Take this child and nurse him for me, and I will give you your wages.” So the woman took the child and nursed him.
translation:
  language: hi
  text: तब फ़िरौन की बेटी ने उससे कहा, “इस बच्चे को ले जा और मेरे लिए इसे दूध पिला[a]; मैं तुझे तेरी मज़दूरी दूँगी।” तब उस स्त्री ने बच्चे को लिया और उसे दूध पिलाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात्, “इसे अपना दूध पिला” या “इसे स्तनपान करा।”
    reason: मूल क्रिया विशेष रूप से शिशु को स्तन का दूध पिलाने का बोध कराती है; मुख्य पाठ की सामान्य अभिव्यक्ति का अधिक स्पष्ट विकल्प दिया गया है।
lexical_decisions:
- source_word: בַּת פַּרְעֹה
  choice: फ़िरौन की बेटी
  rationale: सम्बन्धसूचक पदबंध का स्वाभाविक आधुनिक हिन्दी रूप, जो वक्ता की पहचान ठीक-ठीक बनाए रखता है।
- source_word: הֵילִיכִי
  choice: ले जा
  rationale: הלכ के हिफ़ील स्त्रीलिंग एकवचन आज्ञार्थक का यहाँ आशय बच्चे को अपने साथ ले जाकर उसकी देखभाल करना है; ‘ले जा’ प्रसंगानुकूल और सहज है।
- source_word: הַיֶּלֶד הַזֶּה
  choice: इस बच्चे को
  rationale: יֶלֶד के सामान्य अर्थ ‘बच्चा’ को रखा गया है; प्रसंग से लिंग और शैशवावस्था स्पष्ट होने पर भी अनावश्यक विशिष्टीकरण नहीं किया गया।
- source_word: וְהֵינִקִהוּ לִי
  choice: और मेरे लिए इसे दूध पिला
  rationale: ינק के हिफ़ील रूप का अर्थ शिशु को स्तनपान कराना है। ‘दूध पिला’ साधारण आधुनिक हिन्दी में स्वाभाविक है, और ‘मेरे लिए’ לִי में निहित प्रतिनिधिक सेवा को व्यक्त करता है।
- source_word: וַאֲנִי אֶתֵּן אֶת שְׂכָרֵךְ
  choice: मैं तुझे इसकी मज़दूरी दूँगी
  rationale: שָׂכָר काम के बदले मिलने वाली मज़दूरी है। हिन्दी में ‘इसकी’ जोड़ने से उस सौंपे गए कार्य के बदले भुगतान का सम्बन्ध स्पष्ट और स्वाभाविक होता है।
- source_word: הָאִשָּׁה
  choice: उस स्त्री
  rationale: मूल पाठ यहाँ ‘स्त्री’ कहता है, ‘उसकी माँ’ नहीं; इसलिए पाठक को प्रसंग से ज्ञात पहचान को अनुवाद में स्पष्ट रूप से नहीं जोड़ा गया।
- source_word: וַתְּנִיקֵהוּ
  choice: और उसे दूध पिलाया
  rationale: पहले आए उसी धातु के अनुरूप सुसंगत और सहज हिन्दी अभिव्यक्ति रखी गई है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। संवाद में स्त्रीलिंग एकवचन ‘तुझे/दूँगी’ वक्ता और सम्बोधित स्त्री के अनुरूप है। मुख्य पाठ में ‘दूध पिला’ स्वाभाविकता के लिए है, जबकि पादटिप्पणी मूल क्रिया की विशिष्ट स्तनपान-संबंधी अर्थछाया स्पष्ट करती है।
