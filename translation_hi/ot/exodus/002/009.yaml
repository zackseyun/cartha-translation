  terminology: “फ़िरौन की बेटी,” “बच्चा,” “दूध पिला,” and “स्त्री” are suitable. The footnote appropriately preserves the more specific breastfeeding sense of the Hebrew verb. “अपना दूध पिला” is a valid lexical alternative, though “स्तनपान करा” is more formal.
