  text: Pharaoh’s daughter said to her, “Go.” So the young woman went and called the child’s mother.
translation:
  language: hi
  text: फ़िरौन की बेटी ने उससे कहा, “जाओ।” तब वह युवती गई और बच्चे की माँ को बुलाया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּת פַּרְעֹה
  choice: फ़िरौन की बेटी
  rationale: इब्रानी संबंधवाचक पदबंध का स्वाभाविक और निकट हिन्दी रूप।
- source_word: לֵכִי
  choice: जा
  rationale: स्त्रीलिंग एकवचन की संक्षिप्त आज्ञा है; हिन्दी में संबोधन के प्रसंग के अनुसार सीधा और स्वाभाविक रूप।
- source_word: הָעַלְמָה
  choice: वह युवती
  rationale: עַלְמָה सामान्यतः युवा स्त्री को सूचित करता है; ‘युवती’ आधुनिक और गरिमापूर्ण है तथा ‘लड़की’ की तुलना में मूल शब्द की आयु-छाया को बेहतर रखता है।
- source_word: וַתִּקְרָא אֶת אֵם הַיָּלֶד
  choice: बच्चे की माँ को बुला लाई
  rationale: קרא यहाँ बुलाने के अर्थ में है। प्रसंग और क्रम के अनुसार ‘बुला लाई’ स्वाभाविक हिन्दी कथा-प्रवाह देता है, बिना मूल घटना को बदलने के।
- source_word: הַיָּלֶד
  choice: बच्चे
  rationale: יֶלֶד का प्रसंगानुकूल सामान्य अर्थ ‘बच्चा’ है; ‘शिशु’ संभव है, पर मूल पद उससे अधिक व्यापक है।
