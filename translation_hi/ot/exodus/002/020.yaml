  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण संवादात्मक रूप। बेटियों के लिए स्त्रीलिंग बहुवचन ‘आईं’ रखा गया है। मूल के प्रश्न, आदेश और उद्देश्यसूचक वाक्य-क्रम को बनाए रखते हुए अस्वाभाविक शब्दशः अभिव्यक्ति से बचा गया है।
