  text: And he said to his daughters, “Then where is he? Why is it that you left the man? Call him, so that he may eat bread.”
translation:
  language: hi
  text: उसने अपनी बेटियों से कहा, “तो वह कहाँ है? तुम उस आदमी को क्यों छोड़ आईं? उसे बुलाओ, ताकि वह भोजन कर सके।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַיּוֹ
  choice: तो वह कहाँ है?
  rationale: प्रश्नवाचक रूप का स्वाभाविक हिन्दी अनुवाद; וְ संदर्भ में आश्चर्य और अगले प्रश्न की ओर बढ़ने का भाव देता है।
- source_word: לָמָּה זֶּה
  choice: क्यों
  rationale: इस संयुक्त प्रश्नसूचक अभिव्यक्ति का बल हिन्दी के सीधे ‘क्यों’ में स्वाभाविक रूप से व्यक्त होता है।
- source_word: עֲזַבְתֶּן
  choice: छोड़ आईं
  rationale: स्त्रीलिंग बहुवचन संबोधन और उस व्यक्ति को पीछे छोड़कर घर लौट आने की संदर्भगत गति दोनों व्यक्त होते हैं।
- source_word: וְיֹאכַל לָחֶם
  choice: ताकि वह भोजन करे
  rationale: ‘रोटी खाना’ हिब्रू में सामान्यतः भोजन करने का अर्थ दे सकता है; यहाँ निमंत्रण का व्यापक और स्वाभाविक भाव रखा गया है।
