  text: וַ/יֵּ֤רֶד יְהוָה֙ בֶּֽ/עָנָ֔ן וַ/יִּתְיַצֵּ֥ב עִמּ֖/וֹ שָׁ֑ם וַ/יִּקְרָ֥א בְ/שֵׁ֖ם יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/005.yaml
  text: And Yahweh came down in the cloud and stood there with him[a], and proclaimed the name of Yahweh.
translation:
  language: hi
  text: तब याहवे बादल में उतर आया और वहाँ उसके साथ खड़ा हुआ। उसने याहवे के नाम की घोषणा की[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे का नाम पुकारा,” अथवा “याहवे के नाम से घोषणा की।” इब्रानी में ‘नाम’ के साथ ऐसा संबंधसूचक शब्द है जिसका अर्थ प्रसंग के अनुसार ‘में’ या ‘से’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय देवनागरी में सीधे लिप्यंतरित किया गया है।
- source_word: וַיֵּרֶד
  choice: उतर आया
  rationale: ירד की नीचे की ओर गति को स्पष्ट रखता है और हिन्दी कथन में स्वाभाविक है।
- source_word: בֶּעָנָן
  choice: बादल में
  rationale: ב को स्थानवाचक मानते हुए उस परिचित बादल की ओर संकेत सुरक्षित रखा गया है जिसमें याहवे प्रकट हुआ।
- source_word: וַיִּתְיַצֵּב
  choice: खड़ा हुआ
  rationale: हित्पाएल रूप के ‘अपना स्थान लेकर खड़ा होना’ के भाव को सहज और संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: עִמּוֹ שָׁם
  choice: वहाँ उसके साथ
  rationale: עִם के साथ होने के भाव और שָׁם के स्थान-सूचक बल, दोनों को बनाए रखता है; प्रसंग में ‘उसके’ का संकेत मूसा की ओर है।
- source_word: וַיִּקְרָא
  choice: घोषणा की
  rationale: अगले पद में आने वाली उद्घोषणा के संदर्भ में קרא का सार्वजनिक रूप से पुकारकर प्रकट करने का भाव व्यक्त होता है।
- source_word: בְשֵׁם יְהוָה
  choice: याहवे के नाम की
  rationale: मुख्य पाठ में स्वाभाविक हिन्दी देते हुए नाम को घोषणा का विषय माना गया है; בְ की संभावित ‘नाम से/नाम लेकर’ व्याख्याएँ पादटिप्पणी में सुरक्षित हैं।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा ‘प्रभु’
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम सीधे आया है; ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: וַיִּקְרָא का कर्ता और अर्थ
  choice: याहवे कर्ता है और उसने नाम की घोषणा की
  alternative: मूसा ने याहवे का नाम पुकारा, अथवा याहवे ने अपने नाम से घोषणा की
  rationale: क्रमबद्ध हिब्रू क्रियाओं में निकटतम और सबसे स्वाभाविक कर्ता याहवे ही बना रहता है, और अगला पद इस घोषणा की विषयवस्तु देता है। फिर भी בְשֵׁם की वैकल्पिक संरचनात्मक व्याख्या पादटिप्पणी में रखी गई है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘उतर आया’ दृश्य की गति को स्वाभाविक बनाता है; दो वाक्यों का प्रयोग घटनाक्रम और घोषणा को स्पष्ट रखता है।
