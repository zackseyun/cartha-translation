  text: Afterward all the sons of Israel came near[a], and he commanded them all that Yahweh had spoken with him on Mount Sinai.
translation:
  language: hi
  text: इसके बाद इस्राएल के सभी पुत्र निकट आए[a], और मूसा ने उन्हें वह सब आदेश दिया जो यहोवा ने सीनै पर्वत पर उससे कहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “इस्राएल के सभी पुत्र”; इस राष्ट्रीय अभिव्यक्ति का अनुवाद “सभी इस्राएली” या “इस्राएल की संतान” भी किया जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַחֲרֵי כֵן
  choice: इसके बाद
  rationale: यह पदबंध पिछली घटना के बाद के क्रम को दर्शाता है; आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: נִגְּשׁוּ
  choice: निकट आए
  rationale: निफ़अल रूप का ठोस अर्थ पास या निकट आना है; यह मूसा के चमकते मुख से पहले लोगों के भय की कथा-संगति भी बनाए रखता है।
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के सभी पुत्र
  rationale: यह इब्रानी के पुल्लिंग बहुवचन और वाचा-संबंधी राष्ट्रीय अभिव्यक्ति को औपचारिक रूप से सुरक्षित रखता है।
- source_word: וַ/יְצַוֵּ/ם
  choice: मूसा ने उन्हें ... आज्ञा दी
  rationale: צוה का अर्थ आदेश या आज्ञा देना है। हिन्दी में स्पष्टता के लिए निहित कर्ता को ‘मूसा’ के रूप में व्यक्त किया गया है।
- source_word: אֵת כָּל אֲשֶׁר
  choice: वह सब ... जो
  rationale: यह पूरी कही हुई विषय-वस्तु को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: דִּבֶּר יְהוָה אִתּוֹ
  choice: यहोवा ने ... उससे कही थी
  rationale: ‘कही थी’ पूर्वकालिक क्रिया को स्पष्ट करता है; स्त्रीलिंग क्रिया ‘आज्ञा’ की व्यक्त विषय-वस्तु से मेल खाती है। אִתּוֹ का संवादात्मक संबंध ‘उससे’ द्वारा व्यक्त है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: देवनागरी हिन्दी में यह ईश्वरीय नाम YHWH का प्रचलित नामरूप है और इसे किसी उपाधि से नहीं बदलता।
- source_word: בְּ/הַר סִינָי
  choice: सीनै पर्वत पर
  rationale: यह स्थान को सटीक तथा स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत वाचा-नाम है। हिन्दी पाठकों के लिए ‘यहोवा’ इसका स्थापित देवनागरी नामरूप है; इसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया।
- issue: בְּנֵי יִשְׂרָאֵל का निरूपण
  choice: इस्राएल के सभी पुत्र
  alternative: सभी इस्राएली
  rationale: चुना गया पाठ मूल की पुल्लिंग बहुवचन राष्ट्रीय अभिव्यक्ति को सुरक्षित रखता है, जबकि पादटिप्पणी अधिक मुहावरेदार विकल्प बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। इब्रानी की राष्ट्रीय अभिव्यक्ति को मुख्य पाठ में औपचारिक निकटता के साथ रखा गया है और उसका स्वाभाविक हिन्दी विकल्प पादटिप्पणी में दिया गया है।
