  text: And no man shall go up with you[a], and indeed no man shall be seen anywhere on the mountain[b]; even the flock and the herd must not graze in front of that mountain.
translation:
  language: hi
  text: और तुम्हारे साथ कोई भी व्यक्ति ऊपर न चढ़े। और पूरे पर्वत पर कोई भी दिखाई न दे[a]। भेड़-बकरियाँ और गाय-बैल भी उस पर्वत के सामने न चरें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘प्रकट न हो।’ इब्रानी क्रिया का यह निफ़अल रूप ‘दिखाई देना’ या ‘प्रकट होना’ अर्थ दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: कोई भी व्यक्ति
  rationale: इब्रानी संज्ञा व्याकरण की दृष्टि से पुल्लिंग एकवचन है, पर यहाँ निषेध किसी भी मनुष्य पर लागू होता है; आधुनिक हिन्दी में ‘कोई भी व्यक्ति’ इसका स्वाभाविक और सटीक सामान्य अर्थ देता है।
- source_word: יַעֲלֶה עִמָּךְ
  choice: तुम्हारे साथ ऊपर न चढ़े
  rationale: עלה पहाड़ पर चढ़ने की दिशा स्पष्ट करता है; ‘ऊपर चढ़े’ आधुनिक हिन्दी में स्वाभाविक है और עִמָּךְ के साथ होने का भाव बनाए रखता है।
- source_word: וְגַם אִישׁ אַל יֵרָא
  choice: पूरे पहाड़ पर कोई भी दिखाई न दे
  rationale: וְגַם दूसरे निषेध को जोड़कर बल देता है, जबकि אַל स्पष्ट निषेध है। ראה का निफ़अल रूप ‘दिखाई देना’ या ‘प्रकट होना’ हो सकता है; मुख्य पाठ में सहज ‘दिखाई न दे’ रखा गया है।
- source_word: בְּכָל הָהָר
  choice: पूरे पहाड़ पर
  rationale: यह वाक्यांश पहाड़ के समूचे क्षेत्र को निषिद्ध बताता है; ‘पूरे पहाड़ पर’ संक्षिप्त और स्वाभाविक है।
- source_word: הַצֹּאן וְהַבָּקָר
  choice: भेड़-बकरियाँ और गाय-बैल
  rationale: ये क्रमशः छोटे और बड़े पालतू पशुओं के सामान्य वर्ग हैं। हिन्दी में यह युग्म दोनों श्रेणियों को साधारण पाठक के लिए स्पष्ट करता है।
- source_word: אַל יִרְעוּ
  choice: न चरें
  rationale: पशुओं के विषय में רעה का अर्थ चरना है; निषेधात्मक रूप को सीधे और स्वाभाविक हिन्दी में रखा गया है।
- source_word: אֶל מוּל הָהָר הַהוּא
  choice: उस पहाड़ के सामने
  rationale: אֶל מוּל सामने अथवा सम्मुख स्थित क्षेत्र को दर्शाता है और הַהוּא निर्दिष्ट पहाड़ की ओर संकेत करता है।
