base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/020.yaml
  text: You shall redeem the firstborn of a donkey with a lamb[a]; and if you do not redeem it, then you shall break its neck. You shall redeem every firstborn of your sons[c][b]. And none shall appear before me empty-handed.
translation:
  language: hi
  text: गधे के पहलौठे को भेड़ या बकरी से छुड़ाना; पर यदि उसे न छुड़ाओ, तो उसकी गरदन तोड़ देना। अपने हर पहलौठे पुत्र को छुड़ाना। कोई मेरे सामने खाली हाथ न आए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פֶטֶר חֲמוֹר
  choice: गदही के पहिलौठे
  rationale: פֶטֶר गर्भ खोलने वाली पहली संतान को दर्शाता है; इस विधिक संदर्भ में स्वाभाविक हिन्दी ‘पहिलौठा’ है। חֲמוֹר यहाँ गदही की संतान के अर्थ में है।
- source_word: תִּפְדֶּה
  choice: छुड़ाना
  rationale: פדה का अर्थ किसी स्थानापन्न वस्तु या मूल्य के द्वारा छुड़ाना है। ‘छुड़ाना’ आधुनिक हिन्दी में स्पष्ट है और विधिक-उपासना संबंधी भाव बनाए रखता है।
- source_word: בְשֶׂה
  choice: भेड़ या बकरी के एक बच्चे से
  rationale: שֶׂה भेड़-बकरियों के झुंड के किसी एक पशु को कह सकता है; केवल ‘मेमना’ कहने से बकरी की सम्भावना मिट जाती।
- source_word: וַעֲרַפְתּוֹ
  choice: उसकी गरदन तोड़ देना
  rationale: ערף विशेष रूप से गरदन तोड़ने को व्यक्त करता है, इसलिए यह सीधा और सटीक अनुवाद है।
- source_word: כֹּל בְּכוֹר בָּנֶיךָ
  choice: अपने पुत्रों में से हर पहिलौठे
  rationale: בָּנֶיךָ स्पष्ट रूप से ‘तुम्हारे पुत्रों’ को कहता है; लिंग-विशिष्ट अर्थ को बनाए रखा गया है।
- source_word: יֵרָאוּ פָנַי
  choice: मेरे सामने आए
  rationale: शाब्दिक ‘मेरे मुख के सामने दिखाई दे’ परमेश्वर की उपस्थिति में आने का इब्रानी मुहावरा है; हिन्दी में ‘मेरे सामने आए’ स्वाभाविक है।
- source_word: רֵיקָם
  choice: खाली हाथ
  rationale: उपासना के संदर्भ में इसका आशय बिना भेंट के आने से है; ‘खाली हाथ’ वही निहितार्थ स्वाभाविक हिन्दी में देता है।
theological_decisions:
- issue: अंतिम उपवाक्य में परमेश्वर के प्रथम-पुरुष संदर्भ का अनुवाद
  choice: मेरे सामने
  alternative: मेरे मुख के सामने
  rationale: मूल पाठ का ‘मेरे मुख’ परमेश्वर की उपस्थिति में आने का मुहावरा है। ‘मेरे सामने’ सीधे दिव्य कथन और उसके अर्थ दोनों को बनाए रखता है।
- issue: בָּנֶיךָ में लिंग-सूचक भाषा
  choice: पुत्रों
  alternative: बच्चों
  rationale: इब्रानी शब्द विशेष रूप से पुत्रों को दर्शाता है; इसे सामान्य ‘बच्चों’ में बदलना मूल की विधिक सीमा को विस्तृत कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण विधिक शैली। इब्रानी आज्ञार्थक imperfect को लगातार ‘-ना/देना’ वाले निर्देशात्मक रूप में रखा गया है। שֶׂה की वास्तविक व्यापकता को मुख्य पाठ में स्पष्ट किया गया है, इसलिए अलग पादटिप्पणी आवश्यक नहीं है।
