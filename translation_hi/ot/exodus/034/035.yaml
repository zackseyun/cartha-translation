base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/035.yaml
  text: And the sons of Israel saw Moses’ face[a], that the skin of Moses’ face shone[c][b]; and Moses would put the veil back over his face until he went in to speak with him.
translation:
  language: hi
  text: इस्राएल के पुत्र मूसा का चेहरा देखते थे और देखते थे कि मूसा के चेहरे की त्वचा चमक रही थी[a]। तब मूसा फिर अपने चेहरे पर आवरण डाल लेते थे, जब तक कि वे उससे बात करने के लिए भीतर न जाते[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी क्रिया का अर्थ ‘चमकना’ या ‘किरणें निकलना’ हो सकता है। पारंपरिक अनुवाद ‘सींग निकले थे’ इस शब्द की पुरानी भ्रांत समझ पर आधारित है।
    reason: lexical_alternative
  - marker: b
    text: ‘उससे’ का संकेत निकटवर्ती प्रसंग के अनुसार यहोवा की ओर है।
    reason: cross_reference
lexical_decisions:
- source_word: וְרָאוּ
  choice: देखते थे
  rationale: कथात्मक रूप यहाँ आसपास के प्रसंग में बार-बार होने वाली क्रिया का सार प्रस्तुत करता है; हिन्दी का अपूर्ण भूतकाल इसकी आदतन पुनरावृत्ति स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्र
  rationale: यह इब्रानी पारिवारिक अभिव्यक्ति का औपचारिक रूप से पारदर्शी अनुवाद है; अधिक सहज विकल्प ‘इस्राएली’ है।
- source_word: פְּנֵי מֹשֶׁה
  choice: मूसा का चेहरा
  rationale: सम्बन्धसूचक पदबंध का स्वाभाविक हिन्दी रूप, जो चेहरे पर मूल पाठ के ठोस बल को बनाए रखता है।
- source_word: כִּי
  choice: और देखते थे कि
  rationale: כִּי यहाँ उस बात की विषयवस्तु बताता है जिसे लोगों ने देखा; हिन्दी में दोहराया गया ‘देखते थे कि’ जटिल और अस्वाभाविक ‘चेहरा देखते थे कि’ से बचाता है।
- source_word: קָרַן
  choice: चमक रही थी
  rationale: क्रिया चमकने अथवा किरणें निकलने का बोध देती है; यह स्पष्ट आधुनिक हिन्दी है और ‘सींगयुक्त’ जैसी पुरानी भ्रांत व्याख्या से बचती है।
- source_word: עוֹר פְּנֵי מֹשֶׁה
  choice: मूसा के चेहरे की त्वचा
  rationale: עוֹר का विशिष्ट अर्थ ‘त्वचा’ है; इसे रखने से मूल पाठ की शारीरिक सटीकता बनी रहती है।
- source_word: וְהֵשִׁיב
  choice: फिर से डाल लेते थे
  rationale: हिफ़ील रूप का अर्थ आवरण को वापस लगाना है; ‘लेते थे’ पुनरावृत्त क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַמַּסְוֶה
  choice: घूँघट
  rationale: चेहरे को ढकने वाले आवरण के लिए प्रतिष्ठित और समझने योग्य हिन्दी शब्द; ‘नकाब’ सम्भव है, पर अलग सांस्कृतिक संकेत ला सकता है।
- source_word: עַל־פָּנָיו
  choice: अपने चेहरे पर
  rationale: प्रतिवाचक ‘अपने’ हिन्दी में कर्ता मूसा से सम्बन्ध स्पष्ट और स्वाभाविक बनाता है।
- source_word: עַד בֹּאוֹ
  choice: जब तक कि वह ... भीतर न जाते
  rationale: עַד के साथ क्रिया की समय-सीमा व्यक्त होती है; हिन्दी का ‘जब तक ... न’ निर्माण इसे सहजता से दर्शाता है।
- source_word: לְדַבֵּר אִתּוֹ
  choice: उससे बात करने के लिए
  rationale: मूल पाठ के सर्वनाम को बनाए रखा गया है; निकटवर्ती प्रसंग से उसका संकेत यहोवा की ओर है।
theological_decisions:
- issue: ‘उससे’ सर्वनाम का सन्दर्भ
  choice: मुख्य पाठ में सर्वनाम ‘उससे’ रखा गया है और पादटिप्पणी में उसका सन्दर्भ यहोवा बताया गया है।
  alternative: स्पष्टता के लिए मुख्य पाठ में ‘यहोवा से’ लिखना।
  rationale: इब्रानी में सर्वनाम है। उसे बनाए रखने से स्रोत की अभिव्यक्ति और उसका सम्भावित साहित्यिक तनाव सुरक्षित रहता है, जबकि निकटवर्ती प्रसंग सन्दर्भ स्पष्ट करता है।
- issue: मूसा के चेहरे की दीप्ति
  choice: ‘त्वचा चमक रही थी’
  alternative: ‘चेहरे से किरणें निकल रही थीं’ अथवा पारम्परिक भ्रांत रूप ‘सींग निकले थे’।
  rationale: קָרַן यहाँ प्रकाश या किरणों के निकलने का संकेत देता है। ‘चमक रही थी’ अर्थ को स्पष्ट रखता है और अनुचित शारीरिक/धर्मवैचारिक अर्थ आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘इस्राएल के पुत्र’ मूल की पारिवारिक अभिव्यक्ति को सुरक्षित रखता है, जबकि क्रियाओं में ‘देखते थे/डाल लेते थे’ प्रसंग की बार-बार होने वाली रीति को दर्शाता है।
