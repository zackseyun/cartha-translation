source:
  edition: WLC
  text: כִּ֛י לֹ֥א תִֽשְׁתַּחֲוֶ֖ה לְ/אֵ֣ל אַחֵ֑ר כִּ֤י יְהוָה֙ קַנָּ֣א שְׁמ֔/וֹ אֵ֥ל קַנָּ֖א הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/014.yaml
  text: For you shall not bow down to another god[a], for Yahweh, whose name is Jealous[c][b], is a jealous God.
translation:
  language: hi
  text: क्योंकि तू किसी दूसरे देवता के आगे दण्डवत् न करना[a], क्योंकि याहवे—जिसका नाम “ईर्ष्यालु” है[b]—ईर्ष्यालु परमेश्वर है।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तू किसी दूसरे देवता की आराधना न करना।” इब्रानी क्रिया का शाब्दिक अर्थ झुकना या दण्डवत् करना है, और यह प्रायः आराधना के लिए प्रयुक्त होती है।
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी वाक्यरचना अधिक शाब्दिक रूप में: “क्योंकि याहवे—‘ईर्ष्यालु’ उसका नाम है—ईर्ष्यालु परमेश्वर है।”'
    reason: lexical_alternative
  - marker: c
    text: यहाँ “ईर्ष्यालु” पापपूर्ण डाह नहीं, बल्कि इस बात को व्यक्त करता है कि याहवे अपनी वाचा की प्रजा से अनन्य आराधना का दावा करता है और प्रतिद्वंद्वी आराधना को स्वीकार नहीं करता।
    reason: cultural_note
lexical_decisions:
- source_word: תִשְׁתַּחֲוֶה
  choice: दण्डवत् न करना
  rationale: यह क्रिया शरीर झुकाने या भूमि पर गिरकर प्रणाम करने की ठोस क्रिया बताती है, जो इस संदर्भ में आराधना का कार्य है। ‘आराधना न करना’ अर्थ को स्पष्ट करता, पर मूल की दृश्य क्रिया को हटा देता।
- source_word: לְאֵל אַחֵר
  choice: किसी दूसरे देवता के आगे
  rationale: אֵל का अर्थ ‘देवता/ईश्वर’ और אַחֵר का अर्थ ‘दूसरा’ है। दण्डवत् करने के साथ स्वाभाविक हिन्दी के लिए ‘के आगे’ रखा गया है; ‘पराया देवता’ मूल से अधिक व्याख्यात्मक होता।
- source_word: יְהוָה
  choice: याहवे
  rationale: व्यक्तिगत वाचा-नाम को उपाधि ‘प्रभु’ से बदलने के बजाय हिन्दी लिपि में सीधे लिप्यंतरित किया गया है।
- source_word: קַנָּא
  choice: ईर्ष्यालु
  rationale: यह शब्द प्रतिद्वंद्वी आराधना को सहन न करने और अपनी प्रजा पर याहवे के अनन्य वाचा-दावे को व्यक्त करता है। नाम और गुण—दोनों स्थानों पर एक ही शब्द रखकर इब्रानी की पुनरुक्ति सुरक्षित की गई है।
- source_word: שְׁמוֹ
  choice: जिसका नाम … है
  rationale: यह स्वाभाविक हिन्दी संबंधवाचक रचना इब्रानी कथन को सुरक्षित रखती है कि ‘ईर्ष्यालु’ उसका नाम अथवा नामरूप विशेषण है।
- source_word: אֵל קַנָּא הוּא
  choice: ईर्ष्यालु परमेश्वर है
  rationale: विधेय रचना और पहले आए नाम की व्याख्यात्मक पुनरावृत्ति दोनों सुरक्षित हैं; हिन्दी में अलग से ‘वह’ जोड़ना आवश्यक नहीं।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम है। ‘याहवे’ उसका आधुनिक हिन्दी लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
- issue: קַנָּא को ईश्वरीय नाम और गुण के रूप में रखना
  choice: ईर्ष्यालु / ईर्ष्यालु
  alternative: उत्साही / जलन रखनेवाला
  rationale: दोनों बार समान हिन्दी शब्द रखने से मूल का नामकरण और जोरदार दोहराव बचता है। पादटिप्पणी स्पष्ट करती है कि यहाँ आशय पापपूर्ण डाह नहीं, बल्कि वाचा में अनन्य आराधना का दावा है।
- issue: एकवचन संबोधन
  choice: तू
  alternative: तुम
  rationale: इब्रानी क्रिया पुल्लिंग एकवचन है और वाचा के समुदाय को एक इकाई के रूप में संबोधित करती है। ‘तू’ इस व्याकरणिक रूप को स्पष्ट रूप से सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘दण्डवत्’ धार्मिक संदर्भ में परिचित शब्द है और मूल की ठोस शारीरिक क्रिया को बचाता है। ‘ईर्ष्यालु’ के संभावित नकारात्मक आधुनिक अर्थ को पादटिप्पणी में सीमित और स्पष्ट किया गया है।
