source:
  edition: WLC
  text: כִּ֤י אֶת מִזְבְּחֹתָ/ם֙ תִּתֹּצ֔וּ/ן וְ/אֶת מַצֵּבֹתָ֖/ם תְּשַׁבֵּר֑וּ/ן וְ/אֶת אֲשֵׁרָ֖י/ו תִּכְרֹתֽוּ/ן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/013.yaml
  text: Instead[a], you shall tear down their altars, shatter their pillars[b], and cut down their Asherah poles.
translation:
  language: hi
  text: बल्कि[a] तुम उनकी वेदियों को ढा देना, उनके पूजा-स्तंभों को चकनाचूर कर देना, और उसके अशेरा-स्तंभों[b] को काट गिराना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि तुम उनकी वेदियों को ढा देना…” इब्रानी संयोजक का अर्थ “क्योंकि” भी हो सकता है; यहाँ पिछली मनाही के विपरीत किए जाने वाले काम के रूप में “बल्कि” लिया गया है।
    reason: lexical_alternative
  - marker: b
    text: “अशेरा-स्तंभ” अशेरा से जुड़ी पंथीय वस्तुएँ थीं। इब्रानी में यहाँ शाब्दिक रूप से “उसके अशेरा-स्तंभ” है; संदर्भ के अनुसार “उनके अशेरा-स्तंभ” भी समझा जा सकता है।
    reason: textual_grammatical_ambiguity
lexical_decisions:
- source_word: כִּי
  choice: बल्कि
  rationale: पिछली आयत में वाचा बाँधने की मनाही के बाद यह उसके विपरीत अपेक्षित कार्रवाई बताता है। यद्यपि כִּי का अर्थ प्रायः ‘क्योंकि’ होता है, यहाँ प्रसंग में विरोधसूचक ‘बल्कि’ स्वाभाविक है।
- source_word: מִזְבְּחֹתָם
  choice: उनकी वेदियों
  rationale: מִזְבֵּחַ के धार्मिक अर्थ और बहुवचन के साथ तृतीय पुरुष बहुवचन संबंधसूचक प्रत्यय को स्पष्ट रूप से रखा गया है।
- source_word: תִּתֹּצוּן
  choice: ढा देना
  rationale: נתץ किसी निर्मित वस्तु को गिराने या ध्वस्त करने का बोध देता है; वेदियों के साथ ‘ढा देना’ सहज और सटीक है।
- source_word: מַצֵּבֹתָם
  choice: उनके पूजा-स्तंभों
  rationale: מַצֵּבָה यहाँ खड़े किए गए पंथीय पत्थर या स्तंभ को दर्शाता है। ‘पूजा-स्तंभ’ उसके धार्मिक प्रयोजन को स्पष्ट करता है और सामान्य ‘खंभे’ की भ्रांति से बचाता है।
- source_word: תְּשַׁבֵּרוּן
  choice: चकनाचूर कर देना
  rationale: שׁבר के पिएल रूप में तोड़ने की प्रबल और पूर्ण कार्रवाई का भाव है, जिसे यह वर्तमान हिन्दी पदबंध स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֲשֵׁרָיו
  choice: उसके अशेरा-स्तंभों
  rationale: शब्द अशेरा से जुड़े पंथीय पदार्थों का बहुवचन है, जबकि मसोराई प्रत्यय व्याकरणतः एकवचन पुल्लिंग ‘उसके’ है। मुख्य पाठ में इस वास्तविक रूप को बनाए रखा गया है और संदर्भगत ‘उनके’ को पादटिप्पणी में दिया गया है।
- source_word: תִּכְרֹתוּן
  choice: काट गिराना
  rationale: כרת काटने का अर्थ देता है; अशेरा से जुड़े सम्भवतः काष्ठ-निर्मित पंथीय पदार्थों के साथ ‘काट गिराना’ उपयुक्त और मुहावरेदार है।
theological_decisions:
- issue: אֲשֵׁרָיו का अभिप्राय
  choice: अशेरा से जुड़े काटे जा सकने वाले पंथीय पदार्थ, जिन्हें ‘अशेरा-स्तंभ’ कहा गया है
  alternative: ‘अशेरा-वृक्ष’, ‘अशेरा की मूरतें’, अथवा लिप्यंतरित बहुवचन ‘अशेरीम’
  rationale: विनाश की वस्तुओं की सूची और ‘काट गिराना’ क्रिया काष्ठ-निर्मित पंथीय वस्तुओं की ओर संकेत करती है। ‘अशेरा-स्तंभ’ नामित देवता से संबंध बनाए रखते हुए पाठक को भौतिक पंथीय वस्तु का बोध कराता है, पर उसकी सटीक आकृति को अत्यधिक निश्चित नहीं करता।
- issue: אֲשֵׁרָיו में संबंधसूचक प्रत्यय
  choice: मसोराई पाठ के एकवचन ‘उसके’ को मुख्य पाठ में सुरक्षित रखा गया
  alternative: पूर्ववर्ती बहुवचन रूपों और सामूहिक संदर्भ के अनुसार ‘उनके’
  rationale: इब्रानी में पहले दो संज्ञाओं के प्रत्यय बहुवचन ‘उनके’ हैं, पर אֲשֵׁרָיו का लिखित और स्वरांकित रूप ‘उसके अशेरीम’ है। असामान्य बदलाव को चुपचाप समतल करने के बजाय मुख्य पाठ और पादटिप्पणी के माध्यम से दोनों स्तर सुरक्षित रखे गए हैं।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और आज्ञात्मक है, पर धार्मिक प्रसंग के अनुरूप गरिमा रखती है। ‘वेदियों’, ‘पूजा-स्तंभों’ और ‘अशेरा-स्तंभों’ से तीन अलग पंथीय वस्तुओं का भेद बना रहता है। ‘ढा देना’, ‘चकनाचूर कर देना’ और ‘काट गिराना’ क्रमशः तीन इब्रानी क्रियाओं की ठोस भिन्नता व्यक्त करते हैं।
