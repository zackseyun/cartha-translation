  yaml_path: translation/ot/exodus/034/031.yaml
  text: But Moses called to them[a], and Aaron and all the leaders of the congregation returned to him, and Moses spoke to them.
translation:
  language: hi
  text: पर मूसा ने उन्हें पुकारा। तब हारून और सभा के सभी अगुवे[a] उसके पास लौट आए, और मूसा ने उनसे बात की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सभा के सभी प्रधान’; या ‘समुदाय के सभी अगुवे’।
    reason: נְשִׂיאִים और עֵדָה के लिए क्रमशः ‘प्रधान/अगुवे’ तथा ‘सभा/समुदाय’ दोनों अर्थगत रूप से संभव हैं।
lexical_decisions:
- source_word: וַיִּקְרָא אֲלֵהֶם
  choice: उन्हें पुकारा
  rationale: קרא के साथ אֶל यहाँ उन लोगों को संबोधित करके पास बुलाने का भाव देता है। ‘पुकारा’ स्वाभाविक है और ‘आज्ञा देकर बुलाया’ जैसा अतिरिक्त अधिकार-बोध नहीं जोड़ता।
- source_word: וַיָּשֻׁבוּ אֵלָיו
  choice: उसके पास लौट आए
  rationale: שׁוב का मूल भाव ‘लौटना’ है; प्रसंग में हारून और अगुवे भय के कारण पीछे हटने के बाद मूसा के पास फिर आते हैं।
- source_word: הַנְּשִׂאִים
  choice: अगुवे
  rationale: נָשִׂיא यहाँ समुदाय में नेतृत्व करनेवालों को सूचित करता है। ‘अगुवे’ आधुनिक और बोधगम्य है तथा ‘राजकुमार’ जैसा अनुपयुक्त वंशगत अर्थ नहीं देता।
- source_word: בָּעֵדָה
  choice: सभा के
  rationale: עֵדָה इस्राएल के संगठित सामुदायिक समूह या सभा को सूचित करता है। ‘सभा’ सामूहिक और एकत्र समुदाय—दोनों भावों को संक्षेप में बनाए रखता है।
- source_word: וַיְדַבֵּר ... אֲלֵהֶם
  choice: उनसे बात की
  rationale: דבר का सामान्य अर्थ ‘बोलना/बात करना’ है। ‘बात की’ कथन की ऐसी विषयवस्तु नहीं जोड़ता जो इस पद में दी नहीं गई।
- source_word: וַ
  choice: पर / तब / और
  rationale: 'वाव से जुड़े क्रम को हिंदी में प्रसंगानुसार अलग संयोजकों से व्यक्त किया गया है: आरंभ में पिछले पद के भय के विपरीत मूसा की प्रतिक्रिया के लिए ‘पर’, अगले घटनाक्रम के लिए ‘तब’, और अंतिम समन्वय के लिए ‘और’।'
