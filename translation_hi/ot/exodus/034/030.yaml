base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/030.yaml
  text: When Aaron and all the sons of Israel saw Moses[a], behold, the skin of his face was radiant, and they were afraid to come near him.
translation:
  language: hi
  text: हारून और इस्राएल के सभी पुत्रों ने मूसा को देखा, और देखो, उसके चेहरे की त्वचा चमक रही थी[a]; और वे उसके पास आने से डर गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘दीप्तिमान थी’ अथवा ‘उससे किरणें निकल रही थीं।’ यह हिब्रू क्रिया दुर्लभ है और इतिहास में इसका अनुवाद ‘सींग निकले थे’ भी किया गया है, पर प्रसंग चमक या तेज की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: देखा
  rationale: ראה का कथात्मक रूप यहाँ साधारण प्रत्यक्ष देखने को व्यक्त करता है; आधुनिक हिन्दी में ‘देखा’ स्वाभाविक और सटीक है।
- source_word: וְכָל בְּנֵי יִשְׂרָאֵל
  choice: और इस्राएल के सभी पुत्रों
  rationale: यह हिब्रू के पारिवारिक और व्याकरणतः पुल्लिंग पदबंध को बनाए रखता है; ‘सभी इस्राएली’ अधिक सहज होता, पर स्रोत की अभिव्यक्ति को समतल कर देता।
- source_word: וְהִנֵּה
  choice: तो देखो
  rationale: הִנֵּה दृश्य पर अचानक ध्यान और कथात्मक आश्चर्य प्रकट करता है; ‘तो देखो’ आधुनिक हिन्दी में उसकी संकेतात्मक शक्ति बनाए रखता है।
- source_word: קָרַן
  choice: चमक रही थी
  rationale: दुर्लभ क्रिया यहाँ किरणें निकलने या दीप्त होने का भाव देती है। ‘चमक रही थी’ सहज हिन्दी है और प्रसंगानुसार दृश्य तेज को व्यक्त करती है।
- source_word: עוֹר פָּנָיו
  choice: उसके चेहरे की त्वचा
  rationale: हिब्रू में केवल ‘चेहरा’ नहीं, स्पष्टतः उसके चेहरे की ‘त्वचा’ कही गई है; ठोस स्रोत-अभिव्यक्ति को सुरक्षित रखा गया है।
- source_word: וַיִּירְאוּ
  choice: वे ... डर गए
  rationale: यह लोगों की भयपूर्ण प्रतिक्रिया को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: מִגֶּשֶׁת אֵלָיו
  choice: उसके पास आने से
  rationale: מן के साथ infinitive निकट आने से पीछे हटने या भय खाने का भाव देता है; यह हिन्दी पदबंध उसी अर्थ को सहज रूप में रखता है।
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל का अनुवाद
  choice: इस्राएल के सभी पुत्रों
  alternative: सभी इस्राएलियों / इस्राएल की सभी संतानों
  rationale: मुख्य पाठ हिब्रू की पारिवारिक और व्याकरणतः पुल्लिंग संज्ञा को बनाए रखता है, बिना उसे अधिक सामान्य जातीय पद में बदलने के।
- issue: मूसा के चेहरे के संबंध में קָרַן का अर्थ
  choice: चमक रही थी
  alternative: दीप्तिमान थी / किरणें निकल रही थीं / सींग निकले थे
  rationale: निकटवर्ती प्रसंग दृश्य तेज और उससे उत्पन्न भय का वर्णन करता है, इसलिए ‘चमक रही थी’ उपयुक्त है। दुर्लभ क्रिया की वास्तविक अर्थ-सीमा और ऐतिहासिक ‘सींग’ वाला अनुवाद पादटिप्पणी में सुरक्षित हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘इस्राएल के सभी पुत्रों’ और ‘चेहरे की त्वचा’ जैसे पद स्रोत की ठोस अभिव्यक्ति को जानबूझकर बनाए रखते हैं; ‘तो देखो’ कथात्मक आश्चर्य को उभारता है।
