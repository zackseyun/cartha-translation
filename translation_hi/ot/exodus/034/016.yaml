  text: and you take some of his daughters for your sons[b][a], and his daughters prostitute themselves after their gods and make your sons prostitute themselves after their gods.
translation:
  language: hi
  text: और तुम उसकी बेटियों में से अपने बेटों के लिए स्त्रियाँ लोगे[a]; तब उसकी बेटियाँ अपने देवताओं के पीछे व्यभिचार करेंगी[b] और तुम्हारे बेटों से अपने देवताओं के पीछे व्यभिचार करवाएँगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् विवाह के लिए। इब्रानी में शाब्दिक रूप से, ‘तुम उसकी बेटियों में से अपने बेटों के लिए लोगे।’
    reason: lexical_alternative
  - marker: b
    text: मूल इब्रानी में ‘वेश्यावृत्ति करना’ अथवा ‘वेश्या-जैसा आचरण करना’ का शब्द है। यहाँ यौन-बेवफाई की भाषा दूसरे देवताओं के पीछे जाने के रूपक के रूप में प्रयुक्त हुई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ מִבְּנֹתָיו לְבָנֶיךָ
  choice: तुम उसकी बेटियों में से अपने बेटों के लिए पत्नियाँ लोगे
  rationale: לקח का मूल अर्थ ‘लेना’ है; विवाह-संबंधी संदर्भ में ‘पत्नियाँ’ जोड़ने से हिन्दी में आशय स्वाभाविक और स्पष्ट होता है। מִן का अंशवाचक भाव ‘में से’ द्वारा सुरक्षित है।
- source_word: וְזָנוּ
  choice: व्यभिचार करेंगी
  rationale: זנה की यौन-बेवफाई वाली रूपकात्मक भाषा को सुरक्षित रखा गया है; यहाँ इसका संदर्भ दूसरे देवताओं के पीछे चलने से है।
- source_word: אַחֲרֵי אֱלֹהֵיהֶן
  choice: अपने देवताओं के पीछे
  rationale: ‘पीछे’ इब्रानी मुहावरे और उसके चित्रात्मक बल को बनाए रखता है, जबकि हिन्दी में भी अर्थ स्पष्ट है।
- source_word: וְהִזְנוּ אֶת־בָּנֶיךָ
  choice: तुम्हारे बेटों से भी ... व्यभिचार करवाएँगी
  rationale: हिफ़ील रूप की कारकता को ‘करवाएँगी’ से स्पष्ट किया गया है; ‘भी’ दोनों पक्षों के समान कृत्य को स्वाभाविक हिन्दी में जोड़ता है।
- source_word: אֱלֹהֵיהֶן
  choice: अपने देवताओं
  rationale: स्त्रीलिंग बहुवचन संबंधसूचक प्रत्यय को कर्ता बेटियों के संदर्भ में स्वाभाविक हिन्दी ‘अपने’ से व्यक्त किया गया है।
theological_decisions:
- issue: मूर्तिपूजा के संदर्भ में זנה का अनुवाद
  choice: ‘व्यभिचार करेंगी’ रूपक को बनाए रखना
  alternative: ‘मूर्तिपूजा करेंगी’ या ‘विश्वासघात करेंगी’
  rationale: मूल पाठ जानबूझकर यौन-बेवफाई की भाषा द्वारा धार्मिक और वाचा-संबंधी बेवफाई व्यक्त करता है। केवल ‘मूर्तिपूजा’ कहने से यह रूपक और उसका धर्मवैचारिक तनाव मिट जाता।
- issue: बेटियों और बेटों का लिंग-विशिष्ट उल्लेख
  choice: ‘बेटियाँ’ और ‘बेटे’
  alternative: ‘संतान’ या ‘बच्चे’
  rationale: मूल में विवाह-संबंधी प्रसंग के भीतर दोनों शब्द स्पष्ट रूप से लिंग-विशिष्ट हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज वाक्य-विन्यास रखा गया है। ‘व्यभिचार’ मूल रूपक की तीव्रता बचाता है, और पादटिप्पणी उसके धार्मिक संदर्भ को स्पष्ट करती है।
