  edition: WLC
  text: וַ/יִּפְסֹ֡ל שְׁנֵֽי לֻחֹ֨ת אֲבָנִ֜ים כָּ/רִאשֹׁנִ֗ים וַ/יַּשְׁכֵּ֨ם מֹשֶׁ֤ה בַ/בֹּ֨קֶר֙ וַ/יַּ֨עַל֙ אֶל הַ֣ר סִינַ֔י כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֹת֑/וֹ וַ/יִּקַּ֣ח בְּ/יָד֔/וֹ שְׁנֵ֖י לֻחֹ֥ת אֲבָנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/004.yaml
  text: So he cut two stone tablets like the first ones[a], and Moses rose early in the morning and went up Mount Sinai, just as Yahweh had commanded him[b], and he took the two stone tablets in his hand.
translation:
  language: hi
  text: तब मूसा ने पहली पटियाओं जैसी पत्थर की दो पटियाएँ तराशीं[a]। मूसा सुबह तड़के उठा और सीनै पर्वत पर चढ़ गया, जैसा याहवे ने उसे आज्ञा दी थी। उसने पत्थर की वे दोनों पटियाएँ अपने हाथ में ले लीं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “काटकर तैयार कीं।”
    reason: פסל में पत्थर को काटने, गढ़ने अथवा तराशने का अर्थ हो सकता है।
  - marker: b
    text: मूल इब्रानी में “अपने हाथ में” एकवचन है; यह मुहावरे के रूप में प्रयुक्त हो सकता है।
    reason: एकवचन रूप को सुरक्षित रखते हुए उसके संभावित मुहावरेदार प्रयोग की जानकारी देना।
lexical_decisions:
- source_word: וַיִּפְסֹל
  choice: तराशीं
  rationale: क्रिया פסל यहाँ पत्थर को काटकर और आकार देकर पटियाएँ बनाने को दर्शाती है। ‘तराशीं’ इस ठोस क्रिया को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: לֻחֹת אֲבָנִים
  choice: पत्थर की ... पटियाएँ
  rationale: यह वाचा की पत्थर की पटियाओं के लिए स्पष्ट, प्रचलित और गरिमापूर्ण हिन्दी अभिव्यक्ति है।
- source_word: כָּרִאשֹׁנִים
  choice: पहली पटियाओं जैसी
  rationale: तुलनासूचक כְּ और רִאשֹׁנִים पहले वाली पटियाओं के साथ समानता बताते हैं; संज्ञा को दोहराने से हिन्दी में संदर्भ स्पष्ट रहता है।
- source_word: וַיַּשְׁכֵּם ... בַבֹּקֶר
  choice: सुबह तड़के उठा
  rationale: यह इब्रानी मुहावरा सुबह बहुत जल्दी उठने को व्यक्त करता है; चुना हुआ रूप आधुनिक हिन्दी में स्वाभाविक है और समय पर बल बनाए रखता है।
- source_word: וַיַּעַל אֶל הַר סִינַי
  choice: सीनै पर्वत पर चढ़ गया
  rationale: עלה ऊपर जाने अथवा चढ़ने की गति को स्पष्ट करता है; पर्वत के संदर्भ में ‘चढ़ गया’ सहज और सटीक है।
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֹתוֹ
  choice: याहवे की आज्ञा के अनुसार
  rationale: כַּאֲשֶׁר यहाँ पहले दी गई आज्ञा के अनुरूप कार्य करने का भाव रखता है। हिन्दी में यह संक्षिप्त रूप उसी अनुरूपता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וַיִּקַּח בְּיָדוֹ
  choice: अपने हाथ में ले लीं
  rationale: मूल पाठ में ‘हाथ’ एकवचन है। हिन्दी में भी यह एकवचन स्वाभाविक मुहावरे के रूप में रखा जा सकता है, बिना यह तय किए कि दोनों पटियाएँ व्यवहारतः कैसे संभाली गईं।
- source_word: שְׁנֵי לֻחֹת אֲבָנִים
  choice: पत्थर की वे दोनों पटियाएँ
  rationale: दूसरी बार आया पद ज्ञात पटियाओं की ओर संकेत करता है; ‘वे दोनों’ पुनरुक्ति और निश्चित संदर्भ दोनों को स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ में उपाधि नहीं, चार अक्षरों वाला व्यक्तिगत वाचा-नाम יְהוָה है। ‘याहवे’ उसका व्यापक रूप से मान्य ध्वन्यात्मक लिप्यंतरण है और नाम को किसी उपाधि से प्रतिस्थापित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज और गरिमापूर्ण रखी गई है। इब्रानी की लगातार जुड़ी कथन-श्रृंखला को हिन्दी की पठनीयता के लिए तीन वाक्यों में बाँटा गया है। पहले क्रियापद के अंतर्निहित कर्ता को प्रसंगानुसार ‘मूसा’ के रूप में स्पष्ट किया गया है।
