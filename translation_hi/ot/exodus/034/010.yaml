source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר הִנֵּ֣ה אָנֹכִי֮ כֹּרֵ֣ת בְּרִית֒ נֶ֤גֶד כָּֽל עַמְּ/ךָ֙ אֶעֱשֶׂ֣ה נִפְלָאֹ֔ת אֲשֶׁ֛ר לֹֽא נִבְרְא֥וּ בְ/כָל הָ/אָ֖רֶץ וּ/בְ/כָל הַ/גּוֹיִ֑ם וְ/רָאָ֣ה כָל הָ֠/עָם אֲשֶׁר אַתָּ֨ה בְ/קִרְבּ֜/וֹ אֶת מַעֲשֵׂ֤ה יְהוָה֙ כִּֽי נוֹרָ֣א ה֔וּא אֲשֶׁ֥ר אֲנִ֖י עֹשֶׂ֥ה עִמָּֽ/ךְ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/010.yaml
  text: And he said, “Look, I am making a covenant. Before all your people I will do wonders such as have not been created in all the earth or among any of the nations. And all the people in whose midst you are will see the work of the LORD, for what I am doing with you is awe-inspiring.”
translation:
  language: hi
  text: तब उसने कहा, “देख, मैं एक वाचा बाँध रहा हूँ। तेरे सारे लोगों के सामने मैं ऐसे अद्भुत काम करूँगा, जैसे सारी पृथ्वी पर या किसी भी जाति के बीच कभी किए नहीं गए। जिन लोगों के बीच तू रहता है, वे सब यहोवा का काम देखेंगे, क्योंकि जो काम मैं तेरे साथ कर रहा हूँ, वह विस्मयकारी है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּרֵת בְּרִית
  choice: वाचा बाँध रहा हूँ
  rationale: इब्रानी मुहावरे का अर्थ वाचा स्थापित करना है; ‘वाचा बाँधना’ हिंदी की स्वाभाविक बाइबलीय अभिव्यक्ति है और वर्तमान कृदंत की आसन्न/चल रही क्रिया को बनाए रखती है।
- source_word: נִפְלָאֹת
  choice: अद्भुत काम
  rationale: यह शब्द असाधारण और आश्चर्य उत्पन्न करने वाले कार्यों को दर्शाता है; संदर्भ में बहुवचन ‘काम’ जोड़ने से अर्थ स्पष्ट और स्वाभाविक होता है।
- source_word: לֹא נִבְרְאוּ
  choice: कभी किए नहीं गए
  rationale: शाब्दिक अर्थ ‘रचे/सृजे नहीं गए’ है, पर अद्भुत कार्यों के साथ हिंदी में ‘किए नहीं गए’ अधिक स्वाभाविक है; ‘कभी’ उनकी अभूतपूर्वता व्यक्त करता है।
- source_word: מַעֲשֵׂה יְהוָה
  choice: यहोवा का काम
  rationale: व्यक्तिगत दिव्य नाम יהוה को ‘यहोवा’ के रूप में रखा गया है और מַעֲשֵׂה के एकवचन को ‘काम’ से व्यक्त किया गया है।
- source_word: נוֹרָא
  choice: विस्मयकारी
  rationale: यह शब्द भय, श्रद्धा और विस्मय उत्पन्न करने वाले स्वरूप को समेटता है; ‘विस्मयकारी’ केवल डरावने अर्थ तक सीमित नहीं करता।
- source_word: עִמָּךְ
  choice: तेरे साथ
  rationale: पूर्वसर्ग का सीधा अर्थ ‘तेरे साथ’ है; इसे ‘तेरे लिए’ बनाकर संबंधगत अस्पष्टता को नहीं बदला गया।
theological_decisions:
- issue: वाचा का समय/पक्ष
  choice: मैं एक वाचा बाँध रहा हूँ
  alternative: मैं तेरे साथ वाचा बाँधता हूँ
  rationale: मूल पाठ में स्पष्ट कर्म या ‘तेरे साथ’ इस वाक्यांश के भीतर नहीं है; इसलिए उसे यहाँ जोड़कर अनावश्यक रूप से निश्चित नहीं किया गया।
- issue: יהוה का प्रतिपादन
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में सामान्य उपाधि नहीं बल्कि परमेश्वर का व्यक्तिगत नाम है; उसे नाम के रूप में प्रस्तुत करना स्रोत का भेद सुरक्षित रखता है।
- issue: अंतिम עִמָּךְ का संबंध
  choice: जो काम मैं तेरे साथ करने जा रहा हूँ
  alternative: जो काम मैं तेरे लिए करूँगा
  rationale: ‘साथ’ मूल पूर्वसर्ग की व्यापकता और संभावित संबंधगत तनाव को बनाए रखता है, जबकि ‘लिए’ केवल लाभार्थी अर्थ तय कर देता।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। परमेश्वर द्वारा मूसा को संबोधन होने के कारण एकवचन निकटवर्ती ‘तू/तेरे’ रखा गया है। ‘देख’ הִנֵּה की ध्यान आकर्षित कराने वाली भूमिका को संक्षेप में व्यक्त करता है।
