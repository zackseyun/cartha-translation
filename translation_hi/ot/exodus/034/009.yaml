  text: וַ/יֹּ֡אמֶר אִם נָא֩ מָצָ֨אתִי חֵ֤ן בְּ/עֵינֶ֨י/ךָ֙ אֲדֹנָ֔/י יֵֽלֶךְ נָ֥א אֲדֹנָ֖/י בְּ/קִרְבֵּ֑/נוּ כִּ֤י עַם קְשֵׁה עֹ֨רֶף֙ ה֔וּא וְ/סָלַחְתָּ֛ לַ/עֲוֺנֵ֥/נוּ וּ/לְ/חַטָּאתֵ֖/נוּ וּ/נְחַלְתָּֽ/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/009.yaml
  text: And he said[a], “If now I have found favor in your eyes, Lord, please let the Lord go in our midst, though it is a stiff-necked people; and forgive our iniquity and our sin[b], and take us as your inheritance.”
translation:
  language: hi
  text: तब उसने कहा, “हे प्रभु, यदि मैंने आपकी दृष्टि में अनुग्रह पाया है, तो प्रभु हमारे बीच चलें[a], क्योंकि हम हठीली प्रजा हैं। हमारे अधर्म और पाप को क्षमा करें, और हमें अपनी विरासत के रूप में ग्रहण करें[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “हमारे मध्य चलें” या प्रसंगानुसार “हमारे साथ चलें” भी हो सकता है। इब्रानी में शाब्दिक अर्थ “हमारे बीच चलें” है।
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद “हमें अपनी निज संपत्ति बना लें” भी हो सकता है। इब्रानी क्रिया हमें अपनी विरासत या अपने अधिकार के भाग के रूप में ग्रहण करने का भाव दे सकती है।
    reason: alternative_reading
lexical_decisions:
- source_word: חֵן בְּעֵינֶיךָ
  choice: तेरी कृपादृष्टि हुई है
  rationale: ‘तेरी दृष्टि में अनुग्रह पाया’ स्रोत की संरचना के अधिक निकट है, पर आधुनिक हिन्दी में ‘तेरी कृपादृष्टि हुई है’ उसी संबंधपरक अर्थ को स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: אֲדֹנָי
  choice: हे प्रभु / प्रभु
  rationale: यहाँ रूप संबोधन की उपाधि है, स्वयं יהוה नाम नहीं। पहले प्रयोग में ‘हे प्रभु’ और दूसरे में वाक्य के कर्ता के रूप में ‘प्रभु’ रखा गया है।
- source_word: יֵלֶךְ נָא ... בְּקִרְבֵּנוּ
  choice: प्रभु हमारे बीच चलें
  rationale: यह अनुवाद בקרבנו की ‘हमारे मध्य’ वाली स्थानिक छवि और הלך की गति—दोनों को बनाए रखता है; निवेदन का भाव आदरसूचक क्रिया से व्यक्त होता है।
- source_word: עַם קְשֵׁה עֹרֶף
  choice: हठीले लोग
  rationale: शाब्दिक रूप ‘कठोर गर्दन वाले लोग’ हिन्दी में अस्वाभाविक और अस्पष्ट है। ‘हठीले’ रूपक का आशय—जिद्दी और न मानने वाला स्वभाव—साफ व्यक्त करता है।
- source_word: עָוֹן
  choice: अधर्म
  rationale: ‘अधर्म’ नैतिक दोष की गंभीरता बनाए रखता है और अगले शब्द חטאת के लिए प्रयुक्त ‘पाप’ से कुछ भेद भी रखता है।
- source_word: חַטָּאת
  choice: पाप
  rationale: यह सामान्य, सीधा और प्रसंगानुकूल हिन्दी समतुल्य है।
- source_word: וּנְחַלְתָּנוּ
  choice: हमें अपनी विरासत बना ले
  rationale: נחל का रूप यहाँ किसी को अपनी विरासत अथवा निज भाग के रूप में ग्रहण करने का भाव देता है। यह चयन इस्राएल के परमेश्वर की अपनी प्रजा होने के वाचा-संबंधी भाव को सुरक्षित रखता है।
theological_decisions:
- issue: כִּי का प्रसंगगत संबंध
  choice: यद्यपि ये हठीले लोग हैं, फिर भी
  alternative: क्योंकि ये हठीले लोग हैं
  rationale: 'כִּי सामान्यतः कारणसूचक हो सकता है, किंतु यहाँ मूसा का निवेदन प्रसंग में concessive अर्थ देता है: लोगों के हठीले होने के बावजूद प्रभु उनके बीच चलें और क्षमा करें। ‘यद्यपि…फिर भी’ इस संबंध को स्पष्ट करता है, जबकि मूल की संभावित कारणसूचक ध्वनि पूर्णतः निर्विवाद नहीं है।'
- issue: אֲדֹנָי को ईश्वरीय नाम समझने का प्रश्न
  choice: प्रभु
  alternative: यहोवा / परमेश्वर
  rationale: मूल में אֲדֹנָי उपाधि है, יהוה नाम नहीं; इसलिए ईश्वरीय नाम को पाठ में आयात नहीं किया गया।
- issue: וּנְחַלְתָּנוּ का वाचा-संबंधी अर्थ
  choice: हमें अपनी विरासत बना ले
  alternative: हमें अपनी संपत्ति बना ले
  rationale: ‘विरासत’ נחל से जुड़े उत्तराधिकार/निज भाग के बिंब को बनाए रखती है। ‘संपत्ति’ अर्थ स्पष्ट करती, पर स्रोत की विरासत-वाली शब्द-छवि को कम कर देती।
translation_notes:
  register: आधुनिक मानक हिन्दी, आदरसूचक और प्रार्थनात्मक लहजा। परमेश्वर को संबोधन में पारंपरिक एकवचन ‘तेरी/कर/ले’ रखा गया है, जबकि ‘चलें’ निवेदन और सम्मान व्यक्त करता है। ‘हठीले लोग’ सहज बोधगम्यता के लिए चुना गया; अधिक शाब्दिक ‘कठोर गर्दन वाले’ से परहेज किया गया।
