source:
  edition: WLC
  text: וּ/בְ/בֹ֨א מֹשֶׁ֜ה לִ/פְנֵ֤י יְהוָה֙ לְ/דַבֵּ֣ר אִתּ֔/וֹ יָסִ֥יר אֶת הַ/מַּסְוֶ֖ה עַד צֵאת֑/וֹ וְ/יָצָ֗א וְ/דִבֶּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל אֵ֖ת אֲשֶׁ֥ר יְצֻוֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/034.yaml
  text: But whenever Moses went in before Yahweh to speak with him[a], he would remove the veil until he came out; then he would come out and speak to the sons of Israel what he had been commanded.
translation:
  language: hi
  text: पर जब-जब मूसा याहवे के सामने उससे बात करने के लिए भीतर जाता, तो वह बाहर आने तक परदा हटा देता था। फिर वह बाहर आकर इस्राएल के पुत्रों[a] से वह कहता जो उसे आज्ञा दी गई थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘इस्राएलियों से’ अथवा ‘इस्राएल के लोगों से।’ इब्रानी में शाब्दिक रूप से ‘इस्राएल के पुत्रों’ है।
    reason: शाब्दिक पुरुषवाची पदबंध और उसके प्रचलित सामुदायिक अर्थ, दोनों को स्पष्ट करना।
lexical_decisions:
- source_word: וּבְבֹא
  choice: पर जब-जब ... भीतर जाता
  rationale: בְּ के साथ infinitive construct बार-बार घटने वाली परिस्थिति बताता है; इसलिए ‘जब-जब’ पुनरावृत्ति को व्यक्त करता है। आरंभिक וּ पिछले पद से हल्का विरोध जोड़ता है, जिसे ‘पर’ से रखा गया है।
- source_word: לִפְנֵי יְהוָה
  choice: याहवे के सामने
  rationale: לִפְנֵי का अर्थ ‘के सामने/की उपस्थिति में’ है, और יהוה को उसके निज नाम ‘याहवे’ के रूप में रखा गया है।
- source_word: לְדַבֵּר אִתּוֹ
  choice: उससे बात करने
  rationale: אִתּוֹ के साथ דבר परस्पर संवाद का भाव देता है; संदर्भ में ‘उससे’ याहवे की ओर संकेत करता है।
- source_word: יָסִיר אֶת־הַמַּסְוֶה
  choice: परदा हटा देता था
  rationale: अपूर्ण क्रिया यहाँ मूसा की नियमित भूतकालीन क्रिया बताती है। מַסְוֶה उसके चेहरे के आवरण के लिए प्रयुक्त है; सामान्य हिंदी में ‘परदा’ स्वाभाविक है।
- source_word: עַד־צֵאתוֹ
  choice: बाहर आने तक
  rationale: यह रचना उस समय-सीमा को बताती है जब तक परदा हटाया रहता था।
- source_word: אֶל־בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: यह इब्रानी पदबंध के पुरुषवाची रूप को निकटता से सुरक्षित रखता है; फुटनोट उसका सामुदायिक अर्थ स्पष्ट करता है।
- source_word: אֵת אֲשֶׁר יְצֻוֶּה
  choice: वह सब ... जिसकी उसे आज्ञा मिली थी
  rationale: Pual रूप आज्ञा पाए जाने को व्यक्त करता है। हिंदी पूर्ण भूतकाल यह दिखाता है कि आज्ञा मूसा के लोगों से बोलने से पहले मिली थी।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का निज नाम सीधे आया है; ‘याहवे’ उसे पदवी में बदले बिना सुरक्षित रखता है।
- issue: בְּנֵי יִשְׂרָאֵל का लिंग और सामुदायिक अर्थ
  choice: इस्राएल के पुत्रों
  alternative: इस्राएली; इस्राएल के लोग
  rationale: मुख्य पाठ मूल के स्पष्ट पुरुषवाची पदबंध को रखता है, जबकि फुटनोट बताता है कि यह इस्राएल के वाचा-समुदाय के लिए प्रचलित अभिव्यक्ति है।
- issue: יְצֻוֶּה में आज्ञा देने वाला
  choice: कर्ता को अप्रकट रखा गया
  alternative: जिसकी आज्ञा याहवे ने उसे दी थी
  rationale: इब्रानी क्रिया कर्मवाच्य है और आज्ञा देने वाले का नाम इस उपवाक्य में स्पष्ट रूप से नहीं दोहराती; अनुवाद उसी रूपगत संयम को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘जब-जब’ तथा ‘हटा देता था’ से बार-बार होने वाली क्रिया स्पष्ट होती है। लंबे इब्रानी वाक्य को हिंदी में दो वाक्यों में बाँटा गया है, पर घटनाक्रम और अर्थ-संबंध सुरक्षित हैं।
