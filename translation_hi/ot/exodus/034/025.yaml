  yaml_path: translation/ot/exodus/034/025.yaml
  text: You shall not slaughter the blood of my sacrifice with leaven[a], and the sacrifice of the feast of the Passover shall not remain until the morning.
translation:
  language: hi
  text: तुम मेरे बलिदान का लहू किसी खमीरी वस्तु के साथ न बहाओ, और फसह-पर्व का बलिदान[a] सुबह तक पड़ा न रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पदबंध संक्षिप्त है; इसका अनुवाद “फसह का बलिदान” या “फसह के पर्व का बलिदान” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשְׁחַט ... דַּם זִבְחִי
  choice: मेरे बलिदान का लहू ... न बहाना
  rationale: שׁחט का मूल अर्थ बलि-पशु का वध करना है, पर इब्रानी में उसका कर्म ‘मेरे बलिदान का लहू’ है। हिंदी में ‘लहू बहाना’ इस संक्षिप्त बलिदानी अभिव्यक्ति को स्वाभाविक रखते हुए लहू का स्पष्ट उल्लेख भी बनाए रखता है।
- source_word: עַל חָמֵץ
  choice: किसी खमीरी वस्तु के साथ
  rationale: यहाँ עַל संग-साथ या उपस्थिति का भाव देता है और חָמֵץ किसी खमीर उठी वस्तु को सूचित कर सकता है। यह अनुवाद अनुष्ठान की ठीक प्रक्रिया को आवश्यकता से अधिक निश्चित नहीं करता।
- source_word: יָלִין לַבֹּקֶר
  choice: सुबह तक पड़ा न रहे
  rationale: לין का आशय रात भर बने या छोड़े रहने से है। ‘सुबह तक पड़ा न रहे’ समय-सीमा को स्वाभाविक हिंदी में व्यक्त करता है और अनावश्यक पुनरुक्ति से बचता है।
- source_word: זֶבַח חַג הַפָּסַח
  choice: फसह-पर्व का बलिदान
  rationale: यह चयन זֶבַח, חַג और הַפָּסַח—बलिदान, पर्व और फसह—तीनों तत्वों को संक्षिप्त और स्पष्ट हिंदी में बनाए रखता है।
- source_word: הַפָּסַח
  choice: फसह
  rationale: ‘फसह’ आधुनिक हिंदी बाइबल परंपरा में इस इस्राएली पर्व और उससे जुड़े बलिदान का स्थापित नाम है।
theological_decisions:
- issue: वाचा के पर्व-संबंधी पद को बाद की धर्मवैज्ञानिक धारणाओं से मुक्त रखना
  choice: फसह-पर्व
  alternative: पास्का; फसह का पर्व
  rationale: ‘फसह-पर्व’ पद को उसके तत्कालीन मूसा-संबंधी अनुष्ठानिक संदर्भ में स्पष्ट करता है और कोई बाद की सांप्रदायिक व्याख्या नहीं जोड़ता।
- issue: पहले उपवाक्य की संक्षिप्त इब्रानी बलिदानी अभिव्यक्ति
  choice: मेरे बलिदान का लहू ... न बहाना
  alternative: मेरे बलिदान के पशु का ... वध न करना
  rationale: चुना हुआ रूप ‘लहू’ को स्पष्ट रखता है, जबकि विकल्प निहित ‘पशु’ को पाठ में जोड़कर अभिव्यक्ति की वास्तविक संक्षिप्तता को हल कर देता।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल किंतु गरिमापूर्ण आज्ञात्मक रूप अपनाया गया है। ‘खमीरी वस्तु’ सामान्य पाठक के लिए बोधगम्य है और केवल रोटी तक अर्थ को सीमित नहीं करता; ‘पड़ा न रहे’ रात भर छोड़े जाने की निषेधात्मक आज्ञा को सहज रूप से व्यक्त करता है।
