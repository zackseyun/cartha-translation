base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/018.yaml
  text: You shall keep the Feast of Unleavened Bread[a]. For seven days you shall eat unleavened bread, as I commanded you, at the appointed time in the month of Abib[c][b]; for in the month of Abib you came out from Egypt.
translation:
  language: hi
  text: “अख़मीरी रोटी का पर्व[a] मानना। सात दिन तक अख़मीरी रोटी खाना, जैसा मैंने तुम्हें आज्ञा दी थी, आबिब महीने के नियत समय पर[b]; क्योंकि आबिब महीने में तुम मिस्र से निकले थे[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसे “बिना खमीर की रोटी का उत्सव” भी कहा जा सकता है। इब्रानी शब्द חַג विशेष रूप से किसी पवित्र, नियत पर्व को दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: “आबिब” आरंभिक वसंत का वह प्राचीन महीना था जो मिस्र से निर्गमन की घटना से जुड़ा था।
    reason: cultural_note
  - marker: c
    text: या, “तुम मिस्र से बाहर आए थे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: חַג הַמַּצּוֹת
  choice: अख़मीरी रोटी का पर्व
  rationale: חַג एक पवित्र नियत पर्व को दर्शाता है और מַצּוֹת बिना खमीर की रोटी को। ‘अख़मीरी रोटी का पर्व’ संक्षिप्त, स्वाभाविक और शीर्षक-जैसा है।
- source_word: תִּשְׁמֹר
  choice: मानना
  rationale: पर्व और वाचा-संबंधी आदेश के संदर्भ में שׁמר का अर्थ उसका विधिपूर्वक पालन या आयोजन करना है; हिंदी में ‘पर्व मानना’ सहज और स्पष्ट है।
- source_word: שִׁבְעַת יָמִים תֹּאכַל מַצּוֹת
  choice: सात दिन तक अख़मीरी रोटी खाना
  rationale: यह अवधि और आज्ञा दोनों को सीधे व्यक्त करता है; मַצּוֹת का बहुवचन हिंदी में सामूहिक एकवचन ‘रोटी’ से स्वाभाविक रूप में व्यक्त होता है।
- source_word: אֲשֶׁר צִוִּיתִךָ
  choice: जैसा मैंने तुम्हें आज्ञा दी थी
  rationale: यह पूर्व में दी गई आज्ञा की ओर संकेत करता है और इब्रानी के संबंधवाचक प्रयोग को सहज हिंदी में रखता है।
- source_word: לְמוֹעֵד
  choice: नियत समय पर
  rationale: מוֹעֵד किसी ठहराए हुए समय या ऋतु को दर्शाता है; ‘नियत समय’ धार्मिक संदर्भ को अनावश्यक रूप से विस्तृत किए बिना अर्थ सुरक्षित रखता है।
- source_word: חֹדֶשׁ הָאָבִיב
  choice: आबिब का महीना
  rationale: אָבִיב यहाँ निर्गमन से जुड़े प्राचीन महीने का नाम अथवा पदनाम है; ‘आबिब’ हिंदी बाइबलीय परंपरा में पहचाना जाने वाला लिप्यंतरण है।
- source_word: יָצָאתָ מִמִּצְרָיִם
  choice: तुम मिस्र से निकले थे
  rationale: יצא का मूल अर्थ बाहर निकलना है; यह अनुवाद निर्गमन की घटना को सीधे रखता है और ‘से’ हिंदी में स्रोत-स्थान को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: वाचा-संबंधी पर्व की पदावली
  choice: ‘अख़मीरी रोटी का पर्व’ को औपचारिक पवित्र उत्सव के रूप में प्रस्तुत करना
  alternative: ‘बिना खमीर की रोटी का त्योहार’
  rationale: यह चुनाव इस्राएल को दिए गए ईश्वरीय आदेश और पर्व के औपचारिक महत्व को बनाए रखता है, पर बाद की कोई सांप्रदायिक व्याख्या नहीं जोड़ता।
- issue: द्वितीय पुरुष एकवचन का सामूहिक संदर्भ
  choice: पूरे पद में ‘तुम’ रखना
  alternative: ‘तुम लोग’ या स्पष्ट रूप से ‘इस्राएल’ जोड़ना
  rationale: इब्रानी पाठ द्वितीय पुरुष पुल्लिंग एकवचन में इस्राएल को सामूहिक रूप से संबोधित करता है। ‘तुम’ मूल रूप और सामूहिक अर्थ के बीच की वास्तविक गुंजाइश बनाए रखता है।
- issue: आबिब का नाम और उसका अर्थ
  choice: नाम का लिप्यंतरण मुख्य पाठ में रखना
  alternative: मुख्य पाठ में ‘बालियों का महीना’ या कोई आधुनिक मास-नाम देना
  rationale: यहाँ ऐतिहासिक महीने का पदनाम है; लिप्यंतरण काल-सांस्कृतिक दूरी को सुरक्षित रखता है और टिप्पणी में आवश्यक स्पष्टीकरण देता है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, गरिमापूर्ण किंतु सामान्य पाठकों के लिए सहज रखी गई है। ‘अख़मीरी’ प्रचलित बाइबलीय शब्द है; पादटिप्पणी में अधिक पारदर्शी विकल्प ‘बिना खमीर की’ दिया गया है। पहले वाक्य की आज्ञार्थक शैली हिंदी में विधिक निर्देश की संक्षिप्तता बनाए रखती है।
