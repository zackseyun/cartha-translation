id: EXO.34.1
reference: Exodus 34:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה פְּסָל לְ/ךָ֛ שְׁנֵֽי לֻחֹ֥ת אֲבָנִ֖ים כָּ/רִאשֹׁנִ֑ים וְ/כָתַבְתִּי֙ עַל הַ/לֻּחֹ֔ת אֶת הַ/דְּבָרִ֔ים אֲשֶׁ֥ר הָי֛וּ עַל הַ/לֻּחֹ֥ת הָ/רִאשֹׁנִ֖ים אֲשֶׁ֥ר שִׁבַּֽרְתָּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/001.yaml
  text: Then Yahweh said to Moses[a], “Cut for yourself two stone tablets like the first ones, and I will write on the tablets the words that were on the first tablets[b], which you broke.”
translation:
  language: hi
  text: तब याहवे ने मूसा से कहा, “पहली पटियाओं जैसी पत्थर की दो पटियाएँ अपने लिए तराश ले[a]। मैं उन पटियाओं पर वे वचन लिखूँगा जो पहली पटियाओं पर थे, जिन्हें तूने तोड़ दिया था।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘काटकर बना ले।’
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय आधुनिक हिन्दी में लिप्यंतरित किया गया है।
- source_word: וַיֹּאמֶר
  choice: तब … ने … कहा
  rationale: यह सामान्य कथात्मक वचन-परिचय है; ‘तब’ प्रसंग की अगली घटना को स्वाभाविक हिन्दी में जोड़ता है।
- source_word: פְּסָל
  choice: तराश ले
  rationale: आज्ञा पत्थर को आकार देकर पटियाएँ तैयार करने की है। ‘तराश’ इस ठोस क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְךָ
  choice: अपने लिए
  rationale: इब्रानी दातृवाचक सर्वनाम को स्पष्ट रखा गया है और इससे मूसा द्वारा स्वयं पटियाएँ तैयार करने का भाव बना रहता है।
- source_word: שְׁנֵי לֻחֹת אֲבָנִים
  choice: पत्थर की दो पटियाएँ
  rationale: यह हिन्दी में सामग्री और वस्तु दोनों को स्पष्ट तथा सहज रूप से व्यक्त करता है।
- source_word: כָּרִאשֹׁנִים
  choice: पहली पटियाओं जैसी
  rationale: כ की तुलनात्मक शक्ति और पहले वाली पटियाओं का संदर्भ सुरक्षित रहता है।
- source_word: וְכָתַבְתִּי
  choice: मैं … लिखूँगा
  rationale: प्रथम पुरुष क्रिया को याहवे के भविष्यकालीन कथन के रूप में सीधे अनूदित किया गया है।
- source_word: הַדְּבָרִים
  choice: वे वचन
  rationale: דברים का मूल अर्थ ‘वचन/बातें’ है; ‘आज्ञाएँ’ कहना यहाँ मूल शब्द से अधिक व्याख्यात्मक होता।
- source_word: אֲשֶׁר שִׁבַּרְתָּ
  choice: जिन्हें तूने तोड़ दिया था
  rationale: שבר का साधारण अर्थ ‘तोड़ना’ है; पूर्ण हुई पूर्व घटना को हिन्दी में ‘तोड़ दिया था’ स्वाभाविक रूप से प्रकट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसे उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं करता और प्रचलित विद्वत्तापूर्ण उच्चारण का हिन्दी लिप्यंतरण है।
- issue: הַדְּבָרִים का आशय
  choice: वे वचन
  alternative: वे आज्ञाएँ
  rationale: संदर्भ में ये वाचा की आज्ञाओं को सूचित करते हैं, फिर भी मूल पद केवल ‘वचन/बातें’ कहता है; इसलिए पाठ में व्यापक शब्द रखा गया है ताकि मूल की अभिव्यक्ति और उसका धार्मिक भार दोनों बने रहें।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। परमेश्वर द्वारा मूसा को दिए गए एकवचन आदेश के लिए ‘तू’ का प्रयोग किया गया है, जो हिन्दी बाइबलीय संवाद में निकट और सीधा संबोधन व्यक्त करता है; इसे अनादर का सूचक नहीं समझना चाहिए।
