source:
  edition: WLC
  text: פֶּן תִּכְרֹ֥ת בְּרִ֖ית לְ/יוֹשֵׁ֣ב הָ/אָ֑רֶץ וְ/זָנ֣וּ אַחֲרֵ֣י אֱלֹֽהֵי/הֶ֗ם וְ/זָבְחוּ֙ לֵ/אלֹ֣הֵי/הֶ֔ם וְ/קָרָ֣א לְ/ךָ֔ וְ/אָכַלְתָּ֖ מִ/זִּבְחֽ/וֹ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/015.yaml
  text: lest you make a covenant with the inhabitants of the land[a], and they prostitute themselves after their gods and sacrifice to their gods[c][b], and one of them invites you and you eat from his sacrifice.
translation:
  language: hi
  text: कहीं ऐसा न हो कि तुम उस देश के निवासियों के साथ वाचा बाँधो, और वे अपने देवताओं के पीछे व्यभिचार करते फिरें[a] और अपने देवताओं के लिए बलि चढ़ाएँ; और उनमें से कोई तुम्हें बुलाए[b], और तुम उसकी बलि में से खाओ[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक भाव: “वे अपने देवताओं के पीछे वेश्या की तरह चलें।” इब्रानी में मूर्तिपूजा के लिए यौन बेवफाई का रूपक प्रयुक्त हुआ है।'
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “और वह तुम्हें बुलाए।” यहाँ एकवचन का आशय सम्भवतः वितरणात्मक है—उनमें से कोई एक तुम्हें बुलाए।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “तुम उसकी बलि में से खाओ।” अर्थात उसकी चढ़ाई हुई बलि से जुड़ा भोजन खाओ।
    reason: lexical_clarification
lexical_decisions:
- source_word: פֶּן
  choice: कहीं ऐसा न हो कि
  rationale: यह संभावित अनिष्ट के प्रति चेतावनी प्रस्तुत करता है; यह हिन्दी प्रयोग सावधानी और निषेधात्मक आशय दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: תִּכְרֹת בְּרִית
  choice: वाचा बाँधो
  rationale: शाब्दिक इब्रानी मुहावरा ‘वाचा काटना’ है। ‘वाचा बाँधना’ आधुनिक हिन्दी में स्वाभाविक है और औपचारिक वाचागत संबंध को बनाए रखता है।
- source_word: לְיוֹשֵׁב הָאָרֶץ
  choice: उस देश के निवासियों के साथ
  rationale: एकवचन सामूहिक रूप से देश में रहने वाले लोगों को सूचित करता है; हिन्दी में बहुवचन ‘निवासियों’ से यह अर्थ स्पष्ट होता है।
- source_word: וְזָנוּ אַחֲרֵי אֱלֹהֵיהֶם
  choice: वे अपने देवताओं के पीछे वेश्यागमन करें
  rationale: זנה में निहित यौन-अविश्वासयोग्यता का तीखा रूपक सुरक्षित रखा गया है; केवल ‘पीछे चलें’ कहने से मूल की वाचागत और धार्मिक शक्ति घट जाती।
- source_word: וְזָבְחוּ לֵאלֹהֵיהֶם
  choice: अपने देवताओं के लिए बलि चढ़ाएँ
  rationale: यह देवताओं को उद्दिष्ट बलिदानी उपासना को सहज और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: וְקָרָא לְךָ
  choice: उनमें से कोई तुम्हें बुलाए
  rationale: बहुवचन कर्ताओं के बाद आया इब्रानी एकवचन प्रसंग में वितरणात्मक है; ‘उनमें से कोई’ उस अर्थ को हिन्दी में स्पष्ट रखते हुए व्यक्ति-विशेष की अनिश्चितता बचाता है।
- source_word: וְאָכַלְתָּ מִזִּבְחוֹ
  choice: तुम उसकी बलि में से खाओ
  rationale: यह इब्रानी की निकट अभिव्यक्ति है और मूर्ति-सम्बद्ध बलि के भोजन में भाग लेने का संकेत देती है, बिना मुख्य पाठ में ‘बलिभोज’ जोड़कर अर्थ को अधिक स्पष्ट करने के।
theological_decisions:
- issue: मूर्तिपूजा के लिए यौन-अविश्वासयोग्यता का रूपक
  choice: ‘वेश्यागमन करें’ के द्वारा रूपक स्पष्ट रूप से बनाए रखा गया है।
  alternative: ‘अपने देवताओं के पीछे चलें’ अथवा ‘मूर्तिपूजा करें’।
  rationale: मूल पाठ जानबूझकर मूर्तिपूजा को यौन बेवफाई की भाषा में चित्रित करता है। इसे बनाए रखने से वाचा के प्रति विश्वासघात की साहित्यिक और धर्मवैचारिक तीव्रता सुरक्षित रहती है।
- issue: बहुवचन पूर्वपद के बाद एकवचन ‘वह तुम्हें बुलाए’
  choice: वितरणात्मक अर्थ में ‘उनमें से कोई तुम्हें बुलाए’।
  alternative: ‘वह तुम्हें बुलाए’ अथवा ‘वे तुम्हें बुलाएँ’।
  rationale: एकवचन किसी भी एक निवासी द्वारा दिए जाने वाले निमंत्रण को सामने लाता है। ‘उनमें से कोई’ संख्या को बहुवचन में बदलने के बजाय उस व्यक्तिगत, अनिश्चित परिस्थिति को स्वाभाविक हिन्दी में व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘वाचा’ और ‘बलि’ जैसे स्थापित बाइबिलीय शब्द सुरक्षित हैं। ‘वेश्यागमन’ कुछ औपचारिक है, पर मूल इब्रानी रूपक की तीव्रता को अशिष्टता के बिना बनाए रखता है।
