id: EXO.34.27
reference: Exodus 34:27
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה כְּתָב לְ/ךָ֖ אֶת הַ/דְּבָרִ֣ים הָ/אֵ֑לֶּה כִּ֞י עַל פִּ֣י הַ/דְּבָרִ֣ים הָ/אֵ֗לֶּה כָּרַ֧תִּי אִתְּ/ךָ֛ בְּרִ֖ית וְ/אֶת יִשְׂרָאֵֽל־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/027.yaml
  text: Then Yahweh said to Moses[a], “Write these words for yourself, for according to these words I have made a covenant with you and with Israel.”
translation:
  language: hi
  text: तब याहवे ने मूसा से कहा, “तू ये वचन लिख ले, क्योंकि इन्हीं वचनों के अनुसार मैंने तेरे और इस्राएल के साथ वाचा बाँधी है[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “वाचा काटी है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय उसके प्रचलित हिन्दी लिप्यंतरण में रखा गया है।
- source_word: כְּתָב לְךָ
  choice: तू ये वचन लिख ले
  rationale: आज्ञार्थक כְּתָב को सीधे रूप में प्रस्तुत किया गया है। हिन्दी का ‘लिख ले’ לְךָ के व्यक्तिगत सहभागिता अथवा हित के भाव को स्वाभाविक ढंग से व्यक्त करता है; अस्वाभाविक ‘अपने लिए लिख’ से बचा गया है।
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: ये वचन
  rationale: विधिक और वाचागत प्रसंग में דְּבָרִים के लिए ‘वचन’ उपयुक्त है और पद में इसकी पुनरावृत्ति भी सुरक्षित रखी गई है।
- source_word: כִּי עַל פִּי הַדְּבָרִים הָאֵלֶּה
  choice: क्योंकि इन्हीं वचनों के अनुसार
  rationale: כִּי का कारणसूचक बल और עַל־פִּי का ‘के अनुसार/के आधार पर’ अर्थ स्पष्ट तथा स्वाभाविक हिन्दी में रखा गया है। ‘इन्हीं’ उन पूर्वोक्त वचनों पर बल को सहज रूप से दर्शाता है।
- source_word: כָּרַתִּי ... בְּרִית
  choice: मैंने ... वाचा बाँधी है
  rationale: ‘वाचा बाँधना’ हिन्दी में covenant बनाने की स्वाभाविक और प्रतिष्ठित अभिव्यक्ति है। पूर्ण क्रिया को वर्तमान प्रासंगिकता सहित ‘बाँधी है’ कहा गया है; मूल इब्रानी के शाब्दिक ‘वाचा काटना’ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: אִתְּךָ וְאֶת יִשְׂרָאֵל
  choice: तेरे और इस्राएल के साथ
  rationale: मूसा और इस्राएल दोनों को वाचा के सहभागी के रूप में स्पष्ट रखा गया है। एकवचन सम्बोधन के अनुरूप ‘तेरे’ चुना गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: व्यक्तिगत वाचागत नाम को सुरक्षित रखा गया है और उसके स्थान पर उपाधि नहीं रखी गई।
- issue: כרת ברית वाचा-संबंधी मुहावरा
  choice: वाचा बाँधी है
  alternative: वाचा काटी है; वाचा स्थापित की है
  rationale: मुख्य पाठ में अर्थपूर्ण और स्वाभाविक हिन्दी चुनी गई है, जबकि मूल इब्रानी की ठोस शाब्दिक अभिव्यक्ति पादटिप्पणी में दी गई है। इससे अर्थ स्पष्ट रहता है और मूल मुहावरा भी छिपता नहीं।
- issue: मूसा और इस्राएल के साथ वाचा
  choice: तेरे और इस्राएल के साथ
  alternative: तेरे साथ, अर्थात इस्राएल के साथ
  rationale: मूल पाठ दोनों को समन्वित रूप से रखता है; उनके संबंध को व्याख्यात्मक रूप से एक-दूसरे में विलीन नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। एकवचन सम्बोधन ‘तू/तेरे’ प्राचीन कथात्मक संवाद में निकटता और मूल के व्याकरणिक एकवचन को व्यक्त करता है। पादटिप्पणी-चिह्न को उसी वाक्यांश के बाद रखा गया है जिसकी शाब्दिक वैकल्पिक अभिव्यक्ति पादटिप्पणी में दी गई है।
