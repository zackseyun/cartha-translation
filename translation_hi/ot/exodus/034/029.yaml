base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/029.yaml
  text: And it happened[a], when Moses came down from Mount Sinai with the two tablets of the testimony in Moses' hand as he came down from the mountain[c][b], that Moses did not know that the skin of his face shone because he had spoken with him.
translation:
  language: hi
  text: और ऐसा हुआ कि जब मूसा सीनै पर्वत से उतरा—पर्वत से उतरते समय साक्षी की दोनों पटियाएँ मूसा के हाथ में थीं—तब मूसा को यह मालूम न था कि उससे[b] बात करने के कारण[c] उसके चेहरे की त्वचा चमक रही थी[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दमक रही थी” अथवा “उससे किरणें निकल रही थीं।” इब्रानी क्रिया किरणें उत्सर्जित करने का भाव दे सकती है। इसका एक ऐतिहासिक अनुवाद “सींगयुक्त था” है, पर वह इस प्रसंग के कम अनुकूल है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात, यहोवा से।
    reason: referent_clarification
  - marker: c
    text: 'इस वाक्यांश को कालवाचक भी समझा जा सकता है: “जब वह उससे बात कर रहा था।”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: और ऐसा हुआ कि
  rationale: यह इब्रानी कथात्मक सूत्र नए दृश्य का आरम्भ करता है। यह रूप उसके प्रवाह को बनाए रखते हुए हिन्दी में गरिमापूर्ण और स्वाभाविक है।
- source_word: בְּרֶדֶת ... בְּרִדְתּוֹ
  choice: जब ... उतरा—पर्वत से उतरते समय
  rationale: दोनों कालवाचक प्रयोगों की पुनरावृत्ति स्रोत में कथात्मक चौखटे का भाग है, इसलिए उसे हटाया नहीं गया।
- source_word: מֵהַר סִינַי
  choice: सीनै पर्वत से
  rationale: स्थान-नाम का प्रचलित और स्वाभाविक हिन्दी रूप।
- source_word: שְׁנֵי לֻחֹת הָעֵדֻת
  choice: साक्षी की दोनों पटियाएँ
  rationale: לֻחֹת के लिए ठोस पटियाओं का बोध और עֵדוּת का वाचा-संबंधी 'साक्षी' अर्थ सुरक्षित रखा गया है।
- source_word: בְּיַד מֹשֶׁה
  choice: मूसा के हाथ में
  rationale: इब्रानी के एकवचन और ठोस चित्र को बनाए रखा गया है; हिन्दी में यह स्वाभाविक है।
- source_word: לֹא יָדַע
  choice: मूसा को यह मालूम न था
  rationale: नकारात्मक ידע का सीधा, सहज हिन्दी रूप।
- source_word: קָרַן
  choice: चमक रही थी
  rationale: इस प्रसंग में क्रिया चेहरे से प्रकाश या किरणें निकलने का बोध देती है। 'चमक रही थी' स्पष्ट, स्वाभाविक और संदर्भानुकूल है।
- source_word: עוֹר פָּנָיו
  choice: उसके चेहरे की त्वचा
  rationale: स्रोत केवल 'चेहरा' नहीं, स्पष्टतः चेहरे की त्वचा कहता है; उस विशिष्टता को रखा गया है।
- source_word: בְּדַבְּרוֹ אִתּוֹ
  choice: उससे हुई बातचीत के कारण
  rationale: मुख्य पाठ में कारणवाचक संबंध अपनाया गया है, पर बोलने वाले कर्ता को अनावश्यक रूप से निश्चित किए बिना इब्रानी की सर्वनामगत अस्पष्टता बचाई गई है; कालवाचक संभावना पादटिप्पणी में दी गई है।
- source_word: אִתּוֹ
  choice: उससे
  rationale: इब्रानी में नाम के बजाय सर्वनाम है। मुख्य पाठ में सर्वनाम रखा गया और संदर्भगत संकेत पादटिप्पणी में स्पष्ट किया गया है।
theological_decisions:
- issue: मूसा के चेहरे के विषय में קָרַן का अर्थ
  choice: चमकना या किरणें निकलना
  alternative: सींग निकलना
  rationale: निकटवर्ती प्रसंग मूसा की परमेश्वर-संगति के बाद दिखाई देने वाली महिमा और इस्राएलियों के भय का वर्णन करता है। इसलिए प्रकाशमान होने का अर्थ संदर्भ के सर्वाधिक अनुकूल है; ऐतिहासिक वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- issue: בְּדַבְּרוֹ אִתּוֹ में बोलने वाला और सर्वनाम का संदर्भ
  choice: मुख्य पाठ में कर्ता को अनिर्धारित रखते हुए 'उससे हुई बातचीत' और संदर्भतः यहोवा
  alternative: स्पष्ट करना कि मूसा ने यहोवा से बात की, अथवा यहोवा ने मूसा से बात की
  rationale: इब्रानी रूप सर्वनामों से व्यक्त है और कर्ता को हिन्दी में किसी एक दिशा में निश्चित करना पाठ की वास्तविक अस्पष्टता को घटा देगा। संदर्भ में 'उससे' का आशय यहोवा है।
- issue: בְּדַבְּרוֹ का कारणवाचक या कालवाचक संबंध
  choice: बातचीत के कारण
  alternative: जब बातचीत हुई
  rationale: प्रसंग चेहरे की चमक को परमेश्वर से हुई बातचीत का परिणाम बताने का समर्थन करता है, फिर भी इब्रानी בְּ + infinitive का कालवाचक अर्थ संभव है और उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, कथात्मक किंतु गरिमापूर्ण रखी गई है। स्रोत की दोहरी 'उतरने' वाली रचना को डैश के सहारे स्पष्ट बनाया गया है। 'पटियाएँ', 'साक्षी' और 'चेहरे की त्वचा' स्रोत की ठोस वाचा-संबंधी शब्दावली को सुरक्षित रखते हैं; अस्पष्टता को पादटिप्पणियों के साथ जानबूझकर बनाए रखा गया है।
