  text: רֵאשִׁ֗ית בִּכּוּרֵי֙ אַדְמָ֣תְ/ךָ֔ תָּבִ֕יא בֵּ֖ית יְהוָ֣ה אֱלֹהֶ֑י/ךָ לֹא תְבַשֵּׁ֥ל גְּדִ֖י בַּ/חֲלֵ֥ב אִמּֽ/וֹ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/026.yaml
  text: You shall bring the first of the firstfruits of your ground to the house of Yahweh your God[a]. You shall not boil a young goat in its mother's milk.
translation:
  language: hi
  text: '“अपनी भूमि की पहली उपज में से पहला भाग अपने परमेश्वर याहवे के भवन में ले आना।[a]


    बकरी के बच्चे को उसकी माँ के दूध में न उबालना।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक शाब्दिक रूप से, “अपनी भूमि की पहली उपज का पहला भाग।”
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵאשִׁית בִּכּוּרֵי
  choice: पहली उपज में से पहला भाग
  rationale: यह अनुवाद רֵאשִׁית के प्राथमिक अर्थ ‘पहला/आरंभिक भाग’ और בִּכּוּרִים के उपासना-संबंधी अर्थ ‘पहली उपज’—दोनों को बनाए रखता है। ‘सबसे उत्तम भाग’ संभव अर्थ है, पर वह गुणवत्ता का भाव अधिक स्पष्ट कर देता है।
- source_word: אַדְמָתְךָ
  choice: अपनी भूमि
  rationale: यहाँ אֲדָמָה खेती से उपज देने वाली भूमि को दर्शाता है। ‘भूमि’ आधुनिक हिन्दी में स्वाभाविक है और कृषि-संदर्भ को स्पष्ट रखता है।
- source_word: תָּבִיא
  choice: ले आना
  rationale: हिफ़ील अपूर्ण क्रिया यहाँ विधिक आज्ञा है। ‘ले आना’ गंतव्य तक वस्तु पहुँचाने के अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: בֵּית יְהוָה אֱלֹהֶיךָ
  choice: याहवे, अपने परमेश्वर के भवन में
  rationale: בֵּית का मूल अर्थ ‘भवन/घर’ है और यहाँ पवित्रस्थान अभिप्रेत है; ‘मन्दिर’ कहना इस ऐतिहासिक संदर्भ में अनावश्यक रूप से विशिष्ट होता। याहवे को व्यक्तिगत ईश्वरीय नाम के रूप में लिप्यंतरित किया गया है।
- source_word: לֹא תְבַשֵּׁל
  choice: न उबालना
  rationale: בשל यहाँ दूध में पकाने अथवा उबालने को दर्शाता है। ‘उबालना’ अधिक विशिष्ट है और मूल विधान की ठोस छवि बनाए रखता है।
- source_word: גְּדִי
  choice: बकरी के बच्चे
  rationale: यह आधुनिक हिन्दी में स्पष्ट रूप से कम उम्र की बकरी को दर्शाता है और किसी अस्पष्ट पारंपरिक पद से बचता है।
- source_word: בַּחֲלֵב אִמּוֹ
  choice: उसकी माँ के दूध में
  rationale: यह मूल संबंध और माध्यम दोनों को स्वाभाविक हिन्दी में यथावत रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे उपस्थित है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
- issue: רֵאשִׁית בִּכּוּרֵי में प्राथमिकता अथवा उत्कृष्टता
  choice: पहली उपज में से पहला भाग
  alternative: पहली उपज का सर्वोत्तम भाग
  rationale: רֵאשִׁית मूलतः आरंभ अथवा पहला भाग व्यक्त करता है, यद्यपि ऐसे भेंट-संदर्भ में वह चुने हुए या उत्तम भाग का संकेत भी दे सकता है। मुख्य पाठ में कालगत/क्रमगत अर्थ रखा गया और वैकल्पिक गुणात्मक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सीधी विधिक हिन्दी अपनाई गई है। एकवचन संबोधन को हिन्दी की स्वाभाविक आज्ञार्थक रचना ‘ले आना/न उबालना’ से व्यक्त किया गया है। ‘भवन’ मूल रूपक को बनाए रखता है, जबकि ‘मन्दिर’ जैसी अधिक ऐतिहासिक रूप से विशिष्ट संज्ञा से बचा गया है।
