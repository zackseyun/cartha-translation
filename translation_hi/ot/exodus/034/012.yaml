  text: הִשָּׁ֣מֶר לְ/ךָ֗ פֶּן תִּכְרֹ֤ת בְּרִית֙ לְ/יוֹשֵׁ֣ב הָ/אָ֔רֶץ אֲשֶׁ֥ר אַתָּ֖ה בָּ֣א עָלֶ֑י/הָ פֶּן יִהְיֶ֥ה לְ/מוֹקֵ֖שׁ בְּ/קִרְבֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/012.yaml
  text: Be careful[a], lest you make a covenant with the inhabitants of the land into which you are going[d][c][b], lest it become a snare in your midst.
translation:
  language: hi
  text: सावधान रहो[a], कहीं तुम उस देश के निवासियों से, जिसमें तुम जा रहे हो, वाचा न कर लो[b]; कहीं वह तुम्हारे बीच फंदा न बन जाए[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने विषय में चौकस रहो” अथवा “अपना ध्यान रखो।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “वाचा काटो”; यह वाचा करने का मुहावरा है।
    reason: lexical_alternative
  - marker: c
    text: या “जाल।” यहाँ “वह” का सबसे स्वाभाविक संकेत वाचा की ओर है; देश के निवासियों अथवा पूरी परिस्थिति की ओर संकेत भी संभव माना जा सकता है।
    reason: ambiguity
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: सावधान रहो
  rationale: निफ़ाल आज्ञार्थक और לְךָ मिलकर आत्म-संबंधी चेतावनी देते हैं। ‘सावधान रहो’ आधुनिक हिन्दी में इस बल को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: פֶּן ... פֶּן
  choice: कि ... न; कहीं ऐसा न हो कि
  rationale: दोनों बार פֶּן निषेधात्मक चेतावनी प्रकट करता है। हिन्दी में एक ही पदावली दोहराने के बजाय ये दो स्वाभाविक रचनाएँ मूल की क्रमिक चेतावनी बनाए रखती हैं।
- source_word: תִּכְרֹת בְּרִית
  choice: वाचा बाँधो
  rationale: शाब्दिक अर्थ ‘वाचा काटना’ है, पर यह वाचा करने का इब्रानी मुहावरा है। ‘वाचा बाँधना’ हिन्दी का सुबोध मुहावरा है और संबंध स्थापित करने का भाव भी रखता है।
- source_word: לְיוֹשֵׁב הָאָרֶץ
  choice: देश के निवासियों के साथ
  rationale: एकवचन कृदंत यहाँ सामूहिक अर्थ में है, इसलिए बहुवचन ‘निवासियों’ उपयुक्त है। לְ को वाचा के पक्षकार के संदर्भ में ‘के साथ’ से व्यक्त किया गया है।
- source_word: אֲשֶׁר אַתָּה בָּא עָלֶיהָ
  choice: जिस देश में तुम जा रहे हो
  rationale: בוא + על यहाँ उस देश की ओर जाकर उसमें प्रवेश करने को दर्शाता है। ‘में जा रहे हो’ आधुनिक हिन्दी में स्वाभाविक है; ‘प्रवेश करनेवाले हो’ भी संभव है।
- source_word: יִהְיֶה לְמוֹקֵשׁ
  choice: वह ... एक फंदा बन जाए
  rationale: निकटतम संभावित पूर्वपद वाचा है। מוֹקֵשׁ पकड़ने वाले फंदे या जाल का रूपक है; ‘फंदा’ उलझाव और संकट दोनों को स्पष्ट रखता है।
- source_word: בְּקִרְבֶּךָ
  choice: तुम्हारे बीच
  rationale: यह सामुदायिक परिवेश में ‘तुम्हारे मध्य/बीच’ को सूचित करता है। ‘तुम्हारे बीच’ सहज हिन्दी है और इसे केवल व्यक्ति के अंतर्मन तक सीमित नहीं करता।
theological_decisions:
- issue: अंतिम एकवचन क्रिया יִהְיֶה का पूर्वपद
  choice: वाचा फंदा बनती है
  alternative: देश के निवासी, अथवा पूरी परिस्थिति, फंदा बनती है
  rationale: व्याकरण और वाक्य-समीपता के आधार पर ‘वाचा’ सबसे स्वाभाविक पूर्वपद है। फिर भी इब्रानी एकवचन के कारण संदर्भगत व्यापकता पूरी तरह असंभव नहीं है; अनुवाद निकटतम अर्थ चुनता है, जबकि टिप्पणी विकल्प बताती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘वाचा’ बाइबलीय-सांस्कृतिक शब्दावली को बनाए रखता है, जबकि ‘वाचा बाँधना,’ ‘तुम्हारे बीच’ और ‘फंदा’ स्वाभाविक हिन्दी देते हैं। एकवचन ‘तुम’ मूल पाठ में इस्राएल को सामूहिक रूप से संबोधित करता है।
