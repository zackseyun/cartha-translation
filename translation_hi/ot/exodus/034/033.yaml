translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, कथात्मक और गरिमापूर्ण शैली। ‘उनसे बात करना’ ने אִתָּם के ‘साथ’ वाले भाव को सहज हिन्दी में रखा है, और पादटिप्पणी כלה के ‘समाप्त करना/बंद करना’ संबंधी वैकल्पिक अर्थ को सुरक्षित रखती है।
