  footnotes:
  - marker: a
    text: या, “उनसे बात करना बंद किया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַל
  choice: समाप्त कर चुका
  rationale: כלה का यह रूप बोलने की क्रिया की समाप्ति बताता है। संयुक्त क्रिया ‘समाप्त कर चुका’ आधुनिक हिन्दी में स्वाभाविक ढंग से पूर्णता व्यक्त करती है।
- source_word: מִדַּבֵּר
  choice: बात करना
  rationale: כלה के बाद מִן सहित infinitive बोलने की क्रिया के समाप्त होने को व्यक्त करता है; हिन्दी में ‘बात करना समाप्त’ स्वाभाविक है।
- source_word: אִתָּם
  choice: उनसे
  rationale: אֵת का मूल अर्थ यहाँ ‘उनके साथ’ है। बातचीत के प्रसंग में हिन्दी का ‘उनसे बात करना’ सहभागिता का भाव स्वाभाविक रूप से रखता है; ‘उन्हें’ संबोधन का अर्थ अधिक निश्चित कर देता।
- source_word: וַיִּתֵּן
  choice: डाल लिया
  rationale: נתן עַל यहाँ किसी वस्तु को ऊपर रखने या ओढ़ने का अर्थ देता है। चेहरे के परदे के लिए ‘परदा डाल लिया’ सहज हिन्दी प्रयोग है और कर्ता के अपने चेहरे पर किए गए कार्य को स्पष्ट करता है।
- source_word: עַל פָּנָיו
  choice: अपने चेहरे पर
  rationale: प्रतिवर्ती स्वामित्व हिन्दी में ‘अपने’ से स्वाभाविक और स्पष्ट होता है; עַל को ‘पर’ से सीधे व्यक्त किया गया है।
- source_word: מַסְוֶה
  choice: परदा
  rationale: यह संज्ञा प्रसंग में चेहरे को ढकने वाली वस्तु को दर्शाती है। ‘परदा’ सामान्य आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
