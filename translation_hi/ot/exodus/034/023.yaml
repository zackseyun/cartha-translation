  text: שָׁלֹ֥שׁ פְּעָמִ֖ים בַּ/שָּׁנָ֑ה יֵרָאֶה֙ כָּל זְכ֣וּרְ/ךָ֔ אֶת פְּנֵ֛י הָֽ/אָדֹ֥ן יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/023.yaml
  text: Three times in the year all your males shall appear before the Lord Yahweh[b][a], the God of Israel.
translation:
  language: hi
  text: वर्ष में तीन बार तुम्हारे सभी पुरुष प्रभु यहोवा[a], इस्राएल के परमेश्वर, के सामने[b] उपस्थित हों।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में यहाँ ‘प्रभु’ की उपाधि के बाद परमेश्वर का नाम YHWH आता है, जिसे यहाँ ‘यहोवा’ लिखा गया है।
    reason: alternative_reading
  - marker: b
    text: इब्रानी में शाब्दिक रूप से ‘के मुख के सामने’; इसका अर्थ ‘के सामने’ या ‘की उपस्थिति में’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלֹשׁ פְּעָמִים בַּשָּׁנָה
  choice: वर्ष में तीन बार
  rationale: यह इब्रानी मुहावरा वार्षिक चक्र में तीन अवसरों को सीधे व्यक्त करता है; हिंदी में यह क्रम स्वाभाविक और स्पष्ट है।
- source_word: יֵרָאֶה
  choice: उपस्थित हों
  rationale: यह निफ़अल रूप उपासना-संबंधी प्रसंग में परमेश्वर के सम्मुख आने का प्रचलित भाव रखता है। ‘दिखाई दें’ अनावश्यक रूप से निष्क्रिय लगेगा।
- source_word: כָּל זְכוּרְךָ
  choice: तुम्हारे सभी पुरुष
  rationale: मूल पाठ पुरुष सदस्यों को स्पष्ट रूप से निर्दिष्ट करता है; यह चयन उस लिंग-विशिष्ट दायित्व को बनाए रखते हुए आधुनिक हिंदी में सहज है।
- source_word: אֶת פְּנֵי
  choice: के सामने
  rationale: शाब्दिक अर्थ ‘के मुख के सामने’ है, पर यह उपस्थिति दर्शाने वाला इब्रानी मुहावरा है; ‘के सामने’ स्वाभाविक हिंदी समतुल्य है।
- source_word: הָאָדֹן
  choice: प्रभु
  rationale: निश्चित उपपद सहित אָדוֹן यहाँ परमेश्वर की उपाधि है। ‘प्रभु’ प्रतिष्ठित और स्वाभाविक हिंदी रूप है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल में परमेश्वर का व्यक्तिगत नाम YHWH है। हिंदी पाठकों में प्रचलित लिप्यंतरण ‘यहोवा’ उपाधि ‘प्रभु’ से इसका भेद बनाए रखता है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर
  rationale: यह संबंधवाचक पदबंध YHWH की पहचान इस्राएल के परमेश्वर के रूप में करता है; हिंदी में यह पारदर्शी और प्रचलित अनुवाद है।
theological_decisions:
- issue: הָאָדֹן और יְהוָה को साथ प्रस्तुत करना
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर / प्रभु, यहोवा
  rationale: मूल पाठ में एक उपाधि और उसके बाद दिव्य नाम है। ‘प्रभु यहोवा’ दोनों को अलग पहचान देता है और अनावश्यक विराम लगाकर उनके संबंध को निर्धारित नहीं करता।
- issue: वाचा-संबंधी उत्सव में लिंग-विशिष्ट दायित्व
  choice: तुम्हारे सभी पुरुष
  alternative: तुम सब / तुम्हारे सभी लोग
  rationale: זְכוּר पुरुषों को स्पष्ट रूप से निर्दिष्ट करता है; लिंग-निरपेक्ष रूप मूल के दायरे को बदल देगा।
- issue: יֵרָאֶה का आदेशात्मक/नियमात्मक बल
  choice: उपस्थित हों
  alternative: उपस्थित होंगे
  rationale: इस विधिक प्रसंग में अपूर्ण क्रिया दायित्व व्यक्त करती है। हिंदी में ‘हों’ नियमात्मक बल को स्वाभाविक रूप से दर्शाता है, जबकि ‘होंगे’ भविष्यवाणी जैसा लग सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। वाक्य-विन्यास हिंदी के अनुरूप है, जबकि विधिक बल, पुरुषों के स्पष्ट उल्लेख और ‘प्रभु’ तथा दिव्य नाम के भेद को सुरक्षित रखा गया है।
