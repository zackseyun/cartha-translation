  text: छह दिन तक काम करना, परन्तु सातवें दिन काम बंद करना[a]; जुताई और कटनी के समय भी काम बंद करना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “विश्राम करना।” इब्रानी क्रिया का मूल अर्थ रुकना या बंद करना है, और विस्तृत अर्थ में विश्राम करना भी है।
