lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: छह दिन
  rationale: संख्या और बहुवचन संज्ञा मिलकर छह दिनों की अवधि बताते हैं। संक्षिप्त रूप इब्रानी की अभिव्यक्ति और अगले आदेश के साथ उसके सीधे संबंध को बनाए रखता है।
- source_word: תַּעֲבֹד
  choice: काम करना
  rationale: यहाँ क़ाल अपूर्ण रूप वाचा-संबंधी निर्देश का बल रखता है। हिंदी में अनंत क्रिया वाला आदेश स्वाभाविक है और इसे केवल अनुमति के रूप में प्रस्तुत नहीं करता।
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: परन्तु सातवें दिन
  rationale: वाव का मूल अर्थ ‘और’ हो सकता है, किन्तु यहाँ छह कार्य-दिवसों और सातवें दिन के बीच स्पष्ट विरोध है; ‘परन्तु’ उसी वाक्यगत संबंध को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: תִּשְׁבֹּת
  choice: काम बन्द रखना
  rationale: שׁבת का मूल भाव किसी गतिविधि को रोकना या उससे विरत होना है। ‘काम बन्द रखना’ हिंदी में स्पष्ट करता है कि प्रसंग श्रम से विरत रहने का है, जबकि ‘विश्राम’ को एकमात्र अर्थ बनाकर पाठ को संकुचित नहीं करता।
- source_word: בֶּחָרִישׁ
  choice: जुताई के समय
  rationale: חָרִישׁ जुताई अथवा जुताई के मौसम को सूचित करता है। ‘के समय’ पूर्वसर्ग के कालवाचक अर्थ और कृषि-मौसम की धारणा दोनों को सहज ढंग से व्यक्त करता है।
- source_word: וּבַקָּצִיר
  choice: और कटनी के समय
  rationale: קָצִיר कटनी या कटनी के मौसम को दर्शाता है। ‘कटनी के समय’ समानांतर कृषि-अवधि को साफ और सामान्य हिंदी में व्यक्त करता है।
- source_word: תִּשְׁבֹּת (दूसरा प्रयोग)
  choice: भी काम बन्द रखना
  rationale: इब्रानी में क्रिया की पुनरावृत्ति पर बल है। हिंदी में वही वाक्यांश दोहराया गया है और ‘भी’ से यह स्पष्ट किया गया है कि व्यस्त कृषि-मौसम में भी सातवें दिन का विराम लागू रहता है।
theological_decisions:
- issue: सब्त से संबंधित क्रिया שׁבת का अनुवाद
  choice: दोनों स्थानों पर ‘काम बन्द रखना’
  alternative: ‘विश्राम करना’
  rationale: पद का प्रमुख बल सातवें दिन श्रम रोकने पर है, यहाँ तक कि जुताई और कटनी जैसे अत्यावश्यक कृषि-समयों में भी। यह चयन क्रिया के मूल अर्थ को रखता है और ‘विश्राम’ की वैध वैकल्पिक छाया को पादटिप्पणी में सुरक्षित करता है।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण आदेशात्मक शैली अपनाई गई है। एकवचन संबोधन हिंदी में स्वाभाविक रूप से निहित है। ‘जुताई’ और ‘कटनी’ सामान्य पाठकों के लिए परिचित कृषि-शब्द हैं; क्रिया की इब्रानी पुनरावृत्ति को हिंदी में भी बनाए रखा गया है।
