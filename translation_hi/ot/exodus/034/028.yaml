base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/028.yaml
  text: And he was there with Yahweh forty days and forty nights[a]; he ate no bread and drank no water. And he wrote on the tablets the words of the covenant[b], the ten words.
translation:
  language: hi
  text: वह वहाँ याहवे के साथ चालीस दिन और चालीस रात रहा। उसने न रोटी खाई, न पानी पिया। और उसने[a] पटियाओं पर वाचा के वचन, अर्थात् दस वचन[b], लिखे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और याहवे ने लिखा,” क्योंकि अन्य स्थानों पर पटियाओं पर लिखने का कार्य याहवे का बताया गया है (देखें निर्गमन 34:1; व्यवस्थाविवरण 10:4)।
    reason: alternative_reading
  - marker: b
    text: हिब्रू में “दस वचन”; परंपरागत रूप से, “दस आज्ञाएँ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उसके हिब्रू रूप के निकट लिप्यंतरित किया गया है, ताकि मूल पाठ में प्रयुक्त नाम बना रहे।
- source_word: וַיְהִי שָׁם עִם
  choice: वह वहाँ ... के साथ ... रहा
  rationale: यह मूसा की उपस्थिति और अवधि दोनों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है, बिना अतिरिक्त अर्थ जोड़े।
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לַיְלָה
  choice: चालीस दिन और चालीस रात
  rationale: अवधि-सूचक हिब्रू पदबंध का सीधा और प्रचलित हिन्दी रूप।
- source_word: לֶחֶם לֹא אָכַל
  choice: उसने न रोटी खाई
  rationale: हिब्रू के ठोस शब्द ‘रोटी’ को ‘भोजन’ जैसे व्यापक शब्द से नहीं बदला गया; साथ ही अगले समानांतर खंड के साथ हिन्दी की सहज ‘न... न...’ संरचना रखी गई है।
- source_word: וּמַיִם לֹא שָׁתָה
  choice: न पानी पिया
  rationale: मूल का सीधा अर्थ और पिछले खंड के साथ उसका समानांतर रूप सुरक्षित है।
- source_word: וַיִּכְתֹּב
  choice: और उसने लिखा
  rationale: क्रिया पुल्लिंग एकवचन है और कर्ता का नाम दुबारा नहीं दिया गया। निकटवर्ती व्याकरणिक प्रवाह में ‘वह/उसने’ मूसा की ओर संकेत करता है, पर व्यापक संदर्भ में याहवे को कर्ता समझने की संभावना पाद-टिप्पणी में सुरक्षित रखी गई है।
- source_word: עַל הַלֻּחֹת
  choice: पटियाओं पर
  rationale: पत्थर की वाचा-पटियाओं के लिए यह स्पष्ट, प्रचलित और प्रसंगानुकूल हिन्दी है।
- source_word: דִּבְרֵי הַבְּרִית
  choice: वाचा के वचन
  rationale: यह हिब्रू संबंध-पदबंध और उसके वाचागत महत्व को निकटता से बनाए रखता है।
- source_word: עֲשֶׂרֶת הַדְּבָרִים
  choice: दस वचन
  rationale: हिब्रू का शाब्दिक अर्थ ‘दस वचन/बातें’ है। ‘दस आज्ञाएँ’ पारंपरिक और परिचित रूप है, इसलिए उसे पाद-टिप्पणी में दिया गया है।
theological_decisions:
- issue: अंतिम खंड ‘और उसने लिखा’ का कर्ता
  choice: मुख्य पाठ में अस्पष्ट सर्वनाम ‘उसने’ रखा गया है, जिसका निकटतम व्याकरणिक संकेत मूसा की ओर है।
  alternative: ‘और याहवे ने लिखा’
  rationale: हिब्रू क्रिया कर्ता का नाम स्पष्ट नहीं करती। इसी पद के तात्कालिक प्रवाह में मूसा लगातार कर्ता है, जबकि निर्गमन 34:1 और व्यवस्थाविवरण 10:4 पटियाओं पर लिखने का कार्य याहवे को सौंपते हैं। मुख्य पाठ और पाद-टिप्पणी मिलकर इस वास्तविक तनाव को बिना समरस किए सुरक्षित रखते हैं।
- issue: עֲשֶׂרֶת הַדְּבָרִים का अनुवाद
  choice: दस वचन
  alternative: दस आज्ञाएँ
  rationale: ‘दस वचन’ मूल हिब्रू की शब्दावली को प्रत्यक्ष रूप से दर्शाता है; परिचित पारंपरिक पद ‘दस आज्ञाएँ’ को व्याख्यात्मक विकल्प के रूप में पाद-टिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज और गरिमापूर्ण रखी गई है। वाक्य-रचना मूल के क्रम और समानांतरता के निकट है। ‘याहवे’, ‘वाचा’, ‘पटियाएँ’ और ‘दस वचन’ स्रोत-पारदर्शिता बनाए रखते हैं; जहाँ पाठक को पारंपरिक अभिव्यक्ति या वैकल्पिक कर्ता जानना आवश्यक है, वहाँ संक्षिप्त पाद-टिप्पणी दी गई है।
