translation:
  language: hi
  text: मूसा तुरन्त भूमि की ओर झुका और आराधना की।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: तुरन्त
  rationale: क्रिया מהר शीघ्रता से कार्य करने का भाव व्यक्त करती है। यहाँ ‘तुरन्त’ मूसा की तत्काल प्रतिक्रिया को स्वाभाविक आधुनिक हिन्दी में प्रकट करता है।
- source_word: מֹשֶׁה
  choice: मूसा
  rationale: हिन्दी बाइबल परम्परा में इस नाम का मानक और व्यापक रूप।
- source_word: וַיִּקֹּד
  choice: सिर झुकाया
  rationale: קדד शरीर या सिर को नीचे झुकाने का संकेत देता है। ‘सिर झुकाया’ अगले उपासना-सूचक क्रियापद से अलग इस प्रथम शारीरिक क्रिया को स्पष्ट रखता है।
- source_word: אַרְצָה
  choice: भूमि तक
  rationale: दिशासूचक रूप नीचे, भूमि की ओर गति को दर्शाता है; ‘भूमि तक’ झुकने की गहराई को सहज हिन्दी में व्यक्त करता है।
- source_word: וַיִּשְׁתָּחוּ
  choice: दण्डवत् करके आराधना की
  rationale: שחה का यह रूप श्रद्धापूर्वक दण्डवत् होने और उपासना करने दोनों का भाव रख सकता है। प्रसंग में यह यहोवा के आत्म-प्रकाशन के प्रति मूसा की आराधनापूर्ण प्रतिक्रिया है; इस संयुक्त अभिव्यक्ति से शारीरिक मुद्रा और धार्मिक आशय दोनों सुरक्षित रहते हैं।
theological_decisions:
- issue: अन्तिम क्रिया को केवल शारीरिक दण्डवत् मानना या आराधना के रूप में व्यक्त करना
  choice: दण्डवत् करके आराधना की
  alternative: दण्डवत् हुआ
  rationale: प्रसंग में मूसा यहोवा के आत्म-प्रकाशन का श्रद्धापूर्वक उत्तर देता है। इब्रानी क्रिया शारीरिक रूप से झुकने को भी सूचित कर सकती है, पर यहाँ आराधना का आशय प्रबल है। संयुक्त हिन्दी अभिव्यक्ति किसी एक पहलू को दबाए बिना दोनों को रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘दण्डवत्’ व्यापक रूप से समझा जाने वाला धार्मिक-सांस्कृतिक शब्द है; ‘आराधना की’ उसके उपासना-संबंधी आशय को स्पष्ट करता है।
