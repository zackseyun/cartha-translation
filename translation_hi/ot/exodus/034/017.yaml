  text: You shall not make cast-metal gods for yourself[a].
translation:
  language: hi
  text: तुम अपने लिए धातु में ढले हुए देवता[a] न बनाना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ढले हुए देवता” अथवा “धातु के देवता।”
    reason: מַסֵּכָה साँचे में ढली वस्तु, विशेषकर धातु की प्रतिमा, को दर्शा सकता है। ये विकल्प ढालने की प्रक्रिया या धातु-संबंधी अर्थ को संक्षेप में व्यक्त करते हैं।
lexical_decisions:
- source_word: אֱלֹהֵי
  choice: देवता
  rationale: यह אֱלֹהִים का बहुवचन संबंधकारक रूप है और मूर्तिपूजा-निषेध के इस संदर्भ में ठोस रूप से झूठे देवताओं को दर्शाता है। हिंदी में ‘देवता’ रूप संदर्भानुसार बहुवचन अर्थ देता है और अगले पद के साथ स्वाभाविक संबंध बनाता है।
- source_word: מַסֵּכָה
  choice: ढली हुई धातु के
  rationale: यह संज्ञा साँचे में ढालकर बनाई गई वस्तु, विशेषकर धातु की मूर्ति, को दर्शाती है। ‘ढली हुई धातु के’ निर्माण-प्रक्रिया और सामग्री दोनों का अर्थ स्पष्ट रखता है, बिना अनावश्यक रूप से अलग से ‘मूर्ति’ जोड़ने के।
- source_word: לֹא תַעֲשֶׂה
  choice: न बनाना
  rationale: निषेधात्मक आज्ञा को आधुनिक और स्वाभाविक हिंदी में ‘न बनाना’ से व्यक्त किया गया है; इसमें आज्ञा का बल बना रहता है।
- source_word: לָּךְ
  choice: अपने लिए
  rationale: पूर्वसर्ग और द्वितीय पुरुष प्रत्यय यहाँ व्यक्तिगत हित अथवा अपने उपयोग का भाव देते हैं; ‘अपने लिए’ इस आत्मवाची अर्थ को स्वाभाविक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: निषिद्ध वस्तु का स्वरूप
  choice: ढली हुई धातु के देवता
  alternative: ढली हुई मूर्तियाँ
  rationale: इब्रानी पाठ में ‘देवता’ और साँचे में ढली वस्तु/धातु—दोनों भाव उपस्थित हैं। चुना हुआ अनुवाद मूर्तिपूजा-विरोधी आशय को स्पष्ट रखते हुए ‘देवता’ को केवल ‘मूर्तियाँ’ में नहीं बदलता और सामग्री तथा निर्माण-प्रक्रिया की बारीकी भी बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और प्रत्यक्ष निषेध। एकवचन संबोधन के लिए ‘तुम’ चुना गया है, जो आज के सामान्य पाठक के लिए ‘तू’ से अधिक स्वाभाविक और सम्मानजनक है।
