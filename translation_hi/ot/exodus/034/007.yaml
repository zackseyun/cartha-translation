  text: נֹצֵ֥ר חֶ֨סֶד֙ לָ/אֲלָפִ֔ים נֹשֵׂ֥א עָוֺ֛ן וָ/פֶ֖שַׁע וְ/חַטָּאָ֑ה וְ/נַקֵּה֙ לֹ֣א יְנַקֶּ֔ה פֹּקֵ֣ד עֲוֺ֣ן אָב֗וֹת עַל בָּנִים֙ וְ/עַל בְּנֵ֣י בָנִ֔ים עַל שִׁלֵּשִׁ֖ים וְ/עַל רִבֵּעִֽים׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/007.yaml
  text: keeping steadfast love for thousands[a], forgiving iniquity and transgression and sin, but he will by no means leave unpunished, visiting the iniquity of fathers on children and on children's children[c][b], to the third and to the fourth generation.
translation:
  language: hi
  text: जो हज़ारों के लिए अटल प्रेम बनाए रखता है[a], अधर्म, विद्रोह और पाप को क्षमा करता है, पर दोषी को किसी भी तरह निर्दोष नहीं ठहराता[b]; वह पिताओं के अधर्म का लेखा उनकी सन्तानों और उनकी सन्तानों की सन्तानों पर, तीसरी और चौथी पीढ़ी तक, लेता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘हज़ार पीढ़ियों तक’। इब्रानी में केवल ‘हज़ारों के लिए’ है; सम्भवतः यह तीसरी और चौथी पीढ़ी तक के न्याय के विपरीत परमेश्वर के दीर्घकालीन वाचा-प्रेम को दर्शाता है।
    reason: alternative_reading
  - marker: b
    text: इसे ‘वह निश्चय ही निर्दोष नहीं ठहराता’ या ‘वह किसी भी तरह दण्ड दिए बिना नहीं छोड़ता’ भी कहा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹצֵר
  choice: बनाए रखता है
  rationale: Qal कृदन्त निरन्तर सँभालने, सुरक्षित रखने या कायम रखने का भाव देता है; ‘बनाए रखता है’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: חֶסֶד
  choice: अटल प्रेम
  rationale: यह वाचा-संबंधी प्रेम, निष्ठा और कृपा का गहन शब्द है; ‘अटल प्रेम’ प्रेम और स्थिर निष्ठा दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: לָאֲלָפִים
  choice: हज़ारों के लिए
  rationale: इब्रानी में केवल ‘हज़ारों के लिए’ है; मुख्य पाठ में ‘पीढ़ियाँ’ जोड़ना मूल से अधिक स्पष्टता थोप देता, इसलिए व्यापक अभिव्यक्ति रखी गई है।
- source_word: נֹשֵׂא
  choice: क्षमा करता है
  rationale: मूल क्रिया का शाब्दिक अर्थ ‘उठाना/वहन करना’ है, पर पाप-संबंधी पदों के साथ इसका मुहावरेदार अर्थ क्षमा करना है।
- source_word: עָוֺן
  choice: अधर्म
  rationale: यह शब्द कुटिलता, दोष और उसके परिणाम का भाव रख सकता है; ‘अधर्म’ नैतिक-धार्मिक भार बनाए रखता है।
- source_word: פֶשַׁע
  choice: विद्रोह
  rationale: यह केवल सामान्य अपराध नहीं, अधिकार या वाचा के विरुद्ध बगावत का भाव प्रायः रखता है; ‘विद्रोह’ उस विशिष्टता को सुरक्षित रखता है।
- source_word: חַטָּאָה
  choice: पाप
  rationale: यह इस त्रिपदी का सीधा और प्रचलित हिन्दी समतुल्य है।
- source_word: וְנַקֵּה לֹא יְנַקֶּה
  choice: पर दोषी को किसी भी तरह निर्दोष नहीं ठहराता
  rationale: एक ही धातु की infinitive absolute और finite verb रचना निषेध पर प्रबल बल देती है। हिन्दी में निहित न्यायिक कर्म को ‘दोषी’ से स्पष्ट किया गया है, जबकि ‘निर्दोष नहीं ठहराता’ נקה का न्यायिक भाव रखता है।
- source_word: פֹּקֵד
  choice: लेखा ... लेता है
  rationale: פקד का अर्थ ध्यान देना, हिसाब लेना या परिणाम लाना हो सकता है। ‘लेखा लेना’ न्याय का संदर्भ देता है, पर इसे केवल ‘दण्ड देना’ तक सीमित नहीं करता।
- source_word: עֲוֺן אָבוֹת
  choice: पिताओं के अधर्म
  rationale: אָבוֹת स्पष्ट रूप से पुल्लिंग बहुवचन ‘पिताओं’ है; मूल की लैंगिक विशिष्टता रखी गई है।
- source_word: עַל בָּנִים וְעַל בְּנֵי בָנִים
  choice: उनकी सन्तानों और उनकी सन्तानों से
  rationale: शाब्दिक रूप से ‘पुत्रों और पुत्रों के पुत्रों पर’ है, किन्तु वंशगत विस्तार के सामान्य भाव को स्वाभाविक हिन्दी में ‘सन्तानों और उनकी सन्तानों’ से व्यक्त किया गया है।
- source_word: עַל שִׁלֵּשִׁים וְעַל רִבֵּעִים
  choice: तीसरी और चौथी पीढ़ी तक
  rationale: ‘पीढ़ी’ मूल में व्यक्त नहीं, पर पारिवारिक क्रम से स्पष्ट रूप से निहित है; हिन्दी में अर्थ स्पष्ट करने के लिए इसे एक बार जोड़ा गया है।
theological_decisions:
- issue: ईश्वरीय क्षमा और न्याय के बीच तनाव
  choice: पूर्ण क्षमा के कथन के साथ यह प्रबल कथन रखा गया कि परमेश्वर दोषी को किसी भी तरह निर्दोष नहीं ठहराता।
  alternative: ‘फिर भी दण्ड दिए बिना नहीं छोड़ता’ या अधिक शाब्दिक ‘पर निश्चय ही निर्दोष नहीं ठहराता’।
  rationale: पद दया और न्याय दोनों को साथ रखता है; अनुवाद किसी एक पक्ष को नरम करके इस तनाव को समाप्त नहीं करता।
- issue: ‘हज़ारों’ के बाद ‘पीढ़ियाँ’ जोड़ना
  choice: मुख्य पाठ में केवल ‘हज़ारों के लिए’ रखा गया।
  alternative: ‘हज़ार पीढ़ियों तक’ या ‘हज़ारों पीढ़ियों के लिए’।
  rationale: इस पद में ‘पीढ़ियाँ’ स्पष्ट रूप से नहीं है। समानान्तर पदों की भाषा आयात किए बिना संभावित पीढ़ीगत अर्थ को पादटिप्पणी में बताया गया है।
- issue: पिताओं के अधर्म का बाद की पीढ़ियों पर लेखा
  choice: פקד को ‘लेखा लेना’ कहा गया, ताकि न्याय और पीढ़ीगत परिणाम का कथन बना रहे, पर क्रिया को केवल दण्ड तक सीमित न किया जाए।
  alternative: ‘दण्ड देता है’, ‘परिणाम आने देता है’ या शाब्दिक पर अस्वाभाविक ‘भेंट करता है’।
  rationale: इब्रानी क्रिया अर्थ की कुछ व्यापकता रखती है। अनुवाद कठिन नैतिक-धार्मिक कथन को समझाकर हल नहीं करता और न उत्तराधिकार में व्यक्तिगत दोष के बारे में अतिरिक्त सिद्धान्त जोड़ता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘अटल प्रेम’, ‘विद्रोह’, ‘निर्दोष नहीं ठहराता’ और ‘लेखा लेना’ सामान्य पाठक के लिए समझने योग्य हैं, साथ ही मूल की वाचा-संबंधी, न्यायिक और पीढ़ीगत गम्भीरता बनाए रखते हैं।
