  edition: WLC
  text: שְׁמָ֨ר לְ/ךָ֔ אֵ֛ת אֲשֶׁ֥ר אָנֹכִ֖י מְצַוְּ/ךָ֣ הַ/יּ֑וֹם הִנְ/נִ֧י גֹרֵ֣שׁ מִ/פָּנֶ֗י/ךָ אֶת הָ/אֱמֹרִי֙ וְ/הַֽ/כְּנַעֲנִ֔י וְ/הַ/חִתִּי֙ וְ/הַ/פְּרִזִּ֔י וְ/הַ/חִוִּ֖י וְ/הַ/יְבוּסִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/011.yaml
  text: Keep what I am commanding you today[a]. Behold, I am driving out before you the Amorites, the Canaanites, the Hittites, the Perizzites, the Hivites[b], and the Jebusites.
translation:
  language: hi
  text: आज मैं जो आज्ञा तुझे दे रहा हूँ, उसका पालन करना। देख, मैं तेरे सामने से एमोरियों, कनानियों, हित्तियों, परिज्जियों, हिव्वियों और यबूसियों को निकाल रहा हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁמָר לְךָ
  choice: उसका पालन करना
  rationale: आज्ञा-संबंधी प्रसंग में שׁמר का अर्थ दी हुई बात को मानना या उसका पालन करना है। לְךָ से आने वाला आत्म-संबंधी बल हिन्दी में अलग से व्यक्त करने पर अस्वाभाविक होता, इसलिए स्वाभाविक आज्ञार्थक रचना चुनी गई।
- source_word: אֵת אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: आज मैं तुझे जो आज्ञा दे रहा हूँ
  rationale: सम्बन्धवाचक उपवाक्य और מְצַוֶּה के वर्तमान/सतत भाव को सहज आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: הִנְנִי
  choice: देख
  rationale: यह शब्द आगामी ईश्वरीय कार्य की ओर ध्यान खींचता है। ‘देख’ आधुनिक और गरिमापूर्ण हिन्दी में इस संकेतात्मक बल को व्यक्त करता है।
- source_word: גֹרֵשׁ
  choice: निकाल रहा हूँ
  rationale: גרש का अर्थ बलपूर्वक निकालना या खदेड़ना है। कृदन्त का निकटवर्ती और सुनिश्चित कार्यभाव हिन्दी के वर्तमान प्रगतिशील रूप से व्यक्त किया गया है।
- source_word: מִפָּנֶיךָ
  choice: तेरे सामने से
  rationale: यह मूल रूपक ‘तेरे मुख/उपस्थिति के सामने से’ को स्वाभाविक हिन्दी में बनाए रखता है और हटाए जाने का भाव स्पष्ट करता है।
- source_word: הָאֱמֹרִי ... הַיְבוּסִי
  choice: एमोरियों, कनानियों, हित्तियों, परिज्जियों, हिव्वियों और यबूसियों
  rationale: इब्रानी के एकवचन सामूहिक जातिनाम हिन्दी में स्वाभाविक बहुवचन जातिनामों के रूप में दिए गए हैं।
theological_decisions:
- issue: वाचा के प्रसंग में שׁמר की आज्ञार्थक बारीकी
  choice: दी गई आज्ञा का पालन करने की आज्ञा
  alternative: जो आज्ञा दी जा रही है, उसके विषय में सावधान रहना
  rationale: שׁמר में सुरक्षित रखने, ध्यान देने और पालन करने के अर्थ संभव हैं। यहाँ उसका कर्म स्वयं दी जा रही आज्ञा है, इसलिए ‘पालन करना’ प्रसंगगत अर्थ स्पष्ट करता है, पर मूल में न आए ‘करने में सावधान रहना’ जैसे विस्तारित सूत्र को नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; एकवचन सम्बोधन के कारण ‘तू/तेरे’ शृंखला रखी गई है। शैली सरल, गरिमापूर्ण और प्रत्यक्ष है; जातिनाम प्रचलित हिन्दी बाइबलीय लिप्यंतरण में दिए गए हैं।
