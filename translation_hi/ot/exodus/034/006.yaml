  text: וַ/יַּעֲבֹ֨ר יְהוָ֥ה עַל פָּנָי/ו֮ וַ/יִּקְרָא֒ יְהוָ֣ה יְהוָ֔ה אֵ֥ל רַח֖וּם וְ/חַנּ֑וּן אֶ֥רֶךְ אַפַּ֖יִם וְ/רַב חֶ֥סֶד וֶ/אֱמֶֽת׀־׀־׀
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/006.yaml
  text: Then Yahweh passed before him and proclaimed[a], “Yahweh, Yahweh, a God compassionate and gracious, slow to anger, and abounding in steadfast love and faithfulness.”
translation:
  language: hi
  text: तब याहवे उसके सामने से गुज़रा और घोषणा की, “याहवे, याहवे—करुणामय और अनुग्रहकारी परमेश्वर, जो क्रोध करने में धीमा और अटल प्रेम तथा विश्वासयोग्यता[a] से भरपूर है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सच्चाई।”
    reason: אֱמֶת का सामान्य शाब्दिक अर्थ ‘सच्चाई’ भी है, यद्यपि इस शब्द-युग्म में ‘विश्वासयोग्यता’ संदर्भानुकूल है।
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय उसके प्रचलित ध्वन्यात्मक रूप में रखा गया है; इब्रानी की पुनरावृत्ति भी सुरक्षित है।
- source_word: וַיַּעֲבֹר עַל־פָּנָיו
  choice: उसके सामने से होकर निकला
  rationale: यह अभिव्यक्ति मूसा के सामने से याहवे के गुजरने की स्थानिक गति को स्वाभाविक आधुनिक हिन्दी में व्यक्त करती है।
- source_word: וַיִּקְרָא
  choice: उसने पुकारकर कहा
  rationale: क्रिया में ऊँचे स्वर से पुकारने और घोषणा करने का भाव है; यह हिन्दी प्रयोग दोनों पहलुओं को सहज ढंग से व्यक्त करता है।
- source_word: אֵל
  choice: परमेश्वर
  rationale: यहाँ यह दोहराए गए दिव्य नाम के बाद समानाधिकरण में आता है और आगे बताए गुणों का परिचय देता है।
- source_word: רַחוּם
  choice: करुणामय
  rationale: यह गहरी दया और करुणा के भाव को आधुनिक, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: חַנּוּן
  choice: अनुग्रहकारी
  rationale: यह कृपा और अनुग्रह प्रदान करने वाले स्वभाव को रַחוּם से अलग रखते हुए व्यक्त करता है।
- source_word: אֶרֶךְ אַפַּיִם
  choice: क्रोध करने में धीमा
  rationale: इब्रानी मुहावरे का अर्थ शीघ्र क्रोधित न होना है; चयन मूल रूपक को दोहराए बिना उसके अर्थ के निकट रहता है।
- source_word: רַב
  choice: से भरपूर
  rationale: अमूर्त गुणों के साथ यह बहुतायत का बोध कराता है; हिन्दी में ‘से भरपूर’ स्वाभाविक है।
- source_word: חֶסֶד
  choice: अटल प्रेम
  rationale: यह प्रेम, दया और स्थायी निष्ठा के संयुक्त भाव को संक्षेप में व्यक्त करता है, बिना इसे केवल एक धार्मिक तकनीकी अर्थ तक सीमित किए।
- source_word: אֱמֶת
  choice: विश्वासयोग्यता
  rationale: इस युग्म में शब्द परमेश्वर की भरोसेमंद और निष्ठावान प्रकृति को सूचित करता है; उसका सामान्य अर्थ ‘सच्चाई’ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: दिव्य नाम יְהוָה की पुनरावृत्ति
  choice: याहवे, याहवे
  alternative: प्रभु परमेश्वर
  rationale: मूल पाठ व्यक्तिगत नाम को दो बार दोहराता है। उसे यथावत रखने से बल सुरक्षित रहता है और אֵל को नाम-क्रम में मिलाया नहीं जाता।
- issue: חֶסֶד וֶאֱמֶת में אֱמֶת का अर्थ
  choice: अटल प्रेम तथा विश्वासयोग्यता
  alternative: अटल प्रेम तथा सच्चाई
  rationale: संदर्भ में ‘विश्वासयोग्यता’ परमेश्वर के भरोसेमंद चरित्र को स्पष्ट करता है, जबकि समान रूप से संभव शाब्दिक अर्थ ‘सच्चाई’ को पादटिप्पणी में रखा गया है।
- issue: וַיִּקְרָא का कर्ता
  choice: याहवे को कर्ता मानते हुए ‘उसने पुकारकर कहा’
  alternative: मूसा को कर्ता मानना
  rationale: निकटतम स्पष्ट कर्ता याहवे है और वाक्य दिव्य आत्म-घोषणा के रूप में स्वाभाविक रूप से पढ़ा जाता है; फिर भी इब्रानी क्रिया में कर्ता अलग से व्यक्त नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज और गरिमापूर्ण रूप अपनाया गया है। ‘याहवे’ द्वारा दिव्य नाम सुरक्षित रखा गया है; ‘अनुग्रहकारी’ जैसे धार्मिक रूप से परिचित शब्द को सामान्य वाक्य-विन्यास के साथ संतुलित किया गया है।
