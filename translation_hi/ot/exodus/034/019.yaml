base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/019.yaml
  text: Every firstborn of the womb is mine[a], and every male firstborn among your livestock[c][b], whether ox or sheep.
translation:
  language: hi
  text: गर्भ से जन्म लेने वाली हर पहली संतान मेरी है; और तुम्हारे पशुधन के हर नर पहलौठे—चाहे बैल के हों या भेड़ के—मेरे हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘हर वह जो गर्भ खोलता है।’
    reason: इब्रानी मुहावरे के शाब्दिक रूप को दर्शाना
lexical_decisions:
- source_word: כָּל פֶּטֶר רֶחֶם
  choice: हर एक जो गर्भ खोलता है
  rationale: इब्रानी मुहावरे की ठोस छवि को बनाए रखता है और प्रथम जन्मी संतान की ओर संकेत करता है।
- source_word: לִי
  choice: मेरा है
  rationale: यह यहोवा के स्वामित्व अथवा अधिकार के दावे को संक्षेप और स्वाभाविक रूप में व्यक्त करता है।
- source_word: מִקְנְךָ
  choice: तुम्हारे पशुधन में
  rationale: यह पाले हुए झुंड और रेवड़ के पशुओं के लिए प्रयुक्त व्यापक सामूहिक शब्द है।
- source_word: תִּזָּכָר
  choice: हर पहलौठा नर
  rationale: इस कानूनी संदर्भ में रूप नर संतान को निर्दिष्ट करता है; अनुवाद अस्पष्ट और भ्रामक शाब्दिक अर्थ ‘स्मरण किया जाएगा’ से बचता है।
- source_word: פֶּטֶר שׁוֹר וָשֶׂה
  choice: चाहे बैल हो या भेड़
  rationale: यह पशुधन की उल्लिखित श्रेणियों को स्वाभाविक हिन्दी में प्रस्तुत करता है।
theological_decisions:
- issue: पहलौठों पर परमेश्वर का स्वामित्व-दावा
  choice: ‘मेरा है’ के द्वारा स्पष्ट कानूनी-वैधानिक दावा
  alternative: इसे मुख्य पाठ में ‘मेरे लिए पवित्र ठहराया गया है’ या केवल बलि-योग्य पशुओं तक सीमित करना
  rationale: इब्रानी पाठ सीधे स्वामित्व व्यक्त करता है, पर इस पद में अभिषेक, समर्पण या बलि की विस्तृत व्याख्या नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘गर्भ खोलता है’ मूल इब्रानी मुहावरे की छवि बचाता है; ‘पहलौठा नर’ कानूनी कथन को स्पष्ट करता है।
