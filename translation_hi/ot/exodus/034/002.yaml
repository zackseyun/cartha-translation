source:
  edition: WLC
  text: וֶ/הְיֵ֥ה נָכ֖וֹן לַ/בֹּ֑קֶר וְ/עָלִ֤יתָ בַ/בֹּ֨קֶר֙ אֶל הַ֣ר סִינַ֔י וְ/נִצַּבְתָּ֥ לִ֛/י שָׁ֖ם עַל רֹ֥אשׁ הָ/הָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/002.yaml
  text: And be ready by the morning[b][a], and in the morning come up to Mount Sinai and present yourself there to me on the top of the mountain.
translation:
  language: hi
  text: और भोर तक तैयार रहना, और भोर में सीनै पर्वत पर चढ़ आना[a] और वहाँ पर्वत की चोटी पर मेरे सामने उपस्थित होना[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सीनै पर्वत पर चढ़ जाना।”
    reason: lexical_alternative
  - marker: b
    text: या, “वहाँ पर्वत की चोटी पर मेरे सामने खड़े होना।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וֶהְיֵה נָכוֹן
  choice: तैयार रहना
  rationale: आज्ञार्थक प्रयोग और विधेय विशेषण को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: לַבֹּקֶר
  choice: भोर तक
  rationale: आने वाली भोर तक तैयारी पूरी होने का समय-संबंध दिखाता है और अगले בַבֹּקֶר से भेद बनाए रखता है।
- source_word: וְעָלִיתָ
  choice: चढ़ आना
  rationale: עלה के ऊपर चढ़ने के अर्थ के साथ वक्ता की ओर आने की दिशात्मकता व्यक्त होती है; हिन्दी में यह स्वाभाविक है।
- source_word: בַבֹּקֶר
  choice: भोर को
  rationale: चढ़ने की क्रिया का समय बताता है और पहले आए 'भोर तक' से क्रम स्पष्ट रखता है।
- source_word: אֶל הַר סִינַי
  choice: सीनै पर्वत पर
  rationale: स्थान-नाम का प्रचलित लिप्यंतरण रखते हुए गंतव्य को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְנִצַּבְתָּ לִי
  choice: मेरे सामने उपस्थित होना
  rationale: נצב के 'खड़ा होना/अपना स्थान लेना' और לִי के ईश्वर के सम्मुख आने के औपचारिक भाव को बिना अनावश्यक व्याख्या के व्यक्त करता है।
- source_word: שָׁם
  choice: वहाँ
  rationale: निर्दिष्ट स्थान की ओर संकेत करने वाला सीधा स्थानवाचक अनुवाद।
- source_word: עַל רֹאשׁ הָהָר
  choice: पर्वत की चोटी पर
  rationale: רֹאשׁ के स्थलाकृतिक अर्थ 'चोटी/शिखर' का स्पष्ट और सामान्य हिन्दी रूप।
theological_decisions:
- issue: עלה में वक्ता-सापेक्ष दिशा
  choice: चढ़ आना
  alternative: चढ़ जाना
  rationale: इब्रानी क्रिया दोनों दिशात्मक अभिव्यक्तियों की अनुमति देती है। परमेश्वर की ओर पर्वत पर आने की आज्ञा होने के कारण 'चढ़ आना' चुना गया, पर विकल्प पादटिप्पणी में सुरक्षित है।
- issue: וְנִצַּבְתָּ לִי का संबंध
  choice: मेरे सामने उपस्थित होना
  alternative: वहाँ मेरे लिए खड़े होना
  rationale: वाक्यांश औपचारिक रूप से परमेश्वर के सम्मुख उपस्थित होने या खड़े होने का भाव दे सकता है। मुख्य पाठ में स्वाभाविक हिन्दी चुनी गई और अधिक शाब्दिक संभावना पादटिप्पणी में दी गई।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। 'भोर तक' और 'भोर को' से इब्रानी के दो अलग समय-सूचक संबंध सुरक्षित हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
