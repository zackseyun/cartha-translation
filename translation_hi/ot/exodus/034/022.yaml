base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/022.yaml
  text: And you shall observe for yourself the Feast of Weeks[a], the firstfruits of the wheat harvest, and the Feast of Ingathering at the turn of the year.
translation:
  language: hi
  text: तुम सप्ताहों का पर्व—गेहूँ की कटनी के पहले फलों का पर्व—मनाओ, और वर्ष के मोड़ पर[a] उपज इकट्ठा करने का पर्व भी मनाओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वर्ष के अंत में।” इब्रानी वाक्यांश का शाब्दिक अर्थ वर्ष का घूमना या उसका चक्र है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חַג
  choice: पर्व
  rationale: यह शब्द तीर्थ-सम्बन्धी धार्मिक उत्सव को दर्शाता है; ‘पर्व’ आधुनिक हिन्दी में स्वाभाविक, गरिमापूर्ण और इस प्रसंग के अनुकूल है।
- source_word: שָׁבֻעֹת
  choice: सप्ताहों
  rationale: पर्व के इब्रानी नाम का शाब्दिक अर्थ ‘सप्ताह’ है। बहुवचन बनाए रखने से मूल नाम सुरक्षित रहता है और बाद का पारम्परिक नाम आरोपित नहीं होता।
- source_word: תַּעֲשֶׂה לְךָ
  choice: तुम ... मनाना
  rationale: शाब्दिक अर्थ ‘तुम अपने लिए करना’ है, पर पर्व के साथ यह मुहावरा उसे मनाने या उसका पालन करने का आदेश देता है। हिन्दी की आज्ञार्थक रचना अर्थ को स्वाभाविक रूप से व्यक्त करती है; לְךָ का अलग अनुवाद यहाँ असहज और अतिशाब्दिक होता।
- source_word: בִּכּוּרֵי
  choice: पहले फलों
  rationale: यह कटनी की सबसे पहली उपज, विशेषतः अर्पित की जाने वाली उपज, को दर्शाता है। ‘पहले फल’ सामान्य पाठक के लिए स्पष्ट रहते हुए धार्मिक आशय बनाए रखता है।
- source_word: קְצִיר חִטִּים
  choice: गेहूँ की कटनी
  rationale: यह समास गेहूँ काटने अथवा उसकी फसल की कटनी को दर्शाता है; ‘गेहूँ की कटनी’ सहज और सटीक हिन्दी है।
- source_word: הָאָסִיף
  choice: बटोरने
  rationale: यह खेत की उपज को एकत्र करने को दर्शाता है। ‘बटोरने का पर्व’ नाम के कृषि-सम्बन्धी अर्थ को पारदर्शी रखता है।
- source_word: תְּקוּפַת הַשָּׁנָה
  choice: वर्ष के बदलने के समय
  rationale: תקופה वर्ष के घूमने, चक्र या मोड़ को दर्शाता है। यह अनुवाद मौसमी परिवर्तन का भाव देता है और इसे केवल कैलेंडर के अंतिम दिन तक सीमित नहीं करता।
