- from: तुम सप्ताहों का पर्व, अर्थात् गेहूँ की कटनी के पहले फलों का पर्व, और वर्ष के बदलने के समय[a] बटोरने का पर्व मनाना।
  to: तुम सप्ताहों का पर्व—गेहूँ की कटनी के पहले फलों का पर्व—मनाओ, और वर्ष के मोड़ पर[a] उपज इकट्ठा करने का पर्व भी मनाओ।
