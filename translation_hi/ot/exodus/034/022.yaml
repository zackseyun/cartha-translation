    text: या, “वर्ष के अंत में।” इब्रानी वाक्यांश का शाब्दिक अर्थ वर्ष का घूमना या उसका चक्र है।
    reason: lexical_alternative
  revision_rationale: The revision uses a natural finite imperative, preserves the appositional identification of the Feast of Weeks with the wheat-harvest firstfruits, and makes the Ingathering feast explicit as the gathering of produce. The footnote remains anchored to “वर्ष के मोड़ पर” and preserves the alternative “at the end of the year” while explaining the Hebrew's cyclic sense.
