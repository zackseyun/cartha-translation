  register: भाषा आधुनिक मानक हिन्दी की, सरल किंतु गरिमापूर्ण रखी गई है। पर्वों के नाम अर्थ-पारदर्शी रूप में दिए गए हैं। ‘अर्थात्’ पहले फलों को सप्ताहों के पर्व से स्पष्ट रूप से जोड़ता है, जैसा इब्रानी पद-विन्यास संकेत करता है। पादटिप्पणी-चिह्न को उसी वाक्यांश पर रखा गया है जिससे उसका lexical विकल्प सम्बन्धित है।
