base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/024.yaml
  text: For I will drive out nations from before you and enlarge your border[c][b][a], and no man will covet your land when you go up to appear before Yahweh your God three times in the year.
translation:
  language: hi
  text: क्योंकि मैं तेरे सामने से जातियों को निकाल दूँगा और तेरी सीमा बढ़ाऊँगा। जब तू वर्ष में तीन बार अपने परमेश्वर याहवे के सामने उपस्थित होने[a] के लिए ऊपर जाएगा, तब कोई भी तेरी भूमि का लालच नहीं करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “अपने परमेश्वर याहवे का मुख देखने के लिए”; यहाँ इसका अर्थ उपासना के लिए उसके सामने उपस्थित होना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले आदेश के पालन का आधार बताता है; हिन्दी में ‘क्योंकि’ इसका कारणसूचक संबंध स्पष्ट रखता है।
- source_word: אוֹרִישׁ גּוֹיִם מִפָּנֶיךָ
  choice: मैं तेरे सामने से जातियों को निकाल दूँगा
  rationale: हिफ़ील क्रिया यहाँ देश से हटाने/बेदखल करने का भाव रखती है; ‘निकाल दूँगा’ स्वाभाविक है और ‘तेरे सामने से’ मूल मुहावरे को सुरक्षित रखता है।
- source_word: וְהִרְחַבְתִּי אֶת־גְּבוּלֶךָ
  choice: और तेरी सीमा बढ़ाऊँगा
  rationale: गְּבוּל सीमा अथवा भू-सीमा है; ‘सीमा बढ़ाना’ प्रादेशिक विस्तार का स्पष्ट और सहज हिन्दी प्रयोग है।
- source_word: וְלֹא יַחְמֹד אִישׁ אֶת־אַרְצְךָ
  choice: तब कोई भी तेरी भूमि का लालच नहीं करेगा
  rationale: חמד अनुचित इच्छा या लालच को व्यक्त करता है। אִישׁ व्याकरणतः पुल्लिंग एकवचन होते हुए यहाँ प्रतिनिधिक अर्थ में है, इसलिए प्रसंगानुसार ‘कोई भी’ स्वाभाविक है।
- source_word: בַּעֲלֹתְךָ
  choice: जब तू ... ऊपर जाएगा
  rationale: तीर्थ-पर्व के प्रसंग में עלה का अर्थ उपासना-स्थान की ओर ‘ऊपर जाना’ है; हिन्दी में यह बाइबलीय भौगोलिक भाव बनाए रखता है।
- source_word: לֵרָאוֹת אֶת־פְּנֵי
  choice: के सामने उपस्थित होने के लिए
  rationale: मूल रूप का शाब्दिक अर्थ ‘मुख देखने के लिए’ है, पर धार्मिक दरबार/उपासना के मुहावरे में आशय परमेश्वर के सामने उपस्थित होना है।
- source_word: יְהוָה
  choice: यहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत वाचा-नाम है; हिन्दी लिप्यंतरण ‘यहवे’ शीर्षक से उसे बदलने के बजाय नाम को बनाए रखता है।
- source_word: שָׁלֹשׁ פְּעָמִים בַּשָּׁנָה
  choice: वर्ष में तीन बार
  rationale: मूल आवृत्ति को आधुनिक, स्पष्ट हिन्दी में ठीक प्रकार व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: प्रभु / यहोवा
  rationale: यहाँ मूल में उपाधि नहीं, टेट्राग्रामटन के रूप में व्यक्तिगत नाम है; ‘यहवे’ उस नाम का निकट हिन्दी लिप्यंतरण है।
- issue: אִישׁ का प्रतिनिधिक पुल्लिंग प्रयोग
  choice: कोई भी
  alternative: कोई पुरुष
  rationale: यद्यपि संज्ञा पुल्लिंग एकवचन है, निषेधात्मक वाक्य में उसका अर्थ सामान्यतः ‘कोई व्यक्ति’ है। ‘कोई भी’ इस व्यापक आशय को स्पष्ट करता है, जबकि पर्वों में पुरुषों की उपस्थिति का प्रसंग पद 23 से पहले ही स्थापित है।
- issue: לֵרָאוֹת אֶת־פְּנֵי की पाठगत/मुहावरेदार अभिव्यक्ति
  choice: के सामने उपस्थित होने के लिए
  alternative: का मुख देखने के लिए
  rationale: शाब्दिक रूप ‘मुख देखने’ का है, पर यहाँ राजकीय-उपासनीय मुहावरा परमेश्वर के समक्ष हाज़िर होने को दर्शाता है; मुख्य पाठ में अर्थ दिया गया और पादटिप्पणी में शाब्दिक रूप सुरक्षित रखा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। निकटवर्ती वाचा-संबंधी संबोधन के अनुरूप एकवचन ‘तू/तेरे’ रखा गया है। वाक्य को हिन्दी की स्वाभाविक लय के लिए दो वाक्यों में बाँटा गया है; कारण और प्रतिज्ञा का संबंध ‘क्योंकि’ तथा ‘तब’ से स्पष्ट है।
