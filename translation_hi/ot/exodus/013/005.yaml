base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/005.yaml
  text: And when Yahweh brings you into the land of the Canaanites[a], the Hittites, the Amorites, the Hivites, and the Jebusites, which he swore to your fathers to give you, a land flowing with milk and honey, you shall perform this service in this month.
translation:
  language: hi
  text: और जब याहवे तुम्हें कनानियों, हित्तियों, एमोरियों, हिव्वियों और यबूसियों के देश में ले आए, जिसे उसने तुम्हारे पूर्वजों से तुम्हें देने की शपथ खाई थी—उस देश में जहाँ दूध और मधु की धाराएँ बहती हैं—तब तुम इसी महीने यह धार्मिक सेवा[a] करोगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यह सेवा,” “यह अनुष्ठान” अथवा “यह पालन।” इब्रानी शब्द किसी निर्धारित धार्मिक कृत्य या सेवा का सूचक हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִי
  choice: और जब
  rationale: यह रचना भविष्य में होने वाली परिस्थिति का परिचय देती है; ‘और जब’ हिन्दी में स्वाभाविक रहते हुए उसके कालगत अर्थ को बनाए रखता है।
- source_word: יְבִיאֲךָ
  choice: तुम्हें ... ले आए
  rationale: בוא का हिफ़ील रूप किसी को भीतर लाने या पहुँचाने का अर्थ देता है; देश में प्रवेश के संदर्भ में यह स्वाभाविक हिन्दी है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी परमेश्वर के व्यक्तिगत नाम का लिप्यंतरण किया गया है, उसे किसी उपाधि से नहीं बदला गया।
- source_word: אֶל אֶרֶץ הַכְּנַעֲנִי וְהַחִתִּי וְהָאֱמֹרִי וְהַחִוִּי וְהַיְבוּסִי
  choice: कनानियों, हित्तियों, एमोरियों, हिव्वियों और यबूसियों के देश में
  rationale: एकवचन जातिनामों को हिन्दी में संबंधित जनसमूहों के बहुवचन रूप में रखना स्पष्ट और प्रचलित है; אֶל को गति के कारण ‘में’ से व्यक्त किया गया है।
- source_word: אֲשֶׁר נִשְׁבַּע לַאֲבֹתֶיךָ לָתֶת לָךְ
  choice: जिसे तुम्हें देने की शपथ उसने तुम्हारे पूर्वजों से खाई थी
  rationale: संबंधवाचक उपवाक्य को ‘देश’ से जोड़े रखते हुए वाचा-संबंधी शपथ और देने की प्रतिज्ञा दोनों सुरक्षित रखी गई हैं।
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: ऐसे देश में जहाँ दूध और मधु की धाराएँ बहती हैं
  rationale: मूल के ‘दूध और मधु बहने’ वाले समृद्धि-सूचक बिंब को स्वाभाविक हिन्दी मुहावरे में बनाए रखा गया है।
- source_word: וְעָבַדְתָּ אֶת הָעֲבֹדָה הַזֹּאת
  choice: यह उपासना-विधि पूरी करना
  rationale: עבד और עֲבֹדָה यहाँ निर्धारित धार्मिक सेवा या अनुष्ठान करने को सूचित करते हैं। ‘पूरी करना’ क्रियान्वयन को और ‘उपासना-विधि’ धार्मिक संदर्भ को स्पष्ट करता है, पर किसी खास संप्रदाय की पूजा-पद्धति नहीं जोड़ता।
- source_word: בַּחֹדֶשׁ הַזֶּה
  choice: इसी महीने
  rationale: הַזֶּה के संकेतात्मक बल को ‘इसी’ से व्यक्त किया गया है और समय-सूचक वाक्यांश संक्षिप्त रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है। ‘याहवे’ उसका सीधा लिप्यंतरण है और नाम को उपाधि से प्रतिस्थापित नहीं करता।
- issue: फसह/अख़मीरी रोटी के संदर्भ में עֲבֹדָה का धार्मिक आशय
  choice: उपासना-विधि
  alternative: सेवा; अनुष्ठान; पालन
  rationale: शब्द सेवा और निर्धारित धार्मिक क्रिया दोनों को व्यक्त कर सकता है। ‘उपासना-विधि’ इस संदर्भ के धार्मिक तथा कर्तव्यपरक आशय को रखता है; अन्य संभव अर्थ पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। जातिनामों के प्रचलित हिन्दी बाइबलीय रूप रखे गए हैं। वाक्य की लंबी इब्रानी संरचना को डैश से स्पष्ट किया गया है, और आज्ञा का भाव ‘करना’ से स्वाभाविक हिन्दी में व्यक्त हुआ है।
