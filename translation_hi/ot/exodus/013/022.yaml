lexical_decisions:
- source_word: יָמִישׁ
  choice: नहीं हटता था
  rationale: מושׁ का यह रूप हटने या दूर चले जाने को व्यक्त करता है। अपूर्ण क्रिया और प्रसंग के अनुसार यह अनवरत उपस्थिति बताता है; इसलिए ‘नहीं हटता था’ स्वाभाविक और अर्थनिष्ठ है।
- source_word: עַמּוּד
  choice: खम्भा
  rationale: यह ऊर्ध्वाकार स्तम्भ-जैसी अभिव्यक्ति का सामान्य और स्पष्ट हिन्दी रूप है।
- source_word: הֶעָנָן
  choice: बादल
  rationale: עָנָן का सीधा हिन्दी अर्थ ‘बादल’ है; संयुक्त पद में ‘बादल का खम्भा’ स्वाभाविक है।
- source_word: יוֹמָם
  choice: दिन में
  rationale: यह दिन के समय को सूचित करने वाला क्रियाविशेषण है और ‘रात में’ के साथ संतुलित युग्म बनाता है।
- source_word: וְעַמּוּד הָאֵשׁ
  choice: और ... आग का खम्भा
  rationale: बादल के खम्भे के समानान्तर संरचना तथा आग की ठोस छवि सुरक्षित रहती है।
- source_word: לָיְלָה
  choice: रात में
  rationale: यह रात के समय का क्रियाविशेषणीय प्रयोग है और आधुनिक हिन्दी में सहज है।
- source_word: לִפְנֵי
  choice: के आगे से
  rationale: יָמִישׁ के साथ यह लोगों के सामने स्थित स्थान से दूर हटने का स्थानिक भाव व्यक्त करता है।
- source_word: הָעָם
  choice: लोगों
  rationale: यह निश्चित एकवचन सामूहिक संज्ञा है, जो प्रसंग में इस्राएल समुदाय को सामूहिक रूप से दर्शाती है।
