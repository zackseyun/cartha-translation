  text: וְ/הָיָ֤ה לְ/אוֹת֙ עַל יָ֣דְ/כָ֔ה וּ/לְ/טוֹטָפֹ֖ת בֵּ֣ין עֵינֶ֑י/ךָ כִּ֚י בְּ/חֹ֣זֶק יָ֔ד הוֹצִיאָ֥/נוּ יְהוָ֖ה מִ/מִּצְרָֽיִם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/016.yaml
  text: And it shall be as a sign on your hand and as frontlets between your eyes[b][a], for with a strong hand Yahweh brought us out from Egypt.
translation:
  language: hi
  text: और यह तुम्हारे हाथ पर एक चिन्ह के रूप में और तुम्हारी आँखों के बीच[b] माथे की पट्टियों[a] के रूप में होगा, क्योंकि यहोवा हमें बलवन्त हाथ से मिस्र से निकाल लाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “माथे के बन्ध”; परम्परागत रूप से इनके लिए एक विशिष्ट धार्मिक संज्ञा भी प्रयुक्त होती है। इब्रानी शब्द दुर्लभ है और सम्भवतः स्मरण के लिए माथे पर पहनी जाने वाली किसी वस्तु को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: शब्दशः “तुम्हारी आँखों के बीच”; यह मुहावरा प्रायः “तुम्हारे माथे पर” के अर्थ में समझा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: और यह ... होगा
  rationale: संयोजक वाव के साथ काल-सिद्ध रूप यहाँ निर्देश के स्थायी परिणाम को भविष्यात्मक ढंग से व्यक्त करता है।
- source_word: לְאוֹת
  choice: एक चिन्ह
  rationale: אוֹת किसी संकेत, चिह्न या स्मारक का व्यापक अर्थ रखता है; ‘चिन्ह’ स्वाभाविक और पर्याप्त रूप से खुला है।
- source_word: עַל יָדְכָה
  choice: तुम्हारे हाथ पर
  rationale: मूल पाठ में ‘हाथ’ है, ‘बाँह’ नहीं; इसलिए ठोस बिंब सुरक्षित रखा गया है।
- source_word: וּלְטוֹטָפֹת
  choice: माथे की पट्टियों
  rationale: दुर्लभ शब्द טוֹטָפֹת संभवतः स्मरण के लिए माथे पर पहनी जाने वाली वस्तु को बताता है। ‘माथे की पट्टियाँ’ आधुनिक हिन्दी में अर्थबोध कराता है और बाद की विशिष्ट पारिभाषिक संज्ञा को मुख्य पाठ में नहीं लाता।
- source_word: בֵּין עֵינֶיךָ
  choice: तुम्हारी आँखों के बीच
  rationale: इब्रानी बिंब को शब्दशः सुरक्षित रखा गया है; मुहावरे का संभावित अर्थ ‘माथे पर’ पादटिप्पणी में दिया गया है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह चिन्ह के आधार या कारण को प्रस्तुत करता है।
- source_word: בְּחֹזֶק יָד
  choice: बलवन्त हाथ से
  rationale: यह पदबंध परमेश्वर की सामर्थ्यपूर्ण क्रिया व्यक्त करता है; ‘बलवन्त हाथ’ मूल के ठोस रूपक को बनाए रखता है।
- source_word: הוֹצִיאָנוּ
  choice: हमें ... निकाल लाया
  rationale: יצא का हिफ़ील रूप ‘बाहर निकालना/निकाल लाना’ है और निर्गमन के प्रसंग में यही स्पष्ट अर्थ है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार अक्षरों वाले दिव्य नाम को हिन्दी में प्रचलित नाम-रूप ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से नहीं।
- source_word: מִמִּצְרָיִם
  choice: मिस्र से
  rationale: ‘निकाल लाया’ के साथ यह स्वाभाविक हिन्दी है और स्रोत का अर्थ पूरा रखता है।
theological_decisions:
- issue: हाथ और आँखों के बीच की भाषा को शाब्दिक बिंब के रूप में रखना या बाद की धार्मिक वस्तु के रूप में स्पष्ट करना
  choice: मुख्य पाठ में ‘हाथ पर’ और ‘आँखों के बीच माथे की पट्टियाँ’ का ठोस बिंब रखा गया है।
  alternative: मुख्य पाठ में ‘तावीज़’ या बाद की विशिष्ट धार्मिक संज्ञा देना, अथवा पूरे कथन को केवल आलंकारिक ‘स्मरण’ के रूप में कहना।
  rationale: इब्रानी पाठ स्वयं ठोस किंतु व्याख्यात्मक रूप से खुली भाषा रखता है। यह अनुवाद इस संभावना को अनिर्णीत रखता है कि आज्ञा शाब्दिक, प्रतीकात्मक, या दोनों है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप अपनाया गया है। ‘बलवन्त हाथ’ स्रोत के रूपक और बाइबिलीय गरिमा को बनाए रखता है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
