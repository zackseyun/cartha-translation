  yaml_path: translation/ot/exodus/013/013.yaml
  text: And every firstborn of a donkey you shall redeem with a lamb; and if you do not redeem it[a], then you shall break its neck. And every firstborn of man among your sons you shall redeem.
translation:
  language: hi
  text: और गधे के हर पहलौठे बच्चे को भेड़ या बकरी के एक बच्चे से छुड़ाना; पर यदि तुम उसे न छुड़ाओ, तो उसकी गरदन तोड़ देना। और अपने हर पहलौठे पुत्र को छुड़ाना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פֶּטֶר חֲמֹר
  choice: गधी का हर पहलौठा
  rationale: פֶּטֶר का शाब्दिक भाव गर्भ खोलने वाला पहला बच्चा है; इस विधिक प्रसंग में ‘पहलौठा’ स्वाभाविक और सटीक है। חֲמֹר यहाँ गधे की जाति को सूचित करता है; जन्म देने वाले पशु के संदर्भ में हिंदी में ‘गधी’ स्वाभाविक है।
- source_word: תִּפְדֶּה
  choice: छुड़ाना
  rationale: פדה प्रतिस्थापन या मूल्य देकर मुक्त करने को दर्शाता है। ‘छुड़ाना’ सामान्य आधुनिक हिंदी में बोधगम्य है और इस विधिक-धार्मिक अर्थ को बनाए रखता है।
- source_word: בְשֶׂה
  choice: भेड़ या बकरी के एक बच्चे से
  rationale: שֶׂה छोटे पालतू पशुओं में भेड़ या बकरी, विशेषतः उनके बच्चे, दोनों को सूचित कर सकता है। यह अनुवाद मूल की व्यापकता को बिना केवल ‘मेमना’ तक सीमित किए व्यक्त करता है।
- source_word: וַעֲרַפְתּוֹ
  choice: उसकी गरदन तोड़ देना
  rationale: ערף सामान्य वध के बजाय पीछे से गरदन तोड़ने का संकेत देता है; यह हिंदी में स्पष्ट और सीधा समतुल्य है।
- source_word: בְּכוֹר אָדָם
  choice: हर पहलौठा
  rationale: אָדָם यहाँ पशु के विपरीत मनुष्य को सूचित करता है, पर בְּבָנֶיךָ से मानवीय संदर्भ पहले ही स्पष्ट है। हिंदी में ‘अपने पुत्रों में से हर पहलौठा’ स्वाभाविक रहते हुए वही अर्थ देता है।
- source_word: בְּבָנֶיךָ
  choice: अपने पुत्रों में से
  rationale: मूल में स्पष्ट रूप से ‘तुम्हारे पुत्रों’ कहा गया है; इसलिए लिंग-विशिष्ट अर्थ को बनाए रखा गया है।
theological_decisions:
- issue: אָדָם का मानवीय वर्ग-सूचक अर्थ
  choice: ‘अपने पुत्रों में से हर पहलौठे’ में मानवीय अर्थ को संदर्भ से व्यक्त करना
  alternative: ‘मनुष्य के हर पहलौठे को, जो तुम्हारे पुत्रों में हो’
  rationale: אָדָם पशु और मनुष्य के बीच भेद करता है, न कि केवल वयस्क पुरुष को। हिंदी में ‘मनुष्य के... जो तुम्हारे पुत्रों में हो’ कृत्रिम और पुनरुक्त लगता है; चुना हुआ रूप अर्थ को स्पष्ट और स्वाभाविक रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी; विधिक आदेशों के लिए सहज अनंत-क्रिया रूप ‘छुड़ाना/तोड़ देना’ रखा गया है। भाषा गरिमापूर्ण, सीधी और सामान्य पाठकों के लिए बोधगम्य है। ‘गरदन’ आधुनिक मानक वर्तनी के अनुसार प्रयुक्त है।
