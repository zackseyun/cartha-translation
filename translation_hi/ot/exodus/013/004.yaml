  text: Today you are going out[a], in the month of Abib.
translation:
  language: hi
  text: आज तुम लोग अबीब के महीने में निकल रहे हो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अबीब महीने का नाम है; यह शब्द वसंत ऋतु में अन्न की बालियों के पकने की अवस्था से जुड़ा है।
    reason: cultural_note
lexical_decisions:
- source_word: הַיּוֹם
  choice: आज
  rationale: संज्ञा यहाँ क्रियाविशेषण की तरह वर्तमान दिन को सूचित करती है; ‘आज’ संबोधन की तात्कालिकता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אַתֶּם
  choice: तुम लोग
  rationale: यह द्वितीय पुरुष बहुवचन सर्वनाम है; ‘तुम लोग’ आधुनिक हिन्दी में बहुवचन को स्पष्ट करता है और इस सामूहिक संबोधन के लिए उपयुक्त है।
- source_word: יֹצְאִים
  choice: निकल रहे हो
  rationale: יצא का काल कृदन्त संदर्भ में जारी अथवा आसन्न प्रस्थान व्यक्त करता है; ‘निकल रहे हो’ इस पक्ष और मिस्र से बाहर जाने की गति को सुरक्षित रखता है।
- source_word: בְּחֹדֶשׁ
  choice: के महीने में
  rationale: בְּ के साथ חֹדֶשׁ पंचांग-संबंधी समय बताता है; हिन्दी में ‘के महीने में’ इसका स्वाभाविक रूप है।
- source_word: הָאָבִיב
  choice: अबीब
  rationale: इब्रानी महीने के नाम/पदनाम को अर्थानुवाद करने के बजाय देवनागरी में लिप्यंतरित किया गया है; पकते अन्न और वसंत से उसका संबंध टिप्पणी में समझाया गया है।
