  yaml_path: translation/ot/exodus/013/011.yaml
  text: And when Yahweh brings you into the land of the Canaanites[a], as he swore to you and to your fathers, and gives it to you[b],
translation:
  language: hi
  text: और जब[a] याहवे तुम्हें कनानियों की भूमि में ले आएगा, जैसी शपथ उसने तुमसे और तुम्हारे पितरों[b] से खाई थी, और वह भूमि तुम्हें दे देगा,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “और ऐसा होगा कि जब।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से, “तुम्हारे पिता”; यहाँ वंशगत पूर्वजों के अर्थ में।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: और जब
  rationale: यह इब्रानी रचना भविष्य में होने वाली परिस्थिति का परिचय देती है। ‘और जब’ उसके कालगत अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יְבִיאֲךָ
  choice: तुम्हें ... ले आएगा
  rationale: בוא का हिफ़ील रूप किसी को आने के लिए लाने का अर्थ देता है; देश के संदर्भ में ‘ले आएगा’ स्वाभाविक और भविष्याभिमुख है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: אֶל אֶרֶץ הַכְּנַעֲנִי
  choice: कनानियों के देश में
  rationale: אֶל गति की दिशा बताता है और ‘कनानी’ एकवचन जातिवाचक रूप यहाँ सामूहिक अर्थ रखता है; इसलिए बहुवचन ‘कनानियों’ उपयुक्त है।
- source_word: כַּאֲשֶׁר נִשְׁבַּע
  choice: जैसा उसने ... शपथ खाई थी
  rationale: כַּאֲשֶׁר तुलना को और נִשְׁבַּע शपथ लेने को व्यक्त करता है। हिन्दी में पूर्ण पूर्वकाल इस शपथ के पहले दिए जाने को स्पष्ट और सहज बनाता है।
- source_word: לְךָ וְלַאֲבֹתֶיךָ
  choice: तुमसे और तुम्हारे पुरखों से
  rationale: दोनों संबंधसूचक לְ को हिन्दी के ‘से’ द्वारा व्यक्त किया गया है। ‘पुरखे’ वंशगत पूर्वजों के लिए स्वाभाविक, गरिमापूर्ण शब्द है; मूल का शाब्दिक पितृवाचक रूप पादटिप्पणी में दिया गया है।
- source_word: וּנְתָנָהּ לָךְ
  choice: और वह देश तुम्हें दे देगा
  rationale: स्त्रीलिंग प्रत्यय का संदर्भ ‘देश/भूमि’ है। हिन्दी में अस्पष्ट ‘उसे’ के स्थान पर ‘वह देश’ दोहराने से संदर्भ स्पष्ट रहता है और भविष्य की परिस्थिति सुरक्षित रहती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत वाचा-नाम है। ‘याहवे’ उसका प्रचलित विद्वतापूर्ण लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
