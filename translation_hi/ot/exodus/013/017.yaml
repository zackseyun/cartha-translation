source:
  edition: WLC
  text: וַ/יְהִ֗י בְּ/שַׁלַּ֣ח פַּרְעֹה֮ אֶת הָ/עָם֒ וְ/לֹא נָחָ֣/ם אֱלֹהִ֗ים דֶּ֚רֶךְ אֶ֣רֶץ פְּלִשְׁתִּ֔ים כִּ֥י קָר֖וֹב ה֑וּא כִּ֣י אָמַ֣ר אֱלֹהִ֗ים פֶּֽן יִנָּחֵ֥ם הָ/עָ֛ם בִּ/רְאֹתָ֥/ם מִלְחָמָ֖ה וְ/שָׁ֥בוּ מִצְרָֽיְמָ/ה־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/017.yaml
  text: When Pharaoh let the people go[a], God did not lead them by the way of the land of the Philistines, though it was near; for God said[b], “Lest the people change their minds when they see war and return to Egypt.”
translation:
  language: hi
  text: जब फ़िरौन ने लोगों को जाने दिया, तब परमेश्वर उन्हें पलिश्तियों के देश के मार्ग से नहीं ले गया, हालाँकि वह मार्ग निकट था[a]; क्योंकि परमेश्वर ने कहा, “ऐसा न हो कि युद्ध देखकर लोगों का मन बदल जाए[b] और वे मिस्र लौट जाएँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “क्योंकि वह मार्ग निकट था।” इब्रानी संयोजक शब्द कारणवाचक अर्थ भी दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “लोग पछताएँ” अथवा “अपना इरादा बदल लें।” यहाँ इब्रानी क्रिया युद्ध का सामना होने पर मन या निर्णय बदलने को व्यक्त करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשַׁלַּח
  choice: जब फ़िरौन ने लोगों को जाने दिया
  rationale: בְּ के साथ infinitive construct यहाँ समय-सूचक परिस्थिति व्यक्त करता है। संदर्भ में שׁלח का स्वाभाविक अर्थ लोगों को बंधन से जाने देना है।
- source_word: נָחָם
  choice: ले गया
  rationale: נחה का अर्थ मार्ग दिखाते हुए ले चलना है। इस यात्रा-वर्णन में ‘ले गया’ सहज आधुनिक हिन्दी है।
- source_word: דֶּרֶךְ אֶרֶץ פְּלִשְׁתִּים
  choice: पलिश्तियों के देश के मार्ग से
  rationale: यह रूप דֶּרֶךְ की मार्ग-संबंधी धारणा और लोगों के नाम से बने भौगोलिक वाक्यांश—‘पलिश्तियों का देश’—दोनों को बनाए रखता है।
- source_word: כִּי קָרוֹב הוּא
  choice: हालाँकि वह मार्ग निकट था
  rationale: 'כִּי यहाँ संदर्भानुसार रियायती अर्थ दे सकता है: मार्ग निकट होने पर भी परमेश्वर ने उससे नहीं ले गया। ‘वह मार्ग’ हिन्दी में सर्वनाम का संदर्भ स्पष्ट करता है। कारणवाचक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।'
- source_word: פֶּן
  choice: ऐसा न हो कि
  rationale: פֶּן आशंका अथवा नकारात्मक प्रयोजन प्रस्तुत करता है; ‘ऐसा न हो कि’ उसका स्वाभाविक और सटीक हिन्दी रूप है।
- source_word: יִנָּחֵם
  choice: लोगों का मन बदल जाए
  rationale: נחם का निफ़अल रूप यहाँ युद्ध का सामना होने पर निर्णय या इरादा बदलने को व्यक्त करता है, न कि अनिवार्य रूप से नैतिक पश्चात्ताप को।
- source_word: בִּרְאֹתָם מִלְחָמָה
  choice: युद्ध देखकर
  rationale: בִּ + infinitive construct परिस्थितिवाचक है, और מִלְחָמָה सशस्त्र संघर्ष की संभावना को व्यापक रूप से ‘युद्ध’ कहता है।
- source_word: וְשָׁבוּ מִצְרָיְמָה
  choice: और वे मिस्र लौट जाएँ
  rationale: שׁוב का सामान्य अर्थ ‘लौटना’ है और दिशासूचक ה को हिन्दी में ‘मिस्र लौट जाएँ’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיְהִי
  choice: जब … तब
  rationale: וַיְהִי कथानक को आगे बढ़ाता है और अगले בְּשַׁלַּח-वाक्यांश के साथ घटना की समयगत रूपरेखा बनाता है। हिन्दी में अनावश्यक ‘और ऐसा हुआ’ जोड़े बिना ‘जब … तब’ यह संबंध स्पष्ट करता है।
theological_decisions:
- issue: पलिश्तियों के मार्ग से न ले जाने का परमेश्वर का कारण
  choice: 'पद में दिए गए कारण को सीधे परमेश्वर के कथन के रूप में रखा गया है: युद्ध देखकर लोग मन बदलकर मिस्र लौट सकते थे।'
  alternative: इसे कथाकार का अनुमान मानना, या यह कहना कि परमेश्वर ने प्रतिक्रिया में अपनी योजना बदली।
  rationale: כִּי אָמַר אֱלֹהִים स्पष्ट रूप से कारण को ‘परमेश्वर ने कहा’ के रूप में प्रस्तुत करता है। अनुवाद इससे आगे परमेश्वर के ज्ञान या विधान के विषय में कोई अतिरिक्त धर्मसैद्धांतिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘फ़िरौन,’ ‘पलिश्ती’ और ‘मिस्र’ प्रचलित बाइबलीय नाम हैं। ‘ऐसा न हो कि’ आशंका को स्वाभाविक ढंग से व्यक्त करता है। सभी पादटिप्पणी-चिह्न संबंधित शब्दसमूह के तुरंत बाद रखे गए हैं।
