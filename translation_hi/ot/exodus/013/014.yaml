source:
  edition: WLC
  text: וְ/הָיָ֞ה כִּֽי יִשְׁאָלְ/ךָ֥ בִנְ/ךָ֛ מָחָ֖ר לֵ/אמֹ֣ר מַה זֹּ֑את וְ/אָמַרְתָּ֣ אֵלָ֔י/ו בְּ/חֹ֣זֶק יָ֗ד הוֹצִיאָ֧/נוּ יְהוָ֛ה מִ/מִּצְרַ֖יִם מִ/בֵּ֥ית עֲבָדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/014.yaml
  text: And when your son asks you in time to come, saying, ‘What is this?’ then you shall say to him, ‘By a mighty hand the LORD brought us out from Egypt, from the house of servants.’
translation:
  language: hi
  text: और आगे चलकर जब तुम्हारा बेटा तुमसे पूछे, ‘यह क्या है?’ तब तुम उससे कहना, ‘यहोवा हमें अपने सामर्थी हाथ से मिस्र से, दासों के घर से निकाल लाया।’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָחָר
  choice: आगे चलकर
  rationale: शाब्दिक अर्थ ‘कल’ है, पर इस प्रसंग में यह भविष्य के किसी समय को दर्शाता है; ‘आगे चलकर’ आधुनिक हिन्दी में वही भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּחֹזֶק יָד
  choice: अपने सामर्थी हाथ से
  rationale: इब्रानी मुहावरा हाथ की शक्ति और परमेश्वर के प्रभावशाली हस्तक्षेप को व्यक्त करता है; ‘सामर्थी हाथ’ बिंब को बनाए रखता है। ‘अपने’ हिन्दी में कर्ता यहोवा से संबंध स्पष्ट करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में परमेश्वर का विशिष्ट नाम है; उसे सामान्य उपाधि ‘प्रभु’ से बदलने के बजाय नाम के रूप में प्रस्तुत किया गया है।
- source_word: בֵּית עֲבָדִים
  choice: दासों के घर
  rationale: यह मूल रूपक का निकट अनुवाद है और मिस्र को दासता के स्थान के रूप में चित्रित करता है; इसे अमूर्त ‘दासता का घर’ बनाकर मूल बहुवचन संज्ञा को नहीं मिटाया गया।
theological_decisions:
- issue: निर्गमन के कर्ता के रूप में दिव्य नाम
  choice: यहोवा हमें ... निकाल लाया
  alternative: प्रभु हमें ... निकाल लाया
  rationale: मूल में टेट्राग्रामटन है। विशिष्ट नाम रखने से वाचा-संबंधी पहचान सुरक्षित रहती है, बिना अतिरिक्त व्याख्या जोड़े।
- issue: पीढ़ीगत सहभागिता में प्रथम पुरुष बहुवचन
  choice: हमें
  alternative: हमारे पूर्वजों को
  rationale: मूल הוֹצִיאָנוּ का सीधा अर्थ ‘हमें निकाला’ है। बाद की पीढ़ी स्वयं को उद्धार पाए समुदाय में सम्मिलित करके बोलती है; इसे ‘पूर्वजों’ तक सीमित करना मूल की सामुदायिक पहचान को हल कर देगा।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। प्रश्नोत्तर की पारिवारिक शैली तथा ‘सामर्थी हाथ’ और ‘दासों के घर’ जैसे मूल बिंब सुरक्षित हैं।
