source:
  edition: WLC
  text: קַדֶּשׁ לִ֨/י כָל בְּכ֜וֹר פֶּ֤טֶר כָּל רֶ֨חֶם֙ בִּ/בְנֵ֣י יִשְׂרָאֵ֔ל בָּ/אָדָ֖ם וּ/בַ/בְּהֵמָ֑ה לִ֖/י הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/002.yaml
  text: Consecrate to me every firstborn[a], the first to open every womb among the sons of Israel, among man and among beast; it is mine.
translation:
  language: hi
  text: “इस्राएल की सन्तानों में, मनुष्यों और पशुओं के हर पहिलौठे को—अर्थात् जो हर गर्भ को सबसे पहले खोलता है—मेरे लिए पवित्र ठहरा; वह मेरा है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קַדֶּשׁ
  choice: पवित्र ठहरा
  rationale: यह आज्ञार्थक क्रिया किसी व्यक्ति या वस्तु को परमेश्वर के लिए पवित्र करके अलग करने का भाव रखती है। ‘पवित्र ठहरा’ सहज हिन्दी में इस समर्पण और पवित्रता, दोनों को व्यक्त करता है।
- source_word: לִי
  choice: मेरे लिए
  rationale: यहाँ ל समर्पण और सम्बन्ध का सूचक है; ‘मेरे लिए’ परमेश्वर के निमित्त अलग किए जाने का अर्थ स्पष्ट करता है।
- source_word: כָל בְּכוֹר
  choice: हर पहिलौठे को
  rationale: בְּכוֹר का अर्थ ‘पहिलौठा’ है। मूल पाठ में ‘नर’ स्पष्ट रूप से नहीं है, इसलिए उसे अनुवाद में नहीं जोड़ा गया।
- source_word: פֶּטֶר כָּל רֶחֶם
  choice: हर गर्भ को सबसे पहले खोलनेवाले को
  rationale: यह पदबंध उस पहिलौठे को बताता है जो गर्भ से सबसे पहले जन्म लेता है। ‘गर्भ को ... खोलनेवाला’ मूल इब्रानी बिंब को बनाए रखता है।
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: इस्राएल की सन्तानों में
  rationale: यह इब्रानी पदबंध का सामूहिक और स्वाभाविक हिन्दी रूप है तथा इस्राएल के वंशजों को सूचित करता है।
- source_word: בָּאָדָם
  choice: मनुष्यों में से
  rationale: אָדָם यहाँ मनुष्य-जाति को सामूहिक रूप में दर्शाता है और पशुओं के विपरीत रखा गया है। बहुवचन हिन्दी में इसी सामूहिक अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וּבַבְּהֵמָה
  choice: और पशुओं में से
  rationale: בְּהֵמָה पशु को सामूहिक रूप में दर्शाता है; ‘पशु’ ‘मवेशी’ से अधिक व्यापक है और मनुष्य-पशु का विरोध बनाए रखता है।
- source_word: לִי הוּא
  choice: वह मेरा है
  rationale: समापन वाक्य परमेश्वर के अधिकार और स्वामित्व की स्पष्ट घोषणा करता है।
theological_decisions:
- issue: אָדָם का सामूहिक, प्रतिनिधिक प्रयोग
  choice: मनुष्यों
  alternative: मनुष्य
  rationale: यहाँ एक व्यक्ति या केवल पुरुष का संकेत नहीं, बल्कि पशुओं के विपरीत पूरी मानव श्रेणी का संकेत है। ‘मनुष्यों’ स्रोत के सामूहिक अर्थ को बिना लैंगिक सीमा जोड़े स्पष्ट करता है।
- issue: पहिलौठे का लिंग
  choice: ‘नर’ को न जोड़ना
  alternative: हर पहिलौठे नर को
  rationale: इस पद में בְּכוֹר के साथ नर के लिए कोई अलग शब्द नहीं है। आगे का विधिक सन्दर्भ अर्थ को सीमित कर सकता है, पर इस पद के अनुवाद में वह सीमा मौन रूप से जोड़ना उचित नहीं है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘पहिलौठा’ बाइबलीय हिन्दी में परिचित और संक्षिप्त है। दीर्घ वाक्य की समानाधिकरण संरचना को डैश के द्वारा स्पष्ट किया गया है, जबकि ‘हर गर्भ को सबसे पहले खोलनेवाला’ मूल इब्रानी बिंब को सुरक्षित रखता है।
