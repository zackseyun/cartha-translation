translation:
  language: hi
  text: वे सुक्कोत से चले और निर्जन प्रदेश के किनारे पर एताम में पड़ाव डाला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: फिर वे … से चले
  rationale: נסע का वय्यिक़्तोल बहुवचन यात्रा-वृत्तांत में अगली क्रमिक क्रिया, अर्थात पड़ाव उठाकर आगे चलने, को व्यक्त करता है। ‘चले’ सहज आधुनिक हिन्दी है; ‘फिर’ कथात्मक क्रम को स्पष्ट करता है।
- source_word: מִסֻּכֹּת
  choice: सुक्कोत से
  rationale: מִן उपसर्ग प्रस्थान-बिंदु ‘से’ बताता है। स्थान-नाम סֻכּוֹת को अनुवादित करने के बजाय स्रोत के अनुरूप ‘सुक्कोत’ लिप्यंतरित किया गया है।
- source_word: וַיַּחֲנוּ
  choice: और … पड़ाव डाला
  rationale: חנה का अर्थ शिविर लगाना या पड़ाव डालना है। यात्रा-वृत्तांत में ‘पड़ाव डाला’ स्वाभाविक, स्पष्ट और गरिमापूर्ण आधुनिक हिन्दी है।
- source_word: בְאֵתָם
  choice: एताम में
  rationale: בְ स्थानवाचक है। एताम एक स्थान-नाम है, इसलिए ‘में’ हिन्दी मुहावरे के अनुकूल है और नाम को ‘एताम’ के रूप में लिप्यंतरित किया गया है।
- source_word: בִּקְצֵה
  choice: के छोर पर
  rationale: קָצֶה किसी क्षेत्र के अंतिम सिरे, किनारे या सीमा को दर्शाता है। इस भौगोलिक प्रसंग में ‘छोर पर’ संक्षिप्त और स्वाभाविक है तथा किसी औपचारिक राजनीतिक सीमा का अनावश्यक संकेत नहीं देता।
- source_word: הַמִּדְבָּר
  choice: जंगल
  rationale: מִדְבָּר निर्जन, कम आबाद वन्य या उजाड़ भूभाग को दर्शा सकता है और अनिवार्यतः रेतीला मरुस्थल नहीं। बाइबलीय हिन्दी में ‘जंगल’ इस व्यापक अर्थ को सहज रूप से व्यक्त करता है।
