lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: तब ... ने ... कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; ‘तब’ उसके क्रमिक भाव को स्वाभाविक हिन्दी में व्यक्त करता है। हिन्दी में आगामी प्रत्यक्ष कथन के साथ ‘कहा’ अधिक सहज है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुरक्षरीय ईश्वरीय नाम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित नाम-रूप ‘यहोवा’ रखा गया है।
- source_word: אֶל־מֹשֶׁה
  choice: मूसा से
  rationale: דבר אל की सम्बोधन-संरचना का स्वाभाविक हिन्दी रूप ‘मूसा से कहा’ है।
- source_word: לֵאמֹר
  choice: कहा
  rationale: यह अनन्त रूप आगे आने वाले प्रत्यक्ष कथन का परिचय देता है। हिन्दी में अलग से ‘यह कहते हुए’ जोड़ना अनावश्यक पुनरुक्ति पैदा करता; ‘कहा’ वही कार्य स्वाभाविक ढंग से करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम है। हिन्दी पाठकों के लिए परिचित ‘यहोवा’ को रखा गया है; उच्चारण का विद्वतापरक पुनर्निर्माण ‘याहवे’ भी सम्भव है, इसलिए किसी उपाधि जैसे ‘प्रभु’ से इसे नहीं बदला गया।
translation_notes:
