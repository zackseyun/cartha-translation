base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/021.yaml
  text: And Yahweh was going before them by day in a pillar of cloud to lead them on the way[a], and by night in a pillar of fire to give them light, so that they could travel by day and by night.
translation:
  language: hi
  text: और याहवे[a] दिन में बादल के एक खंभे में उनके आगे-आगे चलता था, ताकि मार्ग पर उनकी अगुवाई करे; और रात में आग के एक खंभे में, ताकि उन्हें प्रकाश दे, जिससे वे दिन और रात चल सकें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में: YHWH, परमेश्वर का नाम। परंपरागत रूप से इसे “यहोवा” भी लिखा जाता है।'
    reason: मूल इब्रानी ईश्वरीय नाम की पहचान और हिन्दी में प्रचलित पारंपरिक रूप की जानकारी देना।
lexical_decisions:
- source_word: וַיהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय वाचा-नाम को सामान्य हिन्दी लिप्यंतरण में रखा गया है; इसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: הֹלֵךְ לִפְנֵיהֶם
  choice: उनके आगे-आगे चलता था
  rationale: कृदन्त की निरंतर चल रही क्रिया और לִפְנֵיהֶם के स्थानिक तथा नेतृत्व-संबंधी भाव, दोनों को व्यक्त करता है।
- source_word: יוֹמָם ... וְלַיְלָה
  choice: दिन को ... और रात को
  rationale: समांतर काल-सूचक पदों को स्वाभाविक आधुनिक हिन्दी में रखा गया है।
- source_word: בְּעַמּוּד עָנָן
  choice: बादल के एक खम्भे में
  rationale: בְּ का 'में' अर्थ दृश्य रूप के भीतर उपस्थिति को बनाए रखता है और עַמּוּד עָנָן की ठोस छवि सुरक्षित करता है।
- source_word: לַנְחֹתָם הַדֶּרֶךְ
  choice: ताकि मार्ग में उनकी अगुवाई करे
  rationale: נחה के मार्गदर्शन/नेतृत्व के भाव और הַדֶּרֶךְ के यात्रा-संदर्भ को सहज हिन्दी में व्यक्त करता है।
- source_word: בְּעַמּוּד אֵשׁ
  choice: आग के एक खम्भे में
  rationale: पहले समांतर पद की संरचना और मूल की ठोस उपमा को बनाए रखता है।
- source_word: לְהָאִיר לָהֶם
  choice: ताकि उन्हें उजाला दे
  rationale: हिफ़ील क्रिया का कारणवाचक अर्थ स्पष्ट और सामान्य हिन्दी में व्यक्त होता है।
- source_word: לָלֶכֶת יוֹמָם וָלָיְלָה
  choice: और वे दिन और रात चल सकें
  rationale: अनन्त क्रिया के प्रयोजन/परिणाम को व्यक्त करते हुए यात्रा करने की क्षमता का आशय स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है। हिन्दी पाठकों में परिचित 'यहोवा' इसे नाम के रूप में सुरक्षित रखता है; पाठ-टिप्पणी में मूल अक्षर और वैकल्पिक उच्चारण दिया गया है।
- issue: खम्भों में ईश्वरीय उपस्थिति का संबंध
  choice: खम्भे में
  alternative: खम्भे के द्वारा
  rationale: בְּ को 'में' रखने से पाठ की अभिव्यक्ति सुरक्षित रहती है और यह अनावश्यक रूप से तय नहीं किया जाता कि खम्भा केवल साधन था या प्रकट उपस्थिति का रूप।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। 'आगे-आगे चलता था' निरंतर मार्गदर्शक उपस्थिति को सहज हिन्दी में व्यक्त करता है; समांतर बादल और आग की संरचना सुरक्षित है।
