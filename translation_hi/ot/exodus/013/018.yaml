  text: וַ/יַּסֵּ֨ב אֱלֹהִ֧ים אֶת הָ/עָ֛ם דֶּ֥רֶךְ הַ/מִּדְבָּ֖ר יַם ס֑וּף וַ/חֲמֻשִׁ֛ים עָל֥וּ בְנֵי יִשְׂרָאֵ֖ל מֵ/אֶ֥רֶץ מִצְרָֽיִם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/018.yaml
  text: So God led the people around by the way of the wilderness to the Sea of Reeds[b][a], and the sons of Israel went up from the land of Egypt armed.
translation:
  language: hi
  text: तब परमेश्वर लोगों को घुमाकर निर्जन प्रदेश के मार्ग से सरकंडों के सागर[a] की ओर ले गया; और इस्राएल के पुत्र हथियारबंद[b] होकर मिस्र देश से निकले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “लाल सागर।” इब्रानी नाम का शाब्दिक अर्थ “सरकंडों का सागर” है।
    reason: alternative_reading
  - marker: b
    text: “हथियारबंद” के लिए प्रयुक्त इब्रानी शब्द का अर्थ अनिश्चित है; इसका अर्थ “युद्ध के लिए सुसज्जित,” “युद्ध-विन्यास में,” या अधिक सामान्य रूप से “पंक्तिबद्ध” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּסֵּב
  choice: घुमाकर ... ले गया
  rationale: हिफ़ील रूप का आशय लोगों को सीधे मार्ग के बजाय घुमावदार मार्ग से ले जाना है; यह चयन दैवी कर्तृत्व और मार्ग-परिवर्तन दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: דֶּרֶךְ הַמִּדְבָּר
  choice: निर्जन प्रदेश के मार्ग से
  rationale: דֶּרֶךְ मार्ग को सूचित करता है और מִדְבָּר निर्जन, वन्य भूभाग को; यह हिन्दी अभिव्यक्ति केवल रेतीले मरुस्थल का अनावश्यक संकुचन नहीं करती।
- source_word: יַם סוּף
  choice: सरकंडों का सागर
  rationale: סוּף का सीधा अर्थ सरकंडा/जलवनस्पति है; इसलिए परंपरागत भौगोलिक नाम के बजाय मूल शब्दार्थ को मुख्य पाठ में रखा गया है।
- source_word: וַחֲמֻשִׁים
  choice: हथियारबंद
  rationale: यह कठिन शब्द संभवतः युद्ध-सज्जता या सैन्य विन्यास दर्शाता है। 'हथियारबंद' संक्षिप्त और औपचारिक है, जबकि अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: עָלוּ
  choice: निकले
  rationale: शाब्दिक अर्थ 'ऊपर गए' है, पर मिस्र से प्रस्थान के इस प्रसंग में 'निकले' आधुनिक हिन्दी में स्वाभाविक है और दिशा-सूचक मुहावरे का आशय देता है।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्र
  rationale: इब्रानी की पुल्लिंग बहुवचन संरचना को औपचारिक रूप से सुरक्षित रखा गया है; वाक्यांश सामूहिक रूप से इस्राएली प्रजा को दर्शाता है।
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: मिस्र देश से
  rationale: यह मूल पूर्वसर्ग और אֶרֶץ दोनों को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: יַם סוּף का अनुवाद
  choice: सरकंडों का सागर
  alternative: लाल सागर
  rationale: मूल भाषा की प्राथमिकता के कारण शब्द का प्रत्यक्ष अर्थ मुख्य पाठ में है; परिचित परंपरागत नाम पादटिप्पणी में दिया गया है।
- issue: בְנֵי יִשְׂרָאֵל का रूप
  choice: इस्राएल के पुत्र
  alternative: इस्राएली
  rationale: मूल की व्याकरणिक पुल्लिंग संरचना को बनाए रखा गया है, यद्यपि इसका सामूहिक संदर्भ पूरी इस्राएली प्रजा से है।
- issue: חֲמֻשִׁים की अनिश्चितता
  choice: हथियारबंद
  alternative: युद्ध के लिए सुसज्जित; पंक्तिबद्ध
  rationale: शब्द का सटीक भाव विवादित है। मुख्य पाठ में संभावित सैन्य अर्थ चुना गया है, लेकिन दूसरे संभव अर्थ पादटिप्पणी में रखे गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सहज गद्य। मुख्य पाठ में मूल इब्रानी के मार्ग, समुद्र-नाम और सामूहिक पदबंध को यथासंभव पारदर्शी रखा गया है; कठिन सैन्य शब्द की वास्तविक अनिश्चितता पादटिप्पणी में दी गई है।
