source:
  edition: WLC
  text: וַ/יִּקַּ֥ח מֹשֶׁ֛ה אֶת עַצְמ֥וֹת יוֹסֵ֖ף עִמּ֑/וֹ כִּי֩ הַשְׁבֵּ֨עַ הִשְׁבִּ֜יעַ אֶת בְּנֵ֤י יִשְׂרָאֵל֙ לֵ/אמֹ֔ר פָּקֹ֨ד יִפְקֹ֤ד אֱלֹהִים֙ אֶתְ/כֶ֔ם וְ/הַעֲלִיתֶ֧ם אֶת עַצְמֹתַ֛/י מִ/זֶּ֖ה אִתְּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/019.yaml
  text: And Moses took Joseph’s bones with him[a], because Joseph had made the sons of Israel solemnly swear, saying, “God will surely attend to you, and you shall bring up my bones from here with you.”
translation:
  language: hi
  text: 'मूसा यूसुफ की हड्डियाँ अपने साथ ले गया, क्योंकि यूसुफ ने इस्राएल के पुत्रों को यह कहकर दृढ़ शपथ दिलाई थी: “परमेश्वर निश्चय ही तुम्हारी सुधि लेगा[a], और तुम मेरी हड्डियाँ यहाँ से अपने साथ ऊपर ले जाना।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर निश्चय ही तुम्हारी सुधि लेने आएगा।” इब्रानी मुहावरा अपने लोगों की ओर से परमेश्वर के निर्णायक हस्तक्षेप को भी सूचित कर सकता है।
    reason: פָּקֹד יִפְקֹד के ‘सुधि लेना/भेंट करना/हस्तक्षेप करना’ वाले अर्थ-क्षेत्र की वास्तविक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: וַיִּקַּח
  choice: ले गया
  rationale: לקח का सामान्य कथात्मक अर्थ ‘लेना’ है; इस प्रस्थान-संदर्भ में ‘अपने साथ ले गया’ स्वाभाविक हिन्दी है।
- source_word: עַצְמוֹת / עַצְמֹתַי
  choice: हड्डियाँ / मेरी हड्डियाँ
  rationale: मूल के ठोस और स्पष्ट शब्द को बनाए रखा गया है; ‘अवशेष’ अधिक व्याख्यात्मक होता।
- source_word: עִמּוֹ / אִתְּכֶם
  choice: अपने साथ / अपने साथ
  rationale: दोनों संगतिवाचक पदों का सीधा और स्वाभाविक अनुवाद है; मूल में विचार की पुनरावृत्ति को बनाए रखा गया है।
- source_word: הַשְׁבֵּעַ הִשְׁבִּיעַ
  choice: यह दृढ़ शपथ दिलाई थी
  rationale: हिफ़ील रूप की कारणवाचकता और infinitive absolute से आए बल, दोनों को व्यक्त करता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: मूल के पारिवारिक मुहावरे और स्पष्ट पुल्लिंग शब्दावली को बनाए रखता है, जबकि आधुनिक हिन्दी में बोधगम्य है।
- source_word: פָּקֹד יִפְקֹד
  choice: निश्चय ही तुम्हारी सुधि लेगा
  rationale: दोहराए गए धातुरूप का निश्चितता-सूचक बल ‘निश्चय ही’ से व्यक्त होता है। ‘सुधि लेना’ ध्यान देने, परवाह करने और निर्णायक रूप से कार्य करने की अर्थ-सीमा को बिना अत्यधिक विशिष्ट किए संप्रेषित करता है।
- source_word: וְהַעֲלִיתֶם
  choice: तब तुम ... ऊपर ले जाना
  rationale: शपथ के संदर्भ में भविष्यात्मक-कर्तव्यात्मक बल को हिन्दी के आदेशात्मक ढाँचे से व्यक्त किया गया है; ‘ऊपर’ עלה की दिशात्मक बारीकी को बचाता है।
- source_word: מִזֶּה
  choice: यहाँ से
  rationale: वक्ता के तत्काल स्थान, अर्थात मिस्र, की ओर संकेत करने वाले मूल पद का स्वाभाविक अनुवाद है।
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל का अनुवाद
  choice: इस्राएल के पुत्रों
  alternative: इस्राएलियों / इस्राएल की संतान
  rationale: मूल का पारिवारिक मुहावरा और ‘पुत्र’ का स्पष्ट रूप सुरक्षित रखा गया है; इसे केवल जातिवाचक नाम में समतल नहीं किया गया।
- issue: פָּקֹד יִפְקֹד אֱלֹהִים אֶתְכֶם का अनुवाद
  choice: परमेश्वर निश्चय ही तुम्हारी सुधि लेगा
  alternative: परमेश्वर निश्चय ही तुम्हारे पास आएगा / परमेश्वर निश्चय ही तुम पर ध्यान देगा
  rationale: मूल मुहावरा परमेश्वर के निश्चित ध्यान और हस्तक्षेप को सूचित करता है। चुना हुआ पाठ इस अर्थ को स्पष्ट करता है, जबकि पादटिप्पणी ‘आने/भेंट करने’ की शाब्दिक अर्थ-छाया को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘दृढ़ शपथ दिलाई’ मूल के बलाघात को व्यक्त करता है; ‘सुधि लेगा’ परिचित हिन्दी मुहावरा है, और पादटिप्पणी उसके व्यापक इब्रानी अर्थ को स्पष्ट करती है।
