  yaml_path: translation/ot/exodus/013/010.yaml
  text: You shall keep this statute at its appointed time from year to year[a].
translation:
  language: hi
  text: तुम इस विधि का पालन उसके नियत समय पर वर्ष-दर-वर्ष करना।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में शाब्दिक रूप से: “दिनों से दिनों तक”; यहाँ इसका अर्थ सामान्यतः “वर्ष-दर-वर्ष” समझा जाता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַרְתָּ
  choice: पालन करना
  rationale: विधि-विधान के संदर्भ में שׁמר आज्ञा को मानने और उसका निरंतर पालन करने का भाव देता है; आधुनिक हिन्दी में ‘पालन करना’ स्वाभाविक और स्पष्ट है।
- source_word: הַחֻקָּה הַזֹּאת
  choice: इस विधि
  rationale: חֻקָּה किसी ठहराए हुए नियम या विधान को दर्शाता है। ‘विधि’ संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य है।
- source_word: לְמוֹעֲדָהּ
  choice: उसके नियत समय पर
  rationale: מוֹעֵד ठहराए या नियत समय को दर्शाता है, और स्त्रीलिंग प्रत्यय का संबंध इस विधि/अनुष्ठान से है। यह अनुवाद उस निश्चित अवसर के भाव को बनाए रखता है।
- source_word: מִיָּמִים יָמִימָה
  choice: वर्ष-दर-वर्ष
  rationale: शाब्दिक अभिव्यक्ति ‘दिनों से दिनों तक’ है, पर वार्षिक पर्व के इस संदर्भ में यह मुहावरा नियमित वार्षिक पुनरावृत्ति बताता है। मुख्य पाठ में स्वाभाविक अर्थ रखा गया है और शाब्दिक रूप पादटिप्पणी में दिया गया है।
