  text: וְ/הִגַּדְתָּ֣ לְ/בִנְ/ךָ֔ בַּ/יּ֥וֹם הַ/ה֖וּא לֵ/אמֹ֑ר בַּ/עֲב֣וּר זֶ֗ה עָשָׂ֤ה יְהוָה֙ לִ֔/י בְּ/צֵאתִ֖/י מִ/מִּצְרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/008.yaml
  text: And you shall tell your son on that day[a], saying, ‘It is because of this that Yahweh acted for me when I came out of Egypt.’
translation:
  language: hi
  text: 'उस दिन अपने बेटे को यह बताना: “इसी के कारण[a] याहवे ने मेरे लिए कार्य किया, जब मैं मिस्र से निकला था।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे ने मेरे लिए यह किया, जब मैं मिस्र से निकला था।” इब्रानी में “यह” को या तो इस अनुष्ठान के कारण से, या अधिक सीधे याहवे के किए हुए कार्य से जोड़ा जा सकता है।
    reason: वाक्य-संबंध की वास्तविक अस्पष्टता और शाब्दिक विकल्प को सुरक्षित रखना।
lexical_decisions:
- source_word: וְהִגַּדְתָּ
  choice: तुम ... बताना
  rationale: נגד के हिफ़ील रूप का सामान्य अर्थ ‘बताना, प्रकट करना’ है। आज्ञासूचक प्रसंग में ‘तुम ... बताना’ आधुनिक हिन्दी में स्वाभाविक है और निर्देश का बल बनाए रखता है।
- source_word: לְבִנְךָ
  choice: अपने बेटे को
  rationale: לְ अप्रत्यक्ष कर्म को चिह्नित करता है। בֵּן यहाँ एकवचन पुल्लिंग है, इसलिए ‘बेटे’ मूल की लैंगिक और वचन-संबंधी विशिष्टता को बनाए रखता है।
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह मानक कालवाचक पद है; ‘उस दिन’ संकेतवाचक बल को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לֵאמֹר
  choice: बताने के बाद आने वाला प्रत्यक्ष कथन
  rationale: यह infinitive कथन की विषयवस्तु आरम्भ करता है। हिन्दी में अलग से ‘यह कहते हुए’ जोड़ने के बजाय उद्धरण-चिह्नों द्वारा इसका कार्य स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: בַּעֲבוּר זֶה
  choice: इसी के कारण
  rationale: यह पद कारण या आधार बताता है। ‘इसी के कारण’ זֶה के संकेतवाचक बल और בַּעֲבוּר के कारणार्थ को बनाए रखता है; वाक्य-संबंध की वैकल्पिक समझ पादटिप्पणी में दी गई है।
- source_word: עָשָׂה יְהוָה לִי
  choice: यहोवा ने मेरे लिए कार्य किया
  rationale: עָשָׂה का अर्थ व्यापक है—‘करना, बनाना, कार्य करना’। मूल में कोई स्पष्ट कर्म नहीं है; इसलिए ‘कार्य किया’ अनावश्यक रूप से ‘यह किया’ जैसा कर्म नहीं जोड़ता और मेरे पक्ष में किए गए हस्तक्षेप का भाव रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार अक्षरों वाले परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नाम-रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: בְּצֵאתִי מִמִּצְרָיִם
  choice: जब मैं मिस्र से निकला था
  rationale: בְּ के साथ infinitive construct कालगत परिस्थिति बताता है। यह अनुवाद प्रथम पुरुष एकवचन दृष्टिकोण को सुरक्षित रखते हुए स्वाभाविक हिन्दी देता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। ‘यहोवा’ नाम को सुरक्षित रखता है, जबकि ‘प्रभु’ उसे एक उपाधि से बदल देता।
- issue: वाचा-संबंधी शिक्षा में בִנְךָ का लैंगिक रूप
  choice: अपने बेटे को
  alternative: अपने बच्चे को
  rationale: इब्रानी पद एकवचन पुल्लिंग है। संदर्भ इसे लिंग-निरपेक्ष बनाने की माँग नहीं करता, इसलिए मूल की विशिष्टता रखी गई है।
- issue: בַּעֲבוּר זֶה और עָשָׂה के बीच वाक्य-संबंध
  choice: ‘इसी के कारण’ को यहोवा के कार्य का कारण मानना
  alternative: ‘यहोवा ने मेरे लिए यह किया’—जहाँ ‘यह’ उसके किए हुए कार्य की ओर संकेत करता है
  rationale: इब्रानी वाक्य-रचना दोनों संबंधों की गुंजाइश देती है। मुख्य पाठ कारणार्थ पढ़ने को प्रस्तुत करता है, पर वैकल्पिक समझ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। कथन माता-पिता द्वारा अगली पीढ़ी को दिए जाने वाले निर्देश जैसा सुनाई देता है। ‘कार्य किया’ मूल क्रिया के व्यापक अर्थ को बनाए रखता है, और पादटिप्पणी इब्रानी की वास्तविक वाक्यगत अस्पष्टता स्पष्ट करती है।
