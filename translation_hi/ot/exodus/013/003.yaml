reference: Exodus 13:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶל הָ/עָ֗ם זָכ֞וֹר אֶת הַ/יּ֤וֹם הַ/זֶּה֙ אֲשֶׁ֨ר יְצָאתֶ֤ם מִ/מִּצְרַ֨יִם֙ מִ/בֵּ֣ית עֲבָדִ֔ים כִּ֚י בְּ/חֹ֣זֶק יָ֔ד הוֹצִ֧יא יְהֹוָ֛ה אֶתְ/כֶ֖ם מִ/זֶּ֑ה וְ/לֹ֥א יֵאָכֵ֖ל חָמֵֽץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/003.yaml
  text: Then Moses said to the people[a], “Remember this day in which you came out from Egypt, from the house of slavery, because Yahweh brought you out from there by a strong hand[c][b]; and no leavened bread shall be eaten.”
translation:
  language: hi
  text: तब मूसा ने लोगों से कहा, “इस दिन को याद रखो जिस दिन तुम मिस्र से, दासों के घर से, निकल आए थे, क्योंकि यहोवा तुम्हें अपने सामर्थी हाथ से वहाँ से निकाल लाया; और कोई खमीरवाली वस्तु न खाई जाए।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זָכוֹר
  choice: याद रखो
  rationale: एकवचन आज्ञार्थक रूप पूरे समुदाय को सामूहिक इकाई मानकर संबोधित करता है। ‘याद रखो’ स्वाभाविक हिन्दी है और स्मारकीय-वाचा संबंधी बल बनाए रखता है।
- source_word: הַיּוֹם הַזֶּה
  choice: उस दिन को
  rationale: प्रत्यक्ष कथन में यह उस निर्गमन-दिन की ओर संकेत करता है जिसे स्मरण रखना है। हिन्दी में आगे के संबंधवाचक ‘जब’ के साथ ‘उस दिन को’ स्वाभाविक और स्पष्ट है।
- source_word: יְצָאתֶם
  choice: तुम ... निकल आए थे
  rationale: יצא का अर्थ निकलना है। ‘निकल आए थे’ मिस्र से बाहर आने की पूर्ण घटना को सहज हिन्दी में व्यक्त करता है।
- source_word: מִמִּצְרַיִם
  choice: मिस्र से
  rationale: स्रोत सूचक מִן का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: מִבֵּית עֲבָדִים
  choice: दासों के घर से
  rationale: इब्रानी की ठोस अभिव्यक्ति ‘दासों का घर’ को सुरक्षित रखता है; प्रसंग में इसका अर्थ दासता का स्थान अर्थात मिस्र है।
- source_word: כִּי
  choice: क्योंकि
  rationale: स्मरण रखने की आज्ञा का कारण प्रस्तुत करता है।
- source_word: בְּחֹזֶק יָד
  choice: अपने सामर्थी हाथ से
  rationale: मुहावरा परमेश्वर के शक्तिशाली कार्य को दर्शाता है। ‘सामर्थी हाथ’ शाब्दिक चित्र और मुहावरे का आशय दोनों बनाए रखता है; ‘अपने’ हिन्दी में कर्ता यहोवा से संबंध स्पष्ट करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार-अक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: הוֹצִיא
  choice: निकाल लाया
  rationale: יצא का हिफ़ील रूप कारणवाचक है—‘बाहर निकालना/ले आना’। ‘निकाल लाया’ निर्गमन की क्रिया को सहज हिन्दी में व्यक्त करता है।
- source_word: מִזֶּה
  choice: वहाँ से
  rationale: यह पीछे उल्लिखित मिस्र और दासों के घर की ओर संकेत करता है।
- source_word: וְלֹא יֵאָכֵל חָמֵץ
  choice: और कोई खमीरवाली वस्तु न खाई जाए
  rationale: निफ़अल रूप के निष्क्रिय निषेध को बनाए रखता है। חָמֵץ केवल रोटी तक सीमित न होकर खमीरयुक्त खाद्य वस्तु को भी सूचित कर सकता है, इसलिए व्यापक अनुवाद चुना गया।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। उसे उपाधि ‘प्रभु’ से बदलने के बजाय नाम के रूप में प्रस्तुत करना स्रोत का भेद बनाए रखता है।
- issue: עֲבָדִים का रूप
  choice: दासों
  alternative: दासता
  rationale: मूल में बहुवचन ठोस संज्ञा ‘दास’ है। ‘दासों का घर’ इब्रानी रूपक को सुरक्षित रखता है, जबकि ‘दासता का घर’ उसका अर्थ स्पष्ट करने वाला अधिक अमूर्त विकल्प है।
- issue: חָמֵץ की व्याप्ति
  choice: खमीरवाली वस्तु
  alternative: खमीरवाली रोटी
  rationale: संज्ञा खमीरयुक्त पदार्थ/भोजन का व्यापक संकेत दे सकती है। केवल ‘रोटी’ कहना संभावित अर्थ-क्षेत्र को संकरा कर देता; व्यापकता को मुख्य पाठ में बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली। सामूहिक संबोधन के लिए ‘तुम’ रखा गया है। वाक्य का कारण-संबंध, ईश्वरीय ‘हाथ’ का चित्र और अंतिम निष्क्रिय निषेध सुरक्षित हैं।
