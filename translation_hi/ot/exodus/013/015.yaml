source:
  edition: WLC
  text: וַ/יְהִ֗י כִּֽי הִקְשָׁ֣ה פַרְעֹה֮ לְ/שַׁלְּחֵ/נוּ֒ וַ/יַּהֲרֹ֨ג יְהֹוָ֤ה כָּל בְּכוֹר֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם מִ/בְּכֹ֥ר אָדָ֖ם וְ/עַד בְּכ֣וֹר בְּהֵמָ֑ה עַל כֵּן֩ אֲנִ֨י זֹבֵ֜חַ לַֽ/יהוָ֗ה כָּל פֶּ֤טֶר רֶ֨חֶם֙ הַ/זְּכָרִ֔ים וְ/כָל בְּכ֥וֹר בָּנַ֖/י אֶפְדֶּֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/015.yaml
  text: And when Pharaoh stubbornly refused to let us go[a], Yahweh killed every firstborn in the land of Egypt, from the firstborn of man to the firstborn of beast. Therefore I sacrifice to Yahweh every male that opens the womb, but every firstborn of my sons I redeem.
translation:
  language: hi
  text: और जब फ़िरौन ने हठ करके हमें जाने नहीं दिया, तब यहोवा ने मिस्र देश में मनुष्यों के पहलौठों से लेकर पशुओं के पहलौठों तक हर पहलौठे को मार डाला। इसी कारण मैं गर्भ खोलने वाले हर नर पहलौठे को यहोवा के लिए बलि चढ़ाता हूँ, पर अपने हर पहलौठे पुत्र को छुड़ाता हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִקְשָׁה ... לְשַׁלְּחֵנוּ
  choice: हठ करके हमें जाने नहीं दिया
  rationale: हिफ़ील रूप यहाँ फ़िरौन के अड़ियल प्रतिरोध को व्यक्त करता है; यह हिन्दी में स्वाभाविक रहते हुए निर्गमन-वृत्तांत की ‘जाने देना’ भाषा को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय परमेश्वर-नाम को हिन्दी की प्रचलित बाइबलीय वर्तनी में व्यक्तिगत नाम के रूप में सुरक्षित रखा गया है।
- source_word: בְּכוֹר
  choice: पहलौठा
  rationale: जन्म-क्रम में सबसे पहले जन्मे जन या पशु के लिए सटीक और परिचित हिन्दी शब्द; पद भर में इसे एकरूप रखा गया है।
- source_word: מִבְּכֹר אָדָם וְעַד בְּכוֹר בְּהֵמָה
  choice: मनुष्य के पहलौठे से लेकर पशु के पहलौठे तक
  rationale: אָדָם और בְּהֵמָה के मानव-पशु विरोध को सीधे सुरक्षित रखता है; ‘मनुष्य’ यहाँ समस्त मानवजाति के लिए व्यापक है।
- source_word: זֹבֵחַ
  choice: बलि करता हूँ
  rationale: क्रिया का आशय केवल मारना नहीं, बल्कि बलि के रूप में अर्पित करना है; वर्तमान हिन्दी में यह संक्षिप्त और स्पष्ट है।
- source_word: פֶּטֶר רֶחֶם הַזְּכָרִים
  choice: गर्भ खोलनेवाले हर नर को
  rationale: इब्रानी विधिक मुहावरे और नर-संतान की स्पष्ट सीमा को निकटता से सुरक्षित रखता है।
- source_word: בָּנַי אֶפְדֶּה
  choice: अपने पुत्रों के हर पहलौठे को छुड़ा लेता हूँ
  rationale: בָּנַי का पुरुषवाची अर्थ और פדה का प्रतिस्थापन अथवा मूल्य देकर मुक्त करने का विधिक-उपासना संबंधी भाव दोनों बनाए गए हैं।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में उपाधि नहीं, व्यक्तिगत वाचा-नाम है। हिन्दी पाठकों में स्थापित रूप ‘यहोवा’ नाम की विशिष्टता बनाए रखता है; ‘याहवे’ अधिक संभावित विद्वत् उच्चारण है।
- issue: मिस्र के पहलौठों की मृत्यु का कर्ता
  choice: यहोवा ने ... मार डाला
  alternative: यहोवा ने ... मरवा डाला
  rationale: मूल वाक्य यहोवा को प्रत्यक्ष व्याकरणिक कर्ता बनाता है; धार्मिक तनाव को नरम करने के लिए परोक्ष कारक नहीं जोड़ा गया।
- issue: मानव पहलौठों और पशु पहलौठों के साथ अलग व्यवहार
  choice: नर को ... बलि करता हूँ, पर ... पुत्रों के ... पहलौठे को छुड़ा लेता हूँ
  alternative: सब पहलौठों को अर्पित करता हूँ
  rationale: मूल का बलि और छुड़ौती के बीच स्पष्ट अंतर सुरक्षित है; मानव बलि का अर्थ उत्पन्न न हो, इसलिए विरोधसूचक ‘पर’ रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘पहलौठा’, ‘बलि’ और ‘छुड़ाना’ जैसे परिचित बाइबलीय-विधिक शब्द मूल के धार्मिक संदर्भ को बनाए रखते हैं। किसी पादटिप्पणी की आवश्यकता नहीं पड़ी।
