- source_word: חָמֵץ
  choice: खमीर उठी हुई कोई भी वस्तु
  rationale: यहाँ शब्द केवल खमीर नामक उठाने वाले पदार्थ के बजाय खमीर उठी वस्तु या भोजन को व्यापक रूप से सूचित करता है। यह अनुवाद अगले पद שְׂאֹר से उसका भेद बनाए रखता है।
