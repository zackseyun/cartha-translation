- source_word: בְּכָל גְּבֻלֶךָ
  choice: तुम्हारे पूरे क्षेत्र में
  rationale: यह अभिव्यक्ति व्यक्ति या समुदाय के अधिकार-क्षेत्र की संपूर्ण सीमा को दर्शाती है। ‘पूरे क्षेत्र में’ अर्थ को स्वाभाविक और व्यापक रूप से संप्रेषित करता है।
