  text: सातों दिन अखमीरी रोटी खाई जाए। तुम्हारे पास खमीर उठी कोई भी वस्तु[a] दिखाई न दे[b], और तुम्हारे पूरे क्षेत्र में खमीर दिखाई न दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी חָמֵץ का अर्थ खमीर उठी हुई कोई वस्तु या भोजन है; इसका अनुवाद ‘खमीरी रोटी’ भी किया जा सकता है। अगले वाक्यांश का שְׂאֹר विशेष रूप से खमीर उठाने वाले पदार्थ को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘तुम्हारे साथ दिखाई न दे।’ आशय यह है कि ऐसी वस्तु तुम्हारे अधिकार या दायरे में कहीं भी मौजूद न रहे।
    reason: lexical_alternative
