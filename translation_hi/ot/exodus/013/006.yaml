base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/006.yaml
  text: For seven days you shall eat unleavened bread[b][a], and on the seventh day there shall be a feast to Yahweh.
translation:
  language: hi
  text: सात दिन तक तुम बिना खमीर की रोटी खाओ, और सातवें दिन याहवे[a] के लिए एक पर्व[b] होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: ‘YHWH’; परंपरागत रूप से ‘प्रभु’ के रूप में अनुवादित।'
    reason: alternative_reading
  - marker: b
    text: या, ‘उत्सव’।
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבְעַת יָמִים
  choice: सात दिन तक
  rationale: यह रचना समयावधि बताती है; ‘तक’ आधुनिक हिन्दी में सात दिनों की अवधि को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: תֹּאכַל
  choice: तुम … खाना
  rationale: कानूनी-निर्देशात्मक प्रसंग में यह रूप आदेश का भाव रखता है। हिन्दी का ‘तुम … खाना’ सीधे निर्देश को स्वाभाविक ढंग से व्यक्त करता है, बिना उसे अनावश्यक रूप से कठोर बनाए।
- source_word: מַצּוֹת
  choice: बिना खमीर की रोटी
  rationale: यह फसह और पर्व के प्रसंग में खमीररहित रोटी को दर्शाता है। यह सामान्य पाठक के लिए ‘अख़मीरी रोटी’ से अधिक तुरंत स्पष्ट है।
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: और सातवें दिन
  rationale: वाव को उसके सामान्य संयोजक अर्थ ‘और’ में रखा गया है; शेष पदबंध घटना का समय बताता है।
- source_word: חַג
  choice: एक पर्व
  rationale: חַג धार्मिक उत्सव या पर्व को दर्शाता है। ‘पर्व’ हिन्दी में संक्षिप्त, गरिमापूर्ण और इस उपासना-संबंधी प्रसंग के अनुकूल है।
- source_word: לַיהוָה
  choice: याहवे के लिए
  rationale: ל समर्पण या संबंध का भाव व्यक्त करता है। ‘के लिए’ पर्व के याहवे को समर्पित होने का अर्थ स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु; यहोवा
  rationale: मूल पाठ में चार अक्षरों वाला वाचा-नाम יהוה सीधे आया है। ‘याहवे’ उस नाम का प्रचलित विद्वत्तापूर्ण लिप्यंतरण है; इसे केवल उपाधि ‘प्रभु’ से बदलने पर मूल का व्यक्तिगत नाम छिप जाता, जबकि ‘यहोवा’ बाद की मिश्रित उच्चारण-परंपरा को दर्शाता है।
- issue: חַג לַיהוָה की क्रियारहित रचना
  choice: याहवे के लिए एक पर्व होगा
  alternative: याहवे का पर्व मनाना
  rationale: इब्रानी में स्पष्ट क्रिया नहीं है। हिन्दी में पूर्ण वाक्य के लिए ‘होगा’ जोड़ा गया है, पर पर्व मनाने वाले कर्ता या विस्तृत अनुष्ठान को पाठ में नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और निर्देशात्मक रखी गई है। ‘बिना खमीर की रोटी’ सामान्य पाठक के लिए सहज है, और ‘पर्व’ धार्मिक प्रसंग की गरिमा बनाए रखता है। एकवचन पुरुष संबोधन को ‘तुम’ से व्यक्त किया गया है।
