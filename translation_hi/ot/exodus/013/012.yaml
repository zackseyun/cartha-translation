  text: you shall set apart to Yahweh every one that opens the womb[b][a], and every male firstborn of the livestock that you have belongs to Yahweh.
translation:
  language: hi
  text: तू हर उस संतान को जो गर्भ खोलती है[a] यहवे के लिए अलग कर देना, और तेरे पास के पशुओं की हर पहली संतान में से जो नर हों[b], वे यहवे के होंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “हर गर्भ खोलनेवाला।” अर्थात गर्भ से जन्म लेनेवाली पहली संतान।'
    reason: lexical_alternative
  - marker: b
    text: या, “पशुओं की हर पहली जन्मी संतान”; इब्रानी अभिव्यक्ति पालतू पशुओं की पहली जन्मी संतान को दर्शाती है। पद के अंत में स्पष्ट किया गया है कि उनमें से नर यहवे के होंगे।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַעֲבַרְתָּ
  choice: अलग करना
  rationale: हिफ़ील रूप का मूल अर्थ ‘पार कराना/आगे सौंपना’ है; इस उपासना-संबंधी संदर्भ में यह यहवे के लिए समर्पित करके अलग रखने को दर्शाता है।
- source_word: פֶּטֶר רֶחֶם
  choice: हर गर्भ खोलनेवाले को
  rationale: इब्रानी मुहावरे ‘गर्भ खोलनेवाला’ को सुरक्षित रखता है, अर्थात गर्भ से जन्म लेनेवाली पहली संतान।
- source_word: לַיהוָה
  choice: यहवे के लिए
  rationale: वाचा के नाम יהוה को लिप्यंतरित रूप ‘यहवे’ में प्रस्तुत किया गया है।
- source_word: פֶּטֶר שֶׁגֶר בְּהֵמָה
  choice: पशुओं में गर्भ से निकलनेवाली हर पहली संतान
  rationale: שֶׁגֶר पशुओं की जन्मी हुई संतान को सूचित करता है; यह अनुवाद जन्म और प्रथम संतान—दोनों अर्थों को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: אֲשֶׁר יִהְיֶה לְךָ
  choice: तुम्हारे पशुओं में
  rationale: संबंधवाचक उपवाक्य पशुओं के संबोधित व्यक्ति के अधिकार में होने को बताता है; हिंदी में यह संक्षिप्त और स्वाभाविक है।
- source_word: הַזְּכָרִים
  choice: जितने नर हों
  rationale: संज्ञीकृत बहुवचन ‘नर वाले/नर’ को वर्गगत रूप में अलग करके रखता है और केवल नर संतानों पर विधान लागू होने की बात स्पष्ट करता है।
- source_word: לַיהוָה
  choice: यहवे की होगी
  rationale: अंतिम वाक्यांश अधिकार और पवित्र समर्पण का भाव व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का विशिष्ट नाम सीधे आया है; ‘यहवे’ उसे उपाधि में बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: पहली संतान का समर्पण
  choice: अलग करना … यहवे की होगी
  alternative: चढ़ा देना
  rationale: यहाँ स्वामित्व और पवित्र समर्पण स्पष्ट हैं, पर इसी पद में बलिदान की विधि निर्दिष्ट नहीं है; इसलिए ‘चढ़ा देना’ जैसी अधिक संकीर्ण व्याख्या नहीं जोड़ी गई।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी की, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘गर्भ खोलनेवाला’ मूल कानूनी-धार्मिक मुहावरे को बचाता है; साथ की पादटिप्पणियाँ उसका अर्थ स्पष्ट करती हैं।
