base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/009.yaml
  text: And it shall be for you as a sign on your hand and as a memorial between your eyes[a], so that the law of Yahweh may be in your mouth[c][b]; for with a strong hand Yahweh brought you out of Egypt.
translation:
  language: hi
  text: और यह तुम्हारे लिए तुम्हारे हाथ पर एक चिन्ह और तुम्हारी आँखों के बीच एक स्मरण-चिह्न[a] ठहरे, जिससे यहोवा की व्यवस्था[b] तुम्हारे मुँह में रहे; क्योंकि यहोवा तुम्हें शक्तिशाली हाथ[c] से मिस्र से बाहर ले आया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘आँखों के बीच’ को मुहावरे के रूप में ‘माथे पर’ भी समझा जा सकता है; मुख्य पाठ में हिब्रू अभिव्यक्ति को अक्षरशः रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: या ‘यहोवा की शिक्षा।’ हिब्रू शब्द ‘तोराह’ का अर्थ प्रसंग के अनुसार ‘व्यवस्था’ या ‘शिक्षा’ हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘बलवन्त हाथ से’; यह एक पारंपरिक अनुवाद है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: और यह ... ठहरे
  rationale: संयुक्त पूर्ण क्रिया यहाँ भावी/निर्देशात्मक अर्थ रखती है। ‘ठहरे’ हिन्दी में उद्देश्य और स्थायी भूमिका को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְאוֹת
  choice: एक चिन्ह
  rationale: אוֹת का व्यापक अर्थ चिन्ह या निशानी है; ‘चिन्ह’ प्रतीकात्मक और संभावित भौतिक दोनों अर्थों को खुला रखता है।
- source_word: עַל יָדְךָ
  choice: तुम्हारे हाथ पर
  rationale: हिब्रू के ठोस चित्र को अक्षरशः रखा गया है और इसे बाँह अथवा किसी बाद की धार्मिक वस्तु के रूप में नहीं समझाया गया।
- source_word: וּלְזִכָּרוֹן
  choice: एक स्मरण-चिह्न
  rationale: זִכָּרוֹן स्मरण कराने वाली निशानी या स्मारक को दर्शाता है। इस प्रसंग में ‘स्मरण-चिह्न’ सहज हिन्दी में उसके स्मारक भाव को बनाए रखता है।
- source_word: בֵּין עֵינֶיךָ
  choice: तुम्हारी आँखों के बीच
  rationale: मूल शब्दावली अक्षरशः रखी गई है; ‘माथे पर’ सम्भव मुहावरेदार अर्थ है, जिसे पादटिप्पणी में दिया गया है।
- source_word: לְמַעַן
  choice: जिससे
  rationale: यह उद्देश्यसूचक सम्बन्ध को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: תּוֹרַת יְהוָה
  choice: यहोवा की व्यवस्था
  rationale: תּוֹרָה का अर्थ व्यवस्था अथवा शिक्षा हो सकता है। निर्गमन के वाचा-सन्दर्भ में ‘व्यवस्था’ उपयुक्त है, जबकि ‘शिक्षा’ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: בְּפִיךָ
  choice: तुम्हारे मुँह में बनी रहे
  rationale: ‘मुँह में’ का मूल बिम्ब रखा गया है; ‘बनी रहे’ पाठ करने और बोलने के लिए निरन्तर उपस्थित रहने का भाव देता है।
- source_word: בְּיָד חֲזָקָה
  choice: बलवन्त हाथ से
  rationale: यह मूल ‘दृढ़/शक्तिशाली हाथ’ के निकट है और निर्गमन में यहोवा के सामर्थ्यपूर्ण छुटकारे का बिम्ब बनाए रखता है।
- source_word: הוֹצִאֲךָ
  choice: तुम्हें ... बाहर ले आया
  rationale: יצא के हिफ़ईल रूप का अर्थ किसी को बाहर निकालना या ले आना है; यह हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल में प्रयुक्त परमेश्वर के व्यक्तिगत नाम יהוה को हिन्दी में प्रचलित लिप्यन्तरण ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से नहीं।
theological_decisions:
- issue: हाथ और आँखों के बीच की भाषा को अक्षरशः रखना या बाद की तफिलीन परम्परा के रूप में स्पष्ट करना
  choice: मुख्य पाठ में ‘हाथ पर’ और ‘आँखों के बीच’ का ठोस बिम्ब रखा गया।
  alternative: ‘बाँह पर बाँधना’ और ‘माथे पर रखना’, या इसे केवल रूपक के रूप में प्रस्तुत करना।
  rationale: मूल पाठ बाद की धार्मिक वस्तु का नाम नहीं लेता और न यह निश्चित करता है कि भाषा केवल रूपक है। अक्षरशः प्रस्तुति दोनों सम्भावनाओं को खुला रखती है।
- issue: תּוֹרָה का अनुवाद
  choice: मुख्य पाठ में ‘व्यवस्था’।
  alternative: ‘शिक्षा’ या ‘तोरा’।
  rationale: वाचा-संबंधी प्रसंग में ‘व्यवस्था’ स्वाभाविक और अर्थक्षेत्र के भीतर है; फिर भी व्यापक शिक्षात्मक अर्थ को पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठकों के लिए सुबोध रूप अपनाया गया है। वाक्य में मूल के ठोस बिम्ब और कारण-उद्देश्य सम्बन्ध सुरक्षित हैं; अत्यधिक संस्कृतनिष्ठ या सम्प्रदाय-विशिष्ट भाषा से बचा गया है।
