  text: בֵּינִ֗/י וּ/בֵין֙ בְּנֵ֣י יִשְׂרָאֵ֔ל א֥וֹת הִ֖וא לְ/עֹלָ֑ם כִּי שֵׁ֣שֶׁת יָמִ֗ים עָשָׂ֤ה יְהוָה֙ אֶת הַ/שָּׁמַ֣יִם וְ/אֶת הָ/אָ֔רֶץ וּ/בַ/יּוֹם֙ הַ/שְּׁבִיעִ֔י שָׁבַ֖ת וַ/יִּנָּפַֽשׁ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/017.yaml
  text: It is a sign forever between me and the sons of Israel[a], for in six days Yahweh made the heavens and the earth[c][b], and on the seventh day he ceased and was refreshed.
translation:
  language: hi
  text: वह मेरे और इस्राएल के पुत्रों[a] के बीच सदा के लिए एक चिन्ह है, क्योंकि छह दिनों में याहवे ने आकाश और पृथ्वी को बनाया, और सातवें दिन उसने काम करना छोड़ दिया[b] और तरोताज़ा हुआ[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस्राएली।”
    reason: lexical_alternative
  - marker: b
    text: या, “उसने विश्राम किया”; इब्रानी क्रिया का अधिक मूल अर्थ “रुकना” या “काम छोड़ देना” है।
    reason: lexical_alternative
  - marker: c
    text: या, “उसने दम लिया” अथवा “नया दम पाया”; इब्रानी में यहाँ सजीव, मनुष्य-सदृश भाषा प्रयुक्त हुई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּינִי וּבֵין
  choice: मेरे और ... के बीच
  rationale: हिन्दी में दो पक्षों के पारस्परिक संबंध को व्यक्त करने का स्वाभाविक और सटीक ढंग।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: मूल के पारिवारिक और पुरुषवाची रूप को सुरक्षित रखता है; अधिक मुहावरेदार विकल्प फुटनोट में दिया गया है।
- source_word: אוֹת
  choice: चिन्ह
  rationale: वाचा के संबंध को प्रकट करने वाले स्थायी संकेत के लिए मानक हिन्दी शब्द।
- source_word: לְעֹלָם
  choice: सदा के लिए
  rationale: दीर्घस्थायी अवधि का सीधा, स्वाभाविक हिन्दी अनुवाद।
- source_word: כִּי
  choice: क्योंकि
  rationale: सब्त के चिन्ह होने का आधार या कारण प्रस्तुत करता है।
- source_word: שֵׁשֶׁת יָמִים
  choice: छह दिनों में
  rationale: सृष्टि-कार्य की कालावधि को हिन्दी में स्वाभाविक रूप से व्यक्त करता है।
- source_word: עָשָׂה
  choice: बनाया
  rationale: आकाश और पृथ्वी के विषय में परमेश्वर के सृजनात्मक कार्य का उपयुक्त संदर्भगत अर्थ।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी दिव्य नाम का प्रचलित लिप्यंतरण, जो इसे किसी सामान्य उपाधि से प्रतिस्थापित नहीं करता।
- source_word: הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: आकाश और पृथ्वी
  rationale: समस्त सृष्टि को सूचित करने वाली इब्रानी युग्म-अभिव्यक्ति का स्वाभाविक हिन्दी रूप; हिन्दी में ‘आकाश’ सामान्यतः एकवचन रूप में प्रयुक्त होता है।
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: और सातवें दिन
  rationale: मूल के साधारण क्रमसूचक संयोजन और समयवाचक वाक्यांश को बनाए रखता है।
- source_word: שָׁבַת
  choice: उसने काम करना छोड़ दिया
  rationale: क्रिया का मूल भाव काम से रुकना या उसे समाप्त करना है; इससे थकावट का अनावश्यक अर्थ आरोपित नहीं होता।
- source_word: וַיִּנָּפַשׁ
  choice: दम लिया
  rationale: मूल की सजीव, मनुष्य-सदृश अभिव्यक्ति को संक्षिप्त और स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के लिए मनुष्य-सदृश सब्त भाषा
  choice: काम करना छोड़ दिया और दम लिया
  alternative: विश्राम किया और तरोताज़ा हुआ
  rationale: इब्रानी पाठ की दो अलग क्रियाओं और उसकी जानबूझकर प्रयुक्त सजीव देहधर्मी भाषा को बनाए रखता है, बिना उसे किसी अमूर्त धर्मवैज्ञानिक कथन में बदलने के।
- issue: בְּנֵי יִשְׂרָאֵל का अनुवाद
  choice: इस्राएल के पुत्रों
  alternative: इस्राएली
  rationale: मूल की पुरुषवाची पारिवारिक अभिव्यक्ति को मुख्य पाठ में सुरक्षित रखता है, जबकि मुहावरेदार सामुदायिक अर्थ फुटनोट में उपलब्ध है।
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ में उपस्थित विशिष्ट दिव्य नाम को उपाधि में बदलने के बजाय लिप्यंतरित करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य की वाचायी गंभीरता बनाए रखते हुए ‘दम लिया’ में मूल की सजीवता और धर्मवैज्ञानिक तनाव सुरक्षित रखा गया है।
