  yaml_path: translation/ot/exodus/031/003.yaml
  text: And I have filled him with the Spirit of God[a], with wisdom, with understanding, with knowledge, and with every kind of craftsmanship,
translation:
  language: hi
  text: और मैंने उसे परमेश्वर के आत्मा[a] से—बुद्धि, समझ, ज्ञान और हर प्रकार की कारीगरी में कुशलता से—भर दिया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ईश्वरीय आत्मा” या “दैवी आत्मा।” इब्रानी पदबंध का अर्थ अधिक सामान्य भी हो सकता है; पर यहाँ संभवतः परमेश्वर की अपनी आत्मा अभिप्रेत है, जो उसे सामर्थ्य देती है।
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֲמַלֵּא
  choice: और मैंने ... भर दिया है
  rationale: מלא का अर्थ ‘भरना’ है। यहाँ पूर्ण हुई ऐसी देन व्यक्त है जिसका प्रभाव वर्तमान में बना हुआ है; इसलिए हिंदी में ‘भर दिया है’ स्वाभाविक और संदर्भानुकूल है।
- source_word: אֹתוֹ
  choice: उसे
  rationale: यह निकटवर्ती संदर्भ में बसलेल की ओर संकेत करने वाला प्रत्यक्ष कर्म सर्वनाम है।
- source_word: רוּחַ אֱלֹהִים
  choice: परमेश्वर के आत्मा
  rationale: सम्बन्ध-वाचक इब्रानी पदबंध को हिंदी में स्वाभाविक रूप से व्यक्त किया गया है। पवित्र निवास के काम के लिए परमेश्वर द्वारा सामर्थ्य दिए जाने के संदर्भ में यह परमेश्वर के अपने आत्मा की ओर संकेत करता जान पड़ता है, जबकि व्यापक अर्थ की संभावना पाद-टिप्पणी में सुरक्षित है।
- source_word: בְּחָכְמָה
  choice: बुद्धि
  rationale: חכמה का सामान्य अर्थ ‘बुद्धि’ है; ‘से’ पूरे समन्वित पद-क्रम पर लागू होता है।
- source_word: וּבִתְבוּנָה
  choice: समझ
  rationale: תבונה समझ, अंतर्दृष्टि या विवेक को दर्शाता है। ‘समझ’ आधुनिक हिंदी में सरल है और त्रिक्रम को स्पष्ट रखता है।
- source_word: וּבְדַעַת
  choice: ज्ञान
  rationale: דעת के लिए ‘ज्ञान’ सीधा और प्रचलित समतुल्य है।
- source_word: וּבְכָל מְלָאכָה
  choice: हर प्रकार की कारीगरी के कौशल
  rationale: מלאכה काम या शिल्पकारी को दर्शा सकता है। अगले पदों में कलात्मक और निर्माण-संबंधी कार्यों का वर्णन होने के कारण ‘कारीगरी के कौशल’ संदर्भगत अर्थ को स्वाभाविक हिंदी में स्पष्ट करता है; כל को ‘हर प्रकार की’ से व्यक्त किया गया है।
theological_decisions:
- issue: רוּחַ אֱלֹהִים को परमेश्वर के अपने आत्मा के रूप में समझा जाए या अधिक सामान्य ‘ईश्वरीय आत्मा/सामर्थ्य’ के रूप में
  choice: परमेश्वर के आत्मा
  alternative: ईश्वरीय आत्मा; अथवा परमेश्वर की ओर से मिला आत्मिक सामर्थ्य
  rationale: वक्ता स्वयं परमेश्वर हैं और प्रसंग बसलेल को पवित्र निवास की सेवा के लिए सीधे सामर्थ्य दिए जाने का है। इसलिए मुख्य पाठ में परमेश्वर के अपने आत्मा का अर्थ अधिक संभावित है, पर इब्रानी पदबंध की व्यापक अर्थ-संभावना को पाद-टिप्पणी में बनाए रखा गया है; बाद की धर्मवैज्ञानिक सूक्ष्मताओं को पाठ पर आरोपित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। डैश यह स्पष्ट करते हैं कि बुद्धि, समझ, ज्ञान और कारीगरी का कौशल उस भरपूरी के परस्पर जुड़े पहलू हैं। ‘आत्मा’ को हिंदी व्याकरण में पुल्लिंग मानते हुए ‘परमेश्वर के आत्मा से’ लिखा गया है।
