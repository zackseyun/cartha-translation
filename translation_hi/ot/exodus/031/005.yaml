lexical_decisions:
- source_word: וּבַחֲרֹשֶׁת
  choice: काटने / तराशने में
  rationale: חרשׁת कुशल शिल्प-कर्म को सूचित करता है। सामग्री के अनुसार पत्थर के लिए ‘काटने’ और लकड़ी के लिए ‘तराशने’ से ठोस कारीगरी स्वाभाविक हिन्दी में स्पष्ट होती है।
- source_word: אֶבֶן
  choice: पत्थर
  rationale: यह पत्थर का सामान्य शब्द है। सन्दर्भ में बहुमूल्य रत्न सम्मिलित हो सकते हैं, पर मूल पद स्वयं अर्थ को इतना सीमित नहीं करता।
- source_word: לְמַלֹּאת
  choice: जड़ने के लिए
  rationale: कारीगरी के इस सन्दर्भ में यह पत्थरों को किसी आधार या खाने में जड़ने की क्रिया बताता है; ‘जड़ने’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: עֵץ
  choice: लकड़ी
  rationale: सामग्री के सामान्य अर्थ को आधुनिक हिन्दी में सहज रूप से व्यक्त करता है।
- source_word: לַעֲשׂוֹת
  choice: करने में
  rationale: עשה की व्यापकता बनाए रखता है और ‘हर प्रकार की कारीगरी’ के साथ स्वाभाविक बैठता है।
- source_word: בְּכָל מְלָאכָה
  choice: हर प्रकार की कारीगरी
  rationale: מְלָאכָה यहाँ काम अथवा कुशल श्रम को दर्शाता है। तत्काल शिल्प-सन्दर्भ के कारण ‘कारीगरी’ सामान्य ‘काम’ की अपेक्षा आशय को अधिक स्पष्ट करता है, जबकि ‘हर प्रकार’ उसकी व्यापकता बनाए रखता है।
