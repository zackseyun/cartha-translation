source:
  edition: WLC
  text: שֵׁ֣שֶׁת יָמִים֮ יֵעָשֶׂ֣ה מְלָאכָה֒ וּ/בַ/יּ֣וֹם הַ/שְּׁבִיעִ֗י שַׁבַּ֧ת שַׁבָּת֛וֹן קֹ֖דֶשׁ לַ/יהוָ֑ה כָּל הָ/עֹשֶׂ֧ה מְלָאכָ֛ה בְּ/י֥וֹם הַ/שַּׁבָּ֖ת מ֥וֹת יוּמָֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/015.yaml
  text: Work may be done for six days[a], but on the seventh day there is a Sabbath of complete rest, holy to Yahweh. Whoever does work on the Sabbath day shall surely be put to death.
translation:
  language: hi
  text: छह दिन तक काम किया जा सकता है, पर सातवाँ दिन पूर्ण विश्राम का शब्बात है, जो यहोवा के लिए पवित्र है। जो कोई शब्बात के दिन काम करे, वह निश्चय ही मार डाला जाएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֵעָשֶׂה מְלָאכָה
  choice: काम किया जा सकता है
  rationale: निफ़ाल अपूर्ण क्रिया के कर्मवाच्य रूप को बनाए रखता है और विधिक संदर्भ में अनुमति का स्वाभाविक भाव देता है।
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: पर सातवाँ दिन
  rationale: वाव का यहाँ छह कार्य-दिवसों और सातवें दिन के बीच स्पष्ट विरोध है; ‘पर’ आधुनिक हिन्दी में इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: שַׁבַּת שַׁבָּתוֹן
  choice: पूर्ण विश्राम का शब्बात
  rationale: ‘शब्बात’ नाम को रखते हुए שַׁבָּתוֹן से व्यक्त विश्राम/काम रोकने की तीव्रता को ‘पूर्ण विश्राम’ द्वारा दर्शाता है।
- source_word: קֹדֶשׁ לַיהוָה
  choice: जो यहोवा के लिए पवित्र है
  rationale: קֹדֶשׁ की पवित्र स्थिति और ל की समर्पण-संबंधी दिशा दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी व्यक्तिगत नाम को हिन्दी में प्रचलित प्रतिलेखन ‘यहोवा’ से प्रस्तुत किया गया है, किसी उपाधि से नहीं।
- source_word: כָּל הָעֹשֶׂה מְלָאכָה
  choice: जो कोई ... काम करे
  rationale: כָּל के सार्वत्रिक विधिक बल और कृदंत के सामान्य नियम को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: शब्बात के दिन
  rationale: मूल पाठ में उपस्थित יוֹם ‘दिन’ को स्पष्ट रूप से बनाए रखता है।
- source_word: מוֹת יוּמָת
  choice: निश्चय ही मार डाला जाए
  rationale: इनफ़िनिटिव ऐब्सोल्यूट की तीव्रता को ‘निश्चय ही’ और होफ़ाल के कर्मवाच्य दंडात्मक अर्थ को ‘मार डाला जाए’ से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ के व्यक्तिगत वाचा-नाम को उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं किया गया। आधुनिक हिन्दी पाठकों में पहचाने जाने वाले प्रतिलेखन ‘यहोवा’ को चुना गया; ‘याहवे’ निकटतर वैकल्पिक प्रतिलेखन है।
- issue: שַׁבַּת שַׁבָּתוֹן की तीव्रता
  choice: पूर्ण विश्राम का शब्बात
  alternative: शब्बात, अर्थात गंभीर विश्राम
  rationale: दोनों इब्रानी संज्ञाओं को ध्यान में रखते हुए शब्बात की पहचान और पूर्ण कामबंदी/विश्राम का बल सुरक्षित रखा गया है, बिना किसी बाद की सांप्रदायिक व्याख्या को जोड़े।
- issue: מוֹת יוּמָת में दंड का स्वरूप
  choice: निश्चय ही मार डाला जाए
  alternative: अवश्य मृत्यु-दंड दिया जाए
  rationale: होफ़ाल का कर्मवाच्य अर्थ और इब्रानी तीव्रकारी रचना दोनों सुरक्षित रखे गए हैं; पाठ केवल स्वाभाविक मृत्यु नहीं, दंडस्वरूप मारे जाने की बात करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और विधिक लहजा रखा गया है। ‘शब्बात’ मूल सांस्कृतिक-धार्मिक पद को सुरक्षित रखता है; ‘काम’ सामान्य पाठक के लिए व्यापक और सहज है।
