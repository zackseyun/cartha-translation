id: EXO.31.16
reference: Exodus 31:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/שָׁמְר֥וּ בְנֵֽי יִשְׂרָאֵ֖ל אֶת הַ/שַּׁבָּ֑ת לַ/עֲשׂ֧וֹת אֶת הַ/שַּׁבָּ֛ת לְ/דֹרֹתָ֖/ם בְּרִ֥ית עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/016.yaml
  text: So the sons of Israel shall keep the Sabbath[c][b][a], to observe the Sabbath throughout their generations as an everlasting covenant.
translation:
  language: hi
  text: इसलिए इस्राएल के पुत्र विश्राम-दिन का पालन करें और पीढ़ी-दर-पीढ़ी विश्राम-दिन मनाते रहें—यह सदा की वाचा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשָׁמְרוּ
  choice: इसलिए ... पालन करें
  rationale: שׁמר का अर्थ यहाँ वाचा की आज्ञा के रूप में ‘पालन करना’ है। आरंभिक וְ को पिछले संदर्भ के निष्कर्ष से जोड़ने के लिए स्वाभाविक हिन्दी में ‘इसलिए’ किया गया है।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्र
  rationale: यह इब्रानी पद का निकट और लिंग-सटीक रूप है; प्रसंग में यह वाचा-समुदाय के लिए सामूहिक पद है।
- source_word: הַשַּׁבָּת
  choice: विश्राम-दिन
  rationale: यहाँ שַׁבָּת सामान्य विश्राम नहीं, निर्धारित वाचा-चिह्न और पवित्र दिन को सूचित करता है; ‘विश्राम-दिन’ आधुनिक हिन्दी में स्पष्ट और प्रतिष्ठित बाइबलीय पद है।
- source_word: לַעֲשׂוֹת אֶת הַשַּׁבָּת
  choice: विश्राम-दिन मनाते रहें
  rationale: शाब्दिक अर्थ ‘विश्राम-दिन करना’ हिन्दी में अस्वाभाविक है। ‘मनाते रहें’ संस्था के सक्रिय और निरंतर निर्वाह को व्यक्त करता है तथा पहले आए ‘पालन करें’ की भद्दी पुनरावृत्ति से बचाता है।
- source_word: לְדֹרֹתָם
  choice: पीढ़ी-दर-पीढ़ी
  rationale: यह उनकी क्रमिक पीढ़ियों में निरंतर पालन का स्वाभाविक हिन्दी रूप है।
- source_word: בְּרִית עוֹלָם
  choice: सदा की वाचा
  rationale: בְּרִית का मानक अर्थ ‘वाचा’ है और עוֹלָם यहाँ स्थायी, अनवरत अवधि व्यक्त करता है। ‘सदा की’ उस दीर्घकालिक वाचागत बल को बनाए रखता है।
theological_decisions:
- issue: वाचा-समुदाय के पद בְנֵי יִשְׂרָאֵל का अनुवाद
  choice: इस्राएल के पुत्र
  alternative: इस्राएली / इस्राएल की संतान
  rationale: मूल का पुरुषवाचक पारिवारिक रूप सुरक्षित रखा गया है, जबकि उसका सामूहिक संदर्भ पाठक के लिए खुला रहता है।
- issue: בְּרִית עוֹלָם की अवधि
  choice: सदा की वाचा
  alternative: अनन्त वाचा / चिरस्थायी वाचा
  rationale: यह अनुवाद पद की स्थायित्व-संबंधी शक्ति को बनाए रखता है, पर इस एक वचन से उसकी बाद की धर्मवैज्ञानिक व्यवस्था के विषय में अतिरिक्त निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सरल और गरिमापूर्ण है। ‘पालन करें’ और ‘मनाते रहें’ मूल की दो अलग क्रियाओं—שׁמר और עשׂה—को स्वाभाविक हिन्दी में अलग रखते हैं। अंतिम खंड को डैश से पूर्ववर्ती पालन की ‘सदा की वाचा’ के रूप में व्याख्यात्मक/विधेयात्मक पहचान दी गई है।
