base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/018.yaml
  text: And when he finished speaking with him on Mount Sinai[a], he gave Moses the two tablets of the testimony, tablets of stone, written with the finger of God.
translation:
  language: hi
  text: जब परमेश्वर ने सीनै पर्वत पर मूसा से बात करना समाप्त किया, तब उसने मूसा को गवाही की दो पट्टिकाएँ दीं—पत्थर की पट्टिकाएँ, जो परमेश्वर की उँगली से लिखी हुई थीं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर की उँगली द्वारा।” यह इब्रानी की सजीव अभिव्यक्ति है, जो पट्टिकाओं के लेखन को सीधे परमेश्वर का कार्य बताती है।
    reason: करणवाचक इब्रानी अभिव्यक्ति के सम्भव हिन्दी विकल्प को दर्शाना और मूल की देहात्मक छवि तथा प्रत्यक्ष दैवी कर्तृत्व को सुरक्षित रखना।
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: तब उसने … दीं
  rationale: नतन के कथात्मक रूप को स्वाभाविक हिन्दी भूतकाल में रखा गया है; ‘तब’ पहले उपवाक्य के बाद घटना-क्रम स्पष्ट करता है।
- source_word: כְּכַלֹּתוֹ לְדַבֵּר אִתּוֹ
  choice: जब परमेश्वर ने … मूसा से बात करना समाप्त किया
  rationale: כְּ के साथ כלה का infinitive construct कार्य की समाप्ति के समय को दर्शाता है। प्रसंग के आधार पर कर्ता परमेश्वर और सर्वनाम का संदर्भ मूसा स्पष्ट किया गया है।
- source_word: בְּהַר סִינַי
  choice: सीनै पर्वत पर
  rationale: स्थानवाचक ב और पर्वत के नाम का स्वाभाविक आधुनिक हिन्दी रूप।
- source_word: שְׁנֵי לֻחֹת הָעֵדֻת
  choice: साक्षी की दो पट्टिकाएँ
  rationale: לֻחֹת के लिए ‘पट्टिकाएँ’ और עֵדוּת के मूल साक्षी/गवाही भाव के लिए ‘साक्षी’ रखा गया है; ‘वाचा का दस्तावेज़’ अर्थ को अनावश्यक रूप से विस्तार देता।
- source_word: לֻחֹת אֶבֶן
  choice: पत्थर की पट्टिकाएँ
  rationale: यह रचना पट्टिकाओं की सामग्री बताती है और हिन्दी में स्वाभाविक पुनरुक्ति के साथ मूल का समानाधिकरण बनाए रखती है।
- source_word: כְּתֻבִים
  choice: लिखी हुई थीं
  rationale: כתב के कर्मवाच्य कृदंत का सीधा और सहज हिन्दी रूप।
- source_word: בְּאֶצְבַּע אֱלֹהִים
  choice: परमेश्वर की उँगली से
  rationale: करणवाचक ב को ‘से’ द्वारा व्यक्त किया गया है और मूल की सजीव देहात्मक छवि सुरक्षित रखी गई है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: यहाँ शब्द इस्राएल के परमेश्वर के लिए एकवचन अर्थ में प्रयुक्त है; ‘परमेश्वर’ मानक, गरिमापूर्ण हिन्दी रूप है।
theological_decisions:
- issue: लेखन में परमेश्वर के लिए देहात्मक अभिव्यक्ति
  choice: परमेश्वर की उँगली से
  alternative: सीधे परमेश्वर द्वारा / परमेश्वर की सामर्थ्य से
  rationale: मूल पाठ की ठोस छवि और प्रत्यक्ष दैवी कर्तृत्व को सुरक्षित रखा गया है; उसे केवल ‘सामर्थ्य’ जैसी अमूर्त व्याख्या में नहीं बदला गया।
- issue: क्रियाओं के अनुल्लिखित कर्ता की पहचान
  choice: पहले उपवाक्य में ‘परमेश्वर’ और आगे ‘उसने’
  alternative: दोनों स्थानों पर केवल ‘उसने’
  rationale: इब्रानी कथानक और निकटवर्ती प्रसंग कर्ता को परमेश्वर बताते हैं। आधुनिक हिन्दी में आरम्भ से केवल सर्वनाम रखने पर अनावश्यक अस्पष्टता उत्पन्न होती।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘पट्टिकाएँ’ सामान्य पाठक के लिए स्पष्ट है, जबकि ‘साक्षी’ मूल के वाचागत अर्थ को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
