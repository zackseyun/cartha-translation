  yaml_path: translation/ot/exodus/031/002.yaml
  text: See[a], I have called by name Bezalel son of Uri, son of Hur, of the tribe of Judah.
translation:
  language: hi
  text: देख, मैंने यहूदा के गोत्र के बसलेल को, जो हूर के पुत्र ऊरी का पुत्र है, नाम लेकर बुलाया है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘नाम लेकर बुलाया है’ का अर्थ यहाँ किसी व्यक्ति को विशेष रूप से चुनना या निर्दिष्ट करना भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: देख
  rationale: ראה का पुल्लिंग एकवचन आज्ञार्थक रूप यहाँ श्रोता का ध्यान खींचता है। ‘देख’ इब्रानी की प्रत्यक्षता बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: קָרָאתִי
  choice: मैंने ... बुलाया है
  rationale: קרא का काल रूप पूर्ण की गई क्रिया व्यक्त करता है; בשם के साथ यह बुलाने के साथ विशिष्ट रूप से चुनने या निर्दिष्ट करने का भाव भी रख सकता है। ‘बुलाया है’ मूल क्रिया को सीधे रखता है और ‘नियुक्त किया’ जैसी अतिरिक्त व्याख्या नहीं जोड़ता।
- source_word: בְשֵׁם
  choice: नाम लेकर
  rationale: קרא בשם का मुहावरा किसी व्यक्ति को नाम से बुलाने और उसे व्यक्तिगत रूप से निर्दिष्ट करने का भाव दे सकता है। ‘नाम लेकर’ हिन्दी में स्वाभाविक रहते हुए इस मुहावरे को सुरक्षित रखता है।
- source_word: בְּצַלְאֵל
  choice: बसलेल
  rationale: व्यक्तिवाचक नाम का हिन्दी बाइबलीय परंपरा के अनुरूप लिप्यंतरण।
- source_word: בֶּן
  choice: पुत्र
  rationale: वंश-परिचय के इस सूत्र में בן का सामान्य अर्थ ‘पुत्र’ है; व्यापक ‘वंशज’ अर्थ यहाँ आवश्यक नहीं।
- source_word: אוּרִי
  choice: ऊरी
  rationale: व्यक्तिवाचक नाम का देवनागरी लिप्यंतरण।
- source_word: חוּר
  choice: हूर
  rationale: व्यक्तिवाचक नाम का देवनागरी लिप्यंतरण।
- source_word: לְמַטֵּה
  choice: के गोत्र के
  rationale: מַטֶּה यहाँ ‘गोत्र’ को दर्शाता है और उपसर्ग ל संबद्धता बताता है। हिन्दी वाक्य में ‘के गोत्र के’ जनजातीय संबद्धता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוּדָה
  choice: यहूदा
  rationale: गोत्र के नाम का प्रचलित हिन्दी लिप्यंतरण।
theological_decisions:
- issue: ‘नाम लेकर बुलाना’ में बुलाहट और नियुक्ति का संबंध
  choice: मुख्य पाठ में ‘नाम लेकर बुलाया है’
  alternative: ‘नाम लेकर नियुक्त किया है’ या ‘विशेष रूप से चुना है’
  rationale: इब्रानी मुहावरे में विशिष्ट व्यक्तिगत चयन का भाव संभव है, पर ‘नियुक्त’ अनुवाद उस भाव को स्पष्ट करके मूल की अर्थ-सीमा को संकरा कर देगा। इसलिए मुख्य पाठ में सीधा मुहावरा रखा गया और उसका संभावित आशय पाद-टिप्पणी में बताया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज रखी गई है। वंश-परिचय को हिन्दी की स्वाभाविक उलटी क्रम-रचना—‘हूर के पुत्र ऊरी के पुत्र बसलेल’—में रखा गया है। ‘देख’ से इब्रानी आज्ञार्थक की ध्यानाकर्षक प्रत्यक्षता बनी रहती है।
