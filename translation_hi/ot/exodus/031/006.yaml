id: EXO.31.6
reference: Exodus 31:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/אֲנִ֞י הִנֵּ֧ה נָתַ֣תִּי אִתּ֗/וֹ אֵ֣ת אָהֳלִיאָ֞ב בֶּן אֲחִֽיסָמָךְ֙ לְ/מַטֵּה דָ֔ן וּ/בְ/לֵ֥ב כָּל חֲכַם לֵ֖ב נָתַ֣תִּי חָכְמָ֑ה וְ/עָשׂ֕וּ אֵ֖ת כָּל אֲשֶׁ֥ר צִוִּיתִֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/006.yaml
  text: And behold[a], I have appointed with him Oholiab son of Ahisamach, of the tribe of Dan; and in the heart of everyone wise of heart I have put wisdom[b], that they may make all that I have commanded you.
translation:
  language: hi
  text: और देखो, मैंने उसके साथ अहीसामाक के पुत्र ओहोलीआब को, जो दान के गोत्र से है, नियुक्त किया है; और हर उस व्यक्ति के हृदय में जो हृदय से बुद्धिमान है[a], मैंने बुद्धि दी है, ताकि वे वह सब बनाएँ[b] जिसकी आज्ञा मैंने तुझे दी है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में “हृदय से बुद्धिमान” एक मुहावरा है। यहाँ “बुद्धि” में पवित्र निवास के काम के लिए आवश्यक कारीगरी-कौशल भी शामिल है।
    reason: cultural_note
  - marker: b
    text: इब्रानी में इसे अधिक शाब्दिक रूप से, “और वे वह सब बनाएँगे जिसकी आज्ञा मैंने तुझे दी है,” भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי הִנֵּה
  choice: और देख, मैंने
  rationale: स्वतंत्र प्रथम-पुरुष सर्वनाम का बल हिन्दी में क्रिया के साथ निहित रहता है, जबकि ‘देख’ הִנֵּה के ध्यान आकर्षित करने वाले बल को बनाए रखता है।
- source_word: נָתַתִּי אִתּוֹ
  choice: मैंने उसके साथ ... को नियुक्त किया है
  rationale: נתן का मूल अर्थ ‘देना/रखना’ है, पर इस नियुक्ति-प्रसंग में किसी व्यक्ति को बसलेल के साथ कार्य के लिए ठहराना अभिप्रेत है; ‘उसके साथ’ אִתּוֹ को स्पष्ट रखता है।
- source_word: אָהֳלִיאָב בֶּן אֲחִיסָמָךְ
  choice: अहीसामाक के पुत्र ओहोलीआब
  rationale: व्यक्तिनामों का निकट देवनागरी लिप्यंतरण और स्वाभाविक हिन्दी वंशसूचक रचना।
- source_word: לְמַטֵּה דָן
  choice: दान के गोत्र के
  rationale: מַטֶּה यहाँ जनजातीय/गोत्रीय संबंध बताता है; ‘गोत्र’ बाइबलीय हिन्दी में स्पष्ट और प्रचलित है।
- source_word: וּבְלֵב כָּל חֲכַם לֵב
  choice: हर उस व्यक्ति के हृदय में, जो हृदय से बुद्धिमान है
  rationale: दोनों बार आए לֵב को बनाए रखते हुए इब्रानी मानव-दृष्टि को सुरक्षित रखा गया है, जिसमें हृदय समझ और कारीगरी की योग्यता का केंद्र है।
- source_word: נָתַתִּי חָכְמָה
  choice: मैंने बुद्धि दी है
  rationale: חָכְמָה का व्यापक अर्थ ‘बुद्धि’ रखा गया है; इस प्रसंग में उसमें व्यावहारिक कारीगरी-कौशल भी सम्मिलित है। हिन्दी में ‘हृदय में बुद्धि दी’ स्वाभाविक है।
- source_word: וְעָשׂוּ
  choice: ताकि वे ... बनाएँ
  rationale: पूर्ववर्ती दैवी बुद्धिदान और आगामी निर्माण के बीच प्रयोजन/परिणाम का संबंध व्यक्त करता है, जबकि साधारण भविष्यवाचक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: אֵת כָּל אֲשֶׁר צִוִּיתִךָ
  choice: वह सब ... जिसकी आज्ञा मैंने तुझे दी है
  rationale: समग्रता और मूसा को संबोधित एकवचन ‘तुझे’ दोनों को स्पष्ट रूप से सुरक्षित रखता है।
theological_decisions:
- issue: कारीगरी के प्रसंग में חֲכַם־לֵב और חָכְמָה का अनुवाद
  choice: हृदय से बुद्धिमान / बुद्धि
  alternative: निपुण / कौशल
  rationale: प्रसंग कारीगरी का है, इसलिए ‘कौशल’ संभव है; फिर भी ‘हृदय’ और ‘बुद्धि’ बनाए रखने से यह अर्थ सुरक्षित रहता है कि व्यावहारिक निपुणता परमेश्वर-प्रदत्त बुद्धि का रूप है।
- issue: बुद्धि दिए जाने के बाद וְעָשׂוּ का संबंध
  choice: ताकि वे ... बनाएँ
  alternative: और वे ... बनाएँगे
  rationale: प्रयोजनात्मक अनुवाद परमेश्वर द्वारा दिए गए सामर्थ्य और आज्ञाकारी कार्य के संबंध को स्वाभाविक रूप से व्यक्त करता है; सरल भविष्य/परिणाम की संभावना पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिन्दी। ‘देख’ से मूल का ध्यानाकर्षक स्वर, ‘तुझे’ से मूसा को किया गया एकवचन संबोधन, और ‘हृदय से बुद्धिमान’ से इब्रानी मुहावरे का रूप बनाए रखा गया है।
