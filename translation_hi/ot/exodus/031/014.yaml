source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּם֙ אֶת הַ/שַּׁבָּ֔ת כִּ֛י קֹ֥דֶשׁ הִ֖וא לָ/כֶ֑ם מְחַֽלְלֶ֨י/הָ֙ מ֣וֹת יוּמָ֔ת כִּ֗י כָּל הָ/עֹשֶׂ֥ה בָ/הּ֙ מְלָאכָ֔ה וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מִ/קֶּ֥רֶב עַמֶּֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/014.yaml
  text: You shall keep the Sabbath[a], because it is holy to you. Whoever profanes it shall surely be put to death, for whoever does work on it[b], that person shall be cut off from among his people.
translation:
  language: hi
  text: तुम सब्त का पालन करना, क्योंकि वह तुम्हारे लिए पवित्र है। जो कोई उसे अपवित्र करे[a], वह निश्चय ही मार डाला जाए; क्योंकि जो कोई उस दिन काम करे, वह व्यक्ति अपने लोगों के बीच से काट दिया जाए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी पवित्रता भंग करे।”
    reason: lexical_alternative
  - marker: b
    text: “अपने लोगों के बीच से काट दिया जाए” एक इब्रानी कानूनी सूत्र है; यहाँ यह नहीं बताया गया कि यह दण्ड ठीक किस प्रकार लागू होगा।
    reason: alternative_reading
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: तुम सब्त का पालन करना
  rationale: שׁמר का यहाँ वाचा-संबंधी आदेश में अर्थ किसी दिन को मानना और उसकी विधियों का पालन करना है। ‘पालन करना’ आधुनिक हिन्दी में स्वाभाविक है और बहुवचन आदेश का बल बनाए रखता है।
- source_word: הַשַּׁבָּת
  choice: सब्त
  rationale: שַׁבָּת इस विशिष्ट पवित्र विश्राम-दिन का नाम है। ‘सब्त’ प्रचलित बाइबलीय हिन्दी पद है और केवल सामान्य ‘विश्राम’ कहने से अधिक सटीक है।
- source_word: קֹדֶשׁ הִוא לָכֶם
  choice: वह तुम्हारे लिए पवित्र है
  rationale: קֹדֶשׁ अलग ठहराई हुई पवित्र वस्तु या स्थिति को दर्शाता है; לָכֶם के संबंधसूचक भाव को ‘तुम्हारे लिए’ से सुरक्षित रखा गया है।
- source_word: מְחַלְלֶיהָ
  choice: जो कोई उसे अपवित्र करे
  rationale: חלל के पिएल रूप का अर्थ पवित्रता भंग करना या अपवित्र ठहराना है। कृदंत के सामान्य कानूनी आशय को ‘जो कोई’ स्पष्ट रूप से व्यक्त करता है।
- source_word: מוֹת יוּמָת
  choice: वह निश्चय ही मार डाला जाए
  rationale: क्रियार्थक संज्ञा और सीमित क्रिया का संयोजन दण्ड की निश्चितता पर बल देता है। होफ़ाल रूप कर्मवाच्य है, इसलिए ‘मार डाला जाए’ केवल ‘मर जाए’ से अधिक सटीक है।
- source_word: כָּל הָעֹשֶׂה בָהּ מְלָאכָה
  choice: जो कोई उस दिन काम करे
  rationale: מְלָאכָה नियत कार्य या श्रम को दर्शाता है। ‘उस दिन काम करे’ संक्षिप्त और स्वाभाविक हिन्दी है; मूल में स्पष्ट रूप से न आए ‘किसी भी प्रकार का’ जैसे विस्तार से बचा गया है।
- source_word: וְנִכְרְתָה
  choice: काट दिया जाए
  rationale: כרת का निफ़ाल रूप वाचा और कानून की स्थिर अभिव्यक्ति है। ‘काट दिया जाए’ मूल रूपक और दण्ड के अनिर्दिष्ट ढंग—सामुदायिक निष्कासन या ईश्वरीय न्याय—दोनों के प्रति खुलापन बनाए रखता है।
- source_word: הַנֶּפֶשׁ הַהִוא
  choice: वह व्यक्ति
  rationale: इस कानूनी संदर्भ में נֶפֶשׁ अपराधी मनुष्य को दर्शाता है, किसी पृथक अभौतिक ‘आत्मा’ को नहीं। इसलिए ‘व्यक्ति’ अर्थ को बिना अतिरिक्त मानवशास्त्रीय धारणा के व्यक्त करता है।
- source_word: מִקֶּרֶב עַמֶּיהָ
  choice: अपने लोगों के बीच से
  rationale: यह पद समुदाय के मध्य से अलग किए जाने को व्यक्त करता है। स्त्रीलिंग प्रत्यय व्याकरणतः נֶפֶשׁ के अनुरूप है; हिन्दी में ‘अपने’ से अनावश्यक लिंग-निर्धारण से बचते हुए संबंध स्पष्ट रहता है।
theological_decisions:
- issue: וְנִכְרְתָה ... מִקֶּרֶב עַמֶּיהָ में दण्ड का स्वरूप
  choice: ‘अपने लोगों के बीच से काट दिया जाए’ के मूल मुहावरे को बनाए रखना
  alternative: ‘समुदाय से निकाल दिया जाए’ अथवा ‘ईश्वरीय न्याय से नष्ट कर दिया जाए’
  rationale: इस पद में सूत्र का सटीक कार्यान्वयन नहीं बताया गया। मुहावरे को बनाए रखने से निष्कासन, मृत्यु-दण्ड या ईश्वरीय न्याय में से किसी एक को अनावश्यक रूप से निश्चित नहीं किया जाता।
- issue: कानूनी संदर्भ में נֶפֶשׁ का अर्थ
  choice: ‘व्यक्ति’
  alternative: ‘प्राण’ या ‘आत्मा’
  rationale: यहाँ शब्द उत्तरदायी अपराधी को समग्र व्यक्ति के रूप में संदर्भित करता है। ‘आत्मा’ अनावश्यक रूप से शरीर-आत्मा संबंधी धर्मवैज्ञानिक निष्कर्ष ला सकता है।
- issue: מוֹת יוּמָת और ‘काट दिया जाए’ के बीच दण्डात्मक तनाव
  choice: दोनों कथनों को बिना समानीकरण के साथ रखना
  alternative: दूसरे कथन को पहले दण्ड की मात्र व्याख्या मान लेना
  rationale: इब्रानी पाठ पहले निश्चित मृत्यु-दण्ड कहता है और फिर काटे जाने का सूत्र देता है। अनुवाद इस संबंध को स्वयं से परिभाषित नहीं करता, बल्कि पाठ का कानूनी और धर्मवैज्ञानिक तनाव सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, कानूनी आदेश के अनुरूप गंभीर और गरिमापूर्ण रखी गई है। ‘तुम ... करना’ बहुवचन आज्ञा का स्वाभाविक हिन्दी रूप है। ‘सब्त’ परिचित बाइबलीय पद के रूप में रखा गया है, और कठिन दण्ड-सूत्र को सरल व्याख्या से बदलने के बजाय मूल रूपक सहित प्रस्तुत किया गया है।
