- source_word: בִּגְדֵי הַשְּׂרָד
  choice: बारीकी से बुने हुए वस्त्र
  rationale: בִּגְדֵי का अर्थ ‘वस्त्र’ है। הַשְּׂרָד का अर्थ विवादित है और यह वस्त्रों की विशेष बुनावट अथवा पवित्रस्थान की सेवा में उनके उपयोग की ओर संकेत कर सकता है। मुख्य पाठ में संभावित शिल्पगत अर्थ रखा गया है और अन्य संभावनाएँ पाद-टिप्पणी में दी गई हैं।
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  choice: पवित्र वस्त्र
  rationale: यह पदबंध शाब्दिक रूप से ‘पवित्रता के वस्त्र’ अथवा स्वाभाविक हिन्दी में ‘पवित्र वस्त्र’ है।
- source_word: לְאַהֲרֹן הַכֹּהֵן
  choice: हारून याजक के लिए
  rationale: לְ यहाँ नियोजन या संबंध व्यक्त करता है और הַכֹּהֵן हारून की उपाधि है।
- source_word: בִּגְדֵי בָנָיו
  choice: उसके पुत्रों के ... वस्त्र
  rationale: प्रत्यय ‘उसके’ का संकेत हारून की ओर है; हिन्दी में संबंधसूचक संरचना स्पष्ट और स्वाभाविक है।
- source_word: לְכַהֵן
  choice: याजक के रूप में सेवा करने के
  rationale: כהן का क्रियारूप याजकीय पद में कार्य या सेवा करने को दर्शाता है। यह अनुवाद केवल सामान्य सेवा नहीं, बल्कि याजकीय कार्य को स्पष्ट करता है।
- source_word: וְאֵת / וְאֶת
  choice: और
  rationale: אֵת कर्म-सूचक चिह्न है जिसका हिन्दी में अलग अनुवाद आवश्यक नहीं; וְ को ‘और’ से व्यक्त करके पूर्ववर्ती सूची की संरचना बनाए रखी गई है।
