  edition: WLC
  text: וְ/אֵ֨ת שֶׁ֧מֶן הַ/מִּשְׁחָ֛ה וְ/אֶת קְטֹ֥רֶת הַ/סַּמִּ֖ים לַ/קֹּ֑דֶשׁ כְּ/כֹ֥ל אֲשֶׁר צִוִּיתִ֖/ךָ יַעֲשֽׂוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/011.yaml
  text: and the anointing oil[a], and the fragrant incense for the holy place. They shall make them according to all that I have commanded you.
translation:
  language: hi
  text: और अभिषेक का तेल और पवित्रस्थान के लिए सुगंधित धूप[a]। वे यह सब ठीक वैसा ही बनाएँ, जैसा मैंने तुम्हें आज्ञा दी है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मसालों से बनी धूप।”
    reason: קְטֹרֶת הַסַּמִּים का अधिक शब्दशः रूप, जो धूप की सुगंध के स्रोत को स्पष्ट करता है।
lexical_decisions:
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: अभिषेक का तेल
  rationale: यह रचना तेल के अभिषेक-संबंधी धार्मिक उपयोग को सीधे और स्वाभाविक आधुनिक हिन्दी में व्यक्त करती है; ‘पवित्र’ जैसा अतिरिक्त विशेषण नहीं जोड़ा गया है।
- source_word: קְטֹרֶת הַסַּמִּים
  choice: सुगंधित धूप
  rationale: यह सुगंध देने वाले मसालों से बनी धूप का स्वाभाविक हिन्दी रूप है। अधिक शब्दशः विकल्प को पादटिप्पणी में रखा गया है।
- source_word: לַקֹּדֶשׁ
  choice: पवित्रस्थान के लिए
  rationale: यह לַ־ के प्रयोजन-संबंधी अर्थ और מִקְדָּשׁ-संदर्भ के पवित्र स्थान दोनों को सुरक्षित रखता है, बिना इसे केवल सामान्य ‘पवित्र उपयोग’ तक सीमित किए।
- source_word: כְּכֹל אֲשֶׁר צִוִּיתִךָ
  choice: ठीक वैसा ही, जैसा मैंने तुम्हें आज्ञा दी है
  rationale: ‘ठीक वैसा ही’ כְּכֹל की व्यापक और अनुरूपता-सूचक शक्ति को सहज हिन्दी में व्यक्त करता है; ‘तुम्हें’ मूसा के प्रति एकवचन संबोधन को बनाए रखता है।
- source_word: יַעֲשׂוּ
  choice: वे यह सब ... बनाएँ
  rationale: बहुवचन कर्ता कारीगरों की ओर संकेत करता है। ‘यह सब’ पूर्ववर्ती वस्तुओं को समेटता और हिन्दी में अपेक्षित कर्म को स्पष्ट करता है।
