base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/007.yaml
  text: the tent of meeting[a], and the ark of the testimony, and the mercy seat that is on it[b], and all the furnishings of the tent—
translation:
  language: hi
  text: मिलाप का तंबू, साक्षी-पत्र का संदूक[a], उसके ऊपर का प्रायश्चित्त-आवरण[b], और तंबू की सारी वस्तुएँ—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “साक्षी-पत्र रखने का संदूक।”
    reason: lexical_alternative
  - marker: b
    text: या “दया-आसन।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹהֶל מוֹעֵד
  choice: मिलाप का तंबू
  rationale: यह पद उस पवित्र तंबू का मानक और स्वाभाविक हिन्दी नाम देता है जहाँ परमेश्वर इस्राएल से मिलते हैं; מוֹעֵד में मिलने अथवा नियत भेंट का भाव है।
- source_word: הָאָרֹן לָעֵדֻת
  choice: साक्षी-पत्र का संदूक
  rationale: עֵדֻת को इस संदर्भ में उस साक्षी-विधान से जोड़ा गया है जिसे संदूक में रखा जाता था। हिन्दी में ‘साक्षी-पत्र’ संदर्भ को स्पष्ट करता है, जबकि पादटिप्पणी ל के प्रयोजन-संबंधी भाव को सुरक्षित रखती है।
- source_word: הַכַּפֹּרֶת
  choice: प्रायश्चित्त-आवरण
  rationale: यह संदूक के ऊपर रखे सोने के आवरण को सूचित करता है और उसके प्रायश्चित्त-संबंधी पवित्र उपयोग को भी बनाए रखता है।
- source_word: אֲשֶׁר עָלָיו
  choice: उसके ऊपर का
  rationale: עָלָיו का पुरुषवाचक एकवचन प्रत्यय निकटवर्ती संदूक की ओर संकेत करता है; यह हिन्दी में संक्षिप्त और स्पष्ट है।
- source_word: כָּל כְּלֵי הָאֹהֶל
  choice: तंबू की सारी वस्तुएँ
  rationale: כְּלֵי एक व्यापक शब्द है जिसमें तंबू के उपकरण, पात्र और अन्य साज-सामान सम्मिलित हैं; ‘वस्तुएँ’ इस व्यापकता को सहज हिन्दी में बनाए रखता है।
theological_decisions:
- issue: पवित्रस्थान के संदर्भ में כַּפֹּרֶת का अनुवाद
  choice: प्रायश्चित्त-आवरण
  alternative: दया-आसन
  rationale: मुख्य पाठ में वस्तु के आवरण होने और उसके प्रायश्चित्त-संबंधी कार्य, दोनों को व्यक्त किया गया है। पारंपरिक वैकल्पिक रूप को पादटिप्पणी में रखा गया है, ताकि पद स्वयं किसी संकीर्ण धर्मसैद्धांतिक व्याख्या को अनिवार्य न करे।
- issue: הָאָרֹן לָעֵדֻת में ל का संबंध
  choice: साक्षी-पत्र का संदूक
  alternative: साक्षी-पत्र रखने का संदूक
  rationale: मुख्य पाठ स्वाभाविक हिन्दी संबंध-वाक्यांश का उपयोग करता है; विकल्प उस इब्रानी पूर्वसर्ग में निहित प्रयोजन के भाव को अधिक प्रत्यक्ष रूप से दर्शाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण सूची-शैली रखी गई है। अंतिम दीर्घ डैश बताता है कि वाक्य अगले पदों में जारी है।
