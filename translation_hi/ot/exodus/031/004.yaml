- source_word: בַּזָּהָב
  choice: सोने में
  rationale: उपसर्ग ב यहाँ उस सामग्री अथवा माध्यम को सूचित करता है जिसमें कारीगरी की जाती है; ‘में’ मूल संरचना और हिंदी शिल्प-वर्णन दोनों के अनुकूल है।
- source_word: וּבַכֶּסֶף
  choice: चाँदी में
  rationale: सामग्री-सूची की समानांतर रचना बनाए रखने के लिए ‘सोने में’ के अनुरूप अनुवाद किया गया है।
- source_word: וּבַנְּחֹשֶׁת
  choice: काँसे में
  rationale: נְחֹשֶׁת ताँबे या काँसे का बोध करा सकता है। पवित्र निवास की धातु-कारीगरी के संदर्भ में ‘काँसा’ सर्वाधिक संभावित और हिंदी बाइबलीय प्रयोग में स्वाभाविक है।
