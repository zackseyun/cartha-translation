lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: तब ... ने ... कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; ‘तब’ क्रमिकता व्यक्त करता है। דּבר यहाँ किसी को संबोधित करके बोलने के अर्थ में है, जिसे हिंदी में ‘से कहा’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुरक्षरीय ईश्वरीय नाम יהוה को हिंदी में प्रचलित नाम-रूप ‘यहोवा’ से प्रस्तुत किया गया है, न कि किसी उपाधि से।
- source_word: אֶל־מֹשֶׁה
  choice: मूसा से
  rationale: वाणी के संबोधित व्यक्ति को आधुनिक हिंदी में स्वाभाविक रूप से ‘मूसा से’ कहा जाता है।
- source_word: לֵאמֹר
  choice: कहा,
  rationale: यह रूप आगे आने वाली प्रत्यक्ष वाणी का परिचय देता है। हिंदी में ‘कहा,’ इसी कार्य को स्वाभाविक ढंग से पूरा करता है; अलग से ‘यह कहते हुए’ जोड़ना अनावश्यक रूप से भारी होता।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। हिंदी पाठकों में सुस्थापित ‘यहोवा’ नाम को बनाए रखना उपाधि ‘प्रभु’ से प्रतिस्थापन करने की अपेक्षा स्रोत के अधिक निकट है; ‘याहवे’ संभावित वैकल्पिक लिप्यंतरण है।
