base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/008.yaml
  text: and the table with its utensils[a], and the pure lampstand with all its utensils, and the altar of incense[c][b],
translation:
  language: hi
  text: और मेज़ और उसके पात्र, और शुद्ध दीपाधार[a][b] और उसके सारे पात्र, और धूप की वेदी[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेनोरा।” इब्रानी शब्द पवित्रस्थान के दीपाधार को दर्शाता है; मुख्य पाठ में उसका लिप्यंतरण करने के बजाय सामान्य संज्ञा का अर्थ दिया गया है।
    reason: lexical_alternative
  - marker: b
    text: “शुद्ध” का संबंध अनुष्ठानिक शुद्धता से हो सकता है; इस पवित्र-तंबू के संदर्भ में यह संबंधित वर्णनों में दीपाधार के शुद्ध सोने से बने होने की भी याद दिला सकता है।
    reason: cultural_note
  - marker: c
    text: या, “धूप-वेदी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֻּׁלְחָן
  choice: मेज़
  rationale: שֻׁלְחָן का सीधा अर्थ ‘मेज़’ है। संदर्भ से स्पष्ट है कि यह पवित्रस्थान की मेज़ है, पर इस पद में उसका विस्तृत नाम नहीं दिया गया है।
- source_word: כֵּלָיו
  choice: उसके पात्र
  rationale: כְּלִי पात्र, उपकरण या वस्तु के अर्थ में प्रयुक्त होने वाला व्यापक शब्द है। पवित्रस्थान की सेवा में मेज़ से जुड़ी वस्तुओं के लिए ‘पात्र’ स्वाभाविक और गरिमापूर्ण है।
- source_word: הַמְּנֹרָה
  choice: दीपाधार
  rationale: מְנוֹרָה दीपों को धारण करने वाले आधार को दर्शाता है। सामान्य संज्ञा का अर्थानुवाद करते हुए ‘दीपाधार’ चुना गया है; ‘मेनोरा’ को पादटिप्पणी में विकल्प के रूप में रखा गया है।
- source_word: הַטְּהֹרָה
  choice: शुद्ध
  rationale: טָהוֹר का अर्थ ‘शुद्ध’ या ‘स्वच्छ’ हो सकता है। पवित्रस्थान के उपासना-संबंधी संदर्भ में ‘शुद्ध’ अधिक उपयुक्त है और संबंधित वर्णनों में शुद्ध सोने की सामग्री की ओर भी संकेत कर सकता है।
- source_word: כָּל כֵּלֶיהָ
  choice: उसके सारे पात्र
  rationale: כָּל समग्रता को व्यक्त करता है और כֵּלֶיהָ दीपाधार से जुड़ी वस्तुओं को दर्शाता है। ‘सारे’ इस पूर्णता को स्पष्ट रूप से बनाए रखता है।
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: धूप की वेदी
  rationale: यह संबंधवाची पदबंध ‘धूप की वेदी’ या ‘धूप-वेदी’ हो सकता है। मुख्य पाठ में अधिक पारदर्शी और स्वाभाविक रूप ‘धूप की वेदी’ रखा गया है।
- source_word: וְאֶת
  choice: और
  rationale: אֵת सीधे कर्म को चिह्नित करता है और हिंदी में अलग से अनूदित नहीं होता; וְ को बार-बार ‘और’ रखकर सूची की संरचना सुरक्षित की गई है।
theological_decisions:
- issue: הַטְּהֹרָה में शुद्धता का आशय
  choice: मुख्य पाठ में केवल ‘शुद्ध’ रखा गया है
  alternative: इसे स्पष्ट रूप से ‘शुद्ध सोने का’ या केवल ‘अनुष्ठानिक रूप से शुद्ध’ कहना
  rationale: इस पद में विशेषण स्वयं यह तय नहीं करता कि बल अनुष्ठानिक शुद्धता पर है, सामग्री की शुद्धता पर, या दोनों की प्रतिध्वनि पर। इसलिए मुख्य पाठ अस्पष्टता बनाए रखता है और टिप्पणी संभावित संदर्भ बताती है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण सूची-शैली रखी गई है। ‘दीपाधार’ अर्थ को स्पष्ट करता है, जबकि पारंपरिक लिप्यंतरण पादटिप्पणी में दिया गया है। पद वाक्य के बीच की सूची है, इसलिए अंत में अल्पविराम बनाए रखा गया है।
