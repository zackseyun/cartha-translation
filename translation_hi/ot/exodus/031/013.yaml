base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/013.yaml
  text: And you[a], speak to the sons of Israel, saying, ‘Surely you shall keep my Sabbaths, for it is a sign between me and you throughout your generations[c][b], so that you may know that I am Yahweh who sanctifies you.’
translation:
  language: hi
  text: और तुम इस्राएलियों से कहो, ‘निश्चय ही[a] तुम मेरे विश्राम-दिनों का पालन करना, क्योंकि यह मेरे और तुम्हारे बीच पीढ़ी-दर-पीढ़ी एक चिन्ह है, ताकि तुम जानो कि मैं याहवे हूँ, जो तुम्हें पवित्र करता हूँ।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “निश्चय ही” का अनुवाद “केवल” या “फिर भी” भी हो सकता है; हिब्रू शब्द बल अथवा प्रतिबंध, दोनों व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: और तुम
  rationale: कर्ता सर्वनाम को स्पष्ट रखकर उसके बल और पिछले निर्देशों से वार्तालाप के मोड़ को सुरक्षित किया गया है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: हिब्रू का शाब्दिक रूप ‘इस्राएल के पुत्र’ है, पर यहाँ यह पूरे वाचा-समुदाय का प्रचलित सामूहिक पद है; ‘इस्राएलियों’ आधुनिक हिन्दी में स्वाभाविक और अर्थतः सटीक है।
- source_word: אַךְ
  choice: निश्चय ही
  rationale: यह अव्यय यहाँ बल अथवा प्रतिबंध व्यक्त कर सकता है। ‘निश्चय ही’ आदेश की प्रबलता बनाए रखता है, जबकि वैकल्पिक प्रतिबंधात्मक अर्थ पादटिप्पणी में दिया गया है।
- source_word: שַׁבְּתֹתַי
  choice: मेरे विश्राम-दिनों
  rationale: स्रोत का बहुवचन सुरक्षित रखा गया है और שַׁבָּת का मूल विश्राम-संबंधी अर्थ सामान्य हिन्दी पाठक के लिए स्पष्ट किया गया है।
- source_word: תִּשְׁמֹרוּ
  choice: पालन करना
  rationale: שׁמר वाचा और आज्ञा के प्रसंग में ‘मानना/पालन करना’ का अर्थ देता है; हिन्दी में यह स्वाभाविक आदेश है।
- source_word: אוֹת
  choice: एक चिन्ह
  rationale: ‘चिन्ह’ वाचा-संबंधी संकेत के अर्थ को स्पष्ट और परंपरासंगत ढंग से व्यक्त करता है।
- source_word: לְדֹרֹתֵיכֶם
  choice: पीढ़ी-दर-पीढ़ी
  rationale: यह अभिव्यक्ति आने वाली क्रमिक पीढ़ियों में निरंतरता को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत दिव्य नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नामरूप ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: מְקַדִּשְׁכֶם
  choice: जो तुम्हें पवित्र करता हूँ
  rationale: हिफ़ील कृदंत के कारण ‘पवित्र बनाता/करता’ का कारक अर्थ है; वर्तमान कृदंत परमेश्वर की चालू और विशिष्ट करने वाली क्रिया को बनाए रखता है।
theological_decisions:
- issue: אַךְ का बल अथवा प्रतिबंध
  choice: निश्चय ही
  alternative: केवल / फिर भी
  rationale: प्रसंग में यह निवास-स्थान के कार्यों के बीच भी विश्राम-दिन मानने पर विशेष बल देता है। हिब्रू की वास्तविक अर्थ-सीमा को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: दिव्य नाम יְהוָה
  choice: यहोवा
  alternative: याहवे
  rationale: स्रोत में निजी वाचा-नाम है, इसलिए ‘प्रभु’ जैसी उपाधि नहीं रखी गई। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में अधिक पहचाना जाने वाला लिप्यंतरण है; स्वरांकन की अनिश्चितता के कारण ‘याहवे’ संभव विकल्प है।
- issue: מְקַדִּשְׁכֶם की पवित्रीकरण-भाषा
  choice: जो तुम्हें पवित्र करता हूँ
  alternative: जो तुम्हें अपने लिए अलग करता हूँ
  rationale: ‘पवित्र करता हूँ’ धार्मिक और नैतिक दोनों आयामों की गुंजाइश बनाए रखता है और स्रोत के कारक रूप के निकट है; ‘अलग करता हूँ’ अर्थ का केवल एक पहलू स्पष्ट करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘विश्राम-दिनों’ से स्रोत का बहुवचन स्पष्ट है। सामूहिक संबोधन के लिए ‘तुम’ रखा गया है। पादटिप्पणी-चिह्न मुख्य पाठ में उसी वाक्य के अंत में दिया गया है जिस पर वह लागू होता है।
