  text: and the altar of burnt offering[a], with all its utensils, and the basin with its stand,
translation:
  language: hi
  text: और होमबलि की वेदी तथा उसके सब उपकरण, और हौद तथा उसका आधार।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִזְבַּח הָעֹלָה
  choice: होमबलि की वेदी
  rationale: यह पदबंध उस वेदी को दर्शाता है जिस पर पूरी तरह जलाई जाने वाली बलि चढ़ाई जाती थी। ‘होमबलि की वेदी’ हिन्दी बाइबलीय प्रयोग में स्थापित, संक्षिप्त और स्पष्ट है।
- source_word: כָּל כֵּלָיו
  choice: उसके सब उपकरण
  rationale: כְּלִי यहाँ वेदी के काम में आने वाली विविध वस्तुओं और साधनों के लिए व्यापक शब्द है; ‘उपकरण’ आधुनिक हिन्दी में स्वाभाविक रूप से इस समष्टि को व्यक्त करता है।
- source_word: הַכִּיּוֹר
  choice: हौद
  rationale: यह मिलापवाले तम्बू के आँगन में धोने के लिए रखा बड़ा पात्र था। ‘हौद’ सामान्य पाठक के लिए स्पष्ट है और पात्र के आकार तथा कार्य के अनुकूल है।
- source_word: כַּנּוֹ
  choice: उसका आधार
  rationale: כֵּן उस सहायक संरचना को दर्शाता है जिस पर हौद टिका था। ‘आधार’ स्वाभाविक हिन्दी है; ‘चौकी’ भी संभव है, पर वह संरचना का रूप अधिक निश्चित कर देती है।
- source_word: וְאֶת
  choice: और … तथा
  rationale: इस सूची में וְאֶת अतिरिक्त प्रत्यक्ष कर्मों को जोड़ता है। हिन्दी में ‘और’ तथा ‘तथा’ के प्रयोग से संबंध स्पष्ट और प्रवाह स्वाभाविक रहता है।
