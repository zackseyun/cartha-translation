language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/שֵׁ֥ם הָ/אֶחָ֖ד אֱלִיעֶ֑זֶר כִּֽי אֱלֹהֵ֤י אָבִ/י֙ בְּ/עֶזְרִ֔/י וַ/יַּצִּלֵ֖/נִי מֵ/חֶ֥רֶב פַּרְעֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/004.yaml
  text: And the name of the other was Eliezer[a], for the God of my father was my help, and he delivered me from Pharaoh’s sword.
translation:
  language: hi
  text: और दूसरे का नाम एलीएज़ेर[a] था, क्योंकि मेरे पिता का परमेश्वर मेरा सहायक था और उसने मुझे फ़िरौन की तलवार से बचाया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ में नाम के बाद सीधे यह कारण दिया गया है; वहाँ ‘उसने कहा’ जैसे कोई शब्द नहीं हैं।
    reason: मूल पाठ में वचनसूचक क्रिया के अभाव को स्पष्ट करना और जोड़ी जा सकने वाली व्याख्यात्मक अभिव्यक्ति का संकेत देना।
lexical_decisions:
- source_word: וְשֵׁם הָאֶחָד
  choice: और दूसरे का नाम
  rationale: पिछले पद में पहले पुत्र का नाम आ चुका है, इसलिए यहाँ הָאֶחָד का प्रसंगानुसार अर्थ ‘दूसरे’ है। आरंभ का ‘और’ इब्रानी संयोजक तथा कथानक की निरंतरता को बनाए रखता है।
- source_word: אֱלִיעֶזֶר
  choice: एलीएज़ेर
  rationale: इब्रानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण किया गया है। नाम के अर्थ और उसके बाद दिए गए कारण के बीच संबंध को अलग व्याख्या जोड़कर स्पष्ट नहीं किया गया।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह नाम रखने का कारण बताने वाला संबंधसूचक शब्द है; आधुनिक हिन्दी में ‘क्योंकि’ स्पष्ट और स्वाभाविक है।
- source_word: אֱלֹהֵי אָבִי
  choice: मेरे पिता का परमेश्वर
  rationale: इब्रानी संबंधवाचक पदबंध को निकटता से रखता है और ‘मेरे पिता के परमेश्वर’ वाले व्यक्तिगत तथा वाचिक संबंध को सुरक्षित रखता है।
- source_word: בְּעֶזְרִי
  choice: मेरा सहायक था
  rationale: עֵזֶר संज्ञा का अर्थ ‘सहायता/सहायक’ है। ‘मेरा सहायक था’ नामकरण के पीछे की बीती घटना को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיַּצִּלֵנִי
  choice: और उसने मुझे ... बचाया था
  rationale: נצל का अर्थ संकट से छुड़ाना या बचाना है। ‘बचाया था’ पूर्व घटना की ओर संकेत करते हुए सामान्य पाठक के लिए सहज है।
- source_word: מֵחֶרֶב פַּרְעֹה
  choice: फ़िरौन की तलवार से
  rationale: मूल रूपक को ज्यों का त्यों रखा गया है; यह फ़िरौन की घातक शक्ति या प्राण लेने की धमकी को व्यक्त कर सकता है।
theological_decisions:
- issue: नामकरण के कारण में निहित वक्ता
  choice: ‘उसने कहा’ जैसे वचनसूचक शब्द नहीं जोड़े गए
  alternative: ‘क्योंकि उसने कहा, “मेरे पिता का परमेश्वर...”’
  rationale: इब्रानी पाठ में बोलने की कोई क्रिया नहीं है। कारण को सीधे प्रस्तुत करने से कथावाचक की टिप्पणी और मूसा के कथन के बीच मूल पाठ में जो संभावित अस्पष्टता है, वह अनावश्यक रूप से हल नहीं होती।
- issue: ‘फ़िरौन की तलवार’ का आशय
  choice: रूपक को ‘फ़िरौन की तलवार’ के रूप में बनाए रखा गया
  alternative: ‘फ़िरौन के हाथों मृत्यु से’ या ‘फ़िरौन की घातक शक्ति से’
  rationale: मूल शब्दावली शाब्दिक तलवार अथवा फ़िरौन की प्राणघातक सत्ता—दोनों की संभावना रखती है; व्याख्यात्मक विस्तार इस तनाव को सीमित कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘परमेश्वर’, ‘सहायक’ और ‘फ़िरौन की तलवार’ मूल की धार्मिक तथा रूपकात्मक भाषा को सुरक्षित रखते हैं, जबकि वाक्य-संरचना सामान्य पाठकों के लिए स्वाभाविक है।
