  text: נָבֹ֣ל תִּבֹּ֔ל גַּם אַתָּ֕ה גַּם הָ/עָ֥ם הַ/זֶּ֖ה אֲשֶׁ֣ר עִמָּ֑/ךְ כִּֽי כָבֵ֤ד מִמְּ/ךָ֙ הַ/דָּבָ֔ר לֹא תוּכַ֥ל עֲשֹׂ֖/הוּ לְ/בַדֶּֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/018.yaml
  text: You will surely wear yourself out[a], both you and this people who are with you, because the matter is too heavy for you. You are not able to do it by yourself.
translation:
  language: hi
  text: तुम निश्चय ही थककर चूर हो जाओगे[a]—तुम भी और ये लोग भी, जो तुम्हारे साथ हैं—क्योंकि यह काम तुम्हारे लिए बहुत भारी है। तुम इसे अकेले नहीं कर सकते।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम निश्चय ही पूरी तरह थक जाओगे।” इब्रानी में बल देने के लिए क्रिया दोहराई गई है; शाब्दिक रूप में, “मुरझाना, तुम मुरझा जाओगे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבֹל תִּבֹּל
  choice: तुम निश्चय ही थककर चूर हो जाओगे
  rationale: क्रिया के धात्वर्थक रूप और अपूर्ण क्रिया की पुनरावृत्ति निश्चितता और तीव्र बल व्यक्त करती है। संदर्भ में अत्यधिक परिश्रम से पूरी तरह थक जाने की चेतावनी है; यह हिंदी अभिव्यक्ति उसी बल को स्वाभाविक ढंग से संप्रेषित करती है।
- source_word: גַּם אַתָּה גַּם הָעָם הַזֶּה
  choice: तुम भी और ये लोग भी
  rationale: दोनों पक्षों को सम्मिलित करने वाली גַּם की पुनरावृत्ति को ‘भी...भी’ से व्यक्त किया गया है। हिंदी में सामूहिक עָם के लिए ‘ये लोग’ अधिक स्वाभाविक है।
- source_word: אֲשֶׁר עִמָּךְ
  choice: जो तुम्हारे साथ हैं
  rationale: यह वाक्यांश लोगों को मूसा के साथ उपस्थित समुदाय के रूप में निर्दिष्ट करता है; बहुवचन हिंदी प्रयोग स्वाभाविक है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह चेतावनी का कारण प्रस्तुत करता है; आधुनिक हिंदी में ‘क्योंकि’ स्पष्ट और सहज है।
- source_word: כָבֵד מִמְּךָ הַדָּבָר
  choice: यह काम तुम्हारे लिए बहुत भारी है
  rationale: כָבֵד के ‘भारी’ रूपक को बनाए रखा गया है। संदर्भ में דָּבָר उस न्यायिक-प्रशासनिक काम को सूचित करता है, इसलिए ‘काम’ सामान्य पाठक के लिए स्पष्ट है, बिना उसे अत्यधिक विशिष्ट बनाए।
- source_word: לֹא תוּכַל עֲשֹׂהוּ
  choice: तुम इसे नहीं कर सकते
  rationale: असमर्थता और व्यापक क्रिया עשה को सीधी, स्वाभाविक हिंदी में व्यक्त किया गया है।
- source_word: לְבַדֶּךָ
  choice: अकेले
  rationale: यह मूसा द्वारा बिना सहायता के काम करने को सूचित करता है; ‘अकेले’ संक्षिप्त और स्वाभाविक है।
