id: EXO.18.1
reference: Exodus 18:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֞ע יִתְר֨וֹ כֹהֵ֤ן מִדְיָן֙ חֹתֵ֣ן מֹשֶׁ֔ה אֵת֩ כָּל אֲשֶׁ֨ר עָשָׂ֤ה אֱלֹהִים֙ לְ/מֹשֶׁ֔ה וּ/לְ/יִשְׂרָאֵ֖ל עַמּ֑/וֹ כִּֽי הוֹצִ֧יא יְהוָ֛ה אֶת יִשְׂרָאֵ֖ל מִ/מִּצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/001.yaml
  text: Jethro[a], the priest of Midian, Moses’ father-in-law, heard all that God had done for Moses and for Israel his people, that Yahweh had brought Israel out of Egypt.
translation:
  language: hi
  text: मिद्यान के याजक और मूसा के ससुर यित्रो ने वह सब सुना जो परमेश्वर ने मूसा और इस्राएल, उसकी प्रजा,[a] के लिए किया था—कि याहवे इस्राएल को मिस्र से निकाल लाया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उसकी प्रजा’ में ‘उसकी’ का संकेत सम्भवतः परमेश्वर की ओर है; पर व्याकरण की दृष्टि से इसे मूसा की ओर संकेत करते हुए, ‘इस्राएल, मूसा की प्रजा’ भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: ने ... सुना
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; हिन्दी में सामान्य भूतकाल और वाक्यक्रम यह प्रवाह स्वाभाविक रूप से व्यक्त करते हैं, इसलिए कोई अतिरिक्त ‘तब’ या ‘अब’ नहीं जोड़ा गया।
- source_word: כֹהֵן מִדְיָן
  choice: मिद्यान के याजक
  rationale: सम्बन्धसूचक इब्रानी पदबंध यित्रो के पद और मिद्यान से उसके सम्बन्ध को बताता है; निश्चितता प्रसंग से स्पष्ट है।
- source_word: חֹתֵן מֹשֶׁה
  choice: मूसा के ससुर
  rationale: इस प्रसंग में वैवाहिक सम्बन्ध का आशय मूसा की पत्नी के पिता से है; ‘ससुर’ आधुनिक हिन्दी में सटीक और स्वाभाविक है।
- source_word: אֵת כָּל אֲשֶׁר עָשָׂה אֱלֹהִים
  choice: वह सब ... जो परमेश्वर ने ... किया था
  rationale: यह כָּל אֲשֶׁר की समग्रता और मुख्य कथा से पहले पूरी हुई क्रिया, दोनों को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: לְמֹשֶׁה וּלְיִשְׂרָאֵל
  choice: मूसा और इस्राएल ... के लिए
  rationale: यहाँ ל लाभ के अर्थ में है; ‘के लिए’ परमेश्वर द्वारा उनके हित में किए गए कार्य को व्यक्त करता है।
- source_word: עַמּוֹ
  choice: उसकी प्रजा
  rationale: पुल्लिंग एकवचन प्रत्यय को बिना उसका सम्बन्ध स्पष्ट रूप से परमेश्वर या मूसा से बाँधे अनूदित किया गया है; ‘प्रजा’ सामूहिक जनसमुदाय और अधीनता/सम्बन्ध का भाव देती है।
- source_word: כִּי
  choice: कि
  rationale: यह यित्रो द्वारा सुनी गई बात की व्याख्यात्मक विषय-वस्तु प्रस्तुत करता है; हिन्दी में ‘कि’ इस सम्बन्ध को सहज ढंग से जोड़ता है।
- source_word: הוֹצִיא
  choice: निकाल लाया था
  rationale: יצא के हिफ़ील रूप का कारणवाचक अर्थ ‘बाहर ले आना’ है; यह मिस्र के भीतर से इस्राएल को बाहर लाने की गति को स्पष्ट करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले व्यक्तिगत ईश्वरीय नाम का हिन्दी लिप्यंतरण किया गया है, उसके स्थान पर कोई उपाधि नहीं रखी गई।
- source_word: מִמִּצְרָיִם
  choice: मिस्र से
  rationale: ‘निकाल लाया’ के साथ अपादान ‘से’ हिन्दी में मिस्र के भीतर से बाहर लाए जाने का अर्थ स्वाभाविक रूप से देता है।
theological_decisions:
- issue: עַמּוֹ में सर्वनाम का पूर्वपद
  choice: मुख्य पाठ में ‘इस्राएल, उसकी प्रजा’ रखकर सर्वनाम को खुला छोड़ा गया
  alternative: ‘परमेश्वर की प्रजा इस्राएल’ या ‘मूसा की प्रजा इस्राएल’
  rationale: प्रसंग में सर्वाधिक सम्भावित संकेत परमेश्वर की ओर है, पर इब्रानी व्याकरण इसे मूसा से जोड़ने की सम्भावना को पूरी तरह बन्द नहीं करता। इसलिए मुख्य पाठ अस्पष्टता बनाए रखता है और पाद-टिप्पणी दोनों सम्भावनाएँ बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। ‘याजक’, ‘प्रजा’ और ‘याहवे’ जैसे मुख्य बाइबलीय पदों को सुसंगत रखा गया है। विराम-चिह्न व्याख्यात्मक अन्तिम उपवाक्य को पहले कथन से जोड़ता है और इब्रानी כִּי के सम्बन्ध को स्पष्ट करता है।
