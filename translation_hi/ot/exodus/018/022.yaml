base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/022.yaml
  text: And let them judge the people at all times[a]. Then every great matter they shall bring to you, but every small matter they themselves shall judge. So make it lighter for yourself[b], and they will bear the burden with you.
translation:
  language: hi
  text: और वे हर समय लोगों का न्याय करें। तब हर बड़ा मामला वे तुम्हारे पास लाएँ, पर हर छोटे मामले का न्याय वे स्वयं करें। इस तरह अपना बोझ हल्का करो,[a] और वे तुम्हारे साथ उसे उठाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में ‘बोझ’ शब्द स्पष्ट रूप से नहीं है; न्याय करने का बोझ प्रसंग से समझा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁפְטוּ אֶת־הָעָם
  choice: वे ... लोगों का न्याय करें
  rationale: שׁפט का अर्थ यहाँ लोगों के विवादों का न्याय और निर्णय करना है। प्रसंग में यित्रो निर्देश दे रहा है, इसलिए हिंदी में संभावनार्थक-आज्ञार्थक ‘करें’ उपयुक्त है।
- source_word: בְּכָל־עֵת
  choice: हर समय
  rationale: यह इब्रानी कालवाचक पद का सीधा और स्वाभाविक रूप है तथा न्याय के लिए नियमित उपलब्धता व्यक्त करता है।
- source_word: כָּל־הַדָּבָר הַגָּדֹל
  choice: हर बड़ा मामला
  rationale: דָּבָר यहाँ न्याय के लिए लाया गया मामला है। ‘बड़ा’ मूल के גָּדֹל को सुरक्षित रखता है; संदर्भ में इसका अर्थ गंभीर या प्रमुख मामला है।
- source_word: יָבִיאוּ אֵלֶיךָ
  choice: वे तुम्हारे पास लाएँ
  rationale: हिफ़ील रूप मामले को मूसा के पास निर्णय के लिए लाने का भाव देता है।
- source_word: כָּל־הַדָּבָר הַקָּטֹן
  choice: हर छोटा मामला
  rationale: ‘छोटा’ मूल के קָּטֹן और ‘बड़ा’ के साथ उसके स्पष्ट विरोध को बनाए रखता है।
- source_word: יִשְׁפְּטוּ הֵם
  choice: न्याय वे स्वयं करें
  rationale: व्यक्त सर्वनाम הֵם पर बल है; ‘वे स्वयं’ दिखाता है कि छोटे मामलों का निर्णय अधीनस्थ न्यायी करेंगे, मूसा नहीं।
- source_word: וְהָקֵל מֵעָלֶיךָ
  choice: इस तरह अपना बोझ हल्का कर लो
  rationale: הָקֵל हिफ़ील आज्ञार्थक है, इसलिए इसे परिणामसूचक भविष्य के बजाय निर्देश के रूप में रखा गया है। ‘बोझ’ संदर्भ से निहित है और हिंदी में रूपक को स्वाभाविक बनाता है।
- source_word: וְנָשְׂאוּ אִתָּךְ
  choice: वे तुम्हारे साथ उसे उठाएँगे
  rationale: נשׂא का मूल भाव उठाना या वहन करना है। ‘उसे’ पहले उल्लिखित निहित न्यायिक बोझ की ओर संकेत करता है और मूल की संक्षिप्तता बनाए रखता है।
