  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली रखी गई है। ‘बड़ा मामला/छोटा मामला’ मूल इब्रानी के प्रत्यक्ष विरोध को सुरक्षित रखता है; इन्हें ‘गंभीर मामला/मामूली मामला’ भी समझा जा सकता है।
