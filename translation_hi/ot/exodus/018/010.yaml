  text: וַ/יֹּאמֶר֮ יִתְרוֹ֒ בָּר֣וּךְ יְהוָ֔ה אֲשֶׁ֨ר הִצִּ֥יל אֶתְ/כֶ֛ם מִ/יַּ֥ד מִצְרַ֖יִם וּ/מִ/יַּ֣ד פַּרְעֹ֑ה אֲשֶׁ֤ר הִצִּיל֙ אֶת הָ/עָ֔ם מִ/תַּ֖חַת יַד מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/010.yaml
  text: And Yitro said[a], “Blessed be Yahweh, who delivered you from the hand of the Egyptians and from the hand of Pharaoh[b], who delivered the people from under the hand of the Egyptians.”
translation:
  language: hi
  text: तब यित्रो ने कहा, “याहवे धन्य है[a], जिसने तुम लोगों को मिस्र के हाथ से और फ़िरौन के हाथ से छुड़ाया—उसी ने लोगों को मिस्र के हाथ के नीचे से छुड़ाया[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “याहवे की स्तुति हो” या “याहवे धन्य हो” भी हो सकता है। इब्रानी आशीर्वाद-सूत्र इन भावों के बीच कुछ खुलापन रखता है।
    reason: lexical_alternative
  - marker: b
    text: “हाथ” यहाँ सत्ता या नियंत्रण का रूपक है। इब्रानी में शाब्दिक रूप से “मिस्र के हाथ से ... मिस्र के हाथ के नीचे से” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमागत रूप कथा में अगली घटना प्रस्तुत करता है। आधुनिक हिन्दी में ‘तब’ कथा-क्रम को स्वाभाविक रूप से व्यक्त करता है, बिना उससे अधिक सूक्ष्म कालगत अर्थ जोड़ने के।
- source_word: יִתְרוֹ
  choice: यित्रो
  rationale: यह रूप इब्रानी नाम की ध्वनि को निकटता से देवनागरी में प्रस्तुत करता है।
- source_word: בָּרוּךְ יְהוָה
  choice: याहवे धन्य है
  rationale: यह इब्रानी आशीर्वाद/स्तुति-सूत्र की घोषणात्मक और स्तुतिपरक शक्ति बनाए रखता है; अन्य स्वाभाविक हिन्दी रूप फुटनोट में दिए गए हैं।
- source_word: הִצִּיל
  choice: छुड़ाया
  rationale: नצל के हिफ़ील रूप का अर्थ यहाँ शत्रुतापूर्ण सत्ता या नियंत्रण से मुक्त कराना है। ‘छुड़ाया’ आधुनिक हिन्दी में स्वाभाविक है और निर्गमन के प्रसंग के अनुकूल है।
- source_word: אֶתְכֶם
  choice: तुम लोगों को
  rationale: यह द्वितीय पुरुष पुल्लिंग बहुवचन को हिन्दी में स्पष्ट करता है।
- source_word: מִיַּד
  choice: के हाथ से
  rationale: इब्रानी में ‘हाथ’ सत्ता अथवा नियंत्रण का रूपक है। हिन्दी में भी यह बिंब समझ में आता है और मूल की ठोस भाषा को बनाए रखता है।
- source_word: מִצְרַיִם
  choice: मिस्रियों
  rationale: इस प्रसंग में शब्द मिस्र की दमनकारी सामूहिक शक्ति को सूचित करता है; ‘मिस्रियों’ कहना ‘हाथ’ के साथ हिन्दी में भी स्पष्ट है।
- source_word: פַּרְעֹה
  choice: फ़िरौन
  rationale: यह मिस्र के शासक की उपाधि का प्रचलित आधुनिक हिन्दी रूप है।
- source_word: הָעָם
  choice: लोगों
  rationale: यहाँ सामूहिक रूप से इस्राएली समुदाय अभिप्रेत है; ‘लोगों’ सहज और प्रसंगानुकूल है।
- source_word: מִתַּחַת יַד
  choice: के हाथ के नीचे से
  rationale: यह पहले आए ‘हाथ से’ की तुलना में अधीनता को अधिक स्पष्ट करता है और इब्रानी की जानबूझकर की गई पुनरावृत्ति तथा बिंब को सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे प्रयुक्त हुआ है। ‘याहवे’ उसका निकट लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: בָּרוּךְ יְהוָה आशीर्वाद-सूत्र का भाव
  choice: याहवे धन्य है
  alternative: याहवे की स्तुति हो; याहवे धन्य हो
  rationale: इब्रानी कृदंत-सूत्र घोषणा, स्तुति और कामनात्मक भाव के बीच कुछ खुलापन रखता है। मुख्य पाठ में घोषणात्मक रूप चुना गया है, जबकि फुटनोट अन्य सम्भव स्वाभाविक रूपों को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य रखी गई है। मूल की दोहरी ‘हाथ’ वाली छवि और ‘छुड़ाया’ की पुनरावृत्ति जानबूझकर सुरक्षित रखी गई है; दूसरे वाक्यांश की तीव्र अधीनता को ‘हाथ के नीचे से’ द्वारा व्यक्त किया गया है।
