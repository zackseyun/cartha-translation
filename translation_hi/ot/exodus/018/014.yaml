base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/014.yaml
  text: When Moses's father-in-law saw all that he was doing for the people[a], he said, “What is this thing that you are doing for the people? Why do you sit alone[b], while all the people stand before you from morning until evening?”
translation:
  language: hi
  text: जब मूसा के ससुर ने देखा कि वह लोगों के लिए जो कुछ कर रहा था, तो उसने कहा, “यह क्या है जो तुम लोगों के लिए कर रहे हो? तुम अकेले क्यों बैठे हो, और सब लोग सुबह से शाम तक तुम्हारे सामने खड़े हैं[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “तुम्हारे ऊपर खड़े हैं”; यहाँ इसका भाव मूसा के सामने उपस्थित रहने से है, संभवतः न्याय पाने के लिए।
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹתֵן מֹשֶׁה
  choice: मूसा के ससुर
  rationale: חֹתֵן विवाह-संबंधी पुरुष रिश्तेदार को दर्शाता है और इस प्रसंग में मूसा के ससुर यित्रो के लिए प्रयुक्त है।
- source_word: אֵת כָּל אֲשֶׁר הוּא עֹשֶׂה לָעָם
  choice: वह लोगों के लिए क्या-क्या कर रहा है
  rationale: यह अभिव्यक्ति मूसा की जारी समस्त गतिविधि को दर्शाती है; ‘क्या-क्या’ सहज हिंदी में उसकी गतिविधि की व्यापकता व्यक्त करता है और ל को हितार्थक ‘के लिए’ समझता है।
- source_word: מָה הַדָּבָר הַזֶּה אֲשֶׁר אַתָּה עֹשֶׂה לָעָם
  choice: यह क्या है जो तुम लोगों के लिए कर रहे हो?
  rationale: דָּבָר यहाँ कार्य, मामला या स्थिति को सूचित कर सकता है। ‘यह क्या है’ मूल प्रश्न की व्यापकता बनाए रखते हुए हिंदी में स्वाभाविक है।
- source_word: אַתָּה יוֹשֵׁב לְבַדֶּךָ
  choice: तुम अकेले क्यों बैठे रहते हो
  rationale: ישב के बैठने और कार्य-सत्र में बैठने, दोनों अर्थों को बनाए रखता है; प्रसंग में मूसा अकेला न्यायिक कार्य कर रहा है।
- source_word: וְכָל הָעָם נִצָּב עָלֶיךָ
  choice: और सब लोग ... तुम्हारे सामने खड़े रहते हैं
  rationale: נצב का अर्थ ‘खड़ा होना’ है और עָלֶיךָ का शाब्दिक रूप ‘तुम्हारे ऊपर/पास’ है; यहाँ अधिकार रखने वाले व्यक्ति के समक्ष उपस्थित रहने का भाव सबसे उपयुक्त है।
- source_word: מִן בֹּקֶר עַד עָרֶב
  choice: सुबह से शाम तक
  rationale: यह पूरे दिन की अवधि बताने वाला स्वाभाविक हिंदी प्रयोग है।
