  yaml_path: translation/ot/exodus/018/026.yaml
  text: And they judged the people at all times. Every difficult matter they would bring to Moses[a], but every small matter they themselves would judge.
translation:
  language: hi
  text: और वे हर समय लोगों का न्याय करते थे। हर कठिन मामला वे मूसा के पास लाते थे[a], पर हर छोटे मामले का न्याय वे स्वयं करते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हर कठिन मुक़दमा ... हर छोटा मुक़दमा।” न्यायिक संदर्भ में इब्रानी पाठ कठिन मामलों और छोटे मामलों के बीच अंतर करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁפְטוּ
  choice: और वे ... न्याय करते थे
  rationale: क़ाल क्रिया यहाँ नियुक्त न्यायियों के निरंतर और प्रचलित कार्य का वर्णन करती है; ‘न्याय करते थे’ कथात्मक तथा आवृत्तिमूलक भाव दोनों व्यक्त करता है।
- source_word: הָעָם
  choice: लोगों
  rationale: निर्गमन में עַם समुदाय के लोगों को सूचित करता है; आधुनिक हिन्दी में ‘लोगों’ स्वाभाविक है।
- source_word: בְּכָל־עֵת
  choice: हर समय
  rationale: यह पद नियमित उपलब्धता और निरंतर न्यायिक सेवा का भाव देता है।
- source_word: הַדָּבָר הַקָּשֶׁה
  choice: हर कठिन मामला
  rationale: न्यायिक संदर्भ में דָּבָר का अर्थ ‘मामला’ है और קָשֶׁה उसकी कठिनता बताता है; एकवचन यहाँ वर्गगत अर्थ रखता है।
- source_word: יְבִיאוּן אֶל־מֹשֶׁה
  choice: वे मूसा के पास लाते थे
  rationale: यह रूप बार-बार होने वाली प्रचलित कार्रवाई बताता है; ‘लाते थे’ उस आवृत्तिमूलक भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: כָל־הַדָּבָר הַקָּטֹן
  choice: हर छोटे मामले
  rationale: קָטֹן कठिन मामलों के विपरीत कम बड़े या सरल मामले को सूचित करता है; ‘छोटे’ मूल शब्द के सीधे विरोध को बनाए रखता है।
- source_word: יִשְׁפּוּטוּ הֵם
  choice: न्याय वे स्वयं करते थे
  rationale: स्वतंत्र सर्वनाम הֵם पर बल है; ‘वे स्वयं’ यह स्पष्ट करता है कि ऐसे मामलों का निर्णय अधीनस्थ न्यायी ही करते थे।
