  text: וַ/יִּבְחַ֨ר מֹשֶׁ֤ה אַנְשֵׁי חַ֨יִל֙ מִ/כָּל יִשְׂרָאֵ֔ל וַ/יִּתֵּ֥ן אֹתָ֛/ם רָאשִׁ֖ים עַל הָ/עָ֑ם שָׂרֵ֤י אֲלָפִים֙ שָׂרֵ֣י מֵא֔וֹת שָׂרֵ֥י חֲמִשִּׁ֖ים וְ/שָׂרֵ֥י עֲשָׂרֹֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/025.yaml
  text: 'Moses chose capable men from all Israel and appointed them as heads over the people: commanders of thousands[a], commanders of hundreds, commanders of fifties[b], and commanders of tens.'
translation:
  language: hi
  text: मूसा ने सारे इस्राएल में से योग्य पुरुषों को चुना और उन्हें लोगों के ऊपर प्रधान ठहराया—हज़ारों के अधिकारी[a], सैकड़ों के अधिकारी, पचास-पचास के अधिकारी और दस-दस के अधिकारी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अधिकारी’ का अनुवाद ‘नेता’ या ‘मुखिया’ भी किया जा सकता है। यहाँ इब्रानी शब्द ऐसे पदाधिकारी को दर्शाता है जिसे एक समूह पर अधिकार दिया गया था।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְחַר
  choice: चुना
  rationale: בחר का सीधा अर्थ चुनना है; हिन्दी कथात्मक शैली में ‘चुना’ स्वाभाविक और सटीक है।
- source_word: אַנְשֵׁי חַיִל
  choice: योग्य पुरुषों
  rationale: इस न्यायिक-प्रशासनिक प्रसंग में חַיִל शौर्य से अधिक सामर्थ्य, योग्यता और सिद्ध क्षमता को व्यक्त करता है; ‘योग्य पुरुष’ वर्तमान हिन्दी में स्पष्ट है।
- source_word: מִכָּל יִשְׂרָאֵל
  choice: सारे इस्राएल में से
  rationale: यह पूरे समुदाय में से चयन किए जाने का भाव स्पष्ट करता है।
- source_word: וַיִּתֵּן אֹתָם
  choice: उन्हें ... ठहराया
  rationale: נתן का यहाँ पद या दायित्व सौंपने का मुहावरेदार अर्थ है; ‘ठहराया’ नियुक्ति का भाव संक्षेप में व्यक्त करता है।
- source_word: רָאשִׁים עַל הָעָם
  choice: लोगों के ऊपर प्रधान
  rationale: ‘प्रधान’ רָאשִׁים में निहित अधिकार-सूचक ‘सिर/मुखिया’ रूपक को स्वाभाविक हिन्दी में व्यक्त करता है, और ‘ऊपर’ עַל के शासनाधिकार के भाव को बनाए रखता है।
- source_word: שָׂרֵי
  choice: अधिकारी
  rationale: שַׂר यहाँ विभिन्न आकार के समूहों पर नियुक्त पदाधिकारी को दर्शाता है। ‘अधिकारी’ प्रशासनिक और संभावित न्यायिक भूमिका दोनों के लिए उपयुक्त है; ‘सेनापति’ अनावश्यक रूप से सैन्य अर्थ जोड़ता।
- source_word: אֲלָפִים / מֵאוֹת / חֲמִשִּׁים / עֲשָׂרֹת
  choice: हज़ारों, सैकड़ों, पचास-पचास और दस-दस
  rationale: ये रूप क्रमबद्ध समूहों को दर्शाते हैं। हिन्दी में बड़े वर्गों के लिए बहुवचन और छोटे समूहों के लिए वीप्सा-द्योतक पुनरुक्ति स्वाभाविक है।
