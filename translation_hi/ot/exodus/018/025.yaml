translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘अधिकारी’ को ‘सेनापति’ पर प्राथमिकता दी गई है क्योंकि निकटवर्ती प्रसंग न्याय-विवादों के निपटारे का है, केवल सैन्य संगठन का नहीं। मुख्य पाठ का [a] चिह्न संबंधित पादटिप्पणी से मेल खाता है।
