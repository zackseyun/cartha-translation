base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/020.yaml
  text: And you shall warn them about the statutes and the laws[b][a], and make known to them the way in which they must walk and the work that they must do.
translation:
  language: hi
  text: तुम उन्हें विधियों और व्यवस्थाओं[a] के बारे में चेतावनी देना, और उन्हें वह मार्ग बताना जिस पर उन्हें चलना है[b], और वह काम भी जो उन्हें करना है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘निर्देशों’। इब्रानी तोरोत का अर्थ व्यापक रूप से ‘शिक्षाओं’ या ‘निर्देशों’ भी हो सकता है, लेकिन यहाँ न्यायिक संदर्भ में ‘व्यवस्थाएँ’ उपयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘वह मार्ग जिस पर वे चलें।’ ‘चलना’ आचरण के लिए प्रयुक्त इब्रानी रूपक को सुरक्षित रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזְהַרְתָּה
  choice: और उन्हें ... सावधान करना
  rationale: हिफ़ील रूप में चेताने, सावधान करने या गंभीर निर्देश देने का भाव है। न्यायिक संदर्भ में ‘सावधान करना’ उत्तरदायित्व सहित चेतावनी का अर्थ स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַחֻקִּים
  choice: विधियों
  rationale: यह शब्द निर्धारित नियमों या अधिनियमों को सूचित करता है; ‘विधियाँ’ कानूनी भाव को स्पष्ट और आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הַתּוֹרֹת
  choice: व्यवस्थाओं
  rationale: תּוֹרָה का अर्थ व्यापक रूप से शिक्षा या निर्देश हो सकता है, पर यहाँ חֻקִּים के साथ न्यायिक संदर्भ में बहुवचन कानूनी निर्देशों की ओर संकेत करता है। इस व्यापकता को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וְהוֹדַעְתָּ
  choice: उन्हें ... बताना
  rationale: हिफ़ील का कारणवाचक अर्थ ‘ज्ञात कराना’ है। साधारण आधुनिक हिन्दी में ‘बताना’ वही आशय सहज ढंग से पहुँचाता है।
- source_word: הַדֶּרֶךְ
  choice: वह मार्ग
  rationale: ‘मार्ग’ आचरण या जीवन-पद्धति के इब्रानी रूपक को बनाए रखता है।
- source_word: יֵלְכוּ בָהּ
  choice: जिस पर उन्हें चलना है
  rationale: הלך के साथ ב मार्ग के अनुसार आचरण को दर्शाता है। ‘चलना’ बाइबिल के मूल रूपक को बनाए रखता है और ‘है’ प्रसंग की बाध्यकारी प्रकृति व्यक्त करता है।
- source_word: הַמַּעֲשֶׂה
  choice: वह काम
  rationale: מַעֲשֶׂה किए जाने वाले कार्य या कर्म को दर्शाता है। ‘काम’ यहाँ अपेक्षित ठोस कर्तव्य के लिए सरल और व्यापक शब्द है।
- source_word: אֲשֶׁר יַעֲשׂוּן
  choice: जो उन्हें करना है
  rationale: यह संबंधवाचक उपवाक्य अपेक्षित कार्य को निर्दिष्ट करता है; ‘करना है’ आधुनिक हिन्दी में दायित्व को स्वाभाविक रूप से व्यक्त करता है।
