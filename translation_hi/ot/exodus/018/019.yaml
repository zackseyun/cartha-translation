base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/019.yaml
  text: Now listen to my voice[a]; I will advise you, and God be with you. You be for the people before God[c][b], and you shall bring the matters to God.
translation:
  language: hi
  text: अब मेरी बात सुनो; मैं तुम्हें सलाह दूँगा, और परमेश्वर तुम्हारे साथ रहे। तुम लोगों की ओर से परमेश्वर के सामने रहो[b], और मामले[a] परमेश्वर के पास लाओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “मामले” से आशय निर्णय के लिए लाए गए लोगों के मुकदमों या विवादों से है।
    reason: cultural_note
  - marker: b
    text: या, “परमेश्वर के सामने लोगों का प्रतिनिधित्व करो।”
    reason: alternative_reading
lexical_decisions:
- source_word: עַתָּה
  choice: अब
  rationale: यह समयसूचक होने के साथ अगले निर्देश की भूमिका बाँधने वाला स्वाभाविक हिन्दी संकेत है।
- source_word: שְׁמַע בְּקֹלִי
  choice: मेरी बात सुनो
  rationale: हिब्रू मुहावरे का अर्थ यहाँ सलाह ध्यान से सुनना है; शाब्दिक ‘मेरी आवाज़ सुनो’ की तुलना में यह आधुनिक हिन्दी में अधिक स्वाभाविक है और ‘आज्ञा मानो’ जैसा अतिरिक्त बल नहीं जोड़ता।
- source_word: אִיעָצְךָ
  choice: मैं तुम्हें सलाह दूँगा
  rationale: יעץ का परामर्श देने वाला अर्थ स्पष्ट और सामान्य आधुनिक हिन्दी में व्यक्त होता है।
- source_word: וִיהִי אֱלֹהִים עִמָּךְ
  choice: और परमेश्वर तुम्हारे साथ रहे
  rationale: क्रिया के इच्छार्थक भाव को हिन्दी में स्वाभाविक आशीष अथवा शुभकामना के रूप में सुरक्षित रखता है।
- source_word: הֱיֵה אַתָּה לָעָם מוּל הָאֱלֹהִים
  choice: तुम लोगों की ओर से परमेश्वर के सामने रहो
  rationale: यह लोगों और परमेश्वर के बीच मूसा की प्रतिनिधिक भूमिका को व्यक्त करता है, पर उसे किसी अधिक विकसित धर्मवैज्ञानिक पद से नहीं बाँधता।
- source_word: הַדְּבָרִים
  choice: मामले
  rationale: דברים व्यापक शब्द है, पर न्यायिक संदर्भ में निर्णय के लिए लाए गए मामले अथवा विवाद अभिप्रेत हैं।
- source_word: וְהֵבֵאתָ ... אֶל הָאֱלֹהִים
  choice: परमेश्वर के पास लाओ
  rationale: निर्देशात्मक क्रम को स्वाभाविक हिन्दी आज्ञार्थक रूप में व्यक्त करता है।
theological_decisions:
- issue: אֱלֹהִים का अनुवाद
  choice: परमेश्वर
  alternative: ईश्वर; सच्चा परमेश्वर
  rationale: इस प्रसंग में शब्द एकवचन अर्थ में इस्राएल के परमेश्वर को दर्शाता है। ‘परमेश्वर’ मानक और पर्याप्त है; ‘सच्चा’ जोड़ना मूल में निहित विरोध को अनावश्यक रूप से स्पष्ट करता।
- issue: मूसा की प्रतिनिधिक भूमिका
  choice: लोगों की ओर से परमेश्वर के सामने रहो
  alternative: परमेश्वर के सामने लोगों का प्रतिनिधित्व करो
  rationale: मुख्य पाठ स्रोत की संरचना और उसके खुलेपन को बनाए रखता है; अधिक स्पष्ट प्रतिनिधिक अर्थ को पादटिप्पणी में दिया गया है।
- issue: וִיהִי का इच्छार्थक भाव
  choice: परमेश्वर तुम्हारे साथ रहे
  alternative: परमेश्वर तुम्हारे साथ होगा
  rationale: हिब्रू रूप को कथन अथवा निश्चित प्रतिज्ञा बनाने के बजाय उसकी शुभकामना/आशीष की शक्ति सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मेरी बात सुनो’ हिन्दी मुहावरे के अनुरूप है; ‘परमेश्वर तुम्हारे साथ रहे’ इच्छार्थक आशीष को स्पष्ट करता है। पादटिप्पणी-चिह्न मुख्य पाठ में उसी पदांश के तुरंत बाद रखे गए हैं जिसे वे समझाते हैं।
