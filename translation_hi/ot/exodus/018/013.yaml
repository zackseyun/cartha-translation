  text: And it happened on the next day that Moses sat to judge the people[a], and the people stood before Moses from morning until evening.
translation:
  language: hi
  text: अगले दिन ऐसा हुआ कि मूसा लोगों का न्याय करने बैठा, और लोग सुबह से शाम तक मूसा के सामने[a] खड़े रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मूसा के चारों ओर।” इब्रानी संबंधबोधक का अधिक शाब्दिक स्थानिक अर्थ ऐसा हो सकता है, पर प्रसंग में लोग न्याय की प्रतीक्षा में उसके सामने उपस्थित थे।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ऐसा हुआ
  rationale: यह इब्रानी कथात्मक सूत्र अगले घटनाक्रम का परिचय देता है; यह रूप उसकी कथात्मक छटा को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: מִמָּחֳרָת
  choice: अगले दिन
  rationale: यह संज्ञा पिछले प्रसंग के बाद आने वाले दिन को सूचित करती है।
- source_word: וַיֵּשֶׁב
  choice: बैठा
  rationale: ישב का ठोस अर्थ ‘बैठना’ है; न्यायिक प्रसंग में मूसा का न्याय करने के लिए आसन ग्रहण करना अभिप्रेत है।
- source_word: לִשְׁפֹּט
  choice: न्याय करने
  rationale: שפט यहाँ लोगों के विवादों या मामलों का न्यायिक निर्णय करने को दर्शाता है।
- source_word: הָעָם
  choice: लोगों
  rationale: עם इस प्रसंग में इस्राएली समुदाय को सामूहिक रूप से दर्शाता है; हिन्दी में ‘लोग’ स्वाभाविक है।
- source_word: וַיַּעֲמֹד
  choice: खड़े रहे
  rationale: עמד का मूल अर्थ ‘खड़ा होना’ है; सुबह से शाम तक की अवधि के कारण ‘खड़े रहे’ निरंतर प्रतीक्षा का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: עַל מֹשֶׁה
  choice: मूसा के सामने
  rationale: על का अधिक शाब्दिक अर्थ ‘पर/ऊपर’ हो सकता है, पर עמד के साथ इस प्रसंग में यह न्याय पाने हेतु मूसा के सम्मुख उपस्थित रहने को व्यक्त करता है। संभावित स्थानिक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: מִן הַבֹּקֶר עַד הָעָרֶב
  choice: सुबह से शाम तक
  rationale: यह पूरे दिन की अवधि बताने वाला स्वाभाविक हिन्दी काल-वाचक प्रयोग है।
