  text: and her two sons[a], of whom the name of the one was Gershom, for he said, “I have been a foreigner in a foreign land.”
translation:
  language: hi
  text: और उसके दोनों बेटों को भी ले लिया। उनमें से एक का नाम गेर्शोम था, क्योंकि उसने कहा था, “मैं पराए देश में परदेशी था।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मैं पराए देश में परदेसी था।” इब्रानी גֵּר अस्थायी निवासी, बाहरी व्यक्ति या परदेशी को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת
  choice: और ... को भी
  rationale: यह पिछले पद के क्रियापद का कर्म आगे बढ़ाता है; हिन्दी में ‘को’ कर्म-संबंध स्पष्ट करता है और ‘भी’ सिप्पोरा के साथ दोनों बेटों के समावेश को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: שְׁנֵי בָנֶיהָ
  choice: उसके दोनों बेटों
  rationale: यह स्त्रीलिंग एकवचन प्रत्यय और बेटों की संख्या तथा पुरुषवाचक संदर्भ को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: אֲשֶׁר שֵׁם הָאֶחָד
  choice: उनमें से एक का नाम
  rationale: यह सम्बन्धवाचक वाक्य को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और ‘एक’ को ‘पहला’ बनाकर अनावश्यक क्रम नहीं जोड़ता।
- source_word: גֵּרְשֹׁם
  choice: गेर्शोम
  rationale: इब्रानी व्यक्तिगत नाम का प्रचलित, स्रोत-सन्निकट देवनागरी लिप्यंतरण।
- source_word: כִּי אָמַר
  choice: क्योंकि उसने कहा था
  rationale: नाम रखने का कारण स्पष्ट करता है; पूर्ण भूतकाल पूर्व में कही गई बात को हिन्दी में स्वाभाविक रूप से व्यक्त करता है।
- source_word: גֵּר
  choice: परदेशी
  rationale: यह ऐसे व्यक्ति का अर्थ देता है जो अपनी भूमि से बाहर किसी अन्य देश में रह रहा हो; साथ ही सामान्य पाठक के लिए सहज और नामकरण के शब्द-संबंध के अनुकूल है।
- source_word: הָיִיתִי
  choice: रहा हूँ
  rationale: इब्रानी पूर्ण क्रिया के अनुभवात्मक और वर्तमान-सापेक्ष भाव को स्वाभाविक हिन्दी पूर्ण वर्तमान में व्यक्त करता है, जबकि साधारण भूतकाल भी सम्भव है।
- source_word: בְּאֶרֶץ נָכְרִיָּה
  choice: पराए देश में
  rationale: भूमि के अपने न होने और बाहरीपन का भाव सहज आधुनिक हिन्दी में सुरक्षित रहता है।
