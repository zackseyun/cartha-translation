  text: וַ/יִּקַּ֞ח יִתְר֨וֹ חֹתֵ֥ן מֹשֶׁ֛ה עֹלָ֥ה וּ/זְבָחִ֖ים לֵֽ/אלֹהִ֑ים וַ/יָּבֹ֨א אַהֲרֹ֜ן וְ/כֹ֣ל זִקְנֵ֣י יִשְׂרָאֵ֗ל לֶ/אֱכָל לֶ֛חֶם עִם חֹתֵ֥ן מֹשֶׁ֖ה לִ/פְנֵ֥י הָ/אֱלֹהִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/012.yaml
  text: Then Jethro[a], Moses’ father-in-law, took a burnt offering and sacrifices for God, and Aaron and all the elders of Israel came to eat bread with Moses’ father-in-law before God.
translation:
  language: hi
  text: तब मूसा के ससुर यित्रो परमेश्वर के लिए एक होमबलि और बलिदान लेकर आए। हारून और इस्राएल के सभी बुज़ुर्ग मूसा के ससुर के साथ परमेश्वर के सामने रोटी खाने[a] आए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “रोटी खाने”; यह इब्रानी मुहावरा “साथ भोजन करने” के अर्थ में भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: चढ़ाईं
  rationale: לקח का मूल अर्थ ‘लेना’ है, पर बलिदानों के साथ इस प्रसंग में हिन्दी में ‘बलियाँ लीं’ अस्वाभाविक और अस्पष्ट होगा। ‘चढ़ाईं’ प्रसंगगत बलिदानी क्रिया को स्वाभाविक रूप से व्यक्त करता है।
- source_word: חֹתֵן מֹשֶׁה
  choice: मूसा के ससुर
  rationale: इस कथा में חֹתֵן मूसा से यित्रो के संबंध को स्पष्ट रूप से ‘ससुर’ के अर्थ में बताता है।
- source_word: עֹלָה
  choice: एक होमबलि
  rationale: עֹלָה पूरी तरह जलाए जाने वाले बलिदान का पारंपरिक पद है; ‘होमबलि’ हिन्दी बाइबलीय प्रयोग में संक्षिप्त और पहचाना हुआ समतुल्य है।
- source_word: וּזְבָחִים
  choice: और दूसरी बलियाँ
  rationale: זְבָחִים व्यापक बहुवचन है और विशिष्ट होमबलि से अलग बलियों को सूचित करता है। ‘दूसरी’ हिन्दी में इस भेद को स्वाभाविक बनाता है, बिना बलियों का प्रकार निर्धारित किए।
- source_word: לֵאלֹהִים
  choice: परमेश्वर के लिए
  rationale: ל समर्पण या उद्देश्य दर्शाता है। एकवचन कथात्मक संदर्भ में אֱלֹהִים इस्राएल के परमेश्वर को सूचित करता है।
- source_word: וַיָּבֹא אַהֲרֹן וְכֹל זִקְנֵי יִשְׂרָאֵל
  choice: हारून और इस्राएल के सभी बुज़ुर्ग ... आए
  rationale: पूर्वस्थ एकवचन क्रिया के बाद संयुक्त कर्ता आता है; हिन्दी में बहुवचन ‘आए’ स्वाभाविक है। זִקְנֵי के लिए ‘बुज़ुर्ग’ आधुनिक और सहज है।
- source_word: לֶאֱכָל לֶחֶם
  choice: रोटी खाने
  rationale: यह मूल अभिव्यक्ति का ठोस रूप सुरक्षित रखता है। इब्रानी मुहावरे में इसका आशय साथ भोजन करना भी हो सकता है, जिसे पादटिप्पणी में बताया गया है।
- source_word: עִם חֹתֵן מֹשֶׁה
  choice: मूसा के ससुर के साथ
  rationale: मूल पाठ यित्रो का नाम दोहराने के बजाय संबंधसूचक पद दोहराता है; अनुवाद उसी प्रवचन-रूप को बनाए रखता है।
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: परमेश्वर के सामने
  rationale: यह לִפְנֵי का सीधा और स्वाभाविक समतुल्य है तथा परमेश्वर की उपस्थिति में हुए पवित्र सामूहिक भोजन की गंभीरता बनाए रखता है।
theological_decisions:
- issue: बलिदानी संदर्भ में भोजन की अभिव्यक्ति
  choice: मूल की ‘रोटी खाने’ अभिव्यक्ति रखते हुए पादटिप्पणी में सामूहिक भोजन का मुहावरेदार अर्थ बताया गया है।
  alternative: मुख्य पाठ में सीधे ‘साथ भोजन करने’ कहना।
  rationale: बलिदानों, हारून और बुज़ुर्गों की सहभागिता तथा ‘परमेश्वर के सामने’ से पवित्र अथवा बलिदानी भोजन का संकेत मिलता है; फिर भी पद स्वयं केवल ‘रोटी खाने’ कहता है। अनुवाद इस अर्थगत तनाव को खुला रखता है।
- issue: אֱלֹהִים का संदर्भ
  choice: परमेश्वर
  alternative: देवताओं
  rationale: कथा का एकवचन संदर्भ इस्राएल के परमेश्वर की ओर संकेत करता है; बहुवचन अर्थ यहाँ प्रसंग के अनुकूल नहीं है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘होमबलि’ आवश्यक पारंपरिक बलिदानी पद के रूप में रखा गया है; ‘पुरनियों’ के बजाय अधिक वर्तमान ‘बुज़ुर्ग’ चुना गया है। पादटिप्पणी का चिह्न उसी वाक्यांश के बाद रखा गया है जिसकी वह व्याख्या करती है।
