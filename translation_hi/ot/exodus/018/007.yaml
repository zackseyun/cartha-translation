source:
  edition: WLC
  text: וַ/יֵּצֵ֨א מֹשֶׁ֜ה לִ/קְרַ֣את חֹֽתְנ֗/וֹ וַ/יִּשְׁתַּ֨חוּ֙ וַ/יִּשַּׁק ל֔/וֹ וַ/יִּשְׁאֲל֥וּ אִישׁ לְ/רֵעֵ֖/הוּ לְ/שָׁל֑וֹם וַ/יָּבֹ֖אוּ הָ/אֹֽהֱלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/007.yaml
  text: Moses went out to meet his father-in-law[a], bowed down, and kissed him. Then each asked the other about his welfare, and they went into the tent.
translation:
  language: hi
  text: मूसा अपने ससुर से मिलने बाहर गया, उनके सामने झुका और उन्हें चूमा। फिर दोनों ने एक-दूसरे का कुशल-क्षेम पूछा[a] और तम्बू में गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “दोनों ने एक-दूसरे से शान्ति के विषय में पूछा”; यहाँ “शान्ति” का अर्थ कुशलता और भलाई है।
    reason: मूल इब्रानी मुहावरे और שָׁלוֹם के व्यापक अर्थ को स्पष्ट करना।
lexical_decisions:
- source_word: לִקְרַאת
  choice: से मिलने
  rationale: יצא के साथ यह पदबंध किसी आने वाले व्यक्ति से मिलने के लिए बाहर जाने को व्यक्त करता है; यहाँ आकस्मिक भेंट का भाव नहीं है।
- source_word: חֹתְנוֹ
  choice: अपने ससुर
  rationale: निर्गमन 18 के प्रसंग में חֹתֵן मूसा के ससुर यित्रो को सूचित करता है; सामान्य वैवाहिक संबंधी की अपेक्षा यही सटीक संबंध है।
- source_word: וַיִּשְׁתַּחוּ
  choice: उनके सामने झुका
  rationale: क्रिया गहराई से झुकने या दण्डवत होने का संकेत दे सकती है। इस अभिवादन-प्रसंग में यह सम्मान का शारीरिक भाव है; यह अनुवाद इसे आराधना के रूप में निर्धारित नहीं करता।
- source_word: וַיִּשַּׁק לוֹ
  choice: उन्हें चूमा
  rationale: यह अभिवादन के प्रचलित चुम्बन को दर्शाता है और आधुनिक हिन्दी में स्वाभाविक तथा मूल के निकट है।
- source_word: וַיִּשְׁאֲלוּ אִישׁ לְרֵעֵהוּ לְשָׁלוֹם
  choice: दोनों ने एक-दूसरे का कुशल-क्षेम पूछा
  rationale: אישׁ לרעהו पारस्परिकता व्यक्त करता है, और שאל לשלום किसी के हाल-चाल अथवा भलाई के विषय में पूछने का मुहावरा है। ‘कुशल-क्षेम’ हिन्दी में इस भाव को संक्षिप्त और स्वाभाविक रूप से व्यक्त करता है।
- source_word: הָאֹהֱלָה
  choice: तम्बू में
  rationale: दिशासूचक प्रत्यय तम्बू के भीतर जाने की गति बताता है। मूल पाठ इसे ‘मूसा का तम्बू’ नहीं कहता, इसलिए स्वामित्व नहीं जोड़ा गया।
theological_decisions:
- issue: यित्रो के सामने मूसा के झुकने का अर्थ
  choice: सम्मान प्रकट करने के लिए झुकना
  alternative: आराधना के रूप में दण्डवत करना
  rationale: שׁחה अन्य प्रसंगों में आराधना के लिए प्रयुक्त हो सकती है, पर यहाँ मानवीय संबोधन और अभिवादन का क्रम सामाजिक सम्मान की ओर संकेत करता है। ‘उनके सामने झुका’ क्रिया को बनाए रखता है, पर पाठ से परे कोई धार्मिक दावा नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। सम्मानसूचक सर्वनाम ‘उनके/उन्हें’ पारिवारिक आदर के प्रसंग के अनुकूल हैं। ‘कुशल-क्षेम पूछा’ सामान्य पाठक के लिए स्वाभाविक है और इब्रानी שָׁלוֹם की भलाई-संबंधी व्यापकता को बनाए रखता है।
