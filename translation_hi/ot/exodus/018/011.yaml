language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: עַתָּ֣ה יָדַ֔עְתִּי כִּֽי גָד֥וֹל יְהוָ֖ה מִ/כָּל הָ/אֱלֹהִ֑ים כִּ֣י בַ/דָּבָ֔ר אֲשֶׁ֥ר זָד֖וּ עֲלֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/011.yaml
  text: Now I know that Yahweh is greater than all the gods[a], because in the matter in which they acted arrogantly against them, he was above them.
translation:
  language: hi
  text: अब मैं जान गया हूँ कि याहवे सभी देवताओं से महान है, क्योंकि जिस मामले में उन्होंने उनके विरुद्ध घमण्ड से काम लिया, उसी में वह उनसे ऊपर सिद्ध हुआ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि जिस बात में उन्होंने उनके विरुद्ध घमण्ड से काम लिया।” अंतिम उपवाक्य का इब्रानी पाठ कठिन है; सम्भवतः यह मिस्रियों द्वारा इस्राएलियों के साथ किए गए घमण्डपूर्ण व्यवहार की ओर संकेत करता है।
    reason: वैकल्पिक पाठ और मूल इब्रानी की वास्तविक वाक्यगत अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: עַתָּה
  choice: अब
  rationale: यह कालवाचक क्रियाविशेषण हाल की घटनाओं के आधार पर यित्रो के वर्तमान निष्कर्ष को व्यक्त करता है।
- source_word: יָדַעְתִּי
  choice: मैं जान गया हूँ
  rationale: कल पूर्ण रूप यहाँ प्राप्त हुई नई पहचान और उसके वर्तमान परिणाम, दोनों को व्यक्त करता है।
- source_word: גָדוֹל ... מִכָּל
  choice: सब ... से महान
  rationale: מִן के साथ विशेषण तुलनात्मक अर्थ देता है; यह सहज हिन्दी में श्रेष्ठता व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ के व्यक्तिगत दिव्य नाम को किसी उपाधि से बदलने के बजाय प्रचलित हिन्दी लिप्यंतरण में रखा गया है।
- source_word: מִכָּל הָאֱלֹהִים
  choice: सब देवताओं से
  rationale: बहुवचन और तुलनात्मक रचना को सीधे सुरक्षित रखता है; प्रसंग में राष्ट्रों के देवताओं से तुलना है।
- source_word: בַדָּבָר אֲשֶׁר
  choice: जिस बात में ... उसी में
  rationale: דבר को यहाँ प्रसंगगत घटना या मामले के अर्थ में लिया गया है और हिन्दी सहसम्बन्धी रचना से बल स्पष्ट किया गया है।
- source_word: זָדוּ
  choice: घमण्ड किया
  rationale: क्रिया उद्दण्ड, अभिमानी या धृष्ट व्यवहार बताती है; यह सरल और स्वाभाविक आधुनिक हिन्दी है।
- source_word: עֲלֵיהֶם
  choice: उनके विरुद्ध ... उनसे ऊपर
  rationale: कठिन और संक्षिप्त उपवाक्य में यही रूप पीड़ितों के विरुद्ध घमण्ड तथा घमण्डियों पर यहोवा की सिद्ध श्रेष्ठता—दोनों सम्भावित संबंधों को पठनीय हिन्दी में सामने लाता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: इसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया; हिन्दी पाठकों में व्यापक रूप से पहचाने जाने वाले व्यक्तिगत नाम-रूप ‘यहोवा’ को अपनाया गया है।
- issue: कठिन अंतिम उपवाक्य כִּי בַדָּבָר אֲשֶׁר זָדוּ עֲלֵיהֶם
  choice: जिस बात में उन्होंने उनके विरुद्ध घमण्ड किया, उसी में वह उनसे ऊपर सिद्ध हुआ
  alternative: क्योंकि जिस बात में उन्होंने उनके विरुद्ध घमण्ड किया
  rationale: इब्रानी वाक्य अत्यन्त संक्षिप्त और व्याकरणतः कठिन है। मुख्य पाठ प्रसंग से निहित यहोवा की श्रेष्ठता को व्यक्त करता है, जबकि पादटिप्पणी अधिक निकट, कम व्याख्यात्मक सम्भावना सुरक्षित रखती है। सर्वनामों के निश्चित पूर्वपद पाठ में जोड़कर अस्पष्टता को अनुचित रूप से समाप्त नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘अब मैं जान गया हूँ’ नई पहचान के वर्तमान परिणाम को व्यक्त करता है। कठिन अंतिम खण्ड को पठनीय बनाया गया है, पर सर्वनामों के पूर्वपदों और वाक्य के आशय को पादटिप्पणी सहित खुला रखा गया है।
