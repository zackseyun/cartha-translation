lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: विदा किया
  rationale: पिएल रूप में यह क्रिया किसी व्यक्ति को जाने देने या औपचारिक रूप से विदा करने का अर्थ देती है। ‘विदा किया’ आधुनिक हिन्दी में स्वाभाविक और प्रसंगानुकूल है।
- source_word: חֹתְנוֹ
  choice: अपने ससुर को
  rationale: इस प्रसंग में חֹתֵן स्पष्ट रूप से मूसा की पत्नी के पिता, यित्रो, को सूचित करता है।
- source_word: וַיֵּלֶךְ לוֹ
  choice: वह ... लौट गया
  rationale: לוֹ यहाँ मुहावरेदार दातिव है और अलग से अनुवादित करना आवश्यक नहीं। गंतव्य उसका अपना देश है, इसलिए हिन्दी में ‘लौट गया’ स्वाभाविक रूप से वापसी का भाव व्यक्त करता है।
- source_word: אֶל אַרְצוֹ
  choice: अपने देश
  rationale: אֶרֶץ का अर्थ ‘भूमि’ या ‘देश’ हो सकता है। यहाँ निवास-प्रदेश की ओर वापसी के लिए ‘अपने देश’ सहज है और आधुनिक राष्ट्र-राज्य का अनावश्यक भाव नहीं थोपता।
