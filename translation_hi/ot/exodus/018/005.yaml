  text: וַ/יָּבֹ֞א יִתְר֨וֹ חֹתֵ֥ן מֹשֶׁ֛ה וּ/בָנָ֥י/ו וְ/אִשְׁתּ֖/וֹ אֶל מֹשֶׁ֑ה אֶל הַ/מִּדְבָּ֗ר אֲשֶׁר ה֛וּא חֹנֶ֥ה שָׁ֖ם הַ֥ר הָ/אֱלֹהִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/005.yaml
  text: Then Jethro[a], Moses' father-in-law, came to Moses in the wilderness, where he was camped at the mountain of God[b], with his sons and his wife.
translation:
  language: hi
  text: तब मूसा का ससुर यित्रो, मूसा के पुत्रों और पत्नी के साथ[a], उस निर्जन प्रदेश में मूसा के पास आया, जहाँ मूसा परमेश्वर के पर्वत[b] के पास डेरा डाले हुए था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “उसके पुत्रों और उसकी पत्नी” है। संदर्भ के अनुसार ये मूसा के पुत्र और पत्नी हैं, यद्यपि व्याकरण की दृष्टि से “उसके” को यित्रो से जोड़ना भी संभव है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात “परमेश्वर का पर्वत”—यह पदवी सीनै/होरेब से जुड़ी हुई है; यहाँ मूल पाठ पर्वत का वह नाम नहीं देता।
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּבֹא
  choice: तब ... आया
  rationale: वय्यिक्तोल रूप कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में घटनाक्रम व्यक्त करता है।
- source_word: יִתְרוֹ
  choice: यित्रो
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: חֹתֵן מֹשֶׁה
  choice: मूसा का ससुर
  rationale: यह संबंधवाचक पद यित्रो और मूसा का पारिवारिक संबंध स्पष्ट करता है।
- source_word: וּבָנָיו וְאִשְׁתּוֹ
  choice: मूसा के पुत्रों और उसकी पत्नी के साथ
  rationale: संदर्भ में प्रत्यय मूसा की ओर संकेत करते हैं; ‘के साथ’ आगमन में साथ आए व्यक्तियों को स्वाभाविक हिन्दी में व्यक्त करता है। पाठ की व्याकरणिक संभावना पाद-टिप्पणी में सुरक्षित है।
- source_word: אֶל־הַמִּדְבָּר
  choice: निर्जन प्रदेश में
  rationale: מִדְבָּר खुले, कम आबाद वन्य क्षेत्र को दर्शाता है; ‘निर्जन प्रदेश’ आधुनिक हिन्दी में ‘जंगल’ के वन-संबंधी भ्रामक अर्थ से बचता है।
- source_word: אֲשֶׁר הוּא חֹנֶה שָׁם
  choice: जहाँ मूसा ... डेरा डाले हुए था
  rationale: संबंधवाचक उपवाक्य मूसा के पड़ाव का स्थान बताता है। हिन्दी में अस्पष्ट ‘वह’ के स्थान पर ‘मूसा’ दोहराने से आशय साफ रहता है।
- source_word: הַר הָאֱלֹהִים
  choice: परमेश्वर का पर्वत
  rationale: इब्रानी पदवी को सीधे रखा गया है और इस पद में अनुपस्थित ‘सीनै’ या ‘होरेब’ नाम नहीं जोड़ा गया।
- source_word: הַר הָאֱלֹהִים
  choice: परमेश्वर के पर्वत के निकट
  rationale: पूर्वसर्ग-विहीन स्थानसूचक पद यहाँ मूसा के पड़ाव का स्थान बताता है; ‘के निकट’ स्वाभाविक हिन्दी में पर्वत के पास डेरा होने का भाव देता है।
theological_decisions:
- issue: ‘उसके पुत्रों’ और ‘उसकी पत्नी’ में सर्वनाम-सूचक प्रत्ययों का संदर्भ
  choice: मुख्य पाठ में उन्हें मूसा के पुत्र और पत्नी माना गया है।
  alternative: व्याकरण की दृष्टि से प्रत्यय निकटवर्ती यित्रो की ओर भी समझे जा सकते हैं।
  rationale: निर्गमन 18:2–4 में यित्रो के साथ मूसा की पत्नी और उसके दोनों पुत्रों का उल्लेख तत्काल संदर्भ देता है। फिर भी इब्रानी प्रत्ययों की औपचारिक अस्पष्टता पाद-टिप्पणी में बताई गई है।
- issue: ‘परमेश्वर के पर्वत’ की पहचान
  choice: वर्णनात्मक पदवी को ज्यों का त्यों रखा गया है।
  alternative: इसे सीनै पर्वत या होरेब कहकर स्पष्ट करना।
  rationale: इस पद में मूल पाठ הַר הָאֱלֹהִים कहता है; कोई विशिष्ट नाम जोड़ना पाठ से आगे जाना होता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘निर्जन प्रदेश’ चुना गया है ताकि आधुनिक हिन्दी के ‘जंगल’ से वन का अनावश्यक बोध न हो। वाक्य-क्रम मूल की स्थान-सूचना बनाए रखते हुए हिन्दी में स्वाभाविक रखा गया है।
