  text: וְ/אַתָּ֣ה תֶחֱזֶ֣ה מִ/כָּל הָ֠/עָם אַנְשֵׁי חַ֜יִל יִרְאֵ֧י אֱלֹהִ֛ים אַנְשֵׁ֥י אֱמֶ֖ת שֹׂ֣נְאֵי בָ֑צַע וְ/שַׂמְתָּ֣ עֲלֵ/הֶ֗ם שָׂרֵ֤י אֲלָפִים֙ שָׂרֵ֣י מֵא֔וֹת שָׂרֵ֥י חֲמִשִּׁ֖ים וְ/שָׂרֵ֥י עֲשָׂרֹֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/021.yaml
  text: But you shall select from all the people able men[a], those who fear God, men of truth, hating dishonest gain; and you shall appoint them over them as chiefs of thousands, chiefs of hundreds, chiefs of fifties[c][b], and chiefs of tens.
translation:
  language: hi
  text: परन्तु तुम समस्त लोगों में से योग्य पुरुषों को चुनना[a]—जो परमेश्वर का भय मानते हों, सत्यनिष्ठ हों[b] और बेईमानी की कमाई से घृणा करते हों[c]। उन्हें उन लोगों पर हज़ारों के प्रधान, सैकड़ों के प्रधान, पचासों के प्रधान और दस-दस के प्रधान नियुक्त करना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “समर्थ पुरुषों को ढूँढ़ना।” इब्रानी अभिव्यक्ति सामर्थ्य, योग्यता या वीरता का बोध करा सकती है।
    reason: lexical_alternative
  - marker: b
    text: या “विश्वसनीय हों”; शाब्दिक रूप से “सत्य के पुरुष।”
    reason: lexical_alternative
  - marker: c
    text: या “अन्याय की कमाई से घृणा करते हों”; आशय भ्रष्ट लाभ को ठुकराने से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶחֱזֶה
  choice: चुनना
  rationale: मूल क्रिया का आधारभूत अर्थ ‘देखना’ है, पर यहाँ योग्य अगुओं को परखकर चुनने का व्यावहारिक भाव है।
- source_word: אַנְשֵׁי חַיִל
  choice: योग्य पुरुष
  rationale: חַיִל सामर्थ्य, योग्यता या वीरता बता सकता है; न्यायिक-प्रशासनिक संदर्भ में ‘योग्य’ स्वाभाविक है और ‘पुरुष’ मूल के पुल्लिंग रूप को बनाए रखता है।
- source_word: יִרְאֵי אֱלֹהִים
  choice: जो परमेश्वर का भय मानते हों
  rationale: यह परमेश्वर के प्रति श्रद्धापूर्ण भय को नैतिक योग्यता के रूप में व्यक्त करता है।
- source_word: אַנְשֵׁי אֱמֶת
  choice: सत्यनिष्ठ
  rationale: शाब्दिक रूप ‘सत्य के पुरुष’ है; यहाँ सत्यता, विश्वसनीयता और ईमानदारी का भाव समाहित है।
- source_word: שֹׂנְאֵי בָצַע
  choice: बेईमानी की कमाई से घृणा करते हों
  rationale: בצע भ्रष्ट, अन्यायपूर्ण या लोभ से प्राप्त लाभ को सूचित करता है; यह पद रिश्वत तक सीमित नहीं है।
- source_word: וְשַׂמְתָּ עֲלֵהֶם
  choice: उन्हें लोगों पर ... नियुक्त करना
  rationale: 'दोनों सर्वनामों की अस्पष्ट पुनरावृत्ति को स्वाभाविक हिन्दी में स्पष्ट किया गया है: चुने गए पुरुष लोगों पर नियुक्त होंगे।'
- source_word: שָׂרֵי
  choice: प्रधान
  rationale: שַׂר अगुए, अधिकारी या प्रधान को दर्शाता है; ‘प्रधान’ प्रशासनिक अधिकार व्यक्त करता है, अनावश्यक सैनिक अर्थ नहीं।
- source_word: אֲלָפִים / מֵאוֹת / חֲמִשִּׁים / עֲשָׂרֹת
  choice: हज़ारों, सैकड़ों, पचासों और दस-दस के
  rationale: मूल की क्रमबद्ध प्रशासनिक इकाइयों को संक्षिप्त और स्वाभाविक हिन्दी संरचना में रखा गया है।
theological_decisions:
- issue: नेतृत्व की योग्यताओं में लिंग-सूचक भाषा
  choice: योग्य पुरुषों
  alternative: योग्य लोगों
  rationale: मूल इब्रानी में पुरुषवाचक बहुवचन अभिव्यक्ति है। अनुवाद इसे बनाए रखता है, पर पद से आगे कोई व्यापक सैद्धान्तिक निष्कर्ष नहीं जोड़ता।
- issue: אַנְשֵׁי אֱמֶת का अर्थ-क्षेत्र
  choice: सत्यनिष्ठ
  alternative: विश्वसनीय
  rationale: मूल अभिव्यक्ति सत्यता और विश्वसनीयता दोनों को समेट सकती है। मुख्य पाठ में व्यापक और स्वाभाविक ‘सत्यनिष्ठ’ रखा गया है तथा विकल्प टिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सम्मानपूर्ण, सुबोध और प्रशासनिक संदर्भ के अनुकूल शैली। ‘परन्तु’ और ‘प्रधान’ गरिमामय बाइबिलीय स्वर बनाए रखते हैं; वाक्य-विन्यास को हिन्दी में स्वाभाविक बनाने के लिए आज्ञार्थक infinitive शैली (‘चुनना’, ‘नियुक्त करना’) अपनाई गई है।
