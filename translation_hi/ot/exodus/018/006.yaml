translation:
  language: hi
  text: उसने मूसा से कहा, “मैं, तुम्हारा ससुर यित्रो, तुम्हारे पास आ रहा हूँ; तुम्हारी पत्नी और उसके साथ उसके दो बेटे भी आ रहे हैं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֶל־מֹשֶׁה
  choice: उसने मूसा से कहा
  rationale: वाव-क्रम कथा को आगे बढ़ाता है; हिन्दी में आरम्भिक ‘और’ के बिना वाक्य स्वाभाविक है। אֶל के साथ ‘से कहा’ हिन्दी का सामान्य प्रयोग है।
- source_word: אֲנִי חֹתֶנְךָ יִתְרוֹ
  choice: मैं, तुम्हारा ससुर यित्रो
  rationale: स्वतंत्र सर्वनाम אֲנִי का बल बनाए रखा गया है। חֹתֵן इस प्रसंग में पत्नी के पिता, अर्थात ‘ससुर’, को सूचित करता है।
- source_word: בָּא אֵלֶיךָ
  choice: तुम्हारे पास आ रहा हूँ
  rationale: सहभागी रूप בָּא जारी या निकट भविष्य की गति व्यक्त करता है; ‘आ रहा हूँ’ इसे स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וְאִשְׁתְּךָ
  choice: तुम्हारी पत्नी भी आ रही है
  rationale: हिन्दी में स्पष्ट और स्वाभाविक वाक्य बनाने के लिए निहित आगमन-क्रिया दोहराई गई है; ‘भी’ साथ आने का संबंध दिखाता है।
- source_word: וּשְׁנֵי בָנֶיהָ
  choice: और उसके दो बेटे
  rationale: स्त्रीलिंग एकवचन प्रत्यय का सीधा अर्थ ‘उसके’ है और इसका संदर्भ मूसा की पत्नी से है; इसे ‘तुम्हारे’ बनाकर समतल नहीं किया गया।
- source_word: עִמָּהּ
  choice: उसके साथ हैं
  rationale: मूल पाठ स्पष्ट रूप से बताता है कि दोनों बेटे मूसा की पत्नी के साथ हैं; इस तत्व को बनाए रखा गया है।
