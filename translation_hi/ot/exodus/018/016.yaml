source:
  edition: WLC
  text: כִּֽי יִהְיֶ֨ה לָ/הֶ֤ם דָּבָר֙ בָּ֣א אֵלַ֔/י וְ/שָׁ֣פַטְתִּ֔י בֵּ֥ין אִ֖ישׁ וּ/בֵ֣ין רֵעֵ֑/הוּ וְ/הוֹדַעְתִּ֛י אֶת חֻקֵּ֥י הָ/אֱלֹהִ֖ים וְ/אֶת תּוֹרֹתָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/016.yaml
  text: When they have a matter[a], it comes to me, and I judge between a man and his neighbor[c][b], and I make known the statutes of God and his laws.
translation:
  language: hi
  text: जब उनके पास कोई मामला[a] होता है, तो वह मेरे पास आता है; और मैं एक व्यक्ति और उसके पड़ोसी के बीच न्याय करता हूँ[b], और उन्हें परमेश्वर के विधान और उसकी शिक्षाएँ[c] बताता हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कोई विवाद” अथवा “कोई मुकदमा।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “एक पुरुष और उसके पड़ोसी के बीच”; यह प्रतिनिधिक एकवचन अभिव्यक्ति है।
    reason: cultural_note
  - marker: c
    text: या “उसकी व्यवस्थाएँ।” इब्रानी शब्द का अर्थ अधिक व्यापक रूप से “निर्देश” भी हो सकता है, यद्यपि यहाँ प्रसंग न्यायिक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: जब
  rationale: यहाँ כִּי उस परिस्थिति का परिचय देता है जिसमें मूसा न्याय करता है; हिन्दी में ‘जब’ स्वाभाविक रूप से काल-सापेक्ष/शर्तसूचक अर्थ व्यक्त करता है।
- source_word: יִהְיֶה לָהֶם דָּבָר
  choice: उनके बीच कोई मामला होता है
  rationale: न्यायिक प्रसंग में דָּבָר विवाद या मामला दर्शाता है। ‘मामला’ अर्थ की पर्याप्त व्यापकता बनाए रखता है, और ‘उनके बीच’ हिन्दी में पक्षों से जुड़े विवाद को स्पष्ट करता है।
- source_word: בָּא אֵלַי
  choice: वह मेरे पास आता है
  rationale: בָּא व्याकरणतः पुल्लिंग एकवचन है और निकटवर्ती דָּבָר (‘मामला’) से मेल खाता है; इसलिए मामले को ही कर्ता रखा गया है।
- source_word: וְשָׁפַטְתִּי
  choice: मैं ... न्याय करता हूँ
  rationale: שׁפט यहाँ विवाद में न्यायिक निर्णय देने का अर्थ रखता है; ‘न्याय करता हूँ’ सीधा और गरिमापूर्ण है।
- source_word: בֵּין אִישׁ וּבֵין רֵעֵהוּ
  choice: एक व्यक्ति और उसके संगी के बीच
  rationale: यह प्रतिनिधिक एकवचन कानूनी अभिव्यक्ति है। ‘व्यक्ति’ आधुनिक हिन्दी में स्वाभाविक है, जबकि ‘संगी’ רֵעַ के साथी/सहजन के अर्थ को अनावश्यक रूप से केवल पड़ोसी तक सीमित नहीं करता।
- source_word: וְהוֹדַעְתִּי
  choice: उन्हें ... बताता हूँ
  rationale: ידע के हिफ़ील रूप का कारणवाचक अर्थ ‘जान करा देना’ है; सामान्य हिन्दी में ‘बताता हूँ’ इसे सहजता से व्यक्त करता है। बहुवचन ‘उन्हें’ विवाद के पक्षों की ओर संकेत करता है।
- source_word: חֻקֵּי הָאֱלֹהִים
  choice: परमेश्वर की विधियाँ
  rationale: חֻקִּים निर्धारित नियम या विधान हैं; ‘विधियाँ’ कानूनी भाव को स्पष्ट और संक्षिप्त रूप में व्यक्त करता है।
- source_word: תּוֹרֹתָיו
  choice: उसकी शिक्षाएँ
  rationale: תּוֹרָה का मूल अर्थ शिक्षा/निर्देश है। बहुवचन ‘शिक्षाएँ’ स्रोत का बहुवचन बनाए रखता है और ‘विधियाँ’ के साथ रहते हुए शब्द को केवल संहिताबद्ध कानून तक सीमित नहीं करता।
theological_decisions:
- issue: אִישׁ ... רֵעֵהוּ की प्रतिनिधिक पुल्लिंग एकवचन अभिव्यक्ति
  choice: एक व्यक्ति और उसके संगी के बीच
  alternative: एक पुरुष और उसके पड़ोसी के बीच
  rationale: प्रसंग सामान्य न्यायिक मामलों का है; ‘व्यक्ति’ प्रतिनिधिक प्रयोग को स्वाभाविक हिन्दी में संप्रेषित करता है। पादटिप्पणी स्रोत की शाब्दिक पुल्लिंग एकवचन रचना सुरक्षित रखती है।
- issue: תּוֹרֹתָיו का कानूनी प्रसंग में अर्थ
  choice: उसकी शिक्षाएँ
  alternative: उसकी व्यवस्थाएँ
  rationale: न्यायिक प्रसंग कानूनी बल देता है, पर תּוֹרָה का अर्थ ‘शिक्षा/निर्देश’ अधिक व्यापक है। ‘शिक्षाएँ’ उस व्यापकता को बचाती है; वैकल्पिक कानूनी अर्थ पादटिप्पणी में दिया गया है।
- issue: בָּא אֵלַי का कर्ता
  choice: वह [मामला] मेरे पास आता है
  alternative: वे मेरे पास आते हैं
  rationale: मसोरेटिक पाठ में בָּא एकवचन है और דָּבָר से स्वाभाविक रूप से मेल खाता है। पक्षों के आने का अर्थ प्रसंग से संभव है, पर उसे मुख्य पाठ में रखकर व्याकरणिक एकवचन को बदलना आवश्यक नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण न्यायिक-शिक्षात्मक रजिस्टर अपनाया गया है। ‘विधियाँ’ और ‘शिक्षाएँ’ समानांतर इब्रानी पदों के बीच अर्थभेद बनाए रखते हैं। सभी पादटिप्पणी चिह्न मुख्य पाठ में क्रम से उपस्थित हैं।
