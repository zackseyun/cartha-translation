  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और स्वाभाविक कथन। संबोधन में ‘तुम’ पारिवारिक संवाद के अनुकूल है; वाक्य मूल के सीधे नकारात्मक मूल्यांकन को बनाए रखता है।
