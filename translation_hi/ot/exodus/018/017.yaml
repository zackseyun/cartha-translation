  text: וַ/יֹּ֛אמֶר חֹתֵ֥ן מֹשֶׁ֖ה אֵלָ֑י/ו לֹא טוֹב֙ הַ/דָּבָ֔ר אֲשֶׁ֥ר אַתָּ֖ה עֹשֶֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/017.yaml
  text: Moses' father-in-law said to him[a], “What you are doing is not good.”
translation:
  language: hi
  text: मूसा के ससुर ने उससे कहा, “तुम जो कर रहे हो, वह अच्छा नहीं है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ने...कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; स्वाभाविक हिन्दी में अलग से ‘और’ जोड़ना आवश्यक नहीं है।
- source_word: חֹתֵן מֹשֶׁה
  choice: मूसा के ससुर
  rationale: इब्रानी संबंधवाचक पदबंध का सीधा और स्वाभाविक हिन्दी रूप, जो पारिवारिक संबंध सुरक्षित रखता है।
- source_word: אֵלָיו
  choice: उससे
  rationale: सर्वनाम का संदर्भ मूसा है; ‘उससे कहा’ आधुनिक हिन्दी में स्वाभाविक वाक्य-विन्यास है।
- source_word: לֹא טוֹב
  choice: अच्छा नहीं है
  rationale: טוֹב के सामान्य मूल्यांकनात्मक अर्थ को बिना ‘उचित’ या ‘लाभदायक’ जैसी व्याख्यात्मक संकीर्णता के सुरक्षित रखता है।
- source_word: הַדָּבָר אֲשֶׁר אַתָּה עֹשֶׂה
  choice: तुम जो कर रहे हो
  rationale: शाब्दिक ‘वह बात/काम जिसे तुम कर रहे हो’ की अपेक्षा यह हिन्दी में स्वाभाविक है और चालू कार्य को व्यक्त करने वाले कृदन्त का भाव बनाए रखता है।
theological_decisions: []
