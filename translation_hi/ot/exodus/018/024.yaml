  text: So Moses listened to the voice of his father-in-law and did all that he said[a].
translation:
  language: hi
  text: तब मूसा ने अपने ससुर की बात मानी और जो कुछ उसने कहा था, वह सब किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁמַע ... לְקוֹל
  choice: की बात मानी
  rationale: שׁמע לְקוֹל एक इब्रानी मुहावरा है जिसका अर्थ किसी की बात सुनकर उसके अनुसार चलना है। हिंदी में ‘बात मानी’ श्रवण और आज्ञापालन—दोनों भावों को स्वाभाविक ढंग से व्यक्त करता है; अगला खंड उसके पालन को स्पष्ट करता है।
- source_word: חֹתְנוֹ
  choice: अपने ससुर
  rationale: संदर्भ में यह मूसा के ससुर यित्रो को सूचित करता है; आधुनिक हिंदी में यही स्पष्ट और सामान्य संबंध-सूचक शब्द है।
- source_word: וַיַּעַשׂ
  choice: किया
  rationale: עשה का सीधा अर्थ ‘करना’ है और संबंधित उपवाक्य के साथ ‘सब किया’ स्वाभाविक हिंदी है।
- source_word: כֹּל אֲשֶׁר אָמָר
  choice: जो कुछ उसने कहा था, वह सब
  rationale: यह मूल के ‘वह सब जो उसने कहा’ का अर्थ स्पष्ट और सहज हिंदी वाक्य-विन्यास में रखता है। ‘था’ पूर्वकथित निर्देशों को हिंदी में स्वाभाविक रूप से दर्शाता है।
