  register: आधुनिक, सहज और गरिमापूर्ण मानक हिंदी। ‘आवाज़ सुनी’ जैसे अत्यधिक शाब्दिक रूप के बजाय इब्रानी मुहावरे का स्वाभाविक हिंदी समतुल्य ‘बात मानी’ चुना गया है। सर्वनाम ‘उसने’ निकटतम पुरुषवाचक संज्ञा ‘ससुर’ की ओर संकेत करता है।
