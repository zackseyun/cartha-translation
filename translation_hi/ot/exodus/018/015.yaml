  yaml_path: translation/ot/exodus/018/015.yaml
  text: Moses said to his father-in-law[a], “Because the people come to me to seek God.”
translation:
  language: hi
  text: मूसा ने अपने ससुर से कहा, “इसलिए कि लोग परमेश्वर की खोज करने के लिए मेरे पास आते हैं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: कहा
  rationale: यह אמר के सामान्य कथात्मक रूप का स्वाभाविक हिन्दी अनुवाद है और मूसा के उत्तर का परिचय देता है।
- source_word: לְחֹתְנוֹ
  choice: अपने ससुर से
  rationale: इस प्रसंग में חֹתֵן से मूसा के ससुर यित्रो का संकेत है; ‘ससुर’ आधुनिक हिन्दी का स्पष्ट और स्वाभाविक संबंध-सूचक शब्द है।
- source_word: כִּי
  choice: इसलिए कि
  rationale: यह यित्रो के प्रश्न के उत्तर में मूसा के कार्य का कारण बताता है। ‘इसलिए कि’ हिन्दी में कारणसूचक बल को स्पष्ट रखता है।
- source_word: יָבֹא אֵלַי הָעָם
  choice: लोग ... मेरे पास आते हैं
  rationale: בוא + אֶל मूसा की ओर आने को व्यक्त करता है; प्रत्यक्ष कथन में आदतन वर्तमान क्रिया के लिए ‘आते हैं’ उपयुक्त है।
- source_word: לִדְרֹשׁ
  choice: खोज करने
  rationale: דרש का अर्थ खोज करना और परमेश्वर से पूछना या परामर्श लेना दोनों हो सकता है। मुख्य पाठ में व्यापक अर्थ रखा गया है और प्रसंगानुकूल विशिष्ट अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: इब्रानी पाठ में प्रत्यक्ष कर्म ‘परमेश्वर’ है; इसे केवल ‘परमेश्वर की इच्छा’ या ‘दैवी निर्णय’ बनाना मूल अभिव्यक्ति को अनावश्यक रूप से संकीर्ण कर देगा।
theological_decisions:
- issue: לִדְרֹשׁ אֱלֹהִים मुहावरे का अनुवाद
  choice: परमेश्वर की खोज करने
  alternative: परमेश्वर से पूछने; परमेश्वर से निर्णय जानने
  rationale: इब्रानी मुहावरा सामान्य रूप से परमेश्वर को खोजने तथा किसी विवाद में मार्गदर्शन या निर्णय के लिए उनसे पूछने—दोनों का भाव दे सकता है। मुख्य पाठ व्यापक शब्दावली को बनाए रखता है, जबकि न्यायिक प्रसंग की अधिक विशिष्ट संभावनाएँ पादटिप्पणी में सुरक्षित हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘परमेश्वर की खोज करना’ मूल इब्रानी की व्यापकता बनाए रखता है; पादटिप्पणी विवाद-निपटारे के प्रसंग में निहित परामर्श या निर्णय के अर्थ को स्पष्ट करती है।
