  yaml_path: translation/ot/exodus/018/009.yaml
  text: Jethro rejoiced over all the good that Yahweh had done for Israel[b][a], whom he had delivered from the hand of Egypt.
translation:
  language: hi
  text: यित्रो उस सारी भलाई के कारण आनन्दित हुआ[a] जो याहवे ने इस्राएल के लिए की थी, जिसे उसने मिस्र के हाथ से छुड़ाया था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस सारी भलाई पर प्रसन्न हुआ।” इब्रानी क्रिया प्रसन्न होने या आनन्द मनाने, दोनों का भाव दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “मिस्र के हाथ से”; अर्थात मिस्र की सत्ता से।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַדְּ
  choice: आनन्दित हुआ
  rationale: यह क्रिया प्रसन्न होने या आनन्द मनाने का भाव व्यक्त करती है। ‘आनन्दित हुआ’ प्रतिक्रिया की प्रबलता को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: יִתְרוֹ
  choice: यित्रो
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: עַל כָּל הַטּוֹבָה
  choice: उस सारी भलाई के कारण
  rationale: भावसूचक क्रिया के साथ עַל आनन्द के कारण या अवसर को दर्शाता है। הַטּוֹבָה सामूहिक एकवचन है, इसलिए ‘सारी भलाई’ उसके रूप और भाव दोनों को बनाए रखता है।
- source_word: עָשָׂה
  choice: की थी
  rationale: हिन्दी का पूर्ण भूतकाल बताता है कि यह भलाई यित्रो के आनन्दित होने से पहले की जा चुकी थी।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के व्यक्तिगत नाम का सुस्थापित लिप्यंतरण; इसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: לְיִשְׂרָאֵל
  choice: इस्राएल के लिए
  rationale: ל यहाँ लाभ या पक्ष में किए गए कार्य को दर्शाता है।
- source_word: אֲשֶׁר הִצִּילוֹ
  choice: कि उसने उसे छुड़ाया था
  rationale: संबंधवाचक אֲשֶׁר यहाँ पहले कही गई भलाई को स्पष्ट कर सकता है; एकवचन प्रत्यय सामूहिक रूप से इस्राएल की ओर संकेत करता है। यह संरचना उस संभावित व्याख्या को अनावश्यक रूप से नहीं मिटाती जिसमें खंड कारण या स्पष्टीकरण देता है।
- source_word: מִיַּד מִצְרָיִם
  choice: मिस्र के हाथ से
  rationale: मूल इब्रानी मुहावरे को बनाए रखता है; यहाँ ‘हाथ’ सत्ता या नियंत्रण का बोध देता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम है। हिन्दी पाठकों के लिए सुस्थापित रूप ‘यहोवा’ नाम को उपाधि से बदले बिना स्पष्ट रखता है; ‘याहवे’ अधिक प्रत्यक्ष विद्वत्तापरक लिप्यंतरण है।
- issue: אֲשֶׁר वाले अंतिम उपवाक्य का संबंध
  choice: 'पूर्ववर्ती भलाई का स्पष्टीकरण: ‘कि उसने उसे… छुड़ाया था’'
  alternative: 'इस्राएल से संबंधवाचक: ‘जिसे उसने… छुड़ाया था’'
  rationale: इब्रानी אֲשֶׁר दोनों प्रकार से समझा जा सकता है। हिन्दी में ‘कि’ उद्धार को उस भलाई की विषयवस्तु के रूप में स्वाभाविक ढंग से प्रस्तुत करता है, जबकि वैकल्पिक संबंध को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण। ‘सारी भलाई’, ‘आनन्दित हुआ’ और ‘छुड़ाया’ सामान्य पाठक के लिए स्पष्ट हैं। मूल मुहावरा ‘मिस्र के हाथ से’ मुख्य पाठ में रखा गया है और उसका अर्थ पादटिप्पणी में स्पष्ट किया गया है।
