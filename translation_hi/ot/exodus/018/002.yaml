  text: וַ/יִּקַּ֗ח יִתְרוֹ֙ חֹתֵ֣ן מֹשֶׁ֔ה אֶת צִפֹּרָ֖ה אֵ֣שֶׁת מֹשֶׁ֑ה אַחַ֖ר שִׁלּוּחֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/002.yaml
  text: Jethro[a], Moses’ father-in-law, took Zipporah, Moses’ wife, after he had sent her away.
translation:
  language: hi
  text: मूसा के ससुर यित्रो ने मूसा की पत्नी सिप्पोरा को अपने पास ले लिया, जब मूसा ने उसे विदा कर दिया था[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके विदा किए जाने के बाद।” इब्रानी में शाब्दिक रूप से “उसके विदा किए जाने के बाद” है; किसने उसे विदा किया, यह स्पष्ट नहीं किया गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקַּח
  choice: अपने साथ लिया
  rationale: לקח का मूल अर्थ ‘लेना’ है। यहाँ ‘अपने साथ लिया’ स्वाभाविक हिन्दी है और यह अनावश्यक रूप से तय नहीं करता कि यित्रो ने उसे केवल अपनी देखरेख में लिया या यात्रा में साथ लाया।
- source_word: חֹתֵן מֹשֶׁה
  choice: मूसा के ससुर
  rationale: חֹתֵן विवाह-संबंधी पुरुष रिश्तेदार को दर्शाता है; इस संदर्भ में यित्रो की पहचान मूसा के ससुर के रूप में है।
- source_word: צִפֹּרָה
  choice: सिप्पोरा
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण अपनाया गया है।
- source_word: אֵשֶׁת מֹשֶׁה
  choice: मूसा की पत्नी
  rationale: इब्रानी संबंधवाचक पदबंध का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: אַחַר
  choice: पहले … था
  rationale: हिन्दी वाक्य-संरचना में पूर्वकालिक क्रिया द्वारा ‘इसके बाद’ का काल-संबंध स्वाभाविक ढंग से व्यक्त होता है।
- source_word: שִׁלּוּחֶיהָ
  choice: जिसे मूसा ने पहले विदा कर दिया था
  rationale: शब्दशः अर्थ ‘उसका भेजा/विदा किया जाना’ है। संदर्भ के आधार पर मूसा को संभावित कर्ता मानते हुए मुहावरेदार हिन्दी दी गई है; ‘विदा करना’ अनावश्यक रूप से परित्याग या तलाक का अर्थ नहीं थोपता।
theological_decisions:
- issue: ‘उसके भेजे जाने के बाद’ में निहित कर्ता
  choice: 'मुख्य पाठ में मूसा को निहित कर्ता माना गया: ‘जिसे मूसा ने पहले विदा कर दिया था।’'
  alternative: ‘उसके विदा किए जाने के बाद,’ जिसमें कर्ता अनिर्दिष्ट रहता है।
  rationale: इब्रानी में क्रियावाचक संज्ञा और स्त्रीलिंग प्रत्यय है, पर कर्ता स्पष्ट नहीं है। निकट संदर्भ में मूसा सबसे स्वाभाविक निहित कर्ता है, फिर भी स्रोत की वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘अपने साथ लिया’ לקח की व्यापकता बनाए रखता है, और ‘विदा कर दिया’ ऐसा तटस्थ प्रयोग है जो पाठ से अधिक कठोर वैवाहिक निष्कर्ष नहीं निकालता।
