source:
  edition: WLC
  text: אִ֣ם אֶת הַ/דָּבָ֤ר הַ/זֶּה֙ תַּעֲשֶׂ֔ה וְ/צִוְּ/ךָ֣ אֱלֹהִ֔ים וְ/יָֽכָלְתָּ֖ עֲמֹ֑ד וְ/גַם֙ כָּל הָ/עָ֣ם הַ/זֶּ֔ה עַל מְקֹמ֖/וֹ יָבֹ֥א בְ/שָׁלֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/023.yaml
  text: If you do this thing[a], and God so commands you, then you will be able to endure[d][c][b], and all this people also will go to their place in peace.
translation:
  language: hi
  text: यदि तुम यह काम[a] करो, और परमेश्वर तुम्हें ऐसा करने की आज्ञा दे, तो तुम टिके रह सकोगे[b], और ये सब लोग भी शान्ति से अपने-अपने स्थान पर पहुँचेंगे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यह बात” अथवा “यह योजना”।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ “खड़े रह सकोगे”; यहाँ भाव है कि मूसा इस भार के नीचे टिका रह सकेगा और अपना दायित्व निभाता रहेगा।
    reason: lexical_alternative
  - marker: c
    text: 'शाब्दिक रूप में सामूहिक एकवचन है: “यह सारी प्रजा भी शान्ति से अपने स्थान पर आएगी।” भाव प्रत्येक व्यक्ति के अपने उचित स्थान पर सकुशल पहुँचने का है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: यदि
  rationale: यह शर्त प्रस्तुत करता है; आधुनिक मानक हिन्दी में ‘यदि’ स्वाभाविक और गरिमापूर्ण है।
- source_word: אֶת־הַדָּבָר הַזֶּה
  choice: यह काम
  rationale: דָּבָר यहाँ अभी बताए गए उपाय या कार्य का संकेत करता है। ‘यह काम’ सन्दर्भ में सहज है, जबकि ‘यह बात’ और ‘यह योजना’ भी सम्भव हैं।
- source_word: תַּעֲשֶׂה
  choice: तुम ... करो
  rationale: עשה की सामान्य क्रियात्मकता और शर्तसूचक वाक्य को सीधे व्यक्त करता है।
- source_word: וְצִוְּךָ אֱלֹהִים
  choice: और परमेश्वर तुम्हें ऐसा करने की आज्ञा दे
  rationale: צוה का मूल अर्थ ‘आज्ञा देना’ है। ‘ऐसा करने की’ जोड़ने से हिन्दी में कर्म स्पष्ट होता है और परमेश्वर की आज्ञा को दूसरी आवश्यक शर्त के रूप में रखा जाता है।
- source_word: וְיָכָלְתָּ עֲמֹד
  choice: तो तुम टिके रह सकोगे
  rationale: יכל क्षमता और עמד मूलतः खड़े रहने को व्यक्त करता है; इस सन्दर्भ में ‘टिके रहना’ मूसा के भार के नीचे स्थिर और समर्थ बने रहने का स्वाभाविक हिन्दी रूप है।
- source_word: וְגַם כָּל־הָעָם הַזֶּה
  choice: और ये सब लोग भी
  rationale: हिब्रू के योगात्मक וְגַם को ‘भी’ से और सामूहिक עָם को स्वाभाविक हिन्दी बहुवचन ‘लोग’ से व्यक्त किया गया है।
- source_word: עַל־מְקֹמוֹ יָבֹא
  choice: अपने-अपने स्थान पर पहुँचेंगे
  rationale: हिब्रू में सामूहिक एकवचन के साथ ‘उसके स्थान’ और ‘आएगा’ है। हिन्दी में ‘अपने-अपने’ उसका वितरणात्मक भाव और ‘पहुँचेंगे’ בוא की गन्तव्य-प्राप्ति को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְשָׁלוֹם
  choice: शान्ति से
  rationale: שָׁלוֹם में शान्ति, कुशल और सकुशल परिणाम का व्यापक भाव है; ‘शान्ति से’ इसे संक्षेप और स्वाभाविकता से रखता है।
theological_decisions:
- issue: यित्रो की सलाह और परमेश्वर की आज्ञा के बीच शर्तसूचक सम्बन्ध
  choice: ‘यदि तुम ... करो, और परमेश्वर ... आज्ञा दे’—दोनों को संयुक्त शर्त के रूप में रखा गया है।
  alternative: ‘और परमेश्वर तुम्हें आज्ञा देगा’ या ‘परमेश्वर तुम्हें आज्ञा दे’ को केवल कामना के रूप में पढ़ना।
  rationale: वाक्यरचना सबसे स्वाभाविक रूप से परमेश्वर की आज्ञा को यित्रो की सलाह लागू करने की अतिरिक्त शर्त बनाती है; इससे यित्रो की सलाह को स्वतंत्र ईश्वरीय प्राधिकार नहीं दिया जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किन्तु गरिमापूर्ण। ‘टिके रह सकोगे’ ने मूल ‘खड़े रहना’ की छवि और सन्दर्भगत सहन-क्षमता दोनों को सँभाला है। ‘अपने-अपने स्थान’ सामूहिक एकवचन के वितरणात्मक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
