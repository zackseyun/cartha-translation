  text: וַ/יְסַפֵּ֤ר מֹשֶׁה֙ לְ/חֹ֣תְנ֔/וֹ אֵת֩ כָּל אֲשֶׁ֨ר עָשָׂ֤ה יְהוָה֙ לְ/פַרְעֹ֣ה וּ/לְ/מִצְרַ֔יִם עַ֖ל אוֹדֹ֣ת יִשְׂרָאֵ֑ל אֵ֤ת כָּל הַ/תְּלָאָה֙ אֲשֶׁ֣ר מְצָאָ֣תַ/ם בַּ/דֶּ֔רֶךְ וַ/יַּצִּלֵ֖/ם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/008.yaml
  text: Moses told his father-in-law all that Yahweh had done to Pharaoh and to Egypt for Israel’s sake[a], all the hardship that had come upon them on the way[b], and how Yahweh had delivered them.
translation:
  language: hi
  text: मूसा ने अपने ससुर को वह सब बताया जो याहवे ने इस्राएल के कारण[a] फ़िरौन और मिस्र के विरुद्ध किया था, उस सारी विपत्ति के बारे में भी जो मार्ग में उन पर आ पड़ी थी[b], और यह भी कि याहवे ने उन्हें कैसे छुड़ाया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस्राएल की खातिर” अथवा “इस्राएल के कारण।”
    reason: lexical_alternative
  - marker: b
    text: या “मार्ग में उन पर आई सारी परेशानी” अथवा “सारी विपत्ति।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: बताया
  rationale: पिएल रूप यहाँ घटनाओं का वर्णन करने या उन्हें विस्तार से सुनाने का भाव देता है; ‘बताया’ सहज आधुनिक हिन्दी है।
- source_word: חֹתְנוֹ
  choice: अपने ससुर को
  rationale: इस प्रसंग में यह शब्द मूसा के ससुर यित्रो के लिए प्रयुक्त है।
- source_word: אֵת כָּל אֲשֶׁר עָשָׂה יְהוָה לְפַרְעֹה וּלְמִצְרַיִם
  choice: वह सब जो यहोवा ने फ़िरौन और मिस्र के साथ किया था
  rationale: लामेद को ‘के साथ’ द्वारा व्यक्त करने से मूल की व्यापकता बनी रहती है और ‘विरुद्ध’ जैसी अधिक व्याख्यात्मक दिशा नहीं थोपी जाती।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: עַל אֹדוֹת יִשְׂרָאֵל
  choice: इस्राएल के कारण
  rationale: यह पद कारण अथवा इस्राएल के हित से संबंधित होने का भाव दे सकता है; ‘के कारण’ मूल की कारणात्मक व्यापकता रखता है।
- source_word: הַתְּלָאָה
  choice: कठिनाइयाँ
  rationale: यह संज्ञा कष्ट, परेशानी और विपत्ति का सामूहिक भाव रखती है; हिन्दी में बहुवचन प्रसंग के अनेक यात्रा-कष्टों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מְצָאָתַם
  choice: उन पर आ पड़ी थीं
  rationale: मूलतः कठिनाई के उन्हें ‘पा लेने’ की सजीव अभिव्यक्ति है; ‘आ पड़ी थीं’ हिन्दी में उसी आकस्मिक संकट को स्वाभाविक ढंग से दर्शाता है।
- source_word: בַּדֶּרֶךְ
  choice: मार्ग में
  rationale: यह मिस्र से निकलने के बाद की यात्रा को संकेत करता है; ‘मार्ग में’ संक्षिप्त और गरिमापूर्ण है।
- source_word: וַיַּצִּלֵם
  choice: उन्हें कैसे छुड़ाया था
  rationale: नצל संकट से बचाने या छुड़ाने को व्यक्त करता है; ‘छुड़ाया’ इस ऐतिहासिक उद्धार के संदर्भ में स्पष्ट है और अनावश्यक पारिभाषिक अर्थ नहीं जोड़ता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम है। हिन्दी पाठकों में परिचित ‘यहोवा’ नाम को रखा गया है; इसे ‘प्रभु’ जैसी उपाधि से नहीं बदला गया।
- issue: עַל אֹדוֹת יִשְׂרָאֵל में कारण और हित का संबंध
  choice: इस्राएल के कारण
  alternative: इस्राएल की खातिर
  rationale: इब्रानी पद कारण अथवा इस्राएल के हित—दोनों की छाया रख सकता है। मुख्य पाठ कारणात्मक रूप रखता है और पादटिप्पणी हितार्थ विकल्प बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण कथात्मक शैली रखी गई है। ‘फ़िरौन’ और ‘इस्राएल’ प्रचलित बाइबलीय रूप हैं। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
