base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/003.yaml
  text: And I appeared to Abraham[a], to Isaac, and to Jacob as God Almighty, but by my name, Yahweh[b], I was not known to them.
translation:
  language: hi
  text: और मैं अब्राहम, इसहाक और याकूब को सर्वशक्तिमान परमेश्वर[a] के रूप में दिखाई दिया, पर अपने नाम यहवे[b] से मैं उन्हें ज्ञात नहीं हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: एल शद्दाय; परंपरागत अनुवाद ‘सर्वशक्तिमान परमेश्वर।’'
    reason: lexical_alternative
  - marker: b
    text: 'इसका अनुवाद यह भी हो सकता है: ‘मैंने अपने नाम यहवे से अपने आपको उन्हें प्रकट नहीं किया।’ संभव है कि इब्रानी का आशय केवल इस नाम से अनभिज्ञ होना नहीं, बल्कि उसके पूरे वाचा-संबंधी महत्त्व को अभी तक अनुभव से न जानना हो।'
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֵרָא
  choice: मैं ... दिखाई दिया
  rationale: ראה के निफ़अल प्रथम पुरुष एकवचन का सीधा अर्थ ‘मैं दिखाई दिया’ है; यह कुलपिताओं के सामने ईश्वरीय दर्शन के प्रसंग के अनुकूल है।
- source_word: אֶל ... אֶל ... וְאֶל
  choice: अब्राहम, इसहाक और याकूब को
  rationale: हिन्दी में ‘को’ को हर नाम के साथ दोहराना आवश्यक नहीं; संयुक्त सूची स्वाभाविक रहते हुए तीनों व्यक्तियों को समान रूप से क्रिया से जोड़ती है।
- source_word: בְּאֵל שַׁדָּי
  choice: सर्वशक्तिमान परमेश्वर के रूप में
  rationale: यहाँ בְּ नाम अथवा स्वरूप के अर्थ में ‘के रूप में’ है। אֵל שַׁדָּי का प्रचलित, अर्थपूर्ण हिन्दी अनुवाद ‘सर्वशक्तिमान परमेश्वर’ रखा गया है।
- source_word: וּשְׁמִי יְהוָה
  choice: पर अपने नाम यहवे से
  rationale: וּ यहाँ विरोध दर्शाता है। ‘अपने नाम ... से’ इब्रानी रचना और पहले खंड के ‘के रूप में’ के साथ निहित विरोध को बनाए रखता है; יְהוָה को व्यक्तिगत नाम ‘यहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: לֹא נוֹדַעְתִּי לָהֶם
  choice: मैं उन पर प्रकट नहीं हुआ
  rationale: ידע का निफ़अल यहाँ आत्मप्रकाशन का भाव दे सकता है। ‘उन पर प्रकट नहीं हुआ’ स्वाभाविक हिन्दी है और ‘मैंने अपने आपको नहीं जानने दिया’ जैसी बोझिल अभिव्यक्ति से बचते हुए वाक्य को नाम के माध्यम से आत्मप्रकाशन से जोड़ता है।
theological_decisions:
- issue: कुलपिताओं को यहवे नाम ज्ञात न होने वाले कथन का आशय
  choice: मुख्य पाठ में ‘अपने नाम यहवे से मैं उन पर प्रकट नहीं हुआ’ रखा गया है।
  alternative: ‘अपने नाम यहवे से मैंने अपने आपको उन पर प्रकट नहीं किया’ अथवा अधिक शाब्दिक ‘मैं उन्हें ज्ञात नहीं हुआ।’
  rationale: इब्रानी निफ़अल को आत्मप्रकाशन के अर्थ में समझा जा सकता है। यह अनुवाद इस तनाव को बनाए रखता है कि उत्पत्ति में कुलपिताओं के प्रसंगों में यह नाम मिलता है; अतः कथन केवल नाम की ध्वनि से अनभिज्ञता के बजाय उसके पूर्ण वाचागत अथवा अनुभवात्मक महत्त्व के प्रकाशन की ओर संकेत कर सकता है, पर मुख्य पाठ उस व्याख्या को स्पष्ट सिद्धांत के रूप में नहीं थोपता।
- issue: ईश्वरीय नाम יְהוָה का निरूपण
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: व्यक्तिगत ईश्वरीय नाम को उपाधि से बदलने के बजाय आधुनिक विद्वत् पुनर्निर्माण के निकट हिन्दी लिप्यंतरण ‘यहवे’ दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली रखी गई है। ‘सर्वशक्तिमान परमेश्वर’ सामान्य पाठक के लिए परिचित है, जबकि ‘यहवे’ व्यक्तिगत नाम को स्पष्ट रखता है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में संबद्ध पदों के बाद दिए गए हैं।
