  text: וַ/יְדַבֵּ֣ר יְהוָה֮ אֶל מֹשֶׁ֣ה וְ/אֶֽל אַהֲרֹן֒ וַ/יְצַוֵּ/ם֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אֶל פַּרְעֹ֖ה מֶ֣לֶךְ מִצְרָ֑יִם לְ/הוֹצִ֥יא אֶת בְּנֵֽי יִשְׂרָאֵ֖ל מֵ/אֶ֥רֶץ מִצְרָֽיִם־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/013.yaml
  text: Then Yahweh spoke to Moses and to Aaron[a], and he commanded them concerning the sons of Israel and concerning Pharaoh king of Egypt[b], to bring the sons of Israel out from the land of Egypt.
translation:
  language: hi
  text: तब याहवे ने मूसा और हारून से बात की और उन्हें इस्राएलियों तथा मिस्र के राजा फ़िरौन के विषय में आज्ञा दी[a] कि वे इस्राएलियों को मिस्र के देश से बाहर निकालें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, इब्रानी में ‘इस्राएलियों तथा मिस्र के राजा फ़िरौन को’ भी समझा जा सकता है। इब्रानी पूर्वसर्ग का अर्थ आज्ञा के प्राप्तकर्ताओं के लिए ‘को’ हो सकता है; पर प्रसंग में अधिक संभव है कि मूसा और हारून को दी गई आज्ञा इस्राएलियों और फ़िरौन—दोनों से संबंधित थी।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: तब ... कहा
  rationale: वाव-क्रमवाचक कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में इसकी क्रमिकता व्यक्त करता है। דבר के लिए ‘कहा’ सामान्य और सहज है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबलीय प्रयोग में प्रचलित रूप रखते हुए परमेश्वर के व्यक्तिगत नाम को उपाधि से नहीं बदला गया।
- source_word: וַיְצַוֵּם
  choice: और उन्हें ... आज्ञा दी
  rationale: צוה की अधिकारपूर्ण आज्ञा का भाव सुरक्षित है; प्रत्यय ‘उन्हें’ मूसा और हारून की ओर संकेत करता है।
- source_word: אֶל בְּנֵי יִשְׂרָאֵל וְאֶל פַּרְעֹה
  choice: इस्राएलियों तथा ... फ़िरौन के विषय में
  rationale: צוה के बाद אֶל को यहाँ आज्ञा के विषय अथवा संबंधित पक्ष के रूप में लेना प्रसंग के अनुकूल है, क्योंकि आज्ञा मूसा और हारून को दी गई है; फिर भी वैकल्पिक व्याकरणिक समझ पादटिप्पणी में रखी गई है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएली
  rationale: शाब्दिक ‘इस्राएल के पुत्र’ यहाँ पूरे जातीय समुदाय का रूढ़ नाम है; ‘इस्राएली’ आधुनिक हिन्दी में स्वाभाविक और अर्थ-सटीक सामूहिक पद है।
- source_word: לְהוֹצִיא
  choice: बाहर निकालें
  rationale: יצא का हिफ़ील रूप कारणवाचक है—‘बाहर ले आना/निकालना’; बहुवचन क्रिया मूसा और हारून को सौंपे गए कार्य को स्पष्ट करती है।
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: मिस्र देश से
  rationale: אֶרֶץ के ठोस भौगोलिक अर्थ को ‘देश’ द्वारा सुरक्षित रखा गया है।
theological_decisions:
- issue: יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: व्यक्तिगत ईश्वरीय नाम को शीर्षक ‘प्रभु’ से प्रतिस्थापित नहीं किया गया; ‘यहोवा’ हिन्दी पाठकों में व्यापक रूप से पहचाना जाने वाला नामरूप है।
- issue: אֶל पदबंधों का संबंध
  choice: आज्ञा इस्राएल और फ़िरौन के विषय में थी
  alternative: आज्ञा सीधे इस्राएलियों और फ़िरौन को दी गई
  rationale: प्रसंग और וַיְצַוֵּם के कर्म-प्रत्यय से मूसा और हारून आज्ञा के प्रत्यक्ष प्राप्तकर्ता जान पड़ते हैं। फिर भी इब्रानी पूर्वसर्ग का दूसरा अर्थ संभव है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
- issue: בְּנֵי יִשְׂרָאֵל का सामूहिक अर्थ
  choice: इस्राएली
  alternative: इस्राएल के पुत्र
  rationale: यह पद पूरे इस्राएली समुदाय का जातीय नाम है; ‘इस्राएली’ उसके प्रतिनिधिक सामूहिक अर्थ को बिना अनावश्यक लैंगिक संकुचन के व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज कथात्मक शैली रखी गई है। ‘इस्राएली’ रूढ़ जातीय नाम के रूप में स्वाभाविक है, जबकि मूल की व्याकरणिक अस्पष्टता पादटिप्पणी में सुरक्षित है।
