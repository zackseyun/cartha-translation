base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/025.yaml
  text: And Eleazar son of Aaron took for himself a wife from the daughters of Putiel[a], and she bore him Phinehas[b]. These are the heads of the fathers’ houses of the Levites by their clans.
translation:
  language: hi
  text: और हारून के पुत्र एलीआज़र ने पूतीएल की बेटियों में से अपनी पत्नी ली[a], और उसने उसके लिए पीनहास को जन्म दिया। ये अपने-अपने कुलों के अनुसार लेवियों के पितृकुलों के मुखिया हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पूतीएल की बेटियों में से एक।” इब्रानी अभिव्यक्ति पूतीएल के परिवार में विवाह का संकेत देती है, पर यह नहीं बताती कि वह कौन-सी बेटी थी।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “पिताओं के मुखिया।” यह लेवीय कुलों के भीतर प्रमुख पैतृक घरानों के अगुओं के लिए प्रयुक्त वंश-संबंधी पद है।
    reason: cultural_note
lexical_decisions:
- source_word: לָקַח לוֹ ... לְאִשָּׁה
  choice: अपनी पत्नी बनाया
  rationale: यह स्वाभाविक आधुनिक हिन्दी में इब्रानी विवाह-संबंधी मुहावरे का अर्थ व्यक्त करता है और केवल सामान्य ‘विवाह किया’ की अपेक्षा वाक्य की संरचना को कुछ अधिक सुरक्षित रखता है।
- source_word: מִבְּנוֹת פּוּטִיאֵל
  choice: पूतीएल की बेटियों में से एक
  rationale: מִן समूह में से चयन या संबंध दर्शाता है। हिन्दी में बहुवचन ‘बेटियों में से’ अकेला अस्वाभाविक होता, इसलिए निहित एक स्त्री को स्पष्ट किया गया है; टिप्पणी में शाब्दिक रूप सुरक्षित है।
- source_word: וַתֵּלֶד לוֹ אֶת־פִּינְחָס
  choice: और उसने उसके लिए पीनहास को जन्म दिया
  rationale: स्त्रीलिंग एकवचन क्रिया पत्नी को कर्ता बताती है, और ‘उसके लिए’ इब्रानी दत्तिवाचक לוֹ को सुरक्षित रखता है।
- source_word: רָאשֵׁי אֲבוֹת
  choice: पितृकुलों के मुखिया
  rationale: यह केवल जैविक पिताओं के मुखियों की बात नहीं, बल्कि पूर्वज-आधारित घरानों के अगुओं के लिए प्रयुक्त वंशावली-सामाजिक पद है।
- source_word: הַלְוִיִּם
  choice: लेवियों
  rationale: यह लेवी के वंशज जनसमूह के लिए मानक हिन्दी बाइबलीय पद है।
- source_word: לְמִשְׁפְּחֹתָם
  choice: अपने-अपने कुलों के अनुसार
  rationale: वंशावली के संदर्भ में מִשְׁפָּחָה विस्तृत पारिवारिक या कुल-समूह को दर्शाता है; यह हिन्दी में स्वाभाविक और सामाजिक रूप से सटीक है।
- source_word: אֶלְעָזָר / אַהֲרֹן / פּוּטִיאֵל / פִּינְחָס
  choice: एलीआज़र / हारून / पूतीएल / पीनहास
  rationale: व्यक्तिवाचक नामों को प्रचलित हिन्दी बाइबलीय रूपों में लिप्यंतरित किया गया है।
theological_decisions:
- issue: वंशावली-सूत्र רָאשֵׁי אֲבוֹת का आशय
  choice: पितृकुलों के मुखिया
  alternative: पूर्वजों के घरानों के प्रधान / पिताओं के मुखिया
  rationale: चुना हुआ रूप इब्रानी की पितृवंशीय सामाजिक संरचना को व्यक्त करता है, पर इसे केवल व्यक्तिगत पिताओं तक सीमित नहीं करता। इसका कोई संप्रदायगत अर्थ नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘पत्नी बनाया’ मूल विवाह-मुहावरे को सहज हिन्दी में व्यक्त करता है। ‘पितृकुल’ तकनीकी वंशावली अर्थ को संक्षेप में सुरक्षित रखता है; दोनों टिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
