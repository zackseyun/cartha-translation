source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר מֹשֶׁ֖ה לִ/פְנֵ֣י יְהוָ֑ה הֵ֤ן אֲנִי֙ עֲרַ֣ל שְׂפָתַ֔יִם וְ/אֵ֕יךְ יִשְׁמַ֥ע אֵלַ֖/י פַּרְעֹֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/030.yaml
  text: But Moses said before the LORD, “Look, I am uncircumcised of lips; so how will Pharaoh listen to me?”
translation:
  language: hi
  text: पर मूसा ने यहोवा के सामने कहा, “देखिए, मैं तो खतनारहित होंठों वाला हूँ; फिर फ़िरौन मेरी बात कैसे सुनेगा?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִפְנֵי יְהוָה
  choice: यहोवा के सामने
  rationale: לִפְנֵי का स्थान-संबंधी/उपस्थिति-संबंधी भाव सीधे रखा गया है और יהוה को हिन्दी में प्रचलित नाम-रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: הֵן
  choice: देखिए
  rationale: यह ध्यान आकर्षित करने वाला उद्गार है; परमेश्वर को संबोधन होने के कारण हिन्दी में आदरसूचक रूप स्वाभाविक और गरिमापूर्ण है।
- source_word: עֲרַל שְׂפָתַיִם
  choice: खतनारहित होंठों वाला
  rationale: मूल का असामान्य और अर्थगर्भित रूपक बनाए रखा गया है; इसे केवल ‘ठीक से बोल नहीं पाता’ कहकर व्याख्यात्मक रूप से सीमित नहीं किया गया।
- source_word: יִשְׁמַע אֵלַי
  choice: मेरी बात सुनेगा
  rationale: ‘मेरी ओर सुनेगा’ के शाब्दिक ढाँचे को स्वाभाविक हिन्दी में रखा गया है, जबकि ‘सुनना’ में ध्यान देने या मानने की संभावित अर्थ-छाया बनी रहती है।
theological_decisions:
- issue: मूसा की ‘खतनारहित होंठों’ वाली आत्म-वर्णना का अर्थ
  choice: रूपक को ज्यों का त्यों बनाए रखना
  alternative: ‘मैं ठीक से बोल नहीं पाता’ या ‘मैं बोलने में अयोग्य हूँ’
  rationale: मूल इब्रानी अभिव्यक्ति अस्पष्ट और तीखी है; उसे किसी एक शारीरिक, वाक्-संबंधी या धार्मिक व्याख्या में बदलना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण संवादात्मक रूप। ‘खतनारहित होंठों वाला’ जानबूझकर असामान्य रखा गया है क्योंकि मूल रूपक भी असामान्य है।
