  text: God spoke to Moses and said to him[a], “I am Yahweh.”
translation:
  language: hi
  text: परमेश्वर ने मूसा को संबोधित किया और उससे कहा, “मैं याहवे[a] हूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में दिव्य नाम יהוה (YHWH) है; इसका मूल उच्चारण निश्चित नहीं है। इसे ‘यहोवा’ भी लिप्यंतरित किया जाता है।
    reason: दिव्य नाम के इब्रानी व्यंजनात्मक रूप, उच्चारण की अनिश्चितता, और वैकल्पिक हिन्दी लिप्यंतरण को स्पष्ट करना।
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: बात की
  rationale: दिव्य वाणी का परिचय देने वाली सामान्य इब्रानी कथात्मक क्रिया है। ‘बात की’ आधुनिक हिन्दी में स्वाभाविक है और इसके बाद आने वाली וַיֹּאמֶר (‘कहा’) से भेद भी बनाए रखती है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: यहाँ क्रिया एकवचन है और शब्द इस्राएल के परमेश्वर को सूचित करता है; ‘परमेश्वर’ मानक, गरिमापूर्ण हिन्दी रूप है।
- source_word: אֶל־מֹשֶׁה
  choice: मूसा से
  rationale: बोलने के प्रसंग में אֶל को हिन्दी मुहावरे के अनुसार ‘से’ कहना स्वाभाविक है; מֹשֶׁה का प्रचलित हिन्दी रूप ‘मूसा’ है।
- source_word: וַיֹּאמֶר אֵלָיו
  choice: और उससे कहा
  rationale: אמר का सीधा अर्थ ‘कहा’ है और אֵלָיו का पुल्लिंग एकवचन प्रत्यय मूसा की ओर संकेत करता है। ‘उससे’ अनावश्यक पुनरावृत्ति से बचते हुए संबंध स्पष्ट रखता है।
- source_word: אֲנִי
  choice: मैं … हूँ
  rationale: इब्रानी नामवाची वाक्य में वर्तमानकालीन संयोजक क्रिया व्यक्त नहीं होती; हिन्दी में स्वाभाविक आत्म-परिचय के लिए ‘हूँ’ आवश्यक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार-अक्षरीय दिव्य नाम को किसी उपाधि से बदलने के बजाय हिन्दी में उसके व्यापक विद्वत्तापरक उच्चारण का लिप्यंतरण किया गया है; मूल व्यंजनात्मक रूप और उच्चारण की अनिश्चितता पादटिप्पणी में दी गई है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम है, इसलिए उसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया। ‘याहवे’ संभावित प्राचीन उच्चारण का सामान्य विद्वत्तापरक लिप्यंतरण है; क्योंकि मूल व्यंजनात्मक पाठ से उच्चारण पूर्णतः निश्चित नहीं है, पादटिप्पणी इस तथ्य को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, सहज और गरिमापूर्ण कथात्मक शैली रखी गई है। इब्रानी की दोनों वाणी-सूचक क्रियाओं को ‘बात की’ और ‘कहा’ के रूप में बनाए रखा गया है।
