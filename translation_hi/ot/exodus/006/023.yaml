base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/023.yaml
  text: Aaron took Elisheba, the daughter of Amminadab and sister of Nahshon, as his wife, and she bore him Nadab, Abihu, Eleazar, and Ithamar.
translation:
  language: hi
  text: हारून ने अम्मीनादाब की बेटी और नहशोन की बहन एलीशेबा को अपनी पत्नी के रूप में लिया, और उसने हारून के लिए नादाब, अबीहू, एलिआज़र और ईतामार को जन्म दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח ... לוֹ לְאִשָּׁה
  choice: अपनी पत्नी बनाया
  rationale: शाब्दिक अर्थ ‘अपने लिए पत्नी के रूप में लिया’ है; आधुनिक हिन्दी में ‘अपनी पत्नी बनाया’ विवाह-संबंध को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֱלִישֶׁבַע
  choice: एलीशेबा
  rationale: नाम का लिप्यंतरण इब्रानी उच्चारण के निकट रखा गया है।
- source_word: בַּת עַמִּינָדָב
  choice: अम्मीनादाब की बेटी
  rationale: रचना प्रत्यक्ष पिता-पुत्री संबंध बताती है; हिन्दी में संबंधसूचक ‘की’ स्वाभाविक है।
- source_word: אֲחוֹת נַחְשׁוֹן
  choice: नहशोन की बहन
  rationale: मूल पाठ में एलीशेबा और नहशोन का भाई-बहन संबंध स्पष्ट है।
- source_word: וַתֵּלֶד לוֹ
  choice: उसने हारून के लिए ... को जन्म दिया
  rationale: इब्रानी में स्त्रीलिंग कर्ता पिछले वाक्य की एलीशेबा है और अप्रत्यक्ष कर्म ‘उसके लिए’ हारून को सूचित करता है; नाम दोहराने से हिन्दी में सर्वनाम-संदर्भ स्पष्ट रहता है।
- source_word: נָדָב
  choice: नादाब
  rationale: इब्रानी नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: אֲבִיהוּא
  choice: अबीहू
  rationale: इब्रानी नाम का ध्वन्यात्मक हिन्दी लिप्यंतरण।
- source_word: אֶלְעָזָר
  choice: एलिआज़र
  rationale: इब्रानी नाम के व्यंजन और स्वर-रूप को हिन्दी में निकटता से प्रस्तुत किया गया है।
- source_word: אִיתָמָר
  choice: ईतामार
  rationale: इब्रानी नाम का ध्वन्यात्मक हिन्दी लिप्यंतरण।
theological_decisions: []
