  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। वंशावली-संबंधी विवरण ज्यों का त्यों सुरक्षित है; नामों को मूल इब्रानी के निकट देवनागरी में लिप्यंतरित किया गया है।
