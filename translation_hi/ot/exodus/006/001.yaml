source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה עַתָּ֣ה תִרְאֶ֔ה אֲשֶׁ֥ר אֶֽעֱשֶׂ֖ה לְ/פַרְעֹ֑ה כִּ֣י בְ/יָ֤ד חֲזָקָה֙ יְשַׁלְּחֵ֔/ם וּ/בְ/יָ֣ד חֲזָקָ֔ה יְגָרְשֵׁ֖/ם מֵ/אַרְצֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/001.yaml
  text: Then Yahweh said to Moses[a], “Now you will see what I will do to Pharaoh, for by a strong hand he will let them go, and by a strong hand he will drive them out from his land.”
translation:
  language: hi
  text: तब याहवे ने मूसा से कहा, “अब तुम देखोगे कि मैं फ़िरौन के लिए क्या करूँगा, क्योंकि शक्तिशाली हाथ के कारण वह उन्हें जाने देगा, और शक्तिशाली हाथ के कारण वह उन्हें अपने देश से खदेड़ देगा।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मज़बूर होकर वह उन्हें जाने देगा, और मज़बूर होकर वह उन्हें अपने देश से खदेड़ देगा।” दोहराया गया “शक्तिशाली हाथ” उस प्रबल दबाव का संकेत हो सकता है जिसके कारण फ़िरौन ऐसा करेगा; इसके पीछे अन्ततः परमेश्वर की सामर्थ्य हो सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण से प्रस्तुत किया गया है।
- source_word: וַיֹּאמֶר
  choice: तब ... कहा
  rationale: वाव-क्रमसूचक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम स्वाभाविक रूप से व्यक्त करता है।
- source_word: עַתָּה תִרְאֶה
  choice: अब तुम देखोगे
  rationale: עַתָּה के कालगत बल और תִרְאֶה के निकट भविष्य के अर्थ को सीधे बनाए रखता है।
- source_word: אֲשֶׁר אֶעֱשֶׂה לְפַרְעֹה
  choice: कि मैं फ़िरौन के साथ क्या करूँगा
  rationale: לְ के संबंधसूचक विस्तार को स्वाभाविक हिन्दी ‘के साथ’ से व्यक्त किया गया है, बिना मुख्य पाठ में इसे स्पष्टतः ‘विरुद्ध’ ठहराए।
- source_word: בְיָד חֲזָקָה
  choice: बलवन्त हाथ के कारण
  rationale: दोनों बार एक ही रूप रखकर इब्रानी पुनरुक्ति और ‘हाथ’ का बिंब सुरक्षित है; ‘के कारण’ उस बाध्यकारी शक्ति की सम्भावना व्यक्त करता है जिसके फलस्वरूप फ़िरौन कार्य करेगा, पर शक्ति के कर्ता को अलग से नहीं जोड़ता।
- source_word: יְשַׁלְּחֵם
  choice: वह उन्हें जाने देगा
  rationale: निर्गमन के प्रसंग में שלח फ़िरौन द्वारा इस्राएल को मुक्त कर जाने देने को सूचित करता है।
- source_word: יְגָרְשֵׁם
  choice: वह उन्हें ... निकाल देगा
  rationale: גרש साधारण विदाई से अधिक बलपूर्वक निष्कासन बताता है; ‘निकाल देगा’ इस प्रगति को सहज हिन्दी में व्यक्त करता है।
- source_word: מֵאַרְצוֹ
  choice: अपने देश से
  rationale: प्रत्यावर्ती ‘अपने’ सर्वनाम को फ़िरौन से स्पष्टतः जोड़ता है और אֶרֶץ को इस राजनीतिक-भौगोलिक प्रसंग में स्वाभाविक हिन्दी देता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: व्यक्तिगत ईश्वरीय नाम को उपाधि से प्रतिस्थापित नहीं किया गया; ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में पहचाना जाने वाला लिप्यंतरण है।
- issue: בְיָד חֲזָקָה में ‘बलवन्त हाथ’ का संबंध
  choice: मुहावरे और उसकी पुनरावृत्ति को रखते हुए ‘बलवन्त हाथ के कारण’
  alternative: बलपूर्वक वह उन्हें जाने देगा; अपने शक्तिशाली हाथ से वह उन्हें जाने देगा
  rationale: इब्रानी में वाक्यांश फ़िरौन के दोनों कार्यों से जुड़ा है, पर व्यापक प्रसंग परमेश्वर की बाध्यकारी सामर्थ्य का संकेत देता है। मुख्य पाठ शक्ति के कर्ता को स्पष्टतः जोड़कर तनाव को समाप्त नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘बलवन्त हाथ’ कुछ बाइबलीय गरिमा बनाए रखते हुए मूल के יד (‘हाथ’) बिंब और दोहरी पुनरावृत्ति को सुरक्षित रखता है। मुख्य पाठ के [a] चिह्न को उद्धरण के बाद रखा गया है और उसी से संबंधित वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
