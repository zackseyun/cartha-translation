  text: 'And the sons of Izhar: Korah, Nepheg, and Zichri.'
translation:
  language: hi
  text: 'और यिसहार के पुत्र: कोरह, नेपेग और जिक्री।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: और ... के पुत्र
  rationale: בְּנֵי रचना-रूप में बहुवचन ‘पुत्र’ है; वंशावली में यहाँ तीन प्रत्यक्ष पुत्रों के नाम दिए गए हैं। आरंभिक ו को ‘और’ से व्यक्त किया गया है ताकि सूची की निरंतरता बनी रहे।
- source_word: יִצְהָר
  choice: यिसहार
  rationale: व्यक्तिवाचक नाम को हिन्दी बाइबलीय प्रयोग में पहचाने जाने योग्य रूप में लिप्यंतरित किया गया है; यह हिब्रू व्यंजन צ की ध्वनि को भी निकटता से दर्शाता है।
- source_word: קֹרַח
  choice: कोरह
  rationale: व्यक्तिवाचक नाम का प्रचलित और स्रोत-सन्निकट हिन्दी लिप्यंतरण।
- source_word: וָ/נֶפֶג
  choice: नेपेग
  rationale: नाम נֶפֶג का स्रोत-सन्निकट लिप्यंतरण; आरंभिक संयोजक ו सूची में ‘और’ के रूप में अंतिम नाम से पहले स्वाभाविक हिन्दी शैली में व्यक्त हुआ है।
- source_word: וְ/זִכְרִי
  choice: और जिक्री
  rationale: व्यक्तिवाचक नाम का लिप्यंतरण; ז को ‘ज’ और כ को ‘क’ से दर्शाया गया है, तथा prefixed ו को ‘और’ से व्यक्त किया गया है।
