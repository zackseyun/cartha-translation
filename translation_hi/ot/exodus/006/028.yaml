base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/028.yaml
  text: It happened on the day when Yahweh spoke to Moses in the land of Egypt—[a][b]
translation:
  language: hi
  text: और ऐसा हुआ[a] कि जिस दिन याहवे[b] मिस्र की भूमि में मूसा से बोला—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, अधिक शब्दशः: “और ऐसा हुआ, जिस दिन…”'
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी: “YHWH”; परंपरागत रूप से “प्रभु” अनुवाद किया जाता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: और जिस दिन
  rationale: वाक्यांश וַיְהִי בְּיוֹם यहाँ कथा को आगे बढ़ाते हुए अगले कथन की भूमिका बनाता है। हिंदी में “और जिस दिन” इस संयोजक तथा काल-संबंधी कार्य को स्वाभाविक रूप से व्यक्त करता है; अधिक शब्दशः रूप पादटिप्पणी में दिया गया है।
- source_word: בְּיוֹם
  choice: जिस दिन
  rationale: शाब्दिक अर्थ “उस दिन/दिन में” है, पर इसके बाद आए उपवाक्य के साथ हिंदी में “जिस दिन” सहज और अर्थनिष्ठ है।
- source_word: דִּבֶּר ... אֶל־מֹשֶׁה
  choice: मूसा से बात की
  rationale: דבר אל का अर्थ किसी से बोलना या बात करना है। “मूसा से बात की” आधुनिक हिंदी में स्वाभाविक है और संबोधन का संबंध स्पष्ट रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय परमेश्वर-नाम YHWH का लिप्यंतरण “याहवे” किया गया है, ताकि मूल में प्रयुक्त व्यक्तिगत नाम बना रहे।
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: मिस्र देश में
  rationale: मूल में אֶרֶץ (“देश/भूमि”) स्पष्ट रूप से उपस्थित है; “मिस्र देश में” इसे संक्षिप्त और स्वाभाविक हिंदी में सुरक्षित रखता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: मूल पाठ में उपाधि नहीं, बल्कि YHWH नाम है। “याहवे” उस नाम को प्रत्यक्ष रखता है; पारंपरिक प्रतिस्थापन “प्रभु” पादटिप्पणी में बताया गया है।
- issue: पद की अपूर्ण/भूमिकात्मक संरचना
  choice: अंत में दीर्घ विराम-चिह्न (—)
  alternative: वाक्य को स्वतंत्र पूर्ण कथन बनाना
  rationale: इब्रानी पद अगले पद में दोहराए और पूरे किए जाने वाले काल-सूचक उपवाक्य की भूमिका निभाता है। दीर्घ विराम इस साहित्यिक तनाव को बिना कृत्रिम रूप से पूरा किए बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। “और जिस दिन” कथा-संयोजन और अधूरी भूमिकात्मक संरचना दोनों को स्वाभाविक हिंदी में बनाए रखता है; अंत का दीर्घ विराम अगले पद से इसके घनिष्ठ संबंध को दर्शाता है।
