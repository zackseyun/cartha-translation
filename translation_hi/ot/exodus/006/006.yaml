  choice: इस्राएल के पुत्रों
  rationale: इब्रानी पारिवारिक अभिव्यक्ति का निकट रूप रखते हुए लक्षित समुदाय को दर्शाता है; अधिक सहज विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: אֲנִי יְהוָה
  choice: मैं यहोवा हूँ
  rationale: परमेश्वर के वाचा-संबंधी व्यक्तिगत नाम को लिप्यंतरित करके सुरक्षित रखता है।
- source_word: וְהוֹצֵאתִי ... מִתַּחַת סִבְלֹת מִצְרַיִם
  choice: मैं तुम्हें मिस्रियों के बोझों के नीचे से निकालूँगा
  rationale: कारक क्रिया और ‘नीचे से’ की ठोस छवि को बनाए रखता है; מִצְרַיִם को यहाँ उत्पीड़क लोगों के अर्थ में स्वाभाविक हिंदी बहुवचन से व्यक्त किया गया है।
- source_word: וְהִצַּלְתִּי
  choice: तुम्हें छुड़ाऊँगा
  rationale: खतरे और प्रभुत्व से बचाने के अर्थ को सामान्य आधुनिक हिंदी में व्यक्त करता है।
- source_word: מֵעֲבֹדָתָם
  choice: उनकी दासता से
  rationale: इस प्रसंग में עֲבֹדָה साधारण सेवा या काम नहीं, बल्कि मिस्रियों द्वारा थोपी गई बँधुआ सेवा है।
- source_word: וְגָאַלְתִּי
  choice: तुम्हें छुड़ा लूँगा
  rationale: גאל के मुक्त कराने और अपने अधिकार में वापस लेने के भाव को सहज हिंदी में व्यक्त करता है; पहले प्रयुक्त ‘छुड़ाऊँगा’ से ‘छुड़ा लूँगा’ क्रम में पूर्ण अधिकारपूर्ण मुक्ति का भाव देता है।
- source_word: בִּזְרוֹעַ נְטוּיָה
  choice: बढ़ाई हुई भुजा के द्वारा
  rationale: ईश्वरीय सामर्थ्य और सक्रिय हस्तक्षेप की इब्रानी मानवरूपी छवि को सुरक्षित रखता है।
- source_word: וּבִשְׁפָטִים גְּדֹלִים
  choice: बड़े-बड़े न्याय के कामों के द्वारा
  rationale: שְׁפָטִים को केवल निर्णयों के बजाय दंडात्मक न्याय-कार्यों के रूप में स्पष्ट करता है, जबकि उसका न्यायिक अर्थ बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम प्रत्यक्ष है। हिंदी पाठकों में सुविख्यात ‘यहोवा’ उसका नामरूप बनाए रखता है; संभावित उच्चारण ‘याहवे’ पादटिप्पणी में दिया गया है।
- issue: לִבְנֵי יִשְׂרָאֵל में शाब्दिक पारिवारिक भाषा
  choice: इस्राएल के पुत्रों
  alternative: इस्राएलियों
  rationale: मूल की पुल्लिंग बहुवचन और वंशगत-पारिवारिक अभिव्यक्ति को मुख्य पाठ में रखा गया है, बिना यह मानने के कि संबोधन केवल पुरुषों तक सीमित था।
- issue: עֲבֹדָה का प्रसंगगत अर्थ
  choice: दासता
  alternative: सेवा अथवा बेगारी
  rationale: निर्गमन के प्रसंग में यह मिस्र के अधीन जबरन कराए गए श्रम और बँधुआ दशा को सूचित करता है; ‘दासता’ उस कठोर सामाजिक वास्तविकता को नहीं नरम करता।
- issue: גאל की वाचा और संबंधी-मुक्तिदाता संबंधी ध्वनि
  choice: छुड़ा लूँगा
  alternative: मोल लेकर छुड़ाऊँगा
  rationale: मूल क्रिया में संबंधी द्वारा अधिकारपूर्वक छुड़ाने की पृष्ठभूमि हो सकती है, पर इस पद में कोई मूल्य चुकाने की बात स्पष्ट नहीं है; इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
