base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/006.yaml
  text: Therefore say to the sons of Israel[a], ‘I am Yahweh, and I will bring you out from under the burdens of Egypt, and I will deliver you from their slavery[d][c][b], and I will redeem you with an outstretched arm and with great judgments.’
translation:
  language: hi
  text: इसलिए इस्राएल के पुत्रों[a] से कह, ‘मैं याहवे[b] हूँ। मैं तुम्हें मिस्र के बोझों के नीचे से निकालूँगा, मिस्र की दासता[c] से तुम्हें छुड़ाऊँगा, और फैली हुई बाँह तथा महान न्याय-कार्यों[d] के द्वारा तुम्हें छुटकारा दिलाऊँगा।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘इस्राएल की संतान से’ अथवा ‘इस्राएलियों से।’ इब्रानी में शाब्दिक रूप से ‘इस्राएल के पुत्रों’ है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में ‘YHWH’; इसका सामान्यतः पुनर्निर्मित उच्चारण ‘याहवे’ है।
    reason: alternative_reading
  - marker: c
    text: या ‘मिस्र की बेगारी से’ या ‘मिस्र के बंधन से।’ इब्रानी शब्द सेवा या काम भी दर्शा सकता है, पर यहाँ उसका अर्थ जबरन कराई गई दास-सेवा है।
    reason: lexical_alternative
  - marker: d
    text: या ‘महान न्यायों के द्वारा।’ इब्रानी अभिव्यक्ति न्याय करने के महान कार्यों को दर्शाती है।
    reason: lexical_alternative
