  yaml_path: translation/ot/exodus/006/009.yaml
  text: So Moses spoke thus to the sons of Israel[b][a], but they did not listen to Moses because of discouragement and harsh slavery.
translation:
  language: hi
  text: तब मूसा ने इस्राएलियों से यह बात कही, पर उन्होंने मन टूट जाने[a] और कठोर दासता[b] के कारण मूसा की बात नहीं सुनी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “आत्मा की संकुचितता के कारण।” इसका भाव हताशा, मन के कुचले जाने या अधीरता से भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “कठिन परिश्रम।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: कही
  rationale: דבר के पिएल रूप का अर्थ यहाँ ‘बोलना/कहना’ है। हिंदी में कथन की विषयवस्तु के साथ ‘बात कही’ स्वाभाविक और स्पष्ट है।
- source_word: כֵּן
  choice: यही बात
  rationale: यह शब्द पिछले पदों में दिए गए परमेश्वर के संदेश की ओर संकेत करता है; ‘यही बात’ उस पूर्वसंदर्भ को सहज हिंदी में व्यक्त करता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: शाब्दिक रूप ‘इस्राएल के पुत्र’ है, किंतु यहाँ पूरी प्रजा अभिप्रेत है। ‘इस्राएलियों’ आधुनिक हिंदी में स्वाभाविक और अर्थ की दृष्टि से समावेशी है।
- source_word: שָׁמְעוּ אֶל
  choice: मूसा की बात नहीं सुनी
  rationale: שמע אל का आशय ध्यान देकर सुनना या मानना है। हिंदी मुहावरे में ‘किसी की बात न सुनना’ दोनों भावों को स्वाभाविक रूप से समेटता है।
- source_word: מִקֹּצֶר רוּחַ
  choice: मन टूट जाने
  rationale: शाब्दिक अर्थ ‘आत्मा/श्वास की छोटाई’ है और प्रसंग में आंतरिक संकुचन, हताशा या टूटा हुआ मन दर्शाता है। ‘मन टूट जाना’ सामान्य पाठक के लिए भावपूर्ण और सहज है, जबकि पादटिप्पणी मूल रूपक सुरक्षित रखती है।
- source_word: וּמֵעֲבֹדָה קָשָׁה
  choice: और कठोर दासता
  rationale: עֲבֹדָה का अर्थ काम या सेवा हो सकता है, पर मिस्र के प्रसंग में यह बाध्यकारी श्रम और दासत्व है। ‘कठोर दासता’ उस उत्पीड़क परिस्थिति को स्पष्ट करता है।
theological_decisions:
- issue: मिस्र में עֲבֹדָה קָשָׁה का स्वरूप
  choice: कठोर दासता
  alternative: कठिन परिश्रम
  rationale: संज्ञा सामान्यतः श्रम या सेवा भी बता सकती है, किंतु निर्गमन के प्रसंग में इस्राएली बाध्यकारी दासत्व में हैं। मुख्य पाठ में ‘दासता’ ऐतिहासिक स्थिति को स्पष्ट करता है और पादटिप्पणी व्यापक शाब्दिक विकल्प बताती है।
- issue: מִקֹּצֶר רוּחַ में मनोभाव और शारीरिक रूपक
  choice: मन टूट जाने
  alternative: मन की अधीरता / साँस की कमी
  rationale: 'वाक्यांश में वास्तविक अस्पष्टता है: यह हताशा, अधीरता या दबाव से उत्पन्न आंतरिक/शारीरिक संकुचन का संकेत दे सकता है। मुख्य पाठ प्रसंगगत भाव देता है और पादटिप्पणी शाब्दिक रूप तथा विकल्प सुरक्षित रखती है।'
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘इस्राएल के पुत्रों’ के स्थान पर समुदाय-सूचक ‘इस्राएलियों’ चुना गया है। दोनों पादटिप्पणी-चिह्न संबंधित पदबंधों के तुरंत बाद मुख्य पाठ में दिए गए हैं।
