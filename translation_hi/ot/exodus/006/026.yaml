source:
  edition: WLC
  text: ה֥וּא אַהֲרֹ֖ן וּ/מֹשֶׁ֑ה אֲשֶׁ֨ר אָמַ֤ר יְהוָה֙ לָ/הֶ֔ם הוֹצִ֜יאוּ אֶת בְּנֵ֧י יִשְׂרָאֵ֛ל מֵ/אֶ֥רֶץ מִצְרַ֖יִם עַל צִבְאֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/026.yaml
  text: It was Aaron and Moses to whom Yahweh said[c][b][a], “Bring the sons of Israel out from the land of Egypt by their hosts.”
translation:
  language: hi
  text: ये वही हारून और मूसा थे[a], जिनसे याहवे ने कहा, “इस्राएल के पुत्रों[b] को उनके दलों के अनुसार[c] मिस्र देश से बाहर निकालो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ये हारून और मूसा ही थे।”
    reason: हिब्रू सर्वनाम पहचान पर बल देता है; हिन्दी में इसकी एक दूसरी स्वाभाविक अभिव्यक्ति सम्भव है।
  - marker: b
    text: अर्थात “इस्राएलियों”; मूलतः “इस्राएल के पुत्रों।”
    reason: मूल की पारिवारिक अभिव्यक्ति और उसके प्रसंगगत सामुदायिक अर्थ दोनों स्पष्ट करने के लिए।
  - marker: c
    text: या, “अपनी-अपनी टुकड़ियों में”; हिब्रू शब्द संगठित दलों, यहाँ तक कि सैन्य-जैसी संरचनाओं, को भी सूचित कर सकता है।
    reason: צִבְאֹתָם की संगठनात्मक और सम्भावित सैन्य अर्थ-सीमा को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: הוּא אַהֲרֹן וּמֹשֶׁה
  choice: ये वही हारून और मूसा थे
  rationale: एकवचन स्वतंत्र सर्वनाम यहाँ पहले उल्लिखित व्यक्तियों की बलयुक्त पहचान कराता है। हिन्दी में संयुक्त कर्ता के साथ ‘ये वही ... थे’ स्वाभाविक है और पहचान पर दिया गया बल बनाए रखता है।
- source_word: אֲשֶׁר אָמַר יְהוָה לָהֶם
  choice: जिनसे यहोवा ने कहा
  rationale: सम्बन्धवाचक אֲשֶׁר और לָהֶם के दातृ सम्बन्ध को सहज हिन्दी में ‘जिनसे ... कहा’ व्यक्त करता है। יְהוָה को उसके व्यक्तिगत नाम ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: הוֹצִיאוּ
  choice: बाहर निकालो
  rationale: יצא का हिफ़ील बहुवचन आज्ञार्थक रूप किसी को बाहर ले आने या निकालने का कारणवाचक अर्थ देता है; ‘बाहर निकालो’ इसे स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: यह चयन इब्रानी के पारिवारिक और व्याकरणतः पुल्लिंग बहुवचन रूप को पारदर्शी ढंग से सुरक्षित रखता है; अधिक प्रसंगानुकूल ‘इस्राएलियों’ को पादटिप्पणी में दिया गया है।
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: मिस्र देश से
  rationale: מֵ־ स्रोत या प्रस्थान-बिन्दु बताता है और אֶרֶץ को ‘देश’ से स्पष्ट रखा गया है; क्रिया में ‘बाहर’ होने के कारण हिन्दी में अतिरिक्त ‘के बाहर से’ अनावश्यक होगा।
- source_word: עַל צִבְאֹתָם
  choice: उनके दलों के अनुसार
  rationale: צָבָא संगठित समूह, दल या सैन्य-जैसी टुकड़ी को सूचित कर सकता है। ‘दलों के अनुसार’ व्यवस्थित समूहों में प्रस्थान का अर्थ रखता है, पर अनावश्यक रूप से उन्हें सेनाएँ घोषित नहीं करता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम है, उपाधि ‘प्रभु’ नहीं। हिन्दी बाइबल परम्परा में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ से नाम को नाम के रूप में सुरक्षित रखा गया है।
- issue: בְּנֵי יִשְׂרָאֵל की लिंगयुक्त पारिवारिक अभिव्यक्ति
  choice: इस्राएल के पुत्रों
  alternative: इस्राएलियों
  rationale: मुख्य पाठ मूल की पुल्लिंग पारिवारिक अभिव्यक्ति को बनाए रखता है, जबकि पादटिप्पणी यह स्पष्ट करती है कि प्रसंग में इसका सामुदायिक अर्थ ‘इस्राएली’ है।
- issue: עַל צִבְאֹתָם में सैन्य या संगठनात्मक भाव
  choice: उनके दलों के अनुसार
  alternative: अपनी-अपनी टुकड़ियों के अनुसार
  rationale: यह पद संगठित संरचना का भाव रखता है, लेकिन यहाँ अनिवार्यतः युद्धरत सेनाओं का दावा नहीं करता। चयन इस सम्भावित सैन्य रंग को मिटाए बिना मूल की व्यापकता बचाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक स्तर रखा गया है। ‘ये वही ... थे’ पहचान के बल को सहज बनाता है; ‘दल’ साधारण पाठक के लिए बोधगम्य है और ‘सेना’ की अपेक्षा मूल की व्यापक अर्थ-सीमा बनाए रखता है।
