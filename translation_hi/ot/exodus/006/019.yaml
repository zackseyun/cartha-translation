lexical_decisions:
- source_word: וּ/בְנֵי מְרָרִי
  choice: और मरारी के पुत्र
  rationale: वंशावली के प्रसंग में בְּנֵי का स्वाभाविक अर्थ ‘पुत्र’ है; आरंभिक וּ को सूची की कड़ी बनाए रखने के लिए ‘और’ से व्यक्त किया गया है।
- source_word: מַחְלִי וּ/מוּשִׁי
  choice: महली और मूशी
  rationale: दोनों व्यक्तिवाचक नामों का देवनागरी में स्रोत-आधारित लिप्यंतरण किया गया है और संयोजक को ‘और’ से व्यक्त किया गया है।
- source_word: מִשְׁפְּחֹת
  choice: कुल
  rationale: जनजातीय वंशावली में यह शब्द किसी वंश की रिश्तेदारी-आधारित उपशाखाओं को दर्शाता है; हिंदी में ‘कुल’ इस अर्थ को संक्षिप्त और स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַ/לֵּוִי
  choice: लेवी के
  rationale: इब्रानी में निश्चित एकवचन रूप है, जो संभवतः लेवी से निकले पूरे वंश के लिए सामूहिक रूप से प्रयुक्त हुआ है। मुख्य पाठ में ‘लेवी के’ अर्थ को सहज रखता है, जबकि वैकल्पिक रूप पादटिप्पणी में दिए गए हैं।
- source_word: לְ/תֹלְדֹתָם
  choice: उनकी पीढ़ियों के अनुसार
  rationale: वंशावली-सूत्र में תּוֹלְדוֹת पीढ़ियों अथवा वंशक्रम को सूचित करता है; यह अनुवाद मूल की औपचारिक अभिव्यक्ति को सुरक्षित रखता है।
theological_decisions:
- issue: הַלֵּוִי के एकवचन सामूहिक प्रयोग की व्याख्या
  choice: मुख्य पाठ में ‘लेवी के कुल’
  alternative: ‘लेवीवंशी के कुल’ या ‘लेवियों के कुल’
  rationale: यह चयन किसी विशेष धर्मसिद्धान्त को आरोपित किए बिना पद को स्वाभाविक हिंदी में प्रस्तुत करता है और इब्रानी एकवचन की वास्तविक अस्पष्टता को पादटिप्पणी में सुरक्षित रखता है।
