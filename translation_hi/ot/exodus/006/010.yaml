lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: तब ... कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है, इसलिए ‘तब’ स्वाभाविक है। דּבר का मूल अर्थ ‘बोलना’ है, पर हिन्दी में इस सूत्र के साथ ‘से कहा’ अधिक सहज और अर्थनिष्ठ है।
- source_word: יְהוָה
  choice: यहवे
  rationale: चार-अक्षरीय ईश्वरीय नाम יהוה को उपाधि से बदलने के बजाय हिन्दी में प्रचलित निकट लिप्यंतरण ‘यहवे’ से व्यक्त किया गया है।
- source_word: אֶל־מֹשֶׁה
  choice: मूसा से
  rationale: भाषण के संबोधित व्यक्ति को हिन्दी में स्वाभाविक रूप से ‘से’ द्वारा व्यक्त किया जाता है; מֹשֶׁה का मानक हिन्दी रूप ‘मूसा’ है।
- source_word: לֵאמֹר
  choice: कहा
  rationale: यह रूप आगे आने वाले प्रत्यक्ष कथन का परिचय देता है। हिन्दी में ‘यह कहते हुए’ जोड़ना यहाँ अनावश्यक रूप से भारी होता; ‘कहा’ वही कथात्मक कार्य स्वाभाविक ढंग से करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। ‘यहवे’ उसे नाम के रूप में सुरक्षित रखता है; ‘प्रभु’ नाम को उपाधि से बदल देता, जबकि ‘यहोवा’ एक वैकल्पिक पारंपरिक रूप है।
translation_notes:
