source:
  edition: WLC
  text: וְ/גַ֨ם הֲקִמֹ֤תִי אֶת בְּרִיתִ/י֙ אִתָּ֔/ם לָ/תֵ֥ת לָ/הֶ֖ם אֶת אֶ֣רֶץ כְּנָ֑עַן אֵ֛ת אֶ֥רֶץ מְגֻרֵי/הֶ֖ם אֲשֶׁר גָּ֥רוּ בָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/004.yaml
  text: I also established my covenant with them[a], to give them the land of Canaan, the land where they lived as sojourners.
translation:
  language: hi
  text: मैंने उनके साथ अपनी वाचा भी बाँधी कि मैं उन्हें कनान देश दूँ—वह देश जहाँ वे परदेशी होकर रहे थे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शब्दशः: “उनके परदेशी निवास का देश, जिसमें वे परदेशी होकर रहे थे।”'
    reason: मूल इब्रानी में एक ही शब्द-मूल से बने संज्ञा और क्रिया की पुनरुक्ति है; मुख्य पाठ अर्थ को स्वाभाविक हिन्दी में देता है।
lexical_decisions:
- source_word: וְגַם
  choice: भी
  rationale: ‘भी’ पिछले कथन से इस वाक्य का संबंध जोड़ते हुए וְגַם का योगात्मक भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הֲקִמֹתִי אֶת־בְּרִיתִי
  choice: अपनी वाचा बाँधी
  rationale: קום के साथ בְּרִית का यह वाचागत मुहावरा किसी वाचा को दृढ़ रूप से कायम करने का बोध देता है। हिन्दी में ‘वाचा बाँधना’ स्वाभाविक और गंभीर अभिव्यक्ति है; ‘वाचा को खड़ा किया’ अनावश्यक रूप से शब्दशः होता।
- source_word: אִתָּם
  choice: उनके साथ
  rationale: संबंधसूचक पूर्वसर्ग और बहुवचन प्रत्यय को सीधे व्यक्त करता है; संदर्भ में संकेत पूर्वजों की ओर है।
- source_word: לָתֵת לָהֶם
  choice: कि मैं उन्हें ... दूँ
  rationale: उद्देश्यसूचक infinitive को स्वाभाविक हिन्दी उपवाक्य में व्यक्त किया गया है और प्रथम पुरुष कर्ता स्पष्ट रखा गया है।
- source_word: אֶרֶץ כְּנָעַן
  choice: कनान देश
  rationale: मूल के ‘देश/भूमि’ और स्थाननाम दोनों को संक्षिप्त, प्रचलित हिन्दी रूप में बनाए रखता है।
- source_word: אֶרֶץ מְגֻרֵיהֶם אֲשֶׁר גָּרוּ בָהּ
  choice: वह देश जहाँ वे परदेशी होकर रहे थे
  rationale: מָגוּר और גור में अस्थायी, गैर-स्थानीय निवासी के रूप में रहने का भाव है। यह रूप उस सामाजिक स्थिति को स्पष्ट और स्वाभाविक हिन्दी में बताता है, जबकि मूल की पुनरुक्ति को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: קום + ברית का वाचागत मुहावरा
  choice: अपनी वाचा बाँधी
  alternative: अपनी वाचा स्थापित की / अपनी वाचा दृढ़ की
  rationale: यह परमेश्वर की पूर्वजों के साथ बाध्यकारी प्रतिज्ञा को व्यक्त करता है। ‘वाचा बाँधी’ हिन्दी का स्वाभाविक वाचागत प्रयोग है और मूल से परे यह तय नहीं करता कि यहाँ पहली बार स्थापना हुई या पहले से दी गई वाचा की पुष्टि।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण शैली रखी गई है। ‘वाचा’ बाइबलीय संदर्भ में प्रचलित और अर्थ-सटीक है; ‘परदेशी होकर रहे’ अस्थायी अथवा गैर-स्थानीय निवासी होने का भाव सामान्य पाठक के लिए स्पष्ट करता है।
