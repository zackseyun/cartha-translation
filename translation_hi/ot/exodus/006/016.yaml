  register: आधुनिक मानक हिन्दी; वंशावली की औपचारिकता बनाए रखते हुए वाक्य-विन्यास सहज रखा गया है। व्यक्तिनामों के लिए प्रचलित हिन्दी बाइबलीय रूप ‘गेर्शोन, कहात, मरारी’ अपनाए गए हैं।
