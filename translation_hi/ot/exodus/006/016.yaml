  yaml_path: translation/ot/exodus/006/016.yaml
  text: 'These are the names of Levi’s sons according to their generations: Gershon, Kohath, and Merari. And the years of Levi’s life were one hundred thirty-seven years.'
translation:
  language: hi
  text: 'लेवी के पुत्रों के नाम, उनकी पीढ़ियों के अनुसार, ये हैं: गेर्शोन, कहात और मरारी। लेवी की आयु एक सौ सैंतीस वर्ष हुई।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְתֹלְדֹתָם
  choice: उनकी पीढ़ियों के अनुसार
  rationale: वंश-सूची के संदर्भ में इब्रानी पदबंध का औपचारिक अर्थ सुरक्षित रखता है; इसे केवल ‘वंशों के अनुसार’ कहने की अपेक्षा आधुनिक हिन्दी में अधिक स्पष्ट है।
- source_word: וּשְׁנֵי חַיֵּי לֵוִי
  choice: लेवी की आयु
  rationale: शाब्दिक रूप ‘लेवी के जीवन के वर्ष’ है, पर ‘आयु’ वही अर्थ स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: שֶׁבַע וּשְׁלֹשִׁים וּמְאַת שָׁנָה
  choice: एक सौ सैंतीस वर्ष
  rationale: इब्रानी संख्या 137 का आधुनिक हिन्दी में स्पष्ट और मानक रूप।
theological_decisions: []
