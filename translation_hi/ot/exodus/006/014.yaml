  text: אֵ֖לֶּה רָאשֵׁ֣י בֵית אֲבֹתָ֑/ם בְּנֵ֨י רְאוּבֵ֜ן בְּכֹ֣ר יִשְׂרָאֵ֗ל חֲנ֤וֹךְ וּ/פַלּוּא֙ חֶצְר֣וֹן וְ/כַרְמִ֔י אֵ֖לֶּה מִשְׁפְּחֹ֥ת רְאוּבֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/014.yaml
  text: 'These are the heads of their fathers’ houses: the sons of Reuben[a], the firstborn of Israel: Hanoch and Pallu, Hezron and Carmi. These are the clans of Reuben.'
translation:
  language: hi
  text: 'उनके पितृकुलों के मुखिया ये हैं: इस्राएल के पहलौठे रूबेन के पुत्र—हनोक, पल्लू, हेस्रोन और कर्मी। ये रूबेन के कुल हैं।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָאשֵׁי בֵית אֲבֹתָם
  choice: उनके पितृकुलों के मुखिया
  rationale: इब्रानी वंशावली-संबंधी पदबंध का अर्थ पैतृक वंश-समूहों के प्रधान प्रतिनिधि हैं। ‘पितृकुल’ संबंध की दिशा बनाए रखता है और आधुनिक हिन्दी में ‘पिताओं के घरानों’ से अधिक स्वाभाविक है।
- source_word: בְּנֵי רְאוּבֵן
  choice: रूबेन के पुत्र
  rationale: यहाँ रूबेन की नामित प्रत्यक्ष संतानों की सूची है; इसलिए व्यापक ‘वंशज’ के बजाय ‘पुत्र’ उपयुक्त है।
- source_word: בְּכֹר יִשְׂרָאֵל
  choice: इस्राएल के पहलौठे
  rationale: यह रूबेन की समानाधिकरण पहचान है। ‘पहलौठा’ ज्येष्ठ पुत्र की पारिवारिक स्थिति को संक्षेप और स्पष्ट रूप में व्यक्त करता है।
- source_word: חֲנוֹךְ וּפַלּוּא חֶצְרוֹן וְכַרְמִי
  choice: हनोक, पल्लू, हेस्रोन और कर्मी
  rationale: नामों को इब्रानी उच्चारण के निकट और प्रचलित हिन्दी बाइबलीय वर्तनी में प्रस्तुत किया गया है।
- source_word: מִשְׁפְּחֹת
  choice: कुल
  rationale: जनजातीय वंशावली में यह निकट संबंध वाले उप-समूहों को दर्शाता है। हिन्दी ‘कुल’ इस सामूहिक वंशगत अर्थ को साधारण ‘परिवार’ से अधिक ठीक व्यक्त करता है।
- source_word: אֵלֶּה
  choice: ये हैं / ये ... हैं
  rationale: सूची के आरंभ और निष्कर्ष दोनों में संकेतवाचक बहुवचन को रखा गया है; हिन्दी वाक्य की स्वाभाविकता के लिए सहायक क्रिया जोड़ी गई है।
