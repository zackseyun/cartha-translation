source:
  edition: WLC
  text: וְ/הֵבֵאתִ֤י אֶתְ/כֶם֙ אֶל הָ/אָ֔רֶץ אֲשֶׁ֤ר נָשָׂ֨אתִי֙ אֶת יָדִ֔/י לָ/תֵ֣ת אֹתָ֔/הּ לְ/אַבְרָהָ֥ם לְ/יִצְחָ֖ק וּֽ/לְ/יַעֲקֹ֑ב וְ/נָתַתִּ֨י אֹתָ֥/הּ לָ/כֶ֛ם מוֹרָשָׁ֖ה אֲנִ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/008.yaml
  text: And I will bring you into the land that I swore to give to Abraham[a], to Isaac, and to Jacob, and I will give it to you as a possession. I am Yahweh.
translation:
  language: hi
  text: और मैं तुम्हें उस देश में ले आऊँगा, जिसके विषय में मैंने अपना हाथ उठाकर शपथ खाई थी कि उसे अब्राहम, इसहाक और याकूब को दूँगा[a]; और मैं उसे तुम्हारी संपत्ति के रूप में दूँगा। मैं यहोवा हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'मूल इब्रानी में शपथ लेने का मुहावरा है: “मैंने अपना हाथ उठाया था कि उसे दूँगा।” ‘संपत्ति’ के लिए प्रयुक्त शब्द में विरासत या स्थायी अधिकार का भाव भी हो सकता है।'
    reason: ‘हाथ उठाने’ के शपथ-मुहावरे की शब्दशः रचना तथा מוֹרָשָׁה की अतिरिक्त अर्थ-छाया स्पष्ट करता है, बिना मुख्य पाठ में किसी एक व्याख्यात्मक विकल्प को थोपे।
lexical_decisions:
- source_word: וְהֵבֵאתִי
  choice: और मैं तुम्हें…ले आऊँगा
  rationale: בוא के हिफ़ील रूप का कारक अर्थ स्वाभाविक हिन्दी में ‘ले आऊँगा’ से स्पष्ट होता है।
- source_word: הָאָרֶץ
  choice: उस देश
  rationale: प्रसंग प्रतिज्ञा किए गए विशिष्ट भूभाग का है; हिन्दी में ‘देश’ यहाँ ‘पृथ्वी’ या सामान्य ‘भूमि’ से अधिक स्वाभाविक है।
- source_word: אֲשֶׁר נָשָׂאתִי אֶת יָדִי
  choice: जिसके विषय में मैंने अपना हाथ उठाकर शपथ खाई थी
  rationale: अनुवाद शपथ लेने के अर्थ को स्पष्ट करता है और साथ ही इब्रानी की ‘हाथ उठाने’ वाली ठोस छवि को बनाए रखता है।
- source_word: לָתֵת אֹתָהּ
  choice: कि उसे…दूँगा
  rationale: נתן का सीधा अर्थ ‘देना’ है; हिन्दी वाक्य-विन्यास में उद्देश्यसूचक भाव ‘कि…दूँगा’ से स्वाभाविक रूप में व्यक्त होता है।
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: अब्राहम, इसहाक और याकूब को
  rationale: नामों के प्रचलित हिन्दी बाइबलीय रूप रखे गए हैं; साझा ‘को’ हिन्दी में सूची के अंत में स्वाभाविक है।
- source_word: וְנָתַתִּי אֹתָהּ לָכֶם
  choice: मैं उसे तुम्हारी…कर दूँगा
  rationale: प्रत्यक्ष दिव्य प्रतिज्ञा और भावी क्रिया सुरक्षित हैं; מוֹרָשָׁה के साथ हिन्दी में ‘संपत्ति कर दूँगा’ अधिक सहज है।
- source_word: מוֹרָשָׁה
  choice: विरासत की संपत्ति
  rationale: शब्द में स्थायी अधिकार और उत्तराधिकार से प्राप्त स्वामित्व दोनों की छाया है; केवल ‘संपत्ति’ की अपेक्षा यह अभिव्यक्ति अर्थ की व्यापकता को बेहतर रखती है।
- source_word: אֲנִי יְהוָה
  choice: मैं यहोवा हूँ
  rationale: वाचा-संबंधी व्यक्तिगत नाम יהוה को हिन्दी के परिचित रूप ‘यहोवा’ में प्रत्यक्ष रखा गया है।
theological_decisions:
- issue: शपथ-वाचक मुहावरे נָשָׂאתִי אֶת יָדִי का अनुवाद
  choice: अपना हाथ उठाकर शपथ खाई थी
  alternative: शपथ खाई थी / अपना हाथ उठाया था
  rationale: संयुक्त अभिव्यक्ति मूल बिंब और उसका शपथ-संबंधी आशय दोनों सुरक्षित रखती है, जिससे पाठक को मुहावरे का अर्थ अनुमान से तय नहीं करना पड़ता।
- issue: מוֹרָשָׁה में संपत्ति और विरासत का संबंध
  choice: विरासत की संपत्ति
  alternative: अधिकार की संपत्ति / निज संपत्ति / विरासत
  rationale: यह भूमि स्थायी, पीढ़ीगत अधिकार के रूप में दी जा रही है; चयन मानव पूर्वज से उत्तराधिकार पाने का अनावश्यक संकेत दिए बिना दोनों अर्थ-छायाएँ रखता है।
- issue: दिव्य नाम יהוה
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल में व्यक्तिगत वाचा-नाम प्रत्यक्ष है; उसका नामरूप रखना उपाधि ‘प्रभु’ से अधिक स्रोत-संगत है, और ‘यहोवा’ हिन्दी पाठकों में सुविदित रूप है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सीधी वाचा-भाषा रखी गई है। एकवचन वक्ता और बहुवचन संबोधन के लिए ‘मैं’ तथा ‘तुम्हें/तुम्हारी’ प्रयुक्त हैं। मुख्य पाठ में मुहावरे का अर्थ और बिंब दोनों दिए गए हैं; पादटिप्पणी उसकी शब्दशः रचना बताती है।
