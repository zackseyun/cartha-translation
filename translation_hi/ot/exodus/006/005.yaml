source:
  edition: WLC
  text: וְ/גַ֣ם אֲנִ֣י שָׁמַ֗עְתִּי אֶֽת נַאֲקַת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֥ר מִצְרַ֖יִם מַעֲבִדִ֣ים אֹתָ֑/ם וָ/אֶזְכֹּ֖ר אֶת בְּרִיתִֽ/י׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/005.yaml
  text: And I also have heard the groaning of the sons of Israel[a], whom the Egyptians are enslaving[b], and I have remembered my covenant.
translation:
  language: hi
  text: और मैंने भी इस्राएलियों[a] का कराहना सुना है, जिन्हें मिस्री दास बनाकर उनसे काम करा रहे हैं; और मैंने अपनी वाचा को स्मरण किया है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “इस्राएल के पुत्रों।” इसका अर्थ “इस्राएली” या “इस्राएल के लोग” भी है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “स्मरण किया” वाचा से जुड़ी भाषा है। इसका अर्थ यह नहीं कि परमेश्वर वाचा को भूल गया था, बल्कि यह कि वह अपनी वाचा के अनुसार कार्य करने की ओर उन्मुख हुआ।
    reason: cultural_note
lexical_decisions:
- source_word: וְגַם אֲנִי
  choice: और मैंने भी
  rationale: संयोजक और बलसूचक भाव को स्वाभाविक हिन्दी में रखता है; स्पष्ट सर्वनाम से परमेश्वर के ‘मैं’ पर मूल का जोर बना रहता है।
- source_word: שָׁמַעְתִּי
  choice: सुना है
  rationale: हिब्रू पूर्ण क्रिया यहाँ वर्तमान भाषण से जुड़ी पूरी हुई क्रिया को व्यक्त करती है; हिन्दी का पूर्ण वर्तमान उपयुक्त है।
- source_word: נַאֲקַת
  choice: कराहना
  rationale: उत्पीड़न से निकली पीड़ाभरी आवाज़ का सामान्य, सशक्त और गरिमापूर्ण हिन्दी रूप।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: शाब्दिक रूप ‘इस्राएल के पुत्र’ है, पर यहाँ अभिव्यक्ति पूरे वाचा-समुदाय को सूचित करती है; मुख्य पाठ में ‘इस्राएलियों’ अधिक स्वाभाविक और स्पष्ट है, जबकि शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: מִצְרַיִם מַעֲבִדִים אֹתָם
  choice: जिन्हें मिस्री दास बनाकर काम करा रहे हैं
  rationale: ‘मिस्र’ के साथ बहुवचन कृदंत मिस्रियों को कर्ता के रूप में इंगित करता है। हिफ़ईल रूप का कारणवाचक और दमनकारी भाव ‘दास बनाकर काम करा रहे हैं’ में स्पष्ट रहता है।
- source_word: וָאֶזְכֹּר
  choice: और मैंने ... स्मरण किया है
  rationale: मूल के ‘स्मरण’ संबंधी वाचा-मुहावरे को व्याख्यात्मक भावार्थ से बदले बिना सुरक्षित रखता है; पूर्ण वर्तमान पूर्ववर्ती क्रिया से संबंध बनाए रखता है।
- source_word: בְּרִיתִי
  choice: अपनी वाचा
  rationale: בְּרִית के लिए मानक बाइबलीय हिन्दी; ‘अपनी’ हिन्दी में कर्ता परमेश्वर की वाचा को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל का सामूहिक अर्थ
  choice: इस्राएलियों
  alternative: इस्राएल के पुत्रों
  rationale: मूल का पुरुषवाचक शाब्दिक रूप यहाँ केवल पुरुषों को नहीं, पूरे इस्राएली समुदाय को दर्शाता है। स्वाभाविक सामूहिक रूप मुख्य पाठ में और शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- issue: परमेश्वर द्वारा वाचा को ‘स्मरण करना’
  choice: मैंने अपनी वाचा को स्मरण किया है
  alternative: मैं अपनी वाचा के अनुसार कार्य करने लगा हूँ
  rationale: पाठ के वाचागत मुहावरे और उसकी धर्मवैचारिक गहराई को सुरक्षित रखने के लिए ‘स्मरण’ को भावार्थ में नहीं बदला गया। पादटिप्पणी स्पष्ट करती है कि इसका आशय भूल जाने के बाद याद आना आवश्यक नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली। ‘वाचा’ और ‘स्मरण’ जैसे प्रमुख बाइबलीय शब्द बनाए गए हैं; दासता के कारणवाचक भाव को स्पष्ट करने के लिए ‘दास बनाकर काम करा रहे हैं’ चुना गया है।
