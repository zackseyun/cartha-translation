source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר מֹשֶׁ֔ה לִ/פְנֵ֥י יְהוָ֖ה לֵ/אמֹ֑ר הֵ֤ן בְּנֵֽי יִשְׂרָאֵל֙ לֹֽא שָׁמְע֣וּ אֵלַ֔/י וְ/אֵיךְ֙ יִשְׁמָעֵ֣/נִי פַרְעֹ֔ה וַ/אֲנִ֖י עֲרַ֥ל שְׂפָתָֽיִם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/012.yaml
  text: But Moses spoke before Yahweh[a], saying, “Behold, the sons of Israel have not listened to me; so how will Pharaoh listen to me[b], since I am uncircumcised in lips?”
translation:
  language: hi
  text: परन्तु मूसा ने यहोवा के सामने कहा, “देखिए, इस्राएलियों ने मेरी नहीं सुनी; फिर फ़िरौन मेरी कैसे सुनेगा, जबकि मेरे होंठ खतनारहित हैं?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “मैं खतनारहित होंठों वाला हूँ।” यह बोलने में बाधा या अयोग्यता व्यक्त करने वाला इब्रानी मुहावरा है; निर्गमन 4:10 से तुलना करें।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: परन्तु मूसा ने…कहा
  rationale: वाव-क्रम कथा को आगे बढ़ाता है, जबकि प्रसंग में परमेश्वर की आज्ञा के सामने मूसा की आपत्ति का विरोधात्मक संबंध है; इसलिए ‘परन्तु’ स्वाभाविक है।
- source_word: לִפְנֵי יְהוָה
  choice: यहोवा के सामने
  rationale: לִפְנֵי का स्थान-संबंधी भाव ‘के सामने/उपस्थिति में’ है; इसे केवल ‘से’ कहने के बजाय मूल मुहावरे को बनाए रखा गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुराक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, न कि किसी उपाधि से।
- source_word: הֵן
  choice: देखिए
  rationale: यह ध्यान आकर्षित करने वाला कथन-कण है। ‘देखिए’ आधुनिक, आदरसूचक और स्वाभाविक हिन्दी में उसका बल व्यक्त करता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: यह सामूहिक जातिनाम के रूप में स्वाभाविक आधुनिक हिन्दी है; शब्दशः ‘इस्राएल के पुत्र’ यहाँ अनावश्यक रूप से कृत्रिम लगेगा।
- source_word: לֹא שָׁמְעוּ אֵלַי
  choice: मेरी नहीं सुनी
  rationale: שׁמע עם אֶל का अर्थ यहाँ किसी की बात सुनना/मानना है। हिन्दी मुहावरा ‘मेरी नहीं सुनी’ श्रवण और ध्यान देने—दोनों अर्थों को खुला रखता है।
- source_word: וְאֵיךְ יִשְׁמָעֵנִי פַרְעֹה
  choice: फिर फ़िरौन मेरी कैसे सुनेगा
  rationale: ‘फिर…कैसे’ पहले कथन से निकले निष्कर्षात्मक प्रश्न को स्वाभाविक हिन्दी में व्यक्त करता है और שׁמע के साथ शब्दगत संगति रखता है।
- source_word: וַאֲנִי
  choice: जबकि मेरे
  rationale: यह संयोजन मूसा की आपत्ति का आधार प्रस्तुत करता है। ‘जबकि’ कारण और विरोध की सूक्ष्मता को बिना अत्यधिक स्पष्ट किए बनाए रखता है।
- source_word: עֲרַל שְׂפָתָיִם
  choice: मेरे होंठ खतनारहित हैं
  rationale: मूल का सजीव और असामान्य रूपक सुरक्षित रखा गया है। अर्थ-सहायक टिप्पणी बताती है कि यह बोलने की बाधा या अयोग्यता का मुहावरा है, पर मुख्य पाठ किसी निश्चित आधुनिक निदान में इसे नहीं बदलता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। हिन्दी में ‘यहोवा’ उसे उपाधि ‘प्रभु’ से अलग रखते हुए नाम के रूप में प्रस्तुत करता है।
- issue: עֲרַל שְׂפָתָיִם के रूपक का निर्वाह
  choice: मेरे होंठ खतनारहित हैं
  alternative: मैं ठीक से बोल नहीं पाता
  rationale: व्याख्यात्मक विकल्प अधिक सहज है, किंतु वह मूसा की कथित भाषण-अयोग्यता के स्वरूप को निश्चित कर देता है। मूल रूपक को बनाए रखने से साहित्यिक और धर्मवैचारिक तनाव सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज स्तर अपनाया गया है। ‘इस्राएलियों’ और ‘मेरी नहीं सुनी’ स्वाभाविक हिन्दी देते हैं, जबकि ‘होंठ खतनारहित’ जानबूझकर मूल के असामान्य रूपक को सुरक्षित रखता है।
