source:
  edition: WLC
  text: וְ/לָקַחְתִּ֨י אֶתְ/כֶ֥ם לִ/י֙ לְ/עָ֔ם וְ/הָיִ֥יתִי לָ/כֶ֖ם לֵֽ/אלֹהִ֑ים וִֽ/ידַעְתֶּ֗ם כִּ֣י אֲנִ֤י יְהוָה֙ אֱלֹ֣הֵי/כֶ֔ם הַ/מּוֹצִ֣יא אֶתְ/כֶ֔ם מִ/תַּ֖חַת סִבְל֥וֹת מִצְרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/007.yaml
  text: And I will take you to be my people[a], and I will be your God, and you will know that I am Yahweh your God[b], who brought you out from under the burdens of Egypt.
translation:
  language: hi
  text: और मैं तुम्हें अपनी प्रजा के रूप में अपनाऊँगा, और मैं तुम्हारा परमेश्वर होऊँगा। तब तुम जानोगे कि मैं याहवे तुम्हारा परमेश्वर हूँ, जो तुम्हें मिस्र के बोझों के तले से निकालता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो तुम्हें मिस्र के कठोर श्रम से निकाल लाया।” हिब्रू में यहाँ कृदंत है, जो याहवे के विशिष्ट उद्धारक कार्य या उस कार्य से पहचाने जाने पर बल दे सकता है। “बोझों” का अर्थ प्रसंग में “कठोर श्रम” भी हो सकता है।
    reason: कृदंत הַמּוֹצִיא के कालगत/विशिष्टकारी बल और סִבְלֹת की अर्थ-सीमा के वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: וְלָקַחְתִּי אֶתְכֶם לִי לְעָם
  choice: मैं तुम्हें अपनी प्रजा के रूप में अपनाऊँगा
  rationale: यह वाचा-संबंधी ग्रहण और अपनेपन को स्वाभाविक हिन्दी में व्यक्त करता है। केवल ‘ले लूँगा’ हिन्दी में अस्पष्ट हो सकता है; ‘अपनाऊँगा’ यहाँ לִי לְעָם के संबंधपरक आशय को स्पष्ट करता है।
- source_word: וְהָיִיתִי לָכֶם לֵאלֹהִים
  choice: मैं तुम्हारा परमेश्वर होऊँगा
  rationale: मानक वाचा-सूत्र को सहज और निकट रूप में सुरक्षित रखता है।
- source_word: וִידַעְתֶּם
  choice: तब तुम जानोगे
  rationale: भविष्यकालीन अनुभवजन्य पहचान को व्यक्त करता है; ‘तब’ प्रसंगगत परिणाम-संबंध को हिन्दी में स्वाभाविक बनाता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: ईश्वरीय व्यक्तिगत नाम का लिप्यंतरण है, किसी उपाधि से उसका प्रतिस्थापन नहीं।
- source_word: הַמּוֹצִיא
  choice: जो तुम्हें ... निकालता है
  rationale: 'हिब्रू कृदंत को वर्तमान/चरित्रगत क्रिया के रूप में सुरक्षित रखता है: याहवे अपनी प्रजा को निकालनेवाले उद्धारकर्ता के रूप में पहचाने जाते हैं। प्रसंग में पूर्ण हुई क्रिया का अर्थ भी संभव है, इसलिए पादटिप्पणी दी गई है।'
- source_word: מִתַּחַת סִבְלֹת מִצְרָיִם
  choice: मिस्र के बोझों के नीचे से
  rationale: מִתַּחַת की स्थानिक छवि और סִבְלֹת के बोझ/कठोर श्रम दोनों की अर्थ-सीमा को बनाए रखता है।
theological_decisions:
- issue: वाचा-सूत्र
  choice: अपनी प्रजा के रूप में अपनाऊँगा ... तुम्हारा परमेश्वर होऊँगा
  alternative: अपनी प्रजा होने के लिए ले लूँगा ... तुम्हारे लिए परमेश्वर होऊँगा
  rationale: चुना हुआ रूप संबंध और अपनेपन को आधुनिक हिन्दी में स्पष्ट करता है, पर बाद की किसी धर्मवैज्ञानिक व्यवस्था को पाठ में नहीं जोड़ता।
- issue: ईश्वरीय नाम
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में आए चतुरक्षरीय व्यक्तिगत नाम को नाम के रूप में प्रस्तुत किया गया है।
- issue: कृदंत הַמּוֹצִיא का कालगत बल
  choice: निकालता है
  alternative: निकाल लाया; निकालनेवाला है
  rationale: हिब्रू कृदंत जारी/विशिष्टकारी क्रिया या पूर्ण उद्धारक कार्य से बनी पहचान—दोनों की ओर संकेत कर सकता है। मुख्य पाठ चरित्रगत बल रखता है और वैकल्पिक प्रसंगगत-पश्चदृष्टि पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण किंतु सामान्य पाठक के लिए स्पष्ट। बहुवचन ‘तुम’ मूल के सामूहिक संबोधन को दर्शाता है। ‘प्रजा’ वाचा-संबंधी सामूहिक पहचान के लिए चुना गया है।
