  text: 'The sons of Kohath: Amram, Izhar, Hebron, and Uzziel. And the years of Kohath’s life were one hundred thirty-three years.'
translation:
  language: hi
  text: 'कहात के पुत्र: अम्राम, यिसहार, हेब्रोन और उज्जीएल। कहात की आयु एक सौ तैंतीस वर्ष थी।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי קְהָת
  choice: कहात के पुत्र
  rationale: בְּנֵי का अर्थ यहाँ वंशावली में कहात के सीधे पुत्र हैं। आरंभिक וּ को अलग से ‘और’ कहना हिंदी में अनावश्यक और अस्वाभाविक होगा; शीर्षक-सदृश विन्यास स्रोत के संबंध को स्पष्ट रखता है।
- source_word: עַמְרָם וְיִצְהָר וְחֶבְרוֹן וְעֻזִּיאֵל
  choice: अम्राम, यिसहार, हेब्रोन और उज्जीएल
  rationale: चारों व्यक्तिनामों का हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है; बार-बार आए וְ को हिंदी सूची की स्वाभाविक शैली में अल्पविरामों और अंतिम ‘और’ से व्यक्त किया गया है।
- source_word: וּשְׁנֵי חַיֵּי קְהָת
  choice: कहात की आयु ... थी
  rationale: शाब्दिक रूप ‘कहात के जीवन के वर्ष’ है, पर आधुनिक हिंदी में ‘कहात की आयु’ उसी अर्थ को संक्षिप्त, स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: שָׁלֹשׁ וּשְׁלֹשִׁים וּמְאַת שָׁנָה
  choice: एक सौ तैंतीस वर्ष
  rationale: हिब्रू संख्या-क्रम को हिंदी के सामान्य क्रम में रखा गया है; संयुक्त संख्या के बाद हिब्रू के एकवचन שָׁנָה को हिंदी में स्वाभाविक ‘वर्ष’ से व्यक्त किया गया है।
