  text: 'The sons of Korah: Assir[a], Elkanah, and Abiasaph. These are the clans of the Korahites.'
translation:
  language: hi
  text: 'कोरह के पुत्र थे: अस्सीर, एलकाना और अबीआसाप। ये कोरहियों के कुल[a] थे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “परिवार।” यहाँ इब्रानी शब्द का अर्थ किसी गोत्र के भीतर विस्तृत पारिवारिक समूह भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי קֹרַח
  choice: कोरह के पुत्र थे
  rationale: בְּנֵי का सीधा अर्थ ‘पुत्र’ है और यहाँ तीन व्यक्तियों की तत्काल सूची दी गई है। आरंभिक וּ को अलग से ‘और’ कहना हिन्दी में इस वंशावली-पंक्ति को अनावश्यक रूप से बोझिल बनाता; हिन्दी वाक्य की स्पष्टता के लिए निहित योजक क्रिया ‘थे’ जोड़ी गई है।
- source_word: אַסִּיר
  choice: अस्सीर
  rationale: यहाँ यह व्यक्ति का नाम है; दोगुने व्यंजन को हिन्दी लिप्यंतरण में ‘स्स’ से दर्शाया गया है।
- source_word: אֶלְקָנָה
  choice: एलकाना
  rationale: व्यक्तिवाचक नाम का स्रोत-रूप के निकट और हिन्दी में सुबोध लिप्यंतरण।
- source_word: אֲבִיאָסָף
  choice: अबीआसाप
  rationale: व्यक्तिवाचक नाम का स्रोत-आधारित लिप्यंतरण; अंतिम פ यहाँ ‘प’ ध्वनि देता है।
- source_word: מִשְׁפְּחֹת
  choice: कुल
  rationale: वंशावली और गोत्रीय संदर्भ में यह शब्द विस्तृत नातेदारी-समूहों को बताता है। आधुनिक हिन्दी में ‘कुल’ इस अर्थ को ‘परिवार’ से अधिक ठीक व्यक्त करता है।
- source_word: הַקָּרְחִי
  choice: कोरहियों के
  rationale: यह कोरह के वंश अथवा समूह से संबंधित लोगों के लिए जातिवाचक रूप है; हिन्दी में बहुवचन ‘कोरहियों’ स्वाभाविक है।
