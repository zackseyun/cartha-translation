id: EXO.6.11
reference: Exodus 6:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בֹּ֣א דַבֵּ֔ר אֶל פַּרְעֹ֖ה מֶ֣לֶךְ מִצְרָ֑יִם וִֽ/ישַׁלַּ֥ח אֶת בְּנֵֽי יִשְׂרָאֵ֖ל מֵ/אַרְצֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/011.yaml
  text: Go[a], speak to Pharaoh king of Egypt, that he may let the sons of Israel go out from his land.
translation:
  language: hi
  text: जा, मिस्र के राजा फ़िरौन से कह कि वह इस्राएल के पुत्रों[a] को अपने देश से जाने दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस्राएलियों” अथवा “इस्राएल की सन्तान”। हिब्रू में शाब्दिक रूप से “इस्राएल के पुत्रों” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בֹּא
  choice: जा
  rationale: בוא का पुल्लिंग एकवचन आज्ञार्थक रूप है। प्रसंग में मूसा को फ़िरौन के पास भेजा जा रहा है, इसलिए स्वाभाविक हिन्दी में ‘जा’ उपयुक्त है; ‘आ’ इस दृष्टिकोण से अस्वाभाविक होगा।
- source_word: דַבֵּר אֶל
  choice: से कह
  rationale: शाब्दिक रूप से ‘से बोल’ सम्भव है, पर हिन्दी में किसी व्यक्ति को संदेश देने की आज्ञा के लिए ‘से कह’ अधिक स्वाभाविक है और संबोधन का भाव बनाए रखता है।
- source_word: פַּרְעֹה מֶלֶךְ מִצְרָיִם
  choice: मिस्र के राजा फ़िरौन
  rationale: यह हिन्दी में स्वाभाविक विशेषणात्मक क्रम है और फ़िरौन की पहचान मिस्र के राजा के रूप में स्पष्ट रखता है।
- source_word: וִישַׁלַּח
  choice: कि वह ... जाने दे
  rationale: आज्ञार्थक क्रिया के बाद आया यह रूप मूसा के कथन की अपेक्षित विषयवस्तु अथवा परिणाम बताता है। ‘जाने दे’ इस प्रसंग में שׁלח के मुक्त करके भेजने के भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: हिब्रू पारिवारिक अभिव्यक्ति का निकट रूप रखा गया है। प्रसंग में यह याकूब/इस्राएल के वंशज समुदाय का जातीय नाम भी है, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: מֵאַרְצוֹ
  choice: अपने देश से
  rationale: सर्वनाम का कर्ता फ़िरौन है; हिन्दी में उसी कर्ता की भूमि के लिए ‘अपने देश से’ अधिक स्वाभाविक और स्पष्ट है।
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל का सामुदायिक और पारिवारिक अर्थ
  choice: इस्राएल के पुत्रों
  alternative: इस्राएली; इस्राएल की सन्तान
  rationale: मुख्य पाठ में मूल की पारिवारिक संरचना सुरक्षित रखी गई है, जबकि पादटिप्पणी यह स्पष्ट करती है कि अभिव्यक्ति पूरे इस्राएली समुदाय को सूचित करती है। इससे मूल का रूप और प्रसंगगत अर्थ दोनों बने रहते हैं।
- issue: וִישַׁלַּח का वाक्यगत संबंध
  choice: कि वह ... जाने दे
  alternative: और वह ... भेज देगा
  rationale: यहाँ रूप को केवल भविष्यवाणी मानने के बजाय मूसा द्वारा फ़िरौन से कही जाने वाली माँग की विषयवस्तु के रूप में प्रस्तुत किया गया है। प्रसंग इसी निर्देशात्मक अर्थ का समर्थन करता है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। एक व्यक्ति से सीधी आज्ञा होने के कारण ‘जा’ और ‘कह’ का एकवचन रूप प्रयुक्त है। ‘फ़िरौन’ और ‘इस्राएल’ मानक हिन्दी बाइबलीय नाम-रूप हैं।
