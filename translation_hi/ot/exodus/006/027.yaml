  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘ये ही वे हैं’ और ‘ये वही ... हैं’ पद के आरंभ और अंत की बलयुक्त पहचान को बनाए रखते हैं। ‘बात करते थे’ कृदंत के चरित्रसूचक पक्ष को साधारण भूतकाल ‘बात की’ की अपेक्षा बेहतर सुरक्षित करता है।
