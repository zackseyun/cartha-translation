source:
  edition: WLC
  text: הֵ֗ם הַֽ/מְדַבְּרִים֙ אֶל פַּרְעֹ֣ה מֶֽלֶךְ מִצְרַ֔יִם לְ/הוֹצִ֥יא אֶת בְּנֵֽי יִשְׂרָאֵ֖ל מִ/מִּצְרָ֑יִם ה֥וּא מֹשֶׁ֖ה וְ/אַהֲרֹֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/027.yaml
  text: These are the ones who spoke to Pharaoh king of Egypt to bring the sons of Israel out of Egypt—this is Moses and Aaron[a][b].
translation:
  language: hi
  text: ये ही वे हैं जो इस्राएल के पुत्रों[a] को मिस्र से निकाल लाने के लिए मिस्र के राजा फ़िरौन से बात करते थे[b]—ये वही मूसा और हारून हैं[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक मुहावरेदार अनुवाद: ‘इस्राएलियों’। इब्रानी में शाब्दिक अभिव्यक्ति ‘इस्राएल के पुत्र’ है।'
    reason: lexical_alternative
  - marker: b
    text: या, अधिक शाब्दिक रूप से, ‘जो फ़िरौन से बोल रहे थे’। इब्रानी में यहाँ कृदंत है, जो उन्हें इस कार्य से पहचाने जाने वालों के रूप में प्रस्तुत करता है।
    reason: lexical_alternative
  - marker: c
    text: 'इब्रानी में पहचानसूचक सर्वनाम एकवचन है: शाब्दिक रूप से, ‘वह मूसा और हारून है’; इसके बाद दो नाम होने के कारण हिन्दी में बहुवचन वाक्य स्वाभाविक है।'
    reason: source_form
lexical_decisions:
- source_word: הֵם
  choice: ये ही वे हैं
  rationale: स्वतंत्र बहुवचन सर्वनाम पहले बताए गए व्यक्तियों की ओर बलपूर्वक संकेत करके उनकी पहचान कराता है; आधुनिक हिन्दी में ‘ये ही वे हैं’ इस प्रदर्शनात्मक और पुनरुल्लेखात्मक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַמְדַבְּרִים
  choice: जो ... बात करते थे
  rationale: संज्ञा के रूप में प्रयुक्त कृदंत मूसा और हारून को फ़िरौन से बोलने वाले व्यक्तियों के रूप में निरंतर चित्रित करता है। ‘बात करते थे’ हिन्दी में इस चरित्रसूचक, चलते रहे कार्य को सहजता से व्यक्त करता है।
- source_word: אֶל
  choice: से
  rationale: ‘बात करना’ के साथ आधुनिक हिन्दी में संबोधित व्यक्ति के लिए ‘से’ स्वाभाविक परसर्ग है; इसका आशय फ़िरौन को संबोधित करना है।
- source_word: פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: मिस्र के राजा फ़िरौन
  rationale: हिन्दी की स्वाभाविक पद-व्यवस्था में राजकीय उपाधि नाम से पहले रखी गई है, जबकि मूल का अर्थ और संबंध सुरक्षित है।
- source_word: לְהוֹצִיא
  choice: निकाल लाने के लिए
  rationale: हिफ़ील रूप का कारणवाचक अर्थ ‘बाहर निकालना/ले आना’ है। ‘निकाल लाने’ से मिस्र के भीतर से बाहर लाने का भाव स्पष्ट और स्वाभाविक रहता है, बिना इसे केवल ‘अगुवाई करने’ तक सीमित किए।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: यह इब्रानी के पुरुषवाचक बहुवचन रचना ‘इस्राएल के पुत्र’ को पारदर्शी रूप से रखता है। अधिक मुहावरेदार ‘इस्राएलियों’ को पादटिप्पणी में दिया गया है।
- source_word: מִמִּצְרָיִם
  choice: मिस्र से
  rationale: ‘निकाल लाने’ के साथ ‘मिस्र से’ स्रोत-स्थान और निर्गमन, दोनों को स्पष्ट करता है।
- source_word: הוּא
  choice: ये वही ... हैं
  rationale: इब्रानी में एकवचन सर्वनाम संयुक्त नामों से पहले पहचानसूचक पुनरुल्लेख करता है। हिन्दी में बहुवचन व्यक्तियों के साथ ‘ये वही ... हैं’ व्याकरणसम्मत और स्वाभाविक है; मूल का असामान्य एकवचन पादटिप्पणी में सुरक्षित किया गया है।
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: मूसा और हारून
  rationale: हिन्दी बाइबिल परंपरा में प्रचलित और सामान्य पाठकों को परिचित नामरूप अपनाए गए हैं।
