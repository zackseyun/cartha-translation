id: EXO.6.29
reference: Exodus 6:29
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יְדַבֵּ֧ר יְהוָ֛ה אֶל מֹשֶׁ֥ה לֵּ/אמֹ֖ר אֲנִ֣י יְהוָ֑ה דַּבֵּ֗ר אֶל פַּרְעֹה֙ מֶ֣לֶךְ מִצְרַ֔יִם אֵ֛ת כָּל אֲשֶׁ֥ר אֲנִ֖י דֹּבֵ֥ר אֵלֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/029.yaml
  text: Then Yahweh spoke to Moses[a], saying, “I am Yahweh. Speak to Pharaoh king of Egypt all that I speak to you.”
translation:
  language: hi
  text: तब यहवे ने मूसा से कहा, “मैं यहवे हूँ। मिस्र के राजा फ़िरौन से वह सब कह जो मैं तुझसे कह रहा हूँ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: तब ... कहा
  rationale: वाव-क्रमवाचक कथा को आगे बढ़ाता है; हिंदी में ‘तब ... कहा’ स्वाभाविक कथा-प्रगति और बोलने की क्रिया दोनों व्यक्त करता है।
- source_word: יְהוָה
  choice: यहवे
  rationale: परमेश्वर के व्यक्तिगत नाम चतुराक्षर को उपाधि से बदलने के बजाय हिंदी में निकट लिप्यंतरण के रूप में रखा गया है।
- source_word: לֵאמֹר
  choice: कहा
  rationale: यह रूप प्रत्यक्ष कथन का परिचय देता है; हिंदी में मुख्य क्रिया के साथ ‘कहा’ इसे स्वाभाविक ढंग से व्यक्त करता है, अलग से ‘यह कहते हुए’ कहना अनावश्यक रूप से भारी होता।
- source_word: אֲנִי יְהוָה
  choice: मैं यहवे हूँ
  rationale: इब्रानी के क्रियारहित आत्म-परिचय को हिंदी की आवश्यक सहायक क्रिया ‘हूँ’ के साथ स्पष्ट रूप से प्रस्तुत किया गया है।
- source_word: דַּבֵּר
  choice: कह
  rationale: आज्ञार्थक रूप और संदेश पहुँचाने के आशय को सहज हिंदी में व्यक्त करता है; एकवचन निकट संबोधन ‘तू’ के अनुरूप रूप रखा गया है।
- source_word: פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: मिस्र के राजा फ़िरौन
  rationale: इब्रानी समानाधिकरण को अर्थ-सटीक और स्वाभाविक हिंदी शब्दक्रम में रखा गया है।
- source_word: אֵת כָּל אֲשֶׁר
  choice: वह सब
  rationale: कहे जाने वाले संदेश की संपूर्ण विषयवस्तु को संक्षिप्त, प्रचलित हिंदी में व्यक्त करता है।
- source_word: אֲנִי דֹּבֵר אֵלֶיךָ
  choice: जो मैं तुझसे कह रहा हूँ
  rationale: वर्तमान कृदंत דֹּבֵר की चालू/वर्तमान क्रिया को हिंदी के प्रगतिशील रूप से व्यक्त किया गया है और דבר की पुनरावृत्ति को ‘कह ... कह रहा हूँ’ में यथासंभव सुरक्षित रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत ईश्वरीय नाम का स्पष्ट प्रयोग करता है। ‘यहवे’ उसे किसी उपाधि से बदले बिना आधुनिक हिंदी में निकट लिप्यंतरण के रूप में सुरक्षित रखता है।
- issue: अपूर्ण/वर्तमान कृदंत דֹּבֵר का कालगत बल
  choice: कह रहा हूँ
  alternative: कहता हूँ
  rationale: कृदंत वर्तमान या जारी वाणी का संकेत दे सकता है। संदर्भ में ‘कह रहा हूँ’ इस पहलू को स्वाभाविक हिंदी में सामने रखता है, जबकि सामान्य वर्तमान भी व्याकरणतः संभव है।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण किंतु सरल। मूसा के लिए एकवचन निकट संबोधन ‘तू/तुझसे’ मूल के एकवचन को स्पष्ट रखता है। ‘फ़िरौन’ और ‘मिस्र’ प्रचलित बाइबिलीय हिंदी रूप हैं। कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि participle की चुनी हुई व्याख्या मुख्य पाठ में सीधे और स्वाभाविक रूप से दी जा सकती है।
