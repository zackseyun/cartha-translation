base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/020.yaml
  text: Amram took Jochebed[a], his father’s sister, as his wife, and she bore to him Aaron and Moses. The years of Amram’s life were 137 years.
translation:
  language: hi
  text: अम्राम ने अपनी बुआ योकेबेद को पत्नी बनाया, और उसने हारून और मूसा को जन्म दिया। अम्राम की आयु 137 वर्ष थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח ... לְאִשָּׁה
  choice: पत्नी बनाया
  rationale: शाब्दिक अर्थ ‘पत्नी के रूप में लिया’ है; आधुनिक हिंदी में ‘पत्नी बनाया’ विवाह-संदर्भ को स्वाभाविक और संक्षिप्त रूप से व्यक्त करता है।
- source_word: דֹּדָתוֹ
  choice: अपनी बुआ
  rationale: स्त्रीलिंग संबंधवाचक शब्द यहाँ पिता की बहन को सूचित करता है; हिंदी में ‘बुआ’ इस संबंध को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וַתֵּלֶד לוֹ
  choice: उसने उसके लिए ... को जन्म दिया
  rationale: यह चयन हिब्रू के अप्रत्यक्ष कर्म לוֹ को बनाए रखता है, यद्यपि हिंदी में कुछ औपचारिकता आती है।
- source_word: שְׁנֵי חַיֵּי עַמְרָם
  choice: अम्राम की आयु
  rationale: हिब्रू का शाब्दिक रूप ‘अम्राम के जीवन के वर्ष’ है; ‘आयु’ आधुनिक हिंदी में उसी अर्थ का सहज वंशावली-सूचक रूप है।
- source_word: שֶׁבַע וּשְׁלֹשִׁים וּמְאַת שָׁנָה
  choice: 137 वर्ष
  rationale: संख्यात्मक मूल्य को ठीक रखते हुए आधुनिक पाठक के लिए स्पष्ट अंक-रूप अपनाया गया है।
- source_word: עַמְרָם / יוֹכֶבֶד / אַהֲרֹן / מֹשֶׁה
  choice: अम्राम / योकेबेद / हारून / मूसा
  rationale: नामों को हिंदी बाइबल-प्रयोग और स्रोत उच्चारण के संतुलन के साथ देवनागरी में रखा गया है।
theological_decisions:
- issue: बाद की व्यवस्था में निषिद्ध निकट संबंध वाले विवाह का वर्णन
  choice: अपनी बुआ
  alternative: अपनी निकट संबंधी स्त्री
  rationale: पद वंशावली का तथ्य बिना नैतिक टिप्पणी के बताता है। अनुवाद संबंध को न नरम करता है, न उस पर कोई अतिरिक्त धार्मिक निर्णय जोड़ता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिंदी; वंशावली की संक्षिप्त शैली बनाए रखी गई है।
