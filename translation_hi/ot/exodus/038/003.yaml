  - marker: b
    text: ‘काँसा’ के लिए ‘ताँबा’ भी एक संभावित अर्थ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּלֵי הַמִּזְבֵּחַ
  choice: वेदी के सभी उपकरण
  rationale: כְּלִי यहाँ वेदी की सेवा में प्रयुक्त विविध वस्तुओं का व्यापक नाम है; ‘उपकरण’ सूची में आनेवाली सभी वस्तुओं को स्वाभाविक और स्पष्ट रूप से समेटता है।
- source_word: הַמִּזְבֵּחַ
  choice: वेदी
  rationale: बलि और पवित्र-स्थान संबंधी प्रसंग में מִזְבֵּחַ का मानक और सहज हिन्दी रूप ‘वेदी’ है।
- source_word: הַסִּירֹת
  choice: हंडियाँ
  rationale: סִירוֹת सामान्यतः पकाने या सामग्री रखने के पात्रों को दर्शाता है। वेदी के संदर्भ में ये राख हटाने के पात्र हो सकते हैं, पर मूल शब्द स्वयं ‘राख’ नहीं कहता।
- source_word: הַיָּעִים
  choice: फावड़े
  rationale: יַע उठाने या हटाने के काम आनेवाले फावड़े-जैसे औजार को दर्शाता है; वेदी की सेवा के संदर्भ में ‘फावड़े’ स्वाभाविक है।
- source_word: הַמִּזְרָקֹת
  choice: कटोरे
  rationale: מִזְרָקֹת अनुष्ठान में द्रव, विशेषकर रक्त, रखने या छिड़कने के पात्र थे। ‘कटोरे’ आधुनिक हिन्दी में स्पष्ट है और मूल से अधिक तकनीकी अर्थ नहीं जोड़ता।
- source_word: הַמִּזְלָגֹת
  choice: काँटे
  rationale: מִזְלָגֹת काँटे-जैसे उपकरणों को दर्शाता है। ‘मांस के काँटे’ कहना तत्काल मूल-पाठ से अधिक विशिष्ट होगा।
- source_word: הַמַּחְתֹּת
  choice: अंगारदान
  rationale: מַחְתָּה आग या अंगारे उठाने और ले जाने का पात्र है; ‘अंगारदान’ इसका कार्य संक्षेप में और सहजता से व्यक्त करता है।
- source_word: כָּל כֵּלָיו
  choice: उसके सभी उपकरण
  rationale: सर्वनाम वेदी की ओर संकेत करता है; पहले प्रयुक्त ‘उपकरण’ को दोहराने से मूल की पुनरुक्ति और शब्दगत संगति बनी रहती है।
- source_word: נְחֹשֶׁת
  choice: काँसा
  rationale: प्राचीन पवित्र-स्थान की धातु-सामग्री के संदर्भ में נְחֹשֶׁת का पारंपरिक और संभावित अर्थ ‘काँसा’ है; ‘ताँबा’ भी शब्दार्थ की दृष्टि से संभव है।
- source_word: וַיַּעַשׂ ... עָשָׂה
  choice: उसने ... बनाए— ... उसने ... बनाए
  rationale: मूल में עשה दो बार आया है। दोनों को बनाए रखने से आरंभिक कथन और अंत के सारात्मक कथन की इब्रानी संरचना सुरक्षित रहती है।
