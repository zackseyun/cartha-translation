reference: Exodus 38:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/בְצַלְאֵ֛ל בֶּן אוּרִ֥י בֶן ח֖וּר לְ/מַטֵּ֣ה יְהוּדָ֑ה עָשָׂ֕ה אֵ֛ת כָּל אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/022.yaml
  text: And Bezalel son of Uri[a], son of Hur, of the tribe of Judah, made all that Yahweh had commanded Moses.
translation:
  language: hi
  text: और यहूदा के गोत्र के ऊरी का पुत्र, हूर का पोता बसलेल ने वह सब बनाया, जिसकी आज्ञा याहवे[a] ने मूसा को दी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में: ‘YHWH’; परंपरागत रूप से इसका अनुवाद ‘प्रभु’ किया जाता है।'
    reason: ईश्वरीय नाम के पारंपरिक वैकल्पिक रूप को बताना।
lexical_decisions:
- source_word: וּ/בְצַלְאֵל
  choice: और ... बसलेल
  rationale: वाव को पूर्ववर्ती वर्णन से कथात्मक संबंध बनाए रखने के लिए ‘और’ कहा गया है; व्यक्ति के नाम का प्रचलित हिन्दी लिप्यंतरण ‘बसलेल’ रखा गया है।
- source_word: בֶּן אוּרִי בֶן חוּר
  choice: हूर के पोते, ऊरी के पुत्र
  rationale: 'वंशावली में दो बार आए בֶּן का संबंध हिन्दी में स्वाभाविक और स्पष्ट रूप से व्यक्त किया गया है: बसलेल ऊरी का पुत्र और हूर का पोता है।'
- source_word: לְ/מַטֵּה יְהוּדָה
  choice: यहूदा के गोत्र के
  rationale: जनजातीय संबद्धता के इस संदर्भ में מַטֶּה का अर्थ ‘गोत्र’ है; לְ संबंध या सदस्यता दर्शाता है।
- source_word: עָשָׂה
  choice: बनाया
  rationale: मिलापवाले तम्बू के निर्माण-संदर्भ में व्यापक क्रिया עשה के लिए ‘बनाया’ ठोस कारीगरी को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֵת כָּל אֲשֶׁר
  choice: वह सब, जिसकी
  rationale: यह पदबंध आदेश की संपूर्ण विषय-वस्तु को समेटता है; हिन्दी में ‘वह सब, जिसकी आज्ञा...’ सहज और व्यापक है।
- source_word: צִוָּה
  choice: आज्ञा ... दी थी
  rationale: हिन्दी का पूर्ण भूतकाल स्पष्ट करता है कि याहवे की आज्ञा बसलेल के निर्माण-कार्य से पहले दी गई थी, यद्यपि इब्रानी सिद्ध क्रिया स्वयं इस काल-भेद को अनिवार्य नहीं करती।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले परमेश्वर के निजी नाम का हिन्दी लिप्यंतरण किया गया है, उसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: אֶת מֹשֶׁה
  choice: मूसा को
  rationale: इस क्रिया-रचना में אֶת मूसा को आज्ञा के प्राप्तकर्ता के रूप में चिह्नित करता है; हिन्दी में ‘मूसा को आज्ञा दी’ स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में निजी वाचा-नाम सीधे प्रयुक्त हुआ है। ‘याहवे’ उसका लिप्यंतरण है और नाम को उपाधि ‘प्रभु’ में बदलने से बचाता है; पारंपरिक विकल्प पादटिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। इब्रानी का नाम-क्रम हिन्दी में स्पष्ट रिश्तों—‘हूर के पोते, ऊरी के पुत्र’—के रूप में दिया गया है, जबकि गोत्रीय संबद्धता और कथात्मक ‘और’ सुरक्षित हैं।
