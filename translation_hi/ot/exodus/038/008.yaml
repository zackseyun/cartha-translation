  text: וַ/יַּ֗עַשׂ אֵ֚ת הַ/כִּיּ֣וֹר נְחֹ֔שֶׁת וְ/אֵ֖ת כַּנּ֣/וֹ נְחֹ֑שֶׁת בְּ/מַרְאֹת֙ הַ/צֹּ֣בְאֹ֔ת אֲשֶׁ֣ר צָֽבְא֔וּ פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/008.yaml
  text: He made the basin of bronze and its stand of bronze from the mirrors of the women who served at the entrance to the tent of meeting[a][b].
translation:
  language: hi
  text: उसने काँसे का हौद और उसका काँसे का आधार उन स्त्रियों के दर्पणों से बनाया, जो मिलापवाले तंबू के प्रवेश-द्वार पर सेवा करती थीं[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो मिलापवाले तंबू के प्रवेश-द्वार पर इकट्ठी होती थीं।” इब्रानी में संगठित रूप से इकट्ठा होने और सेवा करने—दोनों का भाव हो सकता है।
    reason: alternative_reading
  - marker: b
    text: प्राचीन दर्पण सामान्यतः काँच के नहीं, बल्कि चमकाए हुए काँसे के होते थे।
    reason: cultural_note
lexical_decisions:
- source_word: כִּיּוֹר
  choice: हौद
  rationale: यह मिलापवाले तंबू की सेवा में धोने के लिए प्रयुक्त बड़े पात्र को दर्शाता है। ‘हौद’ आधुनिक हिन्दी में सहज और संदर्भानुकूल है।
- source_word: כַּן
  choice: आधार
  rationale: यह हौद को सहारा देने वाले ढाँचे या पाये को दर्शाता है; ‘आधार’ स्पष्ट और स्वाभाविक हिन्दी है।
- source_word: נְחֹשֶׁת
  choice: काँसा
  rationale: पवित्र तंबू के सामान के संदर्भ में यह प्रचलित और संभावित धातु है, यद्यपि इब्रानी शब्द ताँबे अथवा ताँबे की मिश्रधातु को व्यापक रूप से दर्शा सकता है।
- source_word: בְּמַרְאֹת
  choice: दर्पणों से
  rationale: 'यहाँ उपसर्ग בְ को सामग्री या स्रोत के अर्थ में लिया गया है: हौद और उसका आधार दर्पणों से बनाए गए।'
- source_word: הַצֹּבְאֹת אֲשֶׁר צָבְאוּ
  choice: जो ... सेवा करती थीं
  rationale: צבא धातु का यह प्रयोग संगठित रूप से उपस्थित होकर सेवा करने का भाव दे सकता है। ‘सेवा करती थीं’ उद्देश्यपूर्ण कार्य को व्यक्त करता है, पर कोई औपचारिक याजकीय पद नहीं जोड़ता।
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: मिलापवाले तंबू के प्रवेश-द्वार पर
  rationale: यह पवित्र तंबू से जुड़े स्थान का स्पष्ट और हिन्दी बाइबलीय परंपरा में परिचित रूप है।
- source_word: וַיַּעַשׂ
  choice: उसने ... बनाया
  rationale: एकवचन कर्ता और इब्रानी कथात्मक क्रिया को स्वाभाविक हिन्दी भूतकाल में रखा गया है।
theological_decisions:
- issue: הַצֹּבְאֹת אֲשֶׁר צָבְאוּ में स्त्रियों की भूमिका
  choice: जो मिलापवाले तंबू के प्रवेश-द्वार पर सेवा करती थीं
  alternative: जो मिलापवाले तंबू के प्रवेश-द्वार पर इकट्ठी होती थीं
  rationale: मूल धातु संगठित रूप से एकत्र होने और सेवा करने—दोनों का भाव दे सकती है। मुख्य पाठ में ‘सेवा’ संदर्भानुकूल है, जबकि पाद-टिप्पणी वास्तविक शाब्दिक अस्पष्टता बनाए रखती है और औपचारिक याजकीय भूमिका आरोपित नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। ‘हौद’, ‘आधार’ और ‘प्रवेश-द्वार’ ठोस वस्तुओं तथा स्थान को स्पष्ट करते हैं; ‘सेवा करती थीं’ के साथ पाद-टिप्पणी मूल की अस्पष्टता सुरक्षित रखती है।
