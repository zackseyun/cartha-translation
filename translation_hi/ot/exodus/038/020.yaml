    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל
  choice: और ... सभी
  rationale: संयोजक וְ और बहुवचन के साथ כָל का सामूहिक अर्थ स्वाभाविक रूप से ‘और ... सभी’ है।
- source_word: הַיְתֵדֹת
  choice: खूँटियाँ
  rationale: יָתֵד यहाँ ढाँचे और आँगन को स्थिर रखने वाली खूँटियों को दर्शाता है; आधुनिक हिन्दी में ‘खूँटियाँ’ स्पष्ट और सहज है।
- source_word: לַמִּשְׁכָּן
  choice: निवास-स्थान
  rationale: מִשְׁכָּן का मूल अर्थ ‘निवास-स्थान’ है और निर्गमन के पवित्र तंबू का संकेत करता है; यह हिन्दी में अर्थपूर्ण और गरिमापूर्ण है।
- source_word: וְלֶחָצֵר סָבִיב
  choice: तथा उसके चारों ओर के आँगन की
  rationale: חָצֵר पवित्र निवास के घेरे हुए आँगन को और סָבִיב उसकी चारों ओर की स्थिति को व्यक्त करता है। ‘उसके’ संदर्भगत संबंध को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: נְחֹשֶׁת
  choice: काँसा
  rationale: इस प्रसंग में נְחֹשֶׁת का पारंपरिक और संदर्भानुकूल अनुवाद ‘काँसा’ है, यद्यपि यह शब्द ताँबे को भी सूचित कर सकता है।
