  text: And with the one thousand seven hundred and seventy-five he made hooks for the pillars[a], overlaid their tops, and made bands for them.
translation:
  language: hi
  text: और एक हज़ार सात सौ पचहत्तर से उसने खम्भों के लिए कुंडे बनाए, उनके सिरों को मढ़ा, और उन पर पट्टियाँ लगाईं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֶת הָאֶלֶף וּשְׁבַע הַמֵּאוֹת וַחֲמִשָּׁה וְשִׁבְעִים
  choice: और बचे हुए एक हज़ार सात सौ पचहत्तर शेकेल चाँदी से
  rationale: पिछले पद में कुल चाँदी से सौ किक्कार ढालने के बाद बची 1,775 शेकेल चाँदी का हिसाब जारी है। मूल में माप और धातु इस पद में दोहराए नहीं गए, पर हिन्दी में स्पष्टता के लिए संदर्भ से जोड़े गए हैं।
- source_word: עָשָׂה
  choice: उसने ... बनाए
  rationale: निर्माण-संदर्भ में עשה का स्वाभाविक और सीधा हिन्दी रूप।
- source_word: וָוִים
  choice: काँटे
  rationale: निवास-स्थान के खम्भों से जुड़े धातु के hooks के लिए साधारण, समझने योग्य हिन्दी शब्द।
- source_word: לָעַמּוּדִים
  choice: खम्भों के लिए
  rationale: עמודים यहाँ संरचनात्मक खम्भों को दर्शाता है; 'खम्भे' आधुनिक हिन्दी में स्वाभाविक है।
- source_word: וְצִפָּה רָאשֵׁיהֶם
  choice: उनके ऊपरी सिरों पर चाँदी मढ़ी
  rationale: צפה धातु मढ़ने का द्योतक है और ראשיהם शाब्दिक रूप से 'उनके सिर' है। संदर्भ से धातु चाँदी है; 'ऊपरी सिरों' से वस्तु का भाग स्पष्ट रहता है।
- source_word: וְחִשַּׁק אֹתָם
  choice: और उन पर पट्टियाँ लगाईं
  rationale: पिएल क्रिया חִשַּׁק यहाँ खम्भों को धातु की पट्टियों या घेरों से सज्जित करने का भाव देती है। यह रूप तकनीकी 'फिलेट' की अपेक्षा अधिक सुबोध है और अनावश्यक रूप से 'जोड़ने' का अर्थ निश्चित नहीं करता।
