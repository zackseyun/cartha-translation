  yaml_path: translation/ot/exodus/038/030.yaml
  text: With it he made the bases for the entrance of the tent of meeting[a], the bronze altar, the bronze grating for it[b], and all the utensils of the altar.
translation:
  language: hi
  text: उसी से उसने मिलापवाले तंबू के प्रवेश-द्वार के आधार[a], काँसे की वेदी, उसके लिए काँसे की जाली[b] और वेदी के सभी उपकरण बनाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सॉकेट”।
    reason: lexical_alternative
  - marker: b
    text: या “काँसे का जाल”।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: उसने ... बनाए
  rationale: सामान्य कथात्मक क्रिया עשה के लिए स्वाभाविक हिन्दी; संयुक्त कर्मों के साथ वाक्य के अंत में रखना हिन्दी में सहज है।
- source_word: בָּהּ
  choice: उसी से
  rationale: स्त्रीलिंग सर्वनाम पिछले पद में गिने गए काँसे की ओर संकेत करता है; यहाँ सामग्री अथवा साधन का भाव है। ‘उसी’ संदर्भ-संबंध को स्पष्ट करता है।
- source_word: אַדְנֵי
  choice: नींवें
  rationale: मिलापवाले तंबू के ढाँचे को थामने वाले धातु के आधार-सॉकेट अभिप्रेत हैं। ‘नींवें’ सामान्य पाठक के लिए बोधगम्य है; अधिक तकनीकी ‘खाँचेवाले आधार’ को पादटिप्पणी में रखा गया है।
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: मिलापवाले तंबू के प्रवेश-द्वार
  rationale: פֶּתַח प्रवेश अथवा द्वार को और אֹהֶל מוֹעֵד निर्धारित भेंट-स्थान के तंबू को दर्शाता है। ‘मिलापवाला तंबू’ हिन्दी बाइबलीय प्रयोग में परिचित और संक्षिप्त है।
- source_word: מִזְבַּח הַנְּחֹשֶׁת
  choice: काँसे की वेदी
  rationale: נְחֹשֶׁת के लिए प्रसंगानुकूल पारंपरिक धातु-संज्ञा ‘काँसा’ और מִזְבֵּחַ के लिए मानक ‘वेदी’ चुना गया है।
- source_word: מִכְבַּר הַנְּחֹשֶׁת
  choice: काँसे की जाली
  rationale: מִכְבָּר वेदी से जुड़ी जालीनुमा वस्तु है। ‘जाली’ आधुनिक हिन्दी में स्पष्ट है और उसकी संरचना बताती है, पर उसके सटीक रूप या स्थान को अनावश्यक रूप से निश्चित नहीं करती।
- source_word: אֲשֶׁר לוֹ
  choice: उसके लिए
  rationale: संक्षिप्त इब्रानी संबंधवाचक पद जाली और वेदी के संबंध को बताता है। ‘उसके लिए’ स्वाभाविक है और स्वामित्व या स्थान को आवश्यकता से अधिक निश्चित नहीं करता।
- source_word: כָּל כְּלֵי הַמִּזְבֵּחַ
  choice: वेदी के सभी उपकरण
  rationale: כְּלִים पूजा-संबंधी वस्तुओं और औजारों का व्यापक शब्द है; ‘उपकरण’ आधुनिक, गरिमापूर्ण और पर्याप्त व्यापक है।
