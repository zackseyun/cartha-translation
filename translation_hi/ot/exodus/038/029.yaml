  text: וּ/נְחֹ֥שֶׁת הַ/תְּנוּפָ֖ה שִׁבְעִ֣ים כִּכָּ֑ר וְ/אַלְפַּ֥יִם וְ/אַרְבַּע מֵא֖וֹת שָֽׁקֶל־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/029.yaml
  text: And the bronze of the wave offering was seventy talents and 2,400 shekels[a][b].
translation:
  language: hi
  text: और हिलाई जानेवाली भेंट[b] का काँसा[a] सत्तर किक्कार और 2,400 शेकेल था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘ताँबा’; इब्रानी शब्द נְחֹשֶׁת संदर्भ के अनुसार ताँबे या काँसे, दोनों को दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘हिलाई जानेवाली भेंट’ उस वस्तु के लिए पारिभाषिक शब्द है जिसे यहोवा के सामने विधिपूर्वक हिलाकर प्रस्तुत किया जाता था। इसका अधिक सामान्य अनुवाद ‘प्रस्तुत की गई भेंट’ या ‘अंशदान’ भी हो सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: נְחֹשֶׁת
  choice: काँसा
  rationale: यह इब्रानी शब्द ताँबे या काँसे के लिए प्रयुक्त हो सकता है। तम्बू के साज-सामान और धातु-कार्य की इस सूची में परंपरागत और संदर्भानुकूल अर्थ ‘काँसा’ है, जबकि वास्तविक धातु-संबंधी अस्पष्टता पादटिप्पणी में रखी गई है।
- source_word: הַתְּנוּפָה
  choice: हिलाई जानेवाली भेंट
  rationale: यह आराधना-संबंधी पारिभाषिक शब्द उस भेंट को दर्शाता है जिसे यहोवा के सामने विधिपूर्वक हिलाकर प्रस्तुत किया जाता था। यह चुनाव अनुष्ठानिक क्रिया को स्पष्ट रखते हुए सामान्य हिंदी पाठक के लिए बोधगम्य है।
- source_word: שִׁבְעִים כִּכָּר
  choice: सत्तर किक्कार
  rationale: כִּכָּר प्राचीन काल की बड़ी भार-इकाई है। आधुनिक भार में अनुमानित परिवर्तन करने के बजाय मूल प्राचीन इकाई को हिंदी बाइबलों में प्रचलित रूप ‘किक्कार’ में रखा गया है।
- source_word: וְאַלְפַּיִם וְאַרְבַּע מֵאוֹת שָׁקֶל
  choice: और 2,400 शेकेल
  rationale: שֶׁקֶל भार की प्राचीन मानक इकाई है; इसे ‘शेकेल’ के रूप में बनाए रखना मूल विवरण को पारदर्शी रखता है। अंक आधुनिक पठनीय शैली में दिए गए हैं।
- source_word: וּ
  choice: और
  rationale: आरंभिक संयोजक पिछले पद की सूची से इस धातु के योग को जोड़ता है; ‘और’ इस सीधे संबंध को स्वाभाविक हिंदी में बनाए रखता है।
