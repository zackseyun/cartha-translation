  text: Their pillars were twenty[a], and their twenty bases were bronze[b]; the hooks of the pillars and their bands were silver.
translation:
  language: hi
  text: उनके खंभे बीस थे और उनके बीस आधार[a] काँसे[b] के थे; खंभों के कुंडे और उनकी पट्टियाँ[c] चाँदी की थीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘खांचे’। ये वे खांचे या आधार थे जिनमें खंभे टिकाए जाते थे।
    reason: lexical_alternative
  - marker: b
    text: या ‘ताँबे’। इब्रानी शब्द ताँबे या ताँबे की मिश्रधातु, दोनों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी शब्द का सटीक अर्थ अनिश्चित है; इसका अर्थ खंभों की पट्टियाँ, घेरे, या उन्हें जोड़ने वाले डंडे हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמּוּדֵיהֶם
  choice: उनके खंभे
  rationale: עַמּוּדִים आँगन के परदों को थामने वाले खंभों को दर्शाता है। बहुवचन संबंधसूचक प्रत्यय को स्वाभाविक हिंदी में ‘उनके’ से व्यक्त किया गया है।
- source_word: אַדְנֵיהֶם
  choice: उनके ... आधार
  rationale: मिलापवाले तंबू के संदर्भ में אֶדֶן खंभे को टिकाने वाले आधार या खाने को दर्शाता है। आधुनिक पाठक के लिए ‘आधार’ स्पष्ट है; ‘खाने’ को पादटिप्पणी में रखा गया है।
- source_word: נְחֹשֶׁת
  choice: काँसा
  rationale: נְחֹשֶׁת ताँबे अथवा ताँबे की मिश्रधातु को दर्शा सकता है। इस प्रसंग में परंपरागत और संदर्भानुकूल अनुवाद ‘काँसा’ है, जबकि ‘ताँबा’ पादटिप्पणी में दिया गया है।
- source_word: וָוֵי
  choice: अंकुड़े
  rationale: यह शब्द खंभों पर लगे हुकनुमा जोड़ या उपकरणों को दर्शाता है। ‘अंकुड़े’ वस्तु के आकार और काम, दोनों को संक्षेप में व्यक्त करता है।
- source_word: חֲשֻׁקֵיהֶם
  choice: उनकी पट्टियाँ
  rationale: इस दुर्लभ स्थापत्य शब्द का आशय खंभों से जुड़ी पट्टियों, घेरों या जोड़ने वाले डंडों से हो सकता है। ‘पट्टियाँ’ भौतिक अर्थ को सहज हिंदी में बनाए रखता है और अनिश्चितता पादटिप्पणी में बताई गई है।
- source_word: כָּסֶף
  choice: चाँदी
  rationale: यह धातु का सामान्य और संदर्भ में निर्विवाद नाम है।
