lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: उसने बनाई
  rationale: कथात्मक क्रम में प्रयुक्त क्रिया का स्वाभाविक हिन्दी रूप; आरम्भिक वाव को अलग से ‘और’ कहना आवश्यक नहीं।
- source_word: לַמִּזְבֵּחַ
  choice: वेदी के लिए
  rationale: लामेद यहाँ उद्देश्य या गंतव्य दर्शाता है, स्थान नहीं।
- source_word: מִכְבָּר מַעֲשֵׂה רֶשֶׁת
  choice: जालीदार झंझरी
  rationale: मִכְבָּר को ‘झंझरी’ और उसके जाल-सदृश निर्माण को ‘जालीदार’ से व्यक्त किया गया है; इससे अनावश्यक पुनरुक्ति के बिना दोनों तत्व बने रहते हैं।
- source_word: נְחֹשֶׁת
  choice: काँसे की
  rationale: पवित्र-तम्बू के उपकरणों के प्रसंग में यह प्रचलित और संभावित धातु-संज्ञा है; ‘ताँबा’ भी शाब्दिक संभावना है।
- source_word: כַּרְכֻּבּוֹ
  choice: वेदी के कंगूरे
  rationale: यह वेदी के बाहर निकले हुए किनारे या घेर को दर्शाता है। ‘कंगूरा’ संरचनात्मक उभार को संक्षेप में व्यक्त करता है, यद्यपि सटीक रूप अनिश्चित है।
- source_word: מִלְּמַטָּה עַד חֶצְיוֹ
  choice: नीचे की ओर से उसकी आधी ऊँचाई तक
  rationale: ‘नीचे से उसके मध्य तक’ की स्थानिक सीमा को सहज हिन्दी में व्यक्त करता है और झंझरी के फैलाव को स्पष्ट करता है।
