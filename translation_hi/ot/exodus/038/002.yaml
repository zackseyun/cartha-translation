- source_word: וַיַּעַשׂ
  choice: उसने बनाए
  rationale: עשה का सामान्य आख्यानात्मक अर्थ ‘बनाना’ है; हिन्दी में कर्ता और बहुवचन कर्म ‘सींग’ के साथ यह स्वाभाविक है।
- source_word: קַרְנֹתָיו
  choice: उसके सींग
  rationale: קֶרֶן का ठोस अर्थ ‘सींग’ है और वेदी के कोनों पर बने सींग-जैसे उभारों के लिए यही पारंपरिक तथा स्पष्ट उपासना-संबंधी शब्द है।
- source_word: עַל אַרְבַּע פִּנֹּתָיו
  choice: उसके चारों कोनों पर
  rationale: עַל स्थान को व्यक्त करता है; ‘चारों कोनों पर’ मूल के निकट और सहज हिन्दी है।
- source_word: מִמֶּנּוּ הָיוּ קַרְנֹתָיו
  choice: उसके सींग उसी में से बने थे
  rationale: शाब्दिक संरचना ‘उसी में से उसके सींग थे’ बताती है कि सींग अलग बनाकर जोड़े नहीं गए थे। चुना हुआ रूप इस निर्माण-संबंधी अर्थ को स्पष्ट रखते हुए मूल अभिव्यक्ति के निकट है।
- source_word: וַיְצַף אֹתוֹ
  choice: और उसने उसे ... से मढ़ दिया
  rationale: צפה धातु यहाँ किसी वस्तु पर धातु की परत चढ़ाने के अर्थ में है; ‘मढ़ दिया’ आधुनिक हिन्दी में सटीक और स्वाभाविक है।
- source_word: נְחֹשֶׁת
  choice: काँसा
  rationale: נְחֹשֶׁת ताँबे या काँसे को सूचित कर सकता है। पवित्र निवास की सामग्री के संदर्भ में ‘काँसा’ पारंपरिक और प्रसंगानुकूल चुनाव है, जबकि वैकल्पिक अर्थ पाद-टिप्पणी में सुरक्षित है।
