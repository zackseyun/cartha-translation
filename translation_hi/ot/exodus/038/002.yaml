    text: शाब्दिक रूप से, “उसी में से उसके सींग थे”; अर्थात् सींग अलग से बनाकर जोड़े नहीं गए थे।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी शब्द नेख़ोशेत का अर्थ काँसा या ताँबा हो सकता है; पवित्र निवास के प्रसंग में सामान्यतः इसका अनुवाद “काँसा” किया जाता है।
    reason: lexical_alternative
