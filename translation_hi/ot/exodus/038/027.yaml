base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/027.yaml
  text: 'The hundred talents of silver were for casting the bases of the sanctuary and the bases of the veil: one hundred bases for the hundred talents[b][a], a talent for each base.'
translation:
  language: hi
  text: चाँदी के सौ किक्कार पवित्र निवास-स्थान के आधारों[a] और परदे[b] के आधारों को ढालने के काम आए—सौ किक्कार के लिए सौ आधार, अर्थात् प्रत्येक आधार के लिए एक किक्कार।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘आधारों’ के स्थान पर ‘आधार-खाँचे’ भी कहा जा सकता है; ये निवास-स्थान की धातु की नींव के भाग थे।
    reason: lexical_alternative
  - marker: b
    text: यह ‘परदा’ वह भीतरी परदा था जो पवित्र स्थान को परमपवित्र स्थान से अलग करता था।
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי
  choice: काम आए
  rationale: इस लेखा-विवरण में क्रिया चाँदी के उपयोग को बताती है; हिंदी में ‘काम आए’ इस आशय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מְאַת כִּכַּר הַכֶּסֶף
  choice: चाँदी के सौ किक्कार
  rationale: मूल पाठ की निश्चित संख्या और भार-माप को सुरक्षित रखा गया है; ‘किक्कार’ को प्राचीन भार-इकाई के रूप में लिप्यंतरित किया गया है।
- source_word: לָצֶקֶת
  choice: ढालने
  rationale: धातुकर्म के प्रसंग में यह पिघली धातु को साँचे में डालकर वस्तुएँ बनाने को दर्शाता है।
- source_word: אַדְנֵי
  choice: आधारों
  rationale: यह निवास-स्थान के ढाँचों और परदे के खंभों के नीचे लगी धातु की नींव-सदृश वस्तुओं के लिए है; ‘आधार’ आधुनिक हिंदी में स्पष्ट है।
- source_word: הַקֹּדֶשׁ
  choice: पवित्र-स्थान
  rationale: यहाँ शब्द पवित्र निवास-ढाँचे की ओर संकेत करता है; अनावश्यक रूप से इसे केवल किसी एक अंदरूनी कक्ष तक सीमित नहीं किया गया।
- source_word: הַפָּרֹכֶת
  choice: परदा
  rationale: यह सामान्य परदा नहीं, बल्कि पवित्र स्थान और परमपवित्र स्थान को अलग करने वाला भीतरी परदा है; मुख्य पाठ में सहज शब्द रखा और विशेष अर्थ टिप्पणी में स्पष्ट किया गया है।
- source_word: לִמְאַת הַכִּכָּר
  choice: सौ किक्कार से
  rationale: पूर्वसर्ग यहाँ प्रयुक्त मात्रा और उससे बने आधारों के पारस्परिक संबंध को व्यक्त करता है।
- source_word: כִּכָּר לָאָדֶן
  choice: प्रत्येक आधार के लिए एक किक्कार
  rationale: मूल का वितरण-अनुपात हिंदी में स्पष्ट और स्वाभाविक ढंग से व्यक्त किया गया है।
