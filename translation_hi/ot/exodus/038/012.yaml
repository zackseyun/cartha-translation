  text: וְ/לִ/פְאַת יָ֗ם קְלָעִים֙ חֲמִשִּׁ֣ים בָּֽ/אַמָּ֔ה עַמּוּדֵי/הֶ֥ם עֲשָׂרָ֔ה וְ/אַדְנֵי/הֶ֖ם עֲשָׂרָ֑ה וָוֵ֧י הָ/עַמֻּדִ֛ים וַ/חֲשׁוּקֵי/הֶ֖ם כָּֽסֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/012.yaml
  text: And for the west side there were hangings of fifty cubits[a], with ten of their pillars and ten of their bases; the hooks of the pillars and their bands were silver.
translation:
  language: hi
  text: पश्चिम की ओर पचास हाथ लम्बे पर्दे थे। उनके लिए दस खंभे और दस आधार थे। खंभों के कुंडे और उनकी पट्टियाँ[a] चाँदी के बने थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस तकनीकी इब्रानी शब्द का ठीक आशय अनिश्चित है; इसका अर्थ खंभों की पट्टियाँ, जोड़ने वाली छड़ें या सजावटी जोड़ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִפְאַת יָם
  choice: पश्चिम की ओर
  rationale: יָם का शाब्दिक अर्थ ‘समुद्र’ है, पर इस प्रसंग में यह पश्चिम दिशा का प्रचलित सूचक है; ‘पश्चिम की ओर’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: קְלָעִים
  choice: पर्दे
  rationale: मिलापवाले तम्बू के आँगन में यह शब्द घेरे के कपड़े के पर्दों के लिए प्रयुक्त है; ‘पर्दे’ सहज और पर्याप्त रूप से ठोस है।
- source_word: חֲמִשִּׁים בָּאַמָּה
  choice: पचास हाथ लम्बे
  rationale: אַמָּה प्राचीन ‘हाथ’ (cubit) की माप है। सन्दर्भ में माप पर्दों के विस्तार को बताती है, इसलिए ‘लम्बे’ स्पष्टता के लिए जोड़ा गया है।
- source_word: עַמּוּדֵיהֶם עֲשָׂרָה
  choice: उनके लिए दस खंभे
  rationale: עַמּוּדִים संरचनात्मक खंभे हैं। ‘उनके लिए’ हिन्दी में पर्दों और खंभों का सम्बन्ध स्वाभाविक ढंग से व्यक्त करता है, बिना किसी अतिरिक्त संरचनात्मक विवरण के।
- source_word: וְאַדְנֵיהֶם עֲשָׂרָה
  choice: और दस आधार
  rationale: אֶדֶן यहाँ खंभे का आधार या धँसनी है; ‘आधार’ सामान्य पाठक के लिए अधिक सुबोध है।
- source_word: וָוֵי הָעַמֻּדִים
  choice: खंभों के अंकुड़े
  rationale: וָוִים खंभों से लगे हुकनुमा उपकरण हैं; ‘अंकुड़े’ हिन्दी में इनके आकार और काम को संक्षेप में व्यक्त करता है।
- source_word: וַחֲשׁוּקֵיהֶם
  choice: और उनकी पट्टियाँ
  rationale: यह तकनीकी स्थापत्य शब्द है, जिसका सटीक आशय अनिश्चित है; ‘पट्टियाँ’ धातु की पट्टी या जोड़ने वाले उपकरण की सम्भावना को खुला रखता है।
- source_word: כָּסֶף
  choice: चाँदी की थीं
  rationale: अन्तिम संज्ञा सामग्री को विधेय रूप में बताती है; हिन्दी में स्त्रीलिंग बहुवचन क्रिया जोड़कर अर्थ स्पष्ट किया गया है।
