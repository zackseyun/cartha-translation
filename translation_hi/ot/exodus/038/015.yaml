base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/015.yaml
  text: And for the other side[a], on this side and on that side of the gate of the courtyard, there were hangings of fifteen cubits, their pillars three[b], and their bases three.
translation:
  language: hi
  text: और आँगन के द्वार के दूसरी तरफ वाले पार्श्व भाग पर पंद्रह हाथ के पर्दे थे; उनके खंभे तीन और उनके आधार[a] तीन थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सॉकेट।”
    reason: इब्रानी אֶדֶן का अर्थ खंभे का आधार या उसे धारण करने वाला सॉकेट हो सकता है।
lexical_decisions:
- source_word: לַכָּתֵף הַשֵּׁנִית ... מִזֶּה וּמִזֶּה
  choice: दूसरी ओर भी
  rationale: כָּתֵף का मूल अर्थ ‘कंधा’ है, पर यहाँ वह द्वार से लगी पार्श्व पट्टी को दर्शाता है। निकटवर्ती संदर्भ और מִזֶּה וּמִזֶּה से द्वार के दोनों ओर की समान पट्टियों का आशय स्पष्ट होता है; संक्षिप्त हिंदी पदबंध स्वाभाविक रूप से इसे व्यक्त करता है।
- source_word: לְשַׁעַר הֶחָצֵר
  choice: आँगन के द्वार की
  rationale: यहाँ לְ स्थानिक-संरचनात्मक संबंध बताता है—ये पार्श्व भाग आँगन के द्वार से लगे हुए हैं।
- source_word: קְלָעִים
  choice: पर्दे
  rationale: पवित्र निवास के संदर्भ में यह शब्द आँगन की घेराबंदी बनाने वाले लटकाए हुए कपड़ों के लिए है। आधुनिक हिंदी में ‘पर्दे’ सहज और स्पष्ट है।
- source_word: חֲמֵשׁ עֶשְׂרֵה אַמָּה
  choice: पंद्रह हाथ के
  rationale: אַמָּה प्राचीन लंबाई की इकाई ‘हाथ’ है। माप को परिवर्तित किए बिना पारंपरिक और सामान्य हिंदी इकाई रखी गई है।
- source_word: עַמֻּדֵיהֶם שְׁלֹשָׁה
  choice: उनके खंभे तीन
  rationale: עַמּוּד के स्थापत्य अर्थ के लिए ‘खंभा’ सामान्य आधुनिक हिंदी में स्वाभाविक है और इब्रानी की सूची-जैसी गणना को बनाए रखता है।
- source_word: וְאַדְנֵיהֶם שְׁלֹשָׁה
  choice: और उनकी चौकियाँ तीन
  rationale: אֶדֶן यहाँ खंभों को थामने वाली आधार-चौकियों या खाँचेदार आधारों को दर्शाता है। ‘चौकियाँ’ तंबू-निर्माण के संदर्भ में ठोस आधार का बोध कराता है; वैकल्पिक तकनीकी अर्थ पादटिप्पणी में दिया गया है।
