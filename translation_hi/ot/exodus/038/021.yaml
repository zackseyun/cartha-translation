id: EXO.38.21
reference: Exodus 38:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אֵ֣לֶּה פְקוּדֵ֤י הַ/מִּשְׁכָּן֙ מִשְׁכַּ֣ן הָ/עֵדֻ֔ת אֲשֶׁ֥ר פֻּקַּ֖ד עַל פִּ֣י מֹשֶׁ֑ה עֲבֹדַת֙ הַ/לְוִיִּ֔ם בְּ/יַד֙ אִֽיתָמָ֔ר בֶּֽן אַהֲרֹ֖ן הַ/כֹּהֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/021.yaml
  text: These are the records of the tabernacle[a], the tabernacle of the testimony, as they were recorded at the command of Moses[c][b], by the service of the Levites under the direction of Ithamar son of Aaron the priest.
translation:
  language: hi
  text: ये निवासस्थान के लेखे[a] हैं—अर्थात साक्ष्य के निवासस्थान[b] के—जो मूसा के आदेश पर, लेवियों की सेवा के संबंध में, याजक हारून के पुत्र ईतामार के निर्देशन[c] में तैयार किए गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सूची’ अथवा ‘हिसाब-किताब’; इब्रानी शब्द किसी आधिकारिक गणना या लेखे को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: ‘साक्ष्य’ का संबंध सम्भवतः वाचा के साक्ष्य से है, विशेष रूप से सन्दूक में रखी पत्थर की पटियाओं से।
    reason: cultural_note
  - marker: c
    text: शाब्दिक रूप से ‘ईतामार के हाथ से’; यह मुहावरा यहाँ उसके माध्यम या उसके निर्देशन में किए गए काम को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקוּדֵי
  choice: हिसाब-किताब
  rationale: यहाँ संज्ञा आधिकारिक गणना या लेखे को दर्शाती है। आधुनिक हिन्दी में ‘हिसाब-किताब’ सामग्री और व्यय के व्यवस्थित लेखे का स्वाभाविक बोध कराता है।
- source_word: הַמִּשְׁכָּן
  choice: निवास-स्थान
  rationale: מִשְׁכָּן का मूल अर्थ ‘निवास-स्थान’ है और निर्गमन में यह पवित्र तंबू-सदृश भवन का स्थापित नाम है। यह चयन अर्थ को हिन्दी पाठक के लिए पारदर्शी रखता है।
- source_word: מִשְׁכַּן הָעֵדֻת
  choice: साक्षीपत्र का निवास-स्थान
  rationale: עֵדֻת को केवल सामान्य ‘गवाही’ न समझकर वाचा के लिखित साक्ष्य, विशेषतः सन्दूक में रखी पटियाओं, से उसका संबंध व्यक्त किया गया है; फिर भी मुख्य पाठ में ‘वाचा’ जोड़कर अर्थ को पूरी तरह निश्चित नहीं किया गया।
- source_word: פֻּקַּד
  choice: तैयार किया
  rationale: इस संदर्भ में פקד हिसाब दर्ज किए जाने की क्रिया को दोहराता है। हिन्दी वाक्य में ‘हिसाब-किताब ... तैयार किया’ प्रशासनिक लेखे की स्वाभाविक अभिव्यक्ति है।
- source_word: עַל פִּי מֹשֶׁה
  choice: मूसा के आदेश पर
  rationale: शाब्दिक ‘मूसा के मुँह के अनुसार’ एक इब्रानी मुहावरा है, जिसका यहाँ अर्थ मूसा के आदेश या निर्देश के अनुसार है।
- source_word: עֲבֹדַת הַלְוִיִּם
  choice: लेवियों ने अपनी सेवा के अंतर्गत
  rationale: עֲבֹדָה नियुक्त कार्य या सेवा को दर्शाता है। हिन्दी में कर्ता और कार्य का संबंध स्पष्ट करते हुए लेवियों की वास्तविक सहभागिता व्यक्त की गई है।
- source_word: בְּיַד אִיתָמָר
  choice: ईतामार की देखरेख में
  rationale: शाब्दिक रूप ‘ईतामार के हाथ से’ यहाँ माध्यम या पर्यवेक्षण का मुहावरा है। प्रसंग में ईतामार द्वारा लेवियों के काम की निगरानी सबसे स्वाभाविक अर्थ है।
- source_word: הַכֹּהֵן
  choice: याजक
  rationale: हारून की उपाधि के लिए पवित्र-सेवा के संदर्भ में प्रचलित और सटीक हिन्दी शब्द।
theological_decisions:
- issue: מִשְׁכַּן הָעֵדֻת में עֵדֻת का आशय
  choice: मुख्य पाठ में ‘साक्षीपत्र’ और पादटिप्पणी में वाचा की पटियाओं से संभावित संबंध
  alternative: ‘वाचा का निवास-स्थान’ या केवल ‘साक्षी का निवास-स्थान’
  rationale: शब्द का संबंध संभवतः सन्दूक में रखी वाचा की पटियाओं से है, पर मूल पाठ केवल עֵדֻת कहता है। ‘साक्षीपत्र’ लिखित साक्ष्य का भाव देता है और पादटिप्पणी संभाव्यता बनाए रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘हिसाब-किताब’ प्रशासनिक संदर्भ को स्वाभाविक हिन्दी में व्यक्त करता है; ‘साक्षीपत्र’ मूल की धार्मिक-सांस्कृतिक विशिष्टता को बिना अनावश्यक रूप से सुलझाए सुरक्षित रखता है।
