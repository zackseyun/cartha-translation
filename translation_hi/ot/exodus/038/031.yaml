lexical_decisions:
- source_word: אַדְנֵי
  choice: चौकियाँ
  rationale: यहाँ धातु के उन आधार-खंडों का उल्लेख है जिनमें आँगन के खंभे लगाए जाते थे। ‘चौकियाँ’ निर्माण-संदर्भ में ठोस आधार का स्वाभाविक हिंदी रूप है; ‘खाँचेवाले आधार’ अधिक तकनीकी विकल्प है।
- source_word: חָצֵר
  choice: आँगन
  rationale: यह पवित्र-तम्बू के चारों ओर के घिरे हुए बाहरी क्षेत्र को दर्शाता है; ‘आँगन’ आधुनिक हिंदी में स्पष्ट और सहज है।
- source_word: סָבִיב
  choice: चारों ओर
  rationale: यह आँगन की पूरी परिधि का बोध कराता है और दोनों स्थलों पर मूल की पुनरावृत्ति बनाए रखता है।
- source_word: שַׁעַר
  choice: द्वार
  rationale: यह आँगन के प्रवेश-द्वार को दर्शाता है; ‘द्वार’ गरिमापूर्ण और स्पष्ट है।
- source_word: יִתְדֹת
  choice: खूँटियाँ
  rationale: यह रस्सियों आदि को बाँधकर तम्बू और आँगन को स्थिर रखने के लिए भूमि में गाड़ी जाने वाली खूँटियों को दर्शाता है।
- source_word: מִּשְׁכָּן
  choice: पवित्र-तम्बू
  rationale: निर्गमन में यह इस्राएल के चलायमान पवित्र निवास के लिए विशिष्ट पद है। ‘पवित्र-तम्बू’ सामान्य पाठक को अर्थ और वस्तु दोनों स्पष्ट करता है।
- source_word: כָּל
  choice: सारी
  rationale: बहुवचन वस्तुओं की पूर्ण संख्या को समाविष्ट करता है।
- source_word: וְאֵת / וְאֶת
  choice: और
  rationale: संयोजक सहित कर्मचिह्न सूची को आगे बढ़ाता है; हिंदी में ‘और’ इस संरचना को स्वाभाविक ढंग से व्यक्त करता है।
