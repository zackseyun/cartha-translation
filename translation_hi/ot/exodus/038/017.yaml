base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/017.yaml
  text: The bases for the pillars were bronze[a], and the hooks of the pillars and their bands were silver, and the overlay of their tops was silver[b]; all the pillars of the courtyard were banded with silver.
translation:
  language: hi
  text: खम्भों के आधार[a] काँसे के थे; खम्भों के हुक और उनके पट्टे चाँदी के थे, और उनके शीर्षों का मढ़ाव चाँदी का था। आँगन के सभी खम्भों पर चाँदी के पट्टे लगे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “खाँचे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדָנִים
  choice: चौकियाँ
  rationale: तम्बू के निर्माण के सन्दर्भ में यह शब्द खम्भों को थामने वाली आधार-चौकियों या खाँचेदार आधारों को दर्शाता है। ‘चौकियाँ’ साधारण हिन्दी में स्पष्ट है; वैकल्पिक अर्थ पाद-खाँचे को पादटिप्पणी में रखा गया है।
- source_word: עַמֻּדִים
  choice: खम्भे
  rationale: यह सीधे खड़े संरचनात्मक सहारों को दर्शाता है; ‘खम्भे’ आधुनिक हिन्दी में स्वाभाविक और स्थापत्य-सन्दर्भ के अनुकूल है।
- source_word: נְחֹשֶׁת
  choice: काँसा
  rationale: पवित्र तम्बू के निर्माण-वर्णनों में यह धातु परम्परागत और सन्दर्भानुकूल रूप से काँसा समझी जाती है, यद्यपि शब्द ताँबे के लिए भी प्रयुक्त हो सकता है।
- source_word: וָוֵי
  choice: अंकुश
  rationale: यह खम्भों से जुड़े हुकनुमा उपकरणों को दर्शाता है; ‘अंकुश’ गरिमापूर्ण और समझने योग्य हिन्दी स्थापत्य शब्द है।
- source_word: חֲשׁוּקֵיהֶם
  choice: उनके पट्टे
  rationale: इस स्थापत्य अंग की ठीक बनावट अनिश्चित है, पर यह खम्भों से जुड़ी बाँधने या चारों ओर लगने वाली चाँदी की सज्जा को दर्शाता है। ‘पट्टे’ अर्थ को अनावश्यक रूप से अधिक निश्चित नहीं करता।
- source_word: צִפּוּי
  choice: मढ़ी हुई
  rationale: यह किसी सतह पर धातु की परत चढ़ाने को दर्शाता है; हिन्दी में ‘चाँदी मढ़ी हुई’ स्वाभाविक और स्पष्ट है।
- source_word: רָאשֵׁיהֶם
  choice: उनके सिरे
  rationale: शाब्दिक अर्थ ‘उनके सिर’ है और यहाँ खम्भों के ऊपरी भाग अभिप्रेत हैं; ‘सिरे’ तकनीकी ‘शीर्षभाग’ की तुलना में अधिक सहज है।
- source_word: מְחֻשָּׁקִים
  choice: पट्टे लगे थे
  rationale: यह חֲשׁוּקֵיהֶם से सम्बद्ध कर्मवाच्य रूप है और चाँदी के पट्टों से युक्त होने का भाव देता है; समान शब्दावली से मूल का lexical संबंध सुरक्षित रहता है।
- source_word: חָצֵר
  choice: आँगन
  rationale: पवित्र तम्बू के चारों ओर के घेरे हुए बाहरी प्रांगण को दर्शाता है; ‘आँगन’ सरल और ठोस आधुनिक हिन्दी है।
