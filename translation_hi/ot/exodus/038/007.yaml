  text: उसने डंडों को वेदी के किनारों पर लगे छल्लों में डाल दिया[a], ताकि उनके सहारे उसे उठाकर ले जाया जा सके। उसने उसे तख्तों का एक खोखला ढाँचा बनाया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘डंडों को छल्लों में ले आया।’ इब्रानी क्रिया का अधिक शाब्दिक अर्थ ‘ले आया’ है, पर यहाँ संदर्भ डंडों को उनकी जगह पर रखने का है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप में, ‘खोखला, तख्ते।’ संभवतः इसका अर्थ है कि वेदी तख्तों से बने एक खोखले ढाँचे के रूप में बनाई गई थी।
    reason: lexical_alternative
