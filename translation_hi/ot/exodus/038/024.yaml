base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/024.yaml
  text: All the gold that was used for the work[a], in all the work of the sanctuary—the gold of the wave offering—was twenty-nine talents and seven hundred thirty shekels[b], according to the sanctuary shekel.
translation:
  language: hi
  text: पवित्रस्थान के सब काम में लगाया गया सारा सोना—अर्थात् हिलाकर अर्पित की गई भेंट का सोना[a]—पवित्रस्थान के मानक शेकेल के अनुसार उनतीस किक्कार और सात सौ तीस शेकेल[b] था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह इब्रानी पद एक ऐसी भेंट के लिए है जिसे यहोवा के सामने अनुष्ठानपूर्वक हिलाकर प्रस्तुत किया जाता था।
    reason: सांस्कृतिक और पारिभाषिक स्पष्टीकरण
  - marker: b
    text: किक्कार और शेकेल प्राचीन भार-माप थे। एक किक्कार में 3,000 शेकेल होते थे; उनका आधुनिक भार लगभग ही बताया जा सकता है।
    reason: प्राचीन माप-इकाइयों का स्पष्टीकरण
lexical_decisions:
- source_word: הֶעָשׂוּי לַמְּלָאכָה
  choice: काम में लगाया गया
  rationale: यहाँ עשה का कर्मवाच्य कृदंत निर्माण-कार्य में सोने के उपयोग को बताता है। ‘बनाया गया’ से ऐसा लग सकता है कि सोना स्वयं बनाया गया था।
- source_word: בְּכֹל מְלֶאכֶת הַקֹּדֶשׁ
  choice: पवित्रस्थान के सब काम में
  rationale: संदर्भ में הַקֹּדֶשׁ निवासस्थान के पवित्र परिसर और उससे जुड़े निर्माण को सूचित करता है; यह रूप संक्षिप्त और स्वाभाविक है।
- source_word: זְהַב הַתְּנוּפָה
  choice: हिलाकर चढ़ाई गई भेंट का सोना
  rationale: תְּנוּפָה भेंट को अनुष्ठानपूर्वक प्रस्तुत करने के लिए प्रयुक्त पारिभाषिक शब्द है, जिसमें हिलाने की क्रिया निहित है। अनुवाद उस सांस्कृतिक संकेत को बनाए रखता है।
- source_word: תֵּשַׁע וְעֶשְׂרִים כִּכָּר
  choice: उनतीस किक्कार
  rationale: हिब्रू भार-माप כִּכָּר को ऐतिहासिक इकाई के रूप में लिप्यंतरित किया गया है, ताकि अनिश्चित आधुनिक समतुल्य पाठ में न थोपा जाए।
- source_word: וּשְׁבַע מֵאוֹת וּשְׁלֹשִׁים שֶׁקֶל
  choice: सात सौ तीस शेकेल
  rationale: मूल संख्या को आधुनिक स्वाभाविक हिन्दी क्रम में रखा गया है और ऐतिहासिक भार-माप को लिप्यंतरित किया गया है।
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: पवित्रस्थान के शेकेल के अनुसार
  rationale: בְּ यहाँ माप के मानक को सूचित करता है; ‘के अनुसार’ इस अर्थ को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
