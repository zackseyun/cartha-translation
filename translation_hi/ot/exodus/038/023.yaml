base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/023.yaml
  text: And with him was Oholiab son of Ahisamach[a], of the tribe of Dan, an engraver, a designer, and an embroiderer in blue, in purple, in scarlet yarn[b], and in fine linen.
translation:
  language: hi
  text: उसके साथ दान गोत्र के अहीसामाक का पुत्र ओहोलीआब भी था, जो एक कुशल कारीगर, डिज़ाइन बनानेवाला और नीले तथा बैंगनी धागों, किरमिजी लाल सूत[a] और महीन लिनन से कढ़ाई करनेवाला था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, यह इब्रानी अभिव्यक्ति किरमिजी लाल रंग से रंगी वस्त्र-सामग्री को दर्शाती है; इसका अनुवाद केवल “किरमिजी लाल” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִתּוֹ
  choice: उसके साथ … था
  rationale: यह पद पिछले पद में वर्णित बसलेल के साथ ओहोलीआब की सहभागिता बताता है। इब्रानी के क्रियारहित वाक्य में हिन्दी की स्वाभाविकता के लिए ‘था’ जोड़ा गया है।
- source_word: אָהֳלִיאָב בֶּן־אֲחִיסָמָךְ
  choice: अहीसामाक का पुत्र ओहोलीआब
  rationale: व्यक्तिनामों का अनुवाद न करके इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: לְמַטֵּה דָן
  choice: दान गोत्र का
  rationale: यह पदबंध ओहोलीआब की गोत्रीय संबद्धता व्यक्त करता है; हिन्दी में ‘दान गोत्र का’ संक्षिप्त और स्वाभाविक है।
- source_word: חָרָשׁ
  choice: नक्काशी करनेवाला
  rationale: यह शब्द कुशल शिल्पकार का व्यापक अर्थ रख सकता है, पर इस शिल्प-सूची में नक्काशी का अर्थ उपयुक्त है और अगले दो विशिष्ट कौशलों से स्पष्ट भेद रखता है।
- source_word: וְחֹשֵׁב
  choice: नमूने बनानेवाला
  rationale: חֹשֵׁב कलात्मक आकृतियों अथवा डिज़ाइनों की योजना और रचना करनेवाले कारीगर को सूचित करता है। ‘नमूने बनानेवाला’ सामान्य हिन्दी में समझने योग्य है।
- source_word: וְרֹקֵם
  choice: कढ़ाई करनेवाला
  rationale: यह वस्त्र पर रंगीन धागों से की जानेवाली कढ़ाई के कारीगर को दर्शाता है।
- source_word: בַּתְּכֵלֶת וּבָאַרְגָּמָן
  choice: नीले, बैंगनी … सूत
  rationale: इन रंग-संज्ञाओं के पीछे वस्त्र-सामग्री निहित है। हिन्दी में साझा संज्ञा ‘सूत’ लगाकर रंगीन कढ़ाई-सामग्री का आशय स्पष्ट किया गया है।
- source_word: וּבְתוֹלַעַת הַשָּׁנִי
  choice: किरमिजी लाल सूत
  rationale: यह इब्रानी पदबंध किरमिजी/सुर्ख लाल रंग से रंगी वस्त्र-सामग्री को दर्शाता है। ‘सूत’ प्रसंगानुसार सामग्री को स्पष्ट करता है।
- source_word: וּבַשֵּׁשׁ
  choice: बारीक मलमल
  rationale: मिलापवाले तंबू के प्रसंग में שֵׁשׁ उच्च कोटि के महीन लिनन को दर्शाता है; ‘बारीक मलमल’ सामान्य हिन्दी में उसके वस्त्रगत गुण को स्पष्ट करता है।
