- source_word: שֵׁשׁ
  choice: सन
  rationale: तंबू के वस्त्र-वर्णनों में यह सन के कपड़े या धागे को दर्शाता है; ‘सन’ सामग्री की पहचान सीधे रखता है।
- source_word: מָשְׁזָר
