  yaml_path: translation/ot/exodus/038/013.yaml
  text: And for the east side[a], eastward, fifty cubits.
translation:
  language: hi
  text: और पूर्वी ओर[a], सूर्योदय की दिशा में, लंबाई पचास हाथ थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ है, “पूर्व की ओर का भाग, सूर्योदय की दिशा में।”
    reason: इब्रानी के युग्मित दिशासूचक वाक्यांश और פאה के ‘भाग/पार्श्व’ अर्थ को स्पष्ट करना।
lexical_decisions:
- source_word: וְ/לִ/פְאַת
  choice: और ... ओर
  rationale: פאה यहाँ आँगन के एक पार्श्व या भाग को दर्शाता है। प्रसंगानुकूल सहज हिन्दी के लिए इसे ‘ओर’ कहा गया है और וְ/לִ को ‘और’ से व्यक्त किया गया है।
- source_word: קֵדְמָה
  choice: पूर्वी
  rationale: यह शब्द पूर्व दिशा या सामने की ओर का बोध करा सकता है; מִזְרָחָה के साथ यहाँ पूर्व दिशा स्पष्ट है।
- source_word: מִזְרָחָה
  choice: सूर्योदय की दिशा में
  rationale: מזרח मूलतः सूर्योदय की दिशा, अर्थात पूर्व, को दर्शाता है। यह अनुवाद इब्रानी के दोहरे दिशासूचक प्रयोग को बिना अनावश्यक पुनरुक्ति के बनाए रखता है।
- source_word: חֲמִשִּׁים
  choice: पचास
  rationale: मूल पाठ की संख्या का सीधा अनुवाद।
- source_word: אַמָּה
  choice: हाथ
  rationale: अम्मा प्राचीन लंबाई की इकाई ‘क्यूबिट’ है; हिन्दी बाइबलीय प्रयोग में ‘हाथ’ इसका परिचित और सहज पर्याय है।
