base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/026.yaml
  text: 'a beka per head[a], that is, half a shekel by the sanctuary shekel, for everyone who passed over to those counted[c][b], from twenty years old and upward: 603,550.'
translation:
  language: hi
  text: 'प्रति व्यक्ति[b] एक बेका[a]—अर्थात् पवित्रस्थान के शेकेल के मान से आधा शेकेल—उन सबके लिए जो गिने हुओं में सम्मिलित हुए[c], बीस वर्ष और उससे अधिक आयु के: कुल 6,03,550।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: एक बेका पवित्रस्थान के मान के अनुसार आधे शेकेल के बराबर था।
    reason: cultural_note
  - marker: b
    text: शाब्दिक रूप से ‘प्रति खोपड़ी’; यह प्रत्येक गिने गए व्यक्ति के लिए प्रयुक्त इब्रानी मुहावरा है।
    reason: lexical_alternative
  - marker: c
    text: या, ‘जो गिने हुओं के बीच से होकर गए।’ इब्रानी में जनगणना में सम्मिलित होने की गतिशील छवि है।
    reason: alternative_reading
lexical_decisions:
- source_word: בֶּקַע
  choice: बेका
  rationale: यह एक विशिष्ट प्राचीन भार-माप है। लिप्यंतरण तकनीकी पद को सुरक्षित रखता है, और अगला वाक्यांश इसका मूल्य आधा शेकेल बताता है।
- source_word: לַגֻּלְגֹּלֶת
  choice: प्रति व्यक्ति
  rationale: शाब्दिक अर्थ ‘प्रति खोपड़ी’ है, पर जनगणना के प्रसंग में यह प्रत्येक अलग व्यक्ति के लिए प्रयुक्त इब्रानी मुहावरा है। स्वाभाविक हिन्दी में ‘प्रति व्यक्ति’ उसी आशय को स्पष्ट करता है।
- source_word: מַחֲצִית הַשֶּׁקֶל
  choice: आधा शेकेल
  rationale: यह बेका का मूल्य सीधे बताने वाला पदबंध है।
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: पवित्रस्थान के शेकेल के मान से
  rationale: यह भुगतान की इकाई नहीं, बल्कि पवित्रस्थान में मान्य भार-मानक को निर्दिष्ट करता है; ‘के मान से’ हिन्दी में यह बात स्पष्ट करता है।
- source_word: לְכֹל הָעֹבֵר עַל הַפְּקֻדִים
  choice: उन सभी से लिया गया जो गिने हुओं में शामिल होने के लिए आगे आए
  rationale: मूल में जनगणना के समय ‘गिने हुओं’ के बीच से गुजरने या उनकी श्रेणी में आने की गतिशील छवि है। यह रूप अर्थ को समझने योग्य रखते हुए उस गति-सूचक भाव को कुछ हद तक बनाए रखता है। ‘लिया गया’ संदर्भ से स्पष्ट दान-राशि को हिन्दी वाक्य में स्वाभाविक रूप से जोड़ता है।
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: बीस वर्ष या उससे अधिक आयु के
  rationale: यह जनगणना की आयु-सीमा बताने वाला सामान्य सूत्र है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: לְשֵׁשׁ מֵאוֹת אֶלֶף וּשְׁלֹשֶׁת אֲלָפִים וַחֲמֵשׁ מֵאוֹת וַחֲמִשִּׁים
  choice: कुल 6,03,550 व्यक्ति
  rationale: इब्रानी पाठ की कुल संख्या को भारतीय अंक-विभाजन शैली में प्रस्तुत किया गया है; ‘व्यक्ति’ संदर्भगत गणना को स्पष्ट करता है।
