source:
  edition: WLC
  text: וַ/יַּ֛עַשׂ אֶת מִזְבַּ֥ח הָ/עֹלָ֖ה עֲצֵ֣י שִׁטִּ֑ים חָמֵשׁ֩ אַמּ֨וֹת אָרְכּ֜/וֹ וְ/חָֽמֵשׁ אַמּ֤וֹת רָחְבּ/וֹ֙ רָב֔וּעַ וְ/שָׁלֹ֥שׁ אַמּ֖וֹת קֹמָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/001.yaml
  text: He made the altar of burnt offering of acacia wood[a], five cubits its length and five cubits its width, square, and three cubits its height.
translation:
  language: hi
  text: उसने होमबलि की वेदी बबूल की लकड़ी से बनाई। उसकी लंबाई पाँच हाथ और चौड़ाई पाँच हाथ थी; वह चौकोर थी और उसकी ऊँचाई तीन हाथ थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: उसने ... बनाई
  rationale: वाव-क्रमागत रूप बीते हुए कथात्मक कार्य को व्यक्त करता है। हिंदी में अलग से “और” जोड़े बिना यह क्रम स्वाभाविक रूप से स्पष्ट है।
- source_word: מִזְבַּח הָעֹלָה
  choice: होमबलि की वेदी
  rationale: यह रचना उस वेदी को दर्शाती है जो पूरी तरह जलाए जाने वाले बलिदान से संबंधित है। “होमबलि की वेदी” प्रचलित, संक्षिप्त और अर्थ के निकट है।
- source_word: עֲצֵי שִׁטִּים
  choice: बबूल की लकड़ी
  rationale: שִׁטִּים अकासिया कुल की लकड़ी को सूचित करता है; आधुनिक हिंदी में “बबूल की लकड़ी” सामान्य पाठक के लिए सहज और पहचाना हुआ नाम है।
- source_word: חָמֵשׁ אַמּוֹת
  choice: पाँच हाथ
  rationale: אַמָּה प्राचीन लंबाई की इकाई ‘क्यूबिट’ है। तंबू के मापों में इकाई को बनाए रखते हुए हिंदी की पारंपरिक बाइबलीय माप-संज्ञा “हाथ” का प्रयोग किया गया है।
- source_word: אָרְכּוֹ / רָחְבּוֹ / קֹמָתוֹ
  choice: उसकी लंबाई / चौड़ाई / ऊँचाई
  rationale: वास्तु-संबंधी मापों के लिए ये आधुनिक हिंदी के स्पष्ट और स्वाभाविक समतुल्य हैं; सर्वनाम वेदी की ओर संकेत करता है।
- source_word: רָבוּעַ
  choice: चौकोर
  rationale: यह विशेषण समान लंबाई और चौड़ाई वाले वर्गाकार आकार को बताता है। “चौकोर” साधारण आधुनिक हिंदी में सहज है और संदर्भ में अर्थ स्पष्ट रखता है।
