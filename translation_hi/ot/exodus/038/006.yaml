  text: וַ/יַּ֥עַשׂ אֶת הַ/בַּדִּ֖ים עֲצֵ֣י שִׁטִּ֑ים וַ/יְצַ֥ף אֹתָ֖/ם נְחֹֽשֶׁת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/006.yaml
  text: He made the poles of acacia wood and overlaid them with bronze[a].
translation:
  language: hi
  text: उसने बबूल की लकड़ी के डंडे बनाए और उन पर काँसा[a] मढ़ दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ताँबा।”
    reason: नְחֹשֶׁת धातु-पद ताँबे या काँसे, दोनों के लिए प्रयुक्त हो सकता है।
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: उसने बनाए
  rationale: עשה का क़ाल वय्यिक्तोल कथानक में क्रमिक क्रिया व्यक्त करता है। हिन्दी में अलग से ‘और’ जोड़े बिना ‘उसने ... बनाए’ स्वाभाविक है और क्रम संदर्भ से स्पष्ट रहता है।
- source_word: הַבַּדִּים
  choice: डंडे
  rationale: मिलापवाले तंबू की सामग्री के संदर्भ में בַּדִּים उन डंडों को दर्शाता है जिनसे वस्तु उठाकर ले जाई जाती थी। ‘डंडे’ आधुनिक हिन्दी में संक्षिप्त और सहज है।
- source_word: עֲצֵי שִׁטִּים
  choice: बबूल की लकड़ी
  rationale: यह रचना शिट्टा-वृक्ष की लकड़ी को दर्शाती है। ‘बबूल की लकड़ी’ आधुनिक हिन्दी में परिचित और अर्थपूर्ण वनस्पति-संबंधी पद है।
- source_word: וַיְצַף
  choice: मढ़ दिया
  rationale: कारीगरी के इस संदर्भ में צפה का अर्थ किसी वस्तु पर धातु की परत चढ़ाना है; ‘मढ़ दिया’ हिन्दी में इसी प्रक्रिया को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֹתָם
  choice: उन पर
  rationale: पुल्लिंग बहुवचन प्रत्यय पहले बताए गए डंडों की ओर संकेत करता है। हिन्दी में ‘उन पर ... मढ़ दिया’ लक्ष्य वस्तुओं और धातु-आवरण के संबंध को स्पष्ट करता है।
- source_word: נְחֹשֶׁת
  choice: काँसा
  rationale: नְחֹשֶׁת ताँबा अथवा ताँबा-मिश्रित काँसा/कांस्य दर्शा सकता है। तंबू की सामग्री के इस संदर्भ में ‘काँसा’ पारंपरिक और सहज मुख्य पाठ है; वास्तविक शाब्दिक विकल्प ‘ताँबा’ पादटिप्पणी में रखा गया है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कारीगरी-संबंधी स्वाभाविक शब्दावली रखी गई है। ‘मढ़ दिया’ धातु की परत चढ़ाने का अर्थ स्पष्ट करता है, और [a] स्रोत-पद की वास्तविक धातुगत अस्पष्टता सुरक्षित रखता है।
