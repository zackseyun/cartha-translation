translation:
  language: hi
  text: उनके चार खम्भे और उनके चार काँसे के आधार थे। उनके हुक चाँदी के थे, और उनके सिरों की मढ़ाई तथा उनके पट्टे चाँदी के थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַמֻּדֵיהֶם
  choice: उनके खम्भे
  rationale: עַמּוּד यहाँ आँगन के परदे को थामने वाले स्तम्भों के लिए है; ‘खम्भे’ आधुनिक हिन्दी में स्वाभाविक और निर्माण-संदर्भ के अनुकूल है।
- source_word: אַדְנֵיהֶם
  choice: उनकी चौकियाँ
  rationale: אֶדֶן खम्भों के पायों पर लगी भार-सहायक धातु की वस्तुओं को दर्शाता है। तम्बू के निर्माण-संदर्भ में ‘चौकियाँ’ उनका आधारगत कार्य स्पष्ट करती है; ‘खाँचेदार आधार’ भी सम्भव है।
- source_word: נְחֹשֶׁת
  choice: काँसा
  rationale: निर्गमन की धातु-सूचियों में נְחֹשֶׁת के लिए परम्परागत और सन्दर्भानुकूल हिन्दी शब्द ‘काँसा’ है, यद्यपि मूल शब्द ताँबे अथवा ताँबा-मिश्रित धातु को व्यापक रूप से सूचित कर सकता है।
- source_word: וָוֵיהֶם
  choice: उनके अंकुश
  rationale: וָו तम्बू की संरचना में परदे आदि लगाने के लिए प्रयुक्त हुकनुमा जोड़ को दर्शाता है; ‘अंकुश’ संक्षिप्त और गरिमापूर्ण हिन्दी रूप है।
- source_word: כֶּסֶף
  choice: चाँदी
  rationale: כֶּסֶף यहाँ सामग्री के रूप में चाँदी को स्पष्टतः दर्शाता है।
- source_word: צִפּוּי רָאשֵׁיהֶם
  choice: उनके ऊपरी सिरों पर चाँदी मढ़ी हुई थी
  rationale: צִפּוּי मढ़ाई/आवरण और רָאשֵׁיהֶם खम्भों के सिरों अर्थात ऊपरी भागों को दर्शाता है। हिन्दी में क्रियात्मक वाक्यांश मूल संज्ञा-समूह का अर्थ स्वाभाविक रूप से व्यक्त करता है।
- source_word: חֲשֻׁקֵיהֶם
  choice: उनके पट्टे
  rationale: यह दुर्लभ निर्माण-शब्द खम्भों से जुड़े चाँदी के बन्धनकारी अवयवों के लिए है। ‘पट्टे’ उनके सम्भावित रूप को अत्यधिक निश्चित किए बिना स्पष्ट आधुनिक हिन्दी देता है।
