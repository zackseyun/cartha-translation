lexical_decisions:
- source_word: וַיִּצֹק
  choice: उसने ... ढाले
  rationale: יצק धातु को ढालने के अर्थ में प्रयुक्त है; निर्माण-संदर्भ में ‘ढाले’ स्वाभाविक और सटीक है।
- source_word: אַרְבַּע טַבָּעֹת
  choice: चार कड़े
  rationale: טַבָּעֹת यहाँ सामान उठाने वाले डंडों को थामने के लिए लगाए गए धातु के छल्ले हैं; ‘कड़े’ तंबू-संबंधी सामान के वर्णन में स्पष्ट है।
- source_word: בְּאַרְבַּע הַקְּצָוֺת
  choice: चारों कोनों पर
  rationale: קְצָוֹת का अर्थ छोर या किनारे भी हो सकता है, पर आयताकार जाली के संदर्भ में ‘कोनों’ से स्थान स्वाभाविक रूप से समझ आता है; वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: לְמִכְבַּר הַנְּחֹשֶׁת
  choice: काँसे की जाली के
  rationale: מִכְבָּר जालीदार ढाँचे को और נְחֹשֶׁת यहाँ काँसे को दर्शाता है। संबंधसूचक לְ को हिंदी वाक्य-विन्यास में ‘के’ से व्यक्त किया गया है।
- source_word: בָּתִּים
  choice: खाने
  rationale: शाब्दिक अर्थ ‘घर’ है, किंतु यहाँ डंडों को ग्रहण करने वाले खाँचों या धारकों का संकेत है। ‘खाने’ भौतिक फिटिंग का बोध देता और मूल रूपक को कुछ हद तक बनाए रखता है।
- source_word: לַבַּדִּים
  choice: डंडों के लिए
  rationale: בַּדִּים वे डंडे हैं जिनसे पवित्र सामान उठाकर ले जाया जाता था; निकट संदर्भ में ‘डंडे’ पर्याप्त स्पष्ट है।
