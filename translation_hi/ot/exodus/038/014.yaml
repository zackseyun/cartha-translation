lexical_decisions:
- source_word: קְלָעִים
  choice: परदे
  rationale: मिलापवाले तंबू के आँगन के संदर्भ में यह शब्द घेरे को बनाने वाले कपड़े के परदों को दर्शाता है; आधुनिक हिन्दी में ‘परदे’ सहज और स्पष्ट है।
- source_word: חֲמֵשׁ עֶשְׂרֵה אַמָּה
  choice: पंद्रह हाथ के
  rationale: इब्रानी में माप सीधे दिया गया है। ‘हाथ’ बाइबिलकालीन אמה के लिए प्रचलित हिन्दी माप-शब्द है, और ‘के थे’ वाक्य को स्वाभाविक बनाता है।
- source_word: אֶל הַכָּתֵף
  choice: एक ओर के
  rationale: כָּתֵף का मूल अर्थ ‘कंधा’ है, पर यहाँ प्रवेश-स्थान के एक पार्श्व या ओर का संकेत है। ‘एक ओर के’ स्थानिक अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: עַמּוּדֵיהֶם
  choice: उनके तीन खंभे
  rationale: עַמּוּד यहाँ आँगन के परदों को थामने वाले स्तंभों के लिए है; ‘खंभे’ सामान्य पाठक के लिए स्वाभाविक वास्तुशिल्पीय शब्द है।
- source_word: אַדְנֵיהֶם
  choice: तीन आधार
  rationale: אֶדֶן उन धातु-आधारों या खाँचेदार टेकों को दर्शाता है जिनमें खंभे टिकाए जाते थे। ‘आधार’ स्पष्ट आधुनिक हिन्दी है; अधिक तकनीकी विकल्प फुटनोट में रखा गया है।
