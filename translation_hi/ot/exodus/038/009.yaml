source:
  edition: WLC
  text: וַ/יַּ֖עַשׂ אֶת הֶ/חָצֵ֑ר לִ/פְאַ֣ת נֶ֣גֶב תֵּימָ֗נָ/ה קַלְעֵ֤י הֶֽ/חָצֵר֙ שֵׁ֣שׁ מָשְׁזָ֔ר מֵאָ֖ה בָּ/אַמָּֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/009.yaml
  text: He made the courtyard. On the south side[a], toward the south, the hangings of the courtyard were of finely twisted linen, a hundred cubits long.
translation:
  language: hi
  text: उसने आँगन बनाया। दक्षिणी दिशा में, दक्षिण की ओर, आँगन के लटकते परदे[a] बारीकी से बटे हुए महीन सन के कपड़े से बने थे और सौ हाथ लंबे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘आँगन की कनातें।’
    reason: קְלָעִים के लिए एक वैकल्पिक शब्द; ‘कनातें’ सीमा बनाने वाले कपड़े के परदों का भाव अधिक संक्षेप में देता है।
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: उसने बनाया
  rationale: यह क्रिया कथा में अगली कार्रवाई बताती है। ‘उसने बनाया’ आधुनिक हिन्दी में स्वाभाविक है और मूल क्रिया का सीधा अर्थ बनाए रखता है।
- source_word: הֶחָצֵר
  choice: आँगन
  rationale: यहाँ शब्द मिलापवाले तंबू के चारों ओर के खुले घेरे को दर्शाता है। ‘आँगन’ सामान्य पाठक के लिए स्पष्ट और स्वाभाविक है।
- source_word: לִפְאַת
  choice: दिशा में
  rationale: यह शब्द किसी ओर या भाग को सूचित करता है; दिशासूचक पदों के साथ ‘दिशा में’ सहज हिन्दी है।
- source_word: נֶגֶב תֵּימָנָה
  choice: दक्षिणी दिशा में, दक्षिण की ओर
  rationale: मूल में दक्षिण-संबंधी दोनों अभिव्यक्तियाँ हैं। दोनों को रखकर इब्रानी की पुनरुक्त दिशात्मक पूर्णता सुरक्षित की गई है।
- source_word: קַלְעֵי הֶחָצֵר
  choice: आँगन के लटकते परदे
  rationale: यह पद उन कपड़े के परदों को दर्शाता है जिनसे आँगन की सीमा बनती थी। ‘लटकते परदे’ उनके रूप और कार्य को साधारण आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: שֵׁשׁ מָשְׁזָר
  choice: बारीक बटा हुआ सन का कपड़ा
  rationale: שֵׁשׁ बारीक सन के वस्त्र और מָשְׁזָר बटे हुए धागे या सामग्री को सूचित करता है; यह अनुवाद सामग्री और निर्माण, दोनों को व्यक्त करता है।
- source_word: מֵאָה בָּאַמָּה
  choice: सौ हाथ लंबे
  rationale: मूल पद सौ हाथ का माप देता है। ‘लंबे’ जोड़ने से हिन्दी वाक्य पूर्ण होता है और प्रसंग में निहित लंबाई स्पष्ट होती है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। दिशासूचक पुनरुक्ति को मूल इब्रानी के अनुरूप जानबूझकर बनाए रखा गया है। ‘हाथ’ पारंपरिक माप ‘क्यूबिट’ का सहज हिन्दी रूप है।
