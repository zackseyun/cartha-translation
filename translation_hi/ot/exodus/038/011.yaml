  text: And for the north side there were a hundred cubits[a], their twenty pillars and their twenty bases of bronze, and the hooks of the pillars and their bands were of silver.
translation:
  language: hi
  text: और उत्तर की ओर लंबाई सौ हाथ थी। उसके बीस खंभे थे, और उनके बीस आधार काँसे के थे; खंभों की अंकुड़ियाँ और उनकी पट्टियाँ[a] चाँदी की थीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उनके चाँदी के घेरे’। इब्रानी शब्द खंभों पर लगी चाँदी की वास्तु-सामग्री को दर्शाता है; उसका सटीक रूप निश्चित नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְאַת צָפוֹן
  choice: उत्तर की ओर
  rationale: פאה यहाँ आँगन की दिशा अथवा भुजा को दर्शाता है; यह प्रयोग आधुनिक हिन्दी में स्वाभाविक है।
- source_word: מֵאָה בָאַמָּה
  choice: लंबाई सौ हाथ थी
  rationale: इब्रानी वाक्यांश माप बताता है। ‘हाथ’ बाइबलीय अम्मा के लिए हिन्दी का प्रचलित पारंपरिक शब्द है, और ‘लंबाई’ जोड़ने से आशय स्पष्ट होता है।
- source_word: עַמּוּדֵיהֶם
  choice: उसके बीस खंभे
  rationale: עַמּוּד संरचनात्मक खंभे को दर्शाता है। हिन्दी में एकवचन ‘उसके’ उत्तर की भुजा की ओर स्वाभाविक रूप से संकेत करता है।
- source_word: אַדְנֵיהֶם
  choice: उनके बीस आधार
  rationale: אדן तंबू के खंभों को थामने वाले आधार या खाने को दर्शाता है; सामान्य पाठक के लिए ‘आधार’ अधिक स्पष्ट है।
- source_word: נְחֹשֶׁת
  choice: काँसा
  rationale: पवित्र तंबू की सामग्री के संदर्भ में נְחֹשֶׁת का पारंपरिक और उपयुक्त हिन्दी रूप ‘काँसा’ है, यद्यपि प्राचीन धातु में ताँबा भी अभिप्रेत हो सकता है।
- source_word: וָוֵי הָעַמּוּדִים
  choice: खंभों की अंकुड़ियाँ
  rationale: וָוִים यहाँ खंभों से जुड़ी वस्तुओं को टाँगने वाली अंकुड़ियों को दर्शाता है, न कि तंबू की खूंटियों को।
- source_word: חֲשֻׁקֵיהֶם
  choice: उनकी पट्टियाँ
  rationale: शब्द खंभों पर लगी चाँदी की बंधनकारी या सजावटी वास्तु-सामग्री को दर्शाता है। उसका सटीक आकार अनिश्चित होने के कारण सरल ‘पट्टियाँ’ चुना गया और अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: כָּסֶף
  choice: चाँदी
  rationale: यह मानक धातु-संज्ञा है और यहाँ अंकुड़ियों तथा पट्टियों की सामग्री बताती है।
