lexical_decisions:
- source_word: כֶסֶף
  choice: चाँदी
  rationale: लेखा-विवरण के इस संदर्भ में धातु के रूप में एकत्र चाँदी अभिप्रेत है, न कि सामान्य अर्थ में धन।
- source_word: פְּקוּדֵי הָעֵדָה
  choice: मण्डली में गिने गए लोगों से मिला
  rationale: यह पदबंध जनगणना में पंजीकृत या गिने गए लोगों को दर्शाता है; प्रसंग के अनुसार चाँदी उन्हीं से प्राप्त हुई थी। हिंदी में यह संरचना स्वाभाविक है और प्रशासनिक अर्थ को बनाए रखती है।
- source_word: מְאַת כִּכָּר
  choice: एक सौ किक्कार
  rationale: किक्कार प्राचीन बड़ी भार-इकाई का लिप्यंतरण है और मूल माप को बिना आधुनिक भार में अनिश्चित रूपांतरण किए सुरक्षित रखता है।
- source_word: וְאֶלֶף וּשְׁבַע מֵאוֹת וַחֲמִשָּׁה וְשִׁבְעִים שֶׁקֶל
  choice: एक हज़ार सात सौ पचहत्तर शेकेल
  rationale: इब्रानी की योगात्मक संख्या-रचना का स्पष्ट आधुनिक हिंदी रूप, जिसका कुल 1,775 शेकेल है।
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: पवित्रस्थान के शेकेल के अनुसार
  rationale: यह वाक्यांश उस मानक भार को बताता है जिसके अनुसार कुल वजन मापा गया था; हिंदी में यह अर्थ स्पष्ट और स्वाभाविक है।
