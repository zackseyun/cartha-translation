translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली अपनाई गई है। ‘आँगन’, ‘द्वार’, ‘परदा’, ‘कारीगरी’ और ‘हाथ’ जैसे परिचित शब्द चुने गए हैं। वस्त्र-संबंधी तकनीकी विवरण को सरल किया गया है, पर मूल रंगों, बटे हुए महीन वस्त्र और आयामों को सुरक्षित रखा गया है।
