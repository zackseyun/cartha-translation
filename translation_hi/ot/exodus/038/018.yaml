  text: וּ/מָסַ֞ךְ שַׁ֤עַר הֶ/חָצֵר֙ מַעֲשֵׂ֣ה רֹקֵ֔ם תְּכֵ֧לֶת וְ/אַרְגָּמָ֛ן וְ/תוֹלַ֥עַת שָׁנִ֖י וְ/שֵׁ֣שׁ מָשְׁזָ֑ר וְ/עֶשְׂרִ֤ים אַמָּה֙ אֹ֔רֶךְ וְ/קוֹמָ֤ה בְ/רֹ֨חַב֙ חָמֵ֣שׁ אַמּ֔וֹת לְ/עֻמַּ֖ת קַלְעֵ֥י הֶ/חָצֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/018.yaml
  text: And the screen for the gate of the courtyard was the work of an embroiderer[a], in blue and purple and scarlet yarn, and fine twined linen, twenty cubits long, and five cubits high[c][b], corresponding in width to the hangings of the courtyard.
translation:
  language: hi
  text: और आँगन के द्वार का परदा[a] कढ़ाई करनेवाले की कारीगरी का था। वह नीले, बैंगनी और किरमिजी रंग के सूत[b] और बटे हुए महीन सन-वस्त्र से बना था। उसकी लंबाई बीस हाथ थी, और उसकी ऊँचाई पाँच हाथ थी, जो आँगन के पर्दों के अनुरूप थी[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आँगन के प्रवेश का परदा।”
    reason: מָסַךְ और שַׁעַר का संयुक्त पद कपड़े के उस परदे को बताता है जो प्रवेश-स्थान पर लगा था; ‘द्वार’ और ‘प्रवेश’ दोनों सम्भव हैं।
  - marker: b
    text: हिब्रू में “नीला, बैंगनी और किरमिजी”; वस्त्र-संदर्भ स्पष्ट करने के लिए “रंग के सूत” जोड़ा गया है।
    reason: रंग-संज्ञाएँ यहाँ रंगी हुई वस्त्र-सामग्री को सूचित करती हैं, पर हिब्रू में ‘सूत’ स्पष्ट रूप से नहीं है।
  - marker: c
    text: 'हिब्रू का आयामी पद असामान्य है: लगभग “ऊँचाई, चौड़ाई में, पाँच हाथ।” इसका आशय सम्भवतः यह है कि द्वार के परदे की ऊँचाई आँगन के अन्य पर्दों के समान पाँच हाथ थी।'
    reason: בְרֹחַב के कारण आयामी अभिव्यक्ति कुछ अस्पष्ट है। मुख्य पाठ प्रसंगानुकूल अर्थ देता है और पादटिप्पणी मूल की असामान्य संरचना तथा अनिश्चितता को सुरक्षित रखती है।
lexical_decisions:
- source_word: מָסַךְ שַׁעַר הֶחָצֵר
  choice: आँगन के द्वार का परदा
  rationale: מָסַךְ यहाँ प्रवेश को ढकने वाला कपड़े का परदा है; ‘द्वार का परदा’ उसके स्थान और कार्य दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מַעֲשֵׂה רֹקֵם
  choice: कढ़ाई करनेवाले की कारीगरी
  rationale: यह पद कुशल रंगीन वस्त्र-कारीगरी या कढ़ाई का संकेत देता है। कारीगर-संबंधी संज्ञात्मक अभिव्यक्ति को बनाए रखा गया है।
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: नीले, बैंगनी और लाल रंग के सूत
  rationale: ये प्रतिष्ठित रंगों से रँगे वस्त्र-सामग्री के पद हैं। हिन्दी में वस्त्र-संदर्भ स्पष्ट करने के लिए ‘सूत’ जोड़ा गया है, जबकि रंगों का पारंपरिक भेद रखा गया है।
- source_word: שֵׁשׁ מָשְׁזָר
  choice: बटा हुआ उत्तम मलमल
  rationale: שֵׁשׁ तंबू के वस्त्र-वर्णनों में उत्कृष्ट महीन सन-वस्त्र को और מָשְׁזָר बटे हुए धागों को दर्शाता है। ‘उत्तम मलमल’ सामान्य पाठक के लिए महीन उच्च-गुणवत्ता वाले वस्त्र का सहज रूप है।
- source_word: עֶשְׂרִים אַמָּה אֹרֶךְ
  choice: लंबाई बीस हाथ
  rationale: अम्मा प्राचीन कुहनी-आधारित माप है; हिन्दी बाइबलीय प्रयोग में ‘हाथ’ संक्षिप्त और बोधगम्य पारंपरिक समतुल्य है।
- source_word: וְקוֹמָה בְרֹחַב חָמֵשׁ אַמּוֹת
  choice: ऊँचाई पाँच हाथ
  rationale: हिब्रू आयामी वाक्यांश कुछ असामान्य है। प्रसंग में पाँच हाथ परदे की ऊर्ध्व माप है; मुख्य पाठ में अर्थ स्पष्ट रखते हुए शाब्दिक संरचना की अनिश्चितता पादटिप्पणी में दी गई है।
- source_word: לְעֻמַּת קַלְעֵי הֶחָצֵר
  choice: आँगन के पर्दों के बराबर
  rationale: לְעֻמַּת यहाँ अनुरूपता या समानता बताता है। प्रसंग के अनुसार द्वार के परदे की पाँच हाथ की ऊँचाई चारों ओर के पर्दों से मेल खाती थी।
