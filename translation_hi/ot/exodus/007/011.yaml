  text: וַ/יִּקְרָא֙ גַּם פַּרְעֹ֔ה לַֽ/חֲכָמִ֖ים וְ/לַֽ/מְכַשְּׁפִ֑ים וַ/יַּֽעֲשׂ֨וּ גַם הֵ֜ם חַרְטֻמֵּ֥י מִצְרַ֛יִם בְּ/לַהֲטֵי/הֶ֖ם כֵּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/011.yaml
  text: Then Pharaoh also called for the wise men and the sorcerers[a], and they too, the magicians of Egypt, did the same by their enchantments.
translation:
  language: hi
  text: तब फ़िरौन ने भी ज्ञानी लोगों और जादू-टोना करने वालों को बुलाया; और मिस्र के जादूगरों ने भी अपनी गुप्त कलाओं से वैसा ही किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: बुलाया
  rationale: संदर्भ में क्रिया का अर्थ लोगों को अपने सामने उपस्थित होने के लिए बुलाना है; हिन्दी में ‘बुलाया’ स्वाभाविक और पर्याप्त है।
- source_word: גַּם
  choice: भी
  rationale: यह फ़िरौन की प्रतिक्रिया को पिछली घटना के समानांतर रखता है।
- source_word: חֲכָמִים
  choice: बुद्धिमानों
  rationale: यह दरबार के ज्ञानी या विशेषज्ञ व्यक्तियों को सूचित करता है और मूल के सामान्य पद को बनाए रखता है।
- source_word: מְכַשְּׁפִים
  choice: जादू-टोना करनेवालों
  rationale: यह כשׁף से जुड़े जादू-टोने के अभ्यासकर्ताओं को दर्शाता है और आगे आनेवाले חַרְטֻמִּים से शब्दगत भेद बनाए रखता है।
- source_word: וַיַּעֲשׂוּ גַם הֵם
  choice: और उन्होंने भी ... किया
  rationale: यह इस बात पर बल देता है कि मिस्री विशेषज्ञों ने भी पहले किए गए कार्य की नकल की।
- source_word: חַרְטֻמֵּי מִצְרַיִם
  choice: मिस्र के जादूगरों
  rationale: निर्गमन में यह फ़िरौन के अनुष्ठानिक विशेषज्ञों के लिए प्रयुक्त विशिष्ट पद है; ‘जादूगर’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: בְּלַהֲטֵיהֶם
  choice: अपने तंत्र-मंत्रों से
  rationale: संदर्भ में यह उनके गुप्त या जादुई उपायों को सूचित करता है; ठीक तकनीकी अर्थ अनिश्चित होने के कारण परिचित किन्तु व्यापक हिन्दी अभिव्यक्ति चुनी गई है।
- source_word: כֵּן
  choice: वैसा ही
  rationale: यह पिछले चिह्न की ओर संकेत करके उसकी नकल किए जाने का भाव स्पष्ट करता है।
theological_decisions:
- issue: मिस्री जादूगरों की सामर्थ्य का स्वरूप
  choice: घटना का वर्णन मात्र किया गया है—उन्होंने अपने तंत्र-मंत्रों से वैसा ही किया।
  alternative: इसे वास्तविक अलौकिक शक्ति, दुष्टात्मिक सामर्थ्य, भ्रम या छल के रूप में स्पष्ट करना।
  rationale: इब्रानी पाठ कार्य और उसके साधन का उल्लेख करता है, पर उसकी आध्यात्मिक या भौतिक प्रक्रिया नहीं समझाता; इसलिए अनुवाद उस प्रश्न को खुला रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और कथात्मक हिन्दी। ‘जादू-टोना करनेवाले’ और ‘जादूगर’ अलग-अलग इब्रानी पदों का भेद बनाए रखते हैं। ‘अर्थात’ से दूसरे पद को पहले समूह की व्याख्यात्मक पहचान के रूप में स्वाभाविक ढंग से जोड़ा गया है।
