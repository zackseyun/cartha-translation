  text: Moses was eighty years old[a], and Aaron was eighty-three years old, when they spoke to Pharaoh.
translation:
  language: hi
  text: मूसा अस्सी वर्ष के और हारून तिरासी वर्ष के थे, जब उन्होंने फ़िरौन से बात की।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן ... שָׁנָה
  choice: '... वर्ष के थे'
  rationale: इब्रानी में आयु बताने के लिए शाब्दिक रूप से ‘... वर्षों का पुत्र’ मुहावरा है; आधुनिक मानक हिन्दी में ‘... वर्ष के थे’ स्वाभाविक और अर्थनिष्ठ है।
- source_word: שְׁמֹנִים שָׁנָה
  choice: अस्सी वर्ष के
  rationale: आयु के लिए प्रयुक्त सामान्य संख्या-पद को हिन्दी के स्वाभाविक आयु-विधान में प्रस्तुत किया गया है।
- source_word: שָׁלֹשׁ וּשְׁמֹנִים שָׁנָה
  choice: तिरासी वर्ष के
  rationale: इब्रानी क्रम शाब्दिक रूप से ‘तीन और अस्सी’ है; आधुनिक हिन्दी में संख्या का स्वाभाविक रूप ‘तिरासी’ है।
- source_word: בְּדַבְּרָם
  choice: जब ... बात की
  rationale: בְּ के साथ infinitive construct और बहुवचन प्रत्यय यहाँ समय-सूचक है; ‘जब ... बात की’ उस संबंध को सहज हिन्दी में व्यक्त करता है।
- source_word: אֶל פַּרְעֹה
  choice: फ़िरौन से
  rationale: यद्यपि אֶל दिशा या संबोधन को सूचित करता है, हिन्दी में किसी व्यक्ति को संबोधित होकर बोलने के लिए ‘से बात करना’ स्वाभाविक प्रयोग है।
- source_word: וּ/מֹשֶׁה ... וְ/אַהֲרֹן
  choice: मूसा ... और हारून
  rationale: आरंभिक वाव कथा की निरंतरता जोड़ता है, पर हिन्दी में अलग आरंभिक ‘और/अब’ आवश्यक नहीं; हारून से पहले का वाव ‘और’ से व्यक्त है।
