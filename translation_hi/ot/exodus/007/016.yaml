source:
  edition: WLC
  text: וְ/אָמַרְתָּ֣ אֵלָ֗י/ו יְהוָ֞ה אֱלֹהֵ֤י הָ/עִבְרִים֙ שְׁלָחַ֤/נִי אֵלֶ֨י/ךָ֙ לֵ/אמֹ֔ר שַׁלַּח֙ אֶת עַמִּ֔/י וְ/יַֽעַבְדֻ֖/נִי בַּ/מִּדְבָּ֑ר וְ/הִנֵּ֥ה לֹא שָׁמַ֖עְתָּ עַד כֹּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/016.yaml
  text: 'And you shall say to him[a], ‘Yahweh, the God of the Hebrews, has sent me to you, saying: Let my people go, so that they may serve me in the wilderness. But behold, until now you have not listened.’'
translation:
  language: hi
  text: 'और तुम उससे कहना, ‘याहवे, इब्रानियों के परमेश्वर, ने मुझे तुम्हारे पास भेजा है और कहा है: मेरी प्रजा को जाने दो, ताकि वे जंगल में मेरी सेवा करें[a]। पर देखो, तुमने अब तक मेरी बात नहीं सुनी है।’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जंगल में मेरी आराधना करें।” इब्रानी क्रिया सामान्य सेवा अथवा धार्मिक अर्थ में आराधना, दोनों का बोध करा सकती है।
    reason: शब्द के व्यापक ‘सेवा’ और अधिक विशिष्ट ‘आराधना’ अर्थों को सुरक्षित रखना।
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम का देवनागरी लिप्यंतरण किया गया है; इसे किसी उपाधि से नहीं बदला गया।
- source_word: אֱלֹהֵי הָעִבְרִים
  choice: इब्रानियों के परमेश्वर
  rationale: मूल जातीय पद ‘इब्रानियों’ को बनाए रखते हुए संबंधवाचक रचना का स्वाभाविक हिन्दी रूप दिया गया है।
- source_word: שְׁלָחַנִי אֵלֶיךָ לֵאמֹר
  choice: ने मुझे तुम्हारे पास यह कहने के लिए भेजा है
  rationale: पूर्ण हो चुके भेजे जाने और उसके वर्तमान प्रयोजन, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שַׁלַּח אֶת־עַמִּי
  choice: मेरी प्रजा को जाने दो
  rationale: फिरौन से की गई रिहाई की आज्ञा को स्पष्ट और प्रचलित हिन्दी में व्यक्त करता है।
- source_word: וְיַעַבְדֻנִי
  choice: ताकि वे ... मेरी सेवा करें
  rationale: यहाँ वाव-संयोजित क्रिया आज्ञा का उद्देश्य बताती है। ‘सेवा करें’ עבד के व्यापक अर्थ को बचाता है, जिसमें धार्मिक आराधना भी सम्मिलित हो सकती है।
- source_word: בַּמִּדְבָּר
  choice: जंगल में
  rationale: מִדְבָּר के निर्जन वनप्रदेश के अर्थ के लिए सामान्य, सहज हिन्दी; ‘रेगिस्तान’ कहकर भूभाग को अनावश्यक रूप से सीमित नहीं करता।
- source_word: וְהִנֵּה
  choice: पर देखो
  rationale: ध्यान खींचने वाले और प्रसंग में विरोधात्मक बल रखने वाले संकेतक का स्वाभाविक हिन्दी रूप।
- source_word: לֹא שָׁמַעְתָּ עַד כֹּה
  choice: तुमने अब तक मेरी बात नहीं सुनी है
  rationale: ‘सुनना’ मूल क्रिया के अर्थ को बनाए रखता है, जबकि ‘मेरी बात नहीं सुनी’ हिन्दी में ध्यान न देने या न मानने का भाव भी स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। ‘याहवे’ उसे उपाधि में बदले बिना देवनागरी में प्रस्तुत करता है।
- issue: וְיַעַבְדֻנִי में सेवा और आराधना का संबंध
  choice: मेरी सेवा करें
  alternative: मेरी आराधना करें
  rationale: עבד सामान्य सेवा तथा धार्मिक उपासना, दोनों का बोध करा सकता है। मुख्य पाठ में ‘सेवा’ मूल की व्यापकता बचाता है और पादटिप्पणी धार्मिक अर्थ को स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली अपनाई गई है। फिरौन के लिए ‘तुम’ और बहुवचन-सम्मानसूचक क्रियारूप प्रयोग किए गए हैं, जिससे अनावश्यक रूप से कठोर ‘तू’ से बचते हुए सीधा संबोधन बना रहता है। पादटिप्पणी-चिह्न उसी पद ‘सेवा करें’ के बाद रखा गया है जिससे वह संबंधित है।
