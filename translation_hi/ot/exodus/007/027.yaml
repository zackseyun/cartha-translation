- source_word: כָּל גְּבוּלְךָ
  choice: तेरे सारे देश पर
  rationale: यहाँ גְּבוּל केवल सीमा-रेखा नहीं, फिरौन के पूरे भू-भाग या राज्य-क्षेत्र को सूचित करता है; ‘सारा देश’ सामान्य पाठक के लिए सहज है।
- source_word: בַּצְפַרְדְּעִים
  choice: मेंढकों की मार
  rationale: ב साधन को सूचित करता है। ‘मेंढकों की मार’ हिन्दी में उस विपत्ति के माध्यम और दंडात्मक स्वर दोनों को स्पष्ट करता है।
