base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/018.yaml
  text: And the fish that are in the Nile will die[a], and the Nile will stink[b], and the Egyptians will be unable to drink water from the Nile.
translation:
  language: hi
  text: और नील नदी[a] की मछलियाँ मर जाएँगी, नील नदी से दुर्गंध उठेगी, और मिस्री नील नदी का पानी पीने में असमर्थ हो जाएँगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘नदी’; इस प्रसंग में इसका आशय विशेष रूप से नील नदी से है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘नील नदी का पानी पीने का प्रयास करते-करते थक जाएँगे।’ इब्रानी क्रिया में थक जाने अथवा थकावट के कारण असमर्थ हो जाने—दोनों का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּגָה
  choice: मछलियाँ
  rationale: इब्रानी में यह एकवचन सामूहिक संज्ञा है, जो नदी की मछलियों को सामूहिक रूप से दर्शाती है; हिन्दी में बहुवचन स्वाभाविक है।
- source_word: יְאֹר
  choice: नील नदी
  rationale: निर्गमन के इस प्रसंग में यह शब्द विशेष रूप से नील नदी को सूचित करता है; ‘नील नदी’ सामान्य पाठक के लिए संदर्भ स्पष्ट करता है।
- source_word: תָּמוּת
  choice: मर जाएँगी
  rationale: यह מות का सीधा और स्वाभाविक भावी अर्थ है तथा हिन्दी में मछलियों के लिए सहज अभिव्यक्ति है।
- source_word: וּבָאַשׁ
  choice: से दुर्गंध उठेगी
  rationale: באש का अर्थ दुर्गंधित होना या सड़ाँध मारना है; यह चयन अर्थ की तीव्रता बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: וְנִלְאוּ
  choice: असमर्थ हो जाएँगे
  rationale: निफ़अल रूप थक जाने या थकावट के कारण कुछ न कर पाने का भाव रख सकता है। प्रसंग में व्यावहारिक असमर्थता मुख्य परिणाम है; वैकल्पिक ‘प्रयास करते-करते थक जाना’ पाद-टिप्पणी में सुरक्षित रखा गया है।
- source_word: לִשְׁתּוֹת מַיִם
  choice: पानी पीने
  rationale: मूल में क्रिया और उसका स्पष्ट कर्म ‘पानी’ दोनों हैं; हिन्दी में दोनों को रखना स्वाभाविक और अर्थपूर्ण है।
- source_word: מִן הַיְאֹר
  choice: नील नदी का
  rationale: पानी के साथ हिन्दी में ‘नील नदी का पानी’ स्रोत-संबंध को सहज रूप से व्यक्त करता है।
