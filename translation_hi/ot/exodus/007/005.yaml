  yaml_path: translation/ot/exodus/007/005.yaml
  text: And the Egyptians will know that I am Yahweh when I stretch out my hand against Egypt and bring the sons of Israel out from among them[a][b].
translation:
  language: hi
  text: और मिस्री जान लेंगे कि मैं याहवे[b] हूँ, जब मैं मिस्र के विरुद्ध अपना हाथ बढ़ाऊँगा और इस्राएल के पुत्रों[a] को उनके बीच से निकाल लाऊँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस्राएली” अथवा “इस्राएल की सन्तानें।” इब्रानी में शाब्दिक रूप से “इस्राएल के पुत्र” है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी ईश्वरीय नाम YHWH है। इसका ऐतिहासिक उच्चारण निश्चित नहीं है; “यहोवा” एक पारम्परिक रूप है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: और ... जान लेंगे
  rationale: भविष्यसूचक प्रसंग में संयोजक सहित पूर्ण रूप आगामी परिणाम बताता है। ‘जान लेंगे’ उस पहचान को सीधे व्यक्त करता है जो परमेश्वर के कार्यों से होगी।
- source_word: מִצְרַיִם
  choice: मिस्री
  rationale: यहाँ बहुवचन क्रिया के कारण शब्द देश नहीं, मिस्र के लोगों को सूचित करता है।
- source_word: כִּי
  choice: कि
  rationale: यह मिस्रियों के जानने की विषयवस्तु का परिचय देता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित ध्वन्यात्मक रूप से परमेश्वर के व्यक्तिगत नाम को रखा गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: בִּנְטֹתִי
  choice: जब मैं ... बढ़ाऊँगा
  rationale: पूर्वसर्ग सहित क्रियार्थक संज्ञा यहाँ समयवाचक है; हिन्दी में भविष्यकाल प्रसंगानुकूल और स्वाभाविक है।
- source_word: יָדִי
  choice: अपना हाथ
  rationale: इब्रानी के ठोस मानवरूपी बिंब को बनाए रखता है; इसे केवल ‘शक्ति’ कहकर व्याख्यायित नहीं किया गया।
- source_word: עַל מִצְרָיִם
  choice: मिस्र के विरुद्ध
  rationale: न्याय के प्रसंग में עַל विरोधी कार्रवाई व्यक्त करता है; यहाँ ‘मिस्र’ देश/राष्ट्र है।
- source_word: וְהוֹצֵאתִי
  choice: और ... निकाल लाऊँगा
  rationale: हिफ़ील का कारक अर्थ सुरक्षित है और हिन्दी में बाहर ले आने की क्रिया स्वाभाविक ढंग से व्यक्त होती है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: मूल के पारिवारिक और व्याकरणतः पुल्लिंग बहुवचन पदबंध को पारदर्शी रूप में रखा गया है।
- source_word: מִתּוֹכָם
  choice: उनके बीच से
  rationale: मिस्रियों के मध्य से अलग करके बाहर निकालने का भाव संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त होता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में उपाधि नहीं, चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम है। हिन्दी पाठकों में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ रूप को रखते हुए नाम को ‘प्रभु’ से प्रतिस्थापित नहीं किया गया।
- issue: בְּנֵי יִשְׂרָאֵל का निरूपण
  choice: इस्राएल के पुत्रों
  alternative: इस्राएली
  rationale: चुना हुआ रूप मूल के पारिवारिक पदबंध और पुल्लिंग बहुवचन को सामने रखता है; अधिक मुहावरेदार विकल्प पादटिप्पणी में दिया गया है।
