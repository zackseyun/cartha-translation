base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/024.yaml
  text: And all the Egyptians dug around the Nile for water to drink[a], because they could not drink from the water of the Nile.
translation:
  language: hi
  text: और सभी मिस्रियों ने पीने का पानी पाने के लिए नील नदी[a] के आसपास खोदा, क्योंकि वे नील नदी का पानी नहीं पी सकते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘नदी’ (यओर); निर्गमन की पुस्तक में यह शब्द विशेष रूप से नील नदी के लिए प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְפְּרוּ
  choice: खोदा
  rationale: חפר का सीधा अर्थ खोदना है। मूल पाठ कुएँ खोदने की बात स्पष्ट रूप से नहीं कहता, इसलिए केवल ‘खोदा’ रखा गया है।
- source_word: כָל מִצְרַיִם
  choice: सभी मिस्रियों
  rationale: शाब्दिक रूप से ‘सारा मिस्र’ संभव है, पर प्रसंग में सामूहिक रूप से मिस्र के लोगों का संकेत है; हिंदी में ‘सभी मिस्रियों’ स्वाभाविक और स्पष्ट है।
- source_word: סְבִיבֹת הַיְאֹר
  choice: नील नदी के आस-पास
  rationale: סְבִיבֹת आसपास के क्षेत्र को दर्शाता है और יְאֹר इस प्रसंग में नील नदी को सूचित करता है।
- source_word: מַיִם לִשְׁתּוֹת
  choice: पीने का पानी पाने के लिए
  rationale: मूल वाक्यांश ‘पीने के लिए पानी’ है। हिंदी वाक्य में खोदने के उद्देश्य को स्वाभाविक ढंग से स्पष्ट करने के लिए ‘पानी पाने के लिए’ कहा गया है; ‘पाने’ संदर्भगत है, कुआँ जैसी अतिरिक्त वस्तु नहीं जोड़ता।
- source_word: כִּי לֹא יָכְלוּ
  choice: क्योंकि वे ... नहीं पी सकते थे
  rationale: כִּי यहाँ खोदने का कारण बताता है और יכל असमर्थता व्यक्त करता है।
- source_word: לִשְׁתֹּת מִמֵּימֵי הַיְאֹר
  choice: नील नदी का पानी नहीं पी सकते थे
  rationale: מִן स्रोत को दर्शाता है। स्वाभाविक आधुनिक हिंदी में ‘नील नदी का पानी पीना’ वही आशय स्पष्ट रूप से व्यक्त करता है।
