  yaml_path: translation/ot/exodus/007/026.yaml
  text: 'And Yahweh said to Moses[a], “Go in to Pharaoh and say to him, ‘Thus says Yahweh: Let my people go, so that they may serve me.’”'
translation:
  language: hi
  text: 'याहवे ने मूसा से कहा, “फ़िरौन के पास जा और उससे कह, ‘याहवे यों कहता है: मेरे लोगों को जाने दे, ताकि वे मेरी सेवा करें[a]।’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरी उपासना करें।” इब्रानी क्रिया परमेश्वर की सेवा को दर्शा सकती है, जिसमें उपासना भी शामिल है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय देवनागरी में निकट लिप्यंतरण के रूप में रखा गया है।
- source_word: וַיֹּאמֶר
  choice: फिर ... ने ... कहा
  rationale: वाव-क्रमागत रूप कथा को आगे बढ़ाता है; आधुनिक हिन्दी में ‘फिर’ स्वाभाविक कथा-संबंध व्यक्त करता है।
- source_word: בֹּא אֶל־פַּרְעֹה
  choice: फ़िरौन के पास भीतर जा
  rationale: בוא का अर्थ संदर्भानुसार आना, जाना या प्रवेश करना हो सकता है। यहाँ राज-दरबार में फ़िरौन की उपस्थिति में प्रवेश करने का भाव बनाए रखा गया है।
- source_word: וְאָמַרְתָּ אֵלָיו
  choice: और उससे कह
  rationale: क्रमिक आज्ञा को सहज आधुनिक हिन्दी में प्रत्यक्ष आदेश के रूप में व्यक्त किया गया है।
- source_word: כֹּה אָמַר יְהוָה
  choice: यहवे यों कहता है
  rationale: यह औपचारिक और अधिकारपूर्ण संदेशवाहक-सूत्र का स्वाभाविक हिन्दी रूप है।
- source_word: שַׁלַּח אֶת־עַמִּי
  choice: मेरी प्रजा को जाने दे
  rationale: यह पदबंध माँगी गई रिहाई को व्यक्त करता है; ‘जाने दे’ हिन्दी में इस आदेश का सटीक और प्रचलित रूप है।
- source_word: עַמִּי
  choice: मेरी प्रजा
  rationale: प्रथम पुरुष एकवचन संबंध और सामूहिक वाचायी दावे को स्पष्ट रखता है।
- source_word: וְיַעַבְדֻנִי
  choice: ताकि वे मेरी सेवा करें
  rationale: संदर्भ में उपसर्गयुक्त क्रिया उद्देश्य व्यक्त करती है। ‘सेवा करें’ עבד की व्यापक अर्थ-सीमा को बनाए रखता है, जिसमें परमेश्वर की उपासना भी सम्मिलित हो सकती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा
  rationale: मूल पाठ में निजी वाचा-नाम प्रत्यक्ष रूप से आया है। ‘यहवे’ उसके मान्य निकट लिप्यंतरण को सुरक्षित रखता है, न कि उसे किसी उपाधि से बदलता है।
- issue: וְיַעַבְדֻנִי में इस्राएल के उद्देश्य का अर्थ
  choice: मेरी सेवा करें
  alternative: मेरी उपासना करें
  rationale: परमेश्वर के संबंध में עבד ऐसी सेवा को सूचित कर सकता है जिसमें उपासना शामिल है, पर ‘सेवा’ इसकी व्यापक अर्थ-सीमा और फ़िरौन की दासता से परमेश्वर की सेवा की ओर जाने के विषय को बनाए रखती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। ‘यों कहता है’ संदेशवाहक-सूत्र की औपचारिकता बनाए रखता है; ‘के पास भीतर जा’ मूल के प्रवेश-भाव को स्वाभाविक सीमा तक सुरक्षित रखता है।
