  text: The frogs will come up on you[a], on your people, and on all your servants.
translation:
  language: hi
  text: और मेंढक तुझ पर[a], तेरी प्रजा पर और तेरे सब सेवकों पर चढ़ आएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दूसरे वाक्यांश में अनुवाद ‘तेरी प्रजा के बीच’ भी हो सकता है। इब्रानी में तीनों वाक्यांशों के साथ एक ही संबंधबोधक शब्द है, पर प्रसंग में फ़िरौन और उसके राज्य पर विपत्ति आ पड़ने का भाव अधिक उपयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכָה
  choice: और ... तुझ पर
  rationale: בְּ को עָלָה के साथ विपत्ति के रूप में किसी पर आ पड़ने के अर्थ में लिया गया है। एकवचन संबोधन और प्रसंग के अनुरूप ‘तुझ’ फ़िरौन को सूचित करता है।
- source_word: וּבְעַמְּךָ
  choice: तेरी प्रजा पर
  rationale: दोहराए गए בְּ का समानांतर रूप बनाए रखते हुए ‘पर’ रखा गया है; ‘के बीच’ संभव है, पर विपत्ति के आ पड़ने की तीव्रता कम कर देता है।
- source_word: וּבְכָל עֲבָדֶיךָ
  choice: और तेरे सब सेवकों पर
  rationale: עֶבֶד का अर्थ सेवक, दास या राजकीय अधिकारी हो सकता है। यहाँ ‘सेवक’ व्यापक और स्वाभाविक है तथा पद से अधिक विशिष्ट सामाजिक स्थिति आरोपित नहीं करता।
- source_word: יַעֲלוּ
  choice: चढ़ आएँगे
  rationale: עָלָה का मूल ऊर्ध्वगामी भाव और नील से निकलकर लोगों पर फैलने का प्रसंग, दोनों ‘चढ़ आएँगे’ में स्वाभाविक रूप से व्यक्त होते हैं।
- source_word: הַצְפַרְדְּעִים
  choice: मेंढक
  rationale: हिब्रू निश्चित लेख घोषित मेंढक-विपत्ति की ओर संकेत करता है। हिन्दी में बहुवचन ‘मेंढक’ बिना ‘वे’ के भी इस संदर्भ में स्वाभाविक और पर्याप्त निश्चित है।
