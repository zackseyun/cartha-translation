base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/004.yaml
  text: Pharaoh will not listen to you[a], and I will lay my hand on Egypt and bring out my hosts—my people[c][b], the sons of Israel—from the land of Egypt with great judgments.
translation:
  language: hi
  text: फ़िरौन तुम्हारी बात नहीं सुनेगा, और मैं मिस्र पर अपना हाथ रखूँगा और अपनी सेनाओं[a]—अपनी प्रजा, इस्राएलियों[b]—को न्याय के बड़े-बड़े कार्यों[c] के द्वारा मिस्र देश से निकाल लाऊँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘अपने दलों’ अथवा ‘अपनी सेनाओं’। इब्रानी शब्द संगठित समूहों को, अक्सर सैन्य अर्थ-छाया के साथ, सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘मेरी प्रजा, इस्राएल के पुत्र’।
    reason: lexical_alternative
  - marker: c
    text: या, ‘महान न्यायों के साथ/द्वारा’।
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁמַע אֲלֵכֶם
  choice: तुम्हारी बात नहीं सुनेगा
  rationale: שׁמע के साथ אֶל का अर्थ यहाँ किसी की बात सुनना या उस पर ध्यान देना है। यह अनुवाद आज की स्वाभाविक हिन्दी में अर्थ रखता है और इसे सीधे ‘आज्ञा मानना’ बनाकर निहितार्थ को अधिक स्पष्ट नहीं करता।
- source_word: וְנָתַתִּי אֶת יָדִי בְּמִצְרָיִם
  choice: मैं मिस्र पर अपना हाथ रखूँगा
  rationale: मूल पाठ के ‘अपना हाथ रखना’ रूपक को बनाए रखा गया है; प्रसंग में यह मिस्र के विरुद्ध परमेश्वर की निर्णायक न्यायकारी कार्रवाई दर्शाता है। ‘हाथ बढ़ाऊँगा’ अधिक प्रचलित है, पर उसके लिए सामान्यतः प्रयुक्त נָטָה इस पद में नहीं है।
- source_word: צִבְאֹתַי
  choice: अपने दलों
  rationale: צָבָא संगठित समूह, सेना या सैन्य दल को सूचित कर सकता है। ‘दलों’ से संगठित सामूहिकता और हल्की सैन्य छवि दोनों बचती हैं, जबकि ‘सेनाओं’ से यहाँ अनावश्यक रूप से पूर्ण सैन्य बल का बोध हो सकता है।
- source_word: עַמִּי בְנֵי יִשְׂרָאֵל
  choice: अपनी प्रजा, इस्राएल के पुत्रों
  rationale: 'मूल की समानाधिकरण रचना रखी गई है: ‘मेरी प्रजा’ की पहचान ‘इस्राएल के पुत्रों’ के रूप में होती है। ‘इस्राएल के पुत्र’ בְנֵי יִשְׂרָאֵל का औपचारिक और समझने योग्य अनुवाद है।'
- source_word: בִּשְׁפָטִים גְּדֹלִים
  choice: बड़े-बड़े न्याय-दंडों के द्वारा
  rationale: שְׁפָטִים यहाँ परमेश्वर द्वारा कार्यान्वित न्यायकारी दंडों को दर्शाता है। ‘न्याय-दंड’ हिन्दी में न्याय और दंडात्मक कार्रवाई दोनों पहलुओं को स्पष्ट करता है; बहुवचन का भाव ‘बड़े-बड़े’ से व्यक्त है।
theological_decisions:
- issue: इस्राएल के लिए צִבְאֹתַי का चित्र
  choice: अपने दलों
  alternative: अपनी सेनाओं / अपने समुदायों
  rationale: ‘दल’ इस्राएल को यहोवा के अधिकार में निकलने वाले संगठित समूहों के रूप में प्रस्तुत करता है और मूल की सैन्य-सामुदायिक अर्थ-सीमा को किसी एक ओर पूरी तरह सीमित नहीं करता।
- issue: בְנֵי יִשְׂרָאֵל में वंशसूचक पद
  choice: इस्राएल के पुत्रों
  alternative: इस्राएलियों / इस्राएल की सन्तान
  rationale: ‘पुत्रों’ से मूल का पुल्लिंग वंशसूचक रूप बना रहता है। प्रसंग में यह समूचे जातीय समुदाय का पारंपरिक नाम है, केवल पुरुष सदस्यों का सीमित उल्लेख नहीं।
- issue: בִּשְׁפָטִים גְּדֹלִים में न्याय और दंड का संबंध
  choice: बड़े-बड़े न्याय-दंडों के द्वारा
  alternative: बड़े-बड़े न्याय के कामों के द्वारा / बड़े दंडों के साथ
  rationale: चयन यह स्पष्ट करता है कि आगामी विपत्तियाँ केवल शक्ति-प्रदर्शन नहीं, मिस्र पर किए गए दैवी न्याय के कार्य हैं, पर यह उनके सटीक स्वरूप को पद से अधिक निर्धारित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वाक्य में ‘पर…तब’ से फ़िरौन की अस्वीकृति और उसके प्रत्युत्तर में होने वाली दैवी कार्रवाई का संबंध स्पष्ट होता है। ‘निकाल लाऊँगा’ הוֹצֵאתִי के प्रेरणार्थक भाव को स्वाभाविक हिन्दी में व्यक्त करता है। कोई पादटिप्पणी आवश्यक नहीं मानी गई।
