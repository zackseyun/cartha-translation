id: EXO.7.1
reference: Exodus 7:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה רְאֵ֛ה נְתַתִּ֥י/ךָ אֱלֹהִ֖ים לְ/פַרְעֹ֑ה וְ/אַהֲרֹ֥ן אָחִ֖י/ךָ יִהְיֶ֥ה נְבִיאֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/001.yaml
  text: Then Yahweh said to Moses[a], “See, I have made you God to Pharaoh, and Aaron your brother will be your prophet.”
translation:
  language: hi
  text: तब यहोवा ने मूसा से कहा, “देख, मैंने तुझे फ़िरौन के लिए परमेश्वर ठहराया है[a], और तेरा भाई हारून तेरा नबी होगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में अधिक शाब्दिक रूप से, “मैंने तुझे फ़िरौन के लिए परमेश्वर ठहराया है।” यहाँ मूसा फ़िरौन के सामने परमेश्वर के अधिकार का प्रतिनिधि है, और हारून उसके नबी की भूमिका निभाता है।
    reason: यह असामान्य और धर्मवैज्ञानिक रूप से तनावपूर्ण इब्रानी कथन की प्रतिनिधिक भूमिका स्पष्ट करता है, बिना मुख्य पाठ में ‘के समान’ जोड़कर मूल की अस्पष्टता मिटाए।
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के व्यक्तिगत नाम के प्रचलित लिप्यंतरण को रखा गया है; इसे किसी उपाधि से नहीं बदला गया।
- source_word: וַיֹּאמֶר
  choice: तब ... कहा
  rationale: वाव-क्रमवाचक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में इसके क्रमिक बल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: רְאֵה
  choice: देख
  rationale: यह आज्ञार्थक शब्द आगे कही जाने वाली बात की ओर मूसा का ध्यान खींचता है।
- source_word: נְתַתִּיךָ
  choice: मैंने तुझे ... ठहराया है
  rationale: मूल क्रिया का शाब्दिक अर्थ ‘दिया’ है, पर विधेय के साथ यह किसी भूमिका या पद पर रखने का अर्थ देती है; ‘ठहराया’ उस फलित भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: इब्रानी पाठ में बिना किसी स्पष्ट तुलनासूचक शब्द के यही पद मूसा के लिए प्रयुक्त है। मुख्य पाठ में इसकी तीक्ष्णता और अस्पष्टता बनाए रखी गई है, जबकि पादटिप्पणी प्रतिनिधिक भूमिका स्पष्ट करती है।
- source_word: לְפַרְעֹה
  choice: फ़िरौन के लिए
  rationale: लामेद यहाँ फ़िरौन के संबंध में मूसा की भूमिका बताता है; ‘के लिए’ मूल संबंधसूचक रचना को निकटता से रखता है।
- source_word: נְבִיאֶךָ
  choice: तेरा नबी
  rationale: यह नबी के लिए मानक इब्रानी शब्द है; इसे केवल ‘प्रवक्ता’ या ‘मुखपत्र’ बनाकर अर्थ को संकुचित नहीं किया गया।
- source_word: יִהְיֶה
  choice: होगा
  rationale: यहाँ साधारण भविष्यकाल का स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: फ़िरौन के संबंध में मूसा को אֱלֹהִים कहना
  choice: परमेश्वर
  alternative: परमेश्वर के समान / एक देवता
  rationale: मूल इब्रानी में ‘समान’ जैसा कोई शब्द नहीं है। इसलिए मुख्य पाठ प्रत्यक्ष कथन को बनाए रखता है और उसे धर्मवैज्ञानिक सावधानी के कारण नरम नहीं करता। संदर्भ में हारून का मूसा का ‘नबी’ होना मूसा की प्रतिनिधिक, अधिकारपूर्ण भूमिका दिखाता है; पादटिप्पणी यह स्पष्ट करती है कि कथन मूसा को स्वभावतः परमेश्वर घोषित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘तुझे/तेरा’ प्रत्यक्ष संबोधन में इब्रानी एकवचन की निकटता और स्वाभाविक हिन्दी बाइबलीय शैली बनाए रखता है।
