  text: And each man threw down his staff[a], and they became serpents; but Aaron’s staff swallowed up their staffs.
translation:
  language: hi
  text: तब हर एक ने अपनी लाठी नीचे फेंकी, और वे साँप[a] बन गईं; पर हारून की लाठी उनकी लाठियों को निगल गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ड्रैगन” अथवा “विशाल सरीसृप”; इब्रानी शब्द तन्नीन सामान्यतः ‘साँप’ के लिए प्रयुक्त शब्द की अपेक्षा व्यापक अर्थ रखता है और साँप-जैसे जीव को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁלִיכוּ
  choice: नीचे फेंकी
  rationale: שׁלך यहाँ किसी वस्तु को सामने नीचे फेंकने का बोध देता है; यह प्रयोग आधुनिक हिन्दी में स्वाभाविक है और दृश्य की दिशा भी बनाए रखता है।
- source_word: אִישׁ
  choice: हर एक
  rationale: אִישׁ यहाँ वितरणात्मक है—प्रत्येक व्यक्ति ने अपनी लाठी फेंकी। ‘हर एक’ इस अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है और अनावश्यक रूप से ‘पुरुष’ जोड़ने से बचता है।
- source_word: מַטֵּהוּ / מַטֵּה / מַטֹּתָם
  choice: अपनी लाठी / लाठी / उनकी लाठियों
  rationale: מַטֶּה के लिए ‘लाठी’ इस कथानक में ठोस, परिचित और आधुनिक हिन्दी का स्वाभाविक शब्द है; मूल के एकवचन और बहुवचन भेद सुरक्षित रखे गए हैं।
- source_word: וַיִּהְיוּ
  choice: बन गईं
  rationale: היה यहाँ परिवर्तन के परिणाम को दर्शाता है। ‘बन गईं’ स्पष्ट और सहज है तथा अनावश्यक व्याख्या नहीं जोड़ता।
- source_word: לְתַנִּינִם
  choice: बड़े साँप
  rationale: תַּנִּין सामान्य ‘साँप’ वाले शब्द से अधिक व्यापक, साँप-जैसे बड़े जीव का बोध करा सकता है। प्रसंग में ‘बड़े साँप’ अर्थ को सुबोध रखता है, जबकि व्यापक वैकल्पिक अर्थ पाद-टिप्पणी में सुरक्षित हैं।
- source_word: וַיִּבְלַע
  choice: निगल गई
  rationale: בלע का अर्थ निगलना या पूरी तरह समा लेना है। ‘निगल गई’ कथात्मक हिन्दी में स्वाभाविक और ठोस है।
- source_word: אֶת
  choice: '[निश्चित कर्म-चिह्न; अलग से अनूदित नहीं]'
  rationale: אֶת इब्रानी में निश्चित प्रत्यक्ष कर्म को चिह्नित करता है; हिन्दी में इसका कार्य वाक्य-रचना और ‘को’ द्वारा व्यक्त हुआ है।
