  text: כִּי֩ יְדַבֵּ֨ר אֲלֵ/כֶ֤ם פַּרְעֹה֙ לֵ/אמֹ֔ר תְּנ֥וּ לָ/כֶ֖ם מוֹפֵ֑ת וְ/אָמַרְתָּ֣ אֶֽל אַהֲרֹ֗ן קַ֧ח אֶֽת מַטְּ/ךָ֛ וְ/הַשְׁלֵ֥ךְ לִ/פְנֵֽי פַרְעֹ֖ה יְהִ֥י לְ/תַנִּֽין־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/009.yaml
  text: When Pharaoh speaks to you[a], saying, ‘Produce a sign for yourselves,’ then you shall say to Aaron, ‘Take your staff and throw it down before Pharaoh; let it become a serpent.’
translation:
  language: hi
  text: जब फ़िरौन तुम दोनों से कहे, ‘अपने लिए कोई चिन्ह प्रस्तुत करो,’ तब तुम हारून से कहना, ‘अपनी लाठी लो और उसे फ़िरौन के सामने फेंक दो; वह सर्प[a] बन जाए।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ड्रैगन-जैसा प्राणी।” इब्रानी शब्द तन्नीन प्रसंग के अनुसार सर्प, समुद्री जीव, या ड्रैगन-जैसे प्राणी को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יְדַבֵּר
  choice: जब ... कहे
  rationale: यहाँ כִּי भावी परिस्थिति का परिचय देता है, कारण का नहीं; इसलिए आधुनिक हिन्दी में ‘जब ... कहे’ स्वाभाविक और सटीक है।
- source_word: אֲלֵכֶם
  choice: तुम दोनों से
  rationale: इब्रानी सर्वनाम बहुवचन है और प्रसंग में मूसा तथा हारून की ओर संकेत करता है; ‘तुम दोनों’ इस संख्या-भेद को स्पष्ट रखता है।
- source_word: תְּנוּ לָכֶם מוֹפֵת
  choice: अपने लिए कोई चिन्ह प्रस्तुत करो
  rationale: शाब्दिक भाव ‘अपने लिए एक चिन्ह दो’ है। ‘प्रस्तुत करो’ फ़िरौन की माँग को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि ‘अपने लिए’ לָכֶם के आत्मसंबंधी भाव को बनाए रखता है।
- source_word: וְאָמַרְתָּ אֶל־אַהֲרֹן
  choice: तब तुम हारून से कहना
  rationale: क्रमसूचक वाव को ‘तब’ से व्यक्त किया गया है। इब्रानी क्रिया एकवचन है और संबोधन मूसा से है; हिन्दी में हारून का उल्लेख इसे प्रसंगतः स्पष्ट करता है।
- source_word: מַטְּךָ
  choice: अपनी लाठी
  rationale: מַטֶּה के लिए ‘लाठी’ सामान्य, वर्तमान और प्रसंगानुकूल हिन्दी है; ‘दंड’ यहाँ अधिक औपचारिक या राजकीय अर्थ दे सकता है।
- source_word: וְהַשְׁלֵךְ
  choice: फेंक दो
  rationale: यह क्रिया वस्तु को फेंकने का सीधा आदेश है; ‘फेंक दो’ आधुनिक हिन्दी में सहज है और नीचे डालने का परिणाम प्रसंग से स्पष्ट है।
- source_word: לִפְנֵי פַרְעֹה
  choice: फ़िरौन के सामने
  rationale: यह स्थान और उपस्थिति दोनों का स्वाभाविक हिन्दी रूप है।
- source_word: יְהִי
  choice: वह ... बन जाए
  rationale: इब्रानी इच्छार्थक रूप आदेश के अभिप्रेत परिणाम को व्यक्त करता है; ‘बन जाए’ इसे सपाट भविष्यवचन बनाए बिना सुरक्षित रखता है।
- source_word: תַנִּין
  choice: सर्प
  rationale: इस शब्द का अर्थ-क्षेत्र साँप से व्यापक हो सकता है, पर लाठी के रूपांतरण वाले इस प्रसंग में ‘सर्प’ सबसे उपयुक्त और गरिमापूर्ण मुख्य-पाठ विकल्प है। व्यापक अर्थ-क्षेत्र को पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: लाठी से बने प्राणी के लिए תַנִּין का अनुवाद
  choice: सर्प
  alternative: विशाल सर्पाकार या अजगर-जैसा प्राणी
  rationale: תַנִּין कभी बड़े सरीसृप, समुद्री प्राणी या अजगर-जैसे प्राणी के लिए भी प्रयुक्त हो सकता है। यहाँ संकेत के रूप में लाठी के रूपांतरण का प्रसंग ‘सर्प’ का समर्थन करता है, पर शब्द के व्यापक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। बहुवचन אֲלֵכֶם को ‘तुम दोनों’ से स्पष्ट किया गया है, जबकि आगे मूसा को दिए गए एकवचन निर्देश का भाव ‘तुम हारून से कहना’ में प्रसंगानुसार बना रहता है।
