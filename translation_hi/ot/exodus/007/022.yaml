  text: וַ/יַּֽעֲשׂוּ כֵ֛ן חַרְטֻמֵּ֥י מִצְרַ֖יִם בְּ/לָטֵי/הֶ֑ם וַ/יֶּחֱזַ֤ק לֵב פַּרְעֹה֙ וְ/לֹא שָׁמַ֣ע אֲלֵ/הֶ֔ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/022.yaml
  text: But the magicians of Egypt did the same by their secret arts[a], and Pharaoh’s heart was hardened, and he did not listen to them[b], just as Yahweh had spoken.
translation:
  language: hi
  text: किन्तु मिस्र के जादूगरों ने भी अपनी गुप्त जादुई कलाओं से वैसा ही किया[a]। तब फ़िरौन का हृदय कठोर हो गया[b], और उसने उनकी बात नहीं सुनी, जैसा याहवे ने कहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने मंत्रों से” अथवा “अपनी जादू-विद्या से।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी पाठ यह स्पष्ट नहीं करता कि फ़िरौन के हृदय को कठोर करने वाला कौन था।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: ने भी ... वैसा ही किया
  rationale: यह स्वाभाविक हिन्दी में पिछले पद में किए गए काम से स्पष्ट समानता व्यक्त करता है। ‘भी’ मिस्र के जादूगरों द्वारा उसी काम की नकल किए जाने को उभारता है।
- source_word: חַרְטֻמֵּי מִצְרַיִם
  choice: मिस्र के जादूगरों
  rationale: निर्गमन के प्रसंग में यह पद फ़िरौन के उन अनुष्ठान-विशेषज्ञों के लिए है जो चिह्नों की नकल करते हैं; ‘जादूगर’ आधुनिक हिन्दी में इसका सबसे स्पष्ट और सहज रूप है।
- source_word: בְּלָטֵיהֶם
  choice: अपनी गुप्त जादुई कलाओं से
  rationale: यह अनुवाद בְּ के साधनवाचक अर्थ और לָטִים में निहित गुप्त अथवा छिपी हुई जादुई क्रियाओं—दोनों को व्यक्त करता है, पर उनकी विधि को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: וַיֶּחֱזַק לֵב פַּרְעֹה
  choice: फ़िरौन का हृदय कठोर हो गया
  rationale: इब्रानी वाक्य परिणाम अथवा अवस्था बताता है और कठोर करने वाले को स्पष्ट विषय नहीं बनाता। हिन्दी का यह अकर्मक रूप उसी अनिर्दिष्ट कर्तृत्व को बनाए रखता है।
- source_word: וְלֹא שָׁמַע אֲלֵהֶם
  choice: उसने उनकी बात नहीं सुनी
  rationale: שׁמע אֶל का अर्थ यहाँ किसी की बात सुनना अथवा उस पर ध्यान देना है। ‘उनकी’ प्रसंग में मूसा और हारून की ओर संकेत करता है, बिना मूल सर्वनाम को खोलकर नाम जोड़ने के।
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: ठीक जैसा याहवे ने कहा था
  rationale: यह सूत्र याहवे की पहले कही हुई बात की ओर लौटता है; ‘कहा था’ हिन्दी में उस पूर्ववर्ती कथन को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी लिपि में उसके प्रचलित विद्वत्तापूर्ण उच्चारण के निकट रूप में रखा गया है।
theological_decisions:
- issue: फ़िरौन के हृदय के कठोर होने का कर्ता
  choice: 'वाक्य को अकर्मक परिणाम के रूप में रखा गया है: ‘फ़िरौन का हृदय कठोर हो गया।’'
  alternative: ‘याहवे ने फ़िरौन का हृदय कठोर कर दिया’ या ‘फ़िरौन ने अपना हृदय कठोर कर लिया।’
  rationale: इस पद में इब्रानी पाठ न तो परमेश्वर को और न फ़िरौन को स्पष्ट रूप से कठोर करने वाला बताता है। अनुवाद निकटवर्ती पदों से कोई निष्कर्ष आयात किए बिना इस धर्मवैचारिक तनाव को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘किन्तु’, ‘हृदय’ और ‘याहवे’ औपचारिक बाइबलीय गरिमा बनाए रखते हैं, जबकि शेष वाक्यरचना सामान्य हिन्दी पाठक के लिए सीधी है। सभी पाद-टिप्पणी चिह्न मुख्य पाठ में दिए गए हैं।
