  edition: WLC
  text: וַ/יַּֽעֲשׂוּ כֵן֩ מֹשֶׁ֨ה וְ/אַהֲרֹ֜ן כַּ/אֲשֶׁ֣ר צִוָּ֣ה יְהוָ֗ה וַ/יָּ֤רֶם בַּ/מַּטֶּה֙ וַ/יַּ֤ךְ אֶת הַ/מַּ֨יִם֙ אֲשֶׁ֣ר בַּ/יְאֹ֔ר לְ/עֵינֵ֣י פַרְעֹ֔ה וּ/לְ/עֵינֵ֖י עֲבָדָ֑י/ו וַ/יֵּהָֽפְכ֛וּ כָּל הַ/מַּ֥יִם אֲשֶׁר בַּ/יְאֹ֖ר לְ/דָֽם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/020.yaml
  text: So Moses and Aaron did so[a], just as Yahweh had commanded. And he raised the staff and struck the water that was in the Nile before Pharaoh's eyes and before the eyes of his servants, and all the water that was in the Nile was turned to blood.
translation:
  language: hi
  text: तब मूसा और हारून ने वैसा ही किया, जैसा याहवे ने आज्ञा दी थी। उसने लाठी उठाई और फ़िरौन तथा उसके सेवकों की आँखों के सामने नील नदी[a] के पानी पर प्रहार किया। तब नील नदी का सारा पानी खून में बदल गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘नदी’; निर्गमन की पुस्तक में यह शब्द सामान्यतः विशेष रूप से नील नदी के लिए प्रयुक्त होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: वैसा ही किया
  rationale: यह עשה + כן के आज्ञापालन-सूचक अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: כַּאֲשֶׁר צִוָּה
  choice: जैसा ... ने आज्ञा दी थी
  rationale: तुलना और पहले दी जा चुकी आज्ञा—दोनों को स्पष्ट तथा सहज हिन्दी में बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय परमेश्वर-नाम को पदवी से बदलने के बजाय उसके प्रचलित विद्वत्तापूर्ण उच्चारण का हिन्दी लिप्यंतरण किया गया है।
- source_word: וַיָּרֶם
  choice: उसने ... उठाई
  rationale: इब्रानी में क्रिया एकवचन है, पर कर्ता का नाम यहाँ दोहराया नहीं गया। ‘उसने’ इस संरचनात्मक अस्पष्टता को बनाए रखता है।
- source_word: בַּמַּטֶּה
  choice: लाठी
  rationale: मַטֶּה के लिए यह स्पष्ट, स्वाभाविक और कथा-संदर्भ के अनुकूल आधुनिक हिन्दी शब्द है।
- source_word: וַיַּךְ אֶת־הַמַּיִם
  choice: पानी पर प्रहार किया
  rationale: נכה के आघात करने के अर्थ को गरिमापूर्ण और सहज हिन्दी में व्यक्त करता है।
- source_word: הַיְאֹר
  choice: नील नदी
  rationale: निर्गमन के मिस्री संदर्भ में יְאֹר सामान्यतः नील नदी को सूचित करता है; पाठ में संदर्भ स्पष्ट किया गया है और शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: לְעֵינֵי ... וּלְעֵינֵי
  choice: फ़िरौन तथा उसके सेवकों की आँखों के सामने
  rationale: सार्वजनिक रूप से दिखाई देने पर इब्रानी के बल को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: עֲבָדָיו
  choice: उसके सेवकों
  rationale: मूल शब्द का सीधा अर्थ ‘सेवक’ है; पद उनके प्रशासनिक पद या दर्जे को अधिक विशिष्ट नहीं बनाता।
- source_word: וַיֵּהָפְכוּ ... לְדָם
  choice: सारा पानी खून में बदल गया
  rationale: परिणामसूचक इब्रानी रचना को हिन्दी के स्वाभाविक वाक्य-विन्यास में व्यक्त करता है; ‘पानी’ को समूहवाचक एकवचन के रूप में लिया गया है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम स्पष्ट रूप से आया है। ‘याहवे’ उसे पदवी में बदले बिना हिन्दी में प्रस्तुत करता है।
- issue: लाठी उठाने और पानी पर प्रहार करने वाले एकवचन कर्ता की पहचान
  choice: उसने
  alternative: हारून ने
  rationale: निकटवर्ती संदर्भ हारून की ओर संकेत कर सकता है, पर इस पद का इब्रानी पाठ कर्ता का नाम नहीं दोहराता। इसलिए अनुवाद मूल की अस्पष्टता को अनावश्यक रूप से नहीं सुलझाता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज और गरिमापूर्ण रखी गई है। ‘आँखों के सामने’ मूल की दृश्य-साक्ष्य वाली अभिव्यक्ति को बनाए रखता है। ‘खून’ आधुनिक पाठकों के लिए ‘लहू’ से अधिक सामान्य है, जबकि अर्थ की गंभीरता बनी रहती है।
