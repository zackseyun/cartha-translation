base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/010.yaml
  text: So Moses and Aaron went in to Pharaoh[a], and they did so, just as Yahweh had commanded. Then Aaron threw down his staff before Pharaoh and before his servants, and it became a serpent.
translation:
  language: hi
  text: तब मूसा और हारून फ़िरौन के पास गए, और उन्होंने ठीक वैसा ही किया जैसा याहवे ने आज्ञा दी थी। फिर हारून ने अपनी लाठी फ़िरौन के सामने और उसके सेवकों के सामने फेंक दी, और वह एक सर्प[a] बन गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द तन्नीन सर्प के अतिरिक्त किसी बड़े सरीसृप या विकराल, ड्रैगन-जैसे प्राणी को भी दर्शा सकता है; यहाँ फ़िरौन के सामने दिखाए गए इस चिह्न में संभवतः सर्प अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: के पास गए
  rationale: क्रिया रूपतः एकवचन है, पर संयुक्त कर्ता ‘मूसा और हारून’ से पहले आकर दोनों की गति को व्यक्त करती है। ‘फ़िरौन के पास गए’ उसके सम्मुख प्रवेश करने का भाव स्वाभाविक हिन्दी में देता है।
- source_word: וַיַּעֲשׂוּ כֵן
  choice: उन्होंने ठीक वैसा ही किया
  rationale: यह आज्ञा के अनुरूप कार्य करने का मुहावरा है; ‘ठीक वैसा ही’ आज्ञापालन की सटीक अनुरूपता बनाए रखता है।
- source_word: כַּאֲשֶׁר צִוָּה
  choice: जैसा ... ने आज्ञा दी थी
  rationale: यह पहले दी गई आज्ञा के अनुसार किए गए कार्य को बताता है; ‘दी थी’ हिन्दी कथा-क्रम में उस पूर्वता को स्पष्ट करता है।
- source_word: יְהוָה
  choice: यहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम का हिन्दी लिप्यंतरण किया गया है, किसी उपाधि से प्रतिस्थापित नहीं।
- source_word: וַיַּשְׁלֵךְ
  choice: फेंक दी
  rationale: क्रिया किसी वस्तु को फेंकने या डाल देने को व्यक्त करती है; लाठी के साथ ‘फेंक दी’ स्पष्ट और आधुनिक हिन्दी है।
- source_word: מַטֵּהוּ
  choice: अपनी लाठी
  rationale: प्रत्यय हारून की लाठी को सूचित करता है; कर्ता-संदर्भ में हिन्दी का ‘अपनी’ स्वाभाविक रूप से वही संबंध व्यक्त करता है।
- source_word: לִפְנֵי ... וְלִפְנֵי
  choice: फ़िरौन और उसके सेवकों के सामने
  rationale: इब्रानी में ‘सामने’ दोहराया गया है। हिन्दी में संयुक्त पद ‘फ़िरौन और उसके सेवकों के सामने’ दोनों समूहों की सार्वजनिक उपस्थिति को बिना अस्वाभाविक पुनरुक्ति के बनाए रखता है।
- source_word: עֲבָדָיו
  choice: उसके सेवकों
  rationale: मूल शब्द सेवक या दास को दर्शा सकता है और राजकीय प्रसंग में अधिकारियों को भी; ‘सेवकों’ मूल की व्यापकता को सुरक्षित रखता है।
- source_word: וַיְהִי לְתַנִּין
  choice: वह एक सर्प बन गई
  rationale: תַנִּין का अर्थ प्रसंगानुसार सर्प, बड़ा सरीसृप या विकराल जलीय जीव हो सकता है। यहाँ लाठी के चिह्न के प्रसंग में ‘सर्प’ उपयुक्त है; व्यापक अर्थ-क्षेत्र पादटिप्पणी में रखा गया है। स्त्रीलिंग ‘गई’ हिन्दी में निकटतम संदर्भ ‘लाठी’ के अनुरूप है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: पद में व्यक्तिगत वाचा-नाम सीधे आया है। ‘यहवे’ उसका लिप्यंतरण करके नाम और उपाधि के भेद को बनाए रखता है।
- issue: תַנִּין का अर्थ
  choice: सर्प
  alternative: बड़ा सरीसृप; विकराल जीव
  rationale: तत्कालीन चिह्न-प्रसंग में ‘सर्प’ सबसे सहज अर्थ है, पर मूल शब्द की व्यापक और कभी-कभी विकराल जीव संबंधी अर्थ-सीमा को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘फ़िरौन’, ‘आज्ञा’ और ‘सर्प’ बाइबलीय कथन की गरिमा बनाए रखते हैं; वाक्य-विन्यास हिन्दी की स्वाभाविक कथा-शैली के अनुसार है।
