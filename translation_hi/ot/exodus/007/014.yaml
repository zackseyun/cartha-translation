  text: Then Yahweh said to Moses[a], “Pharaoh’s heart is heavy; he refuses to let the people go.”
translation:
  language: hi
  text: तब याहवे ने मूसा से कहा, “फ़िरौन का हृदय भारी है[a]; वह लोगों को जाने देने से इनकार करता है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “फ़िरौन का हृदय कठोर है।” इब्रानी विशेषण का शाब्दिक अर्थ “भारी” है; यहाँ यह हठ या अनुत्तरदायित्व का रूपक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने ... कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम का हिन्दी लिप्यंतरण किया गया है, किसी उपाधि से उसका स्थान नहीं लिया गया।
- source_word: מֹשֶׁה
  choice: मूसा
  rationale: व्यक्तिनाम का हिन्दी में प्रचलित बाइबलीय रूप।
- source_word: כָּבֵד
  choice: भारी है
  rationale: मूल विशेषण का ठोस अर्थ ‘भारी’ है। यहाँ यह फ़िरौन की हठी और अनुत्तरदायी मनोदशा का रूपक है; मुख्य पाठ में रूपक को बनाए रखा गया है।
- source_word: לֵב פַּרְעֹה
  choice: फ़िरौन का हृदय
  rationale: इब्रानी संबंधसूचक रचना को स्वाभाविक हिन्दी संबंधकारक में व्यक्त किया गया है। ‘हृदय’ यहाँ आंतरिक इच्छा और मनोवृत्ति को सूचित करता है।
- source_word: מֵאֵן
  choice: इनकार करता है
  rationale: रूप फ़िरौन के जारी रवैये को व्यक्त करता है; हिन्दी का सामान्य वर्तमान काल इस सतत अस्वीकृति को स्वाभाविक ढंग से दर्शाता है।
- source_word: לְשַׁלַּח
  choice: जाने देने से
  rationale: निर्गमन के प्रसंग में क्रिया का आशय लोगों को प्रस्थान करने की अनुमति देना है; यह हिन्दी में प्रसंगानुकूल और स्वाभाविक अभिव्यक्ति है।
- source_word: הָעָם
  choice: लोगों को
  rationale: मूल में केवल ‘लोग’ है; संदर्भ से इस्राएली अभिप्रेत हैं, पर मुख्य पाठ में उसे स्पष्ट रूप से जोड़ना उचित नहीं।
theological_decisions:
- issue: फ़िरौन की दशा और हृदय को कठोर किए जाने के विषय को अनावश्यक रूप से निर्णीत करना
  choice: फ़िरौन का हृदय भारी है
  alternative: फ़िरौन का हृदय कठोर है
  rationale: इस पद में इब्रानी शब्द का मूल अर्थ ‘भारी’ है। इसे बनाए रखने से अलग-अलग कठोरीकरण-वर्णनों की शब्दावली एक ही पारंपरिक अभिव्यक्ति में नहीं समा जाती और मूल का तनाव सुरक्षित रहता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिन्दी। ‘हृदय भारी’ हिन्दी में सामान्यतः दुःख का भाव दे सकता है, इसलिए मूल रूपक को मुख्य पाठ में रखते हुए पादटिप्पणी में प्रसंगगत अर्थ स्पष्ट किया गया है।
