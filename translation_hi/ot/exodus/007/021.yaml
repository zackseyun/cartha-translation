  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘खून था’ मूल पाठ की संक्षिप्त अस्तित्वसूचक अभिव्यक्ति को सुरक्षित रखता है; ‘फैल गया’ या ‘हो गया’ जैसी अतिरिक्त व्याख्या नहीं जोड़ी गई।
