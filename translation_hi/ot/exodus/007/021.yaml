base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/021.yaml
  text: And the fish in the Nile died[a], and the Nile stank, so that the Egyptians could not drink water from the Nile. And there was blood throughout all the land of Egypt.
translation:
  language: hi
  text: नील नदी[a] में जो मछलियाँ थीं, वे मर गईं। नील नदी से दुर्गंध आने लगी, इसलिए मिस्री नील नदी का पानी नहीं पी सके। और पूरे मिस्र देश में खून था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द יְאֹר का शाब्दिक अर्थ ‘नदी’ है, पर निर्गमन की पुस्तक में यह विशेष रूप से नील नदी के लिए प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּגָה
  choice: मछलियाँ
  rationale: इब्रानी में यह सामूहिक संज्ञा है; हिन्दी में बहुवचन ‘मछलियाँ’ नदी की समस्त मछलियों का स्वाभाविक बोध कराता है।
- source_word: יְאֹר
  choice: नील नदी
  rationale: शब्द का सामान्य अर्थ ‘नदी’ है, पर निर्गमन के इस प्रसंग में इसका विशिष्ट संदर्भ नील नदी है।
- source_word: מֵתָה
  choice: मर गईं
  rationale: सरल भूतकाल मूल पाठ की क्रिया और घटनाक्रम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיִּבְאַשׁ
  choice: दुर्गंध आने लगी
  rationale: क्रिया नदी के सड़ने या बदबू देने का भाव रखती है; यह अभिव्यक्ति स्पष्ट, सजीव और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: וְלֹא יָכְלוּ
  choice: नहीं पी सके
  rationale: यह मिस्रियों की असमर्थता को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לִשְׁתּוֹת מַיִם מִן הַיְאֹר
  choice: नील नदी का पानी पी सके
  rationale: मूल पाठ के ‘पीना’, ‘पानी’ और नदी से स्रोत-संबंध—तीनों को स्पष्ट रखता है।
- source_word: וַיְהִי הַדָּם
  choice: खून था
  rationale: मूल की अस्तित्वसूचक रचना को बिना अतिरिक्त परिवर्तन या फैलाव जोड़े सहज हिन्दी में प्रस्तुत करता है।
- source_word: בְּכָל אֶרֶץ מִצְרַיִם
  choice: पूरे मिस्र देश में
  rationale: בְּכָל की व्यापकता और सम्पूर्ण देश में विपत्ति की पहुँच को स्पष्ट रूप से व्यक्त करता है।
