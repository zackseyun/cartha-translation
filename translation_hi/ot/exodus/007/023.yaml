translation:
  language: hi
  text: फ़िरौन मुड़ा और अपने घर में चला गया, और उसने इस बात पर भी ध्यान नहीं दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפֶן
  choice: मुड़ा
  rationale: पנה का सामान्य अर्थ ‘मुड़ना’ या ‘मुड़कर चले जाना’ है। अगले क्रियापद के साथ ‘मुड़ा’ कथानक की गति को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: פַּרְעֹה
  choice: फ़िरौन
  rationale: मिस्र के राजा की उपाधि के लिए प्रचलित मानक हिन्दी रूप।
- source_word: וַיָּבֹא אֶל־בֵּיתוֹ
  choice: अपने महल में चला गया
  rationale: בוא के साथ אֶל भीतर या किसी स्थान की ओर जाने को दर्शाता है। फ़िरौन के संदर्भ में בֵּיתוֹ का स्वाभाविक हिन्दी अर्थ उसका राजकीय निवास, अर्थात ‘महल’, है; ‘में चला गया’ प्रवेश की दिशा बनाए रखता है।
- source_word: וְלֹא שָׁת לִבּוֹ
  choice: उसने ... ध्यान नहीं दिया
  rationale: शाब्दिक रूप ‘उसने अपना हृदय नहीं लगाया’ है, पर यह इब्रानी मुहावरा किसी बात पर गंभीरता से ध्यान देने को व्यक्त करता है। आधुनिक हिन्दी में ‘ध्यान नहीं दिया’ इसका स्पष्ट और स्वाभाविक समतुल्य है।
- source_word: גַּם לָזֹאת
  choice: इस बात पर भी
  rationale: גַּם का ‘भी/यहाँ तक कि’ भाव और לָזֹאת का वर्तमान घटना की ओर संकेत—दोनों इस अभिव्यक्ति में सुरक्षित हैं।
