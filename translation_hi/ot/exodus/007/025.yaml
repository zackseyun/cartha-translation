source:
  edition: WLC
  text: וַ/יִּמָּלֵ֖א שִׁבְעַ֣ת יָמִ֑ים אַחֲרֵ֥י הַכּוֹת יְהוָ֖ה אֶת הַ/יְאֹֽר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/025.yaml
  text: And seven days were fulfilled after Yahweh struck the Nile[a][b].
translation:
  language: hi
  text: याहवे के नील नदी पर प्रहार करने के बाद सात दिन पूरे हुए[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे के नील नदी पर प्रहार करने के बाद सात दिन बीत गए।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “नील”; इसे कभी-कभी अधिक सामान्य रूप में “नदी” भी अनूदित किया जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמָּלֵא
  choice: पूरे हुए
  rationale: निफ़अल क्रिया यहाँ समयावधि के पूर्ण हो जाने को व्यक्त करती है। ‘पूरे हुए’ उसके परिणामात्मक भाव को सुरक्षित रखते हुए स्वाभाविक हिन्दी है।
- source_word: שִׁבְעַת יָמִים
  choice: सात दिन
  rationale: यह सात दिनों की समयावधि बताने वाली सीधी संख्या-संज्ञा रचना है।
- source_word: אַחֲרֵי
  choice: के बाद
  rationale: यह बाद के समय को सूचित करने वाला सामान्य कालवाचक संबंधबोधक है।
- source_word: הַכּוֹת
  choice: प्रहार करने
  rationale: נכה के क्रियार्थक संज्ञा-रूप का अर्थ यहाँ ‘प्रहार करना’ है। ‘के बाद’ के साथ ‘प्रहार करने’ आधुनिक हिन्दी में स्वाभाविक है और विपत्ति के न्याय-संदर्भ के अनुकूल भी है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: הַיְאֹר
  choice: नील नदी
  rationale: निर्गमन के मिस्री संदर्भ में יְאֹר विशेष रूप से नील को सूचित करता है; हिन्दी में स्पष्टता और स्वाभाविकता के लिए ‘नील नदी’ कहा गया है।
theological_decisions:
- issue: ईश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ व्यक्तिगत दिव्य नाम का प्रयोग करता है। ‘याहवे’ उस नाम को उपाधि में बदले बिना प्रस्तुत करता है; ‘प्रभु’ अर्थ-सम्मत पारंपरिक प्रतिस्थापन हो सकता है, पर मूल का नाम-रूप छिपा देता है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘पूरे हुए’ मूल के पूर्णता-सूचक भाव को बनाए रखता है, जबकि पादटिप्पणी में अधिक मुहावरेदार ‘बीत गए’ दिया गया है।
