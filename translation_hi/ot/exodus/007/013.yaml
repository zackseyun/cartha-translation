base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/013.yaml
  text: But Pharaoh's heart was hardened[a], and he did not listen to them, just as Yahweh had spoken.
translation:
  language: hi
  text: परन्तु फ़िरौन का मन कठोर हो गया[a], और उसने उनकी बात नहीं मानी, जैसा यहोवा ने कहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘फ़िरौन का मन दृढ़ हो गया।’ इब्रानी क्रिया का अधिक शाब्दिक अर्थ ‘मज़बूत/दृढ़ होना’ है, जो यहाँ कठोर हो जाने के अर्थ में प्रयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱזַק
  choice: कठोर हो गया
  rationale: क्रिया חזק का मूल भाव ‘दृढ़/मज़बूत होना’ है; इस प्रसंग में यह फ़िरौन के मन के कठोर हो जाने को व्यक्त करती है। यह अकर्मक रूप है, इसलिए यह अनुवाद किसी बाहरी कर्ता को अनावश्यक रूप से निर्दिष्ट नहीं करता।
- source_word: לֵב
  choice: मन
  rationale: इब्रानी मानव-धारणा में לֵב विचार, इच्छा और निर्णय के भीतरी केंद्र को दर्शाता है; आधुनिक हिन्दी में इस प्रसंग में ‘मन’ स्वाभाविक और स्पष्ट है।
- source_word: פַּרְעֹה
  choice: फ़िरौन
  rationale: मिस्र के शासक की उपाधि का हिन्दी में प्रचलित रूप।
- source_word: שָׁמַע אֲלֵהֶם
  choice: उनकी बात नहीं मानी
  rationale: שׁמע के साथ אֶל यहाँ केवल ध्वनि सुनने के बजाय ध्यान देने या मानने का अर्थ देता है।
- source_word: כַּאֲשֶׁר
  choice: ठीक जैसा
  rationale: यह आगे कही बात के साथ सटीक अनुरूपता दर्शाता है।
- source_word: דִּבֶּר
  choice: कहा था
  rationale: हिन्दी में पूर्वकालिक कथन को स्वाभाविक रूप से व्यक्त करता है; ‘कहा’ इस संदर्भ में ‘बोला’ से अधिक सहज है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुरक्षरीय निज नाम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित नाम-रूप द्वारा प्रस्तुत किया गया है।
theological_decisions:
- issue: फ़िरौन के मन के कठोर होने में कर्तृत्व
  choice: ‘मन कठोर हो गया’—स्थिति/परिणाम को व्यक्त करते हुए किसी प्रत्यक्ष कर्ता का नाम नहीं लिया गया।
  alternative: ‘फ़िरौन का मन कठोर किया गया’ अथवा ‘फ़िरौन ने अपना मन कठोर कर लिया।’
  rationale: इब्रानी रूप यहाँ अकर्मक है और स्पष्ट कर्ता नहीं बताता। इसलिए अनुवाद न तो परमेश्वर को इस पद में प्रत्यक्ष कर्ता बनाता है, न फ़िरौन के आत्म-कठोरीकरण को व्याकरण में जोड़ता है; निर्गमन-वृत्तांत का धार्मिक तनाव सुरक्षित रहता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘उनकी बात नहीं मानी’ आज की हिन्दी में ‘उनकी न सुनी’ की अपेक्षा आशय को अधिक स्पष्ट करता है।
