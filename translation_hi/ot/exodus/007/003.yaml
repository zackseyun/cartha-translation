  text: But I will harden Pharaoh’s heart[a], and I will multiply my signs and my wonders in the land of Egypt.
translation:
  language: hi
  text: परन्तु मैं फ़िरौन के हृदय को कठोर करूँगा[a], और मिस्र देश में अपने चिन्ह और चमत्कार बहुत बढ़ाऊँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “फ़िरौन के हृदय को हठी कर दूँगा।” इब्रानी क्रिया कारणवाचक है और उसे कठोर बनाने को सीधे परमेश्वर की कार्रवाई के रूप में प्रस्तुत करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: परन्तु मैं
  rationale: स्पष्ट सर्वनाम और संयोजक प्रसंग में विरोध तथा बल देते हैं; ‘परन्तु मैं’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אַקְשֶׁה
  choice: कठोर करूँगा
  rationale: קשׁה का हिफ़ील रूप प्रत्यक्ष कारणवाचक है—‘कठोर करना’; यह परमेश्वर की सक्रिय भूमिका को कम नहीं करता।
- source_word: לֵב פַּרְעֹה
  choice: फ़िरौन के हृदय को
  rationale: सम्बन्धसूचक इब्रानी पदबंध का स्वाभाविक हिन्दी रूप; ‘हृदय’ आन्तरिक इच्छा और मन का संकेत देता है, पर मुख्य पाठ में मूल रूपक सुरक्षित रखा गया है।
- source_word: וְהִרְבֵּיתִי
  choice: और ... बहुत बढ़ाऊँगा
  rationale: רבה का हिफ़ील रूप संख्या बढ़ाने का भाव देता है; ‘बहुत बढ़ाऊँगा’ वर्तमान प्रसंग में सहज और स्पष्ट है।
- source_word: אֹתֹתַי
  choice: अपने चिन्हों
  rationale: אוֹת के लिए ‘चिन्ह’ मानक और पारदर्शी हिन्दी समतुल्य है।
- source_word: מוֹפְתַי
  choice: अपने ... अद्भुत कामों
  rationale: מוֹפֵת आश्चर्यकारी या विलक्षण कार्य को दर्शाता है; ‘अद्भुत काम’ सामान्य पाठक के लिए स्वाभाविक है और ‘चिन्ह’ से अर्थगत भेद बनाए रखता है।
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: मिस्र देश में
  rationale: मूल में ‘देश/भूमि’ स्पष्ट रूप से है; हिन्दी में ‘मिस्र देश’ संक्षिप्त और स्वाभाविक ढंग से उसे सुरक्षित रखता है।
theological_decisions:
- issue: फ़िरौन के हृदय को कठोर करने में परमेश्वर की भूमिका
  choice: मैं फ़िरौन के हृदय को कठोर करूँगा
  alternative: मैं फ़िरौन के हृदय को कठोर होने दूँगा
  rationale: इब्रानी हिफ़ील परमेश्वर की कार्रवाई को सीधे कारणवाचक रूप में प्रस्तुत करता है। अनुमति-मात्र वाला विकल्प इस कथन को नरम करके उसके धर्मवैचारिक तनाव को समय से पहले सुलझा देता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। ‘हृदय’ का मूल रूपक और प्रत्यक्ष कारणवाचक कथन सुरक्षित रखे गए हैं; ‘अद्भुत काम’ तकनीकी या अप्रचलित विकल्पों की अपेक्षा अधिक सहज है।
