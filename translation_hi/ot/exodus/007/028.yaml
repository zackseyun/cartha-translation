base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/028.yaml
  text: The Nile will swarm with frogs[a], and they will come up and enter your house, your bedroom, and your bed, and the houses of your servants and your people, and your ovens and your kneading bowls.
translation:
  language: hi
  text: नील नदी में मेंढक उमड़ पड़ेंगे[a]। वे ऊपर आकर तेरे घर में, तेरे सोने के कमरे में और तेरे बिस्तर पर, तेरे सेवकों के घरों में, तेरी प्रजा के बीच, तेरे तंदूरों में और आटा गूँधने के पात्रों में प्रवेश कर जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आटा गूँधने के कठौते।”
    reason: מִשְׁאֲרוֹתֶיךָ के लिए एक वैध शब्दार्थ-विकल्प; ये आटा तैयार करने के पात्र या कठौते हो सकते हैं।
lexical_decisions:
- source_word: וְשָׁרַץ
  choice: मेंढक ही मेंढक भर जाएँगे
  rationale: क्रिया שׁרץ छोटे जीवों के बहुतायत से उमड़ने या भर जाने का सजीव भाव देती है। यह हिंदी प्रयोग उस प्रचुरता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַיְאֹר
  choice: नील नदी
  rationale: मिस्र के संदर्भ में יְאֹר विशेष रूप से नील नदी को सूचित करता है।
- source_word: צְפַרְדְּעִים
  choice: मेंढक
  rationale: बहुवचन संज्ञा का सीधा और स्वाभाविक हिंदी रूप।
- source_word: וְעָלוּ
  choice: निकलकर
  rationale: यहाँ עלה नील से ऊपर भूमि की ओर आने को दर्शाता है; 'निकलकर' आगामी प्रवेश के साथ सहज हिंदी क्रम बनाता है।
- source_word: וּבָאוּ
  choice: घुस जाएँगे
  rationale: בוא और इसके बाद आए ב-वाले स्थानसूचक पद अनचाहे प्रवेश को दर्शाते हैं; विपत्ति के संदर्भ में 'घुस जाएँगे' स्वाभाविक और सजीव है।
- source_word: בְּבֵיתֶךָ
  choice: तेरे घर
  rationale: यह भौतिक निवास को दर्शाता है, न कि अमूर्त घराने को।
- source_word: וּבַחֲדַר מִשְׁכָּבְךָ
  choice: तेरे सोने के कमरे
  rationale: शाब्दिक भाव 'तेरे सोने का कमरा' है; यह आधुनिक पाठक के लिए स्पष्ट और मूल संरचना के निकट है।
- source_word: וְעַל מִטָּתֶךָ
  choice: तेरे बिस्तर पर
  rationale: על के 'पर' अर्थ को स्पष्ट रूप से सुरक्षित रखा गया है।
- source_word: וּבְבֵית עֲבָדֶיךָ
  choice: तेरे सेवकों के घरों
  rationale: एकवचन בית बहुवचन संबंधसूचक के साथ वितरणात्मक अर्थ दे सकता है; हिंदी में बहुवचन 'घरों' अपेक्षित अर्थ साफ करता है।
- source_word: וּבְעַמֶּךָ
  choice: तेरी प्रजा
  rationale: फिरौन को संबोधन के संदर्भ में עַם के लिए 'प्रजा' स्वाभाविक है; यहाँ ב का स्थानगत भाव मुख्य क्रिया 'घुस जाएँगे' से व्यक्त होता है।
- source_word: וּבְתַנּוּרֶיךָ
  choice: तेरे तंदूरों
  rationale: תנור घरेलू पकाने की भट्ठी या तंदूर है; 'तंदूर' आधुनिक हिंदी में परिचित और सटीक है।
- source_word: וּבְמִשְׁאֲרוֹתֶיךָ
  choice: आटा गूँधने के पात्रों
  rationale: מִשְׁאֶרֶת आटा तैयार या गूँधने के लिए प्रयुक्त पात्र को दर्शाता है। 'पात्र' आकार को अनावश्यक रूप से कटोरे या कठौते तक सीमित नहीं करता।
