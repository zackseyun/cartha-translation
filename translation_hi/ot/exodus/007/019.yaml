  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה אֱמֹ֣ר אֶֽל אַהֲרֹ֡ן קַ֣ח מַטְּ/ךָ֣ וּ/נְטֵֽה יָדְ/ךָ֩ עַל מֵימֵ֨י מִצְרַ֜יִם עַֽל נַהֲרֹתָ֣/ם עַל יְאֹרֵי/הֶ֣ם וְ/עַל אַגְמֵי/הֶ֗ם וְ/עַ֛ל כָּל מִקְוֵ֥ה מֵימֵי/הֶ֖ם וְ/יִֽהְיוּ דָ֑ם וְ/הָ֤יָה דָם֙ בְּ/כָל אֶ֣רֶץ מִצְרַ֔יִם וּ/בָ/עֵצִ֖ים וּ/בָ/אֲבָנִֽים־־־־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/019.yaml
  text: Then Yahweh said to Moses[a], “Say to Aaron, ‘Take your staff and stretch out your hand over the waters of Egypt—over their rivers, over their Nile canals, over their ponds, and over every collection of their waters—that they may become blood. And there will be blood throughout all the land of Egypt[b], even in wooden and stone vessels.’”
translation:
  language: hi
  text: तब याहवे ने मूसा से कहा, “हारून से कहो, ‘अपनी लाठी लो और मिस्र के जल के ऊपर—मिस्र की नदियों, उसकी नील-नहरों, उसके तालाबों और उसके जल के हर जलाशय के ऊपर—अपना हाथ बढ़ाओ, ताकि वे लहू बन जाएँ। पूरे मिस्र देश में, यहाँ तक कि लकड़ी और पत्थर के बरतनों में भी[a], लहू होगा।’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “लकड़ी में और पत्थर में”; संभवतः आशय लकड़ी और पत्थर के बरतनों से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के व्यक्तिगत नाम के प्रचलित और पहचाने जाने योग्य रूप को रखा गया है; इसे किसी उपाधि से नहीं बदला गया।
- source_word: מַטְּךָ
  choice: अपनी लाठी
  rationale: מַטֶּה के ठोस अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וּנְטֵה יָדְךָ
  choice: अपना हाथ बढ़ाओ
  rationale: मूल इब्रानी मुहावरे और आदेशात्मक क्रिया को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: נַהֲרֹתָם
  choice: उसकी नदियों
  rationale: נָהָר का सामान्य अर्थ नदी या धारा है; यहाँ जल-प्रणाली की व्यापक श्रेणी के रूप में ‘नदियों’ उपयुक्त है।
- source_word: יְאֹרֵיהֶם
  choice: उसकी नील-नहरों
  rationale: मिस्री संदर्भ में יְאֹר नील से संबंधित जलमार्गों को सूचित करता है और इसे पिछले ‘नदियों’ से अलग रखता है।
- source_word: אַגְמֵיהֶם
  choice: उसके तालाबों
  rationale: אגם के तालाब या ठहरे हुए जलाशय के अर्थ को सरल और स्पष्ट रूप में देता है।
- source_word: כָּל מִקְוֵה מֵימֵיהֶם
  choice: उसके जल के हर जलाशय
  rationale: מִקְוֶה एकत्र या संचित जल-समूह को दर्शाता है; ‘जलाशय’ हिन्दी में स्वाभाविक और पर्याप्त व्यापक है।
- source_word: וְיִהְיוּ דָם
  choice: ताकि वह लहू बन जाए
  rationale: आदेश के अभिप्रेत परिणाम को दर्शाता है; ‘जल’ हिन्दी में द्रव्यवाचक एकवचन होने के कारण एकवचन क्रिया स्वाभाविक है।
- source_word: וּבָעֵצִים וּבָאֲבָנִים
  choice: यहाँ तक कि लकड़ी और पत्थर के बरतनों में भी
  rationale: प्रसंग के आधार पर पदार्थों को उनसे बने जल-पात्रों के लिए लक्षणा माना गया है; इब्रानी की शाब्दिक अस्पष्टता पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी पाठकों के बीच प्रचलित लिप्यंतरण रखा गया है।
- issue: וּבָעֵצִים וּבָאֲבָנִים की व्याख्या
  choice: लकड़ी और पत्थर के बरतन
  alternative: लकड़ी में और पत्थर में
  rationale: निकटवर्ती प्रसंग जल के स्रोतों और संचयों का है, इसलिए पदार्थों को उनसे बने पात्रों के लिए लक्षणा समझना प्रसंगानुकूल है; फिर भी मूल की संक्षिप्त और अस्पष्ट अभिव्यक्ति पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण किंतु सामान्य पाठकों के लिए सहज रखी गई है। जल-संबंधी क्रम को स्पष्ट रखने के लिए डैश का प्रयोग किया गया है; इब्रानी की अंतिम लक्षणात्मक अभिव्यक्ति को मुख्य पाठ में अर्थ-स्पष्ट रूप और पादटिप्पणी में शाब्दिक रूप दिया गया है।
