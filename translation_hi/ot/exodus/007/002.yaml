  text: אַתָּ֣ה תְדַבֵּ֔ר אֵ֖ת כָּל אֲשֶׁ֣ר אֲצַוֶּ֑/ךָּ וְ/אַהֲרֹ֤ן אָחִ֨י/ךָ֙ יְדַבֵּ֣ר אֶל פַּרְעֹ֔ה וְ/שִׁלַּ֥ח אֶת בְּנֵֽי יִשְׂרָאֵ֖ל מֵ/אַרְצֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/002.yaml
  text: You shall speak all that I command you[a], and Aaron your brother shall speak to Pharaoh, that he may send the sons of Israel out from his land.
translation:
  language: hi
  text: जो कुछ मैं तुम्हें आज्ञा दूँ, वह सब तुम कहना; और तुम्हारा भाई हारून फ़िरौन से बोलेगा, ताकि वह इस्राएल के पुत्रों[a] को अपने देश से जाने दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस्राएलियों।” हिब्रू में शाब्दिक रूप से “इस्राएल के पुत्रों” है; यहाँ यह पूरे इस्राएली समुदाय के लिए प्रयुक्त वंश-सूचक नाम है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תְדַבֵּר
  choice: कहना
  rationale: इस आदेशात्मक प्रसंग में अपूर्ण क्रिया निर्देश व्यक्त करती है। हिंदी में ‘कहना’ सहज और स्पष्ट है तथा आगे हारून के बोलने के समानांतर है।
- source_word: אֵת כָּל אֲשֶׁר אֲצַוֶּךָּ
  choice: वह सब जिसकी आज्ञा मैं तुम्हें दूँ
  rationale: यह व्यापकता और भावी/निरंतर निर्देश—दोनों को स्वाभाविक हिंदी में रखता है; ‘दूँ’ हिब्रू अपूर्ण क्रिया की कालगत खुली प्रकृति को अनावश्यक रूप से सीमित नहीं करता।
- source_word: אַהֲרֹן אָחִיךָ
  choice: तुम्हारा भाई हारून
  rationale: यह आधुनिक हिंदी में स्वाभाविक संबंध-सूचक क्रम है और हिब्रू के आशय को पूरा रखता है।
- source_word: יְדַבֵּר אֶל־פַּרְעֹה
  choice: फ़िरौन से कहेगा
  rationale: דבר אל का अर्थ यहाँ फ़िरौन को संबोधित करके बोलना है। ‘से कहेगा’ हिंदी में सहज है और कथन की विषयवस्तु को आवश्यकता से अधिक विशिष्ट नहीं करता।
- source_word: וְשִׁלַּח
  choice: ताकि वह … जाने दे
  rationale: यह हारून के फ़िरौन से कहने के अभिप्रेत उद्देश्य को व्यक्त करता है। ‘जाने दे’ लोगों को देश से मुक्त करके विदा करने के प्रसंग में स्वाभाविक है, जबकि परिणाम को निश्चित घोषित नहीं करता।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: यह हिब्रू की शाब्दिक वंश-सूचक अभिव्यक्ति को सुरक्षित रखता है; पादटिप्पणी आधुनिक सामूहिक विकल्प और इसके समावेशी संदर्भ को स्पष्ट करती है।
- source_word: מֵאַרְצוֹ
  choice: अपने देश से
  rationale: यहाँ प्रत्यय का संबंध फ़िरौन से है। हिंदी में ‘अपने देश से’ उसी कर्ता-संबंध को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: וְשִׁלַּח में उद्देश्य और परिणाम का संबंध
  choice: ताकि वह … जाने दे
  alternative: और वह … जाने देगा
  rationale: इस वाक्य-रचना को निश्चित परिणाम मान लेने के बजाय फ़िरौन से कहने का अभिप्रेत उद्देश्य व्यक्त किया गया है; इससे हिब्रू की संभावित अर्थगत खुलावट बनी रहती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘फ़िरौन’ प्रचलित हिंदी बाइबलीय रूप है। ‘इस्राएल के पुत्रों’ से मूल भाषा की अभिव्यक्ति सुरक्षित है, जबकि पादटिप्पणी उसके सामूहिक आशय को स्पष्ट करती है।
