base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/017.yaml
  text: 'Thus says Yahweh: By this you will know that I am Yahweh: behold[a], I am striking the water that is in the Nile with the staff that is in my hand, and it will be turned to blood.'
translation:
  language: hi
  text: 'याहवे यों कहता है: “इससे तू जान लेगा कि मैं याहवे हूँ। देख, मैं अपने हाथ की लाठी से नील नदी के पानी[a] पर प्रहार करने वाला हूँ, और वह लहू में बदल जाएगा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “जलराशियों” और फिर “वे लहू में बदल जाएँगी” जैसे बहुवचन रूप हैं; हिन्दी में द्रव्यवाचक “पानी” के साथ एकवचन अधिक स्वाभाविक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: याहवे यों कहता है
  rationale: इब्रानी संदेशवाहक-सूत्र की औपचारिकता बनाए रखते हुए यह आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: בְּזֹאת תֵּדַע
  choice: इससे तू जान लेगा
  rationale: בְּ का साधनवाचक अर्थ ‘इससे’ द्वारा व्यक्त होता है; अपूर्ण क्रिया यहाँ भावी परिणाम बताती है। एकवचन ‘तू’ फिरौन को सीधे संबोधन को सुरक्षित रखता है।
- source_word: כִּי אֲנִי יְהוָה
  choice: कि मैं याहवे हूँ
  rationale: ईश्वर के व्यक्तिगत नाम और इस प्रसंग की केंद्रीय आत्म-पहचान को स्पष्ट रूप से बनाए रखता है।
- source_word: הִנֵּה
  choice: देख
  rationale: घोषणा की नाटकीय तात्कालिकता को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אָנֹכִי מַכֶּה
  choice: मैं ... प्रहार करने वाला हूँ
  rationale: सर्वनाम के साथ कृदन्त निकट और निश्चित कार्रवाई को सजीव बनाता है; हिन्दी में यह आसन्नता ‘प्रहार करने वाला हूँ’ से स्वाभाविक रूप में आती है।
- source_word: בַּמַּטֶּה אֲשֶׁר בְּיָדִי
  choice: अपने हाथ की लाठी से
  rationale: साधन और हाथ में होने की बात दोनों को संक्षिप्त, स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: עַל הַמַּיִם אֲשֶׁר בַּיְאֹר
  choice: नील नदी के पानी पर
  rationale: יְאֹר यहाँ विशिष्ट रूप से नील नदी है; עַל का ‘पर’ प्रहार की दिशा को बनाए रखता है।
- source_word: וְנֶהֶפְכוּ לְדָם
  choice: और वह लहू में बदल जाएगा
  rationale: इब्रानी के परिणामस्वरूप परिवर्तन को व्यक्त करता है। हिन्दी में ‘पानी’ सामान्यतः एकवचन द्रव्यवाचक संज्ञा है, इसलिए एकवचन क्रिया स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरीय व्यक्तिगत नाम सीधे प्रयुक्त है। ‘याहवे’ उसे किसी उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- issue: ‘मैं याहवे हूँ’ का आशय
  choice: वाक्य को बिना व्याख्यात्मक विस्तार के यथावत रखना
  alternative: मैं ही सच्चा परमेश्वर/सर्वशक्तिमान प्रभु हूँ
  rationale: मूल आत्म-पहचान में निहित धर्मवैज्ञानिक तनाव और व्यापक अर्थ को किसी एक व्याख्या तक सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; सीधा संबोधन एकवचन ‘तू’ मूल इब्रानी की संख्या और फिरौन से प्रत्यक्ष, अधिकारपूर्ण वाणी को दर्शाता है। भाषा गरिमापूर्ण है, पर अनावश्यक रूप से पुरातन नहीं।
