source:
  edition: WLC
  text: לֵ֣ךְ אֶל פַּרְעֹ֞ה בַּ/בֹּ֗קֶר הִנֵּה֙ יֹצֵ֣א הַ/מַּ֔יְמָ/ה וְ/נִצַּבְתָּ֥ לִ/קְרָאת֖/וֹ עַל שְׂפַ֣ת הַ/יְאֹ֑ר וְ/הַ/מַּטֶּ֛ה אֲשֶׁר נֶהְפַּ֥ךְ לְ/נָחָ֖שׁ תִּקַּ֥ח בְּ/יָדֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/015.yaml
  text: Go to Pharaoh in the morning[a]. Look, he is going out to the water, and you shall stand to meet him on the bank of the Nile[b], and you shall take in your hand the staff that was turned into a serpent.
translation:
  language: hi
  text: सुबह फ़िरौन के पास जा। देख, वह पानी की ओर निकल रहा है। तू नील नदी के तट पर उससे मिलने के लिए खड़ा रहना, और जो लाठी साँप बन गई थी उसे अपने हाथ में लेना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵךְ אֶל־פַּרְעֹה
  choice: फ़िरौन के पास जा
  rationale: प्रत्यक्ष एकवचन आज्ञा को स्वाभाविक और संक्षिप्त हिन्दी में रखा गया है।
- source_word: בַּבֹּקֶר
  choice: सुबह
  rationale: कालवाचक पद का सहज आधुनिक हिन्दी रूप।
- source_word: הִנֵּה
  choice: देख
  rationale: आगे की परिस्थिति की ओर ध्यान खींचने वाला प्रत्यक्ष संबोधन है; यह ‘देखो’ की अपेक्षा एकवचन आज्ञा से मेल खाता है।
- source_word: יֹצֵא הַמַּיְמָה
  choice: वह पानी की ओर निकल रहा होगा
  rationale: कृदन्त निकट भविष्य में अपेक्षित गतिविधि बताता है और दिशासूचक रूप पानी की ओर गति दर्शाता है। ‘होगा’ मूसा के वहाँ पहुँचने पर मिलने वाली परिस्थिति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְנִצַּבְתָּ לִקְרָאתוֹ
  choice: तू ... उससे मिलने के लिए खड़ा रहना
  rationale: निफ़अल रूप अपने को किसी स्थान पर स्थित करने का भाव देता है; ‘खड़ा रहना’ निर्देश की निरंतरता और स्थान ग्रहण करने का अर्थ सहज रूप में व्यक्त करता है।
- source_word: עַל־שְׂפַת הַיְאֹר
  choice: नील नदी के तट पर
  rationale: निर्गमन के मिस्री संदर्भ में יְאֹר विशेषतः नील को सूचित करता है और שָׂפָה यहाँ नदी का तट है।
- source_word: הַמַּטֶּה
  choice: लाठी
  rationale: मूसा द्वारा हाथ में ली जाने वाली वस्तु के लिए ‘लाठी’ वर्तमान हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: אֲשֶׁר נֶהְפַּךְ לְנָחָשׁ
  choice: जो लाठी साँप बन गई थी
  rationale: נֶהְפַּךְ का प्रसंगानुकूल अर्थ ‘बन गई/बदल गई’ है और נָחָשׁ के लिए साधारण आधुनिक हिन्दी ‘साँप’ उपयुक्त है।
- source_word: תִּקַּח בְּיָדֶךָ
  choice: उसे अपने हाथ में लेना
  rationale: आज्ञार्थक क्रम को हिन्दी के ‘लेना’ वाले निर्देश से व्यक्त किया गया है और मूल का ठोस ‘अपने हाथ में’ सुरक्षित रखा गया है।
theological_decisions:
- issue: יְאֹר का विशिष्ट संदर्भ
  choice: नील नदी
  alternative: नदी
  rationale: निर्गमन में यह शब्द मिस्र की नील नदी को निर्दिष्ट करता है; विशिष्ट नाम कथा के ऐतिहासिक-भौगोलिक संदर्भ को स्पष्ट रखता है।
- issue: נָחָשׁ का हिन्दी रूप
  choice: साँप
  alternative: सर्प
  rationale: दोनों अर्थतः संभव हैं, पर ‘साँप’ सामान्य आधुनिक पाठक के लिए अधिक स्वाभाविक है और मूल में किसी विशेष धार्मिक या पौराणिक अर्थ को अनावश्यक रूप से नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी, प्रत्यक्ष एकवचन संबोधन ‘तू’ के साथ, क्योंकि परमेश्वर मूसा को एकवचन में आदेश दे रहे हैं। भाषा गरिमापूर्ण किंतु सहज रखी गई है; ‘फ़िरौन’, ‘नील नदी’, ‘तट’, ‘लाठी’ और ‘साँप’ सामान्य पाठक के लिए स्पष्ट हैं।
