base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/006.yaml
  text: So Moses and Aaron did just as Yahweh had commanded them[a]; so they did.
translation:
  language: hi
  text: मूसा और हारून ने ठीक वैसा ही किया जैसा याहवे[a] ने उन्हें आज्ञा दी थी; उन्होंने वैसा ही किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'हिब्रू: ‘יהוה’ (YHWH); परंपरागत रूप से ‘प्रभु’ अनुवाद किया जाता है।'
    reason: ईश्वरीय नाम के मूल हिब्रू रूप और पारंपरिक अनुवाद को स्पष्ट करने के लिए।
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: किया
  rationale: עשה का अर्थ व्यापक रूप से ‘करना/बनाना’ है; आज्ञापालन के इस संदर्भ में ‘किया’ स्वाभाविक है और पद के अंत में क्रिया की पुनरावृत्ति को बनाए रखता है।
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: मूसा और हारून
  rationale: इन दोनों व्यक्तिनामों के प्रचलित मानक हिन्दी रूप।
- source_word: כַּאֲשֶׁר
  choice: ठीक वैसा ही ... जैसा
  rationale: यह आज्ञा और कार्य के बीच पूर्ण अनुरूपता प्रकट करता है तथा हिन्दी में स्वाभाविक तुलना बनाता है।
- source_word: צִוָּה
  choice: आज्ञा दी थी
  rationale: צוה अधिकारपूर्वक आदेश देने को सूचित करता है; पूर्ण भूतकाल हिन्दी कथा में आज्ञा के पहले दिए जाने को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबलीय प्रयोग में परमेश्वर के व्यक्तिगत नाम YHWH का प्रचलित लिप्यंतरण; इसे केवल उपाधि से प्रतिस्थापित नहीं किया गया है।
- source_word: אֹתָם
  choice: उन्हें
  rationale: पुल्लिंग बहुवचन प्रत्यय मूसा और हारून को संदर्भित करता है; हिन्दी में ‘आज्ञा देना’ के साथ ‘उन्हें’ स्वाभाविक है।
- source_word: כֵּן עָשׂוּ
  choice: उन्होंने वैसा ही किया
  rationale: यह आरंभिक ‘किया’ को दोहराकर इस बात पर बल देता है कि उनका कार्य आज्ञा के अनुरूप था; मूल की पुनरुक्ति सुरक्षित रखी गई है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में चार-अक्षरीय व्यक्तिगत नाम सीधे आया है। ‘यहोवा’ आधुनिक हिन्दी के व्यापक बाइबलीय प्रयोग में पहचाना जाने वाला रूप है; पादटिप्पणी मूल हिब्रू रूप और पारंपरिक उपाधि दोनों स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘ठीक वैसा ही ... जैसा’ और अंतिम ‘उन्होंने वैसा ही किया’ मूल हिब्रू के जोर तथा जानबूझकर की गई पुनरावृत्ति को सुरक्षित रखते हैं।
