  text: וַ/תַּ֥עַן לָ/הֶ֖ם מִרְיָ֑ם שִׁ֤ירוּ לַֽ/יהוָה֙ כִּֽי גָאֹ֣ה גָּאָ֔ה ס֥וּס וְ/רֹכְב֖/וֹ רָמָ֥ה בַ/יָּֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/021.yaml
  text: 'And Miriam answered them: “Sing to Yahweh[a], for he has triumphed gloriously[b]; horse and its rider he has thrown into the sea.”'
translation:
  language: hi
  text: 'और मरियम ने उन्हें उत्तर दिया[a]: “याहवेह के लिए गाओ, क्योंकि उसने बड़े प्रताप से विजय पाई है[b]; घोड़े और उसके सवार को उसने समुद्र में फेंक दिया है।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मरियम ने उन्हें उत्तर में गाया।” गीत के इस प्रसंग में ‘उत्तर दिया’ का अर्थ बारी-बारी से या प्रत्युत्तर में गाना भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में बल देकर कहा गया है, “वह बहुत ऊँचा हुआ है” या “उसने अपने को बहुत ऊँचा किया है”; विजय-गीत के प्रसंग में यह उसके प्रतापपूर्ण विजय पाने का भाव देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַן
  choice: उत्तर दिया
  rationale: मूल क्रिया का सामान्य अर्थ ‘उत्तर देना’ है। गीत के प्रसंग में इसमें उत्तर-गान का भाव हो सकता है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: לָהֶם
  choice: उन्हें
  rationale: इब्रानी में पुल्लिंग बहुवचन सर्वनाम है; ‘उन्हें’ उसके लिंग या समूह की संरचना को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: מִרְיָם
  choice: मरियम
  rationale: व्यक्तिनाम का प्रचलित हिन्दी रूप।
- source_word: שִׁירוּ
  choice: गाओ
  rationale: बहुवचन आज्ञार्थक क्रिया का सीधा और स्वाभाविक हिन्दी अनुवाद।
- source_word: לַיהוָה
  choice: याहवेह के लिए
  rationale: वाचा-संबंधी व्यक्तिगत नाम יהוה को हिन्दी में ‘याहवेह’ रूप में रखा गया है; לְ को यहाँ गीत के उद्देश्य/प्राप्तकर्ता के रूप में ‘के लिए’ कहा गया है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह गाने की आज्ञा का कारण प्रस्तुत करता है।
- source_word: גָאֹה גָּאָה
  choice: बड़े प्रताप से विजय पाई है
  rationale: धातु की पुनरुक्त तीव्रता और विजय-गीत के प्रसंग—दोनों को व्यक्त करता है, जबकि अधिक शाब्दिक ‘बहुत ऊँचा हुआ है’ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: סוּס וְרֹכְבוֹ
  choice: घोड़े और उसके सवार को
  rationale: एकवचन यहाँ जातिवाचक/समष्टिगत है और प्रत्यय घोड़े से जुड़े उसके सवार को सूचित करता है।
- source_word: רָמָה
  choice: फेंक दिया है
  rationale: फेंकने या डालने की क्रिया का सीधा अर्थ; पूर्ण हुई विजय को वर्तमान पूर्ण भाव में व्यक्त किया गया है।
- source_word: בַיָּם
  choice: समुद्र में
  rationale: בְ का सीधा अर्थ ‘में’ है; ‘फेंक दिया’ के साथ हिन्दी में गंतव्य का भाव स्वाभाविक रूप से समझ आता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवेह
  alternative: यहोवा; प्रभु
  rationale: पद में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। ‘याहवेह’ उसे उपाधि से बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: גָאֹה גָּאָה में विजय और आत्म-उन्नयन का संबंध
  choice: बड़े प्रताप से विजय पाई है
  alternative: वह अत्यन्त ऊँचा हुआ है
  rationale: समुद्र-विजय के गीत में यह पदबंध याहवेह की प्रकट महिमा और विजय को बताता है। मुख्य पाठ प्रसंगगत अर्थ देता है, जबकि शाब्दिक उन्नयन-भाव पादटिप्पणी में रखा गया है ताकि निहित धार्मिक तनाव मिटे नहीं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। काव्यात्मक बल बनाए रखने के लिए वाक्यक्रम में अंतिम खंड ‘घोड़े और उसके सवार को उसने…’ रखा गया है।
