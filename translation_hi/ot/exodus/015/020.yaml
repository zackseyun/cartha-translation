  text: וַ/תִּקַּח֩ מִרְיָ֨ם הַ/נְּבִיאָ֜ה אֲח֧וֹת אַהֲרֹ֛ן אֶת הַ/תֹּ֖ף בְּ/יָדָ֑/הּ וַ/תֵּצֶ֤אןָ כָֽל הַ/נָּשִׁים֙ אַחֲרֶ֔י/הָ בְּ/תֻפִּ֖ים וּ/בִ/מְחֹלֹֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/020.yaml
  text: Then Miriam the prophetess[a], Aaron’s sister, took the tambourine in her hand, and all the women went out after her with tambourines and dancing.
translation:
  language: hi
  text: तब हारून की बहन मिरयम नबिया ने अपने हाथ में डफली ली, और सभी स्त्रियाँ डफलियों के साथ और नृत्य करते हुए उसके पीछे निकल गईं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּקַּח
  choice: तब ... ने ... ली
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִרְיָם
  choice: मिरयम
  rationale: इब्रानी उच्चारण के निकट और हिन्दी देवनागरी में सहज लिप्यंतरण।
- source_word: הַנְּבִיאָה
  choice: नबिया
  rationale: इब्रानी संज्ञा स्पष्ट रूप से स्त्रीलिंग है। ‘नबिया’ इसका संक्षिप्त, प्रचलित और अर्थगत रूप से उपयुक्त हिन्दी प्रतिरूप है।
- source_word: אֲחוֹת אַהֲרֹן
  choice: हारून की बहन
  rationale: मूल पाठ मिरयम को विशेष रूप से हारून की बहन कहता है; उसी पहचान को बिना विस्तार के बनाए रखा गया है।
- source_word: הַתֹּף
  choice: डफली
  rationale: תֹף हाथ में पकड़ा जाने वाला चौखटे वाला ताल-वाद्य था; ‘डफली’ आधुनिक हिन्दी पाठक के लिए स्पष्ट और स्वाभाविक निकटतम शब्द है।
- source_word: בְּיָדָהּ
  choice: अपने हाथ में
  rationale: सम्बन्धसूचक प्रत्यय को हिन्दी के स्वाभाविक आत्मवाचक प्रयोग द्वारा व्यक्त किया गया है।
- source_word: וַתֵּצֶאןָ
  choice: निकल आईं
  rationale: יצא का अर्थ ‘निकलना’ है; स्त्रियों के मिरयम के पीछे आने के प्रसंग में ‘निकल आईं’ हिन्दी में कथात्मक दृष्टिकोण को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כָל הַנָּשִׁים
  choice: सभी स्त्रियाँ
  rationale: परिमाण और मूल के स्पष्ट स्त्रीलिंग समूह, दोनों को सीधे बनाए रखा गया है।
- source_word: אַחֲרֶיהָ
  choice: उसके पीछे
  rationale: जुलूस या सामूहिक अनुसरण के अर्थ में स्वाभाविक हिन्दी अभिव्यक्ति।
- source_word: בְּתֻפִּים
  choice: हाथों में डफलियाँ लिए
  rationale: करणसूचक בְּ और बहुवचन वाद्यों को हिन्दी में स्वाभाविक दृश्यात्मक ढंग से व्यक्त किया गया है; वादन को स्पष्ट रूप से जोड़कर मूल से आगे नहीं बढ़ा गया।
- source_word: וּבִמְחֹלֹת
  choice: और नाचती हुई
  rationale: מְחֹלוֹת उत्सवी नृत्य या नाचने की क्रिया को दर्शाता है। क्रियात्मक हिन्दी रूप प्रसंग में सहज है, जबकि संज्ञा के बहुवचन की सम्भावना पादटिप्पणी में सुरक्षित रखी गई है।
