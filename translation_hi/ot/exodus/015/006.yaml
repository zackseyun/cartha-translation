source:
  edition: WLC
  text: יְמִֽינְ/ךָ֣ יְהוָ֔ה נֶאְדָּרִ֖י בַּ/כֹּ֑חַ יְמִֽינְ/ךָ֥ יְהוָ֖ה תִּרְעַ֥ץ אוֹיֵֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/006.yaml
  text: Your right hand[a], O Yahweh, is majestic in power; your right hand, O Yahweh[c][b], shatters the enemy.
translation:
  language: hi
  text: 'हे यहोवा, तेरा दाहिना हाथ शक्ति में प्रतापी है;

    हे यहोवा, तेरा दाहिना हाथ शत्रु को चकनाचूर कर देता है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְמִינְךָ
  choice: तेरा दाहिना हाथ
  rationale: मूल के ठोस शारीरिक बिंब को बनाए रखता है; गीत के संदर्भ में यह परमेश्वर की सामर्थ्य और विजयी कार्य का भी संकेत देता है।
- source_word: יְהוָה
  choice: हे यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित बाइबलीय लिप्यंतरण से व्यक्त किया गया है; सम्बोधन की काव्यात्मक भूमिका के लिए ‘हे’ रखा गया है।
- source_word: נֶאְדָּרִי
  choice: प्रतापी है
  rationale: यह रूप महिमा, वैभव और प्रभावशाली महानता का भाव रखता है। ‘प्रतापी’ आधुनिक, गरिमामय हिन्दी में युद्ध-विजय के प्रसंग के अनुकूल है।
- source_word: בַּכֹּחַ
  choice: शक्ति में
  rationale: בְּ उपसर्ग और כֹּחַ के अर्थ को निकटता से रखते हुए शक्ति के क्षेत्र या गुण में प्रतापी होने का भाव व्यक्त करता है।
- source_word: תִּרְעַץ
  choice: चकनाचूर कर देता है
  rationale: रौंदने या केवल हराने के बजाय मूल क्रिया की कुचलने, तोड़ डालने और निर्णायक विनाश की तीव्रता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אוֹיֵב
  choice: शत्रु
  rationale: मूल का एकवचन सुरक्षित है और सन्दर्भ में विरोधी शक्ति के सामूहिक प्रतिनिधित्व की सम्भावना भी खुली रहती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल में उपाधि नहीं बल्कि ईश्वरीय व्यक्तिगत नाम है। ‘यहोवा’ हिन्दी बाइबल-पाठकों में स्थापित लिप्यंतरण है और नाम को उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं करता।
- issue: ‘दाहिने हाथ’ का अभिप्राय
  choice: ठोस बिंब को यथावत रखना
  alternative: तेरी सामर्थ्य
  rationale: पद में हाथ का काव्यात्मक मानवीकरण परमेश्वर की सामर्थ्य और क्रिया का संकेत है, पर उसे केवल अमूर्त ‘सामर्थ्य’ बनाना मूल बिंब और उसकी पुनरावृत्ति मिटा देता।
- issue: אוֹיֵב का वचन और सन्दर्भ
  choice: शत्रु
  alternative: शत्रुओं को
  rationale: मूल व्याकरणतः एकवचन है और वह किसी विशिष्ट अथवा सामूहिक शत्रु का संकेत दे सकता है; हिन्दी एकवचन इस अर्थगत खुलापन को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में काव्यात्मक और गरिमामय रखी गई है। दोनों अर्धपंक्तियों में ‘हे यहोवा, तेरा दाहिना हाथ’ की पुनरावृत्ति मूल विजय-गीत की समानांतर संरचना और बलाघात को सुरक्षित रखती है।
