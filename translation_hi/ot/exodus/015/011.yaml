source:
  edition: WLC
  text: מִֽי כָמֹ֤/כָה בָּֽ/אֵלִם֙ יְהוָ֔ה מִ֥י כָּמֹ֖/כָה נֶאְדָּ֣ר בַּ/קֹּ֑דֶשׁ נוֹרָ֥א תְהִלֹּ֖ת עֹ֥שֵׂה פֶֽלֶא־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/011.yaml
  text: Who is like you among the gods, O LORD? Who is like you, majestic in holiness, feared in praises, doing wonders?
translation:
  language: hi
  text: 'हे यहोवा, देवताओं में तेरे समान कौन है?


    तेरे समान कौन है—


    पवित्रता में प्रतापी,


    स्तुतियों में भयप्रद[a],


    और अद्भुत काम करने वाला?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “स्तुतियों में विस्मयकारी।”
    reason: נוֹרָא में भय उत्पन्न करने और विस्मयकारी होने, दोनों के भाव हो सकते हैं; इस संक्षिप्त काव्यात्मक पदबंध का सटीक संबंध भी विवादित है।
lexical_decisions:
- source_word: אֵלִם
  choice: देवताओं
  rationale: बहुवचन का सीधा अर्थ रखा गया है। यह कथन यहोवा की अतुलनीयता की घोषणा करता है; अनुवाद में पद की प्राचीन काव्यात्मक भाषा को किसी एक धर्मवैज्ञानिक व्याख्या तक सीमित नहीं किया गया।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए विशिष्ट ईश्वरीय नाम (टेट्राग्रामाटन) को हिन्दी में प्रचलित नामरूप से व्यक्त किया गया है।
- source_word: נֶאְדָּר בַּקֹּדֶשׁ
  choice: पवित्रता में प्रतापी
  rationale: נֶאְדָּר के वैभव, महिमा और प्रताप के भाव तथा בַקֹּדֶשׁ के पवित्रता-संबंधी अर्थ को संक्षिप्त काव्यात्मक रूप में रखा गया है।
- source_word: נוֹרָא תְהִלֹּת
  choice: स्तुतियों में भययोग्य
  rationale: נוֹרָא में भय और विस्मय दोनों का भाव हो सकता है। मुख्य पाठ में उसके प्रबल 'भययोग्य' अर्थ को रखा गया और वैकल्पिक भाव को पादटिप्पणी में बताया गया है।
- source_word: עֹשֵׂה פֶלֶא
  choice: अद्भुत काम करनेवाला
  rationale: हिब्रू एकवचन פֶלֶא यहाँ आश्चर्यजनक कार्य के गुणात्मक भाव को व्यक्त करता है; हिन्दी में स्वाभाविक सामान्य कथन के रूप में अनूदित किया गया है।
theological_decisions:
- issue: אֵלִם का आशय
  choice: देवताओं
  alternative: शक्तिशाली प्राणियों
  rationale: शब्द का सामान्य और संदर्भानुकूल अर्थ 'देवताओं' है। इससे पद में निहित तुलना सुरक्षित रहती है, पर यह अनुवाद उन देवताओं की सत्ता या स्वरूप के विषय में मूल से आगे कोई निष्कर्ष नहीं जोड़ता।
- issue: נוֹרָא में भय और विस्मय का संबंध
  choice: भययोग्य
  alternative: विस्मयकारी
  rationale: मूल शब्द का भय उत्पन्न करने वाला पक्ष स्पष्ट रखा गया है, जबकि उसकी विस्मय-सूचक छाया को पादटिप्पणी में सुरक्षित किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक विन्यास अपनाया गया है। समानांतर प्रश्नात्मक संरचना और निर्गमन-गीत की स्तुतिपरक लय बनाए रखने के लिए पंक्तियाँ विभाजित की गई हैं।
