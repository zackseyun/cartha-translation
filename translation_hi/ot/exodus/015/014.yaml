lexical_decisions:
- source_word: שָׁמְעוּ
  choice: सुना
  rationale: शמע के क़ाल पूर्ण रूप का सीधा अर्थ ‘सुना’ है; गीत के काव्यात्मक घटनाक्रम में सामान्य भूतकाल स्वाभाविक है।
- source_word: עַמִּים
  choice: देश-देश के लोग
  rationale: बहुवचन עמים आसपास के विभिन्न जनसमूहों को सूचित करता है। यह अभिव्यक्ति हिन्दी में बहुवचन और काव्यात्मक व्यापकता दोनों को स्वाभाविक रूप से रखती है।
- source_word: יִרְגָּזוּ/ן
  choice: वे थरथरा उठे
  rationale: רגז भय से काँपने, थरथराने या व्याकुल होने का भाव देता है। ‘थरथरा उठे’ भयजनित शारीरिक प्रतिक्रिया और क्रिया की तीव्रता व्यक्त करता है।
- source_word: חִיל
  choice: पीड़ा
  rationale: חיל मरोड़, कंपकंपी अथवा प्रसव-जैसी वेदना का संकेत दे सकता है। ‘पीड़ा’ शारीरिक और भावनात्मक कष्ट को व्यक्त करती है, बिना प्रसव की छवि को अनावश्यक रूप से निश्चित किए।
- source_word: אָחַז
  choice: आ दबोचा
  rationale: אחז का अर्थ पकड़ लेना या जकड़ लेना है। ‘आ दबोचा’ अचानक और प्रबल रूप से काबू में कर लेने का सजीव भाव रखता है।
- source_word: יֹשְׁבֵי
  choice: निवासियों
  rationale: ישׁב का संज्ञार्थक कृदंत किसी स्थान में रहने वालों को दर्शाता है; ‘निवासियों’ आधुनिक मानक हिन्दी में स्वाभाविक है।
- source_word: פְּלָשֶׁת
  choice: पलिश्त
  rationale: यह पलिश्तियों के भूभाग का व्यक्तिवाचक स्थान-नाम है; ‘पलिश्त’ उसका प्रचलित हिन्दी बाइबलीय रूप है और लोगों के बजाय क्षेत्र को सूचित करता है।
