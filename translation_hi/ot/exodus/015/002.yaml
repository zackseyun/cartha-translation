  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: עָזִּ֤/י וְ/זִמְרָת֙ יָ֔הּ וַֽ/יְהִי לִ֖/י לִֽ/ישׁוּעָ֑ה זֶ֤ה אֵלִ/י֙ וְ/אַנְוֵ֔/הוּ אֱלֹהֵ֥י אָבִ֖/י וַ/אֲרֹמְמֶֽ/נְהוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/002.yaml
  text: Yah is my strength and song[a], and he has become my salvation. This is my God, and I will praise him; my father's God, and I will exalt him.
translation:
  language: hi
  text: याह मेरा बल और मेरा गीत है; वही मेरा उद्धार बन गया है। यही मेरा परमेश्वर है, और मैं उसकी स्तुति करूँगा[a]; वह मेरे पिता का परमेश्वर है, और मैं उसे ऊँचा उठाऊँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं उसके लिए निवास-स्थान तैयार करूँगा।” यहाँ प्रयुक्त इब्रानी क्रिया का अर्थ कठिन है; इसमें उसे सुशोभित या महिमामंडित करने का भाव भी हो सकता है।
    reason: वैकल्पिक पाठार्थ
lexical_decisions:
- source_word: עָזִּי
  choice: मेरा बल
  rationale: עֹז का अर्थ बल या सामर्थ्य है। ‘मेरा बल’ काव्यात्मक पंक्ति में संक्षिप्त, स्वाभाविक और अर्थनिष्ठ है।
- source_word: וְזִמְרָת יָהּ
  choice: और मेरा गीत है; याह
  rationale: זִמְרָה गीत अथवा संगीतमय स्तुति को दर्शाता है। पदबंध को ‘याह मेरा बल और मेरा गीत है’ के रूप में रखने से इब्रानी कविता की संरचना और विजय-गीत का भाव सुरक्षित रहता है।
- source_word: יָהּ
  choice: याह
  rationale: यह יהוה का संक्षिप्त नामरूप है। इसे सामान्यीकृत करके ‘यहोवा’ या ‘प्रभु’ करने के बजाय ‘याह’ रखने से स्रोत-पाठ का विशिष्ट रूप और काव्यात्मक प्रभाव बना रहता है।
- source_word: וַיְהִי לִי לִישׁוּעָה
  choice: वही मेरा उद्धार बन गया है
  rationale: היה + ל की इब्रानी रचना किसी के लिए कुछ बन जाने या सिद्ध होने का भाव देती है। ‘बन गया है’ परिणामसूचक अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; ‘वही’ कर्ता को स्पष्ट करता है।
- source_word: זֶה אֵלִי
  choice: यही मेरा परमेश्वर है
  rationale: निर्देशक זֶה की बलयुक्त पहचान को ‘यही’ स्वाभाविक हिन्दी में स्पष्ट रूप से व्यक्त करता है।
- source_word: וְאַנְוֵהוּ
  choice: और मैं उसकी स्तुति करूँगा
  rationale: यह क्रिया कठिन और अर्थ-विवादित है। निकटवर्ती ‘मैं उसे ऊँचा उठाऊँगा’ के काव्यात्मक समानांतर और आराधना के प्रसंग में ‘स्तुति करूँगा’ उपयुक्त है; निवास तैयार करने वाला सम्भव अर्थ पादटिप्पणी में रखा गया है।
- source_word: אֱלֹהֵי אָבִי
  choice: मेरे पिता का परमेश्वर
  rationale: एकवचन संबंधवाचक पदबंध का यह सीधा और स्वाभाविक हिन्दी रूप है, जो पैतृक विश्वास-संबंध को सुरक्षित रखता है।
- source_word: וַאֲרֹמְמֶנְהוּ
  choice: और मैं उसे ऊँचा उठाऊँगा
  rationale: רומם का मूल रूपक ऊँचा उठाने और इस प्रकार महिमा करने का है। यह अनुवाद उस रूपक को बनाए रखते हुए आराधनात्मक भाव व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יָהּ का अनुवाद
  choice: याह
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में चतुरक्षरी नाम יהוה नहीं, बल्कि उसका संक्षिप्त रूप יָהּ है। इसलिए स्रोत की विशिष्टता और काव्यात्मक तनाव को सुरक्षित रखने के लिए ‘याह’ रखा गया है।
- issue: וְאַנְוֵהוּ की व्याख्या
  choice: मैं उसकी स्तुति करूँगा
  alternative: मैं उसके लिए निवास-स्थान तैयार करूँगा
  rationale: क्रिया का अर्थ निश्चित नहीं है। मुख्य पाठ में काव्यात्मक समानांतर और आराधना-संदर्भ के अनुकूल अर्थ चुना गया है, पर निवास तैयार करने की सम्भावना पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सरल किंतु गरिमापूर्ण और गीतात्मक रखी गई है। ‘याह’ स्रोत के संक्षिप्त ईश्वरीय नाम को सुरक्षित रखता है। कठिन क्रिया पर पादटिप्पणी-चिह्न उसी वाक्यांश के बाद लगाया गया है जिससे वह संबंधित है।
