  text: וַ/יָּבֹ֣אוּ אֵילִ֔מָ/ה וְ/שָׁ֗ם שְׁתֵּ֥ים עֶשְׂרֵ֛ה עֵינֹ֥ת מַ֖יִם וְ/שִׁבְעִ֣ים תְּמָרִ֑ים וַ/יַּחֲנוּ שָׁ֖ם עַל הַ/מָּֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/027.yaml
  text: Then they came to Elim[a], where there were twelve springs of water and seventy palm trees[c][b], and they camped there by the water.
translation:
  language: hi
  text: फिर वे एलीम पहुँचे। वहाँ पानी के बारह सोते और खजूर के सत्तर पेड़ थे। उन्होंने वहीं पानी के पास डेरा डाला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: फिर वे पहुँचे
  rationale: वाव-परिणामी कथानक की अगली घटना बताता है; ‘फिर’ आधुनिक हिन्दी में घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֵילִמָה
  choice: एलीम
  rationale: स्थान-नाम का लिप्यंतरण किया गया है; दिशासूचक ה का भाव ‘पहुँचे’ से स्पष्ट है।
- source_word: שָׁם
  choice: वहाँ
  rationale: मूल के स्थानवाचक क्रियाविशेषण का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: עֵינֹת מַיִם
  choice: पानी के बारह सोते
  rationale: עַיִן यहाँ जलस्रोत अथवा सोते को दर्शाता है; ‘सोते’ मरुस्थलीय पड़ाव के संदर्भ में सटीक और सहज है।
- source_word: וְשִׁבְעִים תְּמָרִים
  choice: खजूर के सत्तर पेड़
  rationale: תְּמָרִים खजूर के पेड़ों को सूचित करता है; हिन्दी में ‘खजूर के पेड़’ सामान्य पाठक के लिए स्पष्ट और स्वाभाविक है।
- source_word: וַיַּחֲנוּ
  choice: उन्होंने ... डेरा डाला
  rationale: חנה के लिए ‘डेरा डालना’ आधुनिक हिन्दी का सहज और अर्थ-सटीक प्रयोग है।
- source_word: עַל הַמָּיִם
  choice: पानी के पास
  rationale: עַל यहाँ ऊपर होने के बजाय निकटता बताता है; מַיִם का बहुवचन-रूप प्रायः सामूहिक अर्थ रखता है, जिसे हिन्दी में एकवचन ‘पानी’ स्वाभाविक रूप से व्यक्त करता है।
theological_decisions: []
