  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। छोटे वाक्यों द्वारा स्थल, संसाधनों और पड़ाव के क्रम को स्पष्ट किया गया है; किसी सांप्रदायिक व्याख्या को नहीं जोड़ा गया।
