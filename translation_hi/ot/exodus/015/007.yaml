reference: Exodus 15:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/בְ/רֹ֥ב גְּאוֹנְ/ךָ֖ תַּהֲרֹ֣ס קָמֶ֑י/ךָ תְּשַׁלַּח֙ חֲרֹ֣נְ/ךָ֔ יֹאכְלֵ֖/מוֹ כַּ/קַּֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/007.yaml
  text: And in the greatness of your majesty you overthrow those who rise up against you[a]; you send out your burning anger[b]; it consumes them like stubble.
translation:
  language: hi
  text: और अपने अपार प्रताप से[a] तू अपने विरुद्ध उठने वालों को नष्ट कर देता है; तू अपना धधकता क्रोध भेजता है[b], और वह उन्हें सूखी पराली की तरह भस्म कर देता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने प्रताप की महानता में।” इब्रानी पूर्वसर्ग का अर्थ यहाँ “में” या “से” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “अपना कोप भेजता है।” इब्रानी में शाब्दिक भाव जलते या धधकते क्रोध का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְרֹב גְּאוֹנְךָ
  choice: और अपने अपार प्रताप से
  rationale: בְּ साधन या अवस्था/क्षेत्र का बोध करा सकता है और רֹב अत्यधिक परिमाण का। ‘अपार प्रताप से’ आधुनिक हिन्दी में स्वाभाविक रहते हुए परमेश्वर की अत्यन्त महान महिमा और उसकी प्रभावी सामर्थ्य दोनों को व्यक्त करता है; वैकल्पिक संरचना पादटिप्पणी में रखी गई है।
- source_word: תַּהֲרֹס
  choice: ढा देता है
  rationale: הרס का मूल अर्थ गिराना, ढा देना या ध्वस्त करना है। यहाँ व्यक्ति-वाचक कर्म के साथ ‘ढा देता है’ युद्ध-काव्य के बल को बनाए रखता है।
- source_word: קָמֶיךָ
  choice: अपने विरुद्ध उठनेवालों को
  rationale: यह קום का कृदन्त रूप है, जिसका शाब्दिक भाव ‘तेरे विरुद्ध उठनेवाले’ है। इस रूप में क्रियात्मकता और परमेश्वर के प्रति विरोध दोनों सुरक्षित रहते हैं।
- source_word: תְּשַׁלַּח
  choice: भेजता है
  rationale: שׁלח का सीधा अर्थ ‘भेजना’ है। ‘भेजता है’ मूल रूपक को बिना अतिरिक्त व्याख्या जोड़े बनाए रखता है।
- source_word: חֲרֹנְךָ
  choice: अपना धधकता क्रोध
  rationale: חָרוֹן में क्रोध की जलती हुई तीव्रता निहित है। ‘धधकता क्रोध’ इस उष्णता-चित्र को सुरक्षित रखता है और अगले भस्म करने वाले रूपक से स्वाभाविक रूप से जुड़ता है।
- source_word: יֹאכְלֵמוֹ
  choice: वह उन्हें ... भस्म कर देता है
  rationale: एकवचन क्रिया का कर्ता पूर्ववर्ती एकवचन ‘क्रोध’ है। ‘वह’ संबंध को स्पष्ट करता है, जबकि ‘भस्म कर देता है’ आग-जैसे विनाश के काव्यात्मक चित्र को हिन्दी में स्वाभाविक बनाता है।
- source_word: כַּקַּשׁ
  choice: सूखी पराली की तरह
  rationale: קַשׁ अनाज काटने के बाद बची सूखी डंठल या पराली को सूचित करता है। ‘सूखी पराली’ शीघ्र जल जाने वाली वस्तु का चित्र स्पष्ट करती है और इसे केवल ‘भूसा’ या ‘फूस’ तक सीमित नहीं करती।
theological_decisions:
- issue: ईश्वरीय न्याय की तीखी काव्यात्मक भाषा
  choice: तू अपना धधकता क्रोध भेजता है, और वह उन्हें सूखी पराली की तरह भस्म कर देता है
  alternative: तू अपना कोप भेजता है, और वह उन्हें भूसे की तरह निगल जाता है
  rationale: इब्रानी पाठ विनाशकारी न्याय को सीधे परमेश्वर से जोड़ता है। अनुवाद इस तनाव को न तो नरम करता है, न किसी बाद की धर्मवैज्ञानिक व्याख्या से समझाता है; साथ ही आग और जलने के अंतर्निहित बिंब को स्पष्ट रखता है।
- issue: परमेश्वर को सीधे एकवचन सम्बोधन
  choice: अपने ... तू ... अपना
  alternative: आप अपने ... आप ... अपना
  rationale: गीत में परमेश्वर को सीधे एकवचन द्वितीय पुरुष में सम्बोधित किया गया है। काव्यात्मक और भक्तिपूर्ण हिन्दी में ‘तू’ निकटता, ऊँचे काव्य-स्वर और मूल व्याकरण—तीनों को बनाए रखता है; इसे अनादर के अर्थ में नहीं लिया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर निर्गमन के विजय-गीत के अनुरूप काव्यात्मक और गरिमापूर्ण रखी गई है। ‘अपार प्रताप’, ‘ढा देता है’, ‘धधकता क्रोध’ और ‘सूखी पराली’ सामान्य पाठक के लिए बोधगम्य हैं तथा मूल इब्रानी के सघन युद्ध और अग्नि-बिंब को बनाए रखते हैं।
