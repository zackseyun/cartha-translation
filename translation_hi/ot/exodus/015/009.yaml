  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक है। शत्रु की तेजी से बढ़ती डींग को बनाए रखने के लिए छोटे, क्रमिक वाक्यांश रखे गए हैं। उद्धरण के भीतर प्रत्येक क्रिया में दृढ़ भावी इरादा व्यक्त किया गया है।
