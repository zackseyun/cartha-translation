base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/009.yaml
  text: The enemy said[a], ‘I will pursue, I will overtake, I will divide the spoil; my desire will be satisfied on them. I will draw my sword[b]; my hand will dispossess them.’
translation:
  language: hi
  text: शत्रु ने कहा, “मैं पीछा करूँगा, मैं उन्हें जा पकड़ूँगा; मैं लूट का माल बाँटूँगा। उनसे मेरी लालसा तृप्त होगी[a]। मैं अपनी तलवार खींचूँगा; मेरा हाथ उन्हें बेदखल कर देगा[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मेरी आत्मा उनसे भर जाएगी,” अर्थात “मैं उनसे अपनी लालसा पूरी करूँगा।”
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद “मेरा हाथ उन्हें नष्ट कर देगा” या “उन्हें खदेड़ देगा” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַר אוֹיֵב
  choice: शत्रु ने कहा
  rationale: गीत में शत्रु की डींग का परिचय देने के लिए सामान्य भूतकाल स्वाभाविक है; एकवचन ‘शत्रु’ मिस्र की पीछा करती सेना का प्रतिनिधित्व करता है।
- source_word: אֶרְדֹּף אַשִּׂיג
  choice: मैं पीछा करूँगा, मैं उन्हें जा पकड़ूँगा
  rationale: दोनों अपूर्ण क्रियाएँ शत्रु के निश्चय या भावी इरादे को व्यक्त करती हैं; ‘जा पकड़ूँगा’ पीछा करके लक्ष्य तक पहुँच जाने का भाव स्पष्ट करता है।
- source_word: אֲחַלֵּק שָׁלָל
  choice: मैं लूट का माल बाँटूँगा
  rationale: यह युद्ध में प्राप्त माल को आपस में बाँटने की प्रचलित अभिव्यक्ति है और आधुनिक हिन्दी में सहज है।
- source_word: תִּמְלָאֵמוֹ נַפְשִׁי
  choice: उनसे मेरी लालसा तृप्त होगी
  rationale: यहाँ נֶפֶשׁ व्यक्ति की भूख, चाह या लालसा को सूचित करता है। मुख्य पाठ स्वाभाविक हिन्दी देता है, जबकि शाब्दिक चित्र पादटिप्पणी में सुरक्षित है।
- source_word: אָרִיק חַרְבִּי
  choice: मैं अपनी तलवार खींचूँगा
  rationale: ריק का हिफ़ील रूप ‘तलवार’ के साथ म्यान से तलवार निकालने का मुहावरेदार अर्थ देता है।
- source_word: תּוֹרִישֵׁמוֹ יָדִי
  choice: मेरा हाथ उन्हें उजाड़ देगा
  rationale: ירשׁ के हिफ़ील में बेदखल करने, खदेड़ने या नष्ट कर देने की अर्थ-सीमा है। ‘उजाड़ देगा’ युद्ध-संदर्भ में स्वाभाविक है और क्रिया की विनाशकारी शक्ति को व्यक्त करता है, जबकि अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
