source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ אִם שָׁמ֨וֹעַ תִּשְׁמַ֜ע לְ/ק֣וֹל יְהוָ֣ה אֱלֹהֶ֗י/ךָ וְ/הַ/יָּשָׁ֤ר בְּ/עֵינָי/ו֙ תַּעֲשֶׂ֔ה וְ/הַֽאֲזַנְתָּ֙ לְ/מִצְוֺתָ֔י/ו וְ/שָׁמַרְתָּ֖ כָּל חֻקָּ֑י/ו כָּֽל הַ/מַּֽחֲלָ֞ה אֲשֶׁר שַׂ֤מְתִּי בְ/מִצְרַ֨יִם֙ לֹא אָשִׂ֣ים עָלֶ֔י/ךָ כִּ֛י אֲנִ֥י יְהוָ֖ה רֹפְאֶֽ/ךָ־׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/026.yaml
  text: He said[a], “If you diligently listen to the voice of Yahweh your God, and do what is right in his eyes, and give ear to his commandments, and keep all his statutes, I will put none of the diseases on you that I put on Egypt, for I am Yahweh, your healer.”
translation:
  language: hi
  text: उसने कहा, “यदि तुम अपने परमेश्वर यहोवा की बात ध्यान से सुनोगे, उसकी दृष्टि में जो सही है वह करोगे, उसकी आज्ञाओं पर कान दोगे और उसकी सब विधियों का पालन करोगे, तो जितने भी रोग मैंने मिस्र में डाले थे, उनमें से कोई भी तुम पर नहीं डालूँगा; क्योंकि मैं यहोवा हूँ, तुम्हारा चंगा करनेवाला[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो तुम्हें चंगा करता है।”
    reason: רֹפְאֶךָ कृदंत को संज्ञात्मक ‘तुम्हारा चंगा करनेवाला’ अथवा क्रियात्मक ‘जो तुम्हें चंगा करता है’—दोनों प्रकार से व्यक्त किया जा सकता है।
lexical_decisions:
- source_word: שָׁמוֹעַ תִּשְׁמַע
  choice: ध्यान से सुनोगे
  rationale: धातु के साथ infinitive absolute क्रिया को प्रबल करता है। ‘ध्यान से सुनोगे’ सुनने के मूल अर्थ और आज्ञापालन की ओर संकेत करनेवाली तत्परता—दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: לְקוֹל יְהוָה אֱלֹהֶיךָ
  choice: अपने परमेश्वर यहोवा की बात
  rationale: קוֹל का शाब्दिक अर्थ ‘आवाज़’ है, पर ‘किसी की आवाज़ सुनना’ यहाँ उसकी कही बात मानने का हिब्रू मुहावरा है। ‘की बात’ आधुनिक हिन्दी में स्वाभाविक रहते हुए वही आशय देता है; יְהוָה को व्यक्तिगत वाचा-नाम ‘यहोवा’ से दर्शाया गया है।
- source_word: וְהַיָּשָׁר בְּעֵינָיו
  choice: जो उसकी दृष्टि में सही है
  rationale: ‘उसकी आँखों में सीधा’ के हिब्रू मुहावरे को नैतिक अर्थ सहित रखा गया है, बिना इसे अधिक व्याख्यात्मक ‘उसे प्रसन्न करनेवाला’ बनाने के।
- source_word: וְהַאֲזַנְתָּ
  choice: कान लगाओगे
  rationale: אזן का हिफ़ील रूप ध्यानपूर्वक सुनने का भाव देता है। ‘कान लगाना’ पहले आए שׁמע से शब्दगत भेद भी बनाए रखता है।
- source_word: לְמִצְוֺתָיו
  choice: उसकी आज्ञाओं
  rationale: מִצְוֹת का सीधा और वाचा-संदर्भ के अनुकूल हिन्दी रूप ‘आज्ञाएँ’ है।
- source_word: וְשָׁמַרְתָּ כָּל חֻקָּיו
  choice: उसकी सब विधियों का पालन करोगे
  rationale: कानूनी संदर्भ में שׁמר का अर्थ मानना या पालन करना है और חֻקִּים निश्चित विधियों/नियमों को दर्शाता है। यह संयोजन आधुनिक हिन्दी में स्पष्ट है।
- source_word: כָּל הַמַּחֲלָה
  choice: जो रोग ... उनमें से कोई भी
  rationale: एकवचन संज्ञा यहाँ सामूहिक अर्थ रखती है। हिन्दी में ‘रोगों में से कोई भी नहीं’ उस व्यापक निषेध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֲשֶׁר שַׂמְתִּי בְמִצְרַיִם ... לֹא אָשִׂים עָלֶיךָ
  choice: जो रोग मैंने मिस्र पर डाले थे ... कोई भी तुम पर नहीं डालूँगा
  rationale: दोनों स्थानों पर שׂים के लिए ‘डालना’ रखकर मूल की शब्दगत पुनरावृत्ति और शर्तबद्ध प्रतिज्ञा की संरचना सुरक्षित रखी गई है।
- source_word: רֹפְאֶךָ
  choice: तुम्हारा चंगा करनेवाला
  rationale: कर्ता-वाचक कृदंत को संज्ञात्मक ढंग से प्रस्तुत किया गया है, जिससे ‘तुम्हारा चंगा करनेवाला’ और ‘जो तुम्हें चंगा करता है’ के बीच मूल की हल्की अस्पष्टता बनी रहती है; दूसरा रूप पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में चार-अक्षरी व्यक्तिगत वाचा-नाम सीधे उपस्थित है। हिन्दी पाठकों के लिए सुविदित ‘यहोवा’ उसे सामान्य उपाधि ‘प्रभु’ में बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: रोग से रक्षा की प्रतिज्ञा का स्वरूप
  choice: आज्ञाकारी सुनने से जुड़ी, मिस्र पर डाले गए रोगों के विषय में वाचा-संबंधी शर्तबद्ध प्रतिज्ञा
  alternative: हर परिस्थिति में प्रत्येक व्यक्ति के शारीरिक रूप से चंगे होने की सार्वभौमिक गारंटी
  rationale: אִם (‘यदि’) पूरे कथन को शर्तबद्ध करता है और रोगों को स्पष्टतः मिस्र पर आए दंड से जोड़ता है। अनुवाद इससे आगे कोई सार्वभौमिक आरोग्य-सिद्धांत नहीं जोड़ता।
- issue: רֹפְאֶךָ की कृदंतीय अभिव्यक्ति
  choice: तुम्हारा चंगा करनेवाला
  alternative: जो तुम्हें चंगा करता है
  rationale: संज्ञात्मक रूप परमेश्वर के परिचयात्मक कथन की संक्षिप्तता बनाए रखता है, जबकि पादटिप्पणी संभव क्रियात्मक अर्थ को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। ‘ध्यान से सुनना,’ ‘कान लगाना’ और ‘पालन करना’ मूल में प्रयुक्त अलग-अलग श्रवण/आज्ञापालन क्रियाओं का अंतर बनाए रखते हैं। संबोधन पूरे पद में एकवचन है; हिन्दी में ‘तुम’ के रूप संदर्भानुसार एकवचन सामुदायिक संबोधन को वहन करते हैं।
