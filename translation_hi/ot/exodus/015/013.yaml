base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/013.yaml
  text: In your steadfast love you have led the people whom you redeemed[b][a]; in your strength you have guided them to your holy dwelling.
translation:
  language: hi
  text: अपने अटल प्रेम से तूने इस प्रजा[a] की अगुवाई की, जिसे तूने छुड़ाया; अपने सामर्थ्य से तू उसे अपने पवित्र निवास[b] तक ले चला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उस प्रजा’। इब्रानी संकेतवाचक पद का अर्थ ‘इस’ या प्रसंगानुसार ‘उस’ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘पवित्र निवास’ व्यापक रूप से परमेश्वर की पवित्र उपस्थिति के स्थान को दर्शा सकता है; इसे सीनै, प्रतिज्ञात देश, या सिय्योन/मन्दिर के रूप में समझा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: נָחִיתָ
  choice: अगुवाई की
  rationale: हिफ़ील रूप यहाँ नेतृत्व करने या मार्ग दिखाने का भाव देता है। ‘अगुवाई की’ स्वाभाविक हिन्दी में परमेश्वर द्वारा अपनी प्रजा को आगे ले जाने की पूर्ण क्रिया व्यक्त करता है।
- source_word: בְחַסְדְּךָ
  choice: अपने अटल प्रेम से
  rationale: חֶסֶד में प्रेम, दया और निष्ठा का संयुक्त भाव है। ‘अटल प्रेम’ इसकी स्थिरता को सरल, गरिमापूर्ण हिन्दी में व्यक्त करता है; ‘से’ यहाँ साधन का भाव स्पष्ट करता है।
- source_word: עַם זוּ
  choice: इस प्रजा
  rationale: זוּ का संकेतवाचक बल बनाए रखने के लिए ‘इस’ रखा गया है। ‘प्रजा’ सामूहिक जनसमुदाय और परमेश्वर से उसके संबंध, दोनों के लिए उपयुक्त है।
- source_word: גָּאָלְתָּ
  choice: तूने छुड़ाया था
  rationale: גאל किसी को बंधन या अधिकार से मुक्त कराने का प्रमुख शब्द है। निर्गमन के प्रसंग में ‘छुड़ाया’ सहज हिन्दी है और उद्धार का मूल भाव बनाए रखता है।
- source_word: נֵהַלְתָּ
  choice: ले चला
  rationale: נהל में देखभाल के साथ आगे ले जाने का भाव हो सकता है। ‘ले चला’ पहले खंड की ‘अगुवाई की’ से शब्दगत भेद रखते हुए उस सतत, सावधान मार्गदर्शन को व्यक्त करता है।
- source_word: בְעָזְּךָ
  choice: अपने सामर्थ्य से
  rationale: עֹז शक्ति या पराक्रम दर्शाता है। ‘सामर्थ्य’ गरिमापूर्ण और सहज है तथा पहले खंड के ‘अपने अटल प्रेम से’ के साथ काव्यात्मक समानांतरता रखता है।
- source_word: אֶל
  choice: तक
  rationale: यह गंतव्य की ओर गति दर्शाता है। ‘तक’ पवित्र निवास को लक्ष्य के रूप में स्पष्ट करता है, जबकि उसके सटीक स्थान का निर्णय नहीं करता।
- source_word: נְוֵה קָדְשֶׁךָ
  choice: अपने पवित्र निवास
  rationale: נָוֶה का अर्थ निवास, बसेरा या चरागाह हो सकता है। यहाँ ‘पवित्र निवास’ परमेश्वर की पवित्र उपस्थिति के स्थान को व्यापक रूप में व्यक्त करता है और किसी एक भौगोलिक पहचान को नहीं थोपता।
theological_decisions:
- issue: ‘पवित्र निवास’ का अभिप्रेत स्थान
  choice: परमेश्वर की पवित्र उपस्थिति के स्थान का जानबूझकर व्यापक उल्लेख
  alternative: इसे विशेष रूप से सीनै, प्रतिज्ञात देश, या सिय्योन/मन्दिर मानना
  rationale: इब्रानी पदबंध स्वयं किसी एक स्थान को निश्चित नहीं करता। समुद्र का गीत परमेश्वर के उद्धारकारी कार्य को काव्यात्मक रूप से उसके पवित्र निवास तक देख सकता है; इसलिए मुख्य पाठ इस तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, काव्यात्मक और गरिमापूर्ण शैली रखी गई है। परमेश्वर के सीधे संबोधन में पारंपरिक किंतु आज भी बोधगम्य एकवचन ‘तू’ प्रयोग किया गया है। दोनों काव्य-पंक्तियों में ‘अपने…से’ की समानांतर रचना बनाए रखी गई है।
