base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/001.yaml
  text: 'Then Moses and the sons of Israel sang this song to Yahweh[a], and they said: “I will sing to Yahweh, for he has triumphed gloriously[b]; horse and its rider he has thrown into the sea.”'
translation:
  language: hi
  text: 'तब मूसा और इस्राएल के पुत्रों ने याहवे[a] के लिए यह गीत गाया। उन्होंने कहा:


    “मैं याहवे के लिए गाऊँगा,

    क्योंकि उसने महिमामय विजय पाई है[b];

    घोड़े और उसके सवार को

    उसने समुद्र में फेंक दिया है।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में YHWH (יהוה); इसका उच्चारण प्रायः “याहवे” माना जाता है। परम्परागत अनुवादों में इसे “प्रभु” भी लिखा जाता है।
    reason: दिव्य नाम के इब्रानी रूप तथा प्रचलित वैकल्पिक प्रस्तुति को स्पष्ट करना।
  - marker: b
    text: या, “वह अति महान ठहरा है” या “उसने अपने को बहुत ऊँचा उठाया है।” इब्रानी में एक ही धातु के दो रूप साथ रखकर भाव को अत्यन्त प्रबल किया गया है।
    reason: मूल की तीव्रता तथा विजय और उत्कर्ष के बीच की अर्थगत व्यापकता को सुरक्षित रखना।
lexical_decisions:
- source_word: אָז
  choice: तब
  rationale: यह पिछले समुद्र-पार घटनाक्रम के बाद की समयगत क्रमबद्धता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יָשִׁיר
  choice: गाया
  rationale: यद्यपि रूप अपूर्ण काल का है, אָז के साथ कथात्मक प्रसंग में इसका भूतकालिक अर्थ है।
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: और इस्राएल के पुत्रों ने
  rationale: यह इब्रानी वंश-सूचक पदबंध को पारदर्शी ढंग से रखता है; यहाँ पुरुषवाचक रूप को सामान्यीकृत करके केवल 'इस्राएलियों' नहीं किया गया।
- source_word: הַשִּׁירָה הַזֹּאת
  choice: यह गीत
  rationale: मूल पदबंध का सीधा अनुवाद है, जिसमें 'स्तुति' जैसा अतिरिक्त अर्थ नहीं जोड़ा गया।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: दिशा/समर्पण सूचक לְ को स्वाभाविक हिन्दी में 'के लिए' और दिव्य नाम को प्रचलित हिन्दी रूप 'यहोवा' से व्यक्त किया गया है।
- source_word: וַיֹּאמְרוּ לֵאמֹר
  choice: उन्होंने कहा
  rationale: इब्रानी कथन-परिचय सूत्र का अर्थ स्वाभाविक हिन्दी में दिया गया है; 'कहते हुए कहा' अनावश्यक रूप से पुनरुक्त होता।
- source_word: אָשִׁירָה
  choice: मैं ... गाऊँगा
  rationale: प्रथम पुरुष एकवचन सहमतिक/संकल्पसूचक रूप गीत गाने का दृढ़ निश्चय व्यक्त करता है और बहुवचन भूमिका से एकवचन काव्य-वाणी की ओर बदलाव बनाए रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह गाने का कारण प्रस्तुत करता है।
- source_word: גָאֹה גָּאָה
  choice: वह अत्यन्त महान हुआ है
  rationale: एक ही धातु के धात्वर्थक अनंत रूप और सीमित क्रिया की पुनरावृत्ति को तीव्रता के साथ व्यक्त करता है, जबकि विजय और उत्कर्ष के बीच मूल की अर्थगत व्यापकता को पूरी तरह एक ही दिशा में सीमित नहीं करता।
- source_word: סוּס וְרֹכְבוֹ
  choice: घोड़े और उसके सवार को
  rationale: मूल के सामूहिक एकवचन और स्वामित्वसूचक प्रत्यय दोनों को सुरक्षित रखता है।
- source_word: רָמָה
  choice: उसने ... फेंक दिया है
  rationale: समुद्र में बलपूर्वक डालने की पूर्ण क्रिया को स्पष्ट, आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בַיָּם
  choice: समुद्र में
  rationale: בְ का मूल स्थान/दिशा-सापेक्ष अर्थ हिन्दी क्रिया 'फेंकना' के साथ स्वाभाविक रूप से व्यक्त होता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में व्यक्तिगत वाचा-नाम स्पष्ट रूप से है। 'यहोवा' आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाता है और नाम को उपाधि 'प्रभु' से नहीं बदलता; पादटिप्पणी इब्रानी व्यंजनरूप और वैकल्पिक उच्चारण बताती है।
- issue: גָאֹה גָּאָה में विजय अथवा उत्कर्ष का भाव
  choice: वह अत्यन्त महान हुआ है
  alternative: उसने महिमामय विजय पाई है; वह अति महान ठहरा है
  rationale: समुद्र-विजय का प्रसंग विजय का भाव देता है, पर धातु का उत्कर्ष/ऊँचाई संबंधी अर्थ भी वास्तविक है। मुख्य पाठ अपेक्षाकृत व्यापक अर्थ रखता है और पादटिप्पणी विकल्प बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। गीत को काव्य-पंक्तियों में सजाया गया है। कथन-परिचय में इब्रानी की शाब्दिक पुनरुक्ति को हिन्दी में नहीं दोहराया गया, पर एकवचन काव्य-वाणी और सामूहिक एकवचन बिंब सुरक्षित हैं।
