  choice: रथों
  rationale: बहुवचन संज्ञा फ़िरौन के युद्ध-रथों को ठोस रूप में दर्शाती है; आधुनिक हिन्दी में ‘रथ’ स्वाभाविक और स्पष्ट है।
- source_word: פַּרְעֹה
  choice: फ़िरौन
  rationale: मिस्र के शासक की उपाधि के लिए हिन्दी बाइबल-परंपरा और आधुनिक प्रयोग में प्रचलित रूप।
- source_word: וְחֵילוֹ
  choice: और उसकी सेना
  rationale: इस युद्ध-संदर्भ में חַיִל धन या सामान्य सामर्थ्य नहीं, बल्कि सैन्य बल को दर्शाता है।
- source_word: יָרָה
  choice: फेंक दिया
  rationale: क्रिया का मूल अर्थ फेंकना या प्रक्षेपित करना है; यह चयन काव्यात्मक चित्र की प्रबलता को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: בַיָּם
  choice: समुद्र में
  rationale: ‘फेंक दिया’ के साथ हिन्दी में ‘समुद्र में’ गति और परिणामी प्रवेश दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וּמִבְחַר
  choice: चुने हुए
  rationale: यह पद चयनित अथवा श्रेष्ठ जनों का बोध देता है; ‘चुने हुए’ चयन के मूल भाव को स्पष्ट रखता है।
- source_word: שָׁלִשָׁיו
  choice: उसके अधिकारी
  rationale: שָׁלִישׁ उच्च अथवा विशिष्ट सैन्य अधिकारियों को सूचित कर सकता है, संभवतः रथ-दल से जुड़े हुए; ‘अधिकारी’ अनावश्यक रूप से पद या भूमिका निश्चित नहीं करता।
- source_word: טֻבְּעוּ
  choice: डुबो दिए गए
  rationale: हिब्रू का कर्मवाच्य रूप डुबाए या जलमग्न किए जाने को व्यक्त करता है; हिन्दी अनुवाद उसी कर्मवाच्य और चित्र को बनाए रखता है।
- source_word: בְיַם סוּף
  choice: सरकंडों के समुद्र में
  rationale: יַם סוּף का मूल अर्थ सरकंडों या नरकटों से संबद्ध समुद्र है। मूल भाषा को प्राथमिकता देते हुए शाब्दिक अर्थ मुख्य पाठ में रखा गया है।
theological_decisions:
- issue: יַם סוּף का अनुवाद
  choice: सरकंडों का समुद्र
  alternative: लाल समुद्र
  rationale: हिब्रू पद के शाब्दिक अर्थ को मुख्य पाठ में रखा गया है, जबकि पाठकों की परिचित अनुवाद-परंपरा के लिए ‘लाल समुद्र’ को पादटिप्पणी में दिया गया है। यह चयन किसी विशिष्ट भौगोलिक पहचान को अतिरिक्त रूप से निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। हिब्रू की पहली पंक्ति में कर्म को आगे रखने की संरचना हिन्दी में यथासंभव सुरक्षित है। ‘उसने’ का कर्ता पिछले काव्य-संदर्भ से समझा जाता है; पाठ में नया नाम जोड़कर अस्पष्टता दूर नहीं की गई।
