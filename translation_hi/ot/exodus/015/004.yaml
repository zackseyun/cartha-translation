  yaml_path: translation/ot/exodus/015/004.yaml
  text: Pharaoh’s chariots and his army he cast into the sea[a], and the choicest of his officers were sunk in the Sea of Reeds.
translation:
  language: hi
  text: 'फ़िरौन के रथों और उसकी सेना को उसने समुद्र में फेंक दिया,

    और उसके चुने हुए अधिकारी सरकंडों के समुद्र[a] में डुबो दिए गए।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: परंपरागत अनुवाद “लाल समुद्र” है। हिब्रू में “सरकंडों का समुद्र” है।
    reason: lexical_alternative
lexical_decisions:
