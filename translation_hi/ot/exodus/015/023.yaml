base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/023.yaml
  text: Then they came to Marah[a], but they could not drink the water from Marah because it was bitter. Therefore it was named Marah.
translation:
  language: hi
  text: तब वे मारा[a] पहुँचे, पर वे मारा का पानी नहीं पी सके, क्योंकि वह कड़वा था। इसलिए उस स्थान का नाम मारा पड़ा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “मारा” नाम इब्रानी भाषा के “कड़वा” शब्द से मिलता-जुलता है।
    reason: स्थान-नाम और מָרִים (‘कड़वा’) के बीच इब्रानी शब्द-खेल हिन्दी में सीधे सुनाई नहीं देता।
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: तब वे पहुँचे
  rationale: वय्यिक्तोल कथा को आगे बढ़ाता है; ‘तब’ क्रमिकता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מָרָתָה
  choice: मारा पहुँचे
  rationale: स्थान-नाम के साथ दिशासूचक ה है; हिन्दी में गति को ‘मारा पहुँचे’ से स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: וְלֹא יָכְלוּ
  choice: पर वे ... नहीं पी सके
  rationale: संयोजक यहाँ पहुँचने और पी न सकने के बीच विरोध दिखाता है; ‘पर’ इस संबंध को स्पष्ट करता है।
- source_word: לִשְׁתֹּת מַיִם מִמָּרָה
  choice: मारा का पानी ... पी सके
  rationale: מן स्रोत को सूचित करता है। ‘मारा का पानी’ आधुनिक हिन्दी में ‘मारा से पानी’ की अपेक्षा अधिक स्वाभाविक है और उसी स्थान के विशिष्ट पानी को दर्शाता है।
- source_word: כִּי מָרִים הֵם
  choice: क्योंकि वह कड़वा था
  rationale: כִּי का कारणसूचक बल रखा गया है। इब्रानी में बहुवचन विशेषण מָרִים, बहुवचन-रूप מַיִם से मेल खाता है; हिन्दी में ‘पानी’ सामान्यतः एकवचन द्रव्यवाचक संज्ञा है, इसलिए ‘वह कड़वा था’ स्वाभाविक है।
- source_word: עַל כֵּן
  choice: इसलिए
  rationale: नामकरण के निष्कर्ष अथवा कारण को बताने वाला स्वाभाविक हिन्दी संबंधसूचक।
- source_word: קָרָא שְׁמָהּ מָרָה
  choice: उस स्थान का नाम मारा पड़ा
  rationale: क्रिया का स्पष्ट कर्ता नहीं है। हिन्दी का ‘नाम ... पड़ा’ अकर्तृक नामकरण को सहज रूप से व्यक्त करता है; स्त्रीलिंग प्रत्यय से सूचित स्थान को स्पष्ट करने के लिए ‘उस स्थान का’ कहा गया है।
- source_word: מָרָה / מָרִים
  choice: मारा / कड़वा
  rationale: स्थान-नाम को लिप्यंतरित किया गया है और विशेषण का अर्थ अनूदित है। ध्वनि-आधारित शब्द-खेल को पाद-टिप्पणी में समझाया गया है।
