  yaml_path: translation/ot/exodus/015/005.yaml
  text: The depths covered them[a]; they went down into the depths like a stone.
translation:
  language: hi
  text: गहरे जल ने उन्हें ढक लिया[a]; वे गहराइयों में पत्थर के समान उतर गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अथाह जल ने उन्हें ढक लिया; वे पत्थर के समान गहराइयों में डूब गए।”
    reason: शब्दार्थ और क्रियात्मक अभिव्यक्ति के वैकल्पिक अनुवाद को दिखाने के लिए; תְּהֹמֹת अथाह/गहरे जल को और יָרְדוּ संदर्भ में नीचे जाने अथवा डूबने को व्यक्त कर सकता है।
lexical_decisions:
- source_word: תְּהֹמֹת
  choice: गहरे जल
  rationale: बहुवचन संज्ञा समुद्र के गहरे अथवा अथाह जल को दर्शाती है। ‘गहरे जल’ आधुनिक हिन्दी में स्वाभाविक है और जलीय संदर्भ को स्पष्ट रखते हुए काव्यात्मक चित्र को बनाए रखता है।
- source_word: יְכַסְיֻמוּ
  choice: उन्हें ढक लिया
  rationale: כסה का मूल अर्थ ‘ढकना’ है और प्रत्यय तीसरे पुरुष बहुवचन कर्म को सूचित करता है। पूर्णता और स्वाभाविक हिन्दी अभिव्यक्ति के लिए ‘ढक लिया’ चुना गया है।
- source_word: יָרְדוּ
  choice: वे उतर गए
  rationale: ירד का सीधा अर्थ ‘नीचे जाना/उतरना’ है। ‘उतर गए’ मूल क्रिया के अवतरण-बिंब को रखता है; ‘डूब गए’ संदर्भानुकूल पर कुछ अधिक व्याख्यात्मक होता।
- source_word: בִמְצוֹלֹת
  choice: गहराइयों में
  rationale: מְצוֹלָה विशेषकर समुद्र की गहराई को दर्शाता है। ‘गहराइयों में’ गति के संदर्भ में सहज हिन्दी है और पहले पद से समानांतरता रखते हुए इब्रानी के अलग शब्द को पूर्णतः अलग अर्थ देने से बचता है।
- source_word: כְּמוֹ
  choice: के समान
  rationale: तुलनासूचक पद का dignified और स्पष्ट आधुनिक हिन्दी समतुल्य।
- source_word: אָבֶן
  choice: पत्थर
  rationale: सामान्य संज्ञा ‘पत्थर’; हिन्दी में इस उपमा के भीतर अनिश्चित उपपद की आवश्यकता नहीं होती।
