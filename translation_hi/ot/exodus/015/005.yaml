  terminology: “गहरे जल,” “गहराइयों,” “ढक लिया,” and “पत्थर के समान” are appropriate modern-standard Hindi choices. The footnote supplies a legitimate contextual alternative (“डूब गए”) without treating it as the sole meaning of the Hebrew verb.
