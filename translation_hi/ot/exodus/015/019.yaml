source:
  edition: WLC
  text: כִּ֣י בָא֩ ס֨וּס פַּרְעֹ֜ה בְּ/רִכְבּ֤/וֹ וּ/בְ/פָרָשָׁי/ו֙ בַּ/יָּ֔ם וַ/יָּ֧שֶׁב יְהוָ֛ה עֲלֵ/הֶ֖ם אֶת מֵ֣י הַ/יָּ֑ם וּ/בְנֵ֧י יִשְׂרָאֵ֛ל הָלְכ֥וּ בַ/יַּבָּשָׁ֖ה בְּ/ת֥וֹךְ הַ/יָּֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/019.yaml
  text: For Pharaoh’s horses went into the sea with his chariots and with his horsemen[a], and Yahweh brought back the waters of the sea over them[b]; but the sons of Israel walked on dry ground through the midst of the sea.
translation:
  language: hi
  text: क्योंकि फ़िरौन के घोड़े उसके रथों और घुड़सवारों समेत समुद्र में गए, और यहोवा ने समुद्र का पानी उन पर फिर से लौटा दिया; पर इस्राएली समुद्र के बीच सूखी भूमि पर चलते गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले गीतात्मक कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: סוּס פַּרְעֹה
  choice: फ़िरौन के घोड़े
  rationale: मूल में ‘घोड़ा’ एकवचन है, पर यहाँ वह सामूहिक अर्थ में फ़िरौन की अश्व-सेना को सूचित करता है; हिन्दी में बहुवचन अधिक स्वाभाविक और प्रसंगानुकूल है।
- source_word: בְּרִכְבּוֹ וּבְפָרָשָׁיו
  choice: उसके रथों और घुड़सवारों समेत
  rationale: ‘रथ’ रूपतः एकवचन होते हुए सामूहिक रथ-सेना का बोध कराता है; ‘समेत’ तीनों सैन्य घटकों के एक साथ समुद्र में प्रवेश को सहज हिन्दी में व्यक्त करता है।
- source_word: וַיָּשֶׁב יְהוָה
  choice: और यहोवा ... लौटा लाया
  rationale: שׁוב का हिफ़ील रूप कारणवाचक है; ‘लौटा लाया’ पानी के फिर अपनी जगह आने और यहोवा की सक्रिय भूमिका दोनों को बनाए रखता है।
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: पर इस्राएली
  rationale: शाब्दिक अर्थ ‘और इस्राएल के पुत्र’ है। प्रसंग का स्पष्ट विरोध ‘पर’ से स्वाभाविक बनता है, और ‘इस्राएली’ आधुनिक हिन्दी में पूरे समुदाय के लिए अधिक सहज है।
- source_word: הָלְכוּ בַיַּבָּשָׁה בְּתוֹךְ הַיָּם
  choice: समुद्र के बीच सूखी भूमि पर चलते गए
  rationale: यह वाक्य समुद्र के भीतर सूखे तल पर उनकी निरंतर आगे की गति को स्पष्ट, स्वाभाविक हिन्दी में रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में वाचा-संबंधी व्यक्तिगत नाम सीधे प्रयुक्त है। हिन्दी बाइबल परंपरा में व्यापक रूप से पहचाना जाने वाला ‘यहोवा’ नाम को उपाधि में बदले बिना सुरक्षित रखता है।
- issue: וּבְנֵי יִשְׂרָאֵל में संयोजक का संबंध
  choice: पर इस्राएली
  alternative: और इस्राएली
  rationale: हिब्रू में सामान्य संयोजक ‘और’ है, जो प्रसंग में विरोधसूचक हो सकता है। ‘पर’ मिस्री सेना के डूबने और इस्राएलियों के सूखी भूमि पर चलने के बीच निहित विरोध को हिन्दी में स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और कथात्मक है। ‘फ़िरौन’, ‘रथ’, ‘घुड़सवार’ और ‘सूखी भूमि’ जैसे परिचित बाइबलीय शब्द रखे गए हैं। मूल के सामूहिक एकवचनों को अर्थानुसार बहुवचन में व्यक्त किया गया है।
