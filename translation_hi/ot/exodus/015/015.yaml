source:
  edition: WLC
  text: אָ֤ז נִבְהֲלוּ֙ אַלּוּפֵ֣י אֱד֔וֹם אֵילֵ֣י מוֹאָ֔ב יֹֽאחֲזֵ֖/מוֹ רָ֑עַד נָמֹ֕גוּ כֹּ֖ל יֹשְׁבֵ֥י כְנָֽעַן׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/015.yaml
  text: Then the chiefs of Edom were terrified[a]; trembling seized the leaders of Moab; all the inhabitants of Canaan melted away.
translation:
  language: hi
  text: 'तब एदोम के प्रधान घबरा उठे;

    मोआब के अगुवों[a] को थरथराहट ने आ पकड़ा;

    कनान के सभी निवासी पिघल गए।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मोआब के बलवान जनों।” इब्रानी अभिव्यक्ति का शाब्दिक अर्थ “मोआब के बलवानों/मेढ़ों” जैसा है; यहाँ इससे प्रमुख या सामर्थी पुरुष अभिप्रेत हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: तब
  rationale: यह कालवाचक क्रियाविशेषण पिछले उद्धारकारी कार्य के परिणामस्वरूप उत्पन्न स्थिति को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: נִבְהֲלוּ
  choice: घबरा उठे
  rationale: निफ़अल रूप तीव्र व्याकुलता, घबराहट या आतंकित होने का भाव देता है; ‘घबरा उठे’ गीतात्मक प्रसंग में अचानक छा गए भय को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אַלּוּפֵי אֱדוֹם
  choice: एदोम के प्रधान
  rationale: אַלּוּף कुल-प्रमुख, सरदार या प्रधान को सूचित कर सकता है। ‘प्रधान’ नेतृत्व का अर्थ बनाए रखता है, पर किसी निश्चित राजकीय पद का अनावश्यक संकेत नहीं देता।
- source_word: אֵילֵי מוֹאָב
  choice: मोआब के अगुवों
  rationale: אֵילֵי का मूल बिंब शक्ति या बलवान जनों से जुड़ा है, पर यहाँ एदोम के प्रधानों के समानांतर मोआब के प्रमुख व्यक्तियों का संकेत है। ‘अगुवों’ प्रसंगगत सामाजिक-राजनीतिक अर्थ को स्पष्ट करता है और शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: יֹאחֲזֵמוֹ רָעַד
  choice: को थरथराहट ने आ पकड़ा
  rationale: अभिव्यक्ति में काँपने को मानो पकड़ लेने वाली शक्ति के रूप में चित्रित किया गया है। यह अनुवाद उस सजीव मानवीकरण और भय की तीव्रता को बनाए रखता है।
- source_word: נָמֹגוּ
  choice: पिघल गए
  rationale: भय के प्रसंग में क्रिया गलने, पिघलने या साहस खो देने का रूपक व्यक्त करती है। ‘पिघल गए’ मूल काव्यात्मक बिंब को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: כֹּל יֹשְׁבֵי כְנָעַן
  choice: कनान के सभी निवासी
  rationale: यह सहभागी रूप के सामूहिक अर्थ का सीधा और आधुनिक हिन्दी में स्वाभाविक अनुवाद है।
