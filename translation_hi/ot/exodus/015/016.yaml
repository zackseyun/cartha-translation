source:
  edition: WLC
  text: תִּפֹּ֨ל עֲלֵי/הֶ֤ם אֵימָ֨תָ/ה֙ וָ/פַ֔חַד בִּ/גְדֹ֥ל זְרוֹעֲ/ךָ֖ יִדְּמ֣וּ כָּ/אָ֑בֶן עַד יַעֲבֹ֤ר עַמְּ/ךָ֙ יְהוָ֔ה עַֽד יַעֲבֹ֖ר עַם ז֥וּ קָנִֽיתָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/016.yaml
  text: Terror and dread will fall on them[a]; by the greatness of your arm they will be still as a stone, until your people pass by, O Yahweh[c][b], until this people whom you acquired pass by.
translation:
  language: hi
  text: 'उन पर आतंक और भय आ पड़ेगा;

    तेरी भुजा की महानता से

    वे पत्थर के समान निश्चल रहेंगे[a],

    जब तक तेरी प्रजा गुज़र न जाए, हे याहवे[b],

    जब तक यह प्रजा, जिसे तूने प्राप्त किया है[c], गुज़र न जाए।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘वे मौन रहेंगे’ या ‘वे गतिहीन रहेंगे’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘याहवे’ परमेश्वर के इब्रानी निजी नाम יהוה का लिप्यंतरण है।
    reason: divine_name
  - marker: c
    text: ‘प्राप्त किया’ का अनुवाद ‘मोल लिया’ या व्यापक वाचागत अर्थ में ‘अपना बनाया’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפֹּל עֲלֵיהֶם אֵימָתָה וָפַחַד
  choice: उन पर आतंक और भय आ पड़ेगा
  rationale: इब्रानी में क्रिया स्त्रीलिंग एकवचन है और उसके बाद निकटार्थक संयुक्त कर्ता आता है। हिंदी का एकवचन ‘आ पड़ेगा’ इस भयावह अनुभव को एक संयुक्त प्रभाव के रूप में स्वाभाविक ढंग से व्यक्त करता है। ‘आतंक’ और ‘भय’ दोनों शब्द काव्यात्मक तीव्रता बनाए रखते हैं।
- source_word: בִּגְדֹל זְרוֹעֲךָ
  choice: तेरी भुजा की महानता से
  rationale: यह अनुवाद साधन अथवा कारण सूचित करने वाले בְּ को व्यक्त करता है और ‘भुजा’ के मूल रूपक को शक्ति जैसे अमूर्त शब्द से नहीं बदलता।
- source_word: יִדְּמוּ כָּאָבֶן
  choice: वे पत्थर के समान निश्चल रहेंगे
  rationale: יִדְּמוּ में चुप, शांत अथवा गतिहीन होने का अर्थ संभव है। पत्थर की उपमा के साथ ‘निश्चल’ प्रसंगानुकूल है, जबकि पादटिप्पणी अन्य वास्तविक अर्थों को सुरक्षित रखती है।
- source_word: עַד יַעֲבֹר
  choice: जब तक ... आगे न निकल जाए
  rationale: עבר का अर्थ यहाँ आगे बढ़ते हुए निकल जाना अथवा पार होना हो सकता है। ‘आगे न निकल जाए’ किसी विशेष नदी-पार घटना को अनावश्यक रूप से निश्चित किए बिना यात्रा और आगे बढ़ने का भाव देता है।
- source_word: עַמְּךָ ... עַם זוּ
  choice: तेरी प्रजा ... यह प्रजा
  rationale: עם का संबंधपरक और सामुदायिक अर्थ ‘प्रजा’ से व्यक्त होता है; זוּ के संकेतवाचक बल को ‘यह’ से बनाए रखा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले परमेश्वर के निजी नाम को उपाधि से बदलने के बजाय हिंदी लिपि में लिप्यंतरित किया गया है।
- source_word: קָנִיתָ
  choice: तूने अपने लिए प्राप्त किया है
  rationale: קנה का मूल अर्थ प्राप्त करना, अर्जित करना अथवा मोल लेना है। ‘अपने लिए प्राप्त किया’ संबंध और अधिकार का भाव रखता है, पर इसे केवल खरीद या किसी विशिष्ट उद्धार-सिद्धांत तक सीमित नहीं करता।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: हे याहवे
  alternative: हे प्रभु / यहोवा
  rationale: मूल पाठ में निजी वाचा-नाम है। ‘याहवे’ उसे उपाधि में बदले बिना प्रस्तुत करता है; संबोधन को ‘हे’ से स्पष्ट किया गया है।
- issue: קָנִיתָ का वाचागत अर्थ
  choice: जिसे तूने अपने लिए प्राप्त किया है
  alternative: जिसे तूने मोल लिया है / जिसे तूने अपना बनाया है
  rationale: मुख्य पाठ व्यापक शाब्दिक अर्थ बनाए रखता है और खरीद, सृष्टि या तकनीकी अर्थ में उद्धार—इनमें से किसी एक को अनिवार्य नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण काव्यात्मक रूप अपनाया गया है। समानांतर पंक्तियाँ और ‘जब तक ... जब तक ...’ की पुनरावृत्ति मूल गीत की संरचना को बनाए रखती हैं। सर्वनाम ‘तू/तेरी’ प्राचीन या अपमानसूचक प्रयोग के रूप में नहीं, बल्कि परमेश्वर को सीधे और निकट संबोधन की बाइबलीय काव्य-शैली में प्रयुक्त हैं।
