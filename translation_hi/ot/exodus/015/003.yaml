translation:
  language: hi
  text: याहवे[a] योद्धा है; याहवे उसका नाम है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: YHWH (יהוה); इसे ‘याहवे’ या ‘यहोवा’ लिप्यंतरित किया जाता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम YHWH को किसी उपाधि से बदलने के बजाय उसके प्रचलित लिप्यंतरण ‘याहवे’ से व्यक्त किया गया है।
- source_word: אִישׁ מִלְחָמָה
  choice: योद्धा
  rationale: इस इब्रानी पदबंध का शाब्दिक रूप ‘युद्ध का पुरुष’ है, पर यहाँ इसका स्वाभाविक और प्रसंगानुकूल अर्थ ‘योद्धा’ है; यह हिन्दी में स्पष्ट रहते हुए युद्ध-गीत की संक्षिप्त शक्ति बनाए रखता है।
- source_word: שְׁמוֹ
  choice: उसका नाम है
  rationale: इब्रानी में यह क्रियारहित वाक्यांश है। हिन्दी में स्वाभाविक वाक्य बनाने के लिए ‘है’ जोड़ा गया है, और सर्वनाम का एकवचन रूप मूल पाठ के अनुरूप रखा गया है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में उपाधि नहीं, परमेश्वर का विशिष्ट नाम है। इसलिए नाम को सुरक्षित रखा गया है; वैकल्पिक प्रचलित रूप पादटिप्पणी में दिया गया है।
- issue: אִישׁ מִלְחָמָה को शाब्दिक रूप में या मुहावरे के अर्थ में व्यक्त करना
  choice: योद्धा
  alternative: युद्ध का पुरुष; युद्धवीर
  rationale: ‘योद्धा’ पदबंध का सीधा मुहावरेदार अर्थ व्यक्त करता है और आधुनिक हिन्दी में स्वाभाविक है। यह परमेश्वर को युद्ध में लड़नेवाले के रूप में प्रस्तुत करने वाली मूल काव्यात्मक धार को नरम नहीं करता।
- issue: दूसरे खंड में नाम की बलाघातपूर्ण पहचान
  choice: याहवे ही उसका नाम है
  alternative: याहवे उसका नाम है; उसका नाम याहवे है
  rationale: मूल में יְהוָה पहले रखा गया है। ‘ही’ उस अग्रस्थ पहचान के बल को स्वाभाविक हिन्दी में व्यक्त करता है, बिना कोई नई पहचान जोड़े।
translation_notes:
  register: भाषा संक्षिप्त, काव्यात्मक और आधुनिक मानक हिन्दी की है। परमेश्वर के लिए मूल पाठ के एकवचन व्याकरण को बनाए रखते हुए ‘है/उसका’ प्रयुक्त हुआ है; ‘योद्धा’ सामान्य पाठक के लिए ‘युद्ध का पुरुष’ से अधिक स्वाभाविक है।
