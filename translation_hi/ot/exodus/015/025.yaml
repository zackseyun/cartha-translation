base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/025.yaml
  text: So he cried out to the LORD, and the LORD showed him a tree. He threw it into the water, and the water became sweet. There he made for them a statute and a judgment, and there he tested them.
translation:
  language: hi
  text: तब उसने यहोवा की दोहाई दी, और यहोवा ने उसे एक पेड़ दिखाया। उसने उस पेड़ को पानी में डाल दिया, और पानी मीठा हो गया। वहीं उसने उनके लिए एक विधि और एक नियम ठहराया, और वहीं उसने उनकी परीक्षा ली।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּצְעַק
  choice: दोहाई दी
  rationale: यह क्रिया संकट में सहायता के लिए ऊँचे स्वर से पुकारने का भाव रखती है; ‘दोहाई दी’ प्रसंग में स्वाभाविक और अर्थपूर्ण है।
- source_word: עֵץ
  choice: पेड़
  rationale: इब्रानी शब्द का सामान्य अर्थ ‘पेड़’ है; संदर्भ इसे केवल लकड़ी का टुकड़ा मानने के लिए बाध्य नहीं करता।
- source_word: וַיִּמְתְּקוּ הַמָּיִם
  choice: पानी मीठा हो गया
  rationale: ‘मीठा’ यहाँ कड़वे के विपरीत, पीने योग्य होने का संकेत देता है और मूल रूपक को बनाए रखता है।
- source_word: חֹק וּמִשְׁפָּט
  choice: एक विधि और एक नियम
  rationale: दोनों निकटवर्ती विधिक पदों का भेद बनाए रखा गया है; ‘विधि’ निर्धारित विधान और ‘नियम’ स्थापित न्यायिक मानक को सहज हिंदी में व्यक्त करता है।
- source_word: נִסָּהוּ
  choice: उनकी परीक्षा ली
  rationale: क्रिया का अर्थ जाँचना या परखना है; कर्मवाचक प्रत्यय सामूहिक इस्राएल को संदर्भित करता है।
theological_decisions:
- issue: שָׂם ... לֹו और נִסָּהוּ में कर्ता की अनिर्दिष्टता
  choice: ‘उसने’ रखा गया, निकटतम स्पष्ट कर्ता यहोवा समझते हुए
  alternative: स्पष्ट रूप से ‘यहोवा ने’ दोहराना
  rationale: इब्रानी में कर्ता सर्वनाम से निहित है। ‘उसने’ मूल की शैली और हल्की संदर्भगत अस्पष्टता को सुरक्षित रखता है, जबकि प्रसंग यहोवा की ओर संकेत करता है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण कथात्मक शैली अपनाई गई है। परमेश्वर के वाचा-नाम को प्रचलित हिंदी बाइबलीय रूप ‘यहोवा’ से व्यक्त किया गया है।
