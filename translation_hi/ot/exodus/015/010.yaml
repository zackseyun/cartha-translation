  yaml_path: translation/ot/exodus/015/010.yaml
  text: You blew with your wind; the sea covered them[a]. They sank like lead in mighty waters.
translation:
  language: hi
  text: तूने अपनी हवा चलाई; समुद्र ने उन्हें ढक लिया।[a] वे प्रचण्ड जलराशि में सीसे के समान डूब गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपनी साँस से।” इब्रानी शब्द का अर्थ “हवा,” “साँस,” या “आत्मा” हो सकता है; यहाँ समुद्र पार करने का प्रसंग “हवा” के पक्ष में है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשַׁפְתָּ
  choice: तूने ... फूँक मारी
  rationale: क्रिया נשׁף का अर्थ फूँकना या साँस छोड़ना है। समुद्र पर परमेश्वर की काव्यात्मक क्रिया के लिए यह स्वाभाविक और सीधा हिन्दी रूप है।
- source_word: בְרוּחֲךָ
  choice: अपनी हवा से
  rationale: רוּחַ के अर्थ हवा, साँस या आत्मा हो सकते हैं। समुद्र-पार करने के प्रसंग और 'फूँक मारी' क्रिया के साथ 'हवा' भौतिक चित्र को सबसे स्पष्ट रखती है; 'साँस' को पाद-टिप्पणी में सुरक्षित रखा गया है।
- source_word: כִּסָּמוֹ יָם
  choice: समुद्र ने उन्हें ढक लिया
  rationale: כסה का मूल अर्थ 'ढकना' है और बहुवचन कर्म-प्रत्यय मिस्रियों की ओर संकेत करता है। यह अनुवाद बिना अतिरिक्त व्याख्या के मूल चित्र बनाए रखता है।
- source_word: צָלֲלוּ
  choice: वे ... डूब गए
  rationale: यहाँ צלל जल में नीचे डूबने को व्यक्त करता है; सीसे की उपमा के साथ 'डूब गए' स्पष्ट और स्वाभाविक है।
- source_word: כָּעוֹפֶרֶת
  choice: सीसे के समान
  rationale: עוֹפֶרֶת धातु 'सीसा' है। यह रूप भार और तीव्रता से नीचे जाने की उपमा को सुरक्षित रखता है।
- source_word: בְּמַיִם אַדִּירִים
  choice: प्रचण्ड जलराशि में
  rationale: אַדִּירִים सामर्थ्य, प्रभाव और प्रचण्डता का भाव देता है। 'प्रचण्ड जलराशि' हिन्दी में काव्यात्मक, बोधगम्य और उफनते शक्तिशाली जल के अनुरूप है।
theological_decisions:
- issue: ईश्वरीय-काव्यात्मक प्रसंग में רוּחַ का अर्थ
  choice: हवा
  alternative: साँस; आत्मा
  rationale: समुद्र में मिस्र की पराजय का निकट प्रसंग और נשׁף ('फूँक मारी') के साथ इसका प्रयोग भौतिक हवा अथवा साँस की छवि को समर्थित करता है, न कि परमेश्वर के आत्मा का स्पष्ट उल्लेख। मुख्य पाठ में 'हवा' रखा गया है और 'साँस' की सम्भावना पाद-टिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक शैली अपनाई गई है। गीत के प्रत्यक्ष सम्बोधन को बनाए रखने के लिए परमेश्वर के लिए 'तूने/अपनी' प्रयोग किया गया है। 'प्रचण्ड जलराशि' मूल के बहुवचन और सामर्थ्यपूर्ण काव्य-भाव को स्वाभाविक हिन्दी में व्यक्त करती है।
