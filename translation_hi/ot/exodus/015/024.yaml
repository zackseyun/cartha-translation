  text: तब लोगों ने मूसा के विरुद्ध शिकायत की और कहा, “हम क्या पिएँ?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּלֹּנוּ
  choice: कुड़कुड़ाने लगे
  rationale: यह क्रिया जंगल के वृत्तांतों में किसी अगुवे के विरुद्ध सामूहिक असंतोष और शिकायत व्यक्त करती है। ‘कुड़कुड़ाने लगे’ आधुनिक हिन्दी में उस दबे हुए, नकारात्मक सामूहिक विरोध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הָעָם
  choice: लोग
  rationale: संज्ञा का सीधा अर्थ ‘लोग’ या ‘प्रजा’ है। ‘लोग’ सामान्य आधुनिक हिन्दी में स्वाभाविक है और तत्काल पाठ से आगे बढ़कर ‘इस्राएली’ नहीं जोड़ता।
- source_word: עַל
  choice: के विरुद्ध
  rationale: शिकायत करने की क्रिया के साथ यह पूर्वसर्ग शिकायत के लक्ष्य को विरोधात्मक रूप में दर्शाता है।
- source_word: מֹשֶׁה
  choice: मूसा
  rationale: व्यक्तिवाचक नाम का प्रचलित मानक हिन्दी बाइबलीय रूप।
- source_word: לֵאמֹר
  choice: और कहने लगे
  rationale: यह रचना प्रत्यक्ष कथन का परिचय देती है। हिन्दी में ‘और कहने लगे’ प्रवाहपूर्ण है तथा आरम्भिक क्रिया के प्रसंगगत पक्ष के अनुरूप है।
- source_word: מַה
  choice: क्या
  rationale: सरल प्रश्नवाचक सर्वनाम।
- source_word: נִשְׁתֶּה
  choice: हम क्या पिएँ
  rationale: शׁתה का प्रथम पुरुष बहुवचन अपूर्ण रूप तत्काल आवश्यकता और विचारात्मक प्रश्न व्यक्त करता है; ‘हम क्या पिएँ?’ इसे बिना अनावश्यक अर्थ जोड़े स्वाभाविक हिन्दी में रखता है।
