translation:
  language: hi
  text: तूने अपना दाहिना हाथ बढ़ाया; धरती ने उन्हें निगल लिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘भूमि ने उन्हें निगल लिया’ अथवा ‘ज़मीन ने उन्हें निगल लिया।’
    reason: lexical_alternative
lexical_decisions:
- source_word: נָטִיתָ
  choice: तूने ... बढ़ाया
  rationale: यह נטה का काल पूर्ण, द्वितीय पुरुष एकवचन रूप है और सीधे परमेश्वर को संबोधित करता है। ‘बढ़ाया’ ठोस क्रिया और काव्यात्मक चित्र दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יְמִינְךָ
  choice: अपना दाहिना हाथ
  rationale: मूल अभिव्यक्ति का शाब्दिक अर्थ ‘तेरा दाहिना हाथ’ है। यहाँ ‘अपना’ हिन्दी में कर्ता से संबंध स्पष्ट और स्वाभाविक करता है; शक्ति का संकेत निहित रहते हुए भी ठोस देहात्मक बिंब सुरक्षित है।
- source_word: תִּבְלָעֵמוֹ
  choice: ने उन्हें निगल लिया
  rationale: בלע का अर्थ ‘निगलना/समेट लेना’ है। स्त्रीलिंग एकवचन क्रिया का कर्ता आगे आने वाला ‘धरती’ है और प्रत्यय बहुवचन कर्म ‘उन्हें’ को सूचित करता है। ‘निगल लिया’ सजीव रूपक को बनाए रखता है।
- source_word: אָרֶץ
  choice: धरती
  rationale: אֶרֶץ के अर्थ ‘धरती’, ‘भूमि’ और ‘देश’ हो सकते हैं। इस काव्यात्मक प्रसंग में ‘धरती’ शत्रुओं के समा जाने का व्यापक और नाटकीय बिंब स्वाभाविक रूप से व्यक्त करती है।
theological_decisions:
- issue: परमेश्वर के कार्य के लिए मानव-देहात्मक भाषा
  choice: ‘अपना दाहिना हाथ’ के ठोस बिंब को बनाए रखना
  alternative: ‘अपनी शक्ति’ या ‘अपना सामर्थी हाथ’
  rationale: इब्रानी कविता परमेश्वर के सामर्थ्य को दाहिने हाथ के बिंब द्वारा व्यक्त करती है। इसे अमूर्त अर्थ में बदलने के बजाय मूल साहित्यिक और धर्मवैचारिक तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का संक्षिप्त, गरिमापूर्ण काव्यात्मक वाक्य। परमेश्वर को सीधे संबोधन के कारण ‘तूने’ रखा गया है, जो गीत के निकट और एकवचन संबोधन को दर्शाता है; शब्दावली सामान्य पाठक के लिए सहज है।
