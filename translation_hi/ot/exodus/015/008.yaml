base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/008.yaml
  text: At the blast of your nostrils the waters piled up[a]; the flowing waters stood like a heap[d][c][b]; the depths congealed in the heart of the sea.
translation:
  language: hi
  text: तेरे नथनों की फूँक से[a] जलराशियाँ ढेर लग गईं; बहते जल ढेर के समान[b] खड़े हो गए; गहरे जल जम गए[c]—समुद्र के हृदय में[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तेरे नथनों की साँस से।’
    reason: lexical_alternative
  - marker: b
    text: इब्रानी संज्ञा का अर्थ ‘ढेर’ है; समुद्र-पार करने के संबंधित वर्णनों को ध्यान में रखकर कुछ अनुवाद यहाँ ‘दीवार के समान’ कहते हैं।
    reason: lexical_alternative
  - marker: c
    text: या ‘गाढ़े हो गए।’ इब्रानी क्रिया गाढ़ा होने, जमने या थक्का बनने का भाव दे सकती है।
    reason: lexical_alternative
  - marker: d
    text: शाब्दिक रूप से ‘समुद्र के हृदय में’, अर्थात समुद्र के बीच में।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְרוּחַ אַפֶּיךָ
  choice: तेरे नथनों की फूँक से
  rationale: רוּחַ का अर्थ हवा, साँस या आत्मा हो सकता है; אַפֶּיךָ के साथ यहाँ परमेश्वर के नथनों से निकली शक्तिशाली साँस की सजीव काव्यात्मक छवि है। ‘फूँक’ इस बल को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: נֶעֶרְמוּ מַיִם
  choice: जल ढेर हो गया
  rationale: נֶעֶרְמוּ का अर्थ ढेर लगना या ढेर बन जाना है। हिन्दी में ‘जल’ व्याकरणतः एकवचन रूप में प्रयुक्त होकर सामूहिक अर्थ देता है।
- source_word: נִצְּבוּ
  choice: खड़ा हो गया
  rationale: क्रिया का मूल अर्थ खड़ा होना या स्थिर खड़े रहना है; यह बहते जल के असाधारण रूप से रुककर खड़े होने की काव्यात्मक छवि बनाए रखता है।
- source_word: כְמוֹ נֵד
  choice: ढेर के समान
  rationale: נֵד का सीधा अर्थ ढेर या संचित राशि है। ‘दीवार’ पारगमन-वृत्तांत की समानांतर छवि से संभव है, पर इस पद के शब्द का प्राथमिक अर्थ ‘ढेर’ है।
- source_word: נֹזְלִים
  choice: बहता जल
  rationale: यह נזל, ‘बहना’, से बना कृदन्त है। ‘बहता जल’ इसकी गतिशील विशेषता को बनाए रखता है और कोई नया संज्ञार्थ नहीं जोड़ता।
- source_word: קָפְאוּ
  choice: जम गए
  rationale: क्रिया गाढ़ा होने, जमने या दही के समान थक्का बनने का भाव दे सकती है। ‘जम गए’ सहज हिन्दी है, जबकि पादटिप्पणी व्यापक अर्थ-संभावना बताती है।
- source_word: תְהֹמֹת
  choice: गहरे जल
  rationale: बहुवचन संज्ञा समुद्र की गहराइयों अथवा अथाह गहरे जल को दर्शाती है। ‘गहरे जल’ सामान्य पाठक के लिए स्पष्ट और काव्यात्मक है।
- source_word: בְּלֶב יָם
  choice: समुद्र के हृदय में
  rationale: शाब्दिक रूप से ‘समुद्र के हृदय में’ है और मुहावरे के रूप में समुद्र के बीच को दर्शाता है। ‘हृदय’ रखने से मूल कविता की सजीवता बनी रहती है।
theological_decisions:
- issue: परमेश्वर का मानवरूपी काव्यात्मक चित्रण
  choice: ‘तेरे नथनों की फूँक’ की ठोस छवि को बनाए रखा गया है।
  alternative: इसे अमूर्त करके ‘तेरे क्रोध से’ कहना।
  rationale: इब्रानी पाठ परमेश्वर के सामर्थ्यपूर्ण हस्तक्षेप को देह-संबंधी काव्यात्मक भाषा में चित्रित करता है। इसे बनाए रखना पाठ की कविता और वास्तविक अस्पष्टता का सम्मान करता है; ‘क्रोध’ चुनना यहाँ अनावश्यक व्याख्यात्मक संकुचन होता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और गीतात्मक शैली रखी गई है। ‘तेरे’ मूल गीत के प्रत्यक्ष संबोधन को दर्शाता है। समानांतर पद-विन्यास और ठोस जल-छवियों को सुरक्षित रखा गया है।
