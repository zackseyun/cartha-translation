source:
  edition: WLC
  text: תְּבִאֵ֗/מוֹ וְ/תִטָּעֵ֨/מוֹ֙ בְּ/הַ֣ר נַחֲלָֽתְ/ךָ֔ מָכ֧וֹן לְ/שִׁבְתְּ/ךָ֛ פָּעַ֖לְתָּ יְהוָ֑ה מִקְּדָ֕שׁ אֲדֹנָ֖/י כּוֹנְנ֥וּ יָדֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/017.yaml
  text: You will bring them in and plant them on the mountain of your inheritance— the place[a], Yahweh, that you made for your dwelling, the sanctuary, Lord[c][b], that your hands established.
translation:
  language: hi
  text: तू उन्हें ले आएगा और अपनी विरासत के पर्वत[b] पर रोपेगा[a]—वह स्थान, हे याहवे, जिसे तूने अपने निवास के लिए बनाया है; वह पवित्र स्थान, हे प्रभु[c], जिसे तेरे हाथों ने स्थापित किया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उन्हें स्थापित करेगा।’ इब्रानी क्रिया का शाब्दिक अर्थ ‘रोपना’ है और यह सुरक्षित रूप से बसाए जाने का बिंब बनाए रखती है।
    reason: lexical_alternative
  - marker: b
    text: ‘अपनी विरासत के पर्वत’ से व्यापक रूप में वह देश अभिप्रेत हो सकता है जहाँ परमेश्वर अपने लोगों को बसाता है, या अधिक विशिष्ट रूप में परमेश्वर के पवित्र स्थान का पर्वत।
    reason: alternative_reading
  - marker: c
    text: इस पद के इब्रानी पाठ में ईश्वर का व्यक्तिगत नाम (यहाँ ‘याहवे’) और ‘प्रभु’ की उपाधि—दोनों आए हैं।
    reason: cultural_note
lexical_decisions:
- source_word: תְּבִאֵמוֹ
  choice: तू उन्हें ले आएगा
  rationale: בוא के हिफ़ील रूप में किसी को एक स्थान में लाने का कारक भाव है। हिंदी में ‘ले आएगा’ इस भाव और भावी काव्यात्मक कथन दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְתִטָּעֵמוֹ
  choice: और ... रोप देगा
  rationale: נטע का शाब्दिक अर्थ ‘रोपना’ है। यहाँ यह लोगों को सुरक्षित रूप से बसाने का रूपक है; ठोस काव्यात्मक बिंब बनाए रखने के लिए ‘स्थापित करेगा’ के बजाय ‘रोप देगा’ रखा गया है।
- source_word: בְּהַר נַחֲלָתְךָ
  choice: अपनी विरासत के पर्वत पर
  rationale: यह वाक्यांश उस पर्वत को परमेश्वर के अपने भाग या अधिकार के रूप में प्रस्तुत करता है। ‘अपनी विरासत के पर्वत पर’ संबंध को बनाए रखता है और उसके व्यापक अथवा विशिष्ट भौगोलिक संकेत को अनिर्णीत छोड़ता है।
- source_word: מָכוֹן לְשִׁבְתְּךָ
  choice: वह स्थान ... अपने निवास के लिए
  rationale: מָכוֹן किसी स्थिर या तैयार किए हुए स्थान को सूचित कर सकता है। ‘वह स्थान’ आधुनिक हिंदी में सहज है, जबकि आगे का वाक्य उसके प्रयोजन—परमेश्वर के निवास—को स्पष्ट करता है।
- source_word: פָּעַלְתָּ
  choice: जिसे तूने ... बनाया है
  rationale: פעל का व्यापक अर्थ करना या बनाना है। निवास के स्थान के संदर्भ में ‘बनाया है’ सीधा और स्वाभाविक है तथा ‘तैयार किया’ जैसी अधिक व्याख्यात्मक बारीकी नहीं जोड़ता।
- source_word: יְהוָה
  choice: याहवे
  rationale: व्यक्तिगत ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिंदी लिपि में लिप्यंतरित किया गया है।
- source_word: מִקְּדָשׁ
  choice: पवित्रस्थान
  rationale: מקדש का अर्थ पवित्र स्थान अथवा उपासना-स्थान है। ‘पवित्रस्थान’ संक्षिप्त, गरिमापूर्ण और संदर्भानुकूल है।
- source_word: אֲדֹנָי
  choice: प्रभु
  rationale: यहाँ אֲדֹנָי ईश्वर के लिए प्रयुक्त उपाधि है। ‘प्रभु’ इसे स्वाभाविक हिंदी में व्यक्त करता और इससे पहले आए व्यक्तिगत नाम ‘याहवे’ से भेद बनाए रखता है।
- source_word: כּוֹנְנוּ יָדֶיךָ
  choice: जिसे तेरे हाथों ने स्थापित किया है
  rationale: כון का यह रूप दृढ़ता से स्थापित करने का भाव देता है। ‘तेरे हाथों ने’ मूल मानवीकरण को और ‘स्थापित किया’ स्थिर नींव के भाव को बनाए रखता है।
theological_decisions:
- issue: एक ही पद में יְהוָה और אֲדֹנָי का अनुवाद
  choice: יְהוָה के लिए ‘याहवे’ और אֲדֹנָי के लिए ‘प्रभु’
  alternative: दोनों को ‘प्रभु’ कहना
  rationale: इब्रानी पाठ में व्यक्तिगत ईश्वरीय नाम और उपाधि दोनों अलग-अलग हैं। अलग हिंदी रूप इस पाठगत भेद को बिना अतिरिक्त धर्मवैधानिक अर्थ जोड़े सुरक्षित रखते हैं।
- issue: ‘अपनी विरासत के पर्वत’ और ‘पवित्रस्थान’ का भौगोलिक संकेत
  choice: काव्यात्मक संबंध को सुरक्षित रखते हुए सटीक स्थान अनिर्णीत रखना
  alternative: इसे स्पष्ट रूप से सिय्योन/मंदिर पर्वत या पूरे कनान देश के रूप में पहचानना
  rationale: पद व्यापक रूप से लोगों के प्रतिज्ञात निवास और अधिक विशिष्ट रूप से परमेश्वर के पवित्रस्थान—दोनों की ओर संकेत कर सकता है। अनुवाद मूल की संभावित व्यापकता को संकीर्ण नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण काव्यात्मक गद्य रखा गया है। परमेश्वर को संबोधन में एकवचन ‘तू/तेरे’ मूल इब्रानी के निकट और गीतात्मक शैली के अनुरूप है। ‘रोप देगा’ और ‘तेरे हाथों’ जैसे मूर्त बिंबों को सरल व्याख्यात्मक भाषा में समतल नहीं किया गया।
