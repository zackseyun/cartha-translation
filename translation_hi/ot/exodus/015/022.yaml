base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/022.yaml
  text: Then Moses led Israel on from the Sea of Reeds[a], and they went out into the wilderness of Shur. They went three days in the wilderness and found no water.
translation:
  language: hi
  text: तब मूसा इस्राएल को सरकंडों के समुद्र[a] से आगे ले गया, और वे शूर के वीराने में निकल गए। वे वीराने में तीन दिन तक चलते रहे, पर उन्हें पानी नहीं मिला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: परंपरागत अनुवाद ‘लाल समुद्र’ है; हिब्रू में ‘सरकंडों का समुद्र।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּסַּע
  choice: आगे ले गया
  rationale: 'हिफ़ील रूप का प्रेरणार्थक भाव व्यक्त करता है: मूसा ने इस्राएल को वहाँ से आगे बढ़ाया। यह हिंदी में स्वाभाविक है और केवल ‘चल पड़ा’ से अधिक सटीक है।'
- source_word: מִיַּם סוּף
  choice: सरकंडों के समुद्र
  rationale: हिब्रू יַם־סוּף का सीधा अर्थ ‘सरकंडों का समुद्र’ है; पारंपरिक ‘लाल समुद्र’ को पादटिप्पणी में रखा गया है।
- source_word: מִדְבַּר שׁוּר
  choice: शूर का वीराना
  rationale: מִדְבָּר निर्जन, अनाबादी भूभाग को दर्शाता है और अनिवार्यतः रेतीले मरुस्थल का अर्थ नहीं देता। ‘वीराना’ आधुनिक हिंदी में इस व्यापक अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וַיֵּצְאוּ
  choice: निकल गए
  rationale: יצא का सामान्य अर्थ ‘निकलना’ है; यहाँ समुद्र के क्षेत्र से शूर के वीराने की ओर गति के अनुकूल है।
- source_word: שְׁלֹשֶׁת יָמִים
  choice: तीन दिन तक
  rationale: यह अवधि सूचक कर्मकारक है। ‘तीन दिन तक’ हिंदी में अवधि को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: בַּמִּדְבָּר
  choice: वीराने में
  rationale: בְּ का मूल स्थानवाचक अर्थ ‘में’ रखा गया है; ‘से होकर’ जैसी अतिरिक्त दिशात्मक व्याख्या नहीं जोड़ी गई।
- source_word: וְלֹא מָצְאוּ מָיִם
  choice: पर उन्हें पानी नहीं मिला
  rationale: हिंदी में ‘पानी नहीं मिला’ ‘उन्होंने पानी नहीं पाया’ की अपेक्षा अधिक स्वाभाविक है और मूल अर्थ को सुरक्षित रखता है।
