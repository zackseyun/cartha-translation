source:
  edition: WLC
  text: וַ/יָּבֹ֗אוּ שֹֽׁטְרֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יִּצְעֲק֥וּ אֶל פַּרְעֹ֖ה לֵ/אמֹ֑ר לָ֧/מָּה תַעֲשֶׂ֦ה כֹ֖ה לַ/עֲבָדֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/015.yaml
  text: Then the officers of the sons of Israel came and cried out to Pharaoh[a], saying[c][b], “Why do you do this to your servants?”
translation:
  language: hi
  text: तब इस्राएलियों के अधिकारी आए और फ़िरौन से दुहाई देकर बोले, “आप अपने सेवकों के साथ ऐसा क्यों कर रहे हैं?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आप अपने दासों के साथ ऐसा क्यों कर रहे हैं?”
    reason: עבד का अर्थ प्रसंग के अनुसार ‘दास’ हो सकता है; यहाँ बोलने वाले फ़िरौन को विनयपूर्वक स्वयं को उसके ‘सेवक’ भी कहते हैं।
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: तब ... आए
  rationale: वय्यिक्तोल कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में क्रमिकता व्यक्त करता है।
- source_word: שֹׁטְרֵי
  choice: नायब
  rationale: यहाँ यह शब्द मिस्री अधिकारियों के अधीन काम करने वाले इस्राएली अधीनस्थ श्रम-प्रबंधकों को दर्शाता है। ‘नायब’ उनकी प्रतिनिधिक और अधीनस्थ प्रशासनिक भूमिका को संक्षेप में व्यक्त करता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: शाब्दिक अर्थ ‘इस्राएल के पुत्र’ है, पर इस प्रसंग में यह समुदाय का जातीय नाम है; आधुनिक हिन्दी में ‘इस्राएलियों’ अधिक स्वाभाविक और समावेशी है।
- source_word: וַיִּצְעֲקוּ אֶל־פַּרְעֹה
  choice: फ़िरौन के सामने दुहाई देकर बोले
  rationale: צעק एक तीव्र पुकार या न्याय की याचना दर्शाता है। ‘दुहाई देकर’ शिकायत और विनती, दोनों की तात्कालिकता रखता है; אֶל दिशा को ‘के सामने’ के रूप में स्वाभाविक दरबारी प्रसंग में व्यक्त किया गया है।
- source_word: לֵאמֹר
  choice: बोले
  rationale: मानक वाणी-परिचायक को हिन्दी में अनावश्यक ‘यह कहते हुए’ के बजाय सहज प्रत्यक्ष-वचन क्रिया से व्यक्त किया गया है।
- source_word: לָמָּה תַעֲשֶׂה כֹה
  choice: तू ... ऐसा क्यों कर रहा है
  rationale: मूल का निकट अर्थ ‘तू ऐसा क्यों करता है’ है। वर्तमान प्रसंग में जारी व्यवहार के लिए ‘कर रहा है’ स्वाभाविक है और כֹה की खुली संदर्भात्मकता बनाए रखता है।
- source_word: לַעֲבָדֶיךָ
  choice: अपने दासों के साथ
  rationale: עבד में ‘दास’ और विनम्र दरबारी अर्थ में ‘सेवक’ दोनों संभव हैं। फ़िरौन के अधीन बाध्य श्रम की वास्तविकता के कारण ‘दास’ उपयुक्त है, जबकि आत्म-संदर्भ की विनम्रता भी बनी रहती है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘फ़िरौन’ के लिए आदरसूचक बहुवचन नहीं अपनाया गया, क्योंकि मूल इब्रानी में संबोधन एकवचन है। ‘नायब’ प्रशासनिक अधीनस्थ की भूमिका दर्शाता है, यद्यपि ‘बेगार के मुखिया’ अधिक व्याख्यात्मक विकल्प हो सकता है।
