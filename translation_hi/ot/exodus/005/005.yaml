  yaml_path: translation/ot/exodus/005/005.yaml
  text: Pharaoh said[a], “Look, the people of the land are now many, and you are making them rest from their burdens.”
translation:
  language: hi
  text: फिरौन ने कहा, “देखो, देश के लोग अब बहुत हो गए हैं, और तुम उन्हें उनके बोझों से विराम दिला रहे हो।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम उन्हें उनके बोझों से काम बंद करा रहे हो।” इब्रानी क्रिया कारक है; इसका अर्थ उन्हें काम से रुकवाना, उनके काम को बंद कराना, या उनके बोझों से विराम दिलाना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: देखो
  rationale: यह फिरौन की बलपूर्ण टिप्पणी का परिचय देता है; ‘देखो’ आधुनिक हिन्दी में विस्मयात्मक और ध्यान खींचने वाला भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: רַבִּים
  choice: बहुत हो गए हैं
  rationale: बहुसंख्या का भाव व्यक्त करता है और सन्दर्भ में जनसंख्या बढ़ने की फिरौन की शिकायत को स्वाभाविक हिन्दी में प्रस्तुत करता है।
- source_word: עַם הָאָרֶץ
  choice: देश के लोग
  rationale: इब्रानी पदबंध ‘देश के लोग’ का निकट रूप है; इसे केवल ‘लोग’ या व्याख्यात्मक ‘मजदूर वर्ग’ नहीं बनाया गया।
- source_word: עַתָּה
  choice: अब
  rationale: वर्तमान परिस्थिति पर फिरौन के जोर को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְהִשְׁבַּתֶּם
  choice: छुड़ाकर विश्राम करा रहे हो
  rationale: שׁבת के हिफ़ील रूप का कारक भाव—काम रुकवाना अथवा विश्राम कराना—स्पष्ट करता है। ‘छुड़ाकर’ अगले מן-वाक्यांश के साथ स्वाभाविक हिन्दी बनाता है, जबकि ‘विश्राम करा रहे हो’ मूल धातु की अर्थछाया बनाए रखता है।
- source_word: מִסִּבְלֹתָם
  choice: उनके बोझ के काम से
  rationale: סִבְלֹתָם के वास्तविक बोझ तथा कठोर श्रम दोनों पहलुओं को व्यक्त करता है; केवल ‘बोझों’ की अपेक्षा हिन्दी में श्रम-सन्दर्भ अधिक स्पष्ट है।
