  edition: WLC
  text: וְ/אַחַ֗ר בָּ֚אוּ מֹשֶׁ֣ה וְ/אַהֲרֹ֔ן וַ/יֹּאמְר֖וּ אֶל פַּרְעֹ֑ה כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל שַׁלַּח֙ אֶת עַמִּ֔/י וְ/יָחֹ֥גּוּ לִ֖/י בַּ/מִּדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/001.yaml
  text: 'Afterward Moses and Aaron went in and said to Pharaoh[a], “Thus says Yahweh, the God of Israel: Let my people go[b], so that they may hold a feast to me in the wilderness.”'
translation:
  language: hi
  text: 'इसके बाद मूसा और हारून फ़िरौन के पास गए और उससे कहा, “याहवे[a], इस्राएल का परमेश्वर, यह कहता है: ‘मेरी प्रजा को जाने दे, ताकि वे निर्जन प्रदेश में मेरे लिए पर्व मनाएँ[b]।’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: ‘YHWH’; इसका लिप्यंतरण ‘याहवे’ भी किया जाता है।'
    reason: alternative_reading
  - marker: b
    text: या, ‘मेरे लिए उत्सव मनाएँ’ अथवा ‘मेरे लिए पर्व का पालन करें’; इब्रानी क्रिया धार्मिक पर्व/उत्सव मनाने का संकेत करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחַר
  choice: इसके बाद
  rationale: यह अगले घटनाक्रम को बताने वाला स्वाभाविक काल-सूचक वाक्यांश है और समयांतराल को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: בָּאוּ
  choice: के पास गए
  rationale: संदर्भ में मूसा और हारून फ़िरौन की राजकीय उपस्थिति में प्रवेश करते हैं; आधुनिक हिन्दी में ‘फ़िरौन के पास गए’ सहज और पर्याप्त स्पष्ट है।
- source_word: כֹּה אָמַר
  choice: यह कहता है
  rationale: यह अधिकारपूर्ण दूत-वचन सूत्र को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबल परंपरा में प्रचलित लिप्यंतरण व्यक्तिगत ईश्वरीय नाम को किसी उपाधि से प्रतिस्थापित नहीं करता।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल का परमेश्वर
  rationale: इब्रानी संबंधवाचक पदबंध का सीधा, स्पष्ट और प्रतिष्ठित हिन्दी रूप।
- source_word: שַׁלַּח אֶת־עַמִּי
  choice: मेरी प्रजा को जाने दे
  rationale: आज्ञार्थक क्रिया यहाँ फ़िरौन से इस्राएल को मुक्त होकर जाने देने की माँग करती है; यह रूप बल और स्वाभाविकता दोनों बनाए रखता है।
- source_word: וְיָחֹגּוּ לִי
  choice: ताकि वे मेरे लिए पर्व मनाएँ
  rationale: חגג किसी धार्मिक पर्व या उत्सव के विधिवत पालन को सूचित करता है; ‘पर्व मनाएँ’ सामान्य पाठक के लिए स्पष्ट है।
- source_word: בַּמִּדְבָּר
  choice: निर्जन प्रदेश में
  rationale: מִדְבָּר आवश्यकतः रेतीला मरुस्थल नहीं, बल्कि अनाबाद अथवा विरल आबादी वाला क्षेत्र है; ‘निर्जन प्रदेश’ इस व्यापक अर्थ को व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में ईश्वर का व्यक्तिगत नाम है, इसलिए ‘प्रभु’ जैसी उपाधि से बदलने के बजाय उसका हिन्दी में परिचित लिप्यंतरण रखा गया है।
- issue: וְיָחֹגּוּ לִי का धार्मिक आशय
  choice: मेरे लिए पर्व मनाएँ
  alternative: मेरे लिए उत्सव मनाएँ
  rationale: क्रिया विशेष रूप से धार्मिक पर्व के पालन को दर्शाती है; अनुवाद इसे केवल सामान्य उपासना या आनंदोत्सव नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण रखी गई है। प्रत्यक्ष वचन के भीतर ईश्वरीय आदेश को एकल उद्धरण-चिह्नों से अलग दिखाया गया है। ‘प्रजा’ राजकीय संदर्भ और सामूहिक पहचान दोनों के अनुकूल है।
