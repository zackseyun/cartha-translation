  text: 'तब फ़िरौन ने उसी दिन लोगों से बेगार करवानेवालों और उसके अधिकारियों[a] को आदेश दिया:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके कार्य-पर्यवेक्षकों।” मूल भाषा का शब्द श्रम-व्यवस्था में अधीनस्थ अधिकारियों के लिए प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: आज्ञा दी
  rationale: क्रिया צוה के अधिकारपूर्ण आदेश और कथात्मक भूतकाल को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: פַּרְעֹה
  choice: फ़िरौन
  rationale: मिस्र के शासक की उपाधि का हिन्दी में प्रचलित बाइबलीय रूप।
- source_word: בַּיּוֹם הַהוּא
  choice: उसी दिन
  rationale: शाब्दिक अर्थ 'उस दिन' है; प्रसंग में उसी दिन तत्काल दिए गए आदेश पर बल है, जिसे हिन्दी में 'उसी दिन' स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַנֹּגְשִׂים בָּעָם
  choice: प्रजा से बेगार करवानेवाले
  rationale: נגשׂים श्रम वसूलने अथवा लोगों से कठोर काम करवानेवालों को दर्शाता है। בָּעָם उनके प्रजा से संबंध को बताता है; यह रूप उनकी भूमिका स्पष्ट करता है, पर उन्हें स्वयं इस्राएली नहीं ठहराता।
- source_word: שֹׁטְרָיו
  choice: अपने अधीन अधिकारी
  rationale: שֹׁטְרִים श्रम-व्यवस्था के अधीनस्थ प्रशासकीय अधिकारियों को दर्शाता है। 'अधीन अधिकारी' पद की व्यापकता बनाए रखता है; 'मुंशी' या 'सरदार' भूमिका को अनावश्यक रूप से संकीर्ण कर सकते हैं।
- source_word: לֵאמֹר
  choice: 'यह आज्ञा दी:'
  rationale: हिब्रू का मानक वचन-परिचय सूत्र है। हिन्दी में अगले पद के प्रत्यक्ष कथन को सहज ढंग से आरम्भ करने के लिए क्रिया के साथ समाहित कर द्विबिंदु लगाया गया है।
