  yaml_path: translation/ot/exodus/005/004.yaml
  text: But the king of Egypt said to them[a], “Why, Moses and Aaron[b], are you causing the people to neglect their work? Go to your burdens.”
translation:
  language: hi
  text: परन्तु मिस्र के राजा ने उनसे कहा, “मूसा और हारून, तुम लोगों को उनके काम से क्यों रोक रहे हो?[a] जाओ, अपने बोझ-भरे काम पर जाओ[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “लोगों को उनके काम से क्यों भटका रहे हो?”
    reason: lexical_alternative
  - marker: b
    text: या, “अपने बेगार के काम पर जाओ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: परन्तु ... ने कहा
  rationale: वाव-क्रम कथानक को आगे बढ़ाता है; पिछले पद में मूसा और हारून की माँग के प्रति राजा के विरोधपूर्ण उत्तर को स्वाभाविक हिन्दी में दिखाने के लिए ‘परन्तु’ उपयुक्त है।
- source_word: מֶלֶךְ מִצְרַיִם
  choice: मिस्र के राजा
  rationale: इब्रानी संबंध-वाचक संरचना का स्पष्ट और स्वाभाविक हिन्दी रूप।
- source_word: לָמָּה
  choice: क्यों
  rationale: सीधे प्रश्न को सरल, स्वाभाविक रूप में बनाए रखता है।
- source_word: תַּפְרִיעוּ
  choice: रोक रहे हो
  rationale: यहाँ हिफ़ील रूप लोगों को उनके काम से हटाने या उनका काम रुकवाने का आरोप व्यक्त करता है; ‘रोक रहे हो’ इस कारक अर्थ और फ़िरौन के आरोप दोनों को सहज हिन्दी में रखता है।
- source_word: הָעָם
  choice: इन लोगों
  rationale: मूल पाठ का व्यापक सामूहिक पद ‘लोग’ बनाए रखा गया है; ‘इन’ प्रसंग में सामने उल्लिखित इस्राएली लोगों को स्वाभाविक रूप से सूचित करता है।
- source_word: מִמַּעֲשָׂיו
  choice: उनके काम से
  rationale: एकवचन सामूहिक संज्ञा ‘लोग’ के साथ लगा एकवचन प्रत्यय हिन्दी में अर्थानुसार बहुवचन ‘उनके’ से स्वाभाविक रूप में व्यक्त होता है।
- source_word: לְכוּ
  choice: जाओ
  rationale: आज्ञार्थक क्रिया का सीधा और स्वाभाविक अनुवाद।
- source_word: לְסִבְלֹתֵיכֶם
  choice: अपने बोझ ढोने के काम पर लगो
  rationale: סבלות में भार तथा कठिन श्रम, दोनों का भाव है। यह रूप ठोस ‘बोझ’ की छवि और श्रम-दायित्व को बनाए रखते हुए हिन्दी में आज्ञा का आशय स्पष्ट करता है।
