translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज और मौखिक संवाद के अनुकूल रूप अपनाया गया है। ‘बोझ ढोने का काम’ मूल की ठोस छवि बचाता है, जबकि पादटिप्पणी प्रसंगानुसार ‘बेगार’ की वैकल्पिक व्याख्या देती है।
