source:
  edition: WLC
  text: וּ/מֵ/אָ֞ז בָּ֤אתִי אֶל פַּרְעֹה֙ לְ/דַבֵּ֣ר בִּ/שְׁמֶ֔/ךָ הֵרַ֖ע לָ/עָ֣ם הַ/זֶּ֑ה וְ/הַצֵּ֥ל לֹא הִצַּ֖לְתָּ אֶת עַמֶּֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/023.yaml
  text: For since I came to Pharaoh to speak in your name[a], he has done evil to this people[c][b], and you have certainly not delivered your people.
translation:
  language: hi
  text: क्योंकि जब से मैं आपके नाम से[a] फ़िरौन से बात करने गया, तब से उसने इस प्रजा के साथ बुरा किया है[b], और आपने अपनी प्रजा को तनिक भी नहीं छुड़ाया है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् आपके प्रतिनिधि और अधिकार के साथ।
    reason: idiom_clarification
  - marker: b
    text: या “इस प्रजा की दशा और बिगाड़ दी है।”
    reason: lexical_alternative
  - marker: c
    text: 'इब्रानी में एक ही धातु के क्रियारूप की पुनरावृत्ति निषेध पर बल देती है: “आपने बिलकुल भी नहीं छुड़ाया।”'
    reason: source_form
lexical_decisions:
- source_word: וּמֵאָז
  choice: क्योंकि जब से ... तब से
  rationale: מֵאָז का समय-सूचक अर्थ ‘जब से/उस समय से’ है। आरंभिक וּ को प्रसंग में मूसा की पिछली शिकायत का कारण बताते हुए ‘क्योंकि’ से व्यक्त किया गया है; हिंदी में ‘जब से...तब से’ स्वाभाविक है।
- source_word: בָּאתִי אֶל־פַּרְעֹה
  choice: मैं ... फ़िरौन से बात करने गया हूँ
  rationale: בוא मूलतः ‘आना/जाना’ है; वक्ता के वर्तमान स्थान से फ़िरौन की ओर जाने के प्रसंग में हिंदी ‘गया हूँ’ अधिक स्वाभाविक है, जबकि पूर्ण क्रिया का वर्तमान परिणाम भी बना रहता है।
- source_word: לְדַבֵּר בִּשְׁמֶךָ
  choice: आपके नाम से ... बात करने
  rationale: לְדַבֵּר उद्देश्य बताता है और בִּשְׁמֶךָ का शाब्दिक मुहावरा ‘आपके नाम से’ प्रतिनिधित्व तथा अधिकार दोनों का भाव सुरक्षित रखता है।
- source_word: הֵרַע לָעָם הַזֶּה
  choice: उसने इस प्रजा के साथ बुरा किया है
  rationale: רעע के हिफ़ील रूप में बुराई करने, हानि पहुँचाने या दशा बिगाड़ने का अर्थ संभव है। ‘बुरा किया है’ नैतिक और हानिकारक दोनों आयामों को रखता है।
- source_word: וְהַצֵּל לֹא הִצַּלְתָּ
  choice: और आपने ... तनिक भी नहीं छुड़ाया है
  rationale: समान धातु के infinitive absolute और finite verb का मेल निषेध पर बल देता है। ‘तनिक भी नहीं’ इस तीव्रता को सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: אֶת־עַמֶּךָ
  choice: अपनी प्रजा को
  rationale: प्रत्यक्ष कर्म ‘आपकी प्रजा’ को हिंदी में कर्ता-सापेक्ष स्वाभाविक रूप ‘अपनी प्रजा को’ कहा गया है।
theological_decisions:
- issue: मूसा की शिकायत में उद्धार के निषेध की तीव्रता
  choice: आपने अपनी प्रजा को तनिक भी नहीं छुड़ाया है
  alternative: आपने अपनी प्रजा को निश्चय ही नहीं छुड़ाया है
  rationale: इब्रानी infinitive absolute निषेध को तीव्र करता है। ‘तनिक भी नहीं’ मूसा की साहसपूर्ण शिकायत को स्पष्ट करता है और यह नहीं कहता कि भविष्य में छुटकारा असंभव है।
- issue: בִּשְׁמֶךָ में परमेश्वर के नाम का भाव
  choice: आपके नाम से
  alternative: आपके अधिकार से / आपकी ओर से
  rationale: शाब्दिक मुहावरा आधुनिक हिंदी में समझने योग्य है और परमेश्वर के प्रतिनिधित्व तथा अधिकार से बोलने का धार्मिक भार सुरक्षित रखता है।
- issue: הֵרַע की नैतिक और परिस्थितिजन्य अस्पष्टता
  choice: इस प्रजा के साथ बुरा किया है
  alternative: इस प्रजा की दशा और बिगाड़ दी है
  rationale: मूल क्रिया बुराई/हानि और दशा बिगाड़ने दोनों अर्थ दे सकती है। मुख्य पाठ नैतिक आरोप को बनाए रखता है और वैकल्पिक परिस्थितिजन्य अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आदरपूर्ण संबोधन के लिए ‘आप’ रखा गया है। भाषा आधुनिक, सहज और गरिमापूर्ण है। ‘प्रजा’ मिस्र के अधीन सामुदायिक स्थिति और ‘छुड़ाया’ निर्गमन के उद्धार-विषय को स्वाभाविक हिंदी में व्यक्त करते हैं।
