  text: וַ/יֹּ֣אמֶר פַּרְעֹ֔ה מִ֤י יְהוָה֙ אֲשֶׁ֣ר אֶשְׁמַ֣ע בְּ/קֹל֔/וֹ לְ/שַׁלַּ֖ח אֶת יִשְׂרָאֵ֑ל לֹ֤א יָדַ֨עְתִּי֙ אֶת יְהוָ֔ה וְ/גַ֥ם אֶת יִשְׂרָאֵ֖ל לֹ֥א אֲשַׁלֵּֽחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/002.yaml
  text: Pharaoh said[a], “Who is Yahweh, that I should obey his voice and let Israel go? I do not know Yahweh, and moreover I will not let Israel go.”
translation:
  language: hi
  text: फ़िरौन ने कहा, “याहवे[a] कौन है कि मैं उसकी बात मानूँ और इस्राएल को जाने दूँ? मैं याहवे को नहीं जानता, और इस्राएल को भी जाने नहीं दूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: ‘YHWH’; परंपरागत रूप से ‘प्रभु’ के रूप में अनूदित। ‘यहोवा’ इसका एक वैकल्पिक रूप है।'
    reason: ईश्वरीय नाम के परंपरागत प्रतिस्थापन और वैकल्पिक उच्चारण को स्पष्ट करने के लिए।
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम YHWH को किसी उपाधि से बदलने के बजाय उसके प्रचलित विद्वत्तापूर्ण उच्चारण के निकट देवनागरी में लिखा गया है।
- source_word: מִי
  choice: कौन
  rationale: यह पहचान पूछने वाला प्रश्नवाचक सर्वनाम है; प्रसंग में फ़िरौन की तिरस्कारपूर्ण चुनौती भी बनी रहती है।
- source_word: אֲשֶׁר אֶשְׁמַע בְּקֹלוֹ
  choice: कि मैं उसकी बात मानूँ
  rationale: שׁמע בְּקוֹל का अर्थ केवल सुनना नहीं, बल्कि किसी की बात मानना या आज्ञा का पालन करना है। यह हिंदी प्रयोग अर्थ और इब्रानी वाक्य की चुनौतीपूर्ण शैली दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְשַׁלַּח
  choice: जाने दूँ
  rationale: निर्गमन के प्रसंग में שׁלח का इस्राएल के साथ स्वाभाविक अर्थ उसे जाने देना है।
- source_word: יָדַעְתִּי
  choice: मैं ... नहीं जानता
  rationale: पूर्ण क्रिया यहाँ फ़िरौन की वर्तमान स्थिति और दावे को व्यक्त करती है। यह अनुवाद जान-पहचान न होने और अधिकार न मानने—दोनों संभावित भावों को अनावश्यक रूप से सीमित नहीं करता।
- source_word: וְגַם
  choice: और ... भी
  rationale: यह आगे जोड़े गए बलपूर्ण निषेध को सहज हिंदी में व्यक्त करता है।
- source_word: אֲשַׁלֵּחַ
  choice: जाने नहीं दूँगा
  rationale: अपूर्ण क्रिया यहाँ फ़िरौन के दृढ़ भावी निश्चय को व्यक्त करती है और पहले प्रयुक्त क्रिया से संगति रखती है।
- source_word: פַּרְעֹה
  choice: फ़िरौन
  rationale: मिस्र के राजा की उपाधि का मानक आधुनिक हिंदी रूप।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: जनसमुदाय के नाम का प्रचलित हिंदी बाइबलीय रूप।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पद में व्यक्तिगत ईश्वरीय नाम YHWH सीधे आया है। ‘याहवे’ नाम को सुरक्षित रखता है; ‘प्रभु’ उसे उपाधि से बदल देता, जबकि ‘यहोवा’ एक वैकल्पिक पारंपरिक उच्चारण है।
- issue: फ़िरौन के ‘न जानने’ का आशय
  choice: मैं याहवे को नहीं जानता
  alternative: मैं याहवे को नहीं मानता
  rationale: יָדַעְתִּי का सीधा अर्थ ‘जानना’ है। ‘नहीं जानता’ रखने से जानकारी के अभाव और अधिकार को स्वीकार न करने के बीच मूल की अर्थगत तनातनी बनी रहती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘उसकी बात मानूँ’ आज्ञापालन का भाव स्वाभाविक हिंदी में देता है, और फ़िरौन की चुनौती तथा दृढ़ अस्वीकार की तीक्ष्णता सुरक्षित रहती है।
