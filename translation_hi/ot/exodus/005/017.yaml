lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: पर उसने कहा
  rationale: वाव-क्रमबोधक कथा को आगे बढ़ाता है, जबकि प्रसंग में फ़िरौन का उत्तर विरोधात्मक है; इसलिए ‘पर’ स्वाभाविक है।
- source_word: נִרְפִּים אַתֶּם נִרְפִּים
  choice: तुम आलसी हो, आलसी!
  rationale: नִרְפִּים यहाँ कामचोरी या ढिलाई का आरोप है। शब्द की पुनरावृत्ति मूल के जोर और कटुता को बनाए रखती है।
- source_word: עַל כֵּן
  choice: इसीलिए
  rationale: यह फ़िरौन द्वारा प्रस्तुत कारणात्मक निष्कर्ष को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֹמְרִים
  choice: तुम कहते हो
  rationale: इब्रानी कृदंत यहाँ वर्तमानकालीन सीमित क्रिया के रूप में प्रयुक्त है।
- source_word: נֵלְכָה נִזְבְּחָה
  choice: चलो, हम जाएँ और ... बलिदान चढ़ाएँ
  rationale: दोनों प्रथम पुरुष बहुवचन cohortative रूप प्रस्ताव या आग्रह व्यक्त करते हैं; हिन्दी में ‘चलो, हम ...’ इस भाव को सहज रूप से रखता है।
- source_word: לַיהוָה
  choice: याहवे को
  rationale: लְ बलिदान के प्राप्तकर्ता को दर्शाता है। परमेश्वर के व्यक्तिगत वाचा-नाम יהוה को ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चार-अक्षरीय व्यक्तिगत नाम स्पष्ट रूप से है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं करता।
