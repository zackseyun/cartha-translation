  rationale: व्यक्तिवाचक वाचा-नाम יהוה को हिन्दी में प्रचलित प्रतिलेखन ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: פֶּן
  choice: नहीं तो
  rationale: चेतावनी और आशंकित परिणाम का भाव आधुनिक, सहज हिन्दी में व्यक्त करता है।
- source_word: יִפְגָּעֵנוּ
  choice: वह हम पर ... प्रहार करेगा
  rationale: इस न्याय-संदर्भ में פגע का प्रतिकूल, दंडात्मक बल व्यक्त होता है; ‘प्रहार करेगा’ महामारी और तलवार दोनों के साथ बैठता है।
- source_word: בַּדֶּבֶר אֹו בֶחָרֶב
  choice: महामारी या तलवार से
  rationale: דֶּבֶר को सुलभ आधुनिक शब्द ‘महामारी’ और दोनों בְּ को साधनवाचक ‘से’ द्वारा व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल में वाचा-नाम प्रत्यक्ष है। हिन्दी पाठकों के बीच स्थापित व्यक्तिवाचक रूप ‘यहोवा’ नाम के रूप को सुरक्षित रखता है और इसे उपाधि ‘प्रभु’ में नहीं बदलता।
- issue: נִקְרָא עָלֵינוּ में ईश्वरीय भेंट या बुलाहट
  choice: हमसे मिला है
  alternative: हमें बुलाया है
  rationale: व्याकरण और प्रसंग भेंट/सामना तथा बुलाहट दोनों की संभावना देते हैं। मुख्य पाठ में प्रसंगानुकूल ‘मिला’ रखा गया है और अस्पष्टता पाद-टिप्पणी में सुरक्षित है।
- issue: संभावित दंड का कर्ता
  choice: वह
  alternative: अनुल्लिखित कर्ता
  rationale: इब्रानी क्रिया पुल्लिंग एकवचन है और निकटतम संदर्भ में परमेश्वर को सूचित करती है; हिन्दी में स्पष्ट कर्ता आवश्यक होने से ‘वह’ रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। ‘तब उन्होंने कहा’ कथात्मक प्रवाह के लिए, ‘कृपया’ विनम्र निवेदन के लिए और ‘नहीं तो’ चेतावनी के सहज आधुनिक रूप के लिए चुना गया है। पाद-टिप्पणी चिह्न [a] मुख्य पाठ में उपस्थित है।
