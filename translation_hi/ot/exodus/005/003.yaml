  yaml_path: translation/ot/exodus/005/003.yaml
  text: And they said[a], “The God of the Hebrews has met with us. Please let us go a journey of three days into the wilderness, so that we may sacrifice to Yahweh our God, lest he strike us with plague or with the sword.”
translation:
  language: hi
  text: उन्होंने कहा, “इब्रानियों का परमेश्वर हमसे मिला है[a]। कृपया हमें जंगल में तीन दिन की यात्रा पर जाने दें, ताकि हम अपने परमेश्वर यहोवा को बलिदान चढ़ाएँ; नहीं तो वह महामारी या तलवार से हम पर प्रहार करेगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हमें बुलाया है।” इब्रानी पद का अर्थ यह हो सकता है कि परमेश्वर उनसे मिला है या उसने उन्हें बुलाया है।
    reason: lexical_alternative
