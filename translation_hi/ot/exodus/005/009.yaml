lexical_decisions:
- source_word: תִּכְבַּד
  choice: भारी बोझ डाल दो
  rationale: क्रिया का मूल अर्थ ‘भारी होना’ है; आदेश के प्रसंग में यह हिन्दी अभिव्यक्ति काम का भार उन पर भारी किए जाने का आशय स्वाभाविक रूप से व्यक्त करती है।
- source_word: הָעֲבֹדָה
  choice: काम
  rationale: यहाँ शब्द ईंट बनाने के बेगार के काम को सूचित करता है; ‘काम’ सरल और प्रसंगानुकूल है।
- source_word: הָאֲנָשִׁים
  choice: आदमियों
  rationale: इब्रानी में पुरुषवाचक संज्ञा है और प्रसंग इस्राएली पुरुष मज़दूरों का है, इसलिए इसे सामान्यीकृत करके ‘लोगों’ नहीं किया गया।
- source_word: וְיַעֲשׂוּ בָהּ
  choice: ताकि वे उसी में मेहनत करते रहें
  rationale: शाब्दिक भाव ‘वे उसमें/उस पर काम करें’ है। ‘उसी में मेहनत करते रहें’ उद्देश्य और निरंतर व्यस्त रहने के प्रसंगगत भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יִשְׁעוּ
  choice: ध्यान न दें
  rationale: שעה का अर्थ किसी बात की ओर देखना, उसका ध्यान करना या उसे मानना हो सकता है। मुख्य पाठ में आधुनिक और स्पष्ट ‘ध्यान न दें’ रखा गया है तथा विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: בְּדִבְרֵי שָׁקֶר
  choice: झूठी बातों पर
  rationale: דִּבְרֵי यहाँ कही गई बातों/वचनों और שָׁקֶר असत्य या छल को दर्शाता है। ‘झूठी बातें’ फिरौन द्वारा मूसा और हारून के संदेश को खारिज करने का भाव बनाए रखता है।
