  text: तब इस्राएलियों के अधिकारियों ने देखा कि वे संकट में हैं, जब उनसे कहा गया, “तुम अपनी ईंटों की संख्या—हर दिन की निर्धारित मात्रा[b]—में कोई कमी नहीं करोगे।”
