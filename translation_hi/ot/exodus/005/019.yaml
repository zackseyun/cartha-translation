- source_word: שֹׁטְרֵי
  choice: सरदारों
  rationale: यहाँ मिस्री व्यवस्था के अधीन काम करने वाले इस्राएली अधीनस्थ अधिकारियों के लिए प्रयुक्त है। ‘सरदार’ आधुनिक हिन्दी में समझने योग्य और पर्याप्त व्यापक है।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: शाब्दिक ‘इस्राएल के पुत्र’ के बजाय जातिसूचक और स्वाभाविक हिन्दी रूप; प्रसंग में पूरे समुदाय की पहचान व्यक्त होती है।
- source_word: אֹתָם בְּרָע
  choice: वे मुसीबत में हैं
  rationale: यह नैतिक बुराई नहीं, बल्कि प्रतिकूल और संकटपूर्ण स्थिति बताता है। हिन्दी में कर्तृवाच्य पुनर्गठन स्वाभाविक है।
- source_word: לֵאמֹר
  choice: क्योंकि उनसे कहा गया था
  rationale: यह आगे दिए कथन को उस परिस्थिति के प्रमाण अथवा कारण के रूप में प्रस्तुत करता है; हिन्दी में यह संबंध स्पष्ट और सहज है।
- source_word: לֹא תִגְרְעוּ
  choice: कोई कमी नहीं करनी है
  rationale: גרע का अर्थ घटाना या कम करना है; यह रूप निषेधात्मक आदेश का बल स्पष्ट करता है।
- source_word: מִלִּבְנֵיכֶם
  choice: ईंटों की निर्धारित संख्या में
  rationale: ‘तुम्हारी ईंटों में से’ का शब्दशः रूप हिन्दी में अस्पष्ट होगा; अगले मुहावरे के साथ मिलाकर अपेक्षित संख्या का आशय व्यक्त किया गया है।
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: हर दिन की ... निर्धारित संख्या
  rationale: शाब्दिक रूप ‘एक दिन की बात उसके दिन में’ प्रतिदिन देय निर्धारित मात्रा का हिब्रू मुहावरा है। यह अनुवाद उसकी दैनिकता और अनिवार्य मात्रा दोनों को व्यक्त करता है।
