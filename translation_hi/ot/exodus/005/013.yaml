- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: हर दिन का काम उसी दिन
  rationale: इब्रानी मुहावरे की दैनिक अपेक्षा और उसी दिन उसे पूरा करने की मांग को सहज हिंदी में व्यक्त करता है; निर्धारित मात्रा का निहितार्थ पादटिप्पणी में दिया गया है।
- source_word: כַּאֲשֶׁר
  choice: ठीक वैसे ही जैसे
  rationale: यह पहले की परिस्थिति से स्पष्ट तुलना स्थापित करता है।
- source_word: בִּהְיוֹת הַתֶּבֶן
  choice: जब भूसा मिलता था
  rationale: रचना उस पूर्व स्थिति को दर्शाती है जब भूसा उपलब्ध था; संदर्भ में उसका दिया जाना निहित है, और ‘मिलता था’ हिंदी में स्वाभाविक रूप से इसे व्यक्त करता है।
