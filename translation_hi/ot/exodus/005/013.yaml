  rationale: निर्गमन के इस जबरन श्रम के प्रसंग में यह शब्द उन अधिकारियों को दर्शाता है जो इस्राएलियों से काम और निर्धारित मात्रा पूरी करवाते थे। यह आधुनिक हिंदी में भूमिका और दमनकारी संदर्भ दोनों स्पष्ट करता है।
