base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/010.yaml
  text: 'So the taskmasters of the people and their officers went out and said to the people[a], “Thus says Pharaoh: I am not giving you straw.”'
translation:
  language: hi
  text: 'तब लोगों के काम-निगरान और उनके अधिकारी[a] बाहर गए और लोगों से कहने लगे, “फ़िरौन यह कहता है: ‘मैं तुम्हें पुआल नहीं दे रहा हूँ।’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके मुखिया।” इब्रानी शब्द लोगों में से नियुक्त अधीनस्थ अधिकारियों या कार्य-पर्यवेक्षकों के लिए हो सकता है।
    reason: शब्दगत विकल्प; ‘अधिकारी’ प्रशासनिक अर्थ को व्यापक रखता है, जबकि ‘मुखिया’ प्रसंगानुकूल अधिक विशिष्ट विकल्प है।
lexical_decisions:
- source_word: נֹגְשֵׂי
  choice: काम का दबाव डालनेवाले
  rationale: यह पद श्रम की मात्रा पूरी करवानेवाले कठोर पर्यवेक्षकों को दर्शाता है। यह हिंदी अभिव्यक्ति दमनकारी भूमिका को स्पष्ट करती है, बिना पाठ में सीधे निहित पद से अधिक विशिष्ट पदवी जोड़ने के।
- source_word: שֹׁטְרָיו
  choice: उनके अधिकारी
  rationale: प्रत्यय का स्वाभाविक संबंध ‘लोगों’ से है। ‘अधिकारी’ अधीनस्थ प्रशासनिक भूमिका को सुरक्षित रखता है; प्रसंग में ‘मुखिया’ या ‘मुंशी’ संभव हैं, पर अधिक संकीर्ण हैं।
- source_word: וַיֵּצְאוּ
  choice: बाहर गए
  rationale: सामान्य गति-सूचक अर्थ और फ़िरौन की उपस्थिति से लोगों के पास जाने की कथात्मक दिशा दोनों को व्यक्त करता है।
- source_word: הָעָם
  choice: लोगों
  rationale: सामूहिक संज्ञा का सीधा और स्वाभाविक हिंदी रूप; प्रसंग में इस्राएली मज़दूर अभिप्रेत हैं।
- source_word: לֵאמֹר
  choice: कहा
  rationale: इब्रानी प्रत्यक्ष कथन-परिचायक का आधुनिक हिंदी में स्वाभाविक रूप।
- source_word: כֹּה אָמַר
  choice: यह कहता है
  rationale: राजकीय संदेश-सूत्र की वर्तमान और औपचारिक घोषणा को सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: פַּרְעֹה
  choice: फ़िरौन
  rationale: मिस्र के शासक की उपाधि का प्रचलित मानक हिंदी रूप।
- source_word: אֵינֶנִּי נֹתֵן
  choice: मैं ... नहीं दे रहा हूँ
  rationale: निषेध और कृदंत की वर्तमान, तत्काल लागू होनेवाली अस्वीकृति को बनाए रखता है; केवल भविष्यकाल ‘नहीं दूँगा’ की अपेक्षा स्रोत की पक्षगत बारीकी के निकट है।
- source_word: תֶּבֶן
  choice: भूसा
  rationale: ईंट बनाने में प्रयुक्त सामग्री के लिए संदर्भानुकूल और सामान्य हिंदी शब्द।
