  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध शैली रखी गई है। ‘काम का दबाव डालनेवाले’ स्रोत की दमनकारी श्रम-निगरानी को व्यक्त करता है; ‘उनके अधिकारी’ जानबूझकर व्यापक रखा गया है ताकि अधीनस्थ अधिकारियों की सटीक भूमिका को अनावश्यक रूप से निश्चित न किया जाए।
