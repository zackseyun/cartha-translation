  text: תֶּ֗בֶן אֵ֤ין נִתָּן֙ לַ/עֲבָדֶ֔י/ךָ וּ/לְבֵנִ֛ים אֹמְרִ֥ים לָ֖/נוּ עֲשׂ֑וּ וְ/הִנֵּ֧ה עֲבָדֶ֛י/ךָ מֻכִּ֖ים וְ/חָטָ֥את עַמֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/016.yaml
  text: No straw is given to your servants[a], yet they say to us, ‘Make bricks!’ And behold, your servants are being beaten, but the fault is with your own people.
translation:
  language: hi
  text: आपके सेवकों को पुआल नहीं दिया जाता, फिर भी वे हमसे कहते हैं, ‘ईंटें बनाओ!’ और देखिए, आपके सेवक पीटे जा रहे हैं, पर दोष आपके ही लोगों का है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से संभव अनुवाद: “और आपकी प्रजा ने पाप किया है।” इब्रानी उपवाक्य संक्षिप्त है; इस प्रसंग में उसका आशय संभवतः यह है कि दोष फ़िरौन के लोगों का है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶּבֶן
  choice: पुआल
  rationale: ईंट बनाने के लिए मिट्टी में मिलाई जाने वाली सामग्री के अर्थ में यह स्वाभाविक और संदर्भानुकूल हिन्दी शब्द है।
- source_word: אֵין נִתָּן
  choice: नहीं दिया जाता
  rationale: नकारात्मक अस्तित्ववाचक पद और कर्मवाच्य कृदंत यह बताते हैं कि सामग्री उपलब्ध नहीं कराई जा रही है; वर्तमान कर्मवाच्य हिन्दी में इसे सहज रूप से व्यक्त करता है।
- source_word: לַעֲבָדֶיךָ / עֲבָדֶיךָ
  choice: आपके सेवक
  rationale: इस्राएली मुखिया फ़िरौन से विनम्र राज-दरबारी भाषा में बात कर रहे हैं। ‘सेवक’ अधीनता और आदरसूचक आत्म-संबोधन दोनों को बनाए रखता है, जबकि ‘आपके’ आधुनिक हिन्दी में संबोधन का उचित सम्मान व्यक्त करता है।
- source_word: לְבֵנִים
  choice: ईंटें
  rationale: बहुवचन उत्पादन की माँग को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֹמְרִים לָנוּ עֲשׂוּ
  choice: वे हमसे कहते हैं, ‘ईंटें बनाओ!’
  rationale: मूल में प्रत्यक्ष कथन और बहुवचन आज्ञार्थ है। पिछले पद से ‘ईंटें’ को आज्ञा में दोहराना हिन्दी में अर्थ को स्पष्ट और प्रवाहपूर्ण रखता है।
- source_word: וְהִנֵּה
  choice: और देखिए
  rationale: यह सामने उपस्थित अन्याय की ओर बलपूर्वक ध्यान खींचता है। ‘देखिए’ फ़िरौन के प्रति आदरसूचक संबोधन के साथ आधुनिक और स्वाभाविक है।
- source_word: מֻכִּים
  choice: पीटे जा रहे हैं
  rationale: कर्मवाच्य कृदंत इस प्रसंग में जारी दुर्व्यवहार को दर्शाता है; अपूर्ण वर्तमान कर्मवाच्य हिन्दी में वही बल देता है।
- source_word: וְחָטָאת עַמֶּךָ
  choice: पर दोष आपके ही लोगों का है
  rationale: इब्रानी वाक्यांश संक्षिप्त और व्याकरण की दृष्टि से कठिन है। प्रसंग में शिकायत का आशय यह है कि दोष इस्राएली मज़दूरों का नहीं, फ़िरौन के लोगों का है; ‘ही’ इस विरोध को स्पष्ट करता है, जबकि अधिक शाब्दिक संभावना पाद-टिप्पणी में सुरक्षित है।
theological_decisions:
- issue: וְחָטָאת עַמֶּךָ में दोष या पाप का कर्ता
  choice: दोष आपके ही लोगों का है
  alternative: और आपकी प्रजा ने पाप किया है
  rationale: मुख्य पाठ में प्रसंगानुकूल आरोप व्यक्त किया गया है, लेकिन संक्षिप्त इब्रानी की अधिक शाब्दिक और धार्मिक शब्दावली वाली संभावना को पाद-टिप्पणी में रखा गया है, ताकि मूल की अस्पष्टता न मिटे।
translation_notes:
  register: आधुनिक मानक हिन्दी में फ़िरौन के लिए आदरसूचक ‘आप’ और ‘देखिए’ रखा गया है, क्योंकि बोलने वाले अधीनस्थ मुखिया हैं। भाषा सहज पर गरिमापूर्ण है; कठिन अंतिम उपवाक्य की वास्तविक अस्पष्टता पाद-टिप्पणी में संरक्षित है।
