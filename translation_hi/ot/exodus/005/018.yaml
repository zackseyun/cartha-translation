translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। छोटे आज्ञार्थ वाक्य फिरौन के कठोर आदेश का बल बनाए रखते हैं। अंग्रेज़ी परामर्श-पाठ में [a] ‘now’ के बाद था, पर उसकी टिप्पणी תֹכֶן से संबंधित है; इसलिए स्रोत-संबंध की शुद्धता के लिए चिह्न ‘निर्धारित संख्या’ के बाद रखा गया है।
