  text: וְ/עַתָּה֙ לְכ֣וּ עִבְד֔וּ וְ/תֶ֖בֶן לֹא יִנָּתֵ֣ן לָ/כֶ֑ם וְ/תֹ֥כֶן לְבֵנִ֖ים תִּתֵּֽנּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/018.yaml
  text: So now[a], go, work; but straw will not be given to you, yet you must deliver the required number of bricks.
translation:
  language: hi
  text: इसलिए अब जाओ, काम करो। तुम्हें भूसा नहीं दिया जाएगा, फिर भी तुम्हें ईंटों की निर्धारित संख्या[a] देनी होगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘ईंटों का तय कोटा।’ इब्रानी תֹכֶן से आशय मजदूरों से माँगी गई निश्चित या नापी हुई मात्रा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: इसलिए अब
  rationale: यह पद फिरौन की निर्णायक आज्ञा की ओर संक्रमण दिखाता है; ‘इसलिए अब’ प्रसंगगत निष्कर्ष और तात्कालिकता दोनों व्यक्त करता है।
- source_word: לְכוּ
  choice: जाओ
  rationale: הלך के बहुवचन आज्ञार्थ का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: עִבְדוּ
  choice: काम करो
  rationale: इस प्रसंग में शब्द बेगार करने का आदेश देता है, उपासना या धार्मिक सेवा का नहीं।
- source_word: וְתֶבֶן
  choice: भूसा
  rationale: תֶּבֶן ईंट बनाने में प्रयुक्त सूखी वनस्पति-सामग्री को दर्शाता है; सामान्य हिन्दी में ‘भूसा’ स्पष्ट और प्रचलित है। वाव का विरोधात्मक संबंध अगले वाक्य में ‘फिर भी’ से स्वाभाविक रूप में प्रकट होता है।
- source_word: לֹא יִנָּתֵן לָכֶם
  choice: तुम्हें ... नहीं दिया जाएगा
  rationale: नकार सहित נתן के कर्मवाच्य रूप को निकटता और स्पष्टता से प्रस्तुत करता है।
- source_word: תֹכֶן לְבֵנִים
  choice: ईंटों की निर्धारित संख्या
  rationale: תֹכֶן यहाँ मजदूरों से माँगी गई नापी या निश्चित मात्रा को सूचित करता है; ईंटें गिनी जाने वाली वस्तुएँ हैं, इसलिए ‘निर्धारित संख्या’ सहज और सटीक है।
- source_word: תִּתֵּנוּ
  choice: देनी होगी
  rationale: शाब्दिक अर्थ ‘तुम दोगे’ है, पर आज्ञा के प्रसंग में यह अनिवार्यता और अपेक्षित उत्पादन सौंपने का भाव रखता है; ‘देनी होगी’ उसी बल को स्वाभाविक हिन्दी में व्यक्त करता है।
