  yaml_path: translation/ot/exodus/005/007.yaml
  text: You shall no longer give straw to the people for making bricks as before[a]; let them go and gather straw for themselves.
translation:
  language: hi
  text: “अब से तुम लोगों को ईंटें बनाने के लिए पहले की तरह[a] पुआल नहीं दोगे। वे जाकर अपने लिए पुआल बटोरें।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “बीते दिन और उसके पिछले दिन की तरह”; यह एक मुहावरा है जिसका अर्थ “पहले की तरह” या “पूर्वकाल में” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תֹאסִפוּן
  choice: अब से ... नहीं दोगे
  rationale: निषेध के साथ יסף का हिफ़ील रूप पहले से चली आ रही प्रथा को बंद करने का भाव देता है। ‘अब से ... नहीं’ आधुनिक हिन्दी में इस समाप्ति को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לָתֵת
  choice: दोगे
  rationale: נתן का सामान्य अर्थ ‘देना’ है; प्रसंग में भविष्यकालीन निषेध के अनुरूप ‘दोगे’ रखा गया है।
- source_word: תֶּבֶן
  choice: भूसा
  rationale: यह ईंट बनाने में मिट्टी के साथ मिलाई जाने वाली वनस्पति-सामग्री का प्रचलित हिन्दी नाम है और पद में दोनों बार एकरूप रखा गया है।
- source_word: לָעָם
  choice: लोगों को
  rationale: עם का सीधा अर्थ ‘लोग/प्रजा’ है। यहाँ ‘लोगों’ से इस्राएली श्रमिक समझे जाते हैं, पर अनुवाद मूल पाठ से अधिक संकीर्ण पहचान नहीं जोड़ता।
- source_word: לִלְבֹּן הַלְּבֵנִים
  choice: ईंटें बनाने के लिए
  rationale: क्रियार्थक रूप और उसके कर्म से उद्देश्य व्यक्त होता है; यह हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: כִּתְמוֹל שִׁלְשֹׁם
  choice: पहले की तरह
  rationale: शाब्दिक समय-सूचक मुहावरा बीते समय की प्रथा, अर्थात ‘पहले की तरह’, को दर्शाता है। शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: הֵם יֵלְכוּ
  choice: वे स्वयं जाकर
  rationale: स्वतंत्र सर्वनाम के साथ अपूर्ण क्रिया यहाँ निर्देशात्मक बल रखती है। ‘वे स्वयं जाकर’ उस आदेश और इस बात, दोनों को स्पष्ट करता है कि अब काम उन्हीं को करना है।
- source_word: וְקֹשְׁשׁוּ
  choice: बटोरें
  rationale: קשש बिखरी हुई सामग्री को इकट्ठा करने का भाव देता है; ‘बटोरें’ प्रसंगानुकूल और सहज हिन्दी है।
- source_word: לָהֶם
  choice: अपने लिए
  rationale: यह सम्प्रदानवाचक सर्वनाम बताता है कि उन्हें भूसा अपने उपयोग के लिए स्वयं जुटाना है।
