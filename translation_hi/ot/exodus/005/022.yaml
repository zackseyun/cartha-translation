source:
  edition: WLC
  text: וַ/יָּ֧שָׁב מֹשֶׁ֛ה אֶל יְהוָ֖ה וַ/יֹּאמַ֑ר אֲדֹנָ֗/י לָ/מָ֤ה הֲרֵעֹ֨תָה֙ לָ/עָ֣ם הַ/זֶּ֔ה לָ֥/מָּה זֶּ֖ה שְׁלַחְתָּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/022.yaml
  text: Then Moses returned to Yahweh and said[a], “Lord, why have you brought harm on this people? Why then did you send me?”
translation:
  language: hi
  text: तब मूसा याहवे के पास लौटकर बोला, “प्रभु, आपने इस प्रजा पर विपत्ति क्यों लाई? फिर आपने मुझे भेजा ही क्यों?”[क]
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: हिब्रू में शाब्दिक रूप से, “क्यों यह, आपने मुझे भेजा?” यह जोर देने वाला मुहावरा है, जिसका अर्थ है, “फिर आपने मुझे क्यों भेजा?”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: लौटकर
  rationale: שׁוב का यह रूप यहाँ पहले की स्थिति या संबोधन की ओर वापस जाने को व्यक्त करता है; ‘लौटकर’ स्वाभाविक और अर्थनिष्ठ है।
- source_word: אֶל יְהוָה
  choice: यहवे के पास
  rationale: אֶל दिशा या संबोधन का लक्ष्य बताता है, और יְהוָה को उसके व्यक्तिगत वाचा-नाम ‘यहवे’ से प्रस्तुत किया गया है।
- source_word: אֲדֹנָי
  choice: प्रभु
  rationale: यह परमेश्वर के लिए आदरपूर्ण संबोधन है; ‘प्रभु’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: הֲרֵעֹתָה
  choice: आपने ... विपत्ति क्यों आने दी
  rationale: רעע के हिफ़ील रूप में हानि या दुर्दशा उत्पन्न करने का भाव है। प्रसंग में फ़िरौन के कारण बढ़ी हुई पीड़ा अभिप्रेत है; हिन्दी अभिव्यक्ति परिणाम और परमेश्वर से की गई शिकायत को बनाए रखते हुए नैतिक बुराई करने का अनावश्यक आरोप टालती है।
- source_word: לָעָם הַזֶּה
  choice: इस प्रजा पर
  rationale: עָם इस्राएल को सामूहिक समुदाय के रूप में बताता है; ‘प्रजा’ यहाँ संबोधित प्रभु और उसके लोगों के संबंध के अनुकूल है।
- source_word: לָמָּה זֶּה
  choice: फिर ... ही क्यों
  rationale: शाब्दिक ‘क्यों यह’ हिन्दी में अस्वाभाविक होगा। ‘फिर ... ही क्यों’ प्रश्न के हिब्रू बलाघात और मूसा की तीखी उलझन को स्वाभाविक रूप से व्यक्त करता है।
- source_word: שְׁלַחְתָּנִי
  choice: आपने मुझे भेजा
  rationale: द्वितीय पुरुष एकवचन क्रिया और प्रथम पुरुष कर्म-प्रत्यय का सीधा तथा स्वाभाविक हिन्दी रूप।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा / प्रभु
  rationale: मूल में चार-अक्षरी व्यक्तिगत नाम स्पष्ट रूप से है; ‘यहवे’ उसे उपाधि में बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: הֲרֵעֹתָה में परमेश्वर और विपत्ति का संबंध
  choice: विपत्ति आने दी
  alternative: हानि पहुँचाई / बुरा किया
  rationale: मूसा की शिकायत की तीक्ष्णता और लोगों पर आई वास्तविक दुर्दशा को रखा गया है, पर वाक्य को परमेश्वर द्वारा नैतिक बुराई किए जाने के स्पष्ट दावे में नहीं बदला गया। हिब्रू की कारणवाचकता अधिक सीधी भी समझी जा सकती है, इसलिए विकल्प दर्ज किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; आदरसूचक ‘आप’ के साथ गरिमापूर्ण, किंतु मूसा की व्याकुल और साहसपूर्ण शिकायत को स्पष्ट रखने वाला सामान्य-पाठक अनुकूल रूप।
