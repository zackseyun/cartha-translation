lexical_decisions:
- source_word: וַיָּפֶץ
  choice: फैल गए
  rationale: क्रिया פוץ यहाँ लोगों के एक बड़े क्षेत्र में तितर-बितर होकर जाने को व्यक्त करती है। हिन्दी में ‘फैल गए’ प्रसंगजनित विवशता को बनाए रखते हुए स्वाभाविक है।
- source_word: הָעָם
  choice: लोग
  rationale: עַם इस प्रसंग में सामूहिक रूप से इस्राएली मजदूरों को सूचित करता है; ‘लोग’ सरल और अनावश्यक विशिष्टीकरण से मुक्त है।
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: मिस्र के सारे देश में
  rationale: यह पूरे मिस्र में व्यापक रूप से जाने का भाव देता है; यह रूप हिन्दी में स्वाभाविक ढंग से בְּכָל की व्यापकता रखता है।
- source_word: לְקֹשֵׁשׁ
  choice: बटोरने के लिए
  rationale: קשש बिखरी हुई छोटी वस्तुओं या वनस्पति-अवशेषों को इकट्ठा करने का अर्थ देता है; ‘बटोरना’ इस विशिष्ट क्रिया को ठीक से व्यक्त करता है।
- source_word: קַשׁ
  choice: सूखी डंठलें
  rationale: קַשׁ खेत में बची सूखी डंठलों या ठूँठ जैसे वनस्पति-अवशेष को सूचित कर सकता है। चूँकि इसी वाक्य में תֶּבֶן अलग शब्द है, ‘सूखी डंठलें’ दोनों के बीच संभावित भेद बनाए रखता है।
- source_word: לַתֶּבֶן
  choice: भूसे के बदले
  rationale: 'לְ यहाँ उपयोग अथवा प्रतिस्थापन का भाव दे सकता है: बटोरी गई डंठलें सामान्यतः मिलने वाले भूसे के स्थान पर ईंट बनाने में काम आनी थीं। ‘के बदले’ प्रसंग में यह संबंध स्पष्ट करता है।'
