lexical_decisions:
- source_word: אַתֶּם
  choice: तुम खुद
  rationale: स्वतंत्र सर्वनाम आज्ञाओं से पहले बल देता है; ‘तुम खुद’ इस जोर को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: לְכוּ קְחוּ לָכֶם
  choice: जाओ ... अपने लिए ले लो
  rationale: दोनों बहुवचन आज्ञार्थों और לָכֶם के आत्मसंबंधी/हितार्थक भाव को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: תֶּבֶן
  choice: पुआल
  rationale: ईंट बनाने के प्रसंग में यह सूखे डंठलों या भूसेनुमा सामग्री को सूचित करता है; आधुनिक हिन्दी में ‘पुआल’ सबसे स्पष्ट संदर्भगत शब्द है।
- source_word: מֵאֲשֶׁר תִּמְצָאוּ
  choice: जहाँ कहीं तुम्हें ... मिले, वहाँ से
  rationale: यह उपलब्ध किसी भी स्थान या स्रोत से पुआल लेने की खुली संभावना व्यक्त करता है और स्रोतसूचक מִן को ‘वहाँ से’ द्वारा सुरक्षित रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ संयोजक को उसके सामान्य कारणसूचक अर्थ ‘क्योंकि/इसलिए कि’ में रखा गया है; प्रसंग में विरोधात्मक प्रभाव संभव है, जिसे पादटिप्पणी में बताया गया है।
- source_word: אֵין נִגְרָע מֵעֲבֹדַתְכֶם דָּבָר
  choice: तुम्हारे काम में कुछ भी कमी नहीं की जाएगी
  rationale: निषेध, कर्मवाच्य भाव और ‘एक भी बात/कुछ भी नहीं’ की पूर्णता को सहज हिन्दी में व्यक्त करता है; आदेशात्मक प्रसंग के कारण भावी अर्थ उपयुक्त है।
