  text: וְ/אֶת מַתְכֹּ֨נֶת הַ/לְּבֵנִ֜ים אֲשֶׁ֣ר הֵם֩ עֹשִׂ֨ים תְּמ֤וֹל שִׁלְשֹׁם֙ תָּשִׂ֣ימוּ עֲלֵי/הֶ֔ם לֹ֥א תִגְרְע֖וּ מִמֶּ֑/נּוּ כִּֽי נִרְפִּ֣ים הֵ֔ם עַל כֵּ֗ן הֵ֤ם צֹֽעֲקִים֙ לֵ/אמֹ֔ר נֵלְכָ֖ה נִזְבְּחָ֥ה לֵ/אלֹהֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/008.yaml
  text: And the quota of bricks that they were making yesterday and the day before[a], you shall impose on them; you shall not reduce any of it, because they are idle. Therefore they are crying out, saying, ‘Let us go and sacrifice to our God.’
translation:
  language: hi
  text: ईंटों की जो निर्धारित मात्रा वे पहले[a] बनाते थे, वही उन पर लागू करना; उसमें कुछ भी कमी न करना, क्योंकि वे आलसी हैं। इसीलिए वे यह कहकर चिल्ला रहे हैं, ‘हम चलें और अपने परमेश्वर के लिए बलिदान चढ़ाएँ।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “कल और उससे पिछले दिन”; अर्थात् पहले की तरह।'
    reason: हिब्रू काल-सूचक अभिव्यक्ति के शाब्दिक रूप और उसके प्रसंगगत, व्यापक अर्थ दोनों को सुरक्षित रखना।
lexical_decisions:
- source_word: מַתְכֹּנֶת
  choice: जितनी संख्या
  rationale: श्रम और उत्पादन के इस संदर्भ में शब्द ईंटों की निर्धारित उत्पादन-मात्रा को सूचित करता है। वाक्य में ‘जितनी संख्या…उतनी ही’ आधुनिक हिन्दी में स्वाभाविक रूप से वही अर्थ व्यक्त करता है।
- source_word: הַלְּבֵנִים
  choice: ईंटों
  rationale: ईंट बनाने के प्रसंग में यह सीधा ठोस संज्ञा-रूप है।
- source_word: תְּמוֹל שִׁלְשֹׁם
  choice: पहले[a]
  rationale: हिब्रू अभिव्यक्ति का शाब्दिक अर्थ ‘कल और उससे पिछले दिन’ है, पर यहाँ उसका मुहावरेदार आशय पूर्व समय की सामान्य उत्पादन-मात्रा है। ‘पहले’ सहज हिन्दी है; शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: תָּשִׂימוּ עֲלֵיהֶם
  choice: उतनी ही अब भी उनसे बनवाना
  rationale: ईंटों की निर्धारित मात्रा मजदूरों पर अनिवार्य करने का प्रशासनिक और बाध्यकारी भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לֹא תִגְרְעוּ מִמֶּנּוּ
  choice: उसमें कुछ भी कमी न करना
  rationale: निर्धारित मात्रा के किसी भी अंश को न घटाने की आज्ञा स्पष्ट रूप से व्यक्त होती है।
- source_word: נִרְפִּים
  choice: आलसी
  rationale: यह फ़िरौन का आरोप है कि लोग पर्याप्त परिश्रम नहीं कर रहे। ‘आलसी’ आरोप की तीक्ष्णता रखता है, पर कथावाचक की ओर से उसे सत्य घोषित नहीं करता।
- source_word: צֹעֲקִים
  choice: पुकार-पुकारकर कहते हैं
  rationale: कृदन्त की निरंतरता और ऊँची, आग्रहपूर्ण पुकार—दोनों को व्यक्त करता है।
- source_word: נֵלְכָה נִזְבְּחָה
  choice: हमें जाने दो कि हम…बलिदान चढ़ाएँ
  rationale: दोनों इच्छार्थक क्रियाओं का निवेदनात्मक बल और हिन्दी में उनका स्वाभाविक संबंध सुरक्षित रहता है।
- source_word: לֵאלֹהֵינוּ
  choice: अपने परमेश्वर को
  rationale: बलिदान के प्राप्तकर्ता और इस्राएलियों के अपने परमेश्वर—दोनों संबंधों को सहज हिन्दी में स्पष्ट करता है।
