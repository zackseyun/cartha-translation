translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। ‘बेगार करानेवाले अधिकारी’ मिस्री נֹגְשִׂים और ‘मुखिया’ इस्राएली שֹׁטְרִים के बीच पदगत भेद बनाए रखते हैं। कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि כִּתְמוֹל שִׁלְשֹׁם का मुहावरेदार अर्थ मुख्य पाठ में स्पष्ट है।
