reference: Exodus 5:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֻּכּ֗וּ שֹֽׁטְרֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁר שָׂ֣מוּ עֲלֵ/הֶ֔ם נֹגְשֵׂ֥י פַרְעֹ֖ה לֵ/אמֹ֑ר מַדּ֡וּעַ לֹא֩ כִלִּיתֶ֨ם חָקְ/כֶ֤ם לִ/לְבֹּן֙ כִּ/תְמ֣וֹל שִׁלְשֹׁ֔ם גַּם תְּמ֖וֹל גַּם הַ/יּֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/014.yaml
  text: And the Israelite foremen[a], whom Pharaoh’s taskmasters had set over them, were beaten, saying, “Why have you not finished your quota of brickmaking as before, both yesterday and today?”
translation:
  language: hi
  text: और इस्राएली निगरानों को, जिन्हें फ़िरौन के बेगार करानेवाले अधिकारियों ने इस्राएलियों पर नियुक्त किया था, पीटा गया और उनसे कहा गया, “तुमने पहले की तरह कल और आज दोनों दिन ईंटें बनाने की निर्धारित मात्रा पूरी क्यों नहीं की?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּכּוּ
  choice: पीटा गया
  rationale: נכה के कर्मवाच्य बहुवचन का स्वाभाविक हिन्दी रूप; शारीरिक दंड स्पष्ट करता है, पर उसकी विधि को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: שֹׁטְרֵי בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों के मुखिया
  rationale: यहाँ שֹׁטְרִים इस्राएली मज़दूरों पर नियुक्त अधीनस्थ अगुओं को सूचित करता है; ‘मुखिया’ सामान्य पाठक के लिए स्वाभाविक और प्रसंगानुकूल है।
- source_word: אֲשֶׁר שָׂמוּ עֲלֵהֶם נֹגְשֵׂי פַרְעֹה
  choice: जिन्हें फ़िरौन के बेगार करानेवाले अधिकारियों ने उन पर नियुक्त किया था
  rationale: נֹגְשִׂים जबरन श्रम करानेवाले मिस्री अधिकारियों को सूचित करता है; यह रूप उनकी भूमिका और पदानुक्रम दोनों स्पष्ट रखता है।
- source_word: לֵאמֹר
  choice: उनसे कहा गया
  rationale: इब्रानी उद्धरण-सूचक क्रियारूप को स्वाभाविक हिन्दी में कर्मवाच्य कथन के रूप में व्यक्त किया गया है, जिससे पीटनेवालों के शब्द स्पष्ट जुड़ते हैं।
- source_word: מַדּוּעַ לֹא כִלִּיתֶם
  choice: पूरा क्यों नहीं किया
  rationale: כלה यहाँ निर्धारित काम को पूरा करने के अर्थ में है; प्रश्न का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: חָקְכֶם
  choice: अपना निर्धारित कोटा
  rationale: חֹק का आशय नियत या अनिवार्य मात्रा है; ‘निर्धारित कोटा’ श्रम-प्रसंग में सटीक और सहज है।
- source_word: לִלְבֹּן
  choice: ईंटें बनाने का
  rationale: לבן का यह रूप ईंट बनाने की क्रिया को सूचित करता है; हिन्दी में ‘कोटा’ के साथ यह संबंध स्वाभाविक है।
- source_word: כִּתְמוֹל שִׁלְשֹׁם
  choice: पहले की तरह
  rationale: शाब्दिक काल-सूचक अभिव्यक्ति यहाँ रूढ़िपूर्वक पूर्व प्रथा या पहले की स्थिति को दर्शाती है।
- source_word: גַּם תְּמוֹל גַּם הַיּוֹם
  choice: कल और आज भी
  rationale: גַּם…גַּם दोनों दिनों पर बल देता है; यह हिन्दी रूप संक्षिप्त और स्वाभाविक है।
