  yaml_path: translation/ot/exodus/005/020.yaml
  text: They met Moses and Aaron[a], who were standing to meet them when they came out from Pharaoh.
translation:
  language: hi
  text: जब वे फ़िरौन के पास से बाहर निकले, तो उनकी भेंट मूसा और हारून से हुई[a], जो उनसे मिलने के लिए खड़े थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मूसा और हारून से उनका सामना हुआ’; इस क्रिया में कुछ प्रसंगों में तनावपूर्ण सामना होने का भाव भी हो सकता है, पर यहाँ मुख्य पाठ में इसका व्यापक अर्थ ‘भेंट हुई’ रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְגְּעוּ
  choice: उनकी भेंट ... से हुई
  rationale: פגע का मूल अर्थ यहाँ ‘मिलना/भेंट होना’ है। अगले पद में तनाव स्पष्ट होता है, पर इस क्रिया में अपने-आप टकराव का भाव जोड़ना आवश्यक नहीं।
- source_word: אֶת מֹשֶׁה וְאֶת אַהֲרֹן
  choice: मूसा और हारून से
  rationale: हिन्दी में ‘भेंट होना’ के साथ ‘से’ स्वाभाविक है; इब्रानी के प्रत्यक्ष कर्म-चिह्नों का अलग अनुवाद नहीं किया गया।
- source_word: נִצָּבִים
  choice: खड़े थे
  rationale: कृदन्त उस समय जारी स्थिति को दिखाता है; ‘खड़े थे’ आधुनिक हिन्दी में इसे सहज रूप से व्यक्त करता है।
- source_word: לִקְרָאתָם
  choice: उनसे मिलने के लिए
  rationale: לִקְרַאת का सामान्य अर्थ किसी की ओर उससे मिलने के लिए उपस्थित होना है। यहाँ ‘सामना करने’ जैसा शत्रुतापूर्ण अर्थ अनावश्यक रूप से निश्चित हो जाता।
- source_word: בְּצֵאתָם
  choice: जब वे ... बाहर निकले
  rationale: בְּ के साथ infinitive construct समयगत परिस्थिति बताता है; हिन्दी में ‘जब ... निकले’ स्पष्ट और स्वाभाविक है।
- source_word: מֵאֵת פַּרְעֹה
  choice: फ़िरौन के पास से
  rationale: מֵאֵת किसी व्यक्ति की उपस्थिति या पास से अलग होने का भाव देता है। ‘फ़िरौन के पास से’ केवल ‘फ़िरौन से’ की तुलना में दृश्य को अधिक स्पष्ट रखता है।
