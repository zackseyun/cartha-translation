base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/021.yaml
  text: And they said to them[a], “May Yahweh look on you and judge, because you have made us stink in the sight of Pharaoh and in the sight of his servants, putting a sword in their hand to kill us.”
translation:
  language: hi
  text: और उन्होंने उनसे कहा, “याहवे तुम्हारी ओर दृष्टि डाले और न्याय करे, क्योंकि तुमने फ़िरौन और उसके सेवकों की दृष्टि में हमें घृणित बना दिया है[a] और हमें मार डालने के लिए उनके हाथ में तलवार दे दी है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “तुमने हमारी गंध को दुर्गंधित कर दिया है”; अर्थात्, “तुमने हमें घृणित या अप्रिय बना दिया है।”
    reason: मूल इब्रानी की गंध-संबंधी तीखी उपमा को स्पष्ट करता है, जबकि मुख्य पाठ में उसका स्वाभाविक हिन्दी भावार्थ दिया गया है।
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֲלֵהֶם
  choice: और उन्होंने उनसे कहा
  rationale: इब्रानी कथा-प्रवाह और मूल के सर्वनाम को बनाए रखा गया है; संदर्भ से ये सर्वनाम इस्राएली सरदारों तथा मूसा और हारून की ओर संकेत करते हैं।
- source_word: יֵרֶא יְהוָה עֲלֵיכֶם וְיִשְׁפֹּט
  choice: याहवे तुम पर दृष्टि करे और न्याय करे
  rationale: दोनों अपूर्ण क्रियाओं का यहाँ इच्छार्थक/शापसूचक बल है। ‘दृष्टि करे’ परमेश्वर द्वारा ध्यान दिए जाने और ‘न्याय करे’ उसके निर्णय की पुकार को बनाए रखते हैं।
- source_word: יְהוָה
  choice: याहवे
  rationale: व्यक्तिगत ईश्वरीय नाम יהוה को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: אֲשֶׁר הִבְאַשְׁתֶּם אֶת־רֵיחֵנוּ
  choice: क्योंकि तुमने ... हमारी गंध दुर्गन्ध बना दी है
  rationale: אֲשֶׁר का कारणसूचक अर्थ और मूल की सजीव गंध-वाली उपमा दोनों सुरक्षित हैं; अधिक सहज अर्थ पादटिप्पणी में दिया गया है।
- source_word: בְּעֵינֵי פַרְעֹה וּבְעֵינֵי עֲבָדָיו
  choice: फ़िरौन और उसके सेवकों की दृष्टि में
  rationale: दोहराए गए इब्रानी मुहावरे का अर्थ स्वाभाविक हिन्दी में व्यक्त किया गया है और मूल्यांकन/प्रतिष्ठा का भाव बना रहता है।
- source_word: לָתֵת חֶרֶב בְּיָדָם לְהָרְגֵנוּ
  choice: हमें मार डालने के लिए उनके हाथ में तलवार दे दी है
  rationale: मूल की एकवचन सामूहिक ‘तलवार’ और हत्या का साधन अथवा अवसर उपलब्ध कराने वाली छवि सुरक्षित रखी गई है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम सीधे आया है; अतः उसे उपाधि ‘प्रभु’ से बदलने के बजाय ‘याहवे’ रूप में रखा गया है।
- issue: יֵרֶא ... וְיִשְׁפֹּט का भाव
  choice: 'इच्छार्थक पुकार: “दृष्टि करे और न्याय करे”'
  alternative: 'भविष्यवाणी: “देखेगा और न्याय करेगा”'
  rationale: संदर्भ और समन्वित अपूर्ण क्रियाएँ मूसा और हारून के विरुद्ध परमेश्वर से निर्णय की कामना व्यक्त करती हैं, न कि केवल भविष्य की सूचना।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिन्दी। मूल की तीखी गंध-वाली उपमा को मुख्य पाठ में रखा गया है और उसके भावार्थ को पादटिप्पणी में स्पष्ट किया गया है।
