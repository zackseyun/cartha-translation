  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּֽי שָׂנֵ֣א שַׁלַּ֗ח אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל וְ/כִסָּ֤ה חָמָס֙ עַל לְבוּשׁ֔/וֹ אָמַ֖ר יְהוָ֣ה צְבָא֑וֹת וְ/נִשְׁמַרְתֶּ֥ם בְּ/רוּחֲ/כֶ֖ם וְ/לֹ֥א תִבְגֹּֽדוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/016.yaml
  text: For he hates divorce[a], says Yahweh, the God of Israel, and the one who covers his garment with violence, says Yahweh of Armies. So guard yourselves in your spirit[b], and do not act faithlessly.
translation:
  language: hi
  text: “क्योंकि वह तलाक से घृणा करता है,” इस्राएल का परमेश्वर यहोवा कहता है, “और जो अपने वस्त्र को हिंसा से ढकता है,” सेनाओं का यहोवा कहता है। इसलिए अपने भीतर सावधान रहो[b] और विश्वासघात मत करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: या, “अपनी आत्मा में सावधान रहो।” इब्रानी में अपने भीतरी स्वभाव या मनोवृत्ति की चौकसी करने का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי שָׂנֵא שַׁלַּח
  choice: क्योंकि जो अपनी पत्नी को त्याग देता है, वह उससे घृणा करता है
  rationale: MT के कठिन तृतीय-पुरुष रूप שָׂנֵא को बनाए रखते हुए שַׁלַּח को वैवाहिक संदर्भ में पत्नी को त्यागना समझा गया है। हिन्दी में कर्ता और कर्म स्पष्ट करना आवश्यक है; यह रूप पारंपरिक प्रथम-पुरुष पाठ को मुख्य पाठ में आरोपित नहीं करता।
- source_word: יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल का परमेश्वर यहोवा
  rationale: ईश्वरीय नाम को 'यहोवा' और उपाधि को स्वाभाविक आधुनिक हिन्दी में प्रस्तुत करता है।
- source_word: וְכִסָּה חָמָס עַל לְבוּשׁוֹ
  choice: और वह अपने वस्त्र को हिंसा से ढक लेता है
  rationale: मूल के संक्षिप्त और विवादित वाक्य-विन्यास तथा वस्त्र के रूपक को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का यहोवा
  rationale: צְבָאוֹת के सामरिक और व्यापक प्रभाव को स्पष्ट, प्रतिष्ठित हिन्दी में बनाए रखता है।
- source_word: וְנִשְׁמַרְתֶּם בְּרוּחֲכֶם
  choice: इसलिए अपने मन के विषय में सावधान रहो
  rationale: רוּחַ यहाँ व्यक्ति के भीतरी स्वभाव या मनोवृत्ति की ओर संकेत करता है। शब्दशः 'अपनी आत्मा में' की अपेक्षा यह आधुनिक हिन्दी में अधिक स्वाभाविक है, जबकि आंतरिक नैतिक सतर्कता बनी रहती है।
- source_word: וְלֹא תִבְגֹּדוּ
  choice: और विश्वासघात मत करो
  rationale: בגד वैवाहिक और वाचा-संबंधी निष्ठा तोड़ने को दर्शाता है; 'विश्वासघात' इस गंभीरता को संक्षेप में व्यक्त करता है।
theological_decisions:
- issue: पारंपरिक 'मैं तलाक से घृणा करता हूँ' और MT के तृतीय-पुरुष कठिन पाठ के बीच चुनाव
  choice: 'मुख्य पाठ में तृतीय-पुरुष अर्थ: ''जो अपनी पत्नी को त्याग देता है, वह उससे घृणा करता है'''
  alternative: “क्योंकि मैं तलाक से घृणा करता हूँ,” इस्राएल का परमेश्वर यहोवा कहता है।
  rationale: שָׂנֵא का रूप तृतीय पुरुष पुल्लिंग एकवचन है। पद का वाक्य-विन्यास कठिन है, इसलिए परिचित धार्मिक सूत्र को मुख्य पाठ में बैठाने के बजाय MT की व्याकरणिक दिशा रखी गई और पारंपरिक पाठ टिप्पणी में दिया गया।
- issue: वस्त्र और हिंसा के रूपक की व्याख्या
  choice: 'रूपक को यथासंभव अक्षुण्ण रखना: ''अपने वस्त्र को हिंसा से ढक लेता है'''
  alternative: उसका वस्त्र हिंसा से ढक जाता है / वह अपने वस्त्र पर अन्याय ढकता है
  rationale: खंड का सटीक वाक्य-विन्यास विवादित है। शाब्दिक रूपक वैवाहिक विश्वासघात, कलंक अथवा हिंसक अन्याय की संभावित प्रतिध्वनियों को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज स्तर रखा गया है। 'पत्नी को त्याग देना' वैवाहिक संदर्भ स्पष्ट करता है; 'तलाक' को कठिन वैकल्पिक पाठ वाली टिप्पणी में रखा गया है। मुख्य पाठ में दोनों टिप्पणी-चिह्न [a] और [b] सम्मिलित हैं।
