id: MAL.2.14
reference: Malachi 2:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/אֲמַרְתֶּ֖ם עַל מָ֑ה עַ֡ל כִּי יְהוָה֩ הֵעִ֨יד בֵּינְ/ךָ֜ וּ/בֵ֣ין אֵ֣שֶׁת נְעוּרֶ֗י/ךָ אֲשֶׁ֤ר אַתָּה֙ בָּגַ֣דְתָּה בָּ֔/הּ וְ/הִ֥יא חֲבֶרְתְּ/ךָ֖ וְ/אֵ֥שֶׁת בְּרִיתֶֽ/ךָ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/014.yaml
  text: But you say[a], “Why?” Because Yahweh has been a witness between you and the wife of your youth, to whom you have been unfaithful[b], though she is your companion and your wife by covenant.
translation:
  language: hi
  text: पर तुम कहते हो, “क्यों?” क्योंकि याहवे तुम्हारे और तुम्हारी युवावस्था की पत्नी के बीच साक्षी रहा है—जिसके प्रति तुमने विश्वासघात किया है[a]—यद्यपि वह तुम्हारी संगिनी और वाचा के द्वारा तुम्हारी पत्नी[b] है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुमने उसके साथ छलपूर्ण व्यवहार किया है।” इब्रानी क्रिया विशेषतः वाचा के संदर्भ में छल, विश्वासघात या विश्वासहीन व्यवहार का अर्थ दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “तुम्हारी वाचा की पत्नी” अथवा “वाचा से बंधी तुम्हारी पत्नी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲמַרְתֶּם
  choice: पर तुम कहते हो
  rationale: वाव यहाँ पिछले आरोप के प्रति लोगों की आपत्ति प्रस्तुत करता है; ‘पर’ उस विरोधात्मक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עַל־מָה
  choice: क्यों?
  rationale: यह संक्षिप्त प्रश्नवाचक मुहावरा कारण पूछता है; ‘क्यों?’ आधुनिक हिन्दी में स्वाभाविक और प्रभावपूर्ण है।
- source_word: עַל כִּי
  choice: इसलिए कि
  rationale: यह पहले प्रश्न का उत्तर आरम्भ करता है और हिन्दी में कारण को स्पष्टता से जोड़ता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी लिपि में लिप्यंतरित किया गया है।
- source_word: הֵעִיד
  choice: साक्षी रहा है
  rationale: हिफ़ील रूप यहाँ वैवाहिक वाचा के न्यायिक संदर्भ में साक्षी होने का अर्थ देता है।
- source_word: אֵשֶׁת נְעוּרֶיךָ
  choice: तुम्हारी युवावस्था की पत्नी
  rationale: यह मूल इब्रानी मुहावरे और उसके भावनात्मक बल—युवावस्था से जुड़े वैवाहिक संबंध—को सुरक्षित रखता है।
- source_word: אֲשֶׁר אַתָּה בָּגַדְתָּה בָּהּ
  choice: तुमने उसी के साथ विश्वासघात किया है
  rationale: בגד छलपूर्ण और विश्वासहीन आचरण, विशेषतः वाचा तोड़ने, का गंभीर भाव रखता है; ‘विश्वासघात’ उस बल को बनाए रखता है।
- source_word: חֲבֶרְתְּךָ
  choice: तुम्हारी संगिनी
  rationale: यह निकट संबंध में जुड़ी स्त्री को दर्शाता है; ‘संगिनी’ वैवाहिक संदर्भ में स्वाभाविक और गरिमापूर्ण है।
- source_word: אֵשֶׁת בְּרִיתֶךָ
  choice: वाचा के द्वारा तुम्हारी पत्नी
  rationale: यह विवाह के वाचागत स्वरूप को स्पष्ट करता है और ‘तुम्हारी वाचा की पत्नी’ जैसी अस्वाभाविक हिन्दी से बचता है।
theological_decisions:
- issue: वैवाहिक वाचा और विश्वासघात
  choice: याहवे को पति और पत्नी के बीच साक्षी तथा विवाह को वाचा से स्थापित संबंध के रूप में व्यक्त किया गया है।
  alternative: इसे केवल सामान्य पारस्परिक बेवफाई के रूप में प्रस्तुत करना।
  rationale: בגד और ברית साथ मिलकर वैवाहिक विश्वासघात के वाचागत और न्यायिक भार को स्पष्ट करते हैं; अनुवाद इसे बनाए रखता है, पर बाद की कोई संप्रदायगत व्याख्या नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सामान्य पाठक के लिए स्पष्ट किंतु गरिमापूर्ण रखी गई है। आरम्भ का बहुवचन संबोधन और आगे व्यक्ति-विशेष को लक्ष्य करता वैवाहिक आरोप हिन्दी के ‘तुम’ रूप में स्वाभाविक रूप से साथ आते हैं। दो वाक्यों में विभाजन हिन्दी में दीर्घ वाक्य का भार घटाता है, जबकि मूल तर्क और concessive ‘यद्यपि’ संबंध सुरक्षित रहते हैं।
