  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הוֹגַעְתֶּ֤ם יְהוָה֙ בְּ/דִבְרֵי/כֶ֔ם וַ/אֲמַרְתֶּ֖ם בַּ/מָּ֣ה הוֹגָ֑עְנוּ בֶּ/אֱמָרְ/כֶ֗ם כָּל עֹ֨שֵׂה רָ֜ע ט֣וֹב בְּ/עֵינֵ֣י יְהוָ֗ה וּ/בָ/הֶם֙ ה֣וּא חָפֵ֔ץ א֥וֹ אַיֵּ֖ה אֱלֹהֵ֥י הַ/מִּשְׁפָּֽט־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/017.yaml
  text: You have wearied Yahweh with your words. Yet you say[a], “How have we wearied him?” By saying, “Everyone who does evil is good in the eyes of Yahweh, and he delights in them,” or, “Where is the God of justice?”
translation:
  language: hi
  text: तुमने अपनी बातों से याहवे को थका दिया है। फिर भी तुम कहते हो, “हमने उसे किस बात में थकाया है?” क्योंकि तुम कहते हो, “हर बुराई करनेवाला याहवे की दृष्टि में अच्छा है, और वह उनसे प्रसन्न होता है,” या, “न्याय का परमेश्वर कहाँ है?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “न्यायिक निर्णय का परमेश्वर कहाँ है?”
    reason: מִשְׁפָּט का अर्थ ‘न्याय’ के साथ-साथ ‘न्यायिक निर्णय’ भी हो सकता है।
lexical_decisions:
- source_word: הוֹגַעְתֶּם / הוֹגָעְנוּ
  choice: थका दिया है / कैसे थकाया है
  rationale: יגע के हिफ़ील रूप का अर्थ थकाना या क्लांत कर देना है। यह चयन परमेश्वर के विषय में प्रयुक्त सजीव मानवीय भाषा को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले व्यक्तिगत ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय आधुनिक हिन्दी में उसका लिप्यंतरण किया गया है।
- source_word: בְּדִבְרֵיכֶם
  choice: अपनी बातों से
  rationale: पूर्वसर्ग ב यहाँ साधन बताता है; ‘बातों से’ स्वाभाविक हिन्दी में उसी संबंध को व्यक्त करता है।
- source_word: בַּמָּה
  choice: कैसे
  rationale: यह प्रश्न चुनौती के रूप में पूछता है कि उन्होंने किस प्रकार परमेश्वर को थकाया; ‘कैसे’ संक्षिप्त और स्वाभाविक है।
- source_word: בֶּאֱמָרְכֶם
  choice: यह कहकर
  rationale: पूर्वसर्ग और infinitive construct पहले कथन का कारण अथवा साधन स्पष्ट करते हैं।
- source_word: כָּל עֹשֵׂה רָע
  choice: हर बुराई करनेवाला
  rationale: यह सामान्य और वितरणात्मक अर्थ को तथा इब्रानी कृदंत की क्रियात्मकता को बनाए रखता है।
- source_word: טוֹב בְּעֵינֵי יְהוָה
  choice: याहवे की दृष्टि में अच्छा है
  rationale: ‘दृष्टि में’ इब्रानी मुहावरे की छवि और मूल्यांकन का भाव दोनों बनाए रखता है; ‘अच्छा’ मूल विशेषण का सीधा अर्थ है।
- source_word: וּבָהֶם הוּא חָפֵץ
  choice: और वह उनसे प्रसन्न होता है
  rationale: חפץ प्रसन्नता, रुचि या आनंद का भाव देता है। यह हिन्दी में स्वाभाविक है और आरोप की तीक्ष्णता बनाए रखता है।
- source_word: אוֹ
  choice: या
  rationale: यह उसी निंदक शिकायत के दूसरे वैकल्पिक रूप को प्रस्तुत करता है।
- source_word: אֱלֹהֵי הַמִּשְׁפָּט
  choice: न्याय का परमेश्वर
  rationale: מִשְׁפָּט न्याय और न्यायिक निर्णय दोनों को सूचित कर सकता है। संदर्भ में परमेश्वर की न्यायपूर्ण नैतिक व्यवस्था पर प्रश्न है, इसलिए मुख्य पाठ में ‘न्याय’ उपयुक्त है और वैकल्पिक न्यायिक अर्थ पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: परमेश्वर को ‘थका देने’ का मानवरूपी वर्णन
  choice: ‘तुमने ... याहवे को थका दिया है’ की सजीव भाषा बनाए रखी गई
  alternative: ‘तुमने याहवे को अप्रसन्न किया है’ या ‘उस पर बोझ डाला है’
  rationale: इब्रानी पाठ स्पष्टतः थकाने की भाषा प्रयोग करता है। इसे अमूर्त बनाना भविष्यद्वक्ता की फटकार और पाठ में निहित मानवरूपी तनाव को कम कर देता।
- issue: מִשְׁפָּט का अर्थ
  choice: न्याय
  alternative: न्यायिक निर्णय
  rationale: शिकायत परमेश्वर के न्यायपूर्ण शासन की प्रत्यक्ष अनुपस्थिति के बारे में है, केवल किसी अदालती दण्डादेश के बारे में नहीं। फिर भी शब्द का न्यायिक पहलू पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रखी गई है। प्रश्नोत्तर की भविष्यद्वक्तीय तीक्ष्णता, ईश्वरीय नाम और मूल पाठ की मानवरूपी अभिव्यक्ति सुरक्षित हैं। पादटिप्पणी-चिह्न उस पदांश के बाद रखा गया है जिससे उसका वास्तविक संबंध है।
