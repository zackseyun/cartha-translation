id: MAL.2.10
reference: Malachi 2:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הֲ/ל֨וֹא אָ֤ב אֶחָד֙ לְ/כֻלָּ֔/נוּ הֲ/ל֛וֹא אֵ֥ל אֶֽחָ֖ד בְּרָאָ֑/נוּ מַדּ֗וּעַ נִבְגַּד֙ אִ֣ישׁ בְּ/אָחִ֔י/ו לְ/חַלֵּ֖ל בְּרִ֥ית אֲבֹתֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/010.yaml
  text: Do we not all have one Father? Has not one God created us? Why then are we faithless[a], each man to his brother[b], profaning the covenant of our fathers?
translation:
  language: hi
  text: क्या हम सबका एक ही पिता नहीं है?[a] क्या एक ही परमेश्वर ने हमारी सृष्टि नहीं की? फिर हममें से हर एक अपने भाई के साथ विश्वासघात क्यों करता है और हमारे पुरखाओं की वाचा को अपवित्र क्यों करता है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘एक ही पिता’ से यहाँ परमेश्वर अभिप्रेत हो सकता है, जैसा कि समानांतर वाक्य, ‘एक ही परमेश्वर ने हमारी सृष्टि की,’ संकेत करता है; कुछ लोग इसे सबके साझा वाचागत पूर्वज के अर्थ में समझते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: הֲלוֹא
  choice: क्या ... नहीं है / क्या ... नहीं की
  rationale: यह सकारात्मक उत्तर की अपेक्षा रखने वाले आलंकारिक प्रश्नों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אָב אֶחָד
  choice: एक ही पिता
  rationale: ‘एक’ पर दिए गए बल को बनाए रखता है और पिता की पहचान को मुख्य पाठ में अनावश्यक रूप से निश्चित नहीं करता।
- source_word: אֵל אֶחָד
  choice: एक ही परमेश्वर
  rationale: एक परमेश्वर पर मूल के बल और एकेश्वरवादी आशय को स्पष्ट, स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: בְּרָאָנוּ
  choice: हमारी सृष्टि ... की
  rationale: दैवी सृजन के लिए हिन्दी का स्वाभाविक और धर्मवैचारिक भार वाला पद है।
- source_word: נִבְגַּד
  choice: विश्वासघात करता है
  rationale: בגד के संबंधपरक और वाचागत विश्वासहीनता अथवा छलपूर्ण आचरण के अर्थ को सशक्त तथा बोधगम्य ढंग से व्यक्त करता है।
- source_word: אִישׁ בְּאָחִיו
  choice: हममें से हर एक अपने भाई के साथ
  rationale: वितरणात्मक एकवचन और ‘भाई’ की पुरुषवाची संबंध-संज्ञा को बनाए रखते हुए हिन्दी वाक्य को स्वाभाविक बनाता है; ‘के साथ’ संबंध के क्षेत्र को दर्शाता है, बिना मूल से अधिक शत्रुता जोड़े।
- source_word: לְחַלֵּל
  choice: अपवित्र करता है
  rationale: वाचा की पवित्रता का उल्लंघन करने के अर्थ को बनाए रखता है; समन्वित हिन्दी प्रश्न में क्रिया को स्पष्ट रूप से दोहराया गया है।
- source_word: בְּרִית אֲבֹתֵינוּ
  choice: हमारे पुरखाओं की वाचा
  rationale: मूल के संबंधसूचक विन्यास और पीढ़ीगत वाचागत निरंतरता को स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: ‘एक ही पिता’ की पहचान
  choice: मुख्य पाठ में ‘एक ही पिता’ रखा गया है।
  alternative: इसे स्पष्टतः परमेश्वर, या साझा पूर्वज अब्राहम/याकूब के रूप में समझना।
  rationale: समानांतर वाक्य ‘एक ही परमेश्वर ने हमारी सृष्टि’ परमेश्वर की ओर प्रबल संकेत करता है, पर इब्रानी अलग से ‘एक ही पिता’ कहती है; इसलिए अस्पष्टता को टिप्पणी में सुरक्षित रखा गया है।
- issue: אִישׁ ... אָחִיו में पुरुषवाची भाषा
  choice: ‘हर एक अपने भाई के साथ’
  alternative: ‘हर व्यक्ति दूसरे के साथ’ या ‘एक-दूसरे के साथ’
  rationale: मूल की पुरुषवाची एकवचन संबंध-संज्ञा को बनाए रखा गया है, जबकि ‘हममें से’ से पूरे संबोधित समुदाय में उसका वितरणात्मक प्रयोग स्पष्ट होता है।
- issue: विश्वासघात और वाचा-अपवित्रीकरण का संबंध
  choice: दो समन्वित क्रियाओं के रूप में प्रस्तुत किया गया है।
  alternative: ‘विश्वासघात करके ... वाचा को अपवित्र करते हैं’ या ‘जिससे ... वाचा अपवित्र होती है।’
  rationale: לְחַלֵּל उद्देश्य या परिणाम का भाव दे सकता है। हिन्दी में दो जुड़े हुए प्रश्नवाचक क्रियापद अर्थ-संबंध बनाए रखते हैं, पर किसी एक व्याकरणिक संबंध को अत्यधिक निश्चित नहीं करते।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सर्वसाधारण के लिए बोधगम्य हिन्दी। ‘परमेश्वर’, ‘सृष्टि’, ‘वाचा’ और ‘अपवित्र’ जैसे स्थापित बाइबलीय पद रखे गए हैं। मुख्य पाठ में मौजूद [a] का संगत पाद-टिप्पणी marker दिया गया है।
