  yaml_path: translation/ot/malachi/002/001.yaml
  text: And now[a], this command is for you, O priests.
translation:
  language: hi
  text: और अब, हे याजको, यह आज्ञा तुम्हारे लिए है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: और अब
  rationale: संयोजक और काल-सूचक अभिव्यक्ति पिछले उलाहने से सीधे वर्तमान संबोधन की ओर मोड़ को बनाए रखती है।
- source_word: אֲלֵיכֶם
  choice: तुम्हारे लिए
  rationale: אֶל का मूल भाव ‘की ओर/को’ है; इस विधेयात्मक रचना में ‘तुम्हारे लिए’ स्वाभाविक हिन्दी में स्पष्ट करता है कि आज्ञा विशेष रूप से याजकों को संबोधित है।
- source_word: הַמִּצְוָה
  choice: आज्ञा
  rationale: מִצְוָה किसी आदेश या अनिवार्य निर्देश को दर्शाता है; भविष्यद्वाणी की चेतावनी के प्रसंग में ‘आज्ञा’ सीधा और उपयुक्त है।
- source_word: הַזֹּאת
  choice: यह
  rationale: निकटवाचक संकेतवाचक को संज्ञा से पहले रखकर सामान्य हिन्दी शब्दक्रम अपनाया गया है।
- source_word: הַכֹּהֲנִים
  choice: हे याजको
  rationale: संज्ञा यहाँ प्रत्यक्ष संबोधन है; ‘हे याजको’ उसकी संबोधनात्मक शक्ति को गरिमापूर्ण और स्पष्ट हिन्दी में व्यक्त करता है।
