reference: Malachi 2:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/גַם אֲנִ֞י נָתַ֧תִּי אֶתְ/כֶ֛ם נִבְזִ֥ים וּ/שְׁפָלִ֖ים לְ/כָל הָ/עָ֑ם כְּ/פִ֗י אֲשֶׁ֤ר אֵֽינְ/כֶם֙ שֹׁמְרִ֣ים אֶת דְּרָכַ֔/י וְ/נֹשְׂאִ֥ים פָּנִ֖ים בַּ/תּוֹרָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/009.yaml
  text: So I also have made you despised and abased before all the people[a], because you are not keeping my ways but are showing partiality in the law.
translation:
  language: hi
  text: इसलिए मैंने भी तुम्हें सब लोगों के सामने तिरस्कृत और नीचा कर दिया है, क्योंकि तुम मेरे मार्गों पर नहीं चलते और व्यवस्था[a] में पक्षपात करते हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शिक्षा” अथवा “तोराह”।
    reason: תּוֹרָה का अर्थ इस संदर्भ में व्यवस्था, शिक्षा या विशिष्ट रूप से तोराह हो सकता है।
lexical_decisions:
- source_word: וְגַם אֲנִי
  choice: इसलिए मैंने भी
  rationale: संयोजक और बलसूचक सर्वनाम पिछले दंड-वचन से संबंध तथा प्रत्युत्तरात्मक भाव व्यक्त करते हैं; ‘इसलिए...भी’ इसे स्वाभाविक हिन्दी में रखता है।
- source_word: נָתַתִּי אֶתְכֶם
  choice: तुम्हें ... कर दिया है
  rationale: נתן के बाद विधेय विशेषण होने से यहाँ परिणामकारी अर्थ है—किसी को ऐसी दशा में पहुँचा देना।
- source_word: נִבְזִים וּשְׁפָלִים
  choice: तुच्छ और नीचा
  rationale: पहला शब्द तिरस्कार का पात्र होने और दूसरा पद अथवा प्रतिष्ठा में गिराए जाने का भाव देता है; यह जोड़ी मूल की सामाजिक लज्जा को बिना अनावश्यक तीव्रता के व्यक्त करती है।
- source_word: לְכָל הָעָם
  choice: सब लोगों के सामने
  rationale: यह उस सार्वजनिक क्षेत्र को व्यक्त करता है जिसमें उनका अपमान प्रकट हुआ।
- source_word: כְּפִי אֲשֶׁר
  choice: क्योंकि
  rationale: इस प्रसंग में पदबंध दंड का आधार बताता है, इसलिए कारणसूचक ‘क्योंकि’ उपयुक्त है।
- source_word: אֵינְכֶם שֹׁמְרִים אֶת דְּרָכַי
  choice: तुम मेरे मार्गों पर नहीं चलते
  rationale: शाब्दिक ‘मेरे मार्गों को नहीं मानते/रखते’ की अपेक्षा यह स्वाभाविक हिन्दी है और आज्ञापालन के वाचा-संबंधी भाव को बनाए रखती है।
- source_word: וְנֹשְׂאִים פָּנִים
  choice: पक्षपात करते हो
  rationale: शाब्दिक ‘चेहरा उठाना’ एक मुहावरा है जिसका अर्थ पक्षपात या अनुचित अनुग्रह दिखाना है।
- source_word: בַּתּוֹרָה
  choice: व्यवस्था के विषय में
  rationale: בְּ यहाँ तोराह के व्यवहार, शिक्षा या अनुप्रयोग के क्षेत्र को सूचित करता है। ‘व्यवस्था’ न्यायिक-वाचागत संदर्भ में सुबोध है, जबकि पादटिप्पणी व्यापक अर्थ सुरक्षित रखती है।
theological_decisions:
- issue: याजकीय संदर्भ में תּוֹרָה का अनुवाद
  choice: व्यवस्था
  alternative: शिक्षा; तोराह
  rationale: याजकों को परमेश्वर के प्रकट मानदंड के शिक्षण या प्रयोग में पक्षपात के लिए डाँटा गया है। ‘व्यवस्था’ न्यायिक और वाचागत संदर्भ स्पष्ट करती है; पादटिप्पणी शब्द की व्यापक अर्थ-सीमा बनाए रखती है।
- issue: सार्वजनिक अपमान की भाषा
  choice: सब लोगों के सामने तुच्छ और नीचा कर दिया है
  alternative: सब लोगों की दृष्टि में तिरस्कृत और अपमानित कर दिया है
  rationale: चुना हुआ पाठ दैवी न्याय के रूप में सार्वजनिक प्रतिष्ठा-ह्रास को व्यक्त करता है और मूल के दो विशेषणों का भेद यथासंभव बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन बहुवचन ‘तुम’ में रखा गया है। भाषा गरिमापूर्ण पर सामान्य पाठक के लिए सहज है। ‘नीचा कर दिया’ प्रतिष्ठा-ह्रास का भाव देता है, न कि शारीरिक स्थिति का।
