id: MAL.2.4
reference: Malachi 2:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וִֽ/ידַעְתֶּ֕ם כִּ֚י שִׁלַּ֣חְתִּי אֲלֵי/כֶ֔ם אֵ֖ת הַ/מִּצְוָ֣ה הַ/זֹּ֑את לִֽ/הְי֤וֹת בְּרִיתִ/י֙ אֶת לֵוִ֔י אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/004.yaml
  text: Then you will know that I have sent this command to you[a], that my covenant with Levi may be[b], says Yahweh of Armies.
translation:
  language: hi
  text: तब तुम जानोगे कि मैंने यह आज्ञा तुम्हारे पास भेजी है, कि लेवी के साथ मेरी वाचा हो[a]—यह सेनाओं का यहोवा[b] का वचन है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी वाक्य संक्षिप्त है। इसका अर्थ यह भी हो सकता है, “ताकि लेवी के साथ मेरी वाचा बनी रहे,” या अधिक शाब्दिक रूप में, “लेवी के साथ मेरी वाचा होने के लिए।”
    reason: alternative_reading
  - marker: b
    text: 'परम्परागत अनुवाद: “सेनाओं का प्रभु।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וִידַעְתֶּם
  choice: तब तुम जानोगे
  rationale: वाव से जुड़ा यह पूर्ण क्रियारूप प्रसंग में घोषित दण्ड के परिणामस्वरूप भविष्य में होने वाली पहचान बताता है; ‘तब’ उस परिणाम-संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כִּי
  choice: कि
  rationale: यह उस बात की विषय-वस्तु प्रस्तुत करता है जिसे याजक जानेंगे, न कि मुख्यतः कारण बताता है।
- source_word: שִׁלַּחְתִּי אֲלֵיכֶם
  choice: मैंने ... तुम्हारे पास भेजी है
  rationale: पूर्ण क्रिया का वर्तमान-परिणाम यहाँ उपयुक्त है और אֶל आज्ञा के प्राप्तकर्ताओं की ओर दिशा दर्शाता है।
- source_word: הַמִּצְוָה הַזֹּאת
  choice: यह आज्ञा
  rationale: מִצְוָה के लिए ‘आज्ञा’ आधुनिक हिन्दी में स्वाभाविक और इस भविष्यद्वाणी की चेतावनी के अनुकूल है।
- source_word: לִהְיוֹת בְּרִיתִי אֶת־לֵוִי
  choice: ताकि लेवी के साथ मेरी वाचा हो
  rationale: यह जानबूझकर अपेक्षाकृत शाब्दिक रखा गया है, क्योंकि इब्रानी उद्देश्य-वाक्य संक्षिप्त और अर्थ की दृष्टि से खुला है। ‘लेवी’ के एकवचन नाम और אֶת के साहचर्य-अर्थ को सुरक्षित रखा गया है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का यहोवा
  rationale: ‘यहोवा’ नाम को हिन्दी में प्रचलित रूप से रखता है और צְבָאוֹת के बहुवचन तथा सामरिक भाव को ‘सेनाओं’ से स्पष्ट करता है।
- source_word: אָמַר
  choice: का वचन है
  rationale: भविष्यद्वक्ताओं के संदेश-सूत्र ‘कहता है’ का यह स्वाभाविक और गरिमापूर्ण हिन्दी रूप है।
theological_decisions:
- issue: लेवी के साथ वाचा से जुड़े उद्देश्य-वाक्य का अर्थ
  choice: आज्ञा इसलिए भेजी गई कि ‘लेवी के साथ मेरी वाचा हो।’
  alternative: आज्ञा इसलिए भेजी गई कि लेवी के साथ परमेश्वर की वाचा बनी रहे; अथवा यह आज्ञा स्वयं लेवी के साथ वाचा के रूप में भेजी गई।
  rationale: לִהְיוֹת בְּרִיתִי אֶת־לֵוִי अत्यन्त संक्षिप्त है। मुख्य पाठ ‘जारी रहे’ या ‘फिर से स्थापित हो’ जोड़कर अर्थ का निर्णय नहीं करता; सम्भावित निरन्तरता को पादटिप्पणी में बताया गया है।
- issue: लेवी का व्यक्तिगत या सामूहिक संकेत
  choice: लेवी
  alternative: लेवीय/लेवीवंशी याजक
  rationale: इब्रानी पाठ व्यक्ति का नाम एकवचन में देता है, जो प्रसंग में याजकीय वंश का सामूहिक प्रतिनिधित्व कर सकता है। अनुवाद मूल रूप को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण भविष्यद्वाणी-शैली रखी गई है। ‘तुम’ बहुवचन याजकीय श्रोताओं को संबोधित करता है। संक्षिप्त इब्रानी उद्देश्य-वाक्य की असहजता को पूरी तरह समतल नहीं किया गया, ताकि उसकी वास्तविक अर्थगत खुलावट बनी रहे।
