id: MAL.2.6
reference: Malachi 2:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: תּוֹרַ֤ת אֱמֶת֙ הָיְתָ֣ה בְּ/פִ֔י/הוּ וְ/עַוְלָ֖ה לֹא נִמְצָ֣א בִ/שְׂפָתָ֑י/ו בְּ/שָׁל֤וֹם וּ/בְ/מִישׁוֹר֙ הָלַ֣ךְ אִתִּ֔/י וְ/רַבִּ֖ים הֵשִׁ֥יב מֵ/עָוֺֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/006.yaml
  text: The law of truth was in his mouth[a], and no injustice was found on his lips. He walked with me in peace and uprightness[c][b], and he turned many back from iniquity.
translation:
  language: hi
  text: सत्य की व्यवस्था उसके मुँह में थी[a], और उसके होंठों पर कोई अन्याय नहीं पाया गया[b]। वह शांति और खराई से मेरे साथ चला, और उसने बहुतों को अधर्म से फेर दिया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सच्ची शिक्षा उसके मुँह में थी।”
    reason: תּוֹרָה का अर्थ इस याजकीय संदर्भ में ‘शिक्षा’ या ‘निर्देश’ भी हो सकता है।
  - marker: b
    text: या, “कोई बुराई” अथवा “कोई अधार्मिकता उसके होंठों पर नहीं पाई गई।”
    reason: עַוְלָה के अर्थ-क्षेत्र में अन्याय, बुराई और अधार्मिकता सम्मिलित हैं।
  - marker: c
    text: या, “उसने बहुतों को पाप से लौटाया।”
    reason: הֵשִׁיב कारणवाचक है और עָוֹן का अनुवाद यहाँ ‘पाप’ भी किया जा सकता है।
lexical_decisions:
- source_word: תּוֹרַת אֱמֶת
  choice: सत्य की व्यवस्था
  rationale: תּוֹרָה में व्यवस्था, शिक्षा और निर्देश—तीनों का भाव हो सकता है। मुख्य पाठ में ‘व्यवस्था’ रखने से वाचा और तोराह से जुड़ा अर्थ बना रहता है; संदर्भानुसार ‘सच्ची शिक्षा’ को पादटिप्पणी में दिया गया है।
- source_word: בְּפִיהוּ
  choice: उसके मुँह में
  rationale: यह वाणी और शिक्षा के लिए प्रयुक्त इब्रानी मुहावरे को निकटता से और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עַוְלָה
  choice: अन्याय
  rationale: यह शब्द अन्याय, बुराई या अधार्मिकता का बोध करा सकता है। याजकीय वाणी की नैतिक शुद्धता के संदर्भ में ‘अन्याय’ उपयुक्त है, जबकि व्यापक विकल्प पादटिप्पणी में सुरक्षित हैं।
- source_word: נִמְצָא
  choice: पाया गया
  rationale: निफ़अल रूप के कर्मवाच्य और परिणामसूचक भाव को बनाए रखता है।
- source_word: בִשְׂפָתָיו
  choice: उसके होंठों पर
  rationale: बोले गए शब्दों के लिए इब्रानी चित्रात्मक मुहावरे को हिन्दी में स्वाभाविक रूप से बनाए रखता है।
- source_word: בְּשָׁלוֹם
  choice: शांति से
  rationale: यह केवल संघर्ष की अनुपस्थिति नहीं, बल्कि मेल और संपूर्णता का भाव भी व्यक्त करता है।
- source_word: וּבְמִישׁוֹר
  choice: और खराई से
  rationale: מִישׁוֹר का मूल भाव सीधापन या समतलता है और लाक्षणिक अर्थ नैतिक सीधाई है। ‘खराई’ आधुनिक हिन्दी में आचरण की निष्कपट सीधाई को सहज ढंग से व्यक्त करता है।
- source_word: הָלַךְ אִתִּי
  choice: मेरे साथ चला
  rationale: परमेश्वर के साथ चलने के वाचागत और संबंधपरक मुहावरे को बिना व्याख्यात्मक रूप से सीमित किए सुरक्षित रखता है।
- source_word: וְרַבִּים
  choice: बहुतों को
  rationale: बहुवचन संज्ञीकृत विशेषण का सीधा और स्वाभाविक अनुवाद है।
- source_word: הֵשִׁיב
  choice: फेर दिया
  rationale: 'שׁוב के हिफ़ील रूप का कारणवाचक भाव व्यक्त करता है: उसने दूसरों को लौटने या मुड़ने के लिए प्रेरित किया।'
- source_word: מֵעָוֺן
  choice: अधर्म से
  rationale: עָוֹן अधर्म, दोष या दोष-दंड का अर्थ दे सकता है। यहाँ लोगों को जिस नैतिक बुराई से फेरा गया, उसके लिए ‘अधर्म’ सबसे उपयुक्त है।
theological_decisions:
- issue: याजकीय תּוֹרָה का स्वरूप
  choice: मुख्य पाठ में ‘सत्य की व्यवस्था’
  alternative: ‘सच्ची शिक्षा’ या ‘सत्य की शिक्षा’
  rationale: यह लेवी अथवा आदर्श याजक की शिक्षकीय भूमिका का वर्णन है। ‘व्यवस्था’ तोराह और वाचा से संबंध बनाए रखती है, जबकि पादटिप्पणी शिक्षण वाले प्रासंगिक अर्थ को स्पष्ट करती है।
- issue: परमेश्वर के साथ चलने का वाचागत मुहावरा
  choice: ‘मेरे साथ चला’ को यथावत रखा गया
  alternative: ‘मेरे साथ संगति में रहा’ या ‘मेरे सामने अपना जीवन बिताया’
  rationale: मूल मुहावरे में आचरण और संबंध दोनों निहित हैं; शाब्दिक चित्र को बनाए रखने से उसकी धर्मवैचारिक गहराई किसी एक व्याख्या तक सीमित नहीं होती।
- issue: लोगों को अधर्म से लौटाने में कारणवाचकता
  choice: ‘उसने बहुतों को अधर्म से फेर दिया’
  alternative: ‘उसने बहुतों को पाप से लौटाया’
  rationale: हिफ़ील रूप याजक की प्रभावी भूमिका दिखाता है, पर यह नहीं बताता कि परिवर्तन किस विधि से हुआ। इसलिए कारणवाचक भाव रखा गया और उससे आगे कोई सिद्धान्तगत निष्कर्ष नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज रखी गई है। ‘मुँह’, ‘होंठ’, और ‘मेरे साथ चला’ जैसे मूल के चित्रात्मक मुहावरों को सुरक्षित रखा गया है; ‘खराई’ नैतिक सीधाई को साधारण पाठक के लिए स्वाभाविक ढंग से व्यक्त करती है।
