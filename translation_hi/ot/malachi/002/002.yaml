reference: Malachi 2:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אִם לֹ֣א תִשְׁמְע֡וּ וְ/אִם לֹא֩ תָשִׂ֨ימוּ עַל לֵ֜ב לָ/תֵ֧ת כָּב֣וֹד לִ/שְׁמִ֗/י אָמַר֙ יְהוָ֣ה צְבָא֔וֹת וְ/שִׁלַּחְתִּ֤י בָ/כֶם֙ אֶת הַ/מְּאֵרָ֔ה וְ/אָרוֹתִ֖י אֶת בִּרְכֽוֹתֵי/כֶ֑ם וְ/גַם֙ אָרוֹתִ֔י/הָ כִּ֥י אֵינְ/כֶ֖ם שָׂמִ֥ים עַל לֵֽב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/002.yaml
  text: If you will not listen[a], and if you will not take it to heart to give glory to my name, says Yahweh of Armies, then I will send the curse among you, and I will curse your blessings; indeed, I have already cursed them[b], because you are not taking it to heart.
translation:
  language: hi
  text: 'यदि तुम नहीं सुनोगे और मेरे नाम को महिमा देने की बात मन पर नहीं लोगे, तो सेनाओं का यहोवा कहता है: “मैं तुम्हारे बीच शाप भेजूँगा और तुम्हारी आशीषों को शाप दूँगा। हाँ, मैं उन्हें शाप दे चुका हूँ[a], क्योंकि तुम इसे मन पर नहीं लेते।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी का अर्थ यह भी हो सकता है, “मैं उन्हें भी शाप दूँगा,” अथवा एकवचन में, “मैं उसे शाप दे चुका हूँ।”
    reason: क्रिया के कालगत बल और स्त्रीलिंग एकवचन प्रत्यय के संबंध में वास्तविक पाठगत-व्याख्यात्मक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: תִשְׁמְעוּ
  choice: सुनोगे
  rationale: मूल क्रिया का सीधा अर्थ ‘सुनना’ है और प्रसंग में उसका आशय ध्यान देना तथा आज्ञा मानना भी हो सकता है; ‘सुनोगे’ इस अर्थ-विस्तार को खुला रखता है।
- source_word: תָשִׂימוּ עַל לֵב
  choice: बात मन में रखोगे
  rationale: यह इब्रानी मुहावरा किसी बात को गंभीरता से ग्रहण करने या उस पर ध्यान देने का अर्थ देता है। यह हिंदी में स्वाभाविक है और अंतिम वाक्य में इसकी पुनरावृत्ति भी सुरक्षित रहती है।
- source_word: לָתֵת כָּבוֹד לִשְׁמִי
  choice: मेरे नाम को महिमा देने
  rationale: כָּבוֹד के लिए ‘महिमा’ भविष्यद्वाणी और उपासना-संबंधी भाषा में उपयुक्त है; ‘मेरे नाम’ को बनाए रखने से परमेश्वर के प्रकट नाम और प्रतिष्ठा पर बल बना रहता है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं के यहोवा
  rationale: यहोवा को वाचा के विशिष्ट नाम के रूप में लिप्यंतरित किया गया है और צְבָאוֹת का पारदर्शी आधुनिक अनुवाद ‘सेनाओं’ किया गया है।
- source_word: וְשִׁלַּחְתִּי בָכֶם אֶת הַמְּאֵרָה
  choice: मैं तुम्हारे बीच शाप भेजूँगा
  rationale: בָכֶם को ‘तुम्हारे बीच’ कहना शाप के उनके मध्य आने का भाव स्वाभाविक हिंदी में व्यक्त करता है। निश्चित पद הַמְּאֵרָה को प्रसंगानुकूल ‘शाप’ कहा गया है।
- source_word: וְאָרוֹתִי אֶת בִּרְכוֹתֵיכֶם
  choice: तुम्हारी आशीषों को शाप दूँगा
  rationale: सीधा कर्म ‘तुम्हारी आशीषें’ ही है। यह रूप इस अस्पष्टता को बनाए रखता है कि आशय उन्हें मिली आशीषों से है, उनके द्वारा दी गई आशीषों से, या दोनों से।
- source_word: וְגַם אָרוֹתִיהָ
  choice: सच तो यह है कि मैं उन्हें शाप दे चुका हूँ
  rationale: גַם यहाँ बल देता है और पूर्ण क्रिया वर्तमान तक घट चुकी कार्रवाई सूचित कर सकती है। स्त्रीलिंग एकवचन प्रत्यय के बावजूद निकटवर्ती बहुवचन ‘आशीषों’ के सामूहिक संदर्भ को हिंदी में ‘उन्हें’ से स्वाभाविक ढंग से व्यक्त किया गया है; वैकल्पिक समझ पादटिप्पणी में दी गई है।
- source_word: כִּי אֵינְכֶם שָׂמִים עַל לֵב
  choice: क्योंकि तुम इस बात को मन में नहीं रखते
  rationale: आरंभिक मुहावरे की पुनरावृत्ति सुरक्षित रखी गई है और अपूर्ण, जारी रवैये को वर्तमान काल में व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चतुरक्षरीय वाचा-नाम प्रत्यक्ष है। आधुनिक हिंदी बाइबल-प्रयोग में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ से इसे नाम के रूप में रखा गया है, न कि ‘प्रभु’ जैसी उपाधि से बदला गया है।
- issue: अंतिम पूर्ण क्रिया אָרוֹתִיהָ का काल और प्रत्यय
  choice: मैं उन्हें शाप दे चुका हूँ
  alternative: मैं उन्हें भी शाप दूँगा; अथवा, मैं उसे शाप दे चुका हूँ
  rationale: प्रसंग में भविष्य की चेतावनी से पूर्ण क्रिया की ओर बदलाव शाप के पहले ही आरंभ हो जाने का संकेत दे सकता है। फिर भी भविष्यसूचक पूर्ण और स्त्रीलिंग एकवचन प्रत्यय के कारण दूसरी व्याख्याएँ संभव हैं, इसलिए उन्हें पादटिप्पणी में सुरक्षित रखा गया है।
- issue: ‘तुम्हारी आशीषों’ का आशय
  choice: अर्थ को अनिर्णीत रखते हुए शाब्दिक संरचना बनाए रखना
  alternative: तुम्हें मिली आशीषें; अथवा, याजकों द्वारा उच्चारित आशीषें
  rationale: इब्रानी पद स्वयं यह स्पष्ट नहीं करता कि ये आशीषें उन्हें प्राप्त हुई हैं या उनके द्वारा बोली गई हैं। अनुवाद किसी एक धार्मिक व्याख्या को आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मन में रखना’ मुहावरे की पुनरावृत्ति मूल की वक्तृत्वात्मक संरचना को बनाए रखती है। ‘आशीष’ और ‘महिमा’ परिचित बाइबलीय शब्द हैं, पर वाक्य-विन्यास अनावश्यक रूप से पुरातन नहीं है।
