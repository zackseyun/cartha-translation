source:
  edition: WLC
  text: הִנְ/נִ֨י גֹעֵ֤ר לָ/כֶם֙ אֶת הַ/זֶּ֔רַע וְ/זֵרִ֤יתִי פֶ֨רֶשׁ֙ עַל פְּנֵי/כֶ֔ם פֶּ֖רֶשׁ חַגֵּי/כֶ֑ם וְ/נָשָׂ֥א אֶתְ/כֶ֖ם אֵלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/003.yaml
  text: Look[a], I am rebuking your offspring[c][b], and I will spread dung on your faces—the dung of your festival sacrifices—and one will carry you away with it.
translation:
  language: hi
  text: देखो, मैं तुम्हारी संतान[a] को डाँट रहा हूँ। मैं तुम्हारे चेहरों पर मल—तुम्हारे पर्वों के बलिदानों का मल[b]—बिखेर दूँगा, और कोई तुम्हें उसी के साथ उठाकर ले जाएगा।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तुम्हारे बीज’; कुछ लोग इसे संतान के बजाय अनाज या फसल के बीज का उल्लेख मानते हैं।
    reason: alternative_reading
  - marker: b
    text: इब्रानी में शाब्दिक रूप से ‘तुम्हारे पर्वों का मल’; संभवतः आशय पर्वों पर बलि किए गए पशुओं के मल या अपशिष्ट से है।
    reason: lexical_alternative
  - marker: c
    text: अंतिम वाक्यांश कठिन है। संभवतः इसका अर्थ है कि याजकों को मल या बलि के अपशिष्ट के साथ किसी अशुद्ध स्थान पर हटा दिया जाएगा; कर्ता और सर्वनाम का संदर्भ स्पष्ट नहीं है।
    reason: alternative_reading
lexical_decisions:
- source_word: הִנְנִי גֹעֵר
  choice: देखो, मैं ... को डाँट रहा हूँ
  rationale: הִנְנִי के साथ कृदन्त निकट और घोषित कार्रवाई का भाव देता है। ‘डाँट रहा हूँ’ גער का मूल अर्थ रखते हुए भविष्यसूचक न्याय की तीव्रता व्यक्त करता है।
- source_word: הַזֶּרַע
  choice: तुम्हारी सन्तान
  rationale: זֶרַע का अर्थ वास्तविक बीज या वंश/सन्तान दोनों हो सकता है। याजकों पर न्याय के इस प्रसंग में ‘सन्तान’ सम्भावित आशय को स्वाभाविक हिन्दी में व्यक्त करता है; शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: וְזֵרִיתִי
  choice: फैला दूँगा
  rationale: זרה का अर्थ बिखेरना या छितराना है। चेहरे पर गोबर डालने की छवि में ‘फैला दूँगा’ स्पष्ट, अपमानजनक और स्वाभाविक है।
- source_word: פֶּרֶשׁ
  choice: गोबर
  rationale: यह पशुओं के मल अथवा बलि-पशुओं के अपशिष्ट को सूचित करता है। ‘गोबर’ मूल की जानबूझकर कठोर और अपमानजनक भाषा बनाए रखता है।
- source_word: עַל פְּנֵיכֶם
  choice: तुम्हारे चेहरों पर
  rationale: बहुवचन रूप का सीधा और स्वाभाविक अनुवाद है तथा सार्वजनिक अपमान की छवि को बनाए रखता है।
- source_word: פֶּרֶשׁ חַגֵּיכֶם
  choice: तुम्हारे पर्वों के बलिदानों का गोबर
  rationale: शाब्दिक रूप ‘तुम्हारे पर्वों का गोबर’ है, पर प्रसंग में यह पर्वों पर चढ़ाए गए पशुओं के मल अथवा अपशिष्ट को सूचित करता है। मुख्य पाठ में निहित बलिदानी सन्दर्भ स्पष्ट किया गया है और शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: וְנָשָׂא אֶתְכֶם אֵלָיו
  choice: और कोई तुम्हें उसी के साथ उठाकर ले जाएगा
  rationale: एकवचन क्रिया का कर्ता स्पष्ट नहीं है। ‘कोई’ अनिर्दिष्ट कर्ता को बनाए रखता है, और ‘उसी के साथ’ गोबर/अपशिष्ट के साथ हटाए जाने की सम्भावित छवि व्यक्त करता है, बिना कर्ता की पहचान निश्चित किए।
theological_decisions:
- issue: याजकीय न्याय में הַזֶּרַע का आशय
  choice: सन्तान
  alternative: बीज, अर्थात अनाज या फसल का बीज
  rationale: सम्बोधन याजकों से है और न्याय उनके वंश तक पहुँच सकता है, इसलिए ‘सन्तान’ प्रसंगानुकूल है। फिर भी कृषि-संबंधी अर्थ सम्भव है और उसे पादटिप्पणी में सुरक्षित रखा गया है।
- issue: अन्तिम वाक्यांश וְנָשָׂא אֶתְכֶם אֵלָיו की कठिन वाक्य-रचना
  choice: कोई याजकों को गोबर/अपशिष्ट के साथ उठाकर ले जाएगा
  alternative: वह/यह तुम्हें उसकी ओर ले जाएगा; अथवा तुम्हें उसके साथ हटा दिया जाएगा
  rationale: मूल में एकवचन कर्ता और सर्वनाम का सन्दर्भ अस्पष्ट है। अनिर्दिष्ट कर्ता वाला अनुवाद अपशिष्ट के साथ अशुद्ध स्थान पर हटाए जाने की सम्भावित न्याय-छवि देता है, पर पादटिप्पणी कठिनाई और विकल्पों को खुला रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किन्तु सीधी भविष्यसूचक भाषा रखी गई है। ‘गोबर’ मूल की कठोर अपमान-छवि को नरम नहीं करता। ‘सन्तान’ सहज है, जबकि ‘बीज’ की वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है।
