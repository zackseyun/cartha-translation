id: MAL.2.8
reference: Malachi 2:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אַתֶּם֙ סַרְתֶּ֣ם מִן הַ/דֶּ֔רֶךְ הִכְשַׁלְתֶּ֥ם רַבִּ֖ים בַּ/תּוֹרָ֑ה שִֽׁחַתֶּם֙ בְּרִ֣ית הַ/לֵּוִ֔י אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/008.yaml
  text: But you have turned aside from the way; you have caused many to stumble in the law; you have corrupted the covenant of Levi[a], says Yahweh of hosts.
translation:
  language: hi
  text: परन्तु तुम मार्ग से हट गए हो; तुमने व्यवस्था[a] में बहुतों को ठोकर खिलाई है; तुमने लेवी की वाचा को भ्रष्ट कर दिया है, सेनाओं का यहोवा कहता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘व्यवस्था’ के लिए प्रयुक्त इब्रानी शब्द का अर्थ ‘शिक्षा’ भी हो सकता है। वाक्यांश का अनुवाद ‘व्यवस्था के द्वारा’ या ‘अपनी शिक्षा के द्वारा’ भी किया जा सकता है।
    reason: תּוֹרָה की अर्थ-सीमा और בְּ के संबंध की वास्तविक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: סַרְתֶּם מִן הַדֶּרֶךְ
  choice: तुम मार्ग से भटक गए हो
  rationale: यह अनुवाद मार्ग से हटने के मूल रूपक और नैतिक अर्थ दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: הִכְשַׁלְתֶּם רַבִּים
  choice: तुमने ... बहुतों को ठोकर खिलाई है
  rationale: हिफ़ील रूप के कारणवाचक अर्थ को स्पष्ट करता है और नैतिक अथवा आत्मिक पतन की छवि सुरक्षित रखता है।
- source_word: בַּתּוֹרָה
  choice: व्यवस्था के विषय में
  rationale: בְּ के प्रसंगगत क्षेत्र-सूचक अर्थ को व्यक्त करता है और यह बताता है कि ठोकर याजकों की व्यवस्था-संबंधी शिक्षा में लगी; साधनवाचक ‘व्यवस्था के द्वारा’ जैसा संभावित भ्रामक अर्थ नहीं देता।
- source_word: שִׁחַתֶּם
  choice: बिगाड़ दिया है
  rationale: पिएल क्रिया के भ्रष्ट अथवा नष्ट करने के अर्थ को सरल, स्वाभाविक हिन्दी में व्यक्त करता है, बिना इसे केवल विधिक उल्लंघन तक सीमित किए।
- source_word: בְּרִית הַלֵּוִי
  choice: लेवी की वाचा
  rationale: इब्रानी संबंधवाचक रचना को सीधे बनाए रखता है; इसका आशय लेवी से संबद्ध वाचा है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं के यहोवा
  rationale: व्यक्तिगत दिव्य नाम और צְבָאוֹת की सामर्थ्यपूर्ण उपाधि दोनों को स्पष्ट आधुनिक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: תּוֹרָה का अर्थ
  choice: व्यवस्था
  alternative: शिक्षा
  rationale: याजकीय और वाचागत प्रसंग में ‘व्यवस्था’ उपयुक्त है, जबकि ‘शिक्षा’ वास्तविक शाब्दिक संभावना है और पादटिप्पणी में सुरक्षित है।
- issue: בַּתּוֹרָה में בְּ का संबंध
  choice: व्यवस्था के विषय में
  alternative: व्यवस्था के द्वारा / व्यवस्था में
  rationale: इब्रानी वाक्यांश यह स्पष्ट नहीं करता कि ठोकर व्यवस्था को साधन बनाकर लगी, व्यवस्था के क्षेत्र में लगी, या शिक्षा के कारण लगी। मुख्य पाठ स्वाभाविक हिन्दी में क्षेत्र-संबंधी अर्थ देता है और विकल्प पादटिप्पणी में रखता है।
- issue: בְּרִית הַלֵּוִי का संबंध
  choice: लेवी की वाचा
  alternative: लेवी के साथ की वाचा
  rationale: मूल का संबंधवाचक रूप यथावत रखा गया है और यह तय नहीं किया गया कि लेवी से व्यक्तिगत रूप से की गई वाचा अभिप्रेत है या लेवीय याजकाई से संबद्ध वाचा।
- issue: दिव्य नाम יְהוָה
  choice: यहोवा
  alternative: याहवे
  rationale: हिन्दी पाठकों में परिचित नाम-रूप ‘यहोवा’ मूल में उपस्थित व्यक्तिगत दिव्य नाम को उपाधि से प्रतिस्थापित किए बिना व्यक्त करता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध हिन्दी। ‘परन्तु’, ‘वाचा’ और भविष्यवाणी-सूत्र ‘यही वचन है’ बाइबलीय गंभीरता बनाए रखते हैं; वाक्य-विन्यास मूल के तीन आरोपों की समानांतर संरचना को सुरक्षित रखता है।
