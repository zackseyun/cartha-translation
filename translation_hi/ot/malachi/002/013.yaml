id: MAL.2.13
reference: Malachi 2:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/זֹאת֙ שֵׁנִ֣ית תַּֽעֲשׂ֔וּ כַּסּ֤וֹת דִּמְעָה֙ אֶת מִזְבַּ֣ח יְהוָ֔ה בְּכִ֖י וַֽ/אֲנָקָ֑ה מֵ/אֵ֣ין ע֗וֹד פְּנוֹת֙ אֶל הַ/מִּנְחָ֔ה וְ/לָ/קַ֥חַת רָצ֖וֹן מִ/יֶּדְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/013.yaml
  text: 'And this second thing you do: you cover the altar of Yahweh with tears[a], with weeping and groaning, because he no longer regards the offering or accepts it with favor from your hand.'
translation:
  language: hi
  text: 'और यह दूसरा काम भी तुम करते हो: तुम यहोवा की वेदी को आँसुओं से ढक देते हो, रोते और कराहते हुए, क्योंकि वह अब भेंट पर ध्यान नहीं देता और न उसे तुम्हारे हाथ से प्रसन्नतापूर्वक स्वीकार करता है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְזֹאת שֵׁנִית
  choice: और तुम यह दूसरा काम भी करते हो
  rationale: यह पद एक और आरोप प्रस्तुत करता है। ‘दूसरा काम’ שֵׁנִית के क्रमसूचक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: כַּסּוֹת דִּמְעָה אֶת מִזְבַּח יְהוָה
  choice: तुम आँसुओं ... से यहोवा की वेदी को ढक देते हो
  rationale: כסה का मूल चित्र ‘ढकना’ है; इसे बनाए रखने से भविष्यद्वक्ता की सजीव अभिव्यक्ति सुरक्षित रहती है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के व्यक्तिगत नाम के प्रचलित लिप्यंतरण ‘यहोवा’ का प्रयोग किया गया है, किसी उपाधि से उसका प्रतिस्थापन नहीं किया गया।
- source_word: בְּכִי וַאֲנָקָה
  choice: रोने और कराहने
  rationale: בְּכִי रोने और אֲנָקָה पीड़ा-भरी कराह को व्यक्त करता है; यह युग्म आधुनिक हिन्दी में स्वाभाविक और अर्थानुरूप है।
- source_word: מֵאֵין עוֹד פְּנוֹת אֶל הַמִּנְחָה
  choice: क्योंकि वह अब तुम्हारी भेंट पर ध्यान नहीं देता
  rationale: פנה אל यहाँ किसी वस्तु की ओर अनुकूल ध्यान देने के अर्थ में है। ‘ध्यान नहीं देता’ हिन्दी में प्रसंगानुकूल है; ‘तुम्हारी’ अगले वाक्यांश מִיֶּדְכֶם से स्पष्ट संबंध को स्वाभाविक बनाता है।
- source_word: הַמִּנְחָה
  choice: भेंट
  rationale: מִנְחָה विशेष रूप से अन्नबलि और व्यापक रूप से भेंट का अर्थ दे सकता है। मुख्य पाठ में व्यापक ‘भेंट’ रखा गया है और विशिष्ट विकल्प पादटिप्पणी में दिया गया है।
- source_word: וְלָקַחַת רָצוֹן מִיֶּדְכֶם
  choice: न उसे तुम्हारे हाथ से प्रसन्नतापूर्वक स्वीकार करता है
  rationale: לקח और רצון का संयुक्त भाव अनुकूल स्वीकृति है। यह अनुवाद उपासक के हाथ से ग्रहण किए जाने की स्रोत-छवि भी बनाए रखता है।
theological_decisions:
- issue: अंतिम खंड में ‘ध्यान देता’ और ‘स्वीकार करता’ का निहित कर्ता
  choice: कर्ता को ‘वह’ के रूप में व्यक्त किया गया है, जिसका संदर्भ यहोवा है
  alternative: 'खंड को निर्वैयक्तिक रखना: ‘भेंट पर अब ध्यान नहीं दिया जाता’'
  rationale: इब्रानी वाक्य संक्षिप्त है, पर निकट संदर्भ में वेदी यहोवा की है और भेंट को अस्वीकार करने वाला वही है। हिन्दी में ‘वह’ अर्थ स्पष्ट करता है, बिना कोई नया धर्मवैज्ञानिक निष्कर्ष जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। आरोप की तीव्रता और वेदी को आँसुओं से ढकने का काव्यात्मक चित्र सुरक्षित रखा गया है।
