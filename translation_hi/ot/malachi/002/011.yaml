source:
  edition: WLC
  text: בָּגְדָ֣ה יְהוּדָ֔ה וְ/תוֹעֵבָ֛ה נֶעֶשְׂתָ֥ה בְ/יִשְׂרָאֵ֖ל וּ/בִ/ירֽוּשָׁלִָ֑ם כִּ֣י חִלֵּ֣ל יְהוּדָ֗ה קֹ֤דֶשׁ יְהוָה֙ אֲשֶׁ֣ר אָהֵ֔ב וּ/בָעַ֖ל בַּת אֵ֥ל נֵכָֽר׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/011.yaml
  text: Judah has acted treacherously[a], and an abomination has been committed in Israel and in Jerusalem, for Judah has profaned the sanctuary of Yahweh, which he loves[b], and has married the daughter of a foreign god.
translation:
  language: hi
  text: यहूदा ने विश्वासघात किया है, और इस्राएल तथा यरूशलेम में एक घृणित कार्य हुआ है; क्योंकि यहूदा ने याहवे की पवित्र वस्तु को, जिससे वह प्रेम करता था[a], अपवित्र किया है और पराए देवता की बेटी से विवाह किया है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘याहवे की पवित्र वस्तु’ का अनुवाद ‘याहवे का पवित्रस्थान’ या ‘याहवे के पवित्र लोग’ भी हो सकता है। इब्रानी पदबंध का सटीक संदर्भ स्पष्ट नहीं है। ‘वह’ यहूदा को सूचित करता है।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक अर्थ, ‘पराए देवता की बेटी’; संभवतः आशय ऐसी स्त्री से है जो पराए देवता की उपासना से जुड़ी थी।
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּגְדָה
  choice: विश्वासघात किया है
  rationale: यह क्रिया वाचा और संबंध के प्रति बेवफ़ाई का बोध कराती है। ‘विश्वासघात’ उसके नैतिक और संबंधपरक बल को बनाए रखता है, बिना विश्वासघात के लक्ष्य को अनावश्यक रूप से निश्चित किए।
- source_word: תוֹעֵבָה נֶעֶשְׂתָה
  choice: एक घृणित काम किया गया है
  rationale: ‘घृणित काम’ प्रबल धार्मिक-नैतिक निंदा व्यक्त करता है, और कर्मवाच्य ‘किया गया है’ इब्रानी נֶעֶשְׂתָה को सुरक्षित रखता है।
- source_word: חִלֵּל
  choice: अपवित्र किया है
  rationale: पवित्र मानी गई वस्तु, स्थिति या समुदाय को साधारण अथवा दूषित ठहराने के अर्थ में ‘अपवित्र किया’ स्वाभाविक और सटीक है।
- source_word: קֹדֶשׁ יְהוָה
  choice: याहवे की ... पवित्रता
  rationale: इब्रानी पदबंध का संदर्भ अस्पष्ट है—यह याहवे की पवित्रता, उसकी पवित्र वस्तु/स्थान, या उसके पवित्र लोगों की ओर संकेत कर सकता है। मुख्य पाठ में ‘पवित्रता’ रखकर किसी एक ठोस संदर्भ को निर्णायक नहीं बनाया गया।
- source_word: אֲשֶׁר אָהֵב
  choice: जिससे वह प्रेम करता था
  rationale: पूर्ण क्रिया के भूतकालिक रूप को दर्शाया गया है। इब्रानी में कर्ता व्यक्त नहीं है; हिन्दी का ‘वह’ भी यह निश्चित नहीं करता कि संकेत यहूदा की ओर है या याहवे की ओर।
- source_word: וּבָעַל
  choice: विवाह किया है
  rationale: स्त्री के संबंध में בעל का प्रासंगिक अर्थ पति बनना या विवाह करना है।
- source_word: בַּת אֵל נֵכָר
  choice: पराए देवता की बेटी
  rationale: शाब्दिक, धार्मिक रूप से आवेशित रूपक को बनाए रखा गया है, ताकि इसे केवल जातीय विदेशीपन तक सीमित न कर दिया जाए।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार-अक्षरीय व्यक्तिगत ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में प्रस्तुत किया गया है।
theological_decisions:
- issue: קֹדֶשׁ יְהוָה का संदर्भ
  choice: मुख्य पाठ में ‘याहवे की पवित्रता’ और पादटिप्पणी में संभावित ठोस संदर्भ
  alternative: याहवे का पवित्रस्थान; याहवे के पवित्र लोग; याहवे की पवित्र वस्तु
  rationale: इब्रानी कई निकट-संबंधित अर्थों की अनुमति देता है। किसी एक को मुख्य पाठ में अंतिम ठहराने से भविष्यद्वाणी के आरोप का वास्तविक तनाव घट जाता।
- issue: אֲשֶׁר אָהֵב में प्रेम करने वाला कौन है
  choice: अस्पष्ट सर्वनाम ‘वह’ बनाए रखा
  alternative: जिससे याहवे प्रेम करता था; जिससे यहूदा प्रेम करता था
  rationale: इब्रानी क्रिया में कर्ता स्पष्ट नहीं है। हिन्दी में नाम दोहराकर अस्पष्टता को कृत्रिम रूप से समाप्त नहीं किया गया।
- issue: ‘पराए देवता की बेटी’ का अर्थ
  choice: शाब्दिक धार्मिक अभिव्यक्ति बनाए रखी
  alternative: विदेशी स्त्री; पराए देवता की उपासना करने वाली स्त्री
  rationale: यह अभिव्यक्ति विवाह को विदेशी उपासना से जोड़ती है; केवल ‘विदेशी स्त्री’ कहने पर धार्मिक आयाम दब सकता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। ‘विश्वासघात’, ‘घृणित काम’ और ‘अपवित्र’ भविष्यद्वाणी के गंभीर वाचा-संबंधी तथा धार्मिक स्वर को बनाए रखते हैं।
