language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יַכְרֵ֨ת יְהוָ֜ה לָ/אִ֨ישׁ אֲשֶׁ֤ר יַעֲשֶׂ֨/נָּה֙ עֵ֣ר וְ/עֹנֶ֔ה מֵ/אָהֳלֵ֖י יַֽעֲקֹ֑ב וּ/מַגִּ֣ישׁ מִנְחָ֔ה לַֽ/יהוָ֖ה צְבָאֽוֹת׃פ
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/012.yaml
  text: May Yahweh cut off from the tents of Jacob the man who does this[a], him who is awake and him who answers, and him who brings an offering to Yahweh of hosts.
translation:
  language: hi
  text: याहवे याकूब के तंबुओं में से उस मनुष्य को, जो ऐसा करता है—जागनेवाले और उत्तर देनेवाले[a] को, और सेनाओं के याहवे को भेंट चढ़ानेवाले को—काट डाले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ ‘जागनेवाला और उत्तर देनेवाला’ है। यह पदबंध कठिन है; इसका आशय ‘साक्षी और पक्षसमर्थक’ जैसा कोई मुहावरा हो सकता है, या इसमें शामिल हर व्यक्ति अभिप्रेत हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: יַכְרֵת
  choice: काट डाले
  rationale: हिफ़ील रूप न्याय और समुदाय से बहिष्कार के संदर्भ में ‘काट देना’ व्यक्त करता है। यहाँ अपूर्ण क्रिया का इच्छार्थक/शापसूचक बल ‘काट डाले’ से सुरक्षित रहता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय देवनागरी लिप्यंतरण में रखा गया है।
- source_word: לָאִישׁ אֲשֶׁר יַעֲשֶׂנָּה
  choice: जो मनुष्य ऐसा करता है
  rationale: एकवचन पुल्लिंग प्रतिनिधि रूप तथा स्त्रीलिंग प्रत्यय द्वारा पिछले संदर्भ की निंदित प्रथा की ओर संकेत, दोनों को सहज हिन्दी में रखा गया है।
- source_word: עֵר וְעֹנֶה
  choice: जागनेवाले और उत्तर देनेवाले
  rationale: मुहावरे का अर्थ अनिश्चित है; इसलिए मूल कृदंतों का अपेक्षाकृत पारदर्शी अनुवाद मुख्य पाठ में रखा गया और संभावित मुहावरेदार अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: מֵאָהֳלֵי יַעֲקֹב
  choice: याकूब के तंबुओं में से
  rationale: यह वाचा-समुदाय का बिंब है; ‘तंबुओं’ को बनाए रखने से मूल सामुदायिक और चित्रात्मक अर्थ सुरक्षित रहता है।
- source_word: מַגִּישׁ מִנְחָה
  choice: भेंट चढ़ाता है
  rationale: מִנְחָה भेंट, अन्नबलि या उपहार हो सकती है। यहाँ उपासना-संदर्भ स्पष्ट रखते हुए उसके प्रकार को आवश्यकता से अधिक निश्चित नहीं किया गया।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं के याहवे
  rationale: צְבָאוֹת की सैन्य/स्वर्गीय सेनाओं की छवि और יְהוָה का व्यक्तिगत नाम दोनों सुरक्षित रखे गए हैं।
theological_decisions:
- issue: आरंभिक अपूर्ण क्रिया का बल
  choice: याहवे ... काट डाले
  alternative: याहवे ... काट देगा
  rationale: संदर्भ में यह साधारण भविष्यवाणी से अधिक शापसूचक या इच्छार्थक न्याय-वचन जान पड़ता है; ‘काट डाले’ उसी अलंकारिक बल को व्यक्त करता है।
- issue: עֵר וְעֹנֶה का अनिश्चित अर्थ
  choice: मुख्य पाठ में अपेक्षाकृत शाब्दिक ‘जागनेवाले और उत्तर देनेवाले’
  alternative: साक्षी और पक्षसमर्थक; अथवा इसमें सम्मिलित हर व्यक्ति
  rationale: इब्रानी पदबंध दुर्बोध है। किसी एक व्याख्या को निश्चित मानने के बजाय अस्पष्टता को पाठ और पादटिप्पणी में सुरक्षित रखा गया है।
- issue: भेंट चढ़ानेवाले का संबंध
  choice: न्याय के अधीन व्यक्ति/वर्ग के रूप में समन्वित
  alternative: ‘फिर भी भेंट चढ़ाता है’ के रूप में विरोधसूचक संबंध
  rationale: इब्रानी में साधारण संयोजक וְ है; इसलिए मूल में स्पष्ट न होने वाला ‘फिर भी’ जैसा विरोधसूचक अर्थ नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। कठिन इब्रानी पदबंध को सरल करके किसी एक संप्रदायगत अर्थ में नहीं बाँधा गया; वाक्य की स्पष्टता के लिए दीर्घ विराम का प्रयोग किया गया है।
