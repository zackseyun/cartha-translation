  text: בְּרִיתִ֣/י הָיְתָ֣ה אִתּ֗/וֹ הַֽ/חַיִּים֙ וְ/הַ֨/שָּׁל֔וֹם וָ/אֶתְּנֵֽ/ם ל֥/וֹ מוֹרָ֖א וַ/יִּֽירָאֵ֑/נִי וּ/מִ/פְּנֵ֥י שְׁמִ֖/י נִחַ֥ת הֽוּא׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/005.yaml
  text: My covenant with him was one of life and peace[a], and I gave them to him; this called for reverence, and he revered me[b], and he stood in awe before my name.
translation:
  language: hi
  text: उसके साथ मेरी वाचा जीवन और शांति की थी। मैंने उन्हें उसे इसलिए दिया कि वह मेरा भय माने[a]; उसने मेरा भय माना, और वह मेरे नाम के सामने सहमा हुआ था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में यहाँ वाक्य-विन्यास संक्षिप्त और कठिन है; इसका अनुवाद ‘भय के लिए’, ‘भय के रूप में’ या ‘श्रद्धा उत्पन्न करने के लिए’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद ‘मेरे नाम के सामने वह भयभीत हो गया’, ‘विनम्र हो गया’ या ‘काँप उठा’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרִיתִי הָיְתָה אִתּוֹ
  choice: उसके साथ मेरी वाचा ... थी
  rationale: इब्रानी संबंधसूचक रचना को स्वाभाविक हिन्दी में रखा गया है; ‘वाचा’ בְּרִית का मानक धार्मिक-साहित्यिक समतुल्य है।
- source_word: הַחַיִּים וְהַשָּׁלוֹם
  choice: जीवन और शांति
  rationale: दोनों संज्ञाओं का सीधा अनुवाद है; ‘शांति’ में कुशलता और समग्र कल्याण का व्यापक भाव भी निहित रह सकता है।
- source_word: וָאֶתְּנֵם לוֹ
  choice: मैंने ये उसे दिए
  rationale: पुल्लिंग बहुवचन प्रत्यय को पीछे आए ‘जीवन और शांति’ की ओर संकेत करते हुए बहुवचन वस्तु के रूप में समझा गया है।
- source_word: מוֹרָא וַיִּירָאֵנִי
  choice: कि वह मेरा भय माने; उसने मेरा भय माना
  rationale: संकुचित इब्रानी वाक्य-विन्यास को हिन्दी में अर्थगम्य बनाया गया है और संज्ञा तथा उसी मूल से बने क्रिया-रूप के बीच शब्दगत संबंध बनाए रखा गया है। यहाँ ‘भय मानना’ श्रद्धापूर्ण भय को व्यक्त करता है, केवल आतंक को नहीं।
- source_word: וּמִפְּנֵי שְׁמִי
  choice: मेरे नाम के सामने
  rationale: इब्रानी के स्थानवाचक रूपक को सीधे और स्वाभाविक ढंग से सुरक्षित रखा गया है।
- source_word: נִחַת
  choice: भय से काँपता रहा
  rationale: חתת के निफ़अल रूप में भयभीत, विचलित या टूट जाने का प्रबल भाव हो सकता है। हिन्दी पदबंध प्रसंग के श्रद्धापूर्ण भय को रखते हुए मूल की गंभीरता भी बनाए रखता है।
theological_decisions:
- issue: वाचा के प्रति याजकीय प्रतिक्रिया का स्वरूप
  choice: ‘भय मानना’ और ‘भय से काँपना’—श्रद्धापूर्ण, गंभीर भय
  alternative: केवल ‘श्रद्धा करना’ या अधिक कठोर अर्थ में ‘आतंकित/हताश होना’
  rationale: מוֹרָא और ירא में वास्तविक भय का तत्व है, पर जीवन और शांति की सकारात्मक वाचा के संदर्भ में यह श्रद्धापूर्ण भय है। अनुवाद न तो इसे केवल नरम सम्मान बनाता है, न ही केवल दासवत आतंक।
- issue: מוֹרָא का संकुचित वाक्य-विन्यास
  choice: उद्देश्य के रूप में—‘कि वह मेरा भय माने’
  alternative: ‘भय के लिए’, ‘भय के रूप में’, अथवा ‘श्रद्धा उत्पन्न करने के लिए’
  rationale: इब्रानी वाक्य-विन्यास असामान्य और संकुचित है। मुख्य पाठ में सर्वाधिक स्वाभाविक प्रासंगिक अर्थ चुना गया है और वास्तविक अनिश्चितता पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किन्तु सहज स्तर रखा गया है। ‘वाचा’ बाइबलीय संदर्भ में परिचित और सटीक है। ‘मेरा भय मानना’ सामान्य हिन्दी में श्रद्धापूर्ण आज्ञाकारिता और भय दोनों को व्यक्त करता है।
