  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּֽי שִׂפְתֵ֤י כֹהֵן֙ יִשְׁמְרוּ דַ֔עַת וְ/תוֹרָ֖ה יְבַקְשׁ֣וּ מִ/פִּ֑י/הוּ כִּ֛י מַלְאַ֥ךְ יְהוָֽה צְבָא֖וֹת הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/007.yaml
  text: For the lips of a priest should guard knowledge[a], and they should seek instruction from his mouth[b], because he is the messenger of Yahweh of Armies.
translation:
  language: hi
  text: क्योंकि याजक के होंठों को ज्ञान की रक्षा करनी चाहिए, और लोगों को उसके मुख से शिक्षा[a] की खोज करनी चाहिए, क्योंकि वह सेनाओं का यहोवा[b] का दूत है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “व्यवस्था” अथवा “उपदेश”; इब्रानी शब्द तोराह है।
    reason: lexical_alternative
  - marker: b
    text: 'परंपरागत अनुवाद: “सेनाओं का प्रभु।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂפְתֵי כֹהֵן
  choice: याजक के होंठ
  rationale: मूल रचना का प्रतिनिधिक और सामान्य अर्थ बनाए रखते हुए इसे स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: יִשְׁמְרוּ
  choice: रक्षा करनी चाहिए
  rationale: संदर्भ में अपूर्ण क्रिया भविष्यवाणी नहीं, बल्कि याजक के अपेक्षित कर्तव्य को व्यक्त करती है।
- source_word: דַעַת
  choice: ज्ञान
  rationale: यह परमेश्वर और उसके मार्गों से संबंधित ठोस, सच्चे ज्ञान को दर्शाने वाला सीधा और प्रचलित अनुवाद है।
- source_word: וְתוֹרָה
  choice: शिक्षा
  rationale: यहाँ तोराह उस आधिकारिक शिक्षा को दर्शाती है जो लोग याजक से पाते हैं; केवल विधि-संहिता तक अर्थ सीमित न हो, इसलिए ‘शिक्षा’ चुना गया है।
- source_word: יְבַקְשׁוּ מִפִּיהוּ
  choice: लोगों को उसके मुँह से शिक्षा लेनी चाहिए
  rationale: बहुवचन कर्ता मूल में निहित और अनिश्चित है; ‘लोगों’ से उसका सामान्य आशय स्पष्ट होता है। ‘उसके मुँह से’ मौखिक याजकीय शिक्षा की मूल छवि को बनाए रखता है।
- source_word: מַלְאַךְ
  choice: दूत
  rationale: संदर्भ में यह शब्द याजक के लिए है, इसलिए स्वर्गदूत के बजाय संदेश पहुँचाने वाले प्रतिनिधि का अर्थ उपयुक्त है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का यहोवा
  rationale: ‘यहोवा’ नाम को प्रत्यक्ष रूप से रखता है और ‘सेनाओं’ द्वारा צְבָאוֹת के सामरिक तथा व्यापक अधिकार-सूचक अर्थ को आधुनिक पाठक के लिए स्पष्ट करता है।
theological_decisions:
- issue: יִשְׁמְרוּ और יְבַקְשׁוּ का विध्यर्थक या भविष्यसूचक बल
  choice: रक्षा करनी चाहिए / शिक्षा लेनी चाहिए
  alternative: रक्षा करेंगे / शिक्षा लेंगे
  rationale: आस-पास का प्रसंग याजकों की विफलता पर फटकार है; इसलिए ये क्रियाएँ उनके कर्तव्य और अपेक्षित आचरण को बताती हैं, साधारण भविष्यवाणी को नहीं।
- issue: יהוה का रूपांतरण
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल के व्यक्तिगत नाम को स्पष्ट रूप से बनाए रखा गया है; वैकल्पिक पारंपरिक पदवी को पादटिप्पणी में बताया गया है।
- issue: תורה का अर्थ-क्षेत्र
  choice: शिक्षा
  alternative: व्यवस्था
  rationale: यहाँ लोग याजक के मुख से मार्गदर्शन पाते हैं। ‘शिक्षा’ इस व्यापक अर्थ को बनाए रखती है, जबकि ‘व्यवस्था’ भी संभव है और पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण धार्मिक गद्य। ‘मुँह’ सामान्य पाठक के लिए स्वाभाविक है और मूल की मौखिक शिक्षा वाली छवि भी बचाता है। विध्यर्थक ‘चाहिए’ पद के कर्तव्य को स्पष्ट करता है।
