language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/לֹא אֶחָ֣ד עָשָׂ֗ה וּ/שְׁאָ֥ר ר֨וּחַ֙ ל֔/וֹ וּ/מָה֙ הָֽ/אֶחָ֔ד מְבַקֵּ֖שׁ זֶ֣רַע אֱלֹהִ֑ים וְ/נִשְׁמַרְתֶּם֙ בְּ/ר֣וּחֲ/כֶ֔ם וּ/בְ/אֵ֥שֶׁת נְעוּרֶ֖י/ךָ אַל יִבְגֹּֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/015.yaml
  text: Did not the one God make them[a]? Yet a remnant of the Spirit was his. And what was the one seeking? Godly offspring. So guard yourselves in your spirit[c][b], and let no one deal treacherously with the wife of his youth.
translation:
  language: hi
  text: क्या एकमात्र परमेश्वर ने उन दोनों को नहीं बनाया था[a]? फिर भी आत्मा का कुछ अंश उसके पास शेष था[b]। और वह एक क्या चाहता था? परमेश्वर-भक्त संतान[c]। इसलिए अपनी आत्मा के विषय में सावधान रहो, और कोई अपनी युवावस्था की पत्नी से विश्वासघात न करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी वाक्य बहुत कठिन है; शाब्दिक रूप लगभग यह है, “क्या एक ने नहीं बनाया, और आत्मा का शेष उसके पास था?” अन्य अर्थ ये भी लिए गए हैं: “जिसमें आत्मा का थोड़ा-सा अंश भी शेष है, वह ऐसा नहीं करता,” या “एक” से अब्राहम का संकेत है।'
    reason: alternative_reading
  - marker: b
    text: इब्रानी का अर्थ “आत्मा का शेष उसके पास था” हो सकता है; कुछ लोग इसे “उसके पास आत्मा की भरपूरी थी” समझते हैं। यहाँ ‘आत्मा’ परमेश्वर की आत्मा या मानवीय आत्मा—दोनों में से किसी का संकेत हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से “परमेश्वर का बीज”; इसका अनुवाद “परमेश्वर की संतान” या “ईश्वरभक्त संतान” भी किया जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא אֶחָד עָשָׂה
  choice: क्या एकमात्र परमेश्वर ने उन दोनों को नहीं बनाया था?
  rationale: इब्रानी वाक्य अत्यंत संक्षिप्त और विवादित है। विवाह के संदर्भ में אֶחָד को एक परमेश्वर और निहित कर्म को विवाहित जोड़े के रूप में समझा गया है। ‘उन दोनों’ संदर्भ से स्पष्ट किया गया है; अन्य संभावनाएँ पादटिप्पणी में रखी गई हैं।
- source_word: וּשְׁאָר רוּחַ לוֹ
  choice: फिर भी आत्मा का कुछ अंश उसके पास शेष था
  rationale: שְׁאָר का मूल भाव ‘शेष/बचा हुआ भाग’ है और רוּחַ ‘आत्मा, प्राणवायु या वायु’ हो सकता है। हिंदी में ‘आत्मा’ रखा गया है, पर वाक्यांश की अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
- source_word: וּמָה הָאֶחָד מְבַקֵּשׁ
  choice: और वह एक क्या चाहता था?
  rationale: प्रश्नवाचक रूप और הָאֶחָד का पिछले ‘एक’ से संबंध बनाए रखा गया है। מְבַקֵּשׁ को संदर्भानुकूल ‘चाहता था’ कहा गया है।
- source_word: זֶרַע אֱלֹהִים
  choice: परमेश्वर-भक्त संतान
  rationale: זֶרַע का विवाह-संदर्भ में स्वाभाविक अर्थ ‘संतान’ है। אֱלֹהִים को यहाँ गुणसूचक अर्थ में लिया गया है, इसलिए ‘परमेश्वर-भक्त’ कहा गया; अधिक शाब्दिक विकल्प पादटिप्पणी में है।
- source_word: וְנִשְׁמַרְתֶּם בְּרוּחֲכֶם
  choice: इसलिए अपनी आत्मा के विषय में सावधान रहो
  rationale: निफ़अल रूप का आत्मवाचक चेतावनी-भाव ‘सावधान रहो’ से व्यक्त किया गया है और בְּרוּחֲכֶם को ‘अपनी आत्मा के विषय में’ रखकर भीतर की प्रवृत्ति पर बल सुरक्षित रखा गया है।
- source_word: וּבְאֵשֶׁת נְעוּרֶיךָ אַל יִבְגֹּד
  choice: और कोई अपनी युवावस्था की पत्नी से विश्वासघात न करे
  rationale: בגד वाचा-संबंधी बेवफ़ाई या छलपूर्ण विश्वासघात दर्शाता है। आसपास के बहुवचन संबोधन और यहाँ के एकवचन पुल्लिंग निषेध को स्वाभाविक हिंदी में सामान्य निषेध ‘कोई ... न करे’ बनाया गया है।
theological_decisions:
- issue: कठिन प्रथम उपवाक्य और विवाह के साथ उसका संबंध
  choice: ‘एक’ को एकमात्र परमेश्वर और निहित कर्म को विवाहित जोड़ा मानना
  alternative: ‘क्या एक ने नहीं बनाया?’; ‘जिसमें थोड़ी भी आत्मा शेष है, वह ऐसा नहीं करता’; अथवा ‘एक’ को अब्राहम मानना
  rationale: यह पद इब्रानी बाइबल के सबसे कठिन वाक्य-विन्यासों में है। चुना हुआ पाठ 2:14–16 में विवाह-वाचा और विश्वासघात की चर्चा से मेल खाता है, लेकिन वास्तविक अनिश्चितता को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: רוּחַ का संदर्भ
  choice: ‘आत्मा’—संभवतः परमेश्वर का आत्मा-संबंधी वरदान
  alternative: मानवीय आत्मा, प्राण या सामर्थ्य का शेष भाग
  rationale: इब्रानी लिपि बड़े-छोटे अक्षरों से दिव्य और मानवीय ‘आत्मा’ का भेद नहीं करती। हिंदी मुख्य पाठ में भी यह स्वाभाविक अस्पष्टता बनी रहती है और पादटिप्पणी संभावनाएँ बताती है।
- issue: זֶרַע אֱלֹהִים में संबंध
  choice: 'गुणसूचक अर्थ: ‘परमेश्वर-भक्त संतान’'
  alternative: ‘परमेश्वर की संतान’ या अधिक शाब्दिक ‘परमेश्वर का बीज’
  rationale: विवाह और वाचा-निष्ठा के प्रसंग में गुणसूचक अर्थ सहज है, किंतु संबंधकारक संरचना की दूसरी सम्भावना पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रूप अपनाया गया है। मुख्य पाठ को अत्यधिक दुरूह होने से बचाते हुए मूल इब्रानी की वास्तविक व्याकरणिक और धर्मवैचारिक अनिश्चितता पादटिप्पणियों में स्पष्ट रखी गई है। ‘विश्वासघात’ विवाह-वाचा के विरुद्ध בגד की गंभीरता व्यक्त करता है।
