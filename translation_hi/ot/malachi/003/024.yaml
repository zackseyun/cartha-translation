id: MAL.3.24
reference: Malachi 3:24
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הֵשִׁ֤יב לֵב אָבוֹת֙ עַל בָּנִ֔ים וְ/לֵ֥ב בָּנִ֖ים עַל אֲבוֹתָ֑/ם פֶּן אָב֕וֹא וְ/הִכֵּיתִ֥י אֶת הָ/אָ֖רֶץ חֵֽרֶם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/024.yaml
  text: And he will turn the hearts of fathers to their children[a], and the hearts of children to their fathers, lest I come and strike the land with a ban of destruction.
translation:
  language: hi
  text: और वह पिताओं के मन अपनी संतानों की ओर, और संतानों के मन उनके पिताओं की ओर फेरेगा, ऐसा न हो कि मैं आकर देश पर प्रहार करूँ और उसे विनाश के लिए समर्पित कर दूँ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “देश को पूरी तरह नष्ट कर दूँ”; परम्परागत अनुवाद, “देश को श्रापित कर दूँ।” इब्रानी शब्द ऐसी वस्तु या क्षेत्र को दर्शाता है जो प्रतिबन्ध के अधीन विनाश के लिए समर्पित किया गया हो।
    reason: חֵרֶם के शाब्दिक/तकनीकी भाव तथा प्रचलित परम्परागत विकल्प को सुरक्षित रखना।
lexical_decisions:
- source_word: וְהֵשִׁיב
  choice: और वह ... फेरेगा
  rationale: שׁוב के हिफ़इल रूप का अर्थ यहाँ संबंधों के रुख को फिराना है; ‘फेरेगा’ इब्रानी मुहावरे को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: לֵב
  choice: मन
  rationale: इब्रानी לֵב आन्तरिक व्यक्ति, इच्छा और लगाव को सूचित करता है। आधुनिक हिन्दी में संबंधों के संदर्भ में ‘मन ... की ओर फेरना’ ‘हृदय’ की अपेक्षा अधिक स्वाभाविक है।
- source_word: אָבוֹת
  choice: पिताओं
  rationale: मूल शब्द पुल्लिंग बहुवचन में ‘पिता’ है। यहाँ सन्तानों के साथ पीढ़ीगत समानांतरता के कारण ‘पूर्वजों’ के बजाय निकट पारिवारिक अर्थ रखा गया है।
- source_word: עַל
  choice: की ओर
  rationale: इस मुहावरे में עַל संबंधपरक अभिमुखता व्यक्त करता है; ‘की ओर’ अर्थ और बिंब दोनों को स्पष्ट रखता है।
- source_word: בָּנִים
  choice: सन्तानों
  rationale: בנים का अर्थ पुत्र भी हो सकता है, पर यह संतान के लिए सामूहिक रूप से भी प्रयुक्त होता है। यहाँ ‘सन्तान’ केवल पुरुष बच्चों तक अर्थ सीमित नहीं करता।
- source_word: אֲבוֹתָם
  choice: उनके पिताओं
  rationale: प्रत्यय ‘उनके’ की माँग करता है; पहले खंड के समान यहाँ भी ‘पिता’ पीढ़ियों के पारिवारिक संबंध को व्यक्त करता है।
- source_word: פֶּן
  choice: ऐसा न हो कि
  rationale: यह अवांछित परिणाम की चेतावनी देता है और हिन्दी में गंभीर भविष्यवाणी-संबंधी लहजे को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אָבוֹא
  choice: मैं आकर
  rationale: आने और प्रहार करने की क्रमिक, निकट जुड़ी हुई क्रियाओं को हिन्दी में ‘आकर’ सहजता से जोड़ता है।
- source_word: וְהִכֵּיתִי
  choice: '... अर्पित कर दूँ'
  rationale: क्रिया הִכֵּיתִי का प्रहार करने का भाव यहाँ חֵרֶם के साथ मिलकर देश पर विनाशकारी दण्ड लगाने को दर्शाता है; संयुक्त हिन्दी अभिव्यक्ति में परिणाम स्पष्ट किया गया है।
- source_word: הָאָרֶץ
  choice: इस देश को
  rationale: אֶרֶץ यहाँ वाचा-समुदाय के भूभाग को सूचित करता है; ‘देश’ अनावश्यक विश्वव्यापी अर्थ से बचता है। हिन्दी में सन्दर्भगत निश्चितता के लिए ‘इस’ जोड़ा गया है।
- source_word: חֵרֶם
  choice: विनाश के लिए अर्पित
  rationale: חֵרֶם उस वस्तु या क्षेत्र को दर्शाता है जो प्रतिबन्ध के अधीन रखकर विनाश के लिए समर्पित हो। यह अनुवाद साधारण ‘श्राप’ से अलग उसके धार्मिक-न्यायिक भार को संक्षेप में व्यक्त करता है।
theological_decisions:
- issue: पुस्तक के अंत में חֵרֶם का अनुवाद
  choice: विनाश के लिए अर्पित कर दूँ
  alternative: पूरी तरह नष्ट कर दूँ; श्रापित कर दूँ; विनाश का प्रतिबन्ध लगा दूँ
  rationale: यह सामान्य ‘श्राप’ का शब्द नहीं, बल्कि ईश्वरीय न्याय में विनाश के लिए अलग या समर्पित किए जाने का शब्द है। मुख्य पाठ में समर्पण और विनाश दोनों रखे गए हैं, जबकि पद का प्रत्यक्ष ‘प्रहार’ भाव संयुक्त क्रिया में समाहित है।
- issue: אָבוֹת और בָּנִים का संबंध
  choice: पिता और सन्तान
  alternative: पूर्वज और वंशज; पिता और पुत्र
  rationale: समानांतर रचना पारिवारिक और पीढ़ीगत मेल की ओर संकेत करती है। ‘सन्तान’ בנים के सामान्य सामूहिक प्रयोग को रखता है, जबकि ‘पिता’ मूल के लिंग-विशिष्ट रूप को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज भविष्यवाणी-संबंधी लहजा। ‘मन ... की ओर फेरना’ संबंधपरक इब्रानी मुहावरे को स्वाभाविक बनाता है। ‘सन्तान’ समावेशी सामूहिक अर्थ देता है; ‘पिता’ मूल की विशिष्टता रखता है।
