  text: הִנְ/נִ֤י שֹׁלֵחַ֙ מַלְאָכִ֔/י וּ/פִנָּה דֶ֖רֶךְ לְ/פָנָ֑/י וּ/פִתְאֹם֩ יָב֨וֹא אֶל הֵיכָל֜/וֹ הָ/אָד֣וֹן אֲשֶׁר אַתֶּ֣ם מְבַקְשִׁ֗ים וּ/מַלְאַ֨ךְ הַ/בְּרִ֜ית אֲשֶׁר אַתֶּ֤ם חֲפֵצִים֙ הִנֵּה בָ֔א אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/001.yaml
  text: Behold[a], I am sending my messenger, and he will clear the way before me. And suddenly the Lord whom you seek will come to his temple, and the messenger of the covenant in whom you delight—behold, he is coming[b], says Yahweh of Armies.
translation:
  language: hi
  text: “देखो, मैं अपने दूत[a] को भेज रहा हूँ, और वह मेरे आगे मार्ग साफ़ करेगा। और अचानक जिस प्रभु को तुम खोजते हो, वह अपने मंदिर में आएगा; और वाचा का वह दूत, जिसमें तुम प्रसन्न होते हो—देखो, वह आ रहा है,” सेनाओं का यहोवा कहता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द מַלְאָךְ का अर्थ ‘दूत’ या ‘स्वर्गदूत’ हो सकता है; यही शब्द इस पद में ‘वाचा के दूत’ के लिए भी आया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: देखो, मैं
  rationale: सूचक अव्यय और प्रथम पुरुष सर्वनाम मिलकर बलपूर्ण भविष्यसूचक घोषणा करते हैं। ‘देखो’ आधुनिक हिन्दी में इस बल को स्वाभाविक रूप से बनाए रखता है।
- source_word: שֹׁלֵחַ
  choice: भेज रहा हूँ
  rationale: הִנְנִי के साथ कृदन्त आसन्न अथवा निश्चित कार्य को सजीव रूप में व्यक्त करता है; हिन्दी का वर्तमान प्रगतिशील रूप यही प्रभाव देता है।
- source_word: מַלְאָכִי / מַלְאַךְ הַבְּרִית
  choice: अपने दूत / वाचा का वह दूत
  rationale: מַלְאָךְ का अर्थ ‘दूत’ या ‘स्वर्गदूत’ हो सकता है। यहाँ मार्ग तैयार करने और सन्देशवाहक की भूमिका के कारण ‘दूत’ व्यापक और संदर्भानुकूल है; वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: וּפִנָּה דֶרֶךְ
  choice: मार्ग साफ़ करेगा
  rationale: क्रिया मार्ग से बाधाएँ हटाकर उसे तैयार करने का चित्र प्रस्तुत करती है। ‘मार्ग साफ़ करेगा’ इस बिम्ब को स्पष्ट और सहज हिन्दी में बनाए रखता है।
- source_word: וּפִתְאֹם
  choice: तब ... अचानक
  rationale: यह आगमन की आकस्मिकता व्यक्त करता है। ‘तब’ वाक्य का प्रवाह स्पष्ट करता है और ‘अचानक’ मूल अर्थ को सीधे रखता है।
- source_word: הָאָדוֹן
  choice: प्रभु
  rationale: संज्ञा उपपद सहित एक ऊँची उपाधि के रूप में प्रयुक्त है। ‘प्रभु’ उसके गौरवपूर्ण बल को रखता है, बिना व्यक्ति की पहचान को अनुवाद में अधिक स्पष्ट किए।
- source_word: הֵיכָלוֹ
  choice: अपने मंदिर
  rationale: यद्यपि הֵיכָל का अर्थ राजमहल भी हो सकता है, मलाकी के उपासना-संबंधी संदर्भ में ‘मंदिर’ अपेक्षित अर्थ है। हिन्दी में कर्ता की ओर लौटते अधिकार के लिए ‘अपने’ स्वाभाविक है।
- source_word: אֲשֶׁר אַתֶּם חֲפֵצִים
  choice: जिससे तुम प्रसन्न होते हो
  rationale: חפץ इच्छा, रुचि या प्रसन्नता को दर्शाता है। यह रूप व्यक्ति के प्रति प्रसन्नता और लगाव का भाव रखता है, पर अर्थ को केवल कामना तक सीमित नहीं करता।
- source_word: הִנֵּה בָא
  choice: देखो, वह आ रहा है
  rationale: सूचक अव्यय और आने की क्रिया मिलकर निश्चित तथा निकट आगमन को सजीव बनाते हैं।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं के यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम और ‘सेनाओं’ की उपाधि दोनों को स्पष्ट रखा गया है। यह मूल संरचना को दर्शाता है और ‘सेनाओं’ को अस्पष्ट रूप से नहीं बदलता।
theological_decisions:
- issue: ‘प्रभु’ और ‘वाचा के दूत’ के बीच पहचान का संबंध
  choice: दोनों उपाधियों को सीधे प्रस्तुत किया गया है, न उन्हें अनुवाद में स्पष्टतः एक ही व्यक्ति कहा गया है, न अलग-अलग व्यक्ति।
  alternative: दोनों उपाधियों को एक ही आगमनशील व्यक्ति के लिए स्पष्ट करना; अथवा दूत को प्रभु से स्पष्टतः अलग बताना।
  rationale: इब्रानी वाक्यरचना दोनों के निकट संबंध की अनुमति देती है, पर अनुवादक से संबंध की प्रकृति निर्णीत नहीं कराती। अर्धविराम और समानान्तर कथन मूल का धर्मवैज्ञानिक तनाव बनाए रखते हैं।
- issue: मसीही अर्थ में पढ़े जाने वाले प्रसंग में הָאָדוֹן का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: ‘प्रभु’ मूल उपाधि का ऊँचा बल और ऐतिहासिक मसीही पाठ से उसकी संगति बनाए रखता है, पर इब्रानी से आगे जाकर किसी व्यक्ति की पहचान घोषित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘देखो’ भविष्यसूचक घोषणा की तीव्रता रखता है; ‘मार्ग साफ़ करेगा’ मूल बिम्ब को सामान्य पाठक के लिए स्पष्ट करता है। ‘वाचा’, ‘प्रभु’ और ‘यहोवा’ जैसे स्थापित बाइबलीय पद संदर्भ की गंभीरता बनाए रखते हैं।
