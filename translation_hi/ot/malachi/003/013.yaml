id: MAL.3.13
reference: Malachi 3:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: חָזְק֥וּ עָלַ֛/י דִּבְרֵי/כֶ֖ם אָמַ֣ר יְהוָ֑ה וַ/אֲמַרְתֶּ֕ם מַה נִּדְבַּ֖רְנוּ עָלֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/013.yaml
  text: Your words have been hard against me[a], says Yahweh. But you say, “What have we spoken against you?”
translation:
  language: hi
  text: “तुम्हारी बातें मेरे विरुद्ध कठोर रही हैं[a],” याहवे कहते हैं। लेकिन तुम कहते हो, “हमने तेरे विरुद्ध क्या कहा है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “तुम्हारी बातें मेरे विरुद्ध बलवान रही हैं”; यहाँ “बलवान” का प्रयोग कड़ी या कठोर वाणी के अर्थ में हुआ है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָזְקוּ
  choice: कठोर रही हैं
  rationale: क्रिया का मूल अर्थ ‘बलवान होना’ है, पर यहाँ ‘बातें’ कर्ता और עַל के साथ इसका भाव ऐसी वाणी से है जो कड़ी या कठोर होकर किसी के विरुद्ध कही गई हो। ‘कठोर रही हैं’ इस मुहावरे का स्वाभाविक हिन्दी अर्थ देता है।
- source_word: עָלַי / עָלֶיךָ
  choice: मेरे विरुद्ध / तेरे विरुद्ध
  rationale: दोनों स्थानों पर עַל प्रसंगानुसार विरोधात्मक अर्थ रखता है। समान हिन्दी प्रयोग मूल की समानांतर संरचना बनाए रखता है।
- source_word: דִּבְרֵיכֶם
  choice: तुम्हारी बातें
  rationale: דבר का बहुवचन और द्वितीय पुरुष बहुवचन प्रत्यय सीधे ‘तुम्हारी बातें’ के अर्थ में है; यह सामान्य आधुनिक हिन्दी में सहज है।
- source_word: אָמַר יְהוָה
  choice: याहवे कहते हैं
  rationale: भविष्यद्वाणी के कथन-सूत्र को वर्तमान काल में रखना हिन्दी में परमेश्वर की वर्तमान घोषणा को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַאֲמַרְתֶּם
  choice: लेकिन तुम कहते हो
  rationale: वाव यहाँ लोगों की आपत्ति को याहवे के आरोप के विपरीत रखता है; ‘लेकिन’ मलाकी की विवाद-संवाद शैली स्पष्ट करता है।
- source_word: מַה נִּדְבַּרְנוּ
  choice: हमने क्या कहा है
  rationale: निफ़अल रूप में पारस्परिक बातचीत का संकेत संभव है, पर यहाँ प्रश्न का स्वाभाविक और पर्याप्त हिन्दी रूप ‘हमने क्या कहा है’ है; इससे कथन की विषयवस्तु पर लोगों का इनकार सामने आता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ में चार अक्षरों वाला वाचा-नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वतापूर्ण लिप्यंतरण है और नाम को किसी उपाधि से नहीं बदलता।
- issue: लोगों के प्रश्न में संबोधन का स्तर
  choice: तेरे विरुद्ध
  alternative: आपके विरुद्ध
  rationale: इब्रानी में एकवचन द्वितीय पुरुष संबोधन है। ‘तेरे’ मूल की सीधी, निकट संबोधन-शैली को बनाए रखता है और यहाँ अनादर का अतिरिक्त अर्थ जोड़ना आवश्यक नहीं है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘कठोर बातें’ सामान्य पाठक के लिए स्पष्ट हैं, जबकि पाद-टिप्पणी इब्रानी के ‘बलवान’ रूपक को सुरक्षित रखती है।
