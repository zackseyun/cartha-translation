source:
  edition: WLC
  text: וְ/קָרַבְתִּ֣י אֲלֵי/כֶם֮ לַ/מִּשְׁפָּט֒ וְ/הָיִ֣יתִי עֵ֣ד מְמַהֵ֗ר בַּֽ/מְכַשְּׁפִים֙ וּ/בַ/מְנָ֣אֲפִ֔ים וּ/בַ/נִּשְׁבָּעִ֖ים לַ/שָּׁ֑קֶר וּ/בְ/עֹשְׁקֵ֣י שְׂכַר שָׂ֠כִיר אַלְמָנָ֨ה וְ/יָת֤וֹם וּ/מַטֵּי גֵר֙ וְ/לֹ֣א יְרֵא֔וּ/נִי אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/005.yaml
  text: Then I will come near to you for judgment[a], and I will be a swift witness against sorcerers, against adulterers, against those who swear falsely, against those who oppress the wage of a hired worker, the widow, and the fatherless, and those who turn aside the sojourner, and do not fear me[c][b], says Yahweh of Armies.
translation:
  language: hi
  text: “तब मैं न्याय करने के लिए तुम्हारे निकट आऊँगा। मैं जादू-टोना करनेवालों, व्यभिचारियों, झूठी शपथ खानेवालों, मज़दूर की मज़दूरी, विधवा और अनाथ को दबानेवालों, परदेशी को उसके अधिकार से वंचित करनेवालों[a], और मुझसे न डरनेवालों के विरुद्ध शीघ्र गवाही दूँगा,” सेनाओं के यहोवा[b] का कहना है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “परदेशी को एक ओर मोड़नेवालों।” ‘परदेशी’ से आशय इस्राएल के बीच रहनेवाले गैर-इस्राएली निवासी से है, जो समुदाय के संरक्षण का अधिकारी था।
    reason: मूल इब्रानी मुहावरे और גֵר की सामाजिक श्रेणी को स्पष्ट करना।
  - marker: b
    text: ‘सेनाओं के यहोवा’ का पारंपरिक अनुवाद “सेनाओं का प्रभु” भी किया जाता है।
    reason: परिचित पारंपरिक अभिव्यक्ति और दिव्य नाम के वैकल्पिक निरूपण को दर्ज करना।
lexical_decisions:
- source_word: וְקָרַבְתִּי אֲלֵיכֶם לַמִּשְׁפָּט
  choice: तब मैं न्याय करने के लिए तुम्हारे निकट आऊँगा
  rationale: भविष्यसूचक प्रसंग में पूर्ण क्रिया भावी अर्थ देती है। ‘निकट आऊँगा’ दिशात्मक אֲלֵיכֶם और न्याय के लिए आने की छवि को बनाए रखता है।
- source_word: וְהָיִיתִי עֵד מְמַהֵר
  choice: मैं ... के विरुद्ध शीघ्र गवाही दूँगा
  rationale: शाब्दिक अर्थ ‘मैं एक शीघ्र साक्षी होऊँगा’ है; हिन्दी में क्रियात्मक रूप अधिक स्वाभाविक है और दैवी गवाही की तत्परता सुरक्षित रखता है।
- source_word: בַּמְכַשְּׁפִים
  choice: जादू-टोना करनेवालों
  rationale: यह सहभागी रूप जादुई क्रियाएँ करनेवालों को दर्शाता है। यह आधुनिक हिन्दी में स्पष्ट है और किसी संकुचित सांस्कृतिक श्रेणी तक अर्थ सीमित नहीं करता।
- source_word: וּבַמְנָאֲפִים
  choice: व्यभिचारियों
  rationale: स्रोत के सहभागी संज्ञात्मक प्रयोग का सीधा और प्रतिष्ठित हिन्दी समतुल्य।
- source_word: וּבַנִּשְׁבָּעִים לַשָּׁקֶר
  choice: झूठी शपथ खानेवालों
  rationale: यह झूठ के लिए या झूठी रीति से शपथ लेने का व्यापक अर्थ रखता है; केवल न्यायालयी झूठी गवाही तक सीमित नहीं।
- source_word: וּבְעֹשְׁקֵי שְׂכַר שָׂכִיר
  choice: मज़दूर की मज़दूरी दबानेवालों
  rationale: स्रोत में मजदूरी को उत्पीड़ित/हड़पने का सघन प्रयोग है। ‘मज़दूरी दबाना’ आधुनिक हिन्दी में वेतन रोकने या हड़पने का स्वाभाविक अर्थ देता है।
- source_word: אַלְמָנָה וְיָתוֹם
  choice: विधवा और अनाथ को सतानेवालों
  rationale: ये असुरक्षित सामाजिक वर्ग हैं। पिछले सहभागी עֹשְׁקֵי की शासन-सीमा को आगे बढ़ाकर हिन्दी में स्पष्ट किया गया है, जबकि क्रिया का सामाजिक उत्पीड़न वाला अर्थ कायम है।
- source_word: וּמַטֵּי גֵר
  choice: परदेशी को उसके अधिकार से वंचित करनेवालों
  rationale: נטה का हिफ़ील रूप यहाँ किसी को एक ओर मोड़ने या उसका मामला बिगाड़ने का अर्थ देता है। न्यायिक संदर्भ में अधिकार से वंचित करना आशय को स्वाभाविक हिन्दी में व्यक्त करता है; ‘अधिकार’ स्रोत में अंतर्निहित है, स्पष्ट रूप से उपस्थित नहीं।
- source_word: וְלֹא יְרֵאוּנִי
  choice: मुझसे न डरनेवालों
  rationale: ‘डरना’ परमेश्वर के प्रति भय और श्रद्धा की स्रोतगत धार्मिक तीव्रता बनाए रखता है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं के यहोवा
  rationale: व्यक्तिगत दिव्य नाम को लिप्यंतरित किया गया है और צְבָאוֹת का अर्थ पारदर्शी आधुनिक हिन्दी में ‘सेनाओं’ दिया गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम है। हिन्दी पाठकों में प्रचलित लिप्यंतरण ‘यहोवा’ नाम को उपाधि में बदले बिना पहचानने योग्य रखता है; ‘याहवे’ अधिक शैक्षिक पुनर्निर्माण है और ‘प्रभु’ नाम को छिपाता है।
- issue: צְבָאוֹת की अभिव्यक्ति
  choice: सेनाओं के यहोवा
  alternative: सेनाओं के प्रभु; सब सेनाओं के यहोवा
  rationale: ‘सेनाओं’ बहुवचन और सामरिक-राजकीय अर्थ को बनाए रखता है। ‘सब’ मूल में प्रत्यक्ष नहीं है, इसलिए नहीं जोड़ा गया।
- issue: עֵד מְמַהֵר का वाक्य-विन्यास
  choice: शीघ्र गवाही दूँगा
  alternative: शीघ्र साक्षी होऊँगा
  rationale: दोनों स्रोत के न्यायिक अर्थ को रखते हैं। मुख्य पाठ में स्वाभाविक हिन्दी चुनी गई है, बिना यह तय किए कि शीघ्रता केवल गवाही की है या उससे जुड़े न्याय की भी।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। सूची को समानांतर ‘-वालों’ रूपों में ढाला गया है ताकि इब्रानी सहभागी रूपों की पुनरावृत्ति हिन्दी में स्पष्ट रहे। ‘मज़दूर की मज़दूरी दबाना’ सामान्य पाठक के लिए सहज है; ‘परदेशी’ सामाजिक-वैधानिक श्रेणी को ‘यात्री’ की अपेक्षा बेहतर व्यक्त करता है।
