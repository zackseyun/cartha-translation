source:
  edition: WLC
  text: וְ/זָרְחָ֨ה לָ/כֶ֜ם יִרְאֵ֤י שְׁמִ/י֙ שֶׁ֣מֶשׁ צְדָקָ֔ה וּ/מַרְפֵּ֖א בִּ/כְנָפֶ֑י/הָ וִֽ/יצָאתֶ֥ם וּ/פִשְׁתֶּ֖ם כְּ/עֶגְלֵ֥י מַרְבֵּֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/020.yaml
  text: But for you who fear my name[a], the sun of righteousness will rise with healing in its wings[c][b]; and you will go out and leap like calves from the stall.
translation:
  language: hi
  text: परन्तु तुम जो मेरे नाम का भय रखते हो, तुम्हारे लिए धार्मिकता का सूर्य[a] उदय होगा, और उसके पंखों में चंगाई होगी[b]। तब तुम बाहर निकलोगे और बाड़े के बछड़ों के समान उछलोगे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘न्याय का सूर्य’ अथवा ‘निर्दोष ठहराए जाने का सूर्य।’ हिब्रू शब्द धार्मिकता, न्याय और किसी के पक्ष में न्यायपूर्ण निर्णय का भाव व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उसकी किरणों में।’ यहाँ ‘पंख’ सूर्य की दूर तक फैलती किरणों का रूपक हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘कूदोगे’ अथवा ‘आनन्द से कुलाँचे भरोगे।’ हिब्रू क्रिया दुर्लभ है और उल्लासपूर्ण गति का संकेत दे सकती है; कुछ लोग इसका अर्थ ‘हृष्ट-पुष्ट होगे’ समझते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָרְחָה
  choice: उदय होगा
  rationale: זרח किसी प्रकाशमान पिंड के उगने या चमक निकलने को दर्शाता है। सूर्य के बिंब के साथ ‘उदय होगा’ स्वाभाविक है और भावी अर्थ बनाए रखता है।
- source_word: יִרְאֵי שְׁמִי
  choice: तुम जो मेरे नाम का भय मानते हो
  rationale: यह कृदन्तीय पद उन सम्बोधित लोगों की पहचान करता है जिनके लिए यह प्रतिज्ञा है। ‘भय मानना’ यहाँ श्रद्धापूर्ण भय और आदर की बाइबलीय अभिव्यक्ति को बनाए रखता है।
- source_word: שֶׁמֶשׁ צְדָקָה
  choice: धार्मिकता का सूर्य
  rationale: यह हिब्रू रूपक धार्मिकता, न्याय अथवा निर्दोष ठहराए जाने की व्यापक अर्थ-सीमा रखता है। मुख्य पाठ में परिचित और व्यापक ‘धार्मिकता’ रखा गया है तथा वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: וּמַרְפֵּא
  choice: और ... चंगाई होगी
  rationale: מַרְפֵּא का अर्थ चंगाई या आरोग्य है। संज्ञात्मक हिब्रू अभिव्यक्ति को बिना किसी अतिरिक्त कर्ता या प्रक्रिया को जोड़े हिन्दी में स्वाभाविक बनाया गया है।
- source_word: בִּכְנָפֶיהָ
  choice: उसके पंखों में
  rationale: כָּנָף का मूल अर्थ ‘पंख’ है और सूर्य के सन्दर्भ में यह उसकी किरणों या छोरों का रूपक हो सकता है। मुख्य पाठ ठोस मूल रूपक को रखता है; ‘किरणें’ पादटिप्पणी में है।
- source_word: וִיצָאתֶם
  choice: तुम बाहर निकलोगे
  rationale: יצא का सीधा अर्थ बाहर निकलना है और यह बन्द बाड़े से खुले स्थान में छोड़े जाने के अगले बिंब से मेल खाता है।
- source_word: וּפִשְׁתֶּם
  choice: उछल-कूद करोगे
  rationale: यह दुर्लभ क्रिया अनिश्चित है। सन्दर्भ में बाड़े से छूटे बछड़ों की उल्लासपूर्ण गति प्रमुख लगती है; अन्य सम्भव अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: כְּעֶגְלֵי מַרְבֵּק
  choice: बाड़े से छूटे बछड़ों के समान
  rationale: מַרְבֵּק पशुओं का बाड़ा, खूँटा या मोटा किए जाने का स्थान हो सकता है। ‘से छूटे’ मूल में अलग शब्द नहीं है, पर बाहर निकलने और उल्लासपूर्ण गति के संयुक्त बिंब को स्वाभाविक हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: ‘धार्मिकता का सूर्य’ की मसीही पहचान
  choice: रूपक को किसी व्यक्ति के नाम या पदवी के रूप में स्पष्ट किए बिना बनाए रखना
  alternative: इसे सीधे मसीह अथवा आने वाले मसीहा की पदवी के रूप में अनूदित करना
  rationale: ईसाई परम्परा में यह बिंब मसीही रूप से पढ़ा गया है, पर हिब्रू पद स्वयं परमेश्वर के नाम का भय मानने वालों के लिए आने वाली धार्मिकता, न्याय और चंगाई का रूपक देता है। अनुवाद उस सम्भावित व्याख्या को न नकारता है, न उसे मूल पाठ में जोड़ता है।
- issue: צְדָקָה का अर्थ-क्षेत्र
  choice: मुख्य पाठ में ‘धार्मिकता’
  alternative: ‘न्याय’ अथवा ‘निर्दोष ठहराया जाना’
  rationale: शब्द नैतिक धार्मिकता, न्याय और पक्ष में न्यायपूर्ण निर्णय—इन अर्थों को समेट सकता है। व्यापक और पारम्परिक रूप ‘धार्मिकता’ मुख्य पाठ में है, जबकि न्यायपूर्ण समर्थन का विकल्प पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सुबोध रखी गई है। ‘मेरे नाम का भय मानते हो’ श्रद्धापूर्ण बाइबलीय भाव बनाए रखता है। ‘चंगाई’ धार्मिक साहित्य में परिचित है, जबकि वाक्य-विन्यास बोलचाल से अत्यधिक दूर नहीं जाता। पादटिप्पणी-चिह्न उन्हीं शब्दों के बाद रखे गए हैं जिनसे उनके विकल्प सम्बन्धित हैं।
