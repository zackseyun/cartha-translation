reference: Malachi 3:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אִשְּׁר֥וּ אֶתְ/כֶ֖ם כָּל הַ/גּוֹיִ֑ם כִּֽי תִהְי֤וּ אַתֶּם֙ אֶ֣רֶץ חֵ֔פֶץ אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/012.yaml
  text: Then all the nations will call you blessed[a], for you will be a delightful land, says Yahweh of hosts.
translation:
  language: hi
  text: “तब सब राष्ट्र तुम्हें धन्य कहेंगे, क्योंकि तुम एक मनभावनी भूमि होगे,” सेनाओं के याहवे का कहना है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִשְּׁרוּ
  choice: धन्य कहेंगे
  rationale: पिएल रूप का अर्थ किसी को धन्य या सुखी घोषित करना/मानना है। ‘धन्य कहेंगे’ सार्वजनिक स्वीकार को स्वाभाविक और संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: כָּל הַגּוֹיִם
  choice: सब राष्ट्र
  rationale: גּוֹיִם यहाँ आसपास के लोगों और राष्ट्रों को सामूहिक रूप से दर्शाता है; ‘राष्ट्र’ बाद के तकनीकी अर्थ ‘गैर-यहूदी’ को अनावश्यक रूप से नहीं थोपता।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह उस कारण का परिचय देता है जिसके कारण राष्ट्र उन्हें धन्य कहेंगे।
- source_word: תִהְיוּ אַתֶּם
  choice: तुम ... होगे
  rationale: היה के भविष्यकाल और स्पष्ट सर्वनाम के सीधे संबोधन को रखा गया है; हिन्दी में ‘तुम’ पर्याप्त रूप से स्पष्ट है।
- source_word: אֶרֶץ חֵפֶץ
  choice: एक मनभावनी भूमि
  rationale: शाब्दिक भाव ‘आनंद/चाह की भूमि’ है। ‘मनभावनी भूमि’ भूमि के सुखद और वांछनीय होने का भाव रखता है, जबकि वैकल्पिक संरचनाएँ पादटिप्पणी में दी गई हैं।
- source_word: יְהוָה
  choice: याहवे
  rationale: दिव्य नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में प्रस्तुत किया गया है।
- source_word: צְבָאוֹת
  choice: सेनाओं के
  rationale: यह बहुवचन संज्ञा सेनाओं/दल-समूहों का व्यापक भाव रखती है; ‘सेनाओं के याहवे’ स्रोत की उपाधि को बिना संकुचित किए संरक्षित करता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम सीधे उपस्थित है। ‘याहवे’ उसे उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं करता और प्रचलित विद्वत्तापूर्ण उच्चारण का हिन्दी रूप देता है।
- issue: אֶרֶץ חֵפֶץ में भूमि की विशेषता
  choice: मनभावनी भूमि
  alternative: आनंद की भूमि; वांछनीय भूमि
  rationale: यह पद भूमि को आनंददायक और चाहने योग्य दोनों अर्थों में समझे जाने देता है। मुख्य पाठ स्वाभाविक हिन्दी चुनता है और वास्तविक शब्दार्थगत विस्तार पादटिप्पणी में सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। भविष्यवाणी के सीधे संबोधन तथा दिव्य घोषणा की संरचना को बनाए रखा गया है।
