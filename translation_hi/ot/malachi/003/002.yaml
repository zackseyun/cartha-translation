source:
  edition: WLC
  text: וּ/מִ֤י מְכַלְכֵּל֙ אֶת י֣וֹם בּוֹא֔/וֹ וּ/מִ֥י הָ/עֹמֵ֖ד בְּ/הֵרָֽאוֹת֑/וֹ כִּֽי הוּא֙ כְּ/אֵ֣שׁ מְצָרֵ֔ף וּ/כְ/בֹרִ֖ית מְכַבְּסִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/002.yaml
  text: But who can endure the day of his coming[a], and who can stand when he appears? For he is like a refiner’s fire and like launderers’ soap.
translation:
  language: hi
  text: परन्तु उसके आने का दिन कौन सह सकेगा, और जब वह प्रकट होगा तब कौन खड़ा रह सकेगा? क्योंकि वह धातु शुद्ध करने वाले की आग के समान और धोबियों के क्षार[a] के समान है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “धोबियों के साबुन।” इब्रानी शब्द कपड़े धोने में प्रयुक्त एक प्रबल क्षारीय सफ़ाई-पदार्थ को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מְכַלְכֵּל
  choice: सह सकेगा
  rationale: यहाँ क्रिया का अर्थ उसके आगमन के दिन की कठोरता को झेल पाना है। ‘सह सकेगा’ आधुनिक हिन्दी में स्वाभाविक है और आलंकारिक प्रश्न की सामर्थ्य-संबंधी भावना को बनाए रखता है।
- source_word: יוֹם בּוֹאוֹ
  choice: उसके आने का दिन
  rationale: यह रूप मूल इब्रानी संबंधसूचक रचना और भविष्यद्वाणी के गंभीर भाव को सहज हिन्दी में सुरक्षित रखता है।
- source_word: הָעֹמֵד
  choice: खड़ा रह सकेगा
  rationale: शाब्दिक रूप से यह ‘खड़ा रहने वाला’ है, पर समानांतर प्रश्न में आशय न्याय के सामने टिके रहने की क्षमता से है; इसलिए ‘सकेगा’ को स्पष्ट किया गया है।
- source_word: בְּהֵרָאוֹתוֹ
  choice: जब वह प्रकट होगा
  rationale: निफ़अल रूप को कालवाचक उपवाक्य में व्यक्त किया गया है। ‘प्रकट होगा’ उसके दिखाई देने या सामने आने के भाव को स्वाभाविक और गरिमापूर्ण हिन्दी में रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पहले आए दोनों प्रश्नों का कारण प्रस्तुत करता है; ‘क्योंकि’ उसका व्याख्यात्मक संबंध स्पष्ट करता है।
- source_word: כְּאֵשׁ מְצָרֵף
  choice: धातु शुद्ध करने वाले की आग के समान
  rationale: यह धातु से अशुद्धियाँ हटाने के लिए प्रयुक्त तीव्र आग का रूपक है। यह अनुवाद शुद्धिकरण और कठोर जाँच, दोनों भाव बनाए रखता है।
- source_word: וּכְבֹרִית מְכַבְּסִים
  choice: धोबियों के क्षार के समान
  rationale: בֹּרִית कपड़ा साफ करने में प्रयुक्त प्रबल क्षारीय पदार्थ को दर्शाता है। ‘क्षार’ ‘साबुन’ की अपेक्षा पदार्थ की प्रकृति को अधिक ठीक व्यक्त करता है, जबकि पादटिप्पणी सामान्य पाठक के लिए अर्थ स्पष्ट करती है।
theological_decisions:
- issue: आने वाले व्यक्ति के कार्य का स्वरूप
  choice: आग और क्षार के शुद्ध करने वाले, पर कठोर, दोनों पक्षों को खुला रखा गया है।
  alternative: इसे केवल विनाशकारी न्याय या केवल आत्मिक/याजकीय शुद्धिकरण के रूप में सीमित करना।
  rationale: पद के दोनों रूपक कठोरता के साथ शुद्धि का अर्थ भी रखते हैं। अनुवाद किसी एक धर्मवैज्ञानिक निष्कर्ष को आरोपित किए बिना इस तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य शैली अपनाई गई है। ‘सह सकेगा’ और ‘खड़ा रह सकेगा’ से इब्रानी समानांतरता स्पष्ट रहती है; ‘क्षार’ की अपेक्षाकृत तकनीकी प्रकृति को पादटिप्पणी से समझाया गया है।
