id: MAL.3.4
reference: Malachi 3:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/עָֽרְבָה֙ לַֽ/יהוָ֔ה מִנְחַ֥ת יְהוּדָ֖ה וִ/ירֽוּשָׁלִָ֑ם כִּ/ימֵ֣י עוֹלָ֔ם וּ/כְ/שָׁנִ֖ים קַדְמֹנִיּֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/004.yaml
  text: Then the offering of Judah and Jerusalem will be pleasing to Yahweh[b][a], as in the days of old and as in former years.
translation:
  language: hi
  text: तब यहूदा और यरूशलेम की भेंट[a] याहवे को भाएगी[b], जैसे वह प्राचीन दिनों में और पूर्वकाल के वर्षों में भाती थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अन्नबलि।”
    reason: lexical_alternative
  - marker: b
    text: या, “याहवे को स्वीकार्य होगी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָרְבָה
  choice: तब ... प्रसन्न करेगी
  rationale: क्रिया ערב का अर्थ यहाँ ‘मनभावन/स्वीकार्य होना’ है। पिछले पद के शुद्धीकरण के परिणाम को व्यक्त करने के लिए संयोजक וְ को स्वाभाविक हिन्दी में ‘तब’ से व्यक्त किया गया है; भविष्यकाल भविष्यसूचक प्रसंग से आता है।
- source_word: לַיהוָה
  choice: याहवे को
  rationale: לְ उस व्यक्ति को चिह्नित करता है जिसके लिए भेंट प्रसन्नकारी है। יְהוָה को उसके व्यक्तिगत वाचा-नाम ‘याहवे’ के रूप में रखा गया है।
- source_word: מִנְחַת
  choice: भेंट
  rationale: מִנְחָה विशेष रूप से अन्नबलि का संकेत दे सकता है, पर इसका व्यापक अर्थ ईश्वर को अर्पित भेंट भी है। ‘भेंट’ मूल की अर्थगत व्यापकता को बनाए रखती है।
- source_word: יְהוּדָה וִירוּשָׁלִָם
  choice: यहूदा और यरूशलेम
  rationale: स्थान-नामों के प्रचलित मानक हिन्दी रूप अपनाए गए हैं।
- source_word: כִּימֵי עוֹלָם
  choice: जैसे प्राचीन दिनों में
  rationale: यहाँ עוֹלָם अनन्तता नहीं, सुदूर अतीत को सूचित करता है। यह चयन कालगत तुलना और काव्यात्मकता दोनों को बनाए रखता है।
- source_word: וּכְשָׁנִים קַדְמֹנִיּוֹת
  choice: और जैसे बीते वर्षों में
  rationale: यह वाक्यांश पिछले कालगत पदबंध के समानांतर है और पुराने समय की ओर संकेत करता है। अन्त में ‘करती थी’ जोड़ने से हिन्दी में निहित तुलना स्पष्ट और स्वाभाविक होती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ में चतुरक्षरी व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसके सम्भावित प्राचीन उच्चारण को दर्शाता और उसे उपाधि से अलग रखता है।
- issue: מִנְחָה की विशिष्टता
  choice: भेंट
  alternative: अन्नबलि
  rationale: यद्यपि उपासना के प्रसंग में यह शब्द अन्नबलि का तकनीकी अर्थ रख सकता है, अकेले इस पद की शब्दावली सामग्री को निर्णायक रूप से सीमित नहीं करती। इसलिए मुख्य पाठ व्यापक अर्थ रखता है और विकल्प पादटिप्पणी में दिया गया है।
- issue: ערב की भावछाया
  choice: प्रसन्न करेगी
  alternative: स्वीकार्य होगी
  rationale: दोनों अर्थ सम्भव हैं। ‘प्रसन्न करेगी’ भेंट का याहवे को मनभावन होना व्यक्त करता है, जबकि वैकल्पिक विधिक/उपासना-संबंधी भाव पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रूप। ‘प्राचीन दिनों’ और ‘बीते वर्षों’ से इब्रानी समानांतरता बचाई गई है, जबकि ‘करती थी’ हिन्दी में तुलना को पूरा करता है। सभी पादटिप्पणी-चिह्न सम्बद्ध शब्दों के तुरन्त बाद रखे गए हैं।
