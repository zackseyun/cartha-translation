reference: Malachi 3:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/גָעַרְתִּ֤י לָ/כֶם֙ בָּֽ/אֹכֵ֔ל וְ/לֹֽא יַשְׁחִ֥ת לָ/כֶ֖ם אֶת פְּרִ֣י הָ/אֲדָמָ֑ה וְ/לֹא תְשַׁכֵּ֨ל לָ/כֶ֤ם הַ/גֶּ֨פֶן֙ בַּ/שָּׂדֶ֔ה אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/011.yaml
  text: And I will rebuke the devourer for you[a], so that it will not destroy for you the fruit of the ground, and the vine in the field will not fail to bear for you[b], says Yahweh of Armies.
translation:
  language: hi
  text: “मैं तुम्हारे लिए खा जाने वाले को डाँटूँगा, ताकि वह भूमि की उपज को तुम्हारे लिए नष्ट न करे और खेत की दाखलता तुम्हारे लिए अपना फल न गिराए,” सेनाओं के याहवे कहते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְגָעַרְתִּי
  choice: मैं ... डाँटूँगा
  rationale: गָּעַר का मूल चित्र अधिकारपूर्वक डाँटकर रोकने का है। ‘डाँटूँगा’ इस चित्र और क्रिया की प्रभावशीलता को बनाए रखता है।
- source_word: בָּאֹכֵל
  choice: खा जानेवाले को
  rationale: यह אכל का संज्ञा के रूप में प्रयुक्त कृदंत है और फसल नष्ट करनेवाले किसी भी कारक को सूचित कर सकता है। यह अनुवाद टिड्डी, कीट या किसी अन्य विपत्ति को अनावश्यक रूप से निर्दिष्ट नहीं करता।
- source_word: יַשְׁחִת
  choice: नष्ट न करे
  rationale: कृषि-संदर्भ में हिफ़ील रूप उपज को बरबाद या नष्ट करने का अर्थ देता है; ‘नष्ट’ इसकी प्रबलता को स्पष्ट रूप से व्यक्त करता है।
- source_word: פְּרִי הָאֲדָמָה
  choice: तुम्हारी भूमि की उपज
  rationale: शाब्दिक अर्थ ‘भूमि का फल’ है। आधुनिक हिन्दी में ‘भूमि की उपज’ उसी कृषि-अर्थ को अधिक स्वाभाविक ढंग से व्यक्त करता है; ‘तुम्हारी’ לָכֶם के लाभ/सम्बन्ध भाव को सामने लाता है।
- source_word: תְשַׁכֵּל
  choice: फल पकने से पहले न गिरे
  rationale: שׁכל का मूल बिम्ब सन्तान या फल को असमय खो देने का है। दाखलता के विषय में यह फल के परिपक्व होने से पहले नष्ट हो जाने को दर्शाता है। मुख्य पाठ अर्थ को स्वाभाविक हिन्दी में देता है और शाब्दिक बिम्ब पादटिप्पणी में सुरक्षित है।
- source_word: הַגֶּפֶן בַּשָּׂדֶה
  choice: खेत की दाखलता
  rationale: यह निश्चित एकवचन और ठोस कृषि-परिवेश को बनाए रखता है। ‘दाखलता’ आधुनिक बाइबलीय हिन्दी में पहचाना जाने वाला और सटीक शब्द है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं के याहवे
  rationale: यְהוָה को उसके नाम ‘याहवे’ के रूप में और צְבָאוֹת को अर्थपूर्ण ढंग से ‘सेनाओं के’ अनूदित किया गया है। इससे पारम्परिक किन्तु आज अस्पष्ट ‘सेनाधीश/गणों’ जैसे विकल्पों की अपेक्षा मूल उपाधि का सैन्य बिम्ब स्पष्ट रहता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का विशिष्ट नाम आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण उच्चारण प्रस्तुत करता है और उसे सामान्य उपाधि ‘प्रभु’ में नहीं बदलता।
- issue: צְבָאוֹת वाली ईश्वरीय उपाधि
  choice: सेनाओं के
  alternative: गणों के; सेनाओं के प्रभु
  rationale: यह चयन उपाधि के सैन्य और स्वर्गीय दलों से जुड़े व्यापक बिम्ब को खुला रखता है। ‘सेनाओं के प्रभु’ अधिक सहज हो सकता है, पर वह यְהוָה नाम को ‘प्रभु’ में बदल देता है।
- issue: दाखलता के लिए שׁכל का रूपक
  choice: फल पकने से पहले न गिरे
  alternative: गर्भ न गिराए; निष्फल न हो
  rationale: हिब्रू क्रिया गर्भपात अथवा सन्तान-वियोग का तनावपूर्ण रूपक दाखलता पर लागू करती है। मुख्य पाठ उसका कृषि-सन्दर्भ स्पष्ट करता है, जबकि पादटिप्पणी मूल मानवीय रूपक को सुरक्षित रखती है; ‘निष्फल’ कहना असमय फल-हानि और फल न लगने के बीच का भेद मिटा देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और श्रव्य पाठ के अनुकूल रखी गई है। ‘खा जानेवाला’ जानबूझकर अनिर्दिष्ट है, क्योंकि मूल पाठ किसी खास कीट या विपत्ति का नाम नहीं देता। अर्धविराम पद के दो समानान्तर कृषि-आश्वासनों को स्पष्ट करता है।
