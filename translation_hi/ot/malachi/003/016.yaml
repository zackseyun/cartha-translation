id: MAL.3.16
reference: Malachi 3:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אָ֧ז נִדְבְּר֛וּ יִרְאֵ֥י יְהוָ֖ה אִ֣ישׁ אֶת רֵעֵ֑/הוּ וַ/יַּקְשֵׁ֤ב יְהוָה֙ וַ/יִּשְׁמָ֔ע וַ֠/יִּכָּתֵב סֵ֣פֶר זִכָּר֤וֹן לְ/פָנָי/ו֙ לְ/יִרְאֵ֣י יְהוָ֔ה וּ/לְ/חֹשְׁבֵ֖י שְׁמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/016.yaml
  text: Then those who feared Yahweh spoke with one another[a], and Yahweh paid attention and heard[b]; and a book of remembrance was written before him for those who fear Yahweh and who esteem his name.
translation:
  language: hi
  text: तब यहोवा का भय मानने वालों ने एक-दूसरे से बात की[a]। यहोवा ने ध्यान दिया और उनकी बात सुनी; और यहोवा का भय मानने वालों तथा उसके नाम का आदर करने वालों के लिए उसके सामने स्मरण की एक पुस्तक लिखी गई[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शब्दशः, “एक व्यक्ति ने अपने साथी से”; यह इब्रानी मुहावरा परस्पर बातचीत को व्यक्त करता है।
    reason: lexical_alternative
  - marker: b
    text: “के लिए” का अनुवाद “के विषय में” भी हो सकता है। “उसके नाम का आदर करने वालों” का अर्थ “उसके नाम पर विचार करने वालों” या “उसके नाम को महत्त्व देने वालों” भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: אָז
  choice: तब
  rationale: यह समयसूचक क्रियाविशेषण पिछले प्रसंग के प्रत्युत्तर में होनेवाली घटना को आगे बढ़ाता है।
- source_word: נִדְבְּרוּ ... אִישׁ אֶת־רֵעֵהוּ
  choice: एक-दूसरे से बात की
  rationale: निफ़अल रूप और साथ का इब्रानी मुहावरा यहाँ पारस्परिक बातचीत व्यक्त करते हैं; यह सहज हिन्दी में उसी अर्थ को रखता है।
- source_word: יִרְאֵי יְהוָה
  choice: यहोवा का भय माननेवाले
  rationale: ‘भय’ इब्रानी ירא के श्रद्धामिश्रित भय और वाचा-निष्ठा के धार्मिक भार को बनाए रखता है।
- source_word: וַיַּקְשֵׁב ... וַיִּשְׁמָע
  choice: ध्यान दिया और उनकी बात सुनी
  rationale: दोनों अलग क्रियाओं को रखकर पहले सावधान ध्यान और फिर सुनने का भाव व्यक्त किया गया है; ‘उनकी बात’ हिन्दी में स्वाभाविक निहित कर्म स्पष्ट करता है।
- source_word: סֵפֶר זִכָּרוֹן
  choice: स्मरण की एक पुस्तक
  rationale: यह ऐसा लिखित अभिलेख है जो स्मरण के लिए रखा जाता है; औपचारिक बिंब को सीधे बनाए रखा गया है।
- source_word: לְפָנָיו
  choice: उसके सामने
  rationale: यह अभिलेख परमेश्वर की उपस्थिति में होने का स्थानिक-संबंधात्मक भाव सुरक्षित रखता है।
- source_word: וּלְחֹשְׁבֵי שְׁמוֹ
  choice: उसके नाम का आदर करनेवाले
  rationale: חשב यहाँ नाम को महत्त्व देने, उसका मान रखने या उस पर विचार करने की अर्थ-सीमा रखता है; ‘आदर’ आधुनिक हिन्दी में श्रद्धापूर्ण मान को स्पष्ट करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत दिव्य नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण से प्रस्तुत किया गया है।
theological_decisions:
- issue: परमेश्वर का भय माननेवालों का वर्णन
  choice: यहोवा का भय माननेवाले
  alternative: यहोवा के प्रति श्रद्धा रखनेवाले
  rationale: ‘भय’ को नरम करके केवल ‘श्रद्धा’ नहीं किया गया, क्योंकि मूल शब्द श्रद्धामिश्रित भय और वाचा-निष्ठा दोनों समेटता है।
- issue: וּלְחֹשְׁבֵי שְׁמוֹ का अर्थ
  choice: उसके नाम का आदर करनेवाले
  alternative: उसके नाम पर विचार करनेवाले / उसके नाम को महत्त्व देनेवाले
  rationale: मुख्य पाठ में श्रद्धापूर्ण मान का स्वाभाविक हिन्दी रूप चुना गया है, जबकि मूल की विचार/मान की वास्तविक अर्थ-व्याप्ति पादटिप्पणी में रखी गई है।
- issue: स्मरण की पुस्तक का लाभार्थी अथवा विषय-संबंध
  choice: के लिए
  alternative: के विषय में
  rationale: לְ उपसर्ग लाभार्थी अथवा संदर्भ-संबंध दोनों की छाया दे सकता है; मुख्य पाठ में सहज लाभार्थी अर्थ रखा गया और विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘माननेवाले’ को संयुक्त रूप में लगातार प्रयोग किया गया है। मूल के दोहरे ‘ध्यान दिया और सुना’ तथा ‘स्मरण की पुस्तक’ के राजकीय-अभिलेख संबंधी बिंब को सुरक्षित रखा गया है।
