  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/שַׁבְתֶּם֙ וּ/רְאִיתֶ֔ם בֵּ֥ין צַדִּ֖יק לְ/רָשָׁ֑ע בֵּ֚ין עֹבֵ֣ד אֱלֹהִ֔ים לַ/אֲשֶׁ֖ר לֹ֥א עֲבָדֽ/וֹ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/018.yaml
  text: Then you will again see the difference between the righteous and the wicked[a], between one who serves God and one who does not serve him.
translation:
  language: hi
  text: तब तुम फिर से धर्मी और दुष्ट के बीच का अंतर देखोगे[a]—जो परमेश्वर की सेवा करता है और जो उसकी सेवा नहीं करता, उनके बीच का अंतर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से: “तुम लौटोगे और धर्मी तथा दुष्ट के बीच देखोगे।” इब्रानी मुहावरे का आशय संभवतः यह है कि वे एक बार फिर इस भेद को पहचानेंगे।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁבְתֶּם
  choice: तब तुम फिर से
  rationale: שׁוב का मूल अर्थ ‘लौटना’ या ‘फिरना’ है, पर अगले क्रियापद ‘देखोगे’ के साथ यहाँ यह दोबारा पहचानने या देखने का भाव देता है। ‘फिर से’ इस इब्रानी मुहावरे को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וּרְאִיתֶם
  choice: देखोगे
  rationale: ראה का सामान्य अर्थ ‘देखना’ है। प्रसंग में भेद को पहचानने का भाव निहित है, फिर भी ठोस मूल शब्द को बनाए रखने के लिए ‘देखोगे’ चुना गया है।
- source_word: בֵּין ... לְ
  choice: के बीच का अंतर
  rationale: बार-बार आया בֵּין दो वर्गों के बीच विरोध या भेद दिखाता है। हिन्दी में ‘अंतर देखोगे’ इस अर्थ को स्पष्ट और सहज ढंग से व्यक्त करता है।
- source_word: צַדִּיק
  choice: धर्मी
  rationale: צַדִּיק नैतिक और वाचा-संबंधी अर्थ में धर्मी या न्यायी व्यक्ति को दर्शाता है। ‘धर्मी’ इसका प्रचलित और व्यापक हिन्दी प्रतिशब्द है।
- source_word: רָשָׁע
  choice: दुष्ट
  rationale: רָשָׁע यहाँ צַדִּיק का प्रतिलोम है। ‘दुष्ट’ इस नैतिक विरोध को स्वाभाविक रूप से बनाए रखता है।
- source_word: עֹבֵד אֱלֹהִים
  choice: परमेश्वर की सेवा करनेवाले
  rationale: עבד में आराधना, निष्ठा और आज्ञापालन सहित परमेश्वर की सेवा का व्यापक भाव है। ‘सेवा करनेवाले’ इसे केवल उपासना-विधि तक सीमित नहीं करता।
- source_word: לַאֲשֶׁר לֹא עֲבָדוֹ
  choice: उसकी सेवा न करनेवाले
  rationale: यह पद पहले वर्ग के सीधे विपरीत व्यक्ति को बताता है, और प्रत्यय ‘उसकी’ परमेश्वर की ओर संकेत करता है। हिन्दी का सामान्य वर्तमानकाल वर्गगत विरोध को अच्छी तरह व्यक्त करता है।
theological_decisions:
- issue: क्या इस भेद को स्पष्ट रूप से अंतिम न्याय से जोड़ा जाए
  choice: इसे परमेश्वर के कार्य के फलस्वरूप भविष्य में दिखाई देनेवाले भेद के रूप में रखा गया है, पर ‘अंतिम न्याय’ जैसी व्याख्यात्मक भाषा नहीं जोड़ी गई।
  alternative: ‘न्याय के समय तुम भेद देखोगे’ जैसे स्पष्ट अंतकालीन शब्द जोड़ना।
  rationale: निकटवर्ती प्रसंग परमेश्वर के आने और न्याय करने की बात करता है, पर इस पद में स्वयं केवल यह कहा गया है कि श्रोता फिर से यह अंतर देखेंगे। अनुवाद मूल पाठ से आगे नहीं जाता।
- issue: שׁוב को वास्तविक लौटना माना जाए या फिर से देखने का मुहावरा
  choice: मुख्य पाठ में ‘फिर से’ रखा गया है और अधिक शाब्दिक संभावना पादटिप्पणी में दी गई है।
  alternative: ‘तुम लौटोगे और देखोगे’ अनुवाद करना।
  rationale: दोनों अर्थ स्रोत-रूप से संभव हैं, किंतु ‘देखना’ के साथ नवीकृत पहचान का मुहावरेदार अर्थ प्रसंग में अधिक स्वाभाविक है; पादटिप्पणी मूल संरचना की अस्पष्टता सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल शैली रखी गई है। ‘तुम’ मूल के बहुवचन संबोधन को सहज रूप से व्यक्त करता है। समानांतर इब्रानी संरचना को डैश और दोहराए गए ‘के बीच का अंतर’ द्वारा स्पष्ट रखा गया है।
