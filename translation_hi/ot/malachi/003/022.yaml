id: MAL.3.22
reference: Malachi 3:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: זִכְר֕וּ תּוֹרַ֖ת מֹשֶׁ֣ה עַבְדִּ֑/י אֲשֶׁר֩ צִוִּ֨יתִי אוֹת֤/וֹ בְ/חֹרֵב֙ עַל כָּל יִשְׂרָאֵ֔ל חֻקִּ֖ים וּ/מִשְׁפָּטִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/022.yaml
  text: Remember the law of Moses my servant[c][b][a], which I commanded him at Horeb for all Israel—statutes and judgments.
translation:
  language: hi
  text: मेरे सेवक मूसा की व्यवस्था[a] को याद रखो, जिसकी आज्ञा मैंने होरेब[b] में सारे इस्राएल के लिए मूसा को दी थी—विधियाँ और न्याय-विधान।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे सेवक मूसा की शिक्षा।”
    reason: lexical_alternative
  - marker: b
    text: “होरेब” सीनै का दूसरा नाम है—वह पर्वत जहाँ परमेश्वर ने मूसा के द्वारा इस्राएल को वाचा की व्यवस्था दी थी।
    reason: cultural_note
  - marker: c
    text: या, “विधियाँ और नियम।”
    reason: lexical_alternative
lexical_decisions:
- source_word: זִכְרוּ
  choice: याद रखो
  rationale: बहुवचन आज्ञार्थक क्रिया सक्रिय और निरंतर वाचाई स्मरण का आह्वान करती है। आधुनिक हिन्दी में ‘याद रखो’ स्वाभाविक और पर्याप्त रूप से गंभीर है।
- source_word: תּוֹרַת
  choice: व्यवस्था
  rationale: यहाँ मूसा, होरेब और इस्राएल को दी गई वाचा की विधियों के संदर्भ में תּוֹרָה विशेष रूप से मूसा की व्यवस्था को सूचित करती है; व्यापक अर्थ ‘शिक्षा’ को पादटिप्पणी में रखा गया है।
- source_word: מֹשֶׁה
  choice: मूसा
  rationale: इस व्यक्तिगत नाम का प्रचलित हिन्दी रूप।
- source_word: עַבְדִּי
  choice: मेरे सेवक
  rationale: मूसा के लिए यह आदरसूचक वाचाई पद उसकी परमेश्वर-नियुक्त सेवा को दर्शाता है; ‘दास’ की अपेक्षा ‘सेवक’ आधुनिक हिन्दी में इस प्रसंग का आशय अधिक स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֲשֶׁר צִוִּיתִי אֹתוֹ
  choice: जिसकी आज्ञा मैंने ... उसे दी थी
  rationale: सापेक्ष उपवाक्य व्यवस्था की ओर लौटता है और ‘उसे’ मूसा को उसके प्राप्तकर्ता तथा मध्यस्थ के रूप में दर्शाता है। यह हिन्दी रचना मूल के ‘आज्ञा देना’ भाव को बनाए रखती है।
- source_word: בְּחֹרֵב
  choice: होरेब में
  rationale: स्थानवाचक ב का स्वाभाविक हिन्दी रूप; होरेब वही पर्वतीय क्षेत्र है जिसे सीनै भी कहा जाता है।
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: सारे इस्राएल के लिए
  rationale: यह व्यवस्था के लागू होने के क्षेत्र को, अर्थात पूरी वाचा-प्रजा को, व्यक्त करता है।
- source_word: חֻקִּים
  choice: विधियाँ
  rationale: यह वाचा के अंतर्गत निर्धारित अधिनियमों या स्थायी नियमों का कानूनी भाव देता है।
- source_word: וּמִשְׁפָּטִים
  choice: और न्याय-विधान
  rationale: מִשְׁפָּטִים के न्यायिक और कानूनी पक्ष को व्यक्त करते हुए इसे חֻקִּים से अलग रखता है।
theological_decisions:
- issue: वाचाई संदर्भ में תּוֹרָה का अनुवाद
  choice: व्यवस्था
  alternative: शिक्षा
  rationale: मूसा, होरेब और इस्राएल के लिए दी गई विधियों का स्पष्ट उल्लेख अधिक विशिष्ट कानूनी-वाचाई अर्थ का समर्थन करता है। फिर भी शब्द के शिक्षापरक विस्तार को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: मूसा के लिए עבד का अनुवाद
  choice: सेवक
  alternative: दास
  rationale: यहाँ यह मूसा की परमेश्वर द्वारा सौंपी गई आदरणीय सेवा का पद है, न कि मुख्यतः उसकी सामाजिक बंधुआ स्थिति का वर्णन। इसलिए ‘सेवक’ प्रसंगानुकूल है।
- issue: חֻקִּים और מִשְׁפָּטִים के बीच कानूनी भेद
  choice: विधियाँ और न्याय-विधान
  alternative: विधियाँ और नियम
  rationale: चुना हुआ पाठ दोनों निकटवर्ती कानूनी शब्दों के बीच संभावित भेद को बनाए रखता है, पर वैकल्पिक अधिक सामान्य अभिव्यक्ति पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सामूहिक संबोधन वाली रखी गई है। ‘याद रखो’ सामान्य पाठक के लिए स्वाभाविक है, जबकि ‘व्यवस्था’, ‘विधियाँ’ और ‘न्याय-विधान’ वाचाई तथा कानूनी संदर्भ को बनाए रखते हैं।
