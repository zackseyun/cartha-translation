id: MAL.3.19
reference: Malachi 3:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּֽי הִנֵּ֤ה הַ/יּוֹם֙ בָּ֔א בֹּעֵ֖ר כַּ/תַּנּ֑וּר וְ/הָי֨וּ כָל זֵדִ֜ים וְ/כָל עֹשֵׂ֤ה רִשְׁעָה֙ קַ֔שׁ וְ/לִהַ֨ט אֹתָ֜/ם הַ/יּ֣וֹם הַ/בָּ֗א אָמַר֙ יְהוָ֣ה צְבָא֔וֹת אֲשֶׁ֛ר לֹא יַעֲזֹ֥ב לָ/הֶ֖ם שֹׁ֥רֶשׁ וְ/עָנָֽף־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/019.yaml
  text: For behold[a], the day is coming, burning like an oven, when all the arrogant and every evildoer will be stubble. The coming day will set them ablaze, says Yahweh of Armies[c][b], so that it will leave them neither root nor branch.
translation:
  language: hi
  text: क्योंकि देखो, वह दिन आ रहा है, जो तंदूर के समान धधक रहा है।[a] सब अभिमानी[b] और हर दुष्टता करने वाला सूखी पराली होंगे। सेनाओं का याहवे[c] कहता है कि वह आने वाला दिन उन्हें जला देगा और उनके लिए न जड़ छोड़ेगा, न डाल।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भट्ठी के समान धधक रहा है।”
    reason: lexical_alternative
  - marker: b
    text: या, “घमंडी।”
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में यह उपाधि “याहवे ज़ेबाओत” है; यहाँ ज़ेबाओत का अर्थ “सेनाएँ” देकर इसे “सेनाओं का याहवे” अनूदित किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי הִנֵּה
  choice: क्योंकि देखो
  rationale: כִּי पिछले कथन का आधार प्रस्तुत करता है और הִנֵּה श्रोता का ध्यान आने वाले न्याय की ओर खींचता है। यह संयोजन हिन्दी में संबंध और भविष्यद्वाणी की तात्कालिकता दोनों बनाए रखता है।
- source_word: הַיּוֹם בָּא
  choice: वह दिन आ रहा है
  rationale: निश्चित पदबंध भविष्यद्वाणी में पहचाने हुए न्याय-दिवस की ओर संकेत करता है; ‘आ रहा है’ उसके निकट आने का भाव व्यक्त करता है।
- source_word: בֹּעֵר כַּתַּנּוּר
  choice: तंदूर के समान धधक रहा है
  rationale: תַּנּוּר का सीधा अर्थ मिट्टी का तंदूर या आग से तपने वाला चूल्हा है। ‘धधक रहा है’ कृदन्त की सक्रिय अग्नि-छवि को स्वाभाविक हिन्दी में रखता है।
- source_word: זֵדִים
  choice: अभिमानी
  rationale: यह शब्द घमंडी और ढीठ मनोवृत्ति वाले लोगों को सूचित करता है। ‘अभिमानी’ आधुनिक हिन्दी में स्पष्ट और नैतिक अर्थयुक्त है।
- source_word: כָל עֹשֵׂה רִשְׁעָה
  choice: हर दुष्टता करने वाला
  rationale: एकवचन कृदन्त का वितरणात्मक बल सुरक्षित रखा गया है; संक्षिप्त ‘दुष्ट’ की अपेक्षा यह मूल के कर्म करने पर दिए गए जोर को बनाए रखता है।
- source_word: קַשׁ
  choice: सूखी पराली
  rationale: קַשׁ कटनी के बाद बची सूखी डंठल या पराली को दर्शाता है। यह आग पकड़ने वाली कृषि-छवि को ‘भूसी’ से अधिक ठीक रखता है।
- source_word: וְלִהַט אֹתָם
  choice: उन्हें जला डालेगा
  rationale: क्रिया प्रचंड आग से जलाने का भाव देती है। यह अग्नि की छवि को स्पष्ट रखती है, जबकि पूर्ण उन्मूलन का परिणाम अगली पंक्ति में जड़ और डाल के रूपक से व्यक्त होता है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं के याहवे
  rationale: व्यक्तिगत दिव्य नाम को ‘याहवे’ के रूप में रखा गया है और צְבָאוֹת को ‘सेनाओं’ से पारदर्शी ढंग से अनूदित किया गया है।
- source_word: אֲשֶׁר לֹא יַעֲזֹב לָהֶם שֹׁרֶשׁ וְעָנָף
  choice: और उनके लिए न जड़ छोड़ेगा, न डाल
  rationale: नकारात्मक युग्म मूल की समग्र विनाश की वृक्ष-छवि बनाए रखता है। ‘उनके लिए’ לָהֶם को स्पष्ट करता है, और ‘न…न…’ हिन्दी में neither/nor का स्वाभाविक रूप है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में वाचा-संबंधी व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसे उपाधि में बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: न्याय की अग्नि को सारांशित करना या क्रमिक रूपक बनाए रखना
  choice: पहले ‘जला डालेगा’, फिर ‘न जड़ छोड़ेगा, न डाल’
  alternative: पूरी तरह नष्ट कर देगा
  rationale: मूल पहले आग लगने/जलने और फिर जड़ तथा डाल तक न बचने की छवियाँ देता है। दोनों को बनाए रखने से पाठ की क्रमिक और तीव्र काव्यात्मक अभिव्यक्ति सुरक्षित रहती है।
- issue: שֹׁרֶשׁ וְעָנָף की छवि
  choice: न जड़ छोड़ेगा, न डाल
  alternative: उनका पूरी तरह नाश कर देगा
  rationale: इसे केवल व्याख्यात्मक निष्कर्ष में बदलने के बजाय मूल वृक्ष-रूपक और उसके समग्रता-सूचक तनाव को रखा गया है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और भविष्यद्वाणी की गरिमा के अनुरूप रखी गई है। ‘तंदूर’, ‘सूखी पराली’, ‘जड़’ और ‘डाल’ जैसी ठोस छवियाँ सामान्य हिन्दी पाठक के लिए सुबोध हैं और मूल की कृषि तथा अग्नि-संबंधी काव्यात्मकता को सुरक्षित रखती हैं।
