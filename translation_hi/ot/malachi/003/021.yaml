reference: Malachi 3:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/עַסּוֹתֶ֣ם רְשָׁעִ֔ים כִּֽי יִהְי֣וּ אֵ֔פֶר תַּ֖חַת כַּפּ֣וֹת רַגְלֵי/כֶ֑ם בַּ/יּוֹם֙ אֲשֶׁ֣ר אֲנִ֣י עֹשֶׂ֔ה אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/021.yaml
  text: And you will trample the wicked[a], for they will be ashes under the soles of your feet on the day when I act, says Yahweh of Armies.
translation:
  language: hi
  text: “और तुम दुष्टों को रौंदोगे, क्योंकि जिस दिन मैं कार्य करूँगा, उस दिन वे तुम्हारे पैरों के तलवों के नीचे राख होंगे,” सेनाओं के याहवे कहते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַסּוֹתֶם
  choice: और तुम ... रौंदोगे
  rationale: क्रिया का प्रसंगगत अर्थ पैरों तले रौंदना है। यह चुनाव विजय और अधीन किए जाने के ठोस रूपक को बनाए रखता है।
- source_word: רְשָׁעִים
  choice: दुष्टों को
  rationale: बहुवचन विशेषण यहाँ संज्ञा के रूप में दुष्ट व्यक्तियों को दर्शाता है; हिन्दी में ‘दुष्टों’ स्वाभाविक और संक्षिप्त है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह आगे दिए गए कारण या आधार को स्पष्ट रूप से जोड़ता है।
- source_word: יִהְיוּ אֵפֶר
  choice: वे ... राख होंगे
  rationale: इब्रानी में सीधा विधेय है, उपमा नहीं; इसलिए ‘राख जैसे’ न कहकर ‘राख होंगे’ रखा गया है।
- source_word: תַּחַת כַּפּוֹת רַגְלֵיכֶם
  choice: तुम्हारे पैरों के तलवों के नीचे
  rationale: כַּף का पैर के साथ स्वाभाविक अर्थ ‘तलवा’ है; पूरा पदबंध स्थानिक चित्र को सटीक रखता है।
- source_word: בַּיּוֹם אֲשֶׁר אֲנִי עֹשֶׂה
  choice: जिस दिन मैं कार्य करूँगा
  rationale: अपूर्ण/संक्षिप्त इब्रानी अभिव्यक्ति याहवे की निर्णायक कार्रवाई की ओर संकेत करती है। ‘कार्य करूँगा’ अर्थ को अनावश्यक रूप से विशिष्ट किए बिना स्वाभाविक हिन्दी देता है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं के याहवे
  rationale: व्यक्तिगत नाम को ‘याहवे’ के रूप में रखा गया है और צְבָאוֹת को आधुनिक पाठक के लिए पारदर्शी ‘सेनाओं’ से अनूदित किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसका निकट देवनागरी लिप्यंतरण है; ‘प्रभु’ नाम को उपाधि में बदल देता है।
- issue: צְבָאוֹת वाली ईश्वरीय उपाधि
  choice: सेनाओं के याहवे
  alternative: सेनाओं का यहोवा; सेनाओं के प्रभु
  rationale: ‘सेनाओं’ इब्रानी बहुवचन का अर्थ स्पष्ट करता है और उपाधि की सामरिक/ब्रह्मांडीय व्यापकता को किसी एक प्रकार की सेना तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘रौंदोगे’, ‘पैरों के तलवों’ और ‘राख होंगे’ से मूल का ठोस न्याय-विषयक चित्र सुरक्षित रहता है। उद्धरण-रचना से अंतिम कथन-सूत्र ‘याहवे का कहना है’ स्पष्ट किया गया है।
