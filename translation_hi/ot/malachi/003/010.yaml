source:
  edition: WLC
  text: הָבִ֨יאוּ אֶת כָּל הַֽ/מַּעֲשֵׂ֜ר אֶל בֵּ֣ית הָ/אוֹצָ֗ר וִ/יהִ֥י טֶ֨רֶף֙ בְּ/בֵיתִ֔/י וּ/בְחָנ֤וּ/נִי נָא֙ בָּ/זֹ֔את אָמַ֖ר יְהוָ֣ה צְבָא֑וֹת אִם לֹ֧א אֶפְתַּ֣ח לָ/כֶ֗ם אֵ֚ת אֲרֻבּ֣וֹת הַ/שָּׁמַ֔יִם וַ/הֲרִיקֹתִ֥י לָ/כֶ֛ם בְּרָכָ֖ה עַד בְּלִי דָֽי־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/010.yaml
  text: Bring the full tithe into the storehouse[a], so that there may be food in my house. And test me now in this, says Yahweh of hosts[c][b], whether I will not open for you the windows of heaven and pour out for you blessing until there is no more need.
translation:
  language: hi
  text: “पूरा दशमांश[a] भंडारघर में लाओ, ताकि मेरे घर में भोजन रहे। और अब इसी बात में मुझे परखो,” सेनाओं का याहवे कहता है, “कि क्या मैं तुम्हारे लिए आकाश की खिड़कियाँ[b] नहीं खोल दूँगा और तुम्हारे लिए इतनी आशीष नहीं उँडेलूँगा कि तुम्हें और की आवश्यकता न रहे।[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सारा दशमांश” अथवा “समूचा दशमांश।”
    reason: lexical_alternative
  - marker: b
    text: या “आकाश के बाढ़-द्वार।” इब्रानी में शाब्दिक अर्थ “आकाश की खिड़कियाँ” है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी मुहावरा आवश्यकता से भी बढ़कर प्रचुरता का भाव देता है; पारंपरिक अनुवाद हैं, “जब तक रखने को स्थान न रहे” अथवा “अपरिमित आशीष।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבִיאוּ
  choice: लाओ
  rationale: हिफ़ील बहुवचन आज्ञार्थक का सीधा और स्वाभाविक हिन्दी रूप; आदेश की शक्ति बनी रहती है।
- source_word: כָּל הַמַּעֲשֵׂר
  choice: पूरा दशमांश
  rationale: כָּל एकवचन संज्ञा के साथ अपेक्षित दसवें भाग की संपूर्णता बताता है, न कि केवल अनेक दशमांशों को।
- source_word: בֵּית הָאוֹצָר
  choice: भंडार-घर
  rationale: शाब्दिक अर्थ ‘भंडारण का घर’ है; मन्दिर में सामग्री रखने के स्थान के लिए यह स्पष्ट आधुनिक हिन्दी है।
- source_word: וִיהִי
  choice: ताकि ... रहे
  rationale: आज्ञा के बाद प्रयोजन अथवा परिणाम व्यक्त करने वाले रूप को स्वाभाविक हिन्दी में दर्शाता है।
- source_word: טֶרֶף
  choice: भोजन
  rationale: मूल शब्द अन्य संदर्भों में ‘शिकार’ हो सकता है, पर यहाँ परमेश्वर के भवन के लिए खाद्य-सामग्री या निर्वाह का अर्थ उपयुक्त है।
- source_word: בְּבֵיתִי
  choice: मेरे भवन में
  rationale: मूल के ‘मेरे घर में’ वाले मन्दिर-संबंधी रूपक को बनाए रखते हुए ‘भवन’ हिन्दी में गरिमापूर्ण और स्पष्ट है।
- source_word: וּבְחָנוּנִי נָא בָּזֹאת
  choice: और अब इसी बात में मुझे परखो
  rationale: בחן की जाँचने या परखने की असामान्य ईश्वरीय चुनौती तथा נָא की तात्कालिकता दोनों सुरक्षित हैं।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का याहवे
  rationale: व्यक्तिगत वाचा-नाम को ‘याहवे’ और צְבָאוֹת को उसके व्यापक सैन्य तथा ब्रह्मांडीय संकेत सहित ‘सेनाओं का’ रखा गया है।
- source_word: אִם לֹא
  choice: कि क्या मैं ... नहीं
  rationale: परखने की आज्ञा के बाद आने वाली प्रश्नात्मक-आश्वासनात्मक संरचना को बनाए रखता है; इसे सीधे ‘निश्चय’ में बदलकर तनाव समाप्त नहीं करता।
- source_word: אֲרֻבּוֹת הַשָּׁמַיִם
  choice: आकाश के झरोखे
  rationale: אֲרֻבּוֹת का मूल बिंब ‘खिड़कियाँ/खुले द्वार’ है। ‘झरोखे’ वर्षा के खुलने का चित्र बनाए रखता है, जबकि ‘बाढ़ के फाटक’ अधिक व्याख्यात्मक है।
- source_word: וַהֲרִיקֹתִי לָכֶם בְּרָכָה
  choice: तुम्हारे लिए ... आशीष ... उँडेलूँगा
  rationale: ריק के प्रवाहित या उँडेलने के रूपक और בְּרָכָה के व्यापक अर्थ को बनाए रखता है; आशीष को केवल धन या वर्षा तक सीमित नहीं करता।
- source_word: עַד בְּלִי דָי
  choice: कि तुम्हें और की आवश्यकता न रहे
  rationale: पर्याप्तता से परे प्रचुरता के इब्रानी मुहावरे को सामान्य हिन्दी में व्यक्त करता है; वैकल्पिक पारंपरिक अर्थ फुटनोट में दिए गए हैं।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम सीधे आया है; लिप्यंतरण उसे सामान्य उपाधि में बदलने से बचाता है।
- issue: प्रतिज्ञात आशीष की प्रकृति
  choice: व्यापक ‘आशीष’
  alternative: केवल भौतिक समृद्धि; केवल कृषि-वर्षा
  rationale: संदर्भ कृषि और वाचा-संबंधी प्रबंध से जुड़ा है, पर בְּרָכָה स्वयं व्यापक शब्द है; अनुवाद उसे बाद की किसी समृद्धि-सिद्धि तक सीमित नहीं करता।
- issue: אִם לֹא की आश्वासनात्मक प्रश्न-रचना
  choice: क्या मैं ... नहीं
  alternative: मैं निश्चय ही ... करूँगा
  rationale: मूल में प्रबल सकारात्मक आश्वासन है, फिर भी वह परखने की चुनौती के भीतर प्रश्नात्मक ढंग से व्यक्त हुआ है; दोनों पहलू सुरक्षित रखे गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सार्वजनिक पाठ के योग्य स्तर रखा गया है। वाक्य में प्रत्यक्ष कथन की लय, ईश्वरीय चुनौती और आकाशीय झरोखों का काव्यात्मक बिंब सुरक्षित हैं। ‘दशमांश’ और ‘आशीष’ जैसे व्यापक रूप से समझे जाने वाले बाइबिलीय शब्द रखे गए हैं, पर संप्रदाय-विशेष की व्याख्या नहीं जोड़ी गई।
