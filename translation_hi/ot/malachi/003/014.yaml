id: MAL.3.14
reference: Malachi 3:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אֲמַרְתֶּ֕ם שָׁ֖וְא עֲבֹ֣ד אֱלֹהִ֑ים וּ/מַה בֶּ֗צַע כִּ֤י שָׁמַ֨רְנוּ֙ מִשְׁמַרְתּ֔/וֹ וְ/כִ֤י הָלַ֨כְנוּ֙ קְדֹ֣רַנִּ֔ית מִ/פְּנֵ֖י יְהוָ֥ה צְבָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/014.yaml
  text: You have said[a], ‘It is vain to serve God[d][c][b]. And what profit is it that we have kept his charge and that we have walked in mourning before Yahweh of hosts?’
translation:
  language: hi
  text: तुमने कहा है, “परमेश्वर की सेवा करना व्यर्थ[a] है। हमने उसके सौंपे हुए कर्तव्य का पालन करके[c] और सेनाओं के याहवे के सामने शोकपूर्ण ढंग से चलने[d] से क्या लाभ[b] पाया है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “निष्फल।”
    reason: lexical_alternative
  - marker: b
    text: या “क्या फायदा।”
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से “उसकी रखवाली/चौकसी को रखना”; इसका अर्थ “उसकी अपेक्षा पूरी करना” या “उसके सौंपे हुए कर्तव्य का पालन करना” भी हो सकता है।
    reason: lexical_alternative
  - marker: d
    text: या “उदास होकर चलने” अथवा “काले वस्त्र पहनकर फिरने”; सम्भवतः यह शोकपूर्ण या पश्चात्तापी व्यवहार की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁוְא
  choice: व्यर्थ
  rationale: यह शब्द खालीपन और निष्फलता का भाव व्यक्त करता है। ‘व्यर्थ’ वक्ताओं के इस दावे को स्वाभाविक हिन्दी में स्पष्ट रखता है कि परमेश्वर की सेवा का कोई फल नहीं।
- source_word: עֲבֹד
  choice: सेवा करना
  rationale: यहाँ क्रिया परमेश्वर के प्रति व्यापक सेवा को बताती है, केवल उपासना-विधि को नहीं; इसलिए ‘सेवा करना’ सीधा और उपयुक्त है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: संदर्भ में यह इस्राएल के परमेश्वर के लिए प्रयुक्त है; आधुनिक गरिमापूर्ण हिन्दी में ‘परमेश्वर’ स्वाभाविक है।
- source_word: בֶּצַע
  choice: लाभ
  rationale: यह शब्द प्राप्ति, फायदा या लाभ को सूचित करता है। ‘लाभ’ शिकायत में निहित लेन-देन वाली मानसिकता को बनाए रखता है।
- source_word: מִשְׁמַרְתּוֹ
  choice: उसकी ठहराई हुई ज़िम्मेदारी
  rationale: מִשְׁמֶרֶת किसी सौंपी हुई बाध्यता, कर्तव्य या अपेक्षा को दर्शाता है। यह हिन्दी रूप उस दायित्व-बोध को बनाए रखते हुए ‘उसकी चौकसी’ जैसी भ्रामक शाब्दिकता से बचता है।
- source_word: קְדֹרַנִּית
  choice: शोक मनाते हुए
  rationale: यह दुर्लभ क्रियाविशेषण उदासी, कालिमा या शोकपूर्ण वेश-व्यवहार का संकेत देता है। ‘शोक मनाते हुए’ संभावित पश्चात्तापी या मातमी आचरण को व्यक्त करता है, जबकि पादटिप्पणी वास्तविक वैकल्पिक बिंब सुरक्षित रखती है।
- source_word: מִפְּנֵי
  choice: के सामने
  rationale: दैवी व्यक्तिवाचक कर्म के साथ यह उपस्थिति के सामने होने का भाव देता है; इसे कारणसूचक ‘के कारण’ नहीं बनाया गया।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं के याहवे
  rationale: याहवे वाचा-संबंधी निजी नाम को प्रत्यक्ष रखता है और ‘सेनाओं के’ צְבָאוֹת की सैन्य तथा स्वर्गीय छवि को सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरीय ईश्वरीय नाम प्रत्यक्ष है। ‘याहवे’ उसे पदवी से बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: धार्मिक आचरण के निष्फल होने की शिकायत
  choice: वक्ताओं के निंदक प्रश्न के रूप में प्रस्तुत किया गया है
  alternative: केवल अनुष्ठानिक शोक के विषय में संकीर्ण शिकायत
  rationale: वाक्य में परमेश्वर की सेवा, उसके सौंपे दायित्व का पालन और शोकपूर्ण चाल—तीनों को उस आचरण के रूप में जोड़ा गया है जिसे वक्ता अलाभकारी बताते हैं। उद्धरण-चिह्न स्पष्ट करते हैं कि यह वक्ताओं का दावा है, कथाकार का अनुमोदन नहीं।
- issue: קְדֹרַנִּית का धार्मिक आशय
  choice: ‘शोक मनाते हुए’—बाहरी शोक या संभवतः पश्चात्तापी व्यवहार
  alternative: उदास होकर; काले वस्त्र पहनकर
  rationale: मूल शब्द शोकपूर्ण मनोदशा और गहरे/काले बाहरी रूप दोनों की ओर संकेत कर सकता है। मुख्य पाठ संभावित मुहावरेदार अर्थ देता है और पादटिप्पणी बिंब की अनिश्चितता सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। शिकायत का वाक्य बोलचाल की स्वाभाविकता के साथ प्रस्तुत है। ‘याहवे’ निजी ईश्वरीय नाम को और ‘सेनाओं के’ मूल उपाधि की छवि को बनाए रखता है।
