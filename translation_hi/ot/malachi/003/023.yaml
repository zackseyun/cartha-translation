source:
  edition: WLC
  text: הִנֵּ֤ה אָֽנֹכִי֙ שֹׁלֵ֣חַ לָ/כֶ֔ם אֵ֖ת אֵלִיָּ֣ה הַ/נָּבִ֑יא לִ/פְנֵ֗י בּ֚וֹא י֣וֹם יְהוָ֔ה הַ/גָּד֖וֹל וְ/הַ/נּוֹרָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/023.yaml
  text: Look[b][a], I am sending Elijah the prophet to you before the coming of the great and fearful day of Yahweh.
translation:
  language: hi
  text: देखो, मैं एलिय्याह[b] नबी को तुम्हारे पास भेज रहा हूँ, इससे पहले कि यहोवा का वह महान और भयावह दिन आए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘यहोवा का वह महान और भयानक दिन।’
    reason: lexical_alternative
  - marker: b
    text: ‘एलिय्याह’ को शाब्दिक रूप में या एलिय्याह के समान किसी अग्रदूत के रूप में समझा जा सकता है; इब्रानी पाठ स्वयं केवल ‘एलिय्याह नबी’ कहता है।
    reason: cross_reference
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह शब्द किसी महत्त्वपूर्ण और ज़ोरदार घोषणा की ओर ध्यान खींचता है। ‘देखो’ आधुनिक हिन्दी में इसकी संकेतात्मक और बलात्मक शक्ति बनाए रखता है।
- source_word: אָֽנֹכִי
  choice: मैं
  rationale: स्वतंत्र सर्वनाम कर्ता पर बल देता है। हिन्दी में ‘देखो, मैं…’ की रचना इस बल को स्वाभाविक रूप से व्यक्त करती है; ‘मैं स्वयं’ कहना आवश्यकता से अधिक स्पष्ट होता।
- source_word: שֹׁלֵחַ
  choice: भेज रहा हूँ
  rationale: इब्रानी कृदंत आसन्न अथवा सजीव वर्तमान-भविष्य की कार्रवाई व्यक्त करता है। यह रूप भविष्यसूचक तात्कालिकता को बनाए रखता है।
- source_word: לָכֶם
  choice: तुम्हारे पास
  rationale: यहाँ ל प्राप्तकर्ताओं की ओर भेजे जाने का भाव देता है। किसी व्यक्ति को भेजने के प्रसंग में ‘तुम्हारे पास’ स्वाभाविक हिन्दी है।
- source_word: אֵלִיָּה הַנָּבִיא
  choice: एलिय्याह नबी
  rationale: व्यक्तिनाम को लिप्यंतरित किया गया है और उसके साथ लगे पदनाम को सीधे अनूदित किया गया है, बिना उसकी पहचान की व्याख्या जोड़े।
- source_word: לִפְנֵי בּוֹא
  choice: इससे पहले कि … आए
  rationale: यह पदबंध समयगत पूर्वता बताता है। हिन्दी की उपवाक्यीय रचना मूल अर्थ को स्पष्ट और स्वाभाविक ढंग से व्यक्त करती है।
- source_word: יוֹם יְהוָה
  choice: यहोवा का … दिन
  rationale: मूल का संबंधसूचक भाव सुरक्षित है और परमेश्वर के विशिष्ट नाम יהוה को ‘यहोवा’ के रूप में प्रस्तुत किया गया है।
- source_word: הַגָּדוֹל
  choice: महान
  rationale: यह विशेषण उस दिन की व्यापकता और महत्त्व दोनों को व्यक्त करता है।
- source_word: וְהַנּוֹרָא
  choice: और भयावह
  rationale: यह शब्द उस दिन के भय और आतंक उत्पन्न करने वाले स्वरूप को व्यक्त करता है। ‘भयावह’ आधुनिक, गरिमापूर्ण और न्याय-संदर्भ के अनुकूल है।
theological_decisions:
- issue: ‘एलिय्याह’ का अभिप्रेत व्यक्ति
  choice: मुख्य पाठ में सीधे ‘एलिय्याह नबी’ रखा गया है।
  alternative: इसे एलिय्याह के समान किसी अग्रदूत के रूप में स्पष्ट करना।
  rationale: इब्रानी पाठ सीधे एलिय्याह का नाम लेता है। बाद की संभावित प्रतिरूपात्मक पहचान को मुख्य अनुवाद में जोड़ना मूल की खुली हुई धार्मिक व्याख्यात्मक संभावना को अनावश्यक रूप से सीमित करता।
- issue: यहोवा के दिन का स्वर
  choice: ‘महान और भयावह दिन’—महिमा और आतंक दोनों को बनाए रखा गया है।
  alternative: ‘महान और विस्मयकारी दिन’ या ‘महान और भयानक दिन’।
  rationale: संदर्भ में यह अभिव्यक्ति केवल विस्मय नहीं, बल्कि न्याय से उत्पन्न भय भी बताती है। ‘भयावह’ उस तनाव को आधुनिक हिन्दी में सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण स्तर रखा गया है। ‘देखो’ घोषणा का बल देता है; ‘भेज रहा हूँ’ भविष्यसूचक तात्कालिकता को स्वाभाविक रूप में व्यक्त करता है। पदक्रम हिन्दी के अनुसार बदला गया है, पर मूल की अस्पष्टता और धार्मिक तनाव सुरक्षित हैं।
