language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בַּ/מְּאֵרָה֙ אַתֶּ֣ם נֵֽאָרִ֔ים וְ/אֹתִ֖/י אַתֶּ֣ם קֹבְעִ֑ים הַ/גּ֖וֹי כֻּלּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/009.yaml
  text: You are cursed with a curse[a], for you are robbing me—the whole nation of you.
translation:
  language: hi
  text: तुम शाप से शापित हो[a], क्योंकि तुम मुझे लूट रहे हो—तुम सब, पूरा राष्ट्र।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम शाप के अधीन हो और तुम मुझे लूट रहे हो—तुम सब, पूरा राष्ट्र।”
    reason: ‘शाप से शापित’ के स्थान पर बַּמְּאֵרָה का स्थितिवाचक अर्थ ‘शाप के अधीन’ संभव है। वְ का साधारण संयोजक अर्थ ‘और’ भी संभव है; मुख्य पाठ में प्रसंगानुसार कारणात्मक संबंध ‘क्योंकि’ दिया गया है।
lexical_decisions:
- source_word: בַּמְּאֵרָה
  choice: शाप से
  rationale: संज्ञा מְאֵרָה का अर्थ ‘शाप’ है। उपसर्ग ב को साधनवाचक मानते हुए ‘शाप से’ हिब्रू की बलपूर्ण पुनरुक्ति ‘शाप से शापित’ को बनाए रखता है।
- source_word: נֵאָרִים
  choice: शापित हो
  rationale: यह ארר का कर्मवाच्य कृदन्त है और लोगों की वर्तमान, परिणामस्वरूप स्थिति व्यक्त करता है।
- source_word: וְאֹתִי
  choice: फिर भी तुम मुझे
  rationale: וְ का मूल अर्थ ‘और’ है, पर यहाँ शापित होने के बावजूद परमेश्वर को लूटते रहने के कारण विरोधसूचक भाव स्वाभाविक है। चिह्नित कर्म אֹתִי के कारण ‘मुझे’ स्पष्ट रखा गया है।
- source_word: קֹבְעִים
  choice: लूट रहे हो
  rationale: इस प्रसंग में קבע का अर्थ किसी का हक रोककर उसे लूटना या ठगना है। दशमांश और भेंट रोकने के निकट संदर्भ में ‘लूट रहे हो’ स्पष्ट और बलपूर्ण है।
- source_word: הַגּוֹי כֻּלּוֹ
  choice: तुम्हारा पूरा राष्ट्र
  rationale: शाब्दिक भाव ‘पूरा राष्ट्र, उसका समूचा भाग’ है। ‘तुम्हारा पूरा राष्ट्र’ सामूहिक पहचान और बहुवचन संबोधन दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: न्याय का सामूहिक दायरा
  choice: वचन पूरे राष्ट्र को सामूहिक रूप से संबोधित करता है; पूरा समुदाय परमेश्वर को लूटने और शाप के अधीन होने में सम्मिलित है।
  alternative: अंतिम पदबंध को राष्ट्रीय पहचान पर विशेष बल दिए बिना केवल ‘तुम सब’ अर्थ वाला समानाधिकरणात्मक बलवर्धक माना जा सकता है।
  rationale: הַגּוֹי כֻּלּוֹ स्पष्ट सामूहिक पदबंध है और प्रसंग समुदाय की वाचा-विषयक अविश्वासयोग्यता से जुड़ा है; अनुवाद किसी बाद की धर्मसैद्धान्तिक व्यवस्था को आरोपित किए बिना राष्ट्रीय और सामूहिक दोनों आयाम रखता है।
- issue: וְ का संबंधसूचक भाव
  choice: इसे विरोधसूचक ‘फिर भी’ के रूप में प्रस्तुत किया गया है।
  alternative: इसे सामान्य संयोजक ‘और’ या संदर्भानुसार कारणसूचक ‘क्योंकि’ समझा जा सकता है।
  rationale: हिब्रू וְ स्वयं संबंध को पूरी तरह निर्दिष्ट नहीं करता। शापित अवस्था के बावजूद चोरी जारी रहने का विरोध यहाँ सहज है, पर अन्य सम्भावनाएँ पादटिप्पणी में सुरक्षित रखी गई हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘शाप से शापित’ सामान्य हिन्दी से कुछ अधिक हिब्रू-निष्ठ है, पर मूल की जानबूझकर की गई पुनरुक्ति और न्याय की तीव्रता सुरक्षित रखने के लिए चुना गया है।
