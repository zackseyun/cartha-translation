reference: Malachi 3:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/יָשַׁ֨ב מְצָרֵ֤ף וּ/מְטַהֵר֙ כֶּ֔סֶף וְ/טִהַ֤ר אֶת בְּנֵֽי לֵוִי֙ וְ/זִקַּ֣ק אֹתָ֔/ם כַּ/זָּהָ֖ב וְ/כַ/כָּ֑סֶף וְ/הָיוּ֙ לַֽ/יהוָ֔ה מַגִּישֵׁ֥י מִנְחָ֖ה בִּ/צְדָקָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/003.yaml
  text: He will sit as a refiner and purifier of silver[a], and he will purify the sons of Levi and refine them like gold and like silver, and they will be for Yahweh, presenting an offering in righteousness.
translation:
  language: hi
  text: वह चाँदी का परिष्कर्ता और शुद्ध करनेवाला बनकर बैठेगा; वह लेवी के पुत्रों को शुद्ध करेगा और उन्हें सोने और चाँदी के समान परिष्कृत करेगा। तब वे यहोवा के लिए धार्मिकता के साथ भेंट[a] चढ़ानेवाले होंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘भेंट’ के स्थान पर ‘अन्नबलि’ भी संभव है। इब्रानी शब्द מִנְחָה प्रायः अन्नबलि के लिए आता है, पर इसका अर्थ अधिक व्यापक रूप से भेंट या उपहार भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשַׁב
  choice: वह ... बैठेगा
  rationale: क्रिया का मूल अर्थ ‘बैठना’ है। यह धातु शुद्ध करनेवाले कारीगर के ध्यानपूर्वक बैठकर काम करने का सजीव चित्र बनाए रखता है।
- source_word: מְצָרֵף וּמְטַהֵר כֶּסֶף
  choice: चाँदी को परिशुद्ध करने और शुद्ध करनेवाले के समान
  rationale: मूल पाठ में धातु को तपाकर अशुद्धियाँ निकालने और उसे शुद्ध करने की समानांतर क्रियाएँ हैं। ‘परिशुद्ध’ धातुकर्म की छवि को और ‘शुद्ध’ उसके व्यापक अनुष्ठानिक तथा नैतिक संकेत को बनाए रखता है।
- source_word: בְּנֵי לֵוִי
  choice: लेवी के पुत्रों
  rationale: यह इब्रानी पारिवारिक/वंशगत अभिव्यक्ति का सीधा रूप है और याजकीय वंश पर तत्काल संदर्भ का ध्यान बनाए रखता है।
- source_word: וְזִקַּק אֹתָם
  choice: उन्हें ... परिशुद्ध करेगा
  rationale: इस संदर्भ में क्रिया का अर्थ धातु को तपाकर निर्मल करना है; यह रूपक को बिना अनावश्यक व्याख्या के सुरक्षित रखता है।
- source_word: כַּזָּהָב וְכַכָּסֶף
  choice: सोने और चाँदी के समान
  rationale: दोनों धातुओं वाली उपमा स्पष्ट और स्वाभाविक हिन्दी में बनी रहती है।
- source_word: וְהָיוּ לַיהוָה
  choice: तब वे यहोवा के लिए ... होंगे
  rationale: वाक्यांश समर्पण अथवा यहोवा के लिए नियुक्त होने का भाव व्यक्त करता है। ‘के लिए’ मूल संरचना और आराधनात्मक संदर्भ दोनों को बनाए रखता है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: व्यक्तिगत ईश्वरीय नाम יהוה को ‘यहोवा’ से व्यक्त किया गया है, जिससे नाम और उसके व्याकरणिक संबंध को स्पष्ट रखा जाता है।
- source_word: מַגִּישֵׁי מִנְחָה
  choice: भेंट चढ़ानेवाले
  rationale: מגישׁ का अर्थ निकट लाकर प्रस्तुत करना/चढ़ाना है। מנחה यहाँ व्यापक रूप से भेंट हो सकता है, यद्यपि यह विशेषतः अन्नबलि भी सूचित कर सकता है; विशिष्ट विकल्प पादटिप्पणी में रखा गया है।
- source_word: בִּצְדָקָה
  choice: धार्मिकता से
  rationale: यह צְדָקָה के नैतिक और उपासना-संबंधी बल को स्वाभाविक हिन्दी में बनाए रखता है और बताता है कि भेंट उचित/धर्मी रीति से चढ़ाई जाएगी।
theological_decisions:
- issue: शुद्ध किए जानेवालों की पहचान
  choice: मुख्य पाठ में ‘लेवी के पुत्रों’ अर्थात् याजकीय वंश पर ध्यान रखा गया है।
  alternative: इसे समस्त इस्राएल की शुद्धि या बाद की मसीही व्याख्या के रूप में विस्तृत करना।
  rationale: तत्काल इब्रानी पाठ स्पष्ट रूप से लेवी के पुत्रों का नाम लेता है; व्यापक धर्मवैज्ञानिक अनुप्रयोगों को अनुवाद के शब्दों में नहीं जोड़ा गया।
- issue: מִנְחָה की विशिष्टता
  choice: मुख्य पाठ में व्यापक ‘भेंट’।
  alternative: ‘अन्नबलि’।
  rationale: शब्द प्रायः अन्नबलि के लिए आता है, पर भेंट/उपहार के व्यापक अर्थ में भी प्रयुक्त होता है। मूल की अर्थगत गुंजाइश रखने के लिए व्यापक रूप मुख्य पाठ में और विशिष्ट विकल्प पादटिप्पणी में दिया गया है।
- issue: בִּצְדָקָה का संबंध
  choice: ‘धार्मिकता से’ को भेंट चढ़ाने की रीति/स्थिति से जोड़ा गया है।
  alternative: ‘धार्मिकता में भेंट’ अथवा ऐसी भेंट जो धार्मिकता के अनुरूप हो।
  rationale: इब्रानी पूर्वसर्गीय वाक्यांश में रीति, दशा या अनुरूपता की निकटवर्ती छायाएँ संभव हैं; हिन्दी रूप मूल के नैतिक-उपासना संबंधी तनाव को संक्षेप में रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सहज स्तर रखा गया है। धातु-शोधन के रूपक को स्पष्ट रखने के लिए ‘परिशुद्ध’ और धार्मिक/अनुष्ठानिक आयाम के लिए ‘शुद्ध’ का प्रयोग किया गया है। पादटिप्पणी चिह्न मुख्य पाठ में उपस्थित है।
