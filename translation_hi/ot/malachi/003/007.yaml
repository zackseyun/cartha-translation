source:
  edition: WLC
  text: לְ/מִ/ימֵ֨י אֲבֹתֵי/כֶ֜ם סַרְתֶּ֤ם מֵֽ/חֻקַּ/י֙ וְ/לֹ֣א שְׁמַרְתֶּ֔ם שׁ֤וּבוּ אֵלַ/י֙ וְ/אָשׁ֣וּבָה אֲלֵי/כֶ֔ם אָמַ֖ר יְהוָ֣ה צְבָא֑וֹת וַ/אֲמַרְתֶּ֖ם בַּ/מֶּ֥ה נָשֽׁוּב׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/007.yaml
  text: From the days of your fathers you have turned aside from my statutes and have not kept them. Return to me[a], and I will return to you, says Yahweh of hosts. But you say, “How shall we return?”
translation:
  language: hi
  text: तुम्हारे पुरखों[a] के दिनों से तुम मेरी विधियों से हट गए हो और तुमने उनका पालन नहीं किया। मेरी ओर लौटो, और मैं तुम्हारी ओर लौटूँगा—सेनाओं के याहवे का कहना है। पर तुम कहते हो, “हम कैसे लौटें?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “तुम्हारे पिताओं”; यहाँ आशय पूर्वजों से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמִימֵי אֲבֹתֵיכֶם
  choice: तुम्हारे पुरखों के दिनों से
  rationale: यह पदबंध अतीत में आरम्भ होकर वर्तमान तक चली आ रही स्थिति को दिखाता है। ‘पुरखे’ आधुनिक हिन्दी में व्यापक पूर्वज-संबंधी अर्थ को स्वाभाविक रूप से व्यक्त करता है, जबकि पादटिप्पणी इब्रानी के शाब्दिक रूप को सुरक्षित रखती है।
- source_word: סַרְתֶּם מֵחֻקַּי
  choice: तुम मेरी विधियों से फिर गए हो
  rationale: סור किसी मार्ग या मानक से हटने का भाव देता है; ‘फिर गए’ उस रूपक को बनाए रखता है। חֻקִּים के लिए ‘विधियाँ’ परमेश्वर द्वारा ठहराए गए नियमों का संक्षिप्त और प्रचलित हिन्दी रूप है।
- source_word: וְלֹא שְׁמַרְתֶּם
  choice: और तुमने उनका पालन नहीं किया
  rationale: वाचा और व्यवस्था के संदर्भ में שׁמר का अर्थ मानना या पालन करना है। ‘उनका’ का संकेत ठीक पहले आई ‘विधियों’ की ओर है।
- source_word: שׁוּבוּ אֵלַי
  choice: मेरी ओर लौटो
  rationale: שׁוב में वास्तविक वापसी के साथ पश्चाताप का वाचाई भाव भी निहित है। ‘लौटो’ अर्थ को स्पष्ट रखता है, पर व्याख्यात्मक विस्तार नहीं करता।
- source_word: וְאָשׁוּבָה אֲלֵיכֶם
  choice: और मैं तुम्हारी ओर लौटूँगा
  rationale: दोनों खंडों में שׁוב की पुनरावृत्ति जानबूझकर बनाए रखी गई है, जिससे मूल की पारस्परिक वाचाई अभिव्यक्ति सुरक्षित रहती है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं के याहवे
  rationale: יְהוָה को उसके व्यक्तिगत वाचा-नाम ‘याहवे’ के रूप में और צְבָאוֹת को ‘सेनाओं’ के रूप में रखा गया है, जिससे स्वर्गीय या सैन्य दलों की मूल छवि बनी रहती है।
- source_word: בַּמֶּה נָשׁוּב
  choice: हम कैसे लौटें?
  rationale: בַּמֶּה यहाँ रीति या साधन पूछता है। ‘कैसे’ आधुनिक हिन्दी में स्वाभाविक है और लोगों के प्रश्न की संदिग्ध अथवा प्रतिवादी धार को बिना बढ़ाए बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। ‘याहवे’ वाचा-नाम को सामान्य उपाधि में बदलने के बजाय उसके नामात्मक स्वरूप को सुरक्षित रखता है।
- issue: ‘मेरी ओर लौटो, और मैं तुम्हारी ओर लौटूँगा’ की पारस्परिक भाषा
  choice: दोनों स्थानों पर ‘लौटना’
  alternative: ‘मन फिराओ, तब मैं तुम पर कृपा करूँगा’
  rationale: व्याख्यात्मक विकल्प संभावित धार्मिक आशय स्पष्ट करता, पर मूल में एक ही धातु שׁוב की पुनरावृत्ति और उससे उत्पन्न तनाव को मिटा देता। इसलिए पारस्परिक शब्दावली ज्यों की त्यों रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘पुरखे’, ‘विधियाँ’ और ‘लौटो’ जैसे शब्द मूल के वाचाई और भविष्यद्वक्तीय स्वर को बनाए रखते हैं, बिना अत्यधिक संस्कृतनिष्ठ या सांप्रदायिक शब्दावली अपनाए।
