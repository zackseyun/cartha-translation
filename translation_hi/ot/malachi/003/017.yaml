id: MAL.3.17
reference: Malachi 3:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הָ֣יוּ לִ֗/י אָמַר֙ יְהוָ֣ה צְבָא֔וֹת לַ/יּ֕וֹם אֲשֶׁ֥ר אֲנִ֖י עֹשֶׂ֣ה סְגֻלָּ֑ה וְ/חָמַלְתִּ֣י עֲלֵי/הֶ֔ם כַּֽ/אֲשֶׁר֙ יַחְמֹ֣ל אִ֔ישׁ עַל בְּנ֖/וֹ הָ/עֹבֵ֥ד אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/017.yaml
  text: And they will be mine[a], says Yahweh of Armies, on the day when I make them a treasured possession[c][b], and I will spare them as a man spares his son who serves him.
translation:
  language: hi
  text: 'सेनाओं का याहवे यह कहता है: “जिस दिन मैं उन्हें अपनी बहुमूल्य सम्पत्ति बनाऊँगा, उस दिन वे मेरे होंगे। मैं उन्हें बख्शूँगा, जैसे कोई मनुष्य अपने उस पुत्र को बख्शता है जो उसकी सेवा करता है।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיוּ לִי
  choice: वे मेरे होंगे
  rationale: भविष्य में सम्बन्ध और स्वामित्व—दोनों का सीधा तथा स्वाभाविक हिन्दी रूप।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का याहवे
  rationale: याहवे वाचा के निजी नाम को बनाए रखता है; ‘सेनाओं का’ צְבָאוֹת के सैन्य और व्यापक स्वर्गीय संकेत को आधुनिक पाठक के लिए स्पष्ट करता है।
- source_word: לַיּוֹם אֲשֶׁר אֲנִי עֹשֶׂה
  choice: जिस दिन मैं उन्हें ... बनाऊँगा
  rationale: हिब्रू के कालगत सम्बन्ध को स्वाभाविक हिन्दी में व्यक्त करता है; ‘उन्हें’ पूर्ववर्ती बहुवचन कर्ता से सन्दर्भानुसार पूरा किया गया है।
- source_word: סְגֻלָּה
  choice: अपनी बहुमूल्य सम्पत्ति
  rationale: यह शब्द किसी स्वामी या राजा की विशेष रूप से मूल्यवान निजी सम्पत्ति का बोध कराता है; ‘अपनी’ का आधार पहले आया ‘मेरे होंगे’ है।
- source_word: וְחָמַלְתִּי עֲלֵיהֶם
  choice: मैं उन्हें बख्श दूँगा
  rationale: חמל में दया करने और दण्ड से बचाने, दोनों का भाव हो सकता है; न्याय के प्रसंग में ‘बख्श दूँगा’ उपयुक्त है।
- source_word: כַּאֲשֶׁר יַחְמֹל אִישׁ עַל בְּנוֹ
  choice: जैसे कोई पिता अपने ... पुत्र को बख्श देता है
  rationale: हिब्रू में ‘मनुष्य/पुरुष’ और ‘उसका पुत्र’ है; हिन्दी में ‘पिता’ सम्बन्ध को बिना अर्थ बदले स्वाभाविक रूप से स्पष्ट करता है और पुरुष-पुत्र बिम्ब बनाए रखता है।
- source_word: הָעֹבֵד אֹתוֹ
  choice: जो उसकी सेवा करता है
  rationale: עבד के सेवा-सम्बन्धी अर्थ को सीधे रखता है और इसे केवल आर्थिक ‘काम करने’ तक सीमित नहीं करता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: मूल पाठ में वाचा का विशिष्ट नाम है; उसका लिप्यन्तरण नाम और उपाधि के भेद को सुरक्षित रखता है।
- issue: סְגֻלָּה के साथ स्वामित्व का सम्बन्ध
  choice: अपनी बहुमूल्य सम्पत्ति
  alternative: एक बहुमूल्य सम्पत्ति
  rationale: हिब्रू पद का ठीक पहले के ‘वे मेरे होंगे’ से निकट सम्बन्ध है। ‘अपनी’ इस सम्बन्ध को स्वाभाविक हिन्दी में व्यक्त करता है, यद्यपि पद के भीतर अलग अधिकारवाचक सर्वनाम नहीं है।
- issue: חמל का दया अथवा दण्ड से बचाने वाला अर्थ
  choice: बख्श दूँगा
  alternative: दया करूँगा
  rationale: दोनों अर्थ सम्भव हैं, पर इस प्रसंग में भाव दण्ड से बचाने का है; पिता-पुत्र की उपमा उस कार्य को करुणापूर्ण बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और वाचनयोग्य शैली रखी गई है। ‘बख्श देना’ सामान्य हिन्दी में दण्ड से छोड़ देने का स्पष्ट अर्थ देता है। वाक्यक्रम को हिन्दी के स्वाभाविक प्रवाह के लिए बदला गया है, जबकि भविष्यकाल, स्वामित्व, न्याय से बचाए जाने और पिता-पुत्र की उपमा को सुरक्षित रखा गया है।
