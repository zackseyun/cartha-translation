id: MAL.3.15
reference: Malachi 3:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/עַתָּ֕ה אֲנַ֖חְנוּ מְאַשְּׁרִ֣ים זֵדִ֑ים גַּם נִבְנוּ֙ עֹשֵׂ֣י רִשְׁעָ֔ה גַּ֧ם בָּחֲנ֛וּ אֱלֹהִ֖ים וַ/יִּמָּלֵֽטוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/015.yaml
  text: So now we call the arrogant blessed[a]; evildoers are even built up[c][b]; they even test God and escape.’
translation:
  language: hi
  text: इसलिए अब हम घमंडियों को धन्य कहते हैं[a]। दुष्टता करनेवाले भी फलते-फूलते हैं[b]; वे परमेश्वर को परखते भी हैं[c] और बच निकलते हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अभिमानियों को सुखी मानते हैं।’
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘बनाए गए हैं’; अर्थात वे स्थापित होते या समृद्ध होते हैं।
    reason: lexical_alternative
  - marker: c
    text: या ‘परमेश्वर की परीक्षा लेते हैं।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: इसलिए अब
  rationale: यह पद पिछले कथन से जुड़कर लोगों के वर्तमान निष्कर्ष को व्यक्त करता है; ‘इसलिए अब’ संबंध और निष्कर्ष—दोनों को स्वाभाविक हिन्दी में दर्शाता है।
- source_word: מְאַשְּׁרִים
  choice: हम ... को धन्य कहते हैं
  rationale: यहाँ אשר का भाव किसी को धन्य या सुखी घोषित/मानने का है। ‘धन्य कहते हैं’ मूल्यांकनात्मक कथन को बनाए रखता है।
- source_word: זֵדִים
  choice: घमंडियों
  rationale: यह शब्द अभिमानी, ढीठ या धृष्ट लोगों को दर्शाता है। ‘घमंडी’ आधुनिक हिन्दी में सहज और नैतिक संदर्भ के अनुकूल है।
- source_word: גַּם
  choice: भी
  rationale: दोनों occurrences शिकायत में जोरदार वृद्धि जोड़ते हैं; हिन्दी में ‘भी’ इसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: נִבְנוּ
  choice: फलते-फूलते हैं
  rationale: בנה के निफ़अल का शाब्दिक अर्थ ‘बनाए जाते/बसाए जाते हैं’ है, पर यहाँ रूपकतः स्थापित होने या समृद्ध होने का भाव है। ‘फलते-फूलते हैं’ संदर्भगत अर्थ को स्पष्ट और स्वाभाविक रखता है।
- source_word: עֹשֵׂי רִשְׁעָה
  choice: दुष्टता करनेवाले
  rationale: प्रतिभागी पदबंध का अर्थ ऐसे लोग हैं जो दुष्टता करते या उसका अभ्यास करते हैं। यह रूप मूल संरचना और निरंतर आचरण का भाव बनाए रखता है।
- source_word: בָּחֲנוּ אֱלֹהִים
  choice: परमेश्वर को परखते हैं
  rationale: בחן जाँचने या परखने को दर्शाता है; इस संदर्भ में लोग धृष्टतापूर्वक परमेश्वर को चुनौती देकर उसकी परीक्षा लेते हैं।
- source_word: וַיִּמָּלֵטוּ
  choice: और बच निकलते हैं
  rationale: מלט के निफ़अल का अर्थ बच निकलना या छुड़ाया जाना है। शिकायत का आशय है कि वे दंड से बच जाते हैं, जिसे यह हिन्दी स्पष्ट करती है।
theological_decisions:
- issue: אֱלֹהִים का अनुवाद, जहाँ यह ईश्वरीय नाम नहीं बल्कि उपाधि है
  choice: परमेश्वर
  alternative: ईश्वर
  rationale: यहाँ אֱלֹהִים इस्राएल के परमेश्वर के लिए सामान्य संज्ञा/उपाधि है, יהוה नाम नहीं। ‘परमेश्वर’ आधुनिक हिन्दी बाइबलीय प्रयोग में स्वाभाविक और स्पष्ट है।
- issue: נִבְנוּ के रूपक को शाब्दिक रखना या उसका संदर्भगत अर्थ देना
  choice: फलते-फूलते हैं
  alternative: स्थापित होते हैं / बनाए जाते हैं
  rationale: शाब्दिक ‘बनाए जाते हैं’ हिन्दी में यहाँ अस्पष्ट होगा। ‘फलते-फूलते हैं’ दुष्टों की उन्नति संबंधी शिकायत व्यक्त करता है, जबकि पादटिप्पणी मूल रूपक की जानकारी सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। पद शिकायत के रूप में उद्धृत वचन का अंत है, इसलिए समापन उद्धरण-चिह्न रखा गया है। ‘दुष्टता करनेवाले’ मूल सहभागी पदबंध को और ‘बच निकलते हैं’ दंड से बचने के संदर्भगत भाव को सुरक्षित रखते हैं।
