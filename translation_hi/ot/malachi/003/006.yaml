language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֛י אֲנִ֥י יְהוָ֖ה לֹ֣א שָׁנִ֑יתִי וְ/אַתֶּ֥ם בְּנֵֽי יַעֲקֹ֖ב לֹ֥א כְלִיתֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/006.yaml
  text: For I[a], Yahweh, do not change; and you, sons of Jacob[b], have not come to an end.
translation:
  language: hi
  text: क्योंकि मैं, याहवे, नहीं बदलता; और तुम, याकूब के पुत्रों[b], मिट नहीं गए हो[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘समाप्त नहीं हुए हो,’ ‘नष्ट नहीं हुए हो।’ इब्रानी क्रिया का अर्थ चुक जाना, मिट जाना, नष्ट होना या समाप्त हो जाना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘याकूब के पुत्रों’; यह याकूब के वंशजों, अर्थात इस्राएल, के लिए वाचा-संबंधी पदनाम है।
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार या स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ हिन्दी में इस कारणसूचक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी विशिष्ट ईश्वरीय नाम को उपाधि से बदलने के बजाय नाम के रूप में लिप्यंतरित किया गया है।
- source_word: לֹא שָׁנִיתִי
  choice: मैं ... नहीं बदलता
  rationale: इब्रानी पूर्ण रूप यहाँ याहवे की स्थायी और निरंतर एकरूपता बताता है; हिन्दी का सामान्य वर्तमान काल इस कथन को सहज ढंग से व्यक्त करता है।
- source_word: וְאַתֶּם
  choice: और तुम
  rationale: וְ को सीधे ‘और’ रखा गया है, ताकि मूल में निहित संभावित परिणाम-संबंध को ‘इसलिए’ जोड़कर अनावश्यक रूप से स्पष्ट न किया जाए।
- source_word: בְּנֵי יַעֲקֹב
  choice: याकूब के पुत्रो
  rationale: मूल के पुरुषवाचक बहुवचन और वाच्यार्थ को बनाए रखते हुए इसे संबोधन के स्वाभाविक हिन्दी रूप में रखा गया है; यह याकूब के वंशजों अर्थात इस्राएल के लिए वाचा-संबंधी पदनाम है।
- source_word: לֹא כְלִיתֶם
  choice: मिट नहीं गए हो
  rationale: כלה के समाप्त होने, चुक जाने या नष्ट हो जाने के अर्थ-क्षेत्र को सहज हिन्दी में व्यक्त करता है और विनाश के किसी विशेष ढंग को तय नहीं करता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: पाठ में उपाधि नहीं, चार-अक्षरीय विशिष्ट नाम है; इसलिए उसे नाम के रूप में प्रस्तुत किया गया है।
- issue: לֹא שָׁנִיתִי का काल और आशय
  choice: नहीं बदलता
  alternative: नहीं बदला हूँ
  rationale: वाक्य याहवे की स्थायी एकरूपता की घोषणा करता है। सामान्य वर्तमान काल इस निरंतर सत्य को व्यक्त करता है, पर पाठ से परे कोई दार्शनिक परिभाषा नहीं जोड़ता।
- issue: וְ का तार्किक संबंध
  choice: और
  alternative: इसलिए
  rationale: याहवे के न बदलने और याकूब के पुत्रों के बचे रहने के बीच परिणाम-संबंध संदर्भ में संभव है, पर संयोजक स्वयं सामान्य וְ है; ‘और’ मूल की संभावित अर्थगत खुलावट बनाए रखता है।
- issue: בְּנֵי יַעֲקֹב में सामूहिक पहचान
  choice: याकूब के पुत्रो
  alternative: याकूब के वंशजो
  rationale: शाब्दिक वाचा-संबंधी संबोधन सुरक्षित रखा गया है; पादटिप्पणी स्पष्ट करती है कि अभिप्राय याकूब के वंशज, अर्थात इस्राएल, हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘याकूब के पुत्रो’ में संबोधन के कारण ‘पुत्रो’ का रूप प्रयुक्त है। विरामचिह्न दोनों निकट-संबंधित कथनों को जोड़ते हैं, जबकि ‘और’ मूल संयोजक की अस्पष्टता बनाए रखता है।
