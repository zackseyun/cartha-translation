id: MAL.3.8
reference: Malachi 3:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הֲ/יִקְבַּ֨ע אָדָ֜ם אֱלֹהִ֗ים כִּ֤י אַתֶּם֙ קֹבְעִ֣ים אֹתִ֔/י וַ/אֲמַרְתֶּ֖ם בַּ/מֶּ֣ה קְבַעֲנ֑וּ/ךָ הַֽ/מַּעֲשֵׂ֖ר וְ/הַ/תְּרוּמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/008.yaml
  text: Will a man rob God? Yet you are robbing me[a]. But you say[b], “How have we robbed you?” In the tithe and the contribution.
translation:
  language: hi
  text: “क्या कोई मनुष्य[a] परमेश्वर को लूटेगा? फिर भी तुम मुझे लूट रहे हो। पर तुम कहते हो, ‘हमने आपको कैसे लूटा है?’ दशमांश और चढ़ावे[b] में।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘मनुष्य’ का अर्थ सामान्य रूप से कोई भी मानव है।
    reason: lexical_alternative
  - marker: b
    text: या “भेंट”; मूल इब्रानी शब्द पवित्र उपयोग के लिए अलग किए गए अंशदान को भी दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקְבַּע / קֹבְעִים / קְבַעֲנוּךָ
  choice: लूटेगा / लूट रहे हो / लूटा है
  rationale: इस संदर्भ में קבע का अर्थ परमेश्वर को उसका देय न देकर अनुचित रूप से अपने पास रखना है। ‘लूटना’ आरोप की तीव्रता और अलंकारिक झटके को बनाए रखता है; ‘ठगना’ संभव है, पर अपेक्षाकृत कम प्रत्यक्ष है।
- source_word: אָדָם
  choice: कोई मनुष्य
  rationale: यहाँ एकवचन אָדָם का अर्थ सामान्य रूप से कोई भी मानव है, न कि केवल पुरुष। ‘कोई मनुष्य’ हिन्दी में इस सामान्य और नीतिवचन-सदृश प्रश्न को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: यहाँ אֱלֹהִים इस्राएल के परमेश्वर के लिए प्रयुक्त है; ‘परमेश्वर’ आधुनिक हिन्दी बाइबलीय शैली में स्पष्ट और प्रतिष्ठित पद है।
- source_word: כִּי
  choice: फिर भी
  rationale: यहाँ כִּי प्रश्न के विपरीत चौंकाने वाली वास्तविकता प्रस्तुत करता है। ‘फिर भी’ उसके विरोधात्मक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בַּמֶּה
  choice: कैसे
  rationale: यह प्रश्न उस रीति या बात को पूछता है जिसमें लोगों ने परमेश्वर को लूटा। ‘कैसे’ संक्षिप्त और स्वाभाविक हिन्दी है।
- source_word: הַמַּעֲשֵׂר
  choice: दशमांश
  rationale: यह परमेश्वर को दिए जाने वाले निर्धारित दसवें भाग का मानक और समझने योग्य हिन्दी पद है।
- source_word: הַתְּרוּמָה
  choice: चढ़ावा
  rationale: תְּרוּמָה पवित्र उपयोग के लिए अलग किए गए अंश या भेंट को दर्शाता है। ‘चढ़ावा’ धार्मिक संदर्भ को स्वाभाविक हिन्दी में व्यक्त करता है, बिना किसी विशिष्ट अनुष्ठानिक क्रिया को अनावश्यक रूप से जोड़ने के।
theological_decisions:
- issue: אָדָם का सामान्य मानव-सूचक अर्थ
  choice: क्या कोई मनुष्य परमेश्वर को लूटेगा?
  alternative: क्या कोई आदमी परमेश्वर को लूटेगा?
  rationale: मूल का एकवचन शब्द नीतिवचन-सदृश और सामान्य अर्थ रखता है। ‘मनुष्य’ इस अर्थ को पुरुष-विशेष तक सीमित किए बिना मूल की संक्षिप्तता बनाए रखता है।
- issue: הַתְּרוּמָה का पवित्र योगदान-सूचक अर्थ
  choice: चढ़ावा
  alternative: भेंट / पवित्र उपयोग के लिए अलग किया गया अंशदान
  rationale: मूल शब्द का अर्थ साधारण दान से अधिक विशिष्ट है, पर हर प्रसंग में किसी एक तकनीकी अनुष्ठान तक सीमित नहीं। ‘चढ़ावा’ पवित्र प्रयोजन को स्पष्ट रखते हुए इस व्यापकता को बचाता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और बोलचाल में समझने योग्य रखी गई है। परमेश्वर की ओर से बहुवचन समुदाय के लिए ‘तुम’ और लोगों की ओर से परमेश्वर के लिए आदरसूचक ‘आपको’ प्रयोग किया गया है। अंतिम खंड की संक्षिप्त, उत्तरात्मक संरचना मूल इब्रानी के क्रियारहित उत्तर को बनाए रखती है।
