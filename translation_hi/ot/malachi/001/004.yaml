source:
  edition: WLC
  text: כִּֽי תֹאמַ֨ר אֱד֜וֹם רֻשַּׁ֗שְׁנוּ וְ/נָשׁוּב֙ וְ/נִבְנֶ֣ה חֳרָב֔וֹת כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת הֵ֥מָּה יִבְנ֖וּ וַ/אֲנִ֣י אֶהֱר֑וֹס וְ/קָרְא֤וּ לָ/הֶם֙ גְּב֣וּל רִשְׁעָ֔ה וְ/הָ/עָ֛ם אֲשֶׁר זָעַ֥ם יְהוָ֖ה עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/004.yaml
  text: 'Though Edom says[a], “We are shattered, but we will return and rebuild the ruins,” this is what Yahweh of Armies says: “They may build, but I will tear down, and they will be called the territory of wickedness[d][c][b], the people with whom Yahweh is indignant forever.”'
translation:
  language: hi
  text: 'यद्यपि एदोम कहता है, “हम तबाह कर दिए गए हैं, फिर भी हम लौटकर खंडहरों को दोबारा बनाएँगे,” सेनाओं का याहवे[b] यों कहता है: “वे बनाएँ भी, तो मैं ढा दूँगा[a]। उन्हें ‘दुष्टता का प्रदेश’[c] और ‘वे लोग जिन पर याहवे सदा क्रुद्ध रहता है’[d] कहा जाएगा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे बनाएँगे, पर मैं ढा दूँगा।” इब्रानी को सीधे भविष्यसूचक कथन के रूप में भी पढ़ा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: 'परंपरागत रूप: “सेनाओं का यहोवा” या “सेनाओं का प्रभु।”'
    reason: lexical_alternative
  - marker: c
    text: या, “दुष्टता का सीमावर्ती क्षेत्र।”
    reason: lexical_alternative
  - marker: d
    text: या, “वे लोग जिनके विरुद्ध याहवे सदा रोष प्रकट करता है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי תֹאמַר
  choice: यद्यपि ... कहता है
  rationale: כִּי यहाँ एदोम के दावे और याहवे के विरोधी उत्तर के बीच रियायती संबंध प्रस्तुत करता है। वर्तमानकालीन ‘कहता है’ भविष्यसूचक वाणी को जीवंत और स्वाभाविक रखता है।
- source_word: רֻשַּׁשְׁנוּ
  choice: हम तबाह कर दिए गए हैं
  rationale: निष्क्रिय रूप राष्ट्रीय विनाश और दुर्दशा व्यक्त करता है। ‘तबाह’ आधुनिक हिन्दी में व्यापक विनाश को स्वाभाविक रूप से बताता है, बिना अर्थ को केवल आर्थिक निर्धनता तक सीमित किए।
- source_word: וְנָשׁוּב וְנִבְנֶה חֳרָבוֹת
  choice: फिर भी हम लौटकर खंडहरों को दोबारा बनाएँगे
  rationale: שׁוב का मूल भाव ‘लौटना’ सुरक्षित है और חֳרָבוֹת को स्वाभाविक हिन्दी में ‘खंडहर’ कहा गया है। ‘दोबारा बनाएँगे’ पुनर्निर्माण का आशय स्पष्ट करता है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का याहवे
  rationale: व्यक्तिगत दिव्य नाम को ‘याहवे’ के रूप में लिप्यंतरित किया गया है और צְבָאוֹת के बहुवचन तथा सामरिक बल को ‘सेनाओं’ से व्यक्त किया गया है।
- source_word: הֵמָּה יִבְנוּ וַאֲנִי אֶהֱרֹס
  choice: वे बनाएँ भी, तो मैं ढा दूँगा
  rationale: स्वतंत्र सर्वनामों के विरोध और प्रसंग के रियायती भाव को हिन्दी की ‘भी, तो’ संरचना व्यक्त करती है। ‘ढा दूँगा’ אֶהֱרֹס का सजीव और स्वाभाविक समतुल्य है।
- source_word: גְּבוּל רִשְׁעָה
  choice: दुष्टता का प्रदेश
  rationale: גְּבוּל यहाँ सीमा के साथ-साथ भूभाग या राज्य-क्षेत्र का अर्थ दे सकता है; ‘प्रदेश’ इस राष्ट्रीय भूभाग को स्पष्ट रखते हुए अस्पष्टता को पूरी तरह समाप्त नहीं करता।
- source_word: אֲשֶׁר זָעַם יְהוָה עַד עוֹלָם
  choice: जिन पर याहवे सदा क्रुद्ध रहता है
  rationale: זעם तीव्र रोष या आक्रोश व्यक्त करता है। यह अनुवाद स्थायी दिव्य विरोध को बताता है और עַד עוֹלָם के दीर्घकालिक बल को ‘सदा’ से सुरक्षित रखता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: इब्रानी पाठ में व्यक्तिगत वाचा-नाम है। ‘याहवे’ उसका सीधा आधुनिक हिन्दी लिप्यंतरण है; इसे पदवी में बदलने से नाम का स्वरूप छिप जाता।
- issue: צְבָאוֹת वाली दिव्य उपाधि
  choice: सेनाओं का याहवे
  alternative: सेनाधीश याहवे; सेनाओं का प्रभु
  rationale: यह रूप मूल बहुवचन ‘सेनाओं’ को खुलकर व्यक्त करता है और दिव्य नाम को सुरक्षित रखता है।
- issue: הֵמָּה יִבְנוּ की विधि और बल
  choice: 'रियायती-विरोधी: ‘वे बनाएँ भी, तो मैं ढा दूँगा’'
  alternative: 'भविष्यसूचक: ‘वे बनाएँगे, पर मैं ढा दूँगा’'
  rationale: इब्रानी अपूर्ण क्रिया भविष्यसूचक कथन हो सकती है, पर प्रसंग एदोम के हर पुनर्निर्माण-प्रयास की निष्फलता पर बल देता है। मुख्य पाठ रियायती बल दिखाता है और वैकल्पिक भविष्यसूचक पठन पादटिप्पणी में रखा गया है।
- issue: याहवे के स्थायी रोष का कथन
  choice: जिन पर याहवे सदा क्रुद्ध रहता है
  alternative: वे लोग जिनके विरुद्ध याहवे सदा रोष प्रकट करता है
  rationale: व्यक्तियों के प्रति स्थायी दिव्य आक्रोश का असुविधाजनक धार्मिक तनाव मूल पाठ में मौजूद है; उसे नरम या अस्थायी नहीं बनाया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘तबाह’, ‘खंडहर’ और ‘ढा दूँगा’ सामान्य पाठक के लिए सहज हैं, जबकि भविष्यसूचक घोषणा का गंभीर स्वर बना रहता है। उद्धरणों में दो अपमानसूचक सार्वजनिक नामों को स्पष्ट करने के लिए एकल उद्धरण-चिह्न लगाए गए हैं।
