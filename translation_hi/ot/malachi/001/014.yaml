source:
  edition: WLC
  text: וְ/אָר֣וּר נוֹכֵ֗ל וְ/יֵ֤שׁ בְּ/עֶדְר/וֹ֙ זָכָ֔ר וְ/נֹדֵ֛ר וְ/זֹבֵ֥חַ מָשְׁחָ֖ת לַֽ/אדֹנָ֑/י כִּי֩ מֶ֨לֶךְ גָּד֜וֹל אָ֗נִי אָמַר֙ יְהוָ֣ה צְבָא֔וֹת וּ/שְׁמִ֖/י נוֹרָ֥א בַ/גּוֹיִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/014.yaml
  text: But cursed is the deceiver who has a male in his flock[a], and vows it, but sacrifices a blemished animal to the Lord. For I am a great King, says Yahweh of Armies[b], and my name is feared among the nations.
translation:
  language: hi
  text: “छल करनेवाला शापित है, जिसके झुंड में नर पशु है और जो मन्नत तो मानता है, पर प्रभु को दोषयुक्त पशु बलि चढ़ाता है। क्योंकि मैं महान राजा हूँ और राष्ट्रों में मेरा नाम भयकारी है[a],” सेनाओं के याहवे का वचन है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “राष्ट्रों में मेरा नाम विस्मय और श्रद्धा जगाता है।” इब्रानी शब्द में भय, विस्मय और श्रद्धा—तीनों का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: शापित हो
  rationale: यह दैवी न्याय की घोषणा है; हिंदी में यह स्पष्ट और स्वाभाविक विधेयात्मक अभिव्यक्ति है।
- source_word: נוֹכֵל
  choice: छल करनेवाला
  rationale: यह उपासना में जानबूझकर कपट करनेवाले व्यक्ति को दर्शाता है; यह शब्द नैतिक और धार्मिक धोखे दोनों को व्यक्त करता है।
- source_word: יֵשׁ בְּעֶדְרוֹ זָכָר
  choice: जिसके झुंड में नर पशु है
  rationale: मूल पाठ की सीधी संरचना रखते हुए यह स्पष्ट करता है कि उसके पास चढ़ाने योग्य नर पशु उपलब्ध है।
- source_word: וְנֹדֵר
  choice: जो मन्नत तो मानता है
  rationale: मूल में मन्नत की वस्तु स्पष्ट नहीं कही गई है; इसलिए ‘उसी पशु की’ जोड़ने के बजाय वास्तविक अस्पष्टता सुरक्षित रखी गई है। ‘तो’ आगे आनेवाले विरोध को स्वाभाविक बनाता है।
- source_word: וְזֹבֵחַ
  choice: पर ... बलि चढ़ाता है
  rationale: 'संयोजक वाव यहाँ प्रसंगानुसार विरोध प्रकट करता है: व्यक्ति मन्नत मानता है, पर दोषयुक्त पशु चढ़ाता है।'
- source_word: מָשְׁחָת
  choice: दोषयुक्त पशु
  rationale: बलिदान के प्रसंग में यह ऐसे बिगड़े या त्रुटिपूर्ण पशु को दर्शाता है जो चढ़ाने योग्य नहीं है।
- source_word: לַאדֹנָי
  choice: प्रभु को
  rationale: אֲדֹנָי यहाँ बलिदान ग्रहण करनेवाले परमेश्वर की प्रभुता सूचित करता है; ‘प्रभु’ आधुनिक हिंदी में स्थापित और सहज पद है।
- source_word: כִּי מֶלֶךְ גָּדוֹל אָנִי
  choice: क्योंकि मैं महान राजा हूँ
  rationale: कारणसूचक כִּי और परमेश्वर की राजकीय आत्म-घोषणा दोनों सीधे सुरक्षित हैं।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं के याहवे
  rationale: व्यक्तिगत वाचा-नाम को ‘याहवे’ के रूप में रखा गया है और צְבָאוֹת का पारदर्शी अनुवाद ‘सेनाओं’ किया गया है।
- source_word: נוֹרָא בַגּוֹיִם
  choice: राष्ट्रों में मेरे नाम का भय माना जाता है
  rationale: נוֹרָא में भय, विस्मय और श्रद्धा का संयुक्त भाव है। मुख्य पाठ उसके प्रबल ‘भय’ पक्ष को रखता है, जबकि टिप्पणी व्यापक अर्थ-परास बताती है।
theological_decisions:
- issue: दैवी नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम सीधे आया है; उसका लिप्यंतरण नाम और אֲדֹנָי की उपाधि ‘प्रभु’ के बीच भेद बनाए रखता है।
- issue: יְהוָה צְבָאוֹת में צְבָאוֹת का अर्थ
  choice: सेनाओं
  alternative: स्वर्गीय सेनाओं; सेनाधीश
  rationale: ‘सेनाओं’ मूल बहुवचन की व्यापकता और परमेश्वर की सार्वभौम राजकीय शक्ति को बिना अनावश्यक व्याख्या के सुरक्षित रखता है।
- issue: נוֹרָא में भय और श्रद्धा का संबंध
  choice: मुख्य पाठ में ‘भय’, पादटिप्पणी में विस्मय और श्रद्धा
  alternative: आदर किया जाता है
  rationale: केवल ‘आदर’ कहने से इब्रानी शब्द की प्रबल भयावहता घट जाती, जबकि केवल आतंक का अर्थ लेना उसके श्रद्धामय पक्ष को खो देता।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, स्पष्ट भविष्यद्वाणी-संबंधी शैली रखी गई है। ‘मन्नत तो ... पर’ कपटपूर्ण विरोध को सहज बनाता है। ‘झुंड’, ‘नर पशु’ और ‘दोषयुक्त पशु’ साधारण पाठक के लिए बोधगम्य हैं तथा बलिदान-संबंधी प्रसंग को स्पष्ट रखते हैं।
