  text: מַשָּׂ֥א דְבַר יְהוָ֖ה אֶל יִשְׂרָאֵ֑ל בְּ/יַ֖ד מַלְאָכִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/001.yaml
  text: 'The burden of the word of the LORD to Israel by the hand of Malachi:'
translation:
  language: hi
  text: मलाकी के द्वारा इस्राएल के लिए यहोवा के वचन का भार:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “भार” का अर्थ एक गंभीर भविष्यद्वाणी या ईश्वरीय संदेश भी हो सकता है।
    reason: מַשָּׂא की वास्तविक अर्थगत व्यापकता बताने के लिए, बिना मुख्य पाठ में उसे एक ही अर्थ तक सीमित किए।
lexical_decisions:
- source_word: מַשָּׂא
  choice: भार
  rationale: इस शब्द में उठाए हुए बोझ और गंभीर ईश्वरीय संदेश—दोनों की अर्थछाया हो सकती है। ‘भार’ मूल रूपक और उसकी गंभीरता को बनाए रखता है।
- source_word: דְבַר יְהוָה
  choice: यहोवा का वचन
  rationale: ‘वचन’ भविष्यद्वाणी के रूप में दिए गए संदेश का स्वाभाविक और औपचारिक हिन्दी रूप है; दिव्य नाम को ‘यहोवा’ से व्यक्त किया गया है।
- source_word: אֶל יִשְׂרָאֵל
  choice: इस्राएल के लिए
  rationale: אֶל संदेश की दिशा और संबोधन बताता है; यहाँ ‘के लिए’ सहज हिन्दी में लक्षित समुदाय को व्यक्त करता है।
- source_word: בְּיַד מַלְאָכִי
  choice: मलाकी के द्वारा
  rationale: शाब्दिक ‘मलाकी के हाथ से’ हिब्रू माध्यम-सूचक मुहावरा है; ‘के द्वारा’ आधुनिक हिन्दी में वही अभिप्राय स्पष्ट और स्वाभाविक ढंग से देता है।
theological_decisions:
- issue: מַשָּׂא को ‘भविष्यवाणी/ईशवाणी’ या ‘भार’ कहना
  choice: भार
  alternative: ईशवाणी
  rationale: ‘ईशवाणी’ संदेश की विधा स्पष्ट करती, पर मूल शब्द के बोझ और गंभीर दायित्व वाले रूपक को मिटा देती। ‘भार’ अर्थगत तनाव को खुला रखता है।
- issue: יהוה का हिन्दी रूप
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में सामान्य उपाधि नहीं, परमेश्वर का विशिष्ट नाम है; इसलिए उसे उपाधि ‘प्रभु’ से बदलने के बजाय नाम के रूप में प्रस्तुत किया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। पद को आगामी संदेश की शीर्षक-पंक्ति मानते हुए अंत में द्विबिंदु रखा गया है।
