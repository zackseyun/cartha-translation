  text: כִּ֣י מִ/מִּזְרַח שֶׁ֜מֶשׁ וְ/עַד מְבוֹא֗/וֹ גָּד֤וֹל שְׁמִ/י֙ בַּ/גּוֹיִ֔ם וּ/בְ/כָל מָק֗וֹם מֻקְטָ֥ר מֻגָּ֛שׁ לִ/שְׁמִ֖/י וּ/מִנְחָ֣ה טְהוֹרָ֑ה כִּֽי גָד֤וֹל שְׁמִ/י֙ בַּ/גּוֹיִ֔ם אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/011.yaml
  text: For from the rising of the sun to its setting[a], my name is great among the nations, and in every place incense is offered, and a pure offering is brought, to my name; for my name is great among the nations[d][c][b], says Yahweh of hosts.
translation:
  language: hi
  text: क्योंकि सूर्य के उदय से लेकर उसके अस्त होने तक[a] जातियों के बीच मेरा नाम महान है; और हर स्थान पर धूप चढ़ाई जाती है और मेरे नाम के लिए शुद्ध भेंट अर्पित की जाती है। क्योंकि जातियों के बीच मेरा नाम महान है[b][c][d], सेनाओं का यहोवा कहता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पूरब से पश्चिम तक’; शाब्दिक रूप से, ‘सूर्य के उदय से उसके अस्त होने तक।’
    reason: lexical_alternative
  - marker: b
    text: ‘जातियों’ के लिए हिब्रू शब्द का अनुवाद ‘अन्यजातियों’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: हिब्रू को वर्तमान वास्तविकता, भविष्यसूचक वर्तमान या भविष्य की निश्चितता के वर्णन के रूप में समझा जा सकता है; अनुवाद समय का निर्णय किए बिना हिब्रू की अभिव्यक्ति बनाए रखता है।
    reason: alternative_reading
  - marker: d
    text: ‘भेंट’ हिब्रू मिन्हा का अनुवाद है; यह सामान्य रूप से भेंट को और बलिदानी संदर्भों में प्रायः अन्नबलि को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इसके व्याख्यात्मक-कारणसूचक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִמִּזְרַח שֶׁמֶשׁ וְעַד מְבוֹאוֹ
  choice: सूर्य के उदय से लेकर उसके अस्त होने तक
  rationale: यह हिब्रू बिंब और सूर्य की ओर संकेत करने वाले प्रत्यय, दोनों को बनाए रखता है; साथ ही सार्वभौमिक भौगोलिक विस्तार व्यक्त करता है।
- source_word: גָּדוֹל שְׁמִי
  choice: मेरा नाम महान है
  rationale: ‘नाम’ को प्रतिष्ठा या सम्मान के रूप में समझाया जा सकता है, पर मूल ठोस अभिव्यक्ति को बनाए रखना अधिक स्रोत-संगत है।
- source_word: בַּגּוֹיִם
  choice: जाति-जाति के लोगों के बीच
  rationale: גּוֹיִם के बहुवचन और व्यापक जनसमूह-संबंधी अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है, बिना इसे केवल एक बाद की धार्मिक तकनीकी संज्ञा तक सीमित किए।
- source_word: וּבְכָל מָקוֹם
  choice: और हर स्थान पर
  rationale: हिब्रू के वितरणात्मक अर्थ को निकट और स्वाभाविक हिन्दी में रखता है।
- source_word: מֻקְטָר
  choice: धूप चढ़ाई जाती है
  rationale: क़तर धातु के होफ़ाल कृदंत का बलिदानी धुआँ या धूप जलाने का भाव है; ‘धूप चढ़ाना’ हिन्दी में उपासना-संबंधी आशय स्पष्ट करता है।
- source_word: מֻגָּשׁ לִשְׁמִי
  choice: मेरे नाम के लिए ... अर्पित की जाती है
  rationale: נגשׁ का बलिदानी संदर्भ में अर्थ भेंट प्रस्तुत करना है। ‘मेरे नाम के लिए’ मूल की धर्मवैधानिक अभिव्यक्ति को बनाए रखता है, जबकि हिन्दी वाक्य-विन्यास दोनों कर्मवाच्य कृदंतों को स्पष्ट करता है।
- source_word: וּמִנְחָה טְהוֹרָה
  choice: और शुद्ध भेंट
  rationale: מִנְחָה सामान्य भेंट तथा विशेषतः अन्नबलि को सूचित कर सकता है; ‘भेंट’ अर्थ को अनावश्यक रूप से संकीर्ण नहीं करता, और ‘शुद्ध’ अनुष्ठानिक तथा नैतिक दोनों संभावित आयाम सुरक्षित रखता है।
- source_word: אָמַר יְהוָה צְבָאוֹת
  choice: सेनाओं के यहोवा का कहना है
  rationale: יהוה को उसके नाम ‘यहोवा’ से और צְבָאוֹת को सीधे ‘सेनाओं’ से व्यक्त किया गया है, जिससे उपाधि का युद्ध-संबंधी और ब्रह्मांडीय संकेत बना रहता है।
theological_decisions:
- issue: क्या पद वर्तमान में राष्ट्रों की उपासना का वर्णन करता है या भविष्य/आदर्श वास्तविकता का
  choice: ‘महान है,’ ‘चढ़ाई जाती है,’ और ‘अर्पित की जाती है’ जैसे वर्तमान रूप रखे गए हैं।
  alternative: ‘महान होगा,’ ‘चढ़ाई जाएगी,’ और ‘अर्पित की जाएगी’; अथवा इन्हें भविष्यसूचक वर्तमान मानना।
  rationale: हिब्रू में क्रियारहित और कृदंतीय रचनाएँ हैं, जो वर्तमान वर्णन, भविष्यसूचक वर्तमान या निश्चित भविष्य—तीनों की अनुमति देती हैं। हिन्दी सतही व्याकरण को रखते हुए समय का प्रश्न खुला छोड़ती है।
- issue: इस्राएल से बाहर की उपासना के संदर्भ में बलिदानी भाषा का अर्थ
  choice: ‘धूप’ और ‘भेंट’ जैसे उपासना-संबंधी शब्द सीधे बनाए रखे गए हैं।
  alternative: इन्हें केवल प्रार्थना/आत्मिक उपासना का रूपक मानना, या विशेष अंतकालीन गैर-इस्राएली बलिदान के रूप में स्पष्ट करना।
  rationale: मूल पाठ स्पष्ट बलिदानी शब्दावली उपयोग करता है, पर उसकी पूर्ति की कोई विशिष्ट धर्मवैज्ञानिक प्रणाली नहीं बताता; इसलिए अनुवाद व्याख्यात्मक विस्तार से बचता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय, सार्वजनिक पाठ के योग्य शैली रखी गई है। समानांतरता और दोहराव सुरक्षित हैं। ‘मेरे नाम के लिए’ मूल की विशिष्ट अभिव्यक्ति को बनाए रखता है; विराम-चिह्न हिन्दी में अर्थ स्पष्ट करते हैं।
