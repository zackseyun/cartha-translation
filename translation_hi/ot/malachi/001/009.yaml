id: MAL.1.9
reference: Malachi 1:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/עַתָּ֛ה חַלּוּ נָ֥א פְנֵי אֵ֖ל וִֽ/יחָנֵ֑/נוּ מִ/יֶּדְ/כֶם֙ הָ֣יְתָה זֹּ֔את הֲ/יִשָּׂ֤א מִ/כֶּם֙ פָּנִ֔ים אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/009.yaml
  text: And now[a], entreat God for favor, that he may be gracious to us. From your hand has this come[b]; will he show favor to any of you? says Yahweh of hosts.
translation:
  language: hi
  text: और अब परमेश्वर से अनुग्रह की विनती करो[a], कि वह हम पर अनुग्रह करे। यह तुम्हारे हाथ से हुआ है[b]; क्या वह तुममें से किसी पर अनुग्रह करेगा? सेनाओं के याहवे का यही कहना है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ है, “परमेश्वर के मुख को मनाओ।” इस मुहावरे का अर्थ परमेश्वर का अनुग्रह चाहना है।
    reason: lexical_alternative
  - marker: b
    text: या, “यह तुम्हारे हाथ से आया है; क्या वह तुममें से किसी पर अनुग्रह करेगा?”
    reason: alternative_reading
lexical_decisions:
- source_word: חַלּוּ נָא פְנֵי אֵל
  choice: परमेश्वर से अनुग्रह की विनती करो
  rationale: शाब्दिक रूप से ‘परमेश्वर के मुख को मनाओ’; यह मुहावरा किसी का अनुग्रह चाहने या उसकी कृपा के लिए विनती करने को दर्शाता है। ‘अनुग्रह की विनती करो’ आग्रह और मुहावरेगत अर्थ दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: וִיחָנֵּנוּ
  choice: कि वह हम पर अनुग्रह करे
  rationale: חנן का अर्थ अनुग्रह या कृपा करना है। आज्ञा के बाद आया रूप यहाँ अभिप्राय/परिणाम व्यक्त करता है; इसलिए ‘कि’ उपयुक्त है।
- source_word: מִיֶּדְכֶם הָיְתָה זֹּאת
  choice: यह तुम्हारे ही हाथ से हुआ है
  rationale: ‘हाथ से’ स्रोत और उत्तरदायित्व का इब्रानी बिंब बनाए रखता है। ‘ही’ याजकों की जिम्मेदारी पर निहित बल को स्पष्ट करता है।
- source_word: הֲיִשָּׂא מִכֶּם פָּנִים
  choice: क्या वह तुममें से किसी को ग्रहण करेगा?
  rationale: शाब्दिक मुहावरा ‘मुख उठाना’ इस प्रसंग में अनुकूलतापूर्वक स्वीकार करने को दर्शाता है। ‘ग्रहण करेगा’ बलिदानों और उपासकों की स्वीकृति—दोनों से जुड़ी प्रसंगगत अस्पष्टता को कुछ हद तक बनाए रखता है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं के यहोवा
  rationale: व्यक्तिगत वाचा-नाम को ‘यहोवा’ और צְבָאוֹת को पारंपरिक, बोधगम्य ‘सेनाओं’ से व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम है। हिन्दी में प्रचलित ‘यहोवा’ नाम को स्पष्ट रूप से सुरक्षित रखता है और उसे सामान्य उपाधि में नहीं बदलता।
- issue: הֲיִשָּׂא מִכֶּם פָּנִים में अनुकूल स्वीकृति का आशय
  choice: क्या वह तुममें से किसी को ग्रहण करेगा?
  alternative: क्या वह तुममें से किसी पर अनुग्रह करेगा?
  rationale: यह आलंकारिक प्रश्न दूषित उपासना करने वाले याजकों की अनुकूल स्वीकृति पर प्रश्न उठाता है। ‘ग्रहण करेगा’ किसी विशेष सम्प्रदायगत निष्कर्ष या परमेश्वर पर अन्यायपूर्ण पक्षपात आरोपित किए बिना न्यायिक और उपासना-संबंधी तनाव बनाए रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘अनुग्रह’ की पुनरावृत्ति मूल के חלה/חנן संबंध को सुनाई देती रहने देती है; आलंकारिक प्रश्न का तीखा स्वर सुरक्षित रखा गया है।
