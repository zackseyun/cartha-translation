base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/002.yaml
  text: “I have loved you,” says Yahweh. But you say[a], “How have you loved us?” “Was not Esau Jacob’s brother?” declares Yahweh. “Yet I loved Jacob,”
translation:
  language: hi
  text: 'यहोवा कहते हैं, “मैंने तुमसे प्रेम किया है।” पर तुम कहते हो[a], “आपने हमसे कैसे प्रेम किया है?” यहोवा की यह घोषणा है: “क्या एसाव याकूब का भाई नहीं था? फिर भी मैंने याकूब से प्रेम किया।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक रूपनिष्ठ अनुवाद में सामान्य भूतकाल भी सम्भव है: “मैंने तुमसे प्रेम किया ... आपने हमसे कैसे प्रेम किया? ... मैंने याकूब से प्रेम किया।” इब्रानी की पूर्ण क्रियाएँ सन्दर्भ के अनुसार हिन्दी में सामान्य भूतकाल या पूर्ण वर्तमान से व्यक्त की जा सकती हैं।'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָהַבְתִּי
  choice: मैंने तुमसे प्रेम किया है
  rationale: אהב के काल-रूप को हिन्दी के पूर्ण वर्तमान में रखा गया है, ताकि अतीत से आरम्भ हुए प्रेम की वर्तमान प्रासंगिकता बनी रहे; सामान्य भूतकाल भी सम्भव है।
- source_word: אֶתְכֶם
  choice: तुमसे
  rationale: द्वितीय पुरुष बहुवचन प्रत्यय इस्राएल को सामूहिक रूप से सम्बोधित करता है। हिन्दी में ‘प्रेम करना’ के साथ स्वाभाविक परसर्ग ‘से’ है।
- source_word: אָמַר יְהוָה
  choice: यहोवा कहते हैं
  rationale: भविष्यद्वक्ताओं की प्रचलित वाणी-सूचना को वर्तमान काल में स्वाभाविक हिन्दी दी गई है; परमेश्वर के नाम יהוה को ‘यहोवा’ से व्यक्त किया गया है।
- source_word: וַאֲמַרְתֶּם
  choice: पर तुम कहते हो
  rationale: वाव यहाँ लोगों की आपत्ति आरम्भ करता है; ‘पर’ संवाद के विरोधात्मक भाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בַּמָּה
  choice: कैसे
  rationale: इस प्रश्नवाचक पद का आशय ‘किस रीति से’ है; ‘कैसे’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: אֲהַבְתָּנוּ
  choice: आपने हमसे कैसे प्रेम किया है
  rationale: द्वितीय पुरुष एकवचन क्रिया और प्रथम पुरुष बहुवचन कर्म को हिन्दी में स्वाभाविक प्रश्न के रूप में रखा गया है। परमेश्वर को सम्बोधित करते हुए आदरसूचक ‘आप’ आधुनिक हिन्दी के अनुकूल है।
- source_word: הֲלוֹא
  choice: क्या ... नहीं था?
  rationale: यह ऐसा आलंकारिक प्रश्न है जो सहमति की अपेक्षा करता है; हिन्दी की ‘क्या ... नहीं’ रचना वही बल रखती है।
- source_word: אָח עֵשָׂו לְיַעֲקֹב
  choice: एसाव याकूब का भाई
  rationale: לְ द्वारा सूचित सम्बन्ध को स्वाभाविक हिन्दी सम्बन्धकारक ‘का’ से व्यक्त किया गया है।
- source_word: נְאֻם יְהוָה
  choice: यहोवा की यह घोषणा है
  rationale: गम्भीर भविष्यद्वाणी-सूत्र נְאֻם יהוה को आरम्भ के सामान्य कथन-सूत्र से अलग रखते हुए ‘घोषणा’ द्वारा व्यक्त किया गया है।
- source_word: וָאֹהַב אֶת יַעֲקֹב
  choice: फिर भी मैंने याकूब से प्रेम किया
  rationale: वाव का सन्दर्भगत विरोध ‘फिर भी’ से स्पष्ट होता है, जबकि אהב का सरल अर्थ ‘प्रेम किया’ ही रखा गया है।
theological_decisions:
- issue: याकूब के प्रति परमेश्वर के प्रेम को वाचाई चुनाव के रूप में स्पष्ट करना या नहीं
  choice: सरल शब्द ‘प्रेम किया’ रखा गया है।
  alternative: ‘चुना’ अथवा ‘अपना वाचाई प्रेम रखा’
  rationale: मूल पाठ सामान्य क्रिया אהב का प्रयोग करता है। सन्दर्भ में चुनाव और वाचा के अर्थ-संकेत हो सकते हैं, पर उन्हें मुख्य पाठ में स्पष्ट विस्तार बनाना मूल की धार्मिक तनावपूर्ण संक्षिप्तता को अनावश्यक रूप से सुलझा देगा।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। यहोवा की ओर से इस्राएल के लिए ‘तुम’ सामूहिक बहुवचन है, जबकि लोगों की ओर से परमेश्वर के लिए आधुनिक आदरसूचक ‘आप’ प्रयोग हुआ है। संवादात्मक विवाद-शैली और दोनों दैवी कथन-सूत्रों का अन्तर सुरक्षित रखा गया है।
