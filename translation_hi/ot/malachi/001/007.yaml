  text: מַגִּישִׁ֤ים עַֽל מִזְבְּחִ/י֙ לֶ֣חֶם מְגֹאָ֔ל וַ/אֲמַרְתֶּ֖ם בַּ/מֶּ֣ה גֵֽאַלְנ֑וּ/ךָ בֶּ/אֱמָרְ/כֶ֕ם שֻׁלְחַ֥ן יְהוָ֖ה נִבְזֶ֥ה הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/007.yaml
  text: By presenting defiled food on my altar[a]. But you say, “How have we defiled you?” By saying[c][b], “The table of Yahweh is despised.”
translation:
  language: hi
  text: तुम मेरी वेदी पर अशुद्ध भोजन चढ़ाते हो।[a] फिर भी तुम पूछते हो, “हमने तुझे कैसे अशुद्ध किया?”[b] क्योंकि तुम कहते हो, “याहवे की मेज़ तुच्छ है।”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘रोटी’; यहाँ बलिदान के संदर्भ में इसका अर्थ वेदी पर चढ़ाया जाने वाला भोजन है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में परमेश्वर को सीधे ‘तुझे’ कहा गया है; उसकी वेदी का अनादर स्वयं उसका अपमान माना गया है।
    reason: alternative_reading
  - marker: c
    text: ‘याहवे की मेज़’ वेदी और उससे जुड़ी बलिदान-सेवा का रूपक है।
    reason: cultural_note
lexical_decisions:
- source_word: מַגִּישִׁים
  choice: चढ़ाकर
  rationale: हिफ़ील कृदंत पिछले पद के आरोप को स्पष्ट करता है। बलिदान-संदर्भ में ‘चढ़ाकर’ स्वाभाविक है और साधन/रीति का भाव बनाए रखता है।
- source_word: לֶחֶם
  choice: भोजन
  rationale: शाब्दिक अर्थ ‘रोटी’ है, पर वेदी और बलिदान के संदर्भ में यह व्यापक रूप से चढ़ाए जाने वाले भोजन को सूचित करता है।
- source_word: מְגֹאָל
  choice: अशुद्ध
  rationale: यहाँ शब्द धार्मिक और नैतिक अपवित्रता का भाव रखता है; आधुनिक हिन्दी में ‘अशुद्ध’ स्पष्ट और संदर्भानुकूल है।
- source_word: בַּמֶּה גֵאַלְנוּךָ
  choice: हमने तुझे कैसे अशुद्ध किया?
  rationale: इब्रानी प्रत्यय सीधे परमेश्वर के लिए द्वितीय पुरुष एकवचन है। ‘तुझे’ मूल पाठ की जानबूझकर रखी गई तीक्ष्णता को सुरक्षित रखता है।
- source_word: שֻׁלְחַן יְהוָה
  choice: याहवे की मेज़
  rationale: यह वेदी और उससे जुड़ी बलिदान-सेवा का रूपक है; अनुवाद रूपक को व्याख्या में विलीन नहीं करता।
- source_word: יְהוָה
  choice: याहवे
  rationale: दिव्य नाम को उपाधि से बदलने के बजाय आधुनिक हिन्दी लिप्यंतरण में प्रस्तुत किया गया है।
- source_word: נִבְזֶה הוּא
  choice: तुच्छ है
  rationale: यह कथन मेज़ को घृणा या अनादर के योग्य समझने का मूल्यांकन व्यक्त करता है; ‘तुच्छ है’ संक्षिप्त और स्वाभाविक है।
theological_decisions:
- issue: ‘हमने तुझे कैसे अशुद्ध किया?’ में प्रत्यक्ष कर्म को बनाए रखना
  choice: परमेश्वर के लिए सीधे ‘तुझे’ रखा गया है।
  alternative: ‘हमने तेरी वेदी/तेरे नाम को कैसे अशुद्ध किया?’
  rationale: मूल इब्रानी सीधे परमेश्वर को संबोधित करता है और दिखाता है कि उसकी वेदी का अनादर स्वयं उसका अपमान है। इसे स्पष्टार्थक संज्ञा से बदलना मूल की धार्मिक तीक्ष्णता को कम कर देता।
- issue: לֶחֶם का बलिदान-संदर्भ में अर्थ
  choice: ‘भोजन’
  alternative: ‘रोटी’
  rationale: यहाँ आशय केवल पकी हुई रोटी नहीं, बल्कि वेदी पर चढ़ाई जाने वाली सामग्री से है; इसलिए ‘भोजन’ संदर्भगत अर्थ अधिक ठीक देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। परमेश्वर के लिए प्रसंगानुकूल एकवचन ‘तू’ रूप (‘तुझे’) मूल इब्रानी के सीधे संबोधन को सुरक्षित रखता है।
