  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אֶת עֵשָׂ֖ו שָׂנֵ֑אתִי וָ/אָשִׂ֤ים אֶת הָרָי/ו֙ שְׁמָמָ֔ה וְ/אֶת נַחֲלָת֖/וֹ לְ/תַנּ֥וֹת מִדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/003.yaml
  text: but Esau I hated[c][b][a], and I made his mountains a desolation and his inheritance for the jackals of the wilderness.
translation:
  language: hi
  text: पर एसाव से मैंने घृणा की[a], और उसके पहाड़ों को उजाड़ बना दिया, और उसकी विरासत को मरुभूमि के गीदड़ों[b] के लिए छोड़ दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “एसाव को मैंने त्याग दिया,” अथवा “एसाव से मैंने कम प्रेम किया।” इब्रानी क्रिया का सामान्य अर्थ “घृणा करना” है; दूसरे अनुवाद वाचा-संबंधी चुनाव या अस्वीकार की व्याख्या व्यक्त करते हैं।
    reason: lexical_alternative
  - marker: b
    text: पुराने अनुवादों में “मरुभूमि के अजगरों” मिलता है; यहाँ प्रयुक्त इब्रानी शब्द से संभवतः गीदड़ अभिप्रेत हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂנֵאתִי
  choice: मैंने घृणा की
  rationale: इब्रानी क्रिया का सामान्य और सीधा अर्थ ‘घृणा करना’ है। ‘त्याग दिया’ या ‘कम प्रेम किया’ जैसे विकल्प व्याख्यात्मक नरमी लाते हैं, इसलिए मूल पाठ का तनाव मुख्य अनुवाद में रखा गया है।
- source_word: וָאָשִׂים
  choice: उजाड़ बना दिया
  rationale: שׂים यहाँ परिणाम उत्पन्न करने के अर्थ में है; संज्ञा שְׁמָמָה के साथ ‘उजाड़ बना दिया’ स्वाभाविक हिन्दी है।
- source_word: הָרָיו
  choice: उसके पहाड़ों
  rationale: הַר का बहुवचन सीधा ‘पहाड़’ है; प्रसंगानुसार ‘पहाड़ी प्रदेश’ भी संभव है, पर मुख्य पाठ में अधिक औपचारिक समतुल्यता रखी गई है।
- source_word: נַחֲלָתוֹ
  choice: उसकी विरासत
  rationale: נַחֲלָה पैतृक अथवा उत्तराधिकार में मिली संपत्ति या भूमि को व्यक्त करता है; ‘विरासत’ इस अर्थ और वाचा-संबंधी भूमि की प्रतिध्वनि दोनों को बनाए रखता है।
- source_word: לְתַנּוֹת מִדְבָּר
  choice: मरुभूमि के गीदड़ों के लिए
  rationale: תַנּוֹת को वर्तमान शब्दकोशीय सहमति उजाड़ क्षेत्रों में रहने वाले गीदड़ों के रूप में समझती है; ‘अजगरों’ जैसा पारंपरिक अनुवाद कम संभावित है।
- source_word: וְאֶת
  choice: पर
  rationale: संयोजक का मूल अर्थ ‘और’ है, किंतु पिछले पद में याकूब के प्रति प्रेम के साथ स्पष्ट विरोध होने के कारण हिन्दी में ‘पर’ स्वाभाविक है।
theological_decisions:
- issue: एसाव के प्रति परमेश्वर की घृणा का बल
  choice: मुख्य पाठ में सीधे ‘मैंने घृणा की’ रखा गया।
  alternative: ‘मैंने त्याग दिया’ या ‘मैंने कम प्रेम किया।’
  rationale: שׂנא का स्पष्ट सामान्य अर्थ ‘घृणा करना’ है। वाचा-संबंधी चुनाव अथवा प्राथमिकता की व्याख्याएँ संभव हैं, पर उन्हें मुख्य पाठ में रखकर मूल कथन के धर्मवैचारिक तनाव को नरम नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गंभीर भविष्यद्वाणीपरक लहजे के साथ रखी गई है। ‘घृणा’ मूल की तीक्ष्णता बनाए रखता है; ‘मरुभूमि’ और ‘विरासत’ गरिमापूर्ण किंतु सामान्य पाठक के लिए बोधगम्य हैं।
