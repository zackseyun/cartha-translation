id: MAL.1.10
reference: Malachi 1:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: מִ֤י גַם בָּ/כֶם֙ וְ/יִסְגֹּ֣ר דְּלָתַ֔יִם וְ/לֹֽא תָאִ֥ירוּ מִזְבְּחִ֖/י חִנָּ֑ם אֵֽין לִ֨/י חֵ֜פֶץ בָּ/כֶ֗ם אָמַר֙ יְהוָ֣ה צְבָא֔וֹת וּ/מִנְחָ֖ה לֹֽא אֶרְצֶ֥ה מִ/יֶּדְ/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/010.yaml
  text: Oh[a], that there were even one among you who would shut the doors, so that you would not kindle my altar in vain! I have no pleasure in you, says Yahweh of hosts[c][b], and I will not accept an offering from your hand.
translation:
  language: hi
  text: काश, तुममें कोई तो ऐसा होता जो द्वार बंद कर देता[a], ताकि तुम मेरी वेदी पर व्यर्थ आग न जलाओ![b] सेनाओं का यहोवा कहता है, “मैं तुमसे प्रसन्न नहीं हूँ, और तुम्हारे हाथ से कोई भेंट[c] स्वीकार नहीं करूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुममें ऐसा कौन है जो द्वार बंद कर दे?” इब्रानी को अलंकारिक प्रश्न के रूप में भी पढ़ा जा सकता है; यहाँ इसे इच्छा के रूप में समझा गया है।
    reason: alternative_reading
  - marker: b
    text: या, “मेरी वेदी को व्यर्थ न जलाओ।” भाव वेदी की आग प्रज्वलित करने का है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी शब्द का अर्थ बलिदानी संदर्भों में विशेष रूप से “अन्नबलि” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי גַם בָּכֶם
  choice: काश, तुममें कोई तो ऐसा होता
  rationale: संदर्भ में यह पदबंध खिन्न इच्छा या विलाप व्यक्त करता प्रतीत होता है। हिंदी में ‘काश’ इस भाव को स्वाभाविक रूप से व्यक्त करता है, जबकि प्रश्नवाचक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וְיִסְגֹּר דְּלָתַיִם
  choice: जो द्वार बंद कर देता
  rationale: क्रिया का अर्थ ‘बंद करना’ है और बहुवचन संज्ञा मंदिर के द्वारों की ओर संकेत करती है। ‘जो...कर देता’ पूर्ववर्ती इच्छासूचक वाक्य के साथ स्वाभाविक है।
- source_word: וְלֹא תָאִירוּ מִזְבְּחִי
  choice: ताकि तुम मेरी वेदी पर ... आग न जलाते
  rationale: हिफ़ील क्रिया यहाँ वेदी की आग प्रज्वलित करने के अर्थ में है। ‘वेदी पर आग जलाना’ आधुनिक हिंदी में स्वाभाविक है और बलिदान-संबंधी संदर्भ स्पष्ट रखता है।
- source_word: חִנָּם
  choice: व्यर्थ
  rationale: यहाँ शब्द निष्फल या निरर्थक उपासना का भाव देता है। ‘व्यर्थ’ संक्षिप्त, गरिमापूर्ण और सामान्य हिंदी में स्पष्ट है।
- source_word: אֵין לִי חֵפֶץ בָּכֶם
  choice: मैं तुमसे प्रसन्न नहीं हूँ
  rationale: חֵפֶץ प्रसन्नता, आनंद या अनुकूलता का बोध कराता है। यह हिंदी वाक्य व्यक्तिगत अस्वीकृति को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का यहोवा
  rationale: यहोवा वाचा के दिव्य नाम को प्रत्यक्ष रखता है; ‘सेनाओं का’ צְבָאוֹת के अर्थ और इस उपाधि की गंभीरता को सुरक्षित रखता है।
- source_word: וּמִנְחָה
  choice: कोई भेंट
  rationale: מִנְחָה भेंट के लिए व्यापक शब्द है और बलिदानी संदर्भ में विशेषतः अन्नबलि भी हो सकता है। मुख्य पाठ में व्यापक अर्थ रखा गया है और विशिष्ट अर्थ पादटिप्पणी में दिया गया है।
- source_word: לֹא אֶרְצֶה מִיֶּדְכֶם
  choice: तुम्हारे हाथ से ... स्वीकार नहीं करूँगा
  rationale: बलिदानी संदर्भ में רצה का अर्थ अनुकूलतापूर्वक स्वीकार करना है। ‘तुम्हारे हाथ से’ मूल की ठोस सामूहिक अभिव्यक्ति को बनाए रखता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ वाचा के विशिष्ट दिव्य नाम का प्रयोग करता है; उसे उपाधि में बदलने के बजाय हिंदी में प्रचलित नामरूप ‘यहोवा’ रखा गया है।
- issue: מִנְחָה का दायरा
  choice: भेंट
  alternative: अन्नबलि
  rationale: यद्यपि बलिदानी संदर्भों में यह शब्द विशेष रूप से अन्नबलि बता सकता है, यहाँ व्यापक ‘भेंट’ निंदा के दायरे को अनावश्यक रूप से संकुचित नहीं करता; विशिष्ट संभावना पादटिप्पणी में सुरक्षित है।
- issue: מִי גַם בָּכֶם का वाक्य-बल
  choice: इच्छासूचक—‘काश...’
  alternative: प्रश्नवाचक—‘तुममें ऐसा कौन है...?’
  rationale: संदर्भ में मंदिर के द्वार बंद कर दिए जाने की तीव्र इच्छा अधिक संभावित है, पर इब्रानी को अलंकारिक प्रश्न के रूप में भी पढ़ा जा सकता है; अतः वैकल्पिक पाठ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘काश’ खिन्न इच्छासूचक बल को व्यक्त करता है; ‘वेदी पर आग जलाना’ शाब्दिक संरचना की अपेक्षा हिंदी में अधिक स्वाभाविक है। संबोधन में बहुवचन ‘तुम’ मूल के बहुवचन को बनाए रखता है।
