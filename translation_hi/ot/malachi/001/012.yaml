id: MAL.1.12
reference: Malachi 1:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אַתֶּ֖ם מְחַלְּלִ֣ים אוֹת֑/וֹ בֶּ/אֱמָרְ/כֶ֗ם שֻׁלְחַ֤ן אֲדֹנָ/י֙ מְגֹאָ֣ל ה֔וּא וְ/נִיב֖/וֹ נִבְזֶ֥ה אָכְלֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/012.yaml
  text: But you are profaning it by saying[a], ‘The table of the Lord is defiled, and its fruit, its food[b], is despised.’
translation:
  language: hi
  text: परन्तु तुम उसे[a] यह कहकर अपवित्र करते हो, “प्रभु की मेज़ दूषित है, और उसका फल, उसका भोजन[b], तुच्छ समझा जाता है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उसे’ का संकेत प्रभु के नाम के बजाय सीधे प्रभु की ओर भी माना जा सकता है।
    reason: alternative_reading
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “उसका फल, उसका भोजन।” यह सम्भवतः वेदी अथवा मेज़ पर चढ़ाई जाने वाली भोजन-भेंटों की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מְחַלְּלִים
  choice: अपवित्र करते हो
  rationale: पिएल रूप का अर्थ किसी पवित्र वस्तु को साधारण या अपवित्र ठहराना है। ‘अपवित्र करते हो’ बलिदान और उपासना के संदर्भ में इसके धार्मिक भाव को स्पष्ट रखता है।
- source_word: אוֹתוֹ
  choice: उसे
  rationale: इब्रानी सर्वनाम का सबसे निकट संदर्भ पिछले पद का ‘मेरा नाम’ है। ‘उसे’ मूल की सर्वनामात्मक संक्षिप्तता बनाए रखता है और प्रभु की ओर सीधे संकेत की सम्भावना भी पूरी तरह बंद नहीं करता।
- source_word: בֶּאֱמָרְכֶם
  choice: यह कहकर
  rationale: पूर्वसर्ग सहित क्रियार्थक संज्ञा यहाँ माध्यम बताती है; उनके कथन के द्वारा ही अपवित्रीकरण होता है।
- source_word: שֻׁלְחַן אֲדֹנָי
  choice: प्रभु की मेज़
  rationale: यह सहज आधुनिक हिन्दी में वेदी से जुड़ी भोज-मेज़ की धार्मिक छवि और संबंध दोनों को सुरक्षित रखता है।
- source_word: אֲדֹנָי
  choice: प्रभु
  rationale: यहाँ इब्रानी पाठ में उपाधि אֲדֹנָי है, परमेश्वर का निज नाम YHWH नहीं; इसलिए ‘प्रभु’ उपयुक्त है।
- source_word: מְגֹאָל
  choice: दूषित
  rationale: निष्क्रिय अर्थ ‘दूषित/कलुषित’ है। ‘दूषित’ बलिदान-संबंधी अशुद्धि और अनादर दोनों के लिए स्वाभाविक हिन्दी है।
- source_word: נִיבוֹ
  choice: उसका फल
  rationale: ניב का मूल अर्थ फल या उपज है। ‘फल’ सीधा समतुल्य है; अगला पद इसके भोजन-संबंधी आशय को साथ रखता है।
- source_word: נִבְזֶה
  choice: तुच्छ समझा जाता है
  rationale: 'यह निष्क्रिय भाव को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है: उसे घृणित या आदर के अयोग्य माना जाता है।'
- source_word: אָכְלוֹ
  choice: उसका भोजन
  rationale: शाब्दिक अर्थ ‘उसका भोजन’ है। पिछले ‘उसका फल’ के साथ दोनों पदों को रखकर मूल की संक्षिप्त और कुछ अस्पष्ट संबंध-रचना सुरक्षित रहती है।
theological_decisions:
- issue: ‘उसे अपवित्र करते हो’ में सर्वनाम का संदर्भ
  choice: सर्वनाम को मुख्यतः पिछले संदर्भ में आए प्रभु के नाम की ओर संकेत करने वाला माना गया है।
  alternative: सर्वनाम सीधे प्रभु की ओर संकेत कर सकता है।
  rationale: मलाकी 1:11 में ‘मेरा नाम’ निकटतम विषय है और पद 12 उसके विपरीत याजकों के व्यवहार को बताता है। फिर भी इब्रानी पुल्लिंग सर्वनाम सीधे प्रभु को भी सूचित कर सकता है, इसलिए इस सम्भावना को पादटिप्पणी में रखा गया है।
- issue: ईश्वरीय उपाधि אֲדֹנָי का अनुवाद
  choice: प्रभु
  alternative: यहोवा
  rationale: मूल पाठ में यहाँ אֲדֹנָי उपाधि है, चतुरक्षरीय निज नाम YHWH नहीं। अतः दोनों को अलग रखने के लिए ‘प्रभु’ चुना गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘मेज़’, ‘दूषित’ और ‘अपवित्र’ धार्मिक संदर्भ को बिना अनावश्यक पुरातनता के व्यक्त करते हैं। मूल के ‘उसका फल, उसका भोजन’ की संकुचित रचना को व्याख्यात्मक रूप से पूरी तरह खोलने के बजाय पाठ और पादटिप्पणी में सुरक्षित रखा गया है।
