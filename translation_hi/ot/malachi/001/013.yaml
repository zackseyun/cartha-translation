source:
  edition: WLC
  text: וַ/אֲמַרְתֶּם֩ הִנֵּ֨ה מַ/תְּלָאָ֜ה וְ/הִפַּחְתֶּ֣ם אוֹת֗/וֹ אָמַר֙ יְהוָ֣ה צְבָא֔וֹת וַ/הֲבֵאתֶ֣ם גָּז֗וּל וְ/אֶת הַ/פִּסֵּ֨חַ֙ וְ/אֶת הַ֣/חוֹלֶ֔ה וַ/הֲבֵאתֶ֖ם אֶת הַ/מִּנְחָ֑ה הַ/אֶרְצֶ֥ה אוֹתָ֛/הּ מִ/יֶּדְ/כֶ֖ם אָמַ֥ר יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/013.yaml
  text: And you say[a], ‘Look, what a weariness this is,’ and you snort at it, says Yahweh of hosts. And you bring what is stolen, and the lame, and the sick; thus you bring the offering[b]. Should I accept it from your hand? says Yahweh.
translation:
  language: hi
  text: तुम कहते हो, ‘देखो, यह कितना थकाऊ है!’ और उसके प्रति तिरस्कार से फुँकारते हो[a]—सेनाओं के याहवे का यह कहना है। तुम लूटा हुआ, लँगड़ा और बीमार पशु लाते हो; इस प्रकार तुम भेंट लाते हो। क्या मैं उसे तुम्हारे हाथ से स्वीकार करूँ?—याहवे का यह कहना है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी क्रिया तिरस्कार से नाक के द्वारा फूँकने या साँस छोड़ने की भाव-भंगिमा दिखाती है; इसका अर्थ ‘उसका तिरस्कार करते हो’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַתְּלָאָה
  choice: यह कितना थकाऊ है
  rationale: संज्ञा थकान, कठिनाई या बोझिल परेशानी का भाव देती है। विस्मयात्मक शिकायत को स्वाभाविक आधुनिक हिन्दी में रखा गया है।
- source_word: וְהִפַּחְתֶּם אֹתוֹ
  choice: और उस पर नाक सिकोड़ते हो
  rationale: נפח का मूल चित्र फूँकने या तिरस्कारपूर्वक नाक से साँस छोड़ने का है। ‘नाक सिकोड़ना’ हिन्दी में उस ठोस भाव-भंगिमा और तिरस्कार, दोनों को सहज रूप से व्यक्त करता है; पादटिप्पणी मूल चित्र स्पष्ट करती है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं के याहवे
  rationale: व्यक्तिगत ईश्वरीय नाम को ‘याहवे’ के रूप में रखा गया है और צְבָאוֹת के सैन्य तथा स्वर्गीय दलों के अर्थ को ‘सेनाओं’ द्वारा संरक्षित किया गया है।
- source_word: גָּזוּל
  choice: लूटा हुआ
  rationale: निष्क्रिय कृदन्त बलपूर्वक छीनकर या चोरी करके प्राप्त वस्तु/पशु को सूचित करता है। बलिदानी संदर्भ में अगली विशेषताओं के साथ ‘पशु’ स्वाभाविक रूप से समझा और स्पष्ट किया गया है।
- source_word: הַפִּסֵּחַ
  choice: लँगड़ा
  rationale: यह बलि के पशु की चलने-संबंधी शारीरिक विकलता को संक्षेप और सामान्य हिन्दी में व्यक्त करता है।
- source_word: הַחוֹלֶה
  choice: बीमार
  rationale: यह रोगग्रस्त पशु को सामान्य, स्पष्ट आधुनिक हिन्दी में दर्शाता है।
- source_word: הַמִּנְחָה
  choice: भेंट
  rationale: מִנְחָה का अर्थ भेंट, उपहार या विशेष संदर्भों में अन्नबलि हो सकता है। यहाँ दोषयुक्त पशुओं का प्रसंग होने के कारण व्यापक ‘भेंट’ उपयुक्त है और इसे अनावश्यक रूप से अन्नबलि नहीं बनाता।
- source_word: הַאֶרְצֶה אֹתָהּ
  choice: क्या मैं उसे ... ग्रहण करूँ?
  rationale: बलिदानी संदर्भ में רצה का अर्थ अनुकूलतापूर्वक स्वीकार करना है। प्रश्नवाचक ה के कारण इसे परमेश्वर की फटकार व्यक्त करने वाले अलंकारिक प्रश्न के रूप में रखा गया है।
- source_word: מִיֶּדְכֶם
  choice: तुम्हारे हाथ से
  rationale: मूल इब्रानी का ठोस मुहावरा सुरक्षित है और हिन्दी में भी देने वाले से ग्रहण करने का अर्थ स्पष्ट है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम है। लिप्यंतरण ‘याहवे’ उसे सामान्य उपाधि में बदले बिना सुरक्षित रखता है।
- issue: יְהוָה צְבָאוֹת उपाधि का अर्थ
  choice: सेनाओं के याहवे
  alternative: सर्वशक्तिमान याहवे
  rationale: ‘सेनाओं’ मूल के צְבָאוֹת और उसके स्वर्गीय/सैन्य बिंब को बनाए रखता है; ‘सर्वशक्तिमान’ अर्थ की व्याख्या करता, पर मूल रूपक को हटा देता।
- issue: दोषयुक्त भेंट में גָּזוּל का आशय
  choice: लूटा हुआ पशु
  alternative: लूटी हुई वस्तु
  rationale: व्याकरणतः शब्द सामान्यतः ‘लूटा हुआ’ है, पर लँगड़े और बीमार के समानांतर तथा बलिदानी प्रसंग पशु की ओर संकेत करता है। हिन्दी में संदर्भ स्पष्ट करने के लिए ‘पशु’ एक बार जोड़ा गया है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। याजकीय फटकार की तीक्ष्णता बनाए रखने के लिए सीधे संबोधन, विस्मयात्मक शिकायत और अलंकारिक प्रश्न सुरक्षित हैं। ‘नाक सिकोड़ते हो’ सामान्य पाठक के लिए सहज है, जबकि पादटिप्पणी मूल इब्रानी के अधिक ठोस श्वास/फूँक वाले बिंब को बताती है।
