id: MAL.1.8
reference: Malachi 1:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/כִֽי תַגִּשׁ֨וּ/ן עִוֵּ֤ר לִ/זְבֹּ֨חַ֙ אֵ֣ין רָ֔ע וְ/כִ֥י תַגִּ֛ישׁוּ פִּסֵּ֥חַ וְ/חֹלֶ֖ה אֵ֣ין רָ֑ע הַקְרִיבֵ֨/הוּ נָ֜א לְ/פֶחָתֶ֗/ךָ הֲ/יִּרְצְ/ךָ֙ א֚וֹ הֲ/יִשָּׂ֣א פָנֶ֔י/ךָ אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/008.yaml
  text: When you present a blind animal for sacrifice[a], is that not evil? And when you present one that is lame or sick, is that not evil? Present it, please, to your governor. Will he accept you[c][b], or show you favor? says Yahweh of hosts.
translation:
  language: hi
  text: जब तुम किसी अंधे पशु को बलि चढ़ाने के लिए प्रस्तुत करते हो, तो क्या यह बुरा नहीं है?[a] और जब तुम किसी लंगड़े या बीमार पशु को प्रस्तुत करते हो, तो क्या यह बुरा नहीं है? उसे ज़रा अपने राज्यपाल के सामने प्रस्तुत करो। क्या वह तुम्हें स्वीकार करेगा[b] या तुम पर कृपा करेगा?[c] सेनाओं के याहवे ने कहा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में दोनों स्थानों पर शाब्दिक रूप से ‘कोई बुराई नहीं’ है; प्रसंग की फटकार और व्यंग्यपूर्ण बल को व्यक्त करने के लिए इसे प्रश्न के रूप में अनूदित किया गया है।
    reason: lexical_alternative
  - marker: b
    text: या ‘क्या वह तुमसे प्रसन्न होगा?’
    reason: alternative_reading
  - marker: c
    text: इब्रानी मुहावरा शाब्दिक रूप से ‘तुम्हारा मुख उठाना’ है, जिसका अर्थ अनुग्रह दिखाना या स्वीकार करना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תַגִּשׁוּן / תַגִּישׁוּ
  choice: प्रस्तुत करते हो
  rationale: नגשׁ के हिफ़ील रूप का यहाँ अर्थ किसी भेंट को आगे लाना है। ‘प्रस्तुत करना’ बलिदान और राज्यपाल के सामने भेंट लाने—दोनों संदर्भों में स्वाभाविक है।
- source_word: עִוֵּר
  choice: किसी अंधे पशु को
  rationale: विशेषण यहाँ संज्ञा के रूप में बलि के दोषपूर्ण पशु के लिए प्रयुक्त है; ‘पशु’ जोड़ने से आशय स्पष्ट होता है, बिना नया अर्थ जोड़े।
- source_word: לִזְבֹּחַ
  choice: बलि चढ़ाने के लिए
  rationale: इनफ़िनिटिव बलिदान का उद्देश्य बताता है; यह आधुनिक हिन्दी में स्पष्ट और सहज है।
- source_word: אֵין רָע
  choice: क्या यह बुरा नहीं है?
  rationale: शाब्दिक रूप ‘कोई बुराई नहीं’ है, पर प्रसंग में यह याजकों के रवैये पर व्यंग्यपूर्ण फटकार है। प्रश्नवाचक रूप उस बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: פִּסֵּחַ
  choice: लंगड़े
  rationale: यह चलने-फिरने की शारीरिक विकृति वाले पशु के लिए सामान्य और सटीक हिन्दी शब्द है।
- source_word: חֹלֶה
  choice: बीमार
  rationale: यह सुलभ आधुनिक हिन्दी है और इब्रानी के सामान्य अर्थ को अनावश्यक रूप से तकनीकी नहीं बनाता।
- source_word: הַקְרִיבֵהוּ נָא
  choice: उसे ज़रा ... प्रस्तुत करो
  rationale: आज्ञार्थक क्रिया के साथ נָא की नुकीली, व्यंग्यपूर्ण चुनौती को ‘ज़रा’ स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: פֶחָה
  choice: राज्यपाल
  rationale: यह फ़ारसी काल के प्रांतीय नागरिक अधिकारी का मानक और संक्षिप्त हिन्दी पद है।
- source_word: הֲיִרְצְךָ
  choice: क्या वह तुम्हें स्वीकार करेगा
  rationale: רצה प्रसन्न होने या अनुकूल रूप से स्वीकार करने का अर्थ देता है। कर्म द्वितीय पुरुष है, इसलिए यहाँ व्यक्ति की स्वीकृति पर बल है।
- source_word: הֲיִשָּׂא פָנֶיךָ
  choice: या तुम पर कृपा करेगा
  rationale: शाब्दिक मुहावरा ‘तुम्हारा मुख उठाना’ अनुकूल दृष्टि या कृपा दिखाने का संकेत है; हिन्दी में अर्थगत रूप स्वाभाविक है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं के याहवे
  rationale: याहवे वाचा के व्यक्तिगत नाम को प्रत्यक्ष रूप से दर्शाता है; ‘सेनाओं के’ צְבָאוֹת की व्यापक स्वर्गीय और सैन्य उपाधि को खुला रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम प्रत्यक्ष रूप से है। उसका लिप्यंतरण वाचा के नाम को सामान्य उपाधि में बदलने से बचाता है।
- issue: אֵין רָע की वाक्यगत शक्ति
  choice: 'व्यंग्यपूर्ण प्रश्न: ‘क्या यह बुरा नहीं है?’'
  alternative: 'शाब्दिक कथन: ‘कोई बुराई नहीं है’'
  rationale: इब्रानी रूप शाब्दिक कथन जैसा है, किंतु प्रसंग याजकों की उपेक्षा को उजागर करने वाली फटकार है। प्रश्नवाचक अनुवाद प्रसंगगत शक्ति व्यक्त करता है, जबकि पादटिप्पणी शाब्दिक रूप सुरक्षित रखती है।
- issue: נשא פנים मुहावरे का अर्थ
  choice: कृपा करना
  alternative: तुम्हारा मुख उठाना
  rationale: शाब्दिक देहगत चित्र के बजाय मुहावरे का सामाजिक अर्थ दिया गया है; पादटिप्पणी मूल चित्र को दर्ज करती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी अपनाई गई है। ‘ज़रा’ व्यंग्यपूर्ण चुनौती को बोलचाल की सहजता देता है, जबकि ‘प्रस्तुत’, ‘राज्यपाल’ और ‘सेनाओं के याहवे’ पाठ की औपचारिक-धार्मिक गरिमा बनाए रखते हैं। बहुवचन याजकों से संबोधन को हिन्दी में ‘तुम’ द्वारा स्वाभाविक रखा गया है।
