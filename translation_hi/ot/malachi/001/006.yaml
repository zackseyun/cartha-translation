reference: Malachi 1:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בֵּ֛ן יְכַבֵּ֥ד אָ֖ב וְ/עֶ֣בֶד אֲדֹנָ֑י/ו וְ/אִם אָ֣ב אָ֣נִי אַיֵּ֣ה כְבוֹדִ֡/י וְ/אִם אֲדוֹנִ֣ים אָנִי֩ אַיֵּ֨ה מוֹרָאִ֜/י אָמַ֣ר יְהוָ֣ה צְבָא֗וֹת לָ/כֶם֙ הַ/כֹּֽהֲנִים֙ בּוֹזֵ֣י שְׁמִ֔/י וַ/אֲמַרְתֶּ֕ם בַּ/מֶּ֥ה בָזִ֖ינוּ אֶת שְׁמֶֽ/ךָ־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/006.yaml
  text: A son honors his father, and a servant his master. If, then, I am a father, where is my honor? And if I am a master, where is the fear due me? says the LORD of Armies to you, O priests who despise my name. Yet you say, “How have we despised your name?”
translation:
  language: hi
  text: “पुत्र अपने पिता का आदर करता है, और दास अपने स्वामी का। यदि मैं पिता हूँ, तो मेरा आदर कहाँ है? और यदि मैं स्वामी हूँ, तो मेरा भय कहाँ है?” सेनाओं का यहोवा तुमसे, हे मेरे नाम का तिरस्कार करनेवाले याजको, कहता है। फिर भी तुम पूछते हो, “हमने किस प्रकार तेरे नाम का तिरस्कार किया है?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּן
  choice: पुत्र
  rationale: सामान्य संबंधवाचक अर्थ को गरिमापूर्ण और स्पष्ट आधुनिक हिन्दी में व्यक्त करता है।
- source_word: עֶבֶד
  choice: दास
  rationale: यहाँ स्वामी के अधीन व्यक्ति का अर्थ है; ‘दास’ मूल सामाजिक संबंध और अगले खंड के ‘स्वामी’ के साथ उसका युग्म बनाए रखता है।
- source_word: אֲדֹנָיו / אֲדוֹנִים
  choice: अपने स्वामी / स्वामी
  rationale: पहले रूप में एक दास के स्वामी और दूसरे में परमेश्वर के प्रभुत्व को स्वाभाविक हिन्दी में व्यक्त करता है; हिब्रू का बहुवचन-रूप यहाँ एकवचन अर्थ में प्रयुक्त है।
- source_word: מוֹרָאִי
  choice: मेरा भय
  rationale: मूल शब्द भय और श्रद्धामय विस्मय दोनों का संकेत दे सकता है; ‘मेरा भय’ इस तनाव को ‘श्रद्धा’ मात्र में सीमित नहीं करता।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का यहोवा
  rationale: दैवी नाम और ‘सेनाओं’ की उपाधि दोनों को प्रत्यक्ष रूप से सुरक्षित रखता है।
- source_word: שְׁמִי
  choice: मेरे नाम
  rationale: बाइबलीय प्रयोग में ‘नाम’ परमेश्वर की प्रतिष्ठा और प्रकट पहचान को समेटता है; इसे शाब्दिक रूप में रखना उचित है।
- source_word: בַּמֶּה
  choice: किस प्रकार
  rationale: प्रतिवादात्मक प्रश्न को स्वाभाविक हिन्दी में व्यक्त करता है और केवल साधन नहीं, आरोप के आधार के बारे में पूछने का भाव भी देता है।
theological_decisions:
- issue: परमेश्वर के पिता और स्वामी होने के दावों का स्वरूप
  choice: ‘यदि मैं पिता हूँ… यदि मैं स्वामी हूँ…’ को शर्तात्मक अलंकारिक प्रश्न के रूप में बनाए रखा
  alternative: ‘चूँकि मैं तुम्हारा पिता और स्वामी हूँ’
  rationale: मूल पाठ आरोप की तीक्ष्णता हेतु शर्तात्मक संरचना रखता है; उसे स्पष्ट कथन में बदलना वास्तविक वाक्यगत तनाव को मिटा देता।
- issue: מוֹרָאִי में भय बनाम श्रद्धा
  choice: ‘मेरा भय’
  alternative: ‘मेरे प्रति श्रद्धा’ या ‘मेरा सम्मान’
  rationale: ‘भय’ मूल की कठोरता तथा परमेश्वर के प्रति विस्मय का आयाम बचाता है; ‘श्रद्धा’ अर्थ को अनावश्यक रूप से नरम कर सकती है।
- issue: याजकों के प्रतिवाद का स्वर
  choice: ‘फिर भी तुम पूछते हो’
  alternative: ‘और तुम कहते हो’
  rationale: हिब्रू में सामान्य ‘कहना’ है, पर उद्धृत वाक्य प्रश्न है और प्रसंग में आरोप के प्रति प्रतिवाद करता है; ‘पूछते हो’ हिन्दी में संवाद को स्पष्ट करता है बिना उसके आशय को निर्णायक रूप से बदलने के।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, प्रत्यक्ष और आरोपात्मक भविष्यद्वक्तीय स्वर रखा गया है। ‘पुत्र–पिता’ और ‘दास–स्वामी’ की समानांतर संरचना सुरक्षित है। याजकों को संबोधन में ‘हाँ’ हिन्दी में हिब्रू वाक्य के बलाघात और अचानक लक्षित संबोधन को स्वाभाविक बनाता है।
