source:
  edition: WLC
  text: וְ/עֵינֵי/כֶ֖ם תִּרְאֶ֑ינָה וְ/אַתֶּ֤ם תֹּֽאמְרוּ֙ יִגְדַּ֣ל יְהוָ֔ה מֵ/עַ֖ל לִ/גְב֥וּל יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/005.yaml
  text: Your own eyes will see[a], and you yourselves will say, “Great is Yahweh beyond the border of Israel.”
translation:
  language: hi
  text: तुम अपनी आँखों से देखोगे, और तुम स्वयं कहोगे, “इस्राएल की सीमा के पार भी याहवे महान है।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसे उद्घोषणा के रूप में, “इस्राएल की सीमा के पार भी याहवे महान है!” अथवा कामनासूचक रूप में, “इस्राएल की सीमा के पार भी याहवे महान ठहरे,” भी समझा जा सकता है। इब्रानी दोनों भावों की गुंजाइश देता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְעֵינֵיכֶם תִּרְאֶינָה
  choice: तुम अपनी आँखों से देखोगे
  rationale: इब्रानी में शाब्दिक रूप से ‘और तुम्हारी आँखें देखेंगी’ है। आधुनिक हिन्दी में ‘अपनी आँखों से देखोगे’ प्रत्यक्ष दर्शन और सम्बोधित लोगों पर बल—दोनों को स्वाभाविक रूप से व्यक्त करता है; कोई अनुल्लिखित कर्म नहीं जोड़ा गया।
- source_word: וְאַתֶּם תֹּאמְרוּ
  choice: और तुम स्वयं कहोगे
  rationale: स्वतंत्र सर्वनाम וְאַתֶּם कर्ता पर विशेष बल देता है, जिसे ‘तुम स्वयं’ सुरक्षित रखता है। अपूर्ण क्रिया का प्रसंगानुकूल भावी अर्थ ‘कहोगे’ से व्यक्त हुआ है।
- source_word: יִגְדַּל
  choice: महान है
  rationale: גדל का काल/भाव यहाँ उद्घोषणा, कथन अथवा भावी/कामनासूचक अर्थ की गुंजाइश रखता है। मुख्य पाठ में संक्षिप्त स्वाभाविक उद्घोषणात्मक हिन्दी चुनी गई है और वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה को उपाधि से बदलने के बजाय आधुनिक हिन्दी में प्रचलित निकट लिप्यंतरण ‘याहवे’ दिया गया है।
- source_word: מֵעַל לִגְבוּל יִשְׂרָאֵל
  choice: इस्राएल की सीमा के पार भी
  rationale: מֵעַל का स्थानसूचक अर्थ यहाँ इस्राएल की सीमा से बाहर तक फैली महानता को दर्शाता है। ‘भी’ हिन्दी में इस विस्तार के निहित बल को स्वाभाविक बनाता है, जबकि גְבוּל का एकवचन ‘सीमा’ से बना रहता है।
theological_decisions:
- issue: יִגְדַּל יְהוָה का कथनात्मक या उद्घोषणात्मक/कामनासूचक बल
  choice: इस्राएल की सीमा के पार भी याहवे महान है
  alternative: इस्राएल की सीमा के पार भी याहवे महान ठहरे / याहवे की महानता प्रकट हो
  rationale: इब्रानी अपूर्ण रूप को केवल सपाट कथन या केवल कामना मान लेना अनावश्यक रूप से अर्थ को सीमित करेगा। मुख्य पाठ सहज उद्घोषणा देता है और पादटिप्पणी वैकल्पिक भाव को स्पष्ट करती है।
- issue: יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल में व्यक्तिगत दिव्य नाम स्पष्ट रूप से उपस्थित है; उसका लिप्यंतरण नाम और उपाधि के बीच का भेद बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘अपनी आँखों से’ और ‘तुम स्वयं’ मूल के बल को स्वाभाविक हिन्दी में व्यक्त करते हैं। दिव्य नाम ‘याहवे’ के रूप में रखा गया है और क्रिया के वास्तविक भावगत तनाव को पादटिप्पणी में सुरक्षित किया गया है।
