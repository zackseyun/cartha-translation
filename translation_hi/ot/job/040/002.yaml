  text: Will one who contends with the Almighty correct him? Let the one who argues with God answer it[a][b].
translation:
  language: hi
  text: 'क्या सर्वशक्तिमान से विवाद करने वाला उसे सुधारेगा?[a]


    परमेश्वर से वाद-विवाद करने वाला इसका उत्तर दे।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या सर्वशक्तिमान से विवाद करने वाला उसे शिक्षा देगा या फटकारेगा?” इब्रानी में कानूनी विवाद तथा सुधार या फटकार—दोनों के भाव जुड़े हैं।
    reason: lexical_alternative
  - marker: b
    text: या, “वह इस बात का उत्तर दे,” अथवा “वह उसे उत्तर दे।” इब्रानी प्रत्यय संभवतः सीधे परमेश्वर के बजाय उठाए गए विषय या दावे की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲרֹב
  choice: क्या ... विवाद करनेवाला
  rationale: रיב का न्यायिक और विवादात्मक भाव रखते हुए इसे स्वाभाविक हिन्दी में व्यक्ति-सूचक वाक्यांश बनाया गया है; प्रश्न की आलंकारिक शक्ति भी बनी रहती है।
- source_word: עִם
  choice: से
  rationale: विवाद के प्रसंग में हिन्दी का ‘से’ साथ और विरोध—दोनों का अपेक्षित संबंध स्वाभाविक रूप से व्यक्त करता है।
- source_word: שַׁדַּי
  choice: सर्वशक्तिमान
  rationale: अय्यूब में प्रयुक्त इस ईश्वरीय उपाधि का अर्थपरक और हिन्दी में प्रचलित अनुवाद है।
- source_word: יִסּוֹר
  choice: उसे सुधारेगा
  rationale: יסר में शिक्षा देने, अनुशासित करने, डाँटने और सुधारने का अर्थक्षेत्र है। यहाँ मानव विवादकर्ता को कर्ता मानकर ‘सुधारेगा’ उस धृष्ट दावे की आलंकारिक तीव्रता व्यक्त करता है; निहित कर्म सर्वशक्तिमान की ओर संकेत करता है।
- source_word: מוֹכִיחַ
  choice: तर्क करनेवाला
  rationale: יכח का अर्थ तर्क करना, दोष दिखाना, झिड़कना या मुकदमा लड़ना हो सकता है। ‘तर्क करनेवाला’ सामान्य पाठक के लिए सुबोध है और प्रसंग का विवादात्मक भाव बनाए रखता है।
- source_word: אֱלוֹהַּ
  choice: परमेश्वर
  rationale: अय्यूब में परमेश्वर के लिए प्रयुक्त इस एकवचन काव्यात्मक रूप का स्वाभाविक हिन्दी अनुवाद।
- source_word: יַעֲנֶנָּה
  choice: इसका उत्तर दे
  rationale: स्त्रीलिंग एकवचन प्रत्यय का संभावित संकेत उठाए गए विषय, दावे या बात की ओर है। ‘इसका’ उस संक्षिप्त संदर्भ को हिन्दी में स्वाभाविक रूप से रखता है, जबकि वैकल्पिक संकेत पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: क्या मनुष्य सर्वशक्तिमान को सुधारने का दावा करता है, या परमेश्वर मनुष्य को सुधारता है
  choice: आलंकारिक प्रश्न में मानव विवादकर्ता को सर्वशक्तिमान को सुधारने का दुस्साहस करते हुए संबोधित किया गया है।
  alternative: सर्वशक्तिमान से विवाद करनेवाले को सुधार स्वीकार करना चाहिए।
  rationale: 'वाक्य-संरचना और अगले खंड की समानांतर पुकार मानव विवादकर्ता को कर्ता मानने का समर्थन करती है: परमेश्वर से तर्क करनेवाले को उत्तर देने की चुनौती दी जाती है। इससे मूल की फटकार बनी रहती है और उसे किसी विशिष्ट धर्मसैद्धांतिक व्याख्या से नहीं भरा जाता।'
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सुबोध रखी गई है। ‘विवाद’ और ‘तर्क’ मूल के न्यायिक-विवादात्मक स्वर को बिना अत्यधिक तकनीकी भाषा के व्यक्त करते हैं। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
