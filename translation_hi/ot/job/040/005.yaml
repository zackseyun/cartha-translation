translation:
  language: hi
  text: मैं एक बार बोल चुका हूँ[a] और उत्तर नहीं दूँगा; दो बार बोल चुका हूँ और आगे कुछ नहीं कहूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैंने एक बार कहा और उत्तर नहीं दूँगा; दो बार कहा और आगे नहीं बोलूँगा।” इब्रानी में “जोड़ना” किसी काम को जारी रखने या फिर से करने का अर्थ भी दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַת
  choice: एक बार
  rationale: स्त्रीलिंग संख्या यहाँ क्रियाविशेषण की तरह प्रयुक्त है; इसलिए स्वाभाविक हिन्दी में ‘एक बार’ उचित है।
- source_word: דִּבַּרְתִּי
  choice: मैं ... बोल चुका हूँ
  rationale: प्रथम पुरुष एकवचन पूर्ण क्रिया अय्यूब के पहले कहे हुए वचनों को वर्तमान प्रसंग से जोड़ती है; ‘बोल चुका हूँ’ पूर्णता और वर्तमान प्रासंगिकता दोनों व्यक्त करता है।
- source_word: וְלֹא אֶעֱנֶה
  choice: अब उत्तर नहीं दूँगा
  rationale: ענה का सामान्य अर्थ ‘उत्तर देना’ है। हिन्दी में ‘अब’ समन्वित वाक्य के संदर्भगत भाव को स्पष्ट और स्वाभाविक बनाता है, बिना इसे प्रबल विरोधार्थक बनाए।
- source_word: וּשְׁתַּיִם
  choice: दो बार
  rationale: ‘दो’ भी समानांतर पंक्ति में क्रियाविशेषण रूप से प्रयुक्त है और ‘दो बार’ का अर्थ देता है।
- source_word: וְלֹא אוֹסִיף
  choice: अब और कुछ नहीं कहूँगा
  rationale: Hiphil יסף का अर्थ ‘और जोड़ना, जारी रखना, फिर करना’ हो सकता है। प्रसंग में इसका आशय आगे न बोलने से है; यह हिन्दी अभिव्यक्ति अर्थ को स्पष्ट रखते हुए ‘और’ के जोड़ने वाले भाव को बनाए रखती है।
