  text: רְאֵ֣ה כָל גֵּ֭אֶה הַכְנִיעֵ֑/הוּ וַ/הֲדֹ֖ךְ רְשָׁעִ֣ים תַּחְתָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/012.yaml
  text: Look on everyone who is proud[a], and humble him; and tread down the wicked where they stand.
translation:
  language: hi
  text: 'हर घमण्डी को देख और उसे नीचा कर दे;

    दुष्टों को जहाँ वे हैं, वहीं कुचल दे।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दुष्टों को उनके स्थान पर कुचल दे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: दृष्टि डाल
  rationale: यह अय्यूब को संबोधित एकवचन आज्ञार्थक है। ‘दृष्टि डाल’ न्याय के लिए ध्यान केंद्रित करने का भाव स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: כָל גֵּאֶה
  choice: हर घमण्डी
  rationale: כָל के साथ संज्ञा के रूप में प्रयुक्त विशेषण पूरे वर्ग के प्रत्येक घमण्डी व्यक्ति को दर्शाता है।
- source_word: הַכְנִיעֵהוּ
  choice: उसे नीचा कर दे
  rationale: हिफ़ील आज्ञार्थक और एकवचन कर्म-प्रत्यय का अर्थ उस घमण्डी व्यक्ति को नीचे लाना है; यह घमण्ड और पतन के विरोध को बनाए रखता है।
- source_word: וַהֲדֹךְ
  choice: कुचल दे
  rationale: यह आज्ञार्थक न्याय के प्रसंग में बलपूर्वक परास्त और नष्ट करने का निर्णायक भाव देता है।
- source_word: רְשָׁעִים
  choice: दुष्टों
  rationale: यह बहुवचन नैतिक वर्ग के रूप में दुष्ट लोगों को सूचित करता है; ‘दुष्टों’ आधुनिक हिन्दी में संक्षिप्त और मानक है।
- source_word: תַּחְתָּם
  choice: जहाँ वे हैं, वहीं
  rationale: תחת और बहुवचन प्रत्यय का यह प्रयोग उनके अपने स्थान पर, अर्थात तत्काल वहीं, न्याय किए जाने का भाव दे सकता है। स्थान-संबंधी वैकल्पिक अर्थ को पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: अय्यूब को दी गई आज्ञा का स्वरूप
  choice: आज्ञार्थक बल को ज्यों का त्यों रखा गया है, ताकि परमेश्वर की चुनौती में न्याय के इन कार्यों का सीधा आह्वान सुनाई दे।
  alternative: इसे स्पष्टतः काल्पनिक चुनौती कहना, या इसे अय्यूब को वास्तव में दैवी न्यायाधिकार दिए जाने के रूप में प्रस्तुत करना।
  rationale: आसपास के प्रसंग में ये आज्ञाएँ अय्यूब की क्षमता को चुनौती देती हैं, पर पद स्वयं आज्ञार्थक है। अनुवाद न तो चुनौती की धार को नरम करता है और न अय्यूब को दैवी अधिकार दिए जाने की व्याख्या जोड़ता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में है। ‘दृष्टि डाल’ और ‘नीचा कर दे’ गरिमापूर्ण होते हुए भी सामान्य पाठक के लिए स्पष्ट हैं; एकवचन आज्ञार्थक रूप मूल संबोधन को बनाए रखते हैं।
