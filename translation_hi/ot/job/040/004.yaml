  text: הֵ֣ן קַ֭לֹּתִי מָ֣ה אֲשִׁיבֶ֑/ךָּ יָ֝דִ֗/י שַׂ֣מְתִּי לְמוֹ פִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/004.yaml
  text: Look[a], I am insignificant; what can I answer you? I put my hand over my mouth.
translation:
  language: hi
  text: देख, मैं तुच्छ हूँ[a]; मैं तुझे क्या उत्तर दूँ? मैंने अपना हाथ अपने मुँह पर रख लिया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरा कोई महत्त्व नहीं”; परंपरागत अनुवाद, “मैं नीच हूँ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: देख
  rationale: यह ध्यान आकर्षित करने वाला अव्यय है। ‘देख’ आधुनिक हिन्दी में स्वाभाविक है और अय्यूब की आकस्मिक स्वीकारोक्ति का बल बनाए रखता है।
- source_word: קַלֹּתִי
  choice: मैं तुच्छ हूँ
  rationale: यह קלל से बना रूप यहाँ छोटा, हलका या कम महत्त्व का होने का भाव देता है। ‘तुच्छ’ आत्म-दीनता को व्यक्त करता है, पर अपने आप में नैतिक भ्रष्टता की प्रबल घोषणा नहीं बनाता। वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: מָה אֲשִׁיבֶךָּ
  choice: मैं तुझे क्या उत्तर दूँ?
  rationale: प्रश्नवाचक מָה और ‘उत्तर देना’ अर्थ वाले हिफ़ील रूप को सीधे और स्वाभाविक हिन्दी में रखा गया है; प्रश्न प्रसंग में उत्तर देने की असमर्थता दर्शाता है।
- source_word: יָדִי שַׂמְתִּי לְמוֹ פִי
  choice: मैंने अपना हाथ अपने मुँह पर रख लिया है
  rationale: मूल शारीरिक संकेत को ज्यों का त्यों रखते हुए हिन्दी के स्वाभाविक मुहावरे में मौन और विनम्र समर्पण का भाव व्यक्त किया गया है। पूर्ण वर्तमान निकट प्रसंग में उस किए हुए संकेत की वर्तमान स्थिति को दर्शाता है।
theological_decisions:
- issue: क्या अय्यूब के आत्म-वर्णन को नैतिक रूप से तीव्र शब्द में प्रस्तुत किया जाए
  choice: मैं तुच्छ हूँ
  alternative: मैं नीच हूँ; मेरा कोई महत्त्व नहीं
  rationale: इब्रानी शब्द इस प्रसंग में मुख्यतः लघुता, हलकेपन या कम महत्त्व का भाव देता है। ‘नीच’ नैतिक दुष्टता का ऐसा अर्थ जोड़ सकता है जो मूल में स्पष्ट नहीं है। ‘तुच्छ’ अय्यूब की दीनता को बनाए रखते हुए उस पर पापमय भ्रष्टता की अधिक प्रबल स्वीकारोक्ति नहीं थोपता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सीधे संबोधन में ‘तू’ के आदररहित नहीं बल्कि बाइबिलीय निकट एकवचन रूप ‘तुझे’ का प्रयोग; भाषा सरल, गंभीर और सामान्य पाठकों के लिए सुबोध रखी गई है।
