  yaml_path: translation/ot/job/040/019.yaml
  text: He is the first of the works of God[b][a]; only his Maker can bring near his sword.
translation:
  language: hi
  text: वह परमेश्वर के कामों में प्रथम है[a]; केवल उसका रचनेवाला ही उसकी तलवार उसके निकट ला सकता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह परमेश्वर के मार्गों में प्रधान है।”
    reason: lexical_alternative
  - marker: b
    text: अंतिम उपवाक्य का इब्रानी पाठ कठिन है। इसका अर्थ यह भी हो सकता है, “केवल उसका रचनेवाला ही तलवार लेकर उसके पास जा सकता है,” या “उसके रचनेवाले ने उसे उसकी तलवार दी है।”
    reason: alternative_reading
lexical_decisions:
- source_word: רֵאשִׁית
  choice: प्रथम
  rationale: यह शब्द आरम्भ या प्रधानता, दोनों का बोध करा सकता है। प्रसंग में परमेश्वर के प्राणियों के बीच उसका अग्रस्थान प्रमुख है; ‘प्रथम’ इस संक्षिप्तता और संभावित द्व्यर्थता को बनाए रखता है।
- source_word: דַּרְכֵי אֵל
  choice: परमेश्वर के कामों में
  rationale: दֶּרֶךְ का अर्थ ‘मार्ग’ के साथ-साथ कार्य या गतिविधि भी हो सकता है। सृष्टि के इस प्रसंग में ‘कामों’ से परमेश्वर के सृजन-कार्य का अर्थ सहज रूप से व्यक्त होता है।
- source_word: אֵל
  choice: परमेश्वर
  rationale: यहाँ אֵל परमेश्वर के लिए सामान्य उपाधि है; आधुनिक मानक हिन्दी में ‘परमेश्वर’ स्वाभाविक और गरिमापूर्ण है।
- source_word: הָעֹשׂוֹ
  choice: उसका रचनेवाला
  rationale: सव्यय कृदन्त का शाब्दिक अर्थ ‘उसे बनानेवाला’ है। ‘उसका रचनेवाला’ हिन्दी में संक्षिप्त है और सृष्टिकर्ता का सम्बन्ध स्पष्ट करता है।
- source_word: יַגֵּשׁ
  choice: निकट ला सकता है
  rationale: नגשׁ के हिफ़ील रूप का सामान्य अर्थ ‘निकट लाना’ है। सामर्थ्यसूचक ‘सकता है’ को ‘केवल’ के साथ रखकर उस प्रचलित अर्थ को व्यक्त किया गया है कि रचनेवाला ही उसके सामने हथियार ला सकता है, जबकि कठिन इब्रानी का वैकल्पिक अर्थ टिप्पणी में सुरक्षित है।
- source_word: חַרְבּוֹ
  choice: अपनी तलवार
  rationale: पुल्लिंग एकवचन प्रत्यय का निकटतम कर्ता ‘उसका रचनेवाला’ है, इसलिए हिन्दी का निजवाचक ‘अपनी’ स्वाभाविक है। मूल वाक्यांश की अन्य सम्भावित व्याख्याएँ टिप्पणी में दी गई हैं।
theological_decisions:
- issue: कठिन अंतिम उपवाक्य की व्याख्या
  choice: केवल उसका रचनेवाला ही अपनी तलवार उसके निकट ला सकता है
  alternative: उसका रचनेवाला उसे उसकी तलवार देता है / केवल उसका रचनेवाला ही तलवार लेकर उसके पास जा सकता है
  rationale: इब्रानी वाक्य अत्यन्त संक्षिप्त और व्याकरण की दृष्टि से कठिन है। मुख्य पाठ में एक स्वाभाविक सम्भावित अर्थ दिया गया है, पर टिप्पणी वैकल्पिक पाठों को स्पष्ट रूप से सुरक्षित रखती है और किसी विशेष धर्मसैद्धान्तिक निष्कर्ष को नहीं थोपती।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किन्तु गरिमापूर्ण शैली। ‘प्रथम’ और ‘कामों’ सामान्य पाठक के लिए सहज हैं; कठिन अंतिम उपवाक्य की वास्तविक अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
