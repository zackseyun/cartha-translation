  verdict: revise
  source_fidelity: The draft accurately conveys the interrogative emphasis, the nullifying force of תפר, and the forensic contrast between declaring God guilty and being vindicated. However, ‘निर्दोष ठहरो’ is narrower than תִּצְדָּק, which means ‘be justified/vindicated/be shown right’; it can imply a verdict of innocence but does not specifically assert moral blamelessness. ‘सही ठहरो’ preserves the judicial sense more faithfully without adding that nuance.
  naturalness: The Hindi is clear, modern, and appropriately grave. ‘क्या तुम ... भी’ and ‘रद्द कर दोगे’ are natural. ‘क्या तुम मुझे दोषी ठहराओगे, ताकि तुम स्वयं सही ठहरो?’ is idiomatic and retains the parallel legal rhetoric.
  terminology: ‘न्याय,’ ‘दोषी ठहराना,’ and ‘सही ठहरना’ maintain the legal register. The footnote’s alternatives should distinguish ‘न्याय,’ ‘निर्णय,’ and ‘वैध अधिकार’ without incorrectly treating the possessive form as a separate lexical item.
  issues:
