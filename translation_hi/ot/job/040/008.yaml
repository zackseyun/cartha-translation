    issue: ‘निर्दोष ठहरो’ over-specifies תִּצְדָּק.
    rationale: In this forensic context צדק denotes being justified, vindicated, or shown to be in the right. ‘निर्दोष’ can be acceptable in some legal contexts but introduces a more specific innocence/blamelessness nuance than the Hebrew requires. ‘सही ठहरो’ better preserves the intended contrast and ambiguity.
