lexical_decisions:
- source_word: הַאַף
  choice: क्या तुम ... भी
  rationale: प्रश्नवाचक הֲ और बलवाचक אַף का मेल आश्चर्य और तीखी चुनौती व्यक्त करता है; हिन्दी में ‘क्या तुम ... भी’ इसे स्वाभाविक रूप से प्रकट करता है।
- source_word: תָּפֵר
  choice: रद्द कर दोगे
  rationale: פרר के हिफ़ील रूप का अर्थ निष्प्रभावी या अमान्य करना है। न्यायिक संदर्भ में ‘रद्द करना’ स्पष्ट और स्वाभाविक है।
- source_word: מִשְׁפָּטִי
  choice: मेरे न्याय
  rationale: מִשְׁפָּט यहाँ न्याय, न्यायिक निर्णय या वैध अधिकार का बोध करा सकता है। ‘मेरे न्याय’ परमेश्वर की न्यायशीलता और न्यायपूर्ण शासन के व्यापक आशय को बनाए रखता है; ‘मेरे निर्णय’ को पाद-टिप्पणी में रखा गया है।
- source_word: תַּרְשִׁיעֵנִי
  choice: मुझे दोषी ठहराओगे
  rationale: רשע के हिफ़ील का न्यायिक अर्थ किसी को दोषी घोषित करना है। यह चयन मूल के अदालती स्वर को स्पष्ट रखता है।
- source_word: לְמַעַן
  choice: ताकि
  rationale: यह उद्देश्य अथवा अभिप्रेत परिणाम व्यक्त करता है; ‘ताकि’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: תִּצְדָּק
  choice: तुम स्वयं निर्दोष ठहरो
  rationale: צדק का काल रूप इस न्यायिक विरोध में सही या निर्दोष ठहरने का भाव देता है। ‘ठहरो’ को ‘दोषी ठहराओगे’ के समानांतर रखकर मूल की न्यायिक शब्द-क्रीड़ा सुरक्षित की गई है; ‘स्वयं’ आत्म-पक्षसमर्थन का निहित विरोध उभारता है।
theological_decisions:
- issue: न्यायिक बनाम सामान्य नैतिक भाषा
  choice: ‘न्याय ... दोषी ठहराओगे ... निर्दोष ठहरो’ के द्वारा न्यायालय-संबंधी भाषा बनाए रखी गई है।
  alternative: ‘मेरी धार्मिकता को गलत ठहराओगे ... मुझे गलत बनाओगे ताकि तुम सही बनो।’
  rationale: מִשְׁפָּט, רשע और צדק तीनों में यहाँ प्रबल न्यायिक अर्थ है। यह भाषा अय्यूब द्वारा परमेश्वर के न्याय पर उठाए गए प्रश्न की धर्मवैचारिक तीव्रता को कम नहीं करती।
- issue: מִשְׁפָּטִי का अर्थ
  choice: मेरे न्याय
  alternative: मेरे निर्णय
  rationale: संदर्भ परमेश्वर के किसी एक निर्णय से आगे उसके न्यायपूर्ण शासन और न्यायशीलता को भी छूता है। फिर भी ‘मेरे निर्णय’ वास्तविक शाब्दिक संभावना है, इसलिए उसे पाद-टिप्पणी में सुरक्षित रखा गया है।
- issue: תִּצְדָּק में न्यायिक स्थिति
  choice: तुम स्वयं निर्दोष ठहरो
  alternative: तुम सही ठहरो
  rationale: ‘निर्दोष ठहरो’ रשע के ‘दोषी ठहराना’ के साथ न्यायिक विरोध को अधिक स्पष्ट करता है, पर इसे नैतिक निष्पापता का कोई व्यापक सिद्धान्त नहीं बनाया गया है।
