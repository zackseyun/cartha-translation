  yaml_path: translation/ot/job/040/028.yaml
  text: Will he make a covenant with you[b][a], that you would take him as a servant forever?
translation:
  language: hi
  text: क्या वह तेरे साथ वाचा बाँधेगा[a]? क्या तू उसे सदा के लिए अपना दास रखेगा[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘तेरे साथ वाचा काटेगा’; यह ‘वाचा बाँधने’ का मानक मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी शब्द का अर्थ ‘सेवक’ या ‘दास’ दोनों हो सकता है; यहाँ ‘सदा के लिए’ स्थायी बँधुआ स्थिति पर बल देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיִכְרֹת בְּרִית
  choice: क्या वह…वाचा बाँधेगा
  rationale: כרת ברית का शाब्दिक रूप ‘वाचा काटना’ है, पर यह वाचा स्थापित करने का मानक इब्रानी मुहावरा है। ‘वाचा बाँधना’ हिन्दी में स्वाभाविक है और औपचारिक संबंध का भाव बनाए रखता है; הֲ को प्रश्नवाचक ‘क्या’ से व्यक्त किया गया है।
- source_word: עִמָּךְ
  choice: तेरे साथ
  rationale: यह अय्यूब को किए गए एकवचन संबोधन को बनाए रखता है और इस काव्यात्मक, गरिमापूर्ण प्रसंग में स्वाभाविक है।
- source_word: תִּקָּחֶנּוּ
  choice: क्या तू उसे…बना लेगा
  rationale: לקח का मूल अर्थ ‘लेना’ है; לְעֶבֶד के साथ हिन्दी में ‘दास बना लेना’ अधिक स्वाभाविक ढंग से किसी को उस हैसियत में लेने का अर्थ व्यक्त करता है। तीसरे पुरुष एकवचन प्रत्यय को ‘उसे’ से व्यक्त किया गया है।
- source_word: לְעֶבֶד
  choice: दास
  rationale: עֶבֶד का अर्थ ‘सेवक’ या बँधा हुआ ‘दास’ हो सकता है। עוֹלָם के साथ स्थायी अधीनता प्रमुख होने के कारण ‘दास’ चुना गया है।
- source_word: עוֹלָם
  choice: सदा के लिए
  rationale: यह दीर्घकालिक अथवा स्थायी अवधि का अर्थ स्पष्ट, स्वाभाविक हिन्दी में देता है।
theological_decisions:
- issue: दो उपवाक्यों का संबंध
  choice: दो क्रमिक प्रश्न
  alternative: ‘कि तू उसे…’ के द्वारा एक संयुक्त प्रश्न
  rationale: עִמָּךְ पर प्रमुख मासोरेटिक विराम है और दूसरा उपवाक्य अपने आप में अगला आलंकारिक प्रश्न स्वाभाविक रूप से बनता है। इब्रानी में स्पष्ट उद्देश्य-सूचक संयोजक नहीं है, इसलिए उसे जोड़कर संबंध को अनावश्यक रूप से निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और आलंकारिक प्रश्नों की काव्यात्मक शक्ति बनाए रखी गई है। अय्यूब के लिए एकवचन ‘तू/तेरे’ संबोधन रखा गया है।
