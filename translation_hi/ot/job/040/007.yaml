source:
  edition: WLC
  text: אֱזָר נָ֣א כְ/גֶ֣בֶר חֲלָצֶ֑י/ךָ אֶ֝שְׁאָלְ/ךָ֗ וְ/הוֹדִיעֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/007.yaml
  text: Gird up your loins like a man; I will question you[a], and you shall make it known to me.
translation:
  language: hi
  text: पुरुष के समान अपनी कमर कस ले[a]; मैं तुझसे प्रश्न करूँगा, और तू मुझे बता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बलवान पुरुष के समान तैयार हो जा।” इब्रानी में शाब्दिक रूप से, “पुरुष के समान अपनी कमर कस ले।”
    reason: ‘कमर कसना’ तैयारी का इब्रानी मुहावरा है, और גֶּבֶר में पुरुष के साथ सामर्थ्य का भाव भी हो सकता है।
lexical_decisions:
- source_word: אֱזָר נָא
  choice: कस ले
  rationale: आज्ञार्थक क्रिया אזר कमर पर वस्त्र या पट्टा कसकर तैयारी करने का ठोस बिंब देती है। हिंदी मुहावरा ‘कमर कसना’ उसी तैयारी और चुनौती के भाव को स्वाभाविक रूप से व्यक्त करता है। נָא आग्रह या बल देने वाला अव्यय है; अलग से ‘अब’ जोड़ने पर अनावश्यक काल-सूचक अर्थ आ सकता है।
- source_word: כְגֶבֶר
  choice: पुरुष के समान
  rationale: גֶּבֶר पुरुष को दर्शाता है और प्रसंग में सामर्थ्य तथा दृढ़ता का भाव भी रखता है। ‘पुरुष के समान’ मूल के लिंग-सूचक और तुलनात्मक रूप को बनाए रखता है; ‘योद्धा’ संभव भावार्थ है, पर शब्द का अनिवार्य अर्थ नहीं।
- source_word: חֲלָצֶיךָ
  choice: अपनी कमर
  rationale: חֲלָצַיִם कमर या कटि-प्रदेश को दर्शाता है। हिंदी में ‘अपनी कमर कस ले’ स्पष्ट, सजीव और प्रचलित अभिव्यक्ति है; ‘कटि’ सामान्य पाठक के लिए अनावश्यक रूप से साहित्यिक है।
- source_word: אֶשְׁאָלְךָ
  choice: मैं तुझसे प्रश्न करूँगा
  rationale: שׁאל का मूल अर्थ पूछना है। यहाँ परमेश्वर की चुनौती और जाँचने वाले प्रश्नों के प्रसंग में ‘प्रश्न करूँगा’ साधारण ‘पूछूँगा’ से अधिक उपयुक्त बल रखता है, बिना न्यायालय का अतिरिक्त अर्थ जोड़े।
- source_word: וְהוֹדִיעֵנִי
  choice: और तू मुझे बता
  rationale: ידע के हिफ़ील रूप का अर्थ ‘जानने देना, सूचित करना’ है। ‘मुझे बता’ हिंदी में स्वाभाविक रूप से कारणवाचक भाव को व्यक्त करता है और केवल व्याख्यात्मक ‘उत्तर दे’ कहने की अपेक्षा मूल क्रिया के निकट रहता है।
theological_decisions:
- issue: גֶבֶר में पुरुषवाचक भाषा
  choice: पुरुष के समान
  alternative: योद्धा के समान / बलवान मनुष्य के समान
  rationale: वचन सीधे अय्यूब को संबोधित करता है और स्रोत में पुरुषवाचक एकवचन संज्ञा है। ‘पुरुष’ इस रूप को सुरक्षित रखता है, जबकि सामर्थ्य का निहित भाव संदर्भ और पादटिप्पणी में खुला रहता है।
- issue: परमेश्वर के प्रश्न और अय्यूब की अपेक्षित प्रतिक्रिया
  choice: मैं तुझसे प्रश्न करूँगा, और तू मुझे बता
  alternative: मैं तुझसे पूछूँगा, और तू मुझे उत्तर दे
  rationale: यह रूप मूल के שאל और ידע हिफ़ील के बीच का भेद बनाए रखता है। ‘उत्तर दे’ प्रसंगानुकूल है, पर स्रोत के ‘मुझे जानने दे/बता’ को कुछ अधिक व्याख्यात्मक ढंग से सीमित कर देता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली रखी गई है। परमेश्वर द्वारा अय्यूब को एकवचन निकट संबोधन के अनुरूप ‘तू/तुझसे’ का प्रयोग हुआ है। अर्धविराम दोनों जुड़े हुए आदेशात्मक खंडों के बीच स्रोत की संरचना को स्पष्ट करता है।
