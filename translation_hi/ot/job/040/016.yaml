  text: Look now[a], his strength is in his loins[b], and his power in the muscles of his belly.
translation:
  language: hi
  text: देखो, उसकी ताकत उसकी कमर में है, और उसका बल उसके पेट की मांसपेशियों में है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: देख
  rationale: यह पदबंध ध्यान खींचने और सामने की बात पर गौर करने का आग्रह करता है। आधुनिक हिन्दी में ‘देख’ इसकी तात्कालिकता को स्वाभाविक और संक्षिप्त रूप से व्यक्त करता है।
- source_word: כֹחוֹ
  choice: उसकी ताकत
  rationale: כֹחַ यहाँ प्राणी की शारीरिक शक्ति बताता है। ‘ताकत’ सामान्य आधुनिक हिन्दी में स्पष्ट और ठोस है।
- source_word: בְמָתְנָיו
  choice: उसकी कमर में
  rationale: מָתְנַיִם कमर तथा कूल्हों के आसपास के भाग को सूचित करता है। ‘कमर’ आधुनिक हिन्दी में सहज है और संदर्भ के लिए पर्याप्त व्यापक है।
- source_word: וְאֹנוֹ
  choice: और उसका बल
  rationale: אוֹן शक्ति या सामर्थ्य का द्योतक है। समानांतर כֹחַ के साथ ‘बल’ अर्थगत निकटता बनाए रखते हुए हिन्दी में स्वाभाविक काव्यात्मक विविधता देता है।
- source_word: בִּשְׁרִירֵי
  choice: मांसपेशियों में
  rationale: שְׁרִירִים दृढ़ मांसल भागों, मांसपेशियों या स्नायुओं को सूचित कर सकता है। यहाँ ‘मांसपेशियाँ’ सबसे स्पष्ट आधुनिक शारीरिक अभिव्यक्ति है।
- source_word: בִטְנוֹ
  choice: उसके पेट की
  rationale: בֶּטֶן इस शारीरिक वर्णन में पेट या उदर को सूचित करता है। ‘पेट’ साधारण पाठक के लिए सबसे सहज है।
