  choice: 'परिणामसूचक कथन: ‘फिर ऐसा नहीं करेगा’'
  alternative: ‘फिर ऐसा मत करना’
  rationale: पूर्ववर्ती चुनौती और युद्ध की स्मृति के संदर्भ में यह अधिक स्वाभाविक रूप से परिणाम या निश्चित चेतावनी बताता है; फिर भी मूल की संक्षिप्तता और निहित कर्म सुरक्षित हैं।
translation_notes:
  register: आधुनिक, संक्षिप्त और गरिमापूर्ण हिन्दी। ‘रखकर तो देख’ चुनौतीपूर्ण स्वर को स्वाभाविक बनाता है; ‘ऐसा’ पिछले कार्य—उस पर हाथ रखने—की ओर संकेत करता है।
