    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂים
  choice: रखकर तो देख
  rationale: आज्ञार्थक क्रिया का सीधा अर्थ ‘रख’ है; ‘तो देख’ प्रसंग में चुनौती और उसके चेतावनीपूर्ण स्वर को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עָלָיו
  choice: उस पर
  rationale: עַל के तृतीय पुरुष पुल्लिंग एकवचन प्रत्यय का सीधा और स्वाभाविक अनुवाद।
- source_word: כַּפֶּךָ
  choice: अपना हाथ
  rationale: כַּף का शाब्दिक अर्थ हथेली भी हो सकता है, पर इस प्रसंग और हिन्दी मुहावरे में ‘हाथ’ अधिक स्वाभाविक है।
- source_word: זְכֹר
  choice: याद रख
  rationale: आज्ञार्थक रूप की प्रत्यक्षता बनाए रखता है और आधुनिक हिन्दी में चेतावनी के रूप में सहज है।
- source_word: מִלְחָמָה
  choice: युद्ध
  rationale: शब्द युद्ध या लड़ाई को सूचित करता है; ‘युद्ध’ मूल की गंभीरता और संघर्ष की तीव्रता बनाए रखता है।
- source_word: אַל תּוֹסַף
  choice: फिर ऐसा नहीं करेगा
  rationale: शाब्दिक रूप से ‘और मत जोड़’ है, पर यहाँ मुहावरे का अर्थ उस प्रयास को दोबारा न करना है। कथन को परिणामसूचक चेतावनी के रूप में रखा गया है, जबकि निहित कर्म ‘ऐसा’ से प्रसंगानुसार व्यक्त होता है।
theological_decisions:
