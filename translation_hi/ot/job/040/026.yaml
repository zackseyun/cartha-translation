  text: क्या तुम उसकी नाक में रस्सी[a] डाल सकते हो, या काँटे से उसका जबड़ा[b] बेध सकते हो?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी नाक में सरकंडा”; इब्रानी शब्द का शाब्दिक अर्थ सरकंडा या नरकट है, पर यहाँ संभवतः उससे बनी रस्सी अभिप्रेत है।
    reason: lexical_alternative
  - marker: b
    text: या, “उसका गाल।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתָשִׂים
  choice: क्या तुम ... डाल सकते हो
  rationale: प्रश्नवाचक הֲ और अपूर्ण क्रिया यहाँ अय्यूब की सामर्थ्य को चुनौती देने वाला आलंकारिक प्रश्न बनाते हैं; आधुनिक हिन्दी में ‘क्या तुम ... सकते हो’ इसका स्वाभाविक रूप है।
- source_word: אַגְמוֹן
  choice: रस्सी
  rationale: शब्द का मूल अर्थ सरकंडा या नरकट है, पर इस प्रसंग में नाक में डाली जाने वाली, संभवतः सरकंडे से बनी रस्सी अभिप्रेत है; मुख्य पाठ में कार्यगत अर्थ रखा गया है और शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: בְּאַפּוֹ
  choice: उसकी नाक में
  rationale: אַף का अर्थ नाक या नथुना हो सकता है। हिन्दी में रस्सी डालने के इस चित्र के लिए ‘नाक में’ स्पष्ट और स्वाभाविक है।
- source_word: וּבְחוֹחַ
  choice: काँटे से
  rationale: חוֹחַ काँटे अथवा काँटे जैसे अंकुश को सूचित कर सकता है। ‘काँटा’ मूल रूपक को बनाए रखते हुए पशु को वश में करने के उपकरण का चित्र देता है।
- source_word: תִּקּוֹב
  choice: बेध सकते हो
  rationale: क्रिया का अर्थ छेदना या आर-पार करना है; ‘बेधना’ संक्षिप्त, सजीव और गरिमापूर्ण हिन्दी है।
- source_word: לֶחֱיוֹ
  choice: उसका जबड़ा
  rationale: לְחִי का अर्थ गाल या जबड़ा दोनों हो सकता है। पशु को काँटे से नियंत्रित करने के प्रसंग में ‘जबड़ा’ अधिक सटीक है, जबकि ‘गाल’ को पादटिप्पणी में सुरक्षित रखा गया है।
