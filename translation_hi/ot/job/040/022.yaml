lexical_decisions:
- source_word: יְסֻכֻּהוּ
  choice: उसे ढक लेते हैं
  rationale: סכך का मूल भाव ढकना या आश्रय देना है। यहाँ छाया के साथ ‘ढक लेते हैं’ सीधा, स्वाभाविक और काव्यात्मक है।
- source_word: צֶאֱלִים
  choice: कमल-वृक्ष
  rationale: इस दुर्लभ वनस्पति-नाम की सटीक पहचान अनिश्चित है; पारंपरिक ‘कमल-वृक्ष’ को मुख्य पाठ में रखा गया है और अनिश्चितता पाद-टिप्पणी में बताई गई है।
- source_word: צִלֲלוֹ
  choice: अपनी छाया से
  rationale: צֵל का अर्थ ‘छाया’ है। क्रिया ‘ढकना’ के साथ ‘अपनी छाया से’ आधुनिक हिन्दी में सहज है।
- source_word: יְסֻבּוּהוּ
  choice: उसे चारों ओर से घेर लेते हैं
  rationale: סבב का अर्थ घेरना या चारों ओर होना है; यह पदबंध उस स्थानिक चित्र को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: עַרְבֵי נָחַל
  choice: नाले के बेंत
  rationale: עַרְבֵי जलधारा के किनारे उगने वाले बेंत, विलो या पॉपलर जैसे वृक्षों का संकेत दे सकता है, और נחל नाला, जलधारा या मौसमी नदी-घाटी हो सकता है। हिन्दी बाइबलीय प्रयोग में ‘नाले के बेंत’ सुबोध है; विकल्प पाद-टिप्पणी में सुरक्षित है।
