  register: भाषा आधुनिक, गरिमापूर्ण और सहज रखी गई है। ‘उपज देते हैं’ मूल के कृषि-संबंधी बिंब को बचाता है, जबकि पद का आशय सामान्य पाठक के लिए स्पष्ट रहता है।
