source:
  edition: WLC
  text: כִּֽי ב֭וּל הָרִ֣ים יִשְׂאוּ ל֑/וֹ וְֽ/כָל חַיַּ֥ת הַ֝/שָּׂדֶ֗ה יְשַֽׂחֲקוּ שָֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/020.yaml
  text: For the mountains bear food for him[b][a], and all the wild animals of the field play there.
translation:
  language: hi
  text: क्योंकि पहाड़ उसके लिए उपज देते हैं,[a] और मैदान के सभी जंगली पशु[b] वहाँ खेलते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पहाड़ उसके लिए भोजन उपजाते हैं।”
    reason: lexical_alternative
  - marker: b
    text: 'परंपरागत अनुवाद: “मैदान के सब पशु।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह अव्यय पिछली बात का कारण या स्पष्टीकरण प्रस्तुत करता है; इसलिए ‘क्योंकि’ उसके संबंधसूचक बल को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: בּוּל
  choice: उपज
  rationale: यह शब्द भूमि की पैदावार या उत्पादन को दर्शाता है। ‘उपज’ मूल बिंब को बनाए रखता है और यह भी स्पष्ट करता है कि पहाड़ उस प्राणी के भोजन का स्रोत हैं।
- source_word: הָרִים
  choice: पहाड़
  rationale: बहुवचन संज्ञा का सीधा और आधुनिक हिंदी रूप ‘पहाड़’ है।
- source_word: יִשְׂאוּ לוֹ
  choice: उसके लिए ... देते हैं
  rationale: नשא का मूल भाव ‘उठाना/ढोना’ है, पर בּוּל के साथ यहाँ अर्थ उपज प्रदान करने का है। ‘उपज देते हैं’ हिंदी में स्वाभाविक रहते हुए इस आशय को व्यक्त करता है।
- source_word: וְכָל חַיַּת הַשָּׂדֶה
  choice: और मैदान के सभी जंगली पशु
  rationale: यह पदबंध खुले भूभाग में रहने वाले वन्य पशुओं का सामूहिक उल्लेख करता है। ‘जंगली पशु’ आधुनिक और स्पष्ट है, जबकि ‘मैदान के’ संबंधवाचक संरचना को बनाए रखता है।
- source_word: יְשַׂחֲקוּ
  choice: खेलते हैं
  rationale: पिएल रूप यहाँ खेल-कूद या स्वच्छंद चंचलता को व्यक्त करता है; ‘खेलते हैं’ सरल और सटीक आधुनिक हिंदी है।
- source_word: שָׁם
  choice: वहाँ
  rationale: यह सीधा स्थानवाचक अव्यय है, जो उसी पहाड़ी या खुले क्षेत्र की ओर संकेत करता है।
theological_decisions: []
