lexical_decisions:
- source_word: וַיַּעַן
  choice: तब ... उत्तर दिया
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; आधुनिक हिन्दी में “तब” घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है, और ענה यहाँ उत्तर देने के अर्थ में है।
- source_word: יְהוָה
  choice: यहवे
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत नाम יהוה का हिन्दी लिप्यंतरण किया गया है, किसी उपाधि से उसका स्थान नहीं लिया गया।
- source_word: אֶת אִיּוֹב
  choice: अय्यूब को
  rationale: אֵת अय्यूब को क्रिया का कर्म चिह्नित करता है; हिन्दी में “अय्यूब को उत्तर दिया” स्वाभाविक प्रयोग है।
- source_word: מִן סְעָרָה
  choice: आँधी में से
  rationale: סְעָרָה प्रचंड तूफ़ान, आँधी या बवंडर का बोध करा सकता है। “आँधी” प्राकृतिक और धर्मप्रकाशकीय दृश्य को स्पष्ट रखती है, जबकि अधिक विशिष्ट विकल्प पादटिप्पणी में दिया गया है।
- source_word: וַיֹּאמַר
  choice: 'और कहा:'
  rationale: यह आगे आने वाले प्रत्यक्ष कथन का मानक कथात्मक परिचय है; द्विबिंदु अगले पद में आरम्भ होने वाले वचन का संकेत देता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: यहाँ मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे प्रयुक्त है। उसका लिप्यंतरण नाम और उपाधि के बीच का भेद सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। “अय्यूब” स्थापित हिन्दी बाइबलीय नामरूप है; “आँधी में से” सामान्य पाठक के लिए स्पष्ट है और वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
