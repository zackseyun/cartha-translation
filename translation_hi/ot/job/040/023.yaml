translation:
  language: hi
  text: देखो, यदि नदी उफनती भी है, तो वह नहीं घबराता; चाहे यरदन उसके मुँह तक उमड़ आए, तब भी वह निश्चिंत रहता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַעֲשֹׁק נָהָר
  choice: नदी उफनती भी है
  rationale: יַעֲשֹׁק का मूल अर्थ दबाना या प्रचंडता से टूट पड़ना है; नदी के संदर्भ में यह उसके उफान और प्रबल वेग को व्यक्त करता है।
- source_word: לֹא יַחְפּוֹז
  choice: वह नहीं घबराता
  rationale: क्रिया जल्दबाजी या व्याकुलता में पड़ने का भाव देती है; यहाँ प्राणी का भयभीत न होना अभिप्रेत है।
- source_word: יִבְטַח
  choice: वह निश्चिंत रहता है
  rationale: इसका अर्थ भरोसा रखना या सुरक्षित अनुभव करना है; संदर्भ में उफनती धारा के सामने उसकी निर्भीक निश्चिंतता व्यक्त होती है।
- source_word: יָגִיחַ יַרְדֵּן אֶל־פִּיהוּ
  choice: यरदन उसके मुँह तक उमड़ आए
  rationale: יָגִיחַ के फूट पड़ने या उमड़ने के भाव और אֶל־פִּיהוּ की दिशा को स्वाभाविक हिन्दी में रखा गया है; 'तक' निकट आने का अर्थ देता है, भीतर प्रवेश का नहीं।
