base_translation:
  language: en
  yaml_path: translation/ot/job/040/024.yaml
  text: Can one capture him before his eyes? Can one pierce his nose with snares?[a][b]
translation:
  language: hi
  text: क्या कोई उसे उसकी आँखों के सामने पकड़ सकता है? क्या कोई फंदों से उसकी नाक छेद सकता है?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या वह उसे उसकी आँखों के सामने पकड़ लेगा? क्या वह फंदों से उसकी नाक छेद देगा?” इब्रानी बहुत संक्षिप्त और कठिन है; कुछ अनुवाद इन क्रियाओं को सामान्य सामर्थ्यसूचक प्रश्नों के बजाय अधिक सीधे भविष्यकालीन कथन के रूप में समझते हैं।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक अर्थ “फंदों से” है। कुछ परंपरागत अनुवाद यहाँ “काँटों” जैसा बिंब देते हैं, पर इब्रानी संज्ञा का सामान्य अर्थ फंदे या जाल हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֵינָיו
  choice: उसकी आँखों के सामने
  rationale: यहाँ בְּ के साथ ‘आँखें’ संभवतः प्राणी के देखते हुए, खुले तौर पर उसके सामने कार्य करने का भाव देता है; यह हिन्दी में स्वाभाविक भी है और सर्वनाम की मूल अस्पष्टता को अनावश्यक रूप से नहीं बढ़ाता।
- source_word: יִקָּחֶנּוּ
  choice: क्या कोई ... उसे पकड़ सकता है?
  rationale: לקח का मूल अर्थ ‘लेना’ है, पर शिकार के प्रसंग में ‘पकड़ना’ उपयुक्त है। सामर्थ्यसूचक प्रश्न आसपास के ईश्वरीय चुनौती-प्रसंग के अनुरूप है, जबकि वैकल्पिक क्रिया-विन्यास को पादटिप्पणी में रखा गया है।
- source_word: בְּמוֹקְשִׁים
  choice: फंदों से
  rationale: מוֹקֵשׁ सामान्यतः फंदा या जाल है, ‘अंकुश/काँटा’ नहीं। यद्यपि नाक छेदने के साथ यह बिंब कठिन है, मूल शब्द की कठिनता और तनाव को बनाए रखा गया है।
- source_word: יִנְקָב
  choice: छेद सकता है
  rationale: נקב का अर्थ छेदना या आर-पार करना है। ‘छेदना’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: אָף
  choice: नाक
  rationale: इस शारीरिक प्रसंग में אַף का अर्थ ‘नाक’ है; ‘क्रोध’ संभव नहीं और ‘नथुना’ मूल से अधिक संकीर्ण होगा।
