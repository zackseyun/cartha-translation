lexical_decisions:
- source_word: וַיַּעַן
  choice: उत्तर दिया
  rationale: ענה का क़ाल वय्यिक्तोल रूप अय्यूब के प्रत्युत्तर का परिचय देता है; ‘उत्तर दिया’ स्वाभाविक और स्रोत के अनुरूप है।
- source_word: אִיּוֹב
  choice: अय्यूब
  rationale: हिन्दी बाइबलीय परंपरा में प्रचलित व्यक्तिनाम।
- source_word: אֶת
  choice: अलग से अनूदित नहीं
  rationale: यह निश्चित कर्म-सूचक चिह्न है; हिन्दी में इसका कार्य वाक्य-संरचना और ‘को’ से व्यक्त होता है।
- source_word: יְהוָה
  choice: यहवे
  rationale: चतुरक्षरीय व्यक्तिगत ईश्वरीय नाम का हिन्दी लिप्यंतरण; इसे उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: וַיֹּאמַר
  choice: और कहा
  rationale: אמר के क़ाल वय्यिक्तोल को अलग क्रिया के रूप में रखकर इब्रानी की पारंपरिक ‘उत्तर दिया और कहा’ वाणी-परिचय संरचना सुरक्षित की गई है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा
  rationale: मूल पाठ में व्यक्तिगत नाम YHWH है। ‘यहवे’ संभावित उच्चारण का व्यापक विद्वतापरक लिप्यंतरण है; पादटिप्पणी ‘यहोवा’ और अक्षरात्मक रूप ‘यHWH’ की जानकारी देती है।
