  text: He makes his tail stiff like a cedar[a]; the sinews of his thighs are knit together.
translation:
  language: hi
  text: वह अपनी पूँछ को देवदार की तरह तानता है; उसकी जाँघों[a] के स्नायु आपस में गुँथे हुए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसकी कटि के स्नायु”; और अधिक विशिष्ट अर्थ में, “उसके जननांगों के स्नायु अथवा मांसपेशियाँ।” यहाँ प्रयुक्त इब्रानी शब्द का अर्थ अनिश्चित और विवादित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְפֹּץ
  choice: कड़ा करता है
  rationale: यहाँ क्रिया पूँछ की शारीरिक गति या दशा बताती है। देवदार से तुलना के संदर्भ में “कड़ा करता है” दृढ़ता का चित्र स्वाभाविक रूप से व्यक्त करता है, यद्यपि “मोड़ता है” जैसे अर्थ भी प्रस्तावित हैं।
- source_word: זְנָבוֹ
  choice: अपनी पूँछ
  rationale: संज्ञा और तृतीय पुरुष एकवचन पुल्लिंग प्रत्यय का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: כְמוֹ אָרֶז
  choice: देवदार के समान
  rationale: मूल उपमा को बनाए रखते हुए देवदार की दृढ़ता और विशालता का काव्यात्मक बिंब सुरक्षित रखा गया है।
- source_word: גִּידֵי
  choice: नसें
  rationale: גיד का अर्थ स्नायु या कण्डरा है। सामान्य पाठक के लिए “नसें” अधिक सहज है और यहाँ शरीर के मजबूत, तने हुए तंतुओं का बोध कराता है।
- source_word: פחדו
  choice: उसकी जाँघों की
  rationale: यह दुर्लभ और विवादित शब्द शरीर के इस अंग के संदर्भ में जाँघों, कटि-प्रदेश अथवा अधिक विशिष्ट रूप से जननांगों के लिए समझा गया है। मुख्य पाठ में स्पष्ट और गरिमापूर्ण “जाँघों” रखा गया है, और अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: יְשֹׂרָגוּ
  choice: आपस में गुँथी हुई हैं
  rationale: क्रिया तंतुओं के परस्पर गुँथे या बुने होने का चित्र देती है; यह हिन्दी में स्वाभाविक और काव्यात्मक है।
