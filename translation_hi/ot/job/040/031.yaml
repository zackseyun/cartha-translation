base_translation:
  language: en
  yaml_path: translation/ot/job/040/031.yaml
  text: Can you fill his hide with harpoons[b][a], or his head with fishing spears?
translation:
  language: hi
  text: क्या तू उसकी खाल को काँटेदार बरछों[a] से और उसके सिर को मछली मारने के भालों[b] से भर सकता है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘नुकीले हथियारों’; यहाँ प्रयुक्त इब्रानी शब्द दुर्लभ है और सामान्य रूप से नुकीले या काँटेदार शिकार-अस्त्रों का बोध करा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘मछली पकड़ने के काँटों’; इब्रानी पद मछली पकड़ने के किसी उपकरण का बोध करा सकता है, पर ठीक किस प्रकार का उपकरण था, यह निश्चित नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתְמַלֵּא
  choice: क्या तू ... भर सकता है
  rationale: प्रश्नवाचक कण और מלא के पिएल अपूर्ण रूप से चुनौतीपूर्ण आलंकारिक प्रश्न बनता है। ‘भर सकता है’ मूल क्रिया और निहित असमर्थता, दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: בְשֻׂכּוֹת
  choice: काँटेदार बरछों से
  rationale: यह दुर्लभ संज्ञा नुकीले या काँटेदार शिकार-अस्त्रों की ओर संकेत करती है। ‘काँटेदार बरछे’ बड़े जीव की खाल को अनेक हथियारों से बेधने का ठोस चित्र सुरक्षित रखता है।
- source_word: עוֹרוֹ
  choice: उसकी खाल
  rationale: बड़े जीव के עוֹר के लिए ‘खाल’ आधुनिक हिन्दी में स्वाभाविक और चित्रात्मक है।
- source_word: וּבְצִלְצַל דָּגִים
  choice: मछली मारने के भालों से
  rationale: शाब्दिक रूप से यह मछलियों से जुड़ा कोई बेधने या पकड़ने का उपकरण है। ‘मछली मारने के भाले’ पहले खंड के अस्त्र-संबंधी समानांतर बिंब को बनाए रखता है, जबकि शब्द की अनिश्चितता पादटिप्पणी में दी गई है।
- source_word: רֹאשׁוֹ
  choice: उसके सिर को
  rationale: सीधा शारीरिक अर्थ रखते हुए ‘खाल’ और ‘सिर’ के समानांतर विन्यास को सुरक्षित किया गया है।
