  yaml_path: translation/ot/job/040/029.yaml
  text: Will you play with him like a bird[b][a], or tie him up for your girls?
translation:
  language: hi
  text: क्या तू उसके साथ चिड़िया की तरह खेलेगा, या उसे अपनी लड़कियों[a] के लिए बाँधेगा?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपनी युवतियों के लिए’।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתְשַׂחֶק
  choice: क्या तू ... खेलेगा
  rationale: שׂחק का मूल अर्थ खेलना या क्रीड़ा करना है। आलंकारिक प्रश्न और पालतू पक्षी की उपमा के संदर्भ में ‘खेलेगा’ सहज और स्पष्ट है।
- source_word: בּוֹ
  choice: उसके साथ
  rationale: पुल्लिंग एकवचन प्रत्यय पिछले संदर्भ के लिव्यातान की ओर संकेत करता है; ‘उसके साथ’ इस व्याकरणिक संदर्भ को बनाए रखता है।
- source_word: כַּצִּפּוֹר
  choice: चिड़िया की तरह
  rationale: צִפּוֹר सामान्यतः पक्षी, विशेषकर छोटे पक्षी, को दर्शाता है। ‘चिड़िया की तरह’ पालतू खिलौने-जैसे पक्षी की उपमा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְתִקְשְׁרֶנּוּ
  choice: या उसे ... बाँध रखेगा
  rationale: קשר का अर्थ बाँधना है। ‘बाँध रखेगा’ केवल बाँधने की क्रिया नहीं, बल्कि लड़कियों के लिए उसे रोककर या पालतू बनाकर रखने का प्रसंग भी सहजता से व्यक्त करता है।
- source_word: לְנַעֲרוֹתֶיךָ
  choice: अपनी लड़कियों के लिए
  rationale: נַעֲרוֹת स्त्रीलिंग बहुवचन है और युवतियों या लड़कियों को दर्शाता है। ‘लड़कियों’ आधुनिक, सामान्य हिन्दी है और आयु-संबंधी व्यापकता को अनावश्यक रूप से सीमित नहीं करता।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में परमेश्वर द्वारा अय्यूब को किए गए प्रत्यक्ष एकवचन संबोधन के लिए ‘तू’ रखा गया है। वाक्य आलंकारिक प्रश्न की तीक्ष्णता और लिव्यातान को पालतू चिड़िया मानने की असंभव छवि बनाए रखता है।
