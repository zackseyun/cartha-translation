lexical_decisions:
- source_word: יִכְרוּ
  choice: मोल-भाव करेंगे
  rationale: כרה का सामान्य अर्थ ‘खोदना’ है, पर यहाँ मनुष्यों और व्यापारिक समानांतरता के साथ इसका मुहावरेदार अर्थ सौदा तय करना या मोल-भाव करना अधिक उपयुक्त है।
- source_word: עָלָיו
  choice: उसके लिए
  rationale: इस मुहावरे में על उस जीव के संबंध में, विशेषकर उसके अधिग्रहण या बिक्री के लिए, होने वाली बातचीत व्यक्त करता है। स्वाभाविक हिन्दी में ‘उसके लिए’ यही संबंध प्रकट करता है।
- source_word: חַבָּרִים
  choice: व्यापारी
  rationale: शब्द का अर्थ ‘साथी’ या ‘सहयोगी’ भी हो सकता है, किंतु अगली पंक्ति के सौदागरों में बाँटने के उल्लेख से यहाँ व्यापारिक अर्थ की संभावना अधिक है।
- source_word: יֶחֱצוּהוּ
  choice: उसे ... बाँट देंगे
  rationale: חצה का अर्थ बाँटना या हिस्से करना है। यह अनुवाद स्पष्ट रूप से काट डालने का अर्थ थोपे बिना माल के रूप में हिस्से करने की व्यापक धारणा बनाए रखता है।
- source_word: בֵּין
  choice: में
  rationale: बहुवचन समूह के साथ हिन्दी में ‘सौदागरों में’ स्वाभाविक रूप से वितरण का भाव देता है।
- source_word: כְּנַעֲנִים
  choice: सौदागर
  rationale: शाब्दिक अर्थ ‘कनानी’ है, किंतु इब्रानी में यह कभी-कभी व्यापारी के लिए प्रयुक्त होता है। यहाँ व्यापारिक समानांतरता के कारण मुख्य पाठ में ‘सौदागर’ उपयुक्त है, जबकि शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
