  text: טָמְנֵ֣/ם בֶּ/עָפָ֣ר יָ֑חַד פְּ֝נֵי/הֶ֗ם חֲבֹ֣שׁ בַּ/טָּמֽוּן׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/013.yaml
  text: Hide them together in the dust[b][a]; bind their faces in the hidden place.
translation:
  language: hi
  text: उन्हें एक साथ धूल में छिपा दे[a]; उनके चेहरों को छिपे हुए स्थान में बाँध दे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्हें एक साथ धूल में दफना दे।” हिब्रू क्रिया का अर्थ “छिपाना” हो सकता है, पर इस प्रसंग में वह दफनाने का संकेत भी दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “उनके चेहरों को गुप्त स्थान में बाँध दे” अथवा “उनके चेहरों को छिपाकर बाँध दे।” अंतिम वाक्यांश कठिन है; संभवतः उसका संकेत किसी छिपे हुए स्थान की ओर है और वह आरंभिक क्रिया “छिपा दे” की प्रतिध्वनि करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: טָמְנֵם
  choice: उन्हें ... छिपा दे
  rationale: טמן का मूल अर्थ ‘छिपाना’ है। धूल और मृत्यु के इस प्रसंग में ‘दफना दे’ भी संभव है, पर ‘छिपा दे’ मूल क्रिया और अंतिम पद के साथ उसकी शब्द-प्रतिध्वनि बनाए रखता है।
- source_word: בֶּעָפָר
  choice: धूल में
  rationale: עָפָר धूल या भुरभुरी मिट्टी को सूचित करता है; ‘धूल’ काव्यात्मक तथा मरणशीलता-संबंधी भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יָחַד
  choice: एक साथ
  rationale: यह क्रियाविशेषण सामूहिक रूप से किए जाने वाले कार्य को दर्शाता है।
- source_word: פְּנֵיהֶם
  choice: उनके चेहरों को
  rationale: मूल पाठ में ठोस बहुवचन ‘उनके चेहरे’ है; रूपक को स्पष्ट किए बिना उसी बिंब को रखा गया है।
- source_word: חֲבֹשׁ
  choice: बाँध दे
  rationale: חבשׁ का मूल अर्थ ‘बाँधना’ है। यहाँ रोकने, बंद करने या लपेटने का भाव संभव है, किंतु ‘बाँध दे’ मूल बिंब को सुरक्षित रखता है।
- source_word: בַּטָּמוּן
  choice: छिपे हुए स्थान में
  rationale: यह संभवतः טמן से बना संज्ञीकृत रूप है, जिसका आशय ‘छिपी हुई जगह’ या ‘गुप्त स्थान’ है। यह अनुवाद आरंभिक ‘छिपा दे’ के साथ हिब्रू शब्द-प्रतिध्वनि भी बनाए रखता है।
