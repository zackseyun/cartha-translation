  text: וְ/גַם אֲנִ֥י אוֹדֶ֑/ךָּ כִּֽי תוֹשִׁ֖עַ לְ/ךָ֣ יְמִינֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/014.yaml
  text: Then even I will praise you[a], because your right hand can save you.
translation:
  language: hi
  text: तब मैं भी तेरी स्तुति करूँगा[a], क्योंकि तेरा दाहिना हाथ तुझे बचा सकता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि तेरा दाहिना हाथ तेरे लिए [या अपने लिए] बचाव कर सकता है।” इब्रानी में ‘तेरे लिए/अपने लिए’ का हितार्थक भाव है।
    reason: लְךָ के हितार्थक/आत्मलाभकारी सूक्ष्म भाव को सुरक्षित रखता है, जबकि मुख्य पाठ में स्वाभाविक हिन्दी बनी रहती है।
lexical_decisions:
- source_word: וְגַם
  choice: तब ... भी
  rationale: यह पद पिछले चुनौतीपूर्ण कथन से जुड़ता है और बल भी देता है; आधुनिक हिन्दी में ‘तब मैं भी’ दोनों भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֲנִי
  choice: मैं
  rationale: मूल में स्पष्ट सर्वनाम वक्ता, अर्थात परमेश्वर, पर जोर देता है; इसलिए इसे रखा गया है।
- source_word: אוֹדֶךָ
  choice: तेरी स्तुति करूँगा
  rationale: ידה का हिफ़ील रूप यहाँ प्रशंसा अथवा स्वीकारोक्ति व्यक्त करता है; इस प्रसंग में ‘स्तुति करना’ स्वाभाविक और उपयुक्त है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पहले कथन का कारण बताता है।
- source_word: תוֹשִׁיעַ
  choice: उद्धार कर सकता है
  rationale: ישׁע का हिफ़ील रूप बचाने या छुड़ाने का अर्थ देता है। पिछले सशर्त चुनौतीपूर्ण प्रसंग में सामर्थ्य का भाव है, इसलिए ‘कर सकता है’ चुना गया।
- source_word: לְךָ
  choice: तेरा
  rationale: לְךָ हित अथवा लाभ का भाव देता है—‘तेरे लिए/अपने लिए’; मुख्य पाठ में ‘तेरा उद्धार’ सहज हिन्दी है और वैकल्पिक बारीकी पाद-टिप्पणी में दी गई है।
- source_word: יְמִינֶךָ
  choice: तेरा दाहिना हाथ
  rationale: दाहिना हाथ सामर्थ्य का मूर्त रूपक है; व्याख्यात्मक ‘तेरी शक्ति’ के स्थान पर मूल बिंब सुरक्षित रखा गया है।
theological_decisions:
- issue: सामर्थ्य के लिए मानवरूपी रूपक
  choice: तेरा दाहिना हाथ तेरा उद्धार कर सकता है
  alternative: तेरी अपनी शक्ति तेरा उद्धार कर सकती है
  rationale: इब्रानी पाठ का ठोस बिंब ‘दाहिना हाथ’ है। उसे केवल ‘शक्ति’ कहकर व्याख्यायित करने के बजाय मूल रूपक सुरक्षित रखा गया है।
- issue: לְךָ का हितार्थक अथवा आत्मवाचक भाव
  choice: तेरा उद्धार
  alternative: अपने लिए उद्धार कर सकता है
  rationale: व्याकरणतः ‘तेरे लिए/अपने लिए’ का भाव संभव है। मुख्य पाठ में स्वाभाविक हिन्दी रखते हुए वास्तविक अर्थ-विकल्प पाद-टिप्पणी में सुरक्षित किया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। परमेश्वर द्वारा अय्यूब को सीधे संबोधन के अनुरूप एकवचन निकट संबोधन ‘तू/तेरा’ रखा गया है।
