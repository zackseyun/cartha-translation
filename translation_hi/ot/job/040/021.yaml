    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  choice: के नीचे
  rationale: स्थान-सूचक पूर्वसर्ग है; आधुनिक हिन्दी में स्वाभाविक रूप से ‘के नीचे’ कहा जाता है।
- source_word: צֶאֱלִים
  choice: छायादार पेड़ों
  rationale: इस दुर्लभ शब्द से किसी छाया देने वाले वृक्ष, संभवतः कमल-जैसे वृक्ष, का बोध होता है। प्रजाति अनिश्चित होने के कारण मुख्य पाठ में व्यापक और सहज अर्थ रखा गया है।
- source_word: יִשְׁכָּב
  choice: लेटता है
  rationale: काल के प्रसंग में यह पशु की सामान्य या चित्रात्मक वर्तमान मुद्रा बताता है; ‘लेटता है’ हिन्दी में स्वाभाविक है।
- source_word: בְּסֵתֶר
  choice: की आड़ में
  rationale: संज्ञा छिपाव, ओट या आश्रय का भाव देती है; वनस्पति से मिलने वाली ओट के लिए ‘आड़ में’ सटीक और सहज है।
- source_word: קָנֶה
  choice: सरकंडों
  rationale: इब्रानी एकवचन यहाँ सामूहिक अर्थ में वनस्पति-समूह को दर्शाता है; हिन्दी बहुवचन ‘सरकंडों’ अधिक स्वाभाविक है।
- source_word: וּבִצָּה
  choice: और दलदल
  rationale: शब्द दलदली या कच्छ भूमि को दर्शाता है; ‘दलदल’ सामान्य आधुनिक हिन्दी में स्पष्ट है।
