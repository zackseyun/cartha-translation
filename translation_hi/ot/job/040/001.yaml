lexical_decisions:
- source_word: וַיַּעַן
  choice: उत्तर दिया
  rationale: ענה का यह कथात्मक रूप संवाद में ‘उत्तर देना’ व्यक्त करता है; यह इब्रानी की औपचारिक संवाद-रचना को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार अक्षरों वाले दिव्य नाम יהוה को हिन्दी में प्रचलित नाम-रूप ‘यहोवा’ से व्यक्त किया गया है, न कि किसी उपाधि से।
- source_word: אֶת
  choice: '[सीधा कर्म-चिह्न; अलग से अनूदित नहीं]'
  rationale: אֶת ‘अय्यूब’ को क्रिया का सीधा कर्म चिह्नित करता है; हिन्दी में इसका कोई स्वतंत्र शब्द आवश्यक नहीं है।
- source_word: אִיּוֹב
  choice: अय्यूब
  rationale: इब्रानी व्यक्तिगत नाम का हिन्दी बाइबल-परंपरा में स्थापित रूप ‘अय्यूब’ है।
- source_word: וַיֹּאמַר
  choice: और कहा
  rationale: אמר का सामान्य अर्थ ‘कहना’ है। स्रोत में उपस्थित दोनों वाणी-सूचक क्रियाओं को रखते हुए ‘उत्तर दिया और कहा’ अनूदित किया गया है।
- source_word: וַ־
  choice: तब / और
  rationale: क्रमिक कथात्मक वाव को वाक्य के आरम्भ में स्वाभाविक हिन्दी हेतु ‘तब’ और दूसरी क्रिया के साथ ‘और’ से व्यक्त किया गया है।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में उपाधि नहीं, परमेश्वर का व्यक्तिगत नाम יהוה है। हिन्दी पाठकों के लिए सुस्थापित ‘यहोवा’ रूप चुना गया है; वैकल्पिक लिप्यंतरण ‘याहवे’ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। इब्रानी सूत्र ‘उत्तर दिया और कहा’ को उसकी जानबूझकर की गई पुनरुक्ति सहित सुरक्षित रखा गया है।
