  yaml_path: translation/ot/job/040/015.yaml
  text: Look now at Behemoth[a], which I made along with you; he eats grass like an ox.
translation:
  language: hi
  text: अब बहेमोत[a] को देख, जिसे मैंने तेरे साथ बनाया है; वह बैल के समान घास खाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वह पशु।” बहुत-से व्याख्याकार “बहेमोत” को किसी विशिष्ट महान प्राणी का नाम या पदनाम मानते हैं; अन्य इसे दरियाई घोड़ा अथवा कोई और बड़ा पशु मानते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: अब ज़रा ... को देख
  rationale: הִנֵּה ध्यान आकर्षित करता है और נָא यहाँ कथन को तात्कालिक बल देता है। यह प्रयोग आधुनिक हिन्दी में स्वाभाविक रूप से ईश्वरीय संबोधन की प्रत्यक्षता बनाए रखता है।
- source_word: בְהֵמוֹת
  choice: बहेमोत
  rationale: यह रूप सामान्यतः पशु-संबंधी संज्ञा से जुड़ा है, पर अय्यूब 40 में किसी विशिष्ट विशाल प्राणी के नाम या पदनाम के समान प्रयुक्त होता है। लिप्यंतरण उसकी पहचान को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: जिसे मैंने ... बनाया है
  rationale: עשה का सामान्य अर्थ 'बनाना' है; हिन्दी का पूर्ण पक्ष यहाँ सृष्टि के संपन्न कार्य और वर्तमान संदर्भ दोनों को सहजता से व्यक्त करता है।
- source_word: עִמָּךְ
  choice: तेरे साथ
  rationale: עם संग-साथ अथवा एक ही सृजन-व्यवस्था में बनाए जाने का भाव दे सकता है। संक्षिप्त अनुवाद मूल की संभावित व्यापकता को सुरक्षित रखता है।
- source_word: חָצִיר
  choice: घास
  rationale: यह शब्द घास या वनस्पति को दर्शाता है; प्रसंग में 'घास' सबसे स्पष्ट और स्वाभाविक विकल्प है।
- source_word: כַּבָּקָר
  choice: बैल के समान
  rationale: בקר गोवंश के लिए सामूहिक शब्द हो सकता है। तुलना को सजीव रखने के लिए 'बैल' चुना गया है, बिना प्राणी की अपनी पहचान निर्धारित किए।
- source_word: יֹאכֵל
  choice: वह ... खाता है
  rationale: पुल्लिंग एकवचन क्रिया को हिन्दी में पुल्लिंग संदर्भ के साथ रखा गया है।
theological_decisions:
- issue: בְהֵמוֹת की पहचान
  choice: मुख्य पाठ में इसे विशिष्ट प्राणी का नाम या पदनाम मानकर 'बहेमोत' लिखा गया है।
  alternative: इसे 'वह पशु', 'दरियाई घोड़ा' या किसी अन्य ज्ञात बड़े पशु के रूप में अनूदित किया जा सकता है।
  rationale: मूल काव्यात्मक वर्णन प्राणी की निश्चित प्राणिवैज्ञानिक पहचान नहीं बताता। लिप्यंतरण वास्तविक अस्पष्टता और साहित्यिक प्रभाव दोनों को बनाए रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और प्रत्यक्ष हिन्दी। परमेश्वर का अय्यूब से एकवचन आत्मीय संबोधन बनाए रखने के लिए 'तेरे' और आज्ञार्थक 'देख' का प्रयोग किया गया है।
