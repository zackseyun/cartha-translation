  text: עֲדֵ֥ה נָ֣א גָֽא֣וֹן וָ/גֹ֑בַהּ וְ/ה֖וֹד וְ/הָדָ֣ר תִּלְבָּֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/010.yaml
  text: Adorn yourself[a], please, with majesty and loftiness, and clothe yourself with splendor and honor.
translation:
  language: hi
  text: अब अपने को प्रताप और महानता से सजा ले[a], और वैभव तथा गरिमा धारण कर ले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने को गौरव और ऊँचाई से सजा ले; महिमा और शोभा धारण कर ले।”
    reason: चार काव्यात्मक संज्ञाओं के अर्थ-क्षेत्र आंशिक रूप से मिलते हैं। विशेषकर גָּאוֹן का अर्थ ‘गौरव’ और גֹּבַהּ का शाब्दिक अर्थ ‘ऊँचाई’ भी हो सकता है।
lexical_decisions:
- source_word: עֲדֵה
  choice: अपने को ... सजा ले
  rationale: आज्ञार्थक रूप में स्वयं को अलंकृत करने का भाव है; यह आगे के वस्त्र पहनने वाले रूपक के साथ स्वाभाविक बैठता है।
- source_word: נָא
  choice: प्रत्यक्ष रूप से अनूदित नहीं
  rationale: यहाँ यह आग्रह अथवा बल देने वाला निपात है। हिन्दी आज्ञार्थक 'सजा ले' में प्रसंगानुकूल बल स्वाभाविक रूप से व्यक्त होता है; 'कृपया' परमेश्वर की चुनौती के स्वर को अनावश्यक रूप से विनम्र बना देता।
- source_word: גָּאוֹן
  choice: प्रताप
  rationale: इस प्रसंग में यह पापपूर्ण घमण्ड से अधिक ऊँचे राजसी गौरव और महिमा को दर्शाता है।
- source_word: גֹּבַהּ
  choice: ऊँचाई
  rationale: मूल शब्द के 'ऊँचाई/उन्नति' रूपक को बनाए रखता है और नकारात्मक 'अहंकार' को थोपता नहीं।
- source_word: הוֹד
  choice: वैभव
  rationale: दृश्य भव्यता और राजसी तेज का स्वाभाविक हिन्दी बोध देता है।
- source_word: הָדָר
  choice: शोभा
  rationale: गरिमा, सौन्दर्य और भव्य अलंकरण की अर्थ-सीमा को व्यक्त करता है तथा 'वैभव' से कुछ भिन्न काव्यात्मक पद बनाए रखता है।
- source_word: תִּלְבָּשׁ
  choice: वस्त्र के समान पहन ले
  rationale: क्रिया के वस्त्र धारण करने के स्पष्ट रूपक को हिन्दी में बनाए रखता है और पहले खंड की आज्ञा को आगे बढ़ाता है।
theological_decisions:
- issue: גָּאוֹן और גֹּבַהּ को नैतिक रूप से नकारात्मक घमण्ड/अहंकार मानें या राजसी-दिव्य महानता
  choice: प्रताप और ऊँचाई—अर्थात राजसी महानता
  alternative: घमण्ड और अहंकार जैसे नकारात्मक पद
  rationale: निकटवर्ती प्रसंग में परमेश्वर अय्यूब को वह महानता और अधिकार धारण करने की चुनौती देते हैं जो परमेश्वर के हैं। הוֹד और הָדָר तथा वस्त्र का रूपक भी राजसी वैभव का समर्थन करते हैं, यद्यपि शब्दों में गर्व/उच्चता का संभावित अर्थ-पक्ष मौजूद है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण काव्यात्मक रूप। चुनौती के स्वर को बनाए रखने के लिए एकवचन निकट आज्ञार्थक ‘सजा ले/पहन ले’ रखा गया है; ‘कृपया’ से उत्पन्न होने वाली अनपेक्षित विनम्रता से बचा गया है।
