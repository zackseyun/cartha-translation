  language: hi
  text: क्या तू लिव्यातान को मछली पकड़ने के काँटे से खींचकर निकाल सकता है,[a] या रस्सी से उसकी जीभ दबा सकता है?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “लिव्यातान को काँटे से खींच सकता है।”
    reason: lexical_alternative
  - marker: b
    text: या “रस्सी से उसकी जीभ नीचे धँसा सकता है” अथवा “रस्सी से उसकी जीभ दबा कर रख सकता है।” इब्रानी बिंब कठिन है और संभवतः मुँह के रास्ते इस जीव को वश में करने की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּמְשֹׁךְ
  choice: खींचकर निकाल सकता है
  rationale: मत्स्य-ग्रहण के इस संदर्भ में משׁך का अर्थ खींचना या बाहर निकालना है। संयुक्त अभिव्यक्ति मूल की क्रिया और दिशा दोनों को स्वाभाविक हिन्दी में रखती है।
- source_word: לִוְיָתָן
  choice: लिव्यातान
  rationale: यह एक विशिष्ट नाम/पदनाम है; इसलिए इसका अर्थ लगाकर किसी ज्ञात जीव से पहचान करने के बजाय लिप्यंतरण किया गया है।
- source_word: בְּחַכָּה
  choice: मछली पकड़ने के काँटे से
  rationale: חכה मछली पकड़ने के काँटे को दर्शाता है। यह हिन्दी में चित्र को स्पष्ट करता है और केवल सामान्य 'काँटा' से अधिक सटीक है।
- source_word: וּבְחֶבֶל
  choice: रस्सी से
  rationale: חבל का सामान्य अर्थ रस्सी या डोरी है। 'रस्सी' जीव को वश में करने के ठोस और भारी साधन का स्वाभाविक चित्र देती है।
- source_word: תַּשְׁקִיעַ
  choice: दबा सकता है
  rationale: שׁקע के हिफ़ील रूप का मूल भाव नीचे धँसाना या दबाना है। यहाँ जीभ और रस्सी के साथ क्रिया की विधि अस्पष्ट है; 'दबा' इस चित्र को बिना अनावश्यक व्याख्या के रखता है।
- source_word: לְשֹׁנוֹ
  choice: उसकी जीभ
  rationale: इब्रानी पाठ स्पष्ट रूप से 'उसकी जीभ' कहता है। इसे व्यापक अर्थ वाले 'मुँह' में बदलना मूल की विशिष्टता को खो देगा।
