lexical_decisions:
- source_word: הָפֵץ
  choice: चारों ओर फैला दे
  rationale: आज्ञार्थक क्रिया किसी वस्तु को बिखेरने या व्यापक रूप से छोड़ देने का भाव रखती है। यह चयन क्रोध के ‘उफानों’ के साथ स्वाभाविक हिन्दी में उस प्रबल प्रसार को व्यक्त करता है।
- source_word: עֶבְרוֹת
  choice: उफान
  rationale: बहुवचन संज्ञा उमड़ते हुए तीव्र रोष या प्रकोपों को सूचित करती है। ‘उफान’ क्रोध की अतिशयता और बहुवचन की संचयी तीव्रता को काव्यात्मक, सुबोध हिन्दी में बनाए रखता है।
- source_word: אַפֶּךָ
  choice: अपने क्रोध के
  rationale: शाब्दिक अर्थ ‘तेरी नाक’ है, पर यह क्रोध के लिए स्थापित इब्रानी मुहावरा है; हिन्दी में अर्थ को स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: וּרְאֵה
  choice: को देख
  rationale: आज्ञार्थक ‘देख’ आगे होने वाली दीन करने की क्रिया के लिए प्रत्येक घमण्डी पर सक्रिय दृष्टि डालने का भाव देता है।
- source_word: כָל גֵּאֶה
  choice: हर घमण्डी
  rationale: एकवचन विशेषण के संज्ञात्मक प्रयोग और ‘हर’ के वितरणात्मक भाव को सरलता से व्यक्त करता है।
- source_word: וְהַשְׁפִּילֵהוּ
  choice: और उसे नीचा कर दे
  rationale: हिफ़ील आज्ञार्थक का अर्थ ‘नीचा करना’ है। एकवचन ‘उसे’ प्रत्येक घमण्डी व्यक्ति को अलग-अलग लक्ष्य किए जाने का भाव सुरक्षित रखता है और ऊँचे घमण्ड के साथ काव्यात्मक विरोध रचता है।
