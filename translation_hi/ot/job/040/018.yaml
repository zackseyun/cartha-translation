  rationale: काव्यात्मक धातु-चित्रण में यह काँसे अथवा ताँबे को सूचित कर सकता है; लोहे के साथ समानांतर प्रयोग में ‘काँसा’ स्वाभाविक है।
- source_word: גְּרָמָיו
  choice: उसकी अस्थियाँ
  rationale: גֶּרֶם हड्डी या कंकालीय अंग को सूचित करता है। ‘अस्थियाँ’ मूल की शारीरिक समानांतरता बनाए रखते हुए हिन्दी में थोड़ी काव्यात्मक विविधता देता है।
- source_word: כִּמְטִיל
  choice: छड़ जैसी
  rationale: מָטִיל ढाली हुई धातु की ठोस वस्तु, सिल्ले या छड़ का बोध करा सकता है। संदर्भ में ‘छड़’ कठोरता और ठोस शक्ति की स्पष्ट छवि देता है।
- source_word: בַּרְזֶל
  choice: लोहा
  rationale: בַּרְזֶל का मानक अर्थ ‘लोहा’ है और यह पहले चरण के काँसे के साथ धात्विक समानांतरता बनाता है।
