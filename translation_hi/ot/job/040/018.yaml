- source_word: עֲצָמָיו
  choice: उसकी हड्डियाँ
  rationale: עֶצֶם का सामान्य शारीरिक अर्थ ‘हड्डी’ है और यह अगले चरण के גְּרָמָיו के साथ समानांतरता रखता है।
- source_word: אֲפִיקֵי
  choice: नलियाँ
  rationale: यह शब्द नालों, मार्गों या वाहिकाओं का बोध करा सकता है। हड्डियों के रूपक में ‘नलियाँ’ आकृति और दृढ़ता, दोनों की छवि बनाए रखता है।
- source_word: נְחוּשָׁה
