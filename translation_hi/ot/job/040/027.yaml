- source_word: הֲיַרְבֶּה
  choice: क्या वह ... बहुत ... करेगा
  rationale: प्रश्नवाचक הֲ को ‘क्या’ से और רבה के हिफ़ील रूप को मात्रा की अधिकता बताने वाले स्वाभाविक हिंदी प्रयोग ‘बहुत ... करेगा’ से व्यक्त किया गया है।
- source_word: אֵלֶיךָ
  choice: तुमसे
  rationale: इस वाक्य में אֶל के द्वितीय पुरुष एकवचन प्रत्यय का लक्ष्यगत भाव हिंदी में ‘तुमसे’ द्वारा स्वाभाविक रूप से व्यक्त होता है।
- source_word: תַּחֲנוּנִים
  choice: विनती
  rationale: यह शब्द कृपा या दया पाने के लिए की गई गहरी प्रार्थना अथवा याचना को दर्शाता है; ‘विनती’ आधुनिक हिंदी में स्पष्ट और गरिमापूर्ण है।
- source_word: אִם
  choice: या
  rationale: समानांतर प्रश्न के दूसरे विकल्प को आरम्भ करने के कारण אִם को शर्तसूचक ‘यदि’ के बजाय विकल्पसूचक ‘या’ किया गया है।
- source_word: יְדַבֵּר
  choice: कहेगा
  rationale: דבר के बोलने के सामान्य अर्थ को यहाँ ‘बातें’ के साथ स्वाभाविक हिंदी क्रिया ‘कहेगा’ द्वारा व्यक्त किया गया है।
- source_word: רַכּוֹת
  choice: कोमल बातें
  rationale: स्त्रीलिंग बहुवचन विशेषण यहाँ संज्ञा के समान प्रयुक्त होकर नम्र या मृदु वाणी का संकेत देता है। ‘कोमल बातें’ बिना चापलूसी का अतिरिक्त अर्थ जोड़े मूल भाव रखता है।
