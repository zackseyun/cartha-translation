  text: וְ/אִם זְר֖וֹעַ כָּ/אֵ֥ל לָ֑/ךְ וּ֝/בְ/ק֗וֹל כָּמֹ֥/הוּ תַרְעֵֽם־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/009.yaml
  text: Or do you have an arm like God’s[a], and can you thunder with a voice like his?
translation:
  language: hi
  text: या क्या तेरी भुजा परमेश्वर की भुजा के समान है[a], और क्या तू उसके समान स्वर में गरज सकता है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'कम संभावित अर्थ: “किसी देवता की भुजा के समान,” यदि אֵל को यहाँ सामान्य अर्थ में लिया जाए; संदर्भ प्रबल रूप से “परमेश्वर” का समर्थन करता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִם
  choice: या क्या
  rationale: यह पद पिछले आलंकारिक प्रश्नों को आगे बढ़ाते हुए एक चुनौती प्रस्तुत करता है; ‘या क्या’ उसके संयोजक और चुनौतीपूर्ण बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: זְרוֹעַ
  choice: भुजा
  rationale: मूल शब्द का ठोस चित्र ‘भुजा’ है, जो सामर्थ्य का बिंब भी व्यक्त करता है; इसलिए केवल ‘शक्ति’ कहकर रूपक को हटाया नहीं गया।
- source_word: כָּאֵל
  choice: परमेश्वर की भुजा के समान
  rationale: संदर्भ में वक्ता इस्राएल का परमेश्वर है और तुलना उसकी भुजा से है। हिन्दी में संज्ञा को दोहराने से संबंध स्पष्ट और स्वाभाविक रहता है।
- source_word: לָךְ
  choice: तेरी ... है
  rationale: शाब्दिक अर्थ ‘तेरे लिए/तेरे पास’ है, पर अस्तित्व अथवा अधिकार का भाव हिन्दी में ‘तेरी ... है’ से सहज रूप में व्यक्त होता है।
- source_word: וּבְקוֹל
  choice: और ... स्वर में
  rationale: בְּ को यहाँ माध्यम या रीति के रूप में लिया गया है। ‘स्वर में गरजना’ हिन्दी में वाणी द्वारा गर्जना का भाव व्यक्त करता है।
- source_word: כָּמֹהוּ
  choice: उसके समान
  rationale: सर्वनाम परमेश्वर की ओर लौटता है और स्वर/वाणी की तुलना करता है; ‘उसके समान’ मूल की संक्षिप्तता और संदर्भगत स्पष्टता बनाए रखता है।
- source_word: תַרְעֵם
  choice: गरज सकता है
  rationale: हिफ़ील रूप यहाँ गर्जना अथवा मेघ-गर्जन जैसी ध्वनि निकालने की क्षमता बताता है। ‘गरज सकता है’ आलंकारिक प्रश्न और तूफ़ानी ईश-प्रकाशन के बिंब दोनों को बनाए रखता है।
theological_decisions:
- issue: אֵל का संदर्भ
  choice: परमेश्वर
  alternative: कोई देवता
  rationale: निकट संदर्भ में स्वयं इस्राएल का परमेश्वर अय्यूब को अपनी अद्वितीय सामर्थ्य के विषय में चुनौती दे रहा है। इसलिए ‘परमेश्वर’ मुख्य पाठ का सबसे संभावित अर्थ है; अधिक सामान्य अर्थ को टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सीधी और सामान्य पाठक के लिए बोधगम्य शैली। ईश्वर द्वारा अय्यूब को सीधे संबोधन के कारण ‘तू/तेरी’ रखा गया है; इसे अनादर के बजाय मूल के एकवचन निकट संबोधन के रूप में समझा जाए।
