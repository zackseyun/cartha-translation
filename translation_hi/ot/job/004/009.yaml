source:
  edition: WLC
  text: מִ/נִּשְׁמַ֣ת אֱל֣וֹהַ יֹאבֵ֑דוּ וּ/מֵ/ר֖וּחַ אַפּ֣/וֹ יִכְלֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/009.yaml
  text: By the breath of God they perish[c][b][a], and by the blast of his anger they come to an end.
translation:
  language: hi
  text: परमेश्वर की साँस से वे नाश हो जाते हैं,[a] और उसके क्रोध की फूँक से मिट जाते हैं।[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘से’ का अर्थ यहाँ ‘के कारण’ या ‘के द्वारा’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘फूँक’ के लिए प्रयुक्त इब्रानी शब्द का अर्थ ‘हवा,’ ‘साँस’ या ‘आत्मा’ भी हो सकता है। यहाँ यह क्रोध से जुड़ी विनाशकारी फूँक का बोध कराता है।
    reason: lexical_alternative
  - marker: c
    text: या, ‘समाप्त हो जाते हैं’ अथवा ‘भस्म हो जाते हैं।’
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנִּשְׁמַת
  choice: की साँस से
  rationale: נשמה का अर्थ ‘साँस’ है। उपसर्ग מִן यहाँ कारण अथवा साधन सूचित कर सकता है; हिन्दी में ‘से’ दोनों संभावनाओं को स्वाभाविक रूप से खुला रखता है।
- source_word: אֱלוֹהַ
  choice: परमेश्वर
  rationale: यह अय्यूब में प्रयुक्त ‘ईश्वर/परमेश्वर’ का एकवचन काव्यात्मक रूप है; ‘परमेश्वर’ गरिमापूर्ण और सामान्य आधुनिक हिन्दी में स्वाभाविक है।
- source_word: יֹאבֵדוּ
  choice: वे नाश हो जाते हैं
  rationale: אבד का मूल भाव नाश होना या मिट जाना है। यह प्रयोग अकर्मक बल और पहले अर्धपद की काव्यात्मक गंभीरता बनाए रखता है।
- source_word: וּמֵרוּחַ
  choice: और ... की फूँक से
  rationale: רוּחַ का अर्थ हवा, साँस, आत्मा या जोरदार फूँक हो सकता है। क्रोध के साथ और पहले अर्धपद की ‘साँस’ के समानांतर ‘फूँक’ विनाशकारी उच्छ्वास का चित्र स्पष्ट करती है, बिना इसे ‘आत्मा’ के धार्मिक अर्थ में सीमित किए।
- source_word: אַפּוֹ
  choice: उसके क्रोध की
  rationale: אַף का शाब्दिक अर्थ नाक/नथुना और मुहावरेदार अर्थ क्रोध है। ‘क्रोध’ अर्थ को स्पष्ट करता है, जबकि ‘फूँक’ देहात्मक काव्य-चित्र का कुछ अंश बनाए रखती है।
- source_word: יִכְלוּ
  choice: मिट जाते हैं
  rationale: כלה का अर्थ समाप्त होना, चुक जाना या भस्म हो जाना हो सकता है। ‘मिट जाते हैं’ विनाश के परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है और ‘नाश हो जाते हैं’ के साथ काव्यात्मक समानांतर बनाता है।
theological_decisions:
- issue: परमेश्वर के क्रोध के लिए मानवरूपी भाषा
  choice: אַפּוֹ को ‘उसके क्रोध’ और רוּחַ को ‘फूँक’ के रूप में प्रस्तुत किया गया है।
  alternative: ‘उसके नथुनों की हवा’ अथवा ‘उसके कोप की साँस’
  rationale: इब्रानी मुहावरे का आशय क्रोध है, पर साँस/फूँक का चित्र भी पद का अभिन्न भाग है। चुना हुआ रूप अर्थ को सुबोध रखता है और मानवरूपी काव्य-तनाव को पूरी तरह मिटाता नहीं है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, काव्यात्मक किंतु सहज और गरिमापूर्ण रखी गई है। दोनों अर्धपदों का समानांतर विन्यास सुरक्षित है; ‘साँस’ और ‘फूँक’ मूल के निकटवर्ती किंतु अलग शब्दचित्रों को दर्शाते हैं।
