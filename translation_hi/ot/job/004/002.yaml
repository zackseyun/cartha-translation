  text: הֲ/נִסָּ֬ה דָבָ֣ר אֵלֶ֣י/ךָ תִּלְאֶ֑ה וַ/עְצֹ֥ר בְּ֝/מִלִּ֗ין מִ֣י יוּכָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/002.yaml
  text: If one tries a word with you[a], will you be weary? But who can hold back words?
translation:
  language: hi
  text: यदि कोई तुमसे एक बात कहने का प्रयत्न करे[a], तो क्या तुम थक जाओगे? पर अपने शब्दों को कौन रोक सकता है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यदि कोई तुमसे कुछ कहने का साहस करे।”
    reason: הֲנִסָּה में किसी बात को आज़माने के साथ उसे साहसपूर्वक आरम्भ करने का भाव हो सकता है, और דָבָר का अनुवाद ‘बात’ या ‘कुछ’ किया जा सकता है।
lexical_decisions:
- source_word: הֲנִסָּה
  choice: प्रयत्न करे
  rationale: पिएल रूप यहाँ किसी काम को आज़माने या करने का प्रयत्न करने का भाव देता है। एलीपज सावधानी से अय्यूब से बोलना आरम्भ कर रहा है; इसलिए ‘प्रयत्न करे’ स्वाभाविक है और ‘परखे’ जैसी भ्रामक धारणा से बचाता है।
- source_word: דָבָר
  choice: एक बात
  rationale: דָבָר का अर्थ ‘शब्द’ या ‘बात/विषय’ हो सकता है। यहाँ बोलने का भाव प्रमुख है; ‘एक बात कहना’ आधुनिक हिन्दी में स्वाभाविक है और अर्थ की व्यापकता भी बनाए रखता है।
- source_word: אֵלֶיךָ
  choice: तुमसे
  rationale: शाब्दिक अर्थ ‘तुम्हारी ओर/तुमको’ है। हिन्दी में ‘तुमसे एक बात कहना’ संबोधित वाणी को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: תִּלְאֶה
  choice: थक जाओगे
  rationale: לאה का मूल भाव थकने या क्लांत होने का है। संदर्भ में यह सुनने से ऊब या खिन्न होने की ओर संकेत कर सकता है, पर ‘थक जाओगे’ मूल अर्थ और उसकी संदर्भगत अस्पष्टता दोनों को सुरक्षित रखता है।
- source_word: וַעְצֹר
  choice: रोक
  rationale: עצר का अर्थ रोकना या थामे रखना है। यहाँ शब्दों को अपने भीतर रोके रखने का आलंकारिक भाव है।
- source_word: בְּמִלִּין
  choice: शब्दों को
  rationale: यह ‘शब्दों’ का बहुवचन रूप है। इसे बहुवचन में रखने से पहले खंड की ‘बात’ के साथ मूल पाठ का वाचिक संबंध बना रहता है।
- source_word: מִי יוּכָל
  choice: कौन सकता है
  rationale: यह सामर्थ्य व्यक्त करने वाला संक्षिप्त आलंकारिक प्रश्न है; हिन्दी में ‘कौन सकता है?’ उसी बल को स्वाभाविक रूप से व्यक्त करता है।
