translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी अपनाई गई है। ‘तुम’ अय्यूब को संबोधित एकवचन रूप के अनुरूप है। पहले प्रश्न में एलीपज की संकोचपूर्ण भूमिका और दूसरे में उसके आलंकारिक आत्म-औचित्य को बनाए रखा गया है।
