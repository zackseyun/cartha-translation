translation:
  language: hi
  text: पर अब यह तुम पर आ पड़ी है, और तुम थक गए हो; यह तुम्हें छूती है, और तुम घबरा उठते हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: पर
  rationale: संदर्भ में एलीपज अय्यूब द्वारा पहले दूसरों को संभालने और अब स्वयं दुःख में पड़कर विचलित होने के बीच विरोध दिखा रहा है; इसलिए यहाँ विरोधसूचक अर्थ स्वाभाविक है।
- source_word: עַתָּה
  choice: अब
  rationale: यह कालवाचक क्रियाविशेषण अय्यूब की पिछली भूमिका और उसकी वर्तमान दशा के बीच अंतर दर्शाता है।
- source_word: תָּבוֹא
  choice: विपत्ति तुम पर आ पड़ी है
  rationale: क्रिया स्त्रीलिंग एकवचन है, पर उसका कर्ता व्यक्त नहीं है। संदर्भ में निहित विपत्ति या मुसीबत को स्पष्ट करना हिन्दी में स्वाभाविक है; 'आ पड़ी' उसके अय्यूब तक पहुँचने का भाव देता है।
- source_word: אֵלֶיךָ
  choice: तुम पर
  rationale: मुसीबत के किसी व्यक्ति तक पहुँचने के लिए हिन्दी में 'तुम पर आ पड़ना' स्वाभाविक और अर्थानुकूल प्रयोग है।
- source_word: וַתֵּלֶא
  choice: तो तुम थक गए हो
  rationale: לאה का मूल भाव थक जाने या शक्ति चुकने का है; यह अनुवाद नैतिक अधीरता का अतिरिक्त अर्थ आरोपित नहीं करता।
- source_word: תִּגַּע
  choice: वह तुम्हें छूती है
  rationale: נגע के 'छूना/पहुँचना/प्रहार करना' अर्थों में से 'छूती है' मूल रूपक और पहली क्रिया से बढ़ती हुई निकटता को सुरक्षित रखता है।
- source_word: עָדֶיךָ
  choice: तुम्हें
  rationale: עד के प्रत्यययुक्त रूप का शाब्दिक भाव 'तुम तक' है; 'छूना' के साथ हिन्दी में 'तुम्हें' सहज है।
- source_word: וַתִּבָּהֵל
  choice: तो तुम घबरा उठते हो
  rationale: בהל आकस्मिक व्याकुलता, घबराहट या भयभीत हो उठने को व्यक्त करता है; यह पद तीव्र प्रतिक्रिया को सहज आधुनिक हिन्दी में रखता है।
