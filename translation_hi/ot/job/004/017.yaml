translation:
  language: hi
  text: 'क्या नश्वर मनुष्य परमेश्वर के सामने धर्मी ठहर सकता है?


    क्या मनुष्य अपने रचनेवाले के सामने शुद्ध हो सकता है?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “क्या नश्वर मनुष्य परमेश्वर से अधिक धर्मी हो सकता है? क्या मनुष्य अपने रचनेवाले से अधिक शुद्ध हो सकता है?”'
    reason: מן के संबंधपरक और तुलनात्मक अर्थों के बीच वास्तविक व्याकरणिक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: הַאֱנוֹשׁ
  choice: नश्वर मनुष्य
  rationale: אֱנוֹשׁ मानव की दुर्बलता और मरणशीलता पर बल दे सकता है; ‘नश्वर मनुष्य’ परमेश्वर के साथ इस विरोध को स्पष्ट रखता है।
- source_word: מֵאֱלוֹהַ יִצְדָּק
  choice: परमेश्वर के सामने धर्मी ठहर सकता है
  rationale: צדק का यहाँ न्यायिक-संबंधपरक भाव है। מן को मुख्य पाठ में ‘के सामने’ कहना स्वाभाविक हिन्दी में परमेश्वर के संबंध में सही ठहरने का अर्थ व्यक्त करता है, जबकि तुलनात्मक अर्थ पाद-टिप्पणी में सुरक्षित है।
- source_word: אִם
  choice: क्या
  rationale: काव्यात्मक समानांतरता में אִם दूसरी प्रश्नात्मक पंक्ति आरम्भ करता है; दोबारा ‘क्या’ कहना हिन्दी में आलंकारिक प्रश्न को स्पष्ट करता है।
- source_word: מֵעֹשֵׂהוּ
  choice: अपने रचनेवाले के सामने
  rationale: עֹשֵׂהוּ का अर्थ ‘उसका रचनेवाला’ है। स्वाभाविक हिन्दी में कर्ता के संदर्भ को स्पष्ट करने के लिए ‘अपने’ प्रयुक्त है और מן का संबंधपरक अर्थ ‘के सामने’ से व्यक्त हुआ है।
- source_word: יִטְהַר
  choice: शुद्ध ठहर सकता है
  rationale: טהר शुद्ध या स्वच्छ होने को दर्शाता है। ‘शुद्ध ठहरना’ पहली पंक्ति के न्यायिक-संबंधपरक समानांतर को बनाए रखते हुए नैतिक-आत्मिक शुद्धता व्यक्त करता है।
- source_word: גָּבֶר
  choice: मनुष्य
  rationale: גָּבֶר पुल्लिंग एकवचन है और यहाँ אֱנוֹשׁ के काव्यात्मक समानांतर में सामान्य मानव को दर्शाता है; ‘मनुष्य’ आधुनिक हिन्दी में सहज और गरिमापूर्ण है।
theological_decisions:
- issue: परमेश्वर के संबंध में मनुष्य का धार्मिक और शुद्ध ठहरना
  choice: पद को इस आलंकारिक प्रश्न के रूप में रखा गया है कि क्या नश्वर मनुष्य परमेश्वर के सामने धर्मी या शुद्ध ठहर सकता है।
  alternative: क्या मनुष्य परमेश्वर से अधिक धर्मी और अपने रचनेवाले से अधिक शुद्ध हो सकता है?
  rationale: מן वाली रचना संबंधपरक (‘के सामने’) अथवा तुलनात्मक (‘से अधिक’) समझी जा सकती है। मुख्य पाठ स्वाभाविक हिन्दी में संबंधपरक अर्थ देता है, पर वास्तविक तुलनात्मक संभावना को पाद-टिप्पणी में बनाए रखता है और किसी बाद की सिद्धान्तगत प्रणाली को पद में आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण काव्यात्मक गद्य अपनाया गया है। दोनों समानांतर प्रश्नों की संरचना बनाए रखी गई है। ‘धर्मी ठहरना’ न्यायिक-संबंधपरक अर्थ देता है और ‘नश्वर’ मानव की दुर्बलता को उभारता है।
