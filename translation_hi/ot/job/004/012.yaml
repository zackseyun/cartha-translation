  text: A word was secretly brought to me[a], and my ear caught a whisper of it.
translation:
  language: hi
  text: एक बात चुपके से मुझे पहुँचाई गई, और मेरे कान ने उसकी हल्की-सी फुसफुसाहट[a] पकड़ ली।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे कान को उसकी हल्की-सी भनक मिली” अथवा “मेरे कान ने उसकी मंद-सी ध्वनि सुनी।”
    reason: שֵׁמֶץ थोड़े अंश, हल्के संकेत, या मंद ध्वनि का अर्थ दे सकता है।
lexical_decisions:
- source_word: וְאֵלַי
  choice: मुझ तक
  rationale: पूर्वसर्ग का दिशात्मक अर्थ स्वाभाविक हिन्दी में ‘मुझ तक’ से व्यक्त होता है। आरम्भिक וְ का संबंध-सूचक बल वाक्य-प्रवाह में निहित है; कोई स्पष्ट कालवाचक ‘अब’ नहीं जोड़ा गया।
- source_word: דָּבָר
  choice: एक वचन
  rationale: प्रकाशन-सदृश इस प्रसंग में ‘वचन’ संक्षिप्त और रहस्यमय भाव बनाए रखता है, बिना इसे पूर्ण ‘संदेश’ मानकर अर्थ सीमित किए।
- source_word: יְגֻנָּב
  choice: चुपके से ... पहुँचा
  rationale: גנב के निष्क्रिय रूप का यहाँ आलंकारिक अर्थ गुप्त या दबे ढंग से आने का है। शाब्दिक ‘चुराया गया’ हिन्दी पाठक को वास्तविक चोरी का भ्रामक बिंब दे सकता है।
- source_word: וַתִּקַּח
  choice: पकड़ ली
  rationale: मूल क्रिया ‘लेना’ है और उसका कर्ता ‘मेरा कान’ है। श्रवण के प्रसंग में ‘पकड़ ली’ मूल के सजीव शारीरिक बिंब को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אָזְנִי
  choice: मेरे कान ने
  rationale: हिब्रू के एकवचन और उसके सजीव शारीरिक बिंब को सुरक्षित रखा गया है।
- source_word: שֵׁמֶץ
  choice: हल्की-सी फुसफुसाहट
  rationale: यह संज्ञा थोड़े अंश, संकेत या मंद ध्वनि को व्यक्त कर सकती है। श्रवण और रहस्यमय अनुभव के संदर्भ में ‘हल्की-सी फुसफुसाहट’ उपयुक्त है; अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: מֶנְהוּ
  choice: उसकी
  rationale: पूर्वसर्ग और सर्वनाम का संबंध पहले आए ‘वचन’ से है; हिन्दी में ‘उसकी ... फुसफुसाहट’ स्वाभाविक रूप से ‘उसमें से/उसका कुछ’ का भाव देता है।
