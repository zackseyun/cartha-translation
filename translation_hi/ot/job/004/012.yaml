  register: भाषा आधुनिक, गरिमापूर्ण और सहज रखी गई है। ‘वचन’ प्रकाशन के प्रसंग के अनुकूल है, जबकि ‘चुपके से’ और ‘कान ने ... पकड़ ली’ मूल के रहस्यमय तथा सजीव बिंब को बनाए रखते हैं।
