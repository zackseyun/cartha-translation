  yaml_path: translation/ot/job/004/003.yaml
  text: Behold[a], you have instructed many, and you have strengthened weak hands.
translation:
  language: hi
  text: देखो, तुमने बहुतों को शिक्षा दी है[a] और निर्बल हाथों को मज़बूत किया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अनुशासित किया है” अथवा “सुधारा है”; इब्रानी क्रिया में सुधार के द्वारा शिक्षा देने का भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला कथन-सूचक है। आधुनिक हिन्दी में ‘देखो’ काव्यात्मक बल को स्वाभाविक ढंग से बनाए रखता है।
- source_word: יִסַּרְתָּ
  choice: शिक्षा दी है
  rationale: יסר में सुधार, अनुशासन और सुधारात्मक शिक्षा के अर्थ शामिल हो सकते हैं। यहाँ अय्यूब द्वारा पहले दूसरों का मार्गदर्शन करने की प्रशंसा की जा रही है, इसलिए ‘शिक्षा दी है’ मुख्य पाठ में सबसे उपयुक्त है; अन्य अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: רַבִּים
  choice: बहुतों को
  rationale: यह अनिश्चित बहुवचन समूह को व्यक्त करता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: יָדַיִם רָפוֹת
  choice: निर्बल हाथों
  rationale: शाब्दिक शारीरिक रूपक को बनाए रखते हुए यह घटे हुए सामर्थ्य या निरुत्साह का भाव व्यक्त करता है।
- source_word: תְּחַזֵּק
  choice: मज़बूत किया है
  rationale: חזק के पिएल रूप का अर्थ ‘मज़बूत करना’ है। समानांतर पंक्ति और पूर्वकालीन संदर्भ के कारण हिन्दी पूर्ण पक्ष यहाँ स्वाभाविक है, जबकि हाथों का मूल रूपक भी बना रहता है।
theological_decisions: []
