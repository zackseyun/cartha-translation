  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक शैली रखी गई है। संबोधन के लिए स्वाभाविक ‘तुम’ रूप अपनाया गया है; ‘निर्बल हाथ’ का इब्रानी रूपक ज्यों का त्यों सुरक्षित है।
