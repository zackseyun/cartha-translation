  choice: और बुद्धि के बिना
  rationale: हिब्रू की संक्षिप्त और अर्थगत रूप से खुली अभिव्यक्ति को स्वाभाविक हिन्दी में रखता है; यह ‘बुद्धि पाए बिना’ और ‘बुद्धिमानी से नहीं’ जैसी संभावनाओं को टिप्पणी में खुला छोड़ता है।
