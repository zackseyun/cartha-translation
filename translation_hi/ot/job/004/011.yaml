  text: The lion perishes for lack of prey[a], and the cubs of the lion are scattered.
translation:
  language: hi
  text: 'शिकार न मिलने से सिंह मर जाता है,

    और सिंह के बच्चे तितर-बितर हो जाते हैं।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सिंहनी के बच्चे।” इब्रानी में यहाँ सिंह के लिए प्रयुक्त शब्द सिंह या सिंहनी—दोनों को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לַיִשׁ
  choice: सिंह
  rationale: यह शब्द प्रायः बलवान या परिपक्व सिंह को सूचित करता है; यहाँ केवल ‘सिंह’ स्वाभाविक है और अनावश्यक विशिष्टीकरण से बचता है।
- source_word: אֹבֵד
  choice: मर जाता है
  rationale: क्रिया नष्ट होने या प्राण खोने का भाव देती है। इस संदर्भ में ‘मर जाता है’ स्पष्ट, स्वाभाविक और कहावत-जैसी काव्य-पंक्ति के अनुकूल है।
- source_word: מִבְּלִי
  choice: न मिलने से
  rationale: यह अभाव के कारण को व्यक्त करता है; ‘शिकार न मिलने से’ आधुनिक हिन्दी में स्वाभाविक ढंग से कारण बताता है।
- source_word: טָרֶף
  choice: शिकार
  rationale: यह सामान्य भोजन नहीं, बल्कि हिंस्र पशु द्वारा पकड़े गए शिकार को सूचित करता है और सिंह के बिंब को बनाए रखता है।
- source_word: בְנֵי
  choice: बच्चे
  rationale: शाब्दिक अर्थ ‘पुत्र’ है, पर पशुओं के प्रसंग में ‘बच्चे’ सहज हिन्दी है और वंश-संबंध का भाव भी रखता है।
- source_word: לָבִיא
  choice: सिंह
  rationale: यह शब्द सिंह या सिंहनी के लिए प्रयुक्त हो सकता है। मुख्य पाठ में व्यापक ‘सिंह’ रखा गया है; लिंग-संबंधी वास्तविक अस्पष्टता पादटिप्पणी में दी गई है।
- source_word: יִתְפָּרָדוּ
  choice: तितर-बितर हो जाते हैं
  rationale: क्रिया अलग हो जाने या बिखर जाने को व्यक्त करती है; यह चयन झुंड अथवा परिवार के विघटन का परिणाम स्वाभाविक हिन्दी में बताता है।
