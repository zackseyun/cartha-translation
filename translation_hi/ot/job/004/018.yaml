source:
  edition: WLC
  text: הֵ֣ן בַּ֭/עֲבָדָי/ו לֹ֣א יַאֲמִ֑ין וּ֝/בְ/מַלְאָכָ֗י/ו יָשִׂ֥ים תָּהֳלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/018.yaml
  text: Look[a], he puts no trust in his servants[b], and he charges his messengers with error.
translation:
  language: hi
  text: देखो, वह अपने सेवकों पर भरोसा नहीं करता, और अपने दूतों[a] पर दोष[b] लगाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘स्वर्गदूतों’। इब्रानी शब्द मानवीय या स्वर्गीय दूतों, दोनों के लिए प्रयुक्त हो सकता है; यहाँ प्रसंग संभवतः स्वर्गीय प्राणियों की ओर संकेत करता है।
    reason: alternative_reading
  - marker: b
    text: ‘दोष’ के लिए ‘त्रुटि’, ‘मूर्खता’, ‘कमी’ या ‘अपूर्णता’ भी संभव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: देखो
  rationale: यह शब्द ध्यान आकर्षित करते हुए कथन पर बल देता है। ‘देखो’ आधुनिक, सहज और गरिमापूर्ण हिन्दी में उसका बल बनाए रखता है।
- source_word: בַּעֲבָדָיו
  choice: अपने सेवकों पर
  rationale: हिफ़ील रूप אמן के साथ ב भरोसे के लक्ष्य को सूचित करता है। यहाँ ‘सेवक’ अधीन भूमिका को व्यक्त करता है; सामाजिक दासता पर बल देना प्रसंग का उद्देश्य नहीं है।
- source_word: לֹא יַאֲמִין
  choice: भरोसा नहीं करता
  rationale: यहाँ אמן का हिफ़ील रूप बौद्धिक विश्वास के बजाय भरोसा या विश्वास रखने का भाव देता है।
- source_word: וּבְמַלְאָכָיו
  choice: और अपने दूतों पर
  rationale: מַלְאָך का मूल अर्थ ‘दूत’ है और यह मानवीय अथवा स्वर्गीय संदेशवाहक के लिए प्रयुक्त हो सकता है। प्रसंग संभवतः स्वर्गीय प्राणियों की ओर संकेत करता है, पर मुख्य पाठ में ‘दूत’ मूल की व्यापकता बनाए रखता है।
- source_word: יָשִׂים
  choice: लगाता है
  rationale: שׂים और अमूर्त संज्ञा का यह प्रयोग किसी पर कोई बात आरोपित करने या उसके खाते में डालने का भाव देता है; ‘दोष लगाता है’ स्वाभाविक हिन्दी में इसे व्यक्त करता है।
- source_word: תָּהֳלָה
  choice: दोष
  rationale: यह दुर्लभ संज्ञा त्रुटि, मूर्खता, कमी या अपूर्णता का भाव दे सकती है। ‘दोष’ हिन्दी में इस अर्थ-क्षेत्र को संक्षेप में और स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: מַלְאָכָיו को विशेष रूप से ‘स्वर्गदूतों’ या व्यापक रूप से ‘दूतों’ के रूप में अनूदित करना
  choice: दूतों
  alternative: स्वर्गदूतों
  rationale: इब्रानी शब्द का मूल अर्थ ‘दूत’ है, यद्यपि इस काव्यात्मक प्रसंग में स्वर्गीय प्राणी अभिप्रेत होने की अधिक संभावना है। मुख्य पाठ व्यापक शब्द रखता है और पादटिप्पणी संभावित विशिष्ट अर्थ बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और काव्यात्मक कथन के अनुकूल रखी गई है। ‘देखो’ आरम्भिक बल को बनाए रखता है, जबकि ‘दोष लगाता है’ दुर्लभ इब्रानी संज्ञा और उसके साथ प्रयुक्त क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
