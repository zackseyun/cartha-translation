base_translation:
  language: en
  yaml_path: translation/ot/job/004/013.yaml
  text: Amid disquieting thoughts from visions of the night[a], when deep sleep falls on men[b],
translation:
  language: hi
  text: रात के दर्शनों से उपजे बेचैन करनेवाले विचारों के बीच[a], जब मनुष्यों पर गहरी नींद छा जाती है[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “रात के दर्शनों से आए व्याकुल विचारों के बीच।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में व्याकरणतः पुल्लिंग बहुवचन है; यहाँ इसका अर्थ सामान्य रूप से मनुष्य है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשְׂעִפִּים
  choice: बेचैन करनेवाले विचारों के बीच
  rationale: שְׂעִפִּים यहाँ मन को बाँटने या व्याकुल करनेवाले विचारों अथवा चिंतन को सूचित करता है। यह चयन रात के भयावह अनुभव के संदर्भ में मानसिक अशांति को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: מֵחֶזְיֹנוֹת לָיְלָה
  choice: रात के दर्शनों से उपजे
  rationale: חֶזְיֹנוֹת का अर्थ ‘दर्शन’ है और לָיְלָה उसे रात से जोड़ता है। מִן स्रोत अथवा अवसर सूचित करता है; ‘से उपजे’ विचारों और दर्शनों के संबंध को हिन्दी में स्पष्ट करता है, बिना कारणता को आवश्यकता से अधिक निश्चित किए।
- source_word: בִּנְפֹל
  choice: जब ... छा जाती है
  rationale: בְּ के साथ infinitive construct समयवाचक उपवाक्य बनाता है। हिन्दी में नींद के लिए ‘जब ... छा जाती है’ स्वाभाविक है और मूल के ‘पड़ने’ के भाव को ठीक से पहुँचाता है।
- source_word: תַּרְדֵּמָה
  choice: गहरी नींद
  rationale: תַּרְדֵּמָה साधारण नींद नहीं, बल्कि भारी या गहरी निद्रा को दर्शाता है।
- source_word: עַל אֲנָשִׁים
  choice: मनुष्यों पर
  rationale: אֲנָשִׁים व्याकरणतः पुल्लिंग बहुवचन है, पर यहाँ सामान्य रूप से मानव जाति के सदस्यों को सूचित करता है। ‘मनुष्यों’ हिन्दी में इस सामान्य अर्थ को सटीक और गरिमापूर्ण ढंग से व्यक्त करता है।
theological_decisions:
- issue: אֲנָשִׁים का सामान्य मानव-संदर्भ
  choice: मनुष्यों
  alternative: पुरुषों
  rationale: संदर्भ में इब्रानी पुल्लिंग बहुवचन का बल केवल पुरुषों पर नहीं, सामान्य मानव अनुभव पर है। ‘मनुष्यों’ मूल के व्याकरणिक रूप को सांप्रदायिक या लिंग-विशेष अर्थ दिए बिना व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; काव्यात्मक किंतु सहज और गरिमापूर्ण शैली। ‘दर्शन’ बाइबिलीय दृश्य-अनुभव के लिए रखा गया है और ‘बेचैन करनेवाले विचार’ मानसिक अशांति को सामान्य पाठक के लिए स्पष्ट करता है।
