base_translation:
  language: en
  yaml_path: translation/ot/job/004/008.yaml
  text: As I have seen[b][a], those who plow iniquity and sow trouble reap it.
translation:
  language: hi
  text: जैसा कि मैंने देखा है, जो अधर्म[a] जोतते और दुःख[b] बोते हैं, वे उसी को काटते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बुराई”; इब्रानी शब्द नैतिक दुष्टता और कुछ प्रसंगों में उससे उत्पन्न अनर्थ या संकट का भी बोध करा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “कष्ट” अथवा “हानि”
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: जैसा
  rationale: यह एलीपज के अनुभव पर आधारित तुलना या अवलोकन का परिचय देता है; ‘जैसा मैंने देखा है’ हिब्रू की अभिव्यक्ति को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: רָאִיתִי
  choice: मैंने देखा है
  rationale: प्रथम पुरुष एकवचन पूर्ण क्रिया यहाँ वक्ता के अब तक के अनुभवजन्य अवलोकन को व्यक्त करती है।
- source_word: חֹרְשֵׁי
  choice: जो ... जोतते
  rationale: कृदन्त का संज्ञात्मक प्रयोग है; यह रूप कृषि-रूपक को स्पष्ट और स्वाभाविक रखता है।
- source_word: אָוֶן
  choice: अधर्म
  rationale: इस प्रसंग में शब्द नैतिक बुराई या दुष्कर्म का संकेत करता है। ‘अधर्म’ उसके नैतिक आशय को बनाए रखता है, जबकि उसकी व्यापक अर्थ-सीमा पादटिप्पणी में दी गई है।
- source_word: וְזֹרְעֵי
  choice: और ... बोते
  rationale: समांतर कृदन्त कृषि-रूपक को आगे बढ़ाता है; हिन्दी में कर्ता ‘जो’ को दोहराए बिना वाक्य अधिक सहज रहता है।
- source_word: עָמָל
  choice: दुःख
  rationale: यह शब्द दुःख, कष्ट, हानि या संकट का बोध करा सकता है। यहाँ बोने और काटने के रूपक में ‘दुःख’ कारण और उसके फल दोनों की अर्थ-छाया को बनाए रखता है।
- source_word: יִקְצְרֻהוּ
  choice: वे उसी को काटते हैं
  rationale: क्रिया का प्रत्यय पूर्ववर्ती अधर्म और दुःख को समष्टिगत रूप से फिर ग्रहण करता है। ‘उसी को’ अनुरूप फल पर बल देता है और ‘काटते हैं’ बोने-काटने के रूपक को सुरक्षित रखता है।
theological_decisions:
- issue: एलीपज के कथन में नैतिक कारण और फल का संबंध
  choice: कथन को एलीपज के देखे हुए सिद्धांत के रूप में सीधे और प्रभावशाली ढंग से प्रस्तुत किया गया है।
  alternative: इसे प्रतिफल के बारे में परम और अंतिम धर्मवैज्ञानिक घोषणा बनाना, अथवा इसे केवल एक हल्की सामान्य प्रवृत्ति बताना।
  rationale: यह अय्यूब से कहे गए एलीपज के तर्क का भाग है। अनुवाद उसके दावे की शक्ति को बनाए रखता है, पर उसे पूरी पुस्तक का अंतिम धर्मवैज्ञानिक निष्कर्ष नहीं ठहराता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और रूपक-संरक्षक शैली अपनाई गई है। ‘जोतते—बोते—काटते’ की कृषि-शब्दावली मूल समानांतरता को बनाए रखती है।
