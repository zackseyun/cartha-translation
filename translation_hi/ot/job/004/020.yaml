  yaml_path: translation/ot/job/004/020.yaml
  text: From morning to evening they are crushed; without anyone taking notice[a], they perish forever.
translation:
  language: hi
  text: भोर से साँझ तक वे कुचल दिए जाते हैं; बिना किसी के ध्यान दिए[a] वे सदा के लिए नष्ट हो जाते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बिना किसी के मन लगाने के” अथवा “बिना किसी के उनकी दशा की परवाह किए।”
    reason: मूल इब्रानी मुहावरा संक्षिप्त है और ध्यान देने, मन लगाने, या परवाह करने के निकट अर्थ दे सकता है।
lexical_decisions:
- source_word: מִבֹּקֶר לָעֶרֶב
  choice: भोर से साँझ तक
  rationale: यह काल-सूचक युग्म एक ही दिन की अवधि के भीतर मनुष्य की क्षणभंगुरता पर बल देता है। यह हिन्दी में स्वाभाविक है और इब्रानी बिंब को बनाए रखता है।
- source_word: יֻכַּתּוּ
  choice: वे कुचल दिए जाते हैं
  rationale: होफ़ाल रूप प्रहार करके गिराए या कुचले जाने का कर्मवाच्य भाव देता है। यह अनुवाद क्रिया के ढंग को अनावश्यक रूप से सीमित किए बिना उस भाव को सुरक्षित रखता है।
- source_word: מִבְּלִי מֵשִׂים
  choice: किसी के ध्यान दिए बिना
  rationale: यह संक्षिप्त मुहावरा सम्भवतः मन या हृदय लगाने की ओर संकेत करता है। चुना हुआ वाक्यांश इस अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है कि उनकी दशा पर कोई ध्यान नहीं देता।
- source_word: לָנֶצַח
  choice: सदा के लिए
  rationale: यह शब्द यहाँ विनाश की स्थायी और अपरिवर्तनीय परिणति पर बल देता है। हिन्दी पद मूल की व्यापकता को बनाए रखता है।
- source_word: יֹאבֵדוּ
  choice: वे नष्ट हो जाते हैं
  rationale: אבד का क़ाल रूप नष्ट होने, मिट जाने या विनाश को प्राप्त होने का व्यापक अर्थ रखता है। यह चयन किसी अधिक संकीर्ण धर्मवैज्ञानिक अर्थ को आरोपित नहीं करता।
theological_decisions:
- issue: एलीपज के कथन में मनुष्य की मृत्यु की अंतिमता
  choice: पद को मनुष्य की क्षणभंगुरता और अनदेखी, अपरिवर्तनीय मृत्यु के कथन के रूप में रखा गया है।
  alternative: “सदा के लिए” को अंतिम युगांतकारी दण्ड या अनन्त विनाश का स्पष्ट दावा मानना।
  rationale: संदर्भ में एलीपज परमेश्वर के सामने नश्वर मनुष्यों की दुर्बलता बता रहा है। अनुवाद मूल की अंतिमता को सुरक्षित रखता है, पर उसे विकसित परलोक-सिद्धान्त में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली अपनाई गई है। “भोर” और “साँझ” मूल के दिन-संबंधी बिंब को स्वाभाविक हिन्दी में बनाए रखते हैं।
