translation:
  language: hi
  text: तो फिर मिट्टी के घरों में रहनेवालों की तो बात ही क्या, जिनकी नींव धूल में है—वे पतंगे के सामने कुचल दिए जाते हैं!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַף
  choice: तो फिर वे कितने अधिक
  rationale: 'पद 18 से निकले अधिक बलवान निष्कर्ष को व्यक्त करता है: यदि परमेश्वर अपने सेवकों पर भरोसा नहीं रखता, तो नश्वर मनुष्यों की दशा कितनी अधिक ऐसी होगी।'
- source_word: שֹׁכְנֵי בָתֵּי חֹמֶר
  choice: जो मिट्टी के घरों में रहते हैं
  rationale: निरंतर निवास के कृदंत-भाव और मिट्टी से बने नाजुक निवास के रूपक—संभवतः मानव शरीर—दोनों को बनाए रखता है।
- source_word: בֶּעָפָר יְסוֹדָם
  choice: जिनकी नींव धूल में है
  rationale: עָפָר के शाब्दिक 'धूल' और उससे जुड़े नश्वरता के संकेत को सुरक्षित रखता है; एकवचन 'नींव' सामूहिक भाव के अनुरूप है।
- source_word: יְדַכְּאוּם
  choice: वे ... कुचल दिए जाते हैं
  rationale: क्रिया के कुचलने के अर्थ को निष्क्रिय रूप में व्यक्त करता है, ताकि इब्रानी में अनिर्दिष्ट कर्ता को न जोड़ा जाए।
- source_word: לִפְנֵי עָשׁ
  choice: पतंगे के सामने ही
  rationale: לִפְנֵי का मूल स्थानगत चित्र सुरक्षित रखता है; 'ही' मानव की अत्यधिक दुर्बलता को स्वाभाविक हिंदी में उभारता है, जबकि तीव्रता या सहजता की संभावित तुलनात्मक व्याख्या पादटिप्पणी में दी गई है।
theological_decisions:
- issue: '''मिट्टी के घरों'' का रूपकात्मक संकेत'
  choice: नश्वर मनुष्य की देह और उसकी पार्थिव दुर्बलता का रूपक
  alternative: मिट्टी की ईंटों से बने वास्तविक घर, जो मानव असुरक्षा का व्यापक चित्र प्रस्तुत करते हैं
  rationale: संदर्भ स्वर्गीय सेवकों की तुलना मनुष्यों से करता है। मुख्य पाठ रूपक को खोलकर परिभाषित नहीं करता, इसलिए उसका काव्यात्मक तनाव बना रहता है।
- issue: '''पतंगे के सामने'' का अर्थ'
  choice: शाब्दिक छवि को मुख्य पाठ में बनाए रखना
  alternative: पतंगे से भी जल्दी अथवा पतंगे से भी आसानी से कुचल दिए जाते हैं
  rationale: इब्रानी לִפְנֵי स्थानगत 'सामने/पहले' और तुलनात्मक तीव्रता या सहजता—दोनों की संभावना रखता है; एक अर्थ को निर्णायक रूप से थोपने के बजाय विकल्प पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में काव्यात्मक और गरिमापूर्ण शैली रखी गई है। 'मिट्टी के घर', 'धूल' और 'पतंगा' जैसी मूल छवियाँ सुरक्षित हैं। वाक्य को पद 18 से जुड़े निष्कर्ष के रूप में स्वाभाविक बनाने के लिए 'तो फिर ... कितने अधिक' अपनाया गया है।
