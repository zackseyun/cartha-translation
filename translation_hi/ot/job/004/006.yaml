id: JOB.4.6
reference: Job 4:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הֲ/לֹ֣א יִ֭רְאָתְ/ךָ כִּסְלָתֶ֑/ךָ תִּ֝קְוָתְ/ךָ֗ וְ/תֹ֣ם דְּרָכֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/006.yaml
  text: Is not your fear of God your confidence[c][b][a], and the integrity of your ways your hope?
translation:
  language: hi
  text: क्या परमेश्वर का भय[a] तुम्हारा भरोसा[b] नहीं है, और तुम्हारे मार्गों की खराई[c] तुम्हारी आशा नहीं है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या केवल, “तुम्हारा भय”; इब्रानी में भय का उद्देश्य स्पष्ट नहीं है, यद्यपि ज्ञान-साहित्य में प्रायः इसका अर्थ परमेश्वर का भय होता है।
    reason: lexical_alternative
  - marker: b
    text: या “तुम्हारा आत्मविश्वास।”
    reason: lexical_alternative
  - marker: c
    text: या “तुम्हारे मार्गों की निर्दोषता।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: क्या ... नहीं है?
  rationale: यह प्रश्नवाचक पद ऐसे आलंकारिक प्रश्न का परिचय देता है जिसमें सहमति की अपेक्षा है। हिंदी में ‘क्या ... नहीं है?’ उसके प्रश्नात्मक बल को स्वाभाविक ढंग से बनाए रखता है।
- source_word: יִרְאָתְךָ
  choice: परमेश्वर का भय
  rationale: इब्रानी में भय का उद्देश्य स्पष्ट रूप से नहीं दिया गया है, पर ज्ञान-साहित्य के संदर्भ में इसका सामान्य आशय परमेश्वर का भय होता है। मुख्य पाठ में इसे स्पष्ट किया गया है और संक्षिप्त विकल्प पादटिप्पणी में रखा गया है।
- source_word: כִּסְלָתֶךָ
  choice: तुम्हारा भरोसा
  rationale: इस संदर्भ में संज्ञा का अर्थ ‘भरोसा’ या ‘आत्मविश्वास’ है, न कि इसी मूल से जुड़ा संभावित अर्थ ‘मूर्खता’। ‘भरोसा’ आधुनिक हिंदी में स्वाभाविक है और आशा के साथ काव्यात्मक समानांतरता रखता है।
- source_word: תִּקְוָתְךָ
  choice: तुम्हारी आशा
  rationale: תִּקְוָה का मानक अर्थ यहाँ ‘आशा’ है; यह अपेक्षा और भविष्य की आश्वस्त दृष्टि दोनों को व्यक्त करता है।
- source_word: וְתֹם
  choice: और ... खराई
  rationale: תֹּם संपूर्णता, निष्कपटता या निर्दोषता का बोध कराता है। ‘खराई’ नैतिक अखंडता को सहज और अनावश्यक रूप से निरपेक्ष बनाए बिना व्यक्त करती है।
- source_word: דְּרָכֶיךָ
  choice: तुम्हारे मार्गों की
  rationale: ‘मार्ग’ मूल इब्रानी रूपक और ज्ञान-साहित्य की भाषा को बनाए रखता है; प्रसंग में इसका आशय जीवन-आचरण से है।
theological_decisions:
- issue: ‘भय’ का अंतर्निहित उद्देश्य
  choice: मुख्य पाठ में ‘परमेश्वर का भय’
  alternative: ‘तुम्हारा भय’ अथवा ‘तुम्हारी श्रद्धा’
  rationale: मूल इब्रानी उद्देश्य को स्पष्ट नहीं करता, इसलिए वास्तविक अस्पष्टता को पादटिप्पणी में बताया गया है। फिर भी अय्यूब और व्यापक ज्ञान-साहित्य में संभावित आशय परमेश्वर का भय है; इसे मुख्य पाठ में स्पष्ट करना आधुनिक पाठक के लिए अर्थ को सुबोध बनाता है।
- issue: दो संज्ञात्मक उपवाक्यों का संबंध
  choice: 'दो समानांतर कथन: ‘परमेश्वर का भय—भरोसा’ और ‘मार्गों की खराई—आशा’'
  alternative: चारों संज्ञाओं को एक ही सूची या संयुक्त कथन के रूप में पढ़ना
  rationale: इब्रानी पदक्रम और काव्यात्मक संतुलन दो समानांतर उपवाक्यों का समर्थन करते हैं। यह अनुवाद उसी संरचना को स्पष्ट हिंदी में बनाए रखता है और पद के नैतिक-धार्मिक तनाव को किसी अतिरिक्त व्याख्या से नहीं सुलझाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘मार्ग’ से मूल ज्ञान-साहित्य का रूपक बचाया गया है, जबकि ‘खराई’ नैतिक अर्थ को स्वाभाविक हिंदी में व्यक्त करती है। आलंकारिक प्रश्न और दोनों समानांतर खंड स्पष्ट रूप से सुरक्षित हैं।
