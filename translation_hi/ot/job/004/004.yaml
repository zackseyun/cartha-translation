  text: Your words have raised up the one who stumbles[b][a], and you have strengthened knees that were giving way.
translation:
  language: hi
  text: तेरे वचन लड़खड़ाते हुए व्यक्ति को खड़ा कर देते थे[a], और झुकते हुए घुटनों[b] को तू दृढ़ करता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘संभालकर खड़ा रखते थे।’
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ ‘झुकते हुए घुटने’; आशय है निर्बलता के कारण लड़खड़ाते या ढीले पड़ते हुए घुटने।
    reason: lexical_alternative
lexical_decisions:
- source_word: כּוֹשֵׁל
  choice: लड़खड़ाते हुए व्यक्ति
  rationale: כשל का कृदन्त ऐसे व्यक्ति को दर्शाता है जो लड़खड़ा या डगमगा रहा हो। यह चयन मूल की सजीव क्रियात्मक छवि को बनाए रखता है और केवल सामान्य अर्थ ‘निर्बल’ तक सीमित नहीं करता।
- source_word: יְקִימוּן
  choice: खड़ा कर देते थे
  rationale: קום के हिफ़ील रूप का अर्थ यहाँ ‘खड़ा करना’ या ‘संभालकर खड़ा रखना’ है। प्रसंग में अपूर्ण क्रिया अय्यूब के पहले के नियमित आचरण को दर्शाती है, इसलिए हिन्दी में अभ्याससूचक भूतकाल स्वाभाविक है।
- source_word: מִלֶּיךָ
  choice: तेरे वचन
  rationale: מִלָּה का बहुवचन सीधे तौर पर ‘वचन’ या ‘बातें’ है। ‘वचन’ यहाँ गरिमापूर्ण और सहज है तथा प्रेरक कथनों का आशय स्पष्ट रखता है।
- source_word: בִרְכַּיִם
  choice: घुटनों
  rationale: मूल के शारीरिक बिम्ब को सीधे रखा गया है, क्योंकि निर्बलता से झुकते घुटनों की छवि हिन्दी में भी समझ में आती है।
- source_word: כֹּרְעוֹת
  choice: झुकते हुए
  rationale: כרע का अर्थ झुकना, घुटने टेकना या नीचे धँसना है। ‘झुकते हुए’ मूल रूपक को सुरक्षित रखता है; पादटिप्पणी स्पष्ट करती है कि यहाँ निर्बलता से जवाब देते घुटने अभिप्रेत हैं।
- source_word: תְּאַמֵּץ
  choice: तू दृढ़ करता था
  rationale: אמץ के पिएल रूप का अर्थ मजबूत या दृढ़ करना है। ‘दृढ़ करता था’ घुटनों के शारीरिक रूपक और पहले खंड के अभ्याससूचक भूतकाल—दोनों के समानान्तर है।
