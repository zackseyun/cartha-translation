  register: आधुनिक मानक हिन्दी में काव्यात्मक समानान्तरता और मूल के शारीरिक बिम्ब सुरक्षित रखे गए हैं। एकवचन सम्बोधन के लिए निकट और सीधा ‘तेरे/तू’ प्रयोग किया गया है। दोनों अपूर्ण क्रियाओं को प्रसंगानुसार नियमित भूतकाल (‘कर देते थे’, ‘करता था’) में प्रस्तुत किया गया है।
