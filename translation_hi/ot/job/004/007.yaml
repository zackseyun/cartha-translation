  yaml_path: translation/ot/job/004/007.yaml
  text: 'Please remember: who that was innocent ever perished? Or where were the upright cut off?[a][b]'
translation:
  language: hi
  text: 'याद तो करो: कौन निर्दोष व्यक्ति कभी नष्ट हुआ है? या कहाँ सीधे-सच्चे लोग मिटा दिए गए हैं?[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘निर्दोष’ के स्थान पर ‘निष्कलंक’।
    reason: lexical_alternative
  - marker: b
    text: ‘मिटा दिए गए हैं’ के स्थान पर ‘समूल नाश किए गए हैं’ या ‘काट डाले गए हैं’।
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכָר נָא
  choice: याद तो करो
  rationale: आज्ञार्थक क्रिया זְכָר के साथ विनय अथवा आग्रहसूचक נָא है। ‘याद तो करो’ आधुनिक हिन्दी में आग्रह और विचार करने के आह्वान—दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִי הוּא
  choice: कौन ... कभी
  rationale: प्रश्नवाचक सर्वनाम और बलसूचक הוּא मिलकर आलंकारिक प्रश्न को उभारते हैं। हिन्दी में ‘कौन ... कभी’ उसी जोर को सहज ढंग से व्यक्त करता है।
- source_word: נָקִי
  choice: निर्दोष
  rationale: यह शब्द दोष या अपराध से मुक्त होने का भाव देता है। ‘निर्दोष’ स्पष्ट, प्रचलित और प्रसंगानुकूल है।
- source_word: אָבָד
  choice: नाश हुआ
  rationale: Qal पूर्ण क्रिया विनाश या मिट जाने को सूचित करती है। ‘नाश हुआ’ इसकी गंभीरता और अकर्मक रूप को बनाए रखता है।
- source_word: וְאֵיפֹה
  choice: और कहाँ
  rationale: संयोजक וְ और प्रश्नवाचक אֵיפֹה समानांतर दूसरा प्रश्न प्रस्तुत करते हैं; ‘और कहाँ’ मूल संरचना को स्वाभाविक हिन्दी में रखता है।
- source_word: יְשָׁרִים
  choice: सीधे लोग
  rationale: बहुवचन विशेषण यहाँ संज्ञा के रूप में नैतिक रूप से सीधे व्यक्तियों के लिए प्रयुक्त है। ‘सीधे लोग’ सामान्य पाठक के लिए सहज है और ‘ईमानदार’ की अपेक्षा मूल ‘सीधाई’ की छवि को अधिक सुरक्षित रखता है।
- source_word: נִכְחָדוּ
  choice: मिटा दिए गए
  rationale: כחד का Niphal रूप छिपा दिए जाने, मिट जाने या विनष्ट होने का अर्थ दे सकता है। इस प्रसंग में ‘मिटा दिए गए’ विनाशसूचक अर्थ तथा निष्क्रिय भाव दोनों को व्यक्त करता है।
theological_decisions:
- issue: निर्दोष और सीधे लोगों के भाग्य के विषय में एलीपज का आलंकारिक दावा
  choice: कथन को एलीपज के सीधे आलंकारिक दावे के रूप में प्रस्तुत किया गया है।
  alternative: ऐसा व्याख्यात्मक अनुवाद जो पुस्तक के व्यापक कथानक के आधार पर इसी पद में उसके दावे को संदिग्ध ठहराए।
  rationale: मूल पद एलीपज की धारणा को बिना किसी कथाकार-संबंधी टिप्पणी के प्रश्नों में रखता है। अनुवाद न तो इसे अंतिम सत्य घोषित करता है, न पुस्तक में बाद में उभरने वाले तनाव को समय से पहले शब्दों में जोड़ता है।
translation_notes:
  register: भाषा आधुनिक, dignified और सामान्य पाठक के लिए सुबोध रखी गई है। ‘याद तो करो’ में आग्रह का स्वाभाविक हिन्दी बल है। दोनों आलंकारिक प्रश्नों की समानांतरता और एलीपज के कथन का अंतर्निहित धार्मिक तनाव सुरक्षित रखा गया है।
