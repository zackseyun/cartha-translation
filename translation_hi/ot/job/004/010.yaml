  yaml_path: translation/ot/job/004/010.yaml
  text: The lion’s roar[a], and the voice of the fierce lion, and the teeth of the young lions are broken.
translation:
  language: hi
  text: सिंह की दहाड़, भयंकर सिंह की आवाज़, और जवान सिंहों के दाँत टूट गए हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उखाड़ दिए गए हैं” अथवा “खींचकर निकाल दिए गए हैं।” इब्रानी क्रिया बलपूर्वक अलग करने या तोड़ने का भाव व्यक्त करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁאֲגַת
  choice: दहाड़
  rationale: यह सिंह की ऊँची, भयावह गर्जना के लिए स्वाभाविक और काव्यात्मक हिन्दी शब्द है।
- source_word: אַרְיֵה
  choice: सिंह
  rationale: सिंह के लिए मानक और गरिमापूर्ण हिन्दी शब्द; काव्यात्मक प्रसंग के अनुकूल है।
- source_word: קוֹל
  choice: आवाज़
  rationale: मूल अर्थ ‘आवाज़/स्वर’ है। ‘दहाड़’ के समानांतर रहते हुए भी मूल की शब्दगत भिन्नता बनाए रखता है।
- source_word: שָׁחַל
  choice: भयंकर सिंह
  rationale: यह सिंह के लिए प्रयुक्त एक काव्यात्मक शब्द है, जिसमें शक्ति और उग्रता का भाव हो सकता है। ‘भयंकर सिंह’ पहले ‘सिंह’ से भेद बनाए रखते हुए अनिश्चित ‘काला सिंह’ जैसे अतिविशिष्ट अर्थ से बचता है।
- source_word: שִׁנֵּי
  choice: दाँत
  rationale: यह ‘दाँत’ का बहुवचन संबंधरूप है और अगले पद के साथ स्वाभाविक हिन्दी में सीधा अनुवाद किया गया है।
- source_word: כְפִירִים
  choice: जवान सिंहों
  rationale: यह असहाय शावकों के बजाय युवा और शक्तिशाली सिंहों को सूचित करता है; ‘जवान सिंह’ उस भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: נִתָּעוּ
  choice: टूट गए हैं
  rationale: दाँतों के नष्ट या बलपूर्वक अलग किए जाने की छवि को सहज हिन्दी में व्यक्त करता है। क्रिया में उखाड़े जाने का संभावित भाव भी है, जिसे पादटिप्पणी में रखा गया है।
