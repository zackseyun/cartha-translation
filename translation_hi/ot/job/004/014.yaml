  yaml_path: translation/ot/job/004/014.yaml
  text: Fear came upon me[a], and trembling, and it made all my bones shake.
translation:
  language: hi
  text: 'भय मुझ पर आ पड़ा, और कंपकंपी भी;

    इस भय ने मेरी बहुत-सी हड्डियों[a] को दहला दिया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मेरी हड्डियों की बहुतायत।” यह इब्रानी की असामान्य काव्यात्मक अभिव्यक्ति है; इसका आशय “मेरी बहुत-सी हड्डियाँ” हो सकता है, अथवा पूरे शरीर में फैली तीव्र थरथराहट का चित्र हो सकता है।
    reason: मूल इब्रानी की असामान्य काव्यात्मक अभिव्यक्ति और उसके संभावित अर्थों को सुरक्षित रखना।
lexical_decisions:
- source_word: פַּחַד
  choice: भय
  rationale: यह संज्ञा भय या दहशत का बोध कराती है। ‘भय’ व्यापक, स्वाभाविक और काव्यात्मक प्रसंग के अनुकूल है।
- source_word: קְרָאַנִי
  choice: मुझ पर आ पड़ा
  rationale: यहाँ קרא का अर्थ पुकारना नहीं, बल्कि किसी से आ मिलना या उस पर अचानक आ पड़ना है। यह चुनाव अनुभव के आकस्मिक और अभिभूत करने वाले स्वर को व्यक्त करता है।
- source_word: וּרְעָדָה
  choice: और कंपकंपी भी
  rationale: यह भय के साथ होने वाली शारीरिक थरथराहट को दर्शाता है। ‘भी’ हिन्दी में संक्षिप्त इब्रानी समन्वय को स्वाभाविक बनाता है।
- source_word: וְרֹב עַצְמוֹתַי
  choice: मेरी सारी हड्डियों
  rationale: शाब्दिक रूप ‘मेरी हड्डियों की बहुतायत’ है। हिन्दी में ‘मेरी सारी हड्डियों’ तीव्र, सर्वांगिक शारीरिक प्रतिक्रिया को स्वाभाविक रूप से व्यक्त करता है; मूल की संभावित ‘बहुत-सी/अधिकांश’ समझ को पादटिप्पणी में रखा गया है।
- source_word: הִפְחִיד
  choice: दहला दिया
  rationale: פחד के हिफ़ील रूप में भय उत्पन्न करने का कारणवाचक भाव है। हड्डियों के साथ ‘दहला दिया’ भय और शरीर की कंपकंपी, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
