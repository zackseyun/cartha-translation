  yaml_path: translation/ot/job/004/016.yaml
  text: 'It stood still[a], but I could not recognize its appearance; a form was before my eyes; there was silence[b], and I heard a voice:'
translation:
  language: hi
  text: 'वह स्थिर खड़ा रहा, पर मैं उसका रूप पहचान न सका; मेरी आँखों के सामने एक आकृति थी। निस्तब्धता[a] थी, और मुझे एक आवाज़ सुनाई दी:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शांत स्थिरता।” इब्रानी शब्द गहरे मौन के साथ-साथ शांत, स्थिर वातावरण का भी बोध करा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲמֹד
  choice: स्थिर खड़ा रहा
  rationale: עמד का मूल अर्थ ‘खड़ा होना/खड़ा रहना’ है; दर्शन के इस प्रसंग में ‘स्थिर खड़ा रहा’ उस आकृति के सामने ठहरने का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְלֹא אַכִּיר
  choice: पर मैं ... पहचान न सका
  rationale: Hiphil נכר का अर्थ ‘पहचानना’ है। ‘पर’ उपस्थिति और पहचान न पाने के बीच विरोध दिखाता है, जबकि ‘न सका’ प्रसंगगत असमर्थता को सहज हिन्दी में व्यक्त करता है।
- source_word: מַרְאֵהוּ
  choice: उसका रूप
  rationale: מראה यहाँ दिखाई देने वाले रूप या स्वरूप को सूचित करता है। हिन्दी का ‘उसका’ अज्ञात दृश्य-सत्ता के लिंग या व्यक्तित्व को निर्णायक बनाए बिना पुल्लिंग एकवचन प्रत्यय के अनुरूप है।
- source_word: תְּמוּנָה
  choice: एक आकृति
  rationale: תמונה का अर्थ रूप, समानता या दिखाई देने वाली आकृति हो सकता है; ‘आकृति’ इस अस्पष्ट दृश्य छाप के लिए वर्तमान और स्वाभाविक हिन्दी है।
- source_word: לְנֶגֶד עֵינָי
  choice: मेरी आँखों के सामने
  rationale: यह वाक्यांश मूल के ‘मेरी आँखों के सामने’ वाले सजीव स्थान-बोध को सीधे और सहज रूप में रखता है।
- source_word: דְּמָמָה
  choice: निस्तब्धता छाई थी
  rationale: דממה मौन, निस्तब्धता या शांत ठहराव को व्यक्त कर सकता है। ‘निस्तब्धता छाई थी’ आवाज़ से पहले के शांत वातावरण को स्वाभाविक हिन्दी में दर्शाता है।
- source_word: וָקוֹל אֶשְׁמָע
  choice: फिर मुझे एक आवाज़ सुनाई दी
  rationale: קול का अर्थ आवाज़ या ध्वनि है; अगले पद में बोले गए शब्द आने के कारण ‘आवाज़’ उपयुक्त है। ‘फिर’ मौन के बाद सुनाई देने की क्रमिकता स्पष्ट करता है।
