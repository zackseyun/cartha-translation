  text: Then a spirit passed before my face[a]; the hair of my flesh bristled.
translation:
  language: hi
  text: तब एक आत्मा मेरे चेहरे के सामने से गुज़री[a]; मेरे शरीर के रोएँ खड़े हो गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “एक हवा” अथवा “एक साँस” मेरे चेहरे के सामने से गुज़री। हिब्रू शब्द רוּחַ का अर्थ “आत्मा,” “हवा” या “साँस” हो सकता है; यहाँ का प्रसंग “आत्मा” के पक्ष में है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרוּחַ
  choice: एक आत्मा
  rationale: רוּחַ का अर्थ ‘आत्मा’, ‘हवा’ या ‘साँस’ हो सकता है। इस भयावह दर्शन-संबंधी प्रसंग में किसी अदृश्य उपस्थिति का संकेत होने के कारण ‘एक आत्मा’ सबसे उपयुक्त है; हिब्रू में निश्चितता का चिह्न न होने को ‘एक’ व्यक्त करता है।
- source_word: עַל פָּנַי
  choice: मेरे चेहरे के सामने से
  rationale: शाब्दिक रूप से ‘मेरे चेहरे पर/के सामने’; יחלף के साथ यह वक्ता के चेहरे के आगे से गुज़रने की गति दर्शाता है। यह चयन ठोस चित्र बनाए रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: יַחֲלֹף
  choice: गुज़री
  rationale: חלף का सामान्य अर्थ ‘गुज़रना’ या ‘पास से निकलना’ है। स्त्रीलिंग क्रिया ‘गुज़री’ हिन्दी में ‘आत्मा’ के व्याकरणिक लिंग के अनुरूप है।
- source_word: תְּסַמֵּר
  choice: खड़े हो गए
  rationale: यह क्रिया कठोर या सीधा हो जाने का भाव देती है। हिन्दी में रोंगटों के लिए ‘खड़े हो गए’ स्वाभाविक और सजीव मुहावरा है।
- source_word: שַׂעֲרַת בְּשָׂרִי
  choice: मेरे शरीर के रोंगटे
  rationale: शाब्दिक अर्थ ‘मेरे मांस/शरीर के बाल’ है। भय की प्रतिक्रिया के संदर्भ में ‘रोंगटे’ सामान्य आधुनिक हिन्दी में वही दृश्य स्पष्ट करता है, जबकि ‘शरीर’ בשר के देहगत अर्थ को बनाए रखता है।
theological_decisions:
- issue: רוּחַ की पहचान
  choice: एक आत्मा
  alternative: एक हवा / एक साँस
  rationale: मूल शब्द बहुअर्थी है और सत्ता की सटीक पहचान नहीं बताता। दर्शन और भय के प्रसंग में ‘आत्मा’ को मुख्य पाठ में रखा गया है, पर अन्य वास्तविक अर्थों को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सजीव और सामान्य पाठक के लिए सहज शैली। ‘मेरे शरीर के बाल खड़े हो गए’ की अपेक्षा ‘रोंगटे खड़े हो गए’ अधिक स्वाभाविक है और मूल में वर्णित शारीरिक प्रतिक्रिया को स्पष्ट रूप से व्यक्त करता है।
