base_translation:
  language: en
  yaml_path: translation/ot/job/020/004.yaml
  text: Have you known this from of old[a], since man was placed on the earth?
translation:
  language: hi
  text: क्या तू यह उस प्राचीन समय से जानता है, जब से मनुष्य को पृथ्वी पर रखा गया?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲ/זֹאת
  choice: क्या तू यह ... नहीं
  rationale: प्रश्नवाचक הֲ और संकेतवाचक זֹאת को स्वाभाविक हिन्दी अलंकारिक प्रश्न में व्यक्त किया गया है। नकारात्मक प्रश्न-रूप हिन्दी में अपेक्षित उत्तर को स्पष्ट करता है, बिना कथ्य बदले।
- source_word: יָדַעְתָּ
  choice: जानता
  rationale: द्वितीय पुरुष पुल्लिंग एकवचन को हिन्दी के एकवचन संबोधन ‘तू’ के अनुरूप रखा गया है; सिद्ध तथ्य के स्थायी ज्ञान के लिए वर्तमान रूप स्वाभाविक है।
- source_word: מִנִּי עַד
  choice: प्राचीन काल से
  rationale: यह दुर्लभ कालवाचक पद दूर अतीत की ओर संकेत करता है; ‘प्राचीन काल से’ आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: מִנִּי שִׂים
  choice: जब से ... रखा गया
  rationale: מן के कालवाचक आरम्भ-बिंदु और שׂים के रखने/स्थापित करने के भाव को सहज हिन्दी रचना में सुरक्षित रखा गया है।
- source_word: שִׂים
  choice: रखा गया
  rationale: पृथ्वी पर मनुष्य के रखे जाने को व्यक्त करने वाला कर्मवाच्य मूल की रचना और स्थानवाचक संदर्भ दोनों के अनुकूल है।
- source_word: אָדָם
  choice: मनुष्य
  rationale: यहाँ एकवचन אָדָם मानव जाति के प्रतिनिधि और सामान्य अर्थ में है। हिन्दी ‘मनुष्य’ स्रोत के एकवचन रूप और सार्वभौमिक आशय दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עֲלֵי אָרֶץ
  choice: पृथ्वी पर
  rationale: स्थानवाचक अर्थ का सीधा, स्वाभाविक और संदर्भानुकूल हिन्दी रूप।
theological_decisions:
- issue: सामान्य मानव-संदर्भ में אָדָם का अनुवाद
  choice: मनुष्य
  alternative: मानवजाति
  rationale: इब्रानी में शब्द व्याकरणिक रूप से एकवचन है, पर यहाँ पूरी मानवता का प्रतिनिधित्व करता है। ‘मनुष्य’ हिन्दी में इस एकवचन प्रतिनिधि अर्थ को बनाए रखता है और केवल पुरुष-लिंग तक सीमित नहीं सुनाई देता; इसलिए अलग पादटिप्पणी आवश्यक नहीं है।
- issue: अलंकारिक प्रश्न की ध्रुवता
  choice: क्या तू ... नहीं जानता
  alternative: क्या तू ... जानता है
  rationale: इब्रानी प्रश्न-कण अपने आप में नकारात्मक नहीं है, पर संदर्भ में वक्ता प्राचीन और सर्वविदित सिद्धांत की अपील करता है। हिन्दी में ‘नहीं’ अपेक्षित सकारात्मक उत्तर और अलंकारिक बल को स्वाभाविक बनाता है; इसे तथ्य का निषेध नहीं समझना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण काव्यात्मक गद्य। अय्यूब के संवाद में एकवचन निकट/तीखा संबोधन बनाए रखने के लिए ‘तू’ चुना गया है। मूल की दो समानान्तर कालवाचक अभिव्यक्तियों को डैश के द्वारा जोड़ा गया है।
