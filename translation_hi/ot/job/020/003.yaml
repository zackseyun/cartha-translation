  text: 'मैं ऐसी फटकार सुनता हूँ जो मुझे लज्जित करती है,

    और मेरी समझ से निकली आत्मा मुझे उत्तर देती है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מוּסַר כְּלִמָּתִי
  choice: अपनी लज्जा का सुधार
  rationale: מוּסַר सुधार, अनुशासन या डाँट को दर्शा सकता है; כְּלִמָּתִי के साथ यह ऐसा सुधार है जिसे वक्ता अपने लिए लज्जाजनक मानता है। ‘अपनी लज्जा का सुधार’ इब्रानी संबंध की संक्षिप्तता और हल्की अस्पष्टता बनाए रखता है।
- source_word: אֶשְׁמָע
  choice: मैं ... सुनता हूँ
  rationale: संदर्भ में अपूर्ण क्रिया वक्ता की वर्तमान प्रतिक्रिया व्यक्त करती है; सामान्य वर्तमान हिंदी में स्वाभाविक है।
- source_word: רוּחַ
  choice: आत्मा
  rationale: यहाँ शब्द भीतरी प्रेरक शक्ति या वृत्ति का रूपक है। ‘आत्मा’ मूल बिंब को बनाए रखता है और इसे केवल ‘मन’ तक सीमित नहीं करता।
- source_word: מִבִּינָתִי
  choice: मेरी समझ से उठने वाली
  rationale: מִן के स्रोतार्थ ‘से/में से’ को स्पष्ट रखते हुए यह बताता है कि भीतरी प्रेरणा वक्ता की समझ से उत्पन्न होती है; ‘उठने वाली’ हिंदी में संबंध को स्वाभाविक बनाता है।
- source_word: יַעֲנֵנִי
  choice: मुझे उत्तर देती है
  rationale: ענה का सामान्य अर्थ ‘उत्तर देना’ है और प्रथम पुरुष कर्म-प्रत्यय को ‘मुझे’ से सीधे व्यक्त किया गया है। पाठ की संभावित प्रेरक अर्थछाया को मुख्य पाठ में निर्णायक रूप से नहीं थोपा गया।
