  text: उसका भोजन उसके पेट में बदल जाता है[a]; वह उसके भीतर नागों का विष बन जाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी रोटी उसकी अंतड़ियों में पलट जाती है; वह उसके भीतर नागों का पित्त बन जाती है।”
    reason: לַחְמוֹ, בְּמֵעָיו, נֶהְפָּךְ और מְרוֹרַת के अधिक शाब्दिक lexical विकल्प सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: לַחְמוֹ
  choice: उसका भोजन
  rationale: לֶחֶם का मूल अर्थ ‘रोटी’ है, पर यहाँ खाई हुई वस्तु के व्यापक अर्थ में ‘भोजन’ स्वाभाविक है।
- source_word: בְּמֵעָיו
  choice: उसके पेट में
  rationale: यह शब्द भीतरी अंगों को सूचित करता है; पाचन-संबंधी बिंब में आधुनिक हिन्दी का ‘पेट में’ स्पष्ट और सहज है।
- source_word: נֶהְפָּךְ
  choice: बदल जाता है
  rationale: निफ़अल रूप भीतर होने वाले अवस्था-परिवर्तन को व्यक्त करता है; ‘बदल जाता है’ इस अर्थ को स्वाभाविक हिन्दी में रखता है।
- source_word: מְרוֹרַת
  choice: विष
  rationale: शाब्दिक रूप से यह ‘कड़वाहट/पित्त’ से जुड़ा है, पर विषैले साँपों के साथ इसका आशय प्राणघातक विष है।
- source_word: פְּתָנִים
  choice: नागों
  rationale: यह किसी विषैले साँप को सूचित करता है, जिसे प्रायः कोबरा/नाग समझा जाता है; ‘नाग’ आधुनिक हिन्दी में परिचित और बिंब-संगत है।
- source_word: בְּקִרְבּוֹ
  choice: उसके भीतर
  rationale: यह व्यक्ति के अंदर की ओर संकेत करता है और शारीरिक बिंब को स्पष्ट रखता है।
