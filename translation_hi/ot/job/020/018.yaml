  text: 'अपनी मेहनत की कमाई वह लौटा देता है और उसे निगलता नहीं;

    अपने लेन-देन की धन-संपत्ति के अनुसार[a] वह आनन्दित नहीं होता।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह अपनी मेहनत की कमाई लौटा देता है और उसे भोगता नहीं; लेन-देन से मिली धन-संपत्ति के विषय में वह उल्लसित नहीं होता।” दूसरी पंक्ति की इब्रानी संक्षिप्त है और उसके कई निकटवर्ती अनुवाद सम्भव हैं।
    reason: alternative_reading
