- source_word: כְּחֵיל
  choice: धन-संपत्ति के अनुसार
  rationale: חֵיל यहाँ सेना या शक्ति के बजाय धन-संपत्ति को सूचित करता है। कठिन उपसर्ग כ के आनुपातिक अर्थ को 'के अनुसार' से व्यक्त किया गया है।
- source_word: תְּמוּרָתוֹ
  choice: अपने लेन-देन से मिली
  rationale: תְּמוּרָה विनिमय, बदला या विनिमय में मिली वस्तु को सूचित करता है। 'लेन-देन से मिली' आधुनिक हिन्दी में आर्थिक प्रसंग स्पष्ट रखते हुए मूल अर्थ को सँभालता है।
- source_word: וְלֹא יַעֲלֹס
  choice: वह आनन्द नहीं मनाता
  rationale: עלס हर्षित या उल्लसित होने का अर्थ देता है। यह वाक्यांश सामान्य आधुनिक हिन्दी में उस धन का सुख न भोग पाने की बात स्पष्ट करता है।
