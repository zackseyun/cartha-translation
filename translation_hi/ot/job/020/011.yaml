  register: आधुनिक, सरल और गरिमापूर्ण हिंदी अपनाई गई है। ‘हड्डियाँ’, ‘जवानी का जोश’ और ‘मिट्टी में जा लेटना’ मूल के शारीरिक तथा मृत्यु-संबंधी काव्य-बिंबों को सामान्य पाठक के लिए स्पष्ट रखते हैं।
