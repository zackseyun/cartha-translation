  text: His bones are full of his youthful vigor[a], but it will lie down with him in the dust.
translation:
  language: hi
  text: उसकी हड्डियाँ उसकी जवानी की ताकत से भरी हैं[a], और वह उसके साथ धूल में लेट जाएगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी हड्डियाँ उसकी जवानी से भरी थीं”; इब्रानी शब्द स्वयं जवानी या जवानी से जुड़ी शक्ति और स्फूर्ति को दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַצְמוֹתָיו
  choice: उसकी हड्डियाँ
  rationale: मूल इब्रानी के ठोस शारीरिक बिंब को बनाए रखता है; ‘उसका शरीर’ अर्थ को सामान्य बना देता।
- source_word: מָלְאוּ
  choice: भरी हैं
  rationale: इब्रानी पूर्ण क्रिया यहाँ उस वर्तमान दशा को चित्रित करती है जिसमें उसकी हड्डियाँ अब भी जवानी के जोश से भरपूर हैं; हिंदी में ‘भरी हैं’ प्रसंगानुकूल और स्वाभाविक है।
- source_word: עֲלוּמָיו
  choice: जवानी के जोश
  rationale: शब्द जवानी स्वयं अथवा उससे जुड़ी शक्ति और स्फूर्ति को सूचित कर सकता है। मुख्य पाठ में ‘जवानी के जोश’ से प्रसंगगत बल व्यक्त होता है, जबकि पादटिप्पणी शाब्दिक विकल्प सुरक्षित रखती है।
- source_word: וְעִמּוֹ
  choice: पर वह भी उसके साथ
  rationale: ‘उसके साथ’ मूल पूर्वसर्ग का सीधा अर्थ है; ‘भी’ उस जोश के मनुष्य के साथ मृत्यु में जाने का भाव स्वाभाविक हिंदी में व्यक्त करता है। संयोजक וְ को प्रसंगगत विरोध के कारण ‘पर’ किया गया है।
- source_word: עַל־עָפָר
  choice: मिट्टी में
  rationale: शाब्दिक रूप से ‘मिट्टी पर’ संभव है, किंतु मृत्यु और दफन के इस बिंब में हिंदी का ‘मिट्टी में’ अर्थ को अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: תִּשְׁכָּב
  choice: जा लेटेगा
  rationale: मूल में लेटने की क्रिया मृत्यु और कब्र का काव्यात्मक संकेत है। ‘जा लेटेगा’ भावी परिणाम और मिट्टी में साथ जाने—दोनों को सहज हिंदी में रखता है।
theological_decisions:
- issue: मिट्टी में लेटने वाली वस्तु का संकेत
  choice: ‘वह’ को मुख्य पाठ के ‘जवानी के जोश’ से संबद्ध रखा गया
  alternative: इसे उसकी हड्डियों अथवा स्वयं उसकी जवानी का संकेत मानना
  rationale: इब्रानी में संकेत पूर्णतः स्पष्ट नहीं है। मुख्य पाठ निकटतम अर्थगत संबंध को अपनाता है, पर पादटिप्पणी ‘जवानी’ के विकल्प को बनाए रखती है और किसी विशिष्ट धर्मशास्त्रीय निष्कर्ष को नहीं जोड़ती।
