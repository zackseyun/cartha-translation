  text: For he knew no quiet in his belly[a]; with his desirable things he will not escape.
translation:
  language: hi
  text: 'क्योंकि उसने अपने पेट में चैन नहीं जाना;[a]


    अपनी मनचाही वस्तुओं के सहारे वह बच नहीं सकेगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “क्योंकि उसने अपने भीतर चैन नहीं जाना; वह अपनी मनचाही वस्तुओं में से कोई भी बचा न सकेगा।”'
    reason: इब्रानी में ‘पेट/भीतर’, ‘मनचाही वस्तु’ और ‘बचना/बचाना’ के पारस्परिक संबंध के एक से अधिक सम्भव अर्थ हैं।
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन में आए न्याय का कारण या स्पष्टीकरण प्रस्तुत करता है।
- source_word: לֹא יָדַע שָׁלֵו
  choice: चैन न मिला
  rationale: शाब्दिक अर्थ ‘चैन/सुख नहीं जाना’ है; आधुनिक हिन्दी में ‘चैन न मिला’ स्वाभाविक है और निरंतर अतृप्ति का भाव रखता है।
- source_word: בְּבִטְנוֹ
  choice: उसके पेट को
  rationale: בטן का ठोस अर्थ ‘पेट’ है और संदर्भ में लालसा व भोग की देहगत छवि बनाए रखता है। हिन्दी में ‘पेट को चैन’ सहज प्रयोग है।
- source_word: בַּחֲמוּדוֹ
  choice: अपनी मनचाही वस्तुओं के सहारे
  rationale: חמד से बना पद इच्छित या प्रिय वस्तुओं की ओर संकेत करता है। संबंधसूचक ב को साधनार्थक मानते हुए ‘के सहारे’ चुना गया है, पर पाठ की अस्पष्टता पादटिप्पणी में रखी गई है।
- source_word: לֹא יְמַלֵּט
  choice: वह बच न सकेगा
  rationale: מלט के पिएल रूप का अर्थ यहाँ बच निकलना या अपने को बचाना हो सकता है; यह चयन न्याय से न बच पाने का व्यापक भाव रखता है।
theological_decisions:
- issue: क्या प्रिय वस्तुएँ उसके बचाव का साधन हैं या वे वस्तुएँ हैं जिन्हें वह बचा नहीं पाएगा?
  choice: अपनी मनचाही वस्तुओं के सहारे वह बच न सकेगा
  alternative: वह अपनी मनचाही कोई वस्तु बचा न सकेगा
  rationale: בַּחֲמוּדוֹ और יְמַלֵּט का संबंध व्याकरणतः संक्षिप्त और काव्यात्मक होने के कारण विवादित है। मुख्य पाठ साधनार्थक अर्थ लेता है; वैकल्पिक वस्तु-संबंधी अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी; ‘पेट’ मूल की ठोस लालसा-संबंधी छवि रखता है, जबकि ‘चैन’ सामान्य पाठक के लिए स्वाभाविक है।
