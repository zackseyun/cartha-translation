source:
  edition: WLC
  text: זֶ֤ה חֵֽלֶק אָדָ֣ם רָ֭שָׁע מֵ/אֱלֹהִ֑ים וְ/נַחֲלַ֖ת אִמְר֣/וֹ מֵ/אֵֽל׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/020/029.yaml
  text: This is the portion of a wicked man from God[a], the inheritance appointed for him from the Mighty One.
translation:
  language: hi
  text: यही परमेश्वर की ओर से दुष्ट मनुष्य का भाग है, और पराक्रमी परमेश्वर की ओर से उसके लिए ठहराई हुई विरासत[a] है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पराक्रमी परमेश्वर की ओर से उसके वचन/कथन की विरासत।” इब्रानी में अधिक शाब्दिक रूप से “उसका वचन/कथन” है; यहाँ इसका आशय संभवतः उस परिणाम से है जिसे परमेश्वर ने उसके लिए कहा या ठहराया है।
    reason: אִמְרוֹ के शाब्दिक अर्थ और उसके संदर्भगत, व्याख्यात्मक अर्थ—दोनों को सुरक्षित रखना।
lexical_decisions:
- source_word: זֶה
  choice: यही ... है
  rationale: यह संकेतवाचक पद सोफ़र के निष्कर्ष का सार प्रस्तुत करता है; ‘यही ... है’ हिन्दी में इस बल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: חֵלֶק
  choice: ठहराया हुआ भाग
  rationale: यह किसी को मिले या निर्धारित किए गए हिस्से अथवा परिणाम को दर्शाता है; ‘भाग’ मूल रूपक को बनाए रखता है और ‘ठहराया हुआ’ संदर्भगत आवंटन स्पष्ट करता है।
- source_word: אָדָם רָשָׁע
  choice: दुष्ट मनुष्य
  rationale: इब्रानी में यह पुल्लिंग एकवचन सामान्य प्रतिनिधिक प्रयोग है; हिन्दी में ‘दुष्ट मनुष्य’ रूप और सामान्य अर्थ दोनों बनाए रखता है।
- source_word: מֵאֱלֹהִים
  choice: परमेश्वर की ओर से
  rationale: यहाँ אֱלֹהִים एक परमेश्वर को और उस भाग के स्रोत को सूचित करता है।
- source_word: וְנַחֲלַת
  choice: और ... विरासत
  rationale: यह ‘भाग’ के समानांतर किसी को प्राप्त या नियत संपदा/परिणाम को व्यक्त करता है; ‘विरासत’ काव्यात्मक समानांतरता बनाए रखती है।
- source_word: אִמְרוֹ
  choice: उसके लिए ठहराई हुई
  rationale: शाब्दिक रूप से यह ‘उसका वचन/कथन’ हो सकता है, पर संदर्भ में परमेश्वर द्वारा उसके लिए बोले या निर्धारित किए गए परिणाम का बोध होता है। अर्थ को स्पष्ट रखते हुए वास्तविक शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: מֵאֵל
  choice: सर्वशक्तिमान की ओर से
  rationale: אֵל परमेश्वर के लिए प्रयुक्त एक दिव्य उपाधि है, जिसमें सामर्थ्य का भाव है; यह पहले पदखंड के ‘परमेश्वर’ से काव्यात्मक विविधता भी बनाए रखती है।
theological_decisions:
- issue: אָדָם का सामान्य एकवचन प्रयोग
  choice: दुष्ट मनुष्य
  alternative: दुष्ट व्यक्ति
  rationale: मूल पाठ पुल्लिंग एकवचन में है और प्रतिनिधिक सामान्य अर्थ रखता है; ‘मनुष्य’ इस रूप को बनाए रखते हुए आधुनिक हिन्दी में व्यापक मानवीय संदर्भ भी व्यक्त करता है।
- issue: אִמְרוֹ का अर्थ
  choice: उसके लिए ठहराई हुई
  alternative: उसका वचन / उसका कथन
  rationale: ‘उसका वचन’ अधिक शाब्दिक है, किंतु इस समानांतर संरचना में अस्पष्ट रहेगा। अध्याय के न्याय और नियत परिणाम के संदर्भ में ‘उसके लिए ठहराई हुई’ उपयुक्त है, जबकि शाब्दिक अनिश्चितता पादटिप्पणी में दी गई है।
- issue: אֵל का दिव्य शीर्षक
  choice: सर्वशक्तिमान
  alternative: परमेश्वर
  rationale: यह चयन सामर्थ्य के भाव और दोनों पदखंडों की काव्यात्मक भिन्नता को बनाए रखता है, बिना किसी अलग देवता का संकेत दिए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, काव्यात्मक और सामान्य पाठक के लिए स्पष्ट शैली। दोनों समानांतर पदखंडों में ‘भाग’ और ‘विरासत’ तथा ‘परमेश्वर’ और ‘सर्वशक्तिमान’ की भिन्नता बनाए रखी गई है।
