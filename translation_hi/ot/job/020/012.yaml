  yaml_path: translation/ot/job/020/012.yaml
  text: Though evil is sweet in his mouth[a], he hides it under his tongue,
translation:
  language: hi
  text: चाहे बुराई उसके मुँह में मीठी लगे[a], वह उसे अपनी जीभ के नीचे छिपाए रखता है,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यदि बुराई उसके मुँह में मीठी लगे।” इब्रानी अव्यय का अर्थ शर्तसूचक (“यदि”) या रियायती (“चाहे”) हो सकता है; संदर्भ रियायती अर्थ के पक्ष में है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: चाहे
  rationale: यहाँ אִם को संदर्भानुसार रियायती अर्थ में लिया गया है। ‘चाहे’ आगामी मुख्य कथन के साथ स्वाभाविक हिन्दी बनाता है और ‘यदि’ की शर्तार्थक संभावना को पाद-टिप्पणी में सुरक्षित रखता है।
- source_word: תַּמְתִּיק
  choice: मीठी लगे
  rationale: מתק के हिफ़ील रूप का यहाँ भाव ‘मीठा/प्रिय लगना’ है। स्त्रीलिंग कर्ता ‘बुराई’ के साथ ‘मीठी लगे’ हिन्दी में स्वाद के रूपक को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּפִיו
  choice: उसके मुँह में
  rationale: शाब्दिक मुख-चित्र को बनाए रखा गया है, जो समानांतर वाक्यांश ‘अपनी जीभ के नीचे’ से जुड़ता है।
- source_word: רָעָה
  choice: बुराई
  rationale: यह शब्द यहाँ नैतिक बुराई को दर्शाता है। ‘बुराई’ आधुनिक हिन्दी में व्यापक और सहज है।
- source_word: יַכְחִידֶנָּה
  choice: वह उसे ... छिपाए रखता है
  rationale: כחד के हिफ़ील का अर्थ छिपाना है; स्त्रीलिंग प्रत्यय का संदर्भ ‘बुराई’ है। ‘छिपाए रखता है’ लगातार सँजोकर रखने की प्रसंगगत छवि भी व्यक्त करता है।
- source_word: תַּחַת לְשׁוֹנוֹ
  choice: अपनी जीभ के नीचे
  rationale: स्थानगत रूपक को निकटता से सुरक्षित रखते हुए हिन्दी में स्वाभाविक स्ववाचक संबंध ‘अपनी’ से व्यक्त किया गया है।
