  text: כָּל חֹשֶׁךְ֮ טָמ֪וּן לִ/צְפּ֫וּנָ֥י/ו תְּ֭אָכְלֵ/הוּ אֵ֣שׁ לֹֽא נֻפָּ֑ח יֵ֖רַע שָׂרִ֣יד בְּ/אָהֳלֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/026.yaml
  text: All darkness is hidden up for his treasures[a]; a fire not blown will consume him[c][b]; it will feed on what remains in his tent.
translation:
  language: hi
  text: सारा अंधकार उसके गुप्त भंडारों के लिए संचित रखा गया है[a]; एक ऐसी आग, जिसे फूँका नहीं गया, उसे भस्म कर देगी[b]; वह उसके तंबू में बचे हुए को हानि पहुँचाएगी[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सारा अंधकार उसके लिए संचित रखा गया है।” इब्रानी में ‘उसकी छिपी हुई वस्तुओं/निधियों’ से जुड़ा वाक्यांश कठिन है। इसका आशय उसके गुप्त भंडारों पर आने वाली विपत्ति, या उसके लिए रखी हुई विपत्ति हो सकता है।
    reason: alternative_reading
  - marker: b
    text: “ऐसी आग, जिसे फूँका नहीं गया” का अर्थ ऐसी आग हो सकता है जिसे किसी मनुष्य ने न जलाया हो, न फूँककर भड़काया हो; इससे दैवी रूप से भेजी गई या अपने आप जलती रहने वाली आग का संकेत मिल सकता है।
    reason: lexical_alternative
  - marker: c
    text: या, “वह उसके तंबू में बचे हुए को भस्म कर देगी,” अथवा “वह उसके तंबू में बचे जीवित व्यक्ति को हानि पहुँचाएगी।” इब्रानी में ‘बचा हुआ’ किसी जीवित बचे व्यक्ति या बचे हुए अवशेष को दर्शा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל חֹשֶׁךְ
  choice: घोर अंधकार
  rationale: शाब्दिक रूप से ‘समस्त अंधकार’; हिन्दी में ‘घोर अंधकार’ सम्पूर्ण और प्रबल अंधकार की काव्यात्मक छवि को स्वाभाविक ढंग से व्यक्त करता है। संदर्भ में यह विपत्ति या न्याय का बिंब है, पर अनुवाद उस बिंब को स्पष्टार्थ में नहीं बदलता।
- source_word: טָמוּן
  choice: संचित है
  rationale: निष्क्रिय कृदन्त किसी वस्तु के छिपाकर या भविष्य के लिए रखे होने का भाव देता है। ‘संचित’ आरक्षित रखे जाने के अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: לִצְפוּנָיו
  choice: उसके खज़ानों के लिए
  rationale: צפן से बना यह कठिन बहुवचन रूप छिपी हुई वस्तुओं, भंडारों या खज़ानों की ओर संकेत कर सकता है। ‘खज़ानों’ से ठोस अर्थ बना रहता है, जबकि पादटिप्पणी वैकल्पिक व्याकरणिक अर्थ बताती है।
- source_word: תְּאָכְלֵהוּ אֵשׁ
  choice: आग उसे भस्म कर देगी
  rationale: क्रिया का मूल अर्थ ‘खा जाना’ है; आग के साथ ‘भस्म कर देना’ आधुनिक हिन्दी में स्वाभाविक है और पूर्ण विनाश की शक्ति बनाए रखता है।
- source_word: לֹא נֻפָּח
  choice: बिना फूँकी गई
  rationale: निष्क्रिय रूप आग को फूँकने या धौंकने का चित्र देता है। यह अनोखी आग मानवीय प्रयास के बिना जलती है; सम्भावित दैवी संकेत को मुख्य पाठ में अनावश्यक रूप से स्पष्ट नहीं किया गया।
- source_word: יֵרַע שָׂרִיד
  choice: बचे हुए का बुरा हाल होगा
  rationale: יֵרַע को ‘बुरा होना/बुरा हाल होना’ के निकट रखा गया है और שָׂרִיד को जानबूझकर व्यापक ‘बचा हुआ’ कहा गया है। इससे जीवित बचे व्यक्ति और बची हुई वस्तु या अवशेष—दोनों सम्भावनाएँ खुली रहती हैं।
- source_word: בְּאָהֳלוֹ
  choice: उसके तंबू में
  rationale: ‘तंबू’ मूल काव्यात्मक चित्र को बनाए रखता है; यहाँ वह निवास या घराने का भी प्रतिनिधित्व कर सकता है।
theological_decisions:
- issue: मानवीय रूप से न फूँकी गई आग का कर्ता
  choice: मुख्य पाठ में आग को ‘बिना फूँकी गई’ कहा गया है, पर उसे सीधे परमेश्वर द्वारा भेजी हुई नहीं कहा गया।
  alternative: ‘परमेश्वर की भेजी आग’ या ‘अलौकिक आग’।
  rationale: मूल पाठ आग के मानवीय फूँक से रहित होने की बात कहता है, पर कर्ता का स्पष्ट नाम नहीं देता। अनुवाद सम्भावित दैवी न्याय का संकेत बनाए रखता है, उसे सिद्ध कथन में नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘घोर अंधकार,’ ‘संचित,’ ‘भस्म’ और ‘तंबू’ जैसे शब्द अय्यूब की न्याय-वाणी की गंभीरता बनाए रखते हैं, जबकि कठिन इब्रानी वाक्यांशों की वास्तविक अस्पष्टता पादटिप्पणियों में सुरक्षित है।
