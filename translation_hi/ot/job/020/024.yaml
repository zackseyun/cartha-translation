base_translation:
  language: en
  yaml_path: translation/ot/job/020/024.yaml
  text: He will flee from an iron weapon[b][a]; a bronze bow will pierce him through.
translation:
  language: hi
  text: 'वह लोहे के हथियार[a] से भागेगा;

    काँसे का धनुष उसे आर-पार बेध देगा[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “लोहे के शस्त्रास्त्र से।” इब्रानी शब्द נֶשֶׁק व्यापक अर्थ में हथियारों को भी सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उसे पार कर जाएगा।” इब्रानी क्रिया का अधिक औपचारिक अनुवाद “उसके आर-पार निकल जाएगा” हो सकता है; प्रसंग में “आर-पार बेध देगा” उसका संभावित आशय व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יִבְרַח
  choice: भागेगा
  rationale: ברח का अर्थ भागना या बच निकलना है। न्याय के इस काव्यात्मक प्रसंग में अपूर्ण क्रिया को भविष्यकाल में व्यक्त करना स्वाभाविक है।
- source_word: מִנֵּשֶׁק בַּרְזֶל
  choice: लोहे के हथियार से
  rationale: נשק का अर्थ व्यापक रूप से हथियार या शस्त्रास्त्र हो सकता है; यहाँ בַּרְזֶל के साथ एक घातक लोहे के हथियार का चित्र है।
- source_word: תַּחְלְפֵהוּ
  choice: उसे आर-पार बेध देगा
  rationale: חלף का मूल भाव पार जाना या आर-पार निकलना है। युद्ध-संदर्भ में धनुष को कर्ता और व्यक्ति को कर्म बताने वाली अभिव्यक्ति का आशय है कि उससे चला बाण उसे आर-पार बेध देगा; हिंदी में यही संभावित अर्थ सहज रूप से व्यक्त होता है।
- source_word: קֶשֶׁת
  choice: धनुष
  rationale: इस शस्त्र के लिए मानक और संदर्भानुकूल हिंदी शब्द।
- source_word: נְחוּשָׁה
  choice: काँसा
  rationale: नְחוּשָׁה ताँबे अथवा ताँबा-मिश्रित धातु को सूचित करता है; प्राचीन हथियार के इस चित्र में ‘काँसा’ उपयुक्त और प्रचलित अनुवाद है।
