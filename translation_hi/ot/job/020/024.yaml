translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिंदी रखी गई है। मूल की दो समानांतर काव्य-पंक्तियाँ तथा उनके बीच का तीखा विरोध अर्धविराम और पंक्ति-विभाजन से व्यक्त किया गया है। धनुष को ही व्याकरणिक कर्ता बनाए रखा गया है, यद्यपि उससे चलने वाला बाण अर्थ में निहित है।
