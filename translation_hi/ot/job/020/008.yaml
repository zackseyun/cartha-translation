    reason: lexical_alternative
lexical_decisions:
- source_word: כַּחֲלוֹם
  choice: स्वप्न के समान
  rationale: उपसर्ग כְּ तुलना व्यक्त करता है और חֲלוֹם का अर्थ ‘स्वप्न’ है; यह अभिव्यक्ति उपमा और काव्यात्मक गरिमा दोनों बनाए रखती है।
- source_word: יָעוּף
  choice: उड़ जाएगा
  rationale: עוּף का मूल अर्थ ‘उड़ना’ है। संदर्भ में यह शीघ्र लुप्त होने को दर्शाता है, पर प्रत्यक्ष उड़ने की छवि को सुरक्षित रखा गया है।
- source_word: וְלֹא יִמְצָאֻהוּ
  choice: और फिर नहीं मिलेगा
  rationale: इब्रानी में अनिश्चित बहुवचन कर्ता के साथ शाब्दिक अर्थ ‘और वे उसे नहीं पाएँगे’ है। हिंदी में भाववाच्य प्रयोग स्वाभाविक है और ध्यान उस व्यक्ति के गायब हो जाने पर रखता है। ‘फिर’ संदर्भगत परिणाम को सहज बनाता है, बिना अर्थ बदलने के।
- source_word: וְיֻדַּד
  choice: भगा दिया जाएगा
  rationale: होफाल रूप किसी को दूर हाँक दिए या भगा दिए जाने का भाव देता है। यह अनिवार्य रूप से निर्वासन का तकनीकी अर्थ नहीं जोड़ता और काव्यात्मक समानांतरता बनाए रखता है।
- source_word: כְּחֶזְיוֹן לָיְלָה
  choice: रात के दर्शन के समान
  rationale: חֶזְיוֹן का अर्थ ‘दर्शन’ है और לָיְלָה यहाँ संबंधसूचक रूप में ‘रात का’ बताता है। यह अनुवाद मूल संरचना और काव्यात्मक स्वर के निकट है।
