lexical_decisions:
- source_word: רֹאשׁ
  choice: विष
  rationale: शाब्दिक अर्थ प्रायः ‘सिर’ है, पर यहाँ विषैले साँप और समानांतर पंक्ति में मृत्यु के संदर्भ में यह मुहावरेदार ढंग से ‘विष’ दर्शाता है। हिंदी में ‘विष’ स्वाभाविक और काव्यात्मक है।
- source_word: פְּתָנִים
  choice: नागों
  rationale: यह किसी विषैले साँप का नाम है, जिसे परंपरागत रूप से ‘ऐस्प’ और आधुनिक अनुवादों में प्रायः ‘कोबरा’ कहा जाता है। ‘नाग’ आधुनिक हिंदी पाठक के लिए सहज है और मूल से अधिक प्रजातिगत निश्चितता नहीं थोपता।
- source_word: יִינָק
  choice: चूसता है
  rationale: मूल क्रिया का सीधा अर्थ ‘चूसना’ है। यह अनिष्टकारी विष को ग्रहण करने की सजीव और तीखी काव्यात्मक छवि बनाए रखता है।
- source_word: תַּהַרְגֵהוּ
  choice: उसे मार डालती है
  rationale: स्त्रीलिंग एकवचन कर्ता ‘जीभ’ की निश्चित, घातक क्रिया को वर्तमानकालीन ज्ञान-काव्य शैली में स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְשׁוֹן
  choice: जीभ
  rationale: मूल पाठ स्पष्टतः ‘जीभ’ कहता है। ‘दाँत’ या ‘डसना’ करने से निहित जैविक क्रिया स्पष्ट होती, पर मूल की ठोस काव्यात्मक छवि बदल जाती।
- source_word: אֶפְעֶה
  choice: करैत
  rationale: शब्द एक विषैले साँप को दर्शाता है, किंतु उसकी सटीक आधुनिक प्रजाति अनिश्चित है। ‘करैत’ हिंदी में परिचित विषैले साँप का नाम है; प्रजातिगत अनिश्चितता पादटिप्पणी में बताई गई है।
