  text: יְהִ֤י לְ/מַלֵּ֬א בִטְנ֗/וֹ יְֽשַׁלַּח בּ֭/וֹ חֲר֣וֹן אַפּ֑/וֹ וְ/יַמְטֵ֥ר עָ֝לֵ֗י/מוֹ בִּ/לְחוּמֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/023.yaml
  text: When he is about to fill his belly[a], he will send against him the burning of his anger and rain it upon him as his food.
translation:
  language: hi
  text: जब वह अपना पेट भरने ही वाला होगा, तब परमेश्वर उस पर अपने क्रोध की ज्वाला भेजेगा और खाते समय[a] उसी पर उसे बरसाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और उस पर [क्रोध] उसके भोजन के रूप में बरसाएगा।” अंतिम इब्रानी पदबंध कठिन है; संभव है कि वह बरसते हुए न्याय को खाने के समय से नहीं, बल्कि उसके भोजन से अधिक सीधे जोड़े।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי לְמַלֵּא בִטְנוֹ
  choice: जब वह अपना पेट भरने ही वाला होगा
  rationale: यह आरंभिक पदबंध प्रसंग में उस समय को दर्शाता है जब दुष्ट अपनी लालसा पूरी करने वाला है। ‘पेट भरना’ मूल पाठ की ठोस शारीरिक छवि को बनाए रखता है।
- source_word: יְשַׁלַּח בּוֹ
  choice: उस पर ... भेजेगा
  rationale: שלח का सीधा अर्थ ‘भेजना’ है और ב यहाँ क्रोध की विरोधात्मक दिशा बताता है। हिंदी में ‘उस पर भेजेगा’ इस भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: חֲרוֹן אַפּוֹ
  choice: अपने धधकते क्रोध को
  rationale: यह इब्रानी पदबंध क्रोध की जलती हुई तीव्रता का रूपक है। ‘धधकता क्रोध’ उस रूपक को सहज आधुनिक हिंदी में सुरक्षित रखता है।
- source_word: וְיַמְטֵר עָלֵימוֹ
  choice: और ... उस पर उसे बरसाएगा
  rationale: מטר वर्षा कराने या बरसाने की छवि देता है। संदर्भ में एकवचन दुष्ट व्यक्ति होने के कारण עָלֵימוֹ का अनुवाद ‘उस पर’ किया गया है।
- source_word: בִּלְחוּמוֹ
  choice: खाते समय
  rationale: अंतिम शब्द कठिन है, पर इसे भोजन या खाने से संबंधित समझना प्रसंगानुकूल है। मुख्य पाठ में कालगत अर्थ स्वाभाविक हिंदी देता है; ‘उसके भोजन के रूप में’ वाला अधिक शाब्दिक संभावित अर्थ पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: न्याय करने वाली क्रियाओं का अंतर्निहित कर्ता
  choice: कर्ता को ‘परमेश्वर’ के रूप में स्पष्ट किया गया है।
  alternative: कर्ता को केवल ‘वह’ कहना या वाक्य को कर्मवाच्य में रखना।
  rationale: निकटवर्ती प्रसंग दैवी न्याय का वर्णन करता है और ‘अपने क्रोध’ का स्वामी स्वाभाविक रूप से परमेश्वर है। नाम स्पष्ट करना हिंदी में अस्पष्टता घटाता है, बिना कोई अतिरिक्त सांप्रदायिक दावा जोड़े।
- issue: अंतिम कठिन पदबंध का संबंध
  choice: मुख्य पाठ में न्याय को उसके खाते समय बरसने वाला बताया गया है।
  alternative: क्रोध को उसके भोजन के रूप में उस पर बरसाया जाना।
  rationale: בִּלְחוּמוֹ की व्याख्या अनिश्चित है। कालगत अर्थ प्रसंग में सहज है, जबकि भोजन के रूप में न्याय मिलने की संभावना पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘पेट भरना,’ ‘धधकता क्रोध’ और ‘बरसाना’ मूल की सजीव काव्यात्मक छवियों को बनाए रखते हैं।
