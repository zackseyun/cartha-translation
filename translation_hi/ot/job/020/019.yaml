  text: क्योंकि उसने गरीबों को कुचला और छोड़ दिया[a]; उसने एक घर छीन लिया, और वह उसे नहीं बनाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘क्योंकि उसने गरीबों को कुचलकर छोड़ दिया।’
