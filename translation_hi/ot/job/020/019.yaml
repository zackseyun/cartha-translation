  rationale: क्रिया के हिंसक और ठोस भाव को बनाए रखता है; केवल ‘सताया’ कहना इसके बिंब को कमजोर कर देता।
- source_word: עָזַב
  choice: बेसहारा छोड़ दिया
  rationale: ‘छोड़ दिया’ के साथ ‘बेसहारा’ हिंदी में गरीबों के दोषपूर्ण परित्याग का आशय स्वाभाविक रूप से स्पष्ट करता है।
- source_word: דַּלִּים
  choice: गरीबों
  rationale: यहाँ सामाजिक और आर्थिक रूप से निर्बल लोगों के लिए सबसे सीधा और सामान्य हिंदी शब्द है।
- source_word: בַּיִת
  choice: एक घर
  rationale: ‘छीन लिया’ और उसे ‘बनाने’ के उल्लेख के साथ भौतिक घर या संपत्ति का अर्थ सर्वाधिक स्वाभाविक है।
- source_word: גָּזַל
  choice: छीन लिया
  rationale: यह बलपूर्वक या अन्याय से ले लेने का भाव व्यक्त करता है और घर को कर्म के रूप में लेकर स्वाभाविक हिंदी बनाता है।
- source_word: וְלֹא יִבֶנֵהוּ
  choice: पर वह उसे नहीं बनाएगा
  rationale: भविष्यसूचक अपूर्ण क्रिया और घर की ओर संकेत करने वाले प्रत्यय को निकटता से रखता है। ‘फिर से बनाएगा’ कहने से पुनर्निर्माण का ऐसा अर्थ जुड़ सकता है जो क्रिया में स्वयं स्पष्ट नहीं है।
theological_decisions:
- issue: घर को न बनाने का अर्थ
  choice: वह उसे नहीं बनाएगा
  alternative: वह उसे फिर से नहीं बनाएगा / वह उसे बना नहीं पाएगा
  rationale: मूल पाठ केवल ‘नहीं बनाएगा’ कहता है; अनिवार्यता, असमर्थता या पुनर्निर्माण का भाव स्पष्ट करके पद के न्याय-संबंधी तनाव को चुपचाप हल नहीं किया गया।
