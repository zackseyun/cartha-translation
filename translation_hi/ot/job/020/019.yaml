lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन में बताए गए दंड का कारण प्रस्तुत करता है; हिंदी में ‘क्योंकि’ इस कारणात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: רִצַּץ
