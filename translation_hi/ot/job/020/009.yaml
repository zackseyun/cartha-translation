  text: The eye that saw him will not see him again[a], and his place will no longer see him.
translation:
  language: hi
  text: जिस आँख ने उसे देखा था, वह उसे फिर न देखेगी[a], और उसका स्थान फिर उसे न देखेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिस आँख ने उसे निहारा था, वह फिर ऐसा न करेगी।” इब्रानी कविता में ‘आँख’ एकवचन में है और अगली पंक्ति में ‘उसका स्थान’ मानवीकृत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַיִן
  choice: जिस आँख
  rationale: मूल में एकवचन ‘आँख’ है; इसे बनाए रखने से इब्रानी कविता का सजीव और व्यक्तिकृत चित्र सुरक्षित रहता है।
- source_word: שְׁזָפַתּוּ
  choice: ने उसे देखा था
  rationale: क्रिया का अर्थ ‘देखना’ या ‘निहारना’ हो सकता है। यहाँ समानांतर पंक्ति के साथ ‘देखा’ स्वाभाविक और स्पष्ट है।
- source_word: וְלֹא תוֹסִיף
  choice: वह उसे फिर न देखेगी
  rationale: निषेध के साथ יסף पुनः न होने का भाव देता है। ‘उसे’ पहली क्रिया से अर्थानुसार जारी रखा गया है।
- source_word: וְלֹא עוֹד
  choice: फिर ... न
  rationale: यह पदबंध किसी बात के दोबारा न होने पर बल देता है और हिन्दी काव्य-पंक्ति में सहज है।
- source_word: תְּשׁוּרֶנּוּ
  choice: उसे न देखेगा
  rationale: שׁור का अर्थ ‘देखना/निहारना’ है। ‘देखना’ साधारण आधुनिक हिन्दी में स्पष्ट रहते हुए समानांतरता बनाए रखता है।
- source_word: מְקוֹמוֹ
  choice: उसका स्थान
  rationale: शाब्दिक अर्थ ‘उसका स्थान’ है; मूल की उस मानवीकरणयुक्त अभिव्यक्ति को रखा गया है जिसमें स्थान उसे फिर नहीं देखता।
