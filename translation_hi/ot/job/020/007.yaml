  yaml_path: translation/ot/job/020/007.yaml
  text: Like his own dung[a], he will perish forever; those who saw him will say, ‘Where is he?’
translation:
  language: hi
  text: अपनी ही विष्ठा के समान वह सदा के लिए नष्ट हो जाएगा; उसे देखनेवाले कहेंगे, “वह कहाँ है?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּגֶלֲלוֹ
  choice: अपनी ही विष्ठा के समान
  rationale: גֶּלֶל मल अथवा विष्ठा को दर्शाता है। यहाँ जानबूझकर प्रयुक्त अपमानजनक बिंब को स्पष्ट और गरिमापूर्ण आधुनिक हिन्दी में बनाए रखने के लिए “विष्ठा” चुना गया है; प्रत्यय का स्वाभाविक बल “अपनी ही” से व्यक्त होता है।
- source_word: לָנֶצַח
  choice: सदा के लिए
  rationale: निरंतर और स्थायी अवधि का भाव व्यक्त करता है; न्याय और पूर्ण लोप के इस काव्यात्मक संदर्भ में यह स्वाभाविक हिन्दी है।
- source_word: יֹאבֵד
  choice: नष्ट हो जाएगा
  rationale: אבד विनाश, मिट जाने या नाश होने का अर्थ देता है। “नष्ट हो जाएगा” केवल दृष्टि से ओझल होने की अपेक्षा मूल क्रिया की प्रबलता को अधिक ठीक रखता है।
- source_word: רֹאָיו
  choice: उसे देखनेवाले
  rationale: सप्रत्यय कृदंत का अर्थ वे लोग है जो उसे देखते थे या जिन्होंने उसे देखा था। “उसे देखनेवाले” हिन्दी में संक्षिप्त है और कालगत संकेत को अनावश्यक रूप से सीमित नहीं करता।
- source_word: יֹאמְרוּ
  choice: कहेंगे
  rationale: אמר का सीधा अर्थ “कहना” है; इसके बाद आने वाले प्रश्नवाचक कथन के कारण “पूछेंगे” करने की आवश्यकता नहीं है।
- source_word: אַיּוֹ
  choice: वह कहाँ है?
  rationale: यह स्थानवाचक प्रश्न है, जिसमें तीसरे पुरुष एकवचन का प्रत्यय जुड़ा है। “अब” या “कहाँ चला गया” जोड़ना मूल से अधिक व्याख्यात्मक होता।
