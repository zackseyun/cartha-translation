    issue: '''नहरों'' for בִּפְלַגּוֹת'
    rationale: The Hebrew refers to streams, channels, or watercourses; Hindi 'नहर' normally suggests a constructed irrigation canal and narrows the image without support.
  - severity: medium
    issue: Broken syntactic attachment of 'मधु और दही की'
    rationale: The line break and dash make 'नहरों को' appear to be the complete object, while the following phrase is left as an awkward fragment. The Hebrew construction presents the watercourses together as abundance imagery.
  - severity: low
    issue: '''घाटी-धाराओं'' is somewhat cumbersome'
    rationale: Although defensible, 'घाटी-नाले' is more idiomatic modern Hindi for seasonal valley watercourses and preserves the range of נַחֲלֵי.
