  naturalness: 'The dash-separated construction is awkward in Hindi: ''वह नहरों को नहीं देखेगा— मधु ... की ... को'' produces a dangling object and obscures that honey and the milk product characterize the watercourses. A single integrated clause is more natural and poetic.'
  terminology: '''धाराएँ'' suitably renders streams; ''नदियाँ'' and ''घाटी-नाले'' retain the Hebrew’s accumulation of watercourse terms. ''मलाई'' is a natural Hindi expression for the rich milk product denoted by חֶמְאָה, while avoiding the more specific modern sense of processed butter; a note preserves the lexical range.'
  issues:
