lexical_decisions:
- source_word: אַל יֵרֶא
  choice: वह ... नहीं देखेगा
  rationale: 'काव्यात्मक संदर्भ में אַל के साथ अपूर्ण क्रिया निषेधात्मक भविष्य का भाव देती है: दुष्ट इस समृद्धि को न देखेगा, न उसका अनुभव करेगा।'
- source_word: בִפְלַגּוֹת
  choice: नहरों को
  rationale: פְלַגּוֹת जल की धाराओं या नहरों को सूचित करता है। ב उपसर्ग को ראה के साथ मुहावरेदार रूप से कर्म-संबंध में समझा गया है।
- source_word: נַהֲרֵי
  choice: नदियों
  rationale: यह נָהָר का बहुवचन संबंध-रूप है; अलग शब्द रखकर इब्रानी की संचित जल-समृद्धि की छवि सुरक्षित रहती है।
- source_word: נַחֲלֵי
  choice: घाटी-धाराओं
  rationale: נַחַל मौसमी नदी, घाटी में बहने वाली धारा, अथवा वादी को सूचित कर सकता है। 'घाटी-धारा' सामान्य पाठक को स्थलाकृति और बहते जल, दोनों का संकेत देती है।
- source_word: דְּבַשׁ
  choice: मधु
  rationale: द dignified biblical abundance imagery के लिए דְּבַשׁ का स्वाभाविक हिन्दी समतुल्य।
- source_word: חֶמְאָה
  choice: दही
  rationale: חֶמְאָה गाढ़े/जमे हुए दुग्ध-पदार्थ, मलाई या मक्खन का बोध करा सकता है। प्राचीन पशुपालक संदर्भ में 'दही' आधुनिक संसाधित मक्खन की अनावश्यक छवि से बचाता है।
