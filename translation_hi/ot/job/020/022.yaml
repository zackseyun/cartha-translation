  yaml_path: translation/ot/job/020/022.yaml
  text: In the fullness of his abundance[a], distress will come upon him[b]; every hand of the miserable will come against him.
translation:
  language: hi
  text: उसकी बहुतायत के पूरे होने पर वह संकट में पड़ जाएगा[a]; हर दुःखी जन का हाथ उस पर आ पड़ेगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब उसकी पर्याप्तता पूरी होगी, वह तंगी में होगा।” इब्रानी पद संक्षिप्त है; ‘बहुतायत/पर्याप्तता’ और ‘संकट/तंगी’ दोनों प्रकार के अनुवाद संभव हैं।
    reason: lexical_alternative
  - marker: b
    text: “हर दुःखी जन का हाथ” का अनुवाद “हर पीड़ित का हाथ,” “हर परिश्रम करने वाले का हाथ,” या “दुःख में पड़े लोगों का हर हाथ” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּמְלֹאות
  choice: जब भरपूर होगी
  rationale: ב־ के साथ מלא का यह रूप समय-परिस्थिति का भाव देता है—‘जब पूर्णता पर हो।’ हिंदी में यह स्वाभाविक है और चरम अवस्था का संकेत बनाए रखता है।
- source_word: שִׂפְקוֹ
  choice: उसकी समृद्धि
  rationale: שׂפק यहाँ पर्याप्तता, बहुतायत या संपन्न दशा को सूचित करता है। संदर्भ में ‘समृद्धि’ सहज आधुनिक हिंदी है।
- source_word: יֵצֶר לוֹ
  choice: वह संकट में पड़ जाएगा
  rationale: यह पद संकुचन या तंगी में आ जाने का भाव व्यक्त करता है। ‘संकट में पड़ जाएगा’ उस भाव को स्पष्ट और स्वाभाविक हिंदी में देता है।
- source_word: כָּל יַד
  choice: हर ... का हाथ
  rationale: वितरणात्मक כָּל और एकवचन יַד की सजीव इब्रानी अभिव्यक्ति को बनाए रखा गया है।
- source_word: עָמֵל
  choice: दुःखी जन
  rationale: עָמֵל श्रम करने वाले, क्लेश सहने वाले या दुःख में पड़े व्यक्ति को सूचित कर सकता है। यहाँ ‘दुःखी जन’ संदर्भानुकूल है और शब्द की पीड़ा-संबंधी व्यापकता को बचाता है।
- source_word: תְּבוֹאֶנּוּ
  choice: उसके विरुद्ध उठेगा
  rationale: शाब्दिक भाव ‘उस पर/उसके पास आएगा’ है; ‘हाथ’ के साथ हिंदी में ‘विरुद्ध उठेगा’ स्वाभाविक रूप से विरोधी क्रिया व्यक्त करता है।
