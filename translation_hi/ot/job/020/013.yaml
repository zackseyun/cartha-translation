  text: He spares it and does not let it go[a], and holds it in his mouth.
translation:
  language: hi
  text: 'वह उसे बचाकर रखता है और छोड़ता नहीं;

    उसे अपने मुँह में[a] रोके रखता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘अपने तालु के भीतर।’
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְמֹל
  choice: बचाकर रखता है
  rationale: חמל का मूल भाव दया दिखाने या नष्ट न करने का है। यहाँ पिछली पंक्ति में दुष्टता को मीठी वस्तु की तरह सँजोने के चित्र के कारण ‘बचाकर रखता है’ उस वस्तु को न छोड़ने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עָלֶיהָ
  choice: उसे
  rationale: स्त्रीलिंग एकवचन प्रत्यय पिछले पद की ‘दुष्टता’ की ओर संकेत करता है। חמל के साथ על यहाँ कर्म-सदृश अर्थ देता है, इसलिए हिन्दी में ‘उसे’ स्वाभाविक है।
- source_word: לֹא יַעַזְבֶנָּה
  choice: छोड़ता नहीं
  rationale: עזב का अर्थ छोड़ना, त्यागना या परित्याग करना है। इस प्रसंग में ‘छोड़ता नहीं’ उस वस्तु को जाने न देने का सीधा और स्वाभाविक भाव रखता है।
- source_word: יִמְנָעֶנָּה
  choice: रोके रखता है
  rationale: מנע में रोकने, अपने पास बनाए रखने या न देने का भाव है। यहाँ मुँह में मीठी वस्तु को बनाए रखने के ठोस चित्र को ‘रोके रखता है’ स्पष्ट करता है।
- source_word: בְּתוֹךְ חִכּוֹ
  choice: अपने मुँह में
  rationale: חך का अधिक शाब्दिक अर्थ ‘तालु’ है, पर इस काव्यात्मक चित्र में ‘अपने मुँह में’ सामान्य आधुनिक हिन्दी में अधिक सहज है; शाब्दिक अंग-सूचक अर्थ पादटिप्पणी में रखा गया है।
