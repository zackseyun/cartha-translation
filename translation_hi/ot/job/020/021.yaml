lexical_decisions:
- source_word: אֵין שָׂרִיד
  choice: कुछ भी बाकी न रहा
  rationale: शाब्दिक अर्थ ‘कोई बचा हुआ/शेष जन या वस्तु नहीं’ है। प्रसंग में यह स्वाभाविक हिन्दी में पूर्ण उपभोग को व्यक्त करता है, बिना ‘बचे हुए’ को अनावश्यक रूप से व्यक्ति मानने के।
- source_word: לְאָכְלוֹ
  choice: उसके खाने के लिए
  rationale: אכל के इनफ़िनिटिव कंस्ट्रक्ट, ל उपसर्ग और तृतीय पुरुष एकवचन प्रत्यय को निकटता से व्यक्त करता है। ‘निगलने’ जैसा अधिक तीखा अर्थ सम्भव है, पर मूल क्रिया सामान्यतः ‘खाना’ है।
- source_word: עַל כֵּן
  choice: इसलिए
  rationale: यह मानक परिणामसूचक पदबंध है, जो पहले कथन से परिणाम जोड़ता है।
- source_word: יָחִיל
  choice: टिकी ... रहेगी
  rationale: यहाँ क्रिया कठिन है। ‘टिके रहना/स्थिर रहना’ प्रसंग में טוּבוֹ के बने रहने का स्वाभाविक अर्थ देता है और ‘फलना-फूलना’ जैसी अधिक व्याख्यात्मक सम्भावना से बचता है।
- source_word: טוּבוֹ
  choice: उसकी समृद्धि
  rationale: शाब्दिक रूप से ‘उसका भला/अच्छी वस्तु’; दुष्ट की प्राप्त संपदा और अच्छे हाल की चर्चा में ‘समृद्धि’ अर्थ को सहज रूप से व्यक्त करती है।
