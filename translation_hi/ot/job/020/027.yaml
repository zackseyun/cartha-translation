  text: יְגַלּ֣וּ שָׁמַ֣יִם עֲוֺנ֑/וֹ וְ֝/אֶ֗רֶץ מִתְקוֹמָ֘מָ֥ה לֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/027.yaml
  text: The heavens will reveal his iniquity[b][a], and the earth will rise up against him.
translation:
  language: hi
  text: आकाश उसके अधर्म[a] को प्रकट करेगा, और पृथ्वी[b] उसके विरुद्ध उठ खड़ी होगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसके दोष’; इब्रानी शब्द नैतिक दुष्कर्म या उससे जुड़े दोष—दोनों को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘भूमि’; पर इस काव्यात्मक प्रसंग में ‘आकाश’ के समानांतर ‘पृथ्वी’ अधिक उपयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְגַלּוּ
  choice: प्रकट करेगा
  rationale: पिएल अपूर्ण रूप यहाँ छिपे हुए अपराध को उजागर या प्रकट करने का भाव देता है। हिन्दी में संयुक्त कर्ता ‘आकाश’ के अनुसार एकवचन क्रिया स्वाभाविक है।
- source_word: שָׁמַיִם
  choice: आकाश
  rationale: इब्रानी बहुवचन संज्ञा प्रायः सामूहिक एकवचन अर्थ देती है। ‘आकाश’ आधुनिक हिन्दी में स्वाभाविक है और पृथ्वी के साथ काव्यात्मक ब्रह्मांडीय समानांतर बनाए रखता है।
- source_word: עֲוֺנוֹ
  choice: उसके अधर्म
  rationale: עָוֹן नैतिक दुष्कर्म और उससे जुड़े दोष—दोनों को सूचित कर सकता है। ‘अधर्म’ पद्य के नैतिक और न्यायिक भार को बनाए रखता है; ‘दोष’ को पादटिप्पणी में विकल्प दिया गया है।
- source_word: וְאֶרֶץ
  choice: और पृथ्वी
  rationale: आकाश के समानांतर और ब्रह्मांडीय मानवीकरण के कारण यहाँ ‘भूमि’ की अपेक्षा ‘पृथ्वी’ अधिक उपयुक्त है।
- source_word: מִתְקוֹמָמָה
  choice: उठ खड़ी होगी
  rationale: यह रूप विरोध में उठने का सजीव भाव देता है। स्त्रीलिंग कर्ता ‘पृथ्वी’ के साथ ‘उठ खड़ी होगी’ स्वाभाविक हिन्दी है और मानवीकरण को सुरक्षित रखता है।
- source_word: לוֹ
  choice: उसके विरुद्ध
  rationale: קום से बने विरोधात्मक क्रियारूप के साथ ל यहाँ प्रतिकूलता व्यक्त करता है; इसलिए शाब्दिक ‘उसके लिए/उसकी ओर’ के बजाय ‘उसके विरुद्ध’ प्रसंगानुकूल है।
