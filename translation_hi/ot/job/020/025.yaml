    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַף
  choice: वह उसे खींच निकालता है
  rationale: क्रिया का अर्थ किसी वस्तु, विशेषकर हथियार, को खींचकर निकालना है। कर्म मूल में निहित है; संदर्भ के आधार पर स्पष्टता के लिए ‘उसे’ रखा गया है।
- source_word: וַיֵּצֵא מִגֵּוָה
  choice: और वह उसके शरीर से बाहर आता है
  rationale: יָצָא बाहर आने को और גֵּוָה शरीर या धड़ को दर्शाता है। ‘शरीर’ सहज है और शरीर के किसी अधिक विशिष्ट भाग को अनावश्यक रूप से तय नहीं करता।
- source_word: וּבָרָק
  choice: चमकती नोक
  rationale: בָּרָק का मूल बिंब बिजली या चमक है; हथियार के संदर्भ में यह उसकी चमकती नोक अथवा धार का लाक्षणिक संकेत हो सकता है।
- source_word: מִמְּרֹרָתוֹ
  choice: उसके पित्त से
  rationale: यह शब्द पित्त, पित्ताशय या कड़वाहट का संकेत दे सकता है। यहाँ शारीरिक घाव के सजीव वर्णन में ‘पित्त’ स्वाभाविक और प्रभावशाली है।
- source_word: יַהֲלֹךְ עָלָיו אֵמִים
  choice: उस पर भय छा जाते हैं
  rationale: मुहावरा भय के उस पर आ पड़ने या उसे घेर लेने का भाव देता है; बहुवचन אֵמִים की तीव्रता ‘भय छा जाते हैं’ में बनी रहती है।
