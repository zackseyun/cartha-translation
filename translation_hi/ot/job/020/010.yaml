base_translation:
  language: en
  yaml_path: translation/ot/job/020/010.yaml
  text: His sons will seek the favor of the poor[b][a], and his own hands will give back his wealth.
translation:
  language: hi
  text: उसके बेटे निर्धनों से अनुग्रह माँगेंगे[a], और उसके हाथ उसकी संपत्ति लौटा देंगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “निर्धनों को तुष्ट करेंगे” अथवा “निर्धनों की कृपा पाने का प्रयत्न करेंगे”; इब्रानी क्रिया अनुकूलता या स्वीकृति पाने, अथवा उन लोगों को शांत करने का भाव दे सकती है जिनके साथ अन्याय हुआ हो।
    reason: lexical_alternative
  - marker: b
    text: या “उसके साधन” अथवा “उसकी सामर्थ्य”; इब्रानी संज्ञा धन-संपत्ति, संसाधन या शक्ति का बोध करा सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנָיו
  choice: उसके बेटे
  rationale: पुल्लिंग बहुवचन संज्ञा और तृतीय पुरुष एकवचन पुल्लिंग प्रत्यय का सीधा, स्वाभाविक अनुवाद; संदर्भ में ‘बेटे’ स्रोत के लिंग-वचन को सुरक्षित रखता है।
- source_word: יְרַצּוּ
  choice: मनाने का प्रयास करेंगे
  rationale: רצה के पिएल रूप में कृपा पाने, प्रसन्न करने या शांत करने का भाव हो सकता है। यह चयन निर्धनों से अनुकूलता पाने अथवा उन्हें संतुष्ट करने का संबंधपरक भाव रखता है, पर किसी एक सूक्ष्म अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: דַלִּים
  choice: निर्धनों को
  rationale: דַלִּים आर्थिक रूप से गरीब अथवा सामाजिक रूप से दुर्बल लोगों को सूचित कर सकता है; यहाँ धन लौटाने के संदर्भ में ‘निर्धनों’ स्वाभाविक और उपयुक्त है।
- source_word: יָדָיו
  choice: उसके अपने हाथ
  rationale: ‘हाथ’ का शाब्दिक बिंब सुरक्षित है और ‘अपने’ से यह बल उभरता है कि लौटाने का काम उसी से संबंधित है।
- source_word: תָּשֵׁבְנָה
  choice: लौटा देंगे
  rationale: שוב का हिफ़ील रूप किसी वस्तु को वापस करने या पुनः स्थापित करने का अर्थ देता है; ‘लौटा देंगे’ आधुनिक हिंदी में सहज है।
- source_word: אוֹנוֹ
  choice: उसकी संपत्ति
  rationale: אוֹן धन-संपत्ति, साधन या सामर्थ्य को सूचित कर सकता है। निर्धनों को प्रतिपूर्ति के संदर्भ में ‘संपत्ति’ सर्वाधिक उपयुक्त है, जबकि अर्थ-विस्तार पादटिप्पणी में रखा गया है।
