  alternative: ‘उत्कर्ष’ या ‘ऊँचा पद’
  rationale: मूल की स्थानिक कविता को प्राथमिकता दी गई है और रूपकात्मक व्यंजना को निश्चित सिद्धांत के रूप में नहीं थोपा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और काव्यात्मक वाक्य रखा गया है। ‘चाहे… जाए’ अगले पद में आने वाले विरोधी परिणाम की भूमिका स्वाभाविक ढंग से बाँधता है; ‘ऊँचाई’ दृश्य बिंब और रूपकात्मक अस्पष्टता दोनों को सुरक्षित रखती है।
