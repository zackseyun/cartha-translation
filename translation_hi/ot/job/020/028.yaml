  text: יִ֭גֶל יְב֣וּל בֵּית֑/וֹ נִ֝גָּר֗וֹת בְּ/י֣וֹם אַפּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/028.yaml
  text: The produce of his house will be carried away[b][a], flowing away in the day of his anger.
translation:
  language: hi
  text: उसके घर की उपज चली जाएगी[a]; उसके क्रोध[b] के दिन वह बहकर निकल जाएगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘निर्वासन में चली जाएगी’ अथवा ‘दूर कर दी जाएगी’; यह क्रिया चले जाने, निर्वासन में जाने या हटा दिए जाने का भाव दे सकती है। यहाँ इसका संबंध दुष्ट के घर की उपज या संपत्ति से है।
    reason: lexical_alternative
  - marker: b
    text: संभवतः परमेश्वर के क्रोध का दिन; इब्रानी में ‘उसके’ का संदर्भ स्पष्ट रूप से नहीं बताया गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: יִגֶל
  choice: चली जाएगी
  rationale: גלה के क़ाल रूप का मूल भाव चले जाने या दूर हो जाने का है। यहाँ विषय घर की उपज है; इसलिए यह चुनाव उसके नष्ट होकर दूर चले जाने को व्यक्त करता है, बिना किसी अनकहे कर्ता को जोड़कर कर्मवाच्य बनाने के।
- source_word: יְבוּל
  choice: उपज
  rationale: यह शब्द फल, पैदावार या बढ़ोतरी को दर्शाता है। ‘उपज’ घर की संपत्ति और उससे प्राप्त लाभ—दोनों के व्यापक संदर्भ में स्वाभाविक है।
- source_word: בֵּיתוֹ
  choice: उसके घर की
  rationale: इब्रानी का शाब्दिक चित्र बनाए रखता है; ‘घर’ यहाँ गृहस्थी या संपत्ति के व्यापक अर्थ को भी समेट सकता है।
- source_word: נִגָּרוֹת
  choice: बहती हुई निकल जाएगी
  rationale: נגר का निफ़अल रूप बहा दिए जाने या बहकर निकल जाने का चित्र देता है। यह वाक्यांश तरल पदार्थ की तरह संपत्ति के बह जाने की छवि बनाए रखता है।
- source_word: בְּיוֹם
  choice: के दिन
  rationale: समय-सूचक इब्रानी पदबंध का संक्षिप्त और गरिमापूर्ण हिन्दी रूप।
- source_word: אַפּוֹ
  choice: उसके क्रोध
  rationale: प्रत्यय पुल्लिंग एकवचन है, पर पद स्वयं यह स्पष्ट नहीं करता कि ‘उसके’ का संकेत किसकी ओर है। इसलिए मुख्य पाठ में अस्पष्टता सुरक्षित रखी गई है।
theological_decisions:
- issue: ‘उसके क्रोध’ का संदर्भ
  choice: मुख्य पाठ में केवल ‘उसके क्रोध’ रखा गया
  alternative: ‘परमेश्वर के क्रोध’
  rationale: संदर्भ में परमेश्वर का क्रोध सबसे संभावित अर्थ है, फिर भी इब्रानी पद में परमेश्वर का नाम स्पष्ट रूप से नहीं है। अनकहे संदर्भ को मुख्य पाठ में निश्चित करने के बजाय टिप्पणी में बताया गया है।
- issue: न्याय में संपत्ति के चले जाने की क्रिया
  choice: ‘चली जाएगी’ और ‘बहती हुई निकल जाएगी’
  alternative: ‘उठा ली जाएगी’ या ‘बहा दी जाएगी’
  rationale: चुना हुआ रूप मूल पाठ की गति और विनाश की छवि को रखता है, पर किसी ऐसे स्पष्ट कर्ता को नहीं जोड़ता जिसका उल्लेख इब्रानी में नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण काव्यात्मक शैली रखी गई है। अर्धविराम समानांतर कथनों को जोड़ता है। ‘उपज’ और बहकर निकलने की छवि मूल पद की ठोस भाषा को सुरक्षित रखते हैं।
