base_translation:
  language: en
  yaml_path: translation/ot/job/020/015.yaml
  text: He swallowed wealth[a], but he will vomit it up[b]; God will drive it out of his belly.
translation:
  language: hi
  text: उसने धन[a] निगल लिया, पर वह उसे उगल देगा; परमेश्वर उसे उसके पेट से बाहर निकाल देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सम्पत्ति”।
    reason: lexical_alternative
lexical_decisions:
- source_word: חַיִל
  choice: धन
  rationale: इस ज्ञान-साहित्यिक संदर्भ में यह शब्द भौतिक संपत्ति या समृद्धि को दर्शाता है; ‘धन’ सहज और सटीक है।
- source_word: בָּלַע
  choice: निगल लिया
  rationale: यह चयन खाने-निगलने के सजीव रूपक को बनाए रखता है, जिसे आगे ‘उगल देगा’ जारी रखता है।
- source_word: וַיְקִאֶנּוּ
  choice: पर वह उसे उगल देगा
  rationale: क्रिया का अर्थ ‘उगलना/वमन करना’ है; ‘पर’ निगले हुए धन को न रख पाने की काव्यात्मक उलटबाँसी स्पष्ट करता है।
- source_word: מִבִּטְנוֹ
  choice: उसके पेट से
  rationale: ‘पेट’ आधुनिक हिन्दी में स्वाभाविक है और निगले हुए धन के बलपूर्वक बाहर निकाले जाने की शारीरिक छवि सुरक्षित रखता है।
- source_word: יוֹרִשֶׁנּוּ
  choice: उसे ... बाहर निकाल देगा
  rationale: 'हिफ़ील रूप यहाँ कारक निष्कासन व्यक्त करता है: परमेश्वर निगले हुए धन को उसके भीतर से निकलवा देता है।'
- source_word: אֵל
  choice: परमेश्वर
  rationale: यहाँ אֵל स्पष्ट रूप से ईश्वर को कर्ता बताता है; ‘परमेश्वर’ मानक, गरिमापूर्ण हिन्दी रूप है।
theological_decisions:
- issue: दुष्ट के धन के निष्कासन में न्याय का कर्ता
  choice: परमेश्वर को स्पष्ट कर्ता रखा गया है, जो धन को उसके पेट से बाहर निकाल देता है।
  alternative: इसे केवल कर्म का स्वाभाविक परिणाम मानना या कर्ता को अस्पष्ट छोड़ना।
  rationale: इब्रानी पाठ में אֵל, יוֹרִשֶׁנּוּ का स्पष्ट कर्ता है; इसलिए ईश्वरीय सक्रियता को नरम या अस्पष्ट नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘निगल लिया—उगल देगा—पेट से बाहर निकाल देगा’ के माध्यम से मूल की तीखी शारीरिक और काव्यात्मक छवि संरक्षित है।
