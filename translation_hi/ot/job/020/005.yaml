source:
  edition: WLC
  text: כִּ֤י רִנְנַ֣ת רְ֭שָׁעִים מִ/קָּר֑וֹב וְ/שִׂמְחַ֖ת חָנֵ֣ף עֲדֵי רָֽגַע־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/005.yaml
  text: For the rejoicing of the wicked is brief[a], and the joy of the godless lasts only a moment.
translation:
  language: hi
  text: 'क्योंकि दुष्टों का उल्लास क्षणिक है,

    और भक्तिहीन का आनन्द पल भर का है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार या कारण प्रस्तुत करता है; ‘क्योंकि’ इस व्याख्यात्मक-कारणसूचक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: רִנְנַת
  choice: जयघोष
  rationale: यह शब्द आनन्द की मुखर पुकार या उल्लासपूर्ण ध्वनि को दर्शाता है; ‘जयघोष’ उसके श्रव्य पक्ष को ‘आनन्द’ मात्र की अपेक्षा अधिक स्पष्ट रखता है।
- source_word: רְשָׁעִים
  choice: दुष्टों
  rationale: यह नैतिक रूप से दोषी या बुरे लोगों के लिए प्रयुक्त बहुवचन संज्ञात्मक विशेषण है; ज्ञान-साहित्य में ‘दुष्ट’ सहज और स्थापित समतुल्य है।
- source_word: מִקָּרוֹב
  choice: थोड़े ही समय का
  rationale: सन्दर्भ में यह स्थानिक निकटता नहीं, बल्कि अल्प अवधि या शीघ्र अन्त का भाव देता है; यह रूप उस कालगत अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְשִׂמְחַת
  choice: और ... का आनन्द
  rationale: यह पहले अर्धपद के समानान्तर आनन्द या प्रसन्नता को व्यक्त करने वाला संबंधसूचक पद है।
- source_word: חָנֵף
  choice: भक्तिहीन
  rationale: अय्यूब में यह शब्द केवल दिखावटी धार्मिक व्यक्ति नहीं, बल्कि परमेश्वर के प्रति श्रद्धा और निष्ठा से रहित व्यक्ति के व्यापक अर्थ में आता है; ‘भक्तिहीन’ समानान्तर ‘दुष्टों’ के साथ इस अर्थ को बनाए रखता है।
- source_word: עֲדֵי רָגַע
  choice: बस पल भर टिकता है
  rationale: यह पद अवधि की अत्यन्त छोटी सीमा बताता है; ‘बस पल भर टिकता है’ निहित क्रिया और कालगत सीमा दोनों को स्पष्ट, काव्यात्मक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: חָנֵף का नैतिक-धार्मिक अर्थ
  choice: भक्तिहीन
  alternative: कपटी
  rationale: ‘कपटी’ केवल पाखंड या दिखावे का अर्थ प्रमुख कर सकता है, जबकि अय्यूब में यह शब्द अधिक व्यापक रूप से अधर्मी अथवा ईश्वर-विमुख व्यक्ति को सूचित करता है। यहाँ ‘भक्तिहीन’ उस व्यापकता को सुरक्षित रखता है और किसी विशिष्ट सम्प्रदायगत अर्थ को नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज काव्यात्मक शैली रखी गई है। दोनों अर्धपदों का समानान्तर विन्यास सुरक्षित है; ‘जयघोष’ मूल के मुखर उल्लास को और ‘बस पल भर’ उसकी क्षणभंगुरता को उभारता है।
