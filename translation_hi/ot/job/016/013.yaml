id: JOB.16.13
reference: Job 16:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יָ֘סֹ֤בּוּ עָלַ֨/י רַבָּ֗י/ו יְפַלַּ֣ח כִּ֭לְיוֹתַ/י וְ/לֹ֣א יַחְמ֑וֹל יִשְׁפֹּ֥ךְ לָ֝/אָ֗רֶץ מְרֵרָֽתִ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/013.yaml
  text: His archers surround me[a]; he splits open my kidneys and does not spare[c][b]; he pours out my gall on the ground.
translation:
  language: hi
  text: उसके धनुर्धर मुझे घेर लेते हैं[a]; वह मेरे गुर्दों को चीर डालता है[b] और तनिक भी दया नहीं करता; वह मेरा पित्त भूमि पर उंडेल देता है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसके महान जन’ अथवा ‘उसके प्रधान पुरुष’। इब्रानी रूप कठिन है; इस पद और व्यापक प्रसंग के आक्रमण-संबंधी बिंब में ‘उसके धनुर्धर’ उपयुक्त बैठता है।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक रूप से ‘मेरे गुर्दे’; इब्रानी मुहावरे में गुर्दे भीतरी अंगों और विस्तार से मनुष्य के अंतरतम को भी सूचित कर सकते हैं।
    reason: cultural_note
  - marker: c
    text: या ‘मेरी कड़वाहट’; यहाँ प्रयुक्त शब्द का अर्थ शारीरिक ‘पित्त’ भी हो सकता है, जो इस पद की हिंसक शारीरिक छवि के अनुकूल है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יָסֹבּוּ
  choice: घेर लेते हैं
  rationale: सבב का कालगत रूप यहाँ शत्रुतापूर्ण घेरेबंदी दिखाता है; यह सहज आधुनिक हिन्दी में सैन्य आक्रमण का बिंब बनाए रखता है।
- source_word: רַבָּיו
  choice: उसके धनुर्धर
  rationale: इब्रानी रूप कठिन है और उसका संबंध ‘महान जन’ या ‘प्रधान पुरुष’ से भी जोड़ा जा सकता है; किंतु ‘धनुर्धर’ इस पद और आसपास के भेदन तथा आक्रमण के बिंब के साथ सबसे स्वाभाविक रूप से मेल खाता है।
- source_word: יְפַלַּח
  choice: चीर डालता है
  rationale: פלח का पिएल रूप शरीर को हिंसक ढंग से चीरने या फाड़ने का भाव देता है; ‘चीर डालता है’ उसकी तीव्रता को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כִּלְיוֹתַי
  choice: मेरे गुर्दों
  rationale: यह शब्द शाब्दिक रूप से गुर्दों को दर्शाता है। अमूर्त व्याख्या के स्थान पर ठोस शारीरिक अंग बनाए रखने से मूल की तीखी शारीरिक छवि सुरक्षित रहती है।
- source_word: לֹא יַחְמוֹל
  choice: तनिक भी दया नहीं करता
  rationale: חמל का अर्थ यहाँ न बख्शना या दया न करना है; ‘तनिक भी’ प्रसंग में दया के पूर्ण अभाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יִשְׁפֹּךְ
  choice: उंडेल देता है
  rationale: שפך का मूल अर्थ उंडेलना या बहा देना है; यह भीतर के द्रव को भूमि पर निकाल देने की सजीव छवि बनाए रखता है।
- source_word: מְרֵרָתִי
  choice: मेरा पित्त
  rationale: यह संज्ञा शाब्दिक रूप से पित्त को और संबंधवश कड़वाहट को सूचित कर सकती है; इस पद की शारीरिक हिंसा के प्रसंग में ‘पित्त’ अधिक उपयुक्त है।
theological_decisions:
- issue: काव्यात्मक दुःख-वर्णन में मनुष्य के भीतरी अंगों का बिंब
  choice: मुख्य पाठ में ‘गुर्दों’ और ‘पित्त’ जैसे ठोस शारीरिक शब्द बनाए रखे गए हैं।
  alternative: ‘अंतरतम’ या ‘कड़वाहट’ जैसे व्याख्यात्मक अमूर्त शब्द अपनाना।
  rationale: अय्यूब का दुःख यहाँ अत्यंत तीखे शारीरिक बिंबों में व्यक्त है। शाब्दिक अंगों को बनाए रखना इब्रानी कविता की शक्ति और उसके तनाव को सुरक्षित रखता है तथा पाठ को अनावश्यक रूप से नरम या आध्यात्मिक नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, काव्यात्मक किंतु सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘धनुर्धर’, ‘भूमि’ और ‘उंडेल देता है’ गरिमापूर्ण शैली देते हैं, जबकि ‘गुर्दे’ अस्पष्ट संस्कृतनिष्ठ ‘वृक्क’ की अपेक्षा अधिक सहज है। सर्वनाम और एकवचन क्रियाएँ परमेश्वर को आक्रमण के अंतिम कर्ता के रूप में रखती हैं, जबकि बहुवचन ‘धनुर्धर’ उसके आक्रमणकारी साधनों को दर्शाता है।
