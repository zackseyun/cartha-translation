translation:
  language: hi
  text: मेरे मित्र ही मेरा उपहास करते हैं[a]; मेरी आँख परमेश्वर की ओर आँसू बहाती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे मित्र मेरे पक्ष में बोलने वाले/मध्यस्थ हैं।” इब्रानी शब्द מְלִיצַי को कुछ लोग सकारात्मक अर्थ में समझते हैं; पर इस प्रसंग में “उपहास करते हैं” अय्यूब की शिकायत से अधिक मेल खाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מְלִיצַי
  choice: मेरा उपहास करते हैं
  rationale: इस रूप का अर्थ उपहास या ठट्ठा करने वालों के रूप में लिया जा सकता है। अय्यूब की शिकायत के प्रसंग में उसके मित्रों का विरोधी व्यवहार यही भाव सबसे स्वाभाविक बनाता है; मध्यस्थों वाला सम्भव अर्थ पादटिप्पणी में रखा गया है।
- source_word: רֵעָי
  choice: मेरे मित्र
  rationale: רֵעַ का सामान्य अर्थ मित्र या साथी है। ‘मित्र’ उस विडंबना को बनाए रखता है कि जिनसे सहारा मिलना चाहिए था, वही उसका उपहास कर रहे हैं।
- source_word: אֶל אֱלוֹהַ
  choice: परमेश्वर के सामने
  rationale: אֶל दिशा या अभिमुखता बताता है। यहाँ यह वाक्यांश आँसुओं से भरी विनती का परमेश्वर की ओर होना व्यक्त करता है; सहज हिन्दी में ‘परमेश्वर के सामने’ यह संबंध स्पष्ट करता है।
- source_word: דָּלְפָה
  choice: आँसू बहाती है
  rationale: क्रिया का मूल चित्र टपकने या बहने का है। आँख के साथ ‘आँसू बहाती है’ आधुनिक हिन्दी में स्वाभाविक रहते हुए निरंतर रोने का चित्र सुरक्षित रखता है।
- source_word: עֵינִי
  choice: मेरी आँख
  rationale: इब्रानी में संज्ञा एकवचन है। काव्यात्मक और सजीव अभिव्यक्ति बनाए रखने के लिए हिन्दी में भी एकवचन रखा गया है।
theological_decisions:
- issue: מְלִיצַי का नकारात्मक या सकारात्मक अर्थ
  choice: उपहास करने वाले
  alternative: मध्यस्थ/पक्ष में बोलने वाले
  rationale: निकटवर्ती प्रसंग में अय्यूब अपने मित्रों के कटु और विरोधी व्यवहार की शिकायत करता है, इसलिए नकारात्मक अर्थ मुख्य पाठ में अधिक उपयुक्त है। फिर भी शब्द का सकारात्मक अर्थ सम्भव माना गया है और उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मेरी आँख’ के एकवचन और आँसू बहने के काव्यात्मक चित्र को सुरक्षित रखा गया है।
