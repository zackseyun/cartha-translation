source:
  edition: WLC
  text: וְ/יוֹכַ֣ח לְ/גֶ֣בֶר עִם אֱל֑וֹהַּ וּֽ/בֶן אָדָ֥ם לְ/רֵעֵֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/021.yaml
  text: that he would arbitrate for a man with God[c][b][a], as a son of man does for his neighbor.
translation:
  language: hi
  text: कि वह किसी मनुष्य की ओर से परमेश्वर के साथ मुकदमा लड़े[a], जैसे कोई मनुष्य[b] अपने पड़ोसी की ओर से मुकदमा लड़ता है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “किसी मनुष्य की ओर से परमेश्वर के साथ वाद-विवाद करे” या “न्याय करे”; इब्रानी क्रिया में किसी मामले का निर्णय करने, मध्यस्थता करने, या किसी का मुकदमा लड़ने का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “मनुष्य का पुत्र”; यहाँ यह सामान्य मनुष्य के लिए एक मुहावरा है, आवश्यक रूप से कोई उपाधि नहीं।
    reason: lexical_alternative
  - marker: c
    text: या “अपने मित्र की ओर से।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיוֹכַח
  choice: मुकदमा लड़े
  rationale: हिफ़ील रूप यहाँ न्यायिक संदर्भ में किसी का पक्ष रखने, विवाद का निर्णय कराने या मुकदमा लड़ने का भाव दे सकता है। हिंदी में यह अभिव्यक्ति कानूनी पक्षसमर्थन को स्वाभाविक रूप से व्यक्त करती है।
- source_word: לְגֶבֶר
  choice: मनुष्य की ओर से
  rationale: לְ को हितार्थक मानते हुए यह उस मनुष्य को दर्शाता है जिसकी ओर से न्यायिक कार्य किया जाए; גֶּבֶר यहाँ सामान्य मानवीय वादी के अर्थ में है।
- source_word: עִם אֱלוֹהַּ
  choice: परमेश्वर के सामने
  rationale: עִם का मूल अर्थ ‘के साथ’ है, पर न्यायिक विवाद में हिंदी का ‘के सामने’ उस पक्ष को स्पष्ट करता है जिसके समक्ष या जिसके साथ मुकदमा है, बिना तटस्थ मध्यस्थता को अनिवार्य बनाए।
- source_word: וּבֶן אָדָם
  choice: जैसे मनुष्य का पुत्र
  rationale: शाब्दिक इब्रानी पदबंध और गֶּבֶר के साथ उसका काव्यात्मक समानांतर सुरक्षित रखा गया है; हिंदी में तुलना स्पष्ट करने के लिए ‘जैसे’ जोड़ा गया है।
- source_word: לְרֵעֵהוּ
  choice: अपने पड़ोसी की ओर से
  rationale: רֵעַ का अर्थ पड़ोसी, मित्र या साथी हो सकता है। समानांतर हितार्थक לְ को ‘की ओर से’ द्वारा व्यक्त किया गया है।
theological_decisions:
- issue: ‘मनुष्य का पुत्र’ का संभावित मसीही अतिपाठ
  choice: इसे तत्काल प्रसंग में सामान्य मनुष्य के लिए प्रयुक्त इब्रानी मुहावरे के रूप में रखा गया है।
  alternative: ‘मानव’ अनुवाद करना, या इसे उपाधि मानकर ‘मनुष्य का पुत्र’ को विशिष्ट मसीही अर्थ देना।
  rationale: यहाँ בֶּן־אָדָם, גֶּבֶר के समानांतर सामान्य मानव को सूचित करता है। पाठ बाद की मसीही उपाधि को आवश्यक नहीं करता।
- issue: वक्ता की अभिलाषा में पक्षसमर्थन या तटस्थ मध्यस्थता
  choice: मनुष्य की ओर से परमेश्वर के सामने मुकदमा लड़ने का हितार्थक अर्थ रखा गया है।
  alternative: मनुष्य और परमेश्वर के बीच तटस्थ पंचनिर्णय करना।
  rationale: दोनों לְ उपसर्गों की समानांतर हितार्थक भूमिका पक्षसमर्थन की व्याख्या को बल देती है; फिर भी क्रिया की व्यापक न्यायिक अर्थ-सीमा पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिंदी। न्यायिक बिंब को स्पष्ट रखा गया है और इब्रानी काव्यात्मक समानांतरता बचाने के लिए ‘मनुष्य का पुत्र’ बनाए रखा गया है।
