  text: גַּם עַ֭תָּה הִנֵּה בַ/שָּׁמַ֣יִם עֵדִ֑/י וְ֝/שָׂהֲדִ֗/י בַּ/מְּרוֹמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/019.yaml
  text: Even now[a], behold, my witness is in heaven[b], and he who testifies for me is in the heights.
translation:
  language: hi
  text: अब भी, देखो—स्वर्ग में मेरा गवाह है, और ऊँचे स्थानों में मेरा साक्षी है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גַּם עַתָּה
  choice: अब भी
  rationale: यह संयुक्त पद अय्यूब की वर्तमान दशा में भी बने हुए तथ्य पर बल देता है; ‘अब भी’ आधुनिक हिन्दी में स्वाभाविक और संक्षिप्त है।
- source_word: הִנֵּה
  choice: देखो—
  rationale: यह ध्यान खींचने वाला संकेतक है। ‘देखो’ वर्तमान हिन्दी में इसके बल को सहज रूप से व्यक्त करता है; डैश अगले दावे पर आकस्मिक जोर दिखाता है।
- source_word: בַשָּׁמַיִם
  choice: स्वर्ग में
  rationale: यहाँ शब्द भौतिक आकाश से अधिक स्वर्गीय लोक को सूचित करता है और समानांतर ‘ऊँचे स्थानों’ से मेल खाता है।
- source_word: עֵדִי
  choice: मेरा गवाह
  rationale: यह कानूनी बिंब को सीधे बनाए रखता है और किसी विशिष्ट स्वर्गीय व्यक्तित्व की पहचान तय नहीं करता।
- source_word: וְשָׂהֲדִי
  choice: और ऊँचे स्थानों में वह है जो मेरे पक्ष में गवाही देता है
  rationale: अरामी रंग वाला यह निकटार्थक पद गवाह/साक्षी देने वाले व्यक्ति को सूचित करता है। वर्णनात्मक हिन्दी पुनरुक्ति घटाते हुए पक्ष-समर्थक गवाही का न्यायिक भाव रखती है, पर ‘वकील’ जैसी अधिक व्याख्यात्मक संज्ञा से बचती है।
- source_word: בַּמְּרוֹמִים
  choice: ऊँचे स्थानों में
  rationale: बहुवचन और स्थानगत ऊँचाई के चित्र को सुरक्षित रखते हुए यह ‘स्वर्ग में’ के साथ काव्यात्मक समानांतरता बनाता है।
theological_decisions:
- issue: अय्यूब के स्वर्गीय गवाह की पहचान
  choice: पद को केवल उसके कार्य—‘मेरा गवाह’ और ‘मेरे पक्ष में गवाही देता है’—के द्वारा व्यक्त किया गया है।
  alternative: इसे स्वयं परमेश्वर, किसी स्वर्गदूत-मध्यस्थ, अथवा अय्यूब की गवाही के काव्यात्मक व्यक्तीकरण के रूप में स्पष्ट करना।
  rationale: इब्रानी पाठ उस गवाह की पहचान स्पष्ट नहीं करता। इसलिए अनुवाद न्यायिक बिंब और धार्मिक तनाव को बनाए रखता है, किसी एक व्याख्या को स्थापित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; काव्यात्मक गरिमा और न्यायिक शब्दावली सुरक्षित रखी गई है। ‘देखो’ सहज है, जबकि वाक्य-विन्यास मूल की समानांतर संरचना को पर्याप्त रूप से बनाए रखता है।
