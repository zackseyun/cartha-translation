  text: הֲ/קֵ֥ץ לְ/דִבְרֵי ר֑וּחַ א֥וֹ מַה יַּ֝מְרִֽיצְ/ךָ֗ כִּ֣י תַעֲנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/003.yaml
  text: Is there no end to windy words? Or what provokes you[a], that you answer this way?
translation:
  language: hi
  text: क्या हवा-सी बातों का कोई अन्त नहीं? या तुम्हें क्या उकसाता है[a] कि तुम उत्तर देते हो?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तुम्हें क्या हिम्मत देता है कि तुम उत्तर देते हो?’
    reason: יַמְרִיצְךָ के अर्थ में ‘उकसाना’ के साथ ‘साहस/हिम्मत देना’ भी सम्भव है।
lexical_decisions:
- source_word: הֲקֵץ
  choice: क्या ... कोई अन्त नहीं?
  rationale: קֵץ का अर्थ ‘अन्त’ या ‘सीमा’ है। प्रश्नसूचक הֲ और प्रसंग में अय्यूब की झुँझलाहट को स्वाभाविक हिन्दी में नकारात्मक आलंकारिक प्रश्न से व्यक्त किया गया है।
- source_word: לְדִבְרֵי רוּחַ
  choice: हवा-सी बातों का
  rationale: शाब्दिक बिम्ब ‘हवा की बातें’ खोखले और सारहीन वचनों की ओर संकेत करता है। ‘हवा-सी बातें’ रूपक को बनाए रखते हुए आधुनिक हिन्दी में सहज है।
- source_word: אוֹ
  choice: या
  rationale: यह दूसरे आलंकारिक प्रश्न को पहले से जोड़ने वाला सरल विकल्पसूचक संयोजक है।
- source_word: מַה
  choice: क्या
  rationale: यह उत्तर देने के पीछे प्रेरित करने वाली बात या कारण के विषय में सीधा प्रश्न है।
- source_word: יַמְרִיצְךָ
  choice: तुम्हें क्या उकसाता है
  rationale: हिफ़ील क्रिया यहाँ किसी को उत्तर देने के लिए प्रेरित, उत्तेजित या आगे बढ़ाने का भाव देती है। ‘उकसाता’ विवादपूर्ण प्रसंग के अनुकूल है; ‘हिम्मत देता’ भी सम्भव है और पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: כִּי
  choice: कि
  rationale: यह उकसावे के फल या आशय को अगले उपवाक्य से जोड़ता है। हिन्दी में ‘कि’ इस सम्बन्ध को सहज रूप से व्यक्त करता है।
- source_word: תַעֲנֶה
  choice: तुम उत्तर देते हो
  rationale: ענה का सामान्य अर्थ ‘उत्तर देना’ है। मूल में ‘इस तरह’ नहीं है, इसलिए अनावश्यक विस्तार से बचते हुए सीधा अनुवाद रखा गया है।
