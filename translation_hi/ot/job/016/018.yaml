  yaml_path: translation/ot/job/016/018.yaml
  text: O earth[a], do not cover my blood[c][b], and let there be no resting place for my cry.
translation:
  language: hi
  text: हे धरती, मेरे लहू[a][c] को मत ढाँप, और मेरी पुकार[b] के लिए कोई जगह न हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मेरे बहाए गए लहू को।’ इब्रानी में शाब्दिक रूप से ‘मेरे लहू’ है, पर प्रसंग में अन्याय से बहाए गए लहू का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘मेरी दुहाई को।’ यह शब्द संकट की पुकार के साथ न्याय की अपील का भाव भी व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: c
    text: यह बिंब न्याय के लिए भूमि से पुकारते लहू की याद दिलाता है; उत्पत्ति 4:10 देखें।
    reason: cross_reference
lexical_decisions:
- source_word: אֶרֶץ
  choice: हे धरती
  rationale: स्त्रीलिंग एकवचन क्रिया से धरती को प्रत्यक्ष संबोधन स्पष्ट है। ‘धरती’ व्यापक काव्यात्मक पुकार को स्वाभाविक आधुनिक हिन्दी में व्यक्त करती है।
- source_word: אַל תְּכַסִּי
  choice: मत ढाँप
  rationale: אַל निषेधात्मक आग्रह व्यक्त करता है और כסה का ठोस अर्थ ‘ढाँपना’ है। यह अनदेखा या छिपा दिए जाने का निहित भाव बताए बिना मूल बिंब को बनाए रखता है।
- source_word: דָמִי
  choice: मेरे लहू
  rationale: शाब्दिक अर्थ ‘मेरा लहू’ है। ‘लहू’ काव्यात्मक और गरिमापूर्ण है तथा अन्याय से बहाए गए रक्त का संकेत मुख्य पाठ में स्पष्ट व्याख्या बनाए बिना सुरक्षित रखता है।
- source_word: וְאַל יְהִי
  choice: और ... न मिले
  rationale: यह दूसरी निषेधात्मक इच्छा है। हिन्दी में ‘न मिले’ इस कामनात्मक भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מָקוֹם
  choice: विश्राम की कोई जगह
  rationale: मूल शब्द का सामान्य अर्थ ‘जगह’ है, पर प्रसंग में पुकार के ठहर या शांत हो जाने की छवि है। ‘विश्राम की कोई जगह’ उस प्रसंगगत अर्थ को सहज हिन्दी में बनाए रखता है।
- source_word: לְזַעֲקָתִי
  choice: मेरी पुकार को
  rationale: זעקה संकट की पुकार है और न्याय की गुहार का भाव भी रख सकती है। ‘पुकार’ दोनों संभावनाओं को खुला रखती है।
theological_decisions:
- issue: निर्दोष लहू के न्याय के लिए पुकारने का संकेत
  choice: मुख्य पाठ में ‘मेरे लहू’ और ‘मेरी पुकार’ की ठोस काव्यात्मक भाषा बनाए रखी गई।
  alternative: ‘मेरे बहाए गए लहू’ या ‘न्याय की मेरी गुहार’ कहकर न्यायिक आशय को स्पष्ट करना।
  rationale: पद संभवतः उत्पत्ति 4:10 में भूमि से पुकारते लहू की छवि की ओर संकेत करता है, किंतु इब्रानी पाठ लहू, संकट की पुकार और न्याय की अपील के बीच काव्यात्मक तनाव को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, काव्यात्मक और गरिमापूर्ण रखी गई है। ‘हे धरती’ प्रत्यक्ष संबोधन को और ‘मत ढाँप’ मूल की ठोस छवि को सुरक्षित रखते हैं। ‘लहू’ यहाँ ‘रक्त’ की अपेक्षा कम चिकित्सकीय और ‘खून’ की अपेक्षा अधिक काव्यात्मक है।
