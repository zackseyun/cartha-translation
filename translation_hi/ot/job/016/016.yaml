  text: פָּנַ֣/י חמרמרה מִנִּי בֶ֑כִי וְ/עַ֖ל עַפְעַפַּ֣/י צַלְמָֽוֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/016.yaml
  text: My face is red from weeping[a], and on my eyelids is deep darkness.
translation:
  language: hi
  text: 'रोने से मेरा चेहरा लाल हो गया है,

    और मेरी पलकों पर घोर अंधकार[a] छाया है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मृत्यु की छाया।” इब्रानी शब्द का अर्थ मृत्यु-सदृश छाया या बहुत गहरा अंधकार—दोनों हो सकता है। यहाँ प्रसंग पलकों पर छाए घोर अंधकार की ओर अधिक संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּנַי
  choice: मेरा चेहरा
  rationale: यह बहुवचन रूप प्रथम पुरुष एकवचन प्रत्यय के साथ मुहावरे के रूप में पूरे चेहरे को दर्शाता है; आधुनिक हिन्दी में “मेरा चेहरा” स्वाभाविक है।
- source_word: חמרמרה
  choice: लाल हो गया है
  rationale: यह दुर्लभ क्रिया तीव्र भावनात्मक या शारीरिक कष्ट से चेहरे की बदली हुई दशा बताती है। रोने के संदर्भ में “लाल हो गया है” दृश्य प्रभाव को स्पष्ट रखता है, यद्यपि मूल शब्द में सूजन या तमतमाहट की छाया भी संभव है।
- source_word: מִנִּי
  choice: से
  rationale: 'यहाँ पूर्वसर्ग कारण या स्रोत बताता है: चेहरे की दशा रोने के कारण हुई है।'
- source_word: בֶכִי
  choice: रोने
  rationale: संज्ञा का अर्थ रोना या विलापपूर्वक रोना है। “रोने” से कारण-संबंध हिन्दी में सहज रूप से व्यक्त होता है।
- source_word: וְעַל
  choice: और ... पर
  rationale: संयोजक और पूर्वसर्ग दूसरी काव्य-पंक्ति को पहली से जोड़ते हुए स्थान का संबंध व्यक्त करते हैं।
- source_word: עַפְעַפַּי
  choice: मेरी पलकों
  rationale: इब्रानी शब्द विशेष रूप से पलकों को दर्शाता है, इसलिए सामान्य “आँखों” के बजाय सटीक अंग रखा गया है।
- source_word: צַלְמָוֶת
  choice: घोर अंधकार
  rationale: यह काव्यात्मक शब्द अत्यंत गहरे अंधकार या मृत्यु-सदृश छाया को व्यक्त कर सकता है। इस प्रसंग में पलकों पर छाए गहन विषाद और अंधकार की छवि के लिए “घोर अंधकार” स्वाभाविक है; पारंपरिक विकल्प पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: צַלְמָוֶת में अंधकार और मृत्यु—दोनों की संभावित प्रतिध्वनि
  choice: मुख्य पाठ में “घोर अंधकार”
  alternative: “मृत्यु की छाया”
  rationale: तत्काल प्रसंग रोने से चेहरे और पलकों की दशा का वर्णन करता है, इसलिए गहन अंधकार मुख्य अर्थ के रूप में उपयुक्त है। फिर भी शब्द की मृत्यु-संबंधी पारंपरिक और संभव प्रतिध्वनि को पादटिप्पणी में रखा गया है, ताकि मूल की अर्थगत व्यापकता न मिटे।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक शैली रखी गई है। दो समानांतर पंक्तियाँ इब्रानी कविता की संरचना को दर्शाती हैं। पादटिप्पणी-चिह्न उसी शब्द-समूह के बाद रखा गया है जिससे वह संबंधित है।
