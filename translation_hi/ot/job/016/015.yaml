  text: I have sewn sackcloth over my skin[b][a], and thrust my horn into the dust.
translation:
  language: hi
  text: मैंने अपनी त्वचा पर टाट सिल लिया है और अपना सींग[b] धूल में झुका दिया है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस इब्रानी क्रिया का ठीक अर्थ अनिश्चित है; इसका अनुवाद ‘धूल में धँसा दिया’, ‘नीचा कर दिया’ या ‘अपवित्र कर दिया’ भी किया गया है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी काव्य में ‘सींग’ सामर्थ्य, सम्मान या ऊँचे पद का प्रतीक हो सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: שַׂק
  choice: टाट
  rationale: यह शोक में पहने जाने वाले खुरदरे वस्त्र या उसकी सामग्री को दर्शाता है; ‘टाट’ आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: תָּפַרְתִּי
  choice: मैंने ... सी लिया है
  rationale: काल पूर्ण हो चुके कार्य के वर्तमान परिणाम को व्यक्त करता है; हिन्दी का पूर्ण वर्तमान यहाँ अय्यूब की मौजूदा दशा को स्वाभाविक रूप से दिखाता है।
- source_word: עֲלֵי גִלְדִּי
  choice: अपनी चमड़ी पर
  rationale: גֶּלֶד का ठोस अर्थ ‘चमड़ी’ है; ‘शरीर’ अधिक व्यापक होता और मूल शारीरिक बिंब को धुंधला कर देता।
- source_word: וְעֹלַלְתִּי
  choice: और ... गाड़ दिया है
  rationale: यह क्रिया कठिन और अर्थ की दृष्टि से अनिश्चित है। धूल के साथ ‘गाड़ दिया’ नीचे करने या धूल में दबाने का ठोस बिंब देता है, बिना इसे केवल अमूर्त ‘अपमानित किया’ बना देने के।
- source_word: בֶעָפָר
  choice: धूल में
  rationale: ב का सीधा स्थानवाचक अर्थ सुरक्षित रहता है और ‘गाड़ दिया’ के साथ लक्ष्य या परिणामी स्थिति भी स्वाभाविक रूप से व्यक्त होती है।
- source_word: קַרְנִי
  choice: अपने सींग को
  rationale: मूल इब्रानी रूपक को बनाए रखा गया है; सींग सामर्थ्य, सम्मान या ऊँचे पद का प्रतीक हो सकता है।
theological_decisions:
- issue: ‘सींग’ का रूपक
  choice: मुख्य पाठ में ‘अपने सींग’ बनाए रखना
  alternative: अपनी शक्ति / अपना सम्मान
  rationale: ठोस काव्यात्मक रूपक अय्यूब के अपमान और पतन को अधिक प्रभावी ढंग से व्यक्त करता है; किसी एक व्याख्यात्मक अर्थ को मुख्य पाठ में थोपना उचित नहीं।
- issue: וְעֹלַלְתִּי की अनिश्चित अर्थच्छाया
  choice: ठोस नीचे-दबाने वाली क्रिया के रूप में ‘गाड़ दिया है’
  alternative: गिरा दिया है / अपवित्र किया है / धूल में लोटाया है
  rationale: मूल क्रिया दुर्लभ और विवादित है। चुना हुआ अनुवाद प्रसंग के शोक और अपमान के बिंब से मेल खाता है, जबकि अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। शोक-वस्त्र के लिए ‘टाट’, शारीरिक बिंब के लिए ‘चमड़ी’, और मूल काव्यात्मक रूपक के लिए ‘सींग’ रखा गया है। पादटिप्पणी-चिह्न संबंधित कठिन पदबंध के तुरंत बाद दिए गए हैं।
