base_translation:
  language: en
  yaml_path: translation/ot/job/016/012.yaml
  text: I was at ease[a], but he shattered me; he seized me by my neck and dashed me to pieces; he set me up for himself as a target.
translation:
  language: hi
  text: मैं चैन से था, पर उसने मुझे चकनाचूर कर दिया[a]; उसने मेरी गर्दन पकड़कर मुझे टुकड़े-टुकड़े कर दिया; उसने मुझे अपने लिए निशाना बनाकर खड़ा कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘चकनाचूर कर दिया’ के लिए प्रयुक्त इब्रानी क्रिया दुर्लभ है; इसका अर्थ ‘बुरी तरह झकझोर दिया’ या ‘चीर डाला’ भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלֵו
  choice: चैन से
  rationale: यह विशेषण शांत, निश्चिंत या सुरक्षित अवस्था बताता है। ‘चैन से’ आधुनिक हिन्दी में स्वाभाविक है और आगे होनेवाली हिंसा के साथ तीखा विरोध प्रकट करता है।
- source_word: וַיְפַרְפְּרֵנִי
  choice: उसने मुझे चकनाचूर कर दिया
  rationale: यह दुर्लभ और अनिश्चित क्रिया अय्यूब की शांत अवस्था के हिंसक विनाश को व्यक्त करती है। ‘चकनाचूर कर दिया’ उसका प्रबल प्रभाव सामने लाता है; अन्य सम्भव अर्थ पादटिप्पणी में रखे गए हैं।
- source_word: וְאָחַז
  choice: उसने ... पकड़कर
  rationale: क्रिया का अर्थ दृढ़ता से पकड़ना या जकड़ना है। ‘पकड़कर’ हिन्दी में स्वाभाविक रहते हुए शत्रुतापूर्ण बल को व्यक्त करता है।
- source_word: בְּעָרְפִּי
  choice: मेरी गर्दन
  rationale: עֹרֶף गर्दन, विशेषकर गर्दन के पिछले भाग, को दर्शाता है। ‘मेरी गर्दन’ मुख्य पाठ में सहज है और पकड़ने का शारीरिक बिंब बनाए रखता है।
- source_word: וַיְפַצְפְּצֵנִי
  choice: मुझे टुकड़े-टुकड़े कर दिया
  rationale: यह प्रबल, दुर्लभ क्रिया तोड़ डालने या चूर करने की हिंसक क्रिया व्यक्त करती है। यह चयन विनाशकारी तीव्रता और पहले हिंसक क्रियापद से समानान्तरता बनाए रखता है।
- source_word: וַיְקִימֵנִי
  choice: उसने मुझे ... खड़ा कर दिया
  rationale: קום का हिफ़ील रूप यहाँ किसी को खड़ा करने या किसी स्थान पर स्थापित करने का कारणवाचक अर्थ देता है। ‘खड़ा कर दिया’ लक्ष्य के रूप में रखे जाने का दृश्य स्पष्ट करता है।
- source_word: לוֹ
  choice: अपने लिए
  rationale: सर्वनामिक रूप हमलावर के अपने प्रयोजन के लिए अय्यूब को स्थापित किए जाने का सम्बन्ध दिखाता है।
- source_word: לְמַטָּרָה
  choice: निशाना बनाकर
  rationale: संज्ञा का अर्थ आक्रमण का लक्ष्य या निशाना है। यह हिन्दी अभिव्यक्ति युद्ध-संबंधी रूपक को स्पष्ट और स्वाभाविक रूप में रखती है।
theological_decisions:
- issue: पूरे पद में तीसरे पुरुष एकवचन कर्ता का संकेत किसकी ओर है
  choice: मुख्य पाठ में केवल ‘उसने’ रखा गया है और कर्ता की पहचान स्पष्ट नहीं की गई।
  alternative: संदर्भ के आधार पर परमेश्वर को प्रत्यक्ष रूप से कर्ता कहना; अथवा किसी अनिर्दिष्ट विरोधी को समझना।
  rationale: अय्यूब के भाषण में संकेत परमेश्वर की ओर समझा जा सकता है, पर इस पद के इब्रानी पाठ में केवल तीसरे पुरुष के क्रियारूप और सर्वनाम हैं। अनुवाद मूल की धार्मिक तनावपूर्ण अस्पष्टता को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज शैली अपनाई गई है। हिंसक क्रियाओं की काव्यात्मक तीव्रता और निशाने का रूपक सुरक्षित रखा गया है; कर्ता की पहचान मूल पाठ की तरह अनकही है।
