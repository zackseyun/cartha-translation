base_translation:
  language: en
  yaml_path: translation/ot/job/016/009.yaml
  text: His anger has torn me and hated me[a]; he gnashes his teeth at me; my adversary sharpens his eyes against me.
translation:
  language: hi
  text: उसके क्रोध ने मुझे फाड़ डाला और उसने मुझसे बैर रखा; उसने मुझ पर दाँत पीसे; मेरा विरोधी मेरे विरुद्ध अपनी आँखें तेज़ करता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘अपनी आँखें तेज़ करता है’; यह शत्रुतापूर्वक पैनी दृष्टि से देखने का रूपक है।
    reason: इब्रानी के असामान्य शाब्दिक बिंब को स्पष्ट करना
lexical_decisions:
- source_word: אַפּוֹ
  choice: उसके क्रोध
  rationale: אַף का मूल अर्थ ‘नाक’ है, पर यहाँ प्रचलित भावार्थ ‘क्रोध’ है; यह आधुनिक हिन्दी में स्वाभाविक रहते हुए वैरपूर्ण भाव को सुरक्षित रखता है।
- source_word: טָרַף
  choice: फाड़ डाला
  rationale: क्रिया शिकारी पशु द्वारा शिकार को फाड़ने का सजीव बिंब देती है; ‘फाड़ डाला’ उसकी तीव्रता और परिणामी दशा व्यक्त करता है।
- source_word: וַיִּשְׂטְמֵנִי
  choice: वह मुझसे बैर रखता है
  rationale: שׂטם शत्रुता या द्वेष रखने का अर्थ देता है। ‘बैर रखता है’ हिन्दी में स्वाभाविक है और किसी अतिरिक्त शारीरिक आक्रमण को पाठ में नहीं जोड़ता।
- source_word: חָרַק עָלַי בְּשִׁנָּיו
  choice: वह मुझ पर दाँत पीसता है
  rationale: यह क्रोध और शत्रुता में दाँत पीसने का मुहावरा है; ‘मुझ पर’ עָלַי की विरोधपूर्ण दिशा को व्यक्त करता है।
- source_word: צָרִי
  choice: मेरा विरोधी
  rationale: यह शब्द शत्रुतापूर्ण विरोधी को सूचित करता है। ‘विरोधी’ किसी सैनिक, कानूनी या मानवीय पहचान को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: יִלְטוֹשׁ עֵינָיו לִי
  choice: मेरे विरुद्ध अपनी आँखें तेज़ करता है
  rationale: לָטַשׁ का शाब्दिक अर्थ धार लगाना या तेज़ करना है। असामान्य किन्तु प्रभावशाली इब्रानी रूपक को बनाए रखा गया है, और ‘मेरे विरुद्ध’ दृष्टि की शत्रुतापूर्ण दिशा दर्शाता है।
theological_decisions:
- issue: वैरपूर्ण एकवचन कर्ता और ‘विरोधी’ का संकेत किसकी ओर है
  choice: पुल्लिंग एकवचन संकेतों को बिना नाम दिए बनाए रखना
  alternative: इसे स्पष्टतः परमेश्वर, कोई मानवीय शत्रु, अथवा शत्रु के रूप में कार्य करते परमेश्वर से जोड़ना
  rationale: पद स्वयं हर खंड में कर्ता की पहचान स्पष्ट नहीं करता। अनुवाद ‘वह’ और ‘मेरा विरोधी’ रखकर अय्यूब के विलाप की वास्तविक धर्मवैचारिक अस्पष्टता और तनाव को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘फाड़ डाला’, ‘दाँत पीसता है’ और ‘आँखें तेज़ करता है’ मूल के शिकारी तथा शत्रुतापूर्ण बिंबों को बनाए रखते हैं; कर्ता की पहचान जानबूझकर अनिर्धारित है।
