  yaml_path: translation/ot/job/016/022.yaml
  text: For a few years will come[b][a], and I will go on the path from which I will not return.
translation:
  language: hi
  text: क्योंकि कुछ ही वर्ष आने को हैं[a], और मैं उस मार्ग पर जाऊँगा, जिससे मैं लौट नहीं आऊँगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘गिनती के वर्ष’; अर्थात ऐसे वर्ष जो संख्या में थोड़े या सीमित हैं।
    reason: lexical_alternative
  - marker: b
    text: या, ‘वह मार्ग जिससे मैं लौट नहीं आऊँगा।’ संदर्भ में यह मृत्यु की अपरिवर्तनीय यात्रा की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण प्रस्तुत करता है; ‘क्योंकि’ हिन्दी में इस कारण-संबंध को स्वाभाविक रूप से बनाए रखता है।
- source_word: שְׁנוֹת מִסְפָּר
  choice: गिनती के थोड़े ही वर्ष
  rationale: शाब्दिक भाव ‘गिनती के वर्ष’ है, अर्थात सीमित या थोड़े वर्ष। यह रूप मूल मुहावरे की छवि और अल्पता, दोनों को व्यक्त करता है।
- source_word: יֶאֱתָיוּ
  choice: आएँगे
  rationale: क्रिया का अर्थ ‘आना/पहुँचना’ है और इसका कर्ता ‘वर्ष’ है; भविष्यकाल मूल रूप के अनुकूल है।
- source_word: וְאֹרַח
  choice: और तब ... उस मार्ग पर
  rationale: אֹרַח का ठोस रूपक ‘मार्ग’ से सुरक्षित रहता है। ‘तब’ हिन्दी में घटनाओं का क्रम स्पष्ट करता है, जबकि ‘और’ मूल संयोजक को बनाए रखता है।
- source_word: לֹא אָשׁוּב
  choice: जहाँ से मैं लौटकर नहीं आऊँगा
  rationale: मूलतः ‘मैं नहीं लौटूँगा’; सम्बन्धवाचक रचना इसे ‘मार्ग’ से स्वाभाविक हिन्दी में जोड़ती है और अपरिवर्तनीय यात्रा का भाव बनाए रखती है।
- source_word: אֶהֱלֹךְ
  choice: मैं ... चला जाऊँगा
  rationale: הלך का अर्थ ‘जाना/चलना’ है। ‘चला जाऊँगा’ आसन्न प्रस्थान को स्वाभाविक, गरिमापूर्ण हिन्दी में व्यक्त करता है, बिना ‘अवश्य’ जैसी अतिरिक्त अनिवार्यता जोड़े।
theological_decisions:
- issue: मार्ग का आशय
  choice: मुख्य पाठ में मृत्यु को स्पष्ट रूप से न जोड़कर ‘उस मार्ग’ का रूपक रखा गया है।
  alternative: ‘मृत्यु के मार्ग पर’
  rationale: संदर्भ मृत्यु की ओर संकेत करता है, पर मूल पाठ केवल न लौटने वाले मार्ग की छवि देता है। स्पष्ट व्याख्या को पादटिप्पणी में रखना वास्तविक रूपक और उसकी गहनता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली। ‘गिनती के थोड़े ही वर्ष’ मूल मुहावरे की छवि रखते हुए उसका अर्थ खोलता है; ‘मार्ग’ मृत्यु की यात्रा के काव्यात्मक रूपक को सुरक्षित रखता है।
