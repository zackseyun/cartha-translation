  yaml_path: translation/ot/job/016/008.yaml
  text: You have shriveled me up—it has become a witness; my gauntness rises up against me and answers to my face.
translation:
  language: hi
  text: तूने मुझे सिकोड़ दिया है—यह गवाह बन गया है; मेरा दुबलापन मेरे विरुद्ध उठ खड़ा होता है और मेरे मुँह पर उत्तर देता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּקְמְטֵנִי
  choice: तूने मुझे सिकोड़ दिया है
  rationale: क्रिया קמט शरीर के सिकुड़ने या झुर्रीदार होने का बिंब देती है। यह अय्यूब की शारीरिक दशा को स्वाभाविक हिन्दी में रखते हुए मूल रूपक को बचाता है।
- source_word: לְעֵד הָיָה
  choice: यह मेरे विरुद्ध गवाह बन गया है
  rationale: शाब्दिक अर्थ ‘यह गवाह हो गया’ है। प्रसंग में उसकी सिकुड़ी हुई दशा उसके दोष का प्रत्यक्ष प्रमाण मानी जा रही है, इसलिए ‘मेरे विरुद्ध’ निहित न्यायिक दिशा स्पष्ट करता है।
- source_word: כַחֲשִׁי
  choice: मेरा दुबलापन
  rationale: כחש यहाँ क्षीणता या शरीर के दुबले पड़ जाने को सूचित करता है; ‘दुबलापन’ साधारण आधुनिक हिन्दी में दृश्य शारीरिक दशा व्यक्त करता है।
- source_word: בְּפָנַי יַעֲנֶה
  choice: मेरे मुँह पर उत्तर देता है
  rationale: ענה का मूल अर्थ ‘उत्तर देना’ रखा गया है और ‘मेरे मुँह पर’ प्रत्यक्ष आरोप या सामना करने के मानवीकरण को सुरक्षित रखता है।
theological_decisions:
- issue: अय्यूब की क्षीण देह को दोष के गवाह के रूप में चित्रित करना
  choice: देह की दशा स्वयं उसके विरुद्ध गवाह बनती और उत्तर देती है
  alternative: इसे परमेश्वर की ओर से अय्यूब के पाप की निर्णायक गवाही के रूप में स्पष्ट करना
  rationale: पद अय्यूब की शिकायत और मानवीकृत शारीरिक प्रमाण को व्यक्त करता है; यह स्वयं यह निर्णय नहीं देता कि वह वास्तव में दोषी है। इसलिए अय्यूब की अनुभूति और पुस्तक के व्यापक धार्मिक तनाव को अनिर्णीत रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर, काव्यात्मक और सहज शैली। ‘सिकोड़ दिया’, ‘गवाह’, ‘उठ खड़ा होता है’ और ‘मुँह पर उत्तर देता है’ से इब्रानी पद के शारीरिक बिंब, न्यायिक भाषा और मानवीकरण को बनाए रखा गया है।
