review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the hostile, repeated breaking imagery and the comparison to a warrior. However, “दरार पर दरार डालकर तोड़ता जाता है” makes the Hebrew noun phrase sound like a means clause and adds a progressive/completive nuance (“जाता है”) not explicit in the imperfect. Recasting it as repeated breaches made in Job more directly reflects יִפְרְצֵנִי ... פֶּרֶץ עַל־פְּנֵי פָרֶץ.
  naturalness: The proposed revision is idiomatic modern Hindi while retaining the compact poetic violence of the Hebrew. “एक के बाद एक सेंध लगाता है” naturally expresses successive breaches; “मुझ पर झपटता है” is a suitable rendering of the hostile rush.
  terminology: “सेंध” provides a concrete equivalent for פֶּרֶץ (breach) and “योद्धा” appropriately renders גִּבּוֹר in this martial context. No theological terminology is involved.
  issues:
  - severity: medium
    issue: The first clause’s syntax and aspect are imprecise.
    rationale: “दरार पर दरार डालकर तोड़ता जाता है” can imply that the subject breaks Job by means of pre-existing or separately placed cracks, while the Hebrew depicts him breaching Job repeatedly. “तोड़ता जाता है” also adds an ongoing, cumulative verbal nuance beyond the source.
  revised_text: वह मुझमें एक के बाद एक सेंध लगाता है; वह योद्धा की तरह मुझ पर झपटता है।
  revised_footnotes: []
  revision_rationale: The revision renders the repeated Hebrew breach image as successive breaches made in Job, without adding a stronger aspectual claim. It preserves the martial comparison and the immediate hostile movement of the second clause in natural, modern Hindi.
