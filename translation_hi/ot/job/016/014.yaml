  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִפְרְצֵנִי
  choice: वह मुझे ... तोड़ता जाता है
  rationale: פרץ का रूप बलपूर्वक भेदने या तोड़ने का भाव देता है। हिंदी में यह प्रयोग अय्यूब पर लगातार किए जा रहे हिंसक प्रहार को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: פֶרֶץ עַל־פְּנֵי פָרֶץ
  choice: दरार पर दरार डालकर
  rationale: दोनों बार आए פֶרֶץ की पुनरावृत्ति सुरक्षित रखी गई है। यह एक के बाद एक पड़ती दरार या टूटन का सजीव चित्र प्रस्तुत करता है।
- source_word: יָרוּץ עָלַי
  choice: मुझ पर झपटता है
  rationale: रוץ का मूल अर्थ दौड़ना है, पर शत्रुतापूर्ण आगे बढ़ने के इस प्रसंग में 'झपटता है' गति, आक्रमण और निकटता को सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: כְגִבּוֹר
  choice: योद्धा के समान
  rationale: גבור का अर्थ शक्तिशाली पुरुष, वीर या योद्धा हो सकता है। आक्रमण के प्रसंग में 'योद्धा' युद्ध-संबंधी बिंब को सबसे स्पष्ट रूप से बनाए रखता है।
