    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: पर
  rationale: यहाँ यह अव्यय अय्यूब की वर्तमान दशा की ओर एक तीखा मोड़ दिखाता है। हिंदी में ‘पर अब’ प्रसंग के विरोधात्मक बल को स्वाभाविक ढंग से व्यक्त करता है; ‘निश्चय ही’ भी संभव है।
- source_word: עַתָּה
  choice: अब
  rationale: यह अय्यूब की वर्तमान पीड़ा की तात्कालिकता बनाए रखता है।
- source_word: הֶלְאָנִי
  choice: उसने मुझे पूरी तरह थका दिया है
  rationale: לאה का अर्थ थका देना या क्लांत कर देना है। ‘पूरी तरह थका दिया’ उसके क्षीण हो जाने की तीव्रता को सहज आधुनिक हिंदी में व्यक्त करता है। कर्ता तीसरे पुरुष में और अनिर्दिष्ट रखा गया है।
- source_word: הֲשִׁמּוֹתָ
  choice: तूने ... उजाड़ दिया है
  rationale: שמם के कारक भाव का अर्थ उजाड़ या निर्जन कर देना है। ‘उजाड़ दिया’ प्रबल, स्पष्ट और स्वाभाविक हिंदी है तथा दूसरे पुरुष एकवचन को सुरक्षित रखता है।
- source_word: כָּל
  choice: पूरे
  rationale: यह आगामी समूह की समग्रता व्यक्त करता है।
- source_word: עֲדָתִי
  choice: मेरे पूरे समुदाय को
  rationale: עֵדָה सभा, मंडली या संगठित जन-समूह का बोध करा सकता है। ‘समुदाय’ औपचारिक धार्मिक अर्थ को अनावश्यक रूप से सीमित किए बिना अय्यूब से जुड़े पूरे समूह को दर्शाता है।
theological_decisions:
- issue: दोनों क्रियाओं के व्याकरणिक पुरुष में परिवर्तन
  choice: ‘उसने ...; तूने ...’ के रूप में तीसरे पुरुष से दूसरे पुरुष का बदलाव सुरक्षित रखा गया है।
  alternative: दोनों क्रियाओं को ‘तूने’ करके परमेश्वर के सीधे संबोधन के रूप में एकरूप करना।
  rationale: मसोरा-पाठ की पहली क्रिया तीसरे पुरुष पुल्लिंग एकवचन और दूसरी क्रिया दूसरे पुरुष पुल्लिंग एकवचन में है। पाठ को सरल बनाने के लिए इस तनाव को मिटाया नहीं गया; इससे यह संभावना खुली रहती है कि अय्यूब परमेश्वर के विषय में बोलते-बोलते सीधे उसे संबोधित करने लगता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और विलाप के अनुरूप प्रबल रखी गई है। ‘तू’ एकवचन इब्रानी संबोधन और बाइबलीय हिंदी की गंभीरता को बनाए रखता है। सभी पाद-टिप्पणी चिह्न मुख्य पाठ में दिए गए हैं।
