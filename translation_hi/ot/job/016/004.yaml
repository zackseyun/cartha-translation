base_translation:
  language: en
  yaml_path: translation/ot/job/016/004.yaml
  text: I too could speak like you[a], if your soul were in place of my soul[c][b]; I could heap up words against you and shake my head at you.
translation:
  language: hi
  text: मैं भी तुम्हारी तरह बोल सकता था, यदि तुम मेरी जगह होते; मैं तुम्हारे विरुद्ध शब्दों का ढेर लगा सकता था[a] और तुम्हारी ओर सिर हिला सकता था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं तुम्हारे विरुद्ध शब्दों को जोड़ या पिरो सकता था।” इब्रानी क्रिया का अर्थ शब्दों को जोड़ना, पिरोना या इकट्ठा करना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इस प्रसंग में सिर हिलाना उपहास या तिरस्कार का संकेत है।
    reason: cultural_note
lexical_decisions:
- source_word: גַּם אָנֹכִי
  choice: मैं भी
  rationale: अय्यूब के बलयुक्त आत्म-संदर्भ और मित्रों के प्रति उसके प्रत्युत्तर को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כָכֶם אֲדַבֵּרָה
  choice: तुम्हारी तरह बोल सकता था
  rationale: काल्पनिक परिस्थिति में बोलने की संभावना को व्यक्त करता है और मित्रों के बोलने के ढंग से तुलना बनाए रखता है।
- source_word: לוּ
  choice: यदि
  rationale: यह अवास्तविक अथवा काल्पनिक शर्त प्रस्तुत करता है; हिन्दी में ‘यदि’ गरिमापूर्ण और स्पष्ट है।
- source_word: יֵשׁ נַפְשְׁכֶם תַּחַת נַפְשִׁי
  choice: तुम मेरी जगह होते
  rationale: यहाँ נֶפֶשׁ व्यक्ति अथवा स्वयं को सूचित करता है। शब्दशः ‘तुम्हारा प्राण मेरे प्राण के स्थान पर’ हिन्दी में अस्वाभाविक होगा; यह रूप आशय और स्थान-विनिमय को स्पष्ट रखता है।
- source_word: אַחְבִּירָה עֲלֵיכֶם בְּמִלִּים
  choice: मैं तुम्हारे विरुद्ध शब्दों को जोड़ सकता था
  rationale: חבר के मूल भाव—जोड़ने या पिरोने—को सुरक्षित रखता है और शब्दों को उनके विरुद्ध निर्देशित किए जाने को व्यक्त करता है। मुहावरे का संभावित अर्थ पादटिप्पणी में दिया गया है।
- source_word: וְאָנִיעָה עֲלֵיכֶם בְּמוֹ רֹאשִׁי
  choice: और तुम्हें देखकर सिर हिला सकता था
  rationale: सिर हिलाने की क्रिया को स्वाभाविक हिन्दी में रखता है; प्रसंग में इसका उपहासपूर्ण सांस्कृतिक अर्थ पादटिप्पणी में स्पष्ट किया गया है।
