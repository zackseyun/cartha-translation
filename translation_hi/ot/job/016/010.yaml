- source_word: פָּעֲרוּ
  choice: अपना मुँह चौड़ा खोला है
  rationale: यह क्रिया शत्रुतापूर्वक या उपहास में मुँह पूरा खोलने का सजीव चित्र देती है; यह हिन्दी में स्वाभाविक रहते हुए मूल बिंब को बनाए रखती है।
- source_word: עָלַי
  choice: मेरे विरुद्ध
  rationale: शत्रुतापूर्ण प्रसंग में על विरोध और आक्रमण का भाव व्यक्त करता है।
- source_word: בְּפִיהֶם
  choice: अपना मुँह
  rationale: इब्रानी में बहुवचन कर्ता के साथ 'उनके मुँह से/में' का भाव है; हिन्दी में सामूहिक कर्ता के साथ 'अपना मुँह' स्वाभाविक है।
- source_word: בְּחֶרְפָּה
  choice: अपमान करते हुए
  rationale: חֶרְפָּה में निंदा, तिरस्कार और बेइज्जती का भाव है; यह पदबंध प्रहार की अपमानजनक प्रकृति स्पष्ट करता है।
- source_word: הִכּוּ
  choice: मारा है
  rationale: נכה का सामान्य अर्थ प्रहार करना है; 'मारा है' आधुनिक हिन्दी में सीधा और स्वाभाविक है।
- source_word: לְחָיָי
  choice: मेरे गाल पर
  rationale: לְחִי गाल या जबड़े को दर्शाता है; यहाँ अपमानजनक प्रहार के बिंब के लिए 'गाल' सर्वाधिक उपयुक्त है।
- source_word: יַחַד
  choice: सब मिलकर
  rationale: यह सामूहिक और एकजुट कार्रवाई को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יִתְמַלָּאוּן
  choice: इकट्ठे हो गए हैं
  rationale: मूल क्रिया का रूप शाब्दिक रूप से 'भर जाना/अपने को भर लेना' से जुड़ा है, पर यहाँ कठिन मुहावरे में विरोधियों के एक साथ जुटने का भाव संभव है; पाठ में स्वाभाविक अर्थ रखा गया और विकल्प पादटिप्पणी में दिए गए हैं।
