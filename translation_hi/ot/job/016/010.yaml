  text: They have opened their mouths wide against me[a]; with reproach they have struck my cheek; together they gather themselves against me.
translation:
  language: hi
  text: उन्होंने मेरे विरुद्ध अपने मुँह चौड़े खोले हैं; तिरस्कार के साथ उन्होंने मेरे गाल पर प्रहार किया है; वे सब मिलकर मेरे विरुद्ध जुटते हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे सब मिलकर मेरे विरुद्ध उमड़ आते हैं,” अथवा, “वे मेरे विरुद्ध भर जाते हैं।” अंतिम क्रिया मुहावरेदार और अर्थ की दृष्टि से कठिन है; इसका आशय शत्रुओं के एकजुट होकर जुटने का हो सकता है।
    reason: lexical_alternative
