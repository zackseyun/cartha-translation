lexical_decisions:
- source_word: עַל
  choice: यद्यपि
  rationale: संदर्भ में यह अय्यूब की निर्दोषता की प्रतिज्ञा को उसकी पीड़ा के बावजूद व्यक्त करने वाला रियायती संबंध सूचित करता है; फिर भी इब्रानी संबंधबोधक के अन्य अर्थ संभव हैं।
- source_word: לֹא
  choice: कोई … नहीं
  rationale: हिन्दी में संज्ञात्मक कथन का स्वाभाविक निषेध है।
- source_word: חָמָס
  choice: हिंसा
  rationale: यह शब्द हिंसा, अन्याय या गंभीर दुष्कर्म को सूचित कर सकता है; ‘हिंसा’ मूल बिंब और नैतिक भार को सीधे बनाए रखता है।
- source_word: בְּכַפָּי
  choice: मेरे हाथों में
  rationale: यह अनुवाद मूल के ठोस बिंब को बनाए रखता है और अपने कर्मों के लिए उत्तरदायित्व का भाव भी व्यक्त करता है।
- source_word: וּתְפִלָּתִי
  choice: और मेरी प्रार्थना
  rationale: תְּפִלָּה का सामान्य अर्थ ‘प्रार्थना’ है; यहाँ केवल निवेदन नहीं, परमेश्वर को संबोधित वाणी अभिप्रेत है।
- source_word: זַכָּה
  choice: शुद्ध
  rationale: विशेषण स्वच्छता या शुद्धता को सूचित करता है; ‘शुद्ध’ प्रार्थना के नैतिक भाव को स्वाभाविक रूप से व्यक्त करता है, बिना पूर्ण निष्पापता का दावा जोड़े।
theological_decisions:
- issue: अय्यूब का अपनी निर्दोषता के विषय में दावा
  choice: 'दावे को इसी प्रसंग तक सीमित रखते हुए प्रस्तुत किया गया है: उसके हाथों में हिंसा नहीं है और उसकी प्रार्थना शुद्ध है।'
  alternative: इसे पूर्ण निष्पापता का दावा मानना, या केवल अनुष्ठानिक शुद्धता तक सीमित करना।
  rationale: मूल पाठ अय्यूब के आत्मपक्ष को दृढ़ता से रखता है, पर यह पद अपने आप में पूर्ण नैतिक निष्पापता की व्यवस्थित शिक्षा नहीं देता; इसलिए पाठ का तनाव यथावत रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। ‘मेरे हाथों में’ मूल इब्रानी बिंब को बनाए रखता है, और ‘यद्यपि’ प्रसंगगत रियायती संबंध को स्पष्ट करता है।
