  yaml_path: translation/ot/job/016/006.yaml
  text: If I speak[a], my pain is not eased; and if I refrain, what goes away from me?
translation:
  language: hi
  text: यदि मैं बोलूँ, तो मेरा दर्द कम नहीं होता; और यदि मैं चुप रहूँ, तो मुझसे क्या दूर हो जाता है?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मुझे क्या छोड़ जाता है?” इब्रानी वाक्य संक्षिप्त है और इसका आशय यह भी हो सकता है, “मेरे दर्द में से क्या दूर होता है?”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם אֲדַבְּרָה
  choice: यदि मैं बोलूँ
  rationale: शर्तसूचक אִם और प्रथम पुरुष क्रिया को स्वाभाविक हिन्दी में संभावनार्थक रूप से व्यक्त किया गया है।
- source_word: לֹא יֵחָשֵׂךְ כְּאֵבִי
  choice: मेरा दर्द कम नहीं होता
  rationale: חשׂך का मूल भाव रोकना या घटाना है; दर्द के साथ हिन्दी में ‘कम नहीं होता’ अर्थ को स्पष्ट और स्वाभाविक रखता है।
- source_word: וְאַחְדְּלָה
  choice: और यदि मैं चुप रहूँ
  rationale: חדל का अर्थ रुकना या विरत होना है। पहले खंड में बोलने के समानांतर यहाँ बोलने से रुकना अभिप्रेत है; ‘चुप रहूँ’ साधारण हिन्दी में इसे संक्षेप में व्यक्त करता है।
- source_word: מַה מִנִּי יַהֲלֹךְ
  choice: तो मुझसे क्या दूर हो जाता है?
  rationale: הלך מן का अर्थ किसी से दूर जाना हो सकता है। अनिर्दिष्ट ‘क्या’ को बनाए रखकर इब्रानी की संक्षिप्तता और निहित संदर्भ—दर्द—दोनों सुरक्षित रखे गए हैं।
