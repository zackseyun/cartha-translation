    reason: lexical_alternative
lexical_decisions:
- source_word: אֲאַמִּצְכֶם
  choice: मैं...तुम्हें दृढ़ करता
  rationale: पिएल रूप का अर्थ ‘दृढ़ करना/बल देना’ है। अय्यूब उलटी परिस्थिति की कल्पना कर रहा है, इसलिए हिन्दी में अपूर्ण कृदंत ‘करता’ स्वाभाविक रूप से काल्पनिक भाव व्यक्त करता है।
- source_word: בְּמוֹ פִי
  choice: अपने मुँह से
  rationale: यह वाणी को साधन के रूप में प्रस्तुत करता है और इब्रानी के ठोस बिंब को बनाए रखता है।
- source_word: נִיד שְׂפָתַי
  choice: मेरे होंठों की सांत्वना
  rationale: नִיד गति या सहानुभूतिपूर्ण सिर/होंठ हिलाने तथा उससे व्यक्त सांत्वना का संकेत दे सकता है। प्रसंग में ‘सांत्वना’ सहज है, जबकि पादटिप्पणी मूल बिंब की सम्भावना सुरक्षित रखती है।
- source_word: יַחְשֹׂךְ
  choice: कम करती
  rationale: חשׂך का मूल भाव रोकना, बचाए रखना या घटाना है। सांत्वना के प्रसंग में ‘दुःख कम करती’ प्राकृतिक हिन्दी है; कर्म संदर्भ से स्पष्ट किया गया है।
