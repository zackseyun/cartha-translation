  text: יַסְגִּירֵ֣/נִי אֵ֭ל אֶ֣ל עֲוִ֑יל וְ/עַל יְדֵ֖י רְשָׁעִ֣ים יִרְטֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/011.yaml
  text: God hands me over to the ungodly and throws me into the hands of the wicked[a][b].
translation:
  language: hi
  text: परमेश्वर मुझे अधर्मी के हवाले कर देता है और दुष्टों के हाथों में फेंक देता है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अन्तिम इब्रानी क्रिया का अर्थ अनिश्चित है; सम्भवतः इसका अर्थ ‘मुझे फेंक देता है’ या ‘मुझे झोंक देता है’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יַסְגִּירֵנִי
  choice: मुझे ... के हवाले कर देता है
  rationale: हिफ़इल रूप यहाँ किसी व्यक्ति को दूसरे के अधिकार में सौंपने का भाव देता है; ‘के हवाले कर देता है’ आधुनिक हिन्दी में स्वाभाविक और सशक्त है।
- source_word: אֵל
  choice: परमेश्वर
  rationale: सन्दर्भ में यह सामान्य ‘बलवान’ नहीं, बल्कि अय्यूब द्वारा परमेश्वर के लिए प्रयुक्त दिव्य पद है।
- source_word: עֲוִיל
  choice: अधर्मी
  rationale: यह शब्द नैतिक और धार्मिक रूप से कुटिल व्यक्ति को सूचित करता है; ‘अधर्मी’ उसके दोनों आयामों को संक्षेप में रखता है।
- source_word: וְעַל יְדֵי רְשָׁעִים
  choice: और दुष्टों के हाथों में
  rationale: ‘हाथों’ का मुहावरा दुष्टों के वश अथवा अधिकार में पड़ने का भाव रखता है और इब्रानी समानांतरता को बनाए रखता है।
- source_word: יִרְטֵנִי
  choice: फेंक देता है
  rationale: यह दुर्लभ और कठिन क्रिया सम्भवतः बलपूर्वक फेंकने या झोंकने का अर्थ देती है; मुख्य पाठ में ‘फेंक देता है’ स्वाभाविक है, जबकि अनिश्चितता पाद-टिप्पणी में स्पष्ट की गई है।
theological_decisions:
- issue: אֵל का सन्दर्भ
  choice: अय्यूब कहता है कि परमेश्वर ही उसे अधर्मी के हवाले करता है।
  alternative: कोई ‘बलवान’ उसे हवाले करता है।
  rationale: अय्यूब की पुस्तक के सन्दर्भ में אֵל सामान्यतः परमेश्वर को सूचित करता है; इससे अय्यूब की शिकायत का तीखा धार्मिक तनाव भी सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और मौखिक रूप से सहज शैली। ‘अधर्मी’ और ‘दुष्टों’ से इब्रानी समानांतरता तथा नैतिक-धार्मिक भेद सुरक्षित है; दुर्लभ अन्तिम क्रिया की वास्तविक अनिश्चितता पाद-टिप्पणी में रखी गई है।
