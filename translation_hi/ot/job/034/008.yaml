  yaml_path: translation/ot/job/034/008.yaml
  text: and keeps company with workers of wickedness[b][a], and walks with men of evil.
translation:
  language: hi
  text: वह बुराई करनेवालों[a] की संगति करता है[b], और दुष्ट पुरुषों के साथ चलता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अनर्थ करनेवालों की।” हिब्रू शब्द का अर्थ अनर्थ, अधर्म या दुष्टता हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “उनके साथ जाता है” या “उनसे जा मिलता है।” हिब्रू क्रिया साथ चलने या किसी समूह से जा मिलने का भाव भी दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אָרַח לְ/חֶבְרָה
  choice: संगति करता है
  rationale: यह संयुक्त पद यहाँ शाब्दिक यात्रा से अधिक किसी के साथ जुड़ने या मेल-जोल रखने का भाव व्यक्त करता है; हिंदी में ‘संगति करता है’ समानांतर ‘साथ चलता है’ के साथ स्वाभाविक है।
- source_word: פֹּעֲלֵי אָוֶן
  choice: अनर्थ करनेवाले
  rationale: פֹּעֲלֵי का सक्रिय ‘करनेवाले’ भाव बना रहता है, जबकि אָוֶן में दुष्टता, अधर्म और अनर्थ की अर्थ-छायाएँ हैं; ‘अनर्थ’ इस संदर्भ में नैतिक बुराई को व्यक्त करता है।
- source_word: וְ/לָ/לֶכֶת
  choice: और ... चलता है
  rationale: הלך की चलने की छवि को बनाए रखा गया है; ज्ञान-साहित्य में यह आचरण और जीवन-संबंध का रूपक भी हो सकता है।
- source_word: אַנְשֵׁי רֶשַׁע
  choice: दुष्ट पुरुष
  rationale: रचना का स्पष्ट पुल्लिंग बहुवचन भाव सुरक्षित है और רֶשַׁע की नैतिक दुष्टता सहज आधुनिक हिंदी में व्यक्त होती है।
theological_decisions:
- issue: אַנְשֵׁי רֶשַׁע में लिंग-सूचक अभिव्यक्ति
  choice: दुष्ट पुरुषों
  alternative: दुष्ट लोगों / दुष्टों
  rationale: हिब्रू में אַנְשֵׁי स्पष्ट रूप से पुल्लिंग बहुवचन ‘पुरुष’ है; इसलिए अनावश्यक लिंग-निरपेक्षीकरण के बजाय इसे पाठ में सुरक्षित रखा गया है।
- issue: אָרַח לְחֶבְרָה का संबंधपरक या गतिशील अर्थ
  choice: संगति करता है
  alternative: साथ यात्रा करता है / जा मिलता है
  rationale: संदर्भ और समानांतर दूसरे खंड में नैतिक-सामाजिक सहभागिता प्रमुख है, फिर भी पादटिप्पणी में गतिशील अर्थ की संभावना सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिंदी। ‘संगति करता है’ सामाजिक तथा नैतिक जुड़ाव व्यक्त करता है, और ‘साथ चलता है’ मूल की काव्यात्मक समानांतरता बनाए रखता है।
