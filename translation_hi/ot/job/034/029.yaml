  text: וְ/ה֤וּא יַשְׁקִ֨ט וּ/מִ֥י יַרְשִׁ֗עַ וְ/יַסְתֵּ֣ר פָּ֭נִים וּ/מִ֣י יְשׁוּרֶ֑/נּוּ וְ/עַל גּ֖וֹי וְ/עַל אָדָ֣ם יָֽחַד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/029.yaml
  text: If he gives quietness[a], who can condemn? If he hides his face[c][b], who can behold him? This is so for a nation and for a man alike.
translation:
  language: hi
  text: 'जब वह शांति देता है, तो कौन दोषी ठहरा सकता है?[a]


    जब वह अपना मुख छिपाता है, तो कौन उसे देख सकता है?[b]


    यह बात किसी राष्ट्र और किसी मनुष्य—दोनों पर समान रूप से लागू होती है।[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘कौन उसे दोषी घोषित कर सकता है?’ इब्रानी क्रिया का न्यायिक अर्थ किसी को दुष्ट या दोषी ठहराना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘कौन उसे निहार सकता है?’ इब्रानी क्रिया का अर्थ ‘देखना’ या ‘निहारना’ है।
    reason: lexical_alternative
  - marker: c
    text: 'शाब्दिक रूप से: ‘और एक राष्ट्र पर और एक मनुष्य पर, दोनों पर।’ इसका आशय राष्ट्र और व्यक्ति, दोनों पर समान प्रयोज्यता से हो सकता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַשְׁקִט
  choice: शांति देता है
  rationale: שׁקט के हिफ़ील रूप का कारक भाव है—वह शांति या स्थिरता उत्पन्न करता है। ‘शांति देता है’ आधुनिक हिन्दी में स्वाभाविक है और इसे केवल ‘वह शांत रहता है’ नहीं बनाता।
- source_word: יַרְשִׁעַ
  choice: दोषी ठहरा सकता है
  rationale: רשע का हिफ़ील रूप न्यायिक अर्थ में किसी को दुष्ट या दोषी घोषित करने के लिए प्रयुक्त होता है। कर्म मूल पाठ में व्यक्त नहीं है, इसलिए हिन्दी में भी उसे अनकहा रखा गया है।
- source_word: יַסְתֵּר פָּנִים
  choice: अपना मुख छिपाता है
  rationale: मूल इब्रानी मुहावरे को निकटता से रखा गया है, ताकि परमेश्वर के छिपे रहने या अनुग्रह वापस लेने के बीच निहित व्यापक अर्थ को किसी एक व्याख्या तक सीमित न किया जाए।
- source_word: יְשׁוּרֶנּוּ
  choice: उसे देख सकता है
  rationale: שור का अर्थ देखना, निहारना या दृष्टि करना है; पुल्लिंग एकवचन प्रत्यय का संकेत परमेश्वर की ओर है। ‘उसे देख सकता है’ सहज और स्पष्ट हिन्दी है।
- source_word: גּוֹי
  choice: राष्ट्र
  rationale: यहाँ גוי एक सामूहिक सामाजिक-राजनीतिक इकाई है; ‘राष्ट्र’ उस अर्थ को ‘लोगों’ से अधिक स्पष्ट रूप में व्यक्त करता है।
- source_word: אָדָם
  choice: मनुष्य
  rationale: यह सामूहिक ‘राष्ट्र’ के सामने एक व्यक्तिगत मनुष्य को रखता है। ‘मनुष्य’ आधुनिक हिन्दी में स्वाभाविक है और एक व्यक्ति के प्रतिनिधिक अर्थ को बनाए रखता है।
- source_word: יָחַד
  choice: दोनों पर समान रूप से
  rationale: यहाँ יחד दोनों स्थितियों पर एक ही सिद्धान्त लागू होने का भाव देता है, न कि केवल स्थानिक रूप से साथ होने का।
- source_word: וְעַל גּוֹי וְעַל אָדָם יָחַד
  choice: यह बात किसी राष्ट्र और किसी मनुष्य—दोनों पर समान रूप से लागू होती है
  rationale: על के व्यापक संबंधसूचक भाव और יחד की समान प्रयोज्यता को स्वाभाविक हिन्दी में व्यक्त किया गया है; दंडात्मक ‘विरुद्ध’ का भाव अनावश्यक रूप से नहीं जोड़ा गया।
theological_decisions:
- issue: परमेश्वर के मुख छिपाने का मुहावरा
  choice: ‘अपना मुख छिपाता है’ को अक्षरशः बनाए रखा गया है।
  alternative: ‘अपना अनुग्रह हटा लेता है’ या ‘उनसे विमुख हो जाता है।’
  rationale: मूल अभिव्यक्ति परमेश्वर के अदृश्य या अप्राप्य होने और उसके अनुग्रह के हटने—दोनों की प्रतिध्वनि रख सकती है। व्याख्यात्मक अनुवाद उस तनाव को संकुचित कर देता।
- issue: अंतिम खंड का क्षेत्र
  choice: इसे राष्ट्र और व्यक्तिगत मनुष्य, दोनों पर समान रूप से लागू होने वाले कथन के रूप में प्रस्तुत किया गया है।
  alternative: ‘चाहे किसी राष्ट्र के विरुद्ध हो या किसी मनुष्य के विरुद्ध।’
  rationale: על अपने आप में यहाँ ‘विरुद्ध’ का दंडात्मक अर्थ अनिवार्य नहीं करता। समापन खंड का मुख्य बल सामूहिक और व्यक्तिगत, दोनों क्षेत्रों पर है।
- issue: יַרְשִׁעַ का अव्यक्त कर्म
  choice: ‘कौन दोषी ठहरा सकता है?’ में कर्म को अव्यक्त रखा गया है।
  alternative: ‘कौन उसे दोषी ठहरा सकता है?’
  rationale: संदर्भ में परमेश्वर संभावित कर्म समझा जा सकता है, पर इब्रानी क्रिया के साथ कर्मसूचक प्रत्यय नहीं है। अनुवाद मूल की संक्षिप्तता और हल्की अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘मुख छिपाना’ जैसे महत्त्वपूर्ण इब्रानी बिंब को सुरक्षित रखा गया है; अंतिम पंक्ति को हिन्दी में पूर्ण और स्वाभाविक वाक्य बनाया गया है।
