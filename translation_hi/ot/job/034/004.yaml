    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפָּט
  choice: न्याय
  rationale: यह शब्द न्याय, उचित निर्णय या सही बात का बोध करा सकता है। यहाँ चुनने और परखने के आह्वान में भाववाचक ‘न्याय’ मूल की न्यायिक और नैतिक व्यापकता को बनाए रखता है।
- source_word: נִבְחֲרָה
  choice: आओ, हम ... चुनें
  rationale: प्रथम पुरुष बहुवचन का यह रूप आग्रह या सामूहिक संकल्प व्यक्त करता है; आधुनिक हिन्दी में ‘आओ, हम ... चुनें’ उसका स्वाभाविक रूप है।
- source_word: לָּנוּ
  choice: अपने लिए
  rationale: לְ के साथ बहुवचन सर्वनाम हित अथवा संदर्भ का भाव देता है। ‘अपने लिए’ सामूहिक विचार-विमर्श में स्वयं सम्मिलित होने का अर्थ स्पष्ट करता है।
- source_word: נֵדְעָה
  choice: हम ... जान लें
  rationale: ידע का मूल अर्थ ‘जानना’ है, जबकि प्रसंग में परखकर पहचानने की छाया भी है। ‘जान लें’ मूल अर्थ के निकट रहते हुए विचार-विमर्श के परिणाम का संकेत देता है।
- source_word: בֵינֵינוּ
  choice: आपस में
  rationale: यह सामूहिक पारस्परिक विचार-विमर्श का मुहावरा है। आधुनिक हिन्दी में ‘आपस में’ सहज और सटीक है।
- source_word: מַה טּוֹב
  choice: क्या अच्छा है
  rationale: טוֹב का अर्थ अच्छा, हितकर या उचित हो सकता है। ‘क्या अच्छा है’ इसकी व्यापकता बनाए रखता है और מִשְׁפָּט के समानांतर नैतिक परख व्यक्त करता है।
