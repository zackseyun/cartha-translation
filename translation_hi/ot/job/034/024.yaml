  yaml_path: translation/ot/job/034/024.yaml
  text: He shatters the mighty without investigation[a], and sets others in their place.
translation:
  language: hi
  text: वह शक्तिशाली लोगों को बिना छानबीन किए[a] चूर कर देता है और उनकी जगह दूसरों को स्थापित कर देता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बिना खोजबीन किए।” हिब्रू में शाब्दिक रूप से “न जाँच/खोज” है। इसका आशय यह हो सकता है कि शक्तिशाली लोगों को गिराने से पहले उसे लंबी जाँच की आवश्यकता नहीं पड़ती।
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרֹעַ
  choice: चूर कर देता है
  rationale: हिफ़ील रूप यहाँ बलपूर्वक तोड़ने या नष्ट करने का भाव देता है; यह निर्णायक पतन को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: כַּבִּירִים
  choice: शक्तिशालियों
  rationale: यह प्रभावशाली या सामर्थी व्यक्तियों, संभवतः शासकों अथवा उच्च पद वालों, को सूचित करता है; पद को अनावश्यक रूप से निश्चित नहीं किया गया।
- source_word: לֹא חֵקֶר
  choice: बिना जाँच-पड़ताल के
  rationale: हिब्रू में शाब्दिक रूप से ‘नहीं जाँच/खोज’ है। हिंदी पदबंध मूल की संक्षिप्तता और इस भाव को रखता है कि उन्हें हटाने के लिए लंबी मानवीय जाँच आवश्यक नहीं है।
- source_word: וַיַּעֲמֵד
  choice: खड़ा कर देता है
  rationale: עמד के हिफ़ील का मूल भाव ‘खड़ा करना/स्थापित करना’ है; अगले पदबंध के साथ यह दूसरों को प्रतिस्थापन के रूप में स्थापित करने का अर्थ देता है।
- source_word: אֲחֵרִים
  choice: दूसरों को
  rationale: अनिश्चित बहुवचन को सरल और स्वाभाविक रूप में रखा गया है।
- source_word: תַּחְתָּם
  choice: उनकी जगह
  rationale: शाब्दिक ‘उनके नीचे’ यहाँ प्रतिस्थापन का मुहावरा है; समानांतरता में शक्तिशालियों को हटाकर अन्य लोगों को स्थापित किया जाता है।
theological_decisions:
- issue: क्रियाओं का निहित कर्ता
  choice: परमेश्वर के लिए ‘वह’
  alternative: निकटवर्ती काव्य-प्रवाह से कोई अवैयक्तिक कर्ता समझना
  rationale: एलीहू के भाषण के संदर्भ में कर्ता परमेश्वर है। हिंदी में वाक्य स्पष्ट बनाने के लिए ‘वह’ आवश्यक है, जबकि पद में ‘परमेश्वर’ नाम जोड़ना अनावश्यक विस्तार होता।
- issue: לֹא חֵקֶר का आशय
  choice: बिना जाँच-पड़ताल के
  alternative: जिनकी थाह नहीं ली जा सकती / बिना खोजे
  rationale: इस अभिव्यक्ति में व्याकरणिक संक्षिप्तता और अर्थगत तनाव है। मुख्य पाठ प्रत्यक्ष शब्दार्थ रखता है; पादटिप्पणी स्पष्ट करती है कि इसका आशय अन्यायपूर्ण ढंग से निर्णय करना नहीं, बल्कि लंबी खोज की आवश्यकता न होना भी हो सकता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण और सहज शैली। ‘शक्तिशाली’ सामाजिक-राजनीतिक सामर्थ्य को खुला रखता है; ‘चूर कर देता है’ मूल क्रिया की तीव्रता व्यक्त करता है।
