  yaml_path: translation/ot/job/034/013.yaml
  text: Who appointed the earth over him[a], and who set the whole world in place?
translation:
  language: hi
  text: 'किसने उसे पृथ्वी का प्रभारी ठहराया,[a]

    और किसने सारे जगत को उसके स्थान पर रखा?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “किसने उसे पृथ्वी की जिम्मेदारी सौंपी, और किसने उसके ऊपर सारे जगत को रखा?” इब्रानी क्रिया פקד का अर्थ नियुक्त करना, जिम्मेदारी देना, या देखरेख सौंपना हो सकता है। दूसरी पंक्ति में ‘उसके ऊपर’ प्रसंग के आधार पर जोड़ा गया वैकल्पिक अर्थ है; इब्रानी पाठ में यह स्पष्ट रूप से नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: פָקַד עָלָיו אֶרֶץ
  choice: उसे पृथ्वी पर अधिकारी ठहराया
  rationale: यहाँ פקד के साथ על किसी को किसी क्षेत्र की जिम्मेदारी या अधिकार सौंपने का भाव देता है। हिंदी में यह पदबंध उस अलंकारिक प्रश्न को स्वाभाविक रूप से व्यक्त करता है कि क्या किसी उच्चतर सत्ता ने परमेश्वर को पृथ्वी का अधिकारी बनाया।
- source_word: עָלָיו
  choice: उसे ... पर
  rationale: पुल्लिंग एकवचन प्रत्यय का संदर्भ प्रसंग में परमेश्वर है। हिंदी वाक्य-विन्यास में ‘उसे पृथ्वी पर अधिकारी’ कहना ‘उसके ऊपर पृथ्वी’ की अपेक्षा अधिक स्पष्ट और स्वाभाविक है।
- source_word: אָרְצָה
  choice: पृथ्वी
  rationale: תבל के समानांतर होने से यहाँ स्थानीय ‘देश’ नहीं, बल्कि समस्त पृथ्वी का वैश्विक अर्थ उचित है।
- source_word: שָׂם
  choice: सौंपा
  rationale: שׂים का मूल अर्थ रखना या स्थापित करना है; इस समांतर पंक्ति में ‘उसके हाथ में सौंपा’ जिम्मेदारी रखे जाने का आशय सहज हिंदी में व्यक्त करता है, यद्यपि ‘रखा’ अधिक शाब्दिक विकल्प है।
- source_word: תֵּבֵל כֻּלָּהּ
  choice: सारा जगत
  rationale: תבל व्यवस्थित अथवा बसा हुआ संसार सूचित करता है और כֻּלָּהּ उसकी संपूर्णता पर बल देता है; ‘सारा जगत’ संक्षिप्त, गरिमापूर्ण और स्वाभाविक है।
theological_decisions:
- issue: עָלָיו में सर्वनाम का संदर्भ
  choice: सर्वनाम को परमेश्वर के संदर्भ में लेकर ‘उसे’ किया गया है।
  alternative: कुछ व्याख्याएँ इसे अधिक निरपेक्ष ढंग से या पृथ्वी से संबंधित मान सकती हैं।
  rationale: अय्यूब 34:10–15 में एलीहू का तर्क है कि परमेश्वर को किसी उच्चतर अधिकारी ने पृथ्वी की जिम्मेदारी नहीं दी। पुल्लिंग एकवचन प्रत्यय भी प्रसंग में स्वाभाविक रूप से परमेश्वर की ओर संकेत करता है।
- issue: दूसरी पंक्ति में परमेश्वर पर जगत रखे जाने का भाव
  choice: ‘उसके हाथ में सौंपा’ द्वारा किसी दूसरे के परमेश्वर को दायित्व देने की अलंकारिक कल्पना रखी गई है।
  alternative: ‘सारे जगत को स्थापित किया’ पढ़ने पर परमेश्वर स्वयं जगत की स्थापना करने वाला समझा जा सकता है।
  rationale: पहली और दूसरी पंक्ति की समानांतर रचना में दोनों प्रश्न इस बात पर बल देते हैं कि किसी ने परमेश्वर को विश्व का कार्यभार नहीं दिया। फिर भी शाब्दिक क्रिया ‘रखा’ है, इसलिए विकल्प पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, स्पष्ट अलंकारिक प्रश्न। ‘अधिकारी ठहराया’ शासन-संबंधी भाव रखता है और ‘सारा जगत’ काव्यात्मक समानांतरता बनाए रखता है।
