  register: 'भाषा आधुनिक, गरिमापूर्ण और प्रत्यक्ष सम्बोधन वाली रखी गई है। दोनों समानांतर आज्ञाओं के बीच भेद सुरक्षित है: पहले सामान्य ‘सुनो’, फिर अधिक चित्रात्मक ‘कान लगाओ’।'
