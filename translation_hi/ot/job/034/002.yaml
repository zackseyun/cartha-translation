  yaml_path: translation/ot/job/034/002.yaml
  text: Hear my words[a], you wise men, and give ear to me, you who know.
translation:
  language: hi
  text: 'हे बुद्धिमानो, मेरी बातें सुनो;

    और हे ज्ञानियो, मेरी ओर कान लगाओ।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: सुनो
  rationale: बहुवचन आज्ञार्थक क्रिया का सीधा और स्वाभाविक हिन्दी रूप; यह सुनने के स्पष्ट आह्वान को बनाए रखता है।
- source_word: חֲכָמִים
  choice: हे बुद्धिमानो
  rationale: विशेषण का संज्ञा और सम्बोधन के रूप में प्रयोग हुआ है। ‘बुद्धिमानो’ आधुनिक हिन्दी में स्वाभाविक है और सम्बोधन को स्पष्ट करता है।
- source_word: מִלָּי
  choice: मेरी बातें
  rationale: अय्यूब में प्रयुक्त इस शब्द का अर्थ ‘शब्द/कथन’ है। ‘मेरी बातें’ हिन्दी में सहज है और बहुवचन को सुरक्षित रखता है।
- source_word: וְיֹדְעִים
  choice: और हे ज्ञान रखनेवालो
  rationale: मूल में कृदन्त का संज्ञावत् और सम्बोधनात्मक प्रयोग है। यह अनुवाद ‘जो जानते हैं’ के भाव को बनाए रखता है, बिना उसे ‘समझदार’ जैसे अधिक व्याख्यात्मक अर्थ में बदलने के।
- source_word: הַאֲזִינוּ
  choice: कान लगाओ
  rationale: यह बहुवचन आज्ञार्थक क्रिया कान देकर ध्यान से सुनने का भाव रखती है। ‘कान लगाओ’ पहले खंड के ‘सुनो’ के साथ समानांतरता रखते हुए मूल की कान-संबंधी छवि भी बचाता है।
- source_word: לִי
  choice: मेरी ओर
  rationale: पूर्वसर्ग और प्रथम पुरुष एकवचन प्रत्यय को ‘मेरी ओर’ के रूप में व्यक्त किया गया है, जो ‘कान लगाओ’ के साथ स्वाभाविक हिन्दी बनाता है।
