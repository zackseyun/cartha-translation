base_translation:
  language: en
  yaml_path: translation/ot/job/034/037.yaml
  text: For he adds rebellion to his sin[a]; among us he claps his hands[b], and he multiplies his words against God.
translation:
  language: hi
  text: क्योंकि वह अपने पाप में विद्रोह भी जोड़ता है; हमारे बीच वह ताली बजाता है[a] और परमेश्वर के विरुद्ध अपनी बातें बढ़ाता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी क्रिया हाथों को आपस में मारने या ताली बजाने की भाव-भंगिमा बता सकती है; यहाँ वह सम्भवतः तिरस्कार, चुनौती या उपहास प्रकट करती है।
    reason: lexical_alternative
  - marker: b
    text: या, “परमेश्वर से [कहता है]।” इब्रानी पूर्वसर्ग दिशा या संबोधन भी बता सकता है, पर इस प्रसंग में “परमेश्वर के विरुद्ध” अधिक सम्भावित है।
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले पद में कही गई बात का कारण या आधार प्रस्तुत करता है।
- source_word: יֹסִיף עַל חַטָּאתוֹ פֶשַׁע
  choice: वह अपने पाप में विद्रोह भी जोड़ता है
  rationale: יסף עם על का अर्थ किसी मौजूदा बात में कुछ और जोड़ना है; פֶשַׁע में केवल सामान्य अपराध नहीं, बल्कि विद्रोह या अवज्ञा का भाव भी है।
- source_word: בֵּינֵינוּ
  choice: हमारे बीच
  rationale: शाब्दिक अर्थ ‘हमारे मध्य’ है; आधुनिक हिन्दी में ‘हमारे बीच’ स्वाभाविक है।
- source_word: יִסְפּוֹק
  choice: हाथ पर हाथ मारता है
  rationale: क्रिया किसी हाथ की भाव-भंगिमा की ओर संकेत करती है, जो इस प्रसंग में तिरस्कार, चुनौती या उपहास व्यक्त कर सकती है। ठोस क्रिया को मुख्य पाठ में रखा गया है और उसका संभावित आशय टिप्पणी में दिया गया है।
- source_word: וְיֶרֶב אֲמָרָיו
  choice: अपनी बातें बढ़ाता जाता है
  rationale: רבה का हिफ़ील रूप बढ़ाने या बहुत करने का भाव देता है; ‘बढ़ाता जाता है’ लगातार अधिक बातें जोड़ने की तीव्रता को व्यक्त करता है।
- source_word: לָאֵל
  choice: परमेश्वर के विरुद्ध
  rationale: ל सामान्यतः दिशा या संबोधन बता सकता है, पर यहाँ विद्रोह और चुनौती के आरोप वाले संदर्भ में विरोध का अर्थ अधिक उपयुक्त है। वैकल्पिक ‘परमेश्वर से’ को टिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: क्या अय्यूब की बातें केवल परमेश्वर से कही गई हैं या परमेश्वर के विरोध में?
  choice: परमेश्वर के विरुद्ध
  alternative: परमेश्वर से
  rationale: पद की क्रमिक तीव्रता—पाप में विद्रोह जोड़ना, चुनौतीपूर्ण भाव-भंगिमा करना और बातें बढ़ाना—विरोधी अर्थ का समर्थन करती है; फिर भी इब्रानी संबंधबोधक उपसर्ग की अधिक तटस्थ दिशात्मक सम्भावना को टिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘विद्रोह’ פֶשַׁע की तीव्रता को बनाए रखता है, जबकि हाथ की भाव-भंगिमा और לָאֵל की वास्तविक अस्पष्टता टिप्पणियों में सुरक्षित है।
