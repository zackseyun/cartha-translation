id: JOB.34.10
reference: Job 34:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לָ/כֵ֤ן אַ֥נֲשֵׁ֥י לֵבָ֗ב שִׁמְע֫וּ לִ֥/י חָלִ֖לָ/ה לָ/אֵ֥ל מֵ/רֶ֗שַׁע וְ/שַׁדַּ֥י מֵ/עָֽוֶל׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/010.yaml
  text: 'Therefore[a], men of understanding, listen to me: far be it from God to do wickedness[b], and from the Almighty to do wrong.'
translation:
  language: hi
  text: 'इसलिए, समझदार पुरुषो, मेरी बात सुनो: परमेश्वर दुष्टता करे—यह असम्भव है; और सर्वशक्तिमान अन्याय करे—यह भी असम्भव है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले तर्क से निष्कर्ष की ओर ले जाने वाला संवाद-सूचक है; ‘इसलिए’ उस तार्किक सम्बन्ध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אַנֲשֵׁי לֵבָב
  choice: समझदार पुरुषो
  rationale: शाब्दिक अर्थ ‘हृदय के पुरुष’ है, पर इब्रानी में ‘हृदय’ यहाँ समझ और विवेक का बोध कराता है। ‘समझदार पुरुषो’ सम्बोधन और पुल्लिंग बहुवचन दोनों को सुरक्षित रखता है।
- source_word: שִׁמְעוּ לִי
  choice: मेरी बात सुनो
  rationale: आज्ञार्थक क्रिया और सम्बन्धसूचक अव्यय ध्यानपूर्वक वक्ता की बात सुनने का आग्रह व्यक्त करते हैं; यह आधुनिक हिन्दी में स्वाभाविक है।
- source_word: חָלִילָה
  choice: यह असम्भव है
  rationale: यह अभिव्यक्ति तीव्र निषेध और किसी विचार को अकल्पनीय ठहराती है। हिन्दी में ‘यह असम्भव है’ उसी दृढ़ अस्वीकृति को गरिमापूर्ण और स्पष्ट ढंग से व्यक्त करता है।
- source_word: לָאֵל מֵרֶשַׁע
  choice: परमेश्वर दुष्टता करे—यह असम्भव है
  rationale: पूर्वसर्गों सहित वाक्यांश दुष्टता को परमेश्वर के सम्बन्ध में पूर्णतः अस्वीकार्य बताता है। हिन्दी में निहित क्रियात्मक भाव को ‘करे’ से स्पष्ट किया गया है।
- source_word: וְשַׁדַּי
  choice: और सर्वशक्तिमान
  rationale: שַׁדַּי यहाँ ईश्वरीय उपाधि है; अर्थ संप्रेषित करने के लिए इसका अनुवाद ‘सर्वशक्तिमान’ किया गया है।
- source_word: מֵעָוֶל
  choice: अन्याय करे
  rationale: עָוֶל अन्याय, अनुचितता या अधर्म का बोध कराता है। समानान्तर वाक्य-रचना में ‘अन्याय करे’ संक्षिप्त और स्पष्ट है।
theological_decisions:
- issue: ईश्वरीय उपाधि שַׁדַּי का रूपान्तरण
  choice: सर्वशक्तिमान
  alternative: शद्दै
  rationale: यहाँ यह व्यक्तिगत नाम की अपेक्षा ईश्वरीय उपाधि के रूप में प्रयुक्त है, इसलिए अर्थपूर्ण हिन्दी उपाधि चुनी गई है।
- issue: אַנֲשֵׁי לֵבָב में लिंग और मुहावरे का निर्वाह
  choice: समझदार पुरुषो
  alternative: समझ रखने वालो
  rationale: मूल पद व्याकरणतः पुल्लिंग बहुवचन है और ‘हृदय’ का आशय समझ-विवेक है; चुना हुआ रूप दोनों बातों को बनाए रखता है।
- issue: חָלִילָה की प्रबल निषेधात्मक शक्ति
  choice: परमेश्वर दुष्टता करे—यह असम्भव है; और सर्वशक्तिमान अन्याय करे—यह भी असम्भव है
  alternative: दुष्टता परमेश्वर से और अन्याय सर्वशक्तिमान से दूर रहे
  rationale: चुना हुआ रूप ईश्वर से बुराई के पूर्ण बहिष्कार को स्पष्ट करता है, जबकि इसे केवल इच्छा या प्रार्थना के रूप में नहीं दर्शाता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट रखी गई है। मूल की समानान्तर रचना को दो संतुलित खण्डों में सुरक्षित रखा गया है।
