source:
  edition: WLC
  text: כִּֽי אָ֭מַר אִיּ֣וֹב צָדַ֑קְתִּי וְ֝/אֵ֗ל הֵסִ֥יר מִשְׁפָּטִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/005.yaml
  text: For Job has said[a], ‘I am in the right, and God has taken away my justice.’
translation:
  language: hi
  text: क्योंकि अय्यूब ने कहा है, “मैं सही हूँ, और परमेश्वर ने मेरा न्याय मुझसे छीन लिया है[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरा अधिकार” अथवा “मुझे मिलने वाला न्याय।”
    reason: מִשְׁפָּטִי के सम्भव कानूनी अर्थों को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह शब्द एलीहू के पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ तर्क के इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אָמַר
  choice: ने कहा है
  rationale: हिब्रू पूर्ण क्रिया अय्यूब के पहले कहे हुए और वर्तमान चर्चा में प्रासंगिक कथन को बताती है; ‘ने कहा है’ हिन्दी में यह संबंध बनाए रखता है।
- source_word: אִיּוֹב
  choice: अय्यूब
  rationale: यह नाम हिन्दी बाइबल-परंपरा में प्रचलित और पहचाना हुआ रूप है।
- source_word: צָדַקְתִּי
  choice: मैं सही हूँ
  rationale: यहाँ צדק न्यायिक-विवाद के संदर्भ में अपने पक्ष को सही बताने का भाव रखता है। यह अनुवाद व्यापक नैतिक निष्पापता का दावा किए बिना उस अर्थ को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְאֵל
  choice: और परमेश्वर
  rationale: וְ को उसके सामान्य संयोजक अर्थ ‘और’ में रखा गया है; אֵל के लिए सरल ‘परमेश्वर’ उपयुक्त है और किसी अतिरिक्त उपाधि को नहीं जोड़ता।
- source_word: הֵסִיר
  choice: मुझसे छीन लिया है
  rationale: סור के हिफ़ील रूप का अर्थ हटाना या दूर कर देना है। प्रसंग में ‘छीन लिया’ अय्यूब को उसके उचित न्याय से वंचित किए जाने के आरोप को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִשְׁפָּטִי
  choice: मेरा न्याय
  rationale: מִשְׁפָּט न्याय, कानूनी अधिकार या उचित निर्णय का अर्थ दे सकता है। ‘मेरा न्याय’ मूल की व्यापकता को मुख्य पाठ में बनाए रखता है, जबकि अधिक मुहावरेदार विकल्प पाद-टिप्पणी में दिए गए हैं।
theological_decisions:
- issue: अय्यूब के आत्म-दावे का न्यायिक आशय
  choice: ‘मैं सही हूँ’
  alternative: ‘मैं धर्मी हूँ’ या ‘मैं निर्दोष हूँ’
  rationale: ‘मैं सही हूँ’ अय्यूब के विवाद और उसके पक्ष के सही होने पर केंद्रित रहता है। इससे यह अनावश्यक रूप से नहीं निकलता कि वह पूर्ण नैतिक निष्पापता का दावा कर रहा है।
- issue: מִשְׁפָּטִי का अर्थ-क्षेत्र
  choice: मुख्य पाठ में ‘मेरा न्याय’
  alternative: ‘मेरा अधिकार’ या ‘मुझे मिलने वाला न्याय’
  rationale: हिब्रू पद में कानूनी और नैतिक दोनों आयाम हैं। मुख्य पाठ व्यापकता बचाता है और पाद-टिप्पणी उसके अधिक स्पष्ट सम्भव अर्थों को सामने रखती है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘मैं सही हूँ’ सामान्य पाठक के लिए सहज है और न्यायिक प्रसंग को बनाए रखता है; ‘मेरा न्याय मुझसे छीन लिया’ मूल रूपक और अर्थगत तनाव को सुरक्षित रखता है।
