source:
  edition: WLC
  text: לָ/כֵ֗ן יַ֭כִּיר מַעְבָּֽדֵי/הֶ֑ם וְ/הָ֥פַךְ לַ֝֗יְלָה וְ/יִדַּכָּֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/025.yaml
  text: Therefore he recognizes their deeds; he overturns them in the night[a], and they are crushed.
translation:
  language: hi
  text: इसलिए वह उनके कामों को जानता है; वह रात में उन्हें धराशायी कर देता है[a], और वे कुचल दिए जाते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह उन्हें रात में उलट देता है।” इब्रानी में “उलट देता है” का कर्म स्पष्ट रूप से नहीं दिया गया है, पर प्रसंग न्यायाधीन दुष्ट शासकों की ओर संकेत करता है।
    reason: क्रिया הפך के अधिक शाब्दिक विकल्प को दर्ज करना और मूल इब्रानी में कर्म की अनिर्दिष्टता स्पष्ट करना।
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले तर्क से निकलने वाले निष्कर्ष को स्वाभाविक और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: יַכִּיר
  choice: पहचानता है
  rationale: हिफ़ईल रूप यहाँ किसी के कामों को भली-भाँति पहचानने या उनका संज्ञान लेने का भाव देता है; यह अनुवाद मूल की अभिव्यक्ति के निकट रहता है।
- source_word: מַעְבָּדֵיהֶם
  choice: उनके कामों
  rationale: यह उनके किए हुए कार्यों को दर्शाता है; ‘कामों’ सामान्य आधुनिक हिन्दी में सहज है और प्रसंग में नैतिक अर्थ भी ग्रहण करता है।
- source_word: וְהָפַךְ
  choice: वह ... उन्हें उलट देता है
  rationale: הפך का मूल चित्र उलट देने का है। कर्म इब्रानी में स्पष्ट नहीं है, पर प्रसंग में न्याय के अधीन शक्तिशाली दुष्ट लोग अभिप्रेत हैं; ‘उन्हें’ इसी संदर्भ से जोड़ा गया है।
- source_word: לַיְלָה
  choice: रात में
  rationale: यह कालवाचक क्रियाविशेषण के रूप में स्वाभाविक हिन्दी है और अचानक होने वाले रात्रिकालीन न्याय का चित्र बनाए रखता है।
- source_word: וְיִדַּכָּאוּ
  choice: और वे कुचल दिए जाते हैं
  rationale: דכא का अर्थ कुचलना या तोड़ डालना है; यहाँ निष्क्रिय रूप और ईश्वरीय न्याय का कठोर परिणाम दोनों सुरक्षित रहते हैं।
theological_decisions:
- issue: न्याय के दृश्य में निहित कर्ता और कर्म
  choice: सभी क्रियाओं का कर्ता परमेश्वर है, और ‘उलट देता है’ का संदर्भगत कर्म न्यायाधीन दुष्ट शक्तिशाली लोग हैं।
  alternative: ‘रात को उलट देता है’ अथवा क्रियाओं को निर्वैयक्तिक समझना।
  rationale: अय्यूब 34:24–26 का प्रसंग परमेश्वर द्वारा शक्तिशाली लोगों के काम जानने और उनका न्याय करने की बात करता है। हिन्दी में ‘उन्हें’ जोड़ना संदर्भगत कर्म को स्पष्ट करता है, जबकि पाद-टिप्पणी मूल की अनिर्दिष्टता बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सीधी शैली। ‘पहचानता है’ और ‘उलट देता है’ मूल के चित्रात्मक शब्दों को बनाए रखते हैं; पाद-टिप्पणी वैकल्पिक मुहावरेदार अर्थ और इब्रानी की वास्तविक अस्पष्टता स्पष्ट करती है।
