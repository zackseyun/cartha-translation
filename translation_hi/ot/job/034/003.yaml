lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֹזֶן
  choice: कान
  rationale: एकवचन का प्रयोग सामान्य, नीतिवचन-सदृश सत्य के लिए हुआ है; हिन्दी में बिना अनावश्यक निर्धारक के ‘कान’ स्वाभाविक है।
- source_word: מִלִּין
  choice: बातों
  rationale: यह बोले गए शब्दों या कथनों को सूचित करता है। ‘बातों’ प्रसंग में सहज है और सुनकर कथनों को जाँचने का भाव बनाए रखता है।
- source_word: תִּבְחָן
  choice: परखता है
  rationale: בחן का अर्थ जाँचना या कसौटी पर परखना है; ‘परखता है’ स्वाद की तुलना के साथ इसके मूल्यांकनात्मक भाव को सुरक्षित रखता है।
- source_word: חֵךְ
  choice: तालू
  rationale: यह पूरे मुँह के बजाय स्वाद ग्रहण करने वाले अंग को सूचित करता है; ‘तालू’ कान के साथ शारीरिक-संवेदी समानांतरता बनाए रखता है।
- source_word: יִטְעַם
  choice: स्वाद चखता है
  rationale: टעם का सीधा अर्थ स्वाद लेना है। हिन्दी में ‘स्वाद चखता है’ इस बिंब को स्पष्ट और स्वाभाविक रखता है।
- source_word: לֶאֱכֹל
  choice: भोजन
  rationale: लामेद सहित infinitive construct यहाँ खाने योग्य वस्तु के अर्थ में संज्ञात्मक रूप से समझा जा सकता है; ‘भोजन’ संक्षिप्त और स्वाभाविक हिन्दी है, जबकि अधिक शाब्दिक संभावना पादटिप्पणी में दी गई है।
