  text: אַף אָמְנָ֗ם אֵ֥ל לֹֽא יַרְשִׁ֑יעַ וְ֝/שַׁדַּ֗י לֹֽא יְעַוֵּ֥ת מִשְׁפָּֽט־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/012.yaml
  text: Indeed[a], God does not act wickedly, and the Almighty does not pervert justice.
translation:
  language: hi
  text: निश्चय ही, परमेश्वर कोई दुष्ट काम नहीं करता[a], और सर्वशक्तिमान न्याय को विकृत नहीं करता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर अन्यायपूर्वक दोषी नहीं ठहराता” अथवा “परमेश्वर दोषी घोषित नहीं करता।” इब्रानी क्रिया कुछ प्रसंगों में न्यायिक अर्थ रख सकती है।
    reason: alternative_reading
lexical_decisions:
- source_word: אַף אָמְנָם
  choice: हाँ, निश्चय ही
  rationale: यह संयुक्त पद कथन की दृढ़ पुष्टि और बल व्यक्त करता है। ‘हाँ, निश्चय ही’ आधुनिक हिंदी में इसके स्वीकारात्मक और ज़ोरदार भाव को स्वाभाविक रूप से प्रकट करता है।
- source_word: אֵל
  choice: परमेश्वर
  rationale: यहाँ यह इस्राएल के परमेश्वर के लिए प्रयुक्त ईश्वरीय पद है। ‘परमेश्वर’ हिंदी में स्वाभाविक और गरिमापूर्ण है तथा समानांतर पद ‘सर्वशक्तिमान’ से अलग बना रहता है।
- source_word: יַרְשִׁיעַ
  choice: दुष्टता नहीं करता
  rationale: रשע के हिफ़ील रूप का अर्थ कुछ प्रसंगों में ‘दोषी ठहराना’ हो सकता है, पर यहाँ समानांतर कथन ‘न्याय को नहीं बिगाड़ता’ और व्यापक संदर्भ परमेश्वर के दुष्ट काम न करने के अर्थ का समर्थन करते हैं। न्यायिक संभावना पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: שַׁדַּי
  choice: सर्वशक्तिमान
  rationale: शद्दै के लिए यह हिंदी में प्रचलित, अर्थपूर्ण ईश्वरीय उपाधि है और लिप्यंतरण की अपेक्षा सामान्य पाठक के लिए अधिक स्पष्ट है।
- source_word: יְעַוֵּת
  choice: बिगाड़ता
  rationale: क्रिया में मोड़ने, विकृत करने या भ्रष्ट करने का भाव है। ‘न्याय को बिगाड़ना’ स्पष्ट, स्वाभाविक हिंदी में मूल का आशय व्यक्त करता है।
- source_word: מִשְׁפָּט
  choice: न्याय
  rationale: यहाँ शब्द न्यायपूर्ण निर्णय अथवा न्याय के मानक को दर्शाता है। ‘न्याय’ समानांतर कथन में सर्वाधिक स्पष्ट और सहज है।
theological_decisions:
- issue: परमेश्वर के चरित्र के संबंध में יַרְשִׁיעַ का अर्थ
  choice: परमेश्वर दुष्टता नहीं करता
  alternative: परमेश्वर अन्यायपूर्वक दोषी नहीं ठहराता; परमेश्वर दोषी घोषित नहीं करता
  rationale: पद परमेश्वर की नैतिक और न्यायिक सत्यनिष्ठा की पुष्टि करता है। हिफ़ील रूप न्यायालय-संबंधी अर्थ ले सकता है, किंतु ‘न्याय को नहीं बिगाड़ता’ के समानांतर प्रयोग और प्रसंग में परमेश्वर के आचरण की व्यापक चर्चा के कारण मुख्य पाठ में ‘दुष्टता नहीं करता’ रखा गया है; संभावित न्यायिक अर्थ पादटिप्पणी में देकर वास्तविक अर्थगत तनाव बनाए रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, सहज किंतु गरिमापूर्ण रखी गई है। ‘हाँ, निश्चय ही’ कथन का बल बनाए रखता है; ‘दुष्टता नहीं करता’ सामान्य पाठक के लिए स्पष्ट है, जबकि न्यायिक वैकल्पिक अर्थ पादटिप्पणी में संरक्षित है।
