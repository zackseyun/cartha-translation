  yaml_path: translation/ot/job/034/028.yaml
  text: so as to bring before him the cry of the poor[b][a], and he hears the cry of the afflicted.
translation:
  language: hi
  text: जिससे निर्धन[b] की पुकार उसके सामने[a] पहुँचे, और वह दीनों की पुकार सुनता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उस पर’ अथवा ‘उसके विरुद्ध’; यहाँ इब्रानी संबंधबोधक शब्द के एक से अधिक अर्थ संभव हैं।
    reason: lexical_alternative
  - marker: b
    text: ‘निर्धन … दीनों’ के स्थान पर ‘दुर्बल … पीड़ितों’ भी संभव हैं; दोनों इब्रानी शब्दों के अर्थ एक-दूसरे से मिलते हैं, पर वे पूरी तरह समान नहीं हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהָבִיא
  choice: जिससे … पहुँचे
  rationale: लְ उपसर्ग सहित हिफ़ील infinitive construct यहाँ पिछले कथन के परिणाम या प्रयोजन को व्यक्त करता है। हिंदी में ‘जिससे … पहुँचे’ इस संबंध को स्वाभाविक रूप से बनाए रखता है।
- source_word: עָלָיו
  choice: उसके सामने
  rationale: בוא के साथ עַל यहाँ पुकार के किसी के ध्यान या न्याय-सम्मुख पहुँचने का भाव दे सकता है। ‘उसके सामने’ स्वाभाविक हिंदी है, जबकि ‘उस पर’ और ‘उसके विरुद्ध’ भी व्याकरणतः संभव हैं; इसलिए विकल्प पादटिप्पणी में रखा गया है।
- source_word: צַעֲקַת
  choice: पुकार
  rationale: צְעָקָה संकट और अन्याय में उठी पुकार को दर्शाता है। ‘पुकार’ सीधा, प्रतिष्ठित और सामान्य पाठकों के लिए सहज है।
- source_word: דָּל
  choice: निर्धन
  rationale: דָּל आर्थिक अभाव के साथ दुर्बल या सामाजिक रूप से असहाय व्यक्ति को भी सूचित कर सकता है। ‘निर्धन’ प्राथमिक अर्थ को स्पष्ट रखता है।
- source_word: עֲנִיִּים
  choice: दीनों
  rationale: עָנִי गरीब, दुःखग्रस्त, दबा हुआ या पीड़ित व्यक्ति हो सकता है। ‘दीनों’ समानांतरता बनाए रखते हुए דָּל से शब्दगत भेद भी सुरक्षित रखता है।
- source_word: יִשְׁמָע
  choice: सुनता है
  rationale: काव्यात्मक प्रसंग में अपूर्ण क्रिया सामान्य या विशेषतापूर्ण वर्तमान कार्य व्यक्त कर सकती है। ‘सुनता है’ परमेश्वर की न्यायपूर्ण सजगता को स्वाभाविक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: עָלָיו के सर्वनाम का संदर्भ और יִשְׁמָע का कर्ता
  choice: पुकार परमेश्वर के सामने पहुँचती है, और वही दीनों की पुकार सुनता है।
  alternative: पुकार अत्याचारी के विरुद्ध या उस पर पहुँचती है, जबकि अंतिम क्रिया का कर्ता परमेश्वर है; अथवा अत्याचारी ही पुकार सुनता है।
  rationale: निकटवर्ती प्रसंग परमेश्वर की न्यायिक जागरूकता का वर्णन करता है, इसलिए अंतिम क्रिया का सबसे स्वाभाविक निहित कर्ता परमेश्वर है। फिर भी עָלָיו में निहित वास्तविक दिशात्मक या विरोधात्मक अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
- issue: דָּל और עֲנִיִּים के बीच अर्थ-संबंध
  choice: ‘निर्धन’ और ‘दीन’ के रूप में अलग किंतु अतिव्यापी शब्द
  alternative: ‘निर्धन’ और ‘पीड़ित’ अथवा दोनों स्थानों पर ‘गरीब’
  rationale: दोनों इब्रानी शब्द सामाजिक और आर्थिक असहायता के अर्थक्षेत्र में आते हैं, पर पूर्ण पर्याय नहीं हैं। अलग हिंदी शब्द मूल की समानांतरता और सूक्ष्म भेद दोनों रखते हैं।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली रखी गई है। ‘पुकार’ की पुनरावृत्ति मूल इब्रानी समानांतरता को सुरक्षित रखती है। वाक्य का आरंभ ‘जिससे’ से है क्योंकि यह पद पिछले कथन के परिणाम/प्रयोजन से व्याकरणिक रूप से जुड़ा है।
