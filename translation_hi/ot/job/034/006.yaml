base_translation:
  language: en
  yaml_path: translation/ot/job/034/006.yaml
  text: Should I lie concerning my right? My wound is incurable[b][a], though there is no transgression.
translation:
  language: hi
  text: क्या मैं अपने अधिकार के विषय में झूठ बोलूँ?[a] मेरा घाव असाध्य है, हालाँकि कोई अपराध नहीं है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे अधिकार के विरुद्ध मुझे झूठा समझा जाता है।” इसमें पहले उपवाक्य को अलंकारिक प्रश्न के बजाय कथन माना गया है।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक अर्थ, “मेरा तीर असाध्य है”; यहाँ “तीर” संभवतः तीर से लगे घाव या अय्यूब पर आई पीड़ा का रूपक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  choice: के विषय में
  rationale: यहाँ עַל को אֲכַזֵּב और מִשְׁפָּטִי के साथ ‘के विषय में/के बारे में’ समझने से अलंकारिक प्रश्न स्वाभाविक बनता है; विरोधसूचक ‘के विरुद्ध’ भी संभव है और पादटिप्पणी में रखा गया है।
- source_word: מִשְׁפָּטִי
  choice: अपने अधिकार
  rationale: מִשְׁפָּט कानूनी निर्णय, न्याय, मुकदमे या किसी के उचित अधिकार को सूचित कर सकता है। यहाँ ‘अपने अधिकार’ अय्यूब के न्यायोचित दावे का कानूनी भाव सहज हिन्दी में व्यक्त करता है।
- source_word: אֲכַזֵּב
  choice: क्या मैं ... झूठ बोलूँ?
  rationale: כּזב का पिएल रूप ‘झूठ बोलना’ या संदर्भानुसार ‘झूठा ठहराया जाना’ व्यक्त कर सकता है। प्रसंग में इसे अलंकारिक प्रश्न मानना सुबोध है, जबकि कथनात्मक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: אָנ֖וּשׁ
  choice: असाध्य
  rationale: यह विशेषण ऐसी दशा बताता है जिसका उपचार न हो सके या जो अत्यंत गंभीर हो। ‘असाध्य’ घाव के साथ स्वाभाविक और अर्थसटीक है।
- source_word: חִצִּי
  choice: मेरा घाव
  rationale: शाब्दिक अर्थ ‘मेरा तीर’ है, पर यहाँ तीर से पहुँचे घाव अथवा अय्यूब पर आई पीड़ा का रूपक समझना अधिक स्वाभाविक है। मूल बिंब पादटिप्पणी में दिया गया है।
- source_word: בְלִי
  choice: बिना किसी
  rationale: בְלִי अभाव को व्यक्त करता है। हिन्दी में ‘बिना किसी अपराध के’ मूल की संक्षिप्तता और पीड़ा की अनर्जितता दोनों बनाए रखता है।
- source_word: פָשַׁע
  choice: अपराध
  rationale: פֶּשַׁע नैतिक उल्लंघन, विद्रोह या दोष को दर्शाता है। ‘अपराध’ आधुनिक हिन्दी में इसका नैतिक-कानूनी भार बनाए रखता है।
theological_decisions:
- issue: एलीहू द्वारा अय्यूब के दावे को उद्धृत करने की व्याख्या
  choice: पहले उपवाक्य को अलंकारिक प्रश्न और दूसरे को निर्दोष होते हुए भी असाध्य पीड़ा की शिकायत के रूप में प्रस्तुत किया गया है।
  alternative: 'पहले उपवाक्य को कथन मानना संभव है: ‘मेरे अधिकार के विरुद्ध मुझे झूठा समझा जाता है।’ इसी प्रकार חִצִּי को शाब्दिक ‘मेरा तीर’ भी रखा जा सकता है।'
  rationale: इब्रानी वाक्य अत्यंत संक्षिप्त है और उसकी रचना एक से अधिक अर्थों की अनुमति देती है। मुख्य पाठ कानूनी दावे और विलाप दोनों को स्पष्ट रखता है, जबकि वैकल्पिक वाक्य-विन्यास और तीर का मूल बिंब पादटिप्पणियों में सुरक्षित हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘अधिकार’ कानूनी भाव को और ‘असाध्य’ पीड़ा की गंभीरता को संक्षेप में व्यक्त करता है। मुख्य पाठ में मूल की अनिश्चितता को निर्णायक ढंग से बंद नहीं किया गया; दोनों आवश्यक विकल्प पादटिप्पणियों में दिए गए हैं।
