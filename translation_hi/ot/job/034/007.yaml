  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִי גֶבֶר
  choice: कौन पुरुष
  rationale: यह पदबंध विस्मय और तुलना से भरा आलंकारिक प्रश्न आरम्भ करता है। ‘कौन पुरुष’ हिब्रू के प्रश्नवाचक और पुल्लिंग एकवचन दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כְּאִיּוֹב
  choice: अय्यूब जैसा
  rationale: उपसर्ग כְּ स्पष्ट तुलना दर्शाता है; हिन्दी में ‘अय्यूब जैसा’ सहज और सटीक है।
- source_word: יִשְׁתֶּה
  choice: पीता है
  rationale: अपूर्ण क्रिया यहाँ अय्यूब की विशेषता बताने वाले आलंकारिक प्रश्न में है; हिन्दी का सामान्य वर्तमान काल इस भाव को ठीक व्यक्त करता है।
- source_word: לַּעַג
  choice: उपहास
  rationale: यह संज्ञा हँसी उड़ाने, ठट्ठा या तिरस्कारपूर्ण उपहास का बोध कराती है। ‘उपहास’ आधुनिक, गरिमापूर्ण और प्रसंगानुकूल है।
- source_word: כַּמָּיִם
  choice: पानी की तरह
  rationale: तुलनात्मक अभिव्यक्ति को स्वाभाविक हिन्दी में रखते हुए यह किसी वस्तु को सहजता अथवा बहुतायत से पीने का सजीव रूपक सुरक्षित रखती है।
