source:
  edition: WLC
  text: כִּ֤י לֹ֣א עַל אִ֭ישׁ יָשִׂ֣ים ע֑וֹד לַ/הֲלֹ֥ךְ אֶל אֵ֝֗ל בַּ/מִּשְׁפָּֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/023.yaml
  text: For he does not set a time for a man to go before God in judgment[a].
translation:
  language: hi
  text: क्योंकि वह मनुष्य के लिए कोई और समय निर्धारित नहीं करता कि वह न्याय में परमेश्वर के सामने जाए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी वाक्य कठिन और अत्यन्त संक्षिप्त है। इसका अनुवाद यह भी हो सकता है: “क्योंकि वह किसी मनुष्य की फिर जाँच नहीं करता कि वह न्याय में परमेश्वर के सामने जाए।” सम्भवतः आशय यह है कि न्याय करने से पहले परमेश्वर को किसी अतिरिक्त सुनवाई या विलम्ब की आवश्यकता नहीं होती।'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार या स्पष्टीकरण प्रस्तुत करता है और एलीहू के तर्क का प्रवाह बनाए रखता है।
- source_word: עַל אִישׁ
  choice: मनुष्य के लिए
  rationale: שׂים के साथ עַל उस व्यक्ति को सूचित कर सकता है जिसके लिए कुछ ठहराया जाता है। यहाँ एकवचन पुल्लिंग אִישׁ को सामान्य अर्थ में ‘मनुष्य’ कहा गया है।
- source_word: יָשִׂים
  choice: निर्धारित करता
  rationale: שׂים का मूल अर्थ रखना या ठहराना है; समय के संदर्भ में ‘निर्धारित करना’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: עוֹד
  choice: कोई और समय
  rationale: עוֹד का अर्थ ‘और, आगे, फिर’ हो सकता है। वाक्य में क्रिया का कर्म व्यक्त नहीं है; न्यायिक प्रसंग के आधार पर ‘समय’ को निहित कर्म के रूप में जोड़ा गया है, जबकि ‘और’ मूल शब्द की अतिरिक्तता बनाए रखता है।
- source_word: לַהֲלֹךְ
  choice: जाए
  rationale: הלך के ‘जाना’ अर्थ को उद्देश्यसूचक हिन्दी उपवाक्य में स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: אֶל אֵל
  choice: परमेश्वर के सामने
  rationale: शाब्दिक अर्थ ‘परमेश्वर की ओर’ है, पर न्यायिक प्रसंग में ‘परमेश्वर के सामने जाना’ अदालत में उपस्थित होने का आशय स्पष्ट करता है।
- source_word: בַּמִּשְׁפָּט
  choice: न्याय के लिए
  rationale: מִשְׁפָּט यहाँ न्याय या न्यायिक कार्यवाही को दर्शाता है; ‘न्याय के लिए’ हिन्दी में संक्षिप्त और स्वाभाविक है।
theological_decisions:
- issue: עוֹד और יָשִׂים के अव्यक्त कर्म वाले कठिन, संक्षिप्त वाक्यांश की व्याख्या
  choice: परमेश्वर मनुष्य के न्याय में उपस्थित होने के लिए कोई अतिरिक्त समय निर्धारित नहीं करता।
  alternative: परमेश्वर किसी मनुष्य पर फिर ध्यान देने की आवश्यकता नहीं रखता कि वह उसे न्याय में अपने सामने लाए।
  rationale: सन्दर्भ परमेश्वर के पूर्ण और तत्काल ज्ञान पर बल देता है। मुख्य पाठ में ‘कोई और समय’ עוֹד को स्पष्ट रखता है, पर कठिन इब्रानी को पूरी तरह निश्चित अर्थ देकर उसकी वास्तविक अस्पष्टता नहीं छिपाई गई; वैकल्पिक समझ पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मनुष्य’ स्रोत के एकवचन पुल्लिंग का सामान्य मानवीय अर्थ व्यक्त करता है। मुख्य पाठ में इब्रानी की संक्षिप्तता को पठनीय बनाने के लिए निहित ‘समय’ जोड़ा गया है और वैकल्पिक व्याख्या पादटिप्पणी में सुरक्षित रखी गई है।
