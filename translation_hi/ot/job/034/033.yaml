  text: הַֽ/מֵ/עִמְּ/ךָ֬ יְשַׁלְמֶ֨/נָּה כִּֽי מָאַ֗סְתָּ כִּי אַתָּ֣ה תִבְחַ֣ר וְ/לֹא אָ֑נִי וּֽ/מַה יָדַ֥עְתָּ דַבֵּֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/033.yaml
  text: Should he repay according to your judgment because you have rejected it? For you must choose[a], and not I[b]; so declare what you know.
translation:
  language: hi
  text: क्या वह तुम्हारे विचार के अनुसार प्रतिफल दे[a], क्योंकि तुमने इसे ठुकरा दिया है[b]? क्योंकि तुम्हें ही चुनना है, मुझे नहीं; और जो तुम जानते हो, वह कहो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू आरम्भ मुहावरेदार और कठिन है; इसका अनुवाद ‘क्या वह तुम्हारे अनुसार प्रतिफल दे?’ भी हो सकता है। आशय यह है कि परमेश्वर का प्रतिफल अय्यूब की पसंद से निर्धारित नहीं होता।
    reason: lexical_alternative
  - marker: b
    text: ‘इसे’ का संकेत परमेश्वर के न्याय, उसके शासन के ढंग, या यहाँ विचाराधीन प्रतिफल की ओर हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: הֲמֵעִמְּךָ
  choice: तुम्हारी इच्छा के अनुसार
  rationale: शब्दशः संरचना ‘क्या तुम्हारी ओर से/तुम्हारे पास से’ कठिन और मुहावरेदार है। प्रसंग में प्रश्न यह है कि क्या परमेश्वर का प्रतिफल अय्यूब की इच्छा या निर्णय से निर्धारित होगा। ‘तुम्हारी इच्छा के अनुसार’ इस आशय को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְשַׁלְמֶנָּה
  choice: प्रतिफल दे
  rationale: पिएल रूप का अर्थ ‘बदला चुकाना, प्रतिफल देना’ है। ‘प्रतिफल दे’ दंड अथवा पुरस्कार—दोनों की व्यापकता बनाए रखता है; स्त्रीलिंग प्रत्यय का संदर्भ अनिश्चित होने के कारण उसे मुख्य पाठ में अलग संज्ञा से नहीं बाँधा गया।
- source_word: כִּי מָאַסְתָּ
  choice: क्योंकि तुमने इसे ठुकरा दिया है
  rationale: מָאַס का अर्थ ‘अस्वीकार करना, ठुकराना, तुच्छ जानना’ हो सकता है। यहाँ ‘ठुकरा दिया’ दृढ़ अस्वीकृति व्यक्त करता है, जबकि ‘इसे’ का संदर्भ जानबूझकर खुला रखा गया है।
- source_word: כִּי אַתָּה תִבְחַר וְלֹא אָנִי
  choice: चुनाव तुम्हें करना है, मुझे नहीं
  rationale: यह अय्यूब और एलीहू की भूमिकाओं का स्पष्ट विरोध है। हिन्दी में यह रचना आदेशात्मक/आवश्यकता का बल स्वाभाविक ढंग से व्यक्त करती है।
- source_word: וּמַה יָדַעְתָּ דַבֵּר
  choice: और जो कुछ तुम जानते हो, वह कहो
  rationale: मूल के सीधे आदेश ‘जो तुम जानते हो, बोलो’ को सहज, गरिमापूर्ण आधुनिक हिन्दी में रखा गया है।
theological_decisions:
- issue: परमेश्वर के प्रतिफल और अय्यूब की इच्छा का संबंध
  choice: प्रश्न को अलंकारिक रखते हुए ‘तुम्हारी इच्छा के अनुसार’ कहा गया
  alternative: ‘क्या वह तुम्हारी ओर से प्रतिफल दे?’
  rationale: पद का तात्पर्य यह नहीं ठहराया गया कि अय्यूब परमेश्वर का स्थान लेता है; कठिन हिब्रू मुहावरे और इस तनाव को सुरक्षित रखा गया है कि परमेश्वर का न्याय मनुष्य की पसंद से निर्धारित नहीं होता।
- issue: ‘इसे’ का संदर्भ
  choice: मुख्य पाठ में सर्वनाम रखा और पादटिप्पणी में अनिश्चितता बताई
  alternative: इसे स्पष्ट रूप से ‘परमेश्वर के न्याय’ या ‘उसके शासन’ से जोड़ना
  rationale: हिब्रू में संदर्भ स्पष्ट नहीं है; किसी एक धर्मवैचारिक अर्थ को मुख्य पाठ में थोपना उचित नहीं होगा।
translation_notes:
  register: आधुनिक मानक हिन्दी में सीधा, गरिमापूर्ण और वाद-विवाद के प्रसंग के अनुकूल संबोधन रखा गया है। ‘प्रतिफल’ न्यायिक अर्थ को बनाए रखता है, और पादटिप्पणियाँ मूल की वास्तविक अस्पष्टताओं को स्पष्ट करती हैं।
