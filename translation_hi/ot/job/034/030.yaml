  text: מִ֭/מְּלֹךְ אָדָ֥ם חָנֵ֗ף מִ/מֹּ֥קְשֵׁי עָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/030.yaml
  text: so that a godless man should not reign[a], nor be snares to the people.
translation:
  language: hi
  text: ताकि कोई भक्तिहीन मनुष्य राज न करे[a], और लोग फंदों में न फँसें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कहीं कोई भक्तिहीन मनुष्य राज न करे, कहीं लोग फंदों में न फँसें।” इब्रानी वाक्य बहुत संक्षिप्त है और ‘राज करने,’ ‘फंदों,’ तथा ‘लोगों’ के बीच संबंध को कई निकट अर्थों में समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: מִמְּלֹךְ
  choice: ताकि ... राज न करे
  rationale: מִן के साथ מלך का क्रियार्थक रूप यहाँ पिछले पद में वर्णित परमेश्वर के कार्य का प्रयोजन या परिणाम व्यक्त करता है। हिंदी में ‘ताकि ... राज न करे’ स्वाभाविक है और रोकथाम का भाव रखता है।
- source_word: אָדָם
  choice: कोई ... मनुष्य
  rationale: यहाँ אָדָם सामान्य मानवजाति नहीं, बल्कि एक व्यक्ति—विशेषतः शासन करने वाले व्यक्ति—को सूचित करता है। ‘कोई मनुष्य’ अनिश्चित एकवचन भाव स्पष्ट करता है।
- source_word: חָנֵף
  choice: भक्तिहीन
  rationale: अय्यूब और ज्ञान-साहित्य में חָנֵף प्रायः परमेश्वर के प्रति श्रद्धाहीन और नैतिक रूप से दूषित व्यक्ति को दर्शाता है; ‘भक्तिहीन’ इस धार्मिक-नैतिक अर्थ को ‘कपटी’ की अपेक्षा अधिक ठीक व्यक्त करता है।
- source_word: מִמֹּקְשֵׁי
  choice: फंदे न हों
  rationale: מוֹקֵשׁ का बहुवचन ‘फंदे’ या ‘जाल’ है। पंक्ति की संक्षिप्त वाक्य-रचना में מִן को रोकथाम के भाव में समझते हुए ‘फंदे न हों’ रखा गया है, पर संबंध की अस्पष्टता पादटिप्पणी में सुरक्षित है।
- source_word: עָם
  choice: लोगों के लिए
  rationale: עָם यहाँ शासक के अधीन समुदाय को दर्शाता है। ‘लोगों के लिए’ सार्वजनिक हानि के भाव को सहज हिंदी में व्यक्त करता है।
theological_decisions:
- issue: पद की संक्षिप्त और दीर्घवृत्तीय इब्रानी वाक्य-रचना
  choice: परमेश्वर का कार्य इस उद्देश्य/परिणाम से है कि भक्तिहीन व्यक्ति राज न करे और लोगों के लिए फंदे न हों।
  alternative: ‘कहीं भक्तिहीन मनुष्य राज न करे, कहीं लोग फंदों में न फँसें’; अथवा ‘लोगों के फंदों के कारण भक्तिहीन मनुष्य को राज करने से रोकना।’
  rationale: पिछले पद के संदर्भ में प्रयोजन/परिणाम वाला पाठ एलीहू के तर्क से सबसे सहज जुड़ता है। फिर भी इब्रानी पद अत्यंत संक्षिप्त है, इसलिए यह निश्चित नहीं किया गया कि ‘फंदे’ शासक द्वारा बिछाए गए हैं, लोगों को फँसाते हैं, या ‘लोगों के फंदे’ हैं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिंदी। ‘राज करना’ शासन के संदर्भ में सहज है; ‘भक्तिहीन’ मूल के धार्मिक और नैतिक बल को बनाए रखता है। मुख्य पाठ संक्षिप्त काव्यात्मक संरचना रखता है और पादटिप्पणी वास्तविक अस्पष्टता बताती है।
