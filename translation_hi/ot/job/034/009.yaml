base_translation:
  language: en
  yaml_path: translation/ot/job/034/009.yaml
  text: For he has said[a], ‘A man gains nothing by delighting himself with God.’
translation:
  language: hi
  text: क्योंकि उसने कहा है[a], “परमेश्वर के साथ प्रसन्न रहने से मनुष्य को कोई लाभ नहीं होता।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब परमेश्वर मनुष्य से प्रसन्न होता है, तब भी मनुष्य को कोई लाभ नहीं होता,” अथवा, “परमेश्वर की कृपा पाने से मनुष्य को कोई लाभ नहीं होता।” इब्रानी वाक्यांश संक्षिप्त है और उसके एक से अधिक अर्थ संभव हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले सन्दर्भ में एलीहू के आरोप का कारण प्रस्तुत करता है और हिन्दी में तर्क-संबंध स्वाभाविक रूप से व्यक्त करता है।
- source_word: אָמַר
  choice: उसने कहा है
  rationale: पूर्ण क्रिया अतीत में कही गई बात की वर्तमान तर्क में प्रासंगिकता दिखाती है; हिन्दी का पूर्ण वर्तमान इसे सहज रूप से व्यक्त करता है।
- source_word: לֹא יִסְכָּן
  choice: कोई लाभ नहीं होता
  rationale: क्रिया का अर्थ उपयोगी या लाभकारी होना है; यह वाक्यांश आधुनिक हिन्दी में स्वाभाविक और अर्थ की दृष्टि से निकट है।
- source_word: גָּבֶר
  choice: मनुष्य
  rationale: पुल्लिंग एकवचन यहाँ प्रतिनिधिक और सामान्य अर्थ में है; ‘मनुष्य’ गरिमापूर्ण तथा स्वाभाविक हिन्दी है।
- source_word: בִּרְצֹתוֹ
  choice: आनन्द लेने से
  rationale: רצה का यह रूप प्रसन्न होने, रुचि रखने या आनन्द लेने का भाव दे सकता है। मुख्य पाठ में मनुष्य को कर्ता मानते हुए सामान्यतः स्वीकृत अर्थ रखा गया है।
- source_word: עִם אֱלֹהִים
  choice: परमेश्वर में
  rationale: यद्यपि עִם का सामान्य अर्थ ‘के साथ’ है, इस संबंधपरक प्रयोग में ‘परमेश्वर में आनन्द लेना’ हिन्दी में अधिक स्वाभाविक है और परमेश्वर की ओर उन्मुख प्रसन्नता का भाव व्यक्त करता है।
theological_decisions:
- issue: בִּרְצֹתוֹ עִם אֱלֹהִים का कर्ता और अर्थ
  choice: 'मनुष्य को कर्ता मानना: परमेश्वर में आनन्द लेने से मनुष्य को लाभ नहीं होता'
  alternative: जब परमेश्वर मनुष्य से प्रसन्न होता है, तब भी उसे लाभ नहीं होता; अथवा परमेश्वर की कृपा पाने से मनुष्य को लाभ नहीं होता
  rationale: प्रत्यय को निकटवर्ती ‘मनुष्य’ से जोड़ना व्याकरण और एलीहू द्वारा अय्यूब के कथन के सारांश के अनुरूप है। फिर भी इब्रानी वाक्यांश संक्षिप्त और बहुअर्थी है, इसलिए अन्य संभव अर्थ पादटिप्पणी में सुरक्षित रखे गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रूप। ‘परमेश्वर में आनन्द लेना’ संबंधपरक भाव को स्वाभाविक हिन्दी में व्यक्त करता है; पाठ की वास्तविक अस्पष्टता पादटिप्पणी में संरक्षित है।
