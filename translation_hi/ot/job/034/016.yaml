translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। समानांतर आज्ञाओं में ‘सुनो’ और ‘कान लगाओ’ का भेद मूल की क्रमिक तीव्रता को व्यक्त करता है। ‘शब्दों की ध्वनि’ कुछ असामान्य होते हुए भी जानबूझकर रखा गया है, क्योंकि यही मूल अभिव्यक्ति की ठोस श्रव्य छवि को सुरक्षित रखता है।
