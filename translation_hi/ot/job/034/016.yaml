translation:
  language: hi
  text: यदि तुम्हारे पास समझ है, तो यह सुनो; मेरे शब्दों की ध्वनि को ध्यान से सुनो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे शब्दों की आवाज़ को ध्यान से सुनो।” इब्रानी में शाब्दिक रूप से, “मेरे शब्दों की ध्वनि/आवाज़ को।”
    reason: इब्रानी קוֹל के ‘ध्वनि’ और ‘आवाज़’ दोनों संभावित अर्थों को दर्शाने के लिए।
lexical_decisions:
- source_word: וְאִם
  choice: यदि
  rationale: संयोजक सहित शर्तसूचक पद यहाँ श्रोता की समझ को आधार बनाकर आग्रह प्रस्तुत करता है; आधुनिक हिन्दी में केवल ‘यदि’ स्वाभाविक और पर्याप्त है।
- source_word: בִּינָה
  choice: समझ
  rationale: यह शब्द समझ-बूझ या विवेक की क्षमता बताता है। ‘समझ’ सामान्य आधुनिक हिन्दी में सहज है और अर्थ की व्यापकता बनाए रखता है।
- source_word: שִׁמְעָה
  choice: सुनो
  rationale: שׁמע का आज्ञार्थक रूप सीधे सुनने का आदेश देता है। ‘सुनो’ इसकी संक्षिप्तता और प्रत्यक्षता बनाए रखता है।
- source_word: זֹּאת
  choice: यह
  rationale: संकेतवाचक शब्द एलीहू की कही जा रही बात की ओर संकेत करता है; कोई अतिरिक्त संज्ञा जोड़े बिना ‘यह’ मूल के निकट और स्वाभाविक है।
- source_word: הַאֲזִינָה
  choice: कान लगाओ
  rationale: यह क्रिया ध्यानपूर्वक सुनने पर बल देती है। ‘कान लगाओ’ पहले आए ‘सुनो’ से भेद बनाए रखते हुए आधुनिक हिन्दी में सचेत ध्यान का भाव व्यक्त करता है।
- source_word: לְקוֹל
  choice: की ध्वनि पर
  rationale: קוֹל का अर्थ ‘ध्वनि’ अथवा ‘आवाज़’ हो सकता है। ‘मेरे शब्दों की ध्वनि’ इब्रानी संरचना को बिना सरल करके केवल ‘मेरी बात’ बनाए सुरक्षित रखता है।
- source_word: מִלָּי
  choice: मेरे शब्दों
  rationale: बहुवचन संज्ञा बोले गए शब्दों या कथनों को दर्शाती है; ‘मेरे शब्दों’ इसका सीधा और ठोस अनुवाद है।
