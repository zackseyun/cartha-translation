  text: כִּֽי אֶל אֵ֭ל הֶ/אָמַ֥ר נָשָׂ֗אתִי לֹ֣א אֶחְבֹּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/031.yaml
  text: For has anyone said to God[a], ‘I have borne punishment; I will not offend again’?
translation:
  language: hi
  text: क्योंकि क्या किसी ने परमेश्वर से यह कहा है[a], “मैंने दंड सहा है; मैं कोई बुरा काम नहीं करूँगा”?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “मैंने सहा है; मैं भ्रष्ट आचरण नहीं करूँगा।” इब्रानी में “सहा है” का कर्म नहीं बताया गया है; इससे दंड, ताड़ना या दोष वहन करने का भाव हो सकता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले तर्क का कारण या स्पष्टीकरण प्रस्तुत करता है और संदर्भ में संयोजक बल बनाए रखता है।
- source_word: אֶל אֵל
  choice: परमेश्वर से
  rationale: אֶל के साथ אֵל का स्वाभाविक अर्थ ‘परमेश्वर से/को’ है; हिन्दी में ‘कहा’ के साथ ‘से’ सहज है।
- source_word: הֶאָמַר
  choice: क्या किसी ने ... कहा है
  rationale: रूप की दृष्टि से यह तृतीय पुरुष एकवचन पूर्ण क्रिया है, पर संदर्भ में प्रश्नवाचक और सामान्य मानवीय कर्ता का भाव है; ‘किसी ने’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: נָשָׂאתִי
  choice: मैंने दंड सह लिया है
  rationale: נשׂא का मूल अर्थ ‘उठाना/वहन करना/सहना’ है और यहाँ कर्म नहीं दिया गया। संदर्भ में दंड या ताड़ना सहना सम्भावित है; मुख्य पाठ में अर्थ स्पष्ट किया गया है और शाब्दिक अस्पष्टता पाद-टिप्पणी में सुरक्षित है।
- source_word: לֹא אֶחְבֹּל
  choice: अब मैं फिर बुरा काम नहीं करूँगा
  rationale: חבל यहाँ नैतिक अर्थ में बुरा, भ्रष्ट या हानिकारक आचरण करने को सूचित करता है। ‘बुरा काम नहीं करूँगा’ सामान्य आधुनिक हिन्दी में स्पष्ट है; ‘अब’ और ‘फिर’ पश्चात्तापजन्य प्रतिज्ञा के प्रसंगगत भाव को व्यक्त करते हैं।
theological_decisions:
- issue: נָשָׂאתִי में अनकहा कर्म
  choice: मुख्य पाठ में ‘दंड’ को प्रसंगानुसार स्पष्ट करना
  alternative: ‘मैंने सह लिया है’ या ‘मैंने उठा लिया है’
  rationale: इब्रानी में कर्म अनिर्दिष्ट है और वह दंड, ताड़ना या दोष का संकेत दे सकता है। अस्पष्टता को समाप्त मानने के बजाय पाद-टिप्पणी में खुले रूप में बताया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट शैली। अलंकारिक प्रश्न को बनाए रखा गया है और इब्रानी की वास्तविक अर्थगत अस्पष्टता पाद-टिप्पणी में दी गई है।
