base_translation:
  language: en
  yaml_path: translation/ot/job/034/014.yaml
  text: If he should set his heart on himself[a], and gather to himself his spirit and his breath,
translation:
  language: hi
  text: यदि वह अपनी ओर मन लगाए[a], और अपनी आत्मा और अपना श्वास अपने पास समेट ले,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यदि वह इस पर मन लगाए।” इब्रानी अभिव्यक्ति का अर्थ अपना ध्यान या उद्देश्य किसी ओर लगाना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יָשִׂים
  choice: यदि वह ... लगाए
  rationale: אִם के साथ यָשִׂים एक काल्पनिक शर्त प्रस्तुत करता है; हिंदी में ‘यदि ... लगाए’ स्वाभाविक रूप से इस संभाव्यता को बनाए रखता है।
- source_word: אֵלָיו לִבּוֹ
  choice: अपना मन अपने ही ऊपर लगाए
  rationale: शाब्दिक चित्र ‘अपना हृदय ... लगाए’ है, पर आधुनिक हिंदी में ध्यान या अभिप्राय के अर्थ में ‘मन लगाना’ अधिक स्वाभाविक है। ‘अपने ही ऊपर’ संभावित आत्मनिर्देशित अर्थ को व्यक्त करता है, जबकि पादटिप्पणी दूसरी सम्भावना सुरक्षित रखती है।
- source_word: רוּחוֹ
  choice: अपनी आत्मा
  rationale: רוּחַ यहाँ נְשָׁמָה के साथ जीवन देने वाले तत्त्व को सूचित करता है। ‘आत्मा’ दोनों इब्रानी शब्दों का भेद बनाए रखती है, यद्यपि इसका अर्थ यहाँ जीवन-शक्ति भी हो सकता है।
- source_word: וְנִשְׁמָתוֹ
  choice: और अपना श्वास
  rationale: נְשָׁמָה सामान्यतः श्वास या जीवन-श्वास को दर्शाता है। ‘श्वास’ रוּחַ से इसका शब्दगत भेद सुरक्षित रखता है।
- source_word: אֵלָיו יֶאֱסֹף
  choice: अपने पास समेट ले
  rationale: אָסַף का मूल चित्र इकट्ठा करने या समेटने का है। ‘अपने पास समेट ले’ परमेश्वर द्वारा जीवन-तत्त्व वापस लेने के संदर्भगत संकेत को व्यक्त करते हुए उस चित्र को बनाए रखता है।
theological_decisions:
- issue: तीसरे पुरुष के सर्वनामों का संदर्भ
  choice: सभी एकवचन पुल्लिंग सर्वनाम परमेश्वर के लिए समझे गए हैं।
  alternative: पहले אֵלָיו को आत्मनिर्देशित न मानकर ‘इस पर’ या ‘उस ओर’ समझा जा सकता है।
  rationale: एलीहू के तर्क और अगले पद के अनुसार कर्ता परमेश्वर है, जो आत्मा और श्वास अपने पास समेट सकता है। फिर भी पहले אֵלָיו का सटीक संबंध अस्पष्ट है, इसलिए वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण, सहज रूप अपनाया गया है। ‘मन लगाना’ हिंदी मुहावरे के अनुसार है; ‘आत्मा’ और ‘श्वास’ से मूल के समानांतर किन्तु भिन्न शब्द सुरक्षित रहते हैं।
