lexical_decisions:
- source_word: תַּחַת
  choice: ठहराकर
  rationale: यहाँ कठिन पूर्वसर्ग को उनकी उस हैसियत के अर्थ में समझा गया है जिसमें उन्हें दंड दिया जाता है; कारणसूचक अर्थ पादटिप्पणी में रखा गया है।
- source_word: רְשָׁעִים
  choice: दुष्ट
  rationale: बहुवचन विशेषण यहाँ संज्ञा के समान प्रयुक्त है; हिंदी में ‘दुष्ट’ स्वाभाविक रूप से ऐसे लोगों की नैतिक स्थिति बताता है।
- source_word: סְפָקָם
  choice: वह उन्हें ... मारता है
  rationale: क्रिया का मूल अर्थ प्रहार करना या मारना है; ‘मार गिराता है’ कहने से ऐसा परिणाम जुड़ जाता जो रूप में स्पष्ट नहीं है।
- source_word: בִּמְקוֹם רֹאִים
  choice: सबके सामने
  rationale: शाब्दिक रूप से देखने वालों के स्थान में; यह मुहावरेदार हिंदी सार्वजनिक रूप से दिखाई देने वाले दंड का भाव व्यक्त करती है।
theological_decisions:
- issue: תַּחַת רְשָׁעִים का संबंध
  choice: उन्हें दुष्ट ठहराकर
  alternative: उनकी दुष्टता के कारण
  rationale: मुख्य पाठ न्यायिक हैसियत का संभावित अर्थ देता है, जबकि कठिन वाक्यांश का कारणसूचक अर्थ भी वास्तविक संभावना है और पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिंदी। ‘सबके सामने’ सार्वजनिक दृश्यता को स्वाभाविक ढंग से व्यक्त करता है; ‘ठहराकर’ न्यायिक अर्थ को स्पष्ट करता है, पर वैकल्पिक कारणसूचक अर्थ पादटिप्पणी में संरक्षित है।
