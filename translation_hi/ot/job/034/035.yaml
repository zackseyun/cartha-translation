  yaml_path: translation/ot/job/034/035.yaml
  text: Job speaks without knowledge[a], and his words are without understanding.
translation:
  language: hi
  text: 'अय्यूब बिना ज्ञान के बोलता है,

    और उसकी बातों में समझ नहीं है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְדַעַת
  choice: बिना ज्ञान के
  rationale: בְ के साथ अमूर्त संज्ञा דַּעַת यहाँ बोलने के ढंग को व्यक्त करती है। ‘बिना ज्ञान के’ स्वाभाविक हिन्दी है और ज्ञान के अभाव का भाव बनाए रखती है।
- source_word: יְדַבֵּר
  choice: बोलता है
  rationale: यह अपूर्ण क्रिया यहाँ एलीहू के मूल्यांकन में सामान्य वर्तमान का भाव देती है; इसलिए ‘बोलता है’ उपयुक्त है।
- source_word: דְבָרָיו
  choice: उसकी बातें
  rationale: דְבָרִים का अर्थ यहाँ अय्यूब के कथन या बातें हैं। ‘उसकी बातें’ आधुनिक हिन्दी में सीधा और स्वाभाविक है।
- source_word: בְהַשְׂכֵּיל
  choice: समझ नहीं है
  rationale: שׂכל समझ-बूझ या सूझ के साथ बोलने का भाव रखता है। ‘उसकी बातों में समझ नहीं है’ हिब्रू समानांतरता को सहज हिन्दी में व्यक्त करता है।
- source_word: לֹא
  choice: बिना / नहीं
  rationale: दोनों खंडों में לֹא अभाव को नकारता है। हिन्दी में पहले खंड में ‘बिना’ और दूसरे में ‘नहीं है’ अर्थ को स्वाभाविक ढंग से व्यक्त करते हैं।
