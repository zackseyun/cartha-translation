  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। पद की काव्यात्मक समानांतरता को दो पंक्तियों में बनाए रखा गया है; किसी विशिष्ट सांप्रदायिक व्याख्या को नहीं जोड़ा गया।
