  text: Men of understanding will say to me[a], and a wise man who hears me,
translation:
  language: hi
  text: समझदार लोग मुझसे कहेंगे, और बुद्धिमान व्यक्ति जो मेरी सुनता है,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַנְשֵׁי לֵבָב
  choice: समझ-बूझ रखनेवाले
  rationale: शाब्दिक अर्थ ‘हृदय के लोग’ है; इब्रानी में ‘हृदय’ विचार और विवेक की भीतरी क्षमता का द्योतक है। यह चयन उस मुहावरे का स्वाभाविक आधुनिक हिन्दी अर्थ देता है।
- source_word: יֹאמְרוּ לִי
  choice: मुझसे कहेंगे
  rationale: यिक़्तोल रूप यहाँ भावी या अपेक्षित कथन का भाव दे सकता है; ‘कहेंगे’ प्रसंगानुकूल है और לִי को ‘मुझसे’ के रूप में व्यक्त करता है।
- source_word: וְגֶבֶר חָכָם
  choice: और वह बुद्धिमान व्यक्ति भी
  rationale: גֶבֶר यहाँ समानांतरता में सामान्यतः ‘व्यक्ति/मनुष्य’ है और חָכָם ‘बुद्धिमान’। हिन्दी में ‘भी’ दोनों समानांतर कर्ताओं को स्वाभाविक ढंग से जोड़ता है, बिना अर्थगत विरोध बनाए।
- source_word: שֹׁמֵעַ לִי
  choice: जो मेरी बात सुनता है
  rationale: कृदंत बुद्धिमान व्यक्ति का गुण बताता है। हिन्दी में ‘मेरी बात सुनता है’ केवल ध्वनि सुनने की अपेक्षा प्रसंगगत आशय को अधिक स्वाभाविक रूप से व्यक्त करता है।
