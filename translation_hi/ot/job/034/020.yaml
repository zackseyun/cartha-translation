  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: רֶ֤גַע יָמֻתוּ֮ וַ/חֲצ֪וֹת לָ֥יְלָה יְגֹעֲשׁ֣וּ עָ֣ם וְ/יַעֲבֹ֑רוּ וְ/יָסִ֥ירוּ אַ֝בִּ֗יר לֹ֣א בְ/יָֽד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/020.yaml
  text: In a moment they die; at midnight a people are shaken[a], and they pass away; the mighty are removed, not by hand.
translation:
  language: hi
  text: 'वे पल भर में मर जाते हैं;

    आधी रात को एक जनसमुदाय काँप उठता है और मिट जाता है;

    बलवान को हाथ से नहीं हटाया जाता।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “हाथ से नहीं”; सम्भवतः इसका अर्थ है कि उसे किसी मनुष्य के हस्तक्षेप के बिना हटाया जाता है।
    reason: मूल इब्रानी मुहावरे को मुख्य पाठ में बनाए रखते हुए उसके सम्भावित अभिकरण-संबंधी अर्थ को बताने के लिए।
lexical_decisions:
- source_word: רֶגַע
  choice: पल भर में
  rationale: यह संज्ञा अत्यल्प समय को व्यक्त करती है। ‘पल भर में’ हिन्दी का स्वाभाविक मुहावरा है और अचानक होने की धारणा को अनावश्यक रूप से नहीं बढ़ाता।
- source_word: יָמֻתוּ
  choice: वे मर जाते हैं
  rationale: מות का सीधा और सामान्य अर्थ ‘मरना’ है; यहाँ अचानक आने वाली मृत्यु पर बल है।
- source_word: וַחֲצוֹת לָיְלָה
  choice: आधी रात को
  rationale: शाब्दिक रूप से ‘रात के आधे में’; आधुनिक हिन्दी में ‘आधी रात को’ इसका स्वाभाविक समय-सूचक रूप है।
- source_word: יְגֹעֲשׁוּ
  choice: काँप उठता है
  rationale: געשׁ हिलने, काँपने या उथल-पुथल में पड़ने का भाव देता है। ‘काँप उठता है’ अचानक झकझोरे जाने के भाव को संक्षेप में रखता है।
- source_word: עָם
  choice: एक जनसमुदाय
  rationale: एकवचन सामूहिक संज्ञा को ‘एक जनसमुदाय’ से रखा गया है; इससे केवल अलग-अलग व्यक्तियों के बजाय सामूहिक इकाई का भाव बना रहता है।
- source_word: וְיַעֲבֹרוּ
  choice: और मिट जाता है
  rationale: עבר का मूल अर्थ ‘गुज़र जाना’ है; मृत्यु और हटाए जाने के इस संदर्भ में ‘मिट जाता है’ जनसमुदाय के समाप्त हो जाने को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְיָסִירוּ
  choice: हटा दिया जाता है
  rationale: סור के हिफ़ील रूप का अर्थ ‘हटाना’ है। इब्रानी में कर्ता अनिर्दिष्ट है; हिन्दी का कर्मवाच्य उसी अनिर्दिष्ट अभिकरण को बनाए रखता है।
- source_word: אַבִּיר
  choice: बलवान
  rationale: यहाँ संज्ञा के रूप में प्रयुक्त शब्द किसी शक्तिशाली व्यक्ति को दर्शाता है। ‘बलवान’ एकवचन और काव्यात्मक संक्षिप्तता दोनों को बनाए रखता है।
- source_word: לֹא בְיָד
  choice: बिना किसी मनुष्य के हाथ लगाए
  rationale: शाब्दिक मुहावरा ‘हाथ के द्वारा नहीं’ है। हिन्दी में यह रूप स्पष्ट करता है कि हटाया जाना मानवीय साधन या हस्तक्षेप से नहीं होता, जबकि पादटिप्पणी मूल शब्दावली बताती है।
theological_decisions:
- issue: ‘हाथ के द्वारा नहीं’ में निहित अभिकरण
  choice: मुख्य पाठ में मानवीय हस्तक्षेप के बिना हटाए जाने का भाव रखा गया है, पर परमेश्वर को व्याकरणिक कर्ता के रूप में स्पष्टतः नहीं जोड़ा गया।
  alternative: ‘परमेश्वर उसे हटा देता है’ या अधिक शाब्दिक ‘हाथ के द्वारा नहीं’
  rationale: संदर्भ परमेश्वर की सार्वभौमिक सामर्थ्य की ओर संकेत करता है, लेकिन इब्रानी वाक्य कर्ता का नाम नहीं लेता। इसलिए दिव्य अभिकरण को सिद्ध कथन बनाकर जोड़ने के बजाय मूल की निहितार्थपूर्ण अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। तीन समानांतर पंक्तियाँ मूल पद की गति और अचानक मृत्यु, सामूहिक उथल-पुथल तथा बलवान के हटाए जाने की क्रमिकता को उभारती हैं।
