  text: אֲשֶׁ֣ר עַל כֵּ֭ן סָ֣רוּ מֵֽ/אַחֲרָ֑י/ו וְ/כָל דְּ֝רָכָ֗י/ו לֹ֣א הִשְׂכִּֽילוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/027.yaml
  text: because they turned aside from following him[b][a], and they did not understand any of his ways.
translation:
  language: hi
  text: क्योंकि वे उसके पीछे चलने से हट गए[a], और उन्होंने उसके किसी भी मार्ग पर ध्यान नहीं दिया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “उसके पीछे से”; यह इब्रानी मुहावरा किसी के पीछे चलने या उसका अनुसरण करने के लिए है।
    reason: lexical_alternative
  - marker: b
    text: या, “उन्होंने उसके किसी भी मार्ग को नहीं समझा”; अथवा, “उन्होंने उसके सब मार्गों पर विचार नहीं किया।”
    reason: alternative_reading
lexical_decisions:
- source_word: אֲשֶׁר עַל כֵּן
  choice: क्योंकि
  rationale: यह पदबंध यहाँ पिछले कथन का कारण बताता है; आधुनिक हिन्दी में ‘क्योंकि’ उसके कारणात्मक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: סָרוּ
  choice: हट गए
  rationale: सूर क्रिया मुड़ने, हटने या दूर जाने का भाव रखती है; ‘पीछे चलने से हट गए’ नैतिक और संबंधपरक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מֵאַחֲרָיו
  choice: उसके पीछे चलने से
  rationale: शाब्दिक रूप से ‘उसके पीछे से’ है, पर यह किसी का अनुसरण करने के अर्थ में प्रयुक्त इब्रानी मुहावरा है।
- source_word: וְכָל דְּרָכָיו
  choice: उसके किसी भी मार्ग पर
  rationale: मूल में ‘उसके सब मार्ग’ है, पर निषेध के साथ हिन्दी में ‘किसी भी मार्ग पर ... नहीं’ अधिक स्वाभाविक है। ‘मार्ग’ यहाँ आचरण और कार्य-रीति दोनों का संकेत रखता है।
- source_word: לֹא הִשְׂכִּילוּ
  choice: ध्यान नहीं दिया
  rationale: हिफ़ील रूप समझने, विचार करने या विवेकपूर्वक ध्यान देने का अर्थ दे सकता है। प्रसंग में ‘ध्यान नहीं दिया’ केवल बौद्धिक असमर्थता के बजाय उनके मार्गों पर विचार न करने का भाव रखता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ‘उसके पीछे’ और ‘उसके मार्ग’ में एकवचन पुल्लिंग प्रत्ययों का संदर्भ
  choice: सर्वनामों को ‘उसके’ के रूप में रखा गया; प्रसंग में संकेत परमेश्वर की ओर है
  alternative: निकटवर्ती संदर्भ में कोई सांसारिक शासक या न्यायी
  rationale: एलीहू के व्यापक भाषण में देखने, न्याय करने और मनुष्यों को फल देने वाला परमेश्वर है। फिर भी मूल पाठ केवल सर्वनाम देता है, इसलिए नाम जोड़कर संभावित तनाव को समाप्त नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और मौखिक पठन के अनुकूल है। सर्वनाम को स्पष्ट करने के लिए ‘परमेश्वर’ नहीं जोड़ा गया, और שׂכל की अर्थ-व्याप्ति को पादटिप्पणी में सुरक्षित रखा गया।
