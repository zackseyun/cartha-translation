  text: क्या किसी राजा से, “निकम्मे!” और कुलीनों से, “दुष्टो!” कहना उचित है?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַאֲמֹר
  choice: क्या ... यह कहना उचित है
  rationale: प्रश्नवाचक הַ के साथ क्रियारूप को यहाँ अलंकारिक प्रश्न के रूप में समझा गया है। हिन्दी में केवल ‘क्या कहना’ अस्वाभाविक होता, इसलिए प्रसंग में निहित ‘उचित है’ स्पष्ट किया गया है; वैकल्पिक वाक्य-संबंध फुटनोट में रखा गया है।
- source_word: לְמֶלֶךְ
  choice: किसी राजा से
  rationale: לְ वचन के संबोधित व्यक्ति को चिह्नित करता है और מֶלֶךְ अनिश्चित है; ‘किसी राजा से’ हिन्दी में सामान्य, अनिश्चित अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּלִיָּעַל
  choice: निकम्मे
  rationale: यहाँ शब्द अपमानसूचक रूप में निकम्मेपन या अधमता को व्यक्त करता है, बाद के व्यक्तिवाचक नाम ‘बेलियाल’ को नहीं। संबोधन के लिए ‘निकम्मे!’ सहज आधुनिक हिन्दी है।
- source_word: רָשָׁע
  choice: दुष्टो
  rationale: मूल रूप व्याकरणतः एकवचन है, पर उसका संबोधन बहुवचन נְדִיבִים से है। हिन्दी में बहुवचन संबोधन ‘दुष्टो!’ अर्थ और समानांतरता को स्पष्ट रखता है।
- source_word: אֶל־נְדִיבִים
  choice: कुलीनों से
  rationale: אֶל यहाँ संबोधन का लक्ष्य बताता है। נְדִיבִים राजा के समानांतर उच्च पद या प्रतिष्ठा वाले लोगों को दर्शाता है; ‘कुलीनों’ में यह सामाजिक-राजनीतिक भाव बना रहता है।
theological_decisions:
- issue: הַאֲמֹר का वाक्यगत संबंध
  choice: 'इसे अलंकारिक प्रश्न माना गया: ‘क्या ... कहना उचित है?’'
  alternative: 'पिछले प्रसंग में वर्णित व्यक्ति के लिए संबंधवाचक कथन: ‘जो ... कहता है’'
  rationale: मसोरेटी स्वरांकन में आरम्भिक הַ स्वाभाविक रूप से प्रश्नवाचक है। फिर भी प्राचीन अनुवादों और प्रसंग के आधार पर संबंधवाचक विश्लेषण संभव है, इसलिए अनिश्चितता को फुटनोट में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक पठन के अनुकूल रखी गई है। ‘निकम्मे’ तथा ‘दुष्टो’ सीधे संबोधन की तीखी शक्ति बनाए रखते हैं। पद को अलंकारिक प्रश्न के रूप में प्रस्तुत किया गया है, जबकि वैकल्पिक संबंधवाचक समझ को फुटनोट में सुरक्षित रखा गया है।
