  choice: मैं फिर ऐसा नहीं करूँगा
  rationale: शाब्दिक अर्थ ‘मैं और नहीं जोड़ूँगा’ है, पर निषेध के साथ יסף का मुहावरेदार अर्थ किसी काम को दोबारा न करना या जारी न रखना है। ‘ऐसा’ पूर्वोक्त गलत काम की ओर संकेत करता है।
