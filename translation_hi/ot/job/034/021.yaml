source:
  edition: WLC
  text: כִּי עֵ֭ינָי/ו עַל דַּרְכֵי אִ֑ישׁ וְֽ/כָל צְעָדָ֥י/ו יִרְאֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/021.yaml
  text: For his eyes are on the ways of a man[a], and he sees all his steps.
translation:
  language: hi
  text: क्योंकि उसकी आँखें मनुष्य के मार्गों पर लगी रहती हैं[a], और वह उसके हर कदम को देखता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “किसी व्यक्ति के मार्गों पर।” हिब्रू में पुल्लिंग एकवचन “मनुष्य” का प्रयोग सामान्य, प्रतिनिधिक अर्थ में हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद पिछले कथन का आधार या स्पष्टीकरण देता है; ‘क्योंकि’ उस संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עֵינָיו עַל
  choice: उसकी आँखें ... पर लगी रहती हैं
  rationale: बहुवचन संज्ञा और तृतीय पुरुष पुल्लिंग एकवचन प्रत्यय को बनाए रखते हुए यह प्रयोग सतत और ध्यानपूर्ण निगरानी का स्वाभाविक हिन्दी रूप है। संदर्भ में ‘उसकी’ का संकेत परमेश्वर की ओर है।
- source_word: דַּרְכֵי אִישׁ
  choice: मनुष्य के मार्गों
  rationale: דֶּרֶךְ जीवन-चाल या आचरण का रूपक हो सकता है, इसलिए ‘मार्ग’ ठोस चित्र और नैतिक अर्थ दोनों बनाए रखता है। אִישׁ यहाँ पुल्लिंग एकवचन में सामान्य प्रतिनिधिक अर्थ रखता है।
- source_word: וְכָל צְעָדָיו
  choice: और ... उसके हर कदम को
  rationale: כָּל को एकवचन भाव वाले ‘कदम’ के साथ ‘हर’ कहना आधुनिक हिन्दी में स्वाभाविक है और सम्पूर्णता व्यक्त करता है; ‘कदम’ मूल बिंब को बनाए रखता है।
- source_word: יִרְאֶה
  choice: देखता है
  rationale: ראה के क़ाल अपूर्ण 3 पुं. एक. को यहाँ सामान्य और निरंतर सत्य के रूप में वर्तमान काल में व्यक्त किया गया है।
theological_decisions:
- issue: אִישׁ का सामान्य पुल्लिंग प्रयोग
  choice: मनुष्य
  alternative: व्यक्ति
  rationale: ‘मनुष्य’ मूल के पुल्लिंग एकवचन रूप और उसके प्रतिनिधिक, समस्त मानवों पर लागू अर्थ—दोनों को स्वाभाविक हिन्दी में बनाए रखता है; इसे केवल पुरुषों तक सीमित नहीं किया गया।
- issue: सर्वनाम का संदर्भ
  choice: उसकी / वह
  alternative: परमेश्वर की / परमेश्वर
  rationale: आसपास के संदर्भ में कर्ता परमेश्वर है, पर इस पद में हिब्रू सर्वनाम ही प्रयुक्त हैं; इसलिए अनावश्यक स्पष्टता जोड़ने के बजाय सर्वनाम सुरक्षित रखे गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण रूप। ‘आँखें ... पर लगी रहती हैं’ दिव्य अवलोकन की निरंतरता व्यक्त करता है, जबकि ‘मार्ग’ और ‘कदम’ मूल हिब्रू के जीवन-यात्रा संबंधी समानांतर बिंबों को सुरक्षित रखते हैं।
