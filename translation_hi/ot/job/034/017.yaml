source:
  edition: WLC
  text: הַ/אַ֬ף שׂוֹנֵ֣א מִשְׁפָּ֣ט יַחֲב֑וֹשׁ וְ/אִם צַדִּ֖יק כַּבִּ֣יר תַּרְשִֽׁיעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/017.yaml
  text: Can one who hates justice govern? And will you condemn the righteous Mighty One?[a][b]
translation:
  language: hi
  text: क्या न्याय से घृणा करनेवाला शासन कर सकता है?[a] और क्या तुम उस धर्मी और सामर्थी को दोषी ठहराओगे?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस क्रिया का अधिक शाब्दिक अर्थ “बाँधना” है; यहाँ इसका अर्थ “नियंत्रण रखना,” “राज करना” या “शासन करना” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “उस न्यायी सामर्थी को” अथवा “उस धर्मी महान जन को।” प्रसंग में यह पद सबसे स्वाभाविक रूप से परमेश्वर की ओर संकेत करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: הַאַף
  choice: क्या ... सकता है?
  rationale: प्रश्नवाचक पद यहाँ बलयुक्त आलंकारिक प्रश्न आरम्भ करता है। स्वाभाविक हिन्दी में प्रश्न की संरचना ही अपेक्षित बल व्यक्त करती है।
- source_word: שׂוֹנֵא
  choice: घृणा करनेवाला
  rationale: कृदन्त संज्ञा के रूप में ऐसे व्यक्ति को बताता है जिसकी विशेषता निरन्तर घृणा करना है।
- source_word: מִשְׁפָּט
  choice: न्याय
  rationale: प्रसंग उचित शासन और नैतिक-न्यायिक व्यवस्था का है; इसलिए किसी एक निर्णय के बजाय ‘न्याय’ उपयुक्त है।
- source_word: יַחֲבֹשׁ
  choice: शासन कर सकता है
  rationale: क्रिया का मूल अर्थ ‘बाँधना’ है, पर यहाँ वह नियंत्रण या शासन चलाने के अर्थ में प्रयुक्त जान पड़ती है।
- source_word: וְאִם
  choice: और क्या
  rationale: यह पहले आलंकारिक प्रश्न के समानान्तर दूसरा प्रश्न जोड़ता है।
- source_word: צַדִּיק
  choice: धर्मी
  rationale: यह नैतिक सच्चाई और न्यायशीलता व्यक्त करता है तथा हिन्दी बाइबलीय संदर्भ में स्वाभाविक है।
- source_word: כַּבִּיר
  choice: सामर्थी
  rationale: विशेषण यहाँ संज्ञार्थक रूप में ‘सामर्थी/महान जन’ को सूचित करता है। ‘उस ... को’ की रचना इसे स्वाभाविक हिन्दी में व्यक्त करती है, बिना मुख्य पाठ में निश्चित रूप से दिव्य उपाधि बना देने के।
- source_word: תַּרְשִׁיעַ
  choice: दोषी ठहराओगे
  rationale: हिफ़ील रूप का अर्थ किसी को दुष्ट अथवा दोषी घोषित करना है; ‘दोषी ठहराना’ न्यायालयीन भाव स्पष्ट रखता है।
theological_decisions:
- issue: ‘धर्मी और सामर्थी’ का संदर्भ
  choice: मुख्य पाठ में वर्णनात्मक पद रखा गया है, जिसका प्रसंगगत संकेत परमेश्वर की ओर है
  alternative: इसे स्पष्ट दिव्य उपाधि के रूप में ‘धर्मी सर्वशक्तिमान’ अथवा ‘धर्मी सामर्थी जन’ कहना
  rationale: अय्यूब 34 में तर्क का लक्ष्य परमेश्वर को दोषी ठहराने की असंगति दिखाना है, पर इब्रानी पद स्वयं सामान्य विशेषणात्मक भाषा रखता है। इसलिए संदर्भ को पाद-टिप्पणी में बताया गया है और मूल की कुछ अस्पष्टता बचाई गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय किंतु सहज शैली रखी गई है। दोनों आलंकारिक प्रश्नों की समानान्तरता सुरक्षित है। ‘दोषी ठहराना’ न्यायिक संदर्भ को स्पष्ट करता है, जबकि ‘धर्मी और सामर्थी’ इब्रानी की वर्णनात्मक संरचना और संदर्भगत दिव्य संकेत दोनों को बनाए रखता है।
