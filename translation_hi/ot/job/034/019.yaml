  text: אֲשֶׁ֤ר לֹֽא נָשָׂ֨א פְּנֵ֥י שָׂרִ֗ים וְ/לֹ֣א נִכַּר שׁ֭וֹעַ לִ/פְנֵי דָ֑ל כִּֽי מַעֲשֵׂ֖ה יָדָ֣י/ו כֻּלָּֽ/ם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/019.yaml
  text: who shows no partiality to princes and does not regard the rich above the poor, for all of them are the work of his hands.
translation:
  language: hi
  text: 'जो हाकिमों का पक्ष नहीं करता

    और धनी को निर्धन से बढ़कर नहीं मानता,

    क्योंकि वे सब उसी के हाथों की रचना हैं।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נָשָׂא פְּנֵי שָׂרִים
  choice: हाकिमों का पक्ष नहीं करता
  rationale: मुहावरे का अर्थ पद या प्रतिष्ठा के कारण पक्षपात करना है; ‘हाकिम’ שָׂרִים के शासकीय और उच्च-पदस्थ भाव को सहज हिंदी में व्यक्त करता है।
- source_word: שׁוֹעַ
  choice: धनी
  rationale: यहाँ शब्द संपन्न अथवा प्रभावशाली व्यक्ति को दर्शाता है; निर्धन के साथ विरोध के कारण ‘धनी’ स्वाभाविक है।
- source_word: נִכַּר ... לִפְנֵי
  choice: निर्धन से बढ़कर नहीं मानता
  rationale: रूप का मूल भाव किसी को दूसरे की तुलना में विशेष मान्यता देना है; यह अनुवाद तुलनात्मक संबंध को स्पष्ट रखते हुए ‘favor’ से अधिक निर्णायक अर्थ नहीं जोड़ता।
- source_word: מַעֲשֵׂה יָדָיו
  choice: उसी के हाथों की रचना
  rationale: मूल का हस्तकृत-रूपक सुरक्षित रहता है और परमेश्वर को सबका समान सृष्टिकर्ता बताता है।
theological_decisions:
- issue: परमेश्वर की निष्पक्षता
  choice: पद और धन के आधार पर किसी को बढ़कर न मानने की बात रखी गई है।
  alternative: इसे केवल न्यायिक पक्षपात न करने तक सीमित करना।
  rationale: पद में प्रयुक्त दोनों समानांतर वाक्य सामाजिक प्रतिष्ठा और संपत्ति के आधार पर विशेष मान्यता न देने का व्यापक भाव रखते हैं।
- issue: मानव समानता का आधार
  choice: ‘वे सब उसी के हाथों की रचना हैं’
  alternative: ‘उसने उन सबको बनाया है’
  rationale: मूल के ‘उसके हाथों के काम’ रूपक को बचाने से समान सृष्टिकर्ता के सामने सभी की समान स्थिति उभरती है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिंदी। काव्यात्मक समानांतरता बनाए रखने के लिए तीन पंक्तियाँ रखी गई हैं; कोई पाद-टिप्पणी आवश्यक नहीं।
