  edition: WLC
  text: כִּ֤י פֹ֣עַל אָ֭דָם יְשַׁלֶּם ל֑/וֹ וּֽ/כְ/אֹ֥רַח אִ֝֗ישׁ יַמְצִאֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/011.yaml
  text: For he repays a man according to his deed[a], and he makes him find according to a man's way.
translation:
  language: hi
  text: 'क्योंकि वह मनुष्य को उसके काम के अनुसार प्रतिफल देता है,

    और मनुष्य के आचरण के अनुसार उसे फल भोगने देता है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ इसका स्वाभाविक व्याख्यात्मक बल रखता है।
- source_word: פֹעַל אָדָם
  choice: मनुष्य को उसके किए का फल
  rationale: פֹעַל व्यक्ति के कर्म या किए हुए कार्य को दर्शाता है। ‘किए का फल’ नैतिक प्रतिफल के संदर्भ को स्पष्ट रखते हुए सहज हिन्दी देता है।
- source_word: יְשַׁלֶּם לוֹ
  choice: उसे ... फल देता है
  rationale: שלם का पिएल रूप यहाँ किए के अनुरूप बदला या प्रतिफल देने का अर्थ रखता है। ‘फल देता है’ न्यायपूर्ण प्रत्युत्तर को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וּכְאֹרַח אִישׁ
  choice: और हर व्यक्ति को उसकी चाल के अनुसार
  rationale: אֹרַח का मूल बिंब ‘मार्ग/पथ’ है और यहाँ जीवन-व्यवहार का रूपक है। ‘चाल’ उस रूपक और नैतिक आचरण, दोनों को संक्षेप में बनाए रखती है; אִישׁ का प्रतिनिधिक एकवचन हिन्दी में ‘हर व्यक्ति’ से स्वाभाविक रूप से व्यक्त होता है।
- source_word: יַמְצִאֶנּוּ
  choice: प्रतिफल देता है
  rationale: מצא का हिफ़ील रूप किसी को उसके आचरण के अनुरूप परिणाम का अनुभव कराने का भाव रखता है। ‘प्रतिफल देता है’ संदर्भगत अर्थ को स्पष्ट करता है, बिना परिणाम को केवल दंड तक सीमित किए।
theological_decisions:
- issue: मानवीय आचरण के अनुसार परमेश्वर का प्रतिफल
  choice: पद को इस सामान्य सिद्धांत के रूप में रखा गया है कि परमेश्वर मनुष्य को उसके कर्म और जीवन-चाल के अनुरूप प्रतिफल देता है।
  alternative: इसे ऐसा सार्वभौमिक दावा मानना कि हर पीड़ा किसी व्यक्तिगत पाप का ठीक-ठीक दंड है।
  rationale: हिब्रू वाक्य न्यायपूर्ण प्रतिफल का सिद्धांत कहता है, पर अय्यूब की पुस्तक के व्यापक तनाव को समाप्त करके प्रत्येक दुःख की सरल व्याख्या नहीं देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। समानांतर पंक्तियों में ‘किए’ और ‘चाल’ कर्म तथा जीवन-पद्धति के निकटार्थी पक्षों को बनाए रखते हैं।
