    reason: lexical_alternative
lexical_decisions:
- source_word: יִגְוַע
  choice: प्राण छोड़ देते
  rationale: גוע का अर्थ प्राण निकलना या मर जाना है। हिंदी में “प्राण छोड़ना” इसकी गंभीरता को स्वाभाविक ढंग से व्यक्त करता है; पूर्ववर्ती पद से प्राप्त शर्तसूचक भाव के कारण “देते” रखा गया है।
- source_word: כָּל בָּשָׂר
  choice: सभी प्राणी
  rationale: शाब्दिक अर्थ “सारा मांस” है, पर यह इब्रानी मुहावरा नश्वर प्राणियों के सामूहिक अर्थ में आता है। “सभी प्राणी” आधुनिक हिंदी में स्पष्ट और स्वाभाविक है तथा इसके व्यापक दायरे को बनाए रखता है।
- source_word: יָחַד
  choice: एक साथ
  rationale: यह क्रियाविशेषण सामूहिकता अथवा एक ही समय होने पर बल देता है; “एक साथ” दोनों भावों को सहज रूप से व्यक्त करता है।
- source_word: אָדָם
  choice: मनुष्य
  rationale: यह एकवचन शब्द यहाँ जातिवाचक रूप में समस्त मानवता का प्रतिनिधित्व कर सकता है। “मनुष्य” हिंदी में एकवचन संरचना और सामूहिक मानवीय संदर्भ दोनों को बनाए रखता है।
- source_word: עַל עָפָר
  choice: मिट्टी में
  rationale: עַל का मूल अर्थ “पर” है, किंतु שוב के साथ मृत्यु और सृष्टि-संबंधी इस कथन में हिंदी का स्वाभाविक प्रयोग “मिट्टी में लौटना” है।
- source_word: יָשׁוּב
  choice: लौट जाता
  rationale: שוב का सामान्य अर्थ “लौटना” है। पूर्ववर्ती पद से जारी शर्तसूचक परिणाम को हिंदी में “लौट जाता” स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: אָדָם का जातिवाचक मानवीय अर्थ
  choice: मनुष्य
  alternative: मानवजाति
  rationale: इब्रानी में शब्द व्याकरणतः एकवचन है, किंतु यहाँ सामूहिक मानवता को सूचित करता है। मुख्य पाठ में “मनुष्य” मूल की एकवचन रचना को बचाता है, जबकि पादटिप्पणी सामूहिक अर्थ स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। पद 14 से आने वाला शर्तसूचक भाव हिंदी के अपूर्ण भूतकालीन रूपों “देते” और “लौट जाता” से व्यक्त किया गया है।
