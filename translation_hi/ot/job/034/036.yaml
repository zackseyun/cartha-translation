id: JOB.34.36
reference: Job 34:36
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אָבִ֗י יִבָּחֵ֣ן אִיּ֣וֹב עַד נֶ֑צַח עַל תְּ֝שֻׁבֹ֗ת בְּ/אַנְשֵׁי אָֽוֶן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/036.yaml
  text: My father[a], let Job be tested to the limit[c][b], because of his answers like wicked men.
translation:
  language: hi
  text: हे मेरे पिता[a], अय्यूब को पूरी तरह[b] परखा जाए, क्योंकि उसके उत्तर दुष्ट लोगों जैसे हैं[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे पिता”; इब्रानी में शाब्दिक रूप से “मेरे पिता” है। संभवतः यह संबोधन है, यद्यपि इसे अन्य प्रकार से भी समझा गया है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “सदा तक”; यहाँ संभवतः आशय अत्यंत गहन या पूर्ण परीक्षण से है, न कि कभी न समाप्त होने वाले परीक्षण से।
    reason: lexical_alternative
  - marker: c
    text: या, “दुष्ट लोगों के साथ” अथवा “दुष्ट लोगों के बीच”; इब्रानी पूर्वसर्ग तुलना या संगति—दोनों का संकेत दे सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: אָבִי
  choice: हे मेरे पिता
  rationale: रूप का शाब्दिक अर्थ ‘मेरे पिता’ है और यहाँ इसे संबोधन मानना व्यंजन-पाठ की सबसे सीधी समझ है। ‘हे’ आधुनिक हिन्दी में संबोधन को स्पष्ट और स्वाभाविक बनाता है।
- source_word: יִבָּחֵן
  choice: परखा जाए
  rationale: בחן के निफ़अल अपूर्ण रूप का अर्थ ‘परखा/जाँचा जाना’ है। प्रसंग में यह इच्छा या आग्रह व्यक्त करता है, इसलिए ‘परखा जाए’ उपयुक्त है।
- source_word: עַד נֶצַח
  choice: पूरी तरह
  rationale: पदबंध का शाब्दिक अर्थ ‘सदा तक’ है, पर इस न्यायिक जाँच के प्रसंग में यह परीक्षण की चरम सीमा या पूर्णता सूचित कर सकता है। मुख्य पाठ में स्वाभाविक अर्थ रखा गया है और शाब्दिक संभावना पादटिप्पणी में दी गई है।
- source_word: עַל
  choice: क्योंकि
  rationale: यहाँ עַל उस आधार या कारण का परिचय देता है जिसके कारण अय्यूब को परखे जाने की इच्छा व्यक्त की गई है।
- source_word: תְּשֻׁבוֹת
  choice: उत्तर
  rationale: यह संज्ञा वाद-विवाद के प्रसंग में दिए गए उत्तरों या प्रत्युत्तरों को सूचित करती है; ‘उत्तर’ संक्षिप्त और स्वाभाविक है।
- source_word: בְּאַנְשֵׁי אָוֶן
  choice: दुष्ट लोगों जैसे
  rationale: בְּ यहाँ तुलना अथवा संगति दोनों का बोध करा सकता है। मुख्य पाठ में तुलनात्मक अर्थ लिया गया है, जबकि संगति वाला अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: अय्यूब को परखे जाने की एलीहू की इच्छा
  choice: एलीहू चाहता है कि अय्यूब को उसके दुष्ट लोगों जैसे उत्तरों के कारण पूरी तरह परखा जाए।
  alternative: एलीहू चाहता है कि अय्यूब को दुष्ट लोगों के साथ या उनके बीच उसके उत्तरों के कारण सदा तक परखा जाए।
  rationale: वाक्य-विन्यास कठिन है। अनुवाद एलीहू के आरोप की तीव्रता बनाए रखता है, पर इसे परमेश्वर की ओर से कोई स्वतंत्र धर्मसैद्धान्तिक घोषणा नहीं बनाता। अवधि/पूर्णता और तुलना/संगति की अनिश्चितताएँ पादटिप्पणियों में रखी गई हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘हे मेरे पिता’ मूल की असामान्य संबोधन-रचना को मिटाए बिना हिन्दी में स्पष्ट करता है। ‘पूरी तरह परखा जाए’ न्यायिक परीक्षण का भाव देता है और शाब्दिक कालगत अर्थ को पादटिप्पणी में सुरक्षित रखता है।
