- source_word: יַשְׂבִּיעַנִי
  choice: मुझे ... भर देता है
  rationale: שבע के हिफ़ील रूप का अर्थ तृप्त या भर देना है। नकारात्मक प्रसंग में ‘भर देता है’ स्पष्ट और स्वाभाविक है।
- source_word: מַמְּרֹרִים
  choice: कड़वी पीड़ाओं से
