  yaml_path: translation/ot/job/009/014.yaml
  text: How much less could I answer him and choose my words with him?[a][b][c]
translation:
  language: hi
  text: तो फिर मैं उसे उत्तर कैसे दे सकता हूँ, और उससे बोलने के लिए अपने शब्द कैसे चुन सकता हूँ?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तो मैं उसे कैसे उत्तर दे सकता हूँ?” इब्रानी आरम्भ प्रसंग में अधिक प्रबल असमर्थता का निष्कर्ष व्यक्त करता है।
    reason: lexical_alternative
  - marker: b
    text: “अपने शब्द” का अनुवाद “अपनी दलीलें” भी हो सकता है, क्योंकि प्रसंग परमेश्वर के सामने अपना मुकदमा रखने का है।
    reason: lexical_alternative
  - marker: c
    text: “उससे बोलने के लिए” के स्थान पर “उसके सामने” या “उसके विरुद्ध” भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף כִּי
  choice: तो फिर…कैसे
  rationale: संदर्भ में यह पद पहले कही गई बात से और भी प्रबल असमर्थता का निष्कर्ष निकालता है। स्वाभाविक हिन्दी में ‘तो फिर…कैसे’ इस आलंकारिक प्रश्न को स्पष्ट रखता है; ‘मैं तो कितना कम’ अधिक शाब्दिक पर कम स्वाभाविक होता।
- source_word: אָנֹכִי
  choice: मैं
  rationale: स्वतंत्र प्रथम-पुरुष सर्वनाम यहाँ कर्ता पर बल देता है; हिन्दी में ‘मैं’ और वाक्य की प्रश्नात्मक संरचना पर्याप्त बल देती है।
- source_word: אֶעֱנֶנּוּ
  choice: उसे उत्तर दे सकता हूँ
  rationale: ענה का मूल अर्थ ‘उत्तर देना’ है। सामर्थ्यसूचक रूप प्रसंग में अय्यूब की असमर्थता और आलंकारिक प्रश्न की शक्ति व्यक्त करता है।
- source_word: אֶבְחֲרָה
  choice: चुन सकता हूँ
  rationale: בחר के सामान्य अर्थ ‘चुनना’ को बनाए रखा गया है और समानांतर प्रश्नात्मक संरचना में निहित असमर्थता व्यक्त की गई है।
- source_word: דְבָרַי
  choice: अपने शब्द
  rationale: דבר का सीधा अर्थ ‘शब्द/बात’ है। ‘अपने शब्द’ सावधानी से वाणी चुनने की छवि बचाता है; ‘अपनी दलीलें’ न्यायिक प्रसंग को अधिक स्पष्ट करता, पर वह व्याख्यात्मक है।
- source_word: עִמּוֹ
  choice: उससे बोलने के लिए
  rationale: עם का मूल भाव ‘साथ/से’ है। हिन्दी में केवल ‘उसके साथ अपने शब्द चुनना’ अस्वाभाविक है, इसलिए बोलने का निहित भाव स्पष्ट किया गया है; ‘उसके सामने’ और ‘उसके विरुद्ध’ संभावित प्रसंगगत अर्थ हैं।
