  text: then you would plunge me into the pit[b][a], and my own clothes would abhor me.
translation:
  language: hi
  text: तब तू मुझे गड्ढे[a] में डुबो देता, और मेरे अपने वस्त्र भी मुझसे घृणा करते।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘खाई में।’ इब्रानी शब्द का अर्थ ‘गड्ढा,’ ‘खाई,’ अथवा कुछ संदर्भों में ‘विनाश’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: तब
  rationale: यह कालवाचक/क्रमवाचक क्रियाविशेषण पिछले पद की काल्पनिक स्थिति का परिणाम बताता है।
- source_word: בַּשַּׁחַת
  choice: गड्ढे में
  rationale: שַׁחַת का अर्थ गड्ढा, खाई या विनाश हो सकता है। यहाँ धोने और फिर डुबोए जाने की ठोस छवि के लिए ‘गड्ढा’ उपयुक्त है; गति का भाव ‘डुबो देता’ से स्पष्ट होता है।
- source_word: תִּטְבְּלֵנִי
  choice: तू मुझे ... डुबो देता
  rationale: טבל का मूल भाव डुबाना या निमज्जित करना है। यह अनुवाद इब्रानी के द्वितीय पुरुष एकवचन और अय्यूब की शिकायत की तीव्रता को बनाए रखता है।
- source_word: וְתִעֲבוּנִי
  choice: मुझसे घृणा करते
  rationale: תעב तीव्र घृणा या विरक्ति व्यक्त करता है। बहुवचन क्रिया का कर्ता बाद में आया बहुवचन ‘मेरे वस्त्र’ है।
- source_word: שַׂלְמוֹתָי
  choice: मेरे अपने वस्त्र
  rationale: यह बाहरी कपड़ों/वस्त्रों को दर्शाता है। ‘अपने’ उस विडंबना पर बल देता है कि अय्यूब के निकटतम वस्त्र भी उससे घृणा करेंगे।
theological_decisions:
- issue: द्वितीय पुरुष क्रिया से व्यक्त कर्तृत्व
  choice: 'अय्यूब सीधे परमेश्वर को संबोधित करता है: ‘तू मुझे ... डुबो देता।’'
  alternative: इसे परिस्थितिजन्य रूप से कहना कि अय्यूब स्वयं गड्ढे में जा पड़ता।
  rationale: इब्रानी क्रिया द्वितीय पुरुष पुल्लिंग एकवचन है और संदर्भ में परमेश्वर से सीधा संबोधन जारी रखती है। इससे ईश्वरीय कर्तृत्व को नरम किए बिना कथन का धर्मवैचारिक तनाव बना रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गंभीर और काव्यात्मक शैली। परमेश्वर के लिए संदर्भानुकूल एकवचन ‘तू’ रखा गया है। ‘वस्त्र’ गरिमापूर्ण किंतु सामान्यतः समझ में आने वाला शब्द है।
