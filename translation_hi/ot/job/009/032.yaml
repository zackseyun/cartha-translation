source:
  edition: WLC
  text: כִּי לֹא אִ֣ישׁ כָּמֹ֣/נִי אֶֽעֱנֶ֑/נּוּ נָב֥וֹא יַ֝חְדָּ֗ו בַּ/מִּשְׁפָּֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/032.yaml
  text: For he is not a man like me[a], that I should answer him, that we should come together in court.
translation:
  language: hi
  text: क्योंकि वह मेरे समान मनुष्य नहीं है कि मैं उसे उत्तर दे सकूँ, कि हम दोनों न्यायिक मामले में साथ आएँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ तर्क-संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לֹא אִישׁ
  choice: वह ... मनुष्य नहीं
  rationale: אִישׁ यहाँ अय्यूब जैसे मानवीय पक्षकार के विपरीत परमेश्वर को रखता है। ‘मनुष्य’ आधुनिक हिन्दी में स्वाभाविक है और मानवीय-अमानवीय भेद को सुरक्षित रखता है।
- source_word: כָּמֹנִי
  choice: मेरे समान
  rationale: तुलनात्मक अर्थ को संक्षिप्त, गरिमापूर्ण और सीधे रूप में व्यक्त करता है।
- source_word: אֶעֱנֶנּוּ
  choice: मैं उसे उत्तर दूँ
  rationale: ענה का सामान्य अर्थ ‘उत्तर देना’ है और प्रसंग में किसी मुकदमे में प्रतिवाद करने की न्यायिक छाया भी बनी रहती है।
- source_word: נָבוֹא יַחְדָּו
  choice: हम दोनों ... साथ आएँ
  rationale: प्रथम पुरुष बहुवचन में अय्यूब और परमेश्वर दोनों सम्मिलित हैं; ‘दोनों’ निहित सहभागियों को स्पष्ट करता है और ‘साथ’ יַחְדָּו का अर्थ देता है।
- source_word: בַּמִּשְׁפָּט
  choice: न्याय के लिए
  rationale: מִשְׁפָּט यहाँ न्यायिक विवाद या निर्णय का संकेत देता है। ‘न्याय के लिए साथ आएँ’ कानूनी बिंब को बनाए रखता है, पर आधुनिक न्यायालय की संस्था को मूल से अधिक ठोस रूप में आरोपित नहीं करता।
theological_decisions:
- issue: अय्यूब और परमेश्वर के बीच न्यायिक बिंब
  choice: पद को इस असमानता के रूप में रखा गया है कि अय्यूब परमेश्वर को उत्तर देकर उसके साथ न्याय के लिए उपस्थित नहीं हो सकता।
  alternative: ‘हम दोनों अदालत में साथ आएँ’
  rationale: मूल में स्पष्ट न्यायिक भाषा है, किंतु ‘अदालत’ आधुनिक संस्थागत अर्थ को अधिक ठोस कर सकती है। ‘न्याय के लिए’ मूल की ‘न्याय/निर्णय/मुकदमे’ संबंधी अर्थ-सीमा और तनाव को अधिक खुला रखता है।
- issue: אִישׁ में मानवीय और लिंग-संबंधी अर्थ
  choice: ‘मनुष्य’
  alternative: ‘आदमी’ या ‘व्यक्ति’
  rationale: मुख्य विरोध परमेश्वर और मानवीय पक्षकार के बीच है। ‘मनुष्य’ इस विरोध को गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है; ‘व्यक्ति’ इसे धुंधला कर सकता है और ‘आदमी’ यहाँ अपेक्षाकृत बोलचाल का है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और न्यायिक प्रसंग के अनुरूप भाषा। वाक्य की दो समानांतर ‘कि’ उपवाक्य-संरचनाएँ हिब्रू तर्क और काव्यगत गति को बनाए रखती हैं।
