  text: Even if I were in the right, I would not answer; I would plead for mercy from my judge.
translation:
  language: hi
  text: यदि मैं निर्दोष भी होता, तो उत्तर न देता; अपने न्यायाधीश से विनती करता।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צָדַקְתִּי
  choice: मैं निर्दोष भी होता
  rationale: यहाँ क्रिया न्यायिक संदर्भ में अपने पक्ष के सही या निर्दोष ठहरने को व्यक्त करती है; सहज हिन्दी में ‘निर्दोष’ इस भाव को स्पष्ट रखता है।
- source_word: לֹא אֶעֱנֶה
  choice: उत्तर न देता
  rationale: शाब्दिक न्यायिक भाषा को बनाए रखते हुए यह स्वाभाविक और संक्षिप्त हिन्दी है।
- source_word: לִמְשֹׁפְטִי
  choice: अपने न्यायी से
  rationale: प्रत्यय प्रथम पुरुष संबंध बताता है और שׁפט का कृदंत यहाँ निर्णय करने वाले व्यक्ति को सूचित करता है; ‘न्यायी’ काव्यात्मक और न्यायिक दोनों रंग बनाए रखता है।
- source_word: אֶתְחַנָּן
  choice: दया की विनती करता
  rationale: हित्पएल रूप अनुग्रह या कृपा के लिए गिड़गिड़ाने/विनती करने का भाव देता है; यह अनुवाद दया माँगने की आश्रित मुद्रा व्यक्त करता है।
theological_decisions:
- issue: अय्यूब का ‘निर्दोष’ होना और न्यायी के सामने उसका उत्तर
  choice: 'शर्तात्मक कथन रखा गया: ‘यदि मैं निर्दोष भी होता’'
  alternative: ‘भले ही मैं सही होता’
  rationale: मूल पाठ अय्यूब की वास्तविक धार्मिक स्थिति का अंतिम निर्णय नहीं देता, बल्कि काल्पनिक रियायत के रूप में उसकी असमर्थता और दया की आवश्यकता प्रकट करता है।
- issue: מְשֹׁפְטִי में न्यायी की पहचान
  choice: सामान्य पद ‘अपने न्यायी’ रखा गया
  alternative: स्पष्ट रूप से ‘परमेश्वर, मेरे न्यायी’
  rationale: संदर्भ में संकेत परमेश्वर की ओर है, पर इस पद में नाम स्पष्ट नहीं है; अनुवाद मूल की अंतर्निहित पहचान और अस्पष्टता दोनों बचाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमामय और काव्यात्मक न्यायिक भाषा। ‘न्यायी’ सामान्य बोलचाल के ‘न्यायाधीश’ से अधिक साहित्यिक है, पर अय्यूब की काव्य-शैली के अनुरूप और सामान्य पाठक के लिए बोधगम्य है।
