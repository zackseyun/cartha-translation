  yaml_path: translation/ot/job/009/006.yaml
  text: who shakes the earth from its place[a], and its pillars tremble.
translation:
  language: hi
  text: 'वही पृथ्वी को उसके स्थान से हिला देता है,

    और उसके खम्भे काँप उठते हैं।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמַּרְגִּיז
  choice: हिला देता है
  rationale: רגז के हिफ़ईल कृदन्त का कारक भाव सुरक्षित रहता है। हिन्दी में ‘हिला देता है’ स्वाभाविक है और इस पद में परमेश्वर का वर्णन करने वाले सम्बन्धवाचक कथन के रूप में काम करता है।
- source_word: אֶרֶץ
  choice: पृथ्वी
  rationale: पृथ्वी के अपने स्थान और खम्भों वाली व्यापक ब्रह्माण्डीय छवि के कारण स्थानीय ‘देश/भूमि’ की अपेक्षा ‘पृथ्वी’ उपयुक्त है।
- source_word: מִמְּקוֹמָהּ
  choice: उसके स्थान से
  rationale: पूर्वसर्ग, संज्ञा और स्त्रीलिंग एकवचन प्रत्यय का सीधा तथा सहज हिन्दी रूप; यह अपने स्थान से हटाए जाने की छवि बनाए रखता है।
- source_word: וְעַמּוּדֶיהָ
  choice: और उसके खम्भे
  rationale: עמוד का मूल चित्र ‘खम्भा’ है। इसे ‘नींव’ कहकर व्याख्यात्मक रूप देने के बजाय काव्यात्मक ब्रह्माण्डीय बिम्ब सुरक्षित रखा गया है।
- source_word: יִתְפַלָּצוּן
  choice: काँप उठते हैं
  rationale: यह क्रिया तीव्र कम्पन या थरथराहट व्यक्त करती है। ‘काँप उठते हैं’ उस तीव्रता को स्वाभाविक हिन्दी में व्यक्त करता है और मानसिक भय का अनावश्यक अर्थ नहीं जोड़ता।
theological_decisions:
- issue: पृथ्वी के खम्भों की ब्रह्माण्डीय छवि
  choice: काव्यात्मक छवि को शाब्दिक रूप से ‘उसके खम्भे’ रखा गया है।
  alternative: आधुनिक ब्रह्माण्ड-दृष्टि के अनुरूप इसे ‘उसकी नींवें’ कहना।
  rationale: इब्रानी पाठ प्राचीन काव्यात्मक ब्रह्माण्डीय भाषा का प्रयोग करता है। अनुवाद को इसका आधुनिकीकरण या निरूपकीकरण करने के बजाय मूल छवि को सुरक्षित रखना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण काव्यात्मक शैली। ‘वही’ पिछले प्रसंग में परमेश्वर का वर्णन जारी रखने वाले इब्रानी कृदन्त को सहज हिन्दी में व्यक्त करता है। कोई पादटिप्पणी नहीं दी गई, क्योंकि अंग्रेज़ी परामर्श-पाठ का [a] चिह्न सम्भवतः दूसरे खण्ड के क्रियापद से जुड़ना चाहिए, जबकि उसकी स्थिति ‘स्थान’ के बाद है; हिन्दी मुख्य पाठ ‘काँप उठते हैं’ से अर्थ पर्याप्त स्पष्ट है।
