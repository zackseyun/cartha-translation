  text: God does not turn back his anger; beneath him the helpers of Rahab crouch.
translation:
  language: hi
  text: 'परमेश्वर अपना क्रोध वापस नहीं लेता;

    उसके नीचे रहाब के सहायक झुकते हैं।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱלוֹהַּ
  choice: परमेश्वर
  rationale: यह अय्यूब में प्रयुक्त ईश्वर-संबंधी एकवचन पद है; आधुनिक मानक हिन्दी में ‘परमेश्वर’ स्वाभाविक और गरिमापूर्ण है।
- source_word: לֹא יָשִׁיב אַפּוֹ
  choice: अपना क्रोध वापस नहीं लेता
  rationale: שׁוב के हिफ़ील रूप का भाव ‘वापस करना/हटा लेना’ है और אַף यहाँ क्रोध को दर्शाता है। यह वाक्य परमेश्वर के क्रोध के न लौटने की मूल छवि बनाए रखता है।
- source_word: תחתו
  choice: उसके नीचे
  rationale: स्थानवाचक रूपक को व्याख्यायित किए बिना सीधे सुरक्षित रखा गया है।
- source_word: שָׁחֲחוּ
  choice: दुबक जाते हैं
  rationale: क्रिया झुकने, दब जाने या अधीन होकर नीचे सिकुड़ने का बोध देती है। ‘दुबक जाते हैं’ पराजित भय और अधीनता की शारीरिक मुद्रा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עֹזְרֵי רָהַב
  choice: रहाब के सहायक
  rationale: रहाब को अनूदित या किसी ऐतिहासिक सत्ता से निश्चित रूप से न जोड़कर नाम के रूप में रखा गया है, जिससे समुद्री/अराजक पौराणिक संकेत की वास्तविक अस्पष्टता बनी रहती है।
theological_decisions:
- issue: परमेश्वर के क्रोध का न लौटना
  choice: अपना क्रोध वापस नहीं लेता
  alternative: अपने क्रोध को नहीं रोकता
  rationale: मूल में ‘लौटाने’ की भाषा है। चुना हुआ पाठ इस कथन के तनाव को बनाए रखता है और इसे परमेश्वर के स्वभाव पर किसी व्यापक व्यवस्थित निष्कर्ष में नहीं बदलता।
- issue: रहाब की पहचान
  choice: रहाब
  alternative: अभिमान / समुद्री दैत्य
  rationale: यहाँ רהב संभवतः आदिम समुद्री या अराजक शक्ति का नाम है, पर पद स्वयं उसकी पहचान स्पष्ट नहीं करता। लिप्यंतरण अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, संक्षिप्त और गरिमापूर्ण हिन्दी। समानांतर काव्य-पंक्तियाँ रखी गई हैं। ‘रहाब’ को बाइबिल के अन्य प्रसंग की स्त्री के रूप में समझाने से बचते हुए पुल्लिंग नाम के रूप में लिप्यंतरित किया गया है।
