- source_word: תָּם
  choice: निर्दोष
  rationale: यह शब्द संपूर्णता, खराई और निष्कलंक आचरण का भाव देता है। अय्यूब के संदर्भ में “निर्दोष” उसके सत्यनिष्ठ होने के दावे को व्यक्त करता है, पूर्णतः पापरहित होने का दावा नहीं।
- source_word: אָנִי
  choice: मैं
  rationale: इब्रानी में स्पष्ट और बलयुक्त प्रथम पुरुष सर्वनाम है, इसलिए इसे बनाए रखा गया है।
- source_word: לֹא אֵדַע
  choice: नहीं जानता
  rationale: मूल क्रिया का सामान्य अर्थ “जानना” है। अधिक व्याख्यात्मक अर्थ—जैसे “परवाह नहीं करता” या “स्वीकार नहीं करता”—चुनने के बजाय मूल कथन की कठोरता और अस्पष्टता सुरक्षित रखी गई है।
- source_word: נַפְשִׁי
  choice: अपने आप को
  rationale: נֶפֶשׁ का अर्थ प्रसंगानुसार प्राण, जीवन या स्वयं हो सकता है। यहाँ “अपने आप को” स्वाभाविक हिन्दी में आत्म-विमुखता का भाव देता है; व्यापक शाब्दिक संभावना पादटिप्पणी में रखी गई है।
- source_word: אֶמְאַס
  choice: घृणा करता हूँ
  rationale: מָאַס अस्वीकार करने या तुच्छ/घृणित समझने का भाव रखता है। “घृणा करता हूँ” अय्यूब की तीव्र भावनात्मक अभिव्यक्ति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: חַיָּי
  choice: अपने जीवन से
  rationale: यह प्रथम पुरुष प्रत्यय सहित “जीवन” को दर्शाता है। हिन्दी मुहावरे के अनुसार “जीवन से घृणा करना” स्वाभाविक रूप है।
