  text: אִם קָרָ֥אתִי וַֽ/יַּעֲנֵ֑/נִי לֹֽא אַ֝אֲמִ֗ין כִּֽי יַאֲזִ֥ין קוֹלִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/016.yaml
  text: If I called and he answered me[a], I would not believe that he was listening to my voice.
translation:
  language: hi
  text: यदि मैं पुकारता और वह मुझे उत्तर देता, तो भी मैं विश्वास न करता कि वह मेरी आवाज़ पर कान दे रहा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם
  choice: यदि
  rationale: यह एक काल्पनिक शर्त प्रस्तुत करता है; ‘यदि’ अर्थ को बिना उसे कालवाचक बनाए स्वाभाविक रूप से व्यक्त करता है।
- source_word: קָרָאתִי
  choice: मैं पुकारता
  rationale: קרא का सामान्य अर्थ ‘पुकारना’ है। यह प्रार्थना अथवा न्यायिक अपील—दोनों संभावित संदर्भों के लिए पर्याप्त व्यापक है।
- source_word: וַיַּעֲנֵנִי
  choice: और वह मुझे उत्तर देता
  rationale: ענה का सीधा और स्वाभाविक अर्थ ‘उत्तर देना’ है।
- source_word: לֹא אַאֲמִין
  choice: तब भी मैं विश्वास न करता
  rationale: शर्तात्मक संदर्भ में अपूर्ण क्रिया काल्पनिक परिणाम व्यक्त करती है। ‘तब भी’ कथन के अंतर्निहित रियायती तनाव को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: כִּי
  choice: कि
  rationale: यह उस बात की विषय-वस्तु प्रस्तुत करता है जिस पर अय्यूब विश्वास न करता, न कि कारण बताता है।
- source_word: יַאֲזִין
  choice: उसने ... कान लगाया है
  rationale: אזן ध्यान देकर सुनने या कान लगाने का भाव रखता है; यह केवल ‘सुनना’ से अधिक सटीक है।
- source_word: קוֹלִי
  choice: मेरी आवाज़
  rationale: קוֹל का सीधा अर्थ ‘आवाज़’ है; ‘मेरी विनती’ कहना अनावश्यक व्याख्या जोड़ता।
theological_decisions:
- issue: परमेश्वर के उत्तर और सुनने के विषय में अय्यूब का कथन
  choice: 'इसे अय्यूब की काल्पनिक परिस्थिति में व्यक्त व्यक्तिगत अविश्वसनीयता के रूप में रखा गया है: उत्तर मिलने पर भी वह विश्वास न करता कि उसकी आवाज़ पर सचमुच कान लगाया गया है।'
  alternative: इसे इस सार्वभौमिक दावे के रूप में प्रस्तुत करना कि परमेश्वर कभी प्रार्थना नहीं सुनता, अथवा इसे केवल अय्यूब के आश्चर्य तक सीमित कर देना।
  rationale: इब्रानी पाठ अय्यूब की व्यक्तिगत, काल्पनिक प्रतिक्रिया व्यक्त करता है। यह परमेश्वर के कभी न सुनने का व्यवस्थित धर्मवैज्ञानिक दावा नहीं करता; फिर भी अय्यूब के गहरे संशय को नरम नहीं किया जाना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज वाक्य-विन्यास रखा गया है। ‘कान लगाया है’ मूल के ध्यानपूर्वक सुनने वाले भाव को सुरक्षित रखता है। कोई पाद-टिप्पणी आवश्यक नहीं मानी गई, क्योंकि ‘पुकारता’ और ‘कान लगाया’ प्रमुख शाब्दिक संभावनाओं को मुख्य पाठ में पर्याप्त रूप से व्यक्त करते हैं।
