  yaml_path: translation/ot/job/009/033.yaml
  text: There is no arbiter between us[a], who might lay his hand on us both.
translation:
  language: hi
  text: हमारे बीच कोई ऐसा निर्णायक नहीं है जो हम दोनों पर अपना हाथ रख सके।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא יֵשׁ
  choice: कोई नहीं है
  rationale: हिब्रू की अस्तित्ववाचक नकारात्मक रचना को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בֵּינֵינוּ
  choice: हमारे बीच
  rationale: यह अय्यूब और परमेश्वर—विवाद के दोनों पक्षों—के बीच के संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: מוֹכִיחַ
  choice: निर्णायक
  rationale: यहाँ मूल क्रिया יכח का संदर्भ न्यायिक विवाद में दोनों पक्षों के बीच निर्णय करने या हस्तक्षेप करने वाले व्यक्ति से है। ‘निर्णायक’ उस न्यायिक भूमिका को व्यक्त करता है, जबकि बाद की किसी विशिष्ट धर्मवैज्ञानिक धारणा को मुख्य पाठ में नहीं जोड़ता।
- source_word: יָשֵׁת
  choice: रख सके
  rationale: यह अनुपस्थित निर्णायक की संभावित या काल्पनिक कार्रवाई को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יָדוֹ
  choice: अपना हाथ
  rationale: हिब्रू के ठोस रूपक ‘उसका हाथ’ को बनाए रखता है; हिन्दी में कर्ता की ओर लौटने के कारण ‘अपना’ स्वाभाविक है। यह हाथ अधिकार का संकेत हो सकता है, पर मुख्य पाठ उस अर्थ की व्याख्या थोपता नहीं।
- source_word: עַל שְׁנֵינוּ
  choice: हम दोनों पर
  rationale: दोनों विवादरत पक्षों पर समान रूप से हाथ रखने की मूल छवि और बल को सुरक्षित रखता है।
theological_decisions:
- issue: क्या מוֹכִיחַ का अनुवाद धर्मवैज्ञानिक संकेत वाले ‘मध्यस्थ’ से किया जाए
  choice: निर्णायक
  alternative: मध्यस्थ
  rationale: तात्कालिक संदर्भ में अय्यूब अपने और परमेश्वर के बीच न्यायिक विवाद का निर्णय करने वाले तीसरे पक्ष के अभाव की बात करता है। ‘निर्णायक’ इस विधिक अर्थ को प्राथमिकता देता है और पद में बाद की पूर्ण विकसित मध्यस्थता-संबंधी धारणा नहीं जोड़ता; फिर भी वैध विकल्प ‘मध्यस्थ’ को पाद-टिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘निर्णायक’ न्यायिक संदर्भ को सामने रखता है, और ‘अपना हाथ रखना’ मूल हिब्रू की ठोस तथा जानबूझकर खुली छवि को सुरक्षित रखता है।
