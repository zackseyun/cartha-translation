lexical_decisions:
- source_word: יָגֹרְתִּי
  choice: मैं…डरता हूँ
  rationale: Qal पूर्ण प्रथम पुरुष एकवचन यहाँ वर्तमान मानसिक अवस्था व्यक्त करता है; ‘डरता हूँ’ आधुनिक हिन्दी में स्वाभाविक है, जबकि ‘भय खाता हूँ’ अधिक कृत्रिम लगेगा।
- source_word: כָל עַצְּבֹתָי
  choice: अपने सब दुखों से
  rationale: עַצְּבֹתָי शारीरिक पीड़ा, शोक या कष्टों को सूचित कर सकता है। ‘दुखों’ से यह व्यापकता बनी रहती है और केवल शारीरिक वेदना तक अर्थ सीमित नहीं होता।
- source_word: יָדַעְתִּי
  choice: मैं जानता हूँ
  rationale: Qal पूर्ण का यहाँ स्थितिवाचक वर्तमान अर्थ है।
- source_word: כִּי
  choice: कि
  rationale: यह अय्यूब के ज्ञान की विषय-वस्तु प्रस्तुत करता है।
- source_word: לֹא תְנַקֵּנִי
  choice: तू मुझे निर्दोष नहीं ठहराएगा
  rationale: נקה के Piel रूप में न्यायिक अर्थ ‘निर्दोष ठहराना/दोषमुक्त करना’ प्रमुख है। अय्यूब के परमेश्वर से सीधे संबोधन और न्याय-विवाद की पृष्ठभूमि में यह अर्थ स्पष्ट तथा स्वाभाविक है।
theological_decisions:
- issue: परमेश्वर को संबोधित करते हुए נקה का न्यायिक आशय
  choice: तू मुझे निर्दोष नहीं ठहराएगा
  alternative: तू मुझे दोषमुक्त नहीं करेगा; तू मुझे दण्ड दिए बिना नहीं छोड़ेगा
  rationale: मुख्य पाठ न्यायालय-संबंधी तनाव को बनाए रखता है—अय्यूब का विश्वास है कि संबोधित परमेश्वर उसे निर्दोष घोषित नहीं करेगा। यह कथन न तो अय्यूब की वास्तविक दोषिता तय करता है, न किसी बाद की धर्मवैज्ञानिक व्यवस्था को इसमें आरोपित करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; परमेश्वर के प्रति एकवचन ‘तू’ अय्यूब के सीधे और निकट संबोधन को दर्शाता है। भाषा सरल किंतु गरिमापूर्ण रखी गई है। दोनों पादों का संक्षिप्त समानांतर ढाँचा सुरक्षित है।
