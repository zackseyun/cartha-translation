  yaml_path: translation/ot/job/009/012.yaml
  text: Look[a], if he snatches away, who can turn him back? Who can say to him[b], ‘What are you doing?’
translation:
  language: hi
  text: देखो, जब वह झपटकर छीन लेता है[a], तो उसे पीछे कौन मोड़ सकता है[b]? कौन उससे कह सकता है, “तुम क्या कर रहे हो?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पकड़ ले” अथवा “ले जाए।” इब्रानी क्रिया में अचानक और बलपूर्वक लेने का भाव है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ, “कौन उसे लौटने को विवश कर सकता है?” अर्थात, कौन उसे पीछे मोड़ सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: देखो
  rationale: यह शब्द ध्यान खींचते हुए कथन पर बल देता है। ‘देखो’ आधुनिक हिन्दी में इसका स्वाभाविक और प्रभावशाली रूप है।
- source_word: יַחְתֹּף
  choice: झपटकर छीन ले
  rationale: חטף में अचानक और बलपूर्वक किसी वस्तु को ले जाने का भाव है। ‘झपटकर छीन ले’ क्रिया की तीव्रता और हटाकर ले जाने—दोनों भावों को व्यक्त करता है।
- source_word: יְשִׁיבֶנּוּ
  choice: उसे लौटा सकता है
  rationale: שׁוב के हिफ़ील रूप का मूल भाव किसी को वापस करना या लौटाना है। यहाँ प्रश्नवाचक वाक्य परमेश्वर के कार्य को पलटने या उसे पीछे हटाने की असमर्थता प्रकट करता है।
- source_word: מִי
  choice: कौन ... सकता है
  rationale: दोनों प्रश्न आलंकारिक हैं और केवल पहचान नहीं, बल्कि असमर्थता व्यक्त करते हैं; इसलिए हिन्दी में ‘कौन ... सकता है’ स्वाभाविक है।
- source_word: יֹאמַר אֵלָיו
  choice: उससे कह सकता है
  rationale: यह मूल वाक्यांश का सीधा और स्वाभाविक अनुवाद है; विरोध या प्रतिवाद का भाव अगले प्रश्न से स्वयं स्पष्ट होता है।
- source_word: מַה תַּעֲשֶׂה
  choice: तू क्या कर रहा है?
  rationale: इस चुनौतीपूर्ण प्रश्न में अपूर्ण क्रिया का वर्तमान क्रियाशील भाव हिन्दी में ‘क्या कर रहा है?’ से स्वाभाविक रूप से व्यक्त होता है। एकवचन ‘तू’ इब्रानी के एकवचन संबोधन को बनाए रखता है।
theological_decisions:
- issue: तीसरे पुरुष एकवचन प्रत्ययों का संदर्भ
  choice: प्रत्ययों को परमेश्वर के लिए व्यक्तिगत रूप में ‘वह/उसे’ अनूदित किया गया है।
  alternative: प्रत्यय को छीनी गई वस्तु के संदर्भ में ‘उसे’ समझना, अथवा वाक्य को परमेश्वर के किए काम को पलटने के अर्थ में लेना।
  rationale: निकटवर्ती संदर्भ में अय्यूब परमेश्वर की अप्रतिरोध्य कार्रवाई का वर्णन कर रहा है, और अगली पंक्ति में भी संबोधन परमेश्वर से है। फिर भी इब्रानी पुल्लिंग प्रत्यय अपने आप संदर्भ को पूरी तरह स्पष्ट नहीं करता, इसलिए वैकल्पिक समझ को पादटिप्पणी में स्वीकार किया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘झपटकर छीन ले’ काव्यात्मक तीव्रता को बनाए रखता है। प्रत्यक्ष संबोधन में ‘तू’ इब्रानी एकवचन के अनुरूप है और प्रश्न की निर्भीक चुनौती को सुरक्षित रखता है।
