base_translation:
  language: en
  yaml_path: translation/ot/job/009/020.yaml
  text: If I am in the right[a], my own mouth would condemn me; though I am blameless, it would prove me crooked.
translation:
  language: hi
  text: यदि मैं सही ठहरूँ, तो मेरा अपना मुँह मुझे दोषी ठहराएगा; चाहे मैं निर्दोष हूँ, वह मुझे कुटिल ठहराएगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “चाहे मैं निर्दोष हूँ, वह [परमेश्वर] मुझे कुटिल ठहराएगा,” यदि दूसरे खंड में परमेश्वर को निहित कर्ता माना जाए।
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: यदि
  rationale: यह शर्तसूचक अथवा प्रसंगानुसार रियायती अर्थ दे सकता है। यहाँ ‘यदि’ दोनों खंडों की शर्तात्मक बनावट को स्वाभाविक रूप से व्यक्त करता है, जबकि ‘भी’ अय्यूब की विडंबनापूर्ण विवशता को सामने लाता है।
- source_word: אֶצְדָּק
  choice: मैं सही भी हूँ
  rationale: צדק का काल रूप यहाँ न्यायिक संदर्भ में ‘सही होना/न्यायसंगत ठहरना’ बताता है, न कि अपने आपको धर्मी ठहराने की सकर्मक क्रिया। ‘सही’ सामान्य पाठक के लिए स्वाभाविक है और תָּם से भेद भी बनाए रखता है।
- source_word: פִּי
  choice: मेरा अपना मुँह
  rationale: शाब्दिक अर्थ ‘मेरा मुँह’ है। ‘अपना’ उस विडंबना पर बल देता है कि अय्यूब की अपनी ही वाणी उसके विरुद्ध हो जाएगी।
- source_word: יַרְשִׁיעֵנִי
  choice: मुझे दोषी ठहराएगा
  rationale: רשע का हिफ़ील न्यायिक संदर्भ में किसी को दोषी घोषित करना दर्शाता है। ‘दोषी ठहराना’ इस न्यायालय-सदृश भाषा को स्पष्ट और स्वाभाविक हिंदी में रखता है।
- source_word: תָּם
  choice: निर्दोष
  rationale: अय्यूब में תָּם प्रायः खराई और दोषरहित आचरण का बोध देता है, पूर्ण पापहीनता का नहीं। यहाँ ‘निर्दोष’ न्यायिक संदर्भ और समानांतरता दोनों के अनुकूल है।
- source_word: וַיַּעְקְשֵׁנִי
  choice: वह मुझे टेढ़ा ठहराएगा
  rationale: עקשׁ टेढ़ेपन या विकृतता को व्यक्त करता है। ‘टेढ़ा ठहराएगा’ न्यायिक/मूल्यांकनात्मक भाव बनाए रखता है और ‘टेढ़ा बना देगा’ की अनावश्यक कारणात्मक धारणा से बचता है। सर्वनाम ‘वह’ निकटतम विषय ‘मेरा मुँह’ की ओर संकेत कर सकता है, पर वैकल्पिक रूप से परमेश्वर को निहित विषय मानने की संभावना भी खुली रखता है।
theological_decisions:
- issue: וַיַּעְקְשֵׁנִי का निहित कर्ता
  choice: मुख्य पाठ में ‘वह’ का निकटतम संदर्भ ‘मेरा अपना मुँह’ है।
  alternative: 'परमेश्वर निहित कर्ता हो सकता है: ‘वह [परमेश्वर] मुझे टेढ़ा ठहराएगा।’'
  rationale: दोनों अर्ध-पंक्तियों की समानांतर रचना एक ही कर्ता—‘मेरा मुँह’—को आगे चलाने का समर्थन करती है। फिर भी इब्रानी क्रिया में कर्ता प्रत्यक्ष रूप से दोहराया नहीं गया है; इसलिए सर्वनाम और पादटिप्पणी के द्वारा परमेश्वर को निहित कर्ता मानने की वास्तविक अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिंदी। ‘सही,’ ‘दोषी ठहराएगा,’ और ‘निर्दोष’ न्यायिक संदर्भ को सामान्य पाठक के लिए स्पष्ट रखते हैं; ‘टेढ़ा’ मूल रूपक की तीक्ष्णता को बनाए रखता है।
