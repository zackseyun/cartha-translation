  text: נֹטֶ֣ה שָׁמַ֣יִם לְ/בַדּ֑/וֹ וְ֝/דוֹרֵ֗ךְ עַל בָּ֥מֳתֵי יָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/008.yaml
  text: who alone stretches out the heavens and treads on the heights of the sea[a].
translation:
  language: hi
  text: 'जो अकेला ही आकाश को फैलाता है,

    और समुद्र की ऊँचाइयों पर चलता है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “समुद्र की लहरों पर चलता है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹטֶה
  choice: फैलाता है
  rationale: נטה के काल रूप कृदंत का अर्थ फैलाना या तानना है। यहाँ सृष्टि-विषयक काव्य में 'फैलाता है' स्वाभाविक है और वर्णनात्मक क्रिया को बनाए रखता है।
- source_word: שָׁמַיִם
  choice: आकाश
  rationale: काव्यात्मक सृष्टि-संदर्भ में यह ऊपर विस्तृत आकाशमंडल को सूचित करता है। आधुनिक हिन्दी में 'आकाश' सहज, गरिमापूर्ण और अर्थानुकूल है।
- source_word: לְבַדּוֹ
  choice: अकेला ही
  rationale: यह परमेश्वर के बिना किसी सहायता के किए गए अद्वितीय कार्य पर बल देता है; 'ही' उस विशिष्टता को स्पष्ट करता है।
- source_word: וְדוֹרֵךְ
  choice: और ... चलता है
  rationale: דרך का मूल बिंब किसी सतह पर पैर रखने या चलने का है। हिन्दी में 'चलता है' सहज है और इसे विनाशकारी 'रौंदता है' के रूप में अधिक व्याख्यायित नहीं करता।
- source_word: עַל
  choice: पर
  rationale: यह पूर्वसर्ग सतह के ऊपर या उस पर होने का सामान्य संबंध व्यक्त करता है।
- source_word: בָּמֳתֵי
  choice: ऊँचाइयों
  rationale: במה का मूल अर्थ ऊँचाई या ऊँचा स्थान है। मुख्य पाठ औपचारिक काव्य-बिंब 'समुद्र की ऊँचाइयों' को सुरक्षित रखता है; संदर्भ में इससे लहरों की उठी हुई चोटियाँ समझी जा सकती हैं।
- source_word: יָם
  choice: समुद्र
  rationale: एकवचन 'समुद्र' इब्रानी रूप और व्यापक सृष्टि-संबंधी काव्य-बिंब दोनों के अनुरूप है।
theological_decisions:
- issue: सृष्टि पर परमेश्वर की अद्वितीय प्रभुता का ब्रह्मांडीय बिंब
  choice: परमेश्वर के अकेले आकाश फैलाने और समुद्र की ऊँचाइयों पर चलने के काव्यात्मक चित्रण को बनाए रखा गया है।
  alternative: ‘समुद्र की लहरों पर चलता है’ के रूप में अधिक अर्थ-स्पष्ट अनुवाद करना।
  rationale: पद ऊँची काव्यात्मक भाषा में परमेश्वर की अद्वितीय प्रभुता प्रस्तुत करता है। मुख्य पाठ इब्रानी रूपक को बनाए रखता है, जबकि संभावित मुहावरेदार अर्थ पादटिप्पणी में दिया गया है; बाद की कोई धर्मवैज्ञानिक धारणा पाठ में नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण काव्यात्मक शैली अपनाई गई है। 'अकेला ही' विशिष्टता पर बल देता है और 'समुद्र की ऊँचाइयों' मूल बिंब की वास्तविक अस्पष्टता को सुरक्षित रखता है।
