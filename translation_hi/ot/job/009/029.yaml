lexical_decisions:
- source_word: אָנֹכִי
  choice: मैं तो
  rationale: स्वतंत्र प्रथम-पुरुष सर्वनाम यहाँ बल देता है; ‘मैं तो’ उस बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֶרְשָׁע
  choice: दोषी ठहराया जाऊँगा
  rationale: רשע का काल-संदर्भित न्यायिक अर्थ ‘दोषी ठहरना’ हो सकता है। अय्यूब 9 के निकटवर्ती प्रसंग में अपनी निर्दोषता सिद्ध न कर पाने की बात होने के कारण न्यायिक अर्थ उपयुक्त है; नैतिक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: לָמָה זֶּה
  choice: फिर ... क्यों
  rationale: यह संयुक्त प्रश्नवाचक मुहावरा प्रसंग में निष्कर्षसूचक ‘फिर क्यों?’ का भाव देता है।
- source_word: הֶבֶל
  choice: व्यर्थ
  rationale: यहाँ शब्द शून्यता अथवा निष्फलता को व्यक्त करता है और अय्यूब के परिश्रम का निष्फल होना बताता है।
- source_word: אִיגָע
  choice: मैं ... परिश्रम करूँ
  rationale: יגע का अर्थ श्रम करना या थककर चूर होना है; प्रश्नात्मक रूप में ‘परिश्रम क्यों करूँ?’ सहज और अर्थनिष्ठ है।
theological_decisions:
- issue: רשע का न्यायिक अथवा नैतिक अर्थ
  choice: दोषी ठहराया जाऊँगा
  alternative: मैं दुष्ट ठहरूँगा / मैं दुष्ट होऊँगा
  rationale: आस-पास का प्रसंग परमेश्वर के सामने अय्यूब के दोषी माने जाने और अपनी निर्दोषता सिद्ध न कर सकने पर केंद्रित है। फिर भी मूल क्रिया नैतिक अर्थ भी रख सकती है, इसलिए उस वास्तविक अस्पष्टता को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और संक्षिप्त रूप। ‘मैं तो’ मूल सर्वनाम के बल को और ‘फिर’ प्रश्न की निष्कर्षसूचकता को व्यक्त करता है।
