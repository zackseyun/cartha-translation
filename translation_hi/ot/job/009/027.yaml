  text: If I say[a], ‘I will forget my complaint[b]; I will put aside my sad face and be cheerful,’
translation:
  language: hi
  text: यदि मैं कहूँ, “मैं अपनी शिकायत[a] भूल जाऊँगा; मैं अपने चेहरे से उदासी हटाकर प्रसन्न हो जाऊँगा[b],”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने मन की बात” अथवा “अपने मनन को।” इब्रानी शब्द भीतरी बातचीत, मनन या शिकायत का अर्थ दे सकता है; यहाँ विलाप के संदर्भ में “शिकायत” अधिक उपयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “मैं अपना चेहरा छोड़ दूँगा और खिल उठूँगा।” यह उदास मुखभाव को छोड़कर प्रसन्न होने का प्रयत्न करने के लिए प्रयुक्त अभिव्यक्ति है।
    reason: cultural_note
lexical_decisions:
- source_word: אִם אָמְרִי
  choice: यदि मैं कहूँ
  rationale: אִם यहाँ काल्पनिक शर्त प्रस्तुत करता है, और उसके बाद का पूर्ण क्रियारूप इस संदर्भ में संभाव्य कथन व्यक्त करता है। हिंदी का संभावनार्थक ‘यदि मैं कहूँ’ इस भाव को स्वाभाविक रूप से रखता है।
- source_word: אֶשְׁכְּחָה
  choice: मैं ... भूल जाऊँगा
  rationale: प्रथम पुरुष का यह रूप अय्यूब के प्रस्तावित संकल्प को व्यक्त करता है; भविष्यकालीन वाक्यांश उसकी कही हुई मंशा की प्रत्यक्षता बनाए रखता है।
- source_word: שִׂיחִי
  choice: अपनी शिकायत
  rationale: שִׂיח यहाँ केवल तटस्थ मनन नहीं, बल्कि दुःख से उपजी भीतरी वाणी या शिकायत का बोध कराता है। विलाप के संदर्भ में ‘शिकायत’ सबसे उपयुक्त है।
- source_word: אֶעֶזְבָה פָנַי
  choice: मैं अपने चेहरे से उदासी हटाकर
  rationale: शाब्दिक रूप ‘मैं अपना चेहरा छोड़ दूँगा’ हिंदी में अस्वाभाविक और भ्रामक होगा। संदर्भ में यह अपने उदास मुखभाव को छोड़ने का मुहावरा है; चुना हुआ अनुवाद उसी अर्थ को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: וְאַבְלִיגָה
  choice: प्रसन्न हो जाऊँगा
  rationale: בלג यहाँ शोक के कम होने, मुखमंडल के खिलने या स्वयं को सँभालकर प्रसन्न दिखने का भाव देता है। ‘प्रसन्न हो जाऊँगा’ सहज हिंदी में इसका भावात्मक परिणाम व्यक्त करता है।
