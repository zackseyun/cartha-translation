  - marker: b
    text: 'या, “मैंने कहा है।” इब्रानी पूर्णकालिक क्रिया को प्रसंग के अनुसार वर्तमान कथन या पहले से कहे गए कथन के रूप में समझा जा सकता है। एक अन्य सम्भव पाठार्थ में अगला वाक्य अधिक निर्वैयक्तिक होगा: “यह निर्दोष और दुष्ट—दोनों को नाश कर देता है।”'
