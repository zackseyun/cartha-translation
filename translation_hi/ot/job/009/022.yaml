lexical_decisions:
- source_word: אַחַת הִיא
  choice: सबका एक ही हाल है
  rationale: यह मुहावरा केवल संख्या ‘एक’ नहीं, बल्कि परिणाम में भेद न रहने का भाव व्यक्त करता है। हिंदी में यह वाक्य अय्यूब के इस कटु निष्कर्ष को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עַל כֵּן
  choice: इसलिए
  rationale: यह पिछले कथन से निकले निष्कर्ष को स्पष्ट और सहज हिंदी में जोड़ता है।
- source_word: אָמַרְתִּי
  choice: मैं कहता हूँ
  rationale: यद्यपि इब्रानी रूप पूर्णकाल है, प्रसंग में यह अय्यूब द्वारा अभी व्यक्त किए जा रहे निष्कर्ष का परिचायक हो सकता है। पूर्णकालिक विकल्प फुटनोट में रखा गया है।
- source_word: תָּם
  choice: निर्दोष
  rationale: यह चरित्र की खराई और दोषरहितता को दर्शाता है, न कि निरपेक्ष पापहीन सिद्धता को। ‘निर्दोष’ सामान्य हिंदी में इस विरोधी युग्म को स्पष्ट रखता है।
- source_word: רָשָׁע
  choice: दुष्ट
  rationale: यह नैतिक रूप से दोषी व्यक्ति के लिए मानक हिंदी शब्द है और ‘निर्दोष’ के साथ स्वाभाविक विरोध बनाता है।
- source_word: הוּא מְכַלֶּה
  choice: वह ... अंत कर देता है
  rationale: पुल्लिंग एकवचन सर्वनाम और कृदंत का सबसे स्वाभाविक संदर्भ प्रसंग में परमेश्वर है। ‘अंत कर देता है’ כלה की समाप्त या नष्ट कर देने वाली शक्ति को गरिमापूर्ण, सहज हिंदी में व्यक्त करता है।
theological_decisions:
- issue: ‘वह अंत कर देता है’ का अंतर्निहित कर्ता
  choice: ‘वह’ को व्यक्तिगत कर्ता के रूप में रखा गया है, जो प्रसंग में परमेश्वर की ओर संकेत करता है।
  alternative: 'वाक्य को अधिक निर्वैयक्तिक रूप में समझना: ‘यह निर्दोष और दुष्ट—दोनों का अंत कर देता है।’'
  rationale: अय्यूब 9 में चर्चा परमेश्वर की शासन-सत्ता और प्रबल सामर्थ्य की है, इसलिए व्यक्तिगत कर्ता अधिक स्वाभाविक है। फिर भी इब्रानी अभिव्यक्ति में कुछ संदिग्धता होने के कारण निर्वैयक्तिक विकल्प फुटनोट में सुरक्षित रखा गया है। अय्यूब की कठोर शिकायत को नरम नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी; भाषा सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘सबका एक ही हाल’ परिणाम की समानता व्यक्त करता है, जबकि मुख्य पाठ में परमेश्वर की ओर संकेत करने वाले ‘वह’ को बनाए रखकर अय्यूब की धर्मवैचारिक शिकायत और तनाव को यथावत रखा गया है।
