  text: who does great things beyond searching out[b][a], and wonders beyond number.
translation:
  language: hi
  text: जो ऐसे महान काम करता है जिनकी थाह नहीं पाई जा सकती[a], और ऐसे अद्भुत काम जो गिनती से परे हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिनका पता नहीं लगाया जा सकता।” इब्रानी मुहावरे का अर्थ है कि उसके महान कामों की पूरी तरह जाँच नहीं की जा सकती और न उन्हें पूरी तरह समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “जिनकी कोई गिनती नहीं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֶׂה
  choice: जो ... करता है
  rationale: यह क़ाल कृदंत पिछले संदर्भ में परमेश्वर का वर्णन करता है। हिन्दी में संबंधवाचक प्रयोग ‘जो ... करता है’ इसके वर्णनात्मक और निरंतर भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: גְדֹלוֹת
  choice: महान काम
  rationale: स्त्रीलिंग बहुवचन विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है। ‘महान काम’ अर्थ को व्यापक रखता है और सामर्थी कार्यों का भाव भी देता है।
- source_word: עַד אֵין חֵקֶר
  choice: जिनकी थाह नहीं पाई जा सकती
  rationale: यह इब्रानी मुहावरा ऐसे कार्यों को दर्शाता है जिनकी पूरी जाँच या समझ मनुष्य की पहुँच से बाहर है। ‘थाह नहीं पाई जा सकती’ आधुनिक हिन्दी में इस अगम्यता को सहज ढंग से व्यक्त करता है।
- source_word: וְנִפְלָאוֹת
  choice: और ऐसे अद्भुत काम
  rationale: נפלאות असाधारण और विस्मय उत्पन्न करने वाले कार्यों को दर्शाता है। ‘अद्भुत काम’ सामान्य पाठक के लिए स्पष्ट और स्वाभाविक है।
- source_word: עַד אֵין מִסְפָּר
  choice: जो गिनती से परे हैं
  rationale: इस पदबंध का अर्थ है कि उन कार्यों की संख्या नहीं गिनी जा सकती। यह चयन पहली पंक्ति के समानांतर ढाँचे को बनाए रखता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। पद पिछले संदर्भ से जुड़ा संबंधवाचक वाक्यांश है; इसलिए आरम्भ में ‘जो’ रखा गया है। दोनों समानांतर अंशों में परमेश्वर के कामों की अगम्यता और अगणनीयता सुरक्षित रखी गई है।
