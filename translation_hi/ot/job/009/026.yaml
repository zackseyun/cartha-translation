  yaml_path: translation/ot/job/009/026.yaml
  text: They pass by like reed boats, like an eagle swooping on prey.
translation:
  language: hi
  text: वे सरकंडे की नावों के समान निकल जाते हैं[a], जैसे उकाब अपने शिकार पर झपटता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “सरकंडे की नावों” के लिए आया इब्रानी पद दुर्लभ है; इसका ठीक अर्थ अनिश्चित है। इसे “पपीरस की नावें” भी समझा जाता है।
    reason: दुर्लभ शब्द אֵבֶה की वास्तविक शाब्दिक अनिश्चितता को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: אֳנִיּוֹת אֵבֶה
  choice: सरकंडे की नावों
  rationale: אֳנִיּוֹת का अर्थ ‘नावें’ है; दुर्लभ אֵבֶה को प्राचीन, हल्की सरकंडे अथवा पपीरस की नावों के संकेत के रूप में लिया गया है। हिंदी में ‘सरकंडे की नावें’ स्वाभाविक और सामान्य पाठक के लिए स्पष्ट है।
- source_word: נֶשֶׁר
  choice: उकाब
  rationale: यह शब्द बड़े शिकारी अथवा मृतभक्षी पक्षी के लिए प्रयुक्त हो सकता है; यहाँ शिकार पर तीव्रता से झपटने की उपमा के कारण ‘उकाब’ प्रसंगानुकूल है।
- source_word: יָטוּשׂ עֲלֵי אֹכֶל
  choice: अपने शिकार पर झपटता है
  rationale: शाब्दिक भाव ‘भोजन पर तेजी से टूट पड़ना’ है; शिकारी पक्षी के प्रसंग में ‘शिकार पर झपटना’ वही चित्र स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: חָלְפוּ עִם
  choice: के समान निकल जाते हैं
  rationale: חָלְפוּ बीतने या निकल जाने को व्यक्त करता है। עִם सामान्यतः ‘के साथ’ है, पर यहाँ समानांतर उपमा और गति के काव्यात्मक संदर्भ में ‘के समान’ अर्थ ग्रहण किया गया है।
