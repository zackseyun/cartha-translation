  yaml_path: translation/ot/job/009/035.yaml
  text: Then I would speak and not fear him[a], for I am not so in myself.
translation:
  language: hi
  text: तब मैं बोलता और उससे नहीं डरता, क्योंकि मैं अपने आप में ऐसा नहीं हूँ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थ संभवतः, “क्योंकि मेरे साथ ऐसा नहीं है,” या “क्योंकि अपनी वर्तमान दशा में मैं ऐसा नहीं हूँ।” अधिक शाब्दिक रूप है, “क्योंकि अपने साथ मैं ऐसा नहीं हूँ।” इब्रानी में अंतिम उपवाक्य संक्षिप्त और अस्पष्ट है।
    reason: मूल इब्रानी के संक्षिप्त अंतिम उपवाक्य के वैकल्पिक अर्थ स्पष्ट करना।
lexical_decisions:
- source_word: אַדַבְּרָה
  choice: तब मैं बोलूँगा
  rationale: प्रथम पुरुष एकवचन का यह रूप प्रसंग में इच्छा अथवा काल्पनिक संकल्प व्यक्त करता है। पिछले पदों पर इसकी निर्भरता दिखाने के लिए ‘तब’ जोड़ा गया है।
- source_word: וְלֹא אִירָאֶנּוּ
  choice: और उससे नहीं डरूँगा
  rationale: क्रिया ירא के साथ तृतीय पुरुष पुल्लिंग एकवचन प्रत्यय का सीधा अर्थ ‘उससे डरना’ है; हिंदी में भविष्यत् रूप पहले खंड के काल्पनिक संकल्प के अनुरूप है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण प्रस्तुत करता है।
- source_word: לֹא כֵן
  choice: ऐसा नहीं
  rationale: यह संक्षिप्त और तुलना-सूचक पदबंध है; ‘ऐसा नहीं’ उसकी अस्पष्टता को अनावश्यक रूप से खोले बिना स्वाभाविक हिंदी देता है।
- source_word: אָנֹכִי עִמָּדִי
  choice: अपने आप में मैं
  rationale: אָנֹכִי बलयुक्त ‘मैं’ है और עִמָּדִי का शाब्दिक अर्थ ‘मेरे साथ’ है। ‘अपने आप में मैं’ मूल की आत्म-संदर्भी, किंतु असामान्य और संक्षिप्त अभिव्यक्ति को सुरक्षित रखता है।
theological_decisions:
- issue: अंतिम उपवाक्य का संक्षिप्त और अस्पष्ट अर्थ
  choice: क्योंकि अपने आप में मैं ऐसा नहीं हूँ
  alternative: क्योंकि मेरे साथ ऐसी बात नहीं है; क्योंकि अपनी वर्तमान दशा में मैं ऐसा नहीं हूँ
  rationale: इब्रानी वाक्यांश अत्यंत संक्षिप्त है और यह स्पष्ट नहीं करता कि ‘ऐसा’ किस दशा या संबंध को सूचित करता है। मुख्य पाठ इस तनाव को बनाए रखता है; पादटिप्पणी अधिक सहज संभावनाएँ बताती है, पर किसी एक मनोवैज्ञानिक या धर्मवैज्ञानिक अर्थ को निर्णायक नहीं बनाती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। अंतिम वाक्यांश की कुछ असामान्यता जानबूझकर बचाई गई है, क्योंकि मूल इब्रानी भी संक्षिप्त और अस्पष्ट है।
