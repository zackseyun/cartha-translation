lexical_decisions:
- source_word: חֲכַם לֵבָב
  choice: हृदय से बुद्धिमान
  rationale: ‘हृदय’ के इब्रानी बिंब को बनाए रखता है; यहाँ हृदय बुद्धि और इच्छा का केंद्र है। यह अभिव्यक्ति आधुनिक हिन्दी में भी स्वाभाविक और काव्यात्मक है।
- source_word: וְאַמִּיץ כֹּחַ
  choice: और सामर्थ्य में प्रबल
  rationale: אַמִּיץ और כֹּחַ की बल-संबंधी जोरदार युग्म-अभिव्यक्ति को गरिमापूर्ण हिन्दी में सुरक्षित रखता है।
- source_word: מִי
  choice: किसने
  rationale: मूल के आलंकारिक प्रश्न को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הִקְשָׁה
  choice: हठ किया
  rationale: हिफ़ईल रूप यहाँ अपने को कठोर बनाकर अड़ जाने या हठपूर्वक विरोध करने का भाव देता है। ‘हठ किया’ उस नैतिक और विरोधी भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: אֵלָיו
  choice: उसके विरुद्ध
  rationale: इस मुहावरे में संबंधवाचक शब्द विरोध की दिशा दर्शाता है, केवल ‘उसकी ओर’ नहीं।
- source_word: וַיִּשְׁלָם
  choice: और सुखी-सलामत रहा
  rationale: שלם से निकला यह रूप यहाँ साबुत, अहानिकर या कुशलपूर्वक बचे रहने का परिणाम सूचित कर सकता है। ‘सुखी-सलामत रहा’ इस अर्थ को स्पष्ट रखता है और केवल भौतिक समृद्धि तक सीमित नहीं करता।
theological_decisions:
- issue: आरंभिक कथन का निहित कर्ता
  choice: ‘वह’ को प्रसंग के अनुसार परमेश्वर के लिए समझा गया है।
  alternative: कर्ता को बिना सर्वनाम के निहित छोड़ना।
  rationale: इब्रानी में आरंभिक विशेषणों का स्पष्ट कर्ता नहीं है, पर अय्यूब के आसपास के कथन में संदर्भ परमेश्वर का है। हिन्दी वाक्य की स्पष्टता के लिए ‘वह’ जोड़ना कोई नया धर्मवैज्ञानिक दावा नहीं करता।
- issue: וַיִּשְׁלָם का परिणामार्थ
  choice: सुखी-सलामत रहा
  alternative: सफल हुआ / समृद्ध हुआ
  rationale: मूल क्रिया सफल होने के साथ साबुत या अहानिकर निकल आने का अर्थ भी दे सकती है। मुख्य पाठ में व्यापक जीवन-रक्षा का भाव रखा गया है और अन्य संभावना पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘हृदय’ मूल बिंब को सुरक्षित रखता है, जबकि ‘हठ किया’ और ‘सुखी-सलामत रहा’ सामान्य पाठक के लिए सहज हैं।
