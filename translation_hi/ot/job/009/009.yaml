  text: जिसने सप्तर्षि-मंडल[a], ओरायन, कृत्तिका और दक्षिण के कक्ष[b] बनाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘सप्तर्षि-मंडल’ एक इब्रानी नक्षत्र-नाम का अनुवाद है; इसकी ठीक पहचान निश्चित नहीं है। इसे ‘भालू तारामंडल’ भी समझा जाता है, और पुराने अनुवादों में कभी-कभी ‘अरक्तूरुस’ मिलता है।
    reason: alternative_reading
  - marker: b
    text: ‘दक्षिण के कक्ष’ संभवतः दक्षिणी आकाश के छिपे हुए प्रदेशों या तारामंडलों के लिए प्रयुक्त काव्यात्मक अभिव्यक्ति है।
    reason: cultural_note
lexical_decisions:
- source_word: עֹשֶׂה
  choice: जिसने … बनाए
  rationale: यह עשה का काल कृदन्त है और पिछले पद से परमेश्वर का वर्णन आगे बढ़ाता है। सृष्टि के कार्य के संदर्भ में पूर्ण क्रिया स्वाभाविक है, जबकि जारी या सामान्य क्रिया का अर्थ भी व्याकरणतः संभव है।
- source_word: עָשׁ
  choice: सप्तर्षि-मंडल
  rationale: यह किसी नक्षत्र-मंडल का नाम है, जिसे सामान्यतः भालू तारामंडल, विशेषतः सप्तर्षि-मंडल, से जोड़ा जाता है। आधुनिक हिन्दी पाठक के लिए सप्तर्षि-मंडल सबसे परिचित खगोलीय नाम है; पहचान की अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: כְּסִיל
  choice: मृगशिरा
  rationale: खगोलीय संदर्भ में इसे सामान्यतः ओरायन तारामंडल माना जाता है। हिन्दी की पारंपरिक और परिचित संज्ञा ‘मृगशिरा’ चुनी गई है।
- source_word: כִימָה
  choice: कृत्तिका
  rationale: यह सामान्यतः प्लेयडीज़ तारागुच्छ माना जाता है। हिन्दी में इसका प्रचलित पारंपरिक नाम ‘कृत्तिका’ है।
- source_word: חַדְרֵי תֵמָן
  choice: दक्षिण के कक्ष
  rationale: शाब्दिक अर्थ ‘दक्षिण के भीतरी कक्ष’ है। काव्यात्मक आकाशीय बिंब को बनाए रखने और इसे निश्चित रूप से दक्षिणी तारामंडलों तक सीमित न करने के लिए ‘कक्ष’ रखा गया है।
