lexical_decisions:
- source_word: אֲשֶׁר
  choice: जो
  rationale: यह संबंधवाचक सर्वनाम पिछले संदर्भ में परमेश्वर के वर्णन को आगे बढ़ाता है; हिन्दी में ‘जो’ स्वाभाविक और संक्षिप्त है।
- source_word: בִּשְׂעָרָה
  choice: आँधी में
  rationale: שְׂעָרָה आँधी, तूफ़ान या बवंडर को सूचित करता है। ב स्थान, रीति या साधन व्यक्त कर सकता है; ‘आँधी में’ चित्रात्मकता बनाए रखते हुए इस अस्पष्टता को अनावश्यक रूप से सीमित नहीं करता।
- source_word: יְשׁוּפֵנִי
  choice: मुझे कुचल देता है
  rationale: दुर्लभ क्रिया שׁוף यहाँ गंभीर चोट पहुँचाने का भाव रखती है और अगले खंड के ‘घाव’ के समानांतर उपयुक्त बैठती है। ‘कुचल देता है’ उसकी तीव्रता व्यक्त करता है; ‘चोट पहुँचाता है’ भी संभव है।
- source_word: וְהִרְבָּה
  choice: बढ़ाता जाता है
  rationale: רבה का हिफ़ील रूप बहुत करने या बढ़ाने का अर्थ देता है। ‘बढ़ाता जाता है’ हिन्दी में घावों की निरंतर वृद्धि का काव्यात्मक और स्वाभाविक भाव देता है।
- source_word: פְצָעַי
  choice: मेरे घाव
  rationale: פצע का सीधा अर्थ घाव या चोट है; इस काव्यात्मक संदर्भ में ‘घाव’ सर्वाधिक सटीक और सहज है।
- source_word: חִנָּם
  choice: बिना कारण
  rationale: חִנָּם अकारण, मुफ्त में या व्यर्थ का अर्थ दे सकता है। ‘बिना कारण’ अय्यूब की शिकायत की नैतिक और न्यायिक धार बनाए रखता है।
theological_decisions:
- issue: क्या חִנָּם अय्यूब की पूर्ण नैतिक निर्दोषता का दावा है या उसके अनुभव में अयोग्य दुःख की शिकायत
  choice: ‘बिना कारण’ कहकर शिकायत को उसकी पूरी शक्ति के साथ रहने देना
  alternative: ‘बिना किसी वजह’ या ‘मेरे योग्य हुए बिना’
  rationale: पद स्वयं इस तनाव का समाधान नहीं करता। अनुवाद को न अय्यूब के विरोध को नरम करना चाहिए, न परमेश्वर के न्याय के बारे में कोई बाहरी धर्मसैद्धांतिक निष्कर्ष जोड़ना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और काव्यात्मक रूप। ‘आँधी’, ‘कुचल देता है’ और ‘घाव’ मूल की तीव्र छवि बनाए रखते हैं; ‘बिना कारण’ अय्यूब की शिकायत में निहित धर्मवैचारिक तनाव को बिना व्याख्यात्मक नरमी के सुरक्षित रखता है।
