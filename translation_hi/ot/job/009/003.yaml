  yaml_path: translation/ot/job/009/003.yaml
  text: If one wished to contend with him[b][a], he could not answer him one time out of a thousand.
translation:
  language: hi
  text: यदि कोई उससे वाद-विवाद करना चाहे,[a] तो वह उसे हज़ार में से एक बार भी उत्तर न दे सकेगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उससे विवाद करना चाहे” अथवा “उसके विरुद्ध मुक़दमा चलाना चाहे।” इब्रानी क्रिया में सामान्य विवाद और कानूनी वाद—दोनों का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “वह उसे हज़ार में से एक का भी उत्तर न दे सकेगा।” आशय है कि वह हज़ार में एक बार भी उसे उत्तर देने में समर्थ नहीं होगा।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: यदि
  rationale: यह शर्तसूचक उपवाक्य आरम्भ करता है; संदर्भ में ‘यदि’ सबसे सीधा और स्वाभाविक है।
- source_word: יַחְפֹּץ
  choice: चाहे
  rationale: חפץ इच्छा या तत्परता व्यक्त करता है; काल्पनिक शर्त में ‘चाहे’ सहज है और आनंद लेने का अनावश्यक भाव नहीं जोड़ता।
- source_word: לָרִיב
  choice: मुक़दमा लड़ना
  rationale: ריב विवाद करने के साथ न्यायिक वाद का भाव भी रखता है। यहाँ परमेश्वर से उत्तर माँगने के प्रसंग में यह कानूनी छाया स्वाभाविक रूप से व्यक्त होती है।
- source_word: עִמּוֹ
  choice: उससे
  rationale: शाब्दिक अर्थ ‘उसके साथ’ है, पर विवाद अथवा मुक़दमे के प्रसंग में आधुनिक हिन्दी में ‘उससे’ स्वाभाविक प्रतिपक्ष-संबंध व्यक्त करता है।
- source_word: לֹא יַעֲנֶנּוּ
  choice: वह ... उत्तर उसे न दे सकेगा
  rationale: ענה का अर्थ ‘उत्तर देना’ है। संदर्भ साधारण अनिच्छा नहीं, बल्कि मनुष्य की असमर्थता दिखाता है; हिन्दी की पद-व्यवस्था विषय और कर्म-सर्वनामों का संदर्भ बनाए रखती है।
- source_word: אַחַת מִנִּי אָלֶף
  choice: हज़ार बातों में से एक का भी
  rationale: यह अत्यधिक विषमता बताने वाला मुहावरा है। ‘एक का भी’ मूल की नकारात्मक प्रबलता रखता है, और ‘बातों’ से उत्तर दिए जाने योग्य प्रश्नों या दावों का निहित अर्थ सहज बनता है।
theological_decisions:
- issue: पद में सर्वनामों का संदर्भ
  choice: पहला व्यक्ति-सूचक सर्वनाम किसी मनुष्य और दूसरा परमेश्वर की ओर संकेत करता समझा गया है, पर मुख्य पाठ में ‘कोई’ और ‘उस’ ही रखे गए हैं।
  alternative: इसे दो सामान्य मानवीय पक्षों के बीच विवाद मानना।
  rationale: अय्यूब 9:2-4 का निकट संदर्भ परमेश्वर की बुद्धि और सामर्थ्य की चर्चा करता है। फिर भी मूल इब्रानी इस पद में ‘परमेश्वर’ संज्ञा दोहराता नहीं, इसलिए अनुवाद ने उसे स्पष्ट रूप से जोड़कर अर्थ को बंद नहीं किया।
- issue: לֹא יַעֲנֶנּוּ में इच्छा या सामर्थ्य
  choice: ‘उत्तर ... न दे सकेगा’—असमर्थता
  alternative: ‘उत्तर न देगा’—भविष्य या अनिच्छा
  rationale: परमेश्वर से विवाद में मनुष्य की स्थिति और ‘हज़ार में से एक भी’ का अतिशयोक्तिपूर्ण कथन यहाँ असमर्थता को अधिक संभावित बनाते हैं, यद्यपि इब्रानी क्रियारूप अपने आप में केवल सामर्थ्य-सूचक नहीं है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘मुक़दमा लड़ना’ कानूनी छाया को स्पष्ट करता है, जबकि पादटिप्पणी व्यापक ‘विवाद’ वाले अर्थ को सुरक्षित रखती है। ‘मुक़दमा’ में प्रचलित नुक्ता-वर्तनी अपनाई गई है।
