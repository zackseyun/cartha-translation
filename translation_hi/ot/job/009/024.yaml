source:
  edition: WLC
  text: אֶ֤רֶץ נִתְּנָ֬ה בְֽ/יַד רָשָׁ֗ע פְּנֵֽי שֹׁפְטֶ֥י/הָ יְכַסֶּ֑ה אִם לֹ֖א אֵפ֣וֹא מִי הֽוּא׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/024.yaml
  text: The earth is given into the hand of the wicked[a]; he covers the faces of its judges. If not[b], then who is it?
translation:
  language: hi
  text: 'पृथ्वी दुष्ट के हाथ में दे दी गई है[a];


    कोई उसके न्यायियों के चेहरे ढक देता है।


    यदि नहीं, तो फिर कौन है?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “देश एक दुष्ट मनुष्य के हाथ में दे दिया गया है।” इब्रानी אֶרֶץ का अर्थ “पृथ्वी” या “देश/भूमि” हो सकता है, और רָשָׁע किसी एक “दुष्ट मनुष्य” अथवा सामान्य रूप से “दुष्ट” को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “ढक देता है” का कर्ता स्पष्ट नहीं किया गया है। इसका संकेत परमेश्वर, दुष्ट शासक या किसी अनिर्दिष्ट कर्ता की ओर हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: אֶרֶץ
  choice: पृथ्वी
  rationale: यह शब्द ‘पृथ्वी’ या ‘देश/भूमि’ दोनों अर्थ दे सकता है। इस प्रसंग में अय्यूब संसार में फैले अन्याय की व्यापक व्यवस्था की बात करता जान पड़ता है, इसलिए मुख्य पाठ में ‘पृथ्वी’ रखा गया है; दूसरा अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: נִתְּנָה
  choice: दे दी गई है
  rationale: निफ़अल पूर्ण रूप निष्क्रिय क्रिया व्यक्त करता है। ‘दे दी गई है’ भूतकालीन कार्य से उत्पन्न वर्तमान स्थिति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְיַד
  choice: के हाथ में
  rationale: यह किसी के अधिकार या वश में सौंपे जाने का इब्रानी मुहावरा है। ‘हाथ में’ मूल बिंब को बनाए रखते हुए हिन्दी में भी स्पष्ट है।
- source_word: רָשָׁע
  choice: दुष्ट
  rationale: एकवचन विशेषण किसी एक दुष्ट व्यक्ति अथवा जातिवाचक रूप में दुष्ट जन का संकेत कर सकता है। हिन्दी का ‘दुष्ट’ इसी संक्षिप्तता और संभावित व्यापकता को बनाए रखता है।
- source_word: פְּנֵי שֹׁפְטֶיהָ
  choice: उसके न्यायियों के चेहरे
  rationale: शाब्दिक बिंब ‘चेहरे’ और पद ‘न्यायियों’ को रखा गया है। ‘उसके’ का संबंध पृथ्वी से है और हिन्दी में यह स्वाभाविक है।
- source_word: יְכַסֶּה
  choice: वह ... ढक देता है
  rationale: पिअेल अपूर्ण, पुल्लिंग एकवचन का सीधा अर्थ ‘वह ढकता है’ है। कर्ता मूल पाठ में व्यक्त नहीं है; ‘वह’ व्याकरणिक रूप को रखते हुए उसकी पहचान तय नहीं करता।
- source_word: אִם לֹא אֵפוֹא מִי הוּא
  choice: यदि नहीं, तो फिर कौन है?
  rationale: यह आलंकारिक चुनौती है। ‘तो फिर’ אֵפוֹא के बल को व्यक्त करता है, जबकि ‘यदि नहीं’ कोई ऐसा पूर्वपद नहीं जोड़ता जो इब्रानी में स्पष्ट रूप से मौजूद नहीं है।
theological_decisions:
- issue: ‘वह ढक देता है’ के निहित कर्ता और अंतिम प्रश्न में संकेतित व्यक्ति की पहचान
  choice: कर्ता की पहचान खुली रखी गई है।
  alternative: कर्ता को स्पष्ट रूप से परमेश्वर, दुष्ट शासक, अथवा किसी अनिर्दिष्ट शक्ति के रूप में बताना।
  rationale: प्रसंग में अय्यूब की बात परमेश्वर की अंतिम प्रभुता की ओर संकेत कर सकती है, पर इब्रानी वाक्य स्वयं יְכַסֶּה का कर्ता नहीं बताता। इसलिए अनुवाद धर्मवैज्ञानिक तनाव को सुलझाने के बजाय सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। काव्यात्मक पंक्ति-विन्यास मूल कथन की तीव्रता को उभारता है। ‘हाथ में’ और ‘चेहरे ढक देता है’ जैसे ठोस इब्रानी बिंब सुरक्षित रखे गए हैं, पर अस्पष्ट कर्ता की पहचान व्याख्यात्मक रूप से निर्धारित नहीं की गई।
