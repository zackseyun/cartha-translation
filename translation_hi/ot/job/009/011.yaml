  yaml_path: translation/ot/job/009/011.yaml
  text: Look[a], he passes by me, and I do not see him; he moves on[c][b], and I do not perceive him.
translation:
  language: hi
  text: देखो[a], वह मेरे पास से गुजरता है, पर मैं उसे नहीं देखता; वह आगे निकल जाता है[b], पर मैं उसे नहीं पहचानता[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘निश्चय ही’।
    reason: lexical_alternative
  - marker: b
    text: या ‘वह निकल जाता है’।
    reason: lexical_alternative
  - marker: c
    text: या ‘मैं उसे समझता नहीं’; इब्रानी शब्द पहचानने, विवेक से जानने या समझने का अर्थ दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: देखो
  rationale: यह विस्मय और ध्यान आकर्षित करने वाला उद्गार है। ‘देखो’ आधुनिक हिन्दी में इसकी सजीव और बलात्मकता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יַעֲבֹר עָלַי
  choice: मेरे पास से होकर निकलता है
  rationale: עבר के साथ על यहाँ अय्यूब के निकट से होकर गुजरने की गति व्यक्त करता है। यह अनुवाद ‘मेरे ऊपर’ का अनावश्यक भौतिक संकेत दिए बिना निकटता और अगोचरता बनाए रखता है।
- source_word: וְלֹא אֶרְאֶה
  choice: पर मैं उसे देख नहीं पाता
  rationale: नकार सहित ראה का सीधा अर्थ देखने का अभाव है। हिन्दी में ‘देख नहीं पाता’ प्रसंग की अगोचरता को स्वाभाविक रूप से व्यक्त करता है, यद्यपि इब्रानी में असमर्थता अलग से नहीं कही गई।
- source_word: יַחֲלֹף
  choice: आगे बढ़ जाता है
  rationale: חלף के गुजर जाने या आगे निकल जाने के भाव को व्यक्त करता है और पहले गति-सूचक क्रिया से हल्का भेद रखते हुए काव्यात्मक समानांतरता बनाए रखता है।
- source_word: אָבִין לוֹ
  choice: मैं उसे पहचान नहीं पाता
  rationale: בין समझने, भेद जानने या पहचानने का अर्थ दे सकता है। यहाँ दिखाई न देने के समानांतर ‘पहचान’ उसकी उपस्थिति को ग्रहण या discern करने का स्वाभाविक हिन्दी भाव देता है; ‘समझना’ भी संभव है।
theological_decisions:
- issue: तीसरे पुरुष के कर्ता और सर्वनाम का संदर्भ
  choice: ‘वह/उसे’ से परमेश्वर का संदर्भ, पर इस पद में नाम स्पष्ट रूप से नहीं जोड़ा गया
  alternative: किसी अनिश्चित व्यक्ति या सत्ता का संदर्भ
  rationale: निकटवर्ती प्रसंग (अय्यूब 9:10–12) परमेश्वर के अगम्य कार्यों का वर्णन करता है। सर्वनाम बनाए रखने से संदर्भ स्पष्ट रहता है और मूल पद में अनुपस्थित उपाधि नहीं जोड़ी जाती।
- issue: אָבִין का बोधात्मक अर्थ
  choice: उसे पहचान नहीं पाता
  alternative: उसे समझ नहीं पाता
  rationale: प्रसंग में परमेश्वर के अगोचर होकर गुजरने का अनुभव प्रमुख है, इसलिए ‘पहचान’ अनुभवजन्य ग्रहण को दर्शाता है; फिर भी इब्रानी क्रिया बौद्धिक समझ का अर्थ भी दे सकती है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, काव्यात्मक किंतु सामान्य पाठक के लिए सहज रूप। दो समानांतर पंक्तियों की गति और परमेश्वर की निकटता के बावजूद उनकी अगोचरता को बनाए रखा गया है।
