translation:
  language: hi
  text: 'वह पहाड़ों को हटा देता है,

    और वे नहीं जानते कि वह अपने क्रोध में उन्हें उलट देता है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמַּעְתִּיק
  choice: हटा देता है
  rationale: हिफ़ील कृदंत किसी वस्तु को उसके स्थान से खिसकाने या हटाने का भाव देता है। यहाँ परमेश्वर की प्रबल सामर्थ्य के संदर्भ में ‘हटा देता है’ स्वाभाविक है; ‘खिसका देता है’ भी संभव है।
- source_word: הָרִים
  choice: पहाड़ों
  rationale: बहुवचन הָרִים का सामान्य और सहज हिन्दी रूप।
- source_word: וְלֹא יָדָעוּ
  choice: उनके जाने बिना
  rationale: मूल में बहुवचन क्रिया का कर्ता पहाड़ हैं। यह रूप पहाड़ों के मानवीकरण को बनाए रखते हुए आधुनिक हिन्दी में सहजता से उनकी अनभिज्ञता व्यक्त करता है।
- source_word: אֲשֶׁר
  choice: अलग स्वतंत्र शब्द के रूप में व्यक्त नहीं
  rationale: इस पद में אֲשֶׁר का संबंध वाक्यगत रूप से कुछ अस्पष्ट है और वह अगली क्रिया को परिस्थिति या परिणाम से जोड़ सकता है। हिन्दी की दो काव्य-पंक्तियों में इस संबंध को बिना अनावश्यक रूप से केवल कालवाचक अर्थ तय किए स्वाभाविक रखा गया है।
- source_word: הֲפָכָם
  choice: उन्हें उलट देता है
  rationale: הפך और बहुवचन कर्मप्रत्यय का सीधा अर्थ ‘उन्हें उलट देना’ है; यह हिंसक परिवर्तन का काव्यात्मक चित्र सुरक्षित रखता है।
- source_word: בְּאַפּוֹ
  choice: अपने क्रोध में
  rationale: אַף का यहाँ मुहावरेदार अर्थ ‘क्रोध’ है। ‘अपने क्रोध में’ परिस्थिति और प्रेरक शक्ति दोनों की छाया बनाए रखता है।
