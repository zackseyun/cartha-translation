  yaml_path: translation/ot/job/009/019.yaml
  text: If it is a matter of strength[a], behold, he is mighty; and if of justice[b], who can summon him?
translation:
  language: hi
  text: यदि बल की बात हो, तो देखो, वह शक्तिशाली है; और यदि न्याय के मामले की बात हो, तो कौन मुझे बुलाएगा?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में क्रिया का प्रत्यय “मुझे” है। क्रिया का सटीक कानूनी अर्थ कठिन है; इसका अर्थ “कौन मुझे [न्याय के लिए] बुलाएगा?” या “कौन मेरे लिए सुनवाई का समय ठहराएगा?” लिया जा सकता है। प्रसंग के आधार पर कुछ लोग इसे “कौन उसे अदालत में बुलाएगा?” के अर्थ में समझते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: לְכֹחַ
  choice: बल की बात
  rationale: לְ यहाँ विचाराधीन क्षेत्र या विषय को दर्शाता है—‘जहाँ तक बल का प्रश्न है।’ यह हिंदी में स्वाभाविक रहते हुए इब्रानी की संक्षिप्त तुलनात्मक रचना को बनाए रखता है।
- source_word: אַמִּיץ
  choice: सामर्थी
  rationale: यह अत्यधिक शक्तिशाली होने का भाव देता है। ‘बल’ की पुनरावृत्ति से बचते हुए ‘सामर्थी’ पद की गरिमा और जोर को रखता है।
- source_word: הִנֵּה
  choice: देखो
  rationale: ध्यान खींचने वाले इस अव्यय का आलंकारिक जोर आधुनिक, सहज हिंदी में सुरक्षित रहता है।
- source_word: לְמִשְׁפָּט
  choice: न्याय की बात
  rationale: מִשְׁפָּט यहाँ न्याय के साथ न्यायिक निर्णय या मुकदमे का भी संकेत देता है। मुख्य पाठ में संक्षिप्त ‘न्याय’ रखा गया है और कानूनी विकल्प पाद-टिप्पणी में दिए गए हैं।
- source_word: יוֹעִידֵנִי
  choice: मुझे अदालत में बुलाएगा
  rationale: हिफ़ील रूप יעד न्यायिक संदर्भ में किसी को नियत भेंट या पेशी के लिए बुलाने का अर्थ दे सकता है; प्रत्यय ־נִי स्पष्ट रूप से प्रथम पुरुष एकवचन ‘मुझे’ है। ‘अदालत में’ निहित कानूनी प्रसंग को हिंदी में स्पष्ट करता है।
theological_decisions:
- issue: परमेश्वर के साथ न्यायिक विवाद की अय्यूब की कल्पना
  choice: मसोरेटिक ‘मुझे’ को रखते हुए अदालत में बुलाए जाने की भाषा
  alternative: ‘कौन उसे अदालत में बुलाएगा?’ अथवा ‘कौन मेरे लिए सुनवाई का समय ठहराएगा?’
  rationale: पद का प्रत्यक्ष इब्रानी रूप ‘मुझे’ कहता है, जबकि व्यापक संदर्भ में परमेश्वर को अदालत में बुलाने का विचार भी संभव समझा गया है। मुख्य पाठ स्रोत-रूप को प्राथमिकता देता है और कठिनाई तथा वैकल्पिक समझ को पाद-टिप्पणी में सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘अदालत में बुलाएगा’ आसपास के न्यायिक रूपक को सामान्य पाठक के लिए स्पष्ट करता है; पाद-टिप्पणियाँ इब्रानी की वास्तविक कठिनाई और विकल्पों को बिना किसी धर्मसैद्धांतिक समाधान के बनाए रखती हैं।
