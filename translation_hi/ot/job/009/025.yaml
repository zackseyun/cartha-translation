  text: My days are swifter than a runner[a]; they flee away; they do not see good.
translation:
  language: hi
  text: मेरे दिन धावक से भी तेज़ हैं; वे भाग जाते हैं; वे भलाई[a] नहीं देखते।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “समृद्धि,” “सुख” अथवा “कल्याण।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמַי
  choice: मेरे दिन
  rationale: शाब्दिक संबंधवाचक बहुवचन है और जीवन के दिनों के लिए प्रयुक्त इब्रानी मुहावरे को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: קַלוּ
  choice: तेज़ हैं
  rationale: קלל का यहाँ अर्थ हलका होने से विकसित ‘शीघ्र/तेज़ होना’ है; धावक के साथ तुलना गति को स्पष्ट करती है।
- source_word: מִנִּי רָץ
  choice: धावक से भी
  rationale: מִן तुलनात्मक अर्थ देता है और רָץ किसी दौड़ने वाले व्यक्ति को दर्शाता है; ‘धावक’ संक्षिप्त और स्वाभाविक है, जबकि ‘संदेशवाहक’ अनावश्यक रूप से विशिष्ट होता।
- source_word: בָּרְחוּ
  choice: वे भाग जाते हैं
  rationale: मूल क्रिया भागने या दूर निकल जाने की सजीव गति व्यक्त करती है; बहुवचन कर्ता ‘मेरे दिन’ को बनाए रखा गया है।
- source_word: לֹא רָאוּ
  choice: नहीं देखते
  rationale: नकारयुक्त पूर्ण क्रिया अय्यूब के अनुभव में दिनों के बिना भलाई देखे बीतने को व्यक्त करती है; वर्तमानकालीन हिन्दी इस सामान्य और परिणामसूचक भाव को स्वाभाविक ढंग से देती है।
- source_word: טוֹבָה
  choice: भलाई
  rationale: शब्द का अर्थ व्यापक ‘अच्छाई/भलाई’ है और इसमें समृद्धि, सुख या कुशल भी समा सकते हैं; ‘भलाई’ इस व्यापकता को बिना अधिक विशिष्ट किए सुरक्षित रखता है।
