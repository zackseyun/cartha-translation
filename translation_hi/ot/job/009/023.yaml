  yaml_path: translation/ot/job/009/023.yaml
  text: If a scourge kills suddenly[a], he mocks the calamity of the innocent.
translation:
  language: hi
  text: यदि कोड़ा अचानक प्राण ले ले, तो वह निर्दोषों की दुर्दशा[a] का उपहास करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह निर्दोषों की परीक्षा का उपहास करता है,” अथवा, “वह निर्दोषों के गल जाने का उपहास करता है।” इब्रानी संज्ञा परीक्षा, ढहने, अथवा निराशा की अवस्था का बोध करा सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: यदि
  rationale: यह शर्त या काल्पनिक स्थिति प्रस्तुत करता है; ‘यदि’ मूल कण की सीधी शक्ति बनाए रखता है।
- source_word: שׁוֹט
  choice: कोड़ा
  rationale: मूल शब्द का ठोस अर्थ चाबुक या कोड़ा है और प्रसंग में यह व्यापक विनाशकारी विपत्ति का बिंब भी हो सकता है।
- source_word: יָמִית
  choice: मार डाले
  rationale: מות के हिफ़ील रूप का अर्थ ‘मृत्यु का कारण बनना’ है; यह सहज आधुनिक हिन्दी में घातक क्रिया व्यक्त करता है।
- source_word: פִּתְאֹם
  choice: अचानक
  rationale: मानक क्रियाविशेषणीय अर्थ को संक्षेप और स्वाभाविक रूप में व्यक्त करता है।
- source_word: לְמַסַּת
  choice: दुर्दशा
  rationale: यह दुर्लभ संज्ञा परीक्षा, गल जाने, ढहने या निराशा की ओर संकेत कर सकती है; ‘दुर्दशा’ पीड़ा और पतन की स्थिति को बिना केवल आंतरिक भावना तक सीमित किए व्यक्त करती है।
- source_word: נְקִיִּם
  choice: निर्दोषों
  rationale: उन लोगों को दर्शाता है जो दोष से मुक्त हैं; बहुवचन हिन्दी में मूल बहुवचन को स्पष्ट रखता है।
- source_word: יִלְעָג
  choice: वह ... हँसता है
  rationale: क्रिया का अर्थ उपहास करना या हँसना है; यह तीखे आरोप को स्वाभाविक हिन्दी में रखता है।
theological_decisions:
- issue: ‘वह ... हँसता है’ का कर्ता
  choice: सर्वनाम ‘वह’ रखा गया; प्रसंग में संकेत परमेश्वर की ओर हो सकता है, पर नाम नहीं जोड़ा गया
  alternative: कोड़े को मानवीकृत कर्ता मानना, या अनिश्चित कर्ता लेना
  rationale: इब्रानी में कर्ता स्पष्ट नाम से नहीं दिया गया। अय्यूब 9 के प्रवाह में परमेश्वर संभावित संदर्भ है, पर ‘वह’ मूल की व्याकरणिक और धर्मवैचारिक अस्पष्टता तथा तनाव बनाए रखता है।
- issue: לְמַסַּת का अर्थ
  choice: मुख्य पाठ में ‘दुर्दशा’
  alternative: ‘परीक्षा’, ‘निराशा’ या ‘गलकर मिट जाने’ की दशा
  rationale: दुर्लभ शब्द की अर्थ-सीमा विवादित है। मुख्य पाठ में व्यापक परिस्थिति-सूचक शब्द रखा गया और विकल्प पादटिप्पणी में दिए गए, ताकि अस्पष्टता दबाई न जाए।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘कोड़ा’ मूल बिंब को बनाए रखता है, जबकि पादटिप्पणी दुर्लभ संज्ञा की वास्तविक अर्थगत अनिश्चितता बताती है।
