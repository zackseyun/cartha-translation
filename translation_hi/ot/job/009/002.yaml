  edition: WLC
  text: אָ֭מְנָם יָדַ֣עְתִּי כִי כֵ֑ן וּ/מַה יִּצְדַּ֖ק אֱנ֣וֹשׁ עִם אֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/002.yaml
  text: Truly[a], I know that it is so[b]; but how can a man be righteous before God?
translation:
  language: hi
  text: निश्चय ही, मैं जानता हूँ कि बात ऐसी ही है; पर मनुष्य[b] परमेश्वर के सामने धर्मी[a] कैसे हो सकता है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “न्याय में सही कैसे ठहर सकता है?”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी शब्द दुर्बल और नश्वर मानवता को सूचित करता है; इसका अनुवाद “नश्वर मनुष्य” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמְנָם
  choice: निश्चय ही
  rationale: यह अय्यूब की दृढ़ और गंभीर स्वीकृति को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יָדַעְתִּי
  choice: मैं जानता हूँ
  rationale: इब्रानी सिद्ध रूप यहाँ स्थिर ज्ञान या स्वीकृति बताता है; हिन्दी वर्तमान काल इस भाव को सहज रूप से व्यक्त करता है।
- source_word: כִי כֵן
  choice: कि बात ऐसी ही है
  rationale: यह पिछले कथन की सत्यता की पुष्टि करता है और हिन्दी में संकेतात्मक-पुष्टिकारी बल बनाए रखता है।
- source_word: וּמַה
  choice: पर ... कैसे
  rationale: वाव और प्रश्नवाचक पद यहाँ साधारण संयोजन के बजाय स्वीकृति से प्रश्न की ओर तर्कपूर्ण मोड़ लाते हैं।
- source_word: יִצְדַּק
  choice: धर्मी ... हो सकता है
  rationale: צדק के काल रूप का मूल अर्थ धर्मी या सही होना है। यह अनुवाद न्यायिक संभावना को खुला रखता है, पर बाद की कोई विशिष्ट धर्मसैद्धान्तिक व्याख्या आरोपित नहीं करता।
- source_word: אֱנוֹשׁ
  choice: मनुष्य
  rationale: यह प्रतिनिधिक एकवचन समस्त दुर्बल, नश्वर मानवता को सूचित करता है। ‘मनुष्य’ आधुनिक हिन्दी में स्वाभाविक और समावेशी है; नश्वरता का सूक्ष्म भाव पादटिप्पणी में दिया गया है।
- source_word: עִם אֵל
  choice: परमेश्वर के सामने
  rationale: शाब्दिक अर्थ ‘परमेश्वर के साथ’ है, पर इस तुलनात्मक या न्यायिक प्रसंग में ‘परमेश्वर के सामने’ स्वाभाविक हिन्दी में किसी व्यक्ति की परमेश्वर के संबंध में स्थिति व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के संबंध में मानव के धर्मी होने का न्यायिक अर्थ
  choice: परमेश्वर के सामने धर्मी कैसे हो सकता है?
  alternative: परमेश्वर के साथ न्याय में सही कैसे ठहर सकता है?
  rationale: इब्रानी क्रिया धर्मी होने और न्याय में सही ठहरने—दोनों अर्थच्छायाएँ रखती है। मुख्य पाठ व्यापक अर्थ बनाए रखता है और पद में बाद के किसी विशिष्ट धर्मसैद्धान्तिक तंत्र को नहीं जोड़ता; वैकल्पिक न्यायिक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गंभीर और सामान्य पाठक के लिए सुबोध रखी गई है। ‘निश्चय ही’ अय्यूब की दृढ़ स्वीकृति व्यक्त करता है, जबकि अर्धविराम और ‘पर’ उसके स्वीकार से गहरे प्रश्न की ओर होने वाले मोड़ को स्पष्ट करते हैं।
