- source_word: במו שָׁלֶג
  choice: बर्फ से
  rationale: मूल पाठ बर्फ को धोने के साधन के रूप में रखता है; ‘बर्फ के पानी से’ कहना सम्भावित अर्थ को पाठ में जोड़ देता।
- source_word: וַהֲזִכּוֹתִי
  choice: और ... साफ़ करता
  rationale: हिफ़ील रूप ‘स्वच्छ करना’ व्यक्त करता है; ‘साफ़ करता’ समानांतरता और सहज हिन्दी दोनों बनाए रखता है।
- source_word: בְּבֹר
  choice: क्षार से
  rationale: בֹּר किसी क्षारीय सफ़ाई-पदार्थ को सूचित करता है; ‘क्षार’ आधुनिक साबुन का भ्रामक संकेत दिए बिना अर्थ को सटीक रूप से व्यक्त करता है।
- source_word: כַּפָּי
  choice: अपने हाथ
  rationale: शाब्दिक अर्थ ‘हथेलियाँ’ है, पर धोने के प्रसंग में ‘हाथ’ स्वाभाविक हिन्दी प्रयोग है।
