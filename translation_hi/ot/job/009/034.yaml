  text: יָסֵ֣ר מֵ/עָלַ֣/י שִׁבְט֑/וֹ וְ֝/אֵמָת֗/וֹ אַֽל תְּבַעֲתַֽ/נִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/034.yaml
  text: Let him remove his rod from upon me[a], and let not his terror frighten me.
translation:
  language: hi
  text: वह अपनी छड़ी मुझ पर से हटा ले[a], और उसका आतंक मुझे भयभीत न करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘वह अपनी छड़ी मुझसे दूर कर दे, और उसका भय मुझे आतंकित न करे।’
    reason: शब्दार्थ के वैकल्पिक रूपों को दर्शाने के लिए।
lexical_decisions:
- source_word: יָסֵר
  choice: हटा ले
  rationale: सूर का हिफ़ईल रूप यहाँ इच्छासूचक भाव रखता है; ‘हटा ले’ अय्यूब की इच्छा या विनती को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מֵעָלַי
  choice: मुझ पर से
  rationale: यह शब्दशः ‘मेरे ऊपर से’ का भाव देता है और अय्यूब पर छड़ी के भारी दबाव की इब्रानी छवि को बनाए रखता है।
- source_word: שִׁבְטוֹ
  choice: अपनी छड़ी
  rationale: शेवेट का अर्थ छड़ी, डंडा या राजदंड हो सकता है; दुःख और प्रहार के इस प्रसंग में ‘छड़ी’ सबसे उपयुक्त है।
- source_word: וְאֵמָתוֹ
  choice: और उसका आतंक
  rationale: एमा प्रबल भय या आतंक को दर्शाता है; ‘उसका आतंक’ परमेश्वर से उत्पन्न भयावह दबाव को स्पष्ट रखते हुए मूल की तीव्रता बचाता है।
- source_word: אַל
  choice: न करे
  rationale: अल निषेधात्मक इच्छासूचक भाव देता है; हिन्दी में ‘न करे’ काव्यात्मक और स्वाभाविक है।
- source_word: תְּבַעֲתַנִּי
  choice: मुझे भयभीत करे
  rationale: बाअत का अर्थ आतंकित, भयभीत या स्तब्ध करना है; ‘भयभीत करे’ स्पष्ट आधुनिक हिन्दी है और निकटवर्ती ‘आतंक’ की अनावश्यक पुनरावृत्ति से बचता है।
theological_decisions:
- issue: अन्य पुरुष एकवचन सर्वनामों का संदर्भ
  choice: परमेश्वर के लिए अप्रत्यक्ष संबोधन रखते हुए ‘वह/अपनी/उसका’ का प्रयोग
  alternative: 'प्रत्यक्ष संबोधन: ‘तू अपनी छड़ी मुझ पर से हटा ले, और तेरा आतंक मुझे भयभीत न करे।’'
  rationale: इब्रानी क्रिया और प्रत्यय अन्य पुरुष एकवचन में हैं और इस खंड में अय्यूब के परमेश्वर के विषय में बोलने से मेल खाते हैं। प्रत्यक्ष संबोधन में बदलने के बजाय मूल व्याकरण और उसकी धार्मिक-काव्यात्मक दूरी को सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘मुझ पर से’ इब्रानी स्थानगत छवि को सुरक्षित रखता है; तीसरे पुरुष का प्रयोग जानबूझकर मूल के अनुसार रखा गया है।
