  text: My roots were spread out to the waters[a], and dew stayed overnight on my branches.
translation:
  language: hi
  text: 'मेरी जड़ जल की ओर फैली हुई थी,

    और ओस मेरी डालियों[a] पर रात भर ठहरती थी।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरी फसल में।” यहाँ प्रयुक्त इब्रानी शब्द का सामान्य अर्थ “कटनी” या “फसल” है, पर इस प्रसंग में वह असामान्य है; जड़ और ओस के वनस्पति-बिंब के कारण “डालियों” को मुख्य पाठ में रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁרְשִׁי
  choice: मेरी जड़
  rationale: इब्रानी रूप एकवचन है और उस पर प्रथम पुरुष एकवचन प्रत्यय है; हिन्दी में वृक्ष की ‘जड़’ एकवचन भी स्वाभाविक है और मूल रूप को निकटता से रखता है।
- source_word: פָתוּחַ
  choice: फैली हुई थी
  rationale: निष्क्रिय कृदन्त खुले या विस्तृत होने की अवस्था बताता है; जड़ के साथ ‘फैली हुई’ प्राकृतिक कृषि-बिंब देता है।
- source_word: אֱלֵי מָיִם
  choice: जल की ओर
  rationale: אֱלֵי दिशा या संबंध प्रकट करता है; सामूहिक מָיִם के लिए हिन्दी का ‘जल’ काव्यात्मक और सहज है।
- source_word: וְטַל
  choice: और ओस
  rationale: טַל का सीधा और स्वाभाविक हिन्दी रूप ‘ओस’ है।
- source_word: יָלִין
  choice: रात भर ठहरती थी
  rationale: לון रात बिताने या रात भर बने रहने का अर्थ देता है; यह रूप समय-संबंधी अर्थ को स्पष्ट और काव्यात्मक ढंग से रखता है।
- source_word: בִּקְצִירִי
  choice: मेरी डालियों
  rationale: सामान्य अर्थ ‘मेरी कटनी/फसल’ है, पर जड़ और ओस के वनस्पति-बिंब में शाखाओं या पत्तियों से संबंधित दुर्लभ अर्थ अधिक स्वाभाविक लगता है; अनिश्चितता पाद-टिप्पणी में सुरक्षित है।
