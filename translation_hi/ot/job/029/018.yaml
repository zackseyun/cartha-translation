lexical_decisions:
- source_word: וָאֹמַר
  choice: तब मैंने सोचा
  rationale: शाब्दिक अर्थ ‘तब मैंने कहा’ है, पर यहाँ अय्यूब अपने मन की पूर्व धारणा बता रहा है; आधुनिक हिन्दी में ‘मैंने सोचा’ इस आंतरिक कथन को स्वाभाविक रूप से व्यक्त करता है और क्रमसूचक ‘तब’ को बनाए रखता है।
- source_word: עִם קִנִּי
  choice: अपने घोंसले में
  rationale: עִם का मूल अर्थ ‘साथ’ है, किंतु ‘घोंसले’ के साथ प्रसंगगत भाव अपने सुरक्षित बसेरे में मरने का है। ‘घोंसला’ मूल काव्यात्मक बिंब को सुरक्षित रखता है।
- source_word: אֶגְוָע
  choice: मरूँगा
  rationale: यह क्रिया मरने या प्राण छोड़ने को दर्शाती है; ‘मरूँगा’ स्पष्ट, सहज और मूल के अनुरूप है।
- source_word: וְכַחוֹל
  choice: और रेत के समान
  rationale: חוֹל का सामान्य अर्थ ‘रेत’ है और असंख्यता का परिचित बाइबलीय बिंब बनता है। पक्षी अथवा ‘फीनिक्स’ का अर्थ संभव है, पर अनिश्चित है और पादटिप्पणी में रखा गया है।
- source_word: אַרְבֶּה יָמִים
  choice: अपने दिनों को बढ़ाऊँगा
  rationale: רבה के हिफ़ील रूप का अर्थ बढ़ाना या बहुत करना है। ‘अपने दिनों को बढ़ाऊँगा’ दीर्घ आयु की आशा को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि ‘दिनों’ की मूल अभिव्यक्ति बनाए रखता है।
