lexical_decisions:
- source_word: שָׂרִים
  choice: हाकिम
  rationale: यह शब्द ऊँचे पद और अधिकार वाले लोगों को दर्शाता है। आधुनिक हिन्दी में ‘हाकिम’ पदाधिकारियों और शासक-वर्ग के भाव को स्वाभाविक तथा सजीव रूप से व्यक्त करता है।
- source_word: עָצְרוּ בְמִלִּים
  choice: बोलने से रुक जाते थे
  rationale: עצר यहाँ वाणी रोकने या बोलने से विरत होने का भाव देता है। ‘बोलने से रुक जाते थे’ हिन्दी में सहज है और בְמִלִּים के ‘वचन/बात’ संबंधी अर्थ को समेटता है।
- source_word: וְכַף יָשִׂימוּ
  choice: और ... हाथ रख लेते थे
  rationale: כַּף का मूल अर्थ हथेली/हाथ और שׂים का अर्थ रखना है। हिन्दी के प्रचलित मौन-संकेत में ‘हाथ रख लेना’ स्वाभाविक अभिव्यक्ति है।
- source_word: לְפִיהֶם
  choice: अपने मुँह पर
  rationale: इब्रानी में शाब्दिक रूप से ‘उनके मुँह को/पर’ है। कर्ता के अपने ही मुँह पर हाथ रखने के कारण हिन्दी में निजवाचक ‘अपने’ संबंध को स्पष्ट और स्वाभाविक बनाता है।
