    rationale: The Hebrew says that the young men saw Job and hid/withdrew; it does not explicitly say ‘as soon as’ they saw him.
  - severity: low
    issue: ‘जवान’ and ‘बूढ़े’ are less precise or less dignified in this context.
    rationale: ‘जवान’ can have broader connotations in modern Hindi, while ‘बूढ़े’ may sound blunt. ‘युवा पुरुष’ and ‘वृद्ध’ more closely convey the male, age-based, honor-context contrast.
