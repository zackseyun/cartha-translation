lexical_decisions:
- source_word: רָאוּנִי
  choice: मुझे देखते ही
  rationale: ראה का मूल अर्थ ‘देखना’ है। ‘देखते ही’ अगले कार्य की तत्क्षणता को स्वाभाविक हिन्दी में व्यक्त करता है, बिना कारण जोड़े।
- source_word: נְעָרִים
  choice: जवान
  rationale: पुल्लिंग बहुवचन यहाँ युवा पुरुषों को सूचित करता है। ‘जवान’ सामान्य आधुनिक हिन्दी में सहज और संक्षिप्त है।
- source_word: וְנֶחְבָּאוּ
  choice: पीछे हट जाते थे
  rationale: חבא के निफ़अल का शाब्दिक अर्थ ‘अपने को छिपाना’ हो सकता है; इस सम्मान-संबंधी प्रसंग में ‘पीछे हटना’ अय्यूब की उपस्थिति में संकोचपूर्वक हट जाने का भाव देता है। शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: וִישִׁישִׁים
  choice: बूढ़े
  rationale: ישישים अधिक आयु के पुरुषों को दर्शाता है। ‘बूढ़े’ आयु का सीधा संकेत देता है और ‘पुरनिए/प्राचीन’ की कृत्रिमता तथा ‘प्राचीन’ के पद-सूचक अर्थ से बचता है।
- source_word: קָמוּ
  choice: उठकर
  rationale: קום सम्मान में उठने की आरंभिक क्रिया बताता है; संयुक्त क्रिया ‘उठकर खड़े हो जाते थे’ हिन्दी में दोनों इब्रानी क्रियाओं को स्वाभाविक रूप से सुरक्षित रखती है।
- source_word: עָמָדוּ
  choice: खड़े हो जाते थे
  rationale: עמד, קום के बाद, उनके खड़े रहने की मुद्रा को पूरा करता है। इसे अलग अर्थ-घटक के रूप में रखना इब्रानी की दोहरी गति को सुरक्षित रखता है।
