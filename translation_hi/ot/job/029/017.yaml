translation:
  language: hi
  text: 'मैंने अन्यायी के नुकीले दाँत तोड़ दिए,

    और उसके दाँतों में से शिकार फेंक दिया।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְתַלְּעוֹת
  choice: जबड़े
  rationale: यह शब्द जबड़ों अथवा जबड़े के दाँतों को सूचित करता है। ‘जबड़े’ हिंसक पकड़ की सजीव छवि बनाए रखता है और अगले पदांश के ‘दाँतों’ से स्वाभाविक रूप से जुड़ता है।
- source_word: עַוָּל
  choice: अन्यायी
  rationale: यहाँ शब्द उस व्यक्ति के लिए है जो अन्याय या दुष्टता करता है; ‘अन्यायी’ न्याय-संबंधी संदर्भ को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אַשְׁלִיךְ
  choice: निकाल फेंका
  rationale: मूल क्रिया का अर्थ ‘फेंकना’ है। ‘दाँतों से’ के साथ ‘निकाल फेंका’ हिंदी में क्रिया की प्रबलता और शिकार छुड़ाने की ठोस छवि दोनों बनाए रखता है, बिना इसे केवल ‘छीन लिया’ में बदलने के।
- source_word: טָרֶף
  choice: शिकार
  rationale: शब्द पकड़े या फाड़े गए शिकार को दर्शाता है; यह हिंसक पशु-जैसी उपमा को सुरक्षित रखता है।
