base_translation:
  language: en
  yaml_path: translation/ot/job/029/025.yaml
  text: I chose their way and sat as chief[a]; I dwelt like a king among the troops[c][b], like one who comforts mourners.
translation:
  language: hi
  text: मैं उनका मार्ग चुनता और प्रधान के रूप में बैठता था; मैं दल के बीच राजा के समान रहता था,[a] जैसे कोई शोक मनाने वालों को सांत्वना देता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “दल” के लिए प्रयुक्त इब्रानी शब्द का अर्थ “सैनिक टुकड़ी,” “समूह,” या “जत्था” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: अंतिम तुलना का इब्रानी वाक्य कठिन है। इसका अर्थ “शोक मनाने वालों को सांत्वना देने वाले के समान” भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶבֲחַר דַּרְכָּם
  choice: मैं उनके मार्ग का चुनाव करता
  rationale: भूतकालीन स्मरण के संदर्भ में अपूर्ण क्रिया को अभ्यस्त भूतकाल के रूप में लिया गया है। यह वाक्यांश अय्यूब द्वारा दूसरों के लिए मार्ग चुनने या उनके मार्ग को स्वीकृति देने की वास्तविक अस्पष्टता बनाए रखता है।
- source_word: וְאֵשֵׁב רֹאשׁ
  choice: और प्रधान बनकर बैठता था
  rationale: शाब्दिक बैठने की छवि और नेतृत्व की सामाजिक स्थिति दोनों को सुरक्षित रखता है।
- source_word: וְאֶשְׁכּוֹן
  choice: मैं ... रहता था
  rationale: שכן के बसने या रहने के अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: כְּמֶלֶךְ בַּגְּדוּד
  choice: दल के बीच राजा के समान
  rationale: כְּ तुलना को स्पष्ट रखता है; גְּדוּד सेना, टुकड़ी या दल हो सकता है, इसलिए व्यापक और सहज 'दल' चुना गया है।
- source_word: כַּאֲשֶׁר אֲבֵלִים יְנַחֵם
  choice: और शोक मनाने वालों को सांत्वना देने वाले के समान था
  rationale: कठिन तुलना को व्यक्ति-सूचक रूप में प्रस्तुत करता है और נחם के सांत्वना देने के अर्थ को बनाए रखता है।
theological_decisions:
- issue: अंतिम उपमा का पहले राजकीय सम्मान से संबंध
  choice: इसे अय्यूब की सांत्वना देने वाली भूमिका की दूसरी उपमा के रूप में रखा गया है।
  alternative: इसे राजा द्वारा शोकाकुल लोगों को सांत्वना देने के रूप में सीधे पिछले खंड से जोड़ना।
  rationale: हिब्रू रचना संक्षिप्त और कुछ कठिन है; चुना हुआ रूप अर्थ को स्पष्ट करता है, पर किसी विशेष धार्मिक व्याख्या को आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक गद्य। अभ्यस्त भूतकाल के लिए ‘करता/बैठता/रहता था’ का प्रयोग किया गया है। ‘सांत्वना’ सामान्य पाठक के लिए समझने योग्य रहते हुए प्रसंग की गंभीरता बनाए रखती है।
