lexical_decisions:
- source_word: בְּצֵאתִי
  choice: जब मैं ... जाता था
  rationale: בְּ के साथ infinitive construct और प्रथम पुरुष एकवचन प्रत्यय यहाँ कालगत परिस्थिति बताता है। अय्यूब बीते समय की बार-बार होने वाली सार्वजनिक गतिविधि स्मरण कर रहा है, इसलिए हिन्दी का अपूर्ण भूतकाल स्वाभाविक है।
- source_word: שַׁעַר עֲלֵי קָרֶת
  choice: नगर के फाटक पर
  rationale: इब्रानी में ‘फाटक’ और ‘नगर’ अलग शब्दों में हैं, पर संयुक्त पद नगर से सम्बद्ध सार्वजनिक फाटक को दर्शाता है। हिन्दी में ‘नगर के फाटक पर’ स्थान-संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בָּרְחוֹב
  choice: चौक में
  rationale: רְחוֹב किसी चौड़े सार्वजनिक खुले स्थान या नगर-चौक को सूचित कर सकता है, केवल संकरी सड़क को नहीं। ‘चौक’ यहाँ नागरिक और सार्वजनिक परिवेश को स्पष्ट करता है।
- source_word: אָכִין
  choice: लगवाता था
  rationale: כון के हिफ़ील रूप का अर्थ तैयार करना, स्थापित करना या लगाना हो सकता है। सार्वजनिक सभा में अय्यूब के आसन के संदर्भ में ‘लगवाता था’ स्वाभाविक है और कारणवाचक रूप की छाया भी बनाए रखता है।
- source_word: מוֹשָׁבִי
  choice: अपना आसन
  rationale: यहाँ מוֹשָׁב निवास-स्थान नहीं, बैठने की जगह या सम्मानित सार्वजनिक आसन है। ‘आसन’ गरिमापूर्ण और प्रसंगानुकूल है।
