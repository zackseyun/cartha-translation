  text: when his lamp shone above my head[a], and by his light I walked through darkness.
translation:
  language: hi
  text: 'जब उसका दीपक मेरे सिर के ऊपर चमकता था,

    और उसके प्रकाश में मैं अँधेरे से होकर चलता था।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “और उस दीपक के प्रकाश में मैं अँधेरे में चलता था।” इब्रानी में “उसके प्रकाश” का प्रत्यय प्रसंग के अनुसार परमेश्वर की ओर, या अधिक निकट रूप से दीपक की ओर संकेत कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: בְּהִלּוֹ נֵרוֹ
  choice: जब उसका दीपक ... चमकता था
  rationale: בְּ के साथ infinitive construct यहाँ बीते समय की परिस्थिति बताता है। נֵר के ठोस बिंब को ‘दीपक’ से रखा गया है, और अपूर्ण क्रिया का प्रसंगानुसार अभ्यस्त भूतकाल ‘चमकता था’ स्वाभाविक है।
- source_word: עֲלֵי רֹאשִׁי
  choice: मेरे सिर के ऊपर
  rationale: स्थान-संबंधी अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता और ऊपर चमकते दीपक का बिंब बनाए रखता है।
- source_word: לְאוֹרוֹ
  choice: उसके प्रकाश में
  rationale: לְ यहाँ प्रकाश के सहारे या उसके दायरे में चलने का भाव देता है। पुल्लिंग एकवचन प्रत्यय को ‘उसके’ से जानबूझकर संदिग्ध रखा गया है; वह व्यापक प्रसंग में परमेश्वर की ओर और निकटतम संज्ञा ‘दीपक’ की ओर भी समझा जा सकता है।
- source_word: אֵלֶךְ
  choice: मैं ... चलता था
  rationale: रूपतः अपूर्ण क्रिया इस स्मरणात्मक प्रसंग में बीते समय की बार-बार या सामान्यतः होने वाली क्रिया बताती है।
- source_word: חֹשֶׁךְ
  choice: अँधेरे से होकर
  rationale: गतिशील क्रिया ‘चलता था’ के साथ यह अँधेरे के बीच मार्ग पाने का बिंब स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: तीसरे पुरुष पुल्लिंग एकवचन प्रत्ययों का संदर्भ
  choice: मुख्य पाठ में ‘उसका/उसके’ रखा गया है, जो प्रसंग में परमेश्वर की ओर संकेत करता है।
  alternative: दूसरे वाक्यांश में ‘उसके’ का निकटतम संदर्भ दीपक भी हो सकता है, अर्थात ‘उस दीपक के प्रकाश में’।
  rationale: अय्यूब 29 का प्रसंग परमेश्वर की देखभाल और अनुग्रह का स्मरण है, पर לְאוֹרוֹ का प्रत्यय व्याकरणतः निकटवर्ती ‘दीपक’ से भी जुड़ सकता है। हिन्दी मुख्य पाठ दोनों संभावनाओं को पूरी तरह बंद नहीं करता, और पादटिप्पणी वास्तविक अस्पष्टता स्पष्ट करती है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘दीपक’ और ‘अँधेरा’ जैसे ठोस काव्य-बिंब बनाए रखे गए हैं। पंक्ति-विन्यास पद की समानांतर रचना को स्पष्ट करता है।
