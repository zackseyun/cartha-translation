lexical_decisions:
- source_word: עֵינַיִם
  choice: आँखें
  rationale: द्विवचन रूप यहाँ विधेयात्मक रूपक में है। ठोस बिंब को बनाए रखने के लिए ‘आँखें’ रखा गया, न कि व्याख्यात्मक ‘दृष्टि’ या ‘मार्गदर्शक’.
- source_word: הָיִיתִי
  choice: मैं ... था
  rationale: काल का यह रूप अय्यूब की पिछली भूमिका या दशा बताता है; हिंदी में ‘मैं ... था’ स्वाभाविक है।
- source_word: לַעִוֵּר
  choice: अंधे के लिए
  rationale: ל संबंध अथवा हित को व्यक्त करता है। एकवचन विशेषण को सामान्य प्रतिनिधिक अर्थ में रखते हुए ‘अंधे के लिए’ अनूदित किया गया है।
- source_word: וְרַגְלַיִם
  choice: और ... पैर
  rationale: ‘आँखें’ के समानांतर गतिशीलता और सहारे का ठोस काव्यात्मक रूपक सुरक्षित रखा गया है।
- source_word: לַפִּסֵּחַ
  choice: लँगड़े के लिए
  rationale: यह शब्द चलने में असमर्थ व्यक्ति को दर्शाता है। ‘लँगड़े’ स्रोत के ठोस अर्थ को संक्षेप और स्पष्ट रूप में रखता है।
- source_word: אָֽנִי
  choice: मैं
  rationale: स्वतंत्र सर्वनाम कर्ता पर बल देता है। हिंदी में आरंभिक ‘मैं’ और विधेय-रचना पर्याप्त स्वाभाविक बल देती है; अंत में ‘मैं स्वयं’ जोड़ना असहज और अनावश्यक होगा।
