base_translation:
  language: en
  yaml_path: translation/ot/job/029/011.yaml
  text: For when an ear heard[a], it called me blessed, and when an eye saw, it testified for me.
translation:
  language: hi
  text: क्योंकि जिस कान ने मेरे बारे में सुना, उसने मुझे धन्य कहा; और जिस आँख ने मुझे देखा, उसने मेरे पक्ष में गवाही दी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद अय्यूब को पहले मिले सम्मान का कारण या स्पष्टीकरण देता है; हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֹזֶן שָׁמְעָה
  choice: जिस कान ने मेरे बारे में सुना
  rationale: इब्रानी का एकवचन ‘कान’ सामान्य रूप से सुनने वाले व्यक्ति को दर्शाता है। प्रसंग से स्पष्ट निहित कर्म ‘मेरे बारे में’ हिन्दी में वाक्य को पूर्ण और स्वाभाविक बनाता है।
- source_word: וַתְּאַשְּׁרֵנִי
  choice: उसने मुझे धन्य कहा
  rationale: क्रिया किसी को धन्य या सुखी घोषित करने का भाव रखती है। ‘धन्य कहा’ मूल्यांकनात्मक अर्थ को बनाए रखता है और केवल भावनात्मक ‘खुश’ से अधिक सटीक है।
- source_word: וְעַיִן רָאֲתָה
  choice: और जिस आँख ने मुझे देखा
  rationale: ‘आँख’ का एकवचन भी सामान्य व्यक्ति के लिए अंग-सूचक रूपक है और पहले खंड के ‘कान’ के साथ समानांतरता बनाए रखता है। ‘मुझे’ इब्रानी में प्रसंगतः निहित है।
- source_word: וַתְּעִידֵנִי
  choice: उसने मेरे पक्ष में गवाही दी
  rationale: क्रिया का अर्थ गवाही देना है। प्रसंग में गवाही अय्यूब के अनुकूल है, इसलिए ‘मेरे पक्ष में’ हिन्दी में आशय को स्पष्ट और स्वाभाविक बनाता है।
