lexical_decisions:
- source_word: וְיִחֲלוּ
  choice: बाट जोहते थे
  rationale: क्रिया יחל यहाँ आशा और अपेक्षा के साथ प्रतीक्षा करने का भाव देती है। ‘बाट जोहते थे’ आधुनिक पाठक के लिए स्वाभाविक है और अति भावुक अर्थ नहीं जोड़ता।
- source_word: כַמָּטָר לִי
  choice: वर्षा की तरह मेरी
  rationale: तुलनासूचक כ और स्पष्ट सर्वनाम לִי को बनाए रखा गया है। आशय अय्यूब की बात या सम्मति की प्रतीक्षा से है, पर मूल पाठ सीधे ‘मेरी’ कहता है।
- source_word: וּפִיהֶם פָּעֲרוּ
  choice: और ... मुँह खोले रहते थे
  rationale: פער मुँह को चौड़ा खोलने का चित्र प्रस्तुत करता है। हिंदी में ‘मुँह खोले रहते थे’ अपेक्षा और ग्रहण करने की तत्परता का स्वाभाविक चित्र देता है।
- source_word: לְמַלְקוֹשׁ
  choice: वसंत की पछली वर्षा
  rationale: מַלְקוֹשׁ कृषि-वर्ष की देर से आने वाली मौसमी वर्षा है, जो वसंत में होती है। ‘वसंत की पछली वर्षा’ समय और क्रम दोनों स्पष्ट करता है।
