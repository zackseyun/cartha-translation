review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly retains the explicit ‘me’ (לִי), the rain comparison, and the image of mouths opened toward the מַלְקוֹשׁ. However, ‘वसंत की पछली वर्षा’ is not idiomatic standard Hindi: ‘पछली’ should not be used here, and ‘वसंत की पिछली वर्षा’ could be misunderstood as rain from a previous spring. The revision renders the late/last seasonal sense without importing a specific season into the main text.'
  naturalness: ‘मेरी बाट जोहते थे’ is intelligible, but ‘वर्षा की तरह’ can momentarily modify the act of waiting rather than identify rain as the awaited object. ‘वर्षा की बाट जोहने के समान’ makes the comparison clear. ‘अपने मुँह फैलाए रहते थे’ is a natural poetic rendering of the Hebrew image of opening the mouth wide.
  terminology: ‘अन्तिम वर्षा’ appropriately conveys מַלְקוֹשׁ in this agricultural metaphor. The footnote preserves ‘देर की वर्षा’ and the traditional ‘पछली वर्षा’ as alternatives, while explaining the term’s late-season reference without asserting an unnecessarily precise calendar season.
  issues:
  - severity: medium
    issue: ‘वसंत की पछली वर्षा’ is nonstandard and potentially ambiguous.
    rationale: Modern standard Hindi would normally avoid ‘पछली’ in this construction; replacing it with ‘पिछली’ would introduce the possible sense ‘the rain of the preceding spring.’ ‘अन्तिम वर्षा’ communicates the lexical sense more clearly.
  - severity: low
    issue: The first comparison is slightly unclear in Hindi.
    rationale: ‘वे वर्षा की तरह मेरी बाट जोहते थे’ could initially be read as describing the manner of waiting. Explicitly comparing their waiting for Job to waiting for rain better reflects the Hebrew construction.
  revised_text: 'वे वर्षा की बाट जोहने के समान मेरी बाट जोहते थे,

    और अन्तिम वर्षा[a] के लिए अपने मुँह फैलाए रहते थे।'
  revised_footnotes:
  - marker: a
    text: या ‘पछली वर्षा’ अथवा ‘देर की वर्षा।’ इब्रानी מַלְקוֹשׁ उस मौसमी वर्षा को दर्शाता है जो कृषि-वर्ष के अंतिम भाग में होती है।
    reason: lexical_alternative
  revision_rationale: The revision improves standard-Hindi idiom and clarifies the two rain comparisons while preserving the explicit first-person object, the plural subject, and the vivid image of mouths opened wide. It does not add Job’s speech or counsel, which the Hebrew leaves implicit.
