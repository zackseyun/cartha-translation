  yaml_path: translation/ot/job/029/016.yaml
  text: I was a father to the poor[a], and I investigated the case of one I did not know.
translation:
  language: hi
  text: 'मैं दरिद्रों का पिता था,


    और जिस मामले को मैं नहीं जानता था, उसकी मैं छानबीन करता था।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָב
  choice: पिता
  rationale: शाब्दिक रूपक को बनाए रखता है और दरिद्रों के प्रति अय्यूब की रक्षक तथा सहायक भूमिका व्यक्त करता है।
- source_word: אָנֹכִי
  choice: मैं ... था
  rationale: स्वतंत्र सर्वनाम कर्ता पर बल देता है; अध्याय के भूतकालीन संदर्भ में क्रियारहित उपवाक्य को स्वाभाविक हिन्दी में भूतकाल से व्यक्त किया गया है।
- source_word: לָאֶבְיוֹנִים
  choice: दरिद्रों का
  rationale: אֶבְיוֹן आर्थिक और सामाजिक अभावग्रस्त व्यक्ति को दर्शाता है। हिन्दी में ‘का पिता’ स्वाभाविक संबंधसूचक अभिव्यक्ति है, यद्यपि हिब्रू में ל उपसर्ग है।
- source_word: וְרִיב
  choice: मुकदमे
  rationale: רִיב विवाद, दावा या न्यायिक मामला हो सकता है; यहाँ जाँच और पक्षसमर्थन के संदर्भ में ‘मुकदमा’ न्यायिक भाव को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: לֹא יָדַעְתִּי
  choice: जिस व्यक्ति को मैं नहीं जानता था
  rationale: यह पूर्व परिचय न होने का भाव देता है और बताता है कि अय्यूब अनजान व्यक्ति के मामले पर भी ध्यान देता था।
- source_word: אֶחְקְרֵהוּ
  choice: उसके मुकदमे की मैं छानबीन करता था
  rationale: חקר सावधानी से खोजने, जाँचने या तहकीकात करने को दर्शाता है। प्रत्यय को संदर्भानुसार अनजान व्यक्ति से संबंधित मुकदमे के रूप में व्यक्त किया गया है।
theological_decisions:
- issue: אֶחְקְרֵהוּ में पुरुषवाचक प्रत्यय का संदर्भ
  choice: प्रत्यय को उस अनजान व्यक्ति से जोड़कर ‘उसके मुकदमे’ के रूप में व्यक्त किया गया है।
  alternative: प्रत्यय को רִיב से जोड़कर ‘उस मुकदमे की’ कहना।
  rationale: हिब्रू व्याकरण दोनों के बीच कुछ तनाव रहने देता है, पर वाक्य का सर्वाधिक स्वाभाविक अर्थ यह है कि अय्यूब अपरिचित व्यक्ति के मामले की जाँच करता था; अनावश्यक सिद्धान्तगत निष्कर्ष नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज हिन्दी है। ‘पिता’ मूल रूपक को सुरक्षित रखता है; ‘छानबीन’ गहन और निष्पक्ष जाँच का भाव देता है।
