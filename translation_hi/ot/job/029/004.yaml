lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: जैसा
  rationale: यह अय्यूब की पिछली दशा से तुलना करने वाला खंड है; ‘जैसा’ उसके पहले व्यक्त किए गए उस समय में लौटने की लालसा से स्वाभाविक रूप से जुड़ता है।
- source_word: הָיִיתִי
  choice: मैं … था
  rationale: काल पूर्ण भूतकालीन दशा बताता है; संदर्भ में सामान्य भूतकाल सहज और पर्याप्त है।
- source_word: בִּימֵי חָרְפִּי
  choice: अपने उत्कर्ष के दिनों में
  rationale: חֹרֶף शरद/फसल के मौसम को और रूपकतः जीवन की परिपक्व, फलती-फूलती अवस्था को सूचित कर सकता है। ‘उत्कर्ष’ संदर्भगत भाव स्पष्ट करता है, जबकि ऋतु-बिंब पादटिप्पणी में सुरक्षित है।
- source_word: בְּסוֹד
  choice: अंतरंग मंत्रणा
  rationale: סוֹד में गोपनीय परामर्श, निकट मंडली और घनिष्ठ संगति—इन सबका भाव हो सकता है। ‘अंतरंग मंत्रणा’ संबंधपरक निकटता और परामर्श, दोनों आयाम बनाए रखती है।
- source_word: אֱלוֹהַּ
  choice: परमेश्वर की
  rationale: यहाँ संज्ञा संबंधकारक रूप में סוֹד से जुड़ी है; आधुनिक मानक हिन्दी में ‘परमेश्वर की’ स्वाभाविक है।
- source_word: עֲלֵי
  choice: पर … बनी रहती थी
  rationale: על यहाँ अय्यूब के तंबू के ऊपर या उस पर विस्तृत उपस्थिति का बिंब देता है। ‘बनी रहती थी’ पूर्वकालीन अनुग्रह और निकटता की स्थायी अनुभूति व्यक्त करता है, बिना बिंब हटाए।
- source_word: אָהֳלִי
  choice: मेरे तंबू
  rationale: मूल का ठोस तंबू-बिंब रखा गया है; प्रसंगतः इसमें निवास और घराना भी सम्मिलित हो सकते हैं।
theological_decisions:
- issue: בְּסוֹד אֱלוֹהַּ में अय्यूब और परमेश्वर के पूर्व संबंध का अर्थ
  choice: परमेश्वर की ‘अंतरंग मंत्रणा’ अय्यूब के तंबू पर बनी रहती थी—यह निकटता, विश्वास और अनुग्रह व्यक्त करती है, पर इसे केवल मित्रता या विशेष रहस्योद्घाटन तक सीमित नहीं करती।
  alternative: ‘परमेश्वर की गुप्त मंत्रणा’ अथवा ‘परमेश्वर की घनिष्ठ संगति’
  rationale: इब्रानी पद गोपनीय परामर्श और आत्मीय संगति दोनों अर्थों को धारण कर सकता है। चुना हुआ रूप इस धर्मवैचारिक तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिन्दी। पद पिछले वाक्य पर निर्भर स्मृतिपरक खंड है, इसलिए अंत में अल्पविराम रखा गया है। ‘तंबू’ मूल बिंब को बनाए रखता है और ‘अंतरंग मंत्रणा’ जानबूझकर निकट संगति तथा गोपनीय परामर्श—दोनों अर्थों के लिए स्थान छोड़ती है।
