  text: when my steps were washed with curds[b][a], and the rock poured out for me streams of oil.
translation:
  language: hi
  text: 'जब मेरे कदम मलाई[a] से धुलते थे,

    और चट्टान मेरे पास[b] तेल की धाराएँ उंडेलती थी।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दही” अथवा “मक्खन”; इब्रानी शब्द गाढ़े दूध, मलाई या मक्खन-जैसे दुग्ध-पदार्थ के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “मेरे लिए”; इब्रानी अभिव्यक्ति मूलतः स्थान-सूचक है और उसका अर्थ “मेरे साथ/मेरे पास” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּרְחֹץ
  choice: जब ... धुलते थे
  rationale: בְּ के साथ infinitive construct यहाँ अतीत की परिस्थितिजन्य स्मृति बताता है; हिन्दी में ‘जब ... धुलते थे’ स्वाभाविक है।
- source_word: הֲלִיכַי
  choice: मेरे कदम
  rationale: शब्द चलने या चाल को सूचित कर सकता है; ठोस समृद्धि-बिंब में ‘मेरे कदम’ सहज और चित्रात्मक है।
- source_word: בְּחֵמָה
  choice: मलाई से
  rationale: חֵמָה गाढ़े दूध, दही-जमे पदार्थ, मलाई या मक्खन-जैसे दुग्ध-पदार्थ को सूचित करता है। आधुनिक हिन्दी में ‘मलाई’ इस प्रचुरता के बिंब को स्वाभाविक ढंग से व्यक्त करती है; अन्य सम्भावनाएँ पादटिप्पणी में हैं।
- source_word: וְצוּר
  choice: और चट्टान
  rationale: צוּר का सामान्य अर्थ चट्टान या शैल है; काव्य में कठोर स्थान से अप्रत्याशित उपज का चित्र बना रहता है।
- source_word: יָצוּק
  choice: बहाती थी
  rationale: יצק का मूल अर्थ उंडेलना है। तेल की ‘धाराओं’ के साथ हिन्दी में ‘बहाती थी’ सजीव और स्वाभाविक है, जबकि उंडेलने की प्रचुरता भी बनी रहती है।
- source_word: עִמָּדִי
  choice: मेरे पास
  rationale: यह पद शाब्दिक रूप से ‘मेरे साथ/मेरे पास’ है। ‘मेरे पास’ स्थानिक अर्थ सुरक्षित रखता है और लाभार्थक ‘मेरे लिए’ को अनिवार्य नहीं बनाता।
- source_word: פַּלְגֵי
  choice: धाराएँ
  rationale: פּלגי बहती हुई नालियों, धाराओं या जलधाराओं को सूचित करता है; तेल के काव्यात्मक बिंब में ‘धाराएँ’ संक्षिप्त और सजीव है।
- source_word: שָׁמֶן
  choice: तेल
  rationale: שׁמן सामान्यतः तेल, और प्रसंगतः प्रायः जैतून का तेल, दर्शाता है; मूल की संक्षिप्तता बनाए रखने के लिए ‘तेल’ चुना गया है।
