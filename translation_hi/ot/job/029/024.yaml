  yaml_path: translation/ot/job/029/024.yaml
  text: I smiled at them—they did not believe it[c][b][a]; and they did not cast down the light of my face.
translation:
  language: hi
  text: मैं उनकी ओर मुस्कराता, तो उन्हें विश्वास न होता[a]; और वे मेरे मुख की चमक को फीका न पड़ने देते[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं उन पर हँसता, तो वे विश्वास न करते”; इब्रानी में अय्यूब की कृपापूर्ण निकटता पर उनके आश्चर्य का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में अक्षरशः, “वे मेरे मुख के प्रकाश को न गिराते”; यह उज्ज्वल, प्रसन्न या अनुकूल मुखमुद्रा का चित्र है।
    reason: cultural_note
lexical_decisions:
- source_word: אֶשְׂחַק אֲלֵהֶם
  choice: मैं उन पर मुस्कराता
  rationale: שׂחק का अर्थ हँसना या मुस्कराना हो सकता है। प्रसंग में अय्यूब की अनुग्रहपूर्ण और सम्मानसूचक प्रतिक्रिया अभिप्रेत है; इसलिए ‘मुस्कराता’ स्वाभाविक है, जबकि ‘हँसता’ उपहास का अनचाहा भाव दे सकता है। אֶל की दिशात्मकता ‘उन पर’ से बनी रहती है।
- source_word: לֹא יַאֲמִינוּ
  choice: उन्हें विश्वास न होता
  rationale: इब्रानी का शाब्दिक अर्थ ‘वे विश्वास नहीं करते’ है। यहाँ किसी कथन के प्रति अविश्वास से अधिक अय्यूब की कृपापूर्ण मुस्कान पर आश्चर्य का भाव संभव है; हिंदी में ‘उन्हें विश्वास न होता’ दोनों आयामों को खुला रखता है।
- source_word: וְאוֹר פָּנַי
  choice: मेरे मुख की चमक
  rationale: ‘मेरे मुख का प्रकाश’ मूल बिंब को अधिक अक्षरशः रखता, पर हिंदी में ‘मुख की चमक’ प्रसन्न अथवा अनुकूल भाव की स्वाभाविक और गरिमामय अभिव्यक्ति है।
- source_word: לֹא יַפִּילוּן
  choice: फीका न पड़ने देते
  rationale: हिफ़ील रूप का अक्षरशः अर्थ ‘गिराते नहीं’ है। प्रकाश/चमक के साथ हिंदी में ‘फीका पड़ना’ स्वाभाविक रूपक है; प्रेरणार्थकता ‘न पड़ने देते’ में व्यक्त होती है।
theological_decisions:
- issue: दूसरे खंड में कर्ता और आशय
  choice: वे मेरे मुख की चमक को फीका न पड़ने देते
  alternative: वे मेरे मुख की चमक को गिरा नहीं पाते थे
  rationale: मूल पाठ में बहुवचन कर्ता ‘वे’ और प्रेरणार्थक क्रिया सुरक्षित रखी गई है। इसे अय्यूब की प्रतिष्ठा, प्रसन्नता या अनुकूल मुखमुद्रा में से केवल किसी एक धर्मवैचारिक अर्थ तक सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमामय किंतु सहज शैली। काव्यात्मक ‘मुख की चमक’ से मूल प्रकाश-बिंब रखा गया है, जबकि अस्वाभाविक शाब्दिक प्रयोग ‘प्रकाश को गिराना’ को पादटिप्पणी में स्पष्ट किया गया है।
