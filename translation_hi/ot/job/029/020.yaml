  text: My glory was ever fresh with me[b][a], and my bow was renewed in my hand.
translation:
  language: hi
  text: 'मेरा गौरव मेरे साथ सदा ताज़ा बना रहता था,[a]

    और मेरे हाथ में मेरा धनुष नया होता था।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरा गौरव मेरे साथ नया था।” इब्रानी विशेषण का अर्थ “नया” है; प्रसंग में इसका भाव लगातार ताज़ा या अक्षुण्ण रहने का हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “धनुष” संभवतः सामर्थ्य या शक्ति का बिंब है; मूल इब्रानी में ठोस चित्र बना रहता है।
    reason: cultural_note
lexical_decisions:
- source_word: כְּבוֹדִי
  choice: मेरा गौरव
  rationale: यह इब्रानी शब्द महिमा, सम्मान और प्रतिष्ठा का भाव दे सकता है। ‘गौरव’ काव्यात्मक गरिमा बनाए रखते हुए अर्थ को केवल सामाजिक प्रतिष्ठा तक सीमित नहीं करता।
- source_word: חָדָשׁ
  choice: सदा नया बना रहता था
  rationale: मूल विशेषण का सीधा अर्थ ‘नया’ है; प्रसंग में यह गौरव के लगातार ताज़ा या अक्षुण्ण बने रहने को व्यक्त करता है। ‘सदा’ काव्य-पंक्ति के निरंतरता-सूचक आशय को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: עִמָּדִי
  choice: मेरे साथ
  rationale: यह वाक्यांश मूल के निकट है और बताता है कि गौरव अय्यूब के साथ बना रहता था।
- source_word: קַשְׁתִּי
  choice: मेरा धनुष
  rationale: ठोस इब्रानी बिंब को बनाए रखा गया है; काव्य में धनुष सामर्थ्य या ओज का संकेत भी हो सकता है।
- source_word: בְּיָדִי
  choice: मेरे हाथ में
  rationale: यह मूल के स्थानवाचक बिंब को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: תַחֲלִיף
  choice: फिर से बल पाता था
  rationale: חלף के हिफ़ील रूप का यहाँ नवीकरण या पुनः सशक्त होने का भाव है। इस प्रयोग से धनुष के सक्रिय सामर्थ्य का बिंब स्वाभाविक हिन्दी में व्यक्त होता है, जबकि शाब्दिक ‘नया किया जाता था’ की असहजता से बचा जाता है।
