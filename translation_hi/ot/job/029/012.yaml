  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सरल काव्यात्मक गद्य रखा गया है। ‘दीन जन’ सामाजिक और आर्थिक असहायता की अर्थ-व्याप्ति बनाए रखता है, जबकि ‘पितृहीन’ मूल सामाजिक श्रेणी को स्पष्ट करता है।
