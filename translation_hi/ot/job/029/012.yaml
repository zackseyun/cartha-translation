source:
  edition: WLC
  text: כִּֽי אֲ֭מַלֵּט עָנִ֣י מְשַׁוֵּ֑עַ וְ֝/יָת֗וֹם וְֽ/לֹא עֹזֵ֥ר לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/012.yaml
  text: For I delivered the poor who cried for help[a], and the fatherless who had no helper.
translation:
  language: hi
  text: 'क्योंकि मैंने सहायता के लिए पुकारते हुए दीन जन को बचाया,

    और उस पितृहीन को भी, जिसका कोई सहायक न था।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह आसपास के प्रसंग में अय्यूब को मिले सम्मान का कारण बताता है; हिंदी में ‘क्योंकि’ इसका व्याख्यात्मक संबंध स्पष्ट रखता है।
- source_word: אֲמַלֵּט
  choice: मैंने ... बचाया
  rationale: מלט के पिएल रूप में सक्रिय रूप से छुड़ाने या बचाने का भाव है; ‘बचाया’ सहज और प्रसंगानुकूल है।
- source_word: עָנִי
  choice: दीन जन
  rationale: यह शब्द निर्धन और पीड़ित, दोनों प्रकार की सामाजिक असहायता व्यक्त कर सकता है; ‘दीन जन’ इस व्यापकता को संक्षेप में बनाए रखता है।
- source_word: מְשַׁוֵּעַ
  choice: सहायता के लिए पुकारते हुए
  rationale: कृदंत उस व्यक्ति की जारी पुकार को व्यक्त करता है; यह हिंदी रूप उसकी सक्रिय सहायता-पुकार को सुरक्षित रखता है।
- source_word: יָתוֹם
  choice: पितृहीन
  rationale: इब्रानी शब्द विशेष रूप से पिता से वंचित सामाजिक रूप से असुरक्षित व्यक्ति को सूचित करता है; ‘पितृहीन’ ‘अनाथ’ की तुलना में यह विशिष्टता अधिक ठीक रखता है।
- source_word: וְלֹא עֹזֵר לוֹ
  choice: जिसका कोई सहायक न था
  rationale: यह उपवाक्य पितृहीन व्यक्ति की सहायता-विहीन दशा को स्वाभाविक और संक्षिप्त हिंदी में व्यक्त करता है।
theological_decisions: []
