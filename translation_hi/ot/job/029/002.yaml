    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יִתְּנֵנִי
  choice: काश, मैं ... होता
  rationale: शाब्दिक रूप से ‘कौन मुझे देगा?’ यह इब्रानी मुहावरा यहाँ तीव्र इच्छा और अतीत के लिए लालसा व्यक्त करता है; आधुनिक हिन्दी में ‘काश’ वही भाव स्वाभाविक रूप से पहुँचाता है।
- source_word: כְיַרְחֵי קֶדֶם
  choice: बीते हुए महीनों की तरह
  rationale: כְּ तुलना सूचित करता है, יַרְחֵי का अर्थ ‘महीने’ और קֶדֶם का यहाँ कालगत अर्थ ‘पहले का/बीता हुआ’ है। यह अनुवाद अतीत की ओर लौटने की अय्यूब की लालसा बनाए रखता है।
- source_word: כִּימֵי
  choice: उन दिनों की तरह
  rationale: यह पहले पदांश के समानांतर दूसरी कालगत तुलना है; ‘उन दिनों’ हिन्दी में स्मरण किए जा रहे अतीत को स्पष्ट और सहज बनाता है।
- source_word: אֱלוֹהַּ
  choice: परमेश्वर
  rationale: यह अय्यूब में प्रचलित परमेश्वर के लिए एकवचन काव्यात्मक रूप है; यहाँ ‘सर्वशक्तिमान’ जोड़ने का कोई शाब्दिक आधार नहीं है।
- source_word: יִשְׁמְרֵנִי
  choice: मेरी रखवाली करता था
  rationale: שׁמר का अर्थ रक्षा करना, संभालकर रखना या निगरानी रखना हो सकता है। ‘मेरी रखवाली करता था’ इस प्रसंग में परमेश्वर की सुरक्षात्मक देखरेख को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: अय्यूब की स्मृति में परमेश्वर का कार्य
  choice: परमेश्वर मेरी रखवाली करता था
  alternative: परमेश्वर मेरी देखभाल करता था / मेरी रक्षा करता था
  rationale: इब्रानी क्रिया अतीत की सुरक्षात्मक देखरेख व्यक्त करती है, पर उसके साधन या किसी विशिष्ट धर्मवैज्ञानिक व्यवस्था को निर्धारित नहीं करती। ‘रखवाली’ मूल की व्यापकता और व्यक्तिगत संरक्षण दोनों को बनाए रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘काश’ इब्रानी इच्छा-सूचक मुहावरे का स्वाभाविक हिन्दी रूप है; पंक्तियों का समानांतर विन्यास मूल काव्य-रचना को प्रतिबिंबित करता है।
