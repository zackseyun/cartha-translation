lexical_decisions:
- source_word: בְּשׁוֹט לָשׁוֹן
  choice: जीभ के कोड़े से
  rationale: शाब्दिक बिंब ‘जीभ का कोड़ा’ वाणी के प्रहार, विशेषकर निंदात्मक या अपमानजनक बातों, को दर्शाता है। हिन्दी में ‘जीभ के कोड़े’ इस सजीव रूपक को स्वाभाविक ढंग से बनाए रखता है।
- source_word: תֵּחָבֵא
  choice: तुम छिपाए जाओगे
  rationale: निफ़अल रूप का मूल भाव ‘छिपाया जाना’ है। यह अनुवाद सुरक्षा का आशय व्यक्त करता है, पर उसे व्याख्यात्मक रूप से ‘बचाए जाओगे’ में नहीं बदलता।
- source_word: וְלֹא תִירָא
  choice: तुम नहीं डरोगे
  rationale: नकारात्मक अपूर्ण क्रिया यहाँ भविष्यगत आश्वासन देती है; इसलिए सीधा भविष्यकाल उपयुक्त है।
- source_word: מִשֹּׁד
  choice: विनाश
  rationale: שֹׁד हिंसक विनाश, तबाही या बरबादी का संकेत दे सकता है। ‘विनाश’ स्पष्ट, dignified और पर्याप्त व्यापक हिन्दी शब्द है।
- source_word: כִּי יָבֹוא
  choice: जब विनाश आएगा
  rationale: संदर्भ में כִּי को कालवाचक ‘जब’ समझना सबसे स्वाभाविक है। हिन्दी में संज्ञा दोहराने से अस्पष्ट सर्वनाम से बचते हुए आशय स्पष्ट रहता है।
