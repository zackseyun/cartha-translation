  text: כִּ֤י לֹא יֵצֵ֣א מֵ/עָפָ֣ר אָ֑וֶן וּ֝/מֵ/אֲדָמָ֗ה לֹא יִצְמַ֥ח עָמָֽל׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/006.yaml
  text: For trouble does not come from the dust[a], nor does toil sprout from the ground.
translation:
  language: hi
  text: क्योंकि विपत्ति धूल से नहीं निकलती[a], और न कष्ट भूमि से उगता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अधर्म धूल से नहीं निकलता, और न दुःख भूमि से उगता है।’ इन इब्रानी शब्दों में नैतिक बुराई अथवा विपदा और क्लेश से जुड़े अर्थ भी हो सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ तर्क-संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יֵצֵא
  choice: नहीं निकलती
  rationale: יצא का मूल अर्थ ‘निकलना’ है; धूल को स्रोत मानने से इनकार करने वाली उभरने की छवि यहाँ सुरक्षित रहती है।
- source_word: מֵעָפָר
  choice: धूल से
  rationale: עָפָר का सामान्य अर्थ ‘धूल’ है; हिन्दी में बिना अनावश्यक निश्चितता जोड़े पदार्थ अथवा स्रोत का बोध होता है।
- source_word: אָוֶן
  choice: विपत्ति
  rationale: अय्यूब के इस संदर्भ में यह शब्द अनिष्ट, दुःख या संकट का बोध दे सकता है; ‘विपत्ति’ नैतिक ‘अधर्म’ का अर्थ अनावश्यक रूप से आरोपित किए बिना व्यापक विपदा-संबंधी अर्थ रखता है।
- source_word: וּמֵאֲדָמָה
  choice: और न ... भूमि से
  rationale: אֲדָמָה मिट्टी या धरती को दर्शाता है; ‘भूमि’ कृषि-संबंधी समानांतर चित्र को गरिमापूर्ण और सहज हिन्दी में व्यक्त करता है।
- source_word: יִצְמַח
  choice: अंकुरित होता है
  rationale: צמח वनस्पति के उगने या फूटने का क्रियापद है; ‘अंकुरित होना’ मूल कृषि-रूपक को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: עָמָל
  choice: कष्ट
  rationale: עָמָל परिश्रम, क्लेश, दुःख या उससे जुड़ी पीड़ा को सूचित कर सकता है; ‘कष्ट’ यहाँ אָוֶן के समानांतर व्यापक मानवीय दुःख को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: एलिफज के कथन में אָוֶן और עָמָל का अर्थ
  choice: यह पद कहता है कि विपत्ति और कष्ट धरती से अपने-आप उत्पन्न नहीं होते।
  alternative: यह पद अधर्म और दुष्टता के भूमि से न निकलने की बात करता है; अथवा केवल विपदा और दुःख का उल्लेख करता है, बिना उनके नैतिक कारण पर कोई संकेत दिए।
  rationale: संदर्भ दुःख और क्लेश पर एलिफज के विचार का है। ‘विपत्ति’ और ‘कष्ट’ काव्यात्मक समानांतरता तथा कृषि-रूपक को रखते हैं, पर पद में स्पष्ट रूप से कही गई बात से अधिक कठोर नैतिक कारणवाद आरोपित नहीं करते।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली रखी गई है। ‘धूल से निकलती’ और ‘भूमि से अंकुरित’ मूल के समानांतर कृषि-बिंब को बनाए रखते हैं; स्त्रीलिंग ‘निकलती’ का संबंध ‘विपत्ति’ और पुल्लिंग ‘होता’ का संबंध ‘कष्ट’ से है।
