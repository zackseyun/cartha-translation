source:
  edition: WLC
  text: אֲשֶׁ֤ר קְצִיר֨/וֹ רָ֘עֵ֤ב יֹאכֵ֗ל וְ/אֶֽל מִ/צִּנִּ֥ים יִקָּחֵ֑/הוּ וְ/שָׁאַ֖ף צַמִּ֣ים חֵילָֽ/ם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/005.yaml
  text: The hungry eat his harvest[a], and take it even from among the thorns, and the thirsty pant after their wealth.
translation:
  language: hi
  text: उसकी फसल भूखा खा जाता है और उसे काँटों के बीच से भी उठा ले जाता है; और प्यासे उनकी सम्पत्ति के लिए हाँफते हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और फंदा उनकी सम्पत्ति निगल जाता है।” अन्तिम उपवाक्य का इब्रानी पाठ कठिन है; मुख्य पाठ उस सामान्य समझ का अनुसरण करता है जिसमें “भूखा” और “प्यासे” समानान्तर हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: קְצִירוֹ
  choice: उसकी फसल
  rationale: קָצִיר काटी हुई उपज या फसल को दर्शाता है; हिन्दी में ‘उसकी फसल’ स्वाभाविक है और एकवचन अधिकारसूचक प्रत्यय को बनाए रखता है।
- source_word: רָעֵב
  choice: भूखा
  rationale: यह विशेषण संज्ञा के रूप में प्रयुक्त है। ‘भूखा’ किसी भूखे व्यक्ति का सामान्य बोध देता है और वचन को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: וְאֶל מִצִּנִּים יִקָּחֵהוּ
  choice: और उसे काँटों के बीच से भी उठा ले जाता है
  rationale: कठिन वाक्यांश का यह अनुवाद फसल को काँटों के बीच से ले जाने का सजीव चित्र और ‘भी’ द्वारा बल बनाए रखता है, बिना काँटों को निश्चित रूप से रक्षात्मक बाड़ मानने के।
- source_word: צִנִּים
  choice: काँटे
  rationale: कृषि-संबंधी प्रसंग में ‘काँटे’ सबसे सीधा अर्थ है; ‘कँटीली झाड़ियाँ’ सम्भव है, पर वह अधिक विशिष्ट होगा।
- source_word: וְשָׁאַף
  choice: के लिए हाँफते हैं
  rationale: שָׁאַף हाँफने, तीव्र लालसा करने या निगलने की ओर झपटने का भाव दे सकता है। ‘के लिए हाँफते हैं’ लालच की रूपकात्मक तीव्रता को बनाए रखता है।
- source_word: צַמִּים
  choice: प्यासे
  rationale: व्यंजनात्मक पाठ को सामान्यतः ‘प्यासे’ समझा जाता है, जो पहले खंड के ‘भूखा’ के समानान्तर है। ‘फंदा/जाल’ से संबंधित वैकल्पिक समझ पाद-टिप्पणी में दी गई है।
- source_word: חֵילָם
  choice: उनकी सम्पत्ति
  rationale: חַיִל ज्ञान-साहित्य में धन, साधन या सम्पत्ति का अर्थ दे सकता है। बहुवचन अधिकारसूचक प्रत्यय के कारण ‘उनकी सम्पत्ति’ रखा गया है, यद्यपि इससे पूर्ववर्ती एकवचन ‘उसकी’ के साथ पाठगत तनाव बना रहता है।
