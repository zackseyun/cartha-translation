  yaml_path: translation/ot/job/005/025.yaml
  text: You will know that your offspring are many[b][a], and your descendants are like the grass of the earth.
translation:
  language: hi
  text: तुम जानोगे कि तुम्हारी संतान बहुत होगी[a], और तुम्हारे वंशज धरती की घास के समान होंगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हारा बीज बहुत होगा”; इब्रानी में यहाँ वंश के लिए एक सामूहिक शब्द प्रयुक्त हुआ है।
    reason: lexical_alternative
  - marker: b
    text: या “भूमि की घास के समान।” इब्रानी शब्द का अर्थ संदर्भ के अनुसार “धरती” या “भूमि” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדַעְתָּ
  choice: तुम जानोगे
  rationale: संयोजक वाव सहित काल पूर्ण रूप यहाँ काव्यात्मक संदर्भ में भविष्यसूचक आश्वासन व्यक्त करता है; यह आधुनिक हिन्दी में स्वाभाविक है।
- source_word: כִּי
  choice: कि
  rationale: यहाँ यह कारण नहीं, बल्कि जानी जाने वाली बात का विषय प्रस्तुत करता है।
- source_word: רַב
  choice: बहुत होगी
  rationale: एकवचन सामूहिक संज्ञा ‘संतान’ के साथ यह संख्या की बहुतायत व्यक्त करता है।
- source_word: זַרְעֶךָ
  choice: तुम्हारी संतान
  rationale: शाब्दिक अर्थ ‘बीज’ हो सकता है, पर पारिवारिक संदर्भ में सामूहिक ‘संतान’ स्पष्ट और स्वाभाविक है।
- source_word: וְצֶאֱצָאֶיךָ
  choice: तुम्हारे वंशज
  rationale: यह किसी से उत्पन्न भावी पीढ़ियों को दर्शाता है और पहले समानार्थी पद के साथ काव्यात्मक समानांतरता बनाए रखता है।
- source_word: כְּעֵשֶׂב
  choice: घास के समान
  rationale: यह बहुतायत दिखाने वाली उपमा को गरिमापूर्ण और सहज हिन्दी में बनाए रखता है।
- source_word: הָאָרֶץ
  choice: धरती की
  rationale: אֶרֶץ का अर्थ ‘धरती’ या ‘भूमि’ दोनों हो सकता है; व्यापक बहुतायत की इस उपमा में ‘धरती’ उपयुक्त है, जबकि विकल्प पादटिप्पणी में सुरक्षित है।
