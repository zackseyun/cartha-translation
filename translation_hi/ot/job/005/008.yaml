  yaml_path: translation/ot/job/005/008.yaml
  text: But as for me[a], I would seek God, and to God I would present my case.
translation:
  language: hi
  text: परन्तु मैं तो परमेश्वर की खोज करता, और परमेश्वर के सामने अपना मामला रखता।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אוּלָם אֲנִי
  choice: परन्तु मैं तो
  rationale: אוּלָם के विरोधसूचक मोड़ और स्वतंत्र सर्वनाम אֲנִי के बलाघात—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֶדְרֹשׁ
  choice: खोजता
  rationale: דרשׁ यहाँ परमेश्वर की ओर सहायता या उत्तर के लिए मुड़ने का भाव रखता है। संदर्भ में प्रथम पुरुष का यह रूप सलाहात्मक या संभावनार्थक है, जिसे हिन्दी में ‘खोजता’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֶל אֵל
  choice: परमेश्वर को
  rationale: दिशासूचक אֶל को हिन्दी क्रिया ‘खोजना’ के साथ कर्मचिह्न ‘को’ द्वारा स्वाभाविक ढंग से व्यक्त किया गया है; אֵל के लिए सामान्य और गरिमापूर्ण ‘परमेश्वर’ चुना गया है।
- source_word: וְאֶל אֱלֹהִים
  choice: और परमेश्वर के सामने
  rationale: दूसरा दिव्य पद पहले के समान उसी परमेश्वर का काव्यात्मक समानांतर उल्लेख है। ‘के सामने’ मामला रखने की दिशात्मकता को स्पष्ट और स्वाभाविक हिन्दी में दर्शाता है।
- source_word: אָשִׂים
  choice: रखता
  rationale: שׂים का मूल अर्थ ‘रखना/स्थापित करना’ है; דִּבְרָתִי के साथ यह अपनी बात या मामला परमेश्वर के सामने रखने का मुहावरेदार अर्थ देता है।
- source_word: דִּבְרָתִי
  choice: अपना मामला
  rationale: यह शब्द यहाँ किसी विषय, दावे या मुकदमे-सदृश मामले को सूचित कर सकता है। ‘अपना मामला’ इस व्यापकता को बचाता है और अनावश्यक रूप से इसे केवल ‘शिकायत’ नहीं बनाता।
theological_decisions:
- issue: समानांतर पदों אֵל और אֱלֹהִים का अनुवाद
  choice: दोनों के लिए ‘परमेश्वर’
  alternative: पहले के लिए ‘सामर्थी परमेश्वर’ और दूसरे के लिए ‘परमेश्वर’, अथवा ‘एल’ और ‘परमेश्वर’
  rationale: यहाँ दोनों पद काव्यात्मक समानांतरता में एक ही दिव्य सत्ता के लिए प्रयुक्त हैं। अलग-अलग अनुवाद करने से ऐसा धार्मिक भेद उत्पन्न हो सकता है जिसकी इब्रानी पाठ में आवश्यकता नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और बोलचाल से पर्याप्त निकट शैली। ‘परन्तु मैं तो’ वक्ता के स्पष्ट विरोधात्मक बल को रखता है; ‘अपना मामला रखना’ न्यायिक अथवा विनयात्मक दोनों संभावनाओं को खुला रखता है।
