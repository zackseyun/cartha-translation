- source_word: בְרִיתֶךָ
  choice: तेरी वाचा होगी
  rationale: इब्रानी उपवाक्य में स्पष्ट क्रिया नहीं है। हिन्दी में ‘होगी’ जोड़ना प्रसंग के भविष्यसूचक आश्वासन के अनुकूल है, जबकि ‘वाचा’ संबंध की औपचारिक और गंभीर प्रकृति बनाए रखती है।
- source_word: וְחַיַּת הַשָּׂדֶה
  choice: और खेत के जंगली पशु
  rationale: इस प्रयोग में חַיָּה सामूहिक रूप से जंगली पशुओं को दर्शाता है। ‘जंगली पशु’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: הָשְׁלְמָה לָךְ
  choice: तेरे साथ मेल से रहेंगे
  rationale: שׁלם का हिफ़ील रूप मेल करने या शांतिपूर्ण संबंध में होने का भाव देता है। प्रसंग में भविष्य का आश्वासन होने के कारण भविष्यकाल रखा गया है; ‘मेल से रहेंगे’ संबंधपरक अर्थ को सहज हिन्दी में व्यक्त करता है।
