  yaml_path: translation/ot/job/005/023.yaml
  text: For you will have a covenant with the stones of the field[c][b][a], and the wild animals of the field will be at peace with you.
translation:
  language: hi
  text: क्योंकि खेत के पत्थरों के साथ तेरी वाचा होगी[a], और खेत के जंगली पशु[b] तेरे साथ मेल से रहेंगे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “खेत में पड़े पत्थरों के साथ।” यह वाक्यांश खेती में बाधा बनने वाले पत्थरों का संकेत दे सकता है, पर मुख्य पाठ में इब्रानी बिंब को स्पष्ट रूप से रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: या, “खेत के वन-पशु।”
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “उसने तेरे साथ मेल कर लिया है” या “वह तेरे साथ मेल में है।” इब्रानी व्यक्ति और जंगली पशुओं के बीच शांतिपूर्ण संबंध व्यक्त करता है।
    reason: lexical_alternative
