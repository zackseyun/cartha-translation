  yaml_path: translation/ot/job/005/020.yaml
  text: In famine he will redeem you from death[b][a], and in war from the power of the sword.
translation:
  language: hi
  text: अकाल में वह तुम्हें मृत्यु से छुड़ाएगा[a], और युद्ध में तलवार की शक्ति से[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “छुड़ौती देकर मुक्त करेगा” अथवा “बचाएगा।” इब्रानी क्रिया में मुक्त करने या संकट से निकालने का भाव है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “तलवार के हाथों से”; यह तलवार की शक्ति या पकड़ का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרָעָב
  choice: अकाल में
  rationale: רָעָב भूख या अकाल को दर्शाता है; विपत्ति के इस संदर्भ में ‘अकाल’ अधिक ठोस और स्वाभाविक है।
- source_word: פָּדְךָ
  choice: वह तुम्हें छुड़ाएगा
  rationale: פדה का अर्थ छुड़ाना, मुक्त करना या दाम देकर छुड़ाना हो सकता है। यहाँ लौकिक संकट से बचाव की बात है, इसलिए ‘छुड़ाएगा’ अर्थ को स्वाभाविक ढंग से रखता है, जबकि विकल्पों को पाद-टिप्पणी में सुरक्षित रखा गया है।
- source_word: מִמָּוֶת
  choice: मृत्यु से
  rationale: מִן अलगाव या बचाए जाने के स्रोत को बताता है; ‘मृत्यु से’ इब्रानी संज्ञा और समानांतर संरचना दोनों बनाए रखता है।
- source_word: וּבְמִלְחָמָה
  choice: और युद्ध में
  rationale: מִלְחָמָה युद्ध या लड़ाई को दर्शाता है; ‘युद्ध’ व्यापक अर्थ रखता है और ‘अकाल में’ के समानांतर बैठता है।
- source_word: מִידֵי
  choice: के हाथ से
  rationale: יָד का बहुवचन यहाँ सामर्थ्य या पकड़ का मुहावरा है। हिन्दी में ‘तलवार के हाथ से’ काव्यात्मक मानवीकरण को बनाए रखता है; उसका मुहावरेदार अर्थ पाद-टिप्पणी में स्पष्ट किया गया है।
- source_word: חָרֶב
  choice: तलवार
  rationale: חֶרֶב का सामान्य अर्थ ‘तलवार’ है और यहाँ यह युद्ध में हिंसक मृत्यु की शक्ति का भी द्योतक है।
theological_decisions:
- issue: ज्ञान-साहित्य के संदर्भ में פדה का अनुवाद
  choice: छुड़ाएगा
  alternative: छुड़ौती देकर मुक्त करेगा / बचाएगा
  rationale: यहाँ तत्काल संदर्भ सांसारिक विपत्ति से परमेश्वर के बचाव का है, न कि किसी विकसित उद्धार-सिद्धांत का स्पष्ट कथन। ‘छुड़ाएगा’ मूल क्रिया की मुक्ति-भावना रखता है और अनावश्यक धर्मवैज्ञानिक विशिष्टता नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और काव्यात्मक समानांतरता वाला रूप। ‘तलवार के हाथ से’ मूल बिंब को बनाए रखता है, और उसका आशय पाद-टिप्पणी में समझाया गया है।
