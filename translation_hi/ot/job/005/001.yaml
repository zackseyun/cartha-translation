  rationale: Revised the opening to remove the unsupported ‘try and see’ nuance while preserving the imperative's urgency. Replaced the potentially human-specific “पवित्र जनों” with “पवित्र प्राणियों” and retained the alternatives and contextual explanation in the anchored footnote.
