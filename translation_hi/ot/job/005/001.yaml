  text: קְֽרָא נָ֭א הֲ/יֵ֣שׁ עוֹנֶ֑/ךָּ וְ/אֶל מִ֖י מִ/קְּדֹשִׁ֣ים תִּפְנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/001.yaml
  text: Call now—is there anyone who will answer you? And to which of the holy ones will you turn?[a]
translation:
  language: hi
  text: अब पुकार—क्या कोई है जो तुझे उत्तर देगा? और पवित्र प्राणियों[a] में से तू किसकी ओर मुड़ेगा?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पवित्र जन” या “संत।” यहाँ इब्रानी पद से सम्भवतः स्वर्गीय प्राणी अभिप्रेत हैं।
    reason: मूल पद की व्यापकता तथा प्रसंग में सम्भावित स्वर्गीय पहचान को सुरक्षित रखना।
lexical_decisions:
- source_word: קְרָא נָא
  choice: ज़रा पुकारकर देख
  rationale: आज्ञार्थक क्रिया और आग्रहसूचक נָא को विवादात्मक चुनौती के रूप में स्वाभाविक हिन्दी में व्यक्त करता है; इससे मूल की तात्कालिकता रहती है, पर अनावश्यक भावनात्मक तीव्रता नहीं जुड़ती।
- source_word: הֲיֵשׁ עוֹנֶךָ
  choice: क्या कोई है जो तुझे उत्तर देगा?
  rationale: अस्तित्ववाचक प्रश्न और उत्तर देने वाले के कृदन्तीय रूप को सहज हिन्दी उपवाक्य में रखता है तथा आलंकारिक प्रश्न का बल बनाए रखता है।
- source_word: וְאֶל־מִי מִקְּדֹשִׁים
  choice: और पवित्र जनों में से ... किसकी ओर
  rationale: מִן को समूह में से चयन के रूप में व्यक्त किया गया है। 'पवित्र जन' मूल के substantival plural की व्यापकता बनाए रखता है और मुख्य पाठ में उनकी पहचान को पूरी तरह निश्चित नहीं करता।
- source_word: תִּפְנֶה
  choice: तू ... फिरेगा
  rationale: פנה के मूल 'ओर फिरना' रूपक को सुरक्षित रखता है; प्रसंग में सहायता या उत्तर के लिए किसी की ओर जाने का भाव स्वतः स्पष्ट है।
theological_decisions:
- issue: מִקְּדֹשִׁים की पहचान
  choice: मुख्य पाठ में 'पवित्र जनों' रखा गया, और पादटिप्पणी में सम्भावित स्वर्गीय पहचान बताई गई।
  alternative: '''पवित्र प्राणी'', ''संत'', या सीधे ''स्वर्गदूत'''
  rationale: अय्यूब के प्रसंग में सम्भवतः स्वर्गीय पवित्र प्राणी अभिप्रेत हैं, किन्तु 'स्वर्गदूत' कहना मूल से अधिक निश्चित होगा और 'संत' बाद की धार्मिक धारणाएँ ला सकता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और बोलचाल में समझ आने वाली हिन्दी। एलीपज़ द्वारा अय्यूब को सीधे संबोधन के अनुरूप एकवचन 'तू/तुझे' रखा गया है। 'ज़रा पुकारकर देख' व्यंग्यपूर्ण चुनौती को स्वाभाविक ढंग से व्यक्त करता है।
