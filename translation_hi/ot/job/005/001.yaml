review_pass:
  verdict: revise
  source_fidelity: Draft's two rhetorical questions and the sense of answering/turning are substantially faithful. However, “ज़रा पुकारकर देख” adds the trial-like sense of “try and see,” which is not expressed by קְרָא־נָא, and “पवित्र जन” ordinarily suggests human persons in modern Hindi, obscuring the likely celestial referent of מִקְּדֹשִׁים.
  naturalness: The direct singular address and rhetorical cadence are natural. “अब पुकार” is more concise and accurately conveys the urgent particle נא without adding an action absent from the Hebrew. “किसकी ओर मुड़ेगा” is a natural Hindi rendering of turning toward someone.
  terminology: “पवित्र प्राणियों” best avoids importing the human/saint connotation of “पवित्र जनों,” while retaining the source expression's broad designation. The note preserves “पवित्र जन” and “संत” as alternatives and states the contextual likelihood of heavenly beings without making it a categorical assertion.
  issues:
  - severity: medium
    issue: “ज़रा पुकारकर देख” adds “देख” (‘try/see’).
    rationale: The Hebrew imperative plus נא means ‘call now/please call’; it does not explicitly include testing whether the call succeeds.
  - severity: medium
    issue: “पवित्र जनों” can be read primarily as holy human persons.
    rationale: In this Job context the holy ones likely are heavenly beings. A broader nonhuman-capable Hindi term in the main text better reflects the contextual referent, while a footnote can retain lexical alternatives.
  revised_text: अब पुकार—क्या कोई है जो तुझे उत्तर देगा? और पवित्र प्राणियों[a] में से तू किसकी ओर मुड़ेगा?
