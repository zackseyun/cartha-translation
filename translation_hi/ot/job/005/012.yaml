  text: He frustrates the schemes of the crafty, so that their hands accomplish no success.
translation:
  language: hi
  text: 'वह धूर्तों की योजनाएँ विफल कर देता है,

    जिससे उनके हाथों कोई सफलता नहीं होती।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵפֵר
  choice: विफल कर देता है
  rationale: हिफ़ील कृदंत यहाँ योजनाओं को निष्फल करने या सफल न होने देने का भाव व्यक्त करता है।
- source_word: מַחְשְׁבוֹת עֲרוּמִים
  choice: धूर्तों की योजनाएँ
  rationale: מַחְשְׁבוֹת का अर्थ योजनाएँ/युक्तियाँ है, और प्रसंग में עֲרוּמִים नकारात्मक अर्थ में चतुर या कपटी लोगों को दर्शाता है; ‘धूर्त’ दोनों भाव समेटता है।
- source_word: יְדֵיהֶם
  choice: उनके हाथ
  rationale: मूल पाठ के मानवीकरण और काव्यात्मक चित्र को बनाए रखा गया है; हाथ कार्य करने की सामर्थ्य का संकेत हैं।
- source_word: תּוּשִׁיָּה
  choice: सफलता
  rationale: यह शब्द प्रभावी उपलब्धि, ठोस परिणाम, व्यावहारिक सामर्थ्य या सूझ-बूझ का भाव दे सकता है। यहाँ योजनाओं के विफल होने के परिणाम के रूप में ‘सफलता’ प्रसंगानुकूल है और मूल की व्यापकता को अनावश्यक रूप से किसी एक तकनीकी अर्थ में सीमित नहीं करता।
