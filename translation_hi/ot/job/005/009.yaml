lexical_decisions:
- source_word: עֹשֶׂה
  choice: जो ... करता है
  rationale: यह काल (Qal) का कृदंत है और प्रसंग में परमेश्वर का वर्णन करने वाले संबंधवाचक उपवाक्य के रूप में प्रयुक्त हुआ है। हिंदी में ‘जो ... करता है’ स्वाभाविक रूप से इस बल को व्यक्त करता है।
- source_word: גְדֹלוֹת
  choice: महान काम
  rationale: बहुवचन विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है। ‘महान काम’ सीधा, सहज और ‘महान बातें’ की अपेक्षा कृत्यों के संदर्भ में अधिक स्वाभाविक है।
- source_word: וְאֵין חֵקֶר
  choice: जिनकी थाह नहीं पाई जा सकती
  rationale: इब्रानी वाक्यांश का शाब्दिक अर्थ है कि खोज या जाँच का कोई अंत/साधन नहीं है। ‘थाह नहीं पाई जा सकती’ उसकी अगम्यता को सहज आधुनिक हिंदी में व्यक्त करता है, बिना उसे केवल एक विशेषण में समेटे।
- source_word: נִפְלָאוֹת
  choice: अद्भुत काम
  rationale: यह शब्द असाधारण और विस्मयकारी कृत्यों को सूचित करता है। ‘अद्भुत काम’ सामान्य पाठक के लिए स्पष्ट है और पहले अर्धपद के ‘महान काम’ के साथ काव्यात्मक समानांतरता रखता है।
- source_word: עַד אֵין מִסְפָּר
  choice: इतने ... कि उनकी गिनती नहीं हो सकती
  rationale: यह मुहावरा असंख्यता व्यक्त करता है। चुना हुआ रूप हिंदी में स्वाभाविक है और मूल के ‘कोई गिनती नहीं’ वाले भाव को स्पष्ट बनाए रखता है।
