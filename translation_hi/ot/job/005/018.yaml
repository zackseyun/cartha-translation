  text: כִּ֤י ה֣וּא יַכְאִ֣יב וְ/יֶחְבָּ֑שׁ יִ֝מְחַ֗ץ ו/יד/ו תִּרְפֶּֽינָה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/018.yaml
  text: For he causes pain[a], but he binds up; he shatters, but his hands heal.
translation:
  language: hi
  text: क्योंकि वही पीड़ा देता है, पर पट्टी भी बाँधता है; वह कुचलता है, पर उसके हाथ चंगा करते हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘उसका हाथ’ एकवचन है, लेकिन ‘चंगा करते हैं’ क्रिया बहुवचन में है। इसलिए इसका अनुवाद ‘उसका हाथ चंगा करता है’ भी किया जा सकता है।
    reason: इब्रानी में संज्ञा और क्रिया के वचन का असामान्य मेल तथा संभावित वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ इस संबंध को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: הוּא
  choice: वही
  rationale: स्वतंत्र सर्वनाम के बल को ‘वही’ से व्यक्त किया गया है, बिना वाक्य को अनावश्यक रूप से भारी बनाए।
- source_word: יַכְאִיב
  choice: पीड़ा देता है
  rationale: हिफ़ील रूप का सीधा अर्थ पीड़ा पहुँचाना है; यह ‘घायल करता है’ जैसी अधिक ठोस छवि जोड़े बिना दैवी कर्तृत्व को स्पष्ट रखता है।
- source_word: וְיֶחְבָּשׁ
  choice: पर पट्टी भी बाँधता है
  rationale: חבש चोट पर पट्टी बाँधने या उसे बाँधकर सँभालने का बोध देता है। काव्यात्मक विरोध को स्पष्ट करने के लिए וְ को ‘पर’ कहा गया है; ‘भी’ दोनों क्रियाओं के एक ही कर्ता को सहज रूप से उभारता है।
- source_word: יִמְחַץ
  choice: वह चूर करता है
  rationale: מחץ कुचलने या प्रबल आघात से तोड़ने का तीव्र भाव रखता है; ‘चूर करता है’ काव्य की कठोरता और आगे आने वाली चंगाई की छवि दोनों से मेल खाता है।
- source_word: וְיָדוֹ
  choice: पर उसका हाथ
  rationale: मसोरेटिक लिखित रूप में संज्ञा एकवचन ‘उसका हाथ’ है; उसे मुख्य पाठ में बनाए रखा गया है, यद्यपि आगे की क्रिया बहुवचन है।
- source_word: תִּרְפֶּינָה
  choice: चंगा करता है
  rationale: רפא का मूल अर्थ चंगा करना है। हिंदी में एकवचन ‘हाथ’ के साथ स्वाभाविक वचन-सामंजस्य रखा गया है, जबकि इब्रानी के असामान्य एकवचन-संज्ञा/बहुवचन-क्रिया मेल को पादटिप्पणी में बताया गया है।
theological_decisions:
- issue: पीड़ा और पुनर्स्थापना दोनों में परमेश्वर का कर्तृत्व
  choice: एक ही कर्ता को पीड़ा देने, चूर करने, पट्टी बाँधने और चंगा करने वाला सीधे कहा गया है।
  alternative: पहली क्रियाओं को नरम करके ‘पीड़ा होने देता है’ या केवल अप्रत्यक्ष अनुमति के रूप में प्रस्तुत करना।
  rationale: इब्रानी पाठ दोनों प्रकार की क्रियाएँ सीधे उसी के साथ जोड़ता है। अनुवाद इस धर्मवैज्ञानिक तनाव को कम या हल नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण काव्यात्मक गद्य। ‘पट्टी बाँधता है’ उपचार की ठोस छवि रखता है और ‘चूर करता है’ मूल की तीव्रता बनाए रखता है। मुख्य पाठ में इब्रानी ‘उसका हाथ’ सुरक्षित रखा गया है; वचन-संबंधी अस्पष्टता पादटिप्पणी में स्पष्ट है।
