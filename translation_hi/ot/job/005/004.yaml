  yaml_path: translation/ot/job/005/004.yaml
  text: His children are far from safety[a], and they are crushed in the gate[b], with no one to rescue them.
translation:
  language: hi
  text: उसके बच्चे सुरक्षा[a] से दूर हैं; वे नगर के फाटक[b] पर कुचल दिए जाते हैं, और उन्हें बचाने वाला कोई नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘छुटकारे’ अथवा ‘उद्धार’ से।
    reason: lexical_alternative
  - marker: b
    text: नगर का फाटक न्यायिक सुनवाई और सार्वजनिक निर्णयों का प्रचलित स्थान था।
    reason: cultural_note
lexical_decisions:
- source_word: יִרְחֲקוּ
  choice: दूर रहते हैं
  rationale: רחק दूरी या अलगाव की अवस्था बताता है। यहाँ अपूर्ण क्रिया-रूप को प्रसंग में सामान्य दशा के रूप में स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: בָנָיו
  choice: उसके बच्चे
  rationale: בנים का अर्थ संकीर्ण रूप से ‘बेटे’ और व्यापक रूप से ‘बच्चे’ हो सकता है। यहाँ संतान का सामान्य उल्लेख है, इसलिए ‘बच्चे’ उपयुक्त है।
- source_word: מִיֶּשַׁע
  choice: सुरक्षा
  rationale: יֶשַׁע में सुरक्षा, छुटकारे और उद्धार का अर्थ-क्षेत्र है। इस व्यावहारिक संकट के प्रसंग में ‘सुरक्षा’ सहज है, जबकि अन्य संभावित अर्थ पाद-टिप्पणी में रखे गए हैं।
- source_word: וְיִדַּכְּאוּ
  choice: कुचल दिए जाते हैं
  rationale: דכא कुचले या तोड़े जाने का प्रबल भाव देता है। कर्मवाच्य हिन्दी मूल के अर्थ और पीड़ित अवस्था को बनाए रखती है।
- source_word: בַשַּׁעַר
  choice: नगर के फाटक पर
  rationale: שׁער यहाँ केवल द्वार नहीं, बल्कि नगर में न्याय और सार्वजनिक निर्णय के स्थान का संकेत देता है। ‘पर’ आधुनिक हिन्दी में इस स्थान के लिए स्वाभाविक है।
- source_word: וְאֵין מַצִּיל
  choice: उन्हें बचाने वाला कोई नहीं होता
  rationale: אין के साथ participle מַצִּיל किसी बचाने या छुड़ाने वाले के पूर्ण अभाव को व्यक्त करता है। यह हिन्दी रूप उस अस्तित्ववाचक बल को स्पष्ट और सहज रखता है।
theological_decisions:
- issue: יֶשַׁע का अर्थ-क्षेत्र
  choice: मुख्य पाठ में ‘सुरक्षा’
  alternative: ‘छुटकारा’ या ‘उद्धार’
  rationale: प्रसंग सामाजिक और व्यावहारिक संकट का है; फिर भी मूल शब्द में छुटकारे/उद्धार की वास्तविक अर्थ-संभावना है, इसलिए उसे पाद-टिप्पणी में सुरक्षित रखा गया है और किसी विशेष धर्मवैज्ञानिक अर्थ तक सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली रखी गई है। ‘नगर के फाटक पर’ सांस्कृतिक संदर्भ को संकेत देता है, जबकि पाद-टिप्पणी उसके न्यायिक महत्व को स्पष्ट करती है। अंग्रेज़ी परामर्श-पाठ में पाद-टिप्पणी चिह्नों और उनकी विषयवस्तु का क्रम असंगत था; हिन्दी मसौदे में ‘सुरक्षा’ के बाद lexical note [a] और ‘फाटक’ के बाद cultural note [b] रखा गया है।
