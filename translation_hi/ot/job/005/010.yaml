    text: या “गलियों पर” अथवा “खुले प्रदेश पर।” इब्रानी חוּצוֹת खुले स्थानों, गलियों या बाहर फैले विस्तृत क्षेत्रों के लिए प्रयुक्त हो सकता है; यहाँ सन्दर्भ खुले मैदानों की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנֹּתֵן
  choice: जो ... देता है
  rationale: लेखयुक्त क़ाल कृदन्त यहाँ परमेश्वर का वर्णन जारी रखता है। हिन्दी में सम्बन्धवाचक वाक्यांश सहज है और मूल का कृदन्तीय बल बनाए रखता है।
- source_word: מָטָר
  choice: वर्षा
  rationale: यह वर्षा के लिए सामान्य शब्द है; ‘वर्षा’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: עַל־פְּנֵי אָרֶץ
  choice: धरती पर
  rationale: शाब्दिक अर्थ ‘धरती/भूमि के मुख पर’ है। हिन्दी में ‘धरती के मुख पर’ अस्वाभाविक है, इसलिए सतह का भाव ‘पर’ में स्वाभाविक रूप से व्यक्त किया गया है। कथन का सामान्य दायरा देखते हुए ‘धरती’ चुना गया है।
- source_word: וְשֹׁלֵחַ
  choice: और ... भेजता है
  rationale: यह पहले कृदन्त के समानान्तर क़ाल कृदन्त है; ‘भेजता है’ उस समानान्तर क्रिया-रचना को स्वाभाविक हिन्दी में रखता है।
- source_word: מַיִם
  choice: जल
  rationale: इब्रानी शब्द रूप की दृष्टि से बहुवचन है, पर सामान्यतः सामूहिक द्रव्यवाचक अर्थ देता है। ‘जल’ यहाँ संक्षिप्त, स्वाभाविक और काव्यात्मक है।
- source_word: עַל־פְּנֵי חוּצוֹת
  choice: खुले मैदानों पर
  rationale: חוּצוֹת खुले स्थानों, बाहर के विस्तृत क्षेत्रों, अथवा गलियों/चौकों को सूचित कर सकता है। वर्षा और धरती के प्राकृतिक सन्दर्भ में ‘खुले मैदान’ सबसे उपयुक्त है, जबकि पादटिप्पणी वास्तविक शब्दार्थगत विकल्प सुरक्षित रखती है।
theological_decisions:
- issue: אָרֶץ का दायरा
  choice: धरती
  alternative: भूमि/देश
  rationale: यहाँ परमेश्वर की वर्षा देने वाली सामान्य प्रबन्धकारी क्रिया का वर्णन है, किसी खास भूभाग का नहीं। फिर भी इब्रानी शब्द में ‘भूमि’ का अर्थ सम्भव है, इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और हल्का काव्यात्मक रूप। दोनों पंक्तियों की समानान्तरता ‘देता है/भेजता है’ से सुरक्षित रखी गई है; मूल के ‘मुख’ को हिन्दी में अस्वाभाविक ढंग से दोहराने के बजाय ‘पर’ में समाहित किया गया है।
