translation:
  language: hi
  text: 'जो धरती[a] पर वर्षा देता है,

    और खुले मैदानों[b] पर जल भेजता है,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “भूमि पर।” इब्रानी אֶרֶץ का अर्थ सन्दर्भ के अनुसार “धरती” या “भूमि” हो सकता है।
    reason: lexical_alternative
