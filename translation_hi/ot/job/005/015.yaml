base_translation:
  language: en
  yaml_path: translation/ot/job/005/015.yaml
  text: But he saves the needy from the sword of their mouth[a], and from the hand of the strong.
translation:
  language: hi
  text: पर वह दरिद्र को उनके मुँह की तलवार से[a] और बलवान के हाथ से बचाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह दरिद्र को तलवार से, उनके मुँह से और बलवान के हाथ से बचाता है।” इब्रानी वाक्य-विन्यास संक्षिप्त है; इसलिए “उनके मुँह से” को “तलवार” से जोड़ने के बजाय अलग भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּשַׁע
  choice: बचाता है
  rationale: क्रिया ישׁע उद्धार या बचाव का भाव देती है। प्रसंग में परमेश्वर निहित कर्ता है; एलीपज के काव्यात्मक सामान्य कथन में वर्तमान काल स्वाभाविक है।
- source_word: מֵחֶרֶב מִפִּיהֶם
  choice: उनके मुँह की तलवार से
  rationale: संक्षिप्त इब्रानी पदबंध को विनाशकारी वाणी की सजीव उपमा के रूप में रखा गया है। מִפִּיהֶם का शाब्दिक अर्थ ‘उनके मुँह से’ भी हो सकता है, इसलिए वैकल्पिक विन्यास पादटिप्पणी में दिया गया है।
- source_word: וּמִיַּד
  choice: और ... के हाथ से
  rationale: יָד का मूल अर्थ ‘हाथ’ है और यहाँ सामर्थ्य या नियंत्रण का बिंब देता है; ठोस काव्यात्मक चित्र सुरक्षित रखा गया है।
- source_word: חָזָק
  choice: बलवान
  rationale: विशेषण यहाँ संज्ञा के रूप में प्रयुक्त होकर शक्तिशाली व्यक्ति या वर्ग को सूचित करता है।
- source_word: אֶבְיוֹן
  choice: दरिद्र
  rationale: यह शब्द आर्थिक और सामाजिक अभाव से ग्रस्त व्यक्ति को दर्शाता है। ‘दरिद्र’ संक्षिप्त, गरिमापूर्ण और ‘बलवान’ के साथ स्पष्ट विरोध प्रस्तुत करता है।
theological_decisions:
- issue: ‘मुँह की तलवार’ का रूपक
  choice: विनाशकारी वाणी के रूपक को ‘उनके मुँह की तलवार’ कहकर सुरक्षित रखा गया।
  alternative: ‘तलवार से, उनके मुँह से’ अथवा अर्थ खोलकर ‘उनकी घातक बातों से’।
  rationale: इब्रानी पाठ ‘तलवार’ और ‘मुँह’ को सघन काव्यात्मक ढंग से जोड़ता है। रूपक को बनाए रखना साहित्यिक शक्ति और वास्तविक व्याकरणिक तनाव दोनों को सुरक्षित रखता है; वैकल्पिक संबंध पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण काव्यात्मक गद्य। ‘मुँह की तलवार’ मूल रूपक को बनाए रखता है, जबकि पादटिप्पणी इब्रानी संरचना की वास्तविक अस्पष्टता बताती है।
