lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह कथन की ओर विशेष ध्यान खींचनेवाला संवाद-सूचक है; ‘देखो’ आधुनिक हिन्दी में स्वाभाविक रहते हुए उसका बल बनाए रखता है।
- source_word: אַשְׁרֵי
  choice: धन्य है
  rationale: यह ज्ञान-साहित्य का आशीर्वचन-सूत्र है, जो केवल भावनात्मक प्रसन्नता नहीं बल्कि ईर्ष्या करने योग्य कल्याणमय दशा व्यक्त करता है।
- source_word: אֱנוֹשׁ
  choice: वह मनुष्य
  rationale: यहाँ शब्द सामान्य रूप से एक नश्वर मानव के लिए प्रयुक्त प्रतिनिधिक एकवचन है; ‘मनुष्य’ हिन्दी में उसके व्यापक अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יוֹכִיחֶנּוּ
  choice: जिसे परमेश्वर सुधारता है
  rationale: इस प्रसंग में क्रिया दोष दिखाकर सुधारने या डाँटने का भाव रखती है। ‘सुधारता है’ अगले पदबंध की शिक्षात्मक ताड़ना से उसका संबंध बनाए रखता है।
- source_word: אֱלוֹהַּ
  choice: परमेश्वर
  rationale: अय्यूब में प्रयुक्त इस ईश्वरीय पदनाम का मानक और स्वाभाविक हिन्दी रूप।
- source_word: מוּסַר
  choice: ताड़ना
  rationale: ज्ञान-साहित्य में यह शब्द सुधारनेवाली शिक्षा, अनुशासन या दंडात्मक चेतावनी का विस्तृत भाव रखता है। ‘ताड़ना’ यहाँ सुधार के पीड़ादायक किंतु शिक्षात्मक पक्ष को संक्षेप में व्यक्त करती है।
- source_word: שַׁדַּי
  choice: सर्वशक्तिमान
  rationale: ‘शद्दाई’ का परंपरागत अर्थपूर्ण हिन्दी अनुवाद, विशेषकर अय्यूब के संदर्भ में।
- source_word: אַל תִּמְאָס
  choice: तुच्छ न जानो
  rationale: क्रिया किसी वस्तु को घृणित या मूल्यहीन मानकर अस्वीकार करने का भाव देती है; यह वाक्यांश उस नैतिक बल को बनाए रखता है।
theological_decisions:
- issue: אֱנוֹשׁ का प्रतिनिधिक एकवचन
  choice: वह मनुष्य
  alternative: वह व्यक्ति / वह नश्वर मनुष्य
  rationale: हिब्रू में एकवचन मानव-संज्ञा सामान्य ज्ञानोक्ति के रूप में आई है। ‘मनुष्य’ इसे किसी विशेष पुरुष तक सीमित किए बिना प्रतिनिधिक रूप में रखता है।
- issue: ईश्वरीय सुधार और מוּסַר का संबंध
  choice: सुधारता ... ताड़ना
  alternative: डाँटता ... अनुशासन / शिक्षा देता ... सुधार
  rationale: पद पीड़ादायक ईश्वरीय सुधार को धन्यता से जोड़ता है। चुने हुए शब्द इस तनाव को बनाए रखते हैं, पर हिब्रू से अधिक कठोर दंड का अर्थ आरोपित नहीं करते।
- issue: וּ־ के तार्किक संबंध का अनुवाद
  choice: इसलिए
  alternative: और
  rationale: हिब्रू संयोजक औपचारिक रूप से ‘और’ है, पर दूसरे खंड की निषेधात्मक सीख पहले कथन से निष्कर्ष के रूप में निकलती है। ‘इसलिए’ हिन्दी में उस निहित संबंध को स्पष्ट और स्वाभाविक बनाता है।
