  text: देखो[a], धन्य[b] है वह मनुष्य[c] जिसे परमेश्वर सुधारता[d] है; इसलिए सर्वशक्तिमान[f] की ताड़ना[e] को तुच्छ न जानो।
  philosophy: optimal-equivalence
