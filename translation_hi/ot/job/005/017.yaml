  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘देखो’ कथन का जोर बनाए रखता है; ‘धन्य’ ज्ञान-साहित्य की आशीर्वचन शैली को सुरक्षित रखता है। ‘ताड़ना’ को पादटिप्पणी में व्यापक अर्थ-क्षेत्र के साथ स्पष्ट किया गया है, ताकि इसे केवल दंड न समझा जाए।
