  text: देखो, हमने इसकी जाँच-पड़ताल की है; बात ऐसी ही है। इसे सुनो, और तुम स्वयं इसे जान लो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: वक्ता की निष्कर्षात्मक बात पर ध्यान खींचने वाला स्वाभाविक और सीधा संबोधन।
- source_word: חֲקַרְנוּהָ
  choice: हमने इसकी पूरी जाँच की है
  rationale: חקר के खोजबीन और सावधानी से जाँचने के भाव को व्यक्त करता है; स्त्रीलिंग प्रत्यय का संदर्भ पिछली शिक्षा अथवा इस बात से है।
- source_word: כֶּן הִיא
  choice: यह सच है
  rationale: वक्ता के इस दावे को स्वाभाविक हिन्दी में व्यक्त करता है कि जाँच का निष्कर्ष यथार्थ अथवा ऐसा ही है।
- source_word: שְׁמָעֶנָּה
  choice: इसे सुनो
  rationale: स्त्रीलिंग कर्म-प्रत्यय सहित आज्ञार्थक रूप को स्पष्ट रखता है और आशय केवल ध्वनि सुनने तक सीमित नहीं करता।
- source_word: וְאַתָּה דַע לָךְ
  choice: और तुम स्वयं इसे जान लो
  rationale: स्वतंत्र सर्वनाम אַתָּה के बल तथा לָךְ के व्यक्तिगत आत्मसात के भाव को 'तुम स्वयं' से बनाए रखता है।
theological_decisions:
- issue: एलिपज के निष्कर्ष की सत्यता
  choice: ‘यह सच है’ को एलिपज का अपना दावा रहने दिया गया है
  alternative: कथावाचक द्वारा प्रमाणित परम सत्य के रूप में प्रस्तुत करना
  rationale: पद संवाद के भीतर एलिपज का कथन है; अनुवाद उसके दावे को स्पष्ट करता है, पर उसे कथावाचक की स्वतंत्र पुष्टि नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सीधा, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध निष्कर्षात्मक संबोधन। ‘तुम स्वयं’ मूल के स्पष्ट אַתָּה और לָךְ पर पड़े बल को सुरक्षित रखता है।
