review_pass:
  verdict: revise
  source_fidelity: The draft correctly reflects the explanatory כִּי, the generic 'fool' and 'simple person,' and the destructive force of both clauses. However, 'खीझ' can suggest comparatively mild annoyance and does not adequately convey כַּעַשׂ here, which denotes anger/vexation as a ruinous passion. The expanded idiom 'मृत्यु के मुँह में पहुँचा देती है' is intelligible but is less direct than the Hebrew's causative 'causes to die.'
  naturalness: The Hindi is generally fluent and appropriately proverbial. Replacing 'खीझ' with 'क्रोध' gives a more idiomatic and weightier parallel, and using the same direct lethal expression in both clauses retains the terse parallelism of the source.
  terminology: '''मूर्ख'' suitably carries the wisdom-literature sense of a morally/practically foolish person, while ''भोला'' naturally conveys the inexperienced, easily-led פֹּתֶה. ''ईर्ष्या'' is appropriate for קִנְאָה; ''डाह'' is a closer Hindi lexical alternative for the footnote than ''जलन,'' which may also mean a physical burning sensation.'
  issues:
  - severity: medium
    issue: '''खीझ'' understates כַּעַשׂ.'
    rationale: In this context, parallel to destructive קִנְאָה and followed by a verb of killing, the Hebrew denotes serious anger/vexation rather than ordinary irritation or pique.
  - severity: low
    issue: The second clause is unnecessarily expanded idiomatically.
    rationale: '''मृत्यु के मुँह में पहुँचा देती है'' preserves a destructive outcome but adds imagery not present in the Hebrew. ''मार डालती है'' is direct, natural, and adequately conveys the Hiphil causative.'
