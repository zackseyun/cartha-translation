  yaml_path: translation/ot/job/005/002.yaml
  text: For vexation kills the fool[a], and jealousy puts the simple to death.
translation:
  language: hi
  text: क्योंकि क्रोध मूर्ख को मार डालता है, और ईर्ष्या भोले को मार डालती है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “डाह।” इब्रानी शब्द ईर्ष्या या डाह, दोनों भावों को व्यक्त कर सकता है; यहाँ आशय एक विनाशकारी मनोभाव से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है और तर्क का प्रवाह बनाए रखता है।
- source_word: לֶאֱוִיל
  choice: मूर्ख को
  rationale: यह केवल कम बुद्धि वाले व्यक्ति नहीं, बल्कि नैतिक और व्यावहारिक रूप से मूर्ख व्यक्ति को सूचित करता है। हिंदी में एकवचन यहाँ पूरे वर्ग का प्रतिनिधित्व करता है।
- source_word: יַהֲרָג
  choice: मार डालती है
  rationale: ज्ञान-साहित्य के सामान्य सत्य को वर्तमानकालीन ढंग से व्यक्त करता है और क्रिया की घातक शक्ति बनाए रखता है।
- source_word: כָּעַשׂ
  choice: खीझ
  rationale: यह शब्द भीतर की उत्तेजना, झुँझलाहट, रोष या क्षोभ को सूचित कर सकता है। 'खीझ' आधुनिक और सहज है तथा यहाँ विनाशकारी मनोभाव को व्यक्त करती है।
- source_word: וּפֹתֶה
  choice: और ... भोले को
  rationale: פֹּתֶה ज्ञान-साहित्य में अनुभवहीन और आसानी से बहकने वाले व्यक्ति को दर्शाता है। 'भोला' स्वाभाविक हिंदी है और बौद्धिक अक्षमता का अनुचित संकेत नहीं देता।
- source_word: תָּמִית
  choice: मृत्यु के मुँह में पहुँचा देती है
  rationale: मूल हिफ़ील रूप की कारकता को स्वाभाविक हिंदी में व्यक्त करता है और पहली पंक्ति के 'मार डालती है' से काव्यात्मक विविधता रखता है।
- source_word: קִנְאָה
  choice: ईर्ष्या
  rationale: खीझ के समानांतर यह विनाशकारी आवेग को दर्शाता है। हिंदी में 'ईर्ष्या' इस नकारात्मक अर्थ के लिए सबसे स्वाभाविक है; 'जलन' भी संभव है।
