translation:
  language: hi
  text: 'वह दीनों को ऊँचे स्थान पर स्थापित करता है,

    और शोक करने वाले[a] उद्धार[b] के लिए ऊँचे उठाए जाते हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘जो अँधकारमय हैं’ अथवा ‘मातम करने वाले’; हिब्रू शब्द अँधेरे के बिंब से शोक और उदासी का भाव व्यक्त करता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘छुटकारा’ अथवा ‘सुरक्षा’।
    reason: lexical_alternative
lexical_decisions:
- source_word: לָשׂוּם
  choice: बैठाता है
  rationale: שׂוּם का अर्थ रखना या स्थापित करना है। पिछले संदर्भ से जुड़ी इन्फिनिटिव रचना को हिन्दी में स्वाभाविक मुख्य क्रिया के रूप में व्यक्त किया गया है।
- source_word: שְׁפָלִים
  choice: दीनों
  rationale: यह उन लोगों को दर्शाता है जो नीची या दबी हुई दशा में हैं; ‘दीन’ सामाजिक और परिस्थितिजन्य दोनों अर्थों को खुला रखता है।
- source_word: לְמָרוֹם
  choice: ऊँचे स्थान पर
  rationale: מָרוֹם ऊँचाई या ऊँचे स्थान का चित्र प्रस्तुत करता है और ‘दीनों’ के साथ स्पष्ट विरोध बनाता है।
- source_word: וְקֹדְרִים
  choice: शोक करनेवाले
  rationale: קדר का कृदन्त रूप अँधेरा या उदास होने और शोक करने—दोनों भाव जगा सकता है। मुख्य पाठ में शोक का अनुभव स्वाभाविक है, जबकि अँधेरे का बिंब पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: שָׂגְבוּ
  choice: ऊँचे उठते हैं
  rationale: क्रिया ऊँचा, सुरक्षित पहुँच से परे, या प्रतिष्ठित होने का भाव देती है। यह पहले चरण की ऊँचाई वाली समानांतर छवि बनाए रखती है और हिन्दी में कर्तृवाच्य रूप के द्वारा हिब्रू के काल रूप के निकट रहती है।
- source_word: יֶשַׁע
  choice: उद्धार
  rationale: יֶשַׁע बचाव, सुरक्षा और उद्धार की व्यापक अर्थ-सीमा रखता है। ‘उद्धार’ इस विस्तार और धार्मिक प्रतिध्वनि को बनाए रखता है, जबकि यहाँ तत्काल संकट से छुटकारे का अर्थ भी संभव है।
theological_decisions:
- issue: बुद्धि-साहित्य के संदर्भ में יֶשַׁע का अनुवाद
  choice: उद्धार
  alternative: छुटकारा; सुरक्षा
  rationale: ‘उद्धार’ मूल शब्द की व्यापकता को बनाए रखता है, पर पद को किसी बाद की विशिष्ट धर्मवैज्ञानिक व्यवस्था तक सीमित नहीं करता। पादटिप्पणी तत्कालिक बचाव और सुरक्षा के अर्थ भी स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण काव्यात्मक गद्य रखा गया है। ‘दीन’ और ‘ऊँचे स्थान’ मूल के उलटाव तथा ऊँचाई के बिंब को बनाए रखते हैं; पंक्ति-विभाजन हिब्रू समानांतरता को स्पष्ट करता है।
