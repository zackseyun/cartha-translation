  text: אֲֽנִי רָ֭אִיתִי אֱוִ֣יל מַשְׁרִ֑ישׁ וָ/אֶקּ֖וֹב נָוֵ֣/הוּ פִתְאֹֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/003.yaml
  text: I have seen a fool taking root[a], and suddenly I cursed his dwelling.
translation:
  language: hi
  text: मैंने मूर्ख को जड़ें जमाते देखा है, और मैंने अचानक उसके निवास को शाप दिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैंने उसके निवास को शापित घोषित किया,” अथवा, “मैंने उसके निवास को विनाश के लिए नियत बताया।” इब्रानी क्रिया को सीधे शाप देने के अर्थ में, अथवा न्याय की घोषणा के रूप में समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: אֲנִי
  choice: मैंने
  rationale: स्पष्ट प्रथम-पुरुष सर्वनाम के बल को बनाए रखा गया है; हिन्दी के सकर्मक पूर्ण पक्ष में कर्ता के साथ ‘ने’ स्वाभाविक है।
- source_word: רָאִיתִי
  choice: देखा है
  rationale: पूर्ण क्रिया वक्ता के अनुभव की गवाही देती है; ‘देखा है’ इस अनुभवजन्य बल को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אֱוִיל
  choice: मूर्ख
  rationale: ज्ञान-साहित्य में यह केवल कम बुद्धि वाला व्यक्ति नहीं, बल्कि नैतिक और व्यावहारिक विवेक से रहित व्यक्ति की श्रेणी को दर्शाता है; ‘मूर्ख’ इसे संक्षेप में बनाए रखता है।
- source_word: מַשְׁרִישׁ
  choice: जड़ पकड़ते
  rationale: हिफ़ील कृदंत जड़ जमाने अथवा स्थापित होने का चित्र देता है। ‘जड़ पकड़ना’ समृद्धि या स्थिरता के रूपक को सुरक्षित रखते हुए सहज हिन्दी है।
- source_word: וָאֶקּוֹב
  choice: मैंने … शाप दिया
  rationale: נקב का यहाँ सीधा शब्दार्थ शाप देना है। अनुवाद इसी प्रमुख अर्थ को रखता है, जबकि न्याय की घोषणा के रूप में इसे समझने की संभावना पाद-टिप्पणी में दी गई है।
- source_word: נָוֵהוּ
  choice: उसके निवास को
  rationale: נָוֶה घर, बसेरा या निवास-स्थान का अर्थ दे सकता है। ‘निवास’ व्यापक और गरिमापूर्ण है तथा अनावश्यक विशिष्टता नहीं जोड़ता।
- source_word: פִתְאֹם
  choice: अचानक
  rationale: यह क्रिया-विशेषण आकस्मिकता या तात्कालिकता व्यक्त करता है; इसे शाप देने वाली क्रिया के साथ रखा गया है।
theological_decisions:
- issue: וָאֶקּוֹב में वक्ता की प्रतिक्रिया का अर्थ
  choice: एलीपज कहता है कि मूर्ख को स्थापित होते देखकर उसने स्वयं उसके निवास को शाप दिया।
  alternative: वह उसके निवास को शापित घोषित करता है, अथवा उसे विनाश के लिए ठहराया हुआ पहचानता है।
  rationale: क्रिया का सीधा शब्दार्थ वास्तविक शापोच्चारण का समर्थन करता है, इसलिए मुख्य पाठ में वही रखा गया है। इससे शाप की किसी जादुई प्रभावकारिता का दावा नहीं किया जाता। संदर्भ में इसे न्याय-विषयक निरीक्षण या घोषणा मानने की संभावना वास्तविक है, इसलिए उसे पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘जड़ पकड़ना’ मूल रूपक को बनाए रखता है; ‘निवास’ घर-परिवार और बसेरे के व्यापक संकेत को बिना अधिक व्याख्या के व्यक्त करता है।
