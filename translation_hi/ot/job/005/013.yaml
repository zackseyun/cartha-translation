  yaml_path: translation/ot/job/005/013.yaml
  text: He catches the wise in their craftiness[c][b][a], and the counsel of the twisted is hurried along.
translation:
  language: hi
  text: वह बुद्धिमानों को उनकी धूर्तता में ही पकड़ लेता है[a], और कुटिलों[b] की योजना जल्दी ही आगे बढ़ा दी जाती है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह बुद्धिमानों को उनकी चतुराई के द्वारा पकड़ लेता है।” यहाँ इब्रानी शब्द का अर्थ कुछ प्रसंगों में सूझ-बूझ हो सकता है, पर इस प्रसंग में उसका भाव नकारात्मक है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “टेढ़े लोग”; या, “कपटी लोग।”
    reason: lexical_alternative
  - marker: c
    text: या, “जल्दी आगे बढ़ा दी जाती है” अथवा “उतावली कर दी जाती है।” प्रसंग में उनकी योजना के जल्दबाज़ी में निष्फल होने का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹכֵד
  choice: पकड़ लेता है
  rationale: लכד का काल-वाचक कृदन्त यहाँ प्रसंग से परमेश्वर की क्रिया बताता है। ‘पकड़ लेता है’ फँसाने अथवा धर लेने की छवि को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: חֲכָמִים
  choice: बुद्धिमानों को
  rationale: बहुवचन विशेषण यहाँ संज्ञा की तरह प्रयुक्त है। यह चयन उस विडंबना को बनाए रखता है कि बुद्धिमान समझे जाने वाले लोग स्वयं पकड़े जाते हैं।
- source_word: בְּעָרְמָם
  choice: उनकी धूर्तता में ही
  rationale: עָרְמָה कुछ प्रसंगों में चतुराई या सूझ-बूझ हो सकती है, पर यहाँ समानांतर पंक्ति और नकारात्मक प्रसंग नैतिक रूप से निंदनीय चालाकी का संकेत देते हैं। בְ का ‘में’ अर्थ पकड़ने की उसी युक्ति में फँसने की छवि को सुरक्षित रखता है।
- source_word: וַעֲצַת
  choice: और … की योजना
  rationale: עֵצָה का अर्थ सलाह, सम्मति या योजना हो सकता है। यहाँ षड्यंत्रकारी सोच के परिणाम की बात होने से ‘योजना’ स्वाभाविक है।
- source_word: נִפְתָּלִים
  choice: कुटिलों
  rationale: פתל से बना यह रूप टेढ़ेपन और कपटपूर्ण चरित्र की रूपकात्मक धारणा रखता है। ‘कुटिल’ आधुनिक हिन्दी में इस नैतिक अर्थ को संक्षेप और गरिमा के साथ व्यक्त करता है।
- source_word: נִמְהָרָה
  choice: जल्दबाज़ी में धकेल दी जाती है
  rationale: निफ़अल स्त्रीलिंग एकवचन रूप עֲצַת से मेल खाता है और उतावले ढंग से आगे बढ़ाए जाने का भाव देता है। यह अनुवाद कर्मवाच्य और जल्दबाज़ी दोनों को रखता है, पर मूल में सीधे न कही गई ‘विफलता’ को मुख्य पाठ में नहीं जोड़ता।
theological_decisions:
- issue: कृदन्त का निहित कर्ता
  choice: ‘वह’ से परमेश्वर को कर्ता के रूप में व्यक्त किया गया है।
  alternative: अनिश्चित कर्ता, जैसे ‘जो पकड़ता है’।
  rationale: इस पद में कर्ता स्पष्ट रूप से लिखा नहीं है, किंतु अय्यूब 5:9-16 के निकटवर्ती प्रसंग में परमेश्वर के कार्यों का वर्णन जारी है। हिन्दी वाक्य के लिए कर्ता व्यक्त करना स्वाभाविक है; ‘वह’ प्रसंग को आगे बढ़ाता है, नई धर्मवैज्ञानिक बात नहीं जोड़ता।
- issue: עָרְמָה और נִפְתָּלִים का नैतिक भाव
  choice: नकारात्मक नैतिक अर्थ—‘धूर्तता’ और ‘कुटिलों’।
  alternative: अधिक तटस्थ अर्थ—‘चतुराई’ और ‘पेचीदा लोगों’।
  rationale: परमेश्वर द्वारा योजनाओं को उलट देने वाले इस समानांतर कथन में दोनों शब्द तटस्थ बुद्धिमानी नहीं, बल्कि छलपूर्ण और टेढ़े आचरण को दर्शाते हैं।
- issue: נִמְהָרָה में परिणाम का अर्थ
  choice: मुख्य पाठ में जल्दबाज़ी से धकेले जाने का भाव रखा गया है, विफलता को स्पष्ट रूप से नहीं जोड़ा गया।
  alternative: ‘औंधे मुँह विफल हो जाती है’ या ‘शीघ्र अंत कर दी जाती है’।
  rationale: प्रसंग योजनाओं की निष्फलता की ओर संकेत करता है, लेकिन क्रिया का प्रत्यक्ष अर्थ शीघ्रता या उतावलेपन से संबंधित है। इसलिए धर्मवैज्ञानिक अथवा परिणामसूचक विस्तार को मुख्य पाठ में आरोपित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है। ‘बुद्धिमान’, ‘धूर्तता’, ‘कुटिल’ और ‘योजना’ सामान्य पाठक के लिए बोधगम्य होने के साथ गरिमापूर्ण भी हैं। दूसरे खंड में कुछ असामान्य कर्मवाच्य रचना मूल इब्रानी के रूप और उसकी अर्थगत अस्पष्टता को बचाने के लिए रखी गई है।
