base_translation:
  language: en
  yaml_path: translation/ot/job/005/019.yaml
  text: In six troubles he will deliver you[a]; even in seven[b], no evil will touch you.
translation:
  language: hi
  text: छह संकटों में वह तुम्हें छुड़ाएगा[a]; सात में भी कोई अनिष्ट तुम्हें नहीं छुएगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘छह ... सात’ इब्रानी कविता की एक अभिव्यक्ति है, जो बार-बार या पूरी तरह छुड़ाए जाने का भाव देती है; इसका अर्थ यह आवश्यक नहीं कि संकटों की सीमा ठीक सात ही हो।
    reason: cultural_note
  - marker: b
    text: या ‘कोई हानि तुम्हें नहीं छुएगी’ अथवा ‘कोई विपत्ति तुम तक नहीं पहुँचेगी।’
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/שֵׁשׁ
  choice: छः ... में
  rationale: संख्या के साथ ב को यहाँ परिस्थिति या संकटों की गिनती बताने वाले ‘में’ से व्यक्त किया गया है; यह स्थान-सूचक अर्थ नहीं देता।
- source_word: צָרוֹת
  choice: संकटों
  rationale: צָרוֹת विपत्ति, कष्ट या संकट की व्यापक दशाओं को दर्शाता है। ‘संकट’ आधुनिक हिन्दी में स्वाभाविक है और अर्थ को केवल शारीरिक पीड़ा तक सीमित नहीं करता।
- source_word: יַצִּילֶךָּ
  choice: वह तुम्हें छुड़ाएगा
  rationale: נצל का हिफ़ील रूप बचाने या छुड़ाने का अर्थ देता है। ‘छुड़ाएगा’ संकट से मुक्त करने का भाव और काव्यात्मक गरिमा बनाए रखता है।
- source_word: וּ/בְ/שֶׁבַע
  choice: सात में भी
  rationale: ‘छः... सात’ बढ़ती हुई संख्या का इब्रानी काव्यात्मक विधान है। ‘भी’ उसके चरमोत्कर्ष को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि मूल संख्याएँ बनी रहती हैं।
- source_word: לֹא יִגַּע
  choice: छू न सकेगा
  rationale: נגע का अर्थ छूना, पहुँच जाना या आघात करना हो सकता है। ‘छू न सकेगा’ मूल बिंब को बनाए रखते हुए सुरक्षा का आशय स्वाभाविक हिन्दी में देता है।
- source_word: בְּךָ
  choice: तुम्हें
  rationale: נגע के साथ ב प्रभावित व्यक्ति को चिह्नित करता है; हिन्दी में इसे ‘तुम्हें छूना’ के कर्म-रूप में स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: רָע
  choice: अनिष्ट
  rationale: רָע नैतिक बुराई के साथ हानि, विपत्ति या दुर्भाग्य भी दर्शा सकता है। इस प्रसंग में ‘अनिष्ट’ हानिकारक विपत्ति का अर्थ देता है, पर शब्द को किसी एक प्रकार की हानि तक सीमित नहीं करता।
theological_decisions:
- issue: ‘वह तुम्हें छुड़ाएगा’ में निहित कर्ता का संदर्भ
  choice: ‘वह’ रखा गया है।
  alternative: ‘परमेश्वर तुम्हें छुड़ाएगा।’
  rationale: संदर्भ में कर्ता परमेश्वर है, पर इस पद के इब्रानी पाठ में संज्ञा स्पष्ट रूप से नहीं दी गई; सर्वनाम-सदृश ‘वह’ मूल रूप को बनाए रखता है और अतिरिक्त दिव्य नाम नहीं जोड़ता।
- issue: ‘छः... सात’ संख्यात्मक सूत्र का अर्थ
  choice: मुख्य पाठ में संख्याएँ रखकर ‘सात में भी’ से बढ़ते हुए काव्यात्मक बल को व्यक्त किया गया है।
  alternative: इसे ठीक छः और सात संकटों की शाब्दिक सीमा मानना।
  rationale: यह इब्रानी संख्यात्मक समानांतरता बार-बार या पूर्ण रूप से छुड़ाए जाने का संकेत देती है। मूल काव्य-विधान को परिभाषात्मक गद्य में बदले बिना टिप्पणी में इसका संकेत स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘छुड़ाएगा’ तथा ‘अनिष्ट’ काव्यात्मक स्तर बनाए रखते हैं, जबकि वाक्य-संरचना सामान्य हिन्दी पाठक के लिए स्पष्ट है।
