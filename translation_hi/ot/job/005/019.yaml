    issue: ‘छू न सकेगा’ adds a modal/ability nuance.
    rationale: לֹא יִגַּע is a simple negated imperfect, ‘will not touch/reach.’ ‘तुम्हें नहीं छुएगा’ is closer and more direct in Hindi.
  - severity: low
    issue: ‘छः’ is not the preferred modern standard Hindi spelling.
    rationale: ‘छह’ is the usual contemporary standard spelling in Devanagari.
