  yaml_path: translation/ot/job/005/026.yaml
  text: You will come to the grave in full vigor[b][a], like a sheaf gathered up in its season.
translation:
  language: hi
  text: तू पूरी जीवन-शक्ति में[a] कब्र तक पहुँचेगा, जैसे अनाज का ढेर अपने समय पर उठा लिया जाता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पूरी आयु पाकर’ अथवा ‘पकी वृद्धावस्था में।’ इब्रानी शब्द दुर्लभ है और परिपक्व आयु या भरपूर जीवन-शक्ति का संकेत दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘जैसे अनाज का ढेर अपने समय पर ऊपर ले जाया जाता है।’ इब्रानी कृषि-बिंब कटे हुए अनाज को तैयार होने पर इकट्ठा करने या उठा लेने से तुलना करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּבוֹא
  choice: तू…पहुँचेगा
  rationale: בוא का क़ाल अपूर्ण 2 पुल्लिंग एकवचन रूप यहाँ भविष्य का भाव देता है। ‘पहुँचेगा’ हिन्दी में कब्र को जीवन-यात्रा की मंज़िल बताने वाले इस कथन को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְכֶלַח
  choice: पूरी जीवन-शक्ति में
  rationale: दुर्लभ शब्द כֶּלַח परिपक्व आयु, पुष्टता या पूर्ण जीवन-शक्ति का संकेत दे सकता है। यह चयन केवल बहुत अधिक उम्र का अर्थ निश्चित किए बिना जीवन की पूर्ण अवस्था का भाव रखता है।
- source_word: אֱלֵי קָבֶר
  choice: कब्र तक
  rationale: אֱלֵי दिशासूचक है और קֶבֶר दफ़नाने की जगह या कब्र को दर्शाता है। ‘कब्र तक पहुँचेगा’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: כַּעֲלוֹת
  choice: जैसे…उठा लिया जाता है
  rationale: כ तुलना सूचित करता है और עלה का क्रियारूप मूलतः ऊपर जाने या ऊपर ले जाए जाने का भाव रखता है। कृषि-बिंब में कर्मवाच्य अनुवाद उपज को उचित समय पर समेटे जाने का संकेत देता है, पर अस्पष्टता को टिप्पणी में रखा गया है।
- source_word: גָּדִישׁ
  choice: अनाज का ढेर
  rationale: גָּדִישׁ कटे हुए अनाज के ढेर या अंबार को दर्शाता है। ‘अनाज का ढेर’ हिन्दी में सटीक और आसानी से समझ आने वाला कृषि-बिंब है।
- source_word: בְּעִתּוֹ
  choice: अपनी ऋतु में
  rationale: यह पद उसके उचित समय का अर्थ देता है। ‘अपनी ऋतु में’ कृषि-बिंब और नियत, उपयुक्त समय—दोनों को बनाए रखता है।
theological_decisions:
- issue: क्या כֶּלַח को निश्चित रूप से वृद्धावस्था माना जाए
  choice: मुख्य पाठ में ‘पूरी जीवन-शक्ति में’
  alternative: ‘पूरी आयु पाकर’ या ‘पकी वृद्धावस्था में’
  rationale: दुर्लभ इब्रानी शब्द की अर्थ-सीमा विवादित है। मुख्य पाठ परिपक्व और पूर्ण जीवन की व्यापक धारणा रखता है; पादटिप्पणी वृद्धावस्था वाले पारंपरिक अर्थ को बताती है, ताकि एलीपज के कथन में निहित तनाव को समय से पहले न सुलझाया जाए।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सीधी हिन्दी; संबोधन में एकवचन ‘तू’ रखा गया है, क्योंकि इब्रानी क्रिया 2 पुल्लिंग एकवचन है और अय्यूब से सीधे काव्यात्मक संबोधन का क्रम चलता है। दुर्लभ शब्द और कृषि-बिंब की वास्तविक अनिश्चितता पादटिप्पणियों में सुरक्षित है।
