  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘असहाय’ मूल शब्द की आर्थिक गरीबी से व्यापक सामाजिक निर्बलता को व्यक्त करता है; मुँह बंद करने की इब्रानी छवि मुख्य पाठ में सुरक्षित है।
