  language: hi
  text: इसलिए गरीब को आशा मिलती है, और अन्याय अपना मुँह बंद कर लेता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बुराई अपना मुँह बंद कर लेती है”; अधिक शाब्दिक रूप में, “उसका मुँह बंद हो जाता है।”
    reason: עַוְלָה और קָפְצָה פִּיהָ के वैकल्पिक अर्थ तथा अधिक शाब्दिक अभिव्यक्ति को सुरक्षित रखना।
lexical_decisions:
- source_word: וַתְּהִי
  choice: इसलिए … मिलती है
  rationale: वय्यिक्तोल रूप पिछले वर्णन का परिणाम प्रस्तुत करता है। ‘इसलिए’ उस संबंध को स्पष्ट करता है, और वर्तमान काल इस कथन के सामान्य, नीतिपरक बल को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: לַדַּל
  choice: असहाय को
  rationale: דַּל आर्थिक रूप से गरीब होने के साथ-साथ निर्बल, दीन या सामाजिक रूप से शक्तिहीन व्यक्ति को भी सूचित कर सकता है। ‘असहाय’ इस प्रसंग में उसकी व्यापक असुरक्षा को बनाए रखता है।
- source_word: תִּקְוָה
  choice: आशा
  rationale: תִּקְוָה का सामान्य अर्थ ‘आशा’ या ‘अपेक्षा’ है। यहाँ ‘आशा’ अन्याय के चुप हो जाने के साथ स्पष्ट विरोध बनाती है।
- source_word: וְעֹלָתָה
  choice: और अन्याय
  rationale: עַוְלָה अन्याय, कुटिलता या बुराई को दर्शाता है। सामाजिक रूप से असहाय व्यक्ति के संदर्भ में ‘अन्याय’ सर्वाधिक स्वाभाविक है।
- source_word: קָפְצָה פִּיהָ
  choice: अपना मुँह बंद कर लेता है
  rationale: 'इब्रानी में सजीव चित्र है: ‘उसका मुँह बंद हो गया।’ हिंदी में ‘अपना मुँह बंद कर लेता है’ अन्याय के निरुत्तर और निष्प्रभावी हो जाने की छवि को बनाए रखता है।'
