  yaml_path: translation/ot/job/005/007.yaml
  text: For man is born for trouble[a], and the sons of flame fly upward.
translation:
  language: hi
  text: 'क्योंकि मनुष्य कष्ट के लिए जन्म लेता है,

    और लपट के पुत्र[a] ऊपर उड़ते हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “चिंगारियाँ।” इब्रानी में शाब्दिक रूप से “लपट के पुत्र” है (या संभवतः “रेशेफ़ के पुत्र”); इस मुहावरे को सामान्यतः चिंगारियों के लिए समझा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; इसलिए यहाँ ‘क्योंकि’ स्वाभाविक है।
- source_word: אָדָם
  choice: मनुष्य
  rationale: एकवचन संज्ञा यहाँ समस्त मानवजाति के प्रतिनिधि के रूप में प्रयुक्त है। ‘मनुष्य’ इस लोकोक्तिपरक सामान्य कथन को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: לְעָמָל
  choice: कष्ट के लिए
  rationale: עָמָל में परिश्रम, दुःख, विपत्ति और जीवन की पीड़ादायक कठिनाई का अर्थ-क्षेत्र है। अय्यूब के प्रसंग में ‘कष्ट’ पर्याप्त व्यापक है और केवल श्रम तक अर्थ को सीमित नहीं करता।
- source_word: יוּלָּד
  choice: जन्म लेता है
  rationale: यह सामान्य और सदा लागू होने वाले कथन का भाव रखता है; हिंदी का सामान्य वर्तमान काल इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: וּבְנֵי רֶשֶׁף
  choice: और लपट के पुत्र[a]
  rationale: शाब्दिक चित्र ‘रेशेफ़/लपट के पुत्र’ है। मुख्य पाठ में यह रूप मूल की असामान्य और कुछ हद तक संदिग्ध छवि को सुरक्षित रखता है; प्रचलित अर्थ ‘चिंगारियाँ’ पादटिप्पणी में दिया गया है।
- source_word: יַגְבִּיהוּ עוּף
  choice: ऊँचे उड़ते हैं
  rationale: दोनों शब्द मिलकर ऊपर या ऊँचाई की ओर उड़ने का भाव देते हैं। ‘ऊँचे उड़ते हैं’ मूल गति और काव्यात्मक समानांतरता को सहज हिंदी में व्यक्त करता है।
theological_decisions:
- issue: मानवीय कष्ट को उद्देश्य या सामान्य दशा के रूप में समझना
  choice: ‘कष्ट के लिए जन्म लेता है’—मूल के संक्षिप्त और तनावपूर्ण कथन को यथावत रखा गया है।
  alternative: ‘कष्ट भोगने के लिए जन्म लेता है’ या ‘उसके जीवन में कष्ट आते ही हैं।’
  rationale: पहला विकल्प मूल में निहित उद्देश्य-जैसे व्याकरण को अधिक व्याख्यायित करता, जबकि दूसरा उसे केवल अनुभव के सामान्यीकरण में बदल देता। चुना हुआ रूप एलीपज़ के कथन की कठोरता को बिना नरम किए सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और लोकोक्तिपरक रखी गई है। ‘लपट के पुत्र’ जानबूझकर काव्यात्मक और असामान्य है, क्योंकि मूल इब्रानी की छवि भी ऐसी ही है; पादटिप्पणी सामान्यतः समझे जाने वाले अर्थ को स्पष्ट करती है।
