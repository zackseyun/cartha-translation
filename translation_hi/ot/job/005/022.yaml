base_translation:
  language: en
  yaml_path: translation/ot/job/005/022.yaml
  text: At destruction and famine you will laugh[a], and you will not fear the beasts of the earth.
translation:
  language: hi
  text: 'विनाश और अकाल पर तुम हँसोगे,

    और धरती के जंगली पशुओं से नहीं डरोगे।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘धरती के जंगली पशुओं से मत डरना।’ हिब्रू क्रिया-रूप को निषेध के रूप में भी पढ़ा जा सकता है, यद्यपि यहाँ यह संभवतः सुरक्षा के आश्वासन के रूप में प्रयुक्त है।
    reason: alternative_reading
lexical_decisions:
- source_word: שֹׁד
  choice: विनाश
  rationale: यह शब्द हिंसक तबाही, उजाड़ या विनाश को दर्शाता है। ‘विनाश’ संक्षिप्त और स्वाभाविक है तथा ‘अकाल’ के समानांतर एक बड़ी विपत्ति को व्यक्त करता है।
- source_word: כָפָן
  choice: अकाल
  rationale: यह संज्ञा अकाल या घोर भूख को दर्शाती है। यहाँ विपत्तियों के काव्यात्मक समानांतर में ‘अकाल’ सबसे उपयुक्त है।
- source_word: תִּשְׂחָק
  choice: तुम हँसोगे
  rationale: שׂחק का अर्थ हँसना है और प्रसंग में यह निर्भयता या विपत्ति पर विजयभाव भी जता सकता है। ‘हँसोगे’ मूल बिंब को बिना अतिरिक्त व्याख्या के बनाए रखता है।
- source_word: מֵחַיַּת הָאָרֶץ
  choice: धरती के जंगली पशुओं से
  rationale: חַיָּה इस प्रसंग में जंगली पशुओं को दर्शाता है। ‘धरती के जंगली पशु’ आधुनिक हिन्दी में स्पष्ट है और हिब्रू पदबंध की व्यापकता को बनाए रखता है।
- source_word: אַל תִּירָא
  choice: नहीं डरोगे
  rationale: אַל के साथ अपूर्ण क्रिया सामान्यतः निषेध व्यक्त कर सकती है, पर आशीषों और सुरक्षा के इस क्रम में इसे आश्वासन के रूप में पढ़ना काव्यात्मक समानांतर और प्रसंग के अनुकूल है।
theological_decisions:
- issue: प्रसंग में אַל תִּירָא का बल
  choice: प्रतिज्ञात्मक आश्वासन—‘नहीं डरोगे’
  alternative: निषेधात्मक आज्ञा—‘मत डरना’
  rationale: यह पद प्रतिज्ञा की गई सुरक्षाओं और आशीषों के क्रम में है। इसलिए आश्वासन वाला अनुवाद ‘तुम हँसोगे’ के समानांतर बेहतर बैठता है। फिर भी हिब्रू व्याकरण निषेधात्मक अर्थ की वास्तविक संभावना रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। काव्यात्मक समानांतरता के लिए दो पंक्तियाँ हैं। ‘जंगली पशु’ सामान्य पाठक के लिए ‘वन-पशु’ या ‘धरती के पशु’ से अधिक स्पष्ट है। कोई पादटिप्पणी नहीं दी गई, क्योंकि अंग्रेज़ी परामर्श-पाठ की पादटिप्पणी का चिह्न मुख्य पाठ में ऐसे स्थान पर है जहाँ उसका विषय नहीं बनता; फिर भी वास्तविक व्याकरणिक विकल्प को theological_decisions में सुरक्षित रखा गया है।
