lexical_decisions:
- source_word: יוֹמָם
  choice: दिन में
  rationale: यह क्रियाविशेषणीय प्रयोग है, जिसका अर्थ ‘दिन के समय’ है; ‘दिन में’ सहज है और ‘रात’ तथा ‘दोपहर’ के साथ समय-विरोध बनाए रखता है।
- source_word: יְפַגְּשׁוּ
  choice: जा मिलते हैं
  rationale: פגשׁ का मूल भाव किसी वस्तु या दशा से सामना होने का है। ‘अँधेरे से जा मिलते हैं’ मूल रूपक को बनाए रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: חֹשֶׁךְ
  choice: अँधेरा
  rationale: यह शब्द का सामान्य और सीधा अर्थ है तथा यहाँ शाब्दिक और रूपकात्मक दोनों संभावनाएँ खुली रखता है।
- source_word: וְכַלַּיְלָה
  choice: रात की तरह
  rationale: כְּ तुलनात्मक उपसर्ग है; यह बताता है कि वे दोपहर में ऐसे टटोलते हैं मानो रात हो।
- source_word: יְמַשְׁשׁוּ
  choice: टटोलते फिरते हैं
  rationale: משׁשׁ अँधेरे में हाथ से खोजते या रास्ता टटोलते चलने का भाव देता है। ‘टटोलते फिरते हैं’ आधुनिक हिन्दी में इस असहाय भटकाव को स्पष्ट करता है।
- source_word: בַצָּהֳרָיִם
  choice: दोपहर में
  rationale: यह विशेष रूप से मध्याह्न को दर्शाता है; ‘दोपहर में’ उस विडंबना को सुरक्षित रखता है कि सबसे उजले समय में भी वे रात के समान टटोलते हैं।
