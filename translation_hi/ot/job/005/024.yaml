  text: וְֽ֭/יָדַעְתָּ כִּי שָׁל֣וֹם אָהֳלֶ֑/ךָ וּֽ/פָקַדְתָּ֥ נָ֝וְ/ךָ וְ/לֹ֣א תֶחֱטָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/024.yaml
  text: You will know that your tent is at peace[a], and when you inspect your dwelling, you will not miss anything.
translation:
  language: hi
  text: तू जान लेगा कि तेरे तंबू में कुशल-क्षेम है; और जब तू अपने निवास का निरीक्षण करेगा, तो कुछ भी कम न पाएगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और तू पाप नहीं करेगा।” इब्रानी क्रिया का सामान्य अर्थ “पाप करना” हो सकता है, पर यहाँ उसका अर्थ संभवतः “चूकना” या “कुछ कम पाना” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדַעְתָּ
  choice: तू जान लेगा
  rationale: संयोजक वाव के साथ क़ाल पूर्ण क्रिया इस काव्यात्मक प्रतिज्ञा में भविष्य का भाव रखती है।
- source_word: כִּי שָׁלוֹם אָהֳלֶךָ
  choice: कि तेरा तंबू कुशल से है
  rationale: שָׁלוֹם यहाँ शांति, सुरक्षा और सकुशल अवस्था का व्यापक भाव देता है; ‘कुशल से’ घरेलू समृद्धि और सुरक्षित दशा दोनों को स्वाभाविक हिंदी में व्यक्त करता है। ‘तंबू’ प्राचीन बिंब को बनाए रखता है।
- source_word: וּפָקַדְתָּ
  choice: और जब तू ... निरीक्षण करेगा
  rationale: פקד के ‘देखना, जाँच करना, लेखा लेना’ अर्थों में यहाँ निवास की दशा जाँचने का भाव संदर्भानुकूल है।
- source_word: נָוְךָ
  choice: अपने निवास का
  rationale: נָוֶה तंबू के समानांतर निवास-स्थान या बसेरे को दर्शाता है; ‘निवास’ उसका गरिमापूर्ण और सहज हिंदी रूप है।
- source_word: וְלֹא תֶחֱטָא
  choice: तो कुछ भी कम न पाएगा
  rationale: חטא का मूल भाव लक्ष्य चूकना है और यहाँ निरीक्षण के संदर्भ में किसी वस्तु को अनुपस्थित या कम पाना स्वाभाविक अर्थ है; नैतिक ‘पाप करना’ भी शाब्दिक संभावना है, इसलिए उसे पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: וְלֹא תֶחֱטָא का नैतिक अथवा अनैतिक अर्थ
  choice: कुछ भी कम न पाएगा
  alternative: तू पाप नहीं करेगा
  rationale: निवास का निरीक्षण करने और उसके सकुशल होने का निकट संदर्भ ‘कुछ कम न पाना’ अर्थ का समर्थन करता है। फिर भी क्रिया का सामान्य नैतिक अर्थ वास्तविक है, इसलिए अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण, सहज काव्यात्मक गद्य; संदर्भ के प्रत्यक्ष संबोधन के लिए ‘तू’ रखा गया है। ‘तंबू’ और ‘निवास’ मूल समानांतर बिंब को बनाए रखते हैं।
