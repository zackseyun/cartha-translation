    issue: The phrase ‘तेरा तंबू कुशल से है’ is non-idiomatic Hindi.
    rationale: Hindi does not normally use ‘कुशल से है’ predicatively in this way. It may obscure the meaning of the Hebrew שָׁלוֹם. ‘तेरे तंबू में कुशल-क्षेम है’ naturally communicates the tent/household’s well-being and security.
