lexical_decisions:
- source_word: יַחַד
  choice: एक साथ
  rationale: यह क्रियाविशेषण बन्दियों की साझी अवस्था बताता है; ‘एक साथ’ स्वाभाविक हिन्दी है और सामूहिक भाव बनाए रखता है।
- source_word: אֲסִירִים
  choice: बन्दी
  rationale: यह बन्धन या कैद में पड़े लोगों को सूचित करता है; ‘बन्दी’ संक्षिप्त, वर्तमान और प्रसंगानुकूल है।
- source_word: שַׁאֲנָנוּ
  choice: चैन से रहते हैं
  rationale: यह निश्चिन्त, शांत और उत्पीड़न से मुक्त अवस्था व्यक्त करता है; इस प्रयोग से पूर्ण विश्राम का अनावश्यक दावा किए बिना सतत अवस्था स्पष्ट होती है।
- source_word: לֹא שָׁמְעוּ
  choice: नहीं सुनते
  rationale: काव्यात्मक प्रसंग में पूर्ण क्रिया चलती हुई परिणामी अवस्था बता सकती है; वर्तमान काल मृतकों की वर्णित दशा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: קוֹל
  choice: आवाज़
  rationale: यह किसी अधिकारी की सुनाई देनेवाली पुकार या आज्ञा को दर्शाता है; आधुनिक हिन्दी में ‘आवाज़’ सबसे स्वाभाविक है।
- source_word: נֹגֵשׂ
  choice: बेगार करानेवाले
  rationale: यह शब्द श्रम या भुगतान कठोरता से वसूलनेवाले व्यक्ति के लिए आता है। ‘बेगार करानेवाला’ इस प्रसंग में श्रम-दमन का ठोस भाव देता है, जबकि फुटनोट व्यापक विकल्प सुरक्षित रखता है।
