lexical_decisions:
- source_word: שָׁם
  choice: वहाँ
  rationale: यह स्थानवाचक क्रियाविशेषण अय्यूब द्वारा वर्णित मृत्यु के लोक की ओर संकेत करता है; सरल ‘वहाँ’ काव्यात्मक समानांतरता बनाए रखता है।
- source_word: רְשָׁעִים
  choice: दुष्ट
  rationale: यह नैतिक रूप से बुरे लोगों के लिए प्रयुक्त विशेषणात्मक संज्ञा है; ‘दुष्ट’ संक्षिप्त और प्रचलित हिन्दी रूप है।
- source_word: חָדְלוּ
  choice: छोड़ देते हैं
  rationale: क्रिया का अर्थ ‘रुकना, छोड़ देना’ है। प्रसंग किसी सामान्य दशा का वर्णन करता है, इसलिए हिन्दी में सामान्य वर्तमान स्वाभाविक है।
- source_word: רֹגֶז
  choice: उपद्रव मचाना
  rationale: संज्ञा רֹגֶז अशांति, उत्तेजना, उग्रता अथवा बेचैन कर देने वाली हलचल व्यक्त कर सकती है। क्रिया חדל के साथ ‘उपद्रव मचाना छोड़ देते हैं’ स्वाभाविक हिन्दी है और दुष्टों द्वारा उत्पन्न अशांति का भाव रखता है, पर वैकल्पिक अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: וְשָׁם
  choice: और वहाँ
  rationale: संयोजक तथा दोहराया हुआ स्थानवाचक शब्द दूसरी काव्य-पंक्ति की समानांतर रचना और बल को बनाए रखते हैं।
- source_word: יָנוּחוּ
  choice: विश्राम पाते हैं
  rationale: נוח का अर्थ आराम करना या स्थिर होकर विश्राम पाना है; ‘विश्राम पाते हैं’ इस स्थान में प्राप्त राहत को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְגִיעֵי כֹחַ
  choice: जिनकी शक्ति चुक गई है
  rationale: शाब्दिक रचना ‘शक्ति से थके हुए’ है और आशय पूरी तरह निढाल या शक्तिहीन हो चुके लोगों से है। चुना हुआ रूप כוח के ‘शक्ति’ भाव को स्पष्ट रखते हुए सहज हिन्दी देता है।
