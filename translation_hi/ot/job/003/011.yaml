- source_word: לָמָּה
  choice: क्यों
  rationale: कारण पूछने वाले इस प्रश्न का स्वाभाविक आधुनिक हिन्दी रूप ‘क्यों’ है; इससे अय्यूब के विलाप का स्वर बना रहता है।
- source_word: מֵרֶחֶם
  choice: गर्भ से ही
  rationale: רֶחֶם का ठोस अर्थ ‘गर्भ’ है। ‘से ही’ जन्म के अवसर का संकेत देता है, पर मातृ-देह की मूल छवि को केवल ‘जन्मते ही’ कहकर मिटाता नहीं।
- source_word: אָמוּת
  choice: मर गया
  rationale: प्रथम पुरुष एकवचन अपूर्ण क्रिया यहाँ अतीत की उस अवास्तविक संभावना पर विलाप करती है जो पूरी नहीं हुई; हिन्दी में ‘क्यों न मर गया’ इसका स्वाभाविक रूप है।
- source_word: מִבֶּטֶן
  choice: कोख से
  rationale: בֶּטֶן पेट अथवा गर्भस्थ कोख को सूचित कर सकता है। समानांतर רֶחֶם से शब्दगत भिन्नता बनाए रखने और मातृ-संदर्भ स्पष्ट रखने के लिए ‘कोख’ चुना गया।
- source_word: יָצָאתִי
  choice: बाहर आते ही
  rationale: क्रिया का मूल अर्थ ‘निकलना/बाहर आना’ है। यह अनुवाद जन्म की व्याख्यात्मक संज्ञा के बजाय बाहर आने की ठोस छवि बनाए रखता है।
- source_word: וְאֶגְוָע
  choice: मेरे प्राण निकल गए
  rationale: גוע मरने अथवा अंतिम साँस लेने का बोध देता है। ‘प्राण निकल गए’ पहले प्रयुक्त ‘मर गया’ से भिन्न अभिव्यक्ति रखते हुए मृत्यु-क्षण का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
