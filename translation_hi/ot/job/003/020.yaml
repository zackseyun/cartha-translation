  yaml_path: translation/ot/job/003/020.yaml
  text: Why is light given to the troubled[b][a], and life to the bitter in soul?
translation:
  language: hi
  text: पीड़ित को उजियाला क्यों दिया जाता है, और कड़वे मन वालों को जीवन?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָמָּה
  choice: क्यों
  rationale: यह प्रश्नवाचक क्रियाविशेषण अय्यूब के विलाप का सीधा और तीखा प्रश्न प्रस्तुत करता है।
- source_word: יִתֵּן
  choice: दिया जाता है
  rationale: इब्रानी क्रिया पुल्लिंग एकवचन में है, पर कर्ता स्पष्ट नहीं है। हिंदी का कर्मवाच्य संभावित दाता को अनकहा रखते हुए मूल की अस्पष्टता बचाता है।
- source_word: לְעָמֵל
  choice: दुखियारे को
  rationale: עָמֵל यहाँ साधारण परिश्रम करने वाले से अधिक दुःख और विपत्ति झेलने वाले व्यक्ति को दर्शाता है; ‘दुखियारा’ स्वाभाविक और भावपूर्ण हिंदी है।
- source_word: אוֹר
  choice: उजियाला
  rationale: मूल के काव्यात्मक प्रकाश-बिंब को बनाए रखा गया है; प्रसंग में यह जीवन अथवा अस्तित्व के बने रहने का संकेत देता है।
- source_word: וְחַיִּים
  choice: जीवन
  rationale: חַיִּים रूप में बहुवचन होते हुए भी सामान्यतः ‘जीवन’ के अर्थ में प्रयुक्त होता है।
- source_word: לְמָרֵי נָפֶשׁ
  choice: मन के कड़वे लोगों को
  rationale: यह चयन ‘प्राण/मन में कड़वे’ होने के इब्रानी मुहावरे और भीतरी कटु वेदना को बनाए रखता है, किंतु आधुनिक हिंदी में समझने योग्य रहता है।
theological_decisions:
- issue: יִתֵּן का निहित कर्ता
  choice: कर्मवाच्य ‘दिया जाता है’ द्वारा दाता को अनकहा रखना
  alternative: ‘वह क्यों देता है?’ या स्पष्ट रूप से ‘परमेश्वर क्यों देता है?’
  rationale: प्रसंग में परमेश्वर संभवतः निहित हैं, पर इस पंक्ति में इब्रानी पाठ उनका नाम नहीं लेता। कर्मवाच्य अय्यूब की शिकायत का धार्मिक तनाव बिना अधिक स्पष्ट किए सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज, गरिमापूर्ण और काव्यात्मक विलाप-स्वर रखा गया है। ‘उजियाला’ मूल के प्रकाश-बिंब को और ‘मन के कड़वे’ आंतरिक कटु वेदना को व्यक्त करता है।
