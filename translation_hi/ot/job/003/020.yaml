  to: पीड़ित को उजियाला क्यों दिया जाता है, और कड़वे मन वालों को जीवन?
  rationale: The revision retains the Hebrew’s implicit giver, the light/life parallelism, and the lamenting question, while replacing two less natural expressions with modern standard Hindi that more accurately conveys affliction and inward bitterness.
