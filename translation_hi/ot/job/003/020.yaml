review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the unstated giver through passive wording and retains the poetic image of light. However, “मन के कड़वे लोगों” is not idiomatic modern Hindi and can suggest people who are merely harsh or unpleasant, rather than those embittered in their inner being.
  naturalness: “दुखियारे” is understandable but comparatively colloquial and less suitable for this elevated lament. “पीड़ित” is natural, concise, and fits the context. “कड़वे मन वालों” is a more idiomatic Hindi rendering of the Hebrew ‘bitter of soul.’
  terminology: “उजियाला” suitably retains the concrete poetic image of light, and “जीवन” appropriately renders חַיִּים. The passive “दिया जाता है” correctly leaves the giver unexpressed, as in the Hebrew.
  issues:
  - severity: medium
    issue: “मन के कड़वे लोगों” is unnatural and potentially misleading.
    rationale: In modern Hindi it can characterize people as sour-tempered or cruel. The Hebrew phrase describes persons whose inner self is embittered in suffering. “कड़वे मन वालों” better conveys that relationship while retaining the compact poetic idiom.
  - severity: low
    issue: “दुखियारे” is somewhat colloquial in this poetic register.
    rationale: “पीड़ित” is more idiomatic in modern standard Hindi and reflects the afflicted/miserable sense of לְעָמֵל without implying ordinary labor.
  revised_text: पीड़ित को उजियाला क्यों दिया जाता है, और कड़वे मन वालों को जीवन?
  revised_footnotes:
