  text: The small and the great are there[a], and the servant is free from his master.
translation:
  language: hi
  text: छोटे और बड़े दोनों वहाँ हैं, और दास अपने स्वामी से स्वतंत्र है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָטֹן
  choice: छोटे
  rationale: גָדוֹל के साथ विरोधी युग्म में यह सामाजिक हैसियत या महत्त्व में कम लोगों को सूचित करता है; ‘छोटे’ इब्रानी की संक्षिप्तता बनाए रखता है।
- source_word: גָדוֹל
  choice: बड़े
  rationale: קָטֹן के समानांतर यह ऊँची हैसियत या प्रमुखता वाले लोगों को सूचित करता है; ‘बड़े’ स्वाभाविक हिंदी विरोधी युग्म बनाता है।
- source_word: שָׁם
  choice: वहाँ
  rationale: संदर्भ में यह मृत्यु के लोक की ओर संकेत करता है और स्थान-सूचक अर्थ को सीधे बनाए रखता है।
- source_word: הוּא
  choice: दोनों … हैं
  rationale: रूप की दृष्टि से एकवचन सर्वनाम होने पर भी यह पूर्ववर्ती युग्म के विषय में सामूहिक कथन करता है; हिंदी में ‘दोनों … हैं’ स्वाभाविक रूप से उस साझा उपस्थिति को व्यक्त करता है, बिना ‘समान’ जैसी अतिरिक्त धारणा जोड़े।
- source_word: עֶבֶד
  choice: दास
  rationale: स्वामी से स्वतंत्र होने के विरोध के कारण यहाँ बंधुआ अधीनता प्रमुख है; ‘दास’ आधुनिक हिंदी में गरिमापूर्ण और संदर्भानुकूल है।
- source_word: חָפְשִׁי
  choice: स्वतंत्र
  rationale: यह दासत्व के विपरीत स्वतंत्र अवस्था को बताने वाला विशेषण है; ‘स्वतंत्र’ इस अर्थ को सीधे व्यक्त करता है।
- source_word: מֵאֲדֹנָיו
  choice: अपने स्वामी से
  rationale: מִן अलगाव को और אֲדֹנָיו दास के मानवीय स्वामी को दर्शाता है; ‘अपने स्वामी से’ संबंध और अलगाव दोनों स्पष्ट करता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण प्रस्तुति। ‘छोटे और बड़े’ मूल के सामाजिक-विरोधी युग्म को बनाए रखता है; ‘दोनों’ केवल हिंदी में संयुक्त कर्ता को स्वाभाविक बनाता है, ‘एक समान’ का अतिरिक्त अर्थ नहीं जोड़ता।
