- source_word: הַשְּׂמֵחִים
  choice: जो ... आनन्दित होते हैं
  rationale: संज्ञार्थक कृदन्त पिछले पद में वर्णित लोगों का उल्लेख जारी रखता है; हिन्दी में सम्बन्धवाचक वाक्य स्वाभाविक है।
- source_word: אֱלֵי גִיל
