- source_word: כִּי
  choice: पाकर
  rationale: यहाँ conjunction उस अवसर या कारण को प्रस्तुत करता है जिस पर वे उल्लसित होते हैं। कृदन्तीय हिन्दी रचना मुख्यतः कालगत अर्थ देती है, जबकि कारणगत छाया भी सम्भव रहती है; विकल्प पादटिप्पणी में दिया गया है।
- source_word: יִמְצְאוּ
  choice: पाकर
  rationale: מצא का सरल अर्थ ‘पाना’ है; संयुक्त कृदन्तीय रचना हिन्दी में संक्षिप्त और काव्यात्मक है।
- source_word: קָבֶר
  choice: कब्र
  rationale: קָבֶר burial place/grave को दर्शाता है। बिना परसर्ग-चिह्नित निर्धारक के ‘कब्र’ हिन्दी में सामान्य अथवा अनिश्चित दोनों अर्थ ग्रहण कर सकती है और मूल की अनिर्धारितता को अनावश्यक रूप से नहीं सुलझाती।
