source:
  edition: WLC
  text: כִּֽי לִ/פְנֵ֣י לַ֭חְמִ/י אַנְחָתִ֣/י תָבֹ֑א וַֽ/יִּתְּכ֥וּ כַ֝/מַּ֗יִם שַׁאֲגֹתָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/024.yaml
  text: For my sighing comes before my bread[b][a], and my groanings pour out like water.
translation:
  language: hi
  text: 'क्योंकि मेरी आह मेरी रोटी[a] से पहले आती है,

    और मेरी कराहें[b] पानी की तरह बह निकलती हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मेरा भोजन’; इब्रानी में ‘रोटी’ व्यापक रूप से खाने की वस्तु या भोजन के लिए भी प्रयुक्त हो सकती है।
    reason: lexical_alternative
  - marker: b
    text: या ‘मेरी दहाड़ें’; इब्रानी शब्द ऊँची, पशु की दहाड़ जैसी पुकार का भाव दे सकता है और अय्यूब की पीड़ा की तीव्रता बढ़ाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह अव्यय आस-पास के विलाप में अय्यूब की दशा का कारण या स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ इस संबंध को सहज हिन्दी में बनाए रखता है।
- source_word: לִפְנֵי
  choice: से पहले
  rationale: इस प्रसंग में यह पूर्वसर्ग स्वाभाविक रूप से काल-संबंध बताता है—आह भरना खाने से पहले होता है।
- source_word: לַחְמִי
  choice: मेरी रोटी
  rationale: לֶחֶם का ठोस, शाब्दिक बिंब ‘रोटी’ है, यद्यपि यह व्यापक अर्थ में भोजन को भी सूचित कर सकता है; व्यापक अर्थ पादटिप्पणी में रखा गया है।
- source_word: אַנְחָתִי
  choice: मेरी आह
  rationale: אַנְחָה दुःख से निकली आह या कराह को दर्शाता है। एकवचन ‘मेरी आह’ इब्रानी रूप और काव्यात्मक अभिव्यक्ति दोनों को सुरक्षित रखता है।
- source_word: תָבֹא
  choice: आती है
  rationale: בוא का सामान्य अर्थ ‘आना’ है। वर्तमानकाल अय्यूब की जारी दशा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיִּתְּכוּ
  choice: बह निकलती हैं
  rationale: נתך यहाँ उंडेल दिए जाने या उमड़कर बहने का बिंब देता है। पानी के साथ ‘बह निकलती हैं’ अनियंत्रित प्रवाह को सहज और सजीव हिन्दी में व्यक्त करता है।
- source_word: כַמַּיִם
  choice: पानी की तरह
  rationale: इब्रानी उपमा को सीधे और स्वाभाविक रूप में बनाए रखा गया है।
- source_word: שַׁאֲגֹתָי
  choice: मेरी कराहें
  rationale: שׁאג से बना यह शब्द ऊँची, तीव्र पुकार या दहाड़ तक का भाव रखता है। ‘कराहें’ मानवीय पीड़ा के प्रसंग में सहज है; अधिक शाब्दिक और पशु-जैसी तीव्रता वाला विकल्प पादटिप्पणी में दिया गया है।
