source:
  edition: WLC
  text: כִּֽי עַ֭תָּה שָׁכַ֣בְתִּי וְ/אֶשְׁק֑וֹט יָ֝שַׁ֗נְתִּי אָ֤ז יָנ֬וּחַֽ לִֽ/י־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/013.yaml
  text: For now I would have lain down and been quiet[b][a]; I would have slept—then I would have been at rest.
translation:
  language: hi
  text: क्योंकि अब तक मैं लेट गया होता और शांत होता; मैं सोया होता—तब मुझे विश्राम मिलता।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “तब मेरे लिए विश्राम होता।”
    reason: मूल इब्रानी की व्याकरणिक रचना को दर्शाने वाला वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले पदों में व्यक्त अय्यूब की इच्छा के काल्पनिक परिणाम का कारण या स्पष्टीकरण प्रस्तुत करता है।
- source_word: עַתָּה
  choice: अब तक
  rationale: शाब्दिक अर्थ ‘अब’ है; प्रतिकल्पित प्रसंग में ‘अब तक’ स्वाभाविक हिन्दी में यह भाव देता है कि यदि जन्म के समय उसकी मृत्यु हो गई होती, तो वर्तमान में उसकी दशा क्या होती।
- source_word: שָׁכַבְתִּי
  choice: मैं लेटकर ... हो गया होता
  rationale: मूल क्रिया लेटने की शारीरिक छवि बनाए रखती है और यहाँ भूतकालीन प्रतिकल्पना व्यक्त करती है।
- source_word: וְאֶשְׁקֹט
  choice: शांत
  rationale: שׁקט का अर्थ अशांति या विघ्न से मुक्त शांत अवस्था है। ‘शांत’ मूल के निकट है और ‘शांति में’ की अपेक्षा कम व्याख्यात्मक है।
- source_word: יָשַׁנְתִּי
  choice: मैं सो रहा होता
  rationale: साधारण ‘सोना’ क्रिया को बनाए रखकर मृत्यु की काव्यात्मक छवि संरक्षित की गई है; उसे स्पष्ट रूप से ‘मरना’ नहीं बनाया गया।
- source_word: אָז
  choice: तब
  rationale: यह लेटने और सोने के बाद की परिणामी अवस्था को चिह्नित करता है।
- source_word: יָנוּחַ לִי
  choice: मुझे विश्राम मिलता
  rationale: לִי के साथ נוח का अधिक शाब्दिक भाव ‘मेरे लिए विश्राम होता’ है; ‘मुझे विश्राम मिलता’ आधुनिक हिन्दी में स्वाभाविक रहते हुए उसी आशय को व्यक्त करता है।
theological_decisions:
- issue: मृत्यु को लेटने, सोने और विश्राम की छवियों से व्यक्त करना
  choice: मूल की लेटने, सोने और विश्राम पाने की भाषा बनाए रखी गई है।
  alternative: ‘मैं मर गया होता’ या ‘मृत्यु में विश्राम करता’ कहकर छवि को स्पष्ट करना।
  rationale: पद मृत्यु की वांछित निश्चिंतता का वर्णन करता है, पर किसी स्पष्ट सिद्धान्तात्मक कथन के बजाय सामान्य शारीरिक क्रियाओं की काव्यात्मक भाषा में। अनुवाद उसी तनाव को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘अब तक’ प्रतिकल्पित प्रसंग को हिन्दी में स्पष्ट करता है, जबकि अर्धविराम और दीर्घ विराम मूल की काव्यात्मक समानांतरता बनाए रखते हैं।
