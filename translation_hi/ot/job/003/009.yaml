translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर अय्यूब की शापात्मक कविता के अनुरूप गरिमापूर्ण काव्यात्मकता रखी गई है। ‘बाट जोहे’ और ‘भोर की पलकें’ सहज रूप से समझ आने वाले काव्य-प्रयोग हैं। अंग्रेज़ी परामर्श-पाठ में [b] का चिह्न ‘none’ के बाद था, जबकि उसकी टिप्पणी ‘eyelids of dawn’ से सम्बद्ध है; हिन्दी पाठ में चिह्न उसी बिम्ब के बाद रखा गया है।
