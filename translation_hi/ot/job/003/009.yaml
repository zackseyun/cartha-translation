source:
  edition: WLC
  text: יֶחְשְׁכוּ֮ כּוֹכְבֵ֪י נִ֫שְׁפּ֥/וֹ יְקַו לְ/א֥וֹר וָ/אַ֑יִן וְ/אַל יִ֝רְאֶ֗ה בְּ/עַפְעַפֵּי שָֽׁחַר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/009.yaml
  text: May the stars of its twilight be dark[a]; may it wait for light, but there be none[b], and may it not see the eyelids of dawn.
translation:
  language: hi
  text: उसकी साँझ के तारे अँधेरे हो जाएँ[a]; वह उजाले की बाट जोहे, पर उजाला न हो; और वह भोर की पलकों को न देखे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके धुँधलके के तारे।” इब्रानी संज्ञा संधिकाल, विशेषकर साँझ के धुँधलके, को सूचित कर सकती है।
    reason: lexical_alternative
  - marker: b
    text: “भोर की पलकें” इब्रानी काव्य में सुबह का प्रकाश पहली बार दिखाई देने का चित्र है।
    reason: cultural_note
lexical_decisions:
- source_word: יֶחְשְׁכוּ
  choice: अँधेरे हो जाएँ
  rationale: शापात्मक संदर्भ में अपूर्ण क्रिया इच्छा व्यक्त करती है। यह चयन तारों के अँधेरा हो जाने की कामना को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: כּוֹכְבֵי נִשְׁפּוֹ
  choice: उसकी साँझ के तारे
  rationale: सम्बद्ध रचना और एकवचन प्रत्यय दोनों सुरक्षित हैं। נֶשֶׁף यहाँ विशेषतः संध्या के धुँधलके का बोध कराता है; ‘साँझ’ सामान्य पाठक के लिए सहज और काव्यात्मक है।
- source_word: יְקַו לְאוֹר
  choice: उजाले की बाट जोहे
  rationale: קוה में प्रतीक्षा और आशा दोनों का भाव हो सकता है। ‘बाट जोहे’ अपेक्षापूर्ण प्रतीक्षा को व्यक्त करता है और प्रकाश-अँधकार के काव्यात्मक विरोध को बनाए रखता है।
- source_word: וָאַיִן
  choice: पर उजाला न हो
  rationale: यह अपेक्षा के निष्फल होने को शापात्मक इच्छा के रूप में व्यक्त करता है। ‘पर’ निहित विरोध को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: וְאַל יִרְאֶה
  choice: और वह ... न देखे
  rationale: אַל के साथ अपूर्ण क्रिया निषेधात्मक इच्छा व्यक्त करती है; हिन्दी का ‘न देखे’ वही शापात्मक बल रखता है।
- source_word: בְּעַפְעַפֵּי שָׁחַר
  choice: भोर की पलकों को
  rationale: मूल इब्रानी के सजीव काव्य-बिम्ब ‘भोर की पलकें’ को ‘पहली किरणें’ जैसे व्याख्यात्मक रूप में समतल किए बिना सुरक्षित रखा गया है।
