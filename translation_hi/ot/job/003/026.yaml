- source_word: וַיָּבֹא
  choice: आ पहुँची
  rationale: मूल क्रिया का सीधा अर्थ ‘आई’ है। ‘आ पहुँची’ हिंदी में संकट के आगमन को स्वाभाविक ढंग से व्यक्त करता है, बिना ‘मुझ पर’ जैसा अप्रकट कर्म जोड़ने के।
- source_word: לֹא ... וְלֹא ... וְלֹא
  choice: न ... न ...; ... नहीं
  rationale: हिंदी की ‘न...न...नहीं’ संरचना बार-बार किए गए निषेध और विलाप की लय को बनाए रखती है, जबकि यांत्रिक पुनरावृत्ति से बचती है।
