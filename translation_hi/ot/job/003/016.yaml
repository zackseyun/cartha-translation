  text: Or like a hidden miscarriage[a], I would not be[b], like infants who never saw light.
translation:
  language: hi
  text: या किसी छिपे हुए मृतजन्मे शिशु[a] के समान मैं न होता, उन शिशुओं के समान जिन्होंने कभी प्रकाश नहीं देखा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द गर्भपात में नष्ट हुए भ्रूण या मृतजन्मे बच्चे का उल्लेख कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘प्रकाश देखना’ संसार में आकर जीवन का अनुभव करने के लिए प्रयुक्त इब्रानी अभिव्यक्ति है।
    reason: cultural_note
lexical_decisions:
- source_word: א֤וֹ
  choice: या
  rationale: यह अय्यूब की कल्पित वैकल्पिक स्थिति की अगली कड़ी प्रस्तुत करता है; सरल ‘या’ स्वाभाविक और पर्याप्त है।
- source_word: כְ/נֵ֣פֶל
  choice: किसी … मृत भ्रूण के समान
  rationale: संज्ञा נֵפֶל गर्भपात में नष्ट हुए भ्रूण या मृत जन्मे बच्चे का संकेत दे सकती है। हिन्दी में केवल ‘गर्भपात’ घटना को दर्शाता है, इसलिए ‘मृत भ्रूण’ व्यक्ति-संबंधी उपमा को अधिक स्वाभाविक ढंग से व्यक्त करता है; विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: טָ֭מוּן
  choice: छिपे पड़े
  rationale: यह טמן का निष्क्रिय कृदन्त है, जिसका अर्थ छिपा या गुप्त रखा हुआ है। ‘छिपे पड़े’ मूल बिंब को बनाए रखता है और इसे निश्चित रूप से ‘दफन’ नहीं बनाता।
- source_word: לֹ֣א אֶהְיֶ֑ה
  choice: मैं न होता
  rationale: यह मूल के ‘मैं न होता/अस्तित्व में न होता’ को संक्षिप्त, निकट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כְ֝/עֹלְלִ֗ים
  choice: उन शिशुओं के समान
  rationale: עֹלְלִים बहुत छोटे बच्चों या शिशुओं को दर्शाता है; प्रसंग में ‘शिशु’ उपयुक्त और गरिमापूर्ण है।
- source_word: לֹא רָ֥אוּ אֽוֹר
  choice: जिन्होंने प्रकाश नहीं देखा था
  rationale: मूल रूपक ‘प्रकाश देखना’ को बनाए रखा गया है; पूर्ण भूतकालीन ‘था’ हिन्दी वाक्य में अय्यूब की कल्पित पूर्वस्थिति को सहज बनाता है।
