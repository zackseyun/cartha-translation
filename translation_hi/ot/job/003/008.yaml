  yaml_path: translation/ot/job/003/008.yaml
  text: Let those who curse days curse it, those ready to rouse Leviathan.
translation:
  language: hi
  text: जो दिन को शाप देते हैं, वे उसे शाप दें—जो लिव्यातान को जगाने के लिए तैयार हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֹרְרֵי יוֹם
  choice: जो दिनों को शाप देते हैं
  rationale: יוֹם रूप में एकवचन है, पर यहाँ दिन को एक वर्ग या सामान्य धारणा के रूप में व्यक्त करता है; स्वाभाविक हिन्दी में बहुवचन ‘दिनों’ अंग्रेज़ी परामर्श-पाठ के अनुरूप इस सामूहिक अर्थ को स्पष्ट करता है।
- source_word: הָעֲתִידִים
  choice: तैयार रहते हैं
  rationale: इसका मूल अर्थ ‘तैयार/उद्यत’ है। ‘निपुण’ जैसे अर्थ को जोड़ने के बजाय तैयारी का भाव सुरक्षित रखा गया है।
- source_word: עֹרֵר
  choice: जगाने
  rationale: क्रिया का अर्थ जगाना या उकसाकर सक्रिय करना है; ‘जगाने’ से काव्यात्मक चित्र स्पष्ट और संक्षिप्त रहता है।
- source_word: לִוְיָתָן
  choice: लिव्यातान
  rationale: रहस्यमय प्राणी का इब्रानी नाम लिप्यंतरित किया गया है, ताकि उसे किसी निश्चित प्राकृतिक या पौराणिक पहचान में सीमित न किया जाए।
theological_decisions:
- issue: लिव्यातान की पहचान
  choice: नाम को ‘लिव्यातान’ के रूप में बनाए रखा
  alternative: मगरमच्छ, समुद्री दैत्य या पौराणिक अजगर जैसे किसी निश्चित अर्थ में अनुवाद करना
  rationale: इस पद में पहचान अस्पष्ट है; किसी एक व्याख्या को पाठ में आरोपित करने से काव्यात्मक और धार्मिक तनाव अनावश्यक रूप से समाप्त हो जाता।
- issue: ‘उसे’ का संदर्भ
  choice: स्त्रीलिंग ‘उसे’ रखा, जो पिछले पद की रात की ओर संकेत करता है
  alternative: इस पद में ‘दिन’ को प्रत्यक्ष कर्म मानकर ‘उस दिन को’ कहना
  rationale: इब्रानी प्रत्यय एकवचन है और निकटवर्ती संदर्भ में अय्यूब जिस रात को कोस रहा है, उसी की ओर लौटना स्वाभाविक है; फिर भी संक्षिप्त सर्वनाम मूल की संदर्भगत गुंजाइश बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमामय और काव्यात्मक रखी गई है। डैश दूसरे अर्धपद को पहले समूह की व्याख्या के रूप में प्रस्तुत करता है। किसी तांत्रिक या पौराणिक पृष्ठभूमि को पाठ में स्पष्ट रूप से नहीं जोड़ा गया, क्योंकि वह मूल पद में प्रत्यक्ष नहीं है।
