  yaml_path: translation/ot/job/003/023.yaml
  text: to a man whose way is hidden[b][a], and whom God has hedged in?
translation:
  language: hi
  text: उस पुरुष को, जिसका मार्ग छिपा हुआ है[a], और जिसे परमेश्वर ने चारों ओर से घेर रखा है[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘जिसका पथ गुप्त है।’
    reason: lexical_alternative
  - marker: b
    text: या ‘जिसे परमेश्वर ने बाड़ लगाकर घेर दिया है’ अथवा ‘जिसे परमेश्वर ने बंद कर दिया है।’
    reason: lexical_alternative
lexical_decisions:
- source_word: לְגֶבֶר
  choice: उस पुरुष को
  rationale: लְ पूर्व पद की प्रश्नवाचक संरचना से जुड़कर प्रकाश दिए जाने के प्राप्तकर्ता को बताता है। גֶּבֶר एकवचन पुल्लिंग है, इसलिए ‘पुरुष’ मूल रूप को सटीक रखता है।
- source_word: דַּרְכּוֹ
  choice: जिसका मार्ग
  rationale: דֶּרֶךְ जीवन की दिशा या दशा का रूपक हो सकता है। ‘मार्ग’ इस रूपक को बिना अधिक व्याख्या किए सुरक्षित रखता है।
- source_word: נִסְתָּרָה
  choice: छिपा हुआ है
  rationale: निफ़अल रूप निष्क्रिय अथवा अवस्थात्मक भाव देता है। यह कथन अस्पष्ट ही रहता है कि मार्ग उस पुरुष की दृष्टि से छिपा है या सामान्य रूप से गुप्त है।
- source_word: וַיָּסֶךְ
  choice: घेर रखा है
  rationale: क्रिया रोककर घेर देने या बंद कर देने का भाव व्यक्त करती है। ‘घेर रखा है’ पूर्ण हुई क्रिया के जारी परिणाम को स्वाभाविक हिन्दी में दर्शाता है।
- source_word: אֱלוֹהַּ
  choice: परमेश्वर
  rationale: यह अय्यूब में प्रयुक्त परमेश्वर के लिए एकवचन काव्यात्मक पद है। ‘परमेश्वर’ सुस्पष्ट और गरिमापूर्ण हिन्दी समतुल्य है।
- source_word: בַּעֲדוֹ
  choice: जिसे ... चारों ओर से
  rationale: इस क्रिया के साथ בַּעַד व्यक्ति के चारों ओर अवरोध या घेरा होने का भाव देता है; हिन्दी में ‘जिसे ... चारों ओर से घेर रखा है’ इसे स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: कष्टकारी घेरे में परमेश्वर की भूमिका
  choice: परमेश्वर को उस पुरुष को घेरने वाला स्पष्ट कर्ता रखा गया है।
  alternative: ऐसा कर्मवाच्य अनुवाद जिसमें परमेश्वर की भूमिका धुंधली हो जाए।
  rationale: मूल पाठ में אֱלוֹהַּ स्पष्ट कर्ता है; अय्यूब की शिकायत में निहित धर्मवैचारिक तनाव को नरम नहीं किया जाना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक और गरिमापूर्ण शैली रखी गई है। पद पिछले वाक्य से जुड़ा प्रश्नांश है, इसलिए आरम्भ में ‘उस पुरुष को’ और अंत में प्रश्नचिह्न रखा गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
