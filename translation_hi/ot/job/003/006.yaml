base_translation:
  language: en
  yaml_path: translation/ot/job/003/006.yaml
  text: As for that night[a], let darkness seize it; let it not rejoice among the days of the year; let it not enter into the number of the months.
translation:
  language: hi
  text: वह रात—घोर अंधकार उसे अपने वश में कर ले; वह वर्ष के दिनों के बीच आनन्द न मनाए[a], और महीनों की गिनती में न आए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वह वर्ष के दिनों में सम्मिलित न हो।” यहाँ प्रयुक्त इब्रानी क्रिया दुर्लभ है; कुछ लोग इसका अर्थ आनन्द मनाने के बजाय वर्ष के दिनों में न जोड़ा जाना समझते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלַּיְלָה הַהוּא
  choice: वह रात—
  rationale: पद के आरम्भ में रखे गए बलयुक्त विषय को स्वाभाविक हिन्दी में बनाए रखता है; डैश आगे आने वाले शाप-वचन से उसे स्पष्टतः जोड़ता है।
- source_word: יִקָּחֵהוּ
  choice: उसे अपने वश में कर ले
  rationale: לקח का मूल भाव ‘ले लेना’ है। यहाँ अंधकार के मानवीकरण और प्रतिकूल अधिकार को व्यक्त करने के लिए यह हिन्दी में स्वाभाविक तथा सशक्त है।
- source_word: אֹפֶל
  choice: घोर अंधकार
  rationale: אֹפֶל साधारण अंधकार से अधिक गहन अंधकार या तमस का बोध करा सकता है; ‘घोर अंधकार’ काव्यात्मक तीव्रता को स्पष्ट रखता है।
- source_word: אַל יִחַדְּ
  choice: आनन्द न मनाए
  rationale: इस दुर्लभ क्रियारूप का अर्थ विवादित है। एक सम्भव व्याख्या वर्ष के दिनों के साथ आनन्दपूर्ण सहभागिता है; मुख्य पाठ में यही अर्थ स्वाभाविक रूप से दिया गया है और ‘सम्मिलित न हो’ को पाद-टिप्पणी में सुरक्षित रखा गया है।
- source_word: בִּימֵי שָׁנָה
  choice: वर्ष के दिनों के बीच
  rationale: ב को यहाँ किसी समूह के भीतर होने के अर्थ में लिया गया है; यह वाक्यांश वार्षिक क्रम में सहभागिता व्यक्त करता है।
- source_word: בְּמִסְפַּר יְרָחִים
  choice: महीनों की गिनती में
  rationale: मूल की गणना-संबंधी छवि को संक्षिप्त और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אַל יָבֹא
  choice: न आए
  rationale: בוא के सामान्य अर्थ ‘आना/प्रवेश करना’ को गिनती में शामिल होने के प्रसंग में सहज हिन्दी के साथ सुरक्षित रखता है।
