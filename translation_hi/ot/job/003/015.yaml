- source_word: הַמְמַלְאִים
  choice: जो ... भरते थे
  rationale: वर्णनात्मक कृदन्त को प्रसंगानुसार भूतकालीन सम्बन्धवाचक उपवाक्य के रूप में प्रस्तुत किया गया है।
- source_word: בָּתֵּיהֶם
  choice: अपने घरों
  rationale: मूल संज्ञा का सामान्य अर्थ ‘घर’ है। ‘महल’ सम्भव प्रसंगगत व्याख्या है, पर स्रोत से अधिक विशिष्ट है। हिन्दी में कर्ता की ओर लौटते अधिकार को स्पष्ट करने के लिए ‘अपने’ स्वाभाविक है।
- source_word: כָּסֶף
