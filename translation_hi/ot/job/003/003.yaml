  yaml_path: translation/ot/job/003/003.yaml
  text: May the day perish on which I was born[a], and the night that said, ‘A man is conceived.’
translation:
  language: hi
  text: 'जिस दिन मैं जन्मा था, वह नष्ट हो जाए,


    और वह रात भी, जिसने कहा,


    “एक नर-शिशु का गर्भ ठहरा है।”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक पुरुष का गर्भाधान हुआ है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹאבַד
  choice: मिट जाए
  rationale: इच्छासूचक/शापसूचक भाव को स्वाभाविक हिन्दी में व्यक्त करता है; यह साधारण भविष्यवाणी नहीं, उस दिन के नष्ट हो जाने की कामना है।
- source_word: יוֹם
  choice: जिस दिन
  rationale: संदर्भ में अय्यूब के जन्म का विशिष्ट दिन अभिप्रेत है; सम्बन्धवाचक रचना हिन्दी में सहज है।
- source_word: אִוָּלֶד בּוֹ
  choice: मैं जन्मा
  rationale: נפעל रूप के निष्पन्न अर्थ ‘मेरा जन्म हुआ’ को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְהַלַּיְלָה
  choice: और वह रात भी
  rationale: दिन के समानान्तर शाप की दूसरी वस्तु को स्पष्ट करता है; ‘भी’ हिन्दी में समानान्तरता को स्वाभाविक बनाता है।
- source_word: אָמַר
  choice: जिसने कहा
  rationale: रात के मानवीकरण को बनाए रखता है।
- source_word: הֹרָה
  choice: गर्भ में आया है
  rationale: संदर्भ में गर्भधारण हो चुकने की घोषणा को सहज हिन्दी में व्यक्त करता है और रात को गर्भधारण करने वाला कर्ता नहीं बनाता।
- source_word: גָבֶר
  choice: एक पुरुष
  rationale: मूल शब्द के पुरुष-लिंग अर्थ को सीधे सुरक्षित रखता है; जन्म-संदर्भ में ‘बालक’ भी सम्भव है, इसलिए विकल्प पादटिप्पणी में दिया गया है।
