  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिन्दी। पंक्ति-विन्यास इब्रानी समानान्तरता को उभारता है। मुख्य पाठ में गָבֶר का अपेक्षाकृत औपचारिक ‘पुरुष’ रखा गया है और जन्म-संदर्भानुकूल विकल्प पादटिप्पणी में दिया गया है।
