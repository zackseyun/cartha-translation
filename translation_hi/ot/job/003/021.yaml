translation:
  language: hi
  text: 'जो मृत्यु की बाट जोहते हैं[a], पर वह आती नहीं,

    और उसके लिए छिपे हुए खज़ानों के लिए खोदने से भी अधिक खोदते हैं,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और वह वहाँ नहीं है”; इब्रानी में शाब्दिक रूप से “और वह नहीं है” है, अर्थात मृत्यु दिखाई नहीं देती या आती नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְחַכִּים
  choice: जो ... बाट जोहते हैं
  rationale: חכה का मूल अर्थ आशापूर्वक प्रतीक्षा करना है। ‘बाट जोहना’ आधुनिक हिंदी में स्वाभाविक है और संदर्भ में निहित तीव्र आकांक्षा को बढ़ाए बिना प्रतीक्षा का भाव बनाए रखता है।
- source_word: לַמָּוֶת
  choice: मृत्यु की
  rationale: यह प्रतीक्षा के लक्ष्य के रूप में मृत्यु को सीधे व्यक्त करता है; ‘बाट जोहना’ के साथ हिंदी में संबंधकारक रचना स्वाभाविक है।
- source_word: וְאֵינֶנּוּ
  choice: पर वह आती नहीं
  rationale: शाब्दिक रूप ‘और वह नहीं है’ है और पुल्लिंग एकवचन प्रत्यय मृत्यु की ओर संकेत करता है। संदर्भ में मृत्यु के उपस्थित या प्राप्त न होने का आशय है; हिंदी में ‘वह आती नहीं’ इसे स्वाभाविक रूप से व्यक्त करता है, जबकि पादटिप्पणी शाब्दिक अस्पष्टता सुरक्षित रखती है।
- source_word: וַיַּחְפְּרֻהוּ
  choice: और उसके लिए ... खोदते हैं
  rationale: חפר का ठोस अर्थ ‘खोदना’ है। रूपक को ‘खोजना’ में समतल करने के बजाय खोदने का सजीव बिंब सुरक्षित रखा गया है।
- source_word: מִמַּטְמוֹנִים
  choice: छिपे हुए खज़ानों से भी अधिक
  rationale: מַטְמוֹן छिपाकर रखे या गड़े धन को दर्शाता है। ‘छिपे हुए खज़ाने’ अर्थ और खोदने के बिंब दोनों को बनाए रखता है; מן की तुलनात्मक शक्ति ‘से भी अधिक’ से व्यक्त हुई है।
