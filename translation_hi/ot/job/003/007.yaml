- source_word: הִנֵּה
  choice: देखो
  rationale: ध्यान आकर्षित करने वाले उद्गार को आधुनिक और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: גַלְמוּד
  choice: बाँझ
  rationale: इस संदर्भ में ऐसी रात का बिंब है जिसमें कोई जन्म न हो; शब्द की उजाड़ या निष्फल होने की छाया भी बनी रहती है।
- source_word: רְנָנָה
  choice: आनंद का जयकारा
  rationale: यह ऊँचे स्वर में निकली हर्षध्वनि को व्यक्त करता है, केवल सामान्य आनंद को नहीं।
- source_word: אַל תָּבוֹא ... בּוֹ
  choice: उसमें ... न गूँजे
  rationale: इब्रानी में शाब्दिक अर्थ 'उसमें प्रवेश न करे' है; हिन्दी में ध्वनि के संदर्भ में 'न गूँजे' अधिक स्वाभाविक है और आशय सुरक्षित रखता है।
