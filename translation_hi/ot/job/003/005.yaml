base_translation:
  language: en
  yaml_path: translation/ot/job/003/005.yaml
  text: May darkness and deep shadow reclaim it[a]; may a cloud dwell over it[b]; may the blacknesses of the day terrify it.
translation:
  language: hi
  text: अंधकार और घोर छाया उसे फिर अपने अधिकार में ले लें[a]; उस पर बादल ठहरा रहे; दिन के अँधियारे[b] उसे भयभीत कर दें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘घोर छाया’ के लिए ‘मृत्यु की छाया’ या ‘घोर अंधकार’ भी संभव है।
    reason: lexical_alternative
  - marker: b
    text: ‘दिन के अँधियारे’ वाला इब्रानी पदबंध कठिन है। इसके अर्थ ‘दिन का अँधकार’, ‘दिन के ग्रहण’ या, कम संभावना से, ‘दिन की कड़वाहटें’ भी हो सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: יִגְאָלֻהוּ
  choice: उसे फिर अपने अधिकार में ले लें
  rationale: גאל का मूल भाव किसी वस्तु को छुड़ाने, वापस लेने या अपना दावा करके पुनः अधिकार में लेने का है। इस शाप के संदर्भ में यह अभिव्यक्ति सकारात्मक धार्मिक अर्थ थोपे बिना उस दिन को अंधकार द्वारा फिर ले लिए जाने का भाव रखती है।
- source_word: חֹשֶׁךְ
  choice: अंधकार
  rationale: यह सामान्य और प्रसंगानुकूल अर्थ है; अय्यूब अपने जन्म-दिन के प्रकाश को मिट जाने की कामना करता है।
- source_word: צַלְמָוֶת
  choice: घोर छाया
  rationale: शब्द का अर्थ परंपरागत रूप से ‘मृत्यु की छाया’ और व्यापक रूप से ‘घोर अंधकार’ समझा गया है। ‘घोर छाया’ मूल बिंब और उसकी गंभीरता को बनाए रखते हुए किसी एक व्युत्पत्तिगत समझ को निर्णायक नहीं बनाती।
- source_word: תִּשְׁכָּן עָלָיו
  choice: उसके ऊपर … छाया रहे
  rationale: שׁכן का अर्थ बसना, ठहरना या बने रहना है। बादल के साथ ‘ऊपर छाया रहे’ आधुनिक हिन्दी में स्वाभाविक है और स्थायी रूप से ढकने का चित्र सुरक्षित रखता है।
- source_word: עֲנָנָה
  choice: बादल
  rationale: यह एक ठोस मौसम-संबंधी बिंब है; हिन्दी में एकवचन ‘बादल’ सामूहिक अर्थ भी व्यक्त कर सकता है।
- source_word: יְבַעֲתֻהוּ
  choice: उसे भयभीत कर दें
  rationale: בעת के इस रूप में तीव्र भय उत्पन्न करने का भाव है। यह अनिष्ट-कामना की तीव्रता और दिन के मानवीकरण दोनों को बनाए रखता है।
- source_word: כִּמְרִירֵי יוֹם
  choice: दिन के अँधियारे
  rationale: यह कठिन पदबंध संभवतः दिन को काला करने वाली छायाओं या अँधेरों को दर्शाता है। बहुवचन-सदृश ‘अँधियारे’ मूल की काव्यात्मक विचित्रता बनाए रखता है; अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
