id: JOB.3.4
reference: Job 3:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הַ/יּ֥וֹם הַ/ה֗וּא יְֽהִ֫י חֹ֥שֶׁךְ אַֽל יִדְרְשֵׁ֣/הוּ אֱל֣וֹהַּ מִ/מָּ֑עַל וְ/אַל תּוֹפַ֖ע עָלָ֣י/ו נְהָרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/004.yaml
  text: May that day be darkness[a]; may God above not seek it[b], and may no light shine upon it.
translation:
  language: hi
  text: वह दिन अंधकार हो जाए; ऊपर से परमेश्वर उसकी सुधि न ले[a], और उस पर कोई उजियाला न चमके[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसे न खोजे”; इब्रानी क्रिया का अर्थ खोजने, उसकी ओर ध्यान देने या उसकी परवाह करने का हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “कोई चमक” अथवा “कोई दीप्ति।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיּוֹם הַהוּא
  choice: वह दिन
  rationale: यह संकेतवाचक पद अय्यूब के जन्म के दिन की ओर लौटता है; ‘वह दिन’ स्वाभाविक और सटीक है।
- source_word: יְהִי חֹשֶׁךְ
  choice: अंधकार हो जाए
  rationale: इच्छा अथवा अभिशाप व्यक्त करने वाले रूप को ‘हो जाए’ से स्वाभाविक हिन्दी में सुरक्षित रखा गया है, और חֹשֶׁךְ के संज्ञात्मक भाव के लिए ‘अंधकार’ रखा गया है।
- source_word: יִדְרְשֵׁהוּ
  choice: उसकी सुधि न ले
  rationale: דרש का मूल अर्थ खोजने या पूछताछ करने से लेकर ध्यान देने और परवाह करने तक फैला है। इस प्रसंग में ‘सुधि लेना’ उस दिन पर परमेश्वर का ध्यान जाने का भाव देता है, जबकि पादटिप्पणी शाब्दिक विकल्प बचाती है।
- source_word: אֱלוֹהַּ מִמָּעַל
  choice: ऊपर से परमेश्वर
  rationale: אֱלוֹהַּ को बिना विस्तार के ‘परमेश्वर’ और מִמָּעַל को ‘ऊपर से’ अनूदित किया गया है; इससे काव्यात्मक स्थान-बोध बना रहता है।
- source_word: תּוֹפַע
  choice: चमके
  rationale: हिफ़ील रूप में प्रकाश के प्रकट होने या चमकने का भाव है; ‘चमके’ संक्षिप्त और काव्यात्मक है।
- source_word: נְהָרָה
  choice: उजियाला
  rationale: यह शब्द प्रकाश, चमक या दीप्ति को सूचित करता है। ‘उजियाला’ अंधकार के समानांतर स्वाभाविक काव्यात्मक हिन्दी देता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में रखे गए हैं।
theological_decisions:
- issue: अभिशाप-जैसी कामना में परमेश्वर का सीधा उल्लेख
  choice: ‘ऊपर से परमेश्वर’ को स्पष्ट रूप से बनाए रखना
  alternative: ‘ऊपर का स्वर्ग’ या कोई अप्रत्यक्ष दैवी संकेत
  rationale: इब्रानी पाठ परमेश्वर का स्पष्ट नाम लेता है। अय्यूब के विलाप की निर्भीकता को नरम या अस्पष्ट नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर, काव्यात्मक और सहज शैली रखी गई है। ‘सुधि लेना’ सामान्य गद्य से थोड़ा ऊँचा है, पर विलाप के काव्य-स्वर के अनुकूल और व्यापक रूप से बोधगम्य है।
