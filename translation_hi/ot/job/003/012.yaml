  choice: ने मुझे थामा
  rationale: קדם यहाँ आगे बढ़कर मिलने या ग्रहण करने के अर्थ में है। घुटनों के साथ यह जन्मे हुए शिशु को संभालने का बिंब देता है; “थामा” हिन्दी में इस भाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בִרְכָּיִם
