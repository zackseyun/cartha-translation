- source_word: וּמַה
  choice: और ... क्यों
  rationale: शाब्दिक रूप से “और क्या” होते हुए भी समानांतर प्रश्न में इसका आशय “और क्यों” है।
- source_word: שָׁדַיִם
  choice: स्तन
  rationale: मूल का स्पष्ट शारीरिक शब्द रखा गया है। “माँ के” जोड़ना संदर्भतः उचित होता, पर वह इब्रानी में व्यक्त नहीं है।
- source_word: כִּי
  choice: कि
  rationale: यह अगले परिणाम अथवा प्रयोजन को जोड़ता है; हिन्दी “कि” मूल की संक्षिप्त और कुछ तनावपूर्ण रचना को बनाए रखता है।
- source_word: אִינָק
  choice: मैं दूध पीता
  rationale: यह क्रिया शिशु के स्तन से दूध खींचकर पीने को दर्शाती है। “दूध पीता” सामान्य आधुनिक हिन्दी में स्पष्ट है, जबकि अधिक शाब्दिक अर्थ पादटिप्पणी में दिया गया है।
