  yaml_path: translation/ot/job/007/001.yaml
  text: Is not man consigned to hard service on earth[a], and are not his days like those of a hired worker?
translation:
  language: hi
  text: क्या मनुष्य पृथ्वी पर कठिन सेवा के लिए नियुक्त नहीं है, और क्या उसके दिन वेतनभोगी मज़दूर के दिनों के समान नहीं हैं?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “क्या पृथ्वी पर मनुष्य के लिए युद्ध या सैन्य सेवा नहीं है?” इब्रानी צָבָא का अर्थ युद्ध या सैन्य सेवा हो सकता है, पर यहाँ “वेतनभोगी मज़दूर” के दिनों से समानांतरता सम्भवतः कठिन और बोझिल सेवा की अवधि की ओर संकेत करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: क्या ... नहीं
  rationale: यह ऐसा अलंकारिक प्रश्न आरम्भ करता है जिसका अपेक्षित उत्तर ‘हाँ’ है; हिन्दी में यह रचना प्रश्नात्मक बल को स्वाभाविक रूप से बनाए रखती है।
- source_word: צָבָא
  choice: कठिन सेवा करनी पड़ती
  rationale: शब्द का अर्थ सैन्य सेवा या युद्ध हो सकता है, पर मज़दूर के दिनों से समानांतरता यहाँ थोपी हुई, श्रमसाध्य सेवा की अवधि की ओर संकेत करती है। ‘करनी पड़ती’ उसकी बाध्यता को व्यक्त करता है।
- source_word: אֱנוֹשׁ
  choice: मनुष्य
  rationale: यह नश्वर और दुर्बल मानवता को सूचित करता है; ‘मनुष्य’ आधुनिक मानक हिन्दी में सामान्य मानव के अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עַל־אָרֶץ
  choice: पृथ्वी पर
  rationale: व्यापक मानवीय परिवेश को व्यक्त करने वाला सामान्य स्थानवाचक अनुवाद है, किसी विशेष भूमि को नहीं।
- source_word: וְכִימֵי
  choice: और क्या उसके दिन ... के दिनों के समान नहीं होते
  rationale: तुलना को दूसरे अलंकारिक प्रश्न के रूप में हिन्दी में स्पष्ट और सहज बनाता है।
- source_word: שָׂכִיר
  choice: मज़दूर
  rationale: सन्दर्भ वेतन पर काम करने वाले श्रमिक का है। ‘मज़दूर’ सहज आधुनिक हिन्दी है; इस वाक्य में नियुक्त श्रमिक का आशय स्पष्ट है।
- source_word: יָמָיו
  choice: उसके दिन
  rationale: जीवन के दिनों की मूल कालगत उपमा को बनाए रखता है।
