  edition: WLC
  text: אִם שָׁכַ֗בְתִּי וְ/אָמַ֗רְתִּי מָתַ֣י אָ֭קוּם וּ/מִדַּד עָ֑רֶב וְ/שָׂבַ֖עְתִּי נְדֻדִ֣ים עֲדֵי נָֽשֶׁף־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/004.yaml
  text: When I lie down[a], I say, ‘When will I arise?’ But the evening drags on[c][b], and I am full of tossing until dawn.
translation:
  language: hi
  text: जब मैं लेटता हूँ[a], तो कहता हूँ, “मैं कब उठूँगा?” पर साँझ लंबी खिंचती जाती है[b], और पौ फटने तक[c] करवटें बदलते-बदलते मेरा जी भर जाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यदि मैं लेटता हूँ।” हिब्रू कण का अर्थ ‘यदि’ हो सकता है, पर यहाँ वह सम्भवतः बार-बार घटने वाली परिस्थिति बताता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “और साँझ नापी जाती है।” भाव यह है कि साँझ बहुत धीरे-धीरे बीतती और लंबी खिंचती प्रतीत होती है।
    reason: lexical_alternative
  - marker: c
    text: हिब्रू शब्द का अर्थ ‘धुँधलका’ है और वह साँझ या भोर, दोनों को सूचित कर सकता है। यहाँ सम्भवतः भोर का धुँधलका अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: जब
  rationale: यद्यपि यह कण प्रायः शर्तसूचक ‘यदि’ होता है, यहाँ अय्यूब के बार-बार होने वाले रात्रिकालीन अनुभव को व्यक्त करने के लिए कालसूचक ‘जब’ अधिक स्वाभाविक है; वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: שָׁכַבְתִּי וְאָמַרְתִּי
  choice: मैं लेटता हूँ… तो कहता हूँ
  rationale: हिब्रू के पूर्णकालिक रूप यहाँ एक बार की घटना नहीं, बल्कि बार-बार होने वाला अनुभव बताते हैं; हिन्दी का सामान्य वर्तमान काल इस पुनरावृत्ति को स्पष्ट करता है।
- source_word: מָתַי אָקוּם
  choice: मैं कब उठूँगा?
  rationale: קום का सामान्य अर्थ ‘उठना’ है। प्रश्न रात के समाप्त होने की व्याकुल प्रतीक्षा व्यक्त करता है, बिना किसी अतिरिक्त धार्मिक अर्थ के।
- source_word: וּמִדַּד עָרֶב
  choice: पर साँझ लंबी खिंचती जाती है
  rationale: מדד मूलतः ‘नापना’ से संबंधित है, पर प्रसंग में साँझ/रात के अत्यन्त धीरे बीतने का अनुभव है। ‘लंबी खिंचती जाती है’ उस अनुभूति को स्वाभाविक हिन्दी में व्यक्त करता है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: וְשָׂבַעְתִּי נְדֻדִים
  choice: करवटें बदलते-बदलते मेरा जी भर जाता है
  rationale: שבע ‘भर जाना/तृप्त हो जाना’ और נְדֻדִים बेचैन भटकाव या करवटों को दर्शाता है। नकारात्मक प्रसंग में ‘मेरा जी भर जाता है’ अनचाही अधिकता और ऊब, दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עֲדֵי נָשֶׁף
  choice: पौ फटने तक
  rationale: נָשֶׁף का अर्थ संध्या अथवा भोर का धुँधलका हो सकता है। यहाँ लेटने से लेकर उठने की प्रतीक्षा तक का रात्रिकालीन क्रम भोर की ओर संकेत करता है; वास्तविक शब्दगत द्व्यर्थता पादटिप्पणी में सुरक्षित है।
