  yaml_path: translation/ot/job/007/016.yaml
  text: I despise my life[a]; I will not live forever. Leave me alone[b], for my days are a breath.
translation:
  language: hi
  text: मैं अपने जीवन से घृणा करता हूँ[a]; मैं सदा जीवित नहीं रहूँगा। मुझे अकेला छोड़ दे, क्योंकि मेरे दिन बस एक साँस हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं इसे तुच्छ जानता हूँ” अथवा “मैं इसे अस्वीकार करता हूँ।” इब्रानी में क्रिया का कर्म नहीं बताया गया है।
    reason: lexical_alternative
  - marker: b
    text: “साँस” के लिए प्रयुक्त इब्रानी शब्द का अर्थ “भाप” या “वाष्प” भी हो सकता है; इससे जीवन की संक्षिप्तता और क्षणभंगुरता प्रकट होती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מָאַסְתִּי
  choice: मुझे अपने जीवन से घृणा है
  rationale: क्रिया का अर्थ ‘अस्वीकार करना, तुच्छ जानना, घृणा करना’ है। इब्रानी में कर्म नहीं कहा गया; प्रसंग के आधार पर ‘अपने जीवन’ जोड़ा गया है और इस पूर्ति को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: לֹא לְעֹלָם אֶחְיֶה
  choice: मैं सदा जीवित नहीं रहूँगा
  rationale: यह नकार, ‘सदा’ और ‘मैं जीवित रहूँगा’ का सीधा तथा स्वाभाविक हिन्दी रूप है; इसे अनावश्यक रूप से इच्छा के रूप में नहीं बदला गया।
- source_word: חֲדַל מִמֶּנִּי
  choice: मुझे अकेला छोड़ दे
  rationale: शाब्दिक भाव ‘मुझसे रुक जा/हट जा’ है। एकवचन आज्ञार्थक को बनाए रखते हुए आधुनिक हिन्दी में अय्यूब की विनती को स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह अय्यूब की विनती का कारण प्रस्तुत करता है।
- source_word: הֶבֶל
  choice: एक साँस
  rationale: शब्द साँस, वाष्प, क्षणभंगुरता और असारता का बोध करा सकता है। यहाँ ‘एक साँस’ जीवन की संक्षिप्तता और क्षणभंगुरता को ठोस, काव्यात्मक रूप में रखता है।
- source_word: יָמָי
  choice: मेरे दिन
  rationale: यह अय्यूब के जीवनकाल के दिनों के लिए प्रयुक्त सीधा संबंधवाचक बहुवचन है।
theological_decisions:
- issue: מָאַסְתִּי का अनुक्त कर्म
  choice: मुख्य पाठ में ‘अपने जीवन’ की पूर्ति
  alternative: ‘मुझे इससे घृणा है’ अथवा केवल ‘मैं घृणा करता हूँ’
  rationale: प्रसंग जीवन से विरक्ति की ओर संकेत करता है, पर इब्रानी कर्म को खुला छोड़ता है; इसलिए मुख्य पाठ को बोधगम्य बनाते हुए पादटिप्पणी में वास्तविक अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक शैली रखी गई है। अय्यूब की तीखी विरक्ति तथा परमेश्वर से उसकी सीधी, एकवचन विनती को नरम नहीं किया गया।
