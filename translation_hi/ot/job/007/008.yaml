  yaml_path: translation/ot/job/007/008.yaml
  text: The eye of the one who sees me will no longer behold me[a]; your eyes will be on me[b], but I will be gone.
translation:
  language: hi
  text: जो आँख मुझे देखती है, वह मुझे फिर न देखेगी[a]; तेरी आँखें मुझ पर होंगी[b], पर मैं नहीं रहूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो आँख मुझे देखती है, वह मुझे न देखेगी।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “तेरी आँखें मुझ पर हैं, और मैं नहीं हूँ।” प्रसंग में इसका आशय है कि जब तू मुझे देखने या खोजने के लिए दृष्टि करेगा, तब मैं नहीं रहूँगा।
    reason: lexical_alternative
lexical_decisions:
- source_word: תְשׁוּרֵנִי
  choice: मुझे ... देखेगी
  rationale: שׁור का अर्थ ध्यान से देखना या निहारना है। सहज आधुनिक हिन्दी में ‘देखेगी’ दृश्य बिंब को स्पष्ट रखता है; ‘निहारेगी’ यहाँ अनावश्यक रूप से काव्यात्मक लग सकता है। निषेध सहित अपूर्ण क्रिया को प्रसंगानुसार भविष्यकाल में व्यक्त किया गया है।
- source_word: עֵין רֹאִי
  choice: जो आँख मुझे देखती है
  rationale: शाब्दिक रचना ‘मुझे देखनेवाले की आँख’ है। हिन्दी में ‘जो आँख मुझे देखती है’ इब्रानी के आँख-वाले बिंब और उसकी सामान्य, अनिश्चित व्याप्ति दोनों को स्वाभाविक रूप से बनाए रखता है।
- source_word: לֹא
  choice: फिर न
  rationale: मूल शब्द साधारण निषेध है, पर आनेवाले लोप या मृत्यु के प्रसंग में ‘फिर न’ समयगत भाव को स्वाभाविक हिन्दी में व्यक्त करता है। पादटिप्पणी अधिक शाब्दिक संभावना सुरक्षित रखती है।
- source_word: עֵינֶיךָ
  choice: तेरी आँखें
  rationale: इब्रानी बहुवचन को बनाए रखा गया है। एकवचन प्रत्यक्ष संबोधन के लिए ‘तेरी’ चुना गया है, क्योंकि अय्यूब यहाँ परमेश्वर से सीधे बोल रहा है; नाम को पाठ में जोड़ा नहीं गया।
- source_word: בִּי
  choice: मुझे ढूँढ़ेंगी
  rationale: शाब्दिक रूप से ‘मुझ पर’ है। अगले वाक्यांश ‘मैं नहीं रहूँगा’ के साथ यह मुहावरा उस स्थिति को बताता है जिसमें परमेश्वर की दृष्टि उसे खोजती है, पर वह मिल नहीं पाता। शाब्दिक स्वरूप पादटिप्पणी में दिया गया है।
- source_word: וְאֵינֶנִּי
  choice: पर मैं नहीं रहूँगा
  rationale: शाब्दिक अर्थ ‘और मैं नहीं [हूँ]’ है। प्रसंग भविष्य की ओर उन्मुख है और यह पद लोप अथवा मृत्यु का संकेत देता है। ‘मैं नहीं रहूँगा’ अर्थ को स्पष्ट करता है, पर मृत्यु को उससे अधिक निश्चित रूप से नहीं कहता जितना मूल पाठ कहता है।
theological_decisions:
- issue: ‘तेरी आँखें’ का संबोधित व्यक्ति
  choice: परमेश्वर से प्रत्यक्ष संबोधन
  alternative: किसी सामान्य देखनेवाले से संबोधन
  rationale: आस-पास के पदों में अय्यूब परमेश्वर से सीधे बात करता है, इसलिए दूसरा पुरुष परमेश्वर की दृष्टि को सूचित करता है। फिर भी अनुवाद में ‘हे परमेश्वर’ नहीं जोड़ा गया, क्योंकि मूल पद में नाम नहीं है।
- issue: ‘मैं नहीं रहूँगा’ का आशय
  choice: लोप या मृत्यु की ओर संकेत करनेवाला खुला कथन
  alternative: स्पष्ट रूप से ‘मैं मर चुका होऊँगा’
  rationale: אֵינֶנִּי मृत्यु को सूचित कर सकता है, पर उसका रूप शाब्दिक रूप से ‘मैं नहीं हूँ’ है। अनुवाद मूल की गहनता और कुछ हद तक अस्पष्टता बनाए रखता है, न कि मृत्यु-संबंधी किसी विकसित धर्मवैज्ञानिक निष्कर्ष को जोड़ता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज काव्यात्मक शैली रखी गई है। परमेश्वर से अय्यूब के सीधे और निकट संबोधन के अनुरूप ‘तेरी’ का प्रयोग किया गया है। मुख्य पाठ अर्थ-स्पष्ट है, जबकि पादटिप्पणियाँ इब्रानी की अधिक शाब्दिक संरचना और वास्तविक वैकल्पिक पाठ-संभावना को सुरक्षित रखती हैं।
