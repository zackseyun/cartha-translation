  text: that you attend to him every morning[b][a], and test him every moment?
translation:
  language: hi
  text: 'कि तू हर सुबह उसकी सुधि लेता है,[a]

    और हर पल उसे परखता है?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हर सुबह उससे मिलने आता है” अथवा “हर सुबह उस पर ध्यान देता है।” इब्रानी क्रिया का अर्थ मिलने आना, सुधि लेना या ध्यान देना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “हर पल उसकी जाँच करता है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפְקְדֶנּוּ
  choice: तू उसकी सुधि लेता है
  rationale: פקד का अर्थ यहाँ किसी पर ध्यान देना, उसकी खोज-खबर लेना या उसे देखने आना हो सकता है। अय्यूब की शिकायत के संदर्भ में ‘सुधि लेना’ परमेश्वर के लगातार ध्यान को व्यक्त करता है, पर उसे केवल कृपालु देखभाल नहीं बनाता।
- source_word: לִבְקָרִים
  choice: हर सुबह
  rationale: बहुवचन समय-संज्ञा के साथ ל बार-बार होने की बात व्यक्त करता है; ‘हर सुबह’ स्वाभाविक हिन्दी में इस आवृत्ति को बनाए रखता है।
- source_word: לִרְגָעִים
  choice: हर पल
  rationale: רגעים छोटे-छोटे क्षणों को दर्शाता है; ‘हर पल’ निरंतर और बारंबार निरीक्षण का भाव सहज रूप से देता है।
- source_word: תִּבְחָנֶנּוּ
  choice: उसे परखता है
  rationale: בחן का अर्थ जाँचकर परखना है। ‘परखना’ गहन निरीक्षण और परीक्षा—दोनों भावों को समेटता है।
- source_word: ־נּוּ
  choice: उसकी / उसे
  rationale: पुल्लिंग एकवचन प्रत्यय पिछले पद में आए मनुष्य की ओर संकेत करता है; हिन्दी में कारक के अनुसार ‘उसकी’ और ‘उसे’ उसी एकवचन संदर्भ को बनाए रखते हैं।
theological_decisions:
- issue: परमेश्वर के ध्यान का स्वर
  choice: लगातार और बोझिल लगने वाली ईश्वरीय निगरानी का भाव बनाए रखा गया है।
  alternative: इसे केवल कृपालु भेंट या स्नेहपूर्ण देखभाल के रूप में प्रस्तुत करना।
  rationale: अय्यूब की शिकायत में यह ध्यान सांत्वना नहीं, बल्कि निरंतर जाँच जैसा अनुभव होता है। ‘सुधि लेना’ मूल क्रिया की व्यापकता रखता है, जबकि अगली पंक्ति का ‘परखता’ नकारात्मक संदर्भ स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक और गरिमापूर्ण शैली रखी गई है। पिछले पद से चल रहे एकवचन अनौपचारिक ईश-संबोधन के अनुरूप ‘तू’ रखा गया है। दोनों पंक्तियों की समानांतर रचना और प्रश्नवाचक स्वर सुरक्षित हैं।
