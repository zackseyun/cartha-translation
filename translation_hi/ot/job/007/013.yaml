  yaml_path: translation/ot/job/007/013.yaml
  text: When I say[a], ‘My bed will comfort me[b]; my couch will bear my complaint,’
translation:
  language: hi
  text: जब मैं कहता हूँ[a], “मेरा बिछौना मुझे सांत्वना देगा; मेरी शय्या मेरी शिकायत[b] का भार उठाएगी,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “क्योंकि मैंने कहा” अथवा “यदि मैं कहूँ।” यहाँ इब्रानी כִּי के एक से अधिक अर्थ संभव हैं; अगले पद के प्रवाह में “जब मैं कहता हूँ” सबसे उपयुक्त लगता है।
    reason: lexical_alternative
  - marker: b
    text: या “मेरे मनन” अथवा “मेरी व्यथा-कथा।” इब्रानी שִׂיחַ चिंतन-मनन या दुःख भरी वाणी, दोनों को सूचित कर सकता है; अय्यूब की पीड़ा के प्रसंग में “शिकायत” अधिक संभावित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אָמַרְתִּי
  choice: जब मैं कहता हूँ
  rationale: כִּי यहाँ समय अथवा परिस्थिति का संबंध दिखा सकता है, और पूर्ण क्रिया אָמַרְתִּי प्रसंग में अय्यूब के बार-बार मन में कहने को व्यक्त करती है। यह अनुवाद अगले पद में उसके आशा के विफल होने की ओर स्वाभाविक रूप से ले जाता है।
- source_word: תְּנַחֲמֵנִי
  choice: मुझे सांत्वना देगा
  rationale: नחם के पिएल रूप का मूल भाव सांत्वना या ढाढ़स देना है; यह अय्यूब की पीड़ा में बिछौने से अपेक्षित राहत को स्पष्ट रखता है।
- source_word: עַרְשִׂי
  choice: मेरा बिछौना
  rationale: עֶרֶשׂ बिछौने या पलंग का द्योतक है। ‘बिछौना’ अगले समानार्थी शब्द से काव्यात्मक भिन्नता बनाए रखता है।
- source_word: יִשָּׂא
  choice: भार उठाएगी
  rationale: נשא का मूल अर्थ उठाना, ढोना या सहना है। ‘भार उठाना’ शिकायत को बोझ के रूप में प्रस्तुत करने वाले रूपक को सुरक्षित रखता है।
- source_word: בְשִׂיחִי
  choice: मेरी शिकायत
  rationale: שִׂיחַ मनन, व्यथा-कथन या शिकायत को सूचित कर सकता है। अय्यूब के दुःखपूर्ण विलाप के प्रसंग में ‘शिकायत’ सबसे उपयुक्त है, जबकि अन्य अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: מִשְׁכָּבִי
  choice: मेरी शय्या
  rationale: מִשְׁכָּב लेटने के स्थान, बिछौने या शय्या को दर्शाता है। ‘शय्या’ पहले चरण के ‘बिछौना’ के साथ समानांतरता और हल्की शब्द-विविधता दोनों बनाए रखती है।
theological_decisions: []
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी रखी गई है। ‘बिछौना/शय्या’ से इब्रानी काव्य की समानांतर समानार्थकता बनी रहती है, और ‘भार उठाएगी’ मूल के रूपक को बिना सपाट किए प्रस्तुत करता है।
