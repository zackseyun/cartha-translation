  text: Am I the sea[a], or a sea monster[b], that you set a guard over me?
translation:
  language: hi
  text: क्या मैं समुद्र हूँ या समुद्री दैत्य[a], कि तू मुझ पर पहरा बैठाता है?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अजगर’ अथवा ‘सर्प’। इब्रानी तन्नीन किसी बड़े, भयावह प्राणी के लिए प्रयुक्त होता है और प्रायः समुद्र तथा अराजकता की काव्यात्मक छवियों से जुड़ा है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘तू मेरे ऊपर निगरानी रखता है।’
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיָם
  choice: क्या मैं समुद्र हूँ
  rationale: प्रश्नवाचक הֲ और יָם को सीधे आलंकारिक प्रश्न के रूप में प्रस्तुत किया गया है। ‘समुद्र’ इब्रानी काव्य में निहित विशाल और अराजक शक्ति की छवि को बनाए रखता है।
- source_word: אִם
  choice: या
  rationale: यहाँ אִם दो विकल्पों वाले आलंकारिक प्रश्न में वियोजक अर्थ देता है।
- source_word: תַּנִּין
  choice: कोई समुद्री दैत्य
  rationale: यह शब्द बड़े और भयावह जलीय प्राणी, अजगर या सर्प को सूचित कर सकता है। ‘समुद्री दैत्य’ समुद्र के समानांतर काव्यात्मक छवि को स्पष्ट रखता है, पर किसी विशिष्ट पौराणिक पहचान को आरोपित नहीं करता। ‘कोई’ हिंदी में अनिश्चित संज्ञा को स्वाभाविक बनाता है।
- source_word: כִּי
  choice: कि
  rationale: यह आलंकारिक प्रश्न के बाद उस व्यवहार को प्रस्तुत करता है जिसके कारण तुलना की गई है; हिंदी में ‘कि’ मूल वाक्य की संक्षिप्त काव्यात्मक संरचना बनाए रखता है।
- source_word: תָשִׂים
  choice: बैठाता है
  rationale: שׂים का अर्थ रखना या नियुक्त करना है। ‘पहरा बैठाना’ आधुनिक हिंदी में निगरानी नियुक्त करने का स्वाभाविक मुहावरा है।
- source_word: עָלַי
  choice: मुझ पर
  rationale: עַל यहाँ अय्यूब पर की जा रही निगरानी या नियंत्रण की दिशा व्यक्त करता है।
- source_word: מִשְׁמָר
  choice: पहरा
  rationale: यह शब्द पहरे, निगरानी या हिरासत का अर्थ दे सकता है। ‘पहरा’ लगाए गए नियंत्रण और सतत निगरानी—दोनों भावों को संक्षेप में व्यक्त करता है।
theological_decisions:
- issue: תַּנִּין की समुद्र और अराजकता से जुड़ी काव्यात्मक छवि
  choice: समुद्री दैत्य
  alternative: अजगर; सर्प; विशाल जलीय जीव
  rationale: अय्यूब शिकायत करता है कि उसके साथ मानो किसी ऐसी भयंकर शक्ति जैसा व्यवहार किया जा रहा है जिसे काबू में रखने के लिए पहरा आवश्यक हो। अनुवाद इस तनाव को बनाए रखता है, पर पद में स्पष्ट न की गई कोई विस्तृत पौराणिक व्यवस्था नहीं जोड़ता।
- issue: परमेश्वर से अय्यूब का सीधा संबोधन
  choice: तू
  alternative: आप
  rationale: इब्रानी क्रिया एकवचन प्रत्यक्ष संबोधन है। ‘तू’ हिंदी बाइबलीय-काव्य शैली में निकट, तीखा और सीधा संबोधन सुरक्षित रखता है; यह अनादर का संपादकीय निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और काव्यात्मक रखी गई है। ‘समुद्री दैत्य’ सामान्य पाठक के लिए बोधगम्य है, जबकि पादटिप्पणी इब्रानी शब्द की व्यापक अर्थ-सीमा सुरक्षित रखती है। ‘पहरा बैठाना’ सहज हिंदी मुहावरा है और आरोपित निगरानी का भाव व्यक्त करता है।
