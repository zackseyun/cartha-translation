translation:
  language: hi
  text: 'मेरा मांस कीड़ों और धूल के ढेलों से ढका है;

    मेरी त्वचा बंद हो जाती है[a], फिर फूट पड़ती है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरी त्वचा कठोर पड़ जाती है, फिर से बिगड़ जाती है।” अंतिम दो इब्रानी क्रियाओं का अर्थ कठिन है; संभवतः यह पंक्ति उस त्वचा का वर्णन करती है जो थोड़ी देर के लिए बंद हो जाती है और फिर से फट जाती है।
    reason: alternative_reading
lexical_decisions:
- source_word: לָבַשׁ
  choice: ढका है
  rationale: मूल क्रिया का शाब्दिक चित्र ‘पहनना/ओढ़ना’ है; हिन्दी में मांस के विषय में ‘से ढका है’ स्वाभाविक रहते हुए पूरे शरीर पर छाए होने की तीव्र छवि बनाए रखता है।
- source_word: בְּשָׂרִי
  choice: मेरा मांस
  rationale: ‘मांस’ प्रत्यक्ष शारीरिक अर्थ को बनाए रखता है और सामान्य ‘शरीर’ की अपेक्षा अय्यूब की पीड़ा को अधिक मूर्त रूप देता है।
- source_word: רִמָּה
  choice: कीड़े
  rationale: यह शब्द सड़न से जुड़े कीड़ों या लार्वों को सूचित कर सकता है। ‘कीड़े’ व्यापक और सहज हिन्दी है; ‘मक्खियों के लार्वे’ अधिक संकीर्ण व्याख्या होती।
- source_word: גיש עפר
  choice: धूल के ढेले
  rationale: दुर्लभ ‘גיש’ को ढेले या जमे हुए पिंड के अर्थ में समझा गया है, जबकि ‘עפר’ धूल है। यह चयन मूल की मिट्टी-जैसी, जमी हुई परत की छवि रखता है।
- source_word: עוֹרִי
  choice: मेरी त्वचा
  rationale: यह ‘त्वचा’ का सामान्य शब्द है; आधुनिक हिन्दी में यह स्पष्ट, स्वाभाविक और गरिमापूर्ण है।
- source_word: רָגַע
  choice: भर जाती है
  rationale: कठिन क्रिया को प्रसंग में घाव के कुछ समय के लिए बंद या भर जाने के रूप में लिया गया है। ‘भर जाती है’ हिन्दी में रोगग्रस्त त्वचा के अस्थायी रूप से ठीक होने की स्वाभाविक अभिव्यक्ति है।
- source_word: וַיִּמָּאֵס
  choice: फिर फूट पड़ती है
  rationale: इस शारीरिक प्रसंग में कठिन क्रिया को त्वचा के फिर खुलने या बिगड़ने के अर्थ में लिया गया है। ‘फिर फूट पड़ती है’ चक्रीय घाव की ठोस छवि देता है, पर अनिश्चितता पादटिप्पणी में सुरक्षित है।
