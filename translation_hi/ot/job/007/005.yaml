  register: आधुनिक मानक हिन्दी में संक्षिप्त, शारीरिक और गरिमापूर्ण शैली रखी गई है। मूल की विकर्षक किन्तु सजीव रोग-छवि को नरम नहीं किया गया। अन्तिम दो कठिन क्रियाओं की वास्तविक अस्पष्टता मुख्य पाठ और पादटिप्पणी के संयोजन से सुरक्षित रखी गई है।
