translation:
  language: hi
  text: तब तू मुझे सपनों से आतंकित करता है और दर्शनों से भयभीत करता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ
  choice: तब
  rationale: यह संयोजक पिछले पद की शिकायत से इस कथन को परिणाम अथवा क्रम के रूप में जोड़ता है; इसलिए केवल ‘और’ की अपेक्षा ‘तब’ प्रसंग में अधिक स्वाभाविक है।
- source_word: חִתַּתַּנִי
  choice: तू मुझे आतंकित करता
  rationale: पिएल रूप यहाँ अत्यन्त भय और मानसिक व्याकुलता व्यक्त करता है। ‘आतंकित करता’ तीव्रता को बनाए रखता है, पर इसे शारीरिक रूप से ‘चकनाचूर करना’ नहीं बनाता।
- source_word: בַחֲלֹמוֹת
  choice: सपनों से
  rationale: 'בְּ को यहाँ साधनवाचक समझना प्रसंगानुकूल है: सपने वह माध्यम हैं जिनसे अय्यूब आतंकित होता है।'
- source_word: וּמֵחֶזְיֹנוֹת
  choice: और दर्शनों से
  rationale: מִן स्रोत अथवा साधन सूचित कर सकता है। काव्यात्मक समानांतरता में ‘दर्शनों से’ सहज हिन्दी है और इब्रानी ‘से’ की औपचारिक छाया भी बचाए रखता है।
- source_word: תְּבַעֲתַנִּי
  choice: भयभीत करता है
  rationale: पिएल क्रिया अचानक और गहरे भय का बोध कराती है। ‘भयभीत करता’ पहले खंड के ‘आतंकित करता’ के साथ स्वाभाविक समानांतर बनाता है और अनावश्यक शब्द-पुनरावृत्ति से बचता है।
