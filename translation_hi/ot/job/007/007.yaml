  yaml_path: translation/ot/job/007/007.yaml
  text: Remember that my life is a breath[b][a]; my eye will not return to see good.
translation:
  language: hi
  text: याद रख कि मेरा जीवन साँस भर है[a]; मेरी आँख फिर भलाई नहीं देखेगी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरा जीवन हवा है।” इब्रानी शब्द का अर्थ “साँस,” “हवा” या “आत्मा” हो सकता है; यहाँ वह जीवन की क्षणभंगुरता व्यक्त करता है।
    reason: lexical_alternative
  - marker: b
    text: या, “मेरी आँख फिर कभी सुख नहीं देखेगी,” अर्थात मैं फिर कुशलता या समृद्धि का अनुभव नहीं करूँगा।
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר
  choice: याद रख
  rationale: यह זכר का पुल्लिंग एकवचन आज्ञार्थक रूप है और प्रसंग में परमेश्वर को संबोधित है। ‘याद रख’ सीधी विनती और आज्ञार्थक बल दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: כִּי
  choice: कि
  rationale: यह याद रखने योग्य बात की विषय-वस्तु प्रस्तुत करता है; हिन्दी में ‘कि’ इस संबंध को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: רוּחַ
  choice: साँस भर
  rationale: רוּחַ का अर्थ ‘साँस’, ‘हवा’ या ‘आत्मा’ हो सकता है। इस विलाप में क्षणभंगुरता मुख्य है; ‘साँस भर’ उस रूपक को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि पाठ में पाई जाने वाली अर्थ-व्याप्ति को पादटिप्पणी में रखा गया है।
- source_word: חַיָּי
  choice: मेरा जीवन
  rationale: प्रथम पुरुष एकवचन प्रत्यय सहित यह पद स्वाभाविक हिन्दी में ‘मेरा जीवन’ है।
- source_word: לֹא תָשׁוּב
  choice: फिर ... नहीं देखेगी
  rationale: शाब्दिक अर्थ ‘लौटकर नहीं देखेगी’ है, पर आँख के साथ हिन्दी में ‘फिर नहीं देखेगी’ अधिक स्वाभाविक है और पुनः अनुभव न होने का आशय बनाए रखता है।
- source_word: עֵינִי
  choice: मेरी आँख
  rationale: इब्रानी में संज्ञा एकवचन है। ‘मेरी आँख’ स्रोत की काव्यात्मक एकवचन अभिव्यक्ति को सुरक्षित रखता है।
- source_word: לִרְאוֹת
  choice: देखेगी
  rationale: ראה का मूल अर्थ ‘देखना’ है। इसे हिन्दी वाक्य-रचना में मुख्य क्रिया के साथ समाहित किया गया है।
- source_word: טוֹב
  choice: भलाई
  rationale: טוֹב सामान्य अच्छाई, कुशलता या समृद्धि को सूचित कर सकता है। ‘भलाई’ इसकी व्यापकता को बनाए रखता है और अर्थ को केवल आर्थिक समृद्धि तक सीमित नहीं करता।
