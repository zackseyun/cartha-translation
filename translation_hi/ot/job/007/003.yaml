base_translation:
  language: en
  yaml_path: translation/ot/job/007/003.yaml
  text: So I have been allotted months of emptiness[b][a], and nights of misery have been assigned to me.
translation:
  language: hi
  text: इस प्रकार मेरे भाग में व्यर्थता के महीने आए हैं[a], और पीड़ा की रातें[b] मेरे लिए नियत की गई हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘निष्फलता के महीने,’ ‘शून्यता के महीने,’ अथवा ‘निरर्थकता के महीने।’
    reason: lexical_alternative
  - marker: b
    text: या ‘परिश्रम की रातें,’ ‘दुःख की रातें,’ ‘कष्ट की रातें,’ अथवा ‘विपत्ति की रातें।’
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: इसी प्रकार
  rationale: यह पिछले पद की उपमा को अय्यूब की अपनी दशा पर लागू करता है; ‘इसी प्रकार’ संबंध को स्वाभाविक और स्पष्ट रखता है।
- source_word: הָנְחַ֣לְתִּי
  choice: मुझे ... मिले हैं
  rationale: होफ़अल रूप अय्यूब को निष्क्रिय प्राप्तकर्ता दिखाता है। यह हिंदी में किसी अप्रिय भाग के उसे बाँटे जाने का भाव सहज रूप से व्यक्त करता है।
- source_word: יַרְחֵי שָׁוְא
  choice: निरर्थकता के महीने
  rationale: שָׁוְא यहाँ खोखलेपन, व्यर्थता या निष्फलता का बोध देता है; ‘निरर्थकता’ आधुनिक हिंदी में इस व्यापक अर्थ को बनाए रखती है।
- source_word: וְלֵילוֹת עָמָל
  choice: और दुःख की रातें
  rationale: עָמָל परिश्रम, कष्ट, विपत्ति या दुःख का अर्थ दे सकता है। अय्यूब की पीड़ादायक रातों के संदर्भ में ‘दुःख’ स्वाभाविक है, जबकि विकल्प पादटिप्पणी में सुरक्षित हैं।
- source_word: מִנּוּ לִי
  choice: मेरे लिए ठहराई गई हैं
  rationale: निष्क्रिय बहुवचन क्रिया रातों के नियुक्त या बाँटे जाने को व्यक्त करती है। ‘ठहराई गई हैं’ किसी निर्धारित भाग का भाव रखता है, बिना कर्ता को पाठ से अधिक स्पष्ट किए।
theological_decisions:
- issue: दुःख का अनिर्दिष्ट कर्ता
  choice: 'निष्क्रिय वाक्यरचना बनाए रखी गई: ‘मिले हैं’ और ‘ठहराई गई हैं’'
  alternative: परमेश्वर ने मुझे दिए/ठहराए हैं
  rationale: इब्रानी पाठ इस पद में कर्ता का नाम नहीं लेता; इसलिए परमेश्वर को स्पष्ट कर्ता बनाना पाठ की वास्तविक अस्पष्टता को अनावश्यक रूप से समाप्त कर देता।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी की है और विलाप की गरिमा बनाए रखती है। समानांतर वाक्यरचना तथा दोनों निष्क्रिय क्रियाओं को सुरक्षित रखा गया है। पादटिप्पणी-चिह्न संबंधित पदबंधों के तुरंत बाद रखे गए हैं।
