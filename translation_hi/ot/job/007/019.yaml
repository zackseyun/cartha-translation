base_translation:
  language: en
  yaml_path: translation/ot/job/007/019.yaml
  text: How long will you not look away from me[a], nor leave me alone until I swallow my spit?
translation:
  language: hi
  text: कब तक तू मुझसे अपनी दृष्टि नहीं हटाएगा[a], और जब तक मैं अपना थूक निगल न लूँ, मुझे अकेला नहीं छोड़ेगा?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तू मुझसे अपनी निगाह नहीं फेरेगा।” “अपना थूक निगलने” की अभिव्यक्ति का अर्थ है—एक क्षण जितना भी समय।
    reason: शाब्दिक विकल्प और इब्रानी मुहावरे का अर्थ स्पष्ट करना।
lexical_decisions:
- source_word: כַּמָּה
  choice: कब तक
  rationale: विलाप के प्रसंग में यह समय-संबंधी शिकायत व्यक्त करता है; आधुनिक हिन्दी में ‘कब तक’ स्वाभाविक और सटीक है।
- source_word: תִשְׁעֶה מִמֶּנִּי
  choice: तू मुझ पर से अपनी दृष्टि नहीं हटाएगा
  rationale: क्रिया किसी की ओर लगी दृष्टि फेरने या हटाने का भाव देती है। ‘मुझ पर से अपनी दृष्टि हटाना’ अय्यूब की परमेश्वर की निरंतर निगरानी से क्षणिक राहत की विनती को स्पष्ट रखता है।
- source_word: תַרְפֵּנִי
  choice: मुझे ... अकेला नहीं छोड़ेगा
  rationale: हिफ़ील रूप यहाँ छोड़ देने, पकड़ ढीली करने या पीछे हटने का भाव देता है। ‘अकेला छोड़ना’ सहज आधुनिक हिन्दी है और पहले खंड के समानांतर बैठता है।
- source_word: עַד
  choice: इतना भी ... कि
  rationale: यह माँगी गई राहत की समय-सीमा बताता है। हिन्दी में ‘इतना भी ... कि’ अत्यल्प समय की शिकायत को स्वाभाविक ढंग से व्यक्त करता है, जबकि अर्थतः ‘जब तक’ का संबंध बनाए रखता है।
- source_word: בִּלְעִי רֻקִּי
  choice: मैं अपना थूक निगल सकूँ
  rationale: मूल की सजीव, देह-संबंधी अभिव्यक्ति को बनाए रखा गया है। यह मुहावरा अत्यंत थोड़े समय—बस एक क्षण—का संकेत देता है।
