source:
  edition: WLC
  text: כָּלָ֣ה עָ֭נָן וַ/יֵּלַ֑ךְ כֵּ֥ן יוֹרֵ֥ד שְׁ֝א֗וֹל לֹ֣א יַעֲלֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/009.yaml
  text: As a cloud fades away and vanishes[a], so the one who goes down to Sheol does not come up.
translation:
  language: hi
  text: 'जैसे बादल छँट जाता और गायब हो जाता है,

    वैसे ही शिओल[a] में उतरनेवाला ऊपर नहीं आता।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा “कब्र” या “मृतकों का लोक।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּלָה
  choice: छँट जाता
  rationale: क्रिया का मूल भाव समाप्त हो जाना है; बादल के संदर्भ में ‘छँट जाता’ स्वाभाविक रूप से उसके विलीन होने का चित्र प्रस्तुत करता है।
- source_word: עָנָן
  choice: बादल
  rationale: सामान्य संज्ञार्थ; उपमा बादल के छँट जाने के परिचित दृश्य पर आधारित है।
- source_word: וַיֵּלַךְ
  choice: और गायब हो जाता है
  rationale: शाब्दिक अर्थ ‘और चला जाता है’ है, पर बादल और כָּלָה के साथ यह उसके दृष्टि से ओझल हो जाने को व्यक्त करता है।
- source_word: כֵּן
  choice: वैसे ही
  rationale: यह बादल की उपमा को शिओल में उतरनेवाले व्यक्ति की दशा से जोड़ता है।
- source_word: יוֹרֵד
  choice: उतरनेवाला
  rationale: कृदन्त यहाँ सामान्य रूप से किसी व्यक्ति के लिए संज्ञा का काम करता है; ‘उतरनेवाला’ इस सामान्य और सतत भाव को संक्षेप में बनाए रखता है।
- source_word: שְׁאוֹל
  choice: शिओल
  rationale: हिब्रू शब्द का लिप्यंतरण उसकी अर्थगत व्यापकता बनाए रखता है और उसे केवल कब्र या किसी अधिक विकसित धर्मवैज्ञानिक धारणा तक सीमित नहीं करता।
- source_word: לֹא יַעֲלֶה
  choice: ऊपर नहीं आता
  rationale: यह सामान्य कथन के रूप में अपूर्ण क्रिया का भाव देता है और ‘उतरने’ के समानांतर ऊर्ध्व दिशा का चित्र बनाए रखता है।
theological_decisions:
- issue: שְׁאוֹל का अनुवाद
  choice: शिओल
  alternative: कब्र; मृतकों का लोक
  rationale: यह शब्द कब्र, अधोलोक या मृतकों के क्षेत्र से जुड़ी अवधारणा को व्यक्त कर सकता है। ‘शिओल’ रखने से पद की वास्तविक अर्थगत अनिश्चितता बनी रहती है और इसे पुनरुत्थान के विषय में पूर्ण धर्मसैद्धांतिक कथन नहीं बनाया जाता। संदर्भ में अय्यूब मृत्यु की अपरिवर्तनीयता को मानवीय अनुभव की दृष्टि से व्यक्त कर रहा है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। काव्यात्मक समानांतरता के लिए ‘जैसे... वैसे ही’ तथा ‘उतरनेवाला... ऊपर नहीं आता’ का दिशात्मक विरोध सुरक्षित रखा गया है।
