base_translation:
  language: en
  yaml_path: translation/ot/job/007/020.yaml
  text: If I have sinned[a], what can I do to you, watcher of mankind? Why have you made me your target[c][b], so that I have become a burden to myself?
translation:
  language: hi
  text: यदि मैंने पाप किया है, तो हे मानवजाति पर निगाह रखनेवाले, मैं तेरा क्या कर सकता हूँ? तूने मुझे अपना निशाना क्यों बनाया है, कि मैं अपने ही लिए बोझ बन गया हूँ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ प्राचीन अनुवादों में ‘मैं तेरे लिए बोझ बन गया हूँ’ मिलता है; इब्रानी मसोरेटिक पाठ में ‘अपने ही लिए’ है।
    reason: alternative_reading
lexical_decisions:
- source_word: חָטָאתִי
  choice: यदि मैंने पाप किया है
  rationale: यह रूप व्याकरणतः पूर्णकाल प्रथम पुरुष एकवचन है, पर प्रसंग में अय्यूब की बात तर्कपूर्ण और रियायती है; ‘यदि’ उसके कथन को सीधी दोष-स्वीकृति बनाने के बजाय वही भाव बनाए रखता है।
- source_word: מָה אֶפְעַל לָךְ
  choice: मैं तेरा क्या बिगाड़ सकता हूँ?
  rationale: शाब्दिक अर्थ ‘मैं तेरे प्रति क्या कर सकता हूँ?’ है। शिकायत के प्रसंग में स्वाभाविक हिन्दी ‘तेरा क्या बिगाड़ सकता हूँ’ परमेश्वर को हानि पहुँचाने में मनुष्य की असमर्थता का अलंकारिक भाव व्यक्त करती है।
- source_word: נֹצֵר הָאָדָם
  choice: हे मानवजाति पर दृष्टि रखनेवाले
  rationale: נֹצֵר में रक्षा करने और निगरानी रखने—दोनों की अर्थछाया हो सकती है। ‘दृष्टि रखनेवाले’ इस प्रसंग में उस तनाव को बनाए रखता है; האדם यहाँ समष्टिगत मानवजाति है।
- source_word: לָמָה שַׂמְתַּנִי לְמִפְגָּע לָךְ
  choice: तूने मुझे अपना निशाना क्यों बनाया है
  rationale: מִפְגָּע किसी प्रहार के लक्ष्य अथवा आक्रमण की वस्तु को सूचित करता है। ‘अपना निशाना’ संक्षिप्त, स्वाभाविक और प्रसंगानुकूल है।
- source_word: וָאֶהְיֶה עָלַי לְמַשָּׂא
  choice: कि मैं अपने ही लिए बोझ बन गया हूँ
  rationale: मसोरेटिक पाठ עָלַי का स्वाभाविक अर्थ ‘अपने लिए/अपने ऊपर’ है। इसलिए कठिन लेकिन पाठ-सम्मत अर्थ मुख्य पाठ में रखा गया है।
theological_decisions:
- issue: חָטָאתִי को स्वीकारोक्ति या रियायती कथन मानना
  choice: यदि मैंने पाप किया है
  alternative: मैंने पाप किया है
  rationale: प्रसंग में अय्यूब प्रश्न के रूप में अपना पक्ष रख रहा है। ‘यदि’ इस तर्कात्मक तनाव को सुरक्षित रखता है, बिना यह तय किए कि वह यहाँ स्पष्ट दोष-स्वीकार कर रहा है।
- issue: נֹצֵר में रक्षक और निगरानीकर्ता की अर्थछाया
  choice: दृष्टि रखनेवाले
  alternative: रखवाले
  rationale: अय्यूब की शिकायत में परमेश्वर की सतत दृष्टि संरक्षण भी सूचित कर सकती है और कठोर निगरानी भी। चुना हुआ पद दोनों संभावनाओं को खुला रखता है।
- issue: עָלַי बनाम प्राचीन पाठ-परंपराओं का ‘तेरे लिए’
  choice: अपने ही लिए बोझ
  alternative: तेरे लिए बोझ
  rationale: मुख्य पाठ WLC के मसोरेटिक עָלַי का अनुसरण करता है; कुछ प्राचीन संस्करणों का भिन्न पाठ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। परमेश्वर के लिए निकट संबोधन ‘तू/तेरा’ काव्यात्मक प्रार्थना और शिकायत के स्वर के अनुरूप है। ‘मानवजाति’ האדם के समष्टिगत अर्थ को स्पष्ट करता है।
