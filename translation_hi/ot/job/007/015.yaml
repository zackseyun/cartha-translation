translation:
  language: hi
  text: इसलिए मेरा प्राण गला घोंटे जाने को चुनता है, और मेरी हड्डियों की अपेक्षा मृत्यु को।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दम घुटना” अथवा “मेरा जीवन घुटन को चुनता है।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “मेरी हड्डियों से मृत्यु।” भाव यह है कि वह अपनी पीड़ित शारीरिक दशा में बने रहने की अपेक्षा मृत्यु को चुनता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּבְחַר
  choice: चुनता है
  rationale: בחר का मूल अर्थ ‘चुनना’ है। काव्य-प्रवाह में रूप को वर्तमान-जैसे कथन के रूप में रखा गया है; ‘चुनना चाहेगा’ भी प्रसंगगत संभावना है।
- source_word: מַחֲנָק
  choice: गला घोंटा जाना
  rationale: यह संज्ञा गला घोंटने/दम घुटने से मृत्यु की ठोस और कठोर छवि व्यक्त करती है। हिंदी में कर्मवाच्य पदबंध संदर्भ के अनुकूल और स्वाभाविक है।
- source_word: נַפְשִׁי
  choice: मेरा प्राण
  rationale: נפש यहाँ व्यक्ति, जीवन या भीतरी प्राण को सूचित कर सकता है। ‘मेरा प्राण’ हिब्रू अभिव्यक्ति को बनाए रखते हुए आधुनिक हिंदी में ‘मेरी आत्मा’ की संभावित दार्शनिक संकीर्णता से बचता है।
- source_word: מָוֶת
  choice: मृत्यु
  rationale: מוות का सीधा और मानक हिंदी प्रतिरूप।
- source_word: מֵעַצְמוֹתָי
  choice: मेरी हड्डियों से बढ़कर
  rationale: 'शाब्दिक रूप ‘मेरी हड्डियों से’ है। מן को यहाँ तुलना के अर्थ में समझा गया है: अय्यूब अपनी पीड़ित शारीरिक दशा में बने रहने की अपेक्षा मृत्यु चुनता है। ‘हड्डियाँ’ की काव्यात्मक ठोस छवि सुरक्षित रखी गई है।'
theological_decisions:
- issue: נפש का मानवीय/धार्मिक अर्थक्षेत्र
  choice: मेरा प्राण
  alternative: मेरी आत्मा / मेरा जीवन / मैं
  rationale: पद किसी पृथक अमर तत्त्व के विषय में स्पष्ट दार्शनिक कथन नहीं करता। ‘प्राण’ व्यक्ति और जीवन दोनों की अर्थच्छाया बनाए रखता है।
- issue: מֵעַצְמוֹתָי में तुलना और शारीरिक पीड़ा
  choice: मेरी हड्डियों से बढ़कर
  alternative: मेरी हड्डियों से मृत्यु / मेरे शरीर से बढ़कर मृत्यु
  rationale: तुलनात्मक अर्थ प्रसंग में प्रबल है, फिर भी ‘हड्डियों’ को ‘शरीर’ में समतल नहीं किया गया, ताकि कठिन काव्यात्मक अभिव्यक्ति और उसकी तनावपूर्ण छवि बनी रहे।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण काव्यात्मक गद्य। ‘प्राण’ सामान्य पाठक के लिए स्वाभाविक है और נפש की व्यापकता बनाए रखता है। मूल की असामान्य ‘हड्डियों’ वाली अभिव्यक्ति मुख्य पाठ में सुरक्षित है; उसकी व्याख्या पादटिप्पणी में दी गई है।
