source:
  edition: WLC
  text: וּ/מֶ֤ה לֹא תִשָּׂ֣א פִשְׁעִ/י֮ וְ/תַעֲבִ֪יר אֶת עֲוֺ֫נִ֥/י כִּֽי עַ֭תָּה לֶ/עָפָ֣ר אֶשְׁכָּ֑ב וְ/שִׁ֖חֲרְתַּ֣/נִי וְ/אֵינֶֽ/נִּי׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/007/021.yaml
  text: Why do you not pardon my transgression and take away my iniquity? For now I will lie down in the dust[a]; you will seek me diligently[b], but I will be gone.
translation:
  language: hi
  text: तू मेरा अपराध क्यों क्षमा नहीं करता और मेरा अधर्म क्यों दूर नहीं कर देता?[a] क्योंकि अब मैं धूल में लेट जाऊँगा; तू मुझे बड़े यत्न से ढूँढ़ेगा,[b] पर मैं नहीं रहूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे अपराध को उठा/ले जाना और मेरे अधर्म को हटा देना।” हिब्रू क्रियाओं का मूल अर्थ ‘उठाना/ले जाना’ और ‘पार होने देना’ है; यहाँ वे क्षमा करने और दोष दूर करने के मुहावरे हैं।
    reason: lexical_alternative
  - marker: b
    text: या, “तू मुझे भोर ही से ढूँढ़ेगा।” हिब्रू क्रिया में प्रातःकाल का भाव हो सकता है, पर यहाँ संभवतः तत्परता या बड़े यत्न से खोजने का अर्थ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשָּׂא
  choice: क्षमा नहीं करता
  rationale: נשׂא का मूल अर्थ ‘उठाना/ले जाना’ है, पर अपराध को कर्म के रूप में लेने पर यह क्षमा करने का मुहावरा है। ‘क्षमा करना’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: פִשְׁעִי
  choice: मेरा अपराध
  rationale: פשע जान-बूझकर किए गए उल्लंघन या विद्रोह को सूचित कर सकता है। ‘अपराध’ सामान्य पाठक के लिए स्वाभाविक है और इसकी नैतिक गंभीरता बनाए रखता है।
- source_word: וְתַעֲבִיר
  choice: दूर नहीं कर देता
  rationale: עבר के हिफ़ील रूप का अर्थ यहाँ अधर्म या उससे जुड़ी दोषावस्था को हटा देना है। ‘दूर कर देना’ पहले क्रियापद से भेद रखते हुए अर्थ स्पष्ट करता है।
- source_word: עֲוֺנִי
  choice: मेरा अधर्म
  rationale: עון अधर्म, दोष या दंड को सूचित कर सकता है। פשע के समानांतर यहाँ ‘अधर्म’ नैतिक अर्थ और दोनों शब्दों का भेद सुरक्षित रखता है।
- source_word: כִּי עַתָּה
  choice: क्योंकि अब
  rationale: यह वाक्य अय्यूब की निकट आती मृत्यु को पिछले प्रश्न का कारण बनाकर प्रस्तुत करता है; हिन्दी में ‘क्योंकि अब’ उसके तात्कालिक भाव को बनाए रखता है।
- source_word: לֶעָפָר אֶשְׁכָּב
  choice: मैं धूल में लेट जाऊँगा
  rationale: ‘धूल’ मृत्यु और कब्र का ठोस काव्यात्मक बिंब है। इसे केवल ‘मर जाऊँगा’ कहने के बजाय मूल चित्र सुरक्षित रखा गया है।
- source_word: וְשִׁחֲרְתַּנִי
  choice: तू मुझे बड़े यत्न से ढूँढ़ेगा
  rationale: שׁחר के पिएल रूप में तड़के खोजने की मूल छाया हो सकती है, किंतु प्रसंग में उत्सुकता या तत्परता से खोजने का भाव अधिक संभावित है। ‘बड़े यत्न से’ यह भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְאֵינֶנִּי
  choice: पर मैं नहीं रहूँगा
  rationale: शाब्दिक रूप ‘और मैं नहीं’ है। भविष्याभिमुख प्रसंग में ‘पर मैं नहीं रहूँगा’ अनुपस्थिति या मृत्यु का संकेत देता है, बिना उसे अधिक स्पष्ट करके तनाव मिटाए।
theological_decisions:
- issue: पाप के लिए प्रयुक्त दो समानांतर शब्दों का भेद
  choice: פשע के लिए ‘अपराध’ और עון के लिए ‘अधर्म’
  alternative: दोनों के लिए ‘पाप’, अथवा ‘विद्रोह’ और ‘दोष’
  rationale: मूल में दो अलग, पर संबंधित नैतिक शब्द हैं। उनका भेद रखना काव्यात्मक समानांतरता और नैतिक शब्दावली की व्यापकता को सुरक्षित रखता है।
- issue: धूल में लेटने का मृत्यु-संबंधी बिंब
  choice: ठोस बिंब ‘धूल में लेट जाऊँगा’ बनाए रखना
  alternative: ‘मैं मर जाऊँगा’
  rationale: मूल पाठ मृत्यु को सीधे नाम देने के बजाय धूल और लेटने के बिंब से व्यक्त करता है। यही रूप साहित्यिक बल और नश्वरता के संकेत को सुरक्षित रखता है।
- issue: וְאֵינֶנִּי में अनुपस्थिति और मृत्यु का तनाव
  choice: ‘मैं नहीं रहूँगा’
  alternative: ‘मैं मर चुका होऊँगा’ या ‘मैं चला गया होऊँगा’
  rationale: हिब्रू कथन जानबूझकर संक्षिप्त है और अनुपस्थिति के द्वारा मृत्यु का संकेत देता है। चुना हुआ रूप इस अर्थ को स्पष्ट करता है, पर मृत्यु को उससे अधिक प्रत्यक्ष नहीं बनाता जितना मूल पाठ करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्वाभाविक, गंभीर और काव्यात्मक गद्य रखा गया है। परमेश्वर को संबोधित एकवचन ‘तू’ मूल के निकट और अय्यूब की सीधी प्रार्थनात्मक वाणी के अनुकूल है। ‘क्षमा करना/दूर कर देना’ स्पष्ट मुहावरे हैं, जबकि ‘धूल में लेटना’ और ‘नहीं रहूँगा’ मूल की काव्यात्मक संक्षिप्तता तथा मृत्यु-संबंधी तनाव बनाए रखते हैं।
