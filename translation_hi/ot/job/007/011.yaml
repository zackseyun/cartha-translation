id: JOB.7.11
reference: Job 7:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: גַּם אֲנִי֮ לֹ֤א אֶחֱשָׂ֫ךְ פִּ֥/י אֲֽ֭דַבְּרָה בְּ/צַ֣ר רוּחִ֑/י אָ֝שִׂ֗יחָה בְּ/מַ֣ר נַפְשִֽׁ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/011.yaml
  text: I also will not restrain my mouth[a]; I will speak in the distress of my spirit[c][b]; I will complain in the bitterness of my soul.
translation:
  language: hi
  text: मैं भी अपने मुँह को नहीं रोकूँगा[a]; मैं अपनी आत्मा की व्यथा में बोलूँगा[b]; मैं अपने प्राण की कड़वाहट में शिकायत करूँगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मैं अपने मुँह को थामे नहीं रखूँगा।’ इब्रानी मुहावरा शाब्दिक रूप से मुँह को न रोकने की बात करता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘अपनी आत्मा की पीड़ा में’ अथवा ‘अपनी आत्मा की घुटन में।’
    reason: lexical_alternative
  - marker: c
    text: या ‘मैं विलाप करूँगा’ अथवा ‘मैं अपनी बात कहूँगा।’ संदर्भ के अनुसार इब्रानी क्रिया चिंतन करने, बोलने, विलाप करने या शिकायत करने का भाव दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: भी
  rationale: यह मूल शब्द के योगसूचक अर्थ ‘भी’ को सुरक्षित रखता है और अनावश्यक कारणसूचक अर्थ नहीं जोड़ता।
- source_word: לֹא אֶחֱשָׂךְ פִּי
  choice: अपने मुँह को नहीं रोकूँगा
  rationale: यह ‘मुँह को न रोकने’ के इब्रानी रूपक को स्वाभाविक हिन्दी में बनाए रखता है और उसका आशय खुलकर बोलना है।
- source_word: אֲדַבְּרָה
  choice: बोलूँगा
  rationale: यह अय्यूब के निश्चय को व्यक्त करने वाले प्रथम पुरुष रूप का सीधा और स्वाभाविक अनुवाद है।
- source_word: בְּצַר רוּחִי
  choice: अपनी आत्मा की व्यथा में
  rationale: צַר की पीड़ा और संकट की भाव-छाया को ‘व्यथा’ व्यक्त करती है; רוּחַ को ‘आत्मा’ कहना मूल की आंतरिक मानवीय अनुभूति को बनाए रखता है।
- source_word: אָשִׂיחָה
  choice: शिकायत करूँगा
  rationale: संदर्भ में यह क्रिया चिंतनपूर्ण वाणी से लेकर विलाप अथवा शिकायत तक का अर्थ दे सकती है; अय्यूब की कड़वाहट के संदर्भ में ‘शिकायत करूँगा’ उपयुक्त है।
- source_word: בְּמַר נַפְשִׁי
  choice: अपने प्राण की कड़वाहट में
  rationale: ‘कड़वाहट’ מַר को सीधे व्यक्त करती है और ‘प्राण’ נֶפֶשׁ को רוּחַ से अलग रखते हुए काव्यात्मक समानांतरता बनाए रखता है।
theological_decisions:
- issue: इब्रानी काव्य में רוּחַ और נֶפֶשׁ जैसे मानव-संबंधी शब्द
  choice: रूअख़ को ‘आत्मा’ और नेफ़ेश को ‘प्राण’ के रूप में अलग-अलग रखा गया है।
  alternative: दोनों को ‘मन’, ‘अंतरात्मा’ या ‘भीतरी अस्तित्व’ जैसे एक ही व्यापक पद में मिला देना।
  rationale: मूल पद में दो अलग शब्द काव्यात्मक समानांतरता में आए हैं। उन्हें अलग रखना पाठ की बनावट को सुरक्षित करता है, पर मनुष्य की संरचना के विषय में कोई तकनीकी धर्मसिद्धांत आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘मुँह को रोकना’ मूल रूपक को बचाता है, जबकि ‘आत्मा’ और ‘प्राण’ काव्य में प्रयुक्त दो अलग इब्रानी शब्दों का भेद बनाए रखते हैं।
