base_translation:
  language: en
  yaml_path: translation/ot/job/007/006.yaml
  text: My days are swifter than a weaver’s shuttle[b][a]; they come to an end without hope.
translation:
  language: hi
  text: मेरे दिन बुनकर की ढरकी से भी अधिक तेज़ी से बीतते हैं[a]; वे बिना किसी आशा के समाप्त हो जाते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ढरकी’ करघे पर बुनाई के समय तेजी से इधर-उधर चलने वाला उपकरण है। मूल इब्रानी शब्द का अर्थ अधिक सामान्य रूप से ‘बुनकर का उपकरण’ या ‘करघा’ भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמַי
  choice: मेरे दिन
  rationale: प्रथम पुरुष एकवचन प्रत्यय सहित बहुवचन संज्ञा का सीधा अर्थ ‘मेरे दिन’ है; इससे अय्यूब के जीवन की दिन-प्रतिदिन घटती अवधि का ठोस चित्र बना रहता है।
- source_word: קַלּוּ
  choice: अधिक तेज़ी से बीतते हैं
  rationale: קלל यहाँ हल्का अथवा तेज़ होने के अर्थ में है। हिन्दी में दिनों के विषय में ‘अधिक तेज़ी से बीतते हैं’ स्वाभाविक है और מִן की तुलनात्मक शक्ति को बनाए रखता है।
- source_word: מִנִּי אָרֶג
  choice: बुनकर की ढरकी से
  rationale: אָרֶג बुनाई से जुड़े उपकरण को सूचित करता है। ‘बुनकर की ढरकी’ करघे पर तेजी से इधर-उधर चलने वाले उपकरण का चित्र व्यक्त करती है, यद्यपि मूल शब्द को अधिक सामान्य रूप से भी समझा जा सकता है।
- source_word: וַיִּכְלוּ
  choice: वे ... समाप्त हो जाते हैं
  rationale: כלה का अर्थ पूरा होना अथवा अंत तक पहुँचना है। यह अनुवाद अय्यूब के दिनों के समाप्त होने को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּאֶפֶס תִּקְוָה
  choice: बिना किसी आशा के
  rationale: אֶפֶס अभाव या न होने को और תִּקְוָה आशा को व्यक्त करता है। ‘बिना किसी आशा के’ मूल की पूर्ण निराशा को संक्षेप और स्वाभाविक ढंग से रखता है।
