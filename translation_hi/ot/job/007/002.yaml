  yaml_path: translation/ot/job/007/002.yaml
  text: Like a servant who longs for shade[a], and like a hired worker who waits for his wages[c][b],
translation:
  language: hi
  text: 'जैसे दास छाँह के लिए तरसता है,

    और जैसे मज़दूर अपनी मज़दूरी की बाट जोहता है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּעֶבֶד
  choice: जैसे दास
  rationale: עֶבֶד का अर्थ दास या सेवक हो सकता है; कठिन श्रम और असहाय सामाजिक स्थिति की इस उपमा में ‘दास’ मूल की तीव्रता को बेहतर बनाए रखता है।
- source_word: יִשְׁאַף
  choice: तरसता है
  rationale: שׁאף तीव्र अभिलाषा, यहाँ तक कि हाँफते हुए चाहने का भाव दे सकता है; ‘तरसता है’ आधुनिक हिन्दी में इस प्रबल लालसा को स्वाभाविक रूप से व्यक्त करता है।
- source_word: צֵל
  choice: छाँह
  rationale: श्रम की गर्मी से राहत के संदर्भ में צֵל का आशय केवल परछाईं नहीं, धूप से बचाने वाली छाँह है।
- source_word: וּכְשָׂכִיר
  choice: और जैसे मज़दूर
  rationale: שָׂכִיר मजदूरी पर रखा गया कामगार है; ‘मज़दूर’ हिन्दी में इस आर्थिक और श्रम-संबंधी अर्थ को सहजता से व्यक्त करता है।
- source_word: יְקַוֶּה
  choice: बाट जोहता है
  rationale: קוה में आशापूर्वक प्रतीक्षा करने का भाव है; देय मजदूरी की प्रतीक्षा के संदर्भ में ‘बाट जोहता है’ अपेक्षा और प्रतीक्षा दोनों को व्यक्त करता है।
- source_word: פָעֳלוֹ
  choice: अपनी मज़दूरी
  rationale: פעל मूलतः काम या उसके फल को सूचित कर सकता है, पर שָׂכִיר के साथ यहाँ श्रम के बदले मिलने वाला पारिश्रमिक अभिप्रेत है। हिन्दी में स्वाभाविक स्वामित्व-संबंध के लिए ‘अपनी’ प्रयुक्त हुआ है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, काव्यात्मक और dignified है। ‘छाँह’ तथा ‘बाट जोहता है’ पद्यात्मक प्रवाह बनाए रखते हुए सामान्य हिन्दी पाठक के लिए स्पष्ट हैं। दोनों उपमाओं का समानांतर विन्यास सुरक्षित रखा गया है।
