  text: He does not return again to his house[a], and his place does not know him anymore.
translation:
  language: hi
  text: 'वह फिर अपने घर नहीं लौटेगा,

    और उसका स्थान उसे फिर नहीं पहचानेगा।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָשׁוּב
  choice: लौटेगा
  rationale: שׁוב का सामान्य अर्थ ‘लौटना’ है; यहाँ अपूर्ण रूप प्रसंगानुसार भविष्यगत निषेध व्यक्त करता है।
- source_word: עוֹד (पहला प्रयोग)
  choice: फिर
  rationale: निषेध के साथ यह दोबारा न लौटने का भाव देता है; हिंदी में ‘फिर ... नहीं लौटेगा’ स्वाभाविक और संक्षिप्त है।
- source_word: לְבֵיתוֹ
  choice: अपने घर
  rationale: בַּיִת का ठोस अर्थ ‘घर’ है। कर्ता के अपने घर का संबंध हिंदी में ‘अपने’ से स्वाभाविक रूप से व्यक्त होता है।
- source_word: יַכִּירֶנּוּ
  choice: उसे नहीं पहचानेगा
  rationale: נכר के हिफ़ील रूप का यहाँ उपयुक्त अर्थ ‘पहचानना’ है। यह स्थान के मानवीकरण को बनाए रखता है और ‘जानना’ की अपेक्षा स्रोत क्रिया का विशिष्ट भाव अधिक स्पष्ट करता है।
- source_word: עוֹד (दूसरा प्रयोग)
  choice: फिर ... नहीं
  rationale: दूसरे खंड में भी עוֹד स्थायी अनुपस्थिति—अब आगे कभी न पहचानने—का भाव देता है।
- source_word: מְקֹמוֹ
  choice: उसका स्थान
  rationale: מָקוֹם का सीधा अर्थ ‘स्थान’ है। इसे व्यापक रखकर घर, परिचित ठिकाने या जीवन में उससे जुड़े स्थान के बीच स्रोत की संभावित व्यापकता सुरक्षित रहती है।
theological_decisions:
- issue: मृत्यु के बाद लौटने के विषय में कथन का दायरा
  choice: अय्यूब के विलाप में सांसारिक घर और परिचित स्थान पर न लौटने के रूप में कथन को जस का तस रखा गया है।
  alternative: इसे अंतिम पुनरुत्थान के पूर्ण निषेध या उसके समर्थन के स्पष्ट धर्मसैद्धांतिक कथन के रूप में विस्तार देना।
  rationale: पद का काव्यात्मक संदर्भ मृत्यु के बाद वर्तमान सांसारिक जीवन से अनुपस्थिति पर केंद्रित है; अनुवाद को इससे आगे कोई सांप्रदायिक निष्कर्ष नहीं जोड़ना चाहिए।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण और काव्यात्मक दो-पंक्तीय विन्यास। ‘उसका स्थान ... पहचानेगा’ में मूल का मानवीकरण जानबूझकर सुरक्षित रखा गया है। कोई पादटिप्पणी आवश्यक नहीं, क्योंकि ‘पहचानेगा’ स्रोत के प्रमुख अर्थ को सीधे व्यक्त करता है।
