  text: מָֽה אֱ֭נוֹשׁ כִּ֣י תְגַדְּלֶ֑/נּוּ וְ/כִי תָשִׁ֖ית אֵלָ֣י/ו לִבֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/017.yaml
  text: What is man[a], that you make so much of him[b], and that you set your heart on him?
translation:
  language: hi
  text: मनुष्य[a] क्या है कि तू उसे इतना महत्त्व दे[b], और उस पर अपना मन लगाए?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द एकवचन में नश्वर मानवता को सूचित करता है; भजन 8:4 से तुलना करें।
    reason: lexical_clarification_cross_reference
  - marker: b
    text: या “उसे बड़ा बनाए” अथवा “उसे महान ठहराए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה
  choice: क्या है
  rationale: यह आलंकारिक प्रश्न का सीधा और स्वाभाविक हिन्दी आरम्भ है।
- source_word: אֱנוֹשׁ
  choice: मनुष्य
  rationale: यह एकवचन में समूची नश्वर मानवता का प्रतिनिधित्व करता है; ‘मनुष्य’ उस प्रतिनिधिक एकवचन को बनाए रखता है।
- source_word: כִּי
  choice: कि
  rationale: यह आलंकारिक प्रश्न के बाद आने वाले आशय-वाक्य को जोड़ता है।
- source_word: תְגַדְּלֶנּוּ
  choice: तू उसे इतना महत्त्व दे
  rationale: גדל के पिएल रूप का मूल भाव ‘बड़ा करना’ है; प्रसंग में यह किसी को अत्यधिक महत्त्व देने या उसका विशेष ध्यान रखने का मुहावरेदार अर्थ देता है। यह अय्यूब के व्याकुल स्वर में निहित तनाव को भी बनाए रखता है।
- source_word: וְכִי
  choice: और
  rationale: दूसरे समानांतर उपवाक्य को पहले से स्वाभाविक रूप से जोड़ता है; हिन्दी में ‘कि’ की पुनरावृत्ति आवश्यक नहीं है।
- source_word: תָשִׁית
  choice: लगाए
  rationale: मूल क्रिया का अर्थ ‘रखना/लगाना’ है और ‘मन लगाना’ हिन्दी में इस पदबंध का स्वाभाविक रूप है।
- source_word: אֵלָיו
  choice: उस पर
  rationale: यह परमेश्वर के मन या ध्यान की दिशा और विषय को व्यक्त करता है।
- source_word: לִבֶּךָ
  choice: अपना मन
  rationale: इब्रानी ‘हृदय’ विचार, इच्छा और ध्यान का केंद्र भी है। हिन्दी का ‘मन लगाना’ अर्थ और काव्यात्मक मानवीकरण दोनों को स्वाभाविक रूप से संप्रेषित करता है।
theological_decisions:
- issue: אֱנוֹשׁ का प्रतिनिधिक एकवचन और नश्वरता का भाव
  choice: मनुष्य
  alternative: नश्वर मनुष्य / मानवजाति
  rationale: ‘मनुष्य’ एकवचन आलंकारिक रूप तथा भजन 8:4 से साहित्यिक साम्य को बनाए रखता है; नश्वरता की अर्थछाया पादटिप्पणी में स्पष्ट की गई है, जबकि ‘मानवजाति’ एकवचन चित्र को समतल कर देता।
- issue: परमेश्वर के ध्यान के लिए मानवीय अंग-भाषा
  choice: उस पर अपना मन लगाए
  alternative: उस पर अपना हृदय लगाए / उस पर ध्यान दे
  rationale: ‘मन’ इब्रानी לֵב के वैचारिक और ध्यान-संबंधी आयाम को स्वाभाविक हिन्दी में रखता है। केवल ‘ध्यान दे’ कहने से मूल की काव्यात्मक मानवीकरण-भाषा घट जाती।
- issue: दिव्य ध्यान का सकारात्मक या व्याकुलकारी स्वर
  choice: इतना महत्त्व दे
  alternative: उसे महान बनाए / उसकी इतनी चिंता करे
  rationale: मूल क्रिया अपने आप यह तय नहीं करती कि यह ध्यान अय्यूब के लिए अनुकूल है या पीड़ादायक। चयन उस अर्थगत तनाव को खुला रखता है और प्रसंग के व्यथित स्वर को किसी एक धर्मवैचारिक निष्कर्ष में नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण है। परमेश्वर को संबोधित करते हुए एकवचन ‘तू’ बाइबलीय काव्य की निकटता और सीधे संबोधन को बनाए रखता है। समानांतर प्रश्न-विन्यास सुरक्षित है, पर हिन्दी की स्वाभाविकता के लिए दूसरे खंड में ‘कि’ दोहराया नहीं गया।
