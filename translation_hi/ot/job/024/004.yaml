lexical_decisions:
- source_word: יַטּוּ
  choice: हटा देते हैं
  rationale: נטה के हिफ़ील रूप का मूल भाव किसी को मुड़ने या हटने के लिए विवश करना है। प्रसंग में “हटा देते हैं” उत्पीड़न का कारणवाचक भाव स्वाभाविक हिंदी में व्यक्त करता है, बिना अनावश्यक बल जोड़ने के।
- source_word: אֶבְיוֹנִים
  choice: जरूरतमंदों
  rationale: אֶבְיוֹן आर्थिक और सामाजिक रूप से असहाय व्यक्ति को सूचित करता है। “जरूरतमंद” बाद के עָנִי से हल्का शब्दगत भेद बनाए रखता है।
- source_word: מִדָּרֶךְ
  choice: रास्ते से
  rationale: דֶּרֶךְ का अर्थ रास्ता, मार्ग या चाल-चलन हो सकता है। यहाँ מן और कारणवाचक क्रिया के साथ “रास्ते से” सार्वजनिक मार्ग से हटाए जाने की ठोस छवि देता है।
- source_word: יַחַד
  choice: एक साथ
  rationale: यह क्रियाविशेषण सामूहिक अवस्था या क्रिया व्यक्त करता है; “एक साथ” इसका सीधा और स्वाभाविक हिंदी रूप है।
- source_word: חֻבְּאוּ
  choice: छिप जाते हैं
  rationale: חבא का पुअल रूप छिपे होने या छिपाए जाने की परिणामी अवस्था व्यक्त कर सकता है। “छिप जाते हैं” हिंदी में दबाव के कारण ओझल हो जाने का भाव देता है और कर्तृवाचक आत्म-प्रेरणा को जरूरत से अधिक स्पष्ट नहीं करता।
- source_word: עֲנִיֵּי אָרֶץ
  choice: देश के दीन लोग
  rationale: עָנִי गरीब, पीड़ित या दबाया हुआ व्यक्ति हो सकता है। “दीन लोग” सामाजिक असहायता और पीड़ा दोनों के लिए खुला रहता है; אָרֶץ को इस सामाजिक प्रसंग में “देश” कहना स्वाभाविक है।
