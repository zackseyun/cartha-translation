  text: הֵ֤ן פְּרָאִ֨ים בַּֽ/מִּדְבָּ֗ר יָצְא֣וּ בְּ֭/פָעֳלָ/ם מְשַׁחֲרֵ֣י לַ/טָּ֑רֶף עֲרָבָ֥ה ל֥/וֹ לֶ֝֗חֶם לַ/נְּעָרִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/005.yaml
  text: Look[a], like wild donkeys in the wilderness they go out to their work, seeking prey early; the desert is bread for him[b], for the children.
translation:
  language: hi
  text: देखो, वे निर्जन प्रदेश में जंगली गधों के समान अपने काम पर निकलते हैं; वे भोर से ही भोजन[a] की खोज में लग जाते हैं। उजाड़ मैदान उसके लिए रोटी है, बच्चों के लिए।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘शिकार’। यहाँ प्रयुक्त शब्द का अर्थ शिकार किया हुआ पशु, आहार या जीवन-निर्वाह की सामग्री हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'वैकल्पिक व्याख्या: ‘उजाड़ मैदान उसे और उसके बच्चों को भोजन देता है।’ हिब्रू में ‘उसके लिए’ एकवचन है, और अंतिम शब्द का अर्थ ‘बच्चे’, ‘लड़के’ या ‘युवा’ हो सकता है।'
    reason: ambiguity
lexical_decisions:
- source_word: הֵן
  choice: देखो
  rationale: दृश्य की ओर ध्यान खींचने वाले हिब्रू उद्गार को सहज और वर्तमान हिंदी में व्यक्त करता है।
- source_word: פְּרָאִים
  choice: जंगली गधों
  rationale: निर्जन प्रदेश में रहने वाले अदम्य गधों की उपमा को स्पष्ट और समकालीन भाषा में रखता है।
- source_word: בַּמִּדְבָּר
  choice: निर्जन प्रदेश में
  rationale: מִדְבָּר केवल रेतीला मरुस्थल नहीं, बल्कि बसा-बसाया न गया वन्य या उजाड़ इलाका भी हो सकता है; यह चुनाव उस व्यापक अर्थ को बचाता है।
- source_word: יָצְאוּ בְּפָעֳלָם
  choice: अपने काम पर निकलते हैं
  rationale: गतिशील काव्यात्मक चित्र और जीविका के लिए किए जाने वाले कठिन काम, दोनों को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: מְשַׁחֲרֵי
  choice: भोर से ही ... की खोज में लग जाते हैं
  rationale: कृदंत में निहित तड़के उठकर ढूँढ़ने या यत्नपूर्वक खोजने के भाव को सँजोता है।
- source_word: לַטָּרֶף
  choice: भोजन
  rationale: शब्द का मूल अर्थ ‘शिकार’ हो सकता है, पर यहाँ निर्धन मनुष्यों की जीविका के संदर्भ में जीवन-निर्वाह का भोजन अभिप्रेत हो सकता है; विकल्प पादटिप्पणी में रखा गया है।
- source_word: עֲרָבָה
  choice: उजाड़ मैदान
  rationale: अरावा, स्तेपी या शुष्क खुले भूभाग के अर्थ को सामान्य पाठक के लिए स्पष्ट करता है और पहले प्रयुक्त ‘निर्जन प्रदेश’ से शब्दगत भेद भी बनाए रखता है।
- source_word: לוֹ
  choice: उसके लिए
  rationale: हिब्रू के एकवचन को बहुवचन में समतल किए बिना सुरक्षित रखता है, चाहे वह समूह के प्रत्येक व्यक्ति के लिए वितरणात्मक एकवचन ही क्यों न हो।
- source_word: לֶחֶם
  choice: रोटी
  rationale: ठोस हिब्रू बिंब को बनाए रखता है; साथ ही हिंदी में ‘रोटी’ मूल जीविका का स्वाभाविक प्रतीक है।
- source_word: לַנְּעָרִים
  choice: बच्चों की
  rationale: निर्भर बालकों या छोटे परिवारजनों का अर्थ संदर्भ में सहज है, जबकि शब्द ‘लड़कों’ या ‘युवाओं’ को भी सूचित कर सकता है।
