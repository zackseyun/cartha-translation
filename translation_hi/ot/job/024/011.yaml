  yaml_path: translation/ot/job/024/011.yaml
  text: Between their rows they press out oil[a]; they tread winepresses[b], yet they go thirsty.
translation:
  language: hi
  text: उनकी कतारों के बीच वे तेल निकालते हैं[a]; वे दाखरस के कुंडों में अंगूर रौंदते हैं, फिर भी प्यासे रहते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में यहाँ प्रयुक्त दोनों शब्द कठिन हैं। ‘कतारों’ का अनुवाद ‘दीवारों’ या ‘घेरे हुए खेतों’ भी हो सकता है; और ‘तेल निकालते हैं’ वाली क्रिया संभवतः जैतून से तेल निकालने को दर्शाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּין
  choice: के बीच
  rationale: स्थानसूचक संबंध को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: שׁוּרֹתָם
  choice: उनकी कतारों
  rationale: शब्द का अर्थ कतारें या दीवारें हो सकता है; कृषि-संदर्भ में ‘कतारों’ से बाग की पंक्तियों या घिरे हुए कृषि-स्थलों का संकेत मिलता है, जबकि अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: יַצְהִירוּ
  choice: वे तेल निकालते हैं
  rationale: यह कठिन क्रिया यहाँ कृषि-श्रम के संदर्भ में जैतून से तेल निकालने की ओर संकेत करती है; हिंदी में यह अर्थ स्पष्ट और स्वाभाविक है।
- source_word: יְקָבִים
  choice: दाखरस के कुंडों में
  rationale: शब्द अंगूर दबाने या रस एकत्र करने के कुंडों को दर्शाता है; अगले क्रियापद ‘रौंदते हैं’ के साथ यह स्वाभाविक हिंदी प्रयोग है।
- source_word: דָּרְכוּ
  choice: अंगूर रौंदते हैं
  rationale: क्रिया का सामान्य कृषि-अर्थ दाखरस के कुंड में अंगूरों को पैरों से रौंदना है; ‘अंगूर’ संदर्भ से निहित है और हिंदी में आवश्यक स्पष्टता देता है।
- source_word: וַיִּצְמָאוּ
  choice: फिर भी प्यासे रहते हैं
  rationale: संयोजन उत्पादकों के स्वयं वंचित रहने की तीखी विडंबना व्यक्त करता है; ‘फिर भी’ इस विरोध को स्वाभाविक रूप से सामने लाता है।
