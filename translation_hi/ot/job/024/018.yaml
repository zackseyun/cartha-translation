  text: קַֽל ה֤וּא עַל פְּנֵי מַ֗יִם תְּקֻלַּ֣ל חֶלְקָתָ֣/ם בָּ/אָ֑רֶץ לֹֽא יִ֝פְנֶה דֶּ֣רֶךְ כְּרָמִֽים־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/018.yaml
  text: He is swift on the surface of the waters[a]; their portion in the land is cursed[c][b]; he does not turn toward the way of the vineyards.
translation:
  language: hi
  text: वह जल की सतह पर तेज़ है[a]; भूमि में उनका भाग शापित है[b]; वह दाख की बारियों के मार्ग की ओर नहीं मुड़ता[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह जल के मुख पर हल्का है।” इब्रानी पाठ कठिन है; कुछ व्याख्याकार आरम्भिक पदों को तेज़ गति के बजाय क्षणभंगुरता का वर्णन मानते हैं।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी पाठ कठिन है; “उनका भाग” के बजाय “उसका भाग” भी पढ़ा जा सकता है।
    reason: textual_variant
  - marker: c
    text: या, “वह दाख की बारियों के मार्ग की ओर नहीं मुड़ता।” इसका अर्थ यह हो सकता है कि वह अब खेती की भूमि या समृद्ध स्थानों की ओर नहीं लौटता।
    reason: lexical_alternative
lexical_decisions:
- source_word: קַל
  choice: तेज़
  rationale: इस विशेषण का मूल अर्थ ‘हलका’ है, पर जल पर गति के इस संदर्भ में ‘तेज़’ संभावित भाव को स्वाभाविक हिन्दी में व्यक्त करता है; पाठ की कठिनाई को पादटिप्पणी में बनाए रखा गया है।
- source_word: עַל־פְּנֵי מַיִם
  choice: जल की सतह पर
  rationale: यह इब्रानी मुहावरे ‘जल के मुख पर’ का स्वाभाविक हिन्दी रूप है और मूल बिंब को सुरक्षित रखता है।
- source_word: תְּקֻלַּל
  choice: शापित है
  rationale: पुअल रूप का निष्क्रिय अर्थ ‘शापित होना’ वाक्य-विन्यास में ‘भाग’ के साथ सबसे सीधा बैठता है।
- source_word: חֶלְקָתָם
  choice: उनका भाग
  rationale: प्रस्तुत व्यंजन-पाठ के बहुवचन प्रत्यय का अनुसरण किया गया है; एकवचन ‘उसका’ की सम्भावना पादटिप्पणी में दी गई है।
- source_word: בָּאָרֶץ
  choice: भूमि में
  rationale: ‘भाग’ के साथ यह भूमि-संपत्ति या भूभाग का स्वाभाविक संकेत देता है, जबकि ‘पृथ्वी’ भी शब्दार्थ की दृष्टि से सम्भव है।
- source_word: לֹא יִפְנֶה
  choice: की ओर नहीं मुड़ता
  rationale: यह פנה के सामान्य अर्थ ‘मुड़ना/की ओर फिरना’ को बनाए रखता है और ‘लौटना’ जैसी अधिक व्याख्यात्मक धारणा नहीं जोड़ता।
- source_word: דֶּרֶךְ כְּרָמִים
  choice: दाख की बारियों का मार्ग
  rationale: सम्बन्धवाचक इब्रानी पदबंध का निकट और बोधगम्य अनुवाद है; यह खेती-बाड़ी या समृद्ध स्थानों की ओर जाने वाले मार्ग का संकेत दे सकता है, पर उस अर्थ को मुख्य पाठ में निश्चित नहीं किया गया।
