translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और मूल की काव्यात्मक समानांतर रचना के निकट भाषा रखी गई है। कठिन इब्रानी वाक्य के पुरुष-वचन और आरम्भिक विशेषण की अस्पष्टता को मुख्य पाठ में कृत्रिम रूप से नहीं सुलझाया गया; वैकल्पिक अर्थ पादटिप्पणियों में दिए गए हैं।
