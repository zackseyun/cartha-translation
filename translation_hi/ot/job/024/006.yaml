  register: भाषा आधुनिक, गरिमापूर्ण और साधारण पाठकों के लिए स्पष्ट रखी गई है। कृषि-संबंधी दुर्लभ क्रिया को अर्थपूर्ण वाक्यांश से व्यक्त किया गया है, जबकि अस्पष्ट पुरुषवाचक प्रत्यय और दूसरी पंक्ति की वाक्यरचना को पादटिप्पणियों में सुरक्षित रखा गया है।
