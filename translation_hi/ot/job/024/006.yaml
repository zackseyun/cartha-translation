  text: בַּ֭/שָּׂדֶה בְּלִיל֣/וֹ יקצירו וְ/כֶ֖רֶם רָשָׁ֣ע יְלַקֵּֽשׁוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/006.yaml
  text: In the field they harvest fodder[c][b][a], and they glean in the vineyard of the wicked.
translation:
  language: hi
  text: खेत में वे उसका पशुचारा[a] काटते हैं, और दुष्ट[c] की दाखबारी में[b] बची हुई उपज बटोरते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “पशुचारा” का अर्थ मिला-जुला चारा भी हो सकता है। मूल इब्रानी में “उसका” है, पर यह किसके लिए कहा गया है, स्पष्ट नहीं है।
    reason: lexical_alternative
  - marker: b
    text: या “दुष्ट की दाखबारी की बची हुई उपज बटोरते हैं।” मूल इब्रानी में “में” दोहराया नहीं गया है।
    reason: lexical_alternative
  - marker: c
    text: “दुष्ट” से सामान्य रूप से कोई दुष्ट मालिक अभिप्रेत हो सकता है; या इसका अनुवाद “एक दुष्ट व्यक्ति” किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּשָּׂדֶה
  choice: खेत में
  rationale: בְּ का प्रयोग स्थानसूचक है। आधुनिक हिन्दी में “खेत में” स्वाभाविक और सटीक है।
- source_word: בְּלִילוֹ
  choice: उसका पशुचारा
  rationale: בְּלִיל सामान्य अनाज नहीं, बल्कि पशुओं के लिए मिलाया हुआ चारा है। 3ms प्रत्यय को “उसका” कहकर रखा गया है, यद्यपि उसका संदर्भ स्पष्ट नहीं है।
- source_word: יקצירו
  choice: वे ... काटते हैं
  rationale: קצר का अर्थ फसल काटना है। पशुचारे के संदर्भ में “काटते हैं” आधुनिक हिन्दी में “कटनी करते हैं” से अधिक स्वाभाविक है।
- source_word: וְכֶרֶם
  choice: और ... की दाखबारी में
  rationale: मूल पाठ में दूसरी पंक्ति में स्थानसूचक पूर्वसर्ग दोहराया नहीं गया है; हिन्दी की सहज अभिव्यक्ति के लिए “में” जोड़ा गया है।
- source_word: רָשָׁע
  choice: दुष्ट
  rationale: एकवचन विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है। “दुष्ट” उसके सामान्य अथवा किसी दुष्ट मालिक के अर्थ—दोनों की संभावना बनाए रखता है।
- source_word: יְלַקֵּשׁוּ
  choice: बची हुई उपज बटोरते हैं
  rationale: לקשׁ का पिएल रूप देर से मिलने वाली अथवा कटाई के बाद बची उपज इकट्ठी करने को दर्शाता है। यह वाक्यांश सामान्य पाठक के लिए “बीनते हैं” की अपेक्षा अर्थ को अधिक स्पष्ट करता है।
