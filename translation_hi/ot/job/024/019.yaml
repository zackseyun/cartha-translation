  yaml_path: translation/ot/job/024/019.yaml
  text: Drought and heat also snatch away the waters of snow[b][a]; so Sheol takes those who have sinned.
translation:
  language: hi
  text: सूखा और गर्मी बर्फ़ के पानी[a] को छीन लेते हैं; वैसे ही शीओल[b] पाप करनेवालों को छीन लेता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बर्फ़ का पिघला हुआ पानी।” इब्रानी में शाब्दिक रूप से “बर्फ़ के पानी” है।
    reason: lexical_alternative
  - marker: b
    text: “शीओल” मृतकों के लोक के लिए इब्रानी शब्द है; इसका अनुवाद “अधोलोक” या “कब्र” भी किया जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: צִיָּה
  choice: सूखा
  rationale: यह संज्ञा शुष्कता या सूखे की दशा को दर्शाती है; חֹם के साथ कर्ता के रूप में ‘सूखा’ स्वाभाविक और चित्रात्मक है।
- source_word: גַם
  choice: और
  rationale: यहाँ यह सूखे के साथ गरमी को भी जोड़ता है। हिन्दी में ‘सूखा और गरमी’ इस योगात्मक अर्थ को सहज रूप से व्यक्त करता है।
- source_word: חֹם
  choice: गरमी
  rationale: सूखे के समानांतर प्रयुक्त इस सामान्य संज्ञा का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: יִגְזְלוּ
  choice: छीन लेते हैं
  rationale: גזל में बलपूर्वक ले लेने या लूट लेने का भाव है। निर्जीव कर्ताओं के साथ ‘छीन लेते हैं’ काव्यात्मक सजीवता और क्रिया की तीव्रता बनाए रखता है।
- source_word: מֵימֵי שֶׁלֶג
  choice: बर्फ़ के पानी
  rationale: शाब्दिक काव्यात्मक अभिव्यक्ति ‘बर्फ़ के पानी’ को रखा गया है; इसका आशय बर्फ़ से निकले पिघले पानी से भी हो सकता है, जिसे पादटिप्पणी में बताया गया है।
- source_word: שְׁאוֹל
  choice: शीओल
  rationale: लिप्यंतरण मृतकों के लोक की इब्रानी धारणा को बनाए रखता है और इसे केवल ‘कब्र’ या बाद की किसी अधिक विशिष्ट धर्मवैज्ञानिक धारणा में सीमित नहीं करता।
- source_word: חָטָאוּ
  choice: जिन्होंने पाप किया है
  rationale: पूर्ण बहुवचन क्रिया का मौखिक भाव सुरक्षित रहता है। हिन्दी वाक्य में यह उन लोगों को स्पष्ट करता है जिन्हें शीओल छीन लेता है।
theological_decisions:
- issue: שְׁאוֹל का अर्थ
  choice: मृतकों के लोक के लिए ‘शीओल’ का लिप्यंतरण रखा गया है।
  alternative: ‘अधोलोक’ या ‘कब्र’
  rationale: पद की काव्यात्मक तुलना में मूल इब्रानी धारणा को खुला रखना उचित है। ‘शीओल’ इसे अंतिम दंड के स्थान जैसी अधिक विशिष्ट धारणा से नहीं जोड़ता; पादटिप्पणी सामान्य अर्थ और वैकल्पिक अनुवाद देती है।
- issue: दूसरे अर्धपद में लुप्त क्रिया
  choice: पहले अर्धपद की ‘छीन लेना’ क्रिया को तुलना में दोहराया गया है।
  alternative: क्रिया को लुप्त रखते हुए ‘वैसे ही शीओल—पाप करनेवालों को’ जैसा खंडित वाक्य
  rationale: इब्रानी काव्य में दूसरे अर्धपद की क्रिया पहले अर्धपद से समझी जाती है। हिन्दी में उसे दोहराने से अर्थ स्पष्ट और स्वाभाविक होता है, बिना कोई अलग क्रिया या अतिरिक्त धर्मवैज्ञानिक अर्थ जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और काव्यात्मक शैली रखी गई है। ‘छीन लेते हैं’ मूल रूपक की तीव्रता बनाए रखता है, और ‘वैसे ही’ दोनों अर्धपदों की निहित तुलना स्पष्ट करता है।
