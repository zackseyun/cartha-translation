  yaml_path: translation/ot/job/024/010.yaml
  text: They go about naked[a], without clothing; hungry, they carry sheaves.
translation:
  language: hi
  text: 'वे नंगे, बिना कपड़ों के, चलते-फिरते हैं;

    भूखे वे अनाज के पूले[a] ढोते हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “अनाज का एक पूला”; इब्रानी शब्द एकवचन है, पर यहाँ उसका प्रयोग सामूहिक अर्थ में हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרוֹם
  choice: नंगे
  rationale: यह शब्द वस्त्रहीन या बहुत कम कपड़े पहने होने को दर्शाता है। “नंगे” प्रसंग में अभाव और अपमान की दशा को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הִלְּכוּ
  choice: चलते-फिरते हैं
  rationale: הלך का मूल अर्थ चलना या जाना है। यहाँ क्रिया पीड़ित लोगों की लगातार बनी हुई दशा दिखाती है, इसलिए “चलते-फिरते हैं” स्वाभाविक है।
- source_word: בְּלִי לְבוּשׁ
  choice: बिना कपड़ों के
  rationale: यह पदबंध वस्त्रों के अभाव को स्पष्ट करता है। “बिना कपड़ों के” आधुनिक हिन्दी में सहज है और पहले शब्द “नंगे” के साथ मूल की बलपूर्ण पुनरुक्ति बनाए रखता है।
- source_word: רְעֵבִים
  choice: भूखे ही
  rationale: मूल विशेषण भूख की दशा बताता है। “ही” उस विडंबना पर स्वाभाविक बल देता है कि भोजन उपजाने वाले मजदूर स्वयं भूखे हैं, बिना अर्थ को “भूख से मरते हुए” तक तीव्र किए।
- source_word: נָשְׂאוּ
  choice: ढोते हैं
  rationale: נשא का अर्थ उठाना, ले जाना या ढोना हो सकता है। फसल के पूले ले जाने वाले श्रमिकों के संदर्भ में “ढोते हैं” श्रम और भार दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עֹמֶר
  choice: अनाज के पूले
  rationale: संज्ञा रूप की दृष्टि से एकवचन है, पर यहाँ अनेक मजदूरों द्वारा काटी हुई फसल उठाने के वर्णन में सामूहिक अर्थ संभव है। हिन्दी बहुवचन प्रसंग को सहज बनाता है; शाब्दिक एकवचन को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। पहली पंक्ति में “नंगे, बिना कपड़ों के” की पुनरुक्ति जानबूझकर रखी गई है, क्योंकि वह इब्रानी मूल के बल को दर्शाती है। दूसरी पंक्ति की संरचना भूखे मजदूरों और उनके द्वारा ढोई जा रही फसल के बीच की तीखी विडंबना बनाए रखती है।
