base_translation:
  language: en
  yaml_path: translation/ot/job/024/024.yaml
  text: They are exalted a little while[a], and then they are gone; they are brought low; like all others they are gathered up[c][b], and like the head of a stalk of grain they are cut off.
translation:
  language: hi
  text: वे थोड़ी देर के लिए ऊँचे उठाए जाते हैं, फिर वे नहीं रहते; वे नीचा किए जाते हैं और सबकी तरह समेट लिए जाते हैं[a]; वे अनाज की बाली के शीर्ष की तरह काट दिए जाते हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सबकी तरह हटा लिए जाते हैं।” यहाँ प्रयुक्त इब्रानी क्रिया दुर्लभ है और उसके अर्थ की सूक्ष्मता पर मतभेद है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “अनाज की बाली के सिर की तरह।”
    reason: cultural_note
lexical_decisions:
- source_word: רֹמּוּ
  choice: ऊँचे उठते हैं
  rationale: रום का रूप ऊँचा किए जाने या ऊँचे पद पर पहुँचने का भाव देता है; यह चयन दुष्टों की थोड़े समय की उन्नति और बाद के पतन के बीच विरोध बनाए रखता है।
- source_word: מְּעַט
  choice: थोड़ी देर के लिए
  rationale: शाब्दिक अर्थ ‘थोड़ा’ है, पर अगले वाक्यांश में उनके न रहने के कारण यहाँ समय की अल्पता प्रमुख है।
- source_word: וְאֵינֶנּוּ
  choice: फिर नहीं रहते
  rationale: इब्रानी मुहावरा अनुपस्थित हो जाने अथवा अस्तित्व में न रहने को व्यक्त करता है। एकवचन-सदृश प्रत्यय को आसपास के बहुवचन क्रियारूपों के अनुरूप वितरणात्मक बहुवचन में रखा गया है।
- source_word: וְהֻמְּכוּ
  choice: वे नीचे गिराए जाते हैं
  rationale: निष्क्रिय रूप पहले की ऊँचाई से नीचे लाए जाने का भाव देता है और ऊँचे उठने के साथ स्पष्ट प्रतिलोम बनाता है।
- source_word: כַּכֹּל
  choice: सबकी तरह
  rationale: तुलनात्मक כ और כל उन्हें सभी मनुष्यों की सामान्य नियति में सम्मिलित करते हैं; हिन्दी में यह संक्षिप्त और स्वाभाविक है।
- source_word: יִקָּפְצוּן
  choice: समेट लिए जाते हैं
  rationale: קפץ का यह रूप दुर्लभ और विवादित है। ‘समेट लिए जाते हैं’ संग्रह या हटा दिए जाने की छवि को बनाए रखता है, बिना उसके ढंग को अनावश्यक रूप से निश्चित किए।
- source_word: וּכְרֹאשׁ שִׁבֹּלֶת
  choice: अनाज की बाल के सिरे की तरह
  rationale: רֹאשׁ शीर्ष या सिर और שִׁבֹּלֶת अनाज की बाल को सूचित करता है; यह अनुवाद कृषि-चित्र को आधुनिक पाठक के लिए स्पष्ट रखता है।
- source_word: יִמָּלוּ
  choice: काट दिए जाते हैं
  rationale: कटाई के रूपक में क्रिया बाल के सिरे को काटे जाने की ओर संकेत करती है और दुष्टों के अंत की छवि बनाए रखती है।
theological_decisions:
- issue: יִקָּפְצוּן की दुर्लभ क्रिया का सटीक आशय
  choice: समेट लिए जाते हैं
  alternative: हटा लिए जाते हैं
  rationale: पाठ मृत्यु या न्याय की परिणति का चित्र देता है, पर क्रिया का सटीक ढंग अनिश्चित है; इसलिए ऐसा विकल्प चुना गया है जो अर्थ को किसी विशेष दण्ड-विधान तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज किंतु गरिमापूर्ण रखी गई है। ‘ऊँचे उठते’ और ‘नीचे गिराए जाते’ से मूल का उत्थान-पतन विरोध सुरक्षित है। दुर्लभ क्रिया और कृषि-रूपक की अनिश्चितता को पादटिप्पणियों में स्पष्ट किया गया है।
