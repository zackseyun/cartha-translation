lexical_decisions:
- source_word: מִזֶּרֶם הָרִים
  choice: पहाड़ों की मूसलाधार बारिश से
  rationale: זֶרֶם तेज बहाव, मूसलाधार वर्षा या पहाड़ी धारा का संकेत दे सकता है। प्रसंग में खुले में पड़े लोगों का भीगना प्रमुख है; इसलिए यह स्वाभाविक हिन्दी मौसम-संबंधी अर्थ देता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: יִרְטָבוּ
  choice: वे भीग जाते हैं
  rationale: क्रिया का अर्थ भीगना या तर हो जाना है। ‘भीग जाते हैं’ आधुनिक हिन्दी में सहज है; वर्षा की तीव्रता ‘मूसलाधार’ से व्यक्त होती है।
- source_word: וּמִבְּלִי מַחְסֶה
  choice: और आश्रय न मिलने के कारण
  rationale: निर्माण का अर्थ ‘आश्रय के बिना’ या ‘आश्रय के अभाव में’ है। चुनी हुई अभिव्यक्ति अभाव और उसके फलस्वरूप चट्टान से लिपटने का संबंध स्पष्ट तथा स्वाभाविक ढंग से बताती है।
- source_word: חִבְּקוּ צוּר
  choice: चट्टान से लिपट जाते हैं
  rationale: חבק का मूल चित्र आलिंगन करने या लिपटने का है और צוּר चट्टान है। यह अनुवाद विवश होकर सुरक्षा के लिए चट्टान से सटने का सजीव चित्र बनाए रखता है।
