  text: In the dark they break into houses[a]; by day they shut themselves in[c][b]; they do not know the light.
translation:
  language: hi
  text: अँधेरे में वह घरों में सेंध लगाता है[a]; दिन में वे अपने को बंद कर लेते हैं[b]; वे उजाले को नहीं जानते[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अँधेरे में वह घरों को खोदता है”; इब्रानी क्रिया दीवार खोदकर या तोड़कर भीतर घुसने का संकेत दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “दिन में वे अपने ऊपर मुहर लगा लेते हैं”; भाव संभवतः यह है कि वे दिन के समय स्वयं को भीतर बंद रखते या छिपाते हैं।
    reason: lexical_alternative
  - marker: c
    text: “उजाला” मुख्यतः दिन के प्रकाश को दर्शाता है, पर प्रसंग में इसका नैतिक संकेत भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חָתַר
  choice: सेंध लगाते हैं
  rationale: क्रिया का मूल अर्थ खोदकर या दीवार तोड़कर भीतर घुसना है। चोरी के प्रसंग में ‘सेंध लगाना’ स्वाभाविक हिन्दी है और मूल चित्र को ‘घुसना’ की अपेक्षा अधिक स्पष्ट रखता है।
- source_word: בַּחֹשֶׁךְ
  choice: अँधेरे में
  rationale: यह कार्य के समय या परिवेश को बताता है और रात के गुप्त अपराध का चित्र बनाए रखता है।
- source_word: בָּתִּים
  choice: घरों में
  rationale: बहुवचन संज्ञा का सीधा और प्रसंगानुकूल अर्थ ‘घर’ है।
- source_word: יוֹמָם
  choice: दिन में
  rationale: यह अँधेरे के साथ स्पष्ट काव्यात्मक विरोध व्यक्त करता है।
- source_word: חִתְּמוּ לָמוֹ
  choice: वे अपने को बंद रखते हैं
  rationale: חִתְּמוּ का अर्थ ‘मुहर लगाना, बंद करना’ है; לָמוֹ के साथ यहाँ दिन में स्वयं को भीतर बंद या छिपाए रखने का भाव संभव है।
- source_word: לֹא יָדְעוּ אוֹר
  choice: वे उजाले को नहीं जानते
  rationale: ‘जानना’ और ‘उजाला’ को शाब्दिक रूप से रखा गया है, ताकि दिन के प्रकाश से अपरिचय तथा संभावित नैतिक संकेत—दोनों बने रहें।
theological_decisions:
- issue: ‘उजाले’ का संभावित नैतिक-प्रतीकात्मक अर्थ
  choice: मुख्य पाठ में ‘उजाले’ को बिना व्याख्यात्मक विस्तार के रखा गया है।
  alternative: इसे केवल ‘दिन का प्रकाश’ या व्याख्यात्मक रूप से ‘भलाई’ कहना।
  rationale: निकट प्रसंग में दिन और रात का वास्तविक विरोध प्राथमिक है, पर ज्ञान-साहित्य में उजाला नैतिक अर्थ भी धारण कर सकता है। अनुवाद इस तनाव को हल किए बिना सुरक्षित रखता है।
- issue: एकवचन חָתַר और बाद के बहुवचन रूपों का मेल
  choice: स्वाभाविक हिन्दी में पूरे वाक्य के लिए बहुवचन ‘वे’ रखा गया है।
  alternative: पहले खंड में ‘वह’ और अगले खंडों में ‘वे’ रखना।
  rationale: इब्रानी में पहले क्रियापद का रूप एकवचन है, जबकि आगे बहुवचन है; यह किसी प्रतिनिधि अपराधी से पूरे वर्ग की ओर बदलाव हो सकता है। मुख्य पाठ में बहुवचन प्रवाह को स्पष्ट करता है, जबकि पादटिप्पणी मूल रूप की संभावना बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण काव्यात्मक गद्य। ‘सेंध लगाना’ साधारण पाठक के लिए स्पष्ट है और इब्रानी के दीवार खोदने वाले चित्र को सुरक्षित रखता है।
