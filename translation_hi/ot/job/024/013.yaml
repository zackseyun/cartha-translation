  text: הֵ֤מָּה הָיוּ֮ בְּֽ/מֹרְדֵ֫י א֥וֹר לֹֽא הִכִּ֥ירוּ דְרָכָ֑י/ו וְ/לֹ֥א יָ֝שְׁב֗וּ בִּ/נְתִיבֹתָֽי/ו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/013.yaml
  text: These are among those who rebel against the light[a]; they do not recognize its ways[b], and they do not stay in its paths.
translation:
  language: hi
  text: ये उन लोगों में हैं जो ज्योति के विरुद्ध विद्रोह करते हैं[a]; वे उसके मार्गों को नहीं पहचानते[b] और न उसके पथों पर बने रहते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ये ज्योति के विरुद्ध विद्रोह करने वालों में थे।” इब्रानी क्रिया का अनुवाद भूतकाल में “थे” किया जा सकता है, यद्यपि इस काव्यात्मक संदर्भ में यह संभवतः लोगों के एक निरंतर पाए जाने वाले वर्ग का वर्णन करती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उसके मार्गों ... उसके पथों।” इब्रानी प्रत्यय का सबसे स्वाभाविक संबंध “ज्योति” से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  choice: ये
  rationale: स्वतंत्र सर्वनाम का बल बनाए रखते हुए यह संदर्भ में बताए जा रहे लोगों के एक वर्ग की ओर संकेत करता है।
- source_word: הָיוּ
  choice: हैं
  rationale: रूप की दृष्टि से इसका अर्थ ‘थे’ हो सकता है, पर काव्यात्मक संदर्भ में यह दुष्ट लोगों के एक निरंतर पहचाने जाने वाले वर्ग का सामान्य-वर्तमान वर्णन करता है।
- source_word: בְּמֹרְדֵי אוֹר
  choice: उन लोगों में ... जो ज्योति के विरुद्ध विद्रोह करते हैं
  rationale: בְּ को वर्ग में सम्मिलित होने के अर्थ में और participial रूप מֹרְדֵי को सक्रिय क्रिया के रूप में व्यक्त किया गया है। ‘ज्योति’ से शाब्दिक तथा नैतिक दोनों संकेत खुले रहते हैं।
- source_word: לֹא הִכִּירוּ
  choice: नहीं पहचानते
  rationale: הכיר में पहचानने, जानने या स्वीकार करने की अर्थ-सीमा है। ‘नहीं पहचानते’ बोध और स्वीकृति, दोनों की संभावित छाया को पूरी तरह सीमित नहीं करता।
- source_word: דְרָכָיו
  choice: उसके मार्गों
  rationale: पुल्लिंग एकवचन प्रत्यय का निकटतम व्याकरणिक पूर्वपद אוֹר है। हिन्दी में ‘ज्योति’ के लिए ‘उसके’ स्वाभाविक है और अनावश्यक स्पष्ट ईश्वरीय व्यक्तिकरण नहीं जोड़ता।
- source_word: וְלֹא יָשְׁבוּ
  choice: और न ... बने रहते हैं
  rationale: ישב यहाँ पथों में टिके या स्थिर रहने का भाव देता है; ‘बने रहते’ आधुनिक हिन्दी में इस रूपक को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בִּנְתִיבֹתָיו
  choice: उसके पथों पर
  rationale: נתיבה को ‘पथ’ कहने से ‘मार्ग’ के समानांतर काव्यात्मकता रहते हुए अलग शब्दावली भी बचती है। हिन्दी मुहावरे में पथ के साथ ‘पर’ अधिक स्वाभाविक है।
theological_decisions:
- issue: ‘उसके मार्गों’ और ‘उसके पथों’ में सर्वनाम का संदर्भ
  choice: प्रत्यय ‘ज्योति’ की ओर संकेत करते हैं।
  alternative: इन्हें किसी निहित व्यक्तिगत पूर्वपद की ओर संकेत मानकर विशेष रूप से परमेश्वर के मार्ग और पथ समझना।
  rationale: निकटतम व्याकरणिक पूर्वपद אוֹר (‘ज्योति’) पुल्लिंग एकवचन है और पूरे पद का बिंब ज्योति के विरुद्ध विद्रोह पर केंद्रित है। हिन्दी ‘उसके’ मूल की अस्पष्टता और संभावित व्यक्तिकरण दोनों को खुला रखता है।
- issue: הָיוּ का काल
  choice: सामान्य-वर्तमान अर्थ में ‘हैं’।
  alternative: भूतकाल में ‘थे’।
  rationale: यद्यपि क्रियारूप औपचारिक रूप से भूतकाल हो सकता है, अय्यूब यहाँ एक प्रकार के लोगों का सामान्य काव्यात्मक चित्रण कर रहा है; फिर भी भूतकाल की वास्तविक संभावना पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी। ‘ज्योति’, ‘मार्ग’ और ‘पथ’ काव्यात्मक स्वर बनाए रखते हैं, जबकि वाक्यरचना सामान्य पाठक के लिए स्पष्ट है।
