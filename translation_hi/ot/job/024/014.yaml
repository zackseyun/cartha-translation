  yaml_path: translation/ot/job/024/014.yaml
  text: At dawn the murderer rises[a]; he kills the poor and needy[b], and in the night he is like a thief.
translation:
  language: hi
  text: भोर होते ही हत्यारा उठता है[a]; वह दीन-दरिद्र को मार डालता है[b], और रात में वह चोर के समान है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उजाला होते ही’; इब्रानी में शब्दशः उजाले के आने का उल्लेख है, जिससे सम्भवतः भोर का समय अभिप्रेत है।
    reason: lexical_alternative
  - marker: b
    text: या ‘दीन-दरिद्र की हत्या करता है’; यहाँ इब्रानी में ‘हत्यारा’ से भिन्न क्रिया प्रयुक्त हुई है, इसलिए मुख्य पाठ में ‘मार डालता है’ कहकर यह भेद बनाए रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לָאוֹר
  choice: भोर होते ही
  rationale: शाब्दिक अर्थ ‘उजाले के लिए/उजाले पर’ है और प्रसंग में प्रकाश आने, अर्थात भोर होने, का समय सूचित करता है। ‘भोर होते ही’ आधुनिक हिन्दी में यह कालगत अर्थ स्वाभाविक रूप से व्यक्त करता है।
- source_word: יָקוּם
  choice: उठता है
  rationale: קום का क़ाल रूप यहाँ उठकर कार्य आरम्भ करने का भाव देता है; ‘उठता है’ सीधा और स्वाभाविक है।
- source_word: רוֹצֵחַ
  choice: हत्यारा
  rationale: कृदन्त यहाँ संज्ञा के रूप में ऐसे व्यक्ति को दर्शाता है जो हत्या करता है। ‘हत्यारा’ आधुनिक हिन्दी का स्पष्ट और सामान्य शब्द है।
- source_word: יִקְטָל
  choice: मार डालता है
  rationale: यह सामान्य क्रिया קטל है, רצח की पुनरावृत्ति नहीं। इसलिए ‘मार डालता है’ संज्ञा ‘हत्यारा’ से मूल की शब्दगत भिन्नता बनाए रखता है।
- source_word: עָנִי וְאֶבְיוֹן
  choice: दीन-दरिद्र
  rationale: यह युग्म सामाजिक और आर्थिक रूप से असहाय लोगों को सूचित करता है। ‘दीन-दरिद्र’ दोनों पदों के संयुक्त बल को संक्षिप्त और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: וּבַלַּיְלָה
  choice: और रात में
  rationale: संयोजक और पूर्वसर्ग दूसरे कालगत परिदृश्य को चिह्नित करते हैं तथा भोर और रात का काव्यात्मक विरोध बनाए रखते हैं।
- source_word: יְהִי
  choice: हो जाता है
  rationale: היה + כ यहाँ अवस्था, भूमिका या व्यवहार का भाव दे सकता है। ‘हो जाता है’ दिन के हत्यारे और रात के चोर के रूप के बीच परिवर्तन को स्वाभाविक हिन्दी में व्यक्त करता है, बिना उपमा को व्यवहार मात्र तक सीमित किए।
- source_word: כַגַּנָּב
  choice: चोर के समान
  rationale: तुलनात्मक כ का सीधा और गरिमापूर्ण हिन्दी रूप ‘के समान’ है।
