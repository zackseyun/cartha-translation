  text: גְּבֻל֥וֹת יַשִּׂ֑יגוּ עֵ֥דֶר גָּ֝זְל֗וּ וַ/יִּרְעֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/002.yaml
  text: They move boundary markers[b][a]; they seize a flock and pasture it.
translation:
  language: hi
  text: वे सीमा-चिह्न खिसका देते हैं[a]; वे झुंड लूटकर उसे चराते हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सीमा-चिह्न हटा देते हैं।” इब्रानी क्रिया किसी दूसरे की भूमि पर अतिक्रमण करने के लिए संपत्ति के सीमा-चिह्नों को खिसकाने या हटाने का अर्थ दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “वे झुंड चुरा लेते हैं और उसकी रखवाली करते हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּבֻלוֹת
  choice: सीमा-चिह्न
  rationale: बहुवचन संज्ञा यहाँ भूमि की सीमा बताने वाले ठोस चिह्नों को दर्शाती है; यह अभिव्यक्ति आधुनिक हिन्दी में कानूनी-सामाजिक अर्थ स्पष्ट करती है।
- source_word: יַשִּׂיגוּ
  choice: खिसका देते हैं
  rationale: संपत्ति की सीमा के प्रसंग में क्रिया सीमा-चिह्न को उसकी जगह से हटाकर दूसरे की भूमि पर अतिक्रमण करने का भाव देती है। 'खिसका देते हैं' स्थान बदलने का ठोस अर्थ रखता है, जबकि पूर्णतः हटा देना आवश्यक नहीं ठहराता।
- source_word: עֵדֶר
  choice: झुंड
  rationale: एकवचन सामूहिक संज्ञा पशुओं के झुंड, सामान्यतः भेड़-बकरियों के झुंड, को सूचित करती है। हिन्दी में 'झुंड' स्वाभाविक है और मूल की अनिर्दिष्टता बनाए रखता है।
- source_word: גָּזְלוּ
  choice: लूटकर
  rationale: क्रिया बलपूर्वक अथवा अन्यायपूर्वक छीन लेने का अर्थ देती है। 'लूटकर' खुली और अवैध हड़प का बल बनाए रखता है।
- source_word: וַיִּרְעוּ
  choice: उसे चराते हैं
  rationale: רעה यहाँ झुंड को चराने या उसकी देखभाल करने की क्रिया बताता है। 'उसे चराते हैं' सरल और स्वाभाविक हिन्दी में यह विडंबना व्यक्त करता है कि लूटा हुआ झुंड वे अपने झुंड की तरह चराते हैं।
