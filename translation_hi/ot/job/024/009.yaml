  text: They snatch the orphan from the breast[a], and they take a pledge from the poor.
translation:
  language: hi
  text: 'वे अनाथ बच्चे को स्तन से छीन लेते हैं[a],

    और गरीब से बंधक ले लेते हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे अनाथ बच्चे को उसकी माँ के स्तन से लूट लेते हैं।” इब्रानी अभिव्यक्ति कठिन है; आशय यह है कि दुष्ट लोग स्तनपान करते अनाथ बच्चे तक को बलपूर्वक उठा ले जाते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: יִגְזְלוּ
  choice: छीन लेते हैं
  rationale: ग़ज़ल क्रिया हिंसक या अन्यायपूर्ण ढंग से लेने का भाव देती है; ‘छीन लेते हैं’ इस बलपूर्वक क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִשֹּׁד
  choice: स्तन से
  rationale: यह कठिन इब्रानी रूप यहाँ परंपरागत रूप से ‘स्तन से’ समझा जाता है। मुख्य पाठ स्रोत के निकट रहता है, जबकि पादटिप्पणी अधिक स्पष्ट विकल्प देती है।
- source_word: יָתוֹם
  choice: अनाथ बच्चे को
  rationale: יָתוֹם अनाथ या विशेषतः पिता-विहीन बच्चे को दर्शाता है। प्रसंग में स्तनपान करते बच्चे का संकेत होने के कारण ‘अनाथ बच्चा’ स्वाभाविक और स्पष्ट है।
- source_word: וְעַל
  choice: और ... से
  rationale: חבל के साथ यह उस व्यक्ति को सूचित करता है जिससे बंधक लिया जाता है; हिन्दी में ‘से’ स्वाभाविक संबंध व्यक्त करता है।
- source_word: עָנִי
  choice: गरीब
  rationale: ऋण और बंधक द्वारा शोषण के संदर्भ में इसका आर्थिक अर्थ ‘गरीब’ सबसे उपयुक्त है।
- source_word: יַחְבֹּלוּ
  choice: बंधक ले लेते हैं
  rationale: इस क्रिया का अर्थ ऋण के बदले कोई वस्तु बंधक के रूप में लेना है। ‘बंधक ले लेते हैं’ कानूनी-आर्थिक आशय को सामान्य हिन्दी में स्पष्ट रखता है।
