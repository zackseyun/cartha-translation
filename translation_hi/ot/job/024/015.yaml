  text: וְ/עֵ֤ין נֹאֵ֨ף שָׁ֤מְרָֽה נֶ֣שֶׁף לֵ֭/אמֹר לֹא תְשׁוּרֵ֣/נִי עָ֑יִן וְ/סֵ֖תֶר פָּנִ֣ים יָשִֽׂים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/015.yaml
  text: The eye of the adulterer waits for twilight[a], saying, ‘No eye will see me’[b]; and he puts a covering over his face.
translation:
  language: hi
  text: व्यभिचारी की आँख गोधूलि की बाट जोहती है[a]। वह कहता है, “कोई आँख मुझे नहीं देखेगी”; और वह अपना चेहरा ढक लेता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “धुँधलके की।” इब्रानी शब्द दिन के अंत की मंद रोशनी को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “और वह चेहरे का छिपाव रखता है।” अभिप्राय है कि वह पहचान से बचने के लिए अपना चेहरा ढकता या छिपाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵין
  choice: आँख
  rationale: दोनों स्थानों पर ठोस दृश्य-बिंब बनाए रखता है और हिन्दी में स्वाभाविक है।
- source_word: נֹאֵף
  choice: व्यभिचारी
  rationale: पुल्लिंग एकवचन कृदन्त का संक्षिप्त और प्रचलित हिन्दी समतुल्य है।
- source_word: שָׁמְרָה
  choice: बाट जोहती है
  rationale: मूल क्रिया में पहरा देने या ध्यान लगाए रखने का भाव है; यहाँ अँधेरा होने की प्रतीक्षा अभिप्रेत है।
- source_word: נֶשֶׁף
  choice: गोधूलि
  rationale: दिन के अंत की धुँधली रोशनी को व्यक्त करता है और प्रसंग के अनुकूल है, यद्यपि शब्द व्यापक रूप से धुँधलके का भी संकेत कर सकता है।
- source_word: לֵאמֹר
  choice: वह कहता है
  rationale: कथन या मन में कही बात, दोनों की सम्भावना खुली रखता है।
- source_word: תְשׁוּרֵנִי
  choice: मुझे नहीं देखेगी
  rationale: שׁוּר के ‘देखना/निहारना’ अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וְסֵתֶר פָּנִים יָשִׂים
  choice: और वह अपना चेहरा ढक लेता है
  rationale: संक्षिप्त इब्रानी पदबंध का स्वाभाविक अर्थ पहचान छिपाने के लिए चेहरा ढकना है।
