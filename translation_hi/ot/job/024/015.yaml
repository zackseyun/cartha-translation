  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘बाट जोहती है’ आँख को कर्ता बनाए रखने वाले मूल इब्रानी बिंब को सुरक्षित रखता है।
