  text: יִשְׁכָּ֘חֵ֤/הוּ רֶ֨חֶם מְתָ֘ק֤/וֹ רִמָּ֗ה ע֥וֹד לֹֽא יִזָּכֵ֑ר וַ/תִּשָּׁבֵ֖ר כָּ/עֵ֣ץ עַוְלָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/020.yaml
  text: The womb forgets him[a]; the worm feeds sweetly on him. He is remembered no more[b], and injustice is broken like a tree.
translation:
  language: hi
  text: कोख उसे भूल जाती है; कीड़े को वह मीठा लगता है[a]। अब उसका स्मरण नहीं किया जाता, और अन्याय पेड़ के समान टूट जाता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कीड़ा उसे स्वाद लेकर खाता है।”
    reason: मूल के ‘कीड़े को वह मीठा लगता है’ अर्थ को भोजन करने की क्रिया के साथ व्यक्त करने वाला वैकल्पिक अनुवाद।
  - marker: b
    text: या, “अन्यायी मनुष्य पेड़ के समान टूट जाता है।” इब्रानी में भाववाचक संज्ञा “अन्याय/दुष्टता” है, जो यहाँ अन्यायी व्यक्ति के लिए प्रयुक्त हो सकती है।
    reason: भाववाचक संज्ञा के व्यक्ति-वाचक प्रयोग की संभव वैकल्पिक व्याख्या।
lexical_decisions:
- source_word: יִשְׁכָּחֵהוּ
  choice: उसे भूल जाता है
  rationale: שׁכח के कालगत रूप को यहाँ दुष्ट के सामान्य परिणाम का सजीव वर्णन मानकर वर्तमानकालीन हिन्दी में रखा गया है।
- source_word: רֶחֶם
  choice: गर्भ
  rationale: शाब्दिक बिंब को बनाए रखता है; इसे व्याख्यात्मक रूप से ‘उसकी माँ’ नहीं बनाया गया।
- source_word: מְתָקוֹ רִמָּה
  choice: कीड़ा उसे स्वाद लेकर खाता है
  rationale: מתק की ‘मीठा/सुखद लगना’ वाली धारणा और रִמָּה के मृत देह खाने के बिंब को स्वाभाविक हिन्दी में व्यक्त करता है; अधिक शाब्दिक अर्थ फुटनोट में सुरक्षित है।
- source_word: עוֹד לֹא יִזָּכֵר
  choice: फिर उसे याद नहीं किया जाता
  rationale: निफ़ाल की कर्मवाच्य रचना और आगे स्मरण न किए जाने की समाप्ति-दृष्टि दोनों को बनाए रखता है।
- source_word: וַתִּשָּׁבֵר כָּעֵץ
  choice: पेड़ के समान टूट जाता है
  rationale: שׁבר के निष्क्रिय/अकर्मक परिणाम और עֵץ के पेड़ वाले उपमान को संक्षिप्त, स्वाभाविक हिन्दी में रखता है।
- source_word: עַוְלָה
  choice: अन्याय
  rationale: मूल पाठ के भाववाचक संज्ञा-रूप को सुरक्षित रखते हुए आधुनिक हिन्दी का सहज समतुल्य देता है।
theological_decisions:
- issue: क्या עַוְלָה को भाववाचक ‘अन्याय’ या व्यक्ति-वाचक ‘अन्यायी मनुष्य’ माना जाए
  choice: मुख्य पाठ में भाववाचक ‘अन्याय’
  alternative: ‘अन्यायी मनुष्य पेड़ के समान टूट जाता है’
  rationale: इब्रानी रूप भाववाचक संज्ञा है, इसलिए मुख्य पाठ उसी तनाव को बनाए रखता है; संदर्भ में इसके द्वारा अन्यायी व्यक्ति का संकेत संभव है, अतः वह पाठ फुटनोट में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। पद की कठोर मृत्यु-छवि और अंतिम पंक्ति की वास्तविक व्याख्यात्मक अस्पष्टता को बिना सांप्रदायिक विस्तार के सुरक्षित रखा गया है।
