  yaml_path: translation/ot/job/024/021.yaml
  text: He preys on the barren woman who does not bear[a], and he does no good to the widow.
translation:
  language: hi
  text: वह उस बाँझ स्त्री को अपना शिकार बनाता है[a], जो संतान नहीं जनती, और विधवा का कोई भला नहीं करता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बाँझ स्त्री से अपना पेट भरता है”; इब्रानी क्रिया का शाब्दिक अर्थ “चराना/खिलाना” है, पर इस संदर्भ में संभवतः किसी असहाय व्यक्ति को शिकार बनाने या उसका शोषण करने का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹעֶה
  choice: अपना शिकार बनाता है
  rationale: क्रिया רעה का सामान्य अर्थ ‘चराना/खिलाना’ है, लेकिन इस शत्रुतापूर्ण संदर्भ में असहाय स्त्री के शोषण का भाव अधिक स्वाभाविक है। ‘अपना शिकार बनाता है’ इस नकारात्मक रूपक को सहज आधुनिक हिन्दी में व्यक्त करता है, जबकि शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: עֲקָרָה
  choice: बाँझ स्त्री
  rationale: यह स्त्रीलिंग एकवचन उस स्त्री को दर्शाता है जो संतान उत्पन्न नहीं करती। ‘बाँझ स्त्री’ प्रचलित, स्पष्ट और संक्षिप्त हिन्दी है।
- source_word: לֹא תֵלֵד
  choice: जो संतान नहीं जनती
  rationale: यह इब्रानी के शाब्दिक भाव ‘जन्म नहीं देती’ को स्वाभाविक हिन्दी में रखता है और ‘नहीं जन सकती’ जैसा असमर्थता का अतिरिक्त भाव नहीं जोड़ता।
- source_word: אַלְמָנָה
  choice: विधवा
  rationale: नामित असुरक्षित सामाजिक वर्ग के लिए मानक और गरिमापूर्ण हिन्दी शब्द।
- source_word: לֹא יְיֵטִיב
  choice: कोई भला नहीं करता
  rationale: हिफ़ील रूप का अर्थ ‘भला करना, अच्छा व्यवहार करना, लाभ पहुँचाना’ हो सकता है। यह चयन नैतिक बल बनाए रखते हुए मूल के निकट और स्वाभाविक है।
