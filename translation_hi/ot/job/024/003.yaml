  yaml_path: translation/ot/job/024/003.yaml
  text: They drive away the orphan's donkey[b][a]; they take the widow's ox as a pledge.
translation:
  language: hi
  text: 'वे अनाथों का गधा हाँक ले जाते हैं[a];

    वे विधवा का बैल बंधक के रूप में ले लेते हैं[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे अनाथों के गधे हाँक ले जाते हैं।” इब्रानी में “गधा” एकवचन और “अनाथ” बहुवचन है; इसे सामूहिक या प्रत्येक अनाथ के संबंध में अलग-अलग समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “वे विधवा का बैल ऋण की जमानत के रूप में जब्त कर लेते हैं।” इब्रानी क्रिया विशेष रूप से किसी संपत्ति को ऋण की सुरक्षा के लिए लेने को दर्शाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמוֹר
  choice: गधा
  rationale: यह घरेलू बोझा ढोने वाले पशु के लिए आधुनिक हिन्दी का सामान्य और स्पष्ट शब्द है। इब्रानी में शब्द एकवचन है, इसलिए मुख्य पाठ में एकवचन रखा गया है।
- source_word: יְתוֹמִים
  choice: अनाथों का
  rationale: इब्रानी शब्द बहुवचन है और सामूहिक अथवा वितरणात्मक अर्थ दे सकता है। हिन्दी में ‘अनाथों का गधा’ स्रोत की संख्या-संबंधी बनावट और उसकी वास्तविक अस्पष्टता को बनाए रखता है।
- source_word: יִנְהָגוּ
  choice: हाँक ले जाते हैं
  rationale: נהג का अर्थ पशु को हाँकना या ले जाना है। ‘हाँक ले जाते हैं’ पशु के संदर्भ में स्वाभाविक है और प्रसंग में उसे मालिक से दूर ले जाने का भाव व्यक्त करता है।
- source_word: יַחְבְּלוּ
  choice: बंधक रख लेते हैं
  rationale: यहाँ חבל संपत्ति को ऋण की जमानत के रूप में लेने की विशिष्ट कानूनी-आर्थिक क्रिया बताता है; ‘बंधक रख लेते हैं’ इस अर्थ को साधारण आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: שׁוֹר
  choice: बैल
  rationale: कृषि और श्रम के संदर्भ में एकवचन שׁוֹר के लिए ‘बैल’ स्वाभाविक हिन्दी है और काम में आने वाले पशु का संकेत देता है।
- source_word: אַלְמָנָה
  choice: विधवा का
  rationale: इब्रानी संबंधसूचक रचना पशु को विधवा की संपत्ति बताती है; हिन्दी में इसे स्वाभाविक रूप से संबंधकारक द्वारा व्यक्त किया गया है।
