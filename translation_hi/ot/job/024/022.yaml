  text: וּ/מָשַׁ֣ךְ אַבִּירִ֣ים בְּ/כֹח֑/וֹ יָ֝ק֗וּם וְֽ/לֹא יַאֲמִ֥ין בַּֽ/חַיִּֽין־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/022.yaml
  text: Yet he drags away the mighty by his power; he rises up[a], but he has no assurance of life.
translation:
  language: hi
  text: फिर भी वह अपने बल से शक्तिशालियों को खींच ले जाता है; वह उठ खड़ा होता है[a], पर उसे अपने जीवन का भरोसा नहीं रहता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह उठ खड़ा होता है, और जीवन पर भरोसा नहीं करता”; अथवा, “वह उठ खड़ा होता है, और किसी को जीवन का भरोसा नहीं रहता।” अंतिम उपवाक्य में हिब्रू कर्ता अस्पष्ट है।
    reason: वैकल्पिक पाठ
lexical_decisions:
- source_word: וּמָשַׁךְ
  choice: खींच ले जाता है
  rationale: मूल क्रिया משׁך का सामान्य अर्थ ‘खींचना’ है। शक्तिशाली लोगों को कर्म और अपने बल को साधन बताने वाले वाक्य में यह बलपूर्वक ले जाने का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: אַבִּירִים
  choice: शक्तिशालियों
  rationale: यह बहुवचन संज्ञा बलवान या सामर्थी लोगों को दर्शाती है; ‘शक्तिशालियों’ में शारीरिक बल के साथ सामाजिक सामर्थ्य का भाव भी खुला रहता है।
- source_word: בְּכֹחוֹ
  choice: अपने बल से
  rationale: בְּ साधन का और כֹּחַ बल या सामर्थ्य का बोध कराता है। हिंदी में ‘अपने बल से’ इसका सहज और निकट समतुल्य है।
- source_word: יָקוּם
  choice: वह उठ खड़ा होता है
  rationale: קום के ‘उठना/खड़ा होना’ वाले चित्र को सुरक्षित रखा गया है, जबकि उसके यहाँ सक्रिय होने, डटने या अपने को स्थापित करने की सटीक छाया को अनावश्यक रूप से निश्चित नहीं किया गया।
- source_word: וְלֹא יַאֲמִין בַּחַיִּין
  choice: पर उसे अपने जीवन का भरोसा नहीं रहता
  rationale: יַאֲמִין का भाव भरोसा या निश्चिंतता है और בַּחַיִּין जीवन से संबंधित है। एकवचन क्रिया के कारण मुख्य पाठ में उसी व्यक्ति को कर्ता रखा गया है; हिंदी में यह वाक्य उसके जीवन की अनिश्चितता को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: अंतिम उपवाक्य के कर्ता की अस्पष्टता
  choice: मुख्य पाठ में पहले वाले एकवचन व्यक्ति को कर्ता मानकर ‘उसे अपने जीवन का भरोसा नहीं रहता’ रखा गया है।
  alternative: इसे परिणामसूचक, अनिर्दिष्ट कर्ता के साथ ‘किसी को जीवन का भरोसा नहीं रहता’ या अधिक शाब्दिक रूप में ‘वह जीवन पर भरोसा नहीं करता’ भी समझा जा सकता है।
  rationale: हिब्रू क्रिया एकवचन है और उसी व्यक्ति को कर्ता मानना व्याकरणतः सीधा है, पर संक्षिप्त वाक्य-विन्यास संदर्भ में उसके कारण दूसरों की असुरक्षा का अर्थ भी दे सकता है। इस वास्तविक अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘खींच ले जाता है’ मूल क्रिया की बलपूर्ण छवि और ‘उठ खड़ा होता है’ उसके दृश्य रूपक को बनाए रखते हैं।
