  text: वे नंगे ही रात बिताते हैं[a], बिना वस्त्रों के; और ठंड में उनके पास ओढ़ने का कोई कपड़ा नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे नंगे ही रात को ठहरते हैं, बिना वस्त्रों के; और ठंड में उनके पास ओढ़ने का कोई कपड़ा नहीं है।”
    reason: शाब्दिक और कोशगत वैकल्पिक अनुवाद; יָלִינוּ के लिए ‘रात को ठहरते हैं’ और בַּקָּרָה के लिए ‘ठंड में’ मूल रचना को अधिक निकटता से दर्शाते हैं।
lexical_decisions:
- source_word: עָרוֹם
  choice: नंगे
  rationale: यह विशेषण वस्त्रहीन या बहुत कम वस्त्र पहने होने की दशा बताता है। ‘नंगे’ सीधा, सजीव और प्रसंग में अभाव की तीव्रता व्यक्त करने वाला शब्द है।
- source_word: יָלִינוּ
  choice: रात बिताते हैं
  rationale: לין का अर्थ रात गुज़ारना या ठहरना है। ‘रात बिताते हैं’ आधुनिक हिन्दी में स्वाभाविक है और क्रिया के कालगत अर्थ को बनाए रखता है।
- source_word: מִבְּלִי
  choice: नहीं
  rationale: यह अभाव या वंचना व्यक्त करता है। हिन्दी वाक्य ‘उनके पास ... नहीं’ में इसका अर्थ सहज और स्पष्ट रूप से आता है।
- source_word: לְבוּשׁ
  choice: पहनने को कपड़ा
  rationale: संज्ञा सामान्यतः वस्त्र या पहनावे को सूचित करती है। ‘पहनने को कपड़ा’ अभाव की स्थिति को साधारण आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: כְּסוּת
  choice: ओढ़ना
  rationale: यह किसी आवरण को, विशेषकर सुरक्षा देने वाले वस्त्र को, सूचित कर सकता है। ठंड के प्रसंग में ‘ओढ़ना’ स्वाभाविक है, जबकि किसी खास वस्तु जैसे कंबल को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: בַּקָּרָה
  choice: ठंड से बचने के लिए
  rationale: संज्ञा का अर्थ ‘ठंड’ है। आवरण के सुरक्षात्मक प्रयोजन को हिन्दी में स्वाभाविक ढंग से व्यक्त करने के लिए यह रचना चुनी गई है; अधिक शाब्दिक ‘ठंड में’ भी संभव है।
