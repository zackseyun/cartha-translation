  yaml_path: translation/ot/job/024/023.yaml
  text: He gives them security[a], and they are supported[b]; his eyes are on their ways.
translation:
  language: hi
  text: वह उन्हें सुरक्षा देता है[a], और वे सहारा पाते हैं[b]; उसकी आँखें उनके मार्गों पर लगी रहती हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में यहाँ ‘उसे’ और आगे ‘वह सहारा पाता है’—दोनों एकवचन हैं; पद के अंत में ‘उनके मार्गों’ होने के कारण मुख्य पाठ में इन्हें सामूहिक बहुवचन में व्यक्त किया गया है।
    reason: alternative_reading
  - marker: b
    text: 'अधिक रूपगत अनुवाद: “वह उसे सुरक्षा देता है, और वह सहारा पाता है; उसकी आँखें उनके मार्गों पर लगी रहती हैं।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתֶּן
  choice: देता है
  rationale: נתן का क़ाल अपूर्ण 3 पुल्लिंग एकवचन यहाँ सामान्य अथवा निरंतर क्रिया व्यक्त करता है; ‘देता है’ स्वाभाविक और अर्थानुकूल है।
- source_word: לוֹ
  choice: उन्हें
  rationale: रूप की दृष्टि से यह एकवचन ‘उसे’ है, पर अंतिम बहुवचन ‘उनके मार्गों’ के कारण दुष्टों के समूह को सामूहिक रूप में ‘उन्हें’ कहना प्रसंगगत संगति रखता है; शाब्दिक एकवचन पादटिप्पणी में रखा गया है।
- source_word: לָבֶטַח
  choice: सुरक्षा
  rationale: בֶּטַח यहाँ सुरक्षित दशा या निश्चिंतता को सूचित करता है। ‘सुरक्षा’ अंतःकरण के ‘भरोसे’ का अनावश्यक अर्थ जोड़े बिना बाहरी सुरक्षित स्थिति व्यक्त करता है।
- source_word: וְיִשָּׁעֵן
  choice: और वे सहारा पाते हैं
  rationale: שׁען का निफ़अल रूप ‘सहारा पाना/समर्थित होना’ व्यक्त कर सकता है। ‘सहारा पाते हैं’ आधुनिक हिन्दी में स्वाभाविक है और पहले खंड से मिलने वाली सुरक्षित दशा का परिणाम बताता है।
- source_word: וְעֵינֵיהוּ
  choice: उसकी आँखें
  rationale: इब्रानी बहुवचन संज्ञा और एकवचन प्रत्यय का सीधा तथा स्वाभाविक हिन्दी रूप; प्रसंग में यह संभवतः परमेश्वर की दृष्टि है, यद्यपि पद उसे नाम से नहीं बताता।
- source_word: עַל
  choice: पर लगी रहती हैं
  rationale: עַל यहाँ ध्यानपूर्वक निगाह रखे जाने का भाव देता है। हिन्दी मुहावरे ‘आँखें ... पर लगी रहती हैं’ से यह निरंतर दृष्टि स्वाभाविक रूप में व्यक्त होती है।
- source_word: דַּרְכֵיהֶם
  choice: उनके मार्गों
  rationale: דֶּרֶךְ के मार्ग और आचरण—दोनों भावों को ‘मार्ग’ बनाए रखता है और रूपक को अनावश्यक रूप से नहीं खोलता।
theological_decisions:
- issue: पद में एकवचन और बहुवचन का परिवर्तन
  choice: पहले भाग को सामूहिक बहुवचन (‘उन्हें ... वे’) में और देखने वाले को एकवचन (‘उसकी आँखें’) में रखा गया है।
  alternative: 'अधिक रूपगत अनुवाद: ‘वह उसे सुरक्षा देता है, और वह सहारा पाता है; उसकी आँखें उनके मार्गों पर लगी रहती हैं।’'
  rationale: इब्रानी में לוֹ और וְיִשָּׁעֵן एकवचन हैं, जबकि דַּרְכֵיהֶם बहुवचन है। बहुवचन अंत दुष्टों को एक वर्ग के रूप में समझने का आधार देता है, पर मूल का व्याकरणिक तनाव पादटिप्पणी में सुरक्षित रखा गया है। ‘उसकी आँखें’ का संदर्भ संभवतः परमेश्वर है, पर अनुवाद में नाम जोड़कर अस्पष्टता दूर नहीं की गई।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण काव्यात्मक गद्य। ‘मार्गों’ से मूल रूपक सुरक्षित है; ‘उसकी’ के संदर्भ को स्पष्ट करने के लिए ‘परमेश्वर’ नहीं जोड़ा गया, ताकि मूल की अस्पष्टता बनी रहे।
