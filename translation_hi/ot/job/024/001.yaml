  text: מַדּ֗וּעַ מִ֭/שַּׁדַּי לֹא נִצְפְּנ֣וּ עִתִּ֑ים ו/ידע/ו לֹא חָ֥זוּ יָמָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/001.yaml
  text: Why are times not kept by the Almighty[b][a], and why do those who know him not see his days?
translation:
  language: hi
  text: सर्वशक्तिमान के यहाँ समय क्यों सुरक्षित नहीं रखे जाते[a], और जो उसे जानते हैं वे उसके दिन क्यों नहीं देखते[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘नियत समय’; इब्रानी में ‘संचित’ या ‘आरक्षित रखे जाते’ का भाव भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘उसके दिन’ सम्भवतः उन दिनों को दर्शाता है जब परमेश्वर न्याय करता या हस्तक्षेप करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: מַדּוּעַ
  choice: क्यों
  rationale: यह प्रश्नवाचक क्रियाविशेषण अय्यूब की शिकायत आरम्भ करता है; ‘क्यों’ आधुनिक हिन्दी में स्वाभाविक और सीधा है।
- source_word: מִשַּׁדַּי
  choice: सर्वशक्तिमान ... अपने पास
  rationale: निष्क्रिय क्रिया के साथ מִן का सम्बन्ध कर्ता या स्रोत से हो सकता है। हिन्दी में ‘सर्वशक्तिमान ... अपने पास’ उस भाव को स्वाभाविक ढंग से व्यक्त करता है कि ये समय परमेश्वर के अधिकार में रखे या सुरक्षित हों।
- source_word: נִצְפְּנוּ
  choice: अपने पास ... रखता
  rationale: צפן का अर्थ छिपाना, संचित करना या सुरक्षित रखना हो सकता है। ‘अपने पास रखना’ आरक्षित रखने का भाव देता है, पर ‘छिपाना’ अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: עִתִּים
  choice: ठहराए हुए समय
  rationale: עִתִּים का अर्थ ‘समय’ अथवा ‘नियत/ठहराए हुए समय’ हो सकता है। प्रसंग में न्याय या हस्तक्षेप के अवसरों का संकेत स्पष्ट करने के लिए यह स्वाभाविक हिन्दी है; व्यापक विकल्प पादटिप्पणी में रखा गया है।
- source_word: וְיֹדְעָיו
  choice: जो उसे जानते हैं
  rationale: पुल्लिंग एकवचन प्रत्यय सहित कृदन्त परमेश्वर को जानने वालों को दर्शाता है; यह संबंधपरक भाव को सहज हिन्दी में बनाए रखता है।
- source_word: חָזוּ
  choice: देखते
  rationale: חזה का अर्थ देखना या निहारना है; यहाँ परमेश्वर के दिनों को अनुभव या प्रत्यक्ष होते देखने के लिए साधारण ‘देखना’ उपयुक्त है।
- source_word: יָמָיו
  choice: उसके दिन
  rationale: मूल का बहुवचन और सर्वनामिक सम्बन्ध अक्षुण्ण रखा गया है। यह काव्यात्मक रूप से संक्षिप्त और अर्थ में खुला है।
theological_decisions:
- issue: ‘उसके दिन’ से अभिप्राय
  choice: मुख्य पाठ में शाब्दिक वाक्यांश ‘उसके दिन’ रखा गया।
  alternative: उसके न्याय के दिन; वे दिन जब वह कार्य करता या हस्तक्षेप करता है।
  rationale: इब्रानी पद न्याय या परमेश्वर के हस्तक्षेप के अवसरों की ओर संकेत कर सकता है, पर ऐसा स्पष्ट रूप से नहीं कहता। शाब्दिक अभिव्यक्ति धार्मिक तनाव और काव्यात्मक अस्पष्टता बनाए रखती है।
- issue: ‘समय’ का नियत अवसरों के रूप में अर्थ
  choice: ‘ठहराए हुए समय’
  alternative: ‘समय’
  rationale: प्रसंग में ये सामान्य कालखंडों से अधिक परमेश्वर की कार्रवाई के नियत अवसर प्रतीत होते हैं; फिर भी व्यापक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और प्रश्नात्मक काव्य-लय रखी गई है। ‘सर्वशक्तिमान’ अय्यूब में שַׁדַּי के लिए परिचित पद है। दोनों पादटिप्पणी-चिह्न सम्बद्ध वाक्यांशों के तुरंत बाद रखे गए हैं।
