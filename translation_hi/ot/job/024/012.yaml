id: JOB.24.12
reference: Job 24:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: מֵ֘/עִ֤יר מְתִ֨ים יִנְאָ֗קוּ וְ/נֶֽפֶשׁ חֲלָלִ֥ים תְּשַׁוֵּ֑עַ וֶ֝/אֱל֗וֹהַּ לֹא יָשִׂ֥ים תִּפְלָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/012.yaml
  text: From the city the dying groan[a], and the soul of the slain cries out for help[b], yet God does not regard it as folly.
translation:
  language: hi
  text: नगर से मरते हुओं की कराह उठती है[a], और मारे गए लोगों का प्राण सहायता के लिए पुकारता है; फिर भी परमेश्वर इसे मूर्खता नहीं ठहराता[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “नगर में मनुष्य कराहते हैं”; यहाँ इब्रानी शब्द מְתִים का अर्थ कठिन है और इसे “मनुष्य” भी समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: अंतिम इब्रानी वाक्यांश कठिन है। अन्य सम्भव अर्थ हैं, “फिर भी परमेश्वर कोई दोष नहीं लगाता,” या “फिर भी परमेश्वर उस पुकार पर ध्यान नहीं देता।”
    reason: alternative_reading
lexical_decisions:
- source_word: מֵעִיר
  choice: नगर से
  rationale: 'מִן के मूल स्रोत-बोध को बनाए रखता है: कराह नगर से उठती है।'
- source_word: מְתִים
  choice: मरते हुए
  rationale: यह कठिन रूप ‘मनुष्य’ भी समझा जा सकता है, पर समानांतर ‘मारे गए लोगों’ और मृत्यु-पीड़ा के प्रसंग में ‘मरते हुए’ उपयुक्त है; विकल्प पादटिप्पणी में रखा गया है।
- source_word: יִנְאָקוּ
  choice: कराह उठती है
  rationale: क्रिया पीड़ा से निकलने वाली सुनाई देने योग्य कराह व्यक्त करती है; हिन्दी में यह स्वाभाविक और प्रभावपूर्ण है।
- source_word: וְנֶפֶשׁ חֲלָלִים
  choice: और मारे गए लोगों का प्राण
  rationale: נֶפֶשׁ का ठोस ‘प्राण’ और חֲלָלִים का हिंसक रूप से मारे गए लोग—दोनों स्रोत की अभिव्यक्ति और भावात्मक भार को बनाए रखते हैं।
- source_word: תְּשַׁוֵּעַ
  choice: सहायता के लिए पुकारता है
  rationale: तीव्र सहायता-पुकार का भाव स्पष्ट और स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: וֶאֱלוֹהַּ
  choice: फिर भी परमेश्वर
  rationale: संयोजक यहाँ पीड़ितों की पुकार और परमेश्वर की प्रत्यक्ष निष्क्रियता के बीच विरोध दिखाता है।
- source_word: לֹא יָשִׂים תִּפְלָה
  choice: इसे मूर्खता नहीं ठहराता
  rationale: कठिन मुहावरे में תִּפְלָה ‘मूर्खता/असंगति’ का अर्थ दे सकता है। ‘ठहराता’ שׂים के मूल्यांकनात्मक भाव को रखता है, जबकि अन्य सम्भव अर्थ पादटिप्पणी में दिए गए हैं।
theological_decisions:
- issue: अन्याय के सामने परमेश्वर की प्रत्यक्ष निष्क्रियता
  choice: फिर भी परमेश्वर इसे मूर्खता नहीं ठहराता
  alternative: फिर भी परमेश्वर कोई दोष नहीं लगाता; अथवा परमेश्वर उस पुकार पर ध्यान नहीं देता
  rationale: यह अय्यूब की शिकायत का तनाव बनाए रखता है और परमेश्वर के न्याय के विषय में पद के बाहर का समाधान पाठ में नहीं जोड़ता। सर्वनाम ‘इसे’ की संदिग्धता भी जानबूझकर बनी रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठक के लिए बोधगम्य काव्यात्मक गद्य। ‘नगर’, ‘प्राण’ और ‘परमेश्वर’ स्रोत की गंभीरता बनाए रखते हैं; कठिन अंतिम वाक्यांश की वास्तविक अनिश्चितता पादटिप्पणी में सुरक्षित है।
