id: JOB.42.12
reference: Job 42:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַֽ/יהוָ֗ה בֵּרַ֛ךְ אֶת אַחֲרִ֥ית אִיּ֖וֹב מֵ/רֵאשִׁת֑/וֹ וַֽ/יְהִי ל֡/וֹ אַרְבָּעָה֩ עָשָׂ֨ר אֶ֜לֶף צֹ֗אן וְ/שֵׁ֤שֶׁת אֲלָפִים֙ גְּמַלִּ֔ים וְ/אֶֽלֶף צֶ֥מֶד בָּקָ֖ר וְ/אֶ֥לֶף אֲתוֹנֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/042/012.yaml
  text: And Yahweh blessed the latter part of Job more than his beginning[a]. And he had fourteen thousand sheep, six thousand camels, a thousand yoke of oxen[b], and a thousand female donkeys.
translation:
  language: hi
  text: और यहोवा ने अय्यूब के जीवन के बाद के भाग को उसके आरम्भ की अपेक्षा अधिक आशीष दी[a]। उसके पास चौदह हज़ार भेड़-बकरियाँ, छह हज़ार ऊँट, एक हज़ार जोड़ी बैल[b] और एक हज़ार गधियाँ थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक: “अय्यूब के बाद के भाग को उसके आरम्भ से अधिक।”'
    reason: मूल के संक्षिप्त कालगत और तुलनात्मक वाक्यांश को निकट रूप में दिखाना।
  - marker: b
    text: या “एक हज़ार जोड़े गोवंश,” अर्थात जुए में साथ जोते जाने वाले पशुओं की एक हज़ार जोड़ियाँ।
    reason: צֶמֶד בָּקָר में ‘जोड़ी,’ ‘जुआ’ और काम करने वाले गोवंश का संयुक्त भाव है।
lexical_decisions:
- source_word: וַיהוָה
  choice: और यहोवा ने
  rationale: व्यक्तिगत ईश्वरीय नाम יהוה को प्रचलित और स्पष्ट हिन्दी रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: בֵּרַךְ
  choice: आशीष दी
  rationale: यह क्रिया परमेश्वर की कृपा और उसके फलस्वरूप मिली समृद्धि दोनों को समेटती है; केवल ‘समृद्ध किया’ कहने से धार्मिक आशय संकुचित हो जाता।
- source_word: אַחֲרִית אִיּוֹב
  choice: अय्यूब के जीवन के बाद के भाग को
  rationale: אַחֲרִית यहाँ अय्यूब की बाद की अवस्था या जीवनकाल को सूचित करता है। ‘अन्तिम दिनों’ से केवल जीवन के बिलकुल आखिरी दिन समझे जा सकते हैं, इसलिए ‘जीवन के बाद के भाग’ अधिक स्वाभाविक और सटीक है।
- source_word: מֵרֵאשִׁתוֹ
  choice: उसके आरम्भ से भी अधिक
  rationale: מִן तुलना दर्शाता है और רֵאשִׁית अय्यूब की आरम्भिक अवस्था को; निकट स्रोतार्थ को मुख्य पाठ में रखा गया है और संभावित अर्थ फुटनोट में स्पष्ट किया गया है।
- source_word: וַיְהִי לוֹ
  choice: उसके पास ... हो गईं
  rationale: हिब्रू का अस्तित्व/अधिकार-वाचक विन्यास हिन्दी में ‘उसके पास ... हो गईं’ के रूप में स्वाभाविक है और कथा में पुनः प्राप्त संपत्ति का भाव भी व्यक्त करता है।
- source_word: אַרְבָּעָה עָשָׂר אֶלֶף צֹאן
  choice: चौदह हज़ार भेड़-बकरियाँ
  rationale: צֹאן छोटे पालतू पशुओं का सामूहिक शब्द है, जिसमें भेड़ और बकरियाँ दोनों आ सकती हैं; हिन्दी में ‘भेड़-बकरियाँ’ इसकी व्यापकता सुरक्षित रखता है।
- source_word: שֵׁשֶׁת אֲלָפִים גְּמַלִּים
  choice: छह हज़ार ऊँट
  rationale: संख्या और संज्ञा का सीधा, स्वाभाविक अनुवाद।
- source_word: אֶלֶף צֶמֶד בָּקָר
  choice: एक हज़ार जोड़ी बैल
  rationale: צֶמֶד का अर्थ जोड़ी/जुआ है और בָּקָר यहाँ खेत के काम में जोते जाने वाले गोवंश को दर्शाता है। ‘जोड़ी बैल’ संख्या तथा कृषि-संदर्भ दोनों स्पष्ट करता है।
- source_word: אֶלֶף אֲתוֹנוֹת
  choice: एक हज़ार गधियाँ
  rationale: אֲתוֹנוֹת स्पष्ट रूप से स्त्रीलिंग गधियों को दर्शाता है; ‘गधियाँ’ संक्षिप्त और सटीक आधुनिक हिन्दी है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ में उपाधि नहीं बल्कि चतुरक्षरी व्यक्तिगत नाम है। ‘यहोवा’ हिन्दी पाठकों में पहचाना जाने वाला नामरूप है और नाम को सामान्य उपाधि ‘प्रभु’ में नहीं बदलता।
- issue: अय्यूब के ‘बाद के भाग’ की आशीष
  choice: अय्यूब के जीवन के बाद के भाग को ... आशीष दी
  alternative: अय्यूब के अन्त को आशीष दी / अय्यूब के अन्तिम दिनों को आशीष दी
  rationale: वाक्य को केवल मृत्यु-पूर्व दिनों या अंतिम परिणाम तक सीमित न करके उसकी बाद की जीवन-अवस्था के रूप में रखा गया है; इससे मूल की अर्थ-सीमा बनी रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। ‘आशीष दी,’ ‘जीवन के बाद के भाग’ और ‘जोड़ी बैल’ जैसे रूप मूलार्थ के निकट रहते हुए साधारण पाठक के लिए स्पष्ट हैं।
