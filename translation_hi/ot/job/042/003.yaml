  text: מִ֤י זֶ֨ה מַעְלִ֥ים עֵצָ֗ה בְּֽלִ֫י דָ֥עַת לָ/כֵ֣ן הִ֭גַּדְתִּי וְ/לֹ֣א אָבִ֑ין נִפְלָא֥וֹת מִ֝מֶּ֗/נִּי וְ/לֹ֣א אֵדָֽע׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/042/003.yaml
  text: ‘Who is this who hides counsel without knowledge?’ Therefore I have spoken, but I did not understand—things too wonderful for me[b][a], which I did not know.
translation:
  language: hi
  text: “यह कौन है जो बिना ज्ञान के परामर्श को छिपाता है?[b]” इसलिए मैंने कहा, पर मैं नहीं समझा—ऐसी अद्भुत बातें जो मेरी समझ से परे थीं[a], और जिन्हें मैं नहीं जानता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे लिए बहुत अद्भुत बातें,” अथवा “मेरी समझ से परे बातें।”
    reason: lexical_alternative
  - marker: b
    text: या, अधिक पारंपरिक रूप में, “यह कौन है जो बिना ज्ञान के परामर्श को अंधकारमय करता है?” यहाँ का इब्रानी क्रियापद अय्यूब 38:2 में आए क्रियापद से भिन्न है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי זֶה
  choice: यह कौन है
  rationale: सीधे प्रश्न की शक्ति बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: מַעְלִים
  choice: छिपाता है
  rationale: हिफ़ील रूप का मूल अर्थ ‘छिपाना/गुप्त करना’ है; इसे अय्यूब 38:2 के भिन्न शब्द के अनुसार ‘अंधकारमय करता है’ बनाकर समरूप नहीं किया गया।
- source_word: עֵצָה
  choice: युक्ति
  rationale: यहाँ दैवी परामर्श, योजना और बुद्धिमत्तापूर्ण उद्देश्य की अर्थ-छाया रखता है; ‘युक्ति’ संक्षिप्त और प्रतिष्ठित हिन्दी है।
- source_word: בְּלִי דָעַת
  choice: बिना ज्ञान के
  rationale: इब्रानी पदबंध का निकट और स्पष्ट अनुवाद है।
- source_word: לָכֵן
  choice: इसलिए
  rationale: प्रश्न और अय्यूब की स्वीकारोक्ति के बीच निष्कर्षात्मक संबंध व्यक्त करता है।
- source_word: הִגַּדְתִּי וְלֹא אָבִין
  choice: मैंने ऐसी बातें कहीं जिन्हें मैं समझता नहीं था
  rationale: הִגִּיד को सन्दर्भानुसार ‘कहीं’ और अगले खंड को स्वाभाविक हिन्दी में सम्बद्ध वाक्य के रूप में व्यक्त करता है; अपूर्ण क्रिया के वर्तमान-जैसे आत्मस्वीकार को भी सुरक्षित रखता है।
- source_word: נִפְלָאוֹת מִמֶּנִּי
  choice: ऐसी अद्भुत बातें जो मेरी समझ से परे थीं
  rationale: נִפְלָאוֹת की विस्मयकारी और मानवीय क्षमता से परे होने की दोनों अर्थ-छायाएँ व्यक्त होती हैं।
- source_word: וְלֹא אֵדָע
  choice: और जिन्हें मैं जानता नहीं था
  rationale: अंतिम खंड को पूर्ववर्ती ‘बातें’ से स्वाभाविक रूप से जोड़ते हुए अय्यूब की अज्ञानता स्पष्ट करता है।
theological_decisions:
- issue: अय्यूब 42:3 का अय्यूब 38:2 से संबंध
  choice: 42:3 में उपस्थित עלם के अनुसार ‘युक्ति को छिपाता है’
  alternative: ‘युक्ति को अंधकारमय करता है’
  rationale: अय्यूब पहले के दैवी प्रश्न को दोहराता या रूपांतरित करता प्रतीत होता है, पर 42:3 का इब्रानी क्रियापद 38:2 से अलग है। इसलिए मूल पाठ की भिन्नता को बनाए रखा गया है।
- issue: अय्यूब की स्वीकारोक्ति में काल और संबंध
  choice: ‘मैंने ऐसी बातें कहीं जिन्हें मैं समझता नहीं था’
  alternative: ‘मैंने कहा, पर मैं समझा नहीं’
  rationale: इब्रानी में पहले व्यक्ति की पूर्ण क्रिया के बाद अपूर्ण क्रिया है। हिन्दी में सम्बद्ध उपवाक्य कथन की विषयवस्तु और अज्ञान के संबंध को स्वाभाविक ढंग से रखता है, बिना अय्यूब की स्वीकारोक्ति को किसी विशेष सिद्धान्त की ओर मोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और सामान्य पाठक के लिए सुबोध शैली। उद्धृत प्रश्न की औपचारिकता के लिए ‘युक्ति’ रखा गया है। सभी पादटिप्पणी चिह्न मुख्य पाठ में सम्मिलित हैं।
