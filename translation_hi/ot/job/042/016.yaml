base_translation:
  language: en
  yaml_path: translation/ot/job/042/016.yaml
  text: After this[a], Job lived one hundred and forty years, and saw his sons and his grandsons, four generations.
translation:
  language: hi
  text: इसके बाद[a] अय्यूब एक सौ चालीस वर्ष जीवित रहा और उसने अपने बेटों और अपने बेटों के बेटों को—चार पीढ़ियों तक—देखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इसे अधिक मुहावरेदार ढंग से यों भी कहा जा सकता है: “इसके बाद अय्यूब एक सौ चालीस वर्ष और जीवित रहा और उसने अपने बेटों और पोतों को चार पीढ़ियों तक देखा।” इब्रानी में अधिक शाब्दिक रूप से “अपने बेटों और अपने बेटों के बेटों” है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחִי
  choice: जीवित रहा
  rationale: यहाँ חיה की कथात्मक क्रिया पूर्व घटनाओं के बाद अय्यूब के आगे जीवित रहने को बताती है; ‘जीवित रहा’ सीधा और स्वाभाविक है।
- source_word: אַחֲרֵי זֹאת
  choice: इसके बाद
  rationale: यह पदबंध पिछली घटनाओं के बाद के समय को सूचित करता है; ‘इसके बाद’ संक्षिप्त और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: מֵאָה וְאַרְבָּעִים שָׁנָה
  choice: एक सौ चालीस वर्ष
  rationale: यह मूल संख्या का स्पष्ट और औपचारिक रूप से सटीक अनुवाद है।
- source_word: וַיַּרְא
  choice: देखा
  rationale: ראה का प्रत्यक्ष अर्थ ‘देखा’ है। ‘देखने तक जीवित रहा’ निहित भाव को स्पष्ट करता, पर मुख्य पाठ मूल की संक्षिप्त अभिव्यक्ति बनाए रखता है।
- source_word: בָּנָיו
  choice: अपने बेटों
  rationale: इब्रानी में स्पष्ट रूप से पुल्लिंग बहुवचन ‘बेटे’ है; इसलिए उसे सामान्य ‘संतान’ में नहीं बदला गया।
- source_word: בְּנֵי בָנָיו
  choice: अपने बेटों के बेटों
  rationale: यह इब्रानी संरचना का निकट अनुवाद है और पुरुष-संदर्भ को बनाए रखता है; अधिक मुहावरेदार ‘पोते’ सम्भव है, पर वह संरचना को संक्षिप्त कर देता है।
- source_word: אַרְבָּעָה דֹּרוֹת
  choice: चार पीढ़ियों तक
  rationale: संदर्भ में यह अय्यूब द्वारा देखी गई वंश-परंपरा की सीमा बताता है; ‘तक’ हिन्दी में उस संबंध को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: ‘चार पीढ़ियों’ का वाक्यगत संबंध
  choice: इसे अय्यूब द्वारा देखे गए वंश-विस्तार की सीमा के रूप में ‘चार पीढ़ियों तक’ रखा गया।
  alternative: अलग समानाधिकरण पद के रूप में ‘चार पीढ़ियाँ’
  rationale: इब्रानी संक्षिप्त है और संबंध को पूरी तरह स्पष्ट नहीं करता; हिन्दी में ‘तक’ सबसे स्वाभाविक है, पर इससे कोई अतिरिक्त धर्मवैचारिक निष्कर्ष नहीं निकाला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘अय्यूब’ प्रचलित हिन्दी बाइबलीय नाम है। मुख्य पाठ में मूल की पुरुष-सूचक और वंशपरक शब्दावली सुरक्षित रखी गई है, जबकि पादटिप्पणी अधिक मुहावरेदार विकल्प देती है।
