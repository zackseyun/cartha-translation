base_translation:
  language: en
  yaml_path: translation/ot/job/042/008.yaml
  text: Take for yourselves seven bulls and seven rams[a], and go to my servant Job, and offer up a burnt offering for yourselves. And my servant Job will pray for you, for I will accept him, so that I may not deal with you disgracefully. For you have not spoken rightly about me[c][b], as my servant Job has.
translation:
  language: hi
  text: अब अपने लिए सात बैल और सात मेढ़े लो और मेरे सेवक अय्यूब के पास जाओ। अपने लिए होमबलि चढ़ाओ, और मेरा सेवक अय्यूब तुम्हारे लिए प्रार्थना करेगा। क्योंकि मैं उसी को स्वीकार करूँगा,[a] इसलिए मैं तुम्हारे साथ अपमानजनक व्यवहार नहीं करूँगा।[b] क्योंकि तुमने मेरे विषय में ठीक बात नहीं कही,[c] जैसी मेरे सेवक अय्यूब ने कही है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “क्योंकि केवल उसी का मुख मैं उठाऊँगा।” यह इब्रानी मुहावरा किसी को स्वीकार करने या उस पर कृपा दिखाने का अर्थ देता है।
    reason: lexical_alternative
  - marker: b
    text: या, “ताकि मैं तुम्हारे साथ तुम्हारी मूर्खता के अनुसार व्यवहार न करूँ।” इब्रानी संज्ञा मूर्खता, घोर निंदनीयता, या अपमानजनक काम का बोध करा सकती है।
    reason: lexical_alternative
  - marker: c
    text: या, “तुमने मुझसे ठीक बात नहीं कही।” इब्रानी में “मुझसे” है, पर प्रसंग के अनुसार इसका आशय “मेरे विषय में” भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: इसलिए अब
  rationale: וְ के प्रसंगगत निष्कर्षात्मक बल और עַתָּה के स्पष्ट कालवाचक अर्थ ‘अब’—दोनों को व्यक्त करता है।
- source_word: קְחוּ לָכֶם
  choice: अपने लिए ... लो
  rationale: आज्ञा के साथ प्रयुक्त हितवाचक सर्वनाम को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: שִׁבְעָה פָרִים וְשִׁבְעָה אֵילִים
  choice: सात बैल और सात मेढ़े
  rationale: पशुओं के नर होने का स्पष्ट और सामान्य हिन्दी रूप; ‘जवान’ का भाव मूल में अनिवार्य नहीं है।
- source_word: עַבְדִּי אִיּוֹב
  choice: मेरे सेवक अय्यूब
  rationale: यहाँ עֶבֶד परमेश्वर के प्रति निष्ठावान सेवा का सम्मानसूचक पद है; ‘दास’ की तुलना में ‘सेवक’ प्रसंगानुकूल है।
- source_word: וְהַעֲלִיתֶם עוֹלָה
  choice: होमबलि चढ़ाओ
  rationale: यह मानक बलिदानी अभिव्यक्ति है, जिसमें पूरी तरह जलाए जाने वाले बलिदान का संकेत है।
- source_word: בַּעַדְכֶם
  choice: अपने लिए
  rationale: बलिदान के लाभार्थी अथवा प्रतिनिधिक संबंध को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יִתְפַּלֵּל עֲלֵיכֶם
  choice: तुम्हारे लिए प्रार्थना करेगा
  rationale: प्रार्थना के मध्यस्थतापूर्ण अर्थ को बिना अतिरिक्त धर्मशास्त्रीय शब्दावली के स्पष्ट करता है।
- source_word: כִּי אִם פָּנָיו אֶשָּׂא
  choice: मैं उसी को स्वीकार करूँगा
  rationale: ‘उसका मुख उठाना’ स्वीकार करने या कृपा दिखाने का इब्रानी मुहावरा है; ‘उसी’ כִּי אִם के सीमितकारी बल को दर्शाता है।
- source_word: לְבִלְתִּי עֲשׂוֹת עִמָּכֶם נְבָלָה
  choice: ताकि मैं तुम्हारे साथ तुम्हारी मूर्खता के अनुसार व्यवहार न करूँ
  rationale: נְבָלָה की मूर्खता और निंदनीयता—दोनों से जुड़े न्यायिक आशय को व्यक्त करता है और परमेश्वर को स्वयं निंदनीय कार्य करने वाला बताने की भ्रामक संभावना से बचता है; वैकल्पिक संरचना पादटिप्पणी में दी गई है।
- source_word: לֹא דִבַּרְתֶּם אֵלַי נְכוֹנָה
  choice: तुमने मेरे विषय में ठीक बात नहीं कही
  rationale: अय्यूब के मित्रों द्वारा परमेश्वर के विषय में कही गई बातों के प्रसंग को स्वाभाविक हिन्दी में व्यक्त करता है; אֵלַי का अधिक प्रत्यक्ष ‘मुझसे’ पाठ पादटिप्पणी में सुरक्षित है।
- source_word: כְּעַבְדִּי אִיּוֹב
  choice: जैसी मेरे सेवक अय्यूब ने कही है
  rationale: इब्रानी की संक्षिप्त तुलना को हिन्दी में पूर्ण और स्पष्ट वाक्य बनाता है।
theological_decisions:
- issue: अय्यूब की मध्यस्थता और परमेश्वर द्वारा उसे स्वीकार करना
  choice: परमेश्वर अय्यूब को स्वीकार करता है और उसकी प्रार्थना मित्रों पर दंड टलने का निर्दिष्ट माध्यम है।
  alternative: यह केवल अय्यूब पर व्यक्तिगत कृपा दिखाने की बात है, उसकी मध्यस्थता पर बल नहीं।
  rationale: बलिदान की आज्ञा, अय्यूब की प्रार्थना और ‘उसका मुख उठाने’ की अभिव्यक्ति का क्रम अय्यूब की मध्यस्थ भूमिका दिखाता है; अनुवाद इससे आगे कोई बाद की याजकीय या प्रायश्चित्त-संबंधी धारणा नहीं जोड़ता।
- issue: נְבָלָה के कारण परमेश्वर के भावी व्यवहार का स्वरूप
  choice: परमेश्वर मित्रों के साथ उनकी दोषपूर्ण मूर्खता के अनुरूप व्यवहार नहीं करेगा।
  alternative: परमेश्वर उनके साथ ‘कोई अपमानजनक काम’ नहीं करेगा।
  rationale: संज्ञा मूर्खता, निंदनीयता या घोर अनुचित काम का बोध करा सकती है। मुख्य पाठ न्यायिक अर्थ चुनता है, जबकि व्याकरणतः संभव वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- issue: אֵלַי का संबंध
  choice: ‘मेरे विषय में’ को मुख्य पाठ में रखा गया है।
  alternative: ‘मुझसे’—परमेश्वर को संबोधित करके कही गई बात।
  rationale: पूर्ववर्ती वाद-विवाद परमेश्वर के चरित्र और शासन के विषय में है, इसलिए प्रसंग ‘मेरे विषय में’ का समर्थन करता है; फिर भी इब्रानी पूर्वसर्ग का सीधा अर्थ ‘मुझसे/मेरी ओर’ हो सकता है, अतः अस्पष्टता पादटिप्पणी में संरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज शैली रखी गई है। ‘होमबलि’ बाइबलीय बलिदानी पद के रूप में संक्षिप्त और परिचित है। मूल के स्पष्ट וְעַתָּה को ‘इसलिए अब’ से व्यक्त किया गया है। सभी वास्तविक अर्थगत विकल्प मुख्य पाठ को बोझिल किए बिना पादटिप्पणियों में सुरक्षित हैं।
