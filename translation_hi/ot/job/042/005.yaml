  text: I had heard of you by the hearing of the ear[a], but now my eye has seen you.
translation:
  language: hi
  text: मैंने तेरे विषय में कानों से सुना था[a], पर अब मेरी आँख ने तुझे देखा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘कान के सुनने से’; अथवा, ‘सुनी-सुनाई बातों से।’
    reason: lexical_alternative
lexical_decisions:
- source_word: לְשֵׁמַע אֹזֶן
  choice: केवल कानों से
  rationale: इब्रानी पदबंध का शाब्दिक रूप ‘कान के सुनने से’ है और इसका भाव सुनी-सुनाई जानकारी से है। मुख्य पाठ में स्वाभाविक हिन्दी रखते हुए ‘केवल’ पूर्व के परोक्ष ज्ञान और अब के प्रत्यक्ष अनुभव का विरोध स्पष्ट करता है; शाब्दिक अभिव्यक्ति पादटिप्पणी में सुरक्षित है।
- source_word: שְׁמַעְתִּיךָ
  choice: मैंने तेरे विषय में ... सुना था
  rationale: क्रिया और द्वितीय पुरुष एकवचन प्रत्यय का शाब्दिक अर्थ ‘मैंने तुझे सुना था’ हो सकता है, पर सन्दर्भ में अय्यूब परमेश्वर के विषय में मिली जानकारी की बात करता है। ‘सुना था’ अब के अनुभव से पहले की अवस्था को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְעַתָּה
  choice: परन्तु अब
  rationale: वाव यहाँ पहले के परोक्ष सुनने और वर्तमान देखने के बीच प्रबल विरोध दिखाता है; इसलिए साधारण ‘और अब’ की अपेक्षा ‘परन्तु अब’ उपयुक्त है।
- source_word: עֵינִי
  choice: मेरी आँख
  rationale: इब्रानी संज्ञा एकवचन है। हिन्दी में भी एकवचन काव्यात्मक और बोधगम्य है तथा मूल की व्यक्तिगत तात्कालिकता बनाए रखता है।
- source_word: רָאָתְךָ
  choice: ने तुझे देख लिया है
  rationale: पूर्ण क्रिया सम्पन्न घटना और उसके वर्तमान परिणाम को व्यक्त करती है। ‘देख लिया है’ इस पूर्णता को स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: अय्यूब द्वारा परमेश्वर को ‘देखने’ का स्वरूप
  choice: ‘मेरी आँख ने तुझे देख लिया है’ को बिना किसी व्याख्यात्मक विशेषण के रखा गया है।
  alternative: ‘मैंने तुझे पहचान लिया है’ या ‘मैंने तेरा प्रत्यक्ष अनुभव किया है’
  rationale: इब्रानी क्रिया सामान्यतः ‘देखना’ है। इसे केवल रूपकात्मक अनुभूति या परमेश्वर के पूर्ण दृश्य दर्शन के रूप में निश्चित करना पद की वास्तविक अस्पष्टता और धर्मवैचारिक तनाव को समाप्त कर देता; इसलिए मूल कथन को सीधा रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज काव्यात्मक शैली अपनाई गई है। परमेश्वर के लिए निकट और एकवचन सम्बोधन ‘तेरे/तुझे’ रखा गया है, जो मूल के द्वितीय पुरुष एकवचन और अय्यूब के सीधे सम्बोधन को दर्शाता है।
