lexical_decisions:
- source_word: וַיְהִי לוֹ
  choice: उसके … हुईं
  rationale: इब्रानी अस्तित्व-सूचक और संबंधवाचक मुहावरा यहाँ संतान होने का अर्थ देता है। हिंदी में ‘उसके … हुईं’ इसे स्वाभाविक रूप से व्यक्त करता है; संयुक्त कर्ता में निकटतम स्त्रीलिंग बहुवचन ‘बेटियाँ’ के अनुसार ‘हुईं’ रखा गया है।
- source_word: שִׁבְעָנָה בָנִים
  choice: सात बेटे
  rationale: संख्या और पुरुष संतान के स्पष्ट अर्थ को आधुनिक, सहज हिंदी में यथावत रखा गया है।
- source_word: וְשָׁלוֹשׁ בָּנוֹת
  choice: और तीन बेटियाँ
  rationale: संयोजक, संख्या और स्त्री संतान के स्पष्ट अर्थ को सीधे और स्वाभाविक ढंग से प्रस्तुत किया गया है।
- source_word: וַ־
  choice: भी
  rationale: वाव कथा की पिछली बात से निरंतरता जोड़ता है। इस प्रसंग में ‘भी’ अय्यूब की पुनःस्थापित आशीषों की श्रृंखला को सहज हिंदी में व्यक्त करता है।
