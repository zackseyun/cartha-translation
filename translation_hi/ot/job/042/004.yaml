  rationale: שְׁמַע एकवचन पुल्लिंग आज्ञार्थक है और נָא विनम्र अनुरोध का भाव देता है। ‘कृपया सुन’ आधुनिक हिंदी में सीधा और स्वाभाविक है।
- source_word: וְאָנֹכִי אֲדַבֵּר
  choice: और मैं बोलूँगा
  rationale: स्वतंत्र सर्वनाम אָנֹכִי के बल को ‘मैं’ से बनाए रखते हुए अपूर्ण क्रिया को प्रसंगानुसार भावी संकल्प के रूप में व्यक्त किया गया है।
- source_word: אֶשְׁאָלְךָ
  choice: मैं तुझसे पूछूँगा
  rationale: שאל का मूल अर्थ ‘पूछना’ है और द्वितीय पुरुष एकवचन प्रत्यय को ‘तुझसे’ से स्पष्ट किया गया है।
- source_word: וְהוֹדִיעֵנִי
  choice: और तू मुझे समझा दे
  rationale: ידע के हिफ़ील रूप का शाब्दिक भाव ‘मुझे जानने योग्य बना/मुझे ज्ञात करा’ है। ‘समझा दे’ हिंदी में इस कारक भाव को स्वाभाविक ढंग से व्यक्त करता है, बिना इसे केवल ‘उत्तर दे’ तक सीमित किए।
theological_decisions:
- issue: अय्यूब 38:3 और 40:7 में यहोवा की पहले कही चुनौती से संबंध
  choice: पद को बिना जोड़े हुए परिचय के सीधे कथन के रूप में रखा गया और प्रतिध्वनि को पादटिप्पणी में बताया गया।
  alternative: मुख्य पाठ में ‘तूने कहा था’ जोड़ना या स्पष्ट उद्धरण-चिह्न लगाना।
  rationale: हिब्रू में ऐसा परिचय नहीं है। निकट प्रसंग में अय्यूब यहोवा के शब्दों को लगभग ज्यों का त्यों दोहराता है; व्याख्यात्मक शब्द जोड़ना पाठ की वास्तविक संक्षिप्तता और संभावित उद्धरणात्मक तनाव को घटा देता।
