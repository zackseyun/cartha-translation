  register: भाषा आधुनिक, गरिमापूर्ण और सीधी रखी गई है। परमेश्वर के लिए एकवचन निकट संबोधन ‘तू’ बाइबिलीय हिंदी की गंभीरता और हिब्रू के 2ms रूप को दर्शाता है; यह अनादर का संकेत नहीं है। अर्धविराम से दोनों समानांतर खंड स्पष्ट किए गए हैं।
