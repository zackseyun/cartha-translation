  text: तब अय्यूब ने याहवे को उत्तर दिया और कहा:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: ‘YHWH’ (יהוה); पारंपरिक रूप से ‘प्रभु’। वैकल्पिक रूपों में ‘यहोवा’ भी प्रचलित है।'
    reason: ईश-नाम के इब्रानी रूप, पारंपरिक प्रतिस्थापन और वैकल्पिक हिन्दी लिप्यंतरण को बताना।
lexical_decisions:
- source_word: וַיַּעַן
  choice: उत्तर दिया
  rationale: ענה का यह कथात्मक प्रयोग संवाद में उत्तर देने को दर्शाता है। प्रश्न तुरंत पहले न होने पर भी ‘उत्तर दिया’ इब्रानी सूत्र और अय्यूब की प्रतिक्रिया—दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אִיּוֹב
  choice: अय्यूब
  rationale: इब्रानी व्यक्तिगत नाम אִיּוֹב का हिन्दी बाइबलीय परंपरा में प्रचलित रूप।
- source_word: אֶת
  choice: '[अलग से अनूदित नहीं]'
  rationale: यह निश्चित प्रत्यक्ष कर्म का व्याकरणिक चिह्न है; हिन्दी में इसके लिए अलग शब्द आवश्यक नहीं है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी पाठकों के बीच प्रचलित रूप ‘यहोवा’ इब्रानी चतुरक्षरीय ईश-नाम को शीर्षक से बदलने के बजाय व्यक्तिगत नाम के रूप में प्रस्तुत करता है; वैकल्पिक उच्चारण ‘याहवे’ पादटिप्पणी में दिया गया है।
- source_word: וַיֹּאמַר
  choice: कहा
  rationale: मानक इब्रानी कथात्मक वाणी-सूत्र का स्वाभाविक हिन्दी रूप। ‘उत्तर दिया:’ के बाद कही गई बात आरम्भ होने के कारण हिन्दी में अलग से ‘और कहा’ जोड़ना अनावश्यक और बोझिल होता।
- source_word: וַ
  choice: तब
  rationale: आरम्भिक वाव-कन्सेक्यूटिव कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में क्रम को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: ईश-नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; पारंपरिक रूप से ‘प्रभु’
  rationale: मूल पाठ में उपाधि नहीं, चतुरक्षरीय व्यक्तिगत नाम है। मुख्य पाठ में हिन्दी में व्यापक रूप से पहचाना जाने वाला ‘यहोवा’ रखा गया है और उच्चारण-संबंधी अनिश्चितता तथा पारंपरिक प्रतिस्थापन को पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक, सरल और गरिमापूर्ण हिन्दी। ‘उत्तर दिया’ मूल के औपचारिक संवाद-सूत्र को बनाए रखता है, जबकि वाक्य के अंत में कोलन आगामी प्रत्यक्ष कथन का संकेत देता है।
