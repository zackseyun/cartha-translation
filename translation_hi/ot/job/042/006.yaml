  text: עַל כֵּ֭ן אֶמְאַ֣ס וְ/נִחַ֑מְתִּי עַל עָפָ֥ר וָ/אֵֽפֶר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/042/006.yaml
  text: Therefore I despise myself[a], and I repent in dust and ashes.
translation:
  language: hi
  text: इसलिए मैं अपने आप से घृणा करता हूँ[a], और धूल और राख में पश्चाताप करता हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इसलिए मैं अपनी बात वापस लेता हूँ और धूल और राख के विषय में अपना मन बदलता हूँ।” इब्रानी वाक्य बहुत संक्षिप्त है और उसका अर्थ विवादित है—विशेषकर “घृणा करता/ठुकराता हूँ” का कर्म व्यक्त नहीं है, और अगली क्रिया का अर्थ “पश्चाताप करना,” “मन बदलना,” “ढाढ़स पाना” या “सांत्वना पाना” हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: עַל כֵּן
  choice: इसलिए
  rationale: यह पद 5 में कही गई बात और परमेश्वर के वचनों से निकले अय्यूब के निष्कर्ष को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֶמְאַס
  choice: मैं अपने आपको तुच्छ समझता हूँ
  rationale: मूल क्रिया का अर्थ ‘ठुकराना/तुच्छ जानना’ है, पर उसका कर्म व्यक्त नहीं है। सन्दर्भ में ‘अपने आपको’ जोड़ना अय्यूब के दीन होने का सम्भावित अर्थ स्पष्ट करता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: וְנִחַמְתִּי
  choice: और ... पश्चाताप करता हूँ
  rationale: निफ़अल रूप सन्दर्भ के अनुसार पछताना, मन बदलना, शान्त होना या सांत्वना पाना दर्शा सकता है। यहाँ परमेश्वर से हुई भेंट के प्रत्युत्तर में ‘पश्चाताप करता हूँ’ मुख्य पाठ के लिए स्वाभाविक है, पर शब्द की बहुअर्थकता पादटिप्पणी में सुरक्षित है।
- source_word: עַל
  choice: में
  rationale: धूल और राख के साथ यह अय्यूब की दीनता अथवा शोक की दशा को सहज आधुनिक हिन्दी में व्यक्त करता है; ‘के विषय में’ भी व्याकरणतः सम्भव है।
- source_word: עָפָר וָאֵפֶר
  choice: धूल और राख
  rationale: यह स्थापित युग्म नश्वरता, दीनता और शोक का भाव रखता है तथा हिन्दी में सहज और गरिमापूर्ण है।
theological_decisions:
- issue: 'अय्यूब की अन्तिम प्रतिक्रिया: आत्म-दीनता और पश्चाताप, अथवा अपने कथन का प्रत्याहार'
  choice: अय्यूब अपने आपको तुच्छ समझकर धूल और राख में पश्चाताप करता है।
  alternative: अय्यूब अपनी बात वापस लेता है और धूल और राख के विषय में अपना मन बदलता/शान्त होता है।
  rationale: 'इब्रानी अत्यन्त संक्षिप्त है: אֶמְאַס का कर्म नहीं दिया गया और נִחַמְתִּי के अनेक सम्भव अर्थ हैं। पद 5 का सन्दर्भ आत्म-दीनता और पश्चाताप का समर्थन करता है, पर वैकल्पिक पाठ वास्तविक है; इसलिए उसे पादटिप्पणी में रखा गया है।'
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट। मुख्य पाठ प्रचलित पश्चातापात्मक अर्थ देता है, जबकि मूल की वास्तविक अस्पष्टता पादटिप्पणी में खुलकर सुरक्षित रखी गई है।
