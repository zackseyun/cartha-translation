base_translation:
  language: en
  yaml_path: translation/ot/job/042/010.yaml
  text: And Yahweh restored Job’s fortunes when he prayed for his friends[c][b][a], and Yahweh gave Job twice as much as he had before.
translation:
  language: hi
  text: और जब अय्यूब ने अपने मित्रों के लिए प्रार्थना की, तब यहोवा ने अय्यूब की दशा बहाल कर दी[a]; और अय्यूब के पास जो कुछ था, यहोवा ने उसे दुगुना कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अय्यूब की बंधुआई लौटा दी”; यह हिब्रू मुहावरा किसी व्यक्ति की दशा या भाग्य को फिर से बहाल करने का अर्थ भी देता है, और यहाँ वास्तविक बंधुआई आवश्यक नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के व्यक्तिगत नाम का प्रचलित और पहचाना जाने वाला रूप; मूल पाठ के नाम को सामान्य उपाधि से नहीं बदलता।
- source_word: שָׁב אֶת שבית אִיּוֹב
  choice: अय्यूब की दशा फिर से बहाल कर दी
  rationale: यह हिब्रू मुहावरा परिस्थिति या समृद्धि की पुनर्बहाली बताता है; इस प्रसंग में शाब्दिक बंधुआई से छुड़ाना आवश्यक अर्थ नहीं है।
- source_word: בְּהִתְפַּלְלוֹ
  choice: जब अय्यूब ने ... प्रार्थना की
  rationale: בְּ + infinitive construct को स्वाभाविक हिन्दी में कालगत परिस्थिति के रूप में व्यक्त करता है, बिना अनिवार्य कारण-संबंध जोड़े।
- source_word: בְּעַד רֵעֵהוּ
  choice: अपने मित्रों के लिए
  rationale: בְּעַד मध्यस्थता के भाव में 'के लिए/की ओर से' है; רֵעֵהוּ का एकवचन रूप यहाँ सामूहिक अर्थ में अय्यूब के मित्रों को सूचित करता है।
- source_word: וַיֹּסֶף ... לְמִשְׁנֶה
  choice: दुगुना दिया
  rationale: יסף के बढ़ाने/जोड़ने और לְמִשְׁנֶה के दुगुनेपन को सहज हिन्दी में संयुक्त रूप से व्यक्त करता है।
- source_word: אֶת כָּל אֲשֶׁר לְאִיּוֹב
  choice: वह सब जो पहले उसका था
  rationale: अय्यूब की पूर्व संपत्ति और अवस्था की ओर संकेत स्पष्ट करता है तथा प्रसंगानुकूल पूर्वकालिक अर्थ बनाए रखता है।
theological_decisions:
- issue: अय्यूब की प्रार्थना और उसकी बहाली का संबंध
  choice: '''जब ... प्रार्थना की, तब'' द्वारा कालगत संबंध'
  alternative: '''क्योंकि उसने प्रार्थना की'' द्वारा प्रत्यक्ष कारण-संबंध'
  rationale: हिब्रू בְּ + infinitive construct समय या परिस्थिति दिखा सकता है। पाठ दोनों घटनाओं को जोड़ता है, पर यांत्रिक प्रतिफल का अधिक प्रबल दावा आवश्यक नहीं करता।
- issue: अय्यूब की बहाली का स्वरूप
  choice: उसकी दशा की बहाली
  alternative: उसकी बंधुआई से वापसी
  rationale: इस प्रसंग में मुहावरा अय्यूब की समूची परिस्थिति के पलटने को दर्शाता है; वास्तविक निर्वासन या कैद मानना अनावश्यक है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण शैली। 'अय्यूब' और 'यहोवा' जैसे स्थापित बाइबलीय रूप रखे गए हैं। वाक्य की कालगत संरचना मूल की अस्पष्टता बनाए रखती है और कारण-संबंध को अनावश्यक रूप से प्रबल नहीं करती।
