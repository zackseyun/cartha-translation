lexical_decisions:
- source_word: ידעת
  choice: मैं जानता हूँ
  rationale: यह ידע का काल पूर्ण 2ms रूप है और अय्यूब परमेश्वर को संबोधित कर रहा है। वर्तमान स्थिति की स्वीकारोक्ति के रूप में आधुनिक हिन्दी में ‘मैं जानता हूँ’ स्वाभाविक है।
- source_word: כִּי
  choice: कि
  rationale: यह अय्यूब के कथन की विषयवस्तु प्रस्तुत करता है; हिन्दी में ‘कि’ स्वाभाविक पूरक-संयोजक है।
- source_word: כֹל תּוּכָל
  choice: आप सब कुछ कर सकते हैं
  rationale: יכל सामर्थ्य या सक्षम होने को व्यक्त करता है और כֹל उसकी व्यापकता बताता है। यह हिन्दी रूप मूल के सर्वसमावेशी भाव को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְלֹא יִבָּצֵר
  choice: और ... विफल नहीं की जा सकती
  rationale: בצר का निफ़अल रूप מן के साथ रोके, बाधित या निष्फल किए जाने का भाव दे सकता है। ‘योजना’ के संदर्भ में ‘विफल नहीं की जा सकती’ मुहावरेदार और संदर्भानुकूल है।
- source_word: מִמְּךָ
  choice: आपकी
  rationale: शाब्दिक ‘आपसे’ की अपेक्षा हिन्दी में संबंधसूचक ‘आपकी’ योजना का परमेश्वर से संबंध स्वाभाविक रूप से प्रकट करता है।
- source_word: מְזִמָּה
  choice: योजना
  rationale: संज्ञा का अर्थ योजना, अभिप्राय या युक्ति हो सकता है। यहाँ परमेश्वर के विषय में ‘योजना’ आधुनिक हिन्दी में स्पष्ट है और अनावश्यक नकारात्मक अर्थ से बचती है।
theological_decisions:
