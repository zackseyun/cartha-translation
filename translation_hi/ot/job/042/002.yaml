  register: आधुनिक मानक हिन्दी, आदरार्थक संबोधन और सरल किंतु गरिमापूर्ण वाक्य-विन्यास अपनाया गया है। मुख्य पाठ में प्रचलित ‘योजना’ रखा गया है; पादटिप्पणी मूल की शब्दार्थगत व्यापकता सुरक्षित रखती है।
