base_translation:
  language: en
  yaml_path: translation/ot/job/042/015.yaml
  text: And nowhere in all the land were women found as beautiful as Job’s daughters[a], and their father gave them an inheritance among their brothers.
translation:
  language: hi
  text: और सारे देश[a] में अय्यूब की बेटियों जैसी सुन्दर स्त्रियाँ कहीं नहीं मिलीं। उनके पिता ने उनके भाइयों के बीच उन्हें भी विरासत दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सारी पृथ्वी पर।”
    reason: הָאָרֶץ का अर्थ प्रसंग के अनुसार ‘देश/भूमि’ अथवा ‘पृथ्वी’ हो सकता है।
lexical_decisions:
- source_word: נִמְצָא
  choice: कहीं नहीं मिलीं
  rationale: नפעל रूप यहाँ किसी के पाए जाने अथवा विद्यमान होने का भाव देता है। हिन्दी में बहुवचन कर्ता ‘स्त्रियाँ’ के अनुसार ‘मिलीं’ स्वाभाविक है।
- source_word: נָשִׁים יָפוֹת
  choice: सुन्दर स्त्रियाँ
  rationale: נָשִׁים का अर्थ यहाँ ‘स्त्रियाँ’ है और יָפוֹת का अर्थ ‘सुन्दर’; यह सामान्य, स्पष्ट और लिंग-सटीक अनुवाद है।
- source_word: כִּבְנוֹת אִיּוֹב
  choice: अय्यूब की बेटियों जैसी
  rationale: उपसर्ग כְּ तुलना प्रकट करता है; ‘जैसी’ हिन्दी में इस तुलनात्मक संरचना को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּכָל הָאָרֶץ
  choice: सारे देश में
  rationale: הָאָרֶץ का अर्थ ‘देश/भूमि’ या ‘पृथ्वी’ हो सकता है। कथात्मक प्रसंग में ‘सारा देश’ अधिक स्वाभाविक है; दूसरा सम्भव अर्थ पादटिप्पणी में रखा गया है।
- source_word: וַיִּתֵּן לָהֶם
  choice: उन्हें ... दी
  rationale: נתן तथा स्त्रीलिंग बहुवचन कर्म-सर्वनाम का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: נַחֲלָה
  choice: विरासत
  rationale: נַחֲלָה पैतृक उत्तराधिकार अथवा वंशानुगत संपत्ति को सूचित करता है; ‘विरासत’ संक्षिप्त और अर्थ-संगत है।
- source_word: בְּתוֹךְ אֲחֵיהֶם
  choice: उनके भाइयों के बीच
  rationale: בְּתוֹךְ का अर्थ ‘बीच/मध्य में’ और אֲחֵיהֶם का विशिष्ट अर्थ ‘उनके भाई’ है; इससे बेटियों को पुरुष उत्तराधिकारियों के बीच विरासत मिलने का उल्लेख सुरक्षित रहता है।
theological_decisions:
- issue: रिश्ते के लिंग-विशिष्ट शब्द का अनुवाद
  choice: उनके भाइयों के बीच
  alternative: उनके भाई-बहनों के बीच
  rationale: इब्रानी पाठ स्पष्ट रूप से पुल्लिंग बहुवचन ‘भाइयों’ कहता है; इसे लिंग-निरपेक्ष बनाना पाठ के उल्लेखनीय सामाजिक विवरण को धुंधला कर देगा।
- issue: הָאָרֶץ का भौगोलिक विस्तार
  choice: सारे देश में
  alternative: सारी पृथ्वी पर
  rationale: शब्द दोनों अर्थ दे सकता है। प्रसंग में ‘देश’ कथात्मक मुहावरे के अनुकूल है, जबकि वास्तविक शाब्दिक अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली रखी गई है। ‘सुन्दर स्त्रियाँ’ और ‘भाइयों के बीच’ मूल पाठ की लिंग-सटीक शब्दावली को बनाए रखते हैं।
