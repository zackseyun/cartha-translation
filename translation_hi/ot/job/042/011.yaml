base_translation:
  language: en
  yaml_path: translation/ot/job/042/011.yaml
  text: Then all his brothers[a], all his sisters, and all who had known him before came to him, and they ate bread with him in his house. They showed him sympathy and comforted him for all the calamity that Yahweh had brought upon him[d][c][b]. And each one gave him one qesitah and one gold ring.
translation:
  language: hi
  text: तब उसके सब भाई, उसकी सब बहनें और वे सब लोग जो उसे पहले से जानते थे, उसके पास आए। उन्होंने उसके घर में उसके साथ भोजन किया। यहोवा उस पर जो सारी विपत्ति लाई थी, उसके कारण उन्होंने उसके प्रति सहानुभूति प्रकट की और उसे सांत्वना दी। हर एक ने उसे एक कसीता[a] और सोने का एक छल्ला[b] दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “कसीता” प्राचीन काल की कोई मूल्यवान वस्तु या मुद्रा-इकाई थी; उसका ठीक मूल्य ज्ञात नहीं है।
    reason: cultural_note
  - marker: b
    text: इब्रानी शब्द नाक या कान में पहने जाने वाले छल्ले के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אֶחָיו וְכָל אֲחִיתָיו
  choice: उसके सब भाई, उसकी सब बहनें
  rationale: इब्रानी में दोनों समूहों के साथ כָּל की पुनरावृत्ति है; अलग-अलग उल्लेख उसी बल को बनाए रखता है।
- source_word: וְכָל יֹדְעָיו לְפָנִים
  choice: और वे सब लोग जो उसे पहले से जानते थे
  rationale: יֹדְעָיו उन परिचित लोगों को दर्शाता है जो उसे जानते थे, और לְפָנִים पूर्व समय का संकेत देता है। यह रूप स्वाभाविक हिंदी में दोनों अर्थ रखता है।
- source_word: וַיֹּאכְלוּ עִמּוֹ לֶחֶם
  choice: उन्होंने उसके साथ भोजन किया
  rationale: शाब्दिक अर्थ 'उसके साथ रोटी खाई' है, पर यह साथ भोजन करने का सामान्य इब्रानी मुहावरा है; हिंदी में 'भोजन किया' आशय को सहज रूप से व्यक्त करता है।
- source_word: וַיָּנֻדוּ לוֹ
  choice: उन्होंने उसके प्रति सहानुभूति जताई
  rationale: इस प्रसंग में נוד उपहास नहीं, बल्कि दुःख में सहभागी होने और संवेदना प्रकट करने की क्रिया बताता है।
- source_word: וַיְנַחֲמוּ אֹתוֹ
  choice: उसे सांत्वना दी
  rationale: नחם का प्रसंगानुकूल अर्थ दुःखी व्यक्ति को ढाढ़स या सांत्वना देना है।
- source_word: עַל כָּל הָרָעָה
  choice: उस सारी विपत्ति के कारण
  rationale: רָעָה यहाँ नैतिक बुराई के बजाय आई हुई आपदा या विपत्ति को दर्शाता है।
- source_word: אֲשֶׁר הֵבִיא יְהוָה עָלָיו
  choice: यहोवा ने उस पर जो ... डाली थी
  rationale: הביא על विपत्ति को किसी पर लाने की स्पष्ट कारक अभिव्यक्ति है; अनुवाद इसे केवल अनुमति देने के रूप में नरम नहीं करता।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम को हिंदी में प्रचलित लिप्यंतरण से प्रस्तुत किया गया है।
- source_word: קְשִׂיטָה
  choice: कसीता
  rationale: यह प्राचीन मूल्यवान वस्तु या मुद्रा-इकाई थी, जिसका सटीक आधुनिक समतुल्य अनिश्चित है; इसलिए लिप्यंतरण रखा गया है।
- source_word: נֶזֶם זָהָב
  choice: सोने की एक नथ
  rationale: נֶזֶם नाक या कान में पहना जाने वाला छल्ला हो सकता है; 'नथ' मुख्य पाठ में ठोस और स्वाभाविक है, जबकि विकल्प पाद-टिप्पणी में सुरक्षित है।
theological_decisions:
- issue: अय्यूब की विपत्ति में यहोवा की सक्रिय भूमिका
  choice: यहोवा ने उस पर जो सारी विपत्ति डाली थी
  alternative: यहोवा ने उस पर जो सारी विपत्ति आने दी थी
  rationale: इब्रानी הֵבִיא स्पष्टतः 'लाया/डाला' कहता है। 'आने दी' कहना दैवी अनुमति की व्याख्या जोड़कर मूल पाठ के धर्मवैचारिक तनाव को कम कर देता।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज किंतु गरिमापूर्ण कथात्मक रूप अपनाया गया है। इब्रानी मुहावरे 'रोटी खाना' को स्वाभाविक हिंदी 'भोजन करना' से व्यक्त किया गया है। दैवी कर्तृत्व को मूल पाठ के अनुसार स्पष्ट रखा गया है और अनिश्चित प्राचीन वस्तुओं के लिए सीमित पाद-टिप्पणियाँ दी गई हैं।
