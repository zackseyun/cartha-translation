base_translation:
  language: en
  yaml_path: translation/ot/job/042/009.yaml
  text: So Eliphaz the Temanite[a], Bildad the Shuhite, and Zophar the Naamathite went and did as Yahweh had spoken to them, and Yahweh accepted Job.
translation:
  language: hi
  text: तब तेमानी एलीपज, शूही बिल्दद और नामाती सोपर गए और उन्होंने वैसा ही किया जैसा यहोवा ने उनसे कहा था; और यहोवा ने अय्यूब को स्वीकार किया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में शाब्दिक रूप से: “यहोवा ने अय्यूब का मुख उठाया”; यह किसी पर कृपा करने या उसे स्वीकार करने का मुहावरा है।'
    reason: मूल इब्रानी मुहावरे का शाब्दिक चित्र मुख्य पाठ के अर्थपूर्ण अनुवाद के साथ सुरक्षित रखना।
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: गए
  rationale: הלך का यह कथात्मक रूप अगली कार्रवाई को सामान्य ढंग से बताता है; आधुनिक हिन्दी में ‘गए’ स्वाभाविक और पर्याप्त रूप से निकट है।
- source_word: הַתֵּימָנִי / הַשּׁוּחִי / הַנַּעֲמָתִי
  choice: तेमानी / शूही / नामाती
  rationale: ये स्थान अथवा कुल से संबंध बताने वाले विशेषण हैं; हिन्दी में लिप्यंतरित विशेषण-रूप उनके व्यक्तिवाचक स्वरूप और पठनीयता को बनाए रखते हैं।
- source_word: וַיַּעֲשׂוּ כַּאֲשֶׁר
  choice: उन्होंने वैसा ही किया जैसा
  rationale: עשה और כַּאֲשֶׁר की व्यापक इब्रानी रचना को बिना कार्रवाई का अनावश्यक विस्तार किए स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: דִּבֶּר אֲלֵיהֶם
  choice: उनसे कहा था
  rationale: यह पहले दिए गए निर्देश की ओर संकेत करता है; ‘कहा था’ हिन्दी में उस पूर्ववर्ती क्रिया को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ के चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित प्रतिलेखन ‘यहोवा’ द्वारा सुरक्षित रखा गया है।
- source_word: וַיִּשָּׂא יְהוָה אֶת פְּנֵי אִיּוֹב
  choice: यहोवा ने अय्यूब को स्वीकार किया
  rationale: ‘चेहरा उठाना’ अनुग्रहपूर्वक ग्रहण करने या स्वीकार करने का मुहावरा है। प्रसंग में ‘अय्यूब को स्वीकार किया’ इसका स्पष्ट अर्थ देता है; शाब्दिक चित्र पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम है। आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला ‘यहोवा’ नाम को उपाधि ‘प्रभु’ से बदले बिना प्रस्तुत करता है।
- issue: अय्यूब के प्रति ईश्वरीय अनुग्रह का मुहावरा
  choice: यहोवा ने अय्यूब को स्वीकार किया
  alternative: यहोवा ने अय्यूब पर कृपा की / यहोवा ने अय्यूब का मुख उठा लिया
  rationale: यह वाक्यांश अय्यूब के अनुग्रहपूर्ण ग्रहण को व्यक्त करता है, विशेषकर उसकी मध्यस्थता के प्रसंग में। ‘स्वीकार किया’ अर्थ को स्पष्ट रखता है, पर यह अतिरिक्त रूप से नहीं कहता कि मित्र किस सटीक रीति से स्वीकार किए गए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। नामों के हिन्दी में प्रचलित रूप अपनाए गए हैं। वाक्य में कथात्मक क्रम बनाए रखते हुए अर्धविराम से अंतिम, परिणामसूचक कथन को स्पष्ट किया गया है।
