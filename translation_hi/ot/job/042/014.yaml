  language: hi
  text: उसने पहली बेटी का नाम यमीमा, दूसरी का नाम कसीआ, और तीसरी का नाम केरेन-हप्पुक[a] रखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: केरेन-हप्पुक का अर्थ संभवतः ‘सुरमे का सींग’ या ‘आँखों के प्रसाधन का सींग’ है—अर्थात आँखों का प्रसाधन रखने का सींगनुमा पात्र, अथवा स्वयं वह प्रसाधन।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא שֵׁם
  choice: नाम रखा
  rationale: इब्रानी मुहावरे ‘नाम पुकारा’ का आधुनिक और स्वाभाविक हिन्दी समतुल्य ‘नाम रखा’ है। पुल्लिंग एकवचन कर्ता प्रसंगानुसार अय्यूब है, पर मूल की तरह यहाँ नाम दोहराया नहीं गया।
- source_word: הָאַחַת ... הַשֵּׁנִית ... הַשְּׁלִישִׁית
  choice: पहली बेटी ... दूसरी ... तीसरी
  rationale: गणनात्मक क्रम को सहज हिन्दी में क्रमवाचक शब्दों से व्यक्त किया गया है। ‘बेटी’ संदर्भ को स्पष्ट करता है और केवल पहली के साथ रखने पर अनावश्यक पुनरावृत्ति से बचता है।
- source_word: יְמִימָה
  choice: यमीमा
  rationale: व्यक्तिवाचक नाम को उसके इब्रानी उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: קְצִיעָה
  choice: कसीआ
  rationale: व्यक्तिवाचक नाम का इब्रानी के निकट देवनागरी लिप्यंतरण; צ को ‘स’ और अंतिम עָה को ‘आ’ से दर्शाया गया है।
- source_word: קֶרֶן הַפּוּךְ
  choice: केरेन-हप्पूक
  rationale: यौगिक व्यक्तिवाचक नाम को अनूदित करने के बजाय लिप्यंतरित किया गया है; योजक-चिह्न उसकी यौगिक संरचना बनाए रखता है। इसके संभावित शाब्दिक अर्थ को पादटिप्पणी में रखा गया है।
