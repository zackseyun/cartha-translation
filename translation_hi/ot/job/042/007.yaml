  text: וַ/יְהִ֗י אַחַ֨ר דִּבֶּ֧ר יְהוָ֛ה אֶת הַ/דְּבָרִ֥ים הָ/אֵ֖לֶּה אֶל אִיּ֑וֹב וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל אֱלִיפַ֣ז הַ/תֵּֽימָנִ֗י חָרָ֨ה אַפִּ֤/י בְ/ךָ֙ וּ/בִ/שְׁנֵ֣י רֵעֶ֔י/ךָ כִּ֠י לֹ֣א דִבַּרְתֶּ֥ם אֵלַ֛/י נְכוֹנָ֖ה כְּ/עַבְדִּ֥/י אִיּֽוֹב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/042/007.yaml
  text: And it happened[a], after Yahweh had spoken these words to Job, that Yahweh said to Eliphaz the Temanite, “My anger burns against you and against your two friends, because you have not spoken rightly of me, as my servant Job has.”
translation:
  language: hi
  text: जब यहोवा अय्यूब से ये बातें कह चुका, तब यहोवा ने तेमानी एलीपज़ से कहा, “मेरा क्रोध तेरे और तेरे दोनों मित्रों पर भड़क उठा है, क्योंकि तुम लोगों ने मेरे विषय में[a] ठीक बात नहीं कही, जैसे मेरे सेवक अय्यूब ने कही है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि तुम लोगों ने मुझसे ठीक बात नहीं कही, जैसे मेरे सेवक अय्यूब ने कही है।” इब्रानी में पूर्वसर्ग का शाब्दिक अर्थ “मुझसे” है, पर इस प्रसंग में इसका अर्थ “मेरे विषय में” भी हो सकता है।
    reason: इब्रानी אֵלַי की वास्तविक अर्थगत अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के विशिष्ट नाम को हिन्दी में प्रचलित लिप्यंतरण द्वारा सुरक्षित रखा गया है।
- source_word: וַיְהִי אַחַר
  choice: जब ... तब
  rationale: इब्रानी कथात्मक संक्रमण और कालक्रम को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; अलग से ‘और ऐसा हुआ’ जोड़ने की आवश्यकता नहीं पड़ती।
- source_word: דִּבֶּר ... אֶת־הַדְּבָרִים הָאֵלֶּה
  choice: ये बातें कह चुका
  rationale: דְּבָרִים को प्रसंगानुकूल ‘बातें’ और पूर्वसमाप्त क्रिया को ‘कह चुका’ से व्यक्त किया गया है।
- source_word: אֱלִיפַז הַתֵּימָנִי
  choice: तेमानी एलीपज़
  rationale: व्यक्तिनाम और तेमान से संबंध बताने वाले विशेषण का संक्षिप्त, स्वाभाविक हिन्दी रूप।
- source_word: חָרָה אַפִּי
  choice: मेरा क्रोध ... भड़क उठा है
  rationale: इब्रानी के जलने/भड़कने वाले सजीव मुहावरे को सहज हिन्दी में बनाए रखता है।
- source_word: בְךָ וּבִשְׁנֵי רֵעֶיךָ
  choice: तेरे और तेरे दोनों मित्रों पर
  rationale: क्रोध की दिशा बताने वाले בְּ को हिन्दी के ‘पर’ से स्पष्ट किया गया है।
- source_word: אֵלַי
  choice: मेरे विषय में
  rationale: शाब्दिक अर्थ ‘मुझसे/मेरी ओर’ संभव है, पर संवादों की विषयवस्तु के मूल्यांकन के प्रसंग में ‘मेरे विषय में’ अधिक स्वाभाविक है; वास्तविक अस्पष्टता पादटिप्पणी में रखी गई है।
- source_word: נְכוֹנָה
  choice: ठीक बात
  rationale: शब्द की सत्य, उचित और सही होने की व्यापक अर्थ-सीमा को अनावश्यक रूप से संकीर्ण नहीं करता।
- source_word: כְּעַבְדִּי אִיּוֹב
  choice: जैसे मेरे सेवक अय्यूब ने कही है
  rationale: अय्यूब के साथ तुलना और ‘मेरे सेवक’ की महत्वपूर्ण उपाधि दोनों सुरक्षित हैं; हिन्दी में पूर्ववर्ती ‘बात’ के अनुसार क्रिया पूरी की गई है।
theological_decisions:
- issue: אֵלַי का अर्थ ‘मुझसे’ है या ‘मेरे विषय में’
  choice: मेरे विषय में
  alternative: मुझसे
  rationale: मित्रों के संवादों में परमेश्वर के बारे में कही गई बातों का मूल्यांकन प्रमुख प्रतीत होता है, फिर भी इब्रानी पूर्वसर्ग का शाब्दिक अर्थ ‘मुझसे’ हो सकता है; इसलिए वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- issue: נְכוֹנָה में सहीपन का स्वरूप
  choice: ठीक बात
  alternative: सच्ची बात / उचित रीति से
  rationale: यह रूप कथन की तथ्यात्मक सत्यता, औचित्य और धर्मवैज्ञानिक सहीपन के बीच तनाव को किसी एक अर्थ तक सीमित नहीं करता।
- issue: अय्यूब के कथनों पर परमेश्वर की स्वीकृति का विस्तार
  choice: जैसे मेरे सेवक अय्यूब ने कही है
  alternative: मेरे सेवक अय्यूब के समान
  rationale: पाठ में उपस्थित तुलना को यथावत रखा गया है और यह अतिरिक्त निष्कर्ष नहीं जोड़ा गया कि अय्यूब का प्रत्येक कथन हर दृष्टि से निर्दोष था।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। प्रत्यक्ष वचन में एकवचन संबोधन ‘तेरे’ से एलीपज़ को और बहुवचन ‘तुम लोगों ने’ से उसके साथ दोनों मित्रों को संबोधित करने का भेद स्पष्ट रखा गया है।
