  text: और अय्यूब बूढ़ा और पूरी आयु जीकर मर गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: और ... मर गया
  rationale: वाव-क्रमिक क्रिया कथा की अगली घटना बताती है। हिन्दी में वाक्य के अंत में ‘मर गया’ रखना स्वाभाविक है, जबकि ‘और’ घटनाक्रम की कड़ी बनाए रखता है।
- source_word: אִיּוֹב
  choice: अय्यूब
  rationale: हिन्दी बाइबल परंपरा में प्रचलित मानक नाम-रूप।
- source_word: זָקֵן
  choice: बूढ़ा
  rationale: मूल विशेषण का सीधा और सामान्य आधुनिक हिन्दी रूप; यह आयु की अवस्था बताता है, बिना अतिरिक्त अर्थ जोड़े।
- source_word: וּשְׂבַע יָמִים
  choice: जीवन से तृप्त होकर
  rationale: शाब्दिक रूप ‘दिनों से तृप्त’ एक पूर्ण आयु पा लेने का इब्रानी मुहावरा है। ‘जीवन से तृप्त होकर’ उसके तृप्ति-बोध और पूर्ण जीवन—दोनों को सहज हिन्दी में व्यक्त करता है।
