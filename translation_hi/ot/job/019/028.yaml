  yaml_path: translation/ot/job/019/028.yaml
  text: If you say[a], ‘How shall we pursue him, since the root of the matter is found in me?’
translation:
  language: hi
  text: यदि तुम कहो[a], “हम उसका पीछा कैसे करें, क्योंकि इस मामले की जड़ मुझमें पाई जाती है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ कठिन है। व्यंजन-पाठ और प्राचीन अनुवादों को कितना महत्त्व दिया जाता है, इसके अनुसार अंतिम उपवाक्य का अर्थ “क्योंकि इस मामले की जड़ उसमें पाई जाती है” भी समझा जा सकता है। “पीछा करें” के लिए प्रयुक्त क्रिया का प्रबल अर्थ “सताएँ” भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: यदि
  rationale: यहाँ यह अय्यूब के विरोधियों की काल्पनिक बात का आरम्भ करता है; इसलिए शर्तसूचक ‘यदि’ स्वाभाविक है।
- source_word: תֹאמְרוּ
  choice: तुम कहते हो
  rationale: द्वितीय पुरुष बहुवचन अपूर्ण क्रिया को इस शर्तसूचक प्रसंग में सामान्य वर्तमान के रूप में व्यक्त किया गया है।
- source_word: מַה נִּרְדָּף לוֹ
  choice: हम उसे कैसे सताएँ
  rationale: מַה यहाँ क्रियाविशेषणात्मक ‘कैसे’ है। רדף का अर्थ पीछा करना या सताना हो सकता है; अय्यूब के विरुद्ध शत्रुतापूर्ण व्यवहार के संदर्भ में ‘सताएँ’ स्वाभाविक है और प्रबल भाव को व्यक्त करता है।
- source_word: וְשֹׁרֶשׁ דָּבָר
  choice: क्योंकि इस मामले की जड़
  rationale: वाव दूसरी उपवाक्य को कथित आधार के रूप में जोड़ता है। ‘मामले की जड़’ मूल रूपक और विवाद के अंतर्निहित कारण का भाव बनाए रखता है।
- source_word: נִמְצָא בִי
  choice: मुझमें ही पाई जाती है
  rationale: निफ़अल का निष्क्रिय/परिणामसूचक भाव ‘पाई जाती है’ से व्यक्त होता है। בִי का मसोराई पाठ सीधे ‘मुझमें’ है; ‘ही’ हिंदी में कथित दोष-स्थान पर बल को स्वाभाविक बनाता है।
theological_decisions:
- issue: अंतिम उपवाक्य में दोष या मामले की जड़ किसमें स्थित है
  choice: मुझमें
  alternative: उसमें
  rationale: WLC के स्वरांकित मसोराई पाठ בִי का सीधा अर्थ ‘मुझमें’ है। कठिनाई तथा प्राचीन साक्ष्यों के आधार पर ‘उसमें’ की सम्भावना को मुख्य पाठ में चुपचाप नहीं अपनाया गया, बल्कि पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण शैली रखी गई है। मूल का ‘जड़’ रूपक और पाठगत अस्पष्टता सुरक्षित हैं; शत्रुतापूर्ण संदर्भ के कारण मुख्य पाठ में ‘सताएँ’ चुना गया है।
