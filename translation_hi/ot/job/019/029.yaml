source:
  edition: WLC
  text: גּ֤וּרוּ לָ/כֶ֨ם מִ/פְּנֵי חֶ֗רֶב כִּֽי חֵ֭מָה עֲוֺנ֣וֹת חָ֑רֶב לְמַ֖עַן תֵּדְע֣וּ/ן ש/דין׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/019/029.yaml
  text: Be afraid of the sword yourselves[a], for wrath brings the punishments of the sword, so that you may know that there is judgment.
translation:
  language: hi
  text: 'तुम स्वयं तलवार से डरो,

    क्योंकि क्रोध तलवार के दंडों को लाता है,

    ताकि तुम जान लो कि न्याय है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कि सर्वशक्तिमान है”; अंतिम इब्रानी अभिव्यक्ति कठिन है। इसे “कि न्याय-दंड हैं” या “कि एक न्यायाधीश है” भी समझा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: גּוּרוּ לָכֶם
  choice: तुम स्वयं ... डरो
  rationale: बहुवचन आज्ञार्थक क्रिया के चेतावनी-भाव को ‘डरो’ व्यक्त करता है; לָכֶם के बलाघात को ‘स्वयं’ से स्पष्ट किया गया है।
- source_word: מִפְּנֵי חֶרֶב
  choice: तलवार से
  rationale: מִפְּנֵי यहाँ भय के कारण या सामने उपस्थित संकट को दर्शाता है; हिंदी में ‘तलवार से डरो’ स्वाभाविक और संक्षिप्त है।
- source_word: חֵמָה עֲוֺנוֹת חָרֶב
  choice: क्रोध तलवार का दंड लाता है
  rationale: इस अत्यंत संक्षिप्त इब्रानी पदबंध में חֵמָה ‘क्रोध’ और עֲוֺנוֹת अपराध के दंडात्मक परिणामों को सूचित कर सकता है। ‘लाता है’ निहित संबंध को हिंदी में बोधगम्य बनाता है, जबकि तलवार और दंड का निकट संबंध बनाए रखता है।
- source_word: לְמַעַן תֵּדְעוּן
  choice: ताकि तुम जान लो
  rationale: לְמַעַן उद्देश्य सूचित करता है; उसके बाद का अपूर्ण रूप हिंदी में ‘जान लो’ के रूप में चेतावनी के परिणाम और आग्रह दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: שדין
  choice: कि न्याय होता है
  rationale: अंतिम रूप कठिन है। संदर्भ में ‘न्याय’ का अर्थ अय्यूब की चेतावनी से अच्छी तरह जुड़ता है; ‘होता है’ न्याय की वास्तविकता व्यक्त करता है, बिना न्यायाधीश की पहचान को अनावश्यक रूप से निर्धारित किए।
theological_decisions:
- issue: कठिन अंतिम अभिव्यक्ति שדין का अर्थ
  choice: कि न्याय होता है
  alternative: कि सर्वशक्तिमान है; कि न्याय-दंड होते हैं; कि एक न्यायी है
  rationale: इब्रानी रूप पाठगत और शब्दार्थगत रूप से कठिन है। प्रसंग में अय्यूब अपने मित्रों को प्रतिशोधात्मक न्याय के प्रति सावधान करता है, इसलिए मुख्य पाठ में ‘न्याय’ सबसे उपयुक्त है। महत्वपूर्ण वैकल्पिक समझों को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण और चेतावनीपूर्ण काव्य-रजिस्टर अपनाया गया है। पंक्ति-विभाजन पद के तर्कक्रम—आज्ञा, कारण और उद्देश्य—को स्पष्ट करता है।
