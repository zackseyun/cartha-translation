  naturalness: The register is modern, dignified, and emotionally appropriate. Replacing ‘लिख लिए जाते’ with the straightforward passive ‘लिखे जाते’ removes the unintended reflexive/completive implication while retaining the longing.
  terminology: ‘अंकित किए जाते’ is a sound rendering of וְיֻחָקוּ in this poetic context. The first note should identify the ancient ‘scroll’ sense more accurately than ‘पत्रक,’ which can suggest a modern leaflet.
  issues:
