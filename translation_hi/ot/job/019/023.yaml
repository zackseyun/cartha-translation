    reason: cultural_note
  - marker: b
    text: या “उत्कीर्ण किए जाते”; यहाँ प्रयुक्त क्रिया टिकाऊ ढंग से अंकित करने का भाव देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: काश
  rationale: यह इब्रानी मुहावरा किसी देनेवाले के विषय में शाब्दिक प्रश्न नहीं, बल्कि तीव्र इच्छा व्यक्त करता है; आधुनिक हिन्दी में ‘काश’ इसका स्वाभाविक समतुल्य है।
- source_word: אֵפוֹ
  choice: अभी
  rationale: यह अव्यय इच्छा में भावात्मक तात्कालिकता और बल जोड़ता है; ‘अभी’ उस आग्रह को सहज हिन्दी में बनाए रखता है।
- source_word: וְיִכָּתְבוּן
  choice: लिख लिए जाते
  rationale: रूप कर्मवाच्य है और इच्छा-सूचक वाक्य के भीतर आता है; ‘लिख लिए जाते’ अभिलेख के रूप में सुरक्षित करने का भाव भी व्यक्त करता है।
- source_word: מִלָּי
  choice: मेरे शब्द
  rationale: बहुवचन और प्रथम पुरुष प्रत्यय का सीधा, स्वाभाविक अनुवाद है।
- source_word: בַּסֵּפֶר
  choice: किसी पुस्तक में
  rationale: סֵפֶר पुस्तक, पत्रक अथवा लिखित दस्तावेज़ का द्योतक हो सकता है। अनिश्चित इच्छा-सूचक संदर्भ में ‘किसी पुस्तक में’ स्वाभाविक है; प्राचीन माध्यम की व्यापकता पादटिप्पणी में दी गई है।
- source_word: וְיֻחָקוּ
  choice: अंकित कर दिए जाते
  rationale: חקק का अर्थ टिकाऊ ढंग से खोदना या अंकित करना है। यह चयन केवल सामान्य लेखन की पुनरुक्ति किए बिना स्थायी अभिलेखन का भाव रखता है।
