    issue: ‘लिख लिए जाते’ adds a possible reflexive/completive nuance.
    rationale: Hindi ‘लिख लेना’ often suggests writing something down for oneself or completing an action. The Hebrew passive simply expresses the wish that Job’s words be written.
  - severity: low
    issue: Footnote a uses ‘पत्रक’ for one possible sense of סֵפֶר.
    rationale: ‘पत्रक’ commonly denotes a leaflet in modern Hindi. ‘स्क्रॉल’ (with an explanatory equivalent) better represents the ancient written medium indicated by the source and English audit trail.
