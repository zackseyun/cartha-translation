  text: Know then that God has wronged me and has surrounded me with his net[a][b].
translation:
  language: hi
  text: तो जान लो कि परमेश्वर ने मेरे साथ अन्याय किया है[a] और मुझे अपने जाल[b] से घेर लिया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरे प्रति न्याय को बिगाड़ दिया है।” इब्रानी क्रिया में सही बात को टेढ़ा करने या न्याय को विकृत करने का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “उसका फंदा” अथवा “उसका शिकारी जाल।”
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּעוּ אֵפוֹ
  choice: इसलिए जान लो
  rationale: बहुवचन आज्ञार्थक क्रिया और तर्कसूचक बल देने वाले अव्यय को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אֱלוֹהַּ
  choice: परमेश्वर
  rationale: यह एकवचन ईश्वरीय पद है; मूल में ‘सर्वशक्तिमान’ जैसा अधिक विशिष्ट नाम नहीं है।
- source_word: עִוְּתָנִי
  choice: मेरे साथ अन्याय किया है
  rationale: עות में टेढ़ा करने, न्याय बिगाड़ने या किसी के साथ अन्याय करने का भाव है। यह चुनाव अय्यूब के आरोप की न्यायिक और नैतिक तीव्रता को स्पष्ट एवं स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: מְצוּדוֹ
  choice: अपने जाल
  rationale: संज्ञा शिकार के जाल या फंदे को सूचित कर सकती है; ‘जाल’ रूपक को संक्षिप्त और स्पष्ट रखता है।
- source_word: עָלַי הִקִּיף
  choice: मुझे ... से घेर लिया है
  rationale: क्रिया चारों ओर घेरने का भाव देती है; ‘से’ जाल को घेरने के साधन के रूप में स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के विरुद्ध अय्यूब का आरोप
  choice: परमेश्वर ने मेरे साथ अन्याय किया है
  alternative: परमेश्वर ने मुझे दुःख दिया है / परमेश्वर मेरे विरुद्ध हो गया है
  rationale: मूल क्रिया अन्याय या न्याय को विकृत करने का प्रबल भाव रखती है। अय्यूब के कथन को नरम करने के बजाय पाठ की धार्मिक और भावनात्मक तनावपूर्णता सुरक्षित रखी गई है; यह उसके आरोप को प्रस्तुत करता है, उसे सिद्धान्तगत सत्य घोषित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मेरे साथ अन्याय किया है’ जानबूझकर तीखा है, ताकि मूल में उपस्थित अय्यूब के आरोप को कमज़ोर न किया जाए।
