lexical_decisions:
- source_word: לְעַבְדִּי
  choice: अपने सेवक को
  rationale: עֶבֶד का अर्थ संदर्भ के अनुसार सेवक या दास हो सकता है। यहाँ घर के अधीनस्थ व्यक्ति के लिए स्वाभाविक मुख्य-पाठ विकल्प ‘सेवक’ है; ‘दास’ को पादटिप्पणी में रखा गया है।
- source_word: קָרָאתִי
  choice: मैं ... पुकारता हूँ
  rationale: पूर्ण क्रिया को विलाप की जीवंत, वर्तमान शिकायत के रूप में समझा जा सकता है। भूतकाल भी व्याकरणतः संभव है और पादटिप्पणी में दिया गया है।
- source_word: וְלֹא יַעֲנֶה
  choice: पर वह उत्तर नहीं देता
  rationale: ענה का सीधा अर्थ ‘उत्तर देना’ है। וְ को यहाँ अपेक्षित प्रतिक्रिया और वास्तविक मौन के विरोध के कारण ‘पर’ किया गया है।
- source_word: בְּמוֹ פִי
  choice: अपने ही मुँह से
  rationale: במוֹ פי व्यक्तिगत और प्रत्यक्ष विनती पर बल देता है। ‘अपने ही मुँह से’ इस जोर तथा अय्यूब के अपमानजनक अनुभव को बिना विस्तार जोड़े सुरक्षित रखता है।
- source_word: אֶתְחַנֶּן לוֹ
  choice: उससे विनती करता हूँ
  rationale: חנן के हितपएल रूप में अनुग्रह पाने के लिए गिड़गिड़ाने या विनती करने का भाव है। ‘विनती करता हूँ’ स्वाभाविक और गरिमापूर्ण है तथा हिब्रू में निहित न होने वाली ‘करना पड़ता है’ जैसी अनिवार्यता नहीं जोड़ता।
