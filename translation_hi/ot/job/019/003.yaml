  text: तुमने मुझे दस बार अपमानित किया है; मेरे साथ ऐसा व्यवहार करने में, मानो मैं पराया हूँ, तुम्हें लज्जा नहीं आती।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֶה עֶשֶׂר פְּעָמִים
  choice: यह दसवीं बार है
  rationale: हिब्रू संख्यात्मक मुहावरे को स्वाभाविक हिन्दी में रखा गया है; यह बार-बार किए गए व्यवहार पर अय्यूब के जोर को बनाए रखता है।
- source_word: תַּכְלִימוּנִי
  choice: तुमने मुझे अपमानित किया है
  rationale: כלם के हिफ़ील रूप में किसी को लज्जित या अपमानित करने का कारक भाव है; ‘अपमानित किया’ आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: לֹא תֵבֹשׁוּ
  choice: तुम्हें लज्जा नहीं आती
  rationale: בוש का आशय लज्जित होने से है; यह प्रयोग हिन्दी में नैतिक आरोप को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: תַּהְכְּרוּ לִי
  choice: मेरे साथ पराये जैसा व्यवहार करने में
  rationale: यह कठिन क्रिया נכר से जुड़ी है और यहाँ अय्यूब को पराया, अपरिचित या अलग समझकर व्यवहार करने का भाव दे सकती है। मुख्य पाठ मूल छवि को बनाए रखता है, जबकि पादटिप्पणी अन्य सम्भव अर्थ बताती है।
theological_decisions:
- issue: मित्रों के व्यवहार के लिए कठिन हिब्रू क्रिया का अर्थ
  choice: पराये जैसा व्यवहार करना
  alternative: बुरा व्यवहार करना; अन्याय करना; कठोरता से पेश आना
  rationale: पद किसी विशिष्ट धर्मवैज्ञानिक निष्कर्ष की माँग नहीं करता। मूल की शब्दगत अनिश्चितता और संबंध-विच्छेद की छवि को सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन बहुवचन ‘तुम’ मूल के बहुवचन रूपों को दर्शाता है। वाक्य गरिमापूर्ण, सीधा और सामान्य पाठकों के लिए सुबोध रखा गया है।
