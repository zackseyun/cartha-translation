id: JOB.19.20
reference: Job 19:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בְּ/עוֹרִ֣/י וּ֭/בִ/בְשָׂרִ/י דָּבְקָ֣ה עַצְמִ֑/י וָ֝/אֶתְמַלְּטָ֗/ה בְּ/ע֣וֹר שִׁנָּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/020.yaml
  text: My bone clings to my skin and to my flesh[b][a], and I have escaped with the skin of my teeth.
translation:
  language: hi
  text: मेरी हड्डी मेरी त्वचा और मेरे मांस से चिपक गई है[b], और मैं अपने दाँतों की खाल भर से बच निकला हूँ[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘अपने दाँतों की खाल से।’ यह इब्रानी अभिव्यक्ति अत्यन्त थोड़े अंतर से बच निकलने का भाव देती है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में ‘मेरी हड्डी’ एकवचन है; सम्भवतः यह अय्यूब के पूरे अस्थिपंजर के लिए सामूहिक प्रयोग है। कुछ अनुवाद ‘मेरी हड्डियाँ’ कहते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעוֹרִי
  choice: मेरी त्वचा से
  rationale: עוֹר का अर्थ ‘त्वचा/खाल’ है। דבק के साथ हिन्दी में ‘त्वचा से चिपकना’ स्वाभाविक है और अय्यूब की अत्यन्त कृश दशा को व्यक्त करता है।
- source_word: וּבִבְשָׂרִי
  choice: और मेरे मांस से
  rationale: בשר यहाँ शरीर के वास्तविक मांस को दर्शाता है और ‘त्वचा’ के समानांतर है; इसलिए ‘मांस’ मूल शारीरिक बिंब को बनाए रखता है।
- source_word: דָּבְקָה עַצְמִי
  choice: मेरी हड्डी ... चिपक गई है
  rationale: עַצְמִי मूल में एकवचन है, संभवतः पूरे अस्थिपंजर के लिए सामूहिक प्रयोग। ‘चिपक गई है’ דבק की निकटता और अय्यूब की क्षीणता दोनों व्यक्त करता है।
- source_word: וָאֶתְמַלְּטָה
  choice: मैं ... बच निकला हूँ
  rationale: מלט संकट से निकलने या बचने को दर्शाता है। पूर्ण परिणाम को आधुनिक हिन्दी में ‘बच निकला हूँ’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּעוֹר שִׁנָּי
  choice: अपने दाँतों की खाल भर से
  rationale: यह असामान्य इब्रानी बिंब ज्यों का त्यों रखा गया है। ‘भर से’ अत्यल्प साधन या गुंजाइश का भाव देता है, बिना बिंब को सामान्य मुहावरे ‘बाल-बाल’ से बदलने के।
theological_decisions:
- issue: क्या अय्यूब पूर्ण छुटकारे की बात करता है या केवल अत्यन्त संकीर्ण बचाव की?
  choice: असामान्य ‘दाँतों की खाल’ वाले बिंब को रखते हुए अत्यन्त संकीर्ण बचाव का भाव
  alternative: सिर्फ ‘मैं बाल-बाल बचा हूँ’
  rationale: मूल पद बचने की बात करता है, पर उसके साथ जानबूझकर विचित्र और तनावपूर्ण शारीरिक बिंब जोड़ता है। सामान्य हिन्दी मुहावरा अर्थ तो देगा, पर मूल बिंब मिटा देगा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और शारीरिक पीड़ा के मूल बिंब के निकट रखी गई है। ‘त्वचा’ सामान्य आधुनिक हिन्दी है, जबकि ‘मांस’ मूल की ठोस शारीरिक समानांतरता को बनाए रखता है। ‘दाँतों की खाल’ की असामान्यता जानबूझकर सुरक्षित है और पादटिप्पणी उसका आशय स्पष्ट करती है।
