base_translation:
  language: en
  yaml_path: translation/ot/job/019/027.yaml
  text: whom I myself will see for myself[a], and my eyes will see, and not another[b]. My kidneys fail within my bosom.
translation:
  language: hi
  text: उसी को मैं स्वयं अपने लिए देखूँगा[a], और मेरी आँखें उसे देखेंगी, कोई और नहीं।[b] मेरे गुर्दे मेरे भीतर क्षीण होते जाते हैं।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अपने लिए’ का इब्रानी पद कठिन है; इसका अर्थ ‘अपने हित में’ या ‘अपने पक्ष में’ भी समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक अर्थ: ‘और कोई पराया नहीं।’ इसका आशय शायद यह है कि अय्यूब स्वयं उसे देखेगा, कोई दूसरा नहीं; पर यह भी समझा गया है कि वह उसे पराए के रूप में नहीं देखेगा।'
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में ‘मेरे गुर्दे।’ प्राचीन इब्रानी अभिव्यक्ति में गुर्दे मनुष्य के अंतरतम या उसकी गहरी भावनाओं के प्रतीक हो सकते थे।
    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר
  choice: उसी को
  rationale: यह संबंधवाचक सर्वनाम पिछले पद में बताए गए छुड़ानेवाले की ओर संकेत करता है और אֶחֱזֶה के कर्म के रूप में आता है। ‘उसी को’ हिन्दी में पूर्ववर्ती व्यक्ति से संबंध और बल दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֲנִי
  choice: मैं स्वयं
  rationale: क्रिया में कर्ता पहले से निहित होने पर भी स्वतंत्र सर्वनाम אֲנִי प्रयुक्त है, इसलिए उसके विशेष बल को ‘मैं स्वयं’ से रखा गया है।
- source_word: אֶחֱזֶה
  choice: देखूँगा
  rationale: חזה का अर्थ देखना या निहारना है और इसमें कभी-कभी गहन अथवा दर्शन-संबंधी भाव हो सकता है। ‘देखूँगा’ स्पष्ट है और ऐसा अतिरिक्त धार्मिक अर्थ नहीं जोड़ता जिसे यह पद अपने आप निश्चित नहीं करता।
- source_word: לִּי
  choice: अपने लिए
  rationale: यह कठिन और बलयुक्त संप्रदान रूप व्यक्तिगत सहभागिता अथवा अपने हित का भाव दे सकता है। ‘अपने लिए’ इस बल को रखता है, जबकि ‘अपने पक्ष में’ जैसी न्यायिक व्याख्या को मुख्य पाठ में नहीं थोपता।
- source_word: וְעֵינַי רָאוּ
  choice: मेरी आँखें उसे देखेंगी
  rationale: शाब्दिक चित्र और पहले खंड के साथ काव्यात्मक समानांतरता बनाए रखी गई है। रूप की दृष्टि से רָאוּ पूर्णकाल है, पर यहाँ पूर्ववर्ती अपूर्णकाल के समानांतर प्रत्याशित दर्शन को व्यक्त करता है, इसलिए हिन्दी में भविष्यकाल स्वाभाविक है।
- source_word: וְלֹא זָר
  choice: किसी और की नहीं
  rationale: זָר का शाब्दिक अर्थ ‘पराया/अजनबी’ है, पर प्रसंग में अय्यूब की अपनी आँखों और किसी दूसरे की आँखों के बीच विरोध प्रमुख जान पड़ता है। मुख्य पाठ अर्थ को सहज हिन्दी में देता है और शाब्दिक विकल्प टिप्पणी में सुरक्षित है।
- source_word: כָּלוּ
  choice: तड़पते-तड़पते चुक रहे हैं
  rationale: כלה यहाँ समाप्त हो जाने, क्षीण पड़ने या लालसा से व्याकुल होने का भाव रखता है। संयुक्त अभिव्यक्ति आंतरिक तीव्रता और चुक जाने—दोनों पहलुओं को व्यक्त करती है।
- source_word: כִלְיֹתַי
  choice: मेरे गुर्दे
  rationale: मूल में शरीर का ठोस अंग ‘गुर्दे’ है, जो इब्रानी प्रयोग में मनुष्य के अंतरतम और गहरी भावनाओं का बिंब है। मूल चित्र को मुख्य पाठ में रखा गया है और उसका सांस्कृतिक अर्थ टिप्पणी में समझाया गया है।
- source_word: בְּחֵקִי
  choice: मेरे भीतर
  rationale: חֵיק का ठोस अर्थ छाती, गोद या वक्ष के भीतर का भाग हो सकता है। हिन्दी में ‘मेरे भीतर’ स्थान और आंतरिक भाव दोनों को स्वाभाविक रूप से व्यक्त करता है, जबकि गुर्दों का मूल शारीरिक बिंब बना रहता है।
theological_decisions:
- issue: अय्यूब द्वारा अपेक्षित दर्शन का स्वरूप
  choice: पद को पिछले पद में बताए गए व्यक्ति को अय्यूब द्वारा स्वयं भविष्य में देखने की आशा के रूप में प्रस्तुत किया गया है, पर उस दर्शन का समय या स्वरूप निश्चित नहीं किया गया।
  alternative: इसे विशेष रूप से देह के पुनरुत्थान, इसी जीवन में निर्दोष सिद्ध किए जाने, अथवा मृत्यु के बाद परमेश्वर के दर्शन की घोषणा मानना।
  rationale: इब्रानी पाठ अय्यूब के व्यक्तिगत रूप से देखने पर बहुत बल देता है, लेकिन यह पद अकेले इन व्यापक धर्मवैज्ञानिक विकल्पों में से किसी एक को निर्णायक रूप से स्थापित नहीं करता।
- issue: וְלֹא זָר में विरोध का आशय
  choice: ‘मेरी आँखें…किसी और की नहीं’ द्वारा अय्यूब की अपनी प्रत्यक्ष अनुभूति पर बल दिया गया है।
  alternative: ‘पराए के रूप में नहीं’—अर्थात जिसको वह देखेगा वह उसके प्रति अजनबी या विरोधी नहीं होगा।
  rationale: זָר के कारण वैकल्पिक समझ संभव है, पर निकटवर्ती ‘मेरी आँखें’ के साथ ‘कोई दूसरा नहीं’ वाला विरोध अधिक सीधा है। अस्पष्टता को टिप्पणी में स्वीकार किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘गुर्दे’ जैसे मूल इब्रानी बिंब को जानबूझकर सुरक्षित रखा गया है, जबकि टिप्पणी साधारण पाठक के लिए उसका भाव स्पष्ट करती है। विस्मयादिबोधक चिह्न अंतिम पंक्ति की तीव्र लालसा और आंतरिक क्षीणता को दर्शाता है।
