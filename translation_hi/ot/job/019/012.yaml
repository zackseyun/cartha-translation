  yaml_path: translation/ot/job/019/012.yaml
  text: Together his troops come; they build up their road against me[a], and they camp all around my tent.
translation:
  language: hi
  text: उसकी टुकड़ियाँ एक साथ आती हैं; वे मेरे विरुद्ध अपना मार्ग तैयार करती हैं[a] और मेरे तंबू के चारों ओर डेरा डालती हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे मेरे विरुद्ध अपना मार्ग ऊँचा उठाती हैं”; इब्रानी क्रिया मार्ग तैयार करने या घेराबंदी का टीला खड़ा करने का बिंब जगा सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחַד
  choice: एक साथ
  rationale: यह क्रियाविशेषण संयुक्त या समन्वित कार्रवाई बताता है; ‘एक साथ’ सहज आधुनिक हिन्दी में वही अर्थ रखता है।
- source_word: יָבֹאוּ
  choice: आती हैं
  rationale: בוא का मूल अर्थ ‘आना’ है; काव्यात्मक वर्णन की सजीवता बनाए रखने के लिए वर्तमान काल रखा गया है।
- source_word: גְדוּדָיו
  choice: उसकी टुकड़ियाँ
  rationale: גְּדוּד सैनिक दल या छापामार टुकड़ी को सूचित कर सकता है। ‘टुकड़ियाँ’ सैन्य बिंब को बनाए रखता है और दलों का आकार अनावश्यक रूप से निश्चित नहीं करता।
- source_word: וַיָּסֹלּוּ
  choice: ऊँचा बनाती हैं
  rationale: סלל मार्ग को उठाने, पाटने या चढ़ाई का बाँध बनाने का भाव दे सकता है। यह चयन निर्माण और घेराबंदी—दोनों बिंबों की गुंजाइश रखता है।
- source_word: עָלַי
  choice: मेरे विरुद्ध
  rationale: शाब्दिक रूप से ‘मुझ पर’ संभव है, पर शत्रुतापूर्ण सैन्य प्रसंग में ‘मेरे विरुद्ध’ संबंध का आशय स्वाभाविक रूप से व्यक्त करता है।
- source_word: דַּרְכָּם
  choice: अपना मार्ग
  rationale: דֶּרֶךְ का अर्थ मार्ग, रास्ता या पथ है। ‘मार्ग’ उस निर्मित पहुँच-पथ के बिंब को बनाए रखते हुए स्वाभाविक और गरिमापूर्ण है।
- source_word: וַיַּחֲנוּ
  choice: डेरा डालती हैं
  rationale: חנה का अर्थ पड़ाव डालना या छावनी लगाना है; ‘डेरा डालना’ आधुनिक हिन्दी में स्पष्ट है और सैन्य संदर्भ बनाए रखता है।
- source_word: סָבִיב
  choice: चारों ओर
  rationale: यह हर ओर से घेरे जाने का भाव स्पष्ट करता है।
- source_word: לְאָהֳלִי
  choice: मेरे तंबू के
  rationale: אֹהֶל का ठोस अर्थ ‘तंबू’ है; इसे बनाए रखने से मूल काव्यात्मक और घरेलू बिंब सुरक्षित रहता है।
theological_decisions:
- issue: ‘उसकी टुकड़ियाँ’ में एकवचन पुल्लिंग संबंधसूचक सर्वनाम का संदर्भ
  choice: सर्वनाम ‘उसकी’ को बनाए रखा गया है; निकट संदर्भ में यह परमेश्वर की ओर संकेत करता है, जिसे अय्यूब अपने ऊपर आक्रमण करनेवाले के रूप में चित्रित करता है।
  alternative: रूपक में किसी अनिर्दिष्ट शत्रु सेनापति की टुकड़ियाँ।
  rationale: मूल इब्रानी संदर्भित व्यक्ति का नाम इस पद में नहीं दोहराता। सर्वनाम बनाए रखने से संदर्भगत अर्थ सुरक्षित रहता है और अनावश्यक व्याख्यात्मक स्पष्टता नहीं जोड़ी जाती।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। सैन्य घेराबंदी का ठोस बिंब ‘टुकड़ियाँ’, ‘मार्ग ऊँचा बनाती हैं’, ‘डेरा डालती हैं’ और ‘चारों ओर’ से सुरक्षित रखा गया है; कठिन क्रिया की वास्तविक अर्थ-व्याप्ति पादटिप्पणी में दी गई है।
