  yaml_path: translation/ot/job/019/021.yaml
  text: Have pity on me[a], have pity on me, you my friends[b], for the hand of God has struck me.
translation:
  language: hi
  text: मुझ पर दया करो[a], मुझ पर दया करो, मेरे मित्रों, क्योंकि परमेश्वर के हाथ ने मुझे छुआ है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मुझ पर अनुग्रह करो” अथवा “मुझ पर करुणा करो”।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “छुआ” का अर्थ हानि पहुँचाना, प्रहार करना या पीड़ित करना भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֻּנִי
  choice: मुझ पर दया करो
  rationale: חנן के बहुवचन आज्ञार्थक रूप से अय्यूब अपने मित्रों से करुणा की विनती करता है। आधुनिक हिन्दी में यह स्वाभाविक है और दोहराव उसकी व्याकुलता को बनाए रखता है।
- source_word: רֵעָי
  choice: मेरे मित्रो
  rationale: प्रत्यक्ष संबोधन में רֵעַ का सामान्य अर्थ ‘मित्र’ है; सम्बोधन रूप ‘मित्रो’ काव्यात्मक आग्रह को सहज हिन्दी में व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पहले आग्रह का कारण प्रस्तुत करता है।
- source_word: יַד אֱלוֹהַּ
  choice: परमेश्वर के हाथ
  rationale: इब्रानी रूपक को स्पष्टतः बनाए रखा गया है; यह परमेश्वर की क्रिया या सामर्थ्य का संकेत देता है।
- source_word: נָגְעָה בִּי
  choice: मुझे छुआ है
  rationale: נגע का मूल और प्रत्यक्ष बिंब ‘छूना’ है। दुःख के प्रसंग में यह हानिकारक प्रहार अथवा पीड़ा पहुँचाने का भाव रख सकता है, जिसे पादटिप्पणी स्पष्ट करती है, जबकि मुख्य पाठ मूल की अर्थगत व्यापकता बचाता है।
theological_decisions:
- issue: अय्यूब के दुःख में परमेश्वर की भूमिका
  choice: परमेश्वर के हाथ ने मुझे छुआ है
  alternative: परमेश्वर के हाथ ने मुझ पर प्रहार किया है / मुझे पीड़ित किया है
  rationale: इब्रानी पाठ दुःख को परमेश्वर के ‘हाथ’ से जोड़ता है। अनुवाद इस कठिन धार्मिक तनाव को न नरम करता है, न उसकी व्याख्या करके दूर करता है; साथ ही ‘छुआ’ मूल क्रिया की वास्तविक अस्पष्टता बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और भावपूर्ण शैली रखी गई है। मूल का दोहराव, प्रत्यक्ष संबोधन और ‘परमेश्वर के हाथ’ का रूपक सुरक्षित हैं।
