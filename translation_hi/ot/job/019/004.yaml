    issue: 'Awkward verb phrase: “ठहरी रहती है.”'
    rationale: For תָּלִין, this phrase attempts to preserve the lodging image but is not fully natural modern Hindi. A simple durative “रहती है” is clearer; the image may be supplied in a footnote.
