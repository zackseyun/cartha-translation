base_translation:
  language: en
  yaml_path: translation/ot/job/019/004.yaml
  text: And even if I truly have gone astray[a], my error remains with me.
translation:
  language: hi
  text: और यदि मैं सचमुच भटक भी गया हूँ, तो मेरी भूल मेरे ही साथ रहती है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַף
  choice: और यदि...भी
  rationale: 'यह पिछले कथन से संबंध रखते हुए रियायती भाव व्यक्त करता है: अय्यूब तर्क के लिए अपने भटकने की संभावना मानता है।'
- source_word: אָמְנָם
  choice: सचमुच
  rationale: यह क्रियाविशेषण मानी हुई संभावना पर बल देता है और आधुनिक हिंदी में स्वाभाविक है।
- source_word: שָׁגִיתִי
  choice: मैं...भटक गया हूँ
  rationale: שׁגה का मूल भाव मार्ग से चूकना या गलती करना है। ‘भटक गया’ रूपक को बचाता है और ‘पाप किया’ कहकर नैतिक दोष को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: אִתִּי
  choice: मेरे ही साथ
  rationale: पूर्वसर्ग का स्वाभाविक अर्थ ‘मेरे साथ’ है; ‘ही’ इस संदर्भ का भाव उभारता है कि वह भूल अय्यूब का अपना मामला रहती है।
- source_word: תָּלִין
  choice: ठहरी रहती है
  rationale: לין का शाब्दिक अर्थ रात बिताना या ठहरना है। ‘ठहरी रहती है’ उसके ठहरने के बिंब और निरंतरता—दोनों को हिंदी में बनाए रखता है।
- source_word: מְשׁוּגָתִי
  choice: मेरी भूल
  rationale: यह संज्ञा भटकाव या त्रुटि को दर्शाती है। ‘भूल’ सहज हिंदी है और ‘पाप’ की अपेक्षा मूल की अर्थगत खुलावट बनाए रखती है।
theological_decisions:
- issue: क्या अय्यूब वास्तव में अपना दोष स्वीकार कर रहा है?
  choice: 'रियायती/काल्पनिक कथन के रूप में अनुवाद: ‘यदि मैं...भटक भी गया हूँ’'
  alternative: 'निश्चित स्वीकारोक्ति: ‘मैं सचमुच भटक गया हूँ’'
  rationale: וְאַף और प्रसंग मिलकर ऐसी concession का समर्थन करते हैं जिसमें अय्यूब तर्क के लिए संभावना मानता है; अनुवाद को इसे स्पष्ट दोष-स्वीकार में नहीं बदलना चाहिए।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘ठहरी रहती है’ मूल के निवास/ठहराव वाले बिंब को बिना अस्वाभाविक शाब्दिकता के सुरक्षित रखता है।
