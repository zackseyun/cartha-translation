base_translation:
  language: en
  yaml_path: translation/ot/job/019/022.yaml
  text: Why do you pursue me like God[b][a], and are not satisfied with my flesh?
translation:
  language: hi
  text: 'तुम परमेश्वर के समान[a] मेरा पीछा क्यों करते हो,

    और मेरे मांस से तृप्त क्यों नहीं होते?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “किसी देवता के समान।” इब्रानी אֵל का अर्थ “देवता” और, यहाँ कम सम्भावित रूप से, “कोई शक्तिशाली व्यक्ति” भी हो सकता है।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक, “मेरे मांस से।” यह संभवतः ऐसी सजीव छवि है मानो वे अय्यूब के अपने ही मांस पर टूट पड़कर भी न अघाते हों; इसका आशय उनकी निरन्तर और निर्दयी शत्रुता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: क्यों
  rationale: यह अय्यूब के विरोध-भरे प्रश्न को आरम्भ करने वाला सामान्य प्रश्नवाचक क्रियाविशेषण है।
- source_word: תִּרְדְּפֻנִי
  choice: मेरा पीछा करते हो
  rationale: רדף का अर्थ पीछा करना, खदेड़ना या सताना हो सकता है। यहाँ ‘पीछा करना’ शत्रुतापूर्ण व्यवहार की छवि को बनाए रखता है, बिना अर्थ को अनावश्यक रूप से सीमित किए।
- source_word: כְמוֹ
  choice: के समान
  rationale: तुलना व्यक्त करने वाले इस पद का यह स्वाभाविक और गरिमापूर्ण हिन्दी रूप है।
- source_word: אֵל
  choice: परमेश्वर
  rationale: सन्दर्भ में सम्भावित संकेत इस्राएल के परमेश्वर की ओर है; फिर भी मूल शब्द की वैकल्पिक व्यापकता को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וּמִבְּשָׂרִי
  choice: और मेरे मांस से
  rationale: מִן को उसके मूल ‘से’ रूप में रखा गया है और בשר की ठोस देहगत छवि के लिए ‘मांस’ चुना गया है। यह वाक्य मित्रों की अतृप्त, हिंसक शत्रुता की सजीव छवि देता है।
- source_word: לֹא תִשְׂבָּעוּ
  choice: तृप्त क्यों नहीं होते
  rationale: שבע का मूल भाव तृप्त या भर जाना है। पहले ‘क्यों’ से आरम्भ हुए संयुक्त प्रश्न को स्वाभाविक हिन्दी में स्पष्ट रखने के लिए दूसरे खंड में ‘क्यों’ दोहराया गया है।
theological_decisions:
- issue: כְמוֹ אֵל में אֵל का संकेत
  choice: परमेश्वर के समान
  alternative: किसी देवता के समान; किसी शक्तिशाली के समान
  rationale: निकटवर्ती सन्दर्भ में अय्यूब अपने साथियों की कठोरता की तुलना परमेश्वर द्वारा अपने ऊपर किए जा रहे प्रहार से करता है। ‘परमेश्वर’ सबसे सम्भावित अर्थ है, पर אֵל की वास्तविक शाब्दिक अस्पष्टता पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सीधी, गरिमापूर्ण और काव्यात्मक अभिव्यक्ति रखी गई है। ‘मांस’ मूल की तीखी देहगत छवि बचाता है; ‘पीछा करना’ व्यापक रूपक को बनाए रखता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
