base_translation:
  language: en
  yaml_path: translation/ot/job/019/009.yaml
  text: He has stripped my honor from me and removed the crown from my head[a].
translation:
  language: hi
  text: उसने मुझ पर से मेरा सम्मान[a] उतार लिया और मेरे सिर से मुकुट हटा दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मेरी महिमा’ अथवा ‘मेरी गरिमा’।
    reason: כָּבוֹד के अर्थ-क्षेत्र में सम्मान, महिमा और गरिमा सम्मिलित हैं; मुख्य पाठ में संदर्भानुकूल ‘सम्मान’ चुना गया है।
lexical_decisions:
- source_word: כְּבוֹדִי
  choice: मेरा सम्मान
  rationale: כָּבוֹד सम्मान, महिमा, गरिमा या सामाजिक प्रतिष्ठा का बोध करा सकता है। अय्यूब के अपमान और खोई हुई प्रतिष्ठा के संदर्भ में ‘मेरा सम्मान’ स्वाभाविक और सटीक है; अन्य संभावनाएँ पादटिप्पणी में रखी गई हैं।
- source_word: מֵעָלַי
  choice: मुझ पर से
  rationale: यह पदबंध शाब्दिक रूप से ‘मेरे ऊपर से’ हटाने का भाव देता है। ‘मुझ पर से’ उतारने के वस्त्र-संबंधी रूपक को बनाए रखता है और हिन्दी में बोधगम्य है।
- source_word: הִפְשִׁיט
  choice: उतार लिया
  rationale: हिफ़ईल क्रिया किसी वस्त्र या आवरण को उतारने का सजीव चित्र प्रस्तुत करती है। ‘उतार लिया’ सम्मान से वंचित किए जाने के रूपक को बनाए रखता है।
- source_word: וַיָּסַר
  choice: हटा दिया
  rationale: हिफ़ईल में סור का अर्थ हटाना या दूर कर देना है। ‘हटा दिया’ समानांतर काव्य-पंक्ति में स्पष्ट और स्वाभाविक है।
- source_word: עֲטֶרֶת
  choice: मुकुट
  rationale: यह संज्ञा मुकुट या माला को दर्शाती है, जो सम्मान और पद का प्रतीक है। ‘मुकुट’ आधुनिक हिन्दी में सबसे स्पष्ट समतुल्य है।
- source_word: רֹאשִׁי
  choice: मेरे सिर से
  rationale: मूल में ‘मेरे सिर का’ है, पर हटाने की क्रिया के साथ हिन्दी में ‘मेरे सिर से मुकुट हटा दिया’ स्वाभाविक रूप से वही दृश्य व्यक्त करता है।
theological_decisions:
- issue: अनाम कर्ता की पहचान
  choice: पुल्लिंग एकवचन ‘उसने’ रखा गया है; संदर्भ में संकेत परमेश्वर की ओर है।
  alternative: स्पष्ट रूप से ‘परमेश्वर ने’ कहना, या किसी अनिर्दिष्ट विरोधी अथवा परिस्थिति को कर्ता मानना।
  rationale: निकटवर्ती संदर्भ में अय्यूब अपने कष्ट का कर्ता परमेश्वर को मानता है, पर इब्रानी पद स्वयं नाम नहीं लेता। इसलिए ‘उसने’ मूल की संक्षिप्तता और धार्मिक तनाव दोनों को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘मुझ पर से…उतार लिया’ मूल के वस्त्र उतारने वाले रूपक को बचाता है, जबकि दूसरी पंक्ति सहज हिन्दी में मुकुट हटाए जाने का चित्र देती है।
