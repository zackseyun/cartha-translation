  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और काव्यात्मक समानांतरता वाला अनुवाद। ‘पराया’ और ‘विदेशी’ के भेद से मूल की दो निकटार्थी अभिव्यक्तियाँ सुरक्षित रखी गई हैं।
