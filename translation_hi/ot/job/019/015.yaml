base_translation:
  language: en
  yaml_path: translation/ot/job/019/015.yaml
  text: The guests in my house and my female servants count me as a stranger; I have become a foreigner in their eyes.
translation:
  language: hi
  text: मेरे घर के अतिथि और मेरी दासियाँ मुझे पराया समझते हैं; उनकी दृष्टि में मैं विदेशी हो गया हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גָּרֵי בֵיתִי
  choice: मेरे घर के अतिथि
  rationale: גָּרֵי का मूल भाव घर में रहने वाले गैर-परिवारजन या प्रवासी हो सकता है; संदर्भ और परामर्श-पाठ के अनुरूप सहज हिन्दी में ‘अतिथि’ चुना गया, बिना उन्हें घर के स्थायी सदस्यों के रूप में निश्चित किए।
- source_word: אַמְהֹתַי
  choice: मेरी दासियाँ
  rationale: אָמָה स्त्री दासी अथवा सेविका को दर्शाता है; प्राचीन सामाजिक स्थिति को स्पष्ट रखने के लिए ‘दासियाँ’ चुना गया।
- source_word: לְזָר תַּחְשְׁבֻנִי
  choice: मुझे पराया समझते हैं
  rationale: זָר यहाँ ऐसे व्यक्ति को दर्शाता है जिसे अपना न माना जाए; ‘पराया’ हिन्दी में संबंध-विच्छेद का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: נָכְרִי הָיִיתִי בְעֵינֵיהֶם
  choice: उनकी दृष्टि में मैं विदेशी हो गया हूँ
  rationale: נָכְרִי का अर्थ विदेशी/अजनबी व्यक्ति है, और בְעֵינֵיהֶם मूल्यांकन या धारणा को दर्शाता है; समानांतर पंक्ति का तीखापन बनाए रखने के लिए ‘विदेशी’ रखा गया।
