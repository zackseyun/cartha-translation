base_translation:
  language: en
  yaml_path: translation/ot/job/019/019.yaml
  text: All my intimate friends abhor me[a], and those whom I loved have turned against me.
translation:
  language: hi
  text: 'मेरे सभी अंतरंग मित्र[a] मुझसे घृणा करते हैं,

    और जिनसे मैं प्रेम करता था, वे मेरे विरुद्ध हो गए हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “मेरे गोपनीय परामर्श के लोग।” यह वाक्यांश अय्यूब के विश्वासपात्रों के निकट घेरे, अर्थात उसके घनिष्ठ साथियों, को दर्शाता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּעֲבוּנִי
  choice: मुझसे घृणा करते हैं
  rationale: क्रिया תעב तीव्र घृणा और विकर्षण व्यक्त करती है; ‘घृणा करते हैं’ आधुनिक हिन्दी में इसकी प्रबलता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כָּל
  choice: सभी
  rationale: यह व्यापक परिमाणसूचक शब्द है; ‘सभी’ यहाँ सहज और स्पष्ट है।
- source_word: מְתֵי סוֹדִי
  choice: मेरे अंतरंग मित्र
  rationale: מְתֵי का अर्थ ‘लोग/पुरुष’ और סוֹד का अर्थ गोपनीय मंत्रणा, विश्वास का घेरा या घनिष्ठ संगति हो सकता है। ‘अंतरंग मित्र’ अय्यूब के विश्वस्त निकटवर्ती लोगों का भाव संप्रेषित करता है, जबकि पाद-टिप्पणी मूल रूपक को सुरक्षित रखती है।
- source_word: וְזֶה אָהַבְתִּי
  choice: और जिनसे मैं प्रेम करता था
  rationale: זֶה रूप में एकवचन है, पर आगे की बहुवचन क्रिया और समानांतर समूह के संदर्भ में सामूहिक अर्थ देता है। हिन्दी का ‘जिनसे’ इस व्याकरणिक तनाव को बिना कृत्रिम एकवचन थोपे स्वाभाविक रूप से व्यक्त करता है।
- source_word: אָהַבְתִּי
  choice: मैं प्रेम करता था
  rationale: पूर्ण क्रियारूप अय्यूब के पूर्व संबंध और स्नेह को बताता है; हिन्दी में अपूर्ण भूतकाल निरंतर संबंध का स्वाभाविक भाव देता है।
- source_word: נֶהְפְּכוּ
  choice: हो गए हैं
  rationale: निफ़अल रूप उलट जाने या रुख बदल जाने को व्यक्त करता है; ‘मेरे विरुद्ध हो गए हैं’ संबंध और निष्ठा के प्रतिकूल परिवर्तन को स्पष्ट करता है।
- source_word: בִי
  choice: मेरे विरुद्ध
  rationale: इस शत्रुतापूर्ण संदर्भ में पूर्वसर्ग ב का प्रतिकूल अर्थ है; ‘मेरे विरुद्ध’ हिन्दी में उसका स्वाभाविक समतुल्य है।
