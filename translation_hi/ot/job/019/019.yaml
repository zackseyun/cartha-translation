  register: भाषा आधुनिक, गरिमापूर्ण और विलाप के अनुकूल रखी गई है। ‘अंतरंग मित्र’ सामान्य पाठक के लिए स्पष्ट है, और पाद-टिप्पणी סוֹד में निहित गोपनीय मंत्रणा तथा विश्वास के घेरे का अर्थ सुरक्षित रखती है।
