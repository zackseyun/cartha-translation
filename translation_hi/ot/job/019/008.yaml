  yaml_path: translation/ot/job/019/008.yaml
  text: He has walled up my way so that I cannot pass[a], and he has set darkness upon my paths.
translation:
  language: hi
  text: उसने मेरे मार्ग के आगे दीवार खड़ी कर दी है, इसलिए मैं पार न जा सकूँ[a]; और उसने मेरे रास्तों पर अंधकार डाल दिया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में कर्ता स्पष्ट रूप से नहीं बताया गया है; प्रसंग में अय्यूब परमेश्वर की बात कर रहा है, यद्यपि इस पद में केवल पुल्लिंग एकवचन कर्ता निहित है।
    reason: alternative_reading
lexical_decisions:
- source_word: אָרְחִי
  choice: मेरे मार्ग
  rationale: यह संज्ञा सड़क, पथ या जीवन-मार्ग का बोध करा सकती है। ‘मेरे मार्ग’ मूल के एकवचन और उसके शाब्दिक तथा रूपक दोनों अर्थों को बनाए रखता है।
- source_word: גָדַר
  choice: दीवार खड़ी करके रोक दिया है
  rationale: क्रिया में दीवार या बाड़ लगाकर मार्ग अवरुद्ध करने का ठोस बिम्ब है। यह हिन्दी में स्वाभाविक रहते हुए केवल ‘रोक दिया’ की अपेक्षा मूल चित्र को अधिक स्पष्ट रखता है।
- source_word: וְלֹא אֶעֱבוֹר
  choice: इसलिए मैं पार नहीं जा सकता
  rationale: अवरोध के परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है। ‘पार जाना’ עבר के सीधे अर्थ को बनाए रखता है; ‘इसलिए’ प्रसंगगत परिणाम-संबंध स्पष्ट करता है।
- source_word: נְתִיבוֹתַי
  choice: मेरे रास्तों
  rationale: बहुवचन को सुरक्षित रखता है और सामान्य आधुनिक हिन्दी में जीवन की विभिन्न दिशाओं या पथों का काव्यात्मक संकेत भी दे सकता है।
- source_word: חֹשֶׁךְ
  choice: अन्धकार
  rationale: यह मूल संज्ञा का सीधा और गरिमापूर्ण हिन्दी रूप है तथा वास्तविक और रूपकात्मक दोनों अर्थों को खुला रखता है।
- source_word: יָשִׂים
  choice: कर दिया है
  rationale: शाब्दिक अर्थ ‘रखना/स्थापित करना’ है; ‘रास्तों पर अन्धकार कर दिया है’ हिन्दी में स्वाभाविक ढंग से अन्धकार को मार्ग पर ला देने की क्रिया व्यक्त करता है और पूर्ण हुई क्रिया की वर्तमान परिणति रखता है।
theological_decisions:
- issue: तृतीय पुरुष कर्ता का संदर्भ
  choice: उसने
  alternative: परमेश्वर ने / यहोवा ने
  rationale: इब्रानी में कर्ता व्यक्त नहीं किया गया, केवल पुल्लिंग एकवचन क्रिया से ‘उसने’ समझा जाता है। प्रसंग में अय्यूब परमेश्वर की बात कर रहा है, पर इस पद में परमेश्वर का नाम जोड़ना मूल से अधिक स्पष्टता लाता; इसलिए सर्वनाम और टिप्पणी द्वारा वास्तविक अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और काव्यात्मक रूप। ‘मार्ग’ और ‘रास्तों’ का प्रयोग मूल की दो अलग संज्ञाओं तथा एकवचन-बहुवचन भेद को दर्शाता है। वर्तनी में ‘अन्धकार’ का मानक साहित्यिक रूप रखा गया है।
