  yaml_path: translation/ot/job/019/026.yaml
  text: And after my skin has been destroyed[b][a], yet from my flesh I will see God.
translation:
  language: hi
  text: और मेरी त्वचा के नष्ट हो जाने के बाद[b], फिर भी अपनी देह से[a] मैं परमेश्वर को देखूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपनी देह में मैं परमेश्वर को देखूँगा”; एक अन्य सम्भावना है, “अपनी देह के बिना मैं परमेश्वर को देखूँगा।” इब्रानी वाक्यांश कठिन है और इसके एक से अधिक अर्थ समझे गए हैं।
    reason: alternative_reading
  - marker: b
    text: “मेरी त्वचा के नष्ट हो जाने के बाद” वाला उपवाक्य पाठ और शब्दार्थ की दृष्टि से कठिन है। अधिक शाब्दिक अनुवाद हो सकता है, “मेरी त्वचा को उन्होंने उधेड़ दिया है—यह होने के बाद।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַחַר
  choice: और ... के बाद
  rationale: संयोजक और कालवाचक संबंध दोनों को बनाए रखता है तथा पिछले पद से स्वाभाविक जुड़ाव दिखाता है।
- source_word: עוֹרִי
  choice: मेरी खाल
  rationale: עוֹר का सामान्य अर्थ त्वचा या खाल है। यहाँ ‘खाल’ अय्यूब की शारीरिक दुर्दशा की तीखी देहगत छवि को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: נִקְּפוּ זֹאת
  choice: के नष्ट हो जाने
  rationale: यह पदबंध पाठगत और शब्दार्थ की दृष्टि से कठिन है। प्रसंग में अय्यूब की खाल के विनाश का भाव व्यक्त करने वाला निष्क्रिय हिन्दी रूप स्पष्ट है, जबकि זֹאת को अलग ‘यह’ बनाकर अनावश्यक अस्पष्टता नहीं बढ़ाई गई।
- source_word: וּמִבְּשָׂרִי
  choice: फिर भी मैं अपने शरीर से
  rationale: מִן का मूल भाव ‘से’ रखा गया है। ‘फिर भी’ प्रसंग का विरोधात्मक बल व्यक्त करता है, और ‘अपने शरीर से’ विवादित वाक्यांश को ‘शरीर में’ अथवा ‘शरीर के बिना’ कहकर निर्णायक रूप से नहीं सुलझाता।
- source_word: אֶחֱזֶה
  choice: देखूँगा
  rationale: חזה का सीधा और सहज आधुनिक हिन्दी अर्थ ‘देखना’ है; यह भावी प्रथम पुरुष रूप को स्पष्ट रखता है।
- source_word: אֱלוֹהַּ
  choice: परमेश्वर
  rationale: अय्यूब में प्रयुक्त एकवचन ईश्वरीय पदनाम का प्रतिष्ठित, स्पष्ट और संदर्भानुकूल हिन्दी रूप।
theological_decisions:
- issue: क्या וּמִבְּשָׂרִי इस पद में देह के पुनरुत्थान को स्पष्ट रूप से सिखाता है
  choice: मुख्य पाठ में ‘अपने शरीर से’ रखकर कथन का तनाव और अस्पष्टता बनाए रखना।
  alternative: ‘अपने शरीर में’ या ‘अपने शरीर के बिना’।
  rationale: इब्रानी पूर्वसर्ग और वाक्य-विन्यास पर मतभेद है। ‘शरीर में’ देहगत पुनरुत्थान को अधिक स्पष्ट करेगा, जबकि ‘शरीर के बिना’ देहविहीन दर्शन का संकेत देगा। स्रोत जितना निश्चित है, अनुवाद उससे अधिक निश्चित नहीं बनाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली। ‘खाल’ शारीरिक पीड़ा की मूल ठोस छवि को बनाए रखता है; ‘फिर भी’ प्रसंगगत विरोध को सहज बनाता है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
