  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मौखिक रूप से सहज शैली रखी गई है। ‘मेरा तिरस्कार’ और ‘मेरे विरुद्ध बोलते हैं’ मूल की समान पूर्वसर्गीय रचना की नकल किए बिना उसके विरोधपूर्ण भाव को स्वाभाविक हिन्दी में व्यक्त करते हैं।
