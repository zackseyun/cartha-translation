  yaml_path: translation/ot/job/019/018.yaml
  text: Even little children despise me; when I rise[a], they speak against me.
translation:
  language: hi
  text: छोटे बच्चे तक मेरा तिरस्कार करते हैं; जब मैं उठता हूँ, तो वे मेरे विरुद्ध बोलते हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मूर्ख,” “ढीठ लोग,” अथवा “छोटे लड़के।” इब्रानी शब्द עֲוִילִים प्रायः मूर्ख या नैतिक विवेक से रहित लोगों को दर्शाता है, पर इस प्रसंग में बहुत-से विद्वान इसे अपरिपक्व अथवा निम्न सामाजिक हैसियत वाले लड़कों के लिए प्रयुक्त मानते हैं, जो अय्यूब का उपहास करते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: तक
  rationale: यहाँ גַּם इस अपमान की चरम सीमा पर बल देता है—छोटे बच्चे भी अय्यूब का तिरस्कार करते हैं; हिन्दी में ‘तक’ स्वाभाविक रूप से यह बल व्यक्त करता है।
- source_word: עֲוִילִים
  choice: छोटे बच्चे
  rationale: यह दुर्लभ शब्द सामान्यतः मूर्ख या विवेकहीन लोगों के लिए आ सकता है, पर इस प्रसंग में अनेक विद्वान इसे अपरिपक्व अथवा निम्न सामाजिक हैसियत वाले लड़कों/बच्चों के अर्थ में समझते हैं। ‘छोटे बच्चे’ अय्यूब के सामाजिक अपमान की तीव्रता को स्पष्ट करता है, जबकि अनिश्चितता पाद-टिप्पणी में रखी गई है।
- source_word: מָאֲסוּ בִי
  choice: मेरा तिरस्कार करते हैं
  rationale: מאס में घृणापूर्वक अस्वीकार करने या तुच्छ समझने का भाव है। ‘मेरा तिरस्कार करते हैं’ आधुनिक हिन्दी में स्वाभाविक और प्रसंगानुकूल है।
- source_word: אָקוּמָה
  choice: जब मैं उठता हूँ
  rationale: 'यह रूप प्रसंग में कालवाचक/आवृत्तिमूलक अर्थ देता है: अय्यूब के उठने पर वे उसके विरुद्ध बोलते हैं। अनावश्यक रूप से ‘खड़ा होता हूँ’ जोड़ने के बजाय मूल क्रिया की व्यापकता रखी गई है।'
- source_word: וַיְדַבְּרוּ בִי
  choice: वे मेरे विरुद्ध बोलते हैं
  rationale: דבר के साथ ב यहाँ प्रसंगानुसार विरोधपूर्ण वाणी सूचित करता है। ‘मेरे विरुद्ध बोलते हैं’ शत्रुतापूर्ण भाव बनाए रखता है, पर ‘मज़ाक उड़ाते हैं’ जैसी अधिक व्याख्यात्मक अभिव्यक्ति नहीं थोपता।
