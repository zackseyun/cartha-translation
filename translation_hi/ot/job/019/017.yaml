base_translation:
  language: en
  yaml_path: translation/ot/job/019/017.yaml
  text: My breath is repulsive to my wife[b][a], and I am loathsome to the sons of my own body.
translation:
  language: hi
  text: 'मेरी साँस मेरी पत्नी को घिनौनी लगती है,

    और मैं अपने ही शरीर के पुत्रों[b] को घिनौना लगता हूँ।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'कठिन इब्रानी का एक अन्य सम्भव अर्थ है: “और मेरी विनती मेरे शरीर के पुत्रों से है,” अथवा “मैं अपने शरीर के पुत्रों से कृपा की भीख माँगता हूँ।”'
    reason: alternative_reading
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “मेरे शरीर के पुत्र।” यह अभिव्यक्ति अय्यूब की अपनी संतान या अधिक व्यापक अर्थ में उसके निकट रक्त-सम्बन्धियों को सूचित कर सकती है।
    reason: cultural_note
lexical_decisions:
- source_word: רוּחִי
  choice: मेरी साँस
  rationale: רוּחַ के अर्थ ‘साँस,’ ‘वायु’ और ‘आत्मा’ हो सकते हैं। पत्नी की शारीरिक अरुचि के इस प्रसंग में ‘साँस’ सबसे उपयुक्त ठोस अर्थ है।
- source_word: זָרָה
  choice: घिनौनी लगती है
  rationale: यह रूप मूलतः पराया या अजनबी होने का भाव रखता है और प्रसंग में विकर्षण व्यक्त करता है। स्वाभाविक हिन्दी में ‘घिनौनी लगती है’ पत्नी की प्रतिक्रिया को स्पष्ट करता है।
- source_word: לְאִשְׁתִּי
  choice: मेरी पत्नी को
  rationale: לְ यहाँ उस व्यक्ति को सूचित करता है जिसे अजीबपन या विकर्षण अनुभव होता है; हिन्दी में ‘पत्नी को’ स्वाभाविक है।
- source_word: וְחַנֹּתִי
  choice: और मैं ... को घृणित हूँ
  rationale: यह कठिन इब्रानी रूप है। मुख्य पाठ में पहली पंक्ति के समानान्तर विकर्षण का अर्थ लिया गया है, पर विनती या कृपा माँगने वाला प्राचीन वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: לִבְנֵי בִטְנִי
  choice: अपने ही शरीर के पुत्रों
  rationale: शाब्दिक शारीरिक-वंशगत बिंब को बनाए रखा गया है। यह पद अय्यूब की अपनी संतान या अधिक व्यापक रूप से निकट रक्त-सम्बन्धियों की ओर संकेत कर सकता है; इस अनिश्चितता को पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: וְחַנֹּתִי का अनिश्चित अर्थ
  choice: 'मुख्य पाठ में सामाजिक विकर्षण: ‘मैं ... को घृणित हूँ’'
  alternative: ‘मेरी विनती ... से है’ या ‘मैं ... से कृपा की भीख माँगता हूँ’
  rationale: समानान्तर पहली पंक्ति और आस-पास के सामाजिक त्याग के प्रसंग के कारण विकर्षण वाला अर्थ मुख्य पाठ में सुगठित है, किन्तु इब्रानी रूप कठिन है; इसलिए विनती वाला अर्थ दबाया नहीं गया।
- issue: ‘मेरे शरीर के पुत्रों’ की पहचान
  choice: शाब्दिक संबंध-सूचक अभिव्यक्ति को मुख्य पाठ में बनाए रखना
  alternative: ‘मेरी अपनी संतान’ या ‘मेरे निकट रक्त-सम्बन्धी’
  rationale: व्यक्ति-समूह की ठीक पहचान निश्चित नहीं है। किसी एक पहचान को धर्मवैचारिक या कथात्मक आधार पर तय करने के बजाय मूल अभिव्यक्ति और उसकी व्यापक सम्भावना सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘अपने ही शरीर के पुत्रों’ में मूल का असामान्य शारीरिक बिंब जानबूझकर सुरक्षित है; उसकी सम्भावित व्याप्ति पादटिप्पणी में स्पष्ट की गई है।
