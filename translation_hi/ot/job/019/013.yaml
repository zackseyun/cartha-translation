base_translation:
  language: en
  yaml_path: translation/ot/job/019/013.yaml
  text: He has driven my brothers far from me[b][a], and those who know me are wholly estranged from me.
translation:
  language: hi
  text: उसने मेरे भाइयों को मुझसे दूर कर दिया है[a], और जो मुझे जानते हैं, वे मुझसे बिल्कुल अजनबी हो गए हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने मेरे भाइयों को मुझसे अलग कर दिया है।”
    reason: lexical_alternative
  - marker: b
    text: या, “मेरे परिचित लोग मुझसे पूरी तरह अजनबी हो गए हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַי
  choice: मेरे भाइयों
  rationale: यह ‘भाई’ का बहुवचन रूप है, जिस पर प्रथम पुरुष एकवचन संबंधसूचक प्रत्यय लगा है। संदर्भ में इसका अर्थ निकट संबंधियों तक फैल सकता है, फिर भी ‘मेरे भाइयों’ मूल शब्द के रूप और सामाजिक भाव को सीधे बनाए रखता है।
- source_word: מֵעָלַי
  choice: मुझसे दूर
  rationale: הִרְחִיק के साथ यह पदबंध अय्यूब की उपस्थिति और निकटता से दूर किए जाने का भाव देता है। ‘मुझसे दूर’ स्वाभाविक हिन्दी में दूरी और अलगाव दोनों व्यक्त करता है।
- source_word: הִרְחִיק
  choice: दूर कर दिया है
  rationale: רחק का हिफ़ील पूर्ण रूप किसी को दूर करने या दूरी पर कर देने का कारणवाचक अर्थ देता है। ‘दूर कर दिया है’ इस अर्थ को सहज और स्पष्ट हिन्दी में रखता है।
- source_word: וְיֹדְעַי
  choice: मेरे जान-पहचान के लोग
  rationale: शाब्दिक अर्थ ‘मुझे जाननेवाले’ है। यहाँ यह अय्यूब से परिचित लोगों को दर्शाता है; ‘मेरे जान-पहचान के लोग’ आधुनिक हिन्दी में संबंध और परिचय का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: אַךְ
  choice: बिलकुल
  rationale: यहाँ אַךְ अगले कथन पर बल देकर अलगाव की पूर्णता बताता है। ‘बिलकुल’ सामान्य आधुनिक हिन्दी में उसी तीव्रता को व्यक्त करता है।
- source_word: זָרוּ
  choice: पराए हो गए हैं
  rationale: यह क्रिया इस संदर्भ में अजनबी या पराया हो जाने और वैसा व्यवहार करने का परिणामसूचक भाव रखती है। ‘पराए हो गए हैं’ संबंध-विच्छेद को स्वाभाविक और भावपूर्ण हिन्दी में व्यक्त करता है।
- source_word: מִמֶּנִּי
  choice: मुझसे
  rationale: מן के साथ प्रथम पुरुष एकवचन प्रत्यय अलगाव का संकेत देता है—वे अय्यूब से पराए हो गए हैं।
theological_decisions:
- issue: הִרְחִיק का निहित कर्ता
  choice: ‘उसने’ के द्वारा निहित तृतीय पुरुष एकवचन कर्ता को बनाए रखा गया है।
  alternative: ‘परमेश्वर ने’ कहकर कर्ता को स्पष्ट करना।
  rationale: इब्रानी क्रिया का कर्ता पद में व्यक्त नहीं है, यद्यपि निकट संदर्भ से उसका संकेत परमेश्वर की ओर है। ‘उसने’ मूल की संक्षिप्तता और अय्यूब के आरोप की धार्मिक तनावपूर्णता को बिना अतिरिक्त स्पष्टता जोड़े बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और विलाप के अनुकूल भाव रखा गया है। ‘पराए हो गए हैं’ संबंध टूटने की पीड़ा को साधारण पाठक के लिए स्पष्ट करता है, जबकि पादटिप्पणी अधिक शाब्दिक विकल्प सुरक्षित रखती है।
