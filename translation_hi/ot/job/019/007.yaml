  yaml_path: translation/ot/job/019/007.yaml
  text: Look[a], I cry out, “Violence!” but I am not answered; I cry for help[c][b], but there is no justice.
translation:
  language: hi
  text: देखो[a], मैं पुकारता हूँ, “अत्याचार!” पर मुझे उत्तर नहीं मिलता; मैं सहायता के लिए गुहार लगाता हूँ[b], पर कोई न्याय नहीं है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “लो” अथवा “निश्चय ही।” इब्रानी शब्द बल देकर ध्यान खींचता है।
    reason: lexical_alternative
  - marker: b
    text: या “मैं सहायता के लिए चिल्लाता हूँ।” इब्रानी क्रिया संकट में सहायता की अत्यावश्यक पुकार को दर्शाती है।
    reason: lexical_alternative
  - marker: c
    text: या “कोई उचित निर्णय नहीं है” अथवा “कोई कानूनी प्रतिकार नहीं है।” इब्रानी शब्द में न्याय और उचित न्यायिक निर्णय, दोनों का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: देखो
  rationale: यह ध्यान खींचने वाला बलयुक्त उद्गार है; ‘देखो’ आधुनिक और स्वाभाविक हिन्दी में उसके संकेतात्मक जोर को बनाए रखता है।
- source_word: אֶצְעַק
  choice: मैं पुकारता हूँ
  rationale: צעק संकट में ऊँची और तीव्र पुकार को व्यक्त करता है; ‘पुकारता हूँ’ हिन्दी में स्वाभाविक है और अगले समानांतर क्रियापद से पर्याप्त भिन्न भी रहता है।
- source_word: חָמָס
  choice: अत्याचार
  rationale: यह संज्ञा हिंसा, अन्यायपूर्ण कृत्य या ऐसे कृत्य के विरुद्ध कानूनी पुकार बता सकती है। प्रसंग में ‘अत्याचार!’ पीड़ित की शिकायत को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि अन्य अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: אֵעָנֶה
  choice: मुझे उत्तर नहीं मिलता
  rationale: ענה के निफ़अल रूप का सीधा अर्थ ‘उत्तर दिया जाना’ है। यह अनसुना किए जाने की व्याख्या जोड़ने के बजाय उत्तर न मिलने को स्पष्ट रखता है।
- source_word: אֲשַׁוַּע
  choice: मैं सहायता के लिए दुहाई देता हूँ
  rationale: यह क्रिया संकट में सहायता की अत्यावश्यक पुकार दर्शाती है। ‘दुहाई देता हूँ’ शिकायत और सहायता की गुहार, दोनों का भाव रखता है।
- source_word: מִשְׁפָּט
  choice: न्याय
  rationale: यहाँ शब्द न्याय, उचित निर्णय और कानूनी प्रतिकार का क्षेत्र समेटता है। ‘न्याय’ सामान्य पाठक के लिए स्वाभाविक है और नैतिक-कानूनी बल बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के विरुद्ध अय्यूब की शिकायत का स्वरूप
  choice: अनुत्तरित पुकार और न्याय के अभाव पर अय्यूब की तीखी शिकायत को बिना नरम किए प्रस्तुत किया गया है।
  alternative: ऐसी अप्रत्यक्ष भाषा अपनाना जिससे यह संकेत कम हो कि परमेश्वर न्याय नहीं दे रहे।
  rationale: इब्रानी पाठ अय्यूब की पुकार, उत्तर न मिलने और न्याय न मिलने को स्पष्ट रूप से साथ रखता है। अनुवाद इस धर्मवैचारिक तनाव का समाधान किए बिना उसे सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; काव्यात्मक समानांतरता, कानूनी शिकायत का स्वर और अय्यूब की तीखी व्यथा बनाए रखते हुए भाषा सामान्य पाठक के लिए स्पष्ट और गरिमापूर्ण रखी गई है।
