base_translation:
  language: en
  yaml_path: translation/ot/job/019/011.yaml
  text: His anger burns against me[a], and he counts me as his enemies.
translation:
  language: hi
  text: उसका क्रोध मेरे विरुद्ध भड़क उठा,[a] और उसने मुझे अपने शत्रुओं में गिना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसका क्रोध मेरे विरुद्ध जल उठा, और उसने मुझे अपने विरोधियों में से एक माना।”
    reason: क्रिया חרה के ‘जल उठना’ वैकल्पिक रूपक और צָר के ‘विरोधी’ वैकल्पिक अर्थ को दर्शाता है; दोनों क्रियाओं का भूतकाल तथा बहुवचन बना रहता है।
lexical_decisions:
- source_word: וַיַּחַר
  choice: भड़क उठा है
  rationale: חרה के साथ אַף क्रोध के भड़कने या जलने का मुहावरा है। ‘भड़क उठा है’ रूपक और इब्रानी के पूर्ण घटना-पक्ष को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: עָלַי
  choice: मेरे विरुद्ध
  rationale: क्रोध के संदर्भ में עַל उस व्यक्ति की ओर निर्देशित विरोध को दर्शाता है; ‘मेरे विरुद्ध’ इसका सहज हिन्दी रूप है।
- source_word: אַפּוֹ
  choice: उसका क्रोध
  rationale: אַף का शाब्दिक अर्थ ‘नाक’ है, पर इस मुहावरे में इसका अर्थ ‘क्रोध’ है।
- source_word: וַיַּחְשְׁבֵנִי
  choice: वह मुझे ... गिनता है
  rationale: חשב यहाँ किसी को किसी वर्ग का समझने या मानने के अर्थ में है। ‘गिनता है’ मूल अभिव्यक्ति के निकट और हिन्दी में स्पष्ट है।
- source_word: לוֹ
  choice: अपने
  rationale: दत्तिव सर्वनाम सम्बन्ध या दृष्टिकोण बताता है; हिन्दी में आत्मवाचक ‘अपने’ उसी कर्ता से सम्बन्ध स्पष्ट करता है।
- source_word: כְצָרָיו
  choice: शत्रुओं में
  rationale: צָר का अर्थ शत्रु या विरोधी है। बहुवचन को बनाए रखते हुए ‘अपने शत्रुओं में गिनता है’ हिन्दी में स्वाभाविक ढंग से ‘अपने शत्रुओं जैसा/उनमें से एक मानता है’ का अर्थ देता है।
theological_decisions:
- issue: तीसरे पुरुष के कर्ता और प्रत्ययों का संकेत
  choice: कर्ता परमेश्वर ही रहता है, जैसा अय्यूब 19:6-12 के प्रसंग में है।
  alternative: कोई अनिर्दिष्ट शत्रुतापूर्ण कर्ता
  rationale: निकटवर्ती प्रसंग में अय्यूब इन कार्यों को परमेश्वर से जोड़ता है। अनुवाद इस कठोर धर्मवैचारिक तनाव को नरम किए बिना बनाए रखता है; फिर भी पद में ‘परमेश्वर’ नाम जोड़कर अंतर्निहित कर्ता को स्पष्ट नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। काव्यात्मक क्रोध-रूपक तथा ‘शत्रुओं’ का असामान्य बहुवचन सुरक्षित रखा गया है।
