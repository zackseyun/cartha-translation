  text: कब तक तुम मेरे प्राण को पीड़ा देते रहोगे और शब्दों से मुझे कुचलते रहोगे?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कब तक तुम मुझे भीतर से दुःखी करते रहोगे और शब्दों से मुझे कुचलते रहोगे?”
    reason: תּוֹגְיוּן और נַפְשִׁי के संयुक्त अर्थ की वैकल्पिक, अधिक अर्थगत प्रस्तुति।
lexical_decisions:
- source_word: עַד אָנָה
  choice: कब तक
  rationale: यह इब्रानी की स्वाभाविक कालवाचक विलाप-अभिव्यक्ति है; ‘कब तक’ उसका प्रश्नात्मक और भावात्मक बल सहज हिन्दी में बनाए रखता है।
- source_word: תּוֹגְיוּן
  choice: पीड़ा देते रहोगे
  rationale: हिफ़ील रूप यहाँ भीतर तक दुःख पहुँचाने या सताने का भाव देता है। ‘पीड़ा देते रहोगे’ निरंतरता और आंतरिक कष्ट दोनों व्यक्त करता है।
- source_word: נַפְשִׁי
  choice: मेरे प्राण को
  rationale: נֶפֶשׁ व्यक्ति के जीवित और आंतरिक स्व को सूचित कर सकता है। ‘मेरे प्राण को’ मूल की स्पष्ट संज्ञा और भावात्मक गहराई को बनाए रखता है, यद्यपि प्रसंग में अर्थ ‘मुझे’ भी हो सकता है।
- source_word: וּתְדַכְּאוּנַנִי
  choice: और ... मुझे कुचलते रहोगे
  rationale: דכא में कुचलने या तोड़ डालने की तीखी रूपकात्मक शक्ति है। ‘कुचलते रहोगे’ उसे सुरक्षित रखते हुए पहले क्रिया-खंड की निरंतरता से मेल खाता है।
- source_word: בְמִלִּים
  choice: शब्दों से
  rationale: यहाँ בְ साधन का बोध कराता है; मित्रों के शब्द ही कुचलने का माध्यम हैं।
