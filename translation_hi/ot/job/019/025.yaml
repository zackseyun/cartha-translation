source:
  edition: WLC
  text: וַ/אֲנִ֣י יָ֭דַעְתִּי גֹּ֣אֲלִ/י חָ֑י וְ֝/אַחֲר֗וֹן עַל עָפָ֥ר יָקֽוּם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/025.yaml
  text: But as for me[a], I know that my Redeemer lives[c][b], and afterward he will rise over the dust.
translation:
  language: hi
  text: परन्तु मैं जानता हूँ कि मेरा छुड़ानेवाला[a] जीवित है, और अन्त में वह धूल पर खड़ा होगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरा पक्ष लेकर न्याय दिलानेवाला।” इब्रानी शब्द उस निकट संबंधी रक्षक को दर्शा सकता है जो छुड़ाता है, बचाव करता है या अपने संबंधी के पक्ष में न्याय की माँग करता है।
    reason: lexical_alternative
  - marker: b
    text: 'इस कठिन इब्रानी वाक्यांश का अनुवाद यह भी हो सकता है: “और बाद में वह धूल के ऊपर उठेगा,” या “और अन्तिम के रूप में वह धूल पर खड़ा होगा।” “धूल” मृत्यु, कब्र या धरती की ओर संकेत कर सकती है; इब्रानी में शब्दशः “धूल” है।'
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲנִי
  choice: परन्तु मैं
  rationale: स्वतंत्र सर्वनाम के साथ संयोजक प्रसंग में अय्यूब के व्यक्तिगत और विरोधात्मक दृढ़ कथन पर बल देता है।
- source_word: יָדַעְתִּי
  choice: मैं जानता हूँ
  rationale: इब्रानी पूर्ण क्रिया यहाँ वर्तमान में प्रभावी, दृढ़ विश्वास व्यक्त करती है।
- source_word: גֹּאֲלִי
  choice: मेरा छुड़ानेवाला
  rationale: גאל उस निकट संबंधी रक्षक को दर्शा सकता है जो छुड़ाता, बचाव करता या किसी का पक्ष लेकर न्याय दिलाता है। यह चयन अर्थ की व्यापकता और पारंपरिक धार्मिक अनुगूँज दोनों बनाए रखता है।
- source_word: חָי
  choice: जीवित है
  rationale: विधेय विशेषण का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: וְאַחֲרוֹן
  choice: और अन्त में
  rationale: אַחֲרוֹן का कालवाचक अर्थ यहाँ संभव है; फिर भी 'अन्तिम जन के रूप में' वाला संज्ञात्मक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: עַל עָפָר
  choice: धूल पर
  rationale: शाब्दिक बिंब को बनाए रखता है और 'धरती' अथवा 'कब्र' के रूप में समयपूर्व व्याख्या नहीं करता।
- source_word: יָקוּם
  choice: खड़ा होगा
  rationale: קום का सामान्य अर्थ उठना अथवा खड़ा होना है; 'खड़ा होगा' עַל עָפָר के साथ स्वाभाविक है और पुनरुत्थान का अर्थ अनिवार्य नहीं बनाता।
theological_decisions:
- issue: अय्यूब के גֹּאֵל की पहचान और भूमिका
  choice: '''मेरा छुड़ानेवाला'' रखा गया है, पर उसकी पहचान परमेश्वर, किसी स्वर्गीय साक्षी या मसीह के रूप में स्पष्ट नहीं की गई।'
  alternative: '''मेरा पक्ष लेकर न्याय दिलानेवाला'' अथवा ''मेरा निकट संबंधी छुड़ानेवाला'''
  rationale: इब्रानी पद स्वयं उस व्यक्ति की पहचान निश्चित नहीं करता। व्यापक अनुवाद धार्मिक अनुगूँज बनाए रखते हुए किसी एक धर्मवैज्ञानिक निष्कर्ष को पाठ पर नहीं थोपता।
- issue: וְאַחֲרוֹן ... יָקוּם का अन्तकाल-संबंधी आशय
  choice: मुख्य पाठ में 'अन्त में वह धूल पर खड़ा होगा'
  alternative: '''बाद में वह धूल के ऊपर उठेगा'' अथवा ''अन्तिम जन के रूप में वह धूल पर खड़ा होगा'''
  rationale: वाक्य-विन्यास और धर्मवैज्ञानिक आशय विवादित हैं। मुख्य पाठ संभावित कालवाचक अर्थ देता है, जबकि पादटिप्पणी वैकल्पिक संज्ञात्मक और स्थानवाचक समझ को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। 'छुड़ानेवाला' धार्मिक अनुगूँज और व्यापक कानूनी-पारिवारिक अर्थ को बनाए रखता है। विवादित अंतिम खंड को मुख्य पाठ में सहज रखा गया है और वास्तविक अस्पष्टता पादटिप्पणी में स्पष्ट की गई है।
