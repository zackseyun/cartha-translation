  yaml_path: translation/ot/job/019/010.yaml
  text: He tears me down on every side[a], and I am gone; he has uprooted my hope like a tree.
translation:
  language: hi
  text: वह मुझे चारों ओर से ढा देता है[a], और मैं मिट जाता हूँ; वह मेरी आशा को पेड़ की तरह जड़ से उखाड़ देता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और मैं चला जाता हूँ” अथवा “और मैं नष्ट हो जाता हूँ।” इब्रानी में शाब्दिक रूप से “और मैं जाता हूँ” है; सम्भवतः इसका अर्थ है कि चारों ओर से ढा दिए जाने के कारण अय्यूब मिट जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְּצֵנִי
  choice: मुझे ... ढा देता है
  rationale: נתץ का अर्थ किसी निर्मित या खड़ी वस्तु को ढा देना अथवा नष्ट करना है। यह चयन अय्यूब के सर्वांगीण विनाश की छवि को स्वाभाविक हिन्दी में रखता है।
- source_word: סָבִיב
  choice: चारों ओर से
  rationale: यह क्रियाविशेषण चारों तरफ़ से होने वाले व्यापक आक्रमण या विनाश को व्यक्त करता है।
- source_word: וָאֵלַךְ
  choice: और मैं मिट जाता हूँ
  rationale: शाब्दिक अर्थ ‘और मैं चला जाता हूँ’ है; यहाँ परिणामस्वरूप समाप्त या नष्ट हो जाने का भाव है। ‘मिट जाता हूँ’ प्रसंग में स्वाभाविक है, जबकि शाब्दिक विकल्प पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וַיַּסַּע
  choice: जड़ से उखाड़ देता है
  rationale: נסע में किसी जमी या गड़ी वस्तु को निकालने का भाव हो सकता है। पेड़ की उपमा के साथ ‘जड़ से उखाड़ना’ विनाश की छवि स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: כָּעֵץ
  choice: पेड़ की तरह
  rationale: तुलनासूचक כ־ और עֵץ का सीधा, सहज हिन्दी रूप।
- source_word: תִּקְוָתִי
  choice: मेरी आशा
  rationale: תִּקְוָה का सामान्य अर्थ ‘आशा’ या ‘अपेक्षा’ है; विलाप के इस प्रसंग में ‘आशा’ सबसे उपयुक्त है।
