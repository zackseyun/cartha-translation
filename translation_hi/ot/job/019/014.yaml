lexical_decisions:
- source_word: חָדְלוּ
  choice: मेरा साथ छोड़ दिया है
  rationale: मूल क्रिया का आधारभूत अर्थ ‘रुक जाना/समाप्त हो जाना’ है। संबंधियों को कर्ता मानकर यह स्वाभाविक हिन्दी अभिव्यक्ति उनके संबंध और सहारे से पीछे हट जाने का भाव व्यक्त करती है, बिना यह जोड़ने के कि वे मर गए या कहीं चले गए।
- source_word: קְרוֹבָי
  choice: मेरे निकट संबंधियों
  rationale: קָרוֹב का शाब्दिक भाव ‘निकट व्यक्ति’ है और यहाँ उससे परिजन या करीबी संबंधी अभिप्रेत हैं। ‘निकट संबंधी’ पारिवारिक निकटता को स्पष्ट और आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וּמְיֻדָּעַי
  choice: मेरे जान-पहचान वालों
  rationale: ידע से बना यह रूप उन लोगों को सूचित करता है जो अय्यूब को जानते-पहचानते थे। ‘जान-पहचान वाले’ मूल की व्यापकता बनाए रखता है और ‘मित्र’ कहकर अनावश्यक घनिष्ठता नहीं जोड़ता।
- source_word: שְׁכֵחוּנִי
  choice: मुझे भुला दिया है
  rationale: שׁכח का सीधा अर्थ ‘भूलना’ है। ‘मुझे भुला दिया’ विलाप के संबंधपरक और जानबूझकर उपेक्षित किए जाने जैसे प्रभाव को स्वाभाविक हिन्दी में प्रकट करता है, जबकि मूल क्रिया के अर्थ से जुड़ा रहता है।
