  text: with an iron stylus and lead[b][a], may they be engraved in the rock forever!
translation:
  language: hi
  text: लोहे की लेखनी और सीसे से[a] वे सदा के लिए चट्टान में खोद दिए जाएँ![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: सीसा लोहे के औज़ार के साथ प्रयुक्त धातु हो सकता है—संभवतः कटे हुए अक्षरों को अधिक स्पष्ट दिखाने के लिए उनमें भरा जाता था—पर पाठ स्वयं यह नहीं बताता।
    reason: cultural_note
  - marker: b
    text: या ‘वे सदा के लिए चट्टान में काट दिए जाएँ।’ इब्रानी क्रिया का सामान्य अर्थ ‘काटना’ या ‘खोदना’ है; यहाँ आशय शब्दों को स्थायी रूप से अंकित करने से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֵט
  choice: लेखनी से
  rationale: עֵט लिखने या अंकित करने के उपकरण को दर्शाता है। लोहे और चट्टान के संदर्भ में यहाँ स्याही वाली कलम नहीं, बल्कि खोदकर लिखने की लेखनी अभिप्रेत है।
- source_word: בַּרְזֶל
  choice: लोहे की
  rationale: यह धातु के लिए सीधा और स्वाभाविक हिन्दी शब्द है तथा लेखनी की सामग्री बताता है।
- source_word: וְעֹפָרֶת
  choice: और सीसे से
  rationale: עֹפָרֶת का अर्थ धातु ‘सीसा’ है। पाठ सीसे के उपयोग की विधि स्पष्ट नहीं करता, इसलिए केवल मूल कथन रखा गया है।
- source_word: לָעַד
  choice: सदा के लिए
  rationale: यह स्थायी बने रहने की कामना व्यक्त करता है; ‘सदा के लिए’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: בַּצּוּר
  choice: चट्टान में
  rationale: צוּר का अर्थ चट्टान है। ‘में’ उन अक्षरों का भाव देता है जो सतह के भीतर काटकर बनाए गए हों।
- source_word: יֵחָצְבוּן
  choice: वे ... खोद दिए जाएँ
  rationale: חצב का सामान्य अर्थ काटना या खोदना है। यहाँ इसका संबंध शब्दों को चट्टान में स्थायी रूप से अंकित करने से है। इच्छासूचक क्रिया-भाव को ‘दिए जाएँ’ से बनाए रखा गया है।
