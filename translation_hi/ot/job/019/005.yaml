  choice: मेरी बदनामी
  rationale: यह शब्द निंदा, सामाजिक अपमान और उससे उपजी लज्जा को व्यक्त कर सकता है। ‘बदनामी’ सामान्य आधुनिक पाठक के लिए स्वाभाविक है और यहाँ मित्रों द्वारा अय्यूब की अपमानजनक दशा को उसके विरुद्ध इस्तेमाल करने के भाव से मेल खाता है।
