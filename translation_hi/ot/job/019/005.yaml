  rationale: हिफ़ील क्रिया यहाँ अय्यूब की कीमत पर अपने को बड़ा करने या श्रेष्ठ ठहराने का भाव रखती है। ‘मेरे विरुद्ध’ विरोधी संबंध को स्पष्ट करता है और मूल की ‘बड़ा’ वाली छवि बचाता है।
- source_word: וְתוֹכִיחוּ
  choice: प्रमाण बनाते हो
  rationale: יכח के हिफ़ील रूप में तर्क देकर सिद्ध करने या मुकदमे जैसा मामला स्थापित करने का भाव हो सकता है। संज्ञा के साथ ‘प्रमाण बनाते हो’ आधुनिक हिन्दी में उस न्यायिक भाव को सहज रूप देता है।
