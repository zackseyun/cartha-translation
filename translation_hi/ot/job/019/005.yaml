    text: या, “मेरी बदनामी को मेरे विरुद्ध तर्क के रूप में पेश करते हो” अथवा “मेरी बदनामी से मेरे विरुद्ध मामला सिद्ध करते हो।” इब्रानी क्रिया में तर्क करने या किसी मामले को सिद्ध करने का न्यायिक भाव हो सकता है।
