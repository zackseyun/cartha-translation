  naturalness: The Hindi is clear, modern, and suitably dignified for narrative speech. “धावा बोलकर,” “तलवार की धार से मार डाला,” and “केवल मैं ही बच निकला हूँ” are idiomatic. The respectful “आपको” is appropriate for a servant addressing his master.
  terminology: “जवानों” preserves the lexical possibility of young men while the cultural footnote responsibly notes their likely role as Job’s livestock attendants. The footnotes for “शबा” and the sword idiom are accurate and well anchored.
