translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘आपको’ से सेवक द्वारा स्वामी को संबोधित करने का सम्मान प्रकट होता है। मुख्य पाठ में ‘शबा के लोग’ समुदायगत आशय स्पष्ट करता है, जबकि फुटनोट मूल की संक्षिप्त अभिव्यक्ति सुरक्षित रखता है।
