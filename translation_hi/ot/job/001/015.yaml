base_translation:
  language: en
  yaml_path: translation/ot/job/001/015.yaml
  text: And Sheba fell upon them and took them[a], and they struck down the young men with the edge of the sword[c][b]; and I alone have escaped to tell you.
translation:
  language: hi
  text: तभी शबा के लोगों ने उन पर धावा बोलकर पशुओं को छीन लिया[a], और जवानों को तलवार की धार से मार डाला[b][c]। केवल मैं ही बच निकला हूँ कि आपको यह समाचार दूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में केवल ‘शबा’ है, अर्थात शबा से आए लुटेरे।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से ‘तलवार के मुँह से’ है; यह तलवार की धार से मार डालने का मुहावरा है।
    reason: lexical_alternative
  - marker: c
    text: ‘जवान’ से आशय संभवतः पशुओं की देखभाल करनेवाले अय्यूब के सेवकों से है।
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּפֹּל שְׁבָא
  choice: शबा के लोगों ने उन पर धावा बोला
  rationale: शाब्दिक रूप से पाठ में ‘शबा उन पर टूट पड़ा’ है; यहाँ स्थान/पूर्वज के नाम से आए लुटेरे समुदाय का बोध होता है। ‘धावा बोला’ अचानक शत्रुतापूर्ण आक्रमण को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַתִּקָּחֵם
  choice: पशुओं को छीन लिया
  rationale: पुल्लिंग बहुवचन प्रत्यय पिछले पद के बैलों और गधियों की ओर संकेत करता है। हिन्दी में अस्पष्ट ‘उन्हें’ के स्थान पर संदर्भगत संज्ञा स्पष्ट करना स्वाभाविक है।
- source_word: הַנְּעָרִים
  choice: जवानों
  rationale: נְעָרִים का अर्थ युवक, सेवक या परिचारक हो सकता है। मुख्य पाठ में निकटतम शाब्दिक अर्थ ‘जवान’ रखा गया है; उनकी सेवकीय भूमिका फुटनोट में बताई गई है।
- source_word: הִכּוּ לְפִי חָרֶב
  choice: तलवार की धार से मार डाला
  rationale: इब्रानी मुहावरे का शाब्दिक रूप ‘तलवार के मुँह से’ है। ‘तलवार की धार से’ मूल बिंब बचाता है और ‘मार डाला’ परिणाम को स्पष्ट करता है।
- source_word: וָאִמָּלְטָה רַק אֲנִי לְבַדִּי
  choice: केवल मैं ही बच निकला हूँ
  rationale: रचना जीवित बचे एकमात्र संदेशवाहक पर प्रबल बल देती है। वर्तमान पूर्ण रूप उसके अभी तक बचे होने की अवस्था को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְהַגִּיד לָךְ
  choice: कि आपको यह समाचार दूँ
  rationale: संदर्भ औपचारिक सूचना देने का है; ‘समाचार दूँ’ आधुनिक, गरिमापूर्ण हिन्दी में संदेशवाहक की भूमिका स्पष्ट करता है।
