  yaml_path: translation/ot/job/001/004.yaml
  text: His sons would go and hold a feast[a], each in his own house on his day, and they would send and invite their three sisters to eat and drink with them.
translation:
  language: hi
  text: उसके बेटे अपने-अपने दिन पर अपने-अपने घर में जाकर भोज किया करते थे। वे अपनी तीनों बहनों को अपने साथ खाने-पीने के लिए संदेश भेजकर बुलाते थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָלְכוּ
  choice: जाकर … किया करते थे
  rationale: संदर्भ में क्रिया बीते समय की नियमित प्रथा बताती है; ‘किया करते थे’ इस आदतन भाव को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि ‘जाकर’ मूल क्रिया को बनाए रखता है।
- source_word: בָנָיו
  choice: उसके बेटे
  rationale: मूल शब्द पुल्लिंग बहुवचन है और बहनों का उल्लेख अलग से किया गया है।
- source_word: וְעָשׂוּ מִשְׁתֶּה
  choice: भोज किया करते थे
  rationale: शाब्दिक अर्थ ‘भोज बनाना/करना’ है; ‘भोज करना’ उत्सवपूर्ण सामूहिक भोजन को सहज और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: בֵּית אִישׁ
  choice: अपने-अपने घर में
  rationale: यह रचना वितरणात्मक अर्थ देती है—हर बेटा अपनी बारी में अपने घर पर भोज करता था।
- source_word: יוֹמוֹ
  choice: अपने-अपने दिन
  rationale: मूल इब्रानी में शाब्दिक रूप से ‘उसका दिन’ है। इसे मुख्य पाठ में अस्पष्ट ही रखा गया है; यह नियत बारी का दिन या जन्मदिन हो सकता है।
- source_word: וְשָׁלְחוּ וְקָרְאוּ
  choice: बुलावा भेजते थे
  rationale: दोनों क्रियाएँ संदेश भेजकर निमंत्रण देने की संयुक्त क्रिया दर्शाती हैं। हिन्दी मुहावरा ‘बुलावा भेजना’ दोनों का अर्थ स्वाभाविक रूप से समेटता है।
- source_word: לִשְׁלֹשֶׁת אֲחִיתֵיהֶם
  choice: अपनी तीनों बहनों को
  rationale: संख्या और संबंध दोनों निश्चित हैं; ‘तीनों’ बताता है कि उनकी सभी तीन बहनें अभिप्रेत हैं।
- source_word: לֶאֱכֹל וְלִשְׁתּוֹת
  choice: खाने-पीने के लिए
  rationale: यह भोज में सम्मिलित होकर खाने और पीने की सामान्य क्रिया को सहज हिन्दी में व्यक्त करता है।
- source_word: עִמָּהֶם
  choice: अपने साथ
  rationale: यह भाइयों के साथ मिलकर भोज में भाग लेने का भाव स्पष्ट करता है।
