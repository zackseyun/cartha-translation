base_translation:
  language: en
  yaml_path: translation/ot/job/001/019.yaml
  text: And behold[a], a great wind came from across the wilderness and struck the four corners of the house, and it fell on the young men, and they died[b]; and I alone have escaped to tell you.
translation:
  language: hi
  text: और देखो, मरुभूमि के पार से एक प्रचण्ड हवा[a] आई। उसने घर के चारों कोनों पर प्रहार किया, और घर उन जवानों पर गिर पड़ा और वे मर गए[b]। केवल मैं ही तुझे बताने के लिए बच निकला हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “एक बड़ी हवा” अथवा “एक प्रचण्ड आँधी।”
    reason: lexical_alternative
  - marker: b
    text: मूल इब्रानी में “जवान”; इस शब्द का अर्थ “युवक” और कुछ प्रसंगों में “सेवक” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: यह अभिव्यक्ति समाचार के चरम बिंदु को सजीव और तत्काल बनाती है। आधुनिक हिन्दी में ‘देखो’ स्वाभाविक है और मूल के संकेतात्मक बल को बनाए रखता है।
- source_word: רוּחַ גְּדוֹלָה
  choice: एक प्रचण्ड हवा
  rationale: इस प्रसंग में רוּחַ का अर्थ हवा है। ‘प्रचण्ड’ उसकी असाधारण शक्ति और विनाशकारी प्रभाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בָּאָה מֵעֵבֶר הַמִּדְבָּר
  choice: जंगल के पार से ... आई
  rationale: מֵעֵבֶר का अर्थ दूसरी ओर या पार से है। ‘जंगल के पार से’ दिशा को सुरक्षित रखता है और अनावश्यक भौगोलिक विवरण नहीं जोड़ता।
- source_word: וַיִּגַּע בְּאַרְבַּע פִּנּוֹת הַבַּיִת
  choice: उसने घर के चारों कोनों पर प्रहार किया
  rationale: נגע का अर्थ छूना, पहुँचना या आघात करना हो सकता है। विनाशकारी परिणाम के कारण ‘प्रहार किया’ प्रसंगानुकूल है।
- source_word: וַיִּפֹּל עַל הַנְּעָרִים
  choice: और घर उन जवानों पर गिर पड़ा
  rationale: एकवचन क्रिया का कर्ता घर है; हिन्दी में उसे स्पष्ट दोहराने से संदर्भ स्वाभाविक और निर्भ्रांत रहता है। ‘जवानों’ से मूल के पुल्लिंग बहुवचन को संरक्षित किया गया है।
- source_word: הַנְּעָרִים
  choice: जवानों
  rationale: यह शब्द जवान पुरुषों, युवकों या कुछ प्रसंगों में सेवकों को सूचित कर सकता है। मुख्य पाठ में ‘जवानों’ मूल के पुल्लिंग रूप को बिना ‘सेवक’ अर्थ आरोपित किए रखता है।
- source_word: וַיָּמֻתוּ
  choice: और वे मर गए
  rationale: यह מות का सीधा अनुवाद है और मूल में निहित न होने वाली कारकवाचक भाषा नहीं जोड़ता।
- source_word: וָאִמָּלְטָה רַק אֲנִי לְבַדִּי
  choice: केवल मैं ही बच निकला हूँ
  rationale: ‘केवल ... ही’ רַק और לְבַדִּי के संयुक्त बल को स्वाभाविक हिन्दी में व्यक्त करता है; पूर्ण वर्तमान वक्ता की वर्तमान बची हुई दशा को दर्शाता है।
- source_word: לְהַגִּיד לָךְ
  choice: कि तुझे यह समाचार दूँ
  rationale: संदेशवाहक के कथन में यह स्वाभाविक हिन्दी है और ‘तुझे बताने’ के उद्देश्य को स्पष्टतः व्यक्त करती है।
theological_decisions:
- issue: הַנְּעָרִים की पहचान
  choice: मुख्य पाठ में ‘जवानों’ और पादटिप्पणी में ‘युवकों’ अथवा ‘सेवकों’ की संभावना
  alternative: ‘बच्चों’ या ‘सेवकों’ को मुख्य पाठ में रखना
  rationale: मूल पुल्लिंग बहुवचन शब्द की पहचान को प्रसंग के आधार पर निश्चित नहीं करता। इसलिए अनुवाद न तो अय्यूब की सभी संतानों से चुपचाप सामंजस्य बैठाता है और न ही उन्हें निश्चित रूप से सेवक ठहराता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक है। ‘और देखो’ मूल की सजीव तत्क्षणता बनाए रखता है; ‘तुझे’ एकवचन संबोधन के अनुरूप है। स्पष्टता के लिए दूसरे वाक्य में ‘घर’ दोहराया गया है।
