base_translation:
  language: en
  yaml_path: translation/ot/job/001/022.yaml
  text: In all this[a], Job did not sin, nor did he charge God with wrongdoing.
translation:
  language: hi
  text: इन सब बातों में अय्यूब ने पाप नहीं किया, और न परमेश्वर को किसी अनुचितता[a] का दोषी ठहराया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “न परमेश्वर पर मूर्खता का आरोप लगाया,” अथवा “न परमेश्वर पर कोई अनुचित बात आरोपित की।”
    reason: תִּפְלָה के अर्थ में ‘मूर्खता,’ ‘अनुचितता,’ या अशोभनीय दोष की संभावनाएँ हैं।
lexical_decisions:
- source_word: בְּכָל זֹאת
  choice: इन सब बातों में
  rationale: यह पदबंध पहले वर्णित सभी घटनाओं और परिस्थितियों को समेटता है। यह हिंदी में स्वाभाविक है और व्यापक अर्थ बनाए रखता है।
- source_word: לֹא חָטָא
  choice: पाप नहीं किया
  rationale: חטא का सीधा और प्रचलित धार्मिक-नैतिक अर्थ ‘पाप करना’ है; इसे सामान्य ‘गलती करना’ कहकर कमजोर नहीं किया गया।
- source_word: אִיּוֹב
  choice: अय्यूब
  rationale: व्यक्तिनाम का हिंदी बाइबल-परंपरा में प्रचलित रूप रखा गया है।
- source_word: וְלֹא נָתַן תִּפְלָה לֵאלֹהִים
  choice: और न परमेश्वर पर किसी अनुचित काम का दोष लगाया
  rationale: शाब्दिक ‘परमेश्वर को अनुचितता नहीं दी’ हिंदी में अस्पष्ट होगा। संदर्भ में נתן के साथ תִּפְלָה किसी दोष या अनुचित बात को परमेश्वर पर आरोपित करने का भाव देता है।
- source_word: תִּפְלָה
  choice: अनुचित काम
  rationale: यह दुर्लभ शब्द मूर्खता, अनुचितता या दोषपूर्ण आचरण का बोध करा सकता है। मुख्य पाठ का चयन नैतिक आशय को सहज हिंदी में व्यक्त करता है, जबकि दूसरी संभावनाएँ पादटिप्पणी में सुरक्षित हैं।
- source_word: לֵאלֹהִים
  choice: परमेश्वर पर
  rationale: ל यहाँ उस व्यक्ति को चिह्नित करता है जिस पर अनुचितता का दोष आरोपित किया जाता; हिंदी मुहावरे में ‘पर ... दोष लगाना’ स्वाभाविक है।
theological_decisions:
- issue: परमेश्वर के संबंध में תִּפְלָה का अर्थ
  choice: परमेश्वर पर किसी अनुचित काम का दोष लगाया
  alternative: परमेश्वर पर मूर्खता का आरोप लगाया; परमेश्वर को किसी अनुचित बात का उत्तरदायी ठहराया
  rationale: मुख्य पाठ यह स्पष्ट करता है कि विपत्ति के बीच अय्यूब ने परमेश्वर को दोषी नहीं ठहराया। फिर भी इब्रानी शब्द के ‘मूर्खता’ और व्यापक ‘अनुचितता’ वाले संभावित अर्थों को पादटिप्पणी में रखा गया है, ताकि वास्तविक शाब्दिक अस्पष्टता बनी रहे।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिंदी। ‘अय्यूब’ और ‘परमेश्वर’ जैसे स्थापित रूप रखे गए हैं; दुर्लभ इब्रानी संज्ञा की अस्पष्टता पादटिप्पणी में सुरक्षित है।
