source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ עָרֹ֨ם יצתי מִ/בֶּ֣טֶן אִמִּ֗/י וְ/עָרֹם֙ אָשׁ֣וּב שָׁ֔מָ/ה יְהוָ֣ה נָתַ֔ן וַ/יהוָ֖ה לָקָ֑ח יְהִ֛י שֵׁ֥ם יְהוָ֖ה מְבֹרָֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/021.yaml
  text: And he said[a], “Naked I came out from my mother’s womb, and naked I will return there. Yahweh gave, and Yahweh has taken away[b]. May the name of Yahweh be blessed.”
translation:
  language: hi
  text: उसने कहा, “मैं अपनी माँ के गर्भ से नंगा निकला, और नंगा ही वहाँ लौटूँगा।[a] याहवे ने दिया, और याहवे ने ले लिया। याहवे का नाम धन्य हो।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ में ‘वहाँ’ है और गंतव्य स्पष्ट नहीं किया गया। यह रूपक के रूप में गर्भ, व्यापक अर्थ में धरती या कब्र, अथवा कुछ भी साथ न होने की अवस्था की ओर संकेत कर सकता है।
    reason: alternative_reading
  - marker: b
    text: 'इब्रानी: ‘YHWH’ (परमेश्वर का निजी नाम), जिसे परंपरागत रूप से ‘प्रभु’ भी लिखा गया है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֹם
  choice: नंगा
  rationale: यह शब्द वस्त्रहीन या सब कुछ से रहित होने का भाव देता है। ‘नंगा’ जन्म की ठोस छवि और संपत्तिहीन अवस्था—दोनों को स्वाभाविक ढंग से बनाए रखता है।
- source_word: יצתי
  choice: मैं ... निकला था
  rationale: יצא यहाँ गर्भ से जन्म लेने के अर्थ में है। ‘निकला था’ आधुनिक हिन्दी में सहज है और मूल की ठोस छवि को रखता है।
- source_word: מִבֶּטֶן אִמִּי
  choice: अपनी माँ के गर्भ से
  rationale: यह मूल इब्रानी वाक्यांश का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: וְעָרֹם אָשׁוּב שָׁמָה
  choice: और नंगा ही वहाँ लौट जाऊँगा
  rationale: ‘नंगा ही’ मूल के आरंभिक बलाघात को दर्शाता है, जबकि ‘वहाँ’ שָׁמָה को स्पष्ट किए बिना उसकी वास्तविक अस्पष्टता बनाए रखता है।
- source_word: יְהוָה
  choice: यहवे
  rationale: चतुरक्षरीय दिव्य नाम को किसी उपाधि से बदलने के बजाय हिन्दी में उसके नाम का लिप्यंतरण किया गया है।
- source_word: נָתַן
  choice: दिया
  rationale: सरल पूर्ण क्रिया मूल के कथन और अगली समानांतर पंक्ति के साथ स्वाभाविक बैठती है।
- source_word: לָקָח
  choice: ले लिया
  rationale: मूल क्रिया का अर्थ ‘लेना’ है; हानि के इस प्रसंग में ‘ले लिया’ पूर्ण हुई क्रिया और उसके वर्तमान परिणाम को सहज हिन्दी में व्यक्त करता है।
- source_word: יְהִי
  choice: '... हो'
  rationale: यह इच्छा या आशीर्वचन व्यक्त करने वाला रूप है; हिन्दी में ‘नाम धन्य हो’ उसी भाव को संक्षेप और गरिमा से व्यक्त करता है।
- source_word: שֵׁם יְהוָה
  choice: यहवे का नाम
  rationale: यह इब्रानी संबंधसूचक संरचना का स्वाभाविक हिन्दी रूप है।
- source_word: מְבֹרָךְ
  choice: धन्य
  rationale: यह निष्क्रिय भाव वाले ‘blessed’ का पारंपरिक और अर्थसंगत हिन्दी रूप है; ‘स्तुति हो’ कहना आशीष के अर्थ को केवल प्रशंसा तक सीमित कर देता।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में निजी दिव्य नाम है। ‘यहवे’ उसे उपाधि से प्रतिस्थापित किए बिना आधुनिक हिन्दी लिपि में प्रस्तुत करता है।
- issue: שָׁמָה (‘वहाँ’) का संदर्भ
  choice: शाब्दिक ‘वहाँ’ को बनाए रखना
  alternative: धरती में लौटना; कब्र में लौटना; माँ के गर्भ में लौटना
  rationale: इब्रानी पाठ गंतव्य को स्पष्ट नहीं करता। ‘वहाँ’ गर्भ, धरती/कब्र अथवा जन्म के समय की संपत्तिहीन अवस्था की ओर संकेत कर सकता है; इसलिए अनुवाद इस तनाव को हल नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक गद्य रखा गया है। ‘नंगा ही’ से मूल का बलाघात और ‘वहाँ’ से उसकी अस्पष्टता सुरक्षित है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
