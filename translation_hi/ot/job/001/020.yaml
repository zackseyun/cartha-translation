source:
  edition: WLC
  text: וַ/יָּ֤קָם אִיּוֹב֙ וַ/יִּקְרַ֣ע אֶת מְעִל֔/וֹ וַ/יָּ֖גָז אֶת רֹאשׁ֑/וֹ וַ/יִּפֹּ֥ל אַ֖רְצָ/ה וַ/יִּשְׁתָּֽחוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/020.yaml
  text: Then Job rose[a], tore his robe, shaved his head, fell to the ground, and bowed down.
translation:
  language: hi
  text: तब अय्यूब उठा, अपना चोगा फाड़ा, सिर मुंडाया, भूमि पर गिर पड़ा और दण्डवत किया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आराधना की।” इब्रानी क्रिया का अर्थ अपने को झुकाना या दण्डवत होना है; यह प्रायः श्रद्धा अथवा आराधना के कार्य के लिए प्रयुक्त होती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: उठा
  rationale: קום का यह रूप कथा में अगली क्रिया को दर्शाता है; ‘उठा’ संक्षिप्त और स्वाभाविक हिन्दी है।
- source_word: מְעִילוֹ
  choice: अपना चोगा
  rationale: מְעִיל एक बाहरी वस्त्र या चोगे को दर्शाता है; ‘चोगा’ शोक में फाड़े गए विशिष्ट बाहरी वस्त्र का भाव स्पष्ट रखता है।
- source_word: וַיִּקְרַע אֶת מְעִילוֹ
  choice: उसने अपना चोगा फाड़ा
  rationale: קרע यहाँ शोक प्रकट करने के लिए वस्त्र फाड़ने की ठोस क्रिया बताता है।
- source_word: וַיָּגָז אֶת רֹאשׁוֹ
  choice: सिर मुंडाया
  rationale: גזז का मूल अर्थ बाल या ऊन काटना है; इस शोक-संदर्भ में ‘सिर मुंडाया’ आधुनिक हिन्दी में क्रिया को सहज रूप से व्यक्त करता है।
- source_word: וַיִּפֹּל אַרְצָה
  choice: भूमि पर गिर पड़ा
  rationale: दिशासूचक אַרְצָה भूमि की ओर गति बताता है; ‘भूमि पर गिर पड़ा’ इसका स्वाभाविक और सजीव अनुवाद है।
- source_word: וַיִּשְׁתָּחוּ
  choice: दण्डवत किया
  rationale: यह क्रिया स्वयं को झुकाने या भूमि पर दण्डवत होने की शारीरिक मुद्रा बताती है और प्रायः श्रद्धा अथवा आराधना के संदर्भ में आती है। ‘दण्डवत किया’ शारीरिक क्रिया और श्रद्धापूर्ण आशय दोनों को रखता है, पर ‘आराधना की’ कहकर अर्थ को केवल धार्मिक क्रिया तक सीमित नहीं करता।
theological_decisions:
- issue: क्या अय्यूब की अंतिम क्रिया को शारीरिक दण्डवत के रूप में रखा जाए या स्पष्ट रूप से ‘आराधना’ कहा जाए
  choice: दण्डवत किया
  alternative: आराधना की
  rationale: इब्रानी क्रिया झुकने अथवा दण्डवत होने की शारीरिक क्रिया को सीधे व्यक्त करती है, जो संदर्भ में परमेश्वर के प्रति श्रद्धा और आराधना का कार्य है। मुख्य पाठ में ‘दण्डवत किया’ रखने और टिप्पणी में व्यापक अर्थ बताने से मूल की अर्थगत व्यापकता तथा धार्मिक संदर्भ दोनों सुरक्षित रहते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘चोगा,’ ‘सिर मुंडाया,’ और ‘दण्डवत किया’ सामान्य पाठक के लिए बोधगम्य हैं तथा शोक और श्रद्धा की ठोस क्रियाओं को स्पष्ट करते हैं।
