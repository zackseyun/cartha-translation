base_translation:
  language: en
  yaml_path: translation/ot/job/001/017.yaml
  text: While this one was still speaking[a], another came and said, “The Chaldeans formed three raiding parties, swept down on the camels and took them, and they struck down the young men with the edge of the sword[c][b]. And I alone have escaped to tell you.”
translation:
  language: hi
  text: जब वह अभी बोल ही रहा था, तभी एक और आया और कहा, “कसदियों ने तीन दल बनाए[a], ऊँटों पर धावा बोलकर उन्हें ले गए, और जवानों[c] को तलवार की धार से मार डाला[b]। केवल मैं ही बच निकला हूँ, ताकि आपको यह समाचार दूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “तीन सिर ठहराए”; इसका अर्थ “तीन टुकड़ियाँ बनाईं” या “तीन दलों में तैनात हुए” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी मुहावरा शाब्दिक रूप से “तलवार के मुँह/धार से मारा” है; इसका अर्थ है कि उन्होंने उन्हें तलवार से मार डाला।
    reason: lexical_alternative
  - marker: c
    text: इस संदर्भ में “जवान” घराने के सेवकों या परिचारकों के लिए भी प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ע֣וֹד זֶ֣ה מְדַבֵּ֗ר
  choice: जब वह अभी बोल ही रहा था
  rationale: עוד और कृदंत चल रही क्रिया व्यक्त करते हैं; ‘अभी ... ही’ संदेशवाहकों के वृत्तांत में तत्काल समयगत अतिव्यापन को स्वाभाविक हिन्दी में रखता है।
- source_word: וְ/זֶה֮ בָּ֣א וַ/יֹּאמַר֒
  choice: तब एक और व्यक्ति आकर कहने लगा
  rationale: दूसरा זֶה अगले संदेशवाहक की ओर संकेत करता है; ‘एक और व्यक्ति’ हिन्दी में इस कथात्मक क्रम को स्पष्ट करता है।
- source_word: כַּשְׂדִּ֞ים
  choice: कसदियों
  rationale: यह सामूहिक जातिनाम है; हिन्दी बाइबलीय परंपरा में ‘कसदी’ इसका प्रचलित रूप है।
- source_word: שָׂ֣מוּ שְׁלֹשָׁ֣ה רָאשִׁ֗ים
  choice: तीन दल बनाए
  rationale: शाब्दिक अर्थ ‘तीन सिर ठहराए’ है, पर छापामार प्रसंग में רָאשִׁים दलों या टुकड़ियों को सूचित करता है। मुख्य पाठ संक्षिप्त रखा गया और शाब्दिक अस्पष्टता पादटिप्पणी में दी गई है।
- source_word: וַֽ/יִּפְשְׁט֤וּ עַל
  choice: पर धावा बोलकर
  rationale: פשט על अचानक आक्रमण या छापे को व्यक्त करता है; ‘धावा बोलना’ हिंसक और आकस्मिक गति को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: הַ/גְּמַלִּים ... וַ/יִּקָּח֔וּ/ם
  choice: ऊँटों ... उन्हें ले गए
  rationale: सर्वनाम का संदर्भ ऊँट हैं; छापे के संदर्भ में ‘ले गए’ कब्ज़ा करके हाँक ले जाने का पर्याप्त संकेत देता है।
- source_word: הַ/נְּעָרִ֖ים
  choice: जवानों
  rationale: נְעָרִים का मूल अर्थ युवा पुरुष है, पर संदर्भ में सेवक या परिचारक भी हो सकते हैं। ‘जवानों’ से मूल व्यापकता बनी रहती है और संदर्भगत विकल्प पादटिप्पणी में दिया गया है।
- source_word: הִכּ֣וּ לְ/פִי חָ֑רֶב
  choice: तलवार की धार से मार डाला
  rationale: मुहावरे का शाब्दिक रूप ‘तलवार के मुँह/धार से मारा’ है और आशय तलवार से हत्या करना है। यह चयन परिणाम को स्पष्ट करते हुए ‘धार’ की मूल छवि बचाता है।
- source_word: וָ/אִמָּ֨לְטָ֧/ה רַק אֲנִ֛י לְ/בַדִּ֖/י
  choice: केवल मैं ही बच निकला हूँ
  rationale: रचना एकमात्र बचे व्यक्ति पर दोहरा बल देती है; ‘केवल ... ही’ उस बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְ/הַגִּ֥יד לָֽ/ךְ
  choice: ताकि आपको यह समाचार दूँ
  rationale: הגיד बताने या सूचना देने का अर्थ रखता है; संदेशवाहक के प्रसंग में ‘समाचार दूँ’ उद्देश्य और तात्कालिक रिपोर्ट दोनों स्पष्ट करता है।
