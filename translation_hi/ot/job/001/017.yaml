  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सुबोध कथात्मक शैली रखी गई है। संदेशवाहक द्वारा अय्यूब को संबोधन के लिए आदरसूचक ‘आपको’ चुना गया है। मूल की तीव्र क्रमिकता और एकमात्र जीवित बचने पर दिए गए बल को सुरक्षित रखा गया है।
