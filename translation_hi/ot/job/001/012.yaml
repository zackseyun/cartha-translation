  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל הַ/שָּׂטָ֗ן הִנֵּ֤ה כָל אֲשֶׁר ל/וֹ֙ בְּ/יָדֶ֔/ךָ רַ֣ק אֵלָ֔י/ו אַל תִּשְׁלַ֖ח יָדֶ֑/ךָ וַ/יֵּצֵא֙ הַ/שָּׂטָ֔ן מֵ/עִ֖ם פְּנֵ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/012.yaml
  text: And Yahweh said to the Accuser[a], “Look, all that he has is in your hand; only against him do not stretch out your hand.” Then the Accuser went out from the presence of Yahweh.
translation:
  language: hi
  text: तब याहवे ने आरोप लगानेवाले[a] से कहा, “देख, उसका सब कुछ तेरे हाथ में है; केवल उस पर अपना हाथ मत बढ़ाना।” तब आरोप लगानेवाला याहवे की उपस्थिति से चला गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शैतान” अथवा “विरोधी।” इब्रानी में निश्चित उपपद लगा है, जो किसी निजी नाम के बजाय पद या भूमिका का संकेत देता है।
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: यहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिंदी में प्रचलित निकट लिप्यंतरण द्वारा सुरक्षित रखा गया है।
- source_word: הַשָּׂטָן
  choice: दोष लगानेवाला
  rationale: संज्ञा के साथ निश्चित उपपद है, इसलिए यहाँ इसे निजी नाम के बजाय न्यायिक सभा में भूमिका या पदनाम के रूप में व्यक्त किया गया है; संदर्भ में इसका आरोप लगाने का भाव प्रमुख है।
- source_word: הִנֵּה
  choice: देख
  rationale: यह ध्यान खींचने वाला कथन-सूचक है; ‘देख’ आधुनिक, स्वाभाविक हिंदी में उसके बल को बनाए रखता है।
- source_word: כָל אֲשֶׁר לוֹ
  choice: उसका सब कुछ
  rationale: यह अय्यूब के अधिकार में आने वाली सारी संपत्ति को समेटने वाला स्वाभाविक और संक्षिप्त हिंदी प्रयोग है।
- source_word: בְּיָדֶךָ
  choice: तेरे हाथ में है
  rationale: मूल के ‘हाथ’ वाले शक्ति और नियंत्रण के रूपक को बनाए रखा गया है, जिससे अगली आज्ञा में ‘हाथ’ की पुनरावृत्ति भी सुनाई देती है।
- source_word: רַק
  choice: केवल
  rationale: यह दिए गए अधिकार पर एक स्पष्ट और एकमात्र सीमा दर्शाता है।
- source_word: אֵלָיו אַל תִּשְׁלַח יָדֶךָ
  choice: उस पर अपना हाथ मत बढ़ाना
  rationale: ‘उस पर’ विरोधी कार्रवाई की दिशा स्पष्ट करता है और ‘हाथ बढ़ाना’ मूल इब्रानी बिंब तथा पिछली पंक्ति की शब्द-पुनरावृत्ति को सुरक्षित रखता है।
- source_word: וַיֵּצֵא
  choice: चला गया
  rationale: कथात्मक प्रसंग में बाहर जाने या वहाँ से प्रस्थान करने को स्वाभाविक आधुनिक हिंदी में व्यक्त करता है।
- source_word: מֵעִם פְּנֵי יְהוָה
  choice: यहवे की उपस्थिति से
  rationale: शाब्दिक ‘यहवे के मुख के सामने से’ का आशय उनकी उपस्थिति से प्रस्थान करना है; यह रूप स्वाभाविक हिंदी में स्वर्गीय सभा के दृश्य को बनाए रखता है।
theological_decisions:
- issue: अय्यूब की भूमिका में הַשָּׂטָן का अनुवाद
  choice: दोष लगानेवाला
  alternative: ‘शैतान’, ‘विरोधी’ या ‘वह शैतान’
  rationale: इब्रानी में निश्चित उपपद इसे यहाँ भूमिका या पदनाम के रूप में प्रस्तुत करता है। ‘दोष लगानेवाला’ इस प्रसंग के आरोपात्मक कार्य को व्यक्त करता है और बाद की धर्मवैज्ञानिक पहचान को इस पद पर अनावश्यक रूप से आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी की, सहज किंतु गरिमापूर्ण रखी गई है। ‘तेरे’ का प्रयोग प्रत्यक्ष एकवचन संबोधन और मूल की निकटता बनाए रखता है। ‘हाथ’ की पुनरावृत्ति जानबूझकर सुरक्षित रखी गई है।
