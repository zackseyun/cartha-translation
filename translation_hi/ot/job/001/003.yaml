source:
  edition: WLC
  text: וַ/יְהִ֣י מִ֠קְנֵ/הוּ שִֽׁבְעַ֨ת אַלְפֵי צֹ֜אן וּ/שְׁלֹ֧שֶׁת אַלְפֵ֣י גְמַלִּ֗ים וַ/חֲמֵ֨שׁ מֵא֤וֹת צֶֽמֶד בָּקָר֙ וַ/חֲמֵ֣שׁ מֵא֣וֹת אֲתוֹנ֔וֹת וַ/עֲבֻדָּ֖ה רַבָּ֣ה מְאֹ֑ד וַ/יְהִי֙ הָ/אִ֣ישׁ הַ/ה֔וּא גָּד֖וֹל מִ/כָּל בְּנֵי קֶֽדֶם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/003.yaml
  text: His livestock were seven thousand sheep[a], three thousand camels, five hundred yoke of oxen, five hundred female donkeys, and a very large household; and that man was greater than all the sons of the east.
translation:
  language: hi
  text: उसकी पशु-संपत्ति में सात हज़ार भेड़-बकरियाँ, तीन हज़ार ऊँट, पाँच सौ जोड़ी बैल और पाँच सौ गधियाँ थीं; उसका घरेलू प्रतिष्ठान भी बहुत बड़ा था। वह व्यक्ति पूर्व के सभी लोगों से बढ़कर था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִקְנֵהוּ
  choice: उसकी पशु-सम्पत्ति
  rationale: यह शब्द अर्जित सम्पत्ति, विशेषकर पालतू पशुओं और झुंडों, को सूचित करता है; आगे दी गई पशुओं की सूची के कारण ‘पशु-सम्पत्ति’ सन्दर्भानुकूल है।
- source_word: צֹאן
  choice: भेड़-बकरियाँ
  rationale: इब्रानी צֹאן छोटे पालतू पशुओं के झुंड को दर्शा सकता है, जिसमें भेड़ और बकरियाँ दोनों सम्मिलित हैं; हिन्दी में ‘भेड़-बकरियाँ’ इस व्यापक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: צֶמֶד בָּקָר
  choice: जोड़ी बैल
  rationale: צֶמֶד साथ जोते जाने वाले युगल को और בָּקָר यहाँ कृषि-कार्य के गोवंश को दर्शाता है; ‘जोड़ी बैल’ संख्या और कृषि-सन्दर्भ दोनों सुरक्षित रखता है।
- source_word: אֲתוֹנוֹת
  choice: गधियाँ
  rationale: मूल शब्द स्पष्ट रूप से स्त्रीलिंग गधों को निर्दिष्ट करता है; ‘गधियाँ’ इसका संक्षिप्त और स्वाभाविक हिन्दी समतुल्य है।
- source_word: עֲבֻדָּה רַבָּה מְאֹד
  choice: बहुत बड़ी संख्या में सेवक
  rationale: पदबंध का शाब्दिक आशय अत्यधिक सेवा/कामकाज है और इस सम्पत्ति-सूची में यह सम्भवतः सेवक-वर्ग या विशाल घरेलू प्रतिष्ठान को दर्शाता है; हिन्दी में ‘बहुत बड़ी संख्या में सेवक’ आशय को स्पष्ट करता है।
- source_word: גָּדוֹל מִכָּל
  choice: सभी ... से अधिक महान
  rationale: מִכָּל के साथ גָּדוֹל तुलनात्मक अर्थ रखता है—वह धन, प्रतिष्ठा या सामाजिक महत्त्व में दूसरों से बढ़कर था; ‘अधिक महान’ इस तुलना को खुला रखता है।
- source_word: בְּנֵי קֶדֶם
  choice: पूर्व के सभी लोगों
  rationale: यह इब्रानी मुहावरा पूर्वी प्रदेश के निवासियों को सामूहिक रूप से दर्शाता है। स्वाभाविक आधुनिक हिन्दी में ‘पूर्व के लोग’ अर्थ स्पष्ट करता है, जबकि पदटिप्पणी अधिक रूपात्मक विकल्प देती है।
theological_decisions:
- issue: בְּנֵי קֶדֶם के सामूहिक मुहावरे का अनुवाद
  choice: पूर्व के सभी लोगों
  alternative: पूर्व के सभी पुत्रों / पूर्ववासियों
  rationale: यहाँ ‘पुत्र’ जैविक पुत्रों तक सीमित नहीं, बल्कि किसी क्षेत्र के लोगों का सामूहिक प्राचीन मुहावरा है। मुख्य पाठ में स्वाभाविक अर्थ रखा गया है और रूपात्मक विकल्प पदटिप्पणी में दिया गया है।
- issue: גָּדוֹל का आशय
  choice: अधिक महान
  alternative: सबसे धनी / सबसे प्रतिष्ठित
  rationale: मूल विशेषण व्यापक है और सन्दर्भ धन व सामाजिक प्रतिष्ठा दोनों का संकेत दे सकता है; किसी एक पहलू तक अर्थ सीमित न करके मूल की अर्थगत व्यापकता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किन्तु सहज गद्य। ‘भेड़-बकरियाँ’ צֹאן की व्यापकता को, ‘जोड़ी बैल’ कार्यरत पशु-युगलों को, और ‘गधियाँ’ मूल के स्त्रीलिंग को बनाए रखता है। मुख्य पाठ में प्राचीन ‘पूर्व के पुत्र’ के स्थान पर स्वाभाविक ‘पूर्व के लोग’ है; शाब्दिक रूप पदटिप्पणी में सुरक्षित है।
