source:
  edition: WLC
  text: וַ/יַּ֧עַן הַ/שָּׂטָ֛ן אֶת יְהוָ֖ה וַ/יֹּאמַ֑ר הַֽ/חִנָּ֔ם יָרֵ֥א אִיּ֖וֹב אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/009.yaml
  text: Then the Accuser answered Yahweh and said[b][a], “Does Job fear God for nothing?"
translation:
  language: hi
  text: तब आरोप लगाने वाले[a] ने यहोवा को उत्तर दिया, “क्या अय्यूब परमेश्वर का भय बिना किसी लाभ के मानता है?[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: “ह-शैतान,” अर्थात “शैतान” या “विरोधी।” निश्चित उपपद के साथ यह यहाँ भूमिका-सूचक पद है; इसलिए “आरोप लगाने वाला।”'
    reason: alternative_reading
  - marker: b
    text: या “बिना किसी कारण के” या “बिना किसी वजह के।” इब्रानी शब्द “बिना प्रतिफल के” का भाव भी रख सकता है; प्रश्न यह है कि क्या अय्यूब का परमेश्वर-भय निःस्वार्थ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: उत्तर दिया
  rationale: कथात्मक संवाद में ענה का स्वाभाविक अर्थ ‘उत्तर देना’ है; इससे इब्रानी संवाद-सूत्र बना रहता है।
- source_word: הַשָּׂטָן
  choice: दोष लगाने वाला
  rationale: संज्ञा के साथ निश्चित उपपद है, इसलिए यहाँ इसे व्यक्तिवाचक नाम के बजाय भूमिका-सूचक पद के रूप में प्रस्तुत किया गया है। यह न्यायिक या विरोधी भूमिका को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में परमेश्वर का विशिष्ट नाम है; हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ उस नाम को किसी उपाधि से बदलने के बजाय सुरक्षित रखता है।
- source_word: וַיֹּאמַר
  choice: (उत्तर दिया में समाहित)
  rationale: इब्रानी का शाब्दिक क्रम ‘उत्तर दिया और कहा’ हिन्दी में अनावश्यक पुनरुक्ति लगेगा; ‘उत्तर दिया’ प्रत्यक्ष कथन का परिचय स्वाभाविक रूप से देता है।
- source_word: הֲחִנָּם
  choice: क्या ... बिना किसी लाभ के
  rationale: חִנָּם यहाँ यह प्रश्न उठाता है कि क्या अय्यूब की भक्ति किसी प्रतिफल या लाभ से निरपेक्ष है। यह चयन प्रसंगगत अर्थ स्पष्ट करता है, जबकि पादटिप्पणी में ‘बिना किसी कारण के’ की वास्तविक वैकल्पिक छाया सुरक्षित है।
- source_word: יָרֵא
  choice: भय मानता है
  rationale: परमेश्वर के संदर्भ में ירא श्रद्धामिश्रित भय को दर्शाता है। ‘भय मानना’ हिन्दी बाइबलीय प्रयोग में स्वाभाविक है और केवल ‘आदर करना’ की अपेक्षा मूल की अर्थ-तीव्रता बचाता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: यहाँ शब्द सच्चे परमेश्वर के लिए है; ‘परमेश्वर’ आधुनिक मानक हिन्दी में स्पष्ट और प्रतिष्ठित समतुल्य है।
theological_decisions:
- issue: निश्चित उपपद सहित הַשָּׂטָן का अनुवाद
  choice: दोष लगाने वाला
  alternative: शैतान; विरोधी
  rationale: निश्चित उपपद इस दृश्य में भूमिका या पद की ओर संकेत करता है। भूमिका-सूचक अनुवाद बाद की परंपरा से प्राप्त व्यक्तिवाचक नाम को अनिवार्य रूप से आरोपित नहीं करता और कथानक की न्यायिक-विरोधी छाया बनाए रखता है।
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में चतुरक्षरीय विशिष्ट नाम सीधे प्रयुक्त है। ‘यहोवा’ हिन्दी पाठकों में परिचित नामरूप है और उसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: अय्यूब के भय की निष्कामता पर प्रश्न
  choice: बिना किसी लाभ के
  alternative: बिना किसी कारण के; सेंतमेंत
  rationale: वक्ता अय्यूब की परमेश्वर-भक्ति के पीछे लाभ होने का आरोप लगाता है। मुख्य पाठ में यह प्रसंगगत बल रखा गया है, पर मूल पद की कारण-संबंधी संभावित छाया पादटिप्पणी में संरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। इब्रानी के ‘उत्तर दिया और कहा’ को स्वाभाविक हिन्दी में ‘उत्तर दिया’ किया गया है। ‘दोष लगाने वाला’ भूमिका-सूचक है; ‘अभियोक्ता’ की अपेक्षा कम तकनीकी और अधिक सहज है।
