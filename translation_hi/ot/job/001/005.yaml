  text: וַ/יְהִ֡י כִּ֣י הִקִּיפֽוּ֩ יְמֵ֨י הַ/מִּשְׁתֶּ֜ה וַ/יִּשְׁלַ֧ח אִיּ֣וֹב וַֽ/יְקַדְּשֵׁ֗/ם וְ/הִשְׁכִּ֣ים בַּ/בֹּקֶר֮ וְ/הֶעֱלָ֣ה עֹלוֹת֮ מִסְפַּ֣ר כֻּלָּ/ם֒ כִּ֚י אָמַ֣ר אִיּ֔וֹב אוּלַי֙ חָטְא֣וּ בָנַ֔/י וּ/בֵרֲכ֥וּ אֱלֹהִ֖ים בִּ/לְבָבָ֑/ם כָּ֛כָה יַעֲשֶׂ֥ה אִיּ֖וֹב כָּל הַ/יָּמִֽים־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/001/005.yaml
  text: And when the days of the feasting had run their course, Job would send and consecrate them, and he would rise early in the morning and offer burnt offerings according to the number of them all. For Job said, “Perhaps my sons have sinned and cursed God in their hearts.” Thus Job would do all the time.
translation:
  language: hi
  text: जब भोज के दिन पूरे हो जाते, तब अय्यूब उनके पास बुलावा भेजता और उन्हें पवित्र करता था। वह भोर को उठकर उन सबकी गिनती के अनुसार होमबलियाँ चढ़ाता था, क्योंकि अय्यूब सोचता था, “हो सकता है कि मेरे बेटों ने पाप किया हो और अपने मन में परमेश्वर को शाप दिया हो।”[a] अय्यूब सदा ऐसा ही करता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “परमेश्वर को आशीर्वाद दिया हो”; यहाँ यह आदरसूचक विपरीतार्थक प्रयोग है, जिसका आशय “शाप दिया हो” है।
    reason: स्रोत के जानबूझकर प्रयुक्त शिष्टोक्ति-सदृश शब्द और संदर्भगत अर्थ, दोनों को पाठक के सामने रखना।
lexical_decisions:
- source_word: הִקִּיפוּ יְמֵי הַמִּשְׁתֶּה
  choice: भोज के दिन पूरे हो जाते
  rationale: मुहावरे का अर्थ भोज के निर्धारित दिनों या चक्र के पूरा होने से है; हिंदी में इसे सहज रखते हुए समय-चक्र का भाव सुरक्षित किया गया है।
- source_word: וַיְקַדְּשֵׁם
  choice: उन्हें ... पवित्र करता था
  rationale: क्रिया का मूल भाव किसी पवित्र अनुष्ठान के लिए अलग या शुद्ध करना है; स्रोत में विधि स्पष्ट नहीं, इसलिए अनावश्यक विवरण नहीं जोड़ा गया।
- source_word: עֹלוֹת
  choice: होमबलियाँ
  rationale: यह पूरी तरह वेदी पर जलाई जाने वाली बलि का पारंपरिक और समझ में आने वाला हिंदी बाइबलीय पद है।
- source_word: מִסְפַּר כֻּלָּם
  choice: उन सबकी गिनती के अनुसार
  rationale: स्रोत की संरचना और संभावित संदर्भगत व्यापकता को बनाए रखता है, बिना यह तय किए कि 'सब' में किन-किन को गिना गया।
- source_word: כָּל־הַיָּמִים
  choice: हर समय
  rationale: शाब्दिक रूप से 'सारे दिन'; यहाँ अय्यूब की नियमित और निरंतर रीति का भाव है।
theological_decisions:
- issue: בֵּרֲכוּ אֱלֹהִים का शाब्दिक रूप 'परमेश्वर को आशीर्वाद दिया' है, पर संदर्भ में यह आदरसूचक विपरीतार्थक प्रयोग है।
  choice: परमेश्वर को शाप दिया हो
  alternative: परमेश्वर को आशीर्वाद दिया हो
  rationale: अय्यूब की पाप-संबंधी चिंता और इसी पुस्तक में समान प्रयोग संदर्भगत अर्थ 'शाप देना' की पुष्टि करते हैं; पादटिप्पणी शाब्दिक रूप को पारदर्शी बनाती है।
- issue: अय्यूब द्वारा पवित्र करने की सटीक विधि
  choice: पवित्र करता था
  alternative: शुद्ध करता था
  rationale: स्रोत केवल संस्कारगत पवित्रीकरण बताता है; अनुष्ठान या प्रायश्चित की कोई विशिष्ट प्रणाली जोड़ना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सहज कथात्मक शैली रखी गई है। आवृत्त क्रिया को “करता था/चढ़ाता था” से व्यक्त किया गया है। “बुलवा भेजता” से וַיִּשְׁלַח का संदेश भेजने वाला भाव आता है, पर ऐसी कोई अनुष्ठानिक प्रक्रिया नहीं जोड़ी गई जो स्रोत में नहीं है।
