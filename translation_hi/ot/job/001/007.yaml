  text: וַ/יֹּ֧אמֶר יְהוָ֛ה אֶל הַ/שָּׂטָ֖ן מֵ/אַ֣יִן תָּבֹ֑א וַ/יַּ֨עַן הַ/שָּׂטָ֤ן אֶת יְהוָה֙ וַ/יֹּאמַ֔ר מִ/שּׁ֣וּט בָּ/אָ֔רֶץ וּ/מֵֽ/הִתְהַלֵּ֖ךְ בָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/007.yaml
  text: Then Yahweh said to the Adversary[a], “Where have you come from?” And the Adversary answered Yahweh and said, “From roaming on the earth and from walking about on it.”
translation:
  language: hi
  text: तब याहवे ने विरोधी[a] से कहा, “तुम कहाँ से आए हो?” विरोधी ने याहवे को उत्तर दिया, “पृथ्वी पर इधर-उधर घूमने और उस पर चलते-फिरते रहने से।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में “ह-सातान” है, अर्थात् ‘विरोधी’ शब्द के साथ निश्चित उपपद लगा है। इसलिए यहाँ यह व्यक्तिगत नाम के बजाय “विरोधी” की उपाधि या भूमिका के रूप में प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहवे
  rationale: परमेश्वर के व्यक्तिगत इब्रानी नाम का देवनागरी लिप्यंतरण किया गया है; उसके स्थान पर कोई उपाधि नहीं रखी गई।
- source_word: הַשָּׂטָן
  choice: विरोधी
  rationale: निश्चित उपपद के कारण यहाँ यह व्यक्तिगत नाम की अपेक्षा भूमिका या उपाधि है। ‘विरोधी’ व्यापक प्रतिकूल भूमिका को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מֵאַיִן תָּבֹא
  choice: तुम कहाँ से आए हो?
  rationale: यह आगमन के स्रोत के विषय में स्वाभाविक हिन्दी प्रश्न है और पूर्ण होकर वर्तमान से जुड़े आगमन का भाव रखता है।
- source_word: וַיַּעַן
  choice: उत्तर दिया
  rationale: कथात्मक संवाद की सामान्य क्रिया का औपचारिक और स्वाभाविक हिन्दी रूप।
- source_word: מִשּׁוּט בָּאָרֶץ
  choice: पृथ्वी पर इधर-उधर घूमने
  rationale: שׁוט के चारों ओर अथवा इधर-उधर घूमने के भाव और בּ के स्थानगत अर्थ को व्यक्त करता है; ‘पृथ्वी’ इस विश्वव्यापी प्रसंग के अनुकूल है।
- source_word: וּמֵהִתְהַלֵּךְ בָּהּ
  choice: और उस पर चलते-फिरते रहने से
  rationale: हित्पाएल रूप की बार-बार या निरंतर विचरण करने की छाया को ‘चलते-फिरते रहने’ से सुरक्षित रखा गया है।
theological_decisions:
- issue: הַשָּׂטָן को व्यक्तिगत नाम माना जाए या भूमिका/उपाधि
  choice: 'भूमिका/उपाधि: “विरोधी”'
  alternative: 'व्यक्तिगत नाम: “शैतान”; अधिक रूप-सापेक्ष: “वह शैतान”'
  rationale: इब्रानी में निश्चित उपपद इस प्रसंग में उपाधि या भूमिका की ओर संकेत करता है। ‘विरोधी’ बाद के नाम-सदृश प्रयोग को यहाँ आरोपित किए बिना मूल अर्थ बताता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक संवाद। ‘इधर-उधर घूमने’ और ‘चलते-फिरते रहने’ से मूल की समानार्थी पुनरुक्ति तथा निरंतर विचरण का भाव बनाए रखा गया है।
