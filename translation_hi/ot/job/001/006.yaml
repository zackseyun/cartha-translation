base_translation:
  language: en
  yaml_path: translation/ot/job/001/006.yaml
  text: There was a day when the sons of God came to present themselves before Yahweh[b][a], and the Adversary also came among them.
translation:
  language: hi
  text: एक दिन परमेश्वर के पुत्र[b] यहोवा के सामने अपने आपको उपस्थित करने आए, और विरोधी[a] भी उनके बीच आया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: परंपरागत रूप से, “शैतान।” इब्रानी में निश्चित लेख के साथ “विरोधी” है; यहाँ यह व्यक्तिगत नाम के बजाय किसी पदवी या भूमिका को सूचित कर सकता है।
    reason: alternative_reading
  - marker: b
    text: “परमेश्वर के पुत्र” से आशय स्वर्गीय सभा के सदस्यों से हो सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: एक दिन ऐसा हुआ कि
  rationale: यह इब्रानी कथात्मक सूत्र नए दृश्य का आरम्भ करता है। यह हिन्दी में स्वाभाविक रहते हुए ‘एक दिन’ और घटना के घटित होने—दोनों भावों को व्यक्त करता है।
- source_word: בְּנֵי הָאֱלֹהִים
  choice: परमेश्वर के पुत्र
  rationale: यह औपचारिक रूप से निकट अनुवाद है और इब्रानी पदबंध की छवि तथा उसकी व्याख्यात्मक खुलावट को बनाए रखता है; ‘स्वर्गीय प्राणी’ अर्थ को मुख्य पाठ में पहले ही निश्चित कर देता।
- source_word: לְהִתְיַצֵּב
  choice: उपस्थित होने
  rationale: इस प्रसंग में क्रिया किसी उच्च अधिकारी के सामने हाज़िर होने या स्वयं को प्रस्तुत करने का भाव रखती है। ‘उपस्थित होने’ आधुनिक हिन्दी में स्वाभाविक और सम्मानपूर्ण है।
- source_word: עַל יְהוָה
  choice: यहोवा के सामने
  rationale: उपस्थित होने की क्रिया के साथ עַל यहाँ किसी के सम्मुख आने का अर्थ देता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी व्यक्तिगत ईश्वरीय नाम को हिन्दी में प्रचलित लिप्यंतरण से प्रस्तुत किया गया है, न कि उसे सामान्य उपाधि में बदलकर।
- source_word: הַשָּׂטָן
  choice: विरोधी
  rationale: मूल में निश्चित उपपद लगा है और पद यहाँ किसी भूमिका या पदवी को सूचित कर सकता है। ‘विरोधी’ मूल संज्ञा का अर्थ बनाए रखता है; पारंपरिक ‘शैतान’ पादटिप्पणी में दिया गया है।
- source_word: בְּתוֹכָם
  choice: उनके बीच
  rationale: यह समूह के भीतर सम्मिलित होकर आने का अर्थ स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: הַשָּׂטָן को व्यक्तिगत नाम माना जाए या भूमिका-सूचक पदवी
  choice: विरोधी
  alternative: शैतान; अभियोग लगाने वाला
  rationale: निश्चित उपपद के कारण यहाँ भूमिका-सूचक अर्थ प्रमुख हो सकता है। मुख्य पाठ में ‘विरोधी’ रखने से बाद की नाम-परंपरा को अनिवार्य रूप से आरोपित नहीं किया जाता, जबकि पारंपरिक रूप पादटिप्पणी में सुरक्षित है।
- issue: בְּנֵי הָאֱלֹהִים का औपचारिक अनुवाद किया जाए या उसकी व्याख्या
  choice: परमेश्वर के पुत्र
  alternative: स्वर्गीय प्राणी; दिव्य प्राणी
  rationale: यह पदबंध संभवतः स्वर्गीय सभा के प्राणियों की ओर संकेत करता है, पर मुख्य पाठ में मूल रूपक बनाए रखने से उसकी वास्तविक अस्पष्टता और धर्मवैचारिक तनाव सुरक्षित रहते हैं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। कथात्मक सूत्र को अत्यधिक शब्दशः बनाने से बचते हुए मूल छवि, पदवियाँ और अस्पष्टताएँ सुरक्षित रखी गई हैं।
