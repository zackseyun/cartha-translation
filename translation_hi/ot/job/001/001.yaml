base_translation:
  language: en
  yaml_path: translation/ot/job/001/001.yaml
  text: There was a man in the land of Uz whose name was Job[a], and that man was blameless and upright, fearing God and turning away from evil.
translation:
  language: hi
  text: ऊज़ देश में अय्यूब नाम का एक मनुष्य था। वह मनुष्य खरा और सीधा था, परमेश्वर का भय मानता था और बुराई से मुँह मोड़ता था[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बुराई से दूर रहता था।” इब्रानी क्रिया बुराई से मुड़ने, उससे अलग रहने या उससे बचने का भाव दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: एक मनुष्य
  rationale: यह एक पुरुष व्यक्ति का परिचय देता है। आधुनिक हिन्दी में “एक मनुष्य” कथा के गरिमापूर्ण आरम्भ के लिए स्वाभाविक है।
- source_word: הָיָה
  choice: था
  rationale: यहाँ क्रिया कथा के पात्र के अस्तित्व और परिचय को सरलता से व्यक्त करती है; हिन्दी वाक्य-विन्यास में “था” पर्याप्त और स्वाभाविक है।
- source_word: בְאֶרֶץ עוּץ
  choice: ऊज़ देश में
  rationale: אֶרֶץ भौगोलिक क्षेत्र को सूचित करता है और עוּץ स्थान-नाम है; इसलिए उसका लिप्यंतरण “ऊज़” किया गया है।
- source_word: אִיּוֹב שְׁמוֹ
  choice: अय्यूब नाम का
  rationale: यह नाम बताने वाली इब्रानी उपवाक्य-रचना का सहज हिन्दी रूप है। “अय्यूब” हिन्दी में इस नाम का प्रचलित रूप है।
- source_word: וְהָיָה הָאִישׁ הַהוּא
  choice: वह मनुष्य ... था
  rationale: यह पहले प्रस्तुत व्यक्ति को फिर से निर्दिष्ट करके उसके चरित्र का वर्णन आरम्भ करता है; “वह मनुष्य” संकेतवाचक बल को बनाए रखता है।
- source_word: תָּם
  choice: खरा
  rationale: ज्ञान-साहित्य में यह नैतिक अखंडता और निष्कपटता का बोध देता है, अनिवार्य रूप से पूर्ण निष्पापता का नहीं। “खरा” इस अर्थ को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יָשָׁר
  choice: सीधा
  rationale: यह नैतिक सच्चाई और उचित आचरण का वर्णन करता है। “खरा और सीधा” हिन्दी में अर्थपूर्ण और सहज युग्म है।
- source_word: וִירֵא אֱלֹהִים
  choice: परमेश्वर का भय मानता था
  rationale: यह श्रद्धापूर्ण भक्ति और परमेश्वर के प्रति आदर को व्यक्त करने वाला स्थापित हिन्दी मुहावरा है, केवल आतंक को नहीं। प्रसंग में אֱלֹהִים का एकवचन अर्थ है।
- source_word: וְסָר מֵרָע
  choice: बुराई से मुँह मोड़ता था
  rationale: यह बुराई से सक्रिय रूप से हटने और उसे त्यागने का अर्थ तथा मूल क्रिया का दिशात्मक बिंब बनाए रखता है।
theological_decisions:
- issue: अय्यूब के नैतिक वर्णन का अर्थ
  choice: अय्यूब को नैतिक रूप से खरा और सीधा बताया गया है, न कि अनिवार्य रूप से पूर्णतः निष्पाप।
  alternative: अय्यूब को निरपेक्ष अर्थ में पापरहित या नैतिक रूप से सिद्ध समझना।
  rationale: תָּם और יָשָׁר ज्ञान-साहित्य में अखंड चरित्र और सीधे आचरण की प्रबल प्रशंसा करते हैं, पर पूर्ण निष्पापता का दावा आवश्यक नहीं बनाते। “खरा” इस तनाव को सुरक्षित रखता है।
- issue: אֱלֹהִים का अभिप्रेत अर्थ
  choice: परमेश्वर
  alternative: देवता
  rationale: शब्द का रूप बहुवचन है, पर यहाँ मुहावरे और कथा-संदर्भ में उसका अभिप्राय एकवचन परमेश्वर है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। “अय्यूब” और “परमेश्वर” जैसे प्रचलित बाइबलीय रूप बनाए गए हैं। पाद-टिप्पणी का चिह्न उसी वाक्यांश के बाद रखा गया है जिसे वह स्पष्ट करती है।
