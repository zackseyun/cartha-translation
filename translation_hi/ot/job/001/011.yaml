  yaml_path: translation/ot/job/001/011.yaml
  text: But stretch out your hand[a], please, and touch all that he has, and he will surely curse you to your face.
translation:
  language: hi
  text: परन्तु ज़रा अपना हाथ बढ़ाकर उसके पास जो कुछ है उसे छू तो सही; तब वह निश्चय ही तेरे मुँह पर तुझे शाप देगा[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, ‘तुझे आशीर्वाद देगा।’ अय्यूब की प्रस्तावना में इसे सामान्यतः ‘तुझे शाप देगा’ कहने की शिष्टोक्ति समझा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם
  choice: परन्तु
  rationale: यह पिछले कथन के विरुद्ध एक प्रबल मोड़ दिखाता है; ‘परन्तु’ गरिमापूर्ण और स्वाभाविक हिन्दी है।
- source_word: שְׁלַח נָא יָדְךָ
  choice: ज़रा अपना हाथ बढ़ाकर
  rationale: हाथ बढ़ाने की इब्रानी छवि बनाए रखता है और נָא के आग्रह/चुनौती के भाव को ‘ज़रा’ से स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְגַע
  choice: छू
  rationale: मूल क्रिया का सीधा अर्थ ‘छूना’ है; प्रसंग में हानि पहुँचाने का आशय स्वतः स्पष्ट है, इसलिए उसे अनावश्यक रूप से ‘मार’ या ‘प्रहार कर’ नहीं बनाया गया।
- source_word: בְּכָל אֲשֶׁר לוֹ
  choice: उसकी सारी सम्पत्ति को
  rationale: अय्यूब के पास जो कुछ है, उस समस्त स्वामित्व को संक्षिप्त और सहज हिन्दी में व्यक्त करता है।
- source_word: אִם לֹא
  choice: तब वह निश्चय ही
  rationale: यहाँ यह साधारण शर्त नहीं, बल्कि शपथ-सदृश दृढ़ कथन है; ‘निश्चय ही’ उसकी प्रबल निश्चितता व्यक्त करता है।
- source_word: עַל פָּנֶיךָ
  choice: तेरे मुँह पर
  rationale: मूल मुहावरे की प्रत्यक्ष और खुली अवज्ञा की छवि को बनाए रखता है।
- source_word: יְבָרֲכֶךָּ
  choice: तुझे शाप देगा
  rationale: क्रिया का सामान्य अर्थ ‘आशीर्वाद देना’ है, पर अय्यूब की प्रस्तावना में प्रसंगानुसार यह आदरसूचक व्यंजना के रूप में ‘शाप देना’ समझी जाती है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: अय्यूब की प्रस्तावना में ברך का व्यंजनात्मक प्रयोग
  choice: मुख्य पाठ में ‘तुझे शाप देगा’
  alternative: ‘तुझे आशीर्वाद देगा’
  rationale: विरोधी प्रसंग में शैतान का दावा है कि हानि होने पर अय्यूब परमेश्वर को अस्वीकार करेगा। ‘शाप देगा’ आशय स्पष्ट करता है, जबकि मूल शब्द का सामान्य अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; परमेश्वर और शैतान के बीच प्रत्यक्ष संबोधन के कारण ‘तेरे/तुझे’ रखा गया है। ‘छू तो सही’ चुनौती का स्वाभाविक बल देता है, और वाक्य की गरिमा बनाए रखता है।
