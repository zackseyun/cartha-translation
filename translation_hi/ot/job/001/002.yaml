lexical_decisions:
- source_word: וַיִּוָּלְדוּ
  choice: पैदा हुईं
  rationale: ילד का निफ़अल रूप जन्म की निष्क्रिय/परिणामसूचक घटना व्यक्त करता है। संयुक्त कर्ता के निकटतम स्त्रीलिंग बहुवचन पद “बेटियाँ” के कारण हिंदी में क्रिया “हुईं” स्वाभाविक है।
- source_word: לוֹ
  choice: उसके
  rationale: לֹו यहाँ जन्म-सूत्र में संबंध अथवा पितृत्व सूचित करता है। आधुनिक हिंदी में “उसके ... पैदा हुईं” स्वाभाविक है और “उसके लिए” से उत्पन्न लाभार्थक अर्थ से बचता है।
- source_word: שִׁבְעָה בָנִים
  choice: सात बेटे
  rationale: मूल पाठ पुरुष संतानों को स्पष्ट रूप से बताता है; “बेटे” इस सूचना को सहज आधुनिक हिंदी में सुरक्षित रखता है।
- source_word: וְשָׁלֹשׁ בָּנוֹת
  choice: और तीन बेटियाँ
  rationale: संयोजक व के साथ स्त्री संतानों की संख्या दी गई है; “और तीन बेटियाँ” इसका स्वाभाविक और सटीक रूप है।
