  text: וּ/מַלְאָ֛ךְ בָּ֥א אֶל אִיּ֖וֹב וַ/יֹּאמַ֑ר הַ/בָּקָר֙ הָי֣וּ חֹֽרְשׁ֔וֹת וְ/הָ/אֲתֹנ֖וֹת רֹע֥וֹת עַל יְדֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/014.yaml
  text: And a messenger came to Job and said[a], “The oxen were plowing, and the donkeys were grazing beside them,”
translation:
  language: hi
  text: और एक संदेशवाहक अय्यूब के पास आया और कहा, “बैल हल चला रहे थे और गधियाँ उनके पास चर रही थीं,”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמַלְאָךְ
  choice: और एक संदेशवाहक
  rationale: מַלְאָךְ का अर्थ संदर्भ के अनुसार मानवीय संदेशवाहक या स्वर्गदूत हो सकता है। यहाँ विपत्ति का समाचार लाने वाला मनुष्य अभिप्रेत है, इसलिए ‘संदेशवाहक’ उपयुक्त और स्पष्ट है; וּ को ‘और’ से व्यक्त किया गया है।
- source_word: בָּא אֶל אִיּוֹב
  choice: अय्यूब के पास आया
  rationale: בוא और אֶל यहाँ अय्यूब की ओर आकर उसके पास पहुँचने को व्यक्त करते हैं। ‘अय्यूब के पास आया’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: וַיֹּאמַר
  choice: और कहने लगा
  rationale: यह क्रिया कथा को आगे बढ़ाते हुए संदेशवाहक के कथन का आरम्भ करती है। ‘कहने लगा’ आगामी प्रत्यक्ष कथन के साथ हिन्दी में सहज है।
- source_word: הַבָּקָר
  choice: बैल
  rationale: בָּקָר सामान्यतः गोपशु हो सकता है, पर हल चलाने के प्रसंग में काम में लगाए गए बैल अभिप्रेत हैं।
- source_word: הָיוּ חֹרְשׁוֹת
  choice: हल चला रहे थे
  rationale: यह रचना अतीत में जारी क्रिया बताती है। ‘हल चला रहे थे’ उसी प्रगतिशील भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: וְהָאֲתֹנוֹת
  choice: और गधियाँ
  rationale: אֲתֹנוֹת विशेष रूप से मादा गधों का बहुवचन है। हिन्दी में ‘गधियाँ’ इस सूचना को स्वाभाविक ढंग से सीधे मुख्य पाठ में बनाए रखता है।
- source_word: רֹעוֹת
  choice: चर रही थीं
  rationale: רעה यहाँ पशुओं के घास चरने को दर्शाता है; स्त्रीलिंग बहुवचन ‘गधियाँ’ के अनुसार क्रिया का रूप रखा गया है।
- source_word: עַל יְדֵיהֶם
  choice: उनके पास
  rationale: इस मुहावरे का शाब्दिक रूप ‘उनके हाथ की ओर’ है, पर यहाँ इसका स्थानवाचक अर्थ ‘उनके पास/बगल में’ है। ‘उनके पास’ स्पष्ट और स्वाभाविक है।
