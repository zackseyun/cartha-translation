translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। स्रोत में मादा गधों की स्पष्टता मुख्य पाठ में ‘गधियाँ’ द्वारा सुरक्षित है, इसलिए अलग पाद-टिप्पणी आवश्यक नहीं है। पद अगले समाचार से जुड़ता है, इसलिए अंत में अल्पविराम रखा गया है।
