  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। मूल की चल रही क्रिया और बेटे-बेटियों का स्पष्ट उल्लेख सुरक्षित है। ‘पहिलौठे’ का शाब्दिक विकल्प संभव है, पर यहाँ ‘सबसे बड़े भाई’ से संदर्भगत अर्थ बिना अनावश्यक तकनीकीपन के स्पष्ट होता है; इसलिए पाठक-टिप्पणी आवश्यक नहीं मानी गई।
