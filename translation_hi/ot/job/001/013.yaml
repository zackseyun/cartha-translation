  yaml_path: translation/ot/job/001/013.yaml
  text: There was a day when his sons and his daughters were eating and drinking wine in the house of their oldest brother[a].
translation:
  language: hi
  text: एक दिन ऐसा हुआ कि उसके बेटे और बेटियाँ अपने सबसे बड़े भाई[a] के घर में खा रहे थे और दाखमधु पी रहे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने पहलौठे भाई के घर में।”
    reason: הַבְּכוֹר का शाब्दिक विकल्प ‘पहलौठा’ है; मुख्य पाठ में संदर्भानुकूल सहज रूप ‘सबसे बड़ा’ रखा गया है।
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: एक दिन ऐसा हुआ कि
  rationale: यह इब्रानी कथात्मक मुहावरा एक नए दृश्य का आरम्भ करता है। हिंदी में यह प्रयोग स्वाभाविक है और הַיּוֹם के मुहावरेगत अनिश्चित अर्थ ‘एक दिन’ को व्यक्त करता है।
- source_word: וּבָנָיו וּבְנֹתָיו
  choice: उसके बेटे और बेटियाँ
  rationale: मूल पाठ बेटों और बेटियों दोनों का स्पष्ट उल्लेख करता है; इसलिए सामान्य शब्द ‘बच्चे’ के बजाय दोनों को बनाए रखा गया है।
- source_word: אֹכְלִים וְשֹׁתִים
  choice: खा रहे थे और ... पी रहे थे
  rationale: इब्रानी कृदंत उस समय चल रही क्रियाओं को चित्रित करते हैं; हिंदी का अपूर्ण भूतकाल इस पक्ष को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יַיִן
  choice: दाखमधु
  rationale: यह יַיִן का स्पष्ट और गरिमापूर्ण हिंदी पर्याय है तथा सामान्य पाठक के लिए बोधगम्य है।
- source_word: בְּבֵית אֲחִיהֶם
  choice: अपने ... भाई के घर में
  rationale: בְּבֵית स्थान को और אֲחִיהֶם पारिवारिक संबंध ‘उनका भाई’ को व्यक्त करता है। हिंदी में सह-संदर्भ स्पष्ट करने के लिए ‘अपने’ स्वाभाविक है।
- source_word: הַבְּכוֹר
  choice: सबसे बड़े
  rationale: इस प्रसंग में शब्द भाई की जन्म-क्रम संबंधी पहचान देता है। ‘सबसे बड़ा भाई’ आधुनिक हिंदी में स्वाभाविक रूप से वही अर्थ संप्रेषित करता है।
