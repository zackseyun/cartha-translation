base_translation:
  language: en
  yaml_path: translation/ot/job/001/016.yaml
  text: While this one was still speaking, another came and said, “Fire of God fell from heaven and burned among the sheep and the young men and consumed them, and I alone have escaped to tell you.”
translation:
  language: hi
  text: वह अभी बोल ही रहा था कि एक और व्यक्ति आकर कहने लगा, “परमेश्वर की आग आकाश से गिरी और भेड़-बकरियों तथा जवानों के बीच भड़क उठी और उन्हें भस्म कर गई। केवल मैं ही बच निकला हूँ ताकि आपको यह बता सकूँ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵשׁ אֱלֹהִים
  choice: परमेश्वर की आग
  rationale: इब्रानी संबंध-वाचक अभिव्यक्ति का सीधा और स्वाभाविक रूप; कथन में निहित दैवी संबद्धता को बिना व्याख्यात्मक रूप से ‘बिजली’ ठहराए सुरक्षित रखता है।
- source_word: בַצֹּאן
  choice: भेड़-बकरियों
  rationale: צֹאן छोटे पालतू पशुओं के झुंड, विशेषतः भेड़ और बकरियों, के लिए सामूहिक शब्द है; हिंदी में यह युग्म अर्थ को स्पष्ट और स्वाभाविक बनाता है।
- source_word: בַנְּעָרִים
  choice: सेवकों
  rationale: इस प्रसंग में נְעָרִים अय्यूब के पशुओं की देखभाल करने वाले अधीनस्थ युवा पुरुषों को दर्शाता है; ‘सेवकों’ से उनकी प्रसंगगत भूमिका स्पष्ट होती है।
- source_word: וַתֹּאכְלֵם
  choice: भस्म कर गई
  rationale: आग के कर्ता होने पर ‘खा गई’ का शाब्दिक मुहावरा हिंदी में ‘भस्म कर गई’ के द्वारा स्वाभाविक और तीव्र रूप से व्यक्त होता है।
- source_word: וָאִמָּלְטָה
  choice: बच निकला हूँ
  rationale: क्रिया संकट से पलायन करके बच जाने का भाव देती है; हिंदी पूर्ण वर्तमान संदेशवाहक की वर्तमान स्थिति भी व्यक्त करता है।
theological_decisions:
- issue: ‘परमेश्वर की आग’ का स्वरूप
  choice: परमेश्वर की आग
  alternative: आकाशीय बिजली
  rationale: मूल पाठ घटना को אֵשׁ אֱלֹהִים कहता है। इसे किसी विशिष्ट प्राकृतिक घटना के रूप में तय करना मूल की धार्मिक और कथात्मक अस्पष्टता को अनावश्यक रूप से समाप्त कर देता।
- issue: נְעָרִים की पहचान
  choice: सेवकों
  alternative: जवानों
  rationale: शब्द मूलतः युवकों को सूचित कर सकता है, पर अय्यूब 1 के गृहस्थी-संबंधी प्रसंग में ये पशुओं के साथ नियुक्त सेवक हैं। चयन आयु पर नहीं, कथात्मक भूमिका पर बल देता है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण कथात्मक शैली। ‘वह अभी बोल ही रहा था कि’ लगातार आने वाले विपत्ति-संदेशों की तात्कालिकता बनाए रखता है। प्रत्यक्ष वचन सहज और मौखिक रखा गया है।
