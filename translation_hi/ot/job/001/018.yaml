  yaml_path: translation/ot/job/001/018.yaml
  text: While this one was still speaking[a], another came and said, “Your sons and your daughters were eating and drinking wine in the house of their firstborn brother.”
translation:
  language: hi
  text: वह अभी बोल ही रहा था कि एक और व्यक्ति आया और बोला, “आपके बेटे-बेटियाँ अपने सबसे बड़े भाई के घर में खा रहे थे और दाखमधु पी रहे थे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַד זֶה מְדַבֵּר
  choice: वह अभी बोल ही रहा था
  rationale: यह पदबंध पिछले दूत के बोलते रहने के दौरान अगले दूत के आने को व्यक्त करता है। ‘अभी बोल ही रहा था’ अपूर्ण जारी क्रिया और व्यवधान, दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: וְזֶה בָּא
  choice: कि एक और व्यक्ति आकर
  rationale: शाब्दिक रूप ‘और यह आया’ है, पर कथानक में संकेत क्रमशः आने वाले अलग दूतों की ओर है; ‘एक और व्यक्ति’ इस कार्य को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בָּנֶיךָ וּבְנוֹתֶיךָ
  choice: आपके बेटे-बेटियाँ
  rationale: इब्रानी में पुत्रों और पुत्रियों दोनों का स्पष्ट उल्लेख है; संयुक्त हिन्दी रूप इस विशिष्टता को बनाए रखता है।
- source_word: אֹכְלִים וְשֹׁתִים יַיִן
  choice: खा रहे थे और दाखमधु पी रहे थे
  rationale: दोनों कृदंत उस समय जारी गतिविधि बताते हैं। ‘खा रहे थे’ मूल के निकट है और ‘दावत कर रहे थे’ जैसी व्याख्यात्मक वृद्धि से बचता है; יַיִן के लिए गरिमापूर्ण और प्रचलित बाइबलीय शब्द ‘दाखमधु’ चुना गया है।
- source_word: בְּבֵית אֲחִיהֶם הַבְּכוֹר
  choice: अपने सबसे बड़े भाई के घर में
  rationale: הַבְּכוֹר भाई-बहनों में जन्मक्रम बताता है। इस प्रसंग में ‘सबसे बड़ा भाई’ आधुनिक हिन्दी में ‘पहिलौठा भाई’ से अधिक सहज है और अर्थ को ठीक रखता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रजिस्टर अपनाया गया है। अय्यूब से संबोधन में ‘आपके’ सम्मानसूचक और स्वाभाविक है। मूल की ‘खाना और दाखमधु पीना’ अभिव्यक्ति मुख्य पाठ में सीधे रखी गई है; अंग्रेज़ी परत की टिप्पणी इस हिन्दी पाठ में आवश्यक नहीं मानी गई, क्योंकि ‘दावत’ को मुख्य अर्थ के रूप में प्रस्तुत नहीं किया गया है।
