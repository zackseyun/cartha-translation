  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הֲ/לֹֽא את שַׂ֣כְתָּ בַעֲד֧/וֹ וּ/בְעַד בֵּית֛/וֹ וּ/בְעַ֥ד כָּל אֲשֶׁר ל֖/וֹ מִ/סָּבִ֑יב מַעֲשֵׂ֤ה יָדָי/ו֙ בֵּרַ֔כְתָּ וּ/מִקְנֵ֖/הוּ פָּרַ֥ץ בָּ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/010.yaml
  text: Have you not put a hedge around him and around his house and around all that he has[a], on every side? You have blessed the work of his hands[b], and his livestock has spread throughout the land.
translation:
  language: hi
  text: क्या तूने उसे, उसके घर को और जो कुछ उसका है, उन सबको चारों ओर से बाड़ से नहीं घेर रखा है?[a] तूने उसके हाथों के काम को आशीष दी है, और उसका पशुधन पूरे देश में फैल गया है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनके चारों ओर बाड़ लगा रखी है।” इब्रानी में सुरक्षा के लिए बाड़ या घेरा बनाने की ठोस छवि है।
    reason: lexical_alternative
  - marker: b
    text: या “उसका पशुधन देश में बहुत बढ़ गया है।” इब्रानी क्रिया का शाब्दिक भाव सीमाएँ तोड़कर बाहर निकलने या फैलने का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂכְתָּ
  choice: बाड़ नहीं लगा रखी है
  rationale: यह सुरक्षा के लिए चारों ओर घेरा बनाने की ठोस इब्रानी छवि को बनाए रखता है; केवल ‘रक्षा की’ कहना रूपक को खो देता।
- source_word: בַעֲדוֹ / וּבְעַד בֵּיתוֹ / וּבְעַד כָּל אֲשֶׁר לוֹ מִסָּבִיב
  choice: उसके, उसके घराने और उसकी सारी सम्पत्ति के चारों ओर
  rationale: क्रिया और מִסָּבִיב के साथ ये पद पूर्ण, चारों ओर से की गई सुरक्षात्मक घेराबंदी दर्शाते हैं। ‘घराना’ यहाँ अय्यूब के गृहस्थ परिवार को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: מַעֲשֵׂה יָדָיו
  choice: उसके हाथों के काम
  rationale: इब्रानी मुहावरे को पारदर्शी और हिंदी में सहज रूप में बनाए रखता है; इसका आशय उसके श्रम और उद्यम से है।
- source_word: בֵּרַכְתָּ
  choice: आशीष दी है
  rationale: मूल क्रिया का स्पष्ट धार्मिक अर्थ बनाए रखता है और उसे केवल भौतिक समृद्धि तक सीमित नहीं करता।
- source_word: מִקְנֵהוּ
  choice: उसके पशुधन
  rationale: यह शब्द सामान्यतः पाले या स्वामित्व वाले पशुओं के समूह को दर्शाता है; ‘सम्पत्ति’ से अधिक सटीक और ‘गाय-बैल’ से अधिक व्यापक है।
- source_word: פָּרַץ
  choice: बहुत विस्तार हुआ है
  rationale: क्रिया के टूटकर बाहर निकलने या फैल जाने के सजीव भाव को स्वाभाविक हिंदी में व्यक्त करता है और प्रचुर वृद्धि का संकेत भी बनाए रखता है।
- source_word: בָּאָרֶץ
  choice: देश भर में
  rationale: פָּרַץ के साथ यह केवल स्थान नहीं, बल्कि भूभाग में व्यापक फैलाव का भाव देता है।
- source_word: הֲלֹא
  choice: क्या तूने ... नहीं
  rationale: शैतान के आरोपपूर्ण आलंकारिक प्रश्न का बल और प्रत्यक्ष संबोधन बनाए रखता है।
theological_decisions:
- issue: आशीष की भाषा को केवल भौतिक समृद्धि में बदलना
  choice: तूने उसके हाथों के काम को आशीष दी है
  alternative: तूने उसके हाथों के काम को समृद्ध किया है
  rationale: मूल पाठ समृद्धि को परमेश्वर की आशीष से जोड़ता है; ‘आशीष’ इस धार्मिक कथन को स्पष्ट रखता है।
- issue: सुरक्षात्मक रूपक का संरक्षण
  choice: चारों ओर बाड़ ... लगा रखी है
  alternative: हर ओर उसकी रक्षा की है
  rationale: मूल में घेरे या बाड़ की ठोस छवि है; उसका संरक्षण आरोप की सजीवता बनाए रखता है।
- issue: פָּרַץ में वृद्धि और फैलाव के बीच तनाव
  choice: देश भर में बहुत विस्तार हुआ है
  alternative: देश में बहुत बढ़ गया है
  rationale: चुना गया रूप प्रचुर वृद्धि और सीमाएँ तोड़कर फैलने की मूल छवि, दोनों को यथासंभव बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली रखी गई है। प्रसंग में शैतान परमेश्वर को सीधे संबोधित करता है, इसलिए मूल के एकवचन निकट संबोधन को ‘तू’ से बनाए रखा गया है। ‘घराने’ को केवल भवन के बजाय गृहस्थ परिवार के अर्थ में चुना गया है; ‘सम्पत्ति’ כָּל אֲשֶׁר לוֹ की व्यापकता व्यक्त करती है।
