id: JOB.1.8
reference: Job 1:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל הַ/שָּׂטָ֔ן הֲ/שַׂ֥מְתָּ לִבְּ/ךָ֖ עַל עַבְדִּ֣/י אִיּ֑וֹב כִּ֣י אֵ֤ין כָּמֹ֨/הוּ֙ בָּ/אָ֔רֶץ אִ֣ישׁ תָּ֧ם וְ/יָשָׁ֛ר יְרֵ֥א אֱלֹהִ֖ים וְ/סָ֥ר מֵ/רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/008.yaml
  text: 'And Yahweh said to the Accuser[a], “Have you set your heart on my servant Job? For there is none like him on the earth: a blameless and upright man[b], one who fears God and turns away from evil.”'
translation:
  language: hi
  text: तब याहवे ने दोष लगानेवाले[a] से कहा, “क्या तूने मेरे सेवक अय्यूब पर ध्यान दिया है?[b] क्योंकि पृथ्वी पर उसके समान कोई नहीं है। वह खरा और सीधा मनुष्य है, जो परमेश्वर का भय मानता और बुराई से दूर रहता है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘दोष लगानेवाला’ (या ‘विरोधी’; परंपरागत रूप से ‘शैतान’) है। यहाँ यह शब्द व्यक्तिगत नाम की अपेक्षा किसी भूमिका या उपाधि के रूप में प्रयुक्त जान पड़ता है।
    reason: alternative_reading
  - marker: b
    text: इब्रानी का शाब्दिक अर्थ है, “क्या तूने मेरे सेवक अय्यूब पर अपना हृदय लगाया है?” अर्थात् “क्या तूने उस पर ध्यान दिया है?”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय उसका प्रचलित हिन्दी लिप्यंतरण दिया गया है।
- source_word: הַשָּׂטָן
  choice: दोष लगानेवाला
  rationale: निश्चयवाचक उपपद के साथ यह पद यहाँ स्पष्ट रूप से व्यक्तिगत नाम से अधिक भूमिका या उपाधि का संकेत देता है। यह अनुवाद विरोध और अभियोग—दोनों भावों में से अभियोग के न्यायिक संदर्भ को सहज हिन्दी में व्यक्त करता है।
- source_word: הֲשַׂמְתָּ לִבְּךָ עַל
  choice: क्या तूने ... पर ध्यान दिया है?
  rationale: इब्रानी मुहावरे का शाब्दिक अर्थ ‘अपना हृदय लगाना’ है, पर यहाँ आशय जान-बूझकर ध्यान देने या विचार करने से है। मुख्य पाठ में स्वाभाविक हिन्दी रखी गई और मूल बिंब पादटिप्पणी में सुरक्षित किया गया है।
- source_word: עַבְדִּי
  choice: मेरे सेवक
  rationale: यहाँ अय्यूब का परमेश्वर से संबंध और उसकी सेवा प्रमुख है; सामाजिक दासत्व पर बल नहीं है।
- source_word: כִּי אֵין כָּמֹהוּ בָּאָרֶץ
  choice: क्योंकि पृथ्वी पर उसके समान कोई नहीं है
  rationale: यह वाक्य अय्यूब के अद्वितीय चरित्र को व्यापक, पृथ्वीगत दायरे में व्यक्त करता है; इसे किसी सीमित देश या भूभाग तक नहीं बाँधा गया।
- source_word: אִישׁ תָּם וְיָשָׁר
  choice: वह खरा और सीधा मनुष्य है
  rationale: ‘खरा’ नैतिक अखंडता को व्यक्त करता है, निष्पाप पूर्णता को नहीं; ‘सीधा’ नैतिक सच्चाई और उचित आचरण का भाव देता है।
- source_word: יְרֵא אֱלֹהִים
  choice: जो परमेश्वर का भय मानता
  rationale: बाइबलीय मुहावरे और उसके श्रद्धा, निष्ठा तथा जवाबदेही से जुड़े गहरे अर्थ को बनाए रखा गया है।
- source_word: וְסָר מֵרָע
  choice: और बुराई से दूर रहता है
  rationale: यह रूप बुराई से लगातार बचने और उसे ठुकराने की आदत को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: הַשָּׂטָן को व्यक्तिगत नाम माना जाए या भूमिका-सूचक उपाधि
  choice: दोष लगानेवाला
  alternative: शैतान; विरोधी; वह शैतान
  rationale: इब्रानी में निश्चयवाचक उपपद इस प्रसंग में भूमिका-सूचक अर्थ की ओर संकेत करता है। इसलिए बाद की परंपरा में नाम के रूप में होनेवाले प्रयोग को यहाँ पहले से आरोपित नहीं किया गया।
- issue: תָּם का अर्थ निष्पाप पूर्णता है या नैतिक अखंडता
  choice: खरा
  alternative: निर्दोष; सिद्ध; पूर्ण
  rationale: ज्ञान-साहित्य के प्रसंग और ‘सीधा’ के साथ इसकी जोड़ी नैतिक अखंडता बताती है, निरपेक्ष निष्पापता नहीं। ‘खरा’ इस सीमा को उचित रूप से बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। परमेश्वर के नाम के लिए ‘याहवे’, अय्यूब के नैतिक चरित्र के लिए परंपरा-संगत किंतु गैर-अतिशयोक्तिपूर्ण ‘खरा और सीधा’, और भूमिका-सूचक הַשָּׂטָן के लिए स्पष्ट हिन्दी पदबंध चुना गया है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में अपने संबंधित शब्दों के साथ उपस्थित हैं।
