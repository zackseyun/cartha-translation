id: JOB.8.5
reference: Job 8:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אִם אַ֭תָּה תְּשַׁחֵ֣ר אֶל אֵ֑ל וְ/אֶל שַׁ֝דַּ֗י תִּתְחַנָּֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/005.yaml
  text: But if you seek God earnestly[a], and plead for favor from the Almighty[b],
translation:
  language: hi
  text: पर यदि तुम परमेश्वर को लगन से खोजो[a], और सर्वशक्तिमान से कृपा की विनती करो[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर को भोर में खोजो।” इब्रानी क्रिया में जल्दी या भोर में खोजने का भाव हो सकता है, यद्यपि यहाँ लगन से अथवा यत्नपूर्वक खोजने का अर्थ अधिक सम्भावित है।
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी: “शद्दाय”; परम्परागत रूप से इसका अनुवाद “सर्वशक्तिमान” किया जाता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: पर यदि
  rationale: यह शर्तसूचक अव्यय है। पिछले कथन के साथ संवादगत विरोध को व्यक्त करने के लिए ‘पर’ जोड़ा गया है, जबकि ‘यदि’ शर्त का भाव बनाए रखता है।
- source_word: אַתָּה
  choice: तुम
  rationale: इब्रानी में द्वितीय पुरुष पुल्लिंग एकवचन सर्वनाम स्पष्ट रूप से आया है; हिन्दी में ‘तुम’ स्वाभाविक रूप से इसे व्यक्त करता है।
- source_word: תְּשַׁחֵר
  choice: लगन से खोजो
  rationale: शׁחר के पिएल रूप में ‘भोर में/जल्दी खोजना’ अथवा ‘मन लगाकर, यत्नपूर्वक खोजना’ दोनों भाव संभव हैं। प्रसंग में परमेश्वर की ओर गंभीरता से मुड़ने का भाव अधिक स्वाभाविक है, पर वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: אֶל
  choice: को
  rationale: पहला אֶל खोजने की दिशा परमेश्वर की ओर बताता है; हिन्दी मुहावरे में ‘परमेश्वर को खोजना’ स्वाभाविक है।
- source_word: אֵל
  choice: परमेश्वर
  rationale: אֵל यहाँ ईश्वर के लिए प्रयुक्त उपाधि है। आधुनिक मानक हिन्दी में ‘परमेश्वर’ गरिमापूर्ण और सहज है।
- source_word: וְ/אֶל
  choice: और ... से
  rationale: वाव दोनों उपवाक्यों को जोड़ता है। תתחנן के साथ אֶל का हिन्दी में स्वाभाविक रूप ‘से ... विनती करना’ है।
- source_word: שַׁדַּי
  choice: सर्वशक्तिमान
  rationale: शद्दाय नामात्मक दिव्य उपाधि है। अर्थ व्यक्त करने के लिए इसे प्रचलित हिन्दी उपाधि ‘सर्वशक्तिमान’ से अनूदित किया गया है; लिप्यंतरण पादटिप्पणी में दिया गया है।
- source_word: תִּתְחַנָּן
  choice: कृपा की विनती करो
  rationale: חנן के हित्पएल रूप में अनुग्रह या कृपा पाने के लिए गिड़गिड़ाने/विनती करने का भाव है। ‘कृपा की विनती करो’ इस संबंधपरक अर्थ को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
theological_decisions:
- issue: दिव्य उपाधि שַׁדַּי का अनुवाद
  choice: सर्वशक्तिमान
  alternative: शद्दाय
  rationale: उपाधि का अर्थ पाठकों तक पहुँचाने के लिए प्रचलित हिन्दी अनुवाद चुना गया है, जबकि मूल इब्रानी रूप को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और प्रार्थनात्मक लहजा रखा गया है। पद अगले वाक्य से जुड़ने वाली शर्त है, इसलिए अंत में अल्पविराम रखा गया है।
