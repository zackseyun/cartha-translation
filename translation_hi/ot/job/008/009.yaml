  yaml_path: translation/ot/job/008/009.yaml
  text: For we are only of yesterday and do not know[a], for our days on the earth are a shadow.
translation:
  language: hi
  text: 'क्योंकि हम तो कल ही के हैं और हम नहीं जानते,

    क्योंकि पृथ्वी पर हमारे दिन छाया के समान हैं।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: पहला כִּי बिलदद के पिछले कथन का कारण बताता है; ‘क्योंकि’ हिंदी में इस व्याख्यात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: תְמוֹל אֲנַחְנוּ
  choice: हम तो कल ही के हैं
  rationale: यह हिब्रू मुहावरा मानव जाति के हाल के उद्भव और सीमित अनुभव को दर्शाता है। ‘कल ही के’ मूल रूपक को बनाए रखते हुए आधुनिक हिंदी में बोधगम्य है।
- source_word: וְלֹא נֵדָע
  choice: और कुछ नहीं जानते
  rationale: नकार सहित ידע का सीधा अर्थ अज्ञान है। हिंदी में ‘कुछ नहीं जानते’ स्वाभाविक है और प्रसंग में सीमित मानवीय ज्ञान को व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: दूसरा כִּי पहले कथन में व्यक्त अज्ञान का आधार बताता है; इसकी पुनरावृत्ति हिब्रू की तर्क-रचना को सुरक्षित रखती है।
- source_word: צֵל
  choice: छाया के समान
  rationale: צֵל यहाँ क्षणभंगुरता का काव्यात्मक रूपक है। ‘छाया के समान’ हिंदी में तुलना को स्पष्ट करते हुए मूल बिंब बनाए रखता है।
- source_word: יָמֵינוּ
  choice: हमारे दिन
  rationale: प्रथम पुरुष बहुवचन प्रत्यय सहित संज्ञा का सीधा और स्वाभाविक अनुवाद।
- source_word: עֲלֵי אָרֶץ
  choice: पृथ्वी पर
  rationale: यह मनुष्य के दिनों का स्थान बताता है; ‘पृथ्वी पर’ संक्षिप्त, स्पष्ट और काव्यात्मक हिंदी है।
