  text: הֶן אֵ֭ל לֹ֣א יִמְאַס תָּ֑ם וְ/לֹֽא יַ֝חֲזִ֗יק בְּ/יַד מְרֵעִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/020.yaml
  text: Behold[a], God does not reject the blameless, nor does he uphold the hand of evildoers.
translation:
  language: hi
  text: देखो, परमेश्वर निष्कलंक व्यक्ति को नहीं ठुकराता, और न वह बुराई करने वालों का हाथ थामता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और न वह बुराई करने वालों को सहारा देता है”; अधिक शाब्दिक रूप में, “और न वह बुराई करने वालों का हाथ पकड़ता है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: देखो
  rationale: यह ध्यान आकर्षित करते हुए कथन पर बल देता है; आधुनिक हिंदी में ‘देखो’ काव्यात्मक और स्वाभाविक है।
- source_word: אֵל
  choice: परमेश्वर
  rationale: यहाँ אֵל परमेश्वर के लिए प्रयुक्त सामान्य काव्यात्मक पद है; मूल में ‘सर्वशक्तिमान’ नहीं है।
- source_word: יִמְאַס
  choice: ठुकराता
  rationale: מָאַס का भाव अस्वीकार करने का है; ‘ठुकराना’ संबंधपरक और न्यायिक संदर्भ में स्वाभाविक है, बिना इसे केवल भावनात्मक घृणा बनाने के।
- source_word: תָּם
  choice: निर्दोष व्यक्ति
  rationale: תָּם संपूर्णता, खराई या दोषरहित आचरण वाले व्यक्ति को दर्शाता है। यहाँ पुल्लिंग विशेषण संज्ञा की तरह प्रयुक्त है, इसलिए ‘व्यक्ति’ जोड़ा गया है।
- source_word: יַחֲזִיק
  choice: थामता
  rationale: חזק का हिफ़ील रूप पकड़ने, दृढ़ करने या सहारा देने का अर्थ रख सकता है। ‘हाथ’ के साथ ‘थामता’ मूल बिंब को बनाए रखता है।
- source_word: בְּיַד
  choice: का हाथ
  rationale: शाब्दिक अर्थ ‘के हाथ में/हाथ से’ है; क्रिया के साथ यह किसी का हाथ पकड़ने या उसे सहारा देने का बिंब बनाता है।
- source_word: מְרֵעִים
  choice: बुराई करनेवाले
  rationale: यह רעע से बना कृदंत है और सक्रिय रूप से बुराई करनेवालों को दर्शाता है; यह केवल सामान्य नैतिक श्रेणी ‘दुष्ट’ से अधिक निकट है।
theological_decisions:
- issue: וְלֹא יַחֲזִיק בְּיַד מְרֵעִים का अर्थ
  choice: और न वह बुराई करनेवालों का हाथ थामता है
  alternative: और न वह बुराई करनेवालों को सहारा देता है / उनका हाथ दृढ़ करता है
  rationale: मुख्य पाठ ठोस ‘हाथ थामने’ के बिंब को सुरक्षित रखता है, जबकि पदबंध में निहित सहायता या समर्थन का अर्थ पादटिप्पणी में दिया गया है। इससे संभावित अर्थ को किसी एक व्याख्या तक सीमित नहीं किया जाता।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और काव्य-संगत शैली। ‘देखो’ आरंभिक बल को रखता है; ‘हाथ थामता है’ मूल इब्रानी बिंब और उसके सहारा देने के निहितार्थ—दोनों को खुला रखता है।
