  text: Behold[a], this is the joy of his way[b], and out of the dust others will sprout.
translation:
  language: hi
  text: देखो[a], यही उसके मार्ग का आनंद है; और धूल में से अन्य उग आएँगे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह अपने मार्ग का आनंद है।” इब्रानी सर्वनाम को अधिक व्यक्तिगत अर्थ में पढ़ा जा सकता है, पर संदर्भ किसी व्यक्ति के विषय में सीधे कथन की अपेक्षा पौधे की नियति का सार अधिक सूचित करता है।
    reason: alternative_reading
  - marker: b
    text: या, “और धूल में से कोई और उग आएगा।” इब्रानी शब्द אַחֵר एकवचन हो सकता है, पर बहुवचन क्रिया मुख्य पाठ में “अन्य उग आएँगे” अनुवाद का समर्थन करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: देखो
  rationale: यह अव्यय काव्य में ध्यान खींचते हुए किसी बात पर बल देता है; आधुनिक हिन्दी में “देखो” इसकी जीवंतता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הוּא
  choice: यही
  rationale: यद्यपि इसका सामान्य रूप पुरुषवाचक “वह” है, यहाँ यह पिछले वर्णन की पूरी स्थिति की ओर संकेत कर सकता है; “यही” उस संकेतात्मक और सारांशात्मक बल को रखता है।
- source_word: מְשׂוֹשׂ
  choice: आनंद
  rationale: संज्ञा का अर्थ आनंद या हर्ष है; “उसके मार्ग का आनंद” मूल संरचना और उसकी विडंबनापूर्ण काव्यात्मक ध्वनि दोनों को बनाए रखता है।
- source_word: דַּרְכּוֹ
  choice: उसके मार्ग का
  rationale: דרך का अर्थ मार्ग, पथ या जीवन-क्रम हो सकता है; “मार्ग” यहाँ शाब्दिक और रूपकात्मक दोनों संभावनाएँ सुरक्षित रखता है।
- source_word: וּמֵעָפָר
  choice: और धूल में से
  rationale: מן स्रोत या उद्गम दर्शाता है और עפר धूल/मिट्टी को; “धूल में से” बाइबलीय साहित्यिक प्रतिध्वनि तथा वनस्पति-बिंब को बनाए रखता है।
- source_word: אַחֵר
  choice: दूसरे
  rationale: शब्द रूपतः एकवचन है, पर इसके साथ बहुवचन क्रिया יִצְמָחוּ है; इसलिए हिन्दी में “दूसरे” वाक्य-सामंजस्य और आशय को बेहतर व्यक्त करता है।
- source_word: יִצְמָחוּ
  choice: अंकुरित होंगे
  rationale: צמח वनस्पति के फूटने या उगने को दर्शाता है; “अंकुरित होंगे” इस बिंब को स्पष्ट और संक्षिप्त रखता है।
theological_decisions:
- issue: הוּא का संकेत किसी व्यक्ति की ओर है या पिछली परिस्थिति की ओर
  choice: इसे “यही” कहकर पिछली वर्णित दशा का सार माना गया है।
  alternative: “वही उसके मार्ग का आनंद है” या “वह अपने मार्ग का आनंद है।”
  rationale: इब्रानी सर्वनाम व्यक्तिगत अर्थ दे सकता है, किंतु निकट संदर्भ पौधे के बिंब और उसके अंत का सार प्रस्तुत करता प्रतीत होता है; पाठ की वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है।
- issue: אַחֵר के एकवचन रूप और יִצְמָחוּ की बहुवचन क्रिया के बीच तनाव
  choice: मुख्य पाठ में बहुवचन “दूसरे अंकुरित होंगे”।
  alternative: “कोई दूसरा अंकुरित होगा।”
  rationale: बहुवचन क्रिया मुख्य अनुवाद में बहुवचन को उचित ठहराती है, जबकि אַחֵר का एकवचन रूप वैकल्पिक पठन की गुंजाइश देता है।
