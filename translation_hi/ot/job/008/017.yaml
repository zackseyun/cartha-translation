  text: His roots are intertwined over a stone heap[a]; he sees a house of stones.
translation:
  language: hi
  text: 'उसकी जड़ें पत्थरों के ढेर पर आपस में उलझी हैं;

    वह पत्थरों का घर देखता है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह पत्थर का घर देखता है,” अथवा “वह पत्थरों के घर में झाँकता है।” इब्रानी में शाब्दिक वाक्यांश “पत्थरों का घर” है, जो पत्थरों से बनी किसी संरचना या किसी पथरीले स्थान की ओर संकेत कर सकता है।
    reason: शब्दार्थ और वाक्य-संबंध की वास्तविक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: עַל גַּל
  choice: पत्थरों के ढेर पर
  rationale: עַל स्थान-संबंध बताता है और גַּל यहाँ निकटवर्ती ‘पत्थरों के घर’ के कारण पत्थरों के ढेर का बिंब देता है। यह अनुवाद जड़ों के पत्थरों पर फैलने की ठोस छवि बनाए रखता है।
- source_word: שָׁרָשָׁיו
  choice: उसकी जड़ें
  rationale: पुल्लिंग एकवचन स्वामी और बहुवचन ‘जड़ें’ को सीधे व्यक्त करते हुए पौधे के मानवीकरण को सुरक्षित रखता है।
- source_word: יְסֻבָּכוּ
  choice: आपस में उलझी हैं
  rationale: इस क्रिया का भाव गुँथने या उलझने का है। ‘आपस में उलझी हैं’ आधुनिक हिन्दी में स्वाभाविक है और जड़ों की परस्पर गुँथी हुई दशा दिखाता है।
- source_word: בֵּית אֲבָנִים
  choice: पत्थरों का घर
  rationale: इब्रानी रचना का शाब्दिक अर्थ ‘पत्थरों का घर’ है। इसे मुख्य पाठ में रखने से कोई पत्थर की संरचना अथवा पथरीला स्थान—दोनों संभावनाओं की अस्पष्टता बनी रहती है।
- source_word: יֶחֱזֶה
  choice: देखता है
  rationale: क्रिया का सामान्य अर्थ ‘देखना’ है। एकवचन रूप पौधे-जैसे व्यक्ति की ओर लौटता है; सरल ‘देखता है’ काव्यात्मक मानवीकरण को बिना अतिरिक्त व्याख्या के रखता है।
