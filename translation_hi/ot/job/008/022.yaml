base_translation:
  language: en
  yaml_path: translation/ot/job/008/022.yaml
  text: Those who hate you will be clothed with shame[a], and the tent of the wicked will be no more.
translation:
  language: hi
  text: 'तुमसे घृणा करनेवाले लज्जा ओढ़ेंगे,

    और दुष्टों का तम्बू मिट जाएगा।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “और दुष्टों का तम्बू नहीं है।”
    reason: हिब्रू אֵינֶנּוּ वर्तमान अस्तित्व-निषेध भी व्यक्त कर सकता है; मुख्य पाठ प्रसंगानुसार भावी परिणाम देता है।
lexical_decisions:
- source_word: שֹׂנְאֶיךָ
  choice: तुमसे घृणा करनेवाले
  rationale: कर्तृवाचक बहुवचन कृदन्त और द्वितीय पुरुष एकवचन प्रत्यय को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יִלְבְּשׁוּ
  choice: ओढ़ेंगे
  rationale: לבשׁ के वस्त्र धारण करने के ठोस रूपक को अमूर्त संज्ञा ‘लज्जा’ के साथ सहज हिन्दी में बनाए रखता है।
- source_word: בֹשֶׁת
  choice: लज्जा
  rationale: भीतरी शर्म और सार्वजनिक अपमान—दोनों संभावित अर्थ-छायाओं को समेटता है।
- source_word: וְאֹהֶל
  choice: और ... तम्बू
  rationale: אֹהֶל की ठोस काव्यात्मक छवि को ‘घराना’ या ‘निवास’ बनाकर स्पष्ट नहीं किया गया।
- source_word: רְשָׁעִים
  choice: दुष्टों का
  rationale: बहुवचन वर्गसूचक रूप को सरल और प्रतिष्ठित हिन्दी में रखता है।
- source_word: אֵינֶנּוּ
  choice: मिट जाएगा
  rationale: शाब्दिक ‘वह नहीं है’ को प्रसंग के भावी परिणाम के अनुसार स्वाभाविक हिन्दी में व्यक्त करता है; अस्तित्व समाप्त होने का भाव सुरक्षित है।
theological_decisions:
- issue: अन्तिम उपवाक्य का कालगत बल
  choice: 'भावी परिणाम: ‘दुष्टों का तम्बू मिट जाएगा’'
  alternative: 'वर्तमान अस्तित्व-निषेध: ‘दुष्टों का तम्बू नहीं है’'
  rationale: पद 20–22 के भावी कथनों और परिणामों के प्रवाह में भावी रूप अधिक स्वाभाविक है, यद्यपि हिब्रू रूप अपने आप में वर्तमान अस्तित्व-निषेध है; इस अस्पष्टता को पाद-टिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण काव्यात्मक शैली। ‘लज्जा ओढ़ेंगे’ हिब्रू वस्त्र-रूपक को सुरक्षित रखता है और ‘तम्बू’ मूल ठोस बिम्ब को बनाए रखता है।
