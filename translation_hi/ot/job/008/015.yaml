  yaml_path: translation/ot/job/008/015.yaml
  text: He leans on his house[a], but it does not stand; he grasps hold of it[b], but it does not remain standing.
translation:
  language: hi
  text: वह अपने घर पर टेक लगाता है[a], पर घर टिकता नहीं; वह उसे कसकर पकड़ता है[b], पर वह खड़ा नहीं रहता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह अपने घर पर भरोसा करता है।” इब्रानी क्रिया किसी सहारे पर शारीरिक रूप से टेक लगाने और उस पर निर्भर होने—दोनों अर्थ दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: “टिकता नहीं” और “खड़ा नहीं रहता” इब्रानी की समानांतर छवि को बनाए रखते हैं। भाव यह है कि जिस घर या सहारे पर वह निर्भर है, वह स्थिर सिद्ध नहीं होता।
    reason: cross_reference
lexical_decisions:
- source_word: יִשָּׁעֵן
  choice: टेक लगाता है
  rationale: निफ़अल रूप किसी वस्तु पर शरीर का भार डालने और उस पर निर्भर होने—दोनों भाव दे सकता है। ‘टेक लगाता है’ ठोस बिंब को बनाए रखते हुए निर्भरता का निहित अर्थ भी व्यक्त करता है।
- source_word: בֵּיתוֹ
  choice: अपने घर
  rationale: בַּיִת का सामान्य अर्थ ‘घर’ है। प्रसंग में यह उस आधार का रूपक हो सकता है जिस पर मनुष्य भरोसा करता है, पर अनुवाद में बिंब को व्याख्या द्वारा बदलना उचित नहीं।
- source_word: וְלֹא יַעֲמֹד
  choice: पर वह टिकता नहीं
  rationale: עמד का अर्थ खड़ा रहना, टिकना या स्थिर रहना है। ‘टिकता नहीं’ अस्थिरता को स्वाभाविक हिन्दी में व्यक्त करता है और सर्वनाम की स्रोत-पाठगत संदर्भ-अस्पष्टता बनाए रखता है।
- source_word: יַחֲזִיק בּוֹ
  choice: वह उसे कसकर पकड़ता है
  rationale: חזק का हिफ़ईल रूप यहाँ किसी चीज़ को दृढ़ता से थामने का सजीव शारीरिक बिंब देता है।
- source_word: וְלֹא יָקוּם
  choice: पर वह खड़ा नहीं रह पाता
  rationale: קום का मूल भाव उठना या खड़ा होना है। समानांतर पंक्ति में यह उस आधार के कायम न रह सकने को दर्शाता है; ‘खड़ा’ मूल बिंब को बचाता है।
theological_decisions:
- issue: יַעֲמֹד और יָקוּם के अव्यक्त कर्ता का संदर्भ
  choice: हिन्दी में ‘वह’ रखकर संदर्भ को खुला रखा गया है
  alternative: स्पष्ट रूप से ‘घर’ या ‘मनुष्य’ को कर्ता बनाना
  rationale: इब्रानी में दोनों क्रियाओं का कर्ता व्यक्त नहीं है, और व्यक्ति तथा ‘घर’ दोनों पुल्लिंग एकवचन हैं। इसलिए स्रोत-पाठ व्यक्ति अथवा उसके घर/आधार—दोनों की ओर संकेत की गुंजाइश देता है; अनुवाद इसे अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी अपनाई गई है। ‘टेक लगाता है’ और ‘कसकर पकड़ता है’ ठोस काव्यात्मक बिंब रखते हैं, जबकि ‘टिकता नहीं’ तथा ‘खड़ा नहीं रह पाता’ समानांतर अस्थिरता को स्वाभाविक हिन्दी में व्यक्त करते हैं।
