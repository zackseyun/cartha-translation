  text: 'चाहे तुम्हारी शुरुआत छोटी थी,[a]

    फिर भी तुम्हारी बाद की दशा बहुत बढ़ेगी।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और तुम्हारी शुरुआत छोटी थी, पर तुम्हारी अंतिम दशा बहुत बढ़ेगी।”
    reason: וְהָיָה को साधारण ‘और’ के रूप में भी समझा जा सकता है; אַחֲרִית का अर्थ ‘अंतिम दशा’ और יִשְׂגֶּה का अर्थ ‘बढ़ेगी’ हो सकता है।
lexical_decisions:
- source_word: וְהָיָה
  choice: चाहे ... थी
  rationale: संयोजक और पूर्ण क्रिया को अगले चरण से विरोध दिखाने वाली रियायती परिस्थिति के रूप में लिया गया है; हिंदी में यह काव्यात्मक विरोध स्वाभाविक रूप से व्यक्त होता है।
- source_word: רֵאשִׁיתְךָ
  choice: तुम्हारी शुरुआत
  rationale: यह आरंभ या प्रारंभिक दशा का सीधा और सामान्य आधुनिक हिंदी रूप है।
- source_word: מִצְעָר
  choice: छोटी
  rationale: यह अल्पता या छोटेपन को व्यक्त करता है और आगे होने वाली बड़ी वृद्धि के साथ स्पष्ट विरोध बनाता है।
- source_word: אַחֲרִיתְךָ
  choice: तुम्हारा भविष्य
  rationale: शब्द अंत, भावी दशा या परिणाम का संकेत दे सकता है; संदर्भ में 'भविष्य' सहज है, यद्यपि 'अंतिम दशा' भी संभव है।
- source_word: יִשְׂגֶּה
  choice: बहुत बढ़ेगा
  rationale: क्रिया बढ़ने या महान होने का भाव देती है; यह छोटे आरंभ से प्रचुर भावी दशा की गति को सुरक्षित रखती है।
- source_word: מְאֹד
  choice: बहुत
  rationale: यह तीव्रता सूचक क्रियाविशेषण है और 'बढ़ेगा' के साथ स्वाभाविक आधुनिक हिंदी बनाता है।
