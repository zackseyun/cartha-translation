  text: אִם זַ֥ךְ וְ/יָשָׁ֗ר אָ֥תָּה כִּי עַ֭תָּה יָעִ֣יר עָלֶ֑י/ךָ וְ֝/שִׁלַּ֗ם נְוַ֣ת צִדְקֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/006.yaml
  text: If you are pure and upright[c][b][a], surely even now he will rouse himself for you and restore your righteous dwelling.
translation:
  language: hi
  text: यदि तुम शुद्ध और खरे हो, तो निश्चय ही वह अभी तुम्हारे लिए जाग उठेगा[a] और तुम्हारे धर्मी घर-बार को फिर से बहाल करेगा[b][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारे लिए स्वयं को सक्रिय करेगा” अथवा “तुम्हारी ओर से उठ खड़ा होगा।”
    reason: lexical_alternative
  - marker: b
    text: या, “पूर्ण दशा में कर देगा” अथवा “प्रतिफल देगा”; इब्रानी क्रिया में पूर्ण करने, भरपाई करने या पुनःस्थापित करने का भाव हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “तुम्हारी धार्मिकता का निवास।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: यदि
  rationale: यह बिलदद की शर्त को आरम्भ करने वाला सामान्य शर्तसूचक अव्यय है।
- source_word: זַךְ
  choice: शुद्ध
  rationale: ज्ञान-साहित्य के इस प्रसंग में यह नैतिक निर्मलता व्यक्त करता है, बिना कानूनी निर्दोषता का अर्थ आवश्यकता से अधिक प्रबल किए।
- source_word: יָשָׁר
  choice: खरे
  rationale: यह नैतिक सीधाई और सत्यनिष्ठा का स्वाभाविक आधुनिक हिन्दी रूप है; ‘सीधे’ से उत्पन्न हो सकने वाले भौतिक अर्थ से भी बचता है।
- source_word: כִּי עַתָּה
  choice: तो निश्चय ही ... अभी
  rationale: यहाँ כִּי उत्तरवाक्य में बल और आश्वासन देता है; ‘निश्चय ही’ और ‘अभी’ उस बल तथा तात्कालिकता को बनाए रखते हैं।
- source_word: יָעִיר עָלֶיךָ
  choice: वह ... तुम्हारे लिए जाग उठेगा
  rationale: עור के हिफ़ील रूप की जागने या सक्रिय होने की उपमा को बनाए रखता है, और עָלֶיךָ का हितार्थक भाव ‘तुम्हारे लिए’ से व्यक्त होता है।
- source_word: וְשִׁלַּם
  choice: और ... पुनःस्थापित करेगा
  rationale: पिएल में שׁלם का अर्थ पूर्ण करना, भरपाई करना या बहाल करना हो सकता है; निवास के साथ ‘पुनःस्थापित करना’ प्रसंगानुकूल है और मूल अर्थ-क्षेत्र को पर्याप्त रूप से सुरक्षित रखता है।
- source_word: נְוַת
  choice: निवास
  rationale: यह रहने की जगह, घर-परिवार अथवा आवासीय संपदा का व्यापक अर्थ रख सकता है; ‘निवास’ गरिमापूर्ण और पर्याप्त रूप से व्यापक है।
- source_word: צִדְקֶךָ
  choice: तुम्हारे धर्ममय
  rationale: सम्बन्धवाचक इब्रानी पदबंध को स्वाभाविक हिन्दी विशेषण के रूप में प्रस्तुत किया गया है; शाब्दिक संरचना पादटिप्पणी में दी गई है।
theological_decisions:
- issue: उत्तरवाक्य की क्रियाओं का अप्रकट कर्ता
  choice: कर्ता को ‘वह’ रखा गया है, जो प्रसंग में परमेश्वर की ओर संकेत करता है।
  alternative: अनुवाद में स्पष्ट रूप से ‘परमेश्वर’ जोड़ना।
  rationale: इब्रानी क्रियारूपों में कर्ता निहित है और पद में परमेश्वर नामतः नहीं लिखा; ‘वह’ मूल की अभिव्यक्ति को बनाए रखते हुए प्रसंग से अर्थ स्पष्ट होने देता है।
- issue: बिलदद के कथन का धर्मवैचारिक बल
  choice: इसे बिलदद के निश्चित शर्तात्मक दावे के रूप में अनूदित किया गया है।
  alternative: कथावाचक को बिलदद की प्रतिफलवादी धारणा से दूर दिखाने के लिए कथन को नरम करना।
  rationale: अनुवाद वक्ता की बात को न तो समर्थन देता है, न पहले से सुधारता है; वह उसके दावे और उसमें निहित तनाव को यथावत प्रस्तुत करता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सरल किंतु गरिमापूर्ण रखी गई है। ‘शुद्ध और खरे’ नैतिक गुणों की स्वाभाविक जोड़ी है। ‘धर्ममय निवास’ मूल पदबंध की नैतिक विशेषता बनाए रखता है, जबकि अधिक शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
