  text: He is full of moisture before the sun[b][a], and his shoots spread out over his garden.
translation:
  language: hi
  text: 'वह सूर्य के सम्मुख[a] नमी से भरा रहता है,

    और उसका कोमल अंकुर उसके बगीचे पर निकलता है।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘सूर्य के सम्मुख’ का अर्थ ‘सूर्य के सामने’ या ‘सूर्य के प्रकाश में’ हो सकता है; इसका अर्थ अनिवार्य रूप से ‘सूर्योदय से पहले’ नहीं है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘और उसकी कोमल नई बढ़त उसके बगीचे पर फैलती है।’ इब्रानी संज्ञा व्याकरणतः एकवचन है, पर उसे समूहवाचक रूप में भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רָטֹב
  choice: नमी से भरा
  rationale: यह विशेषण नम या अच्छी तरह सिंचा हुआ होने का ठोस चित्र देता है; ‘हरा-भरा’ कहने से भाव कुछ अधिक व्याख्यात्मक हो जाता।
- source_word: הוּא
  choice: वह
  rationale: इब्रानी का पुल्लिंग सर्वनाम पौधे के मानवीकरण को बनाए रखता है, इसलिए निर्जीव ‘यह’ के बजाय ‘वह’ रखा गया है।
- source_word: לִפְנֵי שָׁמֶשׁ
  choice: सूर्य के सामने
  rationale: शाब्दिक स्थानवाचक अभिव्यक्ति को स्वाभाविक हिन्दी में रखा गया है; यह सूर्योदय से पहले का समय अनिवार्य रूप से नहीं बताती।
- source_word: וְעַל גַּנָּתוֹ
  choice: और ... उसके बगीचे पर
  rationale: וְעַל का संयोजक और स्थानवाचक अर्थ सुरक्षित है तथा 3 पुल्लिंग एकवचन संबंधसूचक प्रत्यय ‘उसके’ से व्यक्त हुआ है।
- source_word: יֹנַקְתּוֹ
  choice: उसकी कोमल शाखाएँ
  rationale: शब्द कोमल नई बढ़त या अंकुर को सूचित करता है। बहुवचन भाव पौधे की फैली हुई बढ़त को सहज हिन्दी में व्यक्त करता है, जबकि इब्रानी रूप व्याकरणतः एकवचन और संभवतः समूहवाचक है।
- source_word: תֵצֵא
  choice: फैलती जाती हैं
  rationale: मूल क्रिया का अर्थ ‘निकलना/आगे बढ़ना’ है; बगीचे पर वनस्पति की बढ़त के प्रसंग में ‘फैलती जाती हैं’ उस बाहरी गति को स्वाभाविक हिन्दी में व्यक्त करता है।
