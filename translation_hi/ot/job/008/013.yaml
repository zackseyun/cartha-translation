base_translation:
  language: en
  yaml_path: translation/ot/job/008/013.yaml
  text: So are the paths of all who forget God[a], and the hope of the godless will perish.
translation:
  language: hi
  text: परमेश्वर को भूलने वाले सब लोगों के मार्ग ऐसे ही होते हैं, और भक्तिहीन[a] की आशा नष्ट हो जाएगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पाखंडी।” इब्रानी शब्द किसी अधार्मिक या परमेश्वर के प्रति श्रद्धाहीन व्यक्ति को भी सूचित कर सकता है; यहाँ “भक्तिहीन” संदर्भ के अधिक अनुकूल है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: ऐसे ही
  rationale: यह पिछले पदों के चित्र से तुलना और निष्कर्ष दोनों प्रकट करता है; ‘ऐसे ही’ हिन्दी में इस संबंध को स्वाभाविक रूप से बनाए रखता है।
- source_word: אָרְחוֹת
  choice: मार्ग
  rationale: बहुवचन रूप जीवन की दिशा या चाल के रूपक को बनाए रखता है; ‘मार्ग’ गरिमापूर्ण और सामान्यतः बोधगम्य है।
- source_word: שֹׁכְחֵי אֵל
  choice: जो परमेश्वर को भूल जाते हैं
  rationale: इब्रानी कृदन्तीय पदबंध को हिन्दी में स्वाभाविक संबंधवाचक उपवाक्य के रूप में दिया गया है। אֵל यहाँ सामान्य ईश्वरीय पदवी है, इसलिए उसका लिप्यंतरण नहीं किया गया।
- source_word: תִקְוַת
  choice: की आशा
  rationale: यह संज्ञा आशा या अपेक्षा का अर्थ देती है; इस ज्ञान-साहित्यिक संदर्भ में ‘आशा’ अधिक स्वाभाविक है।
- source_word: חָנֵף
  choice: भक्तिहीन
  rationale: अय्यूब में यह शब्द केवल दिखावटी आचरण नहीं, बल्कि परमेश्वर के प्रति श्रद्धाहीन या अपवित्र व्यक्ति को भी सूचित करता है। ‘भक्तिहीन’ इस धार्मिक-नैतिक अर्थ को ‘पाखंडी’ की अपेक्षा अधिक व्यापक रखता है।
- source_word: תֹּאבֵד
  choice: नष्ट हो जाएगी
  rationale: אבד विनाश, मिट जाने या खो जाने का भाव देता है; स्त्रीलिंग ‘आशा’ के साथ यह रूप स्वाभाविक है और कथन की गंभीरता बनाए रखता है।
theological_decisions:
- issue: ज्ञान-साहित्य में חָנֵף का अर्थ
  choice: भक्तिहीन
  alternative: पाखंडी
  rationale: ‘पाखंडी’ आधुनिक हिन्दी में प्रायः केवल ढोंग या कथनी-करनी के अंतर तक सीमित समझा जाता है। इब्रानी शब्द यहाँ अधिक व्यापक रूप से परमेश्वर के प्रति श्रद्धाहीन व्यक्ति का संकेत दे सकता है; इसलिए मुख्य पाठ में ‘भक्तिहीन’ रखा गया और पारंपरिक विकल्प पाद-टिप्पणी में दिया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। पिछले पदों के रूपक से संबंध बनाए रखने के लिए ‘मार्ग’ और निष्कर्षसूचक ‘ऐसे ही’ चुने गए हैं। पाद-टिप्पणी का चिह्न उसी शब्द ‘भक्तिहीन’ पर रखा गया है जिससे वह संबंधित है।
