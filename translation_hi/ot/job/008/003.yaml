base_translation:
  language: en
  yaml_path: translation/ot/job/008/003.yaml
  text: Does God pervert justice[a], or does the Almighty pervert righteousness?
translation:
  language: hi
  text: 'क्या परमेश्वर न्याय[a] को विकृत करता है,

    या सर्वशक्तिमान धार्मिकता को विकृत करता है?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या “न्याय-निर्णय”; पूरी पंक्ति का अनुवाद इस प्रकार भी हो सकता है: “क्या परमेश्वर न्याय-निर्णय को टेढ़ा करता है, या सर्वशक्तिमान धार्मिकता को टेढ़ा करता है?”'
    reason: מִשְׁפָּט के “न्याय-निर्णय” और צֶדֶק के “धार्मिकता/न्यायोचितता” जैसे संबंधित अर्थों तथा יְעַוֵּת के “टेढ़ा करना” रूपक को दर्शाने के लिए।
lexical_decisions:
- source_word: הַאֵל
  choice: क्या परमेश्वर
  rationale: प्रश्नवाचक הַ को ‘क्या’ से व्यक्त किया गया है। אֵל यहाँ व्यक्तिवाचक नाम नहीं, बल्कि परमेश्वर के लिए सामान्य उपाधि है।
- source_word: יְעַוֵּת
  choice: विकृत करता है
  rationale: עוה के पिएल रूप में किसी चीज़ को टेढ़ा करने या बिगाड़ने का प्रबल कानूनी-नैतिक भाव है। ‘विकृत करना’ उस भाव को स्वाभाविक और स्पष्ट हिन्दी में रखता है।
- source_word: מִשְׁפָּט
  choice: न्याय
  rationale: यहाँ शब्द न्यायपूर्ण निर्णय और कानूनी-नैतिक न्याय के मानक की ओर संकेत करता है; ‘न्याय’ आधुनिक हिन्दी में संक्षिप्त और सहज है।
- source_word: וְאִם
  choice: या
  rationale: शाब्दिक रूप से यह ‘और यदि’ है, पर समानांतर आलंकारिक प्रश्न के दूसरे खंड में इसका कार्य विकल्पसूचक है; इसलिए ‘या’ स्वाभाविक हिन्दी है।
- source_word: שַׁדַּי
  choice: सर्वशक्तिमान
  rationale: שַׁדַּי को यहाँ लिप्यंतरित नाम के बजाय ईश्वरीय उपाधि के रूप में अनूदित किया गया है।
- source_word: צֶדֶק
  choice: धार्मिकता
  rationale: यह शब्द नैतिक सहीपन और न्यायोचितता का भाव रखता है। ‘धार्मिकता’ इसे מִשְׁפָּט के ‘न्याय’ से अलग रखते हुए दोनों की अर्थगत निकटता बनाए रखती है।
theological_decisions:
- issue: אֵל और שַׁדַּי की समानांतर ईश्वरीय उपाधियाँ
  choice: परमेश्वर ... सर्वशक्तिमान
  alternative: एल ... शद्दै
  rationale: इस प्रसंग में दोनों ईश्वरीय उपाधियाँ हैं। अर्थानुवाद सामान्य पाठक के लिए स्पष्ट है और काव्यात्मक समानांतरता को बनाए रखता है।
- issue: מִשְׁפָּט और צֶדֶק के बीच भेद
  choice: न्याय ... धार्मिकता
  alternative: न्याय ... न्याय; न्याय-निर्णय ... न्यायोचितता
  rationale: इब्रानी में दोनों निकट-संबंधित, पर अलग कानूनी-नैतिक शब्द हैं। अलग हिन्दी शब्द उनके भेद को मिटाए बिना उनकी समानांतरता बनाए रखते हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। दोनों खंडों में एक ही क्रिया दोहराकर इब्रानी समानांतरता और आलंकारिक प्रश्न का बल सुरक्षित रखा गया है।
