  yaml_path: translation/ot/job/008/002.yaml
  text: How long will you keep saying these things[a], and the words of your mouth be a mighty wind?
translation:
  language: hi
  text: '“तुम कब तक ये बातें कहते रहोगे,

    और तुम्हारे मुँह के वचन प्रचण्ड हवा हैं?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम कब तक ये बातें बोलोगे, और तुम्हारे मुँह के वचन तेज़ हवा हैं?”
    reason: ‘बोलोगे’ תְּמַלֶּל का एक सीधा विकल्प है, और ‘तेज़ हवा’ רוּחַ כַּבִּיר के लिए सम्भव कम-प्रबल विकल्प है।
lexical_decisions:
- source_word: עַד אָן
  choice: कब तक
  rationale: यह स्वाभाविक हिन्दी प्रश्नवाचक अभिव्यक्ति है और बिल्दद की अधीर फटकार का बल बनाए रखती है।
- source_word: תְּמַלֶּל
  choice: कहते रहोगे
  rationale: क्रिया बोलने या कहने को व्यक्त करती है; ‘रहोगे’ प्रसंग में चलती आ रही वाणी और अधीर प्रश्न को सहज हिन्दी में प्रकट करता है।
- source_word: אֵלֶּה
  choice: ये बातें
  rationale: बहुवचन संकेतवाचक शब्द अय्यूब के पिछले कथनों की ओर संकेत करता है; ‘बातें’ अगली पंक्ति के ‘वचन’ से अनावश्यक पुनरावृत्ति भी टालता है।
- source_word: וְרוּחַ כַּבִּיר
  choice: और ... प्रचण्ड हवा बने रहेंगे
  rationale: ‘हवा’ मूल रूपक को बनाए रखती है और ‘प्रचण्ड’ כַּבִּיר की शक्ति एवं तीव्रता को स्वाभाविक काव्यात्मक हिन्दी में व्यक्त करता है। बहुवचन ‘वचन’ के साथ हिन्दी व्याकरण के अनुसार ‘बने रहेंगे’ रखा गया है।
- source_word: אִמְרֵי פִיךָ
  choice: तुम्हारे मुँह के वचन
  rationale: यह मूल रचना की ठोस अभिव्यक्ति और काव्यात्मक समानांतरता को सुरक्षित रखते हुए गरिमापूर्ण हिन्दी देता है।
