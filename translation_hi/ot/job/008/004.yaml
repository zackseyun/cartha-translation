base_translation:
  language: en
  yaml_path: translation/ot/job/008/004.yaml
  text: If your sons sinned against him[a], he gave them over into the hand of their transgression.
translation:
  language: hi
  text: यदि तेरे पुत्रों ने उसके विरुद्ध पाप किया, तो उसने उन्हें उनके अपराध के हाथ में सौंप दिया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसने उन्हें उनके अपराध के वश में कर दिया।’ इब्रानी मुहावरे का शाब्दिक अर्थ है ‘उनके अपराध के हाथ में।’
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: यदि
  rationale: यह सामान्य रूप से शर्त प्रस्तुत करने वाला अव्यय है। ‘यदि’ बिल्दद के कथन की शर्तात्मक प्रकृति बनाए रखता है; ‘क्योंकि’ अनावश्यक रूप से इसे निश्चित आरोप बना देता।
- source_word: בָּנֶיךָ
  choice: तेरे पुत्रों
  rationale: मूल शब्द पुल्लिंग बहुवचन ‘पुत्र’ है। इसलिए अधिक व्यापक ‘सन्तानों’ के बजाय लिंग-सटीक रूप रखा गया है।
- source_word: חָטְאוּ לוֹ
  choice: उसके विरुद्ध पाप किया
  rationale: חטא के साथ ל उस व्यक्ति को सूचित कर सकता है जिसके विरुद्ध पाप हुआ। प्रसंग में सर्वनाम का संकेत परमेश्वर की ओर है, पर मूल की तरह नाम न जोड़कर सर्वनाम ही रखा गया है।
- source_word: וַיְשַׁלְּחֵם
  choice: उसने उन्हें ... सौंप दिया
  rationale: שלח का मूल अर्थ ‘भेजना’ है, पर आगे आए ‘हाथ में’ मुहावरे के साथ यहाँ किसी सत्ता या परिणाम के अधीन कर देने का भाव है।
- source_word: בְּיַד
  choice: के हाथ में
  rationale: इब्रानी मुहावरा किसी के अधिकार या वश में सौंपे जाने को दर्शाता है। मुख्य पाठ में ‘हाथ’ का रूपक सुरक्षित रखा गया है।
- source_word: פִּשְׁעָם
  choice: उनके अपराध
  rationale: פשע सामान्य पाप से अधिक जानबूझकर किए गए उल्लंघन या विद्रोह का भाव रख सकता है। ‘अपराध’ पहले आए ‘पाप’ से शब्दगत भेद बनाए रखता है और हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: ‘उसके विरुद्ध’ में सर्वनाम का संदर्भ
  choice: मूल पाठ की तरह सर्वनाम रखा गया है; प्रसंग में इसका स्वाभाविक संकेत परमेश्वर की ओर है।
  alternative: सर्वनाम के स्थान पर स्पष्ट रूप से ‘परमेश्वर के विरुद्ध’ कहना।
  rationale: बिल्दद परमेश्वर के न्याय की चर्चा कर रहा है, इसलिए संदर्भ स्पष्ट है; फिर भी मूल की औपचारिक अभिव्यक्ति और उसकी हल्की अस्पष्टता बनाए रखने के लिए नाम नहीं जोड़ा गया।
- issue: परिणाम बताने वाले उपवाक्य का अर्थ
  choice: ‘उसने उन्हें उनके अपराध के हाथ में सौंप दिया’
  alternative: ‘उसने उन्हें उनके अपराध के वश में कर दिया’ अथवा ‘उसने उनके अपराध के कारण उन्हें दूर कर दिया।’
  rationale: चुना हुआ रूप दिव्य क्रिया और उनके अपने अपराध की सत्ता—दोनों को सामने रखता है। यह दण्ड की कोई ऐसी विशिष्ट धर्मवैज्ञानिक व्याख्या नहीं जोड़ता जिसे पाठ स्वयं स्पष्ट नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। अय्यूब से सीधे संबोधन के कारण एकवचन ‘तेरे’ रखा गया है। ‘अपराध के हाथ में’ जानबूझकर कुछ रूपकात्मक है; पादटिप्पणी उसका स्वाभाविक हिन्दी अर्थ स्पष्ट करती है।
