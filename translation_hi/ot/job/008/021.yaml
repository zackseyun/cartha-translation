source:
  edition: WLC
  text: עַד יְמַלֵּ֣ה שְׂח֣וֹק פִּ֑י/ךָ וּ/שְׂפָתֶ֥י/ךָ תְרוּעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/021.yaml
  text: He will yet fill your mouth with laughter[a], and your lips with shouting.
translation:
  language: hi
  text: वह फिर तेरे मुँह को हँसी से और तेरे होंठों को जयजयकार से भर देगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब तक वह तेरे मुँह को हँसी से और तेरे होंठों को जयजयकार से न भर दे।”
    reason: עַד का सामान्य कालवाचक अर्थ ‘जब तक’ भी संभव है; इससे पद को अगले कथन से जुड़ा अधीन वाक्य समझा जा सकता है।
lexical_decisions:
- source_word: עַד
  choice: फिर
  rationale: यहाँ עַד को पिछले पद में परमेश्वर के कार्य की प्रतिज्ञा के संदर्भ में भावी पुनर्स्थापना के अर्थ में लिया गया है। हिंदी में ‘फिर’ इस भाव को स्वाभाविक रूप से व्यक्त करता है; ‘जब तक’ मूल की संभव कालवाचक रचना है, जिसे पादटिप्पणी में रखा गया है।
- source_word: יְמַלֵּה
  choice: भर देगा
  rationale: מלא का पिएल अपूर्ण रूप 3 पुं. एक. है। पिछले पद से परमेश्वर निहित कर्ता है और संदर्भ में इसका भाव भावी प्रतिज्ञा का है।
- source_word: שְׂחוֹק
  choice: हँसी
  rationale: संज्ञा का सीधा अर्थ ‘हँसी’ है। पुनर्स्थापना के संदर्भ में नकारात्मक ‘उपहास’ का अर्थ उचित नहीं, और व्यापक ‘आनंद’ काव्यात्मक चित्र को धुँधला करता है।
- source_word: פִּיךָ
  choice: तेरे मुँह को
  rationale: द्वितीय पुरुष पुल्लिंग एकवचन प्रत्यय सहित शाब्दिक और स्वाभाविक रूप; ‘मुँह को हँसी से भरना’ का सजीव काव्यात्मक बिंब सुरक्षित रहता है।
- source_word: וּשְׂפָתֶיךָ
  choice: और तेरे होंठों को
  rationale: ‘मुँह’ के समानांतर शारीरिक बिंब को बनाए रखने के लिए प्रत्यक्ष अनुवाद किया गया है; ‘वाणी’ कहने से समानांतरता कम हो जाती।
- source_word: תְרוּעָה
  choice: जयजयकार
  rationale: यह शब्द ऊँची पुकार को दर्शाता है, प्रायः आनंद या विजय की पुकार। ‘जयजयकार’ हिंदी में इस सकारात्मक संदर्भ और काव्यात्मक समानांतरता को संक्षेप में व्यक्त करता है, बिना इसे अनिवार्यतः उपासना या युद्ध तक सीमित किए।
theological_decisions:
- issue: क्रिया का निहित कर्ता
  choice: ‘वह’—अर्थात पिछले पद के संदर्भ से परमेश्वर
  alternative: कर्तृवाच्य को अस्पष्ट रखते हुए ‘तेरा मुँह हँसी से भर जाएगा’
  rationale: पद 20 में परमेश्वर कर्ता है और पद 21 उसी विचार को स्वाभाविक रूप से आगे बढ़ाता है। ‘वह’ रखने से इब्रानी क्रियारूप और परमेश्वर द्वारा पुनर्स्थापना का आशय सुरक्षित रहता है।
- issue: עַד की वाक्यगत भूमिका
  choice: भावी आश्वासन के रूप में ‘फिर’
  alternative: अधीन कालवाचक वाक्य के रूप में ‘जब तक वह...न भर दे’
  rationale: मसोरेटिक पद अपने वर्तमान विभाजन में स्वतंत्र कथन की तरह पढ़ा जा सकता है, फिर भी עַד सामान्यतः ‘जब तक’ भी हो सकता है। मुख्य पाठ स्वाभाविक हिंदी में प्रतिज्ञात्मक भाव देता है और पादटिप्पणी मूल की वास्तविक वाक्यगत अस्पष्टता सुरक्षित रखती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिंदी। अय्यूब से एकवचन निकट संबोधन को बनाए रखने के लिए ‘तेरे’ प्रयोग किया गया है। ‘मुँह/होंठ’ की इब्रानी समानांतरता तथा ‘हँसी/जयजयकार’ की बढ़ती हुई आनंदमय अभिव्यक्ति सुरक्षित रखी गई है।
