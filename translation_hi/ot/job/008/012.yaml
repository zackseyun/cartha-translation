  - marker: b
    text: या “तोड़ा नहीं गया होता।”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹדֶנּוּ
  choice: जब वह अभी ... ही होता है
  rationale: यह रूप पौधे की जारी अवस्था को व्यक्त करता है; हिन्दी में ‘जब वह अभी ... ही होता है’ समय-संबंधी भाव को स्वाभाविक रूप से प्रकट करता है।
- source_word: בְאִבּוֹ
  choice: अपनी नई बढ़वार में
  rationale: אֵב/אִב पौधे की ताज़ी, हरी बढ़वार या अंकुरित अवस्था को दर्शाता है। ‘नई बढ़वार’ अर्थ की व्यापकता बनाए रखती है और केवल ‘कोंपल’ तक सीमित नहीं करती।
- source_word: לֹא יִקָּטֵף
  choice: काटा भी नहीं गया होता
  rationale: קטף का निफ़अल रूप यहाँ पौधे के काटे या तोड़े जाने का निष्क्रिय भाव देता है। ‘काटा’ सरकंडे जैसे पौधे के संदर्भ में सहज है।
- source_word: וְלִפְנֵי כָל חָצִיר
  choice: तभी वह किसी भी दूसरी घास से पहले
  rationale: यह समय की तुलना व्यक्त करता है। ‘किसी भी दूसरी घास से पहले’ हिन्दी में तुलना को स्पष्ट और स्वाभाविक बनाता है।
- source_word: יִיבָשׁ
  choice: सूख जाता है
  rationale: יבש का मूल अर्थ सूखना या मुरझाना है; जल पर निर्भर पौधे के चित्र में ‘सूख जाता है’ सीधा और सटीक है।
