- source_word: לֹא רְאִיתִיךָ
  choice: मैंने तुम्हें नहीं देखा
  rationale: यह प्रत्यक्ष इनकार का कथन है। शाब्दिक दृश्य-बिंब को “मैं तुम्हें नहीं जानता” जैसे व्याख्यात्मक विस्तार के बिना सुरक्षित रखा गया है।
