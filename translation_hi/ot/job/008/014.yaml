  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण काव्यात्मक गद्य। समानान्तरता बनाए रखने के लिए दोनों पंक्तियाँ ‘जिसका’ से जुड़ी हैं। ‘मकड़ी का जाला’ हिन्दी पाठक के लिए बिंब को तुरंत स्पष्ट करता है, जबकि शाब्दिक ‘घर’ पादटिप्पणी में दिया गया है।
