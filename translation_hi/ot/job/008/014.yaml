  text: whose confidence is cut off[c][b][a], and whose trust is a spider’s house.
translation:
  language: hi
  text: 'जिसका भरोसा टूट जाता है,[a][b]

    और जिसका सहारा मकड़ी का जाला है।[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘जिसकी आशा मिट जाती है’; यहाँ इब्रानी संज्ञा का अर्थ भरोसा, आशा या सुरक्षा हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘टूट जाता है’ के लिए प्रयुक्त इब्रानी क्रिया दुर्लभ है और उसके अर्थ पर मतभेद है; इसका अर्थ ‘काट दिया जाता है’ या ‘अलग कर दिया जाता है’ भी हो सकता है, और यहाँ कम सम्भावित अर्थ ‘घृणित ठहरता है’ है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से ‘मकड़ी का घर’; आशय यह है कि उसका सहारा मकड़ी के जाले जितना नाज़ुक है।
    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר
  choice: जिसका
  rationale: सम्बन्धवाचक अव्यय पिछले पद में वर्णित भक्तिहीन व्यक्ति से इस कथन को जोड़ता है; हिन्दी में ‘जिसका’ दोनों समानान्तर पंक्तियों को स्वाभाविक रूप से बाँधता है।
- source_word: יָקוֹט
  choice: टूट जाता है
  rationale: यह दुर्लभ और विवादित क्रिया उस व्यक्ति के भरोसे के नष्ट हो जाने को व्यक्त करती है। ‘टूट जाता है’ हिन्दी में पतन और विफलता दोनों का संकेत देता है, जबकि पाठ की अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: כִּסְלוֹ
  choice: उसका भरोसा
  rationale: यहाँ शब्द का अर्थ ‘भरोसा/आशा/सुरक्षा’ है, जैसा समानान्तर מִבְטַחוֹ से स्पष्ट है। ‘भरोसा’ सामान्य, वर्तमान हिन्दी में सहज है।
- source_word: וּבֵית עַכָּבִישׁ
  choice: और ... मकड़ी का जाला
  rationale: शाब्दिक रूप ‘मकड़ी का घर’ है, पर हिन्दी में वास्तविक बिंब ‘मकड़ी का जाला’ अधिक स्पष्ट और स्वाभाविक है; ‘घर’ का शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: מִבְטַחוֹ
  choice: उसका सहारा
  rationale: संज्ञा भरोसे के आधार या सुरक्षा को दर्शाती है। ‘सहारा’ पहली पंक्ति के ‘भरोसा’ से अनावश्यक पुनरुक्ति बचाते हुए उस आधार को व्यक्त करता है जिस पर व्यक्ति निर्भर है।
