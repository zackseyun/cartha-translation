base_translation:
  language: en
  yaml_path: translation/ot/job/015/008.yaml
  text: Have you listened in the council of God[a], and restricted wisdom to yourself?
translation:
  language: hi
  text: क्या तूने परमेश्वर की गुप्त सभा[a] में सुना है? क्या तूने बुद्धि को अपने ही लिए रोक रखा है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘परमेश्वर के गुप्त परामर्श’ में। इब्रानी शब्द का अर्थ गोपनीय सभा, अंतरंग मंडली या गुप्त विचार-विमर्श हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַ/בְ/סוֹד
  choice: गुप्त सभा में
  rationale: סוֹד गोपनीय परामर्श, अंतरंग मंडली या सभा का बोध करा सकता है। यहाँ ईश्वर की भीतरी विचार-विमर्श सभा की छवि उपयुक्त है; ‘गुप्त’ इसकी गोपनीयता भी बनाए रखता है।
- source_word: אֱלוֹהַ
  choice: परमेश्वर
  rationale: अय्यूब में प्रयुक्त एकवचन אֱלוֹהַ का स्वाभाविक और गरिमापूर्ण हिन्दी समतुल्य।
- source_word: תִּשְׁמָע
  choice: तूने ... सुना है
  rationale: שׁמע का अर्थ सुनना या ध्यान से सुनना है। आलंकारिक प्रश्न में पूर्ण अनुभव का दावा पूछा जा रहा है, जिसे हिन्दी में ‘सुना है’ सहज रूप से व्यक्त करता है।
- source_word: וְ/תִגְרַע
  choice: रोक रखा है
  rationale: גרע घटाने, वंचित करने या रोक रखने का अर्थ दे सकता है। אֵלֶיךָ के साथ यहाँ भाव है कि संबोधित व्यक्ति ने बुद्धि को दूसरों से रोककर अपने लिए सुरक्षित कर लिया हो।
- source_word: אֵלֶיךָ
  choice: अपने ही लिए
  rationale: दिशा-सूचक संबंध यहाँ विशिष्ट स्व-अधिकार के भाव में है; ‘ही’ आलंकारिक आरोप को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: חָכְמָה
  choice: बुद्धि
  rationale: חָכְמָה के लिए सामान्य हिन्दी शब्द; यहाँ सामान्य विवेक या ज्ञान-बुद्धि अभिप्रेत है।
theological_decisions:
- issue: परमेश्वर के סוֹד का अर्थ
  choice: परमेश्वर की गुप्त सभा
  alternative: परमेश्वर का गुप्त परामर्श/भेद
  rationale: संदर्भ अय्यूब के परमेश्वर की अंतरंग विचार-विमर्श सभा तक विशेष पहुँच रखने के दावे का उपहास करता है। ‘गुप्त सभा’ सामूहिक और गोपनीय दोनों आयाम रखती है; पादटिप्पणी अन्य वास्तविक अर्थों को सुरक्षित रखती है।
- issue: दूसरे प्रश्न में बुद्धि पर एकाधिकार का आरोप
  choice: क्या तूने बुद्धि को अपने ही लिए रोक रखा है?
  alternative: क्या बुद्धि केवल तुझ तक सीमित है?
  rationale: हिब्रू क्रिया को सक्रिय रूप में रखते हुए यह अनुवाद इस व्यंग्यपूर्ण आरोप को बनाए रखता है कि अय्यूब मानो बुद्धि को अपने लिए सुरक्षित रखता हो।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी; अय्यूब को संबोधित एकवचन ‘तू’ मूल के 2 पुरुष एकवचन और तीखे आलंकारिक स्वर को बनाए रखता है। दोनों खंडों को अलग प्रश्न बनाया गया है ताकि हिन्दी में व्यंग्य स्पष्ट और स्वाभाविक रहे।
