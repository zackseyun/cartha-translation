lexical_decisions:
- source_word: הֶחָכָם
  choice: बुद्धिमान
  rationale: प्रश्नवाचक הֲ के साथ यह आलंकारिक प्रश्न है। एकवचन पुल्लिंग रूप को स्वाभाविक हिंदी में संज्ञा के रूप में रखा गया है।
- source_word: יַעֲנֶה
  choice: उत्तर देना चाहिए
  rationale: अपूर्ण क्रिया यहाँ आलंकारिक प्रश्न में उचित-अनुचित का भाव व्यक्त करती है; इसलिए 'चाहिए' फटकार के स्वर को स्पष्ट करता है।
- source_word: דַעַת רוּחַ
  choice: हवा-सा ज्ञान
  rationale: शाब्दिक अर्थ 'हवा का ज्ञान' है। संदर्भ में यह खोखले या सारहीन ज्ञान का रूपक है; 'हवा-सा' रूपक को बनाए रखते हुए सहज हिंदी देता है।
- source_word: וִימַלֵּא
  choice: भरना चाहिए
  rationale: यह क्रिया पहले आलंकारिक प्रश्न को आगे बढ़ाती है और भरने की मूल छवि को सुरक्षित रखती है।
- source_word: קָדִים
  choice: पुरवाई
  rationale: यह पूर्व दिशा से आने वाली हवा को दर्शाता है, जो बाइबिलीय संदर्भ में प्रायः कठोर और विनाशकारी होती है। 'पुरवाई' हिंदी में इस ठोस प्राकृतिक छवि को संक्षेप में व्यक्त करती है।
- source_word: בִּטְנוֹ
  choice: अपना पेट
  rationale: मूल का शाब्दिक और सजीव शारीरिक रूपक बनाए रखा गया है।
