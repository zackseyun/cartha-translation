lexical_decisions:
- source_word: מַה
  choice: क्यों
  rationale: शाब्दिक अर्थ ‘क्या’ है, पर इस आलंकारिक प्रश्न में कारण या प्रेरणा पूछी जा रही है; इसलिए स्वाभाविक हिन्दी में ‘क्यों’ उपयुक्त है।
- source_word: יִקָּחֲךָ
  choice: तुझे ... बहकाए लिए जा रहा है
  rationale: לקח का मूल अर्थ ‘लेना’ है। यहाँ ‘मन’ कर्ता है और व्यक्ति को अपने वश में करके अनुचित दिशा में ले जाने का भाव है; यह हिन्दी मुहावरा उस रूपक को स्पष्ट और जीवंत रखता है।
- source_word: לִבֶּךָ
  choice: तेरा मन
  rationale: हिब्रू ‘हृदय’ आंतरिक विचार, इच्छा और भावना का केंद्र हो सकता है। इस प्रसंग में आधुनिक हिन्दी का ‘मन’ स्वाभाविक रूप से वही अर्थ व्यक्त करता है।
- source_word: וּמַה
  choice: और ... क्यों
  rationale: पहले प्रश्न के समान यहाँ भी ‘क्या’ कारण या प्रेरणा के अर्थ में प्रयुक्त है, इसलिए ‘और ... क्यों’ स्वाभाविक है।
- source_word: יִרְזְמוּן
  choice: इशारा कर रही हैं
  rationale: यह दुर्लभ क्रिया है और इसका सटीक भाव अनिश्चित है। संभव अर्थों में आँख मारना, संकेत करना, चमकना या आँखें घुमाना शामिल हैं; मुख्य पाठ में ‘इशारा’ अपेक्षाकृत तटस्थ विकल्प है और अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: עֵינֶיךָ
  choice: तेरी आँखें
  rationale: शाब्दिक और स्वाभाविक अनुवाद, जो मूल की शारीरिक अभिव्यक्ति को बनाए रखता है।
