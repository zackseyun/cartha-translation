  text: Your own mouth condemns you[a], and not I; your own lips testify against you.
translation:
  language: hi
  text: तुम्हारा अपना मुँह ही तुम्हें दोषी ठहराता है, मैं नहीं; और तुम्हारे अपने होंठ तुम्हारे विरुद्ध गवाही देते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַרְשִׁיעֲךָ
  choice: तुम्हें दोषी ठहराता है
  rationale: רשע के हिफ़ील रूप का अर्थ यहाँ न्यायिक ढंग से किसी को दोषी ठहराना है। यह चयन आरोप के भाव को स्पष्ट रखता है, पर ‘दुष्ट सिद्ध करता है’ जैसी अधिक व्याख्यात्मक भाषा से बचता है।
- source_word: פִיךָ
  choice: तुम्हारा अपना मुँह
  rationale: शाब्दिक अर्थ ‘तुम्हारा मुँह’ है। ‘अपना’ संदर्भ में आत्म-दोषारोपण और ‘मैं नहीं’ के साथ विरोध को स्वाभाविक हिन्दी में उभारता है।
- source_word: וְלֹא אָנִי
  choice: मैं नहीं
  rationale: यह पिछले उपवाक्य के साथ सीधा और बलयुक्त विरोध बनाए रखता है; हिन्दी में ‘और’ के बिना अर्धविराम के बाद यह अधिक स्वाभाविक है।
- source_word: וּשְׂפָתֶיךָ
  choice: और तुम्हारे अपने होंठ
  rationale: शाब्दिक रूप से ‘और तुम्हारे होंठ’। ‘अपने’ पहले पद के समानांतर आत्म-दोषारोपण पर बल देता है।
- source_word: יַעֲנוּ
  choice: गवाही देते हैं
  rationale: ענה का मूल अर्थ ‘उत्तर देना’ है, पर इस न्यायिक संदर्भ में अय्यूब के होंठ उसके विरुद्ध साक्षी की तरह बोलते हैं। ‘गवाही देते हैं’ इस अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: בָךְ
  choice: तुम्हारे विरुद्ध
  rationale: 'न्यायिक संदर्भ और יַעֲנוּ के साथ यह पूर्वसर्ग विरोधी अर्थ देता है: अय्यूब के अपने शब्द उसी के विरुद्ध साक्ष्य बनते हैं।'
