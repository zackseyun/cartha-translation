lexical_decisions:
- source_word: כָּל יְמֵי רָשָׁע
  choice: दुष्ट अपने जीवन भर
  rationale: यह वाक्यांश दुष्ट व्यक्ति के सभी दिनों को समेटता है। सहज हिन्दी में ‘अपने जीवन भर’ वही सर्वकालिक भाव व्यक्त करता है; एकवचन ‘दुष्ट’ प्रतिनिधि व्यक्ति को सूचित करता है।
- source_word: הוּא מִתְחוֹלֵל
  choice: पीड़ा से तड़पता रहता है
  rationale: स्वतंत्र सर्वनाम के बल और जारी रहने वाले कृदन्तीय भाव को ‘रहता है’ व्यक्त करता है। क्रिया में ऐंठने, तड़पने अथवा प्रसव-जैसी व्यथा का अर्थ हो सकता है; ‘पीड़ा से तड़पता’ इसकी तीव्रता को स्वाभाविक हिन्दी में रखता है।
- source_word: וּמִסְפַּר שָׁנִים
  choice: और ... गिने हुए वर्ष
  rationale: מִסְפַּר यहाँ निश्चित किंतु अनिर्दिष्ट संख्या का बोध देता है। ‘गिने हुए वर्ष’ सीमित, निर्धारित अवधि को अधिक स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: נִצְפְּנוּ
  choice: छिपाकर रखे गए हैं
  rationale: צפן के निफ़अल रूप में ‘छिपाया जाना’ और ‘सँभालकर/आरक्षित रखा जाना’ दोनों अर्थ संभव हैं। संयुक्त हिन्दी अभिव्यक्ति मूल रूपक और उसकी संदर्भगत आरक्षण-ध्वनि दोनों बनाए रखती है।
- source_word: לֶעָרִיץ
  choice: अत्याचारी के लिए
  rationale: עָרִיץ हिंसक, निर्दयी और दमनकारी व्यक्ति को दर्शाता है। ‘अत्याचारी’ राजनीतिक शासक तक सीमित हुए बिना उस दमनकारी कठोरता को व्यक्त करता है।
