  text: אַל יַאֲמֵ֣ן ב/שו נִתְעָ֑ה כִּי שָׁ֝֗וְא תִּהְיֶ֥ה תְמוּרָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/031.yaml
  text: Let him not trust in emptiness[a], deceiving himself[c][b], for emptiness will be his recompense.
translation:
  language: hi
  text: वह भ्रम में पड़कर[a] व्यर्थता[b] पर भरोसा न करे, क्योंकि बदले में उसे व्यर्थता ही मिलेगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “भटककर,” “बहकाया जाकर,” अथवा “अपने आप को धोखा देकर।” इब्रानी रूप यह स्पष्ट नहीं करता कि वह स्वयं भटका है या उसे भटकाया गया है।
    reason: lexical_alternative
  - marker: b
    text: “व्यर्थता” के लिए प्रयुक्त इब्रानी शब्द का अर्थ “खोखलापन,” “मिथ्यापन” या “निकम्मापन” भी हो सकता है। इसी शब्द की पुनरावृत्ति पद के अंत में भी रखी गई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל יַאֲמֵן
  choice: भरोसा न करे
  rationale: निषेधात्मक אַל के साथ अपूर्ण क्रिया यहाँ चेतावनी या निषेध व्यक्त करती है; אמן के हिफ़ील रूप का अर्थ किसी पर भरोसा रखना है।
- source_word: שָׁוְא
  choice: व्यर्थता
  rationale: यह शब्द खोखलेपन, व्यर्थता, मिथ्यापन या निकम्मेपन का बोध करा सकता है। पद में इसकी पुनरावृत्ति को उसी हिंदी शब्द से सुरक्षित रखा गया है।
- source_word: נִתְעָה
  choice: भ्रम में पड़कर
  rationale: תעה का निफ़अल रूप भटकने, बहकने या भ्रमित होने का भाव रखता है। यह चयन कर्ता के भ्रम में होने को स्वाभाविक हिंदी में व्यक्त करता है, बिना यह निश्चित किए कि उसने स्वयं को धोखा दिया या उसे किसी ने भटकाया।
- source_word: תְּמוּרָתוֹ
  choice: बदले में उसे ... मिलेगी
  rationale: תְּמוּרָה उस वस्तु या परिणाम को दर्शाता है जो विनिमय अथवा बदले में मिलता है; यह मुहावरा आधुनिक हिंदी में उस प्रतिफल को स्पष्ट करता है।
