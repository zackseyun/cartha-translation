  text: הוֹכֵ֣חַ בְּ֭/דָבָר לֹ֣א יִסְכּ֑וֹן וּ֝/מִלִּ֗ים לֹא יוֹעִ֥יל בָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/003.yaml
  text: Should he argue with useless words[a], or with speech that does no good?
translation:
  language: hi
  text: क्या वह निष्फल बातों से बहस करे, और ऐसे शब्दों का प्रयोग करे जिनसे कोई लाभ न हो?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या वह ऐसी बातों से तर्क करे जो लाभदायक नहीं हैं, और ऐसे शब्दों का प्रयोग करे जिनसे उसे कोई लाभ न हो?”
    reason: הוֹכֵחַ में ‘बहस करना’ के साथ ‘तर्क करना’ का अर्थ भी सम्भव है। לֹא יוֹעִיל בָּם को शब्दों की निष्प्रभाविता के रूप में, अथवा ‘वह उनसे लाभ न पाए’ के रूप में समझा जा सकता है।
lexical_decisions:
- source_word: הוֹכֵחַ
  choice: बहस करे
  rationale: यहाँ יכח का हिफ़ील रूप तर्क करने, विवाद करने या डाँटने का भाव दे सकता है। अय्यूब के वाद-विवाद के प्रसंग में ‘बहस करे’ मौखिक प्रतिवाद को स्वाभाविक ढंग से व्यक्त करता है, बिना न्यायिक या अनुशासनात्मक अर्थ को अनावश्यक रूप से प्रमुख बनाए।
- source_word: בְּדָבָר לֹא יִסְכּוֹן
  choice: निष्फल बातों से
  rationale: דָבָר यहाँ अगले समानांतर पद מִלִּים के कारण वाणी या कही गई बातों को सूचित करता है। סכן का अर्थ लाभदायक या उपयोगी होना है; ‘निष्फल बातें’ संक्षेप और स्वाभाविक रूप से ऐसी बातों का भाव देता है जिनसे कोई लाभ नहीं।
- source_word: וּמִלִּים
  choice: और ऐसे शब्दों से
  rationale: מִלִּים का सीधा अर्थ ‘शब्द’ है। ‘बातों’ और ‘शब्दों’ का प्रयोग इब्रानी समानांतरता को बनाए रखते हुए हिन्दी में अनावश्यक हूबहू पुनरावृत्ति से बचाता है। ו को उसके सामान्य संयोजक अर्थ ‘और’ में रखा गया है।
- source_word: לֹא יוֹעִיל בָּם
  choice: जिनसे कोई लाभ नहीं होता
  rationale: יעל लाभ पहुँचाने या उपयोगी होने का भाव देता है और בם पीछे आए शब्दों की ओर संकेत करता है। यह अनुवाद कथन की निष्प्रभाविता स्पष्ट करता है, जबकि वैकल्पिक सम्भावना—‘जिनके द्वारा वह कोई भला नहीं कर सकता’—पादटिप्पणी में सुरक्षित है।
