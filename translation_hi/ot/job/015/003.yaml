translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘निष्फल’ काव्यात्मक ज्ञान-साहित्य के अनुरूप है, पर अर्थ में स्पष्ट है। प्रश्नवाचक रूप पिछले पद से जारी आलंकारिक प्रश्न को व्यक्त करता है।
