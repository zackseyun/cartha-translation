  text: what wise men declare[a], and have not hidden from their fathers—
translation:
  language: hi
  text: जो कुछ ज्ञानी जन बताते हैं और अपने पुरखाओं से नहीं छिपाते[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो उनके पुरखाओं ने नहीं छिपाया,” अथवा “और अपने पुरखाओं से मिली कोई बात नहीं छिपाते।” ‘छिपाने’ और ‘उनके पुरखाओं’ के बीच संबंध को हिब्रू में एक से अधिक प्रकार से समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: אֲשֶׁר
  choice: जिसे
  rationale: यह पिछले पद से जुड़े विषय-वाक्यांश का परिचय देता है। ‘जिसे’ हिन्दी में संबंधवाचक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: חֲכָמִים
  choice: बुद्धिमान
  rationale: यह बहुवचन संज्ञा उन ज्ञानी जनों को सूचित करती है जो पुरखों से मिली शिक्षा आगे बताते हैं। हिन्दी में ‘बुद्धिमान’ संदर्भानुसार सामूहिक बहुवचन के रूप में स्वाभाविक है।
- source_word: יַגִּידוּ
  choice: बताते हैं
  rationale: נגד का हिफ़ील रूप किसी बात को प्रकट करने या बता देने का अर्थ रखता है। ‘बताते हैं’ आधुनिक हिन्दी में सहज है और ज्ञान के संप्रेषण का भाव स्पष्ट करता है।
- source_word: וְלֹא כִחֲדוּ
  choice: और ... नहीं छिपाते
  rationale: כחד यहाँ छिपाने या गुप्त रखने के अर्थ में है। वर्तमानकालीन रूप कथन के सामान्य, परंपरागत स्वर के अनुकूल है।
- source_word: מֵאֲבוֹתָם
  choice: अपने पुरखाओं से
  rationale: यह हिब्रू पदबंध का निकट और स्वाभाविक हिन्दी रूप है। ‘पुरखाओं’ से पैतृक परंपरा का भाव आता है, जबकि ‘से’ मूल संबंध की वास्तविक वाक्यगत अस्पष्टता बनाए रखता है।
theological_decisions:
- issue: מֵאֲבוֹתָם का כִחֲדוּ से वाक्यगत संबंध
  choice: अपने पुरखाओं से नहीं छिपाते
  alternative: जिसे उनके पुरखाओं ने नहीं छिपाया; अथवा अपने पुरखाओं से मिली कोई बात नहीं छिपाते
  rationale: हिब्रू रचना संक्षिप्त है और यह पूर्णतः स्पष्ट नहीं करती कि पुरखे उस ज्ञान के स्रोत हैं या वे व्यक्ति जिनसे बात नहीं छिपाई गई। मुख्य पाठ मूल शब्द-संबंध के निकट रहकर इस अस्पष्टता को बिना अनावश्यक समाधान के सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘पुरखाओं’ का चयन सामान्य पाठक के लिए स्वाभाविक है और पैतृक ज्ञान-परंपरा को व्यक्त करता है। अंतिम दीर्घ विराम-चिह्न यह संकेत देता है कि वाक्य अगले पद में जारी है।
