source:
  edition: WLC
  text: נֹ֘דֵ֤ד ה֣וּא לַ/לֶּ֣חֶם אַיֵּ֑ה יָדַ֓ע כִּֽי נָכ֖וֹן בְּ/יָד֣/וֹ יֽוֹם חֹֽשֶׁךְ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/023.yaml
  text: He wanders about for bread[a], saying[b], ‘Where is it?’ He knows that a day of darkness is ready at hand for him.
translation:
  language: hi
  text: वह रोटी की तलाश में भटकता फिरता है[a] और कहता है, “वह कहाँ है?” वह जानता है कि अंधकार का दिन उसके लिए तैयार है और निकट है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘रोटी’ से सामान्य रूप से भोजन भी अभिप्रेत हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “अंधकार का दिन उसके हाथ में तैयार है।” ‘उसके हाथ में’ का अर्थ सम्भवतः है कि वह दिन उसके लिए निकट या आसन्न है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹדֵד
  choice: भटकता फिरता है
  rationale: काल का कृदन्त निरंतर और बेचैन भटकाव व्यक्त करता है; यह स्वाभाविक हिन्दी है और निर्वासन का अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: לַלֶּחֶם
  choice: रोटी की तलाश में
  rationale: לֶחֶם का मूल अर्थ ‘रोटी’ है, यद्यपि प्रसंग में यह सामान्य भोजन का भी द्योतक हो सकता है। ‘की तलाश में’ उद्देश्यसूचक ל को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אַיֵּה
  choice: वह कहाँ है?
  rationale: प्रश्नवाचक शब्द का अर्थ ‘कहाँ?’ है; हिन्दी में पूर्वोक्त रोटी की ओर संकेत के लिए ‘वह’ जोड़ा गया है।
- source_word: יָדַע
  choice: वह जानता है
  rationale: सरल पूर्ण क्रिया स्थिर बोध व्यक्त करती है; सीधा हिन्दी समतुल्य रखा गया है।
- source_word: נָכוֹן
  choice: तैयार है
  rationale: यह रूप तैयार या स्थापित होने का भाव देता है; आने वाली विपत्ति की आसन्नता के प्रसंग में ‘तैयार है’ मूल बिंब बचाता है।
- source_word: בידו
  choice: उसके लिए निकट ही
  rationale: शाब्दिक अर्थ ‘उसके हाथ में’ है, पर यहाँ सम्भवतः अंधकार के दिन के निकट या आसन्न होने का मुहावरेदार भाव है। मुख्य पाठ में सुबोध अर्थ रखा गया और शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: יום חשך
  choice: अंधकार का दिन
  rationale: यह अंधकार से चिह्नित दिन का बिंब सुरक्षित रखता है और इसे स्पष्टतः विपत्ति, विनाश या न्याय कहकर अर्थ को सीमित नहीं करता।
theological_decisions:
- issue: ‘अंधकार का दिन’ का रूपकात्मक आशय
  choice: अंधकार का दिन
  alternative: विपत्ति का दिन / विनाश का दिन / न्याय का दिन
  rationale: एलीपज के भाषण में यह दुष्ट पर आने वाली विपत्ति की ओर संकेत करता है, पर इब्रानी पद स्वयं बिंबात्मक है। अनुवाद ने किसी विशिष्ट धर्मवैचारिक व्याख्या को मुख्य पाठ में नहीं जोड़ा।
- issue: בידו का सम्बन्ध और अर्थ
  choice: उसके लिए निकट ही तैयार है
  alternative: उसके हाथ में तैयार है
  rationale: शाब्दिक संरचना अस्पष्ट और हिन्दी में अस्वाभाविक है। इसे आसन्नता के सम्भावित मुहावरेदार अर्थ में प्रस्तुत किया गया है, जबकि शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और सामान्य पाठक के लिए बोधगम्य शैली। ‘रोटी’ और ‘अंधकार का दिन’ जैसे ठोस मूल बिंब बनाए रखे गए हैं; अस्पष्ट मुहावरे को मुख्य पाठ में स्वाभाविक बनाया गया है और शाब्दिक रूप पादटिप्पणी में दिया गया है।
