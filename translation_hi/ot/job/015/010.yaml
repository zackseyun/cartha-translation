    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם ... גַּם
  choice: '... और ..., दोनों'
  rationale: दोहराया गया גַּם दो समानांतर वर्गों पर संयुक्त बल देता है; हिंदी में ‘... और ..., दोनों’ इसका स्वाभाविक रूप है।
- source_word: שָׂב
  choice: सफ़ेद बालोंवाले
  rationale: यह शब्द वृद्धावस्था के साथ सफ़ेद बालों की ठोस छवि भी व्यक्त करता है; इसलिए केवल ‘बूढ़े’ कहने के बजाय मूल बिंब रखा गया है।
- source_word: יָשִׁישׁ
  choice: अति वृद्ध
  rationale: यह अत्यधिक बढ़ी हुई आयु का बोध करा सकता है और שָׂב के समानांतर रहते हुए उससे कुछ तीव्र अर्थ देता है।
- source_word: בָּנוּ
  choice: हमारे बीच
  rationale: 'यहाँ בְּ + प्रथम पुरुष बहुवचन प्रत्यय सामाजिक/समुदायगत अर्थ में है: एलीपज़ के समूह या परंपरा के भीतर।'
- source_word: כַּבִּיר
  choice: बड़े
  rationale: यद्यपि सामान्य अर्थ ‘महान/बलवान’ है, מִן के साथ तुलना और ‘दिनों’ के संदर्भ में यह अधिक आयु वाला होने का अर्थ देता है।
- source_word: מֵאָבִיךָ יָמִים
  choice: उम्र में तुम्हारे पिता से भी
  rationale: इब्रानी का शाब्दिक ‘दिनों में तुम्हारे पिता से’ आधुनिक हिंदी में स्वाभाविक रूप से ‘उम्र में तुम्हारे पिता से’ व्यक्त होता है; ‘भी’ तुलना के बल को सहज बनाता है।
