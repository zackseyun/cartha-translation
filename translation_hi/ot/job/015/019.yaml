lexical_decisions:
- source_word: לָהֶם לְבַדָּם
  choice: केवल उन्हीं को
  rationale: दोनों पद मिलकर विशिष्टता पर बल देते हैं—वह देश केवल उन्हीं को दिया गया था। यह हिंदी में स्वाभाविक रूप से उसी ज़ोर को व्यक्त करता है।
- source_word: נִתְּנָה
  choice: दिया गया था
  rationale: נתן का निफ़अल रूप यहाँ कर्मवाच्य है; हिंदी में ‘दिया गया था’ मूल की कर्मवाच्य रचना और प्रसंग के भूतकाल को बनाए रखता है।
- source_word: הָאָרֶץ
  choice: वह देश
  rationale: אֶרֶץ का अर्थ ‘देश/भूमि’ या ‘पृथ्वी’ हो सकता है। यहाँ किसी समुदाय को विशेष रूप से दिए गए भूभाग और बाहरी व्यक्ति के प्रवेश का संदर्भ होने से ‘देश’ अधिक उपयुक्त है; निश्चित उपपद को ‘वह’ से व्यक्त किया गया है।
- source_word: זָר
  choice: पराया
  rationale: זָר समूह से बाहर के व्यक्ति को दर्शाता है। ‘पराया’ जातीयता या राष्ट्रीयता को अनावश्यक रूप से निश्चित किए बिना सामाजिक बाहरीपन का भाव रखता है।
- source_word: עָבַר בְּתוֹכָם
  choice: उनके बीच से नहीं गुज़रा
  rationale: עבר गति या पार जाने और בְּתוֹכָם उनके मध्य होने का भाव देता है। ‘बीच से नहीं गुज़रा’ दोनों तत्वों को स्वाभाविक हिंदी में स्पष्ट करता है।
