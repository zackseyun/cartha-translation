source:
  edition: WLC
  text: כִּֽי עֲדַ֣ת חָנֵ֣ף גַּלְמ֑וּד וְ֝/אֵ֗שׁ אָכְלָ֥ה אָֽהֳלֵי שֹֽׁחַד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/034.yaml
  text: For the company of the godless is barren[b][a], and fire consumes the tents of bribery.
translation:
  language: hi
  text: क्योंकि भक्तिहीनों का समुदाय निष्फल है[a], और आग रिश्वत के तंबुओं को भस्म कर देती है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कपटी की सभा बंजर है।” इब्रानी חָנֵף का अर्थ “कपटी” भी हो सकता है, पर अय्यूब में इसका व्यापक अर्थ प्रायः “भक्तिहीन” या “अधर्मी” है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “रिश्वत के तंबू” या “घूस के तंबू।” यह वाक्यांश ऐसे निवासों को दर्शाता है जिनकी पहचान भ्रष्ट लाभ से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद पिछले कथन का आधार या कारण बताता है; आधुनिक हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עֲדַת
  choice: समुदाय
  rationale: यह किसी एकत्र समूह या मंडली को दर्शाता है। ‘समुदाय’ सहज है और अनावश्यक धार्मिक-संस्थागत अर्थ से बचता है।
- source_word: חָנֵף
  choice: भक्तिहीनों
  rationale: अय्यूब में यह शब्द प्रायः परमेश्वर के प्रति श्रद्धाहीन या अधर्मी व्यक्ति का बोध देता है, केवल कपटी का नहीं। इब्रानी एकवचन यहाँ सामूहिक अर्थ रखता है।
- source_word: גַּלְמוּד
  choice: निष्फल
  rationale: यह उजाड़, संतानहीन या फलरहित होने का भाव दे सकता है। ‘निष्फल’ समूह के टिकाऊ फल या भविष्य से वंचित होने की छवि को हिन्दी में स्वाभाविक रूप से रखता है।
- source_word: וְאֵשׁ
  choice: और आग
  rationale: संयोजक दूसरे समांतर कथन को जोड़ता है; ‘आग’ ठोस काव्यात्मक बिंब बनाए रखती है।
- source_word: אָכְלָה
  choice: भस्म कर देती है
  rationale: पूर्ण क्रिया-रूप यहाँ ज्ञान-साहित्य की सामान्य अथवा निश्चित सच्चाई व्यक्त कर सकता है। ‘भस्म कर देती है’ आग द्वारा निगल लिए जाने के भाव को स्वाभाविक हिन्दी में देता है।
- source_word: אָהֳלֵי
  choice: तंबुओं
  rationale: शाब्दिक ‘तंबू’ को बनाए रखने से प्राचीन परिवेश और ठोस चित्र सुरक्षित रहता है।
- source_word: שֹׁחַד
  choice: घूस से बने
  rationale: शाब्दिक संरचना ‘घूस के तंबू’ है। ‘घूस से बने तंबू’ निवासों के भ्रष्ट लाभ पर खड़े होने का अर्थ स्पष्ट करती है, पर किसी ऐसे कर्ता को नहीं जोड़ती जो मूल में व्यक्त नहीं है।
theological_decisions:
- issue: חָנֵף का नैतिक-धार्मिक अर्थ
  choice: भक्तिहीन
  alternative: कपटी
  rationale: अय्यूब में व्यापक संदर्भ इसे केवल बाहरी ढोंग नहीं, बल्कि परमेश्वर के प्रति श्रद्धाहीनता या अधर्म के अर्थ में प्रयुक्त करता है; विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: גַּלְמוּד की फलहीनता की छवि
  choice: निष्फल रहता है
  alternative: उजाड़ हो जाता है / संतानहीन है
  rationale: मूल शब्द में उजाड़पन और फलहीनता दोनों की गुंजाइश है। ‘निष्फल’ इस बहुअर्थी छवि को बिना उसे केवल जैविक संतानहीनता तक सीमित किए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। काव्यात्मक समानांतरता और ‘आग’ तथा ‘तंबू’ के ठोस बिंब सुरक्षित रखे गए हैं। ‘भक्तिहीन’ धार्मिक-नैतिक बल रखता है, जबकि ‘निष्फल’ मूल की उजाड़पन/फलहीनता संबंधी अर्थ-सीमा को खुला रखता है।
