  to: क्योंकि भक्तिहीनों का समुदाय निष्फल है[a], और आग रिश्वत के तंबुओं को भस्म कर देती है[b]।
  rationale: Revision is needed solely to remove the unsupported causal/material meaning introduced by ‘घूस से बने’ and by the corresponding footnote. ‘रिश्वत के तंबुओं’ retains the Hebrew construct phrase and its deliberate ellipsis. The first clause is retained, with the alternative in footnote a adjusted to match the lexical range of ‘barren.’
