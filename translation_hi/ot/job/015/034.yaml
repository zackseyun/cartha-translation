review_pass:
  verdict: revise
  source_fidelity: 'The first clause accurately conveys כִּי, עֲדַת חָנֵף, and the collective force of the singular חָנֵף. ‘निष्फल’ is an acceptable rendering of גַּלְמוּד, preserving its broad barren/unfruitful sense. The second clause, however, mistranslates the construct phrase אָהֳלֵי שֹׁחַד: it means ‘tents of bribery/a bribe,’ not tents physically ‘made from bribes.’'
  naturalness: The Hindi is generally clear and appropriately dignified. ‘रिश्वत के तंबू’ is both closer to the Hebrew construct and more natural than ‘घूस से बने तंबू.’
  terminology: ‘भक्तिहीन’ suitably represents the religious-moral force of חָנֵף in Job without forcing the narrower sense ‘hypocrite.’ ‘रिश्वत’ accurately renders שֹׁחַד; the footnote preserves the phrase’s elliptical character without adding a means-of-construction meaning.
  issues:
  - severity: medium
    issue: ‘घूस से बने तंबुओं’ adds that the tents were constructed with bribe money.
    rationale: The Hebrew אָהֳלֵי שֹׁחַד is a construct expression, literally ‘tents of bribery/a bribe.’ It characterizes the tents or their occupants by corrupt gain; it does not state the material or financial means by which they were built.
  - severity: low
    issue: Footnote b repeats and reinforces the unsupported ‘built on’ interpretation.
    rationale: While corrupt gain may be the contextual implication, ‘उसी पर खड़े हैं’ makes the added construction/foundation image too definite. The note should retain the literal phrase and state only the likely characterization.
  revised_text: क्योंकि भक्तिहीनों का समुदाय निष्फल है[a], और आग रिश्वत के तंबुओं को भस्म कर देती है[b]।
