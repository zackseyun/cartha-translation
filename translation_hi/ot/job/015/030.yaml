  text: לֹֽא יָס֨וּר מִנִּי חֹ֗שֶׁךְ יֹֽ֭נַקְתּ/וֹ תְּיַבֵּ֣שׁ שַׁלְהָ֑בֶת וְ֝/יָס֗וּר בְּ/ר֣וּחַ פִּֽי/ו־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/030.yaml
  text: He will not depart from darkness[a]; a flame will dry up his shoots[b], and by the breath of his mouth he will pass away.
translation:
  language: hi
  text: 'वह अंधकार से न निकल पाएगा;

    ज्वाला उसकी कोमल कोंपल[b] को सुखा देगी,

    और अपने मुँह की साँस से वह मिट जाएगा[a]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, यदि अंतिम वाक्यांश का संकेत परमेश्वर की ओर समझा जाए, “और परमेश्वर के मुँह की साँस से वह मिट जाएगा।”
    reason: alternative_reading
  - marker: b
    text: '“कोमल कोंपल” पौधे का बिंब है: दुष्ट को ऐसे वृक्ष के समान दिखाया गया है जिसकी नई बढ़त ज्वाला से झुलसकर सूख जाती है।'
    reason: cultural_note
lexical_decisions:
- source_word: יָסוּר ... מִנִּי חֹשֶׁךְ
  choice: अंधकार से न निकल पाएगा
  rationale: סור का मूल भाव हटना या दूर होना है। מן के साथ यहाँ आशय है कि दुष्ट अंधकार अर्थात् विपत्ति से छूट नहीं सकेगा। ‘न निकल पाएगा’ आधुनिक हिन्दी में स्वाभाविक है और असमर्थता का संदर्भगत भाव रखता है।
- source_word: יֹנַקְתּוֹ
  choice: उसकी नई कोंपलों
  rationale: यह पौधे की नई, कोमल बढ़त या अंकुर का बिंब है। ‘नई कोंपलें’ वृक्ष-संबंधी रूपक को सामान्य पाठक के लिए स्पष्ट रखता है।
- source_word: תְּיַבֵּשׁ שַׁלְהָבֶת
  choice: ज्वाला ... सुखा देगी
  rationale: Piel रूप תְּיַבֵּשׁ का अर्थ ‘सुखा देना’ या ‘मुरझा देना’ है और שַׁלְהָבֶת ज्वाला है। यह चयन आग से झुलसकर वनस्पति के सूखने का बिंब बनाए रखता है।
- source_word: וְיָסוּר
  choice: वह मिट जाएगा
  rationale: दूसरा סור हट जाने या समाप्त हो जाने का परिणाम बताता है। ‘मिट जाएगा’ हिन्दी में विनाश का भाव स्वाभाविक रूप से देता है, यद्यपि अधिक शाब्दिक ‘हट जाएगा’ भी संभव है।
- source_word: בְּרוּחַ פִּיו
  choice: अपने मुँह की साँस से
  rationale: רוּחַ का अर्थ साँस, वायु या आत्मा हो सकता है। ‘मुँह’ के साथ ‘साँस’ ठोस और निकटतम अर्थ है; यह वाणी या प्रचंड फूँक की संभावित ध्वनि को पूरी तरह बंद नहीं करता।
- source_word: פִּיו
  choice: अपने मुँह
  rationale: तीसरे पुरुष पुल्लिंग एकवचन प्रत्यय का निकटतम संदर्भ दुष्ट मनुष्य है। हिन्दी में ‘अपने’ से यही संबंध स्पष्ट होता है; परमेश्वर के मुख का वैकल्पिक संदर्भ पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: अंतिम खंड में ‘उसके मुँह’ का संदर्भ
  choice: दुष्ट मनुष्य का अपना मुँह
  alternative: परमेश्वर का मुँह
  rationale: तात्कालिक व्याकरणिक पूर्वपद वही एकवचन दुष्ट व्यक्ति है जिसका वर्णन हो रहा है। फिर भी ‘उसके मुख की साँस’ ईश्वरीय न्याय का संकेत भी हो सकता है, इसलिए इस वास्तविक संदिग्धता को पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। काव्यात्मक समानांतरता के लिए पद को तीन पंक्तियों में प्रस्तुत किया गया है। वनस्पति-रूपक को स्पष्ट रखा गया है और अंतिम सर्वनाम की धर्मवैचारिक संदिग्धता पादटिप्पणी में सुरक्षित है।
