  rationale: हित्पएल रूप के आत्म-संबंधी भाव—अपने को शक्तिशाली ठहराना या दिखाना—को सुरक्षित रखता है, साथ ही सर्वशक्तिमान के विरोध में निहित विडंबना भी बनी रहती है।
