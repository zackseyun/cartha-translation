- source_word: שַׁדַּי
  choice: सर्वशक्तिमान
  rationale: दिव्य उपाधि का प्रचलित हिन्दी अनुवाद है और ‘परमेश्वर’ के साथ काव्यात्मक समानांतरता बनाए रखता है।
