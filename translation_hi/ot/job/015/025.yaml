- source_word: אֶל
  choice: के विरुद्ध / के सामने
  rationale: मूलतः ‘की ओर’ है, पर शत्रुतापूर्ण संदर्भ में पहले पद में ‘के विरुद्ध’ स्वाभाविक है। दूसरे समानांतर पद में ‘के सामने’ आत्म-बल प्रदर्शन का भाव स्वाभाविक रूप से व्यक्त करता है।
