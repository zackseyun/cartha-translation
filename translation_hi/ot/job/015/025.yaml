- issue: אֶל और יִתְגַּבָּר में दिशा बनाम विरोध
  choice: मुख्य पाठ में विरोधपूर्ण अर्थ स्पष्ट करना
  alternative: ‘उसने परमेश्वर की ओर अपना हाथ बढ़ाया है और सर्वशक्तिमान के विरुद्ध अपने को दृढ़ करता है’
  rationale: संदर्भ स्पष्ट रूप से उद्दंड विरोध का है, फिर भी मूल पूर्वसर्ग के शाब्दिक दिशात्मक अर्थ और क्रिया के ‘अपने को दृढ़ करने’ वाले अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
