  text: तो फिर मनुष्य कितना अधिक घिनौना और भ्रष्ट[a] है, जो अन्याय[b] को पानी की तरह पीता है!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपवित्र’ अथवा ‘मैला’; इब्रानी शब्द दुर्लभ है और दूषित या घिनौने होने का भाव देता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘अधर्म’ अथवा ‘दुष्कर्म’।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף כִּי
  choice: तो फिर ... कितना कम
  rationale: 'पिछले पद से न्यूनाधिक तर्क आगे बढ़ता है: जब परमेश्वर के सामने आकाश भी शुद्ध नहीं, तो मनुष्य उससे कहीं कम शुद्ध है। हिंदी में यह रूप उस निहित तुलना को स्वाभाविक ढंग से व्यक्त करता है।'
- source_word: נִתְעָב
  choice: घिनौना
  rationale: निफ़अल कृदंत किसी घृणित या जुगुप्साजनक व्यक्ति का वर्णन करता है; ‘घिनौना’ आधुनिक हिंदी में इसकी तीव्रता बनाए रखता है।
- source_word: נֶאֱלָח
  choice: भ्रष्ट
  rationale: यह दुर्लभ शब्द दूषित, मैला या नैतिक रूप से बिगड़ा होने का भाव देता है। ‘भ्रष्ट’ नैतिक दूषण को स्पष्ट करता है; ‘अपवित्र’ भी संभव है।
- source_word: אִישׁ
  choice: मनुष्य
  rationale: एकवचन पुल्लिंग संज्ञा यहाँ प्रतिनिधिक अर्थ में मानव को दर्शाती है। ‘मनुष्य’ हिंदी में स्रोत के रूप और व्यापक आशय दोनों को स्वाभाविक रूप से रखता है।
- source_word: שֹׁתֶה
  choice: जो ... पीता है
  rationale: कृदंत की निरंतर या स्वभावगत क्रिया को हिंदी के संबंधवाचक उपवाक्य से सहज रूप में व्यक्त किया गया है।
- source_word: כַמַּיִם
  choice: पानी की तरह
  rationale: सीधी उपमा सहजता, प्रचुरता और आदत का भाव देती है।
- source_word: עַוְלָה
  choice: अन्याय
  rationale: यह संज्ञा अन्याय, दुष्कर्म या अधर्म का अर्थ दे सकती है। ‘अन्याय’ नैतिक बल को स्पष्ट और वर्तमान हिंदी में बनाए रखता है।
theological_decisions:
- issue: प्रतिनिधिक पुल्लिंग भाषा
  choice: मनुष्य
  alternative: एक व्यक्ति / मानवजाति
  rationale: इब्रानी אִישׁ एकवचन पुल्लिंग है, पर कथन प्रतिनिधिक है। ‘मनुष्य’ न तो इसे बहुवचन बनाता है, न इसके व्यापक मानवीय आशय को सीमित करता है।
- issue: עַוְלָה का नैतिक अर्थ
  choice: अन्याय
  alternative: अधर्म / दुष्कर्म
  rationale: मुख्य पाठ में ‘अन्याय’ मूल के नैतिक टेढ़ेपन को सरल भाषा में रखता है, जबकि पादटिप्पणी व्यापक विकल्प बताती है।
- issue: אַף כִּי में निहित तुलना
  choice: कितना कम शुद्ध
  alternative: कितना अधिक घिनौना और भ्रष्ट
  rationale: पिछले पद में ‘शुद्ध’ होने की तुलना के आधार पर यह पाठ निहित निष्कर्ष को स्पष्ट करता है, बिना कथन का धर्मवैज्ञानिक तनाव मिटाए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। पद की तीखी काव्यात्मक उपमा और पिछले पद से जुड़ा न्यूनाधिक तर्क सुरक्षित हैं।
