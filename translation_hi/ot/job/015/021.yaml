  rationale: यहाँ קוֹל किसी स्पष्ट वाणी के बजाय सुनाई देनेवाली ध्वनि को दर्शाता है। ‘आवाज़’ आधुनिक हिन्दी में स्वाभाविक है और मूल बिंब बनाए रखता है।
- source_word: פְּחָדִים
  choice: आतंक
  rationale: इब्रानी बहुवचन अनेक भयावह आहटों या आतंककारी बातों का तीव्र भाव देता है। हिन्दी में ‘आतंक की आवाज़’ इस शक्ति को स्वाभाविक रूप से व्यक्त करता है; यांत्रिक बहुवचन असहज होता।
- source_word: בְּאָזְנָיו
  choice: उसके कानों में है
  rationale: मूल का ठोस बिंब ‘उसके कानों में’ यथासंभव सीधे रूप में रखा गया है, बिना ‘गूँजती है’ जैसी अतिरिक्त क्रिया-छटा जोड़े।
- source_word: בַּשָּׁלוֹם
  choice: सुख-समृद्धि के समय
  rationale: שָׁלוֹם यहाँ कुशलता, चैन, सुरक्षा या समृद्ध दशा का संकेत दे सकता है। प्रसंग में अचानक आनेवाले विनाश के विपरीत ‘सुख-समृद्धि के समय’ स्वाभाविक है, जबकि अन्य अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: שׁוֹדֵד
  choice: विनाशक
  rationale: यह कृदन्त लूटने, उजाड़ने या विनाश करनेवाले व्यक्ति को दर्शाता है। ‘विनाशक’ व्यापक खतरे को संक्षेप और गरिमा के साथ व्यक्त करता है; ‘लुटेरा’ अर्थ को केवल लूट तक सीमित कर सकता है।
- source_word: יְבוֹאֶנּוּ
  choice: उस पर आ पड़ता है
  rationale: क्रिया और पुरुषवाचक प्रत्यय का शत्रुतापूर्ण आगमन हिन्दी में ‘उस पर आ पड़ता है’ से स्वाभाविक रूप से व्यक्त होता है। वर्तमानकाल इब्रानी काव्य की सजीवता को बनाए रखता है।
