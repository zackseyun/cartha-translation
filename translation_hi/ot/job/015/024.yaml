base_translation:
  language: en
  yaml_path: translation/ot/job/015/024.yaml
  text: Distress and anguish terrify him[a]; they overpower him like a king ready for battle.
translation:
  language: hi
  text: संकट और संताप उसे भयभीत करते हैं; वे उस पर ऐसे हावी हो जाते हैं, जैसे युद्ध[a] के लिए तैयार कोई राजा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “धावा बोलने के लिए” अथवा “आक्रमण के लिए।” जिस इब्रानी शब्द का अनुवाद यहाँ “युद्ध” किया गया है, वह दुर्लभ है और संभवतः विशेष रूप से सशस्त्र धावे या आक्रमण को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְבַעֲתֻהוּ
  choice: उसे भयभीत करते हैं
  rationale: पिएल रूप किसी को तीव्र भय या आतंक में डालने का भाव देता है। यह हिंदी में स्वाभाविक रहते हुए क्रिया की प्रबल कारक शक्ति को बनाए रखता है।
- source_word: צַר
  choice: संकट
  rationale: यहाँ शब्द तंगी, मुसीबत या दबाव की अवस्था बताता है। ‘संकट’ आधुनिक हिंदी में स्पष्ट है और समानांतर पद के साथ सहज बैठता है।
- source_word: מְצוּקָה
  choice: संताप
  rationale: यह गंभीर दबाव, व्यथा या क्लेश का बोध कराता है। ‘संताप’ काव्यात्मक गरिमा रखते हुए ‘संकट’ की अनावश्यक पुनरावृत्ति से बचाता है।
- source_word: תִּתְקְפֵהוּ
  choice: वे उस पर ... हावी हो जाते हैं
  rationale: क्रिया का अर्थ प्रबल होना या बलपूर्वक काबू पा लेना है। यद्यपि इब्रानी क्रिया स्त्रीलिंग एकवचन है, हिंदी में पहले आए दो समानांतर संज्ञा-पदों को संयुक्त कर्ता मानकर बहुवचन स्वाभाविक है।
- source_word: כְּמֶלֶךְ
  choice: जैसे ... कोई राजा
  rationale: तुलनासूचक כ को सहज हिंदी उपमा में व्यक्त किया गया है; ‘कोई’ सामान्य तुलनात्मक दृश्य को स्वाभाविक बनाता है।
- source_word: עָתִיד
  choice: तैयार
  rationale: संदर्भ में इसका अर्थ किसी कार्रवाई के लिए प्रस्तुत या तत्पर होना है।
- source_word: לַכִּידוֹר
  choice: युद्ध के लिए
  rationale: כידור दुर्लभ और अर्थ की दृष्टि से अनिश्चित शब्द है। प्रसंग में व्यापक सैन्य मुठभेड़ का अर्थ सबसे स्पष्ट है, जबकि अधिक विशिष्ट ‘धावे/आक्रमण’ की संभावना पादटिप्पणी में रखी गई है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। पद की काव्यात्मक समानांतरता तथा राजा की सैन्य उपमा सुरक्षित हैं; दुर्लभ अंतिम शब्द की वास्तविक अर्थगत अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
