source:
  edition: WLC
  text: כִּ֤י יְאַלֵּ֣ף עֲוֺנְ/ךָ֣ פִ֑י/ךָ וְ֝/תִבְחַ֗ר לְשׁ֣וֹן עֲרוּמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/005.yaml
  text: For your iniquity teaches your mouth[b][a], and you choose the tongue of the crafty.
translation:
  language: hi
  text: 'क्योंकि तेरा अधर्म[a] तेरे मुँह को सिखाता है,

    और तू धूर्तों की ज़बान[b] चुनता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरा दोष”; इब्रानी शब्द का अर्थ संदर्भ के अनुसार अधर्म, दोष या दोष का फल हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “चालाक लोगों की भाषा” अथवा “कपटी लोगों की बोली।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह एलीपज़ के पिछले आरोप का आधार प्रस्तुत करता है और पद के तर्क-संबंध को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: יְאַלֵּף
  choice: सिखाता है
  rationale: पिएल रूप का अर्थ ‘सिखाना/प्रशिक्षित करना’ है। यह चुनाव अधर्म को बोलने वाले शिक्षक के रूप में प्रस्तुत करने वाले मानवीकरण को सुरक्षित रखता है।
- source_word: עֲוֺנְךָ
  choice: तेरा अधर्म
  rationale: עָוֹן में अधर्म, दोष अथवा दोष-फल के अर्थ संभव हैं। यहाँ नैतिक बुराई को अय्यूब की वाणी का स्रोत बताया गया है, इसलिए ‘अधर्म’ उपयुक्त है; ‘दोष’ को पादटिप्पणी में रखा गया है।
- source_word: פִיךָ
  choice: तेरे मुँह
  rationale: शाब्दिक बिंब को बनाए रखते हुए यह हिंदी में समझने योग्य है और दूसरे चरण की ‘ज़बान’ के साथ काव्यात्मक समानता रखता है।
- source_word: וְתִבְחַר
  choice: और तू ... चुनता है
  rationale: בחר का सीधा अर्थ ‘चुनना’ है। इससे एलीपज़ का प्रत्यक्ष, द्वितीय-पुरुष आरोप बना रहता है।
- source_word: לְשׁוֹן
  choice: ज़बान
  rationale: ‘ज़बान’ बोलचाल और वाणी, दोनों अर्थ दे सकती है तथा ‘मुँह’ के समानांतर मूल काव्य-बिंब को सुरक्षित रखती है।
- source_word: עֲרוּמִים
  choice: धूर्तों
  rationale: עָרוּם संदर्भानुसार समझदार, चतुर या धूर्त हो सकता है। एलीपज़ के आरोपात्मक संदर्भ में नकारात्मक अर्थ अभिप्रेत है; ‘धूर्त’ छलपूर्ण चतुराई को स्पष्ट करता है।
theological_decisions:
- issue: आरोप में עָוֹן की नैतिक अर्थच्छाया
  choice: ‘तेरा अधर्म’
  alternative: ‘तेरा दोष’ या ‘तेरा पाप’
  rationale: पद में अय्यूब की कथित नैतिक बुराई को उसकी वाणी को आकार देने वाला बताया गया है। ‘अधर्म’ इस नैतिक बल को बनाए रखता है, जबकि मूल शब्द की ‘दोष’ वाली वैध अर्थ-संभावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, आरोपात्मक काव्य-शैली रखी गई है। ‘तू/तेरा’ मूल के एकवचन प्रत्यक्ष संबोधन और अय्यूब-काव्य की निकट, तीखी वाणी को दर्शाता है। ‘मुँह’ और ‘ज़बान’ मूल के समानांतर शारीरिक बिंबों को बनाए रखते हैं।
