  yaml_path: translation/ot/job/015/007.yaml
  text: Were you born as the first man[a], and were you brought forth before the hills?
translation:
  language: hi
  text: 'क्या तू पहला मनुष्य[a] के रूप में जन्मा था,

    और क्या पहाड़ियों से पहले तुझे जन्म दिया गया था?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या तू आदम, अर्थात् पहला मनुष्य, के रूप में जन्मा था?” इब्रानी में शाब्दिक रूप से “पहला मनुष्य” है; यह आदम की ओर संकेत कर सकता है, पर यहाँ ‘आदम’ को स्पष्ट रूप से व्यक्तिनाम नहीं लिखा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: הֲ/רִאישׁוֹן
  choice: क्या ... पहले ... के रूप में
  rationale: प्रश्नवाचक הֲ अलंकारिक प्रश्न आरम्भ करता है, और רִאשׁוֹן समय अथवा क्रम में प्राथमिकता बताता है। ‘पहले मनुष्य के रूप में’ हिन्दी में אָדָם के साथ इसके विधेयात्मक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אָדָם
  choice: मनुष्य
  rationale: यहाँ एकवचन संज्ञा का सबसे सहज अर्थ ‘मनुष्य’ है; पूरा पदबंध ‘पहला मनुष्य’ बनता है। ‘आदम’ कहना सम्भावित संकेत को स्पष्ट व्यक्तिनाम बनाकर मूल से अधिक निश्चित कर देता।
- source_word: תִּוָּלֵד
  choice: जन्मा था
  rationale: ילד के निफ़अल रूप का सामान्य अर्थ ‘जन्म लेना’ है। कर्ता पुल्लिंग एकवचन है, इसलिए ‘तू ... जन्मा था’ स्वाभाविक और सीधा अनुवाद है।
- source_word: וְ/לִ/פְנֵי
  choice: और क्या ... से पहले
  rationale: संयोजक और संबंधसूचक पद दूसरे समानांतर प्रश्न को जोड़ते हैं। हिन्दी में स्पष्टता और स्वाभाविकता के लिए ‘क्या’ दोहराया गया है।
- source_word: גְבָעוֹת
  choice: पहाड़ियों
  rationale: גְבָעוֹת का सीधा अर्थ ‘पहाड़ियाँ’ है; यह आदि-प्राचीन भू-दृश्य की काव्यात्मक छवि को बनाए रखता है।
- source_word: חוֹלָלְתָּ
  choice: तुझे जन्म दिया गया था
  rationale: यह क्रियारूप प्रसव अथवा उत्पन्न किए जाने की छवि व्यक्त करता है। ‘जन्म दिया गया’ पहले खंड के ‘जन्मा’ से हल्का भेद रखते हुए मूल की जन्म-संबंधी समानता को सुरक्षित रखता है।
theological_decisions:
- issue: אָדָם को व्यक्तिनाम ‘आदम’ माना जाए या सामान्य संज्ञा ‘मनुष्य’
  choice: ‘पहले मनुष्य’ के पदबंध में सामान्य संज्ञा ‘मनुष्य’
  alternative: ‘आदम, पहला मनुष्य’ अथवा ‘आदम’
  rationale: अय्यूब की प्राचीनता और कथित आदि-बुद्धि पर किया गया यह अलंकारिक प्रश्न पहले मनुष्य की ओर संकेत कर सकता है, किन्तु इब्रानी में यहाँ व्यक्तिनाम होना अनिवार्य नहीं है। मुख्य पाठ सामान्य अर्थ को रखता है और पादटिप्पणी सम्भावित आदम-संकेत बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय काव्यात्मक शैली रखी गई है। अय्यूब को सीधे संबोधन के अनुरूप ‘तू/तुझे’ प्रयोग हुआ है। दोनों समानांतर खंड प्रश्नात्मक हैं और जन्म की दो निकट, किंतु थोड़ी भिन्न, अभिव्यक्तियाँ सुरक्षित रखी गई हैं।
