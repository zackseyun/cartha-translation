  text: that you turn your spirit against God and bring words out of your mouth?[a]
translation:
  language: hi
  text: 'कि तुम अपनी आत्मा को परमेश्वर के विरुद्ध[a] मोड़ते हो

    और अपने मुँह से बातें निकालते हो?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘परमेश्वर की ओर।’ इब्रानी में शाब्दिक अर्थ ‘परमेश्वर की ओर’ है; प्रसंग में इसका भाव विरोध का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: कि
  rationale: यह पिछले पद में आए प्रश्न की विषय-वस्तु को आगे बढ़ाता है; हिन्दी में ‘कि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: תָשִׁיב
  choice: मोड़ते हो
  rationale: हिफ़ील रूप यहाँ किसी की भीतरी प्रवृत्ति को एक दिशा में लगाने या फेरने का भाव देता है; ‘मोड़ते हो’ मूल बिंब और वर्तमान आरोप—दोनों को बनाए रखता है।
- source_word: אֶל אֵל
  choice: परमेश्वर के विरुद्ध
  rationale: אֶל का सामान्य अर्थ ‘की ओर’ है, पर आरोपात्मक संदर्भ में दिशा विरोध का भाव लिए हुए है। मुख्य पाठ में अर्थ-संदर्भ स्पष्ट किया गया है और शाब्दिक विकल्प पाद-टिप्पणी में रखा गया है।
- source_word: רוּחֶךָ
  choice: अपनी आत्मा
  rationale: רוּחַ यहाँ शाब्दिक हवा या साँस नहीं, बल्कि व्यक्ति की भीतरी आत्मा अथवा प्रवृत्ति को दर्शाता है। ‘आत्मा’ मूल शब्द की व्यापकता को ‘क्रोध’ या ‘मिज़ाज’ जैसे अधिक व्याख्यात्मक विकल्पों से बेहतर सुरक्षित रखता है।
- source_word: וְהֹצֵאתָ
  choice: और ... निकालते हो
  rationale: हिफ़ील क्रिया का मूल भाव ‘बाहर निकालना’ है। मुँह और बातों के साथ यह हिन्दी में स्वाभाविक भी है और स्रोत की ठोस अभिव्यक्ति को बनाए रखता है।
- source_word: מִפִּיךָ
  choice: अपने मुँह से
  rationale: מִן स्रोत को चिह्नित करता है; हिन्दी में ‘मुँह से’ वही भाव स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מִלִּין
  choice: बातें
  rationale: अरामी प्रभाव वाला बहुवचन ‘शब्द/कथन’ का अर्थ देता है। इस प्रसंग में ‘बातें’ सामान्य आधुनिक हिन्दी में अधिक सहज है, जबकि अर्थ को यथावत रखता है।
theological_decisions:
- issue: אֶל אֵל में दिशा और विरोध के बीच अर्थ-संबंध
  choice: मुख्य पाठ में ‘परमेश्वर के विरुद्ध’
  alternative: ‘परमेश्वर की ओर’
  rationale: इब्रानी पूर्वसर्ग मूलतः दिशा बताता है, किंतु एलीपज का आरोप विरोधी मनोवृत्ति की ओर संकेत करता है। मुख्य पाठ संदर्भगत आशय देता है, जबकि पाद-टिप्पणी वास्तविक शाब्दिक अस्पष्टता सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। पंक्ति-विभाजन इब्रानी समानांतरता को उभारता है। ‘आत्मा’ स्रोत के רוּחַ को अपेक्षाकृत औपचारिक ढंग से सुरक्षित रखता है, और प्रश्नचिह्न पिछले पद से जारी आलंकारिक प्रश्न को दर्शाता है।
