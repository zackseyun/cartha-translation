  text: מָֽה אֱנ֥וֹשׁ כִּֽי יִזְכֶּ֑ה וְ/כִֽי יִ֝צְדַּ֗ק יְל֣וּד אִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/014.yaml
  text: What is man[a], that he should be pure, or one born of a woman[c][b], that he should be righteous?
translation:
  language: hi
  text: मनुष्य[a] क्या है कि वह शुद्ध[b] ठहरे, और स्त्री से जन्मा मनुष्य क्या है कि वह धर्मी[c] ठहरे?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “मनुष्य” यहाँ किसी एक पुरुष के लिए नहीं, बल्कि नश्वर मानवजाति के लिए प्रयुक्त प्रतिनिधि एकवचन है।
    reason: lexical_alternative
  - marker: b
    text: या “निर्मल।” हिब्रू शब्द शुद्धता, स्वच्छता या दोष से मुक्त होने का भाव दे सकता है।
    reason: lexical_alternative
  - marker: c
    text: या “सही ठहरे” अथवा “निर्दोष ठहरे।” हिब्रू शब्द धर्मी होने और न्याय में सही ठहरने—दोनों अर्थछायाएँ रख सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה
  choice: क्या है
  rationale: यह आलंकारिक प्रश्न मनुष्य की स्थिति या योग्यता पर प्रश्न उठाता है। हिंदी में “मनुष्य क्या है कि...” मूल रचना की संक्षिप्त काव्यात्मक शक्ति को बनाए रखता है।
- source_word: אֱנוֹשׁ
  choice: मनुष्य
  rationale: אֱנוֹשׁ नश्वर और दुर्बल मानव को सूचित करता है। “मनुष्य” आधुनिक हिंदी में स्वाभाविक है और यहाँ समस्त मानवजाति का प्रतिनिधि एकवचन है।
- source_word: יִזְכֶּה
  choice: शुद्ध ठहरे
  rationale: זכה का अर्थ शुद्ध या निर्मल होना है और इसमें नैतिक निर्दोषता का भाव भी हो सकता है। “शुद्ध ठहरे” अवस्था तथा मूल्यांकन—दोनों संभावित छायाओं को खुला रखता है।
- source_word: וְכִי
  choice: और ... कि
  rationale: वाव दूसरे समानांतर आलंकारिक प्रश्न को पहले से जोड़ता है। “और” हिब्रू समानांतरता को सीधे बनाए रखता है; इसे “या” बनाकर विकल्प का भाव थोपना आवश्यक नहीं है।
- source_word: יִצְדַּק
  choice: धर्मी ठहरे
  rationale: צדק यहाँ धर्मी होना, सही ठहरना या निर्दोष माना जाना व्यक्त कर सकता है। “धर्मी ठहरे” नैतिक और मूल्यांकनात्मक दोनों आयामों को समेटता है, बिना इसे तकनीकी धर्मवैज्ञानिक शब्दावली तक सीमित किए।
- source_word: יְלוּד אִשָּׁה
  choice: स्त्री से जन्मा हुआ
  rationale: यह समस्त नश्वर मानवता के लिए प्रयुक्त हिब्रू मुहावरा है। अनुवाद उसकी प्रतिनिधि एकवचन संरचना और काव्यात्मक समानांतरता को सुरक्षित रखता है।
theological_decisions:
- issue: אֱנוֹשׁ और יְלוּד אִשָּׁה का मानवशास्त्रीय दायरा
  choice: “मनुष्य” और “स्त्री से जन्मा हुआ” को समस्त मानवता के प्रतिनिधि एकवचन के रूप में रखा गया है।
  alternative: “मानव-प्राणी” या “स्त्री से जन्मा कोई भी व्यक्ति”
  rationale: हिब्रू में व्याकरणिक एकवचन है, पर आशय सामान्य मानवता से है। मूल बिंब और प्रतिनिधि रूप को बनाए रखना हिंदी में भी स्पष्ट और स्वाभाविक है।
- issue: יִצְדַּק में नैतिक और न्यायिक अर्थछाया
  choice: “धर्मी ठहरे”
  alternative: “निर्दोष ठहरे,” “सही ठहरे,” या “धर्मी हो”
  rationale: यह पद मनुष्य की परमेश्वर के सामने स्थिति पर प्रश्न करता है। “धर्मी ठहरे” व्यापक हिब्रू अर्थ को बनाए रखता है और किसी बाद की तकनीकी धर्मवैज्ञानिक व्याख्या को अनिवार्य नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी की है, पर अय्यूब की काव्यात्मक और आलंकारिक शैली को बनाए रखने के लिए “क्या है कि” तथा समानांतर “ठहरे” का प्रयोग किया गया है। “और” मसोराई हिब्रू के संयोजक को सीधे दर्शाता है।
