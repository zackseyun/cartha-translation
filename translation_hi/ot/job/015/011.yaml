  text: Are the consolations of God too small for you[a], or a word spoken gently to you?
translation:
  language: hi
  text: 'क्या परमेश्वर की सांत्वनाएँ तुम्हारे लिए कम हैं[a], और तुम्हें कोमलता से कही गई कोई बात भी?


    [a] या: “क्या परमेश्वर की सांत्वनाएँ तुम्हारे लिए बहुत कम हैं, और तुम्हें धीरे से कही गई कोई बात भी?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “क्या परमेश्वर की सांत्वनाएँ तुम्हारे लिए बहुत कम हैं, और तुम्हें धीरे से कही गई कोई बात भी?”'
    reason: הַמְעַט के ‘बहुत कम’ और לָאַט के ‘धीरे से’ अर्थ-विकल्प दर्शाता है, बिना प्राथमिक परिमाणात्मक अर्थ को ‘तुच्छ’ जैसे अधिक व्याख्यात्मक अर्थ में बदले।
lexical_decisions:
- source_word: הַמְעַט
  choice: बहुत थोड़ी हैं
  rationale: प्रश्नवाचक הֲ और מְעַט मिलकर अपर्याप्तता अथवा कम समझे जाने का आलंकारिक प्रश्न बनाते हैं। ‘बहुत थोड़ी’ मूल परिमाणात्मक भाव को बनाए रखता है; ‘तुच्छ’ को पादटिप्पणी में अर्थगत विकल्प के रूप में दिया गया है।
- source_word: מִמְּךָ
  choice: तुम्हारे लिए
  rationale: इस रचना में מִן संबंध अथवा मूल्यांकन व्यक्त करता है—अर्थात सांत्वनाएँ संबोधित व्यक्ति के लिए बहुत थोड़ी होना—न कि स्थान से अलगाव।
- source_word: תַּנְחֻמוֹת
  choice: सांत्वनाएँ
  rationale: נחם से बना यह बहुवचन संज्ञा सांत्वना देनेवाली बातों या कार्यों को दर्शाती है। ‘सांत्वनाएँ’ बहुवचन और गरिमामय शैली दोनों बनाए रखता है।
- source_word: אֵל
  choice: परमेश्वर
  rationale: यहाँ אֵל ईश्वर के नाम/पद के रूप में प्रयुक्त है; आधुनिक मानक हिन्दी में ‘परमेश्वर’ स्पष्ट और स्वाभाविक है।
- source_word: וְדָבָר
  choice: और ... बात भी
  rationale: וְ का मूल संयोजक अर्थ ‘और’ रखा गया है। דָבָר को भाषण-संदर्भ में ‘बात’ कहना ‘विषय’ से अधिक उपयुक्त है; ‘भी’ हिन्दी में दूसरे समन्वित पद पर लागू लुप्त विधेय को स्वाभाविक बनाता है।
- source_word: לָאַט
  choice: कोमलता से कही गई
  rationale: यह क्रियाविशेषण कोमल या धीमे ढंग का बोध देता है। हिन्दी में निहित बोलने की क्रिया को ‘कही गई’ से स्पष्ट किया गया है, जबकि ‘कोमलता से’ केवल आवाज़ की मंदता तक अर्थ को सीमित नहीं करता।
- source_word: עִמָּךְ
  choice: तुमसे
  rationale: עִם का मूल अर्थ ‘साथ’ है, पर बोलने की हिन्दी संरचना में ‘तुमसे ... कही गई’ स्वाभाविक रूप से संबोधित व्यक्ति के साथ संवाद का संबंध व्यक्त करता है।
