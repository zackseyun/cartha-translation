  yaml_path: translation/ot/job/015/026.yaml
  text: He rushes at him with his neck[a], with the thick bosses of his shields.
translation:
  language: hi
  text: 'वह गर्दन तानकर[a] उस पर झपटता है,

    अपनी ढालों के मोटे उभारों के साथ।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘गर्दन के साथ’। इसका अनुवाद ‘गर्दन आगे किए’ भी हो सकता है। इब्रानी चित्र सजीव और कुछ संक्षिप्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרוּץ
  choice: झपटता है
  rationale: मूल क्रिया का अर्थ ‘दौड़ना’ है, पर इस शत्रुतापूर्ण प्रसंग में ‘झपटता है’ तेज़ और आक्रामक ढंग से आगे बढ़ने का भाव स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: אֵלָיו
  choice: उस पर
  rationale: यहाँ אֶל दिशा बताने के साथ विरोधी आक्रमण का भाव रखता है; ‘उस पर’ हिंदी में लक्ष्य की ओर शत्रुतापूर्वक बढ़ने को सहज रूप से व्यक्त करता है।
- source_word: בְּצַוָּאר
  choice: गर्दन तानकर
  rationale: इब्रानी में शाब्दिक रूप से ‘गर्दन के साथ’ है। ‘गर्दन तानकर’ उस सजीव, उद्दंड और आगे बढ़ते हुए हावभाव को स्वाभाविक हिंदी में रखता है, जबकि टिप्पणी में मूल की संक्षिप्तता बताई गई है।
- source_word: בַּעֲבִי
  choice: मोटे
  rationale: यह शब्द मोटाई या भारीपन सूचित करता है; ढाल के उभारों के लिए ‘मोटे’ सीधा और स्पष्ट विशेषण है।
- source_word: גַּבֵּי
  choice: उभारों
  rationale: ढालों के प्रसंग में यह उनके उभरे हुए या फूले हुए मध्य भागों को सूचित करता है। ‘उभार’ आधुनिक हिंदी में तकनीकी अर्थ को समझने योग्य ढंग से व्यक्त करता है।
- source_word: מָגִנָּיו
  choice: अपनी ढालों
  rationale: मूल रूप बहुवचन है और उस पुरुष के स्वामित्व को बताता है; इसलिए बहुवचन ‘अपनी ढालों’ रखा गया है।
