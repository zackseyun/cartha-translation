  text: מַה יָּ֭דַעְתָּ וְ/לֹ֣א נֵדָ֑ע תָּ֝בִ֗ין וְֽ/לֹא עִמָּ֥/נוּ הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/009.yaml
  text: What do you know that we do not know? What do you understand that is not with us?[a]
translation:
  language: hi
  text: तू ऐसा क्या जानता है जो हम नहीं जानते? तू ऐसी कौन-सी बात समझता है जो हमारे पास नहीं है?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “जो हमारे साथ नहीं है।”
    reason: इब्रानी עִמָּנוּ के ‘हमारे साथ’ वाले रूपक को दर्ज करते हुए मुख्य पाठ में उसके स्वाभाविक हिन्दी अर्थ ‘हमारे पास’ को रखा गया है।
lexical_decisions:
- source_word: מַה יָדַעְתָ
  choice: तू ऐसा क्या जानता है
  rationale: प्रश्नवाचक מַה और पूर्णकालिक יָדַעְתָ यहाँ वर्तमान अर्थ वाला आलंकारिक प्रश्न बनाते हैं। ‘ऐसा क्या’ हिन्दी में तुलना और चुनौती को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְלֹא נֵדָע
  choice: जो हम नहीं जानते
  rationale: संयोजक, निषेध और प्रथम पुरुष बहुवचन क्रिया को हिन्दी में सम्बन्धवाचक उपवाक्य के रूप में रखना अर्थ और समानांतरता दोनों स्पष्ट करता है।
- source_word: תָּבִין
  choice: तू ... समझता है
  rationale: בין यहाँ समझने या परखने का भाव देता है; सामान्य आधुनिक हिन्दी में ‘समझता है’ सबसे सहज समतुल्य है।
- source_word: וְלֹא עִמָּנוּ הוּא
  choice: जो हमारे पास नहीं है
  rationale: इब्रानी का शाब्दिक भाव ‘जो हमारे साथ नहीं है’ है। इस प्रसंग में עִם अधिकार या उपलब्धता का भाव भी रखता है, जिसे ‘हमारे पास नहीं है’ स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions: []
translation_notes:
  register: आधुनिक, स्पष्ट और गरिमापूर्ण हिन्दी; एलीपज के सीधे, चुनौतीपूर्ण आलंकारिक प्रश्नों को बनाए रखने के लिए एकवचन ‘तू’ रखा गया है। दोनों अर्धपंक्तियों की समानांतर रचना सुरक्षित है।
