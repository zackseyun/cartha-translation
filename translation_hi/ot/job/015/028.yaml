  yaml_path: translation/ot/job/015/028.yaml
  text: He has lived in ruined cities[a], in houses where no one dwells, which were destined to become heaps.
translation:
  language: hi
  text: 'वह उजड़े हुए नगरों में रहा है,


    उन घरों में, जिनमें कोई नहीं बसता,


    जो मलबे के ढेर हो जाने के लिए नियत किए गए थे।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह नष्ट किए गए नगरों में, उन घरों में रहा है जिनमें वे नहीं बसते, जो ढेर होने के लिए नियत किए गए थे।” इस पद का इब्रानी पाठ संक्षिप्त है और विशेषकर बीच के उपवाक्य के कई निकट-संबंधित अनुवाद सम्भव हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁכּוֹן
  choice: वह ... रहा
  rationale: שכן का अर्थ ‘रहना/बसना’ है। हिन्दी में पूर्ण भूतकाल मूल के कथात्मक रूप को स्वाभाविक और निकटता से व्यक्त करता है।
- source_word: עָרִים נִכְחָדוֹת
  choice: उजड़े हुए नगरों
  rationale: נכחדות विनाश या उजाड़ दिए जाने की दशा बताता है। ‘उजड़े हुए नगर’ परित्यक्त घरों और मलबे के ढेरों के समानांतर स्वाभाविक है।
- source_word: בָּתִּים לֹא יֵשְׁבוּ לָמוֹ
  choice: उन घरों में, जिनमें कोई नहीं बसता
  rationale: इब्रानी वाक्यांश संक्षिप्त और कुछ कठिन है। अनिश्चित कर्ता ‘कोई’ घरों के निर्जन होने का प्रमुख भाव स्पष्ट करता है, जबकि वैकल्पिक अधिक शाब्दिक समझ पाद-टिप्पणी में सुरक्षित है।
- source_word: אֲשֶׁר הִתְעַתְּדוּ
  choice: जो ... ठहराए गए थे
  rationale: עתד का हित्पएल रूप तैयार, नियुक्त या नियत किए जाने का भाव दे सकता है। ‘ठहराए गए थे’ प्रयोजन/नियति के भाव को बिना कारण या कर्ता जोड़े बनाए रखता है।
- source_word: לְגַלִּים
  choice: मलबे के ढेर बनने के लिए
  rationale: גַּלִּים पत्थरों या खंडहरों के ढेरों को सूचित करता है। ‘मलबे के ढेर’ प्रसंग में ठोस और आधुनिक हिन्दी अभिव्यक्ति है।
