  yaml_path: translation/ot/job/015/022.yaml
  text: He does not expect to return from darkness[a], and he is destined for the sword.
translation:
  language: hi
  text: उसे आशा नहीं है कि वह अंधकार से लौट आएगा, और वह तलवार के लिए ठहराया गया है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अंतिम पंक्ति का हिब्रू कठिन है। इसका अनुवाद यह भी हो सकता है: “तलवार उसकी बाट जोह रही है,” “वह तलवार की निगरानी में है,” या “वह तलवार के लिए नियत है।” भाव संभवतः निकट आते हिंसक विनाश का है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יַאֲמִין
  choice: उसे विश्वास नहीं
  rationale: यहाँ हिफ़ील रूप भविष्य के परिणाम के विषय में आशा या भरोसा व्यक्त करता है; यह हिंदी वाक्यांश उसी निश्चय के अभाव को स्वाभाविक ढंग से बताता है।
- source_word: שׁוּב מִנִּי חֹשֶׁךְ
  choice: कि वह अंधकार से लौटेगा
  rationale: שׁוּב को लौटने और מן को अंधकार की अवस्था से निकलने के अर्थ में रखा गया है; ‘अंधकार’ विपत्ति या मृत्यु की छाया को भी खुला रहने देता है।
- source_word: וְצָפוּ הוּא אֱלֵי חָרֶב
  choice: और तलवार उसकी घात में है
  rationale: कठिन צפו को צפה ‘देखना/घात लगाना’ से समझकर, אֱלֵי חָרֶב के साथ आसन्न हिंसक मृत्यु का सजीव और स्वाभाविक हिंदी बिंब दिया गया है; पाठ की अनिश्चितता पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: अंधकार और तलवार के बिंबों की व्याख्या
  choice: बिंबों को मुख्य पाठ में अक्षरशः बनाए रखा
  alternative: उन्हें सीधे ‘मृत्यु’ या ‘दण्ड’ कहना
  rationale: हिब्रू काव्य में दोनों बिंब विपत्ति, हिंसक मृत्यु या न्याय का संकेत दे सकते हैं; किसी एक धार्मिक व्याख्या को मुख्य पाठ में निश्चित करना उचित नहीं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिंदी। ‘घात में है’ काव्यात्मक बिंब तथा आसन्न हिंसक संकट को बनाए रखता है; कठिन हिब्रू के अन्य संभव अर्थ पादटिप्पणी में दिए गए हैं।
