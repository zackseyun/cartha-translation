translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और दृश्यात्मक रखी गई है। पद की समानांतर शारीरिक छवि तथा भोग-विलास से उपजे मोटापे का निहित व्यंग्य सुरक्षित है। दुर्लभ פִּימָה को मुख्य पाठ में ‘चर्बी की तहें’ कहकर अर्थ-स्पष्टता और काव्यात्मक ठोसपन का संतुलन रखा गया है।
