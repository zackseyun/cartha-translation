  text: because he has covered his face with his fat[a], and has put fatness on his loins.
translation:
  language: hi
  text: 'क्योंकि उसने अपने चेहरे को अपनी चर्बी से ढक लिया है,

    और अपनी कमर पर चर्बी की तहें चढ़ा ली हैं।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ इसके कारणवाचक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: כִסָּה
  choice: ढक लिया है
  rationale: मूल क्रिया का अर्थ ‘ढकना/छिपाना’ है। पूर्ण हुई क्रिया से उत्पन्न वर्तमान दशा को हिन्दी में ‘ढक लिया है’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: פָנָיו
  choice: अपने चेहरे को
  rationale: शारीरिक बिंब के इस संदर्भ में ठोस अर्थ ‘चेहरा’ सर्वाधिक उपयुक्त है; आत्मवाचक ‘अपने’ कर्ता के साथ स्पष्ट संबंध दिखाता है।
- source_word: בְּחֶלְבּוֹ
  choice: अपनी चर्बी से
  rationale: חֵלֶב का ठोस अर्थ ‘चर्बी’ है। इसे बनाए रखने से समृद्धि और आत्मलिप्त भोग-विलास का तीखा शारीरिक बिंब अमूर्त नहीं होता।
- source_word: וַיַּעַשׂ
  choice: चढ़ा ली हैं
  rationale: शाब्दिक अर्थ ‘बनाना/करना’ है, पर פִּימָה के साथ यह शरीर पर मोटापा या चर्बी जमा करने का भाव देता है। ‘चढ़ा ली हैं’ हिन्दी में इस बिंब को सहज रूप से व्यक्त करता है।
- source_word: פִּימָה
  choice: चर्बी की तहें
  rationale: यह दुर्लभ संज्ञा मोटाई, मोटापे या चर्बीयुक्त उभार को सूचित करती है। ‘चर्बी की तहें’ दृश्य बिंब को स्पष्ट रखती है, यद्यपि ‘मोटापा’ भी संभव है।
- source_word: עֲלֵי
  choice: पर
  rationale: यह साधारण स्थानवाचक संबंध बताता है; आधुनिक हिन्दी में ‘पर’ स्वाभाविक है।
- source_word: כָסֶל
  choice: कमर
  rationale: כֶּסֶל शरीर के पार्श्व, कटि या कमर के क्षेत्र को सूचित कर सकता है। ‘कमर’ सामान्य पाठक के लिए सहज है और अनावश्यक शारीरिक अतिविशिष्टता से बचता है।
