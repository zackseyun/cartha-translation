  text: אַף אַ֭תָּה תָּפֵ֣ר יִרְאָ֑ה וְ/תִגְרַ֥ע שִׂ֝יחָ֗ה לִ/פְנֵי אֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/004.yaml
  text: Indeed[c][b][a], you annul the fear of God and diminish meditation before God.
translation:
  language: hi
  text: निश्चय ही, तुम परमेश्वर के भय को निष्फल कर देते हो[a] और परमेश्वर के सम्मुख होने वाले मनन को कम कर देते हो[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में केवल ‘भय’ है। इसका अनुवाद ‘तुम भय को कमजोर करते हो’ या ‘तुम भय को प्रभावहीन बना देते हो’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘प्रार्थना,’ ‘भक्ति’ अथवा ‘शिकायत।’ इब्रानी शब्द चिंतनशील या प्रार्थनापूर्ण वाणी को भी सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: निश्चय ही
  rationale: यहाँ यह शब्द कथन पर जोर देने वाला अव्यय है; ‘निश्चय ही’ एलीपज के आरोप की तीव्रता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: תָּפֵר
  choice: निष्फल कर देते हो
  rationale: פרר के हिफ़ील रूप का अर्थ तोड़ना, निरस्त करना या प्रभावहीन बनाना हो सकता है। ‘निष्फल कर देते हो’ इसके कारक भाव और आरोप की धार को बनाए रखता है।
- source_word: יִרְאָה
  choice: परमेश्वर का भय
  rationale: मूल में केवल ‘भय’ है, पर समानांतर पंक्ति के ‘परमेश्वर के सामने’ से धार्मिक संदर्भ स्पष्ट है। यह चयन भय और श्रद्धा, दोनों की बाइबिलीय अर्थ-छाया को खुला रखता है।
- source_word: וְתִגְרַע
  choice: और … घटा देते हो
  rationale: גרע का मूल अर्थ घटाना, कम करना या रोकना है। ‘घटा देते हो’ काव्यात्मक समानांतरता और आरोप, दोनों को स्पष्ट रखता है।
- source_word: שִׂיחָה
  choice: मनन
  rationale: यह शब्द मनन, चिंतनशील वाणी, प्रार्थना या शिकायत को सूचित कर सकता है। ‘मनन’ इसकी व्यापकता को किसी एक संकीर्ण धार्मिक क्रिया तक सीमित नहीं करता।
- source_word: לִפְנֵי אֵל
  choice: परमेश्वर के सामने
  rationale: यह לִפְנֵי (‘के सामने/उपस्थिति में’) और אֵל (‘परमेश्वर’) का सीधा तथा स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: יִרְאָה का धार्मिक आशय
  choice: परमेश्वर का भय
  alternative: भय; श्रद्धा
  rationale: संदर्भ सामान्य डर का नहीं, परमेश्वर के प्रति भय-भक्ति का है। फिर भी ‘भय’ शब्द रखकर उसे केवल सम्मान या श्रद्धा में नहीं बदला गया।
- issue: שִׂיחָה का आशय
  choice: मनन
  alternative: प्रार्थना; भक्ति; शिकायत; वार्तालाप
  rationale: मूल शब्द अर्थ की दृष्टि से व्यापक है। ‘मनन’ चिंतन और परमेश्वर की ओर उन्मुख वाणी, दोनों की संभावना बचाता है; अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘निष्फल कर देते हो’ आरोप की तीक्ष्णता को व्यक्त करता है, जबकि ‘मनन’ मूल शब्द की अर्थगत व्यापकता को सुरक्षित रखता है।
