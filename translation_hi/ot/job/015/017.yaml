  text: मैं तुझे बताऊँगा; मेरी सुन। जो मैंने देखा है, उसे मैं सुनाऊँगा—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲחַוְךָ
  choice: मैं तुझे बताऊँगा
  rationale: पिएल रूप यहाँ एलीपज के आगामी कथन का परिचय देता है। ‘बताऊँगा’ आधुनिक हिन्दी में स्वाभाविक है और बिना किसी दृश्य प्रदर्शन का संकेत दिए कथन की क्रिया को व्यक्त करता है।
- source_word: שְׁמַע לִי
  choice: मेरी सुन
  rationale: आज्ञार्थक क्रिया और לִי मिलकर वक्ता की बात ध्यान से सुनने का आग्रह व्यक्त करते हैं। ‘मेरी सुन’ संक्षिप्त, स्वाभाविक और आग्रहपूर्ण है।
- source_word: וְזֶה
  choice: जो
  rationale: शाब्दिक ‘और यह’ अगले कथन की विषय-वस्तु का परिचय देता है। हिन्दी में ‘जो मैंने देखा है’ उसी संबंध को सहज रूप से व्यक्त करता है।
- source_word: חָזִיתִי
  choice: मैंने देखा है
  rationale: पूर्ण क्रिया एलीपज के निजी अवलोकन और उसकी वर्तमान प्रासंगिकता को व्यक्त करती है; ‘देखा है’ उस अनुभवगत दावे को बनाए रखता है।
- source_word: וַאֲסַפֵּרָה
  choice: मैं सुनाऊँगा
  rationale: कोहोर्टेटिव रूप अपने देखे हुए को विस्तार से कहने की वक्ता की मंशा प्रकट करता है। ‘सुनाऊँगा’ हिन्दी में कथन या वृत्तांत कहने के भाव को स्वाभाविक ढंग से व्यक्त करता है।
