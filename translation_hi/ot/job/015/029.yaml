translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। तीन समानांतर निषेधात्मक पंक्तियाँ इब्रानी काव्य की लय को बनाए रखती हैं। दुर्लभ अंतिम शब्द और एकवचन से बहुवचन संबंधसूचक प्रत्यय की कठिनाई को मुख्य पाठ को बोझिल किए बिना पादटिप्पणी में सुरक्षित रखा गया है।
