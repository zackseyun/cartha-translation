base_translation:
  language: en
  yaml_path: translation/ot/job/015/029.yaml
  text: He will not become rich[a], and his wealth will not endure[b], and his produce will not bend down to the earth.
translation:
  language: hi
  text: 'वह धनी न होगा,

    न उसकी संपत्ति टिकी रहेगी,

    और न उनकी उपज[a] धरती तक झुकेगी।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस दुर्लभ इब्रानी शब्द का अर्थ अनिश्चित है; इसका अनुवाद “संपत्ति,” “लाभ” या “बहुतायत” भी हो सकता है। मसोराई पाठ में इसमें शाब्दिक रूप से “उनकी” है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ भरपूर उपज या फलों से लदी डालियों के धरती तक झुकने का बिंब हो सकता है। कुछ व्याख्याओं में इसका अर्थ अधिक सामान्य रूप से यह है कि उनकी संपत्ति देश में नहीं फैलेगी।
    reason: alternative_reading
lexical_decisions:
- source_word: יֶעְשַׁר
  choice: धनी न होगा
  rationale: עשר के क़ाल रूप में धनवान बनने या समृद्ध होने का भाव है। हिंदी में “धनी न होगा” स्वाभाविक है और भावी समृद्धि के निषेध को स्पष्ट करता है।
- source_word: יָקוּם
  choice: टिकी रहेगी
  rationale: शाब्दिक अर्थ “खड़ी होगी” है, पर संपत्ति के साथ इसका आशय उसके स्थिर रहने या बने रहने से है।
- source_word: חֵילוֹ
  choice: उसकी संपत्ति
  rationale: חַיִל का अर्थ सामर्थ्य, साधन या धन-संपत्ति हो सकता है। समृद्धि के इस संदर्भ में “संपत्ति” सबसे स्पष्ट और व्यापक विकल्प है।
- source_word: יִטֶּה
  choice: धरती की ओर झुकेगी
  rationale: נטה में झुकने, फैलने या बढ़ाने का भाव हो सकता है। दुर्लभ अंतिम संज्ञा को “उपज” मानने पर भारी फल या डालियों के धरती की ओर झुकने का ठोस बिंब बनता है।
- source_word: מִנְלָם
  choice: उसकी उपज
  rationale: यह दुर्लभ और अनिश्चित रूप है; इसे संपत्ति, लाभ, बहुतायत या उपज समझा गया है। “उपज” अगले बिंब के साथ संगत है। मसोराई रूप में बहुवचन संबंधसूचक प्रत्यय (“उनकी”) है, पर एकवचन दुष्ट व्यक्ति के विषय को हिंदी में सुसंगत रखने के लिए मुख्य पाठ में “उसकी” रखा गया है; अनिश्चितता पादटिप्पणी में बताई गई है।
