  text: הָרֹ֣ה עָ֭מָל וְ/יָ֣לֹד אָ֑וֶן וּ֝/בִטְנָ֗/ם תָּכִ֥ין מִרְמָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/015/035.yaml
  text: They conceive trouble and give birth to wickedness[a]; their womb prepares deceit.
translation:
  language: hi
  text: वे विपत्ति को गर्भ में धारण करते हैं और दुष्टता को जन्म देते हैं[a]; उनकी कोख छल तैयार करती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वे अनिष्ट से गर्भवती हैं और अधर्म को जन्म देते हैं।”
    reason: עָמָל और אָוֶן के वैकल्पिक अर्थों तथा הָרֹה की अधिक शाब्दिक गर्भावस्था-संबंधी अभिव्यक्ति को दर्शाने के लिए।
lexical_decisions:
- source_word: הָרֹה
  choice: गर्भ धारण करते हैं
  rationale: हरा का काल कृदंत गर्भवती होने या गर्भ धारण करने का बिंब देता है; आगे जन्म और गर्भ के उल्लेख के साथ यह रूपक स्पष्ट बना रहता है।
- source_word: עָמָל
  choice: विपत्ति
  rationale: ज्ञान-साहित्य में यह शब्द कष्ट, अनिष्ट या हानिकारक उपद्रव का अर्थ दे सकता है। यहाँ नैतिक रूपक में 'विपत्ति' स्वाभाविक और व्यापक है।
- source_word: וְיָלֹד
  choice: जन्म देते हैं
  rationale: यलद जन्म देने की क्रिया है; यह गर्भधारण से जन्म तक के काव्यात्मक क्रम को सुरक्षित रखता है।
- source_word: אָוֶן
  choice: दुष्टता
  rationale: आवेन अनर्थ, अधर्म या दुष्टता का बोध करा सकता है। छल के समानांतर यहाँ इसका नैतिक पक्ष प्रमुख है।
- source_word: וּבִטְנָם
  choice: उनका गर्भ
  rationale: बेतन का अर्थ पेट या गर्भ हो सकता है। पूरे पद में प्रसव का रूपक होने के कारण 'गर्भ' सर्वाधिक संगत है; एकवचन संज्ञा के साथ बहुवचन संबंधसूचक प्रत्यय का सामूहिक भाव रखा गया है।
- source_word: תָּכִין
  choice: तैयार करता है
  rationale: हिफिल रूप का सामान्य अर्थ तैयार करना, स्थिर करना या स्थापित करना है। गर्भ के भीतर छल के बनने के रूपक में 'तैयार करता है' स्रोत के निकट रहता है।
- source_word: מִרְמָה
  choice: छल
  rationale: मिरमा धोखे, छल या कपट को दर्शाता है। 'छल' संक्षिप्त, सहज और नैतिक अर्थ में सटीक है।
theological_decisions:
- issue: निहित कर्ता की वचन-संगति
  choice: 'बहुवचन: ''वे ... उनका गर्भ'''
  alternative: 'एकवचन: ''वह ... उसका गर्भ'''
  rationale: आरंभिक कृदंत एकवचन रूप में है, पर 'उनका' में तृतीय पुरुष बहुवचन प्रत्यय और संदर्भ में दुष्ट लोगों के वर्ग का वर्णन बहुवचन सामूहिक अनुवाद का समर्थन करते हैं। इससे स्रोत में निहित प्रतिनिधिक अर्थ बना रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक, गरिमापूर्ण और सहज शैली रखी गई है। गर्भधारण, जन्म और गर्भ का मूल रूपक लगातार सुरक्षित रखा गया है; 'विपत्ति', 'दुष्टता' और 'छल' नैतिक समानांतरता को स्पष्ट करते हैं।
