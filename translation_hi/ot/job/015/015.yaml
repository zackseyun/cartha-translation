base_translation:
  language: en
  yaml_path: translation/ot/job/015/015.yaml
  text: Look[a], he puts no trust even in his holy ones, and the heavens are not pure in his eyes.
translation:
  language: hi
  text: 'देखो, वह अपने पवित्र जनों[a] पर भी भरोसा नहीं करता,

    और आकाश उसकी दृष्टि में शुद्ध नहीं है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘अपने पवित्र प्राणियों पर।’ हिब्रू में शाब्दिक रूप से ‘अपने पवित्र जनों’ है; यहाँ सम्भवतः स्वर्गीय प्राणी अभिप्रेत हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: देखो
  rationale: यह कथन की ओर जोर देकर ध्यान खींचता है। ‘देखो’ आधुनिक और स्वाभाविक है तथा मूल के संवादात्मक बल को बनाए रखता है।
- source_word: בִּקְדֹשָׁיו
  choice: अपने पवित्र जनों
  rationale: मूल का शाब्दिक अर्थ ‘उसके पवित्र जनों’ है। ‘अपने’ हिंदी में कर्ता की ओर संबंध स्पष्ट करता है, जबकि ‘पवित्र जनों’ संभावित स्वर्गीय संदर्भ को मुख्य पाठ में अत्यधिक निश्चित नहीं बनाता।
- source_word: לֹא יַאֲמִין
  choice: भरोसा नहीं करता
  rationale: यहाँ हिफ़ील रूप किसी पर विश्वास या भरोसा रखने के अर्थ में है। यह हिंदी प्रयोग स्वाभाविक है और ‘विश्वास’ के संभावित मत-सिद्धान्तगत अर्थ से बचता है।
- source_word: וְשָׁמַיִם
  choice: और आकाश
  rationale: हिब्रू शब्द रूपतः बहुवचन है, पर आधुनिक हिंदी में ‘आकाश’ सामान्यतः एकवचन रूप में स्वाभाविक है। ‘और’ मूल संयोजक को बनाए रखता है।
- source_word: לֹא זַכּוּ
  choice: शुद्ध नहीं है
  rationale: संदर्भ में क्रिया शुद्ध या निर्मल होने का भाव देती है, न्यायिक निर्दोषता का नहीं। हिंदी में ‘आकाश’ के साथ एकवचन क्रिया स्वाभाविक है।
- source_word: בְּעֵינָיו
  choice: उसकी दृष्टि में
  rationale: यह ‘उसकी आँखों में’ का स्वाभाविक हिंदी मुहावरेदार समतुल्य है और परमेश्वर के मूल्यांकन का भाव व्यक्त करता है।
theological_decisions:
- issue: ‘उसके पवित्र जनों’ का संदर्भ
  choice: मुख्य पाठ में व्यापक पद ‘पवित्र जनों’ रखा गया; पादटिप्पणी में स्वर्गीय प्राणियों की संभाव्यता बताई गई।
  alternative: सीधे ‘स्वर्गदूतों’ या ‘पवित्र प्राणियों’ का अनुवाद करना।
  rationale: ‘आकाश’ के साथ काव्यात्मक समानांतरता से स्वर्गीय पवित्र प्राणी सम्भावित हैं, पर हिब्रू पद स्वयं ‘स्वर्गदूत’ नहीं कहता। इसलिए मुख्य पाठ मूल की व्यापकता और धार्मिक तनाव को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। काव्यात्मक समानांतरता को दो पंक्तियों में प्रस्तुत किया गया है; ‘आकाश’ के लिए स्वाभाविक हिंदी एकवचन व्याकरण अपनाया गया है।
