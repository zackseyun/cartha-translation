source:
  edition: WLC
  text: הֲֽ/לֹא אֱ֭לוֹהַּ גֹּ֣בַהּ שָׁמָ֑יִם וּ/רְאֵ֤ה רֹ֖אשׁ כּוֹכָבִ֣ים כִּי רָֽמּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/012.yaml
  text: Is not God in the height of heaven? And see the highest stars[b][a], how lofty they are.
translation:
  language: hi
  text: क्या परमेश्वर आकाश की ऊँचाई पर नहीं है[a]? और सबसे ऊँचे तारों को देख[b]—वे कितने ऊँचे हैं!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘आकाश की ऊँचाई’ है; इसका अनुवाद ‘आकाश की ऊँचाइयों में’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ ‘तारों का सिर/शीर्ष’ है; आशय सबसे ऊँचे तारों से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: क्या ... नहीं है
  rationale: यह सहमति की अपेक्षा रखने वाला अलंकारिक प्रश्न है। हिन्दी की ‘क्या ... नहीं’ रचना प्रश्नात्मक बल को स्वाभाविक रूप से बनाए रखती है।
- source_word: אֱלוֹהַּ
  choice: परमेश्वर
  rationale: यह एकवचन में परमेश्वर के लिए प्रयुक्त सामान्य पद है; ‘परमेश्वर’ आधुनिक हिन्दी बाइबलीय भाषा में स्पष्ट और गरिमापूर्ण है।
- source_word: גֹּבַהּ שָׁמָיִם
  choice: आकाश की ऊँचाई पर
  rationale: इब्रानी समास का शाब्दिक अर्थ ‘आकाश की ऊँचाई’ है। ‘पर’ निहित स्थान-संबंध को हिन्दी में स्पष्ट करता है, बिना इसे तुलना में बदले।
- source_word: וּרְאֵה
  choice: और ... देख
  rationale: संयोजक और एकवचन आज्ञार्थक क्रिया दोनों सुरक्षित रखे गए हैं।
- source_word: רֹאשׁ כּוֹכָבִים
  choice: सबसे ऊँचे तारों
  rationale: शाब्दिक ‘तारों का सिर/शीर्ष’ यहाँ तारों की अत्यधिक ऊँचाई का मुहावरेदार बोध देता है। मुख्य पाठ में स्वाभाविक हिन्दी रखी गई है और शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: כִּי
  choice: कितने
  rationale: यहाँ כִּי विस्मयात्मक अवलोकन का परिचय देता है; ‘वे कितने ऊँचे हैं’ हिन्दी में उसी भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: רָמּוּ
  choice: वे कितने ऊँचे हैं
  rationale: रום का अर्थ भौतिक रूप से ऊँचा होना है। ‘ऊँचे’ खगोलीय दृश्य को बनाए रखता है और ‘महान/महिमामय’ जैसी सम्मान-संबंधी व्याख्या नहीं जोड़ता।
theological_decisions:
- issue: क्या पद को परमेश्वर की स्थानगत पारलौकिकता का स्वतंत्र सिद्धान्त बनाकर प्रस्तुत किया जाए या एलीपज के अलंकारिक कथन के रूप में रखा जाए
  choice: अलंकारिक प्रश्न और स्थानगत बिंब को सीधे सुरक्षित रखा गया है।
  alternative: परमेश्वर की दूरी या अतीन्द्रियता पर बल देने वाला व्याख्यात्मक विस्तार।
  rationale: इब्रानी पाठ परमेश्वर, आकाश की ऊँचाई और ऊँचे तारों का बिंब देता है, पर इससे आगे कोई सिद्धान्तगत निष्कर्ष स्पष्ट नहीं करता। अनुवाद एलीपज के कथन की अलंकारिक शक्ति को बनाए रखता है, बिना अतिरिक्त धर्मवैज्ञानिक अर्थ जोड़े।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘क्या ... नहीं’ अलंकारिक प्रश्न को और विस्मयादिबोधक वाक्य तारों की ऊँचाई पर आश्चर्य को व्यक्त करता है। एकवचन ‘देख’ मूल आज्ञार्थक रूप के अनुरूप है।
