base_translation:
  language: en
  yaml_path: translation/ot/job/022/029.yaml
  text: For when they are brought low[a], you say[b], ‘Lift them up!’ and he saves the one with downcast eyes.
translation:
  language: hi
  text: क्योंकि जब वे नीचा किए जाते हैं[a], तब तुम कहते हो, “उनका उत्थान हो!” और वह झुकी हुई आँखों वाले[b] को बचाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि जब वे नीचा किए जाते हैं, तब तुम कहते हो, ‘उत्थान है!’” इब्रानी उपवाक्य संक्षिप्त है और इसका अर्थ कुछ अस्पष्ट है।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक, “झुकी हुई आँखों वाला”; अर्थात नम्र या निराश व्यक्ति।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि जब
  rationale: यह पिछले कथन का आधार और परिस्थिति दोनों बताता है; इसलिए कारण और समय का संयुक्त भाव स्वाभाविक हिन्दी में रखा गया है।
- source_word: הִשְׁפִּילוּ
  choice: लोग नीचे गिराए जाते हैं
  rationale: שׁפל से बना यह बहुवचन रूप नीचा किए जाने या दीन दशा में पहुँचने का भाव देता है। कर्ता अनिर्दिष्ट है, इसलिए हिन्दी में सामान्य बहुवचन ‘लोग’ जोड़ा गया है; इसे स्वेच्छा से नम्र होने के अर्थ में नहीं लिया गया।
- source_word: וַתֹּאמֶר
  choice: तब तुम कहते हो
  rationale: क्रिया एकवचन सम्बोधित व्यक्ति से कही गई है। प्रसंग के कथनात्मक-प्रतिज्ञात्मक भाव के लिए वर्तमानकालीन ‘कहते हो’ स्वाभाविक है।
- source_word: גֵּוָה
  choice: उन्हें ऊँचा उठाया जाए!
  rationale: यह कठिन और संक्षिप्त संज्ञात्मक कथन है, जिसका मूल भाव ऊँचाई या उत्कर्ष है। पिछले बहुवचन से ‘उन्हें’ लेकर इसे उत्थान की घोषणा के रूप में व्यक्त किया गया है; शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: וְשַׁח עֵינַיִם
  choice: झुकी हुई आँखों वाले को
  rationale: शाब्दिक बिंब ‘आँखों से झुका हुआ’ दीन, नम्र या निराश व्यक्ति को सूचित करता है। हिन्दी में बिंब को बनाए रखते हुए अर्थ को अनावश्यक रूप से केवल ‘नम्र’ तक सीमित नहीं किया गया।
- source_word: יוֹשִׁעַ
  choice: वह ... बचाता है
  rationale: ישׁע का अर्थ बचाना या छुड़ाना है। तृतीय पुरुष एकवचन कर्ता को मूल पाठ की तरह अप्रकट संदर्भ के साथ ‘वह’ रखा गया है; प्रसंग में संकेत परमेश्वर की ओर है।
theological_decisions:
- issue: יוֹשִׁעַ का कर्ता
  choice: ‘वह बचाता है’; कर्ता को परमेश्वर समझा गया है, पर नाम स्पष्ट रूप से नहीं जोड़ा गया।
  alternative: ‘कोई बचाता है’ अथवा ‘तुम बचाते हो’।
  rationale: इब्रानी क्रिया तृतीय पुरुष पुल्लिंग एकवचन है और प्रसंग में परमेश्वर निहित कर्ता है। मूल की संक्षिप्तता बनाए रखने के लिए ‘परमेश्वर’ शब्द नहीं जोड़ा गया।
- issue: कठिन पदबंध גֵּוָה का अर्थ
  choice: 'उत्थान की घोषणा: ‘उन्हें ऊँचा उठाया जाए!’'
  alternative: ‘ऊँचाई है!’ / ‘उत्थान!’ अथवा नकारात्मक अर्थ में ‘घमंड’।
  rationale: तुरंत पहले नीचे गिराए जाने के विपरीत भाव के कारण यहाँ सकारात्मक उत्थान अधिक संगत है। फिर भी इब्रानी की संक्षिप्तता और वास्तविक अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रूप अपनाया गया है। ‘नीचे गिराए जाते हैं’ और ‘ऊँचा उठाया जाए’ से मूल का नीचे-ऊपर विरोध सुरक्षित है। कठिन इब्रानी पदबंध को मुख्य पाठ में अर्थपूर्ण बनाया गया है और उसकी शाब्दिक अस्पष्टता पादटिप्पणी में दी गई है।
