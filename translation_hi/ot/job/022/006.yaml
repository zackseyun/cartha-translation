base_translation:
  language: en
  yaml_path: translation/ot/job/022/006.yaml
  text: For you took pledges from your brothers for no reason[b][a], and stripped the clothing from the naked.
translation:
  language: hi
  text: क्योंकि तूने अपने भाइयों[a] से बिना कारण ऋण की जमानत ली[b], और नंगे लोगों के वस्त्र छीन लिए[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘भाइयों’ से आशय केवल सगे भाइयों से नहीं, बल्कि समुदाय के साथी सदस्यों से भी हो सकता है।
    reason: cultural_note
  - marker: b
    text: 'अर्थात ऋण के बदले उनसे कोई वस्तु जमानत या बंधक के रूप में ले ली। वैकल्पिक अनुवाद: ‘तूने अपने भाइयों से बिना कारण बंधक लिया।’'
    reason: lexical_alternative
  - marker: c
    text: ‘नंगे’ का अर्थ यहाँ ‘बहुत कम कपड़े पहने हुए’ भी हो सकता है; संदर्भ में यह अभावग्रस्त लोगों की दशा भी सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
