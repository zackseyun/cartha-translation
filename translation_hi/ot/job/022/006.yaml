- source_word: תַחְבֹּל
  choice: तूने ... बंधक लिया
  rationale: חבל यहाँ ऋण के बदले कोई वस्तु बंधक या जमानत के रूप में लेने का भाव रखता है। ‘बंधक लिया’ मूल आर्थिक-सामाजिक कार्य को संक्षेप में व्यक्त करता है।
- source_word: אַחֶיךָ
  choice: अपने भाइयों
  rationale: इब्रानी में शाब्दिक अर्थ ‘तेरे भाई’ है। यह सगे भाइयों के साथ-साथ समुदाय के पुरुष सदस्यों को भी सूचित कर सकता है; मुख्य पाठ मूल की पारिवारिक-सामुदायिक भाषा बनाए रखता है।
- source_word: חִנָּם
  choice: अकारण
  rationale: यह बिना उचित कारण या न्यायोचित आधार के किए गए काम का नैतिक आरोप व्यक्त करता है; ‘अकारण’ आधुनिक हिंदी में संक्षिप्त और स्पष्ट है।
- source_word: וּבִגְדֵי
  choice: और ... के वस्त्र
  rationale: בגד वस्त्र या कपड़े को दर्शाता है। ‘वस्त्र’ इस गंभीर काव्यात्मक आरोप के अनुरूप स्वाभाविक और गरिमापूर्ण है।
- source_word: עֲרוּמִּים
  choice: नंगे लोगों
  rationale: शब्द का मूल अर्थ ‘नंगे’ है, यद्यपि संदर्भ में इसका आशय बहुत कम कपड़े पहने या अभावग्रस्त लोगों से भी हो सकता है। मुख्य पाठ आरोप की तीखी विडंबना को सुरक्षित रखता है।
- source_word: תַּפְשִׁיט
  choice: उतरवा लिए
  rationale: פשט का हिफ़ील रूप यहाँ किसी के वस्त्र उतार लेने या उतरवाने का अर्थ देता है। ‘उतरवा लिए’ कर्ता की उत्तरदायी और शोषणकारी भूमिका को स्वाभाविक हिंदी में व्यक्त करता है।
