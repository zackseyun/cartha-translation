id: JOB.22.3
reference: Job 22:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הַ/חֵ֣פֶץ לְ֭/שַׁדַּי כִּ֣י תִצְדָּ֑ק וְ/אִם בֶּ֝֗צַע כִּֽי תַתֵּ֥ם דְּרָכֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/003.yaml
  text: Is it any pleasure to the Almighty that you are righteous[b][a], or any gain that you make your ways blameless?
translation:
  language: hi
  text: क्या तुम्हारे धर्मी होने से सर्वशक्तिमान को कोई प्रसन्नता होती है[a], या तुम्हारे अपने मार्गों को निर्दोष बनाने से उसे कोई लाभ होता है[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘आनन्द’।
    reason: lexical_alternative
  - marker: b
    text: या ‘मुनाफ़ा’।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֵפֶץ
  choice: कोई प्रसन्नता होती है
  rationale: חֵפֶץ यहाँ प्रसन्नता, आनन्द या अभिरुचि को व्यक्त करता है। प्रश्नवाचक वाक्य में यह हिन्दी प्रयोग स्वाभाविक है और अर्थ को अनावश्यक रूप से संकीर्ण नहीं करता।
- source_word: לְשַׁדַּי
  choice: सर्वशक्तिमान को
  rationale: שַׁדַּי अय्यूब में प्रयुक्त परमेश्वर की उपाधि है; आधुनिक हिन्दी में ‘सर्वशक्तिमान’ इसका प्रतिष्ठित और सुबोध रूप है।
- source_word: כִּי תִצְדָּק
  choice: तुम्हारे धर्मी होने से
  rationale: Qal रूप תִצְדָּק का सामान्य अर्थ ‘धर्मी होना’ या ‘सही ठहरना’ है। ‘धर्मी होने’ से नैतिक आशय स्पष्ट रहता है और आत्म-धर्मी ठहराने का भाव नहीं जोड़ा जाता।
- source_word: וְאִם
  choice: या
  rationale: समानांतर आलंकारिक प्रश्न के दूसरे भाग को प्रस्तुत करते हुए וְאִם यहाँ हिन्दी में ‘या’ से स्वाभाविक रूप से व्यक्त होता है।
- source_word: בֶּצַע
  choice: लाभ
  rationale: בֶּצַע का अर्थ लाभ या मुनाफ़ा है। ‘लाभ’ गरिमापूर्ण, सामान्य और इस प्रसंग के लाभ-संबंधी रूपक के अनुरूप है।
- source_word: כִּי תַתֵּם
  choice: बनाने से
  rationale: Hiphil תַתֵּם में पूर्ण अथवा निर्दोष बनाने का कारणवाचक भाव है। ‘बनाने से’ उस सक्रिय कारणवाचकता को बनाए रखता है।
- source_word: דְּרָכֶיךָ
  choice: अपने मार्गों को
  rationale: बहुवचन דְּרָכֶיךָ व्यक्ति के जीवन-व्यवहार को मार्गों के रूपक से व्यक्त करता है। ‘अपने मार्गों’ से मूल रूपक सुरक्षित और हिन्दी बोधगम्य रहता है।
- source_word: תַתֵּם דְּרָכֶיךָ
  choice: अपने मार्गों को निर्दोष बनाने से
  rationale: यह वाक्यांश नैतिक पूर्णता या खराई का संकेत देता है। ‘निर्दोष’ उस नैतिक अर्थ को स्पष्ट करता है, जबकि ‘बनाने’ से Hiphil का कारणवाचक रूप सुरक्षित रहता है।
theological_decisions:
- issue: क्या यह पद बताता है कि मनुष्य की धार्मिकता से परमेश्वर को अपने में कोई लाभ या प्रसन्नता मिलती है
  choice: आलंकारिक प्रश्नों को इस प्रकार रखा गया है कि वे एलीपज के दावे—मनुष्य की धार्मिकता से परमेश्वर को लाभ नहीं होता—को व्यक्त करें।
  alternative: इसे केवल परमेश्वर की आत्मनिर्भरता पर बल देने वाला कथन समझना, न कि धार्मिकता में उसकी प्रसन्नता का निषेध।
  rationale: मूल में प्रसन्नता और लाभ के शब्द आलंकारिक प्रश्नों में हैं। अनुवाद एलीपज की दलील को उसके कथन के रूप में सुरक्षित रखता है, पर इससे सम्पूर्ण बाइबिल के लिए यह निष्कर्ष नहीं जोड़ता कि परमेश्वर धार्मिकता से कभी प्रसन्न नहीं होता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज शैली। समानांतर आलंकारिक प्रश्न और ‘मार्गों’ का मूल रूपक बनाए रखा गया है। सर्वनाम एकवचन अनौपचारिक ‘तुम’ है, जो प्रसंग में एलीपज द्वारा अय्यूब को सीधे सम्बोधन के अनुरूप है।
