  yaml_path: translation/ot/job/022/028.yaml
  text: You will decree a matter[a], and it will be established for you, and light will shine on your ways.
translation:
  language: hi
  text: तुम एक बात ठहराओगे[a], और वह तुम्हारे लिए पूरी होगी; तुम्हारे मार्गों पर प्रकाश चमकेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम एक वचन ठहराओगे, और वह तुम्हारे लिए स्थिर रहेगा।”
    reason: אֹמֶר का अधिक शाब्दिक अर्थ ‘वचन’ है, और יָקָם का मूल बिंब ‘स्थिर रहना/खड़ा रहना’ है।
lexical_decisions:
- source_word: תִגְזַר
  choice: निश्चय करोगे
  rationale: גזר का मूल अर्थ काटना या अलग करना है, पर यहाँ אֹמֶר के साथ इसका विस्तृत अर्थ किसी बात को दृढ़तापूर्वक तय करना या ठहराना है। ‘निश्चय करोगे’ आधुनिक हिन्दी में स्वाभाविक है और राजकीय अधिकार का अनावश्यक भाव नहीं जोड़ता।
- source_word: אֹמֶר
  choice: किसी बात
  rationale: אֹמֶר का सामान्य अर्थ ‘वचन/कथन’ है, पर इस प्रयोग में यह कही या तय की गई बात को दर्शाता है। अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: יָקָם
  choice: स्थापित होगी
  rationale: קום का मूल भाव खड़े होने या टिके रहने का है। यहाँ किसी निश्चय के प्रभावी या दृढ़ होने का परिणाम सूचित है; ‘स्थापित होगी’ इस अर्थ को बिना अतिरिक्त आश्वासन जोड़े व्यक्त करता है।
- source_word: לָךְ
  choice: तुम्हारे लिए
  rationale: ל संबंध अथवा लाभ का भाव देता है। ‘तुम्हारे लिए’ इसका सीधा और अर्थगत रूप से खुला अनुवाद है।
- source_word: דְּרָכֶיךָ
  choice: तुम्हारे मार्गों
  rationale: דרך वास्तविक मार्ग के साथ जीवन की दिशा या आचरण का रूपक भी हो सकता है। ‘मार्गों’ मूल काव्यात्मक रूपक को बनाए रखता है।
- source_word: נָגַהּ אֹור
  choice: प्रकाश चमकेगा
  rationale: נגה का अर्थ चमकना या प्रकाशमान होना है और אוֹר इसका कर्ता है। यह अनुवाद स्पष्ट तथा स्वाभाविक है और मूल बिंब को सुरक्षित रखता है।
theological_decisions:
- issue: एलीपज के कथन में प्रतिज्ञा का स्वरूप
  choice: कथन को उसके विश्वासपूर्ण भविष्यवाचक रूप में रखा गया है, पर उसे सार्वकालिक और बिना शर्त ईश्वरीय गारंटी के रूप में अधिक प्रबल नहीं बनाया गया।
  alternative: इसे समृद्धि की निरपेक्ष प्रतिज्ञा या केवल एक संभावना के रूप में अनुवाद करना।
  rationale: यह पद एलीपज के भाषण का भाग है; पुस्तक इसे अनिवार्यतः अपना अंतिम धर्मवैचारिक निष्कर्ष नहीं ठहराती। इसलिए मूल कथन का दृढ़ स्वर सुरक्षित है, पर अनुवाद उसमें अतिरिक्त सिद्धान्तगत बल नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक शैली अपनाई गई है। एकवचन संबोधन के लिए ‘तुम’ चुना गया है, ताकि आधुनिक पाठक के लिए भाषा स्वाभाविक रहे और ‘तू’ से उत्पन्न संभावित तिरस्कार का भाव न आए।
