base_translation:
  language: en
  yaml_path: translation/ot/job/022/018.yaml
  text: Yet he filled their houses with good things[b][a], but the counsel of the wicked is far from me.
translation:
  language: hi
  text: फिर भी उसने उनके घरों को अच्छी वस्तुओं से भर दिया[a], पर दुष्टों की सलाह मुझसे दूर है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, कुछ कम शब्दशः, “समृद्धि से।” इब्रानी में “भलाई” या “अच्छी चीज़” है, जिसका आशय संभवतः अच्छी वस्तुएँ या लाभ है।
    reason: lexical_alternative
  - marker: b
    text: 'या, “दुष्टों की सलाह मुझसे दूर रहे।” इब्रानी में इसे अधिक सीधे कथन के रूप में पढ़ा जाता है: “दुष्टों की सलाह मुझसे दूर है।”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהוּא
  choice: फिर भी उसने
  rationale: संयोजक और सर्वनाम पूर्ववर्ती संदर्भ से विरोध प्रकट करते हैं; स्पष्ट कर्ता परमेश्वर है।
- source_word: מִלֵּא
  choice: भर दिया
  rationale: क्रिया का मूल अर्थ ‘भरना’ है; यहाँ पूर्ण हुई क्रिया के लिए सहज हिन्दी भूतकाल उपयुक्त है।
- source_word: בָתֵּיהֶם
  choice: उनके घरों को
  rationale: यह इब्रानी के ठोस चित्र ‘उनके घर’ को बनाए रखता है, यद्यपि संदर्भ में समृद्धि का क्षेत्र भी निहित है।
- source_word: טוֹב
  choice: अच्छी वस्तुओं से
  rationale: शब्दशः ‘भलाई/अच्छे’ का संज्ञात्मक प्रयोग है; हिन्दी में ‘अच्छी वस्तुओं’ से अर्थ स्वाभाविक और निकट रहता है।
- source_word: וַעֲצַת
  choice: पर ... सलाह
  rationale: दूसरा चरण वक्ता को दुष्टों के विचार से अलग करता है, इसलिए संयोजक को विरोधसूचक ‘पर’ कहा गया; עֵצָה के लिए ‘सलाह’ सामान्य और व्यापक है।
- source_word: רְשָׁעִים
  choice: दुष्टों की
  rationale: बहुवचन विशेषण का संज्ञात्मक प्रयोग है; ‘दुष्टों’ उसका संक्षिप्त और पारंपरिक हिन्दी रूप है।
- source_word: רָחֲקָה מֶנִּי
  choice: मुझसे दूर है
  rationale: क़ातल रूप को कथन के रूप में रखा गया है; वर्तमान हिन्दी वक्ता की मौजूदा असहमति को स्वाभाविक ढंग से व्यक्त करती है।
theological_decisions:
- issue: अंतिम चरण में वक्ता का रुख
  choice: ‘दुष्टों की सलाह मुझसे दूर है’—असहमति का कथन
  alternative: ‘दुष्टों की सलाह मुझसे दूर रहे’—इच्छा या प्रार्थना
  rationale: इब्रानी में क़ातल रूप है, आज्ञार्थक या जुस्सिव नहीं; इसलिए मूल पाठ की व्याकरणिक प्रवृत्ति के अनुसार इसे कथन रखा गया है, जबकि संभावित इच्छार्थक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; काव्यात्मक गरिमा बनाए रखते हुए सरल, स्पष्ट शब्दावली। ‘घर’ का ठोस इब्रानी बिंब और अंतिम चरण की व्याकरणिक अस्पष्टता सुरक्षित रखी गई है।
