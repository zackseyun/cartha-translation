  yaml_path: translation/ot/job/022/004.yaml
  text: Is it because of your fear of him that he reproves you and enters into judgment with you?[a][b][c]
translation:
  language: hi
  text: क्या वह तुम्हारे परमेश्वर-भय के कारण तुम्हें फटकारता है[a] और तुम्हारे साथ न्यायिक विवाद में पड़ता है?[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि तुम उसका भय मानते हो”; इब्रानी में शाब्दिक रूप से, “तुम्हारे भय के कारण।”
    reason: lexical_alternative
  - marker: b
    text: या, “तुम्हें डाँटता है,” “तुम्हें दोष देता है,” अथवा “तुम्हें सुधारता है।”
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक अर्थ, “तुम्हारे साथ न्याय में आता है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲמִיִּרְאָתְךָ
  choice: क्या वह तुम्हारे परमेश्वर से डरने के कारण
  rationale: प्रश्नवाचक הֲ और कारणसूचक מִן को स्वाभाविक हिन्दी में व्यक्त किया गया है। יִרְאָה का अर्थ यहाँ परमेश्वर का भय मानना है; प्रसंग से निहित परमेश्वर को स्पष्ट किया गया है, जबकि भाव को ‘भक्ति’ जैसे अधिक व्याख्यात्मक शब्द से सीमित नहीं किया गया।
- source_word: יֹכִיחֶךָ
  choice: तुम्हें डाँटता है
  rationale: हिफ़ील रूप יכח में डाँटने, सुधारने और दोष दिखाने के अर्थ हो सकते हैं। ‘डाँटता है’ सामान्य पाठक के लिए सहज है और अगले न्यायिक वाक्यांश से अलग रहते हुए नैतिक प्रताड़ना का भाव रखता है।
- source_word: יָבֹא עִמְּךָ בַּמִּשְׁפָּט
  choice: तुम्हारे साथ न्याय करने आता है
  rationale: इब्रानी मुहावरे का शाब्दिक ढाँचा ‘तुम्हारे साथ न्याय में आता है’ है। चुना हुआ रूप हिन्दी में स्वाभाविक है और न्यायिक विवाद का भाव बनाए रखता है; इसे ‘तुम्हें न्याय के सामने लाता है’ नहीं बनाया गया, क्योंकि उससे क्रिया की दिशा बदल जाती।
- source_word: מִּשְׁפָּט
  choice: न्याय
  rationale: यहाँ शब्द न्यायिक कार्यवाही या निर्णय को सूचित करता है। ‘न्याय’ व्यापक और गरिमापूर्ण हिन्दी विकल्प है; ‘अदालत’ स्थान को और ‘मुकदमा’ विशेष कानूनी रूप को आवश्यकता से अधिक स्पष्ट करता।
theological_decisions:
- issue: ‘तुम्हारे भय’ का निहित लक्ष्य
  choice: ‘तुम्हारे परमेश्वर से डरने’ द्वारा लक्ष्य को स्पष्ट करना
  alternative: ‘तुम्हारे डर के कारण’ कहकर लक्ष्य को अनकहा छोड़ना
  rationale: प्रसंग में एलीपज़ परमेश्वर द्वारा अय्यूब के साथ किए जा रहे व्यवहार की बात करता है। हिन्दी में केवल ‘तुम्हारे डर’ से अर्थ अस्पष्ट हो सकता है, इसलिए निहित लक्ष्य स्पष्ट किया गया है।
- issue: एलीपज़ के प्रश्न का बल
  choice: ऐसा आलंकारिक प्रश्न जो ‘नहीं’ उत्तर की अपेक्षा करता है
  alternative: तटस्थ सूचना माँगने वाला प्रश्न
  rationale: प्रश्नवाचक रचना और प्रसंग में निहित विडंबना यह संकेत देती है कि एलीपज़ इस बात से इनकार कर रहा है कि परमेश्वर अय्यूब को उसके परमेश्वर-भय के कारण न्याय में ला रहा है। अतिरिक्त व्याख्या जोड़े बिना प्रश्नरूप सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मौखिक रूप से सहज शैली रखी गई है। प्रश्न की विडंबना और न्यायिक भाषा सुरक्षित हैं। ‘परमेश्वर से डरना’ सामान्य बाइबलीय अभिव्यक्ति है और ‘श्रद्धा’ या ‘भक्ति’ की तुलना में मूल के भय/आदर संबंधी तनाव को अधिक खुला रखती है।
