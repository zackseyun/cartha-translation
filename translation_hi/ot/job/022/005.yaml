base_translation:
  language: en
  yaml_path: translation/ot/job/022/005.yaml
  text: Is not your evil abundant[b][a], and there is no end to your iniquities?
translation:
  language: hi
  text: 'क्या तेरी बुराई बहुत बड़ी नहीं है,

    और तेरे अधर्मों का कोई अंत नहीं?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲלֹא
  choice: क्या ... नहीं है
  rationale: यह प्रत्याशित सकारात्मक उत्तर वाला आलंकारिक प्रश्न है; हिन्दी में यह रचना उसके प्रश्नात्मक और आरोपात्मक बल को स्वाभाविक रूप से बनाए रखती है।
- source_word: רָעָתְךָ
  choice: तेरी बुराई
  rationale: यहाँ עון के साथ समानांतरता नैतिक बुराई की ओर संकेत करती है, विपत्ति की ओर नहीं। ‘बुराई’ अर्थ की व्यापकता बनाए रखती है और ‘दुष्टता’ से कुछ कम व्याख्यात्मक है।
- source_word: רַבָּה
  choice: बहुत बड़ी
  rationale: विशेषण परिमाण या प्रचुरता व्यक्त करता है। एकवचन भाववाचक ‘बुराई’ के साथ ‘बहुत बड़ी’ सहज और अर्थानुकूल है।
- source_word: וְאֵין קֵץ
  choice: और ... कोई अंत नहीं
  rationale: यह हिन्दी में स्वाभाविक ढंग से ‘अंत या सीमा न होने’ का अर्थ व्यक्त करता है और इब्रानी वाक्य-संरचना के निकट रहता है।
- source_word: לַעֲוֺנֹתֶיךָ
  choice: तेरे अधर्मों का
  rationale: עון नैतिक टेढ़ेपन, अपराध या दोष का प्रबल भाव रखता है। बहुवचन ‘अधर्मों’ आरोप की गंभीरता बनाए रखता है; हिन्दी मुहावरे में ל को संबंधकारक ‘का’ से व्यक्त करना स्वाभाविक है।
theological_decisions:
- issue: רָעָתְךָ में नैतिक बुराई बनाम विपत्ति
  choice: नैतिक बुराई
  alternative: विपत्ति या दुर्भाग्य
  rationale: यद्यपि רעה कुछ संदर्भों में विपत्ति का अर्थ दे सकता है, यहाँ ‘तेरे अधर्मों’ के साथ समानांतरता नैतिक आरोप को प्राथमिक बनाती है। अनुवाद एलीपज के आरोप को प्रस्तुत करता है, उसे कथाकार का स्वतंत्र निर्णय नहीं बनाता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सीधी हिन्दी। संबोधन के लिए ‘तेरी/तेरे’ रखा गया है, जो एकवचन इब्रानी प्रत्ययों और एलीपज के सीधे, तीखे आरोप के अनुकूल है। दो पंक्तियों में काव्यात्मक समानांतरता सुरक्षित रखी गई है।
