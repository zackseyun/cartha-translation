  text: יְֽמַלֵּ֥ט אִֽי נָקִ֑י וְ֝/נִמְלַ֗ט בְּ/בֹ֣ר כַּפֶּֽי/ךָ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/022/030.yaml
  text: He delivers even one who is not innocent[b][a], and he will be delivered through the cleanness of your hands.
translation:
  language: hi
  text: 'वह उसे भी बचाता है जो निर्दोष नहीं है[a],

    और वह तेरे हाथों की शुद्धता से बचाया जाएगा[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह निर्दोष व्यक्ति को बचाता है।” पहले खंड का इब्रानी पाठ कठिन है और उसका अर्थ अलग-अलग ढंग से लिया जाता है।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक रूप से, “तेरे हाथों की शुद्धता से”; यह निर्दोषता या नैतिक शुद्धता का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְמַלֵּט
  choice: बचाता है
  rationale: पिएल रूप किसी को बच निकलने देना या छुड़ाना व्यक्त करता है; ‘बचाता है’ सहज है और अगले निष्क्रिय क्रियारूप के साथ समानांतरता रखता है।
- source_word: אִי נָקִי
  choice: निर्दोष न होनेवाले को भी
  rationale: यह कठिन इब्रानी पदबंध यहाँ परंपरागत नकारात्मक अर्थ में लिया गया है। ‘भी’ इस आशय को स्पष्ट करता है कि बचाव ऐसे व्यक्ति तक पहुँचता है जो निर्दोष नहीं है, जबकि वैकल्पिक पाठ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: נָקִי
  choice: निर्दोष
  rationale: यह शब्द दोष से मुक्त या अपराधरहित होने का नैतिक और न्यायिक भाव रखता है; ‘निर्दोष’ आधुनिक हिन्दी में वही अर्थ स्वाभाविक रूप से देता है।
- source_word: וְנִמְלַט
  choice: और वह ... बचाया जाएगा
  rationale: निफ़अल रूप को निष्क्रिय अर्थ में प्रस्तुत किया गया है, जिससे पहले खंड के ‘बचाता है’ के साथ क्रियात्मक समानांतरता बनी रहती है।
- source_word: בְּבֹר
  choice: शुद्धता के कारण
  rationale: בֹּר यहाँ शुद्धता या निर्मलता दर्शाता है। संबंधबोधक בְּ को साधन/आधार के अर्थ में ‘के कारण’ कहा गया है, ताकि हिन्दी में वाक्य स्वाभाविक रहे और हाथों की शुद्धता को बचाव का आधार बताया जाए।
- source_word: כַּפֶּיךָ
  choice: तेरे हाथों की
  rationale: द्विवचन रूप का स्वाभाविक हिन्दी रूप ‘हाथों’ है। प्रसंग में हाथ नैतिक आचरण के प्रतीक हैं, पर मूल बिंब को मुख्य पाठ में बनाए रखा गया है।
theological_decisions:
- issue: पहले खंड के कठिन इब्रानी पदबंध का अर्थ
  choice: परमेश्वर निर्दोष न होनेवाले को भी बचाता है।
  alternative: वह निर्दोष व्यक्ति को बचाता है।
  rationale: אִי נָקִי की रचना कठिन और विवादित है। नकारात्मक अर्थ दूसरे खंड के साथ यह तनाव बनाए रखता है कि किसी अन्य का बचाव अय्यूब के हाथों की शुद्धता से जुड़ा है; फिर भी वैकल्पिक ‘निर्दोष व्यक्ति’ वाला अर्थ पादटिप्पणी में दिया गया है।
- issue: हाथों की शुद्धता और दूसरे व्यक्ति के बचाव का संबंध
  choice: वाक्य को कारण/साधन के संबंध के रूप में रखा गया है, बिना मध्यस्थता का विस्तृत सिद्धांत जोड़े।
  alternative: इसे स्पष्ट रूप से अय्यूब की मध्यस्थ प्रार्थना या स्थानापन्न धार्मिकता का कथन बनाना।
  rationale: मूल पाठ केवल ‘तेरे हाथों की शुद्धता से/के कारण’ कहता है; अतः अनुवाद उसका संबंध बनाए रखता है, पर उससे आगे कोई संप्रदायगत धर्मसिद्धांत नहीं निकालता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण शैली रखी गई है। ‘तेरे’ से इब्रानी एकवचन संबोधन सुरक्षित है। काव्यात्मक समानांतरता के लिए दोनों पंक्तियों में ‘बचाता/बचाया जाएगा’ रखा गया है; कठिन पाठ की वास्तविक अस्पष्टता पादटिप्पणी में दी गई है।
