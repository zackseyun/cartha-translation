  text: כִּי אָ֭ז עַל שַׁדַּ֣י תִּתְעַנָּ֑ג וְ/תִשָּׂ֖א אֶל אֱל֣וֹהַּ פָּנֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/026.yaml
  text: For then you will delight yourself in the Almighty[b][a], and lift up your face to God.
translation:
  language: hi
  text: क्योंकि तब तू सर्वशक्तिमान में आनन्द लेगा[a], और परमेश्वर की ओर अपना मुख उठाएगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सर्वशक्तिमान में प्रसन्न होगा।”
    reason: lexical_alternative
  - marker: b
    text: “परमेश्वर की ओर अपना मुख उठाना” एक मुहावरा है, जो विश्वास के साथ उसके निकट आने, फिर से अनुग्रह पाने या साहसपूर्वक प्रार्थना करने का संकेत दे सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: כִּי אָז
  choice: क्योंकि तब
  rationale: כִּי पिछले उपदेश से कारण अथवा परिणाम का संबंध जोड़ता है, और אָז उसके बाद की स्थिति को दर्शाता है।
- source_word: עַל שַׁדַּי
  choice: सर्वशक्तिमान में
  rationale: התענג के साथ עַל आनन्द के विषय को सूचित करता है; शַׁדַּי के अर्थ को स्पष्ट करने वाला प्रचलित हिन्दी रूप ‘सर्वशक्तिमान’ रखा गया है।
- source_word: תִּתְעַנָּג
  choice: तू ... आनन्द पाएगा
  rationale: हित्पएल रूप व्यक्तिगत रूप से आनन्द लेने या आनन्दित होने का भाव देता है; यह हिन्दी में स्वाभाविक रहते हुए उस आत्मसंबंधी भाव को व्यक्त करता है।
- source_word: וְתִשָּׂא ... פָּנֶיךָ
  choice: और ... अपना मुख उठाएगा
  rationale: נשׂא का ठोस बिंब ‘उठाना’ है। ‘मुख उठाना’ मुहावरे को बनाए रखता है और उसे केवल प्रार्थना, भरोसे या स्वीकृति तक सीमित नहीं करता।
- source_word: אֶל אֱלוֹהַּ
  choice: परमेश्वर की ओर
  rationale: אֶל दिशा बताता है और אֱלוֹהַּ के लिए स्वाभाविक तथा गरिमापूर्ण हिन्दी पद ‘परमेश्वर’ है।
theological_decisions:
- issue: परमेश्वर की ओर मुख उठाने का मुहावरा
  choice: 'ठोस मुहावरे को बनाए रखा गया: ‘परमेश्वर की ओर अपना मुख उठाएगा।’'
  alternative: ‘परमेश्वर से निडर होकर प्रार्थना करेगा’ अथवा ‘परमेश्वर के सामने सिर ऊँचा करेगा।’
  rationale: इब्रानी अभिव्यक्ति आत्मविश्वास से निकट आने, अनुग्रह फिर पाने या साहसपूर्वक प्रार्थना करने का संकेत दे सकती है। मूल बिंब बनाए रखने से यह अर्थगत और धर्मवैचारिक विस्तार सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और काव्यात्मक स्वर रखा गया है। अय्यूब से एकवचन निकट संबोधन के कारण ‘तू’ प्रयुक्त हुआ है; मूल मुहावरे और उसकी बहुअर्थता को सुरक्षित रखा गया है।
