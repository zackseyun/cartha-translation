translation:
  language: hi
  text: 'या अंधकार हो कि तुम देख न सको,

    और जल की बहुतायत[a] तुम्हें ढक ले।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘जल की बाढ़।’ इब्रानी शब्द जल की बहुतायत या उमड़ते जल का भाव दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹ
  choice: या
  rationale: यह अगले संभावित संकट को संक्षेप में जोड़ता है; ‘या’ हिब्रू संयोजक की वैकल्पिक शक्ति को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: חֹשֶׁךְ
  choice: अंधकार
  rationale: यह मूल संज्ञा का सीधा और गरिमापूर्ण रूप है तथा न देख पाने के बिंब के अनुकूल है।
- source_word: לֹא תִרְאֶה
  choice: कि तुम देख न सकोगे
  rationale: शाब्दिक अर्थ ‘तुम नहीं देखोगे’ है; अंधकार के परिणाम को हिंदी में स्वाभाविक रूप से व्यक्त करने के लिए यह संरचना अपनाई गई है।
- source_word: וְשִׁפְעַת מַיִם
  choice: और जल की बाढ़
  rationale: שִׁפְעָה में प्रचुरता या उमड़ते प्रवाह का भाव है। जल के साथ ‘बाढ़’ काव्यात्मक संदर्भ में स्वाभाविक है, जबकि व्यापक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: תְּכַסֶּךָּ
  choice: तुम्हें ढक लेगी
  rationale: यह क्रिया के मूल अर्थ ‘ढकना’ को बनाए रखता है और जल के प्रबल दृश्य को बिना ‘डुबो देना’ जैसे अतिरिक्त अर्थ के व्यक्त करता है।
