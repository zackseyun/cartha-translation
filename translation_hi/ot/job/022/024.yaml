  - marker: b
    text: ओपीर उत्तम सोने के लिए प्रसिद्ध एक स्थान था; इब्रानी में यहाँ केवल “ओपीर” है।
    reason: cultural_note
  - marker: c
    text: “बरसाती नाले” ऐसी घाटियों या जलमार्गों को कहते हैं जिनमें प्रायः वर्षा के समय ही तेज पानी बहता है; अनुवाद “जलधाराओं के पथरीले तल में” भी हो सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: וְשִׁית
  choice: और … रख दे
  rationale: שׁית का मूल अर्थ ‘रखना/स्थापित करना’ है। यहाँ संबोधित एकवचन पुरुष के लिए आज्ञार्थक ‘रख दे’ स्वाभाविक है और וְ को ‘और’ से व्यक्त किया गया है।
- source_word: עַל עָפָר
  choice: धूल में
  rationale: עַל सामान्यतः ‘पर’ है, पर इस काव्यात्मक चित्र में हिंदी का ‘धूल में रख देना’ त्याग देने का आशय स्वाभाविक रूप से व्यक्त करता है; ‘धूल पर’ भी शाब्दिक संभावना है।
- source_word: בָּצֶר
  choice: सोने को
  rationale: यह दुर्लभ शब्द बहुमूल्य धातु, विशेषकर सोना अथवा सोने की कच्ची धातु, सूचित कर सकता है। ओपीर के समानांतर होने के कारण मुख्य पाठ में ‘सोना’ स्पष्ट और उपयुक्त है; स्रोत में निहित न होने के कारण ‘अपना’ नहीं जोड़ा गया।
- source_word: וּבְצוּר נְחָלִים
  choice: बरसाती नालों के पत्थरों के बीच
  rationale: צוּר ‘चट्टान/पत्थर’ और נְחָלִים मौसमी जलधाराओं या उनके पथों को दर्शाता है। ‘पत्थरों के बीच’ उस पथरीले स्थान की काव्यात्मक छवि को सहज हिंदी में रखता है।
- source_word: אוֹפִיר
  choice: ओपीर के सोने को
  rationale: ओपीर उत्तम सोने के लिए प्रसिद्ध स्थान था। इब्रानी में केवल स्थान-नाम है, पर בָּצֶר के साथ समानांतरता से ‘ओपीर का सोना’ अभिप्रेत है।
theological_decisions:
- issue: क्या यह धन सुरक्षित रखने या उसका भरोसा छोड़ने की आज्ञा है
  choice: धन को धूल और नालों के पत्थरों में रख देने, अर्थात उस पर निर्भरता छोड़ने, की छवि
  alternative: प्राकृतिक स्थानों में सोना सुरक्षित जमा करने की आज्ञा
  rationale: पद 24–25 के प्रवाह में पार्थिव बहुमूल्य धातु के स्थान पर सर्वशक्तिमान को अपना बहुमूल्य धन मानने की बात है। फिर भी अनुवाद व्याख्यात्मक ‘फेंक दे’ न कहकर स्रोत के ‘रख दे’ को बनाए रखता है, जिससे काव्यात्मक तनाव सुरक्षित रहता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। वाक्यक्रम हिंदी की सहजता के लिए क्रिया को अंत में रखता है। ‘वाडी’ जैसा अपरिचित उधार-शब्द लेने के बजाय ‘बरसाती नाले’ चुना गया है।
