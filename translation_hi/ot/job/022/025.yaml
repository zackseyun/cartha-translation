translation:
  language: hi
  text: तब सर्वशक्तिमान तुम्हारा सोना होगा, और वह तुम्हारे लिए उत्तम चाँदी होगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה
  choice: तब ... होगा
  rationale: संदर्भ में यह अय्यूब के लौट आने पर होने वाले परिणाम को व्यक्त करता है; इसलिए केवल ‘और’ की अपेक्षा ‘तब’ अधिक स्वाभाविक है।
- source_word: שַׁדַּי
  choice: सर्वशक्तिमान
  rationale: अय्यूब में प्रयुक्त इस प्रचलित ईश्वरीय उपाधि का अर्थानुवाद आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: בְּצָרֶיךָ
  choice: तुम्हारा सोना
  rationale: दुर्लभ संज्ञा बहुमूल्य धातु, अयस्क, धन अथवा सुरक्षा का बोध करा सकती है; ‘चाँदी’ के समानांतर यहाँ ‘सोना’ मुख्य पाठ में सबसे स्वाभाविक है।
- source_word: וְכֶסֶף
  choice: और ... चाँदी
  rationale: दूसरी काव्य-पंक्ति में पहले खंड की क्रिया ‘होगा’ निहित है; समन्वय और काव्य-समानांतरता बनाए रखी गई है।
- source_word: תּוֹעָפוֹת
  choice: उत्तम
  rationale: यह दुर्लभ और कठिन शब्द श्रेष्ठता, प्रचुरता या ऊँचाई का संकेत दे सकता है; ‘उत्तम’ गुणवत्ता का संभावित भाव रखता है, जबकि अनिश्चितता पाद-टिप्पणी में स्पष्ट की गई है।
- source_word: לָךְ
  choice: तुम्हारे लिए
  rationale: लाभ अथवा संबंध सूचक भाव को स्पष्ट रूप से रखते हुए यह आधुनिक हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: एलीपज के कथन में प्रतिज्ञा का आशय
  choice: मुख्य पाठ में सर्वशक्तिमान स्वयं अय्यूब का सच्चा धन—सोना और चाँदी—होगा।
  alternative: अर्थ यह भी हो सकता है कि सर्वशक्तिमान अय्यूब को बहुत सोना-चाँदी देगा।
  rationale: इब्रानी वाक्य-विन्यास दोनों संभावनाएँ खुली रखता है। मुख्य पाठ प्रबल रूपक को बनाए रखता है, पर भौतिक समृद्धि वाली व्याख्या को पाद-टिप्पणी में सुरक्षित रखकर धर्मवैचारिक तनाव को अनावश्यक रूप से नहीं सुलझाता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण काव्यात्मक गद्य। ‘सर्वशक्तिमान’ प्रचलित धार्मिक उपाधि है; कठिन इब्रानी शब्दों की वास्तविक अनिश्चितता पाद-टिप्पणी में सुरक्षित है।
