  naturalness: The draft is generally clear and uses an appropriate dignified second-person singular register. Replacing ‘वह तेरी सुनेगा’ with the standard prayer-context expression ‘वह तेरी प्रार्थना सुनेगा’ improves fluency and avoids an elliptical, potentially colloquial reading.
  terminology: ‘प्रार्थना,’ ‘मन्नतें,’ and ‘पूरी करेगा’ are suitable modern Hindi renderings. The footnote correctly preserves the more literal payment idiom (‘चुकाएगा’).
