  yaml_path: translation/ot/job/022/027.yaml
  text: You will pray to him[a], and he will hear you, and you will fulfill your vows.
translation:
  language: hi
  text: तू उससे प्रार्थना करेगा, और वह तेरी प्रार्थना सुनेगा; और तू अपनी मन्नतें पूरी करेगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, ‘तू अपनी मन्नतें चुकाएगा।’
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּעְתִּיר
  choice: तू प्रार्थना करेगा
  rationale: हिफ़ील रूप यहाँ मन लगाकर विनती करने या प्रार्थना करने का भाव देता है। परमेश्वर के सुनने वाली समानांतर पंक्ति के साथ ‘प्रार्थना करेगा’ स्वाभाविक और अर्थनिष्ठ है।
- source_word: אֵלָיו
  choice: उससे
  rationale: इब्रानी में शाब्दिक अर्थ ‘उसकी ओर/उससे’ है। निकटवर्ती संदर्भ में इसका पूर्वपद परमेश्वर है, इसलिए अनावश्यक रूप से ‘परमेश्वर’ दोहराने के बजाय सर्वनाम रखा गया है।
- source_word: וְיִשְׁמָעֶךָּ
  choice: और वह तेरी सुनेगा
  rationale: שׁמע का सीधा अर्थ ‘सुनना’ है। प्रार्थना के संदर्भ में यह अनुकूल ध्यान का संकेत दे सकता है, पर ‘उत्तर देगा’ कहना मूल से अधिक स्पष्ट अर्थ जोड़ देता।
- source_word: וּנְדָרֶיךָ
  choice: और तू अपनी मन्नतें
  rationale: נֶדֶר परमेश्वर से की गई प्रतिज्ञा या मन्नत को दर्शाता है। आधुनिक सामान्य हिन्दी में ‘मन्नतें’ इस धार्मिक संदर्भ को सहज रूप से व्यक्त करता है।
- source_word: תְשַׁלֵּם
  choice: पूरी करेगा
  rationale: שלם का पिएल रूप मन्नतों के साथ उन्हें चुकाने, निभाने या पूरा करने का मुहावरा है। ‘पूरी करेगा’ आधुनिक हिन्दी में आशय स्पष्ट करता है, जबकि अधिक शाब्दिक ‘चुकाएगा’ को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: अंतिम उपवाक्य को अधिक शाब्दिक ‘मन्नतें चुकाएगा’ या मुहावरेदार ‘मन्नतें पूरी करेगा’ के रूप में देना
  choice: अपनी मन्नतें पूरी करेगा
  alternative: अपनी मन्नतें चुकाएगा
  rationale: इब्रानी मुहावरे का आशय परमेश्वर से की गई मन्नत को निभाना है। ‘पूरी करेगा’ आधुनिक पाठक के लिए स्पष्ट है और धार्मिक दायित्व को कम नहीं करता; पादटिप्पणी शाब्दिक रूप को भी दर्शाती है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। अय्यूब से एकवचन संबोधन के अनुरूप ‘तू/तेरी’ रखा गया है। वाक्य की भविष्यकालीन संरचना और परमेश्वर के सुनने संबंधी मूल पाठ की अर्थगत गुंजाइश सुरक्षित रखी गई है।
