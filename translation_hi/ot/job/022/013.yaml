  yaml_path: translation/ot/job/022/013.yaml
  text: Yet you say[b][a], ‘What does God know? Can he judge through thick darkness?’
translation:
  language: hi
  text: फिर भी तू कहता है, “परमेश्वर क्या जानता है? क्या वह घोर अंधकार[b] के बीच से न्याय कर सकता है?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या वह घोर अंधकार के बीच से न्याय करता है?” इब्रानी अपूर्ण क्रिया को साधारण वर्तमान या भविष्य के रूप में भी समझा जा सकता है; आलंकारिक प्रश्न में सामर्थ्य का भाव भी निहित हो सकता है।
    reason: alternative_reading
  - marker: b
    text: “घोर अंधकार” का अनुवाद “काला बादल” या “घना धुंधलका” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: फिर भी तू कहता है
  rationale: संयोजक के प्रसंगगत विरोधसूचक भाव और प्रत्यक्ष आरोप को स्वाभाविक हिन्दी में व्यक्त करता है; इब्रानी पूर्णकाल यहाँ वक्ता के कथित रवैये को वर्तमान कथन के रूप में सामने रखता है।
- source_word: מַה
  choice: क्या
  rationale: 'प्रश्नवाचक सर्वनाम कथित चुनौती की विषय-वस्तु आरम्भ करता है: परमेश्वर क्या जानता है?'
- source_word: יָדַע
  choice: जानता है
  rationale: यहाँ क्रिया ज्ञान या बोध को व्यक्त करती है और उद्धृत प्रश्न में सामान्य वर्तमान हिन्दी स्वाभाविक है।
- source_word: אֵל
  choice: परमेश्वर
  rationale: ईश्वर के लिए प्रयुक्त सामान्य उपाधि को आधुनिक मानक हिन्दी में स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: הַבְעַד
  choice: के पार से
  rationale: पूर्वसर्ग बीच में उपस्थित अवरोध या आवरण का भाव देता है; यह रूप उस कल्पना को बनाए रखता है कि घोर अंधकार परमेश्वर और मानव संसार के बीच है।
- source_word: עֲרָפֶל
  choice: घोर अंधकार
  rationale: शब्द घने बादल, धुंधलके या सघन अंधकार का बिंब देता है; ‘घोर अंधकार’ उसकी तीव्रता और अस्पष्टता बनाए रखता है।
- source_word: יִשְׁפּוֹט
  choice: क्या वह ... न्याय कर सकता है?
  rationale: अपूर्ण क्रिया के इस आलंकारिक प्रश्न में सामर्थ्य पर संदेह निहित हो सकता है; हिन्दी में ‘कर सकता है’ उस बल को स्वाभाविक रूप से व्यक्त करता है, जबकि वैकल्पिक साधारण वर्तमान को पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: दूसरे प्रश्न में सामर्थ्य का भाव व्यक्त किया जाए या साधारण वर्तमान/भविष्य का
  choice: क्या वह घोर अंधकार के पार से न्याय कर सकता है?
  alternative: क्या वह घोर अंधकार के पार से न्याय करता है? / क्या वह ... न्याय करेगा?
  rationale: प्रसंग में एलीपज अनीश्वरभक्तिपूर्ण धारणा को उद्धृत कर रहा है कि बीच का अंधकार परमेश्वर की मानवीय मामलों पर दृष्टि और न्याय में बाधा डालता है। सामर्थ्यसूचक हिन्दी इस आलंकारिक संशय को व्यक्त करती है, पर इब्रानी अपूर्ण क्रिया की वास्तविक व्याकरणिक अस्पष्टता पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, प्रत्यक्ष और सामान्य पाठक के लिए सुबोध रूप। अय्यूब को संबोधित एकवचन निकट/प्रखर ‘तू’ प्रसंग की आरोपात्मक तीव्रता बनाए रखता है। पादटिप्पणी-चिह्न सम्बद्ध वाक्यांश और उद्धरण के अंत में रखे गए हैं।
