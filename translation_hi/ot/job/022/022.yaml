  text: קַח נָ֣א מִ/פִּ֣י/ו תּוֹרָ֑ה וְ/שִׂ֥ים אֲ֝מָרָ֗י/ו בִּ/לְבָבֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/022.yaml
  text: Please[a], receive instruction from his mouth, and lay up his words in your heart.
translation:
  language: hi
  text: 'कृपा करके उसके मुख से शिक्षा[a] ग्रहण कर,

    और उसके वचनों को अपने हृदय में रख ले।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या ‘व्यवस्था’ अथवा ‘उपदेश’; इब्रानी: तोराह।'
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח
  choice: ग्रहण कर
  rationale: לקח का मूल अर्थ ‘लेना’ है, पर शिक्षा के साथ ‘ग्रहण करना’ स्वाभाविक रूप से उसे स्वीकार करने का भाव व्यक्त करता है।
- source_word: נָא
  choice: कृपा करके
  rationale: यह निपात यहाँ समयसूचक ‘अब’ के बजाय विनती और आग्रह का भाव जोड़ता है।
- source_word: מִפִּיו
  choice: उसके मुख से
  rationale: मूल पाठ में ‘उसके मुख से’ का सजीव वाक्यांश स्पष्ट है; इसे केवल ‘उससे’ कहकर सपाट नहीं किया गया।
- source_word: תּוֹרָה
  choice: शिक्षा
  rationale: अय्यूब के ज्ञान-साहित्यिक संदर्भ में यह अधिकारपूर्ण शिक्षा या निर्देश को दर्शाता है, न कि अनिवार्य रूप से मूसा की व्यवस्था को।
- source_word: וְשִׂים
  choice: रख ले
  rationale: हृदय में शब्दों को रखने का रूपक मूल के निकट रहते हुए आधुनिक हिन्दी में स्वाभाविक है और मन में संजोने का भाव देता है।
- source_word: אֲמָרָיו
  choice: उसके वचनों
  rationale: ‘वचन’ यहाँ कथनों की गंभीरता बनाए रखता है और हिन्दी बाइबलीय शैली में सहज है।
- source_word: בִּלְבָבֶךָ
  choice: अपने हृदय में
  rationale: हृदय को विचार और इच्छा के भीतरी केंद्र के रूप में प्रस्तुत करने वाला इब्रानी मुहावरा हिन्दी में भी अर्थपूर्ण है।
theological_decisions:
- issue: ज्ञान-साहित्यिक भाषण में תּוֹרָה का अर्थ
  choice: शिक्षा
  alternative: व्यवस्था; उपदेश
  rationale: ‘शिक्षा’ इस प्रसंग में अधिकारपूर्ण मार्गदर्शन का अर्थ सुरक्षित रखती है, पर पाठ में विशेष रूप से मूसा की व्यवस्था का संकेत मानकर अर्थ को संकीर्ण नहीं करती।
- issue: तीसरे पुरुष के संदर्भ की पहचान
  choice: उसके
  alternative: परमेश्वर के; उसके (आदरार्थी क्रिया-संगति के साथ)
  rationale: इब्रानी पाठ केवल तीसरे पुरुष एकवचन सर्वनाम देता है। ‘उसके’ संदर्भ की वास्तविक अस्पष्टता को बनाए रखता है और व्याख्यात्मक नाम नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। एकवचन अनौपचारिक आज्ञार्थ ‘कर/रख ले’ मूल इब्रानी के सीधे संबोधन को दर्शाता है; ‘मुख’, ‘वचन’ और ‘हृदय’ मूल के रूपकों तथा बाइबलीय गरिमा को सुरक्षित रखते हैं।
