  text: הַ/לְ/אֵ֥ל יִסְכָּן גָּ֑בֶר כִּֽי יִסְכֹּ֖ן עָלֵ֣י/מוֹ מַשְׂכִּֽיל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/002.yaml
  text: Can a man be of use to God? Surely he who is wise is of use to himself[a].
translation:
  language: hi
  text: क्या कोई मनुष्य परमेश्वर को लाभ पहुँचा सकता है? निश्चय ही समझदार मनुष्य अपने ही लाभ के लिए होता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या कोई मनुष्य परमेश्वर के काम आ सकता है? क्योंकि सूझ-बूझ वाला अपने ही काम आता है।”
    reason: סכן के ‘उपयोगी होना’ और כִּי के व्याख्यात्मक ‘क्योंकि’ अर्थ को दर्शाने वाला वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: הַלְאֵל
  choice: क्या ... परमेश्वर को ...?
  rationale: प्रश्नवाचक הֲ और לְאֵל मिलकर परमेश्वर को लाभ पहुँचाने की मानवीय क्षमता पर आलंकारिक प्रश्न बनाते हैं। हिंदी में ‘परमेश्वर को’ स्वाभाविक अप्रत्यक्ष कर्म है।
- source_word: יִסְכָּן / יִסְכֹּן
  choice: लाभ पहुँचा सकता है / लाभ पहुँचाता है
  rationale: यहाँ סכן उपयोगी या लाभकारी होने का भाव देता है। दोनों प्रयोगों में ‘लाभ’ रखने से इब्रानी समानांतरता बनी रहती है और अनावश्यक व्यापारिक अर्थ से बचते हुए आशय स्पष्ट होता है।
- source_word: גָּבֶר
  choice: कोई मनुष्य
  rationale: पुल्लिंग एकवचन संज्ञा यहाँ सामान्य रूप से मानव व्यक्ति को दर्शाती है। ‘कोई मनुष्य’ आलंकारिक प्रश्न में स्वाभाविक और व्यापक है।
- source_word: כִּי
  choice: निश्चय ही
  rationale: यह दूसरे खंड को व्याख्यात्मक अथवा बलदायक ढंग से प्रस्तुत करता है। ‘निश्चय ही’ कथन के बल और पहले प्रश्न से उसके विरोधात्मक संबंध को सहज हिंदी में व्यक्त करता है।
- source_word: עָלֵימוֹ
  choice: स्वयं को
  rationale: इस प्रसंग में על और प्रत्यय से लाभ उसी समझदार व्यक्ति को मिलने का भाव निकलता है। ‘स्वयं को’ इस आत्मसंबंधी अर्थ को संक्षेप में व्यक्त करता है।
- source_word: מַשְׂכִּיל
  choice: समझदार मनुष्य
  rationale: שכל का यह कर्तृवाचक रूप अंतर्दृष्टि रखने या बुद्धिमानी से काम करने वाले व्यक्ति को दर्शाता है। ‘समझदार मनुष्य’ आधुनिक हिंदी में स्पष्ट और गरिमापूर्ण है।
theological_decisions:
- issue: क्या मनुष्य परमेश्वर को कोई लाभ पहुँचा सकता है
  choice: पद को ऐसे आलंकारिक प्रश्न के रूप में रखा गया है जिसका अपेक्षित उत्तर ‘नहीं’ है; समझदारी का लाभ स्वयं मनुष्य को मिलता है।
  alternative: दूसरे खंड को केवल सामान्य कथन—‘समझदार व्यक्ति अपने लिए लाभकारी होता है’—के रूप में पढ़ा जा सकता है, बिना पहले खंड के साथ प्रबल विरोध पर बल दिए।
  rationale: इब्रानी समानांतरता परमेश्वर को मिलने वाले कथित लाभ और समझदार व्यक्ति को स्वयं मिलने वाले लाभ को आमने-सामने रखती है। अनुवाद इससे आगे कोई व्यापक सिद्धांत नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, सहज किंतु गरिमापूर्ण रखी गई है। ‘लाभ पहुँचाना’ दोनों खंडों की शब्दगत समानांतरता बचाता है; फुटनोट ‘काम आना’ वाला अधिक मुहावरेदार विकल्प देता है।
