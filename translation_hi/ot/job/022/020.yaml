base_translation:
  language: en
  yaml_path: translation/ot/job/022/020.yaml
  text: Surely our adversaries have been cut off[b][a], and fire has consumed what was left of them.
translation:
  language: hi
  text: निश्चय ही हमारे विरोधी मिटा दिए गए हैं[a], और उनका बचा हुआ भाग[b] आग ने भस्म कर दिया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी קִימָנוּ कठिन है। इसका अर्थ यहाँ ‘हमारे विरोधी’ लिया गया है; सम्भवतः इसका अर्थ ‘हमारी सम्पत्ति’ भी हो सकता है।
    reason: alternative_reading
  - marker: b
    text: या ‘उनका शेष’।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא
  choice: निश्चय ही
  rationale: यहाँ यह पदबंध वास्तविक शर्त नहीं, बल्कि दृढ़ कथन व्यक्त करता है; ‘निश्चय ही’ उसके बल को स्वाभाविक हिन्दी में रखता है।
- source_word: נִכְחַד
  choice: मिटा दिए गए हैं
  rationale: निफ़अल रूप नष्ट या समाप्त कर दिए जाने की निष्क्रिय, परिणामसूचक भावना व्यक्त करता है।
- source_word: קִימָנוּ
  choice: हमारे विरोधी
  rationale: इब्रानी रूप कठिन और बहुअर्थी है। संदर्भ में इसे ‘हमारे विरुद्ध उठनेवाले’, अर्थात ‘हमारे विरोधी’, समझना अगले उपवाक्य के अनुरूप है; अन्य सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: וְיִתְרָם
  choice: उनका बचा हुआ भाग
  rationale: יֶתֶר उस चीज़ को सूचित करता है जो शेष रह गई हो; प्रत्यय उसी नष्ट किए गए समूह की ओर संकेत करता है।
- source_word: אָכְלָה אֵשׁ
  choice: आग ने भस्म कर दिया है
  rationale: आग के विषय में אכל पूर्ण विनाशकारी उपभोग का चित्र देता है; ‘भस्म कर दिया’ हिन्दी में इस बिंब को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
