  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली रखी गई है। कठिन इब्रानी पद קִימָנוּ की वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है; अग्नि के विनाशकारी बिंब के लिए ‘भस्म’ चुना गया है।
