  text: הַסְכֶּן נָ֣א עִמּ֑/וֹ וּ/שְׁלם בָּ֝/הֶ֗ם תְּֽבוֹאַתְ/ךָ֥ טוֹבָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/021.yaml
  text: Come to terms with him, please, and be at peace; by this good will come to you.
translation:
  language: hi
  text: कृपया उससे मेल कर और शान्ति से रह; इन्हीं बातों से[a] तेरा भला होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल भाषा में यहाँ शाब्दिक रूप से “इनके द्वारा/इनसे” है; सम्भवतः यह मेल करने और शान्ति से रहने, दोनों की ओर संकेत करता है।
    reason: असामान्य बहुवचन सर्वनाम בָהֶם की वास्तविक व्याकरणिक विशेषता और उसके संभावित संदर्भ को सुरक्षित रखना।
lexical_decisions:
- source_word: הַסְכֶּן
  choice: मेल कर
  rationale: यह क्रिया यहाँ किसी के साथ परिचित/सहमत होकर अच्छे संबंध में आने का भाव रखती है। आधुनिक हिन्दी में “उससे मेल कर” इस संबंधपरक आग्रह को स्वाभाविक और संक्षिप्त रूप से व्यक्त करता है।
- source_word: וּשְׁלם
  choice: और शान्ति से रह
  rationale: आज्ञार्थक रूप का अर्थ शान्ति में होना या शान्तिपूर्ण संबंध रखना है; यह अनुवाद बिना अनावश्यक रूप से यह तय किए कि शान्ति केवल आन्तरिक है या संबंधपरक, दोनों भावों को खुला रखता है।
- source_word: תְּבוֹאַתְךָ טוֹבָה
  choice: तेरा भला होगा
  rationale: शाब्दिक भाव “तेरे पास भलाई आएगी” है। हिन्दी में “तेरा भला होगा” परिणाम को सहज ढंग से व्यक्त करता है और ‘טוֹבָה’ को संज्ञात्मक भलाई/कल्याण के अर्थ में रखता है।
theological_decisions:
- issue: वक्ता के परामर्श और परमेश्वर की स्वीकृति में भेद
  choice: पद को एलीपज के दावे/परामर्श के रूप में सीधा रखा गया है
  alternative: इसे सार्वकालिक ईश्वरीय प्रतिज्ञा की तरह अधिक दृढ़ भाषा में प्रस्तुत करना
  rationale: अय्यूब 22 में ये शब्द एलीपज बोलता है। अनुवाद को उसके कथन को ईश्वरीय अनुमोदन प्राप्त सिद्धान्त के रूप में बढ़ाकर प्रस्तुत नहीं करना चाहिए।
- issue: בָהֶם के बहुवचन संकेत का संदर्भ
  choice: “इन्हीं बातों से” द्वारा पिछले दोनों आग्रहों की ओर संकेत
  alternative: एकवचन भाव में “इससे” या सीधे “उसके द्वारा”
  rationale: मसोराई पाठ में सर्वनाम बहुवचन है। “इन्हीं बातों से” मेल करने और शान्ति से रहने—दोनों पूर्ववर्ती आग्रहों—को संभावित संदर्भ मानते हुए बहुवचन को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। “कृपया” נא के विनम्र आग्रह को दर्शाता है; एकवचन “तेरा” मूल पाठ के संबोधन के अनुरूप है।
