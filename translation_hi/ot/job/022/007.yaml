  text: You gave no water to the weary to drink[a], and from the hungry you withheld bread.
translation:
  language: hi
  text: तूने थके हुए को पीने के लिए पानी नहीं दिया, और भूखे को रोटी[a] से वंचित रखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘रोटी’ शब्द व्यापक अर्थ में ‘भोजन’ को भी दर्शा सकता है; मुख्य पाठ में स्रोत का ठोस शब्द रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא
  choice: नहीं
  rationale: यह पहले आरोप का सीधा निषेध है; हिन्दी में क्रिया के साथ ‘नहीं’ स्वाभाविक है।
- source_word: מַיִם
  choice: पानी
  rationale: सामान्य आधुनिक हिन्दी में מַיִם का स्वाभाविक अर्थ ‘पानी’ है।
- source_word: עָיֵף
  choice: थके हुए
  rationale: विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है और किसी भी थके-माँदे व्यक्ति को सामान्य रूप से दर्शाता है।
- source_word: תַּשְׁקֶה
  choice: पीने के लिए ... दिया
  rationale: שׁקה के हिफ़ील रूप का अर्थ किसी को पिलाना या पीने के लिए देना है; यह अभिव्यक्ति हिन्दी में सहज रहते हुए कारक अर्थ बनाए रखती है।
- source_word: וּמֵרָעֵב
  choice: और भूखे से
  rationale: מִן का ‘से’ और संज्ञावत् विशेषण רָעֵב का ‘भूखे’ अनुवाद स्रोत की संरचना और सामान्य प्रतिनिधिक अर्थ को बनाए रखता है।
- source_word: תִּמְנַע
  choice: रोक रखी
  rationale: מנע का अर्थ रोकना या वंचित रखना है; ‘रोक रखी’ जरूरतमंद को वस्तु न देने के आरोप को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לָחֶם
  choice: रोटी
  rationale: शाब्दिक ठोस अर्थ ‘रोटी’ रखा गया है, यद्यपि प्रसंग में यह व्यापक रूप से भोजन को भी सूचित कर सकता है।
