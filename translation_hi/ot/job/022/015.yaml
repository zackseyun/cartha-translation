lexical_decisions:
- source_word: הָאֹרַח
  choice: मार्ग
  rationale: אֹרַח किसी रास्ते या जीवन-पद्धति को दर्शाता है। ‘मार्ग’ ठोस रूपक और नैतिक अर्थ दोनों को स्वाभाविक, गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: עוֹלָם
  choice: पुराने
  rationale: यहाँ עוֹלָם का आशय बहुत पहले से चले आ रहे मार्ग से है, अनन्त मार्ग से नहीं। ‘पुराने’ सामान्य पाठक के लिए स्पष्ट है और सन्दर्भ के अनुकूल है।
- source_word: תִּשְׁמֹר
  choice: चलते रहोगे
  rationale: שׁמר का मूल अर्थ रखना, सँभालना या पालन करना है; ‘मार्ग’ के साथ इसका भाव किसी चाल-चलन पर कायम रहने का है। ‘चलते रहोगे’ प्रश्न की चेतावनी और मार्ग-रूपक दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֲשֶׁר
  choice: जिस पर
  rationale: सम्बन्धवाचक उपवाक्य को ‘मार्ग’ से जोड़ने के लिए हिन्दी में ‘जिस पर’ स्वाभाविक है।
- source_word: דָּרְכוּ
  choice: चले थे
  rationale: דרך का अर्थ पाँव रखकर चलना या मार्ग पर चलना है। ‘चले थे’ मार्ग के ठोस रूपक को बनाए रखता है और अतीत की क्रिया को स्पष्ट करता है।
- source_word: מְתֵי אָוֶן
  choice: दुष्ट लोग
  rationale: מְתֵי का अर्थ लोग/मनुष्य और אָוֶן का यहाँ नैतिक भाव दुष्टता या अधर्म है। ‘दुष्ट लोग’ आधुनिक हिन्दी में संक्षिप्त, स्पष्ट और स्वाभाविक है।
