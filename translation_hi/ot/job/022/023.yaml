  yaml_path: translation/ot/job/022/023.yaml
  text: If you return to the Almighty[a], you will be restored; if you put unrighteousness far from your tent[b],
translation:
  language: hi
  text: यदि तुम सर्वशक्तिमान की ओर लौट आओ, तो तुम फिर से स्थापित हो जाओगे[a]; तुम अपने डेरे से अन्याय[b] को दूर कर दोगे,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘तुम बनाए जाओगे’ या ‘तुम्हें खड़ा किया जाएगा।’ यहाँ निर्माण का रूपक पुनःस्थापना या फिर से स्थिर किए जाने के अर्थ में है।
    reason: lexical_alternative
  - marker: b
    text: या ‘अधर्म’, ‘गलत काम’, या ‘अन्यायपूर्णता।’
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: यदि
  rationale: यह शर्तसूचक अव्यय है; ‘यदि’ आधुनिक मानक हिन्दी में शर्त को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: תָּשׁוּב
  choice: तुम ... लौटो
  rationale: שוב का मूल अर्थ ‘लौटना/वापस मुड़ना’ है। ‘लौटो’ मूल बिंब और धार्मिक अर्थ की खुली संभावना बनाए रखता है; इसे सीधे ‘मन फिराओ’ कहना अपेक्षा से अधिक व्याख्यात्मक होता।
- source_word: עַד
  choice: की ओर
  rationale: שוב के साथ यह सर्वशक्तिमान की दिशा में लौटने को व्यक्त करता है। हिन्दी में ‘की ओर लौटो’ स्वाभाविक है और अभिमुखता को बनाए रखता है।
- source_word: שַׁדַּי
  choice: सर्वशक्तिमान
  rationale: ईश्वरीय उपाधि का प्रचलित और अर्थपूर्ण हिन्दी अनुवाद; लिप्यंतरण ‘शद्दाय’ की अपेक्षा सामान्य पाठक के लिए अधिक स्पष्ट।
- source_word: תִּבָּנֶה
  choice: तुम्हें फिर से स्थापित किया जाएगा
  rationale: בנה के निफ़ाल रूप का शाब्दिक अर्थ ‘बनाया/फिर बनाया जाना’ है। प्रसंग में यह पुनःस्थापना का रूपक है; चुना गया पाठ निष्क्रिय भाव और पुनर्स्थापन के आशय दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: תַּרְחִיק
  choice: तुम ... दूर कर दो
  rationale: רחק का हिफ़ील रूप किसी वस्तु को दूर करने का कारणात्मक भाव देता है। ‘दूर कर दो’ इसे स्पष्ट और सहज ढंग से व्यक्त करता है।
- source_word: עַוְלָה
  choice: अन्याय
  rationale: यह संज्ञा अन्याय, गलत काम या अधर्म को सूचित कर सकती है। ‘अन्याय’ उसका प्रमुख नैतिक अर्थ रखता है, जबकि अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: מֵאָהֳלֶךָ
  choice: अपने डेरे से
  rationale: मूल पाठ के ‘तेरे डेरे से’ बिंब को बनाए रखता है; इसे व्याख्यात्मक रूप से ‘घराने’ या ‘निवास’ नहीं बनाया गया।
theological_decisions:
- issue: पुनःस्थापना के निर्माण-रूपक को शाब्दिक या अर्थानुसार प्रस्तुत करना
  choice: तुम्हें फिर से स्थापित किया जाएगा
  alternative: तुम्हें बनाया जाएगा / तुम्हें फिर से बनाया जाएगा
  rationale: मूल निष्क्रिय क्रिया का शाब्दिक बिंब ‘बनाया जाना’ है, पर यहाँ व्यक्ति के फिर से स्थिर या बहाल होने का आशय है। मुख्य पाठ स्वाभाविक हिन्दी में आशय देता है और पादटिप्पणी मूल रूपक को सुरक्षित रखती है।
- issue: שוב को ‘लौटना’ या ‘मन फिराना’ कहना
  choice: लौटो
  alternative: मन फिराओ / वापस मुड़ो
  rationale: ‘लौटना’ क्रिया के मूल स्थानिक और संबंधपरक अर्थ को बनाए रखता है तथा पश्चात्ताप के निहितार्थ को अनावश्यक रूप से संकीर्ण या स्पष्ट नहीं करता।
- issue: תַּרְחִיק को दूसरी शर्त के रूप में पढ़ना या परिणाम/आदेश के रूप में
  choice: यदि तुम ... दूर कर दो
  alternative: तुम ... दूर कर दोगे / ... दूर कर दो
  rationale: इब्रानी अपूर्ण क्रिया का संबंध पूर्ववर्ती शर्त से विभिन्न प्रकार से समझा जा सकता है। प्रसंग और परामर्श-पाठ के अनुसार इसे दूसरी शर्त के रूप में रखना स्वाभाविक है, पर मूल में पृथक ‘यदि’ नहीं है; इसलिए वैकल्पिक वाक्य-संबंध को पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण संबोधन रखा गया है। ‘डेरे’ से प्राचीन तंबू का सांस्कृतिक बिंब सुरक्षित रहता है। वचन के आगे जारी रहने का संकेत देने के लिए अंत में अल्पविराम रखा गया है।
