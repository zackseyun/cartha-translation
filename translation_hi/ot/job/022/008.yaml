- source_word: לוֹ הָאָרֶץ
  choice: देश ... का था
  rationale: लामेद के साथ सर्वनाम यहाँ अधिकार या नियंत्रण व्यक्त करता है; यह रूप मूल की संक्षिप्त संरचना को स्वाभाविक हिन्दी में रखता है।
- source_word: וּנְשׂוּא פָנִים
  choice: प्रतिष्ठित मनुष्य
  rationale: शाब्दिक अभिव्यक्ति ‘जिसका मुख उठाया गया’ सम्मान, अनुग्रह या पक्षपात पाए व्यक्ति को सूचित कर सकती है। ‘प्रतिष्ठित’ सामाजिक विशेषाधिकार का भाव देता है, जबकि अन्य सम्भावनाएँ पाद-टिप्पणी में सुरक्षित हैं।
- source_word: יֵשֶׁב בָּהּ
  choice: उसमें रहता था
