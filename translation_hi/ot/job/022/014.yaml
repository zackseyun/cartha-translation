source:
  edition: WLC
  text: עָבִ֣ים סֵֽתֶר ל֭/וֹ וְ/לֹ֣א יִרְאֶ֑ה וְ/ח֥וּג שָׁ֝מַ֗יִם יִתְהַלָּֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/014.yaml
  text: Clouds are a covering for him[a], so that he does not see; and he walks on the vault of heaven.
translation:
  language: hi
  text: बादल उसके लिए ओट हैं[a], इसलिए वह नहीं देखता; और वह आकाश-मंडल पर चलता-फिरता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “घने बादल उसके लिए ओट हैं, और वह नहीं देखता; वह आकाश के घेरे पर चलता-फिरता है।”
    reason: यह विकल्प עָבִים में ‘घने’ का संभावित भाव, וְלֹא יִרְאֶה का समन्वयी संबंध, और חוּג का अधिक शाब्दिक ‘घेरा’ सुरक्षित रखता है।
lexical_decisions:
- source_word: עָבִים
  choice: बादल
  rationale: बहुवचन संज्ञा बादलों, विशेषकर घने वर्षा-बादलों, को सूचित कर सकती है। मुख्य पाठ में सहज ‘बादल’ रखा गया है; ‘घने बादल’ को पाद-टिप्पणी में विकल्प के रूप में दिया गया है।
- source_word: סֵתֶר
  choice: ओट
  rationale: यह संज्ञा छिपाने वाली आड़, आवरण या छिपने के स्थान का भाव देती है। यहाँ बादलों द्वारा दृष्टि रुकने के ठोस चित्र के लिए ‘ओट’ स्वाभाविक और संक्षिप्त है।
- source_word: לוֹ
  choice: उसके लिए
  rationale: 'लामेद उपसर्ग और तृतीय पुरुष प्रत्यय को सीधे रूप में रखा गया है: बादल उसके संबंध में ओट का काम करते हैं।'
- source_word: וְלֹא יִרְאֶה
  choice: इसलिए वह नहीं देखता
  rationale: वाव से जुड़ा यह खंड साधारण समन्वय (‘और’) या परिणाम का भाव दे सकता है। मुख्य पाठ में प्रसंगानुकूल परिणाम व्यक्त किया गया है, जबकि समन्वयी पाठ पाद-टिप्पणी में सुरक्षित है।
- source_word: חוּג
  choice: मंडल
  rationale: यह शब्द वृत्त, घेरा या मेहराब-जैसे विस्तार को सूचित करता है। ‘आकाश-मंडल’ प्राचीन आकाशीय चित्र को स्वाभाविक हिन्दी में रखता है और किसी अत्यधिक तकनीकी ब्रह्मांड-रचना को निश्चित नहीं करता।
- source_word: שָׁמַיִם
  choice: आकाश
  rationale: इस पदबंध में ‘आकाश’ आधुनिक हिन्दी में सहज है और ऊँचे आकाशीय विस्तार का आशय बनाए रखता है।
- source_word: יִתְהַלָּךְ
  choice: चलता-फिरता है
  rationale: הלך के हित्पएल रूप में इधर-उधर चलने या विचरण करने का भाव है। ‘चलता-फिरता है’ इस पुनरावर्ती या विस्तृत गति को केवल ‘चलता है’ से अधिक स्पष्ट करता है।
theological_decisions:
- issue: वक्ता का दृष्टिकोण और सर्वनाम का निहित कर्ता
  choice: तीसरे पुरुष ‘वह/उसके’ को बनाए रखा गया है और ‘परमेश्वर’ शब्द नहीं जोड़ा गया।
  alternative: इसे परमेश्वर की पारलौकिकता के बारे में स्वतंत्र कथन मानना, या स्पष्टता के लिए ‘परमेश्वर’ जोड़ना।
  rationale: अय्यूब 22:13-14 में एलीपज उस कथन को आगे बढ़ाता है जिसे वह दुष्ट व्यक्ति का परमेश्वर के विषय में दावा बताता है। मूल पाठ का सर्वनाम और प्रसंगगत तनाव बनाए रखने के लिए कर्ता का नाम स्पष्ट रूप से नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘ओट’ ठोस दृश्य को संक्षेप में व्यक्त करता है; ‘आकाश-मंडल’ काव्यात्मक ऊँचाई और मूल की ब्रह्मांडीय छवि बनाए रखता है।
