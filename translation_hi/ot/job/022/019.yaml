  edition: WLC
  text: יִרְא֣וּ צַדִּיקִ֣ים וְ/יִשְׂמָ֑חוּ וְ֝/נָקִ֗י יִלְעַג לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/019.yaml
  text: The righteous see and rejoice[a], and the innocent mock them.
translation:
  language: hi
  text: धर्मी देखेंगे और आनन्दित होंगे, और निर्दोष उनका उपहास करेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִרְאוּ
  choice: देखकर
  rationale: यह ראה का काल रूप है, जिसका अर्थ यहाँ घटित बात को देखना या उसका साक्षी होना है। हिन्दी में कृदन्तीय प्रयोग अगले क्रियापद के साथ स्वाभाविक सम्बन्ध बनाता है।
- source_word: צַדִּיקִים
  choice: धर्मी
  rationale: बहुवचन विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है। ‘धर्मी’ नैतिक श्रेणी को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְיִשְׂמָחוּ
  choice: आनन्दित होंगे
  rationale: שׂמח यहाँ प्रसन्न होने या आनन्द मनाने की प्रतिक्रिया बताता है। भविष्यसूचक प्रसंग में ‘होंगे’ अपूर्ण रूप का उपयुक्त हिन्दी निरूपण है।
- source_word: וְנָקִי
  choice: और निर्दोष
  rationale: एकवचन विशेषण संज्ञा के रूप में सामान्य प्रतिनिधि अर्थ रखता है। ‘निर्दोष’ अपराधरहित व्यक्ति का भाव सुरक्षित रखता है।
- source_word: יִלְעַג
  choice: हँसेगा
  rationale: לעג उपहासपूर्ण हँसी या ठट्ठा करने को दर्शाता है। ‘उन पर हँसेगा’ हिन्दी में लक्ष्य-सूचक לָמוֹ के साथ स्वाभाविक है और तिरस्कार का भाव प्रसंग से स्पष्ट रहता है।
- source_word: לָמוֹ
  choice: उन पर
  rationale: यह बहुवचन सर्वनामिक रूप है, जो प्रसंग में पहले वर्णित दुष्टों की ओर संकेत करता है। לעג के साथ हिन्दी में ‘उन पर’ स्वाभाविक रचना है।
theological_decisions:
- issue: सर्वनाम का प्रसंगगत संकेत
  choice: ‘उन’ को आसपास के पदों में वर्णित दुष्टों की ओर संकेत करने वाला सर्वनाम ही रखा गया है।
  alternative: इसे सामान्य रूप से उन लोगों के लिए समझना जो परमेश्वर के न्याय का सामना करते हैं।
  rationale: तात्कालिक प्रसंग दुष्टों के विनाश की चर्चा करता है, पर मुख्य पाठ में ‘दुष्टों’ जोड़कर सर्वनाम की अस्पष्टता समाप्त नहीं की गई।
- issue: धर्मियों की प्रतिक्रिया का स्वर
  choice: לעג को ‘उन पर हँसेगा’ अनूदित किया गया है।
  alternative: ‘उनका उपहास करेगा’ या ‘उन पर ताना कसेगा’।
  rationale: मूल क्रिया में उपहासपूर्ण हँसी का भाव है। अनुवाद इस कठिन धार्मिक तनाव को बनाए रखता है कि निर्दोष न्याय देखकर विरोधियों पर हँसता है, इसे नरम या सिद्धान्तगत व्याख्या से नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी का संक्षिप्त, गरिमापूर्ण और काव्यात्मक वाक्य। समानान्तरता तथा ‘धर्मी’ के बहुवचन और ‘निर्दोष’ के प्रतिनिधिक एकवचन का अन्तर सुरक्षित रखा गया है।
