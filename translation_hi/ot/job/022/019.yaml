  rationale: The revision retains the source’s number contrast (plural धर्मी; generic singular निर्दोष), its unexpressed contextual pronoun referent, and its coordinated clauses. It replaces potentially neutral ‘हँसेगा’ with ‘उपहास करेगा’ to convey the scorn inherent in לעג.
