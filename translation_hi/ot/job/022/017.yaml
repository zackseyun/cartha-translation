  text: הָ/אֹמְרִ֣ים לָ֭/אֵל ס֣וּר מִמֶּ֑/נּוּ וּ/מַה יִּפְעַ֖ל שַׁדַּ֣י לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/017.yaml
  text: who said to God, ‘Depart from us,’ and, ‘What can the Almighty do to them?’
translation:
  language: hi
  text: जो परमेश्वर से कहते थे, “हमसे दूर हो जा,” और, “सर्वशक्तिमान उनके लिए क्या कर सकता है?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में यहाँ शाब्दिक रूप से “उनके लिए” है; प्रत्यक्ष कथन में पहले आए “हमसे” के बाद यह सर्वनाम-परिवर्तन मूल पाठ में ही है।
    reason: असामान्य सर्वनाम-परिवर्तन को स्पष्ट करना और ‘हमारे लिए’ जैसे संभावित अर्थ-सामंजस्य से अलग स्रोत-पाठ की रचना सुरक्षित रखना।
lexical_decisions:
- source_word: הָאֹמְרִים
  choice: जो … कहते थे
  rationale: बहुवचन कृदन्त को पूर्ववर्ती दुष्ट लोगों की जारी/विशिष्ट वाणी के रूप में स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: סוּר מִמֶּנּוּ
  choice: हमसे दूर हो जा
  rationale: एकवचन आज्ञार्थक क्रिया और ‘हमसे’ के अर्थ को सीधा रखा गया है; संबोधन परमेश्वर से है।
- source_word: שַׁדַּי
  choice: सर्वशक्तिमान
  rationale: अय्यूब में प्रयुक्त ईश्वरीय उपाधि ‘शद्दय’ का प्रचलित और अर्थपूर्ण हिन्दी रूप।
- source_word: וּמַה יִּפְעַל … לָמוֹ
  choice: और … उनके लिए क्या कर सकता है
  rationale: יִפְעַל की सामर्थ्य-सूचक प्रश्नवाचक शक्ति और לָמוֹ के तीसरे पुरुष बहुवचन ‘उनके लिए’ को बनाए रखा गया है।
theological_decisions:
- issue: प्रत्यक्ष कथन में ‘हमसे’ से ‘उनके लिए’ की ओर सर्वनाम-परिवर्तन
  choice: मसोराई पाठ के अनुसार ‘उनके लिए’
  alternative: ‘हमारे लिए’ अथवा ‘हमारा क्या कर सकता है’
  rationale: לָמוֹ व्याकरणतः तीसरे पुरुष बहुवचन है। कथन के भीतर दृष्टिकोण का यह तनाव असामान्य होने पर भी पाठ में सुरक्षित रखा गया है, न कि चुपचाप ‘हम’ में बदला गया।
- issue: שַׁדַּי का अनुवाद
  choice: सर्वशक्तिमान
  alternative: शद्दय
  rationale: सामान्य पाठक के लिए अर्थ स्पष्ट रखते हुए इसे परमेश्वर की उपाधि के रूप में प्रस्तुत किया गया है; किसी संप्रदाय-विशेष की व्याख्या नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और प्रत्यक्ष है। मूल पद की खंड-वाक्यात्मक संरचना बनाए रखी गई है, क्योंकि यह पिछले पदों से जुड़ा संबंधवाचक वाक्यांश है।
