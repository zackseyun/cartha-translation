  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। काव्यात्मक समानांतरता के लिए पद को दो पंक्तियों में रखा गया है। ‘नींव’ का ठोस रूपक और जलप्रलय-संकेत की अनिश्चितता सुरक्षित हैं।
