translation:
  language: hi
  text: 'जो अपने समय से पहले ही छीन लिए गए[a],

    जिनकी नींव को नदी बहा ले गई[b]।[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो अपने समय से पहले ही काट डाले गए।” इब्रानी क्रिया कठिन है और उसमें पकड़ लिए जाने, सिकुड़ जाने या अचानक हटा दिए जाने का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: अधिक शाब्दिक रूप में, “जिनकी नींव पर नदी उँडेल दी गई।” इब्रानी बिंब अत्यन्त संक्षिप्त है; इसका आशय नींव के जल से अभिभूत होकर बह जाने का हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: यह पद विशेष रूप से जलप्रलय में नष्ट हुई पीढ़ी की ओर संकेत कर सकता है, या अधिक सामान्य रूप से दुष्टों के अचानक पतन का वर्णन कर सकता है।
    reason: cross_reference
