- source_word: אֲשֶׁר
  choice: जो
  rationale: यह संबंधवाचक अव्यय पिछले संदर्भ में बताए गए दुष्ट लोगों का वर्णन आगे बढ़ाता है; व्यक्तियों के लिए ‘जो’ स्वाभाविक हिन्दी है।
- source_word: קֻמְּטוּ
  choice: मिटा दिए गए
  rationale: इस कठिन कर्मवाच्य क्रिया में सिकुड़ने, जकड़े जाने या अचानक हटा दिए जाने का भाव हो सकता है। विनाश के संदर्भ में ‘मिटा दिए गए’ अचानक अंत का भाव देता है, पर अधिक विशिष्ट भौतिक बिंब नहीं थोपता।
- source_word: וְלֹא עֵת
  choice: अपने समय से पहले ही
  rationale: शाब्दिक रूप से ‘और समय नहीं’ यहाँ असमय अंत को व्यक्त करता है; यह हिन्दी वाक्यांश उसी अर्थ को सहज रूप में रखता है।
- source_word: נָהָר
  choice: नदी
  rationale: संज्ञा का सामान्य अर्थ ‘नदी’ है। ‘बाढ़’ कहना सम्भावित जलप्रलय-संकेत को व्याख्या के रूप में मुख्य पाठ में ले आता, इसलिए ठोस मूल बिंब रखा गया है।
- source_word: יוּצַק
  choice: बहा ले गई
  rationale: क्रिया का मूल भाव उँडेलने या ढालने का है, किन्तु नदी और नींव के संक्षिप्त बिंब में आशय नींव के जल से अभिभूत होकर बह जाने का है। यह चयन स्वाभाविक हिन्दी में दृश्य को संप्रेषित करता है; अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: יְסוֹדָם
  choice: जिनकी नींव
  rationale: एकवचन संज्ञा पर बहुवचन संबंधसूचक प्रत्यय है। ‘जिनकी नींव’ सामूहिक एकवचन और पतन के रूपक, दोनों को बनाए रखता है।
theological_decisions:
- issue: जल द्वारा न्याय के बिंब की प्रकृति
  choice: असमय नष्ट हुए दुष्टों और नदी से बह गई नींव का बिंब रखा गया है, बिना यह तय किए कि यह किसी विशेष ऐतिहासिक घटना का सीधा उल्लेख है।
  alternative: इसे स्पष्ट रूप से नूह के समय के जलप्रलय की पीढ़ी का उल्लेख मानना, या केवल सामान्य रूपक मानना।
  rationale: संदर्भ पुराने समय के दुष्ट लोगों और जल-विनाश की ओर संकेत कर सकता है, पर इब्रानी पाठ विशेष ऐतिहासिक पहचान को अनिवार्य नहीं करता। इसलिए सम्भावित संकेत और व्यापक अर्थ के बीच तनाव सुरक्षित रखा गया है।
