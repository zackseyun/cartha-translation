lexical_decisions:
- source_word: אַלְמָנוֹת
  choice: विधवाओं
  rationale: यह बहुवचन संज्ञा पति-विहीन स्त्रियों के लिए है; ‘विधवाओं’ से उनकी सामाजिक असुरक्षा भी स्वाभाविक रूप से व्यक्त होती है।
- source_word: שִׁלַּחְתָּ
  choice: लौटा दिया
  rationale: पिएल रूप का अर्थ ‘विदा कर देना/भेज देना’ है। सहायता माँगने आई विधवाओं के संदर्भ में ‘लौटा दिया’ आधुनिक हिन्दी में आरोप की धार को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: רֵיקָם
  choice: खाली हाथ
  rationale: क्रियाविशेषण का अर्थ बिना कुछ पाए या लिए लौटना है; ‘खाली हाथ’ हिन्दी का स्पष्ट और स्वाभाविक समतुल्य है।
- source_word: זְרֹעוֹת
  choice: भुजाएँ
  rationale: मूल ठोस बिंब ‘भुजाएँ’ रखा गया है; इब्रानी में यह सामर्थ्य या शक्ति का भी संकेत दे सकता है।
- source_word: יְתֹמִים
  choice: अनाथों
  rationale: यह पिता-विहीन और इसलिए सामाजिक रूप से असुरक्षित बच्चों को सूचित करता है; ‘अनाथों’ आधुनिक हिन्दी में संक्षिप्त और सुबोध है।
- source_word: יְדֻכָּא
  choice: कुचल दी गईं
  rationale: דכא का निष्क्रिय अर्थ ‘कुचला/तोड़ा जाना’ है। हिन्दी में बहुवचन ‘भुजाएँ’ के साथ स्त्रीलिंग बहुवचन क्रिया स्वाभाविक है।
