translation:
  language: hi
  text: 'इसी कारण तेरे चारों ओर फंदे हैं,

    और अचानक भय तुझे घबरा देता है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל כֵּן
  choice: इसी कारण
  rationale: यह पद पिछले आरोपों से निकलने वाला परिणाम बताता है; ‘इसी कारण’ उस निष्कर्षात्मक संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: סְבִיבוֹתֶיךָ
  choice: तेरे चारों ओर
  rationale: यह अभिव्यक्ति चारों तरफ से घेरे होने का स्थानिक भाव देती है। अय्यूब को एकवचन अनौपचारिक संबोधन के अनुरूप ‘तेरे’ रखा गया है।
- source_word: פַחִים
  choice: फंदे
  rationale: פַחִים ऐसे जाल या फंदों को सूचित करता है जिनमें कोई पकड़ा जाए; काव्यात्मक रूपक के लिए ‘फंदे’ स्पष्ट और स्वाभाविक है।
- source_word: וִיבַהֶלְךָ
  choice: तुझे घबरा देता है
  rationale: בהל का अर्थ भयभीत, व्याकुल या आतंकित कर देना है। ‘घबरा देता है’ क्रिया के कारक और अचानक उत्पन्न व्याकुलता को सहज हिन्दी में बनाए रखता है।
- source_word: פַּחַד
  choice: आतंक
  rationale: यहाँ संज्ञा तीव्र भय या दहशत को व्यक्त करती है; ‘आतंक’ प्रसंग की तीव्रता बनाए रखता है।
- source_word: פִּתְאֹם
  choice: अचानक
  rationale: क्रियाविशेषण का सीधा अर्थ ‘अचानक’ है और यह भय के अकस्मात आ पड़ने को स्पष्ट करता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण काव्यात्मक शैली अपनाई गई है। मूल का प्रत्यक्ष एकवचन संबोधन ‘तेरे/तुझे’ से सुरक्षित रखा गया है। दूसरे चरण में मूल के संज्ञा और क्रिया के निकटार्थी दोहराव को शब्दशः असहज ‘आतंक आतंकित करता है’ बनाने के बजाय ‘आतंक…घबरा देता है’ के रूप में स्वाभाविक रखा गया है।
