  yaml_path: translation/ot/job/013/027.yaml
  text: You put my feet in the stocks[a], and you watch all my paths; you mark out the soles of my feet.
translation:
  language: hi
  text: तू मेरे पैरों को काठ में जकड़ देता है और मेरे सब मार्गों पर नज़र रखता है; तू मेरे पैरों के तलवों के चारों ओर रेखा खींचता है।[क]
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: या, “मेरे पैरों के तलवों को अंकित करता है।” इब्रानी क्रिया में अंकन करने या सीमा-रेखा खींचने की छवि हो सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּסַּד
  choice: काठ में
  rationale: सַד पैरों को स्थिर रखने वाला बंधन-यंत्र है। हिंदी में ‘काठ में जकड़ना’ पुराने दंड-उपकरण की छवि को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: וְתָשֵׂם
  choice: जकड़ देता है
  rationale: शाब्दिक अर्थ ‘रखता है’ है, पर सַד के साथ हिंदी में ‘जकड़ देता है’ बंधन की क्रिया को सहज रूप से व्यक्त करता है।
- source_word: וְתִשְׁמוֹר
  choice: नज़र रखता है
  rationale: שׁמר यहाँ रक्षा करने के बजाय लगातार निगरानी करने के अर्थ में है।
- source_word: כָּל אָרְחוֹתַי
  choice: मेरे सब मार्गों
  rationale: ‘मार्ग’ ठोस पथ की छवि और जीवन-चाल के व्यापक संकेत, दोनों को बनाए रखता है।
- source_word: עַל שָׁרְשֵׁי רַגְלַי
  choice: मेरे पैरों के तलवों के चारों ओर
  rationale: שׁרשי רגלי का आशय पैरों के निचले भाग से है; עַל को חקה के सीमांकन-संबंधी अर्थ के साथ स्वाभाविक हिंदी में ‘चारों ओर’ व्यक्त किया गया है।
- source_word: תִּתְחַקֶּה
  choice: निशान खींचता है
  rationale: חקה का यह रूप अंकित करने, रेखा खींचने या सीमा निर्धारित करने की छवि देता है। ‘निशान खींचता है’ मूल की ठोस किंतु कुछ अस्पष्ट छवि को सुरक्षित रखता है।
