  register: आधुनिक मानक हिंदी; अय्यूब का परमेश्वर से सीधा संबोधन बनाए रखने के लिए एकवचन ‘तू’ का प्रयोग। भाषा गंभीर और काव्यात्मक है, पर सामान्य पाठक के लिए स्पष्ट रखी गई है।
