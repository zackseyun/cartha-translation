  text: הֶן כֹּ֭ל רָאֲתָ֣ה עֵינִ֑/י שָֽׁמְעָ֥ה אָ֝זְנִ֗/י וַ/תָּ֥בֶן לָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/001.yaml
  text: Look[a], my eye has seen all this; my ear has heard and understood it.
translation:
  language: hi
  text: देखो, यह सब मेरी आँख ने देखा है; मेरे कान ने सुना और समझा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶן
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला जोरदार उद्गार है। ‘देखो’ आधुनिक हिन्दी में स्वाभाविक रहते हुए इसके संकेतात्मक बल को बनाए रखता है।
- source_word: כֹּל
  choice: यह सब
  rationale: शाब्दिक अर्थ ‘सब’ है; प्रसंग में यह अय्यूब द्वारा अभी तक चर्चा की गई बातों का समाहार करता है।
- source_word: רָאֲתָה עֵינִי
  choice: मेरी आँख ने देखा है
  rationale: एकवचन देह-अंग ‘मेरी आँख’ को हिब्रू की सजीव अभिव्यक्ति और समानांतर रचना बनाए रखने के लिए सुरक्षित रखा गया है।
- source_word: שָׁמְעָה אָזְנִי
  choice: मेरे कान ने सुना
  rationale: ‘मेरे कान’ को मूल पाठ के एकवचन देह-अंग और ‘मेरी आँख’ के साथ उसके काव्यात्मक समानांतर के कारण बनाए रखा गया है।
- source_word: וַתָּבֶן לָהּ
  choice: और समझा है
  rationale: בין का अर्थ ‘समझना/परखना’ है। स्त्रीलिंग क्रिया निकटतम स्त्रीलिंग कर्ता ‘मेरी आँख’ के बजाय वाक्य के दूसरे खंड में निहित ‘कान’ (हिब्रू में स्त्रीलिंग אָזֶן) से जुड़ती है; לָהּ एक मुहावरेदार प्रयोग है। हिन्दी में संयुक्त कर्ता-संरचना ‘मेरे कान ने सुना और समझा है’ आशय को स्वाभाविक रूप से व्यक्त करती है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज है। मूल की आँख–कान समानांतरता तथा अनुभव और बोध के क्रम को बनाए रखा गया है। कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि ‘समझा है’ मुहावरे का पर्याप्त और स्वाभाविक निरूपण है।
