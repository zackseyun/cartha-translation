  text: הֲ/פָנָ֥י/ו תִּשָּׂא֑וּ/ן אִם לָ/אֵ֥ל תְּרִיבֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/008.yaml
  text: Will you show partiality for him? Will you contend for God?[a][b]
translation:
  language: hi
  text: क्या तुम उसके प्रति पक्षपात करोगे?[a] क्या तुम परमेश्वर की ओर से वाद-विवाद करोगे?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, ‘क्या तुम उसका मुख उठाओगे?’ यह एक इब्रानी मुहावरा है, जिसका अर्थ पक्षपात या तरफ़दारी करना है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘क्या तुम परमेश्वर की ओर से मुकदमा लड़ोगे?’
    reason: alternative_reading
lexical_decisions:
- source_word: הֲפָנָיו תִּשָּׂאוּן
  choice: क्या तुम उसके प्रति पक्षपात करोगे
  rationale: शाब्दिक रूप से यह ‘उसका मुख उठाना’ है, पर न्यायिक और विवादात्मक संदर्भ में यह इब्रानी मुहावरा किसी का पक्ष लेने या उसके प्रति पक्षपात करने का अर्थ देता है।
- source_word: אִם
  choice: क्या
  rationale: यहाँ אִם समानांतर दूसरी आलंकारिक प्रश्नवाचक पंक्ति आरम्भ करता है। स्वाभाविक हिन्दी में इसका प्रश्नार्थक बल अलग प्रश्न के रूप में व्यक्त किया गया है; ‘या’ भी सम्भव है।
- source_word: לָאֵל
  choice: परमेश्वर की ओर से
  rationale: ל यहाँ लाभ अथवा प्रतिनिधित्व का भाव देता है। ‘परमेश्वर की ओर से’ इस विवादात्मक प्रसंग में स्वाभाविक है और पक्ष-समर्थन का भाव रखता है।
- source_word: תְּרִיבוּן
  choice: वाद-विवाद करोगे
  rationale: ריב में कानूनी विवाद, बहस या मुकदमा लड़ने का भाव हो सकता है। ‘वाद-विवाद करना’ इस व्यापक विरोधात्मक अर्थ को रखता है, बिना इसे केवल औपचारिक न्यायालय तक सीमित किए।
theological_decisions:
- issue: क्या अय्यूब अपने मित्रों पर पक्षपाती होकर परमेश्वर का समर्थन करने का आरोप लगाता है
  choice: दो आलंकारिक प्रश्नों के रूप में मित्रों के पक्षपात और परमेश्वर की ओर से विवाद करने को चुनौती दी गई है।
  alternative: दूसरी पंक्ति का अनुवाद ‘क्या तुम परमेश्वर का पक्ष लेकर मुकदमा लड़ोगे?’ किया जा सकता है।
  rationale: निकटवर्ती प्रसंग में अय्यूब अपने मित्रों को परमेश्वर के बचाव में अनुचित बातें कहने के लिए झिड़कता है। फिर भी अनुवाद यह दावा नहीं करता कि परमेश्वर को सचमुच मानवीय बचाव की आवश्यकता है; प्रश्न मित्रों के आचरण पर केंद्रित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण प्रश्नात्मक रूप अपनाया गया है। ‘पक्षपात’ न्यायिक-नैतिक भाव को स्पष्ट करता है, जबकि ‘वाद-विवाद’ ריב की कानूनी तथा व्यापक विवादात्मक अर्थ-सीमा दोनों को बनाए रखता है।
