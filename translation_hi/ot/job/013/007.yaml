base_translation:
  language: en
  yaml_path: translation/ot/job/013/007.yaml
  text: Will you speak injustice for God[a], and deceit for him?
translation:
  language: hi
  text: क्या तुम परमेश्वर के लिए[a] अन्याय की बात कहोगे, और उसके लिए छल की बात?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “परमेश्वर की ओर से” अथवा “परमेश्वर से”; और दूसरे खंड में भी इसी प्रकार “उसकी ओर से” अथवा “उससे।” इब्रानी संबंधबोधक शब्द के एक से अधिक अर्थ हो सकते हैं, यद्यपि प्रसंग परमेश्वर के पक्ष में बोलने के अर्थ का समर्थन करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלְאֵל
  choice: परमेश्वर के लिए
  rationale: לְ का अर्थ यहाँ लाभ, पक्ष या प्रतिनिधित्व सूचित कर सकता है। निकटवर्ती प्रसंग में अय्यूब अपने मित्रों को परमेश्वर का पक्ष लेते हुए गलत बात कहने के लिए डाँटता है; फिर भी अन्य अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: תְּדַבְּרוּ
  choice: क्या तुम ... कहोगे
  rationale: प्रश्नवाचक अपूर्ण क्रिया यहाँ चुनौती और फटकार का भाव देती है। आधुनिक हिन्दी में ‘क्या तुम ... कहोगे’ इस आलंकारिक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עַוְלָה
  choice: अन्याय
  rationale: यह शब्द नैतिक और न्यायिक गलतता को सूचित करता है। ‘अन्याय’ उसके भार को बनाए रखता है और अगले शब्द ‘छल’ से अनावश्यक अर्थ-समानता से बचता है।
- source_word: וְלוֹ
  choice: और उसके लिए
  rationale: सर्वनाम परमेश्वर की ओर लौटता है और पहले खंड के समानांतर उसके पक्ष में बोलने का संदर्भ देता है।
- source_word: רְמִיָּה
  choice: छल
  rationale: यह अमूर्त संज्ञा धोखे या कपट को सूचित करती है। ‘छल की बात’ हिन्दी में बोलने के संदर्भ के साथ स्वाभाविक है और इब्रानी की संक्षिप्त समानांतरता रखती है।
theological_decisions:
- issue: क्या अय्यूब का आरोप परमेश्वर के पक्ष में बोलने पर है या परमेश्वर से बोलने पर
  choice: अय्यूब उन्हें परमेश्वर के पक्ष में अन्यायपूर्ण ढंग से बोलने के लिए डाँटता है।
  alternative: अय्यूब उन्हें परमेश्वर से अन्याय की बात कहने के लिए डाँटता है।
  rationale: अय्यूब 13:4 और 13:8 का प्रसंग मित्रों के परमेश्वर का पक्ष लेने और पक्षपात करने की ओर संकेत करता है। इसलिए मुख्य पाठ में ‘के लिए’ उचित है, जबकि לְ की वास्तविक बहुअर्थकता पादटिप्पणी में रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। दोनों खंडों की इब्रानी समानांतरता और संक्षिप्तता बचाने के लिए दूसरे खंड में क्रिया को दोहराया नहीं गया, पर हिन्दी में ‘छल की बात’ जोड़कर अर्थ को स्वाभाविक बनाया गया है।
