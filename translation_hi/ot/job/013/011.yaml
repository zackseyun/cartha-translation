    text: या ‘उससे उत्पन्न भय तुम पर नहीं पड़ेगा।’ इब्रानी अधिकारसूचक रूप का अर्थ वह भय हो सकता है जो वह उत्पन्न करता है।
    reason: lexical_alternative
