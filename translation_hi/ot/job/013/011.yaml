  choice: क्या…न करेगी
  rationale: यह अलंकारिक प्रश्न है, जिसका अपेक्षित उत्तर हाँ है; हिन्दी में ‘क्या…न’ प्रश्नात्मक बल को स्वाभाविक रूप से बनाए रखता है।
- source_word: שְׂאֵתוֹ
  choice: उसकी महिमा
  rationale: यह संज्ञा ऊँचाई, प्रतिष्ठा या उत्कर्ष का बोध करा सकती है; परमेश्वर के ऊँचे गौरव के लिए ‘महिमा’ सहज और गरिमापूर्ण है, जबकि विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: תְּבַעֵת
  choice: भयभीत न करेगी
  rationale: पिएल रूप तीव्र भय उत्पन्न करने का अर्थ देता है; ‘भयभीत करना’ आधुनिक हिन्दी में स्पष्ट है और मूल की कारणवाचक शक्ति रखता है।
- source_word: אֶתְכֶם
  choice: तुम्हें
  rationale: यह द्वितीय पुरुष पुल्लिंग बहुवचन का प्रत्यक्ष कर्म है; प्रसंग में अय्यूब अपने अनेक मित्रों को संबोधित कर रहा है।
- source_word: וּפַחְדּוֹ
  choice: उसका आतंक
  rationale: पदबंध को अधिकारसूचक रूप में रखते हुए उससे उत्पन्न भय का तीव्र भाव व्यक्त किया गया है; इसका वस्तुनिष्ठ अर्थ ‘उसका भय’ पादटिप्पणी में दिया गया है।
- source_word: יִפֹּל עֲלֵיכֶם
  choice: तुम पर न आ पड़ेगा
  rationale: ‘पड़ना’ की मूल छवि बचती है और ‘आ पड़ना’ हिन्दी में किसी प्रबल भय के अचानक घेर लेने का स्वाभाविक मुहावरा है।
theological_decisions:
- issue: וּפַחְדּוֹ में अधिकारसूचक संबंध
  choice: उसका आतंक
  alternative: उसका भय तुम पर न छा जाएगा / उसका भय तुम पर न आ पड़ेगा
  rationale: हिब्रू यह खुला छोड़ सकता है कि अर्थ परमेश्वर द्वारा उत्पन्न आतंक है या उसका भय; मुख्य पाठ में अधिकारसूचक संरचना रखी गई है और वैकल्पिक समझ पादटिप्पणी में स्पष्ट की गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज प्रश्न-विन्यास अपनाया गया है। दोनों समानांतर खंडों और अलंकारिक प्रश्न की शक्ति को बनाए रखा गया है; ‘आ पड़ेगा’ मूल के ‘तुम पर पड़ेगा’ बिंब को स्वाभाविक हिन्दी में व्यक्त करता है।
