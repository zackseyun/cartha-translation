source:
  edition: WLC
  text: הֶ/עָלֶ֣ה נִדָּ֣ף תַּעֲר֑וֹץ וְ/אֶת קַ֖שׁ יָבֵ֣שׁ תִּרְדֹּֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/025.yaml
  text: Will you terrify a windblown leaf[b][a], and pursue dry chaff?
translation:
  language: hi
  text: क्या तू हवा में उड़ते पत्ते को भयभीत करेगा[a], और सूखे तिनके[b] का पीछा करेगा?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “डराएगा”; इब्रानी क्रिया भय या आतंक उत्पन्न करने के साथ कठोर व्यवहार का भाव भी दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या “सूखे भूसे” अथवा “सूखे पुआल”; इब्रानी शब्द सूखे वनस्पति-अवशेष को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעָלֶה
  choice: पत्ते
  rationale: עָלֶה यहाँ एकवचन में ‘पत्ता’ है और अति निर्बल वस्तु का काव्यात्मक चित्र प्रस्तुत करता है।
- source_word: נִדָּף
  choice: हवा में उड़ते
  rationale: נדף किसी वस्तु के हवा से उड़ाए या इधर-उधर बहाए जाने का भाव देता है। ‘हवा में उड़ते’ आधुनिक हिन्दी में स्वाभाविक है और पत्ते की असहायता स्पष्ट करता है।
- source_word: תַּעֲרוֹץ
  choice: भयभीत करेगा
  rationale: ערץ भय या आतंक उत्पन्न करने का प्रबल भाव रखता है। ‘भयभीत करेगा’ उस तीव्रता और आलंकारिक मानवीकरण को बनाए रखता है।
- source_word: וְאֶת
  choice: और
  rationale: संयोजक וְ दूसरे समानांतर चित्र को पहले से जोड़ता है; אֶת का हिन्दी में अलग अनुवाद आवश्यक नहीं है।
- source_word: קַשׁ
  choice: तिनके
  rationale: קַשׁ सूखे भूसे, पुआल, ठूँठ या तिनके जैसे वनस्पति-अवशेष को दर्शा सकता है। यहाँ ‘तिनका’ निर्बल और तुच्छ वस्तु के समानांतर काव्यात्मक चित्र को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יָבֵשׁ
  choice: सूखे
  rationale: विशेषण वस्तु के सूखे होने को सीधे व्यक्त करता है और उसकी भंगुरता को बढ़ाता है।
- source_word: תִּרְדֹּף
  choice: पीछा करेगा
  rationale: רדף का सामान्य अर्थ पीछा करना या खदेड़ना है। ‘पीछा करेगा’ स्पष्ट है और पहले खंड की आक्रामक क्रिया के समानांतर रहता है।
theological_decisions:
- issue: परमेश्वर को एकवचन निकट संबोधन
  choice: तू
  alternative: आप
  rationale: इब्रानी क्रियाएँ दूसरे पुरुष एकवचन पुल्लिंग में हैं। अय्यूब के सीधे, तीखे और काव्यात्मक संबोधन को बनाए रखने के लिए ‘तू’ चुना गया है; इसका उद्देश्य अनादर जोड़ना नहीं है।
translation_notes:
  register: भाषा आधुनिक, सहज और काव्यात्मक रखी गई है। दोनों समानांतर प्रश्नों में निर्बल वस्तुओं—उड़ता पत्ता और सूखा तिनका—के सामने प्रबल पीछा करने वाले की विडंबना सुरक्षित है।
