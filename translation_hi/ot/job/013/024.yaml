  yaml_path: translation/ot/job/013/024.yaml
  text: Why do you hide your face and count me as your enemy?[a]
translation:
  language: hi
  text: तू अपना मुख क्यों छिपाता है और मुझे अपना शत्रु समझता है?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मुझे अपने लिए शत्रु मानता है।”
    reason: לָךְ के अधिक शाब्दिक सम्बन्धपरक रूप और חשב के वैकल्पिक हिन्दी समतुल्य को दर्शाने के लिए।
lexical_decisions:
- source_word: לָמָה
  choice: क्यों
  rationale: यह कारण पूछने वाला सीधा प्रश्नवाचक शब्द है; आधुनिक हिन्दी में ‘क्यों’ इसका स्वाभाविक समतुल्य है।
- source_word: פָנֶיךָ
  choice: अपना मुख
  rationale: इब्रानी में शाब्दिक अर्थ ‘तेरा मुख’ है। हिन्दी की बाइबलीय-काव्यात्मक अभिव्यक्ति में ‘अपना मुख छिपाना’ स्वाभाविक है और उपस्थिति या अनुग्रह के रूपक को बिना खोले सुरक्षित रखता है।
- source_word: תַסְתִּיר
  choice: छिपाता है
  rationale: סתר के हिफ़ील रूप का अर्थ ‘छिपाना’ या ‘ओझल करना’ है। ‘मुख छिपाना’ सम्बन्धपरक और काव्यात्मक बल बनाए रखता है।
- source_word: וְתַחְשְׁבֵנִי
  choice: और मुझे ... समझता है
  rationale: חשב का अर्थ यहाँ किसी को किसी रूप में मानना, समझना या गिनना है। ‘समझता है’ आधुनिक हिन्दी में सहज है और विधेयात्मक रचना को स्पष्ट रखता है।
- source_word: לְאוֹיֵב
  choice: शत्रु
  rationale: ל यहाँ ‘समझना’ के बाद विधेयात्मक पूरक को चिह्नित करता है; हिन्दी में ‘शत्रु समझना’ यही सम्बन्ध स्वाभाविक रूप से व्यक्त करता है।
- source_word: לָךְ
  choice: अपना
  rationale: शाब्दिक रूप से ‘तेरे लिए/तेरे प्रति’ है। इस रचना में सम्बन्ध यह है कि परमेश्वर अय्यूब को अपना शत्रु मानता है; ‘अपना शत्रु’ इसे संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के विषय में ‘मुख छिपाने’ की मानवरूपी भाषा
  choice: मुख छिपाने की ठोस अभिव्यक्ति को मुख्य पाठ में बनाए रखा गया है।
  alternative: अपनी उपस्थिति हटा लेना; मुझसे विमुख हो जाना
  rationale: इब्रानी पाठ परमेश्वर के ‘मुख’ की सामान्य बाइबलीय छवि का प्रयोग करता है, जो उसकी उपस्थिति या अनुग्रह का संकेत दे सकती है। इसे बनाए रखने से कविता और धर्मवैचारिक तनाव सुरक्षित रहता है तथा रूपक की अनावश्यक व्याख्या नहीं होती।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सीधी और काव्यात्मक प्रश्नवाचक शैली। परमेश्वर को संबोधन में ‘तू’ रखा गया है, जो हिन्दी बाइबल-काव्य में निकट और प्रत्यक्ष एकवचन संबोधन के रूप में उपयुक्त है। दूसरे खंड में ‘क्यों’ दोहराया गया है ताकि हिन्दी में प्रश्न का विस्तार स्पष्ट और स्वाभाविक रहे।
