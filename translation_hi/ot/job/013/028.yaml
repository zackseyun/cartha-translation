translation:
  language: hi
  text: 'और वह सड़ी हुई वस्तु के समान गलता जाता है,[a]

    वस्त्र के समान जिसे पतंगा खा जाता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और वह सड़न के समान क्षीण होता जाता है, वस्त्र के समान जिसे कपड़े का पतंगा खा जाता है।”
    reason: ‘सड़न’ רָקָב का अधिक शाब्दिक संज्ञात्मक विकल्प है; עָשׁ का अर्थ कपड़े खाने वाला पतंगा है।
lexical_decisions:
- source_word: וְהוּא
  choice: और वह
  rationale: स्वतंत्र सर्वनाम के साथ संयोजक पिछले संदर्भ के व्यक्ति को फिर सामने लाता है। हिंदी में ‘और वह’ मूल की संरचना और काव्यात्मक प्रवाह दोनों बनाए रखता है।
- source_word: כְּרָקָב
  choice: सड़ी हुई वस्तु के समान
  rationale: רָקָב का अर्थ सड़न या गलन है। मूर्त उपमा हिंदी में स्वाभाविक है और अगले क्रियापद के साथ स्पष्ट बैठती है।
- source_word: יִבְלֶה
  choice: गलता जाता है
  rationale: בלה धीरे-धीरे जीर्ण या नष्ट होने का भाव देता है। इस शारीरिक संदर्भ में ‘गलता जाता है’ क्रमिक क्षय को सहज रूप से व्यक्त करता है।
- source_word: כְּבֶגֶד
  choice: उस वस्त्र के समान
  rationale: בֶּגֶד के सामान्य एकवचन अर्थ और काव्यात्मक शैली को ‘वस्त्र’ सुरक्षित रखता है।
- source_word: אֲכָלוֹ
  choice: जिसे ... ने खा लिया हो
  rationale: प्रत्यय वस्त्र को कर्म के रूप में दिखाता है; हिंदी संबंधवाचक उपवाक्य परिणामी दशा को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עָשׁ
  choice: कीड़े
  rationale: עָשׁ विशेषतः कपड़ा खाने वाले पतंगे को सूचित करता है। सामान्य पाठक के लिए ‘कीड़े’ स्वाभाविक है, जबकि अधिक सटीक विकल्प पादटिप्पणी में दिया गया है।
