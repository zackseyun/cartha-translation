- source_word: שִׁמְעוּ נָא
  choice: कृपया ... सुनो
  rationale: बहुवचन आज्ञार्थक שִׁמְעוּ के साथ विनय-सूचक נָא है। आधुनिक हिन्दी में ‘कृपया ... सुनो’ सीधे आग्रह और विनम्रता, दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: תוֹכַחְתִּי
  choice: मेरा तर्क
  rationale: תּוֹכַחַת सुधार या फटकार के साथ तर्क, प्रतिवाद अथवा प्रमाणित पक्ष का अर्थ भी दे सकता है। अय्यूब के न्यायिक-विवादात्मक प्रसंग में ‘मेरा तर्क’ उपयुक्त है, जबकि वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: וְרִבוֹת
  choice: और ... दलीलों
  rationale: רִיבוֹת विवाद, प्रतिवाद या कानूनी पक्ष-समर्थन को सूचित कर सकता है। ‘दलीलों’ से यहाँ का न्यायिक भाव सहज आधुनिक हिन्दी में प्रकट होता है।
- source_word: שְׂפָתַי
  choice: मेरे होंठों की
  rationale: मूल का शाब्दिक बिंब ‘मेरे होंठ’ बनाए रखा गया है; इसे केवल ‘मेरी बातें’ कहकर सपाट नहीं किया गया।
- source_word: הַקְשִׁיבוּ
  choice: ध्यान दो
  rationale: यह बहुवचन आज्ञार्थक ध्यानपूर्वक सुनने का आग्रह करता है। ‘पर ध्यान दो’ पहले खंड के ‘सुनो’ के साथ काव्यात्मक समानांतरता रखते हुए अधिक गहन ध्यान का भाव देता है।
