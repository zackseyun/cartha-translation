  text: See now[a], I have prepared my case; I know that I will be vindicated.
translation:
  language: hi
  text: देखो, मैंने अपना मुक़दमा तैयार कर लिया है; मैं जानता हूँ कि मैं सही ठहराया जाऊँगा[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं सही सिद्ध होऊँगा”; अथवा, “मैं धर्मी ठहराया जाऊँगा।” इब्रानी क्रिया न्यायिक संदर्भ में किसी व्यक्ति को सही या न्यायोचित ठहराए जाने का अर्थ दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: देखो
  rationale: दोनों अव्यय मिलकर ध्यान आकर्षित करते और कथन पर बल देते हैं। आधुनिक हिन्दी में ‘देखो’ स्वाभाविक है; अलग से ‘अब’ जोड़ना यहाँ अनावश्यक और कुछ कृत्रिम लगता है।
- source_word: עָרַכְתִּי מִשְׁפָּט
  choice: मैंने अपना मुक़दमा तैयार कर लिया है
  rationale: עָרַךְ का मूल भाव व्यवस्थित करने या क्रम से लगाने का है, और מִשְׁפָּט यहाँ न्यायिक प्रसंग में अय्यूब के पक्ष अथवा मुक़दमे को सूचित करता है। ‘तैयार कर लिया है’ पूर्ण तैयारी का भाव सहज हिन्दी में व्यक्त करता है।
- source_word: יָדַעְתִּי
  choice: मैं जानता हूँ
  rationale: इब्रानी पूर्ण क्रिया यहाँ अय्यूब के दृढ़ वर्तमान विश्वास को व्यक्त करती है।
- source_word: כִּי
  choice: कि
  rationale: यह अय्यूब के ज्ञान की विषय-वस्तु का परिचय देता है।
- source_word: אֲנִי אֶצְדָּק
  choice: मैं निर्दोष ठहराया जाऊँगा
  rationale: צדק का निफ़अल-सदृश/स्थिति-सूचक रूप इस न्यायिक संदर्भ में सही सिद्ध या न्यायोचित ठहराए जाने का अर्थ देता है। स्पष्ट ‘मैं’ स्रोत के बलाघात को बनाए रखता है।
theological_decisions:
- issue: अय्यूब के दावे का न्यायिक अर्थ
  choice: मैं निर्दोष ठहराया जाऊँगा
  alternative: मैं धर्मी ठहराया जाऊँगा / मैं सही सिद्ध होऊँगा
  rationale: यहाँ अय्यूब परमेश्वर के सामने अपने मुक़दमे के परिणाम के विषय में विश्वास व्यक्त करता है। अनुवाद न्यायालयीन अर्थ को रखता है और बाद की किसी विशिष्ट धर्मवैज्ञानिक ‘धर्मी ठहराए जाने’ की धारणा को आरोपित नहीं करता। फुटनोट निकट वैकल्पिक अर्थों को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मुक़दमा’ न्यायिक रूपक को स्पष्ट करता है; ‘निर्दोष ठहराया जाऊँगा’ के साथ फुटनोट स्रोत की वास्तविक अर्थ-सीमा और धर्मवैज्ञानिक तनाव को सुरक्षित रखता है।
