  text: 'मेरी बात ध्यान से सुनो,

    और मेरे कथन को अपने कानों में लो।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁמְעוּ שָׁמוֹעַ
  choice: ध्यान से सुनो
  rationale: क्रिया के साथ infinitive absolute आज्ञा को बल देता है। ‘ध्यान से सुनो’ इस जोर को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: מִלָּתִי
  choice: मेरी बात
  rationale: מִלָּה का अर्थ ‘शब्द’ या ‘वचन/बात’ है। इस प्रसंग में ‘मेरी बात’ वक्तव्य के सामूहिक अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: וַאֲחֲוָתִי
  choice: मेरा निवेदन
  rationale: यह रूप कही या सामने रखी गई बात को सूचित करता है। अय्यूब की गंभीर अपील के संदर्भ में ‘निवेदन’ स्वाभाविक है और ‘व्याख्या’ जैसी अधिक व्याख्यात्मक निश्चितता से बचता है।
- source_word: בְּאָזְנֵיכֶם
  choice: तुम्हारे कानों में पड़े
  rationale: इब्रानी के ठोस मुहावरे ‘तुम्हारे कानों में’ को सुरक्षित रखते हुए हिन्दी में ‘कानों में पड़े’ सुनने और ग्रहण करने की अपील को स्वाभाविक ढंग से व्यक्त करता है।
