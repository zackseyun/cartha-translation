  text: If only you would keep completely silent[a], and it would count as wisdom for you.
translation:
  language: hi
  text: काश तुम पूरी तरह चुप रहते[a], और यह तुम्हारे लिए बुद्धिमानी होती।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “काश तुम एकदम मौन रहते, और यह तुम्हारे लिए बुद्धिमानी होती।”
    reason: मूल में चुप रहने की क्रिया को बल देने वाली रचना है; ‘एकदम मौन’ उसका अधिक शाब्दिक और औपचारिक विकल्प है।
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: काश
  rationale: यह इब्रानी मुहावरा शाब्दिक प्रश्न नहीं, बल्कि तीव्र इच्छा व्यक्त करता है; आधुनिक हिन्दी में ‘काश’ उसी कामना-भाव को स्वाभाविक रूप से प्रकट करता है।
- source_word: הַחֲרֵשׁ תַּחֲרִישׁוּן
  choice: तुम पूरी तरह चुप रहते
  rationale: एक ही धातु के क्रियार्थक रूप और सीमित क्रिया का मेल चुप रहने की क्रिया पर बल देता है। ‘पूरी तरह’ उस बल को सहज हिन्दी में व्यक्त करता है।
- source_word: וּתְהִי
  choice: और यही ... होती
  rationale: स्त्रीलिंग एकवचन क्रिया का आशय पिछली पूरी बात—उनका चुप रहना—हो सकता है। ‘यही’ उस स्थिति को स्वाभाविक हिन्दी में विषय बनाता है, जबकि ‘होती’ मूल के सीधे अस्तित्व/मूल्यांकन संबंध को बनाए रखता है।
- source_word: לָכֶם
  choice: तुम्हारे लिए
  rationale: यहाँ ל संबंध अथवा हित को दर्शाता है; ‘तुम्हारे लिए’ इसका स्वाभाविक हिन्दी रूप है।
- source_word: לְחָכְמָה
  choice: बुद्धिमानी
  rationale: חָכְמָה का मूल अर्थ ‘बुद्धि/बुद्धिमानी’ है। इस मूल्यांकनात्मक वाक्य में ‘बुद्धिमानी होती’ सामान्य हिन्दी में अधिक स्वाभाविक है और अर्थ को अनावश्यक रूप से नहीं बढ़ाता।
