  text: Why should I take my flesh in my teeth and put my life in my hand?[a][b]
translation:
  language: hi
  text: मैं अपना मांस अपने दाँतों में क्यों लूँ और अपना जीवन अपनी हथेली पर क्यों रखूँ?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं अपना मांस अपने दाँतों से क्यों उठाऊँ?” इब्रानी अभिव्यक्ति मुहावरेदार और कठिन है; इसका भाव अपने आपको जानबूझकर बड़े खतरे में डालना है।
    reason: lexical_alternative
  - marker: b
    text: या, “अपने प्राण।” इब्रानी नेफ़ेश का अर्थ “जीवन,” “प्राण,” या “स्वयं” हो सकता है; यहाँ अपना जीवन जोखिम में डालने के अर्थ में “जीवन” सबसे उपयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל מָה
  choice: क्यों
  rationale: यह पदबंध यहाँ उद्देश्य या कारण पूछने वाला आलंकारिक प्रश्न आरम्भ करता है; आधुनिक हिन्दी में ‘क्यों’ उसका बल स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֶשָּׂא
  choice: लूँ
  rationale: נשא का अर्थ उठाना, ढोना या लेना हो सकता है। इस कठिन मुहावरे में ‘लूँ’ हिन्दी में सहज है और मूल बिंब बनाए रखता है।
- source_word: בְשָׂרִי
  choice: अपना मांस
  rationale: בשר का ठोस अर्थ ‘मांस’ है। ‘शरीर’ कहने के बजाय ‘मांस’ मूल की तीखी और असामान्य छवि सुरक्षित रखता है।
- source_word: בְשִׁנָּי
  choice: अपने दाँतों में
  rationale: ב उपसर्ग को यहाँ ‘में’ कहना मूल अभिव्यक्ति के अधिक निकट है; ‘दाँतों से’ भी सम्भव है, इसलिए विकल्प पादटिप्पणी में दिया गया है।
- source_word: וְנַפְשִׁי
  choice: और अपना जीवन
  rationale: נפש का अर्थ जीवन, प्राण या स्वयं हो सकता है। जीवन को जोखिम में डालने वाले समानांतर मुहावरे में ‘जीवन’ सबसे स्पष्ट है, जबकि ‘प्राण’ सम्भव विकल्प है।
- source_word: אָשִׂים
  choice: रखूँ
  rationale: שׂים का अर्थ रखना, धरना या स्थापित करना है; हथेली के साथ ‘रखूँ’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: בְכַפִּי
  choice: अपनी हथेली पर
  rationale: כף विशेषतः हथेली को दर्शाता है। हिन्दी का ‘हथेली पर जीवन रखना’ जोखिम उठाने का बोध देता है और मूल शारीरिक बिंब को ‘हाथ’ से अधिक ठीक सुरक्षित रखता है।
