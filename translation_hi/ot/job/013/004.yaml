  text: But you are plasterers of lies[b][a]; all of you are worthless physicians.
translation:
  language: hi
  text: 'परन्तु तुम झूठ की लीपा-पोती करने वाले[a] हो;

    तुम सब निकम्मे वैद्य[b] हो।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘झूठ का लेप लगाने वाले’ अथवा ‘झूठ गढ़ने वाले।’ इब्रानी क्रिया में पोतने या लेप चढ़ाने का बिम्ब है, सम्भवतः यह बताता है कि वे वास्तविकता को झूठ से ढक रहे हैं।
    reason: lexical_alternative
  - marker: b
    text: या ‘किसी काम के नहीं ऐसे वैद्य।’ इब्रानी पद उन्हें निष्प्रभावी उपचारक बताता है। संज्ञा के एक अन्य अर्थ के आधार पर ‘मूर्ति-वैद्य’ भी सम्भव है, पर यहाँ इसकी सम्भावना कम है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם
  choice: परन्तु
  rationale: यह पिछले कथन के विपरीत एक तीखा प्रत्यक्ष आरोप आरम्भ करता है; ‘परन्तु’ आधुनिक, गरिमापूर्ण हिन्दी में इस विरोध को स्पष्ट रखता है।
- source_word: אַתֶּם
  choice: तुम
  rationale: यह अय्यूब के मित्रों को सीधे सम्बोधित करनेवाला बहुवचन सर्वनाम है; अगली पंक्ति का ‘तुम सब’ बहुवचन और समष्टिगत बल को स्पष्ट करता है।
- source_word: טֹפְלֵי
  choice: लीपा-पोती करनेवाले
  rationale: मूल क्रिया में किसी वस्तु को पोतने या उस पर लेप चढ़ाने का बिम्ब है। हिन्दी का यह मुहावरा उस ठोस बिम्ब के साथ वास्तविकता को झूठ से ढकने का आशय भी स्वाभाविक रूप से व्यक्त करता है।
- source_word: שָׁקֶר
  choice: झूठ
  rationale: इब्रानी एकवचन यहाँ सामूहिक अर्थ रख सकता है। ‘झूठ’ सहज हिन्दी में असत्य को उस पदार्थ के रूप में प्रस्तुत करता है जिससे वे लीपा-पोती करते हैं।
- source_word: רֹפְאֵי
  choice: वैद्य
  rationale: यह चंगा करनेवालों का संज्ञात्मक बिम्ब बनाए रखता है और अय्यूब के मित्रों को असफल उपचारकों के रूप में दिखाता है; ‘वैद्य’ गरिमापूर्ण और व्यापक रूप से बोधगम्य है।
- source_word: אֱלִל
  choice: निकम्मे
  rationale: इस प्रसंग में शब्द का सर्वाधिक स्वाभाविक अर्थ ‘व्यर्थ, निष्प्रभावी, किसी काम के नहीं’ है। ‘निकम्मे वैद्य’ उनकी उपचार करने की पूर्ण अक्षमता को संक्षेप और सजीव रूप में बताता है।
- source_word: כֻּלְּכֶם
  choice: तुम सब
  rationale: यह आरोप में सम्बोधित सभी मित्रों को सम्मिलित करता है और इब्रानी के समष्टिगत जोर को सुरक्षित रखता है।
