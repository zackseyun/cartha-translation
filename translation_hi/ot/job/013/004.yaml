  register: भाषा आधुनिक, सीधी और गरिमापूर्ण रखी गई है। दो समानान्तर पंक्तियाँ अय्यूब के तीखे आरोप और इब्रानी वाक्य की काव्यात्मक संरचना को उभारती हैं। ‘लीपा-पोती’ प्रचलित हिन्दी मुहावरा है, पर मूल के पोतने/लेप लगाने के बिम्ब को भी बनाए रखता है।
