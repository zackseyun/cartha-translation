  text: He will surely rebuke you if in secret you show partiality[a].
translation:
  language: hi
  text: यदि तुम छिपकर पक्षपात करोगे, तो वह निश्चय ही तुम्हें फटकारेगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “चेहरों को उठाओगे”; यह एक इब्रानी मुहावरा है, जिसका अर्थ पक्षपात करना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹכֵחַ יוֹכִיחַ
  choice: निश्चय ही ... डाँटेगा
  rationale: क्रिया के साथ उसी धातु का infinitive absolute कथन पर बल देता है। संदर्भ में अय्यूब अपने मित्रों को परमेश्वर की कड़ी फटकार की चेतावनी देता है; इसलिए सहज आधुनिक हिन्दी में बल सहित ‘निश्चय ही ... डाँटेगा’ उपयुक्त है।
- source_word: אֶתְכֶם
  choice: तुम्हें
  rationale: यह द्वितीय पुरुष पुल्लिंग बहुवचन कर्म है और अय्यूब के मित्रों को सामूहिक रूप से संबोधित करता है। हिन्दी में ‘तुम्हें’ बहुवचन संदर्भ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אִם
  choice: यदि
  rationale: यह शर्तसूचक चेतावनी है। ‘यदि’ मूल की वास्तविक शर्त को बनाए रखता है; ‘जब’ उसे निश्चित घटना मान लेने का आभास देता।
- source_word: בַּסֵּתֶר
  choice: छिपकर
  rationale: בְּ के साथ סֵתֶר गुप्त या छिपे हुए ढंग से किए गए काम को बताता है। ‘छिपकर’ वर्तमान हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: פָּנִים תִּשָּׂאוּן
  choice: पक्षपात करोगे
  rationale: शाब्दिक रूप से ‘चेहरे उठाओगे’ एक स्थापित इब्रानी मुहावरा है, जिसका अर्थ किसी के पक्ष में अनुचित झुकाव दिखाना है। ‘पक्षपात करोगे’ उसके नैतिक और न्यायिक बल को स्पष्ट रखता है।
theological_decisions:
- issue: נשׂא פנים मुहावरे का अनुवाद
  choice: पक्षपात करोगे
  alternative: मुँह देखकर पक्ष लोगे
  rationale: अय्यूब अपने मित्रों पर परमेश्वर के पक्ष में पक्षपाती पैरवी करने का आरोप लगा रहा है। ‘पक्षपात’ न्याय-विषयक बल को स्पष्ट करता है और यह संकेत नहीं देता कि परमेश्वर को स्वयं अनुचित अनुग्रह की आवश्यकता है।
- issue: בַּסֵּתֶר का पक्षपात से संबंध
  choice: छिपकर पक्षपात
  alternative: गुप्त रूप से किसी का पक्ष लेना
  rationale: वाक्य का स्वाभाविक संबंध यही है कि पक्षपात छिपे हुए ढंग से किया जा रहा है। अनुवाद इस संबंध को रखता है, पर यह नहीं बताता कि छिपाव मन की आंतरिक प्रवृत्ति है या निजी आचरण; मूल की व्यापकता बनी रहती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘डाँटेगा’ सामान्य पाठक के लिए स्पष्ट है और दैवी फटकार की तीव्रता व्यक्त करता है। पदक्रम को स्वाभाविक हिन्दी चेतावनी के रूप में रखा गया है, जबकि ‘यदि’ की शर्त और मूल का जोर सुरक्षित हैं।
