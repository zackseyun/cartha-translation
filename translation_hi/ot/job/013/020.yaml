  text: 'Only do not do two things to me[a]; then I will not hide myself from your face:'
translation:
  language: hi
  text: 'केवल ये दो बातें मुझ पर न कर; तब मैं तेरे सामने से नहीं छिपूँगा:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ
  choice: केवल
  rationale: यहाँ यह शब्द अय्यूब की विनती को सीमित करता है; इसलिए ‘केवल’ उसके प्रतिबंधात्मक बल को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: שְׁתַּיִם
  choice: ये दो काम
  rationale: हिब्रू में स्त्रीलिंग संख्या ‘दो’ बिना किसी स्पष्ट संज्ञा के है। अगले पदों में बताए जाने वाले कार्यों की ओर संकेत स्पष्ट करने के लिए हिंदी में ‘काम’ जोड़ा गया है।
- source_word: אַל תַּעַשׂ עִמָּדִי
  choice: मेरे साथ न कर
  rationale: עשה עם का अर्थ किसी के साथ कुछ करना या व्यवहार करना हो सकता है। ‘मेरे साथ न कर’ मूल पूर्वसर्ग के निकट रहते हुए हिंदी में सहज है।
- source_word: אָז
  choice: तब
  rationale: यह उन दो अनुरोधों की स्वीकृति के परिणाम को संक्षेप और स्पष्ट रूप से दर्शाता है।
- source_word: מִפָּנֶיךָ
  choice: तेरे सामने से
  rationale: यह चयन ‘तेरे मुख से’ की मूल छवि और ‘तेरी उपस्थिति से’ के मुहावरेदार अर्थ, दोनों को स्वाभाविक हिंदी में समेटता है।
- source_word: לֹא אֶסָּתֵר
  choice: नहीं छिपूँगा
  rationale: 'निफ़अल रूप को यहाँ आत्मवाचक/अकर्मक अर्थ में लिया गया है: यदि परमेश्वर ये दो काम न करे, तो अय्यूब उसके सामने से नहीं छिपेगा।'
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गंभीर और काव्यात्मक शैली रखी गई है। अय्यूब द्वारा परमेश्वर को सीधे संबोधित करने के कारण एकवचन निकट संबोधन ‘तेरे’ और ‘कर’ का प्रयोग किया गया है; यह अनादर नहीं, बल्कि मूल हिब्रू के सीधे संबोधन को दर्शाता है।
