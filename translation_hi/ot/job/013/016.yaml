id: JOB.13.16
reference: Job 13:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: גַּם הוּא לִ֥/י לִֽ/ישׁוּעָ֑ה כִּי לֹ֥א לְ֝/פָנָ֗י/ו חָנֵ֥ף יָבֽוֹא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/016.yaml
  text: This also will be my salvation[b][a], for no godless man may come before him.
translation:
  language: hi
  text: यह भी मेरे लिए उद्धार[a] होगा, क्योंकि कोई भक्तिहीन[b] उसके सामने नहीं आ सकता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उद्धार’ का अनुवाद ‘छुटकारा’ या ‘निर्दोष ठहराया जाना’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘भक्तिहीन’ का अनुवाद ‘अधर्मी’ या ‘धर्मविरुद्ध व्यक्ति’ भी हो सकता है। इब्रानी शब्द केवल कपट करने वाले नहीं, बल्कि परमेश्वर के प्रति श्रद्धाहीन व्यक्ति को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם הוּא
  choice: यह भी
  rationale: गַּם का योगात्मक बल ‘भी’ से और הוּא का प्रसंगगत संकेत ‘यह’ से स्वाभाविक रूप में व्यक्त होता है; यहाँ सर्वनाम पिछली कही हुई बात या परिस्थिति की ओर संकेत करता है।
- source_word: לִי לִישׁוּעָה
  choice: मेरे लिए उद्धार
  rationale: לִי हित अथवा लाभ का भाव देता है और יְשׁוּעָה छुटकारे, बचाव या अनुकूल निर्णय को सूचित कर सकता है। ‘मेरे लिए उद्धार’ मूल संरचना और अय्यूब के गंभीर कथन—दोनों को बनाए रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ इस व्याख्यात्मक संबंध को स्पष्ट और सहज रखता है।
- source_word: חָנֵף
  choice: भक्तिहीन
  rationale: यह शब्द केवल दिखावटी या असच्चे व्यक्ति के लिए नहीं, बल्कि परमेश्वर के प्रति श्रद्धाहीन और धर्मविरुद्ध व्यक्ति के लिए प्रयुक्त होता है। ‘भक्तिहीन’ उसका धार्मिक-नैतिक बल संक्षेप में व्यक्त करता है।
- source_word: לְפָנָיו
  choice: उसके सामने
  rationale: यह किसी की उपस्थिति में आने का सामान्य इब्रानी मुहावरा है। ‘उसके सामने’ स्वाभाविक हिन्दी है और सर्वनाम को अनावश्यक रूप से खोलता नहीं।
- source_word: יָבוֹא
  choice: आ सकता
  rationale: निषेध के साथ यह परमेश्वर की उपस्थिति में प्रवेश की संभावना या स्वीकार्यता व्यक्त करता है; ‘नहीं आ सकता’ इस प्रसंग में सहज है, जबकि भाव को केवल भविष्यकाल तक सीमित नहीं करता।
theological_decisions:
- issue: לְפָנָיו में सर्वनाम का संदर्भ
  choice: ‘उसके’, अर्थात प्रसंग में परमेश्वर
  alternative: किसी अधिक सामान्य न्यायाधिकारी या उस व्यक्ति की उपस्थिति जिसके सामने अय्यूब आता है
  rationale: आस-पास के प्रसंग में अय्यूब परमेश्वर के सामने अपना पक्ष रखने की बात कर रहा है। फिर भी मूल के सर्वनामात्मक रूप को बनाए रखने के लिए मुख्य पाठ में ‘परमेश्वर के सामने’ कहकर विस्तार नहीं किया गया।
- issue: יְשׁוּעָה का अर्थ
  choice: उद्धार, जिसमें छुटकारे और निर्दोष सिद्ध होने का भाव खुला रहता है
  alternative: छुटकारा; निर्दोष ठहराया जाना; विजय
  rationale: अय्यूब के न्यायिक प्रसंग में यह शब्द अनुकूल निर्णय या निर्दोष सिद्ध होने की ओर संकेत कर सकता है, पर इसका सामान्य अर्थ-क्षेत्र अधिक व्यापक है। इसलिए मुख्य पाठ में ‘उद्धार’ रखा गया और विकल्प पादटिप्पणी में दिए गए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। वाक्य की संक्षिप्त तर्क-रचना और अय्यूब के कथन में निहित न्यायिक तथा उद्धार-संबंधी तनाव को बिना सांप्रदायिक व्याख्या जोड़े सुरक्षित रखा गया है।
