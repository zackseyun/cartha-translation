  text: What you know[a], I also know; I am not inferior to you.
translation:
  language: hi
  text: जो कुछ तुम जानते हो, वह मैं भी जानता हूँ; मैं तुमसे कम नहीं हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּדַעְתְּכֶם
  choice: जो कुछ तुम जानते हो
  rationale: כְּ के साथ דַּעַת और द्वितीय पुरुष बहुवचन प्रत्यय यहाँ अय्यूब के ज्ञान की उसके मित्रों के ज्ञान से तुलना करते हैं। यह हिंदी रूप स्वाभाविक है और अगले कथन ‘मैं भी जानता हूँ’ के साथ स्पष्ट समानांतर बनाता है।
- source_word: יָדַעְתִּי
  choice: मैं जानता हूँ
  rationale: यद्यपि रूप पूर्णकालिक है, यहाँ ज्ञान की वर्तमान अवस्था व्यक्त करता है; इसलिए हिंदी वर्तमान काल उपयुक्त है।
- source_word: גַם אָנִי
  choice: मैं भी
  rationale: גַם अय्यूब के समान ज्ञान रखने पर बल देता है; ‘मैं भी’ आधुनिक हिंदी में सहज और स्पष्ट है।
- source_word: לֹא נֹפֵל אָנֹכִי מִכֶּם
  choice: मैं तुमसे कम नहीं हूँ
  rationale: נֹפֵל के साथ מִן तुलनात्मक अर्थ में किसी से नीचे या कम होने को दर्शाता है। ‘तुमसे कम नहीं’ मूल रूपक की तुलनात्मक शक्ति को स्वाभाविक हिंदी में बनाए रखता है और संदर्भ में बौद्धिक हीनता के निषेध को बिना अनावश्यक व्याख्या के व्यक्त करता है।
- source_word: אָנֹכִי
  choice: मैं ... हूँ
  rationale: स्वतंत्र सर्वनाम कर्ता पर बल देता है; हिंदी में स्पष्ट ‘मैं’ के प्रयोग से यह बल पर्याप्त रूप से व्यक्त होता है।
