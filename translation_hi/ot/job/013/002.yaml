translation_notes:
  register: आधुनिक मानक हिंदी; संबोधन बहुवचन ‘तुम’ मित्रों के प्रति सीधा, स्वाभाविक और गरिमापूर्ण है। वाक्य संक्षिप्त रखा गया है और इब्रानी समानांतरता सुरक्षित है। अंग्रेज़ी परामर्श-पाठ की पादटिप्पणी वास्तव में पहले खंड से नहीं, दूसरे खंड के वैकल्पिक शब्दांकन से संबंधित प्रतीत होती है; चुने हुए हिंदी पाठ ‘कम नहीं’ में वह अर्थ सीधे और स्वाभाविक रूप से समाहित है, इसलिए पादटिप्पणी नहीं जोड़ी गई।
