  text: כִּֽי תִכְתֹּ֣ב עָלַ֣/י מְרֹר֑וֹת וְ֝/תוֹרִישֵׁ֗/נִי עֲוֺנ֥וֹת נְעוּרָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/026.yaml
  text: For you write bitter things against me and make me inherit the iniquities of my youth[a][b].
translation:
  language: hi
  text: 'क्योंकि तू मेरे विरुद्ध कड़वी बातें लिखता है[a]

    और मुझे मेरी जवानी के अधर्मों का वारिस बनाता है[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तू मेरे विरुद्ध कड़वे निर्णय लिखता है।” इब्रानी में शाब्दिक रूप से “तू मेरे विरुद्ध कड़वी बातें लिखता है” है।
    reason: lexical_alternative
  - marker: b
    text: या, “मुझसे मेरी जवानी के अधर्मों का दोष” अथवा “दण्ड भुगतवाता है।” इब्रानी शब्द अधर्म, दोष, या उसके परिणाम को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद अय्यूब की शिकायत का कारण आगे रखता है; हिन्दी में ‘क्योंकि’ तर्क-संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: תִכְתֹּב עָלַי
  choice: तू मेरे विरुद्ध ... लिखता है
  rationale: כתב का मूल अर्थ ‘लिखना’ है और עָלַי यहाँ विरोध या अभियोग का भाव देता है। ‘लिखता है’ मूल रूपक को बनाए रखता है, जबकि पादटिप्पणी में ‘निर्णय लिखना’ का संभावित आशय दिया गया है।
- source_word: מְרֹרוֹת
  choice: कड़वी बातें
  rationale: बहुवचन संज्ञा का अर्थ व्यापक रूप से कड़वी या दुःखद बातें है। यह अनुवाद इन्हें केवल आरोप, दण्डादेश या दुःख मानकर अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: וְתוֹרִישֵׁנִי
  choice: मेरे हिस्से में डालता है
  rationale: ירשׁ के हिफ़ील रूप में किसी को कुछ विरासत या हिस्से के रूप में दिलाने का कारक भाव है। शाब्दिक ‘वारिस बनाता है’ हिन्दी में यह भ्रम पैदा कर सकता है कि अधर्म किसी दूसरे व्यक्ति से मिले हैं; ‘मेरे हिस्से में डालता है’ मूल आवंटन और भोगने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עֲוֺנוֹת
  choice: अधर्म
  rationale: עָוֹן में अधर्म, उससे उत्पन्न दोष और उसके दण्ड—तीनों अर्थ-छायाएँ हो सकती हैं। ‘अधर्म’ मुख्य पाठ में नैतिक बुराई का व्यापक अर्थ बनाए रखता है, और पादटिप्पणी अन्य संभावनाएँ स्पष्ट करती है।
- source_word: נְעוּרָי
  choice: मेरी जवानी के
  rationale: यह प्रथम पुरुष एकवचन प्रत्यय सहित ‘मेरी जवानी’ है; सम्बन्धसूचक हिन्दी पदबंध मूल संरचना को सीधे व्यक्त करता है।
theological_decisions:
- issue: עֲוֺנוֹת का प्रसंगगत अर्थ
  choice: जवानी के अधर्म, जिनके दोष या परिणाम अब अय्यूब के हिस्से में डाले जा रहे हैं
  alternative: मेरी जवानी के पापों का दोष अथवा दण्ड
  rationale: इब्रानी शब्द स्वयं पाप, दोष या उसके दण्ड को सूचित कर सकता है। मुख्य पाठ ‘अधर्म’ रखकर इस धर्मवैचारिक तनाव को खुला छोड़ता है; पादटिप्पणी संभावित दोष और दण्ड के अर्थ बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक समानांतरता वाला रूप रखा गया है। परमेश्वर को सीधे संबोधित करने के कारण एकवचन ‘तू’ मूल इब्रानी की निकटता और अय्यूब की तीखी व्यक्तिगत शिकायत को बनाए रखता है।
