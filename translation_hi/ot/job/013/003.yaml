  text: But I would speak to the Almighty[a], and I desire to argue with God.
translation:
  language: hi
  text: परन्तु मैं सर्वशक्तिमान से बोलना चाहता हूँ, और परमेश्वर से वाद-विवाद करना चाहता हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אוּלָם
  choice: परन्तु
  rationale: यह अय्यूब की अपने मित्रों को दी गई पिछली फटकार के विपरीत उसके संकल्प को प्रबल विरोधात्मक ढंग से प्रस्तुत करता है।
- source_word: שַׁדַּי
  choice: सर्वशक्तिमान
  rationale: ईश्वरीय उपाधि का अर्थानुसार अनुवाद किया गया है; अय्यूब में यह स्वाभाविक और स्थापित हिन्दी रूप है।
- source_word: אֲדַבֵּר
  choice: बात करना चाहता हूँ
  rationale: यह अपूर्ण क्रिया यहाँ केवल भविष्य नहीं, बल्कि अय्यूब की इच्छा और संकल्प व्यक्त करती है।
- source_word: וְהוֹכֵחַ
  choice: अपना पक्ष रखना
  rationale: יכח के हिफ़ील रूप में यहाँ न्यायिक/विवादात्मक भाव है—अपने तर्क या मामले को सामने रखना; यह हिन्दी में स्वाभाविक रूप से उस आशय को व्यक्त करता है।
- source_word: אֶל אֵל
  choice: परमेश्वर के सामने
  rationale: पूर्वसर्ग אֶל सामान्यतः ‘की ओर/से’ है, पर न्यायिक संदर्भ में हिन्दी का ‘के सामने अपना पक्ष रखना’ लक्षित दिशा और मामले की प्रस्तुति दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֶחְפָּץ
  choice: चाहता हूँ
  rationale: यह प्रबल इच्छा या अभिलाषा बताता है; आधुनिक हिन्दी में ‘चाहता हूँ’ स्पष्ट, सहज और गरिमापूर्ण है।
theological_decisions:
- issue: שַׁדַּי और אֵל जैसी दो अलग ईश्वरीय पदवियों का अनुवाद
  choice: ‘सर्वशक्तिमान’ और ‘परमेश्वर’
  alternative: ‘शद्दाई’ और ‘परमेश्वर’, अथवा दोनों स्थानों पर एक ही पद
  rationale: मूल में प्रयुक्त दोनों अलग पदों की अर्थगत तथा शैलीगत भिन्नता बनाए रखी गई है, बिना उन्हें कृत्रिम रूप से एक जैसा किए।
- issue: וְהוֹכֵחַ का न्यायिक अथवा सामान्य विवादात्मक अर्थ
  choice: ‘अपना पक्ष रखना’
  alternative: ‘बहस करना’ या ‘तर्क-वितर्क करना’
  rationale: यह चुनाव मूल के न्यायिक भाव को सामने लाता है, पर अय्यूब के कथन को अनावश्यक रूप से झगड़ालू नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य। ‘बात करना चाहता हूँ’ और ‘अपना पक्ष रखना चाहता हूँ’ की समानांतर संरचना मूल की इच्छा/संकल्प की पुनरुक्ति बनाए रखती है।
