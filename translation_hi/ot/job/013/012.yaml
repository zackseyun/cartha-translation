translation:
  language: hi
  text: तुम्हारी उक्तियाँ राख की कहावतें हैं[a]; तुम्हारे बचाव मिट्टी के बचाव हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारी स्मृतियाँ राख की कहावतें हैं; तुम्हारे गढ़ मिट्टी के गढ़ हैं।” इब्रानी अत्यंत संक्षिप्त है और अंतिम पदबंध कठिन है; “बचाव/गढ़” बार-बार आए संज्ञा-पद का प्रसंगानुसार अनुवाद है।
    reason: alternative_reading
lexical_decisions:
- source_word: זִכְרֹנֵיכֶם
  choice: तुम्हारी यादगार उक्तियाँ
  rationale: मूल संज्ञा स्मरण या स्मारक से जुड़ी है; प्रसंग में यह मित्रों की स्मरणीय अथवा प्रामाणिक मानी जाने वाली उक्तियों की ओर संकेत करती है। यह अनुवाद मूल अर्थ और प्रसंगगत भाव दोनों को बनाए रखता है।
- source_word: מִשְׁלֵי
  choice: कहावतें
  rationale: מָשָׁל का सामान्य अर्थ कहावत, सूक्ति या दृष्टान्त है। यहाँ संज्ञात्मक रूपक को बनाए रखने के लिए ‘कहावतें’ चुना गया है।
- source_word: אֵפֶר
  choice: राख
  rationale: इसका सामान्य और सीधा अर्थ ‘राख’ है, जो निरर्थकता और भंगुरता के रूपक को सुरक्षित रखता है।
- source_word: לְגַבֵּי
  choice: हैं
  rationale: संक्षिप्त काव्यात्मक इब्रानी में यह पदबंध विधेयात्मक पहचान या तुलना का काम करता प्रतीत होता है; स्वाभाविक हिन्दी में संयोजक क्रिया ‘हैं’ आवश्यक है।
- source_word: חֹמֶר
  choice: मिट्टी
  rationale: חֹמֶר चिकनी मिट्टी, गारा या मिट्टी जैसे पदार्थ को सूचित कर सकता है। ‘मिट्टी’ सामान्य पाठक के लिए स्वाभाविक है और निर्बल, आसानी से टूटने वाली रक्षा का बिंब देता है।
- source_word: גַּבֵּיכֶם
  choice: तुम्हारी रक्षाएँ
  rationale: גַּב का मूल अर्थ पीठ या उभरी हुई सतह है, पर इस कठिन काव्य-पंक्ति में इसे प्रसंगानुसार रक्षात्मक संरचनाओं या मोर्चों के रूप में समझा जा सकता है। ‘रक्षाएँ’ इस व्यंजना को संक्षेप में व्यक्त करता है, जबकि शाब्दिक ‘पीठें’ हिन्दी में अत्यंत अस्पष्ट होगा।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, संक्षिप्त काव्यात्मक शैली रखी गई है। इब्रानी की जानबूझकर कठोर समानांतरता को ‘राख की कहावतें’ और ‘मिट्टी की रक्षाएँ’ में सुरक्षित रखा गया है; कठिन पाठ को मुख्य अनुवाद में अत्यधिक स्पष्ट नहीं किया गया और वैकल्पिक पाठ पादटिप्पणी में दिया गया है।
