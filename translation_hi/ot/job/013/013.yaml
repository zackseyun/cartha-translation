  yaml_path: translation/ot/job/013/013.yaml
  text: Be silent before me[a], and let me speak; then let come upon me what may.
translation:
  language: hi
  text: मेरे सामने चुप रहो[a], और मुझे बोलने दो; फिर मुझ पर जो कुछ आए, आने दो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक अनुवाद: “मुझसे चुप रहो, और मैं बोलूँ; और जो कुछ हो, वह मुझ पर से गुज़र जाए।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲרִישׁוּ
  choice: चुप रहो
  rationale: बहुवचन हिफ़ील आज्ञार्थक यहाँ चुप होने या चुप रहने की दृढ़ आज्ञा देता है; ‘चुप रहो’ आधुनिक हिंदी में स्वाभाविक और स्पष्ट है।
- source_word: מִמֶּנִּי
  choice: मेरे सामने
  rationale: शाब्दिक अर्थ ‘मुझसे’ है, पर החרישׁוּ के साथ यह अय्यूब के संबंध में बोलना बंद करने का भाव देता है; ‘मेरे सामने’ इस संबंधपरक अर्थ को सहज हिंदी में व्यक्त करता है।
- source_word: וַאֲדַבְּרָה אָנִי
  choice: और मुझे बोलने दो
  rationale: प्रथम पुरुष कोहोर्टेटिव बोलने की इच्छा या दृढ़ संकल्प प्रकट करता है। स्वतंत्र सर्वनाम אָנִי के बल को प्रसंग में ‘मुझे’ स्वाभाविक रूप से वहन करता है।
- source_word: וְיַעֲבֹר עָלַי
  choice: फिर मुझ पर ... आए
  rationale: עבר का मूल भाव ‘पार होना/गुज़रना’ है, किंतु עַל के साथ यहाँ किसी बात के व्यक्ति पर आ पड़ने का मुहावरेदार अर्थ है; ‘मुझ पर आए’ जुस्सिव भाव को स्वाभाविक हिंदी में रखता है।
- source_word: מָה
  choice: जो कुछ
  rationale: यहाँ प्रश्नवाचक नहीं बल्कि अनिश्चित अर्थ है—‘जो भी हो’; ‘जो कुछ’ अय्यूब की परिणाम स्वीकार करने की तत्परता को बिना अधिक व्याख्या के व्यक्त करता है।
