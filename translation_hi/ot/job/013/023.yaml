  rationale: פֶּשַׁע जानबूझकर सीमा लाँघने या विद्रोह का भाव रख सकता है। ‘अपराध’ प्रसंग में उपयुक्त नैतिक गंभीरता रखता है, पर ‘विद्रोह’ जितना अर्थ को सीमित नहीं करता।
- source_word: וְחַטָּאתִי
  choice: और मेरे पाप
  rationale: एकवचन तथा प्रथम पुरुष प्रत्यय को स्पष्ट रखते हुए यह मूल के समान ‘अपराध’ और ‘पाप’ की जोड़ी बनाए रखता है।
