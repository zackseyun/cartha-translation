  terminology: “वाद-विवाद करेगा” preserves the adversarial/forensic coloring of ריב without imposing a formal courtroom setting. “चुप रहूँगा” more directly represents the Hebrew ‘I will be silent.’ The alternative sense of עַתָּה (‘now’) remains appropriately retained in the footnote.
