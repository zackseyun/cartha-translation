    reason: lexical_alternative
lexical_decisions:
- source_word: מִי הוּא
  choice: कौन है
  rationale: प्रश्नवाचक शब्द के साथ स्वतंत्र सर्वनाम बल देता है; आधुनिक हिन्दी में “कौन है” इस आलंकारिक चुनौती को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יָרִיב
  choice: मुक़दमा लड़ेगा
  rationale: ריב में यहाँ न्यायिक और विरोधात्मक भाव है। “मुक़दमा लड़ेगा” उस कानूनी संदर्भ को स्पष्ट रखते हुए सामान्य पाठक के लिए सहज है।
- source_word: עִמָּדִי
  choice: मुझसे
  rationale: इस क्रिया के साथ संबंध विरोधी विवाद का है; हिन्दी में “मुझसे मुक़दमा लड़ना” स्वाभाविक प्रयोग है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह अय्यूब की चुनौती के परिणाम अथवा आधार को जोड़ता है; “क्योंकि” तर्क-संबंध को स्पष्ट रखता है।
- source_word: עַתָּה
  choice: तब
  rationale: शब्द का सामान्य अर्थ “अब” है, पर इस तर्क में इसे पूर्ववर्ती चुनौती के संभावित परिणाम, “तब,” के रूप में समझना प्रसंगानुकूल है; शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: אַחֲרִישׁ
  choice: मैं चुप हो जाऊँगा
  rationale: यह मौन हो जाने या मौन रहने को व्यक्त करता है। भविष्यकालीन हिन्दी रूप संदर्भगत परिणाम को सहजता से प्रकट करता है।
- source_word: וְאֶגְוָע
  choice: और मर जाऊँगा
  rationale: גוע प्राण निकलने या मरने को दर्शाता है; “मर जाऊँगा” सरल, स्वाभाविक और कथन की तीव्रता के अनुरूप है।
