  text: Though he slay me[a], I will not hope; yet I will argue my ways before him.
translation:
  language: hi
  text: चाहे वह मुझे मार डाले,[a] मैं आशा नहीं रखूँगा; फिर भी मैं उसके सामने अपने मार्गों का पक्ष रखूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'पारंपरिक अनुवाद: “चाहे वह मुझे मार डाले, फिर भी मैं उसी पर आशा रखूँगा।” यह इब्रानी पाठ के एक वैकल्पिक पठन को दर्शाता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: הֵן
  choice: चाहे
  rationale: यहाँ הֵן अगले कथन को रियायती भाव देता है; आधुनिक हिन्दी में “चाहे” इस अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יִקְטְלֵנִי
  choice: वह मुझे मार डाले
  rationale: קטל का अर्थ मार डालना है। “मार डाले” अय्यूब के कथन की गंभीरता बनाए रखते हुए सहज आधुनिक हिन्दी है।
- source_word: לֹא אֲיַחֵל
  choice: मैं आशा नहीं रखूँगा
  rationale: प्रस्तुत मसोराई पाठ में לֹא स्पष्ट निषेध है। יחל में प्रतीक्षा और आशा दोनों के अर्थ संभव हैं; इस प्रसंग और प्रचलित धार्मिक अर्थ-संघर्ष को ध्यान में रखते हुए “आशा नहीं रखूँगा” मूल की तनावपूर्ण अभिव्यक्ति को बनाए रखता है।
- source_word: אַךְ
  choice: फिर भी
  rationale: यह संभावित मृत्यु और अय्यूब के अपना पक्ष रखने के निश्चय के बीच विरोध सूचित करता है।
- source_word: דְּרָכַי
  choice: अपने मार्गों
  rationale: शाब्दिक बिंब “मेरे मार्ग” रखा गया है; यहाँ इससे अय्यूब के आचरण और जीवन-चाल का संकेत मिलता है।
- source_word: אֶל־פָּנָיו
  choice: उसके सामने
  rationale: शाब्दिक अर्थ “उसके मुख के सामने” है; “उसके सामने” हिन्दी में परमेश्वर की प्रत्यक्ष उपस्थिति में बोलने का स्वाभाविक रूप है।
- source_word: אוֹכִיחַ
  choice: पक्ष में तर्क दूँगा
  rationale: יכח का हिफ़ील रूप यहाँ न्यायिक अथवा विवादात्मक प्रसंग में अपना मामला प्रस्तुत करने और सिद्ध करने का भाव रखता है। “पक्ष में तर्क दूँगा” इस अर्थ को स्पष्ट करता है।
theological_decisions:
- issue: לֹא (‘नहीं’) वाले मसोराई पाठ और לוֹ (‘उसमें/उस पर’) पर आधारित पारंपरिक पाठ के बीच चयन
  choice: मुख्य पाठ में मसोराई व्यंजन-पाठ के अनुसार “मैं आशा नहीं रखूँगा”
  alternative: “चाहे वह मुझे मार डाले, फिर भी मैं उसी पर आशा रखूँगा”
  rationale: दिया गया इब्रानी पाठ לֹא, अर्थात् “नहीं,” पढ़ता है। इसलिए मुख्य पाठ उसी का अनुसरण करता है और पारंपरिक, धर्मवैचारिक रूप से महत्त्वपूर्ण वैकल्पिक पाठ को पादटिप्पणी में सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। “मार डाले” गंभीरता बनाए रखता है, जबकि “अपने मार्गों के पक्ष में तर्क दूँगा” अय्यूब के न्यायिक-विवादात्मक स्वर को स्पष्ट करता है।
