  text: Will it be good when he examines you? Or will you mock him as one mocks a man?[a][b]
translation:
  language: hi
  text: जब वह तुम्हारी जाँच करेगा, तब क्या यह तुम्हारे लिए अच्छा होगा? या जैसे कोई किसी मनुष्य को धोखा देता है,[a] वैसे ही क्या तुम उसे धोखा दोगे?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘धोखा देना’ का अनुवाद ‘उपहास करना’ या ‘उसके साथ खिलवाड़ करना’ भी हो सकता है; इब्रानी क्रिया में ये अर्थ संभव हैं।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ ‘एक मनुष्य’; यहाँ आशय परमेश्वर के विपरीत एक साधारण, नश्वर मनुष्य से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲטוֹב
  choice: क्या तुम्हारा भला होगा
  rationale: प्रश्नवाचक הֲ के साथ טוֹב यहाँ परिणाम को लेकर आलंकारिक प्रश्न बनाता है; ‘तुम्हारा भला होगा’ स्वाभाविक हिन्दी में आसन्न जाँच के प्रतिकूल परिणाम का संकेत देता है।
- source_word: כִּי
  choice: जब
  rationale: यहाँ כִּי उस परिस्थिति या समय का परिचय देता है जिसमें परिणाम सामने आएगा; इसलिए ‘जब’ उपयुक्त है।
- source_word: יַחְקֹר אֶתְכֶם
  choice: वह तुम्हारी जाँच करेगा
  rationale: חקר का अर्थ गहराई से खोजने या परखने का है। ‘जाँच करेगा’ आधुनिक हिन्दी में स्पष्ट है और दूसरे पुरुष बहुवचन को ‘तुम्हारी’ से व्यक्त करता है।
- source_word: אִם
  choice: या
  rationale: समानांतर आलंकारिक प्रश्न में אִם दूसरा विकल्प प्रस्तुत करता है; हिन्दी में ‘या’ स्वाभाविक है।
- source_word: כְהָתֵל בֶּאֱנוֹשׁ
  choice: जैसे किसी मनुष्य को धोखा देते हैं
  rationale: התל में धोखा देने, उपहास करने या किसी से खेल करने का अर्थ हो सकता है। प्रसंग में मनुष्य के साथ की जाने वाली छलपूर्ण चाल की तुलना परमेश्वर के साथ वैसा करने से है; ‘धोखा देना’ इस वाक्य में स्वाभाविक और अर्थसंगत है।
- source_word: אֱנוֹשׁ
  choice: मनुष्य
  rationale: אֱנוֹשׁ मनुष्य की दुर्बल या नश्वर दशा को सूचित कर सकता है। मुख्य पाठ में ‘मनुष्य’ सहज है; नश्वरता का भाव पादटिप्पणी में स्पष्ट किया गया है।
- source_word: תְּהָתֵלּוּ בוֹ
  choice: तुम उसे भी धोखा दोगे
  rationale: हिफ़ील अपूर्ण क्रिया दूसरे पुरुष बहुवचन में है और בוֹ लक्ष्य को दर्शाता है। ‘भी’ तुलना को हिन्दी में स्पष्ट करता है; क्रिया की व्यापक अर्थ-सीमा पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: एकवचन तीसरे पुरुष सर्वनाम का संदर्भ
  choice: ‘वह/उसे’ का संदर्भ परमेश्वर है, पर नाम को मुख्य पाठ में नहीं जोड़ा गया
  alternative: कोई अनिर्दिष्ट जाँचकर्ता या न्यायी
  rationale: अय्यूब 13:7–11 का निकट प्रसंग परमेश्वर की ओर से पक्षपातपूर्ण बोलने वालों को उसकी जाँच की चेतावनी देता है। फिर भी इब्रानी पद में संज्ञा के स्थान पर सर्वनाम है, इसलिए अनुवाद उसी रूप को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘तुम’ बहुवचन संबोधन है। दोनों आलंकारिक प्रश्नों की तीक्ष्णता तथा इब्रानी क्रिया התל की अर्थगत अस्पष्टता को मुख्य पाठ और पादटिप्पणी के द्वारा सुरक्षित रखा गया है।
