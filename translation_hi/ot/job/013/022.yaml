  text: Then call[a], and I will answer; or let me speak, and you reply to me.
translation:
  language: hi
  text: तब पुकार, और मैं उत्तर दूँगा; या मुझे बोलने दे, और तू मुझे उत्तर दे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּקְרָא
  choice: तब पुकार
  rationale: קרא का पुल्लिंग एकवचन आज्ञार्थक रूप है। आरंभिक וּ को प्रसंग में दो वैकल्पिक संवाद-क्रमों की पहली स्थिति बताते हुए स्वाभाविक हिन्दी में ‘तब’ कहा गया है।
- source_word: וְאָנֹכִי אֶעֱנֶה
  choice: और मैं उत्तर दूँगा
  rationale: स्वतंत्र सर्वनाम אָנֹכִי कर्ता पर बल देता है, जिसे स्पष्ट ‘मैं’ से रखा गया है; ענה का अपूर्ण रूप यहाँ प्रत्युत्तर देने की भावी/संकल्पात्मक क्रिया व्यक्त करता है।
- source_word: אוֹ אֲדַבֵּר
  choice: या मुझे बोलने दे
  rationale: אוֹ दूसरा विकल्प प्रस्तुत करता है। דבר का पिएल अपूर्ण प्रथम पुरुष रूप इस पारस्परिक चुनौती में प्रस्तावात्मक अर्थ रखता है, इसलिए स्वाभाविक हिन्दी में ‘मुझे बोलने दे’ चुना गया है।
- source_word: וַהֲשִׁיבֵנִי
  choice: और तू मुझे उत्तर दे
  rationale: שוב का हिफ़ील आज्ञार्थक रूप, प्रथम पुरुष प्रत्यय सहित, यहाँ ‘मुझे प्रत्युत्तर दे’ के अर्थ में है। ‘उत्तर दे’ सामान्य, स्पष्ट और गरिमापूर्ण हिन्दी है।
theological_decisions:
- issue: अय्यूब द्वारा परमेश्वर को सीधे संबोधन की स्पष्टता
  choice: एकवचन अनौपचारिक/निकट संबोधन ‘तू’
  alternative: सम्मानसूचक ‘आप’
  rationale: हिब्रू क्रियाएँ स्पष्ट रूप से द्वितीय पुरुष पुल्लिंग एकवचन हैं और बाइबिलीय हिन्दी में परमेश्वर के सीधे एकवचन संबोधन के लिए ‘तू’ मूल की व्याकरणिक निकटता तथा गंभीरता बनाए रखता है; यह अनादर का संकेत नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, प्रत्यक्ष और न्याय-विवाद जैसे पारस्परिक संवाद का स्वर सुरक्षित रखा गया है। पद में कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि आरंभिक וּ का प्रसंगगत ‘तब’ और אֲדַבֵּר का प्रस्तावात्मक ‘मुझे बोलने दे’ मुख्य पाठ में स्वाभाविक रूप से व्यक्त हैं।
