base_translation:
  language: en
  yaml_path: translation/ot/job/013/021.yaml
  text: Withdraw your hand far from me[b][a], and do not let your dread terrify me.
translation:
  language: hi
  text: अपना हाथ मुझ पर से दूर कर ले[a], और तेरा आतंक[b] मुझे भयभीत न करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपना हाथ मुझ पर से हटा ले।”
    reason: lexical_alternative
  - marker: b
    text: या, “तेरी दहशत।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּפְּךָ
  choice: अपना हाथ
  rationale: כַּף का मूल अर्थ हथेली/हाथ है। यहाँ परमेश्वर के दबाव या प्रहार की सजीव रूपकात्मक छवि को बनाए रखने के लिए ‘हाथ’ स्वाभाविक है।
- source_word: מֵעָלַי הַרְחַק
  choice: मुझ पर से दूर कर ले
  rationale: מֵעָלַי ‘मुझ पर से’ की छवि रखता है और हिफ़ील आज्ञार्थक הַרְחַק किसी वस्तु को दूर करने का आदेश देता है। यह अनुवाद दोनों तत्वों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֵמָתְךָ
  choice: तेरा आतंक
  rationale: אֵימָה भय उत्पन्न करने वाले आतंक या दहशत को दर्शाता है। ‘तेरा आतंक’ इस अर्थ को बनाए रखता है कि यह परमेश्वर से जुड़ा हुआ आतंक है, केवल अय्यूब की आंतरिक भय-भावना नहीं।
- source_word: אַל תְּבַעֲתַנִּי
  choice: मुझे भयभीत न करे
  rationale: בעת का अर्थ आतंकित या भयभीत करना है। स्त्रीलिंग कर्ता אֵמָתְךָ के साथ हिन्दी में यह निषेध स्वाभाविक और मूल वाक्य-विन्यास के निकट है।
theological_decisions:
- issue: परमेश्वर के लिए मानवाकार भाषा—‘तेरा हाथ’
  choice: ‘हाथ’ की ठोस छवि को बनाए रखा गया।
  alternative: तेरी शक्ति; तेरा प्रहार
  rationale: मूल पाठ जानबूझकर शरीर-संबंधी रूपक का प्रयोग करता है। ‘शक्ति’ या ‘प्रहार’ कहना यह पहले से तय कर देगा कि हाथ किस विशेष कार्य को दर्शाता है।
- issue: אֵמָתְךָ में संबंध की अस्पष्टता
  choice: ‘तेरा आतंक’
  alternative: तेरा भय; तुझसे होने वाला भय
  rationale: संबंधवाचक प्रत्यय यह स्पष्ट नहीं करता कि जोर परमेश्वर के आतंककारी प्रभाव पर है या उससे उत्पन्न भय पर। ‘तेरा आतंक’ इस तनाव को अपेक्षाकृत बनाए रखता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी अपनाई गई है। परमेश्वर को सीधे संबोधित करते हुए ‘तेरा’ और ‘कर ले’ का प्रयोग मूल के एकवचन निकट संबोधन तथा प्रचलित हिन्दी बाइबलीय शैली के अनुरूप है; भाषा को अनावश्यक रूप से संस्कृतनिष्ठ नहीं बनाया गया।
