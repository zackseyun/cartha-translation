  source_fidelity: ‘अपना हाथ मुझ पर से दूर कर ले’ faithfully conveys the Hiphil imperative הַרְחַק with מֵעָלַי, retaining the image of God’s hand resting upon Job while expressing removal. ‘तेरा आतंक मुझे भयभीत न करे’ accurately represents the feminine subject אֵמָתְךָ and the prohibitive force of אַל תְּבַעֲתַנִּי.
  naturalness: The Hindi is clear, modern, and suitably dignified. The direct singular address is internally consistent and appropriate to Job’s direct address to God. ‘मुझ पर से दूर कर ले’ is idiomatic enough and preserves both removal and distance.
  terminology: ‘हाथ’ properly preserves the concrete anthropomorphic metaphor without narrowing it to power or punishment. ‘आतंक’ is a strong but fitting rendering of אֵימָה; the footnote supplies ‘दहशत’ as a legitimate lexical alternative. The negative clause naturally expresses the Hebrew request not to be terrified.
