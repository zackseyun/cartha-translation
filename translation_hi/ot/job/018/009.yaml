lexical_decisions:
- source_word: יֹאחֵז
  choice: पकड़ लेता है
  rationale: अחז के काल रूप में किसी को पकड़ने या अपने वश में लेने का सजीव भाव है; ‘पकड़ लेता है’ फंदे की क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּעָקֵב
  choice: उसकी एड़ी
  rationale: עָקֵב का अर्थ ‘एड़ी’ है; בְּ यहाँ पकड़ने के स्थान को सूचित करता है। हिन्दी में ‘उसकी एड़ी पकड़ लेता है’ यही संबंध सहजता से व्यक्त करता है।
- source_word: פָּח
  choice: फंदा
  rationale: פָּח जाल या फंदे का द्योतक है। ‘फंदा’ पैर के पकड़े जाने की छवि के अनुकूल है और अगले दुर्लभ संज्ञा-पद से भेद बनाए रखता है।
- source_word: יַחֲזֵק
  choice: कसकर जकड़ लेता है
  rationale: חזק का हिफ़ील रूप यहाँ दृढ़ता से पकड़ लेने या काबू में रखने का भाव देता है; यह चयन पहले खंड की समानांतरता और क्रिया की तीव्रता दोनों बनाए रखता है।
- source_word: עָלָיו
  choice: उसे
  rationale: עליו यहाँ व्यक्ति पर लक्षित और उसे वश में करने वाली क्रिया का संबंध बताता है; हिन्दी में ‘उसे ... जकड़ लेता है’ स्वाभाविक है।
- source_word: צַמִּים
  choice: पाश
  rationale: यह दुर्लभ शब्द किसी विशेष प्रकार के फंदे या फाँस को सूचित कर सकता है। ‘पाश’ अर्थ की व्यापकता और काव्यात्मक गरिमा को बनाए रखते हुए פָּח से शब्दगत भेद रखता है।
