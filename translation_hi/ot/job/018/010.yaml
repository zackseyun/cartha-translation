  yaml_path: translation/ot/job/018/010.yaml
  text: His rope is hidden in the ground[a], and his trap on the path.
translation:
  language: hi
  text: उसकी रस्सी भूमि में छिपी है[a], और उसका फंदा पथ पर है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी डोरी जमीन में छिपी है, और उसका फंदा रास्ते पर है।”
    reason: חַבְלוֹ के लिए “डोरी” और בָּאָרֶץ/נָתִיב के लिए “जमीन”/“रास्ते” स्वाभाविक वैकल्पिक शब्द हैं। מַלְכֻּדֶת के लिए “फंदा” ‘trap/snare’ का सटीक अर्थ बनाए रखता है।
lexical_decisions:
- source_word: טָמוּן
  choice: छिपी है
  rationale: यह טמן का निष्क्रिय कृदन्त है और किसी वस्तु के छिपाकर रखे होने की स्थिति बताता है। हिंदी में “छिपी है” इस भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בָּאָרֶץ
  choice: भूमि में
  rationale: फंदा लगाने के प्रसंग में אֶרֶץ भौतिक जमीन को सूचित करता है। “भूमि में” काव्यात्मक गरिमा रखते हुए इसी स्थानगत अर्थ को व्यक्त करता है।
- source_word: חַבְלוֹ
  choice: उसकी रस्सी
  rationale: חבל का अर्थ रस्सी या डोरी हो सकता है; यहाँ यह फंदे से जुड़ी रस्सी है। “रस्सी” सामान्य पाठक के लिए स्पष्ट और ठोस शब्द है।
- source_word: וּמַלְכֻּדְתּוֹ
  choice: और उसका फंदा
  rationale: מַלְכֹּדֶת किसी को पकड़ने के लिए लगाए गए जाल या फंदे को दर्शाता है। “फंदा” इस पद्य की आखेट-संबंधी छवि को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: עֲלֵי נָתִיב
  choice: पथ पर
  rationale: यह पदबंध रास्ते पर स्थित होने का भाव देता है। “पथ पर” संक्षिप्त, काव्यात्मक और अर्थ की दृष्टि से सटीक है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक मानक हिंदी की है, पर अय्यूब की काव्यात्मक शैली के अनुरूप “भूमि” और “पथ” जैसे गरिमापूर्ण, सहज शब्द रखे गए हैं। समानांतर पंक्तियों की संक्षिप्तता और फंदा लगाने की ठोस छवि सुरक्षित रखी गई है।
