  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण काव्यात्मक शैली रखी गई है। ‘प्रकाश’, ‘आग’ और ‘चिनगारी’ के मूल बिंबों को बिना व्याख्यात्मक विस्तार के सुरक्षित रखा गया है। हिब्रू के सामूहिक बहुवचन और बाद के एकवचन सर्वनाम को सहज हिन्दी में बहुवचन-संगति से व्यक्त किया गया है।
