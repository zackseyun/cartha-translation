  yaml_path: translation/ot/job/018/005.yaml
  text: Indeed[a], the light of the wicked is put out, and the flame of his fire does not shine.
translation:
  language: hi
  text: 'निश्चय ही, दुष्टों का प्रकाश बुझ जाएगा,

    और उनकी आग की चिनगारी[क] नहीं चमकेगी।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: या, ‘उनकी आग की लौ।’ हिब्रू शब्द שְׁבִיב का अर्थ ‘चिनगारी’ या ‘लौ’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: निश्चय ही
  rationale: यहाँ यह केवल जोड़ने वाला शब्द नहीं, बल्कि बिल्दद के कथन पर बल देने वाला अव्यय है; ‘निश्चय ही’ उसका स्वाभाविक हिन्दी रूप है।
- source_word: אוֹר
  choice: प्रकाश
  rationale: मूल शब्द का सीधा अर्थ ‘प्रकाश’ है। समृद्धि या जीवन-दशा के रूपक को स्पष्ट करके बदलने के बजाय मूल बिंब सुरक्षित रखा गया है।
- source_word: רְשָׁעִים
  choice: दुष्टों
  rationale: बहुवचन रूप सामान्य रूप से दुष्ट लोगों के वर्ग को दर्शाता है; ‘दुष्टों का प्रकाश’ हिन्दी में स्वाभाविक है और मूल के बहुवचन को बनाए रखता है।
- source_word: יִדְעָךְ
  choice: बुझ जाएगा
  rationale: क्रिया प्रकाश के मंद होकर समाप्त होने या बुझने को व्यक्त करती है। भविष्यकालीन ‘बुझ जाएगा’ हिब्रू के अपूर्ण रूप और काव्यात्मक घोषणा के अनुकूल है।
- source_word: וְלֹא
  choice: और ... नहीं
  rationale: संयोजक और निषेध को सरल, स्वाभाविक हिन्दी वाक्य-विन्यास में रखा गया है।
- source_word: יִגַּהּ
  choice: चमकेगी
  rationale: यह क्रिया प्रकाश देने या चमकने का अर्थ रखती है; ‘चमकेगी’ आग की चिनगारी के साथ स्वाभाविक है।
- source_word: שְׁבִיב
  choice: चिनगारी
  rationale: इस शब्द का अर्थ ‘चिनगारी’ अथवा आग की चमक/लौ हो सकता है। हिब्रू में एकवचन और आग से निकली चमक के बिंब के लिए ‘चिनगारी’ सीधा और सहज विकल्प है।
- source_word: אִשּׁוֹ
  choice: उनकी आग
  rationale: मूल में ‘आग’ के साथ तीसरे पुरुष पुल्लिंग एकवचन प्रत्यय है, जो सामूहिक ‘दुष्टों’ के प्रतिनिधि सदस्य की ओर लौटता है। आधुनिक हिन्दी में वर्ग-संदर्भ के लिए आदरसूचक नहीं बल्कि संख्या-संगति वाला ‘उनकी’ अधिक स्वाभाविक है।
