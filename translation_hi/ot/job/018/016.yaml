  yaml_path: translation/ot/job/018/016.yaml
  text: His roots dry up beneath[a], and above, his branch withers.
translation:
  language: hi
  text: 'नीचे उसकी जड़ें सूख जाएँगी,

    और ऊपर उसकी शाखा[a] काट दी जाएगी।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी शब्द का सामान्य अर्थ “कटाई” या “फसल” है; यहाँ उसका आशय पौधे की ऊपरी बढ़त या अंकुर से भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִתַּחַת
  choice: नीचे
  rationale: यह स्थानसूचक पद पौधे की नीचे की जड़ों और ऊपर की बढ़त के काव्यात्मक विरोध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שָׁרָשָׁיו
  choice: उसकी जड़ें
  rationale: मूल पाठ में संज्ञा बहुवचन है और उसके साथ तीसरे पुरुष एकवचन पुल्लिंग का संबंधसूचक प्रत्यय है।
- source_word: יִבָשׁוּ
  choice: सूख जाएँगी
  rationale: क्रिया का मूल अर्थ सूखना या सूख जाना है; यह बहुवचन ‘जड़ें’ से मेल खाता है और वनस्पति-बिंब बनाए रखता है।
- source_word: וּמִמַּעַל
  choice: और ऊपर
  rationale: यह पहले चरण के ‘नीचे’ के समानांतर ऊपरी भाग को सामने रखता है।
- source_word: יִמַּל
  choice: काट दी जाएगी
  rationale: यहाँ क्रिया वनस्पति के काटे या छाँटे जाने का भाव देती है। कर्मवाच्य हिन्दी मूल के परिणामकारी भाव को स्पष्ट और स्वाभाविक रूप में व्यक्त करती है; ‘मुरझा जाएगी’ संभव संदर्भगत व्याख्या है, पर काटे जाने का शाब्दिक बल कम कर देती है।
- source_word: קְצִירוֹ
  choice: उसकी शाखा
  rationale: इस संज्ञा का सामान्य अर्थ ‘कटाई/फसल’ है, पर जड़ों के समानांतर यहाँ पौधे की ऊपरी बढ़त अभिप्रेत है। ‘शाखा’ हिन्दी में बिंब को स्पष्ट रखती है, जबकि शब्दगत अनिश्चितता पादटिप्पणी में सुरक्षित है।
