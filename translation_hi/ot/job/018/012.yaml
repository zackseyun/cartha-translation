  yaml_path: translation/ot/job/018/012.yaml
  text: His strength is famished[a], and calamity is ready at his side.
translation:
  language: hi
  text: 'उसका बल भूख से तड़प रहा है,

    और विपत्ति उसकी बगल में तैयार खड़ी है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “विपत्ति उसके लड़खड़ाने के लिए तैयार है।” इब्रानी शब्द का अर्थ “बगल/पहलू” हो सकता है; कुछ व्याख्याओं में इसे “लड़खड़ाना” या “लंगड़ाना” भी समझा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי
  choice: हो जाता है
  rationale: काव्यात्मक संदर्भ में Qal अपूर्ण रूप एक घटती हुई दशा का वर्णन करता है; वर्तमानकालीन ‘हो जाता है’ स्वाभाविक हिन्दी में इस वर्णनात्मक भाव को रखता है, बिना इसे इच्छासूचक बनाने के।
- source_word: רָעֵב
  choice: भूख से चुक जाता है
  rationale: विशेषण का मूल अर्थ ‘भूखा’ है। हिन्दी में ‘बल भूखा है’ अस्वाभाविक लगेगा; ‘भूख से चुक जाता है’ तीव्र अभाव और बल-क्षय की काव्यात्मक छवि को स्वाभाविक रूप में व्यक्त करता है।
- source_word: אֹנוֹ
  choice: उसका बल
  rationale: אוֹן यहाँ शक्ति, सामर्थ्य या जीवन-बल का बोध करा सकता है। आसन्न विपत्ति के प्रसंग में ‘बल’ सबसे संक्षिप्त और संगत विकल्प है; ‘धन-संपत्ति’ सम्भव अर्थ है, पर यहाँ कम उपयुक्त है।
- source_word: וְאֵיד
  choice: और विपत्ति
  rationale: אֵיד विनाशकारी दुर्भाग्य या आपदा को दर्शाता है। ‘विपत्ति’ गरिमापूर्ण काव्यात्मक शैली और अर्थ की तीव्रता दोनों बनाए रखता है।
- source_word: נָכוֹן
  choice: तैयार खड़ी है
  rationale: यह रूप तैयार, दृढ़ या उपस्थित रहने की दशा बताता है। ‘तैयार खड़ी है’ हिन्दी में विपत्ति के निकट और प्रहार के लिए तत्पर होने की सजीव छवि देता है।
- source_word: לְצַלְעוֹ
  choice: उसकी बगल में
  rationale: צלע का सामान्य अर्थ ‘बगल/पहलू’ है, इसलिए मुख्य पाठ में निकटता की ठोस छवि रखी गई है। ‘लड़खड़ाने’ से सम्बन्धित प्रस्तावित अर्थ को पाठ-टिप्पणी में सुरक्षित रखा गया है।
