  register: आधुनिक, सहज और गरिमापूर्ण काव्यात्मक हिन्दी अपनाई गई है। पहली पंक्ति में शाब्दिक ‘उसका बल भूखा है’ के बजाय स्वाभाविक ‘उसका बल भूख से चुक जाता है’ रखा गया है; दूसरी पंक्ति में विपत्ति का मानवीकरण मूल काव्य-चित्र के अनुरूप बनाए रखा गया है।
