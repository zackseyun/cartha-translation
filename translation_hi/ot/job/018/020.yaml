  yaml_path: translation/ot/job/018/020.yaml
  text: Those who come after are appalled at his day[c][b][a], and those who went before are seized with horror.
translation:
  language: hi
  text: उसके दिन को लेकर बाद में आनेवाले स्तब्ध हो जाएँगे[a][b], और पहले के लोगों को सिहरन जकड़ लेगी[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल भाषा में ‘उसके दिन’; सम्भवतः उसकी विपत्ति या न्याय के दिन का संकेत है।
    reason: lexical_alternative
  - marker: b
    text: या ‘बादवाले ... पहलेवाले’; कुछ लोग इस जोड़ी को भौगोलिक अर्थ में ‘पश्चिम के लोग ... पूर्व के लोग’ समझते हैं।
    reason: alternative_reading
  - marker: c
    text: शाब्दिक रूप से, ‘उन्होंने सिहरन को पकड़ा’; यह ऐसा मुहावरा है जिसका अर्थ है कि वे सिहरन या आतंक से जकड़ गए।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל יוֹמוֹ
  choice: उसके दिन को देखकर
  rationale: शाब्दिक अर्थ ‘उसके दिन पर/के कारण’ है। यहाँ यह उस अवसर या घटना को सूचित करता है जो लोगों को स्तब्ध करती है; ‘को देखकर’ आधुनिक हिन्दी में इस संबंध को स्वाभाविक रूप से व्यक्त करता है, जबकि ‘उसके दिन’ की मूल ठोस अभिव्यक्ति सुरक्षित रहती है।
- source_word: נָשַׁמּוּ
  choice: स्तब्ध रह जाएँगे
  rationale: क्रिया विस्मय, उजाड़ कर देनेवाले सदमे या भय से अवाक् रह जाने का भाव देती है। ‘स्तब्ध रह जाएँगे’ प्रसंग में इसकी तीव्र प्रतिक्रिया को सहज हिन्दी में व्यक्त करता है।
- source_word: אַחֲרֹנִים
  choice: बाद में आनेवाले
  rationale: मूल अर्थ ‘बादवाले’ है। कालगत अर्थ संदर्भ और समानांतर पद के साथ सबसे स्वाभाविक है; भौगोलिक अर्थ की संभावना पाद-टिप्पणी में रखी गई है।
- source_word: וְקַדְמֹנִים
  choice: और पहले के लोग
  rationale: शब्द ‘पहले के’ अथवा ‘पूर्वी’ लोगों को सूचित कर सकता है। यहाँ אַחֲרֹנִים के समानांतर कालगत अर्थ चुना गया है।
- source_word: אָחֲזוּ שָׂעַר
  choice: भय से कंपकंपी छूटेगी
  rationale: शाब्दिक रूप से ‘कंपकंपी/सिहरन ने पकड़ लिया’ का मुहावरा है। हिन्दी अभिव्यक्ति ‘भय से कंपकंपी छूटना’ शारीरिक प्रतिक्रिया और आतंक दोनों को स्वाभाविक ढंग से बनाए रखती है।
theological_decisions:
- issue: ‘उसके दिन’ का आशय
  choice: मुख्य पाठ में ‘उसके दिन’ को बनाए रखा गया
  alternative: ‘उसकी विपत्ति का दिन’ या ‘उसके न्याय का दिन’
  rationale: संदर्भ दुष्ट की विपत्ति अथवा न्याय की ओर संकेत करता है, पर मूल पाठ केवल ‘उसका दिन’ कहता है। किसी एक व्याख्या को मुख्य पाठ में निश्चित कर देने के बजाय अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज शैली। कालगत जोड़ी को मुख्य पाठ में रखा गया है और वास्तविक भौगोलिक विकल्प पाद-टिप्पणी में सुरक्षित है।
