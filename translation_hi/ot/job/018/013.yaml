  to: वह उसकी त्वचा के अंगों को निगल जाता है; मृत्यु का पहलौठा उसके अंगों को निगल जाता है।
  rationale: Only the repeated verb is strengthened from “खा जाता है” to “निगल जाता है,” so that the Hindi more fully conveys the destructive poetic consumption of the source and the English audit rendering “devours.” The ambiguous personified expression “मृत्यु का पहलौठा” and its explanatory footnote are retained.
