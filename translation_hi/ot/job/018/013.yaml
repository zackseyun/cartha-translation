  text: It devours the limbs of his skin[a]; the firstborn of death devours his limbs.
translation:
  language: hi
  text: वह उसकी त्वचा के अंगों को निगल जाता है; मृत्यु का पहलौठा उसके अंगों को निगल जाता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֹאכַל
  choice: खा जाता है
  rationale: अपूर्ण काल का रूप यहाँ विनाशकारी ढंग से खा डालने का सजीव काव्यात्मक चित्र देता है। पहले खंड में कर्ता स्पष्ट नहीं है, इसलिए हिन्दी में सामान्य पुल्लिंग सर्वनाम से उसकी अनिश्चितता बनी रहती है।
- source_word: בַּדֵּי / בַּדָּיו
  choice: अंगों / उसके अंगों
  rationale: בדים के ‘भाग, अवयव, अंग’ अर्थों में शरीर और त्वचा के संदर्भ में ‘अंग’ सबसे स्वाभाविक है; दोनों खंडों में पुनरावृत्ति सुरक्षित रखी गई है।
- source_word: עוֹרוֹ
  choice: उसकी त्वचा
  rationale: עוֹר का सामान्य अर्थ ‘त्वचा’ है और शारीरिक पीड़ा के इस संदर्भ में यही स्पष्ट तथा स्वाभाविक हिन्दी है।
- source_word: בְּכוֹר מָוֶת
  choice: मृत्यु का पहलौठा
  rationale: शाब्दिक और रहस्यमय काव्यात्मक संबंध को सुरक्षित रखता है तथा इसे किसी विशेष रोग या मृत्यु के साधन के रूप में सीमित नहीं करता।
theological_decisions:
- issue: בְּכוֹר מָוֶת की व्याख्या
  choice: मुख्य पाठ में ‘मृत्यु का पहलौठा’ का काव्यात्मक व्यक्तिकरण बनाए रखा गया है।
  alternative: सबसे घातक रोग; मृत्यु का प्रमुख दूत; अत्यंत भयानक मृत्यु
  rationale: मूल इब्रानी किसी एक व्याख्या को निश्चित नहीं करती। रूपक को बनाए रखने से वास्तविक अस्पष्टता और काव्यात्मक तनाव सुरक्षित रहते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गंभीर और काव्यात्मक शैली। ‘पहलौठा’ बाइबलीय संदर्भ में परिचित शब्द है और मूल रूपक को ‘सबसे घातक विपत्ति’ जैसे व्याख्यात्मक अनुवाद में समतल होने से बचाता है।
