  text: उसके तम्बू में प्रकाश अँधेरा पड़ जाता है, और उसके ऊपर[a] उसका दीपक बुझ जाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उस पर।’ हिब्रू पूर्वसर्ग का अर्थ ‘पर’ या ‘ऊपर’ हो सकता है; यहाँ सम्भवतः दुष्ट व्यक्ति के ऊपर स्थित दीपक का चित्र है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹר
  choice: उजाला
  rationale: यह सामान्य ठोस अर्थ ‘प्रकाश’ को व्यक्त करता है और तम्बू के भीतर रोशनी के काव्यात्मक चित्र में स्वाभाविक हिन्दी है।
- source_word: חָשַׁךְ
  choice: अँधेरा हो जाता है
  rationale: क्रिया प्रकाश के अँधेरा पड़ने या हो जाने का भाव देती है; यह केवल स्थिर अवस्था बताने के बजाय परिवर्तन को सुरक्षित रखती है।
- source_word: בְּאָהֳלוֹ
  choice: उसके तम्बू में
  rationale: शाब्दिक तम्बू-चित्र को बनाए रखता है, जो काव्य में व्यक्ति के निवास या घराने का संकेत भी दे सकता है।
- source_word: וְנֵרוֹ
  choice: और उसका दीपक
  rationale: נֵר सामान्य प्रकाश नहीं, विशेष रूप से दीपक अथवा उसकी लौ को दर्शाता है; ‘दीपक’ ठोस समानांतर बिंब बनाए रखता है।
- source_word: עָלָיו
  choice: उसके ऊपर
  rationale: עַל का स्थानसूचक अर्थ ‘ऊपर/उसके ऊपर’ यहाँ स्वाभाविक है और दीपक की स्थिति का बिंब सुरक्षित रखता है।
- source_word: יִדְעָךְ
  choice: बुझ जाता है
  rationale: दीपक या आग के बुझने के लिए यह स्पष्ट, स्वाभाविक और गरिमापूर्ण आधुनिक हिन्दी अभिव्यक्ति है।
