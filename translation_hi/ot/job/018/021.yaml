  text: אַךְ אֵ֭לֶּה מִשְׁכְּנ֣וֹת עַוָּ֑ל וְ֝/זֶ֗ה מְק֣וֹם לֹא יָדַֽע אֵֽל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/018/021.yaml
  text: Surely these are the dwellings of the unjust[b][a], and this is the place of one who does not know God.
translation:
  language: hi
  text: 'निश्चय ही ये अन्यायी[a] के निवास हैं,

    और यह उस व्यक्ति का स्थान है जो परमेश्वर को नहीं जानता।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘दुष्ट’।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: निश्चय ही
  rationale: यहाँ यह अव्यय बिल्दद के कथन के समापन पर बल देता है; इसका अर्थ सीमासूचक ‘केवल’ नहीं है।
- source_word: אֵלֶּה
  choice: ऐसे ही
  rationale: संकेतवाचक बहुवचन पीछे वर्णित दशा की ओर संकेत करता है। हिन्दी में ‘निवास ऐसे ही होते हैं’ इस निष्कर्षात्मक संदर्भ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִשְׁכְּנוֹת
  choice: निवास
  rationale: यह शब्द सामान्य रूप से रहने के स्थानों को दर्शाता है; ‘निवास’ गरिमापूर्ण और स्पष्ट है तथा अनावश्यक रूप से ‘तंबू’ का अर्थ निश्चित नहीं करता।
- source_word: עַוָּל
  choice: अन्यायी
  rationale: यह शब्द अन्याय या कुटिलता से पहचाने जाने वाले व्यक्ति को सूचित करता है। ‘अन्यायी’ इसके नैतिक-न्यायिक भाव को बनाए रखता है।
- source_word: וְזֶה
  choice: और यह
  rationale: संयोजक और संकेतवाचक मिलकर समानांतर सार-वाक्य आरम्भ करते हैं।
- source_word: מְקוֹם
  choice: स्थान
  rationale: यह सीधा अर्थ है और पहले चरण के ‘निवास’ के साथ काव्यात्मक समानांतरता बनाए रखता है।
- source_word: לֹא יָדַע אֵל
  choice: जो परमेश्वर को नहीं जानता
  rationale: शाब्दिक संरचना और उसकी जानबूझकर खुली धार्मिक गहराई दोनों सुरक्षित रहती हैं; ‘जानना’ मात्र जानकारी से अधिक संबंधपरक या नैतिक स्वीकार को भी सूचित कर सकता है।
- source_word: אֵל
  choice: परमेश्वर
  rationale: अय्यूब के इस संदर्भ में यह सच्चे परमेश्वर के लिए प्रयुक्त है; हिन्दी बाइबलीय गद्य में ‘परमेश्वर’ स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: ‘परमेश्वर को नहीं जानता’ का अर्थ
  choice: मूल अभिव्यक्ति ‘परमेश्वर को नहीं जानता’ को बिना व्याख्यात्मक विस्तार के रखा गया
  alternative: इसे केवल परमेश्वर के अस्तित्व की जानकारी न होने या स्पष्ट रूप से संबंधपरक अवज्ञा के रूप में परिभाषित करना
  rationale: ज्ञान की यह भाषा बौद्धिक जानकारी के साथ संबंधपरक और नैतिक स्वीकार का भाव भी रख सकती है। अनुवाद इस धार्मिक तनाव को किसी एक व्याख्या में सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण वाक्य-विन्यास रखा गया है। ‘ऐसे ही होते हैं’ पिछले पदों में वर्णित विनाशकारी दशा की ओर संकेत को सहज बनाता है।
