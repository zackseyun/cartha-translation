  text: In his tent dwells no longer his[b][a]; sulfur is scattered over his dwelling.
translation:
  language: hi
  text: उसके तंबू में ऐसी चीज़ रहेगी जो उसकी नहीं है[a]; उसके निवास पर गंधक बिखेरा जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी वाक्य-विन्यास कठिन है। पहले उपवाक्य का स्त्रीलिंग कर्ता स्पष्ट नहीं है। इसका अर्थ यह भी समझा गया है: “उसके तंबू में गंधक बसेगी—वह अब उसका नहीं रहा”; अथवा यह किसी परायी उपस्थिति के उसके तंबू में बसने का संकेत हो सकता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: תִּשְׁכּוֹן
  choice: बसेगी
  rationale: שׁכן का मूल अर्थ ‘बसना/निवास करना’ है। स्त्रीलिंग क्रिया को पद के अंत में आए स्त्रीलिंग संज्ञा גָפְרִית (‘गंधक’) से जोड़ना व्याकरणतः संभव है और विनाश के बाद तंबू पर छाए न्याय के चित्र को बनाए रखता है।
- source_word: בְּאָהֳלוֹ
  choice: उसके तंबू में
  rationale: אֹהֶל का ठोस अर्थ ‘तंबू’ है; अय्यूब की आवास-संबंधी काव्यात्मक छवि को बनाए रखने के लिए इसे सामान्य ‘घर’ नहीं किया गया।
- source_word: מִבְּלִי לוֹ
  choice: वह तंबू अब उसका नहीं रहा
  rationale: यह वाक्यांश अत्यंत संक्षिप्त और कठिन है तथा अभाव या उससे संबंध टूटने का भाव देता है। यह रूपांतरण बेदखली/स्वामित्व खोने की धारणा व्यक्त करता है, पर वैकल्पिक ‘जो उसकी नहीं है’ को पादटिप्पणी में सुरक्षित रखता है।
- source_word: יְזֹרֶה
  choice: बिखेरी जाएगी
  rationale: זרה पिएल का अर्थ ‘बिखेरना/छितराना’ है। तृतीय पुरुष एकवचन पुल्लिंग को यहाँ अनिर्दिष्ट कर्ता वाला प्रयोग मानकर हिंदी में कर्मवाच्य स्वाभाविक है।
- source_word: עַל נָוֵהוּ
  choice: उसके निवास पर
  rationale: נָוֶה का अर्थ निवास, बसेरा या चरागाह हो सकता है। समानांतर ‘तंबू’ के संदर्भ में ‘निवास’ उपयुक्त और पर्याप्त व्यापक है।
- source_word: גָפְרִית
  choice: गंधक
  rationale: आधुनिक मानक हिंदी में ‘गंधक’ इस पदार्थ का स्पष्ट और प्रचलित नाम है तथा दाह और विनाश की छवि को व्यक्त करता है।
theological_decisions:
- issue: स्त्रीलिंग क्रिया और कठिन מִבְּלִי לוֹ का संबंध
  choice: स्त्रीलिंग क्रिया का विलंबित कर्ता ‘गंधक’ माना गया है, और מִבְּלִי לוֹ को तंबू पर उसका अधिकार समाप्त होने के रूप में व्यक्त किया गया है।
  alternative: ‘उसके तंबू में वह बसेगी जो उसकी नहीं है,’ अर्थात कोई परायी उपस्थिति उसके पतन के बाद तंबू पर अधिकार कर लेती है।
  rationale: यह चयन गंधक को न्याय और उजाड़ के चिह्न के रूप में दोनों उपवाक्यों से जोड़ता है, लेकिन इब्रानी की वास्तविक वाक्यगत अस्पष्टता को पादटिप्पणी में खुला रखता है और किसी विशिष्ट अलौकिक सत्ता को पाठ में नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘तंबू,’ ‘निवास’ और ‘गंधक’ मूल की ठोस विनाशकारी छवि को सुरक्षित रखते हैं; कठिन इब्रानी वाक्य-विन्यास को मुख्य पाठ में पठनीय बनाया गया है और वास्तविक विकल्प पादटिप्पणी में दिया गया है।
