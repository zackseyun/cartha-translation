  text: He has neither offspring nor posterity among his people[b][a], and no survivor in the places where he sojourned.
translation:
  language: hi
  text: उसके लोगों में न तो उसकी कोई संतान है, न कोई वंशज[a]; और उसके निवास-स्थानों[b] में कोई जीवित बचा हुआ व्यक्ति नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “नाती या पोता”; “संतान” और “वंशज” का यह इब्रानी युग्म उसके पूरे वंश के मिट जाने का भाव प्रकट करता है।
    reason: lexical_alternative
  - marker: b
    text: या “जिन स्थानों में वह परदेशी होकर रहा” अथवा “उसके बसने के स्थान”; इब्रानी शब्द स्थायी निवास या अस्थायी प्रवास—दोनों के स्थानों को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נִין
  choice: संतान
  rationale: यह शब्द संतान या वंश में उत्पन्न व्यक्ति को दर्शाता है। ‘संतान’ सहज आधुनिक हिन्दी है और अगले समानार्थी पद के साथ मिलकर वंश के पूर्णतः मिट जाने का भाव व्यक्त करता है।
- source_word: נֶכֶד
  choice: वंशज
  rationale: נִין के साथ इस युग्म में यह आगे की पीढ़ी या उत्तरवर्ती वंश को सूचित करता है। ‘वंशज’ किसी एक निश्चित पीढ़ी तक अर्थ को सीमित किए बिना मूल की व्यापकता बनाए रखता है।
- source_word: בְּעַמּוֹ
  choice: उसके लोगों के बीच
  rationale: עַם का सामान्य अर्थ ‘लोग’ या ‘जाति’ है; בְּ यहाँ उस समुदाय के बीच होने का भाव देता है। यह हिन्दी में स्वाभाविक और सामुदायिक संदर्भ के अनुरूप है।
- source_word: שָׂרִיד
  choice: जीवित बचा हुआ
  rationale: यह विनाश के बाद बचे व्यक्ति को दर्शाता है। ‘जीवित बचा हुआ’ स्पष्ट है और ‘शेष’ जैसे संभावित सामूहिक या विशेष धार्मिक अर्थ से बचता है।
- source_word: בִּמְגוּרָיו
  choice: उसके निवास-स्थानों में
  rationale: מָגוּר रहने या परदेश में अस्थायी रूप से बसने के स्थान को दर्शा सकता है। ‘निवास-स्थान’ स्वाभाविक हिन्दी में स्थान-संबंधी अर्थ बनाए रखता है, जबकि वैकल्पिक ‘जहाँ वह परदेशी होकर रहा’ को पाद-टिप्पणी में सुरक्षित रखा गया है।
