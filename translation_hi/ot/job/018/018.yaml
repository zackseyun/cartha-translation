lexical_decisions:
- source_word: יֶהְדְּפֻהוּ
  choice: वे उसे … खदेड़ देते हैं
  rationale: क्रिया Qal अपूर्णकाल, अन्य पुरुष बहुवचन है और उसमें एकवचन पुल्लिंग कर्म-प्रत्यय जुड़ा है। ‘खदेड़ देते हैं’ बलपूर्वक दूर किए जाने का भाव और अनिर्दिष्ट बहुवचन कर्ता—दोनों बनाए रखता है।
- source_word: מֵאוֹר
  choice: उजाले से
  rationale: מִן अलगाव का भाव देता है और אוֹר का अर्थ ‘उजाला/प्रकाश’ है। ‘उजाले से’ आधुनिक हिन्दी में स्वाभाविक है और आगे के ‘अँधेरे में’ के साथ स्पष्ट काव्यात्मक विरोध बनाता है।
- source_word: אֶל חֹשֶׁךְ
  choice: अँधेरे में
  rationale: אֶל दिशा या गंतव्य सूचित करता है। ‘में’ एक अवस्था अथवा क्षेत्र से दूसरे में पहुँचाए जाने की गति को सहज हिन्दी में व्यक्त करता है।
- source_word: וּמִתֵּבֵל
  choice: और संसार से
  rationale: תֵּבֵל सामान्यतः संसार, विशेषकर आबाद संसार, को दर्शाता है। ‘संसार’ संक्षिप्त, गरिमापूर्ण और काव्य-संदर्भ में स्वाभाविक है।
- source_word: יְנִדֻּהוּ
  choice: उसे … निकाल देते हैं
  rationale: यह रूप किसी को दूर करने या बाहर कर देने का कारक भाव व्यक्त करता है। ‘निकाल देते हैं’ सामाजिक अथवा स्थानिक बहिष्कार का अर्थ साफ़ रखता है और पहले पद के ‘खदेड़’ को अनावश्यक रूप से नहीं दोहराता।
