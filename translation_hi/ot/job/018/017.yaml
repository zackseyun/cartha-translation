  text: His memory perishes from the earth[a], and he has no name on the face of the street.
translation:
  language: hi
  text: 'धरती से उसकी याद मिट जाती है,

    और सड़कों पर उसका नाम नहीं रहता।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זִכְרוֹ
  choice: उसकी याद
  rationale: यह संज्ञा स्मरण या किसी व्यक्ति की बची हुई याद को दर्शाती है। ‘उसकी याद’ सहज आधुनिक हिन्दी में मानवीय स्मृति से उसके लुप्त होने का भाव रखता है।
- source_word: אָבַד
  choice: मिट जाती है
  rationale: क्रिया का अर्थ नष्ट होना, खो जाना या लुप्त हो जाना है। ‘मिट जाती है’ हिन्दी में याद के साथ स्वाभाविक है और पूर्ण विलुप्ति की कठोर काव्यात्मकता बनाए रखता है।
- source_word: מִנִּי אָרֶץ
  choice: धरती से
  rationale: אֶרֶץ का अर्थ ‘देश/भूमि’ या ‘धरती’ हो सकता है। इस प्रसंग में ‘धरती’ व्यापक रूप से उसके पूर्णतः भुला दिए जाने का भाव देता है; वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: וְלֹא שֵׁם לוֹ
  choice: उसका नाम नहीं रहता
  rationale: यहाँ ‘नाम’ पहचान, प्रतिष्ठा और स्मरण में बने रहने का द्योतक है। यह हिन्दी अभिव्यक्ति उसके नाम का कोई सार्वजनिक अस्तित्व न बचने का अर्थ सहजता से व्यक्त करती है।
- source_word: עַל־פְּנֵי
  choice: कहीं
  rationale: शाब्दिक अर्थ ‘के मुख/सतह पर’ है, पर חוּץ के साथ यह बाहरी या सार्वजनिक क्षेत्र में उपस्थिति को व्यक्त करता है। हिन्दी में ‘बाहर कहीं’ वही स्थानिक व्यापकता स्वाभाविक ढंग से देता है।
- source_word: חוּץ
  choice: बाहर
  rationale: חוּץ बाहर के क्षेत्र, गली या सार्वजनिक खुले स्थान को सूचित कर सकता है। ‘बाहर’ मूल की व्यापकता और अस्पष्टता सुरक्षित रखता है; ‘चौक’ का विकल्प पादटिप्पणी में दिया गया है।
theological_decisions: []
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी; समानांतर काव्य-पंक्तियाँ रखी गई हैं। ‘बाहर कहीं’ मूल חוּץ की गली, खुले स्थान और सार्वजनिक क्षेत्र के बीच की वास्तविक अर्थगत व्यापकता को अनावश्यक रूप से सीमित नहीं करता।
