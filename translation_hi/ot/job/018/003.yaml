  text: Why are we regarded as cattle[b][a], and considered unclean in your eyes?
translation:
  language: hi
  text: हम पशुओं के समान क्यों समझे जाते हैं, और तुम्हारी दृष्टि में अशुद्ध क्यों माने जाते हैं?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अशुद्ध माने जाते हैं’ के लिए प्रयुक्त इब्रानी रूप कठिन है और उसकी अन्य व्याख्याएँ भी की गई हैं। यहाँ संदर्भ और समानांतर रचना के आधार पर अर्थ यह लिया गया है कि वे तुम्हारी दृष्टि में अशुद्ध या अपवित्र समझे जाते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: מַדּוּעַ
  choice: क्यों
  rationale: यह आलंकारिक प्रश्न आरम्भ करने वाला प्रश्नवाचक क्रियाविशेषण है; ‘क्यों’ सहज और पर्याप्त है।
- source_word: נֶחְשַׁבְנוּ
  choice: हम ... समझे जाते हैं
  rationale: חשׁב का यह रूप दूसरों द्वारा किसी रूप में आँके या माने जाने का भाव देता है; हिंदी में यह निष्क्रिय और मूल्यांकनात्मक अर्थ स्वाभाविक रूप से व्यक्त होता है।
- source_word: כַבְּהֵמָה
  choice: पशुओं के समान
  rationale: בְּהֵמָה पशु या घरेलू पशु के लिए व्यापक शब्द है। ‘पशुओं के समान’ अपमानजनक तुलना को व्यक्त करता है और अनावश्यक रूप से केवल मवेशियों तक अर्थ सीमित नहीं करता।
- source_word: נִטְמִינוּ
  choice: अशुद्ध ... माने जाते हैं
  rationale: पाठ का यह रूप कठिन है। संदर्भ और समानांतर रचना में इसे अशुद्ध या अपवित्र समझे जाने के अर्थ में लिया गया है, जबकि कठिनाई को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: בְּעֵינֵיכֶם
  choice: तुम्हारी दृष्टि में
  rationale: यह मूल्यांकन या धारणा बताने वाला प्रचलित इब्रानी मुहावरा है; ‘तुम्हारी दृष्टि में’ उसका रूपक और बहुवचन संबोधन बनाए रखता है।
theological_decisions:
- issue: नִטְמִינוּ के कठिन पाठ की व्याख्या
  choice: अशुद्ध माने जाते हैं
  alternative: अन्य व्युत्पत्तियों या पाठ-समझ के आधार पर मूर्ख अथवा तुच्छ समझे जाते हैं
  rationale: निकटवर्ती समानांतरता और प्रचलित पाठ-समझ अशुद्धता का अर्थ समर्थित करती है, पर मूल की कठिनाई को निर्णायक रूप से मिटाया नहीं गया और पादटिप्पणी में बताया गया है।
