translation:
  language: hi
  text: 'क्योंकि वह अपने पैरों के द्वारा जाल में भेजा जाता है,

    और वह जाली पर चलता है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֻׁלַּח
  choice: पहुँचा देते हैं
  rationale: यह पुअल रूप शाब्दिक रूप से ‘भेजा जाता है’ का भाव देता है; पैरों को साधन मानते हुए हिन्दी में सक्रिय कारक-विन्यास अधिक स्वाभाविक है और यह अर्थ सुरक्षित रखता है कि उसी के पैर उसे जाल तक ले जाते हैं।
- source_word: רֶשֶׁת
  choice: जाल
  rationale: शिकार पकड़ने के लिए बिछाए गए फंदेनुमा जाल का सामान्य और सटीक हिन्दी शब्द।
- source_word: שְׂבָכָה
  choice: जाली
  rationale: बुनी हुई जाल-संरचना को दर्शाता है और निकटवर्ती רֶשֶׁת से हल्का शब्दगत भेद बनाए रखता है।
- source_word: יִתְהַלָּךְ
  choice: चलता है
  rationale: हित्पएल रूप यहाँ निरंतर या आगे बढ़ते हुए चलने का बोध देता है; सरल वर्तमान हिन्दी काव्य-संदर्भ में स्वाभाविक है।
theological_decisions:
- issue: दुष्ट व्यक्ति के जाल में जाने की कारकता
  choice: उसके अपने पैर उसे जाल में पहुँचा देते हैं
  alternative: वह अपने ही पैरों से जाल में भेजा जाता है
  rationale: मूल का व्याकरणिक कर्मवाच्य और בְרַגְלָיו का साधनार्थक भाव दोनों सुरक्षित हैं, पर यह नहीं जोड़ा गया कि परमेश्वर या कोई अन्य विशिष्ट कर्ता उसे भेजता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली। समानांतर पंक्तियों में ‘जाल/जाली’ का भेद मूल के दो निकटार्थक शब्दों को प्रतिबिंबित करता है।
