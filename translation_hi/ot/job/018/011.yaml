  yaml_path: translation/ot/job/018/011.yaml
  text: Terrors frighten him on every side[a], and scatter him at his feet.
translation:
  language: hi
  text: 'आतंक उसे चारों ओर से भयभीत करते हैं,

    और उसके पाँवों पर उसे तितर-बितर कर देते हैं।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: סָבִיב
  choice: चारों ओर से
  rationale: यह क्रियाविशेषण आतंक के सभी दिशाओं से घेरने का भाव व्यक्त करता है; यह आधुनिक हिन्दी में स्वाभाविक है।
- source_word: בִּעֲתֻהוּ
  choice: उसे डराते हैं
  rationale: בעת का अर्थ भयभीत या आतंकित करना है। सरल और वर्तमान हिन्दी में 'डराते हैं' काव्यात्मक समानांतरता को स्पष्ट रखता है।
- source_word: בַלָּהוֹת
  choice: आतंक
  rationale: बहुवचन संज्ञा अचानक आने वाले भय या भयावह विपत्तियों को दर्शाती है। हिन्दी में 'आतंक' सामूहिक अर्थ में स्वाभाविक रूप से प्रयुक्त होकर उस तीव्रता को बनाए रखता है।
- source_word: וֶהֱפִיצֻהוּ
  choice: उसे दौड़ाते हैं
  rationale: הפיץ का मूल चित्र तितर-बितर करने या खदेड़ने का है। इस संदर्भ में आतंक उस व्यक्ति को चैन न लेने देकर आगे भगाते हैं; 'दौड़ाते हैं' इस गतिशील प्रभाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְרַגְלָיו
  choice: उसके पाँवों के पीछे
  rationale: शाब्दिक रूप से 'उसके पाँवों पर/की ओर'। यहाँ आतंक के पीछे लगकर हर कदम पर उसे खदेड़ने का संभावित भाव है; मुख्य पाठ का यह रूप उस चित्र को पठनीय बनाता है, जबकि शाब्दिक रूप पादटिप्पणी में दिया गया है।
