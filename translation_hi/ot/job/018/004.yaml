base_translation:
  language: en
  yaml_path: translation/ot/job/018/004.yaml
  text: You who tear yourself apart in your anger—shall the earth be abandoned for your sake[a], or a rock be moved from its place?
translation:
  language: hi
  text: तू जो अपने क्रोध में अपने आपको फाड़ डालता है—क्या तेरे कारण पृथ्वी को छोड़ दिया जाए,[a] या चट्टान अपने स्थान से हटा दी जाए?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शब्दशः: “वह जो अपने क्रोध में अपने प्राण को फाड़ता है।” इब्रानी में वाक्य तीसरे पुरुष के कृदंत से आरंभ होता है, फिर सीधे दूसरे पुरुष के संबोधन पर आ जाता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: טֹרֵף נַפְשׁוֹ
  choice: अपने आपको फाड़ डालता है
  rationale: टֹרֵף का मूल बिंब शिकार को फाड़ने का है और נַפְשׁוֹ यहाँ व्यक्ति के अपने ही जीवन/स्व को सूचित करता है। यह हिंदी प्रयोग आत्म-विनाशकारी क्रोध की तीव्रता को स्वाभाविक ढंग से बनाए रखता है।
- source_word: בְּאַפּוֹ
  choice: अपने क्रोध में
  rationale: אַף का शाब्दिक अर्थ ‘नाक’ है, पर यहाँ प्रचलित अर्थ ‘क्रोध’ है। अगले दूसरे-पुरुष संबोधन के अनुरूप हिंदी में ‘अपने’ रखा गया है।
- source_word: הַלְמַעַנְךָ
  choice: क्या तेरे कारण
  rationale: 'לְמַעַן के साथ दूसरा पुरुष एक तीखा आलंकारिक प्रश्न बनाता है: क्या संसार की व्यवस्था अय्यूब के कारण बदलनी चाहिए। ‘तेरे कारण’ आधुनिक हिंदी में सीधा और प्रभावी है।'
- source_word: תֵּעָזַב אָרֶץ
  choice: पृथ्वी त्याग दी जाए
  rationale: אָרֶץ यहाँ समानांतर ब्रह्मांडीय/सार्वभौमिक कथन में ‘भूमि’ के बजाय ‘पृथ्वी’ है। निफ़अल क्रिया का कर्मवाच्य भाव ‘त्याग दी जाए’ से सुरक्षित रहता है।
- source_word: וְיֶעְתַּק צוּר מִמְּקֹמוֹ
  choice: चट्टान अपने स्थान से हटा दी जाए
  rationale: עתק यहाँ किसी वस्तु को उसके स्थान से हटाए जाने का भाव देता है। צוּר को सामान्य, अनिश्चित ‘चट्टान’ के रूप में रखा गया है, ताकि इसे परमेश्वर की किसी उपाधि के रूप में न समझा जाए।
theological_decisions:
- issue: आरंभिक तीसरे पुरुष और अगले दूसरे पुरुष के बीच व्याकरणिक बदलाव
  choice: मुख्य पाठ में पूरे कथन को सीधे दूसरे पुरुष के संबोधन के रूप में प्रस्तुत किया गया है
  alternative: ‘वह जो अपने क्रोध में अपने प्राण को फाड़ता है—क्या तेरे कारण...?’
  rationale: इब्रानी आरंभ में तीसरे पुरुष के कृदंत और प्रत्यय का प्रयोग करता है, फिर הַלְמַעַנְךָ में सीधे दूसरे पुरुष पर आ जाता है। स्वाभाविक हिंदी में बिल्दद की अय्यूब को सीधी फटकार स्पष्ट रखने के लिए दूसरे पुरुष का प्रयोग किया गया, जबकि औपचारिक बदलाव को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: आलंकारिक प्रश्न का आशय
  choice: अय्यूब के कारण पृथ्वी की स्थिर व्यवस्था बदलने की असंभवता पर बिल्दद की फटकार
  alternative: केवल भौतिक पृथ्वी या किसी खास चट्टान को हटाने के बारे में शाब्दिक प्रश्न
  rationale: दोनों समानांतर प्रश्न अतिशयोक्तिपूर्ण और आलंकारिक हैं; अनुवाद इस बल को रखता है, पर बिल्दद के दावे को कथावाचक की स्वीकृति या सार्वभौमिक धार्मिक निष्कर्ष नहीं बनाता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और तीखे काव्यात्मक संबोधन के लिए ‘तू/तेरे’ रखा गया है। ‘अपने आपको फाड़ डालता है’ मूल के हिंसक बिंब और आत्म-विनाशकारी भाव को बनाए रखता है; भाषा सामान्य पाठक के लिए स्पष्ट है।
