  yaml_path: translation/ot/job/018/014.yaml
  text: He is torn from the security of his tent[b][a], and he is marched off to the king of terrors.
translation:
  language: hi
  text: उसे उसकी सुरक्षित शरण, उसके तंबू से उखाड़ दिया जाता है[a], और उसे आतंकों के राजा के पास ले जाया जाता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे उसके तंबू की सुरक्षा से उखाड़ दिया जाता है।” इब्रानी का अर्थ या तो उसके तंबू के सुरक्षित स्थान से हटाया जाना हो सकता है, या यह कि तंबू स्वयं उसका भरोसा था।
    reason: lexical_alternative
  - marker: b
    text: “आतंकों का राजा” एक काव्यात्मक अभिव्यक्ति है, जिसे प्रायः व्यक्तिरूप में मृत्यु समझा जाता है; मूल पाठ उसकी पहचान स्पष्ट नहीं करता।
    reason: alternative_reading
lexical_decisions:
- source_word: יִנָּתֵק
  choice: उखाड़ दिया जाता है
  rationale: निफ़ाल रूप किसी को बलपूर्वक अलग किए जाने या जड़ से उखाड़े जाने का भाव देता है; यह चयन हिंसक निष्कासन की काव्यात्मक तीव्रता बनाए रखता है।
- source_word: מֵאָהֳלוֹ
  choice: उसके तंबू ... से
  rationale: אֹהֶל का मूल अर्थ ‘तंबू’ है। इससे इब्रानी का ठोस चित्र सुरक्षित रहता है, यद्यपि संदर्भ में यह निवास या घर को भी सूचित कर सकता है।
- source_word: מִבְטַחוֹ
  choice: की सुरक्षा
  rationale: מִבְטָח सुरक्षा, भरोसा या सुरक्षित आश्रय का बोध करा सकता है। ‘तंबू की सुरक्षा’ उस स्थान को व्यक्त करता है जिसे वह सुरक्षित मानता था, जबकि व्याकरणिक संबंध की वैकल्पिक समझ पादटिप्पणी में रखी गई है।
- source_word: וְתַצְעִדֵהוּ
  choice: और उसे ... हाँक ले जाया जाता है
  rationale: צעד के हिफ़ील रूप में ‘कदम बढ़वाना, ले जाना’ का कारक भाव है। स्त्रीलिंग कर्ता स्पष्ट नहीं है; हिंदी का कर्मवाच्य अनिश्चित कर्ता को आरोपित किए बिना बलपूर्वक आगे ले जाए जाने का भाव बनाए रखता है।
- source_word: לְמֶלֶךְ
  choice: राजा के पास
  rationale: לְ यहाँ दिशा या गंतव्य दर्शाता है; ‘के पास’ स्वाभाविक हिंदी में ‘की ओर/तक’ का भाव देता है।
- source_word: בַּלָּהוֹת
  choice: आतंक के
  rationale: बहुवचन संज्ञा भयावह आतंक या दहशतों को सूचित करती है। हिंदी में ‘आतंक का राजा’ काव्यात्मक उपाधि के रूप में स्वाभाविक है और भय की व्यापकता को व्यक्त करती है।
theological_decisions:
- issue: ‘आतंक के राजा’ की पहचान
  choice: काव्यात्मक उपाधि को बिना स्पष्ट पहचान दिए बनाए रखा गया है।
  alternative: इसे व्यक्तिरूप में मृत्यु, अधोलोक या किसी दुष्ट अलौकिक शासक के रूप में स्पष्ट करना।
  rationale: इब्रानी वाक्यांश अपने संकेत का स्पष्ट नाम नहीं देता। इसे अनिर्धारित रखने से मूल की काव्यात्मक और धर्मवैचारिक अस्पष्टता सुरक्षित रहती है।
- issue: וְתַצְעִדֵהוּ का अस्पष्ट स्त्रीलिंग कर्ता
  choice: हिंदी में कर्मवाच्य—‘उसे ... हाँक ले जाया जाता है’।
  alternative: ‘वह/विपत्ति उसे ... ले जाती है’, जिससे किसी स्त्रीलिंग अमूर्त सत्ता को कर्ता मान लिया जाए।
  rationale: मूल क्रिया स्त्रीलिंग एकवचन कर्ता का संकेत देती है, पर इस पद में कर्ता स्पष्ट नहीं है। कर्मवाच्य किसी विशेष कर्ता को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सजीव काव्यात्मक भाषा रखी गई है। ‘उखाड़ दिया जाता है’ और ‘हाँक ले जाया जाता है’ मूल की हिंसक, अनिवार्य गति को व्यक्त करते हैं। ‘तंबू’ ठोस प्राचीन चित्र बनाए रखता है, और अस्पष्ट कर्ता तथा ‘आतंक के राजा’ की पहचान को जानबूझकर अनिर्णीत रखा गया है।
