  text: His vigorous steps are constrained[b][a], and his own counsel casts him down.
translation:
  language: hi
  text: उसके शक्तिशाली कदम रोक दिए जाते हैं[a], और उसकी अपनी योजना उसे गिरा देती है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उसके सामर्थ्य-भरे कदम संकुचित हो जाते हैं।’
    reason: אוֹן का अर्थ ‘बल’ या ‘सामर्थ्य’ हो सकता है, और יֵצְרוּ का अर्थ ‘संकुचित होते हैं,’ ‘बांधे जाते हैं,’ या ‘रोक दिए जाते हैं’ हो सकता है।
  - marker: b
    text: या, ‘उसकी अपनी युक्ति उसे नीचे फेंक देती है।’
    reason: עֵצָה का अर्थ ‘युक्ति,’ ‘सलाह,’ या ‘योजना’ हो सकता है; और שלך का अधिक शाब्दिक अर्थ ‘फेंक देना’ है।
lexical_decisions:
- source_word: יֵצְרוּ
  choice: सिमट जाते हैं
  rationale: क्रिया यहाँ बहुवचन ‘कदम’ के साथ उनके मार्ग या गति के संकुचित और बाधित हो जाने का बिंब देती है। ‘सिमट जाते हैं’ सहज हिन्दी में इस काव्यात्मक चित्र को बनाए रखता है।
- source_word: צַעֲדֵי
  choice: कदम
  rationale: צעד का रचनात्मक बहुवचन है; ‘कदम’ आधुनिक हिन्दी में सीधा और स्वाभाविक समतुल्य है।
- source_word: אוֹנוֹ
  choice: उसके बलवान
  rationale: אוֹן यहाँ ‘बल/सामर्थ्य’ के अर्थ में कदमों की विशेषता बताता है। ‘बलवान कदम’ उसकी पहले की दृढ़ और शक्तिशाली चाल का भाव व्यक्त करता है।
- source_word: וְתַשְׁלִיכֵהוּ
  choice: उसे गिरा देती है
  rationale: हिफ़ील रूप का स्त्रीलिंग एकवचन कर्ता आगे आने वाली ‘युक्ति’ है और पुल्लिंग कर्म ‘उसे’ है। प्रसंग में विनाशकारी परिणाम को ‘गिरा देती है’ स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עֲצָתוֹ
  choice: उसकी अपनी युक्ति
  rationale: עֵצָה का अर्थ सलाह, योजना या युक्ति हो सकता है। ‘अपनी युक्ति’ उस विडंबना को स्पष्ट रखती है कि उसकी स्वयं की बनाई योजना उसी के पतन का कारण बनती है।
