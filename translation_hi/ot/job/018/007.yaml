  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और काव्यात्मक प्रयोग किया गया है। ‘बलवान कदम’ और ‘सिमट जाते हैं’ मूल के शारीरिक गति-बिंब को रखते हैं; ‘अपनी युक्ति’ आत्म-विनाश की विडंबना को बिना अतिरिक्त व्याख्या के व्यक्त करती है।
