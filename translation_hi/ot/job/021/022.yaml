base_translation:
  language: en
  yaml_path: translation/ot/job/021/022.yaml
  text: Can anyone teach God knowledge[a], since he judges those on high?
translation:
  language: hi
  text: क्या कोई परमेश्वर को ज्ञान सिखा सकता है, और वह ऊँचे जनों[a] का न्याय करता है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उन्नत जनों’; संभवतः ‘स्वर्गीय प्राणियों’।
    reason: रָמִים का संदर्भ व्यापक और विवादित है; यह उच्च मनुष्यों अथवा स्वर्गीय प्राणियों, दोनों का संकेत कर सकता है।
lexical_decisions:
- source_word: הַלְאֵל
  choice: क्या कोई परमेश्वर को
  rationale: प्रश्नवाचक הֲ और לְאֵל मिलकर एक आलंकारिक प्रश्न बनाते हैं। स्वाभाविक हिन्दी में अनिश्चित कर्ता ‘कोई’ जोड़ना आवश्यक है; אֵל का सीधा अर्थ यहाँ ‘परमेश्वर’ है।
- source_word: יְלַמֶּד
  choice: सिखा सकता है
  rationale: למד का पिएल रूप ‘सिखाना/शिक्षा देना’ दर्शाता है। सामर्थ्य सूचक ‘सकता है’ हिन्दी में आलंकारिक प्रश्न का आशय स्वाभाविक ढंग से व्यक्त करता है।
- source_word: דָּעַת
  choice: ज्ञान
  rationale: דָּעַת का अर्थ ‘ज्ञान’ या ‘समझ’ हो सकता है। ‘ज्ञान सिखाना’ मूल अमूर्त संज्ञा और वाक्य की तीक्ष्णता को बनाए रखता है।
- source_word: וְהוּא
  choice: जबकि वह
  rationale: וְ का मूल संयोजक बल सुरक्षित रखते हुए ‘जबकि’ दोनों कथनों के विरोधात्मक-परिस्थितिजन्य संबंध को व्यक्त करता है, बिना कारणार्थ को अत्यधिक निश्चित किए।
- source_word: רָמִים
  choice: ऊँचे पदवालों
  rationale: רום से बना यह बहुवचन विशेषण संज्ञा की तरह ‘ऊँचे/उन्नत जन’ को सूचित करता है। ‘ऊँचे पदवाले’ सांसारिक शासकों और स्वर्गीय उच्च प्राणियों के बीच मूल संदर्भ की व्यापकता को यथासंभव खुला रखता है।
- source_word: יִשְׁפּוֹט
  choice: न्याय करता है
  rationale: שפט के काल रूप का सीधा अर्थ ‘न्याय करना’ है; यह परमेश्वर के सर्वोच्च अधिकार को स्पष्ट और गरिमापूर्ण हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: רָמִים का संदर्भ
  choice: ‘ऊँचे पदवाले’—एक व्यापक अभिव्यक्ति, जो उच्च या प्रतिष्ठित प्राणियों को दर्शाती है
  alternative: ‘स्वर्गीय प्राणी’ अथवा ‘ऊँचे लोग/शासक’
  rationale: इब्रानी पद स्वर्गीय प्राणियों या सांसारिक उच्चाधिकारियों में से किसी एक को अनिवार्य रूप से निश्चित नहीं करता। व्यापक अनुवाद मूल की संदिग्धता और परमेश्वर की सर्वश्रेष्ठता, दोनों को सुरक्षित रखता है।
- issue: וְ का तार्किक संबंध
  choice: ‘जबकि’
  alternative: ‘और वह’ अथवा ‘क्योंकि वह’
  rationale: ‘क्योंकि’ व्याख्यात्मक कारण-संबंध को अधिक स्पष्ट कर देता, जबकि मूल וְ सामान्य संयोजक है। ‘जबकि’ पठनीय हिन्दी में संबंध दिखाता है और मूल की कुछ खुली संरचना बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य। आलंकारिक प्रश्न को स्वाभाविक बनाने के लिए ‘क्या कोई ... सकता है’ संरचना अपनाई गई है।
