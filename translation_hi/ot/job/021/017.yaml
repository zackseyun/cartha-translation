id: JOB.21.17
reference: Job 21:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כַּ/מָּ֤ה נֵר רְשָׁ֘עִ֤ים יִדְעָ֗ךְ וְ/יָבֹ֣א עָלֵ֣י/מוֹ אֵידָ֑/ם חֲ֝בָלִ֗ים יְחַלֵּ֥ק בְּ/אַפּֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/017.yaml
  text: How often is the lamp of the wicked put out[c][b][a], and does their disaster come upon them? Does he apportion sorrows in his anger?
translation:
  language: hi
  text: दुष्टों का दीपक[b] कितनी बार[a] बुझता है और उनकी विपत्ति उन पर आ पड़ती है? कितनी बार वह अपने क्रोध में उनके हिस्से में पीड़ाएँ[c] बाँटता है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसे ‘ऐसा कितनी बार होता है कि...?’ भी कहा जा सकता है। यह अलंकारिक प्रश्न इस विचार को चुनौती देता है कि दुष्टों को इस प्रकार का दंड नियमित रूप से मिलता है।
    reason: lexical_alternative
  - marker: b
    text: ‘दीपक’ यहाँ किसी व्यक्ति के जीवन, समृद्धि या बने रहने वाले सौभाग्य का रूपक है।
    reason: cultural_note
  - marker: c
    text: या ‘दर्द’ अथवा ‘प्रसव-पीड़ाएँ’। इब्रानी शब्द में ये परस्पर संबंधित अर्थ हो सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּמָּה
  choice: कितनी बार
  rationale: यहाँ प्रश्न संख्या से अधिक घटना की आवृत्ति पर है। अय्यूब का प्रश्न अलंकारिक है और इस धारणा को चुनौती देता है कि दुष्टों पर ऐसा न्याय नियमित रूप से आता है।
- source_word: נֵר
  choice: दीपक
  rationale: मूल शब्द का सीधा अर्थ ‘दीपक’ है। बुद्धि-साहित्य में यह जीवन, समृद्धि या बने रहने वाले सौभाग्य का रूपक हो सकता है; ‘दीपक’ मूल बिंब को सुरक्षित रखता है।
- source_word: רְשָׁעִים
  choice: दुष्टों
  rationale: बहुवचन संज्ञात्मक प्रयोग के लिए यह संक्षिप्त, स्वाभाविक और बुद्धि-साहित्य में प्रचलित हिन्दी रूप है।
- source_word: יִדְעָךְ
  choice: बुझता है
  rationale: דעך दीपक या ज्योति के बुझने को व्यक्त करता है। ‘बुझता है’ हिन्दी में स्वाभाविक है और मूल के बिंब को बनाए रखता है।
- source_word: וְיָבֹא עָלֵימוֹ אֵידָם
  choice: और उनकी विपत्ति उन पर आ पड़ती है
  rationale: אֵיד विपत्ति, विनाश या संकट को सूचित करता है। ‘आ पड़ती है’ किसी विपत्ति के अचानक किसी पर आ जाने का भाव स्वाभाविक हिन्दी में देता है।
- source_word: חֲבָלִים
  choice: पीड़ाएँ
  rationale: इस बहुअर्थी शब्द में दर्द, व्यथाएँ और प्रसव-पीड़ाएँ जैसे भाव हो सकते हैं। यहाँ विपत्ति और क्रोध के समानांतर ‘पीड़ाएँ’ व्यापक अर्थ को सुरक्षित रखता है।
- source_word: יְחַלֵּק
  choice: हिस्से में ... बाँटता है
  rationale: חלק के पिएल रूप का अर्थ बाँटना, वितरित करना या किसी के हिस्से में ठहराना है। यह हिन्दी वाक्यांश दंडस्वरूप पीड़ा बाँटने का भाव स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְּאַפּוֹ
  choice: अपने क्रोध में
  rationale: इस मुहावरे में אַף का अर्थ क्रोध है। ‘अपने क्रोध में’ आधुनिक, स्पष्ट और गरिमापूर्ण है।
theological_decisions:
- issue: יְחַלֵּק में निहित एकवचन कर्ता का संदर्भ
  choice: कर्ता को ‘वह’ ही रखा गया है; प्रसंग से उसका संकेत परमेश्वर की ओर है।
  alternative: कर्ता को स्पष्ट करके ‘परमेश्वर’ कहना, या इसे निर्वैयक्तिक ढंग से प्रस्तुत करना।
  rationale: इब्रानी क्रिया में कर्ता व्याकरणतः निहित है, पर इस उपवाक्य में उसका नाम नहीं दिया गया। प्रसंग परमेश्वर की ओर संकेत करता है, फिर भी ‘वह’ रखने से स्रोत की अप्रत्यक्षता और संभावित तनाव सुरक्षित रहता है।
- issue: आरंभिक כַּמָּה का प्रश्नगत विस्तार
  choice: ‘कितनी बार’ को अंतिम समांतर प्रश्न में दोहराया गया है।
  alternative: केवल पद के आरंभ में ‘कितनी बार’ रखकर उसे सभी उपवाक्यों पर लागू मानना।
  rationale: इब्रानी में आरंभिक प्रश्नवाचक पद पूरे समांतर कथन को नियंत्रित करता है। हिन्दी में इसे दोहराने से वही प्रश्नगत विस्तार स्पष्ट होता है और अंतिम उपवाक्य को साधारण कथन समझने की संभावना घटती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक-प्रश्नात्मक शैली रखी गई है। ‘आ पड़ती है’ और ‘हिस्से में ... बाँटता है’ सामान्य पाठक के लिए स्वाभाविक हैं, जबकि ‘दीपक’ मूल रूपक को ज्यों का त्यों बनाए रखता है।
