  yaml_path: translation/ot/job/021/012.yaml
  text: They sing to the tambourine and lyre, and rejoice at the sound of the flute.
translation:
  language: hi
  text: वे डफ और वीणा के साथ गाते हैं[a], और बाँसुरी की ध्वनि पर आनन्द मनाते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे डफ और वीणा के साथ स्वर उठाते हैं”; इब्रानी में क्रिया का अर्थ “उठाना” है, पर उसका कर्म नहीं दिया गया है।
    reason: मूल इब्रानी की व्याकरणिक संक्षिप्तता और यह सम्भावना सुरक्षित रखना कि आशय गीत या स्वर उठाने से है।
lexical_decisions:
- source_word: יִשְׂאוּ
  choice: गाते हैं
  rationale: क्रिया का मूल अर्थ ‘उठाना’ है, पर यहाँ कोई कर्म व्यक्त नहीं है और वाद्ययंत्रों के संदर्भ में आशय गीत या स्वर उठाना है; इसलिए सहज हिन्दी में ‘गाते हैं’ उपयुक्त है। मूल की संक्षिप्तता और अस्पष्टता को पादटिप्पणी में बताया गया है।
- source_word: תֹף
  choice: डफ
  rationale: यह हाथ से बजाया जाने वाला ताल-वाद्य है; ‘डफ’ आधुनिक हिन्दी में संक्षिप्त और समझने योग्य समतुल्य है।
- source_word: כִנּוֹר
  choice: वीणा
  rationale: यह प्राचीन तार-वाद्य था, जिसे हिन्दी बाइबलीय शैली में प्रायः ‘वीणा’ कहा जाता है; यद्यपि आधुनिक भारतीय वीणा से इसका ठीक-ठीक मेल नहीं है।
- source_word: עוּגָב
  choice: बाँसुरी
  rationale: यह किसी प्रकार का वायु-वाद्य या पाइप था; ‘बाँसुरी’ साधारण पाठक के लिए स्वाभाविक और प्रसंगानुकूल है।
- source_word: לְקוֹל
  choice: की ध्वनि पर
  rationale: शाब्दिक अर्थ ‘की ध्वनि/आवाज़ पर’ है; यह वाद्य की सुनाई देने वाली ध्वनि के साथ आनन्द मनाने का भाव रखता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। समानांतर काव्य-पंक्तियों को ‘गाते हैं’ और ‘आनन्द मनाते हैं’ के द्वारा स्पष्ट रखा गया है; वाद्ययंत्रों के लिए हिन्दी पाठकों में प्रचलित नाम चुने गए हैं।
