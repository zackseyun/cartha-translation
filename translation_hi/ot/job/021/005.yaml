lexical_decisions:
- source_word: פְּנוּ אֵלַי
  choice: मेरी ओर मुड़ो
  rationale: बहुवचन आज्ञार्थक क्रिया פנה और दिशासूचक אֵלַי का सीधा और स्वाभाविक हिन्दी रूप; यह ध्यान और मुख वक्ता की ओर फेरने का आग्रह व्यक्त करता है।
- source_word: וְהָשַׁמּוּ
  choice: और स्तब्ध रह जाओ
  rationale: שׁמם का हिफ़ील बहुवचन आज्ञार्थक रूप यहाँ ऐसी प्रतिक्रिया बताता है जिसमें व्यक्ति सदमे, विस्मय या भय से अवाक् रह जाए। ‘स्तब्ध रह जाओ’ इस व्यापक भाव को स्वाभाविक हिन्दी में रखता है।
- source_word: וְשִׂימוּ יָד
  choice: अपना हाथ ... रखो
  rationale: שׂים का सामान्य अर्थ ‘रखना’ है। यद्यपि יָד के साथ मूल में अधिकारसूचक प्रत्यय नहीं है, बहुवचन आज्ञा के प्रसंग में हिन्दी मुहावरे के अनुसार ‘अपना हाथ’ निहित अर्थ स्पष्ट करता है।
- source_word: עַל פֶּה
  choice: अपने मुँह पर
  rationale: शाब्दिक रूप से ‘मुँह पर’; हाथ मुँह पर रखने का संकेत चुप रहने या स्तब्ध होकर बोल न पाने को दर्शाता है। हिन्दी में अधिकारसूचक ‘अपने’ स्वाभाविक रूप से निहित कर्ता से मेल खाता है।
