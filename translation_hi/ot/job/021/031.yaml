  yaml_path: translation/ot/job/021/031.yaml
  text: Who declares his way to his face? And for what he has done[b][a], who repays him?
translation:
  language: hi
  text: कौन उसके मुँह पर उसके चाल-चलन की बात कहता है? और उसने जो किया है,[a] उसका बदला उसे कौन देता है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी वाक्य बहुत संक्षिप्त है: “और उसने किया—उसे कौन बदला देता है?” यहाँ अर्थ स्पष्ट करने के लिए “जो” जोड़ा गया है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: कौन
  rationale: दोनों खंडों में प्रश्नवाचक सर्वनाम है। आशय नकारात्मक हो सकता है, फिर भी इब्रानी की अलंकारिक प्रश्न-रचना को बनाए रखा गया है।
- source_word: יַגִּיד
  choice: बखान करता है
  rationale: हिफ़ील रूप का अर्थ बताना, घोषित करना या सामने स्पष्ट कहना है। यहाँ सीधे सामना करके किसी के आचरण को कहने का भाव है।
- source_word: עַל פָּנָיו
  choice: उसके मुँह पर
  rationale: शाब्दिक अर्थ ‘उसके चेहरे पर’ है; यह उसकी उपस्थिति में सीधे सामना करने का मुहावरा है। आधुनिक हिन्दी में ‘मुँह पर’ यही टकरावपूर्ण भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: דַּרְכּוֹ
  choice: उसके चाल-चलन
  rationale: דֶּרֶךְ का रूपकात्मक अर्थ जीवन-पद्धति या आचरण है। ‘चाल-चलन’ हिन्दी में इस नैतिक और व्यवहारगत अर्थ को स्पष्ट रखता है।
- source_word: וְהוּא עָשָׂה
  choice: और उसने जो किया है
  rationale: 'इब्रानी खंड अत्यंत संक्षिप्त और अंडाकार है: ‘और उसने किया’। हिन्दी में प्रश्न की संगति के लिए ‘जो’ जोड़ा गया है, जबकि मूल की अकस्मात और संक्षिप्त बनावट की सूचना पादटिप्पणी में दी गई है।'
- source_word: יְשַׁלֶּם לוֹ
  choice: उसका बदला उसे कौन देता है
  rationale: पिएल रूप यहाँ किए हुए कर्म का प्रतिफल या प्रतिदान देने का अर्थ रखता है। ‘बदला देना’ न्यायात्मक प्रत्युत्तर को साधारण आधुनिक हिन्दी में व्यक्त करता है।
