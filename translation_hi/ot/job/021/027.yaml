- source_word: מַחְשְׁבוֹתֵיכֶם
  choice: तुम्हारे विचारों
  rationale: ‘विचार’ मूल शब्द के व्यापक अर्थ—सोच, योजना या मंशा—को अनावश्यक रूप से सीमित नहीं करता।
- source_word: וּמְזִמּוֹת
  choice: और उन षड्यंत्रों को भी
  rationale: संदर्भ में यह शब्द सोची-समझी विरोधी योजनाओं का भाव रखता है; ‘षड्यंत्र’ उस प्रतिकूल आशय को स्पष्ट और संक्षिप्त रूप से व्यक्त करता है।
- source_word: עָלַי
  choice: मेरे विरुद्ध
  rationale: इस संदर्भ में संबंधवाचक पद का प्रतिकूल अर्थ है; ‘मेरे विरुद्ध’ उसे हिंदी में सीधे व्यक्त करता है।
- source_word: תַּחְמֹסוּ
  choice: रचते हो
  rationale: इसे ‘षड्यंत्रों’ के साथ स्वाभाविक हिंदी पदबंध में प्रस्तुत किया गया है। मूल क्रिया में अन्याय, उत्पीड़न या हिंसक व्यवहार का अधिक तीखा भाव भी संभव है, जिसे पादटिप्पणी सुरक्षित रखती है।
