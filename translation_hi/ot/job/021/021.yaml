  text: क्योंकि उसके बाद उसे अपने घर की क्या परवाह है,[a][b] जब उसके महीनों की गिनती काट दी जाती है?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके बाद अपने घर में उसकी क्या प्रसन्नता है?”
    reason: lexical_alternative
  - marker: b
    text: “घर” से घराना या परिवार भी अभिप्रेत हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या “उसके महीनों की गिनती निर्धारित की जाती है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ तर्क-प्रवाह को स्वाभाविक रखता है।
- source_word: מַה
  choice: क्या
  rationale: यह आलंकारिक प्रश्न बनाता है और किसी परवाह या रुचि के न रहने का भाव व्यक्त करता है।
- source_word: חֶפְצוֹ
  choice: उसे क्या परवाह है
  rationale: חֵפֶץ का अर्थ इच्छा, प्रसन्नता, रुचि या सरोकार हो सकता है। इस प्रसंग में ‘परवाह’ आलंकारिक प्रश्न का स्वाभाविक हिन्दी रूप है।
- source_word: בְּבֵיתוֹ
  choice: उसके घर की
  rationale: ב यहाँ सरोकार के विषय को चिह्नित करता है। ‘घर’ मूल बिंब को बनाए रखता है, जबकि इसमें घराना या परिवार भी निहित हो सकता है।
- source_word: אַחֲרָיו
  choice: उसके बाद
  rationale: शाब्दिक अर्थ ‘उसके पीछे/बाद’ है; यह उसकी मृत्यु के बाद का संकेत देता है, पर मूल की संक्षिप्तता और कुछ अस्पष्टता बनाए रखता है।
- source_word: וּמִסְפַּר
  choice: जब ... गिनती
  rationale: וְ औपचारिक रूप से ‘और’ है, पर यहाँ दोनों उपवाक्यों का संबंध समय अथवा परिस्थिति का है; हिन्दी में ‘जब’ अर्थ को स्वाभाविक रूप से जोड़ता है।
- source_word: חֳדָשָׁיו
  choice: उसके महीनों
  rationale: मूल में जीवनकाल के लिए ठोस शब्द ‘महीने’ है; इसे सामान्यीकृत करके ‘जीवन’ नहीं किया गया।
- source_word: חֻצָּצוּ
  choice: काट दी जाती है
  rationale: निष्क्रिय क्रिया को जीवन की अवधि समाप्त किए जाने के अर्थ में लिया गया है। वैकल्पिक रूप से इसका अर्थ ‘ठहरा/बाँट दिया जाता है’ भी समझा गया है, इसलिए पादटिप्पणी दी गई है।
theological_decisions:
- issue: क्या חֻצָּצוּ जीवन के अंत को बताता है या उसकी पूर्वनिर्धारित अवधि को?
  choice: मुख्य पाठ में ‘काट दी जाती है’
  alternative: ‘ठहरा दी जाती है’ या ‘बाँट दी जाती है’
  rationale: तात्कालिक संदर्भ में मृत्यु के बाद अपने घर से सरोकार न रहने की बात है, इसलिए समाप्ति का अर्थ उपयुक्त है; फिर भी क्रिया की वैकल्पिक व्याख्या को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज आलंकारिक प्रश्न। ‘घर’ और ‘महीने’ जैसे मूल बिंब सुरक्षित रखे गए हैं; ‘उसके बाद’ मृत्यु को स्पष्ट रूप से जोड़ने के बजाय मूल की संक्षिप्त अस्पष्टता बनाए रखता है।
