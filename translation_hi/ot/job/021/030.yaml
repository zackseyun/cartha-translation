  text: כִּ֤י לְ/י֣וֹם אֵ֭יד יֵחָ֣שֶׂךְ רָ֑ע לְ/י֖וֹם עֲבָר֣וֹת יוּבָֽלוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/030.yaml
  text: For the evil man is spared for the day of disaster[b][a]; they are led away for the day of wrath.
translation:
  language: hi
  text: क्योंकि दुष्ट व्यक्ति को विपत्ति के दिन के लिए बचा कर रखा जाता है[a]; प्रकोप के दिन के लिए वे ले जाए जाते हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “विपत्ति के दिन के लिए रोक रखा जाता है।” इब्रानी क्रिया का अर्थ “बख्शा जाता है,” “रोक रखा जाता है,” या “आरक्षित रखा जाता है” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “प्रकोप के दिन के लिए सामने लाए जाते हैं।” अंतिम क्रिया का अर्थ उस दिन की ओर ले जाया जाना या उस दिन के लिए सामने लाया जाना हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार या स्पष्टीकरण प्रस्तुत करता है और प्रसंग के तर्क-संबंध को बनाए रखता है।
- source_word: לְיוֹם אֵיד
  choice: विपत्ति के दिन के लिए
  rationale: לְ यहाँ आने वाले समय की ओर संकेत करता है और אֵיד विपत्ति, संकट या विनाश को व्यक्त करता है।
- source_word: יֵחָשֶׂךְ
  choice: बचा रखा जाता है
  rationale: निफ़अल रूप का अर्थ ‘बख्शा जाना’, ‘रोका जाना’ या ‘सुरक्षित/आरक्षित रखा जाना’ हो सकता है। यह चयन तत्काल दंड से बचने और भावी दिन के लिए रखे जाने—दोनों भावों को यथासंभव खुला रखता है।
- source_word: רָע
  choice: दुष्ट जन
  rationale: एकवचन विशेषण यहाँ संज्ञा के रूप में किसी दुष्ट व्यक्ति को दर्शाता है। ‘दुष्ट जन’ आधुनिक, स्वाभाविक और प्रतिनिधिक एकवचन है।
- source_word: לְיוֹם עֲבָרוֹת
  choice: प्रकोप के दिन के लिए
  rationale: עֲבָרוֹת क्रोध, उग्रता या उमड़ते रोष का बहुवचन रूप है; यहाँ बहुवचन तीव्रता सूचित कर सकता है। ‘प्रकोप’ उस उग्र न्यायिक भाव को संक्षेप में व्यक्त करता है।
- source_word: יוּבָלוּ
  choice: वे ले जाए जाते हैं
  rationale: होफ़अल रूप का अर्थ ‘ले जाया जाना’, ‘लाया जाना’ या ‘पहुँचाया जाना’ है। बहुवचन ‘वे’ मूल पाठ में एकवचन से बहुवचन की वास्तविक बदलाहट को सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय न्याय के संबंध में पद का आशय
  choice: दुष्ट तत्काल विपत्ति से बचा रखा जाता है और भावी प्रकोप के दिन की ओर ले जाया जाता है।
  alternative: दुष्ट विपत्ति के दिन से पूरी तरह बचा लिया जाता है, अथवा उसे उसी समय प्रकोप का सामना करने के लिए सामने लाया जाता है।
  rationale: दोनों ‘दिन के लिए’ वाक्यांश और निष्क्रिय क्रियाएँ भावी न्याय तक स्थगन या आरक्षण का संकेत देती हैं, फिर भी क्रियाओं की शब्दार्थगत अनिश्चितता को पादटिप्पणियों में खुला रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। ‘दुष्ट जन’ प्रतिनिधिक एकवचन को और ‘वे’ मूल इब्रानी के बहुवचन-परिवर्तन को बनाए रखता है। ‘बचा रखा जाता है’ जानबूझकर बख्शे जाने और भावी न्याय के लिए सुरक्षित रखे जाने के बीच की अर्थगत तनावशीलता को पूरी तरह समाप्त नहीं करता।
