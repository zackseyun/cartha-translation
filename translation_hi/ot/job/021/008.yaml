lexical_decisions:
- source_word: זַרְעָם
  choice: उनकी संतान
  rationale: זֶרַע यहाँ सामूहिक रूप से संतान या वंश को सूचित करता है। ‘संतान’ आधुनिक हिन्दी में स्वाभाविक है और अर्थ को केवल छोटे बच्चों तक सीमित नहीं करता।
- source_word: נָכוֹן
  choice: स्थिर बनी रहती है
  rationale: यह रूप स्थापित, दृढ़ या सुरक्षित अवस्था में होने का भाव देता है। ‘स्थिर बनी रहती है’ मूल के अवस्थात्मक अर्थ और समृद्धि की निरंतरता को बनाए रखता है।
- source_word: לִפְנֵיהֶם
  choice: उनके सामने
  rationale: यह मूल अभिव्यक्ति का सीधा और स्वाभाविक अनुवाद है तथा इस बात का चित्र बनाए रखता है कि वे अपनी संतान को अपने सामने फलते-फूलते देखते हैं।
- source_word: עִמָּם
  choice: उनके साथ
  rationale: עִם का सामान्य अर्थ ‘साथ’ है। इसे अलग बनाए रखने से संतान के उनकी उपस्थिति में होने के साथ-साथ उनके पास बने रहने पर भी बल पड़ता है।
- source_word: וְצֶאֱצָאֵיהֶם
  choice: और उनके वंशज
  rationale: צֶאֱצָאִים भावी पीढ़ियों या वंशजों को सूचित करता है। ‘वंशज’ पहले आए ‘संतान’ से शब्दगत भेद रखते हुए समानांतरता को स्पष्ट करता है।
- source_word: לְעֵינֵיהֶם
  choice: उनकी आँखों के सामने
  rationale: यह प्रत्यक्ष रूप से अपनी आँखों से देखने की सजीव इब्रानी अभिव्यक्ति को बनाए रखता है और ‘उनके सामने’ के साथ समानांतरता भी सुरक्षित रखता है।
