base_translation:
  language: en
  yaml_path: translation/ot/job/021/009.yaml
  text: Their houses are safe from fear[b][a], and the rod of God is not upon them.
translation:
  language: hi
  text: उनके घर भय से सुरक्षित हैं,[a] और परमेश्वर की छड़ी उन पर नहीं है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके घराने भय से सुरक्षित हैं।”
    reason: lexical_alternative
  - marker: b
    text: “परमेश्वर की छड़ी” परमेश्वर के प्रहार, अनुशासन या क्लेश का रूपक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּתֵּיהֶם
  choice: उनके घर
  rationale: בַּיִת का बहुवचन प्रत्यय सहित शाब्दिक अर्थ ‘उनके घर’ है। प्रसंग में इसका विस्तार परिवार या घराने तक हो सकता है, पर मुख्य पाठ में ठोस इब्रानी बिंब रखा गया है।
- source_word: שָׁלוֹם מִפָּחַד
  choice: भय से सुरक्षित रहते हैं
  rationale: यहाँ שָׁלוֹם, מִפָּחַד के साथ, भय या संकट से मुक्त सुरक्षित दशा बताता है। आधुनिक हिन्दी में ‘भय से सुरक्षित’ स्वाभाविक और अर्थनिष्ठ है।
- source_word: שֵׁבֶט
  choice: छड़ी
  rationale: שֵׁבֶט के अर्थों में छड़ी, दंड और राजदंड आते हैं। यहाँ यह परमेश्वर के प्रहार, अनुशासन या क्लेश का व्यापक रूपक है; ‘छड़ी’ उस बिंब को बिना अधिक व्याख्या के बनाए रखती है।
- source_word: אֱלוֹהַּ
  choice: परमेश्वर
  rationale: अय्यूब में यह परमेश्वर के लिए प्रयुक्त एकवचन काव्यात्मक रूप है; हिन्दी बाइबलीय भाषा में ‘परमेश्वर’ इसका स्पष्ट और गरिमापूर्ण समतुल्य है।
- source_word: עֲלֵיהֶם
  choice: उन पर नहीं पड़ती
  rationale: छड़ी के रूपक के साथ केवल ‘उन पर नहीं है’ हिन्दी में अस्वाभाविक होता। ‘नहीं पड़ती’ प्रहार की अंतर्निहित छवि को स्वाभाविक हिन्दी में व्यक्त करता है, पर उसके उद्देश्य को दंड या अनुशासन के रूप में निश्चित नहीं करता।
theological_decisions:
- issue: ‘परमेश्वर की छड़ी’ से सूचित ईश्वरीय कार्य का स्वरूप
  choice: ‘परमेश्वर की छड़ी’ का रूपक बनाए रखा गया है।
  alternative: परमेश्वर का दंड / परमेश्वर की ताड़ना / परमेश्वर का प्रहार
  rationale: इब्रानी रूपक दंड, अनुशासन या क्लेश में से किसी एक को स्पष्ट रूप से निश्चित नहीं करता। रूपक को बनाए रखने से मूल का काव्यात्मक तनाव और वास्तविक अस्पष्टता सुरक्षित रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और काव्यात्मक है। ‘घर’ मुख्य पाठ में मूल बिंब रखता है, जबकि ‘घराने’ की व्यापक संभावना पादटिप्पणी में दी गई है।
