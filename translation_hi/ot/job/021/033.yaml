  text: מָֽתְקוּ ל֗/וֹ רִגְבֵ֫י נָ֥חַל וְ֭/אַחֲרָי/ו כָּל אָדָ֣ם יִמְשׁ֑וֹךְ וּ֝/לְ/פָנָ֗י/ו אֵ֣ין מִסְפָּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/033.yaml
  text: The clods of the valley are sweet to him[a]; all mankind follows after him[c][b], and those before him are without number.
translation:
  language: hi
  text: घाटी की मिट्टी के ढेले उसे मीठे लगते हैं[a]; सारी मानवजाति उसके पीछे चलती है[b][c], और उससे पहले के लोगों की कोई गिनती नहीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बरसाती नदी की सूखी धारा-भूमि के मिट्टी के ढेले उसे सुखद लगते हैं।” इब्रानी शब्द נחל घाटी, खड्ड या बरसाती नदी की धारा-भूमि को दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “हर मनुष्य”; यहाँ इसका अर्थ समस्त मनुष्य हैं।
    reason: lexical_alternative
  - marker: c
    text: 'यह पंक्ति शवयात्रा की ओर या मृत्यु की राह पर समस्त मानवजाति के बढ़ने की ओर संकेत कर सकती है: उससे पहले अनगिनत लोग जा चुके हैं और उसके पीछे सब चलते हैं।'
    reason: alternative_reading
lexical_decisions:
- source_word: מָתְקוּ
  choice: मीठे लगते हैं
  rationale: क्रिया מתק के मिठास या सुखदता के रूपक को बनाए रखता है; दफ़न की मिट्टी को केवल ‘सुखद’ कहकर रूपक को सपाट नहीं करता।
- source_word: רִגְבֵי נָחַל
  choice: घाटी की मिट्टी के ढेले
  rationale: רִגְבֵי ठोस मिट्टी के ढेलों को दर्शाता है। נָחַל घाटी, खड्ड या बरसाती नदी की धारा-भूमि हो सकता है; मुख्य पाठ में सहज ‘घाटी’ रखा गया है और विकल्प पादटिप्पणी में दिया गया है।
- source_word: כָּל אָדָם
  choice: सारी मानवजाति
  rationale: यहाँ אָדָם सामूहिक और सामान्य मानवीय अर्थ में है, किसी एक पुरुष के लिए नहीं।
- source_word: יִמְשׁוֹךְ
  choice: चली आती है
  rationale: משך का मूल अर्थ खींचना है, पर אַחֲרָיו के साथ यहाँ किसी के पीछे बढ़ते जाने का भाव है। यह अंत्येष्टि-जुलूस और मृत्यु की सार्वभौमिक राह—दोनों संभावनाएँ खुली रखता है।
- source_word: וּלְפָנָיו אֵין מִסְפָּר
  choice: उससे पहले जानेवालों की कोई गिनती नहीं
  rationale: ‘पहले’ के स्थानिक और कालगत दोनों संकेतों को रखता है तथा אֵין מִסְפָּר की अगणनीयता को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: दफ़न, अंत्येष्टि-जुलूस और सार्वभौमिक मृत्यु के बीच अर्थ-संबंध
  choice: ठोस दफ़न-चित्र रखते हुए ‘पीछे’ और ‘पहले जानेवालों’ की भाषा से दोनों संभावनाएँ खुली रखी गई हैं।
  alternative: इसे केवल शवयात्रा का वर्णन या केवल सब मनुष्यों के मृत्यु की ओर जाने का सामान्य कथन माना जा सकता है।
  rationale: इब्रानी पंक्ति दोनों अर्थों की ओर संकेत कर सकती है; किसी एक को मुख्य पाठ में निर्णायक बनाना मूल की वास्तविक अर्थगत गुंजाइश को कम कर देगा।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘मीठे लगते हैं’ मूल रूपक को सुरक्षित रखता है; ‘चली आती है’ सामूहिक प्रवाह का भाव देता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
