lexical_decisions:
- source_word: שָׂאוּנִי
  choice: मेरी बात सह लो
  rationale: נָשָׂא का मूल अर्थ ‘उठाना/ढोना/सहना’ है; यहाँ बहुवचन आज्ञार्थक रूप श्रोताओं से अय्यूब को बोलने का अवसर देते हुए धैर्य रखने को कहता है। केवल ‘मुझे सह लो’ की अपेक्षा ‘मेरी बात सह लो’ आधुनिक हिन्दी में अधिक स्वाभाविक है और प्रसंगगत आशय स्पष्ट करता है।
- source_word: וְאָנֹכִי אֲדַבֵּר
  choice: तब मैं बोलूँगा
  rationale: אָנֹכִי स्पष्ट और कुछ बलयुक्त प्रथम पुरुष सर्वनाम है, और אֲדַבֵּר का सीधा अर्थ ‘मैं बोलूँगा’ है। संयोजक וְ यहाँ आज्ञा के परिणाम या क्रम को स्वाभाविक हिन्दी में ‘तब’ से व्यक्त करता है।
- source_word: וְאַחַר דַּבְּרִי
  choice: और मेरे बोल चुकने के बाद
  rationale: דַּבְּרִי शाब्दिक रूप से ‘मेरे बोलने’ का क्रियार्थक रूप है। ‘मेरे बोल चुकने के बाद’ समयक्रम और क्रिया की पूर्णता को स्वाभाविक हिन्दी में रखता है।
- source_word: תַלְעִיג
  choice: तुम उपहास कर सकते हो
  rationale: לעג के हिफ़ील रूप का अर्थ ‘उपहास करना/ठट्ठा करना’ है। एकवचन क्रिया को ‘तुम’ से रखा गया है; ‘कर सकते हो’ प्रसंग में संभावित अनुमतिपरक या रियायती भाव व्यक्त करता है, जबकि साधारण भविष्य भी व्याकरणतः संभव है।
