  naturalness: “मेरे बोल चुकने के बाद” is understandable but somewhat awkward in modern standard Hindi. “मेरे बोलने के बाद” is direct, idiomatic, and accurately reflects the infinitive construct.
  terminology: “उपहास करना” is a suitable formal-modern equivalent for לעג. “कर सकते हो” can express the contextually concessive “may,” though the footnote rightly preserves the simple-future alternative.
