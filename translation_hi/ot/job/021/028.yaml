lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन से कारणात्मक अथवा व्याख्यात्मक संबंध जोड़ता है; हिन्दी में ‘क्योंकि’ इस प्रवाह को स्वाभाविक रूप से व्यक्त करता है।
- source_word: תֹאמְרוּ
  choice: तुम कहते हो
  rationale: अपूर्ण क्रिया यहाँ अय्यूब के वार्ताकारों की प्रतिनिधिक उक्ति को वर्तमान कथन के रूप में प्रस्तुत करती है।
- source_word: בֵית
  choice: घर
  rationale: मूल अर्थ और आवास की ठोस छवि सुरक्षित रहती है; ‘महल’ कहना अनावश्यक रूप से विशिष्ट होता।
- source_word: נָדִיב
  choice: प्रतिष्ठित व्यक्ति
  rationale: यहाँ शब्द सामाजिक रूप से प्रमुख, कुलीन अथवा राजसी व्यक्ति को सूचित कर सकता है, केवल उदार व्यक्ति को नहीं।
- source_word: אֹהֶל
  choice: तम्बू
  rationale: इब्रानी की मूल आवासीय छवि को सीधे और स्पष्ट आधुनिक हिन्दी में बनाए रखता है।
- source_word: מִשְׁכְּנוֹת רְשָׁעִים
  choice: वह निवास जहाँ दुष्ट रहते थे
  rationale: संक्षिप्त इब्रानी पदबंध को स्वाभाविक हिन्दी में खोलता है, जबकि ‘तम्बू’ और दुष्टों के निवास के बीच व्याख्यात्मक संबंध बनाए रखता है।
