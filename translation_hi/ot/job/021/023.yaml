    reason: ‘बְּעֶצֶם תֻּמּוֹ’ का शाब्दिक आधार ‘उसकी पूर्णता/अक्षुण्ण दशा के सार में’ है और यहाँ पूर्ण शारीरिक सामर्थ्य का भाव देता है; שָׁלֵיו के लिए ‘निर्विघ्न’ एक निकट वैकल्पिक अर्थ है।
lexical_decisions:
- source_word: זֶה
  choice: कोई तो
  rationale: यह संकेतवाचक शब्द यहाँ तुलना में एक प्रतिनिधि व्यक्ति का मामला सामने रखता है। ‘कोई तो’ आधुनिक हिन्दी में अगले विपरीत उदाहरण की भूमिका भी स्वाभाविक ढंग से तैयार करता है।
- source_word: יָמוּת
  choice: मरता है
  rationale: यहाँ अपूर्ण क्रिया सामान्य अनुभव बताती है, इसलिए वर्तमानकालिक ‘मरता है’ भावी ‘मरेगा’ से अधिक उपयुक्त है।
- source_word: בְּעֶצֶם תֻּמּוֹ
  choice: अपनी पूरी शक्ति में
  rationale: עֶצֶם मूलतः ‘हड्डी/सार’ और תֹּם/תֻּם ‘पूर्णता/समग्रता’ का बोध करा सकते हैं; संयुक्त पद यहाँ नैतिक खराई नहीं, बल्कि अक्षुण्ण शारीरिक दशा और भरपूर सामर्थ्य व्यक्त करता है।
- source_word: כֻּלּוֹ
  choice: पूरी तरह
  rationale: यह अगले दोनों विशेषणों को तीव्र करता है; ‘पूरी तरह’ सहज हिन्दी में इसकी क्रियाविशेषणीय शक्ति बनाए रखता है।
- source_word: שַׁלְאֲנַן
  choice: निश्चिन्त
  rationale: शब्द आराम, शान्त आत्मविश्वास और बाधा से मुक्त दशा दर्शाता है; ‘निश्चिन्त’ भौतिक समृद्धि का अनावश्यक आग्रह किए बिना यह अर्थ देता है।
- source_word: וְשָׁלֵיו
  choice: बेफ़िक्र
  rationale: यह निकटार्थक समानान्तर पद शान्त, अबाध और सुरक्षित दशा को पुष्ट करता है। ‘बेफ़िक्र’ ‘निश्चिन्त’ के साथ स्वाभाविक युग्म बनाकर मूल की पुनरुक्तिपरक तीव्रता बनाए रखता है।
