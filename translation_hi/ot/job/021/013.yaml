  yaml_path: translation/ot/job/021/013.yaml
  text: They spend their days in prosperity[a], and in a moment they go down to Sheol.
translation:
  language: hi
  text: 'वे अपने दिन सुख-समृद्धि में बिताते हैं,

    और पल भर में शीओल[a] में उतर जाते हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘कब्र,’ ‘मृतकों का लोक,’ अथवा ‘मृत्यु।’ इब्रानी शब्द ‘शीओल’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְבַלּוּ
  choice: बिताते हैं
  rationale: पिएल रूप यहाँ उनके दिनों के बीतने या उपयोग हो जाने का भाव देता है। आधुनिक हिन्दी में ‘अपने दिन बिताते हैं’ स्वाभाविक है और समय-संबंधी अर्थ को स्पष्ट रखता है।
- source_word: בַטּוֹב
  choice: सुख-समृद्धि में
  rationale: शाब्दिक अर्थ ‘भलाई में’ है, पर प्रसंग में यह दुष्टों की सुखी और संपन्न दशा को व्यक्त करता है। ‘सुख-समृद्धि’ भौतिक संपन्नता के साथ सामान्य कुशलता का भाव भी बनाए रखता है।
- source_word: יְמֵיהֶם
  choice: अपने दिन
  rationale: यह मूल के ‘उनके दिन’ को हिन्दी वाक्य-विन्यास में स्वाभाविक आत्मवाचक रूप से प्रस्तुत करता है।
- source_word: וּבְרֶגַע
  choice: और पल भर में
  rationale: רֶגַע अत्यंत थोड़े समय को सूचित करता है। ‘पल भर में’ पूरे जीवन की सुख-समृद्धि और आकस्मिक मृत्यु के बीच का विरोध उभारता है।
- source_word: שְׁאוֹל
  choice: शीओल
  rationale: लिप्यंतरण इब्रानी अवधारणा को खुला रखता है और उसे केवल ‘कब्र’, ‘मृत्यु’ या बाद की किसी विशिष्ट नरक-संबंधी धारणा तक सीमित नहीं करता।
- source_word: יֵחָתּוּ
  choice: उतर जाते हैं
  rationale: शीओल के साथ यह क्रिया नीचे जाने या उतरने की छवि देती है। ‘उतर जाते हैं’ हिन्दी में सहज है और मूल की दिशात्मक कल्पना बनाए रखता है।
theological_decisions:
- issue: שְׁאוֹל का अनुवाद
  choice: शीओल
  alternative: कब्र; मृतकों का लोक; मृत्यु
  rationale: यह पद मृतकों के गंतव्य की प्राचीन इब्रानी अवधारणा को व्यक्त करता है, पर उसे बाद की अधिक विशिष्ट ‘नरक’ संबंधी शिक्षा के बराबर नहीं ठहराता। लिप्यंतरण मूल की वैचारिक और धर्मवैज्ञानिक व्यापकता सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। काव्यात्मक समानांतरता के लिए पद को दो पंक्तियों में रखा गया है। फुटनोट-चिह्न ‘शीओल’ के बाद लगाया गया है, क्योंकि टिप्पणी उसी शब्द से संबंधित है।
