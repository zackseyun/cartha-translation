base_translation:
  language: en
  yaml_path: translation/ot/job/021/019.yaml
  text: God stores up his iniquity for his sons? Let him repay it to the man himself[c][b][a], so that he may know it.
translation:
  language: hi
  text: क्या परमेश्वर उसका अधर्म उसके बेटों के लिए बचाकर रखता है?[a][b] वह उसके अधर्म का प्रतिफल उसी को दे, ताकि वह जान ले।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'हिब्रू को बिना प्रश्न के भी अनुवाद किया जा सकता है: “परमेश्वर उसका अधर्म उसके बेटों के लिए बचाकर रखता है; वह उसके अधर्म का प्रतिफल उसी को दे, ताकि वह जान ले।” प्रसंग आरम्भिक बात को चुनौती के रूप में सुनने का समर्थन करता है।'
    reason: alternative_reading
  - marker: b
    text: हिब्रू में शाब्दिक शब्द “बेटे” है; प्रसंग में इसका व्यापक आशय वंशज भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: “अधर्म” के लिए आया हिब्रू शब्द प्रसंग के अनुसार दुष्टता, कष्ट, अथवा दुष्टता के दुष्परिणाम का भी बोध करा सकता है। इसलिए दूसरे उपवाक्य में “प्रतिफल” उस व्यक्ति पर आने वाले परिणाम को स्पष्ट करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלוֹהַּ
  choice: परमेश्वर
  rationale: अय्यूब में यह परमेश्वर के लिए प्रयुक्त सामान्य एकवचन पद है; ‘परमेश्वर’ स्वाभाविक और गरिमापूर्ण हिन्दी समतुल्य है।
- source_word: יִצְפֹּן
  choice: सँभाल रखता है
  rationale: צפן का अर्थ छिपाकर या भविष्य के लिए रख छोड़ना हो सकता है। यहाँ यह बाद के प्रतिफल के लिए सुरक्षित रखने का भाव व्यक्त करता है।
- source_word: לְבָנָיו
  choice: उसके बेटों के लिए
  rationale: हिब्रू में स्पष्ट रूप से पुल्लिंग बहुवचन ‘बेटे’ है; व्यापक आशय वंशज भी हो सकता है, जिसे पादटिप्पणी में रखा गया है।
- source_word: אוֹנוֹ
  choice: उसका अधर्म
  rationale: אָוֶן दुष्टता, अधर्म, कष्ट अथवा उसके दुष्परिणाम का संकेत दे सकता है। ‘अधर्म’ स्रोत के निकट है और दण्ड की व्याख्या को मुख्य पाठ में आरोपित नहीं करता।
- source_word: יְשַׁלֵּם
  choice: वह उसका बदला ... चुकाए
  rationale: पिएल रूप प्रतिफल देने या बदला चुकाने का अर्थ रखता है। प्रसंग में इसे इच्छा/चुनौती के रूप में लेना अय्यूब के तर्क के अनुकूल है।
- source_word: אֵלָיו
  choice: उसी को
  rationale: सर्वनाम दुष्ट मनुष्य की ओर लौटता है; ‘उसी को’ उसके बेटों के साथ निहित विरोध स्पष्ट करता है।
- source_word: וְיֵדָע
  choice: ताकि वह स्वयं उसे जान ले
  rationale: ידע मूलतः ‘जानना’ है। यहाँ परिणाम अथवा उद्देश्य का भाव है और ‘स्वयं’ उस व्यक्ति के अपने अनुभव पर बल देता है।
theological_decisions:
- issue: आरम्भिक उपवाक्य अय्यूब का कथन है या उस धारणा पर प्रश्न जिसे वह चुनौती दे रहा है
  choice: इसे आलंकारिक प्रश्न के रूप में प्रस्तुत किया गया है, जिसके बाद अय्यूब की चुनौती आती है कि प्रतिफल उसी मनुष्य को मिले।
  alternative: 'पूरे पद को सीधे कथन के रूप में पढ़ना: ‘परमेश्वर उसका अधर्म उसके बेटों के लिए सँभाल रखता है; वह उसे चुकाए, और वह जान ले।’'
  rationale: अध्याय के तर्क में अय्यूब इस विचार को चुनौती देता है कि दुष्ट का उचित प्रतिफल उसके बच्चों पर आने से न्याय पूरा हो जाता है। हिब्रू में प्रश्नचिह्न नहीं है, इसलिए वैकल्पिक सीधा पाठ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण शैली। प्रश्नात्मक रूप से अय्यूब की चुनौती स्पष्ट की गई है, जबकि हिब्रू की व्याकरणिक अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
