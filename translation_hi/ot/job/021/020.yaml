base_translation:
  language: en
  yaml_path: translation/ot/job/021/020.yaml
  text: Let his own eyes see his ruin[b][a], and let him drink from the wrath of the Almighty.
translation:
  language: hi
  text: उसकी अपनी आँखें उसका विनाश देखें[b][a], और वह सर्वशक्तिमान के क्रोध को पीए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी आँखें उसकी विपत्ति देखेंगी, और वह सर्वशक्तिमान के क्रोध को पीएगा।” हिब्रू के अपूर्ण क्रिया-रूपों को इच्छा के बजाय भविष्यसूचक कथन भी समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: “विनाश” का अनुवाद “विपत्ति,” “अनर्थ” या “बरबादी” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאוּ
  choice: देखें
  rationale: ראה का क़ाल अपूर्ण 3 बहुवचन रूप है, जिसका व्याकरणिक कर्ता ‘उसकी आँखें’ है। प्रसंग में इसे इच्छा/कामना के रूप में रखा गया है; हिंदी में ‘देखें’ इस अर्थ और बहुवचन कर्ता दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עינ/ו (עֵינָיו)
  choice: उसकी अपनी आँखें
  rationale: 3 पुरुष एकवचन संबंधसूचक प्रत्यय सहित संज्ञा का अर्थ ‘उसकी आँखें’ है। ‘अपनी’ उस व्यक्तिगत अनुभव पर बल देता है कि दुष्ट स्वयं अपने परिणाम को देखे।
- source_word: כִּידוֹ
  choice: उसका विनाश
  rationale: כִּיד विपत्ति, अनर्थ, विनाश या बरबादी को सूचित कर सकता है। ‘विनाश’ संक्षिप्त और गरिमापूर्ण है; व्यापक अर्थ-क्षेत्र को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וּמֵחֲמַת
  choice: और ... के क्रोध में से
  rationale: חֵמָה का अर्थ क्रोध, प्रचंड रोष, और कुछ संदर्भों में विष हो सकता है। पीने की रूपकात्मक भाषा और दिव्य न्याय के संदर्भ में ‘क्रोध’ उपयुक्त है; מִן को ‘में से’ द्वारा स्पष्ट रूप से बनाए रखा गया है।
- source_word: שַׁדַּי
  choice: सर्वशक्तिमान
  rationale: अय्यूब में ईश्वरीय उपाधि שַׁדַּי का प्रचलित और अर्थपूर्ण हिंदी रूप, बिना किसी अतिरिक्त सांप्रदायिक व्याख्या के।
- source_word: יִשְׁתֶּה
  choice: वह ... पिए
  rationale: שתה का क़ाल अपूर्ण 3 पुरुष एकवचन रूप है। समानांतर पहली पंक्ति के साथ इसे इच्छा के रूप में लिया गया है। ‘पिए’ न्याय को पीने के मूल रूपक को बनाए रखता है।
theological_decisions:
- issue: पद के अपूर्ण क्रिया-रूपों का बल
  choice: 'इच्छा/कामना के रूप में: ‘आँखें ... देखें ... वह ... पिए’'
  alternative: 'भविष्यसूचक कथन: ‘उसकी आँखें ... देखेंगी, और वह ... पिएगा’'
  rationale: प्रसंग में अय्यूब इस बात पर बल देता है कि दुष्ट व्यक्ति स्वयं न्याय का अनुभव करे, केवल उसकी संतान नहीं। इसलिए कामनासूचक पाठ मुख्य अनुवाद में उपयुक्त है, जबकि हिब्रू अपूर्ण रूपों की भविष्यसूचक संभावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज, गरिमापूर्ण काव्यात्मक गद्य। ‘उसकी अपनी आँखें’ व्यक्तिगत अनुभव पर बल देता है। ‘क्रोध में से पिए’ मूल हिब्रू की मִן-संरचना और पीने के रूपक को सुरक्षित रखता है; पादटिप्पणी-चिह्न मुख्य पाठ में अंग्रेज़ी परामर्श-पाठ के क्रम [b][a] में दिए गए हैं।
