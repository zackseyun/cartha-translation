source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ לָ֭/אֵל ס֣וּר מִמֶּ֑/נּוּ וְ/דַ֥עַת דְּ֝רָכֶ֗י/ךָ לֹ֣א חָפָֽצְנוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/014.yaml
  text: Yet they say to God[a], ‘Depart from us, and we do not desire the knowledge of your ways.’
translation:
  language: hi
  text: फिर भी वे परमेश्वर से कहते हैं[a], “हमसे दूर हो जाइए! और हम आपके मार्गों का ज्ञान नहीं चाहते।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हमसे हट जाइए” / “हमसे चले जाइए।”
    reason: סוּר के अर्थ-क्षेत्र में हटना, मुड़ जाना और दूर चले जाना सम्मिलित हैं।
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: फिर भी वे कहते हैं
  rationale: वाव-युक्त कथन-क्रिया प्रसंग में दुष्टों के निरंतर या विशिष्ट रवैये को सामने लाती है। पूर्ववर्ती समृद्धि के विपरीत उनके विद्रोही कथन को दिखाने के लिए ‘फिर भी’ प्रसंगानुकूल है।
- source_word: לָאֵל
  choice: परमेश्वर से
  rationale: אֵל यहाँ किसी विशिष्ट नाम के बजाय परमेश्वर के सामान्य निर्देश के रूप में प्रयुक्त है; ‘परमेश्वर से’ स्वाभाविक और स्पष्ट हिन्दी है।
- source_word: סוּר מִמֶּנּוּ
  choice: हमसे दूर हो जा
  rationale: סור का आज्ञार्थक अर्थ ‘हट जाना/दूर हो जाना’ है। यह अनुवाद परमेश्वर को सीधे दी गई कठोर आज्ञा को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: וְדַעַת
  choice: और ... ज्ञान
  rationale: וְ को ‘और’ से सीधे व्यक्त करने पर इब्रानी समानांतर संरचना और दोनों कथनों का संबंध सुरक्षित रहता है; דַּעַת को ‘ज्ञान’ कहना केवल बौद्धिक समझ से अधिक व्यापक जानने के भाव को बनाए रखता है।
- source_word: דְּרָכֶיךָ
  choice: तेरे मार्गों
  rationale: דֶּרֶךְ के बहुवचन का आशय परमेश्वर के आचरण, कार्य और नैतिक इच्छा से हो सकता है। ‘तेरे मार्ग’ इस अर्थ-विस्तार को सुरक्षित रखता है।
- source_word: לֹא חָפָצְנוּ
  choice: हम ... नहीं चाहते
  rationale: חפץ इच्छा, प्रसन्नता या रुचि को व्यक्त करता है। यहाँ ‘नहीं चाहते’ जानबूझकर किए गए अस्वीकार को स्वाभाविक हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: दुष्टों द्वारा परमेश्वर को सीधे संबोधित करना
  choice: “हमसे दूर हो जा!” के रूप में सीधा आज्ञार्थक संबोधन
  alternative: “हमें अकेला छोड़ दे” जैसा अप्रत्यक्ष या अधिक बोलचाल का भावानुवाद
  rationale: इब्रानी में परमेश्वर को दी गई स्पष्ट और कठोर आज्ञा है। सीधा संबोधन मानवीय विद्रोह की धार्मिक तीक्ष्णता को बिना नरम किए सुरक्षित रखता है।
- issue: दोनों उपवाक्यों का संबंध
  choice: ‘और’ से समन्वय
  alternative: ‘क्योंकि’ द्वारा कारणसूचक संबंध को स्पष्ट करना
  rationale: मूल पाठ में सामान्य संयोजक וְ है। ‘और’ संभावित तार्किक संबंध को व्याख्या द्वारा निश्चित किए बिना इब्रानी की समानांतरता और वास्तविक अस्पष्टता बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। परमेश्वर के लिए ‘तू/तेरा’ रूप काव्यात्मक प्रत्यक्ष संबोधन की तीव्रता बनाए रखता है; यह अनादरपूर्ण अनुवादकीय टिप्पणी नहीं, बल्कि वक्ताओं के विद्रोही कथन का प्रतिनिधित्व है।
