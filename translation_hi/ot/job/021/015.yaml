  text: מַה שַׁדַּ֥י כִּֽי נַֽעַבְדֶ֑/נּוּ וּ/מַה נּ֝וֹעִ֗יל כִּ֣י נִפְגַּע בּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/015.yaml
  text: What is the Almighty[a], that we should serve him? And what would we gain if we entreat him?
translation:
  language: hi
  text: “सर्वशक्तिमान कौन है कि हम उसकी सेवा करें? और उससे विनती करने पर हमें क्या लाभ होगा?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַה שַׁדַּי
  choice: सर्वशक्तिमान कौन है
  rationale: מַה यहाँ तिरस्कारपूर्ण आलंकारिक प्रश्न प्रस्तुत करता है। स्वाभाविक हिन्दी में किसी व्यक्तित्व के विषय में “कौन है” इस भाव को स्पष्ट रखता है, जबकि שַׁדַּי के लिए प्रचलित अर्थपरक उपाधि “सर्वशक्तिमान” अपनाई गई है।
- source_word: כִּי נַעַבְדֶנּוּ
  choice: कि हम उसकी सेवा करें
  rationale: עבד का अर्थ परमेश्वर के प्रति धार्मिक सेवा और निष्ठा है; “सेवा करें” इसे केवल उपासना-विधि तक सीमित नहीं करता।
- source_word: וּמַה נּוֹעִיל
  choice: और ... हमें क्या लाभ होगा
  rationale: יעל हित, उपयोग या लाभ पहुँचने का भाव रखता है। “हमें क्या लाभ होगा” वक्ताओं की स्वार्थपरक दृष्टि और समानांतर आलंकारिक प्रश्न को सहज हिन्दी में व्यक्त करता है।
- source_word: כִּי נִפְגַּע בּוֹ
  choice: उससे विनती करने पर
  rationale: פגע ב यहाँ किसी से आग्रह या प्रार्थना करने के अर्थ में है। “विनती करना” प्रार्थनापूर्ण निवेदन को गरिमापूर्ण और सामान्य आधुनिक हिन्दी में व्यक्त करता है; כִּי को प्रसंगानुसार परिस्थितिवाचक “करने पर” कहा गया है।
theological_decisions:
- issue: ईश्वरीय उपाधि שַׁדַּי का अनुवाद
  choice: सर्वशक्तिमान
  alternative: शद्दाय
  rationale: यहाँ उपाधि का अर्थ सामान्य पाठक तक पहुँचाने के लिए उसका अनुवाद किया गया है; लिप्यंतरण से उसका अर्थ अस्पष्ट रह सकता था।
- issue: מַה के साथ परमेश्वर के विषय में प्रश्न
  choice: कौन है
  alternative: क्या है
  rationale: मूल का מַה प्रश्न के तिरस्कारपूर्ण मूल्यांकन को दर्शाता है, पर हिन्दी में “सर्वशक्तिमान क्या है” परमेश्वर को वस्तु बताने जैसा अस्वाभाविक प्रभाव दे सकता है। “कौन है कि...” मूल की चुनौती और आलंकारिक बल को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। पद में दुष्ट लोगों की उद्धृत, तिरस्कारपूर्ण वाणी को प्रश्नात्मक संरचना द्वारा सुरक्षित रखा गया है।
