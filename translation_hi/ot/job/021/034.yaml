  text: וְ֭/אֵיךְ תְּנַחֲמ֣וּ/נִי הָ֑בֶל וּ֝/תְשֽׁוּבֹתֵי/כֶ֗ם נִשְׁאַר מָֽעַל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/021/034.yaml
  text: How then can you comfort me with emptiness[a], when your answers remain nothing but treachery?
translation:
  language: hi
  text: 'तो फिर तुम खोखली बातों से मुझे कैसे सांत्वना दे सकते हो,[a]

    जबकि तुम्हारे उत्तर केवल विश्वासघात ही रह जाते हैं?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तो फिर तुम मुझे व्यर्थ ही कैसे सांत्वना दे सकते हो, जबकि तुम्हारे उत्तर विश्वासघात ही रह जाते हैं?”
    reason: הָבֶל को सांत्वना की विषयवस्तु (‘खोखली बातों से’) के बजाय क्रियाविशेषणात्मक रूप में (‘व्यर्थ ही’) समझा जा सकता है।
lexical_decisions:
- source_word: וְאֵיךְ
  choice: तो फिर ... कैसे
  rationale: प्रश्नवाचक क्रियाविशेषण के साथ वाव का प्रसंगगत संबंध दिखाने के लिए ‘तो फिर’ स्वाभाविक है और अय्यूब की आलंकारिक चुनौती को व्यक्त करता है।
- source_word: תְּנַחֲמוּנִי
  choice: मुझे ... सांत्वना दे सकते हो
  rationale: नחם के पिएल रूप और प्रथम पुरुष एकवचन प्रत्यय का अर्थ ‘मुझे सांत्वना देना’ है; ‘दे सकते हो’ प्रश्न में निहित चुनौती को सहज हिन्दी में व्यक्त करता है।
- source_word: הָבֶל
  choice: व्यर्थ बातों से
  rationale: הבל यहाँ खोखलेपन, निरर्थकता या व्यर्थता को दर्शाता है। ‘व्यर्थ बातों से’ मित्रों की सांत्वना की खाली विषयवस्तु को स्पष्ट करते हुए मूल संज्ञा का भाव बनाए रखता है।
- source_word: וּתְשׁוּבוֹתֵיכֶם
  choice: तुम्हारे उत्तरों में
  rationale: תשובה का सीधा अर्थ ‘उत्तर’ या ‘जवाब’ है। ‘उत्तर’ गरिमापूर्ण और सामान्य आधुनिक हिन्दी में स्वाभाविक है; ‘में’ अगले विधेय से संबंध को स्पष्ट करता है।
- source_word: נִשְׁאַר
  choice: बाकी रह जाता है
  rationale: निफ़अल रूप का अर्थ ‘बचा रहना’ या ‘बाकी रह जाना’ है। एकवचन क्रिया को सामूहिक कथन के रूप में रखते हुए यह मूल की संरचना के निकट है।
- source_word: מָעַל
  choice: विश्वासघात
  rationale: מעל केवल तथ्यगत भूल नहीं, बल्कि निष्ठाभंग, बेवफ़ाई या विश्वासघात का बोध देता है। ‘विश्वासघात’ आरोप की गंभीरता और संबंधपरक आयाम को सुरक्षित रखता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। ‘व्यर्थ बातों’ से खोखली सांत्वना का आशय स्पष्ट होता है, जबकि पादटिप्पणी मूल की व्याकरणिक और अर्थगत वैकल्पिकता सुरक्षित रखती है।
