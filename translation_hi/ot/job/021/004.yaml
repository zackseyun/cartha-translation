  text: क्या मेरी शिकायत किसी मनुष्य के विरुद्ध है? यदि नहीं, तो मेरी आत्मा अधीर क्यों न हो?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׂיחִי
  choice: मेरी शिकायत
  rationale: इस प्रसंग में अय्यूब का दुःखभरा कथन और विरोध अभिप्रेत है; ‘शिकायत’ इसे स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: לְאָדָם
  choice: किसी मनुष्य से
  rationale: לְ यहाँ शिकायत के लक्ष्य या संबोधन को सूचित करता है; अनिश्चित सामूहिक אָדָם के लिए ‘किसी मनुष्य’ स्वाभाविक हिन्दी है।
- source_word: וְאִם
  choice: और यदि नहीं
  rationale: प्रसंग में पहले प्रश्न के नकारात्मक निहित उत्तर को लेकर अगला प्रश्न आगे बढ़ता है; ‘यदि नहीं’ उस संक्षिप्त इब्रानी तर्क-संबंध को स्पष्ट करता है।
- source_word: תִקְצַר רוּחִי
  choice: मेरी आत्मा अधीर ... हो
  rationale: शाब्दिक रूप से ‘मेरी आत्मा छोटी हो’ अधीरता का मुहावरा है। ‘अधीर हो’ अर्थ को स्वाभाविक हिन्दी में देता है, जबकि ‘मेरी आत्मा’ רוּחִי को स्पष्ट रूप से बनाए रखता है।
theological_decisions:
- issue: רוּחִי का अनुवाद
  choice: मेरी आत्मा
  alternative: मैं / मेरा मन
  rationale: मूल पाठ व्यक्ति के भीतर की ‘रूआख’ का उल्लेख करता है। ‘मेरी आत्मा’ इस अभिव्यक्ति को मिटाए बिना हिन्दी में समझने योग्य है और यहाँ आत्मा की प्रकृति पर कोई अतिरिक्त सिद्धांत आरोपित नहीं करता।
