source:
  edition: WLC
  text: הֲ/לֹ֣א שְׁ֭אֶלְתֶּם ע֣וֹבְרֵי דָ֑רֶךְ וְ֝/אֹתֹתָ֗/ם לֹ֣א תְנַכֵּֽרוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/029.yaml
  text: Have you not asked those who travel the road[b][a], and do you not recognize their signs?
translation:
  language: hi
  text: क्या तुमने राहगीरों से नहीं पूछा? और क्या तुम उनके संकेतों[a] को नहीं पहचानते?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनके चिह्नों” अथवा “उनके बताए प्रमाणों।” सम्भवतः आशय उन प्रमाणों या लक्षणों से है जिन्हें राहगीर अपने अनुभव से जानते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: क्या ... नहीं
  rationale: यह सहमति की अपेक्षा रखने वाले आलंकारिक प्रश्न और अय्यूब के उलाहने के स्वर, दोनों को बनाए रखता है।
- source_word: שְׁאֶלְתֶּם
  choice: तुमने ... पूछा
  rationale: क्रिया का सीधा अर्थ ‘पूछना’ या ‘पूछताछ करना’ है; आधुनिक हिन्दी में ‘पूछा’ स्वाभाविक है।
- source_word: עֹבְרֵי דָרֶךְ
  choice: राहगीरों
  rationale: शाब्दिक भाव ‘राह पर से गुजरने वाले’ है। ‘राहगीर’ संक्षिप्त, प्रचलित और ऐसे यात्रियों के लिए स्वाभाविक है जिनके अनुभव की दुहाई दी जा रही है।
- source_word: וְאֹתֹתָם
  choice: उनके संकेतों
  rationale: אוֹת का मूल अर्थ ‘चिह्न’ या ‘संकेत’ है। ‘संकेत’ मूल शब्द की व्यापकता बनाए रखता है और संदर्भ में यात्रियों द्वारा ज्ञात प्रमाणों अथवा लक्षणों को भी समेट सकता है।
- source_word: לֹא תְנַכֵּרוּ
  choice: क्या तुम ... नहीं पहचानते
  rationale: पिएल रूप यहाँ ‘पहचानना’ या ‘स्वीकार करना’ हो सकता है। ‘पहचानते’ संकेतों के साथ सहज बैठता है और मूल की संभावित प्रश्नात्मक ध्वनि बनाए रखता है।
theological_decisions:
- issue: ‘उनके संकेतों’ का सटीक संदर्भ
  choice: मुख्य पाठ में ‘उनके संकेतों’ रखकर संदर्भ को खुला रखा गया है।
  alternative: ‘उनकी गवाही’ या ‘उनके बताए प्रमाण’
  rationale: इब्रानी אוֹתֹתָם का अर्थ संकेत, चिह्न या प्रमाणसूचक निशान हो सकता है। इसे सीधे ‘गवाही’ कहना संदर्भ की व्याख्या को मूल शब्द से अधिक निश्चित कर देगा।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘राहगीर’ सामान्य पाठक के लिए स्वाभाविक है; दो समानांतर प्रश्न इब्रानी की आलंकारिक, उलाहनेभरी शैली को सुरक्षित रखते हैं।
