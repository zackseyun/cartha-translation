  text: May they be like straw before the wind[a], and like chaff that a storm carries away.
translation:
  language: hi
  text: 'वे हवा के आगे पुआल के समान हो जाएँ,

    और भूसी के समान, जिसे आँधी चुरा ले जाती है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘जिसे आँधी उड़ा ले जाती है’ या ‘झपटकर ले जाती है’ भी हो सकता है। इब्रानी क्रिया का शाब्दिक अर्थ ‘चुराना’ है और यहाँ वह अचानक उठा ले जाने का काव्यात्मक चित्र प्रस्तुत करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יִהְיוּ
  choice: हो जाएँ
  rationale: अपूर्ण क्रिया यहाँ अय्यूब के अलंकारिक कथन में इच्छासूचक/विधिलिंग-सदृश भाव रखती है। ‘हो जाएँ’ इस भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: כְּתֶבֶן
  choice: भूसे के समान
  rationale: תבן सूखे डंठलों या पुआल/भूसे को सूचित करता है। ‘भूसा’ साधारण आधुनिक हिन्दी में बिंब को स्पष्ट रखता है।
- source_word: לִפְנֵי רוּחַ
  choice: हवा के सामने
  rationale: यह पद हवा की शक्ति के आगे पड़े और उससे उड़ाए जाने वाले पदार्थ का चित्र देता है; ‘हवा के सामने’ इब्रानी संरचना और काव्यात्मक बिंब दोनों सुरक्षित रखता है।
- source_word: וּכְמֹץ
  choice: और उस भूसी के समान
  rationale: מֹץ अनाज से अलग हुई हल्की भूसी है। ‘भूसी’ पहले पद के ‘भूसे’ से इसका सूक्ष्म भेद बनाए रखती है।
- source_word: גְּנָבַתּוּ
  choice: चुरा ले जाती है
  rationale: גנב का मूल अर्थ ‘चुराना’ है। आँधी के साथ यह अचानक उठा ले जाने का काव्यात्मक चित्र बनाता है; हिन्दी में ‘चुरा ले जाती है’ अर्थपूर्ण और स्वाभाविक है तथा मूल रूपक को सपाट नहीं करता।
- source_word: סוּפָה
  choice: आँधी
  rationale: סוּפָה प्रचंड तूफ़ान/आँधी को सूचित करता है। यहाँ हल्की भूसी को उड़ा ले जाने के चित्र में ‘आँधी’ सहज और सटीक है।
theological_decisions:
- issue: יִהְיוּ का भाव—इच्छा, विधि, या कथन
  choice: हो जाएँ
  alternative: वे होते हैं / वे हों
  rationale: संदर्भ में दुष्टों की अपेक्षित दशा के विषय में अलंकारिक, इच्छासूचक स्वर संभव है। अनिश्चितता को कठोर तथ्यात्मक कथन में बदलने के बजाय ‘हो जाएँ’ उस मोडल तनाव को रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। ‘भूसा’ तथा ‘भूसी’ से दोनों समानांतर इब्रानी संज्ञाओं का भेद रखा गया है। पंक्ति-विभाजन इब्रानी काव्य-समानांतरता को स्पष्ट करता है।
