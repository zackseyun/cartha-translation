translation:
  language: hi
  text: जब मैं यह याद करता हूँ, तो घबरा जाता हूँ; मेरे शरीर में कंपकंपी छा जाती है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם זָכַרְתִּי
  choice: जब मैं यह याद करता हूँ
  rationale: यहाँ אִם को प्रसंगानुसार कालवाचक ‘जब’ माना गया है। ‘यह’ अय्यूब के मन में उपस्थित उस विचार की ओर स्वाभाविक संकेत करता है, जिसे अगली आयतें स्पष्ट करती हैं।
- source_word: וְנִבְהָלְתִּי
  choice: तो घबरा जाता हूँ
  rationale: נבהל तीव्र व्याकुलता, भय या स्तब्ध घबराहट व्यक्त करता है; आधुनिक हिन्दी में ‘घबरा जाता हूँ’ सहज और पर्याप्त रूप से प्रबल है।
- source_word: פַּלָּצוּת
  choice: कंपकंपी
  rationale: यह संज्ञा भय से उत्पन्न थरथराहट या दहशत को दर्शाती है; ‘कंपकंपी’ शरीर पर पड़ने वाले प्रभाव को स्पष्ट रखती है।
- source_word: וְאָחַז בְּשָׂרִי
  choice: मेरे शरीर में ... छा जाती है
  rationale: शाब्दिक अर्थ ‘मेरे मांस को पकड़ लेती है’ है। हिन्दी में ‘शरीर में कंपकंपी छा जाती है’ उसी अचानक और व्यापक शारीरिक प्रभाव को स्वाभाविक ढंग से व्यक्त करता है।
