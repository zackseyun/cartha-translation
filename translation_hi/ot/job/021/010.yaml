  text: His bull breeds and does not fail[a]; his cow calves and does not miscarry.
translation:
  language: hi
  text: उसका साँड़ गर्भाधान करता है और निष्फल नहीं होता[a]; उसकी गाय बछड़ा जनती है और उसका गर्भ नहीं गिरता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “और त्याग नहीं देता” अथवा “और बाँझ नहीं करता।” यहाँ प्रयुक्त इब्रानी क्रिया कठिन है; मुख्य पाठ समानांतर पंक्ति के अनुसार यह भाव देता है कि साँड़ का गर्भाधान सफल होता है, निष्फल नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹרוֹ
  choice: उसका साँड़
  rationale: प्रजनन के संदर्भ में שׁוֹר नर गोवंश को दर्शाता है; इसलिए सामान्य ‘बैल’ की अपेक्षा ‘साँड़’ अधिक सटीक है।
- source_word: עִבַּר
  choice: गर्भाधान करता है
  rationale: यहाँ क्रिया नर पशु द्वारा सफलतापूर्वक गर्भ ठहराने के अर्थ में है। ‘गर्भाधान करता है’ आधुनिक हिन्दी में प्रजनन का आशय स्पष्ट रखता है।
- source_word: וְלֹא יַגְעִל
  choice: और निष्फल नहीं होता
  rationale: इस कठिन क्रिया का प्रसंगगत अर्थ है कि साँड़ का गर्भाधान विफल या बेअसर नहीं रहता। यह अनुवाद समानांतर पंक्ति के सफल प्रसव के भाव को बनाए रखता है, जबकि शाब्दिक अनिश्चितता पादटिप्पणी में दी गई है।
- source_word: תְּפַלֵּט
  choice: बछड़ा जनती है
  rationale: यहाँ क्रिया गाय के संतान उत्पन्न करने को बताती है; ‘बछड़ा जनती है’ सामान्य हिन्दी में स्पष्ट और प्रसंगानुकूल है।
- source_word: פָּרָתוֹ
  choice: उसकी गाय
  rationale: פָּרָה का सामान्य और सटीक हिन्दी प्रतिशब्द ‘गाय’ है; पाठ किसी विशेष आयु की बछिया का संकेत नहीं देता।
- source_word: וְלֹא תְשַׁכֵּל
  choice: और उसका गर्भ नहीं गिरता
  rationale: प्रसव-संदर्भ में שׁכל संतान खोने या गर्भपात होने का भाव देता है। ‘उसका गर्भ नहीं गिरता’ साधारण आधुनिक हिन्दी में स्वाभाविक है।
