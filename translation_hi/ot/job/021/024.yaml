    reason: lexical_alternative
lexical_decisions:
- source_word: עֲטִינָיו
  choice: उसके दूध-पात्र
  rationale: यह एक दुर्लभ और विवादित संज्ञा है, जो दूध रखने वाले पात्रों या दूध देने वाले अंगों का संकेत कर सकती है। मुख्य पाठ में ‘दूध-पात्र’ समृद्धि और भरपूरी का ठोस बिंब स्वाभाविक हिन्दी में बनाए रखता है; ‘थन’ को पाठ-टिप्पणी में सुरक्षित रखा गया है।
- source_word: מָלְאוּ
  choice: भरे रहते हैं
  rationale: पूर्ण क्रिया यहाँ केवल बीती घटना के बजाय स्थायी समृद्ध अवस्था का वर्णन करती है; ‘भरे रहते हैं’ इस स्थितिवाचक अर्थ को व्यक्त करता है।
- source_word: חָלָב
  choice: दूध
  rationale: इसका सामान्य शाब्दिक अर्थ ‘दूध’ है, जो प्रसंग में प्रचुरता और संपन्नता का बिंब है।
- source_word: וּמֹחַ עַצְמוֹתָיו
  choice: और उसकी हड्डियों का गूदा
  rationale: रचना-संबंध को सीधे रखते हुए शरीर की शक्ति और स्वास्थ्य का ठोस इब्रानी बिंब सुरक्षित रखा गया है।
- source_word: יְשֻׁקֶּה
  choice: अच्छी तरह सींचा रहता है
  rationale: पुअल रूप नमी या तरावट पहुँचाए जाने की अवस्था बताता है। ‘अच्छी तरह सींचा रहता है’ मूल के जल-संबंधी काव्यात्मक बिंब और भरपूर शारीरिक स्फूर्ति दोनों को बनाए रखता है।
