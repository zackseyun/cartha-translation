  text: Together they lie down in the dust[a], and worms cover them.
translation:
  language: hi
  text: दोनों एक साथ धूल में लेट जाते हैं, और कीड़े[a] उन्हें ढक लेते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सड़न के कीड़े।” इब्रानी शब्द शरीर के सड़ने के संदर्भ में कीड़ों या लार्वों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחַד
  choice: दोनों एक साथ
  rationale: यह क्रियाविशेषण पिछले संदर्भ में वर्णित दोनों व्यक्तियों की समान अंतिम दशा पर बल देता है। ‘दोनों एक साथ’ हिन्दी में इस साझा नियति को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עַל עָפָר
  choice: धूल में
  rationale: עַל का मूल अर्थ ‘पर’ है, पर मृत्यु और दफन के संदर्भ में हिन्दी में ‘धूल में लेटना’ अधिक स्वाभाविक है और कब्र में पड़े होने की छवि बनाए रखता है।
- source_word: יִשְׁכָּבוּ
  choice: लेट जाते हैं
  rationale: यहाँ अपूर्ण क्रिया दोनों की सामान्य और निश्चित परिणति बताती है। ‘लेट जाते हैं’ मृत्यु की मूल ठोस उपमा को बनाए रखता है; ‘विश्राम करते हैं’ अर्थ की अतिरिक्त व्याख्या करता।
- source_word: רִמָּה
  choice: कीड़े
  rationale: यह शब्द शारीरिक सड़न के संदर्भ में कीड़ों अथवा सड़न में पड़ने वाले लार्वों को सूचित कर सकता है। ‘कीड़े’ सहज, व्यापक और मूल की सामूहिक संज्ञा के अनुकूल है।
- source_word: תְּכַסֶּה
  choice: ढक लेते हैं
  rationale: हिब्रू में क्रिया सामूहिक एकवचन संज्ञा के अनुरूप है; हिन्दी में ‘कीड़े’ बहुवचन होने के कारण बहुवचन क्रिया स्वाभाविक है। यह सड़न की सजीव छवि को सुरक्षित रखती है।
- source_word: עֲלֵיהֶם
  choice: उन्हें
  rationale: हिब्रू पूर्वसर्ग का भाव हिन्दी की क्रिया ‘उन्हें ढक लेते हैं’ में स्वाभाविक रूप से समाहित हो जाता है।
