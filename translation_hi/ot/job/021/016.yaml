  yaml_path: translation/ot/job/021/016.yaml
  text: Look, is not their prosperity in their own hand? The counsel of the wicked is far from me.
translation:
  language: hi
  text: देखो, क्या उनकी समृद्धि उनके अपने हाथ में नहीं है? दुष्टों की सलाह मुझसे दूर है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֵן
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला उद्गार है; आधुनिक हिंदी में ‘देखो’ स्वाभाविक और स्पष्ट है।
- source_word: טוּבָם
  choice: उनकी समृद्धि
  rationale: संदर्भ में यह दुष्टों की भलाई, सुख-संपन्नता या खुशहाली को दर्शाता है; ‘समृद्धि’ इस अर्थ को संक्षेप में व्यक्त करती है।
- source_word: בְיָדָם
  choice: उन्हीं के हाथ में
  rationale: हिब्रू मुहावरे का रूपक बनाए रखते हुए नियंत्रण या अधिकार का भाव व्यक्त किया गया है; ‘उन्हीं’ प्रश्न के जोर को सामने लाता है।
- source_word: עֲצַת רְשָׁעִים
  choice: दुष्टों की सलाह
  rationale: עֵצָה का मूल अर्थ सलाह, योजना या नीति हो सकता है; ‘सलाह’ जानबूझकर व्यापक और सहज है।
- source_word: רָחֲקָה מֶנִּי
  choice: मुझसे दूर रहे
  rationale: हिब्रू पूर्ण क्रिया यहाँ वक्ता के दृढ़ अस्वीकार या दूरी की घोषणा व्यक्त कर सकती है; हिंदी में ‘दूर रहे’ उस नैतिक असंबद्धता को स्वाभाविक रूप से प्रकट करता है।
theological_decisions:
- issue: पहले वाक्य का प्रश्नात्मक स्वर और उसका आशय
  choice: क्या उनकी समृद्धि उन्हीं के हाथ में नहीं है?
  alternative: उनकी समृद्धि उनके अपने हाथ में नहीं है।
  rationale: לֹא वाले वाक्य को प्रश्न के रूप में रखना मूल की संभावित विडंबना और संदर्भगत तनाव को सुरक्षित रखता है; इसे सपाट कथन बनाकर व्याख्या निश्चित नहीं की गई।
- issue: दुष्टों की सलाह से अय्यूब की दूरी
  choice: दुष्टों की सलाह मुझसे दूर रहे।
  alternative: दुष्टों की सलाह मुझसे दूर है।
  rationale: मूल को केवल तथ्यात्मक दूरी या प्रबल अस्वीकार—दोनों रूपों में समझा जा सकता है। ‘दूर रहे’ अय्यूब के नैतिक अस्वीकार को व्यक्त करता है, बिना किसी संप्रदायगत व्याख्या को जोड़े।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण और मौखिक तर्क-वितर्क के अनुकूल शैली रखी गई है। कोई पादटिप्पणी आवश्यक नहीं मानी गई।
