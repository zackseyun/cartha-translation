  choice: निगरानी रखी जाती है
  alternative: वह टीले पर निगाह रखता है
  rationale: इब्रानी क्रिया पुल्लिंग एकवचन है, पर उसका कर्ता स्पष्ट रूप से व्यक्त नहीं किया गया। मुख्य पाठ में अवैयक्तिक कर्मवाच्य अस्पष्टता को यथासंभव बचाता है, जबकि दफ़न किए गए व्यक्ति को कर्ता मानने की संभावना पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘कब्रिस्तान’ सामान्य हिन्दी पाठक के लिए ‘कब्रों की जगह’ से अधिक स्वाभाविक है, जबकि मूल का बहुवचन पादटिप्पणी में बताया गया है। अंतिम खंड में कर्ता की अनिश्चितता को कर्मवाच्य द्वारा सुरक्षित रखा गया है।
