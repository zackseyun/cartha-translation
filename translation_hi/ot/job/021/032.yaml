- source_word: יוּבָל
  choice: ले जाया जाता है
  rationale: यबल का होफ़ाल रूप किसी के ले जाए या पहुँचाए जाने को दर्शाता है; अंत्येष्टि के संदर्भ में यह शव को दफ़न के लिए ले जाने का स्वाभाविक वर्णन है।
- source_word: גָּדִישׁ
  choice: कब्र का टीला
  rationale: यह शब्द ढेर या जमा हुई राशि को दर्शाता है; यहाँ प्रसंगानुसार कब्र के ऊपर उभरी हुई मिट्टी का टीला अभिप्रेत जान पड़ता है।
- source_word: יִשְׁקֹד
  choice: निगरानी रखी जाती है
  rationale: क्रिया जागते रहने, चौकसी करने या ध्यान रखने का भाव देती है। इब्रानी में कर्ता स्पष्ट नहीं है, इसलिए हिन्दी का कर्मवाच्य किसी निश्चित कर्ता को आरोपित किए बिना निगरानी का भाव बनाए रखता है।
theological_decisions:
