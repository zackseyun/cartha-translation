  text: Yet he is carried to the grave[c][b][a], and over the mound one keeps watch.
translation:
  language: hi
  text: फिर भी उसे कब्रों तक[a] ले जाया जाता है, और कब्र के टीले[b] पर पहरा दिया जाता है।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में ‘कब्रों’ बहुवचन है; इसका आशय सामूहिक रूप से दफ़न-स्थलों से भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘टीला’ उस इब्रानी शब्द का अनुवाद है जिसका अर्थ ढेर या ढेरी है; यहाँ संभवतः कब्र पर चढ़ी हुई मिट्टी का ढेर अभिप्रेत है।
    reason: cultural_note
  - marker: c
    text: या, ‘और वह टीले पर निगाह रखता है।’ इब्रानी में क्रिया का कर्ता स्पष्ट रूप से व्यक्त नहीं है; इसे दफ़न किए गए व्यक्ति के लिए भी समझा जा सकता है।
    reason: alternative_reading
