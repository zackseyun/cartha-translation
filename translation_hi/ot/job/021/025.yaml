  text: while another dies with a bitter soul and has not enjoyed good[a].
translation:
  language: hi
  text: परन्तु दूसरा मन की कड़वाहट लिए मरता है और उसने भलाई का स्वाद नहीं चखा[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘और इस व्यक्ति की मृत्यु कड़वे मन से होती है, और उसने भलाई को नहीं खाया’; हिब्रू में ‘खाने’ का बिंब जीवन की भलाई का अनुभव करने के लिए है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/זֶה
  choice: परन्तु दूसरा
  rationale: शाब्दिक अर्थ ‘और यह’ है, पर पद 24 के समृद्ध व्यक्ति के साथ स्पष्ट विरोध दिखाने के लिए वर्तमान हिन्दी में ‘परन्तु दूसरा’ स्वाभाविक है।
- source_word: יָמוּת
  choice: मरता है
  rationale: यहाँ अपूर्ण क्रिया सामान्य तुलनात्मक स्थिति बताती है, इसलिए हिन्दी का सामान्य वर्तमान काल उपयुक्त है।
- source_word: בְּ/נֶפֶשׁ מָרָה
  choice: मन की कड़वाहट में
  rationale: נֶפֶשׁ व्यक्ति के भीतरी जीवन या मन को दर्शाता है। यह चयन ‘कड़वी आत्मा’ जैसे अस्वाभाविक शब्दशः अनुवाद से बचते हुए आन्तरिक कटु वेदना को बनाए रखता है।
- source_word: וְ/לֹא אָכַל
  choice: और उसने ... स्वाद नहीं चखा होता
  rationale: אָכַל का शाब्दिक अर्थ ‘खाना’ है; स्वाद चखना जीवन की भलाई में सहभागी होने के मूल रूपक को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: בַּ/טּוֹבָה
  choice: भलाई का
  rationale: यह पद समृद्धि, सुख और जीवन में मिलने वाली अच्छी दशा को व्यापक रूप से व्यक्त कर सकता है। ‘भलाई’ इस खुले अर्थ को ‘समृद्धि’ की अपेक्षा बेहतर बनाए रखता है।
