  text: Listen carefully to my words[a], and let this be your consolation.
translation:
  language: hi
  text: मेरी बात ध्यान से सुनो, और यही वह सांत्वना हो जो तुम मुझे दो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁמְעוּ שָׁמוֹעַ
  choice: ध्यान से सुनो
  rationale: बहुवचन आज्ञार्थक क्रिया के साथ उसी धातु का infinitive absolute सुनने के आग्रह को प्रबल करता है। आधुनिक हिन्दी में “ध्यान से सुनो” इस बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִלָּתִי
  choice: मेरी बात
  rationale: एकवचन संज्ञा पर प्रथम पुरुष एकवचन प्रत्यय है। प्रसंग में “मेरी बात” स्वाभाविक हिन्दी है और अय्यूब के पूरे कथन की ओर संकेत कर सकती है।
- source_word: וּתְהִי
  choice: और ... हो
  rationale: היה का जुस्सिव रूप इच्छा अथवा अनुरोध व्यक्त करता है; हिन्दी में “हो” उसका संक्षिप्त और स्वाभाविक समतुल्य है।
- source_word: זֹאת
  choice: यही
  rationale: संकेतवाचक शब्द सम्भवतः सुनने के इसी कार्य की ओर संकेत करता है। “यही” हिब्रू के बल और संक्षिप्तता को बनाए रखता है।
- source_word: תַּנְחֻמוֹתֵיכֶם
  choice: तुम्हारी ओर से दी गई सांत्वना
  rationale: शब्द रूपतः बहुवचन है और उस सांत्वना को दर्शाता है जो संबोधित लोग अय्यूब को देते हैं। हिन्दी में स्पष्ट सम्बन्ध के लिए “तुम्हारी ओर से दी गई सांत्वना” स्वाभाविक है और सम्भावित व्यंग्यात्मक धार को भी रहने देता है।
theological_decisions:
- issue: “यही” किसकी ओर संकेत करता है
  choice: इसे सुनने के कार्य से जोड़ने योग्य खुला रखा गया है
  alternative: इसे अय्यूब की आगामी बात से स्पष्ट रूप से जोड़ना
  rationale: हिब्रू זֹאת का संकेत-सन्दर्भ संक्षिप्त और कुछ हद तक अस्पष्ट है; अनुवाद को इसे अनावश्यक रूप से निश्चित नहीं करना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी; सीधी, गरिमापूर्ण और मौखिक अपील के अनुकूल भाषा। “तुम्हारी ओर से दी गई” अर्थ-संबन्ध को सहज बनाता है, जबकि मूल की सम्भावित विडम्बना को स्पष्ट व्याख्या में नहीं बदलता।
