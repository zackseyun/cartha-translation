    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְשֵׁל
  choice: प्रभुत्व
  rationale: यह संज्ञा शासन या अधिकार का भाव व्यक्त करती है। ‘प्रभुत्व’ मूल के अमूर्त और काव्यात्मक स्वर को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וָפַחַד
  choice: और भय
  rationale: פחד भय, दहशत या आतंक सूचित कर सकता है। यहाँ ‘भय’ परमेश्वर की महिमा से उत्पन्न विस्मयकारी डर को बिना अनावश्यक तीव्रता के व्यक्त करता है।
- source_word: עִמּוֹ
  choice: उसके साथ हैं
  rationale: यह मूल पूर्वसर्गीय वाक्यांश का निकट और स्वाभाविक अनुवाद है। इब्रानी में क्रिया निहित है; हिन्दी में ‘हैं’ जोड़ा गया है। इससे अधिकार और भय को सीधे ‘उसके हैं’ कहकर अर्थ को अधिकार-संबंध तक सीमित नहीं किया जाता।
- source_word: עֹשֶׂה
  choice: वह ... स्थापित करता है
  rationale: עשה का मूल अर्थ ‘करना/बनाना’ है; शान्ति के साथ हिन्दी में ‘शान्ति स्थापित करना’ अधिक स्वाभाविक है और उसकी निरन्तर या चारित्रिक क्रिया को व्यक्त करता है।
- source_word: שָׁלוֹם
  choice: शान्ति
  rationale: यहाँ व्यापक अर्थ-क्षेत्र में कुशलता, संपूर्णता और व्यवस्था भी सम्भव हैं, पर ब्रह्माण्डीय संदर्भ में ‘शान्ति’ स्पष्ट, स्वाभाविक और पर्याप्त रूप से व्यापक है।
- source_word: בִּמְרוֹמָיו
  choice: अपने ऊँचे स्थानों में
  rationale: बहुवचन रूप का शाब्दिक भाव ‘उसके ऊँचे स्थानों में’ है। हिन्दी में समान कर्ता के कारण ‘अपने’ स्वाभाविक है; यह स्वर्गीय ऊर्ध्वलोक का संकेत देता है, पर उसे व्याख्यात्मक रूप से केवल ‘स्वर्ग’ नहीं बनाता।
theological_decisions:
- issue: आरम्भिक उपवाक्य का स्वरूप
  choice: प्रभुत्व और भय परमेश्वर के साथ विद्यमान हैं
  alternative: प्रभुत्व और भय उसी के हैं
  rationale: इब्रानी का क्रियारहित उपवाक्य साथ होने और अधिकार-संबंध, दोनों अर्थों की अनुमति देता है। मुख्य पाठ ‘उसके साथ हैं’ रखकर मूल चित्र और वास्तविक अस्पष्टता को सुरक्षित रखता है; वैकल्पिक अधिकार-संबंध पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, काव्यात्मक किंतु सहज रूप अपनाया गया है। ‘प्रभुत्व’, ‘भय’, ‘ऊँचे स्थान’ और ‘शान्ति’ मूल पदों की संक्षिप्त समानांतर संरचना तथा ब्रह्माण्डीय बिंब को बनाए रखते हैं।
