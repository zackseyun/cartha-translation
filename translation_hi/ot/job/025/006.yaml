  text: אַ֭ף כִּֽי אֱנ֣וֹשׁ רִמָּ֑ה וּ/בֶן אָ֝דָ֗ם תּוֹלֵעָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/025/006.yaml
  text: how much less man[a], who is a maggot, and the son of man[b], who is a worm!
translation:
  language: hi
  text: तो फिर नश्वर मनुष्य[a] की तो बात ही क्या, जो सड़न का कीड़ा है, और मनुष्य के पुत्र[b] की, जो कृमि है!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘नश्वर मनुष्य’ के लिए केवल ‘मनुष्य’ भी अनुवाद किया जा सकता है; इब्रानी אֱנוֹשׁ प्रायः मनुष्य की दुर्बलता और नश्वरता पर बल देता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से ‘मनुष्य का पुत्र’; यहाँ यह किसी मानव के लिए प्रयुक्त काव्यात्मक अभिव्यक्ति है, मसीहाई उपाधि नहीं।
    reason: cultural_note
lexical_decisions:
- source_word: אַף כִּי
  choice: तो फिर … की तो बात ही क्या
  rationale: यह हिन्दी मुहावरा पिछले पद से चल रहे न्यूनाधिक तर्क को स्वाभाविक रूप से व्यक्त करता है और इब्रानी की संक्षिप्त, संदर्भ-निर्भर तुलना को बनाए रखता है।
- source_word: אֱנוֹשׁ
  choice: नश्वर मनुष्य
  rationale: אֱנוֹשׁ यहाँ मानव की दुर्बल और मरणशील दशा पर बल देता है; ‘नश्वर मनुष्य’ इस भाव को स्पष्ट रखते हुए प्रतिनिधिक एकवचन को भी बचाता है।
- source_word: רִמָּה
  choice: सड़न का कीड़ा
  rationale: यह शब्द प्रायः सड़ते पदार्थ या शव में पाए जाने वाले कीड़े के लिए आता है। ‘सड़न का कीड़ा’ अगले תּוֹלֵעָה से भेद रखता है और आधुनिक हिन्दी में ‘लार्वा’ जैसे तकनीकी शब्द से बचता है।
- source_word: בֶן אָדָם
  choice: मनुष्य का पुत्र
  rationale: शाब्दिक काव्यात्मक अभिव्यक्ति को बनाए रखा गया है; यहाँ इसका आशय एक मानव से है और यह אֱנוֹשׁ के समानांतर है। हिन्दी वाक्य-विन्यास के कारण संबंधकारक रूप ‘मनुष्य के पुत्र की’ आया है।
- source_word: תּוֹלֵעָה
  choice: कृमि
  rationale: ‘कृमि’ व्यापक अर्थ वाले worm को व्यक्त करता है और पहले प्रयुक्त ‘सड़न का कीड़ा’ से काव्यात्मक भेद बनाए रखता है।
theological_decisions:
- issue: क्या ‘मनुष्य का पुत्र’ मसीहाई उपाधि है?
  choice: एक मानव के लिए गैर-उपाधिगत काव्यात्मक मुहावरा
  alternative: मसीहाई उपाधि
  rationale: इस पद में בֶן אָדָם, אֱנוֹשׁ के समानांतर है और मानव की क्षुद्रता तथा नश्वरता को व्यक्त करता है; संदर्भ किसी विशिष्ट मसीहाई व्यक्ति की ओर संकेत नहीं करता।
translation_notes:
  register: भाषा आधुनिक, काव्यात्मक और गरिमापूर्ण रखी गई है। ‘की तो बात ही क्या’ पूर्वपद पर निर्भर इब्रानी तुलना को सहज हिन्दी में व्यक्त करता है। ‘सड़न का कीड़ा’ और ‘कृमि’ दो अलग इब्रानी शब्दों का भेद बनाए रखते हैं।
