id: JOB.25.4
reference: Job 25:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/מַה יִּצְדַּ֣ק אֱנ֣וֹשׁ עִם אֵ֑ל וּ/מַה יִּ֝זְכֶּ֗ה יְל֣וּד אִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/025/004.yaml
  text: So how can man be righteous before God? And how can one born of woman be pure?[a][b]
translation:
  language: hi
  text: तो मनुष्य परमेश्वर के सामने धर्मी कैसे ठहर सकता है?[a] और स्त्री से जन्मा मनुष्य शुद्ध कैसे हो सकता है?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘परमेश्वर के साथ’ है; यहाँ इसका आशय परमेश्वर के सम्मुख या उसके संबंध में मनुष्य की स्थिति से हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘स्वच्छ’ अथवा ‘निर्दोष’।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַה
  choice: तो...कैसे / और...कैसे
  rationale: מַה यहाँ अलंकारिक प्रश्न प्रस्तुत करता है; हिंदी में ‘कैसे’ इसका स्वाभाविक भाव देता है। आरंभिक וּ को संदर्भगत निष्कर्ष के लिए ‘तो’ और समानांतर दूसरे खंड में ‘और’ से व्यक्त किया गया है।
- source_word: יִצְדַּק
  choice: धर्मी ठहर सकता है
  rationale: צדק के काल रूप का आशय परमेश्वर के संबंध में धर्मी अथवा सही सिद्ध होने से है। ‘धर्मी ठहरना’ नैतिक और न्यायिक दोनों संभावित छायाओं को बनाए रखता है, बिना किसी विकसित धार्मिक सिद्धांत को आरोपित किए।
- source_word: אֱנוֹשׁ
  choice: मनुष्य
  rationale: אֱנוֹשׁ नश्वर और दुर्बल मानव को सूचित करता है। ‘मनुष्य’ आधुनिक हिंदी में स्वाभाविक सामान्य मानव-संज्ञा है; नश्वरता की छाया संदर्भ में निहित रहती है।
- source_word: עִם אֵל
  choice: परमेश्वर के सामने
  rationale: עִם का शाब्दिक अर्थ ‘के साथ’ है, पर यहाँ यह परमेश्वर के सम्मुख अथवा उसके संबंध में मनुष्य की स्थिति बताता है। ‘के सामने’ हिंदी में इस भाव को सहजता से व्यक्त करता है।
- source_word: יִזְכֶּה
  choice: शुद्ध हो सकता है
  rationale: זכה का अर्थ शुद्ध, स्वच्छ अथवा निर्दोष होना हो सकता है। ‘शुद्ध’ समानांतर ‘धर्मी’ के साथ स्वाभाविक है और अर्थ को केवल न्यायिक निर्दोषता तक सीमित नहीं करता।
- source_word: יְלוּד אִשָּׁה
  choice: स्त्री से जन्मा मनुष्य
  rationale: यह मुहावरा मानव की सृजित और नश्वर दशा को व्यक्त करता है। हिंदी में ‘स्त्री से जन्मा मनुष्य’ स्पष्ट, सामान्य और स्वाभाविक है तथा मूल की सार्वभौमिक मानवीय व्याप्ति बनाए रखता है।
theological_decisions:
- issue: मानवता के लिए सामान्य एकवचन भाषा
  choice: मनुष्य ... स्त्री से जन्मा मनुष्य
  alternative: नश्वर मनुष्य ... स्त्री से जन्मा व्यक्ति
  rationale: मूल पाठ के सामान्य एकवचन और मानवीय प्रतिनिधित्व को रखा गया है। ‘मनुष्य’ यहाँ केवल पुरुष जाति नहीं, समस्त मानवता को सूचित करता है।
- issue: परमेश्वर के संबंध में मनुष्य की धार्मिक स्थिति
  choice: परमेश्वर के सामने धर्मी ठहर सकता है
  alternative: परमेश्वर के साथ धर्मी हो सकता है
  rationale: शाब्दिक पूर्वसर्ग ‘के साथ’ है, किंतु प्रसंग में परमेश्वर के सम्मुख मनुष्य की स्थिति अभिप्रेत है। ‘धर्मी ठहरना’ न्यायिक संभावना को खुला रखता है, पर उसे किसी विशिष्ट सिद्धांत तक सीमित नहीं करता।
- issue: शुद्धता और निर्दोषता का अर्थक्षेत्र
  choice: शुद्ध हो सकता है
  alternative: निर्दोष ठहर सकता है
  rationale: मूल क्रिया में स्वच्छता, शुद्धता और निर्दोषता की अर्थ-छायाएँ हैं। मुख्य पाठ में ‘शुद्ध’ व्यापक अर्थ रखता है; अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। दोनों समानांतर अलंकारिक प्रश्नों की संरचना और मूल की धर्मी/शुद्ध अर्थ-संगति सुरक्षित है।
