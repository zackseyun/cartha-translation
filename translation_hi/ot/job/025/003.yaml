  yaml_path: translation/ot/job/025/003.yaml
  text: Is there any number to his troops? And upon whom does his light not rise?[a][b][c]
translation:
  language: hi
  text: क्या उसकी सेनाओं की कोई संख्या है?[a] और किस पर उसका प्रकाश उदय नहीं होता?[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उसके दलों’ अथवा ‘उसकी टुकड़ियों’।
    reason: lexical_alternative
  - marker: b
    text: या, ‘और किसके ऊपर उसका प्रकाश उदय नहीं होता?’
    reason: lexical_alternative
  - marker: c
    text: ‘उसका प्रकाश’ परमेश्वर की सर्वव्यापी ज्योति, तेज या पहुँच की ओर संकेत कर सकता है; इब्रानी इसका अर्थ इससे अधिक निश्चित नहीं करता।
    reason: alternative_reading
lexical_decisions:
- source_word: הֲיֵשׁ מִסְפָּר
  choice: क्या ... कोई गिनती है?
  rationale: इब्रानी अस्तित्ववाचक प्रश्न और מִסְפָּר के ‘गिनती/संख्या’ अर्थ को स्वाभाविक आधुनिक हिन्दी में प्रश्न के रूप में रखा गया है।
- source_word: לִגְדוּדָיו
  choice: उसके दलों की
  rationale: גְּדוּד सैन्य दल, टुकड़ी या समूह को दर्शाता है। ‘दलों’ मूल की व्यापकता और बहुवचन को बनाए रखता है; לְ को हिन्दी के स्वाभाविक संबंधसूचक ‘की’ से व्यक्त किया गया है।
- source_word: וְעַל־מִי
  choice: और किस पर
  rationale: עַל के स्थानिक बिंब को सीधे ‘पर’ से सुरक्षित रखा गया है।
- source_word: לֹא יָקוּם
  choice: उदय नहीं होता
  rationale: קוּם का मूल अर्थ उठना/उदय होना है; प्रकाश के साथ ‘उदय होना’ हिन्दी में स्वाभाविक है और मूल बिंब बनाए रखता है।
- source_word: אוֹרֵהוּ
  choice: उसका प्रकाश
  rationale: אוֹר का सीधा अर्थ ‘प्रकाश’ है और तृतीय पुरुष पुल्लिंग एकवचन प्रत्यय को ‘उसका’ से रखा गया है, बिना उसका आशय संकुचित किए।
theological_decisions:
- issue: ‘उसके दलों’ और ‘उसका प्रकाश’ में सर्वनाम का संदर्भ
  choice: सर्वनाम को यथावत रखा गया है; संदर्भ में वह परमेश्वर की ओर संकेत करता है।
  alternative: मुख्य पाठ में ‘परमेश्वर के दल’ और ‘परमेश्वर का प्रकाश’ स्पष्ट कर देना।
  rationale: पद 2 के संदर्भ में संकेत परमेश्वर की ओर है, पर इब्रानी में संज्ञा के स्थान पर प्रत्यय है; इसलिए अनावश्यक स्पष्टता जोड़ने के बजाय सर्वनाम सुरक्षित रखा गया है।
- issue: ‘उसका प्रकाश’ का आशय
  choice: व्यापक और अनिर्दिष्ट ‘प्रकाश’।
  alternative: विशेष रूप से सूर्य का प्रकाश, ईश्वरीय तेज, कृपा या सर्वव्यापी पहुँच।
  rationale: इब्रानी किसी एक अर्थ को निश्चित नहीं करता। मुख्य पाठ भौतिक और रूपक—दोनों संभावनाएँ खुली रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। पहला प्रश्न संक्षिप्त है और दूसरे में ‘उदय होना’ प्रकाश के बिंब को स्वाभाविक हिन्दी में बनाए रखता है।
