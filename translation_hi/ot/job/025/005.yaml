  alternative: काव्यात्मक तर्क में कोई अनिर्दिष्ट देखने वाला
  rationale: पद 2–6 के प्रसंग में बिल्दद परमेश्वर की महानता और उसके सामने सृष्टि तथा मनुष्य की अशुद्धता की बात करता है; इसलिए प्रत्यय का सबसे स्वाभाविक संदर्भ परमेश्वर है। अनुवाद नाम जोड़कर मूल से अधिक स्पष्ट नहीं करता।
