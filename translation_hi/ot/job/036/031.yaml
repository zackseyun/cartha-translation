  yaml_path: translation/ot/job/036/031.yaml
  text: For by them he judges peoples; he gives food in abundance.
translation:
  language: hi
  text: क्योंकि इनके द्वारा वह लोगों का न्याय करता है; वह बहुतायत से भोजन देता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָם
  choice: इन्हीं के द्वारा
  rationale: बहुवचन सर्वनाम पूर्ववर्ती वर्षा/बादल-संबंधी साधनों की ओर संकेत करता है; 'के द्वारा' साधनात्मक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יָדִין עַמִּים
  choice: वह लोगों का न्याय करता है
  rationale: דין का न्यायिक अर्थ बनाए रखा गया है और עמים के बहुवचन को सामान्य रूप से 'लोगों' कहा गया है।
- source_word: יִתֶּן אֹכֶל לְמַכְבִּיר
  choice: वह बहुतायत से भोजन देता है
  rationale: למכביר की प्रचुरता और אכל के भोजन/आहार अर्थ को संक्षिप्त, स्वाभाविक हिन्दी में रखा गया है।
theological_decisions:
- issue: एक ही प्राकृतिक साधनों से न्याय और पोषण
  choice: 'दोनों कथनों को साथ रखा गया: वह इनके द्वारा न्याय करता और बहुतायत से भोजन देता है'
  alternative: न्याय को केवल दंड या शासन के रूप में स्पष्ट करना
  rationale: मूल पाठ जानबूझकर एक ही साधन के न्यायकारी और जीवन-पोषक दोनों कार्यों को साथ रखता है; अनावश्यक व्याख्या से इस तनाव को सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और मूल की समानांतर काव्यात्मक संरचना के निकट। 'इन्हीं' संदर्भसूचक बल देता है, जबकि स्पष्ट संज्ञा जोड़कर अस्पष्टता को समाप्त नहीं किया गया।
