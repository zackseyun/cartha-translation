base_translation:
  language: en
  yaml_path: translation/ot/job/036/007.yaml
  text: He does not withdraw his eyes from the righteous[a], but with kings on the throne he seats them forever[b], and they are exalted.
translation:
  language: hi
  text: वह धर्मी से अपनी आँखें नहीं हटाता, बल्कि उसे राजाओं के साथ सिंहासन पर सदा के लिए बैठाता है[a], और वे ऊँचे उठाए जाते हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “और राजाओं को वह सिंहासन पर सदा के लिए बैठाता है।” इब्रानी वाक्य बहुत संक्षिप्त है; कुछ लोग यहाँ ‘राजाओं’ को सीधे अगली क्रिया का कर्म समझते हैं, न कि धर्मी को राजाओं के साथ बैठाया जाना।'
    reason: alternative_reading
  - marker: b
    text: 'या: “और वह उन्हें ऊँचा करता है।” अंतिम क्रिया को परमेश्वर के निहित कर्ता के साथ कर्तृवाच्य अर्थ में भी समझा जा सकता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִגְרַע
  choice: हटाता
  rationale: גרע का मूल अर्थ घटाना या दूर करना है। ‘आँखें ... पर से हटाना’ हिन्दी में स्वाभाविक मुहावरा है और परमेश्वर की निरंतर निगाह का मूल चित्र बनाए रखता है।
- source_word: מִצַּדִּיק
  choice: धर्मी पर से
  rationale: एकवचन विशेषण यहाँ जातिवाचक/सामूहिक अर्थ रखता है। ‘धर्मी’ आधुनिक हिन्दी बाइबलीय शैली में संक्षिप्त और सहज है।
- source_word: עֵינָיו
  choice: अपनी आँखें
  rationale: मूल का मानवीकरणयुक्त ठोस चित्र सुरक्षित रखा गया है; इसे ‘ध्यान’ या ‘देखभाल’ जैसे अमूर्त शब्द में नहीं बदला गया।
- source_word: וְאֶת מְלָכִים לַכִּסֵּא
  choice: बल्कि उसे राजाओं के साथ सिंहासन पर
  rationale: इब्रानी पदबंध अत्यंत संक्षिप्त है। यह चयन धर्मी को बहुवचन राजाओं के साथ राजकीय सम्मान में बैठाए जाने की प्रासंगिक व्याख्या देता है, पर वैकल्पिक वाक्य-विन्यास को पादटिप्पणी में सुरक्षित रखता है।
- source_word: וַיֹּשִׁיבֵם
  choice: बैठाता है
  rationale: ישׁב के हिफ़ईल रूप का अर्थ ‘बैठाना’ है। यह ‘सिंहासनारूढ़ करता है’ की अपेक्षा मूल क्रिया के अधिक निकट है।
- source_word: לָנֶצַח
  choice: सदा के लिए
  rationale: यह दीर्घस्थायी अवधि का स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: וַיִּגְבָּהוּ
  choice: वे ऊँचे किए जाते हैं
  rationale: संक्षिप्त क्रियारूप संदर्भ में रूपगत/वाक्यगत अस्पष्टता रखता है। परिणामसूचक कर्मवाच्य धर्मियों के ऊँचा उठाए जाने का भाव देता है, बिना कर्ता को व्याकरण में अनावश्यक रूप से स्पष्ट किए।
theological_decisions:
- issue: परमेश्वर की निगाह के लिए मानवीकरणयुक्त भाषा
  choice: ‘अपनी आँखें’ के ठोस चित्र को बनाए रखा गया।
  alternative: ‘अपना ध्यान’ या ‘अपनी देखभाल’
  rationale: मूल पाठ परमेश्वर की निरंतर चौकसी को आँखों के चित्र से व्यक्त करता है; अमूर्त अनुवाद काव्यात्मक तनाव को कम कर देता।
- issue: राजकीय उपवाक्य में सर्वनाम का संदर्भ
  choice: एकवचन जातिवाचक ‘धर्मी’ को अगले बहुवचन ‘वे’ का भावगत संदर्भ माना गया है।
  alternative: ‘वे’ केवल राजाओं को सूचित करे, या परमेश्वर धर्मियों को राजा बनाकर बैठाए।
  rationale: आसपास का प्रसंग धर्मियों के प्रति परमेश्वर के व्यवहार पर केंद्रित है। फिर भी इब्रानी वाक्य संक्षिप्त है, इसलिए राजाओं को सीधा कर्म मानने की संभावना पादटिप्पणी में दी गई है।
- issue: अंतिम क्रिया का कर्ता और वाच्य
  choice: ‘वे ऊँचे किए जाते हैं’
  alternative: ‘वह उन्हें ऊँचा करता है’
  rationale: इस रूप से परिणाम व्यक्त होता है और इब्रानी की संक्षिप्तता तथा संभावित व्याकरणिक अस्पष्टता सुरक्षित रहती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘धर्मी’, ‘सिंहासन’ और ‘सदा के लिए’ परिचित बाइबलीय शब्दावली हैं; मूल की काव्यात्मक मानवीकरणयुक्त छवि और राजकीय उपवाक्य की वास्तविक अस्पष्टता सुरक्षित रखी गई है।
