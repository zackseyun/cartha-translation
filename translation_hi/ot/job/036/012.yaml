source:
  edition: WLC
  text: וְ/אִם לֹ֣א יִ֭שְׁמְעוּ בְּ/שֶׁ֣לַח יַעֲבֹ֑רוּ וְ֝/יִגְוְע֗וּ כִּ/בְלִי דָֽעַת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/012.yaml
  text: But if they do not listen[a], they will pass away by the sword, and they will die without knowledge.
translation:
  language: hi
  text: परन्तु यदि वे न सुनें, तो वे तलवार से नाश हो जाएँगे और ज्ञान के बिना[a] मर जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ज्ञान की कमी के कारण।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: परन्तु यदि
  rationale: पिछले पद के विपरीत परिणाम को प्रस्तुत करने वाली शर्त को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לֹא יִשְׁמְעוּ
  choice: वे न सुनें
  rationale: ‘सुनना’ इब्रानी क्रिया के सुनने और ध्यान देकर मानने—दोनों संभावित भावों को बनाए रखता है; ‘आज्ञा न मानें’ अर्थ को अनावश्यक रूप से संकीर्ण कर देता।
- source_word: בְּשֶׁלַח
  choice: तलवार से
  rationale: यहाँ शब्द विनाश के हथियार का द्योतक है; न्याय के प्रसंग में ‘तलवार’ स्पष्ट और स्वाभाविक है।
- source_word: יַעֲבֹרוּ
  choice: नाश हो जाएँगे
  rationale: क्रिया का मूल भाव ‘पार हो जाना’ है, किन्तु यहाँ मृत्यु के समानांतर न्याय के फलस्वरूप मिट जाने या नाश होने का मुहावरेदार अर्थ है।
- source_word: וְיִגְוְעוּ
  choice: और ... मर जाएँगे
  rationale: גוע मृत्यु या प्राण निकलने को व्यक्त करता है; ‘मर जाएँगे’ आधुनिक हिन्दी में सीधा और स्वाभाविक है।
- source_word: כִּבְלִי דָעַת
  choice: ज्ञान के बिना
  rationale: इब्रानी पदबंध की अवस्था-सूचक अस्पष्टता को बनाए रखता है; कारण-सूचक अर्थ ‘ज्ञान की कमी के कारण’ भी सम्भव है और पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: שׁמע को केवल सुनने या आज्ञाकारी प्रत्युत्तर के रूप में व्यक्त करना
  choice: वे न सुनें
  alternative: वे आज्ञा न मानें
  rationale: ‘सुनें’ इब्रानी शब्द के सुनने और ध्यान देकर मानने, दोनों अर्थों को खुला रखता है तथा किसी संकुचित व्याख्या को पाठ पर नहीं थोपता।
- issue: כִּבְלִי דָעַת कारण बताता है या मृत्यु की अवस्था
  choice: ज्ञान के बिना
  alternative: ज्ञान की कमी के कारण
  rationale: मुख्य पाठ इब्रानी रचना के अधिक सीधे अवस्था-सूचक अर्थ को रखता है, जबकि सम्भव कारण-सूचक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्पष्ट, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रूप। ‘परन्तु’, ‘नाश हो जाएँगे’ और ‘ज्ञान के बिना’ प्रसंग की गंभीरता तथा इब्रानी समानांतरता को बनाए रखते हैं।
