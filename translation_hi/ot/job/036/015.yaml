  text: He rescues the afflicted by their affliction[b][a], and opens their ears by oppression.
translation:
  language: hi
  text: वह पीड़ितों को उनकी पीड़ा के द्वारा छुड़ाता है[a], और विपत्ति के द्वारा उनके कान खोलता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पीड़ितों को उनकी पीड़ा में छुड़ाता है।” यहाँ इब्रानी शब्द निर्धनता, पीड़ा या उत्पीड़न का भाव दे सकते हैं।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उनके कान उघाड़ता है”; यह सुनने या शिक्षा ग्रहण करने योग्य बनाने का इब्रानी मुहावरा है।
    reason: cultural_note
lexical_decisions:
- source_word: יְחַלֵּץ
  choice: छुड़ाता है
  rationale: पिएल रूप यहाँ संकट से बाहर निकालने या बचाने का सक्रिय अर्थ देता है; ‘छुड़ाता है’ स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: עָנִי
  choice: पीड़ित
  rationale: शब्द निर्धनता के साथ दुःख और उत्पीड़न का भाव भी रखता है; समानांतर पदों के कारण यहाँ ‘पीड़ित’ अधिक उपयुक्त है।
- source_word: בְעָנְיוֹ
  choice: उसके दुःख के द्वारा
  rationale: בְּ को करणवाचक मानकर दुःख को छुटकारे के माध्यम के रूप में रखा गया है, जबकि एकवचन प्रत्यय भी सुरक्षित है।
- source_word: וְיִגֶל
  choice: खोलता है
  rationale: कान के साथ गלה का शाब्दिक अर्थ ‘उघाड़ना’ है, पर यह सुनने या शिक्षा ग्रहण करने योग्य बनाने का मुहावरा है; हिन्दी में ‘कान खोलता है’ स्वाभाविक है।
- source_word: בַּלַּחַץ
  choice: अत्याचार के द्वारा
  rationale: לַחַץ दबाव, क्लेश या उत्पीड़न को सूचित करता है; यहाँ समानांतर करणवाचक प्रयोग और मूल की कठोरता बनाए रखने के लिए यह चयन किया गया है।
- source_word: אָזְנָם
  choice: उनके कान
  rationale: मसोरेटिक पाठ में तृतीय पुरुष बहुवचन प्रत्यय है; इसलिए एकवचन ‘पीड़ित’ के बाद भी मूल का बहुवचन सुरक्षित रखा गया है।
theological_decisions:
- issue: दुःख को ईश्वरीय छुटकारे और शिक्षा के साधन के रूप में प्रस्तुत करना
  choice: दोनों בְּ-युक्त पदों को करणवाचक ‘के द्वारा’ से अनूदित किया गया है।
  alternative: ‘दुःख में’ और ‘अत्याचार में’, जहाँ दुःख केवल परिस्थिति हो।
  rationale: समानांतर रचना साधन का अर्थ समर्थित करती है। फिर भी अनुवाद यह अतिरिक्त निष्कर्ष नहीं जोड़ता कि हर दुःख अपने-आप में अच्छा है या हर पीड़ा प्रत्यक्ष दंड है; एलीहू के कथन का तनाव यथावत रहता है।
translation_notes:
  register: 'आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मूल की काव्यात्मक समानांतरता के निकट। सर्वनाम-संख्या की असमानता जानबूझकर रखी गई है: עָנִי एकवचन है, जबकि אָזְנָם में बहुवचन प्रत्यय है।'
