base_translation:
  language: en
  yaml_path: translation/ot/job/036/011.yaml
  text: If they listen and serve[b][a], they will complete their days in prosperity and their years in pleasantness.
translation:
  language: hi
  text: यदि वे सुनें[a] और सेवा करें, तो वे अपने दिन सुख-समृद्धि में और अपने वर्ष आनंद में बिताएँगे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सुनकर आज्ञा मानें”; यहाँ “सुनना” बताने वाली इब्रानी क्रिया संदर्भ में आज्ञाकारी होकर सुनने का भाव भी रख सकती है।
    reason: lexical_alternative
  - marker: b
    text: या “वे अपने दिन भलाई में और अपने वर्ष सुखद बातों में बिताएँगे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: यदि
  rationale: यह शर्तसूचक उपवाक्य आरम्भ करता है; ‘यदि’ इलीहू के कथन की सशर्त प्रकृति को स्पष्ट रखता है।
- source_word: יִשְׁמְעוּ
  choice: वे सुनें
  rationale: שׁמע का अर्थ सुनना, ध्यान से सुनना, या आज्ञा मानना हो सकता है। ‘सुनें’ मूल अर्थ को बनाए रखता है, जबकि संदर्भ में निहित आज्ञाकारी प्रत्युत्तर को पादटिप्पणी स्पष्ट करती है।
- source_word: וְיַעֲבֹדוּ
  choice: और सेवा करें
  rationale: עבד का सामान्य अर्थ ‘सेवा करना’ है। यह परमेश्वर के प्रति आज्ञाकारी सेवा को व्यक्त करता है, पर इसे केवल उपासना या श्रम तक सीमित नहीं करता।
- source_word: יְכַלּוּ
  choice: पूरे करेंगे
  rationale: כלה के पिएल रूप का अर्थ पूरा करना या अंत तक पहुँचाना है। दिनों और वर्षों के साथ यह अपना जीवनकाल बिताने या पूरा करने का भाव देता है।
- source_word: יְמֵיהֶם
  choice: अपने दिन
  rationale: सर्वनाम-संबंध को स्वाभाविक हिन्दी में व्यक्त करते हुए काव्यात्मक ‘दिन’ बनाए रखा गया है।
- source_word: בַּטּוֹב
  choice: भलाई में
  rationale: यहाँ טוֹב अनुकूल और अच्छी दशा को दर्शाता है। ‘भलाई में’ अर्थ की व्यापकता बनाए रखता है और इसे केवल आर्थिक समृद्धि तक सीमित नहीं करता।
- source_word: וּשְׁנֵיהֶם
  choice: और अपने वर्ष
  rationale: ‘अपने दिन’ के समानांतर काव्यात्मक संरचना बनाए रखी गई है।
- source_word: בַּנְּעִימִים
  choice: सुखों में
  rationale: נְעִימִים का बहुवचन सुखद या मनोहर अनुभवों अथवा वस्तुओं का संकेत दे सकता है। ‘सुखों में’ बहुवचन और काव्यात्मक समानांतरता दोनों को स्वाभाविक हिन्दी में रखता है।
theological_decisions:
- issue: क्या यह पद भौतिक समृद्धि को एक निरपेक्ष धार्मिक सिद्धान्त के रूप में प्रतिज्ञात करता है
  choice: इलीहू के भाषण में आए सशर्त कथन को उसके प्रत्यक्ष, अनुकूल जीवन-परिस्थितियों वाले अर्थ में रखा गया है।
  alternative: इसे यह सार्वभौमिक सिद्धान्त मानना कि आज्ञाकारिता से सदा सांसारिक समृद्धि मिलती है, या इसे केवल आंतरिक आत्मिक आशीष बनाकर पढ़ना।
  rationale: इब्रानी पाठ इलीहू का ज्ञान-साहित्यीय, सशर्त दावा प्रस्तुत करता है। अनुवाद न तो इसे सार्वभौमिक गारंटी बनाता है, न इसकी सांसारिक जीवन से जुड़ी स्पष्ट धारणा को आत्मिक रूप देकर मिटाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक समानांतरता वाला रूप। ‘भलाई’ और ‘सुखों’ से मूल की व्यापकता तथा बहुवचन संरचना सुरक्षित रहती है; भाषा कथन को अनावश्यक रूप से केवल आर्थिक समृद्धि तक सीमित नहीं करती।
