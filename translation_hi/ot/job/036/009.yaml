base_translation:
  language: en
  yaml_path: translation/ot/job/036/009.yaml
  text: then he declares to them their deeds and their transgressions[a], that they have acted arrogantly.
translation:
  language: hi
  text: तब वह उन्हें उनके कर्म और उनके अपराध बताता है कि उन्होंने घमंड में अपने को ऊँचा किया है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से: “कि वे बलवान हो गए हैं।” प्रसंग में इसका भाव सम्भवतः अपने को ऊँचा करना या घमंड करना है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: तब वह ... बताता है
  rationale: हिफ़ील रूप का अर्थ ‘बताना, प्रकट करना, ज्ञात कराना’ है। प्रसंग के क्रम में וַ को स्वाभाविक हिन्दी में ‘तब’ कहा गया है।
- source_word: לָהֶם
  choice: उन्हें
  rationale: पूर्वसर्ग और सर्वनाम-प्रत्यय का सीधा अप्रत्यक्ष कर्म।
- source_word: פָּעֳלָם
  choice: उनके कर्म
  rationale: यहाँ शब्द नैतिक दृष्टि से किए गए कार्यों को सूचित करता है; ‘कर्म’ संक्षिप्त, स्वाभाविक और गरिमापूर्ण है।
- source_word: וּפִשְׁעֵיהֶם
  choice: और उनके अपराध
  rationale: פשע में वैध अधिकार के विरुद्ध उल्लंघन या विद्रोह का भाव है। ‘अपराध’ सामान्य आधुनिक हिन्दी में नैतिक गंभीरता रखता है, जबकि ‘विद्रोह’ इस वाक्य में अनावश्यक रूप से संकीर्ण हो सकता है।
- source_word: כִּי
  choice: कि
  rationale: इसे बताई गई बात की विषय-वस्तु प्रस्तुत करने वाला अव्यय माना गया है; कारणसूचक ‘क्योंकि’ भी व्याकरणतः संभव है, पर निकटवर्ती रचना में कम संभावित।
- source_word: יִתְגַּבָּרוּ
  choice: उन्होंने घमण्ड से अपने आपको बड़ा किया है
  rationale: גבר के हित्पएल रूप का मूल चित्र अपने को बलवान या बड़ा करने का है। अपराधों के नैतिक प्रसंग में यह घमण्डपूर्ण आत्म-उत्थान सूचित करता है। यह अनुवाद उस भाव को स्पष्ट रखते हुए मूल रूपक से भी जुड़ा रहता है।
theological_decisions:
- issue: יִתְגַּבָּרוּ का नैतिक भाव
  choice: घमण्ड से अपने आपको बड़ा करना
  alternative: बलवान हो जाना / प्रबल होना
  rationale: ‘अपराधों’ के समानांतर यह सामान्य शक्ति की नहीं, घमण्डपूर्ण आत्म-उत्थान की निन्दा करता है। फिर भी शाब्दिक अर्थ की वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सामान्य पाठक के लिए स्पष्ट और गरिमापूर्ण। ‘अपराध’ तथा ‘घमण्ड से अपने आपको बड़ा किया’ नैतिक बल को व्यक्त करते हैं; पादटिप्पणी मूल इब्रानी की शाब्दिक सम्भावना सुरक्षित रखती है।
