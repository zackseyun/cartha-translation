source:
  edition: WLC
  text: וְ/אַ֤ף הֲסִיתְ/ךָ֨ מִ/פִּי צָ֗ר רַ֭חַב לֹא מוּצָ֣ק תַּחְתֶּ֑י/הָ וְ/נַ֥חַת שֻׁ֝לְחָנְ/ךָ֗ מָ֣לֵא דָֽשֶׁן׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/016.yaml
  text: Indeed[a], he lured you out of the mouth of distress into a broad place with no constraint beneath it[c][b], and the setting of your table was full of richness.
translation:
  language: hi
  text: और सचमुच, वह तुम्हें संकट के मुँह से फुसलाकर[a] ऐसी खुली जगह में ले आया, जिसके नीचे कोई तंगी नहीं है[b]; और तुम्हारी मेज़ पर रखा भोजन समृद्ध था[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बहकाकर,” “उकसाकर,” अथवा “खींचकर।” इब्रानी क्रिया में किसी को लुभाकर या उकसाकर एक ओर ले जाने का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी वाक्यांश कठिन है; इसका अनुवाद “ऐसी विस्तृत जगह में, जहाँ कोई रोक न हो” भी हो सकता है।
    reason: textual_or_semantic_difficulty
  - marker: c
    text: शाब्दिक अर्थ “चिकनाई/चर्बी से भरा” है—अर्थात भरपूर, समृद्ध या बढ़िया भोजन। “तुम्हारी मेज़ पर रखा भोजन” के स्थान पर “तुम्हारी मेज़ की सजावट” अथवा “तुम्हारी मेज़ पर जो रखा था” भी संभव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַף
  choice: और
  rationale: यह पूर्ववर्ती कथन से जोड़ते हुए बात पर बल देता है; हिन्दी में सहज संयोजक से संबंध सुरक्षित रहता है।
- source_word: הֲסִיתְךָ
  choice: वह तुम्हें बहकाकर ... ले जाता
  rationale: सות/סית का मूल भाव उकसाना, फुसलाना या किसी ओर खींचना है। यहाँ संकट से खुले स्थान की ओर आकर्षित करने का भाव है; 'बहकाकर' इसकी असामान्य और संभवतः तनावपूर्ण शब्दावली को मिटाता नहीं।
- source_word: מִפִּי צָר
  choice: संकट के मुँह से
  rationale: मूल का 'मुँह' रूपक बनाए रखा गया है; צַר में संकट और संकरेपन दोनों का भाव है, जो आगे की खुली जगह से विपरीतता बनाता है।
- source_word: רַחַב
  choice: खुली जगह
  rationale: यह विस्तार और पर्याप्त स्थान का ठोस स्थानिक बिंब देता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: לֹא מוּצָק תַּחְתֶּיהָ
  choice: जहाँ नीचे कोई तंगी नहीं होती
  rationale: מוּצָק का अर्थ यहाँ कठिन है; प्रसंग इसे दबाव, बंधन या संकरेपन के अभाव के रूप में सुझाता है। 'नीचे' को रखकर इब्रानी अभिव्यक्ति की विचित्र स्थानिकता सुरक्षित की गई है।
- source_word: וְנַחַת שֻׁלְחָנְךָ
  choice: तुम्हारी मेज़ पर परोसा भोजन
  rationale: נַחַת दुर्लभ और संदिग्ध है। मेज़ के संदर्भ में इसे वहाँ रखी या परोसी वस्तु के अर्थ में लिया गया है; 'भोजन' अर्थ को सहज बनाता है, जबकि पादटिप्पणी वैकल्पिक अधिक शाब्दिक अर्थ बताती है।
- source_word: מָלֵא דָשֶׁן
  choice: चिकनाई से भरपूर
  rationale: דֶּשֶׁן का शाब्दिक भाव चिकनाई/वसा और उससे जुड़ी समृद्धि है। यह अनुवाद भोज की भरपूरी का ठोस बिंब बनाए रखता है।
theological_decisions:
- issue: הֲסִיתְךָ का निहित कर्ता
  choice: '''वह'' रखा गया; मुख्य पाठ में ''परमेश्वर'' नहीं जोड़ा गया'
  alternative: स्पष्ट रूप से 'परमेश्वर तुम्हें...' कहना
  rationale: संदर्भ कर्ता को परमेश्वर के रूप में इंगित करता है, पर इब्रानी क्रिया में संज्ञा स्पष्ट नहीं है। सर्वनाम रखने से स्रोत की अभिव्यक्ति और उसका तनाव सुरक्षित रहता है।
- issue: कथन का संभाव्य अथवा अपूर्ण स्वर
  choice: '''ले जाता ... होता'''
  alternative: 'पूर्ण भूतकाल: ''ले गया ... था'''
  rationale: पद 18 में आने वाली चेतावनी और अय्यूब की वर्तमान दशा के कारण कई व्याख्याकार इसे उस परिणाम के रूप में समझते हैं जिसकी ओर परमेश्वर उसे ले जा रहा था या ले जाता। इब्रानी रूप अपने आप काल को पूरी तरह निश्चित नहीं करता; हिन्दी में यह चयन संदर्भगत अपूर्णता को व्यक्त करता है।
- issue: संकट और विस्तार के स्थानिक रूपक
  choice: '''संकट के मुँह'' और ''खुली जगह'' बनाए रखे'
  alternative: '''उसने तुम्हें दुःख से छुड़ाकर स्वतंत्र किया'''
  rationale: काव्य का प्रभाव संकरे संकट और निर्बाध विस्तार की विपरीतता में है; अमूर्त व्याख्या इस बिंब को मिटा देती।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिन्दी। 'संकट के मुँह' तथा 'नीचे कोई तंगी नहीं' जैसे मूल बिंब जानबूझकर रखे गए हैं। दुर्लभ נַחַת और कठिन מוּצָק की अनिश्चितता पादटिप्पणियों में स्पष्ट की गई है।
