base_translation:
  language: en
  yaml_path: translation/ot/job/036/023.yaml
  text: Who has appointed his way for him? Or who has said[b][a], ‘You have done wrong’?”
translation:
  language: hi
  text: किसने उसके लिए उसका मार्ग निर्धारित किया है? या किसने कहा है, “तुमने अन्याय किया है[a]”?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुमने गलत किया है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: किसने
  rationale: यह अलंकारिक प्रश्न आरम्भ करने वाला प्रश्नवाचक सर्वनाम है; विभक्ति के अनुसार ‘किसने’ स्वाभाविक हिन्दी है।
- source_word: פָקַד
  choice: ठहराया है
  rationale: क्रिया में नियुक्त करने, निर्धारित करने, आदेश देने या दायित्व सौंपने का भाव हो सकता है। यहाँ परमेश्वर का मार्ग उसके लिए निर्धारित करने का आशय है; ‘ठहराया’ इस व्यापकता को संक्षेप में व्यक्त करता है।
- source_word: עָלָיו דַּרְכּוֹ
  choice: उसका मार्ग उसके लिए
  rationale: शाब्दिक संबंध को बनाए रखते हुए यह वाक्यांश किसी दूसरे के द्वारा उसके आचरण या कार्य-पथ को निर्धारित किए जाने का भाव देता है।
- source_word: וּמִי אָמַר
  choice: या किसने कहा है
  rationale: दूसरा संबद्ध अलंकारिक प्रश्न है। हिन्दी में ‘या’ दोनों चुनौतियों को स्वाभाविक रूप से जोड़ता है और पूर्ण क्रिया के लिए ‘कहा है’ उपयुक्त है।
- source_word: פָּעַלְתָּ
  choice: तूने ... किया है
  rationale: आरोप के कथन में इस क्रिया का सामान्य अर्थ ‘करना’ है; एकवचन प्रत्यक्ष संबोधन को ‘तूने’ बनाए रखता है।
- source_word: עַוְלָה
  choice: अन्याय
  rationale: शब्द अन्याय, अनुचितता या अधर्म को सूचित करता है। इस प्रसंग में ‘अन्याय’ परमेश्वर पर लगाए जाने वाले नैतिक आरोप को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: पुल्लिंग प्रत्ययों और द्वितीय पुरुष क्रिया का संदर्भ
  choice: प्रसंग के अनुसार ये परमेश्वर को संदर्भित हैं, पर पाठ में नाम जोड़कर अस्पष्टता समाप्त नहीं की गई।
  alternative: इसे किसी शक्तिशाली शासक या मनुष्य के विषय में सामान्य कथन समझना।
  rationale: अय्यूब 36:22–23 में एलीहू परमेश्वर की महानता और न्याय की चर्चा करता है। फिर भी इब्रानी पद में यहाँ परमेश्वर का नाम नहीं है, इसलिए सर्वनामों को ही रखा गया है।
- issue: עַוְלָה का नैतिक आशय
  choice: अन्याय
  alternative: बुराई या अधर्म
  rationale: ‘अन्याय’ न्याय-विषयक प्रसंग से मेल खाता है और मूल शब्द के आरोपात्मक नैतिक बल को बनाए रखता है, बिना किसी विशिष्ट धर्मशास्त्रीय पदावली को थोपे।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, संक्षिप्त अलंकारिक प्रश्न। परमेश्वर को प्रत्यक्ष संबोधन में पारंपरिक एकवचन ‘तू’ रखा गया है। ‘मार्ग ठहराना’ मूल रूपक और פקד की निर्धारित करने वाली शक्ति को सुरक्षित रखता है।
