  text: הֵן פָּרַ֣שׂ עָלָ֣י/ו אוֹר֑/וֹ וְ/שָׁרְשֵׁ֖י הַ/יָּ֣ם כִּסָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/030.yaml
  text: Behold[a], he spreads his light over it[c][b], and he covers the roots of the sea.
translation:
  language: hi
  text: देखो, वह उस पर[a] अपना प्रकाश[b] फैलाता है, और समुद्र की जड़ों[c] को ढकता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में यह सर्वनाम पुल्लिंग एकवचन है, पर इसका संदर्भ स्पष्ट नहीं है। यह किसी व्यक्ति के लिए हो सकता है, अथवा संदर्भ के बादल या तूफ़ान के लिए।
    reason: alternative_reading
  - marker: b
    text: ‘प्रकाश’ का अर्थ यहाँ ‘बिजली’ या ‘चमक’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक अर्थ ‘समुद्र की जड़ें’ है; इससे उसके सबसे गहरे या आधारभूत भाग अभिप्रेत हो सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: देखो
  rationale: यह अव्यय आगे कही जाने वाली बात की ओर ध्यान खींचता है। ‘देखो’ आधुनिक हिन्दी में स्वाभाविक रहते हुए काव्यात्मक बल बनाए रखता है।
- source_word: פָּרַשׂ
  choice: फैलाता है
  rationale: क्रिया का मूल अर्थ फैलाना या विस्तृत करना है; ‘फैलाता है’ प्रकाश के प्रसार की छवि को सीधे व्यक्त करता है।
- source_word: עָלָיו
  choice: उस पर
  rationale: पुल्लिंग एकवचन सर्वनाम का संदर्भ इस पद में स्पष्ट नहीं है। ‘उस पर’ हिन्दी में संदर्भ की इसी अनिश्चितता को बनाए रखता है।
- source_word: אוֹרוֹ
  choice: अपना प्रकाश
  rationale: אוֹר का सामान्य अर्थ ‘प्रकाश’ है। तूफ़ान के संदर्भ में बिजली या चमक का भाव संभव है, पर मुख्य पाठ में व्यापक मूल अर्थ रखा गया है।
- source_word: וְשָׁרְשֵׁי הַיָּם
  choice: और समुद्र की जड़ों
  rationale: शाब्दिक और सजीव इब्रानी रूपक ‘समुद्र की जड़ें’ सुरक्षित रखा गया है; इससे समुद्र के अत्यंत गहरे या आधारभूत भाग अभिप्रेत हो सकते हैं।
- source_word: כִּסָּה
  choice: ढक देता है
  rationale: क्रिया का सीधा अर्थ ‘ढकना’ है। वर्तमानकालीन अभिव्यक्ति आस-पास के काव्यात्मक वर्णन के अनुरूप है।
theological_decisions:
- issue: עָלָיו में सर्वनाम का संदर्भ
  choice: मुख्य पाठ में अस्पष्ट ‘उस पर’
  alternative: ‘उसके ऊपर’ अथवा बादल/तूफ़ान को स्पष्ट करके अनुवाद करना
  rationale: मूल पद स्वयं सर्वनाम के संदर्भ को स्पष्ट नहीं करता; इसलिए किसी व्यक्ति, बादल या तूफ़ानी समूह को निश्चित मानना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और काव्यात्मक शैली अपनाई गई है। मूल रूपक तथा सर्वनाम-संदर्भ की वास्तविक अस्पष्टता को बनाए रखा गया है।
