  text: थोड़ी देर मेरा साथ दो, और मैं तुम्हें दिखाऊँगा, क्योंकि परमेश्वर के पक्ष में कहने को अभी और भी बातें हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּתַּר לִי זְעֵיר
  choice: ज़रा मेरी बात धीरज से सुनो
  rationale: כַּתַּר का मूल भाव प्रतीक्षा करने या धीरज रखने का है; हिन्दी में संबोधित व्यक्ति से थोड़ी देर धैर्यपूर्वक सुनने का स्वाभाविक आग्रह व्यक्त किया गया है।
- source_word: וַאֲחַוֶּךָּ
  choice: और मैं तुम्हें समझाऊँगा
  rationale: अरामी-प्रभावित חוה यहाँ बताने, प्रकट करने या समझाने के अर्थ में है; प्रसंग में एलीहू अपने तर्क को आगे स्पष्ट करने वाला है।
- source_word: כִּי עוֹד לֶאֱלוֹהַּ מִלִּים
  choice: क्योंकि परमेश्वर के पक्ष में अभी और भी बातें कहनी हैं
  rationale: לֶאֱלוֹהַּ को उद्देश्य अथवा पक्षसूचक मानते हुए यह भाव रखा गया है कि वक्ता के पास परमेश्वर के समर्थन में आगे कहने को और बातें हैं; केवल 'परमेश्वर के लिए शब्द' कहना हिन्दी में अस्पष्ट और अस्वाभाविक होता।
theological_decisions:
- issue: לֶאֱלוֹהַּ का संबंध
  choice: परमेश्वर के पक्ष में
  alternative: परमेश्वर के लिए
  rationale: यह वाक्य एलीहू के उस आगामी कथन से जुड़ता है जिसमें वह अपने ज्ञान को दूर से लाकर अपने रचयिता को न्यायी ठहराता है (36:3)। इसलिए दत्तिव को परमेश्वर की ओर से बोलने के बजाय उनके पक्ष में तर्क प्रस्तुत करने के अर्थ में रखा गया है, बिना किसी विशेष सांप्रदायिक व्याख्या के।
translation_notes:
  register: आधुनिक मानक हिन्दी; आदरपूर्ण किन्तु सीधा संबोधन। मूल के संक्षिप्त आग्रह और एलीहू के आत्मविश्वासी वक्तव्य को स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
