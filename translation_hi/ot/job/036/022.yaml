  text: הֶן אֵ֭ל יַשְׂגִּ֣יב בְּ/כֹח֑/וֹ מִ֖י כָמֹ֣/הוּ מוֹרֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/022.yaml
  text: Behold[a], God is exalted in his power[b]; who is a teacher like him?
translation:
  language: hi
  text: देखो, परमेश्वर अपने सामर्थ्य में महान है[a]; उसके समान शिक्षा देनेवाला कौन है?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपने सामर्थ्य से महान है’ अथवा ‘अपनी शक्ति के द्वारा महान है।’
    reason: lexical_alternative
  - marker: b
    text: या ‘शिक्षक के रूप में उसके समान कौन है?’
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला अव्यय है। ‘देखो’ आधुनिक हिन्दी में स्वाभाविक है और काव्यात्मक कथन का बल बनाए रखता है।
- source_word: אֵל
  choice: परमेश्वर
  rationale: यहाँ यह परमेश्वर के लिए प्रयुक्त सामान्य ईश्वरीय उपाधि है; ‘परमेश्वर’ हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: יַשְׂגִּיב
  choice: महान है
  rationale: हिफ़ील रूप ऊँचा, महान या अप्राप्य सामर्थ्य से युक्त होने का भाव देता है। ‘महान है’ सहज हिन्दी में इस ऊँचेपन को व्यक्त करता है, जबकि पदबंध के साथ संबंध खुला रहता है।
- source_word: בְּכֹחוֹ
  choice: अपने सामर्थ्य में
  rationale: בְּ का अर्थ यहाँ क्षेत्र/ढंग (‘में’) या साधन (‘से’) हो सकता है। मुख्य पाठ में ‘अपने सामर्थ्य में’ रखा गया है और साधनवाचक संभावना पादटिप्पणी में दी गई है।
- source_word: מִי כָמֹהוּ
  choice: उसके समान ... कौन है?
  rationale: यह अतुलनीयता व्यक्त करने वाला सीधा आलंकारिक प्रश्न है।
- source_word: מוֹרֶה
  choice: शिक्षा देनेवाला
  rationale: यह रूप शिक्षक अथवा शिक्षा देने वाले व्यक्ति को दर्शाता है। ‘शिक्षा देनेवाला’ क्रियात्मक अर्थ को स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: परमेश्वर की महानता और उसके सामर्थ्य का संबंध
  choice: परमेश्वर अपने सामर्थ्य में महान है
  alternative: परमेश्वर अपने सामर्थ्य से अपने को महान दिखाता है / सामर्थ्य से ऊँचा उठाता है
  rationale: इब्रानी क्रिया ऊँचा या महान होने/दिखने का भाव रखती है और בְּ संबंध या साधन दोनों सूचित कर सकता है। अनुवाद व्यापक अर्थ को रखता है और इससे आगे कोई विशिष्ट धर्मसैद्धांतिक दावा नहीं जोड़ता।
- issue: מוֹרֶה के साथ तुलना की रचना
  choice: उसके समान शिक्षा देनेवाला कौन है?
  alternative: शिक्षक के रूप में उसके समान कौन है?
  rationale: दोनों रचनाएँ इब्रानी आलंकारिक प्रश्न के अनुकूल हैं। मुख्य पाठ अधिक स्वाभाविक हिन्दी देता है; वैकल्पिक संरचना पादटिप्पणी में रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और काव्यात्मक रजिस्टर अपनाया गया है। ‘देखो’ ध्यानाकर्षक आरंभ को स्वाभाविक रखता है; ‘सामर्थ्य’ और ‘शिक्षा देनेवाला’ सामान्य पाठक के लिए बोधगम्य हैं।
