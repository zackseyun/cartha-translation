  text: וְ/דִין רָשָׁ֥ע מָלֵ֑אתָ דִּ֖ין וּ/מִשְׁפָּ֣ט יִתְמֹֽכוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/017.yaml
  text: But you are full of the judgment of the wicked[b][a]; judgment and justice seize you.
translation:
  language: hi
  text: परन्तु तुम दुष्ट के न्याय से भरे हो[a]; न्याय और इंसाफ तुम्हें थामे हुए हैं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी अभिव्यक्ति संक्षिप्त है। इसका अर्थ दुष्ट को मिलने वाले न्याय में सहभागी होना भी हो सकता है, या दुष्ट से संबंधित न्यायिक मामले में लगे रहना भी।
    reason: alternative_reading
  - marker: b
    text: या, “न्याय और इंसाफ तुम्हें सहारा दे रहे हैं” या “तुम्हें पकड़ रहे हैं।” इब्रानी क्रिया का अर्थ सहारा देना, थामे रखना, या पकड़ लेना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדִין
  choice: परन्तु ... न्याय
  rationale: वाव को प्रसंग में विरोधसूचक ‘परन्तु’ माना गया है, जबकि דִין को अगले पदबंध के साथ ‘न्याय’ के रूप में रखा गया है।
- source_word: רָשָׁע
  choice: दुष्ट
  rationale: एकवचन विशेषण यहाँ संज्ञा की तरह प्रयुक्त है; ‘दुष्ट’ उसके सामान्य और अनिर्दिष्ट भाव को बनाए रखता है।
- source_word: מָלֵאתָ
  choice: तुम ... से भरे हो
  rationale: द्वितीय पुरुष एकवचन पूर्ण क्रिया से उत्पन्न वर्तमान दशा व्यक्त होती है; यह हिंदी में स्वाभाविक रूप से भराव का रूपक भी बचाता है।
- source_word: דִּין וּמִשְׁפָּט
  choice: न्याय और इंसाफ
  rationale: दोनों न्यायिक शब्दों का समानांतर संबंध बनाए रखते हुए हिंदी में उनका हल्का अर्थभेद दिखाया गया है।
- source_word: יִתְמֹכוּ
  choice: तुम्हें जकड़े हुए हैं
  rationale: תמך में सहारा देने, थामने या पकड़ लेने का अर्थ हो सकता है। नकारात्मक प्रसंग में ‘जकड़े हुए हैं’ स्वाभाविक है, पर वैकल्पिक सकारात्मक अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: רָשָׁע के न्याय से भरे होने का आशय
  choice: ‘दुष्ट के न्याय से भरे हो’—संक्षिप्त मूल अभिव्यक्ति को बनाए रखा
  alternative: ‘दुष्ट को मिलने वाले दंड से भरे हो’ अथवा ‘दुष्ट की तरह न्याय करने में लगे हो’
  rationale: इब्रानी पदबंध संकुचित और बहुअर्थी है; अनुवाद यह तय नहीं करता कि अय्यूब दुष्ट के दंड में सहभागी है या दुष्ट-संबंधी न्याय में उलझा हुआ है।
- issue: יִתְמֹכוּ का बल और अप्रकट कर्म
  choice: ‘तुम्हें जकड़े हुए हैं’
  alternative: ‘तुम्हें संभाले हुए हैं’ अथवा कर्म जोड़े बिना ‘मजबूती से थामे हैं’
  rationale: मूल क्रिया बहुवचन है और उसका कर्म स्पष्ट नहीं है। प्रसंग दंडात्मक अर्थ की ओर झुकता है, पर सहायक अर्थ भी संभव है; इसलिए उसे पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिंदी। ‘परन्तु’ काव्यात्मक-विवेचनात्मक स्वर बनाए रखता है; ‘इंसाफ’ प्रचलित हिंदी में स्पष्ट है और निकटार्थी न्यायिक संज्ञाओं का अंतर सुनाई देता है।
