  text: Its thunder declares concerning him[a]; the cattle also[b], concerning what is rising.
translation:
  language: hi
  text: उसकी गर्जना उसके विषय में घोषणा करती है[a]; पशुधन भी उस चीज़ के विषय में जो ऊपर उठ रहा है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ कठिन है। शाब्दिक रूप से यहाँ “उसका मित्र” भी पढ़ा जा सकता है; बहुत-से लोग इस पंक्ति को तूफ़ान की आवाज़ के संदर्भ में समझते हैं।
    reason: lexical_alternative
  - marker: b
    text: या, “पशुधन भी उस उठते हुए तूफ़ान के विषय में [घोषणा करता है]।” अंतिम वाक्यांश संभवतः पास आते तूफ़ान की ओर संकेत करता है, पर इब्रानी में केवल “जो ऊपर उठ रहा है” कहा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: יַגִּיד
  choice: घोषणा करती है
  rationale: נגד के हिफ़ील रूप का सामान्य अर्थ ‘घोषित करना/जताना’ है। यह काव्यात्मक गरिमा बनाए रखता है और स्त्रीलिंग ‘गर्जना’ के अनुरूप है।
- source_word: עָלָיו
  choice: उसके विषय में
  rationale: על और सर्वनाम-प्रत्यय का अर्थ ‘उसके विषय में’ या कुछ प्रसंगों में ‘उसके विरुद्ध’ हो सकता है। यहाँ तटस्थ संबंधसूचक अर्थ रखा गया है और संदर्भ को अनावश्यक रूप से निश्चित नहीं किया गया।
- source_word: רֵעוֹ
  choice: उसकी गर्जना
  rationale: व्यंजनात्मक रूप कठिन है और शाब्दिक रूप से ‘उसका मित्र’ पढ़ा जा सकता है। तूफ़ानी प्रसंग में इसे ध्वनि अथवा गर्जना के अर्थ में समझना सुसंगत है; वैकल्पिक पाठ पादटिप्पणी में सुरक्षित है।
- source_word: מִקְנֶה
  choice: पशु
  rationale: यह संज्ञा प्रायः मवेशियों या पशुधन को दर्शाती है। मौसम के आने का आभास करने वाले पशुओं का अर्थ इस प्रसंग में स्वाभाविक है।
- source_word: אַף
  choice: भी
  rationale: यह अव्यय कथन में विस्तार या बल जोड़ता है; हिन्दी में ‘भी’ समानांतर पंक्ति को सहज रूप देता है।
- source_word: עַל
  choice: के विषय में
  rationale: ‘के विषय में’ मूल संबंधसूचक प्रयोग की अस्पष्टता को बनाए रखता है और ‘विरुद्ध’ जैसे अधिक निश्चित अर्थ को नहीं थोपता।
- source_word: עוֹלֶה
  choice: जो ऊपर उठ रहा है
  rationale: עלה का कालवाचक कृदंत ‘ऊपर उठता हुआ’ या ‘चढ़ता हुआ’ बताता है। मूल में कर्ता स्पष्ट नहीं है, इसलिए तूफ़ान या बादल को मुख्य पाठ में स्पष्टतः नहीं जोड़ा गया।
