source:
  edition: WLC
  text: הִ֭שָּׁמֶר אַל תֵּ֣פֶן אֶל אָ֑וֶן כִּֽי עַל זֶ֝֗ה בָּחַ֥רְתָּ מֵ/עֹֽנִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/021.yaml
  text: Take care[a]; do not turn to iniquity[b], for you have chosen this rather than affliction.
translation:
  language: hi
  text: सावधान रहो; बुराई की ओर मत मुड़ो,[a] क्योंकि तुमने दुःख सहने के बजाय इसी को चुना है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी אָוֶן का अर्थ ‘दुष्टता,’ ‘अनर्थ,’ या संभवतः ‘विपत्ति’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘क्योंकि तुमने दुःख से बढ़कर इसे चुना है’; इसका अर्थ ‘दुःख के बजाय’ या ‘दुर्दशा से अधिक’ भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֶר
  choice: सावधान रहो
  rationale: שׁמר का निफ़अल आज्ञार्थक रूप यहाँ चेतावनी देता है। ‘सावधान रहो’ आधुनिक और स्वाभाविक हिन्दी में इसकी आज्ञात्मक शक्ति बनाए रखता है।
- source_word: אַל תֵּפֶן
  choice: मत मुड़ो
  rationale: אַל के साथ פנה का निषेधात्मक प्रयोग किसी दिशा की ओर मुड़ने से रोकता है। ‘मत मुड़ो’ संक्षिप्त और सीधा है।
- source_word: אֶל אָוֶן
  choice: बुराई की ओर
  rationale: אָוֶן अनर्थ, दुष्टता, बुराई या कभी-कभी विपत्ति/कष्ट का अर्थ दे सकता है। इस नैतिक चेतावनी में ‘बुराई’ सहज हिन्दी है और गलत काम की ओर झुकने का भाव व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पहले दिए गए निषेध का कारण प्रस्तुत करता है; ‘क्योंकि’ हिन्दी में इस संबंध को स्पष्ट करता है।
- source_word: עַל זֶה
  choice: इसी को
  rationale: זֶה निकटवर्ती विषय, अर्थात बुराई, की ओर संकेत करता है। ‘इसी को’ चयन के विरोध और बल को स्वाभाविक रूप से व्यक्त करता है, यद्यपि पदबंध की व्याख्या में कुछ कठिनाई बनी हुई है।
- source_word: בָּחַרְתָּ
  choice: तुमने ... चुना है
  rationale: בחר का पूर्ण 2 पुं. एक. रूप पहले किए गए ऐसे चयन को दर्शाता है जिसकी वर्तमान प्रासंगिकता है। हिन्दी का पूर्ण वर्तमान इसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מֵעֹנִי
  choice: दुःख सहने के बजाय
  rationale: עֹנִי यहाँ अय्यूब की पीड़ा या क्लेश को सूचित करता है और מ तुलना व्यक्त करता है। ‘दुःख सहने के बजाय’ हिन्दी में तुलना का आशय स्पष्ट करता है, बिना दुःख की प्रकृति को अनावश्यक रूप से सीमित किए।
theological_decisions:
- issue: क्या कथन अय्यूब पर वास्तविक बुराई चुनने का आरोप लगाता है या केवल ऐसा न करने की चेतावनी देता है
  choice: पूर्ण क्रिया के आरोपात्मक तनाव को बनाए रखते हुए ‘तुमने ... चुना है’
  alternative: ‘कहीं तुम ... न चुन लो’ जैसे केवल संभावित अर्थ में प्रस्तुत करना
  rationale: इब्रानी में בָּחַרְתָּ पूर्ण रूप है और पाठ सीधे कहता है कि उसने ‘इसे’ दुःख से बढ़कर चुना है। इसे केवल काल्पनिक चेतावनी बना देना मूल कथन की कठोरता को कम कर देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सीधी रखी गई है। ‘क्लेश’ की अपेक्षा ‘दुःख’ सामान्य पाठक के लिए अधिक सहज है, जबकि पादटिप्पणी तुलना-संबंधी इब्रानी अस्पष्टता को सुरक्षित रखती है।
