base_translation:
  language: en
  yaml_path: translation/ot/job/036/004.yaml
  text: For truly[a], my words are not false; one perfect in knowledge is with you.
translation:
  language: hi
  text: क्योंकि निश्चय ही मेरी बातें झूठी नहीं हैं; जिसका ज्ञान पूर्ण है, वह तुम्हारे साथ है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिसका ज्ञान पूर्ण है, वह तुम्हारे साथ है”; इसका संकेत एलीहू के बजाय परमेश्वर की ओर भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי אָמְנָם
  choice: क्योंकि सचमुच
  rationale: כִּי पिछले कथन से कारणात्मक संबंध जोड़ता है और אָמְנָם दृढ़ पुष्टि करता है; संयुक्त अनुवाद दोनों बलों को स्वाभाविक हिन्दी में रखता है।
- source_word: לֹא שֶׁקֶר מִלָּי
  choice: मेरे शब्द झूठे नहीं हैं
  rationale: मूल की निषेधात्मक विधेय-रचना और प्रथम पुरुष अधिकारवाचक रूप को सीधी, सहज हिन्दी में सुरक्षित रखता है।
- source_word: תְּמִים דֵּעוֹת
  choice: ज्ञान में सिद्ध जन
  rationale: תְּמִים की पूर्णता/समग्रता और דֵּעוֹת के ज्ञान-बोध को व्यक्त करता है। 'सिद्ध' यहाँ ज्ञान की पूर्णता बताता है, नैतिक निष्पापता अनिवार्य नहीं करता।
- source_word: עִמָּךְ
  choice: तेरे साथ है
  rationale: इय्यूब को संबोधित एकवचन रूप और 'साथ' के मूल स्थानिक/सहचर अर्थ को बनाए रखता है।
theological_decisions:
- issue: ‘ज्ञान में सिद्ध जन’ का संदर्भ
  choice: मुख्य पाठ में व्याकरणतः खुला रखा गया है; निकट संदर्भ में इसे एलीहू का आत्म-संदर्भ समझा जा सकता है।
  alternative: यह परमेश्वर की ओर संकेत कर सकता है, जो इय्यूब के साथ उपस्थित है।
  rationale: पिछला खंड एलीहू के अपने शब्दों का बचाव करता है, इसलिए आत्म-संदर्भ निकट संदर्भ में स्वाभाविक है; फिर भी इब्रानी में स्पष्ट सर्वनाम न होने से परमेश्वर-संदर्भ की वास्तविक संभावना बनी रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, संक्षिप्त काव्यात्मक गद्य। इय्यूब के लिए एकवचन ‘तेरे’ रखा गया है, जो इब्रानी संबोधन के अनुरूप है।
