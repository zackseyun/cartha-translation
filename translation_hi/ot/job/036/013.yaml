  text: וְֽ/חַנְפֵי לֵ֭ב יָשִׂ֣ימוּ אָ֑ף לֹ֥א יְ֝שַׁוְּע֗וּ כִּ֣י אֲסָרָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/013.yaml
  text: But the godless in heart store up anger[b][a]; they do not cry for help when he binds them.
translation:
  language: hi
  text: परन्तु जो मन से अधर्मी हैं,[a] वे क्रोध पालते रहते हैं; जब वह उन्हें बाँधता है, तब वे सहायता के लिए नहीं पुकारते।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मन से अधर्मी’ का अनुवाद ‘मन के कपटी’ या ‘हृदय से भक्तिहीन’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘वे सहायता के लिए नहीं पुकारते, क्योंकि वह उन्हें बाँधता है।’ हिब्रू संयोजक को कालवाचक के बजाय कारणवाचक भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: חַנְפֵי לֵב
  choice: जो मन से अधर्मी हैं
  rationale: חנף यहाँ केवल सामाजिक कपट नहीं, बल्कि भीतर की अधार्मिकता या ईश्वर-विमुखता को व्यक्त करता है। לֵב भीतरी स्वभाव की ओर संकेत करता है; इसलिए यह अभिव्यक्ति अर्थ और हिब्रू मुहावरे दोनों को स्वाभाविक हिन्दी में रखती है।
- source_word: יָשִׂימוּ אָף
  choice: वे क्रोध पालते रहते हैं
  rationale: शाब्दिक ‘क्रोध रखते हैं’ हिन्दी में अस्वाभाविक है। ‘क्रोध पालते रहते हैं’ क्रोध को भीतर संजोए या बनाए रखने का भाव व्यक्त करता है और अपूर्ण क्रिया की निरंतरता को भी दर्शाता है।
- source_word: לֹא יְשַׁוְּעוּ
  choice: वे सहायता के लिए नहीं पुकारते
  rationale: שׁוע के पिएल रूप का सामान्य अर्थ संकट में सहायता हेतु पुकारना है; यह अनुवाद उस निहित अर्थ को स्पष्ट और स्वाभाविक हिन्दी में देता है।
- source_word: כִּי
  choice: जब
  rationale: संदर्भ में כִּי को कालवाचक मानने पर अर्थ है कि बाँधे या पीड़ित किए जाने के समय भी वे सहायता नहीं पुकारते। कारणवाचक ‘क्योंकि’ भी संभव है और पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: אֲסָרָם
  choice: वह उन्हें बाँधता है
  rationale: אָסַר का मूल अर्थ बाँधना, जकड़ना या बंदी करना है। एकवचन कर्ता को ‘वह’ ही रखा गया है; प्रसंग से उसका संकेत परमेश्वर की ओर है, पर मूल पाठ से अधिक स्पष्टता नहीं जोड़ी गई।
theological_decisions:
- issue: ‘वह उन्हें बाँधता है’ में एकवचन कर्ता का संदर्भ
  choice: कर्ता को ‘वह’ रखा गया है, जिसका प्रसंगगत संकेत परमेश्वर की ओर है।
  alternative: ‘परमेश्वर उन्हें बाँधता है’ कहकर संदर्भ को स्पष्ट करना।
  rationale: हिब्रू में तीसरे पुरुष का एकवचन क्रियारूप है और परमेश्वर का नाम यहाँ प्रत्यक्ष नहीं है। सर्वनाम बनाए रखने से मूल की अभिव्यक्ति और उसकी प्रसंगगत निर्भरता सुरक्षित रहती है।
- issue: כִּי का कालवाचक या कारणवाचक अर्थ
  choice: मुख्य पाठ में कालवाचक ‘जब’।
  alternative: कारणवाचक ‘क्योंकि’ या ‘इसलिए कि’।
  rationale: दोनों अर्थ व्याकरणतः संभव हैं। कालवाचक अर्थ निकट प्रसंग में उनके विपत्ति के समय सहायता न पुकारने पर बल देता है; कारणवाचक संभावना पादटिप्पणी में दी गई है ताकि वास्तविक अस्पष्टता बनी रहे।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली रखी गई है। ‘परन्तु’, ‘अधर्मी’ और ‘सहायता के लिए पुकारते’ सामान्य बाइबलीय गरिमा बनाए रखते हुए आज के पाठक के लिए बोधगम्य हैं।
