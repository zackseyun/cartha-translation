  text: אַ֣ף אִם יָ֭בִין מִפְרְשֵׂי עָ֑ב תְּ֝שֻׁא֗וֹת סֻכָּתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/029.yaml
  text: Can anyone understand the spreading of the clouds[a], the thunderings of his shelter?
translation:
  language: hi
  text: क्या कोई बादलों के फैलाव को और उसके मंडप से उठती गड़गड़ाहटों को समझ सकता है?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “गड़गड़ाहटों” का अनुवाद “गर्जनाओं” या “कोलाहल” भी हो सकता है; और “मंडप” का अनुवाद “आश्रय” या “छाजन” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף אִם
  choice: क्या कोई … सकता है?
  rationale: इस काव्यात्मक प्रसंग में यह पदबंध एक आलंकारिक प्रश्न आरम्भ करता है। यह हिन्दी प्रयोग चुनौती का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: יָבִין
  choice: समझ सकता है
  rationale: क्रिया का मूल अर्थ समझना या परखना है; यहाँ ‘समझ सकता है’ सरल और प्रसंगानुकूल है।
- source_word: מִפְרְשֵׂי עָב
  choice: बादलों के फैलाव
  rationale: מִפְרְשֵׂי फैलने या फैलाए जाने की छवि देता है, और एकवचन עָב यहाँ सामूहिक अर्थ में बादल-समूह को सूचित कर सकता है।
- source_word: תְּשֻׁאוֹת
  choice: गड़गड़ाहटों
  rationale: यह शब्द तेज़ शोर, गर्जना या कोलाहल का द्योतक है। तूफ़ान के प्रसंग में ‘गड़गड़ाहटों’ अर्थ को स्पष्ट करता है, पर इसकी व्यापक अर्थ-सीमा पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: סֻכָּתוֹ
  choice: उसके मंडप
  rationale: סֻכָּה आश्रय, छाजन या मंडप को सूचित करता है। ‘मंडप’ परमेश्वर के बादलमय निवास की काव्यात्मक छवि को बनाए रखता है और हिन्दी में गरिमापूर्ण है।
theological_decisions:
- issue: סֻכָּתוֹ में तीसरे पुरुष एकवचन प्रत्यय का संदर्भ
  choice: ‘उसके’ का संदर्भ परमेश्वर से है, और तूफ़ानी बादल उसके काव्यात्मक मंडप के रूप में चित्रित हैं।
  alternative: प्रत्यय को अधिक सामान्य रूप से तूफ़ानी बादल के अपने आवरण-स्थान से संबंधित समझना।
  rationale: आस-पास के पदों में एलीहू परमेश्वर द्वारा मौसम पर किए जाने वाले अद्भुत नियंत्रण का वर्णन कर रहा है। इसलिए परमेश्वर को इसका संदर्भ मानना प्रसंग के अनुकूल है, जबकि अनुवाद रूपक को बिना अतिरिक्त व्याख्या के बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक और गरिमापूर्ण शैली रखी गई है। ‘फैलाव’ और ‘मंडप’ मूल रूपकों को बनाए रखते हैं, जबकि ‘गड़गड़ाहटों’ से तूफ़ान का प्रसंग सामान्य पाठक के लिए स्पष्ट होता है।
