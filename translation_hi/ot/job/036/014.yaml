  yaml_path: translation/ot/job/036/014.yaml
  text: They die in youth[a], and their life ends among the male cult prostitutes.
translation:
  language: hi
  text: वे युवावस्था में मर जाते हैं, और उनका जीवन मूर्तिपूजक उपासना से जुड़े पुरुष यौनकर्मियों[a] के बीच समाप्त होता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “समर्पित जनों के बीच।” इब्रानी शब्द सम्भवतः मूर्तिपूजक उपासना से जुड़े पुरुष यौनकर्मियों को दर्शाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: תָּמֹת
  choice: चला जाता है
  rationale: मूल क्रिया מות का अर्थ ‘मरना’ है। ‘प्राण चला जाता है’ हिन्दी में नַפְשָׁם को स्पष्ट रखते हुए मृत्यु का स्वाभाविक और गरिमापूर्ण वर्णन है।
- source_word: בַּנֹּעַר
  choice: युवावस्था में ही
  rationale: נֹעַר आरम्भिक जीवन अथवा युवावस्था को दर्शाता है; ‘ही’ अकाल मृत्यु के भाव को स्वाभाविक हिन्दी में उभारता है।
- source_word: נַפְשָׁם
  choice: उनका प्राण
  rationale: נֶפֶשׁ यहाँ व्यक्ति के जीवन/प्राण के अर्थ में मृत्यु का व्याकरणिक कर्ता है। ‘प्राण’ मूल की अभिव्यक्ति को बनाए रखता है, बिना इसे शरीर से पृथक आत्मा के विषय में कोई दार्शनिक दावा बनाए।
- source_word: וְחַיָּתָם
  choice: और उनका जीवन समाप्त होता है
  rationale: חַיָּה का आशय यहाँ जीवन अथवा जीवनकाल है। दूसरे समानांतर खंड में क्रिया निहित है; स्वाभाविक हिन्दी के लिए ‘समाप्त होता है’ स्पष्ट किया गया है।
- source_word: בַּקְּדֵשִׁים
  choice: पुरुष देवदासी-वृत्ति करने वालों के बीच
  rationale: קְדֵשִׁים का संभावित ऐतिहासिक अर्थ मूर्तिपूजक उपासना से जुड़े पुरुष यौन-कर्मियों से है। यह चयन पुरुषवाचकता और धार्मिक-सांस्कृतिक संदर्भ दोनों व्यक्त करता है; वैकल्पिक शाब्दिक अर्थ पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: קְדֵשִׁים का अर्थ
  choice: पुरुष देवदासी-वृत्ति करने वाले
  alternative: समर्पित जन
  rationale: अन्य बाइबिलीय प्रयोगों और यहाँ के अपमानजनक अंत के संदर्भ में यह शब्द सम्भवतः मूर्तिपूजक उपासना से जुड़े पुरुष यौन-कर्मियों को सूचित करता है। फिर भी व्युत्पत्तिगत रूप से ‘समर्पित जन’ सम्भव है, इसलिए वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिन्दी। ‘पुरुष देवदासी-वृत्ति करने वाले’ कुछ लंबा है, पर यह केवल ‘देवदासी’ कहने से उत्पन्न स्त्रीवाचक भ्रम को रोकता और मूल के पुरुषवाचक सांस्कृतिक अर्थ को सुरक्षित रखता है।
