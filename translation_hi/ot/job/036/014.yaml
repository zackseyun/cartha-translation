revisions:
- from: उनका प्राण युवावस्था में ही चला जाता है, और उनका जीवन पुरुष देवदासी-वृत्ति करने वालों के बीच समाप्त होता है।[a]
  to: वे युवावस्था में मर जाते हैं, और उनका जीवन मूर्तिपूजक उपासना से जुड़े पुरुष यौनकर्मियों[a] के बीच समाप्त होता है।
  rationale: Revised the idiomatic first colon to natural modern Hindi, removed unsupported emphasis, and replaced the misleading, non-Hebrew cultural category «देवदासी-वृत्ति» with a clear historical rendering of the probable sense of קְדֵשִׁים. The footnote preserves the alternative ‘consecrated ones’ reading and is anchored to the disputed term.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T18:47:23Z'
review_pass:
  verdict: revise
  source_fidelity: The draft preserves the two Hebrew cola and correctly recognizes that נֶפֶשׁ idiomatically denotes the persons who die. However, «देवदासी-वृत्ति» imports a specifically South Asian, normally female institution and is not an appropriate equivalent for קְדֵשִׁים. The added «ही» is not required by the Hebrew.
  naturalness: «पुरुष देवदासी-वृत्ति करने वालों» is cumbersome and semantically confusing in modern Hindi. A direct reference to men connected with cultic sexual practice is clearer and more idiomatic.
  terminology: Use «मूर्तिपूजक उपासना से जुड़े पुरुष यौनकर्मी» rather than «देवदासी-वृत्ति करने वाले». This conveys the likely cultic sense without importing the culturally specific devadasi institution. The alternative lexical sense is retained in the footnote.
  issues:
  - severity: medium
    issue: «देवदासी-वृत्ति» is culturally and gender-specifically misleading.
    rationale: Devadasi denotes a particular South Asian practice and ordinarily evokes women; קְדֵשִׁים is masculine plural and refers, if the likely cultic sense is adopted, to men in an ancient Israelite/pagan setting.
  - severity: low
    issue: «ही» adds emphasis not expressed in בַּנֹּעַר.
    rationale: «युवावस्था में» adequately renders ‘in youth’ without adding an emphatic particle.
  - severity: low
    issue: The footnote anchor should immediately follow the term it explains.
    rationale: Placing [a] after «पुरुष यौनकर्मियों» makes its scope unambiguous.
  revised_text: वे युवावस्था में मर जाते हैं, और उनका जीवन मूर्तिपूजक उपासना से जुड़े पुरुष यौनकर्मियों[a] के बीच समाप्त होता है।
