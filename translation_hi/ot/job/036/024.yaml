  text: Remember that you should magnify his work[a], of which men have sung.
translation:
  language: hi
  text: याद रख कि तू उसके काम की महिमा करे[a], जिसका गुणगान मनुष्यों ने किया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याद रख कि तू उसके काम की महिमा करे, जिसे मनुष्यों ने देखा है,” अथवा “याद रख कि तू उसके काम की महिमा करे, जिसे मनुष्यों ने निहारा है।” यहाँ अनूदित इब्रानी क्रिया कठिन है; कुछ विद्वान इसे गाने के बजाय देखने या निहारने के अर्थ में लेते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר
  choice: याद रख
  rationale: पुल्लिंग एकवचन आज्ञार्थक रूप का सीधा और स्वाभाविक हिन्दी अनुवाद।
- source_word: כִּי
  choice: कि
  rationale: यहाँ यह कारण नहीं, बल्कि याद रखने योग्य बात की विषय-वस्तु प्रस्तुत करता है।
- source_word: תַשְׂגִּיא
  choice: तू ... महिमा करे
  rationale: हिफ़ील रूप में किसी काम को महान ठहराने या उसका बखान करने का आग्रह है; ‘महिमा करे’ हिन्दी में काव्यात्मक और गरिमापूर्ण है।
- source_word: פָעֳלוֹ
  choice: उसके काम
  rationale: व्यापक अर्थ बनाए रखता है और सन्दर्भ से सर्वनाम परमेश्वर की ओर संकेत करता है।
- source_word: אֲשֶׁר
  choice: जिसका
  rationale: सम्बन्धवाचक उपवाक्य को ‘काम’ से स्वाभाविक हिन्दी में जोड़ता है।
- source_word: שֹׁרְרוּ
  choice: गुणगान ... किया है
  rationale: कठिन क्रिया का पारम्परिक काव्यात्मक अर्थ ‘गाना/गुणगान करना’ मुख्य पाठ में रखा गया है; ‘देखना/निहारना’ पादटिप्पणी में सुरक्षित है।
- source_word: אֲנָשִׁים
  choice: मनुष्यों
  rationale: बहुवचन मानव-संज्ञा को आधुनिक हिन्दी में प्रतिनिधिक और गरिमापूर्ण रूप से व्यक्त करता है; ‘पुरुषों’ यहाँ अनावश्यक रूप से लिंग-विशिष्ट सुनाई दे सकता है।
theological_decisions:
- issue: פָעֳלוֹ में तृतीय पुरुष एकवचन पुल्लिंग प्रत्यय का संकेत
  choice: ‘उसके’—सन्दर्भ में परमेश्वर
  alternative: ‘परमेश्वर के’ को स्पष्ट रूप से लिखना
  rationale: इब्रानी की सर्वनामात्मक अभिव्यक्ति बनाए रखी गई है; निकटवर्ती सन्दर्भ उसका संकेत परमेश्वर की ओर स्पष्ट करता है।
- issue: שֹׁרְרוּ का कठिन अर्थ
  choice: गुणगान किया है
  alternative: देखा है / निहारा है
  rationale: मुख्य पाठ में पारम्परिक रूप से सम्भावित ‘गाने’ का अर्थ रखा गया, पर वास्तविक शाब्दिक अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में एकवचन ‘तू’ रखा गया है, क्योंकि इब्रानी आज्ञा पुल्लिंग एकवचन है और सम्बोधन अय्यूब से है। शैली काव्यात्मक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है।
