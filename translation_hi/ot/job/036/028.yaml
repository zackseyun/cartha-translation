  text: which the clouds pour down[a]; they drip abundantly on man.
translation:
  language: hi
  text: 'जिन्हें बादल बरसाते हैं;

    वे मनुष्यों[a] पर बहुतायत से टपकते हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में एकवचन ‘मनुष्य’; यहाँ अर्थ समस्त मानव-समुदाय है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: जिन्हें
  rationale: यह सम्बन्धवाचक अव्यय पिछले पद में उल्लिखित जल की बूँदों से इस पद को जोड़ता है; हिन्दी में बहुवचन रूप उस पूर्वपद के अनुरूप है।
- source_word: יִזְּלוּ
  choice: बरसाते हैं
  rationale: נזל नीचे की ओर बहने या टपकने का बोध कराता है; बादलों के प्रसंग में ‘बरसाते हैं’ स्वाभाविक हिन्दी है और नीचे गिरते जल का भाव रखता है।
- source_word: שְׁחָקִים
  choice: बादल
  rationale: काव्यात्मक मौसम-वर्णन में यह शब्द आकाश या बादलों के लिए आता है; यहाँ वर्षा के निकट प्रसंग में ‘बादल’ सबसे स्पष्ट है।
- source_word: יִרְעֲפוּ
  choice: टपकते हैं
  rationale: רָעַף बूँद-बूँद गिरने अथवा वर्षा करने का अर्थ देता है; ‘टपकते हैं’ पहले खंड से शब्दगत भिन्नता बनाए रखते हुए बूँदों की छवि को सुरक्षित रखता है।
- source_word: עֲלֵי
  choice: पर
  rationale: ऊपर से नीचे लोगों पर गिरने की दिशा के लिए सरल और स्वाभाविक हिन्दी परसर्ग।
- source_word: אָדָם
  choice: मनुष्यों
  rationale: एकवचन אָדָם यहाँ समष्टिगत रूप से मानवता को सूचित करता है; हिन्दी में ‘मनुष्यों’ इस सामूहिक अर्थ को स्वाभाविक और स्पष्ट रूप में व्यक्त करता है।
- source_word: רָב
  choice: बहुतायत से
  rationale: यहाँ विशेषण क्रियाविशेषणवत् प्रयुक्त होकर वर्षा की प्रचुर मात्रा बताता है; ‘बहुतायत से’ उस अर्थ को स्पष्ट रखता है।
theological_decisions:
- issue: אָדָם के समष्टिगत अर्थ का अनुवाद
  choice: मनुष्यों
  alternative: मनुष्य / मनुष्यजाति
  rationale: इब्रानी में एकवचन אָדָם समस्त मानव-समुदाय के लिए प्रयुक्त है। मुख्य पाठ में ‘मनुष्यों’ आधुनिक हिन्दी में इस समावेशी, सामूहिक अर्थ को स्वाभाविक ढंग से व्यक्त करता है; पादटिप्पणी मूल के एकवचन रूप को बताती है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण काव्यात्मक हिन्दी। अर्धविराम समानान्तर उपवाक्यों को जोड़ता है; ‘बरसाते’ और ‘टपकते’ दोनों इब्रानी क्रियाओं की अलग-अलग वर्षा-छवियों को बनाए रखते हैं।
