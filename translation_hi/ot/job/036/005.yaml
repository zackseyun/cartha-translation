base_translation:
  language: en
  yaml_path: translation/ot/job/036/005.yaml
  text: Behold[a], God is mighty and does not despise[b]; he is mighty in strength of heart.
translation:
  language: hi
  text: देखो[a], परमेश्वर सामर्थी है और तुच्छ नहीं समझता[b]; वह हृदय की शक्ति में भी सामर्थी है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “निश्चय ही” या “सुनो।”
    reason: lexical_alternative
  - marker: b
    text: या “ठुकराता नहीं” या “अस्वीकार नहीं करता।” इब्रानी में कर्म स्पष्ट नहीं बताया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: देखो
  rationale: यह शब्द जोर देकर कथन की ओर ध्यान खींचता है। ‘देखो’ आधुनिक हिन्दी में स्वाभाविक रहते हुए काव्यात्मक उद्घोष का बल बनाए रखता है।
- source_word: אֵל
  choice: परमेश्वर
  rationale: यहाँ यह परमेश्वर के लिए प्रयुक्त सामान्य काव्यात्मक पद है; इसे किसी विस्तृत उपाधि में बदलना आवश्यक नहीं।
- source_word: כַּבִּיר
  choice: सामर्थी
  rationale: यह महानता और सामर्थ्य को व्यक्त करता है। दोनों प्रयोगों में ‘सामर्थी’ रखने से मूल की पुनरावृत्ति बनी रहती है।
- source_word: וְלֹא יִמְאָס
  choice: और किसी को तुच्छ नहीं समझता
  rationale: क्रिया का अर्थ ‘तुच्छ समझना, ठुकराना, अस्वीकार करना’ हो सकता है। मूल में कर्म व्यक्त नहीं है; हिन्दी में ‘किसी को’ जोड़ना स्वाभाविक है, जबकि पादटिप्पणी इस अंतर्निहित कर्म और lexical विकल्पों को स्पष्ट करती है।
- source_word: כֹּחַ לֵב
  choice: हृदय की शक्ति
  rationale: यह इब्रानी पद का निकट रूप है। ‘हृदय’ मन, समझ या दृढ़ संकल्प का संकेत दे सकता है; मुख्य पाठ स्रोत की रूपकात्मक अस्पष्टता बनाए रखता है।
theological_decisions:
- issue: ‘तुच्छ नहीं समझता’ का अव्यक्त कर्म
  choice: किसी को तुच्छ नहीं समझता
  alternative: तुच्छ नहीं समझता; ठुकराता नहीं; अस्वीकार नहीं करता
  rationale: इब्रानी में कर्म स्पष्ट नहीं है। ‘किसी को’ हिन्दी वाक्य को सहज बनाता है, पर किसी संकुचित समूह को कर्म मानकर अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- issue: ‘हृदय की शक्ति’ का आशय
  choice: हृदय की शक्ति में सामर्थी
  alternative: समझ में सामर्थी; संकल्प में दृढ़
  rationale: לֵב समझ, मन या संकल्प को सूचित कर सकता है। ‘हृदय’ बनाए रखने से मूल रूपक और उसकी वास्तविक अर्थगत व्यापकता सुरक्षित रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण काव्यात्मक गद्य। ‘देखो’ ध्यानाकर्षक उद्घोष को और ‘हृदय की शक्ति’ मूल रूपक को बनाए रखते हैं।
