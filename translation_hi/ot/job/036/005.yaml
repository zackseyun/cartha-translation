  source_fidelity: The Hebrew reads literally, “Behold, God is mighty, and he does not despise; mighty in strength of heart.” The draft correctly preserves the repeated כַּבִּיר with “सामर्थी” and retains the figurative “हृदय की शक्ति.” However, “किसी को” supplies an object which the Hebrew deliberately leaves unstated. This is a defensible contextual interpretation but should not be placed in the main text where Hindi can preserve the ellipsis naturally.
  naturalness: “देखो” and “परमेश्वर” are natural in a dignified modern Hindi biblical register. “वह हृदय की शक्ति में सामर्थी है” is understandable but slightly literal and awkward. “वह हृदय की शक्ति में भी सामर्थी है” reads more fluently while retaining the source metaphor and the second occurrence of “mighty.”
  terminology: “परमेश्वर” appropriately renders the poetic generic divine term אֵל in this context. “सामर्थी” consistently reflects כַּבִּיר. “हृदय” should remain in the main text because לֵב may denote understanding, inner resolve, or mind; the explanatory alternatives belong in a footnote.
  issues:
