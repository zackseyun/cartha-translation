base_translation:
  language: en
  yaml_path: translation/ot/job/036/032.yaml
  text: He covers his hands with lightning[b][a], and commands it to strike the mark.
translation:
  language: hi
  text: 'वह बिजली से अपनी हथेलियों को ढक लेता है[a],

    और उसे लक्ष्य पर प्रहार करने की आज्ञा देता है।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में ‘प्रकाश’; आसपास के तूफ़ानी वर्णन में इसका अर्थ संभवतः ‘बिजली’ है।
    reason: lexical_alternative
  - marker: b
    text: 'अंतिम इब्रानी वाक्यांश कठिन है। अन्य संभावित अर्थ हैं: ‘जिस पर वह प्रहार करती है उसके विरुद्ध’ या ‘मध्यस्थ के विरुद्ध।’'
    reason: alternative_reading
lexical_decisions:
- source_word: כַּפַּיִם
  choice: अपनी हथेलियों
  rationale: द्विवचन כַּפַּיִם विशेष रूप से दोनों हथेलियों को दर्शाता है; हिंदी में ‘हथेलियों’ शारीरिक बिंब को ‘हाथों’ से अधिक स्पष्टता से बनाए रखता है।
- source_word: כִּסָּה
  choice: ढक लेता है
  rationale: כסה का मूल अर्थ ‘ढकना’ या ‘छिपाना’ है। ‘ढक लेता है’ ठोस काव्यात्मक बिंब को स्वाभाविक हिंदी में रखता है।
- source_word: אוֹר
  choice: बिजली
  rationale: אוֹר का सामान्य अर्थ ‘प्रकाश’ है, पर आसपास के तूफ़ानी संदर्भ में यहाँ आकाशीय बिजली अभिप्रेत होने की प्रबल संभावना है।
- source_word: וַיְצַו
  choice: आज्ञा देता है
  rationale: צוה का अर्थ ‘आज्ञा देना’ है और यह बिजली पर परमेश्वर के व्यक्तिगत नियंत्रण को बनाए रखता है।
- source_word: עָלֶיהָ
  choice: उसे
  rationale: स्त्रीलिंग प्रत्यय का संबंध संभवतः संदर्भगत बिजली से है। हिंदी में ‘उसे’ स्वाभाविक है, यद्यपि मूल में इसका संकेत अस्पष्ट है।
- source_word: בְמַפְגִּיעַ
  choice: लक्ष्य पर प्रहार करने
  rationale: פגע से बना यह पद कठिन है। तूफ़ानी संदर्भ में बिजली को उसके निशाने की ओर भेजने का अर्थ सुसंगत है, पर अन्य व्याकरणिक और अर्थगत संभावनाएँ पादटिप्पणी में सुरक्षित रखी गई हैं।
theological_decisions:
- issue: בְמַפְגִּיעַ में ‘मध्यस्थ’ अर्थ की संभावना
  choice: लक्ष्य पर प्रहार करने
  alternative: प्रहार करनेवाले के विरुद्ध; मध्यस्थ के विरुद्ध
  rationale: संदर्भ बिजली और तूफ़ान का है, इसलिए लक्ष्य पर प्रहार का अर्थ सर्वाधिक सुसंगत है। फिर भी פגע के कारण ‘मध्यस्थ’ या ‘प्रहार करनेवाला’ अर्थ संभव है; उसे मुख्य पाठ में धार्मिक अर्थ बनाकर निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सहज काव्यात्मक भाषा रखी गई है। ‘हथेलियों’ मूल के द्विवचन और शारीरिक बिंब को सुरक्षित रखता है; कठिन अंतिम वाक्यांश की अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
