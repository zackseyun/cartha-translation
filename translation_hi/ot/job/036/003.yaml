  yaml_path: translation/ot/job/036/003.yaml
  text: I will bring my knowledge from afar[b][a], and to my Maker I will ascribe righteousness.
translation:
  language: hi
  text: मैं अपना ज्ञान दूर से लाऊँगा[a], और अपने रचनेवाले को धर्मी ठहराऊँगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं अपना ज्ञान बहुत दूर से लाऊँगा।”
    reason: lexical_alternative
  - marker: b
    text: या, “अपने रचनेवाले को न्यायी ठहराऊँगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶשָּׂא
  choice: लाऊँगा
  rationale: נשׂא का मूल अर्थ उठाना, ढोना या ले आना है। ‘अपने ज्ञान’ और ‘दूर से’ के साथ यहाँ ‘लाऊँगा’ स्वाभाविक हिन्दी में स्रोत से ज्ञान सामने लाने का भाव रखता है।
- source_word: דֵעִי
  choice: अपना ज्ञान
  rationale: דעת ज्ञान या समझ को दर्शाता है। ‘अपना ज्ञान’ मूल के प्रथम पुरुष संबंध और सीधे अर्थ दोनों को सुरक्षित रखता है।
- source_word: לְמֵרָחוֹק
  choice: दूर से
  rationale: इस प्रसंग में यह ज्ञान के दूरस्थ स्रोत या व्यापक पहुँच का संकेत देता है। ‘दूर से’ संक्षिप्त और स्वाभाविक है; ‘बहुत दूर से’ सम्भव विकल्प है।
- source_word: וּלְפֹעֲלִי
  choice: और अपने रचनेवाले को
  rationale: פֹעֵל का अर्थ करनेवाला या बनानेवाला है और प्रथम पुरुष प्रत्यय के कारण आशय ‘मुझे बनानेवाला’ है। ‘रचनेवाला’ ईश्वर के लिए स्पष्ट, गरिमापूर्ण और सहज हिन्दी है।
- source_word: אֶתֵּן
  choice: श्रेय दूँगा
  rationale: נתן का शाब्दिक अर्थ ‘दूँगा’ है, पर צדק को रचनेवाले से जोड़ने पर भाव धार्मिकता या न्याय का गुण उन्हें देना अथवा उसका श्रेय उन्हें देना है।
- source_word: צֶדֶק
  choice: धार्मिकता
  rationale: צדק नैतिक सहीपन और न्याय दोनों को व्यक्त कर सकता है। ‘धार्मिकता’ व्यापक चरित्रगत सहीपन को रखता है, जबकि ‘न्याय’ को पादटिप्पणी में सुरक्षित किया गया है।
theological_decisions:
- issue: ईश्वर के संदर्भ में צדק का अनुवाद
  choice: धार्मिकता
  alternative: न्याय
  rationale: यह इब्रानी शब्द ईश्वर के नैतिक सहीपन और उनके न्यायपूर्ण आचरण, दोनों की ओर संकेत कर सकता है। मुख्य पाठ में व्यापक अर्थ ‘धार्मिकता’ रखा गया है और न्यायिक अर्थ को पादटिप्पणी में दिया गया है, ताकि मूल की अर्थगत व्यापकता न मिटे।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली। ‘रचनेवाले’ ईश्वर के लिए प्रसंगानुकूल है; ‘श्रेय दूँगा’ शाब्दिक ‘दूँगा’ की अपेक्षा हिन्दी में वाक्य का आशय स्पष्ट करता है।
