  yaml_path: translation/ot/job/036/010.yaml
  text: He opens their ear to discipline[b][a], and says that they should turn back from wickedness.
translation:
  language: hi
  text: वह अनुशासन के लिए उनके कान खोलता है[a] और कहता है कि वे दुष्टता से मुड़ जाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अनुशासन के लिए उनके कान उघाड़ता है”; अर्थ यह भी हो सकता है, “शिक्षा ग्रहण करने के लिए उनके कान खोलता है” या “सुधार के लिए उनके कान खोलता है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגֶל
  choice: खोलता है
  rationale: गלה यहाँ कान को ग्रहणशील बनाने के अर्थ वाला रूपक है। ‘खोलता है’ आधुनिक हिन्दी में स्वाभाविक रहते हुए उस रूपक को बनाए रखता है।
- source_word: אָזְנָם
  choice: उनके कान
  rationale: इब्रानी में ‘कान’ एकवचन है, पर बहुवचन संबंधसूचक प्रत्यय के साथ सामूहिक अर्थ देता है। हिन्दी में ‘उनके कान’ स्वाभाविक है और वचन की अस्पष्टता को अनावश्यक रूप से नहीं उभारता।
- source_word: לַמּוּסָר
  choice: अनुशासन के लिए
  rationale: מוּסָר में शिक्षा, सुधार और ताड़ना के अर्थ जुड़े हैं। प्रसंग में दुःख के द्वारा सुधारात्मक शिक्षा का भाव होने से ‘अनुशासन’ इसकी व्यापकता बनाए रखता है।
- source_word: וַיֹּאמֶר
  choice: और कहता है
  rationale: אמר का सीधा और सहज अनुवाद; इसमें इब्रानी में अनुपस्थित अप्रत्यक्ष कर्म नहीं जोड़ा गया है।
- source_word: כִּי
  choice: कि
  rationale: यहाँ כִּי कही गई बात की विषय-वस्तु प्रस्तुत करता है, इसलिए ‘कि’ उपयुक्त है।
- source_word: יְשֻׁבוּן
  choice: वे ... फिर जाएँ
  rationale: שוב का मूल भाव लौटना या मुड़ना है। इस कथन में आदेशात्मक आग्रह को हिन्दी का संभावनार्थक ‘फिर जाएँ’ स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מֵאָוֶן
  choice: दुष्टता से
  rationale: אָוֶן के अर्थों में अनर्थ, बुराई, दुष्टता और कभी-कभी संकट शामिल हैं। यहाँ नैतिक बुराई से लौटने का प्रसंग है, इसलिए ‘दुष्टता’ स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: אליהוא के कथन में מוּסָר का स्वरूप
  choice: सुधारात्मक शिक्षा के अर्थ में ‘अनुशासन’
  alternative: केवल ‘शिक्षा’ अथवा अधिक दंडात्मक ‘ताड़ना’
  rationale: आसपास का प्रसंग दुःख को ऐसा माध्यम बताता है जिसके द्वारा परमेश्वर मनुष्य को सिखाता और बुराई से लौटाता है। ‘अनुशासन’ शैक्षिक और सुधारात्मक दोनों पक्षों को बनाए रखता है, बिना दुःख के विषय में कोई विशिष्ट सिद्धान्त थोपे।
- issue: אָוֶן का नैतिक अथवा दुःख-संबंधी अर्थ
  choice: नैतिक अर्थ में ‘दुष्टता’
  alternative: ‘अनर्थ’ या ‘संकट’
  rationale: ‘फिर जाने’ की क्रिया के साथ यह पद लोगों को गलत आचरण से लौटने के लिए कहता है; इसलिए यहाँ नैतिक अर्थ अधिक संगत है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण काव्यात्मक गद्य। ‘कान खोलता है’ मूल रूपक को सुरक्षित रखता है; ‘अनुशासन’ शिक्षा और सुधार की संयुक्त अर्थ-छाया व्यक्त करता है।
