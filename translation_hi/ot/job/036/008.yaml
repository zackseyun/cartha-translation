  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रखी गई है। ‘बेड़ियाँ’ और ‘रस्सियाँ’ मूल के ठोस समानान्तर बिम्ब को बनाए रखते हैं।
