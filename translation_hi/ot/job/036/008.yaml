  rationale: אסר के निष्क्रिय कृदन्त का क्रियात्मक और निष्क्रिय भाव सुरक्षित रखता है।
- source_word: בַּזִּקִּים
  choice: बेड़ियों में
  rationale: भौतिक बन्धन के ठोस बिम्ब को स्पष्ट, सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יִלָּכְדוּן
  choice: जकड़े हों
  rationale: לכד के निफ़अल रूप में निहित पकड़े या फँसाए जाने के निष्क्रिय भाव को यहाँ रस्सियों के बिम्ब के साथ स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּחַבְלֵי
  choice: रस्सियों में
  rationale: חבל के ठोस अर्थ ‘रस्सी/डोरी’ को बनाए रखता है और पहले पद के बन्धन-बिम्ब के समानान्तर है।
- source_word: עֹנִי
  choice: दुःख
  rationale: यहाँ व्यापक पीड़ा या क्लेश का अर्थ देता है और शब्द को केवल आर्थिक गरीबी तक सीमित नहीं करता।
theological_decisions:
- issue: बन्धन के बिम्ब की प्रकृति
  choice: बेड़ियों और रस्सियों के ठोस बिम्ब को बनाए रखते हुए उसके दुःख अथवा अनुशासन की दशा का रूपक होने की सम्भावना खुली रखी गई है।
  alternative: इसे केवल वास्तविक कारावास या केवल रूपकात्मक विपत्ति के रूप में स्पष्ट कर देना।
  rationale: मूल शब्दावली ठोस है, पर निकटवर्ती प्रसंग पीड़ित लोगों के साथ परमेश्वर के व्यवहार की बात करता है; इसलिए अनुवाद किसी एक अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
