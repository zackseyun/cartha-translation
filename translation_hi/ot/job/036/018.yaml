  text: כִּֽי חֵ֭מָה פֶּן יְסִֽיתְ/ךָ֣ בְ/סָ֑פֶק וְ/רָב כֹּ֝֗פֶר אַל יַטֶּֽ/ךָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/018.yaml
  text: Because wrath—beware lest it entice you into scoffing[c][b][a], and do not let a great ransom turn you aside.
translation:
  language: hi
  text: क्योंकि क्रोध—सावधान रहो, कहीं वह तुम्हें उपहास की ओर न उकसाए[a]; और बड़ी छुड़ौती[b] तुम्हें भटका न दे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कहीं वह तुम्हें ताली बजाने के लिए न उकसाए।” यहाँ प्रयुक्त इब्रानी शब्द कठिन है और संभवतः हाथ मारने या ताली बजाने के किसी उपहासपूर्ण हाव-भाव को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: “छुड़ौती” का अर्थ “प्रायश्चित-मूल्य” और कुछ प्रसंगों में “रिश्वत” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या, “और बड़ी छुड़ौती तुम्हें प्रभावित न करे।” इब्रानी क्रिया का अर्थ किसी को मोड़ना, झुकाना या प्रभावित करना हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह आगे दी जा रही चेतावनी का कारण प्रस्तुत करता है; ‘क्योंकि’ इसके कारणवाचक बल को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: חֵמָה
  choice: क्रोध
  rationale: यह तीव्र रोष का बोध कराता है। स्रोत में यह स्पष्ट नहीं है कि क्रोध किसका है, इसलिए किसी व्यक्ति या परमेश्वर को इसका कर्ता नहीं बनाया गया।
- source_word: פֶּן
  choice: सावधान रहो, कहीं ... न
  rationale: यह किसी संभावित बुरे परिणाम के विरुद्ध चेतावनी देता है; यह हिंदी संरचना उसके निषेधात्मक और सावधान करने वाले बल को सहज रूप में रखती है।
- source_word: יְסִיתְךָ
  choice: वह तुम्हें ... करने के लिए न उकसाए
  rationale: सोत धातु का हिफ़ील रूप उकसाने, फुसलाने या भटका देने का अर्थ दे सकता है। ‘उकसाए’ यहाँ क्रोध की सक्रिय प्रेरणा को स्पष्ट रखता है।
- source_word: בְסָפֶק
  choice: उपहास करने के लिए
  rationale: यह दुर्लभ और विवादित पद संभवतः हाथ मारने या ताली बजाने से जुड़े उपहासपूर्ण हाव-भाव का संकेत देता है। मुख्य पाठ में प्रसंगानुकूल अर्थ रखा गया है और अधिक शाब्दिक संभावना पादटिप्पणी में दी गई है।
- source_word: רָב כֹּפֶר
  choice: बड़ी छुड़ौती
  rationale: רָב को כֹּפֶר का विशेषण मानते हुए यह स्वाभाविक हिंदी अभिव्यक्ति है। ‘छुड़ौती’ मूल्य देकर दुष्परिणाम टालने के मूल भाव को रखती है, जबकि ‘रिश्वत’ से अर्थ अनावश्यक रूप से संकुचित हो जाता।
- source_word: אַל יַטֶּךָּ
  choice: तुम्हें भटका न दे
  rationale: नटा धातु दिशा से मोड़ने या झुका देने का बोध देती है। ‘भटका न दे’ सही मार्ग से हटने के रूपक को सहज हिंदी में व्यक्त करता है।
theological_decisions:
- issue: ‘क्रोध’ का संदर्भ
  choice: ‘क्रोध’ को बिना किसी स्वामी या कर्ता के रखा गया है।
  alternative: ‘परमेश्वर का क्रोध’ अथवा ‘तुम्हारा क्रोध’
  rationale: इब्रानी पाठ क्रोध के संदर्भ को स्पष्ट नहीं करता; किसी एक विकल्प को मुख्य पाठ में रखने से वास्तविक धर्मवैचारिक अस्पष्टता समाप्त हो जाती।
- issue: כֹּפֶר का आशय
  choice: छुड़ौती
  alternative: प्रायश्चित-मूल्य अथवा रिश्वत
  rationale: इस शब्द का अर्थ-क्षेत्र मूल्य देकर मुक्ति या दंड से बचाव से लेकर कुछ प्रसंगों में रिश्वत तक फैला है। ‘छुड़ौती’ सबसे कम संकीर्ण विकल्प है; अन्य संभावनाएँ पादटिप्पणी में सुरक्षित हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। वाक्य की आरंभिक खंडित-सी चेतावनी—‘क्योंकि क्रोध है—सावधान रहो’—मूल की तनावपूर्ण संरचना और ‘क्रोध’ के अस्पष्ट संदर्भ को बनाए रखती है।
