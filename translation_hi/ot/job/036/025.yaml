  text: כָּל אָדָ֥ם חָֽזוּ ב֑/וֹ אֱ֝נ֗וֹשׁ יַבִּ֥יט מֵ/רָחֽוֹק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/025.yaml
  text: All mankind has looked on it[b][a]; man gazes from afar.
translation:
  language: hi
  text: हर मनुष्य ने उसे देखा है[a]; नश्वर मनुष्य उसे दूर से निहारता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उसे’ से आशय संभवतः पिछले पद में बताए गए परमेश्वर के कार्य से है; हिब्रू सर्वनाम का अर्थ स्वयं परमेश्वर भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל אָדָם
  choice: हर मनुष्य
  rationale: यह पदबंध समस्त मानवजाति को समावेशी और सामान्य अर्थ में व्यक्त करता है; आधुनिक हिन्दी में ‘हर मनुष्य’ स्वाभाविक और स्पष्ट है।
- source_word: חָזוּ
  choice: देखा है
  rationale: חזה यहाँ देखने या अवलोकन करने का भाव रखता है। ‘देखा है’ पूर्ण क्रिया के बल को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בּוֹ
  choice: उसे
  rationale: हिब्रू में सर्वनाम पुल्लिंग एकवचन है। हिन्दी का ‘उसे’ व्याकरणिक रूप को बनाए रखते हुए उसके संभावित संदर्भ—परमेश्वर के कार्य अथवा स्वयं परमेश्वर—को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: אֱנוֹשׁ
  choice: नश्वर मनुष्य
  rationale: אֱנוֹשׁ मानव होने के साथ नश्वरता और दुर्बलता की छाया भी रखता है; ‘नश्वर मनुष्य’ इस अर्थभेद को स्पष्ट करता है।
- source_word: יַבִּיט
  choice: निहारता है
  rationale: नבט का हिफ़ील रूप ध्यान से या लगातार देखने का भाव दे सकता है। ‘निहारता है’ काव्यात्मक गरिमा और अवलोकन की अवधि दोनों को व्यक्त करता है।
- source_word: מֵרָחוֹק
  choice: दूर से
  rationale: यह दूरी से देखने का सीधा और स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: בּוֹ के संदर्भ का निर्धारण
  choice: मुख्य पाठ में संदर्भ को ‘उसे’ द्वारा खुला रखा गया है; निकट संदर्भ में यह परमेश्वर के कार्य की ओर संकेत कर सकता है।
  alternative: इसे व्यक्तिगत अर्थ में ‘उसे’, अर्थात स्वयं परमेश्वर, समझना।
  rationale: सर्वनाम पुल्लिंग एकवचन है और दोनों अर्थ व्याकरणतः संभव हैं। पिछले पद में परमेश्वर के ‘कार्य’ का उल्लेख होने के कारण वह निकटतम संभावित संदर्भ है, पर अनुवाद में वास्तविक अस्पष्टता को समाप्त नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘नश्वर मनुष्य’ काव्यात्मक समानांतरता में אֱנוֹשׁ की नश्वरता-संबंधी अर्थछाया को सामने लाता है।
