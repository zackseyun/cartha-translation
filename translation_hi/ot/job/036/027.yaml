  yaml_path: translation/ot/job/036/027.yaml
  text: For he draws up the drops of water[a]; they distill rain from his mist.
translation:
  language: hi
  text: क्योंकि वह जल की बूँदों को ऊपर खींचता है[a]; वे उसकी धुंध से वर्षा के रूप में टपकती हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह जल की बूँदों को हटा लेता है; वे उसकी वाष्प से वर्षा बरसाती हैं।” दूसरी पंक्ति का इब्रानी पाठ कठिन है; “धुंध” का अनुवाद “वाष्प” भी हो सकता है।
    reason: इब्रानी क्रियाओं और לְאֵדוֹ के संबंध में वास्तविक शाब्दिक तथा वाक्यगत अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह आसपास के संदर्भ में परमेश्वर की महानता का कारण या स्पष्टीकरण प्रस्तुत करता है।
- source_word: יְגָרַע
  choice: ऊपर खींचता है
  rationale: क्रिया का मूल अर्थ घटाना, हटा लेना या वापस लेना हो सकता है; यहाँ मौसम-संबंधी संदर्भ में जल की बूँदों को ऊपर लेने का भाव स्वाभाविक है।
- source_word: נִטְפֵי מָיִם
  choice: जल की बूँदों
  rationale: यह रचना का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: יָזֹקּוּ
  choice: टपकती हैं
  rationale: क्रिया छानने, निथारने या बहाने का भाव दे सकती है; वर्षा के संदर्भ में ‘टपकती हैं’ काव्यात्मक चित्र को बनाए रखता है और अत्यधिक वैज्ञानिक व्याख्या से बचता है।
- source_word: מָטָר
  choice: वर्षा
  rationale: यह संज्ञा का मानक, गरिमापूर्ण और सहज हिन्दी पर्याय है।
- source_word: לְאֵדוֹ
  choice: उसकी धुंध से
  rationale: אֵד का अर्थ धुंध या वाष्प हो सकता है। उपसर्ग לְ का संबंध यहाँ कठिन है; ‘से’ स्रोत-संबंधी अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है, और एकवचन पुल्लिंग प्रत्यय को ‘उसकी’ के रूप में सुरक्षित रखता है।
theological_decisions:
- issue: לְאֵדוֹ में तृतीय पुरुष पुल्लिंग एकवचन प्रत्यय का संदर्भ
  choice: ‘उसकी धुंध’—प्रत्यय का संदर्भ परमेश्वर है।
  alternative: ‘उस धुंध/वाष्प से’ जैसा निर्वैयक्तिक अर्थ, अथवा पाठ-संशोधन द्वारा बहुवचन संदर्भ।
  rationale: एलीहू के भाषण में निकटवर्ती कर्ता परमेश्वर है और सृष्टि पर उसका शासन विषय बना हुआ है। एकवचन प्रत्यय को बनाए रखना पाठ के धर्मवैचारिक बल को सुरक्षित रखता है, बिना अतिरिक्त दावा जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण काव्यात्मक गद्य। ‘जल’ और ‘वर्षा’ औपचारिक किंतु सामान्यतः समझे जाने वाले शब्द हैं। मुख्य पाठ पठनीय रखा गया है, जबकि कठिन इब्रानी के वैकल्पिक अर्थ को पादटिप्पणी में दिया गया है।
