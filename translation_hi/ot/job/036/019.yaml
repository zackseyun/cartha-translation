    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיַעֲרֹךְ
  choice: क्या ... कुछ काम आएगी
  rationale: ערך का मूल अर्थ ‘क्रम में लगाना/व्यवस्थित करना’ है, पर इस कठिन काव्यात्मक संदर्भ में इसे मुहावरेदार ढंग से ‘लाभ पहुँचाना, काम आना, पर्याप्त होना’ समझना प्रश्न का आशय स्पष्ट करता है।
- source_word: שׁוּעֲךָ
  choice: तुम्हारी पुकार
  rationale: मसोरेटिक स्वरांकन इसे שׁוע, अर्थात सहायता के लिए पुकार, से जोड़ता है। ‘धन-संपत्ति’ की व्याख्या संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: לֹא בְצָר
  choice: संकट के समय
  rationale: इब्रानी पदबंध अत्यंत कठिन है। यहाँ संदर्भगत भाव को स्वाभाविक हिन्दी में व्यक्त किया गया है; לֹא के अधिक शाब्दिक निषेधात्मक अर्थ पर आधारित वैकल्पिक व्याख्या पादटिप्पणी में सुरक्षित है।
- source_word: וְכֹל
  choice: या ... सारे
  rationale: संयोजक וְ का मूल अर्थ ‘और’ है, किंतु इस अलंकारिक प्रश्न में यह दूसरे संभावित साधन को जोड़ता है; हिन्दी में ‘या’ इस संबंध को सहजता से व्यक्त करता है।
- source_word: מַאֲמַצֵּי כֹחַ
  choice: तुम्हारी शक्ति के सारे प्रयास
  rationale: यह पदबंध प्रयास/तनाव और शक्ति—दोनों तत्वों को समेटता है। प्रत्यक्ष संबोधन और समानांतरता के आधार पर ‘तुम्हारी’ रखा गया है।
