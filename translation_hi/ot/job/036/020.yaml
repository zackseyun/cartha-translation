  choice: लालसा मत कर
  rationale: אַל के साथ अपूर्ण क्रिया निषेध व्यक्त करती है; שׁאף यहाँ किसी बात के लिए तीव्र इच्छा या लालसा रखने के अर्थ में है।
- source_word: הַלָּיְלָה
  choice: रात
  rationale: निश्चित संज्ञा का स्वाभाविक और सीधा हिन्दी रूप।
- source_word: לַעֲלוֹת
  choice: जब ... उठा लिया जाता है
  rationale: עלה के infinitive construct का यहाँ अर्थ कठिन है। प्रसंग में इसे लोगों के हटा दिए जाने या उठा लिए जाने के अर्थ में समझना संभव है; कालसूचक उपवाक्य हिन्दी में स्वाभाविक है।
- source_word: עַמִּים
  choice: लोगों
  rationale: बहुवचन עַמִּים सामूहिक जनसमूहों या जातियों को सूचित करता है। यहाँ 'लोगों' सहज हिन्दी है और बहुवचन सामूहिकता बनाए रखता है।
- source_word: תַּחְתָּם
  choice: उनके स्थान से
  rationale: शाब्दिक अर्थ 'उनके नीचे से' है, पर इस कठिन वाक्य में इसे अपने स्थान या स्थिति से हटाए जाने के रूप में समझा जाता है।
