  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הֶן אֵ֣ל שַׂ֭גִּיא וְ/לֹ֣א נֵדָ֑ע מִסְפַּ֖ר שָׁנָ֣י/ו וְ/לֹא חֵֽקֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/026.yaml
  text: Behold[a], God is great, and we do not know him[b]; the number of his years is unsearchable.
translation:
  language: hi
  text: देखो, परमेश्वर महान है, और हम उसे नहीं जानते[a]; उसके वर्षों की संख्या की थाह नहीं पाई जा सकती[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, ‘और हम नहीं जानते।’ मूल पाठ में ‘उसे’ नहीं लिखा है, पर संदर्भ से वह निहित है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘उसके वर्षों की संख्या का कोई पता नहीं लगाया जा सकता।’
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: देखो
  rationale: यह शब्द आगे कही जाने वाली बात की ओर ध्यान खींचते हुए उस पर बल देता है। ‘देखो’ काव्यात्मक गरिमा और संबोधन की शक्ति बनाए रखता है।
- source_word: אֵל
  choice: परमेश्वर
  rationale: यहाँ אֵל परमेश्वर के लिए प्रयुक्त सामान्य काव्यात्मक पद है; ‘परमेश्वर’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: שַׂגִּיא
  choice: महान
  rationale: यह विशेषण महानता, ऊँचाई और अतुलनीय महिमा का व्यापक भाव व्यक्त करता है; ‘महान’ अनावश्यक अर्थ-विस्तार किए बिना इसे सुरक्षित रखता है।
- source_word: וְלֹא נֵדָע
  choice: और हम उसे नहीं जानते
  rationale: इब्रानी में शाब्दिक रूप से ‘और हम नहीं जानते’ है; निकट संदर्भ में परमेश्वर कर्म के रूप में निहित है। हिन्दी में ‘उसे’ जोड़ने से वाक्य स्वाभाविक बनता है, जबकि जानने की सीमा संबंधी मूल कथन बना रहता है।
- source_word: מִסְפַּר
  choice: संख्या
  rationale: यह रचना-संबंधी संज्ञा का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: שָׁנָיו
  choice: उसके वर्षों
  rationale: ‘वर्षों’ मूल के काव्यात्मक और मानवरूपी कथन को बनाए रखता है; इसे ‘अनन्तता’ जैसे व्यवस्थित धर्मवैज्ञानिक शब्द में नहीं बदला गया।
- source_word: וְלֹא חֵקֶר
  choice: की थाह नहीं पाई जा सकती
  rationale: शाब्दिक भाव ‘और कोई खोज/जाँच नहीं’ है। ‘थाह नहीं पाई जा सकती’ स्वाभाविक हिन्दी में अगम्यता और मानव जाँच की सीमा दोनों व्यक्त करता है।
theological_decisions:
- issue: וְלֹא נֵדָע में निहित कर्म
  choice: हिन्दी में ‘उसे’ जोड़कर ‘हम उसे नहीं जानते’
  alternative: कर्म को अनकहा छोड़कर ‘हम नहीं जानते’
  rationale: मूल पाठ कर्म को स्पष्ट नहीं करता, पर तत्काल संदर्भ परमेश्वर की ओर संकेत करता है। ‘उसे’ न्यूनतम संदर्भगत पूर्ति है; फिर भी पादटिप्पणी में शाब्दिक अस्पष्टता बताई गई है।
- issue: परमेश्वर के ‘वर्षों’ का अर्थ
  choice: मूल काव्यात्मक अभिव्यक्ति ‘उसके वर्षों’ को बनाए रखना
  alternative: इसे व्याख्यात्मक रूप से ‘उसकी अनन्तता’ या ‘उसका जीवनकाल’ कहना
  rationale: मूल पद परमेश्वर की अवधि को वर्षों के रूप में चित्रित करता है। इसे सीधे रखने से काव्यात्मक मानवरूपता और धर्मवैज्ञानिक तनाव सुरक्षित रहते हैं।
- issue: וְלֹא חֵקֶר की संरचना
  choice: ‘की थाह नहीं पाई जा सकती’
  alternative: अधिक शाब्दिक ‘उसके वर्षों की संख्या की कोई खोज नहीं’
  rationale: चुना हुआ रूप हिन्दी में स्पष्ट और स्वाभाविक है तथा इस बात को सुरक्षित रखता है कि परमेश्वर के वर्षों की संख्या मानवीय खोज और समझ से परे है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर अय्यूब की ज्ञान-काव्य शैली के अनुरूप गरिमापूर्ण रखी गई है। ‘देखो’ काव्यात्मक बल देता है; ‘थाह नहीं पाई जा सकती’ सामान्य पाठक के लिए बोधगम्य रहते हुए मूल की अगम्यता व्यक्त करता है।
