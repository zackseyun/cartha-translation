  - marker: b
    text: या, “दीनों को”; इब्रानी शब्द निर्धन, दीन, पीड़ित या सताए हुए लोगों को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְחַיֶּה
  choice: जीवित रखता
  rationale: पिएल रूप यहाँ किसी को जीवन देने या पुनर्जीवित करने के बजाय उसका जीवन बनाए रखने के अर्थ में अधिक स्वाभाविक है।
- source_word: רָשָׁע
  choice: दुष्ट
  rationale: एकवचन रूप यहाँ सामान्य अथवा प्रतिनिधिक अर्थ रखता है; हिन्दी में ‘दुष्ट’ इसे सहज रूप से व्यक्त करता है।
- source_word: מִשְׁפָּט
  choice: न्याय
  rationale: यहाँ शब्द न्यायिक निर्णय मात्र नहीं, बल्कि पीड़ितों को मिलने वाले उचित न्याय या अधिकार का संकेत देता है।
- source_word: עֲנִיִּים
  choice: पीड़ितों
  rationale: यह शब्द निर्धन, दीन, सताए हुए या दबे-कुचले लोगों को सूचित कर सकता है; ‘पीड़ितों’ से इसकी व्यापकता बनी रहती है।
- source_word: יִתֵּן
  choice: दिलाता है
  rationale: शाब्दिक अर्थ ‘देता है’ है, पर आधुनिक हिन्दी में ‘न्याय दिलाता है’ अपेक्षाकृत स्वाभाविक है और न्याय प्रदान करने का आशय स्पष्ट रखता है।
- source_word: וּ
  choice: बल्कि
  rationale: मूल संयोजक सामान्यतः ‘और’ है, पर यहाँ दोनों पंक्तियों के बीच स्पष्ट विरोध है; हिन्दी में ‘बल्कि’ इस संबंध को सहजता से व्यक्त करता है।
theological_decisions:
- issue: क्या יְחַיֶּה को पुनर्जीवन अथवा धर्मवैज्ञानिक अर्थ में जीवन देने के रूप में अनूदित किया जाए
  choice: जीवित नहीं रखता
  alternative: जीवन नहीं देता / जिलाता नहीं
  rationale: संदर्भ वर्तमान न्यायपूर्ण शासन का है—परमेश्वर दुष्ट का जीवन बनाए नहीं रखता और पीड़ितों को न्याय दिलाता है। पुनरुत्थान का अर्थ जोड़ना मूल पाठ से अधिक कहना होगा।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण काव्यात्मक गद्य। ‘न्याय दिलाता है’ स्वाभाविक हिन्दी के लिए चुना गया है; पद की समानांतरता और दुष्टों तथा पीड़ितों के बीच विरोध सुरक्षित है।
