  text: वह दुष्ट को जीवित नहीं रखता[a], बल्कि पीड़ितों[b] को न्याय देता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दुष्ट को जीने नहीं देता।”
