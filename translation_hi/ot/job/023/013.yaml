base_translation:
  language: en
  yaml_path: translation/ot/job/023/013.yaml
  text: But he is one[a], and who can turn him back? What his soul desires[b], that he does.
translation:
  language: hi
  text: परन्तु वह एक है[a]; कौन उसे लौटा सकता है? उसका मन जो चाहता है[b], वही वह करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “परन्तु वह एक है।” सम्भवतः इसका अर्थ है कि वह एक ही मन का है या अपने उद्देश्य में नहीं बदलता।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक रूप से, “उसका प्राण जो चाहता है।” यहाँ “प्राण” स्वयं व्यक्ति की इच्छा के लिए प्रयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: परन्तु वह
  rationale: स्वतंत्र सर्वनाम और प्रसंग के विरोधात्मक संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְאֶחָד
  choice: अपने निश्चय पर अटल है
  rationale: शाब्दिक रूप से पदबंध ‘एक में/एक’ है, पर प्रसंग में एकनिष्ठ और अपरिवर्तनीय उद्देश्य का भाव है। मुख्य पाठ अर्थ को स्पष्ट करता है, जबकि पादटिप्पणी शाब्दिक अस्पष्टता सुरक्षित रखती है।
- source_word: וּמִי יְשִׁיבֶנּוּ
  choice: कौन उसे लौटा सकता है?
  rationale: שׁוב का हिफ़ील रूप यहाँ किसी को उसके मार्ग या संकल्प से वापस मोड़ने का बिंब देता है।
- source_word: וְנַפְשׁוֹ
  choice: उसका मन
  rationale: נֶפֶשׁ यहाँ व्यक्ति की अपनी इच्छा या अभिलाषा को सूचित करता है; ‘मन’ आधुनिक हिन्दी में इस प्रयोग को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אִוְּתָה
  choice: जो चाहता है
  rationale: क्रिया इच्छा या चाह व्यक्त करती है; ‘चाहता है’ व्यापक और सहज हिन्दी है।
- source_word: וַיָּעַשׂ
  choice: वही वह करता है
  rationale: सामान्य क्रिया עשה के ‘करना’ अर्थ और इब्रानी वाक्य की बलाघाती संरचना को बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के स्थिर उद्देश्य का कथन
  choice: वह अपने निश्चय पर अटल है
  alternative: वह एक है / वह एक ही मन का है
  rationale: इब्रानी בְאֶחָד का शाब्दिक रूप अस्पष्ट है। प्रसंग में अटल, एकनिष्ठ उद्देश्य प्रमुख है; फिर भी ‘एक’ वाले शाब्दिक पाठ को पादटिप्पणी में रखकर वास्तविक भाषिक और धर्मवैचारिक तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। ‘अपने निश्चय पर अटल’ प्रसंगगत अर्थ देता है; पादटिप्पणियाँ इब्रानी की शाब्दिक बनावट और अस्पष्टता को सुरक्षित रखती हैं।
