  text: מִֽי יִתֵּ֣ן יָ֭דַעְתִּי וְ/אֶמְצָאֵ֑/הוּ אָ֝ב֗וֹא עַד תְּכוּנָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/003.yaml
  text: Oh[a], that I knew where I might find him, that I might come to his dwelling place.
translation:
  language: hi
  text: काश, मैं जानता कि उसे कहाँ पाऊँ; तब मैं उसके निवास-स्थान[a] तक पहुँच जाता!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके स्थान।” इब्रानी शब्द किसी स्थिर या निर्धारित स्थान को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: काश
  rationale: यह इब्रानी मुहावरा किसी देने वाले के विषय में शाब्दिक प्रश्न नहीं, बल्कि तीव्र अभिलाषा व्यक्त करता है; आधुनिक हिन्दी में ‘काश’ उसका स्वाभाविक समतुल्य है।
- source_word: יָדַעְתִּי
  choice: मैं जानता
  rationale: रूपतः यह पूर्णकाल प्रथम पुरुष एकवचन है, पर कामनासूचक रचना में वांछित अवस्था व्यक्त करता है। ‘मैं जानता’ को ‘काश’ के साथ रखने से यह अर्थ स्पष्ट रहता है।
- source_word: וְאֶמְצָאֵהוּ
  choice: कि उसे कहाँ पाऊँ
  rationale: अपूर्ण क्रिया कामना की धारा को आगे बढ़ाती है। हिन्दी में स्थानवाचक आशय स्पष्ट करने के लिए ‘कहाँ’ स्वाभाविक रूप से निहित किया गया है; कर्मप्रत्यय का अनुवाद ‘उसे’ है और संदर्भ में उसका संकेत परमेश्वर की ओर है।
- source_word: אָבוֹא
  choice: तब मैं ... पहुँच जाता
  rationale: प्रथम पुरुष अपूर्ण क्रिया अय्यूब की कल्पित परिणति या अभिलाषा व्यक्त करती है। ‘पहुँच जाता’ गंतव्य के साथ आधुनिक हिन्दी में स्वाभाविक है और इसे वास्तविक घटित घटना नहीं बनाता।
- source_word: עַד
  choice: तक
  rationale: यह गंतव्य की सीमा तक आने का अर्थ रखता है; ‘तक’ उसके मूल स्थानिक बल को ‘को’ की अपेक्षा अधिक स्पष्ट रूप से सुरक्षित रखता है।
- source_word: תְּכוּנָתוֹ
  choice: उसके निवास-स्थान
  rationale: संज्ञा किसी स्थिर या स्थापित स्थान को सूचित कर सकती है। संदर्भ में ‘निवास-स्थान’ उस जगह का अर्थ सामने लाता है जहाँ परमेश्वर मिल सकता है, जबकि पादटिप्पणी कम व्याख्यात्मक विकल्प देती है।
theological_decisions:
- issue: तीसरे पुरुष पुल्लिंग एकवचन प्रत्ययों (‘उसे,’ ‘उसके’) का संदर्भ
  choice: संदर्भ में परमेश्वर निहित संदर्भ है, पर पद में नाम जोड़कर स्पष्ट नहीं किया गया।
  alternative: ‘परमेश्वर को’ और ‘परमेश्वर के निवास-स्थान’ कहना।
  rationale: आस-पास के प्रसंग में अय्यूब परमेश्वर के सामने अपना मुकदमा रखना चाहता है। फिर भी मूल पद केवल सर्वनामिक प्रत्यय रखता है, इसलिए अनुवाद भी उस अप्रत्यक्षता को बनाए रखता है।
- issue: תְּכוּנָתוֹ का न्यायिक या निवासगत अर्थ
  choice: मुख्य पाठ में ‘निवास-स्थान’।
  alternative: ‘उसका स्थान’ या न्यायासन-सदृश अर्थ।
  rationale: शब्द मूलतः स्थिर/स्थापित स्थान बता सकता है। प्रसंग में न्यायिक भेंट की छाया संभव है, पर ‘न्यायासन’ कहना मूल से अधिक विशिष्ट होगा; इसलिए स्थानगत अर्थ चुना गया और व्यापक विकल्प पादटिप्पणी में रखा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज हिन्दी रखी गई है। ‘काश’ तीव्र लालसा व्यक्त करता है; अर्धविराम दोनों कामनासूचक चरणों को जोड़ता है। ‘निवास-स्थान’ सामान्य पाठक के लिए स्पष्ट है, जबकि पादटिप्पणी इब्रानी की व्यापक स्थानगत संभावना सुरक्षित रखती है।
