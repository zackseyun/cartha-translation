  text: שְׂמֹ֣אול בַּ/עֲשֹׂת֣/וֹ וְ/לֹא אָ֑חַז יַעְטֹ֥ף יָ֝מִ֗ין וְ/לֹ֣א אֶרְאֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/009.yaml
  text: On the left[a], when he is at work, I do not perceive him; he turns to the right[b], and I do not see him.
translation:
  language: hi
  text: बाईं ओर[b], जब वह कार्य करता है, तब मैं उसे पकड़ नहीं पाता; वह दाईं ओर अपने को ढाँप लेता है[a], और मैं उसे देख नहीं पाता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह दाईं ओर मुड़ जाता है।” इब्रानी क्रिया का मूल भाव ‘लपेटना’ या ‘ढकना’ है; इस कठिन पंक्ति में इसे ‘मुड़ना’ भी समझा जाता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में यहाँ “बाईं ओर” और आगे “दाईं ओर” है। इन दिशाओं से कभी-कभी क्रमशः उत्तर और दक्षिण भी अभिप्रेत हो सकते हैं, पर यहाँ काव्यात्मक स्थान-विरोध को ज्यों का त्यों रखा गया है।
    reason: cultural_note
lexical_decisions:
- source_word: שְׂמֹאול
  choice: बाईं ओर
  rationale: मूल अर्थ ‘बाईं ओर’ है और यहाँ יָמִין (‘दाईं ओर’) के साथ स्थान-संबंधी काव्यात्मक विरोध बनाता है; इसलिए ‘उत्तर’ नहीं किया गया।
- source_word: בַּעֲשֹׂתוֹ
  choice: जब वह काम करता है
  rationale: 'בְּ के साथ עשה का infinitive construct और 3ms प्रत्यय स्वाभाविक रूप से कालवाचक अर्थ देता है: ‘जब वह करता/कार्य करता है।’'
- source_word: אָחַז
  choice: मैं उसे समझ नहीं पाता
  rationale: אָחַז का मूल अर्थ ‘पकड़ना, थामना’ है, पर यहाँ परमेश्वर को खोजते हुए उसे ग्रहण या पहचान न पाने का भाव है। हिंदी में ‘समझ नहीं पाता’ मानसिक रूप से ग्रहण न कर पाने का अर्थ स्वाभाविक रूप से देता है, यद्यपि मूल क्रिया की ठोस छवि कुछ मंद पड़ती है।
- source_word: יַעְטֹף
  choice: वह अपने को छिपा लेता है
  rationale: עטף का मूल भाव लपेटने या ढकने का है। इस कठिन पंक्ति में ‘अपने को छिपा लेता है’ अदृश्य रहने का संदर्भ स्पष्ट करता है और ‘मुड़ता है’ जैसे अधिक व्याख्यात्मक पाठ से बचता है; वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: יָמִין
  choice: दाईं ओर
  rationale: यह שְׂמֹאול के समानांतर शरीर-सापेक्ष दिशा है; ‘दक्षिण’ संभव विस्तार है, पर ‘बाईं ओर—दाईं ओर’ मूल काव्यात्मक विरोध को सुरक्षित रखता है।
- source_word: אֶרְאֶה
  choice: मैं उसे देख नहीं पाता
  rationale: ראה का सीधा अर्थ ‘देखना’ है। हिंदी में कर्म ‘उसे’ निकटवर्ती संदर्भ से स्पष्ट रूप से जोड़ा गया है।
theological_decisions:
- issue: तीसरे पुरुष के क्रिया-रूपों और निहित कर्म का संदर्भ
  choice: ‘वह/उसे’ से परमेश्वर अभिप्रेत है, पर पद में उसका नाम नहीं जोड़ा गया।
  alternative: पद को किसी अनिर्दिष्ट ‘वह’ के रूप में पढ़ना।
  rationale: अय्यूब 23:8–10 का निकट संदर्भ स्पष्ट करता है कि अय्यूब परमेश्वर को खोज रहा है। सर्वनाम बनाए रखने से संदर्भ स्पष्ट रहता है और मूल पद से अधिक स्पष्ट नाम नहीं जोड़ा जाता।
- issue: יַעְטֹף की कठिन और अस्पष्ट क्रिया
  choice: अपने को छिपा लेता है
  alternative: दाईं ओर मुड़ता है; अपने को दाईं ओर ढक लेता है
  rationale: अनुवाद עטף के ‘ढकने/लपेटने’ वाले मूल भाव और न देख पाने के समानांतर को प्राथमिकता देता है, जबकि ‘मुड़ने’ की प्रचलित व्याख्या को पादटिप्पणी में सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज, गंभीर और काव्यात्मक गद्य रखा गया है। ‘बाईं ओर—दाईं ओर’ की समानांतर रचना और ‘समझ नहीं पाता—देख नहीं पाता’ की अनुभूति-संबंधी समानता सुरक्षित है। कठिन इब्रानी יַעְטֹף को मुख्य पाठ में अत्यधिक निश्चित किए बिना संदर्भानुकूल रूप दिया गया और वास्तविक वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
