  yaml_path: translation/ot/job/023/010.yaml
  text: But he knows the way with me[a]; when he has tested me[b], I will come out like gold.
translation:
  language: hi
  text: पर वह मेरा मार्ग जानता है[a]; जब वह मुझे परख लेगा[b], तब मैं सोने के समान निकलूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि वह मेरा मार्ग जानता है।” शाब्दिक रूप से, “वह उस मार्ग को जानता है जो मेरे साथ है”; इब्रानी वाक्यांश को इस प्रकार भी समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “यदि वह मुझे परखे” अथवा “मुझे परखने के बाद।” इब्रानी क्रिया-रचना एक से अधिक कालगत अर्थ की सम्भावना रखती है।
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: पर
  rationale: सन्दर्भ में अय्यूब के परमेश्वर को न खोज पाने और परमेश्वर के उसे भली-भाँति जानने के बीच विरोध है; इसलिए यहाँ कारणसूचक अर्थ के बजाय विरोधसूचक ‘पर’ स्वाभाविक है।
- source_word: יָדַע
  choice: जानता है
  rationale: यह परमेश्वर के वर्तमान और पूर्ण ज्ञान को व्यक्त करता है।
- source_word: דֶּרֶךְ עִמָּדִי
  choice: मेरे साथ का मार्ग
  rationale: यह इब्रानी के असामान्य लेकिन अधिक शाब्दिक ‘मेरे साथ का मार्ग’ को बनाए रखता है और इसे चुपचाप ‘मेरा मार्ग’ में नहीं बदलता।
- source_word: בְּחָנַנִי
  choice: जब वह मुझे परख चुका होगा
  rationale: בחן का अर्थ जाँचना या परखना है और आगे आने वाला सोने का बिम्ब कसौटी/शोधन की धारणा से मेल खाता है। पूर्ण हो चुकी परीक्षा के बाद का परिणाम दिखाने के लिए यह काल-रचना चुनी गई है, जबकि अन्य सम्भव कालगत अर्थ पाद-टिप्पणी में रखे गए हैं।
- source_word: כַּזָּהָב
  choice: सोने के समान
  rationale: तुलनासूचक उपसर्ग כ को स्पष्ट और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है तथा मूल बिम्ब बनाए रखता है।
- source_word: אֵצֵא
  choice: निकलूँगा
  rationale: יצא के ‘बाहर निकलना/प्रकट होना’ अर्थ को परीक्षा और सोने के बिम्ब के सन्दर्भ में सीधे व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर की परीक्षा और अय्यूब के निर्दोष सिद्ध होने या शुद्ध होने का सम्बन्ध
  choice: सोने के बिम्ब को बिना व्याख्यात्मक विस्तार के बनाए रखा गया है।
  alternative: इसे मुख्यतः न्यायिक निर्दोषता सिद्ध होना या मुख्यतः नैतिक शुद्धीकरण मानना।
  rationale: मूल पद का परीक्षा और सोने का बिम्ब निर्दोष सिद्ध होने और शुद्ध होने—दोनों की ओर संकेत कर सकता है; अनुवाद किसी एक धार्मिक निष्कर्ष को आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली रखी गई है। ‘मेरे साथ का मार्ग’ जानबूझकर कुछ असामान्य रखा गया है, क्योंकि मूल इब्रानी भी असामान्य है; पाद-टिप्पणी सहज वैकल्पिक पाठ देती है।
