    text: या ‘उसकी उपस्थिति के कारण’; इब्रानी में शाब्दिक भाव ‘उसके मुख/उपस्थिति से’ है।
    reason: lexical_alternative
  - marker: b
    text: या ‘जब मैं सोच-विचार करता हूँ’ या ‘जब मैं मनन करता हूँ।’ इब्रानी में विचार के विषय का स्पष्ट उल्लेख नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: इसलिए
  rationale: यह पद पिछले कथन से निकला निष्कर्ष व्यक्त करता है; ‘इसलिए’ उसके तार्किक बल को सहज आधुनिक हिन्दी में रखता है।
- source_word: מִפָּנָיו
  choice: उसके सामने
  rationale: מִן के साथ פָּנִים यहाँ उसकी उपस्थिति या सम्मुख होने पर प्रतिक्रिया दर्शाता है। ‘उसके सामने’ मूल की ठोस छवि को बनाए रखते हुए स्वाभाविक हिन्दी है।
- source_word: אֶבָּהֵל
  choice: मैं घबरा उठता हूँ
  rationale: בהל का निफ़ाल रूप विचलित, आतंकित या घबरा जाने का प्रबल भाव रखता है। ‘घबरा उठता हूँ’ अचानक और तीव्र भय को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֶתְבּוֹנֵן
  choice: जब मैं इस पर मनन करता हूँ
  rationale: בין का यह आत्मवाचक रूप सोच-विचार या गहन मनन का भाव देता है। प्रसंग में विचार करने के फलस्वरूप भय उत्पन्न होता है; ‘इस पर’ हिन्दी में अपेक्षित कर्म को स्पष्ट करता है, पर किसी एक विशिष्ट विषय को नहीं ठहराता।
- source_word: וְאֶפְחַד
  choice: तो ... डर जाता हूँ
  rationale: פחד सीधे भय को व्यक्त करता है। ‘डर जाता हूँ’ विचार और भय के क्रम को सहज हिन्दी में सामने लाता है।
- source_word: מִמֶּנּוּ
  choice: उससे
  rationale: פחד के साथ מִן भय के स्रोत या विषय को बताता है; हिन्दी में ‘उससे डरना’ इसका सीधा और स्वाभाविक रूप है।
theological_decisions:
- issue: पुल्लिंग एकवचन प्रत्ययों का संदर्भ
  choice: ‘उसके/उससे’ रखा गया, जिसका संदर्भ प्रसंग में परमेश्वर है।
  alternative: पाठ में सीधे ‘परमेश्वर’ जोड़ना।
  rationale: इब्रानी में सर्वनाम-सूचक प्रत्यय हैं, कोई ईश्वरीय उपाधि नहीं। सर्वनाम बनाए रखने से मूल कथन-प्रवाह सुरक्षित रहता है और अनावश्यक स्पष्टता नहीं जोड़ी जाती।
- issue: परमेश्वर के प्रति अय्यूब की प्रतिक्रिया की तीव्रता
  choice: ‘घबरा उठता हूँ’ और ‘डर जाता हूँ’ जैसे स्पष्ट भय-सूचक शब्द रखे गए।
  alternative: भाव को केवल ‘व्याकुलता’, ‘श्रद्धा’ या ‘विस्मय’ के रूप में नरम करना।
  rationale: मूल पद वास्तविक भय और आतंक की तनावपूर्ण अनुभूति प्रस्तुत करता है; अनुवाद उसे धर्मवैचारिक रूप से हल्का या पुनर्परिभाषित नहीं करता।
- issue: אֶתְבּוֹנֵן का अव्यक्त विषय
  choice: ‘इस पर मनन करता हूँ’ कहकर विषय को व्यापक और प्रसंगाधीन रखा गया।
  alternative: ‘उसके विषय में सोचता हूँ’ कहकर परमेश्वर को स्पष्ट कर्म बनाना।
  rationale: इब्रानी क्रिया का कर्म यहाँ व्यक्त नहीं है। ‘इस पर’ हिन्दी में वाक्य को स्वाभाविक बनाता है, पर अस्पष्टता को पूरी तरह समाप्त नहीं करता।
