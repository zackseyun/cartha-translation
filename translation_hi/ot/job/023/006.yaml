  yaml_path: translation/ot/job/023/006.yaml
  text: Would he contend with me in the greatness of his power? No[a]; surely he would pay attention to me.
translation:
  language: hi
  text: क्या वह अपनी अपार शक्ति के बल पर मुझसे मुक़दमा लड़ेगा? नहीं; वह बस मुझ पर ध्यान देगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह अपना मन मुझ पर लगाएगा”; सम्भवतः, “वह मुझमें सामर्थ्य डालेगा।”
    reason: 'יָשִׂם בִּי के अर्थ में वास्तविक शाब्दिक अस्पष्टता है: यह ध्यान लगाने अथवा सामर्थ्य देने की ओर संकेत कर सकता है।'
lexical_decisions:
- source_word: הַבְּרָב כֹּחַ
  choice: अपनी अपार शक्ति के बल पर
  rationale: प्रश्नवाचक הֲ के साथ בְּרָב כֹּחַ परमेश्वर की शक्ति की प्रचुरता या महानता को व्यक्त करता है। यह अनुवाद उस प्रबल शक्ति को स्वाभाविक हिन्दी में रखता है जिसके आधार पर मुक़दमा लड़ने की आशंका अय्यूब नकारता है।
- source_word: יָרִיב עִמָּדִי
  choice: मुझसे मुक़दमा लड़ेगा
  rationale: ריב का अर्थ विवाद करना है, पर इस प्रसंग में न्यायिक भाव प्रमुख है, क्योंकि अय्यूब परमेश्वर के सामने अपना मामला रखना चाहता है। ‘मुक़दमा लड़ेगा’ इस कानूनी और प्रतिपक्षी भाव को सामान्य आधुनिक हिन्दी में व्यक्त करता है।
- source_word: לֹא אַךְ
  choice: नहीं; ... अवश्य
  rationale: यह पदबंध पहले प्रश्न का दृढ़ निषेध करता है और फिर आगे के कथन पर बल देता है। अर्धविराम दोनों गतियों को स्पष्ट रखता है।
- source_word: יָשִׂם בִּי
  choice: वह ... मुझ पर ध्यान देगा
  rationale: שׂים + ב का अर्थ किसी पर मन या ध्यान लगाना हो सकता है। न्यायिक प्रसंग में अय्यूब को विश्वास है कि परमेश्वर उसे केवल शक्ति से दबाएगा नहीं, बल्कि उसकी ओर ध्यान देगा। मूल अभिव्यक्ति की अन्य सम्भावना पादटिप्पणी में सुरक्षित रखी गई है।
theological_decisions:
- issue: दूसरे अर्धपद में परमेश्वर के कार्य का अर्थ
  choice: परमेश्वर अय्यूब पर ध्यान देगा और इस प्रकार उसे सुनवाई देगा।
  alternative: परमेश्वर अय्यूब में सामर्थ्य डालेगा; अथवा सामान्य अर्थ में अपना मन उस पर लगाएगा।
  rationale: 'निकटवर्ती प्रसंग न्यायालय-सदृश है: अय्यूब परमेश्वर के सामने अपना मामला प्रस्तुत करना चाहता है। इसलिए ध्यान देने का अर्थ यहाँ सबसे संगत है। फिर भी ‘मुझमें सामर्थ्य डालेगा’ की सम्भव व्याख्या को पादटिप्पणी में रखा गया है, ताकि पाठ की वास्तविक अस्पष्टता न मिटे।'
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी अपनाई गई है। न्यायिक प्रसंग को स्पष्ट करने के लिए ‘मुक़दमा लड़ेगा’ चुना गया है, जबकि दूसरे अर्धपद की अर्थगत अनिश्चितता पादटिप्पणी में सुरक्षित है।
