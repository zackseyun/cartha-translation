  text: I would lay out my case before him[b][a], and fill my mouth with arguments.
translation:
  language: hi
  text: मैं उसके सामने अपना मुकदमा व्यवस्थित रूप से प्रस्तुत करता,[a] और अपना मुँह दलीलों से भरता।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं उसके सामने अपना कानूनी मामला व्यवस्थित रूप से प्रस्तुत करता।” यहाँ इब्रानी शब्द מִשְׁפָּט का न्यायिक अर्थ है।
    reason: lexical_alternative
  - marker: b
    text: '“दलीलों” के लिए अन्य सम्भव अर्थ हैं: “उलाहने,” “प्रमाण,” या “विवादपूर्ण कथन।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶעֶרְכָה
  choice: क्रम से रखता
  rationale: ערך का मूल भाव व्यवस्थित करने या क्रम से सामने रखने का है। विधिक संदर्भ में यह अभिव्यक्ति मुकदमे की सुव्यवस्थित प्रस्तुति को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: לְפָנָיו
  choice: उसके सामने
  rationale: शाब्दिक भाव 'उसके मुख/उपस्थिति के सामने' है; 'उसके सामने' आधुनिक हिन्दी में स्वाभाविक है और न्यायिक तथा संबंधपरक दोनों संदर्भ बनाए रखता है।
- source_word: מִשְׁפָּט
  choice: अपना मुकदमा
  rationale: यहाँ מִשְׁפָּט सामान्य 'न्याय' या 'निर्णय' के बजाय प्रस्तुत किए जाने वाले विधिक मामले का बोध देता है। 'अपना' सन्दर्भ से निहित है, यद्यपि इब्रानी में स्पष्ट अधिकारवाचक सर्वनाम नहीं है।
- source_word: וּפִי
  choice: अपने मुँह को
  rationale: इब्रानी बिंब को सीधे रखा गया है, क्योंकि 'मुँह भरना' हिन्दी में भी समझ में आने वाला और प्रभावी रूपक है।
- source_word: אֲמַלֵּא
  choice: भर देता
  rationale: यह क्रिया पहले खंड के काल्पनिक/इच्छासूचक भाव को आगे बढ़ाती है और मूल के 'भरने' वाले बिंब को सुरक्षित रखती है।
- source_word: תוֹכָחוֹת
  choice: दलीलों
  rationale: इस बहुवचन संज्ञा में उलाहना, खंडन, प्रमाण अथवा विवादपूर्ण तर्क का अर्थ हो सकता है। न्यायालय-सदृश प्रसंग में 'दलीलें' विधिक तर्क को सबसे स्वाभाविक रूप से व्यक्त करती हैं, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित हैं।
theological_decisions:
- issue: परमेश्वर के सामने अय्यूब की वाणी में न्यायिक बिंब
  choice: मुकदमे और दलीलों की स्पष्ट न्यायिक भाषा बनाए रखना
  alternative: इसे सामान्य रूप से 'अपनी बात कहता' या 'अपनी शिकायतें सुनाता' कहना
  rationale: ערך, מִשְׁפָּט और תוֹכָחוֹת मिलकर सुव्यवस्थित विधिक प्रस्तुति का वातावरण बनाते हैं। अनुवाद अय्यूब की निर्भीकता को न तो अश्रद्धा में बदलता है, न उसे नरम करके छिपाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और न्यायिक बिंबयुक्त शैली। 'मुकदमा', 'क्रम से रखना' और 'दलीलें' साधारण पाठक के लिए स्पष्ट हैं। दोनों क्रियाओं में काल्पनिक भाव को हिन्दी के अपूर्ण भूत/शर्तसूचक विन्यास से व्यक्त किया गया है।
