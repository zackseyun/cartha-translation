base_translation:
  language: en
  yaml_path: translation/ot/job/023/002.yaml
  text: Even today my complaint is rebellious[b][a]; my hand is heavy because of my groaning.
translation:
  language: hi
  text: आज भी मेरी शिकायत विद्रोहपूर्ण है[a]; मेरी कराह के कारण मेरा हाथ भारी है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरी शिकायत कड़वी है।” कुछ व्याख्याकार संदर्भ के आधार पर हिब्रू शब्द का अर्थ नरम करके ऐसा समझते हैं, पर उसका अधिक सीधा अर्थ विद्रोह या अवज्ञा है।
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में शाब्दिक रूप से, “मेरा हाथ मेरी कराह पर भारी है।” कुछ लोग “हाथ” को दबे हुए या बोझिल ढंग से अपनी बात कहने का मुहावरा समझते हैं; अन्य लोग पाठ में संशोधन करके “उसका हाथ” पढ़ते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: גַּם הַיּוֹם
  choice: आज भी
  rationale: यह स्वाभाविक आधुनिक हिन्दी में वर्तमान दिन तक स्थिति बने रहने का बल प्रकट करता है।
- source_word: מְרִי
  choice: विद्रोहपूर्ण
  rationale: यह शब्द मूलतः विद्रोह या अवज्ञा का भाव रखता है। विशेषणात्मक अनुवाद हिन्दी में शिकायत के स्वरूप को स्वाभाविक ढंग से व्यक्त करते हुए उसकी तीखी धार बनाए रखता है।
- source_word: שִׂיחִי
  choice: मेरी शिकायत
  rationale: अय्यूब के विलाप और समानांतर ‘कराह’ के संदर्भ में यह उसके दुखभरे कथन या शिकायत को सूचित करता है।
- source_word: יָדִי
  choice: मेरा हाथ
  rationale: मसोराई पाठ में प्रथम पुरुष एकवचन प्रत्यय स्पष्ट है; इसलिए कठिन अभिव्यक्ति को बनाए रखते हुए ‘मेरा हाथ’ रखा गया है।
- source_word: כָּבְדָה
  choice: भारी है
  rationale: यह क्रिया भार या भारीपन की अवस्था बताती है; वर्तमानकालीन हिन्दी अभिव्यक्ति यहाँ उपयुक्त है।
- source_word: עַל
  choice: के कारण
  rationale: संदर्भ में हाथ के भारी होने और कराहने के बीच कारण-संबंध व्यक्त करना पठनीय है, जबकि अधिक शाब्दिक स्थान-संबंधी अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: אַנְחָתִי
  choice: मेरी कराह
  rationale: यह दुख से निकली आह या कराह को दर्शाता है; ‘कराह’ अय्यूब की पीड़ा की तीव्रता को उपयुक्त रूप से व्यक्त करती है।
theological_decisions:
- issue: क्या अय्यूब की शिकायत के वर्णन को नरम करके केवल ‘कड़वी’ कहा जाए
  choice: मुख्य पाठ में ‘विद्रोहपूर्ण’
  alternative: कड़वी
  rationale: मूल शब्द का सामान्य अर्थ विद्रोह या अवज्ञा है। इसे बनाए रखने से धर्मी पीड़ित अय्यूब के तीखे और लगभग चुनौतीपूर्ण कथन में निहित धार्मिक तनाव सुरक्षित रहता है।
- issue: ‘हाथ’ को प्रथम पुरुष में रखा जाए या पाठ-संशोधन द्वारा परमेश्वर का ‘उसका हाथ’ माना जाए
  choice: मसोराई पाठ के अनुसार ‘मेरा हाथ’
  alternative: उसका हाथ मुझ पर भारी है
  rationale: उपलब्ध हिब्रू पाठ प्रथम पुरुष ‘मेरा हाथ’ पढ़ता है। कठिनता को पाठ-संशोधन से चुपचाप दूर करना उचित नहीं; वैकल्पिक समझ पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘विद्रोहपूर्ण’ जानबूझकर तीखा है और मूल की धार्मिक जटिलता को नरम नहीं करता। दूसरी पंक्ति की कठिन हिब्रू छवि मुख्य पाठ में यथासंभव सुरक्षित है और उसकी अस्पष्टता पादटिप्पणी में स्पष्ट की गई है।
