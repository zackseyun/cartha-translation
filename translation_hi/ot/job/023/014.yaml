  yaml_path: translation/ot/job/023/014.yaml
  text: For he will complete what is appointed for me[a], and many such things are with him.
translation:
  language: hi
  text: क्योंकि वह जो मेरे लिए ठहराया गया है उसे पूरा करेगा[a], और ऐसी बहुत-सी बातें उसके पास हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘मेरा विधान,’ ‘मेरी विधि,’ अथवा ‘मेरे लिए ठहराया हुआ भाग।’ हिब्रू शब्द अय्यूब के लिए निर्धारित या निश्चित की गई बात को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יַשְׁלִים
  choice: पूरा करेगा
  rationale: हिफ़ील रूप किसी बात को पूर्णता तक पहुँचाने या पूरा कर देने का भाव देता है।
- source_word: חֻקִּי
  choice: मेरे लिए ठहराई हुई बात
  rationale: संदर्भ में यह अय्यूब के लिए निर्धारित या नियत बात को सूचित करता है। यह अनुवाद कानूनी अर्थ को अनावश्यक रूप से प्रमुख किए बिना मूल की व्यापकता बनाए रखता है।
- source_word: וְכָהֵנָּה רַבּוֹת
  choice: और ऐसी बहुत-सी बातें
  rationale: यह उसी प्रकार की अनेक अन्य बातों की ओर संकेत करता है और हिब्रू अभिव्यक्ति के संकेतार्थ को सहज हिन्दी में रखता है।
- source_word: עִמּוֹ
  choice: उसके पास हैं
  rationale: शाब्दिक रूप से ‘उसके साथ’ है; ‘उसके पास’ आधुनिक हिन्दी में स्वाभाविक है और परमेश्वर के विचार, अधिकार या सामर्थ्य में ऐसी अनेक बातें होने की व्यापकता को खुला रखता है।
theological_decisions:
- issue: क्या חֻקִּי को कानूनी अर्थ में ‘मेरी विधि/मेरे विषय की आज्ञा’ कहा जाए या अय्यूब के लिए परमेश्वर द्वारा निर्धारित बात के रूप में
  choice: मेरे लिए ठहराई हुई बात
  alternative: मेरी विधि; मेरा विधान; मेरे लिए ठहराया हुआ भाग
  rationale: निकटवर्ती संदर्भ अय्यूब के मार्ग और दशा के विषय में परमेश्वर के निश्चय पर केंद्रित है, अय्यूब द्वारा दिए गए किसी विधान पर नहीं। फिर भी पादटिप्पणी मूल शब्द के कानूनी और नियत-अंश संबंधी संभावित अर्थों को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘ठहराई हुई बात’ मूल की अर्थगत व्यापकता और संदर्भगत नियति—दोनों को बनाए रखती है।
