  yaml_path: translation/ot/job/023/012.yaml
  text: I have not turned aside from the command of his lips[a]; I have treasured the words of his mouth more than my allotted portion.
translation:
  language: hi
  text: मैं उसके होंठों की आज्ञा से नहीं हटा हूँ; मैंने उसके मुँह के वचनों को अपने नियत भाग से अधिक सँजोकर रखा है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'एक कठिन इब्रानी पद की पारंपरिक व्याख्या के अनुसार: “मैंने उसके मुँह के वचनों को अपने आवश्यक भोजन से अधिक सँजोकर रखा है।”'
    reason: alternative_reading
lexical_decisions:
- source_word: מִצְוַת
  choice: आज्ञा
  rationale: एकवचन संबंध-रूप है; ‘उसके होंठों की आज्ञा’ मूल की एकवचन शक्ति और आज्ञापरक अर्थ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: שְׂפָתָיו
  choice: उसके होंठों
  rationale: शाब्दिक बिंब को सुरक्षित रखता है और आगे ‘उसके मुँह’ के साथ काव्यात्मक समानांतरता बनाए रखता है; पुल्लिंग एकवचन प्रत्यय संदर्भ में परमेश्वर की ओर संकेत करता है।
- source_word: לֹא אָמִישׁ
  choice: मैं ... नहीं हटा
  rationale: मूल क्रिया का भाव किसी मार्ग या आज्ञा से न हटने का है। यह संक्षिप्त, स्वाभाविक हिन्दी है और पूर्ण निष्ठा का भाव व्यक्त करता है।
- source_word: מֵחֻקִּי
  choice: अपने ठहराए हुए भाग से अधिक
  rationale: दुर्बोध इब्रानी पद को तुलनात्मक अर्थ में लिया गया है। ‘ठहराया हुआ भाग’ प्राप्त या नियत हिस्से का अर्थ देता है, पर उसे स्पष्ट रूप से भोजन बनाकर अस्पष्टता को समाप्त नहीं करता।
- source_word: צָפַנְתִּי
  choice: मैंने ... सँजोकर रखा है
  rationale: क्रिया के ‘छिपाकर/संचित करके रखना’ और मूल्यवान मानने—दोनों भावों को सहज आधुनिक हिन्दी में समेटता है।
- source_word: אִמְרֵי
  choice: वचनों
  rationale: बहुवचन संबंध-रूप का स्वाभाविक और गरिमापूर्ण हिन्दी पर्याय है, जो ईश्वरीय कथनों के संदर्भ में उपयुक्त है।
- source_word: פִיו
  choice: उसके मुँह
  rationale: मूल के ठोस काव्यात्मक बिंब और ‘होंठों’ के साथ समानांतरता को बनाए रखता है।
theological_decisions:
- issue: ‘उसके होंठों’ और ‘उसके मुँह’ में पुल्लिंग एकवचन प्रत्यय का संदर्भ
  choice: प्रत्यय परमेश्वर की ओर संकेत करते हैं।
  alternative: किसी अनिर्दिष्ट वक्ता की ओर सामान्य संकेत।
  rationale: अय्यूब 23 के प्रसंग में अय्यूब परमेश्वर के सम्मुख अपनी निष्ठा और परमेश्वर के वचनों के प्रति अपने व्यवहार का वर्णन कर रहा है; इसलिए परमेश्वर संदर्भित व्यक्ति हैं, यद्यपि अनुवाद मूल की तरह केवल सर्वनाम रखता है।
- issue: מֵחֻקִּי का अर्थ
  choice: 'तुलनात्मक अर्थ: ‘अपने ठहराए हुए भाग से अधिक’।'
  alternative: ‘अपनी विधि/नियम से’; अथवा पारंपरिक व्याख्या के अनुसार ‘अपने आवश्यक भोजन से अधिक’।
  rationale: व्यंजन-पाठ और प्रथम पुरुष एकवचन प्रत्यय वाला पद कठिन है। मुख्य पाठ नियत हिस्से की धारणा को बनाए रखता है और प्रसंग में सुबोध है, जबकि भोजन संबंधी प्रसिद्ध पारंपरिक व्याख्या को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। ‘होंठों/मुँह’ की ठोस समानांतर छवि सुरक्षित रखी गई है। कठिन पद को अत्यधिक स्पष्ट करके केवल भोजन तक सीमित नहीं किया गया; वैकल्पिक पारंपरिक अर्थ पादटिप्पणी में दिया गया है।
