    text: या, “क्योंकि मुझे अंधकार के कारण मिटा नहीं दिया गया, न इस कारण कि घने अंधकार ने मेरा मुख ढक लिया।” इस पद का इब्रानी पाठ कठिन है—विशेषकर “चुप नहीं कराया गया/मिटा नहीं दिया गया” का अर्थ, और यह कि दूसरी पंक्ति का आशय “मेरा मुख ढक लिया” है या “मेरे सामने छा गया” है।
