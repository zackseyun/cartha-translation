  text: Look[a], I go east, but he is not there; and west, but I do not perceive him.
translation:
  language: hi
  text: देखो, मैं पूर्व[a] की ओर जाता हूँ, पर वह वहाँ नहीं है; और पश्चिम की ओर जाता हूँ, पर मैं उसे पहचान नहीं पाता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘आगे ... पीछे।’ इब्रानी के दिशासूचक शब्द स्थान की दृष्टि से पूर्व और पश्चिम अथवा आगे और पीछे—दोनों अर्थों में समझे जा सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: देखो
  rationale: यह शब्द ध्यान आकर्षित करते हुए अय्यूब की बात आरम्भ करता है। ‘देखो’ आधुनिक हिन्दी में स्वाभाविक है और उद्गारात्मक बल बनाए रखता है।
- source_word: קֶדֶם
  choice: पूर्व
  rationale: אָחוֹר के साथ दिशात्मक युग्म में यहाँ भौगोलिक अर्थ सबसे स्वाभाविक है; फिर भी ‘आगे’ का अर्थ सम्भव होने के कारण उसे पाद-टिप्पणी में रखा गया है।
- source_word: אֶהֱלֹךְ
  choice: मैं ... की ओर जाता हूँ
  rationale: הלך का प्रथम पुरुष रूप खोज में एक दिशा की ओर जाने को व्यक्त करता है। हिन्दी वाक्य में ‘की ओर’ दिशा को स्पष्ट और स्वाभाविक बनाता है।
- source_word: וְאֵינֶנּוּ
  choice: पर वह वहाँ नहीं है
  rationale: सन्दर्भ में पुरुषवाचक सर्वनाम परमेश्वर की ओर संकेत करता है। ‘वहाँ’ दिशात्मक खोज के कारण हिन्दी में स्वाभाविक पूर्ति है, और ‘पर’ असफल खोज के विरोधात्मक भाव को व्यक्त करता है।
- source_word: אָחוֹר
  choice: पश्चिम
  rationale: קֶדֶם के विपरीत दिशात्मक पद के रूप में ‘पश्चिम’ काव्यात्मक समानान्तरता स्पष्ट करता है; ‘पीछे’ सम्भव विकल्प है और पाद-टिप्पणी में दिया गया है।
- source_word: לֹא אָבִין לוֹ
  choice: मुझे उसका आभास नहीं होता
  rationale: בין यहाँ खोज के सन्दर्भ में समझने से अधिक अनुभव या बोध द्वारा पहचान पाने का भाव देता है। ‘आभास नहीं होता’ परमेश्वर की उपस्थिति को ग्रहण न कर पाने की बात कहता है, बिना इसे केवल आँखों से देखने तक सीमित किए।
theological_decisions:
- issue: तीसरे पुरुष के सर्वनामों का संकेत
  choice: सर्वनामों को परमेश्वर के लिए ‘वह’ और ‘उसका’ के रूप में रखा गया है।
  alternative: किसी अनिर्दिष्ट पुरुषवाचक व्यक्ति का संकेत
  rationale: आस-पास के सन्दर्भ में अय्यूब परमेश्वर को खोज रहा है; अतः ये हिन्दी सर्वनाम सन्दर्भानुकूल हैं और किसी अतिरिक्त धर्मवैज्ञानिक निष्कर्ष को नहीं जोड़ते।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। समानान्तर काव्यात्मक संरचना को बनाए रखते हुए दूसरे खण्ड में हिन्दी की स्पष्टता के लिए क्रिया दोहराई गई है।
