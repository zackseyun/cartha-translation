  text: I would know the words with which he would answer me, and understand what he would say to me.
translation:
  language: hi
  text: मैं जान पाता कि वह मुझे किन शब्दों में उत्तर देता, और समझ पाता कि वह मुझे क्या कहता।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵדְעָה
  choice: मैं जान पाता
  rationale: ידע का cohortative रूप इस काल्पनिक संदर्भ में अय्यूब की इच्छित परिणति व्यक्त करता है; ‘जान पाता’ इच्छा और संभावना दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: מִלִּים
  choice: किन शब्दों में
  rationale: מִלִּים का मूल अर्थ ‘शब्द’ है। उत्तर देने के साधन को हिन्दी में स्वाभाविक ढंग से व्यक्त करने के लिए ‘किन शब्दों में’ चुना गया है; ‘तर्क’ कहना न्यायिक संदर्भ की अधिक व्याख्या करता।
- source_word: יַעֲנֵנִי
  choice: वह मुझे ... उत्तर देता
  rationale: ענה का अर्थ यहाँ ‘उत्तर देना’ है। आसपास के काल्पनिक प्रसंग के कारण ‘देता’ को ‘जान पाता’ के अधीन रखकर संभाव्य भाव व्यक्त होता है।
- source_word: וְאָבִינָה
  choice: और समझ पाता
  rationale: בין का अर्थ ‘समझना/परखना’ है। ‘समझ पाता’ पहले खंड के ‘जान पाता’ के समानांतर है और cohortative भाव को बनाए रखता है।
- source_word: מַה
  choice: क्या
  rationale: यह प्रश्नवाचक सर्वनाम परमेश्वर के कथन की विषयवस्तु बताता है।
- source_word: יֹאמַר לִי
  choice: वह मुझसे क्या कहता
  rationale: אמר का सामान्य अर्थ ‘कहना’ है। ‘मुझसे कहता’ हिब्रू की सीधी अभिव्यक्ति को बिना अतिरिक्त व्याख्या के रखता है।
