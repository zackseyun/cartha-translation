  text: But God has made my heart faint[a], and the Almighty has terrified me.
translation:
  language: hi
  text: परन्तु परमेश्वर ने मेरे हृदय को निर्बल कर दिया है[a], और सर्वशक्तिमान ने मुझे भयभीत कर दिया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे हृदय को कोमल कर दिया है।” इब्रानी क्रिया का शाब्दिक अर्थ “कोमल या नरम करना” है; यहाँ सम्भवतः आशय है कि अय्यूब का साहस गल गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵל
  choice: परन्तु परमेश्वर
  rationale: וְ प्रसंग में पिछले कथन के साथ विरोध अथवा तनाव व्यक्त करता है; אֵל के लिए स्वाभाविक और गरिमापूर्ण हिन्दी पद ‘परमेश्वर’ है।
- source_word: הֵרַךְ
  choice: निर्बल कर दिया है
  rationale: रूप का मूल अर्थ ‘कोमल/नरम करना’ है, पर ‘हृदय’ के साथ यहाँ साहस और भीतरी दृढ़ता टूटने का भाव है। ‘निर्बल’ इस मुहावरे का अर्थ स्पष्ट करता है, जबकि शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: לִבִּי
  choice: मेरे हृदय को
  rationale: ‘हृदय’ मूल इब्रानी बिंब को बनाए रखता है और यहाँ साहस तथा भीतरी शक्ति का द्योतक है।
- source_word: וְשַׁדַּי
  choice: और सर्वशक्तिमान
  rationale: שַׁדַּי यहाँ ईश्वरीय उपाधि है; ‘सर्वशक्तिमान’ उसका स्थापित और अर्थपूर्ण हिन्दी अनुवाद है।
- source_word: הִבְהִילָנִי
  choice: मुझे भयभीत कर दिया है
  rationale: בהל का हिफ़ील रूप किसी को घबरा या आतंकित कर देने का तीव्र भाव रखता है; यह हिन्दी पद उसी कारणात्मक अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: אֵל और שַׁדַּי ईश्वरीय पदों का अनुवाद
  choice: परमेश्वर ... सर्वशक्तिमान
  alternative: ईश्वर ... शद्दाय
  rationale: दोनों पद समानांतर ईश्वरीय designation हैं। उपाधि שַׁדַּי का अर्थानुवाद करना सामान्य पाठक के लिए उसका बल सुरक्षित रखता है और किसी सम्प्रदायगत व्याख्या को नहीं जोड़ता।
- issue: हृदय को ‘कोमल’ करने का आशय
  choice: हृदय को निर्बल करना
  alternative: हृदय को कोमल करना
  rationale: प्रसंग में अय्यूब परमेश्वर के सामने अपने भय का कारण बता रहा है; अतः यह नैतिक संवेदनशीलता नहीं, साहस गल जाने या भीतरी शक्ति टूटने का भाव है। फिर भी शाब्दिक संभावना पादटिप्पणी में दी गई है।
