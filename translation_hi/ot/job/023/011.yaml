  yaml_path: translation/ot/job/023/011.yaml
  text: My foot has held fast to his steps[a]; I have kept his way and have not turned aside.
translation:
  language: hi
  text: मेरे पाँव उसके पदचिह्नों पर दृढ़ता से टिके रहे हैं[a]; मैंने उसके मार्ग का पालन किया और नहीं भटका।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे पाँव उसके कदम में दृढ़ता से टिके रहे हैं”; इब्रानी में चित्र उसके कदमों या पदचिह्नों में निकटता और दृढ़ता से चलते रहने का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּאֲשֻׁרוֹ
  choice: उसके पदचिह्नों को
  rationale: אֲשׁוּר का अर्थ कदम या पदचिह्न है। यहाँ संबंधसूचक प्रत्यय 3 पुं. एक. है; ‘उसके पदचिह्नों को’ निकटता से पीछे चलने का ठोस चित्र बनाए रखता है।
- source_word: אָחֲזָה
  choice: दृढ़ता से थामे रखा है
  rationale: אחז का मूल अर्थ पकड़ना या थामना है। ‘दृढ़ता से थामे रखा’ हिंसक पकड़ के बजाय अटल लगे रहने का भाव व्यक्त करता है।
- source_word: רַגְלִי
  choice: मेरे पाँव
  rationale: इब्रानी में संज्ञा एकवचन है; हिन्दी में ‘मेरे पाँव’ स्वाभाविक रहते हुए मूल के ठोस और एकवचन बिंब को सुरक्षित रखता है।
- source_word: דַּרְכּוֹ
  choice: उसका मार्ग
  rationale: דֶּרֶךְ का सीधा अर्थ मार्ग या राह है और यह आचरण के लिए रूपक भी हो सकता है। ‘उसका मार्ग’ दोनों स्तरों को बनाए रखता है।
- source_word: שָׁמַרְתִּי
  choice: अपनाए रखा
  rationale: שׁמר में सँभालकर रखने, पालन करने और बनाए रखने का भाव है। मार्ग के साथ ‘अपनाए रखा’ निरंतर निष्ठापूर्ण आचरण को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְלֹא אָט
  choice: और उससे नहीं भटका
  rationale: यह पदबंध मार्ग से न हटने या न भटकने को व्यक्त करता है। ‘उससे’ मार्ग को स्पष्ट रूप से संदर्भित करता है और रास्ते के बिंब को बनाए रखता है।
theological_decisions:
- issue: ‘उसके पदचिह्नों’ और ‘उसका मार्ग’ में तीसरे पुरुष एकवचन का संदर्भ
  choice: सर्वनाम को ‘उसके/उसका’ के रूप में रखा गया है; संदर्भ में यह परमेश्वर की ओर संकेत करता है।
  alternative: किसी अनिर्दिष्ट धर्मी मार्ग या व्यक्ति की ओर संकेत
  rationale: अय्यूब 23:10-12 के निकट संदर्भ में अय्यूब परमेश्वर और उसके सामने अपनी निष्ठा की बात कर रहा है। फिर भी पद में ‘परमेश्वर’ जोड़ने के बजाय मूल के सर्वनाम को बनाए रखने से पाठ की अभिव्यक्ति सुरक्षित रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय और सहज शैली रखी गई है। ‘पदचिह्न’ और ‘मार्ग’ मूल के चलने/राह के संयुक्त बिंब को सुरक्षित रखते हैं; ‘दृढ़ता से थामे रखा’ निकट अनुसरण और स्थिर निष्ठा दोनों को व्यक्त करता है।
