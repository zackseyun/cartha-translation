  yaml_path: translation/ot/job/023/007.yaml
  text: There an upright man could reason with him[b][a], and I would be delivered forever from my judge.
translation:
  language: hi
  text: वहाँ एक खरा व्यक्ति उसके साथ तर्क कर सकता था[a], और मैं अपने न्याय करनेवाले से सदा के लिए छूट जाता[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके साथ वाद-विवाद कर सकता था,” अथवा “उसके सामने अपना पक्ष रख सकता था।”
    reason: lexical_alternative
  - marker: b
    text: या, “और मैं अपने न्यायी से सदा के लिए बच निकलता।” इब्रानी का अर्थ “मेरा न्याय करनेवाला” भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁם
  choice: वहाँ
  rationale: यह स्थानवाचक क्रियाविशेषण आसपास के प्रसंग में परमेश्वर से कल्पित भेंट के स्थान की ओर संकेत करता है।
- source_word: יָשָׁר
  choice: खरा मनुष्य
  rationale: यह नैतिक सच्चाई और निर्दोष चरित्र का भाव व्यक्त करता है; ‘खरा’ आधुनिक हिन्दी में स्वाभाविक है और अय्यूब के दावे के अनुकूल है।
- source_word: נוֹכָח
  choice: अपना पक्ष रख सकता था
  rationale: यहाँ शब्द का भाव न्यायिक प्रसंग में तर्क या मुकदमा प्रस्तुत करने का है। यह अनुवाद अदालती बिंब बनाए रखता है और केवल सामान्य बातचीत का अर्थ नहीं देता।
- source_word: עִמּוֹ
  choice: उसके सामने
  rationale: मूलतः ‘उसके साथ’ है, पर न्यायिक प्रसंग में ‘उसके सामने’ स्वाभाविक हिन्दी है। सर्वनाम को बनाए रखने से परमेश्वर का नाम व्याख्यात्मक रूप से नहीं जोड़ा गया।
- source_word: וַאֲפַלְּטָה
  choice: और मैं ... छूट जाता
  rationale: פלט बच निकलने या छुड़ाए जाने का भाव देता है। ‘छूट जाता’ न्यायिक प्रसंग में मुक्ति व्यक्त करता है, पर तकनीकी रूप से ‘दोषमुक्त ठहराए जाने’ का अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: לָנֶצַח
  choice: सदा के लिए
  rationale: यह स्थायी और निरंतर परिणाम का भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: מִשֹּׁפְטִי
  choice: अपने न्याय करनेवाले से
  rationale: यह ‘मेरे न्यायी’ अथवा ‘मेरा न्याय करनेवाला’ हो सकता है। चुना हुआ रूप न्यायिक भूमिका को बनाए रखते हुए यह तय नहीं करता कि वह केवल निष्पक्ष न्यायाधीश है या अय्यूब के विरुद्ध न्याय कर रहा है।
theological_decisions:
- issue: ‘मेरे न्यायी/न्याय करनेवाले’ का संदर्भ और न्यायिक भाव
  choice: ‘अपने न्याय करनेवाले से’ कहकर भूमिका और उसकी अस्पष्टता बनाए रखी गई।
  alternative: ‘अपने न्यायी से’ या ‘अपने अभियोग लगानेवाले से’
  rationale: प्रसंग में सम्भवतः परमेश्वर की ओर संकेत है, पर मूल पाठ केवल न्याय करनेवाले की भूमिका व्यक्त करता है। ‘अभियोग लगानेवाला’ कहना विरोधी भूमिका को अनावश्यक रूप से निश्चित कर देता, जबकि ‘न्यायी’ आधुनिक सामान्य हिन्दी में कम स्वाभाविक है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘अपना पक्ष रखना’ न्यायिक संदर्भ को सहज हिन्दी में व्यक्त करता है; वैकल्पिक अधिक शाब्दिक और अधिक कानूनी अभिव्यक्तियाँ पादटिप्पणी में दी गई हैं।
