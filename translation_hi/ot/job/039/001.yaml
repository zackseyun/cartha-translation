- source_word: חֹלֵל
  choice: प्रसव करती
  rationale: חול का यह रूप प्रसव-पीड़ा अथवा बच्चा जनने की प्रक्रिया को सूचित करता है; ‘प्रसव करती’ हिन्दी में उस प्रक्रिया को संक्षेप और गरिमा से व्यक्त करता है।
- source_word: אַיָּלוֹת
  choice: हिरनियों
  rationale: इब्रानी शब्द मादा हिरनों को दर्शाता है; ‘हिरनियों’ लिंग-सूचना को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: תִּשְׁמֹר
  choice: पर नज़र रखता है
  rationale: שׁמר में देखना, ध्यान रखना और निगरानी करना जैसे अर्थ संभव हैं। ‘पर नज़र रखना’ निरीक्षण और सतर्क ध्यान—दोनों की गुंजाइश बनाए रखता है।
