  text: because God has deprived her of wisdom and has not given her a share in understanding[a][b].
translation:
  language: hi
  text: 'क्योंकि परमेश्वर ने उसे बुद्धि से वंचित किया है[a]

    और उसे समझ में कोई हिस्सा नहीं दिया है[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि परमेश्वर ने उसे बुद्धि भुला दी है,” अथवा “परमेश्वर ने उसमें बुद्धि का अभाव कर दिया है।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उसे समझ में कोई भाग नहीं बाँटा है,” अर्थात उसे समझ में कोई हिस्सा नहीं दिया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह आसपास के प्रसंग में शुतुरमुर्ग के व्यवहार का कारण बताता है; आधुनिक हिन्दी में ‘क्योंकि’ कारणसूचक अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הִשָּׁהּ
  choice: उसे ... से वंचित रखा है
  rationale: नשה के हिफ़ील रूप में 3 स्त्रीलिंग एकवचन प्रत्यय है और यहाँ परमेश्वर द्वारा बुद्धि उससे दूर रखे जाने का कारक भाव है। यह अनुवाद केवल भूल जाने का अर्थ आरोपित किए बिना उस भाव को स्पष्ट करता है।
- source_word: אֱלוֹהַּ
  choice: परमेश्वर
  rationale: अय्यूब में प्रयुक्त इस एकवचन ईश्वरीय पद का मानक और गरिमापूर्ण हिन्दी रूप।
- source_word: חָכְמָה
  choice: बुद्धि
  rationale: यहाँ विवेकपूर्ण निर्णय या सहज सूझ की व्यापक क्षमता अभिप्रेत है; ‘बुद्धि’ सीधा और प्रसंगानुकूल है।
- source_word: וְלֹא
  choice: और ... नहीं
  rationale: इब्रानी संयोजक और निषेध को सहज हिन्दी में बनाए रखता है।
- source_word: חָלַק לָהּ
  choice: उसे ... कोई भाग नहीं दिया है
  rationale: חלק का मूल भाव बाँटना या हिस्सा ठहराना है। ‘कोई भाग नहीं दिया’ उसके वितरणात्मक अर्थ को सामान्य हिन्दी में सुरक्षित रखता है।
- source_word: בַּבִּינָה
  choice: समझ का
  rationale: בינה समझ, परख या अंतर्दृष्टि को दर्शाता है। ‘समझ’ सरल है और ‘बुद्धि’ से निकटता रखते हुए भी उससे अलग शब्द बना रहता है।
theological_decisions:
- issue: शुतुरमुर्ग में बुद्धि की कमी के संबंध में परमेश्वर की कर्तृता
  choice: परमेश्वर को स्पष्ट कर्ता रखते हुए कहा गया है कि उसने उसे बुद्धि से वंचित रखा और समझ का भाग नहीं दिया।
  alternative: कर्तृता को नरम करके केवल यह कहना कि ‘उसमें बुद्धि नहीं है।’
  rationale: इब्रानी पाठ दोनों क्रियाओं के कर्ता के रूप में אֱלוֹהַּ को स्पष्ट रूप से रखता है। अनुवाद इस कठिन धार्मिक तनाव को नरम या हल किए बिना सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। स्त्रीलिंग ‘उसे’ प्रसंग के शुतुरमुर्ग के लिए है। समानांतर पंक्तियों में ‘बुद्धि’ और ‘समझ’ का भेद तथा दूसरे खंड का भाग बाँटने वाला बिंब बनाए रखा गया है।
