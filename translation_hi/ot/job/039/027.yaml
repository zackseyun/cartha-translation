  text: Is it at your command that the eagle flies high and lifts up its nest?[a][b][c]
translation:
  language: hi
  text: क्या तेरी आज्ञा से उकाब ऊँचा उड़ता और अपना घोंसला ऊँचाई पर बनाता है?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ऊँचा उड़ता” का अनुवाद “ऊँची उड़ान भरता” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक अर्थ “तेरे मुँह के अनुसार” है; यह “तेरी आज्ञा से” या “तेरे वचन के अनुसार” के अर्थ में प्रयुक्त मुहावरा है।
    reason: lexical_alternative
  - marker: c
    text: “उकाब” के लिए प्रयुक्त इब्रानी शब्द का अर्थ अधिक व्यापक रूप से कोई बड़ा शिकारी पक्षी भी हो सकता है और कुछ सन्दर्भों में इसमें गिद्ध भी सम्मिलित हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: क्या
  rationale: यहाँ אִם शर्त नहीं, बल्कि परमेश्वर के आलंकारिक प्रश्न का आरम्भ करता है; आधुनिक हिन्दी में “क्या” स्वाभाविक है।
- source_word: עַל פִּיךָ
  choice: तेरी आज्ञा से
  rationale: शाब्दिक अर्थ “तेरे मुँह पर/के अनुसार” है, पर सन्दर्भ में यह किसी के आदेश या वचन के अनुसार होने का मुहावरा है।
- source_word: יַגְבִּיהַּ
  choice: ऊँचा उड़ता
  rationale: גבה का हिफ़ील रूप ऊँचा उठने या ऊँचाई प्राप्त करने का भाव देता है; उकाब के विषय में “ऊँचा उड़ता” स्वाभाविक और अर्थनिष्ठ है।
- source_word: נָשֶׁר
  choice: उकाब
  rationale: यह बड़े शिकारी पक्षी के लिए प्रयुक्त शब्द है; ऊँची उड़ान और ऊँचे घोंसले के इस काव्यात्मक सन्दर्भ में “उकाब” पारम्परिक और उपयुक्त अनुवाद है।
- source_word: וְכִי
  choice: और
  rationale: यह उसी आलंकारिक प्रश्न में दूसरी क्रिया को पहली से जोड़ता है; हिन्दी में साधारण संयोजक “और” पर्याप्त है।
- source_word: יָרִים קִנּוֹ
  choice: अपना घोंसला ऊँचाई पर बनाता है
  rationale: शाब्दिक रूप से क्रिया घोंसले को “ऊँचा उठाने” की बात करती है, पर आशय उसे ऊँचे स्थान पर स्थापित करने का है; चुना हुआ वाक्यांश हिन्दी में इस स्थानगत चित्र को स्पष्ट रखता है।
