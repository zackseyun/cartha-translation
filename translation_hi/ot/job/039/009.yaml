  text: הֲ/יֹ֣אבֶה רֵּ֣ים עָבְדֶ֑/ךָ אִם יָ֝לִ֗ין עַל אֲבוּסֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/009.yaml
  text: Will the wild ox be willing to serve you? Will he spend the night at your feeding trough?[a][b]
translation:
  language: hi
  text: क्या जंगली बैल तुम्हारी सेवा करने को राज़ी होगा? क्या वह रात तुम्हारी नाँद[a] के पास बिताएगा?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात पशुओं के चारा खाने का पात्र या स्थान।
    reason: lexical_alternative
  - marker: b
    text: ‘जंगली बैल’ के लिए प्रयुक्त इब्रानी शब्द किस पशु को ठीक-ठीक दर्शाता है, यह निश्चित नहीं है; इसका अनुवाद ‘वन-बैल’ या ‘ऑरक्स’ भी किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיֹאבֶה
  choice: क्या ... राज़ी होगा
  rationale: क्रिया אבה इच्छा या सहमति व्यक्त करती है; ‘राज़ी होगा’ आलंकारिक प्रश्न में इस संकल्पात्मक भाव को स्वाभाविक हिन्दी में रखता है।
- source_word: רֵּים
  choice: जंगली बैल
  rationale: इस पशु की सटीक पहचान अनिश्चित है। ‘जंगली बैल’ सुलभ है और मूल के जंगली, अदम्य गोवंशी पशु के सामान्य अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: עָבְדֶךָ
  choice: तुम्हारी सेवा करने
  rationale: यहाँ עבד का आशय मनुष्य के लिए काम या सेवा करने से है; यह पालतू श्रम-पशु और अदम्य जंगली पशु के बीच विरोध को बनाए रखता है।
- source_word: אִם
  choice: क्या
  rationale: काव्यात्मक समानांतरता में אִם दूसरा आलंकारिक प्रश्न आरम्भ करता है; हिन्दी में ‘क्या’ दोहराना स्वाभाविक है।
- source_word: יָלִין
  choice: रात ... बिताएगा
  rationale: לין का अर्थ रात ठहरना या रात बिताना है; यह आधुनिक हिन्दी में स्पष्ट और सहज है।
- source_word: עַל
  choice: के पास
  rationale: नाँद के संदर्भ में स्थानसूचक עַל को हिन्दी में ‘के पास’ कहना स्वाभाविक है और पशु के वहीं रात भर रहने का दृश्य स्पष्ट करता है।
- source_word: אֲבוּסֶךָ
  choice: तुम्हारी नाँद
  rationale: אֲבוּס पशुओं के चारा खाने की जगह या पात्र को दर्शाता है; ‘नाँद’ इसका संक्षिप्त, सटीक और प्रचलित हिन्दी शब्द है।
