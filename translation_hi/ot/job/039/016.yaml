- source_word: הִקְשִׁיחַ
  choice: कठोर व्यवहार करती है
  rationale: हिफ़ील रूप कठोर बनाने या कठोरता से पेश आने का भाव देता है। शुतुरमुर्ग और उसके बच्चों के संदर्भ में यह सहज हिंदी है, जबकि अधिक शाब्दिक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: בָּנֶיהָ
  choice: अपने बच्चों
  rationale: शाब्दिक अर्थ ‘उसके पुत्र/बच्चे’ है; पशु-संदर्भ में ‘बच्चे’ स्वाभाविक और स्पष्ट है।
- source_word: לְלֹא לָהּ
  choice: मानो वे उसके हों ही नहीं
  rationale: इब्रानी वाक्यांश का शाब्दिक भाव ‘उसके नहीं’ है। ‘मानो’ तुलना का भाव और ‘ही’ मातृ-संबंध की उपेक्षा को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: לְרִיק
  choice: व्यर्थ
  rationale: निष्फलता या बिना परिणाम के होने का संक्षिप्त और प्रचलित हिंदी समतुल्य।
- source_word: יְגִיעָהּ
  choice: उसका परिश्रम
  rationale: यह संतान उत्पन्न करने और उसकी देखभाल से जुड़े श्रम को सूचित करता है; ‘परिश्रम’ अर्थ को अनावश्यक रूप से केवल प्रसव तक सीमित नहीं करता।
- source_word: בְּלִי פָחַד
  choice: उसे कोई डर नहीं
  rationale: शाब्दिक ‘बिना डर’ को स्वाभाविक हिंदी वाक्य में रखा गया है और मूल की संक्षिप्तता तथा उसकी चिंता-रहित अवस्था बनाए रखी गई है।
