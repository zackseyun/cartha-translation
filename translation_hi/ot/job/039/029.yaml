  text: From there he spies out food[a]; his eyes look from far away.
translation:
  language: hi
  text: वहीं से वह भोजन खोजता है; उसकी आँखें दूर से देखती हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी आँखें दूर तक देखती हैं।” इब्रानी पद बड़ी दूरी का बोध कराता है; हिंदी में इसे ‘दूर से’ या, अधिक गतिशील रूप में, ‘दूर तक’ कहा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשָּׁם
  choice: वहीं से
  rationale: यह स्थानवाचक पद उस ऊँचे बसेरे को संकेत करता है जहाँ से उकाब भोजन खोजता है; ‘वहीं से’ हिंदी में स्वाभाविक और संदर्भ-संगत है।
- source_word: חָפַר
  choice: खोजता है
  rationale: इस क्रिया का सामान्य अर्थ ‘खोदना’ है, पर भोजन के साथ और उकाब के व्यवहार के संदर्भ में इसका भाव खोजने या ढूँढ़ निकालने का है।
- source_word: אֹכֶל
  choice: भोजन
  rationale: मूल शब्द का व्यापक अर्थ ‘भोजन’ है। संदर्भ में यह शिकार भी हो सकता है, पर ‘भोजन’ मूल की व्यापकता बनाए रखता है।
- source_word: לְמֵרָחוֹק
  choice: दूर तक
  rationale: यह पद बड़ी दूरी का बोध कराता है। दृष्टि के संदर्भ में ‘दूर तक देखती हैं’ सहज आधुनिक हिंदी है; ‘दूर से’ वाला अधिक औपचारिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: עֵינָיו יַבִּיטוּ
  choice: उसकी आँखें ... देखती हैं
  rationale: मूल में आँखें स्पष्ट कर्ता हैं और बहुवचन क्रिया उनके अनुरूप है; हिंदी में भी इस ठोस चित्र को बनाए रखा गया है।
