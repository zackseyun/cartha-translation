translation:
  language: hi
  text: जिसके लिए मैंने मरुस्थल को उसका घर, और खारी भूमि को उसके निवास-स्थल बनाया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲשֶׁר
  choice: जिसके लिए
  rationale: यह संबंधवाचक अव्यय पिछले पद के जंगली गधे की ओर संकेत करता है; अगले क्रियापद के साथ ‘जिसके लिए’ स्वाभाविक और अर्थानुकूल है।
- source_word: שַׂמְתִּי
  choice: मैंने ... ठहराया है
  rationale: שׂוּם का मूल अर्थ रखना या निर्धारित करना है। आवास के संदर्भ में ‘ठहराया है’ परमेश्वर द्वारा स्थान नियत करने का भाव बनाए रखता है।
- source_word: עֲרָבָה
  choice: मरुस्थल
  rationale: यह शब्द शुष्क, वीरान मैदानी भूभाग को सूचित करता है। ‘मरुस्थल’ आधुनिक हिन्दी में स्पष्ट है और इसे अनावश्यक रूप से किसी विशिष्ट भौगोलिक नाम तक सीमित नहीं करता।
- source_word: בֵיתוֹ
  choice: उसका घर
  rationale: इब्रानी में शाब्दिक अर्थ ‘उसका घर’ है। हिन्दी वाक्य में ‘को’ के साथ यह निवास-स्थान के रूपक को सहज रूप से बनाए रखता है।
- source_word: וּמִשְׁכְּנוֹתָיו
  choice: उसके निवास
  rationale: मूल शब्द बहुवचन है, पर काव्य में यह सामूहिक अथवा भाववाचक अर्थ दे सकता है। हिन्दी में ‘निवास’ एकवचन और बहुवचन दोनों रूपों में समान दिखता है, इसलिए मूल की संभावित व्यापकता भी बनी रहती है।
- source_word: מְלֵחָה
  choice: खारी भूमि
  rationale: यह नमक से प्रभावित बंजर भूभाग को दर्शाता है। ‘खारी भूमि’ सहज और व्यापक है; यह अर्थ को अधिक संकीर्ण ‘नमक का मैदान’ तक सीमित नहीं करता।
