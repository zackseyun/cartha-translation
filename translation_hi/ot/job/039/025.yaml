  text: בְּ/דֵ֤י שֹׁפָ֨ר יֹ֘אמַ֤ר הֶאָ֗ח וּֽ֭/מֵ/רָחוֹק יָרִ֣יחַ מִלְחָמָ֑ה רַ֥עַם שָׂ֝רִים וּ/תְרוּעָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/025.yaml
  text: At the blast of the trumpet he says[a], ‘Aha!’ From far away he smells the battle[c][b], the thunder of commanders and the war cry.
translation:
  language: hi
  text: तुरही बजते ही[a] वह कहता है, “अहा!”[b] दूर से ही वह युद्ध की गंध पा लेता है—सेनापतियों की गर्जना और युद्ध-घोष।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुरही की ध्वनि सुनते ही”; इब्रानी मुहावरा उस अवसर को बताता है जब तुरही बजती है।
    reason: lexical_alternative
  - marker: b
    text: “अहा!” उत्साह और आतुरता का उद्गार है, जो युद्ध के लिए घोड़े की तत्परता दिखाता है।
    reason: cultural_note
  - marker: c
    text: या, “सेनापतियों की गरज और ऊँची पुकार।” “गर्जना” का मूल अर्थ बादल की गरज है, पर यहाँ यह युद्ध के प्रचंड शोर का रूपक है; “युद्ध-घोष” ऊँची पुकार या संकेत के लिए बजाई गई ध्वनि भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּדֵי שֹׁפָר
  choice: तुरही बजते ही
  rationale: यह इब्रानी पदबंध तुरही बजने के अवसर को सूचित करता है। यह अनुवाद समय-संबंधी अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יֹאמַר
  choice: वह कहता है
  rationale: सामान्य क्रिया ‘कहना’ को बनाए रखकर युद्ध के घोड़े के सजीव मानवीकरण को सुरक्षित रखा गया है।
- source_word: הֶאָח
  choice: अहा!
  rationale: यह उत्साह और आतुरता का उद्गार है; ‘अहा!’ युद्ध के लिए घोड़े की उत्कंठा को संक्षेप में व्यक्त करता है।
- source_word: וּמֵרָחוֹק
  choice: दूर से ही
  rationale: यह दूरी को स्पष्ट करता है और ‘ही’ घोड़े की असाधारण सजगता पर स्वाभाविक बल देता है।
- source_word: יָרִיחַ מִלְחָמָה
  choice: वह युद्ध की गंध पा लेता है
  rationale: मूल के सूँघकर पहचानने वाले ठोस बिंब को रखते हुए हिन्दी में सहज अभिव्यक्ति चुनी गई है।
- source_word: רַעַם שָׂרִים
  choice: सेनापतियों की गर्जना
  rationale: רַעַם का मूल अर्थ ‘गरज/गर्जना’ है और यहाँ युद्ध के प्रचंड शोर का रूपक है; सैन्य प्रसंग में שָׂרִים के लिए ‘सेनापति’ उपयुक्त है।
- source_word: וּתְרוּעָה
  choice: और युद्ध-घोष
  rationale: यह शब्द ऊँची पुकार अथवा संकेत-ध्वनि दोनों बता सकता है। प्रसंग में ‘युद्ध-घोष’ सैन्य अर्थ को व्यक्त करता है, जबकि टिप्पणी में दूसरी संभावना सुरक्षित है।
