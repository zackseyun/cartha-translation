  text: Is it by your understanding that the hawk soars[a], spreading its wings toward the south?
translation:
  language: hi
  text: क्या तेरी समझ से बाज़ उड़ान भरता है[a] और दक्षिण की ओर अपने पंख फैलाता है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शिकरा”; इब्रानी शब्द נֵץ इस प्रकार के किसी शिकारी पक्षी को अधिक व्यापक रूप से दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲמִבִּינָתְךָ
  choice: क्या तेरी समझ से
  rationale: प्रश्नवाचक הֲ और साधनसूचक מִן के साथ בִּינָה का अर्थ है कि क्या यह कार्य अय्यूब की समझ के कारण या उसके द्वारा होता है।
- source_word: יַאֲבֶר
  choice: उड़ान भरता है
  rationale: हिफ़ील रूप पक्षी के उड़ने या ऊपर उठने को व्यक्त करता है। सहज आधुनिक हिन्दी में ‘उड़ान भरता है’ इस गति को स्पष्ट रखता है।
- source_word: נֵץ
  choice: बाज़
  rationale: यह शब्द बाज़ या शिकरे जैसे शिकारी पक्षी का व्यापक संकेत कर सकता है; ‘बाज़’ सामान्य पाठक के लिए स्वाभाविक और पर्याप्त रूप से व्यापक है।
- source_word: יִפְרֹשׂ
  choice: फैलाता है
  rationale: פרשׂ का सीधा अर्थ फैलाना है; यहाँ यह उड़ान के साथ होने वाली क्रिया बताता है।
- source_word: כְּנָפוֹ
  choice: अपने पंख
  rationale: इब्रानी में रूप एकवचन है, पर सामूहिक अर्थ में हिन्दी मुहावरे के अनुसार बहुवचन ‘पंख’ स्वाभाविक है; ‘अपने’ कर्ता से संबंध स्पष्ट करता है।
- source_word: לְתֵימָן
  choice: दक्षिण की ओर
  rationale: לְ दिशा और תֵימָן दक्षिण को दर्शाते हैं; यह रूप दिशात्मक अर्थ को सहज हिन्दी में व्यक्त करता है।
