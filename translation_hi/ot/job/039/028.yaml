  text: He dwells on the cliff and spends the night there[c][b][a], on the tooth of the crag and the stronghold.
translation:
  language: hi
  text: 'वह चट्टान पर बसता है और वहीं रात बिताता है,[a]

    चट्टान की दाँत-जैसी चोटी और दुर्ग पर।[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वहीं ठहरता है” या “वहीं रात भर ठहरता है।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक, “चट्टान का दाँत”; यह नुकीले चट्टानी उभार या चोटी का इब्रानी बिंब है।
    reason: cultural_note
  - marker: c
    text: या, “गढ़।”
    reason: lexical_alternative
lexical_decisions:
- source_word: סֶלַע
  choice: चट्टान
  rationale: यहाँ शब्द ऊँचे, खड़े शैल-स्थान को दर्शाता है जहाँ उकाब रहता है; ‘चट्टान’ आधुनिक हिन्दी में स्वाभाविक और व्यापक रूप से बोधगम्य है।
- source_word: יִשְׁכֹּן
  choice: बसता है
  rationale: क्रिया स्थायी निवास का भाव देती है; ‘बसता है’ सहज, वर्तमान और काव्यात्मक हिन्दी है।
- source_word: וְיִתְלֹנָן
  choice: और वहीं रात बिताता है
  rationale: क्रिया में रात ठहरने या बिताने का स्पष्ट भाव है; ‘वहीं’ प्रसंगगत स्थान को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שֶׁן סֶלַע
  choice: चट्टान की दाँत-सी चोटी
  rationale: शाब्दिक ‘चट्टान का दाँत’ नुकीले शैल-उभार का चित्र है। ‘दाँत-सी चोटी’ मूल रूपक को बनाए रखते हुए उसका आशय स्पष्ट करती है।
- source_word: וּמְצוּדָה
  choice: और दुर्गम गढ़
  rationale: מְצוּדָה का अर्थ गढ़ या दृढ़ शरणस्थान हो सकता है। पशु-आवास के प्रसंग में ‘दुर्गम गढ़’ उस सुरक्षित, पहुँच से बाहर चट्टानी स्थान का रूपकात्मक भाव रखता है।
