lexical_decisions:
- source_word: יִשְׂחַק
  choice: हँसता है
  rationale: शׂחק के काल रूप का सीधा अर्थ यहाँ जंगली गधे की नगर के शोर के प्रति उपेक्षा व्यक्त करता है; ‘हँसता है’ मूल की सजीवता बनाए रखता है।
- source_word: לַהֲמוֹן
  choice: कोलाहल पर
  rationale: הָמוֹן शोर, गहमागहमी या हलचल का बोध करा सकता है। ‘कोलाहल’ ध्वनि और व्यस्त हलचल—दोनों को स्वाभाविक हिंदी में समेटता है।
- source_word: קִרְיָה
  choice: नगर के
  rationale: קִרְיָה का अर्थ नगर या शहर है। ‘नगर’ काव्यात्मक गरिमा और आधुनिक बोधगम्यता दोनों बनाए रखता है।
- source_word: תְּשֻׁאוֹת
  choice: पुकारें
  rationale: बहुवचन संज्ञा ऊँची आवाज़ों या चिल्लाहटों को सूचित करती है। पशु को हाँकने के प्रसंग में ‘पुकारें’ स्वाभाविक है और बहुवचन भी सुरक्षित रखता है।
- source_word: נֹגֵשׂ
  choice: हाँकने वाले
  rationale: यह शब्द हाँकने, दबाव डालने या श्रम वसूलने वाले व्यक्ति को सूचित कर सकता है। पशु-संदर्भ में ‘हाँकने वाला’ सबसे उपयुक्त है और अनावश्यक रूप से ‘बेगार कराने वाला’ अर्थ नहीं थोपता।
- source_word: לֹא יִשְׁמָע
  choice: नहीं सुनता
  rationale: यह इब्रानी वाक्यांश का सीधा अनुवाद है। संदर्भ में ध्यान न देने का भाव संभव है, पर ‘नहीं सुनता’ मूल की अभिव्यक्ति और संभावित अर्थ-तनाव बनाए रखता है।
