translation:
  language: hi
  text: वह घाटी में खुरों से धरती खोदता है[a] और अपनी ताकत से खुश होता है; वह हथियारों[b] की ओर निकल पड़ता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘घाटी में धरती कुरेदता है।’ इब्रानी क्रिया का शाब्दिक अर्थ ‘खोदना’ है; यहाँ यह युद्ध के घोड़े द्वारा खुरों से जमीन कुरेदने की क्रिया के लिए प्रयुक्त हुई है।
    reason: lexical_alternative
  - marker: b
    text: या ‘युद्ध की ओर।’ इब्रानी संज्ञा हथियारों या शस्त्र-सामग्री को सामूहिक रूप से, और विस्तार से स्वयं युद्ध को भी सूचित कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְפְּרוּ
  choice: खुरों से धरती खोदता है
  rationale: חפר का मूल अर्थ ‘खोदना’ है; घोड़े के संदर्भ में यह खुरों से जमीन कुरेदने की क्रिया बताता है। यह हिंदी में चित्र को स्पष्ट रखते हुए मूल क्रिया का ठोस अर्थ भी बचाता है।
- source_word: בָעֵמֶק
  choice: घाटी में
  rationale: עֵמֶק का सामान्य अर्थ घाटी या नीची भूमि है; ‘घाटी में’ सीधा और स्वाभाविक अनुवाद है।
- source_word: וְיָשִׂישׂ
  choice: और ... हर्षित होता है
  rationale: שׂישׂ प्रबल आनंद या उल्लास व्यक्त करता है। ‘हर्षित होता है’ गरिमापूर्ण और आधुनिक हिंदी में सहज है।
- source_word: בְּכֹחַ
  choice: अपने बल पर
  rationale: בְּ के साथ כֹּחַ यहाँ घोड़े के अपने बल को उसके हर्ष का आधार या विषय बताता है। ‘अपने बल पर’ हिंदी में स्वाभाविक है, यद्यपि संबंध में हल्की अर्थगत व्यापकता बनी रहती है।
- source_word: יֵצֵא
  choice: निकल पड़ता है
  rationale: יצא का मूल अर्थ ‘निकलना’ है। प्रसंग में ‘निकल पड़ता है’ आगे बढ़ने का स्वाभाविक हिंदी भाव देता है, बिना ‘टूट पड़ता है’ जैसी अतिरिक्त तीव्रता जोड़े।
- source_word: לִקְרַאת
  choice: का सामना करने
  rationale: לקראת का अर्थ किसी से मिलने या उसकी ओर सामना करने जाना है। युद्ध-संदर्भ में ‘सामना करने’ स्वाभाविक है और अभिमुखता को स्पष्ट करता है।
- source_word: נָשֶׁק
  choice: हथियारों
  rationale: נשק मुख्यतः हथियारों या शस्त्र-सामग्री को दर्शाता है; ‘हथियारों’ ठोस सैन्य अर्थ को बनाए रखता है। व्यापक अर्थ ‘युद्ध’ को पादटिप्पणी में रखा गया है।
