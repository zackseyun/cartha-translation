base_translation:
  language: en
  yaml_path: translation/ot/job/039/004.yaml
  text: Their young ones become strong[a]; they grow up in the open field; they go out and do not return to them.
translation:
  language: hi
  text: उनके बच्चे हृष्ट-पुष्ट होते हैं; वे खुले मैदान में[a] बढ़ते हैं; वे निकल जाते हैं और उनके पास फिर नहीं लौटते।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जंगली प्रदेश में” या “खुले देश में।”
    reason: बַּבָּר के खुले, असंवर्धित अथवा जंगली भू-भाग वाले वैकल्पिक अर्थ को सुरक्षित रखता है।
lexical_decisions:
- source_word: יַחְלְמוּ
  choice: हृष्ट-पुष्ट होते हैं
  rationale: यहाँ חלם पशु-शावकों के स्वस्थ और बलवान होने को व्यक्त करता है। ‘हृष्ट-पुष्ट’ शारीरिक स्वास्थ्य और सुदृढ़ता दोनों को स्वाभाविक हिन्दी में समेटता है।
- source_word: בְנֵיהֶם
  choice: उनके बच्चे
  rationale: शाब्दिक अर्थ ‘उनके पुत्र/बच्चे’ है, पर पशुओं के संदर्भ में ‘बच्चे’ सहज है और नर शावकों तक अर्थ को सीमित नहीं करता।
- source_word: יִרְבּוּ
  choice: बढ़ते हैं
  rationale: רבה का मूल अर्थ बढ़ना अथवा बहुत होना है। यहाँ बच्चों के विकसित होने का भाव संदर्भानुकूल है; ‘बढ़ते हैं’ विकास और वृद्धि की कुछ अर्थगत खुली गुंजाइश भी बनाए रखता है।
- source_word: בַבָּר
  choice: खुले मैदान में
  rationale: בָּר यहाँ खेती की भूमि के विपरीत खुले, असंवर्धित भूभाग को दर्शाता है। ‘खुले मैदान में’ आधुनिक हिन्दी में स्पष्ट और दृश्यात्मक है।
- source_word: יָצְאוּ
  choice: वे निकल जाते हैं
  rationale: יצא की गति और माता से दूर चले जाने के संदर्भ को ‘निकल जाते हैं’ सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְלֹא שָׁבוּ לָמוֹ
  choice: और उनके पास फिर नहीं लौटते
  rationale: שוב के साथ ל माता-पशुओं के पास लौटने को दर्शाता है। ‘फिर नहीं लौटते’ स्वाभाविक हिन्दी है और इब्रानी से अधिक प्रबल ‘कभी नहीं’ नहीं जोड़ता।
