lexical_decisions:
- source_word: יִשְׂחַק
  choice: हँसता है
  rationale: שׂחק का मूल चित्र हँसने का है और यहाँ युद्ध में घोड़े की निर्भीक, लगभग उपहासपूर्ण प्रतिक्रिया व्यक्त होती है। ‘हँसता है’ इस सजीव रूपक को सीधे बनाए रखता है।
- source_word: לְפַחַד
  choice: भय पर
  rationale: פחד का अर्थ भय, दहशत या आतंक हो सकता है। לְ के साथ ‘भय पर हँसता है’ संक्षिप्त इब्रानी रचना और उसके भाव को स्वाभाविक हिंदी में सुरक्षित रखता है।
- source_word: יֵחָת
  choice: घबराता नहीं
  rationale: חתת के निफ़अल रूप में टूट जाने, भयभीत होने या हतोत्साहित होने का भाव है। युद्ध-संदर्भ में ‘घबराता नहीं’ मनोवैज्ञानिक अर्थ को सामान्य और स्पष्ट हिंदी में व्यक्त करता है।
- source_word: יָשׁוּב
  choice: पीछे नहीं हटता
  rationale: שׁוב का मूल अर्थ लौटना या मुड़ना है। युद्ध के संदर्भ में ‘पीछे नहीं हटता’ उसके पीछे लौटने अथवा पलटने के भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִפְּנֵי
  choice: के सामने से
  rationale: מִפְּנֵי का शाब्दिक भाव ‘के सामने से’ है और यहाँ किसी खतरे का सामना करते हुए उससे हटने की बात है। यह चयन इब्रानी बिंब को स्पष्ट रखता है।
- source_word: חָרֶב
  choice: तलवार
  rationale: חָרֶב एकवचन ‘तलवार’ है, जो यहाँ युद्ध और उसके हथियार के प्रतिनिधि बिंब के रूप में प्रयुक्त है।
