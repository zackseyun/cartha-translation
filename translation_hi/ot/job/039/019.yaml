- source_word: צַוָּארוֹ
  choice: उसकी गरदन
  rationale: पुल्लिंग एकवचन प्रत्यय घोड़े की ओर संकेत करता है। हिंदी में ‘उसकी’ व्याकरणिक रूप से ‘गरदन’ के स्त्रीलिंग के अनुरूप है और घोड़े के जैविक लिंग को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: רַעְמָה
  choice: अयाल
