translation:
  language: hi
  text: 'क्या तू उसे टिड्डे की तरह छलाँग लगवा सकता है?[a]


    उसकी फुँकार की महिमा भयावह है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या तू उसे टिड्डे की तरह गरजा सकता है?” इब्रानी क्रिया का अर्थ किसी को काँपने, झकझोरने, या तीव्रता से गतिमान करने का हो सकता है; कुछ लोग यहाँ गति के साथ ध्वनि का संकेत भी देखते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתַרְעִישֶׁנּוּ
  choice: क्या तू उसे ... उछाल सकता है?
  rationale: רעשׁ के हिफ़ील रूप में किसी को काँपने, झकझोरने या तीव्र गति करने का भाव हो सकता है। युद्ध के घोड़े और टिड्डे की उपमा के संदर्भ में ‘उछाल’ उसकी अचानक और प्रबल गति को स्वाभाविक हिन्दी में व्यक्त करता है; प्रश्नवाचक और कारक भाव दोनों बनाए रखे गए हैं।
- source_word: כָּאַרְבֶּה
  choice: टिड्डे के समान
  rationale: एकवचन אַרְבֶּה यहाँ जातिवाचक उपमा के रूप में है। ‘टिड्डे के समान’ काव्यात्मक और सहज हिन्दी है तथा तीव्र उछाल की छवि बनाए रखता है।
- source_word: הוֹד
  choice: प्रताप
  rationale: הוֹד वैभव, महिमा या प्रभावशाली गरिमा को दर्शाता है। घोड़े की भव्य और आतंककारी उपस्थिति के लिए ‘प्रताप’ संक्षिप्त, dignified और संदर्भानुकूल है।
- source_word: נַחְרוֹ
  choice: उसकी फुँकार
  rationale: यह शब्द नथनों से बलपूर्वक निकलती साँस या फुँकार को सूचित करता है। ‘फुँकार’ घोड़े की श्रव्य और दृश्य दोनों छवियों को स्वाभाविक हिन्दी में सामने लाती है।
- source_word: אֵימָה
  choice: भयावह है
  rationale: संज्ञा אֵימָה का अर्थ भय या आतंक है। हिन्दी में विधेयात्मक ‘भयावह है’ मूल नाममात्र वाक्य की तीव्रता को सहज रूप में व्यक्त करता है।
