  language: hi
  text: क्या तू उन महीनों को गिनता है जिन्हें वे पूरा करती हैं[a], और क्या तू उस समय को जानता है जब वे बच्चे जनती हैं?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक मुहावरेदार ढंग से, “उनके महीने पूरे होने तक क्या तू उन्हें गिनता है?” इब्रानी में क्रिया सक्रिय है—शाब्दिक रूप से, “वे महीनों को पूरा करती हैं”—और आशय गर्भकाल पूरा होने से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּסְפֹּר
  choice: क्या तू ... गिनता है
  rationale: ספר के कालगत रूप को इस आलंकारिक प्रश्न में स्वाभाविक वर्तमान के रूप में रखा गया है; एकवचन अनौपचारिक ‘तू’ ईश्वर द्वारा अय्यूब को किए गए सीधे संबोधन के अनुरूप है।
- source_word: יְרָחִים
  choice: उन महीनों को
  rationale: संज्ञा का सामान्य अर्थ ‘महीने’ है; ‘उन’ गर्भावधि के संबंधित महीनों को सहज रूप से निर्दिष्ट करता है, बिना ‘चंद्र-मास’ जैसी अनावश्यक व्याख्या जोड़े।
- source_word: תְּמַלֶּאנָה
  choice: जिन्हें वे पूरा करती हैं
  rationale: 'मूल के स्त्रीलिंग बहुवचन सक्रिय रूप को सुरक्षित रखा गया है: मादा पशु गर्भावधि के महीनों को पूरा करती हैं। हिंदी में संबंधवाचक उपवाक्य वाक्य को स्पष्ट बनाता है।'
- source_word: וְיָדַעְתָּ
  choice: और क्या तू ... जानता है
  rationale: संयोजक और आलंकारिक प्रश्नों की समानांतर शृंखला दोनों को बनाए रखा गया है।
- source_word: עֵת
  choice: उस समय को
  rationale: עת का सीधा और प्रसंगानुकूल अर्थ ‘समय’ है; ‘नियत समय’ संभव है, पर मूल से अधिक व्याख्यात्मक होगा।
- source_word: לִדְתָּנָה
  choice: जब वे बच्चे जनती हैं
  rationale: ילד के क्रियार्थक संज्ञा-रूप और स्त्रीलिंग बहुवचन प्रत्यय को स्वाभाविक हिंदी कालवाचक उपवाक्य में व्यक्त किया गया है; ‘बच्चे’ पशुओं की संतान को साधारण पाठक के लिए स्पष्ट करता है।
