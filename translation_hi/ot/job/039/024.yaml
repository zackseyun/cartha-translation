  text: कोलाहल और रोष में वह धरती को निगलता जाता है[a]; तुरही की ध्वनि पर वह स्थिर नहीं रह सकता[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “धरती को निगलता है”; यह घोड़े की तीव्र गति और युद्ध में आगे बढ़ने की उत्कंठा का सजीव चित्र है।'
    reason: lexical_alternative
  - marker: b
    text: या, “तुरही की ध्वनि पर वह अपने को रोक नहीं पाता।” इब्रानी क्रिया का सामान्य अर्थ “विश्वास करना” है; इसलिए एक अधिक शाब्दिक समझ “वह विश्वास नहीं करता कि तुरही की ध्वनि है” भी संभव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרַעַשׁ וְרֹגֶז
  choice: उग्र आवेग और रोष में
  rationale: दोनों संज्ञाएँ घोड़े की हिंसक हलचल, उत्तेजना और प्रचंड भावावेग को व्यक्त करती हैं। यह पदबंध उनके समानांतर तीव्र प्रभाव को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: יְגַמֶּא אָרֶץ
  choice: वह धरती को निगलता जाता है
  rationale: גמא का मूल चित्र ‘निगलने’ का है; धरती के साथ यह युद्ध के लिए दौड़ते घोड़े की तीव्र गति को दर्शाता है। ‘निगलता जाता है’ रूपक और निरंतर आगे बढ़ने, दोनों भावों को सुरक्षित रखता है।
- source_word: וְלֹא יַאֲמִין
  choice: वह स्थिर नहीं रह सकता
  rationale: אמן के हिफ़ील रूप का सामान्य अर्थ ‘विश्वास करना’ है, पर यहाँ युद्ध-घोड़े के संदर्भ में इसे अपने स्थान पर टिके रहने या स्वयं को रोके रखने के अर्थ में समझना अधिक संगत है। मुख्य पाठ में संदर्भानुकूल अर्थ दिया गया है और शाब्दिक संभावना पादटिप्पणी में रखी गई है।
- source_word: כִּי קוֹל שׁוֹפָר
  choice: तुरही की आवाज़ सुनकर
  rationale: כִּי यहाँ उस परिस्थिति को प्रस्तुत करता है जिसमें घोड़ा स्थिर नहीं रह सकता। שׁוֹפָר युद्ध-संकेत देने वाला सींग या तुरही है; ‘तुरही’ सामान्य हिन्दी पाठक के लिए सहज है।
