- source_word: הֲתַאֲמִין בּוֹ
  choice: क्या तू उस पर भरोसा करेगा
  rationale: हिफ़ील रूप यहाँ जंगली बैल की विश्वसनीयता पर व्यावहारिक भरोसा रखने की बात करता है; प्रश्नवाचक הֲ को ‘क्या’ से व्यक्त किया गया है।
- source_word: כִּי
  choice: कि
  rationale: यह उस बात की विषय-वस्तु प्रस्तुत करता है जिस पर भरोसा करने का प्रश्न है।
- source_word: יָשׁוּב
  choice: लौटा लाएगा
  rationale: मूल अर्थ ‘लौटना’ है, पर सकर्मक संदर्भ में खेत से उपज को वापस लाने का भाव है।
- source_word: זַרְעֶךָ
  choice: तेरा बीज
  rationale: यह हिब्रू के शाब्दिक रूप को सुरक्षित रखता है; कृषि-संदर्भ में इसका आशय काटी हुई फसल या अनाज भी हो सकता है।
- source_word: גָרְנְךָ
  choice: तेरे खलिहान में
  rationale: גֹּרֶן अनाज झाड़ने या मँड़ाई करने की जगह है; आधुनिक हिन्दी में ‘खलिहान’ इसका सहज और सटीक समतुल्य है।
- source_word: יֶאֱסֹף
  choice: उसे ... इकट्ठा करेगा
  rationale: क्रिया का अर्थ ‘इकट्ठा करना’ है; हिन्दी में स्पष्टता के लिए ‘उसे’ जोड़ा गया है, जो पहले आए ‘बीज’ की ओर संकेत करता है।
