  text: כְּנַף רְנָנִ֥ים נֶעֱלָ֑סָה אִם אֶ֝בְרָ֗ה חֲסִידָ֥ה וְ/נֹצָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/013.yaml
  text: The wings of the ostrich flap joyfully—are they the pinions and plumage of the stork?[a]
translation:
  language: hi
  text: शुतुरमुर्ग के पंख आनन्द से फड़फड़ाते हैं—क्या वे लगलग के उड़ान-पंख और पर हैं?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शुतुरमुर्ग के पंख गर्व से फड़फड़ाते हैं, पर क्या वे लगलग के उड़ान-पंख और पर हैं?” इस पद का इब्रानी पाठ कठिन है और इसे कई प्रकार से समझा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: כְּנַף
  choice: पंख
  rationale: इब्रानी में एकवचन सामूहिक अर्थ में है; हिन्दी में ‘पंख’ स्वाभाविक रूप से दोनों पंखों का बोध कराता है।
- source_word: רְנָנִים
  choice: शुतुरमुर्ग के
  rationale: पशुओं पर आधारित इस प्रसंग और आगे के वर्णन में यह दुर्लभ पद शुतुरमुर्ग को सूचित करता है, यद्यपि इसकी व्युत्पत्ति पुकारने या हर्षध्वनि से जुड़ी हो सकती है।
- source_word: נֶעֱלָסָה
  choice: आनन्द से फड़फड़ाते हैं
  rationale: क्रिया में उल्लास और गतिशीलता दोनों का भाव है; पंखों के साथ यह अनुवाद दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אִם
  choice: क्या वे
  rationale: यहाँ पद एक प्रश्नात्मक, अलंकारिक तुलना आरम्भ करता है; मूल की संक्षिप्तता को यथासम्भव बनाए रखते हुए प्रश्न स्पष्ट किया गया है।
- source_word: אֶבְרָה
  choice: उड़ान-पंख
  rationale: यह पूरे पंख के बजाय उड़ने में काम आने वाले बड़े पंखों या कलगीदार पंख-भाग को सूचित करता है; ‘उड़ान-पंख’ सामान्य पाठक के लिए ‘परवाज़ी पिच्छ’ से अधिक स्पष्ट है।
- source_word: חֲסִידָה
  choice: लगलग के
  rationale: इस प्राणी-सूची में इसका अर्थ पक्षी ‘स्टॉर्क’ है; मानक हिन्दी नाम ‘लगलग’ चुना गया है।
- source_word: וְנֹצָה
  choice: और पर
  rationale: संज्ञा पंखों या परों के समूह को सूचित करती है; ‘पर’ काव्यात्मक गरिमा रखते हुए सामान्य हिन्दी में सहज है।
theological_decisions:
- issue: दूसरे अर्ध-वाक्य का कठिन और संदिग्ध इब्रानी विन्यास
  choice: इसे लगलग के पंखों से प्रश्नात्मक तुलना के रूप में रखा गया है
  alternative: 'इसे विरोधात्मक कथन के रूप में पढ़ना: ‘पर क्या वे लगलग के उड़ान-पंख और पर हैं?’'
  rationale: אִם प्रश्न या तुलना आरम्भ कर सकता है और पद में स्पष्ट क्रिया नहीं है। प्रश्नात्मक रूप मूल की अनिश्चितता तथा दोनों पक्षियों के बीच निहित विरोध को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘लगलग’ मानक हिन्दी पक्षी-नाम है; ‘उड़ान-पंख’ तकनीकी अर्थ को सरल ढंग से स्पष्ट करता है। मूल इब्रानी की कठिनता को मुख्य पाठ में प्रश्न और पाद-टिप्पणी में वैकल्पिक विरोधात्मक पठन द्वारा सुरक्षित रखा गया है।
