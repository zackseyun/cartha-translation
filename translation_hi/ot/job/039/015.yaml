  text: and she forgets that a foot may crush them[b][a], and a wild animal may trample them.
translation:
  language: hi
  text: और वह भूल जाती है कि किसी का पाँव उन्हें कुचल सकता है[a], और कोई जंगली पशु उन्हें रौंद सकता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसे कुचल सकता है … उसे रौंद सकता है।” स्त्रीलिंग एकवचन प्रत्यय संभवतः सामूहिक रूप से पीछे छोड़े गए अंडों या बच्चों की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשְׁכַּח
  choice: और वह भूल जाती है
  rationale: यह क़ाल वय्यिक्तोल, स्त्रीलिंग एकवचन रूप है और शुतुरमुर्ग के वर्णन को आगे बढ़ाता है। काव्य के इस सजीव वर्णन में वर्तमान काल स्वाभाविक है।
- source_word: כִּי
  choice: कि
  rationale: यहाँ כִּי भूली हुई बात की विषय-वस्तु प्रस्तुत करता है, कारण नहीं।
- source_word: רֶגֶל
  choice: कोई पैर
  rationale: एकवचन संज्ञा यहाँ अनिश्चित अर्थ रखती है—किसी भी जीव या व्यक्ति का पैर। यह ठोस बिंब को बनाए रखता है।
- source_word: תְּזוּרֶהָ
  choice: उन्हें कुचल सकता है
  rationale: इस प्रसंग में क्रिया पैर से दबकर हानि होने का संकेत देती है। स्त्रीलिंग एकवचन प्रत्यय का संदर्भ सामूहिक रूप से पीछे छोड़े गए अंडों से है, इसलिए स्वाभाविक हिन्दी में बहुवचन ‘उन्हें’ रखा गया है।
- source_word: וְחַיַּת הַשָּׂדֶה
  choice: और कोई जंगली पशु
  rationale: शाब्दिक अर्थ ‘मैदान का पशु’ है; ‘जंगली पशु’ आधुनिक हिन्दी में सहज है और खुले क्षेत्र में रहने वाले वन्य जीव का आशय स्पष्ट करता है।
- source_word: תְּדוּשֶׁהָ
  choice: उन्हें रौंद सकता है
  rationale: דושׁ का मूल अर्थ पैर तले चलना या रौंदना है। ‘रौंदना’ पिछले खंड के समानांतर स्वाभाविक और सटीक है; प्रत्यय को सामूहिक संदर्भ के कारण ‘उन्हें’ कहा गया है।
