lexical_decisions:
- source_word: עָלָיו
  choice: उसके ऊपर
  rationale: עַל के साथ तृतीय पुरुष एकवचन प्रत्यय घोड़े के सापेक्ष हथियारों की स्थिति बताता है। ‘उसके ऊपर’ स्थानगत बिंब को बनाए रखता है और शत्रुतापूर्ण अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: תִּרְנֶה
  choice: खनखनाता है
  rationale: यह काव्यात्मक क्रिया यहाँ युद्ध-सामग्री की तीखी, धातुमय ध्वनि व्यक्त करती है। तरकश के संदर्भ में ‘खनखनाता है’ स्वाभाविक और चित्रात्मक है।
- source_word: אַשְׁפָּה
  choice: तरकश
  rationale: यह तीर रखने के पात्र का सामान्य हिब्रू शब्द है; आधुनिक हिन्दी में ‘तरकश’ इसका मानक और संक्षिप्त पर्याय है।
- source_word: לַהַב
  choice: चमकती धार
  rationale: शाब्दिक अर्थ ‘लौ’ अथवा ‘धार’ है। हथियारों के साथ यह उनकी चमकती हुई धार का काव्यात्मक बिंब प्रस्तुत करता है।
- source_word: חֲנִית
  choice: भाला
  rationale: यह भाले के लिए सामान्य हिब्रू शब्द है; ‘भाला’ हिन्दी का व्यापक और प्रचलित समतुल्य है।
- source_word: כִידוֹן
  choice: बरछी
  rationale: यह חֲנִית से भिन्न, अपेक्षाकृत हल्के या फेंके जाने वाले नुकीले हथियार को सूचित कर सकता है। ‘बरछी’ दोनों हथियारों का भेद बनाए रखती है।
