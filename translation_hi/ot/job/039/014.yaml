  yaml_path: translation/ot/job/039/014.yaml
  text: For she leaves her eggs to the earth and warms them on the dust,[a]
translation:
  language: hi
  text: क्योंकि वह अपने अंडे धरती पर छोड़ देती है और उन्हें धूल पर गरम रखती है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “धरती पर अपने अंडे त्याग देती है।” इब्रानी क्रिया का अर्थ केवल “छोड़ना” से अधिक प्रबल हो सकता है; पर अगली पंक्ति पूर्ण परित्याग के बजाय भूमि पर खुले पड़े रहने का संकेत देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले वर्णन का कारण या स्पष्टीकरण प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: תַעֲזֹב
  choice: छोड़ देती है
  rationale: עזב का अर्थ ‘छोड़ना, त्यागना’ हो सकता है। यहाँ ‘छोड़ देती है’ स्वाभाविक है और पूर्ण परित्याग का अर्थ अनावश्यक रूप से निश्चित नहीं करता।
- source_word: לָאָרֶץ
  choice: धरती पर
  rationale: यद्यपि इब्रानी में संबंधसूचक उपसर्ग का रूप शाब्दिक रूप से ‘धरती को/के लिए’ है, हिन्दी में अंडों की स्थिति बताने के लिए ‘धरती पर’ सहज और संदर्भानुकूल है।
- source_word: בֵּצֶיהָ
  choice: अपने अंडे
  rationale: स्त्रीलिंग एकवचन संबंधवाचक प्रत्यय को हिन्दी में कर्ता-संबंधी ‘अपने’ से स्वाभाविक रूप में व्यक्त किया गया है।
- source_word: וְעַל עָפָר
  choice: और ... धूल पर
  rationale: עָפָר की ठोस काव्यात्मक छवि को ‘धूल’ द्वारा बनाए रखा गया है; עַל का सीधा अर्थ ‘पर’ है।
- source_word: תְּחַמֵּם
  choice: गरम रखती है
  rationale: पिएल रूप का अर्थ ‘गरम करना’ है। प्रसंग में हिन्दी का ‘गरम रखती है’ निरंतर ऊष्मा देने का स्वाभाविक बोध देता है, बिना तकनीकी ‘सेती है’ या ‘ऊष्मायित करती है’ अपनाए।
