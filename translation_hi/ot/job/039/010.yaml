  text: הֲֽ/תִקְשָׁר רֵ֭ים בְּ/תֶ֣לֶם עֲבֹת֑/וֹ אִם יְשַׂדֵּ֖ד עֲמָקִ֣ים אַחֲרֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/010.yaml
  text: Will you bind the wild ox in the furrow with its rope[b][a], or will it harrow the valleys behind you?
translation:
  language: hi
  text: 'क्या तुम जंगली बैल[a] को उसकी रस्सी से हल की कूँड़ में बाँध सकते हो,

    या क्या वह तुम्हारे पीछे-पीछे घाटियों में पाटा चलाएगा[b]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘आदिम जंगली बैल’ अथवा ‘जंगली साँड़’। इब्रानी शब्द רֵים एक शक्तिशाली जंगली गोवंशी पशु को दर्शाता है, पुराने अनुवादों के पौराणिक ‘एकसिंगा’ को नहीं।
    reason: lexical_alternative
  - marker: b
    text: या ‘घाटियों को जोतेगा?’ इब्रानी क्रिया का अधिक विशिष्ट अर्थ मिट्टी पर पाटा चलाना या उसे समतल करना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתִקְשָׁר
  choice: क्या तुम…बाँध सकते हो
  rationale: קשׁר का मूल अर्थ बाँधना है। प्रश्नवाचक הֲ को सामर्थ्य को चुनौती देने वाले स्वाभाविक हिन्दी प्रश्न के रूप में व्यक्त किया गया है।
- source_word: רֵים
  choice: जंगली बैल
  rationale: यह शब्द एक शक्तिशाली जंगली गोवंशी पशु का द्योतक है। ‘जंगली बैल’ आधुनिक पाठक के लिए स्पष्ट है और पुराने अनुवादों के पौराणिक ‘एकसिंगा’ अर्थ से बचता है।
- source_word: בְּתֶלֶם
  choice: हल की कूँड़ में
  rationale: תלם हल चलाने से बनी कूँड़ या रेखा को दर्शाता है। ‘हल की कूँड़’ कृषि-संदर्भ को स्पष्ट और ठोस रखता है।
- source_word: עֲבֹתוֹ
  choice: उसकी रस्सी से
  rationale: עבות मोटी डोरी या रस्सी है और प्रत्यय उसी जंगली बैल की ओर संकेत करता है। करण के लिए ‘से’ स्वाभाविक हिन्दी है।
- source_word: אִם
  choice: या
  rationale: यहाँ אִם शर्त नहीं, समानांतर अलंकारिक प्रश्न का दूसरा विकल्प आरम्भ करता है।
- source_word: יְשַׂדֵּד
  choice: पाटा चलाएगा
  rationale: इस कृषि-संदर्भ में क्रिया जोती हुई मिट्टी को तोड़ने, बराबर करने या हैरो चलाने जैसे काम का संकेत देती है। ‘पाटा चलाना’ आरम्भिक जुताई से इसे अलग रखते हुए हिन्दी कृषि-प्रयोग में स्वाभाविक है।
- source_word: עֲמָקִים
  choice: घाटियों में
  rationale: शब्द का सामान्य अर्थ घाटियाँ या नीची भूमि है। हिन्दी में कृषि-क्रिया के स्थान को ‘में’ द्वारा व्यक्त करना स्वाभाविक है।
- source_word: אַחֲרֶיךָ
  choice: तुम्हारे पीछे-पीछे
  rationale: यह किसान के पीछे निर्देशित होकर चलते पशु का जीवंत चित्र देता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और ग्रामीण कृषि-चित्र के अनुरूप रखी गई है। ‘कूँड़’ और ‘पाटा चलाना’ विशिष्ट कृषि-शब्द हैं, पर प्रसंग में सहज बोधगम्य हैं। समानांतर अलंकारिक प्रश्न और मूल की चुनौतीपूर्ण ध्वनि सुरक्षित रखी गई है।
