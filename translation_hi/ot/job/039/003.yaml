- source_word: תִּכְרַעְנָה
  choice: वे झुककर बैठती हैं
  rationale: כרע शरीर को नीचे झुकाने या घुटनों पर आने का बोध कराता है। पशुओं के प्रसव के संदर्भ में ‘झुककर बैठती हैं’ स्वाभाविक है और क्रिया की शारीरिक मुद्रा को स्पष्ट करता है।
- source_word: יַלְדֵיהֶן
  choice: अपने बच्चों को
  rationale: यहाँ ילד से बना रूप जन्मी हुई संतानों को दर्शाता है। पशुओं के लिए भी सामान्य हिंदी में ‘बच्चे’ सहज और स्पष्ट है।
- source_word: תְּפַלַּחְנָה
  choice: जन्म देती हैं
  rationale: इस प्रसव-संदर्भ में क्रिया बच्चों को उत्पन्न करने या बाहर लाने को व्यक्त करती है। ‘जन्म देती हैं’ आधुनिक हिंदी में स्पष्ट है और अनावश्यक अस्पष्टता से बचता है।
- source_word: חֶבְלֵיהֶם
  choice: अपनी प्रसव-पीड़ा
  rationale: חבל के अनेक अर्थ हो सकते हैं, पर यहाँ प्रसव का तत्काल संदर्भ ‘प्रसव-पीड़ा’ को अपेक्षित करता है। सामूहिक अर्थ के कारण हिंदी में एकवचन भाववाचक रूप स्वाभाविक है।
- source_word: תְּשַׁלַּחְנָה
  choice: दूर कर देती हैं
  rationale: שלח का मूल भाव भेजने, छोड़ने या मुक्त करने का है। पीड़ा के साथ ‘दूर कर देती हैं’ हिंदी में स्वाभाविक रहते हुए उसके विदा हो जाने की काव्यात्मक छवि बनाए रखता है।
