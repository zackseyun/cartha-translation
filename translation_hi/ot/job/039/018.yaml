lexical_decisions:
- source_word: כָּעֵת
  choice: जब ... तब
  rationale: यह पदबंध यहाँ समय या परिस्थिति का संकेत देता है। हिन्दी में ‘जब ... तब’ काव्यात्मक संबंध को स्वाभाविक और स्पष्ट बनाता है।
- source_word: בַּמָּרוֹם
  choice: ऊँचाई की ओर
  rationale: מָרוֹם ऊँचाई या ऊँचे स्थान का बोध कराता है। यह रूप ऊपर उठने की दिशा बताता है, पर पक्षी के पूरी तरह उड़ने का दावा नहीं करता।
- source_word: תַּמְרִיא
  choice: अपने को उठाती है
  rationale: हिफ़ील रूप ऊपर उठने या स्वयं को ऊँचा करने का भाव दे सकता है। यह अनिश्चितता बनाए रखता है कि यहाँ दौड़ते समय पंख उठाने, फड़फड़ाने या ऊपर उछलने में से कौन-सा सूक्ष्म भाव अभिप्रेत है।
- source_word: תִּשְׂחַק
  choice: हँसती है
  rationale: שׂחק का अर्थ हँसना और प्रसंगानुसार उपहास करना हो सकता है। ‘पर हँसती है’ हिन्दी में दोनों भावों को निकट रखता है।
- source_word: לַסּוּס
  choice: घोड़े
  rationale: सप्रत्यय एकवचन यहाँ जातिवाचक है; हिन्दी में ‘घोड़े’ स्वाभाविक रूप से सामान्य वर्ग का बोध कराता है।
- source_word: וּלְרֹכְבוֹ
  choice: और उसके सवार
  rationale: सर्वनामिक प्रत्यय का स्वाभाविक संबंध घोड़े से है। ‘उसके सवार’ इस संबंध को स्पष्ट रखते हुए मूल संरचना को सुरक्षित रखता है।
