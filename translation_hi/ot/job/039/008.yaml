- source_word: הָרִים
  choice: पहाड़ों में
  rationale: הָרִים का सीधा अर्थ ‘पहाड़’ है; क्रिया और चराई के प्रसंग में हिन्दी का अधिकरण ‘पहाड़ों में’ स्वाभाविक रूप से क्षेत्र बताता है।
- source_word: מִרְעֵהוּ
  choice: चरने के लिए
  rationale: מִרְעֶהוּ का आशय उसके चरने की जगह अथवा चराई से है। हिन्दी में यह उद्देश्यसूचक वाक्यांश सहज है, जबकि स्वामित्व का भाव संदर्भ में निहित रहता है।
- source_word: וְאַחַר
  choice: और ... की
  rationale: אַחַר के साथ דרשׁ खोज में किसी वस्तु के पीछे लगने का भाव देता है; हिन्दी में ‘की खोज करना’ उसी संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כָּל
  choice: हर
  rationale: यहाँ כָּל का वितरणात्मक अर्थ है; ‘हर’ उपलब्ध हरी बढ़वार की व्यापक खोज को व्यक्त करता है।
- source_word: יָרוֹק
  choice: हरी वनस्पति
  rationale: יָרוֹק यहाँ ताज़ी हरी बढ़वार या खाने योग्य हरियाली को सूचित करता है। ‘हरी वनस्पति’ आधुनिक हिन्दी में स्पष्ट है और इसे किसी एक प्रकार के पौधे तक सीमित नहीं करती।
- source_word: יִדְרֹשׁ
  choice: खोज करता है
  rationale: דרשׁ का Qal रूप इस पशु-आहार प्रसंग में सक्रिय रूप से ढूँढ़ने का अर्थ देता है; ‘खोज करता है’ गरिमापूर्ण और सहज हिन्दी है।
