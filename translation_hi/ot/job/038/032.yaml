base_translation:
  language: en
  yaml_path: translation/ot/job/038/032.yaml
  text: Can you bring out the Mazzaroth in its season[b][a], or guide Ayish along with her children?
translation:
  language: hi
  text: क्या तू मज़्ज़ारोत को उसके नियत समय पर प्रकट कर सकता है[a], या अयिश को उसके बच्चों सहित मार्ग दिखा सकता है[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “मज़्ज़ारोत” एक दुर्लभ हिब्रू खगोलीय शब्द है; संभवतः इसका अर्थ नक्षत्र-समूह या राशिचक्र है।
    reason: lexical_alternative
  - marker: b
    text: “अयिश” एक हिब्रू तारा-नाम या नक्षत्र-नाम है। कुछ अंग्रेज़ी अनुवादों में इसे परंपरागत रूप से “आर्कटूरस” कहा गया है; अनेक विद्वान इसे “भालू” नक्षत्र मानते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתֹצִיא
  choice: क्या तू ... निकाल सकता है
  rationale: יצא के हिफ़ील रूप का कारक अर्थ है—आकाशीय पिंडों को उनके समय पर प्रकट होने के लिए बाहर लाना। प्रश्न की आलंकारिक शक्ति बनाए रखने के लिए इसे सामर्थ्यसूचक प्रश्न के रूप में रखा गया है।
- source_word: מַזָּרוֹת
  choice: मज़्ज़ारोत
  rationale: यह एक दुर्लभ और अनिश्चित खगोलीय शब्द है। किसी निश्चित अर्थ, जैसे ‘राशिचक्र’ या ‘नक्षत्रों’, को थोपने के बजाय लिप्यंतरण रखा गया है और संभावित अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: בְּעִתּוֹ
  choice: उसके नियत समय पर
  rationale: यह अभिव्यक्ति उसके उचित अथवा निर्धारित प्रकट होने के समय को सूचित करती है; ‘नियत समय’ खगोलीय संदर्भ में स्वाभाविक और स्पष्ट है।
- source_word: וְעַיִשׁ
  choice: और अयिश
  rationale: यह भी अनिश्चित तारा-नाम या नक्षत्र-नाम है। परंपरागत पहचान को मुख्य पाठ में निश्चित न मानते हुए हिब्रू नाम का लिप्यंतरण किया गया है।
- source_word: עַל בָּנֶיהָ
  choice: तथा उसके बच्चों को
  rationale: हिब्रू में स्त्रीलिंग रूपक के साथ शाब्दिक अर्थ ‘उसके बच्चों’ है, जो संभवतः साथ के तारों को दर्शाता है। पारिवारिक रूपक और स्त्रीलिंग संबंध दोनों सुरक्षित रखे गए हैं।
- source_word: תַנְחֵם
  choice: मार्ग दिखा सकता है
  rationale: נחה के हिफ़ील रूप में अगुवाई या मार्गदर्शन का भाव है। क्रिया के बहुवचन कर्म-प्रत्यय को ‘अयिश तथा उसके बच्चों को’ संयुक्त कर्म बनाकर स्पष्ट किया गया है।
