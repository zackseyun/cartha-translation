  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और प्रत्यक्ष संबोधन रखा गया है। दुर्लभ खगोलीय नामों को अनिश्चितता बनाए रखने के लिए देवनागरी में लिप्यंतरित किया गया है; संभावित पहचानों को पादटिप्पणियों तक सीमित रखा गया है।
