translation:
  language: hi
  text: 'ताकि वह उजाड़ और वीरान भूमि को तृप्त करे,

    और घास की कोपलें फूटने दे?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְהַשְׂבִּיעַ
  choice: तृप्त करे
  rationale: हिब्रानी क्रिया का मूल भाव ‘भर देना/तृप्त करना’ है; वर्षा द्वारा सूखी भूमि को पर्याप्त जल मिलने का चित्र बनाए रखता है।
- source_word: שֹׁאָה וּמְשֹׁאָה
  choice: उजाड़ और सुनसान भूमि
  rationale: दो निकटार्थक शब्द वीरानी और निर्जनता को बल देते हैं। ‘भूमि’ संदर्भ से स्पष्ट है और हिन्दी में वाक्य को स्वाभाविक बनाता है।
- source_word: מֹצָא דֶשֶׁא
  choice: घास की नई कोंपलें
  rationale: מֹצָא का अर्थ यहाँ निकलना/उपजना अथवा निकली हुई वृद्धि है। ‘नई कोंपलें’ अंकुरित होकर बाहर आने के दृश्य को सहज हिन्दी में व्यक्त करता है।
- source_word: לְהַצְמִיחַ
  choice: उगाए
  rationale: हिफ़ील रूप का कारक अर्थ ‘उगाना/अंकुरित कराना’ है।
theological_decisions:
- issue: निर्जन भूमि पर परमेश्वर की वर्षा का उद्देश्य
  choice: मानव उपयोग से परे उजाड़ भूमि को भी तृप्त करने वाली परमेश्वर की क्रिया को यथावत रखा गया
  alternative: इसे मानव-केंद्रित कृषि-सिंचाई के रूप में स्पष्ट करना
  rationale: मूल पाठ निर्जन क्षेत्र पर वर्षा और वहाँ वनस्पति उगने पर बल देता है; इसमें कोई अतिरिक्त मानव-केंद्रित उद्देश्य नहीं जोड़ा जाना चाहिए।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। पद पूर्ववर्ती प्रश्न-श्रृंखला का उद्देश्यसूचक अंश है, इसलिए अंत में प्रश्नचिह्न रखा गया है।
