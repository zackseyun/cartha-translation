lexical_decisions:
- source_word: אֲשֶׁר
  choice: जिसे
  rationale: यह संबंधवाचक शब्द पिछले पद में वर्णित ओलों के भंडार की ओर संकेत करता है; हिन्दी में कर्म के रूप में “जिसे” स्वाभाविक है।
- source_word: חָשַׂכְתִּי
  choice: मैंने … बचाकर रखा है
  rationale: क्रिया में रोक रखने, बचाए रखने या किसी भावी प्रयोजन के लिए सुरक्षित रखने का अर्थ है। प्रसंग में “बचाकर रखा है” उद्देश्यपूर्ण आरक्षण को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְעֶת צָר
  choice: संकट के समय के लिए
  rationale: לְ उद्देश्य अथवा नियत अवसर दर्शाता है, और צָר यहाँ संकट या विपत्ति का समय बताता है।
- source_word: לְיוֹם קְרָב וּמִלְחָמָה
  choice: संग्राम और युद्ध के दिन के लिए
  rationale: दोनों निकटार्थक सैन्य शब्दों को एक में मिलाने के बजाय उनकी इब्रानी जोड़ी बनाए रखी गई है। “संग्राम” और “युद्ध” गरिमापूर्ण तथा सामान्यतः बोधगम्य हैं।
theological_decisions:
- issue: न्याय अथवा संघर्ष में प्राकृतिक शक्तियों का परमेश्वर द्वारा सुरक्षित रखा जाना
  choice: सीधा अर्थ बनाए रखा गया है कि परमेश्वर ने इन प्राकृतिक शक्तियों को संकट, संग्राम और युद्ध के अवसर के लिए बचाकर रखा है।
  alternative: इसे केवल ईश्वरीय देखरेख का रूपक मानना और सैन्य संदर्भ को मंद कर देना।
  rationale: पद स्वयं “संग्राम और युद्ध के दिन” का स्पष्ट उल्लेख करता है; अनुवाद इस तनावपूर्ण चित्र को न तो नरम करता है, न उससे आगे कोई धर्मसैद्धांतिक निष्कर्ष जोड़ता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल किंतु गरिमापूर्ण शैली रखी गई है। वाक्य पिछले पद से जुड़ा संबंधवाचक उपवाक्य है और अय्यूब 38 में चल रहे परमेश्वर के प्रश्न का अंत होने के कारण प्रश्नचिह्न रखा गया है।
