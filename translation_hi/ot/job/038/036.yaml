  text: Who has put wisdom in the inward parts[a], or who has given understanding to the mind?
translation:
  language: hi
  text: 'किसने भीतरी भागों में बुद्धि रखी है,[a]

    या किसने मन को समझ-बूझ दी है?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः, “किसने छिपे हुए भागों में बुद्धि रखी है, या किसने मुर्गे को समझ-बूझ दी है?” दूसरे विवादित शब्द को कुछ लोग मन के बजाय किसी पक्षी—परंपरागत रूप से “मुर्गा,” और कभी-कभी “आइबिस”—के अर्थ में लेते हैं।
    reason: विवादित दुर्लभ शब्दों के वैकल्पिक अर्थ को सुरक्षित रखना।
lexical_decisions:
- source_word: מִי
  choice: किसने
  rationale: यह प्रश्नवाचक सर्वनाम परमेश्वर के आलंकारिक प्रश्न को आरम्भ करता है; हिन्दी वाक्य-रचना के अनुसार कर्ता के साथ ‘ने’ लगाया गया है।
- source_word: שָׁת
  choice: रखी है
  rationale: मूल क्रिया का अर्थ ‘रखना/स्थापित करना’ है; ‘रखी है’ सहज हिन्दी है और חָכְמָה के स्त्रीलिंग के अनुरूप है।
- source_word: בַּטֻּחוֹת
  choice: अंतर्मन में
  rationale: यह दुर्लभ और विवादित शब्द भीतर या छिपे हुए अंगों/भागों का संकेत दे सकता है। ‘अंतर्मन’ आंतरिक मानवीय सत्ता का भाव स्वाभाविक हिन्दी में देता है, जबकि वैकल्पिक अर्थ पाद-टिप्पणी में सुरक्षित है।
- source_word: חָכְמָה
  choice: बुद्धि
  rationale: यह חָכְמָה का प्रचलित हिन्दी समतुल्य है और अगले खंड के ‘समझ’ के साथ काव्यात्मक समानांतरता बनाए रखता है।
- source_word: אוֹ
  choice: या
  rationale: दो समानांतर प्रश्नखंडों को जोड़ने वाला साधारण विकल्पसूचक संयोजक।
- source_word: נָתַן
  choice: दी है
  rationale: נתן का सामान्य अर्थ ‘देना’ है; यह पहले खंड की ‘रखी है’ के समानांतर स्वाभाविक रूप से बैठता है।
- source_word: לַשֶּׂכְוִי
  choice: मन को
  rationale: यह अत्यंत विवादित संज्ञा है। पहले खंड के आंतरिक भाग और ‘बुद्धि/समझ’ की समानांतरता के कारण मुख्य पाठ में आंतरिक बोध-शक्ति अर्थात ‘मन’ चुना गया है; पक्षी-संबंधी अर्थ पाद-टिप्पणी में रखा गया है।
- source_word: בִינָה
  choice: समझ
  rationale: यह अंतर्दृष्टि और विवेकपूर्ण समझ का सामान्य आधुनिक हिन्दी शब्द है तथा ‘बुद्धि’ से संबंधित किंतु अलग अर्थछाया बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय वाणी में दो दुर्लभ शब्दों का मनुष्य की आंतरिक क्षमताओं अथवा पक्षियों के सहज ज्ञान के रूप में अर्थ
  choice: मुख्य पाठ परमेश्वर द्वारा मनुष्य के अंतर्मन और मन को बुद्धि तथा समझ देने की बात करता है।
  alternative: पद का आशय यह भी हो सकता है कि परमेश्वर ने छिपे हुए भागों में बुद्धि रखी और मुर्गे अथवा आइबिस जैसे पक्षी को सहज समझ दी।
  rationale: काव्यात्मक समानांतरता मुख्य पाठ में दोनों पदों को आंतरिक मानवीय क्षमताओं के रूप में लेने का समर्थन करती है। फिर भी पक्षी वाला अर्थ प्राचीन, प्रसिद्ध और भाषिक रूप से संभव है, इसलिए उसे बिना नकारे पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। काव्यात्मक समानांतरता के लिए ‘अंतर्मन/मन’ और ‘बुद्धि/समझ’ रखा गया है। पाद-टिप्पणी चिह्न [a] मुख्य पाठ में उपस्थित है।
