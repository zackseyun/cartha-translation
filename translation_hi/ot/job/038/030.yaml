  text: 'जल पत्थर के समान अपने को छिपा लेता है[a],

    और अथाह जल की सतह जमकर ठोस हो जाती है[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक शाब्दिक रूप में, “जल पत्थर के समान अपने को छिपा लेता है।” यहाँ इब्रानी क्रिया का प्रयोग असामान्य है; संदर्भ में इसका आशय जल का जमकर कठोर हो जाना भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “अथाह जल की सतह कसकर जुड़ जाती है” या “एक साथ बँध जाती है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּאֶבֶן
  choice: पत्थर के समान
  rationale: उपसर्ग כ तुलना व्यक्त करता है; इसलिए इसे रूपांतरण ('पत्थर बन जाता है') के बजाय उपमा के रूप में रखा गया है।
- source_word: מַיִם
  choice: जल
  rationale: यह द्विवचन-रूपी संज्ञा प्रायः सामूहिक द्रव्यवाचक अर्थ रखती है; आधुनिक हिन्दी में 'जल' काव्यात्मक और स्वाभाविक है।
- source_word: יִתְחַבָּאוּ
  choice: छिप जाता है
  rationale: क्रिया का सामान्य अर्थ 'अपने को छिपाना' है। असामान्य संदर्भगत प्रयोग को मुख्य पाठ में सुरक्षित रखा गया है; जमकर कठोर होने का संभावित आशय पादटिप्पणी में दिया गया है।
- source_word: וּפְנֵי
  choice: और ... की सतह
  rationale: जल के प्रसंग में शाब्दिक 'मुख' का स्वाभाविक हिन्दी अर्थ 'सतह' है।
- source_word: תְהוֹם
  choice: अथाह जल
  rationale: תהום विशाल, गहरे जल-भंडार को दर्शाता है। 'अथाह जल' आधुनिक पाठक के लिए स्पष्ट है और केवल 'गहराई' की अमूर्तता से बचता है।
- source_word: יִתְלַכָּדוּ
  choice: जमकर बँध जाती है
  rationale: मूल क्रिया पकड़े जाने, कसकर जुड़ने या बँधने का बिंब देती है; शीत के संदर्भ में 'जमकर' अर्थ स्पष्ट करता है और 'बँध जाती है' मूल रूपक बचाता है।
