  text: מִֽי פִלַּ֣ג לַ/שֶּׁ֣טֶף תְּעָלָ֑ה וְ֝/דֶ֗רֶךְ לַ/חֲזִ֥יז קֹלֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/025.yaml
  text: Who has cut a channel for the flood[a], or a path for the thunderbolt,
translation:
  language: hi
  text: 'किसने मूसलाधार वर्षा के लिए नाला काटा है,[a]

    और गरजती बिजली के लिए मार्ग बनाया है?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बाढ़ के पानी के लिए नाला काटा है।” अंतिम पंक्ति का अधिक शाब्दिक रूप है, “आवाज़ों की बिजली के लिए मार्ग।”
    reason: शֶׁטֶף ‘मूसलाधार वर्षा’ या ‘बाढ़ का पानी’ और חֲזִיז קֹלוֹת दुर्लभ, शाब्दिक रूप से असामान्य पदबंध है; इसलिए वास्तविक शब्दार्थगत अस्पष्टता सुरक्षित रखी गई है।
lexical_decisions:
- source_word: פִלַּג
  choice: काटा है
  rationale: क्रिया का अर्थ चीरकर या बाँटकर जल के लिए मार्ग बनाना है; ‘नाला काटा’ हिंदी में इस ठोस बिंब को स्वाभाविक रूप से व्यक्त करता है।
- source_word: שֶּׁטֶף
  choice: मूसलाधार वर्षा
  rationale: यह शब्द उमड़ते जल, बाढ़ या प्रचंड वर्षा को सूचित कर सकता है। इस मौसम-संबंधी समानांतरता में ‘मूसलाधार वर्षा’ स्वाभाविक है, जबकि ‘बाढ़ का पानी’ भी संभव है।
- source_word: תְּעָלָה
  choice: नाला
  rationale: जल बहने के लिए बनाई गई नाली या जलधारा का मार्ग अभिप्रेत है; ‘नाला’ सामान्य आधुनिक हिंदी में स्पष्ट और काव्यात्मक संदर्भ में सहज है।
- source_word: דֶרֶךְ
  choice: मार्ग
  rationale: यहाँ आकाश में निर्धारित दिशा या पथ का बिंब है; ‘मार्ग’ गरिमापूर्ण और स्पष्ट है।
- source_word: חֲזִיז קֹלוֹת
  choice: गरजती बिजली
  rationale: दुर्लभ חֲזִיז का अर्थ बिजली या वज्रपात है और קֹלוֹת का शाब्दिक अर्थ ‘आवाज़ें’ है, जो मौसम के प्रसंग में गर्जन को सूचित करता है। ‘गरजती बिजली’ मुहावरेदार हिंदी में दोनों तत्वों को बनाए रखती है।
