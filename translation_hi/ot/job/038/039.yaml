  text: 'क्या तुम सिंहनी के लिए शिकार करते हो,

    और जवान सिंहों की भूख मिटाते हो?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, इब्रानी में ‘जवान सिंहों के जीवन’ को ‘भरने’ की भाषा है; संदर्भ में इसका अर्थ उनकी भूख तृप्त करना है।
    reason: मूल इब्रानी में ‘भरने’ और जवान सिंहों के ‘जीवन’ से संबद्ध अभिव्यक्ति है, जो यहाँ उनकी भूख या आहार-आवश्यकता पूरी करने का भाव देती है।
lexical_decisions:
- source_word: הֲ/תָצ֣וּד
  choice: क्या तुम ... शिकार करते हो
  rationale: प्रश्नवाचक הֲ और צוד के अपूर्ण रूप से अय्यूब को संबोधित आलंकारिक प्रश्न बनता है; वर्तमानकालीन सामान्य क्रिया हिंदी में इस संदर्भ को स्वाभाविक रूप से व्यक्त करती है।
- source_word: לְ/לָבִ֣יא
  choice: सिंहनी के लिए
  rationale: לָבִיא का अर्थ सिंह या सिंहनी हो सकता है; जवान सिंहों के लिए आहार जुटाने के संदर्भ में स्त्रीलिंग अर्थ उपयुक्त है, पर मूल शब्द की व्यापकता को पादटिप्पणी में रखा गया है।
- source_word: טָ֑רֶף
  choice: शिकार
  rationale: यह शब्द फाड़े गए शिकार अथवा मांसाहारी पशु के आहार को दर्शाता है; ‘शिकार’ शिकारी संदर्भ को बनाए रखता है।
- source_word: וְ/חַיַּ֖ת
  choice: भूख
  rationale: מלא के साथ यह शब्द यहाँ जवान सिंहों के जीवन, प्राण या जीवित भूख को भरने की सामी अभिव्यक्ति है; हिंदी में ‘भूख’ सहज अर्थ देता है।
- source_word: כְּפִירִ֣ים
  choice: जवान सिंहों
  rationale: כפירים युवा सिंहों को दर्शाता है; ‘जवान सिंह’ शावकों की अपेक्षा उम्र को कम संकीर्ण ढंग से व्यक्त करता है।
- source_word: תְּמַלֵּֽא
  choice: मिटाते हो
  rationale: मूल क्रिया का शाब्दिक अर्थ ‘भरना’ है; ‘भूख मिटाना’ हिंदी का स्वाभाविक मुहावरा है और आशय को स्पष्ट रखता है।
