    reason: lexical_alternative
lexical_decisions:
- source_word: הֲמִיָּמֶיךָ
  choice: अपने जीवन में कभी
  rationale: מן + ‘तेरे दिन’ यहाँ अय्यूब के जीवनकाल में किसी भी समय का प्रश्न करता है। हिंदी में ‘अपने जीवन में कभी’ इस इब्रानी मुहावरे का स्वाभाविक और स्पष्ट अर्थ देता है।
- source_word: צִוִּיתָ
  choice: आज्ञा दी है
  rationale: क्रिया का सामान्य अर्थ अधिकारपूर्वक आज्ञा देना है; सृष्टि पर प्रभुता की चुनौती का बल बना रहता है।
- source_word: בֹּקֶר
  choice: भोर
  rationale: यह प्रातःकाल को मानवीकृत सृष्टिगत वास्तविकता के रूप में प्रस्तुत करता है और काव्यात्मक हिंदी में स्वाभाविक है।
- source_word: יָדַעְתָּה
  choice: बताया है
  rationale: ידע का हिफ़ील रूप कारणवाचक है—‘जानने दिया/अवगत कराया।’ ‘स्थान बताया’ हिंदी में इस कारणवाचक भाव और उषा के मानवीकरण को सहज रूप से व्यक्त करता है।
- source_word: שַׁחַר
  choice: उषा
  rationale: שַׁחַר दिन निकलने की पहली आभा है। ‘उषा’ काव्यात्मक समानांतरता बनाए रखते हुए ‘भोर’ से शब्दगत भेद भी रखता है।
- source_word: מְקוֹמוֹ
  choice: उसका स्थान
  rationale: מקום का सीधा अर्थ ‘स्थान’ है; ‘नियत स्थान’ जोड़ना मूल से अधिक व्याख्यात्मक होता।
