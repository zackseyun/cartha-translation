source:
  edition: WLC
  text: וַ/יַּֽעַן יְהוָ֣ה אֶת אִ֭יּוֹב מנ ה/סערה וַ/יֹּאמַֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/001.yaml
  text: Then Yahweh answered Job out of the whirlwind and said:[a]
translation:
  language: hi
  text: तब याहवे ने तूफ़ान में से अय्यूब को उत्तर दिया और कहा:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बवंडर में से।”
    reason: סְעָרָה का अर्थ प्रचंड तूफ़ान के साथ अधिक विशिष्ट रूप से ‘बवंडर’ भी हो सकता है।
lexical_decisions:
- source_word: וַיַּעַן
  choice: उत्तर दिया
  rationale: कथात्मक रूप में ענה का सामान्य अर्थ ‘उत्तर देना’ है; यह अय्यूब के पिछले कथनों से संबंध भी बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: אֶת אִיּוֹב
  choice: अय्यूब को
  rationale: אֵת प्रत्यक्ष कर्म का चिह्न है; हिन्दी में कर्म को ‘को’ से व्यक्त किया गया और नाम का प्रचलित हिन्दी रूप रखा गया है।
- source_word: מִן־הַסְּעָרָה
  choice: तूफ़ान में से
  rationale: סְעָרָה तेज़ आँधी, तूफ़ान या बवंडर का बोध करा सकता है। ‘तूफ़ान’ आधुनिक हिन्दी में व्यापक, स्वाभाविक विकल्प है और मूल की अनिश्चित विशिष्टता को बनाए रखता है।
- source_word: וַיֹּאמַר
  choice: और कहा
  rationale: यह אמר के कथात्मक क्रमिक रूप का सीधा और स्वाभाविक हिन्दी अनुवाद है; कर्ता पहले ही स्पष्ट है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। ‘याहवे’ उस नाम को उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: ईश्वरीय प्रकटन के प्रसंग में סְעָרָה की विशिष्टता
  choice: तूफ़ान
  alternative: बवंडर
  rationale: इब्रानी शब्द व्यापक रूप से प्रचंड तूफ़ान को सूचित कर सकता है और अनिवार्यतः घूमते हुए बवंडर तक सीमित नहीं है। मुख्य पाठ व्यापक अर्थ रखता है और पादटिप्पणी अधिक विशिष्ट सम्भावना सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप रखा गया है। ‘अय्यूब’ प्रचलित हिन्दी बाइबिलीय नाम है और ‘याहवे’ मूल व्यक्तिगत नाम का स्पष्ट लिप्यंतरण है।
