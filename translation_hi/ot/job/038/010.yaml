  text: when I prescribed my boundary for it and set bars and doors,[a]
translation:
  language: hi
  text: जब मैंने उसके लिए अपनी सीमा ठहरा दी और अर्गला तथा किवाड़ लगा दिए,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जब मैंने उसके लिए अपना विधान निश्चित किया”; इब्रानी क्रिया का सामान्य अर्थ “तोड़ना” है, पर यहाँ संभवतः समुद्र की सीमा निर्धारित करने का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁבֹּר
  choice: ठहरा दी
  rationale: שׁבר का सामान्य अर्थ ‘तोड़ना’ है, पर यहाँ समुद्र को रोकने के प्रसंग में किसी सीमा को निश्चित करने का भाव अधिक उपयुक्त है। ‘ठहरा दी’ इस प्रसंगगत अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עָלָיו
  choice: उसके लिए
  rationale: पुल्लिंग एकवचन प्रत्यय पिछले पद के समुद्र की ओर संकेत करता है। ‘सीमा ठहराना’ के साथ ‘उसके लिए’ स्वाभाविक हिन्दी है।
- source_word: חֻקִּי
  choice: अपनी सीमा
  rationale: חֹק का अर्थ विधान, आदेश अथवा निर्धारित सीमा हो सकता है। समुद्र को रोकने के तत्काल प्रसंग में ‘सीमा’ ठोस अर्थ को व्यक्त करती है, जबकि दैवी निर्धारण का भाव भी बना रहता है।
- source_word: וָאָשִׂים
  choice: लगा दिए
  rationale: שׂים का मूल भाव रखना या स्थापित करना है। अर्गला और किवाड़ के साथ ‘लगा दिए’ स्वाभाविक हिन्दी प्रयोग है।
- source_word: בְּרִיחַ
  choice: अर्गला
  rationale: यह द्वार को बंद रखने वाले आड़े दंड या मजबूत बेड़े को सूचित करता है। ‘अर्गला’ स्थापत्य बिंब को संक्षेप और गरिमा के साथ बनाए रखता है।
- source_word: וּדְלָתָיִם
  choice: किवाड़
  rationale: द्विवचन रूप दो पल्लों वाले द्वार का संकेत देता है। हिन्दी में ‘किवाड़’ स्वाभाविक रूप से द्वार के पल्लों का बोध कराता है और समुद्र को बंद किए जाने का चित्र सुरक्षित रखता है।
theological_decisions:
- issue: समुद्र पर परमेश्वर के शासन का मानवरूपी चित्रण
  choice: परमेश्वर द्वारा सीमा ठहराने और अर्गला तथा किवाड़ लगाने का ठोस चित्र बनाए रखा गया।
  alternative: बिंब को हटाकर केवल प्रकृति पर परमेश्वर की संप्रभुता का अमूर्त कथन करना।
  rationale: इब्रानी कविता परमेश्वर की संप्रभुता को स्थापत्य के सजीव बिंब द्वारा व्यक्त करती है। इसे बनाए रखना काव्य-बल और मूल पाठ के धर्मवैचारिक तनाव, दोनों का सम्मान करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक शैली रखी गई है। ‘अर्गला’ अपेक्षाकृत साहित्यिक शब्द है, पर किवाड़ को रोकने वाले आड़े दंड का सटीक बिंब देता है; वाक्य-संरचना सरल रखी गई है।
