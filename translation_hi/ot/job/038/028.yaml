  text: Does the rain have a father[a], or who has begotten the drops of dew?
translation:
  language: hi
  text: 'क्या वर्षा का कोई पिता है,

    या किसने ओस की बूँदों को जन्म दिया?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲיֵשׁ לַמָּטָר אָב
  choice: क्या वर्षा का कोई पिता है
  rationale: प्रश्नवाचक הֲ के साथ יֵשׁ और संबंधसूचक לְ यहाँ अस्तित्व के द्वारा अधिकार/संबंध व्यक्त करते हैं। आधुनिक हिन्दी में ‘क्या वर्षा का कोई पिता है’ इस प्रश्न और पिता के रूपक को स्वाभाविक रूप से सुरक्षित रखता है।
- source_word: אוֹ מִי
  choice: या किसने
  rationale: सरल विकल्पसूचक ‘या’ और प्रत्यक्ष प्रश्नवाचक ‘किसने’ दोनों समानांतर प्रश्नों को स्पष्ट रूप से जोड़ते हैं।
- source_word: הוֹלִיד
  choice: जन्म दिया
  rationale: ילד का हिफ़ील रूप उत्पन्न करने या जनने का भाव रखता है। ‘जन्म दिया’ आधुनिक, सहज हिन्दी है और पहले चरण के ‘पिता’ से जुड़ी जनन-छवि को बनाए रखता है।
- source_word: אֶגְלֵי טָל
  choice: ओस की बूँदों
  rationale: रचनात्मक संबंध में אֶגְלֵי का अर्थ ‘बूँदें’ और טָל का अर्थ ‘ओस’ है। यह हिन्दी में ठोस काव्यात्मक चित्र को स्वाभाविक ढंग से व्यक्त करता है।
