  text: Their light is withheld from the wicked[b][a], and the uplifted arm is broken.
translation:
  language: hi
  text: दुष्टों का प्रकाश उनसे रोक लिया जाता है, और ऊँची उठी हुई भुजा[b] तोड़ दी जाती है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तोड़ दी जाएगी।” इब्रानी अपूर्ण क्रिया को सजीव वर्तमान के साथ-साथ भविष्यकाल में भी समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “भुजा” संभवतः सामर्थ्य या शक्ति, विशेषकर हिंसक शक्ति, का प्रतीक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִמָּנַע
  choice: रोक लिया जाता है
  rationale: מנע का निफ़अल अपूर्ण रूप निष्क्रिय भाव व्यक्त करता है—प्रकाश को दुष्टों तक पहुँचने से रोका जाता है। वर्तमानकालीन अभिव्यक्ति काव्य में भोर के प्रभाव का सजीव वर्णन करती है।
- source_word: מֵרְשָׁעִים
  choice: दुष्टों से
  rationale: מִן अलगाव का भाव देता है; इसलिए प्रकाश दुष्ट लोगों से रोक लिया जाता है। ‘दुष्टों’ में अनावश्यक रूप से लिंग निर्दिष्ट नहीं होता।
- source_word: אוֹרָם
  choice: उनका प्रकाश
  rationale: प्रत्यय सहित אוֹרָם का सीधा अर्थ ‘उनका प्रकाश’ है और यह उस प्रकाश को दर्शाता है जिसका दुष्ट लोग लाभ उठाते।
- source_word: וּזְרוֹעַ
  choice: और ... भुजा
  rationale: זְרוֹעַ का मूल अर्थ ‘भुजा’ है; इसे बनाए रखने से शक्ति, विशेषकर हिंसक सामर्थ्य, का काव्यात्मक रूपक भी सुरक्षित रहता है।
- source_word: רָמָה
  choice: उठी हुई
  rationale: רום से बना यह रूप ऊँचा उठाए जाने का भाव देता है। ‘उठी हुई’ स्वाभाविक हिन्दी है और आक्रमण या घमंड से उठी शक्ति की छवि बनाए रखती है।
- source_word: תִּשָּׁבֵר
  choice: तोड़ दी जाती है
  rationale: שבר का निफ़अल अपूर्ण रूप निष्क्रिय अर्थ देता है। यहाँ वर्तमानकालीन सामान्य या सजीव वर्णन प्रसंग के अनुकूल है, जबकि भविष्यकाल भी व्याकरणतः संभव है।
