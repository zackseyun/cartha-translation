  yaml_path: translation/ot/job/038/018.yaml
  text: Have you comprehended the expanse of the earth? Tell me, if you know it all.
translation:
  language: hi
  text: क्या तूने पृथ्वी के विस्तार को समझा है? बता, यदि तू उसे पूरी तरह जानता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִתְבֹּנַנְתָּ
  choice: समझ लिया है
  rationale: हित्पोएल रूप यहाँ ध्यानपूर्वक विचार करके समझने या पूरी तरह जान लेने का भाव देता है; प्रश्न में निहित चुनौती को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: רַחֲבֵי אָרֶץ
  choice: पृथ्वी के विस्तार
  rationale: बहुवचन רַחֲבֵי पृथ्वी की व्यापक फैलावट या विस्तृत क्षेत्रों को सूचित करता है; ‘विस्तार’ हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: כֻלָּהּ
  choice: उसे पूरा
  rationale: स्त्रीलिंग प्रत्यय का संकेत אָרֶץ अर्थात पृथ्वी की ओर है; यह अनुवाद ‘पृथ्वी को उसकी संपूर्णता में’ जानने का भाव बनाए रखता है, न कि अस्पष्ट ‘यह सब’ का।
theological_decisions:
- issue: परमेश्वर द्वारा अय्यूब को संबोधन
  choice: तू
  alternative: तुम
  rationale: हिब्रू में एकवचन संबोधन है। आधुनिक हिन्दी में ‘तू’ इस प्रत्यक्ष, गंभीर दैवी संबोधन को बनाए रखता है और यहाँ अपमानसूचक आशय नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। दोनों प्रश्नात्मक/आज्ञार्थक खंडों में मूल की सीधी चुनौती सुरक्षित है; किसी व्याख्यात्मक भूगोल या अतिरिक्त धर्मवैज्ञानिक अर्थ को नहीं जोड़ा गया।
