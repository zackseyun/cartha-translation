  yaml_path: translation/ot/job/038/007.yaml
  text: when the morning stars sang together[a], and all the sons of God shouted for joy?
translation:
  language: hi
  text: 'जब भोर के तारे मिलकर गा रहे थे,

    और परमेश्वर के सभी पुत्र[a] आनन्द से जयजयकार कर रहे थे?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या “स्वर्गीय प्राणी” अथवा “स्वर्गदूत।” इब्रानी में: “परमेश्वर के पुत्र।”'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּ/רָן
  choice: जब ... गा रहे थे
  rationale: बे उपसर्ग सहित क्रिया का infinitive construct यहाँ समयसूचक उपवाक्य बनाता है। רנן उल्लासपूर्ण गायन या पुकार व्यक्त करता है; समानांतर पंक्ति के कारण ‘गा रहे थे’ स्वाभाविक है।
- source_word: יַחַד
  choice: मिलकर
  rationale: यह एक साथ या एक स्वर में होने का भाव देता है; ‘मिलकर’ आधुनिक हिन्दी में सामूहिकता को सहज रूप से व्यक्त करता है।
- source_word: כּוֹכְבֵי בֹקֶר
  choice: भोर के तारे
  rationale: शाब्दिक संरचना ‘भोर/सुबह के तारे’ है। ‘भोर के तारे’ काव्यात्मक बिंब को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וַ/יָּרִיעוּ
  choice: आनन्द से जयजयकार कर रहे थे
  rationale: हिफ़ील रूप ऊँची, प्रायः उल्लासपूर्ण पुकार उठाने को दर्शाता है। प्रसंग और समानांतर गायन सकारात्मक उत्सव का भाव स्पष्ट करते हैं।
- source_word: כָּל
  choice: सभी
  rationale: यह समूह की संपूर्णता पर बल देता है और हिन्दी में ‘सभी’ इसका सीधा तथा स्वाभाविक रूप है।
- source_word: בְּנֵי אֱלֹהִים
  choice: परमेश्वर के पुत्र
  rationale: इब्रानी पदबंध का सीधा अर्थ ‘परमेश्वर के पुत्र’ है। मुख्य पाठ में इसे बनाए रखने से स्वर्गीय प्राणियों की पहचान को व्याख्यात्मक रूप से ‘स्वर्गदूत’ कहकर सीमित नहीं किया जाता।
theological_decisions:
- issue: בְּנֵי אֱלֹהִים की पहचान
  choice: मुख्य पाठ में ‘परमेश्वर के पुत्र’
  alternative: ‘स्वर्गीय प्राणी’ या ‘स्वर्गदूत’
  rationale: अय्यूब में यह पदबंध सम्भवतः स्वर्गीय सभा के प्राणियों को सूचित करता है, पर ‘स्वर्गदूत’ कहना व्याख्या को मूल अभिव्यक्ति पर आरोपित करेगा। शाब्दिक पदबंध वास्तविक धर्मवैज्ञानिक तनाव और अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक और गरिमापूर्ण शैली रखी गई है। पद पिछले प्रसंग से जुड़ा प्रश्न है, इसलिए अन्त में प्रश्नचिह्न रखा गया है।
