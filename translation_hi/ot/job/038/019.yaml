  yaml_path: translation/ot/job/038/019.yaml
  text: Where is the way to the dwelling of light[a], and where is the place of darkness,
translation:
  language: hi
  text: वह मार्ग कहाँ है जहाँ प्रकाश रहता है[a], और अन्धकार का स्थान कहाँ है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक शाब्दिक रूप में, “कौन-सा है वह मार्ग जहाँ प्रकाश वास करता है, और अन्धकार—उसका स्थान कहाँ है?”
    reason: मूल इब्रानी की प्रश्नवाचक रचना को अधिक औपचारिक ढंग से दिखाने वाला वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: אֵי זֶה
  choice: कहाँ है
  rationale: यह प्रश्नवाचक पदबंध स्थान या दिशा पूछता है। आधुनिक हिन्दी में ‘कहाँ है’ इसका स्वाभाविक अर्थ व्यक्त करता है।
- source_word: הַדֶּרֶךְ
  choice: वह मार्ग
  rationale: דֶּרֶךְ का अर्थ ‘मार्ग, रास्ता, पथ’ है। ‘मार्ग’ गरिमापूर्ण और सहज है तथा प्रकाश तक पहुँचने के रास्ते की छवि बनाए रखता है।
- source_word: יִשְׁכָּן
  choice: जहाँ ... रहता है
  rationale: שׁכן का मूल अर्थ ‘रहना, बसना, निवास करना’ है। यह अनुवाद प्रकाश को मानो किसी निवास में रहने वाला दिखाने वाली काव्यात्मक छवि को सुरक्षित रखता है।
- source_word: אוֹר
  choice: प्रकाश
  rationale: यह ब्रह्माण्डीय प्रकाश के लिए मानक हिन्दी शब्द है और अन्धकार के साथ स्पष्ट विरोध बनाए रखता है।
- source_word: וְחֹשֶׁךְ
  choice: और अन्धकार
  rationale: सरल संयोजक और संज्ञा को यथावत रखते हुए दोनों समानान्तर प्रश्नों को जोड़ा गया है।
- source_word: מְקֹמוֹ
  choice: अन्धकार का स्थान
  rationale: מָקוֹם का अर्थ ‘स्थान’ है और तृतीय पुरुष एकवचन प्रत्यय अन्धकार की ओर संकेत करता है। हिन्दी में ‘अन्धकार का स्थान’ स्पष्ट और स्वाभाविक है।
theological_decisions: []
