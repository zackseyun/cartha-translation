  footnotes:
  - marker: a
    text: या “जब धूल ढलकर कठोर हो जाती है” अथवा “जब धूल ढली हुई धातु के समान कठोर हो जाती है।” इब्रानी में भूमि के जमकर सघन होने के लिए उँडेलने या ढालने का बिंब प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצֶקֶת
  choice: जब ... जमकर
  rationale: यह रूप प्रसंग में समयवाचक उपवाक्य आरम्भ करता है। मूल क्रिया में उँडेलने/ढालने और जमने का बिंब है; धूल के संदर्भ में ‘जमकर’ भूमि के सघन होने का स्वाभाविक अर्थ देता है।
- source_word: עָפָר
  choice: धूल
  rationale: यह शब्द धूल या ढीली मिट्टी को सूचित करता है; यहाँ सामान्य पदार्थ के रूप में ‘धूल’ उपयुक्त है।
- source_word: לַמּוּצָק
  choice: ठोस पिंड
  rationale: יצק से बना यह रूप किसी ढाली हुई अथवा जमकर ठोस हुई वस्तु को सूचित कर सकता है। ‘ठोस पिंड’ परिणाम को स्पष्ट करता है और धातु का बिंब अनावश्यक रूप से प्रमुख नहीं बनाता।
- source_word: וּרְגָבִים
  choice: और मिट्टी के ढेले
  rationale: רְגָבִים मिट्टी के ढेलों या पिंडों को दर्शाता है; ‘मिट्टी के ढेले’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: יְדֻבָּקוּ
  choice: आपस में चिपक जाते हैं
  rationale: निष्क्रिय/गहन रूप मिट्टी के ढेलों के एक-दूसरे से जुड़ने या चिपकने को दर्शाता है। ‘आपस में चिपक जाते हैं’ भौतिक बिंब को सहज हिन्दी में बनाए रखता है।
