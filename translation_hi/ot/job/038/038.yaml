  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘जमकर ठोस पिंड’ मूल के ढालने और ठोस होने के संयुक्त बिंब को मुख्य पाठ में स्वाभाविक रूप से व्यक्त करता है; अधिक शाब्दिक विकल्प पादटिप्पणी में सुरक्षित हैं।
