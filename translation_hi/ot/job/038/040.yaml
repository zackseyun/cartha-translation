  text: when they crouch in their dens and lie in wait in the thicket?[a]
translation:
  language: hi
  text: जब वे अपनी माँदों में दुबकते हैं और झुरमुट में घात लगाकर बैठे रहते हैं?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आड़ में” अथवा “ओट में।” यहाँ इब्रानी शब्द סֻכָּה से आशय घात लगाने योग्य छिपने की जगह से है, न कि पर्व के लिए बनाई गई झोंपड़ी से।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: जब
  rationale: ईश्वरीय प्रश्न के इस क्रम में यह उस परिस्थिति या समय को बताता है जिसमें सिंह शिकार की घात में रहते हैं; इसलिए कालवाचक ‘जब’ स्वाभाविक है।
- source_word: יָשֹׁחוּ
  choice: दुबकते हैं
  rationale: यहाँ नीचे झुककर छिपने की शिकारी मुद्रा अभिप्रेत है। ‘दुबकते हैं’ पशु-संदर्भ में सहज और अर्थानुकूल है।
- source_word: בַמְּעוֹנוֹת
  choice: अपनी माँदों में
  rationale: מְעוֹנוֹת निवास-स्थानों या पशुओं की माँदों को सूचित करता है। सिंहों के संदर्भ में ‘माँदों’ उपयुक्त है; ‘अपनी’ हिंदी में संदर्भगत संबंध स्पष्ट करता है।
- source_word: יֵשְׁבוּ ... לְמוֹ אָרֶב
  choice: घात लगाकर बैठे रहते हैं
  rationale: יֵשְׁבוּ का मूल भाव बैठने या टिके रहने का है और לְמוֹ אָרֶב घात का प्रयोजन बताता है। संयुक्त अनुवाद दोनों घटकों को बनाए रखते हुए स्वाभाविक हिंदी देता है।
- source_word: בַסֻּכָּה
  choice: झुरमुट में
  rationale: यहाँ סֻכָּה पर्व की निर्मित झोंपड़ी नहीं, बल्कि घात के लिए उपयुक्त आड़ या प्राकृतिक ओट है। पशु-संदर्भ में ‘झुरमुट’ सहज है।
