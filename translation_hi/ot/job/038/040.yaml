  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘घात लगाकर बैठे रहते हैं’ मूल के बैठने और घात—दोनों भावों को व्यक्त करता है; प्रश्नचिह्न पूर्ववर्ती पद से चल रहे आलंकारिक प्रश्न को दर्शाता है।
