  yaml_path: translation/ot/job/038/026.yaml
  text: to make it rain on a land where no man is[a], on a wilderness in which there is no human,
translation:
  language: hi
  text: कि वह किसी भूमि पर वर्षा कराए जहाँ कोई मनुष्य नहीं है, किसी निर्जन प्रदेश पर जहाँ कोई मानव नहीं है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְהַמְטִיר
  choice: वर्षा कराए
  rationale: हिफ़ील क्रिया का कारणवाचक अर्थ है—वर्षा होने देना या कराना। हिंदी में “वर्षा कराए” इसे संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֶרֶץ
  choice: उस भूमि
  rationale: यहाँ אֶרֶץ पूरी पृथ्वी नहीं, बल्कि वर्षा पाने वाले एक भूभाग को दर्शाता है। पद पूर्ववर्ती वाक्य से जुड़ा है, इसलिए हिंदी में “उस भूमि” सहज है।
- source_word: לֹא אִישׁ
  choice: जहाँ कोई मनुष्य नहीं है
  rationale: אִישׁ एक व्यक्ति/मनुष्य को सूचित करता है। यह अस्तित्ववाचक अभिव्यक्ति हिंदी में स्वाभाविक है और पहले समानांतर पद को स्पष्ट रखती है।
- source_word: מִדְבָּר
  choice: निर्जन प्रदेश
  rationale: מִדְבָּר केवल रेतीले रेगिस्तान तक सीमित नहीं, बल्कि अनबसे, असंवर्धित वन्य भूभाग का भी बोध कराता है। “निर्जन प्रदेश” संदर्भ के मानवरहित पहलू और व्यापक अर्थ दोनों को व्यक्त करता है।
- source_word: לֹא אָדָם בּוֹ
  choice: जहाँ कोई मानव नहीं रहता
  rationale: אָדָם यहाँ मानव जाति के किसी सदस्य के सामान्य अर्थ में है। “मानव” पहले प्रयुक्त “मनुष्य” से हल्का शब्दगत भेद बनाए रखता है; “नहीं रहता” בּוֹ के स्थानगत भाव को स्वाभाविक हिंदी देता है।
theological_decisions:
- issue: אָדָם का सामान्य मानवता-सूचक अर्थ
  choice: मानव
  alternative: मनुष्य / मानवजाति
  rationale: यहाँ אָדָם किसी विशेष पुरुष का नहीं, सामान्यतः मानव का बोध कराता है। “मानव” उस व्यापक अर्थ को सुरक्षित रखता है और समानांतर אִישׁ के अनुवाद “मनुष्य” से स्रोत का शब्दगत भेद भी कुछ हद तक बनाए रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिंदी। पद पिछले वाक्य के उद्देश्यसूचक प्रवाह से जुड़ता है, इसलिए आरंभ में “कि” रखा गया है। समानांतरता बनाए रखते हुए अनावश्यक शाब्दिक कठोरता से बचा गया है।
