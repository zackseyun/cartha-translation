translation:
  language: hi
  text: कि तू उसे उसकी सीमा तक ले जाए[a], और उसके घर को जाने वाली राहों को समझे[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उसे’ और ‘उसकी’ जैसे एकवचन सर्वनाम आसपास के संदर्भ में प्रकाश या अंधकार में से किसी एक की ओर संकेत कर सकते हैं (अय्यूब 38:19–20)।
    reason: cross_reference
  - marker: b
    text: या, “और उसके घर को जाने वाले मार्गों को समझे?”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: कि
  rationale: यह पिछले पद के प्रश्न से जुड़ा अधीनस्थ वाक्य आरम्भ करता है। ‘कि’ उद्देश्य/परिणाम की छाया को खुला रखते हुए इब्रानी वाक्य-संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: תִקָּחֶנּוּ
  choice: तू उसे ... ले जाए
  rationale: לקח का अर्थ यहाँ ‘ले जाना/पहुँचाना’ है। द्वितीय पुरुष एकवचन और पुल्लिंग एकवचन कर्म-प्रत्यय को ‘तू’ और ‘उसे’ से व्यक्त किया गया है; संभावनार्थक क्रियारूप आलंकारिक प्रश्न के अनुकूल है।
- source_word: אֶל גְּבוּלוֹ
  choice: उसकी सीमा तक
  rationale: גְּבוּל सीमा, सरहद या निर्धारित हद को दर्शाता है। ‘सीमा’ स्थानगत बिंब को बिना अनावश्यक राजनीतिक अर्थ दिए सुरक्षित रखता है।
- source_word: וְכִי
  choice: और
  rationale: यह समानांतर दूसरे खंड को पहले से जोड़ता है। हिन्दी में पहले ‘कि’ का प्रभाव दूसरे खंड पर भी बना रहता है, इसलिए ‘और’ पर्याप्त और स्वाभाविक है।
- source_word: תָבִין
  choice: समझे
  rationale: בין का मूल भाव समझना या विवेकपूर्वक पहचानना है। ‘समझे’ सामान्य पाठक के लिए सहज है और मार्गों की जानकारी का भाव रखता है।
- source_word: נְתִיבוֹת
  choice: राहों
  rationale: נְתִיבוֹת पगडंडियों, रास्तों या मार्गों को सूचित करता है। ‘राहों’ काव्यात्मक किंतु आधुनिक और बोधगम्य है।
- source_word: בֵּיתוֹ
  choice: उसके घर
  rationale: בַּיִת का ठोस अर्थ ‘घर’ है। इससे प्रकाश या अंधकार को घर वाला मानने वाला इब्रानी मानवीकरण सुरक्षित रहता है।
theological_decisions:
- issue: एकवचन सर्वनामों का पूर्वपद
  choice: ‘उसे/उसकी/उसके’ को जानबूझकर अस्पष्ट रखा गया है
  alternative: सर्वनामों के स्थान पर ‘प्रकाश’ या ‘अंधकार’ स्पष्ट कर देना
  rationale: आसपास के काव्यात्मक प्रश्नों में एकवचन सर्वनाम प्रकाश या अंधकार में से किसकी ओर संकेत करते हैं, यह स्पष्ट नहीं है; अनुवाद इस वास्तविक अस्पष्टता को नहीं सुलझाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक शैली रखी गई है। परमेश्वर द्वारा अय्यूब को सीधे संबोधन के कारण ‘तू’ का प्रयोग किया गया है; ‘राहों’ और ‘घर’ से मूल स्थानगत मानवीकरण सुरक्षित रहता है।
