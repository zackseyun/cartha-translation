    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשׂוּמִי
  choice: जब मैंने ... बनाया
  rationale: בְּ के साथ שׂוּם का infinitive construct और प्रथम पुरुष एकवचन प्रत्यय यहाँ समय-सूचक है। हिंदी में “जब मैंने ... बनाया” स्वाभाविक है और परमेश्वर द्वारा समुद्र को वस्त्र पहनाने की काव्यात्मक छवि को बनाए रखता है।
- source_word: עָנָן
  choice: बादल
  rationale: यह עָנָן का सामान्य और स्वाभाविक हिंदी रूप है।
- source_word: לְבֻשׁוֹ
  choice: उसका वस्त्र
  rationale: לְבוּשׁ का अर्थ वस्त्र या पहनावा है। “वस्त्र” गरिमापूर्ण तथा सुबोध है; पुल्लिंग एकवचन प्रत्यय प्रसंग में समुद्र की ओर संकेत करता है।
- source_word: וַעֲרָפֶל
  choice: और घोर अन्धकार
  rationale: עֲרָפֶל सघन अन्धकार या धुँधले अँधेरे को दर्शाता है। “घोर अन्धकार” उसकी तीव्रता और बादल के साथ काव्यात्मक समानांतरता को व्यक्त करता है।
- source_word: חֲתֻלָּתוֹ
  choice: उसका लपेटने का कपड़ा
  rationale: यह शब्द लपेटने, विशेषतः नवजात शिशु को कपड़े में लपेटने, से जुड़ा है। “लपेटने का कपड़ा” हिंदी में समझने योग्य रहते हुए जन्म-रूपक को सुरक्षित रखता है।
