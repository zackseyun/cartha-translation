lexical_decisions:
- source_word: מִי זֶה
  choice: यह कौन है
  rationale: प्रश्नवाचक और संकेतवाचक शब्दों का यह मेल चुनौती और प्रत्यक्ष सामना करने का भाव बनाए रखता है।
- source_word: מַחְשִׁיךְ
  choice: अँधेरा करता है
  rationale: मूल क्रिया के अंधकार के रूपक को सुरक्षित रखता है और केवल ‘उलझाता’ जैसे व्याख्यात्मक अर्थ तक सीमित नहीं करता।
- source_word: עֵצָה
  choice: सम्मति
  rationale: यह शब्द बुद्धिपूर्ण परामर्श, योजना या उद्देश्य की अर्थ-सीमा को खुला रखता है; वैकल्पिक अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: בְמִלִּין
  choice: बातों से
  rationale: यहाँ पूर्वसर्ग साधन का बोध कराता है। आधुनिक हिन्दी में ‘बातों से’ स्वाभाविक है और वचनों द्वारा ऐसा किए जाने का अर्थ स्पष्ट रखता है।
- source_word: בְּלִי דָעַת
  choice: ज्ञानरहित
  rationale: मूल पदबंध ‘ज्ञान के बिना’ का संक्षिप्त और स्वाभाविक हिन्दी रूप है; इसे ‘मूर्खतापूर्वक’ जैसे अधिक व्याख्यात्मक क्रियाविशेषण में नहीं बदला गया।
theological_decisions:
- issue: ईश्वरीय वाणी में עֵצָה का आशय
  choice: सम्मति
  alternative: योजना या उद्देश्य
  rationale: संदर्भ में परमेश्वर ऐसी वाणी को डाँटते हैं जो सच्ची बुद्धि और संभवतः ईश्वरीय अभिप्राय पर अँधेरा डालती है। ‘सम्मति’ अर्थ की व्यापकता और धार्मिक तनाव को बनाए रखती है, जबकि पादटिप्पणी अन्य वास्तविक संभावनाएँ बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और चुनौतीपूर्ण प्रश्नवाचक शैली रखी गई है। ‘अँधेरा करता है’ मूल रूपक को स्पष्ट रूप से बनाए रखता है।
