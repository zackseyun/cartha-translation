    reason: lexical_alternative
  revision_rationale: The revision keeps the forceful divine question and the metaphor of darkening intact, while using modern formal Hindi that more accurately represents עֵצָה and the phrase ‘words without knowledge.’ No doctrinal interpretation is introduced.
