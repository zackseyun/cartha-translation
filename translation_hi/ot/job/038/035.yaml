  text: Can you send out lightnings so that they go and say to you[a], ‘Here we are’ ?
translation:
  language: hi
  text: क्या तुम बिजलियों को भेज सकते हो कि वे जाएँ और तुमसे कहें, “हम उपस्थित हैं”?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲתְשַׁלַּח
  choice: क्या तुम ... भेज सकते हो
  rationale: प्रश्नवाचक הֲ और हिफ़ील अपूर्ण 2ms का मेल अय्यूब की सामर्थ्य को चुनौती देने वाला आलंकारिक प्रश्न है; यह हिंदी प्रयोग उस आशय को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְּרָקִים
  choice: बिजलियों
  rationale: बहुवचन को बनाए रखता है और आगे आने वाले मानवीकरण—उनका जाना और उत्तर देना—को स्पष्ट रहने देता है। आधुनिक हिंदी में ‘बिजली’ की यह बहुवचन संज्ञा काव्यात्मक संदर्भ में सहज है।
- source_word: וְיֵלֵכוּ
  choice: कि वे जाएँ
  rationale: वाव + अपूर्ण क्रिया को भेजने के फल अथवा प्रयोजन की क्रमिकता के रूप में व्यक्त करता है, बिना अर्थ को अनावश्यक रूप से निश्चित किए।
- source_word: וְיֹאמְרוּ
  choice: और ... कहें
  rationale: बिजलियों को आज्ञाकारी दूतों की तरह चित्रित करने वाले मूल मानवीकरण और क्रियाओं के क्रम को सुरक्षित रखता है।
- source_word: לְךָ
  choice: तुमसे
  rationale: हिंदी में ‘किसी से कहना’ स्वाभाविक संरचना है और एकवचन संबोधन को ठीक प्रकार व्यक्त करती है।
- source_word: הִנֵּנוּ
  choice: हम उपस्थित हैं
  rationale: तत्परता और हाज़िरी जताने वाले उत्तर का गरिमापूर्ण, आधुनिक हिंदी रूप; ‘देख, हम’ जैसे कृत्रिम शाब्दिक अनुवाद से बचता है।
theological_decisions:
- issue: ईश्वरीय वाणी में बिजलियों का मानवीकरण
  choice: बिजलियाँ जाती हैं और कहती हैं, ‘हम उपस्थित हैं।’
  alternative: प्राकृतिक घटना को अमानवीकृत ढंग से केवल परमेश्वर के नियंत्रण में घटित बताया जाए।
  rationale: इब्रानी पाठ बिजलियों के लिए स्पष्टतः जाना और कहना प्रयुक्त करता है। इस काव्यात्मक मानवीकरण को बनाए रखना सृष्टि पर परमेश्वर की प्रभुता की छवि सुरक्षित रखता है, पर इससे बिजलियों में वास्तविक चेतना होने का सिद्धांत स्थापित नहीं होता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘बिजलियों’ से मूल का बहुवचन सुरक्षित है, इसलिए अलग lexical footnote आवश्यक नहीं। ‘हम उपस्थित हैं’ आज्ञा पर तत्पर सेवकों की प्रतिक्रिया को स्पष्ट करता है।
