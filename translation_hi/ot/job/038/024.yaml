  text: By what way is light divided[b][a], or the east wind scattered over the earth?
translation:
  language: hi
  text: 'प्रकाश किस मार्ग से बाँटा जाता है,[a][b]

    और पुरवाई पृथ्वी पर कैसे फैलती है?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह मार्ग कहाँ है, जिससे प्रकाश बाँटा जाता है?” इब्रानी प्रश्नवाचक पदबंध स्थान या माध्यम/रीति—दोनों में से किसी के विषय में पूछा हुआ समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘प्रकाश’ के स्थान पर “बिजली” भी संभव है। इब्रानी शब्द का सामान्य अर्थ ‘प्रकाश’ है, पर इस तूफ़ानी प्रसंग में कुछ व्याख्याकार इसे बिजली जैसे प्रकाश के लिए प्रयुक्त मानते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵי זֶה
  choice: किस
  rationale: यह प्रश्नवाचक पदबंध मार्ग के साथ स्थान अथवा माध्यम/रीति पूछ सकता है। मुख्य पाठ में ‘किस मार्ग से’ स्वाभाविक हिंदी है और दोनों संभावनाओं के निकट रहता है।
- source_word: הַדֶּרֶךְ
  choice: मार्ग
  rationale: דֶּרֶךְ का सामान्य अर्थ मार्ग या रास्ता है। काव्यात्मक और गरिमापूर्ण शैली में ‘मार्ग’ उपयुक्त है।
- source_word: יֵחָלֶק
  choice: बाँटा जाता है
  rationale: חלק के निफ़अल रूप में विभाजित या बाँटे जाने का भाव है। हिंदी का कर्मवाच्य मूल की निष्क्रिय/आत्मवाचक अस्पष्टता के पर्याप्त निकट है।
- source_word: אוֹר
  choice: प्रकाश
  rationale: אוֹר का सामान्य, अचिह्नित अर्थ ‘प्रकाश’ है। तूफ़ानी प्रसंग में ‘बिजली’ संभव है, पर उसे मुख्य पाठ में चुनने से अर्थ अनावश्यक रूप से संकीर्ण हो जाता।
- source_word: יָפֵץ
  choice: बिखेरी जाती है
  rationale: פוץ के हिफ़ईल रूप का अर्थ बिखेरना या तितर-बितर करना है। हिंदी में कर्मवाच्य समानांतर काव्य-पंक्ति को स्वाभाविक बनाता है, यद्यपि इब्रानी रूप व्याकरणतः कर्तृवाच्य कारक है।
- source_word: קָדִים
  choice: पुरवाई
  rationale: קָדִים यहाँ पूर्व दिशा से आने वाली हवा को सूचित करता है। ‘पुरवाई’ आधुनिक हिंदी में पूर्वी हवा का संक्षिप्त और स्वाभाविक नाम है।
- source_word: עֲלֵי אָרֶץ
  choice: पृथ्वी पर
  rationale: यह पदबंध पृथ्वी या भूमि के ऊपर/पर होने का भाव देता है। अय्यूब 38 के विश्वव्यापी संदर्भ में ‘पृथ्वी पर’ उपयुक्त है।
