base_translation:
  language: en
  yaml_path: translation/ot/job/038/034.yaml
  text: Can you raise your voice to the clouds[b][a], so that an abundance of water covers you?
translation:
  language: hi
  text: क्या तुम बादल[a] की ओर अपनी आवाज़ उठा सकते हो, ताकि प्रचुर जल[b] तुम्हें ढक ले?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “घने बादल की ओर” अथवा सामूहिक अर्थ में “बादलों की ओर।” इब्रानी शब्द वर्षा से भरे घने बादल को भी सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “और जल की बाढ़ तुम्हें ढक ले।” इब्रानी वाक्यांश उमड़ती हुई प्रचुरता का भाव दे सकता है; दूसरे उपवाक्य को ‘और’ से जोड़ना भी संभव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתָרִים
  choice: क्या तुम ... उठा सकते हो
  rationale: הֲ के प्रश्नसूचक बल और רום के हिफ़ील रूप को क्षमता पर केंद्रित आलंकारिक प्रश्न के रूप में व्यक्त करता है।
- source_word: לָעָב
  choice: बादल की ओर
  rationale: עָב वर्षा लाने वाले घने बादल या बादल-समूह को सूचित कर सकता है; एकवचन ‘बादल’ मूल की व्याकरणिक संख्या बनाए रखता है।
- source_word: קוֹלֶךָ
  choice: अपनी आवाज़
  rationale: קוֹל यहाँ बादल को पुकारने के लिए उठाई गई मानवीय आवाज़ है।
- source_word: וְשִׁפְעַת מַיִם
  choice: ताकि बहुतायत में जल
  rationale: שִׁפְעָה प्रचुरता या उमड़ती मात्रा दर्शाता है। यह अनुवाद विनाशकारी बाढ़ का अर्थ अनिवार्य किए बिना जल की अत्यधिक मात्रा बनाए रखता है।
- source_word: תְּכַסֶּךָּ
  choice: तुम्हें ढक ले
  rationale: כסה का पिएल रूप सीधे ‘ढकना’ व्यक्त करता है और द्वितीय पुरुष एकवचन प्रत्यय संबोधित व्यक्ति की ओर संकेत करता है।
theological_decisions:
- issue: दोनों उपवाक्यों का संबंध
  choice: दूसरे उपवाक्य को पहले के अभिप्रेत परिणाम के रूप में ‘ताकि’ से जोड़ना
  alternative: 'इसे समान स्तर पर जुड़े कथन की तरह पढ़ना: ‘और बहुत-सा जल तुम्हें ढक ले’'
  rationale: संदर्भ में प्रश्न मनुष्य की मौसम को आदेश देने की असमर्थता पर है। ‘ताकि’ संभावित परिणाम-संबंध स्पष्ट करता है, पर मूल इब्रानी के וְ का समन्वयी पाठ भी संभव है और उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और प्रत्यक्ष शैली रखी गई है। एकवचन संबोधन के लिए स्वाभाविक ‘तुम’ चुना गया है; मूल का आलंकारिक चुनौतीपूर्ण प्रश्न और जल से ढक जाने का सजीव बिंब सुरक्षित रखा गया है।
