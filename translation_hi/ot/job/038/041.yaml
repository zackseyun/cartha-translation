source:
  edition: WLC
  text: מִ֤י יָכִ֥ין לָ/עֹרֵ֗ב צֵ֫יד֥/וֹ כִּֽי ילד/ו אֶל אֵ֣ל יְשַׁוֵּ֑עוּ יִ֝תְע֗וּ לִ/בְלִי אֹֽכֶל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/041.yaml
  text: Who prepares its prey for the raven when its young cry out to God and wander about for lack of food?[a][b][c]
translation:
  language: hi
  text: कौए के लिए उसका शिकार कौन तैयार करता है,[a] जब[b] उसके बच्चे परमेश्वर की दुहाई देते और भोजन न मिलने के कारण भटकते फिरते हैं?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कौए के लिए भोजन कौन जुटाता है?” इब्रानी क्रिया का अर्थ “तैयार करना” या “उपलब्ध कराना” है, और “शिकार” को अधिक सामान्य रूप में “भोजन” भी कहा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “क्योंकि उसके बच्चे परमेश्वर की दुहाई देते हैं।” इब्रानी संयोजक को समयसूचक “जब” के बजाय कारणसूचक “क्योंकि” भी समझा जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: या “इधर-उधर फिरते हैं” अथवा “राह भटकते हैं।” इब्रानी क्रिया भोजन की खोज में भटकने या घूमने का भाव दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: कौन
  rationale: यह प्रश्नवाचक सर्वनाम परमेश्वर के कथन में आलंकारिक प्रश्न आरम्भ करता है।
- source_word: יָכִין
  choice: तैयार करता है
  rationale: כון के हिफ़ील रूप का अर्थ यहाँ तैयार करना या उपलब्ध कराना है; ‘तैयार करता है’ मूल की ठोस अभिव्यक्ति बनाए रखता है।
- source_word: לָעֹרֵב
  choice: कौए के लिए
  rationale: पूर्वसर्ग लाभार्थी को दर्शाता है; निश्चित एकवचन यहाँ पूरी जाति का प्रतिनिधित्व करता है।
- source_word: צֵידוֹ
  choice: उसका शिकार
  rationale: ציד शिकार अथवा शिकार से प्राप्त भोजन को दर्शाता है, और प्रत्यय कौए की ओर संकेत करता है। ‘उसका शिकार’ पशु-जगत का सजीव बिंब बनाए रखता है।
- source_word: כִּי
  choice: जब
  rationale: यहाँ संयोजक उस परिस्थिति या समय को प्रस्तुत करता है जिसमें आवश्यकता प्रकट होती है; कारणवाचक ‘क्योंकि’ भी सम्भव है।
- source_word: יַלְדָו
  choice: उसके बच्चे
  rationale: प्रत्यययुक्त संज्ञा कौए के बच्चों को दर्शाती है; यह सहज और स्पष्ट हिन्दी है।
- source_word: אֶל אֵל
  choice: परमेश्वर की
  rationale: אֵל यहाँ परमेश्वर के लिए सामान्य पद है; ‘दुहाई देना’ के साथ हिन्दी में संबंधसूचक रचना स्वाभाविक है और ‘परमेश्वर को पुकारना’ का अर्थ देती है।
- source_word: יְשַׁוֵּעוּ
  choice: दुहाई देते
  rationale: שוע का पिएल रूप सहायता के लिए पुकारने को व्यक्त करता है; ‘दुहाई देते’ करुण और प्रार्थनापूर्ण पुकार का भाव संक्षेप में रखता है।
- source_word: יִתְעוּ
  choice: भटकते फिरते हैं
  rationale: תעה का अर्थ भटकना या इधर-उधर फिरना हो सकता है; यहाँ भूख के कारण बेचैन खोज का भाव उपयुक्त है।
- source_word: לִבְלִי אֹכֶל
  choice: भोजन न मिलने के कारण
  rationale: यह पद भोजन के अभाव को व्यक्त करता है और भटकने के कारण का स्वाभाविक हिन्दी रूप देता है।
