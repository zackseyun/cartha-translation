  text: Or who shut in the sea with doors when it burst out from the womb[b][a],
translation:
  language: hi
  text: 'या किसने द्वारों से समुद्र को रोक दिया,

    जब वह गर्भ से फूटकर निकल आया?[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘फूटकर निकल आया’ का अनुवाद ‘उमड़कर बाहर आया’ भी हो सकता है; हिब्रू क्रिया बलपूर्वक बाहर आने का भाव देती है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ समुद्र को गर्भ से निकलते हुए नवजात के रूप में चित्रित किया गया है; यह सृष्टि-वर्णन का काव्यात्मक बिंब है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּסֶךְ
  choice: बंद कर दिया
  rationale: क्रिया समुद्र को रोककर सीमित या बंद करने का भाव देती है। ‘बंद कर दिया’ आधुनिक हिन्दी में स्वाभाविक है और द्वारों के बिंब के साथ सटीक बैठता है।
- source_word: בִּדְלָתַיִם
  choice: द्वारों के पीछे
  rationale: द्विवचन संज्ञा ‘द्वारों’ को बनाए रखा गया है। हिन्दी में ‘द्वारों के पीछे बंद कर दिया’ साधन और अवरोध—दोनों का वास्तु-बिंब स्वाभाविक रूप से व्यक्त करता है।
- source_word: יָם
  choice: समुद्र
  rationale: सृष्टि-वर्णन के इस प्रसंग में यह परिचित सृष्ट वस्तु के रूप में समुद्र को सूचित करता है।
- source_word: בְּגִיחוֹ
  choice: जब वह ... वेग से फूटकर
  rationale: גיח बलपूर्वक या तीव्रता से बाहर निकलने का चित्र खींचता है। ‘वेग से फूटकर’ उस सजीव गति को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: מֵרֶחֶם
  choice: गर्भ से
  rationale: मूल का जन्म-बिंब सीधे सुरक्षित रखा गया है; हिन्दी में अनिश्चित उपपद की आवश्यकता नहीं है।
- source_word: יֵצֵא
  choice: निकला
  rationale: समापिका क्रिया को ‘निकला’ से व्यक्त किया गया है। इसे בְּגִיחוֹ के साथ ‘फूटकर निकला’ बनाने से दोनों हिब्रू घटक सुरक्षित रहते हैं, पर हिन्दी में अनावश्यक पुनरुक्ति नहीं होती।
theological_decisions:
- issue: समुद्र के जन्म और उसे सीमित करने का काव्यात्मक सृष्टि-बिंब
  choice: समुद्र को गर्भ से जन्म लेते हुए और द्वारों के पीछे बंद किए जाते हुए मानवीकृत काव्य-बिंब के रूप में बनाए रखा गया है।
  alternative: इसे केवल इस अमूर्त कथन में बदलना कि परमेश्वर ने समुद्र की सीमाएँ निर्धारित कीं।
  rationale: मूल पाठ समुद्र के जन्म और उसे द्वारों से रोकने का सजीव चित्र देता है। इसे बनाए रखना हिब्रू कविता के तनाव और रूपक के प्रति निष्ठावान है, बिना उसे किसी अतिरिक्त पौराणिक या सांप्रदायिक व्याख्या में बदलने के।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘या किसने’ पिछले पदों से चली आ रही प्रश्नमाला को दर्शाता है। पंक्ति-विभाजन हिब्रू काव्य की गति और जन्म-बिंब को उभारता है।
