  yaml_path: translation/ot/job/038/029.yaml
  text: From whose womb did the ice come forth[a], and who gave birth to the frost of heaven?
translation:
  language: hi
  text: किसके गर्भ से बर्फ निकली, और आकाश के पाले को किसने जन्म दिया?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבֶּטֶן מִי
  choice: किसके गर्भ से
  rationale: शाब्दिक गर्भ-रूपक को सुरक्षित रखते हुए यह आधुनिक हिन्दी में स्वाभाविक प्रश्न है।
- source_word: יָצָא
  choice: निकली
  rationale: क्रिया का मूल अर्थ ‘बाहर निकलना’ है; ‘निकली’ संक्षिप्त और स्वाभाविक है तथा जन्म के बिंब से जुड़ी रहती है।
- source_word: הַקָּרַח
  choice: बर्फ
  rationale: קֶרַח का सामान्य अर्थ बर्फ है; हिन्दी में यह सुलभ और प्रसंगानुकूल शब्द है।
- source_word: וּכְפֹר שָׁמַיִם
  choice: और आकाश के पाले को
  rationale: כְּפוֹר के लिए ‘पाला’ आधुनिक हिन्दी में स्वाभाविक है, और ‘आकाश के’ मूल संबंधवाचक संरचना तथा काव्यात्मक विश्व-बिंब को बनाए रखता है।
- source_word: מִי יְלָדוֹ
  choice: किसने जन्म दिया
  rationale: ילד के प्रसव-संबंधी अर्थ को स्पष्ट रखता है और पहले चरण के ‘गर्भ’ रूपक को आगे बढ़ाता है।
