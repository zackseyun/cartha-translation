lexical_decisions:
- source_word: עַל מָה
  choice: किस पर
  rationale: यह प्रश्न पृथ्वी के आधार के सहारे के विषय में है; ‘किस पर’ आधुनिक हिन्दी में स्वाभाविक रहते हुए मूल प्रश्न को सुरक्षित रखता है।
- source_word: אֲדָנֶיהָ
  choice: उसके आधार
  rationale: אֶדֶן किसी संरचना के आधार, चौकी या नींव के खाँचे को दर्शा सकता है। ‘आधार’ ठोस स्थापत्य-बिंब बनाए रखता है और अत्यधिक तकनीकी नहीं लगता।
- source_word: הָטְבָּעוּ
  choice: धँसाए गए
  rationale: टבע के होफ़अल रूप में किसी वस्तु को धँसाए या गाड़े जाने का कर्मवाच्य भाव है। ‘धँसाए गए’ उस सजीव बिंब और कर्मवाच्य दोनों को रखता है।
- source_word: אוֹ
  choice: या
  rationale: दो समानांतर आलंकारिक प्रश्नों को जोड़ने वाला सरल विकल्पसूचक संयोजक।
- source_word: מִי
  choice: किसने
  rationale: कर्ता के विषय में पूछने वाले मूल प्रश्नवाचक सर्वनाम का स्वाभाविक हिन्दी रूप।
- source_word: יָרָה
  choice: रखा
  rationale: क्रिया का शाब्दिक अर्थ ‘फेंकना/डालना’ हो सकता है, पर निर्माण के इस प्रसंग में पत्थर स्थापित करने का आशय है; ‘रखा’ अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֶבֶן פִּנָּתָהּ
  choice: उसके कोने का पत्थर
  rationale: यह मूल रचना ‘उसके कोने का पत्थर’ को निकटता से सुरक्षित रखता है। हिन्दी में ‘कोने का पत्थर’ स्पष्ट है और ‘कोने का प्रमुख पत्थर’ जैसी अतिरिक्त व्याख्या नहीं जोड़ता।
theological_decisions:
- issue: पृथ्वी की सृष्टि के लिए स्थापत्य रूपक
  choice: ‘आधार’ और ‘कोने का पत्थर’ के निर्माण-बिंब को बनाए रखा गया।
  alternative: ‘पृथ्वी किस सहारे टिकी है?’ जैसे व्याख्यात्मक रूप में कहना।
  rationale: यह अंश परमेश्वर द्वारा अय्यूब से किए गए काव्यात्मक प्रश्नों का भाग है। स्थापत्य रूपक को बनाए रखना मूल की कविता और उसके वैचारिक तनाव का सम्मान करता है तथा आधुनिक वैज्ञानिक या अमूर्त व्याख्या आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज काव्यात्मक प्रश्न। पृथ्वी का स्त्रीलिंग संदर्भ हिन्दी में ‘उसके’ से स्वाभाविक रूप से व्यक्त है। स्थापत्य बिंब को सरल किए बिना सामान्य पाठक के लिए बोधगम्य रखा गया है।
