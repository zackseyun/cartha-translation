  text: אֱזָר נָ֣א כְ/גֶ֣בֶר חֲלָצֶ֑י/ךָ וְ֝/אֶשְׁאָלְ/ךָ֗ וְ/הוֹדִיעֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/003.yaml
  text: Gird up your loins like a man[a]; I will question you[b], and you shall make it known to me.
translation:
  language: hi
  text: पुरुष के समान अपनी कमर कस ले[a]; मैं तुझसे प्रश्न करूँगा, और तू मुझे बता[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वीर पुरुष की तरह तैयार हो जा।” इब्रानी में शाब्दिक रूप से “पुरुष के समान अपनी कमर कस” है—यह दृढ़ता से तैयार होने का मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: या, “मुझे अवगत करा।” पारंपरिक अनुवादों में प्रायः “मुझे उत्तर दे” मिलता है, पर इब्रानी का अधिक शाब्दिक अर्थ “मुझे जानने दे” या “मुझे बता” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱזָר נָא
  choice: कमर कस ले
  rationale: אזר तैयारी के लिए कमर बाँधने का आदेश देता है। हिंदी का मुहावरा ‘कमर कसना’ मूल बिंब और दृढ़ तैयारी—दोनों को स्वाभाविक रूप से व्यक्त करता है। נָא यहाँ विनम्र ‘कृपया’ से अधिक आदेश में आग्रह या तात्कालिकता जोड़ता है; ‘ले’ उस भाव को स्वाभाविक हिंदी में वहन करता है।
- source_word: כְגֶבֶר
  choice: पुरुष के समान
  rationale: גֶּבֶר वयस्क पुरुष को दर्शाता है और प्रसंग में सामर्थ्य अथवा वीरता की छाया रखता है। ‘पुरुष’ मूल के लिंग-विशिष्ट अर्थ को बनाए रखता है, जबकि वैकल्पिक अर्थ पाद-टिप्पणी में दिया गया है।
- source_word: חֲלָצֶיךָ
  choice: अपनी कमर
  rationale: शब्द का शाब्दिक संदर्भ कमर/कटि से है। हिंदी में ‘अपनी कमर कसना’ इसी तैयारी के मुहावरे को स्पष्ट और सहज रूप में सुरक्षित रखता है।
- source_word: וְאֶשְׁאָלְךָ
  choice: मैं तुझसे प्रश्न करूँगा
  rationale: שׁאל का अर्थ पूछना है; इस दिव्य चुनौती के प्रसंग में ‘प्रश्न करना’ लगातार और गंभीर पूछताछ का भाव देता है, बिना अनावश्यक न्यायालयी अर्थ जोड़े।
- source_word: וְהוֹדִיעֵנִי
  choice: तू मुझे बता
  rationale: ידע के हिफ़ील रूप का शाब्दिक अर्थ ‘जानने देना/अवगत कराना’ है। आदेशात्मक ‘मुझे बता’ आधुनिक हिंदी में स्वाभाविक है और केवल पारंपरिक ‘उत्तर दे’ की अपेक्षा मूल क्रिया के अर्थ के अधिक निकट है।
theological_decisions:
- issue: दिव्य चुनौती में लिंग-विशिष्ट उपमा
  choice: पुरुष के समान
  alternative: वीर पुरुष की तरह / योद्धा की तरह
  rationale: मूल में masculine singular גֶּבֶר है, इसलिए उसे लिंग-निरपेक्ष नहीं किया गया। प्रसंग में यह दृढ़ तैयारी और साहस की उपमा है, पुरुष-श्रेष्ठता का धर्मसैद्धांतिक कथन नहीं।
- issue: ‘बता’ बनाम ‘उत्तर दे’
  choice: तू मुझे बता
  alternative: तू मुझे उत्तर दे
  rationale: हिफ़ील וְהוֹדִיעֵנִי का अर्थ अधिक शाब्दिक रूप से ‘मुझे अवगत करा’ है। ‘उत्तर दे’ प्रसंगानुकूल है, पर क्रिया के कारणवाचक ज्ञानार्थ को कुछ हद तक व्याख्यायित कर देता है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। ‘कमर कसना’ हिंदी का जीवित मुहावरा होने के साथ मूल इब्रानी बिंब को भी सुरक्षित रखता है। एकवचन प्रत्यक्ष संबोधन के लिए ‘तू’ रखा गया है, जो इस काव्यात्मक दिव्य वाणी की तीव्रता के अनुकूल है।
