  yaml_path: translation/ot/job/038/004.yaml
  text: Where were you when I founded the earth? Tell me[a], if you know understanding.
translation:
  language: hi
  text: जब मैंने पृथ्वी की नींव डाली, तब तुम कहाँ थे? यदि तुम्हें समझ है, तो बताओ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵיפֹה
  choice: कहाँ
  rationale: स्थान पूछने वाला प्रश्नवाचक क्रियाविशेषण; सरल और स्वाभाविक हिंदी में चुनौती का बल बनाए रखता है।
- source_word: הָיִיתָ
  choice: तुम कहाँ थे
  rationale: היה का काल पूर्ण, द्वितीय पुरुष पुल्लिंग एकवचन रूप है; अतीत की परिस्थिति में हिंदी का ‘थे’ स्वाभाविक है।
- source_word: בְּיָסְדִי
  choice: जब मैंने … की नींव डाली
  rationale: בְּ के साथ infinitive construct और प्रथम पुरुष एकवचन प्रत्यय समय का अर्थ देता है। ‘नींव डाली’ יסד के स्थापत्य रूपक को स्पष्ट और स्वाभाविक हिंदी में सुरक्षित रखता है।
- source_word: אָרֶץ
  choice: पृथ्वी
  rationale: सृष्टि के विश्वव्यापी संदर्भ में यहाँ किसी स्थानीय भूभाग के बजाय पृथ्वी अभिप्रेत है।
- source_word: הַגֵּד
  choice: बताओ
  rationale: נגד का आज्ञार्थक रूप है। हिंदी में ‘बताओ’ सीधा, स्वाभाविक और चुनौतीपूर्ण स्वर के अनुरूप है; अलग से ‘मुझे’ जोड़ना आवश्यक नहीं।
- source_word: אִם
  choice: यदि
  rationale: यह शर्त के रूप में चुनौती प्रस्तुत करता है; ‘यदि’ मूल की संभाव्यता और व्यंग्यात्मक प्रश्न-बल को बनाए रखता है।
- source_word: יָדַעְתָּ
  choice: तुम्हें … है
  rationale: रूप की दृष्टि से पूर्ण काल होते हुए भी इस अलंकारिक शर्त में वर्तमान ज्ञान का भाव है; हिंदी में ‘तुम्हें समझ है’ स्वाभाविक है।
- source_word: בִינָה
  choice: समझ
  rationale: बुद्धि, विवेक या सूझ को दर्शाता है। ‘समझ’ सामान्य पाठक के लिए सहज है और ज्ञान-साहित्य के भाव को पर्याप्त रूप से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय वाणी में सृष्टि का स्थापत्य रूपक
  choice: ‘पृथ्वी की नींव डाली’
  alternative: ‘पृथ्वी को स्थापित किया’
  rationale: यह अनुवाद יסד में निहित स्थापत्य बिंब को बनाए रखता है और परमेश्वर को पृथ्वी का संस्थापक दिखाने वाले मूल कथन से आगे कोई अतिरिक्त सैद्धांतिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिंदी; गरिमापूर्ण परंतु सामान्य पाठकों के लिए सहज। ‘तुम’ मूल के द्वितीय पुरुष एकवचन और सीधे चुनौतीपूर्ण संबोधन को स्वाभाविक हिंदी में व्यक्त करता है। वाक्य-विन्यास हिंदी प्रवाह के अनुसार रखा गया है।
