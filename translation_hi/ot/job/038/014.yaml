  text: It is changed like clay under a seal[b][a], and they stand forth like a garment.
translation:
  language: hi
  text: वह मुहर के नीचे की मिट्टी के समान बदल जाती है[a], और वे वस्त्र की तरह उभर खड़े होते हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह मुहर के नीचे की मिट्टी के समान पलटती है।” इब्रानी क्रिया का अर्थ अधिक शाब्दिक रूप से “अपने को पलटना” या “पलट दिया जाना” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “वे” बहुवचन है, पर उसका कर्ता स्पष्ट नहीं बताया गया है। संभवतः यह प्रभात के प्रकाश में स्पष्ट होने वाली धरती की विशेषताओं की ओर संकेत करता है।
    reason: cultural_note
lexical_decisions:
- source_word: תִּתְהַפֵּךְ
  choice: बदल जाती है
  rationale: हित्पएल रूप में पलटने या रूप बदलने का भाव है। यहाँ प्रभात में धरती की सतह का बदला हुआ रूप सामने आता है; हिंदी में यह प्रयोग कर्मवाच्य/आत्मवाचक अस्पष्टता को स्वाभाविक रूप से बनाए रखता है।
- source_word: כְּחֹמֶר חוֹתָם
  choice: मुहर के नीचे की मिट्टी की तरह
  rationale: यह संक्षिप्त इब्रानी उपमा उस नम मिट्टी का चित्र देती है जिस पर मुहर दबाने से आकृति बनती है। 'नीचे' उपमा का निहित संबंध स्पष्ट करता है।
- source_word: וְיִתְיַצְּבוּ
  choice: उभर आती हैं
  rationale: बहुवचन क्रिया का स्पष्ट कर्ता नहीं दिया गया है। संदर्भ में उजाले से धरती की आकृतियों के स्पष्ट दिखाई देने का भाव है; 'उभर आती हैं' हिंदी में दृश्य प्रमुखता व्यक्त करता है।
- source_word: כְּמוֹ לְבוּשׁ
  choice: वस्त्र की सिलवटों की तरह
  rationale: לְבוּשׁ का मूल अर्थ वस्त्र है। हिंदी में 'सिलवटों' से भू-आकृतियों के वस्त्र-जैसे उभरने का चित्र समझ आता है, पर यह व्याख्यात्मक पूर्ति होने के कारण टिप्पणी में बताया गया है।
