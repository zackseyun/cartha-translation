  text: הֲ֭/בָאתָ עַד נִבְכֵי יָ֑ם וּ/בְ/חֵ֥קֶר תְּ֝ה֗וֹם הִתְהַלָּֽכְתָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/016.yaml
  text: Have you come to the springs of the sea[b][a], or walked in the recesses of the deep?
translation:
  language: hi
  text: क्या तुम समुद्र के सोतों[a] तक गए हो, या अथाह जल के गुप्त स्थानों[b] में चले-फिरे हो?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “स्रोतों”।
    reason: lexical_alternative
  - marker: b
    text: या “अथाह जल की खोजी न जा सकने वाली सीमाओं” अथवा “अथाह जल की भीतरी गहराइयों” में।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲבָאתָ
  choice: क्या तुम ... गए हो
  rationale: בוא का प्रश्नवाचक पूर्ण रूप यहाँ किसी स्थान तक पहुँचने की चुनौती देता है। हिंदी में “गए हो” स्वाभाविक है और अज्ञात गहराइयों तक पहुँचने का भाव रखता है।
- source_word: עַד
  choice: तक
  rationale: यह गति की अंतिम सीमा या गंतव्य तक पहुँचने को दर्शाता है; “तक” इसका सीधा और स्वाभाविक हिंदी रूप है।
- source_word: נִבְכֵי
  choice: सोतों
  rationale: दुर्लभ शब्द को समुद्र के उद्गम या फूटने के स्थानों के रूप में समझा गया है। “सोते” ठोस जल-स्रोत का काव्यात्मक चित्र बनाए रखता है; “स्रोत” भी संभव है।
- source_word: יָם
  choice: समुद्र
  rationale: यहाँ सामान्य संज्ञा है, किसी विशिष्ट नाम का संकेत नहीं।
- source_word: וּבְחֵקֶר
  choice: या ... गुप्त स्थानों में
  rationale: חֵקֶר में खोज, खोजी जा सकने वाली सीमा, अथवा दुर्गम भीतरी भाग का भाव हो सकता है। संदर्भ में “गुप्त स्थान” समुद्री गहराई के अगम्य, छिपे हुए भागों को व्यक्त करता है और शाब्दिक अस्पष्टता को टिप्पणी में सुरक्षित रखता है। वाव को समानांतर प्रश्न के कारण हिंदी में “या” किया गया है।
- source_word: תְּהוֹם
  choice: अथाह जल
  rationale: תְּהוֹם विशाल गहरे जल या आद्य महासागरीय गहराई को सूचित करता है। “अथाह जल” आधुनिक हिंदी में समझने योग्य है और “अधोलोक” जैसा अनावश्यक धार्मिक अर्थ नहीं जोड़ता।
- source_word: הִתְהַלָּכְתָּ
  choice: चले-फिरे हो
  rationale: हित्पएल रूप चलने-फिरने या इधर-उधर विचरण करने का भाव देता है। “चले-फिरे” साधारण “चले” की अपेक्षा इस पुनरावर्ती/विचरणात्मक अर्थ को बेहतर रखता है।
