  yaml_path: translation/ot/job/038/031.yaml
  text: Can you bind the chains of the Pleiades[c][b][a], or loosen the cords of Orion?
translation:
  language: hi
  text: 'क्या तुम प्लीएडीज़ की जंजीरें[a][b] बाँध सकते हो,

    या ओरायन[c] की रस्सियाँ खोल सकते हो?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘जंजीरें’ के स्थान पर ‘बंधन’ या ‘पट्टियाँ’ भी सम्भव है; दोनों पंक्तियों में इब्रानी पाठ आकाशीय बंधनों या जोड़ने वाली कड़ियों के निकटवर्ती बिंबों का प्रयोग करता है।
    reason: lexical_alternative
  - marker: b
    text: कुछ पुरानी परम्पराओं में מַעֲדַנּוֹת का अर्थ ‘मधुर प्रभाव’ किया गया है, पर इब्रानी शब्द का अधिक सम्भावित अर्थ बंधन, पट्टियाँ या जंजीरें है।
    reason: lexical_alternative
  - marker: c
    text: כְּסִיל से यहाँ सम्भवतः ओरायन तारामंडल अभिप्रेत है; दूसरे संदर्भों में इसी शब्द का अर्थ ‘मूर्ख’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתְקַשֵּׁר
  choice: क्या तुम ... बाँध सकते हो
  rationale: प्रश्नवाचक कण और पिएल अपूर्ण 2 पुं. एक. मिलकर मानवीय असमर्थता को उभारने वाला आलंकारिक प्रश्न बनाते हैं। ‘बाँध सकते हो’ वर्तमान हिन्दी में स्वाभाविक है और आकाशीय नियंत्रण के बिंब को बनाए रखता है।
- source_word: מַעֲדַנּוֹת
  choice: जंजीरें
  rationale: यह दुर्लभ बहुवचन संज्ञा सम्भवतः बंधनों, पट्टियों या जोड़ने वाली कड़ियों को दर्शाती है। समानांतर पंक्ति की ‘रस्सियाँ’ और ‘बाँधने’ की क्रिया के साथ ‘जंजीरें’ ठोस और सुबोध बिंब देती है; शब्द की अनिश्चितता पादटिप्पणियों में रखी गई है।
- source_word: כִּימָה
  choice: प्लीएडीज़
  rationale: खगोलीय संदर्भ में इस नाम की सामान्य पहचान प्लीएडीज़ तारागुच्छ से की जाती है। आधुनिक मानक हिन्दी में अंतरराष्ट्रीय खगोलीय नाम का देवनागरी लिप्यंतरण स्पष्ट और तटस्थ है।
- source_word: מֹשְׁכוֹת
  choice: रस्सियाँ
  rationale: यह संज्ञा खींचने या बाँधने वाली डोरियों/पट्टियों का संकेत देती है। ‘रस्सियाँ’ ठोस, सामान्य हिन्दी है और पहली पंक्ति की ‘जंजीरें’ के समानांतर रहती है।
- source_word: כְּסִיל
  choice: ओरायन
  rationale: यहाँ כִּימָה के समानांतर खगोलीय नाम होने के कारण इसे ओरायन तारामंडल माना गया है। सामान्य संज्ञा के रूप में इसका अर्थ ‘मूर्ख’ हो सकता है, पर वह इस संदर्भ में कम सम्भावित है।
- source_word: תְּפַתֵּחַ
  choice: खोल सकते हो
  rationale: פתח का मूल अर्थ ‘खोलना’ है; रस्सियों के साथ इसका आशय बंधन खोलना या ढीला करना है। ‘खोल सकते हो’ मूल क्रिया के निकट रहते हुए हिन्दी में स्वाभाविक है और ‘बाँध सकते हो’ का स्पष्ट प्रतिलोम बनता है।
