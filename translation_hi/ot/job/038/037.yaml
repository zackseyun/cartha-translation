  text: Who can count the clouds with wisdom[a], or tip over the jars of the heavens?
translation:
  language: hi
  text: 'कौन बुद्धि से बादलों को गिन सकता है,

    और कौन आकाश की मशकों[a] को उलट सकता है?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आकाश के घड़ों।” इब्रानी में वर्षा को थामे हुए आकाश के पात्रों का बिंब है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יְסַפֵּר
  choice: कौन ... गिन सकता है
  rationale: प्रश्नवाचक מִי और पिएल יְסַפֵּר मिलकर सामर्थ्य के विषय में आलंकारिक प्रश्न बनाते हैं; हिंदी में ‘कौन ... गिन सकता है’ इसका स्वाभाविक रूप है।
- source_word: שְׁחָקִים
  choice: बादलों
  rationale: इस मौसम-संबंधी प्रसंग में काव्यात्मक שְׁחָקִים का आशय आकाश के बादलों से है।
- source_word: בְּחָכְמָה
  choice: बुद्धि से
  rationale: בְּ को साधनवाचक रखते हुए यह अनुवाद इब्रानी रचना और उसके अर्थ—बुद्धि के द्वारा—दोनों को सुरक्षित रखता है।
- source_word: נִבְלֵי שָׁמַיִם
  choice: आकाश की मशकों
  rationale: נֶבֶל तरल रखने की चमड़े की मशक या अन्य पात्र को दर्शा सकता है। ‘मशक’ वर्षा से भरे आकाशीय पात्र का ठोस काव्य-बिंब बनाए रखती है और ‘आकाश की’ संबंधवाचक रचना को दर्शाती है।
- source_word: יַשְׁכִּיב
  choice: उलट सकता है
  rationale: שׁכב के हिफ़ील का शाब्दिक भाव ‘लिटा देना’ है; पात्रों के संदर्भ में उन्हें झुकाकर या उलटकर उनकी सामग्री बहा देने का बिंब बनता है। ‘उलट सकता है’ उस ठोस बिंब को सुरक्षित रखता है।
theological_decisions: []
