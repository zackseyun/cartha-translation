translation:
  language: hi
  text: कि वह पृथ्वी के छोरों को पकड़ ले[a], और दुष्ट उसमें से झाड़ दिए जाएँ[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पृथ्वी के कोनों को।” इब्रानी में शाब्दिक रूप से “पृथ्वी के पंख/सिरे” है—यह उसके बाहरी छोरों का काव्यात्मक बिंब है।
    reason: lexical_alternative
  - marker: b
    text: बिंब यह है कि भोर पृथ्वी को पकड़कर उसे इस तरह झाड़ती है जैसे किसी वस्त्र से धूल झाड़ी जाती है, और दुष्ट उसमें से निकाल दिए जाते हैं।
    reason: cultural_note
lexical_decisions:
- source_word: לֶאֱחֹז
  choice: कि वह ... पकड़ ले
  rationale: लָמֶד-सहित infinitive पूर्ववर्ती पद से जुड़ा उद्देश्य या परिणाम व्यक्त करता है। ‘पकड़ ले’ אחז की ठोस काव्यात्मक छवि को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: בְּכַנְפוֹת
  choice: छोरों को
  rationale: כָּנָף का मूल अर्थ ‘पंख’ है, पर पृथ्वी के साथ यह उसके दूरस्थ सिरों या किनारों का काव्यात्मक बिंब है। हिन्दी में ‘छोर’ इस स्थानगत अर्थ को सहजता से व्यक्त करता है।
- source_word: הָאָרֶץ
  choice: पृथ्वी
  rationale: सृष्टि और भोर के इस विश्वव्यापी संदर्भ में הארץ का आशय किसी सीमित भूभाग से नहीं, पृथ्वी से है।
- source_word: וְיִנָּעֲרוּ
  choice: झाड़ दिए जाएँ
  rationale: נער का निफ़अल रूप किसी वस्तु को झाड़कर अलग कर दिए जाने का भाव देता है। यह पृथ्वी को वस्त्र की तरह झाड़ने वाले बिंब को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: רְשָׁעִים
  choice: दुष्ट
  rationale: यह विशेषण यहाँ संज्ञा के रूप में दुष्ट लोगों को दर्शाता है। ‘दुष्ट’ संक्षिप्त, प्रतिष्ठित और सामान्य हिन्दी प्रयोग है।
- source_word: מִמֶּנָּה
  choice: उसमें से
  rationale: स्त्रीलिंग एकवचन प्रत्यय का संबंध הארץ से है। ‘उसमें से’ पृथ्वी से दुष्टों के हटाए जाने का भाव स्पष्ट करता है।
