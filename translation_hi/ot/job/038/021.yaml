base_translation:
  language: en
  yaml_path: translation/ot/job/038/021.yaml
  text: You know[a], for then you were born, and the number of your days is great!
translation:
  language: hi
  text: तुम जानते हो[a], क्योंकि तुम उस समय जन्मे थे, और तुम्हारे दिनों की संख्या बहुत बड़ी है!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम जानते थे।” इब्रानी क्रिया पूर्ण रूप में है, पर यहाँ व्यंग्यपूर्ण कथन में “तुम जानते हो” भी स्वाभाविक अर्थ देता है।
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: יָדַעְתָּ
  choice: तुम जानते हो
  rationale: यह ידע का क़ाल पूर्ण, द्वितीय पुरुष एकवचन पुल्लिंग रूप है। यहाँ परमेश्वर के व्यंग्यपूर्ण प्रश्न में वर्तमान काल का हिंदी प्रयोग अलंकारिक प्रभाव को स्वाभाविक रूप से व्यक्त करता है; व्याकरण की दृष्टि से भूतकाल का अर्थ भी संभव है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले पद के अलंकारिक प्रश्न का व्यंग्यपूर्ण कारण प्रस्तुत करता है। आधुनिक हिंदी में ‘क्योंकि’ इस संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: אָז
  choice: उस समय
  rationale: यह पहले वर्णित सृष्टि-घटनाओं के समय की ओर संकेत करने वाला कालवाचक क्रियाविशेषण है।
- source_word: תִּוָּלֵד
  choice: तुम ... जन्मे थे
  rationale: 'यह ילד का निफ़ाल अपूर्ण, द्वितीय पुरुष एकवचन पुल्लिंग रूप है। प्रसंग में इसका व्यंग्यपूर्ण भूतकालीन संदर्भ है: मानो अय्यूब सृष्टि के समय जन्म चुका था।'
- source_word: וּמִסְפַּר
  choice: और ... संख्या
  rationale: संयोजक उपसर्ग सहित यह संबंधसूचक संज्ञा है; ‘संख्या’ मूल वाक्य-विन्यास और अर्थ को सुरक्षित रखती है।
- source_word: יָמֶיךָ
  choice: तुम्हारे दिनों की
  rationale: यह प्रत्यययुक्त संबंधसूचक रचना है; ‘तुम्हारे दिनों की संख्या’ इब्रानी संरचना का स्वाभाविक हिंदी रूप है।
- source_word: רַבִּים
  choice: बहुत बड़ी है
  rationale: यह ‘संख्या’ के बारे में विधेय विशेषण है। ‘बहुत बड़ी है’ एकवचन प्रधान संज्ञा ‘संख्या’ के साथ मेल खाता और व्यंग्य को बनाए रखता है; ‘दिन बहुत हैं’ भी अर्थ की दृष्टि से संभव है।
