  text: מִי שָׂ֣ם מְ֭מַדֶּי/הָ כִּ֣י תֵדָ֑ע א֤וֹ מִֽי נָטָ֖ה עָלֶ֣י/הָ קָּֽו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/005.yaml
  text: Who set its measurements[a], if you know, or who stretched a line upon it?
translation:
  language: hi
  text: किसने उसकी मापें ठहराईं[a]—यदि तू जानता है—या किसने उस पर मापने की डोरी तानी?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके आयाम।”
    reason: מְמַדֶּיהָ के लिए ‘मापें’ और ‘आयाम’ दोनों सम्भव हैं; मुख्य पाठ में अधिक साधारण शब्द रखा गया है।
lexical_decisions:
- source_word: מִי
  choice: किसने
  rationale: यह प्रश्नवाचक सर्वनाम परमेश्वर के आलंकारिक प्रश्न का आरम्भ करता है।
- source_word: שָׂם
  choice: ठहराईं
  rationale: שׂים का अर्थ यहाँ पृथ्वी की मापों को निर्धारित या निश्चित करना है; ‘ठहराईं’ स्थापत्य-बिंब और गरिमामय आधुनिक हिन्दी दोनों के अनुकूल है।
- source_word: מְמַדֶּיהָ
  choice: उसकी मापें
  rationale: स्त्रीलिंग एकवचन प्रत्यय प्रसंग में पृथ्वी की ओर संकेत करता है; बहुवचन संज्ञा उसके निर्धारित विस्तारों या आयामों को व्यक्त करती है।
- source_word: כִּי תֵדָע
  choice: यदि तू जानता है
  rationale: रूपतः כִּי सामान्यतः कारणसूचक है, पर इस आलंकारिक प्रसंग में वाक्यांश चुनौतीपूर्ण ‘यदि तू जानता है’ का भाव देता है; इससे व्यंग्यार्थ को अत्यधिक स्पष्ट किए बिना तनाव बना रहता है।
- source_word: אוֹ
  choice: या
  rationale: यह समानांतर प्रश्नों को जोड़ने वाला सामान्य विकल्पसूचक संयोजक है।
- source_word: נָטָה
  choice: तानी
  rationale: निर्माण और नापने के बिंब में क्रिया डोरी को खींचकर फैलाने का संकेत देती है; हिन्दी में ‘डोरी तानी’ स्वाभाविक है।
- source_word: עָלֶיהָ
  choice: उस पर
  rationale: पूर्वसर्ग और स्त्रीलिंग प्रत्यय पृथ्वी के ऊपर या उस पर डोरी तानने का स्थानिक बिंब रखते हैं।
- source_word: קָּו
  choice: मापने की डोरी
  rationale: निर्माण-संदर्भ में קו केवल सामान्य रेखा नहीं, नापने के लिए तानी जाने वाली डोरी को सूचित करता है; हिन्दी में इसे स्पष्ट करना स्वाभाविक और स्रोत-संगत है।
theological_decisions: []
translation_notes:
  register: आधुनिक, गरिमामय और सहज हिन्दी। परमेश्वर का अय्यूब से एकवचन सम्बोधन बनाए रखने के लिए ‘तू’ रखा गया है। स्थापत्य-बिंब को ‘मापें’ और ‘मापने की डोरी’ से स्पष्ट किया गया है; विराम-चिह्न आलंकारिक चुनौती को उभारते हैं।
