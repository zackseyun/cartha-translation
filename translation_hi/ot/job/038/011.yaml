translation:
  language: hi
  text: और मैंने कहा[क], “तू यहाँ तक आएगा, इससे आगे नहीं; यहीं तेरी गर्वीली लहरें रोक दी जाएँगी।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: या, “यहीं तेरी गर्वीली लहरें थम जाएँगी।” इब्रानी क्रिया का शाब्दिक अर्थ ‘रखना’ या ‘स्थापित करना’ है; इस पंक्ति में यह उस स्थान का भाव व्यक्त करती है जहाँ समुद्र की उमड़ती लहरें रोक दी जाती हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: और मैंने कहा
  rationale: אמר का प्रथम पुरुष एकवचन वय्यिक्तोल रूप पिछले वर्णन को क्रमशः आगे बढ़ाता है; सरल भूतकाल स्वाभाविक है।
- source_word: עַד־פֹּה תָבוֹא
  choice: तू यहाँ तक आएगा
  rationale: עַד־פֹּה स्थानिक सीमा बताता है और समुद्र को पुरुष एकवचन में संबोधित किया गया है। भविष्यत् रूप आज्ञात्मक सीमा के भीतर आने की अनुमति को संदर्भ में व्यक्त करता है।
- source_word: וְלֹא תֹסִיף
  choice: इससे आगे नहीं
  rationale: יסף का मूल अर्थ ‘और बढ़ना/जारी रखना’ है; सीमा-निर्धारण के प्रसंग में यह संक्षिप्त और स्वाभाविक हिन्दी है।
- source_word: וּפֹא יָשִׁית
  choice: यहीं ... रोक दी जाएँगी
  rationale: שׁית का शाब्दिक अर्थ ‘रखना/स्थापित करना’ है, पर इस प्रसंग में निर्धारित बिंदु पर लहरों को थामे जाने का भाव है। हिन्दी का कर्मवाच्य अनिर्दिष्ट कर्ता जोड़े बिना यह अर्थ व्यक्त करता है।
- source_word: בִּגְאוֹן גַּלֶּיךָ
  choice: तेरी गर्वीली लहरें
  rationale: גאון गर्व, उत्कर्ष या वैभव सूचित कर सकता है; उमड़ती समुद्री लहरों के संदर्भ में ‘गर्वीली’ काव्यात्मक मानवीकरण और उच्छृंखल ऊँचाई दोनों बनाए रखता है।
theological_decisions:
- issue: परमेश्वर द्वारा समुद्र को सीधे संबोधित किया जाना
  choice: समुद्र के लिए द्वितीय पुरुष एकवचन ‘तू/तेरी’ बनाए रखा गया है।
  alternative: समुद्र को पूरी तरह निर्जीव प्राकृतिक शक्ति मानकर संबोधन हटा देना।
  rationale: इब्रानी पाठ समुद्र का काव्यात्मक मानवीकरण करता है और सृष्टि पर परमेश्वर की प्रभुता दिखाता है; इससे समुद्र को स्वतंत्र देवता या दैवी प्रतिद्वंद्वी नहीं माना जाता।
- issue: יָשִׁית की व्याकरणिक और अर्थगत अस्पष्टता
  choice: प्रसंगानुसार कर्मवाच्य ‘रोक दी जाएँगी’ रखा गया है।
  alternative: अधिक शाब्दिक ‘रख दी जाएँगी/स्थापित की जाएँगी’ या कर्तृवाच्य ‘वह रोकेगा’।
  rationale: रूप शाब्दिक रूप से ‘रखेगा/स्थापित करेगा’ हो सकता है, पर वाक्य समुद्र की सीमा पर उसकी लहरों के रोके जाने को व्यक्त करता है। अनिर्दिष्ट कर्ता को स्पष्ट रूप से जोड़ना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और काव्यात्मक शैली। समुद्र को प्रत्यक्ष संबोधन के कारण ‘तू’ अपमानसूचक नहीं, बल्कि मूल के पुरुष एकवचन और सजीव काव्यात्मक संबोधन का स्वाभाविक रूप है।
