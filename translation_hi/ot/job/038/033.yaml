base_translation:
  language: en
  yaml_path: translation/ot/job/038/033.yaml
  text: Do you know the ordinances of the heavens? Can you establish their rule on the earth?[a]
translation:
  language: hi
  text: क्या तू आकाश के नियमों को जानता है? क्या तू पृथ्वी पर उसका शासन स्थापित कर सकता है?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उसका शासन’ के लिए ‘उसका प्रभुत्व’ या ‘उसका अधिकार’ भी संभव है। हिब्रू प्रत्यय एकवचन (‘उसका’) है और संभवतः आकाश को सामूहिक रूप से संदर्भित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיָדַעְתָּ
  choice: क्या तू ... जानता है?
  rationale: प्रश्नवाचक הֲ और ידע के पूर्ण रूप को यहाँ वर्तमान ज्ञान को चुनौती देने वाले स्वाभाविक हिन्दी प्रश्न के रूप में व्यक्त किया गया है। एकवचन अनौपचारिक ‘तू’ अय्यूब से सीधे संबोधन और मूल के 2ms रूप को बनाए रखता है।
- source_word: חֻקּוֹת
  choice: नियमों
  rationale: यह शब्द निर्धारित सीमाओं और स्थिर विधानों का बोध कराता है। सृष्टि के संदर्भ में ‘नियम’ सहज, स्पष्ट और गरिमापूर्ण है तथा मानव-कानून तक अर्थ को सीमित नहीं करता।
- source_word: שָׁמָיִם
  choice: आकाश
  rationale: हिब्रू रूप बहुवचनात्मक है, पर आधुनिक हिन्दी में ‘आकाश’ ही स्वाभाविक सामूहिक पद है और आकाशीय जगत का आशय ठीक प्रकार व्यक्त करता है।
- source_word: אִם תָּשִׂים
  choice: क्या तू ... स्थापित कर सकता है?
  rationale: אִם यहाँ पहले प्रश्न के समानांतर दूसरा प्रश्न आरम्भ करता है। שׂים का मूल अर्थ ‘रखना/ठहराना’ है; शासन के साथ ‘स्थापित करना’ उसे प्रभावी करने का प्रसंगगत भाव देता है।
- source_word: מִשְׁטָרוֹ
  choice: उसका शासन
  rationale: מִשְׁטָר शासन, प्रभुत्व या शासकीय अधिकार को सूचित करता है। प्रत्यय व्याकरणतः एकवचन है; ‘उसका’ उसे सुरक्षित रखता है और ‘आकाश’ को सामूहिक रूप में संदर्भित करता है।
- source_word: בָאָרֶץ
  choice: पृथ्वी पर
  rationale: यहाँ ב पृथ्वी को उस क्षेत्र के रूप में प्रस्तुत करता है जहाँ आकाशीय शासन स्थापित किया जाता है; ‘पृथ्वी पर’ स्वाभाविक हिन्दी है।
theological_decisions:
- issue: आकाशीय व्यवस्था का स्वरूप
  choice: पद सृष्टि में परमेश्वर द्वारा ठहराए गए स्थिर आकाशीय नियमों और उनके शासन की बात करता है, पर ज्योतिषीय नियतिवाद को निर्दिष्ट नहीं करता।
  alternative: इसे नक्षत्रों या तारों द्वारा पृथ्वी की घटनाओं पर ज्योतिषीय प्रभाव के स्पष्ट कथन के रूप में समझना।
  rationale: निकट संदर्भ तारों और आकाश से संबंधित है, किंतु हिब्रू शब्द स्थिर नियम और शासन पर बल देते हैं। अनुवाद आकाशीय शासन की भाषा बनाए रखता है, पर मूल से आगे बढ़कर ज्योतिषीय कारणता नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सीधा, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध प्रश्नात्मक रूप अपनाया गया है। ‘आकाश’ हिन्दी में स्वाभाविक सामूहिक संज्ञा है; ‘उसका’ मूल के एकवचन प्रत्यय को बनाए रखता है।
