base_translation:
  language: en
  yaml_path: translation/ot/job/038/022.yaml
  text: Have you entered the storehouses of the snow[a], or have you seen the storehouses of the hail?
translation:
  language: hi
  text: क्या तुम हिम के भंडारों में गए हो,[a] या तुमने ओलों के भंडार देखे हैं?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “क्या तुम हिम के खजानों में गए हो ... या तुमने ओलों के खजाने देखे हैं?”
    reason: אֹצָר के ‘भंडार’ और ‘खजाना’ दोनों अर्थ संभव हैं; मुख्य पाठ संचय-स्थान के बिंब को प्राथमिकता देता है, जबकि वैकल्पिक पाठ अधिक पारंपरिक रूपक सुरक्षित रखता है।
lexical_decisions:
- source_word: הֲבָאתָ אֶל
  choice: क्या तुम ... में गए हो
  rationale: प्रश्नवाचक הֲ के साथ בוא का पूर्ण रूप यहाँ आलंकारिक प्रश्न बनाता है। אֶל की दिशासूचक शक्ति को ‘में गए’ स्वाभाविक हिन्दी में व्यक्त करता है; इससे भंडारों के भीतर पहुँचने का ठोस बिंब बना रहता है।
- source_word: אֹצְרוֹת
  choice: भंडारों
  rationale: אֹצָר का अर्थ खजाना, भंडार अथवा संग्रह-स्थान हो सकता है। मौसम के संचित भंडार के रूपक के लिए ‘भंडार’ सहज, गरिमापूर्ण और आधुनिक हिन्दी में स्पष्ट है।
- source_word: שָׁלֶג
  choice: हिम
  rationale: यह बर्फ के रूप में होने वाली वर्षा का मानक अर्थ है। ‘हिम’ काव्यात्मक प्रसंग में संक्षिप्त और स्वाभाविक है।
- source_word: וְאֹצְרוֹת
  choice: या ... भंडार
  rationale: मूल का וְ दूसरी समानांतर प्रश्नात्मक इकाई को जोड़ता है। हिन्दी में दो विकल्पवत् आलंकारिक प्रश्नों का स्वाभाविक समन्वय ‘या’ से होता है।
- source_word: בָּרָד
  choice: ओलों
  rationale: मौसम संबंधी संज्ञा का सामान्य हिन्दी रूप ‘ओला’ है; संबंधसूचक बहुवचन में ‘ओलों के’ किया गया है।
- source_word: תִּרְאֶה
  choice: तुमने ... देखे हैं
  rationale: रूपतः अपूर्ण क्रिया होने पर भी काव्यात्मक प्रश्न-क्रम में यह पहले पूर्ण रूप के समानांतर है। ‘तुमने ... देखे हैं’ हिन्दी में अनुभव के विषय में आलंकारिक प्रश्न को स्वाभाविक ढंग से व्यक्त करता है।
