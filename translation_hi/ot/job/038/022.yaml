  register: आधुनिक मानक हिन्दी में सीधे संबोधन और काव्यात्मक गरिमा रखी गई है। ‘हिम’ तथा ‘ओलों’ मौसम संबंधी बिंब स्पष्ट रखते हैं; ‘भंडार’ सामान्य पाठक के लिए ‘खजाना’ की अपेक्षा संग्रह-स्थान का अर्थ अधिक सहजता से देता है।
