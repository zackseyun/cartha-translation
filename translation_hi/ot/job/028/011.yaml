base_translation:
  language: en
  yaml_path: translation/ot/job/028/011.yaml
  text: He dams up the sources of the rivers[a], and brings what is hidden out to the light.
translation:
  language: hi
  text: वह नदियों के रिसते जल को रोक देता है[a], और जो छिपा है उसे उजाले में ले आता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह नदियों के सोतों को बाँध देता है।” यहाँ प्रयुक्त इब्रानी शब्द दुर्लभ है और उसमें “रोने,” “टपकने” या जल के रिसने की छवि हो सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְּכִי
  choice: रिसते जल को
  rationale: यह दुर्लभ और कठिन पद शाब्दिक रूप से ‘रोने’ या ‘टपकने’ की छवि जगा सकता है। खनन और भूमिगत जल को नियंत्रित करने के प्रसंग में ‘रिसते जल’ उस छवि और व्यावहारिक अर्थ—दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: נְהָרוֹת
  choice: नदियों के
  rationale: बहुवचन संज्ञा का सामान्य अर्थ ‘नदियाँ’ है; सम्बन्धसूचक रूप हिन्दी वाक्य-विन्यास के अनुसार रखा गया है।
- source_word: חִבֵּשׁ
  choice: रोक देता है
  rationale: मूल क्रिया का अर्थ बाँधना, कसना या अवरुद्ध करना है। जल-नियंत्रण के इस प्रसंग में ‘रोक देता है’ स्पष्ट और स्वाभाविक है, जबकि बाँधने की अधिक शाब्दिक सम्भावना पाद-टिप्पणी में दी गई है।
- source_word: תַּעֲלֻמָהּ
  choice: जो छिपा है
  rationale: यह पद किसी छिपी या गुप्त वस्तु को सूचित करता है। अनुवाद जानबूझकर उसे ‘अयस्क’ या ‘खजाना’ नहीं बनाता, ताकि मूल की व्यापकता बनी रहे।
- source_word: יֹצִא
  choice: ले आता है
  rationale: हिफ़ील रूप का कारणवाचक अर्थ ‘बाहर निकालना/ले आना’ है; हिन्दी मुहावरे में प्रकाश के साथ ‘उजाले में ले आना’ स्वाभाविक है।
- source_word: אוֹר
  choice: उजाले में
  rationale: छिपे होने के विपरीत प्रकट किए जाने की मूल छवि को सहज आधुनिक हिन्दी में व्यक्त करता है।
