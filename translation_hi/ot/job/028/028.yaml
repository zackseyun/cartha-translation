source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לָֽ/אָדָ֗ם הֵ֤ן יִרְאַ֣ת אֲ֭דֹנָ/י הִ֣יא חָכְמָ֑ה וְ/ס֖וּר מֵ/רָ֣ע בִּינָֽה׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/028/028.yaml
  text: And he said to man[a], ‘Behold, the fear of the Lord—that is wisdom, and to turn away from evil is understanding.’
translation:
  language: hi
  text: और उसने मनुष्य[a] से कहा, “देखो, प्रभु का भय ही बुद्धि है, और बुराई से दूर रहना समझ है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मानवजाति से।” इब्रानी אָדָם एकवचन “मनुष्य” है, जिसका प्रयोग यहाँ पूरी मानवता के प्रतिनिधि रूप में हुआ है।
    reason: प्रतिनिधिक एकवचन के व्यापक मानवीय आशय को स्पष्ट करना।
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: और उसने कहा
  rationale: वाव-युक्त कथात्मक क्रिया पूर्ववर्ती विचार से संबंध जोड़ती है; ‘और उसने कहा’ किसी अतिरिक्त कालक्रम को आरोपित किए बिना यह संबंध बनाए रखता है।
- source_word: לָאָדָם
  choice: मनुष्य से
  rationale: אָדָם यहाँ किसी नामित व्यक्ति के बजाय समस्त मानवता का प्रतिनिधित्व करने वाला एकवचन है। ‘मनुष्य’ हिंदी में इसके व्याकरणिक रूप और व्यापक आशय दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הֵן
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला उद्गार है। ‘देखो’ कथन की गंभीर, संकेतात्मक शक्ति को सहज आधुनिक हिंदी में बनाए रखता है।
- source_word: יִרְאַת אֲדֹנָי
  choice: प्रभु का भय
  rationale: ‘भय’ को ‘श्रद्धा’ मात्र बनाकर नरम नहीं किया गया, क्योंकि मूल शब्द श्रद्धायुक्त भय और विस्मय की पूरी अर्थ-छाया रखता है।
- source_word: הִיא
  choice: ही ... है
  rationale: 'स्वतंत्र सर्वनाम द्वारा दिए गए समीकरणात्मक बल को हिंदी में ‘ही’ से व्यक्त किया गया है: प्रभु का भय ही बुद्धि है।'
- source_word: חָכְמָה
  choice: बुद्धि
  rationale: अय्यूब 28 के ज्ञान-विषयक संदर्भ में यह חָכְמָה का मानक और स्वाभाविक हिंदी प्रतिशब्द है।
- source_word: וְסוּר מֵרָע
  choice: और बुराई से दूर रहना
  rationale: यह जान-बूझकर नैतिक बुराई से हटने या बचने की क्रिया बताता है। ‘दूर रहना’ हिंदी में स्वाभाविक है और समानांतर वाक्य-रचना को बनाए रखता है।
- source_word: בִּינָה
  choice: समझ
  rationale: यह ज्ञान-साहित्य के पद का सीधा, सामान्य और बोधगम्य हिंदी रूप है तथा ‘बुद्धि’ के साथ स्वाभाविक समानांतर बनाता है।
theological_decisions:
- issue: प्रतिनिधिक אָדָם का अनुवाद
  choice: मनुष्य
  alternative: मानवजाति
  rationale: मूल इब्रानी शब्द व्याकरण की दृष्टि से एकवचन है, पर यहाँ उसका आशय पूरी मानवता है। ‘मनुष्य’ रूप और सामूहिक प्रतिनिधिक अर्थ दोनों को सुरक्षित रखता है; व्यापक आशय पादटिप्पणी में स्पष्ट किया गया है।
- issue: יִרְאָה की अर्थ-तीव्रता
  choice: भय
  alternative: श्रद्धा
  rationale: मूल शब्द को केवल सम्मान या श्रद्धा तक सीमित करना उसके विस्मय और भय के आयाम को कम कर देगा। इसलिए पारंपरिक और अर्थतः व्यापक ‘भय’ रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘देखो’ मूल उद्गार की गंभीरता, ‘ही’ समीकरण के बल, और ‘भय’ मूल धार्मिक-नैतिक तनाव को सुरक्षित रखते हैं।
