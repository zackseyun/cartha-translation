  text: But wisdom—from where does it come? And where is the place of understanding?[a]
translation:
  language: hi
  text: पर बुद्धि—वह कहाँ से आती है? और समझ का स्थान कहाँ है?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “और बुद्धि कहाँ से आती है, और समझ का स्थान कहाँ है?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַחָכְמָה
  choice: पर बुद्धि
  rationale: חָכְמָה का स्वाभाविक हिन्दी रूप ‘बुद्धि’ है। आरम्भिक וְ यहाँ कविता के मुख्य प्रश्न की ओर विरोधात्मक वापसी कराता है, इसलिए ‘पर’ उपयुक्त है।
- source_word: מֵאַיִן
  choice: कहाँ से
  rationale: מִן से जुड़ा प्रश्नवाचक शब्द उद्गम पूछता है; ‘कहाँ से’ इस अर्थ को स्पष्ट और स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: תָּבוֹא
  choice: आती है
  rationale: בוא का स्त्रीलिंग एकवचन अपूर्ण रूप यहाँ सामान्य, अलंकारिक वर्तमान प्रश्न व्यक्त करता है और उसका कर्ता ‘बुद्धि’ है।
- source_word: וְאֵי זֶה
  choice: और ... कहाँ है
  rationale: यह स्थानवाचक प्रश्न है। ‘और ... कहाँ है’ समानांतर दूसरी पंक्ति को आधुनिक हिन्दी में सहज रूप देता है।
- source_word: מְקוֹם
  choice: स्थान
  rationale: מְקוֹם का सीधा अर्थ ‘स्थान’ है; यह काव्यात्मक गरिमा बनाए रखते हुए सामान्य पाठक के लिए स्पष्ट है।
- source_word: בִּינָה
  choice: समझ
  rationale: בִּינָה समझ, अंतर्दृष्टि या विवेक को सूचित कर सकता है। ‘समझ’ व्यापक अर्थ को बिना अनावश्यक संकीर्णता के रखता है और ‘बुद्धि’ से स्वाभाविक जोड़ी बनाता है।
