lexical_decisions:
- source_word: לַעֲשׂוֹת
  choice: जब उसने ... ठहराया
  rationale: ל prefixed infinitive surrounding context में परमेश्वर के सृष्टि-व्यवस्थापन का कालसूचक प्रसंग आगे बढ़ाता है। हिंदी में ‘जब उसने’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לָרוּחַ
  choice: हवा
  rationale: רוּחַ के अर्थ ‘हवा’, ‘आत्मा’ या ‘साँस’ हो सकते हैं; यहाँ ‘जल’ के साथ समानांतरता और सृष्टि का प्रसंग प्राकृतिक हवा का अर्थ समर्थित करते हैं।
- source_word: מִשְׁקָל
  choice: भार
  rationale: מִשְׁקָל भार या तौल को दर्शाता है। ‘हवा का भार’ मूल काव्यात्मक चित्र और परमेश्वर द्वारा निर्धारित व्यवस्था को बनाए रखता है।
- source_word: וּמַיִם
  choice: जल
  rationale: מַיִם रूप में बहुवचन है, पर प्रायः द्रव्यवाचक संज्ञा की तरह प्रयुक्त होता है। आधुनिक मानक हिंदी में ‘जल’ काव्यात्मक और स्वाभाविक है।
- source_word: תִּכֵּן
  choice: नापा
  rationale: תכן का अर्थ ठीक-ठीक नापना, तौलना या निर्धारित करना है। ‘नापा’ מִשְׁקָל के समानांतर परिमाण की छवि को स्पष्ट रखता है।
- source_word: בְּמִדָּה
  choice: माप से
  rationale: בְּמִדָּה किसी माप या निर्धारित परिमाण के अनुसार होने का भाव देता है। ‘माप से’ संक्षिप्त रहते हुए मूल अभिव्यक्ति को निकटता से प्रस्तुत करता है।
theological_decisions:
- issue: पिछले पद से कर्ता की निरंतरता
  choice: अंतर्निहित कर्ता परमेश्वर है, जिसे ‘उसने’ से व्यक्त किया गया है।
  alternative: कर्ता को व्यक्त न करके केवल क्रियार्थक वाक्यांश रखना।
  rationale: इब्रानी क्रियार्थक रचना पद 24 और आसपास के प्रसंग में परमेश्वर के कार्य पर निर्भर है। हिंदी में ‘उसने’ जोड़ना पठनीयता के लिए आवश्यक है और कोई अतिरिक्त धर्मवैज्ञानिक दावा नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण काव्यात्मक शैली रखी गई है। ‘ठहराया’ नियत करने का भाव देता है, जबकि ‘भार’ और ‘माप’ मूल पद की परिमाण-संबंधी समानांतरता बनाए रखते हैं।
