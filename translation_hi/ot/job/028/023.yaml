source:
  edition: WLC
  text: אֱ֭לֹהִים הֵבִ֣ין דַּרְכָּ֑/הּ וְ֝/ה֗וּא יָדַ֥ע אֶת מְקוֹמָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/023.yaml
  text: God understands its way[a], and he knows its place.
translation:
  language: hi
  text: 'परमेश्वर उसकी राह समझता है,

    और वह उसका स्थान जानता है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: यहाँ रूप बहुवचन-जैसा होने पर भी क्रियाएँ एकवचन हैं और संकेत एकमात्र परमेश्वर की ओर है; आधुनिक मानक हिन्दी में ‘परमेश्वर’ स्वाभाविक और गरिमापूर्ण है।
- source_word: הֵבִין
  choice: समझता है
  rationale: בין के हिफ़ील रूप में समझने या भली-भाँति पहचानने का भाव है। वर्तमान काल काव्य में व्यक्त सार्वकालिक सत्य को स्वाभाविक रूप से दर्शाता है।
- source_word: דַּרְכָּהּ
  choice: उसकी राह
  rationale: स्त्रीलिंग प्रत्यय पिछले प्रसंग की ‘बुद्धि’ की ओर संकेत करता है। ‘राह’ मूल रूपक को बनाए रखती है और इसे अनावश्यक रूप से केवल ‘उस तक पहुँचने का मार्ग’ नहीं बनाती।
- source_word: וְהוּא
  choice: और वही
  rationale: स्वतंत्र सर्वनाम הוּא बल देता है; हिन्दी में ‘वही’ उस बल को सहज ढंग से व्यक्त करता है।
- source_word: יָדַע
  choice: जानता है
  rationale: क्रिया ज्ञान को व्यक्त करती है; वर्तमान काल परमेश्वर के स्थायी ज्ञान के कथन के अनुकूल है।
- source_word: אֶת מְקוֹמָהּ
  choice: जानता है कि उसका स्थान कहाँ है
  rationale: शाब्दिक ‘उसका स्थान जानता है’ सम्भव है, पर हिन्दी में यह पद-विन्यास अधिक स्वाभाविक है और מְקוֹם का स्थानगत अर्थ स्पष्ट रखता है।
theological_decisions:
- issue: स्त्रीलिंग प्रत्ययों का संदर्भ
  choice: ‘उसकी/उसका’ के द्वारा इन्हें प्रसंग की ‘बुद्धि’ से जोड़ा गया है।
  alternative: ‘बुद्धि की राह ... बुद्धि का स्थान’ कहकर संज्ञा दोहराना।
  rationale: हिब्रू में प्रत्यय व्याकरणतः स्त्रीलिंग हैं और प्रसंग में बुद्धि की ओर लौटते हैं। हिन्दी में ‘बुद्धि’ भी स्त्रीलिंग है, इसलिए सामान्य सर्वनाम बिना अतिरिक्त व्यक्तिकरण के मूल संबंध को स्वाभाविक रूप से बनाए रखता है।
- issue: स्वतंत्र सर्वनाम הוּא का बल
  choice: ‘वही’
  alternative: साधारण ‘वह’
  rationale: ‘वही’ परमेश्वर के अद्वितीय ज्ञान पर मूल पाठ के बल को सुरक्षित रखता है, पर पद में उससे अधिक धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, काव्यात्मक और गरिमापूर्ण रूप। ‘राह’ ज्ञान-संबंधी मूल रूपक को बनाए रखती है; दूसरी पंक्ति का उपवाक्य हिन्दी में सहजता और स्पष्टता देता है। किसी पाद-टिप्पणी की आवश्यकता नहीं, क्योंकि हिन्दी में ‘बुद्धि’ तथा उससे जुड़े सर्वनामों का स्त्रीलिंग मेल मूल हिब्रू के संकेत को स्वाभाविक रूप से व्यक्त करता है।
