  rationale: The revision makes the thunder–lightning expression more source-sensitive and idiomatic in modern Hindi, retains the poetic parallelism, and adds the needed lexical-alternative footnote. Repeating ‘ठहराया’ clarifies the Hebrew verb governed across both coordinated phrases without changing the meaning.
