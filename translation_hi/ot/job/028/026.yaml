base_translation:
  language: en
  yaml_path: translation/ot/job/028/026.yaml
  text: when he made a decree for the rain[a], and a path for the thunderbolt of the storms,
translation:
  language: hi
  text: 'जब उसने वर्षा के लिए नियम ठहराया,

    और गर्जनवाली बिजली[a] के लिए मार्ग ठहराया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘गर्जनों की बिजली।’
    reason: हिब्रू חֲזִיז קֹלוֹת का अधिक शाब्दिक अनुवाद; यह बिजली/वज्र और गर्जनों के संबंध को बनाए रखता है।
lexical_decisions:
- source_word: בַּעֲשֹׂתוֹ
  choice: जब उसने…ठहराया…बनाया
  rationale: ב के साथ infinitive construct यहाँ समयसूचक है। हिन्दी में संयुक्त काव्य-पंक्ति को स्वाभाविक रखने के लिए ‘जब उसने’ दोनों समानांतर कर्मों पर लागू होता है।
- source_word: לַמָּטָר
  choice: वर्षा के लिए
  rationale: מָטָר का अर्थ ‘वर्षा’ है; निश्चित रूप को हिन्दी में अलग संकेतित करना आवश्यक नहीं है।
- source_word: חֹק
  choice: नियम
  rationale: חֹק यहाँ सृष्टि में निर्धारित व्यवस्था या विधान को दर्शाता है। ‘नियम’ सामान्य पाठक के लिए स्वाभाविक है और कानूनी अर्थ को अनावश्यक रूप से प्रबल नहीं करता।
- source_word: וְדֶרֶךְ
  choice: और…मार्ग
  rationale: דֶּרֶךְ का मूल बिंब ‘मार्ग’ है, अर्थात आकाश में प्राकृतिक शक्ति के लिए निर्धारित पथ।
- source_word: לַחֲזִיז קֹלוֹת
  choice: गरजती बिजली के लिए
  rationale: חֲזִיז बिजली की चमक या वज्र-जैसी बिजली को और קֹלוֹת गर्जन/ध्वनियों को सूचित करता है। ‘गरजती बिजली’ दोनों तत्वों को संक्षिप्त, स्वाभाविक हिन्दी में बनाए रखती है।
theological_decisions:
- issue: परमेश्वर द्वारा सृष्टि की व्यवस्था
  choice: पद को वर्षा और गरजती बिजली के लिए निर्धारित नियम और मार्ग स्थापित करने के वर्णन के रूप में रखा गया है।
  alternative: इसे परमेश्वर के निरंतर विधान या प्रकृति पर व्यापक दार्शनिक नियंत्रण की स्पष्ट व्याख्या बनाना।
  rationale: इब्रानी पाठ सृष्टि में ईश्वर-स्थापित व्यवस्था का काव्यात्मक चित्र देता है; अनुवाद इसी संकेत को रखता है, पर पाठ से आगे व्यवस्थित धर्मवैज्ञानिक भाषा नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; काव्यात्मक, गरिमापूर्ण और सामान्य पाठक के लिए सहज। ‘ठहराया’ और ‘बनाया’ समानांतर क्रियाओं को स्पष्ट करते हैं, यद्यपि स्रोत में दूसरी पंक्ति की क्रिया पहले खंड से समझी जाती है।
