  text: He puts his hand to the flint[b][a]; he overturns mountains from their roots.
translation:
  language: hi
  text: 'वह चकमक चट्टान[a] पर हाथ लगाता है;

    वह पहाड़ों को जड़ से[b] उलट देता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘चकमक चट्टान के विरुद्ध’ अथवा ‘कठोर चट्टान में।’ इब्रानी में खनन करते समय कठोर चट्टान पर हाथ लगाने का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘पहाड़ों की जड़ से’; इब्रानी में ‘जड़’ एकवचन है और उसका अर्थ सामूहिक हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחַלָּמִישׁ
  choice: चकमक चट्टान पर
  rationale: חַלָּמִישׁ कठोर चट्टान या चकमक पत्थर को दर्शाता है। בְּ को यहाँ खनन के काम में उस चट्टान पर या उसके विरुद्ध हाथ लगाने के अर्थ में लिया गया है।
- source_word: שָׁלַח יָדוֹ
  choice: हाथ लगाता है
  rationale: शाब्दिक रूप से ‘अपना हाथ बढ़ाता/भेजता है’; इस प्रसंग में यह किसी कठिन काम में सक्रिय रूप से हाथ लगाने का मुहावरा है।
- source_word: הָפַךְ
  choice: उलट देता है
  rationale: הפך का अर्थ पलटना या उलट देना है; खनन के संदर्भ में यह पहाड़ों की गहरी और व्यापक खुदाई का सशक्त चित्र बनाए रखता है।
- source_word: מִשֹּׁרֶשׁ
  choice: जड़ से
  rationale: एकवचन ‘जड़’ को हिन्दी के स्वाभाविक सामूहिक मुहावरे ‘जड़ से’ द्वारा व्यक्त किया गया है, जो पहाड़ों के आधार तक पहुँचने का भाव देता है।
- source_word: הָרִים
  choice: पहाड़ों
  rationale: הָרִים का सीधा और प्रसंगानुकूल अर्थ ‘पहाड़’ है।
