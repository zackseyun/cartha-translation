  text: Then he saw it and declared it; he established it[a], and also searched it out.
translation:
  language: hi
  text: तब उसने उसे देखा, उसका वर्णन किया[a]; उसे स्थापित किया और उसकी पूरी जाँच भी की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसे गिना,” “उसका वृत्तांत सुनाया,” अथवा “उसे घोषित किया।” इब्रानी क्रिया में गिनने, वृत्तांत सुनाने या घोषित करने के अर्थ हो सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: तब
  rationale: यह कालवाचक क्रियाविशेषण काव्यात्मक क्रम को आगे बढ़ाता है; ‘तब’ स्वाभाविक और संक्षिप्त है।
- source_word: רָאָהּ
  choice: उसने उसे देखा
  rationale: ראה के साथ स्त्रीलिंग एकवचन प्रत्यय निकट संदर्भ की ‘बुद्धि’ की ओर संकेत करता है; ‘देखा’ मूल क्रिया की ठोस भाषा और बोध, दोनों की संभावना बनाए रखता है।
- source_word: וַיְסַפְּרָהּ
  choice: उसका वर्णन किया
  rationale: ספר में गिनने, बयान करने या वर्णन करने के अर्थ संभव हैं। संदर्भ में ‘वर्णन किया’ सहज है, जबकि पादटिप्पणी मूल की शब्दार्थगत व्यापकता सुरक्षित रखती है।
- source_word: הֱכִינָהּ
  choice: उसने उसे स्थापित किया
  rationale: हिफ़ील में כון का अर्थ स्थिर करना, स्थापित करना या व्यवस्थित करना हो सकता है; ‘स्थापित किया’ परमेश्वर द्वारा बुद्धि को दृढ़ रूप देने की काव्यात्मक छवि को बनाए रखता है।
- source_word: וְגַם
  choice: और ... भी
  rationale: यह क्रम में अंतिम क्रिया को जोड़ते हुए उसके संचयी बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: חֲקָרָהּ
  choice: उसकी पूरी जाँच की
  rationale: חקר किसी वस्तु को गहराई से खोजने या परखने का भाव देता है; ‘पूरी जाँच की’ आधुनिक हिन्दी में इस गहन परीक्षण को स्पष्ट करता है।
theological_decisions:
- issue: स्त्रीलिंग प्रत्ययों का संदर्भ
  choice: सभी स्त्रीलिंग एकवचन प्रत्ययों को निकट संदर्भ की ‘बुद्धि’ के लिए ‘उसे/उसका/उसकी’ से व्यक्त किया गया है।
  alternative: इन्हें अधिक अमूर्त ढंग से बुद्धि के माप या उसकी व्यवस्था का संकेत माना जा सकता है।
  rationale: पूर्ववर्ती संदर्भ में बुद्धि ही परमेश्वर के देखने, वर्णन करने, स्थापित करने और जाँचने का व्याकरणिक कर्म है। हिन्दी सर्वनाम संदर्भ को बनाए रखते हैं, बिना अनावश्यक रूप से अतिरिक्त व्यक्तिकरण जोड़े।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘उसने’ का कर्ता पूर्व संदर्भ से परमेश्वर है और ‘उसे’ का संदर्भ बुद्धि है।
