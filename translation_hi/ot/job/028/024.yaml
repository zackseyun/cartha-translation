  text: כִּי ה֭וּא לִ/קְצוֹת הָ/אָ֣רֶץ יַבִּ֑יט תַּ֖חַת כָּל הַ/שָּׁמַ֣יִם יִרְאֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/024.yaml
  text: For he looks to the ends of the earth[b][a]; he sees under all the heavens.
translation:
  language: hi
  text: 'क्योंकि वह पृथ्वी के छोरों तक दृष्टि डालता है;

    वह सारे आकाश के नीचे देखता है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह अव्यय पिछले कथन का कारण बताता है; ‘क्योंकि’ हिन्दी में इसके व्याख्यात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הוּא
  choice: वह
  rationale: संदर्भ में सर्वनाम परमेश्वर की ओर संकेत करता है; मूल पद की तरह नाम को दोहराए बिना सर्वनाम रखा गया है।
- source_word: לִקְצוֹת הָאָרֶץ
  choice: पृथ्वी के छोरों तक
  rationale: यह पद पृथ्वी की दूर से दूर सीमाओं को दर्शाता है। ‘छोरों तक’ स्थानगत व्यापकता और बहुवचन भाव को सहज हिन्दी में बनाए रखता है।
- source_word: יַבִּיט
  choice: दृष्टि करता है
  rationale: נבט का हिफ़ील रूप किसी ओर निर्देशित होकर देखने का भाव देता है। ‘दृष्टि करता है’ अगले खंड के सामान्य ‘देखता है’ से उचित भेद रखते हुए काव्यात्मक और बोधगम्य है।
- source_word: תַּחַת כָּל הַשָּׁמַיִם
  choice: समस्त आकाश के नीचे
  rationale: ‘नीचे’ स्थानगत बिंब को बनाए रखता है। हिन्दी में ‘समस्त आकाश’ सम्पूर्ण आकाशीय विस्तार को स्वाभाविक ढंग से व्यक्त करता है, यद्यपि हिब्रू संज्ञा रूपतः बहुवचन है।
- source_word: יִרְאֶה
  choice: देखता है
  rationale: ראה का सीधा अर्थ ‘देखना’ है; यह पहले खंड के साथ समानांतरता को स्पष्ट रखता है।
theological_decisions:
- issue: सर्वनाम הוּא का संदर्भ
  choice: ‘वह’ से परमेश्वर अभिप्रेत है, जो सृष्टि के समस्त विस्तार को देखता है।
  alternative: सर्वनाम को अनिर्दिष्ट कर्ता मानना।
  rationale: निकटवर्ती संदर्भ में बुद्धि के स्थान को जानने और सारी पृथ्वी को देखने वाला परमेश्वर ही है; फिर भी अनुवाद में स्पष्टता जोड़ने के लिए उसका नाम नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, काव्यात्मक और सामान्य पाठक के लिए सुबोध रूप। दोनों समानांतर क्रियाओं में ‘दृष्टि करता है/देखता है’ का हल्का भेद मूल के נבט/ראה भेद को दर्शाता है। अनावश्यक पादटिप्पणी नहीं जोड़ी गई; हिब्रू के बहुवचन שׁמים का हिन्दी में स्वाभाविक सामूहिक रूप ‘आकाश’ है।
