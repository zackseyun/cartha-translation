  text: Gold and glass cannot equal it[b][a], nor can its exchange be an article of fine gold.
translation:
  language: hi
  text: 'सोना और काँच[a] उसकी बराबरी नहीं कर सकते,

    न ही उसके बदले शुद्ध सोने की कोई वस्तु दी जा सकती है[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘स्फटिक’। इब्रानी शब्द किसी पारदर्शी बहुमूल्य सामग्री के लिए हो सकता है; यहाँ सम्भावित अर्थ ‘काँच’ लिया गया है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘न ही शुद्ध सोने का कोई पात्र उसके बदले दिया जा सकता है।’ इब्रानी כְּלִי का अधिक विशिष्ट अर्थ ‘पात्र’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַרְכֶנָּה
  choice: उसकी बराबरी नहीं कर सकते
  rationale: ערך यहाँ मूल्य या तुलना में बराबर ठहरने का भाव देता है। स्त्रीलिंग प्रत्यय का संकेत प्रसंग में ‘बुद्धि’ की ओर है।
- source_word: זָהָב
  choice: सोना
  rationale: इस बहुमूल्य धातु के लिए स्वाभाविक और मानक हिन्दी शब्द।
- source_word: זְכוֹכִית
  choice: काँच
  rationale: यह शब्द सम्भवतः प्राचीन संसार की पारदर्शी और बहुमूल्य सामग्री काँच को दर्शाता है; ‘स्फटिक’ सम्भव वैकल्पिक अर्थ है।
- source_word: תְמוּרָתָהּ
  choice: उसके बदले दी जा सकती है
  rationale: תמורה विनिमय या किसी वस्तु के बदले दी जाने वाली दूसरी वस्तु को दर्शाता है; यह वाणिज्यिक रूपक हिन्दी में स्पष्ट रखता है।
- source_word: כְּלִי פָז
  choice: कुन्दन की कोई वस्तु
  rationale: כְּלִי का अर्थ व्यापक रूप से पात्र, वस्तु या निर्मित सामान हो सकता है, और פָּז उत्तम परिष्कृत सोने को सूचित करता है। ‘वस्तु’ अनावश्यक रूप से इसे पात्र तक सीमित नहीं करती।
theological_decisions:
- issue: स्त्रीलिंग प्रत्ययों का संदर्भ
  choice: ‘उसकी/उसके’ से प्रसंगगत ‘बुद्धि’ को सूचित करना
  alternative: पद में ‘बुद्धि’ शब्द स्पष्ट रूप से जोड़ना
  rationale: मूल पद में संज्ञा दोहराई नहीं गई है; सर्वनाम रखने से उसके प्रसंगगत संदर्भ और काव्यात्मक गठन दोनों सुरक्षित रहते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक, गरिमामय और सहज शैली। ‘कुन्दन’ से उत्तम परिष्कृत सोने का भाव संक्षेप में व्यक्त किया गया है; ‘वस्तु’ ने इब्रानी כְּלִי की अर्थ-व्याप्ति को केवल ‘पात्र’ तक सीमित नहीं किया।
