base_translation:
  language: en
  yaml_path: translation/ot/job/028/012.yaml
  text: But where can wisdom be found[a], and where is the place of understanding?
translation:
  language: hi
  text: पर बुद्धि कहाँ से मिल सकती है, और समझ का स्थान कहाँ है?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַחָכְמָה
  choice: पर बुद्धि
  rationale: חָכְמָה के लिए सामान्य और स्वाभाविक हिन्दी शब्द ‘बुद्धि’ रखा गया है। आरम्भिक וְ को ‘पर’ से व्यक्त किया गया है, क्योंकि प्रसंग में धरती के खजानों की खोज से बुद्धि की अप्राप्यता की ओर अलंकारिक मोड़ आता है।
- source_word: מֵאַיִן
  choice: कहाँ से
  rationale: मूल पद स्रोत या उद्गम पूछता है; ‘कहाँ से’ हिन्दी में इसके शाब्दिक अर्थ और स्वाभाविक प्रश्न-रूप दोनों को बनाए रखता है।
- source_word: תִּמָּצֵא
  choice: मिल सकती है
  rationale: מצא का निफ़ाल अपूर्ण रूप ‘पाई/मिली जाना’ व्यक्त करता है। प्रश्न के अलंकारिक और संभावनात्मक बल को आधुनिक हिन्दी में ‘मिल सकती है’ स्वाभाविक रूप से प्रकट करता है, बिना इसे केवल भविष्यकाल बनाने के।
- source_word: וְאֵי זֶה מְקוֹם
  choice: और ... का स्थान कहाँ है
  rationale: אֵי זֶה מְקוֹם की इब्रानी प्रश्नात्मक अभिव्यक्ति को स्वाभाविक हिन्दी वाक्य-विन्यास में रखा गया है; זֶה को अलग से ‘यह’ कहना यहाँ कृत्रिम होता।
- source_word: בִּינָה
  choice: समझ
  rationale: בִּינָה विवेकपूर्ण समझ या अंतर्दृष्टि को दर्शाता है। ‘समझ’ साधारण आधुनिक हिन्दी में स्पष्ट है और ‘बुद्धि’ के समानांतर रहते हुए उससे अनावश्यक रूप से एकरूप नहीं होता।
