  text: Abaddon and Death say[a], ‘With our ears we have heard a report of it.’
translation:
  language: hi
  text: अबद्दोन और मृत्यु कहते हैं,[a] “हमने अपने कानों से उसके विषय में समाचार सुना है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “विनाश और मृत्यु ने कहा, ‘हमने उसके विषय में चर्चा सुनी है।’”
    reason: אֲבַדּוֹן का अर्थ ‘विनाश’ भी हो सकता है; אָמְרוּ को भूतकाल में और שִׁמְעָהּ को ‘चर्चा/अफ़वाह’ के अर्थ में भी अनूदित किया जा सकता है।
lexical_decisions:
- source_word: אֲבַדּוֹן
  choice: अब्द्दोन
  rationale: इसे केवल अमूर्त ‘विनाश’ न बनाकर इब्रानी नाम/उपाधि के रूप में लिप्यंतरित किया गया है, क्योंकि मृत्यु के साथ यह बोलनेवाली सत्ता/लोक के रूप में मानवीकृत है।
- source_word: וָמָוֶת
  choice: और मृत्यु
  rationale: संयोजक का सीधा अर्थ रखा गया है; ‘मृत्यु’ यहाँ अबद्दोन के साथ बोलती हुई मानवीकृत है।
- source_word: אָמְרוּ
  choice: कहते हैं
  rationale: रूप भूतकालिक पूर्ण क्रिया है, पर काव्य के इस सार्वकालिक और सजीव कथन में वर्तमान काल स्वाभाविक है।
- source_word: בְּאָזְנֵינוּ
  choice: अपने कानों से
  rationale: इब्रानी श्रवण-मुहावरे को स्वाभाविक हिन्दी में रखते हुए प्रत्यक्ष सुनने की छवि बचाई गई है।
- source_word: שָׁמַעְנוּ
  choice: हमने ... सुना है
  rationale: यह रचना अतीत में सुनी बात की वर्तमान प्रासंगिकता और केवल परोक्ष जानकारी दोनों व्यक्त करती है।
- source_word: שִׁמְעָהּ
  choice: उसके विषय में समाचार
  rationale: संज्ञा का अर्थ समाचार, चर्चा या अफ़वाह हो सकता है; स्त्रीलिंग प्रत्यय प्रसंग में बुद्धि की ओर संकेत करता है। मुख्य पाठ में तटस्थ ‘समाचार’ चुना गया है।
theological_decisions:
- issue: अबद्दोन और मृत्यु का मानवीकरण
  choice: दोनों को बोलने और सुननेवाले मानवीकृत वक्ताओं के रूप में प्रस्तुत किया गया है।
  alternative: ‘अब्द्दोन’ को ‘विनाश’ जैसे अमूर्त अर्थ में और ‘मृत्यु’ को गैर-मानवीकृत रूप में पढ़ना।
  rationale: इब्रानी पाठ दोनों के लिए बोलने और सुनने की क्रियाएँ प्रयोग करता है। यह काव्यात्मक मानवीकरण सुरक्षित रखता है, पर उनके अस्तित्व के स्वरूप के विषय में पाठ से अधिक दावा नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। ‘अब्द्दोन’ का लिप्यंतरण काव्यात्मक मानवीकरण को बनाए रखता है; पादटिप्पणी अर्थानुवाद और कालगत विकल्प सुरक्षित रखती है।
