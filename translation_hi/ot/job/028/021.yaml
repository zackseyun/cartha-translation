  yaml_path: translation/ot/job/028/021.yaml
  text: It is hidden from the eyes of every living thing[a], and concealed from the birds of the heavens.
translation:
  language: hi
  text: 'वह हर जीवित प्राणी की आँखों से छिपी है,

    और आकाश के पक्षियों से भी ओझल है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנֶעֶלְמָה
  choice: वह ... छिपी है
  rationale: निफ़अल पूर्ण 3 स्त्रीलिंग एकवचन का कर्ता प्रसंग से चली आ रही ‘बुद्धि’ है। ‘छिपी है’ निष्क्रिय/परिणामी भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מֵעֵינֵי
  choice: की आँखों से
  rationale: מן + עיניים की मूल दृश्यात्मक अभिव्यक्ति को बनाए रखता है और हिन्दी में सहज है।
- source_word: כָל חָי
  choice: हर जीवित प्राणी
  rationale: यह व्यापक पद सभी जीवधारियों को समेटता है; ‘प्राणी’ वर्तमान हिन्दी में ‘जीवित वस्तु’ की अपेक्षा अधिक स्वाभाविक है और मनुष्य तक सीमित नहीं है।
- source_word: וּמֵעוֹף הַשָּׁמַיִם
  choice: और आकाश के पक्षियों से भी
  rationale: עוֹף को प्रसंगानुकूल ‘पक्षियों’ और הַשָּׁמַיִם को स्वाभाविक हिन्दी में ‘आकाश’ कहा गया है। ‘भी’ समानांतर दूसरे खंड का समावेश स्पष्ट करता है।
- source_word: נִסְתָּרָה
  choice: ओझल है
  rationale: निफ़अल पूर्ण 3 स्त्रीलिंग एकवचन का छिपा होने का भाव व्यक्त करता है; ‘ओझल’ पहले खंड के ‘छिपी’ की अनावश्यक पुनरावृत्ति से बचते हुए काव्यात्मक समानांतरता रखता है।
