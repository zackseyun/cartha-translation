  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण काव्य-पंक्तियाँ। स्त्रीलिंग ‘वह/छिपी’ प्रसंगगत ‘बुद्धि’ की ओर संकेत करता है। मूल के ‘आकाशों’ बहुवचन को हिन्दी मुहावरे के अनुसार ‘आकाश’ कहा गया है; इससे अर्थगत तनाव नहीं मिटता।
