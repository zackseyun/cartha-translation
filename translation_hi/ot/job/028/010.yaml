translation:
  language: hi
  text: 'वह चट्टानों में नहरें[a] काटता है,

    और उसकी आँख हर बहुमूल्य वस्तु[b] को देखती है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘जलधाराएँ’ अथवा ‘जलमार्ग’; इब्रानी शब्द जलधारा, नहर या जलमार्ग को दर्शा सकता है। यहाँ खनन के प्रसंग में चट्टान में काटे गए मार्ग अभिप्रेत हो सकते हैं।
    reason: lexical_alternative
  - marker: b
    text: या ‘हर मूल्यवान वस्तु’; खनन के प्रसंग में इसमें बहुमूल्य अयस्क भी शामिल हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּצּוּרוֹת
  choice: चट्टानों में
  rationale: צוּר कठोर चट्टान को सूचित करता है। उपसर्ग ב को यहाँ स्थानवाचक मानना स्वाभाविक है; क्रिया के साथ मिलकर अर्थ है कि खनिक चट्टानों के भीतर मार्ग चीरता है।
- source_word: יְאֹרִים
  choice: जलमार्ग
  rationale: יְאֹרִים सामान्यतः नदियों, नहरों या जलधाराओं को दर्शाता है। खनन के प्रसंग में ‘जलमार्ग’ मूल जल-संबंधी अर्थ को बनाए रखता है, जबकि काटे गए निकासी-मार्ग की संभावना भी खुली रहती है।
- source_word: בִּקֵּעַ
  choice: चीर निकालता है
  rationale: בקע का मूल अर्थ चीरना, फाड़ना या खोलना है। ‘चीर निकालता है’ चट्टान के भीतर मार्ग बनाने की सशक्त खनन-क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְקָר
  choice: बहुमूल्य वस्तु
  rationale: יְקָר का अर्थ मूल्यवान या बहुमूल्य वस्तु है। मूल शब्द इसे केवल अयस्क, धातु या रत्न तक सीमित नहीं करता, इसलिए व्यापक अभिव्यक्ति रखी गई है।
- source_word: רָאֲתָה עֵינוֹ
  choice: उसकी आँख ... देख लेती है
  rationale: इब्रानी में शब्दशः ‘उसकी आँख ने देखा’ है। वर्णनात्मक काव्य में वर्तमान काल और ‘देख लेती है’ छिपी वस्तुओं को खोज लेने का भाव देते हैं, जबकि ‘उसकी आँख’ की सजीव मूल छवि सुरक्षित रहती है।
