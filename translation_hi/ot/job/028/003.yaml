base_translation:
  language: en
  yaml_path: translation/ot/job/028/003.yaml
  text: He sets an end to darkness[a], and he searches out every limit, the stones of gloom and deep darkness.
translation:
  language: hi
  text: वह अंधकार का अंत ठहराता है, और हर सीमा तक घोर अँधेरे और गहन अंधकार के पत्थरों को खोज निकालता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक पारंपरिक रूप में, “घोर अंधकार और मृत्यु की छाया का पत्थर।”
    reason: צַלְמָוֶת के पारंपरिक अनुवाद और אֶבֶן के व्याकरणिक एकवचन को सुरक्षित रखने वाला वैकल्पिक पाठ।
lexical_decisions:
- source_word: קֵץ שָׂם לַחֹשֶׁךְ
  choice: अंधकार की सीमा ठहराता है
  rationale: קֵץ का अर्थ अंत या सीमा है और שָׂם का अर्थ ठहराना/स्थापित करना। हिंदी में यह प्रयोग खनिक द्वारा अंधकार की सीमा तक पहुँचने के भाव को स्वाभाविक और सजीव रखता है।
- source_word: וּלְכָל תַּכְלִית
  choice: हर अंतिम छोर तक
  rationale: תַּכְלִית यहाँ नैतिक ‘सिद्धता’ नहीं, बल्कि चरम सीमा या दूरस्थ छोर को व्यक्त करता है। ‘हर अंतिम छोर तक’ खोज की व्यापकता और לְ के दिशात्मक भाव को बनाए रखता है।
- source_word: הוּא חוֹקֵר
  choice: वह ... खोजता है
  rationale: חקר गहराई से खोजने या छानबीन करने का बोध देता है। ‘खोजता है’ सरल आधुनिक हिंदी है; ‘वह’ मूल के स्पष्ट הוּא को बनाए रखता है।
- source_word: אֶבֶן
  choice: पत्थरों को
  rationale: यद्यपि मूल शब्द एकवचन है, खनन के प्रसंग में यह सामूहिक अर्थ दे सकता है। हिंदी में बहुवचन ‘पत्थरों’ से यह सामूहिक खनन-संदर्भ अधिक स्वाभाविक रूप से व्यक्त होता है।
- source_word: אֹפֶל
  choice: घोर अँधेरा
  rationale: אֹפֶל गहन या घना अंधकार दर्शाता है। ‘घोर अँधेरा’ पहले आए חֹשֶׁךְ से कुछ भिन्नता रखते हुए उसकी तीव्रता व्यक्त करता है।
- source_word: צַלְמָוֶת
  choice: गहन अंधकार
  rationale: अय्यूब के इस भूमिगत खनन-प्रसंग में यह पद अत्यंत गहरे अंधकार का बोध देता है। पारंपरिक ‘मृत्यु की छाया’ को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: צַלְמָוֶת का अनुवाद
  choice: गहन अंधकार
  alternative: मृत्यु की छाया
  rationale: खनन का निकट प्रसंग भूमिगत घने अंधकार की ओर संकेत करता है, पर पद की पारंपरिक और संभावित व्युत्पत्तिमूलक समझ ‘मृत्यु की छाया’ है। इसलिए मुख्य पाठ में प्रसंगगत अर्थ और पादटिप्पणी में वैकल्पिक पारंपरिक रूप दिया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘सीमा ठहराता है’ काव्यात्मक ठोसपन बनाए रखता है, जबकि ‘हर अंतिम छोर तक’ खनिक की व्यापक खोज को सामान्य पाठक के लिए स्पष्ट करता है।
