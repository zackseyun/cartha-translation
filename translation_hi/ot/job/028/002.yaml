  yaml_path: translation/ot/job/028/002.yaml
  text: Iron is taken from the dust[a], and copper is smelted from stone.
translation:
  language: hi
  text: लोहा मिट्टी से निकाला जाता है, और पत्थर से ताँबा[a] गलाकर निकाला जाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘काँसा’। इब्रानी शब्द ताँबे या काँसे, दोनों के लिए प्रयुक्त हो सकता है; यहाँ खनन और पत्थर से धातु निकालने का प्रसंग होने के कारण ‘ताँबा’ रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּרְזֶל
  choice: लोहा
  rationale: यह बाइबिलीय इब्रानी संज्ञा का सामान्य और सीधा अर्थ है।
- source_word: מֵעָפָר
  choice: मिट्टी से
  rationale: עָפָר धूल, ढीली मिट्टी या भूमि को सूचित कर सकता है। खनन के प्रसंग में ‘मिट्टी’ स्वाभाविक हिंदी है और मूल की ठोस भूमिगत छवि बनाए रखती है।
- source_word: יֻקָּח
  choice: निकाला जाता है
  rationale: לקח के कर्मवाच्य का मूल अर्थ ‘लिया जाता है’ है; यहाँ खनन के प्रसंग में ‘निकाला जाता है’ अधिक स्वाभाविक और अर्थ की दृष्टि से स्पष्ट है, बिना किसी विशिष्ट खनन-विधि को जोड़ने के।
- source_word: וְאֶבֶן
  choice: और पत्थर से
  rationale: אֶבֶן का सीधा अर्थ ‘पत्थर’ है। हिंदी में धातु के स्रोत को स्पष्ट करने के लिए पहले खंड के ‘से’ को दूसरे खंड में भी व्यक्त किया गया है।
- source_word: יָצוּק
  choice: गलाकर निकाला जाता है
  rationale: יצק का अर्थ उँडेलना, ढालना या धातु गलाना हो सकता है। अयस्कयुक्त पत्थर से धातु प्राप्त करने के प्रसंग में ‘गलाकर निकाला जाता है’ आशय को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: נְחוּשָׁה
  choice: ताँबा
  rationale: यह शब्द ताँबे या काँसे को सूचित कर सकता है। पत्थर से धातु निकालने के खनन-प्रसंग में ‘ताँबा’ अधिक उपयुक्त है, क्योंकि काँसा एक मिश्रधातु है; वास्तविक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
