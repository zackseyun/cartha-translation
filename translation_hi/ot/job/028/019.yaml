lexical_decisions:
- source_word: יַעַרְכֶנָּה
  choice: उसकी बराबरी नहीं कर सकता
  rationale: ערך यहाँ मूल्य या दर्जे में तुलनीय होने का भाव देता है। स्त्रीलिंग प्रत्यय का संदर्भ प्रसंग में ‘बुद्धि’ से है; इसलिए ‘उसकी बराबरी’ स्वाभाविक और अर्थ-सटीक है।
- source_word: פִּטְדַת כּוּשׁ
  choice: कूश का पुखराज
  rationale: פִּטְדָה किसी बहुमूल्य रत्न का नाम है, जिसकी ठीक खनिज-पहचान अनिश्चित है। ‘पुखराज’ पारंपरिक और सामान्यतः समझा जाने वाला रूप है; अनिश्चितता पादटिप्पणी में रखी गई है। כּוּשׁ को व्यक्तिवाचक भौगोलिक नाम के रूप में ‘कूश’ लिखा गया है।
- source_word: בְּכֶתֶם טָהוֹר
  choice: शुद्ध सोने से
  rationale: כֶּתֶם उत्तम या परिष्कृत सोने को और טָהוֹר उसकी शुद्धता को व्यक्त करता है। मूल्यांकन के संदर्भ में ב को तुलना/मूल्य-माध्यम के भाव में ‘से’ कहना स्वाभाविक हिंदी है।
- source_word: תְסֻלֶּה
  choice: उसका मूल्य ... नहीं आँका जा सकता
  rationale: इस प्रसंग में क्रिया केवल भौतिक तौल नहीं, बल्कि कीमत ठहराने या मूल्यांकन करने का भाव देती है। ‘मूल्य आँकना’ समानांतर पंक्ति और बुद्धि के अमूल्य होने के विषय को स्पष्ट रखते हुए मूल भाव को सुरक्षित रखता है।
