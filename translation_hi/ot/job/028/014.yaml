  text: गहराई कहती है[a], “वह मुझमें नहीं है,” और समुद्र कहता है, “वह मेरे पास नहीं है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में: “वह [स्त्रीलिंग] मुझमें नहीं है।” स्त्रीलिंग सर्वनाम निकटवर्ती संदर्भ में व्यक्तिकृत ‘बुद्धि’ की ओर संकेत करता है।'
    reason: मूल इब्रानी के स्त्रीलिंग सर्वनाम और उसके प्रसंगगत संदर्भ को स्पष्ट करना।
lexical_decisions:
- source_word: תְּהוֹם
  choice: गहरा जल
  rationale: यह शब्द विशाल अथाह जलराशि या गहरी जल-गहराई को दर्शाता है। ‘गहरा जल’ आधुनिक हिन्दी में स्वाभाविक है और ‘समुद्र’ के साथ काव्यात्मक समानांतरता बनाए रखता है।
- source_word: אָמַר
  choice: कहता है
  rationale: इब्रानी रूप पूर्णकालिक होते हुए भी यहाँ काव्य में सजीव, वर्तमान कथन का भाव देता है; इसलिए वर्तमानकाल उपयुक्त है।
- source_word: לֹא בִי הִיא
  choice: वह मुझमें नहीं है
  rationale: स्त्रीलिंग सर्वनाम הִיא संदर्भ में स्त्रीलिंग ‘बुद्धि’ की ओर संकेत करता है। हिन्दी में ‘वह’ स्वाभाविक रूप से इस संदर्भ को बनाए रखता है, और ‘मुझमें’ בִי का सीधा अनुवाद है।
- source_word: יָם
  choice: समुद्र
  rationale: यह सामान्यतः समुद्र के लिए प्रयुक्त शब्द है और गहरे जल के साथ मूल बिंब तथा समानांतरता को सुरक्षित रखता है।
- source_word: אֵין עִמָּדִי
  choice: वह मेरे पास नहीं है
  rationale: यह पद किसी के साथ या अधिकार में न होने को व्यक्त करता है। ‘मेरे पास नहीं है’ हिन्दी में स्वाभाविक है और मूल के संगति/उपस्थिति तथा अधिकार—दोनों संभावित भावों को समेटता है।
theological_decisions:
- issue: स्त्रीलिंग सर्वनाम הִיא का संदर्भ
  choice: ‘वह’ द्वारा बुद्धि की ओर संकेत बनाए रखा गया
  alternative: ‘यह’ या ‘बुद्धि’ को स्पष्ट रूप से दोहराना
  rationale: निकटवर्ती संदर्भ में स्त्रीलिंग संज्ञा ‘बुद्धि’ इसका पूर्वपद है। ‘वह’ मूल के सर्वनामिक और व्यक्तिकृत रूप को सुरक्षित रखता है, जबकि ‘बुद्धि’ जोड़ना मूल से अधिक स्पष्टता देता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। दोनों अर्धपंक्तियों की मानवीकरणयुक्त वाणी और काव्यात्मक समानांतरता सुरक्षित है।
