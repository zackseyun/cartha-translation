  text: As for the earth[a], from it bread comes out, but underneath it is turned up as by fire.
translation:
  language: hi
  text: 'धरती से रोटी निकलती है,

    पर उसके नीचे का भाग आग से मानो उलट-पुलट हो जाता है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और उसके नीचे का भाग आग के समान उलट-पुलट हो जाता है।” इब्रानी तुलना का अर्थ या तो रीति हो सकता है—“मानो आग से”—या केवल समानता—“आग के समान।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ
  choice: धरती
  rationale: यहाँ धरती की उपजाऊ सतह और खनन किए जाने वाले भूमिगत भाग के बीच विरोध है; ‘धरती’ किसी विशेष देश के बजाय भूमि/पृथ्वी के व्यापक अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מִמֶּנָּה
  choice: उससे
  rationale: स्त्रीलिंग एकवचन प्रत्यय का संबंध ‘धरती’ से है; हिन्दी में ‘उससे’ स्वाभाविक और स्पष्ट है।
- source_word: יֵצֵא
  choice: निकलती है
  rationale: क्रिया के मूल ‘बाहर आने’ के ठोस बिंब को वर्तमानकालीन हिन्दी में बनाए रखता है।
- source_word: לָחֶם
  choice: रोटी
  rationale: इब्रानी के ठोस शब्द ‘रोटी’ को बनाए रखा गया है; यहाँ यह धरती से मिलने वाली खाद्य उपज का प्रतिनिधि बिंब है।
- source_word: וְתַחְתֶּיהָ
  choice: पर उसके नीचे का भाग
  rationale: ‘पर’ सतह की उपज और नीचे की उलट-पुलट के बीच निहित विरोध को व्यक्त करता है; ‘नीचे का भाग’ हिन्दी में भूमिगत क्षेत्र को स्पष्ट करता है।
- source_word: נֶהְפַּךְ
  choice: उलट-पुलट दिया जाता है
  rationale: הפך के निफ़ाल रूप में उलटे या परिवर्तित किए जाने का भाव है; खनन के प्रसंग में यह भूमिगत धरती के खोदे और उलटे जाने का सजीव चित्र देता है।
- source_word: כְּמוֹ אֵשׁ
  choice: मानो आग से
  rationale: तुलना को आग के प्रभाव जैसी रीति के रूप में प्रस्तुत करता है, पर वैकल्पिक सीधी समानता ‘आग के समान’ को पादटिप्पणी में सुरक्षित रखा गया है।
