  yaml_path: translation/ot/job/028/004.yaml
  text: He breaks open a shaft away from where people dwell[a]; forgotten by the foot, they hang far from men[c][b], they sway.
translation:
  language: hi
  text: वह बस्ती से दूर एक सुरंग खोलता है[a]; पाँवों से भूले हुए वे मनुष्यों से दूर लटकते और झूलते हैं[b][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह उस जगह से दूर एक नाला/जलमार्ग फोड़कर खोलता है जहाँ कोई परदेशी रहता है।” इब्रानी पाठ कठिन है, विशेषकर נַחַל और גָּר; अध्याय के खनन-प्रसंग के कारण यहाँ נַחַל को “सुरंग” समझा गया है।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक रूप में, “पाँव से भूले हुए।” भाव यह हो सकता है कि वह स्थान या वहाँ काम करने वाले लोग ऊपर आने-जाने वालों की दृष्टि अथवा पहुँच से बाहर हैं।
    reason: lexical_alternative
  - marker: c
    text: या, “वे नीचे उतारे जाते हैं” अथवा “वे लटकते हैं।” इब्रानी क्रिया निलंबित होने या नीचे उतारे जाने का संकेत दे सकती है, सम्भवतः खान में रस्सियों के सहारे।
    reason: lexical_alternative
lexical_decisions:
