  choice: खोदता है
  rationale: मूल क्रिया का अर्थ फोड़कर रास्ता बनाना या सेंध लगाना है। खनन के प्रसंग में ‘सुरंग खोदता है’ भूमि को काटकर मार्ग खोलने की क्रिया स्वाभाविक रूप से व्यक्त करता है।
- source_word: נַחַל
  choice: सुरंग
  rationale: इस शब्द का सामान्य अर्थ जलधारा, नाला या घाटी है, पर अय्यूब 28 के खनन-प्रसंग में भूमिगत काट या खान की सुरंग सम्भावित है। कठिन मूल पाठ को देखते हुए वैकल्पिक शाब्दिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: מֵעִם גָּר
  choice: बस्ती से दूर
  rationale: शाब्दिक रूप में पदबंध ‘परदेशी/निवासी के पास से दूर’ जैसा है। प्रसंग में यह आबाद स्थानों से दूर खान खोदने का स्थानसूचक भाव देता है।
- source_word: הַנִּשְׁכָּחִים מִנִּי רָגֶל
  choice: पाँवों की पहुँच से भूले-बिसरे वे लोग
  rationale: ‘पाँव से भूले हुए’ की संक्षिप्त इब्रानी छवि को बनाए रखते हुए यह बताता है कि खनिक ऊपर चलने वालों की पहुँच और दृष्टि से बाहर हैं।
- source_word: דַּלּוּ
  choice: लटके रहते हैं
  rationale: क्रिया नीचे लटकने, निलंबित होने या उतारे जाने का संकेत दे सकती है। खनन के प्रसंग में रस्सियों से लटके श्रमिकों की छवि उपयुक्त है।
- source_word: מֵאֱנוֹשׁ
  choice: मनुष्यों से दूर
  rationale: אֱנוֹשׁ नश्वर मानव या मानवजाति को दर्शाता है। ‘मनुष्यों से दूर’ दूरी और सामान्य मानवीय संगति से अलगाव दोनों व्यक्त करता है।
- source_word: נָעוּ
  choice: झूलते हैं
  rationale: क्रिया हिलने, डोलने या आगे-पीछे गति करने का अर्थ देती है। लटके हुए खनिकों के लिए ‘झूलते हैं’ स्पष्ट और सजीव है।
