  yaml_path: translation/ot/job/028/018.yaml
  text: Coral and crystal are not worth mentioning, and the price of wisdom is above pearls.
translation:
  language: hi
  text: मूँगे और स्फटिक का उल्लेख भी न किया जाए; बुद्धि का मूल्य मोतियों[क] से बढ़कर है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: हिब्रू पनिनीम का सटीक पदार्थ अनिश्चित है; इसका प्रचलित अनुवाद ‘मोती’ है, पर इसे किसी अन्य बहुमूल्य रत्न या पदार्थ के रूप में भी समझा गया है।
    reason: פְּנִינִים की शब्दार्थगत अनिश्चितता को पारदर्शी ढंग से सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: רָאמוֹת
  choice: मूँगा
  rationale: यह बहुवचन संज्ञा किसी बहुमूल्य समुद्री पदार्थ, सामान्यतः मूँगे, के लिए समझी जाती है; संदर्भ में बहुमूल्य वस्तुओं की तुलना है।
- source_word: גָבִישׁ
  choice: स्फटिक
  rationale: यह दुर्लभ शब्द क्रिस्टल अथवा पारदर्शी बहुमूल्य पदार्थ को सूचित करता है; ‘स्फटिक’ आधुनिक हिन्दी में संक्षिप्त और गरिमापूर्ण है।
- source_word: לֹא יִזָּכֵר
  choice: उल्लेख भी न किया जाए
  rationale: शाब्दिक अर्थ ‘याद/उल्लेख न किया जाए’ है; भाव यह है कि बुद्धि की तुलना में इन वस्तुओं की गिनती तक नहीं होती।
- source_word: מֶשֶׁךְ חָכְמָה
  choice: बुद्धि का मूल्य
  rationale: מֶשֶׁךְ का अर्थ यहाँ विवादित है और इसे मूल्य, प्राप्ति या अर्जन समझा गया है। समानांतर मूल्यांकन-संदर्भ और पद के दूसरे अर्धांश को स्वाभाविक हिन्दी में व्यक्त करने के लिए ‘मूल्य’ चुना गया है।
- source_word: פְּנִינִים
  choice: मोती
  rationale: इस दुर्लभ बहुवचन शब्द की पहचान अनिश्चित है; इसे मोती, लाल मूँगा अथवा अन्य रत्न माना गया है। प्रचलित अर्थ ‘मोती’ पाठ में रखा गया है और अनिश्चितता पादटिप्पणी में बताई गई है।
theological_decisions:
- issue: बुद्धि का मूल्य या उसकी प्राप्ति
  choice: बुद्धि का मूल्य
  alternative: बुद्धि की प्राप्ति
  rationale: हिब्रू מֶשֶׁךְ बहुअर्थी/दुर्लभ है। निकटवर्ती पदों में मूल्य और तुलना की भाषा के कारण ‘मूल्य’ संदर्भानुकूल है, पर प्राप्ति का अर्थ भी संभव है; इसे किसी विशिष्ट धर्मवैचारिक निष्कर्ष की तरह नहीं प्रस्तुत किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण काव्यात्मक गद्य। ‘स्फटिक’ और ‘मूँगा’ साधारण पाठक के लिए पहचाने जाने योग्य बहुमूल्य पदार्थ हैं। अर्धविराम हिब्रू समानांतरता को स्पष्ट करता है; ‘कहीं बढ़कर’ तुलना की तीव्रता को स्वाभाविक हिन्दी में व्यक्त करता है।
