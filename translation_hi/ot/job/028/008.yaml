lexical_decisions:
- source_word: הִדְרִיכֻהוּ
  choice: उस पर पाँव नहीं रखा
  rationale: דרך के हिफ़ील रूप का यहाँ अर्थ किसी मार्ग पर चलना या उसे रौंदते हुए पार करना है। हिंदी में ‘पाँव रखना’ छिपे मार्ग पर प्रवेश या आवागमन न होने का भाव स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְנֵי שָׁחַץ
  choice: घमंडी वन-पशु
  rationale: शाब्दिक अर्थ ‘घमंड के पुत्र’ है। समानांतर पंक्ति में सिंह के उल्लेख और काव्य-संदर्भ के कारण यह अभिव्यक्ति संभवतः गर्वीले या विकराल जंगली पशुओं, विशेषकर हिंस्र पशुओं, को सूचित करती है। ‘वन-पशु’ मनुष्यों से भेद स्पष्ट करता है, जबकि पादटिप्पणी शाब्दिक रूप सुरक्षित रखती है।
- source_word: עָדָה עָלָיו
  choice: उसके ऊपर से नहीं गुज़रा
  rationale: עלה-संबंधी पूर्वसर्ग के साथ क्रिया किसी वस्तु या मार्ग के ऊपर से जाने अथवा उसे पार करने का भाव देती है। यह अनुवाद समानांतर गति-चित्र को बनाए रखता है।
- source_word: שָׁחַל
  choice: सिंह
  rationale: यह सिंह के लिए प्रयुक्त एक काव्यात्मक शब्द है, जिसमें प्रचंडता की छाया हो सकती है। सरल ‘सिंह’ स्पष्ट, dignified और संदर्भानुकूल है।
