  text: ऐसी राह जिसे कोई शिकारी पक्षी नहीं जानता, और चील की आँख ने भी उसे नहीं देखा है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में यहाँ एक शिकारी पक्षी का नाम है, पर उसकी ठीक प्रजाति निश्चित नहीं है। इसका अनुवाद ‘बाज़’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתִיב
  choice: पगडंडी
  rationale: यह शब्द किसी पथ या बनी हुई राह को सूचित करता है; प्रसंग में धरती के भीतर छिपी राह के काव्यात्मक चित्र के लिए ‘पगडंडी’ स्वाभाविक है।
- source_word: לֹא יְדָעוֹ
  choice: उसे ... नहीं जानता
  rationale: क्रिया के साथ लगा तृतीय पुरुष एकवचन प्रत्यय ‘उसे’ को व्यक्त करता है; हिंदी में यह क्रम सहज और अर्थ की दृष्टि से स्पष्ट है।
- source_word: עָיִט
  choice: कोई शिकारी पक्षी
  rationale: यह किसी एक निश्चित प्रजाति के बजाय सामान्य रूप से शिकार करने वाले पक्षी का द्योतक है।
- source_word: וְלֹא שְׁזָפַתּוּ
  choice: उसे नहीं देखा
  rationale: क्रिया देखने या दृष्टि पड़ने का भाव देती है; सरल रूप समानांतर काव्य-वाक्य के अनुकूल है।
- source_word: עֵין
  choice: आँख
  rationale: मूल के ‘आँख’ संबंधी ठोस काव्यात्मक बिंब को बनाए रखा गया है।
- source_word: אַיָּה
  choice: चील
  rationale: यह एक शिकारी पक्षी का नाम है, किंतु ठीक प्रजाति अनिश्चित है। ‘चील’ आधुनिक हिंदी में परिचित और स्वाभाविक है; अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
