  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לֹא יֻתַּ֣ן סְג֣וֹר תַּחְתֶּ֑י/הָ וְ/לֹ֥א יִ֝שָּׁקֵ֗ל כֶּ֣סֶף מְחִירָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/015.yaml
  text: Fine gold cannot be given in exchange for it[c][b][a], nor can silver be weighed as its price.
translation:
  language: hi
  text: उसके बदले उत्तम सोना नहीं दिया जा सकता,[a] और न उसके मूल्य के बराबर चाँदी तौली जा सकती है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उत्तम सोना’ का अनुवाद ‘खरा सोना’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: प्राचीन समय में चाँदी को तौलकर भुगतान किया जाता था। भाव यह है कि बुद्धि का मूल्य चुकाने के लिए पर्याप्त चाँदी नहीं तौली जा सकती।
    reason: cultural_note
lexical_decisions:
- source_word: יֻתַּן
  choice: दिया जा सकता
  rationale: निषेध के साथ यह कर्मवाच्य रूप विनिमय में कुछ चुकाने की असंभवता व्यक्त करता है।
- source_word: סְגוֹר
  choice: उत्तम सोना
  rationale: काव्यात्मक मूल्यांकन के इस संदर्भ में यह सामान्य सोने के बजाय परिष्कृत अथवा श्रेष्ठ सोने को दर्शाता है; ‘उत्तम सोना’ आधुनिक हिंदी में सहज है।
- source_word: תַּחְתֶּיהָ
  choice: उसके बदले
  rationale: यहाँ תחת स्थानसूचक ‘नीचे’ नहीं, बल्कि प्रतिस्थापन अथवा विनिमय का अर्थ देता है; स्त्रीलिंग प्रत्यय का पूर्वपद प्रसंग में बुद्धि है।
- source_word: יִשָּׁקֵל
  choice: तौली जा सकती
  rationale: कर्मवाच्य שקל भुगतान के लिए चाँदी तौलने की प्राचीन प्रथा को व्यक्त करता है और पहले खंड की असंभवता के समानांतर है।
- source_word: כֶּסֶף
  choice: चाँदी
  rationale: शब्द का ठोस अर्थ ‘चाँदी’ है; यद्यपि वह मुद्रा का काम करती थी, इसे बनाए रखने से प्राचीन आर्थिक बिंब सुरक्षित रहता है।
- source_word: מְחִירָהּ
  choice: उसके मूल्य के बराबर
  rationale: מְחִיר खरीद-मूल्य को दर्शाता है। ‘मूल्य के बराबर चाँदी तौलना’ हिंदी में स्पष्ट करता है कि तौली हुई चाँदी से कीमत चुकाने की बात है।
theological_decisions:
- issue: पहले खंड में कर्मवाच्य क्रिया का कर्ता
  choice: उत्तम सोना वह वस्तु है जो उसके बदले नहीं दी जा सकती
  alternative: बुद्धि को उत्तम सोने के बदले नहीं दिया जा सकता
  rationale: हिब्रू वाक्य-विन्यास में סְגוֹר कर्मवाच्य יֻתַּן का व्याकरणिक कर्ता है, जबकि תַּחְתֶּיהָ विनिमय बताने वाला पदबंध है; इसलिए पाठ को उलटना उचित नहीं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘उसके’ का संदर्भ पिछले पदों की ‘बुद्धि’ से है। दोनों काव्य-पंक्तियों में विनिमय और भुगतान का समानांतर आर्थिक बिंब बनाए रखा गया है।
