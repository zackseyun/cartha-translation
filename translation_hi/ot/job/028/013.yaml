  source_fidelity: ‘मनुष्य उसका मूल्य नहीं जानता’ accurately represents אֱנוֹשׁ, the general-truth force of לֹא יָדַע, and עֶרְכָּהּ. The feminine ‘वह’ appropriately continues the antecedent ‘बुद्धि’ from the context, and ‘नहीं मिलती’ conveys the passive sense of the Niphal verb without adding modality.
