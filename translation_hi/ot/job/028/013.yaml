  yaml_path: translation/ot/job/028/013.yaml
  text: Man does not know its worth[b][a], and it is not found in the land of the living.
translation:
  language: hi
  text: मनुष्य उसका मूल्य[a] नहीं जानता, और वह जीवितों की भूमि में नहीं मिलती।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसकी कीमत” अथवा “उसका मोल।” इब्रानी शब्द किसी वस्तु के आँके हुए मूल्य या महत्त्व को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱנוֹשׁ
  choice: मनुष्य
  rationale: यह एकवचन शब्द नश्वर मानव को प्रतिनिधि रूप में दर्शाता है। ‘मनुष्य’ आधुनिक मानक हिन्दी में इसके एकवचन और सामान्य मानवीय संदर्भ—दोनों को स्वाभाविक रूप से बनाए रखता है।
- source_word: יָדַע
  choice: नहीं जानता
  rationale: यहाँ पूर्ण रूप संदर्भ में एक सामान्य सत्य व्यक्त करता है। ‘नहीं जानता’ मूल क्रिया के ज्ञान-संबंधी अर्थ को रखता है; ‘जान नहीं सकता’ अनावश्यक रूप से असमर्थता जोड़ देता।
- source_word: עֶרְכָּהּ
  choice: उसका मूल्य
  rationale: עֵרֶךְ मूल्यांकन, मूल्य या कीमत को सूचित कर सकता है। ‘मूल्य’ हिन्दी में व्यापक और स्वाभाविक है तथा केवल व्यापारिक कीमत तक अर्थ को सीमित नहीं करता।
- source_word: תִּמָּצֵא
  choice: नहीं मिलती
  rationale: निफ़ाल रूप का निष्क्रिय भाव हिन्दी में ‘नहीं मिलती’ से स्वाभाविक रूप में व्यक्त होता है। स्त्रीलिंग क्रिया का संबंध प्रसंगगत ‘बुद्धि’ से है। ‘मिल नहीं सकती’ मूल में निहित न होने वाला सामर्थ्य-संबंधी भाव जोड़ता।
- source_word: בְּאֶרֶץ הַחַיִּים
  choice: जीवितों की धरती पर
  rationale: यह इब्रानी मुहावरा सांसारिक मानव-जीवन के क्षेत्र को दर्शाता है। ‘जीवितों की धरती’ उसकी काव्यात्मक छवि को बनाए रखता है और हिन्दी में बोधगम्य है।
