  text: भले ही वह वस्त्र तैयार करे[a], धर्मी उन्हें पहनेगा[b], और निर्दोष चाँदी बाँटेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह वस्त्र तैयार करता है, पर धर्मी उन्हें पहनेगा।” इब्रानी अपूर्ण क्रिया का सरल कथनात्मक अनुवाद भी सम्भव है; पिछले पद का प्रसंग यहाँ “भले ही वह वस्त्र तैयार करे” जैसा रियायती भाव सुझाता है।
    reason: lexical_alternative
  - marker: b
    text: “उन्हें” का आशय पिछले पद में उल्लिखित वस्त्रों से है।
    reason: cross_reference
lexical_decisions:
- source_word: יָכִין
  choice: वह उसे तैयार करे
  rationale: 'כון के हिफ़ील रूप का मूल अर्थ ‘तैयार करना’ है। प्रसंग में विधेयात्मक ‘करे’ पूर्ववर्ती पद से मिलने वाला रियायती भाव व्यक्त करता है: दुष्ट भले ही उसे तैयार करे, उसका उपभोग दूसरे करेंगे। ‘उसे’ का आशय पिछले पद में संचित वस्त्र-संपत्ति से है।'
- source_word: צַדִּיק
  choice: धर्मी
  rationale: यह विशेषण संज्ञा के रूप में प्रयुक्त है। ‘धर्मी’ आधुनिक हिन्दी में स्वाभाविक है और इब्रानी के प्रतिनिधिक एकवचन को बनाए रखता है।
- source_word: יִלְבָּשׁ
  choice: उसे पहनेगा
  rationale: לבש का सामान्य अर्थ ‘पहनना’ है। कर्म पिछले पद के वस्त्र से समझा जाता है, इसलिए स्पष्टता हेतु ‘उसे’ जोड़ा गया है।
- source_word: כֶסֶף
  choice: चाँदी
  rationale: כֶּסֶף का अर्थ ‘चाँदी’ अथवा ‘धन’ हो सकता है। पिछले पद में संचित चाँदी के प्रत्यक्ष उल्लेख के कारण यहाँ ‘चाँदी’ अधिक सटीक है।
- source_word: נָקִי
  choice: निर्दोष
  rationale: संज्ञावत प्रयुक्त यह विशेषण दोष या अपराध से मुक्त व्यक्ति को दर्शाता है और दुष्ट के साथ नैतिक विरोध को बनाए रखता है।
- source_word: יַחֲלֹק
  choice: बाँट लेगा
  rationale: חלק का अर्थ ‘बाँटना, भाग करना’ है। ‘बाँट लेगा’ स्वाभाविक हिन्दी में चाँदी को भागों में बाँटने या उसमें हिस्सा लेने का भाव व्यक्त करता है।
