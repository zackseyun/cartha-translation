    issue: The resumed/renewed action of וַיֹּסֶף is not expressed with sufficient clarity.
    rationale: In the draft, ‘फिर’ may be read merely as temporal ‘then,’ while ‘आरम्भ किया’ renders only the speech-taking-up idiom. Placing ‘फिर’ with the action explicitly conveys that Job again resumed his utterance.
  - severity: low
    issue: ‘गंभीर’ adds an unexpressed evaluative qualifier.
    rationale: Although מָשָׁל can introduce a weighty saying, the Hebrew word itself has a broader range. ‘कथन’ preserves that breadth, with alternatives supplied in the note.
