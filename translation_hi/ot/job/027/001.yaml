  text: And Job again took up his discourse and said:[a]
translation:
  language: hi
  text: अय्यूब ने फिर अपना कथन आरम्भ किया और कहा:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपना नीतिवचन,” “अपना दृष्टान्त,” अथवा “अपनी वाणी”; इब्रानी शब्द कई प्रकार के गंभीर या अलंकारिक कथनों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף
  choice: फिर
  rationale: יסף यहाँ infinitive שׂאת के साथ अय्यूब के पुनः बोलने या आगे कथन जोड़ने को व्यक्त करता है। ‘फिर’ सहज हिन्दी में इस पुनरारम्भ को बताता है।
- source_word: אִיּוֹב
  choice: अय्यूब
  rationale: व्यक्तिनाम का हिन्दी बाइबल परम्परा में प्रचलित लिप्यंतरण।
- source_word: שְׂאֵת
  choice: आरम्भ किया
  rationale: נשׂא का मूल अर्थ ‘उठाना’ है, पर שׂאת משל एक मुहावरा है जिसका आशय औपचारिक कथन को उठाने/सुनाने से है। ‘आरम्भ किया’ आधुनिक हिन्दी में स्वाभाविक है, यद्यपि ‘उठाया’ की मूल छवि स्पष्ट नहीं रहती।
- source_word: מְשָׁלוֹ
  choice: अपना गंभीर कथन
  rationale: מָשָׁל नीतिवचन, दृष्टान्त, व्यंग्य-कथन या विस्तृत काव्यात्मक वाणी को सूचित कर सकता है। यहाँ आगे आने वाले विस्तृत भाषण के लिए ‘गंभीर कथन’ उपयुक्त और व्यापक है; शब्द की वास्तविक अर्थ-व्याप्ति पादटिप्पणी में रखी गई है।
- source_word: וַיֹּאמַר
  choice: और कहा
  rationale: אמר के सामान्य कथात्मक रूप का सीधा और गरिमापूर्ण हिन्दी समतुल्य।
