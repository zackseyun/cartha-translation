    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद आगे आने वाली अय्यूब की शपथ-सदृश प्रतिज्ञा का आधार प्रस्तुत करता है; हिंदी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כָל עוֹד
  choice: जब तक ... है
  rationale: यह पदबंध निरंतर अवधि को व्यक्त करता है—जितने समय तक कोई दशा बनी रहती है।
- source_word: נִשְׁמָתִי
  choice: मेरी साँस
  rationale: נשמה यहाँ जीवन बनाए रखने वाली साँस को दर्शाता है और अगले काव्यांश के רוּחַ के समानांतर है।
- source_word: בִי
  choice: मुझ में
  rationale: ב आंतरिक उपस्थिति दर्शाता है; यह चयन इब्रानी बिंब को बनाए रखता है।
- source_word: וְרוּחַ
  choice: और ... प्राण-वायु
  rationale: רוּחַ का अर्थ वायु, साँस या आत्मा हो सकता है। नथनों और जीवित रहने के समानांतर संदर्भ में ‘प्राण-वायु’ ठोस जीवनदायी अर्थ को स्वाभाविक हिंदी में रखती है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: אֱלוֹהַּ
  choice: परमेश्वर
  rationale: यह अय्यूब में प्रचलित एकवचन ईश्वरीय पदनाम है; ‘परमेश्वर’ मानक और गरिमापूर्ण हिंदी रूप है।
- source_word: בְּאַפִּי
  choice: मेरे नथनों में
  rationale: אַף यहाँ शारीरिक अर्थ में नाक अथवा नथने को दर्शाता है; श्वास के बिंब के कारण ‘नथनों में’ उपयुक्त है।
theological_decisions:
