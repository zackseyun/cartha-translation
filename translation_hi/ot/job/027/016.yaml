  text: Though he heaps up silver like dust and prepares clothing like clay[b][a],
translation:
  language: hi
  text: चाहे वह धूल की तरह चाँदी बटोर ले और मिट्टी के ढेरों की तरह वस्त्र तैयार करे[a][b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यदि वह धूल की तरह चाँदी बटोर ले और मिट्टी के ढेरों की तरह वस्त्र तैयार करे।” हिब्रू शब्द אִם का अर्थ “यदि” या “चाहे” दोनों हो सकता है; आसपास के तर्क के प्रवाह में “चाहे” अधिक उपयुक्त है।
    reason: alternative_reading
  - marker: b
    text: “वस्त्र” के लिए “कपड़े” भी अनुवाद किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: चाहे
  rationale: 'काव्यात्मक संदर्भ में यह शब्द साधारण शर्त के बजाय रियायती भाव व्यक्त करता है: दुष्ट इतना धन जुटा भी ले, फिर भी आगे के पद उसकी अस्थिरता बताते हैं।'
- source_word: יִצְבֹּר
  choice: ढेर लगाए
  rationale: क्रिया का अर्थ इकट्ठा करके ढेर लगाना है; यह धूल वाली ठोस उपमा को बनाए रखता है।
- source_word: כֶּעָפָר
  choice: धूल के समान
  rationale: כְּ तुलना प्रकट करता है; यह अतिशयोक्तिपूर्ण प्रचुरता की मूल छवि सुरक्षित रखता है।
- source_word: כָּסֶף
  choice: चाँदी
  rationale: शब्द का मूल अर्थ चाँदी है, यद्यपि वह धन के अर्थ में भी प्रयुक्त हो सकता है; यहाँ काव्यात्मक ठोस छवि को रखा गया है।
- source_word: וְכַחֹמֶר
  choice: और मिट्टी के समान
  rationale: חֹמֶר यहाँ मिट्टी या गारे का बोध करा सकता है; 'मिट्टी' बहुतायत और साधारण उपलब्धता की उपमा के लिए स्वाभाविक है।
- source_word: יָכִין
  choice: तैयार करे
  rationale: हिफ़ील रूप का अर्थ यहाँ तैयार करना या तत्पर रखना है; यह मूल क्रिया के भाव को सीधे व्यक्त करता है।
- source_word: מַלְבּוּשׁ
  choice: वस्त्र
  rationale: यह शब्द पहनावे या कपड़ों को सामूहिक रूप से सूचित करता है; 'वस्त्र' आधुनिक, स्पष्ट और गरिमापूर्ण है।
theological_decisions:
- issue: אִם का शर्तसूचक या रियायती अर्थ
  choice: 'मुख्य पाठ में रियायती अर्थ: ''चाहे'''
  alternative: 'शर्तसूचक अर्थ: ''यदि'''
  rationale: आस-पास के तर्क में दुष्ट के संचय को स्वीकार करके अगले पदों में उसके हाथ से निकल जाने की बात कही गई है; फिर भी हिब्रू की वास्तविक द्विअर्थता पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण काव्यात्मक शैली रखी गई है। 'धूल के समान' और 'मिट्टी के समान' मूल समानांतर बिंबों को बनाए रखते हैं; वाक्य अगले पद में जारी रहने के कारण अंत में अल्पविराम रखा गया है।
