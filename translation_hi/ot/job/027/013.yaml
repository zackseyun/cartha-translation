  yaml_path: translation/ot/job/027/013.yaml
  text: 'This is the portion of a wicked man with God[c][b][a], and the inheritance that the ruthless receive from the Almighty:'
translation:
  language: hi
  text: यह दुष्ट मनुष्य का परमेश्वर के यहाँ भाग है, और निर्दयी लोगों की वह विरासत है जो वे सर्वशक्तिमान से पाते हैं:[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘परमेश्वर के यहाँ’ का अर्थ ‘परमेश्वर से’ भी हो सकता है, अर्थात वह भाग जो परमेश्वर दुष्ट मनुष्य के लिए ठहराता है।
    reason: lexical_alternative
  - marker: b
    text: ‘निर्दयी लोगों’ के स्थान पर ‘हिंसक लोगों’ भी सम्भव है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में शाब्दिक अर्थ ‘लेते हैं’ है; यहाँ भाग और विरासत के प्रसंग के कारण ‘पाते हैं’ किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה
  choice: यही है
  rationale: संकेतवाचक शब्द आगामी कथन को प्रस्तुत करता है; हिन्दी में बलयुक्त ‘यही’ स्वाभाविक है।
- source_word: חֵלֶק
  choice: भाग
  rationale: यह किसी को मिलने वाले हिस्से या परिणाम को व्यक्त करता है और आगे आए ‘विरासत’ से भेद बनाए रखता है।
- source_word: אָדָם רָשָׁע
  choice: दुष्ट मनुष्य
  rationale: एकवचन सामान्य कथन और नैतिक अर्थ दोनों को सीधे व्यक्त करता है।
- source_word: עִם אֵל
  choice: परमेश्वर के पास
  rationale: इब्रानी ‘परमेश्वर के साथ/पास’ को संरक्षित करता है और उस हिस्से का संकेत देता है जो परमेश्वर के यहाँ उसके लिए ठहरा है; ‘परमेश्वर से’ भी प्रसंगानुकूल सम्भव है।
- source_word: נַחֲלַת
  choice: विरासत
  rationale: मिले हुए स्थायी हिस्से का सामान्य और गरिमापूर्ण हिन्दी रूप है।
- source_word: עָרִיצִים
  choice: निर्दयी लोग
  rationale: यह दमनकारी और क्रूर लोगों को सूचित करता है; सामान्य पाठक के लिए स्पष्ट आधुनिक अभिव्यक्ति है।
- source_word: מִשַּׁדַּי
  choice: सर्वशक्तिमान से
  rationale: शद्दाई ईश्वरीय उपाधि है; अर्थानुवाद हिन्दी बाइबलीय प्रयोग में स्वाभाविक है।
- source_word: יִקָּחוּ
  choice: पाते हैं
  rationale: मूल क्रिया शाब्दिक रूप से ‘लेते हैं’ है, पर भाग और विरासत के प्रसंग में ‘पाते हैं’ प्राप्त होने का भाव सहजता से देता है।
theological_decisions:
- issue: עִם אֵל में दुष्ट के भाग और परमेश्वर का सम्बन्ध
  choice: परमेश्वर के पास
  alternative: परमेश्वर से
  rationale: शाब्दिक पूर्वसर्ग ‘साथ/पास’ है, जबकि मुहावरे में परमेश्वर से निर्धारित या प्राप्त भाग समझा जा सकता है। मुख्य पाठ मूल की अस्पष्टता को अधिक सुरक्षित रखता है और पादटिप्पणी वैकल्पिक अर्थ बताती है।
- issue: ईश्वरीय उपाधि שדי
  choice: सर्वशक्तिमान
  alternative: शद्दाई
  rationale: यहाँ उपाधि का अर्थानुवाद किया गया है, निजी नाम के रूप में लिप्यंतरण नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण ज्ञान-साहित्य शैली। समानांतर पदों ‘भाग’ और ‘विरासत’ को अलग रखा गया है। अंतिम द्विबिंदु अगले पदों में खुलने वाली सूची का संकेत देता है।
