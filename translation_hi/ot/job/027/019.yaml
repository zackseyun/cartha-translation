  yaml_path: translation/ot/job/027/019.yaml
  text: He lies down rich[a], but he will not be gathered; he opens his eyes[b], and he is gone.
translation:
  language: hi
  text: धनी लेटता है[a], पर वह इकट्ठा नहीं किया जाएगा; वह अपनी आँखें खोलता है, और वह नहीं रहता[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “धनी लेटता है, पर उसे अपने पूर्वजों के पास इकट्ठा नहीं किया जाएगा”; अधिक सामान्य अर्थ, “उसे इकट्ठा नहीं किया जाएगा,” भी हो सकता है। इब्रानी वाक्य संक्षिप्त है और मृत्यु तथा दफ़न की ओर संकेत कर सकता है, पर इन्हें स्पष्ट रूप से नहीं कहता।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक अर्थ, “और वह नहीं है”; यह उसके चले जाने या फिर न रहने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עָשִׁיר
  choice: धनी व्यक्ति
  rationale: यह विशेषण संज्ञा के रूप में प्रयुक्त है और किसी धनी व्यक्ति को सूचित करता है। हिन्दी में केवल ‘धनी’ भी संभव है, पर ‘धनी व्यक्ति’ साधारण पाठक के लिए अधिक स्वाभाविक और स्पष्ट है।
- source_word: יִשְׁכַּב
  choice: लेट जाता है
  rationale: שׁכב का मूल अर्थ ‘लेटना’ है। वर्तमानकालीन काव्यात्मक वर्णन मूल की सजीवता बनाए रखता है और प्रसंग में भावी परिणाम को भी व्यक्त कर सकता है।
- source_word: וְלֹא יֵאָסֵף
  choice: पर वह इकट्ठा नहीं किया जाएगा
  rationale: निफ़अल रूप का शाब्दिक भाव ‘इकट्ठा किया जाना’ है और यह मृत्यु, दफ़न या अपने लोगों में मिलाए जाने की ओर संकेत कर सकता है। मूल की संक्षिप्तता और अस्पष्टता बनाए रखने के लिए विस्तार नहीं किया गया।
- source_word: עֵינָיו פָּקַח
  choice: वह अपनी आँखें खोलता है
  rationale: मूल शब्दक्रम में ‘उसकी आँखें—उसने खोलीं’ है; स्वाभाविक हिन्दी में कर्तृवाच्य अभिव्यक्ति अचानक घटित परिवर्तन को स्पष्ट रखती है।
- source_word: וְאֵינֶנּוּ
  choice: और वह नहीं रहता
  rationale: शाब्दिक अर्थ ‘और वह नहीं है’ है। ‘वह नहीं रहता’ आधुनिक हिन्दी में उसके मिट जाने या मर जाने का मुहावरेदार भाव देता है, बिना यह तय किए कि यहाँ केवल मृत्यु है या व्यापक अर्थ में लोप।
theological_decisions:
- issue: יֵאָסֵף में मृत्यु/दफ़न का संकेत
  choice: मुख्य पाठ में ‘इकट्ठा नहीं किया जाएगा’ रखकर संकेत को अनिर्णीत छोड़ा गया।
  alternative: ‘अपने पुरखों में नहीं मिलाया जाएगा’ अथवा ‘दफ़न नहीं किया जाएगा’।
  rationale: इब्रानी में कर्म या गंतव्य स्पष्ट नहीं है; किसी विशिष्ट मृत्यु-संबंधी प्रथा को मुख्य पाठ में जोड़ना मूल की वास्तविक अस्पष्टता को समाप्त कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और काव्यात्मक गद्य रखा गया है। ‘इकट्ठा किया जाएगा’ जानबूझकर कुछ असामान्य किंतु स्रोत-सन्निकट है, क्योंकि अधिक सहज विस्तार मूल की मृत्यु और दफ़न-संबंधी अस्पष्टता को सुलझा देता।
