  text: Will God hear his cry when distress comes upon him?[a][b][c]
translation:
  language: hi
  text: क्या परमेश्वर उसकी पुकार सुनेगा, जब उस पर संकट आएगा?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसकी दुहाई’ अथवा ‘उसकी गुहार’।
    reason: lexical_alternative
  - marker: b
    text: या ‘यदि उस पर संकट आए’; इब्रानी संयोजक को शर्तवाचक भी समझा जा सकता है, यद्यपि प्रसंग में ‘जब’ का कालवाचक अर्थ उपयुक्त है।
    reason: alternative_reading
  - marker: c
    text: ‘संकट’ का अनुवाद ‘मुसीबत,’ ‘विपत्ति’ या ‘क्लेश’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצַּעֲקָתוֹ
  choice: उसकी दुहाई
  rationale: צְעָקָה संकट में सहायता के लिए की गई पुकार या गुहार को दर्शाता है। ‘दुहाई’ हिन्दी में ऐसी व्याकुल पुकार का स्वाभाविक और संक्षिप्त रूप है।
- source_word: יִשְׁמַע
  choice: सुनेगा
  rationale: संदर्भ में yiqtol को भविष्यकालिक प्रश्न के रूप में लेना स्वाभाविक है; यह दुष्ट मनुष्य की संकट के समय की पुकार पर परमेश्वर की प्रतिक्रिया के विषय में आलंकारिक प्रश्न है।
- source_word: אֵל
  choice: परमेश्वर
  rationale: אֵל के लिए ‘परमेश्वर’ आधुनिक मानक हिन्दी में स्पष्ट, प्रतिष्ठित और सामान्य बाइबलीय पद है।
- source_word: כִּי
  choice: जब
  rationale: 'यहाँ כִּי को कालवाचक मानने पर वाक्य प्रसंगानुकूल अर्थ देता है: संकट आने के समय। फिर भी इसका शर्तवाचक अर्थ ‘यदि’ सम्भव है, इसलिए उसे पादटिप्पणी में रखा गया है।'
- source_word: תָבוֹא עָלָיו
  choice: उस पर ... आएगा
  rationale: בוא + על का मूल बिंब किसी बात के किसी व्यक्ति पर आने का है; हिन्दी में ‘उस पर संकट आना’ स्वाभाविक प्रयोग है और इब्रानी संरचना को बनाए रखता है।
- source_word: צָרָה
  choice: संकट
  rationale: צָרָה विपत्ति, क्लेश या कठिन परिस्थिति को सूचित करता है। ‘संकट’ अर्थ की व्यापकता और दबाव—दोनों को सहज आधुनिक हिन्दी में व्यक्त करता है।
