id: JOB.27.8
reference: Job 27:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֤י מַה תִּקְוַ֣ת חָ֭נֵף כִּ֣י יִבְצָ֑ע כִּ֤י יֵ֖שֶׁל אֱל֣וֹהַּ נַפְשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/008.yaml
  text: For what is the hope of the godless when God cuts him off[c][b][a], when God takes away his life?
translation:
  language: hi
  text: भक्तिहीन मनुष्य की आशा ही क्या है[a], भले ही वह लाभ कमाए[b], जब परमेश्वर उसका प्राण हर ले[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘कपटी मनुष्य की।’ इब्रानी शब्द श्रद्धाहीन, भक्तिहीन अथवा कपटी व्यक्ति को दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: यह पदबंध कठिन है। इसका अनुवाद ‘जब वह लाभ कमाता है’ भी हो सकता है; क्रिया को ‘काट देना’ या ‘अंत कर देना’ के अर्थ में भी समझा गया है।
    reason: alternative_reading
  - marker: c
    text: शाब्दिक रूप से, ‘उसका प्राण खींच निकाले।’
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּקְוַת
  choice: आशा
  rationale: यह संज्ञा उस बात को व्यक्त करती है जिसकी कोई आशा या अपेक्षा रखता है; अलंकारिक प्रश्न में ‘आशा’ स्वाभाविक और स्पष्ट है।
- source_word: חָנֵף
  choice: भक्तिहीन मनुष्य
  rationale: अय्यूब में यह शब्द सामान्यतः परमेश्वर के प्रति श्रद्धाहीन या धर्मविरुद्ध व्यक्ति को दर्शाता है। ‘भक्तिहीन’ इस धार्मिक-नैतिक भाव को रखता है, जबकि केवल ‘कपटी’ कहना अर्थ को अनावश्यक रूप से संकुचित कर सकता है।
- source_word: יִבְצָע
  choice: वह लाभ कमाए
  rationale: בצע का एक प्रमुख अर्थ लाभ प्राप्त करना, प्रायः अनुचित लाभ कमाना, है। यहाँ कर्ता को भक्तिहीन मनुष्य मानकर रियायती अर्थ ‘भले ही’ दिया गया है; पदबंध की वास्तविक कठिनाई पाद-टिप्पणी में सुरक्षित है।
- source_word: יֵשֶׁל
  choice: हर ले
  rationale: संदर्भ में क्रिया जीवन को निकाल लेने या छीन लेने का भाव देती है। ‘प्राण हर ले’ आधुनिक हिन्दी में स्वाभाविक है और मृत्यु का आशय स्पष्ट करता है।
- source_word: אֱלוֹהַּ
  choice: परमेश्वर
  rationale: यह अय्यूब में परमेश्वर के लिए प्रयुक्त एकवचन काव्यात्मक पद है; ‘परमेश्वर’ इसका सहज हिन्दी समतुल्य है।
- source_word: נַפְשׁוֹ
  choice: उसका प्राण
  rationale: यहाँ נֶפֶשׁ व्यक्ति के जीवन को दर्शाता है, जिसे परमेश्वर मृत्यु के समय ले लेता है। ‘प्राण’ हिन्दी में इस अर्थ को स्वाभाविक रूप से व्यक्त करता है और कोई अनावश्यक तत्त्वमीमांसक निष्कर्ष नहीं जोड़ता।
theological_decisions:
- issue: נֶפֶשׁ का मनुष्य-विज्ञान संबंधी अर्थ
  choice: ‘उसका प्राण’
  alternative: ‘उसकी आत्मा’ या ‘उसका जीवन’
  rationale: यह पद मृत्यु के समय जीवन ले लिए जाने की बात करता है, आत्मा की तत्त्वमीमांसक प्रकृति पर कोई तकनीकी कथन नहीं करता। ‘प्राण’ मूल मुहावरे की व्यापकता बनाए रखता है।
- issue: יִבְצָע के कठिन पदबंध का अर्थ
  choice: भक्तिहीन व्यक्ति के लाभ कमाने पर भी उसकी आशा निष्फल होने का रियायती अर्थ
  alternative: ‘जब वह लाभ कमाता है’ अथवा काट दिए जाने/अंत किए जाने का अर्थ
  rationale: क्रिया का सामान्य अर्थ ‘लाभ कमाना’ है और संदर्भ में ‘भले ही’ अलंकारिक प्रश्न को सुगम बनाता है। फिर भी इब्रानी पदबंध संक्षिप्त और विवादित है, इसलिए वैकल्पिक अर्थ को पाद-टिप्पणी में रखा गया है, न कि चुपचाप निश्चित कर दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘आशा ही क्या है’ अलंकारिक प्रश्न की शक्ति बनाए रखता है। ‘भक्तिहीन मनुष्य’ धार्मिक-नैतिक अर्थ देता है, जबकि ‘कपटी’ को वैकल्पिक अर्थ के रूप में पाद-टिप्पणी में सुरक्षित किया गया है।
