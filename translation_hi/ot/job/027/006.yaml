  yaml_path: translation/ot/job/027/006.yaml
  text: I hold fast to my righteousness and will not let it go[b][a]; my heart does not reproach me for any of my days.
translation:
  language: hi
  text: मैं अपनी धार्मिकता को दृढ़ता से थामे हुए हूँ और उसे नहीं छोड़ूँगा[a]; मेरा हृदय मेरे जीवन के किसी भी दिन मुझे धिक्कारता नहीं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपनी खराई को।’ इब्रानी शब्द का सामान्य अर्थ ‘धार्मिकता’ है, पर अय्यूब की पुस्तक में इसमें व्यक्तिगत खराई का भाव भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘मेरा हृदय जीवन भर मुझे ताना नहीं देता।’ इब्रानी में अंतर्मन के आत्म-धिक्कार का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצִדְקָתִי
  choice: अपनी धार्मिकता पर
  rationale: צְדָקָה का मूल अर्थ धार्मिकता या सही ठहरना है। अय्यूब के प्रसंग में यह व्यक्तिगत खराई से जुड़ता है, पर ‘धार्मिकता’ इसके नैतिक और न्यायिक बल को बेहतर बनाए रखता है।
- source_word: הֶחֱזַקְתִּי
  choice: दृढ़ बना हूँ
  rationale: חזק का हिफ़ील रूप यहाँ किसी बात को मजबूती से थामे रहने का भाव देता है। हिंदी में यह प्रयोग अय्यूब के अब तक के दृढ़ आग्रह और वर्तमान संकल्प दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְלֹא אַרְפֶּהָ
  choice: और उसे नहीं छोड़ूँगा
  rationale: רפה के हिफ़ील का अर्थ ढीला छोड़ना या जाने देना है; स्त्रीलिंग प्रत्यय ‘धार्मिकता’ की ओर संकेत करता है। यह हिंदी वाक्यांश अर्थ और संकल्प दोनों स्पष्ट करता है।
- source_word: לֹא יֶחֱרַף לְבָבִי
  choice: मेरा हृदय मुझे धिक्कारता नहीं
  rationale: חרף में धिक्कारने, ताना देने या निंदा करने का भाव है। ‘हृदय’ को बनाए रखने से इब्रानी रूपक सुरक्षित रहता है और ‘विवेक’ जैसी व्याख्यात्मक संज्ञा आरोपित नहीं होती।
- source_word: מִיָּמָי
  choice: मेरे किसी भी दिन के लिए
  rationale: निषेध के साथ מן + ימים का आशय जीवन के दिनों में से किसी दिन या किसी समय को लेकर आत्म-धिक्कार न होना है। यह अनुवाद उस व्यापक निषेध को स्पष्ट रखते हुए मूल अभिव्यक्ति के निकट है।
theological_decisions:
- issue: צִדְקָה को ‘धार्मिकता’ कहा जाए या ‘खराई’।
  choice: धार्मिकता
  alternative: खराई
  rationale: ‘धार्मिकता’ संज्ञा के सामान्य नैतिक-न्यायिक अर्थ को बनाए रखती है। अय्यूब के प्रसंग में ‘खराई’ संभव है, इसलिए उसे पादटिप्पणी में दिया गया है; मुख्य पाठ में उसे रखने से दावे का बल अनावश्यक रूप से कम हो सकता था।
- issue: हृदय के धिक्कारने को अंतःकरण की दोषभावना के रूप में स्पष्ट किया जाए या मूल रूपक रखा जाए।
  choice: मेरा हृदय मुझे धिक्कारता नहीं
  alternative: मेरा विवेक मुझे दोषी नहीं ठहराता
  rationale: मूल में ‘हृदय’ और חרף का तीखा धिक्कार/निंदा वाला शब्द है। मूल रूपक रखने से आत्म-आरोप का अर्थ मिलता है, पर उसे केवल बाद की तकनीकी ‘विवेक’ की धारणा में सीमित नहीं किया जाता।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। ‘हृदय’ जैसे मूल रूपक को सुरक्षित रखा गया है; ‘धिक्कारता’ חרף की तीव्रता व्यक्त करता है। मुख्य पाठ और दोनों पादटिप्पणियों के चिह्न परस्पर संगत हैं।
