lexical_decisions:
- source_word: הֵן
  choice: देखो
  rationale: यह ध्यान खींचने वाला emphatic उद्गार है; ‘देखो’ आधुनिक हिन्दी में स्वाभाविक रूप से उसका बल बनाए रखता है।
- source_word: אַתֶּם כֻּלְּכֶם
  choice: तुम सब
  rationale: सर्वनाम और ‘तुम सब’ का संयुक्त प्रयोग दूसरे पुरुष बहुवचन की व्यापकता और जोर को व्यक्त करता है।
- source_word: חֲזִיתֶם
  choice: ने यह देखा है
  rationale: חזה प्रत्यक्ष देखने या समझने का भाव रख सकता है। पूर्ण वर्तमान रूप बताता है कि श्रोता इस वास्तविकता को पहले ही देख चुके हैं; हिन्दी में आवश्यक कर्म ‘यह’ संदर्भगत रूप से जोड़ा गया है।
- source_word: וְלָמָּה זֶּה
  choice: फिर तुम क्यों इस तरह
  rationale: וְלָמָּה पूर्व कथन से निष्कर्षात्मक प्रश्न उठाता है, और זֶּה यहाँ ढंग या तीव्रता की ओर संकेत करता है। ‘फिर…क्यों इस तरह’ दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: הֶבֶל תֶּהְבָּלוּ
  choice: व्यर्थ हो जाते हो
  rationale: संज्ञा הֶבֶל और उसी मूल के क्रियापद תֶּהְבָּלוּ का जोरदार शब्द-खेल हिन्दी में हूबहू नहीं आता। यह चयन ‘व्यर्थ/निष्फल होना’ का मूल अर्थ रखता है और इसे केवल वाणी या आचरण तक सीमित नहीं करता।
