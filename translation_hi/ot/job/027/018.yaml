translation:
  language: hi
  text: 'वह अपना घर पतंगे के घर-सा बनाता है,[a]

    और उस अस्थायी झोंपड़ी-सा, जिसे रखवाला बनाता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मकड़ी के जाले-सा।” इब्रानी शब्द का सामान्य अर्थ “पतंगा” है, पर कुछ व्याख्याएँ इसे “मकड़ी” से संबंधित मानती हैं।
    reason: textual_lexical_alternative
lexical_decisions:
- source_word: בָּנָה
  choice: बनाता है
  rationale: काव्यात्मक कथन में पूर्ण क्रिया दुष्ट के सामान्य आचरण को बताती है; इसलिए वर्तमानकाल स्वाभाविक है।
- source_word: כָעָשׁ
  choice: पतंगे के घर-सा
  rationale: עָשׁ का सामान्य अर्थ 'पतंगा' है। केवल 'पतंगे-सा' कहने से घर बनाने का कर्ता पतंगा प्रतीत हो सकता है; 'पतंगे के घर-सा' आशय को स्पष्ट करते हुए उसकी नाजुकता का बिंब बनाए रखता है।
- source_word: בֵּיתוֹ
  choice: अपना घर
  rationale: समानांतर 'छप्पर' और निर्माण-सूचक क्रियाएँ यहाँ वास्तविक आवास की ओर संकेत करती हैं; प्रतिवर्ती स्वामित्व के लिए हिन्दी में 'अपना' स्वाभाविक है।
- source_word: וּכְסֻכָּה
  choice: और उस छप्पर-सा
  rationale: סֻכָּה अस्थायी झोंपड़ी या आश्रय है। 'छप्पर' खेत में बनाए गए हल्के, अस्थायी आश्रय के बिंब को सहज हिन्दी में व्यक्त करता है।
- source_word: עָשָׂה
  choice: बनाता है
  rationale: पहली क्रिया की तरह इसे भी सामान्य वर्तमान में रखा गया है; हिन्दी में 'छप्पर बनाता है' स्वाभाविक है।
- source_word: נֹצֵר
  choice: रखवाला
  rationale: यह participle पहरा देने या रक्षा करने वाले व्यक्ति को दर्शाता है; कृषि-परिवेश में 'रखवाला' सहज और पर्याप्त व्यापक है।
