  register: भाषा आधुनिक, dignified और सामान्य पाठक के लिए स्पष्ट रखी गई है। पद की संक्षिप्त और कठोर काव्यात्मक समानता बनाए रखने के लिए अर्धविराम प्रयुक्त है; कोई सांप्रदायिक व्याख्या नहीं जोड़ी गई।
