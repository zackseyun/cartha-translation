base_translation:
  language: en
  yaml_path: translation/ot/job/027/014.yaml
  text: If his sons multiply[a], it is for the sword, and his descendants will not be satisfied with bread.
translation:
  language: hi
  text: यदि उसके पुत्र बहुत हो जाएँ, तो वे तलवार के लिए हैं; और उसके वंशज रोटी से तृप्त न होंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם
  choice: यदि
  rationale: यह शर्तसूचक उपवाक्य आरम्भ करता है; ‘यदि’ पद की शर्तात्मक संरचना और उसकी वास्तविक अस्पष्टता को बनाए रखता है।
- source_word: יִרְבּוּ בָנָיו
  choice: उसके पुत्र बहुत हो जाएँ
  rationale: רבה यहाँ संख्या में बढ़ने या बहुत होने का भाव देता है, और בָּנָיו स्पष्ट रूप से ‘उसके पुत्र’ है। यह हिन्दी में स्वाभाविक रहते हुए मूल अर्थ के निकट है।
- source_word: לְמוֹ חָרֶב
  choice: वे तलवार के लिए हैं
  rationale: לְמוֹ का सम्बन्ध पुत्रों से मानकर यह वाक्य उनके तलवार द्वारा मारे जाने के लिए नियत होने का संक्षिप्त, कठोर चित्र बनाए रखता है; ‘तलवार’ को ‘हिंसक मृत्यु’ कहकर व्याख्यायित नहीं किया गया।
- source_word: וְצֶאֱצָאָיו
  choice: और उसके वंशज
  rationale: צֶאֱצָאִים पुत्रों से अधिक व्यापक रूप में आगे की संतान या वंश को दर्शाता है; ‘वंशज’ आधुनिक मानक हिन्दी में उपयुक्त है।
- source_word: לֹא יִשְׂבְּעוּ לָחֶם
  choice: रोटी से तृप्त न होंगे
  rationale: שׂבע का मूल भाव पेट भरने या तृप्त होने का है और לֶחֶם का ठोस चित्र ‘रोटी’ है। यह अभाव का आशय व्यक्त करता है, पर उसे केवल ‘पर्याप्त भोजन न मिलेगा’ में नहीं बदलता।
theological_decisions: []
