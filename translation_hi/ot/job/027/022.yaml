  text: וְ/יַשְׁלֵ֣ךְ עָ֭לָי/ו וְ/לֹ֣א יַחְמֹ֑ל מִ֝/יָּד֗/וֹ בָּר֥וֹחַ יִבְרָֽח׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/022.yaml
  text: He hurls at him and does not spare[b][a]; he surely flees from his hand.
translation:
  language: hi
  text: वह उस पर प्रहार करता है[a] और उसे नहीं बख्शता; वह उसके हाथ से ज़रूर भागता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह उस पर फेंकता है।” इब्रानी क्रिया का मूल अर्थ “फेंकना/डालना” है; यहाँ यह हिंसक आक्रमण का चित्र प्रस्तुत कर सकती है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में एक ही धातु को दोहराकर बल दिया गया है, शाब्दिक रूप से, “भागते हुए वह भागता है”; इसका अर्थ “वह अवश्य भागता है” या “वह तेज़ी से भागता है” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיַשְׁלֵךְ עָלָיו
  choice: वह उस पर प्रहार करता है
  rationale: שׁלך का मूल अर्थ ‘फेंकना/डालना’ है। עָלָיו के साथ यहाँ शत्रुतापूर्ण और हिंसक कार्रवाई का भाव है। हिन्दी में बिना व्यक्त कर्म के ‘उस पर फेंकता है’ अधूरा और अस्पष्ट लगता है, इसलिए ‘प्रहार करता है’ प्रसंगानुकूल और स्वाभाविक है; वैकल्पिक अधिक शाब्दिक अर्थ पाद-टिप्पणी में रखा गया है। कर्ता को ‘वह’ ही रखा गया है ताकि इब्रानी की संदर्भगत अस्पष्टता बनी रहे।
- source_word: וְלֹא יַחְמֹל
  choice: और उसे नहीं बख्शता
  rationale: חמל में दया करने अथवा किसी को छोड़ देने—दोनों का भाव हो सकता है। दण्ड के इस प्रसंग में ‘नहीं बख्शता’ संक्षिप्त, स्वाभाविक और अर्थपूर्ण है।
- source_word: מִיָדוֹ
  choice: उसके हाथ से
  rationale: יָד का मूल अर्थ ‘हाथ’ है और यहाँ उससे शक्ति या वश का भाव भी निकल सकता है। शाब्दिक बिंब को हिन्दी में सुरक्षित रखा गया है।
- source_word: בָּרוֹחַ יִבְרָח
  choice: ज़रूर भागता है
  rationale: धातु ברח के क्रियार्थक संज्ञारूप और उसी धातु की रूपित क्रिया का मेल क्रिया पर बल देता है। ‘ज़रूर भागता है’ इस बल को सहज हिन्दी में व्यक्त करता है, जबकि ‘जल्दी’ या ‘बेतहाशा’ जोड़ना अधिक व्याख्यात्मक होता।
theological_decisions:
- issue: पहली क्रिया का कर्ता
  choice: केवल ‘वह’ रखा गया है
  alternative: ‘परमेश्वर’ अथवा ‘पूर्वी हवा’ को स्पष्ट कर्ता बनाना
  rationale: इब्रानी पद में कर्ता का नाम नहीं है। निकटवर्ती संदर्भ पूर्वी हवा की ओर संकेत कर सकता है, जबकि न्याय का व्यापक प्रसंग परमेश्वर को निहित कर्ता समझने की गुंजाइश देता है। अनुवाद किसी एक संभावना को अनावश्यक रूप से निश्चित नहीं करता।
- issue: दोनों खंडों में सर्वनामों का संदर्भ
  choice: ‘वह/उसके’ की अस्पष्टता सुरक्षित रखी गई है
  alternative: कर्ता और भागने वाले व्यक्ति के नाम या पहचान जोड़ना
  rationale: मूल पाठ सर्वनामों से काम लेता है; नाम जोड़ने से पाठ की वास्तविक संदर्भगत जटिलता मिट जाती।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किन्तु सहज रूप अपनाया गया है। ‘बख्शता’ सामान्य पाठक के लिए स्वाभाविक है और न्याय के प्रसंग की कठोरता बनाए रखता है। सर्वनाम जानबूझकर स्पष्ट नामों से नहीं बदले गए हैं।
