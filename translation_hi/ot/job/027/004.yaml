translation:
  language: hi
  text: 'मेरे होंठ अन्याय की बात नहीं कहेंगे,[a]

    और न मेरी जीभ छल की बात बोलेगी।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में दृढ़ इनकार व्यक्त करने के लिए ‘यदि’ (אִם) वाली शपथ-जैसी रचना है। शाब्दिक रूप से, “यदि मेरे होंठ अन्याय की बात कहें...,” अर्थात, “मेरे होंठ निश्चय ही अन्याय की बात नहीं कहेंगे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: नहीं कहेंगे / न ... बोलेगी
  rationale: यहाँ אִם साधारण शर्त नहीं, बल्कि शपथ-जैसी दृढ़ नकारात्मक प्रतिज्ञा व्यक्त करता है; स्वाभाविक हिन्दी में इसे स्पष्ट निषेध से व्यक्त किया गया है।
- source_word: תְּדַבֵּרְנָה
  choice: कहेंगे
  rationale: דבר के पिएल रूप का अर्थ ‘बोलना/कहना’ है। अपूर्ण क्रिया यहाँ अय्यूब के दृढ़ भावी संकल्प को व्यक्त करती है; बहुवचन ‘होंठ’ के साथ ‘कहेंगे’ स्वाभाविक है।
- source_word: שְׂפָתַי
  choice: मेरे होंठ
  rationale: मूल का शारीरिक बिंब और ‘जीभ’ के साथ काव्यात्मक समानांतरता बनाए रखी गई है।
- source_word: עַוְלָה
  choice: अन्याय की बात
  rationale: עַוְלָה नैतिक अन्याय या गलत बात को सूचित करता है। वाणी के प्रसंग में ‘अन्याय की बात’ सहज है और अगले चरण के ‘छल’ से भिन्नता भी बनाए रखता है।
- source_word: וּלְשׁוֹנִי
  choice: और न मेरी जीभ
  rationale: पहले खंड का नकारात्मक बल वाव के साथ दूसरे खंड में जारी रहता है; ‘और न’ हिन्दी में समानांतर निषेध को स्पष्ट करता है।
- source_word: יֶהְגֶּה
  choice: बोलेगी
  rationale: הגה का अर्थ प्रसंगानुसार बुदबुदाना, उच्चारण करना या मनन करना हो सकता है। ‘जीभ’ कर्ता और ‘छल’ कर्म होने के कारण यहाँ वाणी व्यक्त करने वाला सामान्य ‘बोलेगी’ स्वाभाविक है।
- source_word: רְמִיָּה
  choice: छल की बात
  rationale: רְמִיָּה छल, कपट या धोखे को सूचित करता है। ‘छल की बात’ आधुनिक हिन्दी में स्पष्ट है और पहले खंड के ‘अन्याय’ से अर्थगत अंतर रखता है।
