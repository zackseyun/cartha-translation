  text: Far be it from me to declare you right[a]; until I die[b], I will not remove my integrity from myself.
translation:
  language: hi
  text: ऐसा मुझसे कदापि न हो कि मैं तुम्हें सही ठहराऊँ[a]! जब तक मैं मर न जाऊँ, मैं अपनी खराई को अपने से दूर न करूँगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तुम्हें निर्दोष ठहराऊँ’ अथवा ‘तुम्हारे पक्ष को सही घोषित करूँ।’ इब्रानी क्रिया का यहाँ न्यायिक अर्थ है—किसी को सही पक्ष में घोषित करना।
    reason: lexical_alternative
  - marker: b
    text: ‘खराई’ का अनुवाद ‘निर्दोषता’ या ‘निष्कलंकता’ भी हो सकता है। यहाँ इब्रानी शब्द अय्यूब के आत्मपक्ष में उसकी नैतिक अखंडता का बोध देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה לִּי
  choice: यह मुझसे कदापि न हो
  rationale: यह मुहावरा किसी बात के प्रबल निषेध और उससे घृणापूर्वक इनकार को व्यक्त करता है; यह हिन्दी रूप उस बल को स्वाभाविक और गरिमापूर्ण ढंग से रखता है।
- source_word: אִם אַצְדִּיק אֶתְכֶם
  choice: कि मैं तुम्हें सही ठहराऊँ
  rationale: צדק के हिफ़ील रूप का यहाँ न्यायिक अर्थ किसी को सही पक्ष में घोषित करना है। ‘सही ठहराऊँ’ सामान्य पाठक के लिए स्पष्ट है और अनावश्यक पारिभाषिक धार्मिक अर्थ नहीं जोड़ता।
- source_word: עַד אֶגְוָע
  choice: जब तक मैं मर न जाऊँ
  rationale: גוע का अर्थ प्राण छोड़ना या मरना है; यह रूप सहज, स्पष्ट और प्रसंगानुकूल गंभीर है।
- source_word: לֹא אָסִיר
  choice: दूर न करूँगा
  rationale: סור के हिफ़ील का ठोस अर्थ हटाना या दूर करना है; यह चुनाव मूल रूपक को बनाए रखता है।
- source_word: תֻּמָּתִי
  choice: अपनी खराई
  rationale: תֻּמָּה अय्यूब के आत्मपक्ष में नैतिक अखंडता या निर्दोष आचरण का बोध देता है। ‘खराई’ पूर्ण पापहीनता का दावा किए बिना इस भाव को संक्षेप और स्वाभाविक रूप से व्यक्त करती है।
- source_word: מִמֶּנִּי
  choice: अपने से
  rationale: इब्रानी में प्रथम पुरुष के साथ वही प्रथम पुरुष संबंध फिर आने से आत्म-संबंधी बल बनता है; ‘अपने से’ इसे हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: अय्यूब की नैतिक दशा के दावे का स्वरूप
  choice: תֻּמָּתִי को ‘अपनी खराई’ के रूप में प्रस्तुत किया गया।
  alternative: अपनी निर्दोषता / अपनी निष्कलंकता
  rationale: अय्यूब अपने मित्रों के आरोप को स्वीकार करने से इनकार कर रहा है और अपनी नैतिक अखंडता पर दृढ़ है। ‘खराई’ इस तनाव को बनाए रखती है, पर इसे पूर्ण पापहीनता या किसी बाद की धर्मशास्त्रीय श्रेणी में नहीं बदलती।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, विवाद-प्रसंग के अनुकूल शैली रखी गई है। ‘कदापि’ प्रबल निषेध को व्यक्त करता है, जबकि शेष वाक्यरचना सामान्य पाठक के लिए स्पष्ट है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
