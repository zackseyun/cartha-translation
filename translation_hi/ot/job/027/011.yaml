  yaml_path: translation/ot/job/027/011.yaml
  text: I will teach you concerning the hand of God[b][a]; what is with the Almighty I will not hide.
translation:
  language: hi
  text: मैं तुम्हें परमेश्वर के हाथ के विषय में सिखाऊँगा[a]; जो कुछ सर्वशक्तिमान के पास है, उसे मैं नहीं छिपाऊँगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर के हाथ के बारे में।” यह वाक्यांश परमेश्वर की सामर्थ्य, उसके कार्य या उसके व्यवहार की ओर संकेत कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “जो सर्वशक्तिमान का है,” “सर्वशक्तिमान की सम्मति,” अथवा “जो सर्वशक्तिमान की ओर से है।” इब्रानी अभिव्यक्ति संक्षिप्त है और उसमें कुछ शब्द अध्याहृत हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: אוֹרֶה
  choice: मैं ... सिखाऊँगा
  rationale: ירה के हिफ़ील अपूर्ण, प्रथम पुरुष एकवचन का यहाँ शिक्षात्मक अर्थ है। अय्यूब अपने श्रोताओं को आगे शिक्षा देने की घोषणा करता है।
- source_word: אֶתְכֶם
  choice: तुम्हें
  rationale: यह द्वितीय पुरुष पुल्लिंग बहुवचन कर्मवाचक सर्वनाम है; आधुनिक हिन्दी में ‘तुम्हें’ स्वाभाविक है।
- source_word: בְּיַד אֵל
  choice: परमेश्वर के हाथ के विषय में
  rationale: ב को यहाँ साधन के बजाय शिक्षा की विषयवस्तु बताने वाला समझा गया है। ‘हाथ’ का रूपक बनाए रखने से परमेश्वर की सामर्थ्य, कार्य और व्यवहार की व्यापक धारणा सुरक्षित रहती है।
- source_word: אֵל
  choice: परमेश्वर
  rationale: אֵל यहाँ ईश्वर के नाम/उपाधि के रूप में प्रयुक्त है; ‘परमेश्वर’ मानक और गरिमापूर्ण हिन्दी रूप है।
- source_word: אֲשֶׁר עִם שַׁדַּי
  choice: जो कुछ सर्वशक्तिमान के पास है
  rationale: इब्रानी वाक्यांश संक्षिप्त और कुछ हद तक अध्याहृत है। यह रूप उसकी व्यापकता को बनाए रखता है और उसे केवल ‘परामर्श’, ‘योजना’ या ‘न्याय’ तक सीमित नहीं करता।
- source_word: שַׁדַּי
  choice: सर्वशक्तिमान
  rationale: अय्यूब में שַׁדַּי के लिए यह प्रचलित और अर्थपूर्ण हिन्दी उपाधि है।
- source_word: לֹא אֲכַחֵד
  choice: मैं नहीं छिपाऊँगा
  rationale: כחד के पिएल रूप का यहाँ अर्थ ‘छिपाना’ या ‘गुप्त रखना’ है; ‘नहीं छिपाऊँगा’ स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: ‘परमेश्वर का हाथ’ द्वारा व्यक्त ईश्वरीय क्रियाशीलता
  choice: ‘परमेश्वर के हाथ’ का रूपक बनाए रखा गया।
  alternative: ‘परमेश्वर की सामर्थ्य’ अथवा ‘परमेश्वर के कार्य’
  rationale: मूल रूपक सामर्थ्य, क्रिया और व्यवहार के कई पहलुओं को समेटता है; किसी एक व्याख्या तक सीमित करना उचित नहीं।
- issue: दूसरे उपवाक्य में सर्वशक्तिमान से संबंधित बात
  choice: ‘जो कुछ सर्वशक्तिमान के पास है’
  alternative: ‘सर्वशक्तिमान की सम्मति’, ‘सर्वशक्तिमान की योजना’, अथवा ‘सर्वशक्तिमान की ओर से जो है’
  rationale: मूल इब्रानी संक्षिप्त और अर्थ की दृष्टि से व्यापक है। चुना हुआ पाठ इस अनिश्चितता को यथासंभव सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण स्तर रखा गया है। ‘हाथ’ के बाइबिलीय रूपक तथा दूसरे उपवाक्य की मूल अर्थगत व्यापकता को सुरक्षित रखा गया है।
