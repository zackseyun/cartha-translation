  text: He claps his hands at him and hisses at him from his place[a][b].
translation:
  language: hi
  text: वह उसकी ओर ताली बजाता है और अपने स्थान से उसकी ओर फुफकारता है[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसकी ओर सीटी बजाता है।” इब्रानी क्रिया सीटी बजाने या फुफकारने—दोनों का अर्थ दे सकती है; यहाँ शत्रुतापूर्ण भाव के कारण “फुफकारता है” रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी में कर्ता स्पष्ट नहीं है: “वह ताली बजाता है ... और फुफकारता है।” इसे परमेश्वर, दूसरे लोग, या कोई अवैयक्तिक शक्ति समझा जा सकता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: יִשְׂפֹּק
  choice: तालियाँ बजाता है
  rationale: שׂפק के साथ כפים हाथों को आपस में मारने की ठोस क्रिया दर्शाता है। हिंदी में ‘तालियाँ बजाता है’ स्वाभाविक है और उपहास, विजय या विस्मय में से किसी एक भाव को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: עָלֵימוֹ
  choice: उस पर
  rationale: על के साथ पुरुषवाचक प्रत्यय यहाँ लक्ष्य किए गए व्यक्ति को दर्शाता है। ‘उस पर’ शत्रुतापूर्ण संकेत की दिशा बनाए रखता है।
- source_word: כַּפֵּימוֹ
  choice: तालियाँ
  rationale: כף का मूल अर्थ हथेली या हाथ है; इस मुहावरे में हिंदी की स्वाभाविक अभिव्यक्ति ‘तालियाँ बजाना’ हाथों को आपस में मारने की क्रिया स्पष्ट करती है।
- source_word: וְיִשְׁרֹק
  choice: फुफकारता है
  rationale: שרק सीटी बजाने या फुफकारने की ध्वनि बता सकता है। न्याय और तिरस्कार के इस संदर्भ में ‘फुफकारता है’ शत्रुतापूर्ण स्वर व्यक्त करता है; ‘सीटी बजाता है’ को पादटिप्पणी में विकल्प के रूप में रखा गया है।
- source_word: עָלָיו
  choice: उस पर
  rationale: यह फिर उसी व्यक्ति की ओर किए गए ध्वन्यात्मक संकेत को दर्शाता है; ‘उस पर’ मूल की पुनरावृत्ति और दिशा दोनों बनाए रखता है।
- source_word: מִמְּקֹמוֹ
  choice: अपने स्थान से
  rationale: מקום का व्यापक अर्थ ‘स्थान’ है। ‘अपने स्थान से’ कर्ता के स्थान को व्यक्त करता है और उसे निवास, आसन या किसी खास जगह के रूप में सीमित नहीं करता।
theological_decisions:
- issue: पद में कर्ता की पहचान
  choice: अव्यक्त एकवचन पुल्लिंग कर्ता को ‘वह’ के रूप में रखा गया है।
  alternative: कर्ता को परमेश्वर, दूसरे लोग, पूर्वी पवन या कोई अवैयक्तिक शक्ति मानना।
  rationale: इब्रानी में क्रियाएँ तीसरे पुरुष एकवचन पुल्लिंग में हैं, पर स्पष्ट कर्ता नहीं दिया गया। निकटवर्ती संदर्भ में कई संभावनाएँ हैं; इसलिए अनुवाद किसी एक पहचान को निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘तालियाँ बजाता है’ हिंदी का स्वाभाविक मुहावरा है; ‘फुफकारता है’ तिरस्कारपूर्ण ध्वनि को व्यक्त करता है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
