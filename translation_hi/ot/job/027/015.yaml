  yaml_path: translation/ot/job/027/015.yaml
  text: Those who survive him will be buried by death[a], and his widows will not weep.
translation:
  language: hi
  text: उसके बचे हुए लोग मृत्यु के द्वारा दफ़नाए जाएँगे[a], और उसकी विधवाएँ नहीं रोएँगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मृत्यु में दफ़नाए जाएँगे।” इब्रानी वाक्यांश संक्षिप्त है और दफ़नाए जाने के ढंग अथवा परिणाम को, या मृत्यु के बीच दफ़नाए जाने को व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרִידוֹ
  choice: उसके बचे हुए लोग
  rationale: एकवचन रूप पर तीसरे पुरुष एकवचन का प्रत्यय है, पर इसके साथ बहुवचन क्रिया आई है; इसलिए इसे सामूहिक अर्थ में ‘उसके बचे हुए लोग’ कहना स्वाभाविक और स्रोत-संगत है।
- source_word: בַּמָּוֶת
  choice: मृत्यु के द्वारा
  rationale: בְּ यहाँ परिस्थिति या साधन-जैसा अर्थ दे सकता है। ‘मृत्यु के द्वारा’ इब्रानी की कठोर, संक्षिप्त अभिव्यक्ति को बनाए रखता है, जबकि ‘मृत्यु में’ भी संभव है।
- source_word: יִקָּבֵרוּ
  choice: दफ़नाए जाएँगे
  rationale: קבר का निफ़अल अपूर्ण रूप निष्क्रिय अर्थ ‘दफ़नाए जाएँगे’ देता है। यह आधुनिक मानक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: וְאַלְמְנֹתָיו
  choice: और उसकी विधवाएँ
  rationale: אַלְמָנָה का अर्थ ‘विधवा’ है; बहुवचन तथा तीसरे पुरुष एकवचन प्रत्यय को सीधे और स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: לֹא תִבְכֶּינָה
  choice: नहीं रोएँगी
  rationale: בכה का मूल अर्थ ‘रोना’ है। यह ‘शोक मनाना’ की अपेक्षा अधिक सटीक है और स्त्रीलिंग बहुवचन क्रिया को भी दर्शाता है।
