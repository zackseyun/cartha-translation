base_translation:
  language: en
  yaml_path: translation/ot/job/027/007.yaml
  text: May my enemy be like the wicked[a], and the one who rises against me like the unrighteous.
translation:
  language: hi
  text: मेरा शत्रु दुष्ट के समान हो, और जो मेरे विरुद्ध उठ खड़ा होता है, वह अन्यायी के समान हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהִי
  choice: हो
  rationale: היה का क़ाल आज्ञार्थक/इच्छार्थक रूप यहाँ इच्छा या धिक्कार व्यक्त करता है; हिंदी में प्रसंगानुसार ‘हो’ इस भाव को स्वाभाविक और संक्षिप्त ढंग से व्यक्त करता है।
- source_word: כְרָשָׁע
  choice: दुष्ट के समान
  rationale: उपसर्ग כְּ तुलना सूचित करता है और רָשָׁע नैतिक रूप से दुष्ट व्यक्ति को दर्शाता है; ‘दुष्ट के समान’ तुलना और एकवचन व्यक्ति-संज्ञा दोनों को सुरक्षित रखता है।
- source_word: אֹיְבִי
  choice: मेरा शत्रु
  rationale: אויב पर प्रथम पुरुष एकवचन प्रत्यय है; ‘मेरा शत्रु’ सीधा और आधुनिक मानक हिंदी रूप है।
- source_word: וּמִתְקוֹמְמִי
  choice: और जो मेरे विरुद्ध उठता है
  rationale: קום से बना यह कृदन्त वक्ता के विरुद्ध स्वयं को खड़ा करने वाले व्यक्ति का चित्र देता है; विस्तृत हिंदी रूप केवल ‘विरोधी’ कहने की अपेक्षा मूल की क्रियात्मक छवि बनाए रखता है।
- source_word: כְעַוָּל
  choice: अन्यायी के समान
  rationale: עַוָּל अन्याय या गलत आचरण से पहचाने जाने वाले व्यक्ति को दर्शाता है; ‘अन्यायी’ नैतिक अर्थ को स्पष्ट रखता है और ‘दुष्ट’ के साथ समानांतरता बनाए रखता है।
theological_decisions:
- issue: वाक्य का इच्छार्थक/धिक्कारसूचक बल
  choice: दोनों खंडों में ‘हो’ के द्वारा इच्छा/धिक्कार व्यक्त किया गया
  alternative: इसे साधारण भविष्यवाणी या तथ्य-वचन के रूप में प्रस्तुत करना
  rationale: יְהִי का इच्छार्थक रूप वक्ता की कामना या धिक्कार व्यक्त करता है; अनुवाद इसे भविष्यवाणी बनाकर तनाव को समाप्त नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘जो मेरे विरुद्ध उठता है’ मूल इब्रानी की सजीव विरोधात्मक छवि को बनाए रखता है।
