source:
  edition: WLC
  text: חַי אֵ֭ל הֵסִ֣יר מִשְׁפָּטִ֑/י וְ֝/שַׁדַּ֗י הֵמַ֥ר נַפְשִֽׁ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/002.yaml
  text: As God lives[a], who has taken away my justice, and the Almighty, who has made my soul bitter[b],
translation:
  language: hi
  text: जीवित परमेश्वर की शपथ[a], जिसने मेरा न्याय मुझसे छीन लिया, और सर्वशक्तिमान की शपथ, जिसने मेरे प्राण को कड़वा कर दिया[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “परमेश्वर जीवित है।” यह परमेश्वर के जीवन की दुहाई देकर खाई गई शपथ का सूत्र है।
    reason: idiom_clarification
  - marker: b
    text: या “जिसने मेरे जीवन को कड़वा कर दिया” अथवा “जिसने मुझे कड़वा कर दिया।” इब्रानी נֶפֶשׁ का अर्थ प्रसंग के अनुसार ‘प्राण,’ ‘जीवन’ या स्वयं व्यक्ति हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי אֵל
  choice: जीवित परमेश्वर की शपथ
  rationale: यह इब्रानी शपथ-सूत्र है। हिंदी में यह रूप उसके शपथात्मक बल को स्वाभाविक और स्पष्ट ढंग से व्यक्त करता है; केवल ‘जीवित परमेश्वर’ कहना इसे वर्णन बना सकता था।
- source_word: אֵל
  choice: परमेश्वर
  rationale: यहाँ אֵל ईश्वर के लिए सामान्य उपाधि है; आधुनिक मानक हिंदी में ‘परमेश्वर’ गरिमापूर्ण और सुबोध है।
- source_word: הֵסִיר
  choice: छीन लिया
  rationale: हिफ़ील रूप का अर्थ ‘हटा देना/ले लेना’ है। प्रसंग में अय्यूब का आरोप है कि उसे मिलने वाला न्याय उससे वंचित कर दिया गया; ‘छीन लिया’ इस शिकायत की तीव्रता व्यक्त करता है।
- source_word: מִשְׁפָּטִי
  choice: मेरा न्याय
  rationale: מִשְׁפָּט न्याय, अधिकार, निर्णय अथवा न्यायोचित दावा दर्शा सकता है। ‘मेरा न्याय’ मूल की अर्थगत व्यापकता को बनाए रखता है।
- source_word: וְשַׁדַּי
  choice: और सर्वशक्तिमान की शपथ
  rationale: שַׁדַּי को उपाधि मानकर अनूदित किया गया है। दूसरे समानांतर खंड में हिंदी की स्पष्टता हेतु शपथ-सूत्र दोहराया गया है।
- source_word: הֵמַר
  choice: कड़वाहट से भर दिया
  rationale: इसका मूल अर्थ ‘कड़वा करना’ है। चुना हुआ रूप ठोस रूपक को बनाए रखते हुए स्वाभाविक हिंदी देता है।
- source_word: נַפְשִׁי
  choice: मेरे प्राण
  rationale: נֶפֶשׁ का अर्थ प्राण, जीवन या स्वयं व्यक्ति हो सकता है। काव्यात्मक संदर्भ में ‘मेरे प्राण’ इब्रानी अभिव्यक्ति की व्यापकता और भावात्मक गरिमा को सुरक्षित रखता है।
theological_decisions:
- issue: אֵל और שַׁדַּי जैसी ईश्वरीय उपाधियों का रूप
  choice: परमेश्वर ... सर्वशक्तिमान
  alternative: एल ... शद्दाई
  rationale: ये यहाँ नामों के बजाय ईश्वरीय उपाधियाँ हैं; अर्थानुवाद सामान्य हिंदी पाठक के लिए अर्थ स्पष्ट रखते हुए गंभीर समानांतरता को बनाए रखता है।
- issue: अय्यूब के कथन में परमेश्वर पर लगाए गए आरोप की तीव्रता
  choice: जिसने मेरा न्याय मुझसे छीन लिया
  alternative: जिसने मेरे मामले का निर्णय टाल दिया
  rationale: मूल पाठ परमेश्वर के कार्य के विषय में अय्यूब का तीखा और धर्मवैचारिक रूप से तनावपूर्ण दावा प्रस्तुत करता है। अनुवाद इसे नरम करके या उसका बचाव जोड़कर मूल तनाव को हल नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी में काव्यात्मक, गंभीर और शपथात्मक शैली रखी गई है। पद अगले पदों में जारी वाक्य का आरंभ है, इसलिए अंत में अल्पविराम रखा गया है। ‘जीवित परमेश्वर की शपथ’ सहज हिंदी में शपथ-सूत्र को स्पष्ट करता है; समानांतरता और स्पष्टता के लिए दूसरे खंड में ‘की शपथ’ दोहराया गया है।
