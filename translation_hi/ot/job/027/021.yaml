  text: The east wind carries him away[a], and he is gone; it sweeps him away from his place.
translation:
  language: hi
  text: पूर्वी हवा उसे उठा ले जाती है, और वह चला जाता है; वह उसे उसके स्थान से झकझोरकर उड़ा ले जाती है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह उसे उसके स्थान से तूफानी वेग से उड़ा ले जाती है।”
    reason: סער के तूफानी, हिंसक बल को व्यक्त करने वाला शाब्दिक-व्याख्यात्मक विकल्प।
lexical_decisions:
- source_word: יִשָּׂאֵהוּ
  choice: उसे उठा ले जाती है
  rationale: נשׂא का मूल भाव ‘उठाना, ढोना, ले जाना’ है। हवा के संदर्भ में ‘उठा ले जाती है’ बलपूर्वक हटाए जाने का चित्र स्वाभाविक हिंदी में बनाए रखता है।
- source_word: קָדִים
  choice: पुरवाई
  rationale: קָדִים यहाँ विनाशकारी पूर्वी हवा को दर्शाता है। ‘पुरवाई’ आधुनिक हिंदी में पूर्व दिशा से आने वाली हवा का संक्षिप्त और काव्यात्मक नाम है।
- source_word: וְיֵלַךְ
  choice: और वह चला जाता है
  rationale: הלך का सीधा अर्थ ‘जाना’ है। यह रूप मूल की क्रिया और उसके परिणाम—उस व्यक्ति का वहाँ से चले जाना—दोनों को सहज रूप में रखता है।
- source_word: וִישָׂעֲרֵהוּ
  choice: वह उसे ... उड़ा ले जाती है
  rationale: סער में तूफानी वेग से घुमाने या झोंककर हटाने का भाव है। ‘उड़ा ले जाती है’ हिंदी में हवा द्वारा हिंसक ढंग से हटाए जाने को स्वाभाविक रूप से व्यक्त करता है; अधिक स्पष्ट तूफानी विकल्प पादटिप्पणी में रखा गया है।
- source_word: מִמְּקֹמוֹ
  choice: उसके स्थान से
  rationale: מקום का सीधा अर्थ ‘स्थान’ है। यह चुनाव मूल की संक्षिप्तता और कविता के समानांतर विन्यास को बनाए रखता है।
