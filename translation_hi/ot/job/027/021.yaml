  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘पुरवाई’ सामान्य हिंदी में बोधगम्य है और ‘पूर्वी हवा’ की अपेक्षा पद्य में अधिक सहज बैठती है। दोनों अर्धपंक्तियों में हवा ही कर्ता है; दूसरे अर्ध में स्त्रीलिंग ‘वह’ उसी पुरवाई की ओर संकेत करता है।
